<section class="panel" id="rlc-simu">
<div class="sim-wrapper">
  <h2>Simulateur RLC</h2>
  <p class="lead">Manipule \(R\), \(L\), \(C\) et observe les régimes. Le badge de couleur t'indique le régime en cours.</p>
  
  <div class="mode-switch">
    <button class="active" data-mode="libre">Régime libre</button>
    <button data-mode="echelon">Réponse à un échelon</button>
    <button data-mode="forced">Régime forcé (Bode)</button>
  </div>
  
  <div id="regime-display" class="regime-badge">—</div>
  
  <div class="sim-controls">
    <div class="control">
      <label>R (Ω)</label>
      <input type="range" id="R" min="0.5" max="200" step="0.5" value="20">
      <span class="value" id="R-val">20 Ω</span>
    </div>
    <div class="control">
      <label>L (mH)</label>
      <input type="range" id="L" min="1" max="200" step="1" value="50">
      <span class="value" id="L-val">50 mH</span>
    </div>
    <div class="control">
      <label>C (µF)</label>
      <input type="range" id="C" min="0.1" max="100" step="0.1" value="10">
      <span class="value" id="C-val">10 µF</span>
    </div>
    <div class="control" id="freq-ctrl" style="display:none">
      <label>f excitation (Hz)</label>
      <input type="range" id="F" min="10" max="2000" step="5" value="225">
      <span class="value" id="F-val">225 Hz</span>
    </div>
  </div>
  
  <canvas id="sim-canvas"></canvas>
  
  <div class="sim-info">
    <div><span class="lbl">ω₀</span><span id="info-w0">—</span></div>
    <div><span class="lbl">f₀</span><span id="info-f0">—</span></div>
    <div><span class="lbl">Q</span><span id="info-Q">—</span></div>
    <div><span class="lbl">τ ou Δω</span><span id="info-tau">—</span></div>
  </div>
</div>
</section>
