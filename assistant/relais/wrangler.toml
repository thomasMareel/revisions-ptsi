# Relais de l'assistant IA (docs/assistant-ia.md, assistant/MISE-EN-SERVICE.md).
# AUCUN SECRET ICI : ce fichier est public. Les secrets (ANTHROPIC_API_KEY, ASSISTANT_CODE,
# JETON_CLE) se saisissent dans le tableau de bord Cloudflare (Workers › revisions-assistant ›
# Settings › Variables and Secrets) ou par « npx wrangler secret put NOM », jamais dans le dépôt.
name = "revisions-assistant"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Sites autorisés à appeler le relais (CORS)
ORIGINES = "https://thomasmareel.github.io,http://localhost:8765"
MODELE = "claude-sonnet-5-5"
MODELE_APPROFONDI = "claude-opus-5-5"
BUDGET_JOUR_USD = "1.50"
DUREE_JETON_JOURS = "30"
DEBIT_MINUTE = "20"

# Compteurs (budget du jour, débit, tentatives de code) : créer l'espace avec
# « npx wrangler kv namespace create COMPTEURS » et recopier ici l'id affiché.
[[kv_namespaces]]
binding = "COMPTEURS"
id = "A_REMPLACER_PAR_L_ID_DU_NAMESPACE"
