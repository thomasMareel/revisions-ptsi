<div class="course-section">
  <div class="sec-num">§1 · COURBES PARAMÉTRÉES</div>
  <h2>Un point qui se déplace</h2>
  <div class="intro">Une courbe paramétrée décrit la trajectoire d'un point mobile : à chaque valeur du paramètre \(t\) (souvent un temps), on associe une position \(M(t)\). Ce point de vue, familier en physique et en SI, permet de décrire des courbes qui ne sont pas des graphes de fonctions : boucles, pointes, branches qui se recoupent.</div>

  <p>Le plan est rapporté à un repère orthonormé direct \((O ; \vec\imath, \vec\jmath)\), et on identifie un point à ses coordonnées.</p>
  <div class="def-box">
    Soit \(I\) un intervalle de \(\mathbb{R}\) et \(x, y : I \to \mathbb{R}\) deux fonctions de classe \(C^1\). L'application \(t \mapsto M(t) = \big(x(t), y(t)\big)\) est une <strong>courbe paramétrée</strong> (ou arc paramétré) de classe \(C^1\) du plan. On dit que \(t\) est le <strong>paramètre</strong>, \(M(t)\) le point de paramètre \(t\), et que
    $$\begin{cases} x = x(t) \\ y = y(t) \end{cases} \qquad t \in I$$
    est une <strong>représentation paramétrique</strong>. L'ensemble \(\Gamma = \{M(t),\ t \in I\}\) des points atteints est le <strong>support</strong> de la courbe. Dans l'espace, on ajoute une troisième coordonnée \(z(t)\) : les définitions des §1 et §2 s'appliquent sans changement.
  </div>
  <p>Le <strong>vecteur dérivé</strong> \(\overrightarrow{M'(t)} = \big(x'(t), y'(t)\big)\), dérivée de \(t \mapsto \overrightarrow{OM(t)}\), est la <strong>vitesse</strong> du point mobile si \(t\) est le temps, et \(\overrightarrow{M''(t)}\) son <strong>accélération</strong> (chapitre Fonctions vectorielles). On dérive coordonnée par coordonnée.</p>

  <h3>Courbe et support : deux objets différents</h3>
  <p>Une courbe paramétrée est un <em>mouvement</em> ; son support n'en garde que la <em>trace</em>. Plusieurs mouvements peuvent laisser la même trace :</p>
  <ul>
    <li>\(t \mapsto (\cos t, \sin t)\) et \(t \mapsto (\cos 2t, \sin 2t)\), pour \(t \in [0, 2\pi]\), ont tous deux pour support le cercle unité, mais le second en fait deux fois le tour, deux fois plus vite ;</li>
    <li>\(t \mapsto \left(\dfrac{1-t^2}{1+t^2}, \dfrac{2t}{1+t^2}\right)\), \(t \in \mathbb{R}\), décrit le même cercle privé du point \((-1, 0)\), par des fractions rationnelles ;</li>
    <li>le graphe d'une fonction \(f\) de classe \(C^1\) est le support de \(t \mapsto \big(t, f(t)\big)\) : les courbes paramétrées généralisent les graphes ;</li>
    <li>la droite passant par \(A\) dirigée par \(\vec u \neq \vec 0\) est le support de \(t \mapsto A + t\,\vec u\) ; l'ellipse d'équation \(\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1\), celui de \(t \mapsto (a\cos t, b\sin t)\).</li>
  </ul>
  <p>Si \(\varphi : J \to I\) est une bijection de classe \(C^1\) dont la dérivée ne s'annule pas, \(u \mapsto M\big(\varphi(u)\big)\) est un autre paramétrage du même support : c'est un <strong>changement de paramètre</strong>. Le support est parcouru dans le même sens si \(\varphi' \gt 0\), en sens inverse si \(\varphi' \lt 0\).</p>

  <h3>Un lieu géométrique</h3>
  <p>Le programme suggère d'amener l'étude d'une courbe par la recherche d'un <strong>lieu géométrique</strong> : l'ensemble des positions d'un point construit à partir d'un point mobile. La démarche consiste à paramétrer le point mobile, puis à exprimer le point construit en fonction du même paramètre.</p>
  <div class="method-box">
    <strong>Exemple — le lieu des projetés de O sur les tangentes d'un cercle</strong>
    <p>Soit \(\mathcal{C}\) le cercle de centre \(\Omega(-1, 0)\) et de rayon 1 (il passe par \(O\)). Pour \(P \in \mathcal{C}\), on note \(H\) le projeté orthogonal de \(O\) sur la tangente à \(\mathcal{C}\) en \(P\). On cherche le lieu de \(H\).</p>
    <ol>
      <li>On paramètre le point qui pilote la construction : \(P(t) = \Omega + (\cos t, \sin t)\), soit \(P(t) = (-1 + \cos t, \sin t)\), pour \(t \in [-\pi, \pi]\).</li>
      <li>La tangente en \(P\) est perpendiculaire au rayon \([\Omega P]\), dirigé par le vecteur unitaire \(\vec u(t) = (\cos t, \sin t)\). C'est donc l'ensemble des points \(M\) tels que \(\overrightarrow{PM} \cdot \vec u = 0\).</li>
      <li>Le projeté de \(O\) sur cette droite est \(H = O + \lambda\vec u\), où \(\lambda\) est choisi pour que \(H\) soit sur la droite, c'est-à-dire \(\lambda = \overrightarrow{OP}\cdot\vec u\) :
      $$\lambda = (-1 + \cos t)\cos t + \sin^2 t = 1 - \cos t.$$</li>
      <li>Le lieu cherché est donc le support de la courbe
      $$H(t) = \big((1-\cos t)\cos t,\ (1-\cos t)\sin t\big), \qquad t \in [-\pi, \pi].$$
      Quand \(P\) arrive en \(O\) (\(t = 0\)), \(H\) est en \(O\) ; quand \(P\) est diamétralement opposé (\(t = \pi\)), \(H = (-2, 0)\). Cette courbe, une <strong>cardioïde</strong>, est étudiée complètement au §6.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · TANGENTE ET POINTS RÉGULIERS</div>
  <h2>La tangente, position limite des cordes</h2>
  <div class="intro">La tangente en un point est la droite que « vise » la corde \([M(t_0)M(t)]\) quand \(M(t)\) se rapproche de \(M(t_0)\). Là où la vitesse n'est pas nulle, elle est simplement dirigée par le vecteur dérivé ; ailleurs, il faut aller chercher une dérivée d'ordre supérieur.</div>

  <div class="def-box">
    On suppose que \(M(t) \neq M(t_0)\) pour \(t \neq t_0\) voisin de \(t_0\). La courbe admet une <strong>tangente</strong> en \(M(t_0)\) s'il existe un vecteur unitaire \(\vec v(t)\) dirigeant la corde \([M(t_0)M(t)]\) qui admet une limite \(\vec w\) quand \(t \to t_0\). La tangente est alors la droite passant par \(M(t_0)\) et dirigée par \(\vec w\).
  </div>
  <p>Le vecteur \(\vec v(t)\) vaut \(\pm\dfrac{\overrightarrow{M(t_0)M(t)}}{M(t_0)M(t)}\) : on peut changer son signe d'un côté de \(t_0\). C'est la <em>droite</em> \(\big(M(t_0)M(t)\big)\) qui doit avoir une position limite, pas le sens de la corde.</p>

  <div class="def-box">
    Le point \(M(t_0)\) est <strong>régulier</strong> si \(\overrightarrow{M'(t_0)} \neq \vec 0\), <strong>stationnaire</strong> (on dit aussi singulier) si \(\overrightarrow{M'(t_0)} = \vec 0\). La courbe est <strong>régulière</strong> si tous ses points sont réguliers. En un point régulier, \(\overrightarrow{M'(t_0)}\) est un <strong>vecteur tangent</strong>.
  </div>
  <div class="prop-box">
    <strong>Tangente en un point régulier.</strong> En un point régulier, la courbe admet une tangente, dirigée par \(\overrightarrow{M'(t_0)}\). Elle a pour paramétrage \(\lambda \mapsto M(t_0) + \lambda\,\overrightarrow{M'(t_0)}\) et, dans le plan, pour équation :
    <div class="formula" data-nom="Équation de la tangente">$$\begin{vmatrix} x - x(t_0) & x'(t_0) \\ y - y(t_0) & y'(t_0) \end{vmatrix} = 0 \iff y'(t_0)\big(x - x(t_0)\big) - x'(t_0)\big(y - y(t_0)\big) = 0.$$</div>
    La tangente est horizontale si \(y'(t_0) = 0\) (et \(x'(t_0) \neq 0\)), verticale si \(x'(t_0) = 0\) (et \(y'(t_0) \neq 0\)). La <strong>normale</strong>, perpendiculaire à la tangente en \(M(t_0)\), a pour équation
    <div class="formula" data-nom="Équation de la normale">$$x'(t_0)\big(x - x(t_0)\big) + y'(t_0)\big(y - y(t_0)\big) = 0.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi la corde normalisée tend-elle vers la direction de \(\overrightarrow{M'(t_0)}\) ?</span>
    <div class="content"><p>Par définition de la dérivée,
    $$\overrightarrow{M(t_0)M(t)} = (t - t_0)\big(\overrightarrow{M'(t_0)} + \vec\varepsilon(t)\big), \qquad \vec\varepsilon(t) \underset{t \to t_0}{\longrightarrow} \vec 0.$$ Comme \(\overrightarrow{M'(t_0)} \neq \vec 0\), le vecteur entre parenthèses est non nul pour \(t\) proche de \(t_0\) : en particulier \(M(t) \neq M(t_0)\). Le vecteur unitaire
    $$\vec v(t) = \frac{\overrightarrow{M'(t_0)} + \vec\varepsilon(t)}{\big\|\overrightarrow{M'(t_0)} + \vec\varepsilon(t)\big\|}$$
    dirige la corde (il en diffère d'un facteur de même signe que \(t - t_0\)), et tend vers \(\overrightarrow{M'(t_0)}/\|\overrightarrow{M'(t_0)}\|\). La tangente existe et est dirigée par \(\overrightarrow{M'(t_0)}\). L'équation traduit la colinéarité de \(\overrightarrow{M(t_0)M}\) et \(\overrightarrow{M'(t_0)}\) par la nullité de leur déterminant.</p></div>
  </div>

  <div class="prop-box">
    <strong>Tangente en un point stationnaire.</strong> Si \(M\) est de classe \(C^k\) et si l'une des dérivées \(\overrightarrow{M^{(j)}(t_0)}\), \(1 \leq j \leq k\), est non nulle, notons \(p\) le plus petit entier \(j \geq 1\) tel que \(\overrightarrow{M^{(j)}(t_0)} \neq \vec 0\). La courbe admet en \(M(t_0)\) une tangente dirigée par \(\overrightarrow{M^{(p)}(t_0)}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Même idée, avec la formule de Taylor-Young.</span>
    <div class="content"><p>Les dérivées d'ordre \(1\) à \(p-1\) sont nulles, donc la formule de Taylor-Young (coordonnée par coordonnée) donne
    $$\overrightarrow{M(t_0)M(t_0+h)} = \frac{h^p}{p!}\big(\overrightarrow{M^{(p)}(t_0)} + \vec\varepsilon(h)\big), \qquad \vec\varepsilon(h) \underset{h \to 0}{\longrightarrow} \vec 0.$$
    On conclut comme pour un point régulier, en normalisant le vecteur entre parenthèses.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — tangentes à la cardioïde du §1</strong>
    <p>On développe : \(x(t) = \cos t - \cos^2 t\) et \(y(t) = \sin t - \tfrac{1}{2}\sin 2t\).</p>
    <ol>
      <li>Dérivées : \(x'(t) = -\sin t + 2\sin t\cos t\) et \(y'(t) = \cos t - \cos 2t\). Avec \(\cos 2t = 2\cos^2 t - 1\), on factorise :
      $$x'(t) = \sin t\,(2\cos t - 1), \qquad y'(t) = (1 - \cos t)(1 + 2\cos t).$$</li>
      <li>En \(t = \pi/2\) : \(M = (0, 1)\) et \(\overrightarrow{M'} = (-1, 1)\). La tangente a pour équation \(1\cdot(x - 0) - (-1)(y - 1) = 0\), soit \(x + y = 1\).</li>
      <li>Points stationnaires sur \([-\pi, \pi]\) : \(y'(t) = 0\) donne \(\cos t = 1\) ou \(\cos t = -\tfrac12\), soit \(t = 0\) ou \(t = \pm\tfrac{2\pi}{3}\) ; mais \(x'(\pm\tfrac{2\pi}{3}) = \mp\sqrt3 \neq 0\). Seul \(M(0) = O\) est stationnaire.</li>
      <li>En \(t = 0\) : \(x''(0) = 1\) et \(y''(0) = 0\), donc \(\overrightarrow{M''(0)} = (1, 0) \neq \vec 0\). La tangente en \(O\) existe : c'est l'axe \((Ox)\). L'allure de la courbe en ce point (une pointe) est étudiée au §6.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'en un point stationnaire il n'y a pas de tangente, ou qu'il y a forcément un « angle ». La régularité est une propriété du <em>paramétrage</em> : \(t \mapsto (t^3, t^3)\) décrit la droite \(y = x\), qui a évidemment une tangente en \(O\), bien que \(\overrightarrow{M'(0)} = \vec 0\). Inversement, ne jamais écrire une « équation de tangente » avec un vecteur dérivé nul : il ne dirige rien.</div>

  <h3>Orientation</h3>
  <div class="def-box">
    <strong>Orienter</strong> une courbe régulière, c'est choisir en chaque point, de façon continue, un vecteur unitaire dirigeant la tangente ; de façon équivalente, c'est choisir un sens de parcours. Le choix usuel est le sens des \(t\) croissants, avec le vecteur unitaire tangent \(\vec T(t) = \dfrac{\overrightarrow{M'(t)}}{\|\overrightarrow{M'(t)}\|}\).
  </div>
  <p>Un changement de paramètre \(t = \varphi(u)\) conserve l'orientation si \(\varphi' \gt 0\) et l'inverse si \(\varphi' \lt 0\) (par exemple \(u \mapsto M(-u)\)). L'orientation joue un rôle dans le chapitre suivant : le signe de la courbure en dépend.</p>

  <h3>Courbes de l'espace</h3>
  <p>Pour \(t \mapsto M(t) = \big(x(t), y(t), z(t)\big)\), tout ce qui précède reste vrai, sauf l'équation unique de la tangente : une droite de l'espace se décrit par un paramétrage ou par deux équations. Par exemple, l'hélice \(M(t) = (\cos t, \sin t, t/2)\) a pour vecteur dérivé \((-\sin t, \cos t, 1/2)\), jamais nul : elle est régulière. En \(t = 0\), la tangente est \(\lambda \mapsto (1, \lambda, \lambda/2)\), c'est-à-dire la droite d'équations \(x = 1\), \(z = y/2\). Les courbes tracées sur une surface sont étudiées au chapitre Surfaces.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · RÉDUIRE LE DOMAINE D'ÉTUDE</div>
  <h2>Périodicité et symétries</h2>
  <div class="intro">Avant tout calcul de dérivée, on compare \(M(t)\) à \(M(t')\) pour un \(t'\) bien choisi (\(-t\), \(t + T/2\), \(\pi - t\), \(1/t\)…). Chaque relation simple traduit une transformation géométrique (symétrie, rotation) : on n'étudie qu'un morceau de la courbe, et on obtient le reste en appliquant cette transformation au tracé.</div>

  <div class="prop-box">
    <strong>Relations usuelles.</strong> Pour tout \(t\) du domaine (supposé symétrique par rapport à 0 dans les quatre derniers cas) :
    <ul>
      <li>si \(M(t + T) = M(t)\) (\(x\) et \(y\) \(T\)-périodiques), on étudie sur un intervalle de longueur \(T\) ;</li>
      <li>si \(x\) est paire et \(y\) impaire, \(M(-t)\) est le symétrique de \(M(t)\) par rapport à l'axe \((Ox)\) : on étudie pour \(t \geq 0\), puis on complète par cette symétrie ;</li>
      <li>si \(x\) est impaire et \(y\) paire : symétrie par rapport à l'axe \((Oy)\) ;</li>
      <li>si \(x\) et \(y\) sont impaires : symétrie de centre \(O\) ;</li>
      <li>si \(x(-t) = y(t)\) et \(y(-t) = x(t)\) : symétrie par rapport à la droite \(y = x\).</li>
    </ul>
    Plus généralement, toute relation \(M\big(\psi(t)\big) = s\big(M(t)\big)\), où \(\psi\) échange deux parties du domaine et \(s\) est une isométrie, divise le travail d'autant. En notant \(z(t) = x(t) + i\,y(t)\), une relation \(z\big(t + \tfrac{2\pi}{3}\big) = e^{2i\pi/3}z(t)\) traduit une rotation de centre \(O\) et d'angle \(\tfrac{2\pi}{3}\) : c'est le cas de \(z(t) = 2e^{it} + e^{-2it}\), courbe à trois pointes qu'on étudie sur un intervalle de longueur \(\tfrac{2\pi}{3}\).
  </div>

  <div class="method-box">
    <strong>Méthode — réduire le domaine d'étude</strong>
    <ol>
      <li>Déterminer le domaine de définition et une période commune à \(x\) et \(y\), s'il en existe une.</li>
      <li>Comparer \(M(-t)\) à \(M(t)\) (parité de chaque coordonnée), puis \(M(t + T/2)\), \(M(T/2 - t)\)… à \(M(t)\).</li>
      <li>Pour chaque relation, faire un petit dessin pour identifier la transformation, et vérifier que l'image de l'intervalle réduit recouvre bien la partie retirée.</li>
      <li>Après l'étude sur l'intervalle réduit, tracer l'arc obtenu, puis appliquer les transformations dans l'ordre inverse de celui des réductions.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — une courbe de Lissajous</strong>
    <p>On étudie \(x(t) = \sin 2t\), \(y(t) = \sin 3t\).</p>
    <ol>
      <li>\(x\) est \(\pi\)-périodique et \(y\) est \(\tfrac{2\pi}{3}\)-périodique : \(2\pi\) est une période commune. On étudie sur \([0, 2\pi]\).</li>
      <li>\(x(t + \pi) = x(t)\) et \(y(t + \pi) = \sin(3t + 3\pi) = -y(t)\) : \(M(t + \pi)\) est le symétrique de \(M(t)\) par rapport à \((Ox)\). On étudie sur \([0, \pi]\), le reste s'obtient par cette symétrie.</li>
      <li>\(x(\pi - t) = -\sin 2t = -x(t)\) et \(y(\pi - t) = \sin(3\pi - 3t)\), qui vaut \(\sin 3t = y(t)\) : \(M(\pi - t)\) est le symétrique de \(M(t)\) par rapport à \((Oy)\), et \(t \mapsto \pi - t\) envoie \([0, \pi/2]\) sur \([\pi/2, \pi]\). On étudie sur \([0, \pi/2]\).</li>
      <li>Sur \([0, \pi/2]\) : \(x'(t) = 2\cos 2t\) s'annule en \(\pi/4\), \(y'(t) = 3\cos 3t\) en \(\pi/6\) et \(\pi/2\) ; jamais en même temps, donc pas de point stationnaire. \(x\) croît de 0 à 1 puis décroît jusqu'à 0 ; \(y\) croît de 0 à 1 puis décroît jusqu'à \(-1\). Tangente horizontale en \(M(\pi/6) = (\tfrac{\sqrt3}{2}, 1)\) et en \(M(\pi/2) = (0, -1)\), verticale en \(M(\pi/4) = (1, \tfrac{\sqrt2}{2})\).</li>
      <li>On trace cet arc, puis son symétrique par rapport à \((Oy)\), puis le symétrique de l'ensemble par rapport à \((Ox)\). Au passage, \(M(0) = M(\pi) = O\) : l'origine est un <strong>point double</strong>, traversé avec deux tangentes différentes, dirigées par \(\overrightarrow{M'(0)} = (2, 3)\) et \(\overrightarrow{M'(\pi)} = (2, -3)\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§4 · ÉTUDE LOCALE PAR DÉVELOPPEMENTS LIMITÉS</div>
  <h2>Tangente et allure au voisinage d'un point</h2>
  <div class="intro">Au voisinage d'un point \(M(t_0)\), un développement limité de \(M(t_0 + h)\) dit tout : la direction de la tangente, le côté de cette tangente où se trouve la courbe, et si le point mobile rebrousse chemin. C'est l'outil indispensable en un point stationnaire, et pour repérer les points d'inflexion.</div>

  <p>Si \(M\) est de classe \(C^k\) au voisinage de \(t_0\), la formule de Taylor-Young appliquée à chaque coordonnée (chapitre Fonctions vectorielles) donne :</p>
  <div class="formula" data-nom="Développement limité d'une courbe">$$\overrightarrow{M(t_0)M(t_0+h)} = h\,\overrightarrow{M'(t_0)} + \frac{h^2}{2}\,\overrightarrow{M''(t_0)} + \cdots + \frac{h^k}{k!}\,\overrightarrow{M^{(k)}(t_0)} + o(h^k).$$</div>
  <p>En pratique, on calcule les développements limités de \(x(t_0+h)\) et \(y(t_0+h)\), puis on regroupe les termes selon les puissances de \(h\) :</p>
  <div class="formula">$$\overrightarrow{M(t_0)M(t_0+h)} = h\,\vec a_1 + h^2\,\vec a_2 + \cdots + h^k\,\vec a_k + o(h^k).$$</div>

  <div class="def-box">
    Les <strong>entiers caractéristiques</strong> de la courbe en \(M(t_0)\) sont, quand ils existent :
    <ul>
      <li>\(p\) : le plus petit entier tel que \(\vec a_p \neq \vec 0\) ;</li>
      <li>\(q\) : le plus petit entier \(q \gt p\) tel que \((\vec a_p, \vec a_q)\) soit libre.</li>
    </ul>
    De façon équivalente, \(\overrightarrow{M^{(p)}(t_0)}\) est la première dérivée non nulle et \(\overrightarrow{M^{(q)}(t_0)}\) la première qui ne lui est pas colinéaire. Le point est dit <strong>birégulier</strong> si \((p, q) = (1, 2)\), c'est-à-dire si \(\big(\overrightarrow{M'(t_0)}, \overrightarrow{M''(t_0)}\big)\) est libre.
  </div>

  <div class="prop-box">
    <strong>Allure locale.</strong> Notons \(\vec a = \vec a_p\) et \(\vec b = \vec a_q\). Dans le repère \(\big(M(t_0) ; \vec a, \vec b\big)\), les coordonnées \(\big(X(h), Y(h)\big)\) de \(M(t_0 + h)\) vérifient
    $$X(h) \underset{h\to0}{\sim} h^p, \qquad Y(h) \underset{h\to0}{\sim} h^q.$$
    La tangente est dirigée par \(\vec a\), et la parité de \(p\) et \(q\) donne l'allure :
    <ul>
      <li>\(p\) impair, \(q\) pair : <strong>point ordinaire</strong> (la courbe traverse la normale et reste du côté de \(\vec b\) par rapport à la tangente) ;</li>
      <li>\(p\) impair, \(q\) impair : <strong>point d'inflexion</strong> ;</li>
      <li>\(p\) pair, \(q\) impair : <strong>rebroussement de 1ʳᵉ espèce</strong> ;</li>
      <li>\(p\) pair, \(q\) pair : <strong>rebroussement de 2ᵉ espèce</strong>.</li>
    </ul>
  </div>

  <div class="def-box">
    <strong>Définitions géométriques.</strong> Le point \(M(t_0)\) est un <strong>point d'inflexion</strong> si la courbe y <em>traverse</em> sa tangente tout en poursuivant sa route dans le même sens. C'est un <strong>point de rebroussement</strong> si la courbe y fait demi-tour : les deux demi-arcs (\(t \lt t_0\) et \(t \gt t_0\)) partent du même côté de la normale, tangents à la même demi-droite ; de <strong>1ʳᵉ espèce</strong> s'ils sont de part et d'autre de la tangente, de <strong>2ᵉ espèce</strong> s'ils sont du même côté.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">D'où viennent les équivalents \(X \sim h^p\), \(Y \sim h^q\), et la règle des parités ?</span>
    <div class="content"><p>Pour \(p \lt k \lt q\), \(\vec a_k\) est colinéaire à \(\vec a\) (sinon \(q\) serait plus petit) : \(\vec a_k = \lambda_k \vec a\). Les termes d'ordre \(k \gt q\) se décomposent sur \((\vec a, \vec b)\) et sont des \(o(h^q)\). Il reste
    $$X(h) = h^p + \lambda_{p+1}h^{p+1} + \cdots + o(h^p) \sim h^p, \qquad Y(h) = h^q + o(h^q) \sim h^q.$$
    Au voisinage de 0, \(X(h)\) a le signe de \(h^p\) et \(Y(h)\) celui de \(h^q\). Si \(p\) est impair, \(X\) change de signe avec \(h\) : la courbe traverse la normale (elle passe d'un côté à l'autre de \(M(t_0)\) le long de la tangente) ; si \(p\) est pair, \(X\) garde son signe : les deux demi-arcs sont du même côté de la normale, c'est un rebroussement. De même, \(q\) impair signifie que la courbe traverse la tangente, \(q\) pair qu'elle reste d'un même côté. Les quatre combinaisons donnent les quatre allures.</p></div>
  </div>
  <p>En un point régulier, \(p = 1\) : on ne peut avoir qu'un point ordinaire ou une inflexion, jamais de rebroussement. En un point birégulier, la courbe est localement du côté de \(\overrightarrow{M''(t_0)}\) par rapport à sa tangente : l'accélération pointe vers la concavité.</p>

  <div class="method-box">
    <strong>Méthode — étude locale en \(M(t_0)\)</strong>
    <ol>
      <li>Poser \(t = t_0 + h\) et développer \(x(t_0 + h)\) et \(y(t_0 + h)\), jusqu'à faire apparaître deux vecteurs non colinéaires.</li>
      <li>Écrire le résultat sous la forme \(h\,\vec a_1 + h^2\,\vec a_2 + \cdots\).</li>
      <li>Repérer le premier vecteur non nul (\(p\), il dirige la tangente), puis le premier qui ne lui est pas colinéaire (\(q\)) ; les vecteurs intermédiaires, colinéaires à \(\vec a_p\), ne comptent pas.</li>
      <li>Conclure par les parités, et esquisser l'allure dans le repère \(\big(M(t_0) ; \vec a_p, \vec a_q\big)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une inflexion cachée</strong>
    <p>\(M(t) = \big(2t - t^2,\ t - \tfrac12 t^2 + t^3\big)\), en \(t_0 = 0\).</p>
    <ol>
      <li>Les coordonnées sont polynomiales :
      $$\overrightarrow{OM(h)} = h\,(2, 1) + h^2\,\big(-1, -\tfrac12\big) + h^3\,(0, 1).$$</li>
      <li>\(\vec a_1 = (2, 1) \neq \vec 0\) : \(p = 1\), point régulier, tangente dirigée par \((2, 1)\), d'équation \(y = x/2\).</li>
      <li>\(\vec a_2 = -\tfrac12\vec a_1\) est colinéaire à \(\vec a_1\) : il ne compte pas. \(\vec a_3 = (0, 1)\) ne l'est pas : \(q = 3\).</li>
      <li>\(p = 1\) et \(q = 3\) impairs : \(O\) est un point d'inflexion. Contrôle direct : \(y(t) - \tfrac12 x(t) = t^3\) change de signe en 0, la courbe traverse bien la droite \(y = x/2\).</li>
    </ol>
    <p>Le piège : conclure « point ordinaire » parce que \(\overrightarrow{M''(0)} \neq \vec 0\). Il faut que \(\overrightarrow{M''(0)}\) soit <em>non colinéaire</em> à \(\overrightarrow{M'(0)}\).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — un rebroussement de 2ᵉ espèce</strong>
    <p>\(M(t) = (t^2 - t^3,\ t^4)\), en \(t_0 = 0\) (point stationnaire : \(\overrightarrow{M'(0)} = \vec 0\)).</p>
    <ol>
      <li>Ici \(\overrightarrow{OM(h)} = M(h) - M(0)\), avec \(M(0) = O\) :
      $$\overrightarrow{OM(h)} = h^2\,(1, 0) + h^3\,(-1, 0) + h^4\,(0, 1).$$</li>
      <li>\(p = 2\), tangente \((Ox)\) ; \(\vec a_3\) est colinéaire à \(\vec a_2\) ; \(\vec a_4 = (0, 1)\) ne l'est pas : \(q = 4\).</li>
      <li>\(p\) et \(q\) pairs : rebroussement de 2ᵉ espèce, les deux demi-arcs dans le demi-plan \(y \geq 0\). Ils sont bien distincts : pour \(h\) et \(-h\), même ordonnée \(h^4\) mais abscisses \(h^2 \mp h^3\) différentes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : avec \(p\) et \(q\) pairs, conclure sans vérifier que les deux demi-arcs sont distincts. Pour \(t \mapsto (\sin^2 t,\ 1 - \cos t)\) en 0 :
  $$\overrightarrow{OM(h)} = h^2\big(1, \tfrac12\big) + h^4\big(-\tfrac13, -\tfrac1{24}\big) + o(h^4),$$
  donc \((p, q) = (2, 4)\). Pourtant \(M(-t) = M(t)\) : le point repart sur le même arc (ici un arc de la parabole \(x = y(2 - y)\)) et \(O\) est une extrémité du support, pas un rebroussement entre deux arcs. Les termes d'ordre supérieur, ou une symétrie, tranchent.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BRANCHES INFINIES</div>
  <h2>Asymptotes et branches paraboliques</h2>
  <div class="intro">Quand le paramètre tend vers une borne \(t_0\) du domaine (éventuellement \(\pm\infty\)), le point \(M(t)\) peut partir à l'infini. On cherche alors une direction asymptotique, puis éventuellement une asymptote, et la position de la courbe par rapport à elle.</div>

  <div class="def-box">
    La courbe présente une <strong>branche infinie</strong> en \(t_0\) si \(\|\overrightarrow{OM(t)}\| \to +\infty\) quand \(t \to t_0\) : c'est le cas dès que \(|x(t)|\) ou \(|y(t)|\) tend vers \(+\infty\), les seuls cas étudiés ici (une spirale qui s'éloigne de \(O\) en tournant a une branche infinie sans qu'aucune coordonnée ait de limite). Une droite \(D\) est <strong>asymptote</strong> à cette branche si la distance \(d\big(M(t), D\big)\) tend vers 0 quand \(t \to t_0\).
  </div>
  <div class="prop-box">
    <strong>Classification.</strong>
    <ul>
      <li>\(x(t) \to \pm\infty\) et \(y(t) \to \ell\) réel : asymptote horizontale \(y = \ell\) ; position donnée par le signe de \(y(t) - \ell\).</li>
      <li>\(x(t) \to \ell\) réel et \(y(t) \to \pm\infty\) : asymptote verticale \(x = \ell\) ; position donnée par le signe de \(x(t) - \ell\).</li>
      <li>\(x(t)\) et \(y(t)\) tendent tous deux vers l'infini : on étudie \(\dfrac{y(t)}{x(t)}\).
        <ul>
          <li>S'il tend vers \(\pm\infty\) : <strong>branche parabolique de direction \((Oy)\)</strong> ; s'il tend vers 0 : branche parabolique de direction \((Ox)\).</li>
          <li>S'il tend vers \(m \neq 0\) : la droite \(y = mx\) donne la <strong>direction asymptotique</strong>, et on étudie \(y(t) - m\,x(t)\). S'il tend vers un réel \(k\), la droite \(y = mx + k\) est asymptote, et le signe de \(y - mx - k\) donne la position ; s'il tend vers \(\pm\infty\), branche parabolique de direction \(y = mx\).</li>
        </ul>
      </li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Pourquoi suffit-il que \(y - mx - k\) tende vers 0 ?</span>
    <div class="content"><p>La distance du point \(M(x, y)\) à la droite \(D : y = mx + k\) vaut \(d(M, D) = \dfrac{|y - mx - k|}{\sqrt{1 + m^2}}\). Elle tend vers 0 si et seulement si \(y - mx - k\) tend vers 0. Inversement, si une droite non verticale \(y = mx + k\) est asymptote alors que \(|x| \to +\infty\), on a \(\dfrac{y}{x} = m + \dfrac{k}{x} + \dfrac{y - mx - k}{x} \to m\) : la pente \(m\) se lit nécessairement sur la limite de \(y/x\).</p></div>
  </div>

  <div class="method-box">
    <strong>Méthode — utiliser un développement asymptotique</strong>
    <ol>
      <li>Si \(t_0\) est fini, poser \(t = t_0 + h\) ; si \(t_0 = \pm\infty\), poser \(h = 1/t\).</li>
      <li>Développer \(x\) et \(y\) suivant les puissances de \(h\), termes en \(1/h\) compris, jusqu'au premier terme qui tend vers 0 dans \(y - mx\).</li>
      <li>Lire \(m\) (rapport des termes dominants), \(k\) (terme constant de \(y - mx\)), puis la position par le signe du premier terme non nul de \(y - mx - k\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une courbe à trois asymptotes</strong>
    <p>\(x(t) = \dfrac{t^2}{t - 1}\), \(y(t) = \dfrac{t^3}{t^2 - 1}\), pour \(t \in \mathbb{R}\setminus\{-1, 1\}\).</p>
    <ol>
      <li><strong>Quand \(t \to 1\)</strong>, avec \(t = 1 + h\) : \(x = \dfrac{(1+h)^2}{h} = \dfrac1h + 2 + h\) exactement, et
      $$y = \frac{(1+h)^3}{h(2+h)} = \frac{1}{2h}\,(1 + 3h + 3h^2 + \cdots)\Big(1 - \frac h2 + \frac{h^2}{4} + \cdots\Big) = \frac{1}{2h} + \frac54 + \frac{7h}{8} + o(h).$$
      Les deux tendent vers l'infini, \(y/x \to \tfrac12\), et \(y - \tfrac12 x = \tfrac14 + \tfrac{3h}{8} + o(h)\). La droite \(y = \tfrac x2 + \tfrac14\) est asymptote ; la courbe est au-dessus pour \(t \gt 1\), au-dessous pour \(t \lt 1\).</li>
      <li><strong>Quand \(t \to -1\)</strong> : \(x \to -\tfrac12\) et \(|y| \to +\infty\) : asymptote verticale \(x = -\tfrac12\). Comme \(x + \tfrac12 = \dfrac{(2t - 1)(t + 1)}{2(t - 1)}\) a le signe de \(t + 1\) près de \(-1\), la courbe est à droite de l'asymptote pour \(t \gt -1\), à gauche pour \(t \lt -1\).</li>
      <li><strong>Quand \(t \to \pm\infty\)</strong> : \(y/x \to 1\) et un calcul exact donne \(y - x = -\dfrac{t^2}{t^2 - 1}\), qui tend vers \(-1\). Asymptote \(y = x - 1\), et \(y - (x - 1) = -\dfrac{1}{t^2 - 1} \lt 0\) : la courbe est au-dessous, des deux côtés.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§6 · CONSTRUIRE UNE COURBE</div>
  <h2>Le plan d'étude, et la cardioïde</h2>
  <div class="intro">Construire le support d'une courbe paramétrée, c'est rassembler les études précédentes dans un ordre efficace. Le tableau de variations conjoint de \(x\) et \(y\) en est la colonne vertébrale : sur chaque intervalle où \(x'\) et \(y'\) gardent un signe, le point se déplace dans une direction « cardinale » fixée (vers la droite et vers le haut, etc.).</div>

  <div class="method-box">
    <strong>Méthode — plan d'étude d'une courbe paramétrée</strong>
    <ol>
      <li>Domaine de définition et de dérivabilité de \(x\) et \(y\).</li>
      <li>Réduction du domaine : période, symétries (§3).</li>
      <li>Calcul de \(x'\) et \(y'\), étude de leurs signes, <strong>tableau de variations conjoint</strong> (lignes \(t\), \(x'\), \(x\), \(y\), \(y'\)) avec les valeurs aux points remarquables.</li>
      <li>Points remarquables : points stationnaires (nature par développement limité, §4), tangentes horizontales (\(y' = 0\), \(x' \neq 0\)) et verticales (\(x' = 0\), \(y' \neq 0\)).</li>
      <li>Branches infinies (§5).</li>
      <li>Tracé : placer les points et leurs tangentes, relier en suivant le tableau, compléter par les symétries ; repérer au besoin les points doubles (\(M(t) = M(t')\) avec \(t \neq t'\)) et les intersections avec les axes.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — étude complète de la cardioïde du §1</strong>
    <p>\(x(t) = (1 - \cos t)\cos t\), \(y(t) = (1 - \cos t)\sin t\).</p>
    <ol>
      <li><strong>Réduction.</strong> \(x\) et \(y\) sont \(2\pi\)-périodiques : on étudie sur \([-\pi, \pi]\). \(x\) est paire et \(y\) impaire : la courbe est symétrique par rapport à \((Ox)\), on étudie sur \([0, \pi]\).</li>
      <li><strong>Signes.</strong> D'après le §2, \(x'(t) = \sin t\,(2\cos t - 1)\) et \(y'(t) = (1 - \cos t)(1 + 2\cos t)\). Sur \(]0, \pi[\), \(\sin t \gt 0\) et \(1 - \cos t \gt 0\) : \(x'\) a le signe de \(2\cos t - 1\) (positif avant \(\pi/3\)), \(y'\) celui de \(1 + 2\cos t\) (positif avant \(2\pi/3\)).</li>
      <li><strong>Tableau de variations conjoint</strong> :
        <div><table>
          <tr><th>\(t\)</th><td>\(0\)</td><td></td><td>\(\frac{\pi}{3}\)</td><td></td><td>\(\frac{2\pi}{3}\)</td><td></td><td>\(\pi\)</td></tr>
          <tr><th>\(x'(t)\)</th><td>\(0\)</td><td>\(+\)</td><td>\(0\)</td><td>\(-\)</td><td>\(-\sqrt3\)</td><td>\(-\)</td><td>\(0\)</td></tr>
          <tr><th>\(x(t)\)</th><td>\(0\)</td><td>↗</td><td>\(\frac14\)</td><td>↘</td><td>\(-\frac34\)</td><td>↘</td><td>\(-2\)</td></tr>
          <tr><th>\(y(t)\)</th><td>\(0\)</td><td>↗</td><td>\(\frac{\sqrt3}{4}\)</td><td>↗</td><td>\(\frac{3\sqrt3}{4}\)</td><td>↘</td><td>\(0\)</td></tr>
          <tr><th>\(y'(t)\)</th><td>\(0\)</td><td>\(+\)</td><td>\(1\)</td><td>\(+\)</td><td>\(0\)</td><td>\(-\)</td><td>\(-2\)</td></tr>
        </table></div>
      </li>
      <li><strong>Points remarquables.</strong> \(A = M(\pi/3)\) : tangente verticale ; \(B = M(2\pi/3)\) : tangente horizontale ; \(C = M(\pi) = (-2, 0)\) : tangente verticale. En \(O = M(0)\), point stationnaire, les développements \(1 - \cos h = \tfrac{h^2}{2} - \tfrac{h^4}{24} + o(h^4)\), \(\cos h = 1 - \tfrac{h^2}{2} + o(h^3)\), \(\sin h = h + o(h^2)\) donnent
      $$\overrightarrow{OM(h)} = \frac{h^2}{2}\,(1, 0) + \frac{h^3}{2}\,(0, 1) + o(h^3).$$
      Donc \(p = 2\), \(q = 3\) : rebroussement de 1ʳᵉ espèce, de tangente \((Ox)\), la pointe tournée vers l'intérieur de la courbe.</li>
      <li><strong>Branches infinies</strong> : aucune, car \(OM(t) = 1 - \cos t \leq 2\).</li>
      <li><strong>Tracé.</strong> On parcourt l'arc de \(O\) à \(C\) en suivant le tableau (vers la droite et vers le haut jusqu'à \(A\), puis vers la gauche et vers le haut jusqu'à \(B\), puis vers la gauche et vers le bas), et on complète par la symétrie d'axe \((Ox)\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · UNE ÉTUDE AVEC ASYMPTOTE ET REBROUSSEMENT</div>
  <h2>Une courbe qui cumule les difficultés</h2>
  <div class="intro">Dernière étude complète, qui réunit un point stationnaire, une asymptote oblique coupée par la courbe et des branches paraboliques : \(x(t) = t + \dfrac1t\), \(y(t) = t^2 + \dfrac2t\), pour \(t \in \mathbb{R}^*\).</div>

  <div class="method-box">
    <strong>Exemple — étude complète</strong>
    <ol>
      <li><strong>Réduction.</strong> \(x\) est impaire, mais \(y(-t) = t^2 - \tfrac2t\) n'est égal ni à \(y(t)\) ni à \(-y(t)\) : pas de symétrie évidente, pas de période. On étudie sur \(]-\infty, 0[\) et sur \(]0, +\infty[\).</li>
      <li><strong>Dérivées.</strong> \(x'(t) = 1 - \dfrac{1}{t^2} = \dfrac{(t - 1)(t + 1)}{t^2}\) et \(y'(t) = 2t - \dfrac{2}{t^2}\), soit \(y'(t) = \dfrac{2(t - 1)(t^2 + t + 1)}{t^2}\), où \(t^2 + t + 1 \gt 0\).</li>
      <li><strong>Tableau de variations conjoint</strong> :
        <div><table>
          <tr><th>\(t\)</th><td>\(-\infty\)</td><td></td><td>\(-1\)</td><td></td><td>\(0^-\)</td><td>\(0^+\)</td><td></td><td>\(1\)</td><td></td><td>\(+\infty\)</td></tr>
          <tr><th>\(x'(t)\)</th><td></td><td>\(+\)</td><td>\(0\)</td><td>\(-\)</td><td></td><td></td><td>\(-\)</td><td>\(0\)</td><td>\(+\)</td><td></td></tr>
          <tr><th>\(x(t)\)</th><td>\(-\infty\)</td><td>↗</td><td>\(-2\)</td><td>↘</td><td>\(-\infty\)</td><td>\(+\infty\)</td><td>↘</td><td>\(2\)</td><td>↗</td><td>\(+\infty\)</td></tr>
          <tr><th>\(y(t)\)</th><td>\(+\infty\)</td><td>↘</td><td>\(-1\)</td><td>↘</td><td>\(-\infty\)</td><td>\(+\infty\)</td><td>↘</td><td>\(3\)</td><td>↗</td><td>\(+\infty\)</td></tr>
          <tr><th>\(y'(t)\)</th><td></td><td>\(-\)</td><td>\(-4\)</td><td>\(-\)</td><td></td><td></td><td>\(-\)</td><td>\(0\)</td><td>\(+\)</td><td></td></tr>
        </table></div>
      </li>
      <li><strong>Point stationnaire</strong> \(S = M(1) = (2, 3)\). Avec \(\dfrac{1}{1+h} = 1 - h + h^2 - h^3 + o(h^3)\) :
      $$x = 2 + h^2 - h^3 + o(h^3), \qquad y = 3 + 3h^2 - 2h^3 + o(h^3),$$
      soit
      $$\overrightarrow{SM(1+h)} = h^2\,(1, 3) + h^3\,(-1, -2) + o(h^3).$$
      Comme \(\det\big((1, 3), (-1, -2)\big) = 1 \neq 0\), on a \(p = 2\), \(q = 3\) : <strong>rebroussement de 1ʳᵉ espèce</strong>, de tangente dirigée par \((1, 3)\), d'équation \(y - 3 = 3(x - 2)\).</li>
      <li><strong>Tangente verticale</strong> en \(V = M(-1) = (-2, -1)\), où \(x' = 0\) et \(y' = -4\).</li>
      <li><strong>Branche en \(t \to 0\).</strong> \(x \sim \tfrac1t\) et \(y \sim \tfrac2t\) : \(y/x \to 2\), et \(y - 2x = t^2 - 2t \to 0\). La droite \(y = 2x\) est asymptote. Comme \(y - 2x = t(t - 2)\), la courbe est au-dessous pour \(t \to 0^+\), au-dessus pour \(t \to 0^-\), et elle <strong>coupe</strong> son asymptote en \(K = M(2) = (\tfrac52, 5)\).</li>
      <li><strong>Branches en \(\pm\infty\).</strong> \(\dfrac{y}{x} = \dfrac{t^3 + 2}{t^2 + 1} \to \pm\infty\) : branches paraboliques de direction \((Oy)\).</li>
      <li><strong>Points doubles ?</strong> Pour \(a \neq b\), \(x(a) = x(b)\) s'écrit \((a - b)\big(1 - \tfrac{1}{ab}\big) = 0\), soit \(ab = 1\). En reportant \(b = 1/a\) dans \(y(a) = y(b)\) et en multipliant par \(a^2\) : \(a^4 - 2a^3 + 2a - 1 = 0\), soit \((a - 1)^3(a + 1) = 0\), donc \(a = \pm1 = b\), contradiction. Il n'y a pas de point double.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Courbes en coordonnées polaires</h2>
  <div class="intro">Le programme de PT précise que l'étude des courbes définies par une équation polaire est hors programme. Ces courbes restent fréquentes en physique (trajectoires sous force centrale, coniques en mécanique céleste) : voici l'essentiel, à titre culturel.</div>
  <p>Avec \(\vec u(\theta) = (\cos\theta, \sin\theta)\) et \(\vec v(\theta) = (-\sin\theta, \cos\theta)\), une courbe d'équation polaire \(r = f(\theta)\) est la courbe paramétrée \(\theta \mapsto O + f(\theta)\,\vec u(\theta)\), c'est-à-dire \(x = f(\theta)\cos\theta\), \(y = f(\theta)\sin\theta\) : tout ce chapitre s'y applique. Comme \(\vec u\,' = \vec v\), on a \(\dfrac{\mathrm{d}\overrightarrow{OM}}{\mathrm{d}\theta} = f'(\theta)\,\vec u + f(\theta)\,\vec v\). Hors de l'origine, l'angle \(V\) entre \(\vec u\) et la tangente vérifie \(\tan V = f/f'\) ; en un point où \(f(\theta_0) = 0\), la tangente est la droite d'angle polaire \(\theta_0\).</p>
  <p>La cardioïde des §1 et §6 en est l'exemple type : \(H(t) = (1 - \cos t)\,\vec u(t)\), soit \(r = 1 - \cos\theta\). Pour \(\theta = 0\), \(r = 0\) et la tangente en \(O\) est l'axe d'angle polaire 0, l'axe \((Ox)\) : on retrouve en une ligne le résultat du §6.</p>
</div>
