<div class="course-section">
  <div class="sec-num">MÉTHODES · COURBES PARAMÉTRÉES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à étudier une courbe paramétrée \(t \mapsto M(t) = \big(x(t), y(t)\big)\) de bout en bout : la faire naître d'un lieu géométrique, écrire ses tangentes, réduire son domaine, dresser le tableau de variations conjoint, étudier ses points particuliers et ses branches infinies, puis tracer son support.</div>

  <div class="method-box"><strong>Méthode 1 — Paramétrer un lieu géométrique</strong>
    <ol>
      <li>Repérer le point mobile qui pilote la construction et le paramétrer : angle \(t\) pour un point d'un cercle, pente \(t\) d'une droite passant par un point fixe, abscisse \(t\) d'un point d'une droite.</li>
      <li>Traduire chaque étape de la construction par un calcul en fonction de ce <strong>seul</strong> paramètre : intersection (résoudre un système), projeté orthogonal sur une droite passant par \(A\) dirigée par \(\vec u\) unitaire (\(H = A + (\overrightarrow{AP}\cdot\vec u)\,\vec u\)), milieu, symétrique…</li>
      <li>Écrire le point construit sous la forme \(t \mapsto M(t)\) : le lieu est le support de cette courbe, pour les valeurs de \(t\) effectivement permises par la construction.</li>
      <li>Reconnaître la courbe si l'on peut (droite, cercle, conique) en éliminant \(t\) ; sinon, l'étudier par le plan d'étude (méthode 9).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = (2, 0)\) et \(D_t\) la droite passant par \(O\) dirigée par \(\vec u(t) = (\cos t, \sin t)\). Le projeté orthogonal de \(A\) sur \(D_t\) est \(H(t) = (\overrightarrow{OA}\cdot\vec u)\,\vec u = 2\cos t\,(\cos t, \sin t)\), soit \(H(t) = (1 + \cos 2t, \sin 2t)\) : le lieu de \(H\) est le cercle de centre \((1, 0)\) et de rayon 1, c'est-à-dire le cercle de diamètre \([OA]\) (l'angle en \(H\) est droit).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Écrire la tangente et la normale en un point régulier</strong>
    <ol>
      <li>Calculer \(\overrightarrow{M'(t_0)}\) et vérifier qu'il n'est pas nul : le point est régulier.</li>
      <li>Paramétrage de la tangente : \(\lambda \mapsto M(t_0) + \lambda\,\overrightarrow{M'(t_0)}\), dans le plan comme dans l'espace.</li>
      <li>Dans le plan, la tangente traduit la colinéarité de \(\overrightarrow{M(t_0)M}\) et \(\overrightarrow{M'(t_0)}\) (déterminant nul), la normale leur orthogonalité (produit scalaire nul) :
      <div class="formula" data-nom="Tangente">$$\begin{vmatrix} x - x(t_0) & x'(t_0) \\ y - y(t_0) & y'(t_0) \end{vmatrix} = 0,$$</div>
      <div class="formula" data-nom="Normale">$$\overrightarrow{M(t_0)M}\cdot\overrightarrow{M'(t_0)} = 0.$$</div></li>
      <li>Dans l'espace, une droite n'a pas d'équation unique : éliminer \(\lambda\) entre les trois coordonnées du paramétrage pour obtenir deux équations.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(t) = (t^2 + t,\ t^3 - 3t)\) en \(t_0 = 2\) : \(M(2) = (6, 2)\) et \(\overrightarrow{M'(2)} = (5, 9)\). Tangente : \(9(x - 6) - 5(y - 2) = 0\), soit \(9x - 5y = 44\) ; normale : \(5(x - 6) + 9(y - 2) = 0\), soit \(5x + 9y = 48\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Trouver la tangente en un point stationnaire</strong>
    <ol>
      <li>Constater que \(\overrightarrow{M'(t_0)} = \vec 0\) : la formule de la méthode 2 ne s'applique pas.</li>
      <li>Calculer les dérivées successives en \(t_0\) (ou un développement limité de \(x\) et \(y\)) jusqu'à la première non nulle, \(\overrightarrow{M^{(p)}(t_0)}\).</li>
      <li>La tangente passe par \(M(t_0)\) et est dirigée par \(\overrightarrow{M^{(p)}(t_0)}\) : écrire son équation avec ce vecteur à la place de \(\overrightarrow{M'(t_0)}\).</li>
      <li>Pour savoir s'il y a une pointe, il faut en plus l'entier \(q\) (méthode 6).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(t) = (e^t - t,\ t^2 + t^3)\). En 0 : \(\overrightarrow{M'(0)} = (e^0 - 1, 0) = \vec 0\) et \(\overrightarrow{M''(0)} = (1, 2)\). La tangente en \(M(0) = (1, 0)\) est la droite d'équation \(y = 2(x - 1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la régularité dépend du <em>paramétrage</em>, pas du support. \(t \mapsto (t^3, t^3)\) est stationnaire en 0 alors que son support, la droite \(y = x\), a bien une tangente en \(O\). Ne jamais écrire une « équation de tangente » avec un vecteur dérivé nul : il ne dirige rien.</div>

  <div class="method-box"><strong>Méthode 4 — Réduire le domaine d'étude</strong>
    <ol>
      <li>Déterminer le domaine de définition et une période commune \(T\) à \(x\) et \(y\), s'il en existe une : on étudie alors sur un intervalle de longueur \(T\).</li>
      <li>Comparer \(M(-t)\) à \(M(t)\), puis \(M(\pi - t)\), \(M(t + T/2)\), \(M(1/t)\)… en regardant les <strong>deux</strong> coordonnées.</li>
      <li>Identifier la transformation : \((x, -y)\) symétrie d'axe \((Ox)\) ; \((-x, y)\) symétrie d'axe \((Oy)\) ; \((-x, -y)\) symétrie de centre \(O\) ; \((y, x)\) symétrie par rapport à la droite \(y = x\).</li>
      <li>Vérifier que le changement de paramètre envoie l'intervalle conservé exactement sur la partie retirée ; après l'étude, tracer l'arc obtenu puis appliquer les transformations dans l'ordre inverse des réductions.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x(t) = \cos 3t\), \(y(t) = \sin 2t\) sont \(2\pi\)-périodiques. \(M(-t) = \big(x(t), -y(t)\big)\) : symétrie d'axe \((Ox)\), on étudie sur \([0, \pi]\). Puis \(\cos(3\pi - 3t) = -\cos 3t\) et \(\sin(2\pi - 2t) = -\sin 2t\) : \(M(\pi - t)\) est le symétrique de \(M(t)\) par rapport à \(O\), et \(t \mapsto \pi - t\) envoie \([0, \tfrac\pi2]\) sur \([\tfrac\pi2, \pi]\). On étudie sur \([0, \tfrac\pi2]\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « \(x\) est paire » ne suffit à rien. C'est le comportement des deux coordonnées qui identifie la transformation, et la réduction n'est valable que si l'image de l'intervalle gardé recouvre exactement la partie abandonnée.</div>

  <div class="method-box"><strong>Méthode 5 — Dresser le tableau de variations conjoint</strong>
    <ol>
      <li>Calculer \(x'\) et \(y'\), les factoriser et étudier leurs signes sur l'intervalle d'étude.</li>
      <li>Dresser un seul tableau, de lignes \(t\), \(x'(t)\), \(x(t)\), \(y(t)\), \(y'(t)\), avec les valeurs (ou limites) de \(x\) et \(y\) aux bornes et aux zéros de \(x'\) ou de \(y'\).</li>
      <li>Lire les points remarquables : \(x' = 0\) et \(y' \neq 0\), tangente verticale ; \(y' = 0\) et \(x' \neq 0\), tangente horizontale ; \(x' = y' = 0\), point stationnaire (méthodes 3 et 6).</li>
      <li>Entre deux valeurs remarquables consécutives, \(x\) et \(y\) sont monotones : le point se déplace dans une direction fixée (vers la droite et vers le haut, etc.), ce qui guide le tracé.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x(t) = t^2 - 2t\), \(y(t) = t^3 - 12t\) : \(x'(t) = 2(t - 1)\) et \(y'(t) = 3(t - 2)(t + 2)\) ne s'annulent jamais en même temps (aucun point stationnaire). Tangente verticale en \(M(1) = (-1, -11)\) ; tangentes horizontales en \(M(2) = (0, -16)\) et \(M(-2) = (8, 16)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Étudier un point par développement limité</strong>
    <ol>
      <li>Poser \(t = t_0 + h\) et développer \(x(t_0 + h)\) et \(y(t_0 + h)\), jusqu'à faire apparaître deux vecteurs non colinéaires.</li>
      <li>Regrouper selon les puissances de \(h\) : \(\overrightarrow{M(t_0)M(t_0+h)} = h\,\vec a_1 + h^2\,\vec a_2 + \cdots\)</li>
      <li>Lire \(p\), indice du premier vecteur non nul (\(\vec a_p\) dirige la tangente), puis \(q\), indice du premier vecteur non colinéaire à \(\vec a_p\) ; les vecteurs intermédiaires, colinéaires à \(\vec a_p\), ne comptent pas.</li>
      <li>Conclure par les parités : \(p\) impair et \(q\) pair, point ordinaire ; \(p\) et \(q\) impairs, inflexion ; \(p\) pair et \(q\) impair, rebroussement de 1ʳᵉ espèce ; \(p\) et \(q\) pairs, rebroussement de 2ᵉ espèce (vérifier alors que les deux demi-arcs sont distincts). Esquisser l'allure dans le repère \(\big(M(t_0) ; \vec a_p, \vec a_q\big)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(t) = \big(\ln(1 + t^2),\ t^2 + t^3\big)\) en 0. Comme \(\ln(1 + h^2) = h^2 + o(h^3)\) : \(\overrightarrow{OM(h)} = h^2\,(1, 1) + h^3\,(0, 1) + o(h^3)\). Donc \(p = 2\), \(q = 3\) : rebroussement de 1ʳᵉ espèce en \(O\), de tangente \(y = x\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : conclure « point ordinaire » parce que \(\overrightarrow{M''(t_0)} \neq \vec 0\). Il faut que \(\overrightarrow{M''(t_0)}\) soit <em>non colinéaire</em> à \(\overrightarrow{M'(t_0)}\) ; sinon on poursuit le développement jusqu'au premier vecteur qui sort de la direction de la tangente.</div>

  <div class="method-box"><strong>Méthode 7 — Étudier une branche infinie</strong>
    <ol>
      <li>Repérer les bornes \(t_0\) du domaine (éventuellement \(\pm\infty\)) où \(|x|\) ou \(|y|\) tend vers \(+\infty\).</li>
      <li>Si une seule coordonnée tend vers l'infini et l'autre vers un réel \(\ell\) : asymptote horizontale \(y = \ell\) ou verticale \(x = \ell\), position par le signe de \(y - \ell\) ou de \(x - \ell\).</li>
      <li>Si les deux tendent vers l'infini, étudier \(y/x\) : limite infinie, branche parabolique de direction \((Oy)\) ; limite nulle, de direction \((Ox)\) ; limite \(m \neq 0\), étudier \(y - mx\) : s'il tend vers \(k\), la droite \(y = mx + k\) est asymptote (position par le signe de \(y - mx - k\)), s'il tend vers l'infini, branche parabolique de direction \(y = mx\).</li>
      <li>En pratique, poser \(h = t - t_0\) (ou \(h = 1/t\) en \(\pm\infty\)) et écrire des développements asymptotiques, termes en \(1/h\) compris, jusqu'au premier terme non nul de \(y - mx - k\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x(t) = \dfrac{t^3}{t^2 + 1}\), \(y(t) = \dfrac{t^2}{t + 1}\), quand \(t \to \pm\infty\) : \(y/x \to 1\) et \(y - x = -\dfrac{t^2(t - 1)}{(t + 1)(t^2 + 1)} \to -1\). Asymptote \(y = x - 1\), et \(y - x + 1 = \dfrac{2t^2 + t + 1}{(t + 1)(t^2 + 1)}\) a le signe de \(t + 1\) : courbe au-dessus pour \(t \to +\infty\), au-dessous pour \(t \to -\infty\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : s'arrêter à \(y/x \to m\). Une direction asymptotique ne fait pas une asymptote : il faut encore que \(y - mx\) ait une limite finie. Et une courbe peut couper son asymptote : la position se lit sur un signe, pas sur un dessin.</div>

  <div class="method-box"><strong>Méthode 8 — Chercher les points doubles</strong>
    <ol>
      <li>Écrire \(M(a) = M(b)\) avec \(a \neq b\) dans le domaine (et, pour une courbe périodique, \(a\) et \(b\) non égaux à une période près).</li>
      <li>Dans \(x(a) = x(b)\) et \(y(a) = y(b)\), mettre \(a - b\) en facteur et simplifier par \(a - b \neq 0\) ; pour des fractions rationnelles, passer souvent par \(S = a + b\) et \(P = ab\).</li>
      <li>Résoudre le système obtenu et garder les solutions avec \(a \neq b\).</li>
      <li>Les tangentes au point double sont dirigées par \(\overrightarrow{M'(a)}\) et \(\overrightarrow{M'(b)}\) : la courbe s'y croise elle-même.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(t) = (t^2,\ t^3 - 4t)\). Avec \(a \neq b\), \(x(a) = x(b)\) impose \(b = -a\), puis \(y(-a) = y(a)\) donne \(a^3 - 4a = 0\), soit \(a = \pm 2\) (\(a = 0\) donnerait \(b = a\)). Point double \(M(2) = M(-2) = (4, 0)\), traversé avec des tangentes dirigées par \((4, 8)\) et \((-4, 8)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Construire le support d'une courbe (plan d'étude)</strong>
    <ol>
      <li>Domaine ; réduction par périodicité et symétries (méthode 4).</li>
      <li>\(x'\), \(y'\), tableau de variations conjoint (méthode 5).</li>
      <li>Points remarquables : tangentes horizontales et verticales, points stationnaires et leur nature (méthodes 3 et 6), points doubles (méthode 8), intersections avec les axes si elles sont simples.</li>
      <li>Branches infinies et asymptotes (méthode 7).</li>
      <li>Tracé : asymptotes en tirets, points remarquables avec leurs tangentes, puis l'arc en suivant le tableau ; compléter par les symétries.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(M(t) = (t^2,\ t^3 - 4t)\) de la méthode 8 : \(x\) paire et \(y\) impaire, symétrie d'axe \((Ox)\), étude sur \([0, +\infty[\). \(x\) croît ; \(y\) décroît jusqu'en \(t = \tfrac{2}{\sqrt3}\) (tangente horizontale en \(\big(\tfrac43, -\tfrac{16}{3\sqrt3}\big)\)) puis croît ; tangente verticale en \(M(0) = O\) (\(\overrightarrow{M'(0)} = (0, -4)\)) ; point double \((4, 0)\) atteint en \(t = 2\) ; \(y/x \sim t \to +\infty\) : branche parabolique de direction \((Oy)\). On obtient une boucle traversée en \((4, 0)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : tracer sans suivre le tableau. Entre deux points remarquables, \(x\) et \(y\) sont monotones : un arc qui ondule, ou qui monte alors que \(y\) décroît, trahit une erreur de signe.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="crb-exos">
<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Parabole semi-cubique : tangentes et point stationnaire</h3>
  <div class="statement">On considère la courbe \(t \mapsto M(t) = (t^2,\ t^3)\), \(t \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\overrightarrow{M'(t)}\). Quels sont les points réguliers de la courbe ?</div>
  <div class="q"><strong>Q2.</strong> Écrire une équation de la tangente en \(M(1)\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer les entiers caractéristiques \((p, q)\) en \(t = 0\), puis la nature du point \(M(0)\) et sa tangente.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\overrightarrow{M'(t)} = (2t,\ 3t^2)\), nul si et seulement si \(t = 0\). Tous les points sont réguliers, sauf \(M(0) = O\), qui est stationnaire.</p>
  <p><strong>Q2.</strong> \(M(1) = (1, 1)\) et \(\overrightarrow{M'(1)} = (2, 3) \neq \vec 0\). La tangente a pour équation \(3(x - 1) - 2(y - 1) = 0\), soit \(3x - 2y = 1\).</p>
  <p><strong>Q3.</strong> \(\overrightarrow{M''(t)} = (2,\ 6t)\) et \(\overrightarrow{M'''(t)} = (0,\ 6)\). En 0, \(\overrightarrow{M''(0)} = (2, 0)\) est la première dérivée non nulle : \(p = 2\) ; \(\overrightarrow{M'''(0)} = (0, 6)\) ne lui est pas colinéaire : \(q = 3\). (Directement : \(\overrightarrow{OM(h)} = h^2\,(1, 0) + h^3\,(0, 1)\), exactement.) \(p\) pair et \(q\) impair : <strong>rebroussement de 1ʳᵉ espèce</strong>, de tangente \((Ox)\), dirigée par \((1, 0)\). Contrôle : \(x = t^2 \geq 0\), les deux demi-arcs sont du même côté de la normale \((Oy)\), et \(y = t^3\) change de signe, ils sont de part et d'autre de la tangente.</p></div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Tangente à une courbe de l'espace</h3>
  <div class="statement">On considère la courbe de l'espace \(t \mapsto M(t) = (t,\ t^2,\ t^3)\), \(t \in \mathbb{R}\), et le plan \(\mathcal{P}\) d'équation \(3x - 3y + z = 0\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la courbe est régulière.</div>
  <div class="q"><strong>Q2.</strong> Donner un paramétrage, puis un système de deux équations, de la tangente en \(M(1)\).</div>
  <div class="q"><strong>Q3.</strong> En quels points la tangente est-elle parallèle au plan \(\mathcal{P}\) ? Y est-elle contenue ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\overrightarrow{M'(t)} = (1,\ 2t,\ 3t^2)\) : sa première coordonnée vaut 1, il n'est jamais nul. La courbe est régulière.</p>
  <p><strong>Q2.</strong> \(M(1) = (1, 1, 1)\) et \(\overrightarrow{M'(1)} = (1, 2, 3)\) : la tangente est \(\lambda \mapsto (1 + \lambda,\ 1 + 2\lambda,\ 1 + 3\lambda)\). En éliminant \(\lambda = x - 1\), elle a pour équations \(y = 2x - 1\) et \(z = 3x - 2\).</p>
  <p><strong>Q3.</strong> La tangente en \(M(t)\) est parallèle à \(\mathcal{P}\) si et seulement si son vecteur directeur est orthogonal au vecteur normal \(\vec n = (3, -3, 1)\) :
  </p><div class="formula">$$\begin{aligned} \overrightarrow{M'(t)}\cdot\vec n &= 3 - 6t + 3t^2 \\ &= 3(t - 1)^2, \end{aligned}$$</div><p>
  nul si et seulement si \(t = 1\) : seule la tangente en \(M(1)\) convient. Elle n'est pas contenue dans \(\mathcal{P}\), car \(M(1) = (1, 1, 1)\) n'est pas dans \(\mathcal{P}\) (\(3 - 3 + 1 = 1 \neq 0\)) : elle est strictement parallèle au plan.</p></div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Cardioïde : symétrie, passage par l'origine, tangentes</h3>
  <div class="statement">On étudie la courbe \(x(\theta) = (1 + \cos\theta)\cos\theta\), \(y(\theta) = (1 + \cos\theta)\sin\theta\), \(\theta \in [-\pi, \pi]\). (On la décrit souvent par l'équation polaire \(r = 1 + \cos\theta\) ; l'étude des équations polaires est hors programme en PT, on travaille donc avec ce paramétrage cartésien.)</div>
  <div class="q"><strong>Q1.</strong> Quelle symétrie permet de réduire l'étude à \([0, \pi]\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer et factoriser \(x'(\theta)\) et \(y'(\theta)\). Montrer que la courbe ne passe par l'origine que pour \(\theta = \pi\), seul point stationnaire de \([0, \pi]\).</div>
  <div class="q"><strong>Q3.</strong> Par un développement limité en \(\theta = \pi\), préciser la nature de ce point et la tangente à l'origine.</div>
  <div class="q"><strong>Q4.</strong> Déterminer les points de \([0, \pi]\) où la tangente est horizontale, puis ceux où elle est verticale.</div>
  <div class="q"><strong>Q5.</strong> Comparer avec la cardioïde du cours, \(H(t) = (1 - \cos t)\,(\cos t, \sin t)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(x(-\theta) = x(\theta)\) et \(y(-\theta) = -y(\theta)\) : \(M(-\theta)\) est le symétrique de \(M(\theta)\) par rapport à \((Ox)\). On étudie sur \([0, \pi]\), puis on complète par cette symétrie.</p>
  <p><strong>Q2.</strong> \(x = \cos\theta + \cos^2\theta\) et \(y = \sin\theta + \tfrac12\sin 2\theta\), d'où
  </p><div class="formula">$$\begin{aligned} x'(\theta) &= -\sin\theta\,(1 + 2\cos\theta), \\ y'(\theta) &= \cos\theta + \cos 2\theta \\ &= (2\cos\theta - 1)(\cos\theta + 1). \end{aligned}$$</div><p>
  \(M(\theta) = O\) équivaut à \(1 + \cos\theta = 0\) (car \((\cos\theta, \sin\theta) \neq (0, 0)\)), soit \(\theta = \pi\). Sur \([0, \pi]\), \(y'\) s'annule pour \(\cos\theta = \tfrac12\) ou \(\cos\theta = -1\), c'est-à-dire \(\theta = \tfrac\pi3\) ou \(\theta = \pi\) ; or \(x'(\tfrac\pi3) = -\sqrt3 \neq 0\) et \(x'(\pi) = 0\). Le seul point stationnaire est \(M(\pi) = O\).</p>
  <p><strong>Q3.</strong> Avec \(\theta = \pi + h\) : \(1 + \cos\theta = 1 - \cos h = \tfrac{h^2}{2} + O(h^4)\), \(\cos\theta = -\cos h = -1 + O(h^2)\) et \(\sin\theta = -\sin h = -h + O(h^3)\). Donc
  </p><div class="formula">$$\begin{aligned} \overrightarrow{OM(\pi + h)} &= h^2\,\Big(-\frac12, 0\Big) \\ &\quad + h^3\,\Big(0, -\frac12\Big) + o(h^3). \end{aligned}$$</div><p>
  \(p = 2\), \(q = 3\) : <strong>rebroussement de 1ʳᵉ espèce</strong> en \(O\), de tangente l'axe \((Ox)\) (la droite d'angle polaire \(\pi\)).</p>
  <p><strong>Q4.</strong> Tangente horizontale (\(y' = 0\), \(x' \neq 0\)) : \(\theta = \tfrac\pi3\), au point \(\big(\tfrac34, \tfrac{3\sqrt3}{4}\big)\). Tangente verticale (\(x' = 0\), \(y' \neq 0\)) : \(\sin\theta = 0\) ou \(\cos\theta = -\tfrac12\), d'où \(\theta = 0\), au point \((2, 0)\) (\(y'(0) = 2\)), et \(\theta = \tfrac{2\pi}{3}\), au point \(\big(-\tfrac14, \tfrac{\sqrt3}{4}\big)\) (\(y' = -1\)). La symétrie d'axe \((Ox)\) donne les points symétriques.</p>
  <p><strong>Q5.</strong> Pour tout \(\theta\),
  </p><div class="formula">$$\begin{aligned} H(\theta + \pi) &= (1 + \cos\theta)\,(-\cos\theta, -\sin\theta) \\ &= -\overrightarrow{OM(\theta)}. \end{aligned}$$</div><p>
  La courbe étudiée est l'image de la cardioïde du cours par la symétrie de centre \(O\). On retrouve la pointe en \(O\), tangente à \((Ox)\) ; mais, près de \(O\), la courbe est maintenant du côté des \(x\) négatifs (\(x \sim -\tfrac{h^2}{2}\)), et elle s'étend jusqu'au point \((2, 0)\).</p></div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Une boucle et son point double</h3>
  <div class="statement">On considère la courbe \(t \mapsto M(t) = (t^2 - 1,\ t^3 - t)\), \(t \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que l'on peut réduire l'étude à \([0, +\infty[\).</div>
  <div class="q"><strong>Q2.</strong> Dresser le tableau de variations conjoint sur \([0, +\infty[\) et préciser les tangentes horizontales et verticales.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les points doubles de la courbe et les tangentes en ces points.</div>
  <div class="q"><strong>Q4.</strong> Étudier la branche infinie quand \(t \to +\infty\).</div>
  <div class="q"><strong>Q5.</strong> Montrer que le support est exactement la courbe d'équation \(y^2 = x^2(x + 1)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(x\) est paire et \(y\) impaire : \(M(-t)\) est le symétrique de \(M(t)\) par rapport à \((Ox)\). On étudie sur \([0, +\infty[\) et l'on complète par cette symétrie.</p>
  <p><strong>Q2.</strong> \(x'(t) = 2t\) et \(y'(t) = 3t^2 - 1\), jamais nuls ensemble : la courbe est régulière. Sur \([0, +\infty[\), \(x\) croît de \(-1\) à \(+\infty\) ; \(y\) décroît de 0 à \(y\big(\tfrac{1}{\sqrt3}\big) = -\tfrac{2\sqrt3}{9}\), puis croît vers \(+\infty\) ; on passe en \(M(1) = (0, 0)\).</p>
  <div><table>
    <tr><th>\(t\)</th><td>\(0\)</td><td></td><td>\(\frac{1}{\sqrt3}\)</td><td></td><td>\(1\)</td><td></td><td>\(+\infty\)</td></tr>
    <tr><th>\(x'(t)\)</th><td>\(0\)</td><td>\(+\)</td><td></td><td>\(+\)</td><td>\(2\)</td><td>\(+\)</td><td></td></tr>
    <tr><th>\(x(t)\)</th><td>\(-1\)</td><td>↗</td><td>\(-\frac23\)</td><td>↗</td><td>\(0\)</td><td>↗</td><td>\(+\infty\)</td></tr>
    <tr><th>\(y(t)\)</th><td>\(0\)</td><td>↘</td><td>\(-\frac{2\sqrt3}{9}\)</td><td>↗</td><td>\(0\)</td><td>↗</td><td>\(+\infty\)</td></tr>
    <tr><th>\(y'(t)\)</th><td>\(-1\)</td><td>\(-\)</td><td>\(0\)</td><td>\(+\)</td><td>\(2\)</td><td>\(+\)</td><td></td></tr>
  </table></div>
  <p>Tangente verticale en \(M(0) = (-1, 0)\) ; tangente horizontale en \(M\big(\tfrac{1}{\sqrt3}\big) = \big(-\tfrac23, -\tfrac{2\sqrt3}{9}\big)\) (et en son symétrique).</p>
  <p><strong>Q3.</strong> Si \(M(a) = M(b)\) avec \(a \neq b\), alors \(a^2 = b^2\), donc \(b = -a\) et \(a \neq 0\) ; puis \(y(-a) = -y(a)\) doit valoir \(y(a)\), d'où \(y(a) = a(a^2 - 1) = 0\), soit \(a = \pm 1\). Le seul point double est \(O = M(1) = M(-1)\). Les tangentes y sont dirigées par \(\overrightarrow{M'(1)} = (2, 2)\) et \(\overrightarrow{M'(-1)} = (-2, 2)\) : ce sont les droites \(y = x\) et \(y = -x\), perpendiculaires. L'arc \(t \in [-1, 1]\) forme une boucle contenue dans la bande \(-1 \leq x \leq 0\).</p>
  <p><strong>Q4.</strong> Quand \(t \to +\infty\), \(x\) et \(y\) tendent vers \(+\infty\) et \(\dfrac{y}{x} = t \to +\infty\) : branche parabolique de direction \((Oy)\).</p>
  <p><strong>Q5.</strong> Comme \(y = t(t^2 - 1) = t\,x\) et \(t^2 = x + 1\), tout point du support vérifie \(y^2 = t^2x^2 = x^2(x + 1)\). Réciproquement, soit \((x, y)\) tel que \(y^2 = x^2(x + 1)\). Si \(x = 0\), alors \(y = 0\) et c'est \(M(1)\). Sinon, on pose \(t = y/x\) : \(t^2 = x + 1\), donc \(x = t^2 - 1\) et \(y = t\,x = t^3 - t\), et le point est \(M(t)\). Le support est exactement cette courbe.</p></div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Astroïde : réduire le domaine d'étude</h3>
  <div class="statement">On considère l'astroïde \(t \mapsto M(t) = (\cos^3 t,\ \sin^3 t)\), \(t \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer qu'il suffit d'étudier la courbe sur \([0, \tfrac\pi4]\), en précisant les transformations qui permettent de compléter le tracé.</div>
  <div class="q"><strong>Q2.</strong> Étudier les variations sur \([0, \tfrac\pi4]\). Quels sont les points stationnaires de la courbe entière ?</div>
  <div class="q"><strong>Q3.</strong> Préciser la nature du point \(M(0)\).</div>
  <div class="q"><strong>Q4.</strong> Écrire une équation de la tangente en \(M(\tfrac\pi4)\).</div>
  <div class="q"><strong>Q5.</strong> Montrer que le support est contenu dans la courbe d'équation \(\sqrt[3]{x^2} + \sqrt[3]{y^2} = 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(x\) et \(y\) sont \(2\pi\)-périodiques : on étudie sur \([-\pi, \pi]\). \(M(-t) = (x, -y)\) : symétrie d'axe \((Ox)\), on se ramène à \([0, \pi]\). \(M(\pi - t) = (-x, y)\) : symétrie d'axe \((Oy)\), et \(t \mapsto \pi - t\) envoie \([0, \tfrac\pi2]\) sur \([\tfrac\pi2, \pi]\) : on se ramène à \([0, \tfrac\pi2]\). Enfin \(M(\tfrac\pi2 - t) = (\sin^3 t, \cos^3 t) = (y, x)\) : symétrie par rapport à la droite \(y = x\), et \(t \mapsto \tfrac\pi2 - t\) envoie \([0, \tfrac\pi4]\) sur \([\tfrac\pi4, \tfrac\pi2]\). On trace l'arc \(t \in [0, \tfrac\pi4]\), puis son symétrique par rapport à \(y = x\), puis le symétrique du tout par rapport à \((Oy)\), puis par rapport à \((Ox)\).</p>
  <p><strong>Q2.</strong> \(x'(t) = -3\cos^2 t\sin t \leq 0\) et \(y'(t) = 3\sin^2 t\cos t \geq 0\) sur \([0, \tfrac\pi4]\) : \(x\) décroît de 1 à \(\big(\tfrac{\sqrt2}{2}\big)^3 = \tfrac{\sqrt2}{4}\), \(y\) croît de 0 à \(\tfrac{\sqrt2}{4}\). Sur \(\mathbb{R}\), \(x'\) et \(y'\) sont nuls ensemble si et seulement si \(\sin t\cos t = 0\) : les points stationnaires sont les quatre points \((\pm1, 0)\) et \((0, \pm1)\).</p>
  <p><strong>Q3.</strong> \(\cos h = 1 - \tfrac{h^2}{2} + o(h^3)\) et \(\sin h = h + o(h^2)\) donnent \(\cos^3 h = 1 - \tfrac32 h^2 + o(h^3)\) et \(\sin^3 h = h^3 + o(h^3)\), donc
  </p><div class="formula">$$\begin{aligned} \overrightarrow{M(0)M(h)} &= h^2\,\Big(-\frac32, 0\Big) \\ &\quad + h^3\,(0, 1) + o(h^3). \end{aligned}$$</div><p>
  \(p = 2\), \(q = 3\) : rebroussement de 1ʳᵉ espèce, de tangente \((Ox)\). Par les symétries, les quatre points stationnaires sont des pointes : d'où le nom de la courbe, en forme d'étoile à quatre branches.</p>
  <p><strong>Q4.</strong> \(M(\tfrac\pi4) = \big(\tfrac{\sqrt2}{4}, \tfrac{\sqrt2}{4}\big)\) et \(\overrightarrow{M'(\tfrac\pi4)} = \tfrac{3\sqrt2}{4}(-1, 1)\). La tangente, dirigée par \((-1, 1)\), a pour équation \(x + y = \tfrac{\sqrt2}{2}\) : elle est perpendiculaire à l'axe de symétrie \(y = x\), comme il se doit.</p>
  <p><strong>Q5.</strong> La racine cubique réelle donne \(\sqrt[3]{x(t)} = \cos t\) et \(\sqrt[3]{y(t)} = \sin t\), donc \(\sqrt[3]{x^2} + \sqrt[3]{y^2} = \cos^2 t + \sin^2 t = 1\). (On retrouve cette courbe au chapitre Propriétés métriques : c'est l'enveloppe d'une échelle qui glisse.)</p></div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Trois études locales</h3>
  <div class="statement">Dans chaque cas, déterminer la nature du point de paramètre \(t = 0\) et la tangente en ce point.</div>
  <div class="q"><strong>Q1.</strong> \(M(t) = (t - \sin t,\ 1 - \cos t)\) (cycloïde : trajectoire d'un point d'une roue qui roule sur \((Ox)\)).</div>
  <div class="q"><strong>Q2.</strong> \(M(t) = (t^2 + t^3,\ t^2 + t^3 + t^4)\).</div>
  <div class="q"><strong>Q3.</strong> \(M(t) = (\tan t,\ \sin t)\), \(t \in \big]-\tfrac\pi2, \tfrac\pi2\big[\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(h - \sin h = \tfrac{h^3}{6} + o(h^3)\) et \(1 - \cos h = \tfrac{h^2}{2} + o(h^3)\), donc
  </p><div class="formula">$$\begin{aligned} \overrightarrow{OM(h)} &= h^2\,\Big(0, \frac12\Big) \\ &\quad + h^3\,\Big(\frac16, 0\Big) + o(h^3). \end{aligned}$$</div><p>
  \(p = 2\), \(q = 3\) : <strong>rebroussement de 1ʳᵉ espèce</strong>, de tangente verticale \((Oy)\). Le point de la roue qui touche le sol s'arrête, puis repart à la verticale.</p>
  <p><strong>Q2.</strong> Les coordonnées sont polynomiales :
  </p><div class="formula">$$\overrightarrow{OM(h)} = h^2\,(1, 1) + h^3\,(1, 1) + h^4\,(0, 1).$$</div><p>
  \(\vec a_2 = (1, 1)\) : \(p = 2\), tangente \(y = x\). \(\vec a_3 = \vec a_2\) est colinéaire à \(\vec a_2\) : il ne compte pas. \(\vec a_4 = (0, 1)\) ne l'est pas : \(q = 4\). \(p\) et \(q\) pairs : on vérifie que les deux demi-arcs sont distincts. Dans le repère \(\big(O ; (1, 1), (0, 1)\big)\), les coordonnées de \(M(h)\) sont \(X = h^2 + h^3\) et \(Y = y - x = h^4\) : pour \(h\) et \(-h\), même \(Y\) mais \(X\) différents. C'est un <strong>rebroussement de 2ᵉ espèce</strong>, les deux demi-arcs au-dessus de la droite \(y = x\) (\(Y \geq 0\)).</p>
  <p><strong>Q3.</strong> \(\tan h = h + \tfrac{h^3}{3} + o(h^3)\) et \(\sin h = h - \tfrac{h^3}{6} + o(h^3)\), donc
  </p><div class="formula">$$\begin{aligned} \overrightarrow{OM(h)} &= h\,(1, 1) \\ &\quad + h^3\,\Big(\frac13, -\frac16\Big) + o(h^3). \end{aligned}$$</div><p>
  \(p = 1\) (point régulier, tangente \(y = x\)), \(\vec a_2 = \vec 0\) et \(\det\big((1, 1), (\tfrac13, -\tfrac16)\big) = -\tfrac12 \neq 0\) : \(q = 3\). \(p\) et \(q\) impairs : <strong>point d'inflexion</strong>. Contrôle : \(y - x = -\tfrac{h^3}{2} + o(h^3)\) change de signe en 0, la courbe traverse sa tangente.</p></div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Tangentes perpendiculaires à une parabole : un lieu géométrique</h3>
  <div class="statement">On paramètre la parabole \(\mathcal{P}\) d'équation \(y = \dfrac{x^2}{4}\) par \(M(a) = (2a,\ a^2)\), \(a \in \mathbb{R}\), et l'on note \(T_a\) la tangente en \(M(a)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(T_a\) a pour équation \(y = a\,x - a^2\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(a \neq b\), montrer que \(T_a\) et \(T_b\) sont perpendiculaires si et seulement si \(ab = -1\), et calculer leur point d'intersection \(I\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer le lieu des points du plan par lesquels passent deux tangentes à \(\mathcal{P}\) perpendiculaires.</div>
  <div class="q"><strong>Q4.</strong> Lorsque \(ab = -1\), montrer que la corde \([M(a)M(b)]\) passe par le point \(F(0, 1)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\overrightarrow{M'(a)} = (2, 2a) \neq \vec 0\) : tout point est régulier. La tangente a pour équation \(2a(x - 2a) - 2(y - a^2) = 0\), soit \(y = a\,x - a^2\).</p>
  <p><strong>Q2.</strong> \(T_a\) et \(T_b\) sont dirigées par \((1, a)\) et \((1, b)\), orthogonaux si et seulement si \(1 + ab = 0\). Leur intersection vérifie \(a\,x - a^2 = b\,x - b^2\), soit \((a - b)x = a^2 - b^2\) : \(x = a + b\), puis \(y = a(a + b) - a^2 = ab\). Donc \(I = (a + b,\ ab)\).</p>
  <p><strong>Q3.</strong> Si \(ab = -1\), \(I = \big(a - \tfrac1a, -1\big)\) est sur la droite \(\Delta : y = -1\). Réciproquement, pour \(P = (x_0, -1)\), l'équation \(a^2 - x_0\,a - 1 = 0\) a un discriminant \(x_0^2 + 4 \gt 0\) : elle a deux racines \(a, b\) de produit \(-1\) et de somme \(x_0\), et \(T_a\), \(T_b\) sont perpendiculaires et se coupent en \((a + b, ab) = P\). Le lieu est la droite \(\Delta\) tout entière (c'est la directrice de la parabole, chapitre Coniques).</p>
  <p><strong>Q4.</strong> La droite \(\big(M(a)M(b)\big)\) a pour pente \(\dfrac{a^2 - b^2}{2a - 2b} = \dfrac{a + b}{2}\) et pour équation \(y = \dfrac{a + b}{2}\,x - ab\) (on vérifie qu'elle passe par \((2a, a^2)\)). En \(x = 0\), \(y = -ab = 1\) : la corde passe par \(F(0, 1)\), le foyer de la parabole.</p></div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Branches infinies et développements asymptotiques</h3>
  <div class="statement">On considère la courbe \(x(t) = \dfrac{t^2}{t + 1}\), \(y(t) = t\,e^{1/t}\), pour \(t \in \mathbb{R}\setminus\{-1, 0\}\).</div>
  <div class="q"><strong>Q1.</strong> Étudier la courbe quand \(t \to \pm\infty\) : asymptote et position.</div>
  <div class="q"><strong>Q2.</strong> Même question quand \(t \to -1\).</div>
  <div class="q"><strong>Q3.</strong> Étudier le comportement quand \(t \to 0^+\), puis quand \(t \to 0^-\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> La division donne exactement \(x = t - 1 + \dfrac{1}{t + 1}\), et \(\dfrac{1}{t + 1} = \dfrac1t + o\big(\tfrac1t\big)\). Avec \(e^{u} = 1 + u + \tfrac{u^2}{2} + o(u^2)\) pour \(u = 1/t \to 0\) :
  </p><div class="formula">$$\begin{aligned} x &= t - 1 + \frac1t + o\Big(\frac1t\Big), \\ y &= t + 1 + \frac{1}{2t} + o\Big(\frac1t\Big). \end{aligned}$$</div><p>
  Donc \(y/x \to 1\) et \(y - x = 2 - \dfrac{1}{2t} + o\big(\tfrac1t\big) \to 2\) : la droite \(y = x + 2\) est asymptote. Comme \(y - (x + 2) \sim -\dfrac{1}{2t}\), la courbe est au-dessous de l'asymptote quand \(t \to +\infty\), au-dessus quand \(t \to -\infty\).</p>
  <p><strong>Q2.</strong> Quand \(t \to -1\), \(|x| \to +\infty\) et \(y \to -e^{-1}\) : asymptote horizontale \(y = -\tfrac1e\). Pour la position, on pose \(t = -1 + h\) : \(\dfrac1t = -1 - h + o(h)\), donc \(e^{1/t} = e^{-1}\big(1 - h + o(h)\big)\) et
  </p><div class="formula">$$\begin{aligned} y &= (-1 + h)\,e^{-1}\big(1 - h + o(h)\big) \\ &= -\frac1e + \frac{2h}{e} + o(h). \end{aligned}$$</div><p>
  \(y + \tfrac1e\) a le signe de \(h\) : la courbe est au-dessous de l'asymptote pour \(t \to -1^-\) (où \(x \to -\infty\)) et au-dessus pour \(t \to -1^+\) (où \(x \to +\infty\)).</p>
  <p><strong>Q3.</strong> Quand \(t \to 0^+\), \(\tfrac1t \to +\infty\) et \(y = \dfrac{e^{1/t}}{1/t} \to +\infty\) par croissances comparées, tandis que \(x \sim t^2 \to 0^+\) : asymptote verticale \(x = 0\) (l'axe \((Oy)\)), la courbe étant à sa droite. Quand \(t \to 0^-\), \(e^{1/t} \to 0\), donc \(y \to 0\), et \(x \to 0\) : le point \(M(t)\) tend vers l'origine, il n'y a pas de branche infinie de ce côté (l'origine n'est atteinte pour aucune valeur du paramètre).</p></div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Le folium de Descartes</h3>
  <div class="statement">On considère \(x(t) = \dfrac{3t}{1 + t^3}\), \(y(t) = \dfrac{3t^2}{1 + t^3}\), pour \(t \neq -1\).</div>
  <div class="q"><strong>Q1.</strong> Pour \(t \neq 0\), comparer \(M(1/t)\) et \(M(t)\) ; en déduire une symétrie et un intervalle d'étude. Montrer que tout point du support vérifie \(x^3 + y^3 = 3xy\).</div>
  <div class="q"><strong>Q2.</strong> Étudier la branche infinie quand \(t \to -1\) : asymptote et position.</div>
  <div class="q"><strong>Q3.</strong> Que se passe-t-il quand \(t \to \pm\infty\) ? En déduire que la courbe passe deux fois au voisinage de \(O\) avec deux tangentes différentes.</div>
  <div class="q"><strong>Q4.</strong> Déterminer les points à tangente horizontale ou verticale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> En multipliant numérateur et dénominateur par \(t^3\) :
  </p><div class="formula">$$\begin{aligned} M(1/t) &= \Big(\frac{3/t}{1 + 1/t^3},\ \frac{3/t^2}{1 + 1/t^3}\Big) \\ &= \Big(\frac{3t^2}{t^3 + 1},\ \frac{3t}{t^3 + 1}\Big) \\ &= \big(y(t), x(t)\big). \end{aligned}$$</div><p>
  \(M(1/t)\) est le symétrique de \(M(t)\) par rapport à la droite \(y = x\). Comme \(t \mapsto 1/t\) échange \(]0, 1]\) et \([1, +\infty[\), ainsi que \(]-1, 0[\) et \(]-\infty, -1[\), on étudie sur \(]-1, 1]\). Enfin \(x^3 + y^3 = \dfrac{27t^3(1 + t^3)}{(1 + t^3)^3} = \dfrac{27t^3}{(1 + t^3)^2}\) et \(3xy = \dfrac{27t^3}{(1 + t^3)^2}\) : c'est la même chose.</p>
  <p><strong>Q2.</strong> Quand \(t \to -1\), \(x\) et \(y\) tendent vers l'infini et \(\dfrac yx = t \to -1\). Puis, avec \(1 + t^3 = (1 + t)(t^2 - t + 1)\) :
  </p><div class="formula">$$\begin{aligned} x + y &= \frac{3t(1 + t)}{1 + t^3} \\ &= \frac{3t}{t^2 - t + 1} \to -1, \\ x + y + 1 &= \frac{(t + 1)^2}{t^2 - t + 1}. \end{aligned}$$</div><p>
  La droite \(x + y + 1 = 0\), soit \(y = -x - 1\), est asymptote, et \(x + y + 1 \gt 0\) des deux côtés : la courbe est au-dessus de son asymptote.</p>
  <p><strong>Q3.</strong> Quand \(t \to \pm\infty\), \(x \sim \tfrac{3}{t^2} \to 0\) et \(y \sim \tfrac3t \to 0\) : \(M(t) \to O\), sans branche infinie. En \(t = 0\), \(M(0) = O\) et \(\overrightarrow{M'(0)} = (3, 0)\) : un premier arc passe par \(O\) avec la tangente \((Ox)\). Quand \(t \to \pm\infty\), le vecteur \(\overrightarrow{OM(t)}\) est dirigé par \((1, t)\), dont la direction tend vers celle de \((Oy)\) : le second arc arrive en \(O\) tangentiellement à \((Oy)\) (c'est l'image du premier par la symétrie d'axe \(y = x\)). La courbe se recoupe en \(O\) à angle droit, en formant une boucle dans le quart de plan \(x, y \geq 0\) (\(t \gt 0\)).</p>
  <p><strong>Q4.</strong> Après calcul,
  </p><div class="formula">$$\begin{aligned} x'(t) &= \frac{3(1 - 2t^3)}{(1 + t^3)^2}, \\ y'(t) &= \frac{3t\,(2 - t^3)}{(1 + t^3)^2}. \end{aligned}$$</div><p>
  Tangente verticale pour \(t^3 = \tfrac12\), au point \(\big(\sqrt[3]{4}, \sqrt[3]{2}\big)\) ; tangente horizontale pour \(t = 0\), en \(O\), et pour \(t^3 = 2\), au point \(\big(\sqrt[3]{2}, \sqrt[3]{4}\big)\), symétrique du précédent par rapport à \(y = x\). Il n'y a pas de point stationnaire.</p></div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>La cissoïde de Dioclès : lieu géométrique, étude et points alignés</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : lieu géométrique, étude d'une courbe paramétrée, étude locale, asymptote, alignement).</div>
  <div class="statement">Le plan est rapporté à un repère orthonormé \((O ; \vec\imath, \vec\jmath)\). On note \(A = (1, 0)\), \(\mathcal{C}\) le cercle de diamètre \([OA]\) et \(\Delta\) la droite d'équation \(x = 1\), tangente à \(\mathcal{C}\) en \(A\). Pour \(t \in \mathbb{R}\), \(D_t\) est la droite passant par \(O\) de pente \(t\) (d'équation \(y = t\,x\)).</div>

  <p class="exo-part">Partie A — Le lieu</p>
  <div class="q"><strong>A1.</strong> Montrer que \(\mathcal{C}\) a pour équation \(x^2 + y^2 = x\), que \(D_t\) recoupe \(\mathcal{C}\) en \(P(t) = \Big(\dfrac{1}{1 + t^2}, \dfrac{t}{1 + t^2}\Big)\) et coupe \(\Delta\) en \(Q(t) = (1, t)\).</div>
  <div class="q"><strong>A2.</strong> On définit \(M(t)\) par \(\overrightarrow{OM(t)} = \overrightarrow{P(t)Q(t)}\). Montrer que
  <div class="formula">$$M(t) = \Big(\frac{t^2}{1 + t^2},\ \frac{t^3}{1 + t^2}\Big).$$</div>
  Le lieu \(\Gamma\) des points \(M(t)\), \(t \in \mathbb{R}\), est appelé <strong>cissoïde</strong>.</div>

  <p class="exo-part">Partie B — Étude de la courbe</p>
  <div class="q"><strong>B1.</strong> Montrer que l'on peut réduire l'étude à \([0, +\infty[\).</div>
  <div class="q"><strong>B2.</strong> Calculer \(x'\) et \(y'\) et dresser le tableau de variations conjoint sur \([0, +\infty[\).</div>
  <div class="q"><strong>B3.</strong> Étudier la courbe au voisinage de \(t = 0\).</div>
  <div class="q"><strong>B4.</strong> Étudier la branche infinie quand \(t \to +\infty\).</div>
  <div class="q"><strong>B5.</strong> Montrer que \(\Gamma\) est exactement la courbe d'équation \(y^2(1 - x) = x^3\).</div>

  <p class="exo-part">Partie C — Points alignés</p>
  <div class="q"><strong>C1.</strong> Soit \(\mathcal{D}\) une droite d'équation \(u\,x + v\,y + w = 0\) avec \(v \neq 0\). Montrer que \(M(t) \in \mathcal{D}\) si et seulement si \(v\,t^3 + (u + w)\,t^2 + w = 0\).</div>
  <div class="q"><strong>C2.</strong> Montrer qu'une droite verticale coupe \(\Gamma\) en au plus deux points. En déduire que, pour \(a, b, c\) réels distincts, les points \(M(a)\), \(M(b)\), \(M(c)\) sont alignés si et seulement si \(ab + bc + ca = 0\).</div>
  <div class="q"><strong>C3.</strong> Soit \(a \neq 0\). Montrer que la tangente en \(M(a)\) n'est pas verticale, puis qu'elle recoupe \(\Gamma\) en un unique autre point, de paramètre \(-a/2\). (On pourra montrer que \(a\) est racine double du polynôme de C1.)</div>
  <div class="q"><strong>C4.</strong> Vérifier ce résultat pour \(a = 2\) en écrivant la tangente en \(M(2)\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>A1.</strong> \(\mathcal{C}\) a pour centre \((\tfrac12, 0)\) et pour rayon \(\tfrac12\) : \(\big(x - \tfrac12\big)^2 + y^2 = \tfrac14\) équivaut à \(x^2 + y^2 = x\). En reportant \(y = t\,x\) : \(x^2(1 + t^2) = x\), d'où \(x = 0\) (le point \(O\)) ou \(x = \dfrac{1}{1 + t^2}\), qui donne \(P(t)\). L'intersection avec \(x = 1\) est \(Q(t) = (1, t)\).</p>
  <p><strong>A2.</strong> On calcule
  </p><div class="formula">$$\begin{aligned} \overrightarrow{P(t)Q(t)} &= \Big(1 - \frac{1}{1 + t^2},\ t - \frac{t}{1 + t^2}\Big) \\ &= \Big(\frac{t^2}{1 + t^2},\ \frac{t^3}{1 + t^2}\Big). \end{aligned}$$</div><p>
  (Pour \(t = 0\), \(D_0 = (Ox)\) recoupe le cercle en \(A = Q(0)\), et \(M(0) = O\).)</p>
  <p><strong>B1.</strong> \(x\) est paire et \(y\) impaire : \(\Gamma\) est symétrique par rapport à \((Ox)\). On étudie sur \([0, +\infty[\).</p>
  <p><strong>B2.</strong> Après calcul,
  </p><div class="formula">$$\begin{aligned} x'(t) &= \frac{2t}{(1 + t^2)^2}, \\ y'(t) &= \frac{t^2(t^2 + 3)}{(1 + t^2)^2}. \end{aligned}$$</div><p>
  Sur \(]0, +\infty[\), les deux sont strictement positives : \(x\) croît de 0 à 1 (limite en \(+\infty\)) et \(y\) croît de 0 à \(+\infty\). Le seul point stationnaire est \(M(0) = O\). Le point se déplace toujours vers la droite et vers le haut.</p>
  <p><strong>B3.</strong> \(\dfrac{1}{1 + t^2} = 1 - t^2 + o(t^2)\), donc \(x = t^2 + o(t^3)\) et \(y = t^3 + o(t^3)\) :
  </p><div class="formula">$$\overrightarrow{OM(t)} = t^2\,(1, 0) + t^3\,(0, 1) + o(t^3).$$</div><p>
  \(p = 2\), \(q = 3\) : rebroussement de 1ʳᵉ espèce en \(O\), de tangente \((Ox)\).</p>
  <p><strong>B4.</strong> Quand \(t \to +\infty\), \(x \to 1\) et \(y \to +\infty\) : la droite \(\Delta\) (\(x = 1\)) est asymptote verticale. Comme \(1 - x = \dfrac{1}{1 + t^2} \gt 0\), la courbe est à gauche de \(\Delta\).</p>
  <p><strong>B5.</strong> Pour tout \(t\), \(1 - x(t) = \dfrac{1}{1 + t^2}\), donc \(y^2(1 - x) = \dfrac{t^6}{(1 + t^2)^3} = x^3\). Réciproquement, si \(y^2(1 - x) = x^3\) : \(x = 1\) est impossible (on aurait \(1 = 0\)), donc \(y^2 = \dfrac{x^3}{1 - x} \geq 0\) impose \(0 \leq x \lt 1\). Si \(x = 0\), alors \(y = 0\) : c'est \(M(0)\). Sinon on pose \(t = y/x\) : \(t^2 = \dfrac{y^2}{x^2} = \dfrac{x}{1 - x}\), d'où \(x = \dfrac{t^2}{1 + t^2}\) et \(y = t\,x = \dfrac{t^3}{1 + t^2}\) : le point est \(M(t)\).</p>
  <p><strong>C1.</strong> \(M(t) \in \mathcal{D}\) s'écrit \(u\dfrac{t^2}{1 + t^2} + v\dfrac{t^3}{1 + t^2} + w = 0\) ; en multipliant par \(1 + t^2 \gt 0\), c'est \(v\,t^3 + (u + w)\,t^2 + w = 0\).</p>
  <p><strong>C2.</strong> Sur la droite \(x = k\), les paramètres vérifient \(\dfrac{t^2}{1 + t^2} = k\), qui fixe \(t^2\) : au plus deux valeurs \(\pm t\), donc au plus deux points.
  (\(\Rightarrow\)) Si \(M(a), M(b), M(c)\) sont alignés sur une droite \(\mathcal{D}\), elle n'est pas verticale (elle contient trois points de \(\Gamma\)), donc \(v \neq 0\) : \(a, b, c\) sont trois racines distinctes du polynôme de degré 3 de C1, donc toutes ses racines, et les relations entre coefficients et racines donnent \(ab + bc + ca = \dfrac{0}{v} = 0\) (le polynôme n'a pas de terme en \(t\)).
  (\(\Leftarrow\)) Supposons \(ab + bc + ca = 0\), et soit \(\mathcal{D}\) la droite \(\big(M(a)M(b)\big)\). Si elle était verticale, on aurait \(b = -a\) ; alors \(ab + c(a + b) = -a^2 = 0\), donc \(a = b = 0\) : contradiction. Donc \(v \neq 0\), et le polynôme de C1 a pour racines \(a\), \(b\) et une troisième \(c'\) avec \(ab + bc' + c'a = 0\), soit \(c'(a + b) = -ab = c(a + b)\). Si \(a + b = 0\), alors \(ab = 0\) et \(a = b = 0\), exclu ; donc \(c' = c\) et \(M(c) \in \mathcal{D}\).</p>
  <p><strong>C3.</strong> D'après B2, \(x'(a) \neq 0\) pour \(a \neq 0\) : la tangente en \(M(a)\) n'est pas verticale. Écrivons-la \(u\,x + v\,y + w = 0\) avec \(v \neq 0\) et posons \(\varphi(t) = u\,x(t) + v\,y(t) + w\) : \(\varphi(a) = 0\) et \(\varphi'(a) = u\,x'(a) + v\,y'(a) = 0\), car \((u, v)\) est normal à la tangente, dirigée par \(\overrightarrow{M'(a)}\). Le polynôme \(P(t) = (1 + t^2)\varphi(t)\) de C1 vérifie alors \(P(a) = 0\) et \(P'(a) = 2a\,\varphi(a) + (1 + a^2)\varphi'(a) = 0\) : \(a\) est racine double. Sa troisième racine \(c\) vérifie \(a \cdot a + ac + ca = 0\), soit \(c = -\dfrac a2\), différente de \(a\). La tangente recoupe \(\Gamma\) en \(M(-a/2)\) et en aucun autre point.</p>
  <p><strong>C4.</strong> \(M(2) = \big(\tfrac45, \tfrac85\big)\) et \(\overrightarrow{M'(2)} = \big(\tfrac{4}{25}, \tfrac{28}{25}\big)\), colinéaire à \((1, 7)\). La tangente est \(y - \tfrac85 = 7\big(x - \tfrac45\big)\). Pour \(x = \tfrac12\) : \(y = \tfrac{16}{10} - \tfrac{21}{10} = -\tfrac12\). C'est bien \(M(-1) = \big(\tfrac12, -\tfrac12\big)\).</p></div>
</div>
