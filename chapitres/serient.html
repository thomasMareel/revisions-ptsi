<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre en entier la partie « Séries entières » du programme de PT : généralités et rayon de convergence, régularité de la somme d'une variable réelle, développements en série entière des fonctions usuelles, séries géométrique et exponentielle d'une variable complexe. Il s'appuie sur le chapitre « Séries numériques » (convergence absolue, règle de d'Alembert, produit de Cauchy) et sert ensuite aux équations différentielles (solutions développables en série entière) et aux probabilités (fonctions génératrices).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Séries entières</strong> de variable réelle ou complexe ; <strong>lemme d'Abel</strong> (§1).</li>
        <li><strong>Rayon de convergence</strong>, défini comme borne supérieure ; disque ouvert et intervalle ouvert de convergence ; convergence absolue si \(|z| \lt R\), divergence grossière si \(|z| \gt R\) (§2).</li>
        <li><strong>Calcul du rayon</strong> : \(R\big(\sum n^\alpha x^n\big) = 1\) ; comparaison des rayons (\(|a_n| \leq |b_n|\), \(O\), \(o\), \(\sim\)) ; règle de d'Alembert, la limite de \(\frac{|a_{n+1}|}{|a_n|}\) pouvant être utilisée directement (§3).</li>
        <li><strong>Somme et produit de Cauchy</strong> de deux séries entières (§4).</li>
        <li><strong>Fonction somme</strong> d'une variable réelle : continuité sur l'intervalle de définition, primitivation terme à terme, \(R\big(\sum a_n x^n\big) = R\big(\sum n a_n x^n\big)\), classe \(C^\infty\) et dérivation terme à terme (démonstrations hors programme) ; coefficients à l'aide des dérivées en 0 (§5).</li>
        <li><strong>Fonction développable en série entière</strong> sur \(]-r, r[\), série de Taylor, formule de Taylor avec reste intégral, unicité du développement (§6).</li>
        <li><strong>Développements usuels</strong> : exponentielle, cosinus, sinus, cosinus et sinus hyperboliques, Arctan, \(x \mapsto \frac{1}{1-x}\), \(x \mapsto \ln(1+x)\), \(x \mapsto (1+x)^\alpha\) (§7) ; développer une fonction à l'aide d'une <strong>équation différentielle linéaire</strong> (§8).</li>
        <li><strong>Variable complexe</strong> : fonction développable sur un disque ouvert ; développements de \(\frac{1}{1-z}\) sur le disque unité et de \(\exp(z)\) sur \(\mathbb{C}\) (§9).</li>
        <li><strong>Applications</strong> : sommes de séries numériques, équations différentielles, fonctions génératrices (§10).</li>
      </ul>
      <p>Hors programme : les études au bord de l'intervalle de convergence au-delà du théorème de continuité (le théorème d'Abel radial n'est pas à formaliser), la règle de Cauchy-Hadamard, les fonctions d'une variable complexe autres que l'exponentielle et \(z \mapsto \frac{1}{1-z}\) (fin de chapitre).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · SÉRIES ENTIÈRES ET LEMME D'ABEL</div>
  <h2>Des polynômes de degré infini</h2>
  <div class="intro">Une série entière est un « polynôme » \(a_0 + a_1 z + a_2 z^2 + \cdots\) qui ne s'arrête pas. Deux questions la gouvernent : pour quels \(z\) la série converge-t-elle, et quelles propriétés a sa somme ? Le lemme d'Abel répond à la première en montrant que l'ensemble de convergence a toujours la forme d'un disque.</div>

  <div class="def-box">
    Soit \((a_n)_{n \geq 0}\) une suite de nombres complexes. La <strong>série entière</strong> de coefficients \((a_n)\) est la série \(\sum a_n z^n\), où \(z\) est une variable complexe ; pour chaque valeur de \(z\), c'est une série numérique. Quand la variable est réelle, on l'écrit \(\sum a_n x^n\). Par convention \(z^0 = 1\), si bien que toute série entière converge en \(z = 0\), de somme \(a_0\).
  </div>
  <div class="method-box">
    <strong>Exemple — quatre comportements</strong>
    <ol>
      <li><strong>Polynômes</strong> : si \(a_n = 0\) à partir d'un certain rang, la série converge pour tout \(z\).</li>
      <li><strong>Série géométrique</strong> \(\sum z^n\) : converge si et seulement si \(|z| \lt 1\), de somme \(\frac{1}{1-z}\).</li>
      <li><strong>Série exponentielle</strong> \(\sum \frac{z^n}{n!}\) : converge absolument pour tout \(z\) (règle de d'Alembert), de somme \(e^z\).</li>
      <li><strong>Série \(\sum n!\,z^n\)</strong> : pour \(z \neq 0\), \(\frac{(n+1)!\,|z|^{n+1}}{n!\,|z|^n} = (n+1)|z| \to +\infty\), la série diverge grossièrement ; elle ne converge qu'en 0.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Lemme d'Abel.</strong> Soit \(z_0 \in \mathbb{C}\) tel que la suite \((a_n z_0^n)\) soit <strong>bornée</strong>. Alors, pour tout complexe \(z\) tel que \(|z| \lt |z_0|\), la série \(\sum a_n z^n\) converge absolument.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Factoriser par \(a_n z_0^n\) et comparer à une série géométrique.</span>
    <div class="content"><p>Soit \(M\) un majorant de \(|a_n z_0^n|\) et \(z\) tel que \(|z| \lt |z_0|\) (donc \(z_0 \neq 0\)). On pose \(q = \frac{|z|}{|z_0|} \in [0, 1[\). Alors \(|a_n z^n| = |a_n z_0^n| \cdot \left|\frac{z}{z_0}\right|^n \leq M q^n\). Le terme général de la série à termes positifs \(\sum |a_n z^n|\) est majoré par celui d'une série géométrique convergente : elle converge.</p></div>
  </div>

    <strong>Conséquence.</strong> Si la série \(\sum a_n z_0^n\) <strong>converge</strong>, son terme général tend vers 0, donc est borné : la série \(\sum a_n z^n\) converge absolument pour tout \(|z| \lt |z_0|\). Une seule convergence en un point se propage à tout le disque ouvert de rayon \(|z_0|\).
  </div>
  <div class="method-box">
    <strong>Exemple — une convergence en un point suffit</strong>
    <p>La série \(\sum \frac{(-1)^n}{n+1}x^n\) converge en \(x = 1\) (série alternée). Par le lemme d'Abel, elle converge absolument pour tout \(|x| \lt 1\), réel ou complexe. En \(x = 1\) même, la convergence n'est pas absolue (la série \(\sum \frac{1}{n+1}\) diverge), et le lemme ne dit rien des autres points du cercle \(|x| = 1\).</p>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · RAYON DE CONVERGENCE</div>
  <h2>Un disque de convergence absolue, un extérieur de divergence</h2>
  <div class="intro">Le lemme d'Abel montre que, si la série converge en un point, elle converge mieux encore plus près de 0. Il existe donc un rayon critique qui sépare la convergence de la divergence : c'est le rayon de convergence, le premier renseignement à obtenir sur toute série entière.</div>

  <div class="def-box">
    Le <strong>rayon de convergence</strong> de la série entière \(\sum a_n z^n\) est
    <div class="formula" data-nom="Rayon de convergence">$$R = \sup\big\{ r \geq 0 \ :\ (a_n r^n) \text{ est bornée} \big\}.$$</div>
    C'est un élément de \([0, +\infty]\). L'ensemble est non vide (il contient 0), et c'est un intervalle de \(\mathbb{R}_+\) : si \((a_n r^n)\) est bornée, \((a_n \rho^n)\) l'est aussi pour \(\rho \leq r\). Le <strong>disque ouvert de convergence</strong> est \(\{z \in \mathbb{C},\ |z| \lt R\}\) ; pour une variable réelle, on parle de l'<strong>intervalle ouvert de convergence</strong> \(]-R, R[\).
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(R\) le rayon de convergence de \(\sum a_n z^n\).
    <ul>
      <li>Si \(|z| \lt R\), la série \(\sum a_n z^n\) converge <strong>absolument</strong>.</li>
      <li>Si \(|z| \gt R\), la suite \((a_n z^n)\) n'est pas bornée : la série <strong>diverge grossièrement</strong>.</li>
      <li>Si \(|z| = R\), on ne peut rien dire en général : chaque point du cercle s'étudie séparément.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une borne supérieure, puis le lemme d'Abel.</span>
    <div class="content"><p>Si \(|z| \lt R\), par définition de la borne supérieure il existe \(r\) tel que \(|z| \lt r \leq R\) et \((a_n r^n)\) bornée ; le lemme d'Abel (appliqué à \(z_0 = r\)) donne la convergence absolue en \(z\). Si \(|z| \gt R\) et si \((a_n z^n)\) était bornée, \(|z|\) appartiendrait à l'ensemble dont \(R\) est la borne supérieure, d'où \(|z| \leq R\) : contradiction. Une suite non bornée ne tend pas vers 0.</p></div>
  </div>
  <div class="prop-box">
    <strong>Encadrer \(R\) à partir d'un point.</strong> Pour \(z_0 \in \mathbb{C}\) :
    <ul>
      <li>si \(\sum a_n z_0^n\) converge, ou seulement si \((a_n z_0^n)\) est bornée, alors \(R \geq |z_0|\) ;</li>
      <li>si \(\sum a_n z_0^n\) diverge, alors \(R \leq |z_0|\) ;</li>
      <li>si \(\sum a_n z_0^n\) converge sans converger absolument, alors \(R = |z_0|\) (le point \(z_0\) est forcément sur le cercle).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — le rayon par deux points</strong>
    <ol>
      <li>\(\sum \frac{x^n}{n}\) (\(n \geq 1\)) : en \(x = -1\), la série alternée \(\sum \frac{(-1)^n}{n}\) converge sans converger absolument. Donc \(R = 1\).</li>
      <li>\(\sum (2 + (-1)^n)\,z^n\) : les coefficients valent 1 ou 3 ; la suite \((a_n \cdot 1^n)\) est bornée, donc \(R \geq 1\) ; en \(z = 1\), le terme général ne tend pas vers 0, la série diverge, donc \(R \leq 1\). Ainsi \(R = 1\). (Ici, le rapport \(\frac{a_{n+1}}{a_n}\) oscille entre \(\frac13\) et 3 : la règle de d'Alembert ne s'applique pas.)</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — sur le cercle, tout est possible</strong>
    <p>Les trois séries suivantes ont pour rayon 1 :</p>
    <ol>
      <li>\(\sum z^n\) diverge (grossièrement) en <strong>tout</strong> point du cercle \(|z| = 1\) ;</li>
      <li>\(\sum \frac{z^n}{n^2}\) converge absolument en <strong>tout</strong> point du cercle, puisque \(\left|\frac{z^n}{n^2}\right| = \frac{1}{n^2}\) ;</li>
      <li>\(\sum \frac{z^n}{n}\) diverge en \(z = 1\) et converge en \(z = -1\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire « la série converge sur \([-R, R]\) » ou « sur \(]-R, R[\) seulement ». Le rayon décrit l'intérieur et l'extérieur du disque, jamais son bord. Le programme ne demande pas d'étude systématique au bord, mais quand l'énoncé la demande, il faut étudier séparément la série numérique obtenue en chaque point.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CALCUL DU RAYON</div>
  <h2>Comparer les coefficients, ou appliquer d'Alembert</h2>
  <div class="intro">On calcule rarement un rayon par la définition. On compare les coefficients à ceux d'une série dont on connaît le rayon, ou l'on applique la règle de d'Alembert au terme général. Un résultat sert de pivot : multiplier les coefficients par une puissance de \(n\) ne change pas le rayon.</div>

  <div class="prop-box">
    <strong>Comparaison des rayons.</strong> Soit \(R_a\) et \(R_b\) les rayons de \(\sum a_n z^n\) et \(\sum b_n z^n\).
    <ul>
      <li>Si \(|a_n| \leq |b_n|\) à partir d'un certain rang, alors \(R_a \geq R_b\).</li>
      <li>Si \(a_n = O(b_n)\), en particulier si \(a_n = o(b_n)\), alors \(R_a \geq R_b\).</li>
      <li>Si \(a_n \sim b_n\), alors \(R_a = R_b\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une inclusion d'ensembles, puis les bornes supérieures.</span>
    <div class="content"><p>Si \(|a_n| \leq M|b_n|\) à partir d'un rang \(N\) (cas \(O\), qui contient le cas \(\leq\)) et si \((b_n r^n)\) est bornée, alors \((a_n r^n)\) l'est aussi (les premiers termes, en nombre fini, ne changent rien). L'ensemble des \(r\) admissibles pour \((b_n)\) est inclus dans celui de \((a_n)\), d'où \(R_b \leq R_a\). Si \(a_n \sim b_n\), on a à la fois \(a_n = O(b_n)\) et \(b_n = O(a_n)\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Séries de référence.</strong> Pour tout réel \(\alpha\), \(R\big(\sum n^\alpha x^n\big) = 1\). En conséquence, une série entière et sa « série dérivée » ont le même rayon :
    <div class="formula" data-nom="Rayon de la série dérivée">$$R\Big(\sum a_n x^n\Big) = R\Big(\sum n\,a_n x^n\Big).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Croissances comparées, puis le lemme d'Abel.</span>
    <div class="content">
      <p><strong>\(\sum n^\alpha x^n\)</strong> : pour \(0 \leq r \lt 1\), \(n^\alpha r^n \to 0\) (croissances comparées), la suite est bornée et \(R \geq 1\) ; pour \(r \gt 1\), \(n^\alpha r^n \to +\infty\), donc \(R \leq 1\).</p>
      <p><strong>Série dérivée</strong> : notons \(R\) et \(R'\) les deux rayons. Comme \(|a_n| \leq n|a_n|\) pour \(n \geq 1\), \(R \geq R'\). Inversement, soit \(|z| \lt R\) et \(r\) tel que \(|z| \lt r \lt R\) : la suite \((a_n r^n)\) est bornée par un \(M\), et \(n|a_n z^n| \leq M\, n \left(\frac{|z|}{r}\right)^n\), terme d'une série convergente (rayon 1 de \(\sum n x^n\), avec \(\frac{|z|}{r} \lt 1\)). Donc \(\sum n a_n z^n\) converge pour tout \(|z| \lt R\), et \(R' \geq R\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Règle de d'Alembert pour le rayon.</strong> Si \(a_n \neq 0\) à partir d'un certain rang et \(\left|\dfrac{a_{n+1}}{a_n}\right| \to \ell \in [0, +\infty]\), alors
    <div class="formula" data-nom="Rayon par d'Alembert">$$R = \frac{1}{\ell},$$</div>
    avec les conventions \(R = +\infty\) si \(\ell = 0\) et \(R = 0\) si \(\ell = +\infty\). En effet, pour \(z \neq 0\), le rapport \(\left|\frac{a_{n+1}z^{n+1}}{a_n z^n}\right|\) tend vers \(\ell|z|\) : la série numérique converge absolument si \(\ell |z| \lt 1\) et diverge grossièrement si \(\ell|z| \gt 1\).
  </div>
  <div class="method-box">
    <strong>Exemple — cinq rayons</strong>
    <ol>
      <li>\(a_n = \dfrac{n!}{n^n}\) : \(\dfrac{a_{n+1}}{a_n} = \left(\dfrac{n}{n+1}\right)^n = \left(1 + \dfrac1n\right)^{-n} \to \dfrac1e\), donc \(R = e\).</li>
      <li>\(a_n = \dfrac{(2n)!}{(n!)^2}\) : \(\dfrac{a_{n+1}}{a_n} = \dfrac{(2n+2)(2n+1)}{(n+1)^2} \to 4\), donc \(R = \dfrac14\).</li>
      <li>\(a_n = \dfrac{1}{2^n + 3^n} \sim \dfrac{1}{3^n}\) : même rayon que \(\sum \left(\frac{z}{3}\right)^n\), soit \(R = 3\).</li>
      <li>\(a_n = \ln n\) (\(n \geq 1\)) : pour \(n \geq 3\), \(1 \leq \ln n \leq n\), donc \(R\) est compris entre \(R\big(\sum n x^n\big) = 1\) et \(R\big(\sum x^n\big) = 1\) : \(R = 1\).</li>
      <li>\(a_n = \sin\dfrac1n \sim \dfrac1n\) : \(R = 1\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode — séries lacunaires</strong>
    <p>Quand une infinité de coefficients sont nuls (seules les puissances paires, ou multiples de 3, apparaissent), le rapport \(\frac{a_{n+1}}{a_n}\) n'a pas de sens. On applique alors la règle de d'Alembert à la <strong>série numérique</strong> \(\sum u_n\) écrite avec ses termes non nuls, à \(z\) fixé.</p>
    <ol>
      <li>\(\sum \dfrac{n}{4^n}z^{2n}\) : avec \(u_n = \dfrac{n}{4^n}z^{2n}\), \(\left|\dfrac{u_{n+1}}{u_n}\right| = \dfrac{n+1}{n}\cdot\dfrac{|z|^2}{4} \to \dfrac{|z|^2}{4}\). Convergence absolue si \(|z| \lt 2\), divergence grossière si \(|z| \gt 2\) : \(R = 2\).</li>
      <li>\(\sum 2^n z^{3n}\) : c'est la série géométrique de raison \(2z^3\), qui converge si et seulement si \(|z|^3 \lt \frac12\) : \(R = 2^{-1/3}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(R = \ell\) au lieu de \(R = \frac1\ell\), ou mélanger les deux points de vue. Soit on calcule la limite \(\ell\) du rapport des <strong>coefficients</strong> et \(R = \frac1\ell\) ; soit on applique d'Alembert au <strong>terme</strong> \(a_n z^n\) et l'on obtient la condition \(\ell|z| \lt 1\) : les deux mènent au même résultat, mais pas en mêlant les étapes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SOMME ET PRODUIT DE CAUCHY</div>
  <h2>Opérations sur les séries entières</h2>
  <div class="intro">On additionne et l'on multiplie les séries entières comme des polynômes, coefficient par coefficient, à l'intérieur du plus petit des deux disques de convergence. Le rayon du résultat est au moins le plus petit des deux rayons, et il peut être plus grand.</div>

  <div class="prop-box">
    <strong>Somme.</strong> La série \(\sum (a_n + b_n)z^n\) a un rayon \(R \geq \min(R_a, R_b)\), avec <strong>égalité si \(R_a \neq R_b\)</strong>, et pour \(|z| \lt \min(R_a, R_b)\) :
    <div class="formula">$$\begin{aligned} \sum_{n=0}^{+\infty}(a_n + b_n)z^n &= \sum_{n=0}^{+\infty} a_n z^n\\ &\quad + \sum_{n=0}^{+\infty} b_n z^n. \end{aligned}$$</div>
  </div>
  <div class="prop-box">
    <strong>Produit de Cauchy.</strong> La série entière \(\sum c_n z^n\), avec \(c_n = \sum_{k=0}^{n} a_k b_{n-k}\), a un rayon \(R \geq \min(R_a, R_b)\), et pour \(|z| \lt \min(R_a, R_b)\) :
    <div class="formula" data-nom="Produit de Cauchy de deux séries entières">$$\Big(\sum_{n=0}^{+\infty} a_n z^n\Big)\Big(\sum_{n=0}^{+\infty} b_n z^n\Big) = \sum_{n=0}^{+\infty} c_n z^n.$$</div>
    C'est le produit de Cauchy des deux séries numériques \(\sum a_n z^n\) et \(\sum b_n z^n\), absolument convergentes dans le disque (chapitre « Séries numériques »).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi l'égalité \(R = \min(R_a, R_b)\) quand les rayons diffèrent ?</span>
    <div class="content"><p>Pour \(|z| \lt \min(R_a, R_b)\), les deux séries convergent, donc leur somme aussi : \(R \geq \min(R_a, R_b)\). Supposons \(R_a \lt R_b\) et prenons \(z\) avec \(R_a \lt |z| \lt R_b\) : \(\sum b_n z^n\) converge et \(\sum a_n z^n\) diverge, donc la somme diverge, et \(R \leq |z|\). Ceci pour tout \(|z|\) de \(]R_a, R_b[\) : \(R \leq R_a\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — un produit, puis une vérification</strong>
    <ol>
      <li>Pour \(|z| \lt \frac12\), \(\dfrac{1}{1-z} = \sum z^n\) (rayon 1) et \(\dfrac{1}{1-2z} = \sum 2^n z^n\) (rayon \(\frac12\)). Leur produit de Cauchy a pour coefficient \(c_n = \sum_{k=0}^{n} 2^k = 2^{n+1} - 1\).</li>
      <li>Donc \(\dfrac{1}{(1-z)(1-2z)} = \displaystyle\sum_{n=0}^{+\infty} (2^{n+1} - 1)\,z^n\) pour \(|z| \lt \frac12\), et le rapport \(\frac{c_{n+1}}{c_n} \to 2\) montre que le rayon vaut exactement \(\frac12\).</li>
      <li>Vérification par décomposition en éléments simples : \(\dfrac{1}{(1-z)(1-2z)} = \dfrac{2}{1-2z} - \dfrac{1}{1-z}\), de coefficient \(2 \cdot 2^n - 1\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Le rayon d'une somme peut dépasser le minimum</strong> quand les deux rayons sont égaux : \(\sum z^n\) et \(\sum (2^{-n} - 1)\,z^n\) ont pour rayon 1, mais leur somme \(\sum \frac{z^n}{2^n}\) a pour rayon 2 (les termes divergents se compensent).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RÉGULARITÉ DE LA SOMME</div>
  <h2>Variable réelle : continuité, primitive, dérivées</h2>
  <div class="intro">À l'intérieur de l'intervalle de convergence, la somme d'une série entière se comporte comme un polynôme : on la dérive et on la primitive terme à terme, autant de fois qu'on veut, sans changer le rayon. Ces théorèmes, admis, sont le moteur de tous les calculs de la suite du chapitre.</div>

  <div class="def-box">
    Soit \(\sum a_n x^n\) une série entière de variable réelle, de rayon \(R \gt 0\). Sa <strong>fonction somme</strong> \(S(x) = \sum_{n=0}^{+\infty} a_n x^n\) est définie sur l'ensemble des réels où la série converge : un intervalle, l'<strong>intervalle de définition</strong>, qui contient \(]-R, R[\) et est contenu dans \([-R, R]\).
  </div>
  <div class="prop-box">
    <strong>Théorème de continuité</strong> (démonstration hors programme). La fonction somme est continue sur son intervalle de définition, bornes comprises quand la série y converge.
  </div>
  <div class="prop-box">
    <strong>Primitivation terme à terme</strong> (démonstration hors programme). Sur \(]-R, R[\), la primitive de \(S\) qui s'annule en 0 est la somme d'une série entière de même rayon :
    <div class="formula" data-nom="Primitivation terme à terme">$$\int_0^x S(t)\,\mathrm{d}t = \sum_{n=0}^{+\infty} \frac{a_n}{n+1}\,x^{n+1}.$$</div>
  </div>
  <div class="prop-box">
    <strong>Dérivation terme à terme</strong> (démonstration hors programme). La fonction \(S\) est de classe \(C^\infty\) sur \(]-R, R[\), et ses dérivées s'obtiennent en dérivant terme à terme, sans changer le rayon :
    <div class="formula" data-nom="Dérivation terme à terme">$$\begin{aligned} S'(x) &= \sum_{n=1}^{+\infty} n\,a_n x^{n-1}\\ &= \sum_{n=0}^{+\infty}(n+1)\,a_{n+1}x^n. \end{aligned}$$</div>
    En dérivant \(k\) fois et en évaluant en 0, seul le terme de rang \(n = k\) subsiste, d'où l'expression des coefficients :
    <div class="formula" data-nom="Coefficients d'une série entière">$$a_n = \frac{S^{(n)}(0)}{n!}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pourquoi les rayons ne changent pas</span>
    <span class="prompt">Une conséquence directe du §3.</span>
    <div class="content"><p>La série dérivée \(\sum n a_n x^{n-1}\) a le même rayon que \(\sum n a_n x^n\) (multiplier par \(x\) ne change pas la convergence pour \(x \neq 0\)), qui a le même rayon que \(\sum a_n x^n\) (§3). Pour la série primitive, on applique le même résultat à ses coefficients \(b_{n+1} = \frac{a_n}{n+1}\) : la série dérivée de \(\sum b_n x^n\) est \(\sum a_n x^n\), donc les rayons sont égaux. Les démonstrations hors programme portent sur l'égalité des fonctions, pas sur les rayons.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — tout tirer de la série géométrique</strong>
    <p>On part de \(\dfrac{1}{1-x} = \sum_{n=0}^{+\infty} x^n\) sur \(]-1, 1[\).</p>
    <ol>
      <li><strong>Dériver</strong> : \(\dfrac{1}{(1-x)^2} = \sum_{n=1}^{+\infty} n\,x^{n-1}\), puis, en multipliant par \(x\), \(\sum_{n=0}^{+\infty} n\,x^n = \dfrac{x}{(1-x)^2}\).</li>
      <li><strong>Recommencer</strong> : en dérivant \(\dfrac{x}{(1-x)^2}\), on trouve \(\dfrac{1+x}{(1-x)^3} = \sum n^2 x^{n-1}\), d'où</li>
    </ol>
    <div class="formula" data-nom="Somme de n² xⁿ">$$\sum_{n=0}^{+\infty} n^2 x^n = \frac{x(1+x)}{(1-x)^3} \qquad (|x| \lt 1).$$</div>
    <ol start="3">
      <li><strong>Évaluer</strong> : en \(x = \frac12\), \(\sum_{n=0}^{+\infty} \dfrac{n^2}{2^n} = \dfrac{\frac12\cdot\frac32}{\frac18} = 6\).</li>
      <li><strong>Primitiver</strong> : \(-\ln(1-x) = \displaystyle\int_0^x \frac{\mathrm{d}t}{1-t} = \sum_{n=1}^{+\infty}\frac{x^n}{n}\) sur \(]-1, 1[\) ; en \(x = \frac12\), \(\sum_{n \geq 1} \dfrac{1}{n\,2^n} = \ln 2\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le théorème de continuité au bord</strong>
    <ol>
      <li>En remplaçant \(x\) par \(-x\) puis en primitivant : \(\ln(1+x) = \sum_{n=1}^{+\infty} \dfrac{(-1)^{n-1}}{n}x^n\) pour \(|x| \lt 1\).</li>
      <li>En \(x = 1\), la série \(\sum \frac{(-1)^{n-1}}{n}\) converge (série alternée) : l'intervalle de définition de la somme est \(]-1, 1]\).</li>
      <li>La somme est continue sur \(]-1, 1]\), et \(x \mapsto \ln(1+x)\) aussi ; égales sur \(]-1, 1[\), elles le sont en 1 par passage à la limite : \(\sum_{n=1}^{+\infty}\dfrac{(-1)^{n-1}}{n} = \ln 2\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Le rayon ne change pas, le comportement au bord si.</strong> \(\sum \frac{x^n}{n^2}\) converge en \(x = 1\) ; sa série dérivée \(\sum \frac{x^{n-1}}{n}\) diverge en \(x = 1\). Dériver ou primitiver terme à terme n'est garanti que sur l'intervalle <strong>ouvert</strong> \(]-R, R[\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · FONCTIONS DÉVELOPPABLES EN SÉRIE ENTIÈRE</div>
  <h2>Écrire une fonction donnée comme somme d'une série entière</h2>
  <div class="intro">Le §5 partait d'une série pour étudier sa somme. On fait maintenant le chemin inverse : une fonction étant donnée, peut-on l'écrire, au voisinage de 0, comme somme d'une série entière ? Si oui, la série est unique : c'est la série de Taylor de la fonction.</div>

  <div class="def-box">
    Soit \(r \gt 0\) et \(f\) définie sur \(]-r, r[\). La fonction \(f\) est <strong>développable en série entière</strong> sur \(]-r, r[\) s'il existe une série entière \(\sum a_n x^n\), de rayon \(R \geq r\), telle que
    <div class="formula">$$\forall x \in\ ]-r, r[, \qquad f(x) = \sum_{n=0}^{+\infty} a_n x^n.$$</div>
    Pour \(f\) de classe \(C^\infty\) au voisinage de 0, la <strong>série de Taylor</strong> de \(f\) en 0 est la série entière \(\sum \dfrac{f^{(n)}(0)}{n!}x^n\).
  </div>
  <div class="prop-box">
    <strong>Unicité du développement.</strong> Si \(f\) est développable en série entière sur \(]-r, r[\), alors \(f\) est de classe \(C^\infty\) sur \(]-r, r[\) et ses coefficients sont nécessairement \(a_n = \dfrac{f^{(n)}(0)}{n!}\) : le développement est unique, c'est la série de Taylor de \(f\). En particulier, si \(f\) est <strong>paire</strong>, ses coefficients d'indice impair sont nuls ; si \(f\) est <strong>impaire</strong>, ses coefficients d'indice pair sont nuls.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Unicité et parité, en deux lignes.</span>
    <div class="content"><p>Sur \(]-r, r[\), \(f\) est la somme d'une série entière : elle est \(C^\infty\) et \(a_n = \frac{f^{(n)}(0)}{n!}\) par le §5. Les coefficients sont donc déterminés par \(f\). Si \(f\) est paire, \(f(x) = f(-x) = \sum (-1)^n a_n x^n\) : par unicité, \(a_n = (-1)^n a_n\), donc \(a_n = 0\) pour \(n\) impair. Même raisonnement pour une fonction impaire.</p></div>
  </div>
  <div class="notice"><strong>\(C^\infty\) ne suffit pas.</strong> La fonction \(f\) définie par \(f(x) = e^{-1/x^2}\) pour \(x \neq 0\) et \(f(0) = 0\) est de classe \(C^\infty\) sur \(\mathbb{R}\), et toutes ses dérivées en 0 sont nulles (résultat classique, admis ici). Sa série de Taylor est la série nulle, de rayon infini, dont la somme ne vaut \(f(x)\) en aucun \(x \neq 0\) : \(f\) n'est développable en série entière sur aucun intervalle \(]-r, r[\).</div>

  <h3>Le critère de la formule de Taylor</h3>
  <div class="prop-box">
    <strong>Formule de Taylor avec reste intégral.</strong> Si \(f\) est de classe \(C^{n+1}\) sur un intervalle contenant 0 et \(x\) :
    <div class="formula" data-nom="Taylor avec reste intégral">$$\begin{aligned} f(x) = \sum_{k=0}^{n} &\frac{f^{(k)}(0)}{k!}\,x^k + R_n(x),\\ R_n(x) &= \int_0^x \frac{(x-t)^n}{n!}\,f^{(n+1)}(t)\,\mathrm{d}t. \end{aligned}$$</div>
    Pour \(f\) de classe \(C^\infty\) sur \(]-r, r[\) : \(f\) est développable en série entière sur \(]-r, r[\) si et seulement si \(R_n(x) \to 0\) pour tout \(x \in\ ]-r, r[\) (les sommes partielles de la série de Taylor valent \(f(x) - R_n(x)\)).
  </div>
  <div class="method-box">
    <strong>Exemple — exponentielle, cosinus et sinus sur \(\mathbb{R}\)</strong>
    <ol>
      <li>Pour \(f = \exp\), \(f^{(n+1)} = \exp\) est majorée par \(e^{|x|}\) entre 0 et \(x\), et \(\left|\int_0^x \frac{(x-t)^n}{n!}\,\mathrm{d}t\right| = \frac{|x|^{n+1}}{(n+1)!}\). Donc</li>
    </ol>
    <div class="formula">$$|R_n(x)| \leq e^{|x|}\,\frac{|x|^{n+1}}{(n+1)!} \xrightarrow[n\to\infty]{} 0.$$</div>
    <ol start="2">
      <li>(La limite est nulle par croissances comparées : \(a^n = o(n!)\).) Ainsi \(e^x = \sum \frac{x^n}{n!}\) pour tout réel \(x\).</li>
      <li>Pour \(\cos\) et \(\sin\), toutes les dérivées sont bornées par 1 : \(|R_n(x)| \leq \frac{|x|^{n+1}}{(n+1)!} \to 0\). Les dérivées en 0 valent successivement \(1, 0, -1, 0, \ldots\) pour \(\cos\) et \(0, 1, 0, -1, \ldots\) pour \(\sin\), d'où leurs développements (§7).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode — prouver qu'une fonction est développable en série entière</strong>
    <ol>
      <li><strong>Opérations</strong> sur les développements usuels (§7) : combinaison linéaire, produit de Cauchy, substitution \(x \mapsto \lambda x\) ou \(x \mapsto x^2\), dérivation ou primitivation terme à terme, décomposition en éléments simples d'une fraction rationnelle.</li>
      <li><strong>Équation différentielle</strong> linéaire vérifiée par la fonction (§8).</li>
      <li><strong>Reste de Taylor</strong>, en dernier recours (exponentielle, cosinus, sinus).</li>
      <li>Dans tous les cas, préciser l'intervalle de validité : c'est le plus petit des intervalles des développements utilisés.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DÉVELOPPEMENTS USUELS</div>
  <h2>Le catalogue à connaître</h2>
  <div class="intro">Tous les développements exigibles se déduisent de trois sources : la série géométrique (puis dérivation, primitivation, substitution), la formule de Taylor pour l'exponentielle et les fonctions trigonométriques, et une équation différentielle pour \((1+x)^\alpha\).</div>

  <div class="prop-box">
    <strong>Rayon 1 : la famille géométrique.</strong> Pour \(x \in\ ]-1, 1[\) :
    <div class="formula" data-nom="DSE de 1/(1−x) et 1/(1+x)">$$\begin{aligned} \frac{1}{1-x} &= \sum_{n=0}^{+\infty} x^n,\\ \frac{1}{1+x} &= \sum_{n=0}^{+\infty} (-1)^n x^n, \end{aligned}$$</div>
    <div class="formula" data-nom="DSE de ln(1+x)">$$\begin{aligned} \ln(1+x) &= \sum_{n=1}^{+\infty} \frac{(-1)^{n-1}}{n}\,x^n,\\ -\ln(1-x) &= \sum_{n=1}^{+\infty} \frac{x^n}{n}, \end{aligned}$$</div>
    <div class="formula" data-nom="DSE de Arctan">$$\arctan x = \sum_{n=0}^{+\infty} \frac{(-1)^n}{2n+1}\,x^{2n+1}.$$</div>
    Origine : \(\ln(1+x)\) est la primitive nulle en 0 de \(\frac{1}{1+x}\) ; \(\arctan x\) celle de \(\frac{1}{1+x^2} = \sum (-1)^n x^{2n}\). Par continuité au bord (§5), le développement de \(\ln(1+x)\) vaut aussi en \(x = 1\), et celui de \(\arctan\) en \(x = \pm 1\).
  </div>
  <div class="prop-box">
    <strong>Rayon infini : exponentielle et fonctions trigonométriques.</strong> Pour tout \(x \in \mathbb{R}\) :
    <div class="formula" data-nom="DSE de l'exponentielle">$$e^x = \sum_{n=0}^{+\infty} \frac{x^n}{n!},$$</div>
    <div class="formula" data-nom="DSE de ch et sh">$$\begin{aligned} \operatorname{ch} x &= \sum_{n=0}^{+\infty} \frac{x^{2n}}{(2n)!},\\ \operatorname{sh} x &= \sum_{n=0}^{+\infty} \frac{x^{2n+1}}{(2n+1)!}, \end{aligned}$$</div>
    <div class="formula" data-nom="DSE de cos et sin">$$\begin{aligned} \cos x &= \sum_{n=0}^{+\infty} \frac{(-1)^n x^{2n}}{(2n)!},\\ \sin x &= \sum_{n=0}^{+\infty} \frac{(-1)^n x^{2n+1}}{(2n+1)!}. \end{aligned}$$</div>
    Origine : formule de Taylor (§6) ; \(\operatorname{ch}\) et \(\operatorname{sh}\) sont les parties paire et impaire de l'exponentielle, \(\operatorname{ch} x = \frac{e^x + e^{-x}}{2}\) et \(\operatorname{sh} x = \frac{e^x - e^{-x}}{2}\).
  </div>
  <div class="prop-box">
    <strong>La série du binôme.</strong> Pour \(\alpha \in \mathbb{R}\) et \(x \in\ ]-1, 1[\) :
    <div class="formula" data-nom="DSE de (1+x)^α">$$\begin{aligned} (1+x)^\alpha &= 1 + \sum_{n=1}^{+\infty} c_n\,x^n,\\ c_n &= \frac{\alpha(\alpha-1)\cdots(\alpha-n+1)}{n!}. \end{aligned}$$</div>
    Si \(\alpha \in \mathbb{N}\), la somme est finie (formule du binôme) ; sinon le rayon vaut exactement 1. Démonstration au §8. Cas utiles : \(\sqrt{1+x} = 1 + \frac{x}{2} - \frac{x^2}{8} + \frac{x^3}{16} - \cdots\) et \(\dfrac{1}{\sqrt{1+x}} = 1 - \frac{x}{2} + \frac{3x^2}{8} - \frac{5x^3}{16} + \cdots\)
  </div>

<figcaption>À gauche, les polynômes 1 + x + … + x<sup>n</sup>/n! approchent e<sup>x</sup> sur tout ℝ : plus n est grand, plus l'approximation s'étend loin de 0. À droite, les sommes partielles 1 − x² + x⁴ − … + (−1)<sup>n</sup>x<sup>2n</sup> approchent 1/(1 + x²) sur ]−1, 1[ (bande verte) et s'en écartent violemment au-delà, bien que la fonction soit régulière sur ℝ : le rayon vaut 1 parce que 1 + z² s'annule en z = ±i, à distance 1 de l'origine dans le plan complexe.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — une fraction rationnelle par éléments simples</strong>
    <p>\(f(x) = \dfrac{1}{x^2 - 3x + 2} = \dfrac{1}{(1-x)(2-x)}\).</p>
    <ol>
      <li>Décomposition : \(f(x) = \dfrac{1}{1-x} - \dfrac{1}{2-x}\) (vérifier en réduisant au même dénominateur).</li>
      <li>\(\dfrac{1}{2-x} = \dfrac12\cdot\dfrac{1}{1 - x/2} = \sum_{n=0}^{+\infty}\dfrac{x^n}{2^{n+1}}\), valable pour \(|x| \lt 2\).</li>
      <li>Différence pour \(|x| \lt 1\) (rayons 1 et 2 distincts, donc rayon 1) :</li>
    </ol>
    <div class="formula">$$\frac{1}{x^2 - 3x + 2} = \sum_{n=0}^{+\infty}\left(1 - \frac{1}{2^{n+1}}\right)x^n.$$</div>
    <p>Contrôle : \(f(0) = \frac12\), c'est bien le coefficient constant \(1 - \frac12\).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — un logarithme qui se factorise</strong>
    <p>\(g(x) = \ln(1 + x - 2x^2)\). Comme \(1 + x - 2x^2 = (1-x)(1+2x)\), on a, pour \(x \in\ ]-\frac12, 1[\), \(g(x) = \ln(1-x) + \ln(1+2x)\). Le premier développement vaut pour \(|x| \lt 1\), le second pour \(|2x| \lt 1\) :</p>
    <div class="formula">$$\ln(1 + x - 2x^2) = \sum_{n=1}^{+\infty} \frac{(-1)^{n-1}2^n - 1}{n}\,x^n$$</div>
    <p>pour \(|x| \lt \frac12\).</p>
    <p>Le rayon vaut \(\frac12\) : la fonction est définie jusqu'à \(x = 1\) à droite, mais son développement en 0 est limité par le point \(-\frac12\) où elle cesse d'exister.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre l'ensemble de définition de la fonction et l'intervalle de validité du développement. \(x \mapsto \ln(1+x)\) est définie sur \(]-1, +\infty[\), mais son développement n'est valable que sur \(]-1, 1]\) ; \(x \mapsto \frac{1}{1+x^2}\) est définie et régulière sur \(\mathbb{R}\), mais son développement n'est valable que sur \(]-1, 1[\) (figure ci-dessus).</div>
</div>

  <div class="sec-num">§8 · DÉVELOPPER GRÂCE À UNE ÉQUATION DIFFÉRENTIELLE</div>
  <h2>Chercher la solution sous forme de série</h2>
  <div class="intro">Quand une fonction vérifie une équation différentielle linéaire simple, on peut chercher une série entière solution de la même équation, avec les mêmes conditions initiales, puis conclure par unicité. C'est ainsi qu'on établit le développement de \((1+x)^\alpha\), et c'est aussi une méthode de résolution des équations différentielles elles-mêmes.</div>

  <div class="method-box">
    <strong>Méthode — analyse, synthèse, unicité</strong>
    <ol>
      <li><strong>Équation</strong> : établir une équation différentielle linéaire vérifiée par \(f\), avec ses conditions initiales en 0.</li>
      <li><strong>Analyse</strong> : supposer \(y = \sum a_n x^n\) de rayon \(R \gt 0\) solution ; dériver terme à terme, décaler les indices pour faire apparaître \(x^n\) partout, identifier les coefficients (unicité du développement) : on obtient une relation de récurrence sur les \(a_n\).</li>
      <li><strong>Synthèse</strong> : calculer les \(a_n\) et le rayon \(R\) de la série obtenue. Il faut \(R \gt 0\) ; sa somme est alors solution sur \(]-R, R[\).</li>
      <li><strong>Unicité</strong> : la somme et \(f\) sont solutions de la même équation avec les mêmes conditions initiales ; elles coïncident sur \(]-R, R[\) (théorème de Cauchy linéaire, chapitre « Équations différentielles linéaires d'ordre 2 », ou calcul direct à l'ordre 1).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple complet — le développement de \((1+x)^\alpha\)</strong>
    <p>Soit \(\alpha \in \mathbb{R} \setminus \mathbb{N}\) et \(f(x) = (1+x)^\alpha\) sur \(]-1, +\infty[\).</p>
    <ol>
      <li><strong>Équation</strong> : \(f'(x) = \alpha(1+x)^{\alpha-1}\), donc \((1+x)f'(x) = \alpha f(x)\), avec \(f(0) = 1\).</li>
      <li><strong>Analyse</strong> : si \(y = \sum a_n x^n\), alors \((1+x)y' = \sum_{n \geq 0}(n+1)a_{n+1}x^n + \sum_{n \geq 0} n a_n x^n\). L'égalité avec \(\alpha y\), coefficient par coefficient, donne \((n+1)a_{n+1} + n a_n = \alpha a_n\), soit</li>
    </ol>
    <div class="formula">$$a_{n+1} = \frac{\alpha - n}{n+1}\,a_n, \qquad a_0 = 1.$$</div>
    <ol start="3">
      <li><strong>Synthèse</strong> : \(a_n = \dfrac{\alpha(\alpha-1)\cdots(\alpha-n+1)}{n!}\), jamais nul car \(\alpha \notin \mathbb{N}\), et \(\left|\dfrac{a_{n+1}}{a_n}\right| = \dfrac{|\alpha - n|}{n+1} \to 1\) : \(R = 1\). La somme \(S\) vérifie \((1+x)S' = \alpha S\) sur \(]-1, 1[\) et \(S(0) = 1\).</li>
      <li><strong>Unicité</strong> : \(g(x) = S(x)(1+x)^{-\alpha}\) a pour dérivée \(\big((1+x)S'(x) - \alpha S(x)\big)(1+x)^{-\alpha-1} = 0\) : \(g\) est constante, égale à \(g(0) = 1\). Donc \(S(x) = (1+x)^\alpha\) sur \(]-1, 1[\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — Arcsin, par substitution puis primitivation</strong>
    <ol>
      <li>Avec \(\alpha = -\frac12\) et \(x\) remplacé par \(-x^2\) (licite si \(x^2 \lt 1\)) : les coefficients \(\frac{(-1/2)(-3/2)\cdots(-1/2 - n + 1)}{n!}\,(-1)^n\) se simplifient en \(\dfrac{1 \cdot 3 \cdots (2n-1)}{2^n\, n!} = \dfrac{(2n)!}{4^n (n!)^2}\), d'où</li>
    </ol>
    <div class="formula">$$\frac{1}{\sqrt{1 - x^2}} = \sum_{n=0}^{+\infty}\frac{(2n)!}{4^n(n!)^2}\,x^{2n} \quad (|x| \lt 1).$$</div>
    <ol start="2">
      <li>\(\arcsin\) est la primitive nulle en 0 de cette fonction ; on primitive terme à terme :</li>
    </ol>
    <div class="formula">$$\begin{aligned} \arcsin x &= \sum_{n=0}^{+\infty}\frac{(2n)!}{4^n(n!)^2\,(2n+1)}\,x^{2n+1}\\ &= x + \frac{x^3}{6} + \frac{3x^5}{40} + \cdots \end{aligned}$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — une équation d'ordre 2 et une solution non élémentaire</strong>
    <p>On cherche les solutions développables en série entière de \(y'' - 2xy' - 2y = 0\).</p>
    <ol>
      <li>Avec \(y = \sum a_n x^n\) : \(y'' = \sum (n+2)(n+1)a_{n+2}x^n\) et \(xy' = \sum n a_n x^n\). L'identification donne \((n+2)(n+1)a_{n+2} = 2(n+1)a_n\), soit \(a_{n+2} = \dfrac{2a_n}{n+2}\).</li>
      <li>Indices pairs : \(a_{2p} = \dfrac{a_0}{p!}\), et la série \(a_0\sum \frac{x^{2p}}{p!}\) a pour somme \(a_0\,e^{x^2}\) (rayon infini).</li>
      <li>Indices impairs : \(a_{2p+1} = \dfrac{4^p\,p!}{(2p+1)!}\,a_1\) ; le rapport de deux termes consécutifs non nuls, \(\dfrac{2x^2}{2p+3}\), tend vers 0 : rayon infini.</li>
      <li>Les solutions DSE forment un espace de dimension 2, \(y = a_0 e^{x^2} + a_1 \sum \frac{4^p p!}{(2p+1)!}x^{2p+1}\), valables sur \(\mathbb{R}\). La seconde somme vaut \(e^{x^2}\int_0^x e^{-t^2}\,\mathrm{d}t\), fonction qui ne s'exprime pas à l'aide des fonctions usuelles : la méthode trouve des solutions qu'aucun calcul de primitive ne donnerait.</li>
    </ol>
  </div>
  <div class="notice"><strong>Ne jamais oublier la synthèse.</strong> La méthode peut produire une série de rayon nul. Pour \(x^2y' - y = -x\), l'identification donne \(a_0 = 0\), \(a_1 = 1\) et \(a_{n+1} = n\,a_n\), soit \(a_n = (n-1)!\) : la série \(\sum (n-1)!\,x^n\) a un rayon nul, et l'équation n'a <strong>aucune</strong> solution développable en série entière.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · VARIABLE COMPLEXE</div>
  <h2>Séries géométrique et exponentielle d'une variable complexe</h2>
  <div class="intro">Le programme ne développe la théorie des fonctions d'une variable complexe que pour deux séries, mais ce sont les plus utiles : la série géométrique et la série exponentielle. Passer par les complexes simplifie beaucoup de calculs réels (cosinus, sinus, produits par une exponentielle).</div>

  <div class="def-box">
    Une fonction \(f\) définie sur le disque ouvert \(D = \{z \in \mathbb{C},\ |z| \lt r\}\) est <strong>développable en série entière</strong> sur \(D\) s'il existe une série entière \(\sum a_n z^n\), de rayon au moins \(r\), telle que \(f(z) = \sum_{n=0}^{+\infty} a_n z^n\) pour tout \(z \in D\).
  </div>
  <div class="prop-box">
    <strong>Les deux développements complexes du programme.</strong>
    <div class="formula" data-nom="Série géométrique complexe">$$\frac{1}{1-z} = \sum_{n=0}^{+\infty} z^n \qquad (|z| \lt 1),$$</div>
    <div class="formula" data-nom="Exponentielle complexe">$$\exp(z) = \sum_{n=0}^{+\infty} \frac{z^n}{n!} \qquad (z \in \mathbb{C}).$$</div>
    Par produit de Cauchy, \(\exp(a+b) = \exp(a)\exp(b)\) pour tous complexes \(a, b\) (chapitre « Séries numériques »). En séparant les termes d'indice pair et impair de \(\exp(i\theta)\), et puisque \(i^{2n} = (-1)^n\), on retrouve \(e^{i\theta} = \cos\theta + i\sin\theta\) avec les développements du §7.
  </div>
  <div class="method-box">
    <strong>Exemple — une somme trigonométrique par la série géométrique</strong>
    <p>Pour \(0 \leq r \lt 1\) et \(\theta\) réel, \(r^n\cos(n\theta) = \operatorname{Re}\big((re^{i\theta})^n\big)\) et \(|re^{i\theta}| = r \lt 1\) :</p>
    <div class="formula">$$\begin{aligned} \sum_{n=0}^{+\infty} r^n\cos(n\theta) &= \operatorname{Re}\frac{1}{1 - re^{i\theta}}\\ &= \frac{1 - r\cos\theta}{1 - 2r\cos\theta + r^2}. \end{aligned}$$</div>
    <p>(On multiplie par le conjugué : \(|1 - re^{i\theta}|^2 = 1 - 2r\cos\theta + r^2\).)</p>
  </div>
  <div class="method-box">
    <strong>Exemple — \(e^x\cos x\) sans produit de Cauchy</strong>
    <ol>
      <li>\(e^x\cos x = \operatorname{Re}\big(e^{(1+i)x}\big)\) pour \(x\) réel, et \(1 + i = \sqrt2\,e^{i\pi/4}\), donc \((1+i)^n = 2^{n/2}e^{in\pi/4}\).</li>
      <li>Par le développement de l'exponentielle complexe :</li>
    </ol>
    <div class="formula">$$\begin{aligned} e^x\cos x &= \sum_{n=0}^{+\infty} \frac{2^{n/2}\cos(n\pi/4)}{n!}\,x^n\\ &= 1 + x - \frac{x^3}{3} - \frac{x^4}{6} - \cdots \end{aligned}$$</div>
    <ol start="3">
      <li>Même méthode avec \(z = e^{i\theta}\), puisque \(\exp(e^{i\theta}) = e^{\cos\theta}\,e^{i\sin\theta}\) :</li>
    </ol>
    <div class="formula">$$\begin{aligned} \sum_{n=0}^{+\infty} \frac{\cos(n\theta)}{n!} &= \operatorname{Re}\big(\exp(e^{i\theta})\big)\\ &= e^{\cos\theta}\cos(\sin\theta). \end{aligned}$$</div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · APPLICATIONS</div>
  <h2>Sommes de séries, équations différentielles, probabilités</h2>
  <div class="intro">Les séries entières servent d'outil dans trois situations récurrentes aux concours : calculer la somme d'une série numérique, trouver les solutions d'une équation différentielle, et coder la loi d'une variable aléatoire à valeurs entières dans sa fonction génératrice.</div>

  <h3>Sommes de séries numériques</h3>
  <div class="method-box">
    <strong>Méthode — reconnaître la valeur d'une série entière</strong>
    <ol>
      <li>Écrire la série numérique sous la forme \(\sum a_n x_0^n\), avec \(x_0\) dans l'intervalle de convergence (ou au bord, si la série y converge : continuité).</li>
      <li>Ramener \(a_n\) à des coefficients connus : décomposer les fractions en \(n\), écrire \(n = (n-1) + 1\) ou \(n^2 = n(n-1) + n\) devant une factorielle, décaler les indices.</li>
      <li>Utiliser les développements usuels, leurs dérivées et leurs primitives.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — trois sommes</strong>
    <ol>
      <li>\(\sum_{n \geq 0} \dfrac{n+1}{n!}\) : \(\sum_{n \geq 1}\dfrac{n}{n!} = \sum_{n \geq 1}\dfrac{1}{(n-1)!} = e\) et \(\sum_{n \geq 0}\dfrac{1}{n!} = e\), donc la somme vaut \(2e\).</li>
      <li>\(\sum_{n \geq 0} \dfrac{(-1)^n}{2n+1} = \dfrac{\pi}{4}\) : c'est le développement d'\(\arctan\) en \(x = 1\), légitime par continuité au bord (§5, §7).</li>
      <li>\(\sum_{n \geq 1} \dfrac{1}{n(n+1)2^n}\) : avec \(\frac{1}{n(n+1)} = \frac1n - \frac{1}{n+1}\), on obtient \(\sum \frac{1}{n2^n} - \sum \frac{1}{(n+1)2^n} = \ln 2 - 2\big(\ln 2 - \tfrac12\big) = 1 - \ln 2\).</li>
    </ol>
  </div>

  <h3>Équations différentielles</h3>
  <p>La méthode du §8 fournit des solutions des équations linéaires d'ordre 2 à coefficients polynomiaux, sur l'intervalle où la série converge. Le chapitre « Équations différentielles linéaires d'ordre 2 » la combine avec le théorème de Cauchy et la méthode de variation de la constante pour trouver toutes les solutions.</p>

  <h3>Fonctions génératrices</h3>
  <div class="prop-box">
    Soit \(X\) une variable aléatoire à valeurs dans \(\mathbb{N}\). Sa <strong>fonction génératrice</strong> est
    <div class="formula" data-nom="Fonction génératrice">$$G_X(t) = E\big(t^X\big) = \sum_{n=0}^{+\infty} P(X = n)\,t^n.$$</div>
    Les coefficients sont compris entre 0 et 1 et leur somme vaut 1 : la série converge absolument pour \(|t| \leq 1\), son rayon est au moins 1 et \(G_X(1) = 1\). Par unicité des coefficients, \(P(X = n) = \frac{G_X^{(n)}(0)}{n!}\) : \(G_X\) caractérise la loi de \(X\). Si \(G_X\) est dérivable en 1, \(E(X) = G_X'(1)\) (chapitre « Variables aléatoires discrètes »).
  </div>
  <div class="method-box">
    <strong>Exemple — lois de Poisson et géométrique</strong>
    <ol>
      <li><strong>Poisson</strong> de paramètre \(\lambda\) : \(G_X(t) = \sum e^{-\lambda}\dfrac{(\lambda t)^n}{n!} = e^{\lambda(t-1)}\), rayon infini, et \(E(X) = G_X'(1) = \lambda\).</li>
      <li><strong>Géométrique</strong> de paramètre \(p \in\ ]0, 1[\), \(P(X = n) = p(1-p)^{n-1}\) pour \(n \geq 1\) : avec \(q = 1 - p\), \(G_X(t) = pt\sum_{n \geq 1}(qt)^{n-1} = \dfrac{pt}{1 - qt}\) pour \(|t| \lt \frac1q\). Le rayon \(\frac1q\) dépasse 1, et \(G_X'(t) = \dfrac{p}{(1-qt)^2}\) donne \(E(X) = \dfrac{p}{p^2} = \dfrac1p\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Au bord du disque, règle de Cauchy, variable complexe</h2>
  <div class="intro">Compléments non exigibles, utiles pour comprendre certains énoncés.</div>
  <div class="prop-box">
    <strong>Étude au bord.</strong> Le théorème de continuité contient le théorème d'Abel radial : si \(\sum a_n R^n\) converge, alors \(S(x) \to \sum a_n R^n\) quand \(x \to R^-\). La réciproque est fausse : \(\sum (-1)^n x^n = \frac{1}{1+x}\) tend vers \(\frac12\) quand \(x \to 1^-\), alors que la série \(\sum (-1)^n\) diverge en 1. En dehors du théorème de continuité, les études au bord ne sont pas un attendu du programme.
  </div>
  <div class="prop-box">
    <strong>Règle de Cauchy, formule de Hadamard.</strong> Si \(|a_n|^{1/n} \to \ell\), alors \(R = \frac1\ell\) ; en toute généralité, \(R = 1/\limsup |a_n|^{1/n}\). Exemple : pour \(a_n = \left(1 + \frac1n\right)^{n^2}\), \(|a_n|^{1/n} = \left(1 + \frac1n\right)^n \to e\), donc \(R = \frac1e\).
  </div>
  <div class="prop-box">
    <strong>Fonctions d'une variable complexe.</strong> Une fonction développable en série entière au voisinage de chaque point d'un ouvert de \(\mathbb{C}\) est dite analytique ; ces fonctions, dérivables au sens complexe, ont des propriétés très fortes (une telle fonction est déterminée par ses valeurs sur un petit segment, et son rayon de convergence en 0 est la distance au plus proche « point singulier »). C'est ce qui explique le rayon 1 de \(\frac{1}{1+x^2}\) : la fraction \(\frac{1}{1+z^2}\) n'est pas définie en \(z = \pm i\).
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="sen-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · SÉRIES ENTIÈRES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Trois familles de savoir-faire : trouver un rayon de convergence, développer une fonction en série entière (par opérations ou par une équation différentielle), et calculer des sommes, de séries entières ou de séries numériques.</div>

  <div class="method-box"><strong>Méthode 1 — Calculer un rayon par la règle de d'Alembert</strong>
    <ol>
      <li>Vérifier que \(a_n \neq 0\) à partir d'un certain rang (sinon : méthode 3).</li>
      <li>Calculer la limite \(\ell\) de \(\left|\dfrac{a_{n+1}}{a_n}\right|\), le rapport des <strong>coefficients</strong>.</li>
      <li>Conclure : \(R = \dfrac1\ell\), avec \(R = +\infty\) si \(\ell = 0\) et \(R = 0\) si \(\ell = +\infty\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(a_n = \dfrac{(n!)^2}{(2n)!}\) : \(\dfrac{a_{n+1}}{a_n} = \dfrac{(n+1)^2}{(2n+2)(2n+1)} = \dfrac{n+1}{2(2n+1)} \to \dfrac14\), donc \(R = 4\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(R = \ell\) au lieu de \(R = \frac1\ell\), ou mélanger les deux points de vue. Soit on prend le rapport des coefficients et \(R = \frac1\ell\) ; soit on applique d'Alembert au terme \(a_n z^n\), à \(z\) fixé, et l'on obtient la condition \(\ell|z| \lt 1\) : les deux mènent au même rayon.</div>

  <div class="method-box"><strong>Méthode 2 — Calculer un rayon par comparaison</strong>
    <ol>
      <li>Chercher un équivalent simple de \(a_n\) : si \(a_n \sim b_n\), les rayons sont égaux.</li>
      <li>Sinon, encadrer : \(|a_n| \leq |b_n|\) (ou \(a_n = O(b_n)\)) donne \(R_a \geq R_b\).</li>
      <li>Se ramener aux séries de référence : \(R\big(\sum n^\alpha x^n\big) = 1\) pour tout réel \(\alpha\), \(R\big(\sum \frac{x^n}{q^n}\big) = q\), \(R\big(\sum \frac{x^n}{n!}\big) = +\infty\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(a_n = 2 + \sin n\). Le rapport \(\frac{a_{n+1}}{a_n}\) n'a pas de limite : d'Alembert est inutilisable. Mais \(1 \leq a_n \leq 3\) : la comparaison à \(\sum 3x^n\) donne \(R \geq 1\), la comparaison à \(\sum x^n\) donne \(R \leq 1\), donc \(R = 1\). De même, \(a_n = \sqrt n + (-1)^n \sim \sqrt n\) donne \(R = 1\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Traiter une série lacunaire</strong>
    <ol>
      <li>Quand une infinité de coefficients sont nuls (seules les puissances paires apparaissent, par exemple), le rapport \(\frac{a_{n+1}}{a_n}\) n'a pas de sens.</li>
      <li>Fixer \(x \neq 0\) et appliquer la règle de d'Alembert à la <strong>série numérique</strong> des termes non nuls, \(u_n = a_n x^{2n}\) par exemple.</li>
      <li>Lire le rayon sur la condition obtenue (convergence absolue si la limite est \(\lt 1\), divergence grossière si elle est \(\gt 1\)) ; ou poser \(X = x^2\) et utiliser le rayon de la série en \(X\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sum (n+1)\,3^n x^{2n}\) : \(\left|\dfrac{u_{n+1}}{u_n}\right| = \dfrac{n+2}{n+1}\cdot 3x^2 \to 3x^2\). Convergence absolue si \(3x^2 \lt 1\), divergence grossière si \(3x^2 \gt 1\) : \(R = \dfrac{1}{\sqrt3}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Encadrer le rayon grâce à un point</strong>
    <ol>
      <li>Si \(\sum a_n z_0^n\) converge, ou si seulement \((a_n z_0^n)\) est bornée : \(R \geq |z_0|\).</li>
      <li>Si \(\sum a_n z_0^n\) diverge : \(R \leq |z_0|\).</li>
      <li>Si \(\sum a_n z_0^n\) converge sans converger absolument : \(R = |z_0|\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sum \dfrac{(-1)^n}{\sqrt n}x^n\) converge en \(x = 1\) (séries alternées) mais pas absolument (Riemann, \(\alpha = \frac12\)) : \(R = 1\) sans aucun calcul de limite.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le rayon ne dit rien du bord. Sur le cercle \(|z| = R\), tout est possible : chaque point s'étudie comme une série numérique, et seulement si l'énoncé le demande.</div>

  <div class="method-box"><strong>Méthode 5 — Développer une fonction par opérations sur les développements usuels</strong>
    <ol>
      <li>Ramener la fonction aux développements du cours : substitution (\(x \mapsto -x\), \(x \mapsto \lambda x\), \(x \mapsto x^2\)), combinaison linéaire, produit de Cauchy.</li>
      <li>Fraction rationnelle : décomposer en éléments simples, puis développer chaque \(\dfrac{1}{a - x} = \dfrac1a\displaystyle\sum_{n \geq 0}\frac{x^n}{a^n}\) (\(|x| \lt |a|\)).</li>
      <li>Logarithme ou Arctan : factoriser, ou dériver la fonction, développer la dérivée, puis primitiver terme à terme (sans oublier la valeur en 0).</li>
      <li>Préciser l'intervalle de validité : le plus petit des intervalles des développements utilisés.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(|x| \lt 2\), \(\ln(2 + x) = \ln 2 + \ln\!\left(1 + \frac x2\right) = \ln 2 + \displaystyle\sum_{n \geq 1}\frac{(-1)^{n-1}}{n\,2^n}x^n\), de rayon 2.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre l'ensemble de définition de la fonction et l'intervalle où vaut son développement. \(x \mapsto \frac{1}{1+x^2}\) est définie sur \(\mathbb{R}\), mais son développement en 0 ne vaut que sur \(]-1, 1[\).</div>

  <div class="method-box"><strong>Méthode 6 — Développer à l'aide d'une équation différentielle</strong>
    <ol>
      <li><strong>Équation</strong> : trouver une équation différentielle linéaire vérifiée par \(f\), et ses conditions initiales en 0.</li>
      <li><strong>Analyse</strong> : supposer \(y = \sum a_n x^n\) de rayon \(R \gt 0\) solution ; dériver terme à terme, réindexer pour faire apparaître \(x^n\) partout, identifier les coefficients : on obtient une récurrence sur les \(a_n\).</li>
      <li><strong>Synthèse</strong> : calculer les \(a_n\) et le rayon de la série obtenue ; il faut \(R \gt 0\).</li>
      <li><strong>Unicité</strong> : la somme et \(f\) vérifient la même équation et les mêmes conditions initiales ; elles coïncident sur \(]-R, R[\) (théorème de Cauchy linéaire, ou calcul direct à l'ordre 1).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = e^{x^2}\) vérifie \(y' = 2xy\), \(y(0) = 1\). L'identification donne \((n+1)a_{n+1} = 2a_{n-1}\) et \(a_1 = 0\) : les coefficients impairs sont nuls et \(a_{2p} = \frac{1}{p!}\). On retrouve \(e^{x^2} = \sum \frac{x^{2p}}{p!}\), de rayon infini (ce qu'une simple substitution donnait aussi).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier la synthèse. La récurrence peut donner une série de rayon nul (par exemple \(a_n = (n-1)!\)) : il n'y a alors aucune solution développable en série entière.</div>

  <div class="method-box"><strong>Méthode 7 — Calculer la somme d'une série entière</strong>
    <ol>
      <li>Déterminer d'abord le rayon : il fixe l'intervalle où l'égalité sera valable.</li>
      <li>Transformer les coefficients : écrire \(n = (n+1) - 1\) ou \(n^2 = n(n-1) + n\) devant une factorielle, décomposer une fraction en \(n\) en éléments simples, décaler les indices.</li>
      <li>Reconnaître des développements usuels, éventuellement dérivés (multiplier ensuite par \(x\)) ou primitivés (diviser par \(x\), en traitant \(x = 0\) à part).</li>
    </ol>
    <p><em>Exemple éclair :</em> en écrivant \(\frac{n+1}{n!} = \frac{1}{(n-1)!} + \frac{1}{n!}\) (pour \(n \geq 1\)), on obtient, pour tout réel \(x\) (rayon infini),</p>
    <div class="formula">$$\sum_{n \geq 0}\frac{n+1}{n!}x^n = \sum_{n \geq 1}\frac{x^n}{(n-1)!} + \sum_{n \geq 0}\frac{x^n}{n!} = (1+x)e^x.$$</div>
  </div>
  <div class="notice"><strong>Piège</strong> : dériver ou primitiver terme à terme hors de l'intervalle <strong>ouvert</strong> \(]-R, R[\). Au bord, seul le théorème de continuité (pour une série qui y converge) permet de conclure.</div>

  <div class="method-box"><strong>Méthode 8 — Calculer la somme d'une série numérique</strong>
    <ol>
      <li>Écrire la série sous la forme \(\sum a_n x_0^n\) avec \(x_0\) dans l'intervalle ouvert de convergence d'une série dont on connaît la somme \(S\).</li>
      <li>Si \(x_0 = \pm R\) et que la série numérique y converge, conclure par le théorème de continuité de \(S\) sur l'intervalle de définition.</li>
      <li>Évaluer : la somme vaut \(S(x_0)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> de \(\sum_{n \geq 1} n x^n = \dfrac{x}{(1-x)^2}\) (\(|x| \lt 1\)) on tire, en \(x = \frac13\), \(\displaystyle\sum_{n \geq 1}\frac{n}{3^n} = \frac{1/3}{(2/3)^2} = \frac34\). Et \(\sum_{n \geq 0}\frac{n^2}{n!} = 2e\), en évaluant en 1 la somme \((x^2 + x)e^x\) de \(\sum \frac{n^2}{n!}x^n\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Passer par les complexes</strong>
    <ol>
      <li>Écrire \(r^n\cos(n\theta)\) ou \(e^{ax}\cos(bx)\) comme la partie réelle d'une puissance ou d'une exponentielle complexe.</li>
      <li>Utiliser les deux développements complexes du programme : \(\frac{1}{1-z} = \sum z^n\) (\(|z| \lt 1\)) et \(\exp(z) = \sum \frac{z^n}{n!}\) (\(z \in \mathbb{C}\)).</li>
      <li>Revenir au réel en prenant la partie réelle (ou imaginaire), après avoir multiplié par la quantité conjuguée si besoin.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\theta\) réel, \(\left|\frac{e^{i\theta}}{2}\right| = \frac12 \lt 1\), donc</p>
    <div class="formula">$$\sum_{n=0}^{+\infty}\frac{\cos(n\theta)}{2^n} = \operatorname{Re}\frac{1}{1 - e^{i\theta}/2} = \frac{4 - 2\cos\theta}{5 - 4\cos\theta}.$$</div>
  </div>

  <div class="method-box"><strong>Méthode 10 — Exploiter une fonction génératrice</strong>
    <ol>
      <li>Pour \(X\) à valeurs dans \(\mathbb{N}\), écrire \(G_X(t) = \sum P(X = n)\,t^n\) : le rayon est au moins 1 et \(G_X(1) = 1\).</li>
      <li>Reconnaître la somme (série géométrique, exponentielle, binôme) pour obtenir une expression simple de \(G_X\).</li>
      <li>En tirer la loi (\(P(X = n) = \frac{G_X^{(n)}(0)}{n!}\)) ou l'espérance \(E(X) = G_X'(1)\) quand \(G_X\) est dérivable en 1 ; variance et sommes de variables indépendantes : chapitre « Variables aléatoires discrètes II ».</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(X\) de loi binomiale \(\mathcal{B}(m, p)\), \(G_X(t) = \sum_{k=0}^{m}\binom mk p^k q^{m-k}t^k = (q + pt)^m\) (\(q = 1 - p\)), polynôme ; \(G_X'(1) = mp(q + p)^{m-1} = mp\).</p>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Rayons de convergence</h3>
  <div class="statement">Déterminer le rayon de convergence de chacune des séries entières.</div>
  <div class="q"><strong>Q1.</strong> \(\sum \dfrac{x^n}{n!}\). <strong>Q2.</strong> \(\sum n^2 x^n\). <strong>Q3.</strong> \(\sum \dfrac{x^n}{2^n}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\left|\frac{a_{n+1}}{a_n}\right| = \frac{n!}{(n+1)!} = \frac{1}{n+1}\to 0\), donc \(R=+\infty\).</p>
    <p><strong>Q2.</strong> \(\frac{(n+1)^2}{n^2}\to 1\), donc \(R=1\).</p>
    <p><strong>Q3.</strong> \(\frac{2^n}{2^{n+1}}=\frac12\to\frac12\), donc \(R=2\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Rayons : quand d'Alembert ne suffit pas</h3>
  <div class="statement">Déterminer le rayon de convergence de chacune des séries entières suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(\sum \dfrac{(2n)!}{n!\,n^n}\,x^n\) (\(n \geq 1\)).</div>
  <div class="q"><strong>Q2.</strong> \(\sum \dfrac{x^{2n}}{4^n(n+1)}\).</div>
  <div class="q"><strong>Q3.</strong> \(\sum a_n x^n\) avec \(a_n = 3^n\) si \(n\) est pair et \(a_n = 1\) si \(n\) est impair.</div>
  <div class="q"><strong>Q4.</strong> \(\sum n^{(-1)^n} x^n\) (\(n \geq 1\)), c'est-à-dire \(a_n = n\) pour \(n\) pair et \(a_n = \frac1n\) pour \(n\) impair.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Coefficients non nuls, rapport simple :</p>
    <div class="formula">$$\frac{a_{n+1}}{a_n} = \frac{(2n+2)(2n+1)}{n+1}\cdot\frac{n^n}{(n+1)^{n+1}} = \frac{2(2n+1)}{n+1}\cdot\frac{1}{(1 + 1/n)^n} \xrightarrow[n\to\infty]{} \frac4e,$$</div>
    <p>donc \(R = \dfrac e4\).</p>
    <p><strong>Q2.</strong> Série lacunaire : à \(x \neq 0\) fixé, avec \(u_n = \frac{x^{2n}}{4^n(n+1)}\), \(\left|\frac{u_{n+1}}{u_n}\right| = \frac{n+1}{n+2}\cdot\frac{x^2}{4} \to \frac{x^2}{4}\). Convergence absolue si \(x^2 \lt 4\), divergence grossière si \(x^2 \gt 4\) : \(R = 2\).</p>
    <p><strong>Q3.</strong> Le rapport \(\frac{a_{n+1}}{a_n}\) vaut alternativement \(3^{-n}\) et \(3^{n+1}\) : pas de limite. On compare : \(|a_n| \leq 3^n\) donne \(R \geq R\big(\sum 3^n x^n\big) = \frac13\). En \(x = \frac13\), les termes de rang pair valent \(3^{2p}\cdot 3^{-2p} = 1\) : le terme général ne tend pas vers 0, la série diverge, donc \(R \leq \frac13\). Ainsi \(R = \frac13\) (c'est la partie « paire » qui impose le rayon).</p>
    <p><strong>Q4.</strong> Pour \(n \geq 1\), \(\frac1n \leq a_n \leq n\). La comparaison donne \(R \geq R\big(\sum n x^n\big) = 1\) et \(R \leq R\big(\sum \frac{x^n}{n}\big) = 1\) : \(R = 1\), alors que le rapport \(\frac{a_{n+1}}{a_n}\) oscille entre des valeurs proches de 0 et de \(+\infty\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Somme par dérivation</h3>
  <div class="statement">Pour \(|x| \lt 1\), calculer \(S(x) = \displaystyle\sum_{n\ge 1} n\,x^n\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p>On part de \(\sum_{n\ge 0} x^n = \dfrac{1}{1-x}\). En dérivant : \(\sum_{n\ge 1} n\,x^{n-1} = \dfrac{1}{(1-x)^2}\). On multiplie par \(x\) :</p>
    <div class="formula">$$S(x)=\sum_{n\ge 1} n\,x^n = \frac{x}{(1-x)^2}.$$</div>
    <p>Application : en \(x=\tfrac12\), \(\sum n/2^n = \dfrac{1/2}{(1/2)^2}=2\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Développement en série entière</h3>
  <div class="statement">Développer \(f(x)=\dfrac{1}{2-x}\) en série entière en 0 et préciser le rayon.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <div class="formula">$$\frac{1}{2-x} = \frac{1}{2}\cdot\frac{1}{1-x/2} = \frac{1}{2}\sum_{n\ge 0}\left(\frac{x}{2}\right)^n = \sum_{n\ge 0}\frac{x^n}{2^{n+1}},$$</div>
    <p>valable pour \(|x/2| \lt 1\) soit \(|x| \lt 2\) : \(R=2\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Trois développements par opérations</h3>
  <div class="statement">Développer en série entière en 0 les fonctions suivantes, en précisant l'intervalle de validité.</div>
  <div class="q"><strong>Q1.</strong> \(f(x) = \dfrac{1}{x^2 - 5x + 6}\).</div>
  <div class="q"><strong>Q2.</strong> \(g(x) = \ln(1 + x + x^2)\) (on pourra écrire \(1 + x + x^2 = \frac{1 - x^3}{1 - x}\) pour \(x \neq 1\)).</div>
  <div class="q"><strong>Q3.</strong> \(h(x) = e^x\sin x\) (on pourra écrire \(h(x) = \operatorname{Im}\big(e^{(1+i)x}\big)\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(x^2 - 5x + 6 = (2-x)(3-x)\), et la décomposition en éléments simples donne \(f(x) = \dfrac{1}{2-x} - \dfrac{1}{3-x}\) (réduire au même dénominateur pour vérifier). Chaque terme se développe comme une série géométrique : \(\frac{1}{a - x} = \sum_{n \geq 0}\frac{x^n}{a^{n+1}}\) pour \(|x| \lt a\). Les rayons 2 et 3 sont distincts : pour \(|x| \lt 2\),</p>
    <div class="formula">$$\frac{1}{x^2 - 5x + 6} = \sum_{n=0}^{+\infty}\left(\frac{1}{2^{n+1}} - \frac{1}{3^{n+1}}\right)x^n.$$</div>
    <p>Contrôle : en 0, \(\frac12 - \frac13 = \frac16 = f(0)\).</p>
    <p><strong>Q2.</strong> Pour \(|x| \lt 1\), \(1 - x^3 \gt 0\) et \(1 - x \gt 0\), donc \(g(x) = \ln(1 - x^3) - \ln(1 - x)\). Avec \(-\ln(1 - u) = \sum_{k \geq 1}\frac{u^k}{k}\) (\(|u| \lt 1\)), appliqué à \(u = x\) et \(u = x^3\) :</p>
    <div class="formula">$$g(x) = \sum_{n=1}^{+\infty}\frac{x^n}{n} - \sum_{k=1}^{+\infty}\frac{x^{3k}}{k} = \sum_{n=1}^{+\infty} a_n x^n, \qquad a_n = \begin{cases} \dfrac1n & \text{si } 3 \nmid n,\\ -\dfrac2n & \text{si } 3 \mid n. \end{cases}$$</div>
    <p>(Pour \(n = 3k\), \(\frac{1}{3k} - \frac1k = -\frac{2}{3k}\).) Le développement vaut sur \(]-1, 1[\), et le rayon vaut exactement 1, puisque \(\frac1n \leq |a_n| \leq \frac2n\). Pourtant \(g\) est définie et régulière sur tout \(\mathbb{R}\) (\(1 + x + x^2 \gt 0\)) : comme pour \(\frac{1}{1+x^2}\), le rayon est imposé par les racines complexes \(e^{\pm 2i\pi/3}\) de \(1 + z + z^2\), de module 1.</p>
    <p><strong>Q3.</strong> Pour \(x\) réel, \(e^x\sin x = \operatorname{Im}\big(e^{x}e^{ix}\big) = \operatorname{Im}\big(e^{(1+i)x}\big)\), et \(1 + i = \sqrt2\,e^{i\pi/4}\), donc \((1+i)^n = 2^{n/2}e^{in\pi/4}\). Par le développement de l'exponentielle complexe, valable sur \(\mathbb{R}\) :</p>
    <div class="formula">$$e^x\sin x = \sum_{n=0}^{+\infty}\frac{2^{n/2}\sin(n\pi/4)}{n!}\,x^n = x + x^2 + \frac{x^3}{3} - \frac{x^5}{30} - \cdots$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Équation différentielle par série entière</h3>
  <div class="statement">Chercher une solution développable en série entière de \(y' = y\), \(y(0)=1\).</div>
  <div class="q"><strong>Q1.</strong> En posant \(y=\sum a_n x^n\), trouver la relation de récurrence. <strong>Q2.</strong> Identifier la solution.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(y'=\sum_{n\ge 1} n a_n x^{n-1}=\sum_{n\ge 0}(n+1)a_{n+1}x^n\). L'équation \(y'=y\) donne \((n+1)a_{n+1}=a_n\), soit \(a_{n+1}=\dfrac{a_n}{n+1}\).</p>
    <p><strong>Q2.</strong> Avec \(a_0=y(0)=1\) : \(a_n=\dfrac{1}{n!}\). Donc \(y=\sum \dfrac{x^n}{n!}=e^x\) (rayon \(+\infty\)) — on retrouve l'exponentielle.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Sommes de séries numériques</h3>
  <div class="statement">Calculer les sommes suivantes à l'aide de séries entières.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\sum_{n=0}^{+\infty}\frac{n^2 + 1}{n!}\).</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\sum_{n=1}^{+\infty}\frac{(-1)^n}{n(n+1)}\).</div>
  <div class="q"><strong>Q3.</strong> \(\displaystyle\sum_{n=0}^{+\infty}\frac{\cos(n\pi/3)}{n!}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On écrit \(n^2 = n(n-1) + n\) pour simplifier avec la factorielle :</p>
    <div class="formula">$$\sum_{n \geq 0}\frac{n^2 + 1}{n!} = \sum_{n \geq 2}\frac{1}{(n-2)!} + \sum_{n \geq 1}\frac{1}{(n-1)!} + \sum_{n \geq 0}\frac{1}{n!} = 3e.$$</div>
    <p>(Chaque série est la série exponentielle en 1, décalée ; toutes convergent, ce qui justifie le découpage.)</p>
    <p><strong>Q2.</strong> \(\frac{1}{n(n+1)} = \frac1n - \frac{1}{n+1}\). Les deux séries \(\sum \frac{(-1)^n}{n}\) et \(\sum \frac{(-1)^n}{n+1}\) convergent (séries alternées), on peut donc séparer. Le développement \(\ln(1+x) = \sum_{m \geq 1}\frac{(-1)^{m-1}}{m}x^m\), valable en \(x = 1\) par continuité, donne \(\sum_{m \geq 1}\frac{(-1)^{m-1}}{m} = \ln 2\). Ainsi :</p>
    <ul>
      <li>\(\sum_{n \geq 1}\frac{(-1)^n}{n} = -\ln 2\) ;</li>
      <li>\(\sum_{n \geq 1}\frac{(-1)^n}{n+1} = \sum_{m \geq 2}\frac{(-1)^{m-1}}{m} = \ln 2 - 1\) (on a posé \(m = n + 1\) et retiré le terme \(m = 1\)).</li>
    </ul>
    <p>La somme vaut \(-\ln 2 - (\ln 2 - 1) = 1 - 2\ln 2 \approx -0{,}386\).</p>
    <p><strong>Q3.</strong> \(\cos\frac{n\pi}{3} = \operatorname{Re}\big(e^{in\pi/3}\big)\), donc la somme est la partie réelle de \(\sum \frac{(e^{i\pi/3})^n}{n!} = \exp\big(e^{i\pi/3}\big)\). Comme \(e^{i\pi/3} = \frac12 + i\frac{\sqrt3}{2}\), \(\exp\big(e^{i\pi/3}\big) = e^{1/2}\,e^{i\sqrt3/2}\), et</p>
    <div class="formula">$$\sum_{n=0}^{+\infty}\frac{\cos(n\pi/3)}{n!} = e^{1/2}\cos\frac{\sqrt3}{2} \approx 1{,}068.$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Un développement par équation différentielle</h3>
  <div class="statement">Sur \(]-1, 1[\), on pose \(f(x) = \dfrac{\arcsin x}{\sqrt{1 - x^2}}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f\) vérifie \((1 - x^2)f'(x) - xf(x) = 1\) et \(f(0) = 0\).</div>
  <div class="q"><strong>Q2.</strong> Analyse : on suppose \(f(x) = \sum a_n x^n\) sur un intervalle \(]-r, r[\). Établir une relation de récurrence et en déduire \(a_{2p} = 0\) et \(a_{2p+1} = \dfrac{4^p(p!)^2}{(2p+1)!}\).</div>
  <div class="q"><strong>Q3.</strong> Synthèse : déterminer le rayon de la série obtenue et conclure que \(f\) est développable en série entière sur \(]-1, 1[\).</div>
  <div class="q"><strong>Q4.</strong> En déduire la valeur de \(\displaystyle\sum_{p=0}^{+\infty}\frac{(p!)^2}{(2p+1)!}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f(x) = \arcsin x\,(1-x^2)^{-1/2}\), donc</p>
    <div class="formula">$$f'(x) = \frac{1}{1 - x^2} + \arcsin x \cdot x\,(1-x^2)^{-3/2} = \frac{1}{1-x^2} + \frac{x f(x)}{1 - x^2}.$$</div>
    <p>En multipliant par \(1 - x^2\) : \((1-x^2)f' - xf = 1\). Et \(f(0) = 0\).</p>
    <p><strong>Q2.</strong> Avec \(y = \sum a_n x^n\) :</p>
    <div class="formula">$$(1 - x^2)y' - xy = \sum_{n \geq 0}(n+1)a_{n+1}x^n - \sum_{n \geq 2}(n-1)a_{n-1}x^n - \sum_{n \geq 1}a_{n-1}x^n.$$</div>
    <p>Par unicité des coefficients, l'égalité avec la constante 1 donne : \(a_1 = 1\) (coefficient de \(x^0\)), puis, pour tout \(n \geq 1\), \((n+1)a_{n+1} - na_{n-1} = 0\) (pour \(n = 1\), le terme du milieu est absent, et la formule reste vraie). Ainsi \(a_{n+1} = \frac{n}{n+1}a_{n-1}\).</p>
    <ul>
      <li>Indices pairs : \(a_0 = f(0) = 0\), donc tous les \(a_{2p}\) sont nuls (\(f\) est d'ailleurs impaire).</li>
      <li>Indices impairs : \(a_{2p+1} = \frac{2p}{2p+1}a_{2p-1}\), d'où \(a_{2p+1} = \dfrac{2 \cdot 4 \cdots (2p)}{3 \cdot 5 \cdots (2p+1)}\). En multipliant haut et bas par \(2 \cdot 4 \cdots (2p) = 2^p p!\), on obtient \(a_{2p+1} = \dfrac{(2^p p!)^2}{(2p+1)!} = \dfrac{4^p(p!)^2}{(2p+1)!}\).</li>
    </ul>
    <p><strong>Q3.</strong> Pour \(x \neq 0\), le rapport de deux termes non nuls consécutifs vaut \(\dfrac{a_{2p+3}x^{2p+3}}{a_{2p+1}x^{2p+1}} = \dfrac{2p+2}{2p+3}\,x^2 \to x^2\) : le rayon vaut 1. La somme \(S\) de la série vérifie donc, sur \(]-1, 1[\), la même équation que \(f\) (le calcul de Q2 se lit à l'envers), avec \(S(0) = 0\). Or l'équation \(y' = \frac{x}{1-x^2}\,y + \frac{1}{1-x^2}\) est linéaire d'ordre 1 à coefficients continus sur \(]-1, 1[\) : elle a une seule solution nulle en 0. Donc \(f = S\) sur \(]-1, 1[\).</p>
    <p><strong>Q4.</strong> En \(x = \frac12\) : \(f\!\left(\frac12\right) = \dfrac{\pi/6}{\sqrt3/2} = \dfrac{\pi}{3\sqrt3}\), et</p>
    <div class="formula">$$a_{2p+1}\left(\frac12\right)^{2p+1} = \frac{4^p(p!)^2}{(2p+1)!\,2^{2p+1}} = \frac{(p!)^2}{2\,(2p+1)!}.$$</div>
    <p>Donc</p>
    <div class="formula">$$\sum_{p=0}^{+\infty}\frac{(p!)^2}{(2p+1)!} = \frac{2\pi}{3\sqrt3} \approx 1{,}2092.$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Une équation d'ordre 2 dont une seule solution est développable</h3>
  <div class="statement">On considère l'équation \((E)\) : \(4x\,y'' + 2y' - y = 0\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer les solutions de \((E)\) développables en série entière en 0, et leur rayon.</div>
  <div class="q"><strong>Q2.</strong> Exprimer leur somme à l'aide de \(\operatorname{ch}\) pour \(x \gt 0\), et de \(\cos\) pour \(x \lt 0\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier que \(z(x) = \operatorname{sh}\sqrt x\) est solution de \((E)\) sur \(]0, +\infty[\). Peut-elle être la restriction à \(]0, r[\) d'une fonction développable en série entière ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Soit \(y = \sum a_n x^n\) de rayon \(R \gt 0\). On réindexe pour faire apparaître \(x^n\) :</p>
    <div class="formula">$$4xy'' = \sum_{n \geq 0}4(n+1)n\,a_{n+1}x^n, \qquad 2y' = \sum_{n \geq 0}2(n+1)a_{n+1}x^n.$$</div>
    <p>L'équation donne, coefficient par coefficient, \((n+1)(4n+2)a_{n+1} = a_n\), soit \(a_{n+1} = \dfrac{a_n}{(2n+2)(2n+1)}\), d'où \(a_n = \dfrac{a_0}{(2n)!}\). Pour \(a_0 \neq 0\), le rapport \(\frac{a_{n+1}}{a_n} \to 0\) : rayon infini. Réciproquement, la somme de cette série vérifie \((E)\) sur \(\mathbb{R}\). Les solutions développables en série entière sont les \(a_0\displaystyle\sum_{n \geq 0}\frac{x^n}{(2n)!}\), \(a_0 \in \mathbb{R}\) : elles forment une droite vectorielle.</p>
    <p><strong>Q2.</strong> Pour \(x \gt 0\), \(x^n = (\sqrt x)^{2n}\) et \(\sum \frac{(\sqrt x)^{2n}}{(2n)!} = \operatorname{ch}\sqrt x\). Pour \(x \lt 0\), \(x^n = (-1)^n(\sqrt{-x})^{2n}\) et la somme vaut \(\cos\sqrt{-x}\).</p>
    <p><strong>Q3.</strong> Avec \(s = \sqrt x\) : \(z' = \frac{\operatorname{ch} s}{2s}\) et \(z'' = \frac{\operatorname{sh} s}{4s^2} - \frac{\operatorname{ch} s}{4s^3}\), donc</p>
    <div class="formula">$$4xz'' + 2z' - z = \operatorname{sh} s - \frac{\operatorname{ch} s}{s} + \frac{\operatorname{ch} s}{s} - \operatorname{sh} s = 0.$$</div>
    <p>Mais \(z'(x) = \frac{\operatorname{ch}\sqrt x}{2\sqrt x} \to +\infty\) quand \(x \to 0^+\), alors qu'une somme de série entière est de classe \(C^1\) (et même \(C^\infty\)) au voisinage de 0 : \(z\) n'est la restriction d'aucune fonction développable en série entière. Sur \(]0, +\infty[\), où le coefficient \(4x\) ne s'annule pas, l'espace des solutions est de dimension 2 (engendré par \(\operatorname{ch}\sqrt x\) et \(\operatorname{sh}\sqrt x\)) ; la méthode des séries entières n'en trouve qu'une droite, car le théorème de Cauchy ne s'applique pas au point 0, où le coefficient de \(y''\) s'annule.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Une fonction définie par une série entière</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : rayon, somme, continuité au bord, équation différentielle, produit de Cauchy).</div>
  <div class="statement">On considère la série entière \(\displaystyle S(x) = \sum_{n=0}^{+\infty} \frac{x^n}{n+1}\).</div>
  <div class="exo-part"><strong>Partie A — Rayon et expression.</strong></div>
  <div class="q"><strong>A1.</strong> Déterminer le rayon de convergence \(R\).</div>
  <div class="q"><strong>A2.</strong> Pour \(x \ne 0\) dans l'intervalle de convergence, exprimer \(x\,S(x)\) comme une série connue, puis en déduire une expression de \(S(x)\) à l'aide de \(\ln\).</div>
  <div class="q"><strong>A3.</strong> Étudier la convergence en \(x = -1\) et en \(x = 1\). En déduire l'intervalle de définition de \(S\) et la valeur de \(S(-1)\).</div>
  <div class="exo-part"><strong>Partie B — Application.</strong></div>
  <div class="q"><strong>B1.</strong> En déduire la valeur de \(\displaystyle\sum_{n=0}^{+\infty} \frac{1}{(n+1)2^n}\).</div>
  <div class="q"><strong>B2.</strong> Calculer de même \(\displaystyle\sum_{n=0}^{+\infty} \frac{(-1)^n}{(n+1)2^n}\).</div>
  <div class="exo-part"><strong>Partie C — Une équation différentielle.</strong></div>
  <div class="q"><strong>C1.</strong> Montrer que \(S\) est solution sur \(]-1, 1[\) de l'équation \(x\,y' + y = \dfrac{1}{1-x}\).</div>
  <div class="q"><strong>C2.</strong> Réciproquement, déterminer toutes les solutions de cette équation développables en série entière en 0. Que dire des solutions \(x \mapsto S(x) + \frac{C}{x}\) (\(C \neq 0\)) sur \(]0, 1[\) ?</div>
  <div class="exo-part"><strong>Partie D — Produit de Cauchy et nombres harmoniques.</strong></div>
  <div class="q"><strong>D1.</strong> On note \(H_n = \sum_{k=1}^{n}\frac1k\). À l'aide d'un produit de Cauchy, montrer que \(-\dfrac{\ln(1-x)}{1-x} = \displaystyle\sum_{n=1}^{+\infty} H_n x^n\) pour \(|x| \lt 1\).</div>
  <div class="q"><strong>D2.</strong> Déterminer le rayon de la série \(\sum H_n x^n\), puis la valeur de \(\displaystyle\sum_{n=1}^{+\infty}\frac{H_n}{2^n}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(a_n = \frac{1}{n+1}\), \(\left|\frac{a_{n+1}}{a_n}\right| = \frac{n+1}{n+2}\to 1\), donc \(R = 1\).</p>
    <p><strong>A2.</strong> Pour \(|x| \lt 1\), le développement de \(\ln\) donne</p>
    <div class="formula">$$x\,S(x) = \sum_{n\ge 0}\frac{x^{n+1}}{n+1} = \sum_{k\ge 1}\frac{x^k}{k} = -\ln(1-x).$$</div>
    <p>Donc pour \(x\in\,]\!-\!1,1[\setminus\{0\}\) : \(S(x) = \dfrac{-\ln(1-x)}{x}\) (et \(S(0)=1\)).</p>
    <p><strong>A3.</strong> En \(x=-1\) : \(\sum \frac{(-1)^n}{n+1}\) converge (théorème des séries alternées : \(\frac{1}{n+1}\) décroît vers 0). En \(x=1\) : \(\sum \frac{1}{n+1}\) diverge (série harmonique). L'intervalle de définition est donc \([-1, 1[\). Par le théorème de continuité, \(S\) est continue en \(-1\), et \(S(-1) = \lim_{x \to -1^+}\frac{-\ln(1-x)}{x} = \frac{-\ln 2}{-1} = \ln 2\) : on retrouve \(\sum_{n \geq 0}\frac{(-1)^n}{n+1} = \ln 2\).</p>
    <p><strong>B1.</strong> C'est \(S\!\left(\frac12\right) = \dfrac{-\ln(1/2)}{1/2} = 2\ln 2\).</p>
    <p><strong>B2.</strong> C'est \(S\!\left(-\frac12\right) = \dfrac{-\ln(3/2)}{-1/2} = 2\ln\dfrac32 \approx 0{,}811\).</p>
    <p><strong>C1.</strong> Sur \(]-1, 1[\), \(x\,S(x) = \sum_{n \geq 0}\frac{x^{n+1}}{n+1}\) se dérive terme à terme : \(\big(xS(x)\big)' = \sum_{n \geq 0}x^n = \frac{1}{1-x}\). Or \(\big(xS(x)\big)' = xS'(x) + S(x)\) : c'est l'équation annoncée.</p>
    <p><strong>C2.</strong> Si \(y = \sum b_n x^n\) (rayon \(\gt 0\)) est solution, \(xy' + y = \sum_{n \geq 0}(n+1)b_n x^n\), et l'équation, comparée à \(\sum x^n\) sur un voisinage de 0, impose \((n+1)b_n = 1\) par unicité des coefficients : \(b_n = \frac{1}{n+1}\). La seule solution développable en série entière est \(S\). Sur \(]0, 1[\), l'équation homogène \(xy' + y = 0\), c'est-à-dire \((xy)' = 0\), a pour solutions \(\frac Cx\), et les solutions générales sont \(S(x) + \frac Cx\) : pour \(C \neq 0\), elles tendent vers \(\pm\infty\) en \(0^+\) et ne peuvent pas être développables en série entière (une telle somme est continue en 0).</p>
    <p><strong>D1.</strong> Pour \(|x| \lt 1\), \(-\ln(1-x) = \sum_{k \geq 1}\frac{x^k}{k}\) et \(\frac{1}{1-x} = \sum_{m \geq 0}x^m\), toutes deux de rayon 1 : leur produit de Cauchy a pour coefficient \(c_n = \sum_{k=1}^{n}\frac1k \cdot 1 = H_n\) (le coefficient d'indice 0 du logarithme est nul), et il vaut sur \(]-1, 1[\) le produit des sommes.</p>
    <p><strong>D2.</strong> Pour \(n \geq 1\), \(1 \leq H_n \leq n\) : la comparaison donne \(R \geq R\big(\sum nx^n\big) = 1\) et \(R \leq R\big(\sum x^n\big) = 1\), donc \(R = 1\) (on peut aussi utiliser \(H_n \sim \ln n\)). En \(x = \frac12\) : \(\displaystyle\sum_{n \geq 1}\frac{H_n}{2^n} = \frac{-\ln(1/2)}{1/2} = 2\ln 2\), la même valeur qu'en B1.</p>
  </div>
