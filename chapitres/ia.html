<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Convergence d'une descente de gradient</h3>
  <div class="statement">On ajuste un modèle sans biais \(\hat{y} = w\,x\) sur trois données \((x_i, y_i)\) : \((1 ; 2{,}1)\), \((2 ; 3{,}9)\), \((3 ; 6{,}0)\), en minimisant \(J(w) = \frac{1}{N}\sum_{i=1}^{N}(y_i - w x_i)^2\). On note \(S = \frac{1}{N}\sum x_i^2\) et \(C = \frac{1}{N}\sum x_iy_i\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(J'(w)\) en fonction de \(S\) et \(C\). En déduire le minimiseur \(w^*\) et sa valeur numérique.</div>
  <div class="q"><strong>Q2.</strong> On applique \(w_{p+1} = w_p - \eta J'(w_p)\). Montrer que \(w_{p+1} - w^* = (1 - 2\eta S)(w_p - w^*)\). À quelle condition sur \(\eta\) la méthode converge-t-elle ? Quelle valeur de \(\eta\) donne la convergence en une itération ?</div>
  <div class="q"><strong>Q3.</strong> Avec \(w_0 = 0\) et \(\eta = 0{,}05\), calculer \(w_1\) et \(w_2\), puis le nombre d'itérations nécessaires pour que \(|w_p - w^*| \lt 0{,}01\). Que se passe-t-il avec \(\eta = 0{,}25\) ?</div>
  <div class="q"><strong>Q4.</strong> <em>(Hors programme, pour aller plus loin.)</em> Écrire la mise à jour de la version stochastique (un exemple \(i\) par pas), décrite en fin de cours.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong></p>
    <div class="formula">$$J'(w) = -\frac{2}{N}\sum_{i} x_i(y_i - wx_i) = 2(Sw - C)$$</div>
    <p>nul pour \(w^* = C/S\). Ici \(S = \frac{1 + 4 + 9}{3} = \frac{14}{3} \approx 4{,}667\) et \(C = \frac{2{,}1 + 7{,}8 + 18{,}0}{3} = 9{,}3\), donc \(w^* = 27{,}9/14 \approx 1{,}993\). \(J'' = 2S \gt 0\) : c'est bien un minimum.</p>
    <p><strong>Q2.</strong> \(w_{p+1} = w_p - 2\eta(Sw_p - C)\) ; comme \(C = Sw^*\) :</p>
    <div class="formula">$$w_{p+1} - w^* = (w_p - w^*) - 2\eta S\,(w_p - w^*) = (1 - 2\eta S)(w_p - w^*)$$</div>
    <p>L'erreur est une suite géométrique de raison \(q = 1 - 2\eta S\) : convergence si et seulement si \(|q| \lt 1\), soit \(0 \lt \eta \lt 1/S \approx 0{,}214\) (on retrouve la condition \(\eta \lt 2/\lambda_{\max}\) du complément du §6, avec \(J'' = 2S\)). Pour \(\eta = 1/(2S) \approx 0{,}107\), \(q = 0\) : convergence en un pas (cas idéal propre au quadratique 1D).</p>
    <p><strong>Q3.</strong> \(q = 1 - 2\times0{,}05\times\frac{14}{3} \approx 0{,}533\). Puis :</p>
    <div class="formula">$$w_1 = 0 - 0{,}05\times2\,(0 - 9{,}3) = 0{,}93$$</div>
    <div class="formula">$$w_2 = 0{,}93 - 0{,}1\,(4{,}667\times0{,}93 - 9{,}3) \approx 1{,}426$$</div>
    <p>Comme \(|w_p - w^*| = 0{,}533^p\times1{,}993\), il faut \(p \gt \dfrac{\ln(0{,}01/1{,}993)}{\ln 0{,}533} \approx 8{,}4\), soit <strong>9 itérations</strong>. Avec \(\eta = 0{,}25 \gt 1/S\) : \(q \approx -1{,}33\), l'erreur change de signe et croît en valeur absolue à chaque pas : la suite <strong>diverge en oscillant</strong>.</p>
    <p><strong>Q4.</strong> Pour l'exemple \(i\) tiré au hasard, la perte élémentaire \((y_i - wx_i)^2\) a pour dérivée \(-2x_i(y_i - wx_i)\), d'où \(w \leftarrow w + 2\eta\,x_i\,(y_i - w x_i)\). Une époque enchaîne les 3 exemples, dans un ordre mélangé à chaque époque.</p>
  </div>
</div>

  <div class="statement">On veut classer un nouveau moteur M : \(T = 60\ \text{°C}\), \(v = 5{,}0\ \text{mm/s}\).</div>

    <p><strong>Q2.</strong> \(T' = (T - 48)/44\) et \(v' = (v - 1{,}2)/5{,}2\). Coordonnées normalisées (arrondies) : A (0,05 ; 0,00), B (0,23 ; 0,12), C (0,32 ; 0,06), D (0,41 ; 0,19), E (0,00 ; 0,92), F (0,61 ; 0,81), G (0,91 ; 0,25), H (1,00 ; 1,00), et M (0,27 ; 0,73). Distances : E ≈ 0,33 ; F ≈ 0,35 ; D ≈ 0,56 ; B ≈ 0,62 ; C ≈ 0,67 ; A ≈ 0,77 ; H ≈ 0,78 ; G ≈ 0,80. Les 3 voisins E (D), F (D), D (S) donnent <strong>défaillant</strong> par 2 voix contre 1. Une fois les échelles égalisées, le niveau vibratoire élevé de M — signature typique d'un roulement dégradé — est enfin pris en compte. La conclusion dépendait d'un simple choix d'unités : la mise à l'échelle est indispensable.</p>
    <p><strong>Q3.</strong> \(k = 1\) : voisin E → défaillant. \(k = 5\) : E, F (D) contre D, B, C (S) → sain. La prédiction est sensible à \(k\) car M se trouve entre les deux groupes. Pour choisir \(k\), on évalue plusieurs valeurs impaires sur un jeu de <strong>validation</strong> (ou par validation croisée) avec l'indicateur du cahier des charges (ici plutôt le rappel de la classe D), et on retient la meilleure ; le test final sert ensuite à estimer la performance.</p>

  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Neurone, softmax et un pas de rétropropagation</h3>
  <div class="statement">On étudie quelques calculs élémentaires dans un réseau de neurones de tri de colis.</div>
  <div class="q"><strong>Q1.</strong> Le réseau prend 4 caractéristiques (longueur, largeur, hauteur, masse), a deux couches cachées de 8 neurones et une sortie à 3 classes (petit, moyen, volumineux). Compter les poids et les biais.</div>
  <div class="q"><strong>Q2.</strong> Pour un colis, la couche de sortie produit \(z = (2 ; 1 ; -1)\). Calculer les probabilités softmax, la classe prédite, puis la perte d'entropie croisée si la vraie classe est « petit » (1ʳᵉ), puis si c'est « moyen ».</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\sigma'(z) = \sigma(z)\left(1 - \sigma(z)\right)\) pour la sigmoïde \(\sigma(z) = 1/(1 + e^{-z})\).</div>
  <div class="q"><strong>Q4.</strong> Un neurone sigmoïde isolé, de poids \(w = (0{,}5 ; -0{,}25)\) et de biais \(b = 0\), reçoit \(x = (1 ; 2)\) d'étiquette \(y = 1\), avec la perte d'entropie croisée binaire (on admet \(\partial L/\partial z = \hat{y} - y\)). Calculer \(\hat{y}\), le gradient par rapport à \(w\) et \(b\), effectuer un pas avec \(\eta = 0{,}1\) et vérifier que la prédiction s'améliore.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Entrée → 1ʳᵉ cachée : \(4\times8 = 32\) poids + 8 biais ; 1ʳᵉ → 2ᵉ cachée : \(8\times8 = 64\) poids + 8 biais ; 2ᵉ cachée → sortie : \(8\times3 = 24\) poids + 3 biais. Total : 120 poids et 19 biais, soit <strong>139 paramètres</strong> (\(5\times8 + 9\times8 + 9\times3 = 139\)).</p>
    <p><strong>Q2.</strong> \(e^2 \approx 7{,}389\), \(e^1 \approx 2{,}718\), \(e^{-1} \approx 0{,}368\), somme ≈ 10,475. Probabilités : \(\hat{y} \approx (0{,}705 ; 0{,}259 ; 0{,}035)\), de somme 1 ✓ ; classe prédite : <strong>petit</strong>. Si la vraie classe est « petit » : \(L = -\ln 0{,}705 \approx 0{,}35\). Si c'est « moyen » : \(L = -\ln 0{,}259 \approx 1{,}35\), perte bien plus forte puisque le réseau s'est trompé.</p>
    <p><strong>Q3.</strong> On dérive puis on factorise :</p>
    <div class="formula">$$\sigma'(z) = \frac{e^{-z}}{(1 + e^{-z})^2} = \frac{1}{1 + e^{-z}}\cdot\frac{e^{-z}}{1 + e^{-z}}$$</div>
    <div class="formula">$$\text{et}\quad \frac{e^{-z}}{1 + e^{-z}} = 1 - \frac{1}{1 + e^{-z}} = 1 - \sigma(z)$$</div>
    <p>D'où le résultat ; en particulier \(\sigma'(0) = 1/4\) est le maximum de \(\sigma'\).</p>
    <p><strong>Q4.</strong> \(z = 0{,}5\times1 - 0{,}25\times2 + 0 = 0\), donc \(\hat{y} = \sigma(0) = 0{,}5\). \(\partial L/\partial z = 0{,}5 - 1 = -0{,}5\) ; \(\partial L/\partial w_j = (\partial L/\partial z)\,x_j\), soit \(\nabla_w L = (-0{,}5 ; -1)\) et \(\partial L/\partial b = -0{,}5\). Mise à jour (\(w \leftarrow w - \eta\nabla_w L\)) :</p>
    <div class="formula">$$w = (0{,}5 + 0{,}05\ ;\ -0{,}25 + 0{,}1) = (0{,}55\ ;\ -0{,}15) \qquad b = 0{,}05$$</div>
    <p>Nouvelle sortie : \(z = 0{,}55 - 0{,}30 + 0{,}05 = 0{,}30\), \(\hat{y} = \sigma(0{,}3) \approx 0{,}574\) : la prédiction s'est rapprochée de l'étiquette 1 et la perte est passée de \(-\ln 0{,}5 \approx 0{,}69\) à \(-\ln \sigma(0{,}3) \approx 0{,}55\).</p>
  </div>
</div>

  <h3>Régler le seuil d'un détecteur de défaut de roulement</h3>

  <div class="statement">Un roulement est déclaré défectueux si son score est supérieur ou égal au seuil \(s\). Le cahier des charges impose un rappel d'au moins 0,8 (un roulement défectueux non détecté peut détruire la broche) ; parmi les seuils qui le respectent, on veut la meilleure spécificité (chaque alerte coûte un démontage).</div>
  <div class="q"><strong>Q1.</strong> Pour \(s = 0{,}5\), construire la matrice de confusion (lignes : classe réelle ; colonnes : classe prédite) et calculer exactitude, précision, rappel et spécificité.</div>
  <div class="q"><strong>Q2.</strong> Calculer le rappel et la spécificité pour \(s = 0{,}7\), \(s = 0{,}3\) et \(s = 0{,}25\). Commenter l'évolution quand le seuil baisse.</div>
  <div class="q"><strong>Q3.</strong> Quel seuil retenir ? Pourquoi le choisit-on sur le jeu de validation plutôt que sur le jeu de test ? Quelle réserve inspire un jeu de 12 exemples ?</div>
  <div class="q"><strong>Q4.</strong> Écrire une fonction Python <code class="code-inline">indicateurs(score, y, seuil)</code>, sans bibliothèque, qui renvoie le couple (rappel, spécificité).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Scores ≥ 0,5 : 0,92 ; 0,81 ; 0,64 (défectueux) et 0,55 (sain). VP = 3, FN = 2 (0,45 et 0,28 manqués), FP = 1, VN = 6. Matrice \(\begin{pmatrix} 3 &amp; 2 \\ 1 &amp; 6 \end{pmatrix}\), de somme 12. Exactitude \(9/12 = 0{,}75\) ; précision \(3/4 = 0{,}75\) ; rappel \(3/5 = 0{,}6\) ; spécificité \(6/7 \approx 0{,}86\). Le rappel ne respecte pas le cahier des charges.</p>
    <p><strong>Q2.</strong> \(s = 0{,}7\) : VP = 2, FP = 0 → rappel 0,4, spécificité 1. \(s = 0{,}3\) : VP = 4 (0,28 reste manqué), FP = 2 (0,55 et 0,38) → rappel 0,8, spécificité \(5/7 \approx 0{,}71\). \(s = 0{,}25\) : VP = 5, FP = 2 → rappel 1, spécificité \(5/7\). Quand le seuil baisse, des exemples passent du côté positif : le rappel ne peut qu'augmenter (ou rester égal), la spécificité ne peut que diminuer (ou rester égale). C'est le compromis du §4 du cours.</p>
    <p><strong>Q3.</strong> Tout seuil de \(]0{,}22\,;\,0{,}28]\) donne rappel 1 et spécificité \(5/7\) ; un seuil de \(]0{,}28\,;\,0{,}38]\) donne rappel 0,8 et la <em>même</em> spécificité. On retient donc un seuil d'environ 0,25 : meilleur rappel à spécificité égale. Le seuil est un paramètre de classification réglé pendant la mise au point : le choisir sur le test ferait du test une donnée d'apprentissage, et sa performance ne serait plus une estimation honnête de celle en service. Avec 12 exemples, un seul roulement de plus ou de moins fait varier le rappel de 0,2 : le réglage est fragile, il faudrait un jeu de validation bien plus grand (ou une validation croisée).</p>
    <p><strong>Q4.</strong></p>
<pre class="codeblock"><span class="kw">def</span> indicateurs(score, y, seuil):
    VP = FN = FP = VN = 0
    <span class="kw">for</span> s, e <span class="kw">in</span> zip(score, y):
        pred = 1 <span class="kw">if</span> s >= seuil <span class="kw">else</span> 0
        <span class="kw">if</span> e == 1 <span class="kw">and</span> pred == 1: VP += 1
        <span class="kw">elif</span> e == 1: FN += 1
        <span class="kw">elif</span> pred == 1: FP += 1
        <span class="kw">else</span>: VN += 1
    <span class="kw">return</span> VP / (VP + FN), VN / (VN + FP)</pre>
    <p>Appelée avec les données de l'énoncé pour les seuils 0,7 ; 0,5 ; 0,3 ; 0,25, elle renvoie (0,4 ; 1,0), (0,6 ; 0,857), (0,8 ; 0,714) et (1,0 ; 0,714).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Maintenance prédictive d'une électrobroche</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>intelligence artificielle</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un fabricant de centres d'usinage veut anticiper les défaillances des électrobroches (moteurs de broche à grande vitesse). Pour chaque broche, l'automate enregistre toutes les heures quatre grandeurs : vitesse de rotation \(N\) (tr/min, de 2000 à 24 000), puissance \(P\) (kW, de 0,5 à 15), température du palier avant \(T\) (°C, de 25 à 80) et vitesse vibratoire efficace \(v\) (mm/s, de 0,3 à 8). Deux objectifs sont visés : estimer l'<strong>usure</strong> des roulements (en µm), et prédire une <strong>défaillance dans les 48 h</strong> (oui / non).
  </div>

  <p class="exo-part">Partie A — Analyse du problème et prétraitement</p>
  <div class="q"><strong>A1.</strong> Pour chacun des deux objectifs, préciser le type d'apprentissage et de problème.</div>
  <div class="q"><strong>A2.</strong> Justifier la nécessité d'une mise à l'échelle des quatre caractéristiques. Écrire une fonction Python <code class="code-inline">standardiser(X_entr, X_test)</code> (tableaux numpy, une colonne par caractéristique) qui renvoie les deux tableaux standardisés, en respectant les bonnes pratiques.</div>
  <div class="q"><strong>A3.</strong> Pour la défaillance, on dispose de 2000 relevés étiquetés, séparés en 70 % / 30 %. Combien d'exemples d'entraînement et de test ? Pourquoi mélanger les relevés avant la séparation ?</div>

  <p class="exo-part">Partie B — Régression de l'usure (la régularisation Ridge du modèle M3 et la question B3 sont hors programme, pour aller plus loin : voir la fin du cours)</p>
  <div class="statement">La mesure de l'usure impose de démonter la broche : on ne dispose que de 60 mesures (42 en entraînement, 18 en test), d'usures comprises entre 5 et 45 µm et d'écart type ≈ 10,4 µm. Trois modèles sont comparés :</div>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:.82rem;margin:.5rem 0;text-align:center">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem .5rem;border:1px solid var(--grid)">Modèle</th><th style="padding:.3rem .5rem;border:1px solid var(--grid)">Nb de coefficients</th><th style="padding:.3rem .5rem;border:1px solid var(--grid)">RMSE entraînement</th><th style="padding:.3rem .5rem;border:1px solid var(--grid)">RMSE test</th><th style="padding:.3rem .5rem;border:1px solid var(--grid)">\(R^2\) test</th></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">M1 : linéaire en \(N, P, T, v\)</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">?</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">4,2 µm</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">4,9 µm</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">0,78</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">M2 : polynôme de degré ≤ 3</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">?</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">0,8 µm</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">13 µm</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">?</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">M3 : M2 + régularisation Ridge</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">idem M2</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">3,6 µm</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">4,1 µm</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">0,85</td></tr>
  </table></div>
  <div class="q"><strong>B1.</strong> Combien de coefficients (biais compris) comportent M1 et M2 ? (M2 utilise tous les monômes en \(N, P, T, v\) de degré inférieur ou égal à 3.)</div>
  <div class="q"><strong>B2.</strong> Estimer le \(R^2\) de test de M2 (on assimilera la variance des usures de test à \(10{,}4^2\)). Que vaudraient la RMSE et le \(R^2\) d'un modèle prédisant toujours l'usure moyenne ? Diagnostiquer chacun des trois modèles.</div>
  <div class="q"><strong>B3.</strong> <em>(Hors programme, pour aller plus loin.)</em> La perte Ridge s'écrit ici \(J_R(w) = \lVert y - Xw\rVert^2 + \lambda\lVert w\rVert^2\) (données centrées). Établir l'expression de son minimiseur et montrer que la matrice à inverser l'est toujours pour \(\lambda \gt 0\).</div>
  <div class="q"><strong>B4.</strong> Comment le coefficient \(\lambda\) de M3 doit-il être choisi ? Pourquoi pas sur les 18 données de test ?</div>

  <p class="exo-part">Partie C — Classification de la défaillance</p>
  <div class="statement">Sur les 600 relevés de test, 60 correspondent à une défaillance effective dans les 48 h (classe positive). Le cahier des charges impose un <strong>rappel ≥ 0,90</strong> (une défaillance non anticipée immobilise la machine plusieurs jours) et une <strong>spécificité ≥ 0,90</strong> (chaque alerte déclenche une intervention coûteuse). Deux classifieurs donnent :</div>

    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Réseau de neurones</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">55</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">5</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">40</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">500</td></tr>
  </table></div>
  <div class="q"><strong>C1.</strong> Calculer, pour chaque classifieur, l'exactitude, la précision, le rappel et la spécificité. Lequel respecte le cahier des charges ? Commenter le classement selon l'exactitude seule.</div>
  <div class="q"><strong>C2.</strong> Le réseau comporte 4 entrées, deux couches cachées de 16 et 8 neurones (ReLU) et un neurone de sortie. Quelle activation et quelle fonction de perte choisir pour la sortie ? Compter les paramètres.</div>
  <div class="q"><strong>C3.</strong> La sortie du réseau est comparée à un seuil de 0,5. Quel serait l'effet d'un seuil de 0,3 sur les indicateurs ? Dans quel cas serait-il judicieux ?</div>
  <div class="q"><strong>C4.</strong> Compléter le script : <code class="code-inline">clf = MLPClassifier(hidden_layer_sizes=......, activation=......, max_iter=2000)</code>, puis les lignes d'apprentissage, de prédiction sur le test et d'affichage de la matrice de confusion.</div>

  <p class="exo-part">Partie D — Implantation embarquée</p>
  <div class="q"><strong>D1.</strong> L'inférence doit tourner dans l'automate de la machine. Comparer, en ordre de grandeur, le nombre d'opérations et la mémoire nécessaires à une prédiction par le k-NN (1400 exemples d'entraînement) et par le réseau de neurones. Conclure.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Usure : grandeur continue mesurée → apprentissage <strong>supervisé</strong>, <strong>régression</strong>. Défaillance dans les 48 h : étiquette oui / non → <strong>supervisé</strong>, <strong>classification binaire</strong>.</p>
    <p><strong>A2.</strong> Les grandeurs ont des unités et des ordres de grandeur très différents (\(N \sim 10^4\), \(v \sim 1\)) : sans mise à l'échelle, \(N\) dominerait les distances du k-NN et déséquilibrerait la descente de gradient du réseau. Les moyennes et écarts types se calculent sur l'entraînement seul et s'appliquent aux deux tableaux :</p>
<pre class="codeblock"><span class="kw">def</span> standardiser(X_entr, X_test):
    mu = X_entr.mean(axis=0)          <span class="cmt"># moyenne de chaque colonne (entraînement)</span>
    sigma = X_entr.std(axis=0)        <span class="cmt"># écart type de chaque colonne (entraînement)</span>
    <span class="kw">return</span> (X_entr - mu) / sigma, (X_test - mu) / sigma</pre>
    <p><strong>A3.</strong> 1400 exemples d'entraînement et 600 de test. Les relevés étant horaires, ils sont rangés chronologiquement (et par broche) : sans mélange, le test ne contiendrait que les dernières heures ou d'autres broches, avec des conditions différentes de celles de l'entraînement, ce qui biaiserait l'évaluation. <em>Nuance :</em> deux relevés horaires consécutifs d'une même broche se ressemblent beaucoup ; après un mélange au hasard, le test contient des « quasi-copies » de relevés d'entraînement et la performance est surestimée. Pour juger la capacité à prédire des broches ou des périodes nouvelles, on réserve plutôt certaines broches (ou les dernières semaines) au test.</p>
    <p><strong>B1.</strong> M1 : 4 poids + 1 biais = <strong>5</strong> coefficients. M2 : le nombre de monômes de degré au plus 3 en 4 variables est \(\binom{4+3}{3} = 35\) (1 constant, 4 de degré 1, 10 de degré 2, 20 de degré 3), soit <strong>35</strong> coefficients — presque autant que les 42 données d'entraînement.</p>
    <p><strong>B2.</strong></p>
    <div class="formula">$$R^2 \approx 1 - \frac{13^2}{10{,}4^2} = 1 - \frac{169}{108} \approx -0{,}56$$</div>
    <p>Le modèle constant égal à la moyenne aurait une RMSE ≈ écart type ≈ 10,4 µm et \(R^2 = 0\) : M2 fait <strong>pire</strong> qu'une simple moyenne. Diagnostic : M2 est en <strong>surapprentissage</strong> massif (RMSE de 0,8 µm en entraînement contre 13 µm en test, 35 coefficients pour 42 données). M1 est correct mais un peu limité (erreurs voisines en entraînement et en test, ≈ 12 % de l'étendue : léger sous-apprentissage possible). M3 est le meilleur : la régularisation a supprimé le surapprentissage tout en gardant la richesse du polynôme (RMSE de test ≈ 4 µm, soit 10 % de l'étendue, \(R^2 = 0{,}85\)).</p>
    <p><strong>B3.</strong> \(\nabla J_R(w) = -2X^{\mathsf T}(y - Xw) + 2\lambda w\), nul si et seulement si \((X^{\mathsf T}X + \lambda I)\,w = X^{\mathsf T}y\), d'où</p>
    <div class="formula">$$\hat{w}_R = \left(X^{\mathsf T}X + \lambda I\right)^{-1}X^{\mathsf T}y$$</div>
    <p>Pour tout \(u \neq 0\) :</p>
    <div class="formula">$$u^{\mathsf T}(X^{\mathsf T}X + \lambda I)\,u = \lVert Xu\rVert^2 + \lambda\lVert u\rVert^2 \geq \lambda\lVert u\rVert^2 \gt 0$$</div>
    <p>La matrice symétrique \(X^{\mathsf T}X + \lambda I\) est donc définie positive (ses valeurs propres sont celles de \(X^{\mathsf T}X\), positives, augmentées de \(\lambda\)), donc inversible — même si \(X^{\mathsf T}X\) ne l'est pas (plus de coefficients que de données, colonnes liées). \(J_R\) étant convexe, ce point critique est le minimum global.</p>
    <p><strong>B4.</strong> On teste plusieurs valeurs de \(\lambda\) (par exemple de \(10^{-3}\) à \(10^{3}\) en progression géométrique) par <strong>validation croisée</strong> sur les 42 données d'entraînement, et on retient celle qui minimise l'erreur de validation. Choisir \(\lambda\) sur le test reviendrait à apprendre sur le test : sa RMSE ne serait plus une estimation honnête de l'erreur en service (d'autant plus avec seulement 18 données).</p>
    <p><strong>C1.</strong> k-NN : exactitude \(= \frac{45 + 513}{600} = 0{,}93\) ; précision \(= \frac{45}{72} \approx 0{,}63\) ; rappel \(= \frac{45}{60} = 0{,}75\) ; spécificité \(= \frac{513}{540} = 0{,}95\). Réseau : exactitude \(= \frac{55 + 500}{600} \approx 0{,}925\) ; précision \(= \frac{55}{95} \approx 0{,}58\) ; rappel \(= \frac{55}{60} \approx 0{,}92\) ; spécificité \(= \frac{500}{540} \approx 0{,}93\). Seul le <strong>réseau</strong> respecte les deux exigences (le k-NN manque 25 % des défaillances). Pourtant, son exactitude est légèrement inférieure : avec 90 % de relevés négatifs (un modèle répondant toujours « non » aurait 0,90 d'exactitude), l'exactitude n'est pas le bon critère de choix.</p>
    <p><strong>C2.</strong> Sortie : un neurone <strong>sigmoïde</strong> (probabilité de défaillance), perte d'<strong>entropie croisée binaire</strong>. Paramètres :</p>
    <div class="formula">$$(4+1)\times16 + (16+1)\times8 + (8+1)\times1 = 80 + 136 + 9 = 225$$</div>
    <p><strong>C3.</strong> Davantage de relevés seraient déclarés positifs : le rappel augmenterait (moins de défaillances manquées), la spécificité baisserait, et la précision en général aussi (plus d'interventions inutiles). Ce serait judicieux si le coût d'une défaillance non anticipée devenait prépondérant (machine critique dans la production), à condition que la spécificité reste au-dessus de 0,90.</p>
    <p><strong>C4.</strong></p>
<pre class="codeblock"><span class="kw">from</span> sklearn.neural_network <span class="kw">import</span> MLPClassifier
<span class="kw">from</span> sklearn.metrics <span class="kw">import</span> confusion_matrix
clf = MLPClassifier(hidden_layer_sizes=(16, 8), activation=<span class="str">'relu'</span>, max_iter=2000)
clf.fit(X_entr, y_entr)                   <span class="cmt"># apprentissage (données standardisées)</span>
y_pred = clf.predict(X_test)              <span class="cmt"># inférence sur le test</span>
print(confusion_matrix(y_test, y_pred))   <span class="cmt"># [[VN, FP], [FN, VP]] avec 0 = pas de défaillance</span></pre>
    <p><strong>D1.</strong> k-NN : pour chacun des 1400 exemples, 4 soustractions, 4 multiplications et 3 additions (pas de racine nécessaire), soit ≈ \(1{,}5\times10^4\) opérations, plus la recherche des 5 plus petites distances (≈ \(10^4\) comparaisons) ; il faut stocker les 1400 × 4 valeurs et les 1400 étiquettes (7000 nombres). Réseau : \(4\times16 + 16\times8 + 8\times1 = 200\) multiplications et autant d'additions, 25 biais et 25 activations, soit ≈ 450 opérations, et 225 paramètres à stocker. Le réseau est environ <strong>50 fois moins coûteux</strong> en calcul et 30 fois moins en mémoire : il est bien plus adapté à une exécution embarquée à chaque cycle de l'automate, en plus de satisfaire le cahier des charges.</p>
  </div>
