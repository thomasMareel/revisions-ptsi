<template class="pan-tpl" data-panneau="vd2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · VA DISCRÈTES II</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à justifier l'existence d'une espérance ou d'une variance puis à la calculer (série, queues, transfert, indicatrices, covariance, fonction génératrice), et à majorer une probabilité par les inégalités de Markov et de Bienaymé-Tchebychev.</div>

  <div class="method-box"><strong>Méthode 1 — Justifier l'existence d'une espérance, puis la calculer</strong>
    <ol>
      <li>Écrire la série \(\sum x_n\,P(X = x_n)\) sur les valeurs de \(X\).</li>
      <li>Prouver la convergence <em>absolue</em> : pour une variable positive, la convergence suffit ; sinon étudier \(\sum |x_n|\,P(X = x_n)\) (comparaison, équivalent, critère de d'Alembert). Une variable bornée est toujours d'espérance finie.</li>
      <li>Calculer la somme avec une série de référence : géométrique et ses dérivées, \(\sum_{k \geq 1} kx^{k-1} = \frac{1}{(1-x)^2}\) et \(\sum_{k \geq 2} k(k-1)x^{k-2} = \frac{2}{(1-x)^3}\) pour \(|x| \lt 1\), exponentielle, télescopage.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(P(X = k) = \dfrac{k+1}{2^{k+2}}\) pour \(k \in \mathbb{N}\) (c'est bien une loi : \(\frac14\sum (k+1)\left(\frac12\right)^k = \frac14 \cdot 4 = 1\)). La série \(\sum k\,P(X = k)\), à termes positifs, converge (d'Alembert), et \(E(X) = \frac14\sum_{k \geq 1} k(k+1)\left(\frac12\right)^k = \frac14 \cdot 8 = 2\), car \(\sum_{k \geq 1} k(k+1)x^k = \frac{2x}{(1-x)^3}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la seule convergence de \(\sum x_n P(X = x_n)\) ne suffit pas quand \(X\) change de signe ; une série semi-convergente ne définit pas d'espérance (exemple du §1 du cours).</div>

  <div class="method-box"><strong>Méthode 2 — Calculer \(E(X)\) par les queues</strong>
    <ol>
      <li>Vérifier que \(X\) est à valeurs dans \(\mathbb{N}\).</li>
      <li>Calculer \(P(X \geq n)\) (ou \(P(X \gt n)\)) en traduisant l'événement en mots : c'est souvent un produit, pour un maximum, un minimum ou un temps d'attente.</li>
      <li>Sommer : \(E(X) = \sum_{n \geq 1} P(X \geq n) = \sum_{n \geq 0} P(X \gt n)\) ; la convergence de cette série équivaut à l'existence de l'espérance.</li>
    </ol>
    <p><em>Exemple éclair :</em> maximum \(M\) de deux dés indépendants. \(P(M \geq n) = 1 - P(M \leq n - 1) = 1 - \frac{(n-1)^2}{36}\) pour \(1 \leq n \leq 6\), donc \(E(M) = 6 - \frac{0 + 1 + 4 + 9 + 16 + 25}{36} = \frac{161}{36} \approx 4{,}47\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\sum_{n \geq 1} P(X \gt n)\) vaut \(E(X) - P(X \geq 1)\) : bien caler l'indice de départ sur l'inégalité, large ou stricte.</div>

  <div class="method-box"><strong>Méthode 3 — Calculer \(E\big(f(X)\big)\) ou \(E\big(g(X, Y)\big)\) par la formule de transfert</strong>
    <ol>
      <li>Ne pas chercher la loi de \(f(X)\) : écrire directement \(\sum f(x)\,P(X = x)\) sur les valeurs de \(X\).</li>
      <li>Vérifier la convergence absolue de cette série (automatique si \(f(X)\) est bornée ou si la somme est finie).</li>
      <li>Pour une fonction d'un couple, sommer sur les couples de valeurs : \(E\big(g(X, Y)\big) = \sum_{(x, y)} g(x, y)\,P(X = x, Y = y)\) (avec \(P(X = x)P(Y = y)\) si \(X \perp\!\!\!\perp Y\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour un dé équilibré \(X\), \(\frac1X\) est bornée et \(E\big(\frac1X\big) = \frac16\left(1 + \frac12 + \cdots + \frac16\right) = \frac{49}{120} \approx 0{,}408\), alors que \(\frac{1}{E(X)} = \frac27 \approx 0{,}286\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(E\big(f(X)\big) \neq f\big(E(X)\big)\) en général ; l'égalité n'est garantie que pour \(f\) affine (linéarité).</div>

  <div class="method-box"><strong>Méthode 4 — Décomposer une variable de comptage en indicatrices</strong>
    <ol>
      <li>Écrire \(X = \mathbf{1}_{A_1} + \cdots + \mathbf{1}_{A_m}\), où \(A_i\) est l'événement « le \(i\)-ième objet est compté ».</li>
      <li>Espérance, par linéarité et sans hypothèse d'indépendance : \(E(X) = P(A_1) + \cdots + P(A_m)\).</li>
      <li>Variance, si nécessaire : \(V(\mathbf{1}_{A_i}) = P(A_i)\big(1 - P(A_i)\big)\) et \(\operatorname{Cov}(\mathbf{1}_{A_i}, \mathbf{1}_{A_j}) = P(A_i \cap A_j) - P(A_i)P(A_j)\), puis la formule de la variance d'une somme (méthode 6).</li>
    </ol>
    <p><em>Exemple éclair :</em> on lance 20 fois une pièce équilibrée ; \(X\) compte les rangs \(i \in [\![ 1, 19 ]\!]\) où les lancers \(i\) et \(i + 1\) donnent le même côté. Chaque \(A_i\) a la probabilité \(\frac12\), donc \(E(X) = \frac{19}{2}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Calculer une variance</strong>
    <ol>
      <li>Justifier que \(X^2\) est d'espérance finie (cela entraîne l'existence de \(E(X)\)).</li>
      <li>Calculer \(E(X^2)\) par transfert ; pour une variable entière, passer plutôt par \(E\big(X(X-1)\big)\), qui fait apparaître \(k(k-1)\) (dérivée seconde d'une série géométrique, décalage de 2 dans l'exponentielle), puis \(E(X^2) = E\big(X(X-1)\big) + E(X)\).</li>
      <li>Conclure par \(V(X) = E(X^2) - E(X)^2\) (König-Huygens), et \(V(aX + b) = a^2V(X)\) pour une transformation affine.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec la loi \(P(X = k) = \frac{k+1}{2^{k+2}}\) de la méthode 1, \(E\big(X(X-1)\big) = \frac14\sum_{k \geq 2} (k+1)k(k-1)\left(\frac12\right)^k = 6\), en utilisant \(\sum_{k \geq 2} (k+1)k(k-1)x^{k} = \frac{6x^2}{(1-x)^4}\). Donc \(E(X^2) = 6 + 2 = 8\) et \(V(X) = 8 - 2^2 = 4\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(V(-X) = V(X)\), \(V(X + b) = V(X)\) et \(V(2X) = 4V(X)\) : la variance n'est pas linéaire.</div>

  <div class="method-box"><strong>Méthode 6 — Utiliser la covariance et la variance d'une somme</strong>
    <ol>
      <li>Calculer \(\operatorname{Cov}(X, Y) = E(XY) - E(X)E(Y)\), avec \(E(XY)\) par transfert sur le couple ; si \(X \perp\!\!\!\perp Y\), la covariance est nulle sans calcul.</li>
      <li>Appliquer \(V(X + Y) = V(X) + V(Y) + 2\operatorname{Cov}(X, Y)\), et plus généralement \(V\big(\sum X_i\big) = \sum V(X_i) + 2\sum_{i \lt j}\operatorname{Cov}(X_i, X_j)\).</li>
      <li>Pour des variables deux à deux décorrélées (en particulier indépendantes), additionner simplement les variances.</li>
    </ol>
    <p><em>Exemple éclair :</em> on tire sans remise deux jetons parmi 1, 2, 3, 4 ; \(X_1\), \(X_2\) sont les numéros dans l'ordre du tirage. Les 12 couples \((i, j)\), \(i \neq j\), sont équiprobables : \(E(X_1X_2) = \frac{(1 + 2 + 3 + 4)^2 - (1 + 4 + 9 + 16)}{12} = \frac{35}{6}\) et \(E(X_1) = E(X_2) = \frac52\), donc \(\operatorname{Cov}(X_1, X_2) = \frac{35}{6} - \frac{25}{4} = -\frac{5}{12}\). Avec \(V(X_1) = V(X_2) = \frac54\), \(V(X_1 + X_2) = \frac52 - \frac56 = \frac53\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une covariance nulle ne prouve pas l'indépendance ; pour la réfuter, chercher une case \(P(X = x, Y = y)\) nulle alors que \(P(X = x)P(Y = y) \gt 0\).</div>

  <div class="method-box"><strong>Méthode 7 — Identifier une loi et calculer \(E(X)\), \(V(X)\) avec la fonction génératrice</strong>
    <ol>
      <li>Développer \(G_X\) en série entière au voisinage de 0 : le coefficient de \(t^n\) est \(P(X = n)\) (caractérisation de la loi) ; reconnaître au besoin une fonction génératrice du tableau des lois usuelles.</li>
      <li>Espérance : \(E(X) = G_X'(1)\) (\(X\) est d'espérance finie si et seulement si \(G_X\) est dérivable en 1).</li>
      <li>Variance (si le rayon dépasse 1, ou si \(G_X\) est deux fois dérivable en 1) : \(V(X) = G_X''(1) + G_X'(1) - G_X'(1)^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(G_X(t) = \dfrac{(2 + t)^4}{81} = \Big(\dfrac23 + \dfrac13\,t\Big)^4\) : \(X \sim \mathcal{B}(4, \frac13)\). Puis \(G_X'(1) = \frac{4 \times 27}{81} = \frac43\) et \(G_X''(1) = \frac{12 \times 9}{81} = \frac43\), d'où \(E(X) = \frac43\) et \(V(X) = \frac43 + \frac43 - \frac{16}{9} = \frac89\), conformes à \(np\) et \(np(1-p)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Loi d'une somme de variables indépendantes par les fonctions génératrices</strong>
    <ol>
      <li>Vérifier que les variables sont à valeurs dans \(\mathbb{N}\) et indépendantes.</li>
      <li>Multiplier : \(G_{X_1 + \cdots + X_n} = G_{X_1} \cdots G_{X_n}\).</li>
      <li>Reconnaître le produit (stabilité des lois de Poisson, des binomiales de même \(p\)), ou lire les coefficients voulus ; \(E\) et \(V\) de la somme s'en déduisent aussi.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour la somme \(S\) de trois dés, \(G_S(t) = \frac{(t + t^2 + \cdots + t^6)^3}{216}\). Le coefficient de \(t^{10}\) dans \((t + \cdots + t^6)^3\) vaut 27 (nombre de façons d'écrire \(10 = a + b + c\) avec \(1 \leq a, b, c \leq 6\)), donc \(P(S = 10) = \frac{27}{216} = \frac18\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : sans indépendance, \(G_XG_Y\) n'est pas la fonction génératrice de \(X + Y\) ; et ce produit ne renseigne jamais sur le produit \(XY\).</div>

  <div class="method-box"><strong>Méthode 9 — Majorer une probabilité par Markov ou Bienaymé-Tchebychev</strong>
    <ol>
      <li>On ne connaît que l'espérance d'une variable <em>positive</em> : inégalité de Markov, \(P(X \geq a) \leq \frac{E(X)}{a}\).</li>
      <li>On connaît aussi la variance : inclure l'événement dans un écart à la moyenne, \((X \geq a) \subset \big(|X - E(X)| \geq a - E(X)\big)\) pour \(a \gt E(X)\), puis appliquer Bienaymé-Tchebychev, \(P\big(|X - E(X)| \geq \varepsilon\big) \leq \frac{V(X)}{\varepsilon^2}\).</li>
      <li>Pour une meilleure borne, appliquer Markov à une fonction positive croissante bien choisie, \(X^2\), \(t^X\) avec \(t \gt 1\)…</li>
    </ol>
    <p><em>Exemple éclair :</em> \(X \geq 0\), \(E(X) = 3\) : Markov donne \(P(X \geq 12) \leq \frac{3}{12} = \frac14\). Si l'on sait de plus que \(V(X) = 2\) : \(P(X \geq 12) \leq P(|X - 3| \geq 9) \leq \frac{2}{81} \approx 0{,}025\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'inégalité de Markov ne s'applique qu'à une variable positive ; pour minorer une probabilité, passer au contraire : \(P\big(|X - E(X)| \lt \varepsilon\big) \geq 1 - \frac{V(X)}{\varepsilon^2}\).</div>

  <div class="method-box"><strong>Méthode 10 — Dimensionner un nombre d'essais (loi faible des grands nombres)</strong>
    <ol>
      <li>Écrire la moyenne empirique \(\frac{S_n}{n}\) de \(n\) variables i.i.d. (une fréquence si ce sont des indicatrices), d'espérance \(m\) et de variance \(\sigma^2\).</li>
      <li>Calculer \(E\big(\frac{S_n}{n}\big) = m\) et \(V\big(\frac{S_n}{n}\big) = \frac{\sigma^2}{n}\) ; majorer \(\sigma^2\) si besoin (\(p(1-p) \leq \frac14\) pour une fréquence).</li>
      <li>Appliquer Bienaymé-Tchebychev : \(P\big(\big|\frac{S_n}{n} - m\big| \geq \varepsilon\big) \leq \frac{\sigma^2}{n\varepsilon^2}\), puis résoudre \(\frac{\sigma^2}{n\varepsilon^2} \leq \alpha\) en \(n\) (risque \(\alpha\) donné) ou en \(\varepsilon\) (précision obtenue).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour que la fréquence des 6 en \(n\) lancers d'un dé soit à moins de \(0{,}05\) de \(\frac16\) avec un risque d'au plus 5 %, il suffit que \(\frac{5/36}{n \times 0{,}05^2} \leq 0{,}05\), c'est-à-dire \(n \geq 1\,112\).</p>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="vd2-exos">
<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Espérance et variance d'un dé</h3>
  <div class="statement">\(X\) est le résultat d'un dé équilibré à 6 faces.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(E(X)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(V(X)\) et \(\sigma(X)\).</div>
  <div class="q"><strong>Q3.</strong> Donner une variable centrée réduite de la forme \(aX + b\).</div>
  <div class="q"><strong>Q4.</strong> On lance 10 dés indépendants et l'on note \(S\) la somme des résultats. Calculer \(E(S)\) et \(V(S)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(X\) est finie, donc d'espérance finie : \(E(X) = \frac{1 + 2 + \cdots + 6}{6} = \frac{21}{6} = \frac72\).</p>
    <p><strong>Q2.</strong> Par transfert, \(E(X^2) = \frac{1 + 4 + 9 + 16 + 25 + 36}{6} = \frac{91}{6}\). Par König-Huygens :</p>
    <div class="formula">$$V(X) = \frac{91}{6} - \frac{49}{4} = \frac{182 - 147}{12} = \frac{35}{12}, \qquad \sigma(X) = \sqrt{\frac{35}{12}} \approx 1{,}71.$$</div>
    <p><strong>Q3.</strong> Comme \(\sigma(X) \gt 0\), \(Y = \dfrac{X - 7/2}{\sigma(X)}\) est centrée réduite : \(E(Y) = 0\) par linéarité et \(V(Y) = \frac{V(X)}{\sigma(X)^2} = 1\).</p>
    <p><strong>Q4.</strong> Par linéarité, \(E(S) = 10 \times \frac72 = 35\). Les dés étant indépendants, ils sont deux à deux décorrélés et les variances s'ajoutent : \(V(S) = 10 \times \frac{35}{12} = \frac{175}{6} \approx 29{,}2\), soit \(\sigma(S) \approx 5{,}4\).</p></div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Bienaymé-Tchebychev</h3>
  <div class="statement">Une variable \(X\) admet une variance, avec \(E(X) = 10\) et \(V(X) = 4\).</div>
  <div class="q"><strong>Q1.</strong> Majorer \(P(|X - 10| \geq 5)\).</div>
  <div class="q"><strong>Q2.</strong> Minorer \(P(7 \lt X \lt 13)\).</div>
  <div class="q"><strong>Q3.</strong> On suppose de plus \(X \geq 0\). Majorer \(P(X \geq 20)\) par l'inégalité de Markov, puis par celle de Bienaymé-Tchebychev. Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Inégalité de Bienaymé-Tchebychev avec \(\varepsilon = 5\) : \(P(|X - 10| \geq 5) \leq \dfrac{V(X)}{5^2} = \dfrac{4}{25} = 0{,}16\).</p>
    <p><strong>Q2.</strong> L'événement \((7 \lt X \lt 13)\) est \((|X - 10| \lt 3)\), contraire de \((|X - 10| \geq 3)\). Donc \(P(7 \lt X \lt 13) \geq 1 - \frac{4}{9} = \frac59 \approx 0{,}56\).</p>
    <p><strong>Q3.</strong> Markov : \(P(X \geq 20) \leq \frac{E(X)}{20} = \frac12\). Bienaymé-Tchebychev : \((X \geq 20) \subset (|X - 10| \geq 10)\), donc \(P(X \geq 20) \leq \frac{4}{100} = 0{,}04\). La seconde borne est bien meilleure : elle utilise une information de plus, la variance.</p></div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Une espérance finie sans variance</h3>
  <div class="statement">Soit \(c\) un réel et \(X\) une variable à valeurs dans \(\mathbb{N}^*\) telle que \(P(X = n) = \dfrac{c}{n(n+1)(n+2)}\) pour tout \(n \geq 1\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier l'égalité suivante, puis en déduire \(c\) :</div>
  <div class="formula">$$\frac{1}{n(n+1)(n+2)} = \frac12\left(\frac{1}{n(n+1)} - \frac{1}{(n+1)(n+2)}\right).$$</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(X \geq n)\) pour \(n \geq 1\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(X\) est d'espérance finie et calculer \(E(X)\) de deux façons.</div>
  <div class="q"><strong>Q4.</strong> \(X\) admet-elle une variance ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En réduisant au même dénominateur :</p>
    <div class="formula">$$\frac{1}{n(n+1)} - \frac{1}{(n+1)(n+2)} = \frac{(n+2) - n}{n(n+1)(n+2)} = \frac{2}{n(n+1)(n+2)}.$$</div>
    <p>La somme est donc télescopique :</p>
    <div class="formula">$$\sum_{n=1}^{N} \frac{1}{n(n+1)(n+2)} = \frac12\left(\frac{1}{2} - \frac{1}{(N+1)(N+2)}\right) \xrightarrow[N \to +\infty]{} \frac14.$$</div>
    <p>La condition \(\sum P(X = n) = 1\) impose \(c = 4\).</p>
    <p><strong>Q2.</strong> Même télescopage à partir du rang \(n\) : \(P(X \geq n) = 4 \cdot \frac12 \cdot \frac{1}{n(n+1)} = \dfrac{2}{n(n+1)}\).</p>
    <p><strong>Q3.</strong> Par les queues : la série \(\sum P(X \geq n)\) converge, donc \(X\) est d'espérance finie, et \(E(X) = \sum_{n \geq 1} \frac{2}{n(n+1)} = 2\) (télescopage \(\frac1n - \frac{1}{n+1}\)). Directement : \(n\,P(X = n) = \frac{4}{(n+1)(n+2)}\), terme positif d'une série convergente, et</p>
    <div class="formula">$$E(X) = 4\sum_{n \geq 1}\left(\frac{1}{n+1} - \frac{1}{n+2}\right) = 4 \times \frac12 = 2.$$</div>
    <p><strong>Q4.</strong> Non : \(n^2\,P(X = n) = \dfrac{4n}{(n+1)(n+2)} \sim \dfrac{4}{n}\), terme général positif d'une série divergente (comparaison à la série harmonique). \(X^2\) n'est pas d'espérance finie : \(X\) n'admet pas de variance, bien qu'elle ait une espérance.</p></div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Trois calculs par transfert</h3>
  <div class="statement">Soit \(\lambda \gt 0\), \(X \sim \mathcal{P}(\lambda)\) et, pour \(p \in \,]0, 1[\), \(Y \sim \mathcal{G}(p)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(E\big((-1)^X\big)\). En déduire la probabilité que \(X\) soit pair.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(E\big(X(X-1)(X-2)\big)\), puis \(E(X^3)\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\frac1Y\) est d'espérance finie et que \(E\big(\frac1Y\big) = \dfrac{-p\ln p}{1 - p}\). Comparer à \(\frac{1}{E(Y)}\) pour \(p = \frac12\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \((-1)^X\) est bornée, donc d'espérance finie, et par transfert :</p>
    <div class="formula">$$E\big((-1)^X\big) = \sum_{k \geq 0} (-1)^k e^{-\lambda}\frac{\lambda^k}{k!} = e^{-\lambda}e^{-\lambda} = e^{-2\lambda}.$$</div>
    <p>Or \((-1)^X = 2\,\mathbf{1}_{(X \text{ pair})} - 1\), donc par linéarité \(e^{-2\lambda} = 2P(X \text{ pair}) - 1\) : \(P(X \text{ pair}) = \dfrac{1 + e^{-2\lambda}}{2}\), toujours un peu plus de \(\frac12\).</p>
    <p><strong>Q2.</strong> Les termes sont positifs, et le décalage d'indice de 3 dans la série exponentielle donne :</p>
    <div class="formula">$$E\big(X(X-1)(X-2)\big) = \sum_{k \geq 3} \frac{k(k-1)(k-2)}{k!}e^{-\lambda}\lambda^k = \lambda^3 e^{-\lambda}\sum_{j \geq 0}\frac{\lambda^j}{j!} = \lambda^3.$$</div>
    <p>On développe \(X^3\) sur les produits \(X(X-1)(X-2)\), \(X(X-1)\) et \(X\) :</p>
    <div class="formula">$$X^3 = X(X-1)(X-2) + 3X(X-1) + X.$$</div>
    <p>Avec \(E\big(X(X-1)\big) = \lambda^2\) (cours), la linéarité donne \(E(X^3) = \lambda^3 + 3\lambda^2 + \lambda\).</p>
    <p><strong>Q3.</strong> \(0 \lt \frac1Y \leq 1\) : la variable est bornée, donc d'espérance finie. Avec \(\sum_{k \geq 1}\frac{x^k}{k} = -\ln(1 - x)\) pour \(|x| \lt 1\) (série entière du logarithme) et \(x = 1 - p\) :</p>
    <div class="formula">$$E\Big(\frac1Y\Big) = \sum_{k \geq 1}\frac{p(1-p)^{k-1}}{k} = \frac{p}{1-p}\sum_{k \geq 1}\frac{(1-p)^k}{k} = \frac{-p\ln p}{1-p}.$$</div>
    <p>Pour \(p = \frac12\) : \(E\big(\frac1Y\big) = \ln 2 \approx 0{,}693\), alors que \(\frac{1}{E(Y)} = \frac12\). L'espérance d'un inverse n'est pas l'inverse de l'espérance.</p></div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Somme et différence de deux dés</h3>
  <div class="statement">On lance deux dés équilibrés indépendants, de résultats \(X\) et \(Y\), et l'on pose \(S = X + Y\) et \(D = X - Y\). On rappelle que \(E(X) = \frac72\) et \(V(X) = \frac{35}{12}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(E(S)\), \(E(D)\), \(V(S)\) et \(V(D)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\operatorname{Cov}(S, D)\).</div>
  <div class="q"><strong>Q3.</strong> \(S\) et \(D\) sont-elles indépendantes ?</div>
  <div class="q"><strong>Q4.</strong> Calculer \(\operatorname{Cov}(S, X)\) et vérifier l'inégalité \(|\operatorname{Cov}(S, X)| \leq \sigma(S)\,\sigma(X)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Par linéarité, \(E(S) = 7\) et \(E(D) = 0\). Par indépendance, \(\operatorname{Cov}(X, Y) = 0\), donc \(V(S) = V(X) + V(Y) = \frac{35}{6}\) et \(V(D) = V(X) + V(-Y)\) ; comme \(V(-Y) = V(Y)\), on a aussi \(V(D) = \frac{35}{6}\).</p>
    <p><strong>Q2.</strong> Par bilinéarité et symétrie de la covariance :</p>
    <div class="formula">$$\operatorname{Cov}(X + Y, X - Y) = V(X) - \operatorname{Cov}(X, Y) + \operatorname{Cov}(Y, X) - V(Y) = V(X) - V(Y) = 0.$$</div>
    <p>\(S\) et \(D\) sont décorrélées.</p>
    <p><strong>Q3.</strong> Non : \((S = 2)\) impose \(X = Y = 1\), donc \(D = 0\). Ainsi \(P(S = 2, D = 1) = 0\), alors que \(P(S = 2)\,P(D = 1) = \frac{1}{36} \times \frac{5}{36} \neq 0\). Des variables décorrélées ne sont pas forcément indépendantes.</p>
    <p><strong>Q4.</strong> \(\operatorname{Cov}(S, X) = V(X) + \operatorname{Cov}(Y, X)\), soit \(\frac{35}{12} \approx 2{,}92\). Et \(\sigma(S)\,\sigma(X) = \sqrt{\frac{35}{6} \cdot \frac{35}{12}} = \frac{35}{6\sqrt2} \approx 4{,}12\) : l'inégalité, conséquence de Cauchy-Schwarz, est vérifiée (et stricte, car \(S\) n'est pas une fonction affine de \(X\)).</p></div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Compter les motifs « pile puis face »</h3>
  <div class="statement">On lance \(n \geq 2\) fois une pièce qui donne pile avec la probabilité \(p \in \,]0, 1[\), les lancers étant indépendants. Pour \(i \in [\![ 1, n - 1 ]\!]\), \(A_i\) est l'événement « le lancer \(i\) donne pile et le lancer \(i + 1\) donne face », et \(X\) est le nombre d'indices \(i\) pour lesquels \(A_i\) est réalisé. On pose \(q = p(1-p)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(E(X)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\operatorname{Cov}(\mathbf{1}_{A_i}, \mathbf{1}_{A_j})\) pour \(i \lt j\), en distinguant \(j = i + 1\) et \(j \geq i + 2\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(V(X)\).</div>
  <div class="q"><strong>Q4.</strong> On prend \(p = \frac12\). Simplifier \(V(X)\), puis montrer que, pour tout \(\varepsilon \gt 0\), \(P\Big(\Big|X - \dfrac{n-1}{4}\Big| \geq \varepsilon n\Big) \to 0\) quand \(n \to +\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(X = \sum_{i=1}^{n-1} \mathbf{1}_{A_i}\) et, par indépendance des lancers, \(P(A_i) = p(1-p) = q\). Par linéarité, \(E(X) = (n-1)q\), sans avoir besoin de la loi de \(X\).</p>
    <p><strong>Q2.</strong> Si \(j \geq i + 2\), \(A_i\) ne dépend que des lancers \(i, i + 1\) et \(A_j\) des lancers \(j, j + 1\) : groupes disjoints, donc \(\mathbf{1}_{A_i}\) et \(\mathbf{1}_{A_j}\) sont indépendantes (lemme des coalitions) et leur covariance est nulle. Si \(j = i + 1\), \(A_i\) exige « face » au lancer \(i + 1\) et \(A_{i+1}\) exige « pile » à ce même lancer : \(A_i \cap A_{i+1} = \varnothing\), et</p>
    <div class="formula">$$\operatorname{Cov}(\mathbf{1}_{A_i}, \mathbf{1}_{A_{i+1}}) = P(A_i \cap A_{i+1}) - P(A_i)\,P(A_{i+1}) = -q^2.$$</div>
    <p><strong>Q3.</strong> Chaque \(\mathbf{1}_{A_i}\) suit \(\mathcal{B}(q)\), de variance \(q(1-q)\). Il y a \(n - 2\) couples d'indices consécutifs \((i, i + 1)\), d'où, par la formule de la variance d'une somme :</p>
    <div class="formula">$$V(X) = (n-1)\,q(1-q) + 2\sum_{i \lt j}\operatorname{Cov}(\mathbf{1}_{A_i}, \mathbf{1}_{A_j}) = (n-1)\,q(1-q) - 2(n-2)\,q^2.$$</div>
    <p><strong>Q4.</strong> Avec \(q = \frac14\) : \(V(X) = \frac{3(n-1)}{16} - \frac{2(n-2)}{16} = \frac{n+1}{16}\) (contrôle : pour \(n = 2\), \(X = \mathbf{1}_{A_1}\) a pour variance \(\frac14 \cdot \frac34 = \frac{3}{16}\)). Comme \(E(X) = \frac{n-1}{4}\), l'inégalité de Bienaymé-Tchebychev donne</p>
    <div class="formula">$$P\Big(\Big|X - \frac{n-1}{4}\Big| \geq \varepsilon n\Big) \leq \frac{n+1}{16\,\varepsilon^2 n^2} \xrightarrow[n \to +\infty]{} 0.$$</div>
    <p>La proportion \(\frac{X}{n}\) de motifs « pile puis face » se concentre autour de \(\frac14\), bien que les \(\mathbf{1}_{A_i}\) ne soient pas indépendantes : seules comptent l'espérance et la variance. Par exemple, pour \(n = 1\,000\) et \(\varepsilon = 0{,}02\), le majorant vaut \(\frac{1001}{6400} \approx 0{,}16\).</p></div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Reconnaître une loi à sa fonction génératrice</h3>
  <div class="statement">Une variable \(X\) à valeurs dans \(\mathbb{N}\) a pour fonction génératrice \(G_X(t) = \dfrac{(1 + t)\,e^{t-1}}{2}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(X\) a la même loi que \(U + V\), où \(U \sim \mathcal{B}(\frac12)\) et \(V \sim \mathcal{P}(1)\) sont indépendantes.</div>
  <div class="q"><strong>Q2.</strong> En déduire \(P(X = n)\) pour tout \(n \in \mathbb{N}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(E(X)\) et \(V(X)\) à l'aide de \(G_X\), et vérifier le résultat.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(G_U(t) = \frac12 + \frac12 t = \frac{1 + t}{2}\) et \(G_V(t) = e^{t-1}\). Par indépendance, \(G_{U+V} = G_U\,G_V = G_X\) sur \([-1, 1]\). La fonction génératrice caractérise la loi : \(X \sim U + V\).</p>
    <p><strong>Q2.</strong> On développe \(G_X(t) = \frac{e^{-1}}{2}(1 + t)\sum_{k \geq 0}\frac{t^k}{k!}\) (rayon infini) et on lit le coefficient de \(t^n\) :</p>
    <div class="formula">$$P(X = n) = \frac{e^{-1}}{2}\left(\frac{1}{n!} + \frac{1}{(n-1)!}\right) = \frac{(n+1)\,e^{-1}}{2\,n!} \qquad (n \geq 1),$$</div>
    <p>et \(P(X = 0) = \frac{e^{-1}}{2}\), ce que donne aussi la formule pour \(n = 0\).</p>
    <p><strong>Q3.</strong> \(G_X'(t) = \frac{(2 + t)\,e^{t-1}}{2}\) et \(G_X''(t) = \frac{(3 + t)\,e^{t-1}}{2}\), d'où \(E(X) = G_X'(1) = \frac32\) et</p>
    <div class="formula">$$V(X) = G_X''(1) + G_X'(1) - G_X'(1)^2 = 2 + \frac32 - \frac94 = \frac54.$$</div>
    <p>Vérification : \(E(U + V) = \frac12 + 1\) et, par indépendance, \(V(U + V) = \frac14 + 1 = \frac54\).</p></div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Attendre deux succès</h3>
  <div class="statement">Soit \(p \in \,]0, 1[\), \(T_1\) et \(T_2\) deux variables indépendantes de loi \(\mathcal{G}(p)\), et \(T = T_1 + T_2\) (rang du deuxième succès dans une suite d'épreuves de Bernoulli indépendantes).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la fonction génératrice de \(T\) et son rayon de convergence.</div>
  <div class="q"><strong>Q2.</strong> En développant \(G_T\) en série entière, retrouver la loi de \(T\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(E(T)\) et \(V(T)\).</div>
  <div class="q"><strong>Q4.</strong> On lance un dé jusqu'à obtenir deux 6 (\(p = \frac16\)). Majorer la probabilité qu'il faille au moins 36 lancers, par Markov puis par Bienaymé-Tchebychev. La valeur exacte vaut environ \(0{,}014\) : commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Par indépendance, \(G_T = G_{T_1}G_{T_2}\), avec la fonction génératrice de la loi géométrique :</p>
    <div class="formula">$$G_T(t) = \left(\frac{pt}{1 - (1-p)t}\right)^2, \qquad |t| \lt \frac{1}{1-p}.$$</div>
    <p>Le rayon vaut \(\frac{1}{1-p} \gt 1\) (pôle en \(t = \frac{1}{1-p}\)).</p>
    <p><strong>Q2.</strong> Avec \(\frac{1}{(1-u)^2} = \sum_{k \geq 0}(k+1)u^k\) pour \(|u| \lt 1\) et \(u = (1-p)t\) :</p>
    <div class="formula">$$G_T(t) = p^2t^2\sum_{k \geq 0}(k+1)(1-p)^kt^k = \sum_{n \geq 2}(n-1)\,p^2(1-p)^{n-2}\,t^n.$$</div>
    <p>Par caractérisation de la loi : \(P(T = n) = (n-1)p^2(1-p)^{n-2}\) pour \(n \geq 2\), comme dans le chapitre I.</p>
    <p><strong>Q3.</strong> Par linéarité, \(E(T) = \frac2p\) ; par indépendance, \(V(T) = 2\,\frac{1-p}{p^2}\). (On les retrouve avec \(G_T'(1)\) et \(G_T''(1)\), le rayon dépassant 1.)</p>
    <p><strong>Q4.</strong> Ici \(E(T) = 12\) et \(V(T) = 60\). Markov (\(T \geq 0\)) : \(P(T \geq 36) \leq \frac{12}{36} = \frac13\). Bienaymé-Tchebychev : \((T \geq 36) \subset (|T - 12| \geq 24)\), donc \(P(T \geq 36) \leq \frac{60}{576} \approx 0{,}104\). Les deux bornes sont justes mais larges (la valeur exacte \(P(T \gt 35)\) est la probabilité d'au plus un 6 en 35 lancers, \(\approx 0{,}014\)) : elles valent pour toutes les lois de même espérance, ou de même espérance et même variance.</p></div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Un dé est-il pipé ?</h3>
  <div class="statement">On lance \(n\) fois un dé et l'on note \(f_n\) la fréquence des 6 obtenus. On suppose d'abord le dé équilibré, les lancers indépendants.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(E(f_n)\) et \(V(f_n)\).</div>
  <div class="q"><strong>Q2.</strong> Combien de lancers suffisent pour que \(P\big(|f_n - \frac16| \geq 0{,}02\big) \leq 0{,}1\) ?</div>
  <div class="q"><strong>Q3.</strong> Sur 3 600 lancers, on a obtenu 750 fois le 6. Majorer la probabilité d'un tel écart à \(\frac16\) si le dé est équilibré. Le dé vous paraît-il suspect ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f_n = \frac{S_n}{n}\), où \(S_n\) est une somme de \(n\) indicatrices indépendantes de loi \(\mathcal{B}(\frac16)\), donc \(S_n \sim \mathcal{B}(n, \frac16)\). Ainsi \(E(f_n) = \frac16\) et \(V(f_n) = \frac{1}{n^2} \cdot n \cdot \frac16 \cdot \frac56 = \frac{5}{36\,n}\).</p>
    <p><strong>Q2.</strong> Par Bienaymé-Tchebychev, \(P\big(|f_n - \frac16| \geq 0{,}02\big) \leq \dfrac{5}{36\,n \times 0{,}02^2}\). Ce majorant est au plus \(0{,}1\) dès que</p>
    <div class="formula">$$n \geq \frac{5}{36 \times 0{,}0004 \times 0{,}1} \approx 3\,472{,}2, \quad \text{soit } n \geq 3\,473.$$</div>
    <p><strong>Q3.</strong> \(f_{3600} = \frac{750}{3600} \approx 0{,}208\) s'écarte de \(\frac16\) d'environ \(0{,}042\), donc de plus de \(0{,}04\). Pour un dé équilibré :</p>
    <div class="formula">$$P\Big(\Big|f_{3600} - \frac16\Big| \geq 0{,}04\Big) \leq \frac{5}{36 \times 3600 \times 0{,}04^2} \approx 0{,}024.$$</div>
    <p>Un écart aussi grand aurait moins de 2,5 % de chances de se produire avec un dé équilibré : le dé est suspect (la borne étant grossière, la probabilité réelle est même bien plus faible).</p></div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le collectionneur de vignettes</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : lois géométriques, espérance et variance d'une somme, fonctions génératrices, inégalités de Markov et de Bienaymé-Tchebychev).</div>
  <div class="statement">Une marque glisse dans chaque paquet de céréales une vignette choisie au hasard parmi \(N \geq 2\) modèles équiprobables, indépendamment d'un paquet à l'autre. Un enfant achète des paquets un à un jusqu'à posséder les \(N\) modèles ; on note \(T_N\) le nombre de paquets achetés. Pour \(k \in [\![ 1, N ]\!]\), on note \(W_k\) le nombre de paquets achetés pour passer de \(k - 1\) à \(k\) modèles distincts (donc \(W_1 = 1\)), de sorte que \(T_N = W_1 + \cdots + W_N\). On admet que \(W_1, \ldots, W_N\) sont indépendantes. On note \(H_N = \sum_{j=1}^{N} \frac1j\).</div>

  <p class="exo-part">Partie A — Lois des temps d'attente</p>
  <div class="q"><strong>A1.</strong> Expliquer pourquoi \(W_k\) suit la loi géométrique de paramètre \(p_k = \dfrac{N - k + 1}{N}\).</div>
  <div class="q"><strong>A2.</strong> Cas \(N = 2\) : déterminer la loi de \(T_2\).</div>

  <p class="exo-part">Partie B — Espérance et variance</p>
  <div class="q"><strong>B1.</strong> Montrer que \(E(T_N) = N\,H_N\).</div>
  <div class="q"><strong>B2.</strong> Montrer que \(V(T_N) = N^2\sum_{j=1}^{N}\frac{1}{j^2} - N\,H_N\). En admettant \(\sum_{j \geq 1}\frac{1}{j^2} = \frac{\pi^2}{6}\), en déduire \(V(T_N) \leq \frac{\pi^2}{6}N^2\).</div>
  <div class="q"><strong>B3.</strong> Valeurs numériques pour \(N = 10\).</div>

  <p class="exo-part">Partie C — Fonction génératrice</p>
  <div class="q"><strong>C1.</strong> Exprimer \(G_{T_N}(t)\) comme un produit, en précisant pour quels \(t\) l'expression est valable.</div>
  <div class="q"><strong>C2.</strong> Cas \(N = 3\). Vérifier que \(G_{T_3}(t) = \dfrac{2t^3}{(3 - t)(3 - 2t)}\), décomposer \(\dfrac{1}{(3 - t)(3 - 2t)}\) en éléments simples et en déduire \(P(T_3 = n)\) pour \(n \geq 3\).</div>
  <div class="q"><strong>C3.</strong> Retrouver \(E(T_3)\) à l'aide de \(G_{T_3}\).</div>

  <p class="exo-part">Partie D — Concentration</p>
  <div class="q"><strong>D1.</strong> Soit \(\varepsilon \gt 0\). Montrer que \(P\big(|T_N - N H_N| \geq \varepsilon\,N H_N\big) \leq \dfrac{\pi^2}{6\,\varepsilon^2 H_N^2}\). En admettant que \(H_N \geq \ln(N+1)\), en déduire la limite de cette probabilité quand \(N \to +\infty\) et interpréter.</div>
  <div class="q"><strong>D2.</strong> Pour \(N = 100\), on donne \(H_{100} \approx 5{,}187\) et \(\sum_{j=1}^{100}\frac{1}{j^2} \approx 1{,}635\). Majorer \(P(T_{100} \geq 1\,000)\) par l'inégalité de Markov, puis par celle de Bienaymé-Tchebychev.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> Lorsque l'enfant possède \(k - 1\) modèles distincts, chaque nouveau paquet apporte un modèle nouveau avec la probabilité \(\frac{N - (k - 1)}{N} = p_k\), indépendamment des paquets précédents. \(W_k\) est le rang du premier « succès » dans cette suite d'épreuves de Bernoulli indépendantes de même paramètre \(p_k\) : \(W_k \sim \mathcal{G}(p_k)\). Pour \(k = 1\), \(p_1 = 1\) et \(W_1 = 1\) est certaine.</p>
    <p><strong>A2.</strong> \(T_2 = 1 + W_2\) avec \(W_2 \sim \mathcal{G}(\frac12)\) : pour \(n \geq 2\), \(P(T_2 = n) = P(W_2 = n - 1) = \left(\frac12\right)^{n-1}\).</p>
    <p><strong>B1.</strong> Par linéarité, avec \(E(W_k) = \frac{1}{p_k} = \frac{N}{N - k + 1}\) et le changement d'indice \(j = N - k + 1\) :</p>
    <div class="formula">$$E(T_N) = \sum_{k=1}^{N}\frac{N}{N - k + 1} = N\sum_{j=1}^{N}\frac1j = N\,H_N.$$</div>
    <p><strong>B2.</strong> Les \(W_k\) sont indépendantes, donc deux à deux décorrélées, et leurs variances s'ajoutent. Avec \(V(W_k) = \frac{1 - p_k}{p_k^2} = \frac{1}{p_k^2} - \frac{1}{p_k}\) et \(\frac{1}{p_k} = \frac{N}{j}\) :</p>
    <div class="formula">$$V(T_N) = \sum_{j=1}^{N}\left(\frac{N^2}{j^2} - \frac{N}{j}\right) = N^2\sum_{j=1}^{N}\frac{1}{j^2} - N\,H_N \leq N^2\sum_{j \geq 1}\frac{1}{j^2} = \frac{\pi^2}{6}N^2.$$</div>
    <p><strong>B3.</strong> \(H_{10} = \frac{7381}{2520} \approx 2{,}929\), donc \(E(T_{10}) \approx 29{,}3\) paquets ; \(\sum_{j \leq 10}\frac{1}{j^2} \approx 1{,}550\), donc \(V(T_{10}) \approx 155{,}0 - 29{,}3 \approx 125{,}7\) et \(\sigma(T_{10}) \approx 11{,}2\). Il faut en moyenne trois fois plus de paquets que de modèles, avec une forte dispersion.</p>
    <p><strong>C1.</strong> Par indépendance, la fonction génératrice de la somme est le produit des fonctions génératrices des lois géométriques :</p>
    <div class="formula">$$G_{T_N}(t) = \prod_{k=1}^{N}\frac{p_k\,t}{1 - (1 - p_k)\,t}.$$</div>
    <p>Le facteur \(k = 1\) vaut \(t\) ; les autres sont valables pour \(|t| \lt \frac{1}{1 - p_k}\), la condition la plus forte venant de \(p_N = \frac1N\) : l'expression vaut pour \(|t| \lt \frac{N}{N - 1}\), et en particulier sur \([-1, 1]\).</p>
    <p><strong>C2.</strong> Pour \(N = 3\), \(p_1 = 1\), \(p_2 = \frac23\), \(p_3 = \frac13\) :</p>
    <div class="formula">$$G_{T_3}(t) = t \cdot \frac{\frac23 t}{1 - \frac13 t} \cdot \frac{\frac13 t}{1 - \frac23 t} = \frac{\frac29 t^3}{\frac{(3 - t)(3 - 2t)}{9}} = \frac{2t^3}{(3 - t)(3 - 2t)}.$$</div>
    <p>En cherchant \(\frac{1}{(3 - t)(3 - 2t)} = \frac{a}{3 - t} + \frac{b}{3 - 2t}\) (évaluer en \(t = 3\) et \(t = \frac32\)) : \(a = -\frac13\), \(b = \frac23\). Pour \(|t| \lt \frac32\) :</p>
    <div class="formula">$$\frac{1}{(3 - t)(3 - 2t)} = -\frac19\sum_{m \geq 0}\frac{t^m}{3^m} + \frac29\sum_{m \geq 0}\frac{2^mt^m}{3^m} = \sum_{m \geq 0}\frac{2^{m+1} - 1}{9 \cdot 3^m}\,t^m.$$</div>
    <p>En multipliant par \(2t^3\) et en lisant le coefficient de \(t^n\) (\(m = n - 3\)) :</p>
    <div class="formula">$$P(T_3 = n) = \frac{2\,(2^{n-2} - 1)}{3^{n-1}}, \qquad n \geq 3.$$</div>
    <p>Contrôle : \(P(T_3 = 3) = \frac29 = \frac{3!}{3^3}\) (trois paquets tous différents) et \(P(T_3 = 4) = \frac29\).</p>
    <p><strong>C3.</strong> Le rayon \(\frac32\) dépasse 1. La dérivée logarithmique d'un produit est la somme des dérivées logarithmiques :</p>
    <div class="formula">$$\frac{G_{T_3}'(t)}{G_{T_3}(t)} = \frac3t + \frac{1}{3 - t} + \frac{2}{3 - 2t}.$$</div>
    <p>En \(t = 1\), où \(G_{T_3}(1) = 1\) : \(E(T_3) = G_{T_3}'(1) = 3 + \frac12 + 2 = \frac{11}{2}\), conforme à \(3H_3 = 3\left(1 + \frac12 + \frac13\right)\).</p>
    <p><strong>D1.</strong> Par Bienaymé-Tchebychev avec \(E(T_N) = NH_N\) et la majoration de B2 :</p>
    <div class="formula">$$P\big(|T_N - NH_N| \geq \varepsilon\,NH_N\big) \leq \frac{V(T_N)}{\varepsilon^2N^2H_N^2} \leq \frac{\pi^2}{6\,\varepsilon^2H_N^2}.$$</div>
    <p>Comme \(H_N \geq \ln(N + 1) \to +\infty\), le majorant tend vers 0, donc la probabilité aussi. Interprétation : \(\frac{T_N}{NH_N}\) se concentre autour de 1 ; pour \(N\) grand, il faut acheter environ \(NH_N\) paquets, de l'ordre de \(N\ln N\).</p>
    <p><strong>D2.</strong> \(E(T_{100}) = 100\,H_{100} \approx 518{,}7\). Markov : \(P(T_{100} \geq 1\,000) \leq \frac{518{,}7}{1\,000}\), soit environ \(0{,}52\). Ensuite \(V(T_{100}) \approx 10^4 \times 1{,}635 - 518{,}7\), soit environ \(15\,830\). Comme \(1\,000 - 518{,}7 = 481{,}3\), Bienaymé-Tchebychev donne :</p>
    <div class="formula">$$P(T_{100} \geq 1\,000) \leq P\big(|T_{100} - 518{,}7| \geq 481{,}3\big) \leq \frac{15\,830}{481{,}3^2} \approx 0{,}068.$$</div>
    <p>Bienaymé-Tchebychev, qui utilise la variance, améliore nettement la borne de Markov ; une simulation donne une probabilité réelle d'environ \(0{,}004\).</p></div>
