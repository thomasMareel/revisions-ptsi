      <div class="sec-num">§1 · MOTS QUI VONT ENSEMBLE</div>
      <h2>Collocations</h2>
      <div class="intro">Une <strong>collocation</strong> est une association de mots habituelle (« make a decision », pas « do a decision »). Les respecter rend l'anglais idiomatique.</div>
      <div class="prop-box"><strong>make vs do</strong> : <em>make</em> = créer / produire (make a mistake, make a decision) ; <em>do</em> = effectuer une tâche (do one's homework, do the dishes).</div>
      <div class="prop-box"><strong>take / have</strong> : take a risk · take a shower (ou have) · have a look · have breakfast.</div>
      <div class="prop-box"><strong>autres</strong> : pay attention · keep a promise · save time · ask a question · make progress.</div>
      <div class="notice">En cas de doute, apprends le nom <em>avec</em> son verbe : c'est le couple qui compte, pas le mot isolé.</div>
    </div>
