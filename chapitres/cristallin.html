<div class="course-section">
  <div class="sec-num">§1 · AMORPHE, CRISTALLIN, SEMI-CRISTALLIN</div>
  <h2>L'ordre des atomes dans un solide</h2>
  <div class="intro">Le sel, le cuivre, la glace sont cristallins ; le verre d'une vitre ne l'est pas. La différence ne se voit pas toujours à l'œil, mais elle se voit dans les propriétés : température de fusion, cassure, transparence. Cette section classe les solides selon l'ordre de leurs entités et montre que cet ordre dépend de la façon dont le solide s'est formé.</div>
  <div class="def-box">
    <strong>Trois états solides.</strong> Dans un solide <strong>cristallin</strong>, les entités (atomes, ions, molécules) sont rangées de façon <strong>périodique</strong> dans les trois directions : l'ordre s'étend à longue distance. Dans un solide <strong>amorphe</strong> (verre), l'ordre n'existe qu'entre voisins proches, comme dans un liquide figé. Un solide <strong>semi-cristallin</strong> juxtapose des zones cristallines et des zones amorphes : c'est le cas de nombreux polymères (polyéthylène, polyamides).
  </div>
  <p>Un échantillon cristallin ordinaire est presque toujours un <strong>polycristal</strong> : un assemblage de petits cristaux (les grains, de quelques micromètres à quelques millimètres) orientés au hasard. Un monocristal (diamant taillé, silicium des puces électroniques) est l'exception.</p>
  <div class="prop-box">
    <strong>Influence des conditions de formation.</strong> Un liquide refroidi <strong>lentement</strong> laisse aux entités le temps de se ranger : il cristallise, en gros cristaux. Refroidi <strong>brutalement</strong> (trempe), il se fige dans le désordre : il devient amorphe. Le même corps peut ainsi donner un cristal ou un verre : silice cristallisée (quartz) ou verre de silice ; granite (magma refroidi lentement en profondeur) ou obsidienne (lave refroidie à l'air) ; sucre cristallisé ou caramel.
  </div>
  <p>Conséquence : un cristal fond à une température nette (palier de fusion), alors qu'un amorphe <strong>ramollit</strong> progressivement (c'est ce qui permet de souffler le verre). Un polyéthylène refroidi lentement est plus cristallin, donc plus dense, plus rigide et plus opaque qu'un polyéthylène trempé.</p>
  <div class="def-box">
    <strong>Variétés allotropiques.</strong> Un même corps pur simple peut cristalliser sous plusieurs structures, stables dans des domaines de température et de pression différents : ce sont ses <strong>variétés allotropiques</strong>. Carbone : diamant et graphite. Fer : fer α (cubique centré) jusqu'à 912 °C, fer γ (cubique à faces centrées) de 912 à 1 394 °C, fer δ (cubique centré) jusqu'à la fusion à 1 538 °C. Étain : étain β (blanc, métallique) au-dessus de 13 °C, étain α (gris, friable) en dessous. Soufre : α et β, de part et d'autre de 95 °C.
  </div>
  <div class="method-box"><strong>Exemple — l'ordre se mesure à la balance</strong>
    <ol>
      <li>Masse volumique du quartz : 2,65 g·cm⁻³ ; du verre de silice, de même formule SiO₂ : 2,20 g·cm⁻³. À masse égale, le verre occupe \(2{,}65/2{,}20 - 1 = 20\ \%\) de volume en plus : ses entités sont moins bien rangées.</li>
      <li>Étain : \(\rho_\beta = 7{,}27\ \text{g·cm}^{-3}\), \(\rho_\alpha = 5{,}77\ \text{g·cm}^{-3}\). Le passage de l'étain blanc à l'étain gris dans un hiver très froid gonfle le métal de \(7{,}27/5{,}77 - 1 \approx 26\ \%\) : il se désagrège en poudre (la « peste de l'étain » des tuyaux d'orgue et des boutons d'uniforme).</li>
      <li>Diamant (3,51 g·cm⁻³) et graphite (2,26 g·cm⁻³) : deux arrangements du même carbone, aux propriétés opposées (§8).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appeler « cristal » le verre ciselé d'un vase (le « cristal » des verriers est un verre au plomb, donc amorphe), ou croire qu'un solide transparent est forcément amorphe. Le quartz et le sel sont transparents et cristallins ; c'est l'ordre microscopique, pas l'aspect, qui décide.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LE MODÈLE DU CRISTAL PARFAIT</div>
  <h2>Réseau, motif et maille</h2>
  <div class="intro">Pour décrire des milliards de milliards d'atomes rangés, il suffit d'en décrire quelques-uns et de dire comment on les répète. C'est le modèle du cristal parfait : une répétition périodique, sans fin et sans défaut, d'un même motif.</div>
  <div class="def-box">
    <strong>Cristal parfait.</strong> Un <strong>réseau</strong> est un ensemble de points, les <strong>nœuds</strong>, qui se déduisent tous de l'un d'eux par les translations \(n_1\vec a + n_2\vec b + n_3\vec c\) (\(n_i\) entiers). Le <strong>motif</strong> est l'entité (atome, ion, groupe d'atomes, molécule) attachée à chaque nœud, toujours la même et dans la même orientation. Cristal = réseau + motif.
  </div>
  <div class="def-box">
    <strong>Maille.</strong> Une <strong>maille</strong> est un parallélépipède construit sur trois vecteurs \(\vec a\), \(\vec b\), \(\vec c\) du réseau, qui pave tout l'espace par les translations du réseau. Ses <strong>paramètres</strong> sont les longueurs \(a\), \(b\), \(c\) et les angles \(\alpha\), \(\beta\), \(\gamma\). Une maille qui ne contient qu'un seul nœud est dite <strong>primitive</strong> ; une maille qui en contient plusieurs est dite <strong>multiple</strong>. On choisit souvent une maille multiple, la maille <strong>conventionnelle</strong>, parce qu'elle a des angles droits et montre la symétrie du réseau.
  </div>

<figcaption>Cristal plan modèle : chaque <strong>nœud</strong> du réseau (point noir) porte le même <strong>motif</strong>, ici un gros atome (bleu) et un petit (rouge). Le réseau est rectangulaire centré. La maille rectangulaire (en rouge) montre la symétrie du réseau mais contient deux nœuds (4 × ¼ aux sommets + 1 au centre) : c'est une maille <strong>conventionnelle</strong>. Le parallélogramme (en bleu), d'aire moitié, ne contient qu'un nœud : c'est une maille <strong>primitive</strong>. Les deux pavent le plan par translation.</figcaption>
</figure>
  <p>Le cristal se décrit donc comme un <strong>assemblage de mailles parallélépipédiques</strong> identiques, juxtaposées sans vide ni recouvrement : connaître le contenu d'une maille, c'est connaître tout le cristal. Les mailles de ce chapitre sont cubiques : \(a = b = c\), angles droits.</p>
  <div class="method-box"><strong>Exemple — maille conventionnelle et maille primitive</strong>
    <ol>
      <li>Dans le réseau plan de la figure, la maille rectangulaire contient \(4 \times \tfrac14 + 1 = 2\) nœuds : elle est double. Le parallélogramme bleu, d'aire moitié, contient \(4 \times \tfrac14 = 1\) nœud : il est primitif.</li>
      <li>Fer α : sa maille conventionnelle est un cube d'arête \(a = 286{,}65\ \text{pm}\) qui contient 2 atomes (§7). Son volume, \(a^3 = 2{,}36\times10^{-29}\ \text{m}^3\), correspond donc à 2 atomes ; une maille primitive aurait un volume deux fois plus petit, \(1{,}18\times10^{-29}\ \text{m}^3\), le volume occupé par un atome dans le cristal.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : définir la maille comme « le plus petit parallélépipède qui reproduit le cristal ». C'est la définition de la seule maille <strong>primitive</strong> ; la maille cubique à faces centrées, que le programme demande de connaître, n'est <strong>pas</strong> la plus petite (elle contient 4 nœuds) : c'est une maille conventionnelle, choisie pour sa forme cubique. Autre confusion : le nœud est un point géométrique, l'atome est un objet physique ; quand le motif est un seul atome, on les confond.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · POPULATION, COORDINENCE, COMPACITÉ, MASSE VOLUMIQUE</div>
  <h2>Quatre grandeurs pour décrire une structure</h2>
  <div class="intro">Une fois la maille connue, quatre grandeurs caractérisent la structure : combien d'entités elle contient, combien de voisins a chacune, quelle fraction de l'espace est remplie, et quelle masse volumique en résulte. Les définitions sont générales ; on les applique ensuite à chaque structure.</div>
  <div class="def-box">
    <strong>Population.</strong> La <strong>population</strong> (ou multiplicité) \(Z\) d'une maille est le nombre d'entités (ou de motifs) qui lui appartiennent en propre. Une entité placée sur un sommet est partagée entre 8 mailles et compte pour \(\tfrac18\) ; sur une arête, entre 4 mailles : \(\tfrac14\) ; sur une face, entre 2 mailles : \(\tfrac12\) ; à l'intérieur : 1.
  </div>
  <div class="def-box">
    <strong>Coordinence.</strong> La <strong>coordinence</strong> d'une entité est le nombre de ses plus proches voisins (à la plus courte distance). Dans un cristal ionique, on compte les plus proches voisins de signe opposé et l'on note la coordinence « cation/anion », par exemple 6/6.
  </div>
  <div class="def-box">
    <strong>Modèle des sphères dures.</strong> Les entités sont des sphères rigides de rayon \(R\) ; deux plus proches voisins sont <strong>tangents</strong>. Ce contact relie le paramètre de maille au rayon.
  </div>
  <div class="prop-box">
    <strong>Compacité et masse volumique.</strong> La <strong>compacité</strong> est la fraction du volume de la maille occupée par les sphères ; la masse volumique se déduit de la masse contenue dans la maille. Pour une maille cubique d'arête \(a\) contenant \(Z\) entités de masse molaire \(M\) :
    <div class="formula" data-nom="Compacité d'une maille">$$C = \frac{Z\cdot\frac43\pi R^3}{a^3}$$</div>
    <div class="formula" data-nom="Masse volumique d'un cristal">$$\rho = \frac{Z\,M}{N_A\,a^3}$$</div>
    La compacité, sans dimension, est comprise entre 0 et 1 et ne dépend que de la structure (le rayon s'exprime en fonction de \(a\)).
  </div>
  <div class="method-box"><strong>Exemple — la structure cubique simple du polonium</strong>
    <p>Le polonium α (c'est le seul élément qui l'adopte) a des atomes aux seuls sommets d'un cube d'arête \(a = 335{,}9\ \text{pm}\) ; \(M = 209\ \text{g·mol}^{-1}\).</p>
    <ol>
      <li>Population : \(Z = 8 \times \tfrac18 = 1\).</li>
      <li>Coordinence : un atome a 6 plus proches voisins, à la distance \(a\) (deux par axe).</li>
      <li>Contact le long de l'arête : \(a = 2R\), d'où \(R = 168\ \text{pm}\) et \( C \) \( = \dfrac{\frac43\pi R^3}{(2R)^3} \) \( = \dfrac{\pi}{6} = 0{,}52 \).</li>
      <li>\( \rho \) \( = \dfrac{1 \times 209\times10^{-3}}{6{,}022\times10^{23} \times (335{,}9\times10^{-12})^3} \) \( = 9{,}16\times10^{3}\ \text{kg·m}^{-3} \), soit 9,16 g·cm⁻³ (valeur mesurée : 9,20).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier les conversions dans \(\rho = ZM/(N_A a^3)\). Avec \(M\) en kg·mol⁻¹ et \(a\) en mètres, \(\rho\) sort en kg·m⁻³ ; avec \(M\) en g·mol⁻¹ et \(a\) en centimètres (1 pm = \(10^{-10}\) cm), en g·cm⁻³. Une masse volumique de métal doit tomber entre 0,5 et 23 g·cm⁻³ : c'est un bon contrôle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LA MAILLE CUBIQUE À FACES CENTRÉES</div>
  <h2>La structure à connaître</h2>
  <div class="intro">Le cuivre, l'aluminium, l'argent, l'or, le nickel, le plomb, le fer au-dessus de 912 °C, et aussi l'argon solide, cristallisent dans la structure cubique à faces centrées. C'est la seule que le programme demande de connaître sans qu'elle soit fournie ; elle sert de base à de nombreuses autres.</div>
  <div class="def-box">
    <strong>Maille CFC.</strong> Maille conventionnelle cubique d'arête \(a\), avec une entité à chacun des 8 sommets et au centre de chacune des 6 faces.

  <div class="prop-box">
    <strong>Caractéristiques de la structure CFC</strong> (modèle des sphères dures) :
    <ul>
      <li>population : \( Z \) \( = 8 \times \tfrac18 + 6 \times \tfrac12 \) \( = 4 \) ;</li>
      <li>contact le long de la diagonale d'une face : \(a\sqrt2 = 4R\) ;</li>
      <li>coordinence : 12, à la distance \(a\sqrt2/2 = 2R\) ;</li>
      <li>compacité : \(C = \dfrac{\pi}{3\sqrt2} \approx 0{,}74\), la plus grande possible pour des sphères identiques (§5).</li>
    </ul>
    <div class="formula" data-nom="Contact dans la maille CFC">$$a\sqrt2 = 4R \qquad C_{\text{CFC}} = \frac{\pi}{3\sqrt2} \approx 0{,}74$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Coordinence 12 et compacité 0,74</span><div class="content">
    <p><strong>Coordinence.</strong> Prenons l'atome d'un sommet. Ses plus proches voisins sont les centres des faces qui contiennent ce sommet, à la distance \(a\sqrt2/2\) (moitié d'une diagonale de face) ; les autres atomes de sommet sont à la distance \(a\), plus grande. Le sommet appartient à 12 faces (3 plans perpendiculaires qui se croisent en lui, chacun formé de 4 faces de mailles voisines), qui portent chacune un centre de face : 12 voisins. Par symétrie, un atome de centre de face en a autant.</p>
    <p><strong>Compacité.</strong> Avec \(a = 2\sqrt2\,R\) : \( C \) \( = \dfrac{4 \times \frac43\pi R^3}{(2\sqrt2\,R)^3} \) \( = \dfrac{\frac{16}{3}\pi R^3}{16\sqrt2\,R^3} \) \( = \dfrac{\pi}{3\sqrt2} = 0{,}740 \).</p>
  </div></div>
  <div class="method-box"><strong>Exemple — le cuivre</strong>
    <p>Cuivre CFC, \(a = 361{,}5\ \text{pm}\), \(M = 63{,}55\ \text{g·mol}^{-1}\).</p>
    <ol>
      <li>Rayon métallique : \( R = \dfrac{a\sqrt2}{4} \) \( = 127{,}8\ \text{pm} \) ; distance entre plus proches voisins \(2R = 255{,}6\ \text{pm}\).</li>
      <li>\( \rho \) \( = \dfrac{4 \times 63{,}55\times10^{-3}}{6{,}022\times10^{23} \times (361{,}5\times10^{-12})^3} \) \( = 8{,}93\times10^{3}\ \text{kg·m}^{-3} \) ; valeur mesurée : 8,96 g·cm⁻³, écart de 0,3 %.</li>
      <li>Nombre d'atomes par centimètre cube : \(\dfrac{4}{(3{,}615\times10^{-8})^3} = 8{,}5\times10^{22}\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§5 · EMPILEMENTS COMPACTS</div>
  <h2>Ranger des sphères identiques le mieux possible</h2>
  <div class="intro">Comment empiler des oranges en perdant le moins de place ? La réponse des marchands de fruits est aussi celle de la plupart des métaux : des couches compactes posées dans les creux les unes des autres. On y découvre que la CFC est un empilement compact, et l'on y localise les cavités entre les sphères.</div>
  <div class="def-box">
    <strong>Plan compact.</strong> Dans un plan, des sphères identiques sont rangées au plus serré quand chacune en touche 6 autres, aux sommets d'un hexagone régulier. Chaque sphère est entourée de 6 creux, chaque creux de 3 sphères.
  </div>
  <p>Notons A les positions des centres d'une première couche compacte. La deuxième couche se pose dans la moitié des creux, positions B ; les autres creux sont les positions C. Pour la troisième couche, deux choix :</p>
  <ul>
    <li>au-dessus de A : empilement <strong>ABAB…</strong>, dit <strong>hexagonal compact</strong> (hc) ;</li>
    <li>au-dessus de C : empilement <strong>ABCABC…</strong>, qui est exactement la structure <strong>cubique à faces centrées</strong>, les couches compactes étant les plans perpendiculaires à une grande diagonale du cube.</li>
  </ul>

  <div class="prop-box">
    <strong>Empilements compacts.</strong> Dans les deux empilements, chaque sphère touche 12 voisines (6 dans son plan, 3 au-dessus, 3 au-dessous) et la compacité vaut \(\dfrac{\pi}{3\sqrt2} \approx 0{,}74\), la plus grande possible pour des sphères identiques. Entre deux couches compactes, on trouve deux sortes d'<strong>interstices</strong> :
    <ul>
      <li>un site <strong>tétraédrique</strong> (T) entre 4 sphères : 3 d'une couche et 1 de la couche voisine, posée sur leur creux ; on en trouve sous chaque sphère de la couche du dessus et au-dessus de chaque sphère de la couche du dessous ;</li>
      <li>un site <strong>octaédrique</strong> (O) entre 6 sphères : 3 d'une couche et 3 de la couche voisine, tournées de 60° ; on le trouve à l'aplomb des creux C, laissés libres par les deux couches.</li>
    </ul>
    Il y a autant de sites octaédriques que de sphères, et deux fois plus de sites tétraédriques.
  </div>
  <p>La structure hexagonale compacte est <strong>fournie</strong> par les énoncés : sa maille conventionnelle est un prisme droit à base hexagonale d'arête \(a\) et de hauteur \(c\) (deux couches), de volume \(\tfrac{3\sqrt3}{2}a^2c\), qui contient \( Z \) \( = 12 \times \tfrac16 + 2 \times \tfrac12 + 3 \) \( = 6 \) atomes. Pour des sphères tangentes, \(a = 2R\) et \(c/a = \sqrt{8/3} \approx 1{,}633\).</p>
  <div class="method-box"><strong>Exemple — le magnésium et le zinc</strong>
    <ol>
      <li>Magnésium hc : \(a = 320{,}9\ \text{pm}\), \(c = 521{,}0\ \text{pm}\), \(M = 24{,}31\ \text{g·mol}^{-1}\). \(c/a = 1{,}624\), à 0,6 % de la valeur idéale. \( \rho \) \( = \dfrac{6M}{N_A \cdot \frac{3\sqrt3}{2}a^2c} \) \( = 1{,}74\ \text{g·cm}^{-3} \), la valeur mesurée : le magnésium est le plus léger des métaux de structure.</li>
      <li>Zinc hc : \(a = 266{,}5\ \text{pm}\), \(c = 494{,}7\ \text{pm}\), d'où \(c/a = 1{,}856\), 14 % au-dessus de la valeur idéale : les atomes de zinc ne se comportent pas comme des sphères (§11).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'un site tétraédrique est « plus grand » parce qu'il est entouré de moins de sphères. C'est l'inverse : 4 sphères tangentes laissent une cavité plus petite que 6 (§6).</div>
</div>

<figcaption>Sites interstitiels de la maille CFC (atomes en bleu et rouge, sites en petit). À gauche, les sites octaédriques (en vert) : au centre du cube, entouré par l'octaèdre des 6 centres de faces, et aux milieux des 12 arêtes, partagés entre 4 mailles. À droite, les sites tétraédriques (en orange) : aux centres des 8 petits cubes d'arête \( a/2 \), c'est-à-dire en \( (\tfrac14, \tfrac14, \tfrac14) \) et positions analogues ; l'un d'eux est montré au centre de son tétraèdre (un sommet et les trois centres de faces voisins).</figcaption>
</figure>
  <div class="prop-box">
    <strong>Sites de la maille CFC.</strong>
    <ul>
      <li><strong>Sites octaédriques</strong> : au centre du cube (compte 1) et aux milieux des 12 arêtes (comptent \(\tfrac14\) chacun) : \(1 + 12 \times \tfrac14 = 4\) par maille, autant que d'atomes. Chacun est au centre d'un octaèdre régulier de 6 atomes.</li>
      <li><strong>Sites tétraédriques</strong> : aux centres des 8 petits cubes d'arête \(a/2\) qui divisent la maille, en \((\tfrac14, \tfrac14, \tfrac14)\) et positions analogues : 8 par maille, deux par atome. Chacun est au centre d'un tétraèdre régulier formé d'un sommet et des trois centres de faces voisins.</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Habitabilité.</strong> L'<strong>habitabilité</strong> d'un site est le rayon \(r\) de la plus grande sphère qu'on peut y placer sans déformer la structure, c'est-à-dire en touchant ses voisins sans les écarter.
  </div>
  <div class="prop-box">
    <strong>Habitabilité des sites de la CFC</strong> (atomes de rayon \(R\), \(a = 2\sqrt2\,R\)) :
    <div class="formula" data-nom="Habitabilité des sites de la CFC">$$r_O = (\sqrt2 - 1)\,R \approx 0{,}414\,R \qquad r_T = \left(\sqrt{\tfrac32} - 1\right)R \approx 0{,}225\,R$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Écrire le contact dans la bonne direction</span><div class="content">
    <p><strong>Site octaédrique</strong> (milieu d'une arête) : l'atome inséré touche les deux atomes des sommets de l'arête : \(a = 2R + 2r_O\), donc \( r_O = \dfrac a2 - R \) \( = \sqrt2\,R - R = (\sqrt2 - 1)R \).</p>
    <p><strong>Site tétraédrique</strong> (centre d'un petit cube d'arête \(a/2\)) : la distance du site aux atomes voisins est la demi-diagonale du petit cube, \(\dfrac{a\sqrt3}{4}\) ; contact : \(\dfrac{a\sqrt3}{4} = R + r_T\), donc \( r_T \) \( = \dfrac{2\sqrt2\sqrt3}{4}R - R \) \( = \left(\sqrt{\tfrac32} - 1\right)R \).</p>
  </div></div>
  <div class="method-box"><strong>Exemple — le carbone dans le fer γ (acier)</strong>
    <p>À 912 °C, le fer γ est CFC avec \(a = 364{,}7\ \text{pm}\) ; le rayon du carbone vaut environ 77 pm.</p>
    <ol>
      <li>Rayon du fer : \(R = a\sqrt2/4 = 128{,}9\ \text{pm}\) ; habitabilités : \(r_O = 53{,}4\ \text{pm}\), \(r_T = 29{,}0\ \text{pm}\).</li>
      <li>Le carbone (77 pm) est plus gros que le plus grand site : il ne s'insère qu'en écartant les atomes de fer voisins, dans les sites octaédriques. Cette déformation limite la quantité insérée.</li>
      <li>Le fer γ dissout au plus 2,1 % en masse de carbone (à 1 147 °C), soit \(\dfrac{2{,}1/12{,}01}{97{,}9/55{,}85} \approx 0{,}10\) atome de carbone par atome de fer : un site octaédrique sur dix est occupé. C'est la base des aciers.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — stocker l'hydrogène dans le palladium</strong>
    <p>Le palladium (CFC, \(a = 389{,}0\ \text{pm}\)) absorbe l'hydrogène atomique dans ses sites octaédriques (\(r_O = 57\ \text{pm}\), assez pour l'hydrogène), jusqu'à environ 0,7 atome H par atome Pd.</p>
    <ol>
      <li>Quantité de palladium par cm³ : \( \dfrac{4}{N_A\,a^3} \) \( = \dfrac{4}{6{,}022\times10^{23} \times (3{,}890\times10^{-8})^3} \) \( = 0{,}113\ \text{mol} \).</li>
      <li>Hydrogène absorbé : \(0{,}7 \times 0{,}113 = 0{,}079\ \text{mol}\) d'atomes, soit \(0{,}040\ \text{mol}\) de H₂, qui occuperaient \(\approx 0{,}96\ \text{L}\) à 20 °C sous 1 bar.</li>
      <li>Un centimètre cube de palladium contient près de mille fois son volume de dihydrogène gazeux.</li>
    </ol>
  </div>
  <div class="def-box">
    <strong>Alliages.</strong> Dans un alliage d'<strong>insertion</strong>, de petits atomes occupent des sites interstitiels (carbone dans le fer, hydrogène dans le palladium). Dans un alliage de <strong>substitution</strong>, des atomes de taille voisine en remplacent d'autres sur les nœuds du réseau (nickel dans le cuivre, zinc dans le cuivre du laiton).
  </div>
  <p><strong>Utiliser un logiciel.</strong> Un logiciel de visualisation de structures cristallines (par exemple un logiciel libre comme VESTA ou Jmol) affiche la maille, la fait tourner, mesure distances et angles et fait apparaître les polyèdres de coordination : on y vérifie la position des sites, l'octaèdre et le tétraèdre de la figure, et les relations de contact.</p>
  <div class="notice"><strong>Erreur classique</strong> : compter 13 sites octaédriques (le centre et les 12 milieux d'arêtes comptés entiers) ou placer les sites tétraédriques au milieu des faces. Un milieu d'arête est partagé entre 4 mailles ; un centre de face est occupé par un atome.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CRISTAUX MÉTALLIQUES</div>
  <h2>Des cations baignés d'électrons</h2>
  <div class="intro">Plus des trois quarts des éléments sont des métaux. Leur cohésion vient d'une liaison particulière, partagée par tout le cristal, qui explique d'un coup leur éclat, leur conductivité et leur aptitude à se déformer sans casser.</div>
  <p><strong>Métaux et non-métaux dans le tableau périodique.</strong> Les métaux occupent la gauche et le centre du tableau (alcalins, alcalino-terreux, métaux de transition, aluminium, étain, plomb…) ; les non-métaux sont en haut à droite (carbone, azote, oxygène, halogènes, gaz nobles…). Une diagonale d'éléments intermédiaires (bore, silicium, germanium, arsenic, antimoine, tellure) les sépare. Les métaux ont une faible électronégativité : ils perdent facilement leurs électrons de valence (chapitre <a href="#atome/cours">« Architecture de la matière »</a>).</p>
  <div class="def-box">
    <strong>Liaison métallique.</strong> Dans un métal, les électrons de valence ne sont attachés à aucun atome : ils sont <strong>délocalisés</strong> dans tout le cristal et forment un « gaz d'électrons » qui maintient ensemble les cations. Cette liaison est <strong>non directionnelle</strong> ; son énergie (énergie de cohésion) va d'environ 100 à 900 kJ·mol⁻¹ : 107 pour le sodium, 337 pour le cuivre, 413 pour le fer, 859 pour le tungstène.
  </div>
  <div class="prop-box">
    <strong>Propriétés des métaux.</strong>
    <ul>
      <li>conducteurs électriques et thermiques : les électrons délocalisés se déplacent librement ;</li>
      <li>éclat métallique, opacité : ces électrons réfléchissent la lumière ;</li>
      <li>ductiles et malléables : la liaison n'étant pas dirigée, des plans d'atomes peuvent glisser les uns sur les autres sans rompre la cohésion (un fil de cuivre s'étire, une feuille d'or se lamine jusqu'à 0,1 µm) ;</li>
      <li>températures de fusion très variées, qui suivent l'énergie de cohésion : mercure −39 °C, sodium 98 °C, cuivre 1 085 °C, fer 1 538 °C, tungstène 3 422 °C.</li>
    </ul>
    Structures les plus fréquentes : CFC, hexagonale compacte et cubique centrée, toutes de grande compacité, comme on l'attend pour une liaison non dirigée.
  </div>
  <div class="def-box">
    <strong>Rayon métallique.</strong> Moitié de la distance entre les centres de deux atomes plus proches voisins dans le cristal métallique.
  </div>

  <p>Atomes aux 8 sommets et au centre du cube : \(Z = 8 \times \tfrac18 + 1 = 2\) ; contact le long de la grande diagonale : \(a\sqrt3 = 4R\) ; coordinence 8 (l'atome central touche les 8 sommets) ; compacité \( C \) \( = \dfrac{2 \times \frac43\pi R^3}{a^3} \) \( = \dfrac{\pi\sqrt3}{8} \approx 0{,}68 \).</p>
  <div class="method-box"><strong>Exemple — fer α et sodium</strong>
    <ol>
      <li>Fer α, CC, \(a = 286{,}65\ \text{pm}\), \(M = 55{,}85\ \text{g·mol}^{-1}\) : \(R = a\sqrt3/4 = 124{,}1\ \text{pm}\) ; \( \rho = \dfrac{2M}{N_A a^3} \) \( = 7{,}87\ \text{g·cm}^{-3} \), la valeur mesurée.</li>
      <li>Sodium, CC, \(a = 429{,}1\ \text{pm}\), \(M = 22{,}99\ \text{g·mol}^{-1}\) : \(\rho = 0{,}97\ \text{g·cm}^{-3}\). Le sodium flotte sur l'eau (avec laquelle il réagit vivement) : gros atomes (\(R = 186\ \text{pm}\)), légers, et faible cohésion (107 kJ·mol⁻¹), d'où sa mollesse et sa fusion à 98 °C.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la maille cubique centrée et la maille du chlorure de césium (§10). Dans une cubique centrée, le centre et les sommets portent la <strong>même</strong> entité ; dans CsCl, deux ions différents : le réseau est cubique simple, avec un motif de deux ions.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CRISTAUX COVALENTS</div>
  <h2>Une seule molécule géante</h2>
  <div class="intro">Dans le diamant ou le silicium, chaque atome est lié à ses voisins par des liaisons covalentes, et ces liaisons se prolongent dans tout le cristal : le solide est une molécule unique. Les liaisons covalentes étant fortes et dirigées, ces solides sont très durs et fondent très haut.</div>
  <div class="def-box">
    <strong>Liaison covalente.</strong> Mise en commun d'une paire d'électrons entre deux atomes. Elle est <strong>forte</strong> (C–C : 348 kJ·mol⁻¹, Si–O : environ 450 kJ·mol⁻¹, Si–Si : 222 kJ·mol⁻¹) et <strong>directionnelle</strong> : les angles entre liaisons sont fixés (109,5° autour d'un carbone tétraédrique). <strong>Rayon covalent</strong> : moitié de la distance entre deux atomes identiques liés par une liaison simple.
  </div>

</figure>
  <p><strong>Structure du diamant (fournie).</strong> Réseau CFC d'atomes de carbone, dont la moitié des sites tétraédriques, en quinconce, est également occupée par du carbone. Population \(Z = 4 + 4 = 8\) ; coordinence 4 (tétraèdre) ; les atomes liés sont à la distance \(a\sqrt3/4\) (un quart de la grande diagonale), d'où \(a\sqrt3/4 = 2r_{\text{cov}}\) ; compacité \(C = \dfrac{\pi\sqrt3}{16} \approx 0{,}34\).</p>
  <div class="method-box"><strong>Exemple — diamant et silicium</strong>
    <ol>
      <li>Diamant, \(a = 356{,}7\ \text{pm}\) : liaison C–C de \(a\sqrt3/4 = 154{,}5\ \text{pm}\), rayon covalent \(r = 77{,}2\ \text{pm}\) ; \( \rho \) \( = \dfrac{8 \times 12{,}01\times10^{-3}}{6{,}022\times10^{23}\times(356{,}7\times10^{-12})^3} \) \( = 3{,}52\times10^{3}\ \text{kg·m}^{-3} \) (mesurée : 3,51).</li>
      <li>Silicium, même structure, \(a = 543{,}1\ \text{pm}\) : \(r = 117{,}6\ \text{pm}\), \(\rho = 2{,}33\ \text{g·cm}^{-3}\).</li>
      <li>Avec une compacité de 0,34 seulement, le diamant est pourtant le plus dur des matériaux naturels : la dureté ne vient pas du remplissage, mais de la force et de la direction des liaisons.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Propriétés des solides covalents.</strong> Très durs mais fragiles (une liaison dirigée ne se déforme pas, elle casse), températures de fusion très élevées (silicium 1 414 °C, quartz vers 1 700 °C ; le graphite se sublime vers 3 600 °C sous 1 bar), insolubles dans tous les solvants usuels, isolants (diamant, quartz) ou semi-conducteurs (silicium, germanium) : les électrons sont localisés dans les liaisons.
  </div>
  <p><strong>Le graphite</strong>, autre variété du carbone, est formé de plans d'hexagones (liaisons covalentes, 142 pm) empilés à 335 pm les uns des autres et liés entre eux par de faibles interactions de van der Waals (§9). D'où une forte anisotropie : les plans glissent (mine de crayon, lubrifiant), le graphite se clive en feuillets et conduit l'électricité le long des plans. Avec ses plans plus espacés, il est moins dense que le diamant : 2,26 g·cm⁻³.</p>
  <div class="notice"><strong>Erreur classique</strong> : prendre la distance entre plus proches voisins du diamant le long de la diagonale de face, comme dans une CFC simple. Les atomes du réseau CFC du diamant ne se touchent pas entre eux : chacun touche les atomes des sites tétraédriques, le long du quart de la grande diagonale.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · CRISTAUX MOLÉCULAIRES</div>
  <h2>Des molécules tenues par des liens faibles</h2>
  <div class="intro">La glace, le diiode, le sucre, la carboglace (CO₂ solide), l'argon solide : les nœuds du réseau portent des molécules (ou des atomes de gaz noble), liées entre elles par des interactions bien plus faibles que les liaisons qui tiennent chaque molécule. D'où des solides mous qui fondent ou se subliment à basse température.</div>
  <div class="def-box">
    <strong>Interactions intermoléculaires</strong> (chapitre <a href="#molecules/cours">« Structure des molécules »</a>). Les interactions de <strong>van der Waals</strong>, entre dipôles permanents ou induits, existent entre toutes les molécules ; elles sont faibles (de l'ordre du kJ·mol⁻¹ par interaction) et peu directionnelles. La <strong>liaison hydrogène</strong>, entre un atome H lié à un atome très électronégatif (O, N, F) et un doublet non liant d'une autre molécule, est plus forte (10 à 40 kJ·mol⁻¹) et <strong>directionnelle</strong>. Les deux restent très inférieures à une liaison covalente.
  </div>
  <div class="def-box">
    <strong>Rayon de van der Waals.</strong> Moitié de la plus courte distance entre deux atomes identiques non liés, appartenant à deux molécules voisines. Il est toujours supérieur au rayon covalent du même atome (chlore : 175 pm contre 99 pm).
  </div>
  <div class="method-box"><strong>Exemple — l'argon solide</strong>
    <p>L'argon cristallise (sous −189 °C) dans une structure CFC, les atomes n'étant tenus que par des interactions de van der Waals. Près du zéro absolu, la distance entre plus proches voisins vaut 376 pm.</p>
    <ol>
      <li>Rayon de van der Waals : \(r_{\text{vdW}} = 376/2 = 188\ \text{pm}\).</li>
      <li>Paramètre de maille : \(a = 2r\sqrt2 = 532\ \text{pm}\) ; \( \rho \) \( = \dfrac{4 \times 39{,}95}{6{,}022\times10^{23}\times(5{,}32\times10^{-8})^3} \) \( = 1{,}76\ \text{g·cm}^{-3} \).</li>
      <li>Énergie de sublimation : 7,7 kJ·mol⁻¹ seulement, contre 337 kJ·mol⁻¹ pour le cuivre de même structure : la structure ne dit rien de la force de la cohésion.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — pourquoi la glace flotte</strong>
    <p>Dans la glace ordinaire, chaque molécule d'eau est liée à 4 voisines par des liaisons hydrogène dirigées vers les sommets d'un tétraèdre (distance O…O de 276 pm). Cette structure est ouverte ; sa maille (fournie) est un prisme hexagonal de paramètres \(a = 452{,}3\ \text{pm}\) et \(c = 736{,}7\ \text{pm}\), de volume \(\tfrac{\sqrt3}{2}a^2c\), contenant 4 molécules.</p>
    <ol>
      <li>Volume de la maille : \( \tfrac{\sqrt3}{2} \times (452{,}3)^2 \times 736{,}7 \) \( = 1{,}305\times10^{8}\ \text{pm}^3 \) \( = 1{,}305\times10^{-22}\ \text{cm}^3 \).</li>
      <li>\( \rho \) \( = \dfrac{4 \times 18{,}02}{6{,}022\times10^{23} \times 1{,}305\times10^{-22}} \) \( = 0{,}917\ \text{g·cm}^{-3} \), inférieure à celle de l'eau liquide (1,000) : la glace flotte, et l'eau qui gèle fait éclater les roches et les canalisations.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Propriétés des solides moléculaires.</strong> Mous, températures de fusion basses (argon −189 °C, eau 0 °C, diiode 114 °C ; CO₂ se sublime à −78,5 °C), souvent volatils, isolants. Les solides à liaisons hydrogène (glace, sucre) fondent plus haut que ceux de taille comparable tenus par les seules interactions de van der Waals. <strong>Solubilité</strong> : un solide moléculaire se dissout dans un solvant qui établit avec ses molécules des interactions comparables à celles qu'il rompt : le saccharose, à liaisons hydrogène, est très soluble dans l'eau ; le diiode, apolaire, l'est bien plus dans le cyclohexane que dans l'eau.
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'on rompt des liaisons covalentes en faisant fondre la glace. La fusion et la vaporisation ne rompent que les interactions entre molécules ; les molécules H₂O restent intactes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · CRISTAUX IONIQUES</div>
  <h2>Des charges opposées, rangées en alternance</h2>
  <div class="intro">Le sel de cuisine, la magnésie, la fluorine sont des empilements de cations et d'anions. L'attraction électrostatique entre charges opposées, forte et non dirigée, fait des solides durs, cassants, qui fondent haut et se dissolvent souvent dans l'eau.</div>
  <div class="def-box">
    <strong>Modèle du solide ionique parfait.</strong> Les ions sont des sphères dures chargées, de rayons \(r_+\) (cation) et \(r_-\) (anion). Un cation et un anion plus proches voisins sont <strong>tangents</strong> ; deux ions de même signe ne se touchent pas (sinon leur répulsion déstabiliserait la structure). L'ensemble est électriquement neutre, ce qui fixe la formule à partir des populations. <strong>Rayon ionique</strong> : on mesure \(r_+ + r_-\) dans le cristal et l'on partage cette distance en fixant par convention le rayon d'un ion de référence (O²⁻ : 140 pm).
  </div>

<figcaption>Deux structures ioniques (fournies par les énoncés), sphères réduites (au tiers environ) dans le rapport des rayons ioniques. À gauche, chlorure de sodium : les ions chlorure forment un réseau CFC et les ions sodium occupent tous ses sites octaédriques (centre et milieux des arêtes) ; chaque ion a 6 voisins de signe opposé, le contact se fait le long de l'arête, \( a = 2(r_+ + r_-) \). À droite, chlorure de césium : ions chlorure aux sommets, ion césium au centre ; 8 voisins, contact le long de la grande diagonale, \( a\sqrt3 = 2(r_+ + r_-) \). Ce n'est pas une maille cubique centrée : le centre et les sommets ne portent pas le même ion.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Structure du chlorure de sodium (fournie).</strong> Anions Cl⁻ en réseau CFC, cations Na⁺ dans <strong>tous</strong> les sites octaédriques. Populations : 4 Cl⁻ et 4 Na⁺, donc \(Z = 4\) motifs NaCl par maille ; coordinence 6/6 ; contact cation-anion le long de l'arête : \(a = 2(r_+ + r_-)\). Les anions ne se touchent pas si \(a\sqrt2 \ge 4r_-\), soit \(\dfrac{r_+}{r_-} \ge \sqrt2 - 1 \approx 0{,}414\).
  </div>
  <div class="method-box"><strong>Exemple — le chlorure de sodium</strong>
    <p>\(a = 564{,}0\ \text{pm}\), \(r(\text{Cl}^-) = 181\ \text{pm}\), \(M = 58{,}44\ \text{g·mol}^{-1}\).</p>
    <ol>
      <li>\(r_+ + r_- = a/2 = 282\ \text{pm}\), d'où \(r(\text{Na}^+) = 101\ \text{pm}\) ; \(r_+/r_- = 0{,}56\), compris entre 0,414 et 0,732 : la structure est stable et préférée à celle de CsCl.</li>
      <li>\( \rho \) \( = \dfrac{4 \times 58{,}44\times10^{-3}}{6{,}022\times10^{23}\times(564{,}0\times10^{-12})^3} \) \( = 2{,}16\times10^{3}\ \text{kg·m}^{-3} \) (mesurée : 2,165).</li>
      <li>Compacité : \(\dfrac{4 \times \frac43\pi\,(101^3 + 181^3)}{564^3} = 0{,}65\).</li>
      <li>Ordre de grandeur de l'énergie : l'énergie électrostatique d'une paire d'ions à 282 pm, rapportée à une mole, vaut \(\dfrac{N_A\,e^2}{4\pi\varepsilon_0\,d} \approx 490\ \text{kJ·mol}^{-1}\) ; l'énergie réticulaire mesurée est 787 kJ·mol⁻¹ : plusieurs centaines de kJ·mol⁻¹, comme une liaison covalente.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Structure du chlorure de césium (fournie).</strong> Anions Cl⁻ aux sommets d'un cube, cation Cs⁺ au centre : \(Z = 1\) ; coordinence 8/8 ; contact le long de la grande diagonale : \(a\sqrt3 = 2(r_+ + r_-)\) ; les anions ne se touchent pas si \(\dfrac{r_+}{r_-} \ge \sqrt3 - 1 \approx 0{,}732\). Exemple : \(a = 412{,}3\ \text{pm}\) donne \(r_+ + r_- = 357\ \text{pm}\), \(r(\text{Cs}^+) = 176\ \text{pm}\), \(r_+/r_- = 0{,}97\) et \(\rho = 3{,}99\ \text{g·cm}^{-3}\).
  </div>
  <div class="prop-box">
    <strong>Propriétés des solides ioniques.</strong>
    <ul>
      <li>durs mais <strong>cassants</strong> : un glissement d'un demi-paramètre met face à face des ions de même signe, qui se repoussent ; le cristal se fend (le sel se clive en petits cubes) ;</li>
      <li>températures de fusion élevées : NaCl 801 °C, MgO 2 852 °C (charges doubles, énergie réticulaire de 3 800 kJ·mol⁻¹) ;</li>
      <li>isolants à l'état solide (les charges sont localisées sur des ions immobiles), conducteurs une fois fondus ou dissous (les ions se déplacent) ;</li>
      <li>souvent solubles dans l'eau : le solvant, polaire, entoure chaque ion (solvatation) et affaiblit leur attraction : \(\text{NaCl(s)} \longrightarrow \text{Na}^+\text{(aq)} + \text{Cl}^-\text{(aq)}\).</li>
    </ul>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire, pour NaCl, le contact le long de la diagonale de face comme pour une CFC d'atomes identiques. Ce sont un cation et un anion qui se touchent, le long de l'arête ; les anions du réseau CFC sont écartés par les cations.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · LIMITES DU MODÈLE DU CRISTAL PARFAIT</div>
  <h2>Confronter le modèle aux mesures</h2>
  <div class="intro">Un modèle n'est pas la réalité : il en retient l'essentiel. Le cristal parfait de sphères dures prévoit très bien les masses volumiques des métaux, mais il ignore les défauts, les vibrations et la nature des liaisons. Comparer ses prévisions aux mesures dit jusqu'où l'on peut lui faire confiance.</div>
  <p><strong>Ce que le modèle ignore.</strong> Un cristal réel est fini et le plus souvent polycristallin ; il contient des <strong>défauts</strong> : lacunes (nœuds inoccupés), atomes en position interstitielle ou substitués, dislocations (qui expliquent qu'un métal réel se déforme bien plus facilement que le calcul ne le prévoit), joints de grains. Ses atomes <strong>vibrent</strong> autour de leur position, d'autant plus fort que la température est élevée : le paramètre de maille augmente avec la température (dilatation). Enfin, les atomes ne sont pas des sphères dures : leur « rayon » dépend de leur environnement.</p>
  <div class="method-box"><strong>Exemple — le fer à 912 °C : un rayon qui dépend de la coordinence</strong>
    <p>À 912 °C, on mesure \(a_\alpha = 290{,}4\ \text{pm}\) pour le fer α (CC) et \(a_\gamma = 364{,}7\ \text{pm}\) pour le fer γ (CFC).</p>
    <ol>
      <li>Si le rayon était le même dans les deux structures, le volume par atome varierait comme l'inverse de la compacité : \(0{,}68/0{,}74 = 0{,}919\), soit une contraction de 8 % au passage α → γ.</li>
      <li>Mesure : volume par atome \(a_\alpha^3/2 = 1{,}2245\times10^{7}\ \text{pm}^3\) et \(a_\gamma^3/4 = 1{,}2127\times10^{7}\ \text{pm}^3\) : contraction de 1,0 % seulement.</li>
      <li>Rayons déduits : \( R_\alpha = a_\alpha\sqrt3/4 \) \( = 125{,}7\ \text{pm} \), \( R_\gamma = a_\gamma\sqrt2/4 \) \( = 128{,}9\ \text{pm} \). Le rayon métallique augmente de 2,5 % quand la coordinence passe de 8 à 12 : un atome entouré de plus de voisins s'en tient plus loin. Le rayon n'est pas une constante de l'atome.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — un oxyde qui n'a pas la formule prévue</strong>
    <p>L'oxyde de fer(II) a la structure de NaCl (\(a = 430{,}7\ \text{pm}\)). Le modèle prévoit pour FeO \( \rho \) \( = \dfrac{4 \times 71{,}84}{N_A a^3} \) \( = 5{,}97\ \text{g·cm}^{-3} \) ; on mesure 5,74 g·cm⁻³.</p>
    <ol>
      <li>Le réseau des ions oxyde est complet, mais des sites de fer sont vides : la formule réelle est \(\text{Fe}_{1-x}\text{O}\).</li>
      <li>\( \rho \) \( = \dfrac{4\,[(1 - x)\,55{,}85 + 16{,}00]}{N_A a^3} \) \( = 5{,}74\ \text{g·cm}^{-3} \) donne \(x = 0{,}05\) : il manque 5 % des ions fer, et la neutralité est assurée par des ions Fe³⁺.</li>
    </ol>
  </div>
  <p><strong>D'autres écarts.</strong> Les métaux de la §4 ont des masses volumiques calculées à mieux que 0,3 % ; mais une pièce frittée (poudre comprimée et chauffée) n'atteint que 90 % de la masse volumique du cristal, à cause des pores. Le zinc hexagonal a un rapport \(c/a\) de 1,856, loin de 1,633 (§5). Dans la blende ZnS (structure fournie), la distance mesurée entre Zn et S (234 pm) est plus courte que la somme des rayons ioniques tabulés (244 pm) : la liaison n'y est pas purement ionique mais en partie covalente. Les rayons ioniques eux-mêmes reposent sur une convention (le rayon de l'ion de référence) et varient avec la coordinence.</p>
  <div class="notice"><strong>Erreur classique</strong> : conclure qu'un modèle est « faux » dès qu'il s'écarte de la mesure. Un écart de quelques dixièmes de pour cent confirme le modèle ; un écart de plusieurs pour cent révèle un phénomène qu'il ignore (défauts, liaison mixte, porosité), et c'est souvent l'information intéressante.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Mesurer une maille ; classer les réseaux</h2>
  <div class="intro">Rien de ce qui suit n'est exigible en PTSI.</div>
  <p><strong>Diffraction des rayons X.</strong> Les paramètres de maille se mesurent en envoyant sur le cristal des rayons X de longueur d'onde comparable aux distances interatomiques. Les ondes réfléchies par une famille de plans parallèles, distants de \(d\), interfèrent constructivement dans les directions qui vérifient la <strong>loi de Bragg</strong> \(2d\sin\theta = n\lambda\). Par exemple, pour l'aluminium (CFC, \(a = 404{,}95\ \text{pm}\)), les plans compacts sont distants de \(d = a/\sqrt3 = 233{,}8\ \text{pm}\) ; avec le rayonnement du cuivre (\(\lambda = 154{,}06\ \text{pm}\)), la première réflexion apparaît à \(\theta = 19{,}24°\) : c'est le premier pic du diffractogramme de l'aluminium, à \(2\theta = 38{,}5°\).</p>
  <p><strong>Réseaux de Bravais.</strong> Il n'existe que 14 types de réseaux tridimensionnels, répartis en 7 systèmes (cubique, quadratique, orthorhombique, hexagonal, rhomboédrique, monoclinique, triclinique). Le réseau CFC a une maille primitive rhomboédrique (trois vecteurs joignant un sommet aux centres des trois faces voisines, à 60° les uns des autres), de volume \(a^3/4\) : on lui préfère la maille cubique, quatre fois plus grande mais qui montre la symétrie.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · CRISTAUX</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur les solides cristallins : décrire une maille, compter sa population, trouver la direction de contact, calculer coordinence, compacité et masse volumique, localiser et évaluer les sites de la CFC, analyser une structure ionique fournie, relier la nature des liaisons aux propriétés et confronter le modèle aux mesures. Seule la maille CFC est à connaître ; les autres structures sont décrites par l'énoncé.</div>

  <div class="method-box"><strong>Méthode 1 — Décrire un cristal : réseau, motif, maille</strong>
    <ol>
      <li><span class="step">Nœuds.</span> Repérer des points équivalents (même environnement, même orientation) : ils forment le réseau.</li>
      <li><span class="step">Motif.</span> Lister ce qui est attaché à chaque nœud (un atome, une paire d'ions, une molécule).</li>
      <li><span class="step">Maille.</span> Choisir un parallélépipède construit sur trois vecteurs du réseau qui pave l'espace ; compter ses nœuds : 1 pour une maille primitive, plus pour une maille multiple (conventionnelle).</li>
      <li><span class="step">Contrôle.</span> Volume par nœud = volume de la maille / nombre de nœuds, le même quelle que soit la maille choisie.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans NaCl, les nœuds forment un réseau CFC (4 nœuds par maille cubique) et le motif est une paire Na⁺ + Cl⁻ : 4 motifs NaCl par maille. La maille cubique d'arête 564 pm (volume \(1{,}79\times10^{8}\ \text{pm}^3\)) n'est pas primitive ; une maille primitive aurait un volume quatre fois plus petit, \(4{,}49\times10^{7}\ \text{pm}^3\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appeler « maille » le plus petit parallélépipède possible. La maille conventionnelle CFC contient 4 nœuds ; elle est choisie pour sa forme cubique, pas pour sa petitesse.</div>

  <div class="method-box"><strong>Méthode 2 — Calculer la population d'une maille</strong>
    <ol>
      <li><span class="step">Classer.</span> Pour chaque entité, dire si elle est sur un sommet, une arête, une face ou à l'intérieur.</li>
      <li><span class="step">Pondérer.</span> Sommet : \(\tfrac18\) ; arête : \(\tfrac14\) ; face : \(\tfrac12\) ; intérieur : 1 (maille parallélépipédique).</li>
      <li><span class="step">Sommer</span> par espèce chimique, puis vérifier la neutralité (cristal ionique) ou la formule (alliage).</li>
    </ol>
    <p><em>Exemple éclair :</em> pérovskite CaTiO₃ (structure fournie) : Ca²⁺ aux 8 sommets, O²⁻ aux 6 centres de faces, Ti⁴⁺ au centre. Ca : \(8 \times \tfrac18 = 1\) ; O : \(6 \times \tfrac12 = 3\) ; Ti : 1. Formule CaTiO₃, et la neutralité est respectée : \(2 + 4 - 3 \times 2 = 0\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Trouver la direction de contact et relier paramètre et rayons</strong>
    <ol>
      <li><span class="step">Plus courte distance.</span> Chercher les deux centres les plus proches dans la maille : ce sont eux qui se touchent dans le modèle des sphères dures.</li>
      <li><span class="step">Écrire le contact.</span> Cubique simple : arête, \(a = 2R\). CFC : diagonale de face, \(a\sqrt2 = 4R\). Cubique centrée : grande diagonale, \(a\sqrt3 = 4R\). Diamant : quart de grande diagonale, \(a\sqrt3/4 = 2r\). NaCl : arête, \(a = 2(r_+ + r_-)\). CsCl : grande diagonale, \(a\sqrt3 = 2(r_+ + r_-)\).</li>
      <li><span class="step">Nommer le rayon.</span> Métallique, covalent, de van der Waals ou ionique, selon la nature du solide.</li>
    </ol>
    <p><em>Exemple éclair :</em> le chrome (cubique centré, \(a = 288{,}5\ \text{pm}\)) a un rayon métallique \(R = a\sqrt3/4 = 124{,}9\ \text{pm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer la relation de contact d'une structure à une autre. On ne l'apprend pas par cœur pour les structures fournies : on la retrouve en cherchant la plus courte distance.</div>

  <div class="method-box"><strong>Méthode 4 — Déterminer une coordinence</strong>
    <ol>
      <li><span class="step">Choisir</span> une entité facile à entourer (un sommet, ou mieux le centre de la maille).</li>
      <li><span class="step">Mesurer</span> les distances aux autres entités (en tenant compte des mailles voisines) et retenir la plus courte.</li>
      <li><span class="step">Compter</span> les entités à cette distance ; pour un cristal ionique, compter les plus proches voisins de signe opposé, pour chaque ion.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans NaCl, l'ion Na⁺ du centre du cube a pour plus proches voisins les 6 ions Cl⁻ des centres des faces, à \(a/2 = 282\ \text{pm}\) : coordinence 6/6.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Calculer une compacité</strong>
    <ol>
      <li><span class="step">Population</span> (méthode 2) et <span class="step">contact</span> (méthode 3).</li>
      <li><span class="step">Volume occupé</span> : somme des volumes des sphères de la maille, \(Z\cdot\tfrac43\pi R^3\) (ou \(\tfrac43\pi\sum r_i^3\) pour plusieurs espèces).</li>
      <li><span class="step">Diviser</span> par le volume de la maille, exprimé avec le même rayon : le résultat est un nombre pur entre 0 et 1.</li>
    </ol>
    <p><em>Exemple éclair :</em> cubique centrée : \(C = \dfrac{2 \times \frac43\pi R^3}{(4R/\sqrt3)^3} = \dfrac{\pi\sqrt3}{8} = 0{,}68\). Repères : 0,52 (cubique simple), 0,68 (cubique centrée), 0,74 (CFC et hexagonal compact, maximum), 0,34 (diamant).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer une masse volumique (ou remonter au paramètre)</strong>
    <ol>
      <li><span class="step">Masse de la maille</span> : \(m = \dfrac{Z\,M}{N_A}\) (pour plusieurs espèces, \(\sum Z_i M_i / N_A\)).</li>
      <li><span class="step">Volume</span> : \(a^3\) pour une maille cubique (sinon, volume du parallélépipède fourni).</li>
      <li><span class="step">Unités</span> : \(M\) en kg·mol⁻¹ et \(a\) en m donnent des kg·m⁻³ ; contrôler l'ordre de grandeur (0,5 à 23 g·cm⁻³ pour un métal).</li>
      <li><span class="step">À l'envers</span>, \(a = \left(\dfrac{ZM}{N_A\,\rho}\right)^{1/3}\) ; une masse volumique mesurée permet aussi de choisir entre deux structures.</li>
    </ol>
    <p><em>Exemple éclair :</em> le tungstène (\(M = 183{,}84\ \text{g·mol}^{-1}\), \(\rho = 19{,}25\ \text{g·cm}^{-3}\)) est cubique centré : \(a = \left(\dfrac{2 \times 183{,}84}{6{,}022\times10^{23} \times 19{,}25}\right)^{1/3}\) \(= 3{,}165\times10^{-8}\ \text{cm} = 316{,}5\ \text{pm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier que 1 pm = \(10^{-12}\) m = \(10^{-10}\) cm, ou élever au cube le préfixe sans élever la puissance de dix : \((361{,}5\ \text{pm})^3 = 4{,}724\times10^{7}\ \text{pm}^3 = 4{,}724\times10^{-29}\ \text{m}^3\).</div>

  <div class="method-box"><strong>Méthode 7 — Localiser, dénombrer et évaluer les sites de la CFC</strong>
    <ol>
      <li><span class="step">Octaédriques</span> : centre du cube (1) + milieux des 12 arêtes (\(\tfrac14\) chacun) = 4 ; habitabilité \(r_O = \dfrac a2 - R = (\sqrt2 - 1)R \approx 0{,}414\,R\).</li>
      <li><span class="step">Tétraédriques</span> : centres des 8 petits cubes d'arête \(a/2\), en \((\tfrac14, \tfrac14, \tfrac14)\)… = 8 ; habitabilité \(r_T = \dfrac{a\sqrt3}{4} - R \approx 0{,}225\,R\).</li>
      <li><span class="step">Conclure</span> : un atome de rayon \(r \le r_{\text{site}}\) s'insère sans déformation ; un peu plus gros, il déforme le réseau et sa solubilité est limitée.</li>
    </ol>
    <p><em>Exemple éclair :</em> nickel CFC, \(R = 124{,}6\ \text{pm}\) : \(r_O = 51{,}6\ \text{pm}\), \(r_T = 28{,}0\ \text{pm}\). L'hydrogène (rayon de l'ordre de 37 pm) tient dans les sites octaédriques, pas dans les tétraédriques.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Analyser une structure ionique fournie</strong>
    <ol>
      <li><span class="step">Réseau d'anions</span> (souvent CFC) et <span class="step">sites occupés</span> par les cations (tous les sites O : NaCl ; la moitié des sites T : blende ZnS ; tous les sites T : fluorine CaF₂, cations et anions inversés).</li>
      <li><span class="step">Formule et neutralité</span> à partir des populations.</li>
      <li><span class="step">Contact</span> cation-anion (méthode 3) ; <span class="step">stabilité</span> : les anions ne doivent pas se toucher, ce qui impose \(r_+/r_-\) au-dessus d'une valeur seuil (0,225 pour T, 0,414 pour O, 0,732 pour la coordinence 8 de CsCl).</li>
      <li><span class="step">Rayon ionique</span> d'un ion connaissant l'autre : \(r_+ = d_{\text{contact}} - r_-\).</li>
    </ol>
    <p><em>Exemple éclair :</em> MgO, structure NaCl, \(a = 421{,}2\ \text{pm}\), \(r(\text{O}^{2-}) = 140\ \text{pm}\) : \(r(\text{Mg}^{2+}) = a/2 - 140 = 70{,}6\ \text{pm}\) ; \(r_+/r_- = 0{,}50 \gt 0{,}414\) : la structure NaCl est stable ; \(\rho = \dfrac{4 \times 40{,}30}{N_A a^3} = 3{,}58\ \text{g·cm}^{-3}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Relier la nature des liaisons aux propriétés</strong>
    <ol>
      <li><span class="step">Identifier les éléments</span> : métal seul → solide métallique ; métal + non-métal très électronégatif → solide ionique ; non-métaux liés dans tout le cristal (C, Si, SiO₂) → covalent ; molécules ou gaz noble → moléculaire.</li>
      <li><span class="step">Caractériser la cohésion</span> : énergie (métallique et ionique : centaines de kJ·mol⁻¹ ; covalente : 200 à 500 kJ·mol⁻¹ par liaison ; van der Waals : quelques kJ·mol⁻¹ ; liaison hydrogène : 10 à 40 kJ·mol⁻¹), directionnalité, localisation des électrons ou des charges.</li>
      <li><span class="step">En déduire</span> : température de fusion (suit l'énergie), dureté et fragilité (liaison dirigée ou ions de même signe face à face → cassant ; liaison non dirigée et électrons libres → ductile), conductivité (électrons délocalisés ou ions mobiles), solubilité (interactions avec le solvant).</li>
    </ol>
    <p><em>Exemple éclair :</em> un solide blanc, cassant, qui fond à 770 °C, isolant mais conducteur une fois fondu ou dissous dans l'eau : c'est un solide ionique (le chlorure de potassium, KCl).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Confronter le modèle aux mesures</strong>
    <ol>
      <li><span class="step">Calculer</span> la prévision du modèle (masse volumique, paramètre, rayon) et l'<span class="step">écart relatif</span> \(\dfrac{|x_{\text{modèle}} - x_{\text{mesure}}|}{x_{\text{mesure}}}\).</li>
      <li><span class="step">Juger</span> : moins de 1 % confirme le modèle ; plusieurs pour cent signalent un phénomène ignoré.</li>
      <li><span class="step">Interpréter</span> : lacunes ou non-stœchiométrie (masse volumique trop faible), porosité d'une pièce, dilatation (température de la mesure), rayon qui dépend de la coordinence, liaison en partie covalente (distance plus courte que la somme des rayons ioniques).</li>
    </ol>
    <p><em>Exemple éclair :</em> une pièce de cuivre frittée a une masse volumique de 8,0 g·cm⁻³ contre 8,93 pour le cristal : elle contient \(1 - 8{,}0/8{,}93 \approx 10\ \%\) de vide (porosité), ce que le modèle du cristal parfait ne décrit pas.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Structures ioniques : la règle des rapports de rayons</h3>
  <div class="statement">Rayons ioniques : \(r(\text{Cl}^-) = 181\ \text{pm}\), \(r(\text{Cs}^+) = 174\ \text{pm}\) (en coordinence 8). Le chlorure de potassium a la structure de NaCl avec \(a = 629{,}2\ \text{pm}\) ; le chlorure de césium a sa propre structure (Cl⁻ aux sommets, Cs⁺ au centre), \(a_{\text{mes}} = 412{,}3\ \text{pm}\). \(M(\text{KCl}) = 74{,}55\) ; \(M(\text{CsCl}) = 168{,}36\ \text{g·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Pour la structure NaCl, établir la condition de non-contact des anions \(r_+/r_- \ge \sqrt2 - 1\). Faire de même pour la structure CsCl : \(r_+/r_- \ge \sqrt3 - 1\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(r(\text{K}^+)\) et la masse volumique de KCl. Le rapport \(r_+/r_-\) est-il compatible avec la structure observée ?</div>
  <div class="q"><strong>Q3.</strong> Prévoir le paramètre de maille de CsCl à partir des rayons ioniques et le comparer à la mesure. Calculer la masse volumique.</div>
  <div class="q"><strong>Q4.</strong> Pourquoi CsCl n'adopte-t-il pas la structure NaCl ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> NaCl : contact cation-anion le long de l'arête, \(a = 2(r_+ + r_-)\) ; deux anions les plus proches (sommet et centre de face) sont à \(a\sqrt2/2\) ; ils ne se touchent pas si \(a\sqrt2/2 \ge 2r_-\), soit \(\sqrt2\,(r_+ + r_-) \ge 2r_-\), c'est-à-dire \(\dfrac{r_+}{r_-} \ge \sqrt2 - 1 = 0{,}414\). CsCl : contact le long de la grande diagonale, \(a\sqrt3 = 2(r_+ + r_-)\) ; deux anions voisins sont à \(a\) ; condition \(a \ge 2r_-\), soit \(\dfrac{2(r_+ + r_-)}{\sqrt3} \ge 2r_-\), c'est-à-dire \(\dfrac{r_+}{r_-} \ge \sqrt3 - 1 = 0{,}732\).</p>
    <p><strong>Q2.</strong> \( r(\text{K}^+) = a/2 - r_- \) \( = 314{,}6 - 181 \) \( = 133{,}6\ \text{pm} \) ; \( \rho \) \( = \dfrac{4 \times 74{,}55}{6{,}022\times10^{23} \times (6{,}292\times10^{-8})^3} \) \( = 1{,}99\ \text{g·cm}^{-3} \). \(r_+/r_- = 0{,}74\) : au-dessus de 0,414, la structure NaCl est possible ; mais aussi au-dessus de 0,732, si bien que la règle permettrait déjà la structure CsCl. La règle des rapports de rayons n'est qu'indicative : près d'un seuil, les deux structures ont des énergies très voisines.</p>
    <p><strong>Q3.</strong> \( a = \dfrac{2(174 + 181)}{\sqrt3} \) \( = 409{,}9\ \text{pm} \), 0,6 % sous la mesure ; \( \rho \) \( = \dfrac{168{,}36}{6{,}022\times10^{23} \times (4{,}123\times10^{-8})^3} \) \( = 3{,}99\ \text{g·cm}^{-3} \).</p>
    <p><strong>Q4.</strong> \(r_+/r_- = 0{,}96\) : le gros ion Cs⁺ peut s'entourer de 8 anions sans qu'ils se touchent. Une coordinence plus élevée rapproche davantage d'ions de signe opposé et abaisse l'énergie électrostatique : la structure CsCl (8/8) est préférée à NaCl (6/6).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Carboglace et quartz : deux dioxydes, deux types de solides</h3>
  <div class="statement">À 150 K, le dioxyde de carbone solide (carboglace) cristallise dans une structure où les centres des molécules CO₂ occupent les nœuds d'un réseau CFC de paramètre \(a = 562{,}4\ \text{pm}\) (structure fournie). La liaison C=O mesure 116 pm. Le dioxyde de silicium (quartz) est formé d'atomes de silicium liés chacun à 4 atomes d'oxygène, chaque oxygène étant lié à 2 silicium, dans tout le cristal ; il fond vers 1 700 °C et sa masse volumique vaut 2,65 g·cm⁻³. \(M(\text{CO}_2) = 44{,}01\ \text{g·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la masse volumique de la carboglace. Un bloc commercial a une masse volumique de 1,56 g·cm⁻³ : interpréter.</div>
  <div class="q"><strong>Q2.</strong> Calculer la distance entre les centres de deux molécules voisines et la comparer à la longueur de la liaison C=O. Quelle est la nature des interactions entre molécules ?</div>
  <div class="q"><strong>Q3.</strong> La carboglace se sublime à −78,5 °C sous 1 bar ; le quartz fond vers 1 700 °C. Expliquer cette différence entre deux composés de formules analogues.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> 4 molécules par maille : \( \rho \) \( = \dfrac{4 \times 44{,}01}{6{,}022\times10^{23} \times (5{,}624\times10^{-8})^3} \) \( = 1{,}64\ \text{g·cm}^{-3} \). Le bloc commercial, obtenu en comprimant de la « neige » de CO₂, contient environ \(1 - 1{,}56/1{,}64 = 5\ \%\) de vide entre les grains : le cristal parfait ne décrit pas la porosité du matériau.</p>
    <p><strong>Q2.</strong> Centres de deux molécules voisines : demi-diagonale de face, \(a/\sqrt2 = 398\ \text{pm}\), plus de trois fois la longueur de la liaison C=O. Les molécules restent individualisées ; entre elles, seules agissent des interactions de van der Waals (la molécule est apolaire).</p>
    <p><strong>Q3.</strong> Sublimer la carboglace ne rompt que les faibles interactions de van der Waals entre molécules (environ 26 kJ·mol⁻¹) ; les liaisons C=O restent intactes. Fondre le quartz impose de rompre des liaisons covalentes Si–O (environ 450 kJ·mol⁻¹ chacune), qui forment un réseau tridimensionnel continu : c'est un solide covalent. La formule ne dit pas le type de solide.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Hexagonal compact : le titane</h3>
  <div class="statement">Structure hexagonale compacte (fournie) : prisme droit à base hexagonale régulière d'arête \(a\) et de hauteur \(c\), contenant deux couches compactes ; volume \(V = \tfrac{3\sqrt3}{2}a^2c\). Le titane (\(M = 47{,}87\ \text{g·mol}^{-1}\)) l'adopte avec \(a = 295{,}1\ \text{pm}\) et \(c = 468{,}6\ \text{pm}\).</div>
  <div class="q"><strong>Q1.</strong> La maille hexagonale porte des atomes aux 12 sommets, aux centres des 2 bases et 3 à l'intérieur. Montrer que \(Z = 6\) (un sommet est partagé entre 6 prismes).</div>
  <div class="q"><strong>Q2.</strong> Pour des sphères tangentes, montrer que \(c/a = \sqrt{8/3}\) et que la compacité vaut \(\dfrac{\pi}{3\sqrt2}\), comme la CFC. On admettra que la distance entre un atome d'une couche et ses voisins de la couche suivante vaut \(\sqrt{a^2/3 + c^2/4}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(c/a\) et la masse volumique du titane (mesurée : 4,51 g·cm⁻³).</div>
  <div class="q"><strong>Q4.</strong> Un élève prend \(R = a/2\) et trouve une compacité de 0,76. Pourquoi est-ce impossible ? Quelle est la bonne direction de contact ? Recalculer \(R\) et la compacité.</div>
  <div class="q"><strong>Q5.</strong> Combien de sites octaédriques et tétraédriques compte cette maille ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( Z \) \( = 12 \times \tfrac16 + 2 \times \tfrac12 + 3 \) \( = 2 + 1 + 3 = 6 \).</p>
    <p><strong>Q2.</strong> Dans une couche, \(a = 2R\). Entre couches, contact si \(\sqrt{a^2/3 + c^2/4} = a\), d'où \(c^2/4 = 2a^2/3\) et \(c/a = \sqrt{8/3} = 1{,}633\). Compacité : \(\dfrac{6 \times \frac43\pi R^3}{\frac{3\sqrt3}{2}a^2c}\) avec \(a = 2R\) et \(c = 2R\sqrt{8/3}\) : \(\dfrac{8\pi R^3}{\frac{3\sqrt3}{2} \times 4R^2 \times 2R\sqrt{8/3}}\) \( = \dfrac{8\pi}{12\sqrt3\sqrt{8/3}} \) \( = \dfrac{8\pi}{12\sqrt8} \) \( = \dfrac{\pi}{3\sqrt2} \).</p>
    <p><strong>Q3.</strong> \(c/a = 1{,}588\), inférieur à 1,633 : les couches sont un peu tassées. \(V = 1{,}060\times10^{8}\ \text{pm}^3\) ; \( \rho \) \( = \dfrac{6 \times 47{,}87}{6{,}022\times10^{23} \times 1{,}060\times10^{-22}} \) \( = 4{,}50\ \text{g·cm}^{-3} \).</p>
    <p><strong>Q4.</strong> Une compacité supérieure à 0,74, maximum pour des sphères identiques, signale des sphères qui s'interpénètrent. Comme \(c/a \lt 1{,}633\), la distance entre couches \(\sqrt{a^2/3 + c^2/4} = 289{,}7\ \text{pm}\) est plus courte que \(a\) : le contact se fait entre couches. \(R = 144{,}8\ \text{pm}\) et la compacité vaut 0,72. Les atomes de titane ne sont pas exactement des sphères dures identiques dans toutes les directions.</p>
    <p><strong>Q5.</strong> Dans tout empilement compact, il y a autant de sites octaédriques que d'atomes et deux fois plus de sites tétraédriques : 6 sites octaédriques et 12 sites tétraédriques par maille.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Mesurer des rayons ioniques</h3>
  <div class="statement">Paramètres de maille (pm) de quelques halogénures alcalins de structure NaCl : NaCl 564,0 ; KCl 629,2 ; NaBr 597,7 ; KBr 660,0 ; NaI 647,3 ; KI 706,6 ; LiCl 513,0 ; LiI 600,0. La diffraction des rayons X ne donne que \(a\), donc \(r_+ + r_-\) : il faut une hypothèse supplémentaire pour séparer les deux rayons.</div>
  <div class="q"><strong>Q1.</strong> Si les rayons ioniques sont des constantes additives, que doit valoir \(a(\text{KX}) - a(\text{NaX})\) quel que soit l'halogène X ? Calculer cette différence pour Cl, Br et I et commenter.</div>
  <div class="q"><strong>Q2.</strong> L'ion Li⁺ est très petit. On suppose que, dans LiI, les ions iodure sont en contact entre eux. En déduire \(r(\text{I}^-)\) et la place qui reste pour Li⁺.</div>
  <div class="q"><strong>Q3.</strong> Avec la même hypothèse pour LiCl, calculer \(r(\text{Cl}^-)\), puis \(r(\text{Na}^+)\) et \(r(\text{K}^+)\) à partir de NaCl et KCl.</div>
  <div class="q"><strong>Q4.</strong> Quelles limites du modèle ces calculs font-ils apparaître ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(a = 2(r_+ + r_-)\), donc \(a(\text{KX}) - a(\text{NaX}) = 2\,[r(\text{K}^+) - r(\text{Na}^+)]\), indépendant de X. Mesures : 65,2 pm (Cl), 62,3 pm (Br), 59,3 pm (I). Les différences sont voisines mais pas égales (écart de 10 %) : l'additivité des rayons n'est qu'approchée.</p>
    <p><strong>Q2.</strong> Anions en contact le long de la diagonale d'une face (comme dans une CFC d'anions seuls) : \(a\sqrt2 = 4r_-\), \( r(\text{I}^-) \) \( = \dfrac{600{,}0\sqrt2}{4} \) \( = 212\ \text{pm} \). Le long de l'arête, il reste pour le cation \(a/2 - r_- = 300 - 212 = 88\ \text{pm}\), exactement \((\sqrt2 - 1)r_-\) : c'est l'habitabilité du site octaédrique. Li⁺ y est plus petit que la cavité : il « flotte » dans son site.</p>
    <p><strong>Q3.</strong> LiCl : \( r(\text{Cl}^-) \) \( = \dfrac{513{,}0\sqrt2}{4} \) \( = 181\ \text{pm} \), la valeur des tables. Puis \( r(\text{Na}^+) = 564{,}0/2 - 181 \) \( = 101\ \text{pm} \) et \( r(\text{K}^+) = 629{,}2/2 - 181 \) \( = 134\ \text{pm} \).</p>
    <p><strong>Q4.</strong> Les ions ne sont pas des sphères dures de rayon fixe : leur taille apparente dépend du partenaire et de la coordinence (Q1), les anions en contact se repoussent et s'écartent un peu (l'hypothèse de Q2 est approchée), et une liaison partiellement covalente raccourcit les distances. Les tables de rayons ioniques reposent sur un choix de référence (O²⁻ à 140 pm pour la table de Shannon) et ne sont cohérentes qu'entre elles.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le nickel et son oxyde</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème <em>solides cristallins</em>). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">Données : \(N_A = 6{,}022\times10^{23}\ \text{mol}^{-1}\) ; \(M_{\text{Ni}} = 58{,}69\), \(M_{\text{O}} = 16{,}00\ \text{g·mol}^{-1}\) ; rayon de l'ion oxyde \(r(\text{O}^{2-}) = 140\ \text{pm}\).</div>
  <p class="exo-part">Partie A — Le nickel métallique</p>
  <div class="q"><strong>A1.</strong> Le nickel cristallise dans une structure cubique à faces centrées de paramètre \(a = 352{,}4\ \text{pm}\). Représenter la maille, donner sa population et la coordinence d'un atome.</div>
  <div class="q"><strong>A2.</strong> Calculer le rayon métallique, la compacité et la masse volumique du nickel.</div>
  <div class="q"><strong>A3.</strong> Situer le nickel dans le tableau périodique et relier la nature de sa liaison à sa ductilité et à sa conductivité.</div>
  <p class="exo-part">Partie B — Insertion dans le nickel</p>
  <div class="q"><strong>B1.</strong> Calculer l'habitabilité des sites octaédriques et tétraédriques du nickel.</div>
  <div class="q"><strong>B2.</strong> L'hydrogène atomique (rayon de l'ordre de 37 pm) peut-il s'insérer sans déformation ? Et le carbone (77 pm) ? Dans quels sites ?</div>
  <p class="exo-part">Partie C — L'oxyde de nickel</p>
  <div class="q"><strong>C1.</strong> L'oxyde NiO a la structure du chlorure de sodium : ions O²⁻ en réseau CFC, ions Ni²⁺ dans tous les sites octaédriques. Donner les populations, la coordinence et la relation de contact.</div>
  <div class="q"><strong>C2.</strong> Avec \(a = 417{,}7\ \text{pm}\), calculer \(r(\text{Ni}^{2+})\). La structure est-elle stable dans le modèle du solide ionique parfait ?</div>
  <div class="q"><strong>C3.</strong> Calculer la masse volumique prévue par le modèle.</div>
  <p class="exo-part">Partie D — Limites du modèle</p>
  <div class="q"><strong>D1.</strong> Un échantillon d'oxyde noir, de même paramètre de maille, a une masse volumique mesurée de 6,67 g·cm⁻³. On suppose que le réseau d'oxyde est complet et que des sites de nickel sont vides : formule \(\text{Ni}_{1-x}\text{O}\). Calculer \(x\).</div>
  <div class="q"><strong>D2.</strong> Comment l'électroneutralité peut-elle être assurée ? Combien d'ions Ni³⁺ faut-il par formule ?</div>
  <p class="exo-part">Partie E — Propriétés</p>
  <div class="q"><strong>E1.</strong> Le nickel est ductile et conducteur ; NiO est cassant, isolant et fond à 1 955 °C. Expliquer ces différences à partir de la nature des liaisons.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Maille cubique, atomes aux 8 sommets et aux 6 centres des faces : \( Z \) \( = 8 \times \tfrac18 + 6 \times \tfrac12 \) \( = 4 \). Coordinence 12 (un atome de sommet est au contact des 12 centres de faces qui l'entourent).</p>
    <p><strong>A2.</strong> Contact le long de la diagonale d'une face : \(R = a\sqrt2/4 = 124{,}6\ \text{pm}\). Compacité \(\pi/(3\sqrt2) = 0{,}74\). \( \rho \) \( = \dfrac{4 \times 58{,}69}{6{,}022\times10^{23} \times (3{,}524\times10^{-8})^3} \) \( = 8{,}91\ \text{g·cm}^{-3} \).</p>
    <p><strong>A3.</strong> Nickel : 4ᵉ période, bloc d, élément de transition, à gauche de la frontière entre métaux et non-métaux. Liaison métallique : électrons de valence délocalisés (conductivité), cohésion non dirigée (les plans d'atomes glissent sans rupture : ductilité).</p>
    <p><strong>B1.</strong> \(r_O = (\sqrt2 - 1)R = 51{,}6\ \text{pm}\) ; \( r_T \) \( = \left(\sqrt{\tfrac32} - 1\right)R \) \( = 28{,}0\ \text{pm} \).</p>
    <p><strong>B2.</strong> L'hydrogène (37 pm) tient dans les sites octaédriques (51,6 pm), pas dans les tétraédriques (28,0 pm) : il s'y insère sans déformation, ce qui explique la facilité avec laquelle il diffuse dans le nickel (et la fragilisation de certains métaux par l'hydrogène). Le carbone (77 pm) dépasse les deux habitabilités : son insertion déforme le réseau et reste très limitée.</p>
    <p><strong>C1.</strong> O²⁻ : 4 ; Ni²⁺ : \(1 + 12 \times \tfrac14 = 4\) ; formule NiO, \(Z = 4\). Coordinence 6/6. Contact cation-anion le long de l'arête : \(a = 2\,[r(\text{Ni}^{2+}) + r(\text{O}^{2-})]\).</p>
    <p><strong>C2.</strong> \( r(\text{Ni}^{2+}) = a/2 - 140 \) \( = 68{,}9\ \text{pm} \). \(r_+/r_- = 0{,}49\), compris entre 0,414 et 0,732 : les anions ne se touchent pas, la structure NaCl est stable.</p>
    <p><strong>C3.</strong> \( \rho \) \( = \dfrac{4 \times (58{,}69 + 16{,}00)}{6{,}022\times10^{23} \times (4{,}177\times10^{-8})^3} \) \( = 6{,}81\ \text{g·cm}^{-3} \).</p>
    <p><strong>D1.</strong> \(\rho = \dfrac{4\,[(1 - x)\,M_{\text{Ni}} + M_{\text{O}}]}{N_A a^3}\), d'où \((1 - x)\,M_{\text{Ni}} = \dfrac{\rho\,N_A a^3}{4} - M_{\text{O}}\), avec \( N_A a^3 = 43{,}89\ \text{cm}^3\text{·mol}^{-1} \) : \( \dfrac{\rho\,N_A a^3}{4} \) \( = \dfrac{6{,}67 \times 43{,}89}{4} \) \( = 73{,}2\ \text{g·mol}^{-1} \), donc \((1 - x) \times 58{,}69 = 57{,}2\) et \(x = 0{,}026\) : \(\text{Ni}_{0{,}974}\text{O}\).</p>
    <p><strong>D2.</strong> Chaque lacune de Ni²⁺ retire deux charges positives : deux ions Ni²⁺ voisins deviennent Ni³⁺. Il faut \(2x = 0{,}051\) ion Ni³⁺ par formule. Le cristal réel n'est pas parfait : ses lacunes (et la présence de Ni³⁺, qui lui donne sa couleur noire et une légère conductivité) échappent au modèle.</p>
    <p><strong>E1.</strong> Dans le nickel, la liaison métallique est non dirigée et les électrons de valence sont délocalisés : ductilité et conductivité. Dans NiO, la cohésion est ionique, entre ions de charges ±2 : très forte (fusion à 1 955 °C) et non dirigée, mais un glissement met face à face des ions de même signe (le cristal casse), et les charges restent localisées sur des ions immobiles (isolant).</p>
  </div>
</div>
