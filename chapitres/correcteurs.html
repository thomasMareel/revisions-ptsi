<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · ANTICIPATION ET CORRECTEUR PID (HORS PROGRAMME)</div>
  <h2>Agir avant l'écart, cumuler les actions</h2>
  <div class="intro">Ces compléments ne sont pas au programme, qui ne retient que les correcteurs P, PI et à avance de phase : un sujet qui les utilise les présente. Un correcteur placé dans la boucle ne réagit qu'à un écart déjà apparu. Quand la consigne est connue à l'avance (trajectoire d'un robot, profil de vitesse d'un convoyeur), on peut ajouter à la commande un terme calculé directement à partir d'elle : c'est l'<strong>anticipation</strong>. Et quand ni le PI ni l'avance de phase ne suffisent seuls, on les associe : c'est le <strong>PID</strong>.</div>
  <h3>Anticipation de la consigne</h3>
  <div class="prop-box">
    On ajoute à la sortie du correcteur \(C\) un terme \(F(p)\,E(p)\), calculé hors de la boucle, devant le processus \(G\) (retour unitaire). Alors
    <div class="formula" data-nom="Écart avec anticipation">$$S = \frac{(C + F)\,G}{1 + C\,G}\,E,\qquad \varepsilon = E - S = \frac{1 - F\,G}{1 + C\,G}\,E.$$</div>
    <ul>
      <li>Le dénominateur \(1 + CG\) est <strong>inchangé</strong> : l'anticipation ne modifie ni les pôles de la boucle fermée ni les marges ; elle améliore le suivi sans toucher à la stabilité.</li>
      <li>L'anticipation idéale \(F = 1/G\) annulerait l'écart à tout instant, mais elle n'est pas réalisable (gain infini en hautes pulsations, commande saturée). On se contente d'annuler le terme dominant : anticipation <strong>statique</strong> \(F = 1/G(0)\) pour une classe 0, anticipation <strong>de vitesse</strong> pour une consigne en rampe.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — supprimer l'écart de traînage d'un axe</strong>
    <p>Axe \(G(p) = \dfrac{K}{p\,(1 + \tau p)}\), correcteur proportionnel \(C = K_c\), consigne en rampe \(a\,t\). Sans anticipation, l'écart de traînage vaut \(\dfrac{a}{K_cK}\).</p>
    <ol>
      <li>Anticipation de vitesse \(F(p) = \dfrac{p}{K}\) (une dérivation de la consigne, réalisable puisque la consigne est calculée) : \(1 - FG = 1 - \dfrac{1}{1 + \tau p} = \dfrac{\tau p}{1 + \tau p}\).</li>
      <li>\(\varepsilon(p) = \dfrac{\tau p}{(1 + \tau p)(1 + K_cG(p))}\cdot\dfrac{a}{p^2}\), et \(\varepsilon_\infty = \lim_{p \to 0} \dfrac{a\tau}{(1 + \tau p)(1 + K_cG(p))} = 0\), car \(K_cG(p) \to \infty\).</li>
      <li>L'écart de traînage est annulé sans changer \(K_c\) : la marge de phase reste celle du réglage proportionnel.</li>
    </ol>
  </div>
  <div class="notice"><strong>Compensation de perturbation.</strong> Le même principe s'applique à une perturbation <em>mesurable</em> (température extérieure d'un bâtiment, couple de charge estimé) : on ajoute à la commande un terme qui la contre avant qu'elle n'ait créé d'écart. La boucle fermée corrige ensuite ce que la compensation a laissé passer.</div>

  <h3>Le correcteur PID</h3>
  <div class="prop-box">
    Forme théorique (parallèle) et forme réalisée (série, avec filtrage de la dérivée) :
    <div class="formula" data-nom="Correcteur PID">$$C(p) = K_p\Big(1 + \frac{1}{T_ip} + T_dp\Big),\qquad C(p) = K_p\,\frac{1 + T_ip}{T_ip}\cdot\frac{1 + aTp}{1 + Tp}\ \ (a \gt 1).$$</div>
    La forme série est un <strong>PI suivi d'une avance de phase</strong>. Son Bode a une allure « en baignoire » : pente \(-20\) dB/décade sous \(1/T_i\) (précision), palier, puis remontée bornée autour de \(\omega_{c0}\) (avance de phase), et palier en hautes pulsations (bruit limité).
  </div>
  <div class="method-box">
    <strong>Démarche de réglage</strong>
    <ol>
      <li>Choisir \(\omega_{c0}\) visée (rapidité) et la phase à apporter en \(\omega_{c0}\) pour obtenir la marge de phase, en comptant la petite perte du PI (environ \(-6°\) avec \(T_i = 10/\omega_{c0}\)).</li>
      <li>Dimensionner l'avance de phase : \(a\) par l'avance maximale \(\sin\varphi_m = \dfrac{a - 1}{a + 1}\), puis \(T\) pour que \(\omega_m = \dfrac{1}{T\sqrt a} = \omega_{c0}\).</li>
      <li>Placer la cassure du PI une décade sous \(\omega_{c0}\), puis choisir \(K_p\) pour que la FTBO corrigée coupe 0 dB en \(\omega_{c0}\).</li>
      <li>Vérifier en simulation : marges, dépassement, temps de réponse, et surtout pic de commande (l'action dérivée amplifie les variations brusques de consigne).</li>
    </ol>
  </div>
  <div class="notice"><strong>Réglage empirique de Ziegler et Nichols.</strong> Sans modèle, on règle d'abord le système en proportionnel seul jusqu'à l'oscillation entretenue (gain \(K_{lim}\), période \(T_{osc}\)), puis l'on prend \(K_p = 0{,}6\,K_{lim}\), \(T_i = T_{osc}/2\) et \(T_d = T_{osc}/8\). Le résultat est un point de départ, souvent trop peu amorti (dépassement de l'ordre de 25 à 40 %), que l'on affine ensuite.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="corr-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · RÉGLAGE DES CORRECTEURS</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Traduire le cahier des charges en objectifs sur la FTBO</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Précision.</span> Écart statique nul exigé → FTBO de classe ≥ 1 (et intégrateur en amont de la perturbation si elle doit aussi être rejetée) ; écart borné → condition sur \(K_{BO}\) (\(\varepsilon_s = E_0/(1+K_{BO})\) en classe 0, \(\varepsilon_v = V/K_{BO}\) en classe 1).</li>
      <li><span class="step">Amortissement.</span> Dépassement maximal → marge de phase cible (≈ 45° pour 20-25 %, ≈ 60° pour 10 %, ≥ 70° pour un dépassement quasi nul).</li>
      <li><span class="step">Rapidité.</span> \(t_{r5\%}\) maximal → \(\omega_c\) minimale, avec \(t_{r5\%}\,\omega_c\) de 2 à 6 selon l'amortissement visé (≈ 3,7 pour \(M_\varphi = 60°\)).</li>
      <li><span class="step">Stabilité.</span> Noter les marges minimales imposées ; elles serviront de vérification finale.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Réduire l'ordre du modèle avant de régler (pôles dominants)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Pôles.</span> Calculer les pôles (racines du dénominateur) et repérer les pôles dominants : ceux dont la partie réelle est la plus proche de zéro.</li>
      <li><span class="step">Rapport.</span> Un pôle (ou une paire) dont la partie réelle est, en valeur absolue, au moins 5 fois (par prudence 10 fois) celle des pôles dominants est négligeable pour la réponse temporelle.</li>
      <li><span class="step">Zéros.</span> Vérifier qu'aucun zéro n'est voisin des pôles dominants ; sinon, le garder dans le modèle réduit.</li>
      <li><span class="step">Réduire.</span> Remplacer par 1 le facteur canonique du pôle rapide, \((1+\tau_r p)\) ou \(\left(1+\frac{2\xi_r}{\omega_r}p+\frac{p^2}{\omega_r^2}\right)\) : le gain statique est conservé.</li>
      <li><span class="step">Limites.</span> Paire complexe peu amortie : comparer \(\xi_r\omega_r\), pas \(\omega_r\). Pour les marges, garder un pôle qui n'est que 5 à 10 fois plus rapide que la coupure (il y retire encore 6° à 11° de phase).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(H_{BF}(p) = \dfrac{90}{(p+10)(p^2+2p+9)}\) a pour pôles \(-1 \pm 2{,}83j\) et \(-10\) : rapport 10. Le facteur \((p+10)\) devient 10, d'où \(H_r(p) = \dfrac{9}{p^2+2p+9}\) : \(\omega_0 = 3\ \text{rad/s}\), \(\xi = 1/3\), dépassement prévu ≈ 33 % (modèle complet : ≈ 31 %).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Régler un correcteur proportionnel</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Phase cible.</span> Écrire \(\arg H(j\omega) = -180° + M_\varphi\) et la résoudre : graphiquement sur le Bode, ou analytiquement (somme d'arctangentes ; pour deux termes, prendre la tangente des deux membres).</li>
      <li><span class="step">Gain.</span> Calculer \(|H(j\omega_\varphi)|\) puis \(K_p = 1/|H(j\omega_\varphi)|\) (ou lire \(G_{dB}\) et poser \(20\log K_p = -G_{dB}\)).</li>
      <li><span class="step">Marge de gain.</span> Si elle est imposée : \(\omega_\pi\) (pour une FTBO à numérateur constant, partie imaginaire du dénominateur nulle), puis \(20\log K_p \leq -M_G - G_{dB,H}(\omega_\pi)\). Garder le plus petit \(K_p\).</li>
      <li><span class="step">Conclure.</span> Recalculer précision et rapidité avec ce \(K_p\) : si un critère échoue, le P ne suffit pas (justifier le choix d'un PI ou d'une avance).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Régler un correcteur PI</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Choisir la stratégie.</span> Pôle dominant net, stable et bien connu → compensation (\(T_i = \tau_1\)) ; sinon → cassure une décade sous la coupure.</li>
      <li><span class="step">Compensation.</span> Simplifier la FTBO (classe 1), puis régler \(K_p\) comme en méthode 3.</li>
      <li><span class="step">Cassure sous la coupure.</span> Réserver ≈ 6° (\(T_i\omega_c = 10\)) ; trouver \(\omega_c\) où \(\arg H = -180° + M_\varphi + 6°\) ; poser \(T_i = 10/\omega_c\) ; \(K_p \approx 1/|H(j\omega_c)|\).</li>
      <li><span class="step">Tracer.</span> Asymptotes du PI : \(-20\ \text{dB/déc}\) jusqu'à \(1/T_i\), puis plateau à \(20\log K_p\).</li>
      <li><span class="step">Piège.</span> Ne pas oublier que le PI retire de la phase à \(\omega_c\) : régler \(K_p\) sur la phase de \(H\) seule surestime \(M_\varphi\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Dimensionner une avance de phase</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Coupure.</span> Fixer \(\omega_c\) (rapidité exigée, ou \(\omega_{c0}\) conservée).</li>
      <li><span class="step">Phase manquante.</span> \(\varphi_m = M_\varphi - \big(180° + \arg H(j\omega_c)\big)\), plus 3 à 5° de sécurité si \(\omega_c\) n'est pas imposée exactement.</li>
      <li><span class="step">Paramètres.</span> \(a = \dfrac{1+\sin\varphi_m}{1-\sin\varphi_m}\) arrondi par excès ; \(T = \dfrac{1}{\omega_c\sqrt a}\) ; \(K_p = \dfrac{1}{\sqrt a\,|H(j\omega_c)|}\).</li>
      <li><span class="step">Contrôles.</span> \(\varphi_m\) ≤ 60° environ (sinon deux cellules) ; \(M_G\) de la FTBO corrigée ; pic de commande \(aK_p\varepsilon_0\) face à la saturation ; précision (le gain BF vaut \(K_p\)).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Tracer le Bode asymptotique d'une FTBO corrigée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Forme canonique.</span> Écrire \(C(p)H(p)\) comme produit de briques : gain, \(1/p^\alpha\), \((1+\tau p)^{\pm1}\), 2ᵉ ordre.</li>
      <li><span class="step">Cassures.</span> Ranger les pulsations de cassure par ordre croissant.</li>
      <li><span class="step">Gain.</span> Départ en basses pulsations : pente \(-20\alpha\ \text{dB/déc}\), passant par \(20\log K_{BO}\) à \(\omega = 1\) ; à chaque cassure, la pente change de \(\pm 20\) dB/déc (zéro : +20, pôle : −20).</li>
      <li><span class="step">Phase.</span> Départ à \(-90°\alpha\) ; chaque pôle retire 90° (−45° à sa cassure), chaque zéro en ajoute 90°. Tracer la courbe réelle en sommant les arctangentes en quelques points.</li>
      <li><span class="step">Contrôle.</span> Pente finale = −20 × (degré du dénominateur − degré du numérateur) dB/déc.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Valider sur une réponse indicielle simulée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Valeur finale.</span> La lire et la comparer à la consigne → écart statique.</li>
      <li><span class="step">Dépassement.</span> \(D\% = \dfrac{s_{max} - s_\infty}{s_\infty}\times 100\).</li>
      <li><span class="step">Temps de réponse.</span> Tracer la bande \(s_\infty \pm 5\%\) ; \(t_{r5\%}\) = instant de la <em>dernière</em> entrée dans la bande.</li>
      <li><span class="step">Commande.</span> Relever le maximum de \(u(t)\) (souvent \(u(0^+)\)) et le comparer à la saturation.</li>
      <li><span class="step">Conclure</span> critère par critère, sous forme de tableau « exigé / obtenu / validé ? ».</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Régler des boucles imbriquées</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Boucle interne.</span> La régler seule, puis calculer sa FTBF (gain statique et constante de temps).</li>
      <li><span class="step">Substitution.</span> Remplacer, dans la boucle externe, tout le bloc interne par cette FTBF.</li>
      <li><span class="step">Boucle externe.</span> La régler sur ce modèle ; vérifier que sa coupure est 5 à 10 fois plus basse que la bande passante interne.</li>
      <li><span class="step">Perturbation.</span> Pour l'écart dû à une perturbation constante, regarder si un intégrateur se trouve <em>en amont</em> du point d'entrée de la perturbation.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Chercher \(M_\varphi\) et \(M_G\) sur le Bode de la FTBF : ces marges n'ont de sens que sur la FTBO.</li>
      <li>Confondre \(\omega_{c0}\) (gain de la FTBO égal à 0 dB) et la pulsation de cassure d'un bloc.</li>
      <li>Oublier le gain \(\sqrt a\) apporté par l'avance de phase en \(\omega_m\) en réglant \(K_p\).</li>
      <li>Utiliser la formule de \(\varphi_m\) avec la convention \(\frac{1+Tp}{1+aTp}\), \(a \lt 1\) : vérifier toujours quel terme a la plus grande constante de temps (celle du numérateur pour une avance).</li>
      <li>Annoncer un écart nul vis-à-vis d'une perturbation constante en s'appuyant sur un intégrateur situé <em>en aval</em> de son point d'entrée (par exemple l'intégration vitesse → position du processus) : seul un intégrateur placé entre l'écart et la perturbation, comme celui d'un PI, l'annule.</li>
    </ul>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="corr-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Gain proportionnel d'un volet motorisé</h3>
  <div class="statement">La position angulaire d'un volet d'aération est asservie avec un retour unitaire. Le processus a pour fonction de transfert \(H(p) = \dfrac{2}{p(1+0{,}25p)}\) (temps en secondes) et le correcteur est proportionnel : \(C(p) = K_p\). On impose \(M_\varphi = 60°\).</div>
  <div class="q"><strong>Q1.</strong> Donner la classe de la FTBO. Que vaut l'écart statique pour un échelon de consigne ? Que dire de la marge de gain ?</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(K_p\).</div>
  <div class="q"><strong>Q3.</strong> La consigne devient une rampe de pente \(0{,}5\ \text{rad/s}\). Calculer l'erreur de traînage.</div>
  <div class="q"><strong>Q4.</strong> Estimer le dépassement et le temps de réponse à 5 %.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Un intégrateur : classe 1, donc écart statique nul pour un échelon. Phase \(-90° - \arctan(0{,}25\omega)\), strictement supérieure à \(-180°\) : elle n'atteint jamais \(-180°\), \(M_G\) est infinie quel que soit \(K_p\).</p>
    <p><strong>Q2.</strong> \(-90° - \arctan(0{,}25\,\omega_\varphi) = -120°\) → \(0{,}25\,\omega_\varphi = \tan 30°\) → \(\omega_\varphi \approx 2{,}31\ \text{rad/s}\). Alors \(|H(j\omega_\varphi)| = \dfrac{2}{2{,}31\sqrt{1+1/3}} = 0{,}75\), d'où \(K_p = 1/0{,}75 \approx 1{,}33\).</p>
    <p><strong>Q3.</strong> \(K_{BO} = 2K_p \approx 2{,}67\ \text{s}^{-1}\) ; \(\varepsilon_v = \dfrac{0{,}5}{2{,}67} \approx 0{,}19\ \text{rad}\) (environ 11°).</p>
    <p><strong>Q4.</strong> Ici la FTBO est exactement du type \(K/(p(1+\tau p))\) : \(M_\varphi = 60°\) correspond à \(\xi \approx 0{,}61\), \(D \approx 9\%\), et \(t_{r5\%} \approx 3{,}7/\omega_{c0} \approx 1{,}6\ \text{s}\). Vérification : la FTBF a pour pulsation propre \(\omega_0 = \sqrt{2K_p/0{,}25} \approx 3{,}27\ \text{rad/s}\) et \(\xi = \dfrac{1}{2\sqrt{0{,}25 \times 2K_p}} \approx 0{,}61\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Lecture d'un correcteur à avance de phase</h3>
  <div class="statement">Un correcteur a pour fonction de transfert \(C(p) = K_p\,\dfrac{1+aTp}{1+Tp}\) avec \(K_p = 2\), \(a = 4\) et \(T = 25\ \text{ms}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les pulsations de cassure et tracer les asymptotes du diagramme de gain (niveaux en dB).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\omega_m\), \(\varphi_m\) et le gain en \(\omega_m\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la phase à \(10\ \text{rad/s}\) puis à \(40\ \text{rad/s}\). Commenter.</div>
  <div class="q"><strong>Q4.</strong> L'écart passe brusquement de 0 à \(0{,}5\ \text{V}\) et y reste. Que vaut la commande juste après le saut, puis en régime permanent ?</div>
  <div class="q"><strong>Q5.</strong> Quelle valeur de \(a\) faudrait-il pour une avance maximale de 55° ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(1/(aT) = 1/0{,}1 = 10\ \text{rad/s}\) et \(1/T = 40\ \text{rad/s}\). Asymptotes : \(20\log 2 \approx 6{,}0\ \text{dB}\) jusqu'à 10 rad/s, pente \(+20\ \text{dB/déc}\) jusqu'à 40 rad/s, puis \(20\log(aK_p) = 20\log 8 \approx 18{,}1\ \text{dB}\) (on monte bien de \(20\log 4 \approx 12\ \text{dB}\) sur \(\log 4 \approx 0{,}6\) décade).</p>
    <p><strong>Q2.</strong> \(\omega_m = \dfrac{1}{T\sqrt a} = \dfrac{1}{0{,}025 \times 2} = 20\ \text{rad/s}\) ; \(\sin\varphi_m = \dfrac{3}{5}\) → \(\varphi_m \approx 36{,}9°\) ; enfin, à mi-chemin des deux plateaux :</p>
    <div class="formula">$$G_{dB}(\omega_m) = 20\log(K_p\sqrt a) = 20\log 4 \approx 12{,}0\ \text{dB}$$</div>
    <p><strong>Q3.</strong> À 10 rad/s puis à 40 rad/s :</p>
    <div class="formula">$$\arctan 1 - \arctan 0{,}25 = 45° - 14{,}0° \approx 31{,}0°$$</div>
    <div class="formula">$$\arctan 4 - \arctan 1 = 76{,}0° - 45° \approx 31{,}0°$$</div>
    <p>Mêmes valeurs : 10 et 40 rad/s sont symétriques de \(\omega_m = 20\) en échelle logarithmique (rapport 2 de part et d'autre), la cloche de phase est symétrique.</p>
    <p><strong>Q4.</strong> Valeur initiale : \(u(0^+) = aK_p \times 0{,}5 = 4\ \text{V}\). Valeur finale (\(p \to 0\)) : \(K_p \times 0{,}5 = 1\ \text{V}\). Le pic initial est 4 fois la valeur finale : c'est le prix de l'action dérivée.</p>
    <p><strong>Q5.</strong> \(a = \dfrac{1+\sin 55°}{1-\sin 55°} = \dfrac{1{,}819}{0{,}181} \approx 10\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Conflit précision–stabilité en correction proportionnelle</h3>
  <div class="statement">Une régulation de pression est modélisée, retour unitaire, par \(H(p) = \dfrac{4}{(1+5p)(1+p)(1+0{,}2p)}\). Correcteur : \(C(p) = K_p\). Cahier des charges : \(M_\varphi \geq 45°\), \(M_G \geq 10\ \text{dB}\), écart statique ≤ 2 % pour un échelon.</div>
  <div class="q"><strong>Q1.</strong> Calculer l'écart statique relatif pour \(K_p = 1\).</div>
  <div class="q"><strong>Q2.</strong> Développer le dénominateur, en déduire \(\omega_\pi\) et le gain limite \(K_{lim}\).</div>
  <div class="q"><strong>Q3.</strong> Quelle condition sur \(K_p\) garantit \(M_G \geq 10\ \text{dB}\) ?</div>
  <div class="q"><strong>Q4.</strong> Vérifier que la phase de \(H\) vaut \(-135°\) en \(\omega = 1\ \text{rad/s}\) ; en déduire le \(K_p\) donnant \(M_\varphi = 45°\).</div>
  <div class="q"><strong>Q5.</strong> Quel \(K_p\) retenir ? Le critère de précision est-il satisfait ? Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Classe 0 : \(\varepsilon_s = \dfrac{1}{1+4K_p} = \dfrac{1}{5} = 20\ \%\).</p>
    <p><strong>Q2.</strong> En développant, le dénominateur vaut</p>
    <div class="formula">$$D(p) = 1 + 6{,}2p + 6{,}2p^2 + p^3$$</div>
    <p>En \(p = j\omega\) : partie réelle \(1 - 6{,}2\omega^2\), partie imaginaire \(\omega(6{,}2 - \omega^2)\). La phase vaut \(-180°\) quand la partie imaginaire s'annule (avec partie réelle négative) : \(\omega_\pi = \sqrt{6{,}2} \approx 2{,}49\ \text{rad/s}\). Le dénominateur y vaut \(1 - 6{,}2^2 = -37{,}44\), donc \(|H(j\omega_\pi)| = 4/37{,}44 \approx 0{,}107\) et \(K_{lim} = 9{,}36\).</p>
    <p><strong>Q3.</strong> \(M_G = 20\log\dfrac{K_{lim}}{K_p} \geq 10\) ⇔ \(K_p \leq \dfrac{9{,}36}{\sqrt{10}} \approx 2{,}96\).</p>
    <p><strong>Q4.</strong> \(\arctan 5 + \arctan 0{,}2 = 90°\) (arguments inverses) et \(\arctan 1 = 45°\) : la phase vaut bien \(-135°\). \(|H(j1)| = \dfrac{4}{\sqrt{26 \times 2 \times 1{,}04}} = \dfrac{4}{7{,}35} \approx 0{,}544\), d'où \(K_p \approx 1{,}84\).</p>
    <p><strong>Q5.</strong> On garde le plus petit : \(K_p = 1{,}84\), qui donne \(M_\varphi = 45°\) et \(M_G = 20\log(9{,}36/1{,}84) \approx 14\ \text{dB}\). L'écart vaut alors \(\dfrac{1}{1+7{,}35} \approx 12\ \%\) : critère non satisfait. Pour 2 %, il faudrait \(4K_p \geq 49\), soit \(K_p \geq 12{,}25 \gt K_{lim}\) : impossible avec un P, le système serait instable. Il faut augmenter la classe : correcteur PI. <em>Remarque :</em> une simulation avec \(K_p = 1{,}84\) donne un dépassement voisin de 30 %, au-dessus de la règle « 45° ↔ 23 % » : pour une FTBO d'ordre 3 de classe 0, cette règle n'est qu'indicative.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>PI par compensation du pôle dominant</h3>
  <div class="statement">Un tapis de convoyage est asservi en vitesse (retour unitaire, grandeurs normalisées en volts) : \(H(p) = \dfrac{8}{(1+1{,}2p)(1+0{,}04p)}\). On souhaite un écart statique nul et \(M_\varphi = 60°\). La commande est limitée à \(\pm 12\ \text{V}\).</div>
  <div class="q"><strong>Q1.</strong> Pourquoi un correcteur proportionnel ne peut-il pas satisfaire l'exigence de précision ?</div>
  <div class="q"><strong>Q2.</strong> On choisit \(C(p) = K_p\dfrac{1+T_ip}{T_ip}\) avec \(T_i = 1{,}2\ \text{s}\). Écrire la FTBO corrigée.</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(K_p\) pour \(M_\varphi = 60°\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que la FTBF est un 2ᵉ ordre ; calculer \(\omega_0\), \(\xi\) et le dépassement.</div>
  <div class="q"><strong>Q5.</strong> Pour un échelon de consigne de 4 V, calculer \(u(0^+)\). La saturation est-elle atteinte ?</div>
  <div class="q"><strong>Q6.</strong> Un couple résistant s'ajoute entre le correcteur et le processus. Pourquoi son rejet sera-t-il lent ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La FTBO \(8K_p/((1+1{,}2p)(1+0{,}04p))\) est de classe 0 : \(\varepsilon_s = \dfrac{E_0}{1+8K_p}\), jamais nul pour un gain fini.</p>
    <p><strong>Q2.</strong> Dans le produit \(C(p)H(p)\), le facteur \((1+1{,}2p)\) apparaît au numérateur (zéro du PI) et au dénominateur (pôle lent) : il se simplifie, et \(8/1{,}2 = 20/3 \approx 6{,}67\ \text{s}^{-1}\).</p>
    <div class="formula">$$H_{BO}(p) = \frac{20K_p/3}{p(1+0{,}04p)}$$</div>
    <p><strong>Q3.</strong> \(-90° - \arctan(0{,}04\,\omega) = -120°\) → \(0{,}04\,\omega_c = \tan 30°\) → \(\omega_c = 25/\sqrt3 \approx 14{,}4\ \text{rad/s}\). Alors \(\omega_c\sqrt{1+1/3} = 50/3\), et \(\dfrac{20K_p/3}{50/3} = 1\) → \(K_p = 2{,}5\).</p>
    <p><strong>Q4.</strong> Avec \(K_{BO} = 20K_p/3 \approx 16{,}7\ \text{s}^{-1}\) : \(H_{BF} = \dfrac{1}{1 + \dfrac{p}{K_{BO}} + \dfrac{0{,}04}{K_{BO}}p^2}\), 2ᵉ ordre de gain 1 (écart nul). \(\omega_0 = \sqrt{K_{BO}/0{,}04} \approx 20{,}4\ \text{rad/s}\) ; \(\dfrac{2\xi}{\omega_0} = \dfrac{1}{K_{BO}}\) → \(\xi = \dfrac{\omega_0}{2K_{BO}} \approx 0{,}61\) ; \(D = e^{-\pi\xi/\sqrt{1-\xi^2}} \approx 9\ \%\). L'abaque (\(t_{r5\%}\,\omega_0 \approx 5{,}2\) pour \(\xi = 0{,}61\)) donne \(t_{r5\%} \approx 0{,}25\ \text{s}\), cohérent avec \(3{,}7/\omega_c \approx 0{,}26\ \text{s}\).</p>
    <p><strong>Q5.</strong> \(\varepsilon(0^+) = 4\ \text{V}\) et, au démarrage, le PI agit comme le gain \(K_p\) : \(u(0^+) = K_p \times 4 = 10\ \text{V} \lt 12\ \text{V}\). Pas de saturation ; la commande redescend ensuite vers sa valeur finale \(4/8 = 0{,}5\ \text{V}\).</p>
    <p><strong>Q6.</strong> La simplification n'a lieu que dans la réponse à la consigne. Pour la perturbation, la fonction de transfert contient encore le pôle en \(-1/1{,}2\) : l'intégrateur finit par annuler l'écart, mais avec un mode de constante de temps de l'ordre de 1,2 s, bien plus lent que les 0,25 s de la réponse à la consigne.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>PI placé une décade sous la coupure</h3>
  <div class="statement">On a relevé le diagramme de Bode d'un processus de classe 0 et de gain statique 20 (retour unitaire) :
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0;text-align:center">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem;border:1px solid var(--grid)">\(\omega\) (rad/s)</th><td style="padding:.3rem;border:1px solid var(--grid)">2</td><td style="border:1px solid var(--grid)">5</td><td style="border:1px solid var(--grid)">8</td><td style="border:1px solid var(--grid)">10</td><td style="border:1px solid var(--grid)">15</td><td style="border:1px solid var(--grid)">20</td><td style="border:1px solid var(--grid)">25</td></tr>
    <tr><th style="padding:.3rem;border:1px solid var(--grid)">\(G_{dB}\)</th><td style="padding:.3rem;border:1px solid var(--grid)">22,8</td><td style="border:1px solid var(--grid)">16,4</td><td style="border:1px solid var(--grid)">11,5</td><td style="border:1px solid var(--grid)">8,7</td><td style="border:1px solid var(--grid)">3,0</td><td style="border:1px solid var(--grid)">−1,7</td><td style="border:1px solid var(--grid)">−5,5</td></tr>
    <tr><th style="padding:.3rem;border:1px solid var(--grid)">\(\varphi\) (°)</th><td style="padding:.3rem;border:1px solid var(--grid)">−58,6</td><td style="border:1px solid var(--grid)">−100,5</td><td style="border:1px solid var(--grid)">−123,7</td><td style="border:1px solid var(--grid)">−135,0</td><td style="border:1px solid var(--grid)">−155,4</td><td style="border:1px solid var(--grid)">−169,5</td><td style="border:1px solid var(--grid)">−180,2</td></tr>
  </table></div>
  Cahier des charges : écart statique nul, \(M_\varphi \geq 50°\), \(M_G \geq 10\ \text{dB}\). On utilise un PI dont la cassure est placée une décade sous la coupure : \(T_i\,\omega_c = 10\).</div>
  <div class="q"><strong>Q1.</strong> Sans correction (\(C = 1\)) : estimer \(\omega_{c0}\), \(M_\varphi\), \(M_G\) et l'écart statique. Conclure.</div>
  <div class="q"><strong>Q2.</strong> Quel retard de phase le PI apporte-t-il en \(\omega_c\) ? En déduire \(\omega_c\) puis \(T_i\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(K_p\).</div>
  <div class="q"><strong>Q4.</strong> Donner les asymptotes du diagramme de gain du PI.</div>
  <div class="q"><strong>Q5.</strong> On admet que la phase de la FTBO corrigée atteint \(-180°\) vers 24 rad/s, où le gain de \(H\) vaut \(-4{,}8\ \text{dB}\). Vérifier \(M_G\).</div>
  <div class="q"><strong>Q6.</strong> La simulation donne \(D \approx 13\ \%\) et \(t_{r5\%} \approx 0{,}9\ \text{s}\), avec une approche finale très lente. Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le gain s'annule entre 15 et 20 rad/s : par interpolation \(\omega_{c0} \approx 18\ \text{rad/s}\), où \(\varphi \approx -165°\), soit \(M_\varphi \approx 15°\). À 25 rad/s la phase vaut ≈ −180° et le gain −5,5 dB : \(M_G \approx 5{,}5\ \text{dB}\). Écart statique : \(1/(1+20) \approx 4{,}8\ \%\). Les trois critères échouent.</p>
    <p><strong>Q2.</strong> \(\Delta\varphi = \arctan\dfrac{1}{T_i\omega_c} = \arctan 0{,}1 \approx 5{,}7°\). On cherche \(\arg H(j\omega_c) = -180° + 50° + 5{,}7° \approx -124°\) : le tableau donne \(\omega_c = 8\ \text{rad/s}\). Donc \(T_i = 10/8 = 1{,}25\ \text{s}\) (cassure à 0,8 rad/s).</p>
    <p><strong>Q3.</strong> En \(\omega_c\) : \(|C| = K_p\sqrt{1+0{,}01} \approx 1{,}005\,K_p\). Il faut \(20\log K_p + 0{,}04 + 11{,}5 = 0\) → \(20\log K_p \approx -11{,}5\ \text{dB}\) → \(K_p \approx 0{,}27\).</p>
    <p><strong>Q4.</strong> Pente \(-20\ \text{dB/déc}\) jusqu'à \(1/T_i = 0{,}8\ \text{rad/s}\), puis plateau à \(20\log K_p \approx -11{,}5\ \text{dB}\).</p>
    <p><strong>Q5.</strong> En 24 rad/s, le PI vaut quasiment \(K_p\) (\(T_i\omega = 30\)) : gain de la FTBO \(\approx -4{,}8 - 11{,}5 = -16{,}3\ \text{dB}\), donc \(M_G \approx 16\ \text{dB} \geq 10\ \text{dB}\). Et \(M_\varphi = 180° - 123{,}7° - 5{,}7° \approx 50{,}6°\). Cahier des charges respecté.</p>
    <p><strong>Q6.</strong> Le PI a ramené la coupure de 18 à 8 rad/s : la réponse est plus lente mais bien amortie. L'approche finale lente vient d'un pôle de la boucle fermée très proche du zéro du PI (\(-1/T_i = -0{,}8\)) : leur effet ne se compense pas exactement et laisse une petite composante lente, la « traîne » typique du PI. Rapprocher \(1/T_i\) de \(\omega_c\) accélérerait cette traîne, mais coûterait de la phase en \(\omega_c\) : c'est le compromis du réglage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Avance de phase contre simple gain</h3>
  <div class="statement">L'axe linéaire d'une machine de découpe a pour FTBO non corrigée (retour unitaire) \(H(p) = \dfrac{100}{p(1+0{,}05p)}\). Cahier des charges : \(M_\varphi \geq 45°\), pulsation de coupure \(\omega_c = 60\ \text{rad/s}\), gain de boucle \(K_{BO} \geq 100\ \text{s}^{-1}\) (erreur de traînage).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_{c0}\) et \(M_\varphi\) sans correction.</div>
  <div class="q"><strong>Q2.</strong> On essaie \(C(p) = K_p\). Quel \(K_p\) donne \(M_\varphi = 45°\) ? Quelles conséquences sur la rapidité et sur \(K_{BO}\) ?</div>
  <div class="q"><strong>Q3.</strong> On choisit \(C(p) = K_p\dfrac{1+aTp}{1+Tp}\) centré sur 60 rad/s. Calculer l'avance nécessaire, puis choisir \(a\) entier, \(T\) et \(K_p\).</div>
  <div class="q"><strong>Q4.</strong> Vérifier \(M_\varphi\), \(K_{BO}\) et justifier que \(M_G\) reste infinie.</div>
  <div class="q"><strong>Q5.</strong> La simulation donne : avec le P, \(D \approx 23\ \%\) et \(t_{r5\%} \approx 0{,}31\ \text{s}\) ; avec l'avance, \(D \approx 22\ \%\) et \(t_{r5\%} \approx 0{,}08\ \text{s}\). Commenter, et citer une contrepartie de l'avance de phase.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(|H(j\omega)| = 1\) ⇔ \(\omega^2(1+0{,}0025\,\omega^2) = 10^4\) ⇔ \(0{,}0025\,\omega^4 + \omega^2 - 10^4 = 0\) → \(\omega^2 = \dfrac{-1+\sqrt{101}}{0{,}005} \approx 1810\) → \(\omega_{c0} \approx 42{,}5\ \text{rad/s}\). Phase : \(-90° - \arctan 2{,}13 \approx -154{,}8°\), donc \(M_\varphi \approx 25°\) : trop faible.</p>
    <p><strong>Q2.</strong> \(0{,}05\,\omega_\varphi = 1/\tan 45°\) → \(\omega_\varphi = 20\ \text{rad/s}\) ; \(|H(j20)| = \dfrac{100}{20\sqrt 2} \approx 3{,}54\) → \(K_p \approx 0{,}28\). La coupure tombe à 20 rad/s (plus de deux fois plus lent qu'avant) et \(K_{BO} = 28\ \text{s}^{-1}\) : l'erreur de traînage est multipliée par 3,5. Échec sur deux critères.</p>
    <p><strong>Q3.</strong> \(\arg H(j60) = -90° - \arctan 3 \approx -161{,}6°\) : marge « naturelle » de 18,4° à cette pulsation, il manque \(45° - 18{,}4° = 26{,}6°\). Il faut \(a \geq \dfrac{1+\sin 26{,}6°}{1-\sin 26{,}6°} \approx 2{,}62\) : on prend \(a = 3\) (\(\varphi_m = 30°\)). \(T = \dfrac{1}{60\sqrt3} \approx 9{,}6\ \text{ms}\). \(|H(j60)| = \dfrac{100}{60\sqrt{10}} \approx 0{,}527\) → \(K_p = \dfrac{1}{\sqrt3 \times 0{,}527} \approx 1{,}10\).</p>
    <p><strong>Q4.</strong> \(M_\varphi = 18{,}4° + 30° \approx 48{,}4° \geq 45°\) ; \(K_{BO} = 100K_p \approx 110\ \text{s}^{-1} \geq 100\). Phase de la FTBO corrigée : \(-90° - \arctan(0{,}05\omega) + \varphi_C(\omega)\) avec \(\arctan(0{,}05\omega) \lt 90°\) et \(\varphi_C \gt 0\) : elle reste au-dessus de \(-180°\), \(M_G\) infinie.</p>
    <p><strong>Q5.</strong> Amortissement équivalent (\(M_\varphi\) voisines), mais une réponse près de 4 fois plus rapide et une précision de traînage 4 fois meilleure avec l'avance : elle seule satisfait le cahier des charges. Contreparties : gain haute fréquence \(aK_p \approx 3{,}3\) (bruit de mesure amplifié) et pic de commande \(u(0^+) = aK_p\,\varepsilon_0\), à comparer à la saturation de l'amplificateur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Boucle de vitesse dans une boucle de position</h3>
  <div class="statement">Un axe de robot est entraîné par un moteur dont la vitesse vérifie \(\Omega(p) = \dfrac{K_m\,U(p) - K_r\,C_r(p)}{1+\tau_mp}\), avec \(K_m = 2\ \text{rad·s}^{-1}\text{/V}\), \(\tau_m = 0{,}2\ \text{s}\) ; \(C_r\) est un couple résistant. Une boucle interne de vitesse (correcteur \(K_v\), capteur unitaire) reçoit la consigne \(\Omega_c\) ; une boucle externe de position (\(\theta = \Omega/p\), correcteur \(K_\theta\), capteur unitaire) fournit \(\Omega_c = K_\theta(\theta_c - \theta)\).</div>
  <div class="q"><strong>Q1.</strong> Pour \(C_r = 0\), exprimer la FTBF \(\Omega/\Omega_c\) de la boucle interne sous forme canonique.</div>
  <div class="q"><strong>Q2.</strong> Choisir \(K_v\) pour que la constante de temps interne soit divisée par 10.</div>
  <div class="q"><strong>Q3.</strong> Régler \(K_\theta\) pour \(M_\varphi = 60°\) sur la boucle externe.</div>
  <div class="q"><strong>Q4.</strong> Même question sans boucle interne (\(U = K'_\theta(\theta_c - \theta)\)). Comparer les rapidités.</div>
  <div class="q"><strong>Q5.</strong> \(C_r\) est un échelon d'amplitude \(C_0\). Montrer que l'écart de position permanent vaut \(\dfrac{K_rC_0}{K_mK_vK_\theta}\). Comment l'annuler ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Propriété du 1ᵉʳ ordre bouclé :</p>
    <div class="formula">$$\frac{\Omega}{\Omega_c} = \frac{K_i}{1+\tau_i\,p}$$</div>
    <div class="formula">$$K_i = \frac{K_mK_v}{1+K_mK_v}, \qquad \tau_i = \frac{\tau_m}{1+K_mK_v}$$</div>
    <p><strong>Q2.</strong> \(1 + K_mK_v = 10\) → \(K_v = 4{,}5\ \text{V·s/rad}\). Gain statique interne \(K_i = 0{,}9\), constante de temps \(\tau_i = 0{,}02\ \text{s}\).</p>
    <p><strong>Q3.</strong> FTBO externe : \(\dfrac{0{,}9\,K_\theta}{p(1+0{,}02p)}\). \(0{,}02\,\omega_\varphi = 1/\tan 60°\) → \(\omega_\varphi \approx 28{,}9\ \text{rad/s}\). \(K_\theta = \dfrac{28{,}9\sqrt{1+1/3}}{0{,}9} \approx 37\ \text{s}^{-1}\).</p>
    <p><strong>Q4.</strong> FTBO : \(\dfrac{2K'_\theta}{p(1+0{,}2p)}\) → \(\omega_\varphi \approx 2{,}89\ \text{rad/s}\) et \(K'_\theta \approx 1{,}67\). Même amortissement (\(M_\varphi = 60°\), \(D \approx 9\ \%\)) mais coupure dix fois plus basse : \(t_{r5\%} \approx 3{,}7/\omega_c\) passe de ≈ 0,13 s (cascade) à ≈ 1,3 s. La boucle interne a rendu le moteur « vu de l'extérieur » dix fois plus rapide.</p>
    <p><strong>Q5.</strong> En régime permanent la position est constante, donc \(\Omega = 0\). La relation du moteur donne alors \(K_mU = K_rC_0\), avec \(U = K_v(\Omega_c - 0) = K_vK_\theta(\theta_c - \theta)\). D'où \(\theta_c - \theta = \dfrac{K_rC_0}{K_mK_vK_\theta}\) : non nul car aucun intégrateur ne se trouve en amont du point d'entrée de \(C_r\) (l'intégration \(\theta = \Omega/p\) est en aval). Remède : un PI dans la boucle de vitesse, qui place un intégrateur avant la perturbation. Avec les réglages précédents, cet écart vaut \(\dfrac{K_rC_0}{K_m \times 167}\) en cascade (\(K_vK_\theta \approx 167\ \text{V/rad}\)), contre \(\dfrac{K_rC_0}{K_m \times 1{,}67}\) en correction directe : cent fois moins.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Table tournante : peut-on réduire le modèle aux pôles dominants ?</h3>
  <div class="statement">Après réglage de son correcteur, l'asservissement en position d'une table tournante a pour fonction de transfert en boucle fermée (temps en secondes)
    <div class="formula">$$H_{BF}(p) = \frac{1200}{(p+30)(p^2+6p+40)}$$</div>
    On donne, pour un 2ᵉ ordre de gain statique 1 : \(D = e^{-\pi\xi/\sqrt{1-\xi^2}}\) et, lu sur l'abaque du temps de réponse, \(t_{r5\%}\,\omega_0 \approx 5{,}3\) pour \(\xi \approx 0{,}47\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les pôles et le gain statique de \(H_{BF}\).</div>
  <div class="q"><strong>Q2.</strong> Justifier la réduction du modèle aux pôles dominants et écrire le modèle réduit \(H_r(p)\), avec le même gain statique. Calculer \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q3.</strong> Prévoir le dépassement et le temps de réponse à 5 % avec \(H_r\). La simulation du modèle complet donne \(D \approx 18{,}0\ \%\) et \(t_{r5\%} \approx 0{,}87\ \text{s}\). Conclure.</div>
  <div class="q"><strong>Q4.</strong> Un filtre de mesure plus lourd déplace le troisième pôle en \(-6\) (numérateur 240, pour garder le gain statique). La simulation donne alors \(D \approx 8{,}8\ \%\) et \(t_{r5\%} \approx 0{,}95\ \text{s}\). Le modèle réduit de Q2 est-il encore acceptable ?</div>
  <div class="q"><strong>Q5.</strong> On revient au pôle en \(-30\), mais le correcteur ajoute un zéro : le numérateur devient \(1200\,(1 + p/4)\). La simulation donne \(D \approx 54\ \%\). Quel modèle réduit faut-il écrire ? (Sa simulation donne \(D \approx 55\ \%\).)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le trinôme \(p^2+6p+40\) a pour discriminant \(36 - 160 = -124\) : pôles \(-3 \pm j\sqrt{31} \approx -3 \pm 5{,}57j\), auxquels s'ajoute le pôle réel \(-30\). Gain statique : \(H_{BF}(0) = \dfrac{1200}{30 \times 40} = 1\) (écart statique nul).</p>
    <p><strong>Q2.</strong> Les pôles dominants sont \(-3 \pm 5{,}57j\) (partie réelle la plus proche de zéro). Rapport des parties réelles : \(30/3 = 10\), au-delà du seuil de 5 et même du seuil prudent de 10 ; aucun zéro ne perturbe. On écrit \(p + 30 = 30\,(1 + p/30)\) et l'on remplace le facteur canonique \((1 + p/30)\) par 1, ce qui conserve \(H(0)\) :</p>
    <div class="formula">$$H_r(p) = \frac{40}{p^2+6p+40}$$</div>
    <p>Par identification avec \(\dfrac{1}{1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}}\) : \(\omega_0 = \sqrt{40} \approx 6{,}32\ \text{rad/s}\) et \(2\xi\omega_0 = 6\), soit \(\xi = 3/\sqrt{40} \approx 0{,}47\).</p>
    <p><strong>Q3.</strong> \(D = e^{-\pi \times 0{,}474/\sqrt{1 - 0{,}225}} \approx 18{,}4\ \%\) et \(t_{r5\%} \approx 5{,}3/6{,}32 \approx 0{,}84\ \text{s}\). Écarts avec le modèle complet : 0,4 point sur le dépassement et 4 % sur le temps de réponse. Le pôle rapide se contente de retarder très légèrement le début de la réponse : le modèle réduit suffit pour régler ou vérifier les performances temporelles.</p>
    <p><strong>Q4.</strong> Le rapport des parties réelles tombe à \(6/3 = 2\), bien sous 5 : le troisième pôle n'est plus négligeable. Le modèle réduit prévoirait toujours 18 % de dépassement, plus du double des 8,8 % du modèle complet, et un temps de réponse trop court (0,84 s au lieu de 0,95 s). La réduction n'est plus légitime : on garde le modèle d'ordre 3.</p>
    <p><strong>Q5.</strong> Le zéro en \(-4\) est voisin des pôles dominants (partie réelle \(-3\), module 6,3) : il modifie fortement la réponse sans déplacer les pôles, et le modèle réduit doit le garder. On néglige seulement le pôle en \(-30\) :</p>
    <div class="formula">$$H_r(p) = \frac{40\,(1 + p/4)}{p^2+6p+40}$$</div>
    <p>Il prévoit 55 % de dépassement pour 54 % sur le modèle complet, alors que le modèle de Q2, sans le zéro, annoncerait 18 % : une erreur grossière. La règle du rapport des pôles ne suffit donc pas : il faut toujours regarder aussi les zéros.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Nacelle gyrostabilisée d'une caméra embarquée</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>réglage des correcteurs</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    L'axe de tangage d'une nacelle de caméra embarquée sur un drone est asservi en position angulaire. Le capteur et l'adaptateur ont le même gain (1 V/rad) ; la FTBO non corrigée, capteur compris, est
    <div class="formula">$$H(p) = \frac{20}{p\,(1+0{,}1p)(1+0{,}01p)}$$</div>
    Le correcteur \(C(p)\) délivre une tension de commande \(u\), limitée à \(\pm 10\ \text{V}\). Extrait du cahier des charges :
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
      <tr style="background:var(--paper-dark)"><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Critère</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Niveau</th></tr>
      <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Stabilité</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(M_\varphi \geq 45°\), \(M_G \geq 10\ \text{dB}\)</td></tr>
      <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Rapidité</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(t_{r5\%} \leq 0{,}2\ \text{s}\)</td></tr>
      <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Amortissement</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Dépassement ≤ 25 %</td></tr>
      <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Précision</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Écart statique nul pour un échelon de consigne</td></tr>
      <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Commande</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(|u(t)| \leq 10\ \text{V}\) pour un échelon de consigne de 1 rad</td></tr>
    </table></div>
  </div>

  <p class="exo-part">Partie A — Analyse du système non corrigé (\(C = 1\))</p>
  <div class="q"><strong>A1.</strong> Le critère de précision est-il satisfait ? Le restera-t-il avec un correcteur P ou à avance de phase ?</div>
  <div class="q"><strong>A2.</strong> Décrire le diagramme asymptotique de gain de \(H\) (pentes, niveau à 10 rad/s) et en déduire une estimation asymptotique de \(\omega_{c0}\).</div>
  <div class="q"><strong>A3.</strong> Calculer \(\omega_\pi\) et la marge de gain. Sachant que la coupure réelle est à 12,4 rad/s, calculer \(M_\varphi\).</div>
  <div class="q"><strong>A4.</strong> D'après les ordres de grandeur du cours, quelle pulsation de coupure minimale faut-il viser pour \(t_{r5\%} \leq 0{,}2\ \text{s}\) avec \(M_\varphi \approx 50°\) ?</div>

  <p class="exo-part">Partie B — Correction proportionnelle</p>
  <div class="q"><strong>B1.</strong> Montrer que la pulsation où la phase de \(H\) vaut \(-135°\) vérifie \(0{,}001\,\omega^2 + 0{,}11\,\omega - 1 = 0\) ; la calculer et en déduire \(K_p\) pour \(M_\varphi = 45°\).</div>
  <div class="q"><strong>B2.</strong> La simulation donne alors \(t_{r5\%} \approx 0{,}71\ \text{s}\). Conclure.</div>

  <p class="exo-part">Partie C — Correction à avance de phase</p>
  <div class="q"><strong>C1.</strong> On vise \(\omega_c = 25\ \text{rad/s}\). Calculer la phase de \(H\) à cette pulsation et l'avance nécessaire pour \(M_\varphi = 45°\).</div>
  <div class="q"><strong>C2.</strong> Choisir \(a\) entier, puis calculer \(T\) et \(K_p\) (\(|H(j25)| \approx 0{,}288\)).</div>
  <div class="q"><strong>C3.</strong> En déduire \(M_\varphi\). On admet que la phase de la FTBO corrigée atteint \(-180°\) à 73,5 rad/s, où \(|H| \approx 0{,}0295\). Calculer \(M_G\).</div>

  <p class="exo-part">Partie D — Validation</p>
  <div class="q"><strong>D1.</strong> La simulation du système corrigé donne \(D \approx 19\ \%\) et \(t_{r5\%} \approx 0{,}16\ \text{s}\). Calculer \(u(0^+)\) pour un échelon de 1 rad et dresser le bilan du cahier des charges.</div>
  <div class="q"><strong>D2.</strong> Un collègue propose de viser \(\omega_c = 30\ \text{rad/s}\) avec \(a = 7\) (\(K_p \approx 1{,}87\)) pour gagner en rapidité. Qu'en penser ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> La FTBO contient un intégrateur (classe 1) : écart statique nul pour un échelon. Un correcteur P ou à avance de phase ne change pas la classe (pas de zéro à l'origine) : le critère reste satisfait.</p>
    <p><strong>A2.</strong> Pente \(-20\ \text{dB/déc}\) (asymptote \(20/\omega\)) jusqu'à 10 rad/s, où le niveau vaut \(20\log 2 \approx 6\ \text{dB}\) ; puis \(-40\ \text{dB/déc}\) jusqu'à 100 rad/s ; puis \(-60\ \text{dB/déc}\). Sur le tronçon à −40 : \(\dfrac{20}{\omega}\cdot\dfrac{10}{\omega} = 1\) → \(\omega_{c0} \approx \sqrt{200} \approx 14\ \text{rad/s}\) (asymptotique).</p>
    <p><strong>A3.</strong> On développe le dénominateur :</p>
    <div class="formula">$$p(1+0{,}1p)(1+0{,}01p) = p + 0{,}11p^2 + 0{,}001p^3$$</div>
    <p>En \(j\omega\) : \(-0{,}11\,\omega^2 + j\omega(1 - 0{,}001\,\omega^2)\). Partie imaginaire nulle : \(\omega_\pi = \sqrt{1000} \approx 31{,}6\ \text{rad/s}\), où le dénominateur vaut \(-110\) : \(|H(j\omega_\pi)| = 20/110 \approx 0{,}18\), \(M_G = 20\log 5{,}5 \approx 14{,}8\ \text{dB}\). À 12,4 rad/s : \(\arctan 1{,}24 \approx 51{,}1°\) et \(\arctan 0{,}124 \approx 7{,}1°\), donc \(\varphi \approx -148{,}2°\) et \(M_\varphi \approx 32°\) (insuffisante).</p>
    <p><strong>A4.</strong> Pour \(M_\varphi \approx 50°\), \(t_{r5\%}\,\omega_c \approx 4\) : il faut \(\omega_c \geq 4/0{,}2 = 20\ \text{rad/s}\). On visera 25 rad/s pour garder de la marge.</p>
    <p><strong>B1.</strong> \(\arctan(0{,}1\omega) + \arctan(0{,}01\omega) = 45°\) ; en prenant la tangente : \(\dfrac{0{,}11\,\omega}{1 - 0{,}001\,\omega^2} = 1\), d'où l'équation. Racine positive :</p>
    <div class="formula">$$\omega_\varphi = \frac{-0{,}11 + \sqrt{0{,}0121 + 0{,}004}}{0{,}002} \approx 8{,}44\ \text{rad/s}$$</div>
    <p>Puis \(|H(j8{,}44)| = \dfrac{20}{8{,}44 \times 1{,}309 \times 1{,}004} \approx 1{,}80\) → \(K_p \approx 0{,}55\).</p>
    <p><strong>B2.</strong> Coupure à 8,4 rad/s, bien en dessous des 20 rad/s requis : \(t_{r5\%} \approx 0{,}71\ \text{s} \gt 0{,}2\ \text{s}\). Le correcteur P assure la stabilité mais en ralentissant le système : il faut relever la phase autour de la coupure → avance de phase.</p>
    <p><strong>C1.</strong> \(\arctan 2{,}5 \approx 68{,}2°\) et \(\arctan 0{,}25 \approx 14{,}0°\), donc \(\arg H(j25) \approx -172{,}2°\). Marge « naturelle » 7,8° ; avance nécessaire \(\varphi_m = 45° - 7{,}8° \approx 37{,}2°\).</p>
    <p><strong>C2.</strong> \(a \geq \dfrac{1+\sin 37{,}2°}{1-\sin 37{,}2°} \approx 4{,}06\) : \(a = 4\) ne donnerait que \(\varphi_m \approx 36{,}9°\), soit \(M_\varphi \approx 44{,}6° \lt 45°\). On prend donc \(a = 5\) (arrondi par excès, \(\varphi_m \approx 41{,}8°\)), ce qui laisse en plus quelques degrés de réserve. \(T = \dfrac{1}{25\sqrt5} \approx 17{,}9\ \text{ms}\) (cassures à 11,2 et 55,9 rad/s). \(K_p = \dfrac{1}{\sqrt5 \times 0{,}288} \approx 1{,}55\).</p>
    <p><strong>C3.</strong> \(M_\varphi = 7{,}8° + 41{,}8° \approx 49{,}6°\). À 73,5 rad/s, \(aT\omega \approx 6{,}58\) et \(T\omega \approx 1{,}32\) :</p>
    <div class="formula">$$|C| = 1{,}55\sqrt{\frac{1+6{,}58^2}{1+1{,}32^2}} \approx 6{,}24$$</div>
    <p>\(|C\,H| \approx 6{,}24 \times 0{,}0295 \approx 0{,}184\) → \(M_G \approx 14{,}7\ \text{dB}\). L'avance a fait passer \(\omega_\pi\) de 31,6 à 73,5 rad/s ; la marge de gain reste confortable.</p>
    <p><strong>D1.</strong> \(u(0^+) = aK_p \times 1 \approx 7{,}8\ \text{V} \leq 10\ \text{V}\). Bilan : précision (classe 1) ✓ ; \(M_\varphi \approx 50° \geq 45°\) ✓ ; \(M_G \approx 14{,}7\ \text{dB} \geq 10\) ✓ ; \(D \approx 19\ \% \leq 25\ \%\) ✓ ; \(t_{r5\%} \approx 0{,}16\ \text{s} \leq 0{,}2\) ✓ ; commande ✓. Le cahier des charges est validé.</p>
    <p><strong>D2.</strong> Calcul analogue : à 30 rad/s la phase de \(H\) vaut ≈ −178°, il manque ≈ 43° (\(a \geq 5{,}4\)) et \(a = 7\) garde une réserve. Mais \(u(0^+) = 7 \times 1{,}87 \approx 13{,}1\ \text{V} \gt 10\ \text{V}\) (et même \(a = 6\), avec \(K_p \approx 2{,}02\), donnerait ≈ 12,1 V) : l'amplificateur sature, le modèle linéaire n'est plus valable (réponse réelle plus lente et plus oscillante que prévu). De plus le gain haute fréquence \(aK_p\) passe de 7,8 à 13,1 : bruit de mesure davantage amplifié. Gagner quelques centièmes de seconde ne justifie pas ces risques : on conserve le réglage à 25 rad/s.</p>
  </div>
</div>
