<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Compétences B2 « Simplifier un modèle » (S3), C1 « Proposer une démarche de réglage d'un correcteur » (S3), C2 « Mettre en œuvre une démarche de réglage d'un correcteur » (S4), F2 « Modifier la commande » (S4) et B2 « Modéliser la commande d'un ensemble asservi » (S4). Le chapitre s'appuie sur les chapitres d'automatique de 1ʳᵉ année (schémas-blocs, réponses temporelles, Bode, stabilité, précision), dont les critères du cahier des charges sont des rappels de S2. Les machines commandées au §7 sont étudiées dans « Machines synchrone et asynchrone » ; la version numérique des correcteurs, dans « Systèmes numériques » (§8).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Critères du cahier des charges</strong> (rappel S2) : stabilité (marges, amortissement, dépassement), précision (écart statique, erreur de traînage), rapidité (temps de réponse à 5 %, bande passante) ; leur lecture sur la FTBO (§1).</li>
        <li><strong>Simplifier un modèle</strong> (S3) : pôles dominants et réduction de l'ordre du modèle — principe, justification, limites (§1).</li>
        <li><strong>Effets des actions</strong> proportionnelle, intégrale et dérivée sur la précision, la rapidité et la stabilité (§2).</li>
        <li><strong>Proposer puis mettre en œuvre une démarche de réglage</strong> (S3, S4) : réglage de marges, d'amortissement, de rapidité et de bande passante, compensation de pôles, pour les correcteurs proportionnel (§3), proportionnel intégral (§4) et à avance de phase (§5).</li>
        <li><strong>Choix et paramètres d'un correcteur</strong> (S4) : vérifier un réglage sur la réponse temporelle, choisir le correcteur adapté au défaut constaté (§6, synthèse au §8).</li>
        <li><strong>Commande d'une machine en couple et en vitesse</strong> (S4) : boucles imbriquées de courant, de vitesse et de position, réglées de l'intérieur vers l'extérieur (§7).</li>
      </ul>
      <p>Hors programme (regroupé en fin de chapitre) : anticipation de consigne et compensation de perturbation, correcteur PID sous forme parallèle, réglage empirique de Ziegler et Nichols. Les critères de Routh et de Nyquist et les diagrammes de Black-Nichols et de Nyquist ne sont pas au programme.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · DU CAHIER DES CHARGES À LA FTBO</div>
  <h2>Traduire les exigences sur la boucle ouverte</h2>
  <div class="intro">Corriger un asservissement, c'est insérer dans la chaîne directe un correcteur \(C(p)\) et choisir ses quelques paramètres pour que le système bouclé respecte <em>en même temps</em> des exigences de stabilité, d'amortissement, de rapidité et de précision. Tout le réglage se fait sur la <strong>fonction de transfert en boucle ouverte</strong> (FTBO) : chaque bloc en série y ajoute simplement son gain en décibels et sa phase.</div>

  <h3>Structure étudiée</h3>

  <div class="def-box">
    <strong>Notations.</strong> Avec un retour unitaire (capteur et adaptateur de même gain, ramenés dans \(H\)) :
    <div class="formula">$$H_{BO}(p) = C(p)\,H(p)$$</div>
    <div class="formula">$$H_{BF}(p) = \frac{H_{BO}(p)}{1+H_{BO}(p)}$$</div>
    On écrit la FTBO sous forme canonique, avec sa <strong>classe</strong> \(\alpha\) (nombre d'intégrateurs) et son <strong>gain</strong> \(K_{BO}\) :
    <div class="formula">$$H_{BO}(p) = \frac{K_{BO}}{p^{\alpha}}\cdot\frac{1+b_1p+\cdots}{1+a_1p+\cdots}$$</div>
    \(\omega_{c0}\) désigne la pulsation de coupure à 0 dB de la FTBO (\(|H_{BO}(j\omega_{c0})| = 1\)) ; \(\omega_\pi\) celle où sa phase vaut \(-180°\).
  </div>

  <h3>Où lire chaque exigence sur le Bode de la FTBO</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Exigence</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Critère du cahier des charges</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Lecture sur la FTBO</th></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>Stabilité</strong></td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Marges : typiquement \(M_\varphi \geq 45°\), \(M_G \geq 6\) à \(10\ \text{dB}\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Phase à \(\omega_{c0}\), gain à \(\omega_\pi\)</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>Amortissement</strong></td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Dépassement \(D\%\) maximal</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Marge de phase : \(M_\varphi\) plus grande → dépassement plus faible</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>Rapidité</strong></td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Temps de réponse \(t_{r5\%}\) maximal</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Pulsation \(\omega_{c0}\) : \(t_{r5\%}\) varie comme \(1/\omega_{c0}\)</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>Précision</strong></td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Écart statique \(\varepsilon_s\), erreur de traînage \(\varepsilon_v\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Basses pulsations : classe \(\alpha\) et gain \(K_{BO}\)</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>Bruit, effort</strong></td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Commande non saturée, peu sensible au bruit de mesure</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Hautes pulsations : gain du correcteur faible</td></tr>
  </table></div>

  <div class="prop-box">
    <strong>Ordres de grandeur (à connaître).</strong> Pour une FTBO du type \(\dfrac{K}{p(1+\tau p)}\), la boucle fermée est un 2ᵉ ordre et les correspondances sont exactes ; pour une FTBO plus complexe (pôles dominants), ce ne sont que des repères.
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0;text-align:center">
      <tr style="background:var(--paper-dark)"><th style="padding:.3rem;border:1px solid var(--grid)">\(M_\varphi\)</th><th style="padding:.3rem;border:1px solid var(--grid)">\(\xi\) de la BF</th><th style="padding:.3rem;border:1px solid var(--grid)">Dépassement</th><th style="padding:.3rem;border:1px solid var(--grid)">\(t_{r5\%}\cdot\omega_{c0}\)</th></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">45°</td><td style="border:1px solid var(--grid)">0,42</td><td style="border:1px solid var(--grid)">≈ 23 %</td><td style="border:1px solid var(--grid)">≈ 6</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">50°</td><td style="border:1px solid var(--grid)">0,48</td><td style="border:1px solid var(--grid)">≈ 18 %</td><td style="border:1px solid var(--grid)">≈ 4</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">60°</td><td style="border:1px solid var(--grid)">0,61</td><td style="border:1px solid var(--grid)">≈ 9 %</td><td style="border:1px solid var(--grid)">≈ 3,7</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">70°</td><td style="border:1px solid var(--grid)">0,80</td><td style="border:1px solid var(--grid)">≈ 1,5 %</td><td style="border:1px solid var(--grid)">≈ 2</td></tr>
    </table></div>
    Retenir : \(\xi \approx M_\varphi(°)/100\) et, pour un système bien amorti,
    <div class="formula">$$t_{r5\%} \approx \frac{3}{\omega_{c0}} \quad\text{(à un facteur 2 près)}$$</div>
    et la bande passante à −3 dB de la boucle fermée est du même ordre que \(\omega_{c0}\).
  </div>

  <div class="notice"><strong>Lecture en trois zones.</strong> Basses pulsations (\(\omega \ll \omega_{c0}\)) : précision et rejet des perturbations lentes, on veut un gain élevé. Voisinage de \(\omega_{c0}\) : stabilité, amortissement et rapidité, on veut une pente d'environ \(-20\ \text{dB/déc}\) au passage de 0 dB et une phase éloignée de \(-180°\). Hautes pulsations : bruit de mesure, on veut un gain faible. Un correcteur « sculpte » la FTBO zone par zone.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Cahier des charges : dépassement ≤ 10 %, \(t_{r5\%} \leq 0{,}2\ \text{s}\). Quelles valeurs viser pour \(M_\varphi\) et \(\omega_{c0}\) ?</span>
    <div class="content"><p>D ≤ 10 % → \(M_\varphi \approx 60°\). Avec \(t_{r5\%}\,\omega_{c0} \approx 3{,}7\) : \(\omega_{c0} \geq 3{,}7/0{,}2 \approx 19\ \text{rad/s}\). On vise \(M_\varphi = 60°\) à \(\omega_{c0} \approx 20\ \text{rad/s}\), puis on vérifie par simulation.</p></div>
  </div>

  <h3>Réduire l'ordre du modèle avant de régler : pôles dominants</h3>
  <p>Les correspondances du tableau ci-dessus sont exactes pour un 2ᵉ ordre. Un processus réel en compte souvent davantage : constante de temps électrique d'un moteur, filtre d'un capteur, souplesse d'une transmission. Avant de régler, on simplifie donc le modèle pour ne garder que ce qui gouverne vraiment la réponse.</p>
  <div class="def-box">
    <strong>Pôles dominants.</strong> Les pôles d'une fonction de transfert stable ont une partie réelle négative ; chacun engendre dans la réponse un mode qui décroît comme \(e^{\mathrm{Re}(p_i)\,t}\). Les pôles <strong>dominants</strong> sont ceux dont la partie réelle est la plus proche de zéro : leurs modes s'éteignent le plus lentement et fixent la durée du régime transitoire.<br>
    <strong>Réduire l'ordre</strong> du modèle, c'est supprimer les autres pôles en <strong>conservant le gain statique</strong> : le facteur canonique d'un pôle rapide, \((1+\tau_r p)\) ou \(\left(1+\frac{2\xi_r}{\omega_r}p+\frac{p^2}{\omega_r^2}\right)\), est remplacé par 1.
  </div>
  <div class="prop-box">
    <strong>Règle pratique.</strong> On néglige un pôle (ou une paire de pôles) dont la partie réelle est, en valeur absolue, au moins <strong>5 fois</strong> (par prudence 10 fois) plus grande que celle des pôles dominants, à condition qu'aucun zéro ne soit voisin des pôles dominants. Le modèle réduit a le même gain statique : valeur finale et écart statique sont exacts, seul le régime transitoire est approché.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Pourquoi le mode d'un pôle rapide ne pèse presque rien dans la réponse indicielle.</span>
    <div class="content">
      <p>Pour une fonction de transfert stable à pôles simples \(p_i\), de gain statique \(K\), la décomposition en éléments simples de \(S(p) = H(p)\,E_0/p\) donne une réponse indicielle de la forme</p>
      <div class="formula" data-nom="Réponse indicielle par modes">$$s(t) = K E_0\Big(1 + \sum_i A_i\,e^{p_i t}\Big)$$</div>
      <p>Le terme d'un pôle rapide \(p_r\) est négligeable pour deux raisons.</p>
      <ul>
        <li><strong>Il s'éteint vite.</strong> Sa constante de temps \(1/|\mathrm{Re}\,p_r|\) est au moins 5 fois plus courte que celle du mode dominant : à l'instant \(t = 1/|\mathrm{Re}\,p_d|\), où le mode dominant garde encore 37 % de son amplitude, le mode rapide n'en garde plus que \(e^{-5} \approx 0{,}7\ \%\).</li>
        <li><strong>Son amplitude est faible.</strong> Pour \(\dfrac{K}{(1+\tau_1p)(1+\tau_2p)}\) avec \(\tau_1 \gt \tau_2\), on trouve \(A_1 = -\dfrac{\tau_1}{\tau_1-\tau_2}\) et \(A_2 = \dfrac{\tau_2}{\tau_1-\tau_2}\), d'où \(|A_2/A_1| = \tau_2/\tau_1\) : le mode rapide ne pèse que 20 % du mode lent au départ si \(\tau_1 = 5\tau_2\), 10 % si \(\tau_1 = 10\tau_2\).</li>
      </ul>
      <p>Enfin, remplacer \((1+\tau_r p)\) par 1 ne change pas \(H(0)\) : le gain statique est conservé. Vu en fréquentiel, le facteur \(\dfrac{1}{1+\tau_r p}\) vaut presque 1 (0 dB, phase faible) tant que \(\omega \ll 1/\tau_r\), donc dans toute la bande utile du système.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — axe de robot asservi en position</strong>
    <p>Après correction, la FTBF d'un axe a pour pôles \(-2 \pm 3j\) et \(-15\) (en s⁻¹), et un gain statique de 1 :</p>
    <div class="formula">$$H_{BF}(p) = \frac{195}{(p+15)(p^2+4p+13)}$$</div>
    <ol>
      <li>Rapport des parties réelles : \(15/2 = 7{,}5 \geq 5\), le pôle en \(-15\) est négligeable. En divisant par 15 pour garder la valeur en \(p = 0\), le modèle réduit est</li>
    </ol>
    <div class="formula">$$H_r(p) = \frac{13}{p^2+4p+13}$$
$$\omega_0 = \sqrt{13} \approx 3{,}61\ \text{rad/s}, \qquad \xi = \frac{2}{\sqrt{13}} \approx 0{,}55$$</div>
    <ol start="2">
      <li>Prévisions du modèle réduit : dépassement \(e^{-\pi\xi/\sqrt{1-\xi^2}} \approx 12{,}3\ \%\), temps de réponse \(t_{r5\%} \approx 1{,}47\ \text{s}\).</li>
      <li>Modèle complet (simulation) : dépassement \(\approx 11{,}9\ \%\), \(t_{r5\%} \approx 1{,}54\ \text{s}\). Écarts de 0,4 point et de 5 % : le réglage peut se mener sur le modèle réduit.</li>
      <li>Si le troisième pôle était en \(-4\) (rapport 2 seulement), le modèle complet donnerait un dépassement de \(6{,}7\ \%\) et \(t_{r5\%} \approx 1{,}62\ \text{s}\) : le modèle réduit surestimerait le dépassement de près du double. La réduction n'est plus légitime.</li>
    </ol>
  </div>

  <div class="notice"><strong>Limites de la réduction.</strong>
    <ul style="margin:.3rem 0">
      <li><strong>Zéro voisin des pôles dominants</strong> : il modifie fortement la réponse sans déplacer les pôles. Dans l'exemple, un zéro en \(-2{,}5\) (numérateur \(195\,(1+p/2{,}5)\)) fait passer le dépassement de 12 % à 37 % : le modèle réduit doit garder ce zéro, sinon il est faux.</li>
      <li><strong>Dipôle pôle-zéro</strong> : un pôle presque compensé par un zéro voisin a un mode de faible amplitude, mais lent ; il laisse une « traîne » qui allonge le temps de réponse. C'est ce qui arrive quand la compensation d'un PI (§4) est imparfaite. Un PI de constante \(T_i = 0{,}5\ \text{s}\), réglé pour compenser la constante de temps de 0,5 s d'un processus du 1ᵉʳ ordre (gain de boucle \(K_pK = 4{,}7\)), donne un temps de réponse de 0,32 s si la compensation est exacte. Si la constante de temps ne vaut en réalité que 0,25 s, un pôle de la boucle fermée se place en \(-1{,}8\ \text{s}^{-1}\), tout près du zéro du PI en \(-2\ \text{s}^{-1}\), et le temps de réponse passe à 0,47 s.</li>
      <li><strong>Paire complexe peu amortie</strong> : c'est sa partie réelle \(\xi_r\omega_r\) qui compte, pas \(\omega_r\). Un mode de flexion à pulsation élevée mais très peu amorti (\(\xi_r \approx 0{,}05\)) s'éteint lentement, et sa résonance peut faire repasser le gain de la FTBO au-dessus de 0 dB : on ne le néglige pas.</li>
      <li><strong>Début de la réponse</strong> : le modèle réduit ignore le léger retard initial dû aux pôles rapides ; il prévoit bien la valeur finale et le temps de réponse, moins bien la pente à l'origine, le temps de montée et, si le rapport des parties réelles est faible, le dépassement.</li>
      <li><strong>Calcul des marges</strong> : en fréquentiel, un pôle rapide n'est négligeable que bien au-delà de \(\omega_{c0}\). Un pôle seulement 5 fois plus rapide que la coupure y retire encore \(\arctan(1/5) \approx 11°\) de phase : on le garde pour calculer la marge de phase, même si on le néglige pour estimer la réponse temporelle.</li>
    </ul>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ACTIONS P, I ET D</div>
  <h2>Effets des trois actions élémentaires</h2>
  <div class="intro">Les structures des correcteurs P, PI et PID sont présentées dans le chapitre de première année « Performances : précision et rapidité ». On résume ici l'effet de chaque action, en temporel comme en fréquentiel : c'est ce qui guide le choix d'un correcteur.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Action</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Signature sur le Bode</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Précision</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Rapidité</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Stabilité</th></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>P</strong> : \(K_p\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Gain translaté de \(20\log K_p\), phase inchangée</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Meilleure si \(K_p\) ↑ (classe 0 : \(\varepsilon_s\) diminue sans s'annuler)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">↑ (\(\omega_{c0}\) augmente)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">↓ (marges réduites)</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>I</strong> : \(\dfrac{1}{T_ip}\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(-20\ \text{dB/déc}\), phase \(-90°\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Classe +1 : écart statique annulé</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">↓ (retard de phase)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">↓</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)"><strong>D</strong> : \(T_dp\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(+20\ \text{dB/déc}\), phase \(+90°\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Seule, classe −1 (dégradée)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">↑</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">↑ (avance de phase), mais bruit amplifié</td></tr>
  </table></div>
  <h3>Sur la réponse indicielle</h3>
  <ul>
    <li><strong>P plus fort</strong> : montée plus raide, oscillations plus marquées, valeur finale plus proche de la consigne (classe 0) ; au-delà du gain limite, divergence.</li>
    <li><strong>Ajout de I</strong> : la sortie rejoint exactement la consigne, mais le dépassement augmente et la convergence finale peut être lente.</li>
    <li><strong>Ajout de D</strong> : réponse plus amortie et plus vive ; commande très « nerveuse » au démarrage.</li>
  </ul>
  <div class="prop-box"><strong>Idée directrice.</strong> On ne veut chaque action que là où elle sert : l'intégration seulement en <em>basses</em> pulsations (correcteur PI, cassure placée sous \(\omega_{c0}\)) ; l'action dérivée seulement <em>autour</em> de \(\omega_{c0}\) (correcteur à avance de phase = dérivée filtrée).</div>
  <div class="notice"><strong>Dérivée pure irréalisable.</strong> Un terme \(T_dp\) seul a un gain qui croît sans limite : il amplifie le bruit de mesure et sature la commande à chaque échelon. On le filtre toujours par un pôle, ce qui conduit à l'avance de phase (§5).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CORRECTEUR PROPORTIONNEL</div>
  <h2>Régler \(K_p\) pour une marge imposée</h2>
  <div class="intro">Avec \(C(p) = K_p\), la FTBO vaut \(K_p\,H(p)\). Multiplier par \(K_p\) translate la courbe de gain de \(20\log K_p\) <strong>sans modifier la phase</strong> : la phase de \(H\) impose donc où l'on peut couper, et \(K_p\) sert à placer la coupure à cet endroit.</div>

  <h3>Marge de phase imposée</h3>
  <div class="prop-box">
    <ol style="margin:.2rem 0 .2rem 1.1rem">
      <li>Chercher la pulsation \(\omega_\varphi\) où la phase de \(H\) vaut \(-180° + M_\varphi\) (lecture du Bode ou résolution de l'équation de phase).</li>
      <li>Imposer que la FTBO y coupe 0 dB :</li>
    </ol>
    <div class="formula">$$\arg H(j\omega_\varphi) = -180° + M_\varphi$$</div>
    <div class="formula">$$K_p = \frac{1}{|H(j\omega_\varphi)|}$$</div>
    soit, en décibels, \(20\log K_p = -G_{dB,H}(\omega_\varphi)\).
    Exemple classique : pour \(H(p) = \dfrac{K}{p(1+\tau p)}\), \(-90° - \arctan(\tau\omega_\varphi) = -180° + M_\varphi\) donne directement
    <div class="formula">$$\tau\,\omega_\varphi = \frac{1}{\tan M_\varphi}$$</div>
  </div>

  <h3>Marge de gain imposée</h3>
  <div class="prop-box">
    \(\omega_\pi\) ne dépend pas de \(K_p\) (la phase ne bouge pas). Le gain limite de stabilité et le gain donnant une marge \(M_G\) sont :
    <div class="formula">$$K_{lim} = \frac{1}{|H(j\omega_\pi)|}$$</div>
    <div class="formula">$$20\log K_p = -M_G - G_{dB,H}(\omega_\pi)$$</div>
    Si les deux marges sont imposées, on retient la <strong>plus petite</strong> des deux valeurs de \(K_p\), puis on vérifie l'autre marge.
  </div>

  <h3>Limites du correcteur P</h3>
  <div class="notice">Choisir \(K_p\), c'est choisir le seul point de coupure : marges, rapidité et précision en découlent ensemble, sans réglage séparé possible. En classe 0, \(\varepsilon_s = \dfrac{E_0}{1+K_pK}\) réclame un \(K_p\) grand, alors que les marges plafonnent \(K_p\) : si les deux contraintes sont incompatibles, il faut un PI. Et lorsque la marge exigée conduit à un gain inférieur à 1, la coupure recule et la réponse s'alourdit : il vaut mieux relever la phase (avance de phase) que baisser le gain.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">\(H(p) = \dfrac{5}{p(1+0{,}1p)}\). Quel \(K_p\) donne \(M_\varphi = 45°\) ?</span>
    <div class="content"><p>\(0{,}1\,\omega_\varphi = 1/\tan 45° = 1\) → \(\omega_\varphi = 10\ \text{rad/s}\). \(|H(j10)| = \dfrac{5}{10\sqrt{2}} \approx 0{,}354\) → \(K_p = 2\sqrt{2} \approx 2{,}83\). La phase n'atteint jamais \(-180°\) : \(M_G\) infinie.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CORRECTEUR PROPORTIONNEL INTÉGRAL</div>
  <h2>Annuler l'écart statique sans ruiner les marges</h2>
  <div class="def-box">
    <strong>Correcteur PI.</strong> La commande est la somme d'un terme proportionnel à l'écart et d'un terme proportionnel à son intégrale :
    <div class="formula">$$u(t) = K_p\left(\varepsilon(t) + \frac{1}{T_i}\int_0^t \varepsilon(\theta)\,\mathrm{d}\theta\right)$$</div>
    <div class="formula">$$C(p) = K_p\left(1+\frac{1}{T_ip}\right)$$</div>
    <div class="formula">$$C(p) = K_p\,\frac{1+T_ip}{T_ip}$$</div>
    \(T_i\) est la constante de temps d'intégration. Variante équivalente : \(C(p) = K_p + \dfrac{K_i}{p}\), avec \(K_i = K_p/T_i\).
  </div>

  <h3>Effets</h3>
  <ul>
    <li><strong>Régime permanent</strong> : la classe de la FTBO augmente de 1 → écart statique nul en réponse à un échelon de consigne (et à un échelon de perturbation entrant en aval du correcteur).</li>
    <li><strong>Régime transitoire</strong> : retard de phase en basses pulsations → marges réduites si la cassure est trop proche de \(\omega_{c0}\) ; convergence finale souvent lente (« traîne »).</li>
  </ul>

  <h3>Réglage : deux stratégies, toujours \(T_i\) d'abord, \(K_p\) ensuite</h3>
  <div class="prop-box">
    <strong>(a) Cassure loin sous la coupure.</strong> On place \(1/T_i\) entre \(\omega_c/10\) et \(\omega_c/5\) : le PI ne coûte alors que 6° à 11° de phase à la coupure \(\omega_c\) visée.
    <ol style="margin:.3rem 0 .2rem 1.1rem">
      <li>Prévoir la perte \(\Delta\varphi\) (≈ 6° pour \(T_i\omega_c = 10\)) ; chercher \(\omega_c\) telle que \(\arg H(j\omega_c) = -180° + M_\varphi + \Delta\varphi\).</li>
      <li>Poser \(T_i = 10/\omega_c\) (ou \(5/\omega_c\)).</li>
      <li>Régler \(K_p\) pour \(|C(j\omega_c)H(j\omega_c)| = 1\) : \(K_p = \dfrac{1}{|H(j\omega_c)|\sqrt{1+1/(T_i\omega_c)^2}} \approx \dfrac{1}{|H(j\omega_c)|}\).</li>
    </ol>
    <strong>(b) Compensation du pôle dominant.</strong> Si \(H(p) = \dfrac{K}{(1+\tau_1p)(1+\tau_2p)\cdots}\) avec \(\tau_1\) la plus grande constante de temps, on choisit \(T_i = \tau_1\) : le zéro du PI simplifie le pôle lent.
    <div class="formula">$$H_{BO}(p) = \frac{K_pK}{\tau_1\,p\,(1+\tau_2p)\cdots}$$</div>
    La FTBO devient de classe 1, sans le pôle lent ; on règle ensuite \(K_p\) comme un correcteur P (§3).
  </div>
  <div class="notice"><strong>Limites de la compensation.</strong> Elle suppose un pôle <em>stable</em> et bien identifié : si \(\tau_1\) dérive, il reste un mode lent mal compensé. De plus, le mode simplifié disparaît de la réponse à la consigne mais <em>pas</em> de la réponse à une perturbation entrant entre le correcteur et le processus : son rejet garde la lenteur de \(\tau_1\).</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">On veut couper à \(\omega_c = 15\ \text{rad/s}\) avec une perte de phase du PI d'au plus 10°. Quel \(T_i\) minimal ?</span>
    <div class="content"><p>\(\arctan\dfrac{1}{T_i\omega_c} \leq 10°\) ⇔ \(T_i\omega_c \geq \dfrac{1}{\tan 10°} \approx 5{,}7\) → \(T_i \geq 0{,}38\ \text{s}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CORRECTEUR À AVANCE DE PHASE</div>
  <h2>Remonter la phase là où elle manque</h2>
  <div class="def-box">
    <strong>Correcteur à avance de phase.</strong>
    <div class="formula">$$C(p) = K_p\,\frac{1+aTp}{1+Tp} \qquad\text{avec } a \gt 1$$</div>
    Il possède un zéro en \(-1/(aT)\) et un pôle plus rapide en \(-1/T\). Loi temporelle : \(u + T\,\dfrac{\mathrm{d}u}{\mathrm{d}t} = K_p\left(\varepsilon + aT\,\dfrac{\mathrm{d}\varepsilon}{\mathrm{d}t}\right)\) : c'est une action dérivée filtrée.
  </div>

    <div class="formula">$$|C(j\omega)| = K_p\sqrt{\frac{1+(aT\omega)^2}{1+(T\omega)^2}}$$</div>
    <div class="formula">$$\varphi = \arctan(aT\omega) - \arctan(T\omega)$$</div>
    La phase est toujours comprise entre 0° et 90°.
    Asymptotes : \(20\log K_p\) avant \(1/(aT)\), pente \(+20\ \text{dB/déc}\) entre les cassures, \(20\log(aK_p)\) après \(1/T\).
  </div>

  <h3>Avance maximale</h3>
  <div class="prop-box">
    <div class="formula">$$\omega_m = \frac{1}{T\sqrt{a}}, \qquad |C(j\omega_m)| = K_p\sqrt{a}$$</div>
    <div class="formula">$$\sin\varphi_m = \frac{a-1}{a+1}$$</div>
    <div class="formula">$$a = \frac{1+\sin\varphi_m}{1-\sin\varphi_m}$$</div>
    \(\omega_m\) est la moyenne géométrique des deux cassures (milieu sur l'axe logarithmique) ; la courbe de phase est symétrique autour de \(\omega_m\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir \(\omega_m\) et \(\sin\varphi_m\).</span>
    <div class="content">
      <p>Avec \(x = T\omega\), la formule de \(\tan(A-B)\) donne \(\tan\varphi = \dfrac{(a-1)x}{1+ax^2}\). Cette fonction de \(x \gt 0\) a pour dérivée \(\dfrac{(a-1)(1-ax^2)}{(1+ax^2)^2}\), nulle pour \(x = 1/\sqrt{a}\) : c'est le maximum, d'où \(\omega_m = \dfrac{1}{T\sqrt a}\).</p>
      <p>On y trouve \(\tan\varphi_m = \dfrac{a-1}{2\sqrt a}\). Comme \((a-1)^2 + (2\sqrt a)^2 = (a+1)^2\), le triangle rectangle de côtés \(a-1\) et \(2\sqrt a\) a pour hypoténuse \(a+1\) : \(\sin\varphi_m = \dfrac{a-1}{a+1}\). Enfin \(|C(j\omega_m)| = K_p\sqrt{\dfrac{1+a}{1+1/a}} = K_p\sqrt a\).</p>
    </div>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0;text-align:center">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem;border:1px solid var(--grid)">\(a\)</th><td style="padding:.3rem;border:1px solid var(--grid)">2</td><td style="border:1px solid var(--grid)">3</td><td style="border:1px solid var(--grid)">4</td><td style="border:1px solid var(--grid)">6</td><td style="border:1px solid var(--grid)">10</td><td style="border:1px solid var(--grid)">15</td></tr>
    <tr><th style="padding:.3rem;border:1px solid var(--grid)">\(\varphi_m\)</th><td style="padding:.3rem;border:1px solid var(--grid)">19,5°</td><td style="border:1px solid var(--grid)">30,0°</td><td style="border:1px solid var(--grid)">36,9°</td><td style="border:1px solid var(--grid)">45,6°</td><td style="border:1px solid var(--grid)">54,9°</td><td style="border:1px solid var(--grid)">61,0°</td></tr>
  </table></div>

  <h3>Effets</h3>
  <ul>
    <li><strong>Stabilité</strong> : la phase de la FTBO est relevée autour de \(\omega_m\) → \(M_\varphi\) augmente si \(\omega_m\) est placée à la coupure.</li>
    <li><strong>Rapidité</strong> : on peut couper plus haut qu'avec un simple gain → bande passante et rapidité accrues.</li>
    <li><strong>Précision</strong> : classe inchangée ; en régime permanent le correcteur se réduit au gain \(K_p\).</li>
    <li><strong>Coûts</strong> : gain haute fréquence multiplié par \(a\) (bruit amplifié) et pic de commande au démarrage : pour un échelon d'écart \(\varepsilon_0\), le théorème de la valeur initiale donne \(u(0^+) = \lim_{p\to\infty} pC(p)\dfrac{\varepsilon_0}{p} = aK_p\,\varepsilon_0\).</li>
  </ul>

  <h3>Démarche de réglage</h3>
  <div class="prop-box">
    <ol style="margin:.2rem 0 .2rem 1.1rem">
      <li><strong>Choisir la coupure</strong> \(\omega_c\) visée (exigence de rapidité, ou \(\omega_c = \omega_{c0}\) si la rapidité convient déjà).</li>
      <li><strong>Avance nécessaire</strong> : \(\varphi_m = M_\varphi - 180° - \arg H(j\omega_c)\), augmentée de quelques degrés si la coupure risque de se déplacer.</li>
      <li><strong>Calculer \(a\)</strong> par \(a = \dfrac{1+\sin\varphi_m}{1-\sin\varphi_m}\) (arrondi par excès).</li>
      <li><strong>Centrer le correcteur</strong> sur la coupure : \(\omega_m = \omega_c\), soit \(T = \dfrac{1}{\omega_c\sqrt a}\).</li>
      <li><strong>Régler \(K_p\)</strong> pour que la FTBO corrigée coupe bien en \(\omega_c\), c'est-à-dire \(K_p\sqrt{a}\,|H(j\omega_c)| = 1\) :</li>
    </ol>
    <div class="formula">$$K_p = \frac{1}{\sqrt{a}\,|H(j\omega_c)|}$$</div>
    Cas particulier \(\omega_c = \omega_{c0}\) (coupure conservée, \(|H(j\omega_{c0})| = 1\)) : \(K_p = 1/\sqrt a\), ce qui réduit le gain basses pulsations (précision à recontrôler). Enfin, <strong>vérifier \(M_G\)</strong> : le gain HF a augmenté.
  </div>
  <div class="notice">Au-delà de \(\varphi_m \approx 60°\) (soit \(a \gt 14\) environ), le gain HF \(aK_p\) devient prohibitif : on préfère deux cellules d'avance en série, chacune apportant la moitié de la phase.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Il manque 35° de phase à \(\omega_c = 20\ \text{rad/s}\). Calculer \(a\) et \(T\).</span>
    <div class="content"><p>\(a = \dfrac{1+\sin 35°}{1-\sin 35°} = \dfrac{1{,}574}{0{,}426} \approx 3{,}7\) ; \(T = \dfrac{1}{20\sqrt{3{,}7}} \approx 26\ \text{ms}\). Cassures : \(1/(aT) = \omega_c/\sqrt a \approx 10{,}4\ \text{rad/s}\) et \(1/T = \omega_c\sqrt a \approx 38{,}5\ \text{rad/s}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · VÉRIFIER ET CHOISIR</div>
  <h2>Valider sur la réponse indicielle, puis arbitrer</h2>
  <div class="intro">Les règles fréquentielles reposent sur des approximations (2ᵉ ordre dominant, modèle linéaire). Le réglage n'est validé qu'après une <strong>simulation temporelle</strong> (logiciel de simulation) ou un essai, en confrontant chaque critère au cahier des charges.</div>
  <h3>Liste de vérification</h3>
  <ul>
    <li><strong>Marges</strong> recalculées sur la FTBO <em>corrigée</em> (\(M_G\) surtout, après une avance de phase).</li>
    <li><strong>Dépassement</strong> \(D\%\) : premier maximum rapporté à la valeur finale.</li>
    <li><strong>Temps de réponse</strong> \(t_{r5\%}\) : dernier instant où la sortie entre dans la bande \(\pm 5\%\) de la valeur finale.</li>
    <li><strong>Écart statique</strong> : valeur finale comparée à la consigne (et à la perturbation, si elle est modélisée).</li>
    <li><strong>Commande</strong> \(u(t)\) : son maximum reste-t-il sous la saturation de l'actionneur ? (\(u(0^+) = K_p\varepsilon_0\) pour P et PI, \(aK_p\varepsilon_0\) pour l'avance de phase.)</li>
  </ul>
  <h3>Choisir le correcteur</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Défaut constaté sur le système non corrigé</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Correcteur adapté</th></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Marges larges, un peu lent, précision suffisante</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">P : augmenter \(K_p\)</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Trop oscillant, aucune exigence de rapidité</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">P : diminuer \(K_p\) (précision à recontrôler)</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Écart statique non nul (classe 0), dynamique correcte</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">PI, cassure sous la coupure</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Précision correcte, \(M_\varphi\) trop faible et/ou trop lent</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Avance de phase</td></tr>
    <tr><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Imprécis <em>et</em> marges ou rapidité insuffisantes</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">PI + avance de phase en série (ou PID filtré)</td></tr>
  </table></div>
  <div class="prop-box"><strong>Compromis incontournables.</strong> Précision ↔ stabilité (gain basses pulsations élevé contre marges) ; rapidité ↔ bruit et effort de commande (couper haut exige du gain haute fréquence et une commande forte) ; le PI gagne la précision au prix d'une convergence plus lente, l'avance de phase gagne la rapidité au prix du bruit.</div>
  <div class="notice"><strong>Pièges.</strong> (1) Ne pas conclure sur la seule \(M_\varphi\) : une FTBO d'ordre élevé peut avoir une marge de phase correcte et une marge de gain faible, ou un dépassement supérieur à la règle du §1. (2) Une simulation linéaire ignore les saturations : un réglage « parfait » sur le papier est inapplicable si \(u(t)\) dépasse les limites de l'actionneur.</div>
</div>

  <div class="prop-box">
    <strong>Réglage de l'intérieur vers l'extérieur.</strong>
    <ol style="margin:.3rem 0 .2rem 1.1rem">
      <li>Régler la boucle de <strong>courant</strong> (souvent un PI qui compense la constante de temps électrique \(L/R\)).</li>
      <li>La remplacer par sa FTBF : un 1ᵉʳ ordre rapide, voire un simple gain.</li>
      <li>Régler la boucle de <strong>vitesse</strong> sur ce modèle (P ou PI), puis la remplacer à son tour par sa FTBF.</li>
      <li>Régler la boucle de <strong>position</strong> : un P suffit souvent, l'intégration vitesse → position donnant déjà la classe 1 vis-à-vis de la consigne.</li>
    </ol>
    Règle de découplage : chaque boucle intérieure doit être <strong>5 à 10 fois plus rapide</strong> (bande passante) que celle qui l'entoure ; vue de l'extérieur, elle se comporte alors presque comme un gain.
  </div>
  <div class="prop-box">
    <strong>Intérêts.</strong>
    <ul style="margin:.3rem 0">
      <li>Perturbations (couple résistant, variation de la tension d'alimentation) corrigées près de leur point d'entrée, donc plus vite.</li>
      <li>Grandeurs internes limitables : saturer la consigne de courant protège le moteur et le convertisseur ; saturer la consigne de vitesse borne la vitesse.</li>
      <li>Réglage boucle par boucle, plus simple et plus robuste ; la boucle interne rend le « processus vu de l'extérieur » plus rapide.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Propriété utile</span>
    <span class="prompt">Boucle interne : correcteur P de gain \(K_c\) sur un 1ᵉʳ ordre \(\dfrac{K}{1+\tau p}\), retour unitaire. Que devient la constante de temps ?</span>
    <div class="content">
      <div class="formula">$$H_{BF}(p) = \frac{K_cK}{1+K_cK+\tau p}$$</div>
      <p>En divisant par \(1+K_cK\) : \(H_{BF}(p) = \dfrac{K'}{1+\tau' p}\), avec</p>
      <div class="formula">$$K' = \frac{K_cK}{1+K_cK}$$</div>
      <div class="formula">$$\tau' = \frac{\tau}{1+K_cK}$$</div>
      <p>La constante de temps est divisée par \(1+K_cK\) (le gain statique tend vers 1) : la boucle interne est d'autant plus rapide que son gain de boucle est grand.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SYNTHÈSE</div>
  <h2>Les trois correcteurs au programme</h2>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem .4rem;border:1px solid var(--grid)"></th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">P</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">PI</th><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Avance de phase</th></tr>
    <tr><th style="padding:.3rem .4rem;border:1px solid var(--grid)">\(C(p)\)</th><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(K_p\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(K_p\dfrac{1+T_ip}{T_ip}\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(K_p\dfrac{1+aTp}{1+Tp}\), \(a \gt 1\)</td></tr>
    <tr><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Bode</th><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Translation verticale</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Intégrateur sous \(1/T_i\), gain \(K_p\) au-dessus</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Bosse de phase \(\varphi_m\) en \(\omega_m = \dfrac{1}{T\sqrt a}\)</td></tr>
    <tr><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Apporte</th><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Précision (classe 0), rapidité</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Classe +1 : écart statique nul</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Marge de phase, rapidité</td></tr>
    <tr><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Coûte</th><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Marges</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Phase en BF, convergence lente</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">Bruit HF, pic de commande \(aK_p\varepsilon_0\)</td></tr>
    <tr><th style="padding:.3rem .4rem;border:1px solid var(--grid)">Réglage</th><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(\omega_\varphi\) puis \(K_p = 1/|H(j\omega_\varphi)|\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(T_i\) (\(10/\omega_c\) ou \(\tau\) dominant), puis \(K_p\)</td><td style="padding:.3rem .4rem;border:1px solid var(--grid)">\(\varphi_m\) → \(a\) → \(T\) → \(K_p\)</td></tr>
  </table></div>
  <div class="notice">Ordre de réflexion à l'écrit : (1) analyser le système non corrigé (classe, marges, \(\omega_{c0}\)) ; (2) identifier le ou les critères non satisfaits ; (3) choisir le correcteur ; (4) le dimensionner sur le Bode ; (5) vérifier toutes les exigences, y compris celles qui l'étaient avant correction.</div>
