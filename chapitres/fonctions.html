<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie A de la section « Techniques fondamentales de calcul différentiel et intégral » du programme de PTSI (fonctions d'une variable réelle à valeurs réelles ou complexes : généralités, dérivation, fonctions usuelles), et la partie « Trigonométrie » de la section « Compléments de calcul algébrique et de trigonométrie ». Le point de vue est <strong>pratique</strong> : les règles de dérivation et la caractérisation des fonctions monotones sont rappelées ici et utilisées, elles sont démontrées dans le chapitre <a href="#contderiv/cours">« Continuité et dérivabilité »</a>. Les calculs de sommes, les inégalités et la valeur absolue sont dans le chapitre <a href="#calculs/cours">« Calculs algébriques et arithmétique »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Ensemble de définition, représentation graphique</strong> ; savoir déduire du graphe de \(f\) ceux de fonctions obtenues par des transformations simples, comme \(x \mapsto f(x + a)\) ou \(x \mapsto f(ax)\) (§1).</li>
        <li><strong>Parité, imparité, périodicité</strong> : interprétation géométrique, réduction du domaine d'étude (§2).</li>
        <li><strong>Somme, produit, composée ; monotonie</strong> (large et stricte) ; fonctions majorées, minorées, bornées ; \(f\) est bornée si et seulement si \(|f|\) est majorée (§3).</li>
        <li><strong>Dérivation</strong> : notations \(f'(x)\), \(\frac{\mathrm d}{\mathrm dx}\big(f(x)\big)\) ; dérivée d'une combinaison linéaire, d'un produit, d'un quotient, d'une composée (rappels) ; exemples simples de dérivées partielles ; caractérisation des fonctions constantes et monotones parmi les fonctions dérivables sur un intervalle (admise ici) ; tableau de variations, extremums, démonstration d'inégalités ; fonction de classe \(\mathcal C^1\), dérivées d'ordre supérieur (§4).</li>
        <li><strong>Fonction réciproque</strong> : représentation graphique et dérivée (formule admise ici, interprétation géométrique) (§5).</li>
        <li><strong>Exponentielle, logarithme népérien, puissances</strong> : dérivée, variations, graphe ; puissances définies sur \(]0, +\infty[\) et prolongées en 0 le cas échéant, puissances entières sur \(\mathbb R^*\) ; logarithme décimal et en base 2 ; relations \((xy)^\alpha = x^\alpha y^\alpha\), \(x^{\alpha+\beta} = x^\alpha x^\beta\), \((x^\alpha)^\beta = x^{\alpha\beta}\) (§6).</li>
        <li><strong>Croissances comparées</strong> ; inégalités \(\exp(x) \ge 1 + x\) et \(\ln(1 + x) \le x\) (§7).</li>
        <li><strong>Trigonométrie</strong> : cercle trigonométrique, congruence modulo \(2\pi\) (notation \(a \equiv b\ [2\pi]\)), cosinus et sinus de \(\pi \pm x\), \(\frac\pi2 \pm x\), des angles usuels ; formules d'addition et de duplication (une justification géométrique), formules à retrouver pour \(\cos a\cos b\), \(\cos a\sin b\), \(\sin a\sin b\) ; dérivées de sin et cos ; inégalité \(|\sin x| \le |x|\) ; équations et inéquations trigonométriques simples (§8).</li>
        <li><strong>Fonction tangente</strong> : dérivée, variations, graphe ; tangente de \(\pi \pm x\) et des angles usuels, interprétation sur le cercle ; formule d'addition \(\tan(a \pm b)\) (§9).</li>
        <li><strong>Fonctions circulaires réciproques</strong> \(\arcsin\), \(\arccos\), \(\arctan\) : dérivée, variations, graphe (§10).</li>
        <li><strong>Fonctions hyperboliques</strong> \(\operatorname{sh}\), \(\operatorname{ch}\) : dérivée, variations, graphe ; la seule formule exigible est \(\operatorname{ch}^2 x - \operatorname{sh}^2 x = 1\) (§11).</li>
        <li><strong>Fonctions à valeurs complexes</strong> : dérivée par les parties réelle et imaginaire, combinaison linéaire, produit, quotient ; dérivée de \(\exp(\varphi)\) pour \(\varphi\) à valeurs complexes (§12).</li>
      </ul>
      <p>Hors programme : la tangente hyperbolique et les fonctions hyperboliques réciproques (Argsh, Argch), présentées en fin de chapitre pour aller plus loin. La convexité n'est au programme ni de PTSI ni de PT.</p>

<div class="course-section">
  <div class="sec-num">§1 · DÉFINITION, GRAPHE ET TRANSFORMATIONS</div>
  <h2>Lire et déformer le graphe d'une fonction</h2>
  <div class="intro">Une fonction se comprend d'abord par son graphe. Savoir passer du graphe de \(f\) à celui de \(x \mapsto f(x + a)\), \(f(ax)\), \(\lambda f(x) + b\) permet de tracer sans calcul une foule de fonctions (un signal décalé, accéléré, amplifié) et de contrôler un résultat.</div>

  <div class="def-box">
    Une fonction réelle \(f\) associe à chaque réel \(x\) de son <strong>ensemble de définition</strong> \(D_f \subset \mathbb R\) un unique réel \(f(x)\). Sa <strong>représentation graphique</strong> (ou courbe, ou graphe) dans un repère orthonormé est l'ensemble \(\mathcal C_f = \{(x, f(x)) : x \in D_f\}\).
  </div>
  <p>Déterminer \(D_f\) consiste à repérer les opérations interdites : division par 0, racine carrée d'un négatif, logarithme d'un nombre négatif ou nul, \(\arcsin\) ou \(\arccos\) hors de \([-1, 1]\), \(\tan\) en \(\frac\pi2 + k\pi\). Par exemple, \(x \mapsto \sqrt{\ln x}\) est définie si \(x \gt 0\) et \(\ln x \ge 0\), soit sur \([1, +\infty[\).</p>

  <div class="prop-box">
    <strong>Transformations du graphe.</strong> Soient \(a\), \(b\) réels et \(\lambda \gt 0\). On obtient le graphe de
    <ul>
      <li>\(x \mapsto f(x) + b\) par la translation de vecteur \(b\,\vec\jmath\) (vers le haut si \(b \gt 0\)) ;</li>
      <li>\(x \mapsto f(x + a)\) par la translation de vecteur \(-a\,\vec\imath\) : vers la <strong>gauche</strong> si \(a \gt 0\) ;</li>
      <li>\(x \mapsto f(\lambda x)\) par une compression horizontale de rapport \(\lambda\) : le point \((x, y)\) devient \((x/\lambda, y)\) ;</li>
      <li>\(x \mapsto \lambda f(x)\) par une dilatation verticale de rapport \(\lambda\) : \((x, y)\) devient \((x, \lambda y)\) ;</li>
      <li>\(x \mapsto f(-x)\) par la symétrie d'axe \((Oy)\), \(x \mapsto -f(x)\) par la symétrie d'axe \((Ox)\), et \(x \mapsto |f(x)|\) en remplaçant les parties sous l'axe \((Ox)\) par leurs symétriques.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Suivre un point du graphe.</span>
    <div class="content"><p>Notons \(g(x) = f(x + a)\). Le point \((x, y)\) est sur \(\mathcal C_g\) si et seulement si \(y = f(x + a)\), c'est-à-dire si \((x + a, y)\) est sur \(\mathcal C_f\). Chaque point de \(\mathcal C_f\), d'abscisse \(u = x + a\), donne donc le point d'abscisse \(u - a\) : on décale de \(-a\). De même, \((x, y) \in \mathcal C_h\) avec \(h(x) = f(\lambda x)\) si et seulement si \((\lambda x, y) \in \mathcal C_f\) : le point d'abscisse \(u\) de \(\mathcal C_f\) donne celui d'abscisse \(u/\lambda\).</p></div>
  </div>

<figcaption>En pointillés, le graphe de sin. À gauche, x ↦ sin(x + π/2) : le graphe est translaté de π/2 vers la GAUCHE (signe contraire de a), et l'on obtient le cosinus. À droite, x ↦ sin(2x) : le graphe est comprimé horizontalement d'un facteur 2, la période devient π ; les valeurs prises ne changent pas.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — tracer \(g(x) = 2(x - 1)^2 + 3\) et \(s(t) = 3\sin(2t + \pi/2)\)</strong>
    <ol>
      <li>Partir de la parabole \(y = x^2\) ; \((x - 1)^2\) : translation de 1 vers la droite ; \(\times 2\) : dilatation verticale ; \(+3\) : translation de 3 vers le haut. Le sommet passe de \((0, 0)\) à \((1, 3)\), et \(g(2) = 5\).</li>
      <li>\(s(t) = 3\sin\big(2(t + \pi/4)\big)\) : on comprime \(\sin\) d'un facteur 2 (période \(\pi\)), on décale de \(\pi/4\) vers la gauche, on dilate verticalement par 3 (amplitude 3). Contrôle : \(s(0) = 3\sin(\pi/2) = 3\), maximum atteint en \(t = 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : décaler dans le mauvais sens. Le graphe de \(x \mapsto f(x - 2)\) est celui de \(f\) décalé de 2 vers la <strong>droite</strong> (on retrouve en \(x = 2\) ce que \(f\) faisait en 0). Et dans \(f(2x + 1)\), le décalage vaut \(\frac12\), pas 1 : \(f(2x + 1) = f\big(2(x + \frac12)\big)\).</div>

<div class="course-section">
  <div class="sec-num">§2 · PARITÉ, PÉRIODICITÉ, DOMAINE D'ÉTUDE</div>
  <h2>Exploiter les symétries pour étudier moins</h2>
  <div class="intro">Une symétrie du graphe permet de n'étudier la fonction que sur une partie de son ensemble de définition, puis de compléter le graphe par symétrie ou translation. C'est la première étape de toute étude de fonction.</div>

  <div class="def-box">
    Soit \(f\) définie sur \(D\) <strong>symétrique par rapport à 0</strong> (\(x \in D \Rightarrow -x \in D\)). \(f\) est <strong>paire</strong> si \(f(-x) = f(x)\) pour tout \(x \in D\), <strong>impaire</strong> si \(f(-x) = -f(x)\) pour tout \(x \in D\).<br>
    Soit \(T \gt 0\). \(f\) est <strong>\(T\)-périodique</strong> si, pour tout \(x \in D\), \(x + T \in D\), \(x - T \in D\) et \(f(x + T) = f(x)\).
  </div>
  <div class="prop-box">
    <strong>Interprétation géométrique.</strong> \(f\) est paire si et seulement si son graphe est symétrique par rapport à l'axe \((Oy)\), impaire si et seulement s'il est symétrique par rapport à l'origine \(O\) ; une fonction impaire définie en 0 vérifie \(f(0) = 0\). \(f\) est \(T\)-périodique si et seulement si son graphe est invariant par la translation de vecteur \(T\vec\imath\).
  </div>
  <p><strong>Réduction du domaine d'étude</strong> : si \(f\) est paire ou impaire, on l'étudie sur \(D \cap [0, +\infty[\) ; si elle est \(T\)-périodique, sur un intervalle de longueur \(T\) (souvent \([-T/2, T/2]\)) ; si elle est à la fois \(T\)-périodique et paire ou impaire, sur \([0, T/2]\).</p>
  <div class="method-box">
    <strong>Exemple — réduire l'étude de \(f(x) = \cos x + \frac12\cos(2x)\)</strong>
    <ol>
      <li>\(D_f = \mathbb R\), \(f\) est \(2\pi\)-périodique (les deux termes le sont) et paire (\(\cos\) l'est).</li>
      <li>On l'étudie sur \([0, \pi]\) : \(f'(x) = -\sin x - \sin(2x) = -\sin x\,(1 + 2\cos x)\). Sur \([0, \pi]\), \(\sin x \ge 0\), et \(1 + 2\cos x\) s'annule en \(\frac{2\pi}{3}\).</li>
      <li>\(f\) décroît sur \([0, \frac{2\pi}{3}]\) de \(f(0) = \frac32\) à \(f(\frac{2\pi}{3}) = -\frac12 - \frac14 = -\frac34\), puis croît jusqu'à \(f(\pi) = -1 + \frac12 = -\frac12\). On complète par symétrie d'axe \((Oy)\), puis par translations de \(2\pi\).</li>
    </ol>
  </div>
  <p><strong>Décomposition paire-impaire</strong> (exemple classique, non exigible) : toute fonction définie sur un ensemble symétrique s'écrit de façon unique \(f = f_p + f_i\) avec \(f_p(x) = \frac{f(x) + f(-x)}{2}\) paire et \(f_i(x) = \frac{f(x) - f(-x)}{2}\) impaire. Pour \(f = \exp\), on obtient \(\operatorname{ch}\) et \(\operatorname{sh}\) (§11).</p>
  <div class="notice"><strong>Erreur classique</strong> : conclure à la parité après avoir vérifié \(f(-x) = f(x)\) pour un seul \(x\), ou oublier que l'ensemble de définition doit être symétrique : \(x \mapsto x^2\) sur \([-1, 2]\) n'est pas paire. Une fonction peut n'être ni paire ni impaire (\(x \mapsto x + x^2\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MONOTONIE ET FONCTIONS BORNÉES</div>
  <h2>Sens de variation, majorants, minorants</h2>
  <div class="intro">La monotonie dit comment les valeurs évoluent ; les bornes disent où elles restent. On combine les deux pour encadrer une fonction, et donc pour démontrer des inégalités ou contrôler une erreur.</div>

  <div class="def-box">
    Soit \(f\) définie sur un intervalle \(I\). \(f\) est <strong>croissante</strong> sur \(I\) si \(x \le y \Rightarrow f(x) \le f(y)\) pour tous \(x, y \in I\), <strong>strictement croissante</strong> si \(x \lt y \Rightarrow f(x) \lt f(y)\) ; de même pour décroissante. Elle est <strong>monotone</strong> si elle est croissante ou décroissante.<br>
    \(f\) est <strong>majorée</strong> sur \(I\) s'il existe un réel \(M\) tel que \(f(x) \le M\) pour tout \(x \in I\) ; <strong>minorée</strong> de même ; <strong>bornée</strong> si elle est majorée et minorée.
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong>
    <ul>
      <li>Une fonction strictement monotone est injective (deux réels distincts ont des images distinctes).</li>
      <li>La somme de deux fonctions croissantes est croissante. La composée de deux fonctions de même sens de variation est croissante, de deux fonctions de sens contraires est décroissante.</li>
      <li>\(f\) est bornée si et seulement si \(|f|\) est majorée : il existe \(M\) tel que \(|f(x)| \le M\) pour tout \(x\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Composée et bornes.</span>
    <div class="content"><p>Si \(f\) et \(g\) sont décroissantes et \(x \le y\), alors \(f(x) \ge f(y)\), puis \(g(f(x)) \le g(f(y))\) : \(g \circ f\) croît. Les autres cas sont analogues. Si \(m \le f \le M\), alors \(|f| \le \max(|m|, |M|)\) ; réciproquement, \(|f| \le M\) équivaut à \(-M \le f \le M\).</p></div>
  </div>
  <p>Le plus petit des majorants d'une fonction majorée est sa <strong>borne supérieure</strong> \(\sup_I f\) ; s'il est atteint, c'est un <strong>maximum</strong>. Une fonction continue sur un segment est bornée et atteint ses bornes (chapitre « Continuité et dérivabilité »).</p>
  <div class="method-box">
    <strong>Exemple — encadrer et composer</strong>
    <ol>
      <li>\(f(x) = \dfrac{1}{1 + x^2}\) vérifie \(0 \lt f(x) \le 1\) sur \(\mathbb R\) : elle est bornée, de maximum \(1 = f(0)\). La borne inférieure \(0\) n'est pas atteinte (minimum inexistant).</li>
      <li>\(g(x) = \mathrm e^{-x^2}\) sur \([0, +\infty[\) : \(x \mapsto -x^2\) y décroît et \(\exp\) croît, donc \(g\) décroît (sens contraires). Ainsi \(g(2) = \mathrm e^{-4} \approx 0{,}018 \lt g(1) = \mathrm e^{-1} \approx 0{,}368\).</li>
      <li>\(h(x) = \sin x + \cos(3x)\) est bornée : \(|h(x)| \le |\sin x| + |\cos 3x| \le 2\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que le produit de deux fonctions croissantes est croissant (\(x \mapsto x \times x\) ne l'est pas sur \(\mathbb R\) : il faut des fonctions positives), ou qu'une fonction strictement croissante tend vers \(+\infty\) (\(\arctan\) est majorée par \(\frac\pi2\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · DÉRIVATION : RAPPELS ET ÉTUDE PRATIQUE</div>
  <h2>Dériver pour étudier</h2>
  <div class="intro">La dérivée mesure le taux de variation instantané : vitesse, débit, pente de la tangente. Son signe donne le sens de variation, ses zéros les extremums possibles. On rappelle ici les règles de calcul, admises à ce stade et démontrées dans le chapitre <a href="#contderiv/cours">« Continuité et dérivabilité »</a>.</div>

  <div class="def-box">
    \(f\) est <strong>dérivable</strong> en \(a\) si le taux d'accroissement \(\dfrac{f(a + h) - f(a)}{h}\) a une limite finie quand \(h \to 0\) ; cette limite est \(f'(a)\), notée aussi \(\frac{\mathrm d}{\mathrm dx}\big(f(x)\big)\) en \(x = a\). La <strong>tangente</strong> au graphe en \(a\) a pour équation \(y = f(a) + f'(a)(x - a)\).
  </div>
  <div class="prop-box">
    <strong>Règles de calcul.</strong> Pour \(f\), \(g\) dérivables et \(\lambda\), \(\mu\) réels :
    <div class="formula" data-nom="Dérivées d'un produit, d'un quotient, d'une composée">$$(\lambda f + \mu g)' = \lambda f' + \mu g', \quad (fg)' = f'g + fg', \quad \left(\frac fg\right)' = \frac{f'g - fg'}{g^2}, \quad (g \circ f)' = f' \times (g' \circ f) .$$</div>
  </div>
  <table>
    <tr><th>\(f(x)\)</th><th>\(f'(x)\)</th><th>\(f(x)\)</th><th>\(f'(x)\)</th></tr>
    <tr><td>\(x^n\), \(n \in \mathbb Z\)</td><td>\(n\,x^{n-1}\)</td><td>\(\tan x\)</td><td>\(1 + \tan^2 x = \dfrac{1}{\cos^2 x}\)</td></tr>
    <tr><td>\(x^\alpha\) (\(x \gt 0\))</td><td>\(\alpha\, x^{\alpha - 1}\)</td><td>\(\arcsin x\)</td><td>\(\dfrac{1}{\sqrt{1 - x^2}}\)</td></tr>
    <tr><td>\(\mathrm e^x\)</td><td>\(\mathrm e^x\)</td><td>\(\arccos x\)</td><td>\(\dfrac{-1}{\sqrt{1 - x^2}}\)</td></tr>
    <tr><td>\(\ln x\)</td><td>\(\dfrac1x\)</td><td>\(\arctan x\)</td><td>\(\dfrac{1}{1 + x^2}\)</td></tr>
    <tr><td>\(\sin x\)</td><td>\(\cos x\)</td><td>\(\operatorname{ch} x\)</td><td>\(\operatorname{sh} x\)</td></tr>
    <tr><td>\(\cos x\)</td><td>\(-\sin x\)</td><td>\(\operatorname{sh} x\)</td><td>\(\operatorname{ch} x\)</td></tr>
  </table>
  <div class="prop-box">
    <strong>Dérivée et monotonie</strong> (admis ici). Soit \(f\) dérivable sur un <strong>intervalle</strong> \(I\). Alors \(f\) est constante sur \(I\) si et seulement si \(f' = 0\) ; croissante si et seulement si \(f' \ge 0\) ; si \(f' \gt 0\) sur \(I\) sauf en un nombre fini de points, \(f\) est strictement croissante.
  </div>
  <p>Étudier une fonction, c'est : ensemble de définition, réduction par les symétries, dérivée et son signe, <strong>tableau de variations</strong> avec les valeurs et les limites aux bornes, puis tracé. Les extremums sont à chercher parmi les points où \(f'\) s'annule (sur un intervalle ouvert) et aux bornes. Pour démontrer une inégalité \(u(x) \le v(x)\), on étudie souvent \(g = v - u\) et l'on montre que son minimum est positif.</p>
  <div class="method-box">
    <strong>Exemple — variations de \(f(x) = x^3 - 3x + 1\), et une inégalité</strong>
    <ol>
      <li>\(f'(x) = 3(x - 1)(x + 1)\) : positive sur \(]-\infty, -1]\) et \([1, +\infty[\), négative sur \([-1, 1]\).</li>
      <li>\(f\) croît jusqu'au maximum local \(f(-1) = 3\), décroît jusqu'au minimum local \(f(1) = -1\), puis croît ; limites \(-\infty\) et \(+\infty\). Comme \(f\) change trois fois de signe, l'équation \(f(x) = 0\) a exactement trois solutions réelles (une par intervalle de monotonie, théorème des valeurs intermédiaires).</li>
      <li>Inégalité : pour \(x \gt 0\), \(g(x) = x + \frac1x\) a pour dérivée \(1 - \frac1{x^2} = \frac{(x - 1)(x + 1)}{x^2}\), négative puis positive : minimum \(g(1) = 2\). Donc \(x + \frac1x \ge 2\) pour tout \(x \gt 0\).</li>
    </ol>
  </div>

  <h3>Dérivées successives, classe \(\mathcal C^1\)</h3>
  <p>\(f\) est <strong>de classe \(\mathcal C^1\)</strong> sur \(I\) si elle est dérivable et si \(f'\) est continue. Si \(f'\) est elle-même dérivable, sa dérivée est la dérivée seconde \(f''\), et ainsi de suite : \(f^{(n)}\). Exemples : \((\mathrm e^{2x})^{(n)} = 2^n \mathrm e^{2x}\) ; \(\sin^{(n)}(x) = \sin\left(x + n\frac\pi2\right)\) (chaque dérivation avance de \(\frac\pi2\)). La fonction \(x \mapsto x|x|\) est de classe \(\mathcal C^1\) (sa dérivée \(2|x|\) est continue) mais n'est pas deux fois dérivable en 0.</p>

  <h3>Dérivées partielles</h3>
  <p>Une grandeur dépend souvent de plusieurs variables : \(P = \frac{nRT}{V}\). La <strong>dérivée partielle</strong> \(\frac{\partial f}{\partial x}\) de \(f(x, y)\) se calcule en dérivant par rapport à \(x\), \(y\) étant traité comme une constante. Leur étude systématique est faite en 2ᵉ année (chapitre <a href="#fpv/cours">« Fonctions de plusieurs variables »</a>).</p>
  <div class="method-box">
    <strong>Exemple — deux calculs de dérivées partielles</strong>
    <ol>
      <li>\(f(x, y) = x^2 y^3 + \sin(xy)\) : \(\dfrac{\partial f}{\partial x} = 2xy^3 + y\cos(xy)\) et \(\dfrac{\partial f}{\partial y} = 3x^2y^2 + x\cos(xy)\). Au point \((1, 0)\) : \(0\) et \(1\).</li>
      <li>Gaz parfait, \(P(T, V) = \dfrac{nRT}{V}\) : \(\dfrac{\partial P}{\partial V} = -\dfrac{nRT}{V^2} = -\dfrac PV\). Pour \(n = 1\) mol, \(T = 300\) K, \(V = 0{,}025\) m³ : \(P \approx 99{,}8\) kPa et \(\frac{\partial P}{\partial V} \approx -4{,}0 \times 10^6\) Pa/m³.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dériver une composée sans le facteur \(f'\) (\((\sin 3x)' = 3\cos 3x\), pas \(\cos 3x\)) ; ou conclure qu'une fonction de dérivée nulle est constante sur un ensemble qui n'est pas un intervalle : \(x \mapsto \frac{x}{|x|}\) a une dérivée nulle sur \(\mathbb R^*\) et vaut \(\pm 1\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FONCTION RÉCIPROQUE</div>
  <h2>Inverser une bijection, lire sa dérivée sur le graphe</h2>
  <div class="intro">Résoudre \(y = f(x)\) en \(x\), c'est utiliser la réciproque de \(f\) : \(\ln\) pour \(\exp\), \(\sqrt{\ }\) pour le carré, \(\arcsin\) pour le sinus. Son graphe s'obtient par une simple symétrie, et sa dérivée aussi.</div>
  <div class="def-box">
    Soit \(f : I \to J\) une <strong>bijection</strong> : tout \(y \in J\) a un unique antécédent \(x \in I\). La <strong>réciproque</strong> \(f^{-1} : J \to I\) associe à \(y\) cet antécédent : \(y = f(x) \iff x = f^{-1}(y)\).
  </div>
  <p>Une fonction <strong>continue et strictement monotone</strong> sur un intervalle \(I\) réalise une bijection de \(I\) sur l'intervalle \(J = f(I)\), dont les bornes sont les limites de \(f\) aux bornes de \(I\) (chapitre « Continuité et dérivabilité », §5).</p>
  <div class="prop-box">
    <strong>Graphe et dérivée de la réciproque.</strong> Les graphes de \(f\) et \(f^{-1}\) sont symétriques par rapport à la droite \(y = x\). Si \(f\) est dérivable sur \(I\) et \(f'(x) \neq 0\), alors \(f^{-1}\) est dérivable en \(y = f(x)\) et
    <div class="formula" data-nom="Dérivée d'une réciproque">$$\big(f^{-1}\big)'(y) = \frac{1}{f'\big(f^{-1}(y)\big)} .$$</div>
    (Formule admise ici, démontrée dans le chapitre « Continuité et dérivabilité », §7.)
  </div>

  <p>Interprétation : la symétrie par rapport à \(y = x\) échange les axes ; une tangente de pente \(p\) devient une tangente de pente \(1/p\). Là où \(f'\) s'annule (tangente horizontale), \(f^{-1}\) a une tangente verticale et n'est pas dérivable. Pour retrouver la formule, on dérive \(f(f^{-1}(y)) = y\) : \(f'(f^{-1}(y)) \times (f^{-1})'(y) = 1\).</p>
  <div class="method-box">
    <strong>Exemple — une réciproque sans formule explicite</strong>
    <ol>
      <li>\(f(x) = x + \mathrm e^x\) : \(f'(x) = 1 + \mathrm e^x \gt 0\), \(f\) est continue, strictement croissante, de limites \(-\infty\) et \(+\infty\) : c'est une bijection de \(\mathbb R\) sur \(\mathbb R\).</li>
      <li>On ne sait pas exprimer \(f^{-1}\), mais \(f(0) = 1\) donne \(f^{-1}(1) = 0\) et \((f^{-1})'(1) = \dfrac{1}{f'(0)} = \dfrac12\).</li>
      <li>Tangente au graphe de \(f^{-1}\) en 1 : \(y = \frac12(x - 1)\). Contrôle numérique : \(f(0{,}01) \approx 1{,}0201\), donc \(f^{-1}(1{,}0201) \approx 0{,}01 \approx \frac12 \times 0{,}0201\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(f^{-1}(y)\) (réciproque) et \(\dfrac{1}{f(y)}\) (inverse), ou écrire \((f^{-1})'(y) = \dfrac{1}{f'(y)}\) : la dérivée de \(f\) se prend en \(f^{-1}(y)\), pas en \(y\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · EXPONENTIELLE, LOGARITHMES, PUISSANCES</div>
  <h2>Les fonctions de la croissance et des échelles</h2>
  <div class="intro">L'exponentielle décrit les croissances et décroissances proportionnelles à la quantité présente (radioactivité, charge d'un condensateur) ; le logarithme mesure des ordres de grandeur (décibels, pH, nombre de chiffres, nombre de bits) ; les puissances relient les deux.</div>
  <div class="prop-box">
    <strong>Exponentielle et logarithme.</strong> \(\exp\) est dérivable sur \(\mathbb R\), égale à sa dérivée, strictement positive et strictement croissante, de \(0\) en \(-\infty\) à \(+\infty\) en \(+\infty\) ; \(\mathrm e^{a + b} = \mathrm e^a \mathrm e^b\). Sa réciproque \(\ln : \,]0, +\infty[ \to \mathbb R\) est dérivable, de dérivée \(\frac1x\), strictement croissante, et
    <div class="formula" data-nom="Logarithme">$$\ln(ab) = \ln a + \ln b, \qquad \ln\frac ab = \ln a - \ln b, \qquad \ln(a^n) = n \ln a \qquad (a, b \gt 0,\ n \in \mathbb Z) .$$</div>
  </div>
  <div class="def-box">
    Pour \(x \gt 0\) et \(\alpha\) réel, \(x^\alpha = \mathrm e^{\alpha \ln x}\). Le <strong>logarithme décimal</strong> est \(\log_{10} x = \dfrac{\ln x}{\ln 10}\), le <strong>logarithme en base 2</strong> est \(\log_2 x = \dfrac{\ln x}{\ln 2}\) : \(\log_{10}(10^n) = n\) et \(\log_2(2^n) = n\).
  </div>
  <div class="prop-box">
    <strong>Fonctions puissances.</strong> Pour \(x, y \gt 0\) et \(\alpha, \beta\) réels :
    <div class="formula" data-nom="Règles des puissances">$$(xy)^\alpha = x^\alpha y^\alpha, \qquad x^{\alpha + \beta} = x^\alpha x^\beta, \qquad (x^\alpha)^\beta = x^{\alpha\beta}, \qquad \big(x^\alpha\big)' = \alpha\, x^{\alpha - 1} .$$</div>
    \(x \mapsto x^\alpha\) est définie sur \(]0, +\infty[\), croissante si \(\alpha \gt 0\), décroissante si \(\alpha \lt 0\). Pour \(\alpha \gt 0\), on la prolonge en 0 par \(0^\alpha = 0\). Seules les puissances entières \(x^n\) sont aussi définies pour \(x \lt 0\).
  </div>

  <div class="method-box">
    <strong>Exemple — calculer avec logarithmes et puissances</strong>
    <ol>
      <li>\(8^{2/3} = \mathrm e^{\frac23 \ln 8} = \mathrm e^{2\ln 2} = 4\) ; \(\ln\sqrt{\mathrm e} = \frac12\) ; \(\log_{10}(0{,}001) = -3\).</li>
      <li>\(2^x = 10 \iff x\ln 2 = \ln 10 \iff x = \log_2 10 \approx 3{,}32\). Comme \(\log_2 10^6 \approx 19{,}93\), on a \(2^{19} \lt 10^6 \lt 2^{20}\) : une recherche dichotomique dans un tableau trié d'un million d'éléments fait au plus 20 comparaisons.</li>
      <li>pH d'une solution où \([\mathrm H_3\mathrm O^+] = 2{,}5 \times 10^{-4}\) mol/L : \(\mathrm{pH} = -\log_{10}(2{,}5 \times 10^{-4}) \approx 3{,}60\). Multiplier la concentration par 10 fait baisser le pH de 1.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : \(\ln(a + b) = \ln a + \ln b\) est faux (\(\ln 2 \neq \ln 1 + \ln 1 = 0\)) ; \(x^\alpha\) n'est pas défini pour \(x \lt 0\) et \(\alpha\) non entier : la racine cubique d'un négatif existe (réciproque de \(x \mapsto x^3\)), mais ne s'écrit pas \(x^{1/3}\) avec cette définition. Et \(\ln(x^2) = 2\ln|x|\), pas \(2\ln x\), si \(x\) peut être négatif.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CROISSANCES COMPARÉES ET INÉGALITÉS USUELLES</div>
  <h2>Qui l'emporte à l'infini, et deux inégalités à connaître</h2>
  <div class="intro">Pour lever une forme indéterminée entre logarithme, puissance et exponentielle, une règle suffit : l'exponentielle l'emporte sur toute puissance, qui l'emporte sur tout logarithme. Les deux inégalités \(\mathrm e^x \ge 1 + x\) et \(\ln(1 + x) \le x\) donnent, elles, des encadrements valables partout, pas seulement à la limite.</div>
  <div class="prop-box">
    <strong>Croissances comparées.</strong> Pour tous réels \(\alpha \gt 0\) et \(\beta \gt 0\) :
    <div class="formula" data-nom="Croissances comparées">$$\lim_{x\to+\infty} \frac{(\ln x)^\beta}{x^\alpha} = 0, \qquad \lim_{x\to+\infty} \frac{x^\alpha}{\mathrm e^{\beta x}} = 0, \qquad \lim_{x\to 0^+} x^\alpha\,|\ln x|^\beta = 0 .$$</div>
  </div>
  <div class="prop-box">
    <strong>Inégalités usuelles.</strong> Pour tout réel \(x\), et pour tout \(x \gt -1\) respectivement :
    <div class="formula" data-nom="Inégalités exp et ln">$$\mathrm e^x \ge 1 + x, \qquad \ln(1 + x) \le x ,$$</div>
    avec égalité si et seulement si \(x = 0\). De façon équivalente, \(\ln x \le x - 1\) pour tout \(x \gt 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une étude de fonction, puis le logarithme.</span>
    <div class="content"><p>Soit \(g(x) = \mathrm e^x - 1 - x\). Alors \(g'(x) = \mathrm e^x - 1\) est négative sur \(]-\infty, 0]\), positive sur \([0, +\infty[\) : \(g\) atteint son minimum en 0, où elle vaut 0, et ne s'annule qu'en 0 (elle est strictement monotone de chaque côté). Donc \(\mathrm e^x \ge 1 + x\). Pour \(x \gt -1\), on applique ce résultat à \(\ln(1 + x)\) : \(1 + x = \mathrm e^{\ln(1+x)} \ge 1 + \ln(1 + x)\), d'où \(\ln(1 + x) \le x\).</p>
    <p>Croissances comparées : pour \(x \gt 1\), \(\ln x = 2\ln\sqrt x \le 2(\sqrt x - 1) \lt 2\sqrt x\), donc \(0 \lt \frac{\ln x}{x} \lt \frac{2}{\sqrt x}\), qui tend vers 0 ; on en déduit les autres limites en posant \(x = y^{\alpha/\beta}\), \(x = \mathrm e^y\) ou \(x = 1/y\) (chapitre <a href="#asympt/cours">« Analyse asymptotique »</a>, §2).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — trois usages</strong>
    <ol>
      <li><strong>Limite.</strong> \(\dfrac{x^3 + \ln x}{\mathrm e^{x/2}} \to 0\) en \(+\infty\), car \(\frac{x^3}{\mathrm e^{x/2}} \to 0\) et \(\frac{\ln x}{\mathrm e^{x/2}} \to 0\).</li>
      <li><strong>Encadrement numérique.</strong> \(\mathrm e^{0{,}1} \ge 1{,}1\) (valeur \(1{,}105\)) et \(\ln 1{,}05 \le 0{,}05\) (valeur \(0{,}0488\)) : pour \(x\) petit, \(\ln(1 + x) \approx x\).</li>
      <li><strong>Une suite célèbre.</strong> Pour \(n \ge 1\), \(n\ln\left(1 + \frac1n\right) \le n \times \frac1n = 1\), donc \(\left(1 + \frac1n\right)^n \le \mathrm e\). Pour \(n = 10\) : \(1{,}1^{10} \approx 2{,}594 \le 2{,}718\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les croissances comparées sans vérifier qu'il s'agit d'une forme indéterminée du bon type, ou oublier le domaine : \(\ln(1 + x) \le x\) n'a de sens que pour \(x \gt -1\). Et « \(\mathrm e^x \ge x\) » est vrai, mais moins précis que \(\mathrm e^x \ge 1 + x\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · TRIGONOMÉTRIE</div>
  <h2>Cercle trigonométrique, formules, équations</h2>
  <div class="intro">Les fonctions sinus et cosinus décrivent tout ce qui tourne ou oscille : un point sur une roue, une tension alternative, un pendule. Toutes les formules se retrouvent sur le cercle trigonométrique, ou à partir des deux formules d'addition.</div>
  <div class="def-box">
    Le <strong>cercle trigonométrique</strong> est le cercle de centre \(O\) et de rayon 1, parcouru dans le sens direct à partir de \(A = (1, 0)\). Au réel \(x\) correspond le point \(M(x)\) atteint après un arc de longueur \(|x|\) ; ses coordonnées sont \((\cos x, \sin x)\), d'où \(\cos^2 x + \sin^2 x = 1\). Deux réels \(a\), \(b\) donnent le même point si et seulement si \(a - b\) est un multiple entier de \(2\pi\) : on note \(a \equiv b\ [2\pi]\) (congruence modulo \(2\pi\)).
  </div>

</figure>
  <p><strong>Symétries du cercle.</strong> Les relations suivantes se lisent sur la figure (symétries par rapport aux axes, à l'origine et à la première bissectrice) ; on les retrouve plutôt que de les apprendre :</p>
  <div class="formula" data-nom="cos de π ± x, π/2 ± x">$$\begin{aligned} \cos(-x) &= \cos x, \\ \cos(\pi \pm x) &= -\cos x, \\ \cos\!\left(\tfrac\pi2 - x\right) &= \sin x, \\ \cos\!\left(\tfrac\pi2 + x\right) &= -\sin x, \end{aligned}$$</div>
  <div class="formula" data-nom="sin de π ± x, π/2 ± x">$$\begin{aligned} \sin(-x) &= -\sin x, \\ \sin(\pi \pm x) &= \mp\sin x, \\ \sin\!\left(\tfrac\pi2 - x\right) &= \cos x, \\ \sin\!\left(\tfrac\pi2 + x\right) &= \cos x . \end{aligned}$$</div>
  <table>
    <tr><th>\(x\)</th><th>\(0\)</th><th>\(\frac\pi6\)</th><th>\(\frac\pi4\)</th><th>\(\frac\pi3\)</th><th>\(\frac\pi2\)</th></tr>
    <tr><td>\(\sin x\)</td><td>\(0\)</td><td>\(\frac12\)</td><td>\(\frac{\sqrt2}{2}\)</td><td>\(\frac{\sqrt3}{2}\)</td><td>\(1\)</td></tr>
    <tr><td>\(\cos x\)</td><td>\(1\)</td><td>\(\frac{\sqrt3}{2}\)</td><td>\(\frac{\sqrt2}{2}\)</td><td>\(\frac12\)</td><td>\(0\)</td></tr>
    <tr><td>\(\tan x\)</td><td>\(0\)</td><td>\(\frac{\sqrt3}{3}\)</td><td>\(1\)</td><td>\(\sqrt3\)</td><td>non définie</td></tr>
  </table>
  <p>Mnémotechnique : pour les angles \(0, \frac\pi6, \frac\pi4, \frac\pi3, \frac\pi2\), le sinus vaut \(\frac{\sqrt0}{2}, \frac{\sqrt1}{2}, \frac{\sqrt2}{2}, \frac{\sqrt3}{2}, \frac{\sqrt4}{2}\), et le cosinus prend les mêmes valeurs dans l'ordre inverse.</p>
  <div class="prop-box">
    <strong>Formules d'addition et de duplication.</strong> Pour tous réels \(a\), \(b\) :
    <div class="formula" data-nom="Formules d'addition">$$\begin{aligned} \cos(a \pm b) &= \cos a\cos b \mp \sin a\sin b, \\ \sin(a \pm b) &= \sin a\cos b \pm \cos a\sin b , \end{aligned}$$</div>
    <div class="formula" data-nom="Formules de duplication">$$\begin{aligned} \cos(2a) &= \cos^2 a - \sin^2 a \\ &= 2\cos^2 a - 1 = 1 - 2\sin^2 a, \\ \sin(2a) &= 2\sin a\cos a . \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification géométrique</span>
    <span class="prompt">\(\cos(b - a)\) par le produit scalaire.</span>
    <div class="content"><p>Les vecteurs \(\vec u = (\cos a, \sin a)\) et \(\vec v = (\cos b, \sin b)\) sont unitaires et l'angle orienté de \(\vec u\) à \(\vec v\) vaut \(b - a\). Leur produit scalaire vaut donc, d'une part, \(\|\vec u\|\,\|\vec v\|\cos(b - a) = \cos(b - a)\), d'autre part, en coordonnées, \(\cos a\cos b + \sin a\sin b\). D'où \(\cos(a - b) = \cos a\cos b + \sin a\sin b\). On remplace \(b\) par \(-b\) pour \(\cos(a + b)\), puis \(a\) par \(\frac\pi2 - a\) pour obtenir $$\begin{aligned} \sin(a + b) &= \cos\big(\tfrac\pi2 - a - b\big) \\ &= \sin a\cos b + \cos a\sin b . \end{aligned}$$</p></div>
  </div>
  <p>En additionnant ou soustrayant les formules d'addition, on retrouve les produits, et en remplaçant \(\sin^2\) ou \(\cos^2\) dans \(\cos 2a\), la linéarisation des carrés :</p>
  <div class="formula" data-nom="Produits et carrés">$$\begin{aligned} \cos a\cos b &= \tfrac12\big[\cos(a - b) + \cos(a + b)\big], \\ \sin a\sin b &= \tfrac12\big[\cos(a - b) - \cos(a + b)\big], \\ \sin a\cos b &= \tfrac12\big[\sin(a + b) + \sin(a - b)\big], \end{aligned}$$</div>
  <div class="formula">$$\cos^2 a = \frac{1 + \cos 2a}{2}, \qquad \sin^2 a = \frac{1 - \cos 2a}{2} .$$</div>
  <div class="prop-box">
    <strong>Dérivées et inégalité.</strong> \(\sin\) et \(\cos\) sont \(2\pi\)-périodiques, dérivables, \(\sin' = \cos\), \(\cos' = -\sin\) (cela repose sur \(\frac{\sin h}{h} \to 1\) en 0). Pour tout réel \(x\) :
    <div class="formula" data-nom="|sin x| ≤ |x|">$$|\sin x| \le |x| .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux études de fonctions sur \([0, +\infty[\), puis la parité.</span>
    <div class="content"><p>Pour \(x \ge 0\), \(g(x) = x - \sin x\) a pour dérivée \(1 - \cos x \ge 0\) et \(g(0) = 0\) : \(\sin x \le x\). De même \(h(x) = x + \sin x\) vérifie \(h' = 1 + \cos x \ge 0\), \(h(0) = 0\) : \(-x \le \sin x\). Donc \(|\sin x| \le x = |x|\) pour \(x \ge 0\) ; pour \(x \lt 0\), on applique le résultat à \(-x\) (\(|\sin(-x)| = |\sin x|\)). Sur la figure, pour \(0 \le x \le \frac\pi2\), c'est le fait que le segment vertical de longueur \(\sin x\) est plus court que l'arc de longueur \(x\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Équations trigonométriques.</strong> Pour tous réels \(x\), \(a\) :
    <div class="formula" data-nom="Équations trigonométriques">$$\cos x = \cos a \iff x \equiv a \text{ ou } x \equiv -a\ [2\pi], \qquad \sin x = \sin a \iff x \equiv a \text{ ou } x \equiv \pi - a\ [2\pi] .$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — une équation et une inéquation</strong>
    <ol>
      <li>\(\sin(2x) = \frac12 = \sin\frac\pi6\) : \(2x \equiv \frac\pi6\) ou \(2x \equiv \frac{5\pi}{6}\ [2\pi]\), soit \(x \equiv \frac{\pi}{12}\) ou \(x \equiv \frac{5\pi}{12}\ [\pi]\) (on divise <strong>aussi</strong> la période par 2). Dans \([0, 2\pi[\) : \(\frac{\pi}{12}, \frac{5\pi}{12}, \frac{13\pi}{12}, \frac{17\pi}{12}\).</li>
      <li>\(\cos x \ge \frac12\) sur \([-\pi, \pi]\) : sur le cercle, les points d'abscisse au moins \(\frac12\) forment l'arc entre \(-\frac\pi3\) et \(\frac\pi3\) ; solutions \(\left[-\frac\pi3, \frac\pi3\right]\).</li>
      <li>$$\cos\frac{5\pi}{12} = \cos\left(\frac\pi4 + \frac\pi6\right) = \frac{\sqrt2}{2}\cdot\frac{\sqrt3}{2} - \frac{\sqrt2}{2}\cdot\frac12 = \frac{\sqrt6 - \sqrt2}{4} \approx 0{,}259 .$$</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier la seconde famille de solutions (\(\pi - a\) pour le sinus, \(-a\) pour le cosinus), ou oublier de diviser la période : \(2x \equiv a\ [2\pi]\) donne \(x \equiv \frac a2\ [\pi]\), deux fois plus de solutions sur \([0, 2\pi[\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · LA FONCTION TANGENTE</div>
  <h2>Une pente qui devient infinie</h2>
  <div class="intro">La tangente d'un angle est la pente de la droite qui fait cet angle avec l'horizontale : pente d'une route, angle d'un plan incliné, phase d'un filtre. C'est une fonction impaire, \(\pi\)-périodique, qui explose aux angles droits.</div>
  <div class="def-box">
    La fonction <strong>tangente</strong> est \(\tan x = \dfrac{\sin x}{\cos x}\), définie pour \(x \not\equiv \frac\pi2\ [\pi]\), c'est-à-dire sur \(\mathbb R \setminus \{\frac\pi2 + k\pi : k \in \mathbb Z\}\). Sur le cercle trigonométrique, \(\tan x\) est l'ordonnée du point \(T\) où la droite \((OM)\) coupe la tangente au cercle en \(A\) (figure du §8).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> \(\tan\) est impaire et \(\pi\)-périodique : \(\tan(\pi + x) = \tan x\), \(\tan(\pi - x) = -\tan x\). Elle est dérivable sur son ensemble de définition, avec
    <div class="formula" data-nom="Dérivée de tan">$$\tan' x = 1 + \tan^2 x = \frac{1}{\cos^2 x} ,$$</div>
    strictement croissante sur \(\left]-\frac\pi2, \frac\pi2\right[\), de limite \(-\infty\) en \(-\frac\pi2\) et \(+\infty\) en \(\frac\pi2\) : les droites \(x = \frac\pi2 + k\pi\) sont asymptotes verticales.
  </div>

  <div class="prop-box">
    <strong>Formule d'addition.</strong> Lorsque \(\tan a\), \(\tan b\) et \(\tan(a \pm b)\) sont définies :
    <div class="formula" data-nom="Formule d'addition de tan">$$\tan(a \pm b) = \frac{\tan a \pm \tan b}{1 \mp \tan a\tan b}, \qquad \tan(2a) = \frac{2\tan a}{1 - \tan^2 a} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Diviser par \(\cos a\cos b\).</span>
    <div class="content"><p>\(\tan(a + b) = \dfrac{\sin a\cos b + \cos a\sin b}{\cos a\cos b - \sin a\sin b}\) ; comme \(\cos a\cos b \neq 0\), on divise numérateur et dénominateur par ce produit, ce qui donne \(\dfrac{\tan a + \tan b}{1 - \tan a\tan b}\). On remplace \(b\) par \(-b\) (\(\tan\) est impaire) pour la différence, et \(b\) par \(a\) pour la duplication. La dérivée s'obtient par la formule du quotient : \(\tan' = \dfrac{\cos^2 + \sin^2}{\cos^2} = 1 + \tan^2\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — valeurs exactes et pente</strong>
    <ol>
      <li>$$\tan\frac{\pi}{12} = \tan\left(\frac\pi3 - \frac\pi4\right) = \dfrac{\sqrt3 - 1}{1 + \sqrt3} = \dfrac{(\sqrt3 - 1)^2}{3 - 1} = 2 - \sqrt3 \approx 0{,}268 .$$</li>
      <li>\(\tan\frac{3\pi}{4} = \tan\left(\pi - \frac\pi4\right) = -1\) et \(\tan\frac{7\pi}{6} = \tan\frac\pi6 = \frac{\sqrt3}{3}\).</li>
      <li>Une route qui monte de 12 m pour 100 m parcourus horizontalement (pente de 12 %) fait avec l'horizontale l'angle \(\theta\) tel que \(\tan\theta = 0{,}12\), soit \(\theta = \arctan 0{,}12 \approx 0{,}119\) rad \(\approx 6{,}8°\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la formule d'addition quand \(\tan a \tan b = 1\) : alors \(a + b \equiv \frac\pi2\ [\pi]\) et \(\tan(a + b)\) n'existe pas (exemple : \(a = b = \frac\pi4\)). Et la période de \(\tan\) est \(\pi\), pas \(2\pi\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · FONCTIONS CIRCULAIRES RÉCIPROQUES</div>
  <h2>Retrouver l'angle à partir de son sinus, cosinus ou tangente</h2>
  <div class="intro">Connaissant \(\sin\theta = 0{,}6\), quel est \(\theta\) ? Il y a une infinité de réponses ; on en choisit une, dans un intervalle où la fonction est bijective. C'est le rôle des fonctions \(\arcsin\), \(\arccos\), \(\arctan\) (notées aussi Arcsin, Arccos, Arctan), qui sont aussi des primitives usuelles.</div>
  <div class="def-box">
    <ul>
      <li>\(\sin\) est une bijection de \(\left[-\frac\pi2, \frac\pi2\right]\) sur \([-1, 1]\) : pour \(x \in [-1, 1]\), \(\arcsin x\) est l'unique \(\theta \in \left[-\frac\pi2, \frac\pi2\right]\) tel que \(\sin\theta = x\).</li>
      <li>\(\cos\) est une bijection de \([0, \pi]\) sur \([-1, 1]\) : \(\arccos x\) est l'unique \(\theta \in [0, \pi]\) tel que \(\cos\theta = x\).</li>
      <li>\(\tan\) est une bijection de \(\left]-\frac\pi2, \frac\pi2\right[\) sur \(\mathbb R\) : \(\arctan x\) est l'unique \(\theta \in \left]-\frac\pi2, \frac\pi2\right[\) tel que \(\tan\theta = x\).</li>
    </ul>
  </div>

<figcaption>Chaque graphe est le symétrique, par rapport à y = x, de celui de la restriction correspondante : sin sur [−π/2, π/2], cos sur [0, π], tan sur ]−π/2, π/2[. arcsin et arccos ont des tangentes verticales en ±1 (elles n'y sont pas dérivables) ; arctan a deux asymptotes horizontales y = ±π/2.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Dérivées.</strong> \(\arcsin\) et \(\arccos\) sont dérivables sur \(]-1, 1[\) (pas en \(\pm 1\), où leurs graphes ont des tangentes verticales), \(\arctan\) sur \(\mathbb R\) :
    <div class="formula" data-nom="Dérivées des fonctions circulaires réciproques">$$\arcsin' x = \frac{1}{\sqrt{1 - x^2}}, \qquad \arccos' x = \frac{-1}{\sqrt{1 - x^2}}, \qquad \arctan' x = \frac{1}{1 + x^2} .$$</div>
    \(\arcsin\) et \(\arctan\) sont impaires et strictement croissantes, \(\arccos\) strictement décroissante ; \(\arctan x \to \pm\frac\pi2\) en \(\pm\infty\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La formule de la réciproque, et le signe d'un cosinus.</span>
    <div class="content"><p>Pour \(x \in ]-1, 1[\), posons \(\theta = \arcsin x \in \left]-\frac\pi2, \frac\pi2\right[\) ; alors \(\sin'\theta = \cos\theta \gt 0\), et \(\arcsin' x = \dfrac{1}{\cos\theta}\). Or \(\cos\theta \ge 0\) sur cet intervalle et \(\cos^2\theta = 1 - \sin^2\theta = 1 - x^2\), donc \(\cos\theta = \sqrt{1 - x^2}\). Même calcul pour \(\arccos\) (avec \(\sin\theta \ge 0\) sur \([0, \pi]\)). Pour \(\arctan\) : \(\arctan' x = \dfrac{1}{1 + \tan^2\theta} = \dfrac{1}{1 + x^2}\).</p></div>
  </div>
  <p>Relations utiles : \(\arcsin x + \arccos x = \frac\pi2\) sur \([-1, 1]\) (la dérivée de la somme est nulle, et la valeur en 0 est \(\frac\pi2\)) ; \(\arctan x + \arctan\frac1x = \frac\pi2\) pour \(x \gt 0\) et \(-\frac\pi2\) pour \(x \lt 0\).</p>
  <div class="method-box">
    <strong>Exemple — valeurs, pièges et une somme d'arctangentes</strong>
    <ol>
      <li>\(\arcsin\frac12 = \frac\pi6\), \(\arccos\left(-\frac12\right) = \frac{2\pi}{3}\), \(\arctan\sqrt3 = \frac\pi3\), \(\arctan(-1) = -\frac\pi4\).</li>
      <li>\(\arcsin\big(\sin\frac{5\pi}{6}\big) = \arcsin\frac12 = \frac\pi6\), et non \(\frac{5\pi}{6}\), qui n'est pas dans \(\left[-\frac\pi2, \frac\pi2\right]\).</li>
      <li>\(\theta = \arctan\frac12 + \arctan\frac13\) : \(\tan\theta = \dfrac{\frac12 + \frac13}{1 - \frac16} = 1\), et \(\theta \in \left]0, \frac\pi2\right[\) (deux angles de \(\left]0, \frac\pi4\right[\)), donc \(\theta = \frac\pi4\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\arcsin(\sin x) = x\) pour tout \(x\) (vrai seulement sur \(\left[-\frac\pi2, \frac\pi2\right]\)), alors que \(\sin(\arcsin x) = x\) est vrai pour tout \(x \in [-1, 1]\). Ou conclure \(\theta = \frac\pi4\) de \(\tan\theta = 1\) sans avoir situé \(\theta\) dans un intervalle de longueur \(\pi\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · FONCTIONS HYPERBOLIQUES ch ET sh</div>
  <h2>Les cousines exponentielles de cos et sin</h2>
  <div class="intro">Le cosinus et le sinus hyperboliques sont la partie paire et la partie impaire de l'exponentielle. Ils apparaissent dans les solutions de \(y'' = \omega^2 y\), dans la forme d'un câble suspendu (la chaînette) et dans les primitives. Le programme ne retient que leurs propriétés de base et une seule formule.</div>
  <div class="def-box">
    Pour tout réel \(x\) : \(\operatorname{ch} x = \dfrac{\mathrm e^x + \mathrm e^{-x}}{2}\) (cosinus hyperbolique) et \(\operatorname{sh} x = \dfrac{\mathrm e^x - \mathrm e^{-x}}{2}\) (sinus hyperbolique). Ainsi \(\operatorname{ch} x + \operatorname{sh} x = \mathrm e^x\) et \(\operatorname{ch} x - \operatorname{sh} x = \mathrm e^{-x}\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> \(\operatorname{ch}\) est paire, \(\operatorname{sh}\) impaire ; elles sont dérivables avec \(\operatorname{ch}' = \operatorname{sh}\) et \(\operatorname{sh}' = \operatorname{ch}\). \(\operatorname{sh}\) est strictement croissante sur \(\mathbb R\) (sa dérivée \(\operatorname{ch}\) est strictement positive), \(\operatorname{ch}\) décroît sur \(]-\infty, 0]\), croît sur \([0, +\infty[\), de minimum \(\operatorname{ch} 0 = 1\). La seule formule exigible est
    <div class="formula" data-nom="ch² − sh² = 1">$$\operatorname{ch}^2 x - \operatorname{sh}^2 x = 1 .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un produit remarquable.</span>
    <div class="content"><p>$$\operatorname{ch}^2 x - \operatorname{sh}^2 x = (\operatorname{ch} x + \operatorname{sh} x)(\operatorname{ch} x - \operatorname{sh} x) = \mathrm e^x \times \mathrm e^{-x} = 1 .$$ Les dérivées viennent de \((\mathrm e^{-x})' = -\mathrm e^{-x}\). Comme \(\operatorname{sh}\) croît et \(\operatorname{sh} 0 = 0\), \(\operatorname{sh}\) est négative sur \(]-\infty, 0]\) et positive sur \([0, +\infty[\), d'où les variations de \(\operatorname{ch}\).</p></div>
  </div>

  <p>En \(+\infty\), \(\operatorname{ch} x\) et \(\operatorname{sh} x\) se comportent comme \(\frac{\mathrm e^x}{2}\) ; \(\operatorname{sh}\) réalise une bijection de \(\mathbb R\) sur \(\mathbb R\), \(\operatorname{ch}\) une bijection de \([0, +\infty[\) sur \([1, +\infty[\). Leurs réciproques sont hors programme ; pour résoudre une équation, on pose \(u = \mathrm e^x\).</p>
  <div class="method-box">
    <strong>Exemple — résoudre et mesurer</strong>
    <ol>
      <li>\(\operatorname{sh} x = \frac34 \iff \mathrm e^x - \mathrm e^{-x} = \frac32\). Avec \(u = \mathrm e^x \gt 0\) : \(u^2 - \frac32 u - 1 = 0\), de racines \(2\) et \(-\frac12\) ; seule \(u = 2\) convient, donc \(x = \ln 2\). Contrôle : \(\operatorname{sh}(\ln 2) = \frac{2 - 1/2}{2} = \frac34\).</li>
      <li><strong>Chaînette.</strong> Un câble suspendu prend la forme \(y = a\operatorname{ch}\frac xa\). Pour \(a = 10\) m et deux poteaux en \(x = \pm 5\) m, la flèche (hauteur des attaches au-dessus du point bas) vaut \(10\left(\operatorname{ch}\frac12 - 1\right) \approx 1{,}28\) m.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : recopier les formules de trigonométrie : \(\operatorname{ch}^2 - \operatorname{sh}^2 = 1\) (signe moins), et \(\operatorname{ch}' = +\operatorname{sh}\) (pas de signe moins, contrairement à \(\cos' = -\sin\)). \(\operatorname{ch} x \ge 1\) toujours, alors que \(\operatorname{sh}\) prend toutes les valeurs réelles.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · FONCTIONS À VALEURS COMPLEXES</div>
  <h2>Dériver \(t \mapsto \mathrm e^{i\omega t}\)</h2>
  <div class="intro">En physique, on représente un signal sinusoïdal par une exponentielle complexe : dériver revient alors à multiplier par \(i\omega\). Pour le justifier, on étend la dérivation aux fonctions d'une variable réelle à valeurs complexes, en passant par leurs parties réelle et imaginaire.</div>
  <div class="def-box">
    Soit \(f = u + iv : I \to \mathbb C\), avec \(u = \operatorname{Re} f\) et \(v = \operatorname{Im} f\) à valeurs réelles. \(f\) est <strong>dérivable</strong> sur \(I\) si \(u\) et \(v\) le sont, et alors \(f' = u' + i\,v'\).
  </div>
  <div class="prop-box">
    <strong>Règles.</strong> La dérivée d'une combinaison linéaire (à coefficients complexes), d'un produit et d'un quotient se calcule comme dans le cas réel. Si \(\varphi : I \to \mathbb C\) est dérivable :
    <div class="formula" data-nom="Dérivée de exp(φ)">$$\big(\mathrm e^{\varphi}\big)' = \varphi'\,\mathrm e^{\varphi}, \qquad\text{en particulier}\qquad \frac{\mathrm d}{\mathrm dt}\,\mathrm e^{\lambda t} = \lambda\,\mathrm e^{\lambda t} \quad (\lambda \in \mathbb C) .$$</div>
  </div>
  <p>La démonstration (écrire \(\mathrm e^{\varphi} = \mathrm e^{a}(\cos b + i\sin b)\) avec \(\varphi = a + ib\), puis dériver) est dans le chapitre « Continuité et dérivabilité », §12, qui montre aussi ce qui ne s'étend pas : le théorème de Rolle et l'égalité des accroissements finis. L'intégration des fonctions à valeurs complexes est dans le chapitre <a href="#integrales/cours">« Intégrales »</a>.</p>
  <div class="method-box">
    <strong>Exemple — dériver en passant par les complexes</strong>
    <ol>
      <li>\(z(t) = \mathrm e^{i\omega t}\) : \(z'(t) = i\omega\,\mathrm e^{i\omega t}\) et \(z''(t) = -\omega^2 z(t)\) ; en parties réelles, \((\cos\omega t)'' = -\omega^2\cos\omega t\). Pour \(\omega = 100\pi\) rad/s (50 Hz), dériver multiplie l'amplitude par \(\omega \approx 314\) s⁻¹.</li>
      <li>\(g(t) = t\,\mathrm e^{it}\) : \(g'(t) = \mathrm e^{it} + it\,\mathrm e^{it} = (1 + it)\,\mathrm e^{it}\). La partie réelle donne, sans dériver de produit réel, \((t\cos t)' = \operatorname{Re}\big((1 + it)(\cos t + i\sin t)\big) = \cos t - t\sin t\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : parler de fonction complexe « croissante » ou chercher où \(f'\) s'annule pour trouver un extremum : \(\mathbb C\) n'est pas ordonné. On raisonne sur le module ou sur les parties réelle et imaginaire.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Tangente hyperbolique et fonctions hyperboliques réciproques</h2>
  <div class="intro">Le programme de PTSI exclut explicitement la tangente hyperbolique et les réciproques de ch et sh. Elles apparaissent pourtant en physique (vitesse limite d'une chute avec frottement quadratique, profils de couche limite) ; on les rencontre aussi dans certaines tables de primitives.</div>
  <ul>
    <li><strong>Tangente hyperbolique</strong> : \(\operatorname{th} x = \dfrac{\operatorname{sh} x}{\operatorname{ch} x}\), impaire, strictement croissante de \(-1\) à \(1\), de dérivée \(1 - \operatorname{th}^2 x = \dfrac{1}{\operatorname{ch}^2 x}\).</li>
    <li><strong>Argument sinus hyperbolique</strong> : réciproque de \(\operatorname{sh}\), \(\operatorname{Argsh} x = \ln\big(x + \sqrt{x^2 + 1}\big)\), de dérivée \(\dfrac{1}{\sqrt{x^2 + 1}}\). On la retrouve par la méthode du §11 : \(\mathrm e^{2y} - 2x\,\mathrm e^y - 1 = 0\), d'où \(\mathrm e^y = x + \sqrt{x^2 + 1}\).</li>
    <li><strong>Argument cosinus hyperbolique</strong> : réciproque de \(\operatorname{ch}\) restreint à \([0, +\infty[\), \(\operatorname{Argch} x = \ln\big(x + \sqrt{x^2 - 1}\big)\) pour \(x \ge 1\).</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="fn-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · FONCTIONS RÉELLES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix gestes pour étudier et manipuler les fonctions usuelles : plan d'étude, valeurs exactes et équations trigonométriques, amplitude et phase, bijections et réciproques, inégalités par étude de fonction, graphes transformés, tangentes et arctangentes, fonctions hyperboliques, dérivation par les complexes.</div>

  <div class="method-box">
    <strong>Méthode 1 — Étudier une fonction (plan type)</strong>
    <ol>
      <li><strong>Domaine</strong> : exclure les valeurs interdites (dénominateur nul, \(\ln\) d'un nombre négatif ou nul, \(\sqrt{\ }\) d'un négatif, \(\arcsin\) hors de \([-1, 1]\), \(\tan\) en \(\frac\pi2 + k\pi\)).</li>
      <li><strong>Symétries</strong> : parité (si \(f(-x) = \pm f(x)\), étudier sur \([0, +\infty[\)), périodicité (étudier sur une période).</li>
      <li><strong>Dérivée</strong> : la calculer, la factoriser, étudier son signe ; en déduire le tableau de variations et les extremums.</li>
      <li><strong>Limites aux bornes</strong> : formes indéterminées par croissances comparées (l'exponentielle l'emporte sur les puissances, qui l'emportent sur le logarithme) ou en factorisant le terme dominant.</li>
      <li><strong>Graphe</strong> : points remarquables, tangentes horizontales, asymptotes, puis compléter par symétrie.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = x\,\mathrm e^{-x^2}\) est impaire ; \(f'(x) = (1 - 2x^2)\,\mathrm e^{-x^2}\) s'annule en \(\frac{1}{\sqrt2}\) ; maximum \(f\big(\frac{1}{\sqrt2}\big) = \frac{\mathrm e^{-1/2}}{\sqrt2} \approx 0{,}429\) ; \(f(x) \to 0\) en \(+\infty\) (croissances comparées).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Trouver une valeur exacte de sin, cos, tan</strong>
    <ol>
      <li>Ramener l'angle à \(\left[0, \frac\pi2\right]\) en le plaçant sur le cercle : écrire \(x = \pi \pm \theta\), \(-\theta\), \(\frac\pi2 \pm \theta\) ou \(\theta + 2k\pi\) avec \(\theta\) usuel.</li>
      <li>Lire le signe sur le cercle (quadrant), puis la valeur dans le tableau des angles usuels.</li>
      <li>Pour un angle comme \(\frac{\pi}{12}\) ou \(\frac{5\pi}{12}\), l'écrire comme somme ou différence d'angles usuels et appliquer une formule d'addition.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\cos\frac{2\pi}{3} = \cos\left(\pi - \frac\pi3\right) = -\frac12\) ; \(\sin\frac{7\pi}{6} = \sin\left(\pi + \frac\pi6\right) = -\frac12\) ; \(\tan\frac{5\pi}{6} = \tan\left(\pi - \frac\pi6\right) = -\frac{\sqrt3}{3}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Résoudre une équation ou une inéquation trigonométrique</strong>
    <ol>
      <li>Se ramener à \(\cos u = \cos a\), \(\sin u = \sin a\) ou \(\tan u = \tan a\) (au besoin avec \(\cos\left(\frac\pi2 - a\right) = \sin a\)).</li>
      <li>Appliquer : \(\cos u = \cos a \iff u \equiv \pm a\ [2\pi]\) ; \(\sin u = \sin a \iff u \equiv a\) ou \(u \equiv \pi - a\ [2\pi]\) ; \(\tan u = \tan a \iff u \equiv a\ [\pi]\).</li>
      <li>Isoler \(x\) en divisant aussi la période, puis lister les solutions dans l'intervalle demandé. Pour une inéquation, lire l'arc solution sur le cercle.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\cos(2x) = \cos x \iff 2x \equiv x\) ou \(2x \equiv -x\ [2\pi] \iff x \equiv 0\ [2\pi]\) ou \(x \equiv 0\ \left[\frac{2\pi}{3}\right]\). Dans \([0, 2\pi[\) : \(0, \frac{2\pi}{3}, \frac{4\pi}{3}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\sin x = \frac12\) a deux familles de solutions, \(\frac\pi6 + 2k\pi\) et \(\frac{5\pi}{6} + 2k\pi\) ; \(\arcsin\frac12\) n'en donne qu'une. Et si \(|a| \gt 1\), \(\sin x = a\) n'a aucune solution.</div>

  <div class="method-box">
    <strong>Méthode 4 — Écrire \(a\cos x + b\sin x\) sous la forme \(R\cos(x - \varphi)\)</strong>
    <ol>
      <li>Calculer l'amplitude \(R = \sqrt{a^2 + b^2}\) et factoriser : \(a\cos x + b\sin x = R\left(\frac aR\cos x + \frac bR\sin x\right)\).</li>
      <li>Trouver \(\varphi\) tel que \(\cos\varphi = \frac aR\) et \(\sin\varphi = \frac bR\) (les deux conditions : \(\varphi = \arctan\frac ba\) seulement si \(a \gt 0\)).</li>
      <li>Conclure par la formule d'addition : \(R\cos(x - \varphi) = R\cos\varphi\cos x + R\sin\varphi\sin x\). Le maximum vaut \(R\), atteint pour \(x \equiv \varphi\ [2\pi]\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\cos x + \sqrt3\sin x = 2\cos\left(x - \frac\pi3\right)\) (\(R = 2\), \(\cos\varphi = \frac12\), \(\sin\varphi = \frac{\sqrt3}{2}\)). Et \(-\cos x + \sin x = \sqrt2\cos\left(x - \frac{3\pi}{4}\right)\) : ici \(a \lt 0\), et \(\arctan(-1) = -\frac\pi4\) donnerait un mauvais signe.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Montrer qu'une fonction est bijective et étudier sa réciproque</strong>
    <ol>
      <li>Montrer que \(f\) est continue et strictement monotone sur l'intervalle \(I\) (dérivée de signe strict, sauf en des points isolés).</li>
      <li>Calculer les limites aux bornes : \(f\) est une bijection de \(I\) sur l'intervalle \(J\) qu'elles délimitent.</li>
      <li>Si possible, résoudre \(y = f(x)\) en \(x\) pour obtenir \(f^{-1}(y)\) ; sinon, utiliser \(\big(f^{-1}\big)'(y) = \dfrac{1}{f'(x)}\) avec \(y = f(x)\) et \(f'(x) \neq 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = \ln(1 + \mathrm e^x)\) croît strictement de \(0\) à \(+\infty\) : bijection de \(\mathbb R\) sur \(]0, +\infty[\), avec \(f^{-1}(y) = \ln(\mathrm e^y - 1)\). Comme \(f(0) = \ln 2\) et \(f'(0) = \frac12\), \(\big(f^{-1}\big)'(\ln 2) = 2\) (contrôle : \(\frac{\mathrm e^y}{\mathrm e^y - 1}\) vaut 2 en \(y = \ln 2\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Démontrer une inégalité par une étude de fonction</strong>
    <ol>
      <li>Tout passer dans un membre : pour montrer \(u(x) \le v(x)\) sur \(I\), poser \(g = v - u\).</li>
      <li>Étudier les variations de \(g\) (signe de \(g'\), éventuellement de \(g''\) si le signe de \(g'\) n'est pas lisible).</li>
      <li>Montrer que le minimum de \(g\) sur \(I\) (souvent atteint en un point où \(g\) s'annule) est positif ou nul ; préciser le cas d'égalité.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(x \ge 0\), \(g(x) = \ln(1 + x) - x + \frac{x^2}{2}\) vérifie \(g'(x) = \frac{1}{1 + x} - 1 + x = \frac{x^2}{1 + x} \ge 0\) et \(g(0) = 0\) : \(x - \frac{x^2}{2} \le \ln(1 + x) \le x\). Pour \(x = 0{,}1\) : \(0{,}095 \le 0{,}0953 \le 0{,}1\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Tracer un graphe transformé</strong>
    <ol>
      <li>Écrire la fonction sous la forme \(x \mapsto \lambda f\big(a(x + c)\big) + b\), avec \(f\) de graphe connu.</li>
      <li>Appliquer dans l'ordre : compression horizontale de rapport \(a\), translation de \(-c\) selon \((Ox)\), dilatation verticale de rapport \(\lambda\), translation de \(b\) selon \((Oy)\).</li>
      <li>Contrôler sur deux points calculés directement.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y = 2\sqrt{x + 1} - 3\) : le graphe de \(\sqrt{\ }\) décalé de 1 vers la gauche, dilaté par 2, descendu de 3. Il part de \((-1, -3)\) et passe par \((3, 1)\) (\(2\sqrt4 - 3 = 1\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Calculer avec la tangente et les arctangentes</strong>
    <ol>
      <li>Pour \(\tan(a \pm b)\), vérifier que \(\tan a\), \(\tan b\) sont définies et que \(1 \mp \tan a\tan b \neq 0\).</li>
      <li>Pour simplifier \(\theta = \arctan u + \arctan v\) : calculer \(\tan\theta = \frac{u + v}{1 - uv}\).</li>
      <li>Situer \(\theta\) dans un intervalle de longueur \(\pi\) (chaque arctangente est dans \(\left]-\frac\pi2, \frac\pi2\right[\)) pour choisir la bonne valeur.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\theta = \arctan 2 + \arctan 3\) : \(\tan\theta = \frac{5}{1 - 6} = -1\). Comme \(2 \gt 1\) et \(3 \gt 1\), chaque terme est dans \(\left]\frac\pi4, \frac\pi2\right[\), donc \(\theta \in \left]\frac\pi2, \pi\right[\) : \(\theta = \frac{3\pi}{4}\) (et non \(-\frac\pi4\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Calculer avec ch et sh</strong>
    <ol>
      <li>Revenir aux exponentielles : \(\operatorname{ch} x = \frac{\mathrm e^x + \mathrm e^{-x}}{2}\), \(\operatorname{sh} x = \frac{\mathrm e^x - \mathrm e^{-x}}{2}\).</li>
      <li>Pour une équation, poser \(u = \mathrm e^x \gt 0\), résoudre l'équation du second degré obtenue et ne garder que les racines strictement positives.</li>
      <li>Utiliser \(\operatorname{ch}^2 - \operatorname{sh}^2 = 1\) (seule formule exigible), \(\operatorname{ch}' = \operatorname{sh}\), \(\operatorname{sh}' = \operatorname{ch}\), \(\operatorname{ch} \ge 1\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\operatorname{ch} x = 2 \iff u + \frac1u = 4 \iff u^2 - 4u + 1 = 0 \iff u = 2 \pm \sqrt3\). Les deux racines sont positives et inverses l'une de l'autre : \(x = \pm\ln(2 + \sqrt3) \approx \pm 1{,}317\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la tangente hyperbolique \(\operatorname{th}\) et les réciproques \(\operatorname{Argsh}\), \(\operatorname{Argch}\) sont hors programme en PTSI : on résout les équations par \(u = \mathrm e^x\), sans elles. Et \(\operatorname{ch}' = +\operatorname{sh}\), sans signe moins.</div>

  <div class="method-box">
    <strong>Méthode 10 — Dériver en passant par l'exponentielle complexe</strong>
    <ol>
      <li>Reconnaître \(\mathrm e^{\alpha t}\cos(\omega t)\) ou \(\mathrm e^{\alpha t}\sin(\omega t)\) comme partie réelle ou imaginaire de \(\mathrm e^{(\alpha + i\omega)t}\).</li>
      <li>Dériver l'exponentielle complexe : \(\big(\mathrm e^{\lambda t}\big)' = \lambda\,\mathrm e^{\lambda t}\), et \(\big(\mathrm e^{\lambda t}\big)^{(n)} = \lambda^n \mathrm e^{\lambda t}\).</li>
      <li>Développer le produit \(\lambda\,\mathrm e^{\lambda t}\) et en prendre la partie réelle (ou imaginaire).</li>
    </ol>
    <p><em>Exemple éclair :</em> $$\big(\mathrm e^{-t}\cos 3t\big)' = \operatorname{Re}\big((-1 + 3i)\,\mathrm e^{-t}(\cos 3t + i\sin 3t)\big) = -\mathrm e^{-t}(\cos 3t + 3\sin 3t) .$$</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : \(\arcsin(\sin x) = x\) seulement si \(x \in \left[-\frac\pi2, \frac\pi2\right]\) ; \(\ln(x^2) = 2\ln|x|\) (et non \(2\ln x\), qui exigerait \(x \gt 0\)) ; \(\sqrt{x^2} = |x|\) ; la tangente n'est pas définie en \(\frac\pi2 + k\pi\) ; \(\operatorname{ch} x \ge 1\) toujours, alors que \(\operatorname{sh} x\) peut être négatif ; le graphe de \(x \mapsto f(x + a)\) se décale de \(a\) vers la gauche.</div>
</div>
</template>
