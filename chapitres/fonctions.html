  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Parité, périodicité, graphes transformés</h3>
  <div class="q"><strong>Q1.</strong> Étudier la parité de \(f(x)=x^3\sin x\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(g(x)=|\sin x|\) est périodique de période \(\pi\).</div>
  <div class="q"><strong>Q3.</strong> Décomposer \(h(x)=e^x\) en partie paire et partie impaire.</div>
  <div class="q"><strong>Q4.</strong> Sans calcul de dérivée, décrire le graphe de \(x \mapsto e^{x-2}+1\) et celui de \(x \mapsto e^{-x}\) à partir du graphe de \(\exp\). Donner leurs asymptotes horizontales.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(D_f=\mathbb R\) est symétrique et $$f(-x)=(-x)^3\sin(-x)=(-x^3)(-\sin x)=x^3\sin x=f(x) \ :$$ \(f\) est paire (produit de deux fonctions impaires).</p>
    <p><strong>Q2.</strong> $$g(x+\pi)=|\sin(x+\pi)|=|-\sin x|=|\sin x|=g(x) .$$ Période \(\pi\) (et c'est la plus petite, car \(g\) ne s'annule qu'aux multiples de \(\pi\)).</p>
    <p><strong>Q3.</strong> \(h_p(x)=\frac{e^x+e^{-x}}{2}=\operatorname{ch} x\) (paire), \(h_i(x)=\frac{e^x-e^{-x}}{2}=\operatorname{sh} x\) (impaire), et \(e^x = \operatorname{ch} x + \operatorname{sh} x\).</p>
    <p><strong>Q4.</strong> \(x \mapsto e^{x-2}+1\) : translation de 2 vers la <strong>droite</strong> (on retrouve en \(x = 2\) la valeur de \(\exp\) en 0), puis de 1 vers le haut ; elle passe par \((2, 2)\) et a pour asymptote \(y = 1\) en \(-\infty\). \(x \mapsto e^{-x}\) : symétrique du graphe de \(\exp\) par rapport à l'axe \((Oy)\), décroissante, d'asymptote \(y = 0\) en \(+\infty\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Formules trigonométriques — calcul exact</h3>
  <div class="q"><strong>Q1.</strong> Calculer \(\cos(75°)=\cos(\pi/4+\pi/6)\) exactement.</div>
  <div class="q"><strong>Q2.</strong> Linéariser \(\cos^2(x)\sin(x)\).</div>
  <div class="q"><strong>Q3.</strong> Résoudre \(\sin x=\sin(\pi/3)\) sur \([0,2\pi]\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> $$\cos(75°)=\cos45°\cos30°-\sin45°\sin30°=\frac{\sqrt2}{2}\cdot\frac{\sqrt3}{2}-\frac{\sqrt2}{2}\cdot\frac{1}{2}=\frac{\sqrt6-\sqrt2}{4} .$$</p>
    <p><strong>Q2.</strong> \(\cos^2x=\frac{1+\cos2x}{2}\), et \(\sin x\cos 2x=\frac12[\sin3x-\sin x]\) (formule de \(\sin a\cos b\)). Donc $$\cos^2x\sin x=\frac{\sin x+\sin x\cos2x}{2}=\frac{\sin x+\frac12[\sin3x-\sin x]}{2}=\frac{\sin x+\sin3x}{4} .$$</p>
    <p><strong>Q3.</strong> \(\sin x=\sin(\pi/3)\iff x\equiv\pi/3\) ou \(x\equiv\pi-\pi/3\ [2\pi]\). Sur \([0,2\pi]\) : \(x=\pi/3\) ou \(x=2\pi/3\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Fonctions réciproques — arctan</h3>
  <div class="q"><strong>Q1.</strong> Calculer \(\arctan(1)\), \(\arctan(\sqrt3)\), \(\arctan(-1)\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\arctan x+\arctan(1/x)=\pi/2\) pour \(x>0\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\displaystyle\int_0^1\frac{1}{1+x^2}\,\mathrm{d}x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\arctan(1)=\pi/4\), \(\arctan(\sqrt3)=\pi/3\), \(\arctan(-1)=-\pi/4\) (angles de \(]-\pi/2, \pi/2[\) de tangentes \(1\), \(\sqrt3\), \(-1\)).</p>
    <p><strong>Q2.</strong> Posons \(f(x)=\arctan x+\arctan(1/x)\) sur l'<strong>intervalle</strong> \(]0, +\infty[\). $$f'(x)=\frac{1}{1+x^2}+\frac{-1/x^2}{1+1/x^2}=\frac{1}{1+x^2}-\frac{1}{x^2+1}=0 .$$ Donc \(f\) est constante sur \(]0,+\infty[\), égale à \(f(1)=\pi/4+\pi/4=\pi/2\). (Sur \(]-\infty, 0[\), même calcul, mais la constante vaut \(-\pi/2\) : l'hypothèse \(x \gt 0\) est indispensable.)</p>
    <p><strong>Q3.</strong> \(\arctan\) est une primitive de \(x \mapsto \frac{1}{1+x^2}\) : $$\int_0^1\frac{dx}{1+x^2}=[\arctan x]_0^1=\pi/4-0=\pi/4 .$$</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Étude de fonction — monotonie et bijection</h3>
  <div class="statement">Soit \(f(x)=xe^{-x}\) sur \(\mathbb{R}^+\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(f'(x)\) et dresser le tableau de variations.</div>
  <div class="q"><strong>Q2.</strong> \(f\) est-elle injective sur \(\mathbb{R}^+\) ? sur \([0,1]\) ? Justifier.</div>
  <div class="q"><strong>Q3.</strong> Montrer que l'équation \(xe^{-x}=0{,}3\) a exactement deux solutions sur \(\mathbb{R}^+\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f'(x)=e^{-x}-xe^{-x}=e^{-x}(1-x)\). Positif pour \(x \lt 1\), nul en \(x=1\), négatif pour \(x \gt 1\). Maximum en \(x=1\) : \(f(1)=e^{-1}\approx0{,}368\). En \(+\infty\), \(f(x) = \frac{x}{e^x} \to 0\) (croissances comparées).</p>
    <p><strong>Q2.</strong> Sur \(\mathbb{R}^+\) : pas injective. En effet \(f\) croît strictement sur \([0,1]\), de \(f(0)=0\) à \(f(1)=1/e\), puis décroît strictement sur \([1,+\infty[\) vers 0 : toute valeur de \(]0,1/e[\) a donc deux antécédents (c'est le cas de 0,3, voir Q3). Sur \([0,1]\) : strictement croissante, donc injective.</p>
    <p><strong>Q3.</strong> \(0{,}3 \lt f(1)=1/e\approx0{,}368\). Sur \([0,1]\), \(f\) est continue et strictement croissante de 0 à \(1/e\) : elle prend la valeur 0,3 exactement une fois (théorème des valeurs intermédiaires et injectivité). Sur \([1,+\infty[\), elle décroît strictement de \(1/e\) vers 0 : encore exactement une fois. Soit deux solutions en tout (numériquement \(x \approx 0{,}489\) et \(x \approx 1{,}78\)).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Fonctions hyperboliques</h3>
  <div class="q"><strong>Q1.</strong> Définir \(\operatorname{ch} x\) et \(\operatorname{sh} x\). Montrer \(\operatorname{ch}^2 x-\operatorname{sh}^2 x=1\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(\operatorname{ch}(a+b)\) et \(\operatorname{sh}(a+b)\) (analogue des formules trig).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\operatorname{sh}:\mathbb{R}\to\mathbb{R}\) est bijective, puis résoudre l'équation \(\operatorname{sh} x = 2\) en posant \(u = e^x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\operatorname{ch} x=\frac{e^x+e^{-x}}{2}\), \(\operatorname{sh} x=\frac{e^x-e^{-x}}{2}\). $$\operatorname{ch}^2 x-\operatorname{sh}^2 x=\frac{(e^x+e^{-x})^2-(e^x-e^{-x})^2}{4}=\frac{4}{4}=1 .$$</p>
    <p><strong>Q2.</strong> \(\operatorname{ch}(a+b)=\operatorname{ch} a\operatorname{ch} b+\operatorname{sh} a\operatorname{sh} b\), \(\operatorname{sh}(a+b)=\operatorname{sh} a\operatorname{ch} b+\operatorname{ch} a\operatorname{sh} b\). (Preuve : développer les exponentielles. Ces formules ne sont pas exigibles : on les retrouve ainsi.)</p>
    <p><strong>Q3.</strong> \(\operatorname{sh}'(x)=\operatorname{ch} x\geq1>0\) : \(\operatorname{sh}\) est continue et strictement croissante, donc injective ; ses limites en \(\pm\infty\) sont \(\pm\infty\), donc elle est surjective sur \(\mathbb R\) (théorème des valeurs intermédiaires). Équation : \(e^x-e^{-x}=4\) ; avec \(u = e^x \gt 0\), \(u^2-4u-1=0\), de racines \(2\pm\sqrt5\). Seule \(u = 2+\sqrt5\) est positive, d'où l'unique solution \(x=\ln(2+\sqrt5)\approx 1{,}444\). <em>Pour aller plus loin (hors programme en PTSI)</em> : le même calcul avec 2 remplacé par \(y\) donne la réciproque de \(\operatorname{sh}\), \(\operatorname{Argsh} y=\ln\big(y+\sqrt{y^2+1}\big)\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Équations trigonométriques et amplitude</h3>
  <div class="statement">Dans les questions 2 et 3, \(a\) et \(b\) sont deux réels non tous deux nuls.</div>
  <div class="q"><strong>Q1.</strong> Résoudre \(2\cos^2x-3\cos x+1=0\) sur \([0,2\pi]\).</div>
  <div class="q"><strong>Q2.</strong> Montrer qu'il existe \(R \gt 0\) et \(\varphi\) réel tels que \(a\cos x+b\sin x = R\cos(x-\varphi)\) pour tout \(x\), et identifier \(R\) et \(\varphi\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(\sup_{x\in\mathbb{R}}(a\cos x+b\sin x)\) et montrer que ce sup est atteint. Application : \(3\cos x - 4\sin x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Posons \(c=\cos x\) : $$2c^2-3c+1=0\iff(2c-1)(c-1)=0\iff c=1/2$$ ou \(c=1\). \(c=1\Rightarrow x=0\) ou \(2\pi\). \(c=1/2\Rightarrow x=\pi/3\) ou \(x=5\pi/3\). Solutions : \(\{0,\pi/3,5\pi/3,2\pi\}\).</p>
    <p><strong>Q2.</strong> Posons \(R=\sqrt{a^2+b^2} \gt 0\). Le point \(\left(\frac aR, \frac bR\right)\) est sur le cercle trigonométrique, car \(\frac{a^2}{R^2} + \frac{b^2}{R^2} = 1\) : il existe donc \(\varphi\) tel que \(\cos\varphi=\frac aR\) et \(\sin\varphi=\frac bR\). Alors $$R\cos(x-\varphi)=R(\cos x\cos\varphi+\sin x\sin\varphi)=a\cos x+b\sin x .$$ L'angle \(\varphi\) est défini par ses <strong>deux</strong> lignes trigonométriques ; on a \(\varphi=\arctan(b/a)\) seulement si \(a>0\) (si \(a \lt 0\), il faut ajouter \(\pi\)).</p>
    <p><strong>Q3.</strong> \(a\cos x+b\sin x=R\cos(x-\varphi)\le R\), avec égalité pour \(x=\varphi\) : le sup vaut \(\sqrt{a^2+b^2}\) et c'est un maximum. Application : \(R=\sqrt{9+16}=5\), \(\cos\varphi=\frac35\), \(\sin\varphi=-\frac45\), soit \(\varphi = -\arctan\frac43 \approx -0{,}927\) ; le maximum de \(3\cos x - 4\sin x\) vaut 5.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Logarithmes, puissances, croissances comparées</h3>
  <div class="q"><strong>Q1.</strong> Calculer \(A = \ln 72 - 2\ln 3 - 3\ln 2\), \(B = 27^{2/3}\), \(C = 4^{\log_2 3}\) et une valeur approchée de \(D = \log_{10}(0{,}002)\) sachant que \(\log_{10} 2 \approx 0{,}301\).</div>
  <div class="q"><strong>Q2.</strong> Résoudre \(2^{x+1} = 3^x\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer les limites de \(\dfrac{(\ln x)^3}{x}\) et \(x^{10}\,e^{-x/10}\) en \(+\infty\), et de \(x\ln^2 x\) en \(0^+\).</div>
  <div class="q"><strong>Q4.</strong> Combien de chiffres binaires (bits) faut-il pour écrire \(N = 10^9\) en base 2 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(A = \ln\frac{72}{9 \times 8} = \ln 1 = 0\). \(B = \big(27^{1/3}\big)^2 = 3^2 = 9\). \(C = (2^2)^{\log_2 3} = \big(2^{\log_2 3}\big)^2 = 3^2 = 9\). $$D = \log_{10}(2 \times 10^{-3}) = \log_{10} 2 - 3 \approx -2{,}699 .$$</p>
    <p><strong>Q2.</strong> Les deux membres sont strictement positifs ; on prend le logarithme : $$(x + 1)\ln 2 = x\ln 3 \iff x(\ln 3 - \ln 2) = \ln 2 \iff x = \dfrac{\ln 2}{\ln(3/2)} \approx 1{,}710 .$$</p>
    <p><strong>Q3.</strong> Par croissances comparées, les trois limites sont nulles : un logarithme (même au cube) est négligeable devant \(x\) ; une puissance (même \(x^{10}\)) est négligeable devant \(e^{x/10}\) ; et en \(0^+\), \(x^\alpha|\ln x|^\beta \to 0\) avec \(\alpha = 1\), \(\beta = 2\).</p>
    <p><strong>Q4.</strong> Un entier \(N\) s'écrit avec \(m\) bits si \(2^{m-1} \le N \lt 2^m\), soit \(m = \lfloor\log_2 N\rfloor + 1\). Ici \(\log_2 10^9 = \frac{9\ln 10}{\ln 2} \approx 29{,}90\), donc 30 bits ($$2^{29} \approx 5{,}4 \times 10^8 \le 10^9 \lt 2^{30} \approx 1{,}07 \times 10^9$$).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>La fonction tangente</h3>
  <div class="q"><strong>Q1.</strong> À l'aide de la formule de \(\tan(2a)\), calculer \(\tan\frac\pi8\).</div>
  <div class="q"><strong>Q2.</strong> Résoudre \(\tan(2x) = \sqrt3\) sur \(\left]-\frac\pi2, \frac\pi2\right[\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\tan x \ge x\) pour tout \(x \in \left[0, \frac\pi2\right[\).</div>
  <div class="q"><strong>Q4.</strong> (Formule de Machin.) On pose \(a = \arctan\frac15\) et \(b = \arctan\frac{1}{239}\). Calculer \(\tan(2a)\), \(\tan(4a)\), puis \(\tan(4a - b)\). En déduire que \(\pi = 16\arctan\frac15 - 4\arctan\frac{1}{239}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(t = \tan\frac\pi8 \gt 0\) (car \(\frac\pi8 \in \left]0, \frac\pi2\right[\)) : \(1 = \tan\frac\pi4 = \frac{2t}{1 - t^2}\), soit \(t^2 + 2t - 1 = 0\), de racines \(-1 \pm \sqrt2\). Seule la racine positive convient : \(\tan\frac\pi8 = \sqrt2 - 1 \approx 0{,}414\).</p>
    <p><strong>Q2.</strong> $$\tan(2x) = \tan\frac\pi3 \iff 2x \equiv \frac\pi3\ [\pi] \iff x \equiv \frac\pi6\ \left[\frac\pi2\right] .$$ Dans \(\left]-\frac\pi2, \frac\pi2\right[\) : \(x = -\frac\pi3\) ou \(x = \frac\pi6\) (on vérifie que \(2x\) n'est pas un \(\frac\pi2 + k\pi\) : \(\tan\left(-\frac{2\pi}{3}\right) = \tan\frac\pi3 = \sqrt3\)).</p>
    <p><strong>Q3.</strong> \(g(x) = \tan x - x\) a pour dérivée \(1 + \tan^2 x - 1 = \tan^2 x \ge 0\) sur \(\left[0, \frac\pi2\right[\), et \(g(0) = 0\) : \(g \ge 0\). Avec \(|\sin x| \le |x|\), on obtient l'encadrement \(\sin x \le x \le \tan x\) sur \(\left[0, \frac\pi2\right[\).</p>
    <p><strong>Q4.</strong> \(\tan(2a) = \dfrac{2/5}{1 - 1/25} = \dfrac{5}{12}\), puis \(\tan(4a) = \dfrac{10/12}{1 - 25/144} = \dfrac{120}{119}\). Enfin $$\tan(4a - b) = \frac{\frac{120}{119} - \frac{1}{239}}{1 + \frac{120}{119 \times 239}} = \frac{120 \times 239 - 119}{119 \times 239 + 120} = \frac{28\,561}{28\,561} = 1 .$$ Or \(0 \lt a \lt \arctan\frac{1}{\sqrt3} = \frac\pi6\) donne \(0 \lt 4a \lt \frac{2\pi}{3}\), et plus précisément \(\tan(4a) = \frac{120}{119} \gt 0\) avec \(4a \lt \frac{2\pi}3\) impose \(4a \in \left]0, \frac\pi2\right[\) ; comme \(0 \lt b \lt \frac\pi4\), \(4a - b \in \left]-\frac\pi4, \frac\pi2\right[\). Le seul angle de cet intervalle de tangente 1 est \(\frac\pi4\) : \(4a - b = \frac\pi4\), d'où la formule (qui a permis de calculer des centaines de décimales de \(\pi\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Inégalités usuelles et encadrements</h3>
  <div class="statement">On utilise \(\ln(1 + u) \le u\) pour \(u \gt -1\), et \(|\sin x| \le |x|\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\dfrac{x}{1 + x} \le \ln(1 + x) \le x\) pour tout \(x \gt -1\).</div>
  <div class="q"><strong>Q2.</strong> En déduire que \(\dfrac{1}{n+1} \le \ln(n+1) - \ln n \le \dfrac1n\) pour \(n \ge 1\), puis que \(\ln(n+1) \le \sum_{k=1}^{n} \dfrac1k \le 1 + \ln n\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\left(1 + \frac1n\right)^n \le e \le \left(1 + \frac1n\right)^{n+1}\) pour \(n \ge 1\). Encadrer \(e\) avec \(n = 100\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(\cos x \ge 1 - \dfrac{x^2}{2}\) pour tout réel \(x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La majoration est l'inégalité du cours. Pour la minoration, posons \(u = -\frac{x}{1 + x}\) ; comme \(1 + u = \frac{1}{1 + x} \gt 0\), \(u \gt -1\) et \(\ln(1 + u) \le u\) s'écrit \(-\ln(1 + x) \le -\frac{x}{1 + x}\), soit \(\frac{x}{1 + x} \le \ln(1 + x)\).</p>
    <p><strong>Q2.</strong> Avec \(x = \frac1n\) : \(\ln(n+1) - \ln n = \ln\left(1 + \frac1n\right)\) et \(\frac{1/n}{1 + 1/n} = \frac{1}{n+1}\). On somme la minoration de \(k = 1\) à \(n\) (en l'écrivant \(\frac1k \ge \ln(k+1) - \ln k\)) : la somme télescope, \(\sum_{k=1}^{n} \frac1k \ge \ln(n+1)\). On somme la majoration écrite \(\frac{1}{k+1} \le \ln(k+1) - \ln k\) de \(k = 1\) à \(n - 1\) : \(\sum_{k=2}^{n} \frac1k \le \ln n\), d'où \(\sum_{k=1}^{n} \frac1k \le 1 + \ln n\). La somme des inverses croît donc comme \(\ln n\).</p>
    <p><strong>Q3.</strong> D'après Q2, \(\frac{1}{n+1} \le \ln\left(1 + \frac1n\right) \le \frac1n\). En multipliant par \(n\) : \(n\ln\left(1 + \frac1n\right) \le 1\) ; par \(n + 1\) : \((n+1)\ln\left(1 + \frac1n\right) \ge 1\). L'exponentielle étant croissante, \(\left(1 + \frac1n\right)^n \le e \le \left(1 + \frac1n\right)^{n+1}\). Pour \(n = 100\) : \(2{,}7048 \le e \le 2{,}7319\).</p>
    <p><strong>Q4.</strong> Soit \(g(x) = \cos x - 1 + \frac{x^2}{2}\), paire. Pour \(x \ge 0\), \(g'(x) = x - \sin x \ge 0\) (car \(\sin x \le |x| = x\)) et \(g(0) = 0\), donc \(g(x) \ge 0\) ; par parité, c'est vrai pour tout \(x\). Exemple : \(\cos 0{,}1 \approx 0{,}99500 \ge 0{,}995\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Réciproques et dérivées</h3>
  <div class="q"><strong>Q1.</strong> Montrer que \(f(x) = x^3 + x + 1\) réalise une bijection de \(\mathbb R\) sur \(\mathbb R\), puis calculer \(\big(f^{-1}\big)'(1)\) et \(\big(f^{-1}\big)'(3)\).</div>
  <div class="q"><strong>Q2.</strong> Donner l'ensemble de dérivabilité et la dérivée de \(x \mapsto \arcsin\frac x2\) et de \(x \mapsto \arctan(e^x)\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(h(x) = \arctan\dfrac{1 + x}{1 - x} - \arctan x\) pour \(x \neq 1\). Calculer \(h'\), puis simplifier \(h\) sur chacun des intervalles \(]-\infty, 1[\) et \(]1, +\infty[\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f'(x) = 3x^2 + 1 \gt 0\) : \(f\) est continue, strictement croissante, de limites \(-\infty\) et \(+\infty\) : bijection de \(\mathbb R\) sur \(\mathbb R\). Comme \(f(0) = 1\) et \(f(1) = 3\) : \(\big(f^{-1}\big)'(1) = \frac{1}{f'(0)} = 1\) et \(\big(f^{-1}\big)'(3) = \frac{1}{f'(1)} = \frac14\).</p>
    <p><strong>Q2.</strong> \(\arcsin\) est dérivable sur \(]-1, 1[\), donc \(x \mapsto \arcsin\frac x2\) l'est pour \(\frac x2 \in \,]-1, 1[\), soit sur \(]-2, 2[\) : $$\left(\arcsin\frac x2\right)' = \frac{1/2}{\sqrt{1 - x^2/4}} = \frac{1}{\sqrt{4 - x^2}} .$$ \(x \mapsto \arctan(e^x)\) est dérivable sur \(\mathbb R\), de dérivée \(\dfrac{e^x}{1 + e^{2x}}\) (dérivée d'une composée).</p>
    <p><strong>Q3.</strong> Avec \(u(x) = \frac{1 + x}{1 - x}\), \(u'(x) = \frac{2}{(1 - x)^2}\) et \(1 + u^2 = \frac{2(1 + x^2)}{(1 - x)^2}\), donc \(\big(\arctan u\big)' = \frac{u'}{1 + u^2} = \frac{1}{1 + x^2}\), et \(h' = 0\). Sur chaque <strong>intervalle</strong>, \(h\) est constante : sur \(]-\infty, 1[\), \(h = h(0) = \frac\pi4\) ; sur \(]1, +\infty[\), \(h\) est égale à sa limite en \(+\infty\), où \(u \to -1\) : \(h = -\frac\pi4 - \frac\pi2 = -\frac{3\pi}{4}\). Une dérivée nulle ne donne une constante que sur un intervalle.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Dérivées partielles et fonctions à valeurs complexes</h3>
  <div class="q"><strong>Q1.</strong> Calculer les dérivées partielles de \(f(x, y) = x\,e^{xy}\), puis leurs valeurs au point \((1, 0)\).</div>
  <div class="q"><strong>Q2.</strong> Le volume d'un cylindre est \(V(r, h) = \pi r^2 h\). Calculer \(\frac{\partial V}{\partial r}\) et \(\frac{\partial V}{\partial h}\) pour \(r = 5\) cm et \(h = 10\) cm. À quelle grandeur le volume est-il le plus sensible ?</div>
  <div class="q"><strong>Q3.</strong> Dériver \(z(t) = e^{(1 + 2i)t}\) et en déduire, sans dériver de produit, la dérivée de \(t \mapsto e^t\sin(2t)\).</div>
  <div class="q"><strong>Q4.</strong> Soit \(g(t) = e^t\cos t\). En écrivant \(1 + i = \sqrt2\,e^{i\pi/4}\), montrer que \(g^{(n)}(t) = 2^{n/2}\,e^t\cos\left(t + n\frac\pi4\right)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À \(y\) fixé, on dérive un produit : \(\frac{\partial f}{\partial x} = e^{xy} + xy\,e^{xy} = (1 + xy)\,e^{xy}\). À \(x\) fixé : \(\frac{\partial f}{\partial y} = x \times x\,e^{xy} = x^2 e^{xy}\). Au point \((1, 0)\) : \(1\) et \(1\).</p>
    <p><strong>Q2.</strong> \(\frac{\partial V}{\partial r} = 2\pi r h = 100\pi \approx 314\) cm³/cm et \(\frac{\partial V}{\partial h} = \pi r^2 = 25\pi \approx 78{,}5\) cm³/cm. Une erreur de 1 mm sur le rayon change le volume d'environ \(31{,}4\) cm³, une erreur de 1 mm sur la hauteur d'environ \(7{,}9\) cm³ : le volume est plus sensible au rayon (il y figure au carré).</p>
    <p><strong>Q3.</strong> $$z'(t) = (1 + 2i)\,e^{(1 + 2i)t} = (1 + 2i)\,e^t(\cos 2t + i\sin 2t) .$$ Comme \(e^t\sin 2t = \operatorname{Im} z(t)\), sa dérivée est \(\operatorname{Im} z'(t) = e^t(2\cos 2t + \sin 2t)\). Contrôle direct : \(e^t\sin 2t + 2e^t\cos 2t\).</p>
    <p><strong>Q4.</strong> \(g = \operatorname{Re}\big(e^{(1+i)t}\big)\), donc \(g^{(n)} = \operatorname{Re}\big((1 + i)^n e^{(1+i)t}\big)\). Or \((1 + i)^n = 2^{n/2} e^{in\pi/4}\), d'où $$g^{(n)}(t) = 2^{n/2} e^t \operatorname{Re}\big(e^{i(t + n\pi/4)}\big) = 2^{n/2} e^t\cos\left(t + n\frac\pi4\right) .$$ Pour \(n = 1\) : \(\sqrt2\,e^t\cos\left(t + \frac\pi4\right) = e^t(\cos t - \sin t)\), la dérivée attendue.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ☆</span>
  <h3>Étude d'une fonction et réciproque</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format de l'épreuve de Mathématiques PT (thème <em>fonctions réelles</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    On considère \(f : [0,+\infty[ \to \mathbb{R}\), \(f(x) = \dfrac{2x}{x+1}\).
  </div>

  <p class="exo-part">Partie A — Variations et bijection</p>
  <div class="q"><strong>A1.</strong> Étudier les variations de \(f\) et déterminer \(\lim_{x\to+\infty} f(x)\). Montrer que \(f\) réalise une bijection de \([0,+\infty[\) sur un intervalle à préciser.</div>
  <div class="q"><strong>A2.</strong> Expliciter la réciproque \(f^{-1}\).</div>
  <div class="q"><strong>A3.</strong> Calculer \(\big(f^{-1}\big)'(1)\) de deux façons : par la formule de la dérivée d'une réciproque, puis à partir de A2.</div>

  <p class="exo-part">Partie B — Équations exponentielles</p>
  <div class="q"><strong>B1.</strong> Résoudre dans \(\mathbb{R}\) l'équation \(e^{2x} - 3e^x + 2 = 0\).</div>
  <div class="q"><strong>B2.</strong> Résoudre l'inéquation \(e^{2x} - 3e^x + 2 \le 0\).</div>
  <div class="q"><strong>B3.</strong> Résoudre \(\operatorname{ch} x = \frac54\).</div>

  <p class="exo-part">Partie C — Un encadrement</p>
  <div class="q"><strong>C1.</strong> À l'aide de l'inégalité \(e^x \ge 1 + x\), montrer que \(f(x) \le 2\left(1 - e^{-x}\right)\) pour tout \(x \ge 0\).</div>
  <div class="q"><strong>C2.</strong> En déduire que \(f^{-1}(y) \ge -\ln\left(1 - \frac y2\right)\) pour tout \(y \in [0, 2[\), et vérifier ce résultat pour \(y = 1\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> $$f'(x) = \dfrac{2(x+1) - 2x}{(x+1)^2} = \dfrac{2}{(x+1)^2} > 0 \ :$$ \(f\) est strictement croissante. \(f(0)=0\) et \(\lim_{+\infty} f = 2\). Continue et strictement croissante, \(f\) réalise une bijection de \([0,+\infty[\) sur \([0,2[\).</p>
    <p><strong>A2.</strong> \(y = \dfrac{2x}{x+1}\) ⟹ \(y(x+1)=2x\) ⟹ \(x(2-y)=y\) ⟹ \(x = \dfrac{y}{2-y}\). Donc \(f^{-1}(y) = \dfrac{y}{2-y}\) sur \([0,2[\).</p>
    <p><strong>A3.</strong> \(f(1) = 1\), donc \(\big(f^{-1}\big)'(1) = \dfrac{1}{f'(1)} = \dfrac{1}{2/4} = 2\). Directement : \(\big(f^{-1}\big)'(y) = \dfrac{(2 - y) + y}{(2 - y)^2} = \dfrac{2}{(2 - y)^2}\), qui vaut 2 en \(y = 1\).</p>
    <p><strong>B1.</strong> En posant \(X = e^x > 0\) : \(X^2 - 3X + 2 = 0\) ⟹ \(X = 1\) ou \(X = 2\). D'où \(e^x = 1\) (soit \(x=0\)) ou \(e^x = 2\) (soit \(x = \ln 2\)).</p>
    <p><strong>B2.</strong> $$X^2 - 3X + 2 = (X - 1)(X - 2) \le 0 \iff 1 \le X \le 2 ,$$ soit \(1 \le e^x \le 2\), et par croissance de \(\ln\), \(0 \le x \le \ln 2\) : solutions \([0, \ln 2]\).</p>
    <p><strong>B3.</strong> \(\frac{e^x + e^{-x}}{2} = \frac54\) ; avec \(X = e^x\) : \(X + \frac1X = \frac52\), soit \(2X^2 - 5X + 2 = 0\), de racines \(2\) et \(\frac12\), toutes deux positives. Donc \(x = \ln 2\) ou \(x = -\ln 2\) (\(\operatorname{ch}\) est paire).</p>
    <p><strong>C1.</strong> Pour \(x \ge 0\), \(e^x \ge 1 + x \gt 0\), donc \(e^{-x} \le \frac{1}{1 + x}\) et \(1 - e^{-x} \ge 1 - \frac{1}{1 + x} = \frac{x}{1 + x}\). En multipliant par 2 : \(f(x) \le 2(1 - e^{-x})\), avec égalité seulement en 0.</p>
    <p><strong>C2.</strong> Soit \(y \in [0, 2[\) et \(x = f^{-1}(y) \ge 0\). Par C1, \(y = f(x) \le 2(1 - e^{-x})\), donc \(e^{-x} \le 1 - \frac y2\), avec \(1 - \frac y2 \gt 0\). Par croissance de \(\ln\) : \(-x \le \ln\left(1 - \frac y2\right)\), soit \(f^{-1}(y) \ge -\ln\left(1 - \frac y2\right)\). Pour \(y = 1\) : \(f^{-1}(1) = 1 \ge \ln 2 \approx 0{,}693\).</p>
