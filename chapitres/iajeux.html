  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Affectation : {0, 1}, {5, 6}, {10, 11} ; centres 0,5 ; 5,5 ; 10,5. Les groupes ne changent plus. Inertie : six écarts de 0,5, soit \(6 \times 0{,}25 = 1{,}5\).</p>

kmoyennes(P, [(0,), (5,), (10,)])    <span class="cmt"># centres 0.5, 5.5, 10.5</span>
kmoyennes(P, [(0,), (1,), (5,)])     <span class="cmt"># centres 0, 1, 8</span></pre>

    <p><strong>Q4.</strong> \(\binom{6}{3} = 20\) choix. On relance l'algorithme depuis plusieurs initialisations tirées au hasard et on garde la partition d'inertie minimale (fonction <span class="code-inline">meilleur_partitionnement</span> du cours, §5) ; ici, il suffit qu'un départ prenne un point dans chaque paquet.</p>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ☆ ☆</span>
  <h3>Qui prend la dernière perd</h3>
  <div class="statement">Variante du jeu des allumettes : chacun à son tour retire 1, 2 ou 3 allumettes ; celui qui prend la dernière <strong>perd</strong>. \(J_1\) commence.</div>
  <div class="q"><strong>Q1.</strong> Décrire les états, les coups et les états finals. Quel est l'état final gagnant pour \(J_1\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer à la main l'attracteur pour \(J_1\) jusqu'à 9 allumettes. Quelles sont les positions \((a, 1)\) gagnantes ?</div>
  <div class="q"><strong>Q3.</strong> Conjecturer la règle générale, donner une stratégie gagnante et la prouver.</div>
  <div class="q"><strong>Q4.</strong> Adapter la fonction <span class="code-inline">jeu_allumettes</span> du cours et vérifier la conjecture jusqu'à 20 allumettes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> États \((a, j)\) : \(a\) allumettes restent, \(j\) doit jouer. Coups : \((a, j) \to (a - r, 3 - j)\) pour \(r \in \{1, 2, 3\}\), \(r \leq a\). Finals : \(a = 0\). Dans \((0, 1)\), c'est \(J_2\) qui vient de prendre la dernière : il a perdu, \((0, 1)\) est gagnant pour \(J_1\) ; \((0, 2)\) est gagnant pour \(J_2\).</p>
    <p><strong>Q2.</strong> Rang 0 : \((0, 1)\). Rang 1 : les états de \(J_2\) dont tous les coups mènent dans l'attracteur : \((1, 2)\) (son seul coup mène en \((0, 1)\)). Rang 2 : les états de \(J_1\) qui peuvent jouer vers \((1, 2)\) : \((2, 1), (3, 1), (4, 1)\). Rang 3 : \((5, 2)\), dont les trois coups mènent en \((4, 1), (3, 1), (2, 1)\). Rang 4 : \((6, 1), (7, 1), (8, 1)\). Rang 5 : \((9, 2)\). Et \((9, 1)\) ? Ses coups mènent en \((8, 2), (7, 2), (6, 2)\), qui ne sont pas dans l'attracteur : \((9, 1)\) est perdante pour \(J_1\), comme \((1, 1)\) et \((5, 1)\). Positions gagnantes : \(a \in \{2, 3, 4, 6, 7, 8\}\) ; perdantes : 1, 5, 9.</p>
    <p><strong>Q3.</strong> Conjecture : \((a, 1)\) est gagnante si et seulement si \(a \bmod 4 \neq 1\). Stratégie : laisser à l'adversaire un nombre \(\equiv 1 \pmod 4\), en retirant \((a - 1) \bmod 4\) allumettes (entre 1 et 3 quand \(a \bmod 4 \neq 1\)). Invariant : après chaque coup de \(J_1\), il reste \(4q + 1\) allumettes. Depuis \(4q + 1\) avec \(q \geq 1\), \(J_2\) en retire 1 à 3 et laisse entre \(4q - 2\) et \(4q\), d'où \(J_1\) revient à \(4(q - 1) + 1\). Variant : le nombre d'allumettes décroît. La partie finit avec \(J_2\) face à 1 allumette : il doit la prendre et perd.</p>
    <pre class="codeblock"><span class="kw">def</span> jeu_misere(n: int) -&gt; tuple:
    <span class="str">"""n allumettes ; on en retire 1, 2 ou 3 ; qui prend la dernière PERD.</span>
<span class="str">    États (a, j) numérotés par le dictionnaire num, comme au cours."""</span>
    num = {}
    <span class="kw">for</span> a <span class="kw">in</span> range(n + 1):
        <span class="kw">for</span> j <span class="kw">in</span> [1, 2]:
            num[(a, j)] = len(num)
    G = [[] <span class="kw">for</span> e <span class="kw">in</span> range(len(num))]
    joueur = [0] * len(num)
    <span class="kw">for</span> a, j <span class="kw">in</span> num.keys():
        joueur[num[(a, j)]] = j
        <span class="kw">for</span> r <span class="kw">in</span> [1, 2, 3]:
            <span class="kw">if</span> r &lt;= a:
                G[num[(a, j)]].append(num[(a - r, 3 - j)])
    <span class="cmt"># (0, 1) : J2 a pris la dernière, il a perdu : J1 gagne</span>
    <span class="kw">return</span> G, joueur, num, [num[(0, 1)]], [num[(0, 2)]]</pre>
    <p><strong>Q4.</strong> Seule change la liste des retraits (\([1, 2, 3]\)) et l'état final gagnant pour \(J_1\) : \((0, 1)\) au lieu de \((0, 2)\). Avec la fonction <span class="code-inline">attracteur</span> du cours, les positions \((a, 1)\) gagnantes jusqu'à 20 sont exactement celles où \(a \bmod 4 \neq 1\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Minimax à la main</h3>
  <div class="statement">\(J_1\) doit jouer et dispose de trois coups A, B, C. Après chacun, \(J_2\) a plusieurs réponses, qui mènent à des états dont l'heuristique (du point de vue de \(J_1\)) vaut : après A : 4, 8, 6 ; après B : 2, 9 ; après C : 5, 7, 6.</div>
  <div class="q"><strong>Q1.</strong> Calculer la valeur minimax à la profondeur 2 de chaque coup, puis de l'état courant. Quel coup \(J_1\) joue-t-il ?</div>
  <div class="q"><strong>Q2.</strong> Un joueur naïf vise l'état de plus grande heuristique. Quel coup jouerait-il, et que risque-t-il ?</div>
  <div class="q"><strong>Q3.</strong> On découvre que l'état de valeur 7 après C est en fait gagnant pour \(J_2\) (valeur \(-100\)). Le choix change-t-il ?</div>
  <div class="q"><strong>Q4.</strong> Avec 3 coups par état, combien d'états évalue-t-on à la profondeur 6 ? À la profondeur 10 ? Pourquoi la qualité de l'heuristique compte-t-elle autant que la profondeur ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(J_2\) minimise : A vaut \(\min(4, 8, 6) = 4\), B vaut \(\min(2, 9) = 2\), C vaut \(\min(5, 7, 6) = 5\). \(J_1\) maximise : l'état courant vaut 5, et \(J_1\) joue C.</p>
    <p><strong>Q2.</strong> Il jouerait B pour viser 9, mais \(J_2\) répondrait vers 2, la pire valeur de toutes. Minimax suppose que l'adversaire joue au mieux pour lui.</p>
    <p><strong>Q3.</strong> C vaut alors \(\min(5, -100, 6) = -100\) : \(J_2\) a une réponse gagnante. A (valeur 4) devient le meilleur coup. Une seule réponse adverse suffit à disqualifier un coup.</p>
    <p><strong>Q4.</strong> \(3^6 = 729\) feuilles à la profondeur 6, \(3^{10} = 59\,049\) à la profondeur 10 : le coût est exponentiel en la profondeur. À temps de calcul fixé, une heuristique plus juste permet de jouer mieux sans aller plus profond ; une heuristique trompeuse égare minimax quelle que soit la profondeur atteignable (effet d'horizon).</p>
    <pre class="codeblock"><span class="kw">def</span> minimax(G: list, joueur: list, h: list, s: int, p: int) -&gt; float:
    <span class="str">"""Valeur minimax de l'état s à la profondeur p : J1 maximise, J2</span>
<span class="str">    minimise ; h[s] évalue s (valeur exacte si s est final)."""</span>
    <span class="kw">if</span> p == 0 <span class="kw">or</span> len(G[s]) == 0:
        <span class="kw">return</span> h[s]
    valeurs = [minimax(G, joueur, h, t, p - 1) <span class="kw">for</span> t <span class="kw">in</span> G[s]]
    v = valeurs[0]
    <span class="kw">for</span> x <span class="kw">in</span> valeurs:
        <span class="kw">if</span> (joueur[s] == 1 <span class="kw">and</span> x &gt; v) <span class="kw">or</span> (joueur[s] == 2 <span class="kw">and</span> x &lt; v):
            v = x
    <span class="kw">return</span> v</pre>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Un calcul d'attracteur en temps linéaire</h3>
  <div class="statement">La fonction <span class="code-inline">attracteur</span> du cours reparcourt tous les états à chaque étape : \(O(n(n + m))\). On veut un calcul en \(O(n + m)\) pour une arène à \(n\) états et \(m\) arcs. Idée : quand un état \(t\) entre dans l'attracteur, seuls ses <em>prédécesseurs</em> (les états \(s\) tels que \(s \to t\)) peuvent y entrer à leur tour.</div>
  <div class="q"><strong>Q1.</strong> Écrire la construction de la liste <span class="code-inline">pred</span> des prédécesseurs de chaque état. Coût ?</div>
  <div class="q"><strong>Q2.</strong> Pour un état \(s\) de l'adversaire, on tient un compteur <span class="code-inline">reste[s]</span> : le nombre de ses successeurs encore hors de l'attracteur. Quand \(s\) entre-t-il dans l'attracteur ? Et un état du joueur ?</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">attracteur_rapide(G, joueur, cibles, j)</span>, qui renvoie la liste des booléens « \(s\) est dans l'attracteur », en gérant une liste d'états à traiter.</div>
  <div class="q"><strong>Q4.</strong> Justifier la complexité \(O(n + m)\). Le résultat est-il le même ensemble que celui de <span class="code-inline">attracteur</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On crée \(n\) listes vides, puis pour chaque arc \(s \to t\), on ajoute \(s\) à <span class="code-inline">pred[t]</span> : \(O(n + m)\) (voir le début de la fonction ci-dessous).</p>
    <p><strong>Q2.</strong> Un état \(s\) de l'adversaire entre dès que <span class="code-inline">reste[s]</span> tombe à 0 (tous ses successeurs sont dans l'attracteur). Un état du joueur entre dès qu'un de ses successeurs y entre. Comme les états finals n'ont pas de successeur, ils ne sont prédécesseurs de personne et n'entrent que s'ils sont des cibles.</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> attracteur_rapide(G: list, joueur: list, cibles: list, j: int) -&gt; list:
    <span class="str">"""Même résultat que attracteur (les ensembles ; les rangs peuvent</span>
<span class="str">    différer), en O(n + m) grâce aux prédécesseurs et à des compteurs."""</span>
    n = len(G)
    pred = [[] <span class="kw">for</span> s <span class="kw">in</span> range(n)]
    <span class="kw">for</span> s <span class="kw">in</span> range(n):
        <span class="kw">for</span> t <span class="kw">in</span> G[s]:
            pred[t].append(s)
    reste = [len(G[s]) <span class="kw">for</span> s <span class="kw">in</span> range(n)]   <span class="cmt"># successeurs hors attracteur</span>
    dans = [<span class="kw">False</span>] * n
    a_traiter = []
    <span class="kw">for</span> s <span class="kw">in</span> cibles:
        dans[s] = <span class="kw">True</span>
        a_traiter.append(s)
    <span class="kw">while</span> len(a_traiter) &gt; 0:
        t = a_traiter.pop()
        <span class="kw">for</span> s <span class="kw">in</span> pred[t]:                    <span class="cmt"># t vient d'entrer : ses prédécesseurs</span>
            <span class="kw">if</span> <span class="kw">not</span> dans[s]:
                reste[s] = reste[s] - 1
                <span class="kw">if</span> joueur[s] == j <span class="kw">or</span> reste[s] == 0:
                    dans[s] = <span class="kw">True</span>
                    a_traiter.append(s)
    <span class="kw">return</span> dans</pre>
    <p><strong>Q4.</strong> Chaque état entre au plus une fois dans <span class="code-inline">a_traiter</span> (il est marqué <span class="code-inline">dans</span> avant d'y être ajouté) ; quand il en sort, on parcourt ses prédécesseurs. Chaque arc \(s \to t\) est donc examiné au plus une fois (quand \(t\) est traité), avec un travail \(O(1)\) : \(O(n + m)\) en tout, plus \(O(n + m)\) pour <span class="code-inline">pred</span>. L'ensemble obtenu est le même : un état entre exactement quand la condition de la définition devient vraie, quel que soit l'ordre des traitements ; seuls les numéros d'étape (les rangs) ne sont plus calculés. On le vérifie sur des arènes tirées au hasard.</p>
  </div>
</div>

<div class="exo concours">

  <h3>Le chat et la souris</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique des concours (thème : jeux d'accessibilité, attracteurs, parcours en largeur, minimax avec heuristique).</div>
  <div class="statement">Un chat et une souris se déplacent sur un plateau modélisé par un graphe non orienté à \(n\) cases, donné par ses listes d'adjacence <span class="code-inline">G</span>. Une case particulière, <span class="code-inline">trou</span>, est un abri : la souris y est à l'abri et le chat ne peut pas y entrer. Les deux animaux jouent à tour de rôle, la souris (\(J_1\)) d'abord : à son tour, un animal <em>doit</em> passer à une case voisine. Le chat gagne s'il se trouve sur la même case que la souris ; la souris gagne si elle atteint le trou. Si cela n'arrive jamais, la partie est nulle. Exemple de plateau (<span class="code-inline">TROU = 6</span>) :

  <div class="q"><strong>A1.</strong> Un état est un triplet \((c, s, j)\) : case du chat, case de la souris, animal qui doit jouer (1 : souris, 2 : chat). Pourquoi faut-il \(j\) ? Combien y a-t-il d'états pour le plateau donné ?</div>

  <p class="exo-part">Partie B — Positions gagnantes</p>

  <div class="q"><strong>B2.</strong> Le tableau suivant donne le résultat pour toutes les positions où la souris doit jouer (S\(r\) : la souris gagne, rang \(r\) ; C\(r\) : le chat gagne, rang \(r\)). Que se passe-t-il, bien joué, si la souris part de 0 et le chat de 5 ? de 4 ? de 2 ?

  <div class="q"><strong>B3.</strong> Depuis \((c, s) = (5, 0)\), quel premier déplacement la stratégie gagnante de la souris propose-t-elle ? Pourquoi la souris ne peut-elle pas gagner en se dirigeant tout droit vers le trou depuis \((c, s) = (2, 0)\) ?</div>
  <p class="exo-part">Partie C — Une heuristique pour les grands plateaux</p>
  <div class="q"><strong>C1.</strong> Sur un grand plateau, l'arène a \(2n^2\) états environ. On évalue alors une position \((c, s)\) par \(h = d_{\text{chat}}(c, s) - d(s, \text{trou})\), où \(d\) est le nombre minimal de déplacements et \(d_{\text{chat}}\) le même nombre pour le chat, qui évite le trou. Justifier le sens de \(h\). Écrire <span class="code-inline">distances(G, s, interdit)</span> (parcours en largeur, sans passer par la case <span class="code-inline">interdit</span>), puis <span class="code-inline">h_souris(G, trou, c, s)</span>.</div>
  <div class="q"><strong>C2.</strong> On donne aux états finals les valeurs \(+100\) (souris à l'abri) et \(-100\) (souris prise). Depuis \((5, 0)\), souris au trait, minimax trouve la valeur 100 à la profondeur 5 mais pas à la profondeur 4 ; depuis \((4, 0)\), il trouve \(-100\) à la profondeur 4 ; depuis \((2, 0)\), aucune profondeur ne donne \(\pm 100\). Interpréter ces résultats à l'aide du tableau de B2.</div>
  <div class="q"><strong>C3.</strong> Chaque case a au plus 3 voisines. Majorer le nombre d'états examinés par minimax à la profondeur \(p\). Comparer au coût du calcul des attracteurs pour un plateau de \(n = 1\,000\) cases ayant au plus 3 voisines chacune.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Sans \(j\), on ne saurait pas qui doit jouer, donc quels sont les coups possibles (une même disposition peut être gagnante pour l'animal qui joue et perdante pour l'autre). Le chat n'est jamais dans le trou : 6 cases pour le chat, 7 pour la souris, 2 joueurs : \(6 \times 7 \times 2 = 84\) états.</p>
    <p><strong>A2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> etats(G: list, trou: int) -&gt; tuple:
    <span class="str">"""Numérote les états (c, s, j) du jeu du chat et de la souris :</span>
<span class="str">    chat en c, souris en s, j = 1 si la souris doit jouer, 2 si c'est le chat.</span>
<span class="str">    Le chat n'entre jamais dans le trou."""</span>
    num, liste = {}, []
    <span class="kw">for</span> c <span class="kw">in</span> range(len(G)):
        <span class="kw">if</span> c != trou:
            <span class="kw">for</span> s <span class="kw">in</span> range(len(G)):
                <span class="kw">for</span> j <span class="kw">in</span> [1, 2]:
                    num[(c, s, j)] = len(liste)
                    liste.append((c, s, j))
    <span class="kw">return</span> num, liste</pre>
    <p><strong>A3.</strong> Finals : \(c = s\) (souris prise, gagnant pour le chat), et \(s = \text{trou}\) (souris à l'abri, gagnant pour la souris) ; les deux ne peuvent pas arriver ensemble puisque le chat n'entre pas dans le trou. Un déplacement de la souris mène d'un état \((c, s, 1)\) à un état \((c, s', 2)\), un déplacement du chat de \((c, s, 2)\) à \((c', s, 1)\) : chaque arc change le joueur, l'arène est biparti. Sur l'exemple : 130 arcs.</p>
    <pre class="codeblock"><span class="kw">def</span> arene(G: list, trou: int) -&gt; tuple:
    <span class="str">"""Successeurs, joueur et états finals de l'arène."""</span>
    num, liste = etats(G, trou)
    succ = [[] <span class="kw">for</span> e <span class="kw">in</span> liste]
    joueur = [0] * len(liste)
    souris_gagne, chat_gagne = [], []
    <span class="kw">for</span> e <span class="kw">in</span> range(len(liste)):
        c, s, j = liste[e]
        joueur[e] = j
        <span class="kw">if</span> c == s:
            chat_gagne.append(e)             <span class="cmt"># final : la souris est prise</span>
        <span class="kw">elif</span> s == trou:
            souris_gagne.append(e)           <span class="cmt"># final : la souris est à l'abri</span>
        <span class="kw">elif</span> j == 1:
            <span class="kw">for</span> v <span class="kw">in</span> G[s]:                   <span class="cmt"># la souris se déplace</span>
                succ[e].append(num[(c, v, 2)])
        <span class="kw">else</span>:
            <span class="kw">for</span> v <span class="kw">in</span> G[c]:                   <span class="cmt"># le chat se déplace, hors du trou</span>
                <span class="kw">if</span> v != trou:
                    succ[e].append(num[(v, s, 1)])
    <span class="kw">return</span> succ, joueur, num, liste, souris_gagne, chat_gagne</pre>
    <p><strong>B1.</strong> Les positions gagnantes de la souris sont l'attracteur de ses états finals gagnants : <span class="code-inline">attracteur(succ, joueur, souris_gagne, 1)</span> ; celles du chat : <span class="code-inline">attracteur(succ, joueur, chat_gagne, 2)</span>. Les états restants sont des positions de match nul.</p>
    <p><strong>B2.</strong> Chat en 5 : la souris gagne en au plus 5 déplacements (en comptant ceux des deux animaux). Chat en 4 : le chat gagne en au plus 4 déplacements. Chat en 2 : aucun ne peut forcer la victoire, la partie bien jouée ne finit pas (le chat garde le passage, la souris ne s'y aventure pas).</p>
    <p><strong>B3.</strong> La stratégie (fonction <span class="code-inline">strategie</span>) fait passer la souris en 2, de rang plus petit. Depuis \((2, 0)\), les voisines de la souris sont 1 et 2 ; en 2, elle se jetterait sur le chat. Si elle va en 1, le chat va en 3 ; la souris, dont les voisines sont 0 et 3, doit revenir en 0, et le chat revient en 2 : on retrouve la position de départ. Toute autre réponse du chat donnerait une position gagnante pour la souris (chat en 0 ou en 4 face à la souris en 1, chat en 1 ou en 5 face à la souris en 0 : S5 dans le tableau). Le chat garde le passage sans pouvoir prendre la souris : partie nulle.</p>
    <p><strong>C1.</strong> Plus le chat est loin de la souris et plus la souris est près du trou, plus la position est bonne pour la souris (\(J_1\)) : \(h\) croît avec la première distance et décroît avec la seconde.</p>
    <pre class="codeblock"><span class="kw">def</span> distances(G: list, s: int, interdit: int) -&gt; list:
    <span class="str">"""Nombre minimal de déplacements de s à chaque case sans passer par la</span>
<span class="str">    case interdit (-1 : aucune) ; -1 pour une case inaccessible."""</span>
    d = [-1] * len(G)
    d[s] = 0
    file = [s]
    k = 0
    <span class="kw">while</span> k &lt; len(file):                 <span class="cmt"># file : liste lue de gauche à droite</span>
        u = file[k]
        k = k + 1
        <span class="kw">for</span> v <span class="kw">in</span> G[u]:
            <span class="kw">if</span> d[v] == -1 <span class="kw">and</span> v != interdit:
                d[v] = d[u] + 1
                file.append(v)
    <span class="kw">return</span> d</pre>
    <pre class="codeblock"><span class="kw">def</span> h_souris(G: list, trou: int, c: int, s: int) -&gt; int:
    <span class="str">"""Évaluation pour la souris : distance (pour le chat, qui évite le</span>
<span class="str">    trou) du chat à la souris, moins distance de la souris au trou."""</span>
    <span class="kw">return</span> distances(G, c, trou)[s] - distances(G, s, -1)[trou]</pre>
    <p>Depuis \((5, 0)\) : le chat est à 3 déplacements de la souris (5, 3, 1 ou 2, puis 0) et la souris à 3 déplacements du trou, d'où \(h = 0\).</p>
    <p><strong>C2.</strong> \((5, 0)\) est de rang 5 pour la souris : elle peut forcer l'arrivée au trou en au plus 5 déplacements, et pas moins ; minimax, qui examine tous les coups des deux animaux, le découvre exactement à la profondeur 5. \((4, 0)\) est de rang 4 pour le chat : à la profondeur 4, toutes les réponses de la souris mènent à sa capture. \((2, 0)\) est une position nulle : aucune profondeur ne fait apparaître une victoire forcée, et seule l'heuristique départage les coups. Minimax à profondeur suffisante retrouve ainsi les attracteurs, sans construire toute l'arène.</p>
    <p><strong>C3.</strong> Au plus \(3^p\) états à la profondeur \(p\) (et \(1 + 3 + \cdots + 3^p \le \frac{3}{2} \cdot 3^p\) en comptant les niveaux intermédiaires) : pour \(p = 10\), environ \(6 \times 10^4\) feuilles, quelle que soit la taille du plateau. Les attracteurs demandent l'arène entière : \(2 \times 1\,000^2 = 2 \times 10^6\) états et environ \(6 \times 10^6\) arcs ; avec la version du cours, \(O(n(n + m))\) atteint \(10^{13}\) opérations, hors de portée ; même la version linéaire (exercice 9) doit d'abord construire ces millions d'états. Minimax ne regarde que le voisinage de la position courante, mais ne donne qu'une estimation.</p>
