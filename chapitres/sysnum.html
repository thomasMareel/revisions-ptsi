<div class="course-section">
  <div class="sec-num">§7 · INTÉGRATION ET DÉRIVATION EN TEMPS RÉEL</div>
  <h2>Intégrer et dériver au fil des échantillons</h2>
  <div class="intro">Action intégrale ou dérivée d'un correcteur, vitesse calculée à partir d'une position, vitesse obtenue en intégrant une accélération : le calculateur doit intégrer ou dériver un signal connu seulement par ses échantillons, au fur et à mesure de leur arrivée.</div>

  <h3>Intégration</h3>
  <div class="def-box">
    On cherche \(I_k \approx I(kT_e)\) avec \(I(t) = \int_0^t e(\theta)\,\mathrm{d}\theta\). À chaque période, on ajoute l'aire d'une bande de largeur \(T_e\) :
    <ul style="margin:.4rem 0">
      <li>rectangles à gauche : $$I_k = I_{k-1} + T_e\,e_{k-1}$$</li>
      <li>rectangles à droite : $$I_k = I_{k-1} + T_e\,e_k$$</li>
      <li>trapèzes : $$I_k = I_{k-1} + \frac{T_e}{2}\,\big(e_k + e_{k-1}\big)$$</li>
    </ul>
  </div>
  <div class="prop-box">
    Les rectangles à droite reviennent à discrétiser \(\mathrm{d}I/\mathrm{d}t = e\) par la différence arrière, les rectangles à gauche par la différence avant. La méthode des trapèzes est plus précise (sur une durée fixée, erreur proportionnelle à \(T_e^2\) au lieu de \(T_e\)). Toutes ces formes sont <strong>récursives</strong> : on ne stocke pas la liste des échantillons, seulement \(I_{k-1}\).
  </div>

  <h3>Dérivation</h3>
  <div class="def-box">
    En temps réel, seule la différence arrière est utilisable (la valeur suivante n'est pas encore connue) :
    $$D_k = \frac{e_k - e_{k-1}}{T_e}$$
  </div>
  <div class="notice">
    <strong>La dérivation amplifie le bruit.</strong> Un bruit d'amplitude \(\pm\delta\) sur chaque mesure peut produire une erreur de \(2\delta/T_e\) sur \(D_k\) ; la quantification seule fait déjà sauter \(D_k\) par paliers de \(q/T_e\). Plus \(T_e\) est petit, plus la dérivée est bruitée. Remèdes : filtrer avant de dériver, ou dériver sur plusieurs périodes, \((e_k - e_{k-m})/(mT_e)\), au prix d'un retard. À l'inverse, l'intégration accumule les erreurs lentes : un léger décalage de zéro intégré produit une dérive proportionnelle au temps.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Vitesse estimée à partir d'un codeur de 1000 incréments par tour, lu toutes les millisecondes : quelle résolution ?</span>
    <div class="content">
      <p>Pendant \(T_e\), on compte un nombre entier d'incréments de \(2\pi/1000\ \text{rad}\). La vitesse estimée est donc un multiple de \(\dfrac{2\pi/1000}{10^{-3}} \approx 6{,}3\ \text{rad/s}\), soit 60 tr/min ! Diminuer \(T_e\) rendrait l'estimation encore plus grossière.</p>
    </div>
  </div>
  <pre class="codeblock">Te = 0.001                    <span class="cmt"># période d'échantillonnage (s)</span>
I, e_prec = 0.0, lire_mesure()
<span class="kw">while</span> True:
    attendre_top_horloge()    <span class="cmt"># cadence strictement régulière</span>
    e = lire_mesure()
    I = I + Te*(e + e_prec)/2 <span class="cmt"># intégrale (trapèzes)</span>
    D = (e - e_prec)/Te       <span class="cmt"># dérivée (différence arrière)</span>
    e_prec = e</pre>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CORRECTION NUMÉRIQUE</div>
  <h2>Correcteurs P, PI et à avance de phase discrétisés ; influence de \(T_e\)</h2>
  <div class="intro">Dans un asservissement numérique, comparateur et correcteur sont des lignes de programme. Le réglage se pense d'abord en continu, avec les outils habituels (diagramme de Bode, marges, classe de la FTBO), tant que \(T_e\) reste petite devant les constantes de temps de la boucle ; on traduit ensuite le correcteur en une relation de récurrence entre les écarts \(\varepsilon_k = c_k - s_k\) (consigne moins mesure) et les commandes \(u_k\).</div>

  <div class="def-box">
    <strong>Forme générale</strong> d'un correcteur numérique linéaire (même structure qu'un filtre) :
    $$u_k = \sum_{i=0}^{n} a_i\,\varepsilon_{k-i} \;-\; \sum_{i=1}^{m} b_i\,u_{k-i}$$
    Le plus simple est le correcteur proportionnel : \(u_k = K_p\,\varepsilon_k\).
  </div>

  <h3>Correcteur PI : forme « position » et forme incrémentale</h3>
  <div class="formula">$$u(t) = K_p\left(\varepsilon(t) + \frac{1}{T_i}\int_0^t \varepsilon(\theta)\,\mathrm{d}\theta\right)$$
  $$C(p) = K_p\left(1+\frac{1}{T_i\,p}\right)$$</div>
  <div class="prop-box">
    <strong>Forme position</strong> (intégrale par la méthode des rectangles à droite) :
    $$u_k = K_p\left(\varepsilon_k + \frac{T_e}{T_i}\sum_{j=0}^{k}\varepsilon_j\right)$$
    Elle impose de tenir à jour la somme de tous les écarts passés.
  </div>
  <div class="prop-box">
    <strong>Forme incrémentale.</strong> On dérive la loi du PI, \(\dot u = K_p\left(\dot\varepsilon + \varepsilon/T_i\right)\), puis on applique la différence arrière :
    $$\frac{u_k - u_{k-1}}{T_e} = K_p\left(\frac{\varepsilon_k-\varepsilon_{k-1}}{T_e} + \frac{\varepsilon_k}{T_i}\right)$$
    $$u_k = u_{k-1} + K_p\left(1+\frac{T_e}{T_i}\right)\varepsilon_k - K_p\,\varepsilon_{k-1}$$
    C'est la même suite que la forme position (différence de deux termes consécutifs), mais seules \(u_{k-1}\) et \(\varepsilon_{k-1}\) sont mémorisées. Autres atouts : on <strong>sature</strong> \(u_k\) avant de le mémoriser, ce qui empêche l'action intégrale de s'emballer pendant une saturation (anti-emballement, <em>anti-windup</em>) ; un changement de réglage en marche ne provoque pas d'à-coup.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Extension</span>
    <span class="prompt">Forme incrémentale du PID \(C(p) = K_p\left(1 + \frac{1}{T_i p} + T_d\,p\right)\) ?</span>
    <div class="content">
      <p>Même démarche, la dérivée seconde de \(\varepsilon\) étant approchée par différence arrière :</p>
      $$\begin{aligned} u_k = u_{k-1} + K_p\Big[&\big(\varepsilon_k-\varepsilon_{k-1}\big) + \frac{T_e}{T_i}\,\varepsilon_k \\ &+ \frac{T_d}{T_e}\big(\varepsilon_k - 2\varepsilon_{k-1} + \varepsilon_{k-2}\big)\Big] \end{aligned}$$
      <p>Le terme en \(T_d/T_e\) devient énorme quand \(T_e\) diminue : en pratique on filtre l'action dérivée.</p>
    </div>
  </div>

  <h3>Correcteur à avance de phase</h3>
  <div class="formula">$$C(p) = K_p\,\frac{1+aTp}{1+Tp}\quad(a \gt 1)$$
$$u + T\,\frac{\mathrm{d}u}{\mathrm{d}t} = K_p\left(\varepsilon + aT\,\frac{\mathrm{d}\varepsilon}{\mathrm{d}t}\right)$$</div>
  <div class="prop-box">
    <strong>Par différence arrière</strong> sur les deux dérivées :
    <div class="formula">$$\begin{aligned} u_k + T\,\frac{u_k-u_{k-1}}{T_e} &= K_p\,\varepsilon_k \\ &\quad + K_p\,aT\,\frac{\varepsilon_k-\varepsilon_{k-1}}{T_e} \end{aligned}$$</div>
    puis, en multipliant par \(T_e\) et en isolant \(u_k\) :
    <div class="formula" data-nom="Avance de phase numérique">$$u_k = \alpha\,u_{k-1} + b_0\,\varepsilon_k + b_1\,\varepsilon_{k-1}$$
$$\alpha = \frac{T}{T+T_e}$$
$$b_0 = K_p\,\frac{T_e+aT}{T+T_e}, \qquad b_1 = -K_p\,\frac{aT}{T+T_e}$$</div>
    <ul style="margin:.3rem 0">
      <li><strong>Stabilité</strong> : le coefficient \(\alpha\) de \(u_{k-1}\) est compris entre 0 et 1 : la récurrence est stable quel que soit \(T_e\).</li>
      <li><strong>Gain statique</strong> : avec \(\varepsilon_k = E\) et \(u_k \to U\), \(U = \dfrac{b_0+b_1}{1-\alpha}\,E = K_p\,E\) (car \(b_0+b_1 = K_pT_e/(T+T_e)\) et \(1-\alpha = T_e/(T+T_e)\)) : en régime permanent, le correcteur se réduit à son gain \(K_p\), comme en continu.</li>
      <li><strong>Pic de commande</strong> : pour un échelon d'écart \(\varepsilon_0\) appliqué au repos, \(u_0 = b_0\,\varepsilon_0\), qui tend vers \(aK_p\,\varepsilon_0\) (valeur du correcteur continu) quand \(T_e \ll T\).</li>
      <li><strong>Effet de \(T_e\) devant \(T\)</strong> : l'avance de phase agit autour de \(\omega_m = 1/(T\sqrt a)\) ; si \(T_e\) n'est pas petite devant \(T\), la différence arrière dérive mal \(\varepsilon\), et le retard du bloqueur retranche en plus \(\omega_m T_e/2\) à l'avance apportée. Règle pratique : \(T_e \leq T/10\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — avance de phase réglée en continu, puis programmée</strong>
    <p>Le réglage continu d'un axe a donné \(K_p = 2\), \(a = 4\), \(T = 25\ \text{ms}\) : avance maximale de 36,9° à \(\omega_m = 1/(T\sqrt a) = 20\ \text{rad/s}\), la coupure visée. Les avances « nettes » ci-dessous (avance de la récurrence moins le retard \(\omega_m T_e/2\) du bloqueur, à 20 rad/s) ont été calculées numériquement.</p>
    <ol>
      <li>\(T_e = 1\ \text{ms}\) : \(\alpha = 0{,}9615\), \(b_0 = 7{,}769\), \(b_1 = -7{,}692\). Contrôle du gain statique : \((7{,}769 - 7{,}692)/(1 - 0{,}9615) \approx 2\). Pic de commande \(7{,}77\,\varepsilon_0\) (\(8\,\varepsilon_0\) en continu). Avance nette : 36°, presque celle du correcteur continu.</li>
      <li>\(T_e = 10\ \text{ms}\) : \(\alpha = 0{,}714\), \(b_0 = 6{,}286\), \(b_1 = -5{,}714\). Avance nette : 33,6° − 5,7° ≈ 28° ; il manque 9° de marge de phase par rapport au réglage continu.</li>
      <li>\(T_e = T = 25\ \text{ms}\) : avance nette de 15° seulement ; le correcteur programmé n'a presque plus d'effet. Augmenter \(T_e\) révèle ici les limites du modèle continu : on garde \(T_e \leq T/10\), ou l'on reprend le réglage en tenant compte du retard.</li>
    </ol>
    <p>Dans le programme ci-dessous, il suffit de remplacer la ligne de calcul de <code>u</code> par <code>u = al*u_prec + b0*eps + b1*eps_prec</code>, avec <code>al = T/(T+Te)</code>, <code>b0 = Kp*(Te+a*T)/(T+Te)</code> et <code>b1 = -Kp*a*T/(T+Te)</code> calculés une fois pour toutes.</p>
  </div>

  <h3>Le programme</h3>
  <pre class="codeblock">Kp, Ti, Te = 1.5, 0.2, 0.005       <span class="cmt"># réglage et période (s)</span>
U_MIN, U_MAX = 0.0, 10.0           <span class="cmt"># limites du préactionneur (V)</span>
q0, q1 = Kp*(1 + Te/Ti), -Kp       <span class="cmt"># coefficients calculés une fois</span>
u_prec, eps_prec = 0.0, 0.0
<span class="kw">while</span> True:
    attendre_top_horloge()          <span class="cmt"># interruption toutes les Te</span>
    eps = lire_consigne() - lire_CAN()
    u = u_prec + q0*eps + q1*eps_prec
    u = min(max(u, U_MIN), U_MAX)   <span class="cmt"># saturation (et anti-emballement)</span>
    ecrire_CNA(u)
    u_prec, eps_prec = u, eps</pre>
  <div class="notice">
    Le calcul doit être lancé à <strong>période strictement constante</strong> (interruption d'horloge), et durer nettement moins que \(T_e\). Les coefficients dépendent de \(T_e\) : changer la période impose de les recalculer.
  </div>

  <h3>Influence de \(T_e\) sur la stabilité</h3>
  <div class="prop-box">
    Deux effets se cumulent :
    <ul style="margin:.4rem 0">
      <li>le <strong>retard</strong> du bloqueur (\(\approx T_e/2\)) et du calcul réduit la marge de phase d'environ \(\omega_{c0}\) fois le retard total ;</li>
      <li>les coefficients de la récurrence dépendent de \(T_e\) : la boucle numérique peut devenir <strong>instable</strong> alors que la boucle continue équivalente est stable.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Cas d'école : procédé intégrateur commandé en P.</strong> Soit \(\dot s = K_0\,u\) avec \(u\) bloquée sur chaque période : en intégrant exactement, \(s_{k+1} = s_k + K_0 T_e\,u_k\). Avec \(u_k = K_p(c - s_k)\) et \(K = K_p K_0\), l'écart vérifie
    $$\varepsilon_{k+1} = (1 - K T_e)\,\varepsilon_k$$
    Suite géométrique : la boucle est stable si et seulement si \(|1 - KT_e| \lt 1\), soit \(0 \lt KT_e \lt 2\). Elle ne présente pas d'oscillation si \(KT_e \leq 1\), et pour \(T_e = 1/K\) la consigne est atteinte en une seule période. En continu (\(\dot s = K(c-s)\)), la boucle est stable pour tout \(K > 0\) ; quand \(T_e \to 0\), \((1-KT_e)^k \approx e^{-K\,kT_e}\) redonne le comportement continu.
  </div>
  <div class="notice">
    <strong>À retenir.</strong> Diminuer \(T_e\) rapproche la commande numérique du correcteur continu et améliore la stabilité, dans la limite de la puissance de calcul et du bruit sur les dérivées ; augmenter \(T_e\) dégrade les marges, jusqu'à l'instabilité.
  </div>
</div>

</template>
<template class="pan-tpl" data-panneau="snumx-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · SYSTÈMES NUMÉRIQUES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Choisir la fréquence d'échantillonnage</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Fréquences en jeu.</span> Repérer la plus haute fréquence utile \(f_{max}\) (bande passante du système, harmoniques à conserver) et les parasites possibles (secteur à 50 Hz, découpage MLI, vibrations).</li>
      <li><span class="step">Borne de Shannon.</span> \(f_e > 2 f_{max}\) : c'est un minimum. En commande, viser 10 à 30 fois la bande passante de la boucle, ou \(T_e \approx \tau_{min}/10\).</li>
      <li><span class="step">Repliement.</span> Pour chaque composante au-delà de \(f_e/2\), calculer sa fréquence apparente (méthode 3). Si elle tombe dans la bande utile : filtre anti-repliement analogique (coupure entre \(f_{max}\) et \(f_e/2\)) ou augmentation de \(f_e\).</li>
      <li><span class="step">Faisabilité.</span> Vérifier que le calcul d'une période tient largement dans \(T_e\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Dimensionner un CAN (nombre de bits)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Résolution physique.</span> Écrire la résolution exigée \(\delta_{phys}\) (en bar, °C, mm…).</li>
      <li><span class="step">Conversion en tension.</span> \(\delta = K_c\,\delta_{phys}\), où \(K_c\) est la sensibilité de l'ensemble capteur + conditionnement.</li>
      <li><span class="step">Nombre de bits.</span> Avec \(\Delta s\) la plage du <em>CAN</em> (et non l'étendue du signal) :
        $$N = \left\lceil \log_2 \frac{\Delta s}{K_c\,\delta_{phys}} \right\rceil$$
        puis arrondir au format standard (8, 10, 12, 16 bits).</li>
      <li><span class="step">Optimiser.</span> Si le signal n'occupe qu'une partie de \(\Delta s\), proposer d'adapter le conditionnement plutôt que d'augmenter \(N\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Prévoir la fréquence apparente d'une composante</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Test.</span> Si \(f \leq f_e/2\), pas de repliement : \(f_{app} = f\).</li>
      <li><span class="step">Sinon.</span> Retrancher le multiple de \(f_e\) le plus proche : \(f_{app} = |f - n f_e|\), avec \(n\) l'entier le plus proche de \(f/f_e\).</li>
      <li><span class="step">Contrôle.</span> Le résultat doit être compris entre 0 et \(f_e/2\) (le spectre se replie « en accordéon » autour de \(f_e/2\), \(f_e\), \(3f_e/2\)…).</li>
    </ol>
    <p style="margin:.3rem 0 0">Exemple : à \(f_e = 1\ \text{kHz}\), une composante à 1,3 kHz apparaît à 300 Hz, une composante à 1,8 kHz à 200 Hz.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Discrétiser une fonction de transfert ou une équation différentielle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Équation différentielle.</span> Écrire \(D(p)\,V(p) = N(p)\,U(p)\) et traduire \(p^n\) par \(\mathrm{d}^n/\mathrm{d}t^n\) (conditions initiales nulles).</li>
      <li><span class="step">Dérivées.</span> Remplacer chaque dérivée à l'instant \(kT_e\) par sa différence arrière (temps réel), ou avant si l'énoncé l'impose ; une dérivée seconde par \((v_k - 2v_{k-1} + v_{k-2})/T_e^2\) (un second ordre donne une récurrence qui mémorise deux sorties).</li>
      <li><span class="step">Récurrence.</span> Isoler la valeur courante \(v_k\) (ou \(v_{k+1}\)) ; identifier les coefficients \(a_i\), \(b_i\).</li>
      <li><span class="step">Initialisation.</span> Fixer les valeurs nécessaires avant le premier calcul (souvent \(v_{-1} = u_{-1} = 0\)).</li>
      <li><span class="step">Contrôles.</span> Gain statique identique au gain continu ; stabilité (pour un premier ordre, coefficient de \(v_{k-1}\) de valeur absolue inférieure à 1) ; fidélité au filtre continu si \(T_e \leq \tau/10\) (second ordre : \(\omega_0T_e \leq 0{,}1\)).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Faire tourner une récurrence à la main</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Tableau.</span> Colonnes \(k\), \(u_k\), \(v_k\) ; écrire d'abord les valeurs passées nécessaires (indices négatifs).</li>
      <li><span class="step">Calcul.</span> Avancer ligne par ligne, avec 3 ou 4 chiffres significatifs.</li>
      <li><span class="step">Entrées types.</span> Réponse impulsionnelle : \(u_0 = 1\), autres nuls (finie ⇒ RIF). Réponse indicielle : \(u_k = 1\) pour \(k \geq 0\).</li>
      <li><span class="step">Conclusion.</span> Valeur finale (gain statique), durée en nombre de périodes multiplié par \(T_e\), oscillations (coefficient négatif), divergence éventuelle.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Programmer un correcteur numérique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Loi temporelle.</span> Partir de \(C(p)\), écrire la relation entre \(u\) et \(\varepsilon\) ; choisir la forme incrémentale (plus robuste).</li>
      <li><span class="step">Coefficients.</span> Les calculer une fois avant la boucle (\(q_0 = K_p(1+T_e/T_i)\), \(q_1 = -K_p\) pour un PI).</li>
      <li><span class="step">Avance de phase.</span> Par différence arrière sur \(u + T\dot u = K_p(\varepsilon + aT\dot\varepsilon)\) : \(u_k = \alpha\,u_{k-1} + b_0\,\varepsilon_k + b_1\,\varepsilon_{k-1}\), avec \(\alpha = \dfrac{T}{T+T_e}\), \(b_0 = K_p\,\dfrac{T_e+aT}{T+T_e}\), \(b_1 = -K_p\,\dfrac{aT}{T+T_e}\). Contrôles : \(b_0 + b_1 = K_p(1-\alpha)\) (gain statique \(K_p\)) et \(T_e \leq T/10\), sinon l'avance apportée fond.</li>
      <li><span class="step">Structure.</span> Initialisation, puis boucle cadencée à \(T_e\) : acquisition → écart → calcul → saturation → écriture sur le CNA → décalage des mémoires.</li>
      <li><span class="step">Saturation.</span> Borner \(u_k\) aux limites du préactionneur <em>avant</em> de le mémoriser.</li>
    </ol>
    <p><em>Exemple éclair :</em> avance de phase \(K_p = 1\), \(a = 5\), \(T = 20\ \text{ms}\), programmée avec \(T_e = 2\ \text{ms}\) : \(\alpha = 20/22 \approx 0{,}909\), \(b_0 = 102/22 \approx 4{,}64\), \(b_1 = -100/22 \approx -4{,}55\) ; \(b_0 + b_1 \approx 0{,}091 = 1 - \alpha\) : gain statique 1. Pic de commande \(u_0 = b_0\,\varepsilon_0 \approx 4{,}6\,\varepsilon_0\) (\(5\,\varepsilon_0\) en continu).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Étudier l'influence de \(T_e\) sur la stabilité</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Approche exacte.</span> Écrire la récurrence de la boucle fermée sur l'écart. Premier ordre \(\varepsilon_{k+1} = r\,\varepsilon_k\) : stable ⇔ \(|r| \lt 1\). Second ordre (\(\varepsilon_{k+2} + \alpha\,\varepsilon_{k+1} + \beta\,\varepsilon_k = 0\)) : les deux racines de \(r^2 + \alpha r + \beta = 0\) doivent être de module strictement inférieur à 1.</li>
      <li><span class="step">Approche fréquentielle.</span> Modéliser bloqueur et calcul par un retard \(T_r\) (\(T_e/2\), plus \(T_e\) si la commande est appliquée à la période suivante). Perte de marge : \(\omega_{c0}T_r\) rad. Imposer la marge restante du cahier des charges.</li>
      <li><span class="step">Conclure</span> par une période maximale \(T_{e,max}\), et rappeler que l'approche fréquentielle n'est fiable que si \(\omega_{c0}T_e \ll 1\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Traiter un fichier de mesures (moyenne, écart type, moyenne glissante)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Lire.</span> <code>d = np.loadtxt(nom, delimiter=';', skiprows=1)</code> (en-tête sauté), puis une colonne par grandeur : <code>t, x = d[:, 0], d[:, 1]</code>.</li>
      <li><span class="step">Choisir la tranche.</span> Moyenne et écart type ne décrivent qu'un régime établi : écarter d'abord le transitoire (<code>x[k0:]</code>).</li>
      <li><span class="step">Statistiques.</span> <code>np.mean(x)</code> ; <code>np.std(x, ddof=1)</code> pour le diviseur \(N-1\) (par défaut <code>np.std</code> divise par \(N\)) ; incertitude-type de la moyenne \(s/\sqrt N\) si les mesures sont indépendantes.</li>
      <li><span class="step">Lisser.</span> <code>np.convolve(x, np.ones(N)/N, mode='valid')</code> rend \(N-1\) valeurs de moins : les dater par <code>t[N-1:]</code> reproduit le calcul en temps réel (retard \((N-1)T_e/2\)) ; les dater par le milieu de la fenêtre supprime ce retard (post-traitement seulement).</li>
      <li><span class="step">Conclure</span> dans l'unité de la grandeur : valeur moyenne, dispersion d'une mesure, incertitude du résultat.</li>
    </ol>
    <p><em>Exemple éclair :</em> cinq mesures 4,02 ; 3,98 ; 4,05 ; 3,97 ; 4,03 bar. Moyenne 4,01 bar ; somme des carrés des écarts \(46\cdot10^{-4}\ \text{bar}^2\), d'où \(s = \sqrt{46\cdot10^{-4}/4} \approx 0{,}034\ \text{bar}\) (0,030 bar avec le diviseur 5) et \(s/\sqrt5 \approx 0{,}015\ \text{bar}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Intégrer et dériver au fil des échantillons</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Intégrer.</span> Forme récursive : seul \(I_{k-1}\) est mémorisé. Trapèzes \(I_k = I_{k-1} + \frac{T_e}{2}(e_k + e_{k-1})\), plus précis que les rectangles (erreur en \(T_e^2\) au lieu de \(T_e\)).</li>
      <li><span class="step">Dériver.</span> En temps réel, seule la différence arrière \(D_k = (e_k - e_{k-1})/T_e\) est utilisable.</li>
      <li><span class="step">Chiffrer le bruit.</span> Une erreur \(\pm\delta\) sur chaque mesure peut donner \(2\delta/T_e\) sur \(D_k\) ; un capteur de quantum \(q\) fait sauter \(D_k\) par paliers de \(q/T_e\) (codeur : vitesse multiple de \(q_\theta/T_e\)).</li>
      <li><span class="step">Remédier.</span> Filtrer avant de dériver, ou dériver sur \(m\) périodes, \((e_k - e_{k-m})/(mT_e)\), au prix d'un retard ; surveiller la dérive d'une intégrale (un décalage de zéro intégré croît comme le temps).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(e_0 = 0\), \(e_1 = 1\), \(e_2 = 3\) avec \(T_e = 0{,}1\ \text{s}\) : trapèzes \(I_2 = 0{,}05 + 0{,}2 = 0{,}25\) ; dérivée arrière \(D_2 = (3 - 1)/0{,}1 = 20\ \text{s}^{-1}\).</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Confondre la plage du CAN \(\Delta s\) et l'étendue réellement occupée par le signal.</li>
      <li>Écrire \(q = \Delta s/N\) au lieu de \(\Delta s/2^N\).</li>
      <li>Proposer un filtre anti-repliement <em>numérique</em> : il doit être analogique et placé avant l'échantillonneur.</li>
      <li>Oublier que la différence avant peut diverger (\(T_e \geq 2\tau\) pour un premier ordre).</li>
      <li>Mélanger les indices : dans l'expression de \(u_k\), tous les termes doivent être connus à l'instant \(kT_e\).</li>
      <li>Garder les mêmes coefficients après avoir changé \(T_e\).</li>
      <li>Calculer un écart type avec <code>np.std</code> sans <code>ddof=1</code>, ou sur une tranche qui contient encore le transitoire.</li>
      <li>Oublier le retard d'une moyenne glissante, \((N-1)T_e/2\), dans le bilan des retards d'une boucle.</li>
    </ul>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="snumx-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Résolution d'une chaîne de mesure de pression</h3>
  <div class="statement">Un capteur de pression industriel mesure de 0 à 10 bar ; sa tension de sortie varie linéairement de 0,5 V (à 0 bar) à 4,5 V (à 10 bar). Il est relié directement à un CAN 10 bits de plage 0–5 V.</div>
  <div class="q"><strong>Q1.</strong> Calculer le quantum \(q\) du CAN.</div>
  <div class="q"><strong>Q2.</strong> En déduire la résolution de la mesure de pression, en mbar.</div>
  <div class="q"><strong>Q3.</strong> Combien de codes sont réellement utilisés ? Les codes inutilisés peuvent-ils servir à quelque chose ?</div>
  <div class="q"><strong>Q4.</strong> Le cahier des charges exige une résolution de 5 mbar. Combien de bits faut-il avec ce câblage ? Et si un conditionnement ramène l'étendue 0,5–4,5 V sur 0–5 V ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(q = \Delta s/2^N = 5/1024 \approx 4{,}88\ \text{mV}\).</p>
    <p><strong>Q2.</strong> Sensibilité du capteur : \(K_c = (4{,}5-0{,}5)/10 = 0{,}4\ \text{V/bar}\). Résolution : \(q/K_c = 4{,}88\cdot10^{-3}/0{,}4 \approx 12{,}2\ \text{mbar}\).</p>
    <p><strong>Q3.</strong> Le signal s'étend sur 4 V, soit \(4/q \approx 819\) codes sur 1024 (80 %). Les codes correspondant à moins de 0,5 V ou plus de 4,5 V ne sont jamais atteints en fonctionnement normal : une lecture proche de 0 V signale par exemple un fil coupé ou un capteur non alimenté. C'est l'intérêt d'un « zéro décalé ».</p>
    <p><strong>Q4.</strong> Il faut \(q \leq K_c \times 5\ \text{mbar} = 0{,}4 \times 0{,}005 = 2\ \text{mV}\), donc \(2^N \geq 5/0{,}002 = 2500\), soit \(N \geq 11{,}3\) : <strong>12 bits</strong>. Avec le conditionnement, \(K_c' = 5/10 = 0{,}5\ \text{V/bar}\), il faut \(q \leq 2{,}5\ \text{mV}\), \(2^N \geq 2000\), \(N \geq 10{,}97\) : <strong>11 bits</strong> suffisent. Étaler le signal sur toute la plage fait gagner (presque) un bit.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Surveillance vibratoire et repliement</h3>
  <div class="statement">Sur la broche d'une machine-outil, un accéléromètre délivre un signal contenant une composante utile à 50 Hz (fréquence de rotation), son harmonique 3 à 150 Hz, et une vibration parasite à 420 Hz transmise par une machine voisine. Le signal est échantillonné à \(f_e = 500\ \text{Hz}\).</div>
  <div class="q"><strong>Q1.</strong> Les composantes utiles respectent-elles la condition de Shannon ?</div>
  <div class="q"><strong>Q2.</strong> À quelle fréquence le calculateur verra-t-il la vibration parasite ? Pourquoi est-ce gênant pour un diagnostic ?</div>
  <div class="q"><strong>Q3.</strong> On veut diviser par 5 l'amplitude de la composante à 420 Hz avant l'échantillonnage, avec un passe-bas analogique du premier ordre. Quelle fréquence de coupure faut-il ? Quel est alors l'effet sur les composantes à 50 Hz et 150 Hz ? Conclure.</div>
  <div class="q"><strong>Q4.</strong> Proposer une solution plus satisfaisante.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f_e/2 = 250\ \text{Hz}\) dépasse 150 Hz : les composantes utiles sont correctement échantillonnées.</p>
    <p><strong>Q2.</strong> \(420\ \text{Hz} > 250\ \text{Hz}\) : repliement. Le multiple de \(f_e\) le plus proche est 500 Hz, d'où \(f_{app} = |420-500| = 80\ \text{Hz}\). Cette raie fictive tombe entre 50 et 150 Hz : on pourrait l'attribuer à un défaut de la broche (balourd, engrenage…) et poser un faux diagnostic. Aucun traitement numérique ne peut l'éliminer après coup.</p>
    <p><strong>Q3.</strong> Il faut \(1/\sqrt{1+(420/f_c)^2} \leq 0{,}2\), soit \((420/f_c)^2 \geq 24\) et \(f_c \leq 420/\sqrt{24} \approx 85{,}7\ \text{Hz}\). Alors \(|H(150)| = 1/\sqrt{1+(150/85{,}7)^2} \approx 0{,}50\) : l'harmonique 3 perd la moitié de son amplitude, et même \(|H(50)| \approx 0{,}86\), avec un déphasage d'environ \(-30°\) : le signal utile est atténué et déformé. Un premier ordre est insuffisant quand \(f_e/2\) est si proche des fréquences utiles.</p>
    <p><strong>Q4.</strong> Augmenter \(f_e\), par exemple à 2 kHz (\(f_e/2 = 1\ \text{kHz}\)) : la composante à 420 Hz est échantillonnée à sa vraie fréquence, hors de la bande utile, et un filtre numérique peut ensuite la supprimer. Le filtre anti-repliement ne doit plus traiter que d'éventuelles composantes au-delà de 1 kHz : sa coupure peut être placée bien au-dessus de 150 Hz, par exemple \(f_c = 400\ \text{Hz}\), où \(|H(150)| \approx 0{,}94\) : la composante utile est presque intacte. Autre solution : un filtre analogique d'ordre plus élevé.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Moyenne glissante sur quatre échantillons</h3>
  <div class="statement">On étudie le filtre \(v_k = \dfrac{u_k + u_{k-1} + u_{k-2} + u_{k-3}}{4}\), les entrées étant nulles pour \(k \lt 0\).</div>
  <div class="q"><strong>Q1.</strong> Ce filtre est-il récursif ? Donner sa réponse impulsionnelle. Est-il stable ?</div>
  <div class="q"><strong>Q2.</strong> Calculer sa réponse à l'échelon unité (\(u_k = 1\) pour \(k \geq 0\)). Gain statique ? Au bout de combien de périodes la valeur finale est-elle atteinte ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la sortie pour \(u_k = (-1)^k\) (\(k \geq 0\)). Interpréter en termes de fréquence.</div>
  <div class="q"><strong>Q4.</strong> Écrire une forme récursive équivalente. Quel est son intérêt ?</div>
  <div class="q"><strong>Q5.</strong> Une tension échantillonnée à 1 kHz est polluée par un ronflement secteur à 50 Hz. Quel nombre d'échantillons choisir pour une moyenne glissante qui l'élimine totalement ? Quel retard introduit-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Non récursif : seules les entrées interviennent. Réponse impulsionnelle : \(1/4,\ 1/4,\ 1/4,\ 1/4\), puis 0 (RIF). Il est stable : \(|v_k| \leq \max|u|\).</p>
    <p><strong>Q2.</strong> \(v_0 = 0{,}25\), \(v_1 = 0{,}5\), \(v_2 = 0{,}75\), puis \(v_k = 1\) pour \(k \geq 3\). Gain statique 1 ; valeur finale atteinte après 3 périodes (\(N-1\)).</p>
    <p><strong>Q3.</strong> \(v_0 = 1/4\), \(v_1 = 0\), \(v_2 = 1/4\), puis \(v_k = 0\) pour \(k \geq 3\) (deux \(+1\) et deux \(-1\) dans chaque fenêtre). Or \((-1)^k = \cos(\pi k) = \cos\big(2\pi\,\tfrac{f_e}{2}\,kT_e\big)\) : c'est une sinusoïde à la fréquence de Nyquist, de période \(2T_e\). La fenêtre de 4 échantillons contient exactement deux périodes : la composante est éliminée.</p>
    <p><strong>Q4.</strong> \(v_k = v_{k-1} + (u_k - u_{k-4})/4\). Elle donne la même suite (la réponse impulsionnelle reste finie) avec trois opérations par pas quel que soit \(N\) : avantageux pour une longue fenêtre (il faut tout de même mémoriser les \(N\) dernières entrées pour disposer de \(u_{k-N}\)).</p>
    <p><strong>Q5.</strong> La période du parasite vaut 20 ms, soit 20 périodes d'échantillonnage : \(N = 20\) (ou un multiple). Retard moyen \((N-1)T_e/2 = 9{,}5\ \text{ms}\) ; réponse complète à un échelon en 19 ms.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Passe-bas numérique : différence arrière ou avant ?</h3>
  <div class="statement">On veut programmer un filtre équivalent à \(\tau\,\dot v + v = u\), avec \(\tau = 20\ \text{ms}\) (gain statique 1).</div>
  <div class="q"><strong>Q1.</strong> Par différence arrière, établir la récurrence \(v_k = a\,v_{k-1} + b\,u_k\) ; exprimer \(a\) et \(b\). Vérifier le gain statique.</div>
  <div class="q"><strong>Q2.</strong> Pour \(T_e = 2\ \text{ms}\), calculer \(v_0\), \(v_1\), \(v_2\) en réponse à un échelon unité (\(u_k = 1\) pour \(k \geq 0\), \(v_{-1} = 0\)). Exprimer \(v_k\) et comparer \(v_{10}\) à la réponse exacte du filtre continu à \(t = \tau\).</div>
  <div class="q"><strong>Q3.</strong> Par différence avant, établir l'expression de \(v_{k+1}\). Calculer les premiers termes pour \(T_e = 50\ \text{ms}\) (\(v_0 = 0\)). Conclure.</div>
  <div class="q"><strong>Q4.</strong> À quelle condition sur \(T_e\) le schéma avant est-il stable ? sans oscillation ? Quel schéma retenir ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\tau(v_k - v_{k-1})/T_e + v_k = u_k\), d'où</p>
    $$v_k = \frac{\tau}{\tau+T_e}\,v_{k-1} + \frac{T_e}{\tau+T_e}\,u_k$$
    <p>Ainsi \(a = \tau/(\tau+T_e)\), \(b = T_e/(\tau+T_e)\) et \(a + b = 1\) : pour \(u_k = U\), \(V = aV + bU\) donne \(V = U\). Gain statique 1.</p>
    <p><strong>Q2.</strong> \(a = 20/22 \approx 0{,}909\), \(b \approx 0{,}0909\). \(v_0 \approx 0{,}0909\), \(v_1 \approx 0{,}174\), \(v_2 \approx 0{,}249\). Par récurrence, \(v_k = 1 - a^{k+1}\), donc \(v_{10} = 1 - 0{,}909^{11} \approx 0{,}650\). Réponse exacte à \(t = 10T_e = \tau\) : \(1 - e^{-1} \approx 0{,}632\). L'écart (environ 0,02) vient de ce que le schéma arrière utilise \(u_k\) dès \(k = 0\) : il est légèrement « en avance ». Il diminue avec \(T_e\).</p>
    <p><strong>Q3.</strong> \(\tau(v_{k+1}-v_k)/T_e + v_k = u_k\), d'où \(v_{k+1} = (1 - T_e/\tau)\,v_k + (T_e/\tau)\,u_k\). Pour \(T_e = 50\ \text{ms}\) : \(v_{k+1} = -1{,}5\,v_k + 2{,}5\). Suite : \(0\) ; \(2{,}5\) ; \(-1{,}25\) ; \(4{,}375\) ; \(-4{,}06\)… Le calcul diverge en oscillant, alors que le filtre continu est stable.</p>
    <p><strong>Q4.</strong> Stabilité : \(|1 - T_e/\tau| \lt 1 \iff 0 \lt T_e \lt 2\tau = 40\ \text{ms}\). Sans oscillation : \(1 - T_e/\tau \geq 0 \iff T_e \leq \tau = 20\ \text{ms}\). Le schéma arrière, stable pour tout \(T_e\), est préférable ; dans tous les cas, on prend \(T_e \leq \tau/10 = 2\ \text{ms}\) pour une bonne fidélité.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Vitesse par codeur, vitesse par intégration</h3>
  <div class="statement"><strong>Partie A.</strong> Un moteur porte un codeur incrémental donnant 2000 incréments par tour (fronts comptés). Le calculateur lit le compteur toutes les \(T_e\) et estime la vitesse par \(\omega_k = (\theta_k - \theta_{k-1})/T_e\).<br><strong>Partie B.</strong> Un accéléromètre embarqué fournit, toutes les \(T_e = 0{,}1\ \text{s}\), les échantillons \(a_0, \dots, a_4\) = 0 ; 2 ; 4 ; 4 ; 2 (en m/s²). La vitesse initiale est nulle.</div>
  <div class="q"><strong>A1.</strong> Quelle est la résolution angulaire \(q_\theta\) du codeur ?</div>
  <div class="q"><strong>A2.</strong> Quelle est la résolution de l'estimation de vitesse (en rad/s et en tr/min) pour \(T_e = 1\ \text{ms}\), puis \(T_e = 10\ \text{ms}\) ?</div>
  <div class="q"><strong>A3.</strong> À 1500 tr/min, combien d'incréments compte-t-on pendant 1 ms ? Quelle est l'erreur relative maximale de l'estimation ? Quel compromis apparaît ?</div>
  <div class="q"><strong>B1.</strong> Estimer la vitesse à \(t = 0{,}4\ \text{s}\) par la méthode des rectangles à gauche, à droite, puis des trapèzes.</div>
  <div class="q"><strong>B2.</strong> Écrire la mise à jour récursive de la méthode des trapèzes et une fonction Python qui renvoie la liste des vitesses.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(q_\theta = 2\pi/2000 \approx 3{,}14\ \text{mrad}\) (0,18°).</p>
    <p><strong>A2.</strong> La vitesse estimée est un multiple de \(q_\theta/T_e\). Pour \(T_e = 1\ \text{ms}\) : \(3{,}14\ \text{rad/s}\), soit 30 tr/min. Pour \(T_e = 10\ \text{ms}\) : \(0{,}314\ \text{rad/s}\), soit 3 tr/min.</p>
    <p><strong>A3.</strong> \(1500\ \text{tr/min} \approx 157\ \text{rad/s}\), soit \(157\times10^{-3}/3{,}14\cdot10^{-3} = 50\) incréments par milliseconde. Le comptage est exact à un incrément près : erreur relative \(1/50 = 2\ \%\). Avec \(T_e = 10\ \text{ms}\), 500 incréments et 0,2 %, mais une vitesse rafraîchie dix fois moins souvent et un retard accru (environ 5 ms) : la dérivation numérique impose un compromis entre résolution et rapidité.</p>
    <p><strong>B1.</strong> Rectangles à gauche : \(v_4 = 0{,}1\,(0+2+4+4) = 1{,}0\ \text{m/s}\). À droite : \(0{,}1\,(2+4+4+2) = 1{,}2\ \text{m/s}\). Trapèzes : \(0{,}1\,\big[(0+2)/2 + 2+4+4\big] = 1{,}1\ \text{m/s}\), moyenne des deux précédentes.</p>
    <p><strong>B2.</strong> \(v_k = v_{k-1} + T_e\,(a_k + a_{k-1})/2\).</p>
    <pre class="codeblock"><span class="kw">def</span> integre_trapezes(a, Te, v0=0.0):
    v = [v0]
    <span class="kw">for</span> k <span class="kw">in</span> range(1, len(a)):
        v.append(v[-1] + Te*(a[k] + a[k-1])/2)
    <span class="kw">return</span> v

integre_trapezes([0, 2, 4, 4, 2], 0.1)  <span class="cmt"># [0.0, 0.1, 0.4, 0.8, 1.1]</span></pre>
    <p>Un léger décalage de zéro de l'accéléromètre serait lui aussi intégré : la vitesse calculée dériverait linéairement avec le temps.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>PI numérique incrémental et saturation</h3>
  <div class="statement">Un variateur de vitesse est commandé par un correcteur \(C(p) = K_p\left(1 + \dfrac{1}{T_i\,p}\right)\) avec \(K_p = 3\) et \(T_i = 0{,}6\ \text{s}\), réalisé numériquement avec \(T_e = 30\ \text{ms}\). La commande \(u\) est limitée à l'intervalle \([-10\ \text{V}\,;\ 10\ \text{V}]\).</div>
  <div class="q"><strong>Q1.</strong> Établir la forme incrémentale \(u_k = u_{k-1} + q_0\,\varepsilon_k + q_1\,\varepsilon_{k-1}\) et calculer \(q_0\), \(q_1\).</div>
  <div class="q"><strong>Q2.</strong> L'écart vaut \(\varepsilon_k = 0{,}1\) pour \(k \geq 0\) (avec \(u_{-1} = \varepsilon_{-1} = 0\)). Calculer \(u_0\), \(u_1\), \(u_2\), puis \(u_k\). Comparer à la réponse du PI continu.</div>
  <div class="q"><strong>Q3.</strong> Montrer que la forme position ci-dessous donne la même suite :
    $$u_k = K_p\left(\varepsilon_k + \frac{T_e}{T_i}\sum_{j=0}^{k}\varepsilon_j\right)$$</div>
  <div class="q"><strong>Q4.</strong> Écrire une fonction Python <span class="code-inline">pi_increment(eps, eps_prec, u_prec)</span> qui renvoie la commande saturée. Expliquer pourquoi, sous cette forme, l'action intégrale ne s'emballe pas pendant une saturation prolongée.</div>
  <div class="q"><strong>Q5.</strong> Que deviennent \(q_0\) et \(q_1\) pour \(T_e = 3\ \text{ms}\) ? Quelles précautions de programmation en tirer ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> De \(\dot u = K_p(\dot\varepsilon + \varepsilon/T_i)\), par différence arrière :</p>
    $$u_k - u_{k-1} = K_p\big(\varepsilon_k - \varepsilon_{k-1}\big) + K_p\,\frac{T_e}{T_i}\,\varepsilon_k$$
    <p>Donc \(q_0 = K_p(1 + T_e/T_i) = 3 \times 1{,}05 = 3{,}15\) et \(q_1 = -K_p = -3\).</p>
    <p><strong>Q2.</strong> \(u_0 = 3{,}15\times0{,}1 = 0{,}315\) ; \(u_1 = 0{,}315 + 0{,}315 - 0{,}3 = 0{,}33\) ; \(u_2 = 0{,}345\) ; plus généralement \(u_k = 0{,}315 + 0{,}015\,k\). C'est une rampe de 0,015 V par période, soit 0,5 V/s. En continu, \(u(t) = K_p\varepsilon_0(1 + t/T_i)\) : pente \(K_p\varepsilon_0/T_i = 0{,}5\ \text{V/s}\), identique ; seule la valeur de départ diffère (0,315 au lieu de 0,3), car la méthode des rectangles à droite compte le premier échantillon immédiatement.</p>
    <p><strong>Q3.</strong> En formant \(u_k - u_{k-1}\) avec la forme position, les deux sommes ne diffèrent que par leur dernier terme \(\varepsilon_k\) : on retrouve exactement la relation de Q1, c'est-à-dire la forme incrémentale. Les premiers termes coïncident aussi : \(u_0 = K_p(1 + T_e/T_i)\,\varepsilon_0\) dans les deux cas.</p>
    <p><strong>Q4.</strong></p>
    <pre class="codeblock">KP, TI, TE = 3.0, 0.6, 0.03
Q0, Q1 = KP*(1 + TE/TI), -KP
U_MIN, U_MAX = -10.0, 10.0

<span class="kw">def</span> pi_increment(eps, eps_prec, u_prec):
    u = u_prec + Q0*eps + Q1*eps_prec
    <span class="kw">return</span> min(max(u, U_MIN), U_MAX)</pre>
    <p>La valeur mémorisée et réutilisée au pas suivant est la commande <em>saturée</em> : tant que la saturation dure, \(u\) reste collée à la limite et aucune intégrale cachée ne grossit ; la commande quitte la butée dès que l'incrément calculé change de signe (en pratique dès que l'écart diminue assez vite), sans attendre que l'écart s'inverse. Sous forme position, la somme \(\sum\varepsilon_j\) continuerait de croître pendant la saturation : il faudrait ensuite un long écart de signe opposé pour la « vider », d'où un fort dépassement.</p>
    <p><strong>Q5.</strong> \(q_0 = 3(1 + 0{,}005) = 3{,}015\) et \(q_1 = -3\) : les coefficients dépendent de \(T_e\) et doivent être recalculés à partir de la constante <span class="code-inline">TE</span>, jamais saisis « en dur ». L'action intégrale par pas, \(q_0 + q_1 = K_pT_e/T_i = 0{,}015\), devient petite devant chaque terme : en arithmétique entière (virgule fixe) sur un petit microcontrôleur, les arrondis pourraient la faire disparaître ; il faut alors augmenter la précision des calculs.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Régulation de niveau : période d'échantillonnage maximale</h3>
  <div class="statement">Le niveau \(h\) d'une cuve de section \(S = 0{,}5\ \text{m}^2\) est réglé par une pompe de débit volumique \(q_v = K_v\,u\), avec \(K_v = 2\cdot10^{-3}\ \text{m}^3\cdot\text{s}^{-1}\cdot\text{V}^{-1}\) ; \(u\) est la tension délivrée par un CNA suivi d'un bloqueur. Le débit de sortie est négligé : \(S\,\dot h = q_v\). Le calculateur mesure \(h_k\) et calcule \(u_k = K_p(h_c - h_k)\), avec \(K_p = 50\ \text{V/m}\) et une consigne \(h_c\) constante. On pose \(K = K_pK_v/S\).</div>
  <div class="q"><strong>Q1.</strong> En commande continue (\(u = K_p(h_c - h)\)), établir l'équation du niveau et montrer que la boucle est stable quel que soit \(K_p > 0\). Calculer \(K\).</div>
  <div class="q"><strong>Q2.</strong> En numérique, \(u\) est constante sur chaque période. Montrer que \(h_{k+1} = h_k + \dfrac{K_vT_e}{S}\,u_k\) exactement, puis établir la récurrence vérifiée par \(\varepsilon_k = h_c - h_k\).</div>
  <div class="q"><strong>Q3.</strong> En déduire la condition de stabilité sur \(T_e\), la condition d'absence d'oscillation, et la période qui amène le niveau à la consigne en un seul pas.</div>
  <div class="q"><strong>Q4.</strong> Approche fréquentielle : donner la FTBO continue, \(\omega_{c0}\) et \(M_\varphi\). En modélisant le bloqueur par un retard \(T_e/2\), quelle période garantit \(M_\varphi \geq 45°\) ? Comparer à Q3.</div>
  <div class="q"><strong>Q5.</strong> Le calcul dure en réalité une période : \(u_k\) n'est appliquée qu'entre \((k+1)T_e\) et \((k+2)T_e\). Montrer que \(\varepsilon_{k+2} = \varepsilon_{k+1} - KT_e\,\varepsilon_k\), puis en déduire la nouvelle condition de stabilité.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S\dot h = K_vK_p(h_c - h)\), soit \(\dot h + K h = K h_c\) : premier ordre de constante de temps \(1/K\), dont le pôle \(-K\) est négatif pour tout \(K_p > 0\). \(K = 50\times2\cdot10^{-3}/0{,}5 = 0{,}2\ \text{s}^{-1}\) (constante de temps 5 s).</p>
    <p><strong>Q2.</strong> Sur \([kT_e,(k+1)T_e]\), \(u = u_k\) est constante : en intégrant \(S\dot h = K_vu_k\), \(S(h_{k+1} - h_k) = K_vT_e\,u_k\), sans approximation. Avec \(u_k = K_p\varepsilon_k\) et \(h_c\) constante : \(\varepsilon_{k+1} = \varepsilon_k - \tfrac{K_vT_e}{S}K_p\varepsilon_k\), soit</p>
    $$\varepsilon_{k+1} = (1 - KT_e)\,\varepsilon_k$$
    <p><strong>Q3.</strong> Stabilité : \(|1 - KT_e| \lt 1 \iff 0 \lt T_e \lt 2/K = 10\ \text{s}\). Pas d'oscillation si \(1 - KT_e \geq 0\), soit \(T_e \leq 1/K = 5\ \text{s}\). Pour \(T_e = 5\ \text{s}\), \(\varepsilon_1 = 0\) : consigne atteinte en un pas (en pratique, la pompe saturerait). Pour \(T_e = 0{,}5\ \text{s}\), l'écart est multiplié par 0,9 à chaque pas : après 10 pas (5 s), \(0{,}9^{10} \approx 0{,}35\), proche de \(e^{-1} \approx 0{,}37\) en continu.</p>
    <p><strong>Q4.</strong> FTBO \(= K/p\) : intégrateur pur, \(\omega_{c0} = K = 0{,}2\ \text{rad/s}\), \(M_\varphi = 90°\). Le retard \(T_e/2\) retire \(KT_e/2\) rad : \(M_\varphi \geq 45°\) impose \(KT_e/2 \leq \pi/4\), soit \(T_e \leq \pi/(2K) \approx 7{,}9\ \text{s}\). Cette approche prédirait l'instabilité pour \(KT_e/2 = \pi/2\), soit \(T_e \approx 15{,}7\ \text{s}\), alors que la limite exacte est 10 s : le modèle « retard \(T_e/2\) » est optimiste dès que \(\omega_{c0}T_e\) n'est plus petit devant 1.</p>
    <p><strong>Q5.</strong> Sur \([(k+1)T_e,(k+2)T_e]\), la commande vaut \(u_k\) : \(h_{k+2} = h_{k+1} + \tfrac{K_vT_e}{S}K_p\varepsilon_k\), d'où \(\varepsilon_{k+2} = \varepsilon_{k+1} - KT_e\,\varepsilon_k\). Équation caractéristique : \(r^2 - r + KT_e = 0\), de discriminant \(1 - 4KT_e\).</p>
    <ul>
      <li>Si \(KT_e \leq 1/4\) : racines réelles \(\big(1 \pm \sqrt{1-4KT_e}\big)/2\), comprises entre 0 et 1 : stable, sans oscillation.</li>
      <li>Si \(KT_e > 1/4\) : racines complexes conjuguées de module \(\sqrt{KT_e}\) (leur produit vaut \(KT_e\)) : stable si et seulement si \(KT_e \lt 1\).</li>
    </ul>
    <p>Condition de stabilité : \(0 \lt T_e \lt 1/K = 5\ \text{s}\). Le retard de calcul <strong>divise par deux</strong> la période maximale, et l'absence d'oscillation exige maintenant \(T_e \leq 1/(4K) = 1{,}25\ \text{s}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Banc d'essai d'un ressort : fichier de mesures et filtre du second ordre</h3>
  <div class="statement">Un banc mesure l'effort \(F\) d'un ressort de suspension de VTT maintenu comprimé à course fixée. Le capteur est échantillonné à \(f_e = 500\ \text{Hz}\) (\(T_e = 2\ \text{ms}\)). Le fichier essai.csv contient une ligne d'en-tête, puis une ligne par échantillon : le temps \(t\) (s) et l'effort \(F\) (N), séparés par un point-virgule. La première demi-seconde est un transitoire (mise en compression).</div>
  <div class="q"><strong>Q1.</strong> Écrire les instructions Python (numpy) qui lisent le fichier, ne gardent que les échantillons tels que \(t \geq 0{,}5\ \text{s}\), puis calculent la moyenne et l'écart type de l'effort.</div>
  <div class="q"><strong>Q2.</strong> Dix valeurs du régime établi sont : 812, 806, 809, 815, 803, 810, 808, 811, 805 et 811 N. Calculer leur moyenne, leur écart type (diviseur \(N-1\)) et l'incertitude-type de la moyenne. Que renverrait np.std sans option ?</div>
  <div class="q"><strong>Q3.</strong> Pour afficher une valeur lissée en temps réel, on calcule une moyenne glissante sur 25 échantillons. Donner la durée de la fenêtre, le retard moyen, le temps de réponse complet à un échelon et le facteur de réduction d'un bruit indépendant d'un échantillon à l'autre. Élimine-t-elle un parasite secteur à 50 Hz ?</div>
  <div class="q"><strong>Q4.</strong> On envisage plutôt un passe-bas du second ordre de gain 1, de fréquence propre \(f_0 = 4\ \text{Hz}\) et d'amortissement \(\xi = 1\), discrétisé par différences arrière. Écrire sa récurrence avec ses coefficients numériques, vérifier le gain statique et la condition de fidélité au filtre continu.</div>
  <div class="q"><strong>Q5.</strong> Calculer \(v_0\), \(v_1\), \(v_2\) pour un échelon unité appliqué au repos (\(v_{-1} = v_{-2} = 0\)). Une simulation donne pour ce filtre un temps de réponse à 5 % de 192 ms, sans dépassement, et un bruit divisé par 9 ; la moyenne glissante atteint 95 % en 46 ms. Comparer les deux filtres.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On sélectionne le régime établi par un masque booléen (tableau de True et False de même longueur que t) :</p>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
d = np.loadtxt(<span class="str">'essai.csv'</span>, delimiter=<span class="str">';'</span>, skiprows=1)
t, F = d[:, 0], d[:, 1]
Fe = F[t &gt;= 0.5]              <span class="cmt"># régime établi seulement</span>
m = np.mean(Fe)               <span class="cmt"># moyenne (N)</span>
s = np.std(Fe, ddof=1)        <span class="cmt"># écart type, diviseur N-1</span></pre>
    <p><strong>Q2.</strong> Somme 8 090 N, d'où \(\bar F = 809{,}0\ \text{N}\). Écarts à la moyenne : 3 ; −3 ; 0 ; 6 ; −6 ; 1 ; −1 ; 2 ; −4 ; 2, dont les carrés ont pour somme 116 N². Écart type \(s = \sqrt{116/9} \approx 3{,}59\ \text{N}\) ; incertitude-type de la moyenne \(s/\sqrt{10} \approx 1{,}14\ \text{N}\). Sans option, np.std divise par \(N = 10\) : \(\sqrt{11{,}6} \approx 3{,}41\ \text{N}\), soit 5 % de moins, un écart qui devient négligeable sur quelques centaines de valeurs.</p>
    <p><strong>Q3.</strong> Fenêtre : \(25 \times 2 = 50\ \text{ms}\). Retard moyen \((N-1)T_e/2 = 24\ \text{ms}\) ; la réponse à un échelon est complète après \(N - 1 = 24\) périodes, soit 48 ms. Un bruit indépendant est divisé par \(\sqrt{25} = 5\). La moyenne glissante annule exactement les sinusoïdes de période 50 ms (20 Hz) et leurs harmoniques de rang non multiple de 25 ; une période du secteur (20 ms) dure 10 échantillons, et la fenêtre en contient 2,5 : le 50 Hz n'est pas éliminé (il en reste environ 13 %). Il faudrait \(N = 10, 20, 30\)…</p>
    <p><strong>Q4.</strong> Avec \(x = \omega_0T_e = 2\pi \times 4 \times 0{,}002 \approx 0{,}0503\) : \(2\xi x \approx 0{,}1005\), \(x^2 \approx 0{,}00253\) et \(D = 1 + 2\xi x + x^2 \approx 1{,}1031\). La récurrence du cours, \(v_k = \big[(2+2\xi x)\,v_{k-1} - v_{k-2} + x^2u_k\big]/D\), devient</p>
    <div class="formula">$$v_k = 1{,}9043\,v_{k-1} - 0{,}9066\,v_{k-2} + 0{,}00229\,u_k$$</div>
    <p>Gain statique : avec \(u_k = U\) et \(v_k \to V\), \((1 - 1{,}9043 + 0{,}9066)\,V = 0{,}00229\,U\) ; le coefficient de gauche vaut exactement \(x^2/D\), comme celui de droite : \(V = U\). Fidélité : \(\omega_0T_e \approx 0{,}05 \leq 0{,}1\) ; le filtre calculé a un pôle double en \(-24{,}5\ \text{s}^{-1}\), au lieu de \(-\omega_0 \approx -25{,}1\ \text{s}^{-1}\) en continu.</p>
    <p><strong>Q5.</strong> \(v_0 = 0{,}00229\), puis</p>
    <div class="formula">$$v_1 = 1{,}9043 \times 0{,}00229 + 0{,}00229 \approx 0{,}00665$$</div>
    <div class="formula">$$v_2 = 1{,}9043 \times 0{,}00665 - 0{,}9066 \times 0{,}00229 + 0{,}00229 \approx 0{,}0129$$</div>
    <p>Le départ est très lent, comme pour le second ordre continu (tangente horizontale à l'origine), alors que la moyenne glissante monte de \(1/25 = 0{,}04\) par période. Bilan : la moyenne glissante est quatre fois plus rapide (46 ms contre 192 ms) mais lisse moins (bruit divisé par 5 contre 9) et mémorise 25 valeurs contre 2 ; le second ordre atténue aussi bien mieux le 50 Hz (il en laisse 0,6 % environ). Pour une valeur affichée, où quelques dixièmes de seconde importent peu, le second ordre convient mieux.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Avance de phase programmée : influence de la période d'échantillonnage</h3>
  <div class="statement">Le réglage continu de la boucle de position d'un axe de robot a donné un correcteur à avance de phase \(C(p) = K_p\,\dfrac{1+aTp}{1+Tp}\), avec \(K_p = 0{,}8\ \text{V/rad}\), \(a = 9\) et \(T = 5\ \text{ms}\), centré sur la coupure visée. Le calculateur l'exécute toutes les \(T_e\) ; \(\varepsilon_k\) est l'écart de position (rad) et \(u_k\) la commande (V).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_m\) et \(\varphi_m\) du correcteur continu, puis la commande juste après un échelon d'écart \(\varepsilon_0 = 0{,}1\ \text{rad}\) et sa valeur finale.</div>
  <div class="q"><strong>Q2.</strong> À partir de la loi temporelle du correcteur, établir par différence arrière la récurrence \(u_k = \alpha\,u_{k-1} + b_0\,\varepsilon_k + b_1\,\varepsilon_{k-1}\) et exprimer \(\alpha\), \(b_0\), \(b_1\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(T_e = 0{,}5\ \text{ms}\) : calculer les coefficients et vérifier le gain statique. L'écart passe de 0 à 0,1 rad à \(k = 0\) et y reste : calculer \(u_0\), \(u_1\), \(u_2\), puis exprimer \(u_k\). Comparer au correcteur continu.</div>
  <div class="q"><strong>Q4.</strong> Pour \(T_e = 2{,}5\ \text{ms}\), calculer les coefficients et \(u_0\). On admet qu'à \(\omega_m\) la récurrence apporte une avance de 52,4° pour \(T_e = 0{,}5\ \text{ms}\) et de 49,4° pour \(T_e = 2{,}5\ \text{ms}\). En tenant compte du retard \(T_e/2\) du bloqueur, calculer l'avance nette dans les deux cas. Conclure.</div>
  <div class="q"><strong>Q5.</strong> Écrire les lignes Python qui calculent les coefficients une fois pour toutes, puis, à chaque période, la commande saturée à \(\pm 10\ \text{V}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_m = \dfrac{1}{T\sqrt a} = \dfrac{1}{0{,}005 \times 3} \approx 66{,}7\ \text{rad/s}\) ; \(\sin\varphi_m = \dfrac{a-1}{a+1} = 0{,}8\), d'où \(\varphi_m \approx 53{,}1°\). Valeur initiale \(u(0^+) = aK_p\,\varepsilon_0 = 0{,}72\ \text{V}\) ; valeur finale \(K_p\,\varepsilon_0 = 0{,}08\ \text{V}\). Entre les deux, \(u(t) = K_p\varepsilon_0\big[1 + (a-1)\,e^{-t/T}\big]\) décroît avec la constante de temps \(T\).</p>
    <p><strong>Q2.</strong> La loi \(u + T\,\dot u = K_p(\varepsilon + aT\,\dot\varepsilon)\) donne, par différence arrière sur les deux dérivées puis multiplication par \(T_e\) :</p>
    <div class="formula">$$(T + T_e)\,u_k = T\,u_{k-1} + K_p(T_e + aT)\,\varepsilon_k - K_paT\,\varepsilon_{k-1}$$</div>
    <p>d'où \(\alpha = \dfrac{T}{T+T_e}\), \(b_0 = K_p\,\dfrac{T_e+aT}{T+T_e}\) et \(b_1 = -K_p\,\dfrac{aT}{T+T_e}\).</p>
    <p><strong>Q3.</strong> \(\alpha = 5/5{,}5 \approx 0{,}9091\), \(b_0 = 0{,}8 \times 45{,}5/5{,}5 \approx 6{,}618\), \(b_1 = -0{,}8 \times 45/5{,}5 \approx -6{,}545\). Gain statique : \(\dfrac{b_0 + b_1}{1 - \alpha} = \dfrac{0{,}0727}{0{,}0909} = 0{,}8\), soit \(K_p\). Pour \(k \geq 1\), \(\varepsilon_k = \varepsilon_{k-1} = 0{,}1\) : \(u_k = \alpha\,u_{k-1} + 0{,}00727\). Donc \(u_0 = b_0 \times 0{,}1 \approx 0{,}662\ \text{V}\), \(u_1 \approx 0{,}609\ \text{V}\), \(u_2 \approx 0{,}561\ \text{V}\) et, la suite étant arithmético-géométrique de point fixe 0,08 :</p>
    <div class="formula">$$u_k = 0{,}08 + 0{,}582\,\alpha^k\quad(\text{V})$$</div>
    <p>Comme \(\alpha^k = e^{k\ln\alpha}\) avec \(\ln\alpha \approx -0{,}0953\), l'excédent décroît avec une constante de temps \(T_e/0{,}0953 \approx 5{,}2\ \text{ms}\), presque \(T\). Le pic (0,662 V au lieu de 0,72 V) est un peu plus faible qu'en continu : le correcteur programmé reproduit fidèlement le correcteur continu.</p>
    <p><strong>Q4.</strong> \(\alpha = 5/7{,}5 \approx 0{,}667\), \(b_0 = 0{,}8 \times 47{,}5/7{,}5 \approx 5{,}067\), \(b_1 = -0{,}8 \times 45/7{,}5 = -4{,}8\) (gain statique toujours \(0{,}267/0{,}333 = 0{,}8\)) ; \(u_0 \approx 0{,}507\ \text{V}\). Retard du bloqueur à \(\omega_m\) : \(\omega_mT_e/2\), soit 0,0167 rad (0,95°) pour 0,5 ms et 0,0833 rad (4,8°) pour 2,5 ms. Avances nettes : \(52{,}4 - 0{,}95 \approx 51{,}4°\) et \(49{,}4 - 4{,}8 \approx 44{,}6°\), contre 53,1° en continu. Avec \(T_e = T/10\), il ne manque que 1,7° ; avec \(T_e = T/2\), il manque 8,5° de marge de phase : le réglage continu n'est plus respecté. On garde \(T_e \leq T/10 = 0{,}5\ \text{ms}\), ou l'on reprend le réglage en comptant ce retard.</p>
    <p><strong>Q5.</strong></p>
    <pre class="codeblock">KP, A, T, TE = 0.8, 9.0, 0.005, 0.0005
AL = T/(T + TE)                    <span class="cmt"># coefficients calculés une fois</span>
B0 = KP*(TE + A*T)/(T + TE)
B1 = -KP*A*T/(T + TE)
u_prec, eps_prec = 0.0, 0.0
<span class="kw">while</span> True:
    attendre_top_horloge()          <span class="cmt"># toutes les TE</span>
    eps = lire_consigne() - lire_position()
    u = AL*u_prec + B0*eps + B1*eps_prec
    u = min(max(u, -10.0), 10.0)    <span class="cmt"># saturation</span>
    ecrire_CNA(u)
    u_prec, eps_prec = u, eps</pre>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Plateau chauffant d'imprimante 3D : de la mesure au correcteur</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>systèmes numériques : acquisition, filtrage, correction</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Le plateau chauffant d'une imprimante 3D doit être maintenu à une température de consigne \(\theta_c\) réglable de 20 à 110 °C. La chaîne comprend : une sonde et son conditionnement, qui délivrent \(u_m = k_c\,\theta\) avec \(k_c = 25\ \text{mV/°C}\) (de 0 à 130 °C) ; le CAN 12 bits du microcontrôleur, de plage 0–3,3 V ; le programme de régulation ; une commande de puissance par MLI dont le rapport cyclique \(u\) (en %) est borné entre 0 et 100 %. Autour du point de fonctionnement, le plateau est modélisé par
    $$H(p) = \frac{\Theta(p)}{U(p)} = \frac{K}{1+\tau p},\qquad K = 1{,}2\ \text{°C}/\%,\quad \tau = 120\ \text{s}$$
    Extraits du cahier des charges : résolution de mesure \(\leq 0{,}1\ \text{°C}\) ; écart statique nul pour une consigne en échelon ; marge de phase \(\geq 60°\).
  </div>

  <p class="exo-part">Partie A — Acquisition</p>
  <div class="q"><strong>A1.</strong> Calculer le quantum du CAN et la résolution de la mesure en °C. Le cahier des charges est-il respecté ? Combien de bits auraient suffi ?</div>
  <div class="q"><strong>A2.</strong> La mesure est polluée par un parasite à 50 Hz d'amplitude 20 mV rayonné par l'alimentation. Le CAN échantillonne à \(f_a = 1\ \text{kHz}\). Que représente ce parasite en °C ? Montrer qu'une moyenne glissante sur 20 échantillons l'élimine.</div>

  <p class="exo-part">Partie B — Filtrage numérique</p>
  <div class="q"><strong>B1.</strong> On envisage plutôt un passe-bas du premier ordre de gain 1 et de constante de temps \(\tau_f = 0{,}1\ \text{s}\), discrétisé par différence arrière avec \(T_a = 1\ \text{ms}\). Écrire la récurrence et calculer son coefficient.</div>
  <div class="q"><strong>B2.</strong> À l'aide du modèle continu, calculer l'atténuation du parasite à 50 Hz et son amplitude résiduelle en °C. Conclure.</div>
  <div class="q"><strong>B3.</strong> Le retard introduit par ce filtre est-il gênant pour la régulation ?</div>

  <p class="exo-part">Partie C — Correction numérique</p>
  <div class="q"><strong>C1.</strong> On choisit \(C(p) = K_p\left(1 + \dfrac{1}{T_i\,p}\right)\) avec \(T_i = \tau\). Justifier ce choix vis-à-vis du cahier des charges et montrer que la FTBO devient \(K_pK/(\tau p)\). Pour \(K_p = 5\ \%/\text{°C}\), calculer \(\omega_{c0}\) et la marge de phase en continu.</div>
  <div class="q"><strong>C2.</strong> Le correcteur est exécuté toutes les \(T_e = 0{,}5\ \text{s}\) sur la mesure filtrée. Établir sa forme incrémentale et calculer ses coefficients.</div>
  <div class="q"><strong>C3.</strong> On modélise le bloqueur par un retard \(T_e/2\) et on ajoute un retard de calcul d'une période (retard total \(3T_e/2\)). Calculer la marge de phase. Quelle période maximale respecte encore \(M_\varphi \geq 60°\) ?</div>

  <p class="exo-part">Partie D — Programme</p>
  <div class="q"><strong>D1.</strong> Écrire en Python la boucle complète : acquisition à 1 kHz, filtrage (B1), calcul du correcteur une fois toutes les 500 acquisitions, saturation du rapport cyclique.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(q = 3{,}3/4096 \approx 0{,}806\ \text{mV}\), soit \(q/k_c \approx 0{,}032\ \text{°C}\) : la résolution exigée (0,1 °C) est respectée. La plage du CAN correspond à \(3{,}3/0{,}025 = 132\ \text{°C}\) ; pour 0,1 °C il faut 1320 paliers, et \(2^{11} = 2048 \geq 1320\) : <strong>11 bits</strong> auraient suffi (10 bits, 1024 paliers, non).</p>
    <p><strong>A2.</strong> \(20/25 = 0{,}8\ \text{°C}\) : huit fois la résolution exigée, inacceptable. À 1 kHz, une période du parasite (20 ms) contient exactement 20 échantillons ; la moyenne d'une sinusoïde sur une période entière est nulle, donc la moyenne glissante sur 20 échantillons supprime le parasite (ainsi que ses harmoniques de rang 2 à 19). Shannon est respecté (50 Hz \(\lt\) 500 Hz) : pas de repliement.</p>
    <p><strong>B1.</strong> \(\theta_{f,k} = a\,\theta_{f,k-1} + (1-a)\,\theta_k\), avec \(a = \tau_f/(\tau_f + T_a) = 0{,}1/0{,}101 \approx 0{,}990\).</p>
    <p><strong>B2.</strong> \(|H_f(j\omega)| = 1/\sqrt{1 + (\omega\tau_f)^2}\) avec \(\omega\tau_f = 2\pi\times50\times0{,}1 \approx 31{,}4\) : atténuation \(\approx 0{,}032\). Amplitude résiduelle : \(20\times0{,}032 \approx 0{,}64\ \text{mV}\), soit \(0{,}025\ \text{°C}\), inférieure à la résolution exigée et de l'ordre du quantum. Le filtre convient.</p>
    <p><strong>B3.</strong> Non : \(\tau_f = 0{,}1\ \text{s}\) est négligeable devant \(\tau = 120\ \text{s}\) et devant \(1/\omega_{c0} = 20\ \text{s}\) (C1). Déphasage à \(\omega_{c0}\) : \(\arctan(0{,}05\times0{,}1) \approx 0{,}3°\).</p>
    <p><strong>C1.</strong> L'action intégrale rend la FTBO de classe 1 : écart statique nul en réponse à un échelon. Le choix \(T_i = \tau\) compense le pôle du plateau :</p>
    $$C(p)\,H(p) = K_p\,\frac{1+\tau p}{\tau p}\cdot\frac{K}{1+\tau p} = \frac{K_pK}{\tau p}$$
    <p>Intégrateur pur : \(\omega_{c0} = K_pK/\tau = 5\times1{,}2/120 = 0{,}05\ \text{rad/s}\) et \(M_\varphi = 90°\).</p>
    <p><strong>C2.</strong> Par différence arrière sur la loi du PI (cours, §8), avec \(\varepsilon_k = \theta_{c} - \theta_{f}\) relevé à l'instant \(kT_e\) :</p>
    $$u_k = u_{k-1} + K_p\left(1 + \frac{T_e}{T_i}\right)\varepsilon_k - K_p\,\varepsilon_{k-1}$$
    <p>Numériquement, \(K_p(1 + T_e/T_i) = 5\times(1 + 0{,}5/120) \approx 5{,}021\) : \(u_k = u_{k-1} + 5{,}021\,\varepsilon_k - 5\,\varepsilon_{k-1}\).</p>
    <p><strong>C3.</strong> Perte de phase : \(\omega_{c0}\cdot 3T_e/2 = 0{,}05\times0{,}75\), soit \(0{,}0375\ \text{rad} \approx 2{,}1°\), d'où \(M_\varphi \approx 88°\). Pour garder \(M_\varphi \geq 60°\) : \(\omega_{c0}\cdot3T_e/2 \leq \pi/6\), soit \(T_e \leq \pi/(9\,\omega_{c0}) \approx 7\ \text{s}\). La période choisie (0,5 s) laisse une très large marge, et l'approximation est justifiée (\(\omega_{c0}T_e = 0{,}025 \ll 1\)).</p>
    <p><strong>D1.</strong></p>
    <pre class="codeblock">TA, TE = 0.001, 0.5                <span class="cmt"># acquisition 1 ms, régulation 0,5 s</span>
KC = 0.025                         <span class="cmt"># sensibilité (V/°C)</span>
A = 0.1/(0.1 + TA)                 <span class="cmt"># passe-bas, tau_f = 0,1 s</span>
KP, TI = 5.0, 120.0
Q0, Q1 = KP*(1 + TE/TI), -KP

theta_f = lire_CAN()/KC            <span class="cmt"># lire_CAN renvoie des volts</span>
u_prec, eps_prec, n = 0.0, 0.0, 0
<span class="kw">while</span> True:
    attendre_top(TA)               <span class="cmt"># cadence 1 kHz</span>
    theta = lire_CAN()/KC
    theta_f = A*theta_f + (1 - A)*theta
    n = n + 1
    <span class="kw">if</span> n == 500:                   <span class="cmt"># une fois toutes les TE</span>
        n = 0
        eps = lire_consigne() - theta_f
        u = u_prec + Q0*eps + Q1*eps_prec
        u = min(max(u, 0.0), 100.0)  <span class="cmt"># rapport cyclique borné</span>
        ecrire_MLI(u)
        u_prec, eps_prec = u, eps</pre>
    <p>Au démarrage, plateau froid, l'écart est grand et la commande calculée dépasse largement 100 % : \(u\) est saturée. Sous forme position, la somme des écarts continuerait de croître pendant toute la chauffe et la température dépasserait nettement la consigne (une simulation du modèle donne près de 20 °C de dépassement pour une montée de 20 à 110 °C). Avec la forme incrémentale saturée, aucune intégrale ne s'accumule : la commande quitte la butée dès que la température monte, et la consigne est rejointe sans dépassement, au prix d'une approche plus progressive.</p>
  </div>
</div>
