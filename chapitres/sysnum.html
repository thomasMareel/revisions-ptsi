<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Compétences B2 « Modéliser un correcteur numérique » (S4), D3 « Effectuer des traitements à partir de données » (S3) et C3 « Résoudre numériquement une équation » pour son volet intégration et dérivation numériques (S3), toutes trois en lien avec l'informatique. Les erreurs de mesure (résolution, quantification, échantillonnage) sont des rappels de S2. Les correcteurs continus que l'on programme ici sont réglés dans « Correction des SLCI » ; l'effet d'un retard sur la stabilité est vu dans le chapitre « Stabilité » de 1ʳᵉ année.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Chaîne d'acquisition et de commande numérique</strong> : signaux analogique, échantillonné et numérique (§1).</li>
        <li><strong>Signaux à temps discret</strong> (S4) : échantillonnage, condition de Shannon, repliement et filtre anti-repliement (§2) ; quantification, quantum, résolution et nombre de bits (§3) ; conversion numérique-analogique et bloqueur d'ordre 0 (§4).</li>
        <li><strong>Traitement de données</strong> (S3) : relations de récurrence, moyenne glissante ; traitement d'un fichier de mesures, moyenne et écart type (§5).</li>
        <li><strong>Filtres numériques passe-bas du premier et du second ordre</strong> (S3), obtenus par les schémas avant et arrière (§6).</li>
        <li><strong>Intégration et dérivation numériques</strong> (S3) : schémas arrière et avant, méthode des trapèzes (§7).</li>
        <li><strong>Équations de récurrence des correcteurs numériques</strong> proportionnel, proportionnel intégral et à avance de phase ; influence de la période d'échantillonnage, qui montre les limites du modèle continu (§8).</li>
      </ul>
      <p>La transformée en z n'est pas au programme (elle n'est pas utilisée ici). L'intégration exacte sur une période (§6) et la forme incrémentale du PID (§8) sont des compléments, signalés comme tels.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LA CHAÎNE NUMÉRIQUE</div>
  <h2>Acquérir, calculer, commander</h2>
  <div class="intro">Dans un drone, un robot, une imprimante 3D ou un véhicule récent, la loi de commande n'est plus câblée avec des composants analogiques : c'est un programme exécuté par un calculateur (microcontrôleur, automate, carte embarquée). Or un calculateur ne manipule que des nombres, et seulement à des instants séparés. Il faut donc convertir les grandeurs physiques à l'entrée, et reconstituer un signal physique à la sortie.</div>

  <h3>Les maillons de la chaîne</h3>
  <ul>
    <li><strong>Capteur</strong> : traduit la grandeur physique (position, vitesse, température, pression…) en grandeur électrique.</li>
    <li><strong>Conditionnement</strong> : amplifie et décale le signal pour qu'il occupe toute la plage d'entrée du convertisseur, et le filtre (filtre anti-repliement, §2).</li>
    <li><strong>Échantillonneur-bloqueur + CAN</strong> (convertisseur analogique-numérique) : prélève la valeur du signal toutes les \(T_e\) secondes, la fige le temps de la conversion, puis la code par un entier sur \(N\) bits.</li>
    <li><strong>Calculateur</strong> : exécute une fois par période l'algorithme (filtrage, comparaison à la consigne, loi de commande).</li>
    <li><strong>CNA</strong> (convertisseur numérique-analogique) <strong>+ bloqueur</strong> : transforme le nombre calculé en une tension maintenue jusqu'au calcul suivant.</li>
    <li><strong>Préactionneur</strong> (variateur, hacheur, étage de puissance à MLI) puis <strong>actionneur</strong>.</li>
  </ul>

  <h3>Trois natures de signaux</h3>
  <div class="def-box">
    <ul style="margin:.2rem 0">
      <li><strong>Analogique</strong> : défini à chaque instant, à valeurs dans un continuum.</li>
      <li><strong>Échantillonné</strong> : connu seulement aux instants \(t_k = kT_e\) ; on note \(s_k = s(kT_e)\) l'échantillon d'indice \(k\). Ses valeurs sont encore quelconques.</li>
      <li><strong>Numérique</strong> : échantillonné <em>et</em> quantifié : chaque échantillon est remplacé par un entier codé sur \(N\) bits (§3).</li>
    </ul>
    $$s_k = s(kT_e),\quad k\in\mathbb{N}\qquad\qquad f_e = \frac{1}{T_e}$$
    \(T_e\) : période d'échantillonnage (s) ; \(f_e\) : fréquence d'échantillonnage (Hz).
  </div>
  <div class="prop-box">
    <strong>Capteurs directement numériques.</strong> Un codeur optique incrémental (comptage d'impulsions) ou absolu (mot binaire lu sur un disque gravé) délivre déjà un nombre : pas de CAN. La mesure reste quantifiée (un pas du codeur) et n'est lue qu'à la cadence du calculateur.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">À retenir</span>
    <span class="prompt">Pourquoi tout ne se fait-il pas en analogique ? Quel est le prix à payer ?</span>
    <div class="content">
      <p><strong>Atouts du numérique</strong> : loi de commande modifiable par simple reprogrammation, lois non linéaires, saturations, séquences et surveillance faciles à coder, aucune dérive des composants, communication avec d'autres calculateurs.</p>
      <p><strong>Contreparties</strong> : on ignore ce qui se passe entre deux échantillons, chaque valeur est arrondie (quantification), et la conversion, le calcul et le blocage ajoutent un <strong>retard</strong> qui dégrade la stabilité (§4 et §8).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ÉCHANTILLONNAGE</div>
  <h2>Période d'échantillonnage, Shannon et repliement</h2>
  <div class="intro">Échantillonner, c'est ne regarder le signal qu'une fois toutes les \(T_e\) secondes. Si le signal varie trop vite entre deux prélèvements, les échantillons ne permettent plus de le reconnaître ; pire, ils peuvent faire croire à une variation lente qui n'existe pas.</div>

  <h3>Condition de Nyquist-Shannon</h3>
  <div class="prop-box">
    <strong>Théorème d'échantillonnage.</strong> Si le spectre d'un signal ne contient aucune composante au-delà d'une fréquence \(f_{max}\), le signal est entièrement déterminé par ses échantillons pourvu que
    $$f_e > 2\,f_{max}$$
    La fréquence \(f_e/2\) est la <strong>fréquence de Nyquist</strong> : la plus haute fréquence qu'un échantillonnage à \(f_e\) représente sans ambiguïté.
  </div>

  <h3>Repliement de spectre</h3>
  <p>Pour tout entier \(n\), le produit \(n f_e \cdot kT_e = nk\) est entier, donc deux sinusoïdes dont les fréquences diffèrent d'un multiple de \(f_e\) prennent exactement les mêmes valeurs aux instants d'échantillonnage :</p>
  <div class="formula">$$\cos\big(2\pi f\,kT_e\big)=\cos\big(2\pi\,(f-n f_e)\,kT_e\big)\qquad n\in\mathbb{Z}$$</div>
  <div class="def-box">
    <strong>Repliement</strong> (<em>aliasing</em>). Une composante de fréquence \(f > f_e/2\) fournit les mêmes échantillons qu'une composante de <strong>fréquence apparente</strong>
    $$f_{app} = |f - n\,f_e|,\qquad n\in\mathbb{Z}\ \text{tel que}\ 0 \leq f_{app} \leq f_e/2$$
    Le calculateur « voit » une fréquence fausse, et aucun traitement numérique ultérieur ne peut la distinguer d'une composante réelle.
  </div>

  <h3>Filtre anti-repliement</h3>
  <div class="prop-box">
    On place <strong>avant l'échantillonneur</strong> un filtre passe-bas <strong>analogique</strong> qui atténue fortement tout ce qui dépasse \(f_e/2\) (bruit, parasites, harmoniques inutiles). Il ne peut pas être numérique : une fois le signal échantillonné, le mal est fait.
  </div>
  <div class="notice">
    <strong>Choix pratique de \(T_e\).</strong> Shannon n'est qu'une borne théorique (elle suppose une reconstruction idéale). En commande, on prend une marge : \(f_e\) de l'ordre de 10 à 30 fois la bande passante de la boucle, ou \(T_e\) voisin du dixième de la plus petite constante de temps à suivre. Mais un \(T_e\) minuscule a un coût : plus de calculs par seconde, plus de données, et une dérivation numérique plus bruitée (§7).
  </div>
  <div class="prop-box">
    <strong>Ordres de grandeur de \(f_e\).</strong>
    <ul style="margin:.4rem 0">
      <li>Audio (CD) : 44,1 kHz pour une oreille limitée à environ 20 kHz.</li>
      <li>Boucle de courant d'un variateur de moteur : 10 à 20 kHz.</li>
      <li>Boucle de vitesse ou de position d'un axe : 1 à 10 kHz.</li>
      <li>Régulation thermique d'un four ou d'un local : 0,1 à 10 Hz.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Une vibration à 70 Hz est échantillonnée à 100 Hz. Quelle fréquence le calculateur observe-t-il ?</span>
    <div class="content">
      <p>\(f_e/2 = 50\ \text{Hz} \lt 70\ \text{Hz}\) : il y a repliement. Le multiple de \(f_e\) le plus proche de 70 Hz est 100 Hz, d'où \(f_{app} = |70-100| = 30\ \text{Hz}\). Le calculateur croit voir une oscillation lente à 30 Hz. Il faudrait \(f_e > 140\ \text{Hz}\), et un filtre anti-repliement pour les composantes plus rapides.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · QUANTIFICATION</div>
  <h2>Coder sur N bits : quantum, résolution, erreur</h2>
  <div class="intro">Un CAN de \(N\) bits ne délivre que \(2^N\) codes entiers, de \(0\) à \(2^N-1\). Sa plage d'entrée est découpée en paliers de même hauteur : le quantum. Toute valeur comprise dans un palier reçoit le même code.</div>

  <div class="def-box">
    <strong>Quantum</strong> (pas de quantification). Pour une plage d'entrée (pleine échelle) \(\Delta s = s_{max} - s_{min}\) et un codage sur \(N\) bits :
    $$q = \frac{\Delta s}{2^N}$$
    C'est le poids du <strong>bit de poids faible</strong> (LSB, <em>least significant bit</em>) : le code augmente d'une unité quand le signal augmente de \(q\). Le bit de poids fort (MSB) pèse \(\Delta s/2\).
  </div>
  <p>Certaines documentations écrivent \(q = \Delta s/(2^N-1)\) (le code maximal correspond alors exactement à \(s_{max}\)) ; dès \(N \geq 8\), l'écart est négligeable.</p>

  <h3>Code et valeur reconstituée</h3>
  <div class="formula">$$n = \mathrm{E}\!\left(\frac{s-s_{min}}{q}\right)\qquad\qquad \tilde{s} = s_{min} + n\,q$$</div>
  <p>\(\mathrm{E}\) désigne la partie entière (conversion par troncature) ; certains convertisseurs arrondissent au code le plus proche.</p>
  <div class="prop-box">
    <strong>Erreur de quantification</strong> \(\varepsilon_q = s - \tilde{s}\) :
    <ul style="margin:.4rem 0">
      <li>par troncature : \(0 \leq \varepsilon_q \lt q\) ;</li>
      <li>par arrondi : \(|\varepsilon_q| \leq q/2\).</li>
    </ul>
    Dans les deux cas, l'erreur reste inférieure à un quantum (<strong>1 LSB</strong>) : aucune mesure numérisée n'est plus fine que \(q\).
  </div>

  <h3>Nombre de bits pour une résolution donnée</h3>
  <div class="prop-box">
    Pour garantir une résolution \(\delta\) (exprimée dans l'unité du signal converti) sur la plage \(\Delta s\) :
    $$q \leq \delta \iff 2^N \geq \frac{\Delta s}{\delta} \iff N \geq \log_2\frac{\Delta s}{\delta} = \frac{\ln(\Delta s/\delta)}{\ln 2}$$
    On prend l'entier immédiatement supérieur, puis le format standard (8, 10, 12, 16 bits). Repère utile : \(2^{10} = 1024 \approx 10^3\).
  </div>
  <div class="prop-box">
    <strong>Passer en unités physiques.</strong> Si l'ensemble capteur + conditionnement a une sensibilité \(K_c\) (en V par unité physique), la résolution sur la grandeur mesurée vaut \(q/K_c\). Si le signal n'occupe qu'une partie de la plage du CAN, des codes ne servent jamais : on règle le gain et le décalage du conditionnement pour que l'étendue utile du signal couvre toute la plage.
  </div>
  <div style="overflow-x:auto;margin:.6rem 0">
    <table style="width:100%;border-collapse:collapse;font-size:.85rem;text-align:center">
      <tr style="background:var(--paper-dark)">
        <th style="padding:.3rem;border:1px solid var(--grid)">\(N\)</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(2^N\)</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(q\) pour \(\Delta s = 5\ \text{V}\)</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(q\) pour \(\Delta s = 3{,}3\ \text{V}\)</th>
      </tr>

      <tr><td style="padding:.3rem;border:1px solid var(--grid)">10</td><td style="border:1px solid var(--grid)">1 024</td><td style="border:1px solid var(--grid)">4,88 mV</td><td style="border:1px solid var(--grid)">3,22 mV</td></tr>

    </table>
  </div>
  <div class="notice">
    <strong>Résolution n'est pas précision.</strong> La quantification n'est qu'une source d'erreur parmi d'autres (précision du capteur, bruit, dérives du conditionnement). Inutile de payer un CAN 16 bits si le capteur n'est fiable qu'à 1 % près.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Combien de bits pour mesurer une température de 0 à 150 °C au dixième de degré ?</span>
    <div class="content">
      <p>Il faut \(150/0{,}1 = 1500\) paliers au moins. \(2^{10} = 1024\) ne suffit pas, \(2^{11} = 2048\) convient : \(N = 11\) (un CAN 12 bits en pratique), à condition que l'intervalle 0–150 °C soit étalé sur toute la plage du convertisseur.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§4 · CONVERSION NUMÉRIQUE-ANALOGIQUE</div>
  <h2>CNA et bloqueur d'ordre 0</h2>
  <div class="intro">À chaque période, le calculateur produit un nombre \(u_k\). Le préactionneur, lui, attend un signal défini à chaque instant : il faut décider de ce que vaut la commande entre deux calculs.</div>

  <div class="def-box">
    Le <strong>CNA</strong> transforme un code entier \(n\) en tension \(u = n\,q\) (à un décalage près), avec la même définition du quantum que pour le CAN. Le <strong>bloqueur d'ordre 0</strong> maintient la dernière valeur calculée pendant toute la période :
    $$u(t) = u_k \qquad\text{pour}\qquad kT_e \leq t \lt (k+1)\,T_e$$
    La commande appliquée est un <strong>signal en escalier</strong>.
  </div>

  <h3>Modèle du bloqueur</h3>
  <div class="prop-box">
    La réponse du bloqueur à une impulsion d'aire unité est un créneau de hauteur 1 et de durée \(T_e\) : un échelon unité diminué du même échelon retardé de \(T_e\). Avec le théorème du retard :
    $$B_0(p) = \frac{1 - e^{-T_e p}}{p}$$
  </div>

  <h3>Effet : un retard d'environ \(T_e/2\)</h3>
  <div class="prop-box">
    En factorisant \(e^{-T_e p/2}\) :
    $$\frac{B_0(p)}{T_e} = e^{-T_e p/2}\,\frac{\sinh(T_e p/2)}{T_e p/2} \approx e^{-T_e p/2}\quad\text{quand}\ \omega T_e \ll 1$$
    Le couple échantillonneur-bloqueur conserve donc la valeur moyenne (gain statique 1) et se comporte, aux basses fréquences, comme un <strong>retard pur de \(T_e/2\)</strong>, qui déphase de
    $$\Delta\varphi(\omega) \approx -\,\omega\,\frac{T_e}{2}\quad\text{(rad)}$$
    Dans une boucle, la marge de phase diminue d'environ \(\omega_{c0}T_e/2\). S'y ajoute le temps de calcul (souvent une période entière si la commande calculée à l'instant \(k\) n'est appliquée qu'à l'instant \(k+1\)).
  </div>
  <div class="notice">
    <strong>Conséquence pour le choix de \(T_e\).</strong> Pour perdre moins de 5° (0,087 rad) de marge de phase à cause du bloqueur, il faut \(\omega_{c0}T_e/2 \leq 0{,}087\), soit \(T_e \leq 0{,}17/\omega_{c0}\) : une fréquence d'échantillonnage d'environ 35 fois la fréquence de coupure \(\omega_{c0}/2\pi\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Une boucle de vitesse a, en continu, \(\omega_{c0} = 200\ \text{rad/s}\) et \(M_\varphi = 50°\). Que reste-t-il avec \(T_e = 2\ \text{ms}\) ?</span>
    <div class="content">
      <p>Perte due au bloqueur : \(\omega_{c0}T_e/2 = 0{,}2\ \text{rad} \approx 11{,}5°\), d'où \(M_\varphi \approx 38{,}5°\). Si de plus la commande n'est appliquée qu'à la période suivante (retard de calcul \(T_e\)), on perd encore \(0{,}4\ \text{rad} \approx 23°\) : \(M_\varphi \approx 16°\), comportement très oscillant. Il faut réduire \(T_e\).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FILTRAGE NUMÉRIQUE</div>
  <h2>Filtrer par le calcul : relations de récurrence</h2>
  <div class="intro">Un filtre numérique est un algorithme : à chaque période, il calcule un échantillon de sortie \(v_k\) à partir de l'entrée courante \(u_k\), des entrées précédentes et, éventuellement, des sorties déjà calculées. Ses coefficients se règlent par logiciel et ne dérivent pas.</div>

  <div class="def-box">
    <strong>Forme générale</strong> d'un filtre numérique linéaire causal :
    $$v_k = \sum_{i=0}^{n} a_i\,u_{k-i} \;-\; \sum_{i=1}^{m} b_i\,v_{k-i}$$
    Les coefficients \(a_i\) et \(b_i\) sont des constantes (qui dépendent en général de \(T_e\)). <strong>Causal</strong> : seules les valeurs présentes et passées interviennent, ce qui autorise le calcul en temps réel. Le programme mémorise \(n\) entrées et \(m\) sorties passées.
  </div>

  <h3>Non récursif ou récursif</h3>
  <div class="prop-box">
    <ul style="margin:.2rem 0">
      <li><strong>Filtre non récursif</strong> (tous les \(b_i\) nuls) : la sortie ne dépend que des entrées. Sa réponse impulsionnelle (sortie pour \(u_0 = 1\), puis \(u_k = 0\)) est la suite \(a_0, a_1, \dots, a_n\) suivie de zéros : elle est <strong>finie</strong>, d'où le nom de filtre <strong>RIF</strong>. Un RIF est <strong>toujours stable</strong> : \(|v_k| \leq \big(\sum|a_i|\big)\max|u|\).</li>
      <li><strong>Filtre récursif</strong> (un \(b_i\) au moins non nul) : la sortie est réinjectée dans le calcul ; la réponse impulsionnelle est en général infinie (filtre RII) et la <strong>stabilité doit être vérifiée</strong>.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Gain statique.</strong> Si \(u_k = U\) pour tout \(k\) et si la sortie converge vers \(V\), on remplace tous les \(u_{k-i}\) par \(U\) et tous les \(v_{k-i}\) par \(V\) :
    $$V = \frac{\sum_i a_i}{1 + \sum_i b_i}\;U$$
  </div>
  <div class="prop-box">
    <strong>Stabilité du premier ordre récursif.</strong> Pour \(v_k = \alpha\,v_{k-1} + \beta\,u_k\), la réponse libre est la suite géométrique \(v_k = \alpha^k v_0\) : le filtre est stable si et seulement si \(|\alpha| \lt 1\). Si \(-1 \lt \alpha \lt 0\), la sortie converge en changeant de signe à chaque pas (oscillation à \(f_e/2\)).
  </div>

  <h3>Moyenne glissante</h3>
  <div class="def-box">
    La <strong>moyenne glissante</strong> sur \(N\) échantillons est la moyenne arithmétique des \(N\) dernières entrées :
    $$v_k = \frac{1}{N}\sum_{i=0}^{N-1} u_{k-i}\qquad (k \geq N-1)$$
    C'est un RIF dont les \(N\) coefficients valent \(1/N\) ; son gain statique vaut 1. Écriture équivalente, bien moins coûteuse quand \(N\) est grand (trois opérations par pas au lieu d'environ \(N\), mais \(N\) entrées toujours mémorisées) :
    $$v_k = v_{k-1} + \frac{u_k - u_{k-N}}{N}$$
  </div>
  <div class="prop-box">
    <ul style="margin:.2rem 0">
      <li>Elle <strong>lisse le bruit</strong> : la moyenne de \(N\) erreurs aléatoires indépendantes a un écart-type divisé par \(\sqrt{N}\).</li>
      <li>Elle <strong>annule exactement</strong> toute composante sinusoïdale de période \(NT_e\), ainsi que ses harmoniques de rang non multiple de \(N\), car une sinusoïde a une moyenne nulle sur un nombre entier de périodes : moyenner sur 20 ms supprime un parasite secteur à 50 Hz.</li>
      <li>Elle introduit un <strong>retard moyen</strong> de \((N-1)T_e/2\) et met \(N-1\) périodes à répondre complètement à un échelon : lissage fort et rapidité sont contradictoires.</li>
      <li>Sur un petit microcontrôleur, on choisit volontiers \(N = 4, 8, 16\ldots\) : diviser par \(2^p\) revient à décaler le nombre binaire de \(p\) rangs.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Des mesures bruitées valent 10, 12, 8, 11, 13, 9. Moyenne glissante sur 3 échantillons ?</span>
    <div class="content">
      <p>Dès \(k = 2\) : \(v_2 = (10+12+8)/3 = 10\) ; \(v_3 = (12+8+11)/3 \approx 10{,}33\) ; \(v_4 = (8+11+13)/3 \approx 10{,}67\) ; \(v_5 = (11+13+9)/3 = 11\). Les mesures brutes s'étalent sur 5 unités, la sortie filtrée sur 1 seulement.</p>
    </div>
  </div>

  <h3>Traiter un fichier de mesures : moyenne, écart type, moyenne glissante</h3>
  <p>Hors temps réel, les échantillons enregistrés pendant un essai (banc d'essai, carte d'acquisition, oscilloscope) sont exportés dans un fichier texte : une ligne par instant, des colonnes séparées par un point-virgule ou une virgule (format CSV), souvent une ligne d'en-tête. On les traite alors d'un bloc, sur tout le tableau, avec la bibliothèque numpy.</p>
  <div class="def-box">
    <strong>Moyenne et écart type.</strong> Pour \(N\) valeurs \(x_1, \dots, x_N\) d'une même grandeur, mesurée plusieurs fois dans les mêmes conditions :
    <div class="formula" data-nom="Moyenne d'une série de mesures">$$\bar x = \frac{1}{N}\sum_{i=1}^{N} x_i$$</div>
    <div class="formula" data-nom="Écart type d'une série de mesures">$$s = \sqrt{\frac{1}{N-1}\sum_{i=1}^{N}\left(x_i-\bar x\right)^2}$$</div>
    La moyenne estime la valeur de la grandeur ; l'écart type mesure la dispersion des valeurs autour d'elle (la fidélité de la mesure), dans l'unité de la grandeur. Le diviseur \(N-1\) corrige le fait que \(\bar x\) est elle-même calculée à partir des données ; l'écart avec un diviseur \(N\) devient négligeable dès quelques dizaines de valeurs.
  </div>
  <div class="prop-box">
    <strong>Écart type de la moyenne.</strong> Si les \(N\) mesures sont indépendantes, leur moyenne fluctue beaucoup moins qu'une mesure isolée :
    <div class="formula" data-nom="Écart type de la moyenne">$$s_{\bar x} = \frac{s}{\sqrt N}$$</div>
    C'est l'incertitude-type associée au résultat \(\bar x\). La même propriété explique le lissage du bruit par la moyenne glissante.
  </div>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
d = np.loadtxt('essai.csv', delimiter=';', skiprows=1)  <span class="cmt"># en-tête sauté</span>
t, F = d[:, 0], d[:, 1]          <span class="cmt"># colonnes : temps (s), effort (N)</span>
m = np.mean(F)                   <span class="cmt"># moyenne</span>
s = np.std(F, ddof=1)            <span class="cmt"># écart type (diviseur N-1)</span>
N = 20                           <span class="cmt"># largeur de la fenêtre</span>
Fg = np.convolve(F, np.ones(N)/N, mode='valid')  <span class="cmt"># N-1 valeurs de moins</span>
tg = t[N-1:]                     <span class="cmt"># date du dernier échantillon de chaque fenêtre</span>
plt.plot(t, F, label='mesure brute')
plt.plot(tg, Fg, label='moyenne glissante')
plt.xlabel('t (s)'); plt.ylabel('F (N)'); plt.legend(); plt.show()</pre>
  <div class="notice"><strong>Pièges.</strong> <code>np.std</code> divise par \(N\) par défaut : préciser <code>ddof=1</code> pour l'estimateur à \(N-1\). La moyenne glissante vectorisée par <code>np.convolve(…, mode='valid')</code> compte \(N-1\) valeurs de moins que le signal : la dater par le dernier échantillon de chaque fenêtre reproduit le calcul en temps réel, avec son retard de \((N-1)T_e/2\) ; la dater par le milieu de la fenêtre supprime ce retard, ce qui n'est possible qu'hors temps réel. Enfin, moyenne et écart type ne décrivent un régime que s'il est établi : on écarte d'abord le transitoire (tranche <code>F[k0:]</code>).</div>
  <div class="method-box">
    <strong>Exemple — effort d'un vérin mesuré huit fois</strong>
    <p>Un capteur d'effort donne, pour huit sorties de tige dans les mêmes conditions : 251, 248, 253, 250, 247, 252, 249 et 254 N.</p>
    <ol>
      <li>Moyenne : \(\bar F = 2004/8 = 250{,}5\ \text{N}\).</li>
      <li>Écarts à la moyenne : 0,5 ; −2,5 ; 2,5 ; −0,5 ; −3,5 ; 1,5 ; −1,5 ; 3,5. Somme de leurs carrés : 42, d'où \(s = \sqrt{42/7} = \sqrt 6 \approx 2{,}45\ \text{N}\) (avec le diviseur 8, on trouverait 2,29 N).</li>
      <li>Écart type de la moyenne : \(2{,}45/\sqrt 8 \approx 0{,}87\ \text{N}\). On retient \(\bar F = 250{,}5\ \text{N}\) avec une incertitude-type d'environ 0,9 N, alors qu'une mesure isolée se disperse d'environ 2,5 N.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DISCRÉTISATION</div>
  <h2>D'une équation différentielle à une récurrence</h2>
  <div class="intro">Le comportement voulu pour un filtre ou un correcteur est souvent donné en continu (fonction de transfert, équation différentielle). Pour le programmer, on remplace chaque dérivée par un taux d'accroissement calculé entre échantillons successifs.</div>

  <h3>Approximations des dérivées</h3>
  <div class="def-box">
    <strong>Différence arrière</strong> (valeur présente et précédente : causale, utilisable en temps réel) :
    $$\left.\frac{\mathrm{d}s}{\mathrm{d}t}\right|_{t=kT_e} \approx \frac{s_k - s_{k-1}}{T_e}$$
    <strong>Différence avant</strong> (valeur présente et suivante) :
    $$\left.\frac{\mathrm{d}s}{\mathrm{d}t}\right|_{t=kT_e} \approx \frac{s_{k+1} - s_k}{T_e}$$
    <strong>Dérivée seconde</strong> (différence arrière appliquée deux fois) :
    $$\left.\frac{\mathrm{d}^2 s}{\mathrm{d}t^2}\right|_{t=kT_e} \approx \frac{s_k - 2\,s_{k-1} + s_{k-2}}{T_e^2}$$
  </div>
  <p>Si le point de départ est une fonction de transfert, on revient d'abord à l'équation différentielle (conditions initiales nulles : multiplier par \(p\) revient à dériver), puis on discrétise.</p>

  <h3>Exemple fondamental : le passe-bas du premier ordre</h3>
  <div class="formula">$$\tau\,\frac{\mathrm{d}v}{\mathrm{d}t} + v(t) = K\,u(t)\qquad\Longleftrightarrow\qquad H(p)=\frac{K}{1+\tau p}$$</div>
  <div class="prop-box">
    <strong>Par différence arrière</strong> : \(\tau\,(v_k - v_{k-1})/T_e + v_k = K u_k\), d'où
    $$v_k = a\,v_{k-1} + K(1-a)\,u_k\qquad\text{avec}\qquad a = \frac{\tau}{\tau+T_e}$$
    Comme \(0 \lt a \lt 1\) pour tout \(T_e > 0\), ce schéma est <strong>stable quel que soit \(T_e\)</strong>, et son gain statique vaut bien \(K\).
  </div>
  <div class="prop-box">
    <strong>Par différence avant</strong> : \(\tau\,(v_{k+1} - v_k)/T_e + v_k = K u_k\), d'où
    $$v_{k+1} = \left(1-\frac{T_e}{\tau}\right)v_k + K\,\frac{T_e}{\tau}\,u_k$$
    Stable si et seulement si \(|1 - T_e/\tau| \lt 1\), c'est-à-dire \(T_e \lt 2\tau\) ; sans oscillation si \(T_e \leq \tau\). Avec un \(T_e\) trop grand, le calcul <strong>diverge</strong> alors que le filtre continu est stable.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour aller plus loin</span>
    <span class="prompt">Que donnerait une intégration exacte sur une période ?</span>
    <div class="content">
      <p>Si l'entrée est constante sur chaque période (bloqueur), l'équation s'intègre exactement de \(kT_e\) à \((k+1)T_e\) :</p>
      $$v_{k+1} = e^{-T_e/\tau}\,v_k + K\left(1 - e^{-T_e/\tau}\right)u_k$$
      <p>Pour \(T_e \ll \tau\), \(e^{-T_e/\tau} \approx 1 - T_e/\tau \approx \tau/(\tau+T_e)\) : les deux schémas approchés rejoignent la solution exacte au premier ordre en \(T_e/\tau\). Ils s'en écartent dès que \(T_e\) n'est plus petit devant \(\tau\).</p>
    </div>
  </div>
  <div class="notice">
    <strong>Choisir \(T_e\).</strong> Règle pratique : \(T_e \leq \tau/10\) pour que le filtre numérique reproduise fidèlement le filtre continu. La fréquence de coupure \(f_c = 1/(2\pi\tau)\) doit par ailleurs rester très inférieure à \(f_e/2\).
  </div>

  <h3>Passe-bas du second ordre</h3>
  <p>Quand un premier ordre ne filtre pas assez, on passe au second ordre : au-delà de sa pulsation propre, son gain décroît de 40 dB par décade au lieu de 20, ce qui atténue bien davantage les composantes rapides du bruit.</p>
  <div class="formula">$$\frac{1}{\omega_0^2}\,\frac{\mathrm{d}^2v}{\mathrm{d}t^2} + \frac{2\xi}{\omega_0}\,\frac{\mathrm{d}v}{\mathrm{d}t} + v(t) = K\,u(t)$$
$$H(p) = \frac{K}{1+\dfrac{2\xi}{\omega_0}\,p+\dfrac{p^2}{\omega_0^2}}$$</div>
  <div class="prop-box">
    <strong>Par différences arrière</strong> (dérivées première et seconde ci-dessus), en multipliant par \(\omega_0^2T_e^2\) et en posant \(x = \omega_0 T_e\) :
    <div class="formula">$$\begin{aligned} &x^2\,v_k + 2\xi x\,(v_k - v_{k-1}) \\ &\quad + (v_k - 2v_{k-1} + v_{k-2}) = K x^2\,u_k \end{aligned}$$</div>
    <div class="formula" data-nom="Passe-bas numérique du second ordre">$$v_k = \frac{(2+2\xi x)\,v_{k-1} - v_{k-2} + K x^2\,u_k}{D}$$
$$D = 1+2\xi x+x^2$$</div>
    <ul style="margin:.3rem 0">
      <li>Récurrence d'ordre 2 : le programme mémorise les deux dernières sorties.</li>
      <li><strong>Gain statique</strong> : avec \(u_k = U\) et \(v_k \to V\), les termes en \(\xi x\) se compensent et il reste \(x^2\,V = Kx^2\,U\), soit \(V = K\,U\).</li>
      <li>Comme au premier ordre, le schéma arrière reste stable quel que soit \(T_e\), mais il n'est <strong>fidèle</strong> que si \(\omega_0 T_e \ll 1\) (en pratique \(\omega_0 T_e \leq 0{,}1\)). Pour \(\omega_0 = 62{,}8\ \text{rad/s}\) (10 Hz) et \(\xi = 0{,}7\) : avec \(T_e = 1\ \text{ms}\), le filtre calculé se comporte comme un 2ᵉ ordre de pulsation propre 61,5 rad/s et d'amortissement 0,72 ; avec \(T_e = 10\ \text{ms}\), comme un 2ᵉ ordre de 51 rad/s et d'amortissement 0,81, nettement plus lent et plus amorti.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme</span>
    <span class="prompt">Appliquer le filtre à un tableau de mesures (hors temps réel).</span>
    <div class="content">
  <pre class="codeblock"><span class="kw">def</span> passe_bas2(u, Te, w0, xi, K=1.0):
    x = w0*Te
    D = 1 + 2*xi*x + x**2
    v = np.zeros(len(u))
    v[0] = v[1] = K*u[0]          <span class="cmt"># départ à l'équilibre</span>
    <span class="kw">for</span> k <span class="kw">in</span> range(2, len(u)):  <span class="cmt"># récursif : une boucle</span>
        v[k] = ((2 + 2*xi*x)*v[k-1] - v[k-2] + K*x**2*u[k])/D
    <span class="kw">return</span> v</pre>
      <p>Contrairement à la moyenne glissante, un filtre récursif ne se vectorise pas par une simple convolution : chaque sortie dépend des précédentes.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — lisser une mesure de vitesse : moyenne glissante ou second ordre ?</strong>
    <p>Une mesure de vitesse, échantillonnée à 1 kHz, porte un bruit d'écart type 0,1 (en unités de la consigne). On compare une moyenne glissante sur \(N = 40\) échantillons (fenêtre de 40 ms) et un passe-bas du second ordre de fréquence propre 10 Hz, \(\xi = 0{,}7\) (valeurs obtenues par simulation).</p>
    <ol>
      <li><strong>Lissage</strong> : écart type du bruit en sortie 0,016 pour la moyenne glissante, 0,015 pour le second ordre. Les deux réglages lissent autant.</li>
      <li><strong>Rapidité</strong> : après un échelon unité, la moyenne glissante atteint 95 % en 37 ms, sans dépasser ; le second ordre en 47 ms, avec un dépassement de 4 %.</li>
      <li><strong>Parasite secteur à 50 Hz</strong> : annulé exactement par la moyenne glissante (sa fenêtre dure deux périodes) ; réduit à 4 % de son amplitude par le second ordre.</li>
      <li><strong>Composantes rapides</strong> : entre les fréquences qu'elle annule, la moyenne glissante laisse passer davantage : à 37,5 Hz, 21 % de l'amplitude contre 7 % ; à 87,5 Hz, 9 % contre 1,3 %.</li>
    </ol>
    <p>Conclusion : la moyenne glissante est imbattable contre un parasite de fréquence connue et ne dépasse jamais ; le second ordre filtre mieux un bruit étalé vers les hautes fréquences et ne mémorise que deux valeurs au lieu de \(N\).</p>
  </div>
