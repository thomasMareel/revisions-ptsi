<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Cauchy-Schwarz et moyennes</h3>
  <div class="statement">Dans \(\mathbb{R}^n\) muni du produit scalaire canonique, on considère \(a = (a_1, \ldots, a_n)\).</div>
  <div class="q"><strong>Q1.</strong> Écrire l'inégalité de Cauchy-Schwarz pour \(x = (1, \ldots, 1)\) et \(y = a\).</div>
  <div class="q"><strong>Q2.</strong> En déduire une comparaison entre le carré de la moyenne des \(a_i\) et la moyenne des \(a_i^2\). Quand y a-t-il égalité ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\langle x, a\rangle = \sum a_i\), \(\|x\| = \sqrt n\) et \(\|a\| = \sqrt{\sum a_i^2}\), donc \(\big|\sum_{i=1}^n a_i\big| \leq \sqrt n\,\sqrt{\sum_{i=1}^n a_i^2}\).</p>
    <p><strong>Q2.</strong> On élève au carré et on divise par \(n^2\) :</p>
    <div class="formula">$$\Big(\frac1n\sum_{i=1}^n a_i\Big)^2 \leq \frac1n\sum_{i=1}^n a_i^2 :$$</div>
    <p>le carré de la moyenne est inférieur à la moyenne des carrés. Il y a égalité si et seulement si \(a\) est colinéaire à \((1, \ldots, 1)\), c'est-à-dire si tous les \(a_i\) sont égaux. En statistique, la différence des deux membres est la variance de la série \((a_i)\), qui est donc positive, et nulle seulement pour une série constante.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Distance à une droite</h3>
  <div class="statement">Dans \(\mathbb{R}^3\) muni du produit scalaire canonique, soit \(D = \operatorname{Vect}(e)\) avec \(e = (1, 1, 1)\), et \(x = (1, 0, 0)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le projeté orthogonal de \(x\) sur \(D\).</div>
  <div class="q"><strong>Q2.</strong> En déduire la distance \(d(x, D)\), puis la retrouver par le théorème de Pythagore.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le vecteur \(u = \frac{1}{\sqrt3}(1, 1, 1)\) est une base orthonormée de \(D\), et \(\langle x, u\rangle = \frac{1}{\sqrt3}\). Donc \(p_D(x) = \langle x, u\rangle u = \frac13(1, 1, 1)\). On peut aussi utiliser directement \(p_D(x) = \frac{\langle x, e\rangle}{\|e\|^2}\,e\), avec \(\langle x, e\rangle = 1\) et \(\|e\|^2 = 3\).</p>
    <p><strong>Q2.</strong> \(x - p_D(x) = \big(\frac23, -\frac13, -\frac13\big)\), orthogonal à \(e\) (somme des coordonnées nulle), donc</p>
    <div class="formula">$$d(x, D) = \sqrt{\tfrac49 + \tfrac19 + \tfrac19} = \sqrt{\tfrac23} .$$</div>
    <p>Par Pythagore, \(d(x, D)^2 = \|x\|^2 - \|p_D(x)\|^2 = 1 - \frac13 = \frac23\) : même résultat.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Un produit scalaire défini par des valeurs</h3>
  <div class="statement">Sur \(E = \mathbb{R}_2[X]\), on pose \(\langle P, Q\rangle = P(-1)Q(-1) + P(0)Q(0) + P(1)Q(1)\). On considère aussi les polynômes
  <div class="formula">$$L_{-1} = \tfrac12X(X - 1), \qquad L_0 = 1 - X^2, \qquad L_1 = \tfrac12X(X + 1).$$</div></div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\langle \cdot, \cdot\rangle\) est un produit scalaire sur \(E\).</div>
  <div class="q"><strong>Q2.</strong> Calculer les \(\langle L_i, L_j\rangle\) pour \(i, j \in \{-1, 0, 1\}\). Que peut-on en conclure ?</div>
  <div class="q"><strong>Q3.</strong> Donner les coordonnées de \(P = 2X^2 - X + 3\) dans la base \((L_{-1}, L_0, L_1)\), puis \(\|P\|\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer le polynôme de \(\mathbb{R}_1[X]\) le plus proche de \(X^2\) pour ce produit scalaire, et la distance \(d\big(X^2, \mathbb{R}_1[X]\big)\). Interpréter le résultat comme un ajustement par moindres carrés.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'application est symétrique ; à \(P\) fixé, \(Q \mapsto Q(a)\) est linéaire pour chaque réel \(a\), donc elle est linéaire en \(Q\), et bilinéaire par symétrie. Elle est positive : \(\langle P, P\rangle = P(-1)^2 + P(0)^2 + P(1)^2 \geq 0\). Enfin, si \(\langle P, P\rangle = 0\), les trois carrés sont nuls : \(P\), de degré au plus 2, a trois racines distinctes \(-1\), 0 et 1, donc \(P = 0\).</p>
    <p><strong>Q2.</strong> Chaque \(L_i\) vaut 1 en \(i\) et 0 aux deux autres points : par exemple \(L_0(-1) = L_0(1) = 0\) et \(L_0(0) = 1\). Donc \(\langle L_i, L_j\rangle = \sum_{k \in \{-1, 0, 1\}} L_i(k)L_j(k)\) vaut 1 si \(i = j\) et 0 sinon. La famille \((L_{-1}, L_0, L_1)\) est orthonormée, donc libre ; elle a trois vecteurs dans un espace de dimension 3 : c'est une <strong>base orthonormée</strong> de \(E\).</p>
    <p><strong>Q3.</strong> En base orthonormée, les coordonnées sont des produits scalaires : \(\langle P, L_i\rangle = P(i)\) (même calcul qu'en Q2). Ici \(P(-1) = 6\), \(P(0) = 3\), \(P(1) = 4\), donc \(P = 6L_{-1} + 3L_0 + 4L_1\) : c'est la formule d'interpolation de Lagrange. Puis \(\|P\|^2 = 36 + 9 + 16 = 61\), soit \(\|P\| = \sqrt{61}\) ; on retrouve bien \(P(-1)^2 + P(0)^2 + P(1)^2\).</p>
    <p><strong>Q4.</strong> On cherche \(p\big(X^2\big)\), projeté orthogonal sur \(F = \mathbb{R}_1[X] = \operatorname{Vect}(1, X)\). Or \(\langle 1, X\rangle = -1 + 0 + 1 = 0\) : la base \((1, X)\) est orthogonale, avec \(\|1\|^2 = 3\) et \(\|X\|^2 = 2\). Comme \(\langle X^2, 1\rangle = 2\) et \(\langle X^2, X\rangle = -1 + 0 + 1 = 0\),</p>
    <div class="formula">$$p\big(X^2\big) = \frac{\langle X^2, 1\rangle}{\|1\|^2}\,1 + \frac{\langle X^2, X\rangle}{\|X\|^2}\,X = \frac23 .$$</div>
    <p>Le polynôme de \(\mathbb{R}_1[X]\) le plus proche de \(X^2\) est la constante \(\frac23\), et</p>
    <div class="formula">$$d\big(X^2, \mathbb{R}_1[X]\big)^2 = \Big\|X^2 - \frac23\Big\|^2 = \frac19 + \frac49 + \frac19 = \frac23 ,$$</div>
    <p>soit une distance \(\frac{\sqrt6}{3}\) (les valeurs de \(X^2 - \frac23\) en \(-1\), 0, 1 sont \(\frac13\), \(-\frac23\), \(\frac13\)).</p>
    <p><strong>Interprétation.</strong> Pour \(R = aX + b\), \(\|X^2 - R\|^2 = \sum_{k \in \{-1, 0, 1\}}\big(k^2 - ak - b\big)^2\) est la somme des carrés des écarts verticaux entre la droite \(y = ax + b\) et les points \((-1, 1)\), \((0, 0)\), \((1, 1)\) de la parabole \(y = x^2\) : la droite des moindres carrés de ces trois points est \(y = \frac23\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Projeter sur un sous-espace défini par des équations</h3>
  <div class="statement">Dans \(\mathbb{R}^4\) muni du produit scalaire canonique, soit
  <div class="formula">$$F = \{x \in \mathbb{R}^4 \mid x_1 + x_2 + x_3 + x_4 = 0 \text{ et } x_1 - x_4 = 0\}.$$</div>
  On note \(a = (1, 1, 1, 1)\), \(b = (1, 0, 0, -1)\) et \(x = (3, 0, 0, 1)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(F^\perp = \operatorname{Vect}(a, b)\). Quelles sont les dimensions de \(F\) et de \(F^\perp\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(p_{F^\perp}(x)\), puis \(p_F(x)\) et \(d(x, F)\).</div>
  <div class="q"><strong>Q3.</strong> Écrire la matrice de \(p_F\) dans la base canonique et vérifier deux de ses propriétés caractéristiques.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les deux équations s'écrivent \(\langle x, a\rangle = 0\) et \(\langle x, b\rangle = 0\) : \(F = \operatorname{Vect}(a, b)^\perp\). En dimension finie, \((G^\perp)^\perp = G\) pour tout sous-espace \(G\), donc \(F^\perp = \operatorname{Vect}(a, b)\). Les vecteurs \(a\) et \(b\) ne sont pas colinéaires : \(\dim F^\perp = 2\) et \(\dim F = 4 - 2 = 2\). On remarque de plus que \(\langle a, b\rangle = 1 - 1 = 0\).</p>
    <p><strong>Q2.</strong> La base \((a, b)\) de \(F^\perp\) est orthogonale, avec \(\|a\|^2 = 4\) et \(\|b\|^2 = 2\) ; \(\langle x, a\rangle = 4\) et \(\langle x, b\rangle = 2\). Donc</p>
    <div class="formula">$$\begin{aligned} p_{F^\perp}(x) &= \frac44\,a + \frac22\,b = (2, 1, 1, 0), \\ p_F(x) &= x - p_{F^\perp}(x) = (1, -1, -1, 1). \end{aligned}$$</div>
    <p>Contrôle : \(1 - 1 - 1 + 1 = 0\) et \(x_1 - x_4 = 1 - 1 = 0\), donc \(p_F(x) \in F\). La distance vaut \(d(x, F) = \|x - p_F(x)\| = \|(2, 1, 1, 0)\| = \sqrt6\).</p>
    <p><strong>Q3.</strong> Avec les colonnes \(A\) et \(B\) des coordonnées de \(a\) et \(b\), \(p_{F^\perp}\) a pour matrice \(\frac14AA^\top + \frac12BB^\top\), donc \(p_F = \mathrm{id} - p_{F^\perp}\) a pour matrice</p>
    <div class="formula">$$\begin{aligned} M &= I_4 - \tfrac14AA^\top - \tfrac12BB^\top \\ &= \frac14\begin{pmatrix} 1 & -1 & -1 & 1 \\ -1 & 3 & -1 & -1 \\ -1 & -1 & 3 & -1 \\ 1 & -1 & -1 & 1\end{pmatrix}. \end{aligned}$$</div>
    <p>Elle est symétrique, et sa trace vaut \(\frac{1 + 3 + 3 + 1}{4} = 2 = \dim F\), comme pour tout projecteur (trace = rang). On vérifie aussi \(MX = (1, -1, -1, 1)\) pour la colonne \(X\) de \(x\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Matrices symétriques et antisymétriques</h3>
  <div class="statement">Sur \(E = \mathcal{M}_n(\mathbb{R})\), on pose \(\langle A, B\rangle = \operatorname{tr}(A^\top B)\). On note \(\mathcal{S}_n(\mathbb{R})\) et \(\mathcal{A}_n(\mathbb{R})\) les sous-espaces des matrices symétriques et antisymétriques.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\langle A, B\rangle = \sum_{i,j} a_{ij}b_{ij}\) et en déduire que c'est un produit scalaire.</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\mathcal{S}_n(\mathbb{R})\) et \(\mathcal{A}_n(\mathbb{R})\) sont orthogonaux, puis que \(\mathcal{A}_n(\mathbb{R}) = \mathcal{S}_n(\mathbb{R})^\perp\). Quel est le projeté orthogonal d'une matrice \(M\) sur \(\mathcal{S}_n(\mathbb{R})\) ?</div>
  <div class="q"><strong>Q3.</strong> Pour \(M = \begin{pmatrix} 1 & 2 \\ 0 & 3\end{pmatrix}\), calculer la distance de \(M\) à \(\mathcal{S}_2(\mathbb{R})\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que \((\operatorname{tr} A)^2 \leq n\operatorname{tr}(A^\top A)\) pour toute \(A \in \mathcal{M}_n(\mathbb{R})\), et étudier le cas d'égalité.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le coefficient diagonal \((j, j)\) de \(A^\top B\) vaut \(\sum_i a_{ij}b_{ij}\) ; en sommant sur \(j\), \(\operatorname{tr}(A^\top B) = \sum_{i,j}a_{ij}b_{ij}\). C'est le produit scalaire canonique de \(\mathbb{R}^{n^2}\) appliqué aux listes des coefficients : il est bilinéaire, symétrique, et \(\langle A, A\rangle = \sum a_{ij}^2\) n'est nul que si tous les coefficients le sont.</p>
    <p><strong>Q2.</strong> Si \(S\) est symétrique et \(T\) antisymétrique, \(\langle S, T\rangle = \operatorname{tr}(ST)\). Une matrice et sa transposée ont la même trace, et \(\operatorname{tr}(UV) = \operatorname{tr}(VU)\), donc</p>
    <div class="formula">$$\begin{aligned} \operatorname{tr}(ST) &= \operatorname{tr}\big((ST)^\top\big) = \operatorname{tr}(T^\top S^\top) \\ &= -\operatorname{tr}(TS) = -\operatorname{tr}(ST), \end{aligned}$$</div>
    <p>d'où \(\langle S, T\rangle = 0\) : \(\mathcal{A}_n(\mathbb{R}) \subset \mathcal{S}_n(\mathbb{R})^\perp\). Toute matrice s'écrit \(M = \frac{M + M^\top}{2} + \frac{M - M^\top}{2}\), somme d'une symétrique et d'une antisymétrique : \(\dim \mathcal{S}_n + \dim \mathcal{A}_n \geq n^2\), et comme la somme est directe (sous-espaces orthogonaux), \(\dim \mathcal{A}_n = n^2 - \dim \mathcal{S}_n = \dim \mathcal{S}_n^\perp\). L'inclusion est donc une égalité. La décomposition précédente est celle de \(M\) selon \(\mathcal{S}_n \oplus \mathcal{S}_n^\perp\) : le projeté orthogonal de \(M\) sur \(\mathcal{S}_n(\mathbb{R})\) est \(\frac{M + M^\top}{2}\).</p>
    <p><strong>Q3.</strong> Projeté : \(\frac{M + M^\top}{2} = \begin{pmatrix} 1 & 1 \\ 1 & 3\end{pmatrix}\) ; le reste est \(\frac{M - M^\top}{2} = \begin{pmatrix} 0 & 1 \\ -1 & 0\end{pmatrix}\), de norme \(\sqrt{0 + 1 + 1 + 0} = \sqrt2\). Donc \(d\big(M, \mathcal{S}_2(\mathbb{R})\big) = \sqrt2\).</p>
    <p><strong>Q4.</strong> Avec \(B = I_n\) : \(\langle A, I_n\rangle = \operatorname{tr} A\) et \(\|I_n\|^2 = \operatorname{tr}(I_n) = n\). Cauchy-Schwarz donne \((\operatorname{tr} A)^2 \leq \|A\|^2\,\|I_n\|^2 = n\operatorname{tr}(A^\top A)\), avec égalité si et seulement si \(A\) est colinéaire à \(I_n\), c'est-à-dire \(A = \lambda I_n\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Moindres carrés pour un système sans solution</h3>
  <div class="statement">On considère le système de trois équations à deux inconnues réelles \(x\), \(y\) :
  <div class="formula">$$\begin{cases} x + y = 0 \\ x - y = 1 \\ x + 2y = 3 \end{cases}$$</div>
  Il s'écrit \(AX = B\) avec
  <div class="formula">$$A = \begin{pmatrix} 1 & 1 \\ 1 & -1 \\ 1 & 2\end{pmatrix}, \quad X = \begin{pmatrix} x \\ y\end{pmatrix}, \quad B = \begin{pmatrix} 0 \\ 1 \\ 3\end{pmatrix},$$</div>
  et \(\mathbb{R}^3\) est muni du produit scalaire canonique.</div>
  <div class="q"><strong>Q1.</strong> Montrer que le système n'a pas de solution.</div>
  <div class="q"><strong>Q2.</strong> On cherche \(X\) qui rend minimale la somme des carrés des écarts \(\|AX - B\|^2\). Interpréter ce problème comme une projection orthogonale et montrer qu'il équivaut à \(A^\top A\,X = A^\top B\).</div>
  <div class="q"><strong>Q3.</strong> Résoudre ce système et calculer la valeur minimale de \(\|AX - B\|^2\).</div>
  <div class="q"><strong>Q4.</strong> Contrôler le résultat à l'aide d'un vecteur normal au plan \(\operatorname{Im} A\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les deux premières équations imposent \(x = \frac12\) et \(y = -\frac12\), et alors \(x + 2y = -\frac12 \neq 3\).</p>
    <p><strong>Q2.</strong> Quand \(X\) décrit \(\mathbb{R}^2\), \(AX\) décrit \(\operatorname{Im} A = \operatorname{Vect}(C_1, C_2)\), plan de \(\mathbb{R}^3\) engendré par les colonnes \(C_1 = (1, 1, 1)\) et \(C_2 = (1, -1, 2)\). Minimiser \(\|B - AX\|\) revient à chercher le point de ce plan le plus proche de \(B\) : c'est le projeté orthogonal de \(B\) sur \(\operatorname{Im} A\), caractérisé par \(\langle B - AX, C_j\rangle = 0\) pour \(j = 1, 2\). Ces deux conditions s'écrivent \(C_j^\top(B - AX) = 0\), c'est-à-dire \(A^\top(B - AX) = 0\), soit \(A^\top A\,X = A^\top B\) (équations normales).</p>
    <p><strong>Q3.</strong> \(A^\top A = \begin{pmatrix} 3 & 2 \\ 2 & 6\end{pmatrix}\) et \(A^\top B = \begin{pmatrix} 4 \\ 5\end{pmatrix}\). Le système \(3x + 2y = 4\), \(2x + 6y = 5\) a pour solution \(x = 1\), \(y = \frac12\). Alors \(AX = \big(\frac32, \frac12, 2\big)\), le vecteur des écarts est \(B - AX = \big(-\frac32, \frac12, 1\big)\), et le minimum vaut \(\frac94 + \frac14 + 1 = \frac72\).</p>
    <p><strong>Q4.</strong> Un vecteur normal au plan \(\operatorname{Im} A\) est \(n = C_1 \wedge C_2 = (3, -1, -2)\). La distance de \(B\) au plan vaut \(\frac{|\langle B, n\rangle|}{\|n\|} = \frac{|0 - 1 - 6|}{\sqrt{14}} = \frac{7}{\sqrt{14}}\), dont le carré est \(\frac{49}{14} = \frac72\) : c'est bien le minimum trouvé. De plus, le vecteur des écarts \(\big(-\frac32, \frac12, 1\big) = -\frac12\,n\) est normal au plan, comme il se doit.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Approcher la valeur absolue par un polynôme de degré 2</h3>
  <div class="statement">On munit \(E = \mathcal{C}([-1, 1], \mathbb{R})\) du produit scalaire \(\langle f, g\rangle = \int_{-1}^1 f(t)g(t)\,\mathrm{d}t\), et l'on note \(F\) le sous-espace des fonctions polynomiales de degré au plus 2 (restreintes à \([-1, 1]\)). On veut calculer
  <div class="formula">$$m = \min_{(a, b, c) \in \mathbb{R}^3}\int_{-1}^1 \big(|t| - a - bt - ct^2\big)^2\,\mathrm{d}t .$$</div></div>
  <div class="q"><strong>Q1.</strong> Montrer qu'une fonction paire et une fonction impaire sont toujours orthogonales dans \(E\).</div>
  <div class="q"><strong>Q2.</strong> Appliquer l'algorithme de Gram-Schmidt à la famille \((1, t, t^2)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le projeté orthogonal de \(f : t \mapsto |t|\) sur \(F\), puis \(m\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Si \(u\) est paire et \(v\) impaire, \(uv\) est impaire, et l'intégrale d'une fonction impaire continue sur \([-1, 1]\) est nulle.</p>
    <p><strong>Q2.</strong> \(\|1\|^2 = 2\), donc \(\varepsilon_0 = \frac{1}{\sqrt2}\). Ensuite \(\langle t, \varepsilon_0\rangle = 0\) (Q1), donc \(v_1 = t\), \(\|t\|^2 = \frac23\) et \(\varepsilon_1 = \sqrt{\frac32}\,t\). Enfin \(\langle t^2, \varepsilon_1\rangle = 0\) (Q1) et \(\langle t^2, \varepsilon_0\rangle = \frac{1}{\sqrt2} \times \frac23\), d'où \(v_2 = t^2 - \frac13\), avec</p>
    <div class="formula">$$\begin{aligned} \|v_2\|^2 &= \int_{-1}^1\Big(t^4 - \tfrac23t^2 + \tfrac19\Big)\mathrm{d}t = \tfrac25 - \tfrac49 + \tfrac29 = \tfrac{8}{45}, \\ \varepsilon_2 &= \sqrt{\tfrac{45}{8}}\,\Big(t^2 - \frac13\Big) = \sqrt{\tfrac58}\,\big(3t^2 - 1\big). \end{aligned}$$</div>
    <p><strong>Q3.</strong> La fonction \(|t|\) est paire, donc orthogonale à \(\varepsilon_1\). Les deux autres coordonnées se calculent en doublant l'intégrale sur \([0, 1]\) (intégrandes pairs) :</p>
    <div class="formula">$$\begin{aligned} \langle f, \varepsilon_0\rangle &= \tfrac{2}{\sqrt2}\int_0^1 t\,\mathrm{d}t = \tfrac{1}{\sqrt2}, \\ \langle f, \varepsilon_2\rangle &= 2\sqrt{\tfrac58}\int_0^1\big(3t^3 - t\big)\,\mathrm{d}t = \tfrac12\sqrt{\tfrac58}. \end{aligned}$$</div>
    <p>Le projeté est</p>
    <div class="formula">$$p_F(f) = \frac{1}{\sqrt2}\,\varepsilon_0 + \frac12\sqrt{\frac58}\,\varepsilon_2 = \frac12 + \frac{5}{16}\big(3t^2 - 1\big) = \frac{3}{16} + \frac{15}{16}\,t^2 .$$</div>
    <p>Le minimum est atteint pour \((a, b, c) = \big(\frac{3}{16}, 0, \frac{15}{16}\big)\) et vaut</p>
    <div class="formula">$$m = \|f\|^2 - \langle f, \varepsilon_0\rangle^2 - \langle f, \varepsilon_2\rangle^2 = \tfrac23 - \tfrac12 - \tfrac{5}{32} = \tfrac{1}{96}.$$</div>
    <p>En moyenne sur l'intervalle, de longueur 2, l'écart quadratique entre \(|t|\) et son approximation vaut \(\sqrt{m/2} \approx 0{,}072\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Une inégalité entre une fonction et sa dérivée</h3>
  <div class="statement">Soit \(f : [0, 1] \to \mathbb{R}\) de classe \(\mathcal{C}^1\) telle que \(f(0) = 0\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que, pour tout \(x \in [0, 1]\), \(f(x)^2 \leq x\int_0^x f'(t)^2\,\mathrm{d}t\). Pour \(x \gt 0\) fixé, quand y a-t-il égalité ?</div>
  <div class="q"><strong>Q2.</strong> En déduire que \(\int_0^1 f(x)^2\,\mathrm{d}x \leq \frac12\int_0^1 f'(t)^2\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que l'égalité dans Q2 n'a lieu que pour \(f = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(x = 0\), les deux membres sont nuls. Pour \(x \gt 0\), comme \(f(0) = 0\), \(f(x) = \int_0^x f'(t) \times 1\,\mathrm{d}t\). On applique Cauchy-Schwarz dans \(\mathcal{C}([0, x], \mathbb{R})\) muni de \(\int_0^x uv\), aux vecteurs \(f'\) et \(1\) :</p>
    <div class="formula">$$f(x)^2 = \Big(\int_0^x f' \times 1\Big)^2 \leq \int_0^x f'^2 \times \int_0^x 1^2 = x\int_0^x f'^2 .$$</div>
    <p>Il y a égalité si et seulement si \(f'\) et la fonction constante 1 sont colinéaires sur \([0, x]\), c'est-à-dire si \(f'\) est constante sur \([0, x]\) (\(f\) affine sur \([0, x]\)).</p>
    <p><strong>Q2.</strong> L'intégrande \(f'^2\) est positif, donc \(\int_0^x f'^2 \leq \int_0^1 f'^2\), et \(f(x)^2 \leq x\int_0^1 f'^2\) pour tout \(x\). On intègre cette inégalité entre fonctions continues sur \([0, 1]\) :</p>
    <div class="formula">$$\int_0^1 f(x)^2\,\mathrm{d}x \leq \Big(\int_0^1 x\,\mathrm{d}x\Big)\int_0^1 f'^2 = \frac12\int_0^1 f'^2 .$$</div>
    <p><strong>Q3.</strong> Supposons l'égalité. La fonction \(g : x \mapsto x\int_0^1 f'^2 - f(x)^2\) est continue, positive et d'intégrale nulle sur \([0, 1]\) : elle est nulle. Pour tout \(x \gt 0\), les deux inégalités de Q1 et Q2 sont donc des égalités ; la seconde donne \(x\int_x^1 f'^2 = 0\), soit \(\int_x^1 f'^2 = 0\), donc \(f' = 0\) sur \([x, 1]\) pour tout \(x \gt 0\), puis sur \([0, 1]\) par continuité. Ainsi \(f\) est constante, égale à \(f(0) = 0\). Par exemple, pour \(f(x) = x\), on obtient \(\frac13 \lt \frac12\). (La meilleure constante possible, hors programme, est \(4/\pi^2 \approx 0{,}405\).)</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Polynômes orthogonaux pour un poids exponentiel</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : produit scalaire intégral, Gram-Schmidt, meilleure approximation).</div>
  <div class="statement">Pour \(P\) et \(Q\) dans \(\mathbb{R}[X]\), on pose, sous réserve de convergence,
  <div class="formula">$$\langle P, Q\rangle = \int_0^{+\infty} P(t)\,Q(t)\,\mathrm{e}^{-t}\,\mathrm{d}t, \qquad I_n = \int_0^{+\infty} t^n\,\mathrm{e}^{-t}\,\mathrm{d}t \quad (n \in \mathbb{N}).$$</div></div>
  <p class="exo-part">Partie A — Un produit scalaire défini par une intégrale généralisée</p>
  <div class="q"><strong>A1.</strong> Montrer que \(I_n\) converge pour tout \(n\), puis que \(I_{n+1} = (n + 1)I_n\). En déduire \(I_n = n!\).</div>
  <div class="q"><strong>A2.</strong> Montrer que \(\langle P, Q\rangle\) est bien défini pour tous \(P, Q\), et que l'on définit ainsi un produit scalaire sur \(\mathbb{R}[X]\).</div>
  <p class="exo-part">Partie B — Orthonormalisation</p>
  <div class="q"><strong>B1.</strong> Appliquer l'algorithme de Gram-Schmidt à \((1, X, X^2)\) : on note \((\varepsilon_0, \varepsilon_1, \varepsilon_2)\) la famille obtenue.</div>
  <div class="q"><strong>B2.</strong> Vérifier directement que \(\langle \varepsilon_1, \varepsilon_2\rangle = 0\).</div>
  <p class="exo-part">Partie C — Une meilleure approximation</p>
  <div class="q"><strong>C1.</strong> Calculer \(m = \min_{(a, b) \in \mathbb{R}^2}\int_0^{+\infty}\big(t^2 - at - b\big)^2\,\mathrm{e}^{-t}\,\mathrm{d}t\) et préciser le couple \((a, b)\) qui le réalise.</div>
  <div class="q"><strong>C2.</strong> Contrôler le résultat en vérifiant une propriété d'orthogonalité de \(t^2 - at - b\).</div>
  <p class="exo-part">Partie D — Un pas de plus</p>
  <div class="q"><strong>D1.</strong> Calculer \(\langle X^3, \varepsilon_k\rangle\) pour \(k = 0, 1, 2\), et en déduire \(d\big(X^3, \mathbb{R}_2[X]\big)\) à l'aide de \(\|X^3\|^2\).</div>
  <div class="q"><strong>D2.</strong> En déduire le quatrième vecteur \(\varepsilon_3\) obtenu par Gram-Schmidt à partir de \((1, X, X^2, X^3)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> La fonction \(t \mapsto t^n\mathrm{e}^{-t}\) est continue et positive sur \([0, +\infty[\), et \(t^n\mathrm{e}^{-t} = o\big(\frac{1}{t^2}\big)\) en \(+\infty\) (croissances comparées) : l'intégrale converge. Pour \(A \gt 0\), une intégration par parties donne</p>
    <div class="formula">$$\begin{aligned} \int_0^A t^{n+1}\mathrm{e}^{-t}\,\mathrm{d}t = {}& \Big[-t^{n+1}\mathrm{e}^{-t}\Big]_0^A \\ &+ (n + 1)\int_0^A t^n\mathrm{e}^{-t}\,\mathrm{d}t , \end{aligned}$$</div>
    <p>et le crochet \(-A^{n+1}\mathrm{e}^{-A}\) tend vers 0 quand \(A \to +\infty\) : \(I_{n+1} = (n + 1)I_n\). Comme \(I_0 = 1\), une récurrence donne \(I_n = n!\).</p>
    <p><strong>A2.</strong> \(PQ\mathrm{e}^{-t}\) est une combinaison linéaire des \(t^k\mathrm{e}^{-t}\) : l'intégrale converge, et vaut la combinaison correspondante des \(I_k\). La symétrie est claire, la linéarité en \(Q\) vient de celle des intégrales convergentes. Positivité : \(\langle P, P\rangle = \int_0^{+\infty}P^2\mathrm{e}^{-t} \geq 0\). Si \(\langle P, P\rangle = 0\), pour tout \(A \gt 0\), \(0 \leq \int_0^A P^2\mathrm{e}^{-t} \leq \langle P, P\rangle = 0\) : la fonction continue positive \(P^2\mathrm{e}^{-t}\) est nulle sur \([0, A]\), donc \(P\) s'annule sur \([0, +\infty[\). Ayant une infinité de racines, \(P\) est nul.</p>
    <p><strong>B1.</strong> On utilise \(\langle X^j, X^k\rangle = I_{j+k} = (j + k)!\).</p>
    <ul>
      <li>\(\|1\|^2 = I_0 = 1\) : \(\varepsilon_0 = 1\).</li>
      <li>\(\langle X, \varepsilon_0\rangle = I_1 = 1\), \(v_1 = X - 1\), \(\|v_1\|^2 = I_2 - 2I_1 + I_0 = 1\) : \(\varepsilon_1 = X - 1\).</li>
      <li>\(\langle X^2, \varepsilon_0\rangle = I_2 = 2\) et \(\langle X^2, \varepsilon_1\rangle = I_3 - I_2 = 4\), donc \(v_2 = X^2 - 2 - 4(X - 1) = X^2 - 4X + 2\).</li>
      <li>\(v_2^2 = X^4 - 8X^3 + 20X^2 - 16X + 4\), d'où \(\|v_2\|^2 = 24 - 48 + 40 - 16 + 4 = 4\) et \(\varepsilon_2 = \frac12\big(X^2 - 4X + 2\big)\).</li>
    </ul>
    <p>Les conditions de signe sont remplies : \(\langle X, \varepsilon_1\rangle = \|v_1\| = 1 \gt 0\) et \(\langle X^2, \varepsilon_2\rangle = \|v_2\| = 2 \gt 0\).</p>
    <p><strong>B2.</strong> On développe : \((X - 1)\big(X^2 - 4X + 2\big)\) vaut \(X^3 - 5X^2 + 6X - 2\), donc \(2\langle \varepsilon_1, \varepsilon_2\rangle\) vaut \(I_3 - 5I_2 + 6I_1 - 2I_0 = 6 - 10 + 6 - 2 = 0\).</p>
    <p><strong>C1.</strong> La quantité à minimiser est \(\big\|X^2 - (aX + b)\big\|^2\), où \(aX + b\) décrit \(\mathbb{R}_1[X] = \operatorname{Vect}(\varepsilon_0, \varepsilon_1)\) : \(m = d\big(X^2, \mathbb{R}_1[X]\big)^2\), atteint pour le seul projeté orthogonal</p>
    <div class="formula">$$p\big(X^2\big) = \langle X^2, \varepsilon_0\rangle\varepsilon_0 + \langle X^2, \varepsilon_1\rangle\varepsilon_1 = 2 + 4(X - 1) = 4X - 2 .$$</div>
    <p>Donc \((a, b) = (4, -2)\), et \(m = \|X^2\|^2 - 2^2 - 4^2 = I_4 - 20 = 4\). Autre calcul : \(X^2 - p\big(X^2\big) = v_2\), de norme au carré \(4\).</p>
    <p><strong>C2.</strong> Le reste \(t^2 - 4t + 2\) doit être orthogonal à \(1\) et à \(t\) : \(\langle v_2, 1\rangle = I_2 - 4I_1 + 2I_0 = 0\) et \(\langle v_2, X\rangle = I_3 - 4I_2 + 2I_1 = 6 - 8 + 2 = 0\).</p>
    <p><strong>D1.</strong> \(\langle X^3, \varepsilon_0\rangle = I_3 = 6\), \(\langle X^3, \varepsilon_1\rangle = I_4 - I_3 = 18\), \(\langle X^3, \varepsilon_2\rangle = \frac12\big(I_5 - 4I_4 + 2I_3\big)\), soit \(\frac12(120 - 96 + 12) = 18\). Comme \((\varepsilon_0, \varepsilon_1, \varepsilon_2)\) est une base orthonormée de \(\mathbb{R}_2[X]\) et \(\|X^3\|^2 = I_6 = 720\),</p>
    <div class="formula">$$\begin{aligned} d\big(X^3, \mathbb{R}_2[X]\big)^2 &= 720 - \big(6^2 + 18^2 + 18^2\big) = 36, \\ d\big(X^3, \mathbb{R}_2[X]\big) &= 6 . \end{aligned}$$</div>
    <p><strong>D2.</strong> Le vecteur \(v_3 = X^3 - \sum_{k=0}^2\langle X^3, \varepsilon_k\rangle\varepsilon_k\) est \(X^3\) moins son projeté sur \(\mathbb{R}_2[X]\) :</p>
    <div class="formula">$$\begin{aligned} v_3 &= X^3 - 6 - 18(X - 1) - 9\big(X^2 - 4X + 2\big) \\ &= X^3 - 9X^2 + 18X - 6 , \end{aligned}$$</div>
    <p>de norme \(d\big(X^3, \mathbb{R}_2[X]\big) = 6\) d'après D1. Donc \(\varepsilon_3 = \frac16\big(X^3 - 9X^2 + 18X - 6\big)\). Ces polynômes sont, au signe près, les premiers polynômes de Laguerre.</p>
  </div>
</div>
</div>
