  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite la partie A, « Structure préhilbertienne », du thème « Espaces préhilbertiens et euclidiens » du programme de PT. En PTSI, le produit scalaire a été défini géométriquement dans le plan et dans l'espace : norme, orthogonalité, projeté orthogonal d'un point sur une droite ou un plan. On généralise ici ces notions à des espaces vectoriels quelconques (fonctions, polynômes, matrices), en gardant les figures de la géométrie comme guide. La suite naturelle est le chapitre « Isométries vectorielles » ; les matrices symétriques réelles et la réduction des coniques sont développées dans « Réduction des coniques et matrices symétriques ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Norme associée</strong> à un produit scalaire, <strong>distance</strong> ; identité remarquable \(\|x + y\|^2 = \|x\|^2 + \|y\|^2 + 2\langle x, y\rangle\) et formule de polarisation associée (§2).</li>
        <li><strong>Inégalité de Cauchy-Schwarz</strong> et <strong>inégalité triangulaire</strong>, avec leurs cas d'égalité (§3).</li>

<div class="course-section">
  <div class="sec-num">§1 · PRODUIT SCALAIRE</div>
  <h2>Ce qu'on garde du produit scalaire de la géométrie</h2>
  <div class="intro">Le produit scalaire du plan vérifie quelques règles de calcul simples : il se développe comme un produit, il est symétrique, et le carré scalaire d'un vecteur non nul est strictement positif. On prend ces règles comme définition : tout ce qui les vérifie s'appelle un produit scalaire, même sur un espace de fonctions.</div>

  <div class="def-box">
    Soit \(E\) un \(\mathbb{R}\)-espace vectoriel. Un <strong>produit scalaire</strong> sur \(E\) est une application \(E \times E \to \mathbb{R}\), \((x, y) \mapsto \langle x, y\rangle\), qui est :
    <ul>
      <li><strong>bilinéaire</strong> : linéaire par rapport à chaque variable quand l'autre est fixée ;</li>
      <li><strong>symétrique</strong> : \(\langle y, x\rangle = \langle x, y\rangle\) pour tous \(x, y\) ;</li>
      <li><strong>positive</strong> : \(\langle x, x\rangle \geq 0\) pour tout \(x\) ;</li>
      <li><strong>définie</strong> : \(\langle x, x\rangle = 0\) implique \(x = 0\).</li>
    </ul>
    Un <strong>espace préhilbertien</strong> (réel) est un espace vectoriel muni d'un produit scalaire. Un <strong>espace euclidien</strong> est un espace préhilbertien de dimension finie. On note aussi \((x \mid y)\) ou \(x \cdot y\).
  </div>
  <p>Grâce à la symétrie, il suffit de vérifier la linéarité par rapport à une seule variable. La bilinéarité donne \(\langle 0, y\rangle = 0\) pour tout \(y\) : le vecteur nul est orthogonal à tout le monde, et c'est le seul vecteur dont le carré scalaire est nul.</p>

  <h3>Les exemples de référence</h3>
  <ul>
    <li><strong>Canonique sur \(\mathbb{R}^n\)</strong> : \(\langle x, y\rangle = \sum_{i=1}^n x_iy_i\), soit \(X^\top Y\) avec les colonnes de coordonnées (matrice \(1 \times 1\) identifiée à un réel). Défini, car une somme de carrés n'est nulle que si chaque terme l'est. Variante pondérée : \(\sum w_ix_iy_i\) avec des poids \(w_i \gt 0\).</li>
    <li><strong>Intégral sur \(\mathcal{C}([a, b], \mathbb{R})\)</strong>, \(a \lt b\) : \(\langle f, g\rangle = \int_a^b f(t)g(t)\,\mathrm{d}t\). Défini grâce à la <strong>continuité</strong> : une fonction continue, positive et d'intégrale nulle sur un segment est nulle.</li>
    <li><strong>Intégral sur \(\mathbb{R}[X]\)</strong> : \(\langle P, Q\rangle = \int_0^1 PQ\). Si \(\int_0^1 P^2 = 0\), \(P\) s'annule sur tout \([0, 1]\) : une infinité de racines, donc \(P = 0\).</li>
    <li><strong>Matrices</strong> : \(\langle A, B\rangle = \operatorname{tr}(A^\top B) = \sum_{i,j} a_{ij}b_{ij}\) sur \(\mathcal{M}_n(\mathbb{R})\), produit canonique de \(\mathbb{R}^{n^2}\) déguisé.</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — un produit scalaire qui fait intervenir la dérivée</strong>
    <p>Sur \(E = \mathbb{R}[X]\), on pose \(\langle P, Q\rangle = P(0)Q(0) + \int_0^1 P'Q'\). On suit le plan habituel : symétrie, linéarité à droite, positivité, puis le caractère défini, qui demande un vrai argument.</p>
    <ol>
      <li>L'application est à valeurs réelles et symétrique ; à \(P\) fixé, \(Q \mapsto Q(0)\), \(Q \mapsto Q'\) et l'intégrale sont linéaires : elle est linéaire en \(Q\), donc bilinéaire.</li>
      <li>\(\langle P, P\rangle = P(0)^2 + \int_0^1 P'(t)^2\,\mathrm{d}t \geq 0\).</li>
      <li>Si \(\langle P, P\rangle = 0\), les deux termes positifs sont nuls : \(P(0) = 0\) et \(\int_0^1 P'^2 = 0\). La fonction \(P'^2\) est continue et positive, donc \(P'\) est nul sur \([0, 1]\) ; c'est un polynôme ayant une infinité de racines, donc \(P' = 0\). Ainsi \(P\) est constant, égal à \(P(0) = 0\).</li>
      <li>Un calcul : comme \(X^2\) s'annule en 0, \(\langle 1 + 2X, X^2\rangle = \int_0^1 2 \times 2t\,\mathrm{d}t = 2\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire le caractère défini automatique. Sans le terme \(P(0)Q(0)\), l'application \(\int_0^1 P'Q'\) est bilinéaire, symétrique et positive, mais la constante \(1\) vérifie \(\langle 1, 1\rangle = 0\) : ce n'est pas un produit scalaire. De même, \(P(0)Q(0) + P(1)Q(1)\) n'en est pas un sur \(\mathbb{R}[X]\), puisque \(X(X - 1)\) est non nul et de « carré » nul ; c'en est un sur \(\mathbb{R}_1[X]\), où un polynôme nul en 0 et en 1 est nul.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · NORME, DISTANCE ET IDENTITÉS REMARQUABLES</div>
  <h2>Mesurer des longueurs avec un produit scalaire</h2>
  <div class="intro">Un produit scalaire fournit une longueur pour chaque vecteur et une distance entre deux vecteurs. Les identités remarquables permettent de passer de l'un à l'autre : le produit scalaire se retrouve à partir de la norme.</div>

  <div class="def-box">
    Dans un espace préhilbertien \(E\), la <strong>norme associée</strong> au produit scalaire est \(\|x\| = \sqrt{\langle x, x\rangle}\) (bien définie par positivité) et la <strong>distance</strong> de \(x\) à \(y\) est \(d(x, y) = \|x - y\|\). Un vecteur de norme 1 est dit <strong>unitaire</strong> ; si \(x \neq 0\), le vecteur \(x / \|x\|\) est unitaire (on dit qu'on <strong>norme</strong> \(x\)).
  </div>
  <p>On a \(\|\lambda x\| = |\lambda|\,\|x\|\) pour tout réel \(\lambda\) (car \(\langle \lambda x, \lambda x\rangle = \lambda^2\langle x, x\rangle\)), et \(\|x\| = 0\) si et seulement si \(x = 0\) (caractère défini). L'inégalité triangulaire, troisième propriété d'une norme, est prouvée au §3.</p>

  <div class="prop-box">
    <strong>Identités remarquables.</strong> Pour tous \(x, y\) de \(E\) :
    <div class="formula" data-nom="Carré d'une somme (norme euclidienne)">$$\begin{aligned} \|x + y\|^2 &= \|x\|^2 + 2\langle x, y\rangle + \|y\|^2, \\ \|x - y\|^2 &= \|x\|^2 - 2\langle x, y\rangle + \|y\|^2. \end{aligned}$$</div>
    On en tire la <strong>formule de polarisation</strong>, qui exprime le produit scalaire à l'aide de la norme :
    <div class="formula" data-nom="Polarisation">$$\begin{aligned} 2\langle x, y\rangle &= \|x + y\|^2 - \|x\|^2 - \|y\|^2, \\ 4\langle x, y\rangle &= \|x + y\|^2 - \|x - y\|^2, \end{aligned}$$</div>
    et l'<strong>identité du parallélogramme</strong> \(\|x + y\|^2 + \|x - y\|^2 = 2\|x\|^2 + 2\|y\|^2\) : dans un parallélogramme, la somme des carrés des diagonales est égale à la somme des carrés des quatre côtés.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Développer \(\langle x + y, x + y\rangle\).</span>
    <div class="content"><p>Par bilinéarité, \(\langle x + y, x + y\rangle\) vaut \(\|x\|^2 + \langle x, y\rangle + \langle y, x\rangle + \|y\|^2\), et la symétrie regroupe les deux termes du milieu. On remplace \(y\) par \(-y\) pour la seconde identité. La première donne directement la polarisation ; la différence des deux donne \(4\langle x, y\rangle = \|x + y\|^2 - \|x - y\|^2\), leur somme donne l'identité du parallélogramme.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — retrouver un produit scalaire à partir de sa norme</strong>
    <p>Sur \(\mathbb{R}^2\), on pose \(N(x) = x_1^2 + 2x_1x_2 + 2x_2^2\) pour \(x = (x_1, x_2)\).</p>
    <ol>
      <li>Forme canonique : \(N(x) = (x_1 + x_2)^2 + x_2^2 \geq 0\), avec égalité si et seulement si \(x_2 = 0\) et \(x_1 + x_2 = 0\), c'est-à-dire \(x = 0\).</li>
      <li>Polarisation : \(\frac12\big(N(x + y) - N(x) - N(y)\big)\) ne garde que les termes croisés, d'où
      <div class="formula">$$\begin{aligned} \langle x, y\rangle = {}& x_1y_1 + x_1y_2 \\ &+ x_2y_1 + 2x_2y_2 . \end{aligned}$$</div></li>
      <li>Cette expression est bilinéaire et symétrique, et \(\langle x, x\rangle = N(x)\) : c'est un produit scalaire, de norme \(\sqrt{N}\).</li>
      <li>Ici \(\|e_2\| = \sqrt2\) et \(\langle e_1, e_2\rangle = 1\) : la base canonique n'est pas orthonormée, alors que \(\langle e_1, (-1, 1)\rangle = 0\). L'orthogonalité dépend du produit scalaire choisi.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\|x + y\|^2 = \|x\|^2 + \|y\|^2\) sans le double produit (ce n'est vrai que pour des vecteurs orthogonaux, §4), ou confondre \(\|x\|\) et \(\|x\|^2 = \langle x, x\rangle\). La norme n'est pas linéaire : \(\|x + y\| \neq \|x\| + \|y\|\) en général.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · INÉGALITÉS DE CAUCHY-SCHWARZ ET TRIANGULAIRE</div>
  <h2>Deux inégalités fondamentales</h2>
  <div class="intro">Dans le plan, \(|\vec u \cdot \vec v| = \|\vec u\|\,\|\vec v\|\,|\cos \theta|\) ne dépasse jamais \(\|\vec u\|\,\|\vec v\|\). Cette inégalité reste vraie dans tout espace préhilbertien ; elle donne l'inégalité triangulaire et permet de définir un angle entre deux fonctions.</div>

  <div class="prop-box">
    <strong>Inégalité de Cauchy-Schwarz.</strong> Pour tous \(x, y\) d'un espace préhilbertien :
    <div class="formula" data-nom="Inégalité de Cauchy-Schwarz">$$|\langle x, y\rangle| \leq \|x\|\,\|y\| ,$$</div>
    avec égalité si et seulement si la famille \((x, y)\) est <strong>liée</strong> (l'un des vecteurs est colinéaire à l'autre).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un trinôme du second degré toujours positif a un discriminant négatif ou nul.</span>
    <div class="content">
      <p>Si \(y = 0\), les deux membres sont nuls et la famille est liée. Supposons \(y \neq 0\). Pour tout réel \(\lambda\), l'identité remarquable donne</p>
      <div class="formula">$$0 \leq \|x + \lambda y\|^2 = \|y\|^2\lambda^2 + 2\langle x, y\rangle\lambda + \|x\|^2 .$$</div>
      <p>C'est un trinôme en \(\lambda\) de coefficient dominant \(\|y\|^2 \gt 0\), positif sur \(\mathbb{R}\) : il a au plus une racine réelle, donc son discriminant est négatif ou nul, \(4\langle x, y\rangle^2 - 4\|x\|^2\|y\|^2 \leq 0\). On prend la racine carrée.</p>
      <p><strong>Cas d'égalité.</strong> Si le discriminant est nul, le trinôme a une racine double \(\lambda_0\) : \(\|x + \lambda_0 y\| = 0\), donc \(x = -\lambda_0 y\) et la famille est liée. Réciproquement, si \(x = \mu y\), alors \(|\langle x, y\rangle| = |\mu|\,\|y\|^2 = \|x\|\,\|y\|\).</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Inégalité triangulaire.</strong> Pour tous \(x, y\) : \(\|x + y\| \leq \|x\| + \|y\|\), avec égalité si et seulement si \(x\) et \(y\) sont <strong>positivement liés</strong> : \(x = 0\), ou \(y = \lambda x\) avec \(\lambda \geq 0\). Conséquences : \(d(x, z) \leq d(x, y) + d(y, z)\) et \(\big|\,\|x\| - \|y\|\,\big| \leq \|x - y\|\). L'application \(x \mapsto \|x\|\) est donc une norme au sens général.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Comparer les carrés des deux membres.</span>
    <div class="content">
      <p>Les deux membres sont positifs ; on compare leurs carrés. D'après Cauchy-Schwarz, \(\langle x, y\rangle \leq |\langle x, y\rangle| \leq \|x\|\,\|y\|\), donc</p>
      <div class="formula">$$\|x + y\|^2 = \|x\|^2 + 2\langle x, y\rangle + \|y\|^2 \leq \|x\|^2 + 2\|x\|\,\|y\| + \|y\|^2 = \big(\|x\| + \|y\|\big)^2 .$$</div>
      <p>Il y a égalité si et seulement si \(\langle x, y\rangle = \|x\|\,\|y\|\). Si \(x \neq 0\), c'est un cas d'égalité de Cauchy-Schwarz, donc \(y = \lambda x\), et alors \(\lambda\|x\|^2 = |\lambda|\,\|x\|^2\) impose \(\lambda \geq 0\). La réciproque se vérifie directement.</p>
    </div>
  </div>

  <h3>Angle de deux vecteurs</h3>
  <p>Si \(x\) et \(y\) sont non nuls, Cauchy-Schwarz place le quotient \(\dfrac{\langle x, y\rangle}{\|x\|\,\|y\|}\) dans \([-1, 1]\) : il existe un unique \(\theta \in [0, \pi]\) dont il est le cosinus. On l'appelle l'angle (non orienté) de \(x\) et \(y\), en accord avec la géométrie de première année. Par exemple, dans \(\mathcal{C}([0, 1], \mathbb{R})\) muni de \(\int_0^1 fg\), les fonctions \(t\) et \(t^2\) vérifient \(\langle t, t^2\rangle = \frac14\), \(\|t\| = \frac{1}{\sqrt3}\), \(\|t^2\| = \frac{1}{\sqrt5}\), d'où \(\cos\theta = \frac{\sqrt{15}}{4} \approx 0{,}968\) et \(\theta \approx 14{,}5^\circ\) : pour ce produit scalaire, les fonctions \(t\) et \(t^2\) sont « presque colinéaires ».</p>

  <div class="method-box">
    <strong>Exemple — une inégalité intégrale</strong>
    <p>Soit \(f\) continue et strictement positive sur \([a, b]\). Montrons que \(\Big(\int_a^b f\Big)\Big(\int_a^b \frac1f\Big) \geq (b - a)^2\) et étudions le cas d'égalité.</p>
    <ol>
      <li>Dans \(\mathcal{C}([a, b], \mathbb{R})\) muni de \(\int_a^b uv\), on choisit \(u = \sqrt f\) et \(v = 1/\sqrt f\) (continues car \(f \gt 0\)), dont le produit scalaire est simple. Alors \(\langle u, v\rangle = \int_a^b 1 = b - a\), \(\|u\|^2 = \int_a^b f\) et \(\|v\|^2 = \int_a^b \frac1f\).</li>
      <li>Cauchy-Schwarz, élevée au carré : \((b - a)^2 \leq \int_a^b f \times \int_a^b \frac1f\).</li>
      <li>Égalité si et seulement si \(u\) et \(v\) sont colinéaires : \(\frac{1}{\sqrt f} = \lambda\sqrt f\), soit \(f = \frac1\lambda\) constante.</li>
      <li>Contrôle avec \(f = \mathrm{e}^t\) sur \([0, 1]\) : \((\mathrm{e} - 1)(1 - \mathrm{e}^{-1}) \approx 1{,}086 \geq 1\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer Cauchy-Schwarz sans avoir précisé l'espace, le produit scalaire et les deux vecteurs ; ou oublier la valeur absolue (la forme sans racine, \(\langle x, y\rangle^2 \leq \langle x, x\rangle\langle y, y\rangle\), est souvent la plus pratique). Pour l'inégalité triangulaire, l'égalité demande la même direction <strong>et</strong> le même sens : \(\|x + (-x)\| = 0 \neq 2\|x\|\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ORTHOGONALITÉ</div>
  <h2>L'angle droit dans un espace quelconque</h2>
  <div class="intro">Deux vecteurs sont orthogonaux quand leur produit scalaire est nul : la définition ne demande ni dessin ni dimension finie. Elle conduit à l'orthogonal d'un sous-espace, aux familles orthogonales et au théorème de Pythagore.</div>

  <div class="def-box">
    Deux vecteurs \(x\) et \(y\) sont <strong>orthogonaux</strong> (\(x \perp y\)) si \(\langle x, y\rangle = 0\). Deux sous-espaces \(F\) et \(G\) sont <strong>orthogonaux</strong> si tout vecteur de \(F\) est orthogonal à tout vecteur de \(G\). L'<strong>orthogonal</strong> d'un sous-espace \(F\) est
    <div class="formula" data-nom="Orthogonal d'un sous-espace">$$F^\perp = \{x \in E \mid \forall y \in F, \langle x, y\rangle = 0\}.$$</div>
  </div>
  <div class="prop-box">
    <strong>Propriétés de l'orthogonal.</strong>
    <ul>
      <li>\(F^\perp\) est un sous-espace vectoriel de \(E\), et \(F \cap F^\perp = \{0\}\) ; deux sous-espaces orthogonaux sont en somme directe.</li>
      <li>Si \(F = \operatorname{Vect}(f_1, \ldots, f_p)\), alors \(x \in F^\perp\) si et seulement si \(\langle x, f_j\rangle = 0\) pour tout \(j\) : il suffit de tester une famille génératrice.</li>
      <li>\(F \subset G \Rightarrow G^\perp \subset F^\perp\) ; \(\{0\}^\perp = E\) et \(E^\perp = \{0\}\) ; \(F \subset (F^\perp)^\perp\) (égalité en dimension finie, §7).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Sous-espace, intersection nulle, famille génératrice.</span>
    <div class="content">
      <p><strong>Sous-espace</strong> : \(F^\perp\) est l'intersection des noyaux des formes linéaires \(x \mapsto \langle x, y\rangle\), pour \(y \in F\). <strong>Intersection</strong> : si \(x \in F \cap F^\perp\), \(x\) est orthogonal à lui-même, \(\langle x, x\rangle = 0\), donc \(x = 0\). <strong>Famille génératrice</strong> : si \(x\) est orthogonal à chaque \(f_j\), il l'est à toute combinaison \(\sum \lambda_j f_j\) par linéarité. <strong>\(E^\perp\)</strong> : un vecteur orthogonal à tout \(E\) l'est à lui-même, il est nul.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — calculer un orthogonal dans \(\mathbb{R}^4\)</strong>
    <p>\(\mathbb{R}^4\) est muni du produit scalaire canonique, et \(F = \operatorname{Vect}(u_1, u_2)\) avec \(u_1 = (1, 1, 0, 0)\) et \(u_2 = (0, 1, 1, 1)\).</p>
    <ol>
      <li>\(x = (a, b, c, d) \in F^\perp\) si et seulement si \(\langle x, u_1\rangle = a + b = 0\) et \(\langle x, u_2\rangle = b + c + d = 0\).</li>
      <li>On prend \(c\) et \(d\) comme paramètres : \(b = -c - d\) et \(a = c + d\).</li>
      <li>\(F^\perp\) est le plan engendré par \((1, -1, 1, 0)\) et \((1, -1, 0, 1)\) : sa dimension vaut \(2 = 4 - \dim F\) (ce n'est pas un hasard, voir §7).</li>
    </ol>
  </div>
  <p>Deux autres situations à connaître. Dans \(\mathcal{C}([-1, 1], \mathbb{R})\) muni de \(\int_{-1}^1 fg\), toute fonction paire est orthogonale à toute fonction impaire, car leur produit est impair. Dans \(\mathcal{M}_n(\mathbb{R})\) muni de \(\operatorname{tr}(A^\top B)\), les matrices symétriques et antisymétriques forment deux sous-espaces orthogonaux.</p>

  <h3>Familles orthogonales et orthonormées</h3>
  <div class="def-box">
    Une famille \((e_1, \ldots, e_p)\) est <strong>orthogonale</strong> si ses vecteurs sont deux à deux orthogonaux, <strong>orthonormée</strong> (ou orthonormale) si de plus ils sont unitaires : \(\langle e_i, e_j\rangle = \delta_{ij}\), où \(\delta_{ij}\) vaut 1 si \(i = j\) et 0 sinon.
  </div>
  <div class="prop-box">
    <strong>Liberté.</strong> Toute famille orthogonale (finie) de vecteurs <strong>non nuls</strong> est libre ; en particulier, toute famille orthonormée est libre.<br>
    <strong>Théorème de Pythagore.</strong> \(x \perp y\) si et seulement si \(\|x + y\|^2 = \|x\|^2 + \|y\|^2\). Pour une famille orthogonale \((x_1, \ldots, x_p)\) :
    <div class="formula" data-nom="Théorème de Pythagore">$$\Big\|\sum_{i=1}^p x_i\Big\|^2 = \sum_{i=1}^p \|x_i\|^2 .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Faire le produit scalaire d'une combinaison nulle avec chaque \(e_j\).</span>
    <div class="content">
      <p><strong>Liberté</strong> : si \(\sum_i \lambda_i e_i = 0\), le produit scalaire avec \(e_j\) donne \(\sum_i \lambda_i\langle e_i, e_j\rangle = \lambda_j\|e_j\|^2 = 0\), donc \(\lambda_j = 0\) puisque \(e_j \neq 0\).</p>
      <p><strong>Pythagore</strong> : pour deux vecteurs, c'est l'identité \(\|x + y\|^2 = \|x\|^2 + \|y\|^2 + 2\langle x, y\rangle\). Pour \(p\) vecteurs, on développe \(\langle \sum_i x_i, \sum_j x_j\rangle = \sum_{i,j}\langle x_i, x_j\rangle\) : seuls les termes \(i = j\) restent.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — la famille trigonométrique</strong>
    <p>Sur \(\mathcal{C}([0, 2\pi], \mathbb{R})\) muni de \(\langle f, g\rangle = \int_0^{2\pi} fg\), on considère \(c_k : t \mapsto \cos(kt)\) pour \(k \geq 0\) et \(s_k : t \mapsto \sin(kt)\) pour \(k \geq 1\).</p>
    <ol>
      <li>On linéarise les produits : par exemple, \(2\cos a\cos b\) vaut \(\cos(a - b) + \cos(a + b)\). Pour tout entier \(m \neq 0\), \(\cos(mt)\) et \(\sin(mt)\) sont d'intégrale nulle sur \([0, 2\pi]\) : deux fonctions distinctes de la famille sont orthogonales.</li>
      <li>Normes : \(\|c_0\|^2 = 2\pi\) et, en linéarisant \(\cos^2\) et \(\sin^2\), \(\|c_k\|^2 = \|s_k\|^2 = \pi\) pour \(k \geq 1\).</li>
      <li>Toute sous-famille finie est donc libre, sans calcul de déterminant. C'est le point de départ des séries de Fourier.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : la réciproque de Pythagore est fausse à partir de trois vecteurs. Dans \(\mathbb{R}^2\), \(x = (1, 0)\), \(y = (0, 1)\) et \(z = (1, -1)\) vérifient \(\|x + y + z\|^2 = 4 = \|x\|^2 + \|y\|^2 + \|z\|^2\), alors que \(\langle x, z\rangle = 1\). Autre piège : une famille orthogonale contenant le vecteur nul n'est pas libre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · ALGORITHME DE GRAM-SCHMIDT</div>
  <h2>Fabriquer une famille orthonormée</h2>
  <div class="intro">Une famille orthonormée rend tous les calculs simples (§6, §7). L'algorithme de Gram-Schmidt en construit une à partir de n'importe quelle famille libre, sans changer les sous-espaces engendrés par ses premiers vecteurs : à chaque étape, on retire au nouveau vecteur ses composantes selon les vecteurs déjà construits, puis on norme le reste.</div>

  <div class="prop-box">
    <strong>Théorème (Gram-Schmidt).</strong> Soit \((e_1, \ldots, e_p)\) une famille libre d'un espace préhilbertien. Il existe une unique famille orthonormée \((\varepsilon_1, \ldots, \varepsilon_p)\) telle que, pour tout \(k\), \(\operatorname{Vect}(\varepsilon_1, \ldots, \varepsilon_k) = \operatorname{Vect}(e_1, \ldots, e_k)\) et \(\langle e_k, \varepsilon_k\rangle \gt 0\). Elle s'obtient de proche en proche :
    <div class="formula" data-nom="Algorithme de Gram-Schmidt">$$\begin{aligned} &\varepsilon_1 = \frac{e_1}{\|e_1\|}, \quad \varepsilon_k = \frac{v_k}{\|v_k\|}, \\ &\text{où } v_k = e_k - \sum_{i=1}^{k-1}\langle e_k, \varepsilon_i\rangle\,\varepsilon_i . \end{aligned}$$</div>
  </div>

</figure>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Récurrence sur \(k\) : le vecteur \(v_k\) est non nul et orthogonal aux précédents.</span>
    <div class="content">
      <p>Supposons construits \(\varepsilon_1, \ldots, \varepsilon_{k-1}\), orthonormés, avec \(\operatorname{Vect}(\varepsilon_1, \ldots, \varepsilon_{k-1}) = \operatorname{Vect}(e_1, \ldots, e_{k-1})\).</p>
      <ul>
        <li><strong>\(v_k \neq 0\)</strong> : sinon \(e_k\) appartiendrait à \(\operatorname{Vect}(\varepsilon_1, \ldots, \varepsilon_{k-1}) = \operatorname{Vect}(e_1, \ldots, e_{k-1})\), ce que la liberté interdit.</li>
        <li><strong>Orthogonalité</strong> : pour \(j \lt k\), en développant \(\langle v_k, \varepsilon_j\rangle\), seul le terme \(i = j\) de la somme subsiste, et il compense exactement \(\langle e_k, \varepsilon_j\rangle\) : \(\langle v_k, \varepsilon_j\rangle = 0\).</li>
        <li><strong>Sous-espaces</strong> : \(\varepsilon_k\) est combinaison de \(e_k\) et des \(\varepsilon_i\) (\(i \lt k\)), donc appartient à \(\operatorname{Vect}(e_1, \ldots, e_k)\) ; inversement \(e_k = v_k + \sum_{i \lt k}\langle e_k, \varepsilon_i\rangle\varepsilon_i\), avec \(v_k = \|v_k\|\varepsilon_k\). Les deux sous-espaces sont égaux.</li>
        <li><strong>Signe</strong> : \(e_k - v_k\) est orthogonal à \(\varepsilon_k\), donc \(\langle e_k, \varepsilon_k\rangle = \|v_k\| \gt 0\).</li>
      </ul>
      <p><strong>Unicité</strong> : \(\varepsilon_k\) doit appartenir à \(\operatorname{Vect}(e_1, \ldots, e_k)\) et être orthogonal à \(\operatorname{Vect}(e_1, \ldots, e_{k-1})\) ; ces conditions définissent une droite, qui contient \(v_k\). Il reste deux vecteurs unitaires, \(\pm v_k / \|v_k\|\), et la condition de signe en choisit un.</p>
    </div>
  </div>
  <p>Le vecteur \(v_k\) est exactement \(e_k\) moins son projeté orthogonal sur \(\operatorname{Vect}(e_1, \ldots, e_{k-1})\) (§7) : Gram-Schmidt consiste à « redresser » chaque vecteur contre ceux qui le précèdent.</p>

  <div class="method-box">
    <strong>Méthode — orthonormaliser en pratique</strong>
    <ol>
      <li>Normer \(e_1\) ; puis, à chaque étape, retrancher à \(e_k\) ses composantes \(\langle e_k, \varepsilon_i\rangle\varepsilon_i\), <strong>vérifier</strong> que le reste \(v_k\) est orthogonal aux \(\varepsilon_i\) déjà obtenus, et le normer.</li>
      <li>Variante sans racines carrées : orthogonaliser d'abord, avec \(w_k = e_k - \sum_{i \lt k}\frac{\langle e_k, w_i\rangle}{\|w_i\|^2}w_i\), remplacer au besoin \(w_k\) par un multiple sans fractions, et ne normer qu'à la fin.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — dans \(\mathbb{R}^3\) canonique</strong>
    <p>On orthonormalise \(e_1 = (1, 1, 0)\), \(e_2 = (1, 0, 1)\), \(e_3 = (0, 1, 1)\).</p>
    <ol>
      <li>\(\varepsilon_1 = \frac{1}{\sqrt2}(1, 1, 0)\) ; \(v_2 = e_2 - \frac12(1, 1, 0) = \frac12(1, -1, 2)\), d'où \(\varepsilon_2 = \frac{1}{\sqrt6}(1, -1, 2)\).</li>
      <li>\(v_3 = e_3 - \frac12(1, 1, 0) - \frac16(1, -1, 2)\), soit \(v_3 = \frac23(-1, 1, 1)\), d'où \(\varepsilon_3 = \frac{1}{\sqrt3}(-1, 1, 1)\).</li>
      <li>Contrôle : \(-1 + 1 + 0 = 0\) et \(-1 - 1 + 2 = 0\), donc \(\varepsilon_3\) est orthogonal à \(\varepsilon_1\) et \(\varepsilon_2\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une base orthonormée de \(\mathbb{R}_2[X]\) pour \(\int_0^1 PQ\)</strong>
    <p>On orthonormalise la base \((1, X, X^2)\) pour \(\langle P, Q\rangle = \int_0^1 P(t)Q(t)\,\mathrm{d}t\). On utilise \(\int_0^1 t^k\,\mathrm{d}t = \frac{1}{k+1}\).</p>
    <ol>
      <li>\(\|1\|^2 = 1\), donc \(\varepsilon_0 = 1\).</li>
      <li>\(\langle X, \varepsilon_0\rangle = \frac12\), \(v_1 = X - \frac12\) et \(\|v_1\|^2 = \int_0^1 \big(t - \frac12\big)^2\mathrm{d}t = \frac{1}{12}\). Donc \(\varepsilon_1 = \sqrt{12}\big(X - \frac12\big) = \sqrt3\,(2X - 1)\).</li>
      <li>\(\langle X^2, \varepsilon_0\rangle = \frac13\), et \(\langle X^2, \varepsilon_1\rangle = \sqrt3\int_0^1 (2t^3 - t^2)\,\mathrm{d}t\) vaut \(\sqrt3\big(\frac12 - \frac13\big) = \frac{\sqrt3}{6}\).</li>
      <li>\(v_2 = X^2 - \frac13 - \frac{\sqrt3}{6}\sqrt3\,(2X - 1)\), soit \(v_2 = X^2 - X + \frac16\), et le calcul donne \(\|v_2\|^2 = \frac{1}{180}\).</li>
      <li>Conclusion :
      <div class="formula" data-nom="Base orthonormée de R2[X] pour ∫₀¹">$$\begin{aligned} \varepsilon_0 &= 1, \\ \varepsilon_1 &= \sqrt3\,(2X - 1), \\ \varepsilon_2 &= \sqrt5\,(6X^2 - 6X + 1). \end{aligned}$$</div></li>
      <li>Contrôle de symétrie : le changement \(t \mapsto 1 - t\) conserve le produit scalaire, laisse \(\varepsilon_2\) inchangé et change \(\varepsilon_1\) en son opposé, ce qui explique \(\langle \varepsilon_1, \varepsilon_2\rangle = 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : retrancher \(\langle e_k, e_i\rangle e_i\) (avec les vecteurs de départ) au lieu de \(\langle e_k, \varepsilon_i\rangle\varepsilon_i\), ou utiliser des \(w_i\) non normés sans diviser par \(\|w_i\|^2\). Le résultat dépend aussi de l'ordre des vecteurs de départ : changer l'ordre donne une autre famille orthonormée.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · BASES ORTHONORMÉES D'UN ESPACE EUCLIDIEN</div>
  <h2>Des coordonnées qui se calculent par produit scalaire</h2>
  <div class="intro">Dans une base orthonormée, un espace euclidien se comporte exactement comme \(\mathbb{R}^n\) muni du produit scalaire canonique : les coordonnées s'obtiennent par produits scalaires, sans système à résoudre, et le produit scalaire se calcule comme une somme de produits.</div>

  <div class="prop-box">
    <strong>Existence.</strong> Tout espace euclidien non réduit à \(\{0\}\) possède des bases orthonormées : on applique Gram-Schmidt à une base quelconque. Plus précisément, toute famille orthonormée se complète en une base orthonormée (on la complète en une base, puis Gram-Schmidt ne modifie pas les premiers vecteurs, déjà orthonormés).
  </div>
  <div class="prop-box">
    <strong>Calculs dans une base orthonormée.</strong> Soit \((e_1, \ldots, e_n)\) une base orthonormée de \(E\), \(x = \sum x_ie_i\) et \(y = \sum y_ie_i\), de colonnes de coordonnées \(X\) et \(Y\). Alors \(x_i = \langle x, e_i\rangle\) et
    <div class="formula" data-nom="Calculs en base orthonormée">$$\begin{aligned} x &= \sum_{i=1}^n \langle x, e_i\rangle\,e_i, \\ \langle x, y\rangle &= \sum_{i=1}^n x_iy_i = X^\top Y, \\ \|x\|^2 &= \sum_{i=1}^n x_i^2 . \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Utiliser \(\langle e_i, e_j\rangle = \delta_{ij}\).</span>
    <div class="content"><p>En faisant le produit scalaire de \(x = \sum_j x_je_j\) avec \(e_i\), il reste \(\langle x, e_i\rangle = \sum_j x_j\delta_{ji} = x_i\). Puis, par bilinéarité, \(\langle x, y\rangle = \sum_{i,j} x_iy_j\langle e_i, e_j\rangle = \sum_i x_iy_i\), et l'on prend \(y = x\) pour la norme.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — coordonnées de \(X^2\) dans la base orthonormée du §5</strong>
    <p>Dans \(\mathbb{R}_2[X]\) muni de \(\int_0^1 PQ\), la base \((\varepsilon_0, \varepsilon_1, \varepsilon_2)\) est orthonormée.</p>
    <ol>
      <li>Les coordonnées sont des produits scalaires : \(\langle X^2, \varepsilon_0\rangle = \frac13\), \(\langle X^2, \varepsilon_1\rangle = \frac{\sqrt3}{6}\) (déjà calculés) et \(\langle X^2, \varepsilon_2\rangle = \sqrt5\big(\frac65 - \frac32 + \frac13\big) = \frac{\sqrt5}{30}\).</li>
      <li>Donc \(X^2 = \frac13\varepsilon_0 + \frac{\sqrt3}{6}\varepsilon_1 + \frac{\sqrt5}{30}\varepsilon_2\). Vérification :
      <div class="formula">$$\begin{aligned} &\tfrac13 + \tfrac12(2X - 1) \\ &+ \tfrac16(6X^2 - 6X + 1) = X^2 . \end{aligned}$$</div></li>
      <li>Norme : \(\|X^2\|^2 = \int_0^1 t^4\,\mathrm{d}t = \frac15\), et la somme des carrés des coordonnées vaut bien \(\frac19 + \frac{1}{12} + \frac{1}{180} = \frac{36}{180} = \frac15\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer ces formules dans une base qui n'est pas orthonormée. Dans \(\mathbb{R}^2\) canonique, le vecteur \(b_2 = (1, 1)\) a pour coordonnées \((0, 1)\) dans la base \(\big((1, 0), (1, 1)\big)\), mais sa norme est \(\sqrt2\), pas \(\sqrt{0^2 + 1^2} = 1\). La formule \(\langle x, y\rangle = X^\top Y\) n'est valable qu'en base orthonormée. Les changements de bases orthonormées (matrices orthogonales) sont étudiés dans le chapitre « Isométries vectorielles ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SUPPLÉMENTAIRE ORTHOGONAL ET PROJECTION ORTHOGONALE</div>
  <h2>Projeter à angle droit sur un sous-espace</h2>
  <div class="intro">En géométrie, le projeté orthogonal d'un point sur un plan est le pied de la perpendiculaire. Dans un espace préhilbertien, on projette sur un sous-espace \(F\) de dimension finie : tout vecteur se décompose en une partie dans \(F\) et une partie orthogonale à \(F\).</div>

  <div class="prop-box">
    <strong>Théorème du supplémentaire orthogonal.</strong> Soit \(F\) un sous-espace de <strong>dimension finie</strong> d'un espace préhilbertien \(E\) (\(E\) peut être de dimension infinie). Alors
    <div class="formula" data-nom="Supplémentaire orthogonal">$$E = F \oplus F^\perp .$$</div>
    Si \((\varepsilon_1, \ldots, \varepsilon_p)\) est une base orthonormée de \(F\), la composante de \(x\) dans \(F\) est \(\sum_{i=1}^p\langle x, \varepsilon_i\rangle\varepsilon_i\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Construire la décomposition avec une base orthonormée de \(F\).</span>
    <div class="content">
      <p>On sait déjà que \(F \cap F^\perp = \{0\}\) (§4). Pour la somme, \(F\) étant de dimension finie, il possède une base orthonormée \((\varepsilon_1, \ldots, \varepsilon_p)\) (§6). Soit \(x \in E\) ; on pose \(a = \sum_{i=1}^p\langle x, \varepsilon_i\rangle\varepsilon_i \in F\) et \(b = x - a\). Pour chaque \(j\),</p>
      <div class="formula">$$\langle b, \varepsilon_j\rangle = \langle x, \varepsilon_j\rangle - \sum_{i=1}^p\langle x, \varepsilon_i\rangle\langle \varepsilon_i, \varepsilon_j\rangle = \langle x, \varepsilon_j\rangle - \langle x, \varepsilon_j\rangle = 0 ,$$</div>
      <p>donc \(b\) est orthogonal à une famille génératrice de \(F\) : \(b \in F^\perp\). Ainsi \(x = a + b\) avec \(a \in F\) et \(b \in F^\perp\).</p>
    </div>
  </div>

  <div class="def-box">
    La <strong>projection orthogonale</strong> sur \(F\), notée \(p_F\), est le projecteur sur \(F\) parallèlement à \(F^\perp\) (voir le chapitre « Projecteurs &amp; symétries »). Le <strong>projeté orthogonal</strong> \(p_F(x)\) est l'unique vecteur \(y\) tel que \(y \in F\) et \(x - y \in F^\perp\). Dans une base orthonormée \((\varepsilon_1, \ldots, \varepsilon_p)\) de \(F\) :
    <div class="formula" data-nom="Projeté orthogonal (base orthonormée)">$$p_F(x) = \sum_{i=1}^p \langle x, \varepsilon_i\rangle\,\varepsilon_i .$$</div>
    En particulier, sur une droite \(D = \operatorname{Vect}(a)\) avec \(a \neq 0\) :
    <div class="formula" data-nom="Projeté sur une droite">$$p_D(x) = \frac{\langle x, a\rangle}{\|a\|^2}\,a .$$</div>
  </div>

</figure>
  <p>L'application \(p_F\) est linéaire, vérifie \(p_F \circ p_F = p_F\), a pour image \(F\) et pour noyau \(F^\perp\). Par Pythagore, \(\|x\|^2 = \|p_F(x)\|^2 + \|x - p_F(x)\|^2\), donc \(\|p_F(x)\| \leq \|x\|\) : projeter ne peut que raccourcir. Enfin \(s_F = 2p_F - \mathrm{id}\) est la <strong>symétrie orthogonale</strong> par rapport à \(F\), étudiée dans le chapitre « Isométries vectorielles ».</p>

  <h3>En dimension finie : dimension de l'orthogonal, hyperplans</h3>
  <div class="prop-box">
    <strong>Conséquences.</strong> Soit \(E\) euclidien de dimension \(n\) et \(F\) un sous-espace.
    <ul>
      <li>\(\dim F^\perp = n - \dim F\), \((F^\perp)^\perp = F\), et \(p_{F^\perp} = \mathrm{id} - p_F\).</li>
      <li>Un sous-espace \(H\) est un hyperplan si et seulement si \(H = \operatorname{Vect}(a)^\perp\) pour un vecteur \(a \neq 0\), appelé <strong>vecteur normal</strong> à \(H\) (unique à un facteur non nul près). Dans une base orthonormée, si \(a\) a pour coordonnées \((a_1, \ldots, a_n)\), une équation de \(H\) est \(a_1x_1 + \cdots + a_nx_n = 0\).</li>
      <li>Projection sur un hyperplan de vecteur normal \(a\) : \(p_H(x) = x - \frac{\langle x, a\rangle}{\|a\|^2}\,a\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dimension de \(F^\perp\) et double orthogonal.</span>
    <div class="content"><p>De \(E = F \oplus F^\perp\) on tire \(\dim F^\perp = n - \dim F\). On a toujours \(F \subset (F^\perp)^\perp\), et \(\dim (F^\perp)^\perp = n - (n - \dim F) = \dim F\) : l'inclusion est une égalité. Pour un hyperplan \(H\), \(H^\perp\) est une droite \(\operatorname{Vect}(a)\) et \(H = (H^\perp)^\perp = \operatorname{Vect}(a)^\perp\). Enfin \(x = p_F(x) + (x - p_F(x))\) est aussi la décomposition de \(x\) selon \(F^\perp \oplus F\), d'où \(p_{F^\perp}(x) = x - p_F(x)\).</p></div>
  </div>

  <div class="method-box">
    <strong>Méthode — calculer un projeté orthogonal</strong>
    <ol>
      <li><strong>Avec une base orthonormée de \(F\)</strong> (au besoin obtenue par Gram-Schmidt) : \(p_F(x) = \sum\langle x, \varepsilon_i\rangle\varepsilon_i\).</li>
      <li><strong>Par un système linéaire</strong>, avec une famille génératrice quelconque \((f_1, \ldots, f_p)\) de \(F\) : on cherche \(p = \sum_j\lambda_jf_j\) et on écrit que \(x - p\) est orthogonal à chaque \(f_i\), soit \(\sum_j\lambda_j\langle f_j, f_i\rangle = \langle x, f_i\rangle\) pour tout \(i\).</li>
      <li><strong>Par l'orthogonal</strong>, quand \(F^\perp\) est petit (hyperplan) : \(p_F(x) = x - p_{F^\perp}(x)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — projeter sur un plan de \(\mathbb{R}^4\) par un système</strong>
    <p>On reprend \(F = \operatorname{Vect}(u_1, u_2)\) du §4, avec \(u_1 = (1, 1, 0, 0)\) et \(u_2 = (0, 1, 1, 1)\), et l'on projette \(x = (1, 2, 3, 4)\).</p>
    <ol>
      <li>Produits scalaires utiles : \(\|u_1\|^2 = 2\), \(\langle u_1, u_2\rangle = 1\), \(\|u_2\|^2 = 3\), \(\langle x, u_1\rangle = 3\), \(\langle x, u_2\rangle = 9\).</li>
      <li>\(p = \lambda u_1 + \mu u_2\) et \(x - p \perp u_1, u_2\) donnent le système \(2\lambda + \mu = 3\), \(\lambda + 3\mu = 9\), de solution \(\lambda = 0\), \(\mu = 3\).</li>
      <li>\(p_F(x) = (0, 3, 3, 3)\) et \(x - p_F(x) = (1, -1, 0, 1)\). Contrôle : ce vecteur est orthogonal à \(u_1\) et à \(u_2\) ; c'est d'ailleurs le second vecteur de la base de \(F^\perp\) trouvée au §4.</li>
      <li>Distance (§8) : \(d(x, F) = \|(1, -1, 0, 1)\| = \sqrt3\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — projeter sur un plan de \(\mathbb{R}^3\) par son vecteur normal</strong>
    <p>Le plan \(P\) d'équation \(2x - y + 2z = 0\) a pour vecteur normal \(a = (2, -1, 2)\), de norme 3. Pour \(x_0 = (1, 1, 1)\), \(\langle x_0, a\rangle = 3\), donc \(p_P(x_0) = x_0 - \frac39\,a = \big(\frac13, \frac43, \frac13\big)\) ; ce vecteur vérifie bien l'équation du plan, et \(d(x_0, P) = \frac{|\langle x_0, a\rangle|}{\|a\|} = 1\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(\sum\langle x, f_i\rangle f_i\) avec une base de \(F\) qui n'est pas orthonormée. Avec \(u_1\), \(u_2\) ci-dessus, on obtiendrait \(3u_1 + 9u_2 = (3, 12, 9, 9)\), plus long que \(x\) lui-même, ce qu'un projeté orthogonal ne peut pas être. Autre point d'attention : le théorème exige \(\dim F\) finie ; en dimension infinie, \(F\) et \(F^\perp\) peuvent ne pas être supplémentaires.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DISTANCE À UN SOUS-ESPACE, MOINDRES CARRÉS</div>
  <h2>Le projeté orthogonal est le meilleur approximant</h2>
  <div class="intro">Le pied de la perpendiculaire est le point du plan le plus proche : c'est le théorème de Pythagore. Le même raisonnement, dans un espace de fonctions ou dans \(\mathbb{R}^n\), transforme des problèmes de minimisation (meilleure approximation d'une fonction, droite de régression) en calculs de projection.</div>

  <div class="def-box">
    Soit \(F\) un sous-espace de \(E\) et \(x \in E\). La <strong>distance</strong> de \(x\) à \(F\) est \(d(x, F) = \inf\{\|x - y\|,\ y \in F\}\) (borne inférieure d'une partie non vide et minorée par 0).
  </div>
  <div class="prop-box">
    <strong>Théorème de meilleure approximation.</strong> Si \(F\) est de dimension finie, \(p_F(x)\) est l'<strong>unique</strong> vecteur de \(F\) qui réalise la distance de \(x\) à \(F\) :
    <div class="formula" data-nom="Distance à un sous-espace">$$\begin{aligned} d(x, F) &= \|x - p_F(x)\|, \\ d(x, F)^2 &= \|x\|^2 - \|p_F(x)\|^2 \\ &= \|x\|^2 - \sum_{i=1}^p\langle x, \varepsilon_i\rangle^2 , \end{aligned}$$</div>
    la dernière forme utilisant une base orthonormée \((\varepsilon_1, \ldots, \varepsilon_p)\) de \(F\). Pour un hyperplan \(H\) de vecteur normal \(a\), \(d(x, H) = \dfrac{|\langle x, a\rangle|}{\|a\|}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pythagore dans le triangle \(x\), \(p_F(x)\), \(y\).</span>
    <div class="content">
      <p>Soit \(y \in F\). On écrit \(x - y = \big(x - p_F(x)\big) + \big(p_F(x) - y\big)\) : le premier vecteur est dans \(F^\perp\), le second dans \(F\). Par Pythagore,</p>
      <div class="formula">$$\|x - y\|^2 = \|x - p_F(x)\|^2 + \|p_F(x) - y\|^2 \geq \|x - p_F(x)\|^2 ,$$</div>
      <p>avec égalité si et seulement si \(y = p_F(x)\). La borne inférieure est donc atteinte, en ce seul point. La seconde formule est Pythagore pour \(x = p_F(x) + (x - p_F(x))\), et \(\|p_F(x)\|^2 = \sum\langle x, \varepsilon_i\rangle^2\) d'après le §6. Pour un hyperplan, \(x - p_H(x)\) est le projeté sur la droite normale, de norme \(|\langle x, a\rangle| / \|a\|\).</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Méthode — ramener un minimum à une projection</strong>
    <ol>
      <li>Reconnaître la quantité à minimiser comme un carré de norme \(\|x - y\|^2\) : identifier l'espace \(E\), le produit scalaire, le vecteur \(x\) à approcher et le sous-espace \(F\) des approximants \(y\).</li>
      <li>Calculer \(p_F(x)\) (base orthonormée de \(F\) ou système des conditions d'orthogonalité).</li>
      <li>Le minimum vaut \(\|x - p_F(x)\|^2\), atteint uniquement pour \(y = p_F(x)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — meilleure approximation affine de \(t^2\) sur \([0, 1]\)</strong>
    <p>Calculons \(m = \min\limits_{(a, b) \in \mathbb{R}^2}\int_0^1 (t^2 - at - b)^2\,\mathrm{d}t\).</p>
    <ol>
      <li>Cadre : \(E = \mathbb{R}_2[X]\) muni de \(\int_0^1 PQ\), \(x = X^2\), \(F = \mathbb{R}_1[X]\). La quantité vaut \(\|X^2 - (aX + b)\|^2\) avec \(aX + b\) qui décrit \(F\) : \(m = d(X^2, F)^2\).</li>
      <li>Base orthonormée de \(F\) : \((\varepsilon_0, \varepsilon_1)\) du §5. Avec les coordonnées du §6, \(p_F(X^2) = \frac13 + \frac12(2X - 1)\), soit \(X - \frac16\).</li>
      <li>Minimum : \(m = \|X^2\|^2 - \|p_F(X^2)\|^2\), soit \(\frac15 - \frac19 - \frac{1}{12} = \frac{1}{180}\), atteint pour \(a = 1\) et \(b = -\frac16\) seulement.</li>
      <li>Contrôle : \(m\) est aussi le carré de la coordonnée de \(X^2\) selon \(\varepsilon_2\), \(\big(\frac{\sqrt5}{30}\big)^2 = \frac{1}{180}\).</li>
    </ol>
  </div>

  <h3>Moindres carrés et droite de régression</h3>
  <p>On a mesuré \(n\) couples \((x_i, y_i)\) et l'on cherche la droite \(y = ax + b\) qui rend minimale la somme des carrés des écarts verticaux \(S(a, b) = \sum_{i=1}^n (y_i - ax_i - b)^2\). Dans \(\mathbb{R}^n\) canonique, avec \(X = (x_i)\), \(U = (1, \ldots, 1)\) et \(Y = (y_i)\), on a \(S(a, b) = \|Y - (aX + bU)\|^2\) : le minimum est atteint quand \(aX + bU\) est le projeté orthogonal de \(Y\) sur \(\operatorname{Vect}(X, U)\). Les conditions \(\langle Y - aX - bU, X\rangle = 0\) et \(\langle Y - aX - bU, U\rangle = 0\) donnent les <strong>équations normales</strong> :</p>
  <div class="formula" data-nom="Équations normales (droite des moindres carrés)">$$\begin{cases} a\sum x_i^2 + b\sum x_i = \sum x_iy_i \\ a\sum x_i + nb = \sum y_i \end{cases}$$</div>
  <p>Matriciellement, avec \(A = (X \mid U)\) et la colonne \(\Theta\) des inconnues \(a\), \(b\), elles s'écrivent \(A^\top A\,\Theta = A^\top Y\) : c'est le calcul fait par une régression linéaire en TP (<code>numpy.polyfit</code> en Python).</p>
  <div class="method-box">
    <strong>Exemple — quatre mesures</strong>
    <p>Points \((0, 1)\), \((1, 2)\), \((2, 2)\), \((3, 4)\).</p>
    <ol>
      <li>Sommes : \(n = 4\), \(\sum x_i = 6\), \(\sum x_i^2 = 14\), \(\sum y_i = 9\), \(\sum x_iy_i = 18\).</li>
      <li>Système : \(14a + 6b = 18\) et \(6a + 4b = 9\), d'où \(a = b = 0{,}9\).</li>
      <li>Résidus \(y_i - 0{,}9x_i - 0{,}9\) : \(0{,}1\) ; \(0{,}2\) ; \(-0{,}7\) ; \(0{,}4\). Leur somme est nulle (orthogonalité à \(U\)) et \(\sum x_i r_i = 0 + 0{,}2 - 1{,}4 + 1{,}2 = 0\) (orthogonalité à \(X\)).</li>
      <li>Minimum : la somme des carrés des résidus vaut \(S = 0{,}7\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Quelques prolongements</h2>
  <ul>
    <li><strong>Dimension infinie.</strong> Le théorème du §7 exige \(\dim F\) finie. Dans \(\mathcal{C}([0, 1], \mathbb{R})\) muni de \(\int_0^1 fg\), le sous-espace des fonctions polynomiales a un orthogonal réduit à \(\{0\}\) (conséquence du théorème d'approximation de Weierstrass), sans être égal à l'espace entier : \(F \oplus F^\perp \neq E\).</li>
    <li><strong>Séries de Fourier.</strong> Projeter une fonction \(2\pi\)-périodique sur \(\operatorname{Vect}(c_0, c_1, s_1, \ldots, c_n, s_n)\) (§4) donne sa somme partielle de Fourier : c'est la meilleure approximation en moyenne quadratique par un polynôme trigonométrique de degré \(n\). L'inégalité \(\|p_F(x)\| \leq \|x\|\) devient l'inégalité de Bessel, puis l'égalité de Parseval.</li>
    <li><strong>Polynômes orthogonaux.</strong> Gram-Schmidt appliqué à \((1, X, X^2, \ldots)\) pour \(\int_{-1}^1 PQ\) donne (à normalisation près) les polynômes de Legendre ; ceux du §5 en sont la version sur \([0, 1]\). Ils servent aux méthodes d'intégration numérique de Gauss.</li>
    <li><strong>Espaces préhilbertiens complexes.</strong> Sur \(\mathbb{C}^n\), on utilise \(\langle x, y\rangle = \sum \overline{x_i}\,y_i\) (produit scalaire hermitien) ; Cauchy-Schwarz et Gram-Schmidt s'y adaptent.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="phb-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ESPACES PRÉHILBERTIENS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles : reconnaître un produit scalaire, exploiter Cauchy-Schwarz et les identités remarquables, calculer un orthogonal, orthonormaliser, projeter et en déduire distances et minimums.</div>

  <div class="method-box"><strong>Méthode 1 — Montrer qu'une application est un produit scalaire</strong>
    <ol>
      <li>Vérifier que l'application est bien définie, à valeurs réelles (une intégrale doit exister, par exemple).</li>
      <li>Prouver la symétrie, puis la linéarité par rapport à une seule variable : la bilinéarité s'en déduit.</li>
      <li>Positivité : écrire \(\langle x, x\rangle\) comme une somme de carrés ou comme l'intégrale d'une fonction positive.</li>
      <li>Caractère défini, le seul point délicat : de \(\langle x, x\rangle = 0\), déduire \(x = 0\). Les trois arguments types : une somme de carrés nulle a tous ses termes nuls ; une fonction continue, positive et d'intégrale nulle sur un segment est nulle ; un polynôme qui a plus de racines que son degré est nul.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \(\mathbb{R}_2[X]\), \(\langle P, Q\rangle = P(0)Q(0) + P(1)Q(1) + P(2)Q(2)\) est symétrique, linéaire en \(Q\), et \(\langle P, P\rangle = P(0)^2 + P(1)^2 + P(2)^2 \geq 0\). Si \(\langle P, P\rangle = 0\), le polynôme \(P\), de degré au plus 2, a trois racines 0, 1 et 2 : il est nul. C'est un produit scalaire.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la même formule n'est pas un produit scalaire sur \(\mathbb{R}_3[X]\) : \(X(X - 1)(X - 2)\) est non nul et de « carré » nul. Le caractère défini dépend de l'espace, pas seulement de la formule.</div>

  <div class="method-box"><strong>Méthode 2 — Établir une inégalité avec Cauchy-Schwarz</strong>
    <ol>
      <li>Repérer, dans le membre à majorer, une somme de produits ou l'intégrale d'un produit.</li>
      <li>Préciser l'espace, le produit scalaire et les deux vecteurs \(x\) et \(y\) dont c'est le produit scalaire ; choisir \(y = 1\) (fonction constante, ou vecteur \((1, \ldots, 1)\)) quand on veut majorer une somme ou une intégrale seule.</li>
      <li>Écrire l'inégalité sans racine : \(\langle x, y\rangle^2 \leq \|x\|^2\,\|y\|^2\).</li>
      <li>Cas d'égalité : \(x\) et \(y\) sont colinéaires. Le traduire concrètement (fonction constante, vecteurs proportionnels).</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(x^2 + y^2 + z^2 = 1\), alors \(x + 2y + 2z = \langle (x, y, z), (1, 2, 2)\rangle \leq 1 \times 3 = 3\), avec égalité pour \((x, y, z) = \frac13(1, 2, 2)\) : le maximum de \(x + 2y + 2z\) sur la sphère unité vaut 3.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une majoration ne donne un maximum que si le cas d'égalité est réalisable dans l'ensemble considéré ; et l'on oublie souvent la valeur absolue, \(|\langle x, y\rangle| \leq \|x\|\,\|y\|\), qui fournit aussi une minoration.</div>

  <div class="method-box"><strong>Méthode 3 — Calculer avec les normes : identités remarquables, polarisation</strong>
    <ol>
      <li>Développer par bilinéarité : \(\|x \pm y\|^2 = \|x\|^2 \pm 2\langle x, y\rangle + \|y\|^2\), sans oublier le double produit.</li>
      <li>Pour retrouver un produit scalaire à partir de normes, utiliser la polarisation :
      <div class="formula">$$\langle x, y\rangle = \tfrac12\big(\|x + y\|^2 - \|x\|^2 - \|y\|^2\big) = \tfrac14\big(\|x + y\|^2 - \|x - y\|^2\big).$$</div></li>
      <li>Si la norme est donnée par une expression quadratique, le produit scalaire associé s'obtient en ne gardant, dans \(\frac12\big(N(x + y) - N(x) - N(y)\big)\), que les termes croisés.</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(\|x\| = 2\), \(\|y\| = 3\) et \(\|x + y\| = 4\), alors \(\langle x, y\rangle = \frac{16 - 4 - 9}{2} = \frac32\) et \(\|x - y\|^2 = 4 - 3 + 9 = 10\). Contrôle par l'identité du parallélogramme : \(16 + 10 = 2 \times 4 + 2 \times 9\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Déterminer l'orthogonal d'un sous-espace</strong>
    <ol>
      <li>Choisir une famille génératrice \((f_1, \ldots, f_p)\) de \(F\), la plus simple possible.</li>
      <li>Écrire \(x \in F^\perp \iff \langle x, f_j\rangle = 0\) pour tout \(j\) : c'est un système linéaire homogène de \(p\) équations.</li>
      <li>Le résoudre et donner une base de \(F^\perp\) ; en dimension finie \(n\), contrôler \(\dim F^\perp = n - \dim F\).</li>
      <li>Cas d'un hyperplan d'équation \(a_1x_1 + \cdots + a_nx_n = 0\) dans une base orthonormée : son orthogonal est la droite dirigée par le vecteur normal \(a = (a_1, \ldots, a_n)\), sans calcul.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}_2[X]\) muni de \(\int_0^1 PQ\), un polynôme est orthogonal aux constantes si et seulement si \(\langle P, 1\rangle = \int_0^1 P = 0\). Cet orthogonal est le plan de base \(\big(X - \frac12, X^2 - \frac13\big)\), de dimension \(2 = 3 - 1\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Orthonormaliser une famille libre (Gram-Schmidt)</strong>
    <ol>
      <li>Normer le premier vecteur : \(\varepsilon_1 = e_1 / \|e_1\|\).</li>
      <li>Pour \(k \geq 2\), retrancher à \(e_k\) ses composantes selon les vecteurs déjà construits, puis normer :
      <div class="formula">$$v_k = e_k - \sum_{i=1}^{k-1}\langle e_k, \varepsilon_i\rangle\,\varepsilon_i, \qquad \varepsilon_k = \frac{v_k}{\|v_k\|}.$$</div></li>
      <li>À chaque étape, vérifier que \(v_k\) est orthogonal aux \(\varepsilon_i\) déjà obtenus : une erreur de calcul se voit aussitôt.</li>
      <li>Variante sans racines carrées : orthogonaliser d'abord avec \(w_k = e_k - \sum_{i \lt k}\frac{\langle e_k, w_i\rangle}{\|w_i\|^2}w_i\), remplacer \(w_k\) par un multiple sans fractions, et ne normer qu'à la fin.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}^4\) canonique, avec \(e_1 = (1, 1, 1, 1)\) et \(e_2 = (1, 1, 0, 0)\) : \(\varepsilon_1 = \frac12(1, 1, 1, 1)\), \(\langle e_2, \varepsilon_1\rangle = 1\), \(v_2 = e_2 - \varepsilon_1 = \frac12(1, 1, -1, -1)\), déjà unitaire : \(\varepsilon_2 = v_2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : retrancher \(\langle e_k, e_i\rangle e_i\) (vecteurs de départ) au lieu de \(\langle e_k, \varepsilon_i\rangle\varepsilon_i\), ou des \(w_i\) non normés sans diviser par \(\|w_i\|^2\). Le résultat dépend de l'ordre des vecteurs de départ.</div>

  <div class="method-box"><strong>Méthode 6 — Calculer dans une base orthonormée</strong>
    <ol>
      <li>Obtenir les coordonnées par produits scalaires : dans une base orthonormée \((e_1, \ldots, e_n)\), \(x_i = \langle x, e_i\rangle\), sans système à résoudre.</li>
      <li>Calculer produit scalaire et norme comme dans \(\mathbb{R}^n\) canonique : \(\langle x, y\rangle = \sum x_iy_i = X^\top Y\) et \(\|x\|^2 = \sum x_i^2\).</li>
      <li>Contrôler un calcul de coordonnées en comparant \(\sum x_i^2\) à \(\|x\|^2\) calculée directement.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}^2\) canonique, \(u_1 = \frac{1}{\sqrt2}(1, 1)\) et \(u_2 = \frac{1}{\sqrt2}(1, -1)\) forment une base orthonormée. Pour \(x = (3, 1)\), les coordonnées sont \(\langle x, u_1\rangle = 2\sqrt2\) et \(\langle x, u_2\rangle = \sqrt2\) ; contrôle : \(8 + 2 = 10 = \|x\|^2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : ces formules sont fausses dans une base qui n'est pas orthonormée ; une base seulement orthogonale demande de diviser par \(\|e_i\|^2\) : \(x_i = \langle x, e_i\rangle / \|e_i\|^2\).</div>

  <div class="method-box"><strong>Méthode 7 — Calculer un projeté orthogonal</strong>
    <ol>
      <li><strong>Avec une base orthonormée</strong> \((\varepsilon_1, \ldots, \varepsilon_p)\) de \(F\) (au besoin par Gram-Schmidt) : \(p_F(x) = \sum_{i=1}^p\langle x, \varepsilon_i\rangle\varepsilon_i\) ; sur une droite \(\operatorname{Vect}(a)\), \(p(x) = \frac{\langle x, a\rangle}{\|a\|^2}\,a\).</li>
      <li><strong>Par un système</strong>, avec une famille génératrice quelconque \((f_1, \ldots, f_p)\) de \(F\) : chercher \(p = \sum_j\lambda_jf_j\) et écrire \(\langle x - p, f_i\rangle = 0\) pour chaque \(i\), soit
      <div class="formula">$$\sum_{j=1}^p\lambda_j\,\langle f_j, f_i\rangle = \langle x, f_i\rangle \quad (1 \leq i \leq p).$$</div></li>
      <li><strong>Par l'orthogonal</strong>, quand \(F^\perp\) est petit : \(p_F(x) = x - p_{F^\perp}(x)\) ; pour un hyperplan \(H\) de vecteur normal \(a\), \(p_H(x) = x - \frac{\langle x, a\rangle}{\|a\|^2}\,a\).</li>
      <li>Contrôler : \(p_F(x) \in F\), \(x - p_F(x)\) orthogonal à chaque \(f_i\), et \(\|p_F(x)\| \leq \|x\|\).</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}^3\), le plan \(H\) d'équation \(x + y + z = 0\) a pour vecteur normal \(a = (1, 1, 1)\). Pour \(x = (1, 2, 3)\), \(\langle x, a\rangle = 6\) et \(\|a\|^2 = 3\), donc \(p_H(x) = (1, 2, 3) - 2(1, 1, 1) = (-1, 0, 1)\), qui vérifie bien l'équation de \(H\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Écrire la matrice d'une projection orthogonale</strong>
    <ol>
      <li>Dans \(\mathbb{R}^n\) canonique, si \(F\) a une base orthonormée de colonnes \(E_1, \ldots, E_p\), la matrice de \(p_F\) est \(\sum_{i=1}^p E_iE_i^\top\) (chaque \(E_iE_i^\top\) est une matrice \(n \times n\)).</li>
      <li>Sur une droite dirigée par la colonne \(A\) : \(\frac{1}{A^\top A}AA^\top\) ; sur l'hyperplan de vecteur normal \(A\) : \(I_n - \frac{1}{A^\top A}AA^\top\).</li>
      <li>Contrôler : la matrice est symétrique, vérifie \(P^2 = P\), et sa trace vaut \(\dim F\).</li>
    </ol>
    <p><em>Exemple éclair :</em> la projection orthogonale sur la droite dirigée par \((1, 2, 2)\) a pour matrice
    </p><div class="formula">$$\frac19\begin{pmatrix} 1 & 2 & 2 \\ 2 & 4 & 4 \\ 2 & 4 & 4\end{pmatrix},$$</div><p>symétrique, de trace \(1 = \dim F\), et le vecteur \((1, 2, 2)\) est invariant.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Calculer une distance, ramener un minimum à une projection</strong>
    <ol>
      <li>Distance à un sous-espace de dimension finie : \(d(x, F) = \|x - p_F(x)\|\) ; avec une base orthonormée de \(F\), \(d(x, F)^2 = \|x\|^2 - \sum\langle x, \varepsilon_i\rangle^2\) ; à un hyperplan de vecteur normal \(a\), \(d(x, H) = \frac{|\langle x, a\rangle|}{\|a\|}\).</li>
      <li>Devant un minimum à calculer, reconnaître la quantité comme un carré de norme \(\|x - y\|^2\) : identifier l'espace, le produit scalaire, le vecteur \(x\) à approcher et le sous-espace \(F\) que décrit \(y\).</li>
      <li>Conclure : le minimum vaut \(d(x, F)^2\), atteint pour \(y = p_F(x)\) et seulement pour lui.</li>
      <li>Moindres carrés : minimiser \(\|Y - A\Theta\|^2\) en \(\Theta\) revient à projeter \(Y\) sur l'image de \(A\), ce qui donne les équations normales \(A^\top A\,\Theta = A^\top Y\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\min_{a \in \mathbb{R}}\int_0^1 (t^2 - at)^2\,\mathrm{d}t\), on projette \(t^2\) sur la droite \(\operatorname{Vect}(t)\) de \(\mathcal{C}([0, 1], \mathbb{R})\) : \(a = \frac{\langle t^2, t\rangle}{\|t\|^2} = \frac{1/4}{1/3} = \frac34\), et le minimum vaut \(\|t^2\|^2 - \frac{\langle t^2, t\rangle^2}{\|t\|^2} = \frac15 - \frac{3}{16} = \frac{1}{80}\).</p>
  </div>
  <div class="notice"><strong>Pièges</strong> : la formule \(p_F(x) = \sum\langle x, \varepsilon_i\rangle\varepsilon_i\) exige une base <strong>orthonormée</strong> de \(F\) ; le théorème de projection exige \(\dim F\) finie ; la distance est la norme de \(x - p_F(x)\), pas celle de \(p_F(x)\).</div>
</div>
</template>
