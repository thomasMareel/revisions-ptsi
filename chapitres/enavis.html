      <h2>Donner son avis et nuancer</h2>
      <div class="intro">À l'oral comme à l'écrit, on attend que tu prennes position <em>et</em> que tu nuances. Voici les briques essentielles.</div>
      <div class="prop-box"><strong>Donner son avis</strong>
        <ul style="margin-top:.3rem">
          <li>In my opinion / To my mind / As far as I'm concerned, …</li>
          <li>I would argue that… / I am convinced that…</li>
          <li>It seems to me that… / I tend to think that…</li>
        </ul>
      </div>
      <div class="prop-box"><strong>Accord / désaccord</strong>
        <ul style="margin-top:.3rem">
          <li>I (totally) agree with… / I couldn't agree more.</li>
          <li>I (strongly) disagree with… / I beg to differ.</li>
          <li>There is some truth in that, but… / Up to a point, yes, however…</li>
        </ul>
      </div>
      <div class="prop-box"><strong>Nuancer / hypothèse</strong>
        <ul style="margin-top:.3rem">
          <li>It might / may / could be the case that…</li>
          <li>To some extent / To a certain degree…</li>
          <li>Admittedly… / That being said… / Then again…</li>
        </ul>
      </div>
