  <div class="q"><strong>Q2.</strong> Calculer l'erreur relative de chaque montage pour \(R = 10\ \Omega\), puis pour \(R = 100\ \text{k}\Omega\). Quel montage choisir dans chaque cas ?</div>
  <div class="q"><strong>Q3.</strong> Montrer que les deux erreurs sont égales pour \(R = \sqrt{R_A R_V}\) et calculer cette valeur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Montage amont : l'ampèremètre mesure exactement le courant \(I\) de \(R\), mais le voltmètre mesure la tension aux bornes de l'ensemble ampèremètre + \(R\), en série : \(U = (R_A + R)\,I\), donc \(R_{\text{mes}} = R + R_A\). Montage aval : le voltmètre mesure exactement la tension de \(R\), mais l'ampèremètre compte aussi le courant du voltmètre, en parallèle sur \(R\) : \(I = U/R + U/R_V\), donc \(R_{\text{mes}} = R \parallel R_V\).</p>
    <p><strong>Q2.</strong> Erreurs relatives : en amont, \(+R_A/R\) ; en aval, \(\dfrac{R \parallel R_V - R}{R} = -\dfrac{R}{R + R_V} \approx -R/R_V\).</p>
    <ul>
      <li>\(R = 10\ \Omega\) : amont \(+10\ \%\) ; aval \(-1\times10^{-6}\). On choisit le montage aval (petite résistance).</li>
      <li>\(R = 100\ \text{k}\Omega\) : amont \(+1\times10^{-5}\) ; aval \(-1{,}0\ \%\) (\(R_{\text{mes}} \approx 99{,}0\ \text{k}\Omega\)). On choisit le montage amont (grande résistance).</li>
    </ul>
    <p><strong>Q3.</strong> \(R_A/R = R/R_V\) pour \(R^2 = R_AR_V\), soit \(R = \sqrt{1{,}0\times10^{7}} \approx 3{,}2\ \text{k}\Omega\). En dessous, montage aval ; au-dessus, montage amont. Dans les deux cas, on retrouve l'idée du cours : l'appareil perturbe peu si sa résistance est négligeable (ampèremètre) ou très grande (voltmètre) devant celle du circuit qu'il voit.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>GBF, oscilloscope et haut-parleur</h3>
  <div class="statement">Un GBF délivre à vide une tension sinusoïdale d'amplitude \(2{,}00\ \text{V}\) (mesurée à l'oscilloscope seul, de résistance d'entrée \(1\ \text{M}\Omega\)). On raisonne sur les amplitudes, comme en continu.</div>
  <div class="q"><strong>Q1.</strong> On branche en sortie une résistance de \(220\ \Omega\) : l'amplitude mesurée tombe à \(1{,}63\ \text{V}\). En déduire la résistance de sortie \(R_s\) du GBF. Pourquoi la mesure « à vide » à l'oscilloscope était-elle légitime ?</div>
  <div class="q"><strong>Q2.</strong> Quelle amplitude obtient-on sur une charge de \(100\ \Omega\) ? Quelle charge minimale faut-il pour conserver au moins 95 % de la tension à vide ?</div>
  <div class="q"><strong>Q3.</strong> Un amplificateur audio a une résistance de sortie de \(0{,}05\ \Omega\) ; il alimente un haut-parleur de \(8\ \Omega\). Quelle fraction de sa tension à vide le haut-parleur reçoit-il ? Pourquoi ne branche-t-on pas directement le haut-parleur sur le GBF ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Diviseur de tension entre \(R_s\) et la charge \(R\) : \(U = E_s\,\dfrac{R}{R + R_s}\), d'où</p><div class="formula">$$R_s = R\left(\frac{E_s}{U} - 1\right) = 220\times\left(\frac{2{,}00}{1{,}63} - 1\right) \approx 50\ \Omega$$</div><p>À vide, l'oscilloscope (\(1\ \text{M}\Omega = 2\times10^{4}\,R_s\)) ne prélève pratiquement pas de courant : il mesure \(E_s\) à \(5\times10^{-5}\) près.</p>
    <p><strong>Q2.</strong> Sur \(100\ \Omega\) : \(U = 2{,}00\times100/150 \approx 1{,}33\ \text{V}\). Pour \(U \geq 0{,}95\,E_s\), il faut \(\dfrac{R}{R + R_s} \geq 0{,}95\), soit \(R \geq 19\,R_s \approx 950\ \Omega\).</p>
    <p><strong>Q3.</strong> \(8/8{,}05 \approx 0{,}994\) : 99,4 % de la tension à vide. Sur le GBF, le haut-parleur ne recevrait que \(8/58 \approx 14\ \%\) de la tension à vide, et l'essentiel de la puissance serait perdu dans les \(50\ \Omega\) internes : un amplificateur de puissance sert précisément à fournir le signal avec une très petite résistance de sortie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Point de fonctionnement d'une lampe</h3>
  <div class="statement">Une source de f.é.m. \(E = 6{,}0\ \text{V}\) et de résistance interne \(r = 10\ \Omega\) alimente une petite lampe à incandescence (6 V ; 0,30 A), dipôle non linéaire dont la caractéristique, en convention récepteur, est donnée ci-dessous.
    <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
      <tr><th>\(u\) (V)</th><td>1,0</td><td>2,0</td><td>3,0</td><td>3,5</td><td>4,0</td><td>5,0</td><td>6,0</td></tr>
      <tr><th>\(i\) (A)</th><td>0,102</td><td>0,155</td><td>0,198</td><td>0,217</td><td>0,235</td><td>0,269</td><td>0,300</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>Q1.</strong> Écrire la caractéristique de la source, en convention générateur, sous la forme \(i = f(u)\). Pour chaque valeur de \(u\) du tableau, comparer le courant que la source peut débiter à celui que demande la lampe ; encadrer le point de fonctionnement.</div>
  <div class="q"><strong>Q2.</strong> Un calcul plus fin (ou un tracé) donne \(u \approx 3{,}74\ \text{V}\). En déduire le courant, la puissance reçue par la lampe et sa résistance en fonctionnement. Comparer à ses valeurs nominales.</div>
  <div class="q"><strong>Q3.</strong> On branche une seconde lampe identique en parallèle sur la première. Écrire l'équation du nouveau point de fonctionnement. La tension aux bornes des lampes augmente-t-elle ou diminue-t-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u = E - ri\) donne \(i = (E - u)/r = (6{,}0 - u)/10\). À \(u = 3{,}5\ \text{V}\), la source débiterait \(0{,}25\ \text{A}\), plus que les \(0{,}217\ \text{A}\) de la lampe ; à \(u = 4{,}0\ \text{V}\), elle débiterait \(0{,}20\ \text{A}\), moins que les \(0{,}235\ \text{A}\) de la lampe. Les deux courants sont égaux entre les deux : \(3{,}5\ \text{V} \lt u \lt 4{,}0\ \text{V}\).</p>
    <p><strong>Q2.</strong> \(i = (6{,}0 - 3{,}74)/10 \approx 0{,}226\ \text{A}\). Puissance reçue : \(ui \approx 0{,}85\ \text{W}\), moins de la moitié des \(1{,}8\ \text{W}\) nominaux. Résistance en fonctionnement : \(u/i \approx 16{,}6\ \Omega\), plus faible que la résistance nominale \(6/0{,}30 = 20\ \Omega\) : le filament, moins chaud, est moins résistant. C'est pour cela que la lampe n'est pas une résistance : sa « résistance » dépend du point de fonctionnement.</p>
    <p><strong>Q3.</strong> Les deux lampes reçoivent la même tension \(u\) et demandent chacune \(i_\ell(u)\) : le point de fonctionnement vérifie \(2\,i_\ell(u) = (6{,}0 - u)/10\). Le récepteur demande plus de courant à tension donnée, donc le point descend le long de la droite de la source : la tension diminue (le calcul donne \(u \approx 2{,}5\ \text{V}\), \(0{,}18\ \text{A}\) par lampe). C'est l'effet de la résistance interne : plus on charge la source, plus sa tension baisse.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Réseau résistif : Thévenin et transfert de puissance</h3>
  <div class="statement">
    Une source de tension idéale \(E = 12\ \text{V}\) alimente un réseau : une résistance \(R_1 = 4{,}0\ \Omega\) en série relie la source au nœud A, et une résistance \(R_2 = 4{,}0\ \Omega\) relie A à la masse. On branche une résistance de charge \(R_L\) entre A et la masse.
  </div>
  <p class="exo-part">Partie A — Analyse du réseau</p>
  <div class="q"><strong>A1.</strong> Charge débranchée (\(R_L\) retirée) : calculer la tension \(U_A\) au nœud A (pont diviseur).</div>
  <div class="q"><strong>A2.</strong> Calculer le courant débité par la source lorsque \(R_L = 4{,}0\ \Omega\).</div>
  <p class="exo-part">Partie B — Modèle de Thévenin</p>
  <div class="q"><strong>B1.</strong> Déterminer le générateur de Thévenin (\(E_{\text{th}}\), \(R_{\text{th}}\)) équivalent au réseau vu par la charge \(R_L\).</div>
  <div class="q"><strong>B2.</strong> En déduire le courant \(I\) dans \(R_L\) en fonction de \(R_L\).</div>
  <p class="exo-part">Partie C — Transfert de puissance</p>
  <div class="q"><strong>C1.</strong> Exprimer la puissance \(P\) dissipée dans \(R_L\). Pour quelle valeur de \(R_L\) est-elle maximale ?</div>
  <div class="q"><strong>C2.</strong> Calculer cette puissance maximale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Pont diviseur (aucun courant prélevé en A) : \(U_A = E\dfrac{R_2}{R_1+R_2} = 12\times\dfrac{4}{8} = 6{,}0\ \text{V}\).</p>
    <p><strong>A2.</strong> Avec \(R_L = 4\ \Omega\) en parallèle sur \(R_2\) : \(R_2\parallel R_L = 2{,}0\ \Omega\). Courant débité : \(I_{\text{src}} = \dfrac{E}{R_1 + (R_2\parallel R_L)} = \dfrac{12}{4+2} = 2{,}0\ \text{A}\).</p>
    <p><strong>B1.</strong> \(E_{\text{th}}\) est la tension à vide en A : \(6{,}0\ \text{V}\). \(R_{\text{th}}\) est la résistance vue de A, source éteinte (remplacée par un fil) : \(R_1\parallel R_2 = \dfrac{4\times4}{8} = 2{,}0\ \Omega\).</p>
    <p><strong>B2.</strong> \(I = \dfrac{E_{\text{th}}}{R_{\text{th}}+R_L} = \dfrac{6}{2+R_L}\) (en ampères, \(R_L\) en ohms). Contrôle avec A2 : pour \(R_L = 4\ \Omega\), \(I = 1{,}0\ \text{A}\), la moitié des \(2{,}0\ \text{A}\) débités (diviseur de courant entre deux résistances égales).</p>
    <p><strong>C1.</strong> \(P = R_L I^2 = \dfrac{E_{\text{th}}^2\,R_L}{(R_{\text{th}}+R_L)^2}\). Sa dérivée par rapport à \(R_L\) est du signe de \(R_{\text{th}} - R_L\) : la puissance est maximale pour \(R_L = R_{\text{th}} = 2{,}0\ \Omega\) (adaptation).</p>
    <p><strong>C2.</strong> \(P_{\max} = \dfrac{E_{\text{th}}^2}{4R_{\text{th}}} = \dfrac{36}{8} = 4{,}5\ \text{W}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Réseau en échelle infini — résistance d'entrée et nombre d'or</h3>
  <div class="statement">
    On considère un réseau « en échelle » formé d'une infinité de cellules identiques : chaque cellule comporte une résistance \(R\) <strong>en série</strong> (ligne supérieure) suivie d'une résistance \(R\) <strong>en dérivation</strong> vers la masse. On note \(R_\infty\) la résistance équivalente vue entre l'entrée et la masse.
  </div>
  <p class="exo-part">Partie A — Réseau infini</p>
  <div class="q"><strong>A1.</strong> Le réseau étant infini, justifier qu'« amputer » la première cellule laisse derrière elle une échelle infinie identique, de résistance \(R_\infty\). En déduire la relation d'auto-similarité \(R_\infty = R + \dfrac{R\,R_\infty}{R+R_\infty}\).</div>
  <div class="q"><strong>A2.</strong> Montrer qu'elle équivaut à \(R_\infty^2 - R\,R_\infty - R^2 = 0\). Résoudre et faire apparaître le nombre d'or \(\varphi = \dfrac{1+\sqrt5}{2}\).</div>
  <div class="q"><strong>A3.</strong> Application : \(R = 1{,}0\ \text{k}\Omega\). Calculer \(R_\infty\).</div>
  <p class="exo-part">Partie B — Convergence du réseau fini</p>
  <div class="q"><strong>B1.</strong> On tronque l'échelle à \(n\) cellules (circuit ouvert au-delà de la dernière dérivation) ; \(R_n\) est la résistance vue de l'entrée. Justifier la récurrence \(R_{n+1} = R + \dfrac{R\,R_n}{R+R_n}\) avec \(R_1 = 2R\).</div>
  <div class="q"><strong>B2.</strong> Calculer \(R_2, R_3, R_4\) (en unités de \(R\)). Vérifier que \(R_n\) s'exprime comme un rapport de nombres de Fibonacci et que dès \(n=4\) l'écart à \(R_\infty\) est inférieur à \(0{,}1\,\%\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Ce qui suit la première dérivation est encore une échelle infinie identique, donc de résistance \(R_\infty\). La première cellule est alors \(R\) en série avec l'association parallèle de la dérivation \(R\) et du reste \(R_\infty\) : \(R_\infty = R + (R\parallel R_\infty) = R + \dfrac{R\,R_\infty}{R+R_\infty}\).</p>
    <p><strong>A2.</strong> En multipliant par \((R+R_\infty)\) : \(R_\infty(R+R_\infty) = R(R+R_\infty) + R\,R_\infty\), soit \(R\,R_\infty + R_\infty^2 = R^2 + 2R\,R_\infty\), d'où \(R_\infty^2 - R\,R_\infty - R^2 = 0\). Racine positive : \(R_\infty = R\,\dfrac{1+\sqrt5}{2} = \varphi R\) avec \(\varphi \approx 1{,}618\).</p>
    <p><strong>A3.</strong> \(R_\infty = 1{,}618\ \text{k}\Omega\).</p>
    <p><strong>B1.</strong> Une échelle à \(n+1\) cellules = une cellule (\(R\) série) en tête fermée sur une échelle à \(n\) cellules : \(R_{n+1} = R + (R\parallel R_n)\). Pour une cellule unique (rien après la dérivation), \(R_1 = R + R = 2R\).</p>
    <p><strong>B2.</strong> \(R_2 = R + \dfrac{R\cdot 2R}{3R} = \dfrac{5R}{3} \approx 1{,}667R\) ; \(R_3 = R + \dfrac{R\cdot \frac53 R}{\frac83 R} = \dfrac{13R}{8} = 1{,}625R\) ; \(R_4 = R + \dfrac{R\cdot \frac{13}{8}R}{\frac{21}{8}R} = \dfrac{34R}{21} \approx 1{,}619R\). Les fractions \(\tfrac21,\tfrac53,\tfrac{13}{8},\tfrac{34}{21}\) sont des rapports de termes de Fibonacci (\(2,3,5,8,13,21,34\)), qui convergent vers \(\varphi\). Dès \(n=4\), \(|R_4-\varphi R|/\varphi R \approx 0{,}06\,\%\) : la convergence est très rapide.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Chaîne de mesure d'une température par sonde Pt100</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>électrocinétique en régime continu, capteurs et mesure</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une sonde Pt100 mesure la température \(\theta\) d'une cuve. C'est un fil de platine dont la résistance vaut \(R(\theta) = R_0\,(1 + a\theta)\), avec \(R_0 = 100\ \Omega\), \(a = 3{,}85\times10^{-3}\ ^\circ\text{C}^{-1}\) et \(\theta\) en degrés Celsius. Elle est reliée à une carte d'acquisition par un câble de 15 m dont chaque conducteur, en cuivre (\(\rho = 1{,}7\times10^{-8}\ \Omega\text{·m}\)), a une section de \(0{,}25\ \text{mm}^2\). On raisonne en régime continu.
  </div>
  <p class="exo-part">Partie A — Le câble</p>
  <div class="q"><strong>A1.</strong> La température varie au plus en quelques secondes. Justifier que l'ARQS s'applique au câble.</div>
  <div class="q"><strong>A2.</strong> Calculer la résistance \(r_c\) d'un conducteur du câble. On mesure la résistance de la sonde « en deux fils », à travers les deux conducteurs du câble : quelle erreur sur la température en résulte-t-elle, si l'on n'en tient pas compte ?</div>
  <p class="exo-part">Partie B — Conditionnement par un diviseur de tension</p>
  <p>On place la sonde (câble supposé de résistance négligeable, pour cette partie) en série avec \(R_1 = 1{,}0\ \text{k}\Omega\) sous \(E = 5{,}0\ \text{V}\), et l'on mesure la tension \(u\) aux bornes de la sonde.</p>
  <div class="q"><strong>B1.</strong> Exprimer \(u(\theta)\). Calculer \(u\) à 0 °C et à 100 °C, et la sensibilité moyenne en \(\text{mV}/^\circ\text{C}\).</div>
  <div class="q"><strong>B2.</strong> On convertit \(u\) en température en supposant \(u\) affine en \(\theta\) entre ces deux points. Quelle erreur commet-on à 50 °C ?</div>
  <div class="q"><strong>B3.</strong> Le courant qui traverse la sonde l'échauffe : sa température dépasse celle de la cuve de \(0{,}20\ ^\circ\text{C}\) par milliwatt reçu. Calculer cet auto-échauffement. Que se passe-t-il si l'on prend \(R_1 = 10\ \text{k}\Omega\) ?</div>
  <p class="exo-part">Partie C — Liaison à la carte d'acquisition</p>
  <div class="q"><strong>C1.</strong> Vu de la carte, le diviseur est un générateur de Thévenin. Calculer sa résistance de sortie (à 0 °C).</div>
  <div class="q"><strong>C2.</strong> Évaluer l'erreur, en volts puis en degrés, introduite par une carte de résistance d'entrée \(1\ \text{M}\Omega\), puis par une carte de \(10\ \text{k}\Omega\).</div>
  <p class="exo-part">Partie D — Mesure en quatre fils</p>
  <p>Pour s'affranchir du câble, on utilise quatre conducteurs : deux amènent le courant d'une source idéale de courant \(\eta = 1{,}0\ \text{mA}\), deux autres relient les bornes de la sonde à un voltmètre de résistance d'entrée \(10\ \text{M}\Omega\).</p>

  <div class="q"><strong>D1.</strong> Évaluer le courant dans les conducteurs de mesure et la tension perdue à leurs bornes. En déduire que le voltmètre mesure \(u = R(\theta)\,\eta\).</div>
  <div class="q"><strong>D2.</strong> Calculer \(u\) à 0 °C et la sensibilité. Le résultat dépend-il de \(r_c\) ? de la valeur de la tension aux bornes de la source de courant ?</div>
  <div class="q"><strong>D3.</strong> Calculer l'auto-échauffement à 0 °C et conclure sur les avantages de ce montage.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Fréquences en jeu inférieures à 1 Hz : \(\lambda = c/f \geq 3\times10^{8}\ \text{m}\), à comparer à 15 m. L'ARQS (et même le régime continu) s'applique sans discussion.</p>
    <p><strong>A2.</strong> Résistance d'un conducteur :</p><div class="formula">$$r_c = \frac{\rho\,\ell}{S} = \frac{1{,}7\times10^{-8}\times15}{0{,}25\times10^{-6}} \approx 1{,}0\ \Omega$$</div><p>En deux fils, on mesure \(R(\theta) + 2r_c\), soit \(2{,}0\ \Omega\) de trop. Or \(R\) varie de \(R_0 a = 0{,}385\ \Omega\) par degré : l'erreur est de \(2{,}04/0{,}385 \approx 5{,}3\ ^\circ\text{C}\). Inacceptable pour un capteur précis au dixième de degré.</p>
    <p><strong>B1.</strong> Diviseur de tension (la carte supposée idéale ne prélève rien) : \(u = E\,\dfrac{R(\theta)}{R_1 + R(\theta)}\). À 0 °C : \(5{,}0\times100/1\,100 \approx 0{,}455\ \text{V}\) ; à 100 °C, \(R = 138{,}5\ \Omega\) et \(u \approx 0{,}608\ \text{V}\). Sensibilité moyenne : \(153\ \text{mV}/100\ ^\circ\text{C} \approx 1{,}54\ \text{mV}/^\circ\text{C}\).</p>
    <p><strong>B2.</strong> À 50 °C, \(R = 119{,}25\ \Omega\) et \(u = 0{,}5327\ \text{V}\) ; l'interpolation affine donne \(0{,}5314\ \text{V}\). L'écart, \(1{,}3\ \text{mV}\), correspond à \(0{,}86\ ^\circ\text{C}\) : le diviseur n'est pas linéaire en \(R\) (\(R\) figure aussi au dénominateur). Il faut un étalonnage en plusieurs points, ou un autre montage.</p>
    <p><strong>B3.</strong> \(i = E/(R_1 + R) \approx 4{,}5\ \text{mA}\) à 0 °C, d'où \(P = Ri^2 \approx 2{,}1\ \text{mW}\) et un auto-échauffement de \(0{,}41\ ^\circ\text{C}\) : la sonde mesure sa propre température, faussée par l'effet Joule. Avec \(R_1 = 10\ \text{k}\Omega\) : \(i \approx 0{,}50\ \text{mA}\), \(P \approx 0{,}025\ \text{mW}\), échauffement \(0{,}005\ ^\circ\text{C}\), négligeable ; mais la sensibilité tombe à \(0{,}19\ \text{mV}/^\circ\text{C}\), environ huit fois moins.</p>
    <p><strong>C1.</strong> Source éteinte, la carte voit \(R_1\parallel R = \dfrac{1\,000\times100}{1\,100} \approx 91\ \Omega\).</p>
    <p><strong>C2.</strong> \(u_{\text{lu}} = u\,\dfrac{R_e}{R_e + R_s}\), soit une baisse d'environ \(u\,R_s/R_e\). Avec \(R_e = 1\ \text{M}\Omega\) : \(0{,}455\times91/10^{6} \approx 41\ \mu\text{V}\), soit \(0{,}03\ ^\circ\text{C}\) : négligeable. Avec \(R_e = 10\ \text{k}\Omega\) : \(4{,}1\ \text{mV}\), soit \(2{,}7\ ^\circ\text{C}\) : inacceptable. La résistance d'entrée de la carte doit être très grande devant la résistance de sortie du conditionneur.</p>
    <p><strong>D1.</strong> Les conducteurs de mesure sont en série avec le voltmètre : ils sont parcourus par \(u/R_V \approx 0{,}1/10^{7} = 10^{-8}\ \text{A}\), et la tension à leurs bornes vaut \(r_c\times10^{-8} \approx 10^{-8}\ \text{V}\), totalement négligeable. Loi des mailles le long de « sonde → conducteur → voltmètre → conducteur » : le voltmètre lit la tension aux bornes mêmes de la sonde, traversée par \(\eta\) (le courant de mesure, \(10^{-8}\ \text{A}\), est négligeable devant \(\eta\)) : \(u = R(\theta)\,\eta\).</p>
    <p><strong>D2.</strong> À 0 °C : \(u = 100\times1{,}0\times10^{-3} = 0{,}100\ \text{V}\) ; sensibilité \(R_0 a\eta = 0{,}385\ \text{mV}/^\circ\text{C}\), et \(u\) est cette fois rigoureusement affine en \(\theta\). Le résultat ne dépend ni de \(r_c\) ni de la tension aux bornes de la source : une source idéale de courant impose \(\eta\) quelle que soit la résistance du circuit (elle développe simplement \((R + 2r_c)\,\eta\)).</p>
    <p><strong>D3.</strong> \(P = R\eta^2 = 100\times10^{-6} = 0{,}1\ \text{mW}\), soit \(0{,}02\ ^\circ\text{C}\). Bilan : le montage quatre fils élimine l'erreur de câble (5,3 °C), donne une tension proportionnelle à \(R\) (pas de non-linéarité), avec un auto-échauffement faible ; il demande une source de courant stable et un voltmètre de grande résistance d'entrée. C'est le montage des thermomètres de laboratoire et de l'industrie.</p>
