  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 1.2 « Signaux électriques dans l'ARQS » du programme de PTSI (premier semestre) : il pose le vocabulaire, les conventions et les lois de toute l'électrocinétique. Les relations du condensateur et de la bobine, leurs ordres de grandeur et leurs énergies, qui font aussi partie de 1.2, sont traités au début du chapitre suivant, « Circuit linéaire du premier ordre », où ils servent aussitôt. Les chapitres « Circuit RLC série », « Signaux périodiques et spectres » et « Filtres » s'appuient sur ce socle sans le refaire.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Potentiel, référence de potentiel, tension</strong> ; citer des ordres de grandeur de tensions dans différents domaines (§2).</li>

<div class="course-section">
  <div class="sec-num">§1 · CHARGE ET COURANT</div>
  <h2>Le courant est un débit de charge</h2>
  <div class="intro">Un circuit électrique transporte de la charge : des électrons dans les métaux, des ions dans les solutions et les batteries. L'intensité mesure le débit de cette charge. Avant de l'utiliser comme une grandeur continue, il faut s'assurer que la nature « en grains » de la charge ne se voit pas.</div>
  <div class="def-box">
    <strong>Charge électrique.</strong> La charge d'un système est un multiple entier de la <strong>charge élémentaire</strong> \(e = 1{,}602\times10^{-19}\ \text{C}\) (un électron porte \(-e\), un proton \(+e\)) : elle est <strong>quantifiée</strong>. Elle est aussi <strong>conservée</strong> : la charge d'un système fermé ne varie pas, elle ne peut que se déplacer.
  </div>
  <div class="def-box">
    <strong>Intensité du courant.</strong> À travers une section orientée d'un conducteur, si la charge \(\mathrm{d}q\) traverse la section dans le sens choisi pendant \(\mathrm{d}t\), l'intensité est
    <div class="formula" data-nom="Intensité du courant">$$i = \frac{\mathrm{d}q}{\mathrm{d}t}$$</div>
    en ampères (\(1\ \text{A} = 1\ \text{C·s}^{-1}\)). C'est une grandeur <strong>algébrique</strong> : \(i \gt 0\) si les charges positives avancent dans le sens de la flèche (ou les électrons en sens inverse), \(i \lt 0\) sinon.
  </div>
  <h3>Pourquoi des grandeurs continues ?</h3>
  <p>Un courant de \(1\ \mu\text{A}\), très faible, correspond à \(10^{-6}/(1{,}6\times10^{-19}) \approx 6\times10^{12}\) électrons par seconde. Même pendant \(1\ \mu\text{s}\), il en passe encore \(6\times10^{6}\) : ajouter ou retirer un électron change la charge transportée de \(2\times10^{-7}\) en valeur relative, bien en dessous de toute précision de mesure. La quantification est donc invisible à l'échelle des circuits, et l'on traite \(q\) et \(i\) comme des grandeurs continues, dérivables.</p>
  <h3>Ordres de grandeur des intensités</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Situation</th><th style="text-align:left">Intensité</th></tr>
    <tr><td>capteur, entrée d'un appareil de mesure</td><td>du nA au µA</td></tr>
    <tr><td>diode électroluminescente</td><td>10 à 20 mA</td></tr>
    <tr><td>circuit de TP</td><td>du mA à quelques centaines de mA</td></tr>
    <tr><td>charge d'un téléphone (5 V)</td><td>1 à 3 A</td></tr>
    <tr><td>bouilloire, radiateur (230 V)</td><td>environ 10 A (un disjoncteur domestique coupe à 16 ou 20 A)</td></tr>
    <tr><td>démarreur d'une voiture</td><td>100 à 300 A</td></tr>
    <tr><td>caténaire d'un TGV (25 kV)</td><td>quelques centaines d'ampères</td></tr>
    <tr><td>coup de foudre</td><td>10 à 100 kA, pendant quelques dizaines de µs</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — électrons dans un fil de cuivre</strong>
    <p>Un fil de cuivre de section \(S = 1{,}5\ \text{mm}^2\) est parcouru par \(I = 0{,}50\ \text{A}\). Le cuivre compte \(n = 8{,}5\times10^{28}\) électrons libres par mètre cube.</p>
    <ol>
      <li>Nombre d'électrons qui traversent une section par seconde : \(I/e = 0{,}50/(1{,}602\times10^{-19}) \approx 3{,}1\times10^{18}\ \text{s}^{-1}\).</li>
      <li>Pendant \(\mathrm{d}t\), les électrons qui traversent la section sont ceux d'un cylindre de longueur \(v\,\mathrm{d}t\), où \(v\) est leur vitesse moyenne d'ensemble : \(\mathrm{d}q = n e S v\,\mathrm{d}t\), d'où \(I = neSv\).</li>
      <li>D'où la vitesse d'ensemble des électrons : <div class="formula">$$v = \frac{I}{neS} = \frac{0{,}50}{8{,}5\times10^{28}\times1{,}602\times10^{-19}\times1{,}5\times10^{-6}} \approx 2{,}4\times10^{-5}\ \text{m·s}^{-1}$$</div> soit environ 9 cm par heure.</li>
      <li>Pourtant la lampe s'allume dès qu'on ferme l'interrupteur : ce n'est pas l'électron qui voyage de l'interrupteur à la lampe, c'est la mise en mouvement de tous les électrons, transmise par le champ électrique à une vitesse proche de celle de la lumière (§3).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la « capacité » d'une batterie est une charge</strong>
    <p>Une batterie de téléphone annonce 3 000 mAh. C'est la charge qu'elle peut faire circuler : \(Q = I\,\Delta t = 3{,}0\ \text{A}\times3\,600\ \text{s} = 1{,}08\times10^{4}\ \text{C}\), soit \(Q/e \approx 6{,}7\times10^{22}\) électrons. Elle peut débiter 3,0 A pendant une heure, ou 300 mA pendant dix heures. Plus généralement, la charge transportée entre \(t_1\) et \(t_2\) est \(q = \displaystyle\int_{t_1}^{t_2} i\,\mathrm{d}t\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre le sens du courant et le sens de déplacement des électrons. Le sens conventionnel du courant est celui du déplacement des charges positives ; dans un métal, les électrons se déplacent en sens inverse de \(i\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · POTENTIEL ET TENSION</div>
  <h2>Une différence de potentiel, mesurée entre deux points</h2>
  <div class="intro">Chaque point d'un circuit a un potentiel électrique \(V\), défini à une constante près. Seules les différences de potentiel, les tensions, ont un sens physique : c'est ce que mesure un voltmètre, branché entre deux points.</div>
  <div class="def-box">
    <strong>Tension.</strong> La tension entre les points A et B est \(u_{AB} = V_A - V_B\) (en volts). Sur un schéma, on la représente par une flèche <strong>dirigée vers A</strong>, la première lettre. Elle est algébrique : \(u_{BA} = -u_{AB}\).
  </div>
  <div class="def-box">
    <strong>Référence de potentiel.</strong> On choisit un point du circuit, la <strong>masse</strong>, auquel on attribue le potentiel \(V = 0\) ; le potentiel d'un point est alors la tension entre ce point et la masse. En TP, la masse des appareils (GBF, oscilloscope) est en général reliée à la terre par la prise : toutes les masses d'un montage sont donc au même potentiel, et il faut les brancher au même point.
  </div>
  <div class="prop-box">
    <strong>Additivité des tensions.</strong> Pour trois points quelconques, \(u_{AC} = u_{AB} + u_{BC}\), puisque \(V_A - V_C = (V_A - V_B) + (V_B - V_C)\). C'est l'origine de la loi des mailles (§5).
  </div>
  <h3>Ordres de grandeur des tensions</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Situation</th><th style="text-align:left">Tension</th></tr>
    <tr><td>électrocardiogramme (à la surface de la peau), thermocouple</td><td>du µV au mV</td></tr>
    <tr><td>potentiel d'action d'un neurone</td><td>environ 100 mV</td></tr>
    <tr><td>pile alcaline ; batterie lithium-ion ; prise USB</td><td>1,5 V ; 3,7 V ; 5 V</td></tr>
    <tr><td>batterie de voiture</td><td>12 V</td></tr>
    <tr><td>secteur (valeur efficace)</td><td>230 V</td></tr>
    <tr><td>caténaire de TGV ; ligne à très haute tension</td><td>25 kV ; 400 kV</td></tr>
    <tr><td>entre un nuage d'orage et le sol</td><td>de l'ordre de 100 MV</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — changer de référence ne change pas les tensions</strong>
    <p>Dans un montage, la masse M est à \(0\ \text{V}\), le point A à \(9{,}0\ \text{V}\) et le point B à \(6{,}0\ \text{V}\).</p>
    <ol>
      <li>\(u_{AB} = V_A - V_B = 3{,}0\ \text{V}\), \(u_{BM} = 6{,}0\ \text{V}\), et \(u_{AM} = u_{AB} + u_{BM} = 9{,}0\ \text{V}\) : l'additivité est vérifiée.</li>
      <li>On prend maintenant B comme référence : \(V'_B = 0\), donc \(V'_A = 3{,}0\ \text{V}\) et \(V'_M = -6{,}0\ \text{V}\). Tous les potentiels ont baissé de \(6{,}0\ \text{V}\).</li>
      <li>Les tensions sont inchangées : \(u_{AB} = 3{,}0 - 0 = 3{,}0\ \text{V}\), \(u_{BM} = 0 - (-6{,}0) = 6{,}0\ \text{V}\). Un potentiel dépend de la référence, une tension non.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : brancher l'oscilloscope « n'importe où ». Sa masse étant reliée à celle du GBF par la terre, placer la masse de l'oscilloscope en un point du circuit qui n'est pas la masse du GBF court-circuite tout ce qui se trouve entre ces deux points.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · L'APPROXIMATION DES RÉGIMES QUASI STATIONNAIRES</div>
  <h2>Quand peut-on oublier la propagation ?</h2>
  <div class="intro">Fermer un interrupteur ne met pas instantanément tout le circuit en mouvement : la perturbation électromagnétique se propage, à une célérité \(c\) proche de celle de la lumière (\(3\times10^{8}\ \text{m·s}^{-1}\) dans le vide, environ \(2\times10^{8}\ \text{m·s}^{-1}\) dans un câble). Si cette propagation est assez rapide devant les variations des signaux, tout se passe comme si elle était instantanée : c'est l'ARQS, cadre de toute l'électrocinétique de PTSI.</div>
  <div class="prop-box">
    <strong>Condition de l'ARQS.</strong> Pour un circuit de taille \(L\) parcouru par des signaux de fréquence \(f\) (période \(T = 1/f\)), l'approximation des régimes quasi stationnaires est valable si la durée de propagation d'un bout à l'autre du circuit est très petite devant la période :
    <div class="formula" data-nom="Condition de l'ARQS">$$\frac{L}{c} \ll T \quad\Longleftrightarrow\quad L \ll \lambda = \frac{c}{f}$$</div>
    c'est-à-dire si le circuit est petit devant la longueur d'onde associée à la fréquence des signaux. En pratique, on la considère comme satisfaite si \(L \lt \lambda/10\).
  </div>
  <div class="prop-box">
    <strong>Conséquences.</strong> Dans l'ARQS, à chaque instant :
    <ul>
      <li>l'intensité est la même en tout point d'une branche (aucune charge ne s'accumule le long d'un fil) : deux dipôles en série sont traversés par le même courant ;</li>
      <li>les lois de Kirchhoff (§5) s'appliquent aux valeurs instantanées \(u(t)\) et \(i(t)\), exactement comme en régime continu.</li>
    </ul>
    Le régime continu (grandeurs constantes) est le cas limite \(f = 0\) : l'ARQS y est toujours valable.
  </div>

  <div class="method-box">
    <strong>Exemple — trois circuits, trois verdicts</strong>
    <ol>
      <li>Circuit de TP, \(L = 1\ \text{m}\) : durée de propagation \(L/c = 1/(3\times10^{8}) \approx 3{,}3\ \text{ns}\). À \(f = 1\ \text{MHz}\) (\(T = 1\ \mu\text{s}\)), le rapport vaut \(3\times10^{-3}\) : ARQS largement valable. À \(100\ \text{MHz}\) (\(T = 10\ \text{ns}\)), il vaut \(0{,}33\) : l'ARQS ne l'est plus.</li>
      <li>Réseau électrique à \(50\ \text{Hz}\) : \(\lambda = 3\times10^{8}/50 = 6\,000\ \text{km}\). Une maison (\(L \approx 20\ \text{m}\)) est en ARQS sans discussion ; une ligne de \(1\,000\ \text{km}\) représente déjà \(\lambda/6\) : les ingénieurs des réseaux doivent y tenir compte de la propagation.</li>
      <li>Wi-Fi à \(2{,}4\ \text{GHz}\) : \(\lambda = 12{,}5\ \text{cm}\). L'antenne, de quelques centimètres, n'est pas en ARQS ; c'est même voulu, une antenne rayonne parce que le courant n'y est pas uniforme.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : relier l'ARQS à la vitesse des électrons. Ils avancent de quelques centimètres par heure (§1) ; ce qui se propage à une vitesse proche de \(c\), c'est le signal, c'est-à-dire la modification du champ électrique qui met en mouvement les électrons du circuit entier.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CONVENTIONS ET PUISSANCE</div>
  <h2>Orienter, puis savoir qui reçoit l'énergie</h2>
  <div class="intro">Les flèches de courant et de tension se choisissent librement ; le calcul donne ensuite des valeurs algébriques, dont le signe dit ce qui se passe réellement. Deux façons standard d'orienter la tension d'un dipôle par rapport à son courant fixent la signification du produit \(ui\).</div>

<figcaption>Pour un même dipôle D parcouru par \(i\) de A vers B, deux façons d'orienter la tension. En convention récepteur, \(u = u_{AB} = V_A - V_B\) (flèche vers A, opposée à \(i\)) et \(ui\) est la puissance que le dipôle reçoit ; en convention générateur, \(u = u_{BA}\) (flèche de même sens que \(i\)) et \(ui\) est la puissance qu'il fournit. Le signe du résultat dit ensuite ce qui se passe réellement.</figcaption>
</figure>
  <div class="def-box">
    <strong>Conventions.</strong> Pour un dipôle traversé par le courant \(i\) :
    <ul>
      <li><strong>convention récepteur</strong> : flèches de \(u\) et de \(i\) de sens opposés ; on l'utilise d'ordinaire pour les résistances, condensateurs, bobines ;</li>
      <li><strong>convention générateur</strong> : flèches de même sens ; on l'utilise d'ordinaire pour les sources.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Puissance électrique.</strong> La puissance électrique reçue par un dipôle en convention récepteur est
    <div class="formula" data-nom="Puissance reçue (convention récepteur)">$$P = u\,i$$</div>
    en watts. En convention générateur, le même produit \(ui\) est la puissance <strong>fournie</strong> au reste du circuit. Dans les deux cas, un résultat négatif signifie l'inverse (un dipôle qui « reçoit » une puissance négative en fournit). L'énergie reçue entre \(t_1\) et \(t_2\) est \(W = \displaystyle\int_{t_1}^{t_2} P\,\mathrm{d}t\) ; on l'exprime souvent en kilowattheures (\(1\ \text{kWh} = 3{,}6\ \text{MJ}\)).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Justification</span><span class="prompt">Pourquoi \(ui\) est une puissance</span><div class="content">
    <p>Pendant \(\mathrm{d}t\), la charge \(\mathrm{d}q = i\,\mathrm{d}t\) entre dans le dipôle par la borne A et en sort par la borne B (convention récepteur, \(u = V_A - V_B\)). Passer du potentiel \(V_A\) au potentiel \(V_B\) fait perdre à cette charge l'énergie potentielle \(\mathrm{d}q\,(V_A - V_B) = u\,i\,\mathrm{d}t\), que le dipôle reçoit. La puissance reçue est donc \(ui\).</p>
  </div></div>
  <div class="method-box">
    <strong>Exemple — batterie qui se décharge, puis qui se recharge</strong>
    <p>Une batterie de voiture est orientée en convention générateur.</p>
    <ol>
      <li>Elle alimente les feux : \(u = 12\ \text{V}\), \(i = 5{,}0\ \text{A}\). Puissance fournie : \(ui = 60\ \text{W}\), positive, la batterie se comporte en générateur.</li>
      <li>Moteur en marche, l'alternateur la recharge : \(u = 14\ \text{V}\) et le courant mesuré dans le même sens de flèche vaut \(i = -3{,}0\ \text{A}\). Alors \(ui = -42\ \text{W}\) : elle fournit une puissance négative, c'est-à-dire qu'elle reçoit \(42\ \text{W}\) ; elle fonctionne en récepteur.</li>
      <li>Ordre de grandeur d'énergie : une batterie de téléphone de 3,7 V et 3 000 mAh stocke \(3{,}7\times3{,}0 = 11\ \text{Wh}\), soit \(11\times3\,600 \approx 4{,}0\times10^{4}\ \text{J}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : changer de convention en cours de calcul, ou écrire \(u = Ri\) pour une résistance orientée en convention générateur (il faut alors \(u = -Ri\)). On choisit les flèches une fois pour toutes sur le schéma, puis on écrit chaque relation dans la convention du dipôle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LOIS DE KIRCHHOFF</div>
  <h2>Loi des nœuds et loi des mailles</h2>
  <div class="intro">Deux lois suffisent à mettre en équation n'importe quel circuit dans l'ARQS : l'une traduit la conservation de la charge, l'autre l'additivité des tensions. On appelle <strong>nœud</strong> un point où se rejoignent au moins trois fils, <strong>branche</strong> une portion de circuit entre deux nœuds, <strong>maille</strong> un chemin fermé de branches.</div>
  <div class="prop-box">
    <strong>Loi des nœuds.</strong> En un nœud, la somme des intensités des courants qui arrivent est égale à la somme des intensités des courants qui partent :
    <div class="formula" data-nom="Loi des nœuds">$$\sum_{\text{arrivant}} i_k = \sum_{\text{partant}} i_k$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Justification</span><span class="prompt">La loi des nœuds traduit la conservation de la charge</span><div class="content">
    <p>Entourons le nœud d'une petite surface fermée. Pendant \(\mathrm{d}t\), la charge qu'elle contient varie de \(\mathrm{d}Q = \left(\sum_{\text{arrivant}} i_k - \sum_{\text{partant}} i_k\right)\mathrm{d}t\), puisque la charge se conserve : elle ne peut varier que par ce qui entre et ce qui sort. Dans l'ARQS, aucune charge ne s'accumule en un nœud ni le long d'un fil : \(\mathrm{d}Q = 0\), d'où la loi des nœuds. (Hors ARQS, des charges peuvent s'accumuler et les courants d'une même branche différer d'un point à l'autre.)</p>
  </div></div>
  <div class="prop-box">
    <strong>Loi des mailles.</strong> Le long d'une maille parcourue dans un sens choisi, la somme algébrique des tensions est nulle :
    <div class="formula" data-nom="Loi des mailles">$$\sum_k \varepsilon_k\,u_k = 0$$</div>
    avec \(\varepsilon_k = +1\) si la flèche de \(u_k\) est dans le sens de parcours, \(-1\) sinon. Elle découle de l'additivité des tensions : en revenant au point de départ, la variation totale de potentiel est nulle.
  </div>

  <div class="method-box">
    <strong>Exemple — résoudre un circuit à deux mailles</strong>
    <p>Dans le circuit ci-dessus, \(E_1 = 12\ \text{V}\), \(R_1 = 2{,}0\ \Omega\), \(E_2 = 6{,}0\ \text{V}\), \(R_2 = 3{,}0\ \Omega\), \(R_3 = 6{,}0\ \Omega\). On cherche les trois courants.</p>
    <ol>
      <li>Loi des nœuds en N : \(i_3 = i_1 + i_2\).</li>
      <li>Maille 1, parcourue dans le sens horaire : \(E_1 - R_1 i_1 - R_3 i_3 = 0\). Maille 2, parcourue dans le sens trigonométrique : \(E_2 - R_2 i_2 - R_3 i_3 = 0\) (chaque résistance est en convention récepteur avec la flèche de son courant).</li>
      <li>En remplaçant \(i_3\) : \(8 i_1 + 6 i_2 = 12\) et \(6 i_1 + 9 i_2 = 6\) (en ampères), d'où \(i_1 = 2{,}0\ \text{A}\), \(i_2 = -0{,}67\ \text{A}\), \(i_3 = 1{,}3\ \text{A}\), et \(u = R_3 i_3 = 8{,}0\ \text{V}\).</li>
      <li>Interprétation : \(i_2 \lt 0\), le courant traverse en réalité la source 2 de haut en bas ; elle reçoit de la puissance (comme une batterie en charge). Bilan : les sources fournissent \(E_1 i_1 + E_2 i_2 = 24 - 4 = 20\ \text{W}\), et les résistances reçoivent \(R_1 i_1^2 + R_2 i_2^2 + R_3 i_3^2 = 8 + 1{,}33 + 10{,}67 = 20\ \text{W}\) : le bilan de puissance est vérifié.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la même chose avec les potentiels</strong>
    <p>Prenons M comme masse et notons \(V\) le potentiel de N. Chaque courant s'exprime avec \(V\) : \(i_1 = (E_1 - V)/R_1\), \(i_2 = (E_2 - V)/R_2\), \(i_3 = V/R_3\). La loi des nœuds donne une seule équation : \(\dfrac{12 - V}{2} + \dfrac{6 - V}{3} = \dfrac{V}{6}\), soit \(V = 8{,}0\ \text{V}\). Écrire la loi des nœuds en termes de potentiels est souvent le plus court : une inconnue par nœud au lieu d'une par branche.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire trop d'équations ou des équations liées. Avec \(n\) nœuds et \(b\) branches, il y a \(n - 1\) lois des nœuds indépendantes et \(b - n + 1\) mailles indépendantes (ici \(n = 2\), \(b = 3\) : une loi des nœuds, deux mailles), soit \(b\) équations pour les \(b\) courants inconnus.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉSISTANCES ET SOURCES IDÉALES</div>
  <h2>Caractéristiques des dipôles linéaires</h2>
  <div class="intro">Un dipôle est décrit par sa <strong>caractéristique</strong>, la relation entre la tension à ses bornes et le courant qui le traverse. Les dipôles de ce chapitre ont une caractéristique affine (droite) : ce sont des dipôles <strong>linéaires</strong>, et c'est ce qui rend les circuits solubles par des équations linéaires.</div>
  <div class="def-box">
    <strong>Conducteur ohmique.</strong> En convention récepteur, sa tension est proportionnelle à son courant (loi d'Ohm) :
    <div class="formula" data-nom="Loi d'Ohm">$$u = R\,i$$</div>
    \(R\) est sa <strong>résistance</strong>, en ohms (\(\Omega\)) ; on utilise aussi sa conductance \(G = 1/R\), en siemens (S).
  </div>
  <div class="prop-box">
    <strong>Effet Joule.</strong> La puissance reçue par une résistance, \(P = ui\), s'écrit
    <div class="formula" data-nom="Puissance Joule">$$P = R\,i^2 = \frac{u^2}{R}$$</div>
    Elle est toujours positive : une résistance reçoit de l'énergie électrique et la cède entièrement au milieu extérieur sous forme de transfert thermique. C'est un dipôle passif et dissipatif.
  </div>
  <div class="def-box">
    <strong>Sources idéales.</strong> Une <strong>source idéale de tension</strong> impose la tension \(u = E\) à ses bornes, quel que soit le courant qu'elle débite ; \(E\) est sa <strong>force électromotrice</strong> (f.é.m.). Une <strong>source idéale de courant</strong> impose l'intensité \(i = \eta\), quelle que soit la tension à ses bornes ; \(\eta\) est son courant électromoteur.
  </div>

  <h3>Ordres de grandeur des résistances</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Élément</th><th style="text-align:left">Résistance</th></tr>
    <tr><td>fil de connexion de TP, piste de circuit imprimé</td><td>de l'ordre de 0,01 à 0,1 Ω (négligeable)</td></tr>
    <tr><td>haut-parleur ; élément chauffant d'une bouilloire</td><td>4 à 8 Ω ; quelques dizaines d'ohms</td></tr>
    <tr><td>résistances usuelles de TP</td><td>de 10 Ω à 1 MΩ</td></tr>
    <tr><td>corps humain entre les deux mains</td><td>1 à 100 kΩ selon l'état de la peau</td></tr>
    <tr><td>entrée d'un oscilloscope ; voltmètre numérique</td><td>1 MΩ ; 10 MΩ</td></tr>
  </table></div>
  <p>La résistance d'un fil de longueur \(\ell\), de section \(S\), en un matériau de résistivité \(\rho\) vaut \(R = \rho\,\ell/S\) (pour le cuivre, \(\rho = 1{,}7\times10^{-8}\ \Omega\text{·m}\)) : cette formule, donnée ici à titre d'ordre de grandeur, explique que les fils soient négligeables dans un circuit de TP, mais pas dans une installation qui transporte de forts courants.</p>
  <div class="method-box">
    <strong>Exemple — la bouilloire et sa rallonge</strong>
    <p>Une bouilloire de \(2{,}0\ \text{kW}\) fonctionne sous \(230\ \text{V}\) (on raisonne comme en continu, avec les valeurs efficaces).</p>
    <ol>
      <li>Résistance : \(R = U^2/P = 230^2/2\,000 \approx 26\ \Omega\) ; courant : \(I = P/U \approx 8{,}7\ \text{A}\).</li>
      <li>Chauffer \(1{,}0\ \text{L}\) d'eau de 20 °C à 100 °C demande \(Q = 4\,180\times80 \approx 3{,}3\times10^{5}\ \text{J}\) : au mieux \(Q/P \approx 170\ \text{s}\), un peu moins de trois minutes.</li>
      <li>Branchée sur une rallonge de 10 m (20 m de cuivre de \(1{,}5\ \text{mm}^2\), aller et retour) : \(R_f = 1{,}7\times10^{-8}\times20/(1{,}5\times10^{-6}) \approx 0{,}23\ \Omega\). Elle dissipe \(R_f I^2 \approx 17\ \text{W}\) et fait chuter la tension de \(R_f I \approx 2\ \text{V}\) : moins de 1 %, sans conséquence. Avec un fil dix fois plus fin, la rallonge chaufferait dangereusement.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : court-circuiter une source de tension idéale ou ouvrir une source de courant idéale. Ces situations n'ont pas de solution (courant infini, tension infinie) : elles signalent que le modèle idéal ne suffit plus, et qu'il faut tenir compte de la résistance interne de la source (§7). En TP, un court-circuit franc d'une alimentation déclenche sa limitation de courant, ou détruit un composant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SOURCE RÉELLE : MODÈLE DE THÉVENIN</div>
  <h2>Une f.é.m. et une résistance interne</h2>
  <div class="intro">Une pile, une batterie, un générateur de TP ne maintiennent pas une tension parfaitement constante : la tension à leurs bornes baisse quand on leur demande plus de courant. Le modèle de Thévenin décrit cette baisse, linéaire en première approximation, par une résistance interne.</div>
  <div class="def-box">
    <strong>Modèle de Thévenin.</strong> Une source réelle linéaire est modélisée par une source idéale de tension de f.é.m. \(E\) en série avec une résistance \(r\), sa <strong>résistance interne</strong>. En convention générateur :
    <div class="formula" data-nom="Source réelle (Thévenin)">$$u = E - r\,i$$</div>
    \(E\) est la <strong>tension à vide</strong> (\(i = 0\)) ; \(I_{cc} = E/r\) est le <strong>courant de court-circuit</strong> (\(u = 0\)).
  </div>

  <h3>Point de fonctionnement</h3>
  <p>Branchons un récepteur aux bornes de la source. Le couple \((i, u)\) doit vérifier à la fois la caractéristique de la source et celle du récepteur : c'est le <strong>point de fonctionnement</strong>, intersection des deux caractéristiques tracées dans le même plan (même orientation de \(u\) et de \(i\)). Pour un récepteur linéaire, on le calcule ; pour un récepteur non linéaire (lampe, diode), on le lit sur le graphe ou on le calcule numériquement.</p>
  <h3>Ordres de grandeur de résistances internes</h3>
  <p>Pile alcaline neuve de 1,5 V : environ \(0{,}1\ \Omega\) (beaucoup plus en fin de vie) ; pile plate de 4,5 V : environ \(1\ \Omega\) ; batterie de voiture : environ \(0{,}01\ \Omega\) ; générateur basses fréquences (GBF) : \(50\ \Omega\) ; alimentation stabilisée de laboratoire : quasi nulle, tant qu'on reste sous sa limite de courant.</p>
  <div class="method-box">
    <strong>Exemple — pourquoi les phares baissent au démarrage</strong>
    <p>On mesure aux bornes d'une batterie \(u_1 = 12{,}52\ \text{V}\) quand elle débite \(I_1 = 10\ \text{A}\) (phares), et \(u_2 = 11{,}40\ \text{V}\) quand elle débite \(I_2 = 150\ \text{A}\) (démarreur).</p>
    <ol>
      <li>Deux points de la droite \(u = E - ri\) : \(r = \dfrac{u_1 - u_2}{I_2 - I_1} = \dfrac{1{,}12}{140} = 8{,}0\times10^{-3}\ \Omega\), et \(E = u_1 + rI_1 = 12{,}60\ \text{V}\).</li>
      <li>Au démarrage, la tension aux bornes, donc aux bornes des phares branchés en parallèle, tombe de \(12{,}5\) à \(11{,}4\ \text{V}\) : leur puissance, en \(u^2/R\), baisse d'environ 17 %. On les voit faiblir.</li>
      <li>Bilan au démarrage : la f.é.m. développe \(EI_2 = 1\,890\ \text{W}\), la batterie en fournit \(u_2 I_2 = 1\,710\ \text{W}\) au circuit, et \(rI_2^2 = 180\ \text{W}\) chauffent la batterie.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Puissance maximale transférée.</strong> Une source \((E, r)\) qui alimente une résistance \(R\) lui transfère \(P = \dfrac{E^2 R}{(R + r)^2}\). Cette puissance est maximale pour \(R = r\) (adaptation), et vaut alors \(P_{\max} = \dfrac{E^2}{4r}\) ; la moitié de la puissance développée par la f.é.m. est alors perdue dans \(r\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Le maximum est atteint pour \(R = r\)</span><div class="content">
    <p>Le courant est \(i = E/(R + r)\) (loi des mailles), d'où \(P = Ri^2 = E^2R/(R + r)^2\). En dérivant par rapport à \(R\) : \(\dfrac{\mathrm{d}P}{\mathrm{d}R} = E^2\,\dfrac{(R + r) - 2R}{(R + r)^3} = E^2\,\dfrac{r - R}{(R + r)^3}\), positif pour \(R \lt r\) et négatif pour \(R \gt r\). Le maximum est en \(R = r\), où \(P = E^2 r/(2r)^2 = E^2/(4r)\). Exemple : une pile de 4,5 V et \(1{,}5\ \Omega\) donne au plus \(3{,}4\ \text{W}\), dans \(1{,}5\ \Omega\), sous \(1{,}5\ \text{A}\).</p>
  </div></div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'on cherche toujours l'adaptation. Elle maximise la puissance reçue par la charge, mais avec un rendement de 50 %. Le réseau électrique ou une batterie fonctionnent au contraire avec \(R \gg r\) : peu de puissance perdue dans la source, tension presque égale à \(E\). L'adaptation sert en électronique, quand le signal est faible (antennes, amplificateurs).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ASSOCIATIONS DE RÉSISTANCES</div>
  <h2>Série et parallèle</h2>
  <div class="intro">Remplacer un groupe de résistances par une seule, équivalente vue de ses bornes, simplifie le circuit avant tout calcul. Deux cas de base : deux résistances traversées par le même courant (série) ou soumises à la même tension (parallèle, ou dérivation).</div>
  <div class="prop-box">
    <strong>Association série.</strong> Deux résistances parcourues par le même courant, sans dérivation entre elles, équivalent à
    <div class="formula" data-nom="Résistances en série">$$R_{\text{éq}} = R_1 + R_2$$</div>
    <strong>Association parallèle.</strong> Deux résistances branchées entre les mêmes nœuds, donc soumises à la même tension, équivalent à
    <div class="formula" data-nom="Résistances en parallèle">$$\frac{1}{R_{\text{éq}}} = \frac{1}{R_1} + \frac{1}{R_2} \quad\Longleftrightarrow\quad R_{\text{éq}} = \frac{R_1 R_2}{R_1 + R_2}$$</div>
    En parallèle, ce sont les conductances qui s'ajoutent : \(G_{\text{éq}} = G_1 + G_2\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Les deux formules</span><div class="content">
    <p><strong>Série</strong> : même courant \(i\), et les tensions s'ajoutent : \(u = R_1 i + R_2 i = (R_1 + R_2)\,i\). <strong>Parallèle</strong> : même tension \(u\), et la loi des nœuds ajoute les courants : \(i = u/R_1 + u/R_2 = (1/R_1 + 1/R_2)\,u\). Dans les deux cas, on lit la résistance équivalente dans \(u = R_{\text{éq}}\,i\). Ces résultats s'étendent à \(n\) résistances.</p>
  </div></div>
  <p>Conséquences utiles : une association série est plus résistante que chacune de ses résistances ; une association parallèle l'est moins que la plus petite ; deux résistances égales \(R\) en parallèle équivalent à \(R/2\). Exemple : \(1{,}0\ \text{k}\Omega\) en parallèle avec \(4{,}7\ \text{k}\Omega\) donne \(4{,}7/5{,}7 \approx 0{,}82\ \text{k}\Omega\).</p>

    <strong>Exemple — réduire un réseau pas à pas</strong>
    <p>On cherche la résistance vue entre A et B du réseau ci-dessus.</p>

      <li>\(R_3\) et \(R_4\) sont parcourues par le même courant (rien ne part entre elles) : en série, \(R_3 + R_4 = 600\ \Omega\).</li>
      <li>Cette branche et \(R_2\) relient les deux mêmes nœuds : en parallèle, \(\dfrac{300\times600}{300 + 600} = 200\ \Omega\).</li>
      <li>Ce groupe est en série avec \(R_1\) : \(R_{AB} = 100 + 200 = 300\ \Omega\).</li>
      <li>Contrôle : \(R_{AB}\) est plus grande que \(R_1\) (on ajoute quelque chose en série) et plus petite que \(R_1 + R_2 = 400\ \Omega\) (on ajoute une branche en parallèle à \(R_2\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : déclarer « en série » deux résistances qui se touchent, alors qu'un fil part du point qui les relie (le courant n'est plus le même), ou « en parallèle » deux résistances qui n'ont qu'une borne en commun. Le critère est électrique (même courant, mêmes nœuds), pas géométrique : redessiner le circuit aide souvent.</div>
</div>

  <div class="prop-box">
    <strong>Diviseur de tension.</strong> Si deux résistances \(R_1\) et \(R_2\) sont en série sous la tension \(u\), <strong>parcourues par le même courant</strong> (aucun courant prélevé au point commun), la tension aux bornes de \(R_2\) vaut
    <div class="formula" data-nom="Diviseur de tension">$$u_2 = u\,\frac{R_2}{R_1 + R_2}$$</div>
    <strong>Diviseur de courant.</strong> Si \(R_1\) et \(R_2\) sont en parallèle et se partagent le courant \(i\), le courant dans \(R_2\) vaut
    <div class="formula" data-nom="Diviseur de courant">$$i_2 = i\,\frac{R_1}{R_1 + R_2} = i\,\frac{G_2}{G_1 + G_2}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Les deux diviseurs</span><div class="content">
    <p><strong>Tension</strong> : le même courant traverse les deux résistances, \(i = u/(R_1 + R_2)\), donc \(u_2 = R_2 i = uR_2/(R_1 + R_2)\). <strong>Courant</strong> : la tension commune vaut \(u = R_{\text{éq}}\,i = \dfrac{R_1R_2}{R_1 + R_2}\,i\), donc \(i_2 = u/R_2 = iR_1/(R_1 + R_2)\). Remarquer l'inversion : au numérateur du diviseur de courant figure l'<em>autre</em> résistance ; le courant préfère le chemin le moins résistant.</p>
  </div></div>
  <div class="method-box">
    <strong>Exemple — fabriquer 3,3 V à partir de 5,0 V</strong>
    <ol>
      <li>Avec \(R_1 = 1{,}0\ \text{k}\Omega\), il faut \(R_2/(R_1 + R_2) = 3{,}3/5{,}0\), soit \(R_2 \approx 1{,}9\ \text{k}\Omega\) ; on prend la valeur normalisée \(2{,}0\ \text{k}\Omega\) : \(u_2 = 5{,}0\times2{,}0/3{,}0 = 3{,}33\ \text{V}\).</li>
      <li>Branchons en sortie un circuit de résistance \(2{,}0\ \text{k}\Omega\) : il est en parallèle sur \(R_2\), qui devient \(1{,}0\ \text{k}\Omega\), et \(u_2 = 5{,}0\times1{,}0/2{,}0 = 2{,}5\ \text{V}\). La sortie s'effondre : le courant prélevé en sortie viole la condition du diviseur.</li>
      <li>Le diviseur ne reste fiable que si la charge est très résistante devant \(R_1\) et \(R_2\) : c'est la question des résistances d'entrée et de sortie (§10).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le shunt d'un ampèremètre</strong>
    <p>Un galvanomètre de résistance \(R_g = 50\ \Omega\) dévie à fond pour \(i_g = 1{,}0\ \text{mA}\). Pour mesurer jusqu'à \(I = 1{,}0\ \text{A}\), on le place en parallèle avec une petite résistance \(R_s\) (le shunt). Diviseur de courant : \(i_g = I\,\dfrac{R_s}{R_s + R_g}\), d'où \(R_s = \dfrac{R_g\,i_g}{I - i_g} = \dfrac{50\times10^{-3}}{0{,}999} \approx 0{,}050\ \Omega\). Le shunt dérive 99,9 % du courant.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · RÉSISTANCES D'ENTRÉE ET DE SORTIE</div>
  <h2>Brancher un appareil modifie le circuit</h2>
  <div class="intro">Un GBF, un capteur, un amplificateur fournissent un signal ; un oscilloscope, un multimètre, une carte d'acquisition le reçoivent. Les relier, c'est former un nouveau circuit, dont le comportement dépend de deux résistances qu'il faut savoir lire sur une notice et dont il faut évaluer l'effet.</div>
  <div class="def-box">
    <strong>Résistance de sortie.</strong> Vue de ses bornes de sortie, un montage (générateur, capteur…) se modélise par un générateur de Thévenin : f.é.m. \(E_s\) (tension de sortie à vide) et résistance \(R_s\), sa <strong>résistance de sortie</strong>.<br>
    <strong>Résistance d'entrée.</strong> Vu de ses bornes d'entrée, un montage récepteur (oscilloscope, voltmètre…) se modélise par une résistance \(R_e = u_e/i_e\) (convention récepteur), sa <strong>résistance d'entrée</strong>.
  </div>

<figcaption>La sortie d'un montage (générateur, capteur…) est modélisée par Thévenin (\(E_s\), résistance de sortie \(R_s\)) ; l'entrée du montage suivant (oscilloscope, voltmètre…) par sa résistance d'entrée \(R_e\). C'est un diviseur de tension : \(u_e/E_s = R_e/(R_e + R_s)\). La tension est transmise à 1 % près dès que \(R_e \geq 100\,R_s\) (échelle logarithmique en abscisse).</figcaption>
</figure>
  <div class="prop-box">
    <strong>Transmission d'une tension.</strong> Relier la sortie de l'un à l'entrée de l'autre forme un diviseur de tension :
    <div class="formula" data-nom="Liaison sortie-entrée">$$u_e = E_s\,\frac{R_e}{R_e + R_s}$$</div>
    La tension est transmise sans perte notable si \(R_e \gg R_s\) : à 1 % près dès que \(R_e \geq 100\,R_s\). Un bon appareil de mesure de tension a une grande résistance d'entrée ; une bonne source de tension, une petite résistance de sortie.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Appareil (valeurs typiques de notice)</th><th style="text-align:left">Résistance</th></tr>
    <tr><td>GBF : résistance de sortie</td><td>\(50\ \Omega\)</td></tr>
    <tr><td>alimentation stabilisée : résistance de sortie</td><td>quasi nulle (sous la limite de courant)</td></tr>
    <tr><td>oscilloscope : résistance d'entrée</td><td>\(1\ \text{M}\Omega\) (en parallèle avec une capacité d'une quinzaine de pF)</td></tr>
    <tr><td>multimètre en voltmètre : résistance d'entrée</td><td>\(10\ \text{M}\Omega\)</td></tr>
    <tr><td>multimètre en ampèremètre : résistance interne</td><td>de l'ordre de \(1\ \Omega\) sur le calibre 200 mA, \(0{,}01\ \Omega\) sur le calibre 10 A</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — un GBF sur trois charges</strong>
    <p>Un GBF de résistance de sortie \(R_s = 50\ \Omega\) est réglé pour une f.é.m. d'amplitude \(E_s = 5{,}0\ \text{V}\).</p>
    <ol>
      <li>Sur l'oscilloscope seul (\(R_e = 1\ \text{M}\Omega\)) : \(u_e = 5{,}0\times10^6/(10^6 + 50) \approx 4{,}9998\ \text{V}\), l'effet de \(R_s\) est invisible.</li>
      <li>Sur une résistance de \(1{,}0\ \text{k}\Omega\) : \(u_e = 5{,}0\times1\,000/1\,050 \approx 4{,}8\ \text{V}\), soit 5 % de moins que la tension à vide.</li>
      <li>Sur une charge de \(50\ \Omega\) : \(u_e = 2{,}5\ \text{V}\), moitié de la tension à vide. C'est la <strong>méthode de la tension moitié</strong> pour mesurer une résistance de sortie : on règle une résistance variable branchée en sortie jusqu'à lire la moitié de la tension à vide ; elle vaut alors \(R_s\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un voltmètre qui fausse la mesure</strong>
    <p>Deux résistances égales \(R\) forment un diviseur sous \(10\ \text{V}\) ; on mesure la tension aux bornes de l'une avec un voltmètre de résistance d'entrée \(R_V = 10\ \text{M}\Omega\), qui se place en parallèle sur elle.</p>
    <ol>
      <li>\(R = 10\ \text{k}\Omega\) : \(R \parallel R_V \approx 9{,}990\ \text{k}\Omega\), le voltmètre lit \(4{,}9975\ \text{V}\) au lieu de \(5{,}000\ \text{V}\) (écart de 0,05 %).</li>
      <li>\(R = 10\ \text{M}\Omega\) : \(R \parallel R_V = 5\ \text{M}\Omega\), le voltmètre lit \(10\times5/15 = 3{,}3\ \text{V}\) : un tiers d'erreur. Vue du voltmètre, la sortie du diviseur a une résistance de sortie \(R/2 = 5\ \text{M}\Omega\), qui n'est plus négligeable devant \(R_V\).</li>
      <li>Même raisonnement pour un ampèremètre, placé en série : sa résistance s'ajoute à celle du circuit. Une résistance interne de \(1\ \Omega\) dans un circuit de \(10\ \Omega\) diminue le courant de 9 %.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier la résistance de sortie du GBF. Avec une charge de quelques dizaines d'ohms, la tension réellement appliquée est nettement inférieure à la tension réglée : il faut toujours mesurer la tension à l'entrée du circuit étudié, pas se fier au réglage. (Sur certains GBF, l'affichage suppose même une charge de \(50\ \Omega\) : réglage « 50 Ω » ou « High Z » de la sortie.)</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Norton, Millman, superposition</h2>
  <div class="intro">Ces trois outils ne sont pas exigibles en PTSI : tout ce qu'ils permettent se fait avec les lois de Kirchhoff et le modèle de Thévenin. Ils raccourcissent parfois les calculs, et on les rencontre dans des sujets anciens.</div>
  <div class="def-box">
    <strong>Modèle de Norton.</strong> Une source réelle peut aussi se modéliser par une source idéale de courant \(\eta\) en parallèle avec la résistance \(r\) : \(i = \eta - u/r\) (convention générateur). C'est la même caractéristique que celle de Thévenin si \(\eta = E/r\) (le courant de court-circuit). On passe d'un modèle à l'autre pour regrouper des sources : en série, on additionne des f.é.m. ; en parallèle, des courants électromoteurs.
  </div>
  <div class="prop-box">
    <strong>Théorème de Millman.</strong> C'est la loi des nœuds écrite en potentiels (§5), résolue d'avance : si des branches de résistances \(R_k\) relient un nœud N à des points de potentiels \(V_k\) (sans autre source de courant), alors \(V_N = \dfrac{\sum_k V_k/R_k}{\sum_k 1/R_k}\). Sur l'exemple du §5 : \(V = \dfrac{12/2 + 6/3 + 0/6}{1/2 + 1/3 + 1/6} = 8{,}0\ \text{V}\).
  </div>
  <div class="prop-box">
    <strong>Superposition.</strong> Dans un circuit linéaire comportant plusieurs sources, chaque courant est la somme des courants que créerait chaque source seule, les autres étant éteintes (source de tension remplacée par un fil, source de courant par un interrupteur ouvert). Sur l'exemple du §5 : \(E_1\) seule donne \(V = 12\times\dfrac{2}{2 + 2} = 6{,}0\ \text{V}\) (\(R_2 \parallel R_3 = 2\ \Omega\)), \(E_2\) seule donne \(V = 6\times\dfrac{1{,}5}{3 + 1{,}5} = 2{,}0\ \text{V}\) (\(R_1 \parallel R_3 = 1{,}5\ \Omega\)), et au total \(V = 8{,}0\ \text{V}\).
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="rco-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · RÉGIME CONTINU</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire de la partie 1.2 du programme : vérifier le cadre de l'ARQS, orienter un circuit, le mettre en équations par les lois de Kirchhoff (en courants ou en potentiels), le simplifier par associations et diviseurs, modéliser une source par Thévenin, prévoir l'effet des résistances d'entrée et de sortie des appareils, et contrôler un résultat par un bilan de puissance. Elles resservent telles quelles dans tous les chapitres d'électrocinétique.</div>

  <div class="method-box"><strong>Méthode 1 — Vérifier que l'ARQS s'applique</strong>
    <ol>
      <li><span class="step">Repérer les échelles.</span> La plus grande dimension \(L\) du circuit (câbles compris) et la plus grande fréquence \(f\) utile des signaux (pour un signal non sinusoïdal, celle de ses harmoniques significatifs).</li>
      <li><span class="step">Comparer.</span> Calculer \(\lambda = c/f\) (avec \(c \approx 3\times10^{8}\ \text{m·s}^{-1}\), ou \(2\times10^{8}\) dans un câble) et vérifier \(L \ll \lambda\), en pratique \(L \lt \lambda/10\) ; ou, ce qui revient au même, comparer la durée de propagation \(L/c\) à la période \(T\).</li>
      <li><span class="step">Conclure.</span> Si la condition est remplie, le courant est le même tout le long d'une branche et les lois de Kirchhoff s'appliquent aux valeurs instantanées.</li>
    </ol>
    <p><em>Exemple éclair :</em> une sonde d'oscilloscope de \(1{,}2\ \text{m}\) transmet un signal de \(20\ \text{MHz}\) : \(\lambda = 3\times10^{8}/(2\times10^{7}) = 15\ \text{m}\) et \(L/\lambda = 0{,}08\) : l'ARQS est tout juste acceptable. À \(200\ \text{MHz}\), \(L/\lambda = 0{,}8\) : il faut tenir compte de la propagation dans le câble.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Orienter un circuit et choisir les conventions</strong>
    <ol>
      <li><span class="step">Flécher les courants.</span> Une intensité par branche, avec un sens choisi arbitrairement (le calcul corrigera par le signe).</li>
      <li><span class="step">Flécher les tensions.</span> En convention récepteur (flèche opposée au courant) pour les résistances, condensateurs et bobines ; en convention générateur pour les sources, flèche de la f.é.m. vers la borne « + ».</li>
      <li><span class="step">Écrire chaque loi de dipôle dans sa convention.</span> \(u = Ri\) en convention récepteur, \(u = -Ri\) si l'on a fléché la résistance en convention générateur ; \(u = E - ri\) pour une source réelle en convention générateur.</li>
      <li><span class="step">Interpréter les signes à la fin.</span> Un courant négatif circule en sens inverse de sa flèche ; un dipôle en convention récepteur avec \(ui \lt 0\) fournit de la puissance.</li>
    </ol>
    <p><em>Exemple éclair :</em> on flèche \(i\) de B vers A dans une résistance de \(100\ \Omega\) et \(u = u_{AB}\) : les flèches sont de même sens (convention générateur), donc \(u_{AB} = -100\,i\). Si l'on mesure \(u_{AB} = 2{,}0\ \text{V}\), alors \(i = -20\ \text{mA}\) : le courant va en réalité de A vers B.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la flèche d'une tension \(u_{AB}\) pointe vers A, la première lettre. Inverser ce sens change le signe de toutes les équations où elle apparaît.</div>

  <div class="method-box"><strong>Méthode 3 — Mettre un circuit en équations avec les lois de Kirchhoff</strong>
    <ol>
      <li><span class="step">Compter.</span> \(n\) nœuds, \(b\) branches, donc \(b\) courants inconnus (moins ceux qu'imposent des sources de courant).</li>
      <li><span class="step">Écrire \(n - 1\) lois des nœuds</span> (la dernière est une conséquence des autres).</li>
      <li><span class="step">Écrire \(b - n + 1\) lois des mailles</span> sur des mailles indépendantes (par exemple les « fenêtres » du schéma), chacune avec un sens de parcours indiqué, en remplaçant chaque tension par sa loi de dipôle.</li>
      <li><span class="step">Résoudre</span> le système linéaire, puis contrôler (bilan de puissance, cas limites).</li>
    </ol>
    <p><em>Exemple éclair :</em> une seule maille contenant \(E_1 = 9{,}0\ \text{V}\) et \(E_2 = 3{,}0\ \text{V}\) montées en opposition, avec \(R_1 = 100\ \Omega\) et \(R_2 = 200\ \Omega\). En parcourant la maille dans le sens où \(E_1\) est motrice : \(E_1 - E_2 - (R_1 + R_2)\,i = 0\), donc \(i = 6{,}0/300 = 20\ \text{mA}\), dans le sens où \(E_1\) débite ; la source \(E_2\) reçoit \(E_2 i = 60\ \text{mW}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Écrire la loi des nœuds en termes de potentiels</strong>
    <ol>
      <li><span class="step">Choisir la masse</span> (souvent le nœud où arrivent le plus de branches) et nommer les potentiels des autres nœuds : ce sont les inconnues.</li>
      <li><span class="step">Exprimer chaque courant</span> arrivant au nœud N par la loi de sa branche : à travers une résistance \(R\) venant d'un point de potentiel \(V_k\), \(i = (V_k - V_N)/R\) ; une source de courant donne directement son courant.</li>
      <li><span class="step">Écrire la loi des nœuds</span> en N (somme des courants arrivants nulle) : une équation par nœud inconnu.</li>
      <li><span class="step">Résoudre</span>, puis revenir aux courants.</li>
    </ol>
    <p><em>Exemple éclair :</em> une source \(E = 9{,}0\ \text{V}\) alimente le nœud N à travers \(R_1 = 1{,}0\ \text{k}\Omega\) ; \(R_2 = 2{,}0\ \text{k}\Omega\) relie N à la masse ; une source de courant injecte \(\eta = 3{,}0\ \text{mA}\) en N. En kΩ et mA : \((9 - V) + 3 = V/2\), d'où \(V = 8{,}0\ \text{V}\) ; le courant dans \(R_1\) vaut \(1{,}0\ \text{mA}\), celui dans \(R_2\) \(4{,}0\ \text{mA}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : orienter un courant « vers le nœud » dans une branche et « hors du nœud » dans la loi des nœuds. Avec l'écriture \(i = (V_k - V_N)/R\), tous les courants sont comptés arrivant en N : leur somme est nulle, sans autre signe à gérer.</div>

  <div class="method-box"><strong>Méthode 5 — Réduire un réseau par associations série et parallèle</strong>
    <ol>
      <li><span class="step">Repérer les nœuds</span> (points d'où partent au moins trois fils) et les marquer ; redessiner si le schéma est tordu.</li>
      <li><span class="step">Série</span> : deux résistances entre lesquelles ne part aucun fil (même courant) s'ajoutent.</li>
      <li><span class="step">Parallèle</span> : deux résistances qui relient les deux mêmes nœuds (même tension) se combinent en \(R_1R_2/(R_1 + R_2)\).</li>
      <li><span class="step">Recommencer</span> de l'intérieur vers l'extérieur, en contrôlant que chaque résultat est plus grand (série) ou plus petit (parallèle) que ses éléments.</li>
    </ol>
    <p><em>Exemple éclair :</em> entre A et B, \(R_1 = 1{,}0\ \text{k}\Omega\) en série avec deux résistances de \(2{,}0\ \text{k}\Omega\) en parallèle : \(R_{AB} = 1{,}0 + 2{,}0/2 = 2{,}0\ \text{k}\Omega\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Utiliser un diviseur de tension ou de courant</strong>
    <ol>
      <li><span class="step">Vérifier la condition.</span> Diviseur de tension : les deux résistances sont parcourues par le même courant (rien n'est prélevé entre elles, ou ce qui l'est a été regroupé dans une résistance équivalente). Diviseur de courant : elles sont en parallèle et se partagent un courant connu.</li>
      <li><span class="step">Appliquer.</span> \(u_2 = u\,R_2/(R_1 + R_2)\) (la résistance aux bornes de laquelle on cherche la tension au numérateur) ; \(i_2 = i\,R_1/(R_1 + R_2)\) (l'<em>autre</em> résistance au numérateur).</li>
      <li><span class="step">Contrôler</span> avec un cas limite : \(R_2 \to \infty\) donne \(u_2 \to u\) et \(i_2 \to 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un courant de \(30\ \text{mA}\) se partage entre \(100\ \Omega\) et \(200\ \Omega\) en parallèle : \(20\ \text{mA}\) dans \(100\ \Omega\), \(10\ \text{mA}\) dans \(200\ \Omega\) ; contrôle : même tension \(2{,}0\ \text{V}\) aux bornes des deux.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer le diviseur de tension à un pont dont la sortie est chargée. Il faut d'abord regrouper la charge en parallèle avec \(R_2\), ou passer par le générateur de Thévenin équivalent (méthode 8).</div>

  <div class="method-box"><strong>Méthode 7 — Modéliser une source réelle par Thévenin</strong>
    <ol>
      <li><span class="step">Tension à vide.</span> Un voltmètre (très grande résistance d'entrée) branché seul aux bornes donne \(E\).</li>
      <li><span class="step">Une mesure en charge.</span> Sous un courant \(I\), la tension vaut \(U\) : \(r = (E - U)/I\). Avec deux points de la caractéristique, \(r = -\Delta u/\Delta i\) (pente de la droite \(u(i)\)).</li>
      <li><span class="step">Contrôler le domaine.</span> Le modèle n'est valable que dans le domaine où la caractéristique est une droite (pas au-delà de la limite de courant d'une alimentation, par exemple).</li>
    </ol>
    <p><em>Exemple éclair :</em> une pile plate affiche \(4{,}62\ \text{V}\) à vide et \(4{,}12\ \text{V}\) quand elle débite \(0{,}50\ \text{A}\) : \(r = 0{,}50/0{,}50 = 1{,}0\ \Omega\). Son courant de court-circuit serait \(4{,}6\ \text{A}\), et elle délivre au plus \(E^2/(4r) \approx 5{,}3\ \text{W}\), dans \(1{,}0\ \Omega\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Trouver le générateur de Thévenin équivalent à un réseau vu d'une charge</strong>
    <ol>
      <li><span class="step">Débrancher la charge</span> et nommer A et B les bornes où elle était.</li>
      <li><span class="step">f.é.m. équivalente</span> : \(E_{\text{th}}\) est la tension à vide \(u_{AB}\) (souvent un diviseur de tension).</li>
      <li><span class="step">Résistance équivalente</span> : \(R_{\text{th}}\) est la résistance vue entre A et B quand on éteint les sources (source de tension remplacée par un fil, source de courant par un interrupteur ouvert).</li>
      <li><span class="step">Rebrancher la charge</span> \(R\) : \(i = E_{\text{th}}/(R_{\text{th}} + R)\) et \(u = E_{\text{th}}\,R/(R_{\text{th}} + R)\), pour toutes les valeurs de \(R\) à la fois.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E = 15\ \text{V}\), \(R_1 = 1{,}0\ \text{k}\Omega\) en série puis \(R_2 = 2{,}0\ \text{k}\Omega\) vers la masse, charge en parallèle sur \(R_2\). À vide, \(E_{\text{th}} = 15\times2/3 = 10\ \text{V}\) ; source éteinte, \(R_{\text{th}} = R_1 \parallel R_2 \approx 0{,}67\ \text{k}\Omega\). Avec une charge de \(1{,}0\ \text{k}\Omega\) : \(i = 10/1{,}67 = 6{,}0\ \text{mA}\), \(u = 6{,}0\ \text{V}\).</p>
    <p>Variante (non exigible) : convertir pas à pas les associations « source de tension + résistance série » en modèles de Norton (\(\eta = E/r\), même \(r\) en parallèle) pour regrouper des sources en parallèle, puis revenir à Thévenin.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Évaluer l'effet d'une résistance d'entrée ou de sortie</strong>
    <ol>
      <li><span class="step">Lire les notices</span> : résistance de sortie de la source (GBF \(50\ \Omega\), capteur…), résistance d'entrée de l'appareil (oscilloscope \(1\ \text{M}\Omega\), voltmètre \(10\ \text{M}\Omega\)), résistance interne de l'ampèremètre.</li>
      <li><span class="step">Modéliser</span> la source vue de ses bornes par Thévenin (\(E_s\), \(R_s\)), l'appareil par \(R_e\) : \(u_e = E_s R_e/(R_e + R_s)\).</li>
      <li><span class="step">Conclure</span> : l'écart relatif vaut environ \(R_s/R_e\) quand il est petit ; négligeable si \(R_e \geq 100\,R_s\) pour une précision de 1 %. Pour un ampèremètre, comparer sa résistance à celle du reste de la maille.</li>
    </ol>
    <p><em>Exemple éclair :</em> un capteur de résistance de sortie \(100\ \text{k}\Omega\) branché sur l'oscilloscope (\(1\ \text{M}\Omega\)) : \(u_e = E_s/1{,}1 \approx 0{,}91\,E_s\), une erreur de 9 % ; avec le voltmètre (\(10\ \text{M}\Omega\)), elle tombe à 1 %.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Faire un bilan de puissance</strong>
    <ol>
      <li><span class="step">Puissances fournies</span> par les sources : \(Ei\) en convention générateur (négative si la source est en fait chargée).</li>
      <li><span class="step">Puissances reçues</span> par les résistances : \(Ri^2\), toujours positives.</li>
      <li><span class="step">Vérifier l'égalité</span> : la somme des puissances fournies égale la somme des puissances reçues (la puissance totale reçue par tous les dipôles du circuit est nulle). Un écart signale une erreur de signe ou de calcul.</li>
    </ol>
    <p><em>Exemple éclair :</em> une source \(E = 12\ \text{V}\), \(r = 1{,}0\ \Omega\) alimente \(R = 5{,}0\ \Omega\) : \(i = 2{,}0\ \text{A}\). La f.é.m. fournit \(24\ \text{W}\) ; \(r\) reçoit \(4{,}0\ \text{W}\) et \(R\) reçoit \(20\ \text{W}\) : le bilan est équilibré, et le rendement vaut \(20/24 \approx 83\ \%\).</p>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Charge transportée et vitesse des électrons</h3>
  <div class="statement">Une diode électroluminescente reste allumée 8,0 h, parcourue par un courant constant \(I = 15\ \text{mA}\). Données : \(e = 1{,}60\times10^{-19}\ \text{C}\) ; le cuivre compte \(n = 8{,}5\times10^{28}\) électrons libres par \(\text{m}^3\).</div>
  <div class="q"><strong>Q1.</strong> Quelle charge a traversé la diode ? Combien d'électrons cela représente-t-il ?</div>
  <div class="q"><strong>Q2.</strong> On l'alimente par une batterie de 3,7 V et 2 000 mAh (en négligeant le circuit d'adaptation). Combien de temps peut-elle rester allumée ? Quelle énergie la batterie stocke-t-elle ?</div>
  <div class="q"><strong>Q3.</strong> Le fil de cuivre qui l'alimente a une section de \(0{,}20\ \text{mm}^2\). Calculer la vitesse moyenne d'ensemble des électrons. Pourquoi la diode s'allume-t-elle pourtant sans délai perceptible ?</div>
  <div class="q"><strong>Q4.</strong> Justifier qu'on puisse traiter l'intensité comme une grandeur continue malgré la quantification de la charge.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le courant est constant :</p><div class="formula">$$Q = I\,\Delta t = 15\times10^{-3}\times8{,}0\times3\,600 \approx 4{,}3\times10^{2}\ \text{C}$$</div><p>soit \(Q/e \approx 2{,}7\times10^{21}\) électrons.</p>
    <p><strong>Q2.</strong> 2 000 mAh, c'est la charge \(2{,}0\ \text{A}\times1\ \text{h}\) : à \(15\ \text{mA}\), la batterie tient \(2{,}0/0{,}015 \approx 130\ \text{h}\), un peu plus de cinq jours. Énergie stockée : \(3{,}7\ \text{V}\times2{,}0\ \text{A}\times3\,600\ \text{s} \approx 2{,}7\times10^{4}\ \text{J}\) (\(7{,}4\ \text{Wh}\)).</p>
    <p><strong>Q3.</strong> \(I = neSv\) donne</p><div class="formula">$$v = \frac{I}{neS} = \frac{15\times10^{-3}}{8{,}5\times10^{28}\times1{,}60\times10^{-19}\times0{,}20\times10^{-6}} \approx 5{,}5\times10^{-6}\ \text{m·s}^{-1}$$</div><p>environ 2 cm par heure. La diode s'allume aussitôt parce que tous les électrons du circuit se mettent en mouvement en même temps : la commande se propage par le champ électrique, à une vitesse proche de celle de la lumière.</p>
    <p><strong>Q4.</strong> Le débit est de \(I/e \approx 9{,}4\times10^{16}\) électrons par seconde : même sur une microseconde, il en passe près de \(10^{11}\), et un électron de plus ou de moins est indétectable. La charge transportée varie donc de façon pratiquement continue.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>L'ARQS est-elle valable ?</h3>
  <div class="statement">Pour chaque situation, dire si l'on peut appliquer les lois de Kirchhoff en valeurs instantanées. On prendra pour célérité des signaux \(3{,}0\times10^{8}\ \text{m·s}^{-1}\) dans l'air, \(2{,}0\times10^{8}\ \text{m·s}^{-1}\) dans un câble coaxial et \(1{,}5\times10^{8}\ \text{m·s}^{-1}\) sur une carte électronique.
    <ul>
      <li>(a) un circuit de TP de 50 cm, alimenté à 10 kHz ;</li>
      <li>(b) un câble coaxial de 20 m transportant un signal de 50 MHz ;</li>
      <li>(c) une ligne à très haute tension de 300 km, à 50 Hz ;</li>
      <li>(d) une piste de 5,0 cm entre un processeur et sa mémoire, à 1,6 GHz.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Rappeler la condition de l'ARQS, puis conclure dans chaque cas.</div>
  <div class="q"><strong>Q2.</strong> Dans le cas (b), combien de « périodes » du signal le câble contient-il à un instant donné ? Que peut-on dire du courant le long du câble ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Il faut \(L \ll \lambda = c/f\), en pratique \(L \lt \lambda/10\).</p>
    <ul>
      <li>(a) \(\lambda = 3{,}0\times10^{8}/10^{4} = 30\ \text{km}\), \(L/\lambda \approx 2\times10^{-5}\) : ARQS largement valable.</li>
      <li>(b) \(\lambda = 2{,}0\times10^{8}/(5{,}0\times10^{7}) = 4{,}0\ \text{m}\), \(L/\lambda = 5\) : ARQS fausse.</li>
      <li>(c) \(\lambda = 6\,000\ \text{km}\), \(L/\lambda = 0{,}05\) : ARQS acceptable, de justesse (au-delà de quelques centaines de kilomètres, les réseaux sont modélisés comme des lignes de propagation).</li>
      <li>(d) \(\lambda = 1{,}5\times10^{8}/(1{,}6\times10^{9}) \approx 9{,}4\ \text{cm}\), \(L/\lambda \approx 0{,}5\) : ARQS fausse ; les concepteurs de cartes traitent ces pistes comme des lignes de transmission.</li>
    </ul>
    <p><strong>Q2.</strong> Le câble contient \(L/\lambda = 5\) longueurs d'onde : à un instant donné, le courant change de signe dix fois le long du câble. Le courant n'est plus le même en tout point de la « branche », et la loi des nœuds appliquée aux extrémités du câble n'a plus de sens.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Générateur réel — Thévenin et Norton</h3>
  <div class="statement">Un générateur de f.é.m. \(E = 12\) V et de résistance interne \(r = 2\ \Omega\) alimente une résistance de charge \(R = 10\ \Omega\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le courant débité et la tension aux bornes de la charge.</div>
  <div class="q"><strong>Q2.</strong> (Non exigible en PTSI.) Donner le modèle de Norton équivalent du générateur.</div>
  <div class="q"><strong>Q3.</strong> Quelle puissance est dissipée dans la résistance interne ? Quel est le rendement du générateur ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Loi des mailles : \(E = (r+R)\,i\), donc \(i = \dfrac{E}{r+R} = \dfrac{12}{12} = 1\) A. Tension aux bornes de la charge : \(u = R\,i = 10\) V (la chute interne vaut \(r\,i = 2\) V, et l'on vérifie \(u = E - ri\)).</p>
    <p><strong>Q2.</strong> Modèle de Norton : source idéale de courant \(\eta = E/r = 12/2 = 6\) A (le courant de court-circuit) en parallèle avec \(r = 2\ \Omega\).</p>
    <p><strong>Q3.</strong> \(P_r = r\,i^2 = 2\times 1^2 = 2\) W. La f.é.m. développe \(Ei = 12\ \text{W}\), la charge en reçoit \(Ri^2 = 10\ \text{W}\) : rendement \(10/12 \approx 83\ \%\).</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> En considérant le voltmètre comme idéal, exprimer \(V_C\) et \(V_D\) (masse au pôle « − » de la source), puis \(u_{DC}\).</div>
  <div class="q"><strong>Q2.</strong> À quelle condition sur \(R_x\) le pont est-il équilibré (\(u_{DC} = 0\)) ? Comment s'en sert-on pour mesurer une résistance inconnue ?</div>
  <div class="q"><strong>Q3.</strong> Montrer que pour \(|\alpha| \ll 1\), \(u_{DC} \approx E\alpha/4\). Calculer \(u_{DC}\) pour \(\alpha = 2{,}0\times10^{-3}\).</div>
  <div class="q"><strong>Q4.</strong> Vu du voltmètre, le pont se comporte comme un générateur de Thévenin. Calculer sa résistance et justifier que le voltmètre peut être considéré comme idéal.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le voltmètre idéal ne prélève aucun courant : chaque branche est un diviseur de tension. \(V_C = E\,\dfrac{R_2}{R_1 + R_2} = 5{,}0\ \text{V}\) et \(V_D = E\,\dfrac{R_x}{R_3 + R_x}\), d'où \(u_{DC} = E\left(\dfrac{R_x}{R_3 + R_x} - \dfrac{R_2}{R_1 + R_2}\right)\).</p>
    <p><strong>Q2.</strong> \(u_{DC} = 0\) si \(\dfrac{R_x}{R_3 + R_x} = \dfrac{R_2}{R_1 + R_2}\), soit \(R_x R_1 = R_2 R_3\) : \(R_x = R_2R_3/R_1 = 100\ \Omega\). Pour mesurer une résistance inconnue, on règle \(R_3\) (résistance variable étalonnée) jusqu'à annuler la tension, puis on lit \(R_x = R_2R_3/R_1\) : la mesure est un « zéro », indépendante de \(E\) et de l'étalonnage du voltmètre.</p>
    <p><strong>Q3.</strong> Au premier ordre en \(\alpha\) :</p><div class="formula">$$\frac{R_x}{R_3 + R_x} = \frac{1 + \alpha}{2 + \alpha} = \frac12\,\frac{1 + \alpha}{1 + \alpha/2} \approx \frac12\left(1 + \alpha - \frac{\alpha}{2}\right) = \frac12 + \frac{\alpha}{4}$$</div><p>d'où \(u_{DC} \approx E\alpha/4\). Pour \(\alpha = 2{,}0\times10^{-3}\) : \(u_{DC} \approx 5{,}0\ \text{mV}\) (le calcul exact donne \(4{,}995\ \text{mV}\)). Le pont transforme une variation relative de résistance de 0,2 % en une tension mesurable autour de zéro, au lieu d'une petite variation sur 5 V.</p>
    <p><strong>Q4.</strong> Sources éteintes (la source de tension remplacée par un fil), on voit entre C et D \(R_1 \parallel R_2\) en série avec \(R_3 \parallel R_x\) : \(R_{\text{th}} = 500 + 50 = 550\ \Omega\). Devant \(10\ \text{M}\Omega\), l'erreur relative est de l'ordre de \(550/10^{7} \approx 6\times10^{-5}\) : le voltmètre se comporte en voltmètre idéal.</p>
  </div>
</div>
