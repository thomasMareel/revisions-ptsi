<div class="course-section">
  <div class="sec-num">§1 · CHARGE ÉLECTRIQUE ET LOI DE COULOMB</div>
  <h2>La force entre deux charges immobiles</h2>
  <div class="intro">Toute l'électrostatique découle d'une loi de force entre deux charges ponctuelles immobiles, complétée par le principe de superposition. Cette section en donne l'énoncé et montre, chiffres à l'appui, que la force électrique écrase la gravitation dès que la matière n'est plus parfaitement neutre.</div>

  <h3>La charge électrique</h3>
  <p>La charge \(q\) se mesure en coulombs (C). C'est une grandeur <strong>algébrique</strong> (positive ou négative), <strong>additive</strong> et <strong>conservée</strong> : la charge totale d'un système isolé ne varie pas. Elle est <strong>quantifiée</strong> : toute charge isolable est un multiple entier de la charge élémentaire \(e = 1{,}602\times10^{-19}\ \text{C}\) (proton \(+e\), électron \(-e\)). Électriser un objet, c'est lui arracher ou lui apporter des électrons, toujours en nombre infime devant ceux qu'il contient.</p>

  <h3>Loi de Coulomb</h3>
  <div class="prop-box">
    <strong>Loi de Coulomb.</strong> Une charge ponctuelle \(q_1\), immobile en \(P\), exerce sur une charge ponctuelle \(q\) située en \(M\), à la distance \(r = PM\), la force
    <div class="formula" data-nom="Loi de Coulomb">$$\begin{aligned}\vec F_{P\to M}&=\frac{q_1\,q}{4\pi\varepsilon_0}\,\frac{\overrightarrow{PM}}{PM^3}\\&=\frac{q_1\,q}{4\pi\varepsilon_0\,r^2}\,\vec u_{P\to M}\end{aligned}$$</div>
    où \(\vec u_{P\to M}\) est le vecteur unitaire orienté de \(P\) vers \(M\). La force est répulsive si \(q_1\) et \(q\) ont le même signe, attractive sinon ; la charge en \(M\) exerce sur celle en \(P\) la force opposée.
  </div>
  <p>La constante \(\varepsilon_0 = 8{,}854\times10^{-12}\ \text{F·m}^{-1}\) est la permittivité du vide ; en pratique \(\dfrac{1}{4\pi\varepsilon_0}\approx 9{,}0\times10^{9}\ \text{SI}\), constante souvent notée \(k\). L'air sec se comporte presque comme le vide.</p>

  <h3>Électricité contre gravitation</h3>
  <p>La loi de la gravitation, \(F_g = \dfrac{G\,m_1m_2}{r^2}\), a la même forme en \(1/r^2\). Entre un proton et un électron, le rapport des deux forces ne dépend donc pas de la distance :</p>
  <div class="formula">$$\frac{F_e}{F_g}=\frac{e^2}{4\pi\varepsilon_0\,G\,m_p\,m_e}\approx 2\times10^{39}$$</div>
  <p>Si la gravitation gouverne pourtant les planètes et les marées, c'est que la matière est globalement neutre : les forces électriques des charges positives et négatives se compensent presque exactement à grande échelle.</p>

  <div class="method-box">
    <strong>Exemple — deux billes électrisées</strong>
    <p>Deux billes de polystyrène de masse \(m = 0{,}20\ \text{g}\) portent chacune la charge \(q = 20\ \text{nC}\) ; leurs centres sont à \(r = 3{,}0\ \text{cm}\) l'un de l'autre.</p>
    <ol>
      <li>Force électrique (répulsive) :
        <div class="formula">$$\begin{aligned}F_e&=\frac{9{,}0\times10^{9}\times(20\times10^{-9})^2}{(3{,}0\times10^{-2})^2}\\&=4{,}0\times10^{-3}\ \text{N}\end{aligned}$$</div></li>
      <li>Poids d'une bille : \(mg = 0{,}20\times10^{-3}\times9{,}8 \approx 2{,}0\times10^{-3}\ \text{N}\). La force électrique vaut le double du poids : des objets légers et électrisés s'écartent ou se soulèvent nettement (pendule électrostatique, papiers attirés par une règle frottée).</li>
      <li>Attraction gravitationnelle entre les billes, mille milliards de fois plus faible que la force électrique :
        <div class="formula">$$\begin{aligned}F_g=\frac{Gm^2}{r^2}&=\frac{6{,}67\times10^{-11}\times(2{,}0\times10^{-4})^2}{(3{,}0\times10^{-2})^2}\\&\approx3\times10^{-15}\ \text{N}\end{aligned}$$</div></li>
      <li>Ce qu'il a fallu pour électriser une bille : \(q/e \approx 1{,}2\times10^{11}\) électrons arrachés, alors qu'elle en contient environ \(6{,}5\times10^{22}\). Un électron sur 500 milliards suffit.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier de convertir les nanocoulombs et les centimètres en unités SI, ou oublier le carré de la distance. Un contrôle rapide : doubler la distance divise la force par quatre.</div>
  <div class="notice"><strong>Exigible dès la PTSI</strong> : évaluer l'ordre de grandeur d'une force électrique et la comparer au poids ou à la force de gravitation (chapitre « Particules chargées — Lorentz »).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CHAMP ÉLECTROSTATIQUE</div>
  <h2>Le champ, ou ce que créent les charges en chaque point</h2>
  <div class="intro">Plutôt que de recalculer une force pour chaque charge que l'on approche, on décrit une fois pour toutes l'effet des charges sources par un champ de vecteurs \(\vec E\). La force subie par n'importe quelle charge s'en déduit par une simple multiplication.</div>

  <div class="def-box">
    <strong>Champ électrostatique.</strong> Une charge \(q\) placée en \(M\) subit la force \(\vec F = q\,\vec E(M)\). Le champ \(\vec E(M)\), en V·m⁻¹ (ou N·C⁻¹), ne dépend que des charges sources et du point \(M\), pas de la charge \(q\) qui le subit. Une charge ponctuelle \(q_1\) placée en \(P\) crée le champ
    <div class="formula" data-nom="Champ d'une charge ponctuelle">$$\begin{aligned}\vec E(M)&=\frac{q_1}{4\pi\varepsilon_0}\,\frac{\overrightarrow{PM}}{PM^3}\\&=\frac{q_1}{4\pi\varepsilon_0\,r^2}\,\vec u_{P\to M}\end{aligned}$$</div>
    radial, dirigé vers l'extérieur si \(q_1 \gt 0\) et vers la charge si \(q_1 \lt 0\).
  </div>
  <div class="prop-box">
    <strong>Principe de superposition.</strong> Le champ créé par plusieurs charges \(q_i\) placées en \(P_i\) est la somme <strong>vectorielle</strong> des champs que chacune créerait seule :
    <div class="formula" data-nom="Superposition des champs">$$\vec E(M)=\frac{1}{4\pi\varepsilon_0}\sum_i q_i\,\frac{\overrightarrow{P_iM}}{P_iM^3}$$</div>
  </div>

  <h3>Ordres de grandeur</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Situation</th><th style="text-align:left">Champ électrique</th></tr>
    <tr><td>Près du sol, par beau temps (vertical, vers le bas)</td><td>\(\sim 100\ \text{V·m}^{-1}\)</td></tr>
    <tr><td>Au sol, sous un nuage d'orage</td><td>\(\sim 10\ \text{kV·m}^{-1}\)</td></tr>
    <tr><td>Entre deux plaques distantes de 1 cm, sous 1 kV</td><td>\(10^{5}\ \text{V·m}^{-1}\)</td></tr>
    <tr><td>Claquage de l'air sec : étincelle</td><td>\(\approx 3\ \text{MV·m}^{-1}\)</td></tr>
    <tr><td>Isolant d'un petit condensateur (10 V sur 1 µm)</td><td>\(10^{7}\ \text{V·m}^{-1}\)</td></tr>
    <tr><td>Champ du noyau d'hydrogène à la distance de l'électron (53 pm)</td><td>\(\approx 5\times10^{11}\ \text{V·m}^{-1}\)</td></tr>
  </table></div>

  <div class="method-box">
    <strong>Exemple — champ de deux charges opposées sur la médiatrice</strong>
    <p>Une charge \(+q\) est en \(A\), une charge \(-q\) en \(B\), avec \(q = 2{,}0\ \text{nC}\) et \(AB = 6{,}0\ \text{cm}\). On cherche le champ en un point \(M\) de la médiatrice de \([AB]\), à \(4{,}0\ \text{cm}\) du milieu \(O\).</p>
    <ol>
      <li>Distances : \(AM = BM = 5{,}0\ \text{cm}\) (triangle rectangle de côtés 3,0 et 4,0 cm). Les deux champs ont donc la même norme :
        <div class="formula">$$\begin{aligned}E_1&=\frac{9{,}0\times10^{9}\times2{,}0\times10^{-9}}{(5{,}0\times10^{-2})^2}\\&=7{,}2\times10^{3}\ \text{V·m}^{-1}\end{aligned}$$</div></li>
      <li>Directions : le champ de \(+q\) s'éloigne de \(A\) (selon \(\overrightarrow{AM}\)) ; celui de \(-q\) pointe vers \(B\) (selon \(\overrightarrow{MB}\)).</li>
      <li>Projection : les composantes perpendiculaires à \(AB\) se compensent ; les composantes parallèles à \(AB\), égales chacune à \(E_1\times\dfrac{3}{5}\), s'ajoutent.</li>
      <li>Résultat : \(E(M) = 2E_1\times0{,}60\), soit \(E(M) \approx 8{,}6\times10^{3}\ \text{V·m}^{-1}\), parallèle à \(AB\) et dirigé de \(A\) vers \(B\).</li>
      <li>Un électron placé en \(M\) subit \(\vec F = -e\vec E\), de norme \(1{,}4\times10^{-15}\ \text{N}\), dirigée vers \(A\) ; son accélération \(eE/m_e \approx 1{,}5\times10^{15}\ \text{m·s}^{-2}\) rend son poids parfaitement négligeable.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§3 · POTENTIEL ET ÉNERGIE POTENTIELLE</div>
  <h2>Un champ qui dérive d'un potentiel</h2>
  <div class="intro">Le travail de la force électrostatique ne dépend pas du chemin suivi. On peut donc lui associer une énergie potentielle, et résumer le champ par une simple fonction scalaire, le potentiel \(V\). C'est l'outil de tous les bilans d'énergie.</div>

  <div class="def-box">
    <strong>Potentiel électrostatique.</strong> Il existe une fonction \(V(M)\), en volts (V), définie à une constante additive près, telle que
    <div class="formula" data-nom="Champ et potentiel">$$\mathrm{d}V=-\vec E\cdot\mathrm{d}\vec\ell\qquad\vec E=-\overrightarrow{\operatorname{grad}}\,V$$</div>
    <div class="formula" data-nom="Tension et circulation">$$V(A)-V(B)=\int_A^B\vec E\cdot\mathrm{d}\vec\ell$$</div>
    La tension \(U_{AB} = V(A)-V(B)\) est la circulation du champ de \(A\) à \(B\). Si \(V\) ne dépend que de \(x\) : \(E_x = -\dfrac{\mathrm{d}V}{\mathrm{d}x}\). Le champ est dirigé vers les potentiels <strong>décroissants</strong>.
  </div>
  <div class="prop-box">
    <strong>Potentiel d'une charge ponctuelle.</strong> Avec la référence \(V = 0\) à l'infini, une charge \(q_1\) placée en \(P\) crée en \(M\), à la distance \(r = PM\), le potentiel
    <div class="formula" data-nom="Potentiel d'une charge ponctuelle">$$V(M)=\frac{q_1}{4\pi\varepsilon_0\,r}$$</div>
    et, pour plusieurs charges \(q_i\) placées en \(P_i\) (superposition) :
    <div class="formula" data-nom="Potentiel de plusieurs charges">$$V(M)=\frac{1}{4\pi\varepsilon_0}\sum_i\frac{q_i}{P_iM}$$</div>
    On vérifie que \(E_r = -\dfrac{\mathrm{d}V}{\mathrm{d}r} = \dfrac{q_1}{4\pi\varepsilon_0 r^2}\). Les potentiels s'ajoutent comme des nombres : c'est beaucoup plus simple que de sommer des vecteurs.
  </div>
  <p><strong>Champ uniforme.</strong> Pour \(\vec E = E\,\vec e_x\) uniforme, \(V(x) = V(0) - E\,x\) : le potentiel décroît linéairement dans le sens du champ. Entre deux plans perpendiculaires au champ, distants de \(\ell\), la tension vaut \(U = E\,\ell\) : on retrouve l'unité V·m⁻¹ du champ.</p>

  <div class="prop-box">
    <strong>Énergie potentielle et travail.</strong> Une charge \(q\) placée en \(M\), dans le champ d'autres charges, possède l'énergie potentielle
    <div class="formula" data-nom="Énergie potentielle électrostatique">$$E_p(M) = q\,V(M)$$</div>
    et la force électrique fournit, de \(A\) à \(B\), le travail
    <div class="formula" data-nom="Travail de la force électrique">$$W_{A\to B} = q\,\big(V(A)-V(B)\big)$$</div>
    Ce travail ne dépend pas du chemin. Si cette force est la seule qui travaille, l'énergie mécanique \(\tfrac12mv^2 + qV\) se conserve. Unité adaptée : l'électron-volt, \(1\ \text{eV} = 1{,}602\times10^{-19}\ \text{J}\), énergie gagnée par une charge \(e\) qui descend une tension de 1 V.
  </div>

  <div class="method-box">
    <strong>Exemple — un potentiel nul n'implique pas un champ nul</strong>
    <p>On reprend les charges \(+q\) et \(-q\) de l'exemple du §2.</p>
    <ol>
      <li>En \(M\), les deux charges sont à 5,0 cm : \(V(M) = \dfrac{1}{4\pi\varepsilon_0}\Big(\dfrac{q}{AM}-\dfrac{q}{BM}\Big) = 0\). Il en est de même en tout point du plan médiateur de \([AB]\) : ce plan est l'équipotentielle \(V = 0\).</li>
      <li>Pourtant, le champ en \(M\) vaut \(8{,}6\times10^{3}\ \text{V·m}^{-1}\). Le champ ne dépend pas de la valeur de \(V\) en un point, mais de la façon dont \(V\) varie autour de ce point.</li>
      <li>Conséquence pratique : amener une charge de l'infini jusqu'en \(M\) ne coûte aucun travail, alors qu'elle y subit une force.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — accélérer une particule α</strong>
    <p>Une particule α (noyau d'hélium, charge \(+2e\), masse \(m = 6{,}64\times10^{-27}\ \text{kg}\)) part sans vitesse d'une grille au potentiel \(U = 3{,}0\ \text{kV}\) et rejoint une grille au potentiel 0. Le poids est négligé.</p>
    <ol>
      <li>Conservation de l'énergie mécanique : \(0 + 2e\,U = \tfrac12mv^2 + 0\). La particule gagne \(2e\times3{,}0\ \text{kV} = 6{,}0\ \text{keV}\), soit \(9{,}6\times10^{-16}\ \text{J}\).</li>
      <li>Vitesse finale :
        <div class="formula">$$\begin{aligned}v=\sqrt{\frac{4eU}{m}}&=\sqrt{\frac{4\times1{,}602\times10^{-19}\times3{,}0\times10^{3}}{6{,}64\times10^{-27}}}\\&\approx5{,}4\times10^{5}\ \text{m·s}^{-1}\end{aligned}$$</div>
      </li>
      <li>Contrôles : la particule, positive, va vers le potentiel le plus bas ; \(v/c \approx 2\times10^{-3}\), le calcul non relativiste convient. Un proton (\(+e\), quatre fois plus léger) gagnerait deux fois moins d'énergie mais irait plus vite : \(7{,}6\times10^{5}\ \text{m·s}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : se tromper de signe. Une charge positive libre se dirige vers les potentiels bas, un électron vers les potentiels hauts ; et \(W_{A\to B} = q\,(V(A)-V(B))\), pas \(q\,(V(B)-V(A))\).</div>
  <div class="notice"><strong>Exigible dès la PTSI</strong> : effectuer un bilan énergétique pour obtenir la vitesse d'une particule chargée accélérée par une différence de potentiel, \(\tfrac12mv^2 = |q|U\) pour une particule partie du repos (chapitre « Particules chargées — Lorentz »).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LIGNES DE CHAMP ET ÉQUIPOTENTIELLES</div>
  <h2>Lire une carte de champ</h2>
  <div class="intro">Une carte de champ superpose deux familles de courbes : les lignes de champ, qui montrent la direction et le sens de \(\vec E\), et les équipotentielles. Sans calcul, elle dit où le champ est intense, où il s'annule et dans quel sens une charge sera poussée.</div>

  <div class="def-box">
    <strong>Ligne de champ</strong> : courbe tangente en chacun de ses points au champ \(\vec E\), orientée dans le sens de \(\vec E\). <strong>Équipotentielle</strong> : surface sur laquelle \(V\) est constant ; dans un plan de coupe, elle apparaît comme une courbe.
  </div>
  <div class="prop-box">
    <strong>Propriétés des cartes de champ électrostatique.</strong>
    <ul>
      <li>Les lignes partent des charges positives et aboutissent aux charges négatives ou à l'infini. Aucune n'est fermée sur elle-même : sur un tour d'une telle ligne, la force \(q\vec E\) ferait un travail positif, alors que \(W_{A\to A} = q\,(V(A)-V(A)) = 0\).</li>
      <li>Deux lignes ne se coupent qu'en un point où le champ est nul (ou sur une charge).</li>
      <li>Les lignes de champ coupent les équipotentielles à angle droit : le long d'une équipotentielle, \(\mathrm{d}V = -\vec E\cdot\mathrm{d}\vec\ell = 0\).</li>
      <li>Le champ va des hauts potentiels vers les bas potentiels, et \(E \approx \dfrac{\Delta V}{\Delta n}\), où \(\Delta n\) est la distance entre deux équipotentielles voisines : là où elles se resserrent (et où les lignes se resserrent), le champ est intense.</li>
      <li>Par convention, le nombre de lignes tracées à partir d'une charge est proportionnel à sa valeur absolue.</li>
    </ul>
  </div>

<figcaption>Charges +4q (à gauche) et −q (à droite), distantes de 2a. Traits pleins orientés : lignes de champ, tracées en nombre proportionnel au flux ; sur les 16 lignes issues de +4q, 4 aboutissent sur −q, les autres partent à l'infini. Tirets : équipotentielles ; elles coupent les lignes à angle droit, et l'équipotentielle V = 0 est un cercle qui entoure −q. En N (petit cercle), à la distance 2a au-delà de −q (donc à 4a de +4q), les champs des deux charges se compensent : le champ y est nul.</figcaption>
</figure>
  <p>Sur cette carte, la charge \(+4q\) l'emporte : vu de loin, l'ensemble ressemble à une charge ponctuelle \(+3q\), dont les lignes s'en vont radialement à l'infini. Le point de champ nul \(N\) se trouve sur l'axe, au-delà de la petite charge, là où les deux contributions ont même norme et des sens opposés : \(\dfrac{4q}{(4a)^2} = \dfrac{q}{(2a)^2}\). Entre les charges, les deux champs sont de même sens et ne peuvent pas se compenser. L'onglet <strong>Simulateur</strong> trace de telles cartes (charge seule, deux charges opposées, deux charges positives) : faire varier les charges et suivre le déplacement du point de champ nul.</p>

  <div class="method-box">
    <strong>Exemple — estimer un champ sur une carte</strong>
    <p>Près d'un point \(P\), deux équipotentielles voisines, à 50 V et 40 V, sont distantes de 2,5 mm.</p>
    <ol>
      <li>Norme : \(E \approx \dfrac{50-40}{2{,}5\times10^{-3}} = 4{,}0\times10^{3}\ \text{V·m}^{-1}\).</li>
      <li>Direction et sens : perpendiculaire aux deux équipotentielles, de l'équipotentielle 50 V vers l'équipotentielle 40 V.</li>
      <li>Énergie : un proton qui passe de la première à la seconde gagne 10 eV d'énergie cinétique, quel que soit son chemin ; un électron qui ferait le même trajet en perdrait 10 eV.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre ligne de champ et trajectoire. La force est tangente à la ligne de champ, mais une charge lâchée sans vitesse ne suit pas exactement une ligne courbe : son inertie l'en écarte.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CONDENSATEUR PLAN</div>
  <h2>Deux armatures en regard : un champ uniforme</h2>
  <div class="intro">Le condensateur plan est la façon la plus simple de créer un champ électrostatique uniforme, et c'est le composant que l'électrocinétique caractérise par sa capacité \(C\). Sa seule géométrie détermine cette capacité.</div>

  <div class="def-box">
    <strong>Condensateur plan.</strong> Deux armatures planes et parallèles, d'aire \(S\), séparées par une épaisseur \(e\) de vide ou d'air (notée \(d\) dans de nombreux énoncés), portent les charges \(+Q\) et \(-Q\), réparties avec les densités surfaciques \(\pm\sigma = \pm Q/S\). On néglige les effets de bord, ce qui suppose \(e \ll \sqrt S\).
  </div>
  <div class="prop-box">
    <strong>Champ, capacité, énergie</strong> (résultats établis en 2ᵉ année, voir la dernière section).
    <ul>
      <li>Entre les armatures, le champ est uniforme, perpendiculaire aux armatures, dirigé de \(+Q\) vers \(-Q\) : \(E = \dfrac{\sigma}{\varepsilon_0} = \dfrac{U}{e}\), où \(U = V_+ - V_-\). À l'extérieur, il est nul.</li>
      <li>Capacité (\(Q = CU\)) :
        <div class="formula" data-nom="Capacité du condensateur plan">$$C=\frac{\varepsilon_0\,S}{e}$$</div></li>
      <li>Énergie stockée, localisée dans le champ avec la densité volumique \(w_e\) (J·m⁻³) :
        <div class="formula" data-nom="Énergie d'un condensateur">$$W_e=\frac12\,CU^2=\frac{Q^2}{2C}$$</div>
        <div class="formula" data-nom="Densité d'énergie électrique">$$w_e=\frac{\varepsilon_0E^2}{2}$$</div>
        Vérification : \(\dfrac{\varepsilon_0}{2}\Big(\dfrac{U}{e}\Big)^2\times Se = \dfrac12\,\dfrac{\varepsilon_0S}{e}\,U^2\).</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Exemple — ordres de grandeur d'un condensateur à air</strong>
    <p>Armatures carrées de 20 cm de côté (\(S = 4{,}0\times10^{-2}\ \text{m}^2\)), écartées de \(e = 0{,}50\ \text{mm}\), sous \(U = 1{,}0\ \text{kV}\).</p>
    <ol>
      <li>Capacité :
        <div class="formula">$$\begin{aligned}C&=\frac{8{,}85\times10^{-12}\times0{,}040}{5{,}0\times10^{-4}}\\&\approx7{,}1\times10^{-10}\ \text{F}\end{aligned}$$</div>
        soit \(C \approx 0{,}71\ \text{nF}\).</li>
      <li>Champ : \(E = U/e = 2{,}0\times10^{6}\ \text{V·m}^{-1}\), déjà les deux tiers du champ de claquage de l'air. La tension ne doit pas dépasser \(3\times10^{6}\times5{,}0\times10^{-4} \approx 1{,}5\ \text{kV}\).</li>
      <li>Charge : \(Q = CU \approx 0{,}71\ \mu\text{C}\), soit \(\sigma = Q/S \approx 18\ \mu\text{C·m}^{-2}\) (on vérifie \(\sigma = \varepsilon_0E\)).</li>
      <li>Énergie : \(W_e = \tfrac12CU^2 \approx 3{,}5\times10^{-4}\ \text{J}\).</li>
      <li>Pour obtenir \(1\ \mu\text{F}\) avec de l'air et le même écartement, il faudrait \(S = Ce/\varepsilon_0 \approx 56\ \text{m}^2\). Les condensateurs réels enroulent un film isolant très mince : avec 5 µm de plastique de permittivité relative \(\varepsilon_r \approx 3{,}3\) (\(\varepsilon_0\) est alors remplacé par \(\varepsilon_0\varepsilon_r\), résultat admis), il suffit de 0,17 m², un ruban de 3 cm sur 5,7 m.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier de convertir les cm² en m² et les mm en m ; croire que \(C\) dépend de \(U\) ou de \(Q\) (elle ne dépend que de la géométrie et de l'isolant) ; oublier que la charge totale du condensateur est nulle (\(Q\) désigne la charge de l'armature positive).</div>
  <div class="notice"><strong>Exigible dès la PTSI</strong> : la relation \(q = Cu_C\), l'énergie stockée \(\mathcal E_C = \tfrac12Cu_C^2\) et les ordres de grandeur des capacités (du picofarad au millifarad), vues en électrocinétique ; le calcul de \(C\) à partir de la géométrie relève de la 2ᵉ année.</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · CE QUE LA 2ᵉ ANNÉE AJOUTE</div>
  <h2>Symétries, flux et théorème de Gauss</h2>
  <div class="intro">En 2ᵉ année, l'étude s'étend aux distributions continues de charges (en volume, en surface, le long d'un fil) et s'appuie sur deux outils : l'analyse des symétries et le théorème de Gauss. Voici les énoncés et les résultats, établis dans le chapitre <a href="#estat2a/cours">« Électrostatique : champ, potentiel, théorème de Gauss »</a> (§3, §5, §6).</div>

  <p><strong>Symétries.</strong> Le champ a au moins les symétries de ses sources : en un point d'un plan de symétrie de la distribution, \(\vec E\) est contenu dans ce plan ; en un point d'un plan d'antisymétrie (qui échange \(+q\) et \(-q\)), il lui est perpendiculaire. Exemple : sur la médiatrice de l'exemple du §2, le plan médiateur est d'antisymétrie, et le champ lui est bien perpendiculaire.</p>
  <div class="prop-box">
    <strong>Théorème de Gauss.</strong> Le flux du champ électrostatique sortant de toute surface fermée \(\Sigma\) (normale \(\vec n\) orientée vers l'extérieur) ne dépend que de la charge \(Q_{\text{int}}\) qu'elle contient :
    <div class="formula" data-nom="Théorème de Gauss">$$\oint_{\Sigma}\vec E\cdot\vec n\,\mathrm{d}S=\frac{Q_{\text{int}}}{\varepsilon_0}$$</div>
    Le théorème est toujours vrai, mais il ne donne le champ que si les symétries rendent \(E\) constant sur la surface choisie.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Distribution</th><th style="text-align:left">Champ (norme)</th></tr>
    <tr><td>Boule de rayon \(R\), charge \(Q\) uniforme en volume</td><td>\(\dfrac{Q\,r}{4\pi\varepsilon_0R^3}\) dedans, \(\dfrac{Q}{4\pi\varepsilon_0r^2}\) dehors</td></tr>
    <tr><td>Sphère de rayon \(R\), charge \(Q\) uniforme en surface</td><td>\(0\) dedans, \(\dfrac{Q}{4\pi\varepsilon_0r^2}\) dehors</td></tr>
    <tr><td>Fil infini de charge linéique \(\lambda\)</td><td>\(\dfrac{\lambda}{2\pi\varepsilon_0r}\), radial</td></tr>
    <tr><td>Plan infini de charge surfacique \(\sigma\)</td><td>\(\dfrac{\sigma}{2\varepsilon_0}\) de chaque côté, uniforme</td></tr>
  </table></div>
  <p>À l'extérieur de toute distribution à symétrie sphérique, le champ est celui d'une charge ponctuelle placée au centre et portant la charge totale.</p>

  <div class="method-box">
    <strong>Exemple — retrouver le champ du condensateur plan</strong>
    <ol>
      <li>Chaque armature, assimilée à un plan infini, crée de part et d'autre un champ uniforme de norme \(\sigma/(2\varepsilon_0)\), dirigé en s'éloignant de \(+\sigma\) et en se rapprochant de \(-\sigma\).</li>
      <li>Entre les armatures, les deux champs sont de même sens (de \(+\) vers \(-\)) et s'ajoutent : \(E = \sigma/\varepsilon_0\). À l'extérieur, ils sont opposés et se compensent.</li>
      <li>Avec \(\sigma = 18\ \mu\text{C·m}^{-2}\) (exemple du §5), chaque plan crée \(1{,}0\ \text{MV·m}^{-1}\) et le champ total vaut bien \(2{,}0\ \text{MV·m}^{-1}\).</li>
    </ol>
  </div>
  <p><strong>Hors programme, en PTSI comme en PT</strong> (pour aller plus loin) : le dipôle électrostatique (charges \(+q\) et \(-q\) très proches, de moment \(p = q\,\ell\)), dont le potentiel lointain décroît en \(1/r^2\) et le champ en \(1/r^3\) ; les conducteurs en équilibre, qui sont équipotentiels.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉLECTROSTATIQUE (APERÇU)</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Six savoir-faire pour aborder l'électrostatique : sommer des champs et des potentiels, comparer la force électrique au poids, faire un bilan d'énergie, lire une carte de champ et exploiter le condensateur plan. Les méthodes 2 et 4 sont déjà exigibles en PTSI (chapitre « Particules chargées — Lorentz ») ; les autres préparent la 2ᵉ année.</div>

  <div class="method-box"><strong>Méthode 1 — Calculer un champ ou une force par superposition</strong>
    <ol>
      <li><span class="step">Schéma.</span> Placer les charges sources, le point \(M\) et un repère ; noter les distances \(r_i = P_iM\).</li>
      <li><span class="step">Contributions.</span> Pour chaque charge : norme \(\dfrac{|q_i|}{4\pi\varepsilon_0 r_i^2}\), direction \(P_iM\), sens qui s'éloigne de la charge si \(q_i \gt 0\) et qui pointe vers elle si \(q_i \lt 0\).</li>
      <li><span class="step">Symétries d'abord.</span> Repérer les composantes qui se compensent (deux charges égales ou opposées vues sous le même angle) : on ne calcule que celles qui restent.</li>
      <li><span class="step">Projeter et sommer.</span> Projeter chaque vecteur sur la base, additionner composante par composante, puis donner la norme et la direction du résultat.</li>
      <li><span class="step">Force.</span> \(\vec F = q\,\vec E(M)\) : de même sens que \(\vec E\) si \(q \gt 0\), de sens opposé si \(q \lt 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(q_1 = +2{,}0\ \text{nC}\) en \(O\), \(q_2 = -1{,}0\ \text{nC}\) en \(B(4{,}0\ \text{cm} ; 0)\), point \(M(0 ; 3{,}0\ \text{cm})\), donc \(BM = 5{,}0\ \text{cm}\). \(q_1\) crée \(E_1 = 2{,}0\times10^{4}\ \text{V·m}^{-1}\) selon \(+\vec e_y\) ; \(q_2\) crée \(E_2 = 3{,}6\times10^{3}\ \text{V·m}^{-1}\) dirigé de \(M\) vers \(B\), de composantes \((0{,}8\,E_2 ; -0{,}6\,E_2)\). Somme : \(E_x \approx 2{,}9\times10^{3}\) et \(E_y \approx 1{,}78\times10^{4}\ \text{V·m}^{-1}\), soit \(E \approx 1{,}8\times10^{4}\ \text{V·m}^{-1}\), incliné de 9° vers \(B\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : additionner les normes, ou oublier qu'une charge négative <em>attire</em> la charge d'essai positive (son champ pointe vers elle). Contrôle : loin de toutes les charges, le champ doit ressembler à celui d'une charge ponctuelle égale à la charge totale.</div>

  <div class="method-box"><strong>Méthode 2 — Comparer la force électrique au poids</strong>
    <ol>
      <li><span class="step">Force électrique.</span> \(F_e = |q|\,E\) (ou la loi de Coulomb entre deux charges).</li>
      <li><span class="step">Poids.</span> \(P = mg\), avec la masse de la particule ou de l'objet.</li>
      <li><span class="step">Rapport.</span> Calculer \(F_e/P\) : s'il dépasse \(10^{3}\) environ, le poids est négligeable ; s'il est de l'ordre de 1, les deux forces comptent.</li>
      <li><span class="step">Gravitation entre charges.</span> Entre deux objets chargés, l'attraction gravitationnelle est presque toujours négligeable devant la force de Coulomb (rapport \(\approx 2\times10^{39}\) entre un proton et un électron).</li>
    </ol>
    <p><em>Exemple éclair :</em> dans le champ de beau temps \(E = 100\ \text{V·m}^{-1}\), un électron subit \(eE = 1{,}6\times10^{-17}\ \text{N}\) pour un poids \(m_eg = 8{,}9\times10^{-30}\ \text{N}\) : rapport \(2\times10^{12}\). Pour un proton, \(m_pg = 1{,}6\times10^{-26}\ \text{N}\) et le rapport vaut encore \(10^{9}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : généraliser « le poids est négligeable » à tout objet chargé. Pour une gouttelette ou une poussière qui ne porte que quelques charges élémentaires, \(mg\) et \(|q|E\) peuvent être du même ordre (exercice 2).</div>

  <div class="method-box"><strong>Méthode 3 — Calculer un potentiel, une tension, un travail</strong>
    <ol>
      <li><span class="step">Référence.</span> Pour un ensemble borné de charges, \(V = 0\) à l'infini.</li>
      <li><span class="step">Somme algébrique.</span> \(V(M) = \dfrac{1}{4\pi\varepsilon_0}\displaystyle\sum_i \dfrac{q_i}{r_i}\) : charges avec leur signe, distances seulement, aucune projection.</li>
      <li><span class="step">Tension.</span> \(U_{AB} = V(A)-V(B)\) ; dans un champ uniforme, \(U = E\,\ell\), où \(\ell\) est la distance parcourue dans le sens du champ.</li>
      <li><span class="step">Travail.</span> \(W_{A\to B} = q\,(V(A)-V(B))\), indépendant du chemin, nul le long d'une équipotentielle.</li>
      <li><span class="step">Retour au champ.</span> \(E_x = -\dfrac{\mathrm{d}V}{\mathrm{d}x}\) : le champ pointe vers les potentiels décroissants.</li>
    </ol>
    <p><em>Exemple éclair :</em> mêmes charges qu'à la méthode 1 (\(OM = 3{,}0\ \text{cm}\), \(BM = 5{,}0\ \text{cm}\)) : \(q_1\) contribue pour \(\dfrac{9{,}0\times10^{9}\times2{,}0\times10^{-9}}{0{,}030} = 600\ \text{V}\), \(q_2\) pour \(-180\ \text{V}\), d'où \(V(M) = 420\ \text{V}\). Pour amener \(q' = 1{,}0\ \text{nC}\) de l'infini en \(M\), la force électrique fournit \(q'\,(0-420) = -4{,}2\times10^{-7}\ \text{J}\) : l'opérateur doit fournir \(+4{,}2\times10^{-7}\ \text{J}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : projeter les potentiels comme des vecteurs, oublier le signe des charges, ou conclure \(\vec E = \vec 0\) là où \(V = 0\) (le milieu de deux charges opposées a un potentiel nul et un champ non nul).</div>

  <div class="method-box"><strong>Méthode 4 — Faire un bilan d'énergie pour une particule accélérée</strong>
    <ol>
      <li><span class="step">Système et forces.</span> Particule de charge \(q\) et de masse \(m\) dans un référentiel galiléen ; la force électrique dérive de \(E_p = qV\), le poids est négligé (méthode 2).</li>
      <li><span class="step">Conservation.</span> \(\tfrac12mv_A^2 + qV(A) = \tfrac12mv_B^2 + qV(B)\).</li>
      <li><span class="step">Particule partie du repos.</span> \(\tfrac12mv_B^2 = q\,(V(A)-V(B))\), qui doit être positif : une charge positive descend les potentiels, un électron les remonte ; on écrit alors \(\tfrac12mv^2 = |q|\,U\).</li>
      <li><span class="step">Électron-volt.</span> Une charge \(\pm e\) qui franchit une tension \(U\) gagne \(U\) électron-volts (\(1\ \text{eV} = 1{,}602\times10^{-19}\ \text{J}\)).</li>
      <li><span class="step">Contrôle.</span> \(v\) doit rester petite devant \(c\) (moins de 10 % environ) pour que le calcul classique soit valable.</li>
    </ol>
    <p><em>Exemple éclair :</em> électron parti du repos, accéléré sous \(U = 150\ \text{V}\) : il gagne \(150\ \text{eV} = 2{,}4\times10^{-17}\ \text{J}\), et \(v = \sqrt{2eU/m_e} \approx 7{,}3\times10^{6}\ \text{m·s}^{-1}\), soit 2,4 % de \(c\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(\tfrac12mv^2 = qU\) avec \(q = -e\) et trouver une énergie cinétique négative ; ou confondre la tension franchie avec le potentiel de l'électrode d'arrivée (ils ne coïncident que si le départ est au potentiel 0).</div>

  <div class="method-box"><strong>Méthode 5 — Lire une carte de lignes de champ et d'équipotentielles</strong>
    <ol>
      <li><span class="step">Charges.</span> Les lignes partent des charges positives et arrivent aux charges négatives ; une charge d'où partent plus de lignes est plus grande en valeur absolue ; un point de champ nul entre deux charges de même signe est plus proche de la plus petite.</li>
      <li><span class="step">Direction et sens.</span> \(\vec E\) est tangent aux lignes, orienté comme elles, perpendiculaire aux équipotentielles, dirigé vers les potentiels décroissants.</li>
      <li><span class="step">Intensité.</span> \(E \approx \dfrac{\Delta V}{\Delta n}\) entre deux équipotentielles voisines : le champ est intense là où elles se resserrent.</li>
      <li><span class="step">Points singuliers.</span> Un point de champ nul se repère aux lignes qui s'y écartent en croix et à une équipotentielle qui s'y recoupe.</li>
      <li><span class="step">Cohérence.</span> Un plan de symétrie des charges contient les lignes qui le rencontrent ; un plan d'antisymétrie est traversé à angle droit et, si \(V(\infty) = 0\), c'est l'équipotentielle \(V = 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> deux équipotentielles voisines, à 220 V et 200 V, sont distantes de 4,0 mm : \(E \approx \dfrac{20}{4{,}0\times10^{-3}} = 5{,}0\times10^{3}\ \text{V·m}^{-1}\), dirigé de l'équipotentielle 220 V vers l'équipotentielle 200 V. Un électron qui va de la seconde à la première gagne 20 eV.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dessiner deux lignes de champ qui se croisent hors d'un point de champ nul, ou confondre une ligne de champ avec la trajectoire d'une charge.</div>

  <div class="method-box"><strong>Méthode 6 — Exploiter le modèle du condensateur plan</strong>
    <ol>
      <li><span class="step">Validité.</span> Vérifier \(e \ll \sqrt S\) : les effets de bord sont alors négligeables.</li>
      <li><span class="step">Champ.</span> \(E = U/e\), uniforme, dirigé de l'armature positive vers la négative, nul à l'extérieur ; densité surfacique \(\sigma = \varepsilon_0E = Q/S\).</li>
      <li><span class="step">Capacité et charge.</span> \(C = \varepsilon_0S/e\) (\(\varepsilon_0\varepsilon_r\) avec un isolant, résultat admis) et \(Q = CU\).</li>
      <li><span class="step">Énergie.</span> \(W_e = \tfrac12CU^2 = \dfrac{Q^2}{2C}\), avec la densité \(w_e = \varepsilon_0E^2/2\) entre les armatures.</li>
      <li><span class="step">Limites et contraintes.</span> \(E\) doit rester sous le champ de claquage (\(\approx 3\ \text{MV·m}^{-1}\) dans l'air). Condensateur isolé : \(Q\) reste constante ; relié à un générateur : \(U\) reste constante.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(S = 50\ \text{cm}^2\), \(e = 0{,}20\ \text{mm}\), \(U = 12\ \text{V}\) : \(C = \dfrac{8{,}85\times10^{-12}\times5{,}0\times10^{-3}}{2{,}0\times10^{-4}} \approx 0{,}22\ \text{nF}\), \(E = 6{,}0\times10^{4}\ \text{V·m}^{-1}\), \(Q \approx 2{,}7\ \text{nC}\), \(W_e \approx 1{,}6\times10^{-8}\ \text{J}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : garder des cm² et des mm dans le calcul de \(C\) ; croire que \(C\) dépend de la tension ; oublier de se demander ce qui reste constant (\(Q\) ou \(U\)) quand on modifie le condensateur.</div>

  <div class="notice"><strong>Pour aller plus loin (2ᵉ année)</strong> : prévoir la direction du champ par les symétries, puis l'obtenir par le théorème de Gauss, sont les méthodes 1 et 3 du chapitre <a href="#estat2a/meth">« Électrostatique : champ, potentiel, théorème de Gauss »</a> ; les exercices 7 et 8 de ce chapitre en donnent un avant-goût.</div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Champ et potentiel d'une charge ponctuelle</h3>
  <div class="statement">Une charge ponctuelle \(Q = +2{,}0\ \mu\text{C}\) est fixée en \(O\), dans l'air. On prend \(\dfrac{1}{4\pi\varepsilon_0} = 9{,}0\times10^{9}\ \text{SI}\) et \(V = 0\) à l'infini. Champ de claquage de l'air : \(3\ \text{MV·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la norme du champ à \(r = 10\ \text{cm}\) de \(O\) ; préciser sa direction et son sens. Comparer au champ de claquage de l'air.</div>
  <div class="q"><strong>Q2.</strong> Calculer le potentiel \(V\) à \(r = 10\ \text{cm}\), puis à \(r = 20\ \text{cm}\).</div>
  <div class="q"><strong>Q3.</strong> Une charge \(q = 1{,}0\ \mu\text{C}\) passe de \(r = 10\ \text{cm}\) à \(r = 20\ \text{cm}\). Calculer le travail de la force électrique. Dépend-il du chemin suivi ? Interpréter son signe.</div>
  <div class="q"><strong>Q4.</strong> À quelle distance de \(O\) le champ de cette charge ne vaut-il plus que \(100\ \text{V·m}^{-1}\), la valeur du champ atmosphérique par beau temps ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le champ d'une charge ponctuelle est radial ; \(Q \gt 0\), il est donc dirigé de \(O\) vers l'extérieur. Sa norme, en convertissant les centimètres en mètres :</p>
    <div class="formula">$$E=\frac{Q}{4\pi\varepsilon_0r^2}=\frac{9{,}0\times10^{9}\times2{,}0\times10^{-6}}{(0{,}10)^2}=1{,}8\times10^{6}\ \text{V·m}^{-1}$$</div>
    <p>C'est déjà 60 % du champ de claquage : un microcoulomb concentré dans un petit volume est une charge considérable à l'échelle du laboratoire.</p>
    <p><strong>Q2.</strong> \(V(r)=\dfrac{Q}{4\pi\varepsilon_0r}\) : \(V(10\ \text{cm}) = 1{,}8\times10^{5}\ \text{V} = 180\ \text{kV}\) et \(V(20\ \text{cm}) = 90\ \text{kV}\). Le potentiel décroît en \(1/r\), moins vite que le champ (en \(1/r^2\)).</p>
    <p><strong>Q3.</strong> La force électrique dérive de l'énergie potentielle \(qV\) : son travail ne dépend que des points de départ et d'arrivée, quel que soit le chemin :</p>
    <div class="formula">$$W=q\,\big(V(A)-V(B)\big)=1{,}0\times10^{-6}\times(180-90)\times10^{3}=9{,}0\times10^{-2}\ \text{J}$$</div>
    <p> Il est positif : les deux charges, de même signe, se repoussent, et la force accompagne le déplacement vers l'extérieur ; l'énergie potentielle perdue peut devenir de l'énergie cinétique.</p>
    <p><strong>Q4.</strong> On résout \(\dfrac{Q}{4\pi\varepsilon_0r^2} = 100\ \text{V·m}^{-1}\) :</p>
    <div class="formula">$$r=\sqrt{\frac{9{,}0\times10^{9}\times2{,}0\times10^{-6}}{100}}=\sqrt{180}\ \text{m}\approx13\ \text{m}$$</div>
    <p>Le champ décroît vite, mais une charge de cette taille domine encore le champ atmosphérique à plus de dix mètres.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Une gouttelette d'huile en lévitation</h3>
  <div class="statement"><em>Savoir-faire exigible dès la PTSI.</em> Entre deux plaques horizontales distantes de \(d = 8{,}0\ \text{mm}\) règne un champ uniforme vertical \(E = U/d\). Une gouttelette d'huile sphérique, de rayon \(r = 1{,}0\ \mu\text{m}\) et de masse volumique \(\rho = 900\ \text{kg·m}^{-3}\), porte trois électrons en excès (\(q = -3e\)). Données : \(e = 1{,}6\times10^{-19}\ \text{C}\), \(m_e = 9{,}1\times10^{-31}\ \text{kg}\), \(g = 9{,}8\ \text{m·s}^{-2}\), masse volumique de l'air \(1{,}2\ \text{kg·m}^{-3}\). On néglige la résistance de l'air pour une gouttelette immobile.</div>
  <div class="q"><strong>Q1.</strong> Calculer la masse et le poids de la gouttelette.</div>
  <div class="q"><strong>Q2.</strong> Quel doit être le sens du champ pour que la gouttelette puisse rester immobile ? Laquelle des deux plaques doit être au potentiel le plus élevé ?</div>
  <div class="q"><strong>Q3.</strong> Calculer le champ \(E\) puis la tension \(U\) nécessaires.</div>
  <div class="q"><strong>Q4.</strong> La gouttelette capture un électron de plus, la tension restant la même. Que se passe-t-il ? Calculer son accélération juste après la capture.</div>
  <div class="q"><strong>Q5.</strong> Justifier qu'on néglige la poussée d'Archimède. Dans le même champ, comparer la force électrique et le poids d'un électron isolé : pourquoi le poids compte-t-il pour la gouttelette ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Masse d'une sphère de rayon \(r\) :</p>
    <div class="formula">$$m=\tfrac43\pi r^3\rho=\tfrac43\pi\times(1{,}0\times10^{-6})^3\times900\approx3{,}8\times10^{-15}\ \text{kg}$$</div>
    <p>d'où le poids \(P = mg \approx 3{,}7\times10^{-14}\ \text{N}\).</p>
    <p><strong>Q2.</strong> Pour compenser le poids, la force électrique \(\vec F = q\vec E\) doit être verticale vers le haut. Comme \(q \lt 0\), le champ doit être dirigé <strong>vers le bas</strong>. Le champ allant des hauts vers les bas potentiels, la plaque du haut doit être au potentiel le plus élevé (plaque positive).</p>
    <p><strong>Q3.</strong> Équilibre : \(3eE = mg\), d'où</p>
    <div class="formula">$$E=\frac{mg}{3e}=\frac{3{,}7\times10^{-14}}{3\times1{,}6\times10^{-19}}\approx7{,}7\times10^{4}\ \text{V·m}^{-1}\qquad U=Ed\approx6{,}2\times10^{2}\ \text{V}$$</div>
    <p><strong>Q4.</strong> La charge devient \(-4e\) : la force électrique vaut \(4eE = \tfrac43mg\), vers le haut. La résultante, \(\tfrac13mg\), est dirigée vers le haut : la gouttelette monte, avec une accélération initiale \(g/3 \approx 3{,}3\ \text{m·s}^{-2}\) ; la résistance de l'air limite ensuite très vite sa vitesse. Avec un électron de moins (\(-2e\)), elle descendrait avec l'accélération initiale \(g/3\). Observer ces sauts, toujours d'un nombre entier de charges \(e\), est le principe de l'expérience de Millikan, qui a établi la quantification de la charge.</p>
    <p><strong>Q5.</strong> La poussée d'Archimède est \(\rho_{\text{air}}/\rho = 1{,}2/900 \approx 1{,}3\times10^{-3}\) fois le poids : négligeable. Pour un électron dans le même champ, son poids ne compte pas :</p>
    <div class="formula">$$\frac{eE}{m_eg}=\frac{1{,}6\times10^{-19}\times7{,}7\times10^{4}}{9{,}1\times10^{-31}\times9{,}8}\approx1{,}4\times10^{15}$$</div>
    <p> La gouttelette, elle, est environ \(4\times10^{15}\) fois plus lourde qu'un électron mais ne porte que trois charges : son poids et la force électrique sont du même ordre. Le « poids négligeable » des particules chargées n'est jamais automatique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Deux charges : champ nul et potentiel nul</h3>
  <div class="statement">Deux charges ponctuelles sont fixées sur un axe \((Ox)\) : \(q_1 = +4q\) en \(A\) (\(x = 0\)) et \(q_2 = -q\) en \(B\) (\(x = d\)), avec \(q \gt 0\). On note \(k = \dfrac{1}{4\pi\varepsilon_0}\) et l'on prend \(V = 0\) à l'infini. On ne s'intéresse qu'aux points de l'axe.</div>
  <div class="q"><strong>Q1.</strong> Montrer que le champ ne peut s'annuler ni entre \(A\) et \(B\), ni pour \(x \lt 0\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer la position du point \(N\) où le champ est nul.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les points de l'axe où le potentiel est nul.</div>
  <div class="q"><strong>Q4.</strong> Le champ nul et le potentiel nul sont-ils atteints aux mêmes points ? Calculer \(V(N)\) et le champ aux points de potentiel nul.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On raisonne sur les sens avant tout calcul. Entre \(A\) et \(B\), le champ de \(+4q\) s'éloigne de \(A\) (sens \(+x\)) et celui de \(-q\) pointe vers \(B\) (sens \(+x\) aussi) : ils s'ajoutent. Pour \(x \lt 0\), les deux champs sont opposés, mais le point est plus proche de la plus grande charge : \(\dfrac{4kq}{x^2} \gt \dfrac{kq}{(d-x)^2}\) puisque \(|x| \lt d - x\). Le champ ne s'annule donc pas.</p>
    <p><strong>Q2.</strong> Reste la région \(x \gt d\), au-delà de la petite charge : les champs y sont opposés et la grande charge est plus loin. Égalité des normes : \(\dfrac{4}{x^2} = \dfrac{1}{(x-d)^2}\), soit \(2(x-d) = x\) et \(\boxed{x_N = 2d}\). L'équation élevée au carré a une autre solution, \(x = 2d/3\), située entre les charges : elle est à rejeter (les normes y sont égales, mais les champs s'ajoutent). C'est le piège classique de ce calcul.</p>
    <p><strong>Q3.</strong> \(V(x) = k\Big(\dfrac{4q}{|x|} - \dfrac{q}{|x-d|}\Big) = 0\) impose \(|x| = 4\,|x-d|\). Entre les charges : \(x = 4(d-x)\), d'où \(x = 0{,}8\,d\). Au-delà de \(B\) : \(x = 4(x-d)\), d'où \(x = \tfrac43d\). Pour \(x \lt 0\) : \(-x = 4(d-x)\) donnerait \(x = \tfrac43d \gt 0\), contradiction. Deux points : \(x = 0{,}8\,d\) et \(x = \tfrac43d\).</p>
    <p><strong>Q4.</strong> Non. En \(N\) : \(V(N) = k\Big(\dfrac{4q}{2d}-\dfrac{q}{d}\Big) = \dfrac{kq}{d} \neq 0\). Aux points de potentiel nul, le champ n'est pas nul :</p>
    <div class="formula">$$E_x(0{,}8\,d)=\frac{kq}{d^2}\Big(\frac{4}{0{,}64}+\frac{1}{0{,}04}\Big)\approx31\,\frac{kq}{d^2}\qquad E_x\big(\tfrac43d\big)=\frac{kq}{d^2}\Big(\frac{4}{16/9}-\frac{1}{1/9}\Big)=-6{,}75\,\frac{kq}{d^2}$$</div>
    <p>\(V\) est une somme algébrique de scalaires, \(\vec E\) une somme de vecteurs : \(V = 0\) n'entraîne pas \(\vec E = \vec 0\), ni l'inverse. Le champ dépend de la façon dont \(V\) varie autour du point, pas de sa valeur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Spectromètre à temps de vol : séparer les isotopes du lithium</h3>
  <div class="statement"><em>Savoir-faire exigible dès la PTSI.</em> Dans un spectromètre à temps de vol, des ions \(\text{Li}^+\) (charge \(+e\)), produits presque sans vitesse, sont accélérés entre deux grilles distantes de \(\ell = 1{,}0\ \text{cm}\) sous la tension \(U = 2{,}0\ \text{kV}\) ; ils traversent ensuite, à vitesse constante, un tube sans champ de longueur \(L = 1{,}20\ \text{m}\) jusqu'au détecteur. Le lithium naturel contient deux isotopes, \(^6\text{Li}\) (\(m_6 = 6{,}015\ \text{u}\)) et \(^7\text{Li}\) (\(m_7 = 7{,}016\ \text{u}\)), avec \(1\ \text{u} = 1{,}661\times10^{-27}\ \text{kg}\) ; \(e = 1{,}602\times10^{-19}\ \text{C}\). Le poids est négligé.</div>
  <div class="q"><strong>Q1.</strong> Quelle énergie cinétique, en électron-volts puis en joules, les ions acquièrent-ils ? Dépend-elle de l'isotope ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse \(v_7\) des ions \(^7\text{Li}^+\) à la sortie de la zone d'accélération. Le traitement non relativiste est-il justifié ?</div>
  <div class="q"><strong>Q3.</strong> Exprimer la durée \(t\) de traversée du tube en fonction de \(L\), \(m\), \(e\) et \(U\). Calculer \(t_7\), \(t_6\) et leur écart.</div>
  <div class="q"><strong>Q4.</strong> Entre les grilles, le champ est uniforme. Calculer \(E\), l'accélération des ions \(^7\text{Li}^+\) et la durée de la phase d'accélération. Est-il raisonnable de la négliger ?</div>
  <div class="q"><strong>Q5.</strong> Un ion de masse \(14{,}03\ \text{u}\) portant la charge \(+2e\) arriverait-il avant, après ou en même temps qu'un ion \(^7\text{Li}^+\) ? Quelle grandeur l'appareil mesure-t-il réellement ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Seule la force électrique travaille ; elle dérive de \(E_p = eV\). Partis du repos, les ions gagnent \(\Delta E_c = eU\), soit \(2{,}0\ \text{keV}\), ou \(2{,}0\times10^{3}\times1{,}602\times10^{-19} = 3{,}2\times10^{-16}\ \text{J}\). Cette énergie ne dépend que de la charge et de la tension, pas de la masse : les deux isotopes ont la même énergie cinétique, mais pas la même vitesse.</p>
    <p><strong>Q2.</strong> \(\tfrac12m_7v_7^2 = eU\) :</p>
    <div class="formula">$$v_7=\sqrt{\frac{2eU}{m_7}}=\sqrt{\frac{2\times1{,}602\times10^{-19}\times2{,}0\times10^{3}}{7{,}016\times1{,}661\times10^{-27}}}\approx2{,}35\times10^{5}\ \text{m·s}^{-1}$$</div>
    <p>\(v_7/c \approx 8\times10^{-4}\) : la mécanique classique convient largement.</p>
    <p><strong>Q3.</strong> Dans le tube, le mouvement est uniforme : \(t = \dfrac{L}{v} = L\sqrt{\dfrac{m}{2eU}}\). D'où \(t_7 = \dfrac{1{,}20}{2{,}35\times10^{5}} \approx 5{,}12\ \mu\text{s}\), puis \(t_6 = t_7\sqrt{\dfrac{6{,}015}{7{,}016}} \approx 4{,}74\ \mu\text{s}\) : l'isotope léger arrive le premier, avec \(0{,}38\ \mu\text{s}\) d'avance, un écart facile à mesurer électroniquement.</p>
    <p><strong>Q4.</strong> \(E = U/\ell = 2{,}0\times10^{5}\ \text{V·m}^{-1}\). L'accélération est constante : \(a = \dfrac{eE}{m_7} \approx 2{,}8\times10^{12}\ \text{m·s}^{-2}\) (soit \(3\times10^{11}\,g\) : le poids est bien négligeable). Mouvement uniformément accéléré depuis le repos : la vitesse \(v_7\) est atteinte au bout de \(t_{\text{acc}} = v_7/a = 2\ell/v_7 \approx 0{,}085\ \mu\text{s}\), moins de 2 % de \(t_7\). On peut la négliger en première approche ; comme elle varie elle aussi en \(\sqrt m\), elle ne change pas le classement des ions.</p>
    <p><strong>Q5.</strong> La durée \(t = L\sqrt{m/(2qU)}\) ne dépend que du rapport \(m/q\). Or \(\dfrac{14{,}03\ \text{u}}{2e} \approx \dfrac{7{,}016\ \text{u}}{e}\) : les deux ions arrivent pratiquement en même temps. L'appareil mesure le rapport masse sur charge, non la masse seule ; c'est un piège d'interprétation des spectres de masse.</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Quel est le signe de chaque charge ? Laquelle est la plus grande en valeur absolue ? Le justifier de deux façons.</div>
  <div class="q"><strong>Q2.</strong> Que vaut le champ en \(N\) ? En déduire le rapport \(q_B/q_A\).</div>
  <div class="q"><strong>Q3.</strong> Le point \(N\) est sur l'équipotentielle 2,7 kV. En déduire \(q_A\) et \(q_B\).</div>
  <div class="q"><strong>Q4.</strong> Estimer la norme du champ sur l'axe entre les deux équipotentielles citées (à gauche de \(A\)) et préciser son sens. Comparer à la valeur exacte au milieu de cet intervalle, à 0,77 cm à gauche de \(A\).</div>
  <div class="q"><strong>Q5.</strong> Une charge \(q' = +1{,}0\ \text{nC}\) va de \(N\) jusqu'à un point quelconque de l'équipotentielle 1,8 kV. Quel travail la force électrique fournit-elle ?</div>
  <div class="q"><strong>Q6.</strong> Une charge positive placée exactement en \(N\) y est en équilibre. En examinant comment le potentiel varie autour de \(N\), le long de l'axe puis perpendiculairement à l'axe, dire si cet équilibre est stable.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Toutes les lignes partent de \(A\) et de \(B\) et s'en vont à l'infini : les deux charges sont <strong>positives</strong>. \(q_B\) est la plus grande : il part de \(B\) quatre fois plus de lignes (24 contre 6), et le point de champ nul \(N\) est plus proche de \(A\), la plus petite charge (il faut être près d'une petite charge pour que son champ compense celui d'une grande).</p>
    <p><strong>Q2.</strong> Les lignes s'écartent en croix autour de \(N\) : le champ y est nul. Les deux champs, opposés sur l'axe entre deux charges positives, y ont même norme : \(\dfrac{q_A}{AN^2} = \dfrac{q_B}{BN^2}\), d'où \(\dfrac{q_B}{q_A} = \Big(\dfrac{BN}{AN}\Big)^2 = \Big(\dfrac{2{,}0}{1{,}0}\Big)^2 = 4\), en accord avec le décompte des lignes.</p>
    <p><strong>Q3.</strong> Les potentiels s'ajoutent, avec \(q_B = 4q_A\) :</p>
    <div class="formula">$$V(N)=9{,}0\times10^{9}\Big(\frac{q_A}{0{,}010}+\frac{4q_A}{0{,}020}\Big)=9{,}0\times10^{9}\times300\,q_A$$</div>
    <p>Avec \(V(N) = 2{,}7\times10^{3}\ \text{V}\) : \(q_A = 1{,}0\times10^{-9}\ \text{C} = 1{,}0\ \text{nC}\) et \(q_B = 4{,}0\ \text{nC}\).</p>
    <p><strong>Q4.</strong> Entre les deux équipotentielles, \(\Delta V = 0{,}9\ \text{kV}\) sur \(\Delta n = 1{,}00 - 0{,}54 = 0{,}46\ \text{cm}\) : \(E \approx \dfrac{900}{4{,}6\times10^{-3}} \approx 2{,}0\times10^{5}\ \text{V·m}^{-1}\), dirigé de l'équipotentielle 2,7 kV vers l'équipotentielle 1,8 kV, c'est-à-dire en s'éloignant de \(A\). Valeur exacte à 0,77 cm de \(A\) (et 3,77 cm de \(B\)), les deux champs y étant de même sens :</p>
    <div class="formula">$$E=\frac{9{,}0}{(7{,}7\times10^{-3})^2}+\frac{36}{(3{,}77\times10^{-2})^2}\approx1{,}5\times10^{5}+0{,}25\times10^{5}\approx1{,}8\times10^{5}\ \text{V·m}^{-1}$$</div>
    <p>L'estimation est un peu trop forte (10 % environ) : le champ varie beaucoup sur l'intervalle, et \(\Delta V/\Delta n\) n'en donne qu'une moyenne.</p>
    <p><strong>Q5.</strong> Le travail ne dépend que des potentiels de départ et d'arrivée, quel que soit le chemin et quel que soit le point d'arrivée sur l'équipotentielle :</p>
    <div class="formula">$$W=q'\,\big(V(N)-V_{\text{arrivée}}\big)=1{,}0\times10^{-9}\times(2\,700-1\,800)=9{,}0\times10^{-7}\ \text{J}$$</div>
    <p><strong>Q6.</strong> L'énergie potentielle de la charge vaut \(q'V\). Le long de l'axe, \(V\) augmente de part et d'autre de \(N\) (il devient infini sur chacune des charges) : pour un petit déplacement axial, la charge est ramenée vers \(N\). Perpendiculairement à l'axe, \(V\) diminue quand on s'éloigne de \(N\) (l'équipotentielle 2,7 kV se recoupe en \(N\), qui est un col du potentiel) : un petit écart latéral fait baisser l'énergie potentielle, et la charge s'échappe. L'équilibre est <strong>instable</strong>. On montre en 2ᵉ année qu'une charge ne peut jamais être en équilibre stable sous l'effet des seules forces électrostatiques.</p>
  </div>
</div>

  <h3>Condensateur plan : capacité, énergie, claquage</h3>
  <div class="statement">Un condensateur plan a des armatures d'aire \(S = 100\ \text{cm}^2\), séparées par une épaisseur \(d = 2{,}0\ \text{mm}\) d'air (assimilé au vide). Il est chargé sous la tension \(U = 100\ \text{V}\). On néglige les effets de bord. Données : \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\) ; champ de claquage de l'air : \(3{,}0\ \text{MV·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la capacité \(C\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le champ \(E\) entre les armatures, la charge \(Q\) de l'armature positive et la densité surfacique \(\sigma\).</div>
  <div class="q"><strong>Q3.</strong> Calculer l'énergie stockée de deux façons : à partir de \(C\) et \(U\), puis à partir de la densité d'énergie \(w_e\).</div>
  <div class="q"><strong>Q4.</strong> Quelle tension maximale peut-on appliquer à ce condensateur ?</div>
  <div class="q"><strong>Q5.</strong> On débranche le générateur, puis on écarte les armatures jusqu'à la distance \(2d\). Que deviennent \(Q\), \(E\), \(C\), \(U\) et l'énergie stockée ? D'où vient l'énergie supplémentaire ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'écartement (2 mm) est petit devant la taille des armatures (10 cm) : le modèle du condensateur plan s'applique. Avec \(S = 1{,}0\times10^{-2}\ \text{m}^2\) :</p>
    <div class="formula">$$C=\frac{\varepsilon_0S}{d}=\frac{8{,}85\times10^{-12}\times1{,}0\times10^{-2}}{2{,}0\times10^{-3}}\approx4{,}4\times10^{-11}\ \text{F}=44\ \text{pF}$$</div>
    <p><strong>Q2.</strong> \(E = U/d = 5{,}0\times10^{4}\ \text{V·m}^{-1}\) ; \(Q = CU \approx 4{,}4\ \text{nC}\) ; \(\sigma = Q/S \approx 4{,}4\times10^{-7}\ \text{C·m}^{-2}\). Contrôle : \(\sigma = \varepsilon_0E\) donne bien \(4{,}4\times10^{-7}\ \text{C·m}^{-2}\).</p>
    <p><strong>Q3.</strong> \(W_e = \tfrac12CU^2\), avec \(C = 4{,}4\times10^{-11}\ \text{F}\) et \(U = 100\ \text{V}\) : \(W_e \approx 2{,}2\times10^{-7}\ \text{J}\). Densité : \(w_e = \tfrac12\varepsilon_0E^2 \approx 1{,}1\times10^{-2}\ \text{J·m}^{-3}\), dans le volume \(Sd = 2{,}0\times10^{-5}\ \text{m}^3\) : on retrouve \(2{,}2\times10^{-7}\ \text{J}\). L'énergie du condensateur est bien celle du champ entre ses armatures.</p>
    <p><strong>Q4.</strong> Il faut \(U/d \lt 3{,}0\times10^{6}\ \text{V·m}^{-1}\), soit \(U_{\max} = 3{,}0\times10^{6}\times2{,}0\times10^{-3} = 6{,}0\ \text{kV}\).</p>
    <p><strong>Q5.</strong> Le condensateur isolé garde sa charge : \(Q = 4{,}4\ \text{nC}\), donc \(\sigma\) et \(E = \sigma/\varepsilon_0 = 5{,}0\times10^{4}\ \text{V·m}^{-1}\) sont inchangés. La capacité est divisée par deux (22 pF), et la tension doublée : \(U' = E\times2d = 200\ \text{V}\). L'énergie \(\dfrac{Q^2}{2C}\) double : \(4{,}4\times10^{-7}\ \text{J}\) (on peut aussi dire : même densité d'énergie dans un volume double). Le supplément, \(2{,}2\times10^{-7}\ \text{J}\), est le travail fourni par l'opérateur pour écarter les armatures, qui s'attirent puisqu'elles portent des charges opposées. Piège : raisonner à tension constante, alors que c'est la charge qui est fixée une fois le générateur débranché.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Sphère chargée en volume ou en surface</h3>
  <div class="statement"><em>Aperçu de 2ᵉ année : le théorème de Gauss est admis (dernière section du cours).</em> Une charge \(Q = 1{,}0\ \mu\text{C}\) est répartie de deux façons sur une sphère de centre \(O\) et de rayon \(R = 5{,}0\ \text{cm}\) : (a) uniformément dans tout le volume d'une boule isolante ; (b) uniformément sur la surface d'une sphère creuse. On prend \(\dfrac{1}{4\pi\varepsilon_0} = 9{,}0\times10^{9}\ \text{SI}\), \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\) ; champ de claquage de l'air : \(3\ \text{MV·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Par des arguments de symétrie, donner la direction du champ en un point \(M\) et la variable dont dépend sa norme. Quelle surface de Gauss choisir ?</div>
  <div class="q"><strong>Q2.</strong> Établir le champ pour \(r \gt R\) dans les deux cas. Commenter.</div>
  <div class="q"><strong>Q3.</strong> Établir le champ pour \(r \lt R\) dans chacun des deux cas.</div>
  <div class="q"><strong>Q4.</strong> Calculer \(E\) en \(r = R/2\), \(r = R\) et \(r = 2R\) pour les deux modèles, et décrire l'allure de \(E(r)\).</div>
  <div class="q"><strong>Q5.</strong> Dans le modèle (b), le champ est discontinu en \(r = R\). Calculer le saut et le comparer à \(\sigma/\varepsilon_0\).</div>
  <div class="q"><strong>Q6.</strong> Comparer \(E(R)\) au champ de claquage de l'air. Quelle charge maximale cette sphère peut-elle garder dans l'air ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tout plan contenant \(O\) et \(M\) est un plan de symétrie de la distribution : \(\vec E(M)\) est contenu dans chacun d'eux, donc porté par la droite \(OM\). La distribution est invariante par toute rotation autour de \(O\) : la norme ne dépend que de \(r = OM\). Ainsi \(\vec E = E_r(r)\,\vec e_r\). Surface de Gauss : la sphère de centre \(O\) passant par \(M\), sur laquelle le champ est normal et de norme constante ; flux sortant \(4\pi r^2E_r(r)\).</p>
    <p><strong>Q2.</strong> Pour \(r \gt R\), la sphère de Gauss contient toute la charge dans les deux cas : \(4\pi r^2E_r = Q/\varepsilon_0\), soit \(E_r = \dfrac{Q}{4\pi\varepsilon_0r^2}\). À l'extérieur, les deux modèles sont indiscernables : le champ est celui d'une charge ponctuelle \(Q\) placée en \(O\).</p>
    <p><strong>Q3.</strong> (a) La charge intérieure est proportionnelle au volume : \(Q_{\text{int}} = Q\,r^3/R^3\), d'où \(E_r = \dfrac{Q\,r}{4\pi\varepsilon_0R^3}\), qui croît linéairement depuis 0 au centre. (b) Aucune charge à l'intérieur de la sphère de Gauss : \(\vec E = \vec 0\) partout dans la cavité. Piège : écrire \(Q_{\text{int}} = Q\) pour \(r \lt R\).</p>
    <p><strong>Q4.</strong> La valeur de référence est le champ à la surface :</p>
    <div class="formula">$$\frac{Q}{4\pi\varepsilon_0R^2}=\frac{9{,}0\times10^{9}\times1{,}0\times10^{-6}}{(0{,}050)^2}=3{,}6\times10^{6}\ \text{V·m}^{-1}$$</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
      <tr><th style="text-align:left">Point</th><th style="text-align:left">(a) volume</th><th style="text-align:left">(b) surface</th></tr>
      <tr><td>\(r = R/2\)</td><td>\(1{,}8\times10^{6}\ \text{V·m}^{-1}\)</td><td>0</td></tr>
      <tr><td>\(r = R\)</td><td>\(3{,}6\times10^{6}\ \text{V·m}^{-1}\)</td><td>0 juste dedans, \(3{,}6\times10^{6}\ \text{V·m}^{-1}\) juste dehors</td></tr>
      <tr><td>\(r = 2R\)</td><td>\(9{,}0\times10^{5}\ \text{V·m}^{-1}\)</td><td>\(9{,}0\times10^{5}\ \text{V·m}^{-1}\)</td></tr>
    </table></div>
    <p>(a) : droite de 0 à \(3{,}6\ \text{MV·m}^{-1}\), puis décroissance en \(1/r^2\), sans discontinuité. (b) : nul jusqu'à \(R\), saut, puis la même décroissance en \(1/r^2\).</p>
    <p><strong>Q5.</strong> Saut : \(3{,}6\times10^{6}\ \text{V·m}^{-1}\). Densité surfacique : \(\sigma = \dfrac{Q}{4\pi R^2} \approx 3{,}2\times10^{-5}\ \text{C·m}^{-2}\), et \(\dfrac{\sigma}{\varepsilon_0} \approx 3{,}6\times10^{6}\ \text{V·m}^{-1}\) : le saut du champ à la traversée d'une surface chargée vaut \(\sigma/\varepsilon_0\), comme pour le plan infini (\(+\sigma/2\varepsilon_0\) d'un côté, \(-\sigma/2\varepsilon_0\) de l'autre). Une distribution en volume, elle, donne un champ continu.</p>
    <p><strong>Q6.</strong> \(3{,}6\ \text{MV·m}^{-1}\) dépasse le champ de claquage : l'air s'ioniserait au contact de la sphère (aigrettes, étincelles) et la charge fuirait jusqu'à ce que \(E(R)\) redescende sous \(3\ \text{MV·m}^{-1}\), soit</p>
    <div class="formula">$$Q_{\max}=4\pi\varepsilon_0R^2\times3\times10^{6}=\frac{3\times10^{6}\times(0{,}050)^2}{9{,}0\times10^{9}}\approx0{,}8\ \mu\text{C}$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Compteur Geiger : le champ intense d'un fil fin</h3>
  <div class="statement"><em>Aperçu de 2ᵉ année : le théorème de Gauss est admis (dernière section du cours).</em> Un compteur Geiger est un tube métallique cylindrique de rayon \(b = 1{,}0\ \text{cm}\) (la cathode), rempli d'argon sous faible pression, sur l'axe duquel est tendu un fil fin de rayon \(a = 25\ \mu\text{m}\) (l'anode). On applique la tension \(U = V_{\text{fil}} - V_{\text{tube}} = 900\ \text{V}\). Modèle : le fil, infiniment long, porte la charge \(\lambda \gt 0\) par unité de longueur ; le tube porte \(-\lambda\) par unité de longueur. Données : \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(e = 1{,}6\times10^{-19}\ \text{C}\).</div>
  <p class="exo-part">Partie A — Champ d'un fil chargé</p>
  <div class="q"><strong>A1.</strong> Par des arguments de symétrie et d'invariance, montrer qu'entre le fil et le tube \(\vec E = E_r(r)\,\vec e_r\) en coordonnées cylindriques d'axe le fil.</div>
  <div class="q"><strong>A2.</strong> En appliquant le théorème de Gauss à un cylindre fermé coaxial de rayon \(r\) (\(a \lt r \lt b\)) et de hauteur \(h\), établir \(E_r(r) = \dfrac{\lambda}{2\pi\varepsilon_0r}\). Pourquoi la charge du tube n'intervient-elle pas ?</div>
  <div class="q"><strong>A3.</strong> Application hors du compteur : un fil isolé portant \(\lambda = 10\ \text{nC·m}^{-1}\) ; calculer le champ à 5,0 cm du fil.</div>
  <p class="exo-part">Partie B — Le compteur</p>
  <div class="q"><strong>B1.</strong> En calculant la circulation du champ de \(r = a\) à \(r = b\), montrer que \(U = \dfrac{\lambda}{2\pi\varepsilon_0}\ln\dfrac{b}{a}\).</div>
  <div class="q"><strong>B2.</strong> Calculer \(\dfrac{\lambda}{2\pi\varepsilon_0}\), puis \(\lambda\), le champ au contact du fil et le champ contre le tube. Commenter.</div>
  <div class="q"><strong>B3.</strong> Un électron libéré dans le gaz par un rayonnement ionisant dérive vers le fil. Entre deux chocs avec des atomes d'argon, il parcourt environ \(\ell = 4\ \mu\text{m}\). Estimer l'énergie, en électron-volts, qu'il gagne sur un tel parcours au contact du fil, puis contre le tube.</div>
  <div class="q"><strong>B4.</strong> Ioniser un atome d'argon demande 15,8 eV. Montrer que les ionisations en chaîne (l'avalanche qui produit l'impulsion détectée) n'ont lieu que dans une gaine très mince autour du fil, dont on estimera le rayon.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Le plan contenant le fil et \(M\), et le plan perpendiculaire au fil passant par \(M\), sont des plans de symétrie : \(\vec E(M)\) est porté par leur intersection, la droite perpendiculaire au fil passant par \(M\) ; il est radial. La distribution est invariante par translation le long du fil et par rotation autour de lui : la norme ne dépend que de la distance \(r\) au fil. D'où \(\vec E = E_r(r)\,\vec e_r\).</p>
    <p><strong>A2.</strong> Sur les deux bases du cylindre, \(\vec E\) est radial donc orthogonal à la normale : flux nul. Sur la face latérale, \(\vec E\) est normal et de norme constante : flux \(2\pi rh\,E_r(r)\). La charge intérieure est celle du fil sur la hauteur \(h\), soit \(\lambda h\) ; le tube, de rayon \(b \gt r\), est hors de la surface de Gauss et ne compte pas dans \(Q_{\text{int}}\) (ses charges contribuent au champ en chaque point, mais leur flux total à travers la surface fermée est nul ; ici, par symétrie, leur champ est même nul à l'intérieur du tube). Le théorème de Gauss donne \(2\pi rh\,E_r = \lambda h/\varepsilon_0\), d'où \(E_r = \dfrac{\lambda}{2\pi\varepsilon_0r}\).</p>
    <p><strong>A3.</strong> Application numérique :</p>
    <div class="formula">$$E=\frac{10\times10^{-9}}{2\pi\times8{,}85\times10^{-12}\times0{,}050}\approx3{,}6\times10^{3}\ \text{V·m}^{-1}$$</div>
    <p>Le champ d'un fil décroît en \(1/r\), plus lentement que celui d'une charge ponctuelle.</p>
    <p><strong>B1.</strong> La tension est la circulation du champ du fil vers le tube, le long d'un rayon :</p>
    <div class="formula">$$U=V(a)-V(b)=\int_a^b E_r\,\mathrm{d}r=\frac{\lambda}{2\pi\varepsilon_0}\int_a^b\frac{\mathrm{d}r}{r}=\frac{\lambda}{2\pi\varepsilon_0}\ln\frac{b}{a}$$</div>
    <p><strong>B2.</strong> \(\ln(b/a) = \ln400 \approx 5{,}99\), donc \(\dfrac{\lambda}{2\pi\varepsilon_0} = \dfrac{900}{5{,}99} \approx 150\ \text{V}\) et \(\lambda = 2\pi\varepsilon_0\times150 \approx 8{,}4\ \text{nC·m}^{-1}\). Au contact du fil, \(E(a) = \dfrac{150}{25\times10^{-6}} = 6{,}0\times10^{6}\ \text{V·m}^{-1}\) ; contre le tube, \(E(b) = \dfrac{150}{0{,}010} = 1{,}5\times10^{4}\ \text{V·m}^{-1}\). Le rapport vaut \(b/a = 400\) : la finesse du fil concentre le champ, et une tension modérée suffit à créer près de lui un champ de plusieurs mégavolts par mètre.</p>
    <p><strong>B3.</strong> Sur un parcours court, le champ varie peu : l'électron gagne environ \(eE\ell\). Au contact du fil : \(6{,}0\times10^{6}\times4\times10^{-6} \approx 24\ \text{eV}\) (le calcul exact, \(\dfrac{\lambda}{2\pi\varepsilon_0}\ln\dfrac{a+\ell}{a} = 150\ln\dfrac{29}{25}\), donne 22 eV). Contre le tube : \(1{,}5\times10^{4}\times4\times10^{-6} = 0{,}06\ \text{eV}\).</p>
    <p><strong>B4.</strong> L'électron ionise un atome s'il gagne au moins 15,8 eV entre deux chocs, c'est-à-dire si \(eE\ell \ge 15{,}8\ \text{eV}\), soit \(E \ge \dfrac{15{,}8}{4\times10^{-6}} \approx 4\times10^{6}\ \text{V·m}^{-1}\). Avec \(E = \dfrac{150}{r}\), il faut \(r \lesssim \dfrac{150}{4\times10^{6}} \approx 38\ \mu\text{m}\) (36 µm avec le calcul exact). L'avalanche n'a lieu que dans une gaine d'une dizaine de micromètres d'épaisseur autour du fil ; partout ailleurs, les électrons se contentent de dériver. C'est pourquoi l'anode est un fil très fin : la même tension appliquée entre deux plans ne produirait nulle part un champ suffisant.</p>
  </div>
</div>
