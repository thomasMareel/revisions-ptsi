<template class="pan-tpl" data-panneau="pdyn-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · PROGRAMMATION DYNAMIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Huit savoir-faire, de l'usage d'un dictionnaire à la résolution complète d'un problème par programmation dynamique : récurrence, mémoïsation ou calcul de bas en haut, reconstruction, coûts. Ce sont les questions posées, presque toujours dans cet ordre, par les sujets de concours.</div>

  <div class="method-box"><strong>Méthode 1 — Utiliser un dictionnaire à bon escient</strong>
    <ol>
      <li><span class="step">Choisir.</span> Dictionnaire si les clés sont des noms, des tuples, des entiers dispersés, ou si l'on teste souvent l'appartenance ; liste si les clés sont exactement \(0, 1, \dots, n - 1\).</li>
      <li><span class="step">Créer la clé</span> à sa première rencontre (<span class="code-inline">if c in d: … else: d[c] = …</span>) : lire <span class="code-inline">d[c]</span> pour une clé absente provoque une erreur <span class="code-inline">KeyError</span>.</li>
      <li><span class="step">Parcourir</span> par <span class="code-inline">for c in d.keys():</span> ou <span class="code-inline">for c, v in d.items():</span>, sans ajouter de clé pendant le parcours.</li>
      <li><span class="step">Copier</span> avec <span class="code-inline">d.copy()</span> si l'original doit rester intact, en se souvenant que les valeurs mutables (listes) restent partagées.</li>
    </ol>
    <p><em>Exemple éclair :</em> compter les mots d'une liste <span class="code-inline">texte</span> : <span class="code-inline">freq = {}</span>, puis pour chaque mot, <span class="code-inline">freq[m] = freq[m] + 1</span> s'il est déjà une clé, <span class="code-inline">freq[m] = 1</span> sinon. Pour \(n\) mots : \(O(n)\) en moyenne, contre \(O(n^2)\) en recomptant chaque mot dans la liste.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Dérouler une table de hachage et contrôler les clés</strong>
    <ol>
      <li><span class="step">Calculer</span> \(h(c)\) pour chaque clé, dans l'ordre des insertions, et ranger le couple en fin de l'alvéole \(h(c)\) (ou remplacer la valeur si la clé y est déjà).</li>
      <li><span class="step">Compter</span> le coût d'une recherche : calcul de \(h(c)\), puis une comparaison par couple de l'alvéole parcouru jusqu'à trouver la clé (toute l'alvéole si elle est absente).</li>
      <li><span class="step">Juger</span> la répartition : des alvéoles longues signalent une mauvaise fonction de hachage ou une table trop petite (facteur de charge \(n/m\) trop grand).</li>
      <li><span class="step">Clés</span> : entiers, flottants, chaînes, tuples d'éléments hachables ; jamais de liste ni de dictionnaire (convertir par <span class="code-inline">tuple(t)</span>).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(h(k) = k \bmod 7\), les clés 15, 22, 8, 29 tombent toutes dans l'alvéole 1 (elles valent toutes 1 modulo 7) : une recherche de 29 demande 4 comparaisons. Avec \(m = 8\) alvéoles, elles vont en 7, 6, 0, 5 : une comparaison chacune.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : <span class="code-inline">x in d</span> teste les <em>clés</em>. Pour savoir si une valeur est présente, il faut parcourir <span class="code-inline">d.items()</span>, en \(O(n)\).</div>

  <div class="method-box"><strong>Méthode 3 — Reconnaître un problème de programmation dynamique</strong>
    <ol>
      <li><span class="step">Optimiser ou compter</span> parmi un nombre exponentiel de solutions (sous-ensembles, chemins, alignements) : l'énumération est exclue.</li>
      <li><span class="step">Sous-structure optimale</span> : une solution optimale se découpe en solutions optimales de sous-problèmes plus petits (même nature : un préfixe, une capacité plus petite, une case précédente).</li>
      <li><span class="step">Chevauchement</span> : la récursion naturelle retombe souvent sur les mêmes sous-problèmes ; leur nombre total est polynomial (\(n\), \(nm\), \(nS\)…).</li>
      <li><span class="step">Glouton ?</span> Si un choix local peut être prouvé sûr (propriété du choix glouton), un glouton suffit et coûte moins ; sinon, chercher un contre-exemple au glouton, puis passer à la programmation dynamique.</li>
    </ol>
    <p><em>Exemple éclair :</em> rendu de monnaie avec les pièces 1, 4, 6, 9 pour 12 : le glouton rend 9 + 1 + 1 + 1 (4 pièces) alors que 6 + 6 suffit. Le nombre minimal \(N(s) = 1 + \min_{c \le s} N(s - c)\) ne dépend que de \(s + 1\) sous-problèmes : programmation dynamique en \(O(sk)\) pour \(k\) valeurs de pièces.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Établir la relation de récurrence</strong>
    <ol>
      <li><span class="step">Définir</span> une fonction des paramètres du sous-problème par une phrase complète : « \(M(i)\) est le meilleur poids parmi les \(i\) premières tâches ». Les préfixes \(a[0:i]\) sont le choix le plus fréquent.</li>
      <li><span class="step">Dernière décision</span> : énumérer ses issues possibles (élément pris ou non ; dernière lettre supprimée, insérée ou alignée ; arrivée par le haut ou par la gauche) et, pour chacune, le sous-problème qui reste.</li>
      <li><span class="step">Combiner</span> par \(\max\), \(\min\), une somme (dénombrement) ou un « ou » (existence) ; ajouter le coût ou le gain de la décision.</li>
      <li><span class="step">Cas de base</span> : préfixe vide, capacité nulle, case de départ ; vérifier qu'ils rendent la récurrence bien définie.</li>
      <li><span class="step">Justifier</span> : chaque issue est réalisable, et toute solution optimale relève d'une issue (argument « couper-coller » de la sous-structure optimale).</li>
    </ol>
    <p><em>Exemple éclair :</em> nombre de façons de monter \(n\) marches par sauts de 1, 2 ou 3 : le dernier saut fait 1, 2 ou 3 marches, d'où \(F(n) = F(n - 1) + F(n - 2) + F(n - 3)\) (termes d'indice négatif nuls), avec \(F(0) = 1\) (rester au sol est une façon). Valeurs : 1, 1, 2, 4, 7, 13, 24…</p>
  </div>
  <div class="notice"><strong>Piège</strong> : décaler les indices. Avec \(L(i, j)\) défini sur les préfixes de longueur \(i\) et \(j\), la dernière lettre de \(a[0:i]\) est <span class="code-inline">a[i - 1]</span>, pas <span class="code-inline">a[i]</span> ; et la table a \(n + 1\) lignes, pour \(i = 0, \dots, n\).</div>

  <div class="method-box"><strong>Méthode 5 — Mémoïser une fonction récursive</strong>
    <ol>
      <li><span class="step">Écrire</span> d'abord la récursion naïve, calquée sur la récurrence.</li>
      <li><span class="step">Ajouter</span> un paramètre <span class="code-inline">memo</span> (dictionnaire) transmis à tous les appels ; la clé est le sous-problème, un entier ou un <strong>tuple</strong> <span class="code-inline">(i, j)</span>.</li>
      <li><span class="step">En tête</span> : <span class="code-inline">if cle in memo: return memo[cle]</span> ; <span class="code-inline">memo[cle] = r</span> juste avant chaque <span class="code-inline">return r</span>.</li>
      <li><span class="step">Appeler</span> avec un dictionnaire neuf, <span class="code-inline">f(n, {})</span> ; coût : nombre de sous-problèmes atteints × travail propre à chacun.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(F(20)\) (escalier), la version naïve fait 266 079 appels ; la version mémoïsée en fait 58 (un calcul par valeur de \(n\) de 0 à 20, plus des lectures du mémo).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un dictionnaire par défaut dans l'en-tête, <span class="code-inline">def f(n, memo={})</span>, est créé une seule fois et partagé par tous les appels du programme, même pour des données différentes. Toujours le passer explicitement.</div>

  <div class="method-box"><strong>Méthode 6 — Écrire la version de bas en haut</strong>
    <ol>
      <li><span class="step">Tableau</span> aux bonnes dimensions (souvent \((n + 1) \times (m + 1)\)), créé par compréhension : <span class="code-inline">[[0] * (m + 1) for i in range(n + 1)]</span>.</li>
      <li><span class="step">Cas de base</span> : remplir la ligne 0 et la colonne 0 (ou la case 0).</li>
      <li><span class="step">Ordre</span> : boucles telles que chaque case ne lise que des cases déjà calculées ; pour des dépendances vers \((i - 1, \cdot)\) et \((i, j - 1)\), lignes croissantes puis colonnes croissantes.</li>
      <li><span class="step">Résultat</span> : la case du problème complet, souvent la dernière.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour la partition, \(A(i, s)\) lit \(A(i - 1, s)\) et \(A(i - 1, s - t_{i-1})\) : il suffit de remplir les lignes dans l'ordre croissant de \(i\), les colonnes dans un ordre quelconque.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Reconstruire une solution optimale</strong>
    <ol>
      <li><span class="step">Partir</span> de la case du problème complet.</li>
      <li><span class="step">Retrouver la décision</span> : chercher quelle issue de la récurrence donne la valeur de la case (comparer avec les cases dont elle dépend), ou la lire dans une table des choix remplie pendant le calcul.</li>
      <li><span class="step">Enregistrer</span> la décision (élément pris, lettre gardée, opération) et aller dans la case du sous-problème correspondant.</li>
      <li><span class="step">S'arrêter</span> au cas de base ; renverser la liste obtenue si l'énoncé veut l'ordre naturel.</li>
    </ol>
    <p><em>Exemple éclair :</em> sac de capacité 10, objets (valeur, masse) (18, 5), (4, 1), (19, 5), (7, 3). \(V(4, 10) = 37 = V(3, 10)\) : le dernier objet n'est pas pris ; \(V(3, 10) = 37 \ne V(2, 10) = 22\) : l'objet (19, 5) est pris, on continue avec la capacité 5 ; \(V(2, 5) = V(1, 5) = 18\) : (4, 1) n'est pas pris ; \(V(1, 5) = 18 \ne 0\) : (18, 5) est pris. Chargement : (18, 5) et (19, 5).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une table réduite à deux lignes (économie de mémoire) ne permet plus la remontée. Si la question demande la solution, et pas seulement sa valeur, il faut garder toute la table (ou une table des choix).</div>

  <div class="method-box"><strong>Méthode 8 — Évaluer les complexités en temps et en mémoire</strong>
    <ol>
      <li><span class="step">Temps</span> = (nombre de sous-problèmes) × (coût du calcul d'un sous-problème, sans compter les sous-problèmes eux-mêmes) ; ajouter la reconstruction.</li>
      <li><span class="step">Mémoire</span> = taille de la table ou du mémo, plus la pile d'appels (profondeur) pour la mémoïsation.</li>
      <li><span class="step">Ordre de grandeur</span> : convertir en secondes (environ \(10^7\) opérations simples par seconde en Python) et en octets (au moins 8 octets par case d'une liste).</li>
      <li><span class="step">Réduire</span> la mémoire en ne gardant que les lignes utiles si la reconstruction n'est pas demandée.</li>
    </ol>
    <p><em>Exemple éclair :</em> Levenshtein entre deux mots de 10 lettres : 121 cases, rien. Entre deux textes de \(10^5\) caractères : \(10^{10}\) cases, environ 80 Go de mémoire avec la table entière ; avec deux lignes, \(2 \times 10^5\) cases, moins de 2 Mo, pour le même temps \(O(nm)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Dérouler à la main une table de PLSC, de Levenshtein ou de Floyd-Warshall</strong>
    <ol>
      <li><span class="step">Préparer</span> la grille : mot \(a\) en lignes, mot \(b\) en colonnes, avec une ligne et une colonne pour le préfixe vide (0 pour la PLSC ; \(i\) et \(j\) pour Levenshtein) ; pour Floyd-Warshall, la matrice \(M\) avec \(\infty\) et des 0 sur la diagonale.</li>
      <li><span class="step">Remplir</span> ligne par ligne : PLSC, diagonale + 1 si les lettres sont égales, sinon le maximum de la case du dessus et de celle de gauche ; Levenshtein, minimum de dessus + 1, gauche + 1, diagonale + \(\delta\).</li>
      <li><span class="step">Floyd-Warshall</span> : pour \(k = 0, 1, \dots\), comparer chaque \(D[i][j]\) à \(D[i][k] + D[k][j]\) ; la ligne et la colonne \(k\) ne changent pas pendant l'étape \(k\).</li>
      <li><span class="step">Contrôler</span> : PLSC croissante le long des lignes et des colonnes ; Levenshtein, deux cases voisines diffèrent d'au plus 1 ; Floyd-Warshall, la diagonale reste nulle.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(d(\text{PARIS}, \text{PRIX}) = 2\) : supprimer A, remplacer S par X. La PLSC est PRI, de longueur 3 : sans substitution, il faudrait \(5 + 4 - 2 \times 3 = 3\) opérations.</p>
  </div>
</div>
</template>

  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Inverser un dictionnaire</h3>
  <div class="statement">Un professeur range les notes d'un devoir dans un dictionnaire : <span class="code-inline">notes = {"Ana": 14, "Bob": 9, "Chloé": 14, "Dan": 11, "Eva": 9, "Féli": 14}</span>.</div>
  <div class="q"><strong>Q1.</strong> Que valent <span class="code-inline">len(notes)</span>, <span class="code-inline">"Bob" in notes</span> et <span class="code-inline">14 in notes</span> ? Que se passe-t-il pour <span class="code-inline">notes["Gus"]</span> ?</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction <span class="code-inline">inverser(d: dict) -&gt; dict</span> qui renvoie le dictionnaire associant à chaque valeur de <span class="code-inline">d</span> la liste des clés qui ont cette valeur. Donner <span class="code-inline">inverser(notes)</span> et la complexité.</div>
  <div class="q"><strong>Q3.</strong> En déduire <span class="code-inline">plus_frequente(d)</span>, qui renvoie une valeur portée par le plus grand nombre de clés.</div>
  <div class="q"><strong>Q4.</strong> On exécute <span class="code-inline">inv = inverser(notes)</span>, <span class="code-inline">inv2 = inv.copy()</span>, puis <span class="code-inline">inv2[14].append("Gus")</span> et <span class="code-inline">inv2[20] = ["Hana"]</span>. Que valent alors <span class="code-inline">inv[14]</span> et <span class="code-inline">20 in inv</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> <span class="code-inline">len(notes)</span> vaut 6 ; <span class="code-inline">"Bob" in notes</span> vaut <span class="code-inline">True</span> ; <span class="code-inline">14 in notes</span> vaut <span class="code-inline">False</span> : <span class="code-inline">in</span> teste les clés, et 14 est une valeur. <span class="code-inline">notes["Gus"]</span> arrête le programme sur une erreur <span class="code-inline">KeyError</span>.</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> inverser(d: dict) -&gt; dict:
    <span class="str">"""{valeur: liste des clés qui ont cette valeur dans d}."""</span>
    inv = {}
    <span class="kw">for</span> c, v <span class="kw">in</span> d.items():
        <span class="kw">if</span> v <span class="kw">in</span> inv:
            inv[v].append(c)
        <span class="kw">else</span>:
            inv[v] = [c]
    <span class="kw">return</span> inv</pre>
    <p><span class="code-inline">inverser(notes)</span> vaut <span class="code-inline">{14: ['Ana', 'Chloé', 'Féli'], 9: ['Bob', 'Eva'], 11: ['Dan']}</span>. La boucle fait \(n\) tours (un par couple), chacun de coût constant en moyenne (test <span class="code-inline">in</span>, accès, <span class="code-inline">append</span>) : \(O(n)\).</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> plus_frequente(d: dict):
    <span class="str">"""Une valeur de d portée par le plus grand nombre de clés</span>
<span class="str">    (d non vide)."""</span>
    inv = inverser(d)
    meilleure, nb = <span class="kw">None</span>, 0
    <span class="kw">for</span> v, cles <span class="kw">in</span> inv.items():
        <span class="kw">if</span> len(cles) &gt; nb:
            meilleure, nb = v, len(cles)
    <span class="kw">return</span> meilleure</pre>
    <p>Sur l'exemple, 14 (trois élèves). Coût \(O(n)\) : l'inversion, puis un parcours du dictionnaire inversé, qui a au plus \(n\) clés.</p>
    <p><strong>Q4.</strong> <span class="code-inline">inv2</span> est un nouveau dictionnaire, mais ses valeurs sont les <em>mêmes</em> listes que celles de <span class="code-inline">inv</span> (copie superficielle) : <span class="code-inline">inv[14]</span> vaut <span class="code-inline">['Ana', 'Chloé', 'Féli', 'Gus']</span>. En revanche, la clé 20 n'a été ajoutée qu'à <span class="code-inline">inv2</span> : <span class="code-inline">20 in inv</span> vaut <span class="code-inline">False</span>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Une table de hachage à la main</h3>
  <div class="statement">On range des numéros d'étudiants (entiers) dans une table de hachage à \(m\) alvéoles, avec résolution des collisions par chaînage (comme au §2 du cours), et la fonction de hachage \(h(k) = k \bmod m\). On insère, dans cet ordre, les clés 15, 22, 8, 29, 4, 11.</div>
  <div class="q"><strong>Q1.</strong> Avec \(m = 7\), dessiner la table. Combien de comparaisons de clés demande la recherche de 29 ? celle de 36, absente ?</div>
  <div class="q"><strong>Q2.</strong> Même question avec \(m = 8\). Pourquoi la répartition est-elle si mauvaise avec \(m = 7\) ?</div>
  <div class="q"><strong>Q3.</strong> Parmi les objets suivants, lesquels peuvent être des clés d'un dictionnaire Python : <span class="code-inline">(3, 4)</span>, <span class="code-inline">[3, 4]</span>, <span class="code-inline">"34"</span>, <span class="code-inline">(3, [4])</span>, <span class="code-inline">3.4</span>, <span class="code-inline">{3: 4}</span> ? Justifier par le principe du hachage.</div>
  <div class="q"><strong>Q4.</strong> Une fonction mémoïsée reçoit une liste <span class="code-inline">t</span> et écrit <span class="code-inline">memo[t] = r</span>. Quelle erreur obtient-on ? Comment la corriger ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Restes modulo 7 : 15 → 1, 22 → 1, 8 → 1, 29 → 1, 4 → 4, 11 → 4. Alvéole 1 : [15, 22, 8, 29] ; alvéole 4 : [4, 11] ; les cinq autres sont vides. Recherche de 29 : alvéole 1, quatre comparaisons (15, 22, 8, 29). Recherche de 36 : \(36 \bmod 7 = 1\), quatre comparaisons, puis échec.</p>
    <p><strong>Q2.</strong> Modulo 8 : 15 → 7, 22 → 6, 8 → 0, 29 → 5, 4 → 4, 11 → 3. Aucune collision : chaque recherche fait au plus une comparaison ; celle de 36 (alvéole 4) en fait une. Avec \(m = 7\), les quatre premières clés diffèrent de multiples de 7 (\(22 - 15 = 7\), \(8 = 15 - 7\), \(29 = 22 + 7\)) : elles ont toutes le même reste. Une fonction de hachage doit disperser les clés réellement rencontrées ; une régularité des données qui coïncide avec \(m\) ruine la répartition.</p>
    <p><strong>Q3.</strong> Sont hachables, donc utilisables : <span class="code-inline">(3, 4)</span>, <span class="code-inline">"34"</span>, <span class="code-inline">3.4</span> (immuables). Sont refusés, avec <span class="code-inline">TypeError</span> : <span class="code-inline">[3, 4]</span> et <span class="code-inline">{3: 4}</span> (mutables), et <span class="code-inline">(3, [4])</span> (un tuple, mais qui contient une liste : son hachage dépendrait de la liste). Une clé doit garder la même valeur de hachage toute sa vie, sinon elle serait cherchée dans une autre alvéole que celle où elle est rangée.</p>
    <p><strong>Q4.</strong> <span class="code-inline">TypeError: unhashable type: 'list'</span>. On utilise <span class="code-inline">memo[tuple(t)] = r</span> (<span class="code-inline">tuple(t)</span> : tuple des éléments de <span class="code-inline">t</span>), ou mieux, si la liste ne change pas pendant le calcul, on mémoïse selon des indices entiers qui repèrent la partie utile de la liste (par exemple <span class="code-inline">memo[i]</span> pour la tranche <span class="code-inline">t[i:]</span>), ce qui évite de construire et de hacher des tuples de longueur \(n\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Monter un escalier</h3>
  <div class="statement">Un enfant monte un escalier de \(n\) marches en sautant à chaque pas 1, 2 ou 3 marches. Le sol est la marche 0. Certaines marches sont cassées : on ne peut pas y poser le pied. On note \(F(n)\) le nombre de façons d'atteindre la marche \(n\).</div>
  <div class="q"><strong>Q1.</strong> Sans marche cassée, établir une relation de récurrence pour \(F(n)\) et calculer \(F(0), \dots, F(10)\).</div>
  <div class="q"><strong>Q2.</strong> Écrire la fonction récursive naïve <span class="code-inline">nb_montees_naif(n)</span>. On admet qu'elle fait \(A(n) = 1 + A(n - 1) + A(n - 2) + A(n - 3)\) appels pour \(n \geq 3\) ; pour \(n = 20\), elle en fait 266 079. Expliquer cette explosion.</div>
  <div class="q"><strong>Q3.</strong> Écrire une version mémoïsée <span class="code-inline">nb_montees(n, cassees, memo)</span>, où <span class="code-inline">cassees</span> est la liste des marches cassées. Combien d'appels fait <span class="code-inline">nb_montees(20, [], {})</span> ? Quelle est sa complexité ?</div>
  <div class="q"><strong>Q4.</strong> Calculer le nombre de montées de 10 marches quand la marche 4 est cassée. Que vaut-il si les marches 3, 4 et 5 sont cassées ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le dernier saut d'une montée vers la marche \(n\) part de la marche \(n - 1\), \(n - 2\) ou \(n - 3\) ; ces trois familles sont disjointes. Donc \(F(n) = F(n - 1) + F(n - 2) + F(n - 3)\), en comptant 0 les termes d'indice négatif, avec \(F(0) = 1\) (la montée vide). Valeurs : 1, 1, 2, 4, 7, 13, 24, 44, 81, 149, 274.</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> nb_montees_naif(n: int) -&gt; int:
    <span class="str">"""Sans marche cassée et sans mémoïsation."""</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> 1
    r = 0
    <span class="kw">for</span> saut <span class="kw">in</span> [1, 2, 3]:
        <span class="kw">if</span> n - saut &gt;= 0:
            r = r + nb_montees_naif(n - saut)
    <span class="kw">return</span> r</pre>
    <p>Chaque appel en déclenche trois, et les mêmes valeurs sont recalculées un grand nombre de fois : \(F(17)\) est calculé une fois par chemin d'appels qui y mène. Le nombre d'appels vérifie la même récurrence que \(F\) (à une constante près) : il croît exponentiellement, environ d'un facteur 1,84 par marche.</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> nb_montees(n: int, cassees: list, memo: dict) -&gt; int:
    <span class="str">"""Nombre de façons d'atteindre la marche n depuis le sol (marche 0)</span>
<span class="str">    par sauts de 1, 2 ou 3 marches, sans poser le pied sur une</span>
<span class="str">    marche de la liste cassees."""</span>
    <span class="kw">if</span> n <span class="kw">in</span> memo:
        <span class="kw">return</span> memo[n]
    <span class="kw">if</span> n <span class="kw">in</span> cassees:
        r = 0
    <span class="kw">elif</span> n == 0:
        r = 1
    <span class="kw">else</span>:
        r = 0
        <span class="kw">for</span> saut <span class="kw">in</span> [1, 2, 3]:
            <span class="kw">if</span> n - saut &gt;= 0:
                r = r + nb_montees(n - saut, cassees, memo)
    memo[n] = r
    <span class="kw">return</span> r</pre>
    <p>Chaque valeur de \(n\) de 0 à 20 n'est calculée qu'une fois (21 calculs) ; chaque calcul déclenche au plus trois appels, qui trouvent leur résultat dans le mémo s'il est déjà connu. On compte 58 appels en tout (le premier, plus \(3 \times 18 + 2 + 1\)). Le test <span class="code-inline">n in cassees</span> coûte \(O(c)\) pour \(c\) marches cassées : complexité \(O(n c)\), soit \(O(n)\) pour un nombre de marches cassées borné (et \(O(n)\) toujours si <span class="code-inline">cassees</span> est un dictionnaire). <span class="code-inline">nb_montees(20, [], {})</span> vaut 121 415.</p>
    <p><strong>Q4.</strong> Avec \(F(4) = 0\) : \(F(5) = 0 + 4 + 2 = 6\), \(F(6) = 6 + 0 + 4 = 10\), \(F(7) = 16\), \(F(8) = 32\), \(F(9) = 58\), \(F(10) = 106\). Si les marches 3, 4 et 5 sont cassées, on ne peut pas franchir ce bloc de trois marches avec des sauts d'au plus 3 marches : \(F(5) = F(4) = F(3) = 0\), puis \(F(6) = F(5) + F(4) + F(3) = 0\), et tout est nul au-delà : 0 montée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Rendu de monnaie : quelles pièces rendre ?</h3>
  <div class="statement">Un pays utilise des pièces de 1, 4, 6 et 9 unités, en quantité illimitée. On veut rendre une somme \(s\) avec le moins de pièces possible. Le chapitre <em>Algorithmes gloutons</em> de 1ʳᵉ année calcule déjà le nombre minimal de pièces \(N(s) = 1 + \min_{c \le s} N(s - c)\) ; on veut maintenant les pièces elles-mêmes.</div>
  <div class="q"><strong>Q1.</strong> Que rend l'algorithme glouton (la plus grande pièce possible à chaque étape) pour \(s = 12\) ? Est-ce optimal ?</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">rendu_optimal(s, pieces)</span>, qui calcule de bas en haut les listes <span class="code-inline">nb</span> (nombre minimal de pièces pour chaque somme \(v \le s\)) et <span class="code-inline">der</span> (une pièce utilisée par une solution optimale pour \(v\)), puis renvoie la liste des pièces d'une solution optimale pour \(s\).</div>
  <div class="q"><strong>Q3.</strong> Donner les deux listes pour \(s = 12\) et dérouler la reconstruction.</div>
  <div class="q"><strong>Q4.</strong> Complexité en temps et en mémoire pour \(k\) valeurs de pièces ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> 9, puis 1, 1, 1 : quatre pièces. Or 6 + 6 n'en utilise que deux : le glouton n'est pas optimal pour ce système.</p>
    <p><strong>Q2.</strong> La sous-structure optimale : si une solution optimale pour \(v\) contient la pièce \(c\), le reste est une solution optimale pour \(v - c\). On essaie toutes les pièces et on retient dans <span class="code-inline">der[v]</span> celle qui donne le minimum.</p>
    <pre class="codeblock"><span class="kw">def</span> rendu_optimal(s: int, pieces: list) -&gt; list:
    <span class="str">"""Liste de pièces de somme s, en nombre minimal (1 est dans pieces)."""</span>
    nb = [0] * (s + 1)            <span class="cmt"># nb[v] : nombre minimal de pièces pour v</span>
    der = [0] * (s + 1)           <span class="cmt"># der[v] : une pièce d'une solution optimale</span>
    <span class="kw">for</span> v <span class="kw">in</span> range(1, s + 1):
        nb[v] = v + 1             <span class="cmt"># plus que toute solution possible</span>
        <span class="kw">for</span> c <span class="kw">in</span> pieces:
            <span class="kw">if</span> c &lt;= v <span class="kw">and</span> nb[v - c] + 1 &lt; nb[v]:
                nb[v] = nb[v - c] + 1
                der[v] = c
    rendu = []
    <span class="kw">while</span> s &gt; 0:                  <span class="cmt"># reconstruction : on retire der[s]</span>
        rendu.append(der[s])
        s = s - der[s]
    <span class="kw">return</span> renverse(rendu)</pre>
    <p>L'initialisation <span class="code-inline">nb[v] = v + 1</span> dépasse toute solution possible (avec la pièce de 1, il en faut au plus \(v\)), donc le premier essai l'améliore toujours.</p>
    <p><strong>Q3.</strong></p>
    <div><table>
<tr><th>\(v\)</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th></tr>
<tr><td><span class="code-inline">nb[v]</span></td><td>0</td><td>1</td><td>2</td><td>3</td><td>1</td><td>2</td><td>1</td><td>2</td><td>2</td><td>1</td><td>2</td><td>3</td><td>2</td></tr>
<tr><td><span class="code-inline">der[v]</span></td><td>—</td><td>1</td><td>1</td><td>1</td><td>4</td><td>1</td><td>6</td><td>1</td><td>4</td><td>9</td><td>1</td><td>1</td><td>6</td></tr>
</table></div>
    <p>Reconstruction : <span class="code-inline">der[12]</span> = 6, il reste 6 ; <span class="code-inline">der[6]</span> = 6, il reste 0. Résultat <span class="code-inline">[6, 6]</span>. Chaque tour retire une pièce : la reconstruction fait <span class="code-inline">nb[s]</span> tours.</p>
    <p><strong>Q4.</strong> Deux boucles imbriquées de \(s\) et \(k\) tours : \(O(sk)\) en temps ; deux listes de \(s + 1\) cases : \(O(s)\) en mémoire. Comme pour la partition, le coût dépend de la valeur de \(s\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Le sac à dos</h3>
  <div class="statement">Un randonneur peut porter 10 kg. Il dispose de quatre objets, décrits par des couples (valeur, masse en kg) : <span class="code-inline">objets = [(18, 5), (4, 1), (19, 5), (7, 3)]</span>. Chaque objet est pris entier ou laissé. On cherche la plus grande valeur totale emportée.</div>
  <div class="q"><strong>Q1.</strong> Que donne le glouton qui prend les objets par rapport valeur/masse décroissant, tant qu'ils rentrent ? Est-ce optimal ?</div>
  <div class="q"><strong>Q2.</strong> On note \(V(i, c)\) la plus grande valeur emportée avec les \(i\) premiers objets et une capacité \(c\). Établir la relation de récurrence.</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">sac_table(objets, cmax)</span> et <span class="code-inline">sac_contenu(objets, cmax)</span>, qui renvoie les indices des objets d'un chargement optimal. Remplir la table pour l'exemple.</div>
  <div class="q"><strong>Q4.</strong> Complexité ? Pourquoi cette méthode est-elle inapplicable si les masses sont données en grammes avec une capacité de 10 000 kg ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rapports : 3,6 ; 4 ; 3,8 ; 2,33. Le glouton prend (4, 1), puis (19, 5) (6 kg), ne peut plus prendre (18, 5) (11 kg), prend (7, 3) (9 kg) : valeur 30. Or (18, 5) et (19, 5) font exactement 10 kg pour une valeur de 37 : le glouton n'est pas optimal.</p>
    <p><strong>Q2.</strong> \(V(0, c) = 0\). Pour \(i \geq 1\), l'objet \(i - 1\), de valeur \(v\) et de masse \(p\), est laissé ou pris ; s'il est pris, il reste la capacité \(c - p\) pour les objets précédents :</p>
    <div class="formula">$$V(i, c) = \begin{cases} V(i - 1, c) &amp; \text{si } p \gt c \\ \max\big(V(i - 1, c),\ v + V(i - 1, c - p)\big) &amp; \text{sinon} \end{cases}$$</div>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> sac_table(objets: list, cmax: int) -&gt; list:
    <span class="str">"""V[i][c] : plus grande valeur emportée avec les i premiers objets</span>
<span class="str">    (couples (valeur, masse) de masses entières) et une capacité c."""</span>
    n = len(objets)
    V = [[0] * (cmax + 1) <span class="kw">for</span> i <span class="kw">in</span> range(n + 1)]
    <span class="kw">for</span> i <span class="kw">in</span> range(1, n + 1):
        val, mas = objets[i - 1]
        <span class="kw">for</span> c <span class="kw">in</span> range(cmax + 1):
            V[i][c] = V[i - 1][c]                    <span class="cmt"># objet i - 1 laissé</span>
            <span class="kw">if</span> mas &lt;= c <span class="kw">and</span> val + V[i - 1][c - mas] &gt; V[i][c]:
                V[i][c] = val + V[i - 1][c - mas]    <span class="cmt"># objet i - 1 pris</span>
    <span class="kw">return</span> V

<span class="kw">def</span> sac_contenu(objets: list, cmax: int) -&gt; list:
    <span class="str">"""Indices des objets d'un chargement optimal."""</span>
    V = sac_table(objets, cmax)
    i, c, pris = len(objets), cmax, []
    <span class="kw">while</span> i &gt; 0:
        <span class="kw">if</span> V[i][c] != V[i - 1][c]:       <span class="cmt"># la valeur change : objet pris</span>
            pris.append(i - 1)
            c = c - objets[i - 1][1]
        i = i - 1
    <span class="kw">return</span> pris</pre>
    <div><table>
<tr><th>\(i\) : objet ajouté</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>1 : (18, 5)</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>18</td><td>18</td><td>18</td><td>18</td><td>18</td><td>18</td></tr>
<tr><td>2 : (4, 1)</td><td>0</td><td>4</td><td>4</td><td>4</td><td>4</td><td>18</td><td>22</td><td>22</td><td>22</td><td>22</td><td>22</td></tr>
<tr><td>3 : (19, 5)</td><td>0</td><td>4</td><td>4</td><td>4</td><td>4</td><td>19</td><td>23</td><td>23</td><td>23</td><td>23</td><td>37</td></tr>
<tr><td>4 : (7, 3)</td><td>0</td><td>4</td><td>4</td><td>7</td><td>11</td><td>19</td><td>23</td><td>23</td><td>26</td><td>30</td><td>37</td></tr>
</table></div>
    <p>\(V(4, 10) = 37\). Remontée : \(V(4, 10) = V(3, 10)\), l'objet 3 n'est pas pris ; \(V(3, 10) = 37 \neq V(2, 10) = 22\), l'objet 2, (19, 5), est pris, capacité restante 5 ; \(V(2, 5) = V(1, 5) = 18\), l'objet 1 n'est pas pris ; \(V(1, 5) = 18 \neq V(0, 5) = 0\), l'objet 0 est pris. <span class="code-inline">sac_contenu(objets, 10)</span> vaut <span class="code-inline">[2, 0]</span>.</p>
    <p><strong>Q4.</strong> \((n + 1)(c_{\max} + 1)\) cases en \(O(1)\) : \(O(n\,c_{\max})\) en temps et en mémoire. En grammes, \(c_{\max} = 10^7\) : une table de \(10^7\) colonnes par objet devient énorme, alors que le nombre d'objets est peut-être petit. Le coût dépend de la valeur numérique de la capacité, pas seulement du nombre d'objets.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Sous-suite ou facteur ?</h3>
  <div class="statement">On compare les mots <span class="code-inline">a = "ALGORITHME"</span> et <span class="code-inline">b = "LOGARITHME"</span>. Une <em>sous-suite</em> s'obtient en effaçant des lettres ; un <em>facteur</em> est un bloc de lettres consécutives.</div>
  <div class="q"><strong>Q1.</strong> Donner une sous-suite commune de longueur 8 et un facteur commun de longueur 6.</div>
  <div class="q"><strong>Q2.</strong> On note \(F(i, j)\) la longueur du plus long facteur commun qui <em>se termine</em> à la position \(i - 1\) de \(a\) et à la position \(j - 1\) de \(b\). Établir la récurrence. Comment en déduire la longueur du plus long facteur commun ?</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">plus_long_facteur(a, b)</span>, qui renvoie un plus long facteur commun. Complexité ?</div>
  <div class="q"><strong>Q4.</strong> Que renvoie la fonction <span class="code-inline">plsc</span> du cours (§8) sur ces deux mots ? Comparer les deux récurrences.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sous-suite commune : LGRITHME (dans ALGORITHME, on efface A et O ; dans LOGARITHME, on efface O et A). Facteur commun : RITHME. On ne peut pas faire mieux (la table de la question 4 le confirme pour la sous-suite).</p>
    <p><strong>Q2.</strong> Si \(a_{i-1} \neq b_{j-1}\), aucun facteur commun non vide ne se termine là : \(F(i, j) = 0\). Sinon, le bloc commun qui se termine en \((i - 1, j - 1)\) prolonge celui qui se termine juste avant : \(F(i, j) = F(i - 1, j - 1) + 1\). Cas de base : \(F(i, 0) = F(0, j) = 0\). La longueur cherchée est le <em>maximum</em> de tous les \(F(i, j)\), puisqu'un plus long facteur commun se termine quelque part.</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> plus_long_facteur(a: str, b: str) -&gt; str:
    <span class="str">"""Un plus long facteur (bloc de lettres consécutives) commun à a et b."""</span>
    n, m = len(a), len(b)
    F = [[0] * (m + 1) <span class="kw">for</span> i <span class="kw">in</span> range(n + 1)]
    lmax, fin = 0, 0
    <span class="kw">for</span> i <span class="kw">in</span> range(1, n + 1):
        <span class="kw">for</span> j <span class="kw">in</span> range(1, m + 1):
            <span class="kw">if</span> a[i - 1] == b[j - 1]:
                F[i][j] = F[i - 1][j - 1] + 1     <span class="cmt"># le bloc se prolonge</span>
                <span class="kw">if</span> F[i][j] &gt; lmax:
                    lmax, fin = F[i][j], i
            <span class="cmt"># sinon F[i][j] reste 0 : aucun bloc ne finit en (i, j)</span>
    <span class="kw">return</span> a[fin - lmax:fin]</pre>
    <p>La variable <span class="code-inline">fin</span> retient où se termine (dans <span class="code-inline">a</span>) le meilleur bloc : le facteur est la tranche <span class="code-inline">a[fin - lmax:fin]</span>. Sur l'exemple : <span class="code-inline">"RITHME"</span>. Temps et mémoire \(O(nm)\) (la mémoire peut descendre à \(O(m)\) en gardant deux lignes).</p>
    <p><strong>Q4.</strong> <span class="code-inline">plsc(a, b)</span> renvoie <span class="code-inline">"LGRITHME"</span>, de longueur 8. Les deux récurrences ont le même cas « lettres égales », mais en cas de lettres différentes, la PLSC prend le maximum des cases voisines (on peut sauter une lettre et continuer), alors que le facteur repart de 0 (le bloc est interrompu). Une PLSC est toujours au moins aussi longue qu'un plus long facteur commun.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Distance d'édition à la main</h3>
  <div class="statement">On veut la distance de Levenshtein entre <span class="code-inline">a = "PARIS"</span> et <span class="code-inline">b = "PRIX"</span> (insertion, suppression, substitution, chacune de coût 1).</div>
  <div class="q"><strong>Q1.</strong> Remplir la table \(D\) des distances entre préfixes (\(a\) en lignes, \(b\) en colonnes).</div>
  <div class="q"><strong>Q2.</strong> En déduire la distance et une suite d'opérations optimale.</div>
  <div class="q"><strong>Q3.</strong> Quelle est la longueur d'une plus longue sous-suite commune ? Combien d'opérations faudrait-il sans substitution ?</div>
  <div class="q"><strong>Q4.</strong> On écrit une version mémoïsée avec un dictionnaire de clés <span class="code-inline">(i, j)</span>. Combien de clés contient-il à la fin d'un appel pour deux mots de longueurs \(n\) et \(m\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Ligne 0 : 0, 1, 2, 3, 4 ; colonne 0 : 0 à 5. Par exemple, pour PA contre PR (A et R diffèrent) :</p>
    <div class="formula">$$D(2, 2) = \min\big(D(1, 2) + 1,\ D(2, 1) + 1,\ D(1, 1) + 1\big) = \min(2, 2, 1) = 1$$</div>
    <p>et pour PAR contre PR, R = R donne \(D(3, 2) = D(2, 1) = 1\).</p>
    <div><table>
<tr><th></th><th>ε</th><th>P</th><th>R</th><th>I</th><th>X</th></tr>
<tr><td>ε</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr>
<tr><td>P</td><td>1</td><td>0</td><td>1</td><td>2</td><td>3</td></tr>
<tr><td>A</td><td>2</td><td>1</td><td>1</td><td>2</td><td>3</td></tr>
<tr><td>R</td><td>3</td><td>2</td><td>1</td><td>2</td><td>3</td></tr>
<tr><td>I</td><td>4</td><td>3</td><td>2</td><td>1</td><td>2</td></tr>
<tr><td>S</td><td>5</td><td>4</td><td>3</td><td>2</td><td>2</td></tr>
</table></div>
    <p><strong>Q2.</strong> \(D(5, 4) = 2\). Remontée : S et X diffèrent et \(D(5, 4) = D(4, 3) + 1\) : substitution de S par X ; I = I : on recule en diagonale en \((3, 2)\) ; R = R : de même en \((2, 1)\) ; \(D(2, 1) = D(1, 1) + 1\) : suppression de A ; enfin P = P. Suite : supprimer A, remplacer S par X (PARIS → PRIS → PRIX).</p>
    <pre class="codeblock"><span class="kw">def</span> operations(a: str, b: str) -&gt; list:
    <span class="str">"""Suite d'opérations de longueur minimale qui transforme a en b."""</span>
    D = lev_table(a, b)
    i, j, ops = len(a), len(b), []
    <span class="kw">while</span> i &gt; 0 <span class="kw">or</span> j &gt; 0:
        <span class="kw">if</span> i &gt; 0 <span class="kw">and</span> j &gt; 0 <span class="kw">and</span> a[i - 1] == b[j - 1]:
            i, j = i - 1, j - 1          <span class="cmt"># lettre conservée (D[i][j] == D[i-1][j-1])</span>
        <span class="kw">elif</span> i &gt; 0 <span class="kw">and</span> j &gt; 0 <span class="kw">and</span> D[i][j] == D[i - 1][j - 1] + 1:
            ops.append(<span class="str">"remplacer "</span> + a[i - 1] + <span class="str">" par "</span> + b[j - 1])
            i, j = i - 1, j - 1
        <span class="kw">elif</span> i &gt; 0 <span class="kw">and</span> D[i][j] == D[i - 1][j] + 1:
            ops.append(<span class="str">"supprimer "</span> + a[i - 1])
            i = i - 1
        <span class="kw">else</span>:
            ops.append(<span class="str">"insérer "</span> + b[j - 1])
            j = j - 1
    <span class="kw">return</span> renverse(ops)</pre>
    <p><strong>Q3.</strong> La PLSC est PRI, de longueur 3. Sans substitution : supprimer les \(5 - 3 = 2\) lettres A et S de PARIS, puis insérer la lettre X : \(5 + 4 - 2 \times 3 = 3\) opérations. La substitution S → X remplace une suppression et une insertion.</p>
    <p><strong>Q4.</strong> Chaque appel \((i, j)\) déclenche des appels en \((i - 1, j)\), \((i, j - 1)\), \((i - 1, j - 1)\) ; depuis \((n, m)\), on atteint tous les couples \((i, j)\) avec \(0 \leq i \leq n\) et \(0 \leq j \leq m\) (les cases de la ligne et de la colonne 0 sont des cas de base, atteints depuis leurs voisines ; \((0, 0)\) l'est en diagonale depuis \((1, 1)\)) : \((n + 1)(m + 1)\) clés si \(n, m \geq 1\). C'est la même mémoire \(O(nm)\) que la table.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Où construire la caserne ?</h3>
  <div class="statement">Cinq villages, numérotés de 0 à 4, sont reliés par des routes à double sens ; les durées de trajet, en minutes, sont : 0 – 1 : 7, 0 – 2 : 2, 1 – 2 : 3, 1 – 3 : 4, 2 – 3 : 9, 3 – 4 : 2, 2 – 4 : 12. On veut construire la caserne de pompiers dans le village qui minimise la durée du trajet vers le village le plus éloigné (l'<em>excentricité</em> du village).</div>
  <div class="q"><strong>Q1.</strong> Écrire la matrice \(M\) des durées (avec \(\infty\) pour l'absence de route). Est-elle symétrique ?</div>
  <div class="q"><strong>Q2.</strong> Appliquer l'algorithme de Floyd-Warshall et donner la matrice des distances.</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">centre(M)</span>, qui renvoie le village où construire la caserne. Quelle est sa complexité ?</div>
  <div class="q"><strong>Q4.</strong> Pourquoi ne pas calculer simplement, pour chaque village, la plus grande des durées des routes qui en partent ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les routes sont à double sens, donc \(M\) est symétrique :</p>
    <div class="formula">$$M = \begin{pmatrix} 0 &amp; 7 &amp; 2 &amp; ∞ &amp; ∞ \\ 7 &amp; 0 &amp; 3 &amp; 4 &amp; ∞ \\ 2 &amp; 3 &amp; 0 &amp; 9 &amp; 12 \\ ∞ &amp; 4 &amp; 9 &amp; 0 &amp; 2 \\ ∞ &amp; ∞ &amp; 12 &amp; 2 &amp; 0 \end{pmatrix}$$</div>
    <p><strong>Q2.</strong> Étape \(k = 0\) : aucune amélioration (0 n'améliore que des couples reliés à 0 des deux côtés : \(M[1][2] = 3 \lt 7 + 2\)). Étape \(k = 1\) : \(D[0][3]\) passe à \(7 + 4 = 11\) ; \(D[2][3]\) passe de 9 à \(3 + 4 = 7\) ; ainsi de suite. Résultat :</p>
    <div class="formula">$$D = \begin{pmatrix} 0 &amp; 5 &amp; 2 &amp; 9 &amp; 11 \\ 5 &amp; 0 &amp; 3 &amp; 4 &amp; 6 \\ 2 &amp; 3 &amp; 0 &amp; 7 &amp; 9 \\ 9 &amp; 4 &amp; 7 &amp; 0 &amp; 2 \\ 11 &amp; 6 &amp; 9 &amp; 2 &amp; 0 \end{pmatrix}$$</div>
    <p>Par exemple, de 0 à 4 : \(0 \to 2 \to 1 \to 3 \to 4\), \(2 + 3 + 4 + 2 = 11\) minutes, moins que \(0 \to 2 \to 4\) (14).</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> centre(M: list) -&gt; int:
    <span class="str">"""Sommet qui minimise la plus grande distance aux autres sommets."""</span>
    D = floyd_warshall(M)
    n = len(D)
    meilleur, ecc_min = 0, inf
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        ecc = 0                       <span class="cmt"># excentricité de i</span>
        <span class="kw">for</span> j <span class="kw">in</span> range(n):
            <span class="kw">if</span> D[i][j] &gt; ecc:
                ecc = D[i][j]
        <span class="kw">if</span> ecc &lt; ecc_min:
            meilleur, ecc_min = i, ecc
    <span class="kw">return</span> meilleur</pre>
    <p>Excentricités (maximum de chaque ligne de \(D\)) : 11, 6, 9, 9, 11. La caserne va au village 1 (6 minutes au plus). Complexité : \(O(n^3)\) pour Floyd-Warshall, puis \(O(n^2)\) pour les maxima : \(O(n^3)\).</p>
    <p><strong>Q4.</strong> Les durées des routes ne sont pas les distances : un trajet peut emprunter plusieurs routes, et la route directe n'est pas toujours la plus rapide (de 0 à 1 : 7 minutes par la route directe, 5 par le village 2). Il faut les vraies distances, donc un algorithme de plus courts chemins.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Découper un texte sans espaces</h3>
  <div class="statement">Un texte a perdu ses espaces : <span class="code-inline">texte = "lassoleil"</span>. On dispose d'un lexique, rangé dans un dictionnaire dont seules les clés comptent : <span class="code-inline">mots = {"la": 0, "las": 0, "lasso": 0, "so": 0, "sol": 0, "soleil": 0, "o": 0, "le": 0, "il": 0}</span>. On note \(N(i)\) le nombre de façons de découper le préfixe <span class="code-inline">texte[0:i]</span> en une suite de mots du lexique.</div>
  <div class="q"><strong>Q1.</strong> Justifier \(N(0) = 1\) et \(N(i) = \sum N(k)\), la somme portant sur les \(k \lt i\) tels que <span class="code-inline">texte[k:i]</span> est un mot du lexique.</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">segmentations(texte, mots)</span>, de bas en haut. Calculer la table pour l'exemple et donner les découpages.</div>
  <div class="q"><strong>Q3.</strong> On cherche un découpage en un nombre minimal de mots. Adapter la récurrence, écrire <span class="code-inline">moins_de_mots(texte, mots)</span> avec reconstruction, et donner le résultat.</div>
  <div class="q"><strong>Q4.</strong> Complexité, en supposant que l'extraction et le test <span class="code-inline">texte[k:i] in mots</span> coûtent \(O(i - k)\) ? Pourquoi un dictionnaire plutôt qu'une liste de mots ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le texte vide a exactement un découpage, la suite vide. Un découpage de <span class="code-inline">texte[0:i]</span> (pour \(i \geq 1\)) se termine par un dernier mot <span class="code-inline">texte[k:i]</span> du lexique, précédé d'un découpage quelconque de <span class="code-inline">texte[0:k]</span> ; des derniers mots différents donnent des découpages différents. D'où la somme.</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> segmentations(texte: str, mots: dict) -&gt; int:
    <span class="str">"""Nombre de façons de découper texte en une suite de mots du</span>
<span class="str">    dictionnaire mots (seules ses clés comptent)."""</span>
    n = len(texte)
    N = [0] * (n + 1)          <span class="cmt"># N[i] : découpages de texte[0:i]</span>
    N[0] = 1
    <span class="kw">for</span> i <span class="kw">in</span> range(1, n + 1):
        <span class="kw">for</span> k <span class="kw">in</span> range(i):     <span class="cmt"># dernier mot : texte[k:i]</span>
            <span class="kw">if</span> texte[k:i] <span class="kw">in</span> mots:
                N[i] = N[i] + N[k]
    <span class="kw">return</span> N[n]

<span class="kw">def</span> moins_de_mots(texte: str, mots: dict) -&gt; list:
    <span class="str">"""Un découpage de texte en un nombre minimal de mots ([] s'il n'y</span>
<span class="str">    en a pas)."""</span>
    n = len(texte)
    inf = float(<span class="str">'inf'</span>)
    K = [inf] * (n + 1)        <span class="cmt"># K[i] : nombre minimal de mots pour texte[0:i]</span>
    debut = [0] * (n + 1)      <span class="cmt"># début du dernier mot d'un découpage optimal</span>
    K[0] = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(1, n + 1):
        <span class="kw">for</span> k <span class="kw">in</span> range(i):
            <span class="kw">if</span> texte[k:i] <span class="kw">in</span> mots <span class="kw">and</span> K[k] + 1 &lt; K[i]:
                K[i], debut[i] = K[k] + 1, k
    <span class="kw">if</span> K[n] == inf:
        <span class="kw">return</span> []
    res, i = [], n
    <span class="kw">while</span> i &gt; 0:
        res = [texte[debut[i]:i]] + res
        i = debut[i]
    <span class="kw">return</span> res</pre>
    <div><table>
<tr><th>\(i\)</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr>
<tr><td>préfixe</td><td>ε</td><td>l</td><td>la</td><td>las</td><td>lass</td><td>lasso</td><td>lassol</td><td>lassole</td><td>lassolei</td><td>lassoleil</td></tr>
<tr><td>\(N(i)\)</td><td>1</td><td>0</td><td>1</td><td>1</td><td>0</td><td>2</td><td>1</td><td>2</td><td>0</td><td>3</td></tr>
</table></div>
    <p>\(N(9) = 3\) : « lasso le il », « las so le il », « las soleil ». Par exemple \(N(5) = N(0) + N(3) = 2\) (lasso, ou las + so), et \(N(9) = N(7) + N(3) = 2 + 1\) (dernier mot « il » ou « soleil »).</p>
    <p><strong>Q3.</strong> \(K(0) = 0\) et \(K(i) = 1 + \min K(k)\) sur les mêmes \(k\) (\(+\infty\) s'il n'y en a aucun). On retient dans <span class="code-inline">debut[i]</span> le \(k\) qui réalise le minimum, puis on remonte de \(n\) à 0 (fonction <span class="code-inline">moins_de_mots</span> ci-dessus). Résultat : <span class="code-inline">['las', 'soleil']</span>, deux mots.</p>
    <p><strong>Q4.</strong> Pour chaque \(i\), on essaie \(i\) valeurs de \(k\), chacune en \(O(i - k)\) : \(\sum_i \sum_{k \lt i} (i - k) = O(n^3)\) dans le pire cas ; si les mots du lexique ont au plus \(\ell\) lettres, on peut se limiter à \(k \geq i - \ell\), d'où \(O(n \ell^2)\). Avec une liste de \(W\) mots, chaque test <span class="code-inline">in</span> serait une recherche séquentielle en \(O(W)\) comparaisons ; avec un dictionnaire, il coûte en moyenne le seul hachage de la chaîne.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un correcteur orthographique</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique des concours (thème : dictionnaires, distance d'édition, mémoïsation, complexité).</div>
  <div class="statement">On veut proposer une correction pour un mot mal orthographié. On dispose d'un texte de référence découpé en mots (liste de chaînes en minuscules). La distance entre deux mots est la distance de Levenshtein (insertion, suppression, substitution d'une lettre, chacune de coût 1). Le correcteur propose le mot du lexique le plus proche, et, à distance égale, le plus fréquent dans le texte. On rappelle que <span class="code-inline">min(x, y, z)</span> renvoie le plus petit de ses arguments.</div>
  <p class="exo-part">Partie A — Le lexique</p>
  <div class="q"><strong>A1.</strong> Écrire <span class="code-inline">frequences(texte: list) -&gt; dict</span>, qui renvoie le dictionnaire associant à chaque mot du texte son nombre d'occurrences. Quelle est sa complexité (en moyenne) pour un texte de \(T\) mots ?</div>
  <div class="q"><strong>A2.</strong> Pourquoi un dictionnaire est-il préférable ici à une liste de couples (mot, fréquence) ?</div>
  <p class="exo-part">Partie B — Une distance récursive</p>
  <div class="q"><strong>B1.</strong> Écrire une fonction récursive <span class="code-inline">dist(a, b, i, j)</span>, sans mémoïsation, qui renvoie la distance entre <span class="code-inline">a[0:i]</span> et <span class="code-inline">b[0:j]</span>.</div>
  <div class="q"><strong>B2.</strong> Pour deux mots de 4 lettres, <span class="code-inline">dist</span> fait 481 appels ; pour deux mots de 8 lettres, 398 593. Combien y a-t-il de sous-problèmes distincts ? Expliquer l'écart.</div>
  <p class="exo-part">Partie C — Mémoïsation et mémoire</p>
  <div class="q"><strong>C1.</strong> Écrire une version mémoïsée <span class="code-inline">lev_memo(a, b, i, j, memo)</span>. Quelle est la forme des clés ? Quelle est sa complexité en temps et en mémoire pour des mots de longueurs \(n\) et \(m\) ?</div>
  <div class="q"><strong>C2.</strong> Écrire une version itérative <span class="code-inline">lev_deux_lignes(a, b)</span> qui n'utilise que deux lignes de la table. Quelle information perd-on ?</div>
  <p class="exo-part">Partie D — La suggestion</p>
  <div class="q"><strong>D1.</strong> Montrer que \(d(a, b) \geq \big|\,|a| - |b|\,\big|\), où \(|a|\) est la longueur de \(a\).</div>
  <div class="q"><strong>D2.</strong> Écrire <span class="code-inline">suggestion(mot, freq, dmax)</span>, qui renvoie le mot du lexique à distance au plus <span class="code-inline">dmax</span> de <span class="code-inline">mot</span>, le plus proche, puis le plus fréquent en cas d'égalité ; <span class="code-inline">mot</span> lui-même si aucun ne convient. Utiliser D1 pour éviter des calculs inutiles.</div>
  <div class="q"><strong>D3.</strong> Avec le texte « la maison est grande et la saison est belle mais la maison du voisin est en raison de la saison plus belle », donner les suggestions pour maisson, saisson, belel et ordinateur, avec <span class="code-inline">dmax = 2</span>.</div>
  <div class="q"><strong>D4.</strong> Un vrai lexique compte \(W = 3 \times 10^5\) mots d'au plus 10 lettres. Estimer le nombre d'opérations d'une suggestion dans le pire cas, et la durée à \(10^7\) opérations par seconde.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> frequences(texte: list) -&gt; dict:
    <span class="str">"""{mot: nombre d'occurrences} pour la liste de mots texte."""</span>
    freq = {}
    <span class="kw">for</span> mot <span class="kw">in</span> texte:
        <span class="kw">if</span> mot <span class="kw">in</span> freq:
            freq[mot] = freq[mot] + 1
        <span class="kw">else</span>:
            freq[mot] = 1
    <span class="kw">return</span> freq</pre>
    <p>\(T\) tours de coût constant en moyenne : \(O(T)\).</p>
    <p><strong>A2.</strong> Chaque mot lu doit être retrouvé dans le lexique : avec une liste de \(W\) couples, c'est une recherche séquentielle en \(O(W)\), d'où \(O(TW)\) au total ; avec un dictionnaire, le hachage du mot donne directement son alvéole.</p>
    <p><strong>B1.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> dist(a: str, b: str, i: int, j: int) -&gt; int:
    <span class="str">"""Distance d'édition entre a[0:i] et b[0:j], sans mémoïsation."""</span>
    <span class="kw">if</span> i == 0:
        <span class="kw">return</span> j
    <span class="kw">if</span> j == 0:
        <span class="kw">return</span> i
    cout = 1
    <span class="kw">if</span> a[i - 1] == b[j - 1]:
        cout = 0
    <span class="kw">return</span> min(dist(a, b, i - 1, j) + 1,
               dist(a, b, i, j - 1) + 1,
               dist(a, b, i - 1, j - 1) + cout)</pre>
    <p><strong>B2.</strong> Les sous-problèmes sont les couples \((i, j)\) avec \(0 \leq i \leq n\), \(0 \leq j \leq m\) : 25 pour des mots de 4 lettres, 81 pour 8 lettres. Mais chaque appel en déclenche trois, qui se recouvrent : \((i - 1, j - 1)\) est demandé directement, puis encore par \((i - 1, j)\) et par \((i, j - 1)\). Le nombre d'appels croît exponentiellement (environ \(5{,}5\) fois plus par lettre ajoutée à chaque mot) : c'est le chevauchement des sous-problèmes.</p>
    <p><strong>C1.</strong> Les clés sont les tuples <span class="code-inline">(i, j)</span> (une liste serait refusée).</p>
    <pre class="codeblock"><span class="kw">def</span> lev_memo(a: str, b: str, i: int, j: int, memo: dict) -&gt; int:
    <span class="str">"""Distance entre a[0:i] et b[0:j], par mémoïsation dans memo."""</span>
    <span class="kw">if</span> (i, j) <span class="kw">in</span> memo:
        <span class="kw">return</span> memo[(i, j)]
    <span class="kw">if</span> i == 0:
        r = j
    <span class="kw">elif</span> j == 0:
        r = i
    <span class="kw">else</span>:
        cout = 0
        <span class="kw">if</span> a[i - 1] != b[j - 1]:
            cout = 1
        r = min(lev_memo(a, b, i - 1, j, memo) + 1,
                lev_memo(a, b, i, j - 1, memo) + 1,
                lev_memo(a, b, i - 1, j - 1, memo) + cout)
    memo[(i, j)] = r
    <span class="kw">return</span> r</pre>
    <p>Chaque couple est calculé une fois en \(O(1)\) hors appels : \(O(nm)\) en temps ; le dictionnaire contient au plus \((n + 1)(m + 1)\) clés, et la pile d'appels a une profondeur au plus \(n + m\) : \(O(nm)\) en mémoire.</p>
    <p><strong>C2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> lev_deux_lignes(a: str, b: str) -&gt; int:
    <span class="str">"""Distance d'édition avec deux lignes de la table en mémoire."""</span>
    m = len(b)
    prec = [j <span class="kw">for</span> j <span class="kw">in</span> range(m + 1)]         <span class="cmt"># ligne i = 0</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(a) + 1):
        cour = [0] * (m + 1)
        cour[0] = i
        <span class="kw">for</span> j <span class="kw">in</span> range(1, m + 1):
            cout = 0
            <span class="kw">if</span> a[i - 1] != b[j - 1]:
                cout = 1
            cour[j] = min(prec[j] + 1, cour[j - 1] + 1, prec[j - 1] + cout)
        prec = cour                          <span class="cmt"># la ligne i devient la précédente</span>
    <span class="kw">return</span> prec[m]</pre>
    <p>Mémoire \(O(m)\), temps toujours \(O(nm)\). On perd les lignes effacées, donc la possibilité de reconstruire la suite d'opérations.</p>
    <p><strong>D1.</strong> Chaque opération change la longueur du mot d'au plus 1 (insertion : +1, suppression : −1, substitution : 0). Pour passer de la longueur \(|a|\) à la longueur \(|b|\), il faut donc au moins \(\big|\,|a| - |b|\,\big|\) opérations.</p>
    <p><strong>D2.</strong> Si les longueurs diffèrent de plus de <span class="code-inline">dmax</span>, la distance dépasse <span class="code-inline">dmax</span> (D1) : inutile de la calculer.</p>
    <pre class="codeblock"><span class="kw">def</span> suggestion(mot: str, freq: dict, dmax: int) -&gt; str:
    <span class="str">"""Mot du lexique le plus proche de mot (distance &lt;= dmax), le plus</span>
<span class="str">    fréquent en cas d'égalité ; mot lui-même s'il n'y en a pas."""</span>
    meilleur, dmin, fmax = mot, dmax, 0     <span class="cmt"># fmax = 0 : aucun candidat</span>
    <span class="kw">for</span> m, f <span class="kw">in</span> freq.items():
        ecart = len(m) - len(mot)
        <span class="kw">if</span> ecart &lt;= dmax <span class="kw">and</span> -ecart &lt;= dmax:     <span class="cmt"># sinon distance &gt; dmax</span>
            d = lev_deux_lignes(mot, m)
            <span class="kw">if</span> d &lt; dmin <span class="kw">or</span> (d == dmin <span class="kw">and</span> f &gt; fmax):
                meilleur, dmin, fmax = m, d, f
    <span class="kw">return</span> meilleur</pre>
    <p>Au départ, <span class="code-inline">dmin = dmax</span> et <span class="code-inline">fmax = 0</span> : un mot du lexique (de fréquence au moins 1) est retenu dès que sa distance est au plus <span class="code-inline">dmax</span> ; ensuite, seul un mot strictement plus proche, ou aussi proche et plus fréquent, le remplace.</p>
    <p><strong>D3.</strong> Lexique : <span class="code-inline">{'la': 4, 'maison': 2, 'est': 3, 'grande': 1, 'et': 1, 'saison': 2, 'belle': 2, 'mais': 1, 'du': 1, 'voisin': 1, 'en': 1, 'raison': 1, 'de': 1, 'plus': 1}</span>. Suggestions : maisson → <span class="code-inline">"maison"</span> (distance 1), saisson → <span class="code-inline">"saison"</span> (distance 1), belel → <span class="code-inline">"belle"</span> (distance 2), ordinateur → <span class="code-inline">"ordinateur"</span> (aucun mot du lexique à distance au plus 2 : le mot est rendu tel quel).</p>
    <p><strong>D4.</strong> Pour chaque mot du lexique, au pire une table de \(11 \times 11\) cases, environ 100 opérations : \(3 \times 10^5 \times 10^2 = 3 \times 10^7\) opérations, soit environ 3 secondes, trop pour un correcteur interactif. Le filtrage par longueur (D1) élimine une bonne partie des mots ; en pratique, on indexe aussi le lexique (par exemple par longueur, dans un dictionnaire) pour ne comparer qu'aux mots plausibles.</p>
  </div>
</div>
