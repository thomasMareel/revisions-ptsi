<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">La résistance des matériaux est entièrement au programme de 2ᵉ année (semestre S3) : compétences B2 « associer un modèle poutre à un solide » et « modéliser les petits déplacements », C1 « proposer une démarche pour déterminer les contraintes et les déplacements le long d'une poutre » et C2 « déterminer les grandeurs relatives au comportement d'une poutre ». Elle sert ensuite au semestre S4 pour choisir un modèle (solide indéformable ou déformable) et pour dimensionner une pièce ou une liaison (critères de résistance et de déplacement). Elle s'appuie sur la statique ; l'essai de traction (§6) fait le lien avec le chapitre Triptyque produit–procédé–matériau, où sont présentés les autres essais (dureté, résilience, fatigue).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Associer un modèle poutre à un solide</strong> : hypothèses de géométrie, fibre neutre et section droite, continuité, élasticité, homogénéité et isotropie du matériau, hypothèses de Navier-Bernoulli et de Barré de Saint-Venant, petites perturbations (B2, S3) (§1).</li>
        <li><strong>Choisir un modèle adapté</strong> : solide indéformable ou déformable, domaine de validité (B2, S4) (§1).</li>
        <li><strong>Conditions aux limites</strong> : modèles des liaisons et conditions sur la déformée (C2, S3) (§1, §8).</li>
        <li><strong>Modéliser les petits déplacements</strong> : torseur des petits déplacements ; petites déformations (B2, S3) (§2).</li>
        <li><strong>Torseur de cohésion</strong>, méthode des coupures, tronçons ; vecteur contrainte (C1 et C2, S3) (§3).</li>
        <li><strong>Diagrammes des efforts intérieurs</strong> ; équations d'équilibre local (C1, S3) (§4).</li>
        <li><strong>Caractéristiques géométriques des sections</strong> : aire, moments quadratiques, moment polaire (C2, S3) (§5).</li>
        <li><strong>Loi de comportement élastique</strong> et essai de traction : module d'Young, coefficient de Poisson, module de cisaillement, limite élastique (C2 et A5, S3) (§6).</li>
        <li><strong>Sollicitations simples</strong> — traction-compression, cisaillement, torsion, flexion — : contraintes dans une section droite, déformations, déplacements de la ligne moyenne (C2, S3) (§7, §8).</li>
        <li><strong>Théorème de superposition</strong> (C1, S3) (§8).</li>
        <li><strong>Dimensionner</strong> selon les critères de résistance et de déplacement (F3, S4) (§9).</li>
      </ul>
      <p>Hors programme : les méthodes de résolution des problèmes <strong>hyperstatiques</strong> (tous les exemples de ce chapitre sont isostatiques). Compléments non exigibles, gardés pour la culture de l'ingénieur et signalés en place : le <strong>flambement</strong> (simple mise en garde, §7), la <strong>formule de Jourawski</strong> (§8), le <strong>coefficient de concentration de contraintes</strong> et le <strong>critère de Von Mises</strong> (principes, §9).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LE MODÈLE POUTRE</div>
  <h2>Du solide réel à la poutre : géométrie et hypothèses</h2>
  <div class="intro">La résistance des matériaux (RdM) répond à deux questions de bureau d'études sans recourir aux éléments finis : la pièce <strong>tient-elle</strong> (contraintes) et reste-t-elle <strong>assez rigide</strong> (déplacements) ? Elle s'appuie sur un modèle géométrique très simple, la poutre, et sur un petit nombre d'hypothèses qui rendent tous les calculs linéaires.</div>

  <h3>Géométrie d'une poutre</h3>
  <div class="def-box">
    Une <strong>poutre</strong> est le solide balayé par une surface plane \(\Sigma\), la <strong>section droite</strong>, dont le centre de surface \(G\) parcourt une courbe, la <strong>ligne moyenne</strong> (ou fibre moyenne), \(\Sigma\) restant perpendiculaire à cette courbe. On l'emploie lorsque :
    <ul style="margin:.4rem 0">
      <li>la ligne moyenne est droite (cas traité ici) ou de grand rayon de courbure ;</li>
      <li>la section est constante ou varie lentement, sans discontinuité brutale ;</li>
      <li>la poutre est <strong>élancée</strong> : sa longueur vaut au moins 5 à 10 fois la plus grande dimension transversale.</li>
    </ul>
  </div>
  <p>On repère une section par son abscisse \(x\) le long de la ligne moyenne : \(\overrightarrow{OG} = x\,\vec x\). Le repère local \((G,\vec x,\vec y,\vec z)\) a \(\vec x\) tangent à la ligne moyenne (orienté de l'origine vers l'autre extrémité) et \(\vec y,\vec z\) dans le plan de \(\Sigma\), selon ses axes principaux (en pratique ses axes de symétrie). Le chargement plan est pris dans le plan \((\vec x,\vec y)\).</p>

  <h3>Les hypothèses de la RdM</h3>
  <div class="prop-box">
    <ul style="margin:.2rem 0">
      <li><strong>Matériau</strong> continu, homogène et isotrope.</li>
      <li><strong>Élasticité linéaire</strong> : les déformations sont réversibles et proportionnelles aux contraintes ; on reste en dessous de la limite élastique.</li>
      <li><strong>Petites perturbations (HPP)</strong> : déplacements petits devant les dimensions de la pièce, déformations petites devant 1. On écrit donc l'équilibre sur la géométrie <em>initiale</em>, et les effets de plusieurs charges s'additionnent (<strong>superposition</strong>).</li>
      <li><strong>Navier-Bernoulli</strong> : une section droite, plane et normale à la ligne moyenne avant chargement, reste plane et normale à la ligne moyenne déformée (pas de gauchissement ; glissements dus à l'effort tranchant négligés).</li>
      <li><strong>Barré de Saint-Venant</strong> : à une distance des points d'application des efforts de l'ordre de la plus grande dimension transversale, contraintes et déformations ne dépendent que du <em>torseur</em> des actions appliquées, pas de leur répartition détaillée.</li>
    </ul>
  </div>
  <div class="notice"><strong>Limite du modèle.</strong> Au voisinage d'un appui, d'une charge concentrée ou d'un changement brusque de section, Saint-Venant ne s'applique plus : les formules de la RdM y sont fausses localement. On les corrige par un <strong>coefficient de concentration de contraintes</strong> \(K_t\) (§9) ou on passe à un calcul par éléments finis.</div>

  <h3>Solide indéformable ou solide déformable ?</h3>
  <p>Dans l'étude d'un mécanisme, les pièces sont d'abord des solides indéformables : c'est le bon modèle pour une loi entrée-sortie, une statique ou une dynamique, tant que les déformations ne changent pas la géométrie. On passe au <strong>solide déformable</strong> (ici, le modèle poutre) dès que la déformation devient la question elle-même ou qu'elle modifie le comportement :</p>
  <ul>
    <li><strong>dimensionner</strong> : vérifier qu'une pièce résiste (contraintes) et qu'elle reste assez rigide pour sa fonction (flèche d'une broche, angle de torsion d'un arbre) ;</li>
    <li><strong>lever une indétermination</strong> : les inconnues hyperstatiques d'un mécanisme (chapitre Chaînes de solides, §6) dépendent des raideurs des pièces, que le modèle indéformable ignore ;</li>
    <li><strong>prévoir un comportement dynamique</strong> : une pièce souple (arbre long, courroie, bras de robot léger) entre une inertie et un moteur forme un ressort ; si la fréquence propre ainsi créée approche la bande passante de l'asservissement, le modèle indéformable donne des performances fausses.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — arbre de transmission d'un axe asservi</strong>
    <p>Un moteur entraîne un tambour (inertie \(J = 0{,}05\ \text{kg·m}^2\)) par un arbre plein en acier de diamètre 20 mm et de longueur 1,5 m. La boucle de position est réglée pour une pulsation de coupure \(\omega_{c0} = 30\ \text{rad/s}\). Le modèle indéformable est-il acceptable ?</p>
    <ol>
      <li>Raideur en torsion de l'arbre (§7) : \(I_0 = \pi D^4/32 \approx 1{,}57\cdot10^{-8}\ \text{m}^4\), \(k_t = G I_0/L \approx 81\cdot10^9 \times 1{,}57\cdot10^{-8}/1{,}5 \approx 850\ \text{N·m/rad}\).</li>
      <li>Tambour sur ce ressort de torsion, moteur supposé bloqué : pulsation propre \(\omega_0 = \sqrt{k_t/J} \approx 130\ \text{rad/s}\) (environ 21 Hz).</li>
      <li>\(\omega_0/\omega_{c0} \approx 4\) : le mode de torsion est trop proche de la bande passante (règle pratique : un rapport d'au moins 5 à 10). Il faut un modèle à deux inerties reliées par un ressort, ou un arbre plus raide : avec 30 mm de diamètre, \(k_t\) est multipliée par \((30/20)^4 \approx 5\) et \(\omega_0 \approx 290\ \text{rad/s}\), soit un rapport proche de 10.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · DÉPLACEMENTS ET DÉFORMATIONS</div>
  <h2>Petits déplacements et petites déformations d'une section</h2>
  <div class="intro">Grâce à l'hypothèse de Navier-Bernoulli, et en négligeant la déformation de la section dans son propre plan, chaque section droite se déplace comme une plaque rigide. Son déplacement se décrit donc par un torseur, exactement comme le champ des vitesses d'un solide en cinématique.</div>

  <h3>Torseur des petits déplacements</h3>
  <div class="def-box">
    La section d'abscisse \(x\) subit une translation \(\vec u(G) = u\,\vec x + v\,\vec y + w\,\vec z\) (\(u\) : déplacement longitudinal ; \(v\), \(w\) : déplacements transversaux, ou <strong>flèches</strong>) et une petite rotation \(\vec\theta = \theta_x\vec x + \theta_y\vec y + \theta_z\vec z\) (\(\theta_x\) : rotation de torsion ; \(\theta_y\), \(\theta_z\) : rotations de flexion).
    <div class="formula">$$\{\mathcal{U}(x)\}_G = \begin{Bmatrix} \vec\theta(x) \\ \vec u(G) \end{Bmatrix}_G \qquad \vec u(M) = \vec u(G) + \vec\theta \wedge \overrightarrow{GM}$$</div>
  </div>

  <h3>Torseur des petites déformations</h3>
  <p>On compare deux sections voisines d'abscisses \(x\) et \(x + dx\). La variation, rapportée à \(dx\), du torseur des petits déplacements définit le torseur des petites déformations :</p>
  <div class="formula">$$\{\mathcal{E}(x)\}_G = \begin{Bmatrix} \dfrac{d\vec\theta}{dx} \\ \dfrac{d\vec u(G)}{dx} + \vec x \wedge \vec\theta \end{Bmatrix}_G$$</div>
  <ul>
    <li>\(\gamma_t = \dfrac{d\theta_x}{dx}\) : <strong>angle unitaire de torsion</strong> (rad/m) ;</li>
    <li>\(\dfrac{d\theta_z}{dx}\), \(\dfrac{d\theta_y}{dx}\) : <strong>courbures</strong> de flexion (m⁻¹) ;</li>
    <li>\(\varepsilon = \dfrac{du}{dx}\) : <strong>allongement unitaire</strong> de la ligne moyenne (sans dimension) ;</li>
    <li>\(\dfrac{dv}{dx} - \theta_z\) et \(\dfrac{dw}{dx} + \theta_y\) : <strong>glissements</strong> (sans dimension).</li>
  </ul>
  <div class="prop-box">
    Avec Navier-Bernoulli, les glissements sont nuls : la rotation de flexion est la pente de la déformée, \(\theta_z = \dfrac{dv}{dx}\). L'allongement de la fibre passant par \(M(y,z)\) se lit sur la composante selon \(\vec x\) de
    <div class="formula">$$\vec\varepsilon(M) = \vec\varepsilon(G) + \frac{d\vec\theta}{dx}\wedge\overrightarrow{GM}$$</div>
    soit :
    <div class="formula">$$\varepsilon_{xx}(M) = \frac{du}{dx} - y\,\frac{d\theta_z}{dx} + z\,\frac{d\theta_y}{dx}$$</div>
    Cette seule relation contient la traction (premier terme) et les deux flexions : elle est le point de départ du calcul des contraintes normales.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Retrouver la composante selon \(\vec x\) du produit \(\dfrac{d\vec\theta}{dx}\wedge\overrightarrow{GM}\) avec \(\overrightarrow{GM} = y\,\vec y + z\,\vec z\).</span>
    <div class="content"><p>Seuls les termes de flexion donnent une composante axiale : \(\theta_z'\,\vec z\wedge y\,\vec y = -y\,\theta_z'\,\vec x\) et \(\theta_y'\,\vec y\wedge z\,\vec z = z\,\theta_y'\,\vec x\). Le terme de torsion \(\theta_x'\,\vec x\wedge\overrightarrow{GM}\) reste dans le plan de la section : il produit un glissement, pas un allongement.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ACTIONS INTÉRIEURES</div>
  <h2>Vecteur contrainte et torseur de cohésion</h2>
  <div class="intro">Pour « voir » les efforts qui traversent la matière, on coupe la poutre par la pensée en \(G(x)\) : c'est la <strong>coupure fictive</strong>. Chacun des deux tronçons exerce alors sur l'autre des actions réparties sur toute la section.</div>

  <h3>Vecteur contrainte</h3>
  <div class="def-box">
    Sur un élément de surface \(dS\) entourant le point \(M\) de \(\Sigma\), le tronçon aval II exerce sur le tronçon amont I une force \(d\vec F = \vec C(M,\vec x)\,dS\), où \(\vec x\) est la normale sortante de I. Le <strong>vecteur contrainte</strong> se décompose en :
    <div class="formula">$$\vec C(M,\vec x) = \sigma\,\vec x + \tau_y\,\vec y + \tau_z\,\vec z$$</div>
    \(\sigma\) est la <strong>contrainte normale</strong> (\(\sigma \gt 0\) : traction, \(\sigma \lt 0\) : compression) et \(\vec\tau = \tau_y\vec y + \tau_z\vec z\) la <strong>contrainte tangentielle</strong> (cisaillement), contenue dans le plan de la section. Unité : le pascal ; en pratique le MPa \(= 1\ \text{N/mm}^2\).
  </div>

  <h3>Torseur de cohésion</h3>
  <div class="def-box">
    Le <strong>torseur de cohésion</strong> est le torseur, réduit en \(G\), des actions de II sur I :
    <div class="formula">$$\{\mathcal{T}_{coh}\}_G = \begin{Bmatrix} \displaystyle\iint_\Sigma \vec C(M,\vec x)\,dS \\ \displaystyle\iint_\Sigma \overrightarrow{GM}\wedge\vec C(M,\vec x)\,dS \end{Bmatrix}_G = \begin{Bmatrix} N &amp; M_t \\ T_y &amp; M_{fy} \\ T_z &amp; M_{fz} \end{Bmatrix}_{G,(\vec x,\vec y,\vec z)}$$</div>
    \(N\) : effort normal ; \(T_y\), \(T_z\) : efforts tranchants ; \(M_t\) : moment de torsion ; \(M_{fy}\), \(M_{fz}\) : moments fléchissants.
  </div>
  <div class="prop-box">
    <strong>Calcul pratique.</strong> L'équilibre du tronçon I s'écrit \(\{\text{II}\to\text{I}\} + \{\bar E\to\text{I}\} = \{0\}\) ; celui de la poutre entière permet de basculer sur l'autre tronçon :
    <div class="formula">$$\{\mathcal{T}_{coh}\} = -\{\bar E\to \text{I}\} = +\{\bar E\to \text{II}\}$$</div>
    On isole le tronçon qui porte <strong>le moins</strong> d'actions extérieures. Si la poutre est en mouvement, on ajoute le torseur dynamique du tronçon isolé : \(\{\mathcal{T}_{coh}\} = \{\mathcal{D}(\text{I}/R_g)\} - \{\bar E\to\text{I}\}\).
  </div>
  <p>En développant le produit vectoriel avec \(\overrightarrow{GM} = y\,\vec y + z\,\vec z\), on relie les composantes aux contraintes :</p>
  <div class="formula">$$N = \iint_\Sigma \sigma\,dS \qquad T_y = \iint_\Sigma \tau_y\,dS \qquad T_z = \iint_\Sigma \tau_z\,dS$$</div>
  <div class="formula">$$M_t = \iint_\Sigma (y\,\tau_z - z\,\tau_y)\,dS \qquad M_{fy} = \iint_\Sigma z\,\sigma\,dS \qquad M_{fz} = -\iint_\Sigma y\,\sigma\,dS$$</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉQUILIBRE LOCAL ET DIAGRAMMES</div>
  <h2>Équations d'équilibre local et diagrammes des efforts intérieurs</h2>
  <div class="intro">Les composantes du torseur de cohésion sont des fonctions de \(x\), continues par morceaux. Deux équations différentielles les relient à la charge répartie : elles servent à les calculer, et surtout à <strong>contrôler</strong> les diagrammes.</div>

  <h3>Équations d'équilibre local</h3>
  <p>On isole une tranche comprise entre \(x\) et \(x + dx\), soumise à une charge linéique \(\vec q(x)\) (N/m). Sa face gauche reçoit \(-\{\mathcal{T}_{coh}(x)\}\) (action de I sur la tranche), sa face droite \(+\{\mathcal{T}_{coh}(x + dx)\}\).</p>
  <div class="formula">$$\frac{d\vec R}{dx} + \vec q = \vec 0 \qquad\qquad \frac{d\vec M_G}{dx} + \vec x\wedge\vec R = \vec 0$$</div>
  <div class="prop-box">
    En projection, avec \(\vec q = q_x\vec x + q_y\vec y\) :
    <div class="formula">$$\frac{dN}{dx} + q_x = 0 \qquad \frac{dT_y}{dx} + q_y = 0 \qquad \frac{dM_{fz}}{dx} + T_y = 0$$</div>
    De même \(\dfrac{dM_{fy}}{dx} - T_z = 0\) et, sans couple réparti, \(M_t\) est constant par morceaux.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir les deux équations vectorielles à partir de l'équilibre de la tranche.</span>
    <div class="content"><p>Résultantes : \(\vec R(x+dx) - \vec R(x) + \vec q\,dx = \vec 0\), d'où \(\dfrac{d\vec R}{dx} + \vec q = \vec 0\). Moments en \(G(x)\) : le moment de \(\vec R(x+dx)\) transporté de \(G(x+dx)\) à \(G(x)\) fait apparaître \(dx\,\vec x\wedge\vec R\) ; celui de la charge répartie est du second ordre en \(dx\). Il reste \(\vec M_G(x+dx) - \vec M_G(x) + dx\,\vec x\wedge\vec R = \vec 0\), soit la seconde équation. Projetée sur \(\vec z\), elle donne \(M_{fz}' + T_y = 0\) car \(\vec x\wedge T_y\vec y = T_y\vec z\).</p></div>
  </div>

  <h3>Conséquences sur les diagrammes</h3>
  <ul>
    <li>tronçon non chargé : \(T_y\) constant, \(M_{fz}\) affine ;</li>
    <li>charge répartie uniforme : \(T_y\) affine, \(M_{fz}\) parabolique ;</li>
    <li>force concentrée \(F\,\vec y\) en \(x_0\) : <strong>saut</strong> de \(T_y\) égal à \(-F\) (en traversant \(x_0\) dans le sens des \(x\) croissants) et point anguleux de \(M_{fz}\) ;</li>
    <li>couple concentré \(C\,\vec z\) en \(x_0\) : saut de \(M_{fz}\) égal à \(-C\) ;</li>
    <li>\(M_{fz}\) est <strong>extrémal là où \(T_y\) s'annule</strong> ou change de signe ;</li>
    <li>extrémité libre ou articulée sans couple appliqué : \(M_{fz} = 0\).</li>
  </ul>

<div class="course-section">
  <div class="sec-num">§5 · CARACTÉRISTIQUES DES SECTIONS</div>
  <h2>Aire, moments quadratiques et moment polaire</h2>
  <div class="intro">La forme de la section n'intervient que par quelques intégrales purement géométriques. Elles expliquent pourquoi les profilés en I et les tubes sont omniprésents en construction mécanique.</div>
  <div class="def-box">
    Pour une section \(\Sigma\) de centre \(G\), avec \(r^2 = y^2 + z^2\) :
    <div class="formula">$$S = \iint_\Sigma dS \qquad I_{Gz} = \iint_\Sigma y^2\,dS \qquad I_{Gy} = \iint_\Sigma z^2\,dS \qquad I_0 = \iint_\Sigma r^2\,dS = I_{Gy} + I_{Gz}$$</div>
    \(I_{Gz}\) (m⁴) gouverne la flexion autour de \((G,\vec z)\) ; le <strong>moment quadratique polaire</strong> \(I_0\) (noté aussi \(I_G\)) gouverne la torsion. Le centre \(G\) est défini par \(\iint_\Sigma y\,dS = \iint_\Sigma z\,dS = 0\).
  </div>
  <div style="overflow-x:auto;margin:.4rem 0">
    <table style="width:100%;border-collapse:collapse;font-size:.82rem;text-align:center">
      <tr style="background:var(--paper-dark)">
        <th style="padding:.3rem;border:1px solid var(--grid)">Section</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(S\)</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(I_{Gz}\)</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(I_{Gy}\)</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(I_0\)</th>
      </tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Rectangle : \(b\) selon \(\vec z\), \(h\) selon \(\vec y\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(bh\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{bh^3}{12}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{hb^3}{12}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{bh(b^2 + h^2)}{12}\) (*)</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Disque plein de diamètre \(D\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi D^2}{4}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi D^4}{64}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi D^4}{64}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi D^4}{32}\)</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Tube \(D\) / \(d\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi (D^2 - d^2)}{4}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi (D^4 - d^4)}{64}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi (D^4 - d^4)}{64}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{\pi (D^4 - d^4)}{32}\)</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Tube mince : \(D\) moyen, \(e \ll D\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\approx \pi D e\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\approx \dfrac{\pi D^3 e}{8}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\approx \dfrac{\pi D^3 e}{8}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\approx \dfrac{\pi D^3 e}{4}\)</td></tr>
    </table>
  </div>
  <p style="font-size:.85rem">(*) Pour une section non circulaire, \(I_0\) se calcule mais ne donne pas la raideur en torsion : la section gauchit et les formules de torsion du §7 ne s'appliquent pas.</p>
  <div class="prop-box">
    <strong>Théorème de Huygens</strong> (axes parallèles) : pour un axe \(\Delta\) parallèle à \((G,\vec z)\) et distant de \(d\),
    <div class="formula">$$I_\Delta = I_{Gz} + S\,d^2$$</div>
    Il permet de calculer une section composée (profilé en I, caisson, section en T) en ajoutant ou retranchant des rectangles, chacun ramené au centre de la section totale.
  </div>
  <p>On utilise aussi le <strong>module de flexion</strong> \(I_{Gz}/v\), où \(v\) est la distance de \(G\) à la fibre la plus éloignée : la contrainte maximale de flexion vaut \(|M_{fz}|/(I_{Gz}/v)\).</p>
  <div class="notice"><strong>Intuition.</strong> La matière compte avec le carré de sa distance à l'axe : à aire égale, une section dont la matière est éloignée de l'axe (tube, I, rectangle posé sur chant) est beaucoup plus rigide. Un rectangle \(20\times 60\) mm est \((60/20)^2 = 9\) fois plus rigide sur chant qu'à plat.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Retrouver \(I_{Gz}\) d'un rectangle \(b\times h\) par intégration.</span>
    <div class="content"><p>Une bande de hauteur \(dy\) à l'ordonnée \(y\) a pour aire \(b\,dy\) : \(I_{Gz} = \displaystyle\int_{-h/2}^{h/2} y^2\,b\,dy = b\left[\frac{y^3}{3}\right]_{-h/2}^{h/2} = \frac{bh^3}{12}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LOIS DE COMPORTEMENT</div>
  <h2>Élasticité linéaire : Hooke, Poisson, cisaillement</h2>
  <div class="intro">L'essai de traction sur éprouvette normalisée fournit la courbe contrainte–déformation du matériau. Sa partie initiale, rectiligne et réversible, définit le comportement élastique linéaire utilisé en RdM.</div>

</figure>

  <div class="def-box">
    <strong>Loi de Hooke.</strong> En traction simple, la contrainte normale est proportionnelle à l'allongement relatif :
    <div class="formula">$$\sigma = E\,\varepsilon \qquad \varepsilon = \frac{\Delta L}{L_0}$$</div>
    \(E\) est le <strong>module d'Young</strong> (Pa, en pratique GPa). La <strong>limite élastique</strong> \(R_e\) (ou \(R_{e0,2}\), contrainte laissant 0,2 % de déformation résiduelle) borne le domaine de validité.
  </div>
  <div class="def-box">
    <strong>Coefficient de Poisson.</strong> Une barre tendue s'amincit : la déformation transversale est proportionnelle à la déformation longitudinale,
    <div class="formula">$$\varepsilon_t = -\nu\,\varepsilon \qquad 0 \le \nu \le 0{,}5\ \ \text{(matériaux usuels)}$$</div>
    \(\nu \approx 0{,}3\) pour les métaux ; \(\nu = 0{,}5\) correspond à un matériau incompressible (élastomère, en première approximation).
  </div>
  <div class="def-box">
    <strong>Cisaillement.</strong> Un glissement d'angle \(\gamma\) (rad) s'accompagne d'une contrainte tangentielle \(\tau = G\,\gamma\), où \(G\) est le <strong>module de cisaillement</strong> (ou de Coulomb). Pour un matériau isotrope, les trois constantes ne sont pas indépendantes :
    <div class="formula">$$G = \frac{E}{2(1 + \nu)}$$</div>
    Conséquence pratique : pour un métal (\(\nu \approx 0{,}3\)), \(G \approx 0{,}38\,E\). Connaître \(E\) et \(\nu\) suffit donc pour traiter aussi la torsion.
  </div>

<div class="course-section">
  <div class="sec-num">§7 · TRACTION-COMPRESSION, CISAILLEMENT ET TORSION</div>
  <h2>Sollicitations simples (1) : traction-compression, cisaillement et torsion</h2>
  <div class="intro">En traction et en torsion, une hypothèse cinématique (Navier-Bernoulli ou rotation rigide des sections), la loi de comportement et la définition du torseur de cohésion suffisent à obtenir contraintes et déplacements. Le cisaillement des pièces courtes se traite par un modèle plus conventionnel, mais tout aussi utile pour dimensionner.</div>

  <h3>Traction-compression</h3>
  <div class="def-box">
    Le torseur de cohésion se réduit à \(N\,\vec x\). Toutes les fibres s'allongent de la même façon, donc la contrainte est <strong>uniforme</strong> dans la section :
    <div class="formula">$$\sigma = \frac{N}{S} \qquad \varepsilon = \frac{du}{dx} = \frac{N}{ES} \qquad \Delta L = \int_0^L \frac{N}{ES}\,dx = \frac{NL}{ES}\ \ (N,\ E,\ S\ \text{constants})$$</div>
    La barre se comporte comme un ressort de <strong>raideur</strong> \(k = ES/L\).
  </div>
  <div class="notice"><strong>Compression d'une pièce élancée.</strong> Une poutre longue et fine comprimée peut <strong>flamber</strong> (instabilité élastique) bien avant que \(N/S\) n'atteigne \(R_e\) : la seule vérification \(\sigma \le R_{pe}\) ne suffit pas pour une tige de vérin sortie ou un poteau. Le calcul de la charge critique de flambement n'est pas au programme : il suffit de savoir repérer le risque.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un câble d'acier de section utile 50 mm², long de 8 m, porte 6 kN. Contrainte et allongement ?</span>
    <div class="content"><p>\(\sigma = 6000/50 = 120\ \text{MPa}\) ; \(\Delta L = NL/(ES)\), soit \(\Delta L = \dfrac{6000\times 8000}{210\,000\times 50} \approx 4{,}6\ \text{mm}\) (calcul en N, mm, MPa). En réalité un câble toronné est plus souple : son module apparent est inférieur à celui de l'acier massif.</p></div>
  </div>

  <h3>Cisaillement simple : axes, goupilles, rivets</h3>
  <div class="def-box">
    Une pièce courte chargée par deux forces opposées, perpendiculaires à son axe et très proches l'une de l'autre (axe d'articulation entre une chape et une biellette, goupille, rivet, clavette), est sollicitée en <strong>cisaillement</strong> : dans la section située entre les deux forces, le torseur de cohésion se réduit à l'effort tranchant \(T\) (le moment fléchissant, proportionnel au faible écart entre les forces, est négligé). On adopte une contrainte tangentielle <strong>uniforme</strong> dans la section cisaillée, d'aire \(S\) :
    <div class="formula" data-nom="Cisaillement simple">$$\tau_{moy} = \frac{T}{S} \le R_{pg} \qquad \gamma = \frac{\tau}{G}$$</div>
    Un axe monté dans une chape est cisaillé en <strong>deux</strong> sections (double cisaillement) : chacune ne reprend que la moitié de l'effort, \(T = F/2\).
  </div>
  <p>C'est un modèle conventionnel : la répartition réelle n'est pas uniforme (§8, cisaillement associé à l'effort tranchant), et Saint-Venant ne s'applique pas à une pièce aussi courte. Il suffit pourtant pour dimensionner, avec une limite pratique \(R_{pg}\) prudente (§9). On vérifie en plus la pression de contact (matage) entre l'axe et les alésages : voir le chapitre Conception des liaisons, §4, pour les goupilles et les clavettes.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un vérin pousse 18 kN sur une chape par un axe de diamètre 12 mm, en acier (\(R_e = 355\) MPa, \(s = 2\)). L'axe tient-il au cisaillement ?</span>
    <div class="content"><p>Double cisaillement : \(T = 9\ \text{kN}\) par section, d'aire \(S = \pi\times 12^2/4 \approx 113\ \text{mm}^2\), d'où \(\tau \approx 9000/113 \approx 80\ \text{MPa}\). Avec \(R_{pe} = 355/2 \approx 178\ \text{MPa}\) et \(R_{pg} \approx 0{,}5\,R_{pe} \approx 89\ \text{MPa}\) : l'axe convient, avec peu de réserve. Monté en simple cisaillement (axe en porte-à-faux), il ne passerait plus (160 MPa).</p></div>
  </div>

  <h3>Torsion d'un arbre de section circulaire</h3>
  <div class="def-box">
    Le torseur de cohésion se réduit à \(M_t\,\vec x\). Pour une section circulaire, pleine ou creuse, chaque section tourne en bloc autour de \(\vec x\) sans gauchir, d'un angle \(\theta_x(x)\). Une fibre située au rayon \(r\) subit le glissement \(\gamma = r\,\theta'\), avec \(\theta' = d\theta_x/dx\) (l'angle unitaire \(\gamma_t\) du §2) ; d'où \(\tau = G\,\theta'\,r\), orthoradiale, et \(M_t = \iint r\,\tau\,dS = G\,\theta'\,I_0\) :
    <div class="formula">$$\theta' = \frac{d\theta_x}{dx} = \frac{M_t}{G\,I_0} \qquad \tau(r) = \frac{M_t}{I_0}\,r \qquad \tau_{max} = \frac{M_t\,R}{I_0}$$</div>
    Pour un arbre plein de diamètre \(D\) : \(\tau_{max} = \dfrac{16\,M_t}{\pi D^3}\). Entre deux sections distantes de \(L\) (\(M_t\) constant), l'angle de torsion vaut \(\Delta\theta = \dfrac{M_t L}{G I_0}\) et la raideur en torsion \(k_t = \dfrac{G I_0}{L}\) (N·m/rad).
  </div>
  <div class="prop-box">
    <strong>Couple transmis.</strong> Un arbre qui transmet la puissance \(P\) à la vitesse angulaire \(\omega\) est soumis à
    <div class="formula">$$M_t = \frac{P}{\omega} \qquad \omega = \frac{\pi N}{30}\ \ (N\ \text{en tr/min})$$</div>
  </div>
  <div class="notice"><strong>Pourquoi des arbres creux ?</strong> \(\tau\) croît linéairement avec \(r\) : la matière proche de l'axe travaille peu. Un tube de même diamètre extérieur garde presque toute la rigidité et la résistance d'un arbre plein pour une masse bien moindre : avec un alésage \(d = D/2\), il conserve \(1 - (1/2)^4 \approx 94\) % de \(I_0\) pour 75 % de la masse.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · FLEXION</div>
  <h2>Sollicitations simples (2) : flexion plane</h2>
  <div class="intro">On suppose que \((G,\vec x,\vec y)\) est plan de symétrie de la poutre et contient les charges. En <strong>flexion pure</strong>, seul \(M_{fz}\) est non nul ; en <strong>flexion simple</strong>, \(T_y\) et \(M_{fz}\) coexistent.</div>

  <h3>Contrainte normale</h3>
  <div class="def-box">
    Avec \(N = 0\), Navier-Bernoulli donne \(\varepsilon_{xx} = -y\,\theta_z'\) (§2) et Hooke \(\sigma = -E\,y\,\theta_z'\). La condition \(N = \iint\sigma\,dS = 0\) impose \(\iint y\,dS = 0\) : la <strong>fibre neutre</strong> passe par \(G\). Puis \(M_{fz} = -\iint y\,\sigma\,dS = E\,\theta_z'\,I_{Gz}\), d'où :
    <div class="formula">$$\sigma(M) = -\frac{M_{fz}}{I_{Gz}}\,y \qquad\qquad |\sigma|_{max} = \frac{|M_{fz}|_{max}\,v}{I_{Gz}}$$</div>
    avec \(v\) la distance de \(G\) à la fibre la plus éloignée. Le profil de \(\sigma\) est une droite qui passe par zéro en \(y = 0\) (fibre neutre, de longueur inchangée) et change de signe en la traversant : la partie de la section située d'un côté de \((G,\vec z)\) travaille en traction, l'autre en compression. Avec la convention adoptée, \(M_{fz} \gt 0\) comprime le côté \(y \gt 0\).
  </div>

<figure class="schema">
<svg viewBox="0 0 300 160" role="img" aria-label="Répartition linéaire de la contrainte normale dans la hauteur de la section, nulle sur la fibre neutre">
  <rect x="40" y="25" width="40" height="110" class="fl-soft"/>
  <rect x="40" y="25" width="40" height="110" class="sk-ink"/>

  <line x1="170" y1="140" x2="170" y2="14" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>

  <path d="M170,25 L130,25 L170,80 Z" class="fl-accent-soft"/>
  <path d="M170,80 L210,135 L170,135 Z" class="fl-accent2-soft"/>

  <text x="60" y="84" class="lab-accent" text-anchor="middle">G</text>

<figcaption>Flexion avec \(M_{fz} \gt 0\) : \(\sigma = -M_{fz}\,y/I_{Gz}\) est linéaire en \(y\), nulle sur la fibre neutre, extrême sur les fibres supérieure et inférieure.</figcaption>
</figure>

  <h3>Déformée et flèche</h3>
  <div class="prop-box">
    La rotation de la section est la pente de la déformée, et la courbure est proportionnelle au moment :
    <div class="formula">$$\theta_z = \frac{dv}{dx} \qquad\qquad E\,I_{Gz}\,\frac{d^2v}{dx^2} = M_{fz}(x)$$</div>
    On intègre deux fois sur chaque tronçon ; les constantes viennent des conditions d'appui (\(v = 0\) ; en plus \(v' = 0\) à un encastrement), de la <strong>continuité de \(v\) et de \(v'\)</strong> entre tronçons, et éventuellement d'une symétrie (\(v' = 0\) au milieu). La <strong>flèche</strong> est la valeur maximale de \(|v|\). \(E I_{Gz}\) est la <strong>rigidité en flexion</strong>.
  </div>
  <div style="overflow-x:auto;margin:.4rem 0">
    <table style="width:100%;border-collapse:collapse;font-size:.82rem;text-align:center">
      <tr style="background:var(--paper-dark)">
        <th style="padding:.3rem;border:1px solid var(--grid)">Cas de référence (portée \(L\))</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">\(|M_{fz}|_{max}\)</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">Flèche \(f\)</th>
      </tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Console, force \(F\) en bout</td><td style="padding:.3rem;border:1px solid var(--grid)">\(FL\) (encastrement)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{FL^3}{3EI}\)</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Console, charge uniforme \(p\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{pL^2}{2}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{pL^4}{8EI}\)</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Deux appuis, \(F\) au milieu</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{FL}{4}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{FL^3}{48EI}\)</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">Deux appuis, charge uniforme \(p\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{pL^2}{8}\)</td><td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{5pL^4}{384EI}\)</td></tr>
    </table>
  </div>
  <p>En HPP, les déformées se <strong>superposent</strong> : la flèche sous plusieurs charges est la somme des flèches dues à chacune.</p>
  <div class="prop-box">
    <strong>Théorème de superposition.</strong> Dans le cadre des petites perturbations et de l'élasticité linéaire, les efforts intérieurs, les contraintes et les déplacements dus à plusieurs chargements appliqués ensemble sont les sommes de ceux que produirait chaque chargement appliqué seul. On décompose donc un chargement compliqué en cas de référence (tableau ci-dessus), puis on additionne, au même point et avec leurs signes.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Console en acier de longueur 1 m, section 40 × 60 mm (60 mm dans le plan de flexion), chargée en bout par 2 kN et par son poids propre. Flèche en bout et contrainte maximale ?</span>
    <div class="content">
      <p>\(I_{Gz} = 40\times 60^3/12 = 7{,}2\cdot10^5\ \text{mm}^4\) et \(EI_{Gz} \approx 1{,}51\cdot10^{11}\ \text{N·mm}^2\). Poids propre : \(p = \rho S g\) avec \(S = 0{,}0024\ \text{m}^2\), soit \(p \approx 184\ \text{N/m}\) (\(0{,}184\ \text{N/mm}\)).</p>
      <div class="formula">$$f = \frac{FL^3}{3EI} + \frac{pL^4}{8EI} \approx 4{,}41 + 0{,}15 \approx 4{,}56\ \text{mm}$$</div>
      <p>À l'encastrement, les moments s'ajoutent aussi : \(|M_{fz}|_{max} = FL + pL^2/2 \approx 2{,}09\cdot10^6\ \text{N·mm}\), d'où \(\sigma_{max} = |M_{fz}|_{max}\,v/I_{Gz} \approx 87\ \text{MPa}\) avec \(v = 30\ \text{mm}\). Le poids propre ne compte ici que pour 3 % de la flèche : on peut souvent le négliger, mais la superposition dit tout de suite de combien.</p>
    </div>
  </div>

  <h3>Cisaillement associé à l'effort tranchant</h3>
  <p>En flexion simple, \(T_y\) engendre des contraintes tangentielles. Le modèle le plus simple les suppose uniformes : \(\tau_{moy} = T_y/S\). Pour un rectangle, une analyse plus fine (formule de Jourawski, complément non exigible) donne une répartition parabolique dans la hauteur, nulle sur les faces supérieure et inférieure et maximale sur la fibre neutre : \(\tau_{max} = \dfrac{3\,T_y}{2\,S}\).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Ordre de grandeur</span>
    <span class="prompt">Pourquoi néglige-t-on souvent le cisaillement devant la contrainte normale ?</span>
    <div class="content"><p>Pour une console rectangulaire chargée en bout : \(\sigma_{max} = 6FL/(bh^2)\) et \(\tau_{max} = 3F/(2bh)\), soit \(\tau_{max}/\sigma_{max} = h/(4L)\). Pour \(L = 10\,h\), le rapport vaut 2,5 % : négligeable. Le cisaillement ne devient prépondérant que pour les pièces courtes (axes, goupilles, rivets).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · CRITÈRES DE DIMENSIONNEMENT</div>
  <h2>Tenue mécanique : critères de résistance et de rigidité</h2>
  <div class="intro">Dimensionner, c'est choisir la section (et le matériau) qui satisfait <strong>à la fois</strong> un critère de résistance — ni plastification, ni rupture — et un critère de rigidité — pas de déformation excessive pour la fonction.</div>

  <h3>Résistance : limite pratique et coefficient de sécurité</h3>
  <div class="def-box">
    On ne travaille jamais à \(R_e\) : on définit la <strong>résistance pratique à l'extension</strong> (ou limite pratique) et la <strong>résistance pratique au glissement</strong>
    <div class="formula">$$R_{pe} = \frac{R_e}{s} \qquad R_{pg} = \frac{\tau_e}{s} \qquad \text{critères}\ \ \sigma_{max} \le R_{pe},\ \ \tau_{max} \le R_{pg}$$</div>
    Le <strong>coefficient de sécurité</strong> \(s \gt 1\) est d'autant plus grand que l'on connaît mal les charges réelles, la dispersion du matériau ou la validité du modèle, et qu'une rupture aurait des conséquences graves : proche de 1,5 pour une pièce bien maîtrisée, il atteint 5 ou plus en levage. On prend couramment \(R_{pg} \approx 0{,}5\) à \(0{,}6\,R_{pe}\).
  </div>

  <h3>Concentration de contraintes (complément)</h3>
  <div class="def-box">
    Au voisinage d'un épaulement, d'une gorge, d'un trou, d'une rainure de clavette ou d'un filetage, la contrainte locale dépasse la valeur nominale calculée par la RdM :
    <div class="formula">$$\sigma_{max,\text{réelle}} = K_t\,\sigma_{nom} \qquad \tau_{max,\text{réelle}} = K_t\,\tau_{nom} \qquad K_t \ge 1$$</div>
    \(K_t\) se lit sur des abaques en fonction des rapports géométriques (rayon de raccordement / diamètre, diamètre du trou / largeur…) ; il vaut typiquement 1,5 à 3. On le réduit par des raccordements de grand rayon et des transitions progressives.
  </div>

  <h3>Critère de Von Mises (principe, complément)</h3>
  <p>Lorsque plusieurs contraintes coexistent, on les combine en une <strong>contrainte équivalente</strong>, comparée à la limite d'un essai de traction simple :</p>
  <div class="formula">$$\begin{aligned}\sigma_{eq} = \tfrac{1}{\sqrt 2}\Big[&amp;(\sigma_{xx}-\sigma_{yy})^2+(\sigma_{yy}-\sigma_{zz})^2+(\sigma_{zz}-\sigma_{xx})^2\\ &amp;+6\,(\tau_{xy}^2+\tau_{yz}^2+\tau_{zx}^2)\Big]^{1/2} \le R_{pe}\end{aligned}$$</div>
  <div class="prop-box">
    Pour une poutre, seules \(\sigma = \sigma_{xx}\) et la contrainte tangentielle \(\tau\) dans la section sont non nulles :
    <div class="formula">$$\sigma_{eq} = \sqrt{\sigma^2 + 3\,\tau^2} \le R_{pe}$$</div>
    En torsion pure, on obtient \(\tau \le R_{pe}/\sqrt 3 \approx 0{,}58\,R_{pe}\), ce qui justifie l'ordre de grandeur de \(R_{pg}\). Ce critère traduit une limite sur l'énergie élastique de distorsion (changement de forme sans changement de volume) ; la « contrainte de Von Mises » des cartes colorées de simulation n'est autre que \(\sigma_{eq}\).
  </div>

  <h3>Rigidité</h3>
  <ul>
    <li><strong>Flèche admissible</strong> \(f \le f_{adm}\) : de l'ordre de \(L/200\) à \(L/500\) en charpente, beaucoup plus sévère (quelques µm) pour une broche de machine-outil ;</li>
    <li><strong>angle unitaire de torsion</strong> \(\theta' \le \theta'_{adm}\), couramment de l'ordre de 0,25 °/m pour un long arbre de transmission ;</li>
    <li><strong>raideur</strong> minimale : \(k = F/f\) (N/m) ou \(k_t = M_t/\theta\) (N·m/rad).</li>
  </ul>
  <div class="prop-box">
    <strong>Les deux critères ne varient pas de la même façon.</strong> En flexion ou en torsion d'un arbre plein, la contrainte varie en \(1/d^3\) mais la flèche ou l'angle en \(1/d^4\), et la rigidité ne dépend que de \(E\), pas de \(R_e\) : un acier à haute limite élastique n'est pas plus rigide qu'un acier doux. On calcule les deux dimensions minimales et on retient la plus grande.
  </div>
  <div class="notice"><strong>Unités.</strong> Travailler en N, mm et MPa (1 MPa = 1 N/mm²) : les moments quadratiques sont alors en mm⁴ et \(EI\) en N·mm². Les angles des formules sont en radians.</div>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · RÉSISTANCE DES MATÉRIAUX</div>
  <h2>Stratégies pour les exercices</h2>
  <div class="intro">Dans l'ordre du cours : modèle poutre et choix d'un modèle déformable (§1), torseur de cohésion et diagrammes (§3, §4), sections et sollicitations simples (§5 à §8), dimensionnement en résistance et en rigidité (§9). Le coefficient \(K_t\) et le critère de Von Mises sont des compléments non exigibles : un sujet les fournit.</div>
  <div class="method-box">
    <strong>Méthode 1 — Modéliser une pièce par une poutre</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Élancement.</span> Vérifier que la longueur vaut au moins 5 à 10 fois la plus grande dimension transversale ; repérer la ligne moyenne.</li>
      <li><span class="step">Repère.</span> Origine à une extrémité, \(\vec x\) le long de la ligne moyenne, \(\vec y\) dans le plan du chargement.</li>
      <li><span class="step">Liaisons.</span> Remplacer chaque appui par son symbole plan (encastrement, articulation, appui simple) et lister les inconnues.</li>
      <li><span class="step">Charges.</span> Forces concentrées, charges réparties (poids propre \(p = \rho S g\)), couples ; préciser leur sens par rapport à \(\vec y\).</li>
      <li><span class="step">Zones à risque.</span> Noter les endroits où Saint-Venant ne s'applique pas (appuis, charges ponctuelles, changements de section) : on y corrigera par \(K_t\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 2 — Torseur de cohésion par la coupure (équations globales)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Actions de liaison.</span> PFS sur la poutre entière ; s'assurer d'abord qu'il y a autant d'inconnues que d'équations utiles (sinon le problème est hyperstatique et il faudra la déformée).</li>
      <li><span class="step">Découpage.</span> Les expressions de \(N\), \(T_y\), \(M_{fz}\) changent à chaque « événement » le long de \(x\) : appui, charge ponctuelle, couple, bord d'une zone de charge répartie. Une expression par intervalle.</li>
      <li><span class="step">Coupure.</span> Dans chaque intervalle, couper en \(G(x)\) et garder le morceau qui porte le moins d'efforts : \(\{\mathcal{T}_{coh}\} = -\{\bar E\to\text{I}\}\) (gauche) ou \(+\{\bar E\to\text{II}\}\) (droite).</li>
      <li><span class="step">Réduction en \(G\).</span> Une charge répartie se remplace par sa résultante placée au milieu de la zone chargée ; moment \(= \sum \overrightarrow{GP}\wedge\vec F\).</li>
      <li><span class="step">Contrôles.</span> \(M_{fz}' = -T_y\) sur chaque tronçon ; \(M_{fz}\) continu aux frontières (sauf couple concentré) et nul aux extrémités libres ou articulées.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 3 — Torseur de cohésion par les équations locales</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Charge.</span> Écrire \(q_y(x)\) sur chaque tronçon, avec son signe : une charge vers le bas donne \(q_y = -p\).</li>
      <li><span class="step">Intégrer.</span> \(T_y' = -q_y\), puis \(M_{fz}' = -T_y\).</li>
      <li><span class="step">Constantes.</span> Utiliser les valeurs connues aux extrémités (\(T_y\) et \(M_{fz}\) fixés par les actions concentrées qui y sont appliquées, nuls à un bout libre non chargé) et les sauts aux forces concentrées.</li>
      <li><span class="step">Intérêt.</span> Très efficace pour les charges réparties non uniformes (triangulaires, trapézoïdales).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 4 — Tracer et exploiter les diagrammes</strong>
    <ol style="margin-top:.4rem">
      <li>Tracer \(T_y(x)\) puis \(M_{fz}(x)\), alignés sous le schéma de la poutre.</li>
      <li>Vérifier les pentes (\(M_{fz}' = -T_y\)) : \(M_{fz}\) est extrémal là où \(T_y\) change de signe.</li>
      <li>Vérifier les sauts de \(T_y\) aux forces concentrées (amplitude = intensité de la force) et les points anguleux de \(M_{fz}\).</li>
      <li>En déduire la <strong>section critique</strong> : \(|M_{fz}|_{max}\), éventuellement \(|T_y|_{max}\) et \(M_t\) en sollicitation composée.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 5 — Calculer une déformée par double intégration</strong>
    <ol style="margin-top:.4rem">
      <li>Écrire \(E I_{Gz}\,v'' = M_{fz}(x)\) tronçon par tronçon.</li>
      <li>Intégrer deux fois : deux constantes par tronçon.</li>
      <li>Conditions : \(v = 0\) aux appuis ; \(v = 0\) et \(v' = 0\) à un encastrement ; continuité de \(v\) et \(v'\) entre tronçons ; symétrie (\(v' = 0\) au milieu).</li>
      <li>La flèche est atteinte où \(v' = 0\) ou à une extrémité libre. Contrôler l'homogénéité (\(FL^3/EI\) est une longueur) et le signe (charge vers le bas → \(v \lt 0\)).</li>
      <li>Astuce : en HPP, superposer les cas de référence plutôt que tout réintégrer.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 6 — Dimensionner en résistance</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Où ?</span> Section critique (diagrammes), puis point critique : fibre la plus éloignée \(y = \pm v\) en flexion, périphérie en torsion.</li>
      <li><span class="step">Contraintes nominales.</span> \(\sigma = N/S\), \(\sigma = |M_{fz}|\,v/I_{Gz}\), \(\tau = M_t R/I_0\).</li>
      <li><span class="step">Accidents de forme.</span> Si l'énoncé fournit un coefficient \(K_t\) (complément non exigible), multiplier la contrainte nominale par \(K_t\).</li>
      <li><span class="step">Combinaison.</span> Si \(\sigma\) et \(\tau\) coexistent au même point et que l'énoncé donne le critère de Von Mises : \(\sigma_{eq} = \sqrt{\sigma^2 + 3\tau^2}\).</li>
      <li><span class="step">Conclure.</span> Inégalité \(\le R_{pe}\) → dimension minimale, arrondie à la valeur normalisée supérieure, puis vérification.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 7 — Dimensionner en rigidité et choisir</strong>
    <ol style="margin-top:.4rem">
      <li>Exprimer la grandeur limitée par le cahier des charges : flèche, angle de torsion, angle unitaire ou raideur \(k = F/f\).</li>
      <li>Écrire l'inégalité → \(I_{Gz}\) (ou \(I_0\)) minimal → dimension minimale.</li>
      <li>Comparer avec la dimension imposée par la résistance et retenir la plus grande.</li>
      <li>Pour rigidifier : augmenter \(I\) par la forme (tube, profilé, hauteur), raccourcir la portée (\(f\) en \(L^3\) ou \(L^4\)), encastrer plutôt qu'articuler — changer d'acier ne sert à rien (même \(E\)).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 8 — Dimensionner un axe, une goupille ou un rivet au cisaillement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Sections cisaillées.</span> Compter les sections qui séparent les pièces : une seule en porte-à-faux (simple cisaillement, \(T = F\)), deux pour un axe monté dans une chape (double cisaillement, \(T = F/2\) par section).</li>
      <li><span class="step">Modèle conventionnel.</span> Contrainte tangentielle uniforme \(\tau_{moy} = T/S\), moment fléchissant négligé (forces opposées très proches).</li>
      <li><span class="step">Critère.</span> \(\tau_{moy} \le R_{pg}\), avec \(R_{pg} \approx 0{,}5\) à \(0{,}6\,R_{pe}\) : section minimale, puis diamètre normalisé supérieur.</li>
      <li><span class="step">Compléter.</span> Vérifier aussi la pression de contact (matage) entre l'axe et les alésages (chapitre Conception des liaisons, §4).</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> axe de 10 mm (\(S \approx 78{,}5\ \text{mm}^2\)) sous \(F = 8\ \text{kN}\), \(R_{pg} = 60\ \text{MPa}\). En chape : \(\tau = 4\,000/78{,}5 \approx 51\ \text{MPa}\), il convient. En porte-à-faux : \(\tau \approx 102\ \text{MPa}\), il ne convient plus.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Décider s'il faut un modèle déformable dans l'étude d'un système</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Question posée.</span> Loi entrée-sortie, statique, dynamique d'ensemble : solides indéformables. Contraintes, déplacements, inconnues hyperstatiques, comportement d'un asservissement : il faut les raideurs.</li>
      <li><span class="step">Raideur de la pièce.</span> \(k = ES/L\) en traction, \(k_t = GI_0/L\) en torsion, \(k = 3EI/L^3\) pour une console chargée en bout.</li>
      <li><span class="step">Mode élastique.</span> Inertie (ou masse) entraînée à travers cette raideur : pulsation propre \(\omega_0 = \sqrt{k_t/J}\) (ou \(\sqrt{k/m}\)).</li>
      <li><span class="step">Comparer.</span> Si \(\omega_0\) dépasse 5 à 10 fois la pulsation de coupure \(\omega_{c0}\) de l'asservissement, le modèle indéformable suffit ; sinon, modèle à deux inerties et un ressort, ou pièce plus raide.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> bras \(J = 0{,}2\ \text{kg·m}^2\) entraîné par un arbre de raideur \(k_t = 2\,000\ \text{N·m/rad}\) : \(\omega_0 = \sqrt{2\,000/0{,}2} = 100\ \text{rad/s}\). Avec \(\omega_{c0} = 40\ \text{rad/s}\), le rapport ne vaut que 2,5 : le modèle indéformable donnerait des performances fausses.</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Mélanger les unités : tout en N, mm, MPa ; vitesses en rad/s (\(\omega = \pi N/30\)) ; angles en radians dans les formules.</li>
      <li>Confondre \(D\) et \(R\) : \(\tau_{max} = M_t R/I_0\) avec \(R = D/2\) ; pour un rectangle, \(v = h/2\).</li>
      <li>Se tromper de moment quadratique : \(h\) est la dimension parallèle à \(\vec y\), direction du chargement ; \(I_0 = 2\,I_{Gz}\) pour un disque ou un tube.</li>
      <li>Changer de convention en cours de route (II sur I ou I sur II) : les signes de tout le problème basculent.</li>
      <li>Appliquer les formules au droit d'une charge concentrée ou d'un épaulement sans \(K_t\).</li>
      <li>Oublier le critère de rigidité : une pièce peut résister largement et être trop souple.</li>
      <li>Se contenter de \(\sigma = N/S \le R_{pe}\) pour une pièce longue et fine comprimée (tige de vérin sortie, poteau) : elle peut flamber bien avant ; repérer le risque, même si son calcul n'est pas au programme.</li>
      <li>Utiliser les formules de torsion du cours pour une section non circulaire : elle gauchit, \(I_0\) ne donne pas sa raideur.</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Suspente d'une passerelle (tirant en traction)</h3>
  <div class="statement">Une passerelle piétonne est suspendue par des tiges rondes en acier. La plus chargée, de longueur \(L = 3{,}0\ \text{m}\), transmet un effort \(N = 40\ \text{kN}\). Acier : \(E = 210\ \text{GPa}\), \(\nu = 0{,}3\), \(R_e = 355\ \text{MPa}\) ; coefficient de sécurité \(s = 2\). Le poids propre de la tige est négligé.</div>
  <div class="q"><strong>Q1.</strong> Préciser la sollicitation et le torseur de cohésion de la tige.</div>
  <div class="q"><strong>Q2.</strong> Calculer le diamètre minimal. On retient \(d = 20\ \text{mm}\) : calculer la contrainte.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'allongement de la tige et sa raideur.</div>
  <div class="q"><strong>Q4.</strong> De combien le diamètre diminue-t-il sous charge ?</div>
  <div class="q"><strong>Q5.</strong> Les extrémités sont filetées M20, de section résistante \(245\ \text{mm}^2\). Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Traction pure : \(\{\mathcal{T}_{coh}\}_G = \begin{Bmatrix} N\,\vec x \\ \vec 0 \end{Bmatrix}_G\) avec \(N = +40\ \text{kN}\), constant le long de la tige (le poids propre, environ 70 N, est bien négligeable).</p>
    <p><strong>Q2.</strong> \(R_{pe} = 355/2 = 177{,}5\ \text{MPa}\). Il faut \(S \ge N/R_{pe} = 40\,000/177{,}5 = 225\ \text{mm}^2\), soit \(d \ge \sqrt{4S/\pi} = 16{,}9\ \text{mm}\). Avec \(d = 20\ \text{mm}\) : \(S = 314\ \text{mm}^2\) et \(\sigma = 40\,000/314 = 127\ \text{MPa} \le R_{pe}\).</p>
    <p><strong>Q3.</strong> Allongement :</p>
    <div class="formula">$$\Delta L = \dfrac{NL}{ES} = \dfrac{40\,000\times 3000}{210\,000\times 314} = 1{,}82\ \text{mm}$$</div>
    <p>Raideur : \(k = \dfrac{ES}{L} = \dfrac{210\,000\times 314}{3000}\), soit environ 22 000 N/mm (22 kN/mm).</p>
    <p><strong>Q4.</strong> \(\varepsilon = \sigma/E = 127/210\,000 = 6{,}1\times 10^{-4}\) ; \(\varepsilon_t = -\nu\varepsilon = -1{,}8\times 10^{-4}\) ; \(\Delta d = \varepsilon_t\,d \approx -3{,}6\ \mu\text{m}\) : imperceptible, ce qui illustre l'hypothèse des petites perturbations.</p>
    <p><strong>Q5.</strong> Dans le filetage : \(\sigma = 40\,000/245 = 163\ \text{MPa}\), encore inférieur à \(R_{pe}\) mais avec une marge faible, alors que le fond de filet est une zone de concentration de contraintes où le calcul nominal sous-estime la contrainte réelle. Il est prudent d'augmenter la section au filetage : extrémités refoulées (élargies par forgeage) puis filetées M24 sur la tige de 20 mm, ou tige de 24 mm filetée M24 (section résistante \(353\ \text{mm}^2\), \(\sigma = 113\ \text{MPa}\)). Un filetage M24 ne peut pas être taillé directement dans une tige de 20 mm.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Axe d'articulation d'un vérin : simple ou double cisaillement</h3>
  <div class="statement">La tige d'un vérin de presse transmet un effort \(F = 20\ \text{kN}\) à un levier par l'intermédiaire d'un axe d'articulation en acier : \(R_e = 300\ \text{MPa}\), coefficient de sécurité \(s = 2{,}5\), résistance pratique au glissement \(R_{pg} = 0{,}5\,R_{pe}\), \(G = 81\ \text{GPa}\). Deux montages sont envisagés : (a) la tige se termine par un œil engagé dans une chape du levier, l'axe traversant les deux joues de la chape ; (b) l'axe est fixé en porte-à-faux sur le levier et traverse l'œil de la tige. Diamètres normalisés disponibles : 12, 14, 16, 18, 20, 22, 25 mm.</div>
  <div class="q"><strong>Q1.</strong> Dans une section cisaillée, quel est le torseur de cohésion retenu ? Pourquoi néglige-t-on le moment fléchissant ?</div>
  <div class="q"><strong>Q2.</strong> Montage (a) : combien de sections sont cisaillées ? Calculer le diamètre minimal, choisir un diamètre normalisé et calculer la contrainte.</div>
  <div class="q"><strong>Q3.</strong> Même question pour le montage (b). Conclure.</div>
  <div class="q"><strong>Q4.</strong> Pour l'axe retenu en (a), calculer le glissement \(\gamma\). Que vaut l'hypothèse des petites perturbations ici ?</div>
  <div class="q"><strong>Q5.</strong> L'œil de la tige a une épaisseur de 20 mm et une pression de contact admissible de 80 MPa (pression conventionnelle \(F/(d\,e)\), voir le chapitre Conception des liaisons, §4). L'axe retenu en (a) convient-il aussi de ce point de vue ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Entre deux forces opposées, perpendiculaires à l'axe et très proches, le torseur de cohésion se réduit à l'effort tranchant : \(\{\mathcal{T}_{coh}\}_G = \{T\,\vec y \;;\; \vec 0\}_G\). Le moment fléchissant est proportionnel au faible écart entre les deux forces (de l'ordre de l'épaisseur des pièces) : on le néglige, et l'on adopte une contrainte tangentielle uniforme \(\tau_{moy} = T/S\). C'est un modèle conventionnel : une pièce aussi courte ne vérifie pas Saint-Venant, d'où une limite pratique prudente.</p>
    <p><strong>Q2.</strong> \(R_{pe} = 300/2{,}5 = 120\ \text{MPa}\) et \(R_{pg} = 60\ \text{MPa}\). En chape, l'axe est coupé en deux sections, entre l'œil et chacune des joues : double cisaillement, \(T = F/2 = 10\ \text{kN}\). Il faut \(S \geq 10\,000/60 \approx 167\ \text{mm}^2\), soit \(d \geq \sqrt{4S/\pi} \approx 14{,}6\ \text{mm}\) : on retient \(d = 16\ \text{mm}\) (\(S \approx 201\ \text{mm}^2\)), pour lequel \(\tau = 10\,000/201 \approx 50\ \text{MPa} \leq R_{pg}\).</p>
    <p><strong>Q3.</strong> En porte-à-faux, une seule section reprend tout l'effort : \(T = F = 20\ \text{kN}\), \(S \geq 333\ \text{mm}^2\), \(d \geq 20{,}6\ \text{mm}\) : il faut \(d = 22\ \text{mm}\) (\(\tau \approx 53\ \text{MPa}\)). L'axe de 16 mm, monté ainsi, travaillerait à 99 MPa : il ne conviendrait plus. Le montage en chape divise l'effort par section par deux et le diamètre par \(\sqrt2\) ; il évite aussi la flexion de l'axe en porte-à-faux, que le modèle de cisaillement néglige à tort dans ce cas.</p>
    <p><strong>Q4.</strong> \(\gamma = \tau/G = 50/81\,000 \approx 6{,}1\cdot10^{-4}\ \text{rad}\) : la déformation est très petite devant 1, l'hypothèse des petites perturbations est largement vérifiée et l'axe peut être traité comme indéformable dans l'étude cinématique du mécanisme.</p>
    <p><strong>Q5.</strong> Pression conventionnelle dans l'œil :</p>
    <div class="formula">$$p = \frac{F}{d\,e} = \frac{20\,000}{16\times20} \approx 63\ \text{MPa} \leq 80\ \text{MPa}$$</div>
    <p>L'axe de 16 mm convient aussi au matage. Si ce n'était pas le cas, il faudrait augmenter le diamètre ou l'épaisseur de l'œil, même si le cisaillement était vérifié.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Choisir la forme d'une section</h3>
  <div class="statement">On compare quatre sections de même aire \(S = 1200\ \text{mm}^2\) (donc de même masse par mètre), fléchies autour de l'axe \((G,\vec z)\), le chargement étant porté par \(\vec y\) : (a) rectangle \(60\times 20\) posé à plat (\(h = 20\ \text{mm}\)) ; (b) le même rectangle sur chant (\(h = 60\ \text{mm}\)) ; (c) disque plein ; (d) tube de diamètre extérieur \(D = 60\ \text{mm}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le diamètre du disque (c) et le diamètre intérieur du tube (d).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(I_{Gz}\) pour chaque section.</div>
  <div class="q"><strong>Q3.</strong> Pour \(M_{fz} = 600\ \text{N·m}\), calculer la contrainte normale maximale dans chaque cas.</div>
  <div class="q"><strong>Q4.</strong> Quelle section choisir pour une poutre fléchie dans un seul plan ? pour un arbre (flexion dans toutes les directions et torsion) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Disque : \(D_c = \sqrt{4S/\pi} = 39{,}1\ \text{mm}\). Tube : \(d^2 = D^2 - 4S/\pi = 3600 - 1528 = 2072\), \(d = 45{,}5\ \text{mm}\) (paroi de 7,2 mm).</p>
    <p><strong>Q2.</strong> (a) \(60\times 20^3/12 = 4{,}0\times 10^4\ \text{mm}^4\) ; (b) \(20\times 60^3/12 = 3{,}6\times 10^5\ \text{mm}^4\) ; (c) \(\pi D_c^4/64 = 1{,}15\times 10^5\ \text{mm}^4\) ; (d) \(\pi(60^4 - 45{,}5^4)/64 = 4{,}25\times 10^5\ \text{mm}^4\).</p>
    <p><strong>Q3.</strong> \(\sigma_{max} = M_{fz}\,v/I_{Gz}\) avec \(M_{fz} = 6\times 10^5\ \text{N·mm}\) : (a) \(v = 10\), \(\sigma = 150\ \text{MPa}\) ; (b) \(v = 30\), \(\sigma = 50\ \text{MPa}\) ; (c) \(v = 19{,}5\), \(\sigma = 102\ \text{MPa}\) ; (d) \(v = 30\), \(\sigma = 42\ \text{MPa}\). À masse égale, la contrainte varie dans un rapport de 1 à 3,5 et la rigidité (proportionnelle à \(I\)) dans un rapport de 1 à 10.</p>
    <p><strong>Q4.</strong> Pour une flexion dans un seul plan, le rectangle sur chant (ou mieux un profilé en I) est très efficace. Pour un arbre, seule une section de révolution travaille de la même façon dans toutes les directions : le tube l'emporte, d'autant qu'en torsion son \(I_0 = 2\,I_{Gz} = 8{,}5\times 10^5\ \text{mm}^4\) vaut 3,7 fois celui du disque plein.</p>
