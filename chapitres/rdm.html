<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Axe sur deux appuis chargé hors du milieu</h3>
  <div class="statement">Un axe de poulie, modélisé par une poutre AB de longueur \(L = 800\ \text{mm}\), repose sur une articulation en A (\(x = 0\)) et un appui simple en B (\(x = L\)). La poulie exerce en C, d'abscisse \(a = 200\ \text{mm}\), une force \(-F\,\vec y\) avec \(F = 6\ \text{kN}\). On note \(b = L - a\). Convention : torseur de cohésion = actions de la partie \(x' \gt x\) sur la partie \(x' \lt x\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer les actions en A et B.</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(T_y(x)\) et \(M_{fz}(x)\) sur AC et sur CB.</div>
  <div class="q"><strong>Q3.</strong> Tracer les diagrammes ; vérifier le saut de \(T_y\) en C et la relation \(M_{fz}' = -T_y\).</div>
  <div class="q"><strong>Q4.</strong> L'axe est un cylindre plein en acier avec \(R_{pe} = 200\ \text{MPa}\). Calculer son diamètre minimal.</div>
  <div class="q"><strong>Q5.</strong> Comparer la contrainte de cisaillement moyenne à la contrainte normale maximale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Moments en A puis en B : \(Y_B L = F a\) et \(Y_A L = F b\), d'où \(Y_A = Fb/L = 4500\ \text{N}\), \(Y_B = Fa/L = 1500\ \text{N}\), \(X_A = 0\).</p>
    <p><strong>Q2.</strong> Sur AC (\(0 \lt x \lt a\)), on isole la partie gauche, soumise à \(Y_A\vec y\) en A : \(\{\mathcal{T}_{coh}\} = -\{\bar E\to\text{I}\}\) donne \(T_y = -Y_A = -4500\ \text{N}\) et, comme \(\overrightarrow{GA}\wedge Y_A\vec y = -x\,Y_A\,\vec z\), \(M_{fz} = Y_A\,x\). Sur CB (\(a \lt x \lt L\)), on isole la partie droite, soumise à \(Y_B\vec y\) en B : \(T_y = +Y_B = 1500\ \text{N}\) et \(M_{fz} = Y_B\,(L - x)\).</p>
    <p><strong>Q3.</strong> \(T_y\) vaut \(-4500\) N puis \(+1500\) N : saut de \(+6000\ \text{N} = +F\) en C, conforme à la règle (force \(-F\vec y\), saut \(-(-F)\)). \(M_{fz}\) est affine par morceaux, nul en A et B, maximal en C : \(M_{fz}(a) = Y_A a = Y_B b\), soit \(Fab/L = 900\ \text{N·m}\). Sur AC, \(M_{fz}' = Y_A = -T_y\) ; sur CB, \(M_{fz}' = -Y_B = -T_y\) : cohérent.</p>
    <p><strong>Q4.</strong> \(\sigma_{max} = \dfrac{32\,M_{f,max}}{\pi d^3} \le R_{pe}\) donne \(d^3 \ge \dfrac{32\times 9\times 10^5}{\pi\times 200} = 4{,}58\times 10^4\ \text{mm}^3\), soit \(d \ge 35{,}8\ \text{mm}\) : on retient \(d = 36\ \text{mm}\).</p>
    <p><strong>Q5.</strong> \(\tau_{moy} = |T_y|_{max}/S\), soit \(4500/1018 = 4{,}4\ \text{MPa}\), contre environ 200 MPa en flexion : le cisaillement est négligeable, comme prévu pour une pièce élancée (\(L/d \approx 22\)).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Arbre de transmission : résistance ou rigidité ?</h3>
  <div class="statement">Un arbre en acier de longueur \(L = 2{,}0\ \text{m}\) entre ses deux accouplements relie un motoréducteur à l'enrouleur d'une ligne de convoyage : il transmet \(P = 3\ \text{kW}\) à \(N = 250\ \text{tr/min}\). Données : \(G = 81\ \text{GPa}\) ; résistance pratique au glissement \(R_{pg} = 40\ \text{MPa}\) (elle intègre la sécurité et l'affaiblissement dû aux rainures de clavette) ; pour éviter les à-coups, l'angle unitaire de torsion ne doit pas dépasser \(0{,}3\ °/\text{m}\). Seule la torsion est prise en compte.</div>
  <div class="q"><strong>Q1.</strong> Calculer le moment de torsion.</div>
  <div class="q"><strong>Q2.</strong> Diamètre minimal d'un arbre plein selon le critère de résistance.</div>
  <div class="q"><strong>Q3.</strong> Diamètre minimal selon le critère de rigidité. Quel critère dimensionne ? Choisir un diamètre parmi 40, 42 et 45 mm.</div>
  <div class="q"><strong>Q4.</strong> On envisage un tube de diamètre extérieur 48 mm. Quel diamètre intérieur maximal respecte encore la rigidité ? Gain de masse par rapport à l'arbre plein retenu ?</div>
  <div class="q"><strong>Q5.</strong> Pour le tube retenu, vérifier la résistance et calculer l'angle de torsion entre accouplements ; comparer avec l'arbre plein.</div>
  <div class="q"><strong>Q6.</strong> L'enrouleur (inertie \(J = 0{,}5\ \text{kg·m}^2\) ramenée sur l'arbre) est asservi en vitesse avec une pulsation de coupure \(\omega_{c0} = 15\ \text{rad/s}\) ; le motoréducteur est supposé infiniment raide. Calculer la raideur en torsion du tube et la pulsation propre du mode de torsion. Peut-on régler l'asservissement avec un modèle d'arbre indéformable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega = \pi N/30 = 26{,}2\ \text{rad/s}\) et \(M_t = P/\omega = 114{,}6\ \text{N·m}\), soit \(1{,}146\times 10^5\ \text{N·mm}\).</p>
    <p><strong>Q2.</strong> La condition \(\dfrac{16\,M_t}{\pi d^3} \le R_{pg}\) donne :</p>
    <div class="formula">$$d^3 \ge \dfrac{16\times 1{,}146\times 10^5}{\pi\times 40} = 1{,}46\times 10^4\ \text{mm}^3$$</div>
    <p>soit \(d \ge 24{,}4\ \text{mm}\).</p>
    <p><strong>Q3.</strong> En radians :</p>
    <div class="formula">$$\theta'_{adm} = 0{,}3\times\frac{\pi}{180} = 5{,}24\times 10^{-3}\ \text{rad/m} = 5{,}24\times 10^{-6}\ \text{rad/mm}$$</div>
    <p>Il faut :</p>
    <div class="formula">$$I_0 \ge \dfrac{M_t}{G\,\theta'_{adm}} = \dfrac{1{,}146\times 10^5}{81\,000\times 5{,}24\times 10^{-6}} = 2{,}70\times 10^5\ \text{mm}^4$$</div>
    <p>soit \(d \ge (32 I_0/\pi)^{1/4} = 40{,}7\ \text{mm}\). C'est la <strong>rigidité</strong> qui dimensionne, et de loin : on retient \(d = 42\ \text{mm}\), pour lequel la contrainte n'atteint que \(7{,}9\ \text{MPa}\), cinq fois moins que \(R_{pg}\).</p>
    <p><strong>Q4.</strong> La condition \(\dfrac{\pi(48^4 - d_i^4)}{32} \ge 2{,}70\times 10^5\) impose :</p>
    <div class="formula">$$d_i^4 \le 5{,}31\times 10^6 - 2{,}75\times 10^6 = 2{,}56\times 10^6\ \text{mm}^4$$</div>
    <p>soit \(d_i \le 39{,}98\ \text{mm}\) : on prend \(d_i = 39\ \text{mm}\) (paroi de 4,5 mm). Rapport des sections : \((48^2 - 39^2)/42^2 = 783/1764 \approx 0{,}44\) : la masse diminue de plus de moitié.</p>
    <p><strong>Q5.</strong> \(I_0 = \pi(48^4 - 39^4)/32 = 2{,}94\times 10^5\ \text{mm}^4\) ; \(\tau_{max} = \dfrac{M_t R}{I_0}\), soit \(\dfrac{1{,}146\times 10^5\times 24}{2{,}94\times 10^5} = 9{,}4\ \text{MPa} \le R_{pg}\). Angle entre accouplements :</p>
    <div class="formula">$$\Delta\theta = \dfrac{M_t L}{G I_0} = \dfrac{1{,}146\times 10^5\times 2000}{81\,000\times 2{,}94\times 10^5} = 9{,}6\times 10^{-3}\ \text{rad} \approx 0{,}55°$$</div>
    <p>contre \(0{,}53°\) pour l'arbre plein de 42 mm (\(I_0 = 3{,}05\times 10^5\ \text{mm}^4\)) ; la limite vaut \(0{,}3\times 2 = 0{,}6°\). À rigidité pratiquement égale, le tube est deux fois plus léger : c'est la matière proche de l'axe, peu sollicitée, que l'on a retirée.</p>
    <p><strong>Q6.</strong> En unités SI, \(I_0 = 2{,}94\times10^{-7}\ \text{m}^4\) et</p>
    <div class="formula">$$k_t = \frac{G I_0}{L} = \frac{81\cdot10^{9}\times2{,}94\cdot10^{-7}}{2{,}0} \approx 1{,}19\cdot10^{4}\ \text{N·m/rad} \qquad \omega_0 = \sqrt{\frac{k_t}{J}} \approx 154\ \text{rad/s}$$</div>
    <p>soit environ 25 Hz. \(\omega_0/\omega_{c0} \approx 10\) : le mode de torsion est assez loin de la bande passante (règle pratique : un rapport d'au moins 5 à 10), le modèle indéformable de l'arbre convient pour régler l'asservissement. Un arbre deux fois plus long, ou un enrouleur quatre fois plus lourd, diviserait \(\omega_0\) par \(\sqrt2\) ou par 2 et imposerait un modèle à deux inerties.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Solive de plancher sous charge répartie</h3>
  <div class="statement">Une solive en bois de portée \(L = 3{,}0\ \text{m}\) repose sur deux appuis A (\(x = 0\)) et B (\(x = L\)). Elle supporte une charge uniforme \(p = 2{,}0\ \text{kN/m}\) dirigée vers le bas (\(q_y = -p\)). Section rectangulaire de largeur \(b = 50\ \text{mm}\) et de hauteur \(h\) à déterminer. Bois : \(E = 11\ \text{GPa}\), contrainte admissible \(10\ \text{MPa}\). Cahier des charges : flèche \(f \le L/300\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les actions des appuis.</div>
  <div class="q"><strong>Q2.</strong> À l'aide des équations d'équilibre local, établir \(T_y(x)\) et \(M_{fz}(x)\). Valeur maximale du moment ?</div>
  <div class="q"><strong>Q3.</strong> Hauteur minimale imposée par la résistance.</div>
  <div class="q"><strong>Q4.</strong> Établir l'équation de la déformée et la flèche.</div>
  <div class="q"><strong>Q5.</strong> Hauteur minimale imposée par la rigidité. Choisir \(h\) parmi 150, 175, 200 mm et vérifier.</div>
  <div class="q"><strong>Q6.</strong> Vérifier que le cisaillement reste faible.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Par symétrie, \(Y_A = Y_B = pL/2 = 3{,}0\ \text{kN}\).</p>
    <p><strong>Q2.</strong> \(T_y' = -q_y = p\), donc \(T_y = p\,x + C_1\) ; juste à droite de A, \(T_y = -Y_A\), d'où \(T_y = p\,(x - L/2)\). Puis \(M_{fz}' = -T_y\) et \(M_{fz}(0) = 0\) donnent \(M_{fz} = \dfrac{p\,x(L - x)}{2}\). Maximum en \(x = L/2\), où \(T_y = 0\) : \(M_{f,max} = pL^2/8 = 2250\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> La condition de résistance s'écrit :</p>
    <div class="formula">$$\sigma_{max} = \dfrac{M_{f,max}\,h/2}{bh^3/12} = \dfrac{6\,M_{f,max}}{b h^2} \le 10\ \text{MPa}$$</div>
    <p>ce qui donne \(h \ge \sqrt{\dfrac{6\times 2{,}25\times 10^6}{50\times 10}} = 164\ \text{mm}\).</p>
    <p><strong>Q4.</strong> \(EI\,v'' = \dfrac{p}{2}(Lx - x^2)\) ; \(EI\,v' = \dfrac{p}{2}\left(\dfrac{Lx^2}{2} - \dfrac{x^3}{3}\right) + C_1\) ; \(EI\,v = \dfrac{p}{2}\left(\dfrac{Lx^3}{6} - \dfrac{x^4}{12}\right) + C_1 x + C_2\). \(v(0) = 0\) donne \(C_2 = 0\) et \(v(L) = 0\) donne \(C_1 = -pL^3/24\). Au milieu :</p>
    <div class="formula">$$v\!\left(\frac{L}{2}\right) = -\frac{5\,pL^4}{384\,EI} \qquad f = \frac{5\,pL^4}{384\,EI}$$</div>
    <p><strong>Q5.</strong> Avec \(I = bh^3/12\), la condition \(f \le L/300\) impose :</p>
    <div class="formula">$$h^3 \ge \dfrac{5\times 12\times 300\,pL^3}{384\,E\,b} = \dfrac{18\,000\times 2\times 2{,}7\times 10^{10}}{384\times 11\,000\times 50} = 4{,}60\times 10^6\ \text{mm}^3$$</div>
    <p>soit \(h \ge 166\ \text{mm}\). Les deux critères sont proches et la rigidité l'emporte de peu : \(h = 175\ \text{mm}\). Vérification : \(\sigma_{max} = \dfrac{6\times 2{,}25\times 10^6}{50\times 175^2} = 8{,}8\ \text{MPa}\) et \(I = 2{,}23\times 10^7\ \text{mm}^4\), \(f = 8{,}6\ \text{mm} \le 10\ \text{mm}\).</p>
    <p><strong>Q6.</strong> \(|T_y|_{max} = 3\ \text{kN}\) aux appuis ; pour un rectangle \(\tau_{max} = 3T/(2bh)\), soit \(\dfrac{9000}{2\times 50\times 175} = 0{,}51\ \text{MPa}\), très inférieur à la contrainte normale.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Plongeoir en console</h3>
  <div class="statement">Un plongeoir est modélisé par une poutre encastrée en O (\(x = 0\)) et libre en A (\(x = L\)), avec \(L = 2{,}0\ \text{m}\). Section rectangulaire \(b = 500\ \text{mm}\) (largeur), \(h = 50\ \text{mm}\) (épaisseur) ; matériau composite de module \(E = 25\ \text{GPa}\). Un plongeur exerce en A la force \(-F\,\vec y\), \(F = 800\ \text{N}\). Poids propre négligé.</div>
  <div class="q"><strong>Q1.</strong> Par les équations d'équilibre local, déterminer \(T_y(x)\) et \(M_{fz}(x)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la contrainte normale maximale. Quelle face est tendue ?</div>
  <div class="q"><strong>Q3.</strong> Établir la déformée ; en déduire la flèche et la rotation en A.</div>
  <div class="q"><strong>Q4.</strong> Calculer la raideur du plongeoir vue du plongeur.</div>
  <div class="q"><strong>Q5.</strong> Quelle épaisseur diviserait la flèche par deux ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sans charge répartie, \(T_y\) est constant et \(M_{fz}\) affine. Juste à gauche de A, la partie aval se réduit au point A chargé par \(-F\vec y\) : \(T_y(L) = -F\) et \(M_{fz}(L) = 0\). Donc \(T_y = -F\) et, avec \(M_{fz}' = -T_y = F\), \(M_{fz} = -F\,(L - x)\). Maximum en valeur absolue à l'encastrement : \(FL = 1600\ \text{N·m}\).</p>
    <p><strong>Q2.</strong> \(I_{Gz} = 500\times 50^3/12 = 5{,}21\times 10^6\ \text{mm}^4\) ; \(\sigma_{max} = \dfrac{1{,}6\times 10^6\times 25}{5{,}21\times 10^6} = 7{,}7\ \text{MPa}\). Comme \(M_{fz} \lt 0\), \(\sigma = -M_{fz}\,y/I_{Gz}\) est positive pour \(y \gt 0\) : la face supérieure est tendue, la face inférieure comprimée.</p>
    <p><strong>Q3.</strong> \(EI\,v'' = -F(L - x)\) avec \(v(0) = v'(0) = 0\) : \(EI\,v' = -F\left(Lx - \dfrac{x^2}{2}\right)\), \(EI\,v = -F\left(\dfrac{Lx^2}{2} - \dfrac{x^3}{6}\right)\). En A :</p>
    <div class="formula">$$f = |v(L)| = \frac{FL^3}{3EI} \qquad |v'(L)| = \frac{FL^2}{2EI}$$</div>
    <p>Avec \(EI = 1{,}30\times 10^{11}\ \text{N·mm}^2\) (produit \(25\,000\times 5{,}21\times 10^6\)) : \(f = \dfrac{800\times 8\times 10^9}{3\times 1{,}30\times 10^{11}} = 16\ \text{mm}\) et une rotation de \(1{,}2\times 10^{-2}\ \text{rad}\) (0,7°).</p>
    <p><strong>Q4.</strong> \(k = F/f = 3EI/L^3 \approx 49\ \text{N/mm}\), soit environ 49 kN/m.</p>
    <p><strong>Q5.</strong> \(f \propto 1/I \propto 1/h^3\) : il faut \(h' = 50\times 2^{1/3} = 63\ \text{mm}\). Augmenter la largeur serait bien moins efficace (\(f \propto 1/b\)).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Arbre épaulé en flexion et torsion : Von Mises (hors programme, pour aller plus loin)</h3>
  <div class="statement">Au droit d'un épaulement, un arbre plein de diamètre \(d = 30\ \text{mm}\) subit un moment fléchissant \(M_f = 150\ \text{N·m}\) et un moment de torsion \(M_t = 200\ \text{N·m}\). Les abaques donnent, pour la géométrie du raccordement, \(K_t = 1{,}7\) en flexion et \(K_t = 1{,}4\) en torsion. Acier : \(R_e = 400\ \text{MPa}\), coefficient de sécurité \(s = 2\). L'effort tranchant est négligé. Le coefficient de concentration de contraintes \(K_t\) et le critère de Von Mises sont des compléments non exigibles : un sujet de concours les fournit.</div>
  <div class="q"><strong>Q1.</strong> En quels points de la section la sollicitation est-elle la plus sévère ?</div>
  <div class="q"><strong>Q2.</strong> Calculer les contraintes nominales puis réelles \(\sigma\) et \(\tau\) en ces points.</div>
  <div class="q"><strong>Q3.</strong> Montrer que le critère de Von Mises se réduit à \(\sigma_{eq} = \sqrt{\sigma^2 + 3\tau^2}\) ; conclure.</div>
  <div class="q"><strong>Q4.</strong> Quelle erreur commettrait-on en oubliant les \(K_t\) ?</div>
  <div class="q"><strong>Q5.</strong> On remplace l'acier par une nuance de limite \(R_e = 240\ \text{MPa}\). Quel diamètre faut-il (en supposant les \(K_t\) inchangés) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La contrainte de flexion est maximale sur les deux fibres extrêmes du plan de flexion (\(|y| = d/2\)) et la contrainte de torsion est maximale sur toute la périphérie : les deux maxima coïncident aux deux points extrêmes du plan de flexion.</p>
    <p><strong>Q2.</strong> \(\pi d^3 = 8{,}48\times 10^4\ \text{mm}^3\). Flexion : \(\sigma_{nom} = 32 M_f/(\pi d^3) = 56{,}6\ \text{MPa}\), \(\sigma = 1{,}7\times 56{,}6 = 96{,}2\ \text{MPa}\). Torsion : \(\tau_{nom} = 16 M_t/(\pi d^3) = 37{,}7\ \text{MPa}\), \(\tau = 1{,}4\times 37{,}7 = 52{,}8\ \text{MPa}\).</p>
    <p><strong>Q3.</strong> Seules \(\sigma_{xx} = \sigma\) et \(\tau_{xy} = \tau\) (par exemple) sont non nulles :</p>
    <div class="formula">$$\sigma_{eq} = \tfrac{1}{\sqrt 2}\sqrt{\sigma^2 + 0 + \sigma^2 + 6\tau^2} = \sqrt{\sigma^2 + 3\tau^2}$$</div>
    <div class="formula">$$\sigma_{eq} = \sqrt{96{,}2^2 + 3\times 52{,}8^2} = 133\ \text{MPa} \le R_{pe} = 200\ \text{MPa}$$</div>
    <p>Le critère est vérifié, avec une sécurité effective \(400/133 = 3{,}0\).</p>
    <p><strong>Q4.</strong> Sans \(K_t\) : \(\sigma_{eq} = \sqrt{56{,}6^2 + 3\times 37{,}7^2} = 86\ \text{MPa}\), soit une sous-estimation d'environ 35 % de la contrainte réelle au pied de l'épaulement — précisément là où s'amorcent les ruptures.</p>
    <p><strong>Q5.</strong> \(R_{pe} = 120\ \text{MPa}\). La contrainte équivalente varie en \(1/d^3\) : \(d^3 \ge 30^3\times 133/120\), soit \(d \ge 31{,}0\ \text{mm}\). On retient \(d = 32\ \text{mm}\) (en toute rigueur il faudrait relire les \(K_t\), qui dépendent du rapport rayon / diamètre).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Bras d'un robot de palettisation</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>résistance des matériaux</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Le dernier segment d'un robot de palettisation est un bras horizontal de longueur \(L = 1{,}2\ \text{m}\), modélisé par une poutre encastrée en O (\(x = 0\)) dans le poignet motorisé et libre en A (\(x = L\)). Le bras est un tube d'alliage d'aluminium de diamètres \(D = 80\ \text{mm}\) et \(d = 72\ \text{mm}\) : \(E = 70\ \text{GPa}\), \(\nu = 0{,}33\), \(\rho = 2700\ \text{kg/m}^3\), \(R_e = 240\ \text{MPa}\), \(s = 2\) ; \(g = 9{,}81\ \text{m/s}^2\). Le préhenseur et la charge exercent en A une force verticale \(-F\,\vec y\) avec \(F = 300\ \text{N}\), dont la ligne d'action est décalée de \(e = 200\ \text{mm}\) selon \(\vec z\) par rapport à l'axe du bras. Cahier des charges : le point de prise ne doit pas descendre de plus de \(2{,}5\ \text{mm}\) sous charge. On donne pour ce tube \(S = 955\ \text{mm}^2\) et \(I_{Gz} = 6{,}91\times 10^5\ \text{mm}^4\). Convention : torseur de cohésion = actions de la partie aval sur la partie amont.
  </div>

  <p class="exo-part">Partie A — Modélisation</p>
  <div class="q"><strong>A1.</strong> Justifier le modèle poutre. Où ses résultats sont-ils sujets à caution ?</div>
  <div class="q"><strong>A2.</strong> Calculer la charge linéique \(p\) due au poids propre du bras.</div>

  <p class="exo-part">Partie B — Efforts intérieurs</p>
  <div class="q"><strong>B1.</strong> Déterminer \(T_y(x)\), \(M_{fz}(x)\) et \(M_t(x)\) (isoler la partie aval). Vérifier les équations d'équilibre local.</div>
  <div class="q"><strong>B2.</strong> Identifier la sollicitation et la section critique ; calculer \(|M_{fz}|_{max}\).</div>

  <p class="exo-part">Partie C — Résistance</p>
  <div class="q"><strong>C1.</strong> Calculer la contrainte normale maximale et la contrainte tangentielle maximale de torsion.</div>
  <div class="q"><strong>C2.</strong> L'encastrement est une bride soudée où \(K_t = 2{,}2\) (appliqué à la contrainte de flexion). Vérifier le critère de Von Mises, fourni (complément non exigible) : \(\sigma_{eq} = \sqrt{\sigma^2 + 3\tau^2} \le R_{pe}\).</div>

  <p class="exo-part">Partie D — Rigidité et choix de solution</p>
  <div class="q"><strong>D1.</strong> Établir la flèche en A due à \(F\) et celle due à \(p\) ; faire l'application numérique.</div>
  <div class="q"><strong>D2.</strong> Calculer l'angle de torsion du bras et le déplacement vertical qu'il induit au point de prise. Le cahier des charges est-il respecté ?</div>
  <div class="q"><strong>D3.</strong> Deux solutions sont envisagées : (i) même tube en acier (\(E = 210\ \text{GPa}\), \(G = 81\ \text{GPa}\), \(\rho = 7800\ \text{kg/m}^3\)) ; (ii) tube d'aluminium \(100/92\) (\(S = 1206\ \text{mm}^2\), \(I_{Gz} = 1{,}39\times 10^6\ \text{mm}^4\)). Comparer déplacement du point de prise et masse ; conclure.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Ligne moyenne droite, section constante et élancement \(L/D = 15\) : le modèle poutre s'applique. Il est sujet à caution près de l'encastrement (bride soudée, Saint-Venant non vérifié, d'où un \(K_t\)) et près de l'interface avec le préhenseur.</p>
    <p><strong>A2.</strong> \(p = \rho S g\), soit \(p = 2700\times 9{,}55\times 10^{-4}\times 9{,}81\) \(= 25{,}3\ \text{N/m}\) (soit 30 N sur la longueur, une masse de 3,1 kg).</p>
    <p><strong>B1.</strong> La partie aval \([x, L]\) porte \(-F\vec y\) au point \(P = A + e\,\vec z\) et \(-p\,\vec y\) répartie. Résultante : \(T_y = -F - p\,(L - x)\). Moment en \(G\) :</p>
    <div class="formula">$$\overrightarrow{GP}\wedge(-F\vec y) = \big((L - x)\vec x + e\,\vec z\big)\wedge(-F\vec y) = -F(L - x)\,\vec z + F e\,\vec x$$</div>
    <p>et la charge répartie, de résultante \(-p(L - x)\vec y\) appliquée à mi-distance, donne \(-p(L - x)^2/2\,\vec z\). D'où :</p>
    <div class="formula">$$T_y = -F - p\,(L - x) \qquad M_{fz} = -F\,(L - x) - \frac{p\,(L - x)^2}{2} \qquad M_t = F\,e$$</div>
    <p>Vérification : \(T_y' = p = -q_y\) et \(M_{fz}' = F + p(L - x) = -T_y\).</p>
    <p><strong>B2.</strong> Sollicitation composée : flexion simple + torsion (\(M_t = 60\ \text{N·m}\), constant). Section critique : l'encastrement, où \(|M_{fz}|_{max} = FL + pL^2/2\), soit \(360 + 18 = 378\ \text{N·m}\).</p>
    <p><strong>C1.</strong> À l'encastrement, sur la fibre la plus éloignée :</p>
    <div class="formula">$$\sigma_{max} = \dfrac{|M_{fz}|_{max}\,D/2}{I_{Gz}} = \dfrac{3{,}78\times 10^5\times 40}{6{,}91\times 10^5} = 21{,}9\ \text{MPa}$$</div>
    <p>Avec \(I_0 = 2 I_{Gz} = 1{,}38\times 10^6\ \text{mm}^4\), sur toute la périphérie :</p>
    <div class="formula">$$\tau_{max} = \dfrac{M_t\,D/2}{I_0} = \dfrac{6\times 10^4\times 40}{1{,}38\times 10^6} = 1{,}7\ \text{MPa}$$</div>
    <p><strong>C2.</strong> \(\sigma = 2{,}2\times 21{,}9 = 48{,}2\ \text{MPa}\), d'où :</p>
    <div class="formula">$$\sigma_{eq} = \sqrt{48{,}2^2 + 3\times 1{,}7^2} \approx 48\ \text{MPa} \le R_{pe} = 120\ \text{MPa}$$</div>
    <p>La résistance est largement assurée.</p>
    <p><strong>D1.</strong> \(EI\,v'' = M_{fz}\) avec \(v(0) = v'(0) = 0\) ; en intégrant chaque terme (ou par superposition des cas de référence) : \(f_F = \dfrac{FL^3}{3EI}\) et \(f_p = \dfrac{pL^4}{8EI}\). Avec \(EI = 4{,}84\times 10^{10}\ \text{N·mm}^2\) (produit \(70\,000\times 6{,}91\times 10^5\)) : \(f_F = \dfrac{300\times 1{,}728\times 10^9}{3\times 4{,}84\times 10^{10}} = 3{,}57\ \text{mm}\) et \(f_p = \dfrac{0{,}0253\times 2{,}07\times 10^{12}}{8\times 4{,}84\times 10^{10}} = 0{,}14\ \text{mm}\).</p>
    <p><strong>D2.</strong> \(G = E/(2(1+\nu)) = 26{,}3\ \text{GPa}\), puis :</p>
    <div class="formula">$$\Delta\theta = \dfrac{M_t L}{G I_0} = \dfrac{6\times 10^4\times 1200}{26\,300\times 1{,}38\times 10^6} = 1{,}98\times 10^{-3}\ \text{rad}$$</div>
    <p>Le point de prise, à la distance \(e\) de l'axe, descend en plus de \(e\,\Delta\theta = 0{,}40\ \text{mm}\). Total : \(3{,}57 + 0{,}14 + 0{,}40 \approx 4{,}1\ \text{mm} \gt 2{,}5\ \text{mm}\) : le cahier des charges <strong>n'est pas respecté</strong>, alors que la contrainte est très faible. Le bras est dimensionné par la rigidité.</p>
    <p><strong>D3.</strong> (i) Acier : \(EI\) triplé, \(f_F = 1{,}19\ \text{mm}\) ; \(p = 73\ \text{N/m}\), \(f_p = 0{,}13\ \text{mm}\) ; torsion \(0{,}13\ \text{mm}\) ; total \(\approx 1{,}45\ \text{mm}\), mais masse \(8{,}9\ \text{kg}\). (ii) Aluminium \(100/92\) : \(EI = 9{,}75\times 10^{10}\ \text{N·mm}^2\), \(f_F = 1{,}77\ \text{mm}\) ; \(p = 32\ \text{N/m}\), \(f_p = 0{,}08\ \text{mm}\) ; \(I_0 = 2{,}78\times 10^6\ \text{mm}^4\), torsion \(0{,}20\ \text{mm}\) ; total \(\approx 2{,}05\ \text{mm} \le 2{,}5\ \text{mm}\) pour une masse de \(3{,}9\ \text{kg}\). Les deux solutions conviennent, mais le tube d'aluminium de plus grand diamètre est préférable : plus de deux fois plus léger, il réduit l'inertie du bras donc les couples moteurs et les temps de cycle. Augmenter \(I\) par la forme est plus efficace que d'augmenter \(E\) en alourdissant la pièce.</p>
