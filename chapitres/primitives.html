<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie « Calcul de primitives » de la section « Techniques fondamentales de calcul différentiel et intégral » du programme de PTSI (premier semestre). Le point de vue est <strong>pratique</strong> : savoir trouver une primitive et s'en servir pour calculer une intégrale. La construction de l'intégrale et la démonstration du lien entre intégrale et primitive viennent au second semestre, dans le chapitre « Intégrales » (§2 et §7). Les dérivées de référence sont dans le chapitre « Fonctions réelles — généralités », la décomposition en éléments simples dans « Polynômes » (§11). Ces calculs servent aussitôt dans le chapitre « Équations différentielles » (variation de la constante) et en physique (position à partir de la vitesse, charge à partir du courant, valeur moyenne).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Primitives d'une fonction définie sur un intervalle</strong> ; description de l'ensemble des primitives d'une fonction sur un intervalle connaissant l'une d'entre elles (§1).</li>
        <li><strong>Lien entre intégrales et primitives</strong> : pour \(f\) continue, \(x \mapsto \int_{x_0}^x f(t)\,\mathrm{d}t\) a pour dérivée \(f\) (rappelé sans démonstration) ; notation \(\int^x f(t)\,\mathrm{d}t\) d'une primitive générique ; application au calcul d'intégrales (§2).</li>
        <li><strong>Primitives usuelles</strong> : fonctions exponentielle, logarithme, puissances, trigonométriques et hyperboliques, \(x \mapsto \frac{1}{1 + x^2}\) et \(x \mapsto \frac{1}{\sqrt{1 - x^2}}\) (§3).</li>
        <li><strong>Reconnaître les dérivées de fonctions composées</strong> (§4).</li>
        <li><strong>Fonctions à valeurs complexes</strong> : primitives ; primitives de \(x \mapsto \mathrm{e}^{\lambda x}\) pour \(\lambda \in \mathbb C\), application à \(x \mapsto \mathrm{e}^{ax}\cos(bx)\) et \(x \mapsto \mathrm{e}^{ax}\sin(bx)\) (§5) ; puissances et produits de fonctions trigonométriques, par linéarisation (§6).</li>
        <li><strong>Primitives de \(x \mapsto \frac{1}{ax^2 + bx + c}\)</strong> (§7).</li>
        <li><strong>Fractions rationnelles</strong> : application de la décomposition en éléments simples (pôles simples ; forme fournie dans les autres cas) au calcul de primitives (§8, section « Polynômes » du programme).</li>
        <li><strong>Intégration par parties, changement de variable</strong> ; pour les applications pratiques, on ne demande pas de rappeler les hypothèses de régularité (§9, §10).</li>
      </ul>
      <p>Hors programme : le changement de variable \(t = \tan\frac x2\), les primitives qui font intervenir les fonctions hyperboliques réciproques, la décomposition des fractions à pôles multiples sans forme fournie (regroupés en fin de chapitre, pour aller plus loin).</p>

<div class="course-section">
  <div class="sec-num">§1 · PRIMITIVES SUR UN INTERVALLE</div>
  <h2>Remonter de la dérivée à la fonction</h2>
  <div class="intro">Connaître la vitesse d'un mobile et vouloir sa position, connaître l'intensité d'un courant et vouloir la charge transportée : dans les deux cas, on cherche une fonction dont on connaît la dérivée. Dériver est mécanique ; trouver une primitive demande de <em>reconnaître</em> une dérivée. Ce paragraphe fixe le cadre : sur un intervalle, une primitive est connue à une constante près.</div>

  <div class="def-box">
    Soit \(I\) un intervalle de \(\mathbb R\), non réduit à un point, et \(f : I \to \mathbb R\). Une <strong>primitive</strong> de \(f\) sur \(I\) est une fonction \(F : I \to \mathbb R\), dérivable sur \(I\), telle que
    <div class="formula">$$\forall x \in I, \qquad F'(x) = f(x) .$$</div>
  </div>

  <div class="prop-box">
    <strong>Ensemble des primitives.</strong> Si \(F\) est une primitive de \(f\) sur l'<strong>intervalle</strong> \(I\), les primitives de \(f\) sur \(I\) sont exactement les fonctions \(F + c\), où \(c\) parcourt \(\mathbb R\). Pour tout \(x_0 \in I\) et tout réel \(y_0\), il existe une <strong>unique</strong> primitive \(G\) de \(f\) telle que \(G(x_0) = y_0\) : c'est \(G = F - F(x_0) + y_0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une fonction de dérivée nulle sur un intervalle est constante.</span>
    <div class="content">
      <p>Pour \(c\) réel, \((F + c)' = F' = f\) : les \(F + c\) sont des primitives. Réciproquement, si \(G\) est une primitive de \(f\) sur \(I\), \((G - F)' = f - f = 0\) sur l'intervalle \(I\), donc \(G - F\) est constante (caractérisation des fonctions constantes, admise au premier semestre, démontrée par les accroissements finis dans le chapitre « Continuité et dérivabilité », §9). Enfin \(G = F + c\) vérifie \(G(x_0) = y_0\) si et seulement si \(c = y_0 - F(x_0)\) : une seule valeur de \(c\) convient.</p>
    </div>
  </div>
  <p>Toute fonction <strong>continue</strong> sur un intervalle possède des primitives : on l'admet ici, c'est le théorème fondamental démontré dans le chapitre « Intégrales » (§7). En pratique, on écrit « une primitive de \(f\) est \(F\) », ou bien \(F(x) + c\) pour désigner toutes les primitives.</p>

    <strong>Exemple — la primitive qui passe par un point</strong>
    <ol>
      <li>Soit \(f(x) = 3x^2 - 4x + 1\) sur \(\mathbb R\). En lisant à l'envers les dérivées de \(x^3\), \(x^2\) et \(x\), une primitive est \(F_0(x) = x^3 - 2x^2 + x\) ; contrôle : \(F_0'(x) = 3x^2 - 4x + 1\).</li>
      <li>Les primitives de \(f\) sur l'intervalle \(\mathbb R\) sont les \(F_0 + c\), \(c \in \mathbb R\).</li>
      <li>La condition \(F(2) = 5\) donne \(8 - 8 + 2 + c = 5\), soit \(c = 3\) : la seule primitive qui convient est \(F(x) = x^3 - 2x^2 + x + 3\) (courbe rouge de la figure).</li>
      <li>Toutes les primitives ont la même pente en une même abscisse : en \(x = 1{,}5\), cette pente vaut \(f(1{,}5) = 6{,}75 - 6 + 1 = 1{,}75\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : oublier le mot « intervalle ». Sur une réunion d'intervalles, la constante peut changer d'un morceau à l'autre. Sur \(\mathbb R^* = \,]-\infty, 0[\, \cup \,]0, +\infty[\), les primitives de \(x \mapsto \frac{1}{x}\) sont les fonctions égales à \(\ln(-x) + c_1\) pour \(x \lt 0\) et à \(\ln x + c_2\) pour \(x \gt 0\), avec deux constantes <strong>indépendantes</strong> (figure ci-dessous). De même, \(x \mapsto -\frac1x\) est une primitive de \(x \mapsto \frac{1}{x^2}\) sur chacun des deux intervalles, pas « à une constante près sur \(\mathbb R^*\) ».</div>

<div class="course-section">
  <div class="sec-num">§2 · INTÉGRALES ET PRIMITIVES</div>
  <h2>Calculer une intégrale avec une primitive</h2>
  <div class="intro">L'intégrale \(\int_a^b f(t)\,\mathrm{d}t\) d'une fonction continue est l'aire algébrique sous sa courbe. Le lien avec les primitives, connu depuis le lycée, est ce qui permet de la <em>calculer</em> ; il sera démontré au second semestre. Il donne aussi une primitive de toute fonction continue, même quand on ne sait pas l'écrire avec des fonctions usuelles.</div>

  <div class="prop-box">
    <strong>Lien entre intégrale et primitive</strong> (rappelé sans démonstration ; démontré dans le chapitre « Intégrales », §7). Soit \(f\) continue sur un intervalle \(I\) et \(x_0 \in I\). La fonction
    <div class="formula" data-nom="Primitive qui s'annule en x₀">$$F : x \longmapsto \int_{x_0}^{x} f(t)\,\mathrm{d}t$$</div>
    est dérivable sur \(I\), de dérivée \(f\) : c'est l'unique primitive de \(f\) sur \(I\) qui s'annule en \(x_0\). Par conséquent, pour <strong>toute</strong> primitive \(G\) de \(f\) sur \(I\) et tous \(a\), \(b\) de \(I\) :
    <div class="formula" data-nom="Intégrale par une primitive">$$\int_a^b f(t)\,\mathrm{d}t = G(b) - G(a) = \Big[G(t)\Big]_a^b .$$</div>
  </div>
  <p><strong>Notation.</strong> On note \(\displaystyle\int^x f(t)\,\mathrm{d}t\) une primitive <em>générique</em> de \(f\) : par exemple \(\int^x \cos t\,\mathrm{d}t = \sin x + c\). La lettre \(t\) est muette ; seule compte la variable \(x\) de la borne. Le résultat est une fonction de \(x\) définie à une constante près, alors que \(\int_a^b f(t)\,\mathrm{d}t\) est un <strong>nombre</strong>. On écrit aussi, plus librement, \(\int f(x)\,\mathrm{d}x = F(x) + c\).</p>

<figcaption>À gauche, la vitesse v(t) = 20 (1 − e^(−t/5)) m/s d'une voiture qui démarre ; l'aire sous la courbe entre 0 et 10 s est la distance parcourue, ≈ 113,5 m. À droite, la distance d(t) = ∫₀ᵗ v(s) ds, primitive de v nulle en 0 : sa pente en t est la vitesse v(t). Pour t grand, d(t) longe la droite 20 (t − 5) : la voiture garde 100 m de retard sur un mobile parti à 20 m/s (droite 20 t).</figcaption>

  <div class="method-box">
    <strong>Exemple — de la vitesse à la distance parcourue</strong>
    <ol>
      <li>Une voiture démarre à l'instant \(0\) ; sa vitesse vaut \(v(t) = v_\ell\big(1 - \mathrm{e}^{-t/\tau}\big)\), avec \(v_\ell = 20\ \text{m/s}\) et \(\tau = 5\ \text{s}\). La distance parcourue à l'instant \(t\) est la primitive de \(v\) nulle en 0 : \(d(t) = \int_0^t v(s)\,\mathrm{d}s\).</li>
      <li>Une primitive de \(s \mapsto \mathrm{e}^{-s/\tau}\) est \(s \mapsto -\tau\,\mathrm{e}^{-s/\tau}\) (forme \(f(as)\), §4). Donc
      <div class="formula">$$d(t) = v_\ell\Big[s + \tau\,\mathrm{e}^{-s/\tau}\Big]_0^t = v_\ell\Big(t - \tau\big(1 - \mathrm{e}^{-t/\tau}\big)\Big) .$$</div></li>
      <li>Au bout de 10 s : \(d(10) = 20\big(10 - 5(1 - \mathrm{e}^{-2})\big) = 100 + 100\,\mathrm{e}^{-2} \approx 113{,}5\ \text{m}\).</li>
      <li>Pour \(t\) grand, \(d(t) \approx v_\ell\,(t - \tau)\) : la voiture a un retard de \(v_\ell\tau = 100\ \text{m}\) sur un mobile qui serait parti d'emblée à 20 m/s.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — la charge transportée par un courant</strong>
    <ol>
      <li>Lors de la décharge d'un condensateur, l'intensité vaut \(i(t) = I_0\,\mathrm{e}^{-t/\tau}\), avec \(I_0 = 2\ \text{mA}\) et \(\tau = 1\ \text{ms}\). La charge qui traverse le circuit entre \(0\) et \(T\) est \(q(T) = \int_0^T i(t)\,\mathrm{d}t\), puisque \(i = \frac{\mathrm{d}q}{\mathrm{d}t}\).</li>
      <li>\(q(T) = I_0\Big[-\tau\,\mathrm{e}^{-t/\tau}\Big]_0^T = I_0\,\tau\,\big(1 - \mathrm{e}^{-T/\tau}\big)\).</li>
      <li>Pour \(T = 5\tau\), \(q \approx 0{,}993\,I_0\tau \approx 1{,}99\ \mu\text{C}\) : presque toute la charge \(I_0\tau = 2\ \mu\text{C}\) est passée (chapitre « Circuit linéaire du premier ordre », §4).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : appliquer \(\big[G\big]_a^b\) avec une primitive qui n'est pas valable sur tout le segment \([a, b]\). Le « calcul » \(\displaystyle\int_{-1}^{1}\frac{\mathrm{d}x}{x^2} = \Big[-\frac1x\Big]_{-1}^{1} = -2\) est absurde : l'intégrande est positive. La fonction \(\frac{1}{x^2}\) n'est pas continue sur \([-1, 1]\) (elle n'y est même pas définie en 0), et le théorème ne s'applique pas.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PRIMITIVES USUELLES ET LINÉARITÉ</div>
  <h2>Le tableau à connaître</h2>
  <div class="intro">Le tableau des primitives usuelles est celui des dérivées usuelles lu à l'envers. On le retrouve en se demandant : « quelle fonction faut-il dériver pour obtenir \(f\) ? ». Combiné à la linéarité, il règle déjà tous les polynômes et beaucoup de sommes.</div>

  <table>
    <tr><th>\(f(x)\)</th><th>une primitive \(F(x)\)</th><th>sur</th></tr>
    <tr><td>\(x^n\), \(n \in \mathbb N\)</td><td>\(\dfrac{x^{n+1}}{n+1}\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(\dfrac{1}{x^n}\), \(n \ge 2\) entier</td><td>\(-\dfrac{1}{(n-1)\,x^{n-1}}\)</td><td>\(]-\infty, 0[\) ou \(]0, +\infty[\)</td></tr>
    <tr><td>\(x^\alpha\), \(\alpha \in \mathbb R \setminus \{-1\}\)</td><td>\(\dfrac{x^{\alpha+1}}{\alpha+1}\)</td><td>\(]0, +\infty[\)</td></tr>
    <tr><td>\(\dfrac1x\)</td><td>\(\ln|x|\)</td><td>\(]-\infty, 0[\) ou \(]0, +\infty[\)</td></tr>
    <tr><td>\(\mathrm{e}^x\)</td><td>\(\mathrm{e}^x\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(a^x\), \(a \gt 0\), \(a \neq 1\)</td><td>\(\dfrac{a^x}{\ln a}\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(\ln x\)</td><td>\(x\ln x - x\) (§9)</td><td>\(]0, +\infty[\)</td></tr>
    <tr><td>\(\cos x\)</td><td>\(\sin x\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(\sin x\)</td><td>\(-\cos x\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(1 + \tan^2 x = \dfrac{1}{\cos^2 x}\)</td><td>\(\tan x\)</td><td>\(]-\frac\pi2 + k\pi, \frac\pi2 + k\pi[\)</td></tr>
    <tr><td>\(\tan x\)</td><td>\(-\ln|\cos x|\) (§4)</td><td>\(]-\frac\pi2 + k\pi, \frac\pi2 + k\pi[\)</td></tr>
    <tr><td>\(\operatorname{ch} x\)</td><td>\(\operatorname{sh} x\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(\operatorname{sh} x\)</td><td>\(\operatorname{ch} x\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(\dfrac{1}{1 + x^2}\)</td><td>\(\arctan x\)</td><td>\(\mathbb R\)</td></tr>
    <tr><td>\(\dfrac{1}{\sqrt{1 - x^2}}\)</td><td>\(\arcsin x\)</td><td>\(]-1, 1[\)</td></tr>
  </table>
  <p>Chaque ligne se vérifie en dérivant la colonne du milieu. Par exemple \(\big(-\ln|\cos x|\big)' = -\frac{-\sin x}{\cos x} = \tan x\), et \((a^x)' = (\mathrm{e}^{x\ln a})' = \ln a\;a^x\). Sur \(]-1, 1[\), \(-\arccos x\) est aussi une primitive de \(\frac{1}{\sqrt{1 - x^2}}\) : elle diffère de \(\arcsin x\) de la constante \(-\frac\pi2\), puisque \(\arcsin x + \arccos x = \frac\pi2\).</p>

  <div class="prop-box">
    <strong>Linéarité.</strong> Si \(F\) et \(G\) sont des primitives de \(f\) et \(g\) sur le même intervalle \(I\), alors pour tous réels \(\lambda\), \(\mu\), \(\lambda F + \mu G\) est une primitive de \(\lambda f + \mu g\) sur \(I\) (car la dérivation est linéaire).
  </div>

  <div class="method-box">
    <strong>Exemple — développer avant de primitiver</strong>
    <ol>
      <li>\(f(x) = \dfrac{(1 + \sqrt x)^2}{x}\) sur \(]0, +\infty[\). On développe : \(f(x) = \dfrac{1 + 2\sqrt x + x}{x} = \dfrac1x + 2x^{-1/2} + 1\).</li>
      <li>Terme à terme, avec \(x^{-1/2} \to \frac{x^{1/2}}{1/2} = 2\sqrt x\) : une primitive est \(F(x) = \ln x + 4\sqrt x + x\).</li>
      <li>Application : \(\displaystyle\int_1^4 f(x)\,\mathrm{d}x = F(4) - F(1) = (\ln 4 + 8 + 4) - (0 + 4 + 1) = 7 + 2\ln 2 \approx 8{,}386\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — trois primitives par une identité</strong>
    <ol>
      <li>\(\tan^2 x = \dfrac{1}{\cos^2 x} - 1\) : sur \(]-\frac\pi2, \frac\pi2[\), une primitive de \(\tan^2\) est \(\tan x - x\).</li>
      <li>\(2^x = \mathrm{e}^{x\ln 2}\) : une primitive est \(\dfrac{2^x}{\ln 2}\), et \(\displaystyle\int_0^1 2^x\,\mathrm{d}x = \frac{2 - 1}{\ln 2} \approx 1{,}443\).</li>
      <li>\(\operatorname{ch} x + \operatorname{sh} x = \mathrm{e}^x\) et \(\operatorname{ch} x - \operatorname{sh} x = \mathrm{e}^{-x}\) : une primitive de \(3\operatorname{ch} x - \operatorname{sh} x = \mathrm{e}^x + 2\,\mathrm{e}^{-x}\) est \(3\operatorname{sh} x - \operatorname{ch} x = \mathrm{e}^x - 2\,\mathrm{e}^{-x}\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : la primitive d'un produit n'est pas le produit des primitives, ni celle d'un quotient le quotient des primitives. Une primitive de \(x\cos x\) n'est pas \(\frac{x^2}{2}\sin x\) (dérivez pour le voir) : c'est \(x\sin x + \cos x\), obtenue par parties (§9). Autre piège : appliquer la formule de \(x^\alpha\) à \(\alpha = -1\), qui donnerait \(\frac{x^0}{0}\) ; c'est le seul cas où la primitive est un logarithme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · RECONNAÎTRE LA DÉRIVÉE D'UNE COMPOSÉE</div>
  <h2>Les formes \(u'\,g(u)\)</h2>
  <div class="intro">La plupart des fonctions à primitiver ne sont pas dans le tableau, mais sont la dérivée d'une fonction composée. Le programme demande de savoir les reconnaître : c'est le réflexe le plus utile du chapitre, et c'est aussi la forme la plus simple du changement de variable (§10).</div>

  <div class="prop-box">
    <strong>Principe.</strong> Soit \(u : I \to J\) dérivable, et \(G\) une primitive de \(g\) sur l'intervalle \(J\). Alors \(G \circ u\) est une primitive de \(u' \times (g \circ u)\) sur \(I\), puisque \((G \circ u)' = u' \times (G' \circ u) = u' \times (g \circ u)\).
  </div>

  <table>
    <tr><th>forme à reconnaître</th><th>une primitive</th><th>condition</th></tr>
    <tr><td>\(u'\,u^\alpha\)</td><td>\(\dfrac{u^{\alpha+1}}{\alpha+1}\)</td><td>\(\alpha \neq -1\) ; \(u \neq 0\) si \(\alpha\) est un entier négatif, \(u \gt 0\) si \(\alpha \notin \mathbb Z\)</td></tr>
    <tr><td>\(\dfrac{u'}{u}\)</td><td>\(\ln|u|\)</td><td>\(u\) ne s'annule pas</td></tr>
    <tr><td>\(\dfrac{u'}{\sqrt u}\)</td><td>\(2\sqrt u\)</td><td>\(u \gt 0\)</td></tr>
    <tr><td>\(u'\,\mathrm{e}^u\)</td><td>\(\mathrm{e}^u\)</td><td></td></tr>
    <tr><td>\(u'\cos u\), \(u'\sin u\)</td><td>\(\sin u\), \(-\cos u\)</td><td></td></tr>
    <tr><td>\(u'\operatorname{ch} u\), \(u'\operatorname{sh} u\)</td><td>\(\operatorname{sh} u\), \(\operatorname{ch} u\)</td><td></td></tr>
    <tr><td>\(\dfrac{u'}{1 + u^2}\)</td><td>\(\arctan u\)</td><td></td></tr>
    <tr><td>\(\dfrac{u'}{\sqrt{1 - u^2}}\)</td><td>\(\arcsin u\)</td><td>\(-1 \lt u \lt 1\)</td></tr>
  </table>
  <p>Cas particulier très fréquent, \(u(x) = ax + b\) avec \(a \neq 0\) : si \(F\) est une primitive de \(f\), une primitive de \(x \mapsto f(ax + b)\) est</p>
  <div class="formula" data-nom="Primitive de f(ax + b)">$$x \longmapsto \frac1a\,F(ax + b) .$$</div>

  <div class="method-box">
    <strong>Exemple — six formes reconnues</strong>
    <ol>
      <li>\(\dfrac{x}{(1 + x^2)^2} = \dfrac12\,u'u^{-2}\) avec \(u = 1 + x^2\) : une primitive est \(\dfrac12\cdot\dfrac{u^{-1}}{-1} = -\dfrac{1}{2(1 + x^2)}\).</li>
      <li>\(\dfrac{\mathrm{e}^{\sqrt x}}{\sqrt x}\) sur \(]0, +\infty[\) : avec \(u = \sqrt x\), \(u' = \frac{1}{2\sqrt x}\), c'est \(2u'\mathrm{e}^u\) ; primitive \(2\,\mathrm{e}^{\sqrt x}\).</li>
      <li>\(\dfrac{\cos x}{1 + \sin^2 x} = \dfrac{u'}{1 + u^2}\) avec \(u = \sin x\) : primitive \(\arctan(\sin x)\).</li>
      <li>\(\dfrac{1}{x\ln x}\) sur \(]1, +\infty[\) : c'est \(\dfrac{u'}{u}\) avec \(u = \ln x \gt 0\) ; primitive \(\ln(\ln x)\).</li>
      <li>\(\cos\big(3x - \frac\pi4\big)\) : forme \(f(ax + b)\) ; primitive \(\frac13\sin\big(3x - \frac\pi4\big)\).</li>
      <li>\(\dfrac{1}{(2x + 1)^3}\) sur \(]-\frac12, +\infty[\) : \(\frac12\,u'u^{-3}\) avec \(u = 2x + 1\) ; primitive \(\dfrac12\cdot\dfrac{u^{-2}}{-2} = -\dfrac{1}{4(2x + 1)^2}\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — deux intégrales sans calcul de primitive compliqué</strong>
    <ol>
      <li>\(\displaystyle\int_0^1\frac{x\,\mathrm{d}x}{\sqrt{1 + x^2}}\) : \(\frac{x}{\sqrt{1 + x^2}} = \frac12\,\frac{u'}{\sqrt u}\) avec \(u = 1 + x^2\), d'où \(\Big[\sqrt{1 + x^2}\Big]_0^1 = \sqrt2 - 1 \approx 0{,}414\).</li>
      <li>\(\displaystyle\int_0^{\pi/2}\sin x\cos^3 x\,\mathrm{d}x\) : \(\sin x\cos^3 x = -u'u^3\) avec \(u = \cos x\), d'où \(\Big[-\frac{\cos^4 x}{4}\Big]_0^{\pi/2} = 0 + \frac14 = \frac14\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : la « presque-forme ». \(x\,\mathrm{e}^{x^2}\) est bien \(\frac12 u'\mathrm{e}^u\) (primitive \(\frac12\mathrm{e}^{x^2}\)), mais \(\mathrm{e}^{x^2}\) seule ne l'est pas : il manque le facteur \(2x\), qu'on n'a pas le droit de « faire apparaître » en divisant par \(2x\) (ce n'est pas une constante). \(\mathrm{e}^{x^2}\) a des primitives (elle est continue), mais aucune ne s'écrit avec les fonctions usuelles. Toujours contrôler en dérivant le résultat.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FONCTIONS À VALEURS COMPLEXES ET EXPONENTIELLE \(\mathrm{e}^{\lambda x}\)</div>
  <h2>Primitiver en passant par les complexes</h2>
  <div class="intro">Le programme étend les primitives aux fonctions à valeurs complexes. Le bénéfice est immédiat : \(\mathrm{e}^{ax}\cos(bx)\) est la partie réelle de \(\mathrm{e}^{(a+ib)x}\), dont la primitive s'écrit en une ligne, là où deux intégrations par parties seraient nécessaires. La physique utilise sans cesse ce passage par la notation complexe.</div>

  <div class="def-box">
    Soit \(f = u + iv : I \to \mathbb C\), avec \(u = \operatorname{Re} f\) et \(v = \operatorname{Im} f\) à valeurs réelles. Une <strong>primitive</strong> de \(f\) sur \(I\) est une fonction \(F : I \to \mathbb C\) dérivable telle que \(F' = f\), la dérivée étant celle des parties réelle et imaginaire (chapitre « Fonctions réelles — généralités », §12). Autrement dit, \(F = U + iV\) où \(U\) et \(V\) sont des primitives de \(u\) et \(v\).
  </div>
  <p>Tout le §1 se transpose : si \(F\) est une primitive de \(f\) sur l'intervalle \(I\), les primitives de \(f\) sont les \(F + c\), avec cette fois \(c \in \mathbb C\) ; la linéarité vaut avec des coefficients complexes, et \(\int_a^b f = F(b) - F(a)\).</p>

  <div class="prop-box">
    <strong>Primitive de \(\mathrm{e}^{\lambda x}\).</strong> Pour \(\lambda \in \mathbb C\), \(\lambda \neq 0\), une primitive de \(x \mapsto \mathrm{e}^{\lambda x}\) sur \(\mathbb R\) est \(x \mapsto \dfrac{\mathrm{e}^{\lambda x}}{\lambda}\), car \(\big(\mathrm{e}^{\lambda x}\big)' = \lambda\,\mathrm{e}^{\lambda x}\). Pour \(a\), \(b\) réels non tous deux nuls, en prenant parties réelle et imaginaire de \(\frac{\mathrm{e}^{(a+ib)x}}{a + ib}\) :
    <div class="formula" data-nom="Primitive de exp(ax) cos(bx)">$$\int^x \mathrm{e}^{at}\cos(bt)\,\mathrm{d}t = \frac{\mathrm{e}^{ax}\big(a\cos(bx) + b\sin(bx)\big)}{a^2 + b^2} + c ,$$</div>
    <div class="formula" data-nom="Primitive de exp(ax) sin(bx)">$$\int^x \mathrm{e}^{at}\sin(bt)\,\mathrm{d}t = \frac{\mathrm{e}^{ax}\big(a\sin(bx) - b\cos(bx)\big)}{a^2 + b^2} + c .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Multiplier par le conjugué, puis séparer.</span>
    <div class="content">
      <p>On multiplie numérateur et dénominateur par \(a - ib\), conjugué de \(a + ib\) :</p>
      <div class="formula">$$\begin{aligned} \frac{\mathrm{e}^{(a+ib)x}}{a + ib} &= \frac{(a - ib)\,\mathrm{e}^{ax}\big(\cos(bx) + i\sin(bx)\big)}{a^2 + b^2} \\ &= \frac{\mathrm{e}^{ax}}{a^2 + b^2}\Big[a\cos(bx) + b\sin(bx) \\ &\qquad + i\big(a\sin(bx) - b\cos(bx)\big)\Big] . \end{aligned}$$</div>
      <p>La partie réelle d'une primitive de \(f\) est une primitive de \(\operatorname{Re} f\), ici \(\mathrm{e}^{ax}\cos(bx)\) ; de même pour les parties imaginaires. On obtient les deux formules, que l'on peut contrôler en dérivant.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — \(\mathrm{e}^{2x}\sin(3x)\) en une ligne</strong>
    <ol>
      <li>\(\mathrm{e}^{2x}\sin(3x) = \operatorname{Im}\big(\mathrm{e}^{(2+3i)x}\big)\), et \(\dfrac{1}{2 + 3i} = \dfrac{2 - 3i}{13}\).</li>
      <li>Partie imaginaire de \(\dfrac{(2 - 3i)\,\mathrm{e}^{2x}\big(\cos 3x + i\sin 3x\big)}{13}\) : une primitive est \(F(x) = \dfrac{\mathrm{e}^{2x}\big(2\sin(3x) - 3\cos(3x)\big)}{13}\).</li>
      <li>Contrôle : \(F'(x) = \frac{\mathrm{e}^{2x}}{13}\big(4\sin 3x - 6\cos 3x + 6\cos 3x + 9\sin 3x\big) = \mathrm{e}^{2x}\sin 3x\).</li>
      <li>Application : \(\displaystyle\int_0^\pi \mathrm{e}^{2x}\sin(3x)\,\mathrm{d}x = F(\pi) - F(0) = \frac{3\,\mathrm{e}^{2\pi} + 3}{13} \approx 123{,}8\), puisque \(\cos 3\pi = -1\) et \(\sin 3\pi = 0\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — deux primitives réelles pour le prix d'une complexe</strong>
    <ol>
      <li>Cherchons une primitive de \(x\,\mathrm{e}^{ix}\) sous la forme \((\alpha + \beta x)\,\mathrm{e}^{ix}\) : sa dérivée vaut \(\big(\beta + i\alpha + i\beta x\big)\mathrm{e}^{ix}\), égale à \(x\,\mathrm{e}^{ix}\) si \(i\beta = 1\) et \(\beta + i\alpha = 0\), soit \(\beta = -i\), \(\alpha = 1\).</li>
      <li>Une primitive de \(x\,\mathrm{e}^{ix}\) est donc \((1 - ix)\,\mathrm{e}^{ix} = (\cos x + x\sin x) + i(\sin x - x\cos x)\).</li>
      <li>Parties réelle et imaginaire : une primitive de \(x\cos x\) est \(\cos x + x\sin x\), une primitive de \(x\sin x\) est \(\sin x - x\cos x\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : prendre la partie réelle trop tôt. \(\operatorname{Re}\dfrac{z}{w}\) n'est pas \(\dfrac{\operatorname{Re} z}{\operatorname{Re} w}\) : on écrit d'abord le quotient sous forme algébrique (en multipliant par le conjugué du dénominateur), puis on sépare. Et la formule \(\frac{\mathrm{e}^{\lambda x}}{\lambda}\) exige \(\lambda \neq 0\) : pour \(\lambda = 0\), la primitive de la constante 1 est \(x\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · PUISSANCES ET PRODUITS DE FONCTIONS TRIGONOMÉTRIQUES</div>
  <h2>Linéariser avant de primitiver</h2>
  <div class="intro">Les fonctions \(\cos^2\), \(\sin^3\), \(\cos(3x)\sin(5x)\) ne figurent pas au tableau. On les transforme en sommes de \(\cos(kx)\) et \(\sin(kx)\), dont les primitives sont immédiates : c'est la <strong>linéarisation</strong> (chapitre « Nombres complexes », §6). En physique, elle donne les valeurs moyennes de \(\cos^2\) et \(\sin^2\), donc les valeurs efficaces et les puissances moyennes.</div>

  <div class="prop-box">
    <strong>Formules de linéarisation.</strong> Pour tous réels \(a\), \(b\), \(x\) :
    <div class="formula" data-nom="Linéarisation de cos² et sin²">$$\cos^2 x = \frac{1 + \cos(2x)}{2}, \qquad \sin^2 x = \frac{1 - \cos(2x)}{2},$$</div>
    <div class="formula" data-nom="Produits en sommes">$$\begin{aligned} \cos a\cos b &= \tfrac12\big(\cos(a + b) + \cos(a - b)\big), \\ \sin a\sin b &= \tfrac12\big(\cos(a - b) - \cos(a + b)\big), \\ \sin a\cos b &= \tfrac12\big(\sin(a + b) + \sin(a - b)\big). \end{aligned}$$</div>
    Pour une puissance plus élevée, on écrit \(\cos x = \frac{\mathrm{e}^{ix} + \mathrm{e}^{-ix}}{2}\), \(\sin x = \frac{\mathrm{e}^{ix} - \mathrm{e}^{-ix}}{2i}\) (formules d'Euler), on développe par le binôme et on regroupe les exponentielles conjuguées.
  </div>
  <p><strong>Règle pratique pour \(\sin^m x\cos^n x\)</strong> (\(m\), \(n\) entiers naturels). Si l'un des exposants est impair, par exemple \(m\), on isole un facteur \(\sin x\) et l'on écrit \(\sin^{m-1} x = (1 - \cos^2 x)^{(m-1)/2}\) : il reste un polynôme en \(u = \cos x\) multiplié par \(-u'\), forme du §4. Si les deux exposants sont pairs, on linéarise.</p>

  <div class="method-box">
    <strong>Exemple — \(\cos^4 x\) et sa valeur moyenne</strong>
    <ol>
      <li>Euler et binôme : \(\cos^4 x = \dfrac{(\mathrm{e}^{ix} + \mathrm{e}^{-ix})^4}{16} = \dfrac{\mathrm{e}^{4ix} + 4\,\mathrm{e}^{2ix} + 6 + 4\,\mathrm{e}^{-2ix} + \mathrm{e}^{-4ix}}{16}\).</li>
      <li>On regroupe \(\mathrm{e}^{ik x} + \mathrm{e}^{-ikx} = 2\cos(kx)\) : \(\cos^4 x = \dfrac{\cos(4x) + 4\cos(2x) + 3}{8}\).</li>
      <li>Une primitive est \(\dfrac{\sin(4x)}{32} + \dfrac{\sin(2x)}{4} + \dfrac{3x}{8}\).</li>
      <li>Sur une période \([0, 2\pi]\), les termes en sinus reprennent la même valeur : \(\int_0^{2\pi}\cos^4 x\,\mathrm{d}x = \frac{3\pi}{4}\), et la valeur moyenne de \(\cos^4\) vaut \(\frac38\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — une puissance impaire : \(\sin^3 x\cos^2 x\)</strong>
    <ol>
      <li>On isole \(\sin x\) : \(\sin^3 x\cos^2 x = \sin x\,(1 - \cos^2 x)\cos^2 x = -u'\,(u^2 - u^4)\) avec \(u = \cos x\).</li>
      <li>Une primitive est \(-\dfrac{u^3}{3} + \dfrac{u^5}{5} = -\dfrac{\cos^3 x}{3} + \dfrac{\cos^5 x}{5}\) ; aucune linéarisation n'était nécessaire.</li>
    </ol>
  </div>

<figcaption>À gauche, cos² x = (1 + cos 2x)/2 oscille entre 0 et 1 autour de sa valeur moyenne 1/2 : l'aire sous la courbe sur une période [0, 2π] vaut π, celle du rectangle de hauteur 1/2. À droite, sa primitive x/2 + sin(2x)/4 ondule autour de la droite x/2 : le terme oscillant ne s'accumule pas, seule la moyenne fait croître la primitive. C'est pourquoi la puissance moyenne d'un signal sinusoïdal fait intervenir le facteur 1/2.</figcaption>
</figure>

  <div class="method-box">
    <strong>Exemple — valeur efficace et orthogonalité</strong>
    <ol>
      <li>La valeur moyenne de \(\cos^2(\omega t)\) sur une période vaut \(\frac12\), comme le montre la figure. Une tension \(u(t) = U_m\cos(\omega t)\) a donc pour valeur efficace \(U_{\text{eff}} = \sqrt{\langle u^2\rangle} = \frac{U_m}{\sqrt2}\) : pour le secteur, \(U_m \approx 325\ \text{V}\) et \(U_{\text{eff}} \approx 230\ \text{V}\).</li>
      <li>Pour \(p\), \(q\) entiers naturels distincts, \(\cos(px)\cos(qx) = \frac12\big(\cos((p + q)x) + \cos((p - q)x)\big)\), et \(\int_0^{2\pi}\cos(kx)\,\mathrm{d}x = 0\) pour \(k \neq 0\) : donc \(\int_0^{2\pi}\cos(px)\cos(qx)\,\mathrm{d}x = 0\). Pour \(p = q \ge 1\), on trouve \(\pi\). Ces relations, dites d'orthogonalité, sont à la base des séries de Fourier en physique.</li>
      <li>De même \(\sin(5x)\cos(3x) = \frac12\big(\sin(8x) + \sin(2x)\big)\) a pour primitive \(-\frac{\cos(8x)}{16} - \frac{\cos(2x)}{4}\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : « une primitive de \(\sin^2 x\) est \(\frac{\sin^3 x}{3}\) ». C'est la formule de \(u'u^2\), mais ici il manque le facteur \(u' = \cos x\). Autre confusion : \(\cos^2 x\) (le carré de \(\cos x\)) et \(\cos(x^2)\), qui n'a pas de primitive usuelle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · PRIMITIVES DE \(1/(ax^2 + bx + c)\)</div>
  <h2>Trois cas selon le discriminant</h2>
  <div class="intro">Le programme demande explicitement de savoir primitiver \(x \mapsto \frac{1}{ax^2 + bx + c}\) (\(a \neq 0\)). Ces fonctions reviennent sans cesse : dans les décompositions en éléments simples (§8), en électricité (modules de fonctions de transfert), en mécanique. Tout dépend du signe du discriminant \(\Delta = b^2 - 4ac\).</div>

  <div class="prop-box">
    <strong>La formule de base.</strong> Pour \(k \gt 0\), une primitive de \(x \mapsto \dfrac{1}{x^2 + k^2}\) sur \(\mathbb R\) est
    <div class="formula" data-nom="Primitive de 1/(x² + k²)">$$x \longmapsto \frac1k\arctan\frac xk .$$</div>
    En effet, \(\frac{1}{x^2 + k^2} = \frac{1}{k^2}\cdot\frac{1}{1 + (x/k)^2}\), forme \(f(ax)\) avec \(a = \frac1k\) (§4).
  </div>

  <div class="prop-box">
    <strong>Les trois cas.</strong> Soit \(T(x) = ax^2 + bx + c\), \(a \neq 0\), de discriminant \(\Delta\).
    <ul>
      <li>\(\Delta \gt 0\) : \(T\) a deux racines réelles \(x_1 \neq x_2\) et \(\dfrac{1}{T(x)} = \dfrac{1}{a(x_1 - x_2)}\left(\dfrac{1}{x - x_1} - \dfrac{1}{x - x_2}\right)\). Sur tout intervalle ne contenant ni \(x_1\) ni \(x_2\), une primitive est \(\dfrac{1}{a(x_1 - x_2)}\ln\left|\dfrac{x - x_1}{x - x_2}\right|\).</li>
      <li>\(\Delta = 0\) : \(T(x) = a(x - x_0)^2\) et, sur \(]-\infty, x_0[\) ou sur \(]x_0, +\infty[\), une primitive est \(-\dfrac{1}{a(x - x_0)}\).</li>
      <li>\(\Delta \lt 0\) : forme canonique \(T(x) = a\left[\left(x + \frac{b}{2a}\right)^2 + k^2\right]\) avec \(k^2 = \frac{-\Delta}{4a^2}\), et sur \(\mathbb R\) :</li>
    </ul>
    <div class="formula" data-nom="Primitive de 1/(ax² + bx + c), Δ négatif">$$\int^x\frac{\mathrm{d}t}{at^2 + bt + c} = \frac{2}{\sqrt{-\Delta}}\arctan\frac{2ax + b}{\sqrt{-\Delta}} + C .$$</div>
  </div>
  <p>Plutôt que d'apprendre ces formules, on refait le raisonnement : <strong>factoriser</strong> si \(\Delta \ge 0\), <strong>mettre sous forme canonique</strong> si \(\Delta \lt 0\), puis se ramener à \(\frac{1}{u^2 + k^2}\). Pour un numérateur affine, \(\frac{px + q}{ax^2 + bx + c}\), on fait d'abord apparaître la dérivée du dénominateur : \(px + q = \frac{p}{2a}(2ax + b) + \left(q - \frac{pb}{2a}\right)\). Le premier morceau donne un logarithme (forme \(\frac{u'}{u}\)), le second un des trois cas ci-dessus.</p>

  <div class="method-box">
    <strong>Exemple — un trinôme de chaque sorte</strong>
    <ol>
      <li>\(\Delta \gt 0\) : \(x^2 - 4x + 3 = (x - 1)(x - 3)\) et \(\dfrac{1}{(x - 1)(x - 3)} = \dfrac12\left(\dfrac{1}{x - 3} - \dfrac{1}{x - 1}\right)\). Sur \(]3, +\infty[\), une primitive est \(\dfrac12\ln\dfrac{x - 3}{x - 1}\).</li>
      <li>\(\Delta = 0\) : \(4x^2 + 4x + 1 = (2x + 1)^2\) ; sur \(]-\frac12, +\infty[\), une primitive de \(\frac{1}{(2x + 1)^2}\) est \(-\dfrac{1}{2(2x + 1)}\).</li>
      <li>\(\Delta \lt 0\) : \(x^2 + 4x + 8 = (x + 2)^2 + 4\) ; une primitive est \(\dfrac12\arctan\dfrac{x + 2}{2}\), et \(\displaystyle\int_{-2}^{0}\frac{\mathrm{d}x}{x^2 + 4x + 8} = \frac12\left(\arctan 1 - \arctan 0\right) = \frac\pi8\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — un numérateur affine</strong>
    <ol>
      <li>\(f(x) = \dfrac{x + 3}{x^2 + 2x + 5}\). La dérivée du dénominateur est \(2x + 2\), et \(x + 3 = \frac12(2x + 2) + 2\).</li>
      <li>\(f(x) = \dfrac12\cdot\dfrac{2x + 2}{x^2 + 2x + 5} + \dfrac{2}{(x + 1)^2 + 4}\).</li>
      <li>Une primitive est \(F(x) = \dfrac12\ln(x^2 + 2x + 5) + \arctan\dfrac{x + 1}{2}\) (le trinôme est strictement positif : pas de valeur absolue).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§8 · FRACTIONS RATIONNELLES</div>
  <h2>Décomposer en éléments simples, puis primitiver</h2>
  <div class="intro">Une fraction rationnelle \(\frac{P(x)}{Q(x)}\) se primitive en la décomposant en éléments simples (chapitre « Polynômes », §11) : une partie polynomiale et des termes \(\frac{\lambda}{x - a}\), éventuellement \(\frac{\mu}{(x - a)^2}\) et \(\frac{\beta x + \gamma}{x^2 + px + q}\). Chacun se primitive par les §3, §4 et §7. Le programme se limite aux pôles simples ; dans les autres cas, l'énoncé fournit la forme de la décomposition.</div>

  <div class="method-box">
    <strong>Méthode — primitiver \(P/Q\)</strong>
    <ol>
      <li>Si \(\deg P \ge \deg Q\), <strong>division euclidienne</strong> : \(\frac PQ = E + \frac RQ\) avec \(\deg R \lt \deg Q\) ; la partie entière \(E\) est un polynôme.</li>
      <li><strong>Factoriser</strong> \(Q\) sur \(\mathbb R\).</li>
      <li>Pôles simples \(a_k\) : \(\frac RQ = \sum_k \frac{\lambda_k}{x - a_k}\), avec \(\lambda_k = \frac{P(a_k)}{Q'(a_k)}\) (ou la valeur en \(a_k\) de \((x - a_k)\frac{P}{Q}\) simplifiée, « méthode du cache »).</li>
      <li>Racine multiple ou facteur \(x^2 + px + q\) sans racine réelle : partir de la forme <strong>fournie</strong> et identifier les coefficients (valeurs particulières, limites, coefficients dominants).</li>
      <li>Primitiver terme à terme : \(\frac{\lambda}{x - a} \to \lambda\ln|x - a|\), \(\frac{\mu}{(x - a)^2} \to -\frac{\mu}{x - a}\), \(\frac{\beta x + \gamma}{x^2 + px + q} \to\) §7, sur un intervalle qui ne contient aucun pôle.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — trois pôles simples</strong>
    <ol>
      <li>\(f(x) = \dfrac{2x^2 + 1}{x^3 - x}\), avec \(x^3 - x = x(x - 1)(x + 1)\) et \(Q'(x) = 3x^2 - 1\) ; ici \(\deg P \lt \deg Q\).</li>
      <li>Coefficients : en 0, \(\frac{P(0)}{Q'(0)} = \frac{1}{-1} = -1\) ; en 1, \(\frac{3}{2}\) ; en \(-1\), \(\frac{3}{2}\). Donc \(f(x) = -\dfrac1x + \dfrac{3/2}{x - 1} + \dfrac{3/2}{x + 1}\).</li>
      <li>Contrôle en réduisant au même dénominateur : \(-(x^2 - 1) + \frac32x(x + 1) + \frac32x(x - 1) = 2x^2 + 1\).</li>
      <li>Sur \(]1, +\infty[\), une primitive est \(-\ln x + \frac32\ln(x - 1) + \frac32\ln(x + 1) = -\ln x + \frac32\ln(x^2 - 1)\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — partie entière, et forme fournie</strong>
    <ol>
      <li>\(\dfrac{x^3 + 2x}{x^2 - 1}\) : la division donne \(x^3 + 2x = x(x^2 - 1) + 3x\), puis \(\dfrac{3x}{(x - 1)(x + 1)} = \dfrac{3/2}{x - 1} + \dfrac{3/2}{x + 1}\). Sur \(]1, +\infty[\), une primitive est \(\frac{x^2}{2} + \frac32\ln(x^2 - 1)\).</li>
      <li>\(g(x) = \dfrac{1}{x(x^2 + 1)}\), forme fournie \(\dfrac ax + \dfrac{bx + c}{x^2 + 1}\). En multipliant par \(x\) et en faisant \(x = 0\) : \(a = 1\). Puis \(1 = (x^2 + 1) + (bx + c)\,x\) impose \(b = -1\), \(c = 0\).</li>
      <li>Sur \(]0, +\infty[\), une primitive de \(g\) est \(\ln x - \frac12\ln(x^2 + 1)\), et \(\displaystyle\int_1^2 g(x)\,\mathrm{d}x = \frac12\ln\frac85 \approx 0{,}235\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : décomposer \(\frac PQ\) sans avoir fait la division euclidienne alors que \(\deg P \ge \deg Q\) (la décomposition trouvée est alors fausse : contrôler en réduisant au même dénominateur) ; oublier les valeurs absolues dans les logarithmes, ou primitiver sur un intervalle qui contient un pôle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · INTÉGRATION PAR PARTIES</div>
  <h2>Primitiver un produit</h2>
  <div class="intro">Pour un produit de deux fonctions de natures différentes (polynôme et exponentielle, polynôme et sinus), aucune forme du §4 ne s'applique. L'intégration par parties est la dérivée d'un produit lue à l'envers : elle transfère la dérivée d'un facteur sur l'autre. Elle donne aussi les primitives de \(\ln\) et \(\arctan\).</div>

  <div class="prop-box">
    <strong>Intégration par parties.</strong> Si \(u\) et \(v\) sont de classe \(\mathcal C^1\) sur l'intervalle \(I\) :
    <div class="formula" data-nom="Intégration par parties (primitives)">$$\int^x u'(t)\,v(t)\,\mathrm{d}t = u(x)\,v(x) - \int^x u(t)\,v'(t)\,\mathrm{d}t ,$$</div>
    et, pour \(a\), \(b\) dans \(I\), \(\displaystyle\int_a^b u'v = \Big[uv\Big]_a^b - \int_a^b uv'\). Démonstration : \(uv\) est une primitive de \((uv)' = u'v + uv'\). Dans les calculs pratiques, on ne demande pas de rappeler les hypothèses de régularité.
  </div>
  <p><strong>Le choix.</strong> On primitive \(u'\) et on dérive \(v\) : on prend pour \(v\) le facteur que la dérivation <strong>simplifie</strong> (polynôme, \(\ln\), \(\arctan\)) et pour \(u'\) celui qu'on sait <strong>primitiver</strong> (exponentielle, sinus, cosinus). Pour \(\ln x\) ou \(\arctan x\) seuls, on prend \(u' = 1\), \(u(x) = x\). Si la nouvelle intégrale est plus compliquée que l'ancienne, on a inversé les rôles.</p>

  <div class="method-box">
    <strong>Exemple — quatre primitives par parties</strong>
    <ol>
      <li>\(\ln x\) sur \(]0, +\infty[\) : \(u' = 1\), \(v = \ln x\), \(u = x\), \(v' = \frac1x\). \(\int^x \ln t\,\mathrm{d}t = x\ln x - \int^x 1\,\mathrm{d}t = x\ln x - x + c\).</li>
      <li>\(\arctan x\) : \(u' = 1\), \(v = \arctan x\). \(\int^x \arctan t\,\mathrm{d}t = x\arctan x - \int^x \frac{t\,\mathrm{d}t}{1 + t^2} = x\arctan x - \frac12\ln(1 + x^2) + c\).</li>
      <li>\(x\,\mathrm{e}^{-2x}\) : \(v = x\), \(u = -\frac12\mathrm{e}^{-2x}\). On obtient \(-\frac x2\mathrm{e}^{-2x} + \frac12\int^x\mathrm{e}^{-2t}\,\mathrm{d}t = -\dfrac{(2x + 1)\,\mathrm{e}^{-2x}}{4} + c\).</li>
      <li>\(x^2\sin x\) : deux intégrations par parties, une par degré du polynôme. Avec \(v = x^2\), \(u = -\cos x\) : \(-x^2\cos x + 2\int^x t\cos t\,\mathrm{d}t\), et \(\int^x t\cos t\,\mathrm{d}t = x\sin x + \cos x\) (§5). Une primitive est \(-x^2\cos x + 2x\sin x + 2\cos x\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — une intégrale, et le retour à l'intégrale de départ</strong>
    <ol>
      <li>\(\displaystyle\int_1^{\mathrm e} x\ln x\,\mathrm{d}x\), avec \(v = \ln x\), \(u = \frac{x^2}{2}\) : \(\Big[\frac{x^2}{2}\ln x\Big]_1^{\mathrm e} - \displaystyle\int_1^{\mathrm e}\frac x2\,\mathrm{d}x = \frac{\mathrm e^2}{2} - \frac{\mathrm e^2 - 1}{4} = \frac{\mathrm e^2 + 1}{4} \approx 2{,}097\).</li>
      <li>\(J(x) = \int^x \mathrm{e}^t\sin t\,\mathrm{d}t\). Deux intégrations par parties (\(u' = \mathrm{e}^t\) les deux fois) donnent \(J = \mathrm{e}^x\sin x - \big(\mathrm{e}^x\cos x + J\big)\), d'où \(J(x) = \frac{\mathrm{e}^x(\sin x - \cos x)}{2} + c\). On retrouve la formule du §5 avec \(a = b = 1\), obtenue plus vite en passant par \(\mathrm{e}^{(1+i)x}\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : pour \(x\,\mathrm{e}^x\), prendre \(v = \mathrm{e}^x\) et \(u' = x\) donne \(\frac{x^2}{2}\mathrm{e}^x - \int\frac{x^2}{2}\mathrm{e}^x\), plus compliqué : les rôles sont inversés. Autre erreur : oublier le signe moins devant la nouvelle intégrale, ou le crochet aux deux bornes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · CHANGEMENT DE VARIABLE</div>
  <h2>Remplacer une expression par une nouvelle variable</h2>
  <div class="intro">Le changement de variable est la dérivation d'une fonction composée, lue à l'envers : c'est le §4 rendu systématique. Il sert à se débarrasser d'une exponentielle, d'un radical, ou à reconnaître une forme cachée. Pour une primitive, il ne faut pas oublier de revenir à la variable de départ.</div>

  <div class="prop-box">
    <strong>Changement de variable.</strong> Soit \(\varphi\) de classe \(\mathcal C^1\) sur un intervalle \([\alpha, \beta]\) et \(f\) continue sur un intervalle contenant \(\varphi([\alpha, \beta])\). Alors
    <div class="formula" data-nom="Changement de variable">$$\int_\alpha^\beta f\big(\varphi(s)\big)\,\varphi'(s)\,\mathrm{d}s = \int_{\varphi(\alpha)}^{\varphi(\beta)} f(x)\,\mathrm{d}x .$$</div>
    Démonstration : si \(F\) est une primitive de \(f\), \(F \circ \varphi\) est une primitive de \((f \circ \varphi)\,\varphi'\) ; les deux membres valent \(F(\varphi(\beta)) - F(\varphi(\alpha))\).
  </div>
  <p><strong>En pratique.</strong> On pose \(u = \psi(x)\) (ou \(x = \varphi(s)\)), on remplace \(\mathrm{d}u\) par \(\psi'(x)\,\mathrm{d}x\), on exprime tout l'intégrande avec la nouvelle variable, on primitive, puis on <strong>revient à \(x\)</strong>. Pour une intégrale, on change les bornes au lieu de revenir à \(x\). Le passage « \(\mathrm{d}u = \psi'(x)\,\mathrm{d}x\) » est une écriture commode, justifiée par la formule ci-dessus ; pour revenir à \(x\), la fonction \(\psi\) doit être une bijection de l'intervalle de travail.</p>

  <div class="method-box">
    <strong>Exemple — trois primitives par changement de variable</strong>
    <ol>
      <li>\(\dfrac{1}{\mathrm{e}^x + 1}\) : \(u = \mathrm{e}^x\), \(\mathrm{d}u = u\,\mathrm{d}x\). Il vient \(\int\frac{\mathrm{d}u}{u(u + 1)} = \int\left(\frac1u - \frac{1}{u + 1}\right)\mathrm{d}u = \ln\frac{u}{u + 1}\), d'où la primitive \(x - \ln(1 + \mathrm{e}^x)\). Contrôle : sa dérivée vaut \(1 - \frac{\mathrm{e}^x}{1 + \mathrm{e}^x} = \frac{1}{1 + \mathrm{e}^x}\).</li>
      <li>\(\dfrac{\sqrt x}{1 + x}\) sur \(]0, +\infty[\) : \(u = \sqrt x\), \(x = u^2\), \(\mathrm{d}x = 2u\,\mathrm{d}u\). Il vient \(\int\frac{2u^2}{1 + u^2}\,\mathrm{d}u = \int\left(2 - \frac{2}{1 + u^2}\right)\mathrm{d}u\), d'où \(2\sqrt x - 2\arctan\sqrt x\).</li>
      <li>\(\dfrac{1}{x\sqrt{x - 1}}\) sur \(]1, +\infty[\) : \(u = \sqrt{x - 1}\), \(x = u^2 + 1\), \(\mathrm{d}x = 2u\,\mathrm{d}u\) ; il reste \(\int\frac{2\,\mathrm{d}u}{1 + u^2}\), d'où \(2\arctan\sqrt{x - 1}\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — changer les bornes, et un radical</strong>
    <ol>
      <li>\(\displaystyle\int_0^{\ln 3}\frac{\mathrm{e}^x\,\mathrm{d}x}{1 + \mathrm{e}^{2x}}\) : avec \(u = \mathrm{e}^x\), \(\mathrm{d}u = \mathrm{e}^x\,\mathrm{d}x\), les bornes deviennent \(1\) et \(3\) : \(\displaystyle\int_1^3\frac{\mathrm{d}u}{1 + u^2} = \arctan 3 - \frac\pi4 \approx 0{,}464\).</li>
      <li>\(\sqrt{1 - x^2}\) sur \([-1, 1]\) : \(x = \sin s\) avec \(s \in [-\frac\pi2, \frac\pi2]\), où \(\cos s \ge 0\) et donc \(\sqrt{1 - \sin^2 s} = \cos s\). On primitive \(\cos^2 s\) (§6) : \(\frac s2 + \frac{\sin 2s}{4} = \frac{s + \sin s\cos s}{2}\). Retour à \(x\) (\(s = \arcsin x\), \(\cos s = \sqrt{1 - x^2}\)) :
      <div class="formula">$$\int^x\sqrt{1 - t^2}\,\mathrm{d}t = \frac{\arcsin x + x\sqrt{1 - x^2}}{2} + c .$$</div>
      Entre 0 et 1, on trouve \(\frac\pi4\) : l'aire d'un quart de disque de rayon 1.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : remplacer \(x\) par \(\varphi(s)\) sans remplacer \(\mathrm{d}x\) par \(\varphi'(s)\,\mathrm{d}s\) ; changer de variable dans une intégrale sans changer les bornes ; écrire \(\sqrt{\cos^2 s} = \cos s\) sans vérifier le signe (c'est \(|\cos s|\)) ; oublier de revenir à \(x\) à la fin d'un calcul de primitive.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Prolongements, à titre culturel</h2>
  <div class="intro">Ces techniques ne sont pas exigibles en PTSI. Un énoncé qui en a besoin donne toujours le changement de variable ou la forme à utiliser.</div>
  <ul>
    <li><strong>Le changement de variable \(t = \tan\frac x2\)</strong> transforme une fraction rationnelle en \(\cos x\) et \(\sin x\) en une fraction rationnelle en \(t\), grâce à \(\cos x = \frac{1 - t^2}{1 + t^2}\), \(\sin x = \frac{2t}{1 + t^2}\) et \(\mathrm{d}x = \frac{2\,\mathrm{d}t}{1 + t^2}\). Exemple : sur \(]-\pi, \pi[\), une primitive de \(\frac{1}{2 + \cos x}\) est \(\frac{2}{\sqrt3}\arctan\left(\frac{1}{\sqrt3}\tan\frac x2\right)\), et \(\int_{-\pi}^{\pi}\frac{\mathrm{d}x}{2 + \cos x} = \frac{2\pi}{\sqrt3}\).</li>
    <li><strong>Radicaux \(\sqrt{x^2 + 1}\), \(\sqrt{x^2 - 1}\)</strong> : une primitive de \(\frac{1}{\sqrt{x^2 + 1}}\) est \(\ln\big(x + \sqrt{x^2 + 1}\big)\), une primitive de \(\frac{1}{\sqrt{x^2 - 1}}\) sur \(]1, +\infty[\) est \(\ln\big(x + \sqrt{x^2 - 1}\big)\) ; ce sont les fonctions hyperboliques réciproques (chapitre « Fonctions réelles — généralités », pour aller plus loin). On les vérifie en dérivant.</li>
    <li><strong>Pôles multiples, facteurs du second degré répétés</strong> : toute fraction rationnelle réelle se décompose en éléments simples (théorème général, démontré en algèbre), donc se primitive avec des polynômes, des logarithmes et des arctangentes. Le programme se limite aux pôles simples, la forme étant fournie dans les autres cas.</li>
    <li><strong>Primitives non élémentaires</strong> : \(\mathrm{e}^{-x^2}\), \(\frac{\sin x}{x}\), \(\frac{1}{\ln x}\) ont des primitives (elles sont continues), mais un théorème de Liouville montre qu'aucune ne s'écrit avec les fonctions usuelles. On les étudie comme intégrales fonctions de leur borne (chapitre « Intégrales », §7) et on les calcule numériquement (§6 du même chapitre).</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="prim-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · PRIMITIVES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Devant une fonction à primitiver, l'ordre des questions compte : on cherche d'abord une forme connue, on ne sort l'intégration par parties ou le changement de variable qu'ensuite. Chaque méthode donne ses étapes, un exemple éclair vérifié et le piège associé. Les notations et les numéros de paragraphes sont ceux du cours (§1 à §10).</div>

  <div class="method-box">
    <strong>Méthode 1 — Choisir la technique</strong>
    <ol>
      <li><span class="step">Étape 1.</span> <strong>Intervalle</strong> : sur quel intervalle travaille-t-on ? Une primitive n'a de sens que sur un intervalle où la fonction est définie (§1).</li>
      <li><span class="step">Étape 2.</span> <strong>Tableau et linéarité</strong> : la fonction est-elle une somme de fonctions usuelles, éventuellement après avoir développé ou simplifié (§3) ?</li>
      <li><span class="step">Étape 3.</span> <strong>Dérivée d'une composée</strong> : repérer une expression \(u\) dont la dérivée \(u'\) apparaît en facteur, à une constante près (§4, méthode 2).</li>
      <li><span class="step">Étape 4.</span> <strong>Exponentielle × cosinus ou sinus</strong> : passer en complexes (méthode 3) ; <strong>puissances de \(\cos\), \(\sin\)</strong> : linéariser (méthode 4).</li>
      <li><span class="step">Étape 5.</span> <strong>Fraction rationnelle</strong> : trinôme au dénominateur (méthodes 5 et 6), sinon division euclidienne et éléments simples (méthode 7).</li>
      <li><span class="step">Étape 6.</span> <strong>Produit de deux fonctions de natures différentes</strong>, ou \(\ln\), \(\arctan\) seuls : intégration par parties (méthode 8). <strong>Exponentielle ou radical gênant</strong> : changement de variable (méthode 9).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = \dfrac{x}{x^2 + 1} + x\,\mathrm{e}^x\). Le premier terme est \(\frac12\frac{u'}{u}\) (étape 3), le second un produit polynôme × exponentielle (étape 6). Une primitive est \(\frac12\ln(x^2 + 1) + (x - 1)\,\mathrm{e}^x\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Reconnaître une forme \(u'\,g(u)\) et ajuster la constante</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Choisir un candidat \(u\) : ce qui est sous une racine, dans une exponentielle, dans un logarithme, au dénominateur, ou élevé à une puissance.</li>
      <li><span class="step">Étape 2.</span> Calculer \(u'\) et vérifier que le reste de l'expression est \(k\,u'\), avec \(k\) <strong>constant</strong>.</li>
      <li><span class="step">Étape 3.</span> Écrire \(f = k\,u'\,g(u)\) et lire la primitive dans le tableau du §4 : \(k\,G(u)\).</li>
      <li><span class="step">Étape 4.</span> Contrôler en dérivant (une seconde suffit).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sin x\,\mathrm{e}^{\cos x} = -u'\,\mathrm{e}^u\) avec \(u = \cos x\) : primitive \(-\mathrm{e}^{\cos x}\). \(\dfrac{x^2}{1 + x^3}\) sur \(]-1, +\infty[\) : \(u = 1 + x^3\), \(u' = 3x^2\), donc \(f = \frac13\frac{u'}{u}\) et une primitive est \(\frac13\ln(1 + x^3)\). \(\dfrac{1}{(3x - 2)^2}\) sur \(]\frac23, +\infty[\) : forme \(f(ax + b)\), primitive \(-\dfrac{1}{3(3x - 2)}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : on ne peut ajuster qu'un facteur <strong>constant</strong>. Écrire \(\mathrm{e}^{x^2} = \frac{1}{2x}\cdot 2x\,\mathrm{e}^{x^2}\) puis « primitiver » en \(\frac{1}{2x}\mathrm{e}^{x^2}\) est faux : dériver le résultat le montre aussitôt.</div>

  <div class="method-box">
    <strong>Méthode 3 — Passer en complexes pour \(\mathrm{e}^{ax}\cos(bx)\), \(\mathrm{e}^{ax}\sin(bx)\)</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire \(\mathrm{e}^{ax}\cos(bx) = \operatorname{Re}\big(\mathrm{e}^{(a+ib)x}\big)\) (ou \(\operatorname{Im}\) pour le sinus).</li>
      <li><span class="step">Étape 2.</span> Primitiver \(\mathrm{e}^{\lambda x}\) en \(\frac{\mathrm{e}^{\lambda x}}{\lambda}\), avec \(\lambda = a + ib \neq 0\).</li>
      <li><span class="step">Étape 3.</span> Mettre \(\frac{1}{a + ib}\) sous forme algébrique, \(\frac{a - ib}{a^2 + b^2}\), développer, puis seulement prendre la partie réelle ou imaginaire.</li>
      <li><span class="step">Étape 4.</span> Même idée pour \(x\cos x\), \(x\sin x\) : chercher une primitive de \(x\,\mathrm{e}^{ix}\) sous la forme \((\alpha + \beta x)\,\mathrm{e}^{ix}\) (§5).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\mathrm{e}^{-x}\cos x = \operatorname{Re}\big(\mathrm{e}^{(-1+i)x}\big)\) et \(\frac{1}{-1 + i} = \frac{-1 - i}{2}\). La partie réelle de \(\frac{-1 - i}{2}\,\mathrm{e}^{-x}(\cos x + i\sin x)\) donne la primitive \(\dfrac{\mathrm{e}^{-x}(\sin x - \cos x)}{2}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Primitiver \(\sin^m x\cos^n x\) et les produits</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Un exposant impair (disons \(n\)) : isoler un facteur \(\cos x\), écrire \(\cos^{n-1} x = (1 - \sin^2 x)^{(n-1)/2}\) ; on obtient un polynôme en \(u = \sin x\) multiplié par \(u'\).</li>
      <li><span class="step">Étape 2.</span> Deux exposants pairs : linéariser, par \(\cos^2 x = \frac{1 + \cos 2x}{2}\), \(\sin^2 x = \frac{1 - \cos 2x}{2}\), ou par les formules d'Euler pour les puissances élevées.</li>
      <li><span class="step">Étape 3.</span> Produit \(\cos(px)\cos(qx)\), \(\sin(px)\cos(qx)\)… : transformer en somme (§6).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\cos^3 x = \cos x\,(1 - \sin^2 x)\) a pour primitive \(\sin x - \frac{\sin^3 x}{3}\). \(\sin^2 x\cos^2 x = \frac{\sin^2(2x)}{4} = \frac{1 - \cos(4x)}{8}\) a pour primitive \(\frac x8 - \frac{\sin(4x)}{32}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Primitiver \(\dfrac{1}{ax^2 + bx + c}\)</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Calculer \(\Delta = b^2 - 4ac\).</li>
      <li><span class="step">Étape 2.</span> \(\Delta \gt 0\) : factoriser \(a(x - x_1)(x - x_2)\), décomposer en \(\frac{\alpha}{x - x_1} + \frac{\beta}{x - x_2}\), primitiver en logarithmes.</li>
      <li><span class="step">Étape 3.</span> \(\Delta = 0\) : \(\frac{1}{a(x - x_0)^2}\) a pour primitive \(-\frac{1}{a(x - x_0)}\).</li>
      <li><span class="step">Étape 4.</span> \(\Delta \lt 0\) : forme canonique, mettre \(a\) en facteur, se ramener à \(\frac{1}{u^2 + k^2}\), de primitive \(\frac1k\arctan\frac uk\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x^2 - 2x + 2 = (x - 1)^2 + 1\), primitive \(\arctan(x - 1)\). \(2x^2 + 3x + 1 = (2x + 1)(x + 1)\) et \(\frac{1}{(2x + 1)(x + 1)} = \frac{2}{2x + 1} - \frac{1}{x + 1}\) : sur \(]-\frac12, +\infty[\), primitive \(\ln(2x + 1) - \ln(x + 1)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Primitiver \(\dfrac{px + q}{ax^2 + bx + c}\)</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Faire apparaître la dérivée \(2ax + b\) du dénominateur : \(px + q = \frac{p}{2a}(2ax + b) + r\), avec \(r = q - \frac{pb}{2a}\).</li>
      <li><span class="step">Étape 2.</span> Le premier morceau est \(\frac{p}{2a}\frac{u'}{u}\) : il donne \(\frac{p}{2a}\ln|ax^2 + bx + c|\).</li>
      <li><span class="step">Étape 3.</span> Le second, \(\frac{r}{ax^2 + bx + c}\), relève de la méthode 5.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(2x + 1 = (2x + 4) - 3\), donc \(\dfrac{2x + 1}{x^2 + 4x + 5} = \dfrac{2x + 4}{x^2 + 4x + 5} - \dfrac{3}{(x + 2)^2 + 1}\) a pour primitive \(\ln(x^2 + 4x + 5) - 3\arctan(x + 2)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Primitiver une fraction rationnelle</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Si \(\deg P \ge \deg Q\) : division euclidienne de \(P\) par \(Q\).</li>
      <li><span class="step">Étape 2.</span> Factoriser \(Q\) ; pôles simples : coefficients \(\frac{P(a)}{Q'(a)}\) (ou méthode du cache) ; autres cas : forme fournie, identification.</li>
      <li><span class="step">Étape 3.</span> Contrôler la décomposition (réduction au même dénominateur, ou valeur en un point).</li>
      <li><span class="step">Étape 4.</span> Primitiver terme à terme, avec des \(\ln|x - a|\), sur un intervalle sans pôle.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{x^2 + 1}{x^2 - 1} = 1 + \dfrac{2}{x^2 - 1} = 1 + \dfrac{1}{x - 1} - \dfrac{1}{x + 1}\). Sur \(]1, +\infty[\), une primitive est \(x + \ln\dfrac{x - 1}{x + 1}\). Contrôle en \(x = 2\) : \(1 + 1 - \frac13 = \frac53 = \frac{4 + 1}{4 - 1}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Intégrer par parties pour trouver une primitive</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire la fonction comme un produit \(u'\,v\) : \(v\) est le facteur que la dérivation simplifie (polynôme, \(\ln\), \(\arctan\)), \(u'\) celui qu'on sait primitiver.</li>
      <li><span class="step">Étape 2.</span> Pour \(\ln\) ou \(\arctan\) seuls, prendre \(u' = 1\).</li>
      <li><span class="step">Étape 3.</span> Appliquer \(\int^x u'v = uv - \int^x uv'\) ; recommencer autant de fois que le degré du polynôme.</li>
      <li><span class="step">Étape 4.</span> Si l'on retombe sur l'intégrale de départ (exponentielle × trigonométrie), résoudre l'équation obtenue, ou mieux, passer en complexes (méthode 3).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x^2\mathrm{e}^x\) : deux intégrations par parties donnent \((x^2 - 2x + 2)\,\mathrm{e}^x\). \((\ln x)^2\) sur \(]0, +\infty[\), avec \(u' = 1\), \(v = (\ln x)^2\) : \(x(\ln x)^2 - 2\int^x \ln t\,\mathrm{d}t\), d'où \(x(\ln x)^2 - 2x\ln x + 2x\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : si la nouvelle intégrale est plus compliquée que l'ancienne (degré du polynôme qui monte), les rôles de \(u'\) et \(v\) sont inversés.</div>

  <div class="method-box">
    <strong>Méthode 9 — Changer de variable pour trouver une primitive</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Choisir la nouvelle variable : \(u = \mathrm{e}^x\) pour une fraction en \(\mathrm{e}^x\), \(u = \sqrt{x}\) ou \(u = \sqrt{ax + b}\) pour un radical, \(x = \sin s\) pour \(\sqrt{1 - x^2}\).</li>
      <li><span class="step">Étape 2.</span> Exprimer \(\mathrm{d}x\) avec \(\mathrm{d}u\) (par exemple \(x = u^2\), \(\mathrm{d}x = 2u\,\mathrm{d}u\)) et <strong>tout</strong> l'intégrande avec \(u\).</li>
      <li><span class="step">Étape 3.</span> Primitiver en \(u\) (souvent une fraction rationnelle).</li>
      <li><span class="step">Étape 4.</span> Revenir à \(x\) ; pour une intégrale, changer plutôt les bornes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{1}{\sqrt x\,(1 + x)}\) sur \(]0, +\infty[\) : \(u = \sqrt x\), \(\mathrm{d}x = 2u\,\mathrm{d}u\), il reste \(\int\frac{2\,\mathrm{d}u}{1 + u^2}\), d'où \(2\arctan\sqrt x\). \(\dfrac{\mathrm{e}^{2x}}{\mathrm{e}^x + 1}\) : \(u = \mathrm{e}^x\), \(\mathrm{d}x = \frac{\mathrm{d}u}{u}\), il reste \(\int\frac{u\,\mathrm{d}u}{u + 1} = u - \ln(u + 1)\), d'où \(\mathrm{e}^x - \ln(1 + \mathrm{e}^x)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Calculer une intégrale et contrôler le résultat</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Vérifier que la fonction est continue sur tout le segment d'intégration, et que la primitive choisie est valable sur tout ce segment (§2).</li>
      <li><span class="step">Étape 2.</span> Calculer \(\big[F\big]_a^b = F(b) - F(a)\).</li>
      <li><span class="step">Étape 3.</span> Contrôler : dériver \(F\) ; vérifier le <strong>signe</strong> (intégrande positive et \(a \lt b\) : résultat positif) et l'<strong>ordre de grandeur</strong> (encadrer par \((b - a)\min f\) et \((b - a)\max f\)).</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <div class="formula">$$\int_0^{\pi/4}\tan x\,\mathrm{d}x = \Big[-\ln\cos x\Big]_0^{\pi/4} = -\ln\frac{\sqrt2}{2} = \frac{\ln 2}{2} \approx 0{,}347 .$$</div>
    <p>Contrôle : sur \([0, \frac\pi4]\), \(0 \le \tan x \le 1\), donc le résultat est entre 0 et \(\frac\pi4 \approx 0{,}785\) ; la somme des rectangles à gauche avec 4 pas donne \(0{,}252\), une valeur par défaut puisque \(\tan\) croît.</p>
  </div>

  <div class="notice"><strong>Pièges récapitulés</strong> : oublier l'intervalle (et les constantes indépendantes sur \(\mathbb R^*\)) ; primitiver un produit en multipliant les primitives ; écrire \(\ln u\) au lieu de \(\ln|u|\) sans savoir que \(u \gt 0\) ; oublier de mettre en facteur le coefficient \(a\) d'un trinôme ; prendre la partie réelle d'un quotient trop tôt ; ne pas revenir à \(x\) après un changement de variable ; ne pas contrôler le résultat en dérivant.</div>
</div>
</template>
