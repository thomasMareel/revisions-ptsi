<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Primitives immédiates</h3>
  <div class="statement">Donner une primitive de chacune des fonctions suivantes, sur un intervalle où elle est définie.</div>
  <div class="q"><strong>Q1.</strong> \(f(x) = 3x^2 - 2x + 5\)</div>
  <div class="q"><strong>Q2.</strong> \(f(x) = \sin(3x)\)</div>
  <div class="q"><strong>Q3.</strong> \(f(x) = \mathrm{e}^{-2x+1}\)</div>
  <div class="q"><strong>Q4.</strong> \(f(x) = \dfrac{1}{(2x+3)^2}\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Par linéarité : \(F(x) = x^3 - x^2 + 5x + c\).</p>
    <p><strong>Q2.</strong> Forme \(f(ax + b)\) avec \(a = 3\) : \(F(x) = -\frac{1}{3}\cos(3x) + c\).</p>
    <p><strong>Q3.</strong> Forme \(f(ax + b)\) avec \(a = -2\) : \(F(x) = -\frac{1}{2}\mathrm{e}^{-2x+1} + c\).</p>
    <p><strong>Q4.</strong> \(f(x) = (2x+3)^{-2}\), forme \(\frac12u'u^{-2}\) avec \(u = 2x + 3\) : sur \(]-\frac32, +\infty[\) (ou \(]-\infty, -\frac32[\)), \(F(x) = \frac12\cdot\frac{(2x+3)^{-1}}{-1} = -\frac{1}{2(2x+3)} + c\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Formes composées</h3>
  <div class="statement">Reconnaître la forme et donner une primitive.</div>
  <div class="q"><strong>Q1.</strong> \(f(x) = x\,\mathrm{e}^{x^2}\)</div>
  <div class="q"><strong>Q2.</strong> \(f(x) = \dfrac{2x+1}{x^2 + x + 4}\)</div>
  <div class="q"><strong>Q3.</strong> \(f(x) = \dfrac{\ln x}{x}\) sur \(]0, +\infty[\)</div>
  <div class="q"><strong>Q4.</strong> \(f(x) = \dfrac{x}{\sqrt{1 - x^2}}\) sur \(]-1, 1[\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u = x^2\), \(u' = 2x\) : forme \(\frac{1}{2}u'\mathrm{e}^u\). Primitive : \(\frac{1}{2}\mathrm{e}^{x^2} + c\).</p>
    <p><strong>Q2.</strong> \(u = x^2 + x + 4\), \(u' = 2x + 1\) : forme \(\frac{u'}{u}\). Primitive : \(\ln(x^2+x+4) + c\), sans valeur absolue car le trinôme, de discriminant \(1 - 16 \lt 0\), est toujours positif.</p>
    <p><strong>Q3.</strong> \(u = \ln x\), \(u' = \frac1x\) : forme \(u'u\). Primitive : \(\dfrac{(\ln x)^2}{2} + c\).</p>
    <p><strong>Q4.</strong> \(u = 1 - x^2\), \(u' = -2x\) : \(f = -\frac{1}{2}\,\frac{u'}{\sqrt{u}}\). Primitive : \(-\frac{1}{2}\cdot 2\sqrt{1-x^2} + c = -\sqrt{1-x^2} + c\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Trigonométrie</h3>
  <div class="statement">Calculer des primitives.</div>
  <div class="q"><strong>Q1.</strong> \(f(x) = \cos^2 x\)</div>
  <div class="q"><strong>Q2.</strong> \(f(x) = \sin x \cos^4 x\)</div>
  <div class="q"><strong>Q3.</strong> \(f(x) = \tan x\) sur \(]-\pi/2, \pi/2[\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Linéarisation : \(\cos^2 x = \frac{1+\cos(2x)}{2}\). Primitive : \(\frac{x}{2} + \frac{\sin(2x)}{4} + c\).</p>
    <p><strong>Q2.</strong> Forme composée : \(u = \cos x\), \(u' = -\sin x\), donc \(f = -u'u^4\). Primitive : \(-\frac{\cos^5 x}{5} + c\).</p>
    <p><strong>Q3.</strong> \(\tan x = \frac{\sin x}{\cos x} = -\frac{u'}{u}\) avec \(u = \cos x\). Primitive : \(-\ln|\cos x| + c\). Sur l'intervalle donné, \(\cos x \gt 0\), donc \(-\ln(\cos x) + c\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ★</span>
  <h3>Fractions rationnelles et arctangente</h3>
  <div class="statement">Calculer des primitives.</div>
  <div class="q"><strong>Q1.</strong> \(f(x) = \dfrac{1}{x^2 - 5x + 6}\) sur \(]3, +\infty[\)</div>
  <div class="q"><strong>Q2.</strong> \(f(x) = \dfrac{1}{x^2 + 4x + 13}\)</div>
  <div class="q"><strong>Q3.</strong> \(f(x) = \dfrac{2x + 5}{x^2 + 4x + 13}\) (décomposer en \(\frac{u'}{u} + \frac{\alpha}{x^2+4x+13}\))</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(x^2 - 5x + 6 = (x-2)(x-3)\), et \(\frac{1}{(x-2)(x-3)} = \frac{1}{x-3} - \frac{1}{x-2}\). Sur \(]3, +\infty[\), \(x-2 \gt 0\) et \(x-3 \gt 0\) : primitive \(\ln(x-3) - \ln(x-2) + c = \ln\frac{x-3}{x-2} + c\).</p>
    <p><strong>Q2.</strong> \(x^2 + 4x + 13 = (x+2)^2 + 9\). Avec la formule \(\int\frac{\mathrm{d}u}{u^2 + k^2} = \frac1k\arctan\frac uk\) (\(u = x + 2\), \(k = 3\)) : primitive \(\frac{1}{3}\arctan\frac{x+2}{3} + c\).</p>
    <p><strong>Q3.</strong> \(2x + 5 = (2x + 4) + 1 = u' + 1\) avec \(u = x^2+4x+13\). Donc une primitive est</p>
    <div class="formula">$$\ln(x^2+4x+13) + \frac{1}{3}\arctan\frac{x+2}{3} + c .$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Primitives par parties itérées</h3>
  <div class="statement">Calculer les primitives suivantes (avec les notations du cours : on primitive \(u'\), on dérive \(v\)).</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle I(x) = \int^x t^2\,\mathrm{e}^t\,\mathrm{d}t\) (intégration par parties deux fois).</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle J(x) = \int^x \mathrm{e}^t\cos t\,\mathrm{d}t\), par deux intégrations par parties, puis en passant par les complexes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Première intégration par parties, \(v = t^2\), \(u' = \mathrm{e}^t\) : \(I(x) = x^2\mathrm{e}^x - 2\int^x t\,\mathrm{e}^t\,\mathrm{d}t\). Seconde, \(v = t\), \(u' = \mathrm{e}^t\) : \(\int^x t\,\mathrm{e}^t\,\mathrm{d}t = x\,\mathrm{e}^x - \mathrm{e}^x\). Donc \(I(x) = \mathrm{e}^x(x^2 - 2x + 2) + C\). Vérification :</p>
    <div class="formula">$$I'(x) = \mathrm{e}^x(x^2-2x+2) + \mathrm{e}^x(2x-2) = x^2\mathrm{e}^x .$$</div>
    <p><strong>Q2.</strong> Avec \(u' = \mathrm{e}^t\), \(v = \cos t\) : \(J = \mathrm{e}^x\cos x + \int^x \mathrm{e}^t\sin t\,\mathrm{d}t\). Puis, avec \(v = \sin t\) : \(\int^x \mathrm{e}^t\sin t\,\mathrm{d}t = \mathrm{e}^x\sin x - J\). Donc \(2J = \mathrm{e}^x(\cos x + \sin x)\) et \(J(x) = \dfrac{\mathrm{e}^x(\cos x + \sin x)}{2} + C\). En complexes : \(\mathrm{e}^x\cos x = \operatorname{Re}\big(\mathrm{e}^{(1+i)x}\big)\) et \(\frac{1}{1+i} = \frac{1-i}{2}\) ; la partie réelle de \(\frac{1-i}{2}\,\mathrm{e}^x(\cos x + i\sin x)\) est \(\frac{\mathrm{e}^x(\cos x + \sin x)}{2}\) : même résultat, en une ligne.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Intégrales de Wallis</h3>
  <div class="statement">On définit \(W_n = \displaystyle\int_0^{\pi/2}\sin^n x\,\mathrm{d}x\) pour \(n \in \mathbb{N}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(W_0\) et \(W_1\). Établir la relation \(W_n = \dfrac{n-1}{n}W_{n-2}\) pour \(n \ge 2\), par intégration par parties.</div>
  <div class="q"><strong>Q2.</strong> En déduire \(W_4\) et \(W_5\).</div>
  <div class="q"><strong>Q3.</strong> Montrer par récurrence sur \(p\) que \(W_{2p} = \dfrac{(2p)!}{4^p\,(p!)^2}\cdot\dfrac{\pi}{2}\) et \(W_{2p+1} = \dfrac{4^p\,(p!)^2}{(2p+1)!}\). Retrouver \(W_4\) et \(W_5\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que la suite \((n\,W_n\,W_{n-1})_{n \ge 1}\) est constante, et donner sa valeur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(W_0 = \frac\pi2\), \(W_1 = \big[-\cos x\big]_0^{\pi/2} = 1\). Pour \(n \ge 2\), avec \(v = \sin^{n-1}x\), \(u' = \sin x\), \(u = -\cos x\) :</p>
    <div class="formula">$$W_n = \Big[-\cos x\sin^{n-1}x\Big]_0^{\pi/2} + (n-1)\int_0^{\pi/2}\cos^2 x\,\sin^{n-2}x\,\mathrm{d}x .$$</div>
    <p>Le crochet est nul. Avec \(\cos^2 x = 1 - \sin^2 x\) : \(W_n = (n-1)(W_{n-2} - W_n)\), donc \(n\,W_n = (n-1)\,W_{n-2}\).</p>
    <p><strong>Q2.</strong> \(W_2 = \frac12 W_0 = \frac\pi4\), \(W_4 = \frac34 W_2 = \frac{3\pi}{16}\) ; \(W_3 = \frac23 W_1 = \frac23\), \(W_5 = \frac45 W_3 = \frac{8}{15}\).</p>
    <p><strong>Q3.</strong> Pour \(p = 0\), les formules donnent \(\frac\pi2\) et \(1\). Si elles sont vraies au rang \(p\), alors</p>
    <div class="formula">$$W_{2p+2} = \frac{2p+1}{2p+2}\,W_{2p} = \frac{(2p+1)(2p+2)}{(2p+2)^2}\cdot\frac{(2p)!}{4^p(p!)^2}\cdot\frac\pi2 = \frac{(2p+2)!}{4^{p+1}\big((p+1)!\big)^2}\cdot\frac\pi2 ,$$</div>
    <p>car \((2p+2)^2 = 4(p+1)^2\). De même :</p>
    <div class="formula">$$W_{2p+3} = \frac{2p+2}{2p+3}W_{2p+1} = \frac{(2p+2)^2}{(2p+2)(2p+3)}\cdot\frac{4^p(p!)^2}{(2p+1)!} = \frac{4^{p+1}\big((p+1)!\big)^2}{(2p+3)!} .$$</div>
    <p>Pour \(p = 2\) : \(W_4 = \frac{24}{16\times 4}\cdot\frac\pi2 = \frac{3\pi}{16}\) et \(W_5 = \frac{16\times4}{120} = \frac{8}{15}\).</p>
    <p><strong>Q4.</strong> Par Q1, \((n+1)\,W_{n+1}\,W_n = n\,W_{n-1}\,W_n\) : la suite est constante, égale à son premier terme \(1\cdot W_1 W_0 = \frac\pi2\). Ainsi \(n\,W_n\,W_{n-1} = \frac\pi2\) pour tout \(n \ge 1\) (par exemple \(5\cdot\frac{8}{15}\cdot\frac{3\pi}{16} = \frac\pi2\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Primitives à valeurs complexes</h3>
  <div class="statement">On travaille avec des fonctions de \(\mathbb R\) dans \(\mathbb C\).</div>
  <div class="q"><strong>Q1.</strong> Donner une primitive de \(x \mapsto \mathrm{e}^{(2-i)x}\), sous la forme \((\alpha + i\beta)\,\mathrm{e}^{(2-i)x}\) avec \(\alpha\), \(\beta\) réels.</div>
  <div class="q"><strong>Q2.</strong> En déduire une primitive de \(x \mapsto \mathrm{e}^{2x}\cos x\) et de \(x \mapsto \mathrm{e}^{2x}\sin x\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(n \in \mathbb N^*\), calculer \(\displaystyle\int_0^{2\pi} x\,\mathrm{e}^{inx}\,\mathrm{d}x\) par une intégration par parties, puis en déduire \(\displaystyle\int_0^{2\pi} x\cos(nx)\,\mathrm{d}x\) et \(\displaystyle\int_0^{2\pi} x\sin(nx)\,\mathrm{d}x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(\lambda = 2 - i \neq 0\), une primitive est \(\frac{\mathrm{e}^{(2-i)x}}{2 - i}\), et \(\frac{1}{2 - i} = \frac{2 + i}{(2 - i)(2 + i)} = \frac{2 + i}{5}\). Donc \(F(x) = \frac{2 + i}{5}\,\mathrm{e}^{(2-i)x}\) : \(\alpha = \frac25\), \(\beta = \frac15\).</p>
    <p><strong>Q2.</strong> \(\mathrm{e}^{(2-i)x} = \mathrm{e}^{2x}(\cos x - i\sin x)\) : sa partie réelle est \(\mathrm{e}^{2x}\cos x\), sa partie imaginaire \(-\mathrm{e}^{2x}\sin x\). On développe \(F(x) = \frac{\mathrm{e}^{2x}}{5}(2 + i)(\cos x - i\sin x)\) :</p>
    <div class="formula">$$F(x) = \frac{\mathrm{e}^{2x}}{5}\Big[(2\cos x + \sin x) + i(\cos x - 2\sin x)\Big] .$$</div>
    <p>Une primitive de \(\mathrm{e}^{2x}\cos x\) est \(\frac{\mathrm{e}^{2x}(2\cos x + \sin x)}{5}\) ; une primitive de \(-\mathrm{e}^{2x}\sin x\) est \(\frac{\mathrm{e}^{2x}(\cos x - 2\sin x)}{5}\), donc une primitive de \(\mathrm{e}^{2x}\sin x\) est \(\frac{\mathrm{e}^{2x}(2\sin x - \cos x)}{5}\). Piège : le signe moins de la partie imaginaire, qui vient de \(\mathrm{e}^{-ix}\). On retrouve les formules du cours (§5) avec \(a = 2\), \(b = 1\).</p>
    <p><strong>Q3.</strong> Avec \(v = x\), \(u' = \mathrm{e}^{inx}\), \(u = \frac{\mathrm{e}^{inx}}{in}\), et \(\mathrm{e}^{2in\pi} = 1\) :</p>
    <div class="formula">$$\int_0^{2\pi} x\,\mathrm{e}^{inx}\,\mathrm{d}x = \left[\frac{x\,\mathrm{e}^{inx}}{in}\right]_0^{2\pi} - \frac{1}{in}\int_0^{2\pi}\mathrm{e}^{inx}\,\mathrm{d}x = \frac{2\pi}{in} - 0 = -\frac{2i\pi}{n} .$$</div>
    <p>Parties réelle et imaginaire : \(\int_0^{2\pi} x\cos(nx)\,\mathrm{d}x = 0\) et \(\int_0^{2\pi} x\sin(nx)\,\mathrm{d}x = -\frac{2\pi}{n}\). Ce sont, au facteur \(\frac1\pi\) près, les coefficients de Fourier de la fonction \(x\) sur \([0, 2\pi]\), utilisés en physique pour décomposer un signal en dents de scie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Puissances de sinus et de cosinus</h3>
  <div class="statement">Déterminer une primitive de chaque fonction, puis répondre à Q4.</div>
  <div class="q"><strong>Q1.</strong> \(f(x) = \sin^4 x\) (linéariser par les formules d'Euler).</div>
  <div class="q"><strong>Q2.</strong> \(g(x) = \cos^5 x\).</div>
  <div class="q"><strong>Q3.</strong> \(h(x) = \sin(2x)\cos(5x)\).</div>
  <div class="q"><strong>Q4.</strong> Quelle est la valeur moyenne de \(\sin^4\) sur une période ? Calculer \(\displaystyle\int_0^{\pi/2}\cos^5 x\,\mathrm{d}x\) et comparer à l'exercice 06.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Comme \((2i)^4 = 16\) :</p>
    <div class="formula">$$\sin^4 x = \frac{(\mathrm{e}^{ix} - \mathrm{e}^{-ix})^4}{16} = \frac{\mathrm{e}^{4ix} - 4\,\mathrm{e}^{2ix} + 6 - 4\,\mathrm{e}^{-2ix} + \mathrm{e}^{-4ix}}{16} .$$</div>
    <p>En regroupant : \(\sin^4 x = \dfrac{3 - 4\cos(2x) + \cos(4x)}{8}\). Une primitive est \(\dfrac{3x}{8} - \dfrac{\sin(2x)}{4} + \dfrac{\sin(4x)}{32}\).</p>
    <p><strong>Q2.</strong> Exposant impair : on isole un facteur \(\cos x\), et avec \(u = \sin x\), \(\cos^5 x = \cos x\,(1 - \sin^2 x)^2\) s'écrit \(u'(1 - 2u^2 + u^4)\). Une primitive est \(\sin x - \dfrac{2\sin^3 x}{3} + \dfrac{\sin^5 x}{5}\).</p>
    <p><strong>Q3.</strong> \(\sin a\cos b = \frac12\big(\sin(a + b) + \sin(a - b)\big)\) avec \(a = 2x\), \(b = 5x\) : \(h(x) = \frac12\big(\sin(7x) - \sin(3x)\big)\). Une primitive est \(-\dfrac{\cos(7x)}{14} + \dfrac{\cos(3x)}{6}\).</p>
    <p><strong>Q4.</strong> Sur \([0, 2\pi]\), les termes en \(\sin(2x)\) et \(\sin(4x)\) de la primitive valent 0 aux deux bornes : \(\int_0^{2\pi}\sin^4 x\,\mathrm{d}x = \frac{3\pi}{4}\), et la valeur moyenne est \(\frac38\). Avec Q2, \(\int_0^{\pi/2}\cos^5 x\,\mathrm{d}x = 1 - \frac23 + \frac15 = \frac{8}{15}\), la même valeur que \(W_5\) : le changement de variable \(x = \frac\pi2 - s\) échange \(\cos\) et \(\sin\) sur \([0, \frac\pi2]\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Trinômes du second degré</h3>
  <div class="statement">Déterminer une primitive de chaque fonction, sur l'intervalle indiqué.</div>
  <div class="q"><strong>Q1.</strong> \(f_1(x) = \dfrac{1}{x^2 + x + 1}\) sur \(\mathbb R\).</div>
  <div class="q"><strong>Q2.</strong> \(f_2(x) = \dfrac{1}{3x^2 - 2x - 1}\) sur \(]1, +\infty[\).</div>
  <div class="q"><strong>Q3.</strong> \(f_3(x) = \dfrac{3x - 1}{x^2 + 2x + 2}\) sur \(\mathbb R\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(\displaystyle\int_0^1 \frac{\mathrm{d}x}{x^2 + x + 1}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta = -3 \lt 0\) : forme canonique \(x^2 + x + 1 = \left(x + \frac12\right)^2 + \frac34\), avec \(k = \frac{\sqrt3}{2}\). Une primitive est \(\frac1k\arctan\frac{x + 1/2}{k} = \dfrac{2}{\sqrt3}\arctan\dfrac{2x + 1}{\sqrt3}\).</p>
    <p><strong>Q2.</strong> \(\Delta = 16 \gt 0\), racines \(1\) et \(-\frac13\) : \(3x^2 - 2x - 1 = (x - 1)(3x + 1)\). Méthode du cache : \(\dfrac{1}{(x - 1)(3x + 1)} = \dfrac{1/4}{x - 1} - \dfrac{3/4}{3x + 1}\). Sur \(]1, +\infty[\), une primitive est \(\frac14\ln(x - 1) - \frac14\ln(3x + 1) = \dfrac14\ln\dfrac{x - 1}{3x + 1}\).</p>
    <p><strong>Q3.</strong> La dérivée du dénominateur est \(2x + 2\), et \(3x - 1 = \frac32(2x + 2) - 4\). Avec \(x^2 + 2x + 2 = (x + 1)^2 + 1\), une primitive est \(\dfrac32\ln(x^2 + 2x + 2) - 4\arctan(x + 1)\).</p>
    <p><strong>Q4.</strong> Avec Q1 et \(\arctan\sqrt3 = \frac\pi3\), \(\arctan\frac{1}{\sqrt3} = \frac\pi6\) :</p>
    <div class="formula">$$\int_0^1\frac{\mathrm{d}x}{x^2 + x + 1} = \frac{2}{\sqrt3}\left(\frac\pi3 - \frac\pi6\right) = \frac{\pi}{3\sqrt3} \approx 0{,}605 .$$</div>
    <p>Contrôle : sur \([0, 1]\), l'intégrande est entre \(\frac13\) et \(1\) ; le résultat est bien entre les deux.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Fractions rationnelles</h3>
  <div class="statement">Déterminer une primitive de chaque fonction sur l'intervalle indiqué. Pour Q3 et Q4, on admet la forme de la décomposition.</div>
  <div class="q"><strong>Q1.</strong> \(f_1(x) = \dfrac{1}{x(x + 1)(x + 2)}\) sur \(]0, +\infty[\) ; en déduire \(\displaystyle\int_1^2 f_1(x)\,\mathrm{d}x\).</div>
  <div class="q"><strong>Q2.</strong> \(f_2(x) = \dfrac{x^3 - 2}{x^2 - x}\) sur \(]1, +\infty[\).</div>
  <div class="q"><strong>Q3.</strong> \(f_3(x) = \dfrac{1}{x(x - 1)^2} = \dfrac{a}{x} + \dfrac{b}{x - 1} + \dfrac{c}{(x - 1)^2}\) sur \(]1, +\infty[\).</div>
  <div class="q"><strong>Q4.</strong> \(f_4(x) = \dfrac{x}{(x - 1)(x^2 + 1)} = \dfrac{a}{x - 1} + \dfrac{bx + c}{x^2 + 1}\) sur \(]1, +\infty[\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Trois pôles simples ; méthode du cache : en 0, \(\frac{1}{1 \times 2} = \frac12\) ; en \(-1\), \(\frac{1}{(-1)\times 1} = -1\) ; en \(-2\), \(\frac{1}{(-2)(-1)} = \frac12\). Donc \(f_1(x) = \dfrac{1/2}{x} - \dfrac{1}{x + 1} + \dfrac{1/2}{x + 2}\), et une primitive sur \(]0, +\infty[\) est \(F_1(x) = \frac12\ln\dfrac{x(x + 2)}{(x + 1)^2}\). Alors</p>
    <div class="formula">$$\int_1^2 f_1(x)\,\mathrm{d}x = \frac12\left(\ln\frac{8}{9} - \ln\frac34\right) = \frac12\ln\frac{32}{27} \approx 0{,}085 .$$</div>
    <p><strong>Q2.</strong> Division euclidienne : \(x^3 - 2 = (x^2 - x)(x + 1) + (x - 2)\). Puis \(\frac{x - 2}{x(x - 1)}\) : en 0, \(\frac{-2}{-1} = 2\) ; en 1, \(\frac{-1}{1} = -1\). Donc \(f_2(x) = x + 1 + \frac2x - \frac{1}{x - 1}\), et une primitive sur \(]1, +\infty[\) est \(\dfrac{x^2}{2} + x + 2\ln x - \ln(x - 1)\).</p>
    <p><strong>Q3.</strong> En multipliant par \(x\) puis \(x = 0\) : \(a = 1\). En multipliant par \((x - 1)^2\) puis \(x = 1\) : \(c = 1\). En multipliant par \(x\) et en faisant tendre \(x\) vers \(+\infty\) : \(0 = a + b\), donc \(b = -1\). Contrôle en \(x = 2\) : \(\frac12 = \frac12 - 1 + 1\). Une primitive est \(\ln x - \ln(x - 1) - \dfrac{1}{x - 1}\).</p>
    <p><strong>Q4.</strong> Cache en 1 : \(a = \frac{1}{1 + 1} = \frac12\). Puis \(x = \frac12(x^2 + 1) + (bx + c)(x - 1)\) : le coefficient de \(x^2\) donne \(\frac12 + b = 0\), le terme constant \(\frac12 - c = 0\), d'où \(b = -\frac12\), \(c = \frac12\) (contrôle sur le coefficient de \(x\) : \(c - b = 1\)). Ainsi \(f_4(x) = \dfrac{1/2}{x - 1} - \dfrac12\cdot\dfrac{x}{x^2 + 1} + \dfrac12\cdot\dfrac{1}{x^2 + 1}\), et une primitive est</p>
    <div class="formula">$$\frac12\ln(x - 1) - \frac14\ln(x^2 + 1) + \frac12\arctan x .$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Par parties ou par changement de variable</h3>
  <div class="statement">Déterminer une primitive de chaque fonction, en choisissant la technique.</div>
  <div class="q"><strong>Q1.</strong> \(x \mapsto x\arctan x\) sur \(\mathbb R\).</div>
  <div class="q"><strong>Q2.</strong> \(x \mapsto x^2\ln x\) sur \(]0, +\infty[\).</div>
  <div class="q"><strong>Q3.</strong> \(x \mapsto \mathrm{e}^{\sqrt x}\) sur \(]0, +\infty[\) ; en déduire \(\displaystyle\int_0^1\mathrm{e}^{\sqrt x}\,\mathrm{d}x\).</div>
  <div class="q"><strong>Q4.</strong> \(x \mapsto \dfrac{1}{1 + \sqrt x}\) sur \(]0, +\infty[\) ; en déduire \(\displaystyle\int_0^4\frac{\mathrm{d}x}{1 + \sqrt x}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Par parties, \(v = \arctan x\) (que la dérivation simplifie), \(u' = x\) ; astuce : prendre \(u = \frac{x^2 + 1}{2}\) (une autre primitive de \(x\)), car alors \(u\,v' = \frac12\). Il vient</p>
    <div class="formula">$$\int^x t\arctan t\,\mathrm{d}t = \frac{x^2 + 1}{2}\arctan x - \int^x\frac12\,\mathrm{d}t = \frac{x^2 + 1}{2}\arctan x - \frac x2 .$$</div>
    <p><strong>Q2.</strong> \(v = \ln x\), \(u = \frac{x^3}{3}\) : \(\frac{x^3}{3}\ln x - \int^x\frac{t^2}{3}\,\mathrm{d}t = \dfrac{x^3}{3}\ln x - \dfrac{x^3}{9}\).</p>
    <p><strong>Q3.</strong> Changement de variable \(u = \sqrt x\), \(x = u^2\), \(\mathrm{d}x = 2u\,\mathrm{d}u\) : il faut une primitive de \(2u\,\mathrm{e}^u\), obtenue par parties : \(2(u - 1)\,\mathrm{e}^u\). En revenant à \(x\) : \(2(\sqrt x - 1)\,\mathrm{e}^{\sqrt x}\). Cette primitive est continue en 0 ; \(\int_0^1\mathrm{e}^{\sqrt x}\,\mathrm{d}x = 0 - (-2) = 2\) (ou, en changeant les bornes : \(\int_0^1 2u\,\mathrm{e}^u\,\mathrm{d}u = 2\)).</p>
    <p><strong>Q4.</strong> \(u = \sqrt x\), \(\mathrm{d}x = 2u\,\mathrm{d}u\) : \(\int\frac{2u\,\mathrm{d}u}{1 + u} = \int\left(2 - \frac{2}{1 + u}\right)\mathrm{d}u = 2u - 2\ln(1 + u)\). Une primitive est \(2\sqrt x - 2\ln(1 + \sqrt x)\), et \(\int_0^4\frac{\mathrm{d}x}{1 + \sqrt x} = 4 - 2\ln 3 \approx 1{,}803\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 12</span><span class="diff">★ ★ ☆</span>
  <h3>Trois primitives en physique</h3>
  <div class="statement">On note \(t\) le temps. Les constantes \(a_0\), \(\omega\), \(R\), \(I_m\), \(I_0\), \(\tau\) sont strictement positives.</div>
  <div class="q"><strong>Q1.</strong> Un mobile part du repos à \(t = 0\) avec l'accélération \(a(t) = a_0\cos^2(\omega t)\). Exprimer sa vitesse \(v(t)\) ; quelle est sa vitesse moyenne d'accroissement à long terme ?</div>
  <div class="q"><strong>Q2.</strong> Une résistance \(R\) est parcourue par \(i(t) = I_m\sin(\omega t)\). Calculer la puissance moyenne \(\langle R\,i^2\rangle\) sur une période \(T = \frac{2\pi}{\omega}\).</div>
  <div class="q"><strong>Q3.</strong> Un courant \(i(t) = I_0\,\mathrm{e}^{-t/\tau}\sin(\omega t)\) traverse un circuit. Exprimer la charge \(q(t) = \int_0^t i(s)\,\mathrm{d}s\), puis sa limite quand \(t \to +\infty\). Application numérique : \(I_0 = 10\ \text{mA}\), \(\tau = 1\ \text{ms}\), \(\omega = 2\,000\ \text{rad/s}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v\) est la primitive de \(a\) nulle en 0. Avec \(\cos^2(\omega t) = \frac{1 + \cos(2\omega t)}{2}\) : \(v(t) = a_0\left(\dfrac t2 + \dfrac{\sin(2\omega t)}{4\omega}\right)\). Le terme oscillant reste borné par \(\frac{a_0}{4\omega}\) : à long terme, la vitesse croît comme \(\frac{a_0}{2}\,t\), l'accélération moyenne étant \(\frac{a_0}{2}\).</p>
    <p><strong>Q2.</strong> Avec \(\sin^2 = \frac{1 - \cos 2(\cdot)}{2}\) :</p>
    <div class="formula">$$\langle R\,i^2\rangle = \frac1T\int_0^T R\,I_m^2\sin^2(\omega t)\,\mathrm{d}t = \frac{R\,I_m^2}{T}\left[\frac t2 - \frac{\sin(2\omega t)}{4\omega}\right]_0^T = \frac{R\,I_m^2}{2} ,$$</div>
    <p>puisque \(\sin(2\omega T) = \sin(4\pi) = 0\). C'est \(R\,I_{\text{eff}}^2\) avec \(I_{\text{eff}} = \frac{I_m}{\sqrt2}\).</p>
    <p><strong>Q3.</strong> \(\mathrm{e}^{-s/\tau}\sin(\omega s)\) est de la forme \(\mathrm{e}^{as}\sin(bs)\) avec \(a = -\frac1\tau\), \(b = \omega\). Avec la formule du cours (§5), une primitive est</p>
    <div class="formula">$$s \longmapsto \frac{\mathrm{e}^{-s/\tau}\big(-\frac1\tau\sin(\omega s) - \omega\cos(\omega s)\big)}{\frac{1}{\tau^2} + \omega^2} .$$</div>
    <p>Donc</p>
    <div class="formula">$$q(t) = I_0\,\frac{\omega - \mathrm{e}^{-t/\tau}\left(\frac1\tau\sin(\omega t) + \omega\cos(\omega t)\right)}{\frac{1}{\tau^2} + \omega^2} \xrightarrow[t \to +\infty]{} \frac{I_0\,\omega\,\tau^2}{1 + \omega^2\tau^2} .$$</div>
    <p>Numériquement, \(\omega\tau = 2\) et la limite vaut \(\frac{10^{-2}\times 2\,000\times 10^{-6}}{1 + 4} = 4 \times 10^{-6}\ \text{C}\), soit \(4\ \mu\text{C}\). Le courant change de signe, si bien que \(q(t)\) n'est pas monotone : à \(t = 2\ \text{ms}\), elle vaut déjà environ \(4{,}56\ \mu\text{C}\), au-dessus de sa limite.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Autour de \(1/(1 + x^3)\)</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de mathématiques PT (thème : calcul de primitives, fractions rationnelles). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">On note \(f(x) = \dfrac{1}{1 + x^3}\), définie sur \(]-1, +\infty[\), et l'on pose \(I = \displaystyle\int_0^1 f(x)\,\mathrm{d}x\) et \(J = \displaystyle\int_0^1\frac{\mathrm{d}x}{(1 + x^3)^2}\).</div>

  <p class="exo-part">Partie A — Décomposition en éléments simples</p>
  <div class="q"><strong>A1.</strong> Factoriser \(1 + x^3\) dans \(\mathbb R[X]\). On admet qu'il existe des réels \(a\), \(b\), \(c\) tels que \(f(x) = \dfrac{a}{x + 1} + \dfrac{bx + c}{x^2 - x + 1}\) ; les déterminer.</div>
  <div class="q"><strong>A2.</strong> Écrire \(-x + 2\) sous la forme \(\alpha\,(2x - 1) + \beta\) avec \(\alpha\), \(\beta\) réels.</div>

  <p class="exo-part">Partie B — Une primitive</p>
  <div class="q"><strong>B1.</strong> Mettre \(x^2 - x + 1\) sous forme canonique et en déduire une primitive \(F\) de \(f\) sur \(]-1, +\infty[\).</div>
  <div class="q"><strong>B2.</strong> Vérifier que \(F(0) = -\dfrac{\pi}{6\sqrt3}\).</div>

  <p class="exo-part">Partie C — Calcul de \(I\)</p>
  <div class="q"><strong>C1.</strong> Montrer que \(I = \dfrac{\ln 2}{3} + \dfrac{\pi}{3\sqrt3}\).</div>
  <div class="q"><strong>C2.</strong> Sans utiliser C1, montrer que \(1 - x^3 \le f(x) \le 1\) sur \([0, 1]\) et en déduire un encadrement de \(I\). Contrôler la valeur trouvée en C1.</div>

  <p class="exo-part">Partie D — Calcul de \(J\)</p>
  <div class="q"><strong>D1.</strong> Calculer la dérivée de \(g(x) = \dfrac{x}{1 + x^3}\), et vérifier que \(g'(x) = \dfrac{3}{(1 + x^3)^2} - \dfrac{2}{1 + x^3}\).</div>
  <div class="q"><strong>D2.</strong> En déduire que \(J = \dfrac16 + \dfrac23\,I\), puis une valeur approchée de \(J\).</div>

  <p class="exo-part">Partie E — Vers l'infini</p>
  <div class="q"><strong>E1.</strong> Déterminer la limite de \(F(X) - F(0)\) quand \(X \to +\infty\).</div>
  <div class="q"><strong>E2.</strong> Interpréter cette limite géométriquement.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(1 + x^3 = (x + 1)(x^2 - x + 1)\), et \(x^2 - x + 1\) a un discriminant \(-3 \lt 0\) : il est irréductible sur \(\mathbb R\). Cache en \(-1\) : \(a = \frac{1}{1 + 1 + 1} = \frac13\). Puis \(1 = \frac13(x^2 - x + 1) + (bx + c)(x + 1)\) : le coefficient de \(x^2\) donne \(\frac13 + b = 0\), le terme constant \(\frac13 + c = 1\). D'où \(b = -\frac13\), \(c = \frac23\), et contrôle sur le coefficient de \(x\) : \(-\frac13 + b + c = 0\). Ainsi</p>
    <div class="formula">$$f(x) = \frac13\cdot\frac{1}{x + 1} + \frac13\cdot\frac{-x + 2}{x^2 - x + 1} .$$</div>
    <p><strong>A2.</strong> \(-x + 2 = -\frac12(2x - 1) + \frac32\) : \(\alpha = -\frac12\), \(\beta = \frac32\). On fait ainsi apparaître la dérivée \(2x - 1\) du trinôme (méthode 6).</p>
    <p><strong>B1.</strong> \(x^2 - x + 1 = \left(x - \frac12\right)^2 + \frac34\), avec \(k = \frac{\sqrt3}{2}\). Donc</p>
    <div class="formula">$$\frac{-x + 2}{x^2 - x + 1} = -\frac12\cdot\frac{2x - 1}{x^2 - x + 1} + \frac32\cdot\frac{1}{(x - \frac12)^2 + \frac34} ,$$</div>
    <p>de primitive \(-\frac12\ln(x^2 - x + 1) + \sqrt3\arctan\frac{2x - 1}{\sqrt3}\) (car \(\frac32\cdot\frac{2}{\sqrt3} = \sqrt3\)). En multipliant par \(\frac13\) et en ajoutant \(\frac13\ln(x + 1)\) (positif sur \(]-1, +\infty[\)) :</p>
    <div class="formula">$$F(x) = \frac13\ln(x + 1) - \frac16\ln(x^2 - x + 1) + \frac{1}{\sqrt3}\arctan\frac{2x - 1}{\sqrt3} .$$</div>
    <p><strong>B2.</strong> Les deux logarithmes sont nuls en 0, et \(\arctan\left(-\frac{1}{\sqrt3}\right) = -\frac\pi6\) : \(F(0) = -\frac{\pi}{6\sqrt3}\).</p>
    <p><strong>C1.</strong> \(\ln(1^2 - 1 + 1) = 0\) et \(\arctan\frac{1}{\sqrt3} = \frac\pi6\), d'où \(F(1) = \frac{\ln 2}{3} + \frac{\pi}{6\sqrt3}\), donc \(I = F(1) - F(0) = \dfrac{\ln 2}{3} + \dfrac{\pi}{3\sqrt3} \approx 0{,}8356\).</p>
    <p><strong>C2.</strong> Sur \([0, 1]\), \(1 + x^3 \ge 1\) donne \(f(x) \le 1\) ; et \(1 - x^3 \le \frac{1}{1 + x^3}\) équivaut à \((1 - x^3)(1 + x^3) \le 1\), soit \(1 - x^6 \le 1\) : vrai. Par croissance de l'intégrale, \(\int_0^1(1 - x^3)\,\mathrm{d}x = \frac34 \le I \le 1\). La valeur \(0{,}8356\) est bien dans cet intervalle.</p>
    <p><strong>D1.</strong> \(g'(x) = \dfrac{(1 + x^3) - x\cdot 3x^2}{(1 + x^3)^2} = \dfrac{1 - 2x^3}{(1 + x^3)^2}\), et \(1 - 2x^3 = 3 - 2(1 + x^3)\), d'où \(g'(x) = \dfrac{3}{(1 + x^3)^2} - \dfrac{2}{1 + x^3}\).</p>
    <p><strong>D2.</strong> En intégrant D1 sur \([0, 1]\) : \(g(1) - g(0) = \frac12 = 3J - 2I\). Donc</p>
    <div class="formula">$$J = \frac16 + \frac23\,I = \frac16 + \frac{2\ln 2}{9} + \frac{2\pi}{9\sqrt3} \approx 0{,}7238 .$$</div>
    <p>Contrôle : \(f^2 \le f\) sur \([0, 1]\) (car \(0 \lt f \le 1\)), donc \(J \le I\) : c'est bien le cas.</p>
    <p><strong>E1.</strong> Les deux logarithmes se regroupent, et la fraction tend vers 1 :</p>
    <div class="formula">$$\frac13\ln(X + 1) - \frac16\ln(X^2 - X + 1) = \frac16\ln\frac{(X + 1)^2}{X^2 - X + 1} \xrightarrow[X \to +\infty]{} 0 ;$$</div>
    <p>de plus \(\arctan\frac{2X - 1}{\sqrt3} \to \frac\pi2\). Donc \(F(X) \to \frac{\pi}{2\sqrt3}\), et</p>
    <div class="formula">$$F(X) - F(0) \xrightarrow[X \to +\infty]{} \frac{\pi}{2\sqrt3} + \frac{\pi}{6\sqrt3} = \frac{2\pi}{3\sqrt3} \approx 1{,}209 .$$</div>
    <p><strong>E2.</strong> \(F(X) - F(0) = \int_0^X f(x)\,\mathrm{d}x\) est l'aire sous la courbe de \(f\) entre 0 et \(X\). Elle croît avec \(X\) mais reste bornée : l'aire du domaine infini compris entre la courbe et l'axe, pour \(x \ge 0\), est finie et vaut \(\frac{2\pi}{3\sqrt3}\). Ces « intégrales généralisées » sont étudiées en 2ᵉ année.</p>
  </div>
</div>
