  <h2>L'épreuve écrite d'anglais de la Banque PT</h2>
  <div class="intro">À l'écrit de la Banque PT, l'épreuve de langue vivante A prend, en anglais, la forme d'une <strong>synthèse de documents</strong> : en 3 heures, tu rédiges en anglais une synthèse d'un dossier de documents en anglais. C'est un exercice de méthode autant que de langue, que ce chapitre décompose de la lecture du dossier au comptage des mots. Il s'appuie sur <a href="#endoc/cours">« Présenter &amp; commenter un document »</a> (nature et source d'un document, description d'une image), <a href="#enconnect/cours">« Connecteurs logiques »</a> et <a href="#enavis/cours">« Donner son avis &amp; nuancer »</a> (pour nuancer, pas pour donner ton avis : voir §1).</div>

        <li><strong>Support</strong> : un dossier de documents en anglais — 5 documents à la session 2026, des textes (articles de presse, tribunes, extraits de rapports…) et des documents iconographiques (graphique, dessin de presse, photographie…). Thème de la session 2026 : la géo-ingénierie (<em>geoengineering</em>).</li>

<div class="course-section">
  <div class="sec-num">§1 · L'ÉPREUVE ET CE QU'ON ATTEND</div>
  <h2>Qu'est-ce qu'une synthèse de documents ?</h2>
  <div class="intro">Une synthèse n'est ni un résumé, ni un essai, ni une suite de commentaires : c'est une réponse organisée à une question, construite avec les seuls documents du dossier. Bien comprendre cette définition évite les deux fautes qui coûtent le plus cher : résumer les documents un par un, et donner son avis.</div>
  <div class="def-box"><strong>Synthèse de documents</strong> (<em>a synthesis</em>, pluriel <em>syntheses</em>) : texte rédigé, objectif et structuré, qui répond à une problématique dégagée du dossier en <strong>confrontant</strong> les documents (en quoi ils se rejoignent, se complètent ou s'opposent), dans une longueur imposée et sans rien ajouter qui ne soit dans le dossier.</div>
  <div>
  <table>
    <tr><th>Exercice</th><th>Point de départ</th><th>Ordre suivi</th><th>Ton avis ?</th></tr>
    <tr><td>Résumé (<em>summary</em>)</td><td>un seul texte</td><td>celui du texte</td><td>non</td></tr>
    <tr><td><strong>Synthèse</strong> (<em>synthesis</em>)</td><td>plusieurs documents</td><td>celui de <strong>ta problématique</strong> : idée par idée</td><td><strong>non</strong></td></tr>
    <tr><td>Essai (<em>essay</em>)</td><td>une question, une citation</td><td>celui de ton argumentation</td><td>oui, c'est le but</td></tr>
  </table>
  </div>
  <div class="prop-box"><strong>Ce qu'on attend d'une bonne synthèse</strong> (conseils valables pour toute épreuve de ce type) :
    <ul>
      <li>une <strong>problématique</strong> claire, posée dans l'introduction et reprise dans la conclusion (§3) ;</li>
      <li>un <strong>plan</strong> visible : introduction, deux ou trois parties, conclusion (§4) ;</li>
      <li>la <strong>confrontation</strong> des documents : chaque partie en croise plusieurs (§6) ;</li>
      <li>la <strong>fidélité</strong> : tous les documents sont utilisés, aucun n'est déformé, rien n'est ajouté ;</li>
      <li>un <strong>anglais</strong> correct, varié et personnel : tu reformules au lieu de recopier (§8) ;</li>
      <li>la <strong>longueur</strong> demandée, respectée (§9).</li>
    </ul>
  </div>
  <h3>Ni avis, ni connaissances extérieures</h3>
  <p>La synthèse rend compte du dossier, pas de ce que tu en penses ni de ce que tu sais par ailleurs. Même si tu connais bien le sujet (un chiffre lu ailleurs, un exemple vu en cours de SI…), tu ne l'ajoutes pas : le correcteur évalue ta capacité à exploiter <em>ces</em> documents. De même, aucun <em>I think</em>, <em>in my opinion</em> ou <em>we must</em> : les expressions de <a href="#enavis/cours">« Donner son avis &amp; nuancer »</a> servent ici à <strong>rapporter</strong> et à <strong>nuancer</strong> le point de vue des auteurs (<em>the author seems convinced that…</em>), pas à exprimer le tien.</p>
  <div class="notice">Les règles de détail de l'épreuve (titre, nombre de mots à indiquer, tolérance) ne sont pas reprises ici : vérifie dans la notice et le dernier rapport du jury (banquept.fr). Les conseils de ce chapitre sont ceux de toute synthèse de documents ; ils restent valables quelles que soient ces règles.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LIRE UN DOSSIER</div>
  <h2>Lire le dossier : source, date, point de vue, données</h2>
  <div class="intro">Avant de chercher ce qui relie les documents, il faut savoir pour chacun <strong>qui parle, quand, d'où, et pour dire quoi</strong>. Ce paratexte (titre, source, date, auteur) explique souvent pourquoi deux documents s'opposent : un industriel et une association de riverains ne voient pas le même projet de la même façon.</div>
  <h3>Le dossier d'exemple de ce chapitre</h3>
  <p>Pour illustrer chaque étape, on suit un petit dossier <strong>inventé</strong> (ville, journaux, auteurs et chiffres fictifs) sur la place de la voiture en ville :</p>
  <ul>
    <li><strong>Doc. 1</strong> — <em>“Three years without cars: Norbridge's centre comes back to life”</em>, article d'information, <em>The Norbridge Gazette</em> (quotidien régional fictif), 2025 : moins de bruit et de pollution, des commerces plus fréquentés, mais des livraisons compliquées.</li>
    <li><strong>Doc. 2</strong> — diagramme en barres (ci-dessous) : la part des déplacements par mode de transport en 2015 et en 2025.</li>
    <li><strong>Doc. 3</strong> — <em>“A car ban designed by people who live in the centre”</em>, tribune d'une infirmière de nuit qui habite en banlieue, <em>The Weekly Courant</em> (hebdomadaire fictif), 2025 : pas de bus à 5 heures du matin, des trajets deux fois plus longs, une mesure injuste pour ceux qui n'ont pas le choix.</li>
    <li><strong>Doc. 4</strong> — dessin de presse (fictif), 2025 : un centre-ville verdoyant plein de cyclistes souriants ; derrière un mur, une banlieue grise où les voitures font la queue.</li>
  </ul>
  <h3>La fiche d'identité de chaque document</h3>
  <ul>
    <li><strong>Nature</strong> : <em>a news article</em> (article d'information), <em>an op-ed</em> (tribune d'un auteur extérieur au journal), <em>an editorial</em> (opinion du journal lui-même), <em>an interview</em>, <em>an extract from a report</em>, <em>a survey</em> ou <em>a poll</em> (enquête, sondage), <em>a chart</em> ou <em>a graph</em>, <em>an infographic</em>, <em>a cartoon</em> (dessin de presse), <em>a photograph</em>.</li>
    <li><strong>Source</strong> : quotidien national ou régional (<em>a national / regional daily</em>), hebdomadaire (<em>a weekly</em>), revue scientifique (<em>a scientific journal</em>), groupe de réflexion (<em>a think tank</em>), ONG (<em>an NGO</em>), agence publique, entreprise. Une source engagée n'est pas « fausse », mais son point de vue doit être signalé.</li>
    <li><strong>Date</strong> : elle situe le document dans le débat (avant ou après un événement ; un chiffre peut être dépassé) et peut expliquer un désaccord.</li>
    <li><strong>Auteur et point de vue</strong> : journaliste qui informe, expert, militant, élu, représentant d'une entreprise ; et le <strong>ton</strong> : neutre (<em>factual</em>), enthousiaste (<em>enthusiastic</em>), alarmiste (<em>alarmist</em>), sceptique (<em>sceptical</em>, US <em>skeptical</em>), ironique (<em>ironic</em>).</li>
  </ul>
  <div class="method-box"><strong>Lire un texte activement (≈ 8 minutes par document)</strong>
    <ol>
      <li><span class="step">Survoler.</span> Titre, chapeau (<em>standfirst</em>), source, date, première et dernière phrases : le thème et la thèse.</li>
      <li><span class="step">Lire crayon en main.</span> Souligner les idées clés, les chiffres, les exemples, les concessions (<em>admittedly</em>, <em>yet</em>…) ; noter dans la marge + (pour), − (contre), « = doc. n » (même idée qu'un autre document), « ≠ doc. n » (idée opposée).</li>
      <li><span class="step">Résumer en anglais.</span> Une phrase par document, écrite tout de suite en anglais : elle resservira presque telle quelle dans la synthèse. <em>Doc. 3 (op-ed by a night nurse, 2025): the car ban penalises suburban workers who have no alternative.</em></li>
    </ol>
  </div>
  <h3>Lire un graphique</h3>
  <p>Un graphique se lit dans un ordre fixe : le <strong>titre</strong> (que mesure-t-on ?), la <strong>source</strong> et la <strong>date</strong>, l'<strong>unité</strong> (pourcentage, millions, indice, dollars par…), la <strong>période</strong> et l'<strong>échelle</strong> (l'axe commence-t-il à zéro ?), puis la <strong>tendance générale</strong>, les <strong>valeurs remarquables</strong> (maximum, minimum, rupture) et les <strong>comparaisons</strong>. On finit par ce que le graphique <em>ne dit pas</em> : il montre une évolution, pas sa cause.</p>

  <p>Ce qu'on peut en tirer, en anglais :</p>
  <ul>
    <li><em>The bar chart shows how the residents of Norbridge got around in 2015 and in 2025.</em> (on présente avant de commenter)</li>
    <li><em>The car remains the main mode of transport, but its share fell from 58% to 41%, a drop of 17 percentage points.</em> On parle de <strong>points de pourcentage</strong> (<em>percentage points</em>) pour l'écart entre deux pourcentages : de 58&nbsp;% à 41&nbsp;%, c'est 17 points de moins, soit une baisse de 29&nbsp;% (17/58).</li>
    <li><em>Cycling more than doubled (from 5% to 11%), while e-scooters, almost non-existent in 2015, now account for 4% of trips.</em></li>
    <li><em>The chart does not say why: the decline may be linked to the car-free centre described in document 1, but it may have other causes.</em> (prudence : une corrélation n'est pas une causalité)</li>
  </ul>
  <div class="prop-box"><strong>Décrire une évolution</strong> : <em>to rise / increase (sharply, steadily, slightly)</em> · <em>to soar</em> (s'envoler) · <em>to fall / drop / decline</em> · <em>to plummet</em> (s'effondrer) · <em>to peak at</em> (culminer à) · <em>to level off</em> (se stabiliser) · <em>to double / to triple</em> · <em>to account for 4%</em> (représenter 4&nbsp;%). Prépositions : <em>rose <strong>from</strong> 5% <strong>to</strong> 11%</em>, <em>rose <strong>by</strong> 6 points</em>, <em>an increase <strong>in</strong> cycling</em>, <em>an increase <strong>of</strong> 6 points</em>.</div>
  <h3>Lire un dessin de presse ou une photographie</h3>
  <p>La méthode de description est celle de <a href="#endoc/cours">« Présenter &amp; commenter un document »</a> (§2) : plans, personnages, légende, cible, ironie. Mais dans une synthèse, l'image est un document <strong>comme les autres</strong> : on n'en fait pas une description complète, on en retient le <strong>message</strong>, résumé en une proposition, et on le confronte aux textes. <em>The cartoonist (doc. 4) contrasts a green city centre full of cyclists with grey suburbs stuck in traffic behind a wall.</em></p>
  <div class="notice"><strong>Piège</strong> : prendre l'ironie au premier degré. Un dessin de presse critique presque toujours quelque chose ; demande-toi <em>qui</em> est visé (<em>who is the target?</em>) avant de dire ce qu'il « montre ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TROUVER LA PROBLÉMATIQUE</div>
  <h2>Trouver la problématique</h2>
  <div class="intro">La problématique est la question à laquelle ta synthèse répond. L'énoncé ne la donne pas : tu la construis à partir de ce qui fait <strong>débat</strong> dans le dossier. Elle doit pouvoir être traitée avec les seuls documents, et tous doivent servir à y répondre.</div>
  <ol>
    <li><strong>Le thème</strong> : de quoi parlent tous les documents ? (Norbridge : la réduction de la place de la voiture en ville.)</li>
    <li><strong>La tension</strong> : sur quoi divergent-ils ? Qu'est-ce qui change, pour qui, à quel prix ? (Les docs 1 et 2 montrent un recul de la voiture qui profite au centre ; les docs 3 et 4, ceux qui en paient le prix.)</li>
    <li><strong>La question</strong> : formuler cette tension en une question ouverte, qui appelle une réponse nuancée.</li>
  </ol>
  <div>
  <table>
    <tr><th>Proposition</th><th>Verdict</th></tr>
    <tr><td><em>What is the future of transport?</em></td><td>Trop large : le dossier ne permet pas d'y répondre.</td></tr>
    <tr><td><em>Are car-free city centres good?</em></td><td>Fermée (oui ou non) et vague : « bons » pour qui ?</td></tr>
    <tr><td><em>Why did car use fall in Norbridge?</em></td><td>Trop étroite : elle ne mobilise que les docs 1 et 2.</td></tr>
    <tr><td><em>Why should cars be banned from cities?</em></td><td>Orientée : elle impose la réponse et appelle un avis.</td></tr>
    <tr><td><em>To what extent can cities reduce car use without penalising those who depend on it?</em></td><td><strong>Bonne</strong> : ouverte, centrée sur la tension du dossier ; tous les documents y répondent.</td></tr>
  </table>
  </div>
  <div class="prop-box"><strong>Formes utiles</strong> : <em>To what extent can / does…?</em> (dans quelle mesure) · <em>How far is…?</em> · <em>Is… a solution to…, or merely…?</em> · <em>How can… be reconciled with…?</em> (concilier) · <em>What are the benefits and the limits of…?</em> (correct, mais plus plat). Jamais <em>in what measure</em>, calque de « dans quelle mesure ».</div>
  <h3>La question indirecte</h3>
  <p>Dans l'introduction, la problématique s'écrit souvent au style indirect. Une question indirecte <strong>n'inverse pas</strong> le sujet et n'emploie pas l'auxiliaire <em>do</em> :</p>
  <ul>
    <li><em>This raises the question of <strong>whether cities can</strong> reduce car use…</em> (et non <em>whether can cities</em>) ;</li>
    <li><em>One may wonder <strong>how fair this policy is</strong>.</em> (et non <em>how fair is this policy</em>) ;</li>
    <li><em>The documents help to understand <strong>why car use fell</strong>.</em> (et non <em>why did car use fall</em>).</li>
  </ul>
  <div class="notice"><strong>Piège</strong> : poser une problématique dans l'introduction… puis l'oublier. Chaque partie doit y contribuer, et la conclusion doit y <strong>répondre</strong> explicitement (§7).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CONSTRUIRE UN PLAN QUI CONFRONTE</div>
  <h2>Construire un plan qui confronte les documents</h2>
  <div class="intro">Le plan est la réponse à la problématique, découpée en deux ou trois étapes. Il s'organise par <strong>idées</strong>, jamais par documents : chaque partie croise plusieurs documents, et un même document peut servir dans plusieurs parties.</div>
  <h3>L'outil : le tableau de confrontation</h3>
  <p>Au brouillon, une ligne par <strong>idée</strong> (ou aspect du sujet), une colonne par <strong>document</strong> ; dans chaque case, ce que le document en dit (+, −, ou rien). Les lignes bien remplies, où les documents se répondent, deviendront les paragraphes ; les regroupements de lignes, les parties.</p>
  <div>
  <table>
    <tr><th>Idée</th><th>Doc. 1 (article)</th><th>Doc. 2 (graphique)</th><th>Doc. 3 (tribune)</th><th>Doc. 4 (dessin)</th></tr>
    <tr><td>La voiture recule</td><td>+ moins de trafic au centre</td><td>+ de 58&nbsp;% à 41&nbsp;%</td><td></td><td></td></tr>
    <tr><td>Bénéfices pour le centre</td><td>+ air, bruit, commerces</td><td>+ vélo multiplié par deux</td><td></td><td>+ centre verdoyant</td></tr>
    <tr><td>Ceux qui dépendent de la voiture</td><td>− livraisons difficiles</td><td>− la voiture reste en tête (41&nbsp;%)</td><td>− pas de bus à 5 h</td><td>− banlieue bloquée</td></tr>
    <tr><td>Une mesure juste ?</td><td></td><td></td><td>− « conçue par ceux qui vivent au centre »</td><td>− un mur entre deux villes</td></tr>
  </table>
  </div>
  <p>Deux parties se dessinent : <strong>I.</strong> un recul de la voiture déjà engagé, qui profite au centre-ville (docs 1, 2, 4) ; <strong>II.</strong> une transition qui risque de laisser de côté ceux qui dépendent de la voiture (docs 3, 4, 2, 1).</p>
  <h3>Trois plans types</h3>
  <ul>
    <li><strong>Analytique</strong> : constat → causes ou enjeux → solutions ou perspectives. Pour un dossier qui décrit un phénomène.</li>
    <li><strong>Dialectique</strong> : atouts → limites → conditions. Pour un dossier qui débat d'une solution, d'une technologie ou d'une politique : le cas le plus fréquent.</li>
    <li><strong>Par acteurs ou par échelles</strong> : citoyens, entreprises, États ; local, national, mondial. Quand le dossier oppose surtout des points de vue d'acteurs.</li>
  </ul>
  <div class="prop-box"><strong>Les règles du plan</strong> : deux ou trois parties de longueur comparable ; chaque partie mobilise <strong>au moins deux documents</strong> ; chaque document est utilisé au moins une fois, <strong>documents iconographiques compris</strong> ; les parties progressent (du constat aux limites, de l'accord au désaccord) ; la dernière prépare la réponse de la conclusion.</div>
  <div class="notice"><strong>Erreur la plus pénalisante</strong> : le plan « document par document » (<em>Document 1 says… Document 2 says…</em>). Ce n'est plus une synthèse mais une suite de résumés, même si chaque résumé est juste.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · L'INTRODUCTION</div>
  <h2>Rédiger l'introduction</h2>
  <div class="intro">L'introduction compte environ 70 à 90 mots sur 450 à 500. Elle enchaîne quatre temps, en un seul paragraphe, sans titre ni numérotation.</div>
  <ol>
    <li><strong>Une accroche tirée du dossier</strong> : un fait, un chiffre ou une courte citation d'un document. Pas de généralité creuse (<em>Since the dawn of time…</em>, <em>Nowadays, … is a hot topic</em>) ni d'exemple extérieur au dossier.</li>
    <li><strong>La présentation du dossier</strong> : nature, source et date des documents, <strong>regroupés</strong> (par nature ou par point de vue) en une ou deux phrases, et leur thème commun. Pas une phrase par document.</li>
    <li><strong>La problématique</strong>, souvent au style indirect (§3).</li>
    <li><strong>L'annonce du plan</strong>, brève.</li>
  </ol>
  <div class="method-box"><strong>Exemple — introduction du dossier Norbridge</strong> (87 mots)
    <p lang="en"><em>In Norbridge, the share of daily trips made by car fell from 58% to 41% in ten years (doc. 2). Made up of a news article and an op-ed published in 2025, a bar chart and a cartoon, this set of documents examines the consequences of pushing cars out of city centres. It raises the question of whether cities can reduce car use without penalising those who depend on it. This synthesis first examines the benefits of the shift, before turning to the residents it leaves behind.</em></p>
    <ol>
      <li>Accroche : un chiffre du doc. 2, avec son renvoi.</li>
      <li>Présentation groupée : quatre documents en une phrase, avec leur thème commun (<em>examines the consequences of…</em>).</li>
      <li>Problématique au style indirect (<em>whether cities can</em>, sans inversion).</li>
      <li>Annonce du plan : deux parties, verbes au présent.</li>
    </ol>
  </div>
  <div class="prop-box"><strong>Annoncer le plan sans calquer le français</strong> : <em>This synthesis first examines…, before turning to…</em> · <em>We shall first consider…, then…</em> · <em>The first part focuses on…; the second assesses…</em> À éviter : <em>we will see</em> (« nous verrons »), <em>in a first time</em> (« dans un premier temps »).</div>
  <div class="notice">Pour désigner le dossier, <em>this set of documents</em> ou <em>the documents</em> sont toujours justes ; <em>the dossier</em> se dit en anglais britannique, mais sonne plus administratif.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉDIGER EN CONFRONTANT</div>
  <h2>Rédiger le développement en confrontant les documents</h2>
  <div class="intro">Chaque paragraphe développe <strong>une idée</strong>, pas un document. Les documents y apparaissent comme des témoins que l'on fait dialoguer : ils se confirment, se complètent, se nuancent ou s'opposent.</div>
  <h3>Le paragraphe en quatre temps</h3>
  <ol>
    <li><strong>Phrase d'idée</strong> (<em>topic sentence</em>) : l'idée du paragraphe, dans tes mots, sans nommer de document.</li>
    <li><strong>Appui</strong> : ce que dit un premier document, avec son renvoi.</li>
    <li><strong>Confrontation</strong> : un deuxième (voire un troisième) document qui confirme, précise, nuance ou contredit, relié par un connecteur.</li>
    <li><strong>Bilan ou transition</strong> : une phrase qui tire la leçon du paragraphe ou prépare le suivant.</li>
  </ol>
  <div class="method-box"><strong>Exemple — un paragraphe de la partie II du dossier Norbridge</strong> (130 mots)
    <p lang="en"><em>Yet the benefits of a car-free centre are not shared equally. The bar chart (doc. 2) is a reminder that the car is still the most common way of getting around, with 41% of all trips. For some residents, it is not a choice: in her op-ed, a night nurse living in the suburbs explains that no bus runs at 5 a.m. and describes the ban as a measure “designed by people who live in the centre” (doc. 3). The cartoonist (doc. 4) makes the same point visually, contrasting a green, cyclist-friendly centre with grey suburbs stuck in traffic behind a wall. Even the enthusiastic news report (doc. 1) concedes that deliveries have become harder. In other words, giving up the car is easiest for those who already have alternatives.</em></p>
    <p>Phrase d'idée (1ʳᵉ phrase) ; appui chiffré (doc. 2) ; confrontation avec un témoignage (doc. 3), puis avec une image qui le confirme (<em>makes the same point</em>) et avec la concession d'un document favorable (<em>even… concedes</em>) ; bilan (<em>In other words</em>).</p>
  </div>
  <h3>Renvoyer aux documents</h3>
  <ul>
    <li>La première fois, la nature et l'auteur ou la source (<em>in her op-ed, a night nurse…</em>) ; ensuite, <em>(doc. 3)</em> suffit.</li>
    <li>Tournures : <em>as document 2 shows</em> · <em>according to the author of document 1</em> · <em>the figures in document 2 confirm / contradict…</em> · <em>the cartoonist (doc. 4) mocks…</em> · <em>both documents 1 and 4 point out that…</em></li>
    <li>Temps : le <strong>présent</strong> pour ce que disent les documents (<em>argues</em>, <em>shows</em>, <em>warns</em>) ; le prétérit pour les faits datés qu'ils rapportent (<em>car use fell between 2015 and 2025</em>).</li>
  </ul>
  <h3>Citer court</h3>
  <p>Une citation est <strong>courte</strong> (quelques mots), <strong>entre guillemets</strong>, <strong>intégrée</strong> à ta phrase et suivie du renvoi : <em>the nurse calls it a ban “designed by people who live in the centre” (doc. 3)</em>. Une ou deux par synthèse suffisent : le jury évalue <strong>ton</strong> anglais, et une longue citation consomme des mots qui ne sont pas les tiens. Reformuler est presque toujours mieux : <em>the nurse argues that the policy only reflects the needs of central residents</em>. Guillemets : doubles “ ” en anglais américain, souvent simples ‘ ’ en anglais britannique ; garde le même usage partout.</p>
  <h3>Les connecteurs de la confrontation</h3>
  <p>Ils sont détaillés dans <a href="#enconnect/cours">« Connecteurs logiques »</a> ; voici ceux qui servent le plus à faire dialoguer des documents.</p>
  <div>
  <table>
    <tr><th>Relation</th><th>Connecteurs</th></tr>
    <tr><td>Accord</td><td><em>similarly, likewise, in the same vein, both X and Y…, X echoes Y, X confirms Y</em></td></tr>
    <tr><td>Complément</td><td><em>moreover, what is more, not only… but also…, X goes further than Y</em></td></tr>
    <tr><td>Opposition</td><td><em>whereas, while, by contrast, on the other hand, unlike X, Y…, X is at odds with Y</em></td></tr>
    <tr><td>Concession</td><td><em>admittedly, although, even though, granted, X concedes that…</em></td></tr>
    <tr><td>Conséquence</td><td><em>therefore, as a result, consequently, hence</em></td></tr>
  </table>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LA CONCLUSION</div>
  <h2>Rédiger la conclusion</h2>
  <div class="intro">La conclusion (≈ 40 à 60 mots) <strong>répond</strong> à la problématique, en une ou deux phrases qui reprennent le bilan des documents. Elle n'apporte ni document nouveau, ni argument nouveau, ni avis personnel.</div>
  <div class="method-box"><strong>Exemple — conclusion du dossier Norbridge</strong> (60 mots)
    <p lang="en"><em>All in all, the documents suggest that reducing car use is both possible and beneficial for city centres. However, the shift is fair only if it comes with alternatives for those who cannot do without a car, such as suburban night workers. The question is less whether cars should leave city centres than how fast alternatives can reach the suburbs.</em></p>
    <p>Réponse nuancée à la problématique (<em>both possible and beneficial… However… only if…</em>), tirée des quatre documents, sans « je ».</p>
  </div>
  <div class="prop-box"><strong>Amorces</strong> : <em>All in all, the documents suggest that…</em> · <em>Ultimately, X is less a… than a…</em> · <em>In the end, … depends on…</em> · <em>The documents agree that…, but differ on…</em></div>
  <div class="notice"><strong>Ouverture</strong> : facultative et risquée. Si tu en fais une, tire-la du dossier (une question qu'un document laisse ouverte), en une phrase, sans avis. Une fin du type <em>In conclusion, I think that…</em> ou <em>we must all act now</em> transforme la synthèse en essai.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · L'ANGLAIS DE LA SYNTHÈSE</div>
  <h2>L'anglais de la synthèse : rapporter, comparer, nuancer</h2>
  <div class="intro">Une synthèse passe son temps à rapporter des points de vue. Varier les verbes introducteurs, et les construire correctement, est la façon la plus sûre de montrer ton niveau d'anglais tout en restant objectif.</div>
  <h3>Rapporter un point de vue</h3>
  <div>
  <table>
    <tr><th>Verbe</th><th>Construction</th><th>Sens, nuance</th></tr>
    <tr><td><em>argue</em></td><td><em>argue that…</em></td><td>soutenir, avec des arguments</td></tr>
    <tr><td><em>claim</em></td><td><em>claim that…</em></td><td>affirmer, sans preuve : tu prends tes distances</td></tr>
    <tr><td><em>contend, maintain</em></td><td><em>contend that…</em></td><td>soutenir avec force (registre soutenu)</td></tr>
    <tr><td><em>point out</em></td><td><em>point out that…</em></td><td>faire remarquer</td></tr>
    <tr><td><em>stress, emphasise</em> (US <em>emphasize</em>)</td><td><em>stress that…</em>, <em>stress the need for…</em></td><td>insister sur</td></tr>
    <tr><td><em>warn</em></td><td><em>warn against</em> + V-ing ou nom, <em>warn that…</em></td><td>mettre en garde</td></tr>
    <tr><td><em>call for</em></td><td><em>call for</em> + nom</td><td>réclamer, appeler à (<em>she calls for stricter rules</em>)</td></tr>
    <tr><td><em>acknowledge, concede, admit</em></td><td><em>concede that…</em></td><td>reconnaître, concéder</td></tr>
    <tr><td><em>question, challenge</em></td><td><em>question</em> + nom</td><td>mettre en doute, contester</td></tr>
    <tr><td><em>dismiss</em></td><td><em>dismiss</em> + nom + <em>as…</em></td><td>rejeter, balayer (<em>he dismisses the plan as unrealistic</em>)</td></tr>
    <tr><td><em>welcome, praise</em></td><td><em>welcome</em> + nom</td><td>saluer, se réjouir de</td></tr>
    <tr><td><em>suggest</em></td><td><em>suggest that sb (should) do</em>, <em>suggest</em> + V-ing</td><td>suggérer (jamais <em>suggest to do</em>)</td></tr>
  </table>
  </div>
  <h3>Comparer et opposer</h3>
  <ul>
    <li><em>whereas</em>, <em>while</em> + proposition : <em>Whereas the article praises the scheme, the nurse denounces it.</em></li>
    <li><em>unlike</em> + nom : <em>Unlike the journalist, the nurse…</em> ; <em>contrary to</em> + nom = contrairement à.</li>
    <li><em>on the contrary</em> = au contraire, pour contredire ce qui précède, souvent après une négation : <em>The scheme is not costly; on the contrary, it saves money.</em> Pour opposer deux documents, écris <em>by contrast</em> ou <em>on the other hand</em>.</li>
    <li><em>X echoes Y</em> (fait écho à), <em>X shares Y's view</em>, <em>X takes the opposite view</em>, <em>X is at odds with Y</em> (en contradiction avec).</li>
  </ul>
  <h3>Nuancer</h3>
  <p><em>arguably</em> (on peut soutenir que) · <em>to some extent</em> · <em>partly</em>, <em>largely</em> · <em>at least in the short term</em> · <em>it remains unclear whether…</em> · les modaux <em>may, might, could</em> (voir <a href="#engrammod/cours">« Modaux »</a>). Nuancer n'est pas donner son avis : c'est rendre compte de la prudence des documents, ou des limites de leurs chiffres.</p>
  <h3>Les erreurs fréquentes des francophones</h3>
  <div>
  <table>
    <tr><th>À éviter</th><th>À écrire</th><th>Pourquoi</th></tr>
    <tr><td><em>informations, advices, researches, evidences, progresses, equipments</em></td><td><em>information, advice, research, evidence, progress, equipment</em></td><td>indénombrables : ni pluriel, ni <em>a</em> (<em>a piece of information</em>)</td></tr>
    <tr><td><em>The documents talk about…</em></td><td><em>The documents deal with / address / focus on…</em></td><td><em>talk about</em> est familier</td></tr>
    <tr><td><em>This allows to reduce…</em></td><td><em>This makes it possible to reduce…</em>, <em>this allows cities to reduce…</em></td><td><em>allow, enable, permit</em> veulent un complément</td></tr>
    <tr><td><em>It exists many solutions.</em></td><td><em>There are many solutions.</em></td><td>calque de « il existe »</td></tr>
    <tr><td><em>In a first time…</em></td><td><em>First,…</em> ou <em>Firstly,…</em></td><td>calque de « dans un premier temps »</td></tr>
    <tr><td><em>The author explains us that…</em></td><td><em>The author explains that…</em> (ou <em>explains to us</em>)</td><td><em>explain</em> n'a pas de complément direct de personne</td></tr>
    <tr><td><em>depend of, be interested by, a rise of prices</em></td><td><em>depend on, be interested in, a rise in prices</em></td><td>prépositions</td></tr>
    <tr><td><em>a very actual issue</em></td><td><em>a topical issue</em>, <em>a current issue</em></td><td>faux-ami : <em>actual</em> = réel (voir <a href="#engramfa/cours">« Faux-amis »</a>)</td></tr>
    <tr><td><em>Since 2015, car use fell.</em></td><td><em>Since 2015, car use has fallen.</em></td><td><em>since</em> → <em>present perfect</em> ; avec une date révolue (<em>in 2015</em>), prétérit</td></tr>
    <tr><td><em>People is…, the police is…</em></td><td><em>People are…, the police are…</em></td><td>noms pluriels en anglais</td></tr>
    <tr><td><em>a 20 percents rise, a three-hours exam</em></td><td><em>a 20 per cent rise</em> (US <em>percent</em>), <em>a three-hour exam</em></td><td>adjectif composé invariable</td></tr>
    <tr><td><em>economical growth</em></td><td><em>economic growth</em></td><td><em>economic</em> = de l'économie ; <em>economical</em> = économe, peu coûteux</td></tr>
    <tr><td><em>According to me…</em></td><td>(rien : pas d'avis en synthèse)</td><td>à l'oral, on dit <em>in my view</em></td></tr>
  </table>
  </div>
  <div class="notice"><strong>Orthographe</strong> : choisis l'anglais britannique ou l'anglais américain et tiens-t'y dans toute la copie : <em>-ise / -ize</em> (<em>emphasise / emphasize</em>), <em>-our / -or</em> (<em>behaviour / behavior</em>), <em>centre / center</em>, <em>programme / program</em>.</div>
</div>

<div class="course-section">

  <h3>Compter les mots</h3>
  <ul>
    <li><strong>Convention usuelle</strong> : un mot est un groupe de caractères entre deux espaces ; <em>don't</em>, <em>e-scooter</em> ou <em>2025</em> comptent pour un mot, le renvoi <em>(doc. 2)</em> pour deux. Ce qui entre exactement dans le décompte (titre, renvois, citations) : vérifie dans la notice et le dernier rapport du jury.</li>
    <li><strong>Pendant la rédaction</strong>, tiens un budget par paragraphe dans la marge du brouillon : introduction ≈ 80 mots, deux parties de ≈ 165 mots (ou trois de ≈ 110), conclusion ≈ 55 mots, soit 465 à 480 mots.</li>
    <li><strong>À la fin</strong>, compte exactement, paragraphe par paragraphe, en pointant les mots au crayon par groupes de dix, puis additionne. Une estimation (mots d'une ligne moyenne × nombre de lignes) sert à se repérer en cours de route ; elle ne remplace pas le comptage.</li>
    <li><strong>Vise le milieu de la fourchette</strong> (470 à 490 mots pour 450 à 500) : une petite erreur de comptage ne te fera pas sortir des limites.</li>
  </ul>
  <div class="notice">Écris lisiblement, saute une ligne entre les paragraphes et marque les alinéas : le correcteur doit voir ton plan au premier coup d'œil. Indique le nombre de mots en fin de copie si la notice le demande.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · LES ERREURS CLASSIQUES</div>
  <h2>Les erreurs classiques, et comment les éviter</h2>
  <div class="intro">On retrouve ces erreurs dans toutes les épreuves de synthèse. La plupart se repèrent à la relecture, à condition de les chercher.</div>
  <div>
  <table>
    <tr><th>Erreur</th><th>Remède</th></tr>
    <tr><td>Résumer les documents l'un après l'autre.</td><td>Plan par idées et tableau de confrontation (§4) ; chaque paragraphe cite au moins deux documents.</td></tr>

<div class="course-section">
  <div class="sec-num">MÉTHODES · SYNTHÈSE (ÉCRIT)</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Huit fiches réflexes, dans l'ordre de l'épreuve, à appliquer le jour du concours. Les exemples éclair s'appuient sur un mini-dossier <strong>fictif</strong> sur le télétravail : doc. 1, article d'un quotidien économique (2025) sur des entreprises qui gagnent en productivité et en surface de bureaux ; doc. 2, sondage : 61&nbsp;% des salariés veulent au moins deux jours de télétravail par semaine ; doc. 3, tribune d'une directrice des ressources humaines inquiète de l'isolement des jeunes recrues ; doc. 4, dessin de presse : un open space vide où un seul stagiaire parle à une plante verte.</div>

  <div class="method-box"><strong>Méthode 1 — Analyser un document iconographique</strong>
    <ol>
      <li><span class="step">Identifier.</span> Nature (<em>line graph, bar chart, pie chart, map, cartoon, photograph</em>), source (institut, journal, dessinateur), date.</li>
      <li><span class="step">Graphique.</span> Titre, unité, période, échelle ; puis la tendance générale, deux ou trois valeurs remarquables, une comparaison ; enfin ce qu'il ne montre pas (la cause, l'avenir, un autre pays…).</li>
      <li><span class="step">Dessin ou photo.</span> Ce qu'on voit (personnages, objets, légende, bulle), le procédé (exagération, contraste, détournement), la <strong>cible</strong>, puis le <strong>message</strong> en une phrase.</li>
      <li><span class="step">Relier.</span> Quel texte confirme-t-il, lequel contredit-il ? Le noter en marge (« = doc. n », « ≠ doc. n »).</li>
      <li><span class="step">Écrire la phrase-résumé en anglais</span>, celle qui entrera dans la synthèse.</li>
    </ol>
    <p><em>Exemple éclair :</em> une courbe (fictive) montre le prix d'un pack de batteries passer de 780 à 140 dollars par kWh entre 2013 et 2023. Phrase-résumé : <em>The graph (doc. 3) shows that battery prices fell by more than 80% in ten years.</em> (de 780 à 140, la baisse est de 640/780 ≈ 82&nbsp;%.) Pour le dessin du télétravail : <em>The cartoonist (doc. 4) mocks the empty open-plan office, where the only remaining intern talks to a pot plant.</em></p>
  </div>
  <div class="notice"><strong>Piège</strong> : décrire l'image en détail (<em>in the foreground… in the background…</em>) comme en colle. En synthèse, une proposition sur ce qu'elle montre et ce qu'elle dénonce suffit ; le reste des mots va à la confrontation.</div>

  <div class="method-box"><strong>Méthode 2 — Formuler une problématique</strong>
    <ol>
      <li><span class="step">Le thème</span> en quelques mots, commun à tous les documents.</li>
      <li><span class="step">Les points de vue</span> : une ligne par document (pour, contre, nuancé, factuel).</li>
      <li><span class="step">La tension</span> : désaccord, paradoxe, promesse et limites, intérêts opposés (de qui ?).</li>
      <li><span class="step">La question</span>, ouverte : <em>To what extent…?</em>, <em>How far…?</em>, <em>Can… without…?</em>, <em>Is… or merely…?</em></li>
      <li><span class="step">Le test</span> : tous les documents aident-ils à répondre ? La réponse peut-elle être nuancée ? La question impose-t-elle un avis ? Si un document reste à l'écart, élargir ; si la réponse est « oui » ou « non », reformuler.</li>
    </ol>
    <p><em>Exemple éclair :</em> thème : le télétravail ; tension : liberté et productivité (docs 1, 2) contre isolement et perte du collectif (docs 3, 4). Problématique : <em>Can remote work meet employees' expectations without weakening the workplace as a community?</em></p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Faire le tableau de confrontation</strong>
    <ol>
      <li><span class="step">Colonnes.</span> Une par document (doc. 1 à doc. 5), au brouillon, sur une page en largeur.</li>
      <li><span class="step">Lignes.</span> Quatre à six idées ou aspects : avantages, coûts, acteurs concernés, risques, solutions, conditions…</li>
      <li><span class="step">Cases.</span> Un signe (+, −, =), un chiffre clé, ou trois ou quatre mots à citer, avec la ligne du texte pour les retrouver.</li>
      <li><span class="step">Lecture.</span> Les lignes où plusieurs documents se répondent deviennent les paragraphes ; on les regroupe en deux ou trois parties. Une colonne vide ? Ce document doit trouver sa place.</li>
      <li><span class="step">Plan détaillé.</span> Pour chaque paragraphe : la phrase d'idée en anglais et les documents utilisés.</li>
    </ol>
    <p><em>Exemple éclair :</em> ligne « Productivité » du télétravail : doc. 1 + (moins d'interruptions, bureaux réduits) ; doc. 2 rien ; doc. 3 − (moins d'échanges informels, apprentissage plus lent des jeunes) ; doc. 4 − (bureau vide, ironie). Les docs 1 et 3 s'opposent : c'est un paragraphe.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Rédiger l'introduction</strong>
    <ol>
      <li><span class="step">Accroche</span> : un fait ou un chiffre du dossier, avec son renvoi.</li>
      <li><span class="step">Présentation groupée</span> : <em>Made up of…, this set of documents examines / deals with…</em> (nature, source, date, thème).</li>
      <li><span class="step">Problématique</span> au style indirect, sans inversion : <em>It raises the question of whether…</em></li>
      <li><span class="step">Annonce du plan</span> : <em>This synthesis first examines…, before turning to…</em></li>
      <li><span class="step">Contrôle</span> : 70 à 90 mots ; aucun avis ; aucun document décrit à part.</li>
    </ol>
    <p><em>Exemple éclair</em> (80 mots) : <em>Some 61% of employees now want to work from home at least two days a week (doc. 2). Made up of a business article, a survey, an op-ed by a human resources director and a cartoon, all from 2025, this set of documents examines the rise of remote work. It raises the question of whether remote work can meet employees' expectations without weakening the workplace as a community. This synthesis first examines its benefits, before turning to its human costs.</em></p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Rédiger une partie</strong>
    <ol>
      <li><span class="step">Phrase d'idée</span> : l'idée directrice, dans tes mots, sans nommer de document.</li>
      <li><span class="step">Appui</span> : un premier document, avec sa nature et son renvoi.</li>
      <li><span class="step">Confrontation</span> : un deuxième document relié par un connecteur (<em>similarly, whereas, by contrast, echoing…</em>).</li>
      <li><span class="step">Nuance</span> : une concession, une limite, un chiffre qui relativise.</li>
      <li><span class="step">Bilan</span> : une phrase qui tire la leçon ou prépare la partie suivante.</li>
      <li><span class="step">Contrôle</span> : au moins deux documents, aucun avis, ≈ 160 mots (deux parties) ou ≈ 110 (trois).</li>
    </ol>
    <p><em>Exemple éclair :</em> <em>Remote work seems to benefit employers as much as employees. According to a business daily, companies report fewer interruptions and have reduced their office space (doc. 1). Yet this gain is disputed: a human resources director argues that young recruits learn more slowly without informal exchanges with colleagues (doc. 3), a point the cartoonist makes by depicting an intern talking to a pot plant in an empty office (doc. 4).</em></p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Rédiger la conclusion</strong>
    <ol>
      <li><span class="step">Relire la problématique</span> de l'introduction.</li>
      <li><span class="step">Y répondre</span> en une phrase nuancée : <em>… is less… than…</em>, <em>… only if…</em>, <em>… depends on…</em></li>
      <li><span class="step">Rappeler l'essentiel</span> en une phrase : ce sur quoi les documents s'accordent, ce sur quoi ils divergent.</li>
      <li><span class="step">Ouverture</span> facultative, tirée du dossier, sans avis.</li>
      <li><span class="step">Contrôle</span> : 40 à 60 mots, aucun élément nouveau, ni <em>I</em> ni <em>we must</em>.</li>
    </ol>
    <p><em>Exemple éclair</em> (47 mots) : <em>All in all, the documents suggest that remote work is less a threat to companies than a balance to be found. Its benefits are real, but they depend on keeping enough time together at the office, especially for young employees who still need to learn from others.</em></p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Relire en 10 minutes</strong>
    <ol>
      <li><span class="step">Le fond (2 min).</span> Chaque document est-il cité ? La problématique est-elle reprise dans la conclusion ? Aucun avis, aucune connaissance extérieure ?</li>
      <li><span class="step">Les verbes (3 min).</span> Le <em>-s</em> de la 3ᵉ personne (<em>the author argues</em>), le présent pour ce que disent les documents, <em>since</em> + <em>present perfect</em>, les verbes irréguliers (<em>fell</em>, <em>rose</em>).</li>
      <li><span class="step">Les noms (2 min).</span> Indénombrables (<em>information, research, evidence</em>), pas de <em>the</em> devant un nom pris au sens général (<em>Pollution is…</em>, et non <em>The pollution is…</em>), accords des pluriels.</li>
      <li><span class="step">Les petits mots (2 min).</span> Prépositions (<em>depend on, an increase in</em>), faux-amis (<em>actual, eventually</em>), connecteurs.</li>
      <li><span class="step">L'orthographe (1 min).</span> Noms propres des sources et des auteurs, cohérence de l'anglais britannique ou américain.</li>
    </ol>
    <p><em>Exemple éclair :</em> <em>“The author explain that the informations on remote work are very actual.”</em> → <em>“The author explains that the information on remote work is very topical.”</em> (trois fautes : le <em>-s</em> de <em>explains</em>, l'indénombrable <em>information</em> avec un verbe au singulier, le faux-ami <em>actual</em>).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Compter les mots</strong>
    <ol>
      <li><span class="step">Fixer le budget</span> avant d'écrire : introduction ≈ 80 mots, deux parties de ≈ 165 (ou trois de ≈ 110), conclusion ≈ 55.</li>
      <li><span class="step">Noter en marge</span> du brouillon le nombre de mots de chaque paragraphe rédigé, et le total cumulé.</li>
      <li><span class="step">Compter exactement à la fin</span>, paragraphe par paragraphe, par groupes de dix mots pointés au crayon. Convention usuelle : un mot = un groupe de caractères entre deux espaces (<em>don't</em>, <em>e-scooter</em>, <em>2025</em> : un mot) ; pour le titre, les renvois et les citations, vérifie la notice.</li>
      <li><span class="step">Ajuster.</span> Trop long : supprimer une citation, un exemple redondant, des adverbes vides (<em>very, really, actually</em>). Trop court : ajouter une confrontation (un chiffre, une concession d'un document), jamais du remplissage.</li>
      <li><span class="step">Indiquer le total</span> en fin de copie si la notice le demande.</li>
    </ol>
    <p><em>Exemple éclair :</em> 84 + 171 + 176 + 61 = 492 mots : dans la fourchette, mais près du plafond. Retirer la citation de 9 mots de la partie II et l'adverbe <em>really</em> ramène à 482 mots : une marge de sécurité de part et d'autre.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : estimer le nombre de mots sur une seule ligne et multiplier. Les lignes varient beaucoup (citations, chiffres, mots longs) : l'estimation peut se tromper de 30 ou 40 mots, assez pour sortir de la fourchette.</div>
</div>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Trouver la problématique d'un dossier : la voiture électrique</h3>
  <div class="statement">
    <p>Voici un dossier <strong>fictif</strong> de quatre documents, tel que tu pourrais le noter au brouillon après la lecture (journaux, institut et chiffres inventés).</p>
    <ul>
      <li><strong>Doc. 1</strong> — <em>“Electric cars hit the fast lane”</em>, article, <em>The Business Chronicle</em> (quotidien économique fictif), 2025 : les ventes de voitures électriques s'envolent, le prix des batteries a été divisé par deux en cinq ans, un grand constructeur arrêtera de vendre des voitures à essence en Europe en 2030.</li>
      <li><strong>Doc. 2</strong> — extrait d'un rapport de l'ONG <em>Fair Minerals Watch</em> (fictive), 2024 : l'extraction du lithium assèche des nappes d'eau dans des déserts de sel, le cobalt est en partie extrait dans des conditions dangereuses, le recyclage des batteries reste rare.</li>
      <li><strong>Doc. 3</strong> — graphique d'un institut de recherche (fictif), 2025 : émissions de CO₂ d'une voiture moyenne sur toute sa vie (fabrication et usage) : 45 t pour une voiture à essence, 38 t pour une électrique rechargée avec une électricité très carbonée, 16 t avec une électricité bas carbone ; la fabrication de la voiture électrique émet davantage, à cause de la batterie.</li>
      <li><strong>Doc. 4</strong> — dessin de presse (fictif), 2025 : un conducteur souriant dans une voiture électrique rutilante, autocollant <em>“Zero emissions”</em> sur la portière ; le câble de la borne mène à une centrale à charbon qui fume.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Dégage le thème commun, puis le point de vue de chaque document en une phrase anglaise.</div>
  <div class="q"><strong>Q2.</strong> Évalue chacune de ces problématiques : (a) <em>What is an electric car?</em> (b) <em>Are electric cars good for the planet?</em> (c) <em>Why do batteries need lithium and cobalt?</em> (d) <em>Why should governments ban petrol cars as soon as possible?</em> (e) <em>To what extent are electric cars as clean as they are claimed to be?</em></div>
  <div class="q"><strong>Q3.</strong> Propose une autre problématique acceptable et un plan en deux parties, en indiquant les documents utilisés dans chaque partie.</div>
  <div class="q"><strong>Q4.</strong> Récris la problématique (e) au style indirect, après <em>One may wonder…</em></div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Thème commun : le bilan environnemental réel de la voiture électrique.</p>
    <ul lang="en">
      <li><em>Doc. 1: a business daily celebrates the rapid rise of electric cars, made cheaper by falling battery prices.</em></li>
      <li><em>Doc. 2: an NGO warns that battery minerals are extracted at a high human and environmental cost.</em></li>
      <li><em>Doc. 3: the chart shows that an electric car emits less CO₂ over its lifetime than a petrol car, but that the gap depends heavily on how the electricity is produced.</em></li>
      <li><em>Doc. 4: the cartoonist mocks the “zero emissions” label by showing a car powered by a coal plant.</em></li>
    </ul>
    <p><strong>Q2.</strong> (a) Simple définition : rien à débattre, et les docs 2 à 4 n'y répondent pas. (b) Question fermée (oui ou non) et vague (« bonne » selon quel critère ?) ; elle pousse à donner son avis. (c) Trop étroite et technique : elle ne mobilise que le doc. 2. (d) Orientée : elle suppose la réponse, appelle un avis, et le dossier ne parle pas d'interdiction par l'État. (e) <strong>Bonne</strong> : ouverte, elle porte sur la tension du dossier entre l'image « propre » (docs 1 et 4, qui la conteste) et les coûts cachés (docs 2 et 3) ; elle appelle une réponse nuancée (« plus propre, mais à certaines conditions »).</p>
    <p><strong>Q3.</strong> Par exemple : <em>Is the electric car a real answer to the pollution caused by transport, or does it merely move the problem elsewhere?</em> I. Une alternative en plein essor et moins émettrice sur l'ensemble de sa vie (docs 1 et 3). II. Des coûts déplacés : l'électricité qui la recharge et les minerais de ses batteries (docs 2, 3 et 4). Le doc. 3 sert dans les deux parties : c'est normal, et même souhaitable.</p>
    <p><strong>Q4.</strong> <em>One may wonder to what extent electric cars are as clean as they are claimed to be.</em> Pas d'inversion dans une question indirecte : <em>are electric cars</em> devient <em>electric cars are</em>, et pas de point d'interrogation.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Corriger une introduction maladroite : l'IA et l'emploi</h3>
  <div class="statement">
    <p>Un dossier <strong>fictif</strong> de quatre documents porte sur l'intelligence artificielle et le travail :</p>
    <ul>
      <li><strong>Doc. 1</strong> — <em>“Robots don't take coffee breaks”</em>, article de Sarah Kemp, <em>The Daily Meridian</em> (quotidien britannique fictif), mai 2024 : dans un entrepôt, des robots assurent désormais 70&nbsp;% de la préparation des commandes ; quelques salariés sont devenus techniciens, mais le site emploie 40&nbsp;% de personnes en moins.</li>
      <li><strong>Doc. 2</strong> — diagramme en barres du <em>Linwood Institute</em> (groupe de réflexion fictif), 2025 : part des heures de travail automatisables d'ici 2035 selon le métier (55&nbsp;% pour le secrétariat, 15&nbsp;% pour l'enseignement).</li>
      <li><strong>Doc. 3</strong> — tribune d'une ingénieure en logiciel, <em>Tech &amp; Society Review</em> (revue fictive), 2025 : comme les technologies précédentes, l'IA transformera les emplois plus qu'elle ne les détruira, à condition de former les salariés.</li>
      <li><strong>Doc. 4</strong> — dessin de presse (fictif), 2025 : un robot fait passer un entretien d'embauche à un candidat inquiet : <em>“Any experience in being replaced?”</em></li>
    </ul>
    <p>Un candidat a rédigé cette introduction (108 mots) :</p>
  </div>
  <div class="statement" lang="en"><p><em>Since the beginning of humanity, men have always invented machines to work less. Nowadays, artificial intelligence is everywhere and it is a very actual subject. The document 1 is an article from The Daily Meridian written by Sarah Kemp in May 2024, it talks about robots in a warehouse. The document 2 is a graph. The document 3 is an op-ed and the document 4 is a cartoon who shows a robot. According to me, AI will destroy a lot of jobs. In a first time, we will see the advantages of AI and in a second time we will see its inconvenients. Is AI good or bad?</em></p></div>
  <div class="q"><strong>Q1.</strong> Relève au moins huit défauts, de méthode ou de langue, et corrige les fautes d'anglais.</div>
  <div class="q"><strong>Q2.</strong> Récris l'introduction en 70 à 90 mots.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong></p>
    <div>
    <table>
      <tr><th>Défaut</th><th>Correction</th></tr>
      <tr><td><em>Since the beginning of humanity, men have always…</em> : accroche creuse, extérieure au dossier.</td><td>Partir d'un fait du dossier : les 70&nbsp;% du doc. 1.</td></tr>
      <tr><td><em>Nowadays, AI is everywhere</em> : cliché, affirmation sans appui.</td><td>Supprimer.</td></tr>
      <tr><td><em>a very actual subject</em> : faux-ami.</td><td><em>a topical issue</em>.</td></tr>
      <tr><td><em>The document 1</em> : pas d'article devant un nom suivi d'un numéro.</td><td><em>Document 1</em>.</td></tr>
      <tr><td><em>…in May 2024, it talks about…</em> : deux phrases soudées par une virgule.</td><td>Un point, ou une relative : <em>…, which deals with…</em></td></tr>
      <tr><td><em>it talks about</em> : registre familier.</td><td><em>it deals with</em>, <em>it examines</em>.</td></tr>
      <tr><td>Présentation document par document, déséquilibrée : beaucoup sur le doc. 1, rien sur la source ni la date des autres, pas de thème commun.</td><td>Une phrase groupée : nature, sources, dates, thème.</td></tr>
      <tr><td><em>a graph</em> : imprécis pour des barres.</td><td><em>a bar chart</em>.</td></tr>
      <tr><td><em>a cartoon who shows</em> : <em>who</em> réservé aux personnes.</td><td><em>a cartoon which</em> (ou <em>that</em>) <em>shows</em>.</td></tr>
      <tr><td><em>According to me, AI will destroy a lot of jobs</em> : avis personnel, interdit en synthèse ; et <em>according to me</em> n'est pas anglais.</td><td>Supprimer (à l'oral : <em>in my view</em>).</td></tr>
      <tr><td><em>In a first time… in a second time</em>, <em>we will see</em> : calques du français.</td><td><em>This synthesis first examines…, before turning to…</em></td></tr>
      <tr><td><em>inconvenients</em> : n'existe pas comme nom (<em>inconvenient</em> = peu pratique).</td><td><em>drawbacks</em>, <em>disadvantages</em>.</td></tr>
      <tr><td><em>Is AI good or bad?</em> : problématique fermée et vague, placée après l'annonce du plan.</td><td>Une question ouverte, au style indirect, avant l'annonce du plan.</td></tr>
    </table>

<p>The project cost 900 million dollars, and household water bills are expected to rise by about 8% over the next three years. Most residents seem willing to pay. Since the drought of 2019, when taps ran dry for several days in the poorest districts, water security has become the region's top political issue.</p>

    <p><strong>Desalination is a solution, and that is the problem</strong></p>
<p>Desalination plants are often presented as a clean break with drought. As a marine biologist, I see things differently.</p>
<p>For every litre of drinking water it produces, a typical plant returns about one and a half litres of brine to the sea: water roughly twice as salty as the ocean, often warmer, and laced with the chemicals used to clean the membranes. Released near the coast, this heavy plume sinks and spreads across the seabed, where it can smother seagrass meadows and the young fish that shelter in them.</p>
<p>Then there is energy. Turning seawater into drinking water takes several times more electricity than treating river water. A solar farm next door is welcome, but that clean power could have replaced coal elsewhere on the grid.</p>
<p>My deepest concern, however, is political. Once a city believes it can “drink the sea”, the pressure to repair leaking pipes or to rethink thirsty agriculture quietly fades away. Desalination should remain what engineers call a last resort: built only once savings have been made, and under strict rules on where and how brine is discharged.</p>

    <p><strong>Q4.</strong> I. <strong>Une réponse indépendante de la météo, mais coûteuse.</strong> § 1 : la sécurité de l'approvisionnement (docs 1, 4). § 2 : le prix à payer, financier (docs 1, 3), énergétique et environnemental (docs 2, 3, 1). II. <strong>Économiser l'eau d'abord, sans pouvoir s'en contenter.</strong> § 1 : des économies moins chères et efficaces (docs 3, 4, 2). § 2 : leurs limites, qui laissent au dessalement un rôle de dernier recours (docs 4, 3).</p>

    <div lang="en">
      <p><strong>Desalination: miracle cure or last resort?</strong></p>
<p>In Port Arvel, a single plant now turns 150,000 cubic metres of seawater into drinking water every day (doc. 1). Made up of two press articles, an op-ed by a marine biologist and a chart from a water authority, all from 2025, this set of documents examines how regions short of water can secure their supply. It raises the question of whether desalination is the answer to water scarcity or should remain a last resort. This synthesis first considers what desalination offers and at what cost, before turning to the alternative of using less water.</p>
<p>Desalination offers what no other source can: water that does not depend on the weather. A regional newspaper describes a coastal city freed from eleven summers of restrictions, whose mayor rejoices that the ocean “will never run dry” (doc. 1). Even Elmsworth, which chose to save water, keeps a site in reserve for a desalination unit in case of a long drought (doc. 4). This security, however, comes at a price. The Port Arvel plant cost 900 million dollars and will push up water bills (doc. 1), and the chart shows that desalinated seawater is the most expensive source in the region, at 1.15 dollars per cubic metre, as well as the most energy-hungry (doc. 3). The environmental cost is harder to measure: a marine biologist warns that the brine released into the sea can smother seagrass and young fish (doc. 2). She even questions the solar farm put forward in document 1, arguing that its clean power could have replaced coal elsewhere.</p>
<p>This is why several documents present saving water as the first answer. Repairing leaks costs 0.20 dollars per cubic metre saved, less than a fifth of the cost of desalination, at a time when nearly a quarter of the region's water is lost before reaching the taps (doc. 3). Elmsworth shows the potential of this approach: by fixing pipes, installing smart meters and reusing wastewater, it has cut its consumption by 26% despite a growing population (doc. 4). As its water manager puts it, “the cheapest water is the water you don't waste”. Echoing this experience, the marine biologist fears that desalination removes the incentive to repair pipes or to rethink agriculture (doc. 2). Savings nevertheless have limits. They are levelling off in Elmsworth, recycled water costs farmers more than groundwater (docs 3 and 4), and the city's water manager admits that a long drought would still call for desalination. Saving water and desalination thus appear less as rivals than as successive steps.</p>
<p>All in all, the documents suggest that desalination is less a miracle cure than an insurance policy. It guarantees water when the rain fails, but its cost, its energy use and its impact on the sea make it a last resort, to be used once leaks have been repaired and consumption reduced.</p>
    </div>
    <p>À observer : chaque paragraphe part d'une idée et croise trois ou quatre documents ; le graphique est exploité par des chiffres et des comparaisons ; deux citations courtes seulement ; la confrontation est explicite (<em>She even questions the solar farm put forward in document 1</em>, <em>Echoing this experience</em>) ; la conclusion répond à la problématique (<em>less a miracle cure than an insurance policy</em>) sans avis personnel.</p>

  <div class="statement" lang="en">
    <p><strong>Low Earth orbit is a commons. Let's manage it like one</strong></p>
<p>For fifteen years, my job was to keep satellites from crashing into each other. It has become much harder. Low Earth orbit now holds not only thousands of active satellites but also dead ones, spent rocket stages and countless fragments from past collisions. Travelling at about 28,000 kilometres per hour, a piece of debris no bigger than a marble can destroy a satellite, and operators already perform thousands of avoidance manoeuvres every year.</p>
<p>The real danger is a chain reaction: each collision creates new fragments, which make further collisions more likely, until some orbits become unusable for decades. Engineers call it the Kessler syndrome, and it is no longer science fiction.</p>
<p>Yet the rules are weak and national. A company that finds them too strict can simply register its satellites in a more lenient country. Three measures would change this: an obligation to bring every satellite down within five years of the end of its mission, an international body to coordinate traffic, and an orbital fee, paid per satellite, to fund the removal of debris.</p>
<p>Low Earth orbit belongs to no one, like the high seas. Without shared rules, it will go the way of our overfished oceans.</p>
    <p>Marcus Lindqvist, former satellite operations engineer (fictional author), <em>The Weekend Review</em> (fictional weekly), 30 August 2025</p>

  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong></p>
    <ul>
      <li><strong>Doc. 1</strong> : reportage d'un hebdomadaire régional, avril 2025 ; ton enthousiaste, qui relaie le discours de l'opérateur. <em>Satellite internet has transformed life in a remote village, and its operator plans thousands more satellites.</em></li>
      <li><strong>Doc. 2</strong> : article d'un magazine scientifique, juin 2025 ; inquiet, il donne la parole aux astronomes. <em>Astronomers complain that satellite trails and radio interference are damaging their research and the night sky, despite operators' efforts.</em></li>
      <li><strong>Doc. 3</strong> : graphique d'un organisme de recensement, 2025 ; factuel. <em>The number of active satellites has soared since 2019, mainly because of large commercial constellations.</em></li>
      <li><strong>Doc. 4</strong> : tribune d'un ancien ingénieur des opérations satellites, août 2025 ; alarmiste mais argumentée, avec des propositions. <em>A former engineer warns that debris could trigger a chain of collisions and calls for binding international rules.</em></li>
      <li><strong>Doc. 5</strong> : dessin de presse, 2025 ; satirique. <em>The cartoonist mocks the overcrowding of low Earth orbit, which robs astronomers of the stars.</em></li>
    </ul>
    <p><strong>Q2.</strong> <em>The number of active satellites rose from about 1,400 in 2015 to 12,000 in 2025, an increase by a factor of more than eight, with a sharp acceleration after 2019. Over the same period, the satellites of large commercial constellations soared from about 100 to 9,300.</em> En 2025, les constellations représentent 9&nbsp;300 / 12&nbsp;000 ≈ 78&nbsp;% des satellites actifs (<em>more than three quarters</em>). Depuis 2019, le total a augmenté de 12&nbsp;000 − 2&nbsp;300 = 9&nbsp;700 et les constellations de 9&nbsp;300 − 400 = 8&nbsp;900 : elles expliquent 8&nbsp;900 / 9&nbsp;700 ≈ 92&nbsp;% de la hausse.</p>
    <p><strong>Q3.</strong> La cible : l'encombrement de l'orbite basse par les satellites commerciaux, traité comme un embouteillage d'heure de pointe (klaxons, panneau de parking « complet »). Le message : cette ruée prive les astronomes, et tout le monde avec eux, du ciel étoilé. Le dessin fait écho au doc. 2 (pollution lumineuse) et au doc. 4 (saturation, risque de collisions), il donne un visage à la courbe du doc. 3 et contredit l'enthousiasme du doc. 1.</p>

    <p>Problématique : <em>Can the commercial boom in low Earth orbit continue without endangering a space that belongs to everyone?</em></p>
    <p><strong>Q5.</strong> I. <strong>Un essor porteur de bénéfices réels</strong> : l'explosion du nombre de satellites, due aux constellations (doc. 3) ; ce qu'elles apportent aux régions isolées et le discours de l'opérateur (doc. 1). II. <strong>Un environnement commun sous pression</strong> : le ciel des astronomes (docs 2 et 5) ; le risque de collisions en chaîne (doc. 4). III. <strong>Quelles règles ?</strong> Efforts volontaires jugés insuffisants (doc. 2), règles internationales contraignantes (doc. 4) ; l'idée commune d'un bien partagé (docs 2 et 4).</p>
    <p><strong>Q6.</strong> Une synthèse possible (476 mots : 91 + 100 + 124 + 112 + 49, titre non compté) :</p>
    <div lang="en">
      <p><strong>Low Earth orbit: a new frontier or a crowded commons?</strong></p>
<p>In ten years, the number of active satellites orbiting the Earth has risen from about 1,400 to 12,000 (doc. 3). Made up of two press articles, an op-ed by a former satellite engineer, a chart and a cartoon, all from 2025, this set of documents examines the commercial rush to low Earth orbit. It raises the question of whether this boom can continue without endangering a space that belongs to everyone. This synthesis considers its benefits, then the threats it poses, and finally the rules that might reconcile growth and protection.</p>
<p>The boom is driven by large commercial constellations, whose satellites rose from about 400 in 2019 to 9,300 in 2025, more than three quarters of the total (doc. 3). It brings tangible benefits. In a remote village, a satellite dish has given teenagers access to online lessons, enabled video consultations with doctors and kept the community connected when a storm cut the phone lines (doc. 1). The operator's chief executive even calls connectivity “a basic right”, which only constellations can extend to the most isolated. With 30,000 more satellites planned by this company alone, the growth seems far from over.</p>
<p>Yet this growth puts pressure on an environment shared by all. At a major observatory, over a third of the images taken at twilight are now crossed by satellite trails, while radio telescopes suffer from interference (doc. 2). The cartoonist sums up this frustration: beneath a traffic jam of honking satellites and a sign announcing that low Earth orbit is “full”, an astronomer complains that he now counts satellites instead of stars (doc. 5). A former satellite engineer points to an even greater risk: debris travelling at 28,000 kilometres per hour can destroy a satellite, and a chain of collisions could make some orbits unusable for decades (doc. 4). In other words, the more crowded the orbit, the more fragile the services it provides.</p>
<p>The documents therefore raise the question of rules. Some operators have taken voluntary steps, such as darker paint or sun visors, but astronomers consider them insufficient (doc. 2). The former engineer goes further: since national rules are easy to dodge, he calls for an international traffic authority, an obligation to deorbit satellites within five years and a fee to fund debris removal (doc. 4). Their demands differ in scope: astronomers mainly want to be consulted before the sky is filled, whereas the engineer wants binding rules backed by a fee. Both share the view that orbit, like the night sky, is a common good that no company should fill without asking others.</p>
<p>All in all, the documents suggest that the commercial use of low Earth orbit is not a threat in itself. Its benefits, from village schools to remote health care, are real, but they can only last if space is managed as a commons, under shared and binding international rules.</p>
    </div>
