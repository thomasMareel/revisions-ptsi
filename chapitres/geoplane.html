<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Longueur et courbure d'un cercle</h3>
  <div class="statement">Soit \(r \gt 0\) et \(M(t) = (r\cos t,\ r\sin t)\), \(t \in [0, 2\pi]\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la longueur de la courbe.</div>
  <div class="q"><strong>Q2.</strong> Déterminer le repère de Frenet, la courbure, le rayon et le centre de courbure.</div>
  <div class="q"><strong>Q3.</strong> Reprendre Q2 pour le paramétrage \(t \mapsto (r\cos t,\ -r\sin t)\) du même cercle.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\overrightarrow{M'(t)} = r(-\sin t, \cos t)\), de norme \(\sqrt{r^2\sin^2 t + r^2\cos^2 t} = r\). Donc \(L = \displaystyle\int_0^{2\pi} r\,\mathrm{d}t = 2\pi r\).</p>
  <p><strong>Q2.</strong> \(\vec T = (-\sin t, \cos t)\) et \(\vec N = (-\cos t, -\sin t)\), qui pointe vers le centre. Comme \(\vec T = \big(\cos(t + \tfrac\pi2), \sin(t + \tfrac\pi2)\big)\), \(\alpha = t + \tfrac\pi2\) et \(\gamma = \dfrac{\alpha'(t)}{\mathrm{d}s/\mathrm{d}t} = \dfrac1r\). Rayon de courbure \(R = r\), centre \(C = M + r\,\vec N = O\) : le cercle de courbure est le cercle lui-même.</p>
  <p><strong>Q3.</strong> Le cercle est maintenant parcouru dans le sens indirect : \(\overrightarrow{M'(t)} = r(-\sin t, -\cos t)\), \(\vec T = (-\sin t, -\cos t)\), \(\vec N = (\cos t, -\sin t)\). Alors \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}t} = (-\cos t, \sin t) = -\vec N\), d'où \(r\,\gamma = -1\) : \(\gamma = -\dfrac1r\) et \(R = -r\). Le centre \(C = M + R\,\vec N = M - r\,\vec N\) est encore \(O\). Seul le signe de la courbure dépend de l'orientation ; le centre et le cercle de courbure n'en dépendent pas.</p></div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Courbure d'une parabole, développée</h3>
  <div class="statement">Soit \(\mathcal{P}\) la parabole d'équation \(y = x^2\), paramétrée par \(x \mapsto (x, x^2)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la courbure au point d'abscisse \(x\), puis au sommet ; préciser le cercle osculateur en \(O\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le centre de courbure au point d'abscisse \(x\), et une équation cartésienne de la développée.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(f'(x) = 2x\), \(f''(x) = 2\), d'où \(\gamma(x) = \dfrac{2}{(1 + 4x^2)^{3/2}} \gt 0\) : la parabole tourne toujours à gauche (elle est convexe). Au sommet \(x = 0\) : \(\gamma = 2\), rayon de courbure \(R = \tfrac12\), centre \(C = \big(0, \tfrac12\big)\) ; le cercle osculateur a pour équation \(x^2 + \big(y - \tfrac12\big)^2 = \tfrac14\). Quand \(|x| \to +\infty\), \(\gamma \to 0\) : la parabole s'aplatit.</p>
  <p><strong>Q2.</strong> \(\vec N = \dfrac{(-2x, 1)}{\sqrt{1 + 4x^2}}\) et \(R = \tfrac12(1 + 4x^2)^{3/2}\), donc</p>
  <div class="formula">$$\begin{aligned} C &= (x, x^2) + \frac{1 + 4x^2}{2}\,(-2x, 1) \\ &= \Big(-4x^3,\ 3x^2 + \frac12\Big). \end{aligned}$$</div>
  <p>Avec \(X = -4x^3\) et \(Y = 3x^2 + \tfrac12\) : \(x^2 = \tfrac{Y - 1/2}{3}\) et \(X^2 = 16x^6\), d'où l'équation \(27X^2 = 16\big(Y - \tfrac12\big)^3\). La développée a une pointe en \(\big(0, \tfrac12\big)\), centre de courbure du sommet.</p></div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Longueur d'une arche de cycloïde</h3>
  <div class="statement">\(M(t) = (t - \sin t,\ 1 - \cos t)\), \(t \in [0, 2\pi]\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la longueur de l'arche.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'abscisse curviligne \(s\) d'origine le sommet \(M(\pi)\).</div>
  <div class="q"><strong>Q3.</strong> Le cours donne \(\alpha = \tfrac\pi2 - \tfrac t2\) sur \(]0, 2\pi[\). Exprimer \(s\) en fonction de \(\alpha\), et en déduire de nouveau la courbure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(x' = 1 - \cos t\) et \(y' = \sin t\), donc</p>
  <div class="formula">$$\begin{aligned} \big\|\overrightarrow{M'}\big\|^2 &= (1 - \cos t)^2 + \sin^2 t \\ &= 2(1 - \cos t) = 4\sin^2\frac t2. \end{aligned}$$</div>
  <p>Sur \([0, 2\pi]\), \(\sin(t/2) \geq 0\), donc \(\big\|\overrightarrow{M'}\big\| = 2\sin(t/2)\) et</p>
  <div class="formula">$$L = \int_0^{2\pi} 2\sin\frac t2\,\mathrm{d}t = \Big[-4\cos\frac t2\Big]_0^{2\pi} = 8.$$</div>
  <p><strong>Q2.</strong> \(s(t) = \displaystyle\int_\pi^t 2\sin\frac u2\,\mathrm{d}u = -4\cos\frac t2\) : \(s\) va de \(-4\) (en \(t = 0\)) à \(4\) (en \(t = 2\pi\)), et l'on retrouve \(L = 8\).</p>
  <p><strong>Q3.</strong> \(\cos\frac t2 = \cos\big(\tfrac\pi2 - \alpha\big) = \sin\alpha\), donc \(s = -4\sin\alpha\). Alors \(\dfrac{\mathrm{d}s}{\mathrm{d}\alpha} = -4\cos\alpha\) et \(\gamma = \dfrac{\mathrm{d}\alpha}{\mathrm{d}s} = -\dfrac{1}{4\cos\alpha} = -\dfrac{1}{4\sin(t/2)}\), comme dans le cours. Au sommet (\(\alpha = 0\)), \(|\gamma| = \tfrac14\) est minimale.</p></div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Lire la courbure sur l'accélération</h3>
  <div class="statement">Un point se déplace sur l'ellipse \(M(t) = (2\cos t,\ \sin t)\) (\(t\) est le temps). On note \(v = \big\|\overrightarrow{M'(t)}\big\|\) sa vitesse scalaire et l'on rappelle la décomposition \(\overrightarrow{M''} = \dfrac{\mathrm{d}v}{\mathrm{d}t}\,\vec T + \gamma v^2\,\vec N\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(v\) et \(\dfrac{\mathrm{d}v}{\mathrm{d}t}\).</div>
  <div class="q"><strong>Q2.</strong> En \(t = 0\) puis en \(t = \tfrac\pi2\) : donner \(\overrightarrow{M'}\), \(\overrightarrow{M''}\), \(\vec T\), \(\vec N\), et en déduire la courbure. Comparer avec \(a/b^2\) et \(b/a^2\) (\(a = 2\), \(b = 1\)).</div>
  <div class="q"><strong>Q3.</strong> Placer les centres de courbure en ces deux sommets.</div>
  <div class="q"><strong>Q4.</strong> En \(t = \tfrac\pi4\), calculer les composantes tangentielle et normale de l'accélération ; en déduire \(\gamma\big(\tfrac\pi4\big)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\overrightarrow{M'(t)} = (-2\sin t, \cos t)\), donc \(v = \sqrt{4\sin^2 t + \cos^2 t} = \sqrt{1 + 3\sin^2 t}\) et \(\dfrac{\mathrm{d}v}{\mathrm{d}t} = \dfrac{3\sin t\cos t}{v}\). Enfin \(\overrightarrow{M''(t)} = (-2\cos t, -\sin t) = -\overrightarrow{OM(t)}\).</p>
  <p><strong>Q2.</strong> En \(t = 0\) : \(\overrightarrow{M'} = (0, 1)\), \(v = 1\), \(\vec T = (0, 1)\), \(\vec N = (-1, 0)\), \(\overrightarrow{M''} = (-2, 0)\) et \(\tfrac{\mathrm{d}v}{\mathrm{d}t} = 0\). La décomposition donne \((-2, 0) = \gamma\,(-1, 0)\) : \(\gamma = 2 = a/b^2\). En \(t = \tfrac\pi2\) : \(\overrightarrow{M'} = (-2, 0)\), \(v = 2\), \(\vec T = (-1, 0)\), \(\vec N = (0, -1)\), \(\overrightarrow{M''} = (0, -1)\) et \(\tfrac{\mathrm{d}v}{\mathrm{d}t} = 0\) : \((0, -1) = 4\gamma\,(0, -1)\), donc \(\gamma = \tfrac14 = b/a^2\). En ces sommets, l'accélération est purement normale.</p>
  <p><strong>Q3.</strong> En \((2, 0)\) : \(R = \tfrac12\), \(C = (2, 0) + \tfrac12(-1, 0) = \big(\tfrac32, 0\big)\). En \((0, 1)\) : \(R = 4\), \(C = (0, 1) + 4(0, -1) = (0, -3)\). (Ce sont deux pointes de la développée, l'astroïde de Lamé du cours, avec \(c^2 = a^2 - b^2 = 3\) : \(\tfrac{c^2}{a} = \tfrac32\) et \(\tfrac{c^2}{b} = 3\).)</p>
  <p><strong>Q4.</strong> En \(t = \tfrac\pi4\) : \(\overrightarrow{M'} = \big(-\sqrt2, \tfrac{\sqrt2}{2}\big)\), \(v = \sqrt{\tfrac52} = \tfrac{\sqrt{10}}{2}\), \(\overrightarrow{M''} = \big(-\sqrt2, -\tfrac{\sqrt2}{2}\big)\). Avec \(\vec T = \tfrac1v\big(-\sqrt2, \tfrac{\sqrt2}{2}\big)\) et \(\vec N = \tfrac1v\big(-\tfrac{\sqrt2}{2}, -\sqrt2\big)\) :</p>
  <div class="formula">$$\begin{aligned} \overrightarrow{M''}\cdot\vec T &= \frac{2 - \frac12}{v} = \frac{3}{\sqrt{10}} = \frac{\mathrm{d}v}{\mathrm{d}t}, \\ \overrightarrow{M''}\cdot\vec N &= \frac{1 + 1}{v} = \frac{4}{\sqrt{10}} = \gamma v^2. \end{aligned}$$</div>
  <p>Donc \(\gamma\big(\tfrac\pi4\big) = \dfrac{4}{\sqrt{10}} \times \dfrac{4}{10} = \dfrac{4\sqrt{10}}{25} \approx 0{,}51\), compris entre les valeurs extrêmes \(\tfrac14\) et \(2\). On retrouve la formule du cours \(\gamma = \dfrac{ab}{(a^2\sin^2 t + b^2\cos^2 t)^{3/2}} = \dfrac{2}{(5/2)^{3/2}}\).</p></div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une courbe dont la développée est un cercle</h3>
  <div class="statement">On considère \(M(t) = (\cos t + t\sin t,\ \sin t - t\cos t)\), pour \(t \geq 0\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\overrightarrow{M'(t)}\), l'abscisse curviligne \(s\) d'origine \(M(0)\), et un paramétrage normal.</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(\alpha\), puis la courbure en fonction de \(t\) et en fonction de \(s\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le centre de courbure \(C(t)\). Quelle est la développée ?</div>
  <div class="q"><strong>Q4.</strong> Comparer la distance \(M(t)C(t)\) à la longueur de l'arc de développée parcouru depuis \(C(0)\). Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(x'(t) = -\sin t + \sin t + t\cos t = t\cos t\) et \(y'(t) = \cos t - \cos t + t\sin t = t\sin t\) : \(\overrightarrow{M'(t)} = t\,(\cos t, \sin t)\), de norme \(t\). La courbe est régulière pour \(t \gt 0\) (le point \(M(0) = (1, 0)\) est stationnaire), et \(s(t) = \displaystyle\int_0^t u\,\mathrm{d}u = \frac{t^2}{2}\). Donc \(t = \sqrt{2s}\), et \(s \mapsto M\big(\sqrt{2s}\big)\), \(s \gt 0\), est un paramétrage normal.</p>
  <p><strong>Q2.</strong> \(\overrightarrow{M'(t)} = t\,(\cos t, \sin t)\) avec \(t \gt 0\) : \(\alpha = t\). Donc \(\gamma = \dfrac{\alpha'(t)}{\mathrm{d}s/\mathrm{d}t} = \dfrac1t = \dfrac{1}{\sqrt{2s}}\). La courbure est positive et décroît : la courbe tourne à gauche de moins en moins, comme une spirale qui s'élargit.</p>
  <p><strong>Q3.</strong> \(\vec T = (\cos t, \sin t)\), \(\vec N = (-\sin t, \cos t)\) et \(R = t\), d'où</p>
  <div class="formula">$$C(t) = M(t) + t\,\vec N(t) = (\cos t, \sin t),$$</div>
  <p>car les termes en \(t\sin t\) et en \(t\cos t\) se compensent. La développée est (un arc du) cercle unité. Contrôle : \(C'(t) = (-\sin t, \cos t) = R'(t)\,\vec N(t)\), conforme au cours.</p>
  <p><strong>Q4.</strong> \(M(t)C(t) = |R| = t\), et l'arc du cercle unité de \(C(0) = (1, 0)\) à \(C(t)\) mesure aussi \(t\). Tout se passe comme si un fil enroulé sur le cercle était déroulé en restant tendu : son extrémité décrit la courbe étudiée. (Une telle courbe s'appelle une développante du cercle, notion hors programme ; c'est le profil des dents d'engrenage étudié en SI.)</p></div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Des droites qui découpent un triangle d'aire constante</h3>
  <div class="statement">Pour \(t \gt 0\), on note \(A(t) = (t, 0)\), \(B(t) = \big(0, \tfrac2t\big)\) et \(D_t\) la droite \(\big(A(t)B(t)\big)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'aire du triangle \(OA(t)B(t)\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer l'enveloppe de la famille \((D_t)\) en écrivant \(D_t = A(t) + \mathbb{R}\,\vec u(t)\) avec \(\vec u = \overrightarrow{AB}\). Que représente le point de contact pour le segment \([AB]\) ? Donner une équation cartésienne de l'enveloppe.</div>
  <div class="q"><strong>Q3.</strong> Retrouver ce résultat à partir de l'équation de \(D_t\).</div>
  <div class="q"><strong>Q4.</strong> En déduire que toute tangente à la branche d'hyperbole \(xy = \tfrac12\), \(x \gt 0\), forme avec les axes un triangle d'aire 1.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Le triangle est rectangle en \(O\) : son aire vaut \(\tfrac12 \times t \times \tfrac2t = 1\), pour tout \(t\).</p>
  <p><strong>Q2.</strong> \(\vec u = \big(-t, \tfrac2t\big)\), \(A' = (1, 0)\), \(\vec u\,' = \big(-1, -\tfrac{2}{t^2}\big)\). Alors \(\det(A', \vec u) = \tfrac2t\) et \(\det(\vec u\,', \vec u) = -\tfrac2t - \tfrac2t = -\tfrac4t\), donc \(\lambda = -\dfrac{2/t}{-4/t} = \dfrac12\) et</p>
  <div class="formula">$$E(t) = A(t) + \frac12\,\vec u(t) = \Big(\frac t2,\ \frac1t\Big).$$</div>
  <p>Le point de contact est le <strong>milieu</strong> de \([AB]\). Contrôle : \(E'(t) = \big(\tfrac12, -\tfrac{1}{t^2}\big) = -\tfrac{1}{2t}\,\vec u(t)\), colinéaire à \(\vec u(t)\). Comme \(x\,y = \tfrac t2 \times \tfrac1t = \tfrac12\), l'enveloppe est la branche d'hyperbole \(xy = \tfrac12\), \(x \gt 0\).</p>
  <p><strong>Q3.</strong> \(D_t\) a pour équation \(\dfrac xt + \dfrac{t\,y}{2} = 1\). En dérivant par rapport à \(t\) : \(-\dfrac{x}{t^2} + \dfrac y2 = 0\), soit \(y = \dfrac{2x}{t^2}\). En reportant : \(\dfrac xt + \dfrac xt = 1\), d'où \(x = \dfrac t2\) et \(y = \dfrac1t\).</p>
  <p><strong>Q4.</strong> Tout point \((x_0, y_0)\) de la branche s'écrit \(E(t)\) avec \(t = 2x_0 \gt 0\), et la tangente à l'enveloppe en \(E(t)\) est la droite \(D_t\), qui forme avec les axes le triangle \(OA(t)B(t)\), d'aire 1.</p></div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Les normales d'une parabole et sa développée</h3>
  <div class="statement">On paramètre la parabole \(\mathcal{P}\) d'équation \(y^2 = 4x\) par \(P(t) = (t^2,\ 2t)\), \(t \in \mathbb{R}\), et l'on note \(\mathcal{N}_t\) la normale à \(\mathcal{P}\) en \(P(t)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathcal{N}_t\) a pour équation \(t\,x + y = t^3 + 2t\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer l'enveloppe de la famille \((\mathcal{N}_t)\) et une équation cartésienne de cette courbe. Quel est son lien avec \(\mathcal{P}\) ?</div>
  <div class="q"><strong>Q3.</strong> Contrôler le résultat au sommet \(O\) de la parabole, en calculant directement son centre de courbure.</div>
  <div class="q"><strong>Q4.</strong> Montrer que les paramètres \(t\) des normales passant par un point \((x_0, y_0)\) sont les racines de \(t^3 + (2 - x_0)\,t - y_0 = 0\). Combien de normales passent par \((5, 0)\) ? par \((1, 0)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(P'(t) = (2t, 2) = 2(t, 1) \neq \vec 0\). La normale en \(P(t)\) est l'ensemble des points \(M\) tels que \(\overrightarrow{P(t)M}\cdot(t, 1) = 0\), soit \(t(x - t^2) + (y - 2t) = 0\), c'est-à-dire \(t\,x + y = t^3 + 2t\).</p>
  <p><strong>Q2.</strong> On dérive l'équation par rapport à \(t\) : \(x = 3t^2 + 2\). En reportant, \(y = t^3 + 2t - t(3t^2 + 2) = -2t^3\). Le point de contact est \(E(t) = (3t^2 + 2,\ -2t^3)\). Avec \(t^2 = \tfrac{x - 2}{3}\) et \(y^2 = 4t^6\) : \(27y^2 = 4(x - 2)^3\), une parabole semi-cubique de pointe \((2, 0)\). L'enveloppe des normales est la <strong>développée</strong> de \(\mathcal{P}\) : \(E(t)\) est le centre de courbure en \(P(t)\).</p>
  <p><strong>Q3.</strong> Près de \(O\), \(\mathcal{P}\) est le graphe de \(x = g(y) = \tfrac{y^2}{4}\) : \(g'(0) = 0\), \(g''(0) = \tfrac12\), donc \(|\gamma| = \tfrac12\) et le rayon de courbure vaut 2. Le centre est sur la normale en \(O\), l'axe \((Ox)\), du côté de la concavité (\(x \gt 0\)) : c'est \((2, 0) = E(0)\), la pointe de la développée.</p>
  <p><strong>Q4.</strong> \((x_0, y_0) \in \mathcal{N}_t\) s'écrit \(t\,x_0 + y_0 = t^3 + 2t\), soit \(t^3 + (2 - x_0)\,t - y_0 = 0\). Pour \((5, 0)\) : \(t^3 - 3t = 0\), d'où \(t = 0\) ou \(t = \pm\sqrt3\) : trois normales, l'axe \((Ox)\) et les normales en \((3, \pm 2\sqrt3)\), d'équations \(\sqrt3\,x + y = 5\sqrt3\) et \(\sqrt3\,x - y = 5\sqrt3\). Pour \((1, 0)\) : \(t^3 + t = t(t^2 + 1) = 0\), seule \(t = 0\) : une seule normale. (On montre que trois normales passent par \((x_0, y_0)\) exactement quand \(27y_0^2 \lt 4(x_0 - 2)^3\), c'est-à-dire quand le point est « à l'intérieur » de la développée.)</p></div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Astroïde : longueur, courbure et développée</h3>
  <div class="statement">On considère l'astroïde \(M(t) = (\cos^3 t,\ \sin^3 t)\), \(t \in [0, 2\pi]\), étudiée au chapitre Courbes planes paramétrées (quatre points stationnaires, en \(t \equiv 0 \pmod{\pi/2}\), et symétries par rapport aux axes et à la droite \(y = x\)).</div>
  <div class="q"><strong>Q1.</strong> Calculer la longueur totale de l'astroïde.</div>
  <div class="q"><strong>Q2.</strong> Sur \(\big]0, \tfrac\pi2\big[\), déterminer \(\vec T\), \(\vec N\), \(\alpha\) et la courbure \(\gamma\). Où \(|\gamma|\) est-elle minimale ?</div>
  <div class="q"><strong>Q3.</strong> Calculer le centre de courbure \(C(t) = (x_C, y_C)\), puis vérifier que \(x_C + y_C = (\cos t + \sin t)^3\) et \(x_C - y_C = (\cos t - \sin t)^3\).</div>
  <div class="q"><strong>Q4.</strong> On note \(X = \dfrac{x_C + y_C}{\sqrt2}\) et \(Y = \dfrac{y_C - x_C}{\sqrt2}\) les coordonnées de \(C(t)\) dans le repère orthonormé tourné de \(\tfrac\pi4\). Montrer que \((X, Y) = 2\big(\cos^3\varphi, \sin^3\varphi\big)\) avec \(\varphi = t - \tfrac\pi4\). Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> On a</p>
  <div class="formula">$$\begin{aligned} \overrightarrow{M'(t)} &= (-3\cos^2 t\sin t,\ 3\sin^2 t\cos t) \\ &= 3\sin t\cos t\,(-\cos t, \sin t), \end{aligned}$$</div>
  <p>de norme \(3|\sin t\cos t|\). Par symétrie, la longueur vaut quatre fois celle de l'arc \(t \in [0, \tfrac\pi2]\) :</p>
  <div class="formula">$$\begin{aligned} L &= 4\int_0^{\pi/2} 3\sin t\cos t\,\mathrm{d}t \\ &= 4\Big[\frac32\sin^2 t\Big]_0^{\pi/2} = 6. \end{aligned}$$</div>
  <p><strong>Q2.</strong> Sur \(\big]0, \tfrac\pi2\big[\), \(3\sin t\cos t \gt 0\) : \(\vec T = (-\cos t, \sin t)\), soit \(\vec T = \big(\cos(\pi - t), \sin(\pi - t)\big)\), donc \(\alpha = \pi - t\), et \(\vec N = (-\sin t, -\cos t)\). Alors</p>
  <div class="formula">$$\gamma = \frac{\alpha'(t)}{\mathrm{d}s/\mathrm{d}t} = -\frac{1}{3\sin t\cos t} = -\frac{2}{3\sin 2t}.$$</div>
  <p>\(\gamma \lt 0\) : l'arc tourne à droite. \(|\gamma|\) est minimale pour \(t = \tfrac\pi4\) (\(|\gamma| = \tfrac23\)) et tend vers l'infini aux pointes.</p>
  <p><strong>Q3.</strong> \(R = \dfrac1\gamma = -3\sin t\cos t\), donc \(R\,\vec N = 3\sin t\cos t\,(\sin t, \cos t)\) et \(C = M + R\,\vec N\) :</p>
  <div class="formula">$$\begin{aligned} x_C &= \cos^3 t + 3\sin^2 t\cos t, \\ y_C &= \sin^3 t + 3\sin t\cos^2 t. \end{aligned}$$</div>
  <p>Avec \(c = \cos t\), \(s = \sin t\) : \(x_C + y_C = c^3 + 3c^2s + 3cs^2 + s^3 = (c + s)^3\) et \(x_C - y_C = c^3 - 3c^2s + 3cs^2 - s^3 = (c - s)^3\).</p>
  <p><strong>Q4.</strong> \(\cos t + \sin t = \sqrt2\cos\varphi\) et \(\cos t - \sin t = \sqrt2\cos(t + \tfrac\pi4) = -\sqrt2\sin\varphi\). Donc \(X = \dfrac{2\sqrt2\cos^3\varphi}{\sqrt2} = 2\cos^3\varphi\) et \(Y = \dfrac{2\sqrt2\sin^3\varphi}{\sqrt2} = 2\sin^3\varphi\). Dans le repère tourné de \(\tfrac\pi4\), la développée a la même équation que l'astroïde agrandie deux fois : la développée de l'astroïde est l'image de l'astroïde par la rotation de centre \(O\) et d'angle \(\tfrac\pi4\) composée avec l'homothétie de centre \(O\) et de rapport 2. Ses pointes, en \(\varphi \equiv 0 \pmod{\pi/2}\), correspondent aux sommets \(t \equiv \tfrac\pi4 \pmod{\pi/2}\) de l'astroïde, où \(|\gamma|\) est minimale.</p></div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>La tractrice et sa développée, la chaînette</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : repère de Frenet, abscisse curviligne, courbure, développée, enveloppe des normales).</div>
  <div class="statement">Le plan est rapporté à un repère orthonormé direct \((O ; \vec\imath, \vec\jmath)\). On étudie la courbe \(\Gamma\) définie pour \(t \geq 0\) par
  <div class="formula">$$M(t) = \Big(t - \operatorname{th} t,\ \frac{1}{\operatorname{ch} t}\Big).$$</div>
  On rappelle que \(\operatorname{ch}^2 - \operatorname{sh}^2 = 1\), \(\operatorname{th}' = \dfrac{1}{\operatorname{ch}^2}\) et \(\Big(\dfrac{1}{\operatorname{ch}}\Big)' = -\dfrac{\operatorname{sh}}{\operatorname{ch}^2}\).</div>

  <p class="exo-part">Partie A — Tangente et longueur de la « laisse »</p>
  <div class="q"><strong>A1.</strong> Montrer que \(\overrightarrow{M'(t)} = \dfrac{\operatorname{sh} t}{\operatorname{ch}^2 t}\,(\operatorname{sh} t, -1)\). En déduire les points réguliers, puis, pour \(t \gt 0\), le vecteur unitaire tangent \(\vec T(t)\) et la vitesse scalaire \(\dfrac{\mathrm{d}s}{\mathrm{d}t}\).</div>
  <div class="q"><strong>A2.</strong> Pour \(t \gt 0\), la tangente en \(M(t)\) coupe \((Ox)\) en \(P(t)\). Montrer que \(P(t) = (t, 0)\) et que \(M(t)P(t) = 1\). Interpréter : un maître marche sur \((Ox)\) en tirant son chien, qui part de \((0, 1)\), par une laisse tendue de longueur 1.</div>

  <p class="exo-part">Partie B — Abscisse curviligne</p>
  <div class="q"><strong>B1.</strong> Montrer que l'abscisse curviligne d'origine \(M(0)\) vaut \(s(t) = \ln(\operatorname{ch} t)\).</div>
  <div class="q"><strong>B2.</strong> Exprimer l'ordonnée \(y\) de \(M\) et \(\operatorname{th} t\) en fonction de \(s\). Quelle longueur le chien a-t-il parcourue quand il se trouve à la hauteur \(\tfrac12\) ?</div>

  <p class="exo-part">Partie C — Courbure</p>
  <div class="q"><strong>C1.</strong> Pour \(t \gt 0\), donner \(\vec N(t)\), calculer \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}t}\) et en déduire que \(\gamma(t) = \dfrac{1}{\operatorname{sh} t}\).</div>
  <div class="q"><strong>C2.</strong> Interpréter le signe de \(\gamma\), puis le comportement du rayon de courbure quand \(t \to 0^+\) et quand \(t \to +\infty\).</div>

  <p class="exo-part">Partie D — Développée et enveloppe des normales</p>
  <div class="q"><strong>D1.</strong> Montrer que le centre de courbure en \(M(t)\) est \(C(t) = (t, \operatorname{ch} t)\). Quelle est la développée de \(\Gamma\) ?</div>
  <div class="q"><strong>D2.</strong> Vérifier que \(C'(t) = R'(t)\,\vec N(t)\), et que la normale à \(\Gamma\) en \(M(t)\) est tangente à la chaînette \(y = \operatorname{ch} x\) en \(C(t)\).</div>
  <div class="q"><strong>D3.</strong> Montrer que le triangle \(M(t)P(t)C(t)\) est rectangle en \(M(t)\) et que \(P(t)\) est le projeté orthogonal de \(C(t)\) sur \((Ox)\). Retrouver \(P(t)C(t)\) par le théorème de Pythagore.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>A1.</strong> \(x'(t) = 1 - \dfrac{1}{\operatorname{ch}^2 t} = \dfrac{\operatorname{sh}^2 t}{\operatorname{ch}^2 t}\) et \(y'(t) = -\dfrac{\operatorname{sh} t}{\operatorname{ch}^2 t}\), d'où la factorisation. \(\overrightarrow{M'(t)}\) est nul si et seulement si \(\operatorname{sh} t = 0\), soit \(t = 0\) : \(M(0) = (0, 1)\) est stationnaire, tous les autres points sont réguliers. Pour \(t \gt 0\), \(\dfrac{\operatorname{sh} t}{\operatorname{ch}^2 t} \gt 0\) et \(\|(\operatorname{sh} t, -1)\| = \sqrt{\operatorname{sh}^2 t + 1} = \operatorname{ch} t\), donc</p>
  <div class="formula">$$\begin{aligned} \vec T(t) &= \Big(\operatorname{th} t,\ -\frac{1}{\operatorname{ch} t}\Big), \\ \frac{\mathrm{d}s}{\mathrm{d}t} &= \frac{\operatorname{sh} t}{\operatorname{ch}^2 t}\,\operatorname{ch} t = \operatorname{th} t. \end{aligned}$$</div>
  <p><strong>A2.</strong> Les points de la tangente s'écrivent \(M(t) + \mu\,\vec T(t)\). L'ordonnée \(\dfrac{1}{\operatorname{ch} t} - \dfrac{\mu}{\operatorname{ch} t}\) est nulle pour \(\mu = 1\) : \(P(t) = M(t) + \vec T(t)\), d'abscisse \(t - \operatorname{th} t + \operatorname{th} t = t\). Donc \(P(t) = (t, 0)\) et \(M(t)P(t) = \|\vec T\| = 1\). Le chien, en \(M(t)\), est toujours tiré dans la direction de son maître, en \(P(t)\), à distance 1 : c'est la courbe appelée <strong>tractrice</strong> (du latin <em>trahere</em>, tirer). Quand \(t \to +\infty\), \(y \to 0\) : l'axe \((Ox)\) est asymptote.</p>
  <p><strong>B1.</strong> \(s(t) = \displaystyle\int_0^t \operatorname{th} u\,\mathrm{d}u = \big[\ln(\operatorname{ch} u)\big]_0^t = \ln(\operatorname{ch} t)\), car \(\operatorname{ch} 0 = 1\).</p>
  <p><strong>B2.</strong> \(\operatorname{ch} t = e^s\), donc \(y = \dfrac{1}{\operatorname{ch} t} = e^{-s}\) et, \(t\) étant positif, \(\operatorname{th} t = \sqrt{1 - \dfrac{1}{\operatorname{ch}^2 t}} = \sqrt{1 - e^{-2s}}\). La hauteur est divisée par \(e\) à chaque unité de longueur parcourue. Pour \(y = \tfrac12\) : \(s = \ln 2 \approx 0{,}69\).</p>
  <p><strong>C1.</strong> \(\vec N\) est \(\vec T\) tourné de \(+\tfrac\pi2\) : \(\vec N(t) = \Big(\dfrac{1}{\operatorname{ch} t},\ \operatorname{th} t\Big)\). En dérivant \(\vec T\) :</p>
  <div class="formula">$$\frac{\mathrm{d}\vec T}{\mathrm{d}t} = \Big(\frac{1}{\operatorname{ch}^2 t},\ \frac{\operatorname{sh} t}{\operatorname{ch}^2 t}\Big) = \frac{1}{\operatorname{ch} t}\,\vec N(t).$$</div>
  <p>Or \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}t} = \dfrac{\mathrm{d}s}{\mathrm{d}t}\,\gamma\,\vec N = \operatorname{th} t\,\gamma\,\vec N\). Donc \(\gamma = \dfrac{1}{\operatorname{ch} t\,\operatorname{th} t} = \dfrac{1}{\operatorname{sh} t}\).</p>
  <p><strong>C2.</strong> \(\gamma \gt 0\) : parcourue dans le sens des \(t\) croissants (vers la droite et vers le bas), la tractrice tourne à gauche ; elle est du côté de \(\vec N\), qui pointe vers le haut. Le rayon de courbure \(R = \operatorname{sh} t\) tend vers 0 quand \(t \to 0^+\) (la courbe est très courbée près de la pointe \(M(0)\)) et vers \(+\infty\) quand \(t \to +\infty\) (elle se redresse le long de son asymptote).</p>
  <p><strong>D1.</strong> \(C = M + R\,\vec N\) avec \(R = \operatorname{sh} t\) :</p>
  <div class="formula">$$\begin{aligned} C(t) &= \Big(t - \operatorname{th} t + \frac{\operatorname{sh} t}{\operatorname{ch} t},\ \frac{1}{\operatorname{ch} t} + \operatorname{sh} t\,\operatorname{th} t\Big) \\ &= \Big(t,\ \frac{1 + \operatorname{sh}^2 t}{\operatorname{ch} t}\Big) = (t, \operatorname{ch} t). \end{aligned}$$</div>
  <p>La développée de \(\Gamma\) est l'arc \(x \gt 0\) de la <strong>chaînette</strong> \(y = \operatorname{ch} x\).</p>
  <p><strong>D2.</strong> \(C'(t) = (1, \operatorname{sh} t)\), et \(R'(t)\,\vec N(t) = \operatorname{ch} t\,\Big(\dfrac{1}{\operatorname{ch} t}, \operatorname{th} t\Big) = (1, \operatorname{sh} t)\) : c'est la relation du cours. La normale à \(\Gamma\) en \(M(t)\) passe par \(C(t)\) et est dirigée par \(\vec N(t)\), colinéaire à \(C'(t) \neq \vec 0\), qui dirige la tangente à la chaînette en \(C(t)\) : la normale est tangente à la chaînette. La chaînette est l'enveloppe des normales de la tractrice, comme le prévoit le cours.</p>
  <p><strong>D3.</strong> \(\overrightarrow{MP} = \vec T\) et \(\overrightarrow{MC} = R\,\vec N\) sont orthogonaux : le triangle est rectangle en \(M\). \(P(t) = (t, 0)\) et \(C(t) = (t, \operatorname{ch} t)\) ont la même abscisse : \(P\) est le projeté orthogonal de \(C\) sur \((Ox)\). Pythagore donne \(PC^2 = MP^2 + MC^2 = 1 + \operatorname{sh}^2 t = \operatorname{ch}^2 t\), soit \(PC = \operatorname{ch} t\), en accord avec \(C = (t, \operatorname{ch} t)\).</p></div>
</div>
