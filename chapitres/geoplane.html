<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties d) « Propriétés métriques d'une courbe plane » et e) « Enveloppe d'une famille de droites » de la section « Fonctions vectorielles d'une variable réelle et courbes paramétrées » du programme de PT. Il prolonge le chapitre Courbes planes paramétrées (tangente, points réguliers, étude locale), dont il reprend les notations. Le programme demande de <strong>privilégier la vision géométrique</strong> : les questions de régularité ne sont pas soulevées, et chaque calcul s'accompagne de son interprétation (vitesse de rotation de la tangente, cercle qui épouse la courbe, droites qui dessinent une courbe).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Longueur</strong> d'une courbe paramétrée régulière, définie par la formule intégrale ; la définition géométrique par les lignes polygonales est présentée sur des figures (§1).</li>
        <li><strong>Abscisse curviligne</strong>, paramétrage par une abscisse curviligne d'une courbe régulière (§2).</li>
        <li><strong>Repère de Frenet</strong> \((M ; \vec T, \vec N)\), normale (§3).</li>
        <li><strong>Courbure</strong> en un point régulier, définie par \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}s} = \gamma\vec N\) ; formules de Frenet ; interprétation géométrique du signe de la courbure ; expression \(\vec T = \cos\alpha\,\vec\imath + \sin\alpha\,\vec\jmath\) et \(\gamma = \dfrac{\mathrm{d}\alpha}{\mathrm{d}s}\) ; interprétation de \(|\gamma|\) sans démonstration formelle (§4).</li>
        <li><strong>Point birégulier</strong> d'une courbe de classe \(C^2\) (§4) ; <strong>rayon, centre et cercle de courbure</strong>, interprétés géométriquement sans démonstration formelle (§5).</li>
        <li><strong>Développée</strong> d'une courbe birégulière : ensemble des centres de courbure (§6).</li>
        <li><strong>Enveloppe d'une famille de droites</strong> \(t \mapsto A(t) + \lambda\vec u(t)\) : recherche d'une fonction \(\lambda\) telle que la tangente à \(t \mapsto A(t) + \lambda(t)\vec u(t)\) soit dirigée par \(\vec u(t)\) (§7) ; caractérisation de la développée comme enveloppe des normales (§8).</li>
      </ul>
      <p>Hors programme : tout développement théorique sur la longueur ; la formule donnant la courbure à partir du déterminant de la vitesse et de l'accélération (donnée en fin de chapitre comme simple outil de vérification) ; les courbes polaires ; les développantes.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LONGUEUR D'UNE COURBE</div>
  <h2>Mesurer un chemin qui tourne</h2>
  <div class="intro">On sait mesurer un segment. Pour mesurer une courbe, on l'approche par des lignes brisées, dont on additionne les côtés, et on raffine. Le programme définit directement la longueur par une intégrale ; l'approche géométrique explique pourquoi c'est la bonne.</div>

  <h3>L'idée géométrique</h3>
  <p>Soit \(t \mapsto M(t)\) une courbe de classe \(C^1\) sur \([a, b]\) et une subdivision \(a = t_0 \lt t_1 \lt \cdots \lt t_n = b\). La ligne polygonale \(M(t_0)M(t_1)\cdots M(t_n)\) est inscrite dans la courbe. D'après l'inégalité triangulaire, ajouter un point à la subdivision ne peut qu'allonger la ligne brisée, et chaque côté est plus court que l'arc qu'il sous-tend. Pour des pas petits, chaque côté vaut environ \(\big\|\overrightarrow{M'(t_k)}\big\|\,(t_{k+1} - t_k)\) : la somme des côtés est proche d'une somme de Riemann de \(t \mapsto \|\overrightarrow{M'(t)}\|\), qui tend vers l'intégrale.</p>

  <div class="def-box">
    Soit \(t \mapsto M(t) = \big(x(t), y(t)\big)\) une courbe paramétrée régulière de classe \(C^1\) sur \([a, b]\). Sa <strong>longueur</strong> est
    <div class="formula" data-nom="Longueur d'un arc paramétré">$$\begin{aligned} L &= \int_a^b \big\|\overrightarrow{M'(t)}\big\|\,\mathrm{d}t \\ &= \int_a^b \sqrt{x'(t)^2 + y'(t)^2}\,\mathrm{d}t. \end{aligned}$$</div>
    En cinématique, c'est la distance parcourue : l'intégrale de la vitesse scalaire. Pour le graphe d'une fonction \(f\) de classe \(C^1\) sur \([a, b]\), paramétré par \(x \mapsto \big(x, f(x)\big)\) :
    <div class="formula" data-nom="Longueur d'un graphe">$$L = \int_a^b \sqrt{1 + f'(x)^2}\,\mathrm{d}x.$$</div>
  </div>
  <div class="prop-box">
    <strong>Invariance.</strong> La longueur ne dépend pas du paramétrage choisi : si \(\varphi\) est une bijection de classe \(C^1\) de \([c, d]\) sur \([a, b]\), de dérivée sans zéro, la courbe \(u \mapsto M\big(\varphi(u)\big)\) a la même longueur. C'est donc une propriété géométrique de l'arc… à condition qu'il soit parcouru une seule fois.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Un changement de variable dans l'intégrale.</span>
    <div class="content"><p>Si \(\varphi' \gt 0\), \(\varphi(c) = a\) et \(\varphi(d) = b\). La dérivée de \(u \mapsto M\big(\varphi(u)\big)\) est \(\varphi'(u)\,\overrightarrow{M'\big(\varphi(u)\big)}\), de norme \(\varphi'(u)\,\big\|\overrightarrow{M'\big(\varphi(u)\big)}\big\|\), et le changement de variable \(t = \varphi(u)\) donne
    $$\int_c^d \varphi'(u)\,\big\|\overrightarrow{M'\big(\varphi(u)\big)}\big\|\,\mathrm{d}u = \int_a^b \big\|\overrightarrow{M'(t)}\big\|\,\mathrm{d}t.$$
    Si \(\varphi' \lt 0\), la norme fait apparaître \(|\varphi'| = -\varphi'\) et les bornes sont échangées : les deux signes moins se compensent.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — un arc de parabole semi-cubique</strong>
    <p>\(M(t) = (t^2, t^3)\), \(t \in [0, 1]\), de \(O\) à \((1, 1)\).</p>
    <ol>
      <li>\(\overrightarrow{M'(t)} = (2t, 3t^2)\), donc \(\|\overrightarrow{M'(t)}\| = \sqrt{4t^2 + 9t^4} = t\sqrt{4 + 9t^2}\) pour \(t \geq 0\).</li>
      <li>Une primitive de \(t\sqrt{4 + 9t^2}\) est \(\tfrac{1}{27}(4 + 9t^2)^{3/2}\), d'où
      $$L = \frac{13\sqrt{13} - 8}{27} \approx 1{,}44.$$</li>
      <li>Contrôle : la corde de \(O\) à \((1, 1)\) mesure \(\sqrt2 \approx 1{,}41\), un peu moins que l'arc, comme il se doit. (Le point stationnaire en \(t = 0\) ne gêne pas le calcul.)</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la longueur de la cardioïde</strong>
    <p>La cardioïde du chapitre Courbes planes : \(\overrightarrow{OM(t)} = (1 - \cos t)\,\vec u(t)\), avec \(\vec u(t) = (\cos t, \sin t)\) et \(\vec v(t) = (-\sin t, \cos t)\), \(t \in [0, 2\pi]\).</p>
    <ol>
      <li>Comme \(\vec u\,' = \vec v\) : \(\overrightarrow{M'(t)} = \sin t\,\vec u + (1 - \cos t)\,\vec v\), et \((\vec u, \vec v)\) est orthonormée.</li>
      <li>\(\|\overrightarrow{M'(t)}\|^2 = \sin^2 t + (1 - \cos t)^2\), soit \(2 - 2\cos t = 4\sin^2\tfrac t2\).</li>
      <li>Sur \([0, 2\pi]\), \(\sin\tfrac t2 \geq 0\), donc \(\|\overrightarrow{M'(t)}\| = 2\sin\tfrac t2\) et
      $$\begin{aligned} L &= \int_0^{2\pi} 2\sin\frac t2\,\mathrm{d}t \\ &= \Big[-4\cos\frac t2\Big]_0^{2\pi} = 8. \end{aligned}$$</li>
      <li>La demi-cardioïde de la figure mesure donc 4 : les lignes polygonales s'en approchent par valeurs inférieures.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une chaînette</strong>
    <p>Le graphe de \(\operatorname{ch}\) sur \([-a, a]\) (forme d'un câble suspendu) : \(\sqrt{1 + \operatorname{sh}^2 x} = \operatorname{ch} x\), donc \(L = \displaystyle\int_{-a}^{a} \operatorname{ch} x\,\mathrm{d}x = 2\operatorname{sh} a\).</p>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) écrire \(\sqrt{4\sin^2(t/2)} = 2\sin(t/2)\) sans regarder le signe. Sur \([-\pi, \pi]\), il faut \(2\,|\sin(t/2)|\) ; sans la valeur absolue, on intègre une fonction impaire et l'on trouve une « longueur » nulle. (2) Oublier que la formule mesure le <em>chemin parcouru</em> : \(t \mapsto (\cos 2t, \sin 2t)\) sur \([0, 2\pi]\) donne \(4\pi\), le double du périmètre du cercle, parce qu'il en fait deux fois le tour.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ABSCISSE CURVILIGNE</div>
  <h2>Se repérer par la distance parcourue</h2>
  <div class="intro">Sur une route, on repère un lieu par sa borne kilométrique, pas par l'heure à laquelle on y passe. L'abscisse curviligne joue ce rôle sur une courbe : c'est la longueur parcourue depuis une origine, comptée positivement dans le sens de parcours et négativement en sens inverse.</div>

  <div class="def-box">
    Soit \(t \mapsto M(t)\), \(t \in I\), une courbe régulière de classe \(C^1\) et \(t_0 \in I\). L'<strong>abscisse curviligne</strong> d'origine \(M(t_0)\) est
    <div class="formula" data-nom="Abscisse curviligne">$$s(t) = \int_{t_0}^{t} \big\|\overrightarrow{M'(u)}\big\|\,\mathrm{d}u,$$</div>
    donc
    <div class="formula" data-nom="Vitesse scalaire">$$\frac{\mathrm{d}s}{\mathrm{d}t} = \big\|\overrightarrow{M'(t)}\big\|.$$</div>
    Plus généralement, on appelle abscisse curviligne toute primitive de \(t \mapsto \|\overrightarrow{M'(t)}\|\) : changer de primitive, c'est changer d'origine. La dérivée \(\mathrm{d}s/\mathrm{d}t\) est la <strong>vitesse scalaire</strong> ; on retient l'écriture \(\mathrm{d}s = \sqrt{\mathrm{d}x^2 + \mathrm{d}y^2}\).
  </div>
  <div class="prop-box">
    <strong>Paramétrage normal.</strong> Pour une courbe régulière, \(s\) est de classe \(C^1\) et strictement croissante (sa dérivée est \(\gt 0\)) : c'est une bijection de \(I\) sur \(J = s(I)\), dont la réciproque \(s \mapsto t(s)\) est de classe \(C^1\). La courbe \(s \mapsto M\big(t(s)\big)\) a le même support, la même orientation, et
    <div class="formula" data-nom="Paramétrage normal">$$\left\|\frac{\mathrm{d}M}{\mathrm{d}s}\right\| = 1.$$</div>
    On parle de <strong>paramétrage par une abscisse curviligne</strong>, ou paramétrage normal : le point parcourt la courbe à vitesse 1. Inversement, si un paramétrage a une vitesse constamment égale à 1, son paramètre est une abscisse curviligne.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">La règle de dérivation des fonctions composées.</span>
    <div class="content"><p>La réciproque de \(s\) a pour dérivée \(\dfrac{\mathrm{d}t}{\mathrm{d}s} = \dfrac{1}{\|\overrightarrow{M'(t)}\|}\). Donc
    $$\frac{\mathrm{d}M}{\mathrm{d}s} = \frac{\mathrm{d}t}{\mathrm{d}s}\,\overrightarrow{M'(t)} = \frac{\overrightarrow{M'(t)}}{\|\overrightarrow{M'(t)}\|},$$
    vecteur unitaire de même sens que \(\overrightarrow{M'(t)}\).</p></div>
  </div>
  <p>En pratique, on n'a presque jamais besoin d'expliciter \(t(s)\) : pour toute grandeur \(g\) qui dépend de \(t\), la même règle donne</p>
  <div class="formula" data-nom="Dériver par rapport à s">$$\frac{\mathrm{d}g}{\mathrm{d}s} = \frac{\mathrm{d}g/\mathrm{d}t}{\mathrm{d}s/\mathrm{d}t} = \frac{1}{\big\|\overrightarrow{M'(t)}\big\|}\,\frac{\mathrm{d}g}{\mathrm{d}t}.$$</div>

  <div class="method-box">
    <strong>Exemple — une spirale de longueur finie</strong>
    <p>\(\overrightarrow{OM(t)} = e^{t}\,\vec u(t)\), avec \(\vec u(t) = (\cos t, \sin t)\) et \(\vec v(t) = (-\sin t, \cos t)\), \(t \in \mathbb{R}\) (spirale logarithmique).</p>
    <ol>
      <li>\(\overrightarrow{M'(t)} = e^{t}\,(\vec u + \vec v)\), donc \(\|\overrightarrow{M'(t)}\| = \sqrt2\,e^{t}\) : la courbe est régulière.</li>
      <li>Abscisse curviligne d'origine \(M(0) = (1, 0)\) : \(s(t) = \displaystyle\int_0^t \sqrt2\,e^u\,\mathrm{d}u = \sqrt2\,(e^t - 1)\), bijection de \(\mathbb{R}\) sur \(]-\sqrt2, +\infty[\).</li>
      <li>Quand \(t \to -\infty\), la spirale fait une infinité de tours autour de \(O\), et pourtant la longueur parcourue depuis \(M(0)\) tend vers \(\sqrt2\) : les tours rétrécissent assez vite.</li>
      <li>Paramétrage normal : \(t = \ln\big(1 + s/\sqrt2\big)\), d'où \(M = \big(1 + \tfrac{s}{\sqrt2}\big)\,\vec u\big(\ln(1 + \tfrac{s}{\sqrt2})\big)\) pour \(s \gt -\sqrt2\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre dérivée par rapport à \(t\) et dérivée par rapport à \(s\). En général \(\|\mathrm{d}M/\mathrm{d}t\| \neq 1\) ; seul \(\mathrm{d}M/\mathrm{d}s\) est unitaire. Écrire systématiquement la variable de dérivation (\(\mathrm{d}/\mathrm{d}t\) ou \(\mathrm{d}/\mathrm{d}s\)) évite la plupart des erreurs du chapitre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · REPÈRE DE FRENET</div>
  <h2>Un repère qui suit la courbe</h2>
  <div class="intro">En chaque point régulier, on attache à la courbe un repère orthonormé direct : le vecteur unitaire tangent, qui pointe dans le sens de parcours, et le vecteur normal, qui pointe vers la gauche. C'est le repère du conducteur : « devant » et « à gauche ».</div>

  <div class="def-box">
    Soit une courbe régulière, orientée par le sens des \(t\) croissants. On pose
    <div class="formula" data-nom="Vecteur unitaire tangent">$$\vec T = \frac{\overrightarrow{M'(t)}}{\big\|\overrightarrow{M'(t)}\big\|} = \frac{\mathrm{d}M}{\mathrm{d}s},$$</div>
    et l'on note \(\vec N\) l'image de \(\vec T\) par la rotation d'angle \(+\pi/2\) : si \(\vec T = (a, b)\), alors \(\vec N = (-b, a)\). Le <strong>repère de Frenet</strong> en \(M\) est le repère orthonormé direct \((M ; \vec T, \vec N)\). La <strong>normale</strong> en \(M\) est la droite \(M + \operatorname{Vect}(\vec N)\), perpendiculaire à la tangente.
  </div>
  <p>Changer d'orientation change \(\vec T\) en \(-\vec T\), donc \(\vec N\) en \(-\vec N\) : la tangente et la normale, elles, ne changent pas.</p>

  <div class="method-box">
    <strong>Exemple — repère de Frenet d'une ellipse</strong>
    <p>\(M(t) = (a\cos t, b\sin t)\), avec \(0 \lt b \lt a\).</p>
    <ol>
      <li>\(\overrightarrow{M'(t)} = (-a\sin t, b\cos t)\) ne s'annule jamais : courbe régulière, de vitesse \(D(t) = \sqrt{a^2\sin^2 t + b^2\cos^2 t}\).</li>
      <li>\(\vec T = \dfrac{1}{D}(-a\sin t, b\cos t)\) et \(\vec N = \dfrac{1}{D}(-b\cos t, -a\sin t)\).</li>
      <li>En \(t = 0\), au sommet \((a, 0)\) : \(\vec T = (0, 1)\), \(\vec N = (-1, 0)\). L'ellipse est parcourue dans le sens direct et \(\vec N\) pointe vers l'intérieur ; la normale est l'axe \((Ox)\).</li>
      <li>Pour \(a = 3\), \(b = 2\) et \(t = \pi/4\) : \(M = \big(\tfrac{3}{\sqrt2}, \sqrt2\big)\) et \(\vec T\) est dirigé par \((-3, 2)\). La normale, ensemble des points \(P\) tels que \(\overrightarrow{MP}\cdot(-3, 2) = 0\), a pour équation \(3x - 2y = \tfrac{9}{\sqrt2} - 2\sqrt2 = \tfrac{5}{\sqrt2}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour \(\vec N\) l'accélération normalisée. Le vecteur \(\vec N\) ne dépend que de la tangente et de l'orientation (rotation de \(+\pi/2\)) ; l'accélération a en général une composante tangentielle (§4). Et \(\vec N\) ne pointe pas toujours vers l'intérieur du virage : quand la courbe tourne à droite, il pointe vers l'extérieur.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · COURBURE</div>
  <h2>À quelle vitesse tourne la tangente</h2>
  <div class="intro">Le long d'une droite, \(\vec T\) ne bouge pas ; le long d'un cercle, il tourne régulièrement, d'autant plus vite que le cercle est petit. La courbure mesure la vitesse de rotation de \(\vec T\) par unité de longueur parcourue : c'est ce que règle le volant d'un conducteur (plus il est tourné, plus le virage est serré).</div>

  <div class="prop-box">
    <strong>Courbure et formules de Frenet.</strong> Soit une courbe régulière de classe \(C^2\), orientée, d'abscisse curviligne \(s\). Il existe un réel \(\gamma\), dépendant du point, tel que
    <div class="formula" data-nom="Formules de Frenet">$$\frac{\mathrm{d}\vec T}{\mathrm{d}s} = \gamma\,\vec N, \quad \frac{\mathrm{d}\vec N}{\mathrm{d}s} = -\gamma\,\vec T.$$</div>
    Le réel \(\gamma\) est la <strong>courbure</strong> (algébrique) de la courbe au point considéré.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un vecteur de norme constante est orthogonal à sa dérivée.</span>
    <div class="content"><p>On dérive \(\vec T\cdot\vec T = 1\) par rapport à \(s\) : \(2\,\vec T\cdot\dfrac{\mathrm{d}\vec T}{\mathrm{d}s} = 0\). Le vecteur \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}s}\) est orthogonal à \(\vec T\) ; dans le plan, il est donc colinéaire à \(\vec N\) : c'est \(\gamma\vec N\) pour un unique réel \(\gamma\). Notons \(\rho\) la rotation d'angle \(+\pi/2\), linéaire et indépendante de \(s\) : \(\vec N = \rho(\vec T)\), donc, puisque \(\rho^2 = -\mathrm{id}\),
    $$\frac{\mathrm{d}\vec N}{\mathrm{d}s} = \rho\Big(\frac{\mathrm{d}\vec T}{\mathrm{d}s}\Big) = \gamma\,\rho(\vec N) = \gamma\,\rho^2(\vec T) = -\gamma\vec T.$$</p></div>
  </div>
  <p>Avec un paramètre \(t\) quelconque, la règle du §2 donne \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}t} = \dfrac{\mathrm{d}s}{\mathrm{d}t}\,\gamma\,\vec N = \big\|\overrightarrow{M'(t)}\big\|\,\gamma\,\vec N\).</p>

  <h3>Courbure et angle de la tangente</h3>
  <div class="prop-box">
    <strong>Angle de la tangente.</strong> On admet qu'il existe une fonction \(\alpha\) de classe \(C^1\) telle que \(\vec T = \cos\alpha\,\vec\imath + \sin\alpha\,\vec\jmath\) : \(\alpha\) mesure l'angle \((\vec\imath, \vec T)\), c'est-à-dire la direction de la tangente. Alors \(\vec N = -\sin\alpha\,\vec\imath + \cos\alpha\,\vec\jmath\) et
    <div class="formula" data-nom="Courbure et angle de la tangente">$$\gamma = \frac{\mathrm{d}\alpha}{\mathrm{d}s} = \frac{\alpha'(t)}{\big\|\overrightarrow{M'(t)}\big\|}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dériver \(\vec T = (\cos\alpha, \sin\alpha)\).</span>
    <div class="content"><p>Par dérivation composée, \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}s} = \dfrac{\mathrm{d}\alpha}{\mathrm{d}s}\,(-\sin\alpha, \cos\alpha) = \dfrac{\mathrm{d}\alpha}{\mathrm{d}s}\,\vec N\). En comparant avec \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}s} = \gamma\vec N\), on obtient \(\gamma = \dfrac{\mathrm{d}\alpha}{\mathrm{d}s}\), puis la seconde écriture par la règle du §2.</p></div>
  </div>
  <p>Pour trouver \(\alpha\), on factorise \(\overrightarrow{M'(t)}\) sous la forme (réel positif) \(\times\,(\cos\theta(t), \sin\theta(t))\), et alors \(\alpha = \theta\) ; ou bien on dérive la relation \(\tan\alpha = y'/x'\) là où \(x' \neq 0\).</p>

  <h3>Interprétation géométrique</h3>
  <ul>
    <li><strong>Valeur absolue.</strong> Quand on avance d'une petite longueur \(\Delta s\), la tangente tourne d'un angle \(\Delta\alpha \approx \gamma\,\Delta s\) : \(|\gamma|\) est l'angle dont tourne la tangente par unité de longueur. Un virage serré a une grande courbure ; une droite, une courbure nulle.</li>
    <li><strong>Signe.</strong> Si \(\gamma \gt 0\), \(\alpha\) augmente : la tangente tourne dans le sens direct, la courbe <strong>tourne à gauche</strong> et se trouve, au voisinage du point, du côté de \(\vec N\). Si \(\gamma \lt 0\), elle tourne à droite, du côté de \(-\vec N\). Aux points d'inflexion, \(\gamma\) s'annule en changeant de signe.</li>
    <li><strong>Orientation.</strong> Parcourir la courbe en sens inverse change le signe de \(\gamma\) (ce qui était un virage à gauche devient un virage à droite) ; \(|\gamma|\) ne change pas.</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — droite et cercle</strong>
    <ol>
      <li>Sur une droite, \(\vec T\) est constant : \(\gamma = 0\).</li>
      <li>Le cercle de centre \(\Omega\) et de rayon \(R\), parcouru dans le sens direct : \(M(t) = \Omega + R(\cos t, \sin t)\), donc \(\overrightarrow{M'(t)} = R(-\sin t, \cos t)\), c'est-à-dire \(R\big(\cos(t + \tfrac\pi2), \sin(t + \tfrac\pi2)\big)\). Donc \(\alpha = t + \tfrac\pi2\), \(\dfrac{\mathrm{d}s}{\mathrm{d}t} = R\) et \(\gamma = \dfrac{1}{R}\).</li>
      <li>Parcouru dans le sens indirect, le même cercle a pour courbure \(-\dfrac1R\). La courbure d'un cercle est l'inverse de son rayon : c'est ce qui motive la définition du rayon de courbure (§5).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — courbure d'un graphe</strong>
    <p>Pour \(x \mapsto \big(x, f(x)\big)\), avec \(f\) de classe \(C^2\) : \(\tan\alpha = f'(x)\), donc \((1 + f'^2)\,\alpha' = f''\), et \(\dfrac{\mathrm{d}s}{\mathrm{d}x} = \sqrt{1 + f'^2}\). D'où</p>
    <div class="formula" data-nom="Courbure d'un graphe">$$\gamma = \frac{f''(x)}{\big(1 + f'(x)^2\big)^{3/2}}.$$</div>
    <p>Le signe de \(\gamma\) est celui de \(f''\) : la courbe tourne à gauche là où \(f\) est convexe. Pour \(f = \sin\) : \(\gamma = -\dfrac{\sin x}{(1 + \cos^2 x)^{3/2}}\), qui vaut \(-1\) en \(\tfrac\pi2\), \(0\) en \(\pi\) et \(1\) en \(\tfrac{3\pi}{2}\) (figure ci-dessus).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — courbure de l'ellipse</strong>
    <p>\(M(t) = (a\cos t, b\sin t)\), \(0 \lt b \lt a\), sur \(]0, \pi[\) où \(x' = -a\sin t \neq 0\).</p>
    <ol>
      <li>\(\tan\alpha = \dfrac{y'}{x'} = -\dfrac{b}{a}\,\dfrac{\cos t}{\sin t}\). On dérive : \((1 + \tan^2\alpha)\,\alpha' = \dfrac{b}{a\sin^2 t}\).</li>
      <li>Or \(1 + \tan^2\alpha = \dfrac{a^2\sin^2 t + b^2\cos^2 t}{a^2\sin^2 t}\), d'où \(\alpha'(t) = \dfrac{ab}{a^2\sin^2 t + b^2\cos^2 t}\).</li>
      <li>Avec \(\dfrac{\mathrm{d}s}{\mathrm{d}t} = \sqrt{a^2\sin^2 t + b^2\cos^2 t}\) :
      $$\gamma(t) = \frac{ab}{\big(a^2\sin^2 t + b^2\cos^2 t\big)^{3/2}},$$
      formule qui reste valable en \(t = 0\) et \(t = \pi\) par continuité, et sur \(]\pi, 2\pi[\) par le même calcul.</li>
      <li>\(\gamma \gt 0\) : parcourue dans le sens direct, l'ellipse tourne toujours à gauche. La courbure est maximale aux sommets du grand axe (\(\gamma = a/b^2\)) et minimale aux sommets du petit axe (\(\gamma = b/a^2\)).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une arche de cycloïde</strong>
    <p>\(M(t) = (t - \sin t, 1 - \cos t)\), \(t \in ]0, 2\pi[\) : trajectoire d'un point d'une roue de rayon 1 qui roule sur \((Ox)\).</p>
    <ol>
      <li>\(\overrightarrow{M'(t)} = (1 - \cos t, \sin t)\), et avec \(1 - \cos t = 2\sin^2\tfrac t2\), \(\sin t = 2\sin\tfrac t2\cos\tfrac t2\) :
      $$\overrightarrow{M'(t)} = 2\sin\tfrac t2\,\big(\sin\tfrac t2, \cos\tfrac t2\big),$$
      avec \(2\sin\tfrac t2 \gt 0\).</li>
      <li>Donc \(\dfrac{\mathrm{d}s}{\mathrm{d}t} = 2\sin\tfrac t2\) et \(\vec T = \big(\cos(\tfrac\pi2 - \tfrac t2), \sin(\tfrac\pi2 - \tfrac t2)\big)\) : \(\alpha = \tfrac\pi2 - \tfrac t2\).</li>
      <li>\(\gamma = \dfrac{\alpha'(t)}{\mathrm{d}s/\mathrm{d}t} = -\dfrac{1}{4\sin(t/2)}\) : l'arche tourne à droite, et \(|\gamma|\) est minimale au sommet (\(t = \pi\), \(|\gamma| = \tfrac14\)).</li>
    </ol>
  </div>

  <h3>Point birégulier et accélération</h3>
  <div class="prop-box">
    <strong>Accélération dans le repère de Frenet.</strong> Pour une courbe régulière de classe \(C^2\), en notant \(v = \dfrac{\mathrm{d}s}{\mathrm{d}t} = \big\|\overrightarrow{M'(t)}\big\|\) la vitesse scalaire :
    <div class="formula" data-nom="Vitesse et accélération dans le repère de Frenet">$$\begin{aligned} \overrightarrow{M'(t)} &= v\,\vec T, \\ \overrightarrow{M''(t)} &= \frac{\mathrm{d}v}{\mathrm{d}t}\,\vec T + \gamma\,v^2\,\vec N. \end{aligned}$$</div>
    En conséquence, le point \(M(t)\) est <strong>birégulier</strong> (\(\overrightarrow{M'}\) et \(\overrightarrow{M''}\) non colinéaires) si et seulement si \(\gamma \neq 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dériver \(\overrightarrow{M'} = v\,\vec T\).</span>
    <div class="content"><p>\(\overrightarrow{M''} = \dfrac{\mathrm{d}v}{\mathrm{d}t}\,\vec T + v\,\dfrac{\mathrm{d}\vec T}{\mathrm{d}t}\) et \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}t} = v\,\gamma\,\vec N\). Dans la base orthonormée \((\vec T, \vec N)\), le déterminant de \(\big(\overrightarrow{M'}, \overrightarrow{M''}\big)\) vaut \(v \times \gamma v^2 = \gamma v^3\), avec \(v \gt 0\) : il est non nul si et seulement si \(\gamma \neq 0\).</p></div>
  </div>
  <p>C'est la décomposition bien connue en mécanique : une <strong>accélération tangentielle</strong> \(\mathrm{d}v/\mathrm{d}t\), qui fait varier la vitesse, et une <strong>accélération normale</strong> \(v^2/R\) (avec \(R = 1/|\gamma|\), voir §5), qui fait tourner. Dans un mouvement circulaire uniforme, la première est nulle et l'accélération pointe vers le centre.</p>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) oublier de diviser par \(\mathrm{d}s/\mathrm{d}t\) : \(\gamma = \mathrm{d}\alpha/\mathrm{d}s\), pas \(\mathrm{d}\alpha/\mathrm{d}t\) (pour le cercle de rayon \(R\), \(\alpha' = 1\) mais \(\gamma = 1/R\)). (2) Donner une courbure signée sans préciser l'orientation : seul \(|\gamma|\) est intrinsèque. (3) Lire \(\vec N\) sur l'accélération : elle n'est normale que si la vitesse scalaire est constante.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RAYON, CENTRE ET CERCLE DE COURBURE</div>
  <h2>Le cercle qui épouse la courbe</h2>
  <div class="intro">En un point où la courbure n'est pas nulle, un cercle colle à la courbe mieux que tous les autres : celui qui a la même tangente et la même courbure. Son centre et son rayon résument la forme de la courbe au voisinage du point.</div>

  <div class="def-box">
    Soit \(M\) un point birégulier (\(\gamma \neq 0\)). Le <strong>rayon de courbure</strong> est \(R = \dfrac{1}{\gamma}\) (réel algébrique ; le rayon géométrique est \(|R|\)). Le <strong>centre de courbure</strong> est le point \(C\) défini par
    <div class="formula" data-nom="Centre de courbure">$$\overrightarrow{MC} = R\,\vec N = \frac{1}{\gamma}\,\vec N.$$</div>
    Le <strong>cercle de courbure</strong> (ou cercle osculateur) en \(M\) est le cercle de centre \(C\) et de rayon \(|R|\).
  </div>
  <ul>
    <li>Le centre \(C\) est sur la normale, à la distance \(|R|\) de \(M\), du côté vers lequel la courbe tourne : du côté de \(\vec N\) si \(\gamma \gt 0\), de \(-\vec N\) si \(\gamma \lt 0\). Il est toujours du côté de la concavité.</li>
    <li>\(C\) ne dépend pas de l'orientation : changer de sens de parcours change à la fois le signe de \(\gamma\) et celui de \(\vec N\).</li>
    <li>Le cercle de courbure est tangent à la courbe en \(M\) et, parcouru dans le même sens, il a la même courbure \(\gamma\) en \(M\).</li>
  </ul>

  <h3>Interprétation géométrique</h3>
  <p>Le programme demande d'interpréter rayon et cercle de courbure sans démonstration formelle. Trois images à retenir :</p>
  <ul>
    <li><strong>Le meilleur cercle tangent.</strong> Parmi les cercles tangents à la courbe en \(M\) (centres sur la normale), un cercle plus petit que le cercle osculateur tourne plus vite que la courbe et s'en écarte d'un côté ; un cercle plus grand tourne moins vite et s'en écarte de l'autre côté. Le cercle osculateur est la frontière entre les deux : il suit la courbe beaucoup plus longtemps.</li>
    <li><strong>Deux normales voisines.</strong> Les normales en \(M(t)\) et \(M(t + h)\) se coupent, pour \(h\) petit, près du centre de courbure, qui est la position limite de leur intersection. C'est l'idée du §8.</li>
    <li><strong>Le conducteur.</strong> Dans un virage pris à la vitesse \(v\), l'accélération normale vaut \(v^2/|R|\) : le passager ressent la même chose que sur un rond-point de rayon \(|R|\).</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — centre de courbure d'une parabole</strong>
    <p>La parabole \(y = \tfrac{x^2}{2}\), paramétrée par \(x \mapsto \big(x, \tfrac{x^2}{2}\big)\).</p>
    <ol>
      <li>\(f'(x) = x\), \(f''(x) = 1\) : \(\gamma = \dfrac{1}{(1 + x^2)^{3/2}} \gt 0\) et \(R = (1 + x^2)^{3/2}\).</li>
      <li>\(\vec T = \dfrac{(1, x)}{\sqrt{1 + x^2}}\) et \(\vec N = \dfrac{(-x, 1)}{\sqrt{1 + x^2}}\).</li>
      <li>Le centre de courbure :
      $$\begin{aligned} C = M + R\vec N &= \Big(x, \frac{x^2}{2}\Big) + (1 + x^2)(-x, 1) \\ &= \Big(-x^3,\ 1 + \frac32 x^2\Big). \end{aligned}$$</li>
      <li>Au sommet \(O\) : \(R = 1\), \(C = (0, 1)\), cercle osculateur \(x^2 + (y - 1)^2 = 1\) (figure). Au point \((1, \tfrac12)\) : \(R = 2\sqrt2 \approx 2{,}83\) et \(C = (-1, \tfrac52)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — l'ellipse en ses sommets</strong>
    <p>Pour \(x = 3\cos t\), \(y = 2\sin t\), la formule du §4 donne \(\gamma(t) = \dfrac{6}{(9\sin^2 t + 4\cos^2 t)^{3/2}}\).</p>
    <ol>
      <li>Au sommet \((3, 0)\) (\(t = 0\)) : \(\gamma = \tfrac{6}{8} = \tfrac34\), \(R = \tfrac43\), \(\vec N = (-1, 0)\), d'où \(C = \big(3 - \tfrac43, 0\big) = \big(\tfrac53, 0\big)\).</li>
      <li>Au sommet \((0, 2)\) (\(t = \tfrac\pi2\)) : \(\gamma = \tfrac{6}{27} = \tfrac29\), \(R = \tfrac92\), \(\vec N = (0, -1)\), d'où \(C = \big(0, 2 - \tfrac92\big) = \big(0, -\tfrac52\big)\).</li>
      <li>En général, pour une ellipse de demi-axes \(a \gt b\), le rayon de courbure vaut \(b^2/a\) aux extrémités du grand axe et \(a^2/b\) aux extrémités du petit axe.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : placer le centre de courbure du mauvais côté. On écrit \(C = M + \tfrac{1}{\gamma}\vec N\) <em>avec le signe de \(\gamma\)</em>, et l'on vérifie sur un croquis que \(C\) est du côté concave. Le rayon du cercle est \(|R|\), pas \(R\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DÉVELOPPÉE</div>
  <h2>Le lieu des centres de courbure</h2>
  <div class="intro">Quand \(M\) parcourt la courbe, son centre de courbure décrit une nouvelle courbe, la développée. Elle résume la façon dont la courbure varie : ses pointes correspondent aux sommets de la courbe, là où la courbure est extrémale.</div>

  <div class="def-box">
    La <strong>développée</strong> d'une courbe birégulière est l'ensemble de ses centres de courbure. Elle est paramétrée par
    <div class="formula" data-nom="Développée">$$t \mapsto C(t) = M(t) + R(t)\,\vec N(t), \qquad R = \frac{1}{\gamma}.$$</div>
  </div>

  <div class="method-box">
    <strong>Exemple — développée de l'ellipse</strong>
    <p>\(M(t) = (a\cos t, b\sin t)\), \(a \gt b \gt 0\), \(c^2 = a^2 - b^2\), \(D = \sqrt{a^2\sin^2 t + b^2\cos^2 t}\).</p>
    <ol>
      <li>D'après le §3 et le §4 : \(\vec N = \dfrac1D(-b\cos t, -a\sin t)\) et \(R = \dfrac{D^3}{ab}\).</li>
      <li>\(C = M + R\vec N\), soit
      $$C = \Big(a\cos t - \frac{D^2}{a}\cos t,\ b\sin t - \frac{D^2}{b}\sin t\Big).$$</li>
      <li>Or \(a^2 - D^2 = (a^2 - b^2)\cos^2 t\) et \(b^2 - D^2 = -(a^2 - b^2)\sin^2 t\), d'où
      $$C(t) = \Big(\frac{c^2}{a}\cos^3 t,\ -\frac{c^2}{b}\sin^3 t\Big).$$</li>
      <li>En éliminant \(t\) grâce à \(\cos^2 t + \sin^2 t = 1\) : \((ax)^{2/3} + (by)^{2/3} = c^{4/3}\). C'est une astroïde étirée, appelée astroïde de Lamé.</li>
      <li>Pour \(a = 3\), \(b = 2\) : \(C(t) = \big(\tfrac53\cos^3 t, -\tfrac52\sin^3 t\big)\), dont les quatre pointes \(\big(\pm\tfrac53, 0\big)\) et \(\big(0, \pm\tfrac52\big)\) sont les centres de courbure des quatre sommets, trouvés au §5.</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Propriétés géométriques</strong> (démontrées au §8).
    <ul>
      <li>La normale en \(M(t)\) est tangente à la développée en \(C(t)\), quand \(C(t)\) est un point régulier de la développée.</li>
      <li>\(C'(t) = R'(t)\,\vec N(t)\) : le point \(C(t)\) est stationnaire exactement quand \(R'(t) = 0\), c'est-à-dire aux <strong>sommets</strong> de la courbe, points où la courbure est stationnaire (en général extrémale). La développée y présente en général une pointe : les quatre sommets de l'ellipse donnent les quatre pointes de l'astroïde de Lamé.</li>
      <li>La développée d'un cercle est réduite à son centre (\(R\) constant).</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Exemple — la développée d'une cycloïde est une cycloïde</strong>
    <p>Reprenons l'arche \(M(t) = (t - \sin t, 1 - \cos t)\) du §4 : \(\vec T = \big(\sin\tfrac t2, \cos\tfrac t2\big)\), \(\gamma = -\dfrac{1}{4\sin(t/2)}\).</p>
    <ol>
      <li>\(\vec N = \big(-\cos\tfrac t2, \sin\tfrac t2\big)\) et \(R = \dfrac1\gamma = -4\sin\tfrac t2\).</li>
      <li>Avec \(4\sin\tfrac t2\cos\tfrac t2 = 2\sin t\) et \(4\sin^2\tfrac t2 = 2(1 - \cos t)\) :
      $$C = M + R\vec N = (t + \sin t,\ \cos t - 1).$$</li>
      <li>Avec \(t = u + \pi\) : \(C\) a pour coordonnées \((u - \sin u) + \pi\) et \((1 - \cos u) - 2\). La développée est l'image de la cycloïde par la translation de vecteur \((\pi, -2)\).</li>
    </ol>
    <p>Cette propriété remarquable a permis à Huygens de construire un pendule dont la période ne dépend pas de l'amplitude.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier qu'un point d'inflexion (\(\gamma = 0\)) n'a pas de centre de courbure. Au voisinage d'une inflexion, \(|R| \to +\infty\) et la développée part à l'infini : on l'étudie sur chaque intervalle où \(\gamma\) ne s'annule pas.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ENVELOPPE D'UNE FAMILLE DE DROITES</div>
  <h2>Une courbe dessinée par des droites</h2>
  <div class="intro">Tracez beaucoup de droites d'une famille dépendant d'un paramètre : une courbe apparaît, que chaque droite touche sans la traverser. C'est l'enveloppe de la famille. Toute courbe régulière est l'enveloppe de ses tangentes ; le problème posé ici est l'inverse : retrouver la courbe à partir des droites.</div>

  <p>On note \(\det(\vec p, \vec q) = p_1q_2 - p_2q_1\) le déterminant de deux vecteurs du plan dans la base \((\vec\imath, \vec\jmath)\) : il est nul si et seulement si \(\vec p\) et \(\vec q\) sont colinéaires.</p>
  <div class="def-box">
    Soit \(A\) et \(\vec u\) de classe \(C^1\) sur un intervalle \(I\), avec \(\vec u(t) \neq \vec 0\), et la famille de droites \(D_t = \{A(t) + \lambda\,\vec u(t),\ \lambda \in \mathbb{R}\}\). Une <strong>enveloppe</strong> de la famille est une courbe
    $$t \mapsto E(t) = A(t) + \lambda(t)\,\vec u(t),$$
    où \(\lambda\) est de classe \(C^1\), dont la tangente au point courant \(E(t)\) est dirigée par \(\vec u(t)\) : chaque droite \(D_t\) est tangente à l'enveloppe en \(E(t)\), appelé <strong>point de contact</strong> (ou point caractéristique) de \(D_t\).
  </div>
  <div class="prop-box">
    <strong>Calcul du point de contact.</strong> \(E'(t) = A'(t) + \lambda'(t)\,\vec u(t) + \lambda(t)\,\vec u\,'(t)\). Le terme \(\lambda'\vec u\) est déjà colinéaire à \(\vec u\) : la condition « \(E'(t)\) colinéaire à \(\vec u(t)\) » s'écrit \(\det\big(A' + \lambda\,\vec u\,', \vec u\big) = 0\). Si \(\det\big(\vec u\,'(t), \vec u(t)\big) \neq 0\), elle détermine \(\lambda\) :
    <div class="formula" data-nom="Point de contact d'une enveloppe">$$\lambda(t) = -\frac{\det\big(A'(t), \vec u(t)\big)}{\det\big(\vec u\,'(t), \vec u(t)\big)}.$$</div>
    La condition \(\det(\vec u\,', \vec u) \neq 0\) signifie que la direction des droites tourne : sinon les droites restent parallèles.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Interprétation</span>
    <span class="prompt">Le point de contact est la limite de l'intersection de deux droites voisines.</span>
    <div class="content"><p>Cherchons l'intersection de \(D_t\) et \(D_{t+h}\) sous la forme \(P_h = A(t) + \lambda_h\,\vec u(t)\). Elle est sur \(D_{t+h}\) si \(\det\big(P_h - A(t + h), \vec u(t + h)\big) = 0\), soit
    $$\lambda_h\,\det\big(\vec u(t), \vec u(t + h)\big) = \det\big(A(t + h) - A(t), \vec u(t + h)\big).$$
    Comme \(\det\big(\vec u(t), \vec u(t)\big) = 0\), le déterminant de gauche vaut \(\det\big(\vec u(t), \vec u(t+h) - \vec u(t)\big)\) ; on divise par \(h\) et on fait tendre \(h\) vers 0 : \(\lambda_h \to \dfrac{\det(A', \vec u)}{\det(\vec u, \vec u\,')}\), qui est exactement le \(\lambda(t)\) ci-dessus. Le point de contact est la position limite du point où \(D_t\) coupe ses voisines.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — l'échelle glissante</strong>
    <p>Une échelle \([AB]\) de longueur 1 glisse, \(A\) sur \((Ox)\) et \(B\) sur \((Oy)\) : \(A = (\cos\theta, 0)\), \(B = (0, \sin\theta)\), \(\theta \in ]0, \tfrac\pi2[\). Quelle courbe les positions de l'échelle enveloppent-elles ?</p>
    <ol>
      <li>\(D_\theta = (AB)\) : \(A(\theta) = (\cos\theta, 0)\) et \(\vec u(\theta) = \overrightarrow{AB} = (-\cos\theta, \sin\theta)\).</li>
      <li>\(A'(\theta) = (-\sin\theta, 0)\) et \(\vec u\,'(\theta) = (\sin\theta, \cos\theta)\).</li>
      <li>\(\det(A', \vec u) = -\sin^2\theta\) et \(\det(\vec u\,', \vec u) = \sin^2\theta + \cos^2\theta = 1\).</li>
      <li>\(\lambda = \sin^2\theta\), et
      $$\begin{aligned} E = A + \lambda\vec u &= \big(\cos\theta - \sin^2\theta\cos\theta,\ \sin^3\theta\big) \\ &= (\cos^3\theta, \sin^3\theta). \end{aligned}$$</li>
      <li>L'enveloppe est l'arc d'<strong>astroïde</strong> \(x^{2/3} + y^{2/3} = 1\) du premier quadrant. Comme \(\lambda \in ]0, 1[\), le point de contact est sur l'échelle, à la distance \(\sin^2\theta\) de \(A\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le fil tendu</strong>
    <p>On joint \(A(s) = (s, 0)\) à \(B(s) = (0, 1 - s)\) pour \(s \in ]0, 1[\) (le principe des dessins en fils tendus).</p>
    <ol>
      <li>\(\vec u = \overrightarrow{AB} = (-s, 1 - s)\), \(A' = (1, 0)\), \(\vec u\,' = (-1, -1)\).</li>
      <li>\(\det(A', \vec u) = 1 - s\) et \(\det(\vec u\,', \vec u) = -(1 - s) - s = -1\), donc \(\lambda = 1 - s\).</li>
      <li>\(E = A + \lambda\vec u = \big(s^2, (1 - s)^2\big)\), et \(\sqrt x + \sqrt y = 1\) : un arc de parabole, d'axe la droite \(y = x\).</li>
    </ol>
  </div>

  <text x="406.8" y="275.7" class="lab-b" text-anchor="middle">fil tendu</text>
  </svg>
  <figcaption>À gauche, une échelle de longueur 1 glisse, ses extrémités A et B sur les axes : ses positions successives enveloppent un arc d'astroïde (rouge), touché par la droite (AB) au point E. À droite, on joint A(s, 0) à B(0, 1 − s) : les droites enveloppent l'arc de parabole √x + √y = 1. Dans les deux cas, la courbe n'est tracée par aucune droite, elle « apparaît » comme leur bord.</figcaption>
  </figure>

  <div class="prop-box">
    <strong>Variante : droites données par une équation.</strong> Si \(D_t\) a pour équation \(a(t)\,x + b(t)\,y = c(t)\), le point de contact \(E(t)\) est solution du système
    $$\begin{cases} a(t)\,x + b(t)\,y = c(t) \\ a'(t)\,x + b'(t)\,y = c'(t). \end{cases}$$
    En effet, \(E(t) \in D_t\) pour tout \(t\) ; en dérivant cette relation, le terme \(a\,x_E' + b\,y_E'\) est nul, puisque \(E'(t)\) dirige \(D_t\) et que \((a, b)\) est normal à \(D_t\). Pour l'échelle : \(x\sin\theta + y\cos\theta = \sin\theta\cos\theta\) et, en dérivant, \(x\cos\theta - y\sin\theta = \cos 2\theta\) ; on retrouve \(x = \cos^3\theta\), \(y = \sin^3\theta\).
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) confondre l'enveloppe avec le lieu d'un point fixé de la droite (le milieu de l'échelle décrit un quart de cercle, pas l'astroïde) : le point de contact glisse le long de la droite. (2) Appliquer la formule quand \(\det(\vec u\,', \vec u) = 0\) : une famille de droites parallèles n'a pas d'enveloppe. (3) Ne pas contrôler le résultat : pour des droites concourantes, la formule donne leur point commun, fixe (\(E' = \vec 0\)), et non une courbe tangente aux droites.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · LA DÉVELOPPÉE, ENVELOPPE DES NORMALES</div>
  <h2>Retrouver la développée par les normales</h2>
  <div class="intro">Le programme demande de caractériser la développée comme l'enveloppe des normales. C'est une application directe du §7 et des formules de Frenet, et c'est souvent le moyen le plus rapide de calculer une développée : pas besoin de la courbure.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit une courbe birégulière de classe \(C^2\). L'enveloppe de la famille de ses normales \(D_t = M(t) + \operatorname{Vect}\big(\vec N(t)\big)\) est sa développée : le point de contact de la normale en \(M(t)\) est le centre de courbure \(C(t)\). De plus, \(C'(t) = R'(t)\,\vec N(t)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Chercher \(E = M + \lambda\vec N\) avec les formules de Frenet.</span>
    <div class="content"><p>Notons \(v = \mathrm{d}s/\mathrm{d}t \gt 0\). On a \(\overrightarrow{M'} = v\,\vec T\) et, par la formule de Frenet, \(\dfrac{\mathrm{d}\vec N}{\mathrm{d}t} = v\,\dfrac{\mathrm{d}\vec N}{\mathrm{d}s} = -v\gamma\,\vec T\). Pour \(E(t) = M(t) + \lambda(t)\,\vec N(t)\) :
    $$E'(t) = v\,\vec T + \lambda'\,\vec N - \lambda v\gamma\,\vec T = v\,(1 - \lambda\gamma)\,\vec T + \lambda'\,\vec N.$$
    \(E'\) est colinéaire à \(\vec N\) si et seulement si \(1 - \lambda\gamma = 0\), soit \(\lambda = 1/\gamma = R\) : \(E = M + R\vec N = C\). Avec \(\lambda = R\), il reste \(C'(t) = R'(t)\,\vec N(t)\) : la développée est tangente à la normale en \(C(t)\) quand \(R'(t) \neq 0\), et stationnaire quand \(R'(t) = 0\).</p></div>
  </div>
  <p>Géométriquement, deux normales voisines se coupent près du centre de courbure (§5) : en traçant beaucoup de normales, on voit la développée se dessiner d'elle-même.</p>

  <div class="method-box">
    <strong>Méthode — calculer une développée</strong>
    <ol>
      <li><strong>Par la courbure</strong> : calculer \(\gamma\) et \(\vec N\), puis \(C = M + \tfrac1\gamma\vec N\) (§6).</li>
      <li><strong>Par les normales</strong> : la normale en \(M(t)\) est dirigée par \(\vec w(t) = \big(-y'(t), x'(t)\big)\) ; appliquer le §7 avec \(A = M\) et \(\vec u = \vec w\). Souvent plus rapide : aucune racine carrée n'apparaît.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — développée de la parabole par les normales</strong>
    <p>\(y = \tfrac{x^2}{2}\), points \(M(u) = \big(u, \tfrac{u^2}{2}\big)\), normale dirigée par \(\vec w(u) = (-u, 1)\).</p>
    <ol>
      <li>\(M'(u) = (1, u)\) et \(\vec w\,'(u) = (-1, 0)\).</li>
      <li>\(\det(M', \vec w) = 1 + u^2\) et \(\det(\vec w\,', \vec w) = -1\), donc \(\lambda = 1 + u^2\).</li>
      <li>\(E = M + \lambda\vec w = \big(-u^3,\ 1 + \tfrac32 u^2\big)\) : c'est bien le centre de courbure trouvé au §5.</li>
      <li>En éliminant \(u\) : \(x^2 = \tfrac{8}{27}(y - 1)^3\), une parabole semi-cubique, avec une pointe en \((0, 1)\), centre de courbure du sommet, là où le rayon de courbure est minimal.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — l'ellipse, sans calculer la courbure</strong>
    <p>\(M(t) = (a\cos t, b\sin t)\) ; la normale est dirigée par \(\vec w(t) = (b\cos t, a\sin t)\), orthogonal à \(M'(t) = (-a\sin t, b\cos t)\).</p>
    <ol>
      <li>\(\det(M', \vec w) = -a^2\sin^2 t - b^2\cos^2 t\) et \(\vec w\,' = (-b\sin t, a\cos t)\), \(\det(\vec w\,', \vec w) = -ab\).</li>
      <li>\(\lambda = -\dfrac{a^2\sin^2 t + b^2\cos^2 t}{ab}\), et après simplification :
      $$E = M + \lambda\vec w = \Big(\frac{c^2}{a}\cos^3 t,\ -\frac{c^2}{b}\sin^3 t\Big),$$
      la même astroïde de Lamé qu'au §6, en deux lignes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour \(\vec u\) un vecteur <em>tangent</em> au lieu d'un vecteur normal. L'enveloppe des tangentes d'une courbe est la courbe elle-même : on trouverait \(\lambda = 0\) et \(E = M\), signe qu'on s'est trompé de famille.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Formule du déterminant, polaires, développantes</h2>
  <div class="intro">Ces compléments ne sont pas exigibles. La formule de la courbure par un déterminant est utile pour <strong>vérifier</strong> un calcul ; elle ne remplace pas, aux concours de PT, la méthode par l'angle \(\alpha\) ou par les formules de Frenet.</div>
  <h3>La courbure par un déterminant (hors programme)</h3>
  <p>D'après la décomposition de l'accélération (§4), \(\det\big(\overrightarrow{M'}, \overrightarrow{M''}\big)\) se calcule dans la base orthonormée directe \((\vec T, \vec N)\) :</p>
  <div class="formula">$$\begin{aligned} \det\big(\overrightarrow{M'}, \overrightarrow{M''}\big) &= \det\Big(v\,\vec T,\ \frac{\mathrm{d}v}{\mathrm{d}t}\,\vec T + \gamma v^2\,\vec N\Big) \\ &= \gamma v^3, \end{aligned}$$</div>
  <p>d'où</p>
  <div class="formula">$$\gamma = \frac{\det\big(\overrightarrow{M'}, \overrightarrow{M''}\big)}{\big\|\overrightarrow{M'}\big\|^3} = \frac{x'y'' - y'x''}{\big(x'^2 + y'^2\big)^{3/2}}.$$</div>
  <p>Vérifications : pour l'ellipse, \(x'y'' - y'x'' = ab\), et l'on retrouve \(\gamma = ab/D^3\) ; pour la cycloïde, \(x'y'' - y'x'' = \cos t - 1\) et \(\big(x'^2 + y'^2\big)^{3/2} = \big(4\sin^2\tfrac t2\big)^{3/2}\), d'où \(\gamma = -\dfrac{1}{4\sin(t/2)}\).</p>
  <h3>Courbes polaires</h3>
  <p>Pour une courbe d'équation polaire \(r = f(\theta)\), le calcul fait pour la cardioïde au §1 se généralise : \(\dfrac{\mathrm{d}s}{\mathrm{d}\theta} = \sqrt{f(\theta)^2 + f'(\theta)^2}\).</p>
  <h3>Développantes</h3>
  <p>D'après \(C' = R'\vec N\), on a \(\|C'\| = |R'|\) : si \(R\) est monotone sur \([t_1, t_2]\), l'arc de développée correspondant mesure \(|R(t_2) - R(t_1)|\). Pour l'ellipse \(a = 3\), \(b = 2\), un quart de l'astroïde de Lamé mesure ainsi \(\tfrac92 - \tfrac43 = \tfrac{19}{6}\). Interprétation : en déroulant un fil tendu enroulé sur la développée, son extrémité décrit la courbe de départ, qu'on appelle une <strong>développante</strong> de sa développée. Les profils de dents d'engrenage « en développante de cercle », étudiés en SI, sont obtenus ainsi à partir d'un cercle.</p>
</div>
  <div class="video-resources">
    <span class="vr-label">▶ Ressources vidéo</span>

  </div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · GÉOMÉTRIE MÉTRIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à mesurer une courbe (longueur, abscisse curviligne), à lui attacher son repère de Frenet, à calculer et interpréter sa courbure, son centre et son cercle de courbure, sa développée, et à trouver l'enveloppe d'une famille de droites. Chaque calcul se contrôle par un croquis : le programme privilégie la vision géométrique.</div>

  <div class="method-box"><strong>Méthode 1 — Calculer la longueur d'un arc</strong>
    <ol>
      <li>Calculer \(\overrightarrow{M'(t)} = \big(x'(t), y'(t)\big)\) et \(\big\|\overrightarrow{M'(t)}\big\|^2 = x'(t)^2 + y'(t)^2\).</li>
      <li>Simplifier sous la racine pour faire apparaître un carré : \(1 - \cos t = 2\sin^2\tfrac t2\), \(1 + \operatorname{sh}^2 = \operatorname{ch}^2\), identité remarquable…</li>
      <li>Prendre la racine <strong>avec sa valeur absolue</strong>, puis étudier son signe sur \([a, b]\) (découper l'intervalle si besoin).</li>
      <li>Intégrer : \(L = \displaystyle\int_a^b \big\|\overrightarrow{M'(t)}\big\|\,\mathrm{d}t\) ; pour un graphe, \(L = \displaystyle\int_a^b \sqrt{1 + f'(x)^2}\,\mathrm{d}x\). Contrôle : \(L\) est au moins égale à la longueur de la corde.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(t) = (t^3 - 3t,\ 3t^2)\), \(t \in [0, 1]\). \(\big\|\overrightarrow{M'(t)}\big\|^2 = 9(t^2 - 1)^2 + 36t^2 = 9(t^2 + 1)^2\), donc \(\big\|\overrightarrow{M'(t)}\big\| = 3(t^2 + 1)\) et \(L = \displaystyle\int_0^1 3(t^2 + 1)\,\mathrm{d}t = 4\). Contrôle : la corde de \(O\) à \(M(1) = (-2, 3)\) mesure \(\sqrt{13} \approx 3{,}61\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\sqrt{4\sin^2(t/2)} = 2\,|\sin(t/2)|\), et non \(2\sin(t/2)\) sur \([-\pi, \pi]\). Et la formule mesure le <em>chemin parcouru</em> : un cercle décrit deux fois compte double.</div>

  <div class="method-box"><strong>Méthode 2 — Calculer une abscisse curviligne, un paramétrage normal</strong>
    <ol>
      <li>Choisir l'origine \(M(t_0)\) et calculer \(s(t) = \displaystyle\int_{t_0}^{t} \big\|\overrightarrow{M'(u)}\big\|\,\mathrm{d}u\), fonction strictement croissante pour une courbe régulière.</li>
      <li>Pour un paramétrage normal, exprimer \(t\) en fonction de \(s\) si c'est possible, et le reporter dans \(M(t)\).</li>
      <li>Sinon, inutile d'inverser : dériver par rapport à \(s\) avec \(\dfrac{\mathrm{d}g}{\mathrm{d}s} = \dfrac{1}{\|\overrightarrow{M'(t)}\|}\,\dfrac{\mathrm{d}g}{\mathrm{d}t}\).</li>
      <li>Contrôle : \(\left\|\dfrac{\mathrm{d}M}{\mathrm{d}s}\right\| = 1\).</li>
    </ol>
    <p><em>Exemple éclair :</em> la chaînette \(y = \operatorname{ch} x\), d'origine \((0, 1)\) : \(s(x) = \displaystyle\int_0^x \operatorname{ch} u\,\mathrm{d}u = \operatorname{sh} x\). De \(\operatorname{sh} x = s\) on tire \(x = \ln\big(s + \sqrt{1 + s^2}\big)\) et \(y = \operatorname{ch} x = \sqrt{1 + s^2}\) : c'est un paramétrage normal (on vérifie que \(\tfrac{\mathrm{d}M}{\mathrm{d}s} = \tfrac{(1,\ s)}{\sqrt{1 + s^2}}\) est unitaire).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Construire le repère de Frenet et la normale</strong>
    <ol>
      <li>Orienter la courbe (en général par les \(t\) croissants) et poser \(\vec T = \dfrac{\overrightarrow{M'(t)}}{\|\overrightarrow{M'(t)}\|}\).</li>
      <li>Tourner de \(+\pi/2\) : si \(\vec T = (a, b)\), alors \(\vec N = (-b, a)\).</li>
      <li>La normale en \(M(t_0)\) est la droite \(M(t_0) + \operatorname{Vect}(\vec N)\), d'équation \(\overrightarrow{M(t_0)M}\cdot\overrightarrow{M'(t_0)} = 0\).</li>
      <li>Contrôle : \((\vec T, \vec N)\) est orthonormée directe, et \(\vec N\) est « à gauche » du sens de parcours.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(t) = (t^2, 2t)\) en \(t = 1\) : \(\overrightarrow{M'(1)} = (2, 2)\), donc \(\vec T = \tfrac{1}{\sqrt2}(1, 1)\), \(\vec N = \tfrac{1}{\sqrt2}(-1, 1)\), et la normale en \(M(1) = (1, 2)\) a pour équation \(x + y = 3\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\vec N\) est \(\vec T\) tourné de \(+\pi/2\), pas l'accélération normalisée (l'accélération a en général une composante tangentielle). Et \(\vec N\) ne pointe pas toujours vers l'intérieur du virage : quand la courbe tourne à droite, il pointe vers l'extérieur.</div>

  <div class="method-box"><strong>Méthode 4 — Calculer la courbure</strong>
    <ol>
      <li><strong>Par l'angle \(\alpha\)</strong> : écrire \(\overrightarrow{M'(t)} = \rho(t)\big(\cos\theta(t), \sin\theta(t)\big)\) avec \(\rho(t) \gt 0\) ; alors \(\alpha = \theta\) et \(\gamma = \dfrac{\alpha'(t)}{\|\overrightarrow{M'(t)}\|}\). À défaut, dériver \(\tan\alpha = y'/x'\) là où \(x' \neq 0\).</li>
      <li><strong>Par la définition</strong> : calculer \(\dfrac{\mathrm{d}\vec T}{\mathrm{d}t}\) et l'écrire \(\big\|\overrightarrow{M'(t)}\big\|\,\gamma\,\vec N\) : le coefficient de \(\vec N\) divisé par la vitesse scalaire est \(\gamma\).</li>
      <li><strong>Pour un graphe</strong> \(y = f(x)\) : \(\gamma = \dfrac{f''(x)}{\big(1 + f'(x)^2\big)^{3/2}}\).</li>
      <li>Contrôle : le signe doit correspondre au sens dans lequel la courbe tourne (méthode 5).</li>
    </ol>
    <p><em>Exemple éclair :</em> la spirale \(\overrightarrow{OM(t)} = e^t(\cos t, \sin t)\). On trouve \(\overrightarrow{M'(t)} = e^t(\cos t - \sin t,\ \sin t + \cos t)\), soit \(\sqrt2\,e^t\big(\cos(t + \tfrac\pi4), \sin(t + \tfrac\pi4)\big)\). Donc \(\alpha = t + \tfrac\pi4\), \(\tfrac{\mathrm{d}s}{\mathrm{d}t} = \sqrt2\,e^t\) et \(\gamma = \dfrac{1}{\sqrt2\,e^t}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\gamma = \dfrac{\mathrm{d}\alpha}{\mathrm{d}s}\), pas \(\dfrac{\mathrm{d}\alpha}{\mathrm{d}t}\) : oublier de diviser par la vitesse scalaire donne 1 pour la courbure d'un cercle de rayon 5. La formule qui donne \(\gamma\) par le déterminant de \(\overrightarrow{M'}\) et \(\overrightarrow{M''}\) est hors programme : elle sert à vérifier un résultat, pas à le justifier.</div>

  <div class="method-box"><strong>Méthode 5 — Interpréter la courbure</strong>
    <ol>
      <li><strong>Signe</strong> : \(\gamma \gt 0\), la tangente tourne dans le sens direct, la courbe tourne à gauche, du côté de \(\vec N\) ; \(\gamma \lt 0\), elle tourne à droite.</li>
      <li><strong>Zéros</strong> : là où \(\gamma\) s'annule en changeant de signe, il y a une inflexion, et pas de centre de courbure.</li>
      <li><strong>Valeur absolue</strong> : \(|\gamma|\) est l'angle dont tourne la tangente par unité de longueur ; \(1/|\gamma|\) est le rayon du cercle qui épouse le mieux la courbe. Les <strong>sommets</strong> sont les points où \(\gamma\) est stationnaire (en général extrémale).</li>
      <li><strong>Orientation</strong> : la changer change le signe de \(\gamma\), jamais \(|\gamma|\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y = \ln x\) : \(\gamma = \dfrac{-1/x^2}{(1 + 1/x^2)^{3/2}} = -\dfrac{x}{(1 + x^2)^{3/2}} \lt 0\), le graphe tourne à droite (fonction concave). En dérivant, \(|\gamma|\) est maximale pour \(x = \tfrac{1}{\sqrt2}\) : c'est le sommet, de courbure \(-\tfrac{2}{3\sqrt3} \approx -0{,}385\), de rayon minimal \(\tfrac{3\sqrt3}{2} \approx 2{,}60\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Trouver le centre et le cercle de courbure</strong>
    <ol>
      <li>Vérifier que \(\gamma \neq 0\) (point birégulier).</li>
      <li>Poser \(R = \dfrac1\gamma\), rayon de courbure <strong>algébrique</strong>, et \(C = M + R\,\vec N\).</li>
      <li>Contrôler sur un croquis : \(C\) est sur la normale, à la distance \(|R|\) de \(M\), du côté de la concavité.</li>
      <li>Le cercle de courbure a pour centre \(C\) et pour rayon \(|R|\) : \((x - x_C)^2 + (y - y_C)^2 = R^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y = \tfrac1x\) au point \((1, 1)\) : \(f'(1) = -1\), \(f''(1) = 2\), donc \(\gamma = \tfrac{2}{2^{3/2}} = \tfrac{1}{\sqrt2}\) et \(R = \sqrt2\). Avec \(\vec T = \tfrac{1}{\sqrt2}(1, -1)\) et \(\vec N = \tfrac{1}{\sqrt2}(1, 1)\) : \(C = (1, 1) + (1, 1) = (2, 2)\), et le cercle de courbure a pour équation \((x - 2)^2 + (y - 2)^2 = 2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : placer \(C\) du mauvais côté en prenant \(R = 1/|\gamma|\) dans \(C = M + R\vec N\). C'est le signe de \(\gamma\) qui envoie \(C\) du côté concave ; seul le rayon du cercle est \(|R|\).</div>

  <div class="method-box"><strong>Méthode 7 — Calculer une développée</strong>
    <ol>
      <li><strong>Par la courbure</strong> : \(C(t) = M(t) + \dfrac{1}{\gamma(t)}\,\vec N(t)\), sur chaque intervalle où \(\gamma\) ne s'annule pas.</li>
      <li><strong>Par les normales</strong>, souvent plus rapide (aucune racine carrée) : la normale en \(M(t)\) est dirigée par \(\vec w(t) = \big(-y'(t), x'(t)\big)\) ; la méthode 8 avec \(A = M\) et \(\vec u = \vec w\) donne \(\lambda = -\dfrac{\det(M', \vec w)}{\det(\vec w\,', \vec w)}\), puis \(C = M + \lambda\,\vec w\).</li>
      <li>Simplifier, reconnaître la courbe obtenue (en éliminant \(t\) si possible).</li>
      <li>Contrôle : en un sommet, \(C\) doit être le centre de courbure calculé directement ; la développée y a en général une pointe (\(C' = R'\,\vec N\) s'annule).</li>
    </ol>
    <p><em>Exemple éclair :</em> la chaînette \(M(x) = (x, \operatorname{ch} x)\) : \(M' = (1, \operatorname{sh} x)\), \(\vec w = (-\operatorname{sh} x, 1)\), \(\vec w\,' = (-\operatorname{ch} x, 0)\). Alors \(\det(M', \vec w) = 1 + \operatorname{sh}^2 x = \operatorname{ch}^2 x\) et \(\det(\vec w\,', \vec w) = -\operatorname{ch} x\), d'où \(\lambda = \operatorname{ch} x\) et \(C = (x - \operatorname{sh} x\operatorname{ch} x,\ 2\operatorname{ch} x)\). En \(x = 0\), \(C = (0, 2)\) : rayon de courbure 1 au sommet \((0, 1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : prendre pour \(\vec u\) un vecteur <em>tangent</em>. L'enveloppe des tangentes est la courbe elle-même : on trouve \(\lambda = 0\), signe qu'on s'est trompé de famille.</div>

  <div class="method-box"><strong>Méthode 8 — Trouver l'enveloppe d'une famille de droites \(A(t) + \lambda\,\vec u(t)\)</strong>
    <ol>
      <li>Écrire chaque droite \(D_t\) avec un point \(A(t)\) et un vecteur directeur \(\vec u(t)\), tous deux de classe \(C^1\).</li>
      <li>Calculer \(A'\), \(\vec u\,'\), puis \(\det(A', \vec u)\) et \(\det(\vec u\,', \vec u)\). Si \(\det(\vec u\,', \vec u)\) est identiquement nul, les droites sont parallèles : pas d'enveloppe.</li>
      <li>Le point de contact est \(E(t) = A(t) + \lambda(t)\,\vec u(t)\), avec \(\lambda = -\dfrac{\det(A', \vec u)}{\det(\vec u\,', \vec u)}\) (condition : \(E'(t)\) colinéaire à \(\vec u(t)\)).</li>
      <li>Contrôle : \(E'(t)\) est bien colinéaire à \(\vec u(t)\) ; reconnaître la courbe en éliminant \(t\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(D_t\) passe par \(A(t) = (2t, 0)\) et est dirigée par \(\vec u(t) = (1, t)\). \(A' = (2, 0)\), \(\vec u\,' = (0, 1)\), \(\det(A', \vec u) = 2t\), \(\det(\vec u\,', \vec u) = -1\) : \(\lambda = 2t\) et \(E(t) = (4t, 2t^2)\), qui décrit la parabole \(y = \tfrac{x^2}{8}\). Contrôle : \(E'(t) = (4, 4t) = 4\,\vec u(t)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre l'enveloppe avec le lieu d'un point <em>fixé</em> de la droite (milieu, extrémité) : le point de contact glisse le long de la droite, il se calcule pour chaque \(t\).</div>

  <div class="method-box"><strong>Méthode 9 — Enveloppe de droites données par une équation</strong>
    <ol>
      <li>Écrire \(D_t : a(t)\,x + b(t)\,y = c(t)\).</li>
      <li>Dériver cette relation par rapport à \(t\), \(x\) et \(y\) étant fixés : \(a'(t)\,x + b'(t)\,y = c'(t)\).</li>
      <li>Résoudre le système de ces deux équations : sa solution est le point de contact \(E(t)\).</li>
      <li>Éliminer \(t\) pour une équation cartésienne de l'enveloppe, si on la demande.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(D_t : t\,x - y = t^2\). En dérivant : \(x = 2t\), puis \(y = t\,x - t^2 = t^2\). Le point de contact est \(E(t) = (2t, t^2)\) : les droites \(D_t\) enveloppent la parabole \(y = \tfrac{x^2}{4}\), dont elles sont les tangentes.</p>
  </div>
</div>
</template>
