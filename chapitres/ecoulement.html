<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Partie 1.4 « Description d'un fluide en écoulement stationnaire dans une conduite » du programme de PT. L'approche est eulérienne et fondée sur des bilans macroscopiques : toute formulation locale à l'aide d'opérateurs vectoriels (dérivée particulaire, divergence, rotationnel) est exclue du programme, et regroupée en fin de chapitre.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Grandeurs eulériennes</strong> et régime stationnaire : décrire localement un fluide par ses grandeurs intensives (§1, §2).</li>
        <li><strong>Lignes et tubes de courant</strong> (§3).</li>
        <li><strong>Débit massique</strong> : l'exprimer ; exploiter sa conservation le long d'un tube de courant (§4).</li>
        <li><strong>Débit volumique</strong> : justifier son intérêt pour un fluide de volume massique uniforme (§5).</li>
        <li><strong>Écoulements laminaires et turbulents</strong> : relier le régime au nombre de Reynolds (§6).</li>
      </ul>
      <p>Les écoulements sont étudiés en régime stationnaire, dans des conduites, à l'aide de bilans sur des tubes de courant.</p>
    </div>
  </div>
</div>
<div class="course-section">
  <div class="sec-num">§1 · ÉCHELLES ET PARTICULE DE FLUIDE</div>
  <h2>Du désordre moléculaire aux champs continus</h2>
  <div class="intro">Un liquide ou un gaz est un ensemble de molécules en agitation permanente. Pour décrire un écoulement, on remplace pourtant ce fourmillement par des champs continus (vitesse, masse volumique, pression, température) définis en chaque point. Ce passage repose sur le choix d'une échelle intermédiaire bien choisie.</div>

  <h3>Trois échelles de longueur</h3>
  <ul>
    <li><strong>Échelle microscopique</strong> : distance entre molécules, <strong>libre parcours moyen</strong> \(\ell\) (distance moyenne parcourue entre deux chocs). Dans l'air aux conditions usuelles, \(\ell \approx 0{,}1\ \mu\text{m}\) ; dans un liquide, \(\ell\) se confond avec la taille des molécules (quelques \(10^{-10}\ \text{m}\)).</li>
    <li><strong>Échelle macroscopique</strong> \(L\) : taille caractéristique de l'écoulement (diamètre d'une conduite, corde d'une aile, profondeur d'une rivière), du centimètre au kilomètre.</li>
    <li><strong>Échelle mésoscopique</strong> \(a\), intermédiaire : \(\ell \ll a \ll L\).</li>
  </ul>

  <div class="def-box">
    <strong>Particule de fluide.</strong> Volume \(\mathrm d\tau\) de taille mésoscopique, contenant un nombre de molécules assez grand pour que les moyennes statistiques (masse volumique, vitesse moyenne, pression…) y soient bien définies, et assez petit pour que ces grandeurs y soient uniformes à l'échelle de l'écoulement.<br>
    On la traite comme un <strong>système fermé</strong> : sa masse \(\mathrm dm = \rho\,\mathrm d\tau\) se conserve au cours du mouvement. Sa vitesse \(\vec v\) est la vitesse moyenne (barycentrique) des molécules qu'elle contient.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Ordre de grandeur</span>
    <span class="prompt">Combien de molécules contient un cube d'air de \(1\ \mu\text{m}\) de côté (\(20\ ^\circ\text{C}\), \(1\ \text{bar}\)) ? Les fluctuations y sont-elles gênantes ?</span>
    <div class="content">
      <p>Densité particulaire du gaz parfait, \(n^* = P/(k_B T)\) :</p>
      <div class="formula">$$n^* = \frac{10^5}{1{,}38\times10^{-23}\times 293}$$</div>
      <p>soit \(n^* \approx 2{,}5\times10^{25}\ \text{m}^{-3}\). Dans \(a^3 = 10^{-18}\ \text{m}^3\) : \(N \approx 2{,}5\times10^{7}\) molécules.</p>
      <p>Les fluctuations relatives d'un comptage sont de l'ordre de \(1/\sqrt N \approx 2\times10^{-4}\) : négligeables, la masse volumique est bien définie. Pour l'eau (\(n^* = \rho N_A/M \approx 3\times10^{28}\ \text{m}^{-3}\)), le même cube contient environ \(3\times10^{10}\) molécules.</p>
    </div>
  </div>

  <div class="notice"><strong>Limite du modèle continu</strong> : il suppose un <strong>nombre de Knudsen</strong> \(\mathrm{Kn} = \ell/L\) très petit devant 1. Il tombe en défaut pour les gaz très raréfiés (haute atmosphère, enceintes à vide poussé) ou des écoulements gazeux dans des canaux de taille micrométrique.</div>

  <h3>Grandeurs extensives et intensives</h3>
  <p>Réunir deux portions de fluide permet de distinguer deux sortes de grandeurs. Celles qui s'ajoutent (la masse ou la quantité de mouvement de l'ensemble est la somme des deux) sont dites <strong>extensives</strong> : elles doublent quand on double le système. Celles qui ne dépendent pas de la taille du système et prennent une valeur en chaque point, comme la pression, la température ou la vitesse, sont dites <strong>intensives</strong>.</p>
  <p>À toute grandeur extensive \(G\) on associe une <strong>densité volumique</strong> \(g\) (grandeur intensive) telle que \(\mathrm dG = g\,\mathrm d\tau\) pour une particule de fluide : la masse a pour densité \(\rho\), la quantité de mouvement \(\rho\vec v\), l'énergie cinétique \(\rho v^2/2\).</p>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DESCRIPTIONS DE LAGRANGE ET D'EULER</div>
  <h2>Suivre les particules ou regarder passer le fluide</h2>
  <div class="intro">Deux points de vue équivalents décrivent un même écoulement. Dans le premier, on accompagne chaque particule ; dans le second, on reste en des points fixes de l'espace et on observe les particules qui s'y succèdent, comme une station météorologique observe le vent.</div>

  <h3>Description lagrangienne</h3>
  <div class="def-box">
    On repère chaque particule par sa position \(M_0\) à un instant initial \(t_0\), puis on donne sa position à tout instant : \(\overrightarrow{OM} = \vec r(M_0, t)\). La courbe décrite par une particule donnée est sa <strong>trajectoire</strong>. Sa vitesse et son accélération s'obtiennent en dérivant à \(M_0\) fixé :
    $$\vec v = \frac{\partial \vec r}{\partial t}\Big|_{M_0}, \qquad \vec a = \frac{\partial^2 \vec r}{\partial t^2}\Big|_{M_0}$$
  </div>
  <p>C'est le point de vue de la mécanique du point, appliqué à une infinité de particules : les lois de la mécanique s'y écrivent directement, mais il faut suivre chaque particule, ce qui est rarement commode. Un flotteur dérivant ou un ballon-sonde réalisent une mesure lagrangienne.</p>

  <h3>Description eulérienne</h3>
  <div class="def-box">
    On décrit l'écoulement par des <strong>champs</strong> : \(\vec v(M,t)\) est la vitesse de la particule qui se trouve au point \(M\) à l'instant \(t\). De même pour \(\rho(M,t)\), \(P(M,t)\), \(T(M,t)\)… En un point fixe, ce sont des particules différentes qui se succèdent au cours du temps.
  </div>
  <p>C'est la description la plus utilisée : un anémomètre fixe, une sonde de Pitot, une caméra de vélocimétrie par images de particules mesurent des grandeurs eulériennes.</p>

  <div class="def-box">
    <strong>Écoulement stationnaire</strong> (ou permanent) : tous les champs eulériens sont indépendants du temps,
    $$\frac{\partial \vec v}{\partial t} = \vec 0, \qquad \frac{\partial \rho}{\partial t} = 0, \qquad \frac{\partial P}{\partial t} = 0\ \ldots$$
  </div>
  <div class="notice"><strong>Attention</strong> : « stationnaire » ne veut pas dire « particules non accélérées ». Dans un rétrécissement parcouru en régime permanent, chaque particule accélère en passant d'une zone lente à une zone rapide, alors que le champ des vitesses ne dépend pas du temps.</div>

  <h3>Passer d'Euler à Lagrange</h3>
  <p>Connaissant le champ \(\vec v(M,t)\), la trajectoire d'une particule partie de \(M_0\) à \(t_0\) est solution du système différentiel</p>
  <div class="formula">$$\frac{\mathrm d\overrightarrow{OM}}{\mathrm dt} = \vec v\big(M(t),\,t\big), \qquad M(t_0) = M_0$$</div>
  <p>soit, en cartésiennes, \(\dot x = v_x(x,y,z,t)\), \(\dot y = v_y(x,y,z,t)\), \(\dot z = v_z(x,y,z,t)\). On élimine ensuite \(t\) pour obtenir l'équation géométrique de la trajectoire.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Champ plan stationnaire \(v_x = U\), \(v_y = Ux/L\) (\(U\), \(L\) constantes). Trajectoire de la particule passant par \((0, y_0)\) à \(t = 0\) ?</span>
    <div class="content">
      <p>\(\dot x = U\) donne \(x = Ut\). Puis \(\dot y = Ux/L = U^2 t/L\), d'où \(y = y_0 + U^2t^2/(2L)\).</p>
      <p>En éliminant \(t\) : \(y = y_0 + \dfrac{x^2}{2L}\). Les trajectoires sont des paraboles identiques, translatées verticalement.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LIGNES DE COURANT, TRAJECTOIRES, TUBES DE COURANT</div>
  <h2>Visualiser un champ des vitesses</h2>
  <div class="intro">Une carte de lignes de courant est une « photographie » du champ des vitesses à un instant donné. Il ne faut pas la confondre avec les trajectoires, qui résultent du mouvement des particules au cours du temps.</div>

  <div class="def-box">
    <strong>Ligne de courant</strong> à l'instant \(t\) : courbe tangente en chacun de ses points au vecteur vitesse \(\vec v(M,t)\). C'est une ligne de champ du champ des vitesses, à \(t\) fixé.<br>
    <strong>Tube de courant</strong> : surface formée par l'ensemble des lignes de courant qui s'appuient sur un contour fermé. La vitesse étant tangente à sa paroi latérale, <strong>aucun fluide ne traverse cette paroi</strong>.
  </div>

  <h3>Équations des lignes de courant</h3>
  <p>Un déplacement élémentaire \(\mathrm d\vec\ell\) le long d'une ligne de courant est colinéaire à \(\vec v\) : \(\mathrm d\vec\ell\wedge\vec v = \vec 0\). À <strong>\(t\) fixé</strong> (le temps n'est qu'un paramètre) :</p>
  <div class="formula">$$\text{cartésiennes : } \frac{\mathrm dx}{v_x} = \frac{\mathrm dy}{v_y} = \frac{\mathrm dz}{v_z}$$</div>
  <div class="formula">$$\text{polaires (écoulement plan) : } \frac{\mathrm dr}{v_r} = \frac{r\,\mathrm d\theta}{v_\theta}$$</div>

  <div class="prop-box">
    <strong>Trajectoires et lignes de courant.</strong> En général distinctes, elles <strong>coïncident en régime stationnaire</strong> : le champ ne change pas pendant que la particule avance, elle suit donc la ligne de courant sur laquelle elle se trouve. Deux lignes de courant ne peuvent se couper qu'en un point où \(\vec v = \vec 0\) (<strong>point d'arrêt</strong>) ou en une singularité du champ.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Reprendre le champ stationnaire \(v_x = U\), \(v_y = Ux/L\) du §2 et chercher ses lignes de courant.</span>
    <div class="content">
      <p>\(\dfrac{\mathrm dx}{U} = \dfrac{\mathrm dy}{Ux/L}\) donne \(\mathrm dy = \dfrac{x\,\mathrm dx}{L}\), soit \(y = \dfrac{x^2}{2L} + C\) : ce sont exactement les trajectoires trouvées au §2, comme attendu pour un écoulement stationnaire.</p>
    </div>
  </div>

  <h3>Lire une carte de lignes de courant</h3>
  <ul>
    <li>La vitesse est tangente aux lignes ; son sens est indiqué par des flèches.</li>
    <li>Pour un écoulement plan incompressible tracé à débit constant entre deux lignes voisines, des lignes <strong>resserrées</strong> signalent une vitesse <strong>élevée</strong>.</li>
    <li>Un point où les lignes se séparent ou se rejoignent est un point d'arrêt (vitesse nulle).</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§4 · DÉBITS ET CONSERVATION DE LA MASSE</div>
  <h2>Vecteur densité de courant de masse, équation de continuité</h2>
  <div class="intro">La masse ne se crée ni ne se détruit : si la masse contenue dans un volume fixe varie, c'est que du fluide a traversé sa frontière. Le vecteur densité de courant de masse quantifie ce transport et conduit à une équation locale, analogue à celle de la conservation de la charge.</div>

  <div class="def-box">
    <strong>Vecteur densité de courant de masse</strong> : \(\vec j_m = \rho\,\vec v\), en \(\text{kg·m}^{-2}\text{·s}^{-1}\).<br>
    Pendant \(\mathrm dt\), le fluide qui traverse un élément de surface orienté \(\mathrm d\vec S\) remplit un cylindre oblique de base \(\mathrm dS\) et de génératrice \(\vec v\,\mathrm dt\) ; sa masse vaut \(\rho\,\vec v\cdot\mathrm d\vec S\,\mathrm dt = \vec j_m\cdot\mathrm d\vec S\,\mathrm dt\).
  </div>

  <div class="def-box">
    <strong>Débits à travers une surface orientée \(S\)</strong> :
    $$D_m = \iint_S \rho\,\vec v\cdot\mathrm d\vec S \ \ (\text{kg/s})$$
    $$D_v = \iint_S \vec v\cdot\mathrm d\vec S \ \ (\text{m}^3/\text{s})$$
    Le débit massique est le flux de \(\vec j_m\), le débit volumique celui de \(\vec v\). Si \(\rho\) est uniforme sur \(S\) : \(D_m = \rho\,D_v\).
  </div>
  <p><strong>Ordres de grandeur</strong> : robinet domestique \(\approx 0{,}1\) à \(0{,}2\ \text{L/s}\) ; débit cardiaque au repos \(\approx 5\ \text{L/min}\) ; Seine à Paris \(\approx 300\ \text{m}^3/\text{s}\) en moyenne ; Amazone \(\approx 2\times10^{5}\ \text{m}^3/\text{s}\).</p>

  <h3>Bilan de masse à une dimension</h3>
  <p>Conduite d'axe \(Ox\), de section \(S\) constante ; \(\rho(x,t)\) et \(\vec j_m = j_m(x,t)\,\vec e_x\) sont uniformes sur une section. On fait le bilan sur la tranche <strong>fixe</strong> comprise entre \(x\) et \(x + \mathrm dx\), de masse \(\rho(x,t)\,S\,\mathrm dx\). Entre \(t\) et \(t+\mathrm dt\), la masse entre en \(x\) et sort en \(x+\mathrm dx\) ; rien ne traverse la paroi :</p>
  <div class="formula">$$\frac{\partial \rho}{\partial t}\,S\,\mathrm dx\,\mathrm dt = \big[j_m(x) - j_m(x+\mathrm dx)\big]\,S\,\mathrm dt$$</div>
  <p>(les \(j_m\) étant pris à l'instant \(t\)) et, au premier ordre, \(j_m(x) - j_m(x+\mathrm dx) = -\dfrac{\partial j_m}{\partial x}\,\mathrm dx\). Après simplification par \(S\,\mathrm dx\,\mathrm dt\) :</p>
  <div class="formula">$$\frac{\partial \rho}{\partial t} + \frac{\partial (\rho v)}{\partial x} = 0$$</div>

  <h3>Généralisation : équation locale de conservation de la masse</h3>
  <p>Pour un volume fixe \(V\) limité par une surface fermée \(\Sigma\) (normale sortante), la variation de la masse intérieure est l'opposé du débit massique sortant ; avec le théorème d'Ostrogradski :</p>
  <div class="formula">$$\frac{\mathrm d}{\mathrm dt}\iiint_V \rho\,\mathrm d\tau = -\iint_{\Sigma} \vec j_m\cdot\mathrm d\vec S$$</div>
  <div class="formula">$$\iiint_V \frac{\partial \rho}{\partial t}\,\mathrm d\tau = -\iiint_V \operatorname{div}\vec j_m\,\mathrm d\tau$$</div>
  <div class="prop-box">
    Ceci étant vrai pour tout volume \(V\), on obtient l'<strong>équation de continuité</strong> :
    $$\frac{\partial \rho}{\partial t} + \operatorname{div}(\rho\,\vec v) = 0$$
    Avec \(\operatorname{div}(\rho\vec v) = \rho\operatorname{div}\vec v + \vec v\cdot\overrightarrow{\operatorname{grad}}\,\rho\), elle s'écrit aussi :
    $$\frac{\mathrm D\rho}{\mathrm Dt} + \rho\,\operatorname{div}\vec v = 0$$
  </div>
  <p><strong>Sens de \(\operatorname{div}\vec v\)</strong> : la masse \(\rho\,\delta\tau\) d'une particule étant constante, la seconde forme donne \(\operatorname{div}\vec v = \dfrac{1}{\delta\tau}\dfrac{\mathrm D(\delta\tau)}{\mathrm Dt}\) : c'est le <strong>taux relatif de variation du volume</strong> d'une particule (positif si elle se dilate, négatif si elle est comprimée).</p>

  <h3>Régime stationnaire</h3>
  <div class="prop-box">
    Si \(\partial\rho/\partial t = 0\), l'équation de continuité devient \(\operatorname{div}\vec j_m = 0\) : \(\vec j_m\) est à <strong>flux conservatif</strong>.
    <ul style="margin:.4rem 0">
      <li>le débit massique sortant de toute surface fermée est nul ;</li>
      <li>le débit massique est le même à travers toutes les sections d'un tube de courant ;</li>
      <li>en un nœud de canalisations : somme des débits massiques entrants = somme des débits massiques sortants (analogue de la loi des nœuds).</li>
    </ul>
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un gaz en détente est décrit par \(\rho = \rho_0\,e^{-t/\tau}\) et \(\vec v = (x/\tau)\,\vec e_x\). Ce modèle respecte-t-il la conservation de la masse ?</span>
    <div class="content">
      <p>\(\dfrac{\partial\rho}{\partial t} = -\dfrac{\rho}{\tau}\) et \(\dfrac{\partial(\rho v)}{\partial x} = \rho\,\dfrac{\partial v}{\partial x} = \dfrac{\rho}{\tau}\) : la somme est nulle, l'équation de continuité est vérifiée.</p>
      <p>\(\operatorname{div}\vec v = 1/\tau \gt 0\) : chaque particule voit son volume croître comme \(e^{t/\tau}\), sa masse volumique diminue d'autant.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · ÉCOULEMENTS INCOMPRESSIBLES</div>
  <h2>Conservation des volumes et vitesse débitante</h2>
  <div class="intro">Dans un très grand nombre de situations (liquides, gaz à faible vitesse), le volume des particules de fluide ne varie pratiquement pas. Cette propriété simplifie considérablement l'équation de continuité.</div>

  <div class="def-box">
    <strong>Écoulement incompressible</strong> : le volume de chaque particule de fluide se conserve au cours de son mouvement. De façon équivalente :
    $$\frac{\mathrm D\rho}{\mathrm Dt} = 0 \quad\Longleftrightarrow\quad \operatorname{div}\vec v = 0$$
    <strong>Fluide homogène</strong> : masse volumique uniforme. Un écoulement incompressible d'un fluide homogène a une masse volumique uniforme et constante : \(\rho = \text{cte}\).
  </div>

  <div class="prop-box">
    <strong>Conséquences de \(\operatorname{div}\vec v = 0\)</strong> : \(\vec v\) est à flux conservatif.
    <ul style="margin:.4rem 0">
      <li>le débit volumique sortant de toute surface fermée est nul ;</li>
      <li>le <strong>débit volumique</strong> est le même à travers toutes les sections d'un tube de courant (même si l'écoulement n'est pas stationnaire) ;</li>
      <li>pour un fluide homogène, \(D_m = \rho\,D_v\) est lui aussi conservé.</li>
    </ul>
  </div>

  <h3>Écoulement dans une conduite : vitesse débitante</h3>
  <div class="def-box">
    La <strong>vitesse débitante</strong> à travers une section droite d'aire \(S\) est la vitesse uniforme qui donnerait le même débit volumique :
    $$v_d = \frac{D_v}{S} = \frac{1}{S}\iint_S \vec v\cdot\mathrm d\vec S$$
    C'est la moyenne de la composante normale de la vitesse sur la section.
  </div>
  <div class="formula">$$D_v = S_1v_1 = S_2v_2 \quad\Longrightarrow\quad v_2 = v_1\,\frac{S_1}{S_2}$$</div>
  <p>(\(v_1\), \(v_2\) : vitesses débitantes dans les sections 1 et 2.) Un rétrécissement accélère le fluide, un élargissement le ralentit. Le profil réel des vitesses dans la section (nul à la paroi pour un fluide visqueux) n'intervient pas dans ce bilan.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Débit cardiaque \(5\ \text{L/min}\) ; aorte de diamètre \(2{,}5\ \text{cm}\) ; section totale des capillaires \(\approx 0{,}3\ \text{m}^2\). Vitesses débitantes ?</span>
    <div class="content">
      <p>\(D_v = 5\times10^{-3}/60 \approx 8{,}3\times10^{-5}\ \text{m}^3/\text{s}\). Aorte : \(S = \pi(1{,}25\times10^{-2})^2 \approx 4{,}9\times10^{-4}\ \text{m}^2\), d'où \(v_d \approx 0{,}17\ \text{m/s}\).</p>
      <p>Capillaires (en parallèle) : \(v_d \approx 8{,}3\times10^{-5}/0{,}3 \approx 3\times10^{-4}\ \text{m/s}\), soit \(0{,}3\ \text{mm/s}\). Chaque capillaire est minuscule, mais leur section <strong>totale</strong> est énorme : le sang y circule lentement, ce qui laisse le temps aux échanges.</p>
    </div>
  </div>

  <h3>Quand l'hypothèse d'incompressibilité est-elle valable ?</h3>
  <ul>
    <li><strong>Liquides</strong> : coefficient de compressibilité très faible (eau : \(\chi_T \approx 5\times10^{-10}\ \text{Pa}^{-1}\)). Une surpression de \(100\ \text{bar}\) ne change \(\rho\) que d'environ \(0{,}5\ \%\).</li>
    <li><strong>Gaz</strong> : l'écoulement peut être traité comme incompressible si la vitesse reste petite devant la célérité du son \(c\). Les variations relatives de \(\rho\) sont de l'ordre de \(\mathrm{Ma}^2/2\), avec \(\mathrm{Ma} = v/c\) le nombre de Mach : on admet couramment \(\mathrm{Ma} \lt 0{,}3\), soit \(v \lt 100\ \text{m/s}\) dans l'air, en l'absence de fort chauffage.</li>
  </ul>
  <div class="notice"><strong>Fluide compressible, écoulement incompressible</strong> : l'air est un fluide très compressible, mais l'écoulement autour d'une voiture à \(30\ \text{m/s}\) est très bien décrit comme incompressible. Inversement, l'air chauffé dans une conduite se dilate même à faible vitesse : l'écoulement n'est alors plus incompressible.</div>

  <div class="method-box">
    <strong>Exemple — lance d'arrosage</strong>
    <p>Un tuyau de diamètre intérieur \(D = 20\ \text{mm}\) débite \(Q_V = 20\ \text{L·min}^{-1}\) d'eau ; il se termine par une buse de diamètre \(d = 5\ \text{mm}\).</p>
    <ol>
      <li>\(Q_V = 3{,}3\times10^{-4}\ \text{m}^3\text{·s}^{-1}\) ; dans le tuyau, \(v = \dfrac{Q_V}{\pi D^2/4} \approx 1{,}1\ \text{m·s}^{-1}\).</li>
      <li>L'eau étant incompressible, le débit volumique se conserve : \(v_{\text{buse}} = v\,\dfrac{D^2}{d^2} = 16\,v \approx 17\ \text{m·s}^{-1}\).</li>
      <li>Débit massique : \(Q_m = \rho Q_V \approx 0{,}33\ \text{kg·s}^{-1}\), le même dans toutes les sections.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉGIMES D'ÉCOULEMENT ET NOMBRE DE REYNOLDS</div>
  <h2>Laminaire ou turbulent ?</h2>
  <div class="intro">Un même fluide, dans la même conduite, peut s'écouler de deux façons très différentes : en couches régulières qui glissent les unes sur les autres, ou de façon désordonnée, avec des tourbillons qui brassent le fluide. Un seul nombre sans dimension permet de prévoir le régime.</div>
  <div class="def-box">
    <strong>Nombre de Reynolds.</strong> Pour un fluide de masse volumique \(\rho\) et de viscosité dynamique \(\eta\) (viscosité cinématique \(\nu = \eta/\rho\)), s'écoulant à la vitesse caractéristique \(v\) dans un dispositif de taille caractéristique \(L\) (diamètre d'une conduite) :
    <div class="formula" data-nom="Nombre de Reynolds">$$\mathrm{Re}=\frac{\rho\,v\,L}{\eta}=\frac{v\,L}{\nu}$$</div>
    Il compare les effets d'inertie (qui amplifient les perturbations) aux effets de la viscosité (qui les amortissent).
  </div>
  <div class="prop-box">
    <strong>Régimes dans une conduite cylindrique</strong> (\(L = D\), \(v\) vitesse débitante) :
    <ul>
      <li>\(\mathrm{Re} \lesssim 2\,000\) : écoulement <strong>laminaire</strong>, lignes de courant parallèles à l'axe, stationnaire ;</li>
      <li>\(\mathrm{Re} \gtrsim 4\,000\) : écoulement <strong>turbulent</strong>, vitesse fluctuante, mélange intense ; on décrit alors l'écoulement par des grandeurs moyennes ;</li>
      <li>entre les deux : régime de transition, sensible aux perturbations d'entrée.</li>
    </ul>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Situation</th><th style="text-align:left">Ordres de grandeur</th><th style="text-align:left">Re</th><th style="text-align:left">Régime</th></tr>
    <tr><td>Eau dans un tuyau domestique</td><td>\(D = 16\ \text{mm}\), \(v = 1\ \text{m·s}^{-1}\), \(\nu = 10^{-6}\ \text{m}^2\text{·s}^{-1}\)</td><td>\(1{,}6\times10^4\)</td><td>turbulent</td></tr>
    <tr><td>Sang dans l'aorte</td><td>\(D = 2{,}5\ \text{cm}\), \(v = 0{,}2\ \text{m·s}^{-1}\), \(\nu \approx 3\times10^{-6}\)</td><td>\(\approx 1\,700\)</td><td>laminaire (en moyenne)</td></tr>
    <tr><td>Huile de lubrification dans un palier</td><td>\(e = 0{,}1\ \text{mm}\), \(v = 5\ \text{m·s}^{-1}\), \(\nu = 10^{-4}\)</td><td>5</td><td>laminaire</td></tr>
    <tr><td>Air autour d'une voiture</td><td>\(L = 4\ \text{m}\), \(v = 30\ \text{m·s}^{-1}\), \(\nu = 1{,}5\times10^{-5}\)</td><td>\(8\times10^6\)</td><td>turbulent</td></tr>
  </table></div>
  <p>Les écoulements industriels (eau, air, vapeur dans des conduites) sont presque toujours turbulents ; les écoulements laminaires concernent les fluides très visqueux, les petites dimensions (microfluidique, lubrification) ou les faibles vitesses. Le chapitre « Écoulements visqueux et bilans en conduite » exploite le régime pour évaluer les pertes de charge.</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · DÉRIVÉE PARTICULAIRE (HORS PROGRAMME)</div>
  <h2>Dériver une grandeur en suivant le mouvement</h2>
  <div class="intro">Le principe fondamental de la dynamique ou le premier principe s'appliquent à un système fermé, donc à une particule que l'on suit. Il faut savoir calculer, à partir des champs eulériens, la variation d'une grandeur « vue par la particule ».</div>

  <h3>Champ scalaire</h3>
  <p>Soit \(G(M,t)\) un champ eulérien. La particule occupant \(M\) à l'instant \(t\) se trouve en \(M'\) tel que \(\overrightarrow{MM'} = \vec v\,\mathrm dt\) à l'instant \(t + \mathrm dt\). Au premier ordre :</p>
  <div class="formula">$$\mathrm dG = G(M', t+\mathrm dt) - G(M,t)$$</div>
  <div class="formula">$$\mathrm dG = \frac{\partial G}{\partial t}\,\mathrm dt + \overrightarrow{\operatorname{grad}}\,G\cdot\vec v\,\mathrm dt$$</div>
  <div class="prop-box">
    <strong>Dérivée particulaire</strong> d'un champ scalaire :
    $$\frac{\mathrm DG}{\mathrm Dt} = \frac{\partial G}{\partial t} + (\vec v\cdot\overrightarrow{\operatorname{grad}})\,G$$
    avec, en cartésiennes, \((\vec v\cdot\overrightarrow{\operatorname{grad}}) = v_x\,\partial_x + v_y\,\partial_y + v_z\,\partial_z\). Le premier terme (<strong>local</strong>) traduit la non-stationnarité ; le second (<strong>convectif</strong>) traduit le déplacement de la particule vers une région où \(G\) a une autre valeur.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un vent uniforme \(U = 10\ \text{m/s}\) souffle vers \(+x\), d'une région froide vers une région chaude : \(\partial T/\partial x = 5\ \text{K}\) pour \(100\ \text{km}\). Chaque masse d'air garde sa température. Que mesure une station fixe ?</span>
    <div class="content">
      <p>« Chaque particule garde sa température » s'écrit \(\mathrm DT/\mathrm Dt = 0\), soit \(\dfrac{\partial T}{\partial t} = -U\,\dfrac{\partial T}{\partial x}\).</p>
      <p>\(\partial T/\partial t = -10\times 5\times10^{-5} = -5\times10^{-4}\ \text{K/s}\), soit environ \(-1{,}8\ \text{K}\) par heure : la station voit la température baisser, parce que le vent lui amène de l'air plus froid (advection), sans que l'air lui-même se refroidisse.</p>
    </div>
  </div>

  <h3>Accélération d'une particule de fluide</h3>
  <div class="prop-box">
    En appliquant le même raisonnement à chaque composante de \(\vec v\) :
    $$\vec a = \frac{\mathrm D\vec v}{\mathrm Dt} = \frac{\partial \vec v}{\partial t} + (\vec v\cdot\overrightarrow{\operatorname{grad}})\,\vec v$$
    <ul style="margin:.4rem 0">
      <li>\(\partial\vec v/\partial t\) : accélération <strong>locale</strong>, nulle en régime stationnaire ;</li>
      <li>\((\vec v\cdot\overrightarrow{\operatorname{grad}})\,\vec v\) : accélération <strong>convective</strong>, non linéaire en \(\vec v\), nulle pour un écoulement uniforme.</li>
    </ul>
  </div>
  <p>En cartésiennes, la composante selon \(x\) s'écrit :</p>
  <div class="formula">$$a_x = \frac{\partial v_x}{\partial t} + v_x\frac{\partial v_x}{\partial x} + v_y\frac{\partial v_x}{\partial y} + v_z\frac{\partial v_x}{\partial z}$$</div>
  <p>En coordonnées cylindriques, \((\vec v\cdot\overrightarrow{\operatorname{grad}})\,\vec v\) contient des termes supplémentaires (les vecteurs de base tournent) ; on utilise alors l'identité, valable dans tout système de coordonnées :</p>
  <div class="formula">$$(\vec v\cdot\overrightarrow{\operatorname{grad}})\,\vec v = \overrightarrow{\operatorname{grad}}\Big(\frac{v^2}{2}\Big) + \overrightarrow{\operatorname{rot}}\,\vec v\wedge\vec v$$</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Écoulement stationnaire unidimensionnel \(\vec v = kx\,\vec e_x\) avec \(k = 2\ \text{s}^{-1}\). Accélération d'une particule en \(x = 0{,}5\ \text{m}\) ?</span>
    <div class="content">
      <p>Terme local nul ; terme convectif : \(a = v\,\dfrac{\mathrm dv}{\mathrm dx} = kx\cdot k = k^2x = 2\ \text{m/s}^2\), alors que \(v = 1\ \text{m/s}\) en ce point. Le champ ne dépend pas du temps, mais la particule accélère en avançant.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · VECTEUR TOURBILLON (HORS PROGRAMME)</div>
  <h2>Rotation propre des particules de fluide</h2>
  <div class="intro">Une particule de fluide peut, en plus de se déplacer et de se déformer, tourner sur elle-même. Le vecteur tourbillon mesure cette rotation locale. C'est une propriété du voisinage du point, qui ne se lit pas sur la forme des lignes de courant : les deux exemples ci-dessous le montrent.</div>

  <div class="def-box">
    <strong>Vecteur tourbillon</strong> et <strong>vorticité</strong> :
    $$\vec\Omega = \frac12\,\overrightarrow{\operatorname{rot}}\,\vec v \ \ (\text{rad/s}), \qquad \vec\omega = \overrightarrow{\operatorname{rot}}\,\vec v = 2\,\vec\Omega$$
    L'écoulement est <strong>irrotationnel</strong> si \(\overrightarrow{\operatorname{rot}}\,\vec v = \vec 0\) en tout point du domaine étudié, <strong>rotationnel</strong> (ou tourbillonnaire) sinon.
  </div>

  <h3>Sens physique</h3>
  <p>Pour une rotation d'ensemble à vitesse angulaire \(\omega_0\) autour de \(Oz\) (rotation « solide ») : \(\vec v = \omega_0\,\vec e_z\wedge\overrightarrow{OM} = \omega_0(-y\,\vec e_x + x\,\vec e_y)\), d'où \(\overrightarrow{\operatorname{rot}}\,\vec v = 2\omega_0\,\vec e_z\) et \(\vec\Omega = \omega_0\,\vec e_z\).</p>
  <div class="prop-box">
    \(\vec\Omega(M,t)\) est le <strong>vecteur rotation instantanée propre</strong> de la particule de fluide située en \(M\) : une petite croix matérielle entraînée par l'écoulement tourne sur elle-même, en moyenne, à la vitesse angulaire \(\Omega\).<br>
    Théorème de Stokes : la <strong>circulation</strong> de la vitesse sur un contour fermé \(\mathcal C\) vaut
    $$\Gamma = \oint_{\mathcal C}\vec v\cdot\mathrm d\vec\ell = \iint_S \overrightarrow{\operatorname{rot}}\,\vec v\cdot\mathrm d\vec S = 2\iint_S \vec\Omega\cdot\mathrm d\vec S$$
  </div>
  <p>En coordonnées cylindriques, pour un écoulement plan \(\vec v = v_r(r,\theta)\,\vec e_r + v_\theta(r,\theta)\,\vec e_\theta\), seule la composante axiale du rotationnel subsiste (formule fournie par les énoncés) :</p>
  <div class="formula">$$\big(\overrightarrow{\operatorname{rot}}\,\vec v\big)_z = \frac1r\left[\frac{\partial (r\,v_\theta)}{\partial r} - \frac{\partial v_r}{\partial \theta}\right]$$</div>

  <h3>Deux exemples à connaître</h3>
  <p><strong>Cisaillement simple</strong> : \(\vec v = \dfrac{U}{h}\,y\,\vec e_x\) (écoulement entre une paroi fixe en \(y = 0\) et une paroi mobile en \(y = h\)). Les lignes de courant sont des droites parallèles, et pourtant \(\overrightarrow{\operatorname{rot}}\,\vec v = -\dfrac{U}{h}\,\vec e_z\), soit \(\vec\Omega = -\dfrac{U}{2h}\,\vec e_z\) : l'écoulement est <strong>rotationnel</strong>. Suivons une petite croix matérielle dont les bras sont parallèles aux axes : le bras horizontal reste horizontal (\(v_x\) ne varie pas le long de \(x\)), tandis que le bras vertical s'incline vers l'aval au taux \(U/h\), son bout supérieur étant plus rapide. La rotation <em>moyenne</em> des deux bras, \(U/(2h)\) dans le sens horaire, est exactement \(|\Omega_z|\).</p>
  <p><strong>Vortex (tourbillon ponctuel)</strong> : \(\vec v = \dfrac{\Gamma}{2\pi r}\,\vec e_\theta\). Les lignes de courant sont des cercles, et pourtant \(r\,v_\theta = \Gamma/(2\pi)\) est constant, donc \(\overrightarrow{\operatorname{rot}}\,\vec v = \vec 0\) pour \(r \neq 0\) : l'écoulement est <strong>irrotationnel</strong> hors de l'axe. Les particules tournent autour de l'axe sans tourner sur elles-mêmes, comme les nacelles d'une grande roue. La circulation sur tout cercle entourant l'axe vaut \(\Gamma\) : toute la vorticité est concentrée sur l'axe (singularité).</p>

  <h3>Un modèle réaliste : le tourbillon de Rankine</h3>
  <p>Un tourbillon réel (tornade, trombe marine) n'a pas de vitesse infinie sur son axe. On le modélise par un <strong>cœur</strong> de rayon \(a\) en rotation solide, entouré d'une zone de type vortex, avec continuité de la vitesse en \(r = a\) :</p>
  <div class="formula">$$v_\theta = \omega_0\,r \ \ \text{si } r \lt a$$</div>
  <div class="formula">$$v_\theta = \frac{\omega_0\,a^2}{r} \ \ \text{si } r \gt a$$</div>
  <p>Le vecteur tourbillon vaut \(\omega_0\,\vec e_z\) dans le cœur et \(\vec 0\) à l'extérieur ; la circulation autour du cœur vaut \(\Gamma = 2\pi a^2\omega_0\). La vitesse est maximale au bord du cœur : pour une tornade, \(v_{max} \sim 100\ \text{m/s}\) pour \(a \sim 100\ \text{m}\), soit \(\Omega \sim 1\ \text{rad/s}\) dans le cœur.</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · ÉCOULEMENTS POTENTIELS (HORS PROGRAMME)</div>
  <h2>Potentiel des vitesses et équation de Laplace</h2>
  <div class="intro">Lorsque l'écoulement est irrotationnel, le champ des vitesses se déduit d'une seule fonction scalaire. S'il est de plus incompressible, cette fonction obéit à l'équation de Laplace, que l'on connaît déjà en électrostatique.</div>

  <div class="def-box">
    Si \(\overrightarrow{\operatorname{rot}}\,\vec v = \vec 0\) dans un domaine sans « trou », il existe une fonction \(\varphi(M,t)\), le <strong>potentiel des vitesses</strong> (en \(\text{m}^2/\text{s}\)), telle que
    $$\vec v = \overrightarrow{\operatorname{grad}}\,\varphi$$
    On dit que l'écoulement est <strong>potentiel</strong>. Attention à la convention de signe : \(+\overrightarrow{\operatorname{grad}}\), contrairement à \(\vec E = -\overrightarrow{\operatorname{grad}}\,V\).
  </div>

  <div class="prop-box">
    <strong>Écoulement potentiel et incompressible</strong> : \(\operatorname{div}\vec v = \operatorname{div}(\overrightarrow{\operatorname{grad}}\,\varphi) = 0\), soit l'<strong>équation de Laplace</strong>
    $$\Delta\varphi = 0$$
    Elle est <strong>linéaire</strong> : une somme de potentiels solutions est encore solution, ce qui permet de construire des écoulements par superposition (écoulement uniforme + source, uniforme + vortex…). Avec des conditions aux limites convenables, la solution est unique.
  </div>

  <h3>Équipotentielles et lignes de courant</h3>
  <div class="prop-box">
    \(\vec v = \overrightarrow{\operatorname{grad}}\,\varphi\) est normal aux surfaces \(\varphi = \text{cte}\) et tangent aux lignes de courant : <strong>les lignes de courant sont orthogonales aux équipotentielles</strong>, et la vitesse est dirigée vers les \(\varphi\) croissants.
  </div>
  <p><strong>Condition sur une paroi fixe imperméable</strong> : le fluide ne la traverse pas, donc \(\vec v\cdot\vec n = 0\), soit \(\partial\varphi/\partial n = 0\). La paroi est une surface de courant. Le modèle potentiel autorise le glissement le long de la paroi ; un fluide réel y adhère, ce qui crée une fine couche de fluide rotationnel (couche limite).</p>

  <h3>Écoulements plans élémentaires</h3>
  <div style="overflow-x:auto;margin:.6rem 0"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">Écoulement</th><th style="padding:.35rem;border:1px solid var(--grid)">Potentiel \(\varphi\)</th><th style="padding:.35rem;border:1px solid var(--grid)">Vitesse</th><th style="padding:.35rem;border:1px solid var(--grid)">Lignes de courant</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Uniforme</td><td style="padding:.35rem;border:1px solid var(--grid)">\(U x\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(U\,\vec e_x\)</td><td style="padding:.35rem;border:1px solid var(--grid)">droites parallèles</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Source (\(q \gt 0\)) ou puits (\(q \lt 0\))</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\dfrac{q}{2\pi}\ln r\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\dfrac{q}{2\pi r}\,\vec e_r\)</td><td style="padding:.35rem;border:1px solid var(--grid)">demi-droites issues de l'axe</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Vortex</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\dfrac{\Gamma}{2\pi}\,\theta\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\dfrac{\Gamma}{2\pi r}\,\vec e_\theta\)</td><td style="padding:.35rem;border:1px solid var(--grid)">cercles centrés sur l'axe</td></tr>
  </table></div>
  <p>Ici \(q\) est le débit volumique émis par unité de hauteur (en \(\text{m}^2/\text{s}\)) : le flux de \(\vec v\) à travers un cylindre de rayon \(r\) et de hauteur \(H\) vaut \(\dfrac{q}{2\pi r}\times 2\pi r H = qH\), indépendant de \(r\), comme l'impose l'incompressibilité.</p>
  <div class="notice"><strong>Vortex</strong> : le potentiel \(\Gamma\theta/(2\pi)\) augmente de \(\Gamma\) à chaque tour. Il n'est défini qu'à un multiple de \(\Gamma\) près, parce que le domaine privé de l'axe a un « trou » : c'est cohérent avec une circulation non nulle autour de l'axe.</div>

  <figure class="schema" style="max-width:240px">
  <svg viewBox="0 0 220 200" role="img" aria-label="Source plane : lignes de courant radiales issues du centre, équipotentielles circulaires en pointillés, orthogonales aux lignes de courant">
    <circle cx="110" cy="100" r="30" class="sk-dash"/>

  <h3>Analogie avec l'électrostatique</h3>
  <p>Dans le vide et en régime statique, \(\vec E = -\overrightarrow{\operatorname{grad}}\,V\), \(\operatorname{div}\vec E = 0\) et \(\Delta V = 0\). Un écoulement potentiel incompressible obéit aux mêmes équations avec \(\vec v \leftrightarrow \vec E\) et \(\varphi \leftrightarrow -V\) : la source plane correspond au fil infini uniformément chargé, les lignes de courant aux lignes de champ, les équipotentielles aux équipotentielles. Les méthodes et les cartes de champ se transposent.</p>

<template class="pan-tpl" data-panneau="ecl-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CINÉMATIQUE DES FLUIDES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Obtenir une trajectoire à partir du champ des vitesses</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Écrire</span> le système \(\dot x = v_x(x,y,z,t)\), \(\dot y = v_y(\ldots)\), \(\dot z = v_z(\ldots)\) : on suit <strong>une</strong> particule, \(t\) est la variable.</li>
      <li><span class="step">Intégrer</span> en commençant par l'équation qui ne contient qu'une inconnue (souvent une composante ne dépend que de sa propre coordonnée ou du temps), puis reporter.</li>
      <li><span class="step">Constantes</span> : les fixer avec la position initiale \((x_0, y_0, z_0)\) à \(t_0\).</li>
      <li><span class="step">Éliminer \(t\)</span> entre \(x(t)\) et \(y(t)\) pour obtenir l'équation géométrique \(y = f(x)\) de la trajectoire.</li>
    </ol>
    <p style="margin:.3rem 0 0"><strong>Piège</strong> : dans un écoulement non stationnaire, \(t\) apparaît explicitement dans \(\vec v\) ; il faut l'intégrer comme variable, pas le traiter comme une constante.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Déterminer les lignes de courant</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Figer le temps</span> : \(t\) est un <strong>paramètre</strong> constant pendant toute l'intégration.</li>
      <li><span class="step">Écrire</span> \(\dfrac{\mathrm dx}{v_x} = \dfrac{\mathrm dy}{v_y}\) (cartésiennes) ou \(\dfrac{\mathrm dr}{v_r} = \dfrac{r\,\mathrm d\theta}{v_\theta}\) (polaires), puis séparer les variables.</li>
      <li><span class="step">Intégrer</span> : on obtient une famille de courbes \(F(x,y,t) = C\) ; la ligne passant par un point donné fixe \(C\).</li>
      <li><span class="step">Comparer</span> aux trajectoires : identiques si l'écoulement est stationnaire ; sinon, la ligne de courant passant par la position d'une particule est seulement <strong>tangente</strong> à sa trajectoire en ce point.</li>
    </ol>
    <p style="margin:.3rem 0 0"><strong>Cas particuliers</strong> : \(v_\theta = 0\) donne des lignes radiales (\(\theta = \text{cte}\)), \(v_r = 0\) des cercles (\(r = \text{cte}\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Calculer l'accélération d'une particule de fluide</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Euler</span> : \(\vec a = \partial\vec v/\partial t + (\vec v\cdot\overrightarrow{\operatorname{grad}})\,\vec v\), composante par composante en cartésiennes (\(a_x = \partial_t v_x + v_x\partial_x v_x + v_y\partial_y v_x + v_z\partial_z v_x\), etc.).</li>
      <li><span class="step">Cylindriques</span> : ne pas dériver « naïvement » les composantes ; utiliser \((\vec v\cdot\overrightarrow{\operatorname{grad}})\,\vec v = \overrightarrow{\operatorname{grad}}(v^2/2) + \overrightarrow{\operatorname{rot}}\,\vec v\wedge\vec v\). Pour \(\vec v = v_\theta(r)\,\vec e_\theta\) stationnaire, on trouve \(\vec a = -\dfrac{v_\theta^2}{r}\,\vec e_r\) (accélération centripète).</li>
      <li><span class="step">Contrôle lagrangien</span> : si les trajectoires \(x(t), y(t)\) sont connues, \(\vec a = (\ddot x, \ddot y)\) doit redonner le même résultat, exprimé au point où se trouve la particule.</li>
    </ol>
    <p style="margin:.3rem 0 0"><strong>Pièges</strong> : stationnaire n'implique pas \(\vec a = \vec 0\) (terme convectif) ; \(\partial\vec v/\partial t \neq \vec 0\) n'implique pas \(\vec a \neq \vec 0\) (les deux termes peuvent se compenser).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Établir une équation de conservation de la masse par un bilan</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Volume de contrôle</span> : choisir un volume <strong>fixe</strong> adapté à la géométrie (tranche \([x, x+\mathrm dx]\) de section \(S\), coquille cylindrique \([r, r+\mathrm dr]\) de hauteur \(H\), coquille sphérique…).</li>
      <li><span class="step">Masse intérieure</span> à \(t\) et \(t+\mathrm dt\) : variation \(\dfrac{\partial\rho}{\partial t}\,\mathrm d\tau\,\mathrm dt\).</li>
      <li><span class="step">Échanges</span> : masse entrante moins masse sortante pendant \(\mathrm dt\), avec \(\vec j_m = \rho\vec v\) et les <strong>aires</strong> des faces (elles dépendent de \(r\) en géométrie cylindrique ou sphérique).</li>
      <li><span class="step">Développer</span> au premier ordre et simplifier. En cylindrique radial : \(\dfrac{\partial\rho}{\partial t} + \dfrac1r\dfrac{\partial(r\rho v_r)}{\partial r} = 0\).</li>
    </ol>
    <p style="margin:.3rem 0 0"><strong>Piège</strong> : oublier que l'aire \(2\pi rH\) de la face d'entrée diffère de celle de la face de sortie \(2\pi(r+\mathrm dr)H\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Exploiter la conservation des débits</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Hypothèses</span> : écoulement stationnaire \(\Rightarrow\) débit <strong>massique</strong> conservé ; incompressible \(\Rightarrow\) débit <strong>volumique</strong> conservé (et \(D_m = \rho D_v\) si homogène).</li>
      <li><span class="step">Surface fermée</span> : délimiter la portion de conduite ou le nœud, et écrire « somme des débits entrants = somme des débits sortants ».</li>
      <li><span class="step">Vitesse débitante</span> : \(v_d = D_v/S\) dans chaque section ; \(S_1v_1 = S_2v_2\) pour une conduite de section variable.</li>
      <li><span class="step">Unités</span> : \(1\ \text{L/s} = 10^{-3}\ \text{m}^3/\text{s}\) ; \(1\ \text{m}^3/\text{h} \approx 2{,}8\times10^{-4}\ \text{m}^3/\text{s}\) ; section en \(\text{m}^2\) (\(1\ \text{cm}^2 = 10^{-4}\ \text{m}^2\)).</li>
    </ol>
    <p style="margin:.3rem 0 0"><strong>Piège</strong> : appliquer \(S_1v_1 = S_2v_2\) à un gaz qui se dilate (chauffage, forte détente) : seul \(\rho_1S_1v_1 = \rho_2S_2v_2\) reste vrai en régime stationnaire.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Caractériser un champ des vitesses donné</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Stationnaire ?</span> \(\vec v\) dépend-il explicitement de \(t\) ?</li>
      <li><span class="step">Incompressible ?</span> calculer \(\operatorname{div}\vec v\) (formulaire en cylindriques : \(\frac1r\partial_r(rv_r) + \frac1r\partial_\theta v_\theta + \partial_z v_z\)).</li>
      <li><span class="step">Irrotationnel ?</span> calculer \(\overrightarrow{\operatorname{rot}}\,\vec v\) ; pour un écoulement plan cartésien, seule \(\partial_x v_y - \partial_y v_x\) compte.</li>
      <li><span class="step">Conclure</span> : potentiel des vitesses si irrotationnel ; équation de Laplace si de plus incompressible ; points d'arrêt où \(\vec v = \vec 0\).</li>
    </ol>
    <p style="margin:.3rem 0 0"><strong>Piège</strong> : juger « à l'œil » la rotation d'après la courbure des lignes de courant (cisaillement rectiligne rotationnel, vortex circulaire irrotationnel) : seul le calcul tranche.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Déterminer un potentiel des vitesses</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Vérifier</span> que \(\overrightarrow{\operatorname{rot}}\,\vec v = \vec 0\) (sinon, pas de potentiel).</li>
      <li><span class="step">Intégrer</span> \(\partial\varphi/\partial x = v_x\) à \(y\) fixé : \(\varphi = F(x,y) + f(y)\), où la « constante » est une fonction de \(y\).</li>
      <li><span class="step">Identifier</span> \(f'(y)\) avec \(\partial\varphi/\partial y = v_y\), puis intégrer ; fixer la constante additive (souvent \(\varphi = 0\) en un point choisi).</li>
      <li><span class="step">En polaires</span> : \(v_r = \partial\varphi/\partial r\) et \(v_\theta = \dfrac1r\,\partial\varphi/\partial\theta\).</li>
      <li><span class="step">Contrôler</span> en redérivant ; équipotentielles \(\varphi = \text{cte}\), orthogonales aux lignes de courant.</li>
    </ol>
    <p style="margin:.3rem 0 0"><strong>Piège</strong> : signe de la convention (\(\vec v = +\overrightarrow{\operatorname{grad}}\,\varphi\)) ; potentiel multivalué autour d'un vortex.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Exploiter une carte de champ des vitesses</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Symétries</span> : repérer axes et plans de symétrie, points d'arrêt (lignes qui se séparent), zones de recirculation.</li>
      <li><span class="step">Vitesse</span> : en écoulement plan incompressible, débit constant entre deux lignes voisines, donc vitesse inversement proportionnelle à leur écartement.</li>
      <li><span class="step">Rotation</span> : imaginer une petite croix entraînée par le fluide et regarder comment chacun de ses bras s'incline ; si leur rotation moyenne est non nulle, \(\vec\Omega \neq \vec 0\). Des bras qui tournent d'angles égaux en sens opposés traduisent une simple déformation (\(\vec\Omega = \vec 0\)).</li>
      <li><span class="step">Divergence</span> : sur un contour fermé, comparer ce qui entre et ce qui sort ; un bilan non nul signale une source, un puits ou une compressibilité.</li>
    </ol>
  </div>
</div>

<template class="pan-tpl" data-panneau="ecl-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Traceur dans un courant dévié : trajectoire ou ligne de courant ?</h3>
  <div class="statement">Dans la veine d'essai d'une soufflerie, des buses latérales, mises en route à \(t = 0\), dévient le courant principal \(U\,\vec e_x\) ; leur effet croît avec le temps et avec l'abscisse. Dans la zone étudiée (\(x \geq 0\), \(t \geq 0\)), on modélise le champ des vitesses par
  $$\vec v = U\,\vec e_x + \frac{x\,t}{\tau^2}\,\vec e_y$$
  avec \(U = 2{,}0\ \text{m/s}\) et \(\tau = 2{,}0\ \text{s}\). Une goutte de traceur est lâchée à l'origine \(O\) à l'instant \(t = 0\).</div>
  <div class="q"><strong>Q1.</strong> L'écoulement est-il stationnaire ? incompressible ? Exprimer l'accélération d'une particule de fluide située en \((x, y)\) à l'instant \(t\), en distinguant terme local et terme convectif.</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(x(t)\) et \(y(t)\) pour le traceur, puis l'équation \(y = f(x)\) de sa trajectoire. Vérifier le résultat de Q1 sur ce mouvement.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les lignes de courant à un instant \(t_1\) fixé, puis celle qui passe par \(O\).</div>
  <div class="q"><strong>Q4.</strong> À \(t_1 = 2{,}0\ \text{s}\), où se trouve le traceur ? Comparer la pente de sa trajectoire en ce point et celle de la ligne de courant qui y passe. Où était le traceur à \(t = 1{,}0\ \text{s}\) ? Ce point est-il sur la ligne de courant passant par \(O\) à l'instant \(t_1\) ? Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\partial\vec v/\partial t = (x/\tau^2)\,\vec e_y \neq \vec 0\) : l'écoulement n'est <strong>pas stationnaire</strong>. \(\operatorname{div}\vec v = \partial_x U + \partial_y(xt/\tau^2) = 0\) : il est <strong>incompressible</strong>. Seule \(v_y\) varie, et seulement avec \(x\) et \(t\) :</p>
    <div class="formula">$$\vec a = \underbrace{\frac{x}{\tau^2}\,\vec e_y}_{\text{local}} + \underbrace{v_x\,\frac{\partial v_y}{\partial x}\,\vec e_y}_{\text{convectif}} = \frac{x + Ut}{\tau^2}\,\vec e_y$$</div>
    <p><strong>Q2.</strong> \(\dot x = U\) donne \(x = Ut\) ; puis \(\dot y = xt/\tau^2 = Ut^2/\tau^2\), d'où \(y = \dfrac{Ut^3}{3\tau^2}\) (avec \(x(0) = y(0) = 0\)). En éliminant \(t = x/U\) :</p>
    <div class="formula">$$y = \frac{x^3}{3U^2\tau^2} = \frac{x^3}{48} \ \ (\text{SI})$$</div>
    <p>La trajectoire est une <strong>cubique</strong> tangente à l'axe \(Ox\) en \(O\). Vérification : \(\ddot y = 2Ut/\tau^2\), et la formule de Q1 prise au point où se trouve le traceur (\(x = Ut\)) donne bien \((Ut + Ut)/\tau^2\). ✓</p>
    <p><strong>Q3.</strong> À \(t_1\) fixé : \(\dfrac{\mathrm dx}{U} = \dfrac{\mathrm dy}{x t_1/\tau^2}\), soit \(\mathrm dy = \dfrac{t_1}{U\tau^2}\,x\,\mathrm dx\) et \(y = \dfrac{t_1}{2U\tau^2}\,x^2 + C\). Les lignes de courant sont des <strong>paraboles</strong> identiques, décalées verticalement ; celle qui passe par \(O\) est \(y = \dfrac{t_1}{2U\tau^2}\,x^2\).</p>
    <p><strong>Q4.</strong> À \(t_1 = 2{,}0\ \text{s}\) : \(x = 4{,}0\ \text{m}\) et \(y = 4^3/48 \approx 1{,}33\ \text{m}\). Pente de la trajectoire : \(\mathrm dy/\mathrm dx = x^2/(U^2\tau^2) = 16/16 = 1{,}0\). Pente de la ligne de courant : \(t_1x/(U\tau^2) = 8/8 = 1{,}0\). Elles sont égales : la vitesse du traceur est tangente à la fois à sa trajectoire et à la ligne de courant qui passe par lui (\(y = x^2/8 - 2/3\)).</p>
    <p>À \(t = 1{,}0\ \text{s}\), le traceur était en \((2{,}0\ \text{m} ;\ 0{,}17\ \text{m})\), alors que la ligne de courant issue de \(O\) à l'instant \(t_1\) (\(y = x^2/8\)) passe en \((2{,}0\ \text{m} ;\ 0{,}50\ \text{m})\). Trajectoire (cubique) et lignes de courant (paraboles) sont des courbes <strong>différentes</strong>, seulement tangentes au point occupé par la particule à l'instant considéré : le champ se modifie pendant que la particule avance.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Accélération dans un convergent</h3>
  <div class="statement">De l'eau (écoulement incompressible et stationnaire) traverse un convergent d'axe \(Ox\), de longueur \(L = 20\ \text{cm}\), dont la section varie selon \(S(x) = \dfrac{S_0}{1 + x/L}\) pour \(0 \leq x \leq L\), avec \(S_0 = 20\ \text{cm}^2\). Le débit volumique vaut \(D_v = 1{,}0\ \text{L/s}\). On adopte un modèle unidimensionnel : la vitesse est uniforme sur chaque section, \(\vec v = v(x)\,\vec e_x\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(v(x)\). Calculer la vitesse à l'entrée et à la sortie.</div>
  <div class="q"><strong>Q2.</strong> L'écoulement est stationnaire : pourquoi les particules sont-elles néanmoins accélérées ? Exprimer leur accélération \(a(x)\) et la calculer à l'entrée et à la sortie.</div>
  <div class="q"><strong>Q3.</strong> Une particule entre dans le convergent à \(t = 0\). Déterminer sa position \(x(t)\) et la durée \(T\) de la traversée.</div>
  <div class="q"><strong>Q4.</strong> Retrouver \(a(x)\) à partir de \(x(t)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Conservation du débit volumique : \(v(x) = \dfrac{D_v}{S(x)} = v_0\left(1 + \dfrac{x}{L}\right)\) avec \(v_0 = D_v/S_0\), soit \(v_0 = 0{,}50\ \text{m/s}\). À la sortie (\(S = S_0/2\)) : \(v(L) = 2v_0 = 1{,}0\ \text{m/s}\).</p>
    <p><strong>Q2.</strong> Le terme local est nul, mais une particule passe d'une zone lente à une zone rapide : c'est l'accélération <strong>convective</strong>.</p>
    <div class="formula">$$a(x) = v\,\frac{\mathrm dv}{\mathrm dx} = v_0\left(1 + \frac{x}{L}\right)\frac{v_0}{L}$$</div>
    <div class="formula">$$a(x) = \frac{v_0^2}{L}\left(1 + \frac{x}{L}\right)$$</div>
    <p>\(v_0^2/L = 0{,}25/0{,}20 = 1{,}25\ \text{m/s}^2\) à l'entrée, et \(2{,}5\ \text{m/s}^2\) à la sortie.</p>
    <p><strong>Q3.</strong> Description lagrangienne : \(\dot x = v_0(1 + x/L)\), soit \(\dfrac{\mathrm dx}{1 + x/L} = v_0\,\mathrm dt\), d'où \(L\ln(1 + x/L) = v_0t\) et</p>
    <div class="formula">$$x(t) = L\left(e^{v_0t/L} - 1\right)$$</div>
    <p>La sortie \(x = L\) est atteinte lorsque \(e^{v_0T/L} = 2\) :</p>
    <div class="formula">$$T = \frac{L}{v_0}\ln 2 = \frac{0{,}20}{0{,}50}\times0{,}693 \approx 0{,}28\ \text{s}$$</div>
    <p><strong>Q4.</strong> \(\ddot x = L\,\dfrac{v_0^2}{L^2}\,e^{v_0t/L} = \dfrac{v_0^2}{L}\left(1 + \dfrac{x}{L}\right)\) : on retrouve bien \(a(x)\), évaluée à la position de la particule. Les deux descriptions sont cohérentes.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Débit massique ou débit volumique ?</h3>
  <div class="statement"><strong>A. Seringue.</strong> Une seringue de diamètre intérieur \(D = 15\ \text{mm}\) contient de l'eau (\(\rho = 1{,}0\times10^3\ \text{kg/m}^3\)). On pousse le piston à vitesse constante \(u = 5{,}0\ \text{mm/s}\) ; l'eau sort par une aiguille de diamètre intérieur \(d = 0{,}40\ \text{mm}\).<br>
  <strong>B. Réchauffeur d'air.</strong> De l'air (gaz parfait, \(M = 29\ \text{g/mol}\)) circule en régime stationnaire dans un tube de diamètre \(10\ \text{cm}\), à pression pratiquement constante \(P = 1{,}0\ \text{bar}\). Il entre à \(T_1 = 290\ \text{K}\) avec la vitesse débitante \(v_1 = 4{,}0\ \text{m/s}\) et ressort à \(T_2 = 580\ \text{K}\) après une résistance chauffante. On donne \(R = 8{,}31\ \text{J·mol}^{-1}\text{·K}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> (A) Calculer le débit volumique, la vitesse débitante dans l'aiguille et le débit massique.</div>
  <div class="q"><strong>Q2.</strong> (B) Quelle grandeur se conserve le long du tube ? Calculer le débit massique et la vitesse débitante \(v_2\) en sortie.</div>
  <div class="q"><strong>Q3.</strong> (B) Comparer les débits volumiques en entrée et en sortie. L'écoulement est-il incompressible ? Le nombre de Mach est pourtant très faible : commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Section de la seringue : \(S = \pi D^2/4 \approx 1{,}77\times10^{-4}\ \text{m}^2\). Débit volumique : \(D_v = Su \approx 8{,}8\times10^{-7}\ \text{m}^3/\text{s}\), soit \(0{,}88\ \text{mL/s}\).</p>
    <p>L'eau étant incompressible, \(D_v\) est le même dans l'aiguille : \(v_d = u\,(D/d)^2\) avec \(D/d = 37{,}5\), soit \(v_d \approx 7{,}0\ \text{m/s}\). Débit massique : \(D_m = \rho D_v \approx 0{,}88\ \text{g/s}\).</p>
    <p><strong>Q2.</strong> Régime stationnaire : le <strong>débit massique</strong> se conserve. Section : \(S = \pi(0{,}05)^2 \approx 7{,}85\times10^{-3}\ \text{m}^2\) ; masse volumique d'entrée :</p>
    <div class="formula">$$\rho_1 = \frac{PM}{RT_1} = \frac{10^5\times0{,}029}{8{,}31\times290} \approx 1{,}20\ \text{kg/m}^3$$</div>
    <div class="formula">$$D_m = \rho_1 v_1 S \approx 3{,}8\times10^{-2}\ \text{kg/s}$$</div>
    <p>À pression constante, \(\rho_2 = \rho_1 T_1/T_2 = \rho_1/2\). Section constante : \(\rho_1v_1 = \rho_2v_2\), d'où \(v_2 = v_1\,T_2/T_1 = 8{,}0\ \text{m/s}\).</p>
    <p><strong>Q3.</strong> \(D_{v1} = v_1S \approx 31\ \text{L/s}\) et \(D_{v2} = v_2S \approx 63\ \text{L/s}\) : le débit volumique <strong>double</strong>. Les particules se dilatent en traversant la zone chauffée : \(\operatorname{div}\vec v \gt 0\), l'écoulement n'est <strong>pas incompressible</strong>, bien que \(\mathrm{Ma} \approx 8/340 \approx 0{,}02\). Le critère \(\mathrm{Ma} \ll 1\) ne garantit l'incompressibilité qu'en l'absence de fortes variations de température.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Gaz comprimé par un piston : Euler contre Lagrange</h3>
  <div class="statement">Un gaz est enfermé dans un cylindre d'axe \(Ox\), de section \(S\), entre un fond fixe en \(x = 0\) et un piston dont la position est \(L(t) = L_0 - Vt\) (\(V \gt 0\) constante, \(0 \leq t \lt L_0/V\)). On modélise l'écoulement par une masse volumique uniforme \(\rho(t)\), avec \(\rho(0) = \rho_0\), et par le champ des vitesses
  $$\vec v(x,t) = -\frac{V\,x}{L(t)}\,\vec e_x$$
  Données : \(L_0 = 20\ \text{cm}\), \(V = 0{,}10\ \text{m/s}\), \(\rho_0 = 1{,}2\ \text{kg/m}^3\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que ce champ respecte les conditions aux limites sur le fond et sur le piston.</div>
  <div class="q"><strong>Q2.</strong> À l'aide de l'équation de continuité, déterminer \(\rho(t)\). Retrouver ce résultat par un bilan global. Calculer \(\rho\) à \(t = 1{,}0\ \text{s}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\operatorname{div}\vec v\). L'écoulement est-il incompressible ? Vérifier la relation \(\mathrm D\rho/\mathrm Dt = -\rho\operatorname{div}\vec v\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer la trajectoire \(x(t)\) d'une particule située en \(x_0\) à \(t = 0\). Quelle est son accélération ?</div>
  <div class="q"><strong>Q5.</strong> Calculer \(\partial v/\partial t\) et l'accélération eulérienne \(a = \partial v/\partial t + v\,\partial v/\partial x\). Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En \(x = 0\) : \(v = 0\), le gaz ne traverse pas le fond fixe. En \(x = L(t)\) : \(v = -V = \dot L\), le gaz au contact du piston se déplace avec lui.</p>
    <p><strong>Q2.</strong> \(\rho\) étant uniforme : \(\dfrac{\mathrm d\rho}{\mathrm dt} + \rho\,\dfrac{\partial v}{\partial x} = 0\), avec \(\dfrac{\partial v}{\partial x} = -\dfrac{V}{L(t)}\). Donc \(\dfrac{\mathrm d\rho}{\rho} = \dfrac{V\,\mathrm dt}{L_0 - Vt}\), soit \(\ln\dfrac{\rho}{\rho_0} = -\ln\dfrac{L_0 - Vt}{L_0}\) :</p>
    <div class="formula">$$\rho(t) = \rho_0\,\frac{L_0}{L(t)}$$</div>
    <p>Bilan global : la masse \(m = \rho S L\) du gaz enfermé est constante, d'où \(\rho L = \rho_0 L_0\). À \(t = 1{,}0\ \text{s}\), \(L = 10\ \text{cm}\) et \(\rho = 2\rho_0 = 2{,}4\ \text{kg/m}^3\).</p>
    <p><strong>Q3.</strong> \(\operatorname{div}\vec v = -V/L(t) \lt 0\) : les particules sont comprimées, l'écoulement est <strong>compressible</strong>. \(\rho\) étant uniforme, \(\mathrm D\rho/\mathrm Dt = \mathrm d\rho/\mathrm dt = \rho_0L_0V/L^2\), soit \(\rho V/L\), qui est bien égal à \(-\rho\operatorname{div}\vec v\). ✓</p>
    <p><strong>Q4.</strong> \(\dot x = -\dfrac{Vx}{L_0 - Vt}\) donne \(\dfrac{\mathrm dx}{x} = \dfrac{-V\,\mathrm dt}{L_0 - Vt}\), soit \(\ln\dfrac{x}{x_0} = \ln\dfrac{L_0 - Vt}{L_0}\) :</p>
    <div class="formula">$$x(t) = x_0\,\frac{L(t)}{L_0} = x_0 - \frac{V x_0}{L_0}\,t$$</div>
    <p>Chaque particule se déplace à vitesse <strong>constante</strong> \(-Vx_0/L_0\) (proportionnelle à sa position initiale) : son accélération est <strong>nulle</strong>.</p>
    <p><strong>Q5.</strong> \(\dfrac{\partial v}{\partial t} = \dfrac{Vx\,\dot L}{L^2} = -\dfrac{V^2x}{L^2} \neq 0\) et \(v\,\dfrac{\partial v}{\partial x} = \left(-\dfrac{Vx}{L}\right)\left(-\dfrac{V}{L}\right) = \dfrac{V^2x}{L^2}\). La somme est nulle, en accord avec Q4. En un point fixe, la vitesse augmente en valeur absolue parce que des particules de plus en plus rapides (venues de plus loin) s'y succèdent ; aucune particule n'accélère pour autant.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Deux champs presque jumeaux</h3>
  <div class="statement">On considère deux écoulements plans stationnaires, avec \(k\) une constante positive :
  $$\vec v_1 = k\,(y\,\vec e_x + x\,\vec e_y), \qquad \vec v_2 = k\,(y\,\vec e_x - x\,\vec e_y)$$</div>
  <div class="q"><strong>Q1.</strong> Ces écoulements sont-ils incompressibles ?</div>
  <div class="q"><strong>Q2.</strong> Calculer leurs vecteurs tourbillons. Lequel est irrotationnel ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer les lignes de courant de chacun et préciser le sens de parcours pour \(\vec v_2\). Interpréter le signe de \(\vec\Omega_2\).</div>
  <div class="q"><strong>Q4.</strong> Pour l'écoulement irrotationnel, déterminer le potentiel des vitesses, vérifier l'équation de Laplace et décrire les équipotentielles. Où se trouve le point d'arrêt ?</div>
  <div class="q"><strong>Q5.</strong> Calculer l'accélération des particules dans les deux écoulements et interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\operatorname{div}\vec v_1 = \partial_x(ky) + \partial_y(kx) = 0\) et \(\operatorname{div}\vec v_2 = \partial_x(ky) + \partial_y(-kx) = 0\) : les deux sont incompressibles.</p>
    <p><strong>Q2.</strong> \(\vec\Omega = \dfrac12(\partial_x v_y - \partial_y v_x)\,\vec e_z\). Pour \(\vec v_1\) : \(\frac12(k - k) = 0\), écoulement <strong>irrotationnel</strong>. Pour \(\vec v_2\) : \(\vec\Omega_2 = \frac12(-k - k)\,\vec e_z = -k\,\vec e_z\), écoulement rotationnel.</p>
    <p><strong>Q3.</strong> Pour \(\vec v_1\) : \(\dfrac{\mathrm dx}{ky} = \dfrac{\mathrm dy}{kx}\), soit \(x\,\mathrm dx = y\,\mathrm dy\) et \(x^2 - y^2 = C\) : <strong>hyperboles</strong> d'asymptotes \(y = \pm x\) (écoulement dans un coin droit dont les parois seraient ces asymptotes). Pour \(\vec v_2\) : \(\dfrac{\mathrm dx}{ky} = \dfrac{\mathrm dy}{-kx}\), soit \(x^2 + y^2 = C\) : <strong>cercles</strong> centrés en \(O\). En \((0, r)\), \(\vec v_2 = kr\,\vec e_x\) : rotation dans le <strong>sens horaire</strong>, cohérente avec \(\Omega_z = -k \lt 0\). Il s'agit d'une rotation solide à la vitesse angulaire \(k\).</p>
    <p><strong>Q4.</strong> \(\partial\varphi/\partial x = ky\) donne \(\varphi = kxy + f(y)\), puis \(\partial\varphi/\partial y = kx + f'(y) = kx\) impose \(f = \text{cte}\) : \(\varphi = kxy\) (nul en \(O\)). \(\Delta\varphi = 0 + 0 = 0\). ✓ Les équipotentielles \(xy = \text{cte}\) sont des hyperboles d'asymptotes les axes ; elles coupent à angle droit les hyperboles \(x^2 - y^2 = C\) (les gradients \((y, x)\) et \((x, -y)\) sont orthogonaux). Le point d'arrêt est \(O\). \(\vec v_2\) n'admet pas de potentiel puisque son rotationnel n'est pas nul.</p>
    <p><strong>Q5.</strong> Écoulements stationnaires : \(\vec a = (\vec v\cdot\overrightarrow{\operatorname{grad}})\,\vec v\).</p>
    <p>Pour \(\vec v_1\) : \(a_x = v_x\partial_x v_x + v_y\partial_y v_x\), soit \(a_x = kx\cdot k = k^2x\) ; de même \(a_y = ky\cdot k = k^2y\), soit \(\vec a_1 = k^2\,\overrightarrow{OM}\). C'est bien \(\overrightarrow{\operatorname{grad}}(v_1^2/2)\), avec \(v_1^2 = k^2(x^2 + y^2)\), comme le prévoit l'identité du cours pour un écoulement irrotationnel.</p>
    <p>Pour \(\vec v_2\) : de même \(\vec a_2 = -k^2\,\overrightarrow{OM}\) : accélération centripète \(v^2/r = k^2r\) d'un mouvement circulaire uniforme. Deux champs d'aspect voisin ont des propriétés opposées : c'est le calcul du rotationnel qui les distingue.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Écoulement autour d'une pile de pont à avant-bec arrondi</h3>
  <div class="statement">Pour modéliser l'écoulement d'une rivière (vitesse \(U\) loin de l'obstacle) autour de l'avant d'une pile de pont, on superpose, dans un plan horizontal, un écoulement uniforme \(U\,\vec e_x\) et une source placée en \(O\), de débit volumique \(q\) par unité de hauteur. On travaille en coordonnées polaires \((r, \theta)\), \(\theta\) étant mesuré depuis \(\vec e_x\) ; le potentiel des vitesses s'écrit
  $$\varphi(r,\theta) = U\,r\cos\theta + \frac{q}{2\pi}\ln\frac{r}{r_0}$$
  où \(r_0\) est une longueur arbitraire. On rappelle, pour un champ plan :
  $$\overrightarrow{\operatorname{grad}}\,f = \frac{\partial f}{\partial r}\,\vec e_r + \frac1r\frac{\partial f}{\partial\theta}\,\vec e_\theta$$
  $$\Delta f = \frac1r\frac{\partial}{\partial r}\Big(r\frac{\partial f}{\partial r}\Big) + \frac{1}{r^2}\frac{\partial^2 f}{\partial\theta^2}$$</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(\varphi\) satisfait l'équation de Laplace. Quelles propriétés de l'écoulement cela traduit-il ?</div>
  <div class="q"><strong>Q2.</strong> Exprimer les composantes \(v_r\) et \(v_\theta\) de la vitesse.</div>
  <div class="q"><strong>Q3.</strong> Montrer qu'il existe un unique point d'arrêt \(A\) ; préciser sa position \(r_A\).</div>
  <div class="q"><strong>Q4.</strong> Calculer le débit volumique (par unité de hauteur) sortant d'un cercle de centre \(O\) et de rayon \(r\). Commenter.</div>
  <div class="q"><strong>Q5.</strong> On admet que la ligne de courant passant par \(A\) a pour équation \(r = \dfrac{q\,(\pi - \theta)}{2\pi U\sin\theta}\) pour \(0 \lt \theta \lt \pi\). Elle sépare le fluide émis par la source du fluide de la rivière : on peut la remplacer par la paroi de la pile. Déterminer la largeur \(e\) de la pile loin en aval. Retrouver ce résultat par un argument de débit.</div>
  <div class="q"><strong>Q6.</strong> Application : \(U = 1{,}5\ \text{m/s}\) et \(e = 1{,}2\ \text{m}\). Calculer \(q\) et \(r_A\), puis la norme de la vitesse sur la paroi au point d'angle \(\theta = \pi/2\). Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(Ur\cos\theta\) : \(\dfrac1r\dfrac{\partial}{\partial r}(rU\cos\theta) = \dfrac{U\cos\theta}{r}\) et \(\dfrac{1}{r^2}\dfrac{\partial^2}{\partial\theta^2}(Ur\cos\theta) = -\dfrac{U\cos\theta}{r}\) : somme nulle. Pour \(\ln r\) : \(r\,\partial_r(\ln r) = 1\), de dérivée nulle. Par linéarité, \(\Delta\varphi = 0\) (pour \(r \neq 0\)). L'écoulement est <strong>irrotationnel</strong> (il dérive d'un potentiel) et <strong>incompressible</strong> (\(\operatorname{div}\vec v = \Delta\varphi = 0\)) hors de la source.</p>
    <p><strong>Q2.</strong></p>
    <div class="formula">$$v_r = \frac{\partial\varphi}{\partial r} = U\cos\theta + \frac{q}{2\pi r}$$</div>
    <div class="formula">$$v_\theta = \frac1r\frac{\partial\varphi}{\partial\theta} = -U\sin\theta$$</div>
    <p><strong>Q3.</strong> \(v_\theta = 0\) impose \(\theta = 0\) ou \(\theta = \pi\). Pour \(\theta = 0\), \(v_r = U + q/(2\pi r) \gt 0\) ne s'annule pas. Pour \(\theta = \pi\), \(v_r = -U + q/(2\pi r) = 0\) pour</p>
    <div class="formula">$$r_A = \frac{q}{2\pi U}$$</div>
    <p>Le point d'arrêt est en amont de la source, là où la vitesse de la rivière compense exactement celle du fluide émis.</p>
    <p><strong>Q4.</strong> Le débit sortant du cercle vaut \(\int_0^{2\pi} v_r\,r\,\mathrm d\theta\), soit</p>
    <div class="formula">$$\int_0^{2\pi}\Big(Ur\cos\theta + \frac{q}{2\pi}\Big)\mathrm d\theta = q$$</div>
    <p>quel que soit \(r\) : l'écoulement uniforme apporte un débit net nul, seule la source contribue. C'est l'incompressibilité : le flux de \(\vec v\) ne dépend pas du cercle choisi.</p>
    <p><strong>Q5.</strong> Sur la paroi, \(y = r\sin\theta = \dfrac{q(\pi - \theta)}{2\pi U}\). Loin en aval (\(\theta \to 0\)), \(y \to q/(2U)\) ; par symétrie, la largeur totale est</p>
    <div class="formula">$$e = \frac{q}{U} = 2\pi\,r_A$$</div>
    <p>Argument de débit : le fluide émis par la source reste à l'intérieur de la paroi (ligne de courant), et loin en aval il s'écoule à la vitesse \(U\) sur la largeur \(e\) : \(Ue = q\).</p>
    <p><strong>Q6.</strong> \(q = Ue = 1{,}8\ \text{m}^2/\text{s}\) ; \(r_A = e/(2\pi) \approx 0{,}19\ \text{m}\). Pour \(\theta = \pi/2\) : \(r = \dfrac{q\,\pi/2}{2\pi U} = \dfrac{q}{4U} = 0{,}30\ \text{m}\), puis \(v_r = \dfrac{q}{2\pi r} = \dfrac{2U}{\pi} \approx 0{,}95\ \text{m/s}\) et \(v_\theta = -U = -1{,}5\ \text{m/s}\).</p>
    <div class="formula">$$v = U\sqrt{1 + \frac{4}{\pi^2}} \approx 1{,}19\,U \approx 1{,}8\ \text{m/s}$$</div>
    <p>Le fluide accélère de près de \(20\ \%\) en contournant l'obstacle : les lignes de courant s'y resserrent. Près d'une vraie pile, cette survitesse favorise l'affouillement du lit (érosion au pied de l'ouvrage).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Écrasement d'un film de fluide entre deux plaques</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>cinématique des fluides : conservation de la masse, potentiel des vitesses, descriptions d'Euler et de Lagrange</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Lors du collage de deux pièces, une presse rapproche deux plaques planes horizontales entre lesquelles se trouve une couche de colle liquide. La plaque inférieure est fixe (plan \(y = 0\)) ; la plaque supérieure, parallèle, est à la hauteur \(h(t)\) et descend à la vitesse constante \(V\) : \(\dot h = -V\). Les plaques ont une longueur \(2\ell\) selon \(Ox\) (de \(x = -\ell\) à \(x = \ell\)) et une très grande largeur \(b\) selon \(Oz\) : l'écoulement est plan, invariant selon \(z\). Le liquide est homogène, l'écoulement incompressible ; il s'échappe par les bords \(x = \pm\ell\).<br>
    Données : \(\ell = 5{,}0\ \text{cm}\), \(V = 1{,}0\ \text{mm/s}\), \(h_0 = h(0) = 0{,}50\ \text{mm}\), \(b = 10\ \text{cm}\).
  </div>

  <figure class="schema" style="max-width:380px">
  <svg viewBox="0 0 380 170" role="img" aria-label="Deux plaques horizontales : la plaque inférieure fixe, la plaque supérieure descend à la vitesse V ; le liquide entre les deux s'échappe horizontalement par les deux bords ; hauteur h(t) et longueur 2 l repérées">

  <p class="exo-part">Partie A — Bilan global</p>
  <div class="q"><strong>A1.</strong> On considère le liquide compris entre les plans \(x = -X\) et \(x = X\) (\(0 \lt X \leq \ell\)). En exprimant la variation de son volume, montrer que le débit volumique par unité de largeur (selon \(z\)) traversant le plan \(x = X\) vaut \(q(X) = VX\). En déduire la vitesse débitante \(v_d(X,t)\) dans ce plan.</div>
  <div class="q"><strong>A2.</strong> Calculer, à \(t = 0\), la vitesse débitante au bord \(x = \ell\) et le débit volumique total de colle expulsée. Commenter le rapport \(v_d(\ell)/V\).</div>

  <p class="exo-part">Partie B — Champ des vitesses</p>
  <div class="q"><strong>B1.</strong> On cherche un champ de la forme \(v_x = Vx/h(t)\) (indépendant de \(y\)) et \(v_y = w(y,t)\). En utilisant l'incompressibilité et la condition sur la plaque fixe, déterminer \(w\). Vérifier la condition sur la plaque mobile.</div>
  <div class="q"><strong>B2.</strong> L'écoulement est-il stationnaire ? Montrer qu'il est irrotationnel et déterminer le potentiel des vitesses \(\varphi\) (nul en \(O\)). Vérifier l'équation de Laplace.</div>
  <div class="q"><strong>B3.</strong> Déterminer, à \(t\) fixé, les lignes de courant et les équipotentielles. Les représenter qualitativement et préciser le point d'arrêt.</div>

  <p class="exo-part">Partie C — Point de vue lagrangien</p>
  <div class="q"><strong>C1.</strong> Avec \(h(t) = h_0 - Vt\), déterminer la trajectoire d'une particule située en \((x_0, y_0)\) à \(t = 0\). Comparer aux lignes de courant. Pourquoi coïncident-elles malgré le caractère non stationnaire ?</div>
  <div class="q"><strong>C2.</strong> Combien de temps met une particule partie de \(x_0 = 1{,}0\ \text{cm}\) pour atteindre le bord ?</div>
  <div class="q"><strong>C3.</strong> Calculer l'accélération d'une particule par la description eulérienne, puis vérifier avec C1. Évaluer \(a_x\) au bord à \(t = 0\), puis lorsque \(h = h_0/10\). Commenter.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Par unité de largeur, le volume compris entre \(-X\) et \(X\) vaut \(2Xh(t)\) ; il varie de \(2X\dot h = -2XV\) par unité de temps. Le liquide étant incompressible, ce volume perdu sort par les deux plans \(x = \pm X\), qui jouent des rôles symétriques : \(2q(X) = 2XV\), soit \(q(X) = VX\). Vitesse débitante :</p>
    <div class="formula">$$v_d(X,t) = \frac{q(X)}{h(t)} = \frac{VX}{h(t)}$$</div>
    <p><strong>A2.</strong> \(v_d(\ell) = V\ell/h_0\), soit \(v_d(\ell) = 0{,}10\ \text{m/s}\). Débit total sortant par les deux bords : \(2V\ell b = 1{,}0\times10^{-5}\ \text{m}^3/\text{s}\), soit \(10\ \text{mL/s}\). Le rapport \(v_d(\ell)/V = \ell/h_0 = 100\) : la géométrie très aplatie transforme un rapprochement lent en un écoulement latéral rapide.</p>
    <p><strong>B1.</strong> \(\operatorname{div}\vec v = \dfrac{V}{h} + \dfrac{\partial w}{\partial y} = 0\), donc \(w = -\dfrac{Vy}{h} + f(x,t)\). La plaque fixe est imperméable : \(w(0) = 0\), d'où \(f = 0\) et \(w = -Vy/h\). En \(y = h\) : \(w = -V = \dot h\), le liquide au contact de la plaque mobile la suit (imperméabilité). ✓</p>
    <p><strong>B2.</strong> \(\vec v\) dépend de \(t\) par \(h(t)\) : <strong>non stationnaire</strong>. \(\partial_x v_y - \partial_y v_x = 0 - 0 = 0\) : <strong>irrotationnel</strong>. \(\partial_x\varphi = Vx/h\) et \(\partial_y\varphi = -Vy/h\) donnent</p>
    <div class="formula">$$\varphi(x,y,t) = \frac{V}{2h(t)}\,\big(x^2 - y^2\big)$$</div>
    <p>et \(\Delta\varphi = V/h - V/h = 0\) : l'équation de Laplace est vérifiée.</p>
    <p><strong>B3.</strong> \(\dfrac{\mathrm dx}{Vx/h} = \dfrac{\mathrm dy}{-Vy/h}\) donne \(\dfrac{\mathrm dx}{x} = -\dfrac{\mathrm dy}{y}\), soit \(xy = C\) : <strong>hyperboles</strong> d'asymptotes les axes (le liquide descend puis s'écarte latéralement vers les bords). Équipotentielles : \(x^2 - y^2 = \text{cte}\), hyperboles d'asymptotes \(y = \pm x\), orthogonales aux précédentes. Point d'arrêt : \(O\) (\(\vec v = \vec 0\)), au milieu de la plaque fixe.</p>
    <p><strong>C1.</strong> \(\dot y = -\dfrac{Vy}{h_0 - Vt}\) donne \(y = y_0\,\dfrac{h(t)}{h_0}\) ; \(\dot x = \dfrac{Vx}{h_0 - Vt}\) donne \(x = x_0\,\dfrac{h_0}{h(t)}\). Donc \(xy = x_0y_0\) : la trajectoire est l'hyperbole \(xy = \text{cte}\), c'est-à-dire une ligne de courant. La <strong>direction</strong> de \(\vec v\), proportionnelle à \((x, -y)\), ne dépend pas du temps : seule la norme varie, en \(1/h(t)\). La carte des lignes de courant est donc la même à chaque instant et les particules la suivent. Non stationnaire n'implique pas toujours trajectoires distinctes des lignes de courant.</p>
    <p><strong>C2.</strong> \(x = \ell\) lorsque \(h = h_0x_0/\ell = h_0/5 = 0{,}10\ \text{mm}\), c'est-à-dire à \(t = (h_0 - h)/V = 0{,}40\ \text{s}\).</p>
    <p><strong>C3.</strong> Description eulérienne, avec \(\dot h = -V\) :</p>
    <div class="formula">$$a_x = \frac{\partial v_x}{\partial t} + v_x\frac{\partial v_x}{\partial x} = \frac{2V^2x}{h^2}$$</div>
    <div class="formula">$$a_y = \frac{\partial v_y}{\partial t} + v_y\frac{\partial v_y}{\partial y} = 0$$</div>
    <p>Pour \(a_x\), les deux termes valent chacun \(V^2x/h^2\) ; pour \(a_y\), ils valent \(-V^2y/h^2\) et \(+V^2y/h^2\) et se compensent.</p>
    <p>Vérification : \(\dot y = -Vy_0/h_0\) est constant, donc \(\ddot y = 0\) ; \(\dot x = x_0h_0V/h^2\) et \(\ddot x = 2x_0h_0V^2/h^3 = 2V^2x/h^2\). ✓</p>
    <p>Au bord à \(t = 0\) : \(a_x = 2V^2\ell/h_0^2\), soit \(a_x = 0{,}40\ \text{m/s}^2\). Pour \(h = h_0/10\), \(a_x\) est multipliée par 100 (\(40\ \text{m/s}^2\)) et \(v_d(\ell)\) par 10 (\(1\ \text{m/s}\)) : le film devenant très mince, les vitesses et les gradients de vitesse explosent. Le modèle (vitesse indépendante de \(y\), glissement sur les plaques) cesse alors d'être réaliste : la viscosité, qui impose l'adhérence aux parois, devient prépondérante et fixe la force nécessaire à la presse.</p>
