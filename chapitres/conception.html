<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Reconnaître une mise en position</h3>
  <div class="statement">
    On considère trois assemblages démontables :
    <ul style="margin:.4rem 0">
      <li>(a) un flasque de moteur s'appuie sur une face plane annulaire (diamètres 90 et 140 mm) d'un carter et pénètre dans un alésage du carter par un épaulement cylindrique de diamètre 80 mm et de longueur 5 mm ; il est fixé par 4 vis ;</li>
      <li>(b) un pignon de largeur 45 mm est monté sur un arbre de diamètre 25 mm et poussé contre un épaulement de l'arbre de 2,5 mm de hauteur ;</li>
      <li>(c) une roue est montée sur un bout d'arbre conique et serrée par un écrou.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Pour chaque assemblage, identifier la surface prépondérante, modéliser chaque contact et compter les degrés de liberté supprimés.</div>
  <div class="q"><strong>Q2.</strong> Quelle mobilité reste-t-il ? Proposer un moyen de la supprimer.</div>
  <div class="q"><strong>Q3.</strong> En (b), on remplace l'épaulement étroit par une large face d'appui de diamètre 60 mm. Calculer le degré d'hyperstatisme et en donner les conséquences.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) \(L/D = 5/80 \approx 0{,}06\) : centrage court (linéaire annulaire, 2 ddl) ; la face annulaire est un appui plan (3 ddl), surface <strong>prépondérante</strong>. Total : 5 ddl. (b) \(L/D = 45/25 = 1{,}8\) : centrage long (pivot glissant, 4 ddl), prépondérant ; l'épaulement étroit est une ponctuelle (1 ddl). Total : 5 ddl. (c) Le cône est assimilé à une pivot (5 ddl) : prépondérant à lui seul.</p>
    <p><strong>Q2.</strong> Dans les trois cas, la rotation autour de l'axe. (a) Si l'orientation du flasque compte (position du bornier, des trous), un pion de positionnement ; le couple de réaction du moteur est repris par adhérence grâce au serrage des vis. (b) Une clavette, qui transmet aussi le couple par obstacle. (c) Une clavette, ou l'adhérence du cône lui-même si le couple est modéré.</p>
    <p><strong>Q3.</strong> Pivot glissant (4 inconnues) + appui plan (3) : \(I_s = 7\) ; l'ensemble équivaut à une pivot, \(r_s = 5\), donc \(h = 2\). Les deux conditions portent sur l'orientation de la face d'appui autour des deux axes perpendiculaires à l'arbre : il faudrait une face du pignon parfaitement perpendiculaire à son alésage et un épaulement parfaitement perpendiculaire à l'axe de l'arbre. Sinon le contact se fait sur une arête, et le serrage axial fléchit l'arbre ou déforme le pignon. Remèdes : dégagement sur la face (retour à un appui étroit) ou alésage raccourci (le plan devient prépondérant, le centrage devient court).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Fond de vérin vissé</h3>
  <div class="statement">Le fond arrière d'un vérin hydraulique d'alésage \(D = 63\) mm doit tenir une pression de service de 20 MPa (200 bar). Il est fixé sur la bride du tube par 6 vis CHc M12 de classe 8.8 (limite d'élasticité \(R_e = 640\) MPa, section résistante \(A_s = 84{,}3\ \text{mm}^2\)). Le fond s'appuie sur la face d'extrémité de la bride et y est centré par un épaulement court.</div>
  <div class="q"><strong>Q1.</strong> Calculer l'effort axial exercé par l'huile sur le fond.</div>
  <div class="q"><strong>Q2.</strong> En supposant les vis également chargées et en ignorant leur précharge, calculer la contrainte de traction dans une vis et le coefficient de sécurité vis-à-vis de \(R_e\).</div>
  <div class="q"><strong>Q3.</strong> Pourquoi serre-t-on ces vis avec une précharge ? Pour une précharge de 15 kN par vis, vérifier que la contrainte reste sous \(0{,}7\,R_e\), même dans le cas le plus défavorable où chaque vis subirait sa part d'effort de pression <em>en plus</em> de la précharge.</div>
  <div class="q"><strong>Q4.</strong> Qu'est-ce qui met le fond en position par rapport au tube ? Pourquoi les vis n'y contribuent-elles pas ?</div>
  <div class="q"><strong>Q5.</strong> Proposer une solution d'étanchéité entre le fond et le tube.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La pression agit sur la section intérieure du tube :</p>
    <div class="formula">$$\begin{aligned} F &= p\,\frac{\pi D^2}{4} = 20\cdot 10^6 \times \frac{\pi \times 0{,}063^2}{4} \\ &\approx 62{,}3\ \text{kN} \end{aligned}$$</div>
    <p><strong>Q2.</strong> Par vis : \(F_v = 62{,}3/6 \approx 10{,}4\) kN ; \(\sigma = 10\,390/84{,}3 \approx 123\) MPa. Avec \(R_e = 640\) MPa (classe 8.8 : \(10 \times 8 \times 8\)), on obtient \(s = 640/123 \approx 5{,}2\).</p>
    <p><strong>Q3.</strong> La précharge (15 kN, supérieure aux 10,4 kN que la pression cherche à arracher à chaque vis) garde le fond plaqué sur la bride sous pression : le plan de joint ne s'ouvre pas (étanchéité), la vis ne voit qu'une faible variation d'effort à chaque cycle de pression (fatigue) et le frottement sous tête s'oppose au desserrage. Contrainte de précharge : \(\sigma_0 = 15\,000/84{,}3 \approx 178\) MPa. Cas le plus défavorable : \((15\,000 + 10\,390)/84{,}3 \approx 301\) MPa. Les deux restent sous \(0{,}7 \times 640 = 448\) MPa. (En réalité, grâce à la raideur des pièces serrées, la vis ne reprend qu'une petite fraction de l'effort extérieur.)</p>
    <p><strong>Q4.</strong> L'appui plan sur la face de la bride (surface prépondérante, 3 ddl) et le centrage court (2 ddl) ; la rotation autour de l'axe est sans importance pour un fond de révolution. Les vis traversent des trous de passage plus grands que leur diamètre : elles ne positionnent pas, elles <strong>maintiennent</strong> le fond plaqué sur ses appuis.</p>
    <p><strong>Q5.</strong> Étanchéité statique : un joint torique logé dans une gorge usinée sur le centrage (étanchéité radiale) ou dans la face d'appui (étanchéité axiale), écrasé d'environ 15 à 30 % au montage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Transmettre le couple d'une roue : trois solutions</h3>
  <div class="statement">Une roue dentée doit transmettre un couple \(C = 150\) N·m à un arbre en acier de diamètre \(d = 32\) mm. Le moyeu a une longueur \(L = 48\) mm.</div>
  <div class="q"><strong>Q1.</strong> Clavette parallèle 10 × 8 (\(b = 10\) mm, \(h = 8\) mm), \(p_{adm} = 60\) MPa, \(\tau_{adm} = 80\) MPa. Calculer la longueur utile minimale, puis vérifier le cisaillement. Une clavette de forme A convient-elle ?</div>
  <div class="q"><strong>Q2.</strong> Goupille transversale pleine, \(\tau_{adm} = 120\) MPa. Diamètre minimal ? Commenter.</div>
  <div class="q"><strong>Q3.</strong> Frettage sur toute la longueur du moyeu avec \(f = 0{,}12\). Pression de contact minimale ?</div>
  <div class="q"><strong>Q4.</strong> Quelle solution retenir pour une roue à démonter lors des opérations de maintenance ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Matage :</p>
    <div class="formula">$$\begin{aligned} \ell &\geq \frac{4C}{d\,h\,p_{adm}} = \frac{4 \times 150}{0{,}032 \times 0{,}008 \times 60\cdot 10^6} \\ &\approx 39\ \text{mm} \end{aligned}$$</div>
    <p>On prend \(\ell = 40\) mm. Cisaillement :</p>
    <div class="formula">$$\begin{aligned} \tau &= \frac{2C}{d\,b\,\ell} = \frac{300}{0{,}032 \times 0{,}010 \times 0{,}040} \\ &\approx 23\ \text{MPa} \end{aligned}$$</div>
    <p>très inférieur à 80 MPa : c'est bien le matage qui dimensionne. Une forme A (bouts ronds) aurait une longueur totale \(\ell + b = 50\) mm, supérieure au moyeu : il faut une forme B (bouts droits) de 40 mm, ou allonger le moyeu.</p>
    <p><strong>Q2.</strong> Double cisaillement :</p>
    <div class="formula">$$\begin{aligned} d_g &\geq \sqrt{\frac{4C}{\pi\,d\,\tau_{adm}}} \\ &= \sqrt{\frac{600}{\pi \times 0{,}032 \times 120\cdot 10^6}} \approx 7{,}1\ \text{mm} \end{aligned}$$</div>
    <p>soit une goupille de 8 mm (\(\tau \approx 93\) MPa). Mais un perçage de 8 mm dans un arbre de 32 mm (un quart du diamètre) l'affaiblit beaucoup en flexion et en torsion : solution réservée aux petits couples.</p>
    <p><strong>Q3.</strong> D'après \(C = \frac{\pi}{2} f p d^2 L\) :</p>
    <div class="formula">$$\begin{aligned} p &\geq \frac{2C}{\pi\,f\,d^2\,L} \\ &= \frac{300}{\pi \times 0{,}12 \times 0{,}032^2 \times 0{,}048} \\ &\approx 16\ \text{MPa} \end{aligned}$$</div>
    <p>Valeur courante pour un frettage acier/acier, mais \(f\) est incertain : on prend une marge, et le démontage devient difficile (presse, chauffage du moyeu).</p>
    <p><strong>Q4.</strong> La clavette : démontable, standard, insensible à la valeur de \(f\). Le frettage convient à un assemblage quasi définitif sans jeu ; la goupille, à de petits couples.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Choisir le coussinet d'un tambour de convoyeur</h3>
  <div class="statement">
    Chaque palier d'un tambour supporte une charge radiale \(F_r = 2{,}4\) kN. L'axe, de diamètre \(D = 30\) mm, tourne à 240 tr/min ; le coussinet envisagé a une longueur \(L = 20\) mm. Caractéristiques (fictives) de trois matériaux :
    <div style="overflow-x:auto;margin:.4rem 0"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Matériau</th><th style="padding:.35rem;border:1px solid var(--grid)">\(p_{adm}\) (MPa)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(V_{adm}\) (m/s)</th><th style="padding:.35rem;border:1px solid var(--grid)">\((pV)_{adm}\) (MPa·m/s)</th></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">A — bronze fritté imprégné</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">12</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">5</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">1,6</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">B — composite acier/bronze/PTFE</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">60</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">2</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">2,0</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">C — polyamide chargé</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">15</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">1</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">0,15</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>Q1.</strong> Calculer \(p\), \(V\) et \(pV\). Quels matériaux conviennent ?</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(pV\) ne dépend pas de \(D\). Quel levier reste-t-il pour le diminuer ?</div>
  <div class="q"><strong>Q3.</strong> La vitesse passe à 400 tr/min. Quelle longueur minimale faut-il au coussinet A ? Le rapport \(L/D\) obtenu est-il raisonnable ?</div>
  <div class="q"><strong>Q4.</strong> Préciser les ajustements du coussinet et de l'axe.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(p = \dfrac{2\,400}{30 \times 20} = 4\) MPa ; \(\omega = 240 \times \dfrac{2\pi}{60} \approx 25{,}1\) rad/s ; \(V = 25{,}1 \times 0{,}015 \approx 0{,}38\) m/s ; \(pV \approx 1{,}51\) MPa·m/s. A convient (1,51 &lt; 1,6, de justesse), B convient aussi, avec davantage de marge (1,51 contre 2,0), C est exclu par le critère \(pV\) (10 fois trop grand).</p>
    <p><strong>Q2.</strong> \(pV = \dfrac{F_r}{DL} \cdot \dfrac{\omega D}{2} = \dfrac{F_r\,\omega}{2L}\) : le diamètre s'élimine. Un plus gros diamètre baisse \(p\) mais augmente \(V\) dans la même proportion. Le levier est la <strong>longueur</strong> \(L\) (ou le matériau, ou une lubrification d'appoint).</p>
    <p><strong>Q3.</strong> \(V = 41{,}9 \times 0{,}015 \approx 0{,}63\) m/s ; il faut \(\dfrac{F_r\,V}{D\,L} \leq 1{,}6\) MPa·m/s, soit \(L \geq \dfrac{2\,400 \times 0{,}63}{30 \times 1{,}6} \approx 31{,}4\) mm : \(L = 32\) mm (\(p = 2{,}5\) MPa, \(pV \approx 1{,}57\)). \(L/D \approx 1{,}07\) : raisonnable (au-delà de 1,5, défauts d'alignement et pressions d'extrémité).</p>
    <p><strong>Q4.</strong> Coussinet monté serré dans son logement (il ne doit pas tourner), axe glissant dans le coussinet avec un jeu de l'ordre du millième du diamètre ; axe dur et bien poli.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Choisir un roulement sur sa durée de vie</h3>
  <div class="statement">
    Le roulement le plus chargé d'un arbre de transmission supporte \(F_r = 2{,}0\) kN et \(F_a = 0{,}3\) kN à 1 200 tr/min. On vise \(L_{10h} \geq 25\,000\) h. Trois rigides à billes (fictifs) ont l'alésage voulu : R1 (\(C = 14\) kN), R2 (\(C = 19{,}5\) kN), R3 (\(C = 25{,}5\) kN). Pour ces roulements : \(e = 0{,}22\) ; si \(F_a/F_r \leq e\), \(P = F_r\) ; sinon \(P = 0{,}56\,F_r + 2{,}0\,F_a\).
  </div>
  <div class="q"><strong>Q1.</strong> Calculer la charge dynamique équivalente.</div>
  <div class="q"><strong>Q2.</strong> Déterminer la charge dynamique de base minimale et choisir le roulement. Calculer sa durée de vie en heures.</div>
  <div class="q"><strong>Q3.</strong> L'effort axial passe à 0,8 kN. Nouvelle durée de vie ?</div>
  <div class="q"><strong>Q4.</strong> La charge a une direction fixe et l'arbre tourne : quelle bague monter serrée ? Et si la charge provenait d'un balourd tournant avec l'arbre ?</div>
  <div class="q"><strong>Q5.</strong> L'arbre est porté par deux roulements dimensionnés chacun pour \(L_{10h} = 25\,000\) h. Quelle proportion de paliers atteint 25 000 h sans défaillance ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(F_a/F_r = 0{,}15 \leq 0{,}22\) : \(P = F_r = 2{,}0\) kN.</p>
    <p><strong>Q2.</strong> Durée requise en tours : \(L_{10} = \dfrac{60 \times 1\,200 \times 25\,000}{10^6} = 1\,800\) millions de tours. \(C_{min} = P\,L_{10}^{1/3} \approx 24{,}3\) kN (\(2{,}0 \times 12{,}16\)) : on choisit <strong>R3</strong>. Alors \(L_{10} = (25{,}5/2)^3 \approx 2\,073\) millions de tours, \(L_{10h} = \dfrac{2\,073\cdot 10^6}{60 \times 1\,200} \approx 28\,800\) h.</p>
    <p><strong>Q3.</strong> \(F_a/F_r = 0{,}4 \gt e\) : \(P = 0{,}56 \times 2 + 2{,}0 \times 0{,}8 = 2{,}72\) kN. \(L_{10} = (25{,}5/2{,}72)^3 \approx 824\) millions de tours, \(L_{10h} \approx 11\,400\) h : une hausse de 36 % de \(P\) divise la durée par 2,5 (\(1{,}36^3 \approx 2{,}5\)).</p>
    <p><strong>Q4.</strong> Charge fixe, arbre tournant : la BI tourne par rapport à la charge → <strong>BI serrée</strong>, BE glissante. Avec un balourd, la charge tourne avec l'arbre : elle est fixe pour la BI et tourne par rapport à la BE → <strong>BE serrée</strong>.</p>
    <p><strong>Q5.</strong> Chaque roulement survit avec la probabilité 0,9 ; le palier fonctionne si les deux survivent : \(0{,}9^2 = 0{,}81\), soit 81 % des paliers (en supposant les défaillances indépendantes).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Chariot sur colonne et arc-boutement</h3>
  <div class="statement">Un chariot porte-outil coulisse le long d'une colonne cylindrique fixe par l'intermédiaire d'une bague en bronze de longueur \(L\) (frottement \(f = 0{,}12\)). Il est poussé par un vérin dont l'axe, parallèle à la colonne, est à la distance \(d = 180\) mm de l'axe de celle-ci. Une charge résistante \(Q = 2\) kN, parallèle à la colonne, s'exerce sur l'axe de la colonne. On néglige le poids et l'inertie, et on suppose que le chariot, basculant dans son jeu, touche la colonne en deux points opposés \(A\) et \(B\) situés aux extrémités de la bague.</div>
  <div class="q"><strong>Q1.</strong> Écrire l'équilibre du chariot (mouvement à vitesse constante) et établir \(F = \dfrac{Q}{1 - 2fd/L}\).</div>
  <div class="q"><strong>Q2.</strong> En déduire la condition de non-arc-boutement. La bague actuelle mesure \(L = 50\) mm : le chariot avance-t-il ? Avec quel effort de vérin ?</div>
  <div class="q"><strong>Q3.</strong> Calculer l'effort nécessaire avec \(L = 120\) mm.</div>
  <div class="q"><strong>Q4.</strong> On remplace la bague par une douille à billes (\(f = 0{,}005\)) de même longueur 50 mm. Conclure, puis proposer d'autres améliorations.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En \(A\) et \(B\), la colonne exerce des actions normales \(N_A\), \(N_B\) (opposées, perpendiculaires à l'axe) et des frottements \(f N_A\), \(f N_B\) opposés au mouvement. Résultante transversale : \(N_A = N_B = N\). Moment au point de l'axe situé au droit de \(A\) : \(Q\) et \(N_A\) n'y ont pas de moment, les deux frottements (égaux, de part et d'autre de l'axe, à la même distance) ont des moments opposés ; il reste \(N L - F d = 0\), soit \(N = F d/L\). Résultante axiale : \(F - Q - 2 f N = 0\), d'où \(F\left(1 - \dfrac{2 f d}{L}\right) = Q\).</p>
    <p><strong>Q2.</strong> Il faut \(1 - 2fd/L \gt 0\), soit \(L \gt 2 f d = 2 \times 0{,}12 \times 180 = 43{,}2\) mm. Avec \(L = 50\) mm, le chariot avance, mais \(F = \dfrac{2\,000}{1 - 43{,}2/50} \approx 14{,}7\) kN : plus de sept fois la charge ! On est trop près de l'arc-boutement (le moindre surcroît de frottement bloquerait tout).</p>
    <p><strong>Q3.</strong> \(F = \dfrac{2\,000}{1 - 43{,}2/120} = \dfrac{2\,000}{0{,}64} \approx 3{,}1\) kN.</p>
    <p><strong>Q4.</strong> \(2fd = 1{,}8\) mm ≪ 50 mm : \(F \approx 2{,}07\) kN, l'arc-boutement est écarté. Autres pistes : rapprocher l'axe du vérin de celui de la colonne (\(d\) petit, idéalement nul), allonger le guidage, ou guider par deux colonnes encadrant l'effort.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Pignon en porte-à-faux : montage en X ou en O ?</h3>
  <div class="statement">Un arbre tournant porte en bout un pignon conique qui subit une charge radiale \(F_r = 4\) kN (on néglige l'effet de l'effort axial sur les réactions radiales). Il est guidé par deux roulements à rouleaux coniques A et B. Sur l'axe, depuis le plan du pignon : milieu de A à 40 mm, milieu de B à 100 mm. Pour chaque roulement, le centre de poussée est décalé de 18 mm par rapport au milieu du roulement, vers l'extérieur de la paire en montage en O, vers l'intérieur en montage en X.</div>
  <div class="q"><strong>Q1.</strong> Placer les centres de poussée dans les deux montages et calculer les bases effectives.</div>
  <div class="q"><strong>Q2.</strong> Calculer les réactions radiales sur A et B dans chaque cas.</div>
  <div class="q"><strong>Q3.</strong> En assimilant la charge équivalente de A à sa réaction radiale, comparer les durées de vie de A.</div>
  <div class="q"><strong>Q4.</strong> Quel montage retenir ? Quelles bagues sont serrées, et comment réaliser le réglage ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En O : centres à \(40 - 18 = 22\) mm et \(100 + 18 = 118\) mm, base 96 mm. En X : centres à \(58\) mm et \(82\) mm, base 24 mm seulement.</p>
    <p><strong>Q2.</strong> Moments au centre de poussée de B. En O : \(R_A \times 96 = 4 \times 118\), d'où \(R_A \approx 4{,}92\) kN et \(R_B = R_A - 4 \approx 0{,}92\) kN (de sens opposé à la charge). En X : \(R_A \times 24 = 4 \times 82\), d'où \(R_A \approx 13{,}7\) kN et \(R_B \approx 9{,}7\) kN.</p>
    <p><strong>Q3.</strong> Rouleaux, \(n = 10/3\) : \(\dfrac{L_O}{L_X} = \left(\dfrac{13{,}7}{4{,}92}\right)^{10/3} \approx 30\). Le roulement A dure environ trente fois plus longtemps en O.</p>
    <p><strong>Q4.</strong> Le montage en <strong>O</strong>, nettement plus rigide et moins chargé pour une charge en porte-à-faux. L'arbre tourne sous une charge de direction fixe : les BI sont serrées, les BE glissantes. Le réglage se fait par les BI (écrou à encoches + rondelle frein, ou entretoise rectifiée), qu'on monte avec un serrage léger pour pouvoir les déplacer : c'est le compromis accepté pour bénéficier de la rigidité du montage en O.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Poulie sur bout d'arbre conique : couple transmissible et ajustements</h3>
  <div class="statement">La poulie d'un ventilateur industriel (7,5 kW à 1 450 tr/min ; couple de démarrage égal à 1,8 fois le couple nominal) est montée sur un bout d'arbre conique de conicité 1/10 (le diamètre varie de 1 mm pour 10 mm de longueur), de rayon moyen \(R_{moy} = 14\) mm. Elle est poussée sur le cône par un écrou qui exerce un effort axial \(F_a = 10\) kN ; coefficient de frottement acier sur acier \(f = 0{,}15\). L'arbre est guidé par deux roulements rigides à billes ; la tension des courroies a une direction fixe.</div>
  <div class="q"><strong>Q1.</strong> Calculer le demi-angle \(\alpha\) du cône, puis le couple transmissible par adhérence en négligeant le frottement pendant le serrage.</div>
  <div class="q"><strong>Q2.</strong> Reprendre le calcul en tenant compte du frottement pendant l'enfoncement. Comparer. La liaison transmet-elle le couple de démarrage ? Que se passe-t-il si \(f\) ne vaut que 0,12 ?</div>
  <div class="q"><strong>Q3.</strong> Le cône est-il autobloquant ? Quelle conséquence pour le démontage de la poulie ?</div>
  <div class="q"><strong>Q4.</strong> Les diamètres du cône de l'arbre et de l'alésage conique de la poulie sont réalisés à \(\pm 0{,}015\) mm. De combien la position axiale de la poulie peut-elle varier ? Est-ce gênant ici ?</div>
  <div class="q"><strong>Q5.</strong> La bague intérieure d'un roulement (alésage entre 29,990 et 30,000 mm) est montée sur une portée d'arbre entre 30,002 et 30,015 mm ; sa bague extérieure (diamètre entre 61,987 et 62,000 mm) est logée dans un alésage entre 62,000 et 62,030 mm. Donner la nature de chaque ajustement. Est-ce cohérent avec la règle de la charge tournante ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le rayon varie de 0,5 mm pour 10 mm de longueur : \(\tan\alpha = 0{,}05\), \(\alpha \approx 2{,}86°\), \(\sin\alpha \approx 0{,}0499\). Sans frottement de serrage, \(N \approx F_a/\sin\alpha \approx 200\) kN et</p>
    <div class="formula">$$C_{max} \approx \frac{f\,F_a\,R_{moy}}{\sin\alpha} = \frac{0{,}15 \times 10^4 \times 0{,}014}{0{,}0499} \approx 420\ \text{N·m}$$</div>
    <p><strong>Q2.</strong> Pendant l'enfoncement, le frottement s'oppose au glissement le long des génératrices : \(F_a = N\,(\sin\alpha + f\cos\alpha)\), d'où \(N = 10^4/(0{,}0499 + 0{,}1498) \approx 50{,}1\) kN, quatre fois moins, et \(C_{max} = f\,N\,R_{moy} \approx 105\) N·m. Pour un cône aussi peu ouvert, le frottement de serrage ne peut pas être négligé : la première estimation est quatre fois trop optimiste. Couple nominal : \(\omega = 1\,450 \times 2\pi/60 \approx 151{,}8\) rad/s, \(C = 7\,500/151{,}8 \approx 49{,}4\) N·m ; au démarrage, \(1{,}8 \times 49{,}4 \approx 89\) N·m, inférieur à 105 N·m : la liaison convient, avec une marge de 18 % seulement. Avec \(f = 0{,}12\) : \(N = 10^4/(0{,}0499 + 0{,}1199) \approx 58{,}9\) kN et \(C_{max} \approx 0{,}12 \times 58\,900 \times 0{,}014 \approx 99\) N·m : cela passe encore, mais la marge fond. Comme \(f\) est mal connu, on ajoute souvent une clavette disque, qui assure l'orientation et sert de sécurité.</p>
    <p><strong>Q3.</strong> \(\tan\alpha = 0{,}05 \lt f = 0{,}15\) : le cône est autobloquant. Une fois enfoncée, la poulie tient même si l'écrou se desserre, mais elle ne se dégage pas seule quand on retire l'écrou : il faut un extracteur (ou un chasse-cône), à prévoir dans la conception (trous taraudés sur le moyeu par exemple).</p>
    <p><strong>Q4.</strong> Un écart de diamètre \(\Delta d\) décale la position axiale de \(\Delta d/(2\tan\alpha) = \Delta d/0{,}1\) : \(\pm 0{,}015\) mm sur un diamètre donne \(\pm 0{,}15\) mm, et le cumul des deux pièces jusqu'à \(\pm 0{,}3\) mm. Pour une poulie à courroies, un tel décalage est sans conséquence (l'alignement des poulies tolère bien davantage) ; il le serait pour un pignon conique, dont la position axiale règle l'engrènement.</p>
    <p><strong>Q5.</strong> Bague intérieure : serrage minimal \(30{,}002 - 30{,}000 = 0{,}002\) mm, serrage maximal \(30{,}015 - 29{,}990 = 0{,}025\) mm : il y a toujours serrage, ajustement serré. Bague extérieure : jeu minimal \(62{,}000 - 62{,}000 = 0\), jeu maximal \(62{,}030 - 61{,}987 = 0{,}043\) mm : jamais de serrage, ajustement avec jeu (glissant, à jeu minimal nul). L'arbre tourne et la charge (tension des courroies) a une direction fixe : la bague intérieure tourne par rapport à la charge, elle doit être serrée ; la bague extérieure, fixe par rapport à la charge, peut être glissante, ce qui permet au roulement libre de coulisser dans son logement. C'est cohérent.</p>
  </div>
</div>

  <p class="exo-part">Partie A — Analyse du plan</p>
  <div class="q"><strong>A1.</strong> Donner les classes d'équivalence cinématique (à quelle classe appartiennent les bagues des roulements ?).</div>
  <div class="q"><strong>A2.</strong> Décrire la mise en position, le maintien en position et la transmission du couple de la poulie 6 sur l'arbre 1. Pourquoi a-t-on ménagé un jeu entre la rondelle 8 et l'extrémité de l'arbre ?</div>
  <div class="q"><strong>A3.</strong> Lequel des deux roulements est le roulement fixe ? Justifier par les arrêts axiaux, modéliser chaque roulement et calculer le degré d'hyperstatisme du guidage.</div>
  <div class="q"><strong>A4.</strong> Préciser les ajustements des bagues. Sont-ils cohérents avec la question A3 ?</div>
  <div class="q"><strong>A5.</strong> Rôle des pièces 5 et 16 ? Quelle étanchéité manque sur le plan ? Quel lubrifiant proposer ?</div>

  <p class="exo-part">Partie B — Dimensionnement</p>
  <div class="q"><strong>B1.</strong> Calculer le couple nominal et vérifier la clavette au matage, y compris au démarrage.</div>
  <div class="q"><strong>B2.</strong> Calculer les réactions radiales sur les roulements 3 et 10.</div>
  <div class="q"><strong>B3.</strong> Calculer la durée de vie du roulement 3 et conclure. Proposer deux remèdes chiffrés.</div>

  <p class="exo-part">Partie C — Évolution de la conception</p>
  <div class="q"><strong>C1.</strong> Un dessinateur propose de bloquer aussi la bague extérieure de 10 entre un épaulement du corps et le couvercle 12. Qu'en penser ?</div>
  <div class="q"><strong>C2.</strong> Une nouvelle version de la pompe double la tension des courroies (\(F = 2{,}4\) kN). Proposer une évolution du guidage, justifiée et prédimensionnée.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Classe « bâti » : 2, 4, 12, 14, 15, les bagues extérieures de 3 et 10 et les armatures des joints 5 et 16. Classe « arbre » : 1, 6, 7, 8, 9, 11, 13 et les bagues intérieures de 3 et 10. Les éléments roulants ne font partie d'aucune des deux classes.</p>
    <p><strong>A2.</strong> Mise en position : centrage long du moyeu sur l'arbre (longueur nettement supérieure au diamètre : pivot glissant, 4 ddl), surface prépondérante, complété par l'épaulement étroit de l'arbre (1 ddl). La rotation restante est supprimée par la clavette 7, qui transmet le couple par <strong>obstacle</strong>. Maintien : vis 9 et rondelle 8, qui plaquent le moyeu contre l'épaulement. Le moyeu dépasse de sa portée : le jeu entre 8 et le bout de l'arbre garantit que la rondelle serre bien le moyeu (sans ce jeu, elle buterait sur l'arbre et la poulie pourrait se déplacer).</p>
    <p><strong>A3.</strong> Roulement 3 : BE entre le couvercle 4 et l'épaulement du corps 2, BI entre l'anneau 11 et l'épaulement de l'arbre ; il est arrêté dans les deux sens sur ses deux bagues : c'est le <strong>roulement fixe</strong>, modélisé par une rotule. Roulement 10 : BI arrêtée (épaulement + anneau 13), BE libre avec un jeu de chaque côté : <strong>roulement libre</strong>, modélisé par une linéaire annulaire. \(I_s = 3 + 2 = 5\), liaison équivalente pivot (\(r_s = 5\)) : \(h = 0\). Le guidage est isostatique et l'arbre peut se dilater sans charger les roulements.</p>
    <p><strong>A4.</strong> Arbre tournant, charge de direction fixe : les BI tournent par rapport à la charge, elles sont <strong>serrées</strong> sur l'arbre (par exemple k5) ; les BE sont <strong>glissantes</strong> dans le corps (H7). C'est cohérent : la bague libre du roulement 10 est bien sa BE glissante, qui peut coulisser.</p>
    <p><strong>A5.</strong> 5 et 16 : joints à lèvre, étanchéité dynamique entre l'arbre tournant et les couvercles (retenir le lubrifiant, arrêter les poussières), lèvre principale tournée vers l'intérieur du palier. Il manque l'étanchéité <strong>statique</strong> entre les couvercles 4, 12 et le corps 2 : joint plat sous les brides ou joint torique sur les centrages. À 1 450 tr/min et sans carter d'huile, une lubrification à la <strong>graisse</strong> est la plus simple.</p>
    <p><strong>B1.</strong> \(\omega = 1\,450 \times 2\pi/60 \approx 151{,}8\) rad/s ; \(C = P/\omega \approx 19{,}8\) N·m. </p>
    <div class="formula">$$\begin{aligned} p &= \frac{4C}{d\,h\,\ell} = \frac{4 \times 19{,}8}{0{,}025 \times 0{,}007 \times 0{,}032} \\ &\approx 14\ \text{MPa} \end{aligned}$$</div>
    <p>Au démarrage, \(2{,}5 \times 14 \approx 35\) MPa \(\leq 40\) MPa : la clavette convient.</p>
    <p><strong>B2.</strong> Statique de l'ensemble lié à l'arbre (accouplement : couple seul). Moments au milieu de 10 : \(R_3\,\ell = F\,(a + \ell)\), d'où \(R_3 = 1{,}2 \times \dfrac{230}{160} \approx 1{,}73\) kN, de même sens que \(F\). Résultante : \(R_{10} = R_3 - F \approx 0{,}53\) kN, de sens opposé. Le roulement proche de la poulie est le plus chargé (effet du porte-à-faux).</p>
    <p><strong>B3.</strong> Effort axial quasi nul : \(P = R_3 = 1{,}725\) kN. \(L_{10} = (16/1{,}725)^3 \approx 798\) millions de tours ; \(L_{10h} = \dfrac{798\cdot 10^6}{60 \times 1\,450} \approx 9\,200\) h \(\lt 12\,000\) h : insuffisant. Remède 1 : roulement plus gros, avec</p>
    <div class="formula">$$\begin{aligned} C &\geq 1{,}725 \times \left(\frac{60 \times 1\,450 \times 12\,000}{10^6}\right)^{1/3} \\ &\approx 17{,}5\ \text{kN} \end{aligned}$$</div>
    <p>Remède 2 : rapprocher la poulie, par exemple \(a = 50\) mm : \(R_3 \approx 1{,}58\) kN et \(L_{10h} \approx 12\,050\) h : l'objectif est tout juste atteint.</p>
    <p><strong>C1.</strong> Les deux roulements deviendraient fixes : rotule + rotule, \(I_s = 6\), \(r_s = 5\), \(h = 1\) (condition axiale). Il faudrait que la distance entre épaulements sur l'arbre et dans le corps soit rigoureusement la même, et la dilatation de l'arbre, plus chaud que le corps, chargerait axialement les roulements : durée de vie réduite, voire grippage. Proposition à rejeter.</p>
    <p><strong>C2.</strong> \(R_3 = 3{,}45\) kN, \(R_{10} = 1{,}05\) kN. Un rigide à billes en 3 demanderait \(C \geq 3{,}45 \times 1\,044^{1/3} \approx 35\) kN (encombrant). Solution : en 3, un roulement à <strong>rouleaux cylindriques</strong> (forte capacité radiale) qui devient le roulement <strong>libre</strong> (linéaire annulaire) : \(C \geq 3{,}45 \times 1\,044^{3/10} \approx 28\) kN ; en 10, le rigide à billes devient le roulement <strong>fixe</strong> (\(C \geq 1{,}05 \times 1\,044^{1/3} \approx 10{,}7\) kN : l'actuel convient), sa BE étant alors arrêtée entre un épaulement du corps et le centrage du couvercle 12. Variante : deux roulements à rouleaux coniques montés en O (rigidité au basculement, adaptée au porte-à-faux), avec réglage par écrou à encoches.</p>
  </div>
