<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la compétence F3 du semestre S4 « concevoir et dimensionner une liaison mécanique » : exigences d'<strong>assemblage</strong>, de <strong>guidage en rotation</strong> et de <strong>guidage en translation</strong>, avec les critères de dimensionnement du programme — puissance, vitesse et effort ; durée de vie ; encombrement. Il remobilise la modélisation des liaisons et l'hyperstatisme (chapitre Chaînes de solides), la cotation et la nature des ajustements (chapitre Cotation &amp; tolérances), le frottement de Coulomb et la résistance des matériaux (chapitre Résistance des matériaux).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Concevoir une liaison</strong> à partir de ses exigences : fonctions techniques, critères (puissance, vitesse et effort ; durée de vie ; encombrement), torseur transmissible, démarche (F3, S4) (§1).</li>
        <li><strong>Nature des ajustements</strong> : avec jeu (glissant), incertain, serré (rappel S2) (§1).</li>
        <li><strong>Assemblage démontable — mise en position</strong> : surfaces de contact et liaisons élémentaires, surface prépondérante, lien avec l'isostatisme (F3 S4 ; rappel S2) (§2).</li>
        <li><strong>Assemblage — maintien en position</strong> : éléments filetés, freinage, éléments rapportés, formes fixes (F3, S4) (§3).</li>
        <li><strong>Assemblage — transmission des efforts</strong> par adhérence (serrage, frettage, cône) ou par obstacle (clavette, cannelures, goupille), et dimensionnement simple (F3, S4) (§4).</li>
        <li><strong>Guidage en rotation par glissement</strong> : contact direct, paliers lisses, critères \(p\), \(V\), \(pV\) (F3, S4) (§5).</li>
        <li><strong>Guidage en rotation par roulements</strong> : familles, modèles cinématiques, montage isostatique, ajustement des bagues selon la charge tournante, arrêts axiaux (F3, S4) (§6) ; roulements à contact oblique, montages en X et en O, réglage (§7).</li>
        <li><strong>Durée de vie</strong> des roulements, lubrification, étanchéité (F3, S4) (§8).</li>
        <li><strong>Guidage en translation</strong> ; arc-boutement (F3 S4 ; frottement de Coulomb : rappel S2) (§9).</li>
      </ul>
      <p>Non exigible : les <strong>ajustements normalisés chiffrés</strong> (H7/g6, k5, N7…) — seule la nature de l'ajustement est au programme ; les désignations citées dans ce chapitre sont des exemples. La lecture des classes de qualité des vis, les valeurs de catalogue (\(p_{adm}\), \((pV)_{adm}\), coefficients \(X\) et \(Y\) des roulements) et le choix d'un lubrifiant relèvent de la culture technique : ces données sont toujours fournies (documentation technique).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · CONCEVOIR UNE LIAISON</div>
  <h2>Du besoin à la solution technologique</h2>
  <div class="intro">Sur un schéma cinématique, une liaison n'est qu'un symbole. Dans la machine réelle, il faut la <strong>réaliser</strong> avec des surfaces de contact, des composants standard (vis, anneaux élastiques, coussinets, roulements, joints…) et des réglages. Concevoir une liaison, c'est choisir ces solutions pour satisfaire un cahier des charges, puis les <strong>dimensionner</strong>.</div>

  <h3>Trois fonctions techniques</h3>
  <ul>
    <li><strong>Assembler</strong> : réaliser une liaison encastrement <em>démontable</em> entre deux pièces (les assemblages permanents — soudage, collage, rivetage — relèvent du chapitre « Assemblages : soudage, rivetage, collage, vissage »).</li>
    <li><strong>Guider en rotation</strong> : réaliser une liaison pivot (arbre dans un bâti, moyeu sur un axe).</li>
    <li><strong>Guider en translation</strong> : réaliser une liaison glissière (chariot, coulisseau, tige de vérin).</li>
  </ul>

  <h3>Exigences techniques et critères</h3>
  <p>Pour départager plusieurs solutions, on attache à chaque besoin des grandeurs que l'on peut chiffrer ou vérifier :</p>
  <div style="overflow-x:auto;margin:.4rem 0"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">La liaison doit…</th><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">…ce que l'on chiffre</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">placer les pièces l'une par rapport à l'autre</td><td style="padding:.35rem;border:1px solid var(--grid)">décalages et inclinaisons tolérés, retour à la même position après démontage</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">rester en place</td><td style="padding:.35rem;border:1px solid var(--grid)">effort de serrage, résistance au desserrage sous vibrations, démontabilité</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">faire passer les efforts</td><td style="padding:.35rem;border:1px solid var(--grid)">composantes non nulles du torseur transmissible, intensités, sens, chocs, inversions</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">autoriser un mouvement</td><td style="padding:.35rem;border:1px solid var(--grid)">angle ou course, vitesse \(\omega\) ou \(V\), jeu ou précharge, frottement, durée de vie</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">supporter son environnement</td><td style="padding:.35rem;border:1px solid var(--grid)">température, poussières, humidité, corrosion ; lubrification et étanchéité à prévoir</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">se monter et s'entretenir</td><td style="padding:.35rem;border:1px solid var(--grid)">ordre de montage, accessibilité, réglage, outillage</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">rester économique et compacte</td><td style="padding:.35rem;border:1px solid var(--grid)">nombre de pièces et d'usinages, composants standard, volume disponible</td></tr>
  </table></div>

  <h3>Torseur transmissible</h3>
  <div class="def-box">
    On écrit, dans la base locale de la liaison, le torseur des actions mécaniques qu'elle doit transmettre. Pour un guidage en rotation d'axe \((O, \vec{x})\) :
    <div class="formula">$$\{\mathcal{T}_{1\to 2}\} = \left\{\begin{array}{cc} X & 0 \\ Y & M \\ Z & N \end{array}\right\}_{O,\,(\vec{x},\vec{y},\vec{z})}$$</div>
    Le zéro traduit la mobilité : le couple autour de l'axe n'est pas transmis (aux frottements près). Pour un encastrement, les six composantes sont à transmettre ; pour une glissière de direction \(\vec{x}\), c'est la résultante \(X\) qui est nulle.
  </div>

  <h3>Démarche générale</h3>
  <ol>
    <li>Identifier les <strong>mobilités</strong> à supprimer et le <strong>torseur</strong> à transmettre (intensités, sens, variations).</li>
    <li>Choisir la <strong>surface de contact prépondérante</strong>, puis les surfaces complémentaires, pour une mise en position isostatique.</li>
    <li>Choisir le <strong>maintien en position</strong> et le mode de <strong>transmission des efforts</strong> (adhérence ou obstacle), ou les composants de guidage (paliers lisses, roulements, patins).</li>
    <li><strong>Dimensionner</strong> (pressions, contraintes, produit \(pV\), durée de vie) et définir <strong>ajustements</strong> et <strong>jeux</strong>.</li>
    <li>Vérifier montage, démontage, réglage, lubrification, étanchéité et coût.</li>
  </ol>
  <h3>Nature d'un ajustement (rappel)</h3>
  <div class="def-box">
    La <strong>nature d'un ajustement</strong> entre un arbre et un alésage de même diamètre nominal se lit sur leurs cotes limites. L'ajustement est <strong>avec jeu</strong> (ou glissant) si l'arbre est toujours plus petit que l'alésage, <strong>serré</strong> s'il est toujours plus grand, <strong>incertain</strong> si, selon les pièces réalisées dans leurs tolérances, on peut obtenir un jeu ou un serrage. Le jeu maximal vaut alésage maxi − arbre mini ; le serrage maximal, arbre maxi − alésage mini.
  </div>
  <div class="notice"><strong>Jeu et ajustement.</strong> Un guidage sans jeu ne bouge pas, un centrage avec trop de jeu ne centre plus : chaque contact reçoit un ajustement adapté — glissant (par exemple H7/g6) pour un centrage démontable ou un palier, incertain pour un centrage précis que l'on démonte rarement, serré (H7/p6 ou plus) pour une bague qui ne doit pas tourner dans son logement. Seule la nature de l'ajustement est exigible : les désignations normalisées sont des exemples. Notation ISO : voir le chapitre « Cotation &amp; tolérances ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Alésage entre 20,000 et 20,021 mm, arbre entre 20,002 et 20,015 mm. Nature de l'ajustement ?</span>
    <div class="content"><p>Jeu maximal : \(20{,}021 - 20{,}002 = 0{,}019\ \text{mm}\) (alésage maxi, arbre mini). Serrage maximal : \(20{,}015 - 20{,}000 = 0{,}015\ \text{mm}\) (arbre maxi, alésage mini). Les deux situations sont possibles : l'ajustement est <strong>incertain</strong>. Il convient à un centrage précis démonté occasionnellement (montage au maillet), pas à un palier ni à une bague qui doit être immobilisée par le seul serrage.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · MISE EN POSITION</div>
  <h2>Mettre en position sans surabondance</h2>
  <div class="intro">Mettre en position, c'est supprimer des degrés de liberté par des contacts entre surfaces. On choisit une surface qui « commande » la position — la surface prépondérante — et on la complète par des contacts secondaires qui suppriment chacun des degrés de liberté <em>encore libres</em>, et seulement ceux-là.</div>

  <div class="def-box">
    Une mise en position est <strong>complète</strong> si elle supprime les six degrés de liberté, <strong>partielle</strong> sinon (une mobilité est laissée volontairement, ou supprimée plus loin par un autre élément : pion, clavette…). La <strong>surface prépondérante</strong> est celle qui supprime le plus de degrés de liberté : c'est elle qui fixe la précision principale de l'assemblage.
  </div>

  <h3>Associer un contact réel à une liaison élémentaire</h3>
  <p>Le modèle dépend des <strong>proportions</strong> de la surface de contact (valeurs indicatives) :</p>
  <div style="overflow-x:auto;margin:.4rem 0"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Contact réel</th><th style="padding:.35rem;border:1px solid var(--grid)">Critère</th><th style="padding:.35rem;border:1px solid var(--grid)">Liaison modèle</th><th style="padding:.35rem;border:1px solid var(--grid)">ddl supprimés</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">petite surface (dimensions voisines, faibles)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">—</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">ponctuelle (sphère-plan)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">1</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">plan étroit (largeur \(\ell\), longueur \(L\))</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">\(\ell/L \lesssim 0{,}2\)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">linéaire rectiligne</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">2</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">plan large</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">—</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">appui plan</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">3</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">centrage court (longueur \(L\), diamètre \(D\))</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">\(L/D \lesssim 0{,}8\)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">linéaire annulaire (sphère-cylindre)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">2</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">centrage long</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">\(L/D \gtrsim 1{,}5\)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">pivot glissant</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">4</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">cône d'assez grande longueur</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">—</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">pivot</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">5</td></tr>
  </table></div>
  <p>Entre les deux seuils (\(0{,}8 \lesssim L/D \lesssim 1{,}5\)), le comportement est ambigu : on évite cette zone, ou on raisonne sur le cas le plus défavorable.</p>

  <h3>Les trois architectures classiques</h3>
  <ul>
    <li><strong>Appui plan prépondérant</strong> (3) + <strong>centrage court</strong> (2) + arrêt en rotation (1 : pion, ergot, clavette). Variante sans centrage, pour une pièce prismatique : plan + linéaire rectiligne + ponctuelle (principe « 3-2-1 »). C'est le choix naturel quand la pièce doit surtout transmettre un <strong>effort normal au plan</strong>.</li>
    <li><strong>Centrage long prépondérant</strong> (4) + <strong>épaulement étroit</strong> (ponctuelle, 1) + arrêt en rotation (1). Choix naturel pour un moyeu qui transmet un <strong>couple</strong> (poulie, roue dentée) : le centrage long assure la coaxialité.</li>
    <li><strong>Cône prépondérant</strong> (5) + arrêt en rotation (1). Le cône supprime tout jeu radial (centrage très précis, qui se rattrape à l'usure) et se démonte facilement, mais la position axiale dépend des diamètres réels.</li>
  </ul>

  <div class="prop-box">
    <strong>Isostatisme.</strong> Chaque degré de liberté doit être supprimé <strong>une seule fois</strong>. Si deux surfaces suppriment le même degré de liberté, le montage est hyperstatique : il n'est réalisable qu'avec des tolérances géométriques serrées, sinon le contact se fait sur une arête ou le serrage déforme les pièces. Avec \(I_s\) inconnues statiques de liaison et \(r_s\) le rang du système (méthode du chapitre « Chaînes de solides ») :
    <div class="formula">$$h = I_s - r_s$$</div>
  </div>
  <p><strong>Exemple.</strong> Un moyeu monté sur un centrage long (pivot glissant, 4 inconnues) <em>et</em> plaqué sur une large face d'épaulement (appui plan, 3 inconnues) : l'ensemble équivaut à une pivot (\(r_s = 5\)), donc \(h = 7 - 5 = 2\). Les deux conditions sont <strong>angulaires</strong> : l'orientation de la face d'appui par rapport à l'axe, autour des deux directions perpendiculaires à celui-ci. Pour monter sans contrainte, il faudrait des perpendicularités quasi parfaites à la fois sur le moyeu (face/alésage) et sur l'arbre (épaulement/axe). Remèdes : réduire la face d'appui (épaulement étroit, dégagement, chambrage) ou raccourcir le centrage pour que le plan devienne prépondérant.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un disque de longueur d'alésage 9 mm est monté sur un arbre de diamètre 36 mm, plaqué sur un large épaulement. Modèle de la mise en position ?</span>
    <div class="content"><p>\(L/D = 9/36 = 0{,}25\) : centrage court (linéaire annulaire, 2 ddl). La large face est un appui plan (3 ddl) : c'est la surface <strong>prépondérante</strong>. Total 5 ddl supprimés, isostatique ; il reste la rotation autour de l'axe, à supprimer par un obstacle (clavette, pion) ou à bloquer par adhérence.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MAINTIEN EN POSITION</div>
  <h2>Maintenir les surfaces en contact</h2>
  <div class="intro">La mise en position dit <em>où</em> est la pièce ; le maintien en position garantit qu'elle y <em>reste</em>, malgré les efforts, les vibrations et les dilatations. On utilise des éléments filetés, des éléments rapportés, ou des formes fixes (épaulements usinés).</div>

  <h3>Éléments filetés</h3>
  <ul>
    <li><strong>Vis d'assemblage</strong> (tête hexagonale H, cylindrique à six pans creux CHc, fraisée…) vissée dans une pièce taraudée.</li>
    <li><strong>Goujon</strong> : reste à demeure dans une pièce taraudée fragile (alliage léger, fonte) ou souvent démontée ; on serre un écrou sur l'autre extrémité.</li>
    <li><strong>Boulon</strong> (vis + écrou) : les deux pièces sont traversées.</li>
    <li><strong>Vis de pression</strong> (bout plat, pointu ou à téton) : immobilisation légère d'une pièce sur un arbre.</li>
  </ul>
  <div class="def-box">
    Une vis d'assemblage traverse un <strong>trou de passage</strong> plus grand que son diamètre : elle ne met pas en position, elle <strong>presse</strong> les surfaces de mise en position l'une contre l'autre. Elle travaille en <strong>traction</strong> ; les efforts parallèles au plan de joint sont repris par <strong>adhérence</strong> entre les surfaces serrées (ou par des pions), pas par cisaillement de la vis.
  </div>

  <h3>Classe de qualité et vérification d'une vis</h3>
  <div class="prop-box">
    Une vis de classe « a.b » (4.6, 8.8, 10.9, 12.9…) a une résistance à la rupture \(R_m = 100\,a\) MPa et une limite d'élasticité \(R_e = 10\,a\,b\) MPa. Exemple : classe 8.8 → \(R_m = 800\) MPa, \(R_e = 640\) MPa. (Culture technique : la classe est frappée sur la tête de la vis et ses valeurs sont fournies dans un sujet.)
  </div>
  <p>Avec \(F_v\) l'effort de traction dans une vis, \(A_s\) sa section résistante (tabulée ; environ 0,75 fois la section nominale \(\pi d^2/4\) en pas métrique gros) et \(s\) un coefficient de sécurité :</p>
  <div class="formula">$$\sigma = \frac{F_v}{A_s} \leq \frac{R_e}{s}$$</div>
  <p>Effort transversal transmissible par adhérence avec \(n\) vis précontraintes chacune à \(F_0\), \(n_f\) plans de frottement et un coefficient d'adhérence \(f\) :</p>
  <div class="formula">$$T_{max} = f\,n_f\,n\,F_0$$</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Une console est fixée par 4 vis M10 précontraintes à 15 kN, sur un seul plan de joint, avec \(f = 0{,}15\). Effort transversal admissible avant glissement ?</span>
    <div class="content"><p>\(T_{max} = 0{,}15 \times 1 \times 4 \times 15 = 9\) kN. Au-delà, les pièces glissent et les vis seraient cisaillées : on ajoute alors des pions ou une butée.</p></div>
  </div>

  <h3>Freinage (sécurité des éléments filetés)</h3>
  <ul>
    <li><strong>Par obstacle</strong> : écrou crénelé + goupille fendue, plaquette arrêtoir, rondelle frein à ailerons sous un écrou à encoches.</li>
    <li><strong>Par adhérence ou déformation</strong> : écrou autofreiné (bague polymère), contre-écrou, produit frein-filet (colle anaérobie).</li>
  </ul>

  <h3>Éléments rapportés et formes fixes</h3>
  <ul>
    <li><strong>Anneaux élastiques</strong> (circlips) d'arbre ou d'alésage : arrêt axial compact et bon marché, pour des efforts axiaux <em>modérés</em> ; la gorge affaiblit l'arbre (à placer hors des zones très sollicitées).</li>
    <li><strong>Écrou à encoches + rondelle frein</strong> : arrêt axial réglable et robuste (roulements).</li>
    <li><strong>Rondelle + vis en bout d'arbre</strong>, <strong>entretoise</strong> : serrer un moyeu contre un épaulement.</li>
    <li><strong>Épaulement usiné</strong> : arrêt fixe qui supporte de gros efforts axiaux.</li>
  </ul>
  <div class="notice"><strong>Piège classique.</strong> Pour qu'un élément de maintien serre réellement le moyeu, celui-ci doit <strong>dépasser</strong> de sa portée : si la rondelle de bout d'arbre vient en butée sur l'arbre avant de toucher le moyeu, celui-ci reste libre. De même, l'élément de maintien doit presser la pièce dans le prolongement de ses surfaces d'appui : décalé, il la ferait fléchir.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · TRANSMETTRE LES EFFORTS</div>
  <h2>Transmettre un couple : adhérence ou obstacle</h2>
  <div class="intro">Une poulie, une roue dentée ou un plateau d'accouplement doit transmettre un couple à son arbre. Deux principes s'opposent : l'<strong>adhérence</strong> (frottement entre surfaces pressées l'une contre l'autre) et l'<strong>obstacle</strong> (une forme s'oppose au mouvement relatif).</div>

  <h3>Par adhérence</h3>
  <p><strong>Serrage axial de faces planes</strong> (plateaux, disques) : effort presseur \(N\), \(n_f\) surfaces frottantes, rayon moyen de la couronne de contact \(R_{moy}\) :</p>
  <div class="formula">$$C_{max} = n_f\,f\,N\,R_{moy}$$</div>
  <p><strong>Frettage</strong> (ajustement serré, montage à la presse ou par dilatation thermique) : la pression de contact \(p\) agit sur la portée de diamètre \(D\) et de longueur \(L\). L'effort tangentiel limite vaut \(f\,p\,\pi D L\), d'où :</p>
  <div class="formula">$$C_{max} = \frac{\pi}{2}\,f\,p\,D^2 L \qquad F_{a,max} = f\,p\,\pi D L$$</div>
  <p>Couple et effort axial se partagent cette capacité : \(\sqrt{(2C/D)^2 + F_a^2} \leq f\,p\,\pi D L\).</p>
  <p><strong>Cône</strong> de demi-angle \(\alpha\) serré par un effort axial \(F_a\) : la résultante normale est amplifiée (en négligeant le frottement pendant le serrage) :</p>
  <div class="formula">$$N \approx \frac{F_a}{\sin\alpha} \quad\Longrightarrow\quad C_{max} \approx \frac{f\,F_a\,R_{moy}}{\sin\alpha}$$</div>
  <p>En tenant compte du frottement pendant l'enfoncement, \(N = F_a/(\sin\alpha + f\cos\alpha)\). Si \(\tan\alpha \lesssim f\), le cône est <strong>autobloquant</strong> : il tient sans écrou (cône Morse des outils), mais il faut un chasse-cône pour le démonter.</p>
  <div class="prop-box">
    <strong>Adhérence : atouts et limites.</strong> Pas de rainure (pas de concentration de contraintes), pas de jeu, position angulaire quelconque, glissement en cas de surcharge (fonction limiteur de couple). En contrepartie, la capacité dépend de \(f\), mal connu (0,1 à 0,2 acier sur acier à sec), et le serrage doit être maîtrisé.
  </div>

  <h3>Par obstacle</h3>
  <ul>
    <li><strong>Clavette parallèle</strong> (forme A à bouts ronds, forme B à bouts droits), logée dans deux rainures ; <strong>clavette disque</strong> pour petits arbres.</li>
    <li><strong>Cannelures</strong> : couples élevés, centrage, et possibilité de coulissement (la liaison devient une glissière).</li>
    <li><strong>Goupille transversale</strong>, <strong>méplat + vis de pression</strong> : petits couples.</li>
  </ul>

  <h3>Dimensionnement simple</h3>
  <p><strong>Clavette parallèle</strong> (section \(b \times h\), longueur utile \(\ell\), arbre de diamètre \(d\)) : l'effort tangentiel au rayon \(d/2\) vaut \(F = 2C/d\).</p>
  <div class="formula">$$p = \frac{F}{\ell\,h/2} = \frac{4C}{d\,h\,\ell} \leq p_{adm}$$</div>
  <div class="formula">$$\tau = \frac{F}{b\,\ell} = \frac{2C}{d\,b\,\ell} \leq \tau_{adm}$$</div>
  <p>Ordres de grandeur de \(p_{adm}\) : 20 à 40 MPa pour un moyeu coulissant ou avec chocs, 60 à 100 MPa pour un montage fixe en acier sans chocs. Le <strong>matage</strong> est presque toujours dimensionnant. La section \(b \times h\) est imposée par le diamètre de l'arbre (normalisation) ; on calcule donc \(\ell\), qui reste en pratique inférieure à environ \(1{,}5\,d\). Pour une clavette de forme A, la longueur utile est la longueur totale moins \(b\).</p>
  <p><strong>Goupille transversale</strong> (diamètre \(d_g\)) : elle est cisaillée en deux sections, situées à la surface de l'arbre, de part et d'autre : \(C = 2\,T\,\dfrac{d}{2}\) donc \(T = C/d\) par section :</p>
  <div class="formula">$$\tau = \frac{4\,C}{\pi\,d_g^2\,d} \leq \tau_{adm}$$</div>
  <p><strong>Cannelures</strong> : \(n\) flancs portants de hauteur \(h'\), longueur \(\ell\), rayon moyen \(R_{moy}\), avec un coefficient de portée \(k \approx 0{,}75\) (tous les flancs ne portent pas également) :</p>
  <div class="formula">$$C_{max} = k\,n\,h'\,\ell\,R_{moy}\,p_{adm}$$</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Clavette 6 × 6 sur un arbre de 22 mm, longueur utile 25 mm, \(p_{adm} = 50\) MPa. Couple transmissible ?</span>
    <div class="content"><p>Du matage \(p = 4C/(d\,h\,\ell) \leq p_{adm}\), on tire \(C = p_{adm}\,d\,h\,\ell/4\), avec \(d\,h\,\ell = 3{,}3\cdot 10^{-6}\ \text{m}^3\) (produit 0,022 × 0,006 × 0,025) :</p><div class="formula">$$C = \frac{50\cdot 10^6 \times 3{,}3\cdot 10^{-6}}{4} \approx 41\ \text{N·m}$$</div></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · GUIDAGE EN ROTATION PAR GLISSEMENT</div>
  <h2>Contact direct et paliers lisses</h2>
  <div class="intro">Guider en rotation, c'est réaliser une pivot : supprimer cinq degrés de liberté tout en laissant la rotation, avec un jeu et un frottement maîtrisés. Trois familles de solutions : le glissement direct, le glissement sur un coussinet interposé, le roulement.</div>

  <h3>Architecture : paliers et arrêts axiaux</h3>
  <p>Un guidage comporte en général <strong>deux paliers</strong> écartés (pour reprendre les moments) et des <strong>arrêts axiaux</strong> (épaulements fixes ou rapportés). Selon leur longueur, les paliers se modélisent par des linéaires annulaires (paliers courts) ou par un pivot glissant (palier long). Montages isostatiques types : un palier long + deux arrêts axiaux, ou deux paliers courts + un arrêt axial dans chaque sens. Un troisième palier, parfois justifié pour un arbre très long ou très chargé, rend le montage hyperstatique : l'alignement des trois portées doit alors être garanti. On distingue le montage <strong>en chape</strong> (la charge entre les paliers) et le montage <strong>en porte-à-faux</strong> (la charge au-delà d'un palier, qui est alors le plus chargé).</p>

  <h3>Contact direct</h3>
  <p>L'arbre tourne directement dans un alésage du bâti (ajustement glissant, type H7/f7). Solution simple, compacte et bon marché, mais l'usure porte sur le bâti lui-même, non remplaçable : on la réserve aux faibles vitesses et charges, aux mouvements occasionnels (articulations, charnières, axes de leviers), avec des couples de matériaux compatibles et une lubrification à la graisse.</p>

  <h3>Paliers lisses (coussinets)</h3>
  <div class="def-box">
    Un <strong>coussinet</strong> est une bague rapportée entre l'arbre et son logement. Son matériau, de dureté nettement différente de celle de l'arbre et choisi pour bien frotter sur lui, s'use à sa place : on le change à la maintenance sans retoucher les pièces coûteuses. Pour que le glissement ait lieu sur l'arbre et non dans le logement, il est <strong>emmanché avec serrage</strong> dans l'alésage et monté <strong>avec jeu</strong> sur l'arbre. Formes : bague cylindrique, bague à collerette (qui reprend aussi un effort axial), rondelle de butée.
  </div>
  <ul>
    <li><strong>Bronze fritté autolubrifiant</strong> : métal poreux (environ 20 à 30 % de vides) imprégné d'huile, qui suinte lorsque le palier chauffe et revient dans les pores à l'arrêt. Vitesses assez élevées, charges moyennes.</li>
    <li><strong>Composites multicouches</strong> : dos en acier (tenue, montage serré), couche de bronze poreux imprégnée de PTFE et de charges. Fonctionnent à sec, fortes pressions, faible épaisseur radiale.</li>
    <li><strong>Polymères techniques</strong> (PA, POM, PTFE chargé…) : légers, silencieux, insensibles à la corrosion, sans entretien ; faibles pressions et vitesses, fluage et dilatation importants (jeu plus grand à prévoir).</li>
  </ul>

  <h3>Dimensionnement : \(p\), \(V\) et \(pV\)</h3>
  <p>Avec \(F_r\) la charge radiale sur le palier, \(D\) et \(L\) son diamètre et sa longueur : pression diamétrale (charge rapportée à la surface projetée) et vitesse de glissement :</p>
  <div class="formula">$$p = \frac{F_r}{D\,L} \leq p_{adm} \qquad V = \omega\,\frac{D}{2} \leq V_{adm}$$</div>
  <div class="formula">$$p\,V \leq (pV)_{adm}$$</div>
  <div class="prop-box">
    <strong>Pourquoi le produit \(pV\) ?</strong> La puissance dissipée par frottement vaut \(P_f = f\,F_r\,V\). Rapportée à la surface projetée \(D L\), elle vaut \(f\,p\,V\) : c'est elle qui fixe l'échauffement et la vitesse d'usure. Le critère \(pV\) limite donc la température de fonctionnement ; \(p_{adm}\) protège du matage et du fluage, \(V_{adm}\) de l'échauffement local. Remarque utile : \(pV = \dfrac{F_r\,\omega}{2L}\) ne dépend pas du diamètre — pour l'abaisser, on allonge le palier ou on change de matériau.
  </div>
  <p>Ordres de grandeur indicatifs (catalogues) : bronze fritté — \(p_{adm}\) de l'ordre de 10 MPa, \(V_{adm}\) de quelques m/s, \((pV)_{adm}\) de 1 à 2 MPa·m/s ; composite à sec — \(p_{adm}\) pouvant dépasser 100 MPa en charge dynamique, \(V_{adm}\) d'environ 2 m/s, \((pV)_{adm}\) de 1 à 2 MPa·m/s ; polymère — \(p_{adm}\) d'environ 10 MPa, \(V_{adm}\) inférieure à 1 m/s, \((pV)_{adm}\) de 0,05 à 0,2 MPa·m/s. Rapport usuel \(L/D\) entre 0,5 et 1,5 ; jeu diamétral de l'ordre du millième du diamètre (davantage pour les polymères).</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Coussinet \(D = 20\) mm, \(L = 16\) mm, \(F_r = 800\) N, 600 tr/min. Calculer \(p\), \(V\) et \(pV\).</span>
    <div class="content"><p>\(p = 800/(20 \times 16) = 2{,}5\) MPa ; \(\omega = 600 \times 2\pi/60 \approx 62{,}8\) rad/s, \(V = 62{,}8 \times 0{,}010 \approx 0{,}63\) m/s ; \(pV \approx 1{,}6\) MPa·m/s. Un bronze fritté convient de justesse ; un polymère est exclu.</p></div>
  </div>

<div class="course-section">
  <div class="sec-num">§6 · ROULEMENTS</div>
  <h2>Familles, représentation et montage isostatique</h2>
  <div class="intro">Remplacer le glissement par du roulement divise le frottement par 10 à 50 et autorise de fortes vitesses et charges, avec une durée de vie calculable. Le roulement est un composant standard : on le <strong>choisit</strong> sur catalogue, mais on <strong>conçoit</strong> son montage (ajustements, arrêts, réglage, protection).</div>

  <h3>Constitution</h3>
  <p>Une <strong>bague intérieure</strong> (BI) et une <strong>bague extérieure</strong> (BE) portant les chemins de roulement, des <strong>éléments roulants</strong> (billes, rouleaux cylindriques, coniques ou sphériques, aiguilles) et une <strong>cage</strong> qui les maintient écartés. Options : flasques (non frottants) ou joints frottants intégrés, avec graissage à vie.</p>

  <h3>Familles et domaines d'emploi</h3>

  <p><strong>Représentations.</strong> Sur un dessin d'ensemble, le roulement est dessiné en coupe de façon réaliste ou simplifiée : dans la représentation simplifiée générale, son encombrement est un rectangle portant une croix droite, quel que soit le type ; une représentation plus détaillée précise la nature du contact (un trait incliné, parallèle à la ligne de charge, pour un contact oblique). Sur un schéma, on le remplace par sa liaison modèle.</p>

  <h3>Modèle cinématique et montage « fixe + libre »</h3>
  <div class="def-box">
    Grâce à son petit jeu interne, un roulement rigide à billes autorise un léger rotulage : on le modélise par une <strong>rotule</strong> s'il est arrêté axialement dans les deux sens (sur ses deux bagues), par une <strong>linéaire annulaire</strong> si l'une de ses bagues peut coulisser axialement.
  </div>
  <div class="prop-box">
    <strong>Montage isostatique de référence.</strong> Un roulement <strong>fixe</strong> (arrêté dans les deux sens sur ses deux bagues) + un roulement <strong>libre</strong> (une bague libre axialement) : rotule + linéaire annulaire = pivot, \(h = 0\). L'arbre peut se dilater sans charger axialement les roulements. On prend en général comme roulement fixe celui qui est le moins chargé radialement (il reprend seul tout l'effort axial), ou celui qui est proche de l'organe dont la position axiale importe (engrenage).
  </div>
  <p><strong>Montage à arrêts croisés</strong> (dit économique) : chaque roulement arrête l'arbre dans un seul sens, avec un petit jeu axial. Simple, réservé aux arbres courts où la dilatation et la précision axiale importent peu.</p>

  <h3>Ajustement des bagues : la règle de la charge tournante</h3>
  <div class="prop-box">
    La bague qui <strong>tourne par rapport à la direction de la charge</strong> est montée <strong>serrée</strong>. Montée avec jeu, elle roulerait lentement sur sa portée (laminage, cheminement) : usure, échauffement, corrosion de contact. La bague fixe par rapport à la charge peut être montée <strong>glissante</strong> (ou avec un ajustement incertain) : montage, démontage et réglage facilités, coulissement possible pour le roulement libre.
  </div>
  <div style="overflow-x:auto;margin:.4rem 0"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Situation</th><th style="padding:.35rem;border:1px solid var(--grid)">Bague serrée</th><th style="padding:.35rem;border:1px solid var(--grid)">Bague glissante</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">arbre tournant, charge de direction fixe (poulie, engrenage)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">BI</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">BE</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">moyeu tournant sur axe fixe, charge fixe (galet, roue folle, roue de remorque)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">BE</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">BI</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">arbre tournant avec une charge qui tourne avec lui (balourd)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">BE</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">BI</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">direction de charge variable ou indéterminée</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">les deux</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">—</td></tr>
  </table></div>
  <p>Ajustements usuels (exemples, non exigibles) : arbre en k5 ou m6 pour une BI serrée, en g6 ou h6 pour une BI glissante ; logement en N7 ou M7 pour une BE serrée, en H7 pour une BE glissante.</p>

  <h3>Arrêts axiaux</h3>
  <ul>
    <li><strong>Bague serrée</strong> : arrêtée des deux côtés (épaulement + anneau élastique, écrou à encoches ou entretoise) ; dans un montage en X ou en O, l'épaulement côté charge suffit.</li>
    <li><strong>Bague glissante du roulement fixe</strong> : arrêtée des deux côtés (épaulement + couvercle ou anneau).</li>
    <li><strong>Bague glissante du roulement libre</strong> : aucun arrêt, avec un jeu axial de part et d'autre.</li>
  </ul>
  <div class="notice"><strong>Montabilité.</strong> On emmanche un roulement par la bague serrée, sans jamais faire passer l'effort de montage par les éléments roulants. Les épaulements doivent être moins hauts que la bague (pour pouvoir l'extraire), avec un congé plus petit que le chanfrein de la bague.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CONTACT OBLIQUE</div>
  <h2>Montages en X et en O, réglage</h2>
  <div class="intro">Les roulements à billes à contact oblique et les roulements à rouleaux coniques reprennent des charges radiales et axiales combinées, mais l'effort axial dans <strong>un seul sens</strong>. On les monte donc toujours <strong>par paires opposées</strong> ; c'est la disposition de la paire qui fixe la rigidité du guidage et la façon de le régler.</div>

  <div class="def-box">
    Dans un roulement à contact oblique, l'effort passe d'une bague à l'autre le long d'une <strong>ligne de charge</strong> inclinée d'un angle \(\alpha\) sur le plan radial. Cette ligne coupe l'axe au <strong>centre de poussée</strong>, décalé par rapport au milieu du roulement : c'est en ce point qu'on place la réaction du palier dans les calculs. Une charge radiale y crée aussi une composante axiale induite, reprise par le roulement opposé.
  </div>

  <h3>Montage en X</h3>
  <p>Les lignes de charge convergent : les centres de poussée sont <strong>entre</strong> les roulements, la base effective est plus courte que l'entraxe. Le réglage se fait sur les <strong>bagues extérieures</strong> (couvercles et cales pelables), qui sont les bagues glissantes quand l'arbre tourne sous une charge de direction fixe : c'est la disposition naturelle d'un arbre tournant dont les paliers encadrent la charge. Elle tolère mieux les défauts d'alignement, mais un arbre plus chaud que le carter augmente la précharge.</p>
  <h3>Montage en O</h3>
  <p>Les lignes de charge divergent : les centres de poussée sont <strong>à l'extérieur</strong> des roulements, la base effective est allongée, d'où une grande <strong>rigidité au basculement</strong> : on le préfère pour une charge en <strong>porte-à-faux</strong> (pignon conique, broche, roue). Le réglage se fait sur les <strong>bagues intérieures</strong> (écrou à encoches et rondelle frein), disposition naturelle quand le moyeu tourne autour d'un axe fixe (BE serrées, BI glissantes).</p>

  <div class="prop-box">
    <strong>Jeu ou précharge.</strong> La paire se règle au montage : avec un léger <strong>jeu</strong> (frottement faible, peu sensible aux dilatations) ou avec une <strong>précharge</strong> (jeu négatif : rigidité et précision accrues, pas de choc lors d'une inversion d'effort, mais échauffement et durée de vie réduite si elle est excessive). Moyens : cales pelables, écrou à encoches, entretoises rectifiées.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Deux roulements coniques ont un entraxe de 60 mm ; chaque centre de poussée est décalé de 15 mm par rapport au milieu de son roulement. Base effective en X et en O ?</span>
    <div class="content"><p>En O : \(60 + 2 \times 15 = 90\) mm ; en X : \(60 - 2 \times 15 = 30\) mm. Pour un même moment à reprendre, les réactions radiales (de l'ordre de \(M/b\)) sont trois fois plus faibles en O.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DURÉE DE VIE, LUBRIFICATION, ÉTANCHÉITÉ</div>
  <h2>Faire durer un guidage par roulements</h2>
  <div class="intro">Même bien monté et bien lubrifié, un roulement finit par s'écailler par fatigue des surfaces de contact. Cette défaillance est aléatoire : la durée de vie se définit de façon <strong>statistique</strong>. Lubrification et étanchéité conditionnent le fait d'atteindre cette durée.</div>

  <div class="def-box">
    <strong>Durée de vie nominale</strong> \(L_{10}\) : nombre de tours (en millions) atteint ou dépassé par 90 % d'un grand lot de roulements identiques, dans les mêmes conditions (10 % de défaillances). <strong>Charge dynamique de base</strong> \(C\) (catalogue) : charge constante pour laquelle \(L_{10} = 1\) million de tours.
  </div>
  <div class="formula">$$L_{10} = \left(\frac{C}{P}\right)^{n}$$</div>
  <p>en millions de tours, avec \(n = 3\) pour des billes (contact ponctuel) et \(n = 10/3\) pour des rouleaux (contact linéique). Avec \(N\) en tr/min, la durée en heures vaut :</p>
  <div class="formula">$$L_{10h} = \frac{10^6\,L_{10}}{60\,N}$$</div>

  <h3>Charge dynamique équivalente</h3>
  <div class="formula">$$P = X\,F_r + Y\,F_a$$</div>
  <p>\(X\) et \(Y\) sont donnés par le catalogue selon que \(F_a/F_r\) est inférieur ou supérieur à un seuil \(e\). Pour un rigide à billes, \(P = F_r\) si \(F_a/F_r \leq e\). Pour des rouleaux cylindriques ou des aiguilles, \(P = F_r\) ; pour une butée, \(P = F_a\). Pour une paire à contact oblique, on calcule d'abord les réactions radiales aux <strong>centres de poussée</strong>, puis les efforts axiaux (charges induites comprises).</p>
  <div class="prop-box">
    <strong>Conséquences.</strong> Doubler la charge divise la durée de vie par \(2^3 = 8\) (billes) ou environ 10 (rouleaux). Pour un palier à deux roulements, la probabilité que les deux atteignent leur \(L_{10}\) n'est que \(0{,}9^2 = 0{,}81\). À l'arrêt ou à très basse vitesse, on vérifie plutôt la <strong>charge statique de base</strong> \(C_0\) (déformation permanente des pistes) ; on vérifie aussi la <strong>vitesse limite</strong>, qui dépend du lubrifiant.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Rigide à billes, \(C = 30\) kN, \(P = 3\) kN, 1 000 tr/min. Durée de vie en heures ?</span>
    <div class="content"><p>\(L_{10} = 10^3 = 1\,000\) millions de tours ; \(L_{10h} = \dfrac{10^9}{60 \times 1\,000} \approx 16\,700\) h.</p></div>
  </div>

  <h3>Lubrification</h3>
  <p>À sec, le contact métal sur métal entre billes (ou rouleaux) et pistes s'userait vite, jusqu'au grippage. Un film d'huile ou de graisse, même très mince, sépare ces surfaces et les protège de la rouille ; l'huile, en circulant, emporte en plus la chaleur produite.</p>
  <ul>
    <li><strong>Graisse</strong> : facile à retenir, participe à l'étanchéité, peu d'entretien (roulements graissés à vie) ; vitesses modérées.</li>
    <li><strong>Huile</strong> : vitesses élevées, refroidissement ; par barbotage (réducteurs), circulation ou brouillard ; carter étanche, bouchons de remplissage, de niveau et de vidange.</li>
  </ul>

  <h3>Étanchéité</h3>
  <ul>
    <li><strong>Statique</strong> (pas de mouvement relatif) : joint plat, <strong>joint torique</strong> comprimé dans une gorge (écrasement de l'ordre de 15 à 30 %), pâte d'étanchéité. Chaque plan de joint du carter est concerné : brides, couvercles, bouchons.</li>
    <li><strong>Dynamique en rotation, avec contact</strong> : <strong>joint à lèvre</strong> (bague d'étanchéité radiale) — lèvre en élastomère plaquée par un ressort sur une portée d'arbre dure et rectifiée, orientée vers le fluide à retenir, souvent doublée d'une lèvre anti-poussière ; joints frottants intégrés aux roulements.</li>
    <li><strong>Dynamique sans contact</strong> : chicanes, labyrinthes, flasques — pas d'usure ni de frottement, adaptés aux grandes vitesses, mais étanchéité imparfaite (graisse, poussières grossières).</li>
    <li><strong>Dynamique en translation</strong> : joints de tige et de piston, racleurs ; soufflets pour protéger les grandes courses.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§9 · GUIDAGE EN TRANSLATION</div>
  <h2>Réaliser une glissière</h2>
  <div class="intro">Une glissière supprime cinq degrés de liberté et laisse une translation. Elle doit transmettre les efforts transverses et les trois moments (dont le couple autour de sa direction), souvent sur une grande course, avec une rectitude et un frottement maîtrisés — et sans se coincer.</div>

  <h3>Contact direct</h3>
  <ul>
    <li><strong>Glissière prismatique</strong> (queue d'aronde, vé + plan, section rectangulaire) : reprend naturellement le couple autour de la direction de translation ; le jeu se règle par une réglette (lardon) poussée par des vis. Machines-outils.</li>
    <li><strong>Glissière cylindrique</strong> : centrage long (pivot glissant) + arrêt en rotation (clavette, rainure et vis à téton, méplat, cannelures), ou deux colonnes parallèles (solution hyperstatique : parallélisme à garantir, ou un des guidages réduit à un appui).</li>
    <li>Montage <strong>maintenu</strong> (tenu dans les deux sens) ou <strong>non maintenu</strong> (contact assuré par le poids ou un ressort : liaison unilatérale).</li>
  </ul>
  <h3>Interposition d'éléments frottants</h3>
  <p>Patins, bagues ou rubans en PTFE chargé, bronze ou polymère, fixés sur la pièce mobile ; bagues d'usure des tiges de vérin. L'usure est reportée sur des pièces remplaçables ; \(f\) de l'ordre de 0,05 à 0,15.</p>
  <h3>Éléments roulants</h3>
  <p><strong>Douilles à billes</strong> à recirculation sur arbres trempés et rectifiés ; <strong>rails profilés et chariots</strong> à recirculation de billes ou de rouleaux (rigides, précis, préchargeables, course quasi illimitée) ; <strong>glissières à billes, à aiguilles ou à rouleaux croisés</strong> avec cage (course limitée, très grande précision) ; galets. Frottement très faible (\(f \approx 0{,}002\) à \(0{,}005\)), mais coût plus élevé et sensibilité aux chocs et aux polluants (racleurs, soufflets).</p>

  <h3>Arc-boutement</h3>
  <p>Un coulisseau de longueur de guidage \(L\) est poussé par un effort \(\vec{F}\) parallèle à la glissière mais <strong>décalé</strong> d'une distance \(d\) de son axe. Le moment \(F d\) le fait basculer dans son jeu : il touche le guide en deux points opposés \(A\) et \(B\), aux deux extrémités.</p>

<figcaption>Effort \(F\) décalé de \(d\) : le coulisseau bascule dans son jeu et s'appuie en \(A\) (dessous, à l'arrière) et en \(B\) (dessus, à l'avant). En chacun de ces points s'exercent une action normale \(N\) et un frottement \(fN\) opposé au mouvement.</figcaption>
</figure>

  <p>En régime établi (vitesse constante, inertie négligée), avec un coefficient de frottement \(f\) et une charge résistante \(Q\) appliquée sur l'axe :</p>
  <ul>
    <li>résultante transversale : les deux actions normales sont égales, \(N_A = N_B = N\) ;</li>
    <li>moment au point de l'axe situé au droit de \(A\) : \(Q\) et l'action normale en \(A\) n'y ont pas de moment, ceux des deux frottements (égaux, opposés, de part et d'autre de l'axe) se compensent ; il reste \(N\,L = F\,d\) ;</li>
    <li>résultante axiale : \(F = Q + 2\,f\,N = Q + 2 f \dfrac{d}{L}\,F\).</li>
  </ul>
  <div class="formula">$$F = \frac{Q}{1 - \dfrac{2 f d}{L}}$$</div>
  <p>L'effort nécessaire reste fini et positif si et seulement si le dénominateur est positif :</p>
  <div class="formula">$$\text{pas d'arc-boutement} \iff L > 2\,f\,d$$</div>
  <div class="prop-box">
    Si \(L \leq 2 f d\), aucun effort moteur, aussi grand soit-il, ne fait avancer le coulisseau : il est <strong>arc-bouté</strong>. L'épaisseur du guidage n'intervient pas. Remèdes : allonger le guidage, rapprocher l'effort de l'axe (idéalement, effort dans l'axe), réduire \(f\) (lubrification, éléments roulants). L'arc-boutement est parfois recherché : serre-joint, butée autobloquante.
  </div>
  <div class="notice"><strong>Avant même l'arc-boutement</strong>, l'effort nécessaire explose quand \(L\) s'approche de \(2fd\) : avec \(2fd/L = 0{,}8\), il faut \(F = 5\,Q\). Viser \(L\) nettement supérieur à \(2fd\).</div>
</div>

</template>
<template class="pan-tpl" data-panneau="cpl-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CONCEPTION DES LIAISONS</div>
  <h2>Savoir-faire pour l'écrit et l'oral</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : lire un plan, écrire le besoin d'une liaison, puis concevoir et dimensionner assemblages (§2 à §4), guidages en rotation (§5 à §8) et guidages en translation (§9).</div>

  <div class="method-box">
    <strong>Méthode 1 — Lire un plan d'ensemble</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Situer.</span> Lire la nomenclature et la mise en situation : quelle pièce reçoit la puissance, laquelle la restitue, quel est le bâti ?</li>
      <li><span class="step">Classes d'équivalence.</span> Regrouper (mentalement ou en coloriant) les pièces sans mouvement relatif : les vis, rondelles, anneaux et clavettes appartiennent à la classe des pièces qu'ils assemblent.</li>
      <li><span class="step">Surfaces fonctionnelles.</span> Repérer les contacts entre classes, leurs proportions (\(L/D\), largeur/longueur) et les jeux dessinés (un trait double signale un jeu, un trait unique un contact).</li>
      <li><span class="step">Liaison par liaison.</span> Pour un assemblage : mise en position, maintien, transmission des efforts. Pour un guidage : paliers, arrêts axiaux, ajustements, lubrification, étanchéité.</li>
      <li><span class="step">Rédiger.</span> Une phrase par fonction, en citant les repères : « La mise en position de la poulie 6 sur l'arbre 1 est assurée par un centrage long et l'épaulement de 1 ; le couple est transmis par obstacle (clavette 7) ; le maintien est assuré par la vis 9 et la rondelle 8. »</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Écrire le besoin d'une liaison et choisir ses ajustements (§1)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Fonction technique.</span> Assembler (encastrement démontable), guider en rotation (pivot) ou guider en translation (glissière).</li>
      <li><span class="step">Torseur transmissible.</span> L'écrire dans la base locale : les composantes nulles traduisent les mobilités laissées (moment autour de l'axe d'une pivot, résultante selon la direction d'une glissière) ; noter intensités, sens, chocs et inversions.</li>
      <li><span class="step">Critères chiffrés.</span> Puissance, vitesse et effort ; durée de vie ; encombrement ; puis environnement, montage, coût.</li>
      <li><span class="step">Nature des ajustements.</span> Sur les cotes limites : jeu maximal = alésage maxi − arbre mini, serrage maximal = arbre maxi − alésage mini. Toujours du jeu : avec jeu (glissant) ; toujours du serrage : serré ; les deux possibles : incertain.</li>
      <li><span class="step">Choisir.</span> Glissant pour un palier ou un centrage souvent démonté ; incertain pour un centrage précis rarement démonté ; serré pour une pièce (bague, coussinet) qui ne doit pas tourner dans son logement.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Exemple éclair :</em> alésage entre 30,000 et 30,021 mm, arbre entre 29,980 et 29,993 mm. Jeu minimal \(30{,}000 - 29{,}993 = 0{,}007\) mm, jeu maximal \(30{,}021 - 29{,}980 = 0{,}041\) mm : il y a toujours du jeu, l'ajustement est glissant (palier, centrage démontable).</p>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> calculer un « serrage » avec l'arbre mini ; donner une désignation normalisée (H7/g6…) comme réponse exigée : seule la nature de l'ajustement l'est.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Analyser ou concevoir une mise en position (§2)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Nature des efforts.</span> Effort surtout normal à une face → appui plan prépondérant ; couple à transmettre ou coaxialité à garantir → centrage long ou cône prépondérant.</li>
      <li><span class="step">Modéliser chaque contact.</span> Utiliser les proportions : \(L/D \lesssim 0{,}8\) centrage court (2 ddl), \(L/D \gtrsim 1{,}5\) centrage long (4 ddl), plan large (3), plan étroit (2), petite surface (1).</li>
      <li><span class="step">Additionner sans doublon.</span> Vérifier que chaque ddl n'est supprimé qu'une fois ; sinon calculer \(h = I_s - r_s\) et proposer un remède (dégagement, chambrage, centrage raccourci).</li>
      <li><span class="step">Compléter.</span> Supprimer la mobilité restante si nécessaire (pion, clavette, ergot) et choisir le maintien (vis, écrou, anneau élastique) placé en face des appuis.</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> une vis dans un trou de passage ne met pas en position ; un centrage long + une large face d'appui sont hyperstatiques (\(h = 2\)) ; un moyeu qui ne dépasse pas de sa portée n'est pas serré par la rondelle de bout d'arbre.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Vérifier un assemblage vissé (§3)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Rôle des vis.</span> Elles maintiennent en position (traction) ; la mise en position est assurée par les surfaces de contact, les efforts parallèles au plan de joint par adhérence ou par des pions.</li>
      <li><span class="step">Traction.</span> Répartir l'effort extérieur entre les vis (\(F_v\) par vis), ajouter la précharge si l'on vérifie le cas le plus défavorable, puis \(\sigma = F_v/A_s \leq R_e/s\), avec \(R_e = 10\,a\,b\) MPa pour la classe « a.b » et \(A_s\) tabulée.</li>
      <li><span class="step">Glissement.</span> Effort transversal admissible \(T_{max} = f\,n_f\,n\,F_0\) ; s'il est insuffisant : plus de précharge, plus de vis, ou des pions (obstacle).</li>
      <li><span class="step">Sécurité.</span> Sous vibrations, choisir un freinage (par obstacle ou par adhérence) ; vérifier l'accès à la clé et l'ordre de montage.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Exemple éclair :</em> 4 vis M8 de classe 8.8 (\(A_s = 36{,}6\ \text{mm}^2\)) précontraintes à 12 kN, un plan de joint, \(f = 0{,}15\). Contrainte de précharge \(12\,000/36{,}6 \approx 328\) MPa, sous \(0{,}7 \times 640 = 448\) MPa ; effort transversal admissible \(0{,}15 \times 1 \times 4 \times 12 = 7{,}2\) kN.</p>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> faire travailler une vis au cisaillement ; oublier \(n_f\) (deux plans de frottement dans une chape) ; prendre la section nominale au lieu de la section résistante.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Dimensionner la transmission d'un couple (§4)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Couple de calcul.</span> \(C = P/\omega\), multiplié par un coefficient de service si démarrages ou chocs.</li>
      <li><span class="step">Clavette.</span> Section \(b \times h\) imposée par \(d\) ; longueur utile par le matage : \(\ell \geq \dfrac{4C}{d\,h\,p_{adm}}\) ; vérifier le cisaillement \(\tau = \dfrac{2C}{d\,b\,\ell}\). Si \(\ell \gt 1{,}5\,d\) : cannelures ou deux clavettes.</li>
      <li><span class="step">Goupille.</span> Double cisaillement : \(d_g \geq \sqrt{\dfrac{4C}{\pi\,d\,\tau_{adm}}}\) ; vérifier que le perçage n'affaiblit pas trop l'arbre.</li>
      <li><span class="step">Frettage ou cône.</span> Pression nécessaire \(p = \dfrac{2C}{\pi f D^2 L}\) (frettage) ; effort axial \(F_a \approx \dfrac{C \sin\alpha}{f\,R_{moy}}\) (cône, frottement de serrage négligé ; avec ce frottement, \(F_a = \dfrac{C\,(\sin\alpha + f\cos\alpha)}{f\,R_{moy}}\), nettement plus grand).</li>
      <li><span class="step">Conclure.</span> Comparer encombrement, démontabilité, sensibilité aux chocs et affaiblissement de l'arbre.</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> oublier le facteur 2 de \(F = 2C/d\) ; prendre la hauteur totale \(h\) au lieu de \(h/2\) pour le matage ; compter la longueur totale d'une clavette de forme A au lieu de sa longueur utile.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Choisir et vérifier un palier lisse (§5)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Charges.</span> Calculer la charge radiale sur chaque palier (statique du solide, en tenant compte du porte-à-faux).</li>
      <li><span class="step">Trois critères.</span> \(p = F_r/(DL)\), \(V = \omega D/2\), puis \(pV\) ; comparer aux valeurs admissibles de chaque matériau.</li>
      <li><span class="step">Leviers.</span> Si \(pV\) est trop grand : allonger \(L\) (dans la limite \(L/D \lesssim 1{,}5\)), changer de matériau, lubrifier. Augmenter \(D\) diminue \(p\) mais pas \(pV\).</li>
      <li><span class="step">Montage.</span> Coussinet serré dans le logement, glissant sur un arbre dur et bien poli ; collerette ou rondelle de butée pour les efforts axiaux.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Concevoir un guidage par roulements (§6, §7)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Charges et vitesse.</span> Nature (radiale, axiale, combinée), intensité, vitesse, position de la charge (chape ou porte-à-faux).</li>
      <li><span class="step">Type et disposition.</span> Charges modérées : rigides à billes en « fixe + libre ». Forte charge radiale : rouleaux cylindriques au palier libre. Charges combinées, rigidité, porte-à-faux : paire à contact oblique en O (en X si la charge est entre les paliers).</li>
      <li><span class="step">Ajustements.</span> Bague tournante par rapport à la charge → serrée ; l'autre → glissante.</li>
      <li><span class="step">Arrêts axiaux.</span> Bague serrée : deux côtés ; bague glissante du fixe : deux côtés ; bague glissante du libre : aucun. En X/O : un seul côté par bague ; réglage sur les BE en X, sur les BI en O (idéalement les bagues glissantes, sinon des bagues montées avec un serrage léger).</li>
      <li><span class="step">Environnement.</span> Lubrifiant (graisse ou huile), étanchéité statique et dynamique, ordre de montage, réglage.</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> bloquer les deux roulements dans les deux sens (hyperstatique, dilatation empêchée) ; oublier qu'un balourd fait tourner la charge avec l'arbre ; faire passer l'effort d'emmanchement par les billes.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Vérifier une durée de vie (§8)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Réactions.</span> Calculer les efforts sur chaque roulement (aux centres de poussée pour un contact oblique).</li>
      <li><span class="step">Charge équivalente.</span> \(P = X F_r + Y F_a\), en comparant \(F_a/F_r\) au seuil \(e\) du catalogue.</li>
      <li><span class="step">Durée.</span> \(L_{10} = (C/P)^n\) en millions de tours, puis \(L_{10h} = 10^6 L_{10}/(60 N)\).</li>
      <li><span class="step">Choix.</span> À l'inverse, \(C_{min} = P\,\left(\dfrac{60\,N\,L_{10h}}{10^6}\right)^{1/n}\), puis prendre le roulement de catalogue juste supérieur.</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> confondre tours et millions de tours, minutes et heures ; utiliser \(n = 3\) pour des rouleaux ; oublier que la durée d'un palier à deux roulements est plus faible que celle de chacun.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Analyser un guidage en translation (§9)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Solution.</span> Identifier le principe (contact direct, patins frottants, éléments roulants) et l'arrêt en rotation autour de la direction de translation.</li>
      <li><span class="step">Isostatisme.</span> Deux colonnes, deux rails : hyperstatique, donc parallélisme à garantir ou un guidage réduit à un simple appui.</li>
      <li><span class="step">Arc-boutement.</span> Repérer l'effort moteur, sa distance \(d\) à l'axe du guidage et la longueur de guidage \(L\) ; vérifier \(L \gt 2 f d\) avec une marge, et calculer \(F = Q/(1 - 2fd/L)\).</li>
      <li><span class="step">Améliorer.</span> Rapprocher l'effort de l'axe, allonger le guidage, diminuer le frottement (éléments roulants, lubrification).</li>
    </ol>
  </div>
</div>
</template>
