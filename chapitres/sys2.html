<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre le modèle du deuxième ordre, au semestre S1 (modèle de connaissance, réponses temporelles) puis S2 (identification, critères de performances, validation) du programme de sciences industrielles : compétences B2 « Modéliser », B3 « Valider un modèle », C1 et C2 « Résoudre ». Il prolonge <a href="#sys1/cours">« Systèmes du 1er ordre »</a>, dont il reprend la démarche (réponses, identification, validation), et s'appuie sur <a href="#slci/cours">« SLCI : modélisation et transformée de Laplace »</a>. Le tracé général des diagrammes de Bode est dans <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a> ; les performances d'un asservissement, dans <a href="#precision/cours">« Performances : précision et rapidité »</a> et <a href="#stabilite/cours">« Stabilité des systèmes asservis »</a>. <strong>Tout est exigible en 1ʳᵉ année</strong>, sauf ce qui est signalé et la dernière section.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Établir un modèle de connaissance par des fonctions de transfert</strong> (B2, S1) : forme canonique \(\dfrac{K}{1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}}\), gain statique, pulsation propre, coefficient d'amortissement, pôles (§1).</li>
        <li><strong>Déterminer la réponse temporelle</strong> (C2, S1) : expression de la réponse à un échelon selon \(\xi\) (§2) ; allures des réponses à une impulsion, à une rampe et à une sinusoïde en régime permanent (§6). Comme pour le premier ordre, la résolution des équations différentielles et les transformées inverses ne sont pas exigibles : les démonstrations sont là pour comprendre.</li>
        <li><strong>Déterminer la réponse fréquentielle</strong> (C2, S2) : allures des diagrammes de Bode réel et asymptotique, résonance (§3 ; méthode générale dans <a href="#bode/cours">« Bode »</a>, §2 à §4).</li>
        <li><strong>Établir un modèle de comportement à partir d'une réponse temporelle ou fréquentielle</strong> (B2, S2), en choisissant l'essai (D2, S2) : identification de \(K\), \(\xi\), \(\omega_0\) (§4).</li>
        <li><strong>Critères de performances</strong> (C1, C2, S2) : stabilité (position des pôles, amortissement, dépassement relatif) (§1, §2) ; rapidité (temps de réponse à 5 %, temps de montée, bande passante) (§2, §3) ; erreur de traînage (§6) ; traduction d'un cahier des charges en \(\xi\) et \(\omega_0\) et réglage d'un gain (§5, §7).</li>
        <li><strong>Vérifier la cohérence du modèle en confrontant les résultats analytiques ou numériques aux résultats expérimentaux</strong> (B3, S2) : simulation par la méthode d'Euler (§8).</li>
      </ul>
      <p>Relève de la 2ᵉ année : les pôles dominants et la réduction de l'ordre d'un modèle (S3 : principe, justification, limites), cités au §5 et détaillés dans <a href="#correcteurs/cours">« Correction des SLCI »</a>, §1. Pour aller plus loin (fin de chapitre) : effet d'un zéro, réduction de l'ordre.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LE MODÈLE DU DEUXIÈME ORDRE</div>
  <h2>Trois paramètres : gain, pulsation propre, amortissement</h2>
  <div class="intro">Dès qu'un système échange de l'énergie entre deux réservoirs (énergie cinétique et énergie élastique d'une suspension, énergies électrique et magnétique d'un circuit RLC), il peut osciller. Le modèle du deuxième ordre décrit ce comportement ; il décrit aussi la plupart des asservissements en boucle fermée. Tout se joue sur un paramètre sans dimension, le coefficient d'amortissement.</div>
  <div class="def-box">
    Un système du <strong>deuxième ordre</strong> a pour fonction de transfert canonique
    <div class="formula" data-nom="FT du deuxième ordre">$$H(p) = \frac{K}{1 + \dfrac{2\xi}{\omega_0}\,p + \dfrac{p^2}{\omega_0^2}} = \frac{K\,\omega_0^2}{p^2 + 2\xi\omega_0\,p + \omega_0^2},$$</div>
    avec \(K\) le <strong>gain statique</strong>, \(\omega_0\) la <strong>pulsation propre</strong> (rad/s) et \(\xi\) le <strong>coefficient d'amortissement</strong> (sans dimension, positif).
  </div>
  <div class="method-box">
    <strong>Exemple — une masse suspendue</strong>
    <p>Une masse \(m\), rappelée par un ressort de raideur \(k\) et freinée par un amortisseur de coefficient \(f\), est soumise à une force \(F(t)\) : \(m\,x'' + f\,x' + k\,x = F\).</p>
    <ol>
      <li>Divisée par \(k\) : \(\dfrac{m}{k}\,x'' + \dfrac{f}{k}\,x' + x = \dfrac{1}{k}\,F\), donc \(H(p) = \dfrac{X(p)}{F(p)} = \dfrac{1/k}{1 + \frac{f}{k}\,p + \frac{m}{k}\,p^2}\).</li>
      <li>Identification : \(K = \dfrac1k\), \(\dfrac{1}{\omega_0^2} = \dfrac{m}{k}\) donc \(\omega_0 = \sqrt{\dfrac{k}{m}}\), et \(\dfrac{2\xi}{\omega_0} = \dfrac{f}{k}\) donc \(\xi = \dfrac{f}{2\sqrt{km}}\).</li>
      <li>Même calcul pour un circuit RLC série (sortie aux bornes de \(C\)) : \(K = 1\), \(\omega_0 = \dfrac{1}{\sqrt{LC}}\), \(\xi = \dfrac{R}{2}\sqrt{\dfrac{C}{L}}\).</li>
      <li>Application numérique : un quart de véhicule de masse \(m = 300\ \text{kg}\), sur une suspension \(k = 3{,}0\times10^4\ \text{N/m}\), \(f = 2{,}4\times10^3\ \text{N}\cdot\text{s/m}\) : \(\omega_0 = 10\ \text{rad/s}\) (soit 1,6 Hz), \(\xi = \dfrac{2400}{2\sqrt{3\times10^4 \times 300}} = 0{,}40\) et \(K = 3{,}3\times10^{-5}\ \text{m/N}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — lire \(K\), \(\omega_0\) et \(\xi\) sur une fonction de transfert</strong>
    <p>\(H(p) = \dfrac{12}{2p^2 + 3p + 8}\).</p>
    <ol>
      <li>On divise par le terme constant du dénominateur : \(H(p) = \dfrac{1{,}5}{1 + 0{,}375\,p + 0{,}25\,p^2}\).</li>
      <li>\(\dfrac{1}{\omega_0^2} = 0{,}25\), donc \(\omega_0 = 2\ \text{rad/s}\) ; \(\dfrac{2\xi}{\omega_0} = 0{,}375\), donc \(\xi = 0{,}375\) ; \(K = 1{,}5\).</li>
      <li>Contrôle par l'autre forme : \(\dfrac{6}{p^2 + 1{,}5p + 4}\) donne \(\omega_0^2 = 4\), \(2\xi\omega_0 = 1{,}5\) et \(K = 6/4\), les mêmes valeurs.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Les pôles selon \(\xi\).</strong> Ce sont les racines de \(p^2 + 2\xi\omega_0\,p + \omega_0^2\) :
    <ul>
      <li>\(\xi \gt 1\) : deux pôles réels négatifs \(-\omega_0\big(\xi \pm \sqrt{\xi^2 - 1}\big)\), réponse <strong>apériodique</strong> ; le système est le produit de deux premiers ordres ;</li>
      <li>\(\xi = 1\) : un pôle double \(-\omega_0\), régime <strong>critique</strong> ;</li>
      <li>\(0 \lt \xi \lt 1\) : deux pôles complexes conjugués \(-\xi\omega_0 \pm j\,\omega_0\sqrt{1 - \xi^2}\), réponse <strong>pseudo-périodique</strong> ; leur module vaut \(\omega_0\) et l'angle qu'ils font avec l'axe réel négatif a pour cosinus \(\xi\) ;</li>
      <li>\(\xi = 0\) : pôles imaginaires purs \(\pm j\omega_0\), oscillation entretenue.</li>
    </ul>
  </div>

<figcaption>Pôles d'un deuxième ordre de pulsation propre \(\omega_0\) (demi-plan supérieur ; chaque pôle complexe a son conjugué en dessous). Pour \(\xi \lt 1\), ils sont sur le cercle de rayon \(\omega_0\), à l'angle \(\alpha\) de l'axe réel négatif tel que \(\cos\alpha = \xi\) ; ils se rejoignent en \(-\omega_0\) pour \(\xi = 1\), puis se séparent sur l'axe réel (\(-0{,}5\,\omega_0\) et \(-2\,\omega_0\) pour \(\xi = 1{,}25\)).</figcaption>
</figure>
  <p>Pour \(\xi \gt 1\), les deux pôles réels définissent deux constantes de temps \(\tau_1 = \dfrac{1}{\omega_0(\xi - \sqrt{\xi^2 - 1})}\) et \(\tau_2 = \dfrac{1}{\omega_0(\xi + \sqrt{\xi^2 - 1})}\), et \(H(p) = \dfrac{K}{(1 + \tau_1 p)(1 + \tau_2 p)}\). Par exemple, \(\omega_0 = 4\ \text{rad/s}\) et \(\xi = 1{,}25\) donnent les pôles \(-2\) et \(-8\ \text{s}^{-1}\), soit \(\tau_1 = 0{,}5\ \text{s}\) et \(\tau_2 = 0{,}125\ \text{s}\). Réciproquement, deux premiers ordres en série forment toujours un deuxième ordre de \(\xi \geq 1\).</p>
  <div class="notice"><strong>Erreur classique</strong> : lire \(\xi\) et \(\omega_0\) avant d'avoir mis le terme constant du dénominateur à 1 (ou le coefficient de \(p^2\) à 1 dans la seconde forme). Autre confusion : \(\omega_0\) n'est pas la pulsation des oscillations de la réponse indicielle ; celle-ci vaut \(\omega_p = \omega_0\sqrt{1 - \xi^2}\), un peu plus petite.</div>

<div class="course-section">
  <div class="sec-num">§2 · LA RÉPONSE INDICIELLE</div>
  <h2>Dépasser ou non la valeur finale</h2>
  <div class="intro">Quel que soit \(\xi\), la réponse à un échelon \(E_0\) tend vers \(K E_0\) et part avec une <strong>tangente horizontale</strong> (le système d'ordre 2 ne réagit pas instantanément en vitesse). Seule la manière d'arriver change. Les expressions ci-dessous sont à connaître ; les grandeurs qui en découlent (dépassement, pseudo-période, temps de réponse) sont celles des cahiers des charges.</div>

<figcaption>Réponses indicielles réduites d'un deuxième ordre (temps en \(\omega_0 t\)). Plus \(\xi\) est petit, plus le dépassement et les oscillations sont marqués ; au-delà de \(\xi = 1\), la réponse est apériodique et de plus en plus lente. Les pointillés marquent la bande ± 5 %.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Régime pseudo-périodique</strong> (\(0 \lt \xi \lt 1\)) :
    <div class="formula" data-nom="Réponse indicielle pseudo-périodique">$$s(t) = K E_0\left[1 - \frac{e^{-\xi\omega_0 t}}{\sqrt{1 - \xi^2}}\,\sin\!\big(\omega_p t + \varphi\big)\right],\qquad \omega_p = \omega_0\sqrt{1 - \xi^2},\quad \cos\varphi = \xi.$$</div>
    <ul>
      <li>pseudo-pulsation \(\omega_p\), pseudo-période \(T_p = 2\pi/\omega_p\) ; premier maximum à \(t_1 = T_p/2 = \pi/\omega_p\) ;</li>
      <li><strong>dépassement relatif</strong> du premier maximum, et des suivants :</li>
    </ul>
    <div class="formula" data-nom="Dépassement du deuxième ordre">$$D_1 = \frac{s_{\max} - s_\infty}{s_\infty} = \exp\!\left(-\frac{\pi\xi}{\sqrt{1 - \xi^2}}\right),\qquad D_k = D_1^{\,k}.$$</div>
  </div>
  <div style="overflow-x:auto"><table>
    <tr><th>\(\xi\)</th><th>0,1</th><th>0,2</th><th>0,3</th><th>0,4</th><th>0,5</th><th>0,6</th><th>0,69</th><th>0,8</th><th>1</th></tr>
    <tr><td>\(D_1\)</td><td>73 %</td><td>53 %</td><td>37 %</td><td>25 %</td><td>16 %</td><td>9,5 %</td><td>5 %</td><td>1,5 %</td><td>0</td></tr>
  </table></div>
  <p>Les extremums successifs sont alternativement au-dessus et au-dessous de la valeur finale, aux instants \(k\,\pi/\omega_p\), à la distance relative \(D_k = D_1^{\,k}\) : le deuxième maximum dépasse de \(D_1^{\,3}\), et le rapport de deux maximums successifs (mesurés à partir de la valeur finale) vaut \(D_1^{\,2}\).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Instants des extremums et dépassement</span>
    <div class="content">
      <p>La dérivée de la réponse indicielle est la réponse impulsionnelle (§6) : \(s'(t) = \dfrac{K E_0\,\omega_0}{\sqrt{1 - \xi^2}}\,e^{-\xi\omega_0 t}\sin(\omega_p t)\). Elle s'annule aux instants \(t_k = k\pi/\omega_p\), où</p>
      <div class="formula">$$\sin(\omega_p t_k + \varphi) = \sin(k\pi + \varphi) = (-1)^k\sin\varphi = (-1)^k\sqrt{1 - \xi^2},$$</div>
      <p>d'où</p>
      <div class="formula">$$s(t_k) = K E_0\Big[1 - (-1)^k\,e^{-\xi\omega_0 k\pi/\omega_p}\Big] = K E_0\Big[1 - (-1)^k D_1^{\,k}\Big],\qquad D_1 = e^{-\pi\xi/\sqrt{1 - \xi^2}}.$$</div>
      <p>Pour \(k = 1\), c'est le premier maximum, \(K E_0\,(1 + D_1)\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Régimes critique et apériodique.</strong> Pour \(\xi = 1\), \(s(t) = K E_0\big[1 - (1 + \omega_0 t)\,e^{-\omega_0 t}\big]\). Pour \(\xi \gt 1\), avec \(\tau_1 \gt \tau_2\) les constantes de temps des deux premiers ordres, \(s(t) = K E_0\Big[1 - \dfrac{\tau_1 e^{-t/\tau_1} - \tau_2 e^{-t/\tau_2}}{\tau_1 - \tau_2}\Big]\) : aucun dépassement, mais une réponse d'autant plus lente que \(\xi\) est grand.
  </div>

  <div class="method-box">
    <strong>Exemple — prévoir la réponse d'un deuxième ordre</strong>
    <p>\(K = 2\), \(\omega_0 = 10\ \text{rad/s}\), \(\xi = 0{,}3\), échelon \(E_0 = 5\) à partir du repos.</p>
    <ol>
      <li>Valeur finale \(K E_0 = 10\) ; pseudo-pulsation \(\omega_p = 10\sqrt{1 - 0{,}09} = 9{,}54\ \text{rad/s}\), pseudo-période \(T_p = 0{,}66\ \text{s}\).</li>
      <li>Premier maximum à \(t_1 = \pi/\omega_p = 0{,}33\ \text{s}\), dépassement \(D_1 = e^{-0{,}3\pi/0{,}954} = 37\ \%\) : \(s_{\max} = 13{,}7\).</li>
      <li>Puis un minimum à \(10\,(1 - D_1^{\,2}) = 8{,}6\) vers 0,66 s, un deuxième maximum à \(10\,(1 + D_1^{\,3}) = 10{,}5\) vers 0,99 s.</li>
      <li>Abaque : \(t_{r5\%}\,\omega_0 \approx 10\), donc \(t_{r5\%} \approx 1{,}0\ \text{s}\) ; temps de montée \(1{,}3/10 = 0{,}13\ \text{s}\). Le système monte vite mais se stabilise lentement.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LA RÉPONSE FRÉQUENTIELLE</div>
  <h2>Résonance et pente de −40 dB par décade</h2>
  <div class="intro">Cette section donne les résultats propres au deuxième ordre, en particulier la résonance ; la méthode générale de tracé (somme des briques, calcul exact du gain et de la phase) est dans <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a>, §2 à §4.</div>
  <div class="prop-box">
    Avec la pulsation réduite \(u = \omega/\omega_0\) :
    <div class="formula" data-nom="Gain du deuxième ordre">$$|H(j\omega)| = \frac{K}{\sqrt{(1 - u^2)^2 + 4\xi^2u^2}},\qquad \varphi = -\arg\big(1 - u^2 + 2j\xi u\big).$$</div>
    <ul>
      <li>asymptotes du gain : horizontale à \(20\log K\) jusqu'à \(\omega_0\), puis pente de \(-40\) dB/décade ;</li>
      <li>en \(\omega = \omega_0\) : \(|H| = \dfrac{K}{2\xi}\) et \(\varphi = -90°\) quel que soit \(\xi\) ; la phase passe de 0° à \(-180°\), d'autant plus brutalement que \(\xi\) est petit ;</li>
      <li><strong>résonance</strong> si et seulement si \(\xi \lt \dfrac{1}{\sqrt2} \approx 0{,}71\) : maximum de gain en \(\omega_r = \omega_0\sqrt{1 - 2\xi^2}\), de facteur de résonance</li>
    </ul>
    <div class="formula" data-nom="Facteur de résonance">$$Q_r = \frac{|H(j\omega_r)|}{K} = \frac{1}{2\xi\sqrt{1 - \xi^2}}.$$</div>
  </div>

</figure>
  <div class="notice">Une résonance marquée sur le Bode et un fort dépassement sur la réponse indicielle sont les deux faces du même faible amortissement. Pour \(\xi = 0{,}1\), le gain est multiplié par 5 à la résonance (+14 dB) et le dépassement atteint 73 %.</div>
  <div class="method-box">
    <strong>Exemple — une résonance chiffrée</strong>
    <p>\(K = 1\), \(\omega_0 = 50\ \text{rad/s}\), \(\xi = 0{,}2\).</p>
    <ol>
      <li>\(\xi \lt 0{,}71\) : résonance en \(\omega_r = 50\sqrt{1 - 0{,}08} = 48\ \text{rad/s}\), de facteur \(Q_r = \dfrac{1}{0{,}4\sqrt{0{,}96}} = 2{,}55\), soit +8,1 dB.</li>
      <li>En \(\omega_0\), \(|H| = 1/(2\xi) = 2{,}5\) (+8,0 dB) et \(\varphi = -90°\) : la résonance est presque en \(\omega_0\) quand \(\xi\) est petit.</li>
      <li>À \(10\,\omega_0 = 500\ \text{rad/s}\), le gain vaut \(-40\) dB (calcul exact : \(-39{,}9\) dB) : une vibration à cette pulsation est divisée par 100.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Bande passante.</strong> Le gain reste à moins de 3 dB de \(20\log K\) jusqu'à la pulsation
    <div class="formula" data-nom="Bande passante du deuxième ordre">$$\omega_{BP} = \omega_0\sqrt{1 - 2\xi^2 + \sqrt{(1 - 2\xi^2)^2 + 1}}.$$</div>
    Pour \(\xi = 0{,}7\), \(\omega_{BP} \approx \omega_0\) et \(t_{r5\%}\,\omega_{BP} \approx 2{,}9\) : on retrouve, comme pour le premier ordre, un produit temps de réponse × bande passante voisin de 3. Pour \(\xi = 0{,}2\) (exemple ci-dessus), \(\omega_{BP} = 1{,}51\,\omega_0 = 75\ \text{rad/s}\).
  </div>
  <div class="notice"><strong>Ne pas confondre</strong> \(Q_r\) avec le <strong>facteur de qualité</strong> \(Q = \dfrac{1}{2\xi}\) des physiciens (chapitre <a href="#oscill/cours">« Oscillateurs harmoniques »</a>), qui donne le gain en \(\omega_0\) : \(|H(j\omega_0)| = KQ\). Les deux sont presque égaux pour un faible amortissement (2,55 et 2,5 pour \(\xi = 0{,}2\)), mais seul \(Q_r\) est le maximum du gain. De même, \(\omega_0\), \(\omega_p\) et \(\omega_r\) sont trois pulsations différentes : \(\omega_r \lt \omega_p \lt \omega_0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · IDENTIFIER UN DEUXIÈME ORDRE</div>
  <h2>De la courbe aux paramètres</h2>
  <div class="intro">Un deuxième ordre se reconnaît sur une réponse indicielle à son départ à tangente horizontale ; s'il dépasse sa valeur finale, il est pseudo-périodique et trois mesures suffisent. L'essai se choisit comme pour le premier ordre (<a href="#sys1/cours">« Systèmes du 1er ordre »</a>, §5) : départ d'un équilibre, échelon dans le domaine linéaire, enregistrement jusqu'au palier, assez de points par pseudo-période pour bien situer les maximums.</div>
  <div class="method-box">
    <strong>Sur une réponse indicielle pseudo-périodique</strong>
    <ol>
      <li>\(K = \Delta s_\infty/\Delta e\).</li>
      <li>Mesurer le premier dépassement \(D_1\), puis \(\xi = \dfrac{-\ln D_1}{\sqrt{\pi^2 + \ln^2 D_1}}\) (ou lire la table).</li>
      <li>Mesurer la pseudo-période \(T_p\) (deux maxima successifs, ou deux fois l'instant du premier maximum), puis \(\omega_0 = \dfrac{2\pi}{T_p\sqrt{1 - \xi^2}}\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — identifier une nacelle de caméra sur un relevé</strong>
    <p>La nacelle d'une caméra embarquée, au repos, reçoit à \(t = 0\) un échelon de consigne de 20° (figure ci-dessus).</p>
    <ol>
      <li>Allure : départ à tangente horizontale, oscillations amorties autour de 20° : deuxième ordre pseudo-périodique, de gain \(K = 20/20 = 1\).</li>
      <li>Premier maximum 28,9° : \(D_1 = 8{,}9/20 = 0{,}445\), \(\ln D_1 = -0{,}81\), d'où \(\xi = \dfrac{0{,}81}{\sqrt{9{,}87 + 0{,}65}} = 0{,}25\).</li>
      <li>Contrôle par le deuxième maximum : \(\dfrac{21{,}8 - 20}{8{,}9} = 0{,}20\), à comparer à \(D_1^{\,2} = 0{,}20\). Le modèle du deuxième ordre est cohérent.</li>
      <li>Maximums à 0,20 s et 0,61 s : \(T_p = 0{,}41\ \text{s}\), \(\omega_0 = \dfrac{2\pi}{0{,}41\sqrt{1 - 0{,}0625}} = 15{,}8\ \text{rad/s}\) (16 rad/s à la précision du relevé). Temps de réponse prévu : \(t_{r5\%} \approx 10{,}8/15{,}8 = 0{,}68\ \text{s}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une suspension relevée sur banc</strong>
    <p>Un échelon de force de 600 N enfonce une suspension de 4,0 cm en régime permanent ; le premier maximum, 5,0 cm, survient à 0,25 s.</p>
    <ol>
      <li>\(K = \dfrac{0{,}040}{600} = 6{,}7\times 10^{-5}\ \text{m/N}\) (raideur \(k = 1/K = 1{,}5\times 10^{4}\ \text{N/m}\)).</li>
      <li>\(D_1 = \dfrac{5{,}0 - 4{,}0}{4{,}0} = 0{,}25\), donc \(\xi = \dfrac{1{,}386}{\sqrt{9{,}87 + 1{,}92}} \approx 0{,}40\).</li>
      <li>\(T_p = 2 \times 0{,}25 = 0{,}50\ \text{s}\), \(\omega_p = 12{,}6\ \text{rad/s}\) et \(\omega_0 = \dfrac{12{,}6}{\sqrt{1 - 0{,}16}} \approx 13{,}7\ \text{rad/s}\).</li>
      <li>Temps de réponse prévu par l'abaque (\(t_{r5\%}\,\omega_0 \approx 7{,}6\) pour \(\xi = 0{,}4\)) : environ 0,55 s.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Sur un diagramme de Bode</strong> : \(\omega_0\) est la pulsation où la phase vaut \(-90°\) ; le gain en \(\omega_0\), \(20\log\dfrac{K}{2\xi}\), donne \(\xi\). Une réponse apériodique (pas de dépassement, tangente horizontale) se modélise par deux premiers ordres, ou par un seul quand l'un des pôles domine.
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : mesurer le dépassement par rapport à la consigne, ou à l'échelon d'entrée, au lieu de la variation finale de la sortie ; prendre pour pseudo-période l'intervalle entre deux passages successifs par la valeur finale (c'est une demi-pseudo-période) ; identifier sans contrôler sur un second point (deuxième maximum, temps de réponse).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PÔLES DOMINANTS ET BOUCLE FERMÉE</div>
  <h2>Simplifier un modèle, prévoir un réglage</h2>
  <div class="prop-box">
    <strong>Pôle dominant</strong> (principe vu en 2ᵉ année, <a href="#correcteurs/cours">« Correction des SLCI »</a>, §1 ; en 1ʳᵉ année, on ne l'utilise que si l'énoncé l'indique). Si \(\tau_1\) vaut au moins cinq à dix fois \(\tau_2\), \(\dfrac{K}{(1 + \tau_1 p)(1 + \tau_2 p)} \approx \dfrac{K}{1 + \tau_1 p}\) pour l'allure générale de la réponse : le pôle rapide \(-1/\tau_2\) ne joue qu'au tout début (il arrondit le départ). On simplifie ainsi un moteur dont la constante électrique \(L/R\) est très petite devant la constante mécanique.
  </div>
  <div class="method-box">
    <strong>Exemple — le gain d'une boucle de position</strong>
    <p>Une FTBO \(\dfrac{K}{p\,(1 + \tau p)}\) (moteur et intégration de la vitesse) est bouclée par un retour unitaire.</p>
    <ol>
      <li>\(H_{BF}(p) = \dfrac{K}{\tau p^2 + p + K} = \dfrac{1}{1 + \frac{1}{K}\,p + \frac{\tau}{K}\,p^2}\) : un deuxième ordre de gain 1.</li>
      <li>Identification : \(\omega_0 = \sqrt{\dfrac{K}{\tau}}\) et \(\xi = \dfrac{1}{2\sqrt{K\tau}}\).</li>
      <li>Augmenter \(K\) augmente \(\omega_0\) mais diminue \(\xi\) : pour \(\tau = 0{,}1\ \text{s}\), \(K = 5\ \text{s}^{-1}\) donne \(\xi = 0{,}71\) et \(t_{r5\%} \approx 3/\omega_0 \approx 0{,}42\ \text{s}\) ; \(K = 50\ \text{s}^{-1}\) donne \(\xi = 0{,}22\) et un dépassement de 49 %.</li>
    </ol>
    <p>Ce compromis rapidité / amortissement est au cœur des chapitres suivants.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉPONSES À UNE IMPULSION, UNE RAMPE ET UNE SINUSOÏDE</div>
  <h2>Les autres entrées canoniques</h2>
  <div class="intro">Le programme demande l'allure des réponses aux entrées canoniques. Comme pour le premier ordre, la réponse impulsionnelle est la dérivée de la réponse indicielle, et la réponse à une rampe en est la primitive.</div>
  <div class="prop-box">
    <strong>Impulsion.</strong> Pour \(0 \lt \xi \lt 1\),
    <div class="formula" data-nom="Réponse impulsionnelle du deuxième ordre">$$h(t) = \frac{K\omega_0}{\sqrt{1 - \xi^2}}\,e^{-\xi\omega_0 t}\sin(\omega_p t),$$</div>
    et \(h(t) = K\omega_0^2\,t\,e^{-\omega_0 t}\) au régime critique. La réponse part de 0 avec la pente \(K\omega_0^2\), passe par un maximum à l'instant \(\arccos(\xi)/\omega_p\), puis oscille autour de 0 en s'annulant aux instants \(k\pi/\omega_p\), ceux des extremums de la réponse indicielle.
  </div>
  <figure class="schema">
<svg viewBox="0 0 410 196" role="img" aria-label="Réponses impulsionnelles d'un deuxième ordre pour plusieurs coefficients d'amortissement">
<line x1="46" y1="125.4" x2="382" y2="125.4" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>
<line x1="46" y1="172" x2="46" y2="10" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>

<figcaption>Réponses impulsionnelles réduites d'un deuxième ordre (\(h/(K\omega_0)\) en fonction de \(\omega_0 t\)). Elles partent de 0 avec une pente non nulle ; pour \(\xi \lt 1\), elles oscillent autour de 0 à la pseudo-pulsation et s'annulent aux instants des extremums de la réponse indicielle, dont elles sont la dérivée.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Rampe</strong> \(e(t) = a\,t\), pour \(K = 1\) : après un départ à tangente horizontale, la sortie suit la rampe avec un retard \(\dfrac{2\xi}{\omega_0}\), d'où l'<strong>écart de traînage</strong>
    <div class="formula" data-nom="Écart de traînage du deuxième ordre">$$\varepsilon_v = \lim_{t \to \infty}\big(e(t) - s(t)\big) = \frac{2\xi\,a}{\omega_0}.$$</div>
    Pour \(K \neq 1\), les pentes diffèrent et l'écart croît sans limite, comme pour le premier ordre.
  </div>

<figcaption>Réponse à une rampe \(e = at\) d'un deuxième ordre de gain 1 (ici \(\xi = 0{,}5\), temps en \(\omega_0 t\), rampe de pente 1). Départ à tangente horizontale, puis la sortie suit la consigne avec un retard \(2\xi/\omega_0\), d'où un écart de traînage \(2\xi a/\omega_0\).</figcaption>
</figure>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">L'écart de traînage par le théorème de la valeur finale</span>
    <div class="content">
      <p>\(E(p) = a/p^2\) et \(e - s\) a pour transformée \(\big(1 - H(p)\big)\,\dfrac{a}{p^2}\), avec \(1 - H(p) = \dfrac{\frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}}{1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}}\) pour \(K = 1\). Le système étant stable, le théorème de la valeur finale donne</p>
      <div class="formula">$$\varepsilon_v = \lim_{p \to 0} p\,\big(1 - H(p)\big)\,\frac{a}{p^2} = a\lim_{p \to 0}\frac{1 - H(p)}{p} = \frac{2\xi\,a}{\omega_0}.$$</div>
    </div>
  </div>
  <p><strong>Sinusoïde.</strong> En régime permanent, la sortie est une sinusoïde de même pulsation, d'amplitude \(|H(j\omega)|\,E_m\) et déphasée de \(\varphi(\omega)\) (§3) : amplifiée près de \(\omega_r\) si \(\xi \lt 0{,}71\), en quadrature retard en \(\omega_0\), presque en opposition de phase et très atténuée au-delà de \(10\,\omega_0\).</p>
  <div class="method-box">
    <strong>Exemple — un capteur de position du deuxième ordre</strong>
    <p>Un capteur de déplacement et son conditionneur forment un deuxième ordre \(K = 1\), \(\omega_0 = 200\ \text{rad/s}\), \(\xi = 0{,}6\).</p>
    <ol>
      <li>Échelon : dépassement \(D_1 = 9{,}5\ \%\) ; impulsion (choc sur le capteur) : réponse maximale à \(\arccos(0{,}6)/160 = 5{,}8\ \text{ms}\), qui repasse par 0 à \(\pi/160 = 20\ \text{ms}\).</li>
      <li>Objet qui se déplace à 0,5 m/s : le capteur suit avec un retard \(2\xi/\omega_0 = 6\ \text{ms}\), soit un écart de traînage de 3 mm.</li>
      <li>Vibration à 100 rad/s (\(u = 0{,}5\)) : \(|H| = \dfrac{1}{\sqrt{0{,}75^2 + 0{,}6^2}} = 1{,}04\) et \(\varphi = -\arctan\dfrac{0{,}6}{0{,}75} = -39°\) : l'amplitude est bien restituée, avec un retard de phase.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · TRADUIRE UN CAHIER DES CHARGES</div>
  <h2>Du critère aux paramètres \(\xi\) et \(\omega_0\)</h2>
  <div class="intro">Un cahier des charges impose des performances (dépassement maximal, temps de réponse, absence de résonance, erreur de traînage) ; quand le système bouclé est un deuxième ordre, chacune se traduit en une contrainte sur \(\xi\) ou sur \(\omega_0\), puis en une valeur de gain.</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Critère</th><th>Contrainte</th><th>Outil</th></tr>
    <tr><td>dépassement \(D_1 \le D_{max}\)</td><td>\(\xi \geq \dfrac{-\ln D_{max}}{\sqrt{\pi^2 + \ln^2 D_{max}}}\)</td><td>formule ou table du §2</td></tr>
    <tr><td>aucun dépassement</td><td>\(\xi \geq 1\)</td><td>§1</td></tr>
    <tr><td>pas de résonance</td><td>\(\xi \geq 0{,}71\)</td><td>§3</td></tr>
    <tr><td>temps de réponse \(t_{r5\%} \le t_{max}\)</td><td>\(\omega_0 \geq \dfrac{(t_{r5\%}\,\omega_0)(\xi)}{t_{max}}\)</td><td>abaque, une fois \(\xi\) choisi</td></tr>
    <tr><td>écart de traînage \(\le \varepsilon_{max}\) (gain 1)</td><td>\(\dfrac{2\xi}{\omega_0}\,a \le \varepsilon_{max}\)</td><td>§6</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — un dépassement d'au plus 10 % en moins de 0,3 s</strong>
    <ol>
      <li>\(D_1 \le 0{,}10\) : \(\xi \geq \dfrac{2{,}30}{\sqrt{9{,}87 + 5{,}30}} = 0{,}59\).</li>
      <li>Pour \(\xi = 0{,}7\), \(t_{r5\%}\,\omega_0 \approx 2{,}9\) : il faut \(\omega_0 \geq 2{,}9/0{,}3 = 9{,}7\ \text{rad/s}\). Pour \(\xi = 0{,}6\), \(t_{r5\%}\,\omega_0 \approx 5{,}2\) : il faudrait \(\omega_0 \geq 17\ \text{rad/s}\). Viser \(\xi \approx 0{,}7\) est donc le meilleur choix.</li>
      <li>Boucle de position \(\dfrac{K}{p\,(1 + \tau p)}\) avec \(\tau = 0{,}05\ \text{s}\) (§5) : \(\xi = 0{,}7\) impose \(K = \dfrac{1}{4\xi^2\tau} = 10{,}2\ \text{s}^{-1}\), d'où \(\omega_0 = \sqrt{K/\tau} = 14{,}3\ \text{rad/s} \geq 9{,}7\) : \(t_{r5\%} \approx 0{,}20\ \text{s}\), le cahier des charges est respecté.</li>
      <li>Pour une consigne en rampe de 0,1 rad/s, l'écart de traînage vaut \(2\xi a/\omega_0 = a/K = 9{,}8\ \text{mrad}\). Si le cahier des charges demandait moins, il faudrait augmenter \(K\), donc diminuer \(\xi\) : un simple gain ne suffirait plus, il faudrait un correcteur (2ᵉ année).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que diminuer \(\xi\) accélère toujours la réponse. Le temps de montée diminue, mais le temps de réponse à 5 % augmente dès que \(\xi\) descend sous 0,69 : pour \(\xi = 0{,}6\), il est près de deux fois plus long que pour \(\xi = 0{,}7\) à \(\omega_0\) égal.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SIMULER ET VALIDER UN MODÈLE</div>
  <h2>La méthode d'Euler pour un deuxième ordre</h2>
  <div class="intro">Comme pour le premier ordre (<a href="#sys1/cours">« Systèmes du 1er ordre »</a>, §8), on valide un modèle en comparant ses prévisions à des mesures. Une simulation permet de traiter n'importe quelle entrée ; il faut seulement choisir un pas adapté, car la méthode d'Euler se comporte mal sur un système oscillant.</div>
  <p>L'équation \(\dfrac{1}{\omega_0^2}\,s'' + \dfrac{2\xi}{\omega_0}\,s' + s = K\,e(t)\) s'écrit \(s'' = G(t, s, s') = \omega_0^2\big(K\,e(t) - s\big) - 2\xi\omega_0\,s'\). La fonction <span class="code-inline">euler_ordre2</span> du chapitre <a href="#pynum/cours">« Méthodes numériques »</a>, §7, applique la méthode d'Euler au couple \((s, s')\). On l'utilise sur le modèle de la nacelle du §4 (\(K = 1\), \(\omega_0 = 16\ \text{rad/s}\), \(\xi = 0{,}25\), échelon de 20°), avec trois pas de calcul :</p>
  <pre class="codeblock"><span class="kw">def</span> euler_ordre2(G, t0, y0, v0, h, n):
    <span class="str">"""y'' = G(t, y, y') avec y(t0) = y0 et y'(t0) = v0 : méthode d'Euler appliquée
    au couple (y, v) où v = y'. Renvoie les listes des t_k, y_k et v_k."""</span>
    ts, ys, vs = [t0], [y0], [v0]
    y, v = y0, v0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        t = t0 + k * h
        y, v = y + h * v, v + h * G(t, y, v)   <span class="cmt"># les deux avec les anciennes valeurs</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
        vs.append(v)
    <span class="kw">return</span> ts, ys, vs

K, w0, xi, E0 = 1.0, 16.0, 0.25, 20.0         <span class="cmt"># nacelle du §4 ; échelon de 20°</span>

<span class="kw">def</span> G(t, s, v):
    <span class="kw">return</span> w0**2 * (K * E0 - s) - 2 * xi * w0 * v

<span class="kw">for</span> h <span class="kw">in</span> (0.01, 0.001, 0.0001):
    ts, ss, vs = euler_ordre2(G, 0, 0.0, 0.0, h, round(1.0 / h))
    k = ss.index(max(ss))                       <span class="cmt"># indice du premier maximum</span>
    print(h, round(ts[k], 3), round(ss[k], 2))</pre>
  <p>Le programme, exécuté tel quel, affiche :</p>
  <pre class="codeblock">0.01 0.2 31.58
0.001 0.202 29.12
0.0001 0.203 28.91</pre>
  <div class="method-box">
    <strong>Exemple — lire la simulation</strong>
    <ol>
      <li>Valeur exacte : premier maximum \(20\,(1 + D_1) = 28{,}9°\) à \(t_1 = \pi/\omega_p = 0{,}203\ \text{s}\).</li>
      <li>Avec un pas de 10 ms (\(T_p/40\)), Euler donne 31,6° : le dépassement simulé (58 %) est faux de 14 points. La méthode d'Euler explicite ajoute de l'énergie à chaque pas : sur un système oscillant, elle surestime les dépassements.</li>
      <li>Avec 1 ms, l'erreur tombe à 0,2° ; avec 0,1 ms, à 0,02° : l'erreur est proportionnelle au pas. Un pas de l'ordre de \(T_p/400\) donne ici le maximum à 1 % près.</li>
      <li>La simulation à 0,1 ms reproduit le relevé du §4 (28,9° à 0,20 s, 21,8° à 0,61 s) à 0,1° près sur les maximums. Ce n'est qu'une vérification de cohérence, puisque ce relevé a servi à l'identification : pour valider le modèle, on le compare à un autre essai (échelon d'une autre amplitude, consigne en rampe).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : attribuer au système un écart qui vient du calcul. Avant de conclure qu'un modèle est faux, on vérifie que la simulation ne change plus quand on divise le pas par 10.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>L'effet d'un zéro, la réduction de l'ordre</h2>
  <div class="intro">Deux compléments non exigibles en PTSI ; le second est au programme de 2ᵉ année.</div>
  <h3>Un zéro peut faire dépasser un système bien amorti</h3>
  <p>Le dépassement \(D_1(\xi)\) n'est valable que pour la forme canonique, sans numérateur dépendant de \(p\). Avec un zéro, \(H(p) = \dfrac{1 + 2p}{(1 + p)^2}\) (\(\xi = 1\), \(\omega_0 = 1\ \text{rad/s}\)) a pour réponse indicielle \(s(t) = 1 + (t - 1)\,e^{-t}\), qui passe par un maximum de \(1 + e^{-2} = 1{,}135\) en \(t = 2\ \text{s}\) : 13,5 % de dépassement, bien qu'il soit au régime critique. Le zéro ajoute à la réponse un terme proportionnel à sa dérivée, qui la fait « partir plus fort ».</p>
  <h3>Réduire l'ordre d'un modèle (2ᵉ année)</h3>
  <p>Le pôle dominant du §5 se justifie : le terme associé au pôle rapide s'éteint en quelques \(\tau_2\), et son coefficient dans la réponse indicielle vaut \(\dfrac{\tau_2}{\tau_1 - \tau_2}\), petit si \(\tau_2 \ll \tau_1\). Ses limites (pôles trop proches, présence d'un zéro voisin, système bouclé ensuite avec un fort gain) sont étudiées dans <a href="#correcteurs/cours">« Correction des SLCI »</a>, §1.</p>
</div>
</template>

<div class="course-section">
  <div class="sec-num">MÉTHODES · SYSTÈMES DU 2e ORDRE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix savoir-faire pour lire un deuxième ordre, prévoir et mesurer ses réponses, traduire un cahier des charges et régler un gain. Les numéros de section renvoient au cours.</div>

  <div class="method-box"><strong>Méthode 1 — Identifier \(K\), \(\omega_0\) et \(\xi\) sur une fonction de transfert</strong>
    <ol>
      <li>Diviser par le terme constant du dénominateur pour obtenir \(1 + a\,p + b\,p^2\).</li>
      <li>\(\omega_0 = 1/\sqrt{b}\), puis \(\xi = \dfrac{a\,\omega_0}{2}\) ; \(K\) est le numérateur restant.</li>
      <li>Sous la forme \(\dfrac{N}{p^2 + c\,p + d}\) : \(\omega_0 = \sqrt{d}\), \(\xi = \dfrac{c}{2\omega_0}\), \(K = N/d\) (§1).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{50}{p^2 + 4p + 25}\) : \(\omega_0 = 5\ \text{rad/s}\), \(\xi = \dfrac{4}{2 \times 5} = 0{,}4\), \(K = 50/25 = 2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Prévoir l'allure et les valeurs remarquables de la réponse indicielle</strong>
    <ol>
      <li>Valeur finale \(K E_0\), tangente horizontale à l'origine ; \(\xi \geq 1\) : pas de dépassement ; \(\xi \lt 1\) : oscillations amorties.</li>
      <li>Pour \(\xi \lt 1\) : \(\omega_p = \omega_0\sqrt{1 - \xi^2}\), \(T_p = 2\pi/\omega_p\), premier maximum à \(t_1 = \pi/\omega_p\), dépassement \(D_1 = e^{-\pi\xi/\sqrt{1 - \xi^2}}\), extremums suivants \(D_1^{\,k}\) aux instants \(k\pi/\omega_p\) (§2).</li>
      <li>Temps de réponse : abaque ; retenir \(3/\omega_0\) pour \(\xi \approx 0{,}7\), \(4{,}75/\omega_0\) au régime critique, \(3/(\xi\omega_0)\) pour un système peu amorti.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 1\), \(\omega_0 = 20\ \text{rad/s}\), \(\xi = 0{,}5\) : \(D_1 = 16\ \%\), \(\omega_p = 17{,}3\ \text{rad/s}\), premier maximum à 0,18 s, \(t_{r5\%} \approx 5{,}3/20 = 0{,}26\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Identifier un deuxième ordre sur un relevé indiciel</strong>
    <ol>
      <li>Vérifier la tangente horizontale au départ ; \(K\) par la variation finale.</li>
      <li>\(D_1\) par le premier maximum, rapporté à la variation finale ; \(\xi = \dfrac{-\ln D_1}{\sqrt{\pi^2 + \ln^2 D_1}}\).</li>
      <li>Pseudo-période \(T_p\) entre deux maxima (ou \(2t_1\)), puis \(\omega_0 = \dfrac{2\pi}{T_p\sqrt{1 - \xi^2}}\).</li>
      <li>Contrôler sur un autre point : le deuxième maximum dépasse de \(D_1^{\,3}\) (§4).</li>
    </ol>
    <p><em>Exemple éclair :</em> échelon de 1 V, sortie finale 3 V, premier maximum 3,6 V à 0,5 s : \(K = 3\), \(D_1 = 0{,}6/3 = 0{,}20\), \(\xi = \dfrac{1{,}61}{\sqrt{9{,}87 + 2{,}59}} = 0{,}46\), \(T_p = 1{,}0\ \text{s}\), \(\omega_0 = \dfrac{2\pi}{\sqrt{1 - 0{,}21}} = 7{,}1\ \text{rad/s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Tracer le Bode d'un deuxième ordre</strong>
    <ol>
      <li>Asymptotes : \(20\log K\) puis \(-40\) dB/décade, cassure en \(\omega_0\) ; phase : 0° puis \(-180°\), avec \(-90°\) en \(\omega_0\).</li>
      <li>Position réelle en \(\omega_0\) : \(20\log K - 20\log(2\xi)\) (au-dessus de l'asymptote si \(\xi \lt 0{,}5\)).</li>
      <li>Si \(\xi \lt 0{,}71\) : résonance en \(\omega_r = \omega_0\sqrt{1 - 2\xi^2}\), de facteur \(Q_r = \dfrac{1}{2\xi\sqrt{1 - \xi^2}}\).</li>
      <li>Si \(\xi \gt 1\) : tracer plutôt les deux premiers ordres, de cassures \(\omega_0(\xi \pm \sqrt{\xi^2 - 1})\) (§3 ; méthode générale : <a href="#bode/cours">« Bode »</a>, §3).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 10\), \(\omega_0 = 100\ \text{rad/s}\), \(\xi = 0{,}1\) : plateau à 20 dB ; en \(\omega_0\), \(20 + 14 = 34\) dB ; maximum \(20 + 20\log 5{,}03 = 34{,}0\) dB en \(\omega_r = 99\ \text{rad/s}\) ; à \(1000\ \text{rad/s}\), environ \(-20\) dB.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Régler un gain pour obtenir un amortissement</strong>
    <ol>
      <li>Écrire la FTBF en fonction du gain réglable et l'identifier à un deuxième ordre.</li>
      <li>Imposer \(\xi\) (0,7 pour le plus rapide sans dépassement notable, 1 pour aucun dépassement) et en déduire le gain.</li>
      <li>Vérifier le temps de réponse avec \(\omega_0\) obtenu ; s'il est insuffisant, un simple gain ne suffit pas : il faut un correcteur (§5, §7).</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{K}{p\,(1 + 0{,}2p)}\), retour unitaire : \(\xi = \dfrac{1}{2\sqrt{0{,}2K}}\). \(\xi = 0{,}7\) donne \(K = 2{,}55\ \text{s}^{-1}\) (\(\omega_0 = 3{,}6\ \text{rad/s}\)) ; \(\xi = 1\) donne \(K = 1{,}25\ \text{s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Lire l'abaque du temps de réponse dans les deux sens</strong>
    <ol>
      <li>\(\xi\) connu : lire \(t_{r5\%}\,\omega_0\) sur l'abaque (ou la table du §2), puis diviser par \(\omega_0\).</li>
      <li>Temps de réponse imposé : choisir \(\xi\) (souvent 0,7), lire \(t_{r5\%}\,\omega_0\), et en déduire la valeur minimale de \(\omega_0\).</li>
      <li>Se méfier des marches de l'abaque entre 0,5 et 0,7 : un \(\xi\) légèrement inférieur à 0,69 double presque le temps de réponse.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(t_{r5\%} \le 0{,}5\ \text{s}\) sans aucun dépassement (\(\xi = 1\)) : \(\omega_0 \geq 4{,}75/0{,}5 = 9{,}5\ \text{rad/s}\). Inversement, \(\omega_0 = 20\ \text{rad/s}\) et \(\xi = 0{,}3\) donnent \(t_{r5\%} \approx 10/20 = 0{,}5\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Traduire un cahier des charges en \(\xi\) et \(\omega_0\)</strong>
    <ol>
      <li>Dépassement maximal → \(\xi\) minimal (formule inverse de \(D_1\)) ; aucun dépassement → \(\xi \geq 1\) ; pas de résonance → \(\xi \geq 0{,}71\).</li>
      <li>Temps de réponse maximal → \(\omega_0\) minimal, par l'abaque (méthode 6).</li>
      <li>Écart de traînage maximal → \(\dfrac{2\xi}{\omega_0}\) maximal (méthode 8).</li>
      <li>Exprimer \(\xi\) et \(\omega_0\) en fonction du gain réglable et vérifier que toutes les contraintes sont compatibles (§7).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(D_1 \le 5\ \%\) et \(t_{r5\%} \le 0{,}1\ \text{s}\) : \(\xi \geq 0{,}69\), puis \(\omega_0 \geq 2{,}9/0{,}1 = 29\ \text{rad/s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Prévoir les réponses à une rampe et à une impulsion</strong>
    <ol>
      <li>Rampe \(at\), gain 1 : la sortie suit avec un retard \(2\xi/\omega_0\) ; écart de traînage \(\varepsilon_v = 2\xi a/\omega_0\). Gain différent de 1 : écart croissant.</li>
      <li>Impulsion : départ à 0 avec la pente \(K\omega_0^2\), maximum en \(\arccos(\xi)/\omega_p\), puis oscillations autour de 0 si \(\xi \lt 1\) (§6).</li>
      <li>Boucle \(\dfrac{K}{p(1 + \tau p)}\) : on retrouve \(\dfrac{2\xi}{\omega_0} = \dfrac{1}{K}\), l'écart \(a/K\) d'une FTBO de classe 1.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 1\), \(\omega_0 = 10\ \text{rad/s}\), \(\xi = 0{,}5\) : retard 0,1 s, écart de 0,2 pour une rampe de pente 2 ; réponse impulsionnelle maximale à \(\dfrac{\arccos 0{,}5}{8{,}66} = 0{,}12\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Passer d'un deuxième ordre apériodique à deux premiers ordres</strong>
    <ol>
      <li>\(\xi \gt 1\) : pôles \(-\omega_0(\xi \pm \sqrt{\xi^2 - 1})\), d'où \(\tau_{1,2} = \dfrac{1}{\omega_0(\xi \mp \sqrt{\xi^2 - 1})}\) et \(H = \dfrac{K}{(1 + \tau_1 p)(1 + \tau_2 p)}\).</li>
      <li>Inversement, développer \((1 + \tau_1 p)(1 + \tau_2 p) = 1 + (\tau_1 + \tau_2)\,p + \tau_1\tau_2\,p^2\) : \(\omega_0 = \dfrac{1}{\sqrt{\tau_1\tau_2}}\), \(\xi = \dfrac{\tau_1 + \tau_2}{2\sqrt{\tau_1\tau_2}} \geq 1\).</li>
      <li>Temps de réponse : abaque (§2), ou constante de temps dominante si \(\tau_1 \gg \tau_2\) (2ᵉ année, §5).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\omega_0 = 2\ \text{rad/s}\), \(\xi = 1{,}5\) : pôles \(-0{,}76\) et \(-5{,}24\ \text{s}^{-1}\), \(\tau_1 = 1{,}31\ \text{s}\), \(\tau_2 = 0{,}19\ \text{s}\). Inversement, \(\tau_1 = 1\ \text{s}\) et \(\tau_2 = 0{,}25\ \text{s}\) donnent \(\omega_0 = 2\ \text{rad/s}\) et \(\xi = 1{,}25\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Simuler un deuxième ordre par la méthode d'Euler</strong>
    <ol>
      <li>Écrire \(s'' = \omega_0^2\big(K e(t) - s\big) - 2\xi\omega_0\,s'\) et appliquer Euler au couple \((s, s')\) (fonction <span class="code-inline">euler_ordre2</span>, §8).</li>
      <li>Choisir un pas petit devant la pseudo-période (de l'ordre de \(T_p/400\)) : avec un pas trop grand, Euler explicite surestime le dépassement.</li>
      <li>Diviser le pas par 10 : si le résultat change, le calcul n'est pas encore fiable.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(T_p = 0{,}5\ \text{s}\) : pas d'environ 1 ms, soit 1 000 pas pour simuler 1 s.</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : lire \(\xi\) sans avoir mis le dénominateur sous forme canonique ; mesurer le dépassement par rapport à la consigne et non à la variation finale ; confondre \(\omega_0\), \(\omega_p\) et \(\omega_r\), ou le facteur de résonance \(Q_r\) avec le facteur de qualité \(Q = 1/(2\xi)\) ; croire que le temps de réponse diminue toujours quand \(\xi\) diminue ; prendre pour pseudo-période l'intervalle entre deux passages par la valeur finale (c'en est la moitié).</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Mise sous forme canonique</h3>
  <div class="statement">\(H(p) = \dfrac{100}{p^2 + 6p + 100}\).</div>
  <div class="q"><strong>Q1.</strong> Identifier \(K\), \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q2.</strong> La réponse indicielle est-elle pseudo-périodique, critique ou apériodique ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la pseudo-pulsation \(\omega_p\), le premier dépassement \(D_1\) et l'instant du premier maximum.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0^2 = 100\), donc \(\omega_0 = 10\ \text{rad/s}\) ; \(2\xi\omega_0 = 6\), donc \(\xi = 0{,}3\) ; \(K = 100/\omega_0^2 = 1\). Forme canonique : \(H = \dfrac{1}{1 + 0{,}06p + 0{,}01p^2}\).</p>
    <p><strong>Q2.</strong> \(\xi = 0{,}3 \lt 1\) : régime pseudo-périodique, avec oscillations et dépassement.</p>
    <p><strong>Q3.</strong> \(\omega_p = \omega_0\sqrt{1 - \xi^2} = 10\sqrt{0{,}91} = 9{,}54\ \text{rad/s}\) ; \(D_1 = e^{-0{,}3\pi/0{,}954} = e^{-0{,}99} \approx 37\ \%\) ; premier maximum à \(\pi/\omega_p = 0{,}33\ \text{s}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Identification depuis la réponse indicielle</h3>
  <div class="statement">Un système au repos reçoit un échelon \(E = 2\ \text{V}\). Sa réponse indicielle montre : valeur finale 2 V, premier maximum 2,6 V, pseudo-période \(T_p = 0{,}4\ \text{s}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(K\) et le dépassement \(D_1\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(\xi\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\omega_0\) et écrire \(H(p)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(K = 2/2 = 1\). \(D_1 = (2{,}6 - 2)/2 = 0{,}30\) : le dépassement se rapporte à la variation finale de la sortie.</p>
    <p><strong>Q2.</strong> \(\ln D_1 = -1{,}204\), d'où</p><div class="formula">$$\xi = \frac{1{,}204}{\sqrt{\pi^2 + 1{,}204^2}} \approx 0{,}358.$$</div>
    <p><strong>Q3.</strong> \(\omega_p = 2\pi/T_p = 15{,}7\ \text{rad/s}\), \(\omega_0 = \dfrac{\omega_p}{\sqrt{1 - \xi^2}} = \dfrac{15{,}7}{0{,}934} \approx 16{,}8\ \text{rad/s}\). Avec \(\omega_0^2 \approx 283\) et \(2\xi\omega_0 \approx 12{,}0\) : \(H(p) = \dfrac{283}{p^2 + 12{,}0\,p + 283}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Circuit RLC — 2e ordre</h3>
  <div class="statement">Circuit RLC série : \(R = 10\ \Omega\), \(L = 0{,}1\ \text{H}\), \(C = 100\ \mu\text{F}\). Entrée : tension \(u_e\) ; sortie : tension \(u_C\) aux bornes de \(C\).</div>
  <div class="q"><strong>Q1.</strong> Écrire \(H(p) = U_C(p)/U_e(p)\). Calculer \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q2.</strong> Le circuit présente-t-il une résonance ? Calculer \(\omega_r\) si c'est le cas.</div>
  <div class="q"><strong>Q3.</strong> Quel est le gain maximal, en valeur linéaire et en dB ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u_e = Ri + L\,i' + u_C\) avec \(i = C\,u_C'\), d'où \(LC\,u_C'' + RC\,u_C' + u_C = u_e\), \(H(p) = \dfrac{1}{1 + RCp + LCp^2}\), soit</p><div class="formula">$$H(p) = \frac{10^5}{p^2 + 100p + 10^5}.$$</div><p>\(\omega_0 = \sqrt{10^5} \approx 316\ \text{rad/s}\), \(\xi = \dfrac{R}{2\omega_0 L} = \dfrac{10}{63{,}2} \approx 0{,}158\).</p>
    <p><strong>Q2.</strong> \(\xi = 0{,}158 \lt 1/\sqrt2\) : résonance en \(\omega_r = \omega_0\sqrt{1 - 2\xi^2} = 316\sqrt{0{,}95} \approx 308\ \text{rad/s}\).</p>
    <p><strong>Q3.</strong></p><div class="formula">$$Q_r = \frac{1}{2\xi\sqrt{1 - \xi^2}} = \frac{1}{2 \times 0{,}158 \times 0{,}987} \approx 3{,}2,$$</div><p>soit +10,1 dB : à la résonance, la tension du condensateur vaut plus de trois fois celle du générateur.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Choix du coefficient d'amortissement</h3>
  <div class="statement">Un asservissement doit répondre à un échelon avec un dépassement d'au plus 5 % et un temps de réponse à 5 % le plus court possible. Sa pulsation propre vaut \(\omega_0 = 20\ \text{rad/s}\).</div>
  <div class="q"><strong>Q1.</strong> Quelles valeurs de \(\xi\) respectent la contrainte de dépassement ?</div>
  <div class="q"><strong>Q2.</strong> Expliquer pourquoi le choix optimal est \(\xi \approx 0{,}69\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le premier dépassement, l'instant du premier maximum et le temps de réponse à 5 % pour \(\xi = 0{,}7\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(D_1 \le 0{,}05\) équivaut à \(\dfrac{\pi\xi}{\sqrt{1 - \xi^2}} \geq -\ln 0{,}05 = 3{,}0\), soit \(\xi \geq 0{,}69\) (et tout \(\xi \geq 1\) convient, sans dépassement).</p>
    <p><strong>Q2.</strong> Au-delà de 0,69, plus \(\xi\) est grand, plus la montée est lente : le temps de réponse croît. Pour \(\xi = 0{,}69\), le premier maximum dépasse exactement de 5 % : la sortie entre dans la bande ± 5 % dès qu'elle atteint 95 % de sa valeur finale, et n'en sort plus. C'est le minimum de l'abaque, \(t_{r5\%}\,\omega_0 \approx 2{,}9\). Juste en dessous de 0,69, le premier maximum sort de la bande et le temps de réponse saute à la fin de la première oscillation.</p>
    <p><strong>Q3.</strong> \(D_1 = e^{-0{,}7\pi/0{,}714} = e^{-3{,}08} \approx 4{,}6\ \%\) ; premier maximum en \(\pi/\omega_p = \pi/(20 \times 0{,}714) \approx 0{,}22\ \text{s}\) ; \(t_{r5\%} \approx 2{,}9/20 \approx 0{,}15\ \text{s}\). Le premier maximum survient après \(t_{r5\%}\), mais il reste dans la bande (4,6 % \(\lt\) 5 %).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Suspension automobile — analyse</h3>
  <div class="statement">Un quart de voiture de masse \(m = 350\ \text{kg}\) repose sur une suspension de raideur \(k = 15\,000\ \text{N/m}\) et d'amortisseur \(f = 2\,000\ \text{N}\cdot\text{s/m}\). L'entrée est une force verticale appliquée à la caisse, la sortie son déplacement.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_0\), \(\xi\) et la fréquence propre \(f_0\).</div>
  <div class="q"><strong>Q2.</strong> On pose brusquement une charge sur la caisse (échelon de force). Calculer le premier dépassement et la pseudo-période.</div>
  <div class="q"><strong>Q3.</strong> Pour une suspension plus souple, on veut \(\xi \approx 0{,}3\). Quelle valeur de \(f\) faut-il ?</div>
  <div class="q"><strong>Q4.</strong> Comparer les temps de réponse à 5 % dans les deux cas (abaque : \(t_{r5\%}\,\omega_0 \approx 5{,}2\) pour \(\xi = 0{,}44\) et 10 pour \(\xi = 0{,}3\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0 = \sqrt{k/m} = \sqrt{15\,000/350} \approx 6{,}55\ \text{rad/s}\) ; \(\xi = \dfrac{f}{2\sqrt{km}} = \dfrac{2000}{2 \times 2291} \approx 0{,}44\) ; \(f_0 = \omega_0/(2\pi) \approx 1{,}04\ \text{Hz}\), ordre de grandeur habituel d'une suspension de voiture.</p>
    <p><strong>Q2.</strong> \(D_1 = e^{-0{,}437\pi/0{,}90} \approx e^{-1{,}52} \approx 22\ \%\) ; \(\omega_p = 6{,}55 \times 0{,}90 = 5{,}9\ \text{rad/s}\), \(T_p = 2\pi/5{,}9 \approx 1{,}07\ \text{s}\). La caisse s'enfonce, dépasse sa position finale de 22 %, puis oscille peu.</p>
    <p><strong>Q3.</strong> \(f = 0{,}3 \times 2\sqrt{km}\), soit \(f \approx 1\,375\ \text{N}\cdot\text{s/m}\). Le dépassement monte alors à 37 %.</p>
    <p><strong>Q4.</strong> \(\xi = 0{,}44\) : \(t_{r5\%} \approx 5{,}2/6{,}55 = 0{,}8\ \text{s}\) ; \(\xi = 0{,}3\) : \(t_{r5\%} \approx 10/6{,}55 = 1{,}5\ \text{s}\). La suspension plus souple filtre mieux les petites bosses, mais la caisse met deux fois plus de temps à se stabiliser.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Résonance et facteur de qualité</h3>
  <div class="statement">Un circuit RLC série (sortie aux bornes du condensateur) a pour composants \(L = 10\ \text{mH}\) et \(C = 10\ \text{nF}\). On veut un facteur de qualité \(Q = \dfrac{\omega_0 L}{R} = 10\) (notation de physique, chapitre <a href="#oscill/cours">« Oscillateurs harmoniques »</a>).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_0\), \(f_0\) et la valeur de \(R\).</div>
  <div class="q"><strong>Q2.</strong> Relier \(Q\) et \(\xi\). Calculer le facteur de résonance \(Q_r\) et le gain maximal en dB.</div>
  <div class="q"><strong>Q3.</strong> On admet que, pour un faible amortissement, la largeur du pic de résonance, mesurée 3 dB sous le maximum, vaut \(\Delta\omega \approx \omega_0/Q\). Calculer \(\Delta\omega\) et \(\Delta f\). Ne pas confondre avec la bande passante à \(-3\) dB du passe-bas : que vaut-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0 = \dfrac{1}{\sqrt{LC}} = \dfrac{1}{\sqrt{10^{-2} \times 10^{-8}}} = 10^5\ \text{rad/s}\), \(f_0 = \omega_0/2\pi \approx 15{,}9\ \text{kHz}\), \(R = \dfrac{\omega_0 L}{Q} = \dfrac{10^5 \times 10^{-2}}{10} = 100\ \Omega\).</p>
    <p><strong>Q2.</strong> \(\xi = \dfrac{R}{2}\sqrt{\dfrac{C}{L}} = \dfrac{R}{2\omega_0 L} = \dfrac{1}{2Q} = 0{,}05\). Facteur de résonance \(Q_r = \dfrac{1}{2\xi\sqrt{1 - \xi^2}} = 10{,}01\) : pour un si faible amortissement, \(Q_r \approx Q\). Gain maximal : 10, soit +20 dB.</p>
    <p><strong>Q3.</strong> \(\Delta\omega \approx 10^5/10 = 10^4\ \text{rad/s}\) (le calcul exact donne \(1{,}003 \times 10^4\)), soit \(\Delta f \approx 1{,}6\ \text{kHz}\) : plus \(Q\) est grand, plus le pic est étroit. La bande passante à \(-3\) dB du passe-bas, elle, va de 0 à \(\omega_{BP} \approx 1{,}55\,\omega_0\) (formule du cours, §3) : le gain ne repasse sous \(-3\) dB qu'après la résonance.</p>
  </div>
</div>

    <p>Valeur finale \(s(\infty) = 2\ \text{V}\) ; premier maximum \(s_{\max} = 2{,}6\ \text{V}\) à \(t = 0{,}8\ \text{s}\) ; premier minimum à \(t = 1{,}6\ \text{s}\).</p>

  <div class="q"><strong>Q1.</strong> Calculer le gain \(K\) et le dépassement \(D_1\).</div>
  <div class="q"><strong>Q2.</strong> En déduire le coefficient d'amortissement \(\xi\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\omega_0\) à partir de la pseudo-période \(T_p\), et écrire \(H(p)\).</div>
  <div class="q"><strong>Q4.</strong> Quelle valeur doit prendre la sortie au premier minimum ? Que permet ce contrôle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(K = s(\infty)/E_0 = 2\ \text{V/V}\) ; \(D_1 = \dfrac{2{,}6 - 2}{2} = 0{,}30\), soit 30 %.</p>
    <p><strong>Q2.</strong> \(\ln D_1 = -1{,}204\), \(\xi = \dfrac{1{,}204}{\sqrt{9{,}87 + 1{,}45}} = \dfrac{1{,}204}{3{,}365} \approx 0{,}358\).</p>
    <p><strong>Q3.</strong> Le premier maximum et le premier minimum sont séparés d'une demi-pseudo-période : \(T_p = 2 \times (1{,}6 - 0{,}8) = 1{,}6\ \text{s}\) (on retrouve \(T_p = 2t_1\)). \(\omega_p = 2\pi/1{,}6 = 3{,}93\ \text{rad/s}\) et \(\omega_0 = \dfrac{3{,}93}{\sqrt{1 - 0{,}128}} \approx 4{,}21\ \text{rad/s}\). Avec \(\omega_0^2 = 17{,}7\), \(2\xi\omega_0 = 3{,}01\) et \(K\omega_0^2 = 2 \times 17{,}7\) :</p><div class="formula">$$H(p) = \frac{35{,}4}{p^2 + 3{,}01\,p + 17{,}7}.$$</div>
    <p><strong>Q4.</strong> Au premier minimum, l'écart relatif vaut \(D_1^{\,2} = 0{,}09\) : \(s_{\min} = 2\,(1 - 0{,}09) = 1{,}82\ \text{V}\). Comparer cette prévision à la mesure vérifie que le modèle du deuxième ordre convient, avec un point qui n'a pas servi à l'identifier.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ☆ ☆</span>
  <h3>Lire les performances d'un deuxième ordre</h3>
  <div class="statement">Un système du deuxième ordre a pour fonction de transfert \(H(p) = \dfrac{1}{1 + 0{,}20\,p + 0{,}040\,p^2}\).</div>
  <div class="q"><strong>Q1.</strong> Identifier la pulsation propre \(\omega_0\) et le coefficient d'amortissement \(\xi\). En déduire la nature de la réponse indicielle.</div>
  <div class="q"><strong>Q2.</strong> Calculer le premier dépassement, l'instant du premier maximum et le temps de réponse à 5 % (abaque : \(t_{r5\%}\,\omega_0 \approx 5{,}3\) pour \(\xi = 0{,}5\)).</div>
  <div class="q"><strong>Q3.</strong> Le système présente-t-il une résonance ? Si oui, à quelle pulsation et de combien de décibels ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{1}{\omega_0^2} = 0{,}040\), donc \(\omega_0 = 5{,}0\ \text{rad/s}\) ; \(\dfrac{2\xi}{\omega_0} = 0{,}20\), donc \(\xi = 0{,}50\) ; \(K = 1\). \(\xi \lt 1\) : réponse pseudo-périodique.</p>
    <p><strong>Q2.</strong> \(D_1 = e^{-0{,}5\pi/\sqrt{0{,}75}} = e^{-1{,}81} \approx 16\ \%\) ; \(\omega_p = 5\sqrt{0{,}75} = 4{,}33\ \text{rad/s}\), premier maximum à \(\pi/\omega_p = 0{,}73\ \text{s}\) ; \(t_{r5\%} \approx 5{,}3/5 = 1{,}06\ \text{s}\).</p>
    <p><strong>Q3.</strong> \(\xi = 0{,}5 \lt 0{,}71\) : résonance en \(\omega_r = 5\sqrt{1 - 0{,}5} = 3{,}5\ \text{rad/s}\), de facteur \(Q_r = \dfrac{1}{2 \times 0{,}5\sqrt{0{,}75}} = 1{,}15\), soit +1,2 dB : une résonance faible.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Un capteur de déplacement : impulsion, rampe et sinusoïde</h3>
  <div class="statement">Le capteur de position d'un vérin, avec son conditionneur, se comporte comme un deuxième ordre de gain 1, de pulsation propre \(\omega_0 = 50\ \text{rad/s}\) et de coefficient d'amortissement \(\xi = 0{,}4\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le dépassement de la mesure lors d'un déplacement brusque (échelon), et l'instant de son premier maximum.</div>
  <div class="q"><strong>Q2.</strong> Le vérin sort à vitesse constante \(v = 0{,}2\ \text{m/s}\). De combien la mesure est-elle en retard, en temps et en distance ?</div>
  <div class="q"><strong>Q3.</strong> Un choc bref sur le capteur se comporte comme une impulsion. Décrire l'allure de la réponse et calculer l'instant de son maximum.</div>
  <div class="q"><strong>Q4.</strong> Le vérin vibre sinusoïdalement à \(\omega = 50\ \text{rad/s}\), puis à \(150\ \text{rad/s}\). Calculer dans chaque cas le rapport des amplitudes mesurée et réelle, et le déphasage.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(D_1 = e^{-0{,}4\pi/\sqrt{0{,}84}} = 25\ \%\) ; \(\omega_p = 50\sqrt{0{,}84} = 45{,}8\ \text{rad/s}\), premier maximum à \(\pi/\omega_p = 69\ \text{ms}\). La mesure « exagère » le déplacement d'un quart pendant un instant.</p>
    <p><strong>Q2.</strong> Rampe de pente \(v\) : retard \(\dfrac{2\xi}{\omega_0} = \dfrac{0{,}8}{50} = 16\ \text{ms}\), donc un écart de traînage \(v \times 16\ \text{ms} = 3{,}2\ \text{mm}\).</p>
    <p><strong>Q3.</strong> La réponse impulsionnelle part de 0 avec une pente non nulle, passe par un maximum en \(\dfrac{\arccos 0{,}4}{\omega_p} = \dfrac{1{,}16}{45{,}8} = 25\ \text{ms}\), repasse par 0 à 69 ms (instant du premier maximum de la réponse indicielle) et oscille en s'amortissant autour de 0.</p>
    <p><strong>Q4.</strong> À \(\omega = \omega_0\) : \(|H| = \dfrac{1}{2\xi} = 1{,}25\) et \(\varphi = -90°\) : la mesure exagère la vibration de 25 %. À \(150\ \text{rad/s}\) (\(u = 3\)) :</p><div class="formula">$$|H| = \frac{1}{\sqrt{(1 - 9)^2 + 4 \times 0{,}16 \times 9}} = 0{,}12$$</div><p>et \(\varphi = -180° + \arctan\dfrac{2{,}4}{8} = -163°\) : la vibration est presque effacée de la mesure (voir <a href="#bode/cours">« Bode »</a>, §4, pour la phase quand \(u \gt 1\)).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Un cahier des charges qu'un simple gain ne peut pas tenir</h3>
  <div class="statement">Un axe linéaire est asservi en position avec un retour unitaire ; sa FTBO vaut \(\dfrac{K}{p\,(1 + \tau p)}\), avec \(\tau = 0{,}02\ \text{s}\) et \(K\) (en s⁻¹) réglable par le gain du correcteur proportionnel. Cahier des charges : dépassement d'au plus 10 % ; temps de réponse à 5 % d'au plus 0,15 s ; erreur de traînage d'au plus 2 mm pour une consigne en rampe de 0,1 m/s.</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\omega_0\) et \(\xi\) de la boucle fermée en fonction de \(K\).</div>
  <div class="q"><strong>Q2.</strong> Traduire la contrainte de dépassement en une condition sur \(K\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(\xi = 0{,}7\), calculer \(K\), \(\omega_0\) et le temps de réponse (\(t_{r5\%}\,\omega_0 \approx 2{,}9\)). La rapidité est-elle satisfaite ?</div>
  <div class="q"><strong>Q4.</strong> Traduire la contrainte de traînage en une condition sur \(K\). Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(H_{BF} = \dfrac{1}{1 + \frac{1}{K}p + \frac{\tau}{K}p^2}\) : \(\omega_0 = \sqrt{K/\tau}\) et \(\xi = \dfrac{1}{2\sqrt{K\tau}}\) (cours, §5).</p>
    <p><strong>Q2.</strong> \(D_1 \le 0{,}10\) impose \(\xi \geq 0{,}591\), soit \(K \le \dfrac{1}{4\xi^2\tau} = \dfrac{1}{4 \times 0{,}349 \times 0{,}02} \approx 35{,}8\ \text{s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(K = \dfrac{1}{4 \times 0{,}49 \times 0{,}02} = 25{,}5\ \text{s}^{-1}\), \(\omega_0 = \sqrt{25{,}5/0{,}02} = 35{,}7\ \text{rad/s}\), \(t_{r5\%} \approx 2{,}9/35{,}7 = 0{,}08\ \text{s} \le 0{,}15\ \text{s}\) : oui, avec de la marge.</p>
    <p><strong>Q4.</strong> FTBO de classe 1 : écart de traînage \(\dfrac{a}{K}\) (on retrouve \(\dfrac{2\xi a}{\omega_0}\)). \(\dfrac{0{,}1}{K} \le 0{,}002\) impose \(K \geq 50\ \text{s}^{-1}\), incompatible avec \(K \le 35{,}8\ \text{s}^{-1}\) : avec \(\xi = 0{,}7\), l'écart vaut 3,9 mm ; avec \(K = 50\ \text{s}^{-1}\), \(\xi = 0{,}5\) et le dépassement atteint 16 %. Aucun gain ne satisfait les deux exigences : il faut un correcteur plus élaboré (intégral ou à avance de phase, 2ᵉ année).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Un deuxième ordre apériodique</h3>
  <div class="statement">Un système a pour fonction de transfert \(H(p) = \dfrac{10}{(1 + 0{,}5p)(1 + 0{,}125p)}\).</div>
  <div class="q"><strong>Q1.</strong> Mettre \(H(p)\) sous forme canonique et calculer \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q2.</strong> Décrire l'allure de la réponse indicielle (départ, dépassement, valeur finale pour un échelon unité).</div>
  <div class="q"><strong>Q3.</strong> Calculer le temps de réponse à 5 % avec l'abaque (\(t_{r5\%}\,\omega_0 \approx 6{,}6\) pour \(\xi = 1{,}25\)), puis en ne gardant que la constante de temps la plus lente. Commenter.</div>
  <div class="q"><strong>Q4.</strong> Avec deux constantes de temps égales de 0,5 s, que deviennent \(\xi\), \(\omega_0\) et le temps de réponse ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le dénominateur développé vaut \(1 + 0{,}625p + 0{,}0625p^2\), donc \(\omega_0 = 1/\sqrt{0{,}0625} = 4\ \text{rad/s}\), \(\xi = \dfrac{0{,}625 \times 4}{2} = 1{,}25\), \(K = 10\).</p>
    <p><strong>Q2.</strong> \(\xi \gt 1\) : réponse apériodique, départ à tangente horizontale, aucun dépassement, valeur finale 10.</p>
    <p><strong>Q3.</strong> \(t_{r5\%} \approx 6{,}6/4 = 1{,}64\ \text{s}\). En ne gardant que \(\tau_1 = 0{,}5\ \text{s}\) : \(3\tau_1 = 1{,}5\ \text{s}\), soit 9 % de moins. Le pôle rapide (\(-8\ \text{s}^{-1}\)) ne fait qu'arrondir et retarder un peu le départ : l'approximation par la constante de temps dominante est raisonnable ici (sa justification relève de la 2ᵉ année).</p>
    <p><strong>Q4.</strong> \((1 + 0{,}5p)^2 = 1 + p + 0{,}25p^2\) : \(\omega_0 = 2\ \text{rad/s}\), \(\xi = 1\) (régime critique), \(t_{r5\%} \approx 4{,}75/2 = 2{,}4\ \text{s}\) : bien plus lent que \(3 \times 0{,}5 = 1{,}5\ \text{s}\). Deux pôles égaux ne se « dominent » pas l'un l'autre.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Asservissement en position d'une antenne de suivi de satellites</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>identification et réglage d'un asservissement du deuxième ordre</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    <p>Une antenne de réception oriente sa parabole en site (angle \(\theta\)) grâce à un moteur à courant continu et à un réducteur. Un capteur angulaire et un adaptateur permettent de se ramener à un retour unitaire ; le correcteur est proportionnel : \(u = K_c\,(\theta_c - \theta)\). Le variateur est alimenté sous 24 V.</p>
  </div>

  <p class="exo-part">Partie A — Identification de la motorisation</p>
  <div class="statement">À l'arrêt, on applique au moteur un échelon de 10 V : la vitesse de rotation de l'antenne croît sans dépassement, avec une pente non nulle au départ, vers 0,50 rad/s ; elle vaut 0,316 rad/s au bout de 0,08 s.</div>
  <div class="q"><strong>A1.</strong> Proposer un modèle \(\dfrac{\Omega(p)}{U(p)}\) et identifier ses paramètres \(K_m\) et \(\tau_m\).</div>
  <div class="q"><strong>A2.</strong> En déduire \(\dfrac{\theta(p)}{U(p)}\). Quelle constante de temps ce modèle néglige-t-il ?</div>

  <p class="exo-part">Partie B — Réglage du gain</p>

  <p class="exo-part">Partie D — Suivi d'un satellite</p>
  <div class="q"><strong>D1.</strong> Pour suivre un satellite, la consigne est une rampe de pente \(a = 5\ \text{mrad/s}\). Calculer l'erreur de traînage prévue par le modèle avec \(K_c = 130\ \text{V/rad}\).</div>
  <div class="q"><strong>D2.</strong> La largeur du faisceau de l'antenne impose une erreur de pointage d'au plus 0,2 mrad. Quel gain de boucle faudrait-il ? Que deviendraient \(\xi\) et le dépassement ? Conclure.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Pente non nulle au départ, pas de dépassement, palier : premier ordre \(\dfrac{\Omega}{U} = \dfrac{K_m}{1 + \tau_m p}\). \(K_m = \dfrac{0{,}50}{10} = 0{,}050\ \text{rad}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\) ; \(0{,}316 = 0{,}632 \times 0{,}50\) : 63 % atteint à \(\tau_m = 0{,}08\ \text{s}\).</p>
    <p><strong>A2.</strong> \(\theta = \Omega/p\), donc \(\dfrac{\theta(p)}{U(p)} = \dfrac{K_m}{p\,(1 + \tau_m p)}\). Ce modèle néglige la constante de temps électrique \(L/R\) du moteur (inductance de l'induit).</p>
    <p><strong>B1.</strong> FTBO \(\dfrac{K_cK_m}{p\,(1 + \tau_m p)}\), d'où \(H_{BF} = \dfrac{1}{1 + \frac{1}{K_cK_m}\,p + \frac{\tau_m}{K_cK_m}\,p^2}\) : gain 1, \(\omega_0 = \sqrt{\dfrac{K_cK_m}{\tau_m}}\), \(\xi = \dfrac{1}{2\sqrt{K_cK_m\tau_m}}\).</p>
    <p><strong>B2.</strong> \(D_1 \le 5\ \%\) impose \(\xi \geq 0{,}69\), donc \(K_cK_m \le \dfrac{1}{4 \times 0{,}69^2 \times 0{,}08} = 6{,}56\ \text{s}^{-1}\) et \(K_c \le 131\ \text{V/rad}\) ; le plus rapide est d'être juste à cette limite. Avec \(K_c = 130\ \text{V/rad}\) : \(K_cK_m = 6{,}5\ \text{s}^{-1}\), \(\xi = \dfrac{1}{2\sqrt{0{,}52}} = 0{,}69\), \(\omega_0 = \sqrt{6{,}5/0{,}08} = 9{,}0\ \text{rad/s}\), \(D_1 = 4{,}9\ \%\), premier maximum à \(\dfrac{\pi}{9{,}0\sqrt{1 - 0{,}48}} = 0{,}48\ \text{s}\), \(t_{r5\%} \approx 2{,}9/9{,}0 = 0{,}32\ \text{s}\).</p>
    <p><strong>B3.</strong> \(u(0^+) = 130 \times 0{,}2 = 26\ \text{V}\), un peu plus que les 24 V disponibles : le variateur sature brièvement au départ, ce qui ralentit légèrement la montée. Le modèle linéaire reste acceptable pour des échelons d'au plus 0,18 rad ; au-delà, il devient optimiste.</p>
    <p><strong>C1.</strong> Maximum 219 mrad à 0,46 s : \(D_1 = 19/200 = 0{,}095\), \(\ln D_1 = -2{,}35\), \(\xi = \dfrac{2{,}35}{\sqrt{9{,}87 + 5{,}54}} = 0{,}60\) ; \(\omega_p = \pi/0{,}46 = 6{,}8\ \text{rad/s}\), \(\omega_0 = \dfrac{6{,}8}{\sqrt{1 - 0{,}36}} = 8{,}5\ \text{rad/s}\). Pour \(\xi = 0{,}6\), \(t_{r5\%}\,\omega_0 \approx 5{,}2\) : \(t_{r5\%} \approx 0{,}6\ \text{s}\), ce que confirme la courbe (elle redescend sous 210 mrad vers 0,6 s).</p>
    <p><strong>C2.</strong> Le système réel est moins amorti (\(\xi = 0{,}60\) au lieu de 0,69), un peu moins rapide en pulsation (8,5 au lieu de 9,0 rad/s), et son temps de réponse est presque doublé (0,6 s au lieu de 0,32 s), car le dépassement sort de la bande des 5 %. L'hypothèse en cause est celle de A2 : la constante de temps électrique négligée ajoute un retard dans la boucle, qui diminue l'amortissement. La saturation de B3, elle, ralentirait la montée sans augmenter le dépassement.</p>
    <p><strong>C3.</strong> Diminuer \(K_c\) par petits pas, en relevant la réponse (ou en la simulant avec un modèle complété par la constante électrique, par la méthode d'Euler), jusqu'à obtenir 5 % de dépassement ; ou identifier la constante électrique, puis régler \(K_c\) sur le modèle d'ordre 3 avec les marges de stabilité (chapitre <a href="#stabilite/cours">« Stabilité des systèmes asservis »</a>).</p>
    <p><strong>D1.</strong> FTBO de classe 1 : \(\varepsilon_v = \dfrac{a}{K_cK_m} = \dfrac{5}{6{,}5} = 0{,}77\ \text{mrad}\) (environ 0,04°), ce qui est aussi \(\dfrac{2\xi a}{\omega_0}\).</p>
    <p><strong>D2.</strong> Il faudrait \(K_cK_m \geq 5/0{,}2 = 25\ \text{s}^{-1}\), presque quatre fois plus. Alors \(\xi = \dfrac{1}{2\sqrt{25 \times 0{,}08}} = 0{,}35\) et le dépassement atteindrait 31 % (davantage encore sur le système réel). Un correcteur proportionnel ne peut pas concilier précision en poursuite et amortissement : il faut ajouter une action intégrale (correcteur PI, 2ᵉ année), qui annule l'erreur de traînage sans augmenter le gain aux pulsations où se joue l'amortissement.</p>
