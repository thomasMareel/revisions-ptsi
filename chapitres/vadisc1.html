<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties e) « Loi d'une variable aléatoire discrète » et g) « Variables aléatoires indépendantes » de la section « Variables aléatoires discrètes » du programme de PT. Il prolonge la 1ʳᵉ année, où les variables ne prenaient qu'un nombre fini de valeurs, aux variables qui en prennent une infinité dénombrable. La définition d'une variable aléatoire discrète est posée dans le chapitre « Tribus et ensembles dénombrables », les probabilités conditionnelles et l'indépendance d'événements dans « Espaces probabilisés » ; l'espérance, la variance et les fonctions génératrices sont l'objet du chapitre « Variables aléatoires discrètes II ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Loi d'une variable discrète</strong> : la loi \(P_X\) est déterminée par la distribution \(\big(P(X = x)\big)_{x \in X(\Omega)}\) ; notation \(X \sim Y\) (§1).</li>
        <li><strong>Variable \(f(X)\)</strong> : sa loi ; si \(X \sim Y\), alors \(f(X) \sim f(Y)\) (§2).</li>
        <li><strong>Rappels de 1ʳᵉ année</strong> : lois uniforme, de Bernoulli et binomiale (§3).</li>
        <li><strong>Loi géométrique</strong> \(\mathcal{G}(p)\), \(p \in \,]0, 1[\) : interprétation comme rang du premier succès dans une suite illimitée d'épreuves de Bernoulli indépendantes de même paramètre (§4).</li>
        <li><strong>Loi de Poisson</strong> \(\mathcal{P}(\lambda)\), \(\lambda \gt 0\) : interprétation comme loi des événements rares (§5).</li>
        <li><strong>Couples</strong> : un couple de variables est une variable à valeurs dans un produit ; loi conjointe, lois marginales, notation \(P(X = x, Y = y)\) ; extension aux \(n\)-uplets (§6).</li>
        <li><strong>Loi conditionnelle</strong> d'une variable sachant un événement (§7).</li>
        <li><strong>Indépendance</strong> de deux variables, notation \(X \perp\!\!\!\perp Y\), caractérisation par la loi conjointe ; extension à \(n\) variables ; suites de variables indépendantes, suites i.i.d. ; modélisation du pile ou face infini (§8).</li>
        <li><strong>Fonctions de variables indépendantes</strong> et <strong>lemme des coalitions</strong> (§8) ; lois d'une somme, d'un minimum, d'un maximum (§9). Tableau des lois usuelles (§10).</li>
      </ul>
      <p>Hors programme : la construction d'un espace probabilisé portant une suite de variables indépendantes (son existence est admise), toute autre notion sur la dénombrabilité, les lois de Pascal et hypergéométrique, les variables à densité (fin du chapitre).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · VARIABLE ALÉATOIRE DISCRÈTE ET LOI</div>
  <h2>Résumer une expérience par une valeur</h2>
  <div class="intro">Une variable aléatoire discrète associe à chaque issue de l'expérience une valeur choisie dans une liste finie ou dénombrable. Une fois sa loi connue, on peut oublier l'univers : toutes les probabilités qui portent sur la variable se calculent à partir de cette seule loi.</div>

  <div class="def-box">
    <strong>Rappel.</strong> Sur un espace probabilisé \((\Omega, \mathcal{A}, P)\), une <strong>variable aléatoire discrète</strong> est une application \(X\) définie sur \(\Omega\) telle que l'ensemble \(X(\Omega)\) de ses valeurs est <strong>au plus dénombrable</strong> et que, pour tout \(x \in X(\Omega)\), l'ensemble \(X^{-1}(\{x\}) = \{\omega \in \Omega,\ X(\omega) = x\}\) est un <strong>événement</strong>. On note cet événement \((X = x)\) ou \(\{X = x\}\), et \((X \in A)\) l'événement « \(X\) prend sa valeur dans \(A\) ». Lorsque \(X\) est à valeurs réelles, on écrit aussi \((X \geq x)\), \((X \lt x)\), etc.
  </div>
  <p>Pour \(A\) quelconque, \((X \in A)\) est la réunion des \((X = x)\) pour \(x \in A \cap X(\Omega)\) : une réunion au plus dénombrable d'événements, donc un événement. En pratique l'univers \(\Omega\) n'est presque jamais décrit : on raisonne directement sur les événements \((X = x)\).</p>

  <div class="prop-box">
    <strong>Loi d'une variable discrète.</strong> Les événements \((X = x)\), \(x \in X(\Omega)\), forment un <strong>système complet</strong> : ils sont deux à deux incompatibles et leur réunion est \(\Omega\). Par σ-additivité, pour toute partie \(A\) :
    <div class="formula" data-nom="Probabilité d'un événement lié à X">$$\begin{aligned} P(X \in A) &= \sum_{x \in A \cap X(\Omega)} P(X = x), \\ \sum_{x \in X(\Omega)} P(X = x) &= 1. \end{aligned}$$</div>
    L'application \(P_X : A \mapsto P(X \in A)\), définie sur les parties de \(X(\Omega)\), est une probabilité : c'est la <strong>loi</strong> de \(X\). Elle est entièrement déterminée par la <strong>distribution de probabilités</strong> \(\big(P(X = x)\big)_{x \in X(\Omega)}\).
  </div>
  <p>Quand \(X(\Omega)\) est infini, ces sommes sont des sommes de séries à termes positifs : leur valeur ne dépend pas de l'ordre dans lequel on énumère les valeurs (résultat admis par le programme). Réciproquement, toute famille de réels positifs de somme 1, indexée par un ensemble au plus dénombrable, est la loi d'une variable aléatoire sur un espace convenable ; on l'admet, ce qui permet de parler librement d'« une variable de loi donnée ».</p>

  <div class="def-box">
    Deux variables discrètes \(X\) et \(Y\) <strong>suivent la même loi</strong>, ce que l'on note \(X \sim Y\), si \(P_X = P_Y\), c'est-à-dire si \(P(X = x) = P(Y = x)\) pour toute valeur \(x\). Elles peuvent être définies sur des espaces probabilisés différents.
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre « même loi » et « égales ». Si l'on lance une pièce équilibrée, la variable \(X\) qui vaut 1 sur pile et 0 sur face, et \(Y = 1 - X\), suivent la même loi (1 et 0 ont chacun la probabilité \(\tfrac12\)), alors que \(X\) et \(Y\) ne sont <strong>jamais</strong> égales.</div>

  <div class="method-box">
    <strong>Exemple — une loi donnée par une série</strong>
    <p>On cherche \(c\) tel que \(P(X = n) = \dfrac{c}{n(n+1)}\) pour \(n \in \mathbb{N}^*\) définisse une loi, puis on calcule quelques probabilités.</p>
    <ol>
      <li>Comme \(\dfrac{1}{n(n+1)} = \dfrac{1}{n} - \dfrac{1}{n+1}\), la somme partielle télescopique vaut \(\sum_{n=1}^{N} \frac{1}{n(n+1)} = 1 - \frac{1}{N+1} \to 1\). La condition \(\sum P(X = n) = 1\) impose \(c = 1\).</li>
      <li>Même télescopage à partir du rang \(n\) : \(P(X \geq n) = \sum_{k \geq n} \left(\frac1k - \frac{1}{k+1}\right) = \frac1n\). Ainsi \(P(X \geq 10) = 0{,}1\) : les grandes valeurs restent assez probables.</li>
      <li>Probabilité que \(X\) soit pair :
        <div class="formula">$$P(X \in 2\mathbb{N}^*) = \sum_{k \geq 1} \left(\frac{1}{2k} - \frac{1}{2k+1}\right) = \frac12 - \frac13 + \frac14 - \frac15 + \cdots$$</div>
        On reconnaît la série \(1 - \frac12 + \frac13 - \frac14 + \cdots = \ln 2\) privée de son premier terme et changée de signe (regrouper deux à deux les termes d'une série convergente ne change pas sa somme) : \(P(X \text{ pair}) = 1 - \ln 2 \approx 0{,}307\), et \(P(X \text{ impair}) = \ln 2 \approx 0{,}693\).</li>
    </ol>
    <p>Cette loi reviendra dans le chapitre suivant : c'est l'exemple type d'une variable sans espérance finie.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · FONCTION D'UNE VARIABLE ALÉATOIRE</div>
  <h2>Transformer une variable en une autre</h2>
  <div class="intro">Le carré d'une variable, sa partie entière, un gain calculé à partir d'un résultat, la parité d'un rang : toutes ces grandeurs sont des variables de la forme \(f(X)\), dont la loi se déduit de celle de \(X\).</div>

  <div class="prop-box">
    <strong>Variable \(f(X)\).</strong> Soit \(X\) une variable discrète et \(f\) une fonction définie sur \(X(\Omega)\). Alors \(f(X) = f \circ X\) est une variable aléatoire discrète, d'ensemble de valeurs \(f\big(X(\Omega)\big)\), et pour toute valeur \(y\) :
    <div class="formula" data-nom="Loi de f(X)">$$P\big(f(X) = y\big) = \sum_{x \in X(\Omega),\ f(x) = y} P(X = x).$$</div>
    En particulier, <strong>si \(X \sim Y\), alors \(f(X) \sim f(Y)\)</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi \(f(X)\) est une variable discrète, et pourquoi sa loi ne dépend que de celle de \(X\).</span>
    <div class="content"><p>L'image d'un ensemble au plus dénombrable est au plus dénombrable, donc \(f\big(X(\Omega)\big)\) l'est. Pour une valeur \(y\), l'événement \(\big(f(X) = y\big)\) est la réunion des \((X = x)\) pour les \(x\) de \(X(\Omega)\) tels que \(f(x) = y\) : réunion au plus dénombrable d'événements deux à deux incompatibles. C'est donc un événement, et la σ-additivité donne la formule. Celle-ci ne fait intervenir que les nombres \(P(X = x)\) : deux variables de même loi ont des images par \(f\) de même loi. (Le programme ne demande pas de soulever d'autre difficulté.)</p></div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier qu'une fonction non injective regroupe plusieurs valeurs. Si \(X\) prend les valeurs \(-2, -1, 0, 1, 2\), alors \(P(X^2 = 4) = P(X = -2) + P(X = 2)\), et non \(P(X = 2)\).</div>

  <div class="method-box">
    <strong>Exemple — parité et troncature</strong>
    <p>On reprend la variable \(X\) du §1, de loi \(P(X = n) = \frac{1}{n(n+1)}\) sur \(\mathbb{N}^*\).</p>
    <ol>
      <li>\(Y = (-1)^X\) prend les valeurs \(1\) et \(-1\) : \(P(Y = 1) = P(X \text{ pair}) = 1 - \ln 2\) et \(P(Y = -1) = \ln 2\).</li>
      <li>\(Z = \min(X, 3)\) prend les valeurs 1, 2, 3 : \(P(Z = 1) = P(X = 1) = \frac12\), \(P(Z = 2) = \frac16\), et \(P(Z = 3) = P(X \geq 3) = \frac13\). Contrôle : \(\frac12 + \frac16 + \frac13 = 1\).</li>
    </ol>
  </div>

  <h3>Décrire une loi par ses queues</h3>
  <p>Pour une variable à valeurs entières, les probabilités \(P(X \gt k)\) (ou \(P(X \leq k)\)) contiennent toute l'information sur la loi, et elles se calculent souvent plus facilement que les \(P(X = k)\) : c'est le cas des rangs d'attente, des minimums et des maximums.</p>
  <div class="method-box">
    <strong>Méthode — passer par les queues</strong>
    <ol>
      <li>Calculer \(P(X \gt k)\) pour tout entier \(k\), en décrivant l'événement \((X \gt k)\) en mots (« rien ne s'est produit avant le rang \(k + 1\) », « toutes les valeurs dépassent \(k\) »…).</li>
      <li>En déduire la loi : comme \((X \gt k - 1)\) est la réunion disjointe de \((X = k)\) et de \((X \gt k)\),
        <div class="formula" data-nom="Loi à partir des queues">$$P(X = k) = P(X \gt k - 1) - P(X \gt k) = P(X \geq k) - P(X \geq k + 1).$$</div></li>
    </ol>
    <p>Sur l'exemple du §1 : \(P(X \geq n) = \frac1n\) redonne bien \(P(X = n) = \frac1n - \frac{1}{n+1}\).</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LOIS FINIES USUELLES : RAPPELS</div>
  <h2>Les lois de première année</h2>
  <div class="intro">Les lois à support fini vues en 1ʳᵉ année restent les briques de base. On les rappelle avec la situation qu'elles modélisent : savoir reconnaître la situation est plus important que retenir la formule.</div>

  <div class="def-box">
    <ul>
      <li><strong>Variable certaine</strong> : \(P(X = a) = 1\). Plus généralement, \(X\) est <strong>presque sûrement constante</strong> s'il existe \(a\) tel que \(P(X = a) = 1\).</li>
      <li><strong>Loi uniforme</strong> sur un ensemble fini \(E\) de cardinal \(n\), notée \(\mathcal{U}(E)\) : \(P(X = x) = \frac1n\) pour tout \(x \in E\). Par exemple, le résultat d'un dé équilibré suit \(\mathcal{U}([\![ 1, 6 ]\!])\).</li>
      <li><strong>Loi de Bernoulli</strong> \(\mathcal{B}(p)\), \(p \in [0, 1]\) : \(X\) prend les valeurs 0 et 1, avec \(P(X = 1) = p\) et \(P(X = 0) = 1 - p\). L'<strong>indicatrice</strong> \(\mathbf{1}_A\) d'un événement \(A\) (égale à 1 sur \(A\), 0 ailleurs) suit la loi \(\mathcal{B}\big(P(A)\big)\).</li>
      <li><strong>Loi binomiale</strong> \(\mathcal{B}(n, p)\), \(n \in \mathbb{N}^*\), \(p \in [0, 1]\) : \(X(\Omega) = [\![ 0, n ]\!]\) et
        <div class="formula" data-nom="Loi binomiale">$$P(X = k) = \binom{n}{k}\,p^k (1-p)^{n-k}, \qquad 0 \leq k \leq n.$$</div>
        La formule du binôme donne \(\sum_k P(X = k) = \big(p + (1 - p)\big)^n = 1\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Interprétation de la loi binomiale.</strong> Si \(X_1, \ldots, X_n\) sont des variables indépendantes (§8) de même loi \(\mathcal{B}(p)\), alors \(S = X_1 + \cdots + X_n\) suit la loi \(\mathcal{B}(n, p)\) : c'est le <strong>nombre de succès</strong> obtenus en répétant \(n\) fois, de façon indépendante, une épreuve qui réussit avec la probabilité \(p\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi le coefficient binomial apparaît.</span>
    <div class="content"><p>L'événement \((S = k)\) est la réunion disjointe, sur les parties \(I\) de \([\![ 1, n ]\!]\) à \(k\) éléments, des événements « \(X_i = 1\) pour \(i \in I\) et \(X_i = 0\) pour \(i \notin I\) ». Par indépendance, chacun a la probabilité \(p^k(1-p)^{n-k}\), et il y a \(\binom{n}{k}\) telles parties.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — répondre au hasard à un QCM</strong>
    <p>Un QCM comporte 8 questions indépendantes ; chacune propose 4 réponses dont une seule est juste. Un candidat répond au hasard. Le nombre \(X\) de bonnes réponses compte les succès de 8 épreuves indépendantes de probabilité \(\frac14\) : \(X \sim \mathcal{B}(8, \frac14)\).</p>
    <ol>
      <li>Avoir au moins 6 bonnes réponses :
        <div class="formula">$$P(X \geq 6) = \frac{\binom86 3^2 + \binom87 3 + \binom88}{4^8} = \frac{252 + 24 + 1}{65\,536} = \frac{277}{65\,536} \approx 0{,}0042.$$</div></li>
      <li>En avoir au plus 2 :
        <div class="formula">$$P(X \leq 2) = \frac{3^8 + 8 \cdot 3^7 + 28 \cdot 3^6}{4^8} = \frac{44\,469}{65\,536} \approx 0{,}68.$$</div>
        </li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la loi binomiale à des tirages <strong>sans remise</strong>. Les tirages successifs n'y sont plus indépendants (la composition de l'urne change) et le nombre de boules d'une couleur ne suit pas une loi binomiale.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LOI GÉOMÉTRIQUE</div>
  <h2>Le temps d'attente du premier succès</h2>
  <div class="intro">Première loi à support infini du chapitre : on répète indéfiniment la même épreuve, de façon indépendante, et l'on note le rang du premier succès. Aucune borne a priori n'existe pour ce rang, d'où la nécessité du cadre dénombrable.</div>

  <div class="def-box">
    Soit \(p \in \,]0, 1[\). Une variable \(X\) suit la <strong>loi géométrique</strong> de paramètre \(p\), ce que l'on note \(X \sim \mathcal{G}(p)\), si \(X(\Omega) = \mathbb{N}^*\) et
    <div class="formula" data-nom="Loi géométrique">$$P(X = k) = p\,(1-p)^{k-1}, \qquad k \in \mathbb{N}^*.$$</div>
    C'est bien une loi : \(\sum_{k \geq 1} p(1-p)^{k-1} = \dfrac{p}{1 - (1 - p)} = 1\) (série géométrique de raison \(1 - p \in \,]0, 1[\)).
  </div>

  <div class="prop-box">
    <strong>Rang du premier succès.</strong> Soit \((X_n)_{n \geq 1}\) une suite de variables indépendantes de loi \(\mathcal{B}(p)\) (« succès au rang \(n\) » signifie \(X_n = 1\)). Il est presque sûr qu'un succès se produit, et le rang \(T\) du premier succès suit la loi \(\mathcal{G}(p)\). De plus :
    <div class="formula" data-nom="Queue de la loi géométrique">$$P(T \gt k) = (1-p)^k, \qquad k \in \mathbb{N}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Décrire les événements \((T = k)\), \((T \gt k)\) et « jamais de succès ».</span>
    <div class="content">
      <p>Pour \(k \geq 1\), le premier succès a lieu au rang \(k\) si et seulement si les \(k - 1\) premières épreuves échouent et la \(k\)-ième réussit :</p>
      <div class="formula">$$\begin{aligned} (T = k) &= (X_1 = 0) \cap \cdots \cap (X_{k-1} = 0) \cap (X_k = 1), \\ (T \gt k) &= (X_1 = 0) \cap \cdots \cap (X_k = 0). \end{aligned}$$</div>
      <p>Par indépendance, \(P(T = k) = (1-p)^{k-1}p\) et \(P(T \gt k) = (1-p)^k\).</p>
      <p>L'événement « aucun succès » est l'intersection des événements décroissants \(B_k = (X_1 = 0) \cap \cdots \cap (X_k = 0)\). Par continuité décroissante, sa probabilité vaut \(\lim_k (1-p)^k = 0\) : il est négligeable. Sur cet événement, on donne à \(T\) une valeur arbitraire, ce qui ne change aucune probabilité calculée.</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Absence de mémoire.</strong> Si \(X \sim \mathcal{G}(p)\), pour tous entiers \(n, k \geq 0\) :
    <div class="formula" data-nom="Absence de mémoire (loi géométrique)">$$P(X \gt n + k \mid X \gt n) = P(X \gt k).$$</div>
    Avoir attendu \(n\) épreuves sans succès ne change pas la loi de l'attente restante : les épreuves ne « se souviennent » pas des échecs passés.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le calcul direct, puis la réciproque : seule la loi géométrique est sans mémoire sur \(\mathbb{N}^*\).</span>
    <div class="content">
      <p>Comme \((X \gt n + k) \subset (X \gt n)\), l'intersection des deux événements est \((X \gt n + k)\), et</p>
      <div class="formula">$$P(X \gt n + k \mid X \gt n) = \frac{P(X \gt n + k)}{P(X \gt n)} = \frac{(1-p)^{n+k}}{(1-p)^n} = (1-p)^k = P(X \gt k).$$</div>
      <p>Réciproquement, soit \(X\) à valeurs dans \(\mathbb{N}^*\) telle que \(u_n = P(X \gt n)\) soit non nul pour tout \(n\) et vérifie la propriété. Alors \(u_{n+k} = u_n u_k\), donc \(u_n = u_1^n\) par récurrence (et \(u_0 = 1\)). Les événements \((X \gt n)\) décroissent vers l'événement impossible, donc \(u_n \to 0\) (continuité décroissante) : \(q = u_1\) vérifie \(0 \lt q \lt 1\). Alors \(P(X = n) = u_{n-1} - u_n = (1 - q)\,q^{n-1}\) : \(X \sim \mathcal{G}(1 - q)\).</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — attendre un double</strong>
    <p>On lance deux dés équilibrés jusqu'à obtenir un double. Chaque lancer donne un double avec la probabilité \(p = \frac{6}{36} = \frac16\), indépendamment des autres : le nombre \(T\) de lancers suit \(\mathcal{G}(\frac16)\).</p>
    <ol>
      <li>\(P(T = 3) = \left(\frac56\right)^2 \frac16 = \frac{25}{216} \approx 0{,}116\).</li>
      <li>\(P(T \gt 6) = \left(\frac56\right)^6 \approx 0{,}335\) : une fois sur trois, six lancers ne suffisent pas.</li>
      <li>Probabilité que \(T\) soit pair :
        <div class="formula">$$P(T \in 2\mathbb{N}^*) = \sum_{j \geq 1} p(1-p)^{2j-1} = \frac{p(1-p)}{1 - (1-p)^2} = \frac{1-p}{2-p} = \frac{5}{11} \approx 0{,}455.$$</div>
        </li>
      <li>Sachant que les 4 premiers lancers ont échoué, la probabilité qu'il en faille plus de 7 au total vaut \(P(T \gt 7 \mid T \gt 4) = P(T \gt 3) = \left(\frac56\right)^3 \approx 0{,}579\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre le rang du premier succès \(T \in \mathbb{N}^*\) et le nombre d'échecs qui le précèdent, \(T - 1 \in \mathbb{N}\), de loi \(P(T - 1 = k) = p(1-p)^k\). Dans le programme, \(\mathcal{G}(p)\) désigne toujours la loi sur \(\mathbb{N}^*\) : vérifier la plus petite valeur possible avant d'utiliser une formule.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LOI DE POISSON</div>
  <h2>La loi des événements rares</h2>
  <div class="intro">La loi de Poisson ne décrit pas un rang mais un comptage : nombre de pannes dans la journée, de désintégrations en une seconde, de fautes dans un livre, d'appels reçus en une heure. Elle apparaît chaque fois que l'on compte des événements individuellement très improbables parmi un très grand nombre d'occasions indépendantes.</div>

  <div class="def-box">
    Soit \(\lambda \gt 0\). Une variable \(X\) suit la <strong>loi de Poisson</strong> de paramètre \(\lambda\), ce que l'on note \(X \sim \mathcal{P}(\lambda)\), si \(X(\Omega) = \mathbb{N}\) et
    <div class="formula" data-nom="Loi de Poisson">$$P(X = k) = e^{-\lambda}\,\frac{\lambda^k}{k!}, \qquad k \in \mathbb{N}.$$</div>
    C'est bien une loi grâce à la série exponentielle : \(\sum_{k \geq 0} \frac{\lambda^k}{k!} = e^{\lambda}\).
  </div>
  <p>Le paramètre \(\lambda\) est le nombre moyen d'événements (on le montrera au chapitre suivant : \(E(X) = \lambda\)). La forme de la loi se lit sur le rapport de deux probabilités consécutives, \(\dfrac{P(X = k+1)}{P(X = k)} = \dfrac{\lambda}{k+1}\) : les probabilités croissent tant que \(k + 1 \lt \lambda\), puis décroissent très vite.</p>

  <div class="prop-box">
    <strong>Approximation de la loi binomiale par la loi de Poisson.</strong> Soit \(\lambda \gt 0\) et \((p_n)\) une suite de \([0, 1]\) telle que \(n\,p_n \to \lambda\). Si \(X_n \sim \mathcal{B}(n, p_n)\), alors pour tout entier \(k\) :
    <div class="formula" data-nom="Binomiale vers Poisson">$$\lim_{n \to +\infty} P(X_n = k) = e^{-\lambda}\,\frac{\lambda^k}{k!}.$$</div>
    En pratique, on remplace \(\mathcal{B}(n, p)\) par \(\mathcal{P}(np)\) quand \(n\) est grand et \(p\) petit (par exemple \(n \geq 30\) et \(p \leq 0{,}1\)) : c'est le sens de « loi des événements rares ».
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Séparer le coefficient binomial et le facteur \((1 - p_n)^{n-k}\).</span>
    <div class="content">
      <p>Fixons \(k\). Pour \(n \geq k\), en écrivant \(\binom{n}{k} = \frac{n(n-1)\cdots(n-k+1)}{k!}\) :</p>
      <div class="formula">$$P(X_n = k) = \frac{1}{k!}\left(\prod_{j=0}^{k-1} (n - j)\,p_n\right)(1 - p_n)^{n-k}.$$</div>
      <p>Comme \(n p_n\) converge, \(p_n = \frac{n p_n}{n} \to 0\). Chaque facteur \((n - j)p_n = n p_n - j p_n\) tend donc vers \(\lambda\), et le produit des \(k\) facteurs vers \(\lambda^k\).</p>
      <p>Pour \(n\) assez grand, \(p_n \lt 1\) et \((1 - p_n)^{n-k} = \exp\big((n - k)\ln(1 - p_n)\big)\). Puisque \(p_n \to 0\), \(\ln(1 - p_n) \sim -p_n\), d'où \((n - k)\ln(1 - p_n) \sim -(n - k)p_n\), qui tend vers \(-\lambda\). Par continuité de l'exponentielle, \((1 - p_n)^{n-k} \to e^{-\lambda}\), ce qui conclut.</p>
    </div>
  </div>

    <strong>Exemple — composants défectueux</strong>
    <p>Un lot contient 2 000 composants ; chacun est défectueux avec la probabilité 0,001, indépendamment des autres. Le nombre \(X\) de composants défectueux suit \(\mathcal{B}(2000\,;\, 0{,}001)\), que l'on approche par \(\mathcal{P}(2)\) puisque \(np = 2\).</p>

<div class="course-section">
  <div class="sec-num">§6 · COUPLES ET n-UPLETS DE VARIABLES ALÉATOIRES</div>
  <h2>Étudier deux variables ensemble</h2>
  <div class="intro">Pour étudier le lien entre deux grandeurs aléatoires, ou une grandeur qui dépend des deux (leur somme, leur écart, leur maximum), la loi de chacune ne suffit pas : il faut la loi du couple.</div>

  <div class="def-box">
    Soit \(X\) et \(Y\) deux variables discrètes définies sur le même espace \((\Omega, \mathcal{A}, P)\). Le <strong>couple</strong> \((X, Y) : \omega \mapsto \big(X(\omega), Y(\omega)\big)\) est une variable aléatoire discrète à valeurs dans un produit : ses valeurs sont dans \(X(\Omega) \times Y(\Omega)\), produit de deux ensembles au plus dénombrables, donc au plus dénombrable, et \(\big((X, Y) = (x, y)\big) = (X = x) \cap (Y = y)\) est un événement, noté \((X = x, Y = y)\).
    <ul>
      <li>La <strong>loi conjointe</strong> de \(X\) et \(Y\) est la loi du couple, donnée par la famille des \(P(X = x, Y = y)\).</li>
      <li>Les <strong>lois marginales</strong> sont les lois de \(X\) et de \(Y\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Lois marginales.</strong> La loi conjointe détermine les lois marginales : pour tout \(x \in X(\Omega)\) et tout \(y \in Y(\Omega)\),
    <div class="formula" data-nom="Lois marginales">$$\begin{aligned} P(X = x) &= \sum_{y \in Y(\Omega)} P(X = x, Y = y), \\ P(Y = y) &= \sum_{x \in X(\Omega)} P(X = x, Y = y). \end{aligned}$$</div>
    En effet, \((Y = y)_{y \in Y(\Omega)}\) est un système complet, et l'on applique la formule des probabilités totales. La réciproque est <strong>fausse</strong> : les marginales ne déterminent pas la loi conjointe.
  </div>
  <div class="notice"><strong>Erreur classique</strong> : reconstituer une loi conjointe en multipliant les marginales sans hypothèse d'indépendance. Si \(X \sim \mathcal{B}(\frac12)\), les couples \((X, X)\) et \((X, 1 - X)\) ont les mêmes marginales, mais \(P(X = 1, X = 1) = \frac12\) alors que \(P(X = 1, 1 - X = 1) = 0\).</div>

  <h3>Le tableau de la loi conjointe</h3>
  <p>Quand les valeurs sont peu nombreuses, on range la loi conjointe dans un tableau : les marginales s'obtiennent en sommant les lignes et les colonnes. Exemple : on tire deux jetons sans remise dans un sac contenant les jetons 1, 2, 3, 4 ; \(X\) est le plus petit numéro, \(Y\) le plus grand. Les 6 paires sont équiprobables.</p>
  <div><table>
    <tr><th>\(X \backslash Y\)</th><th>\(2\)</th><th>\(3\)</th><th>\(4\)</th><th>loi de \(X\)</th></tr>
    <tr><td>\(1\)</td><td>\(\frac16\)</td><td>\(\frac16\)</td><td>\(\frac16\)</td><td>\(\frac12\)</td></tr>
    <tr><td>\(2\)</td><td>\(0\)</td><td>\(\frac16\)</td><td>\(\frac16\)</td><td>\(\frac13\)</td></tr>
    <tr><td>\(3\)</td><td>\(0\)</td><td>\(0\)</td><td>\(\frac16\)</td><td>\(\frac16\)</td></tr>
    <tr><td>loi de \(Y\)</td><td>\(\frac16\)</td><td>\(\frac13\)</td><td>\(\frac12\)</td><td>\(1\)</td></tr>
  </table></div>

  <div class="prop-box">
    <strong>Loi d'une fonction du couple.</strong> Pour toute fonction \(g\) définie sur les valeurs du couple, \(g(X, Y)\) est une variable discrète et
    <div class="formula" data-nom="Loi de g(X, Y)">$$P\big(g(X, Y) = z\big) = \sum_{(x, y),\ g(x, y) = z} P(X = x, Y = y).$$</div>
    Par exemple, pour des variables à valeurs dans \(\mathbb{N}\) : \(P(X + Y = n) = \sum_{k=0}^{n} P(X = k, Y = n - k)\).
  </div>
  <p>Sur le tableau précédent, l'écart \(Y - X\) vaut 1 pour les paires \(\{1,2\}, \{2,3\}, \{3,4\}\), 2 pour \(\{1,3\}, \{2,4\}\) et 3 pour \(\{1,4\}\) : \(P(Y - X = 1) = \frac12\), \(P(Y - X = 2) = \frac13\), \(P(Y - X = 3) = \frac16\).</p>

  <div class="method-box">
    <strong>Exemple — premier et deuxième succès</strong>
    <p>Dans une suite d'épreuves de Bernoulli indépendantes de paramètre \(p \in \,]0, 1[\), on note \(X\) le rang du premier succès et \(Y\) celui du deuxième.</p>
    <ol>
      <li>Loi conjointe : pour \(1 \leq i \lt j\), l'événement \((X = i, Y = j)\) signifie « succès aux rangs \(i\) et \(j\), échecs aux \(j - 2\) autres rangs de 1 à \(j\) », d'où
        <div class="formula">$$P(X = i, Y = j) = p^2 (1-p)^{j-2}, \qquad 1 \leq i \lt j,$$</div>
        et \(P(X = i, Y = j) = 0\) si \(i \geq j\).</li>
      <li>Loi de \(X\) :
        <div class="formula">$$P(X = i) = \sum_{j \geq i+1} p^2(1-p)^{j-2} = p^2\,\frac{(1-p)^{i-1}}{1 - (1-p)} = p(1-p)^{i-1}.$$</div>
        On retrouve \(X \sim \mathcal{G}(p)\).</li>
      <li>Loi de \(Y\) : pour \(j \geq 2\), il y a \(j - 1\) valeurs de \(i\) possibles, toutes de même probabilité : \(P(Y = j) = (j-1)\,p^2(1-p)^{j-2}\). Contrôle : \(\sum_{j \geq 2} (j-1)x^{j-2} = \frac{1}{(1-x)^2}\) (série géométrique dérivée) donne une somme égale à \(p^2 \cdot \frac{1}{p^2} = 1\). Pour \(p = \frac12\), \(P(Y = 4) = 3 \cdot \frac14 \cdot \frac14 = \frac{3}{16}\).</li>
    </ol>
  </div>

  <h3>Les \(n\)-uplets</h3>
  <p>Tout s'étend à \(n\) variables \(X_1, \ldots, X_n\) définies sur le même espace : le \(n\)-uplet \((X_1, \ldots, X_n)\) est une variable discrète, sa loi (la loi conjointe) est donnée par les probabilités \(P(X_1 = x_1, \ldots, X_n = x_n)\), et la loi de chaque \(X_i\), ou de chaque sous-famille comme \((X_1, X_2)\), s'obtient en sommant sur les valeurs des autres variables.</p>

<div class="course-section">
  <div class="sec-num">§7 · LOIS CONDITIONNELLES</div>
  <h2>Mettre à jour une loi après une information</h2>
  <div class="intro">Apprendre qu'un événement est réalisé, ou connaître la valeur d'une autre variable, modifie les probabilités des valeurs de \(X\) : on obtient la loi conditionnelle. En sens inverse, se donner une loi et des lois conditionnelles est la façon la plus courante de construire une loi conjointe.</div>

  <div class="def-box">
    Soit \(A\) un événement tel que \(P(A) \gt 0\). La <strong>loi conditionnelle de \(X\) sachant \(A\)</strong> est la loi de \(X\) pour la probabilité \(P_A = P(\,\cdot \mid A)\) : elle est donnée par la famille
    <div class="formula" data-nom="Loi conditionnelle">$$P(X = x \mid A) = \frac{P\big((X = x) \cap A\big)}{P(A)}, \qquad x \in X(\Omega).$$</div>
    C'est une loi de probabilité, puisque \(P_A\) est une probabilité. Le cas le plus fréquent est \(A = (Y = y)\) : \(P(X = x \mid Y = y) = \dfrac{P(X = x, Y = y)}{P(Y = y)}\). Sur un tableau, on prend la colonne de \(y\) et on la divise par sa somme.
  </div>
  <p>Exemple : sur le tableau du §6, sachant \(Y = 4\), la colonne \(\big(\frac16, \frac16, \frac16\big)\) divisée par \(\frac12\) montre que \(X\) suit la loi uniforme sur \(\{1, 2, 3\}\).</p>

  <div class="prop-box">
    <strong>Construire une loi conjointe par étages.</strong> Si l'on connaît la loi de \(Y\) et, pour chaque valeur \(y\), la loi conditionnelle de \(X\) sachant \((Y = y)\), alors
    <div class="formula" data-nom="Loi conjointe par conditionnement">$$\begin{aligned} P(X = x, Y = y) &= P(Y = y)\,P(X = x \mid Y = y), \\ P(X = x) &= \sum_{y \in Y(\Omega)} P(X = x \mid Y = y)\,P(Y = y). \end{aligned}$$</div>
    La première égalité est la formule des probabilités composées, la seconde celle des probabilités totales avec le système complet \((Y = y)_y\) (convention : un terme est nul quand \(P(Y = y) = 0\)).
  </div>

  <div class="method-box">
    <strong>Exemple — après le premier succès, tout recommence</strong>
    <p>Avec les rangs \(X\) et \(Y\) du premier et du deuxième succès (§6), pour \(i \geq 1\) et \(j \gt i\) :</p>
    <div class="formula">$$P(Y = j \mid X = i) = \frac{p^2 (1-p)^{j-2}}{p(1-p)^{i-1}} = p(1-p)^{j-i-1}.$$</div>
    <p>Sachant \((X = i)\), l'attente supplémentaire \(Y - i\) suit donc la loi \(\mathcal{G}(p)\), quelle que soit la valeur de \(i\). Plus généralement, la loi conditionnelle de \(X \sim \mathcal{G}(p)\) sachant l'événement \((X \gt n)\) est celle de \(n + T\) avec \(T \sim \mathcal{G}(p)\) : c'est l'absence de mémoire.</p>
  </div>

  <div class="method-box">
    <strong>Exemple — trier des courriels</strong>
    <p>Le nombre \(N\) de courriels reçus dans l'heure suit \(\mathcal{P}(\lambda)\). Chacun est indésirable avec la probabilité \(p\), indépendamment des autres et de leur nombre : sachant \((N = n)\), le nombre \(X\) de courriels indésirables suit \(\mathcal{B}(n, p)\).</p>
    <ol>
      <li>Pour \(k \in \mathbb{N}\), \(P(X = k \mid N = n) = 0\) si \(n \lt k\). Les probabilités totales donnent
        <div class="formula">$$\begin{aligned} P(X = k) &= \sum_{n \geq k} e^{-\lambda}\frac{\lambda^n}{n!}\binom{n}{k}p^k(1-p)^{n-k} \\ &= e^{-\lambda}\,\frac{(\lambda p)^k}{k!}\sum_{n \geq k} \frac{\big(\lambda(1-p)\big)^{n-k}}{(n-k)!}. \end{aligned}$$</div></li>
      <li>En posant \(m = n - k\), la dernière somme vaut \(e^{\lambda(1-p)}\) : \(P(X = k) = e^{-\lambda p}\dfrac{(\lambda p)^k}{k!}\), donc \(X \sim \mathcal{P}(\lambda p)\).</li>
      <li>Avec \(\lambda = 12\) courriels par heure et \(p = \frac14\) : \(X \sim \mathcal{P}(3)\), et la probabilité de ne recevoir aucun courriel indésirable en une heure vaut \(e^{-3} \approx 0{,}050\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · VARIABLES ALÉATOIRES INDÉPENDANTES</div>
  <h2>Quand une variable ne renseigne pas sur l'autre</h2>
  <div class="intro">Deux variables sont indépendantes quand toute information sur l'une laisse inchangée la loi de l'autre. C'est l'hypothèse qui rend calculables les lois de sommes, de minimums et de maximums, et c'est elle qui permet de modéliser des répétitions d'une même expérience.</div>

  <div class="def-box">
    Deux variables discrètes \(X\) et \(Y\) définies sur \(\Omega\) sont <strong>indépendantes</strong>, ce que l'on note \(X \perp\!\!\!\perp Y\), si pour toutes parties \(A \subset X(\Omega)\) et \(B \subset Y(\Omega)\), les événements \((X \in A)\) et \((Y \in B)\) sont indépendants :
    <div class="formula" data-nom="Indépendance de deux variables">$$P(X \in A,\ Y \in B) = P(X \in A)\,P(Y \in B).$$</div>
  </div>
  <div class="prop-box">
    <strong>Caractérisation par la loi conjointe.</strong> \(X\) et \(Y\) sont indépendantes si et seulement si
    <div class="formula" data-nom="Indépendance et loi conjointe">$$\forall (x, y) \in X(\Omega) \times Y(\Omega), \qquad P(X = x, Y = y) = P(X = x)\,P(Y = y).$$</div>
    De façon équivalente : pour tout \(y\) tel que \(P(Y = y) \gt 0\), la loi conditionnelle de \(X\) sachant \((Y = y)\) est la loi de \(X\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le sens réciproque repose sur un découpage en événements élémentaires.</span>
    <div class="content">
      <p>Le sens direct s'obtient avec \(A = \{x\}\) et \(B = \{y\}\). Réciproquement, \((X \in A, Y \in B)\) est la réunion disjointe, au plus dénombrable, des événements \((X = x, Y = y)\) pour \(x \in A\) et \(y \in B\). Par σ-additivité, puis par hypothèse :</p>
      <div class="formula">$$\begin{aligned} P(X \in A, Y \in B) &= \sum_{x \in A}\sum_{y \in B} P(X = x)\,P(Y = y) \\ &= \Big(\sum_{x \in A} P(X = x)\Big)\Big(\sum_{y \in B} P(Y = y)\Big), \end{aligned}$$</div>
      <p>ce qui vaut \(P(X \in A)\,P(Y \in B)\). Les termes étant positifs, l'ordre de sommation et le regroupement par paquets n'importent pas (résultat admis par le programme). L'équivalence avec les lois conditionnelles vient de \(P(X = x \mid Y = y) = \frac{P(X = x, Y = y)}{P(Y = y)}\).</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Méthode — prouver ou réfuter l'indépendance</strong>
    <ol>
      <li><strong>Réfuter</strong> : trouver un seul couple \((x, y)\) avec \(P(X = x, Y = y) \neq P(X = x)P(Y = y)\). Le plus souvent, une case nulle du tableau alors que \(P(X = x) \gt 0\) et \(P(Y = y) \gt 0\). Dans le tableau du §6, \(P(X = 3, Y = 2) = 0 \neq \frac16 \times \frac16\) : le minimum et le maximum ne sont pas indépendants.</li>
      <li><strong>Prouver</strong> : montrer que la loi conjointe se factorise, \(P(X = x, Y = y) = a(x)\,b(y)\) pour <strong>tous</strong> les couples de \(X(\Omega) \times Y(\Omega)\). En sommant, \(P(X = x) = a(x)\sum_y b(y)\) et \(P(Y = y) = b(y)\sum_x a(x)\), avec \(\sum_x a(x) \sum_y b(y) = 1\) : le produit des marginales redonne bien \(a(x)b(y)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire à une factorisation quand les valeurs du couple ne remplissent pas un produit. La loi \(P(X = i, Y = j) = p^2(1-p)^{j-2}\) du §6 ne dépend que de \(j\), mais seulement pour \(i \lt j\) : la contrainte \(i \lt j\) lie les deux variables, et \(P(X = 2, Y = 2) = 0\) alors que \(P(X = 2)P(Y = 2) \gt 0\).</div>

  <div class="method-box">
    <strong>Exemple — deux factorisations instructives</strong>
    <ol>
      <li>Premier succès \(X\) et attente supplémentaire \(D = Y - X\) (§6). Pour \(i, k \geq 1\) :
        <div class="formula">$$\begin{aligned} P(X = i, D = k) &= P(X = i, Y = i + k) = p^2(1-p)^{i+k-2} \\ &= p(1-p)^{i-1} \cdot p(1-p)^{k-1}. \end{aligned}$$</div>
        La factorisation vaut sur tout \(\mathbb{N}^* \times \mathbb{N}^*\) : \(X\) et \(D\) sont indépendantes, toutes deux de loi \(\mathcal{G}(p)\).</li>
      <li>Courriels (§7) : le nombre \(X\) de courriels indésirables et le nombre \(N - X\) de courriels utiles. Pour \(k, l \in \mathbb{N}\) :
        <div class="formula">$$\begin{aligned} P(X = k, N - X = l) &= e^{-\lambda}\frac{\lambda^{k+l}}{(k+l)!}\binom{k+l}{k}p^k(1-p)^l \\ &= e^{-\lambda p}\frac{(\lambda p)^k}{k!} \cdot e^{-\lambda(1-p)}\frac{\big(\lambda(1-p)\big)^l}{l!}. \end{aligned}$$</div>
        Ainsi \(X \sim \mathcal{P}(\lambda p)\) et \(N - X \sim \mathcal{P}\big(\lambda(1-p)\big)\) sont <strong>indépendantes</strong>, alors que leur somme \(N\) est aléatoire : un résultat propre à la loi de Poisson.</li>
    </ol>
  </div>

  <h3>Plusieurs variables, suites de variables</h3>
  <div class="def-box">
    <ul>
      <li>Des variables \(X_1, \ldots, X_n\) sont <strong>indépendantes</strong> (mutuellement) si, pour toutes parties \(A_i \subset X_i(\Omega)\), les événements \((X_1 \in A_1), \ldots, (X_n \in A_n)\) sont indépendants. Cela équivaut à : \(P(X_1 = x_1, \ldots, X_n = x_n) = \prod_{i=1}^{n} P(X_i = x_i)\) pour toutes valeurs \(x_i\).</li>
      <li>Une suite \((X_n)_{n \geq 1}\) est une <strong>suite de variables indépendantes</strong> si, pour tout \(n\), les variables \(X_1, \ldots, X_n\) sont indépendantes. Elle est <strong>i.i.d.</strong> (indépendantes et identiquement distribuées) si de plus toutes les \(X_n\) suivent la même loi.</li>
    </ul>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : l'indépendance deux à deux n'entraîne pas l'indépendance mutuelle. Soit \(X\) et \(Y\) indépendantes de loi \(\mathcal{B}(\frac12)\), et \(Z\) égale à 1 si \(X = Y\), à 0 sinon. Sachant \(X = a\), on a \(Z = 1\) exactement quand \(Y = a\), ce qui a la probabilité \(\frac12\) : \(P(X = a, Z = c) = \frac14\) pour tous \(a, c\), donc \(X \perp\!\!\!\perp Z\), et de même \(Y \perp\!\!\!\perp Z\). Pourtant \(P(X = 1, Y = 1, Z = 0) = 0 \neq \frac18\) : \(Z\) est entièrement déterminée par le couple \((X, Y)\).</div>

  <div class="prop-box">
    <strong>Modélisation du pile ou face infini.</strong> On admet qu'il existe un espace probabilisé portant une suite i.i.d. \((X_n)_{n \geq 1}\) de variables de loi \(\mathcal{B}(p)\) (le programme ne demande pas de justifier cette existence). On y interprète \(X_n = 1\) comme « pile au \(n\)-ième lancer ». Tous les événements et variables usuels s'écrivent alors avec les \(X_n\) : « pile au rang \(n\) » est \((X_n = 1)\) ; le nombre de piles parmi les \(n\) premiers lancers, \(S_n = X_1 + \cdots + X_n\), suit \(\mathcal{B}(n, p)\) ; le rang du premier pile suit \(\mathcal{G}(p)\) (§4) ; « ne jamais obtenir pile » est négligeable.
  </div>

  <h3>Fonctions de variables indépendantes</h3>
  <div class="prop-box">
    <strong>Fonctions de variables indépendantes.</strong> Si \(X \perp\!\!\!\perp Y\), alors \(f(X) \perp\!\!\!\perp g(Y)\) pour toutes fonctions \(f\) et \(g\) définies sur \(X(\Omega)\) et \(Y(\Omega)\). De même, si \(X_1, \ldots, X_n\) sont indépendantes, \(f_1(X_1), \ldots, f_n(X_n)\) le sont.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un événement lié à \(f(X)\) est un événement lié à \(X\).</span>
    <div class="content"><p>Pour toutes parties \(A\) et \(B\), \(\big(f(X) \in A\big) = \big(X \in f^{-1}(A)\big)\) et \(\big(g(Y) \in B\big) = \big(Y \in g^{-1}(B)\big)\). Ces deux événements sont indépendants par définition de \(X \perp\!\!\!\perp Y\). Le cas de \(n\) variables est identique.</p></div>
  </div>
  <div class="prop-box">
    <strong>Lemme des coalitions.</strong> Si \(X_1, \ldots, X_n\) sont indépendantes et \(1 \leq m \lt n\), les variables \(f(X_1, \ldots, X_m)\) et \(g(X_{m+1}, \ldots, X_n)\) sont indépendantes. Le résultat s'étend à plus de deux coalitions, pourvu qu'elles portent sur des groupes de variables <strong>disjoints</strong> (résultat admis).
  </div>
  <div class="method-box">
    <strong>Exemple — cinq dés</strong>
    <p>On lance cinq dés : les résultats \(X_1, \ldots, X_5\) sont indépendants, de loi \(\mathcal{U}([\![ 1, 6 ]\!])\).</p>
    <ol>
      <li>\(X_1 + X_2\) et \(\max(X_3, X_4, X_5)\) portent sur des groupes disjoints : elles sont indépendantes. Par exemple :
        <div class="formula">$$P\big(X_1 + X_2 = 2,\ \max(X_3, X_4, X_5) = 6\big) = \frac{1}{36}\left(1 - \left(\frac56\right)^3\right).$$</div>
        </li>
      <li>\(X_1 + X_2\) et \(X_2 + X_3\) partagent \(X_2\) : le lemme ne s'applique pas, et elles ne sont pas indépendantes, car \(P(X_1 + X_2 = 2, X_2 + X_3 = 12) = 0\) (il faudrait \(X_2 = 1\) et \(X_2 = 6\)) alors que les deux événements ont une probabilité non nulle.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SOMMES, MINIMUMS ET MAXIMUMS</div>
  <h2>Combiner des variables indépendantes</h2>
  <div class="intro">Trois calculs reviennent sans cesse : la loi d'une somme, par une somme finie de produits (on parle de convolution), et les lois d'un minimum et d'un maximum, par les queues (§2).</div>

  <div class="prop-box">
    <strong>Loi d'une somme.</strong> Si \(X\) et \(Y\) sont indépendantes, à valeurs dans \(\mathbb{N}\), alors pour tout \(n \in \mathbb{N}\) :
    <div class="formula" data-nom="Loi d'une somme (convolution)">$$P(X + Y = n) = \sum_{k=0}^{n} P(X = k)\,P(Y = n - k).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Découper selon la valeur de \(X\).</span>
    <div class="content"><p>L'événement \((X + Y = n)\) est la réunion disjointe des \((X = k, Y = n - k)\) pour \(0 \leq k \leq n\) (les deux variables sont positives, donc \(X \leq n\)). L'additivité puis l'indépendance donnent la formule. Elle montre au passage que la loi de \(X + Y\) ne dépend que des lois de \(X\) et de \(Y\) lorsque ces variables sont indépendantes.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — somme de deux variables de Poisson indépendantes</strong>
    <p>Soit \(X \sim \mathcal{P}(\lambda)\) et \(Y \sim \mathcal{P}(\mu)\) indépendantes. Pour \(n \in \mathbb{N}\) :</p>
    <div class="formula" data-nom="Somme de deux lois de Poisson">$$\begin{aligned} P(X + Y = n) &= \sum_{k=0}^{n} e^{-\lambda}\frac{\lambda^k}{k!}\,e^{-\mu}\frac{\mu^{n-k}}{(n-k)!} \\ &= \frac{e^{-(\lambda+\mu)}}{n!}\sum_{k=0}^{n}\binom{n}{k}\lambda^k\mu^{n-k} = e^{-(\lambda+\mu)}\frac{(\lambda+\mu)^n}{n!}. \end{aligned}$$</div>
    <p>Donc \(X + Y \sim \mathcal{P}(\lambda + \mu)\). Interprétation : si une standardiste reçoit en moyenne 3 appels par heure sur une ligne et 5 sur une autre, indépendamment, elle en reçoit au total un nombre de loi \(\mathcal{P}(8)\). Le chapitre suivant retrouvera ce résultat en une ligne avec les fonctions génératrices.</p>
  </div>
  <ul>
    <li><strong>Binomiales</strong> : si \(X \sim \mathcal{B}(n, p)\) et \(Y \sim \mathcal{B}(m, p)\) sont indépendantes (même \(p\)), alors \(X + Y \sim \mathcal{B}(n + m, p)\). En effet, la loi de la somme ne dépend que des deux lois ; on peut donc réaliser \(X\) et \(Y\) comme sommes de \(n\) et de \(m\) variables d'une même suite i.i.d. de loi \(\mathcal{B}(p)\), sur des groupes disjoints (coalitions) : \(X + Y\) compte alors les succès de \(n + m\) épreuves.</li>
    <li><strong>Géométriques</strong> : si \(X, Y \sim \mathcal{G}(p)\) sont indépendantes, pour \(n \geq 2\) :
        <div class="formula">$$P(X + Y = n) = \sum_{k=1}^{n-1} p(1-p)^{k-1}\,p(1-p)^{n-k-1} = (n-1)p^2(1-p)^{n-2}.$$</div>
         C'est la loi du rang du deuxième succès trouvée au §6, ce qui est cohérent : ce rang est la somme du premier rang et d'une attente indépendante de même loi (§8).</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : croire que la somme de deux variables d'une même famille reste dans la famille. C'est vrai pour Poisson et pour les binomiales de même \(p\), faux en général : la somme de deux géométriques n'est pas géométrique, celle de deux dés n'est pas uniforme (7 est six fois plus probable que 2).</div>

  <div class="prop-box">
    <strong>Minimum et maximum.</strong> Si \(X\) et \(Y\) sont indépendantes et réelles, pour tout réel \(t\) :
    <div class="formula" data-nom="Minimum et maximum de variables indépendantes">$$\begin{aligned} P\big(\min(X, Y) \gt t\big) &= P(X \gt t)\,P(Y \gt t), \\ P\big(\max(X, Y) \leq t\big) &= P(X \leq t)\,P(Y \leq t). \end{aligned}$$</div>
    Cela s'étend à \(n\) variables indépendantes ; on en déduit la loi par la méthode des queues du §2.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Traduire « le minimum dépasse \(t\) ».</span>
    <div class="content"><p>Le minimum dépasse \(t\) si et seulement si les deux variables dépassent \(t\) : \(\big(\min(X, Y) \gt t\big) = (X \gt t) \cap (Y \gt t)\), et ces deux événements sont indépendants (définition avec \(A = \,]t, +\infty[\,\cap X(\Omega)\), et de même pour \(B\)). De même, \(\big(\max(X, Y) \leq t\big) = (X \leq t) \cap (Y \leq t)\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — deux machines</strong>
    <p>Deux machines tombent en panne chaque jour avec les probabilités \(p = 0{,}02\) et \(q = 0{,}05\), indépendamment l'une de l'autre et d'un jour à l'autre. Les jours de première panne \(X \sim \mathcal{G}(p)\) et \(Y \sim \mathcal{G}(q)\) sont indépendants.</p>
    <ol>
      <li>Premier jour où l'une des deux tombe en panne :
        <div class="formula">$$P\big(\min(X, Y) \gt k\big) = (1-p)^k(1-q)^k = \big((1-p)(1-q)\big)^k.$$</div>
        C'est la queue d'une loi géométrique : \(\min(X, Y) \sim \mathcal{G}(r)\) avec \(r = 1 - (1-p)(1-q) = 1 - 0{,}98 \times 0{,}95 = 0{,}069\). Chaque jour, « au moins une panne » a la probabilité \(r\).</li>
      <li>Probabilité qu'aucune panne ne survienne pendant 30 jours : \(0{,}931^{30} \approx 0{,}117\).</li>
      <li>Probabilité que les deux machines soient tombées en panne au moins une fois avant la fin du 30ᵉ jour :
        <div class="formula">$$P\big(\max(X, Y) \leq 30\big) = (1 - 0{,}98^{30})(1 - 0{,}95^{30}) \approx 0{,}357.$$</div>
        </li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · TABLEAU DES LOIS USUELLES</div>
  <h2>Reconnaître une loi</h2>
  <div class="intro">Le tableau rassemble les lois du programme et la situation type de chacune. L'espérance, la variance et la fonction génératrice de chaque loi sont dans le tableau récapitulatif du chapitre « Variables aléatoires discrètes II ».</div>
  <div><table>
    <tr><th>Loi</th><th>Notation</th><th>Valeurs</th><th>\(P(X = k)\)</th><th>Situation type</th></tr>
    <tr><td>Uniforme</td><td>\(\mathcal{U}([\![ 1, n ]\!])\)</td><td>\([\![ 1, n ]\!]\)</td><td>\(\frac1n\)</td><td>choix équiprobable parmi \(n\) valeurs</td></tr>
    <tr><td>Bernoulli</td><td>\(\mathcal{B}(p)\)</td><td>\(\{0, 1\}\)</td><td>\(P(X = 1) = p\)</td><td>succès d'une épreuve ; indicatrice d'un événement</td></tr>
    <tr><td>Binomiale</td><td>\(\mathcal{B}(n, p)\)</td><td>\([\![ 0, n ]\!]\)</td><td>\(\binom{n}{k}p^k(1-p)^{n-k}\)</td><td>nombre de succès en \(n\) épreuves indépendantes</td></tr>
    <tr><td>Géométrique</td><td>\(\mathcal{G}(p)\)</td><td>\(\mathbb{N}^*\)</td><td>\(p(1-p)^{k-1}\)</td><td>rang du premier succès</td></tr>
    <tr><td>Poisson</td><td>\(\mathcal{P}(\lambda)\)</td><td>\(\mathbb{N}\)</td><td>\(e^{-\lambda}\frac{\lambda^k}{k!}\)</td><td>nombre d'événements rares</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Stabilités à retenir</strong> (variables indépendantes) :
    <ul>
      <li>une somme de \(n\) variables de loi \(\mathcal{B}(p)\) suit \(\mathcal{B}(n, p)\) ; \(\mathcal{B}(n, p) + \mathcal{B}(m, p)\) suit \(\mathcal{B}(n + m, p)\) ;</li>
      <li>\(\mathcal{P}(\lambda) + \mathcal{P}(\mu)\) suit \(\mathcal{P}(\lambda + \mu)\) ;</li>
      <li>le minimum de \(\mathcal{G}(p)\) et \(\mathcal{G}(q)\) suit \(\mathcal{G}\big(1 - (1-p)(1-q)\big)\) ;</li>
      <li>\(\mathcal{B}(n, \frac{\lambda}{n})\) se rapproche de \(\mathcal{P}(\lambda)\) quand \(n\) grandit.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — choisir le bon modèle</strong>
    <ol>
      <li>Nombre de 6 obtenus en 20 lancers d'un dé : \(\mathcal{B}(20, \frac16)\) (nombre fixé d'épreuves indépendantes, on compte les succès).</li>
      <li>Nombre de lancers nécessaires pour obtenir le premier 6 : \(\mathcal{G}(\frac16)\) (on attend le premier succès, sans borne).</li>
      <li>Nombre de coquilles dans un livre de 300 pages de 2 000 caractères, chaque caractère étant erroné avec la probabilité \(10^{-5}\) indépendamment : \(\mathcal{B}(600\,000\,;\,10^{-5})\), très bien approchée par \(\mathcal{P}(6)\).</li>
      <li>Numéro de la première boule tirée dans une urne de 10 boules numérotées : \(\mathcal{U}([\![ 1, 10 ]\!])\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Autres lois et prolongements</h2>
  <div class="intro">Ces compléments éclairent le cours mais ne sont pas exigibles.</div>
  <ul>
    <li><strong>Loi de Pascal</strong> : le rang du \(r\)-ième succès dans une suite d'épreuves de Bernoulli indépendantes vérifie \(P(Y = j) = \binom{j-1}{r-1}p^r(1-p)^{j-r}\) pour \(j \geq r\). Le cas \(r = 2\) est la loi trouvée au §6 ; c'est aussi la loi d'une somme de \(r\) variables indépendantes de loi \(\mathcal{G}(p)\).</li>
    <li><strong>Loi hypergéométrique</strong> : nombre de boules rouges parmi \(n\) boules tirées sans remise dans une urne de \(N\) boules dont \(r\) rouges, \(P(X = k) = \binom{r}{k}\binom{N-r}{n-k} \big/ \binom{N}{n}\).</li>
    <li><strong>Existence des suites i.i.d.</strong> : la construction d'un espace probabilisé portant une suite de variables indépendantes de lois données relève de la théorie de la mesure (théorème de Kolmogorov).</li>
    <li><strong>Du discret au continu</strong> : un temps d'attente géométrique observé à une échelle de temps de plus en plus fine conduit à la loi exponentielle, qui est une loi à densité (hors programme).</li>
  </ul>
</div>
</template>

<div class="course-section">
  <div class="sec-num">MÉTHODES · VA DISCRÈTES I</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à trouver la loi d'une variable discrète (directement, par ses queues, par une fonction d'une autre variable ou par conditionnement), à reconnaître une loi usuelle, à exploiter la loi d'un couple et à traiter les variables indépendantes : sommes, minimums, maximums.</div>

  <div class="method-box"><strong>Méthode 1 — Déterminer la loi d'une variable</strong>
    <ol>
      <li>Déterminer l'ensemble \(X(\Omega)\) des valeurs possibles, en commençant par la plus petite et la plus grande (s'il y en a une).</li>
      <li>Pour chaque valeur \(x\), décrire l'événement \((X = x)\) en mots, puis calculer \(P(X = x)\) : dénombrement si les issues sont équiprobables, indépendance, ou conditionnement (méthode 6).</li>
      <li>Contrôler que \(\sum_{x \in X(\Omega)} P(X = x) = 1\) ; quand \(X(\Omega)\) est infini, c'est la somme d'une série à termes positifs (série géométrique, exponentielle, télescopique…).</li>
    </ol>
    <p><em>Exemple éclair :</em> on lance deux dés tétraédriques équilibrés (faces 1 à 4) et l'on note \(X\) l'écart entre les deux résultats. Sur les 16 couples équiprobables, l'écart vaut 0 pour 4 couples, 1 pour 6, 2 pour 4 et 3 pour 2 : \(P(X = 0) = \frac14\), \(P(X = 1) = \frac38\), \(P(X = 2) = \frac14\), \(P(X = 3) = \frac18\), de somme 1.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Reconnaître une loi usuelle</strong>
    <ol>
      <li>Repérer une épreuve à deux issues (succès de probabilité \(p\)) répétée de façon indépendante dans les mêmes conditions.</li>
      <li>Nombre <em>fixé</em> \(n\) de répétitions et on compte les succès : \(\mathcal{B}(n, p)\), valeurs \([\![ 0, n ]\!]\). Répétitions <em>sans limite</em> et on attend le premier succès : \(\mathcal{G}(p)\), valeurs \(\mathbb{N}^*\).</li>
      <li>Comptage d'événements rares parmi un grand nombre d'occasions indépendantes, de moyenne \(\lambda\) connue : \(\mathcal{P}(\lambda)\), valeurs \(\mathbb{N}\). Choix au hasard parmi \(n\) valeurs équiprobables : loi uniforme.</li>
      <li>Justifier la loi en une phrase (épreuves indépendantes, même probabilité de succès), puis écrire \(P(X = k)\) et l'ensemble des valeurs.</li>
    </ol>
    <p><em>Exemple éclair :</em> un tireur atteint la cible avec la probabilité \(0{,}4\) à chaque tir, indépendamment des autres. Le rang \(T\) du premier tir réussi suit \(\mathcal{G}(0{,}4)\) : \(P(T = 3) = 0{,}6^2 \times 0{,}4 = 0{,}144\). Le nombre \(N\) de cibles atteintes en 10 tirs suit \(\mathcal{B}(10\,;\,0{,}4)\) : \(P(N = 4) = \binom{10}{4}\,0{,}4^4\,0{,}6^6 \approx 0{,}251\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : des tirages sans remise ne sont pas indépendants (pas de loi binomiale), et le nombre d'échecs avant le premier succès vaut \(T - 1\), à valeurs dans \(\mathbb{N}\) : il ne suit pas \(\mathcal{G}(p)\). Toujours vérifier la plus petite valeur possible.</div>

  <div class="method-box"><strong>Méthode 3 — Passer par les queues \(P(X \gt k)\)</strong>
    <ol>
      <li>Pour une variable à valeurs entières (rang d'attente, minimum, maximum), traduire l'événement \((X \gt k)\) en mots : « rien ne s'est produit pendant les \(k\) premières épreuves », « toutes les valeurs dépassent \(k\) »…</li>
      <li>Calculer \(P(X \gt k)\) pour tout entier \(k\), souvent comme un produit grâce à l'indépendance.</li>
      <li>En déduire la loi : \(P(X = k) = P(X \gt k - 1) - P(X \gt k)\). Si \(P(X \gt k)\) est de la forme \(q^k\) avec \(0 \lt q \lt 1\) pour tout \(k \in \mathbb{N}\), reconnaître directement \(X \sim \mathcal{G}(1 - q)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> on lance un dé jusqu'à obtenir 5 ou 6 ; soit \(T\) le nombre de lancers. \((T \gt k)\) signifie que les \(k\) premiers lancers donnent 1, 2, 3 ou 4 : \(P(T \gt k) = \left(\frac23\right)^k\). Donc \(P(T = k) = \left(\frac23\right)^{k-1} - \left(\frac23\right)^k = \frac13\left(\frac23\right)^{k-1}\) : \(T \sim \mathcal{G}(\frac13)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Trouver la loi de \(f(X)\)</strong>
    <ol>
      <li>Calculer l'ensemble des valeurs \(f\big(X(\Omega)\big)\).</li>
      <li>Pour chaque valeur \(y\), chercher <em>tous</em> les antécédents \(x \in X(\Omega)\) tels que \(f(x) = y\).</li>
      <li>Additionner : \(P\big(f(X) = y\big) = \sum_{f(x) = y} P(X = x)\). Si \(f\) est injective, la loi est simplement « transportée ».</li>
    </ol>
    <p><em>Exemple éclair :</em> \(X \sim \mathcal{U}([\![ -2, 3 ]\!])\) (6 valeurs) et \(Y = X^2\). Les valeurs de \(Y\) sont \(0, 1, 4, 9\) : \(P(Y = 0) = \frac16\), \(P(Y = 1) = P(X = -1) + P(X = 1) = \frac13\), \(P(Y = 4) = \frac13\), \(P(Y = 9) = P(X = 3) = \frac16\). \(Y\) n'est pas uniforme.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Exploiter le tableau d'une loi conjointe</strong>
    <ol>
      <li>Ranger les \(P(X = x, Y = y)\) dans un tableau (lignes : valeurs de \(X\), colonnes : valeurs de \(Y\)) et vérifier que la somme de toutes les cases vaut 1.</li>
      <li>Lois marginales : sommer chaque ligne (loi de \(X\)) et chaque colonne (loi de \(Y\)).</li>
      <li>Loi conditionnelle de \(Y\) sachant \((X = x)\) : diviser la ligne de \(x\) par sa somme \(P(X = x)\).</li>
      <li>Loi de \(g(X, Y)\) : regrouper les cases où \(g(x, y)\) prend la même valeur.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(X \in \{0, 1\}\), \(Y \in \{1, 2, 3\}\), lignes \((0{,}1\ ;\ 0{,}2\ ;\ 0{,}1)\) pour \(X = 0\) et \((0{,}2\ ;\ 0{,}1\ ;\ 0{,}3)\) pour \(X = 1\). Marginales : \(P(X = 0) = 0{,}4\), \(P(X = 1) = 0{,}6\) ; \(Y\) vaut 1, 2, 3 avec \(0{,}3\), \(0{,}3\), \(0{,}4\). Sachant \(X = 1\), \(Y\) vaut 1, 2, 3 avec \(\frac13\), \(\frac16\), \(\frac12\). Enfin \(P(X + Y = 3) = 0{,}1 + 0{,}1 = 0{,}2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Construire une loi par étages (conditionnement)</strong>
    <ol>
      <li>Repérer la variable « du premier étage » \(N\), dont la loi est connue, et la loi conditionnelle de \(X\) sachant \((N = n)\) pour chaque \(n\) (souvent binomiale ou géométrique).</li>
      <li>Loi conjointe : \(P(N = n, X = k) = P(N = n)\,P(X = k \mid N = n)\) (probabilités composées).</li>
      <li>Loi de \(X\) : \(P(X = k) = \sum_{n} P(X = k \mid N = n)\,P(N = n)\) (probabilités totales sur le système complet \((N = n)_n\)) ; ne garder que les \(n\) pour lesquels \(P(X = k \mid N = n) \neq 0\).</li>
      <li>Pour remonter à \(N\) sachant \(X\), appliquer la formule de Bayes : \(P(N = n \mid X = k) = \dfrac{P(N = n, X = k)}{P(X = k)}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(N \sim \mathcal{U}([\![ 1, 3 ]\!])\), puis on lance \(N\) pièces équilibrées ; \(X\) est le nombre de piles. \(P(X = 0) = \frac13\left(\frac12 + \frac14 + \frac18\right) = \frac{7}{24}\) et \(P(N = 1 \mid X = 0) = \dfrac{1/6}{7/24} = \dfrac47\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dans la somme des probabilités totales, l'indice de départ dépend de \(k\) : pour une loi conditionnelle binomiale \(\mathcal{B}(n, p)\), seuls les \(n \geq k\) contribuent.</div>

  <div class="method-box"><strong>Méthode 7 — Prouver ou réfuter l'indépendance de deux variables</strong>
    <ol>
      <li>Réfuter : exhiber un couple \((x, y)\) tel que \(P(X = x, Y = y) \neq P(X = x)\,P(Y = y)\) ; le plus rapide est une case nulle alors que \(P(X = x) \gt 0\) et \(P(Y = y) \gt 0\).</li>
      <li>Prouver : vérifier que l'ensemble des couples possibles est un produit \(X(\Omega) \times Y(\Omega)\), puis factoriser \(P(X = x, Y = y) = a(x)\,b(y)\) ; les lois marginales sont alors proportionnelles à \(a\) et à \(b\).</li>
      <li>Sans calcul : deux fonctions de groupes <em>disjoints</em> de variables indépendantes sont indépendantes (lemme des coalitions).</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(P(X = i, Y = j) = c\,2^{-i}\,3^{-j}\) pour \(i, j \in \mathbb{N}^*\), la somme vaut \(c \times 1 \times \frac12\), donc \(c = 2\). La loi se factorise sur \(\mathbb{N}^* \times \mathbb{N}^*\) : \(X \perp\!\!\!\perp Y\), avec \(P(X = i) = \left(\frac12\right)^i\) et \(P(Y = j) = 2 \cdot 3^{-j} = \frac23\left(\frac13\right)^{j-1}\), soit \(X \sim \mathcal{G}(\frac12)\) et \(Y \sim \mathcal{G}(\frac23)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une formule qui « se factorise » sur un ensemble qui n'est pas un produit (par exemple \(P(X = i, Y = j) = c\,2^{-j}\) pour \(1 \leq i \leq j\)) ne donne pas l'indépendance : la contrainte \(i \leq j\) lie les deux variables.</div>

  <div class="method-box"><strong>Méthode 8 — Loi d'une somme de variables indépendantes</strong>
    <ol>
      <li>Vérifier l'indépendance de \(X\) et \(Y\) (hypothèse de l'énoncé, ou lemme des coalitions).</li>
      <li>Pour des variables à valeurs dans \(\mathbb{N}\), découper selon la valeur de \(X\) : \(P(X + Y = n) = \sum_{k=0}^{n} P(X = k)\,P(Y = n - k)\), en ne gardant que les \(k\) pour lesquels les deux facteurs sont non nuls.</li>
      <li>Reconnaître le résultat ; retenir \(\mathcal{P}(\lambda) + \mathcal{P}(\mu) \sim \mathcal{P}(\lambda + \mu)\) et \(\mathcal{B}(n, p) + \mathcal{B}(m, p) \sim \mathcal{B}(n + m, p)\) (variables indépendantes).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour deux dés tétraédriques indépendants, \(P(X + Y = s) = \sum_k P(X = k)P(Y = s - k)\) compte les couples de somme \(s\) : \(P(X + Y = s) = \dfrac{4 - |s - 5|}{16}\) pour \(2 \leq s \leq 8\) (par exemple \(P(X + Y = 5) = \frac14\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Loi d'un minimum ou d'un maximum de variables indépendantes</strong>
    <ol>
      <li>Minimum : \(\big(\min(X_1, \ldots, X_n) \gt t\big) = (X_1 \gt t) \cap \cdots \cap (X_n \gt t)\), donc \(P(\min \gt t) = \prod_i P(X_i \gt t)\).</li>
      <li>Maximum : \(\big(\max(X_1, \ldots, X_n) \leq t\big) = (X_1 \leq t) \cap \cdots \cap (X_n \leq t)\), donc \(P(\max \leq t) = \prod_i P(X_i \leq t)\).</li>
      <li>Revenir à la loi par différence (méthode 3) : \(P(M = k) = P(M \leq k) - P(M \leq k - 1)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour le maximum \(M\) de trois dés, \(P(M \leq k) = \left(\frac{k}{6}\right)^3\), donc \(P(M = k) = \dfrac{k^3 - (k-1)^3}{216}\) et \(P(M = 6) = \dfrac{91}{216} \approx 0{,}42\). Pour le minimum, \(P(\min \geq 5) = P(\min \gt 4) = \left(\frac26\right)^3 = \frac{1}{27}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : on passe par \(P(\min \gt t)\) et \(P(\max \leq t)\), pas l'inverse : \(P(\min \leq t)\) n'est pas un produit (c'est \(1 - P(\min \gt t)\)).</div>

  <div class="method-box"><strong>Méthode 10 — Approcher une loi binomiale par une loi de Poisson</strong>
    <ol>
      <li>Vérifier que l'on compte des succès parmi \(n\) épreuves indépendantes, avec \(n\) grand et \(p\) petit (par exemple \(n \geq 30\) et \(p \leq 0{,}1\)).</li>
      <li>Remplacer \(\mathcal{B}(n, p)\) par \(\mathcal{P}(\lambda)\) avec \(\lambda = np\) (même moyenne).</li>
      <li>Calculer avec \(P(X = k) \approx e^{-\lambda}\dfrac{\lambda^k}{k!}\), en passant par l'événement contraire pour « au moins ».</li>
    </ol>
    <p><em>Exemple éclair :</em> parmi 400 personnes, chacune présente une allergie donnée avec la probabilité \(\frac{1}{200}\), indépendamment : \(N \sim \mathcal{B}(400, \frac{1}{200})\), approchée par \(\mathcal{P}(2)\). \(P(N \geq 2) \approx 1 - e^{-2}(1 + 2) = 1 - 3e^{-2} \approx 0{,}594\) (valeur exacte : \(0{,}595\)).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : à \(np\) fixé, l'approximation exige \(p\) petit ; avec \(n = 10\) et \(p = 0{,}3\), \(\mathcal{P}(3)\) est une mauvaise approximation de \(\mathcal{B}(10\,;\,0{,}3)\) : pour \(k = 3\), elle donne \(0{,}224\) au lieu de \(0{,}267\).</div>
</div>
</template>
