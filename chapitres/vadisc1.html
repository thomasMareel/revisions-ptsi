<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Reconnaître une loi</h3>
  <div class="statement">On lance une pièce équilibrée jusqu'au premier pile. Soit \(X\) le rang du premier pile.</div>
  <div class="q"><strong>Q1.</strong> Quelle est la loi de \(X\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(X = 3)\) et \(P(X \gt 4)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la probabilité que \(X\) soit pair.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les lancers sont des épreuves de Bernoulli indépendantes de même paramètre \(\frac12\) (succès = pile) et \(X\) est le rang du premier succès : \(X \sim \mathcal{G}(\frac12)\), \(X(\Omega) = \mathbb{N}^*\) et \(P(X = k) = \left(\frac12\right)^{k}\).</p>
    <p><strong>Q2.</strong> \(P(X = 3) = \left(\frac12\right)^2 \cdot \frac12 = \frac18\) (face, face, pile). L'événement \((X \gt 4)\) signifie « face aux quatre premiers lancers » : \(P(X \gt 4) = \left(\frac12\right)^4 = \frac{1}{16}\).</p>
    <p><strong>Q3.</strong> \(P(X \in 2\mathbb{N}^*) = \sum_{j \geq 1} \left(\frac12\right)^{2j}\), soit \(\dfrac{1/4}{1 - 1/4} = \dfrac13\) (série géométrique de raison \(\frac14\)). On verra au chapitre II que \(E(X) = 2\).</p></div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Binomiale</h3>
  <div class="statement">On lance 5 fois un dé équilibré. Soit \(X\) le nombre de 6 obtenus.</div>
  <div class="q"><strong>Q1.</strong> Quelle est la loi de \(X\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(X = 2)\) et \(P(X \geq 1)\).</div>
  <div class="q"><strong>Q3.</strong> Rappeler \(E(X)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On compte les succès (« obtenir 6 », de probabilité \(\frac16\)) parmi 5 épreuves indépendantes : \(X \sim \mathcal{B}(5, \frac16)\).</p>
    <p><strong>Q2.</strong> Avec la formule de la loi binomiale :</p>
    <div class="formula">$$P(X = 2) = \binom{5}{2}\Big(\frac16\Big)^2\Big(\frac56\Big)^3 = 10 \cdot \frac{1}{36} \cdot \frac{125}{216} = \frac{625}{3888} \approx 0{,}161.$$</div>
    <p>Par l'événement contraire, \(P(X \geq 1) = 1 - P(X = 0)\), soit \(1 - \left(\frac56\right)^5 \approx 0{,}598\).</p>
    <p><strong>Q3.</strong> Résultat de 1ʳᵉ année : \(E(X) = np = \frac56\).</p></div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Loi géométrique : absence de mémoire et minimum</h3>
  <div class="statement">Soit \(p, q \in \,]0, 1[\), \(X \sim \mathcal{G}(p)\) et \(Y \sim \mathcal{G}(q)\) deux variables <strong>indépendantes</strong> (\(P(X = k) = p(1-p)^{k-1}\) pour \(k \geq 1\)).</div>
  <p class="exo-part">Partie A — Propriétés</p>
  <div class="q"><strong>A1.</strong> Établir \(P(X \gt k) = (1-p)^{k}\) pour \(k \in \mathbb{N}\).</div>
  <div class="q"><strong>A2.</strong> En déduire la propriété d'absence de mémoire : \(P(X \gt n + k \mid X \gt n) = P(X \gt k)\) pour tous \(n, k \in \mathbb{N}\). Interpréter.</div>
  <div class="q"><strong>A3.</strong> Soit \(Z = \min(X, Y)\). En calculant \(P(Z \gt k)\), montrer que \(Z\) suit une loi géométrique dont on précisera le paramètre.</div>
  <p class="exo-part">Partie B — Application</p>
  <div class="q"><strong>B1.</strong> Deux joueurs lancent chacun un dé équilibré à chaque tour, indépendamment, jusqu'à obtenir un 6. Soit \(Z\) le numéro du premier tour où au moins l'un des deux obtient un 6. Donner la loi de \(Z\) et \(P(Z = 1)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> Par la série géométrique de raison \(1 - p \in \,]0, 1[\) :</p>
    <div class="formula">$$P(X \gt k) = \sum_{j \geq k+1} p(1-p)^{j-1} = p\,\frac{(1-p)^{k}}{1 - (1-p)} = (1-p)^k.$$</div>
    <p>Avec l'interprétation comme rang du premier succès, c'est immédiat : \((X \gt k)\) signifie « les \(k\) premières épreuves échouent ».</p>
    <p><strong>A2.</strong> Comme \((X \gt n + k) \subset (X \gt n)\) :</p>
    <div class="formula">$$P(X \gt n + k \mid X \gt n) = \frac{P(X \gt n + k)}{P(X \gt n)} = \frac{(1-p)^{n+k}}{(1-p)^{n}} = (1-p)^{k} = P(X \gt k).$$</div>
    <p>Interprétation : sachant qu'aucun succès n'est survenu au cours des \(n\) premières épreuves, l'attente supplémentaire a la même loi qu'au départ ; le processus « oublie » son passé. C'est la seule loi sur \(\mathbb{N}^*\) qui ait cette propriété (cours, §4).</p>
    <p><strong>A3.</strong> \((Z \gt k) = (X \gt k) \cap (Y \gt k)\) et ces événements sont indépendants, donc \(P(Z \gt k) = (1-p)^{k}(1-q)^{k}\), c'est-à-dire \(\big((1-p)(1-q)\big)^{k}\). C'est la queue d'une loi géométrique : \(Z \sim \mathcal{G}(r)\) avec \(r = 1 - (1-p)(1-q) \in \,]0, 1[\) (on retrouve la loi par \(P(Z = k) = P(Z \gt k - 1) - P(Z \gt k)\)).</p>
    <p><strong>B1.</strong> Les rangs du premier 6 de chaque joueur sont indépendants, de loi \(\mathcal{G}(\frac16)\), et \(Z\) est leur minimum. Ici \(1 - r = \left(\frac56\right)^2 = \frac{25}{36}\), donc \(Z \sim \mathcal{G}(\frac{11}{36})\) et \(P(Z = 1) = \frac{11}{36} \approx 0{,}306\) : c'est la probabilité qu'au moins un des deux dés donne 6 lors d'un tour. (Le chapitre II donnera \(E(Z) = \frac{36}{11} \approx 3{,}3\) tours.)</p></div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ☆ ☆</span>
  <h3>Une loi de Poisson déguisée</h3>
  <div class="statement">Soit \(c\) un réel et \(X\) une variable à valeurs dans \(\mathbb{N}\) telle que \(P(X = n) = c\,\dfrac{3^n}{n!}\) pour tout \(n \in \mathbb{N}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer \(c\) et reconnaître la loi de \(X\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(X \leq 2)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la probabilité que \(X\) soit pair.</div>
  <div class="q"><strong>Q4.</strong> Quelles sont la ou les valeurs les plus probables de \(X\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> La condition \(\sum_n P(X = n) = 1\) s'écrit \(c\sum_{n \geq 0} \frac{3^n}{n!} = c\,e^3 = 1\) : \(c = e^{-3}\). Alors \(P(X = n) = e^{-3}\frac{3^n}{n!}\) : \(X \sim \mathcal{P}(3)\).</p>
    <p><strong>Q2.</strong> \(P(X \leq 2) = e^{-3}\left(1 + 3 + \frac92\right)\), soit \(\frac{17}{2}e^{-3} \approx 0{,}423\).</p>
    <p><strong>Q3.</strong> On ne garde que les termes pairs de la série exponentielle :</p>
    <div class="formula">$$P(X \in 2\mathbb{N}) = e^{-3}\sum_{j \geq 0} \frac{3^{2j}}{(2j)!} = e^{-3}\operatorname{ch}(3) = \frac{1 + e^{-6}}{2} \approx 0{,}501.$$</div>
    <p>(On obtient \(\operatorname{ch}(3) = \frac{e^3 + e^{-3}}{2}\) en ajoutant les séries de \(e^{3}\) et de \(e^{-3}\) : les termes impairs se compensent.)</p>
    <p><strong>Q4.</strong> \(\dfrac{P(X = n+1)}{P(X = n)} = \dfrac{3}{n+1}\), supérieur à 1 pour \(n \leq 1\), égal à 1 pour \(n = 2\), inférieur à 1 ensuite. La loi croît jusqu'à \(n = 2\), prend la même valeur en 2 et en 3, puis décroît : les deux valeurs les plus probables sont 2 et 3, avec \(P(X = 2) = P(X = 3) = \frac92 e^{-3} \approx 0{,}224\).</p></div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Lancers à tour de rôle</h3>
  <div class="statement">Alice et Bob lancent à tour de rôle un même dé équilibré, Alice commençant ; le premier qui obtient 6 gagne. Plus généralement, on note \(X \sim \mathcal{G}(p)\), \(p \in \,]0, 1[\), le rang du premier succès dans une suite d'épreuves indépendantes, et l'on regroupe les épreuves par « tours » de deux : le tour \(j\) est formé des épreuves \(2j - 1\) (Alice) et \(2j\) (Bob). On note \(Y\) le numéro du tour où survient le premier succès, et \(R = X - 2(Y - 1) \in \{1, 2\}\) (\(R = 1\) si Alice gagne).</div>
  <div class="q"><strong>Q1.</strong> Pour \(k \in \mathbb{N}\), exprimer l'événement \((Y \gt k)\) à l'aide de \(X\). En déduire la loi de \(Y\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer la loi de \(R\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(Y\) et \(R\) sont indépendantes.</div>
  <div class="q"><strong>Q4.</strong> Application au jeu de dé (\(p = \frac16\)) : probabilité qu'Alice gagne, loi du numéro du tour décisif. Le fait de savoir que la partie a duré longtemps avantage-t-il l'un des joueurs ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On a \(Y = j\) exactement quand \(X \in \{2j - 1, 2j\}\). Le premier succès arrive après le tour \(k\) si et seulement s'il arrive après l'épreuve \(2k\) : \((Y \gt k) = (X \gt 2k)\). D'où \(P(Y \gt k) = (1-p)^{2k} = \big((1-p)^2\big)^k\), queue d'une loi géométrique (méthode des queues) : \(Y \sim \mathcal{G}\big(1 - (1-p)^2\big) = \mathcal{G}\big(p(2 - p)\big)\).</p>
    <p><strong>Q2.</strong> \((R = 1)\) est l'événement « \(X\) impair » :</p>
    <div class="formula">$$P(R = 1) = \sum_{j \geq 1} p(1-p)^{2j-2} = \frac{p}{1 - (1-p)^2} = \frac{1}{2 - p}, \qquad P(R = 2) = \frac{1 - p}{2 - p}.$$</div>
    <p><strong>Q3.</strong> Les couples possibles forment le produit \(\mathbb{N}^* \times \{1, 2\}\). Pour \(j \geq 1\), \(P(Y = j) = p(2-p)(1-p)^{2j-2}\) et :</p>
    <div class="formula">$$\begin{aligned} P(Y = j, R = 1) &= P(X = 2j - 1) = p(1-p)^{2j-2} = P(Y = j) \cdot \frac{1}{2-p}, \\ P(Y = j, R = 2) &= P(X = 2j) = p(1-p)^{2j-1} = P(Y = j) \cdot \frac{1-p}{2-p}. \end{aligned}$$</div>
    <p>La loi conjointe est le produit des marginales sur tout \(\mathbb{N}^* \times \{1, 2\}\) : \(Y \perp\!\!\!\perp R\).</p>
    <p><strong>Q4.</strong> Avec \(p = \frac16\) : Alice gagne avec la probabilité \(\frac{1}{2 - 1/6} = \frac{6}{11} \approx 0{,}545\), Bob avec \(\frac{5}{11}\) ; le tour décisif suit \(\mathcal{G}(\frac{11}{36})\). Par indépendance, la loi conditionnelle de \(R\) sachant \((Y = j)\) ne dépend pas de \(j\) : savoir que la partie a duré \(j\) tours ne change pas les chances, Alice garde l'avantage \(\frac{6}{11}\) (c'est l'absence de mémoire : chaque nouveau tour recommence la partie).</p></div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Trois lancers : une loi conjointe</h3>
  <div class="statement">On lance trois fois une pièce équilibrée. On note \(X\) le nombre de piles obtenus et \(Y\) le rang du premier pile, avec la convention \(Y = 0\) si l'on n'obtient aucun pile.</div>
  <div class="q"><strong>Q1.</strong> Donner la loi conjointe de \((X, Y)\) sous forme de tableau.</div>
  <div class="q"><strong>Q2.</strong> En déduire les lois marginales.</div>
  <div class="q"><strong>Q3.</strong> Déterminer la loi conditionnelle de \(Y\) sachant \((X = 1)\), puis celle de \(X\) sachant \((Y = 1)\).</div>
  <div class="q"><strong>Q4.</strong> Les variables \(X\) et \(Y\) sont-elles indépendantes ? Calculer \(P(X = Y)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les 8 suites de trois lancers sont équiprobables. PPP donne \((3, 1)\) ; PPF et PFP donnent \((2, 1)\) ; PFF donne \((1, 1)\) ; FPP donne \((2, 2)\) ; FPF donne \((1, 2)\) ; FFP donne \((1, 3)\) ; FFF donne \((0, 0)\). D'où le tableau :</p>
    <table>
      <tr><th>\(X \backslash Y\)</th><th>\(0\)</th><th>\(1\)</th><th>\(2\)</th><th>\(3\)</th><th>loi de \(X\)</th></tr>
      <tr><td>\(0\)</td><td>\(\frac18\)</td><td>\(0\)</td><td>\(0\)</td><td>\(0\)</td><td>\(\frac18\)</td></tr>
      <tr><td>\(1\)</td><td>\(0\)</td><td>\(\frac18\)</td><td>\(\frac18\)</td><td>\(\frac18\)</td><td>\(\frac38\)</td></tr>
      <tr><td>\(2\)</td><td>\(0\)</td><td>\(\frac14\)</td><td>\(\frac18\)</td><td>\(0\)</td><td>\(\frac38\)</td></tr>
      <tr><td>\(3\)</td><td>\(0\)</td><td>\(\frac18\)</td><td>\(0\)</td><td>\(0\)</td><td>\(\frac18\)</td></tr>
      <tr><td>loi de \(Y\)</td><td>\(\frac18\)</td><td>\(\frac12\)</td><td>\(\frac14\)</td><td>\(\frac18\)</td><td>\(1\)</td></tr>
    </table>
    <p><strong>Q2.</strong> En sommant les lignes : \(X \sim \mathcal{B}(3, \frac12)\), comme attendu. En sommant les colonnes : \(P(Y = 0) = \frac18\), \(P(Y = 1) = \frac12\), \(P(Y = 2) = \frac14\), \(P(Y = 3) = \frac18\).</p>
    <p><strong>Q3.</strong> Ligne \(X = 1\) : \(\left(0, \frac18, \frac18, \frac18\right)\), divisée par \(\frac38\) : sachant qu'il y a un seul pile, son rang suit la loi uniforme sur \(\{1, 2, 3\}\). Colonne \(Y = 1\) : \(\left(0, \frac18, \frac14, \frac18\right)\), divisée par \(\frac12\) : sachant que le premier lancer est pile, \(X\) vaut 1, 2, 3 avec les probabilités \(\frac14, \frac12, \frac14\), c'est-à-dire que \(X - 1\) suit \(\mathcal{B}(2, \frac12)\) (les deux derniers lancers).</p>
    <p><strong>Q4.</strong> Non : \(P(X = 0, Y = 1) = 0\) alors que \(P(X = 0)\,P(Y = 1) = \frac{1}{16} \neq 0\). Enfin \(P(X = Y)\) est la somme des cases \((0, 0)\), \((1, 1)\) et \((2, 2)\), soit \(\frac38\) (la case \((3, 3)\) est vide).</p></div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Un dé, puis des pièces</h3>
  <div class="statement">On lance un dé équilibré ; s'il donne \(N\), on lance \(N\) pièces équilibrées et l'on note \(X\) le nombre de piles obtenus.</div>
  <div class="q"><strong>Q1.</strong> Donner, pour \(n \in [\![ 1, 6 ]\!]\), la loi conditionnelle de \(X\) sachant \((N = n)\), puis la loi conjointe de \((N, X)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(X = 0)\), \(P(X = 1)\) et \(P(X = 6)\).</div>
  <div class="q"><strong>Q3.</strong> On observe qu'aucune pièce ne donne pile. Déterminer la loi conditionnelle de \(N\) sachant \((X = 0)\) ; quelle est la valeur la plus probable de \(N\) ?</div>
  <div class="q"><strong>Q4.</strong> \(N\) et \(X\) sont-elles indépendantes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Sachant \((N = n)\), on compte les piles parmi \(n\) lancers indépendants : la loi conditionnelle est \(\mathcal{B}(n, \frac12)\). Par les probabilités composées, pour \(0 \leq k \leq n \leq 6\) :</p>
    <div class="formula">$$P(N = n, X = k) = P(N = n)\,P(X = k \mid N = n) = \frac16\binom{n}{k}\frac{1}{2^n},$$</div>
    <p>et \(P(N = n, X = k) = 0\) si \(k \gt n\).</p>
    <p><strong>Q2.</strong> Probabilités totales sur le système complet \((N = n)_{1 \leq n \leq 6}\) :</p>
    <div class="formula">$$\begin{aligned} P(X = 0) &= \frac16\sum_{n=1}^{6}\frac{1}{2^n} = \frac16\Big(1 - \frac{1}{64}\Big) = \frac{21}{128} \approx 0{,}164, \\ P(X = 1) &= \frac16\sum_{n=1}^{6}\frac{n}{2^n} = \frac16 \cdot \frac{120}{64} = \frac{5}{16}. \end{aligned}$$</div>
    <p>Seul \(n = 6\) contribue à \(P(X = 6) = \frac16 \cdot \frac{1}{64} = \frac{1}{384}\).</p>
    <p><strong>Q3.</strong> Par la formule de Bayes, pour \(1 \leq n \leq 6\) :</p>
    <div class="formula">$$P(N = n \mid X = 0) = \frac{P(N = n, X = 0)}{P(X = 0)} = \frac{\frac16 \cdot 2^{-n}}{21/128} = \frac{64}{63} \cdot \frac{1}{2^n}.$$</div>
    <p>Ces probabilités décroissent avec \(n\) : la valeur la plus probable est \(N = 1\), avec \(P(N = 1 \mid X = 0) = \frac{32}{63} \approx 0{,}51\), alors que \(P(N = 6 \mid X = 0) = \frac{1}{63}\). Contrôle : \(\frac{64}{63}\left(1 - \frac{1}{64}\right) = 1\).</p>
    <p><strong>Q4.</strong> Non : \(P(N = 1, X = 6) = 0\) alors que \(P(N = 1)\,P(X = 6) \gt 0\). D'ailleurs la loi conditionnelle de \(N\) sachant \((X = 0)\) n'est pas la loi uniforme.</p></div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Deux géométriques : somme et loi conditionnelle</h3>
  <div class="statement">Soit \(p \in \,]0, 1[\) et \(X, Y\) deux variables indépendantes de même loi \(\mathcal{G}(p)\). On pose \(S = X + Y\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la loi de \(S\).</div>
  <div class="q"><strong>Q2.</strong> Soit \(n \geq 2\). Déterminer la loi conditionnelle de \(X\) sachant \((S = n)\). Interpréter.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(P(X = Y)\), puis \(P(X \lt Y)\).</div>
  <div class="q"><strong>Q4.</strong> Deux joueurs lancent chacun leur dé à chaque tour jusqu'à obtenir un 6. Probabilité qu'ils l'obtiennent au même tour ? que le premier joueur l'obtienne strictement avant l'autre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(S\) prend ses valeurs entières à partir de 2. Pour \(n \geq 2\), en découpant selon la valeur \(k \in [\![ 1, n - 1 ]\!]\) de \(X\) (il faut \(Y = n - k \geq 1\)) et par indépendance :</p>
    <div class="formula">$$P(S = n) = \sum_{k=1}^{n-1} p(1-p)^{k-1}\,p(1-p)^{n-k-1} = (n-1)\,p^2(1-p)^{n-2}.$$</div>
    <p><strong>Q2.</strong> Pour \(1 \leq k \leq n - 1\), la probabilité \(P(X = k, S = n)\), égale à \(P(X = k, Y = n - k)\), vaut \(p^2(1-p)^{n-2}\), qui ne dépend pas de \(k\). Donc</p>
    <div class="formula">$$P(X = k \mid S = n) = \frac{p^2(1-p)^{n-2}}{(n-1)p^2(1-p)^{n-2}} = \frac{1}{n-1}, \qquad 1 \leq k \leq n - 1.$$</div>
    <p>Sachant \((S = n)\), \(X\) suit la loi uniforme sur \([\![ 1, n - 1 ]\!]\). Interprétation : si \(X\) et \(Y\) sont le premier rang de succès et l'attente qui suit, \(S\) est le rang du deuxième succès (cours, §6 et §9) ; sachant que le deuxième succès a lieu au rang \(n\), le premier est réparti uniformément sur les \(n - 1\) rangs précédents, quel que soit \(p\).</p>
    <p><strong>Q3.</strong> Par incompatibilité des \((X = k, Y = k)\) et indépendance :</p>
    <div class="formula">$$P(X = Y) = \sum_{k \geq 1} p^2(1-p)^{2k-2} = \frac{p^2}{1 - (1-p)^2} = \frac{p}{2 - p}.$$</div>
    <p>Le couple \((Y, X)\) a la même loi que \((X, Y)\) (même loi conjointe par indépendance), donc \(P(X \lt Y) = P(Y \lt X)\), et ces deux probabilités valent \(\frac12\left(1 - \frac{p}{2-p}\right) = \frac{1 - p}{2 - p}\).</p>
    <p><strong>Q4.</strong> Avec \(p = \frac16\) : \(P(X = Y) = \frac{1/6}{11/6} = \frac{1}{11} \approx 0{,}091\) et \(P(X \lt Y) = \frac{5}{11} \approx 0{,}455\).</p></div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Signes aléatoires : indépendance deux à deux, pas mutuelle</h3>
  <div class="statement">Soit \(X, Y, Z\) trois variables indépendantes, chacune de loi uniforme sur \(\{-1, 1\}\). On pose \(U = XY\), \(V = YZ\) et \(W = ZX\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la loi de \(U\) (et, par symétrie, celles de \(V\) et \(W\)).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(U\) et \(V\) sont indépendantes. Que dire des couples \((V, W)\) et \((U, W)\) ?</div>
  <div class="q"><strong>Q3.</strong> Les variables \(U, V, W\) sont-elles (mutuellement) indépendantes ?</div>
  <div class="q"><strong>Q4.</strong> Justifier sans calcul que \(U\) et \(Z\) sont indépendantes. Exprimer \(U\) en fonction de \(V\) et \(W\) ; \(U\) est-elle indépendante du couple \((V, W)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(U\) prend les valeurs \(\pm 1\), et \((U = 1) = (X = Y)\) est la réunion disjointe de \((X = 1, Y = 1)\) et de \((X = -1, Y = -1)\) : \(P(U = 1) = \frac14 + \frac14 = \frac12\). \(U\), \(V\), \(W\) suivent la loi uniforme sur \(\{-1, 1\}\).</p>
    <p><strong>Q2.</strong> Soit \(a, b \in \{-1, 1\}\). Comme \(y^2 = 1\), on a \(U = a\) si et seulement si \(X = aY\), et \(V = b\) si et seulement si \(Z = bY\). Par la formule des probabilités totales sur \((Y = y)_{y = \pm 1}\), puis l'indépendance de \(X, Y, Z\) :</p>
    <div class="formula">$$P(U = a, V = b) = \sum_{y = \pm 1} P(Y = y)\,P(X = ay)\,P(Z = by) = 2 \times \frac18 = \frac14 = P(U = a)\,P(V = b).$$</div>
    <p>Donc \(U \perp\!\!\!\perp V\). Les rôles de \(X, Y, Z\) étant symétriques, \(V \perp\!\!\!\perp W\) et \(U \perp\!\!\!\perp W\) : les trois variables sont indépendantes deux à deux.</p>
    <p><strong>Q3.</strong> Non : \(UVW = X^2Y^2Z^2 = 1\), donc \(P(U = 1, V = 1, W = -1) = 0\), alors que \(P(U = 1)P(V = 1)P(W = -1) = \frac18\). L'indépendance deux à deux n'entraîne pas l'indépendance mutuelle.</p>
    <p><strong>Q4.</strong> \(U = f(X, Y)\) avec \(f(x, y) = xy\) et \(Z = g(Z)\) portent sur les groupes disjoints \(\{X, Y\}\) et \(\{Z\}\) : elles sont indépendantes par le lemme des coalitions. En revanche \(VW = YZ^2X = XY = U\) : \(U\) est une fonction du couple \((V, W)\), donc n'en est pas indépendante (\(P(U = -1, V = 1, W = 1) = 0\), alors que \(P(U = -1)\,P(V = 1, W = 1) = \frac18\)), bien qu'elle soit indépendante de \(V\) et de \(W\) séparément.</p></div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un compteur de désintégrations</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : loi de Poisson, approximation de la loi binomiale, lois conditionnelles, sommes, suites i.i.d., minimum de lois géométriques).</div>
  <div class="statement">On étudie le nombre de désintégrations d'une source radioactive pendant une seconde, puis ce qu'en voit un détecteur. Toutes les variables sont définies sur un même espace probabilisé \((\Omega, \mathcal{A}, P)\) et \(\lambda\), \(\mu\) désignent des réels strictement positifs.</div>

  <p class="exo-part">Partie A — La loi des événements rares</p>
  <div class="q"><strong>A1.</strong> La source contient \(n\) noyaux ; pendant une seconde, chacun se désintègre avec la probabilité \(p_n \in \,]0, 1[\), indépendamment des autres. Quelle est la loi du nombre \(N_n\) de désintégrations ?</div>
  <div class="q"><strong>A2.</strong> On suppose que \(n\,p_n \to \lambda\). Montrer que, pour tout \(k \in \mathbb{N}\), \(P(N_n = k) \to e^{-\lambda}\dfrac{\lambda^k}{k!}\) quand \(n \to +\infty\).</div>
  <div class="q"><strong>A3.</strong> Application : \(n = 2 \times 10^{6}\) noyaux et \(p_n = 1{,}5 \times 10^{-6}\). Donner une valeur approchée de la probabilité d'observer au moins deux désintégrations.</div>

  <p class="exo-part">Partie B — Un détecteur imparfait</p>
  <div class="statement">On suppose désormais que le nombre \(N\) de désintégrations en une seconde suit la loi \(\mathcal{P}(\lambda)\). Chaque désintégration est détectée avec la probabilité \(a \in \,]0, 1[\), indépendamment des autres et de leur nombre : sachant \((N = n)\), le nombre \(D\) de désintégrations détectées suit la loi \(\mathcal{B}(n, a)\).</div>
  <div class="q"><strong>B1.</strong> Calculer \(P(D = k)\) pour \(k \in \mathbb{N}\) et reconnaître la loi de \(D\).</div>
  <div class="q"><strong>B2.</strong> Soit \(k \in \mathbb{N}\). Déterminer la loi conditionnelle de \(N\) sachant \((D = k)\) ; montrer que, sachant \((D = k)\), \(N - k\) suit la loi \(\mathcal{P}\big(\lambda(1 - a)\big)\). Interpréter.</div>
  <div class="q"><strong>B3.</strong> On prend \(\lambda = 3\) et \(a = 0{,}8\). Le détecteur n'a rien signalé pendant une seconde. Quelle est la probabilité qu'aucune désintégration n'ait eu lieu ?</div>

  <p class="exo-part">Partie C — Deux sources</p>
  <div class="statement">Deux sources indépendantes produisent en une seconde \(X \sim \mathcal{P}(\lambda)\) et \(Y \sim \mathcal{P}(\mu)\) désintégrations, toutes détectées.</div>
  <div class="q"><strong>C1.</strong> Déterminer la loi de \(X + Y\).</div>
  <div class="q"><strong>C2.</strong> Soit \(n \in \mathbb{N}\). Montrer que la loi conditionnelle de \(X\) sachant \((X + Y = n)\) est la loi \(\mathcal{B}\Big(n, \dfrac{\lambda}{\lambda + \mu}\Big)\).</div>
  <div class="q"><strong>C3.</strong> On prend \(\lambda = 2\) et \(\mu = 3\). On a compté 5 désintégrations en une seconde : quelle est la probabilité qu'elles proviennent toutes de la première source ?</div>

  <p class="exo-part">Partie D — Attendre une seconde silencieuse</p>
  <div class="statement">On observe les deux sources pendant des secondes successives. On note \(X_k\) et \(Y_k\) les nombres de désintégrations de chaque source pendant la \(k\)-ième seconde ; les variables \(X_1, Y_1, X_2, Y_2, \ldots\) sont indépendantes, les \(X_k\) de loi \(\mathcal{P}(\lambda)\), les \(Y_k\) de loi \(\mathcal{P}(\mu)\). On note \(T\) (resp. \(T'\)) le rang de la première seconde pendant laquelle la première (resp. la seconde) source ne produit aucune désintégration.</div>
  <div class="q"><strong>D1.</strong> Calculer \(P(T \gt k)\) pour \(k \in \mathbb{N}\). En déduire que \(T\) est presque sûrement défini et suit une loi géométrique dont on précisera le paramètre.</div>
  <div class="q"><strong>D2.</strong> Soit \(M = \min(T, T')\). Justifier que les événements \((T \gt k)\) et \((T' \gt k)\) sont indépendants, puis déterminer la loi de \(M\). Que représente \(M\) ?</div>
  <div class="q"><strong>D3.</strong> Soit \(L\) le rang de la première seconde pendant laquelle les deux sources sont silencieuses en même temps. Déterminer la loi de \(L\).</div>
  <div class="q"><strong>D4.</strong> Application numérique : \(\lambda = 1\), \(\mu = 2\). Calculer \(P(M \gt 3)\) et \(P(L = 1)\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> On compte les succès (« le noyau se désintègre ») parmi \(n\) épreuves indépendantes de même probabilité \(p_n\) : \(N_n \sim \mathcal{B}(n, p_n)\).</p>
    <p><strong>A2.</strong> Fixons \(k\) et prenons \(n \geq k\). En écrivant \(\binom{n}{k} = \frac{n(n-1)\cdots(n-k+1)}{k!}\) :</p>
    <div class="formula">$$P(N_n = k) = \frac{1}{k!}\prod_{j=0}^{k-1}\big((n - j)\,p_n\big) \times (1 - p_n)^{n-k}.$$</div>
    <p>Comme \(np_n \to \lambda\), \(p_n = \frac{np_n}{n} \to 0\), donc chaque facteur \((n - j)p_n = np_n - jp_n\) tend vers \(\lambda\) et le produit vers \(\lambda^k\). Ensuite \((1 - p_n)^{n-k} = \exp\big((n - k)\ln(1 - p_n)\big)\) avec \(\ln(1 - p_n) \sim -p_n\), donc \((n - k)\ln(1 - p_n) \sim -(n - k)p_n \to -\lambda\), et \((1 - p_n)^{n-k} \to e^{-\lambda}\) par continuité de l'exponentielle. D'où la limite \(e^{-\lambda}\frac{\lambda^k}{k!}\).</p>
    <p><strong>A3.</strong> \(np_n = 3\) : on approche \(\mathcal{B}(n, p_n)\) par \(\mathcal{P}(3)\), d'où</p>
    <div class="formula">$$P(N_n \geq 2) = 1 - P(N_n = 0) - P(N_n = 1) \approx 1 - e^{-3}(1 + 3) = 1 - 4e^{-3} \approx 0{,}801$$</div>
    <p>(la valeur exacte coïncide à \(10^{-6}\) près).</p>
    <p><strong>B1.</strong> \(P(D = k \mid N = n) = 0\) pour \(n \lt k\). Par les probabilités totales sur le système complet \((N = n)_{n \in \mathbb{N}}\) :</p>
    <div class="formula">$$\begin{aligned} P(D = k) &= \sum_{n \geq k} e^{-\lambda}\frac{\lambda^n}{n!}\binom{n}{k}a^k(1-a)^{n-k} \\ &= e^{-\lambda}\frac{(\lambda a)^k}{k!}\sum_{n \geq k}\frac{\big(\lambda(1-a)\big)^{n-k}}{(n-k)!} \\ &= e^{-\lambda}\frac{(\lambda a)^k}{k!}\,e^{\lambda(1-a)} = e^{-\lambda a}\frac{(\lambda a)^k}{k!}. \end{aligned}$$</div>
    <p>Donc \(D \sim \mathcal{P}(\lambda a)\) : le détecteur voit en moyenne \(\lambda a\) désintégrations.</p>
    <p><strong>B2.</strong> Pour \(n \geq k\), par la formule de Bayes et le calcul de B1 :</p>
    <div class="formula">$$\begin{aligned} P(N = n \mid D = k) &= \frac{e^{-\lambda}\frac{\lambda^n}{n!}\binom{n}{k}a^k(1-a)^{n-k}}{e^{-\lambda a}\frac{(\lambda a)^k}{k!}} \\ &= e^{-\lambda(1-a)}\frac{\big(\lambda(1-a)\big)^{n-k}}{(n-k)!}, \end{aligned}$$</div>
    <p>et \(P(N = n \mid D = k) = 0\) pour \(n \lt k\). Ainsi, pour \(m \in \mathbb{N}\), \(P(N - k = m \mid D = k)\) vaut \(e^{-\lambda(1-a)}\frac{(\lambda(1-a))^m}{m!}\) : sachant \((D = k)\), le nombre \(N - k\) de désintégrations manquées suit \(\mathcal{P}\big(\lambda(1-a)\big)\), loi qui ne dépend pas de \(k\). Connaître le nombre de désintégrations détectées ne renseigne pas sur le nombre de désintégrations manquées.</p>
    <p><strong>B3.</strong> C'est B2 avec \(k = 0\) et \(m = 0\) : \(P(N = 0 \mid D = 0) = e^{-\lambda(1-a)}\), soit \(e^{-0{,}6} \approx 0{,}549\). Un détecteur muet laisse donc encore une chance sur deux environ qu'il y ait eu au moins une désintégration.</p>
    <p><strong>C1.</strong> Pour \(n \in \mathbb{N}\), par indépendance et la formule du binôme :</p>
    <div class="formula">$$\begin{aligned} P(X + Y = n) &= \sum_{k=0}^{n} e^{-\lambda}\frac{\lambda^k}{k!}\,e^{-\mu}\frac{\mu^{n-k}}{(n-k)!} \\ &= \frac{e^{-(\lambda + \mu)}}{n!}\sum_{k=0}^{n}\binom{n}{k}\lambda^k\mu^{n-k} = e^{-(\lambda + \mu)}\frac{(\lambda + \mu)^n}{n!}. \end{aligned}$$</div>
    <p>Donc \(X + Y \sim \mathcal{P}(\lambda + \mu)\).</p>
    <p><strong>C2.</strong> Pour \(0 \leq k \leq n\), l'événement \((X = k, X + Y = n)\) est \((X = k, Y = n - k)\), donc</p>
    <div class="formula">$$\begin{aligned} P(X = k \mid X + Y = n) &= \frac{e^{-\lambda}\frac{\lambda^k}{k!}\,e^{-\mu}\frac{\mu^{n-k}}{(n-k)!}}{e^{-(\lambda + \mu)}\frac{(\lambda + \mu)^n}{n!}} \\ &= \binom{n}{k}\Big(\frac{\lambda}{\lambda + \mu}\Big)^k\Big(\frac{\mu}{\lambda + \mu}\Big)^{n-k}, \end{aligned}$$</div>
    <p>et cette probabilité est nulle pour \(k \gt n\) : la loi conditionnelle est \(\mathcal{B}\big(n, \frac{\lambda}{\lambda + \mu}\big)\). Tout se passe comme si chacune des \(n\) désintégrations provenait de la première source avec la probabilité \(\frac{\lambda}{\lambda + \mu}\), indépendamment des autres.</p>
    <p><strong>C3.</strong> \(P(X = 5 \mid X + Y = 5) = \left(\frac25\right)^5\), soit \(\frac{32}{3125} \approx 0{,}010\).</p>
    <p><strong>D1.</strong> La première source est active pendant chacune des \(k\) premières secondes : \((T \gt k) = (X_1 \geq 1) \cap \cdots \cap (X_k \geq 1)\). Par indépendance, \(P(T \gt k) = (1 - e^{-\lambda})^k\). L'événement « la source n'est jamais silencieuse » est l'intersection des événements décroissants \((T \gt k)\) : par continuité décroissante, sa probabilité vaut \(\lim_k (1 - e^{-\lambda})^k = 0\), donc \(T\) est presque sûrement défini. Enfin \(P(T = k) = P(T \gt k - 1) - P(T \gt k)\), soit \(e^{-\lambda}(1 - e^{-\lambda})^{k-1}\) : \(T \sim \mathcal{G}(e^{-\lambda})\), et de même \(T' \sim \mathcal{G}(e^{-\mu})\).</p>
    <p><strong>D2.</strong> \((T \gt k)\) ne dépend que de \((X_1, \ldots, X_k)\) et \((T' \gt k)\) que de \((Y_1, \ldots, Y_k)\) : ce sont des événements liés à deux groupes disjoints de variables indépendantes, donc indépendants (lemme des coalitions, appliqué à \(\mathbf{1}_{(T \gt k)}\) et \(\mathbf{1}_{(T' \gt k)}\)). Comme \((M \gt k) = (T \gt k) \cap (T' \gt k)\) :</p>
    <div class="formula">$$P(M \gt k) = \big((1 - e^{-\lambda})(1 - e^{-\mu})\big)^k, \qquad M \sim \mathcal{G}\big(1 - (1 - e^{-\lambda})(1 - e^{-\mu})\big).$$</div>
    <p>\(M\) est le rang de la première seconde pendant laquelle au moins une des deux sources est silencieuse.</p>
    <p><strong>D3.</strong> Les événements \(B_k = (X_k = 0) \cap (Y_k = 0)\), « les deux sources sont silencieuses pendant la seconde \(k\) », sont indépendants (coalitions sur les groupes disjoints \(\{X_k, Y_k\}\)), de probabilité \(e^{-\lambda}e^{-\mu} = e^{-(\lambda + \mu)}\). \(L\) est le rang du premier d'entre eux qui se réalise : \(L \sim \mathcal{G}\big(e^{-(\lambda + \mu)}\big)\). (On peut aussi remarquer que les \(X_k + Y_k\) sont i.i.d. de loi \(\mathcal{P}(\lambda + \mu)\) et appliquer D1.)</p>
    <p><strong>D4.</strong> \(P(M \gt 3) = \big((1 - e^{-1})(1 - e^{-2})\big)^3\), soit environ \(0{,}547^3 \approx 0{,}163\), et \(P(L = 1) = e^{-3} \approx 0{,}050\).</p></div>
