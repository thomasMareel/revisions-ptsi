<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Compétences B2 « Modéliser un convertisseur électromécanique » et « Modéliser la commande d'un ensemble asservi constitué du modulateur d'énergie, de la machine électrique et de sa charge » (S4), F2 « Choisir les composants de la chaîne de puissance » et F3 « Dimensionner un composant à partir d'une documentation technique » (S4). La physique des machines n'est pas au programme : <strong>les modèles des machines alternatives sont fournis</strong>, étudiés en régime permanent à fréquence fixe ou lentement variable, et seule la commande scalaire (U/f constant) des machines alternatives est étudiée. Le modèle de la machine à courant continu vient du chapitre « Machine à courant continu » de 1ʳᵉ année (rappel au §9) ; les convertisseurs qui alimentent les machines sont étudiés dans « Régimes alternatifs, redresseurs et onduleurs », les boucles de courant et de vitesse dans « Correction des SLCI » (§7).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Champ tournant</strong> (description qualitative) : vitesse de synchronisme, inversion du sens par permutation de deux phases (§1).</li>
        <li><strong>Machine asynchrone</strong> : glissement, plaque signalétique (§2) ; modèle statique monophasé équivalent (inductance magnétisante en parallèle avec la résistance et l'inductance de fuite du rotor) et bilan des puissances (§3) ; couple en fonction du glissement, point de fonctionnement et stabilité, fonctionnement en génératrice (§4).</li>
        <li><strong>Commande scalaire à U/f constant</strong> (§5).</li>
        <li><strong>Machine synchrone</strong> : modèle statique monophasé (f.é.m., réactance synchrone, résistance), diagramme de Fresnel (§6) ; bilan des puissances, couple, autopilotage (§7).</li>
        <li><strong>Commande en couple et en vitesse ; modèle dynamique dans le plan (d, q)</strong>, fourni par les énoncés (§8).</li>
        <li><strong>Modèle électromécanique de la machine à courant continu</strong> (rappel, §9).</li>
        <li><strong>Fonctionnement en régime permanent dans les quatre quadrants</strong> des machines alimentées en grandeurs alternatives (§4, §7, synthèse au §9).</li>
        <li><strong>Choisir une motorisation</strong> : puissance, couple crête, couple thermique équivalent (§9).</li>
      </ul>
      <p>Hors programme (signalé dans le texte) : démonstration du théorème de Ferraris ; établissement des transformations de Clarke, de Concordia et de Park ; commande vectorielle de la machine asynchrone et défluxage. Les moteurs monophasés sont cités pour la culture.</p>

<div class="course-section">
  <div class="sec-num">§1 · CHAMP TOURNANT</div>
  <h2>Faire tourner un champ avec des bobines immobiles</h2>
  <div class="intro">Toutes les machines triphasées à courant alternatif reposent sur la même idée : trois enroulements fixes, décalés dans l'espace et parcourus par des courants décalés dans le temps, créent dans l'entrefer un champ magnétique qui tourne. Le rotor n'a plus qu'à suivre ce champ — exactement (machine <strong>synchrone</strong>) ou avec un léger retard (machine <strong>asynchrone</strong>).</div>

  <h3>Le stator triphasé</h3>
  <p>Le stator est un empilement de tôles dont les encoches logent trois enroulements identiques 1, 2, 3. Pour une machine bipolaire, leurs axes sont décalés de \(2\pi/3\) et ils reçoivent un système de courants triphasés équilibrés de pulsation \(\omega\) (avec \(k \in \{1,2,3\}\)) :</p>
  <div class="formula">$$i_k(t) = I_m\cos\!\left(\omega t - \frac{2(k-1)\pi}{3}\right)$$</div>
  <div class="prop-box">
    <strong>Champ tournant (théorème de Ferraris, admis).</strong> Chaque enroulement, seul, crée dans l'entrefer un champ <em>pulsant</em>, fixe en direction. Les trois ensemble, alimentés par un système triphasé équilibré, créent un champ d'<strong>amplitude constante</strong> qui <strong>tourne</strong> à la vitesse angulaire \(\omega\), dans le sens de la succession des phases 1 → 2 → 3.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour aller plus loin (hors programme)</span>
    <span class="prompt">Modèle du champ et démonstration du théorème de Ferraris.</span>
    <div class="content">
      <p>En première approximation, l'enroulement \(k\) crée dans l'entrefer, dans la direction repérée par l'angle \(\theta\), un champ radial \(b_k = \kappa\, i_k\cos\big(\theta - 2(k-1)\pi/3\big)\) : un champ <em>pulsant</em>, fixe en direction.</p>
      <p>La superposition des trois champs pulsants donne</p>
      <div class="formula">$$b(\theta,t) = \frac{3}{2}\,\kappa I_m\cos(\omega t - \theta)$$</div>
      <p>un champ d'amplitude constante (3/2 fois l'amplitude due à un seul enroulement) dont le maximum se trouve en \(\theta = \omega t\) : il tourne à la vitesse angulaire \(\omega\).</p>
      <p>Notons \(\delta_k = 2(k-1)\pi/3\) et linéarisons : \(\cos a\cos b = \tfrac12[\cos(a-b) + \cos(a+b)]\). Pour chaque enroulement :</p>
      $$\begin{aligned}&i_k\cos(\theta-\delta_k)\\ &\quad= \frac{I_m}{2}\Big[\cos(\omega t-\theta) + \cos(\omega t+\theta-2\delta_k)\Big]\end{aligned}$$
      <p>Le premier terme est identique pour les trois enroulements. Les seconds sont trois cosinus de même amplitude déphasés de \(4\pi/3\) (car \(2\delta_k\) vaut \(0\), \(4\pi/3\), \(8\pi/3\)) : leur somme est nulle. Il reste \(3\times\frac{I_m}{2}\cos(\omega t-\theta)\).</p>
      <p>Avec \(p\) paires de pôles (paragraphe suivant), le même calcul donne \(b = \frac32\kappa I_m\cos(\omega t - p\theta)\).</p>
    </div>
  </div>

  <h3>Machine à \(p\) paires de pôles</h3>
  <p>En répartissant chaque phase en \(p\) groupes de bobines, on crée le long de l'entrefer \(p\) pôles nord et \(p\) pôles sud alternés. Le motif se déplace d'un pas polaire \(\pi/p\) par demi-période : la rotation est \(p\) fois plus lente.</p>
  <div class="def-box">
    <strong>Vitesse de synchronisme.</strong> Le champ statorique tourne à
    $$\Omega_s = \frac{\omega}{p}\ \ (\text{rad/s}),\qquad N_s = \frac{60\,f}{p}\ \ (\text{tr/min})$$
    où \(f = \omega/2\pi\) est la fréquence d'alimentation et \(p\) le nombre de paires de pôles (\(2p\) pôles).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0;text-align:center">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">\(p\) (à 50 Hz)</th><th style="padding:.35rem;border:1px solid var(--grid)">1</th><th style="padding:.35rem;border:1px solid var(--grid)">2</th><th style="padding:.35rem;border:1px solid var(--grid)">3</th><th style="padding:.35rem;border:1px solid var(--grid)">4</th><th style="padding:.35rem;border:1px solid var(--grid)">6</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">\(N_s\) (tr/min)</td><td style="padding:.35rem;border:1px solid var(--grid)">3000</td><td style="padding:.35rem;border:1px solid var(--grid)">1500</td><td style="padding:.35rem;border:1px solid var(--grid)">1000</td><td style="padding:.35rem;border:1px solid var(--grid)">750</td><td style="padding:.35rem;border:1px solid var(--grid)">500</td></tr>
  </table></div>
  <div class="notice">
    <ul style="margin:.2rem 0">
      <li><strong>Inverser le sens de rotation</strong> : permuter deux des trois phases d'alimentation (l'ordre des phases, donc le sens du champ, s'inverse).</li>
      <li>Pour la culture : un enroulement <strong>monophasé</strong> seul crée un champ pulsant, somme de deux champs tournant en sens opposés : aucun couple au démarrage. Les moteurs monophasés ajoutent un enroulement auxiliaire déphasé (condensateur).</li>
    </ul>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · MACHINE ASYNCHRONE : CONSTITUTION ET GLISSEMENT</div>
  <h2>Un rotor qui court après le champ</h2>
  <div class="intro">Moteur le plus répandu dans l'industrie (pompes, ventilateurs, convoyeurs, compresseurs, machines-outils), la machine asynchrone (MAS) doit son succès à un rotor sans aucune liaison électrique avec l'extérieur : pas de collecteur, quasiment pas d'entretien, un coût faible.</div>

  <h3>Constitution</h3>
  <ul>
    <li><strong>Stator</strong> : enroulement triphasé à \(p\) paires de pôles, relié au réseau ou à un variateur ; il crée le champ tournant.</li>
    <li><strong>Rotor à cage</strong> : barres conductrices (aluminium coulé ou cuivre) noyées dans un empilement de tôles et court-circuitées à chaque extrémité par un anneau. Robuste, sans entretien.</li>
    <li><strong>Rotor bobiné</strong> : enroulement triphasé sorti sur trois bagues et balais, permettant d'insérer des résistances (démarrage) ; réservé à des usages particuliers.</li>
    <li><strong>Entrefer</strong> très faible (quelques dixièmes de millimètre) pour limiter le courant nécessaire à la magnétisation.</li>
  </ul>

  <h3>Principe et glissement</h3>
  <p>Si le rotor tourne à une vitesse \(\Omega\) différente de \(\Omega_s\), le champ balaie ses conducteurs : des f.é.m. y sont induites (loi de Faraday) et les barres en court-circuit sont parcourues par des courants, sur lesquels le champ exerce des forces de Laplace. Conformément à la loi de Lenz, ces forces tendent à annuler la vitesse relative : le rotor est entraîné dans le sens du champ, sans jamais l'atteindre en moteur — au synchronisme, plus d'induction, donc plus de couple.</p>
  <div class="def-box">
    <strong>Glissement.</strong>
    $$g = \frac{\Omega_s - \Omega}{\Omega_s}\qquad\Longleftrightarrow\qquad \Omega = (1-g)\,\Omega_s$$
    \(g = 1\) au démarrage (rotor arrêté) ; \(g \approx 0\) à vide ; \(g\) de l'ordre de 1 à 8 % au point nominal (d'autant plus faible que la machine est puissante) ; \(g \lt 0\) si le rotor est entraîné au-delà de \(\Omega_s\) (génératrice) ; \(g \gt 1\) s'il tourne en sens inverse du champ (freinage).
  </div>
  <div class="prop-box">
    <strong>Fréquence des courants rotoriques.</strong> Le champ tourne par rapport au rotor à \(\Omega_s - \Omega = g\,\Omega_s\) ; les courants induits ont donc la pulsation \(\omega_r = p\,g\,\Omega_s = g\,\omega\), soit une fréquence \(g f\) de quelques hertz en régime nominal (d'où des pertes fer rotoriques négligeables).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un moteur tourne à 965 tr/min sur un réseau 50 Hz. Nombre de pôles, glissement, fréquence rotorique ?</span>
    <div class="content"><p>La vitesse de synchronisme est la valeur de \(3000/p\) immédiatement supérieure à 965 tr/min : \(p = 3\) (6 pôles), \(N_s = 1000\) tr/min. Glissement : \(g = (1000-965)/1000 = 3{,}5\ \%\). Fréquence des courants rotoriques : \(g f = 1{,}75\ \text{Hz}\).</p></div>
  </div>

  <h3>Plaque signalétique et choix du couplage</h3>
  <p>La plaque donne le <strong>point nominal</strong> (régime permanent, échauffement admissible) : puissance <strong>utile</strong> \(P_u\) (mécanique, sur l'arbre), vitesse \(N_n\), facteur de puissance \(\cos\varphi_n\), fréquence, et deux couples (tension ; courant de ligne), un par couplage, par exemple « Δ 400 V / Y 690 V ».</p>
  <div class="prop-box">
    <strong>Règle de couplage.</strong> La plus petite tension de la plaque est celle que supporte <strong>un enroulement</strong>.
    <ul style="margin:.4rem 0">
      <li>Tension composée du réseau \(U\) égale à cette tension : couplage <strong>triangle</strong> (Δ), chaque enroulement entre deux phases.</li>
      <li>\(U\) égale à \(\sqrt3\) fois cette tension : couplage <strong>étoile</strong> (Y), chaque enroulement sous la tension simple \(V = U/\sqrt3\).</li>
      <li>Sinon, la machine n'est pas adaptée au réseau.</li>
    </ul>
    Le courant indiqué est le courant de ligne \(I\) ; en triangle, un enroulement est parcouru par \(J = I/\sqrt3\).
  </div>
  <div class="formula">$$P_a = \sqrt3\,U I\cos\varphi = 3VI\cos\varphi$$ $$C_n = \frac{P_u}{\Omega_n},\qquad \eta = \frac{P_u}{P_a}$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Réseau 400 V entre phases : couplage d'un moteur « Δ 230 V / Y 400 V » ? d'un moteur « Δ 400 V / Y 690 V » ?</span>
    <div class="content"><p>Premier moteur : un enroulement supporte \(230\ \text{V} = 400/\sqrt3\) → <strong>étoile</strong>. Second : un enroulement supporte 400 V → <strong>triangle</strong>. Ce second moteur se prête au <strong>démarrage étoile-triangle</strong> : démarré en étoile, chaque enroulement ne reçoit que \(400/\sqrt3\) V, ce qui divise par 3 le courant de ligne et le couple de démarrage, puis on bascule en triangle.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MAS : MODÈLE ÉQUIVALENT ET BILAN DES PUISSANCES</div>
  <h2>Une phase, deux branches : magnétiser et transmettre</h2>
  <div class="intro">En régime permanent sinusoïdal, la machine triphasée équilibrée se ramène à l'étude d'une phase (étoile équivalente, sous la tension simple \(V\)). Le rotor, dont les courants sont à la pulsation \(g\omega\), est « ramené au stator », comme le secondaire d'un transformateur.</div>

  <h3>Modèle simplifié d'une phase</h3>
  <p>On néglige la résistance et les fuites du stator ainsi que les pertes fer. Il reste :</p>
  <ul>
    <li>l'<strong>inductance magnétisante</strong> \(L_m\), en parallèle sur \(V\) : elle absorbe le courant \(I_m = V/(L_m\omega)\) qui crée le champ tournant ;</li>
    <li>la <strong>branche rotorique</strong> : inductance de fuites \(L_r\) en série avec la résistance \(R_r/g\) (grandeurs ramenées au stator), parcourue par \(I_r\).</li>
  </ul>

  <div class="formula">$$I_r = \frac{V}{\sqrt{\left(\dfrac{R_r}{g}\right)^2 + (L_r\omega)^2}}$$</div>
  <div class="prop-box">
    <strong>Interprétation de \(R_r/g\).</strong> On écrit
    $$\frac{R_r}{g} = R_r + R_r\,\frac{1-g}{g}$$
    La première résistance représente les pertes Joule réelles du rotor ; la seconde, fictive, la puissance convertie en puissance mécanique. Toute la puissance active reçue par cette branche traverse l'entrefer : c'est la <strong>puissance transmise</strong> au rotor.
  </div>

  <h3>Bilan des puissances</h3>
  <div class="formula">$$P_a \xrightarrow{\ -P_{js}-P_{fs}\ } P_{tr} \xrightarrow{\ -P_{jr}\ } P_m \xrightarrow{\ -P_{\text{méca}}\ } P_u$$</div>
  <ul>
    <li>\(P_a = 3VI\cos\varphi\) : puissance absorbée ; \(P_{js}\) et \(P_{fs}\) : pertes Joule et fer du stator (nulles dans le modèle simplifié).</li>
    <li>\(P_{tr} = 3\,\dfrac{R_r}{g}\,I_r^2\) : puissance transmise au rotor par le champ tournant (à \(\Omega_s\)).</li>
    <li>\(P_{jr} = 3R_rI_r^2\) : pertes Joule rotor (les pertes fer rotor sont négligeables, la fréquence rotorique étant faible).</li>
    <li>\(P_m\) : puissance mécanique développée par le couple électromagnétique \(C_{em}\) à la vitesse \(\Omega\) ; \(P_{\text{méca}}\) : frottements et ventilation ; \(P_u = C_u\,\Omega\).</li>
  </ul>
  <div class="prop-box">
    <strong>Relations fondamentales.</strong> Le même couple \(C_{em}\) s'exerce sur le champ (qui tourne à \(\Omega_s\)) et sur le rotor (qui tourne à \(\Omega\)) :
    $$\begin{aligned} P_{tr} &= C_{em}\,\Omega_s\\ P_m &= C_{em}\,\Omega = (1-g)\,P_{tr}\\ P_{jr} &= P_{tr}-P_m = g\,P_{tr}\end{aligned}$$
    On le vérifie aussi sur le modèle : \(P_{jr} = 3R_rI_r^2 = g\times 3\frac{R_r}{g}I_r^2\).
  </div>
  <div class="prop-box">
    <strong>Le rendement est au plus \(1-g\).</strong> Puisque \(P_u \le P_m\) et \(P_{tr} \le P_a\) :
    $$\eta = \frac{P_u}{P_a} \le \frac{P_m}{P_{tr}} = 1-g$$
    Faire varier la vitesse en augmentant le glissement (résistances rotoriques, baisse de tension) dissipe \(g\,P_{tr}\) dans le rotor : c'est très coûteux. Pour régler la vitesse avec un bon rendement, il faut déplacer \(\Omega_s\), donc agir sur la <strong>fréquence</strong> (§5).
  </div>
  <div class="notice">
    <strong>Puissance réactive.</strong> \(Q = 3\dfrac{V^2}{L_m\omega} + 3L_r\omega\, I_r^2 \gt 0\) : la MAS absorbe <strong>toujours</strong> de la puissance réactive (magnétisation et fuites). Son \(\cos\varphi\) vaut environ 0,8 à 0,9 en charge nominale mais devient très faible à vide, où le courant est presque purement magnétisant.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · MAS : COUPLE EN FONCTION DU GLISSEMENT</div>
  <h2>La caractéristique mécanique \(C_{em}(\Omega)\)</h2>
  <div class="intro">Le couple découle directement du modèle : \(C_{em} = P_{tr}/\Omega_s\) avec \(\Omega_s = \omega/p\). Sa forme, très différente de la droite de la MCC, gouverne le démarrage, la stabilité et la plage utile de la machine.</div>
  <div class="formula">$$C_{em}(g) = \frac{3p}{\omega}\;\frac{V^2\,\dfrac{R_r}{g}}{\left(\dfrac{R_r}{g}\right)^2 + (L_r\omega)^2}$$</div>
  <div class="prop-box">
    <strong>Couple maximal.</strong> La fonction \(x \mapsto x/(x^2+a^2)\) est maximale pour \(x = a\) ; le couple est donc maximal pour \(R_r/g = L_r\omega\) :
    $$g_M = \frac{R_r}{L_r\,\omega},\qquad C_{max} = \frac{3p}{2L_r}\left(\frac{V}{\omega}\right)^2$$
    \(C_{max}\) <strong>ne dépend pas de \(R_r\)</strong> et varie comme le carré de \(V/\omega\), c'est-à-dire du flux.
  </div>
  <p>En divisant par \(C_{max}\), on obtient une forme compacte (formule de Kloss), très commode en exercice :</p>
  <div class="formula">$$\frac{C_{em}}{C_{max}} = \frac{2}{\dfrac{g}{g_M} + \dfrac{g_M}{g}}$$</div>

  <h3>Points remarquables</h3>
  <ul>
    <li><strong>Démarrage</strong> (\(g = 1\)) : couple \(C_d\) ci-dessous, voisin de \(2g_M C_{max}\) si \(g_M \ll 1\).</li>
    <li><strong>Faible glissement</strong> (\(g \ll g_M\)) : le couple est proportionnel au glissement ; la caractéristique est une droite très raide au voisinage de \(\Omega_s\) — la vitesse dépend peu de la charge.</li>
    <li><strong>Grand glissement</strong> (\(g \gg g_M\)) : \(C_{em} \approx 2C_{max}\,g_M/g\).</li>
    <li><strong>Synchronisme</strong> (\(g = 0\)) : couple nul.</li>
  </ul>
  <div class="formula">$$C_d = \frac{3p}{\omega}\,\frac{V^2R_r}{R_r^2 + (L_r\omega)^2}$$ $$C_{em} \underset{g \ll g_M}{\approx} \frac{3pV^2}{\omega R_r}\,g$$</div>
  <p>Ordres de grandeur pour une MAS industrielle : \(C_d/C_n \approx 1{,}5\) à 2,5 ; \(C_{max}/C_n \approx 2\) à 3 ; courant de démarrage direct \(I_d/I_n \approx 5\) à 8.</p>

  <h3>Stabilité d'un point de fonctionnement</h3>
  <div class="def-box">
    Le point de fonctionnement est l'intersection de \(C_{em}(\Omega)\) et de la caractéristique de la charge \(C_r(\Omega)\) ramenée sur l'arbre moteur. D'après \(J\,\dfrac{\mathrm{d}\Omega}{\mathrm{d}t} = C_{em}(\Omega) - C_r(\Omega)\), il est <strong>stable</strong> si
    $$\left.\frac{\mathrm{d}(C_{em} - C_r)}{\mathrm{d}\Omega}\right|_{\Omega_0} \lt 0$$
    (une légère survitesse fait apparaître un couple net de freinage).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Pourquoi ce critère de pente ?</span>
    <div class="content"><p>Posons \(\Omega = \Omega_0 + \varepsilon\) avec \(\varepsilon\) petit. Au premier ordre, \(J\dot\varepsilon = \kappa\,\varepsilon\) avec \(\kappa = \frac{\mathrm{d}(C_{em}-C_r)}{\mathrm{d}\Omega}(\Omega_0)\). La perturbation évolue en \(e^{\kappa t/J}\) : elle s'amortit si et seulement si \(\kappa \lt 0\).</p></div>
  </div>
  <div class="prop-box">
    Pour la MAS, la pente de \(C_{em}(\Omega)\) est négative entre le couple maximal et le synchronisme (\(0 \lt g \lt g_M\)) : c'est la <strong>zone utile</strong>, stable pour une charge à couple constant ou croissant avec la vitesse. Sur la branche de gauche (\(g \gt g_M\)), un point à couple constant est instable : la machine accélère jusqu'à la zone utile ou cale. Le démarrage exige \(C_d \gt C_r(0)\).
  </div>

  <h3>Fonctionnement en génératrice ; influence de \(R_r\)</h3>
  <p>Entraînée au-delà du synchronisme (\(g \lt 0\)), la MAS développe un couple négatif : elle reçoit de la puissance mécanique et renvoie de la puissance active au réseau (\(P_{tr} = C_{em}\Omega_s \lt 0\)), tout en continuant d'absorber la puissance réactive de magnétisation. On l'emploie ainsi en éolien ou en micro-hydraulique ; une charge entraînante (descente d'un monte-charge) est freinée sans dispositif supplémentaire.</p>
  <p>Sur un rotor bobiné, ajouter une résistance en série augmente \(g_M\) sans modifier \(C_{max}\) : le pic de couple se rapproche du démarrage (\(C_d\) augmente, courant de démarrage réduit), au prix du rendement si on la laisse en service.</p>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MAS : COMMANDE SCALAIRE À V/f CONSTANT</div>
  <h2>Varier la vitesse en variant la fréquence</h2>
  <div class="intro">La vitesse d'une MAS reste proche de \(\Omega_s = \omega/p\) : pour la régler efficacement, on agit sur la fréquence. Un variateur (redresseur, bus continu filtré, onduleur à MLI — voir le chapitre sur les onduleurs) fournit un système triphasé de fréquence et d'amplitude réglables.</div>

  <h3>Pourquoi garder \(V/f\) constant ?</h3>
  <p>La tension impose le flux : résistance statorique négligée, une phase vérifie \(v = \mathrm{d}\phi/\mathrm{d}t\), d'où \(V = \omega\,\Phi_s/\sqrt2\) (\(\Phi_s\) : amplitude du flux embrassé par une phase). Le flux est donc proportionnel à \(V/f\).</p>
  <ul>
    <li>Baisser \(f\) à \(V\) constant augmenterait le flux : saturation du circuit magnétique, courant magnétisant excessif.</li>
    <li>Augmenter \(f\) à \(V\) constant réduirait le flux, donc le couple disponible.</li>
  </ul>
  <p>Garder \(V/f\) constant maintient le flux nominal, donc \(C_{max} = \frac{3p}{2L_r}(V/\omega)^2\).</p>

  <div class="prop-box">
    <strong>Les caractéristiques se translatent.</strong> Exprimons le couple en fonction de la vitesse de glissement \(\Omega_g = \Omega_s - \Omega = g\,\Omega_s\). Comme \(R_r/g = R_r\,\omega/(p\,\Omega_g)\) :
    $$C_{em} = \frac{3p^2}{R_r}\left(\frac{V}{\omega}\right)^2\frac{\Omega_g}{1 + \left(\dfrac{p\,L_r\,\Omega_g}{R_r}\right)^2}$$
    À \(V/\omega\) fixé, le couple ne dépend que de \(\Omega_g\) : quand \(f\) varie, toute la caractéristique se décale parallèlement à l'axe des vitesses, en suivant \(\Omega_s\). Dans la zone utile, on obtient un réseau de droites parallèles :
    $$C_{em} \approx \frac{3p^2}{R_r}\left(\frac{V}{\omega}\right)^2(\Omega_s - \Omega)$$
    La fréquence fixe la vitesse à couple nul (\(\Omega_s\)) ; la charge ne fixe que l'écart \(\Omega_s - \Omega\), petit et indépendant de \(f\). Le variateur pilote donc la vitesse presque proportionnellement à la consigne de fréquence.
  </div>

    <strong>Limites de la commande scalaire.</strong>
    <ul style="margin:.3rem 0">
      <li><strong>Basses fréquences</strong> : la chute de tension dans la résistance statorique n'est plus négligeable devant \(V\), le flux baisse ; on ajoute une surtension (« boost ») à basse fréquence.</li>
      <li><strong>Au-delà de la fréquence nominale</strong> : \(V\) reste plafonnée à \(V_n\) (tension nominale du moteur, que le bus continu de l'onduleur ne permet de toute façon guère de dépasser). \(V/f\) diminue (<strong>défluxage</strong>) et \(C_{max}\) décroît comme \(1/f^2\). La limite pratique est cependant thermique : à courant nominal, le couple disponible ne décroît que comme \(1/f\), d'où un fonctionnement à puissance sensiblement constante, tant que ce couple reste inférieur à \(C_{max}\) (au-delà, la puissance chute). Plage typique : couple constant jusqu'à \(f_n\), puissance constante au-delà.</li>
      <li>Elle repose sur le modèle de régime permanent : lors d'un échelon de charge ou de consigne, le couple n'est pas imposé directement et la réponse est lente, voire oscillante. En boucle ouverte, la vitesse baisse un peu quand la charge augmente (on peut ajouter une compensation de glissement ou une boucle de vitesse). Pour les axes dynamiques (robotique, positionnement), on lui préfère la commande vectorielle (§8 ; hors programme pour la MAS).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">

    <span class="prompt">Moteur 4 pôles, 230 V par phase à 50 Hz ; à son couple nominal il glisse de 40 tr/min. Réglage du variateur pour 600 tr/min au couple nominal ?</span>

  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MACHINE SYNCHRONE : MODÈLE ET DIAGRAMME DE FRESNEL</div>
  <h2>Un rotor accroché au champ tournant</h2>
  <div class="intro">Remplaçons la cage par un rotor portant lui-même \(p\) paires de pôles magnétiques. Ces pôles « s'accrochent » au champ tournant : en régime permanent, le rotor tourne <strong>exactement</strong> à \(\Omega_s\). C'est la machine des alternateurs de centrales comme des servomoteurs « brushless » de la robotique.</div>

  <h3>Constitution</h3>
  <ul>
    <li><strong>Stator (induit)</strong> : enroulement triphasé, de même principe que celui de la MAS.</li>
    <li><strong>Rotor (inducteur)</strong> : aimants permanents (MSAP : servomoteurs, véhicules électriques, drones) ou bobinage alimenté en courant continu \(i_e\) par bagues et balais ou par une excitatrice sans balais (alternateurs de forte puissance). Rotor à pôles lisses (seul cas étudié ici) ou à pôles saillants.</li>
  </ul>
  <div class="def-box">
    <strong>Vitesse et f.é.m.</strong> En régime permanent, \(\Omega = \Omega_s = \omega/p\) : la fréquence statorique est liée rigidement à la vitesse. Le flux du rotor, tournant, induit dans chaque phase une f.é.m. sinusoïdale de valeur efficace
    $$E = K\,\Omega$$
    \(K\) (en V·s/rad, valeur efficace par phase) est constant pour une machine à aimants ; pour un rotor bobiné, il dépend du courant d'excitation (\(K \approx k\,i_e\) hors saturation).
  </div>

  <h3>Modèle équivalent d'une phase</h3>
  <p>En régime permanent sinusoïdal, chaque phase (étoile équivalente) se modélise par la f.é.m. \(\underline{E}\) en série avec la résistance \(R\) d'un enroulement et l'<strong>inductance synchrone</strong> \(L\), qui traduit le champ créé par les courants statoriques eux-mêmes. En convention récepteur (moteur) :</p>
  <div class="formula">$$\underline{V} = \underline{E} + (R + jL\omega)\,\underline{I}$$</div>
  <p>En convention générateur (alternateur) : \(\underline{E} = \underline{V} + (R + jL\omega)\underline{I}\). Pour les machines de puissance, \(R\) est souvent négligeable devant \(L\omega\).</p>

  <h3>Diagramme de Fresnel et angles</h3>
  <div class="def-box">
    Trois angles orientés décrivent le fonctionnement :
    <ul style="margin:.4rem 0">
      <li>\(\varphi = (\underline{I}, \underline{V})\) : déphasage du courant par rapport à la tension (facteur de puissance) ;</li>
      <li>\(\psi = (\underline{I}, \underline{E})\) : <strong>angle de pilotage</strong>, entre courant et f.é.m. ;</li>
      <li>\(\theta = (\underline{E}, \underline{V})\) : <strong>angle interne</strong>, entre f.é.m. et tension.</li>
    </ul>
    Par la relation de Chasles sur les angles : \(\varphi = \psi + \theta\).
  </div>

  <div class="prop-box">
    <strong>Projections utiles</strong> (\(\underline{I}\) pris comme origine des phases) :
    $$\begin{aligned} V\cos\varphi &= E\cos\psi + RI\\ V\sin\varphi &= E\sin\psi + L\omega I\end{aligned}$$
    Si \(R\) est négligée, la projection sur la perpendiculaire à \(\underline{V}\) donne en outre \(L\omega I\cos\varphi = E\sin\theta\).
  </div>
  <p><strong>Excitation et réactif.</strong> Résistance négligée, la puissance réactive absorbée vaut \(Q = \dfrac{3V(V - E\cos\theta)}{L\omega}\). Pour un rotor bobiné, l'excitation règle donc le réactif à puissance active donnée : fortement excitée (\(E\cos\theta \gt V\)), la machine <strong>fournit</strong> de la puissance réactive (comportement capacitif, \(\varphi \lt 0\)) ; faiblement excitée, elle en absorbe.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · MACHINE SYNCHRONE : COUPLE, DÉCROCHAGE, AUTOPILOTAGE</div>
  <h2>Couple de la machine synchrone et moteur « brushless »</h2>
  <div class="intro">Toute la puissance électromagnétique transite par la f.é.m. ; le couple s'en déduit en divisant par \(\Omega_s\). Selon que la fréquence est imposée par un réseau ou asservie à la position du rotor, la machine est sujette au décrochage ou s'en affranchit.</div>

  <h3>Bilan des puissances et couple</h3>
  <p>Pertes : Joule stator \(P_{js} = 3RI^2\), fer stator (souvent négligées), mécaniques, et l'excitation \(u_e i_e\) d'un rotor bobiné. Pas de pertes Joule au rotor d'une machine à aimants : rendement élevé (90 à 97 %).</p>
  <div class="formula">$$\begin{aligned} P_a &= 3VI\cos\varphi = P_{js} + P_{em}\\ P_{em} &= 3EI\cos\psi = C_{em}\,\Omega_s\end{aligned}$$</div>
  <div class="prop-box">
    <strong>Couple électromagnétique.</strong>
    $$C_{em} = \frac{3EI\cos\psi}{\Omega_s} = 3K\,I\cos\psi$$
    À courant efficace donné, il est maximal pour \(\psi = 0\) (courant en phase avec la f.é.m.). Il ne dépend pas de la vitesse : seuls comptent l'amplitude du courant et sa position par rapport à \(\underline{E}\).
  </div>

  <h3>Sur un réseau à fréquence fixe : le décrochage</h3>
  <p>Résistance négligée, la relation \(L\omega I\cos\varphi = E\sin\theta\) donne une autre expression de la puissance et du couple :</p>
  <div class="formula">$$P = \frac{3VE}{L\omega}\sin\theta,\qquad C_{em} = \frac{3VE}{L\omega\,\Omega_s}\sin\theta$$</div>
  <ul>
    <li>\(\theta \gt 0\) (\(\underline{V}\) en avance sur \(\underline{E}\)) : moteur ; \(\theta \lt 0\) : génératrice (alternateur).</li>
    <li>À \(V\) et \(E\) fixés, le couple est maximal pour \(\theta = \pm\pi/2\) : \(C_{max} = 3VE/(L\omega\Omega_s)\). Si la charge en demande davantage, le rotor ne peut plus suivre le champ : c'est le <strong>décrochage</strong> (perte de synchronisme, couple moyen nul, surintensités). Le fonctionnement est stable pour \(|\theta| \lt \pi/2\) ; augmenter l'excitation éloigne le décrochage.</li>
    <li>Branchée directement sur le réseau, la MS n'a <strong>pas de couple de démarrage</strong> : le champ tourne trop vite pour que le rotor s'y accroche. Il faut une rampe de fréquence (variateur) ou une cage d'amortissement.</li>
  </ul>

  <h3>Autopilotage : le moteur « brushless »</h3>
  <div class="def-box">
    <strong>Autopiloter</strong> une MS, c'est asservir la fréquence et la phase des courants statoriques à la position du rotor, mesurée par un capteur (sondes à effet Hall, codeur, résolveur). L'onduleur impose alors l'angle de pilotage voulu, en général \(\psi = 0\).
  </div>
  <div class="prop-box">
    <strong>Conséquences de \(\psi = 0\).</strong>
    <ul style="margin:.4rem 0">
      <li>Couple maximal par ampère : \(C_{em} = 3KI\), proportionnel au courant comme pour une MCC (\(C = kI\)). La MS autopilotée est une « MCC sans balais » : l'onduleur et le capteur remplacent le collecteur mécanique.</li>
      <li>Plus de décrochage : la fréquence suit la vitesse à chaque instant.</li>
      <li>Tension nécessaire (\(\underline{I}\) en phase avec \(\underline{E}\)) :
      $$V = \sqrt{(E + RI)^2 + (L\omega I)^2}$$
      Elle croît avec la vitesse : la tension maximale de l'onduleur limite la vitesse accessible à couple donné (au-delà, on peut défluxer en plaçant le courant en avance sur \(\underline{E}\), \(\psi \lt 0\) : hors programme).</li>
    </ul>
  </div>
  <div class="notice">Comme pour la MCC, la commande en boucle fermée comporte une boucle de courant (interne, rapide), qui règle le couple, et une boucle de vitesse (externe), qui élabore la consigne de courant. Le capteur de position sert à la fois à l'autopilotage et, par dérivation, à la mesure de vitesse. Le §8 en donne le modèle ; le réglage des boucles est celui de « Correction des SLCI » (§7).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · COMMANDE DANS LE PLAN (d, q)</div>
  <h2>Changer de repère pour rendre les grandeurs continues</h2>
  <div class="intro">Sur une MCC, on règle le couple en asservissant un courant continu avec un correcteur PI, dont l'intégrateur annule l'erreur statique. Sur une machine triphasée, les consignes de courant de chaque phase sont des sinusoïdes : un PI les suit avec retard et erreur, d'autant plus que la fréquence est élevée. L'astuce consiste à observer les grandeurs depuis un repère qui tourne avec le rotor : vues de là, elles deviennent constantes en régime établi.</div>

  <h3>Le repère (d, q) lié au rotor</h3>
  <div class="def-box">
    <strong>Axes d et q.</strong> L'axe <strong>direct</strong> \(d\) est lié au rotor et aligné sur le flux de l'inducteur (aimants ou bobinage du rotor) ; l'axe en <strong>quadrature</strong> \(q\) le précède de \(\pi/2\) (en angle électrique). Les trois courants (ou tensions) de phase sont remplacés par deux composantes \(i_d\), \(i_q\) mesurées dans ce repère tournant : c'est un calcul fait en temps réel par le variateur, à partir des courants mesurés et de la position \(\gamma = p\,\theta_m\) du rotor.
  </div>
  <div class="notice"><strong>Ce qui est exigible.</strong> Le modèle de la machine dans le plan (d, q) est <strong>fourni</strong> par les énoncés : il faut savoir l'exploiter (le couple dépend de \(i_q\), les boucles de courant travaillent sur des grandeurs continues). Les transformations de Clarke, de Concordia et de Park qui y conduisent sont détaillées ci-dessous pour information, hors programme.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour aller plus loin (hors programme)</span>
    <span class="prompt">Les transformations de Clarke, de Concordia et de Park.</span>
    <div class="content">
  <p><strong>Étape 1 — du triphasé au diphasé : Clarke et Concordia.</strong></p>
  <p>Un système triphasé \((x_1, x_2, x_3)\) de tensions ou de courants, de somme nulle, n'a que deux degrés de liberté : on le remplace par deux grandeurs \((x_\alpha, x_\beta)\) portées par deux axes fixes orthogonaux.</p>
  <div class="formula">$$\begin{pmatrix}x_\alpha\\ x_\beta\end{pmatrix} = c\begin{pmatrix}1 & -\frac12 & -\frac12\\ 0 & \frac{\sqrt3}{2} & -\frac{\sqrt3}{2}\end{pmatrix}\begin{pmatrix}x_1\\ x_2\\ x_3\end{pmatrix}$$</div>
  <ul>
    <li><strong>Clarke</strong> : \(c = 2/3\). Conserve les <strong>amplitudes</strong> ; la puissance s'écrit alors \(p = \frac32(v_\alpha i_\alpha + v_\beta i_\beta)\).</li>
    <li><strong>Concordia</strong> : \(c = \sqrt{2/3}\). Conserve la <strong>puissance</strong> (\(p = v_\alpha i_\alpha + v_\beta i_\beta\)) ; les amplitudes sont multipliées par \(\sqrt{3/2}\).</li>
  </ul>
  <p>La composante homopolaire \((x_1+x_2+x_3)/3\), nulle pour un système équilibré sans neutre, est omise.</p>

  <p><strong>Étape 2 — la rotation de Park.</strong></p>
  <p>On projette ensuite \((x_\alpha, x_\beta)\) sur un repère \((d, q)\) lié au rotor : l'axe <strong>direct</strong> \(d\) est aligné sur le flux de l'inducteur, l'axe en <strong>quadrature</strong> \(q\) le précède de \(\pi/2\). Avec \(\gamma = p\,\theta_m\) la position électrique du rotor (\(\theta_m\) : position mécanique) :</p>
  <div class="formula">$$\begin{pmatrix}x_d\\ x_q\end{pmatrix} = \begin{pmatrix}\cos\gamma & \sin\gamma\\ -\sin\gamma & \cos\gamma\end{pmatrix}\begin{pmatrix}x_\alpha\\ x_\beta\end{pmatrix}$$</div>
  <div class="formula">$$x_d + j\,x_q = (x_\alpha + j\,x_\beta)\,e^{-j\gamma}$$</div>
      <p><strong>Vérification</strong> : pour des courants équilibrés, \(i_\alpha = I_m\cos(\omega t+\alpha)\) et \(i_\beta = I_m\sin(\omega t+\alpha)\).</p>
      <p>Avec \(i_1+i_2+i_3 = 0\) : \(i_\alpha = \frac23\big(i_1 - \frac{i_2+i_3}{2}\big) = \frac23\cdot\frac32\,i_1 = i_1\).</p>
      <p>Ensuite \(i_\beta = \frac{1}{\sqrt3}(i_2 - i_3)\). Avec \(a = \omega t+\alpha\) :</p>
      $$\begin{aligned}&\cos\!\left(a-\tfrac{2\pi}{3}\right) - \cos\!\left(a-\tfrac{4\pi}{3}\right)\\ &\qquad = -2\sin(a-\pi)\sin\tfrac{\pi}{3} = \sqrt3\sin a\end{aligned}$$
      <p>d'où \(i_\beta = I_m\sin a\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Grandeurs constantes en régime permanent.</strong> Pour des courants équilibrés \(i_k = I_m\cos\big(\omega t + \alpha - 2(k-1)\pi/3\big)\), les transformations précédentes donnent un vecteur tournant d'amplitude \(I_m\) : \(i_\alpha + j\,i_\beta = I_m\,e^{j(\omega t+\alpha)}\). Au synchronisme, \(\gamma = \omega t + \gamma_0\), d'où
    $$i_d + j\,i_q = I_m\,e^{j(\alpha-\gamma_0)}$$
    deux <strong>constantes</strong> : les correcteurs PI travaillent sur des grandeurs continues, comme pour une MCC.
  </div>
  <h3>Modèle de la MSAP dans le plan (d, q)</h3>
  <p>Modèle fourni par les énoncés. Pour une machine à pôles lisses (résistance \(R\), inductance cyclique \(L\), flux des aimants d'amplitude \(\Phi_f\) vu par une phase), avec Clarke puis Park et \(\omega = p\,\Omega\) :</p>
  <div class="formula">$$\begin{aligned} v_d &= R\,i_d + L\frac{\mathrm{d}i_d}{\mathrm{d}t} - \omega L\,i_q\\ v_q &= R\,i_q + L\frac{\mathrm{d}i_q}{\mathrm{d}t} + \omega L\,i_d + \omega\,\Phi_f \end{aligned}$$</div>
  <div class="formula">$$C_{em} = \frac32\,p\,\Phi_f\,i_q$$</div>
  <p>Le terme \(\omega\Phi_f\) est la f.é.m. : elle est portée par l'axe \(q\). Le couple ne dépend que de \(i_q\) ; \(i_d\) n'en produit pas (pôles lisses). Lien avec le modèle monophasé : \(i_q = I\sqrt2\cos\psi\), \(i_d = I\sqrt2\sin\psi\) et \(E\sqrt2 = \omega\Phi_f\) — on retrouve \(C_{em} = 3EI\cos\psi/\Omega_s\).</p>

  <h3>Commande en couple et en vitesse : boucles imbriquées</h3>
  <ol>
    <li><span class="step">Mesures.</span> Deux courants de phase (le troisième s'en déduit) et la position \(\gamma\) ; Clarke puis Park donnent \(i_d\), \(i_q\).</li>
    <li><span class="step">Boucles de courant.</span> Un PI par axe, avec les consignes \(i_d^* = 0\) (couple maximal par ampère, équivalent de \(\psi = 0\)) et \(i_q^* = C^*/(\tfrac32 p\Phi_f)\). Des termes de <strong>découplage</strong> compensent \(-\omega L i_q\) et \(\omega L i_d + \omega\Phi_f\) : chaque axe se réduit à un circuit R-L de transmittance \(1/(R+Lp)\) (ici, \(p\) : variable de Laplace).</li>
    <li><span class="step">Boucle de vitesse.</span> Un correcteur (souvent PI) compare \(\Omega^*\) à la vitesse mesurée et élabore \(i_q^*\), saturée au courant admissible (limitation du couple).</li>
    <li><span class="step">Retour aux phases.</span> Park inverse puis Clarke inverse transforment \(v_d^*\), \(v_q^*\) en consignes \(v_1^*, v_2^*, v_3^*\) pour l'onduleur à MLI.</li>
  </ol>
  <div class="prop-box">
    <strong>Réglage en cascade.</strong> La boucle interne (courant) est réglée nettement plus rapide que la boucle externe (bande passante 5 à 10 fois plus grande, voire davantage). Vue de la boucle de vitesse, la boucle de courant se comporte comme un gain unitaire et la machine comme
    $$\frac{\Omega(p)}{I_q^*(p)} \approx \frac{k_c}{J\,p},\qquad k_c = \frac32\,p\,\Phi_f$$
    (\(J\) : inertie ramenée sur l'arbre moteur, frottements négligés). Attention : dans les transmittances, \(p\) est la variable de Laplace, alors que le \(p\) de \(k_c\) est le nombre de paires de pôles.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour aller plus loin (hors programme)</span>
    <span class="prompt">Commande vectorielle de la MAS, défluxage de la MSAP.</span>
    <div class="content"><p>Pour la MAS, la commande vectorielle « à flux rotorique orienté » applique le même principe en alignant l'axe \(d\) sur le flux du rotor : \(i_d\) règle le flux, \(i_q\) le couple. La position de ce flux n'étant pas mesurable, elle est estimée (vitesse mesurée et pulsation de glissement calculée). Sur une MSAP, une consigne \(i_d \lt 0\) permet le défluxage à haute vitesse. Pour les machines alternatives, le programme se limite à la commande scalaire (§5).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · COMPARAISON ET CHOIX D'UNE MOTORISATION</div>
  <h2>MCC, MAS ou MS : quel actionneur choisir ?</h2>
  <div class="intro">Le choix d'un moteur électrique croise le besoin mécanique (couple, vitesse, cycle, précision), l'alimentation disponible et des critères de coût, d'encombrement et de maintenance.</div>

  <h3>Rappel : modèle de la machine à courant continu</h3>
  <div class="def-box">
    <strong>Modèle électromécanique</strong> (chapitre « Machine à courant continu » de 1ʳᵉ année). Induit de résistance \(R\) et d'inductance \(L\), constante de f.é.m. et de couple \(K\), inertie \(J\) ramenée sur l'arbre, frottement visqueux \(f\), couple résistant \(C_r\) :
    <div class="formula" data-nom="Modèle de la MCC">$$u = e + R\,i + L\,\frac{\mathrm{d}i}{\mathrm{d}t}, \qquad e = K\,\Omega, \qquad C_{em} = K\,i$$
$$J\,\frac{\mathrm{d}\Omega}{\mathrm{d}t} = C_{em} - C_r - f\,\Omega$$</div>
    Bilan des puissances : \(u\,i = R\,i^2 + e\,i\) (puissance absorbée = pertes Joule + puissance électromagnétique) et \(e\,i = C_{em}\,\Omega\). Le schéma-blocs correspondant, avec sa boucle interne de f.é.m., est tracé dans « Modélisation multiphysique » (§6).
  </div>
  <div class="prop-box">
    <strong>Ce qu'il faut en retenir pour comparer.</strong> Le couple est proportionnel au courant et la vitesse, à vide, à la tension : on commande le couple par une boucle de courant et la vitesse par la tension d'induit. La MS autopilotée reproduit exactement ce comportement (\(C_{em} = 3KI\) pour \(\psi = 0\), §7), sans collecteur. Exemple : une MCC 24 V (\(R = 0{,}5\ \Omega\), \(K = 0{,}05\ \text{V·s/rad}\)) qui fournit 0,2 N·m absorbe \(i = 0{,}2/0{,}05 = 4\ \text{A}\) ; \(e = 24 - 0{,}5\times4 = 22\ \text{V}\), d'où \(\Omega = 440\ \text{rad/s}\) (4 200 tr/min), et \(P_{em} = 88\ \text{W}\) pour 96 W absorbés.
  </div>
