  <div class="prop-box">
    <strong>Où va l'énergie de freinage ?</strong> En Q2 et Q4, la machine fonctionne en génératrice : la puissance \(C_{em}\,\Omega \lt 0\) repart vers la source. Sur le réseau, elle y retourne directement. Sur un variateur, elle traverse l'onduleur (réversible en courant) et charge le condensateur du bus continu, dont la tension monte : il faut un hacheur de freinage, un redresseur réversible ou une batterie qui la reçoive (« Régimes alternatifs, redresseurs et onduleurs », §9).
  </div>
  <div class="method-box">
    <strong>Exemple — freiner un convoyeur entraîné par une MAS sur variateur</strong>
    <p>Moteur à 4 pôles commandé à U/f constant, qui glisse de 40 tr/min à son couple nominal \(C_n\) (comme au §5). Il tourne à 1 460 tr/min sous 50 Hz, au couple nominal.</p>
    <ol>
      <li>Le variateur abaisse la fréquence à 47 Hz : \(N_s = 60\times47/2 = 1\,410\ \text{tr/min}\), alors que le rotor tourne encore à 1 460 tr/min.</li>
      <li>Vitesse de glissement : \(N_s - N = -50\ \text{tr/min}\). Dans la zone linéaire (§5), le couple est proportionnel à cette vitesse : \(C_{em} \approx -\frac{50}{40}\,C_n = -1{,}25\,C_n\). La machine freine (Q2) et renvoie de la puissance au bus continu.</li>
      <li>En continuant d'abaisser la fréquence par une rampe, on garde un couple de freinage maîtrisé jusqu'à l'arrêt. Pour repartir en sens inverse, le variateur inverse l'ordre des phases et remonte la fréquence (Q3), sans contacteur.</li>
      <li>Limite : une baisse trop brutale (vitesse de glissement au-delà de celle du couple maximal) sort de la zone linéaire, et l'énergie renvoyée peut faire monter excessivement la tension du bus.</li>
    </ol>
  </div>

  <h3>Démarche de choix sur catalogue</h3>
  <ol>
    <li><span class="step">Besoin côté charge.</span> Couple ou effort et vitesse sur chaque phase du cycle (accélération, palier, décélération, arrêt), masses et inerties.</li>
    <li><span class="step">Report sur l'arbre moteur.</span> Avec une transmission de rapport \(k = \Omega_{charge}/\Omega_m\) et de rendement \(\eta\) : \(C_m = k\,C_{charge}/\eta\) en marche motrice ; inertie équivalente \(J_{eq} = J_m + \sum_i J_i k_i^2 + \sum_j m_j\,(v_j/\Omega_m)^2\).</li>
    <li><span class="step">Vérifications.</span> Vitesse maximale du moteur ≥ vitesse requise ; couple crête ≥ couple maximal du cycle ; couple nominal ≥ couple efficace (critère thermique) ; tension et courant compatibles avec le variateur.</li>
    <li><span class="step">Point nominal.</span> \(C_n = P_u/\Omega_n\), \(P_a = \sqrt3\,UI\cos\varphi\), \(\eta\), et glissement pour une MAS.</li>
  </ol>
  <div class="formula">$$C_{eff} = \sqrt{\frac{1}{T}\int_0^T C_m^2(t)\,\mathrm{d}t}\ \le\ C_n$$</div>
  <div class="method-box">
    <strong>Exemple — couple thermique équivalent d'un axe de manutention</strong>
    <p>Cycle de 6 s ramené sur l'arbre moteur : accélération 0,5 s à 12 N·m, palier 3 s à 4 N·m, freinage 0,5 s à −8 N·m, arrêt 2 s à couple nul.</p>
    <ol>
      <li>Couple efficace :<div class="formula">$$C_{eff} = \sqrt{\frac{12^2\times0{,}5 + 4^2\times3 + 8^2\times0{,}5}{6}}$$
$$C_{eff} = \sqrt{\frac{152}{6}} \approx 5{,}0\ \text{N·m}$$</div></li>
      <li>Le moteur doit donc avoir un couple nominal d'au moins 5,0 N·m (échauffement) et un couple crête d'au moins 12 N·m (accélération) : un moteur de 5,5 N·m nominal et 16 N·m crête convient, avec sa vitesse maximale à vérifier.</li>
      <li>La moyenne des valeurs absolues du couple ne vaut que 3,7 N·m : dimensionner sur elle sous-estimerait l'échauffement, qui dépend des pertes Joule, donc du carré du courant (et du couple).</li>
    </ol>
  </div>
  <div class="notice"><strong>Pièges.</strong> Confondre puissance utile (plaque, mécanique) et puissance absorbée ; oublier la conversion tr/min → rad/s (\(\times\pi/30\)) ; comparer une pointe brève au couple nominal (c'est le couple crête qui compte) ou, à l'inverse, juger l'échauffement sur la pointe (c'est le couple efficace).</div>
</div>
</template>
<template class="pan-tpl" data-panneau="mca-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · MACHINES ALTERNATIVES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>
  <div class="intro">Dans l'ordre du cours : machine asynchrone (§2 à §4), commande scalaire (§5), machine synchrone (§6, §7), quatre quadrants et choix d'une motorisation (§9), modèle (d, q) fourni par l'énoncé (§8). L'établissement des transformations de Clarke, Concordia et Park est hors programme : la dernière méthode est un complément.</div>
  <div class="method-box">
    <strong>Méthode 1 — Exploiter la plaque signalétique d'une MAS</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Couplage.</span> Comparer la plus petite tension de la plaque à la tension composée du réseau : égale → triangle ; \(\sqrt3\) fois plus petite → étoile.</li>
      <li><span class="step">Pôles et glissement.</span> \(N_s\) = valeur de \(60f/p\) juste au-dessus de \(N_n\) ; \(g = (N_s - N_n)/N_s\).</li>
      <li><span class="step">Point nominal.</span> \(\Omega_n = \pi N_n/30\), \(C_n = P_u/\Omega_n\), \(P_a = \sqrt3\,UI\cos\varphi\) avec le courant du couplage retenu, \(\eta = P_u/P_a\).</li>
      <li><span class="step">Contrôle.</span> Vérifier \(\eta \lt 1 - g\) ; sinon, une donnée a été mal lue.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 2 — Bilan des puissances d'une MAS</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Chaîne.</span> Écrire \(P_a \to P_{tr} \to P_m \to P_u\) et repérer les pertes données ou négligées à chaque étage.</li>
      <li><span class="step">Relations.</span> \(P_{tr} = C_{em}\Omega_s\), \(P_m = C_{em}\Omega = (1-g)P_{tr}\), \(P_{jr} = gP_{tr}\).</li>
      <li><span class="step">Remonter la chaîne.</span> Le plus souvent : \(P_u\) + pertes mécaniques → \(P_m\) → \(P_{tr} = P_m/(1-g)\) → \(P_{jr}\) ; enfin pertes statoriques \(= P_a - P_{tr}\).</li>
      <li><span class="step">Deux couples.</span> \(C_{em} = P_{tr}/\Omega_s\) et \(C_u = P_u/\Omega\) diffèrent du couple de pertes mécaniques.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Piège</em> : \(P_{jr} = g\,P_m\) est faux (c'est \(g\,P_{tr}\)) ; ne jamais diviser \(P_{tr}\) par \(\Omega\).</p>
  </div>
  <div class="method-box">
    <strong>Méthode 3 — Point de fonctionnement et stabilité</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Charge.</span> Ramener le couple résistant sur l'arbre moteur : \(C_r(\Omega)\).</li>
      <li><span class="step">Moteur.</span> Dans la zone utile, assimiler la MAS à une droite \(C_{em} = a(\Omega_s - \Omega)\), avec \(a = C_n/(\Omega_s - \Omega_n)\) tiré du point nominal (ou utiliser la formule de Kloss si le glissement n'est pas petit).</li>
      <li><span class="step">Équilibre.</span> Résoudre \(C_{em}(\Omega) = C_r(\Omega)\) et garder la solution de la zone utile.</li>
      <li><span class="step">Stabilité.</span> Stable si \(\mathrm{d}C_{em}/\mathrm{d}\Omega \lt \mathrm{d}C_r/\mathrm{d}\Omega\) au point trouvé.</li>
      <li><span class="step">Démarrage.</span> Vérifier \(C_d \gt C_r(0)\) ; la durée de démarrage se tire de \(J\,\mathrm{d}\Omega/\mathrm{d}t = C_{em} - C_r\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 4 — Régler un variateur à V/f constant</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Glissement.</span> Calculer la vitesse de glissement \(\Omega_g = \Omega_s - \Omega\) au couple demandé (pente \(a\) de la zone utile) : à \(V/f\) constant, elle ne dépend pas de \(f\).</li>
      <li><span class="step">Fréquence.</span> \(\Omega_s = \Omega_{visée} + \Omega_g\), puis \(f = p\,\Omega_s/2\pi = p\,N_s/60\).</li>
      <li><span class="step">Tension.</span> \(V = V_n\,f/f_n\) tant que \(f \le f_n\). Au-delà : \(V = V_n\), la pente \(a\) et \(C_{max}\) sont multipliés par \((f_n/f)^2\) ; vérifier que \(C\,\Omega \le P_n\).</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Piège</em> : c'est la vitesse de glissement (en rad/s ou tr/min) qui se conserve, pas le glissement \(g\).</p>
  </div>
  <div class="method-box">
    <strong>Méthode 5 — Diagramme de Fresnel d'une machine synchrone</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Référence.</span> Prendre \(\underline{I}\) horizontal (moteur autopiloté) ou \(\underline{V}\), \(\underline{E}\) selon les données.</li>
      <li><span class="step">Construction.</span> Placer \(\underline{E}\), puis \(R\underline{I}\) parallèle à \(\underline{I}\) et \(jL\omega\underline{I}\) en avance de \(\pi/2\) sur \(\underline{I}\) ; fermer par \(\underline{V}\) (convention moteur).</li>
      <li><span class="step">Angles.</span> Repérer \(\varphi = (\underline{I},\underline{V})\), \(\psi = (\underline{I},\underline{E})\), \(\theta = (\underline{E},\underline{V})\), avec \(\varphi = \psi + \theta\) ; calculer par projections sur \(\underline{I}\) et sur sa perpendiculaire.</li>
      <li><span class="step">Puissances.</span> \(P = 3VI\cos\varphi\), \(P_{em} = 3EI\cos\psi = C_{em}\Omega_s\) ; si \(R = 0\) : \(P = 3VE\sin\theta/(L\omega)\).</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Piège</em> : le signe des angles. Un courant en avance sur \(\underline{E}\) donne \(\psi \lt 0\) ; \(\cos\psi\), lui, reste positif en moteur.</p>
  </div>
  <div class="method-box">
    <strong>Méthode 6 — Dimensionner un moteur autopiloté (\(\psi = 0\))</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Couple → courant.</span> \(I = C/(3K)\) (ou \(i_q = C/(\tfrac32 p\Phi_f)\) dans le plan \((d,q)\)).</li>
      <li><span class="step">Vitesse → fréquence et f.é.m.</span> \(f = p\,\Omega/2\pi\), \(E = K\Omega\).</li>
      <li><span class="step">Tension.</span> \(V = \sqrt{(E+RI)^2 + (L\omega I)^2}\), à comparer à la tension disponible de l'onduleur.</li>
      <li><span class="step">Vitesse limite.</span> Résoudre \((K\Omega + RI)^2 + (pL\Omega I)^2 = V_{max}^2\), équation du second degré en \(\Omega\).</li>
      <li><span class="step">Bilan.</span> \(P_{em} = C\Omega = 3EI\), \(P_{js} = 3RI^2\), \(P_a = P_{em} + P_{js}\) (+ pertes fer).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 7 — Situer une machine alternative dans les quatre quadrants</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Plan.</span> Raisonner dans le plan \((C_{em}, \Omega)\) du cours, couple en abscisse : Q1 moteur en marche avant, Q2 frein en marche avant, Q3 moteur en marche arrière, Q4 frein en marche arrière.</li>
      <li><span class="step">Sens de rotation.</span> Il suit le sens du champ tournant, fixé par l'ordre des phases : un variateur l'inverse en permutant la commande de deux bras.</li>
      <li><span class="step">MAS : signe du couple.</span> Dans la zone utile, \(C_{em} \approx a(\Omega_s - \Omega)\) (\(\Omega_s\) et \(\Omega\) algébriques) : moteur si \(|\Omega| \lt |\Omega_s|\) dans le sens du champ, frein (génératrice hypersynchrone, \(g \lt 0\)) si \(|\Omega| > |\Omega_s|\). Pour freiner, le variateur place \(\Omega_s\) juste sous la vitesse.</li>
      <li><span class="step">MS autopilotée.</span> Le signe du couple est celui de \(I\cos\psi\), c'est-à-dire de \(i_q\) : elle se pilote comme une MCC.</li>
      <li><span class="step">Énergie.</span> En frein, \(C_{em}\Omega \lt 0\) : la puissance remonte vers l'onduleur puis le bus continu ; avec un redresseur à diodes, prévoir un hacheur et une résistance de freinage (ou un redresseur réversible).</li>
    </ol>
    <p><em>Exemple éclair :</em> MAS à 4 pôles sur variateur, qui glisse de 30 tr/min à son couple nominal \(C_n\). Pour retenir une charge qui descend à 600 tr/min (\(\Omega \lt 0\), \(C_{em} = +C_n\) : Q4), il faut \(N_s - N = +30\ \text{tr/min}\), soit \(N_s = -600 + 30 = -570\ \text{tr/min}\) : ordre des phases inversé, \(f = 2\times570/60 = 19\ \text{Hz}\). Le rotor tourne plus vite que le champ, dans son sens : génératrice.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Choisir une motorisation sur un cycle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Report sur l'arbre moteur.</span> Avec \(k = \Omega_{charge}/\Omega_m\) et un rendement \(\eta\) : \(C_m = k\,C_{charge}/\eta\) en marche motrice (\(k\,\eta\,C_{charge}\) quand la charge entraîne) ; inertie \(J_{eq} = J_m + \sum J_i k_i^2 + \sum m_j (v_j/\Omega_m)^2\).</li>
      <li><span class="step">Couple par phase.</span> \(C_m = J_{eq}\,\dot\Omega_m + C_{r,m}\) pour chaque phase du cycle (accélération, palier, freinage, arrêt).</li>
      <li><span class="step">Couple efficace.</span> \(C_{eff} = \sqrt{\sum_i C_i^2 t_i / T}\), arrêts compris dans \(T\) ; il doit rester inférieur au couple nominal (échauffement).</li>
      <li><span class="step">Autres critères.</span> Couple crête ≥ plus grand couple du cycle ; vitesse maximale ≥ vitesse requise ; tension et courant compatibles avec le variateur.</li>
    </ol>
    <p><em>Exemple éclair :</em> cycle de 2 s : 0,25 s à 3 N·m, 1 s à 1 N·m, 0,25 s à −2 N·m, 0,5 s à l'arrêt. \(C_{eff} = \sqrt{(9\times0{,}25 + 1\times1 + 4\times0{,}25)/2} \approx 1{,}46\ \text{N·m}\) : il faut \(C_n \geq 1{,}46\ \text{N·m}\) et \(C_{crête} \geq 3\ \text{N·m}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Exploiter le modèle (d, q) fourni par l'énoncé</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Couple.</span> Lire l'expression donnée (avec Clarke, \(C_{em} = \tfrac32\,p\,\Phi_f\,i_q\) pour une MSAP à pôles lisses) : seul \(i_q\) produit du couple, d'où les consignes \(i_d^* = 0\) et \(i_q^* = C^*/k_c\), \(k_c = \tfrac32 p\Phi_f\).</li>
      <li><span class="step">Boucles de courant.</span> Après découplage (compensation des termes en \(\omega L\) et de la f.é.m. \(\omega\Phi_f\)), chaque axe vaut \(1/(R + Lp)\) ; un PI de constante \(T_i = L/R\) compense le pôle et donne une boucle fermée du premier ordre \(\tau_i = L/K_i\).</li>
      <li><span class="step">Boucle de vitesse.</span> Boucle de courant assimilée à un gain unitaire : \(\Omega(p)/I_q^*(p) \approx k_c/(J p)\) ; avec un correcteur proportionnel \(K_\Omega\), \(\tau_\Omega = J/(K_\Omega k_c)\), à choisir 5 à 10 fois (ou plus) supérieur à \(\tau_i\).</li>
      <li><span class="step">Attention aux deux \(p\).</span> Dans les transmittances, \(p\) est la variable de Laplace ; dans \(k_c\) et \(\omega = p\Omega\), le nombre de paires de pôles.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(p = 3\), \(\Phi_f = 0{,}08\ \text{Wb}\) : \(k_c = 0{,}36\ \text{N·m/A}\), donc \(i_q = 5\ \text{A}\) pour 1,8 N·m. Avec \(J = 10^{-3}\ \text{kg·m}^2\) et \(\tau_\Omega = 20\ \text{ms}\) : \(K_\Omega = 10^{-3}/(0{,}02\times0{,}36) \approx 0{,}14\ \text{A·s/rad}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Appliquer Clarke (ou Concordia) puis Park (hors programme, pour aller plus loin)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Vérifier</span> \(x_1 + x_2 + x_3 = 0\) (sinon, traiter à part la composante homopolaire).</li>
      <li><span class="step">Clarke.</span> \(x_\alpha = \frac23\big(x_1 - \frac{x_2+x_3}{2}\big)\) (\(= x_1\) si la somme est nulle) et \(x_\beta = (x_2 - x_3)/\sqrt3\).</li>
      <li><span class="step">Park.</span> \(x_d = x_\alpha\cos\gamma + x_\beta\sin\gamma\), \(x_q = -x_\alpha\sin\gamma + x_\beta\cos\gamma\) (rotation d'angle \(-\gamma\)).</li>
      <li><span class="step">Contrôles.</span> Avec Clarke, \(\sqrt{x_d^2 + x_q^2}\) = amplitude des grandeurs de phase et \(p = \frac32(v_d i_d + v_q i_q) = 3VI\cos\varphi\).</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Piège</em> : les facteurs des expressions de puissance et de couple dépendent de la transformation retenue (2/3 ou \(\sqrt{2/3}\)) : toujours repérer celle de l'énoncé.</p>
  </div>
  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Tension d'un enroulement ≠ tension du réseau : en étoile, un enroulement est sous \(V = U/\sqrt3\).</li>
      <li>\(\Omega_s\) en rad/s se calcule avec la pulsation : \(\Omega_s = 2\pi f/p\), pas \(f/p\).</li>
      <li>Le modèle de la MAS travaille par phase : ne pas oublier le facteur 3 dans les puissances et le couple.</li>
      <li>Une MS sur réseau à fréquence fixe tourne à \(\Omega_s\) quelle que soit la charge (jusqu'au décrochage) : la charge agit sur \(\theta\) et \(I\), pas sur la vitesse.</li>
      <li>Une MAS ne fonctionne jamais au synchronisme en moteur ; en génératrice, elle a encore besoin de puissance réactive.</li>
      <li>Dimensionner l'échauffement sur la moyenne des valeurs absolues du couple : c'est le couple efficace qui compte.</li>
      <li>Nommer un quadrant sans préciser le plan : dans le plan \((C_{em}, \Omega)\), le freinage en marche avant est Q2 ; dans le plan \((\langle u\rangle, \langle i\rangle)\) d'un convertisseur, Q4.</li>
    </ul>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="mca-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Plaque signalétique d'un moteur de broyeur</h3>
  <div class="statement">Un broyeur est entraîné par un moteur asynchrone triphasé à cage dont la plaque indique : 11 kW ; 50 Hz ; Δ 400 V / Y 690 V ; 20,6 A / 11,9 A ; 1 465 tr/min ; \(\cos\varphi = 0{,}85\). L'atelier dispose d'un réseau triphasé 400 V entre phases. On estime les pertes mécaniques à 180 W ; les pertes fer rotoriques sont négligées.</div>
  <div class="q"><strong>Q1.</strong> Quel couplage faut-il réaliser ? Quel courant circule dans chaque ligne, puis dans chaque enroulement, au point nominal ?</div>
  <div class="q"><strong>Q2.</strong> Déterminer le nombre de paires de pôles, la vitesse de synchronisme, le glissement nominal et la fréquence des courants rotoriques.</div>
  <div class="q"><strong>Q3.</strong> Calculer le couple utile nominal, la puissance absorbée et le rendement.</div>
  <div class="q"><strong>Q4.</strong> Calculer la puissance mécanique développée, la puissance transmise au rotor, les pertes Joule rotoriques et les pertes statoriques. Vérifier que \(\eta \le 1-g\).</div>
  <div class="q"><strong>Q5.</strong> Calculer le couple électromagnétique. Comment inverser le sens de rotation du broyeur (pour le dégager en cas de bourrage) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Un enroulement supporte 400 V (plus petite tension de la plaque), soit exactement la tension composée du réseau : couplage <strong>triangle</strong>, chaque enroulement entre deux phases. Le courant de ligne est celui associé à Δ 400 V : \(I = 20{,}6\ \text{A}\) ; dans un enroulement, \(J = I/\sqrt3 = 11{,}9\ \text{A}\) (c'est aussi le courant de ligne indiqué pour l'étoile sous 690 V, ce qui est cohérent).</p>
    <p><strong>Q2.</strong> La valeur de \(3000/p\) juste au-dessus de 1 465 tr/min est 1 500 : \(p = 2\), \(N_s = 1500\) tr/min, \(\Omega_s = 157{,}1\ \text{rad/s}\). \(g = (1500-1465)/1500 = 2{,}33\ \%\). Fréquence rotorique : \(gf = 1{,}17\ \text{Hz}\).</p>
    <p><strong>Q3.</strong> \(\Omega_n = 1465\,\pi/30 = 153{,}4\ \text{rad/s}\), \(C_u = 11\,000/153{,}4 = 71{,}7\ \text{N·m}\). \(P_a = \sqrt3\times400\times20{,}6\times0{,}85 = 12{,}13\ \text{kW}\), \(\eta = 11/12{,}13 = 0{,}907\).</p>
    <p><strong>Q4.</strong> \(P_m = P_u + P_{\text{méca}} = 11\,180\ \text{W}\) ; \(P_{tr} = P_m/(1-g)\) \(= 11\,180/0{,}9767\) \(= 11\,447\ \text{W}\) ; \(P_{jr} = g\,P_{tr} = 267\ \text{W}\) ; pertes statoriques (Joule et fer) : \(P_a - P_{tr} \approx 12\,131 - 11\,447 = 684\ \text{W}\). On a bien \(\eta = 0{,}907 \lt 1-g = 0{,}977\) : l'écart vient des pertes statoriques et mécaniques.</p>
    <p><strong>Q5.</strong> \(C_{em} = P_{tr}/\Omega_s = 11\,447/157{,}1 = 72{,}9\ \text{N·m}\), légèrement supérieur à \(C_u\) : la différence (1,2 N·m) est le couple de pertes mécaniques (\(180/153{,}4\)). Pour inverser le sens, on permute deux des trois phases d'alimentation (contacteur inverseur).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Caractéristique mécanique tirée du modèle équivalent</h3>
  <div class="statement">Une MAS à 4 pôles est couplée en étoile sur un réseau 400 V – 50 Hz (\(V = 230\ \text{V}\)). Son modèle simplifié par phase comporte : \(L_m\omega = 46\ \Omega\), \(R_r = 0{,}36\ \Omega\), \(L_r\omega = 1{,}8\ \Omega\) (résistance et fuites statoriques négligées).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(I_r\), \(P_{tr}\) et \(C_{em}\) en fonction du glissement \(g\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le glissement \(g_M\) de couple maximal, la vitesse correspondante et \(C_{max}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le couple de démarrage. La machine peut-elle démarrer en direct une charge à couple constant de 120 N·m ?</div>
  <div class="q"><strong>Q4.</strong> Pour \(g = 2{,}5\ \%\), calculer la vitesse, \(I_r\), \(P_{tr}\), \(C_{em}\), \(P_{jr}\) et \(P_m\).</div>
  <div class="q"><strong>Q5.</strong> Toujours pour \(g = 2{,}5\ \%\), calculer le courant de ligne et le facteur de puissance.</div>
  <div class="q"><strong>Q6.</strong> Comparer le couple de Q4 à l'approximation des faibles glissements.</div>
  <div class="q"><strong>Q7.</strong> Il s'agit en fait d'un rotor bobiné : on double sa résistance par un rhéostat. Effets sur \(g_M\), \(C_{max}\), \(C_d\) et sur le fonctionnement en charge ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(I_r = V/\sqrt{(R_r/g)^2 + (L_r\omega)^2}\), \(P_{tr} = 3\,(R_r/g)\,I_r^2\) et, avec \(\Omega_s = \omega/p = 157{,}1\ \text{rad/s}\) :</p>
    $$C_{em} = \frac{P_{tr}}{\Omega_s} = \frac{3p}{\omega}\,\frac{V^2 R_r/g}{(R_r/g)^2 + (L_r\omega)^2}$$
    <p><strong>Q2.</strong> \(g_M = R_r/(L_r\omega) = 0{,}36/1{,}8 = 0{,}20\), soit \(N = 0{,}8\times1500 = 1200\) tr/min. Puis</p>
    <div class="formula">$$C_{max} = \frac{3pV^2}{2(L_r\omega)\,\omega} = \frac{3\times2\times230^2}{2\times1{,}8\times314{,}2} = 281\ \text{N·m}$$</div>
    <p><strong>Q3.</strong></p>
    $$\begin{aligned} C_d &= \frac{3pV^2}{\omega}\,\frac{R_r}{R_r^2 + (L_r\omega)^2}\\ &= 1010\times\frac{0{,}36}{3{,}37} = 108\ \text{N·m}\end{aligned}$$
    <p>(Kloss : \(2\times281/(5 + 0{,}2) = 108\) ✓). Comme \(108 \lt 120\ \text{N·m}\), le démarrage direct est impossible : il faut augmenter \(R_r\) (rotor bobiné) ou passer par un variateur.</p>
    <p><strong>Q4.</strong> \(\Omega = 0{,}975\times157{,}1 = 153{,}2\ \text{rad/s}\) (1 462 tr/min). \(R_r/g = 14{,}4\ \Omega\), impédance de la branche \(\sqrt{14{,}4^2 + 1{,}8^2} = 14{,}51\ \Omega\), \(I_r = 15{,}85\ \text{A}\). \(P_{tr} = 3\times14{,}4\times15{,}85^2 = 10{,}85\ \text{kW}\), \(C_{em} = 10\,851/157{,}1 = 69{,}1\ \text{N·m}\), \(P_{jr} = g\,P_{tr} = 271\ \text{W}\), \(P_m = 10{,}58\ \text{kW}\).</p>
    <p><strong>Q5.</strong> En prenant \(\underline{V}\) comme référence : \(\underline{I_r} = V/(14{,}4 + 1{,}8j) = 15{,}73 - 1{,}97j\) A et \(\underline{I_m} = V/(46j) = -5{,}00j\) A, d'où \(\underline{I} = 15{,}73 - 6{,}97j\) : \(I = 17{,}2\ \text{A}\), \(\cos\varphi = 15{,}73/17{,}2 = 0{,}91\). Contrôle : \(3VI\cos\varphi = 10{,}85\ \text{kW} = P_{tr}\) (pas de pertes statoriques dans ce modèle) ; \(Q = 3\times230\times6{,}97 = 4{,}8\ \text{kvar}\) absorbés.</p>
    <p><strong>Q6.</strong> \(C_{em} \approx \dfrac{3pV^2}{\omega R_r}\,g = 2806\times0{,}025 = 70{,}2\ \text{N·m}\) : écart de 1,6 % seulement, l'approximation est excellente tant que \(g \ll g_M\).</p>
    <p><strong>Q7.</strong> \(R_r' = 0{,}72\ \Omega\) : \(g_M' = 0{,}40\) ; \(C_{max}\) inchangé (281 N·m) ; \(C_d' = 2\times281/(1/0{,}4 + 0{,}4)\) \(= 194\ \text{N·m} \gt 120\) : le démarrage devient possible. En charge, à couple donné, le glissement double environ (zone linéaire : \(C \propto g/R_r\)), donc \(P_{jr}\) double et le rendement chute : on court-circuite le rhéostat une fois la machine lancée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>D'un ventilateur à une micro-turbine : stabilité et génératrice</h3>
  <div class="statement">Une MAS à 4 pôles, alimentée par le réseau 50 Hz, fournit son couple nominal de 40 N·m à 1 450 tr/min. Dans sa zone utile, on l'assimile à une droite \(C_{em} = a\,(\Omega_s - \Omega)\). Les pertes mécaniques sont négligées.</div>
  <p class="exo-part">Partie 1 — Entraînement d'un ventilateur</p>
  <p>Le moteur entraîne directement un ventilateur de couple résistant \(C_r = k\,\Omega^2\), qui vaudrait 36 N·m à 1 500 tr/min.</p>
  <div class="q"><strong>Q1.</strong> Calculer \(a\) et \(k\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer le point de fonctionnement (vitesse, couple), la puissance mécanique, le glissement et les pertes Joule rotoriques.</div>
  <div class="q"><strong>Q3.</strong> Ce point est-il stable ?</div>
  <p class="exo-part">Partie 2 — Fonctionnement en génératrice</p>
  <div class="q"><strong>Q4.</strong> La même machine, toujours reliée au réseau, est accouplée à une petite turbine hydraulique qui l'entraîne à 1 530 tr/min. Calculer le glissement, le couple électromagnétique, la puissance mécanique reçue, la puissance transmise et les pertes Joule rotoriques. Commenter le sens des échanges ; que doit encore fournir le réseau ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Omega_s = 157{,}08\ \text{rad/s}\), \(\Omega_n = 151{,}84\ \text{rad/s}\), donc \(a = 40/5{,}236 = 7{,}64\ \text{N·m·s/rad}\). \(k = 36/157{,}08^2 = 1{,}46\times10^{-3}\ \text{N·m·s}^2\).</p>
    <p><strong>Q2.</strong> \(a(\Omega_s - \Omega) = k\Omega^2\) s'écrit \(k\Omega^2 + a\Omega - a\Omega_s = 0\), dont la racine positive est</p>
    $$\Omega = \frac{-a + \sqrt{a^2 + 4ka\,\Omega_s}}{2k}$$
    <p>soit \(\Omega = 152{,}6\ \text{rad/s}\) (1 457 tr/min). \(C = a(\Omega_s - \Omega) = 34{,}0\ \text{N·m}\), \(P_m = C\Omega = 5{,}19\ \text{kW}\), \(g = 2{,}83\ \%\), \(P_{tr} = C\Omega_s = 5{,}34\ \text{kW}\), \(P_{jr} = g\,P_{tr} = 151\ \text{W}\).</p>
    <p><strong>Q3.</strong> \(\mathrm{d}C_{em}/\mathrm{d}\Omega = -a = -7{,}64\) et \(\mathrm{d}C_r/\mathrm{d}\Omega = 2k\Omega = 0{,}45\ \text{N·m·s/rad}\) : \(\mathrm{d}(C_{em}-C_r)/\mathrm{d}\Omega \lt 0\), le point est <strong>stable</strong>.</p>
    <p><strong>Q4.</strong> \(\Omega = 160{,}2\ \text{rad/s}\), \(g = (1500-1530)/1500 = -2\ \%\). \(C_{em} = a(\Omega_s - \Omega)\) \(= 7{,}64\times(-3{,}14) = -24{,}0\ \text{N·m}\) : couple résistant pour la turbine. \(P_m = C_{em}\Omega = -3{,}85\ \text{kW}\) (la machine <em>reçoit</em> 3,85 kW mécaniques) ; \(P_{tr} = C_{em}\Omega_s = -3{,}77\ \text{kW}\) (3,77 kW traversent l'entrefer vers le stator, puis le réseau aux pertes statoriques près) ; \(P_{jr} = g\,P_{tr} = (-0{,}02)\times(-3770) = +75\ \text{W}\) : des pertes restent positives, et l'on vérifie \(3845 = 3770 + 75\). En revanche, le réseau doit toujours fournir la puissance <strong>réactive</strong> de magnétisation (en site isolé, une batterie de condensateurs la remplace).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Extrudeuse à vitesse variable par variateur V/f</h3>
  <div class="statement">La vis d'une extrudeuse de matière plastique oppose, ramené à l'arbre moteur, un couple pratiquement indépendant de la vitesse : \(C_r = 30\ \text{N·m}\). Elle est entraînée par un moteur asynchrone à 6 pôles (Y 400 V, soit \(V_n = 230\ \text{V}\) par phase ; 50 Hz) qui fournit son couple nominal de 40 N·m à 960 tr/min. Le moteur est alimenté par un variateur à \(V/f\) constant ; on utilise le modèle linéaire de la zone utile.</div>
  <div class="q"><strong>Q1.</strong> Justifier qu'à \(V/f\) constant, la vitesse de glissement \(\Omega_s - \Omega\) à couple donné ne dépend pas de la fréquence.</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse de la vis lorsque le variateur délivre 50 Hz.</div>
  <div class="q"><strong>Q3.</strong> Le procédé demande 650 tr/min. Quelles fréquence et tension simple faut-il régler ?</div>
  <div class="q"><strong>Q4.</strong> Pour augmenter la production, on règle le variateur à 70 Hz ; la tension reste plafonnée à 230 V. Calculer la vitesse et la puissance fournie. Conclure.</div>
  <div class="q"><strong>Q5.</strong> Pourquoi les variateurs appliquent-ils une tension un peu supérieure à \(V_n f/f_n\) aux très basses fréquences ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Dans la zone utile, \(C_{em} \approx \frac{3p^2}{R_r}\left(\frac{V}{\omega}\right)^2(\Omega_s - \Omega)\) : à \(V/\omega\) constant, la pente \(a\) est fixe et \(\Omega_s - \Omega = C/a\) ne dépend que du couple.</p>
    <p><strong>Q2.</strong> \(p = 3\), \(N_s = 1000\) tr/min. Au point nominal, \(\Omega_s - \Omega_n = 40\,\pi/30 = 4{,}19\ \text{rad/s}\), d'où \(a = 40/4{,}19 = 9{,}55\ \text{N·m·s/rad}\). Pour 30 N·m : \(\Omega_g = 30/9{,}55 = 3{,}14\ \text{rad/s}\), soit 30 tr/min (les 3/4 des 40 tr/min nominaux), donc \(N = 1000 - 30 = 970\) tr/min.</p>
    <p><strong>Q3.</strong> \(N_s = 650 + 30 = 680\) tr/min, \(f = p\,N_s/60 = 34{,}0\ \text{Hz}\), \(V = 230\times34/50 = 156\ \text{V}\) (tension composée 271 V).</p>
    <p><strong>Q4.</strong> \(V/f\) vaut maintenant \(50/70\) de sa valeur nominale : la pente devient \(a' = a\,(50/70)^2 = 4{,}87\ \text{N·m·s/rad}\), d'où \(\Omega_g = 30/4{,}87 = 6{,}16\ \text{rad/s}\) (59 tr/min). \(N_s = 60\times70/3 = 1400\) tr/min, \(N = 1341\) tr/min, \(\Omega = 140{,}4\ \text{rad/s}\). Puissance : \(P = 30\times140{,}4 = 4{,}21\ \text{kW}\), alors que \(P_n = 40\times100{,}5 = 4{,}02\ \text{kW}\). Le moteur est en légère surcharge (≈ 5 %) : en défluxage, on travaille à puissance sensiblement constante, et le couple admissible n'est plus que \(P_n/\Omega \approx 28{,}6\ \text{N·m} \lt 30\ \text{N·m}\). Le couple maximal, lui, est réduit dans le rapport \((50/70)^2 = 0{,}51\). Il faut se limiter à une fréquence un peu plus basse ou choisir un moteur plus puissant.</p>
    <p><strong>Q5.</strong> À basse fréquence, \(V\) est faible et la chute de tension dans la résistance statorique devient comparable à \(V\) : le flux, donc le couple disponible, diminuerait. Le « boost » de tension compense cette chute.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Moteur synchrone sur le réseau : angle interne et décrochage</h3>
  <div class="statement">Un moteur synchrone triphasé à rotor bobiné, à 6 pôles, est couplé en étoile sur un réseau 400 V – 50 Hz (\(V = 230\ \text{V}\)). On néglige la résistance statorique ; la réactance synchrone vaut \(L\omega = 4{,}0\ \Omega\). L'excitation est réglée pour que \(E = 260\ \text{V}\). Le moteur entraîne une charge qui absorbe 30 kW (pertes négligées).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse et le couple.</div>
  <div class="q"><strong>Q2.</strong> Déterminer l'angle interne \(\theta\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le courant \(I\), puis les angles \(\varphi\) et \(\psi\). Le moteur absorbe-t-il ou fournit-il de la puissance réactive ?</div>
  <div class="q"><strong>Q4.</strong> Quelle valeur de \(E\) donnerait \(\cos\varphi = 1\) à la même puissance ?</div>
  <div class="q"><strong>Q5.</strong> Calculer le couple de décrochage pour \(E = 260\ \text{V}\). Que se passe-t-il si la charge l'excède ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(N = 60f/p = 1000\) tr/min, \(\Omega_s = 104{,}7\ \text{rad/s}\), \(C = 30\,000/104{,}7 = 286\ \text{N·m}\).</p>
    <p><strong>Q2.</strong> \(P = \dfrac{3VE}{L\omega}\sin\theta\) donne \(\sin\theta = \dfrac{30\,000\times4}{3\times230\times260} = 0{,}669\), soit \(\theta = 42{,}0°\).</p>
    <p><strong>Q3.</strong> Prenons \(\underline{E}\) comme référence : \(\underline{V} = 230\,e^{j\,42{,}0°} = 170{,}9 + 153{,}9j\). Alors \(jL\omega\underline{I} = \underline{V} - \underline{E} = -89{,}0 + 153{,}9j\), de module 177,8 V, d'où \(I = 177{,}8/4 = 44{,}4\ \text{A}\). L'argument de \(\underline{V}-\underline{E}\) vaut 120,1°, celui de \(\underline{I}\) vaut donc 30,1° : le courant est <em>en avance</em> sur \(\underline{E}\), \(\psi = (\underline{I},\underline{E}) = -30{,}1°\), et \(\varphi = \psi + \theta = 11{,}9°\) (\(\cos\varphi = 0{,}978\)). Contrôles : \(3VI\cos\varphi = 3EI\cos\psi = 30{,}0\ \text{kW}\). \(Q = 3VI\sin\varphi = +6{,}3\ \text{kvar}\) : le moteur <strong>absorbe</strong> du réactif, bien que \(E \gt V\) ; le bon critère est \(E\cos\theta = 193\ \text{V} \lt V\).</p>
    <p><strong>Q4.</strong> \(\cos\varphi = 1\) : \(\underline{I}\) en phase avec \(\underline{V}\), \(I = P/(3V) = 43{,}5\ \text{A}\) et \(\underline{E} = \underline{V} - jL\omega\underline{I}\), d'où \(E = \sqrt{230^2 + 174^2} = 288\ \text{V}\) (\(\theta = 37{,}1°\)). Au-delà, la machine surexcitée fournit du réactif au réseau.</p>
    <p><strong>Q5.</strong> \(C_{max} = \dfrac{3VE}{L\omega\,\Omega_s}\) \(= \dfrac{3\times230\times260}{4\times104{,}7}\) \(= 428\ \text{N·m}\), soit environ 1,5 fois le couple de service. Au-delà, le rotor décroche : perte de synchronisme, couple moyen nul, fortes surintensités, déclenchement des protections. Augmenter l'excitation éloigne le décrochage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Clarke, Concordia et Park pour une MSAP (hors programme, pour aller plus loin)</h3>
  <div class="statement">Une MSAP à pôles lisses possède \(p = 4\) paires de pôles ; le flux de ses aimants vu par une phase a pour amplitude \(\Phi_f = 0{,}12\ \text{Wb}\). Ses courants statoriques sont équilibrés, d'amplitude \(I_m = 10\sqrt2\ \text{A}\) :
  $$i_k(t) = I_m\cos\!\left(\omega t + \alpha - \frac{2(k-1)\pi}{3}\right)$$
  avec \(\alpha = \pi/3\). La position électrique du rotor vaut \(\gamma = \omega t\) (axe \(d\) aligné sur l'aimant). On utilise la transformation de Clarke puis la rotation de Park du cours (§8, complément hors programme : un sujet fournit ces transformations).</div>
  <div class="q"><strong>Q1.</strong> À l'instant où \(\omega t = \pi/6\), calculer numériquement \(i_1, i_2, i_3\), puis \(i_\alpha, i_\beta\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(i_d\) et \(i_q\). Vérifier le résultat avec l'expression générale de \(i_d + j\,i_q\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le couple électromagnétique et l'angle de pilotage \(\psi\).</div>
  <div class="q"><strong>Q4.</strong> Quelle valeur de \(\alpha\) maximise le couple à amplitude de courant donnée ? Quel gain relatif obtient-on ?</div>
  <div class="q"><strong>Q5.</strong> Avec la transformation de Concordia, quelle serait l'amplitude du vecteur \((i_\alpha, i_\beta)\) ? Quelle expression de la puissance instantanée faudrait-il alors utiliser ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega t + \alpha = \pi/2\) : \(i_1 = I_m\cos(\pi/2) = 0\), \(i_2 = I_m\cos(-\pi/6) = 12{,}25\ \text{A}\), \(i_3 = I_m\cos(-5\pi/6) = -12{,}25\ \text{A}\) (somme nulle ✓). Clarke : \(i_\alpha = \frac23\big(0 - \frac{12{,}25 - 12{,}25}{2}\big) = 0\) et \(i_\beta = (12{,}25 + 12{,}25)/\sqrt3 = 14{,}14\ \text{A} = I_m\) : le vecteur courant est porté par l'axe \(\beta\), avec l'amplitude des phases.</p>
    <p><strong>Q2.</strong> Avec \(\gamma = \pi/6\) : \(i_d = 0\times\cos\frac{\pi}{6} + 14{,}14\times\sin\frac{\pi}{6} = 7{,}07\ \text{A}\), \(i_q = -0\times\sin\frac{\pi}{6} + 14{,}14\times\cos\frac{\pi}{6} = 12{,}25\ \text{A}\). Expression générale (\(\gamma_0 = 0\)) : \(i_d + j\,i_q = I_m\,e^{j\pi/3} = 7{,}07 + 12{,}25j\) ✓ — résultat indépendant de l'instant choisi.</p>
    <p><strong>Q3.</strong> \(C_{em} = \frac32\,p\,\Phi_f\,i_q\), soit \(1{,}5\times4\times0{,}12\times12{,}25\) \(= 8{,}82\ \text{N·m}\). La f.é.m. est portée par l'axe \(q\) ; le courant fait un angle \(\alpha = \pi/3\) avec \(d\), donc \(\pi/6\) avec \(q\), en retard sur \(\underline{E}\) : \(\psi = +30°\) (cohérent avec \(i_d = I_m\sin\psi \gt 0\) et \(i_q = I_m\cos\psi\)).</p>
    <p><strong>Q4.</strong> Le couple ne dépend que de \(i_q = I_m\sin\alpha\) : il est maximal pour \(\alpha = \pi/2\), soit \(i_d = 0\) et \(i_q = I_m = 14{,}14\ \text{A}\) : \(C_{em} = 10{,}18\ \text{N·m}\), gain de 15,5 % (\(1/\cos 30°\)). Le courant \(i_d\) ne produisait aucun couple mais des pertes Joule : c'est la justification de la consigne \(i_d^* = 0\).</p>
    <p><strong>Q5.</strong> Concordia multiplie les amplitudes par \(\sqrt{3/2}\) : \(\sqrt{3/2}\times14{,}14 = 17{,}3\ \text{A}\). Cette transformation conserve la puissance : \(p(t) = v_\alpha i_\alpha + v_\beta i_\beta = v_d i_d + v_q i_q\), alors qu'avec Clarke il faut écrire \(p = \frac32(v_d i_d + v_q i_q)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Treuil de levage : une MAS sur variateur dans deux quadrants</h3>
  <div class="statement">Un treuil soulève et descend une charge de masse \(m = 600\ \text{kg}\) (\(g = 9{,}81\ \text{m/s}^2\)). Le câble s'enroule sur un tambour de rayon \(r = 0{,}10\ \text{m}\), entraîné par un moteur asynchrone à 4 pôles à travers un réducteur de rapport \(k = \Omega_{tambour}/\Omega_m = 1/20\) et de rendement \(\eta = 0{,}9\) dans les deux sens de transfert de la puissance. Le moteur est alimenté par un variateur à \(V/f\) constant (tension simple nominale 230 V à 50 Hz) ; il glisse de 40 tr/min à son couple nominal \(C_n = 50\ \text{N·m}\), et l'on utilise le modèle linéaire de la zone utile. Les vitesses sont constantes (accélérations négligées). On raisonne dans le plan \((C_{em}, \Omega)\), \(\Omega > 0\) à la montée.</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse de rotation du moteur pour une vitesse de câble de 0,75 m/s, et la pente \(a\) de la caractéristique \(C_{em} = a(\Omega_s - \Omega)\).</div>
  <div class="q"><strong>Q2.</strong> Montée à 0,75 m/s : calculer le couple moteur, le quadrant, la fréquence et la tension simple à régler, puis la puissance mécanique fournie par le moteur et la puissance de levage.</div>
  <div class="q"><strong>Q3.</strong> Descente à 0,75 m/s : quel est le signe du couple moteur ? Calculer sa valeur et situer le fonctionnement.</div>
  <div class="q"><strong>Q4.</strong> Toujours en descente : déterminer la vitesse de synchronisme (sens compris), la fréquence, le glissement, puis la puissance mécanique reçue, la puissance transmise et les pertes Joule rotoriques. Que doit faire le variateur, et comment passe-t-il de la montée à la descente ?</div>
  <div class="q"><strong>Q5.</strong> Le variateur a un redresseur à diodes et un bus continu limité à 700 V. Quelle résistance de freinage maximale faut-il prévoir (pertes de l'onduleur négligées) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Omega_{tambour} = v/r = 7{,}5\ \text{rad/s}\), donc \(\Omega_m = 7{,}5\times20 = 150\ \text{rad/s}\) (≈ 1 432 tr/min). Pente : \(a = C_n/\Omega_g\) avec \(\Omega_g = 40\,\pi/30 = 4{,}19\ \text{rad/s}\), soit \(a \approx 11{,}9\ \text{N·m·s/rad}\), indépendante de \(f\) à \(V/f\) constant.</p>
    <p><strong>Q2.</strong> Couple de la charge sur le tambour : \(mgr = 588{,}6\ \text{N·m}\). En marche motrice, \(C_m = k\,mgr/\eta\) \(= 588{,}6/(20\times0{,}9)\) \(\approx 32{,}7\ \text{N·m}\). \(\Omega > 0\) et \(C_{em} > 0\) : <strong>quadrant 1</strong> (moteur). Vitesse de glissement \(\Omega_g = 32{,}7/11{,}9 \approx 2{,}74\ \text{rad/s}\) (26 tr/min), d'où \(N_s \approx 1432 + 26 = 1458\ \text{tr/min}\), \(f = 2N_s/60 \approx 48{,}6\ \text{Hz}\) et \(V = 230\times48{,}6/50 \approx 224\ \text{V}\). Puissance mécanique : \(C_m\Omega_m \approx 4{,}91\ \text{kW}\), pour une puissance de levage \(mgv \approx 4{,}41\ \text{kW}\) (rendement du réducteur 0,9).</p>
    <p><strong>Q3.</strong> La charge descend à vitesse constante : le moteur doit la <em>retenir</em>, son couple garde le signe de la montée (\(C_{em} > 0\)) alors que \(\Omega \lt 0\). Ici la charge entraîne, la puissance va du tambour vers le moteur et le rendement s'applique dans l'autre sens : \(C_m = k\,\eta\,mgr = 588{,}6\times0{,}9/20 \approx 26{,}5\ \text{N·m}\). <strong>Quadrant 4</strong> : frein en marche arrière, la machine fonctionne en génératrice.</p>
    <p><strong>Q4.</strong> \(C_{em} = a(\Omega_s - \Omega) = 26{,}5\ \text{N·m}\) donne \(\Omega_s - \Omega = 2{,}22\ \text{rad/s}\) (21 tr/min), donc \(\Omega_s = -150 + 2{,}22 \approx -147{,}8\ \text{rad/s}\) : le champ tourne dans le sens de la descente (ordre des phases inversé) à \(|N_s| \approx 1411\ \text{tr/min}\), soit \(f \approx 47{,}0\ \text{Hz}\). Glissement \(g = (\Omega_s - \Omega)/\Omega_s\) \(\approx 2{,}22/(-147{,}8)\) \(\approx -1{,}5\ \%\) : rotor plus rapide que le champ, génératrice hypersynchrone. Puissances : \(C_{em}\Omega \approx -3{,}97\ \text{kW}\) (la machine reçoit 3,97 kW mécaniques), \(P_{tr} = C_{em}\Omega_s \approx -3{,}91\ \text{kW}\) (3,91 kW traversent l'entrefer vers le stator, donc vers l'onduleur), \(P_{jr} = g\,P_{tr} \approx 59\ \text{W}\) : \(3973 = 3914 + 59\). Le variateur inverse l'ordre des phases (permutation de la commande de deux bras) et règle la fréquence un peu <em>sous</em> la vitesse du rotor ; pour passer de la montée à la descente, il ralentit en abaissant la fréquence, s'arrête, puis repart avec la séquence inverse, sans contacteur.</p>
    <p><strong>Q5.</strong> Le pont de diodes n'est pas réversible : les 3,9 kW renvoyés chargent le condensateur du bus. Un hacheur connecte une résistance \(R_f\) qui doit pouvoir dissiper cette puissance sous 700 V au plus : \(R_f \leq 700^2/3914 \approx 125\ \Omega\). Pour un treuil qui descend souvent, un redresseur réversible (renvoi au réseau) devient rentable.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Axe à crémaillère d'un portique, entraîné par une MSAP autopilotée</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>machines synchrone et asynchrone, commande</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Sur un portique de manutention, un chariot roule sur un rail horizontal. Il embarque son motoréducteur : un moteur synchrone à aimants autopiloté entraîne, à travers un réducteur de rapport \(k = \Omega_{pignon}/\Omega_m = 1/5\), un pignon de rayon \(r = 30\ \text{mm}\) qui engrène sur une crémaillère fixée au rail. La masse totale en mouvement (chariot, moteur, charge) vaut \(m = 40\ \text{kg}\). Le rendement de la transmission vaut \(\eta = 0{,}9\) en marche motrice ; l'inertie du rotor est \(J_m = 2{,}0\times10^{-4}\ \text{kg·m}^2\) (les autres inerties tournantes sont négligées) ; les frottements opposent un effort constant \(F_f = 30\ \text{N}\).<br>
    Loi de mouvement (trapèze de vitesse) : accélération à \(5\ \text{m/s}^2\) jusqu'à \(v = 2\ \text{m/s}\), palier de 0,6 s, décélération à \(5\ \text{m/s}^2\) jusqu'à l'arrêt, puis 0,6 s d'arrêt avant le cycle suivant.
  </div>

  <p class="exo-part">Partie A — Besoin et choix du moteur</p>
  <div class="q"><strong>A1.</strong> Calculer la durée et la longueur des phases d'accélération et de décélération, la course totale et la durée du cycle.</div>
  <div class="q"><strong>A2.</strong> Calculer la vitesse de rotation du moteur au palier (en rad/s et en tr/min).</div>
  <div class="q"><strong>A3.</strong> Calculer le couple moteur pendant l'accélération et pendant le palier. On admet qu'en décélération (puissance renvoyée par la charge), le couple moteur vaut \(C_3 = -1{,}08\ \text{N·m}\).</div>
  <div class="q"><strong>A4.</strong> Calculer le couple efficace sur le cycle.</div>
  <div class="q"><strong>A5.</strong> Choisir le moteur parmi les trois suivants, en justifiant :</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.4rem 0;text-align:center">
    <tr style="background:var(--paper-dark)"><th style="padding:.3rem;border:1px solid var(--grid)">Moteur</th><th style="padding:.3rem;border:1px solid var(--grid)">\(C_n\) (N·m)</th><th style="padding:.3rem;border:1px solid var(--grid)">\(C_{crête}\) (N·m)</th><th style="padding:.3rem;border:1px solid var(--grid)">\(N_{max}\) (tr/min)</th></tr>
    <tr><td style="padding:.3rem;border:1px solid var(--grid)">M1</td><td style="padding:.3rem;border:1px solid var(--grid)">0,8</td><td style="padding:.3rem;border:1px solid var(--grid)">2,4</td><td style="padding:.3rem;border:1px solid var(--grid)">6 000</td></tr>
    <tr><td style="padding:.3rem;border:1px solid var(--grid)">M2</td><td style="padding:.3rem;border:1px solid var(--grid)">1,3</td><td style="padding:.3rem;border:1px solid var(--grid)">4,0</td><td style="padding:.3rem;border:1px solid var(--grid)">4 500</td></tr>
    <tr><td style="padding:.3rem;border:1px solid var(--grid)">M3</td><td style="padding:.3rem;border:1px solid var(--grid)">2,5</td><td style="padding:.3rem;border:1px solid var(--grid)">7,5</td><td style="padding:.3rem;border:1px solid var(--grid)">3 000</td></tr>
  </table></div>

  <p class="exo-part">Partie B — Autopilotage du moteur retenu</p>
  <p>Moteur M2 : \(p = 4\) ; f.é.m. efficace par phase \(E = K\Omega\) avec \(K = 0{,}15\ \text{V·s/rad}\) ; \(R = 1{,}2\ \Omega\) ; \(L = 6{,}0\ \text{mH}\) par phase. L'onduleur peut fournir au plus \(V_{max} = 90\ \text{V}\) efficaces par phase.</p>
  <div class="q"><strong>B1.</strong> Quel courant efficace faut-il en fin d'accélération si l'onduleur impose \(\psi = 0\) ? Et si un défaut de calage du capteur de position conduisait à \(\psi = 25°\) ? Comparer les pertes Joule et conclure sur l'intérêt de \(\psi = 0\).</div>
  <div class="q"><strong>B2.</strong> En fin d'accélération (\(v = 2\ \text{m/s}\)), calculer la fréquence statorique, \(E\), \(V\) et \(\cos\varphi\). Établir le bilan des puissances.</div>
  <div class="q"><strong>B3.</strong> À ce même courant, jusqu'à quelle vitesse le pilotage à \(\psi = 0\) reste-t-il compatible avec \(V_{max}\) ?</div>
  <div class="q"><strong>B4.</strong> Pendant la décélération, dans quel sens transite la puissance ? Quelle conséquence pour le bus continu de l'onduleur ? Estimer l'énergie cinétique à absorber (avec l'inertie équivalente de C4).</div>

  <p class="exo-part">Partie C — Commande vectorielle</p>
  <p><em>Notation : dans les transmittances, \(p\) désigne la variable de Laplace ; ne pas la confondre avec le nombre de paires de pôles (\(p = 4\)), qui n'apparaît que dans \(k_c\) et \(\omega = p\,\Omega\).</em></p>
  <div class="q"><strong>C1.</strong> On adopte Clarke–Park : \(C_{em} = \frac32\,p\,\Phi_f\,i_q\). Montrer que \(\Phi_f = \sqrt2\,K/p\) et calculer \(k_c = \frac32 p\Phi_f\). Quelle consigne \(i_d^*\) adopter ?</div>
  <div class="q"><strong>C2.</strong> À partir des équations \((d, q)\) du cours, proposer un découplage tel que l'axe \(q\) se réduise à \(I_q(p)/V_q'(p) = 1/(R + Lp)\). Calculer la constante de temps électrique \(\tau_e\).</div>
  <div class="q"><strong>C3.</strong> Le correcteur de courant est un PI \(C_i(p) = K_i\,\dfrac{1 + T_i p}{T_i p}\) avec \(T_i = \tau_e\). Montrer que la boucle de courant fermée est du premier ordre, de constante de temps \(\tau_i = L/K_i\). Calculer \(K_i\) pour \(\tau_i = 0{,}5\ \text{ms}\).</div>
  <div class="q"><strong>C4.</strong> Calculer l'inertie équivalente ramenée sur l'arbre moteur (on néglige l'effet du rendement). La boucle de courant étant assimilée à un gain unitaire, on règle la vitesse par un correcteur proportionnel \(K_\Omega\) (consigne de courant \(i_q^* = K_\Omega(\Omega^* - \Omega)\)). Calculer \(K_\Omega\) pour une constante de temps de boucle de 10 ms. Justifier l'hypothèse et commenter l'erreur statique sous un couple résistant de 0,2 N·m.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(t_a = v/a = 0{,}4\ \text{s}\), longueur \(\frac12 a t_a^2 = 0{,}4\ \text{m}\) (idem en décélération). Palier : \(2\times0{,}6 = 1{,}2\ \text{m}\). Course : 2,0 m ; cycle : \(T = 0{,}4 + 0{,}6 + 0{,}4 + 0{,}6 = 2{,}0\ \text{s}\).</p>
    <p><strong>A2.</strong> Roulement sans glissement du pignon sur la crémaillère : \(\Omega_{pignon} = v/r = 66{,}7\ \text{rad/s}\), \(\Omega_m = \Omega_{pignon}/k = 333{,}3\ \text{rad/s}\), soit 3 183 tr/min.</p>
    <p><strong>A3.</strong> Accélération : effort à fournir \(ma + F_f = 230\ \text{N}\), couple sur le pignon \(6{,}9\ \text{N·m}\), ramené au moteur \(6{,}9\times k/\eta = 1{,}533\ \text{N·m}\). S'y ajoute le couple d'inertie du rotor, avec \(\dot\Omega_m = a/(rk) = 833\ \text{rad/s}^2\) :</p>
    $$J_m\dot\Omega_m = 2\times10^{-4}\times833 = 0{,}167\ \text{N·m}$$
    <p>Total : \(C_1 = 1{,}70\ \text{N·m}\). Palier : \(C_2 = F_f\,r\,k/\eta = 0{,}20\ \text{N·m}\).</p>
    <p><strong>A4.</strong></p>
    $$\begin{aligned}\int_0^T C_m^2\,\mathrm{d}t &= 1{,}70^2\times0{,}4 + 0{,}20^2\times0{,}6\\ &\quad + 1{,}08^2\times0{,}4 = 1{,}65\ \text{N}^2\text{·m}^2\text{·s}\end{aligned}$$
    $$C_{eff} = \sqrt{1{,}65/2{,}0} = 0{,}91\ \text{N·m}$$
    <p><strong>A5.</strong> M1 : \(C_n = 0{,}8 \lt 0{,}91\ \text{N·m}\), il chaufferait. M3 : \(N_{max} = 3000 \lt 3183\) tr/min, trop lent. <strong>M2</strong> convient : \(C_n = 1{,}3 \ge 0{,}91\), \(C_{crête} = 4{,}0 \ge 1{,}70\), \(N_{max} = 4500 \ge 3183\) tr/min.</p>
    <p><strong>B1.</strong> \(C = 3KI\cos\psi\). Avec \(\psi = 0\) : \(I = C_1/(3K) = 1{,}70/0{,}45 = 3{,}78\ \text{A}\). Avec \(\psi = 25°\) : \(I = 3{,}78/\cos 25° = 4{,}17\ \text{A}\). Les pertes Joule \(3RI^2\) passent de 51 W à 63 W (rapport \(1/\cos^2 25° = 1{,}22\)) pour le même couple. À couple imposé, \(\psi = 0\) minimise le courant, donc les pertes Joule et le calibre de l'onduleur : d'où l'importance du calage du capteur.</p>
    <p><strong>B2.</strong> \(f = p\,\Omega_m/2\pi = 212\ \text{Hz}\), \(\omega = 1333\ \text{rad/s}\), \(L\omega = 8{,}0\ \Omega\). \(E = 0{,}15\times333{,}3 = 50{,}0\ \text{V}\). \(\underline{I}\) étant en phase avec \(\underline{E}\) :</p>
    $$\begin{aligned} V &= \sqrt{(E + RI)^2 + (L\omega I)^2}\\ &= \sqrt{54{,}5^2 + 30{,}2^2} = 62{,}3\ \text{V}\end{aligned}$$
    <p>\(\tan\varphi = 30{,}2/54{,}5\), \(\varphi = 29{,}0°\), \(\cos\varphi = 0{,}875\). Bilan : \(P_{em} = 3EI = 567\ \text{W} = C_1\Omega_m\) ✓ ; \(P_{js} = 3RI^2 = 51\ \text{W}\) ; \(P_a = 618\ \text{W} = 3VI\cos\varphi\) ✓.</p>
    <p><strong>B3.</strong> \((K\Omega + RI)^2 + (pL\Omega I)^2 = V_{max}^2\) donne \(0{,}0307\,\Omega^2 + 1{,}36\,\Omega - 8079 = 0\), soit \(\Omega_{max} = 491\ \text{rad/s}\) (4 690 tr/min) : la marge par rapport aux 3 183 tr/min requis est confortable.</p>
    <p><strong>B4.</strong> Couple négatif à vitesse positive : la machine fonctionne en <strong>génératrice</strong>, l'énergie cinétique de l'axe est renvoyée, à travers l'onduleur (réversible en courant), vers le bus continu. Si le redresseur d'entrée n'est pas réversible, la tension du bus monte : il faut un hacheur et une résistance de freinage (ou un stockage). Énergie : \(\frac12 J_{eq}\Omega_m^2 = \frac12\times1{,}64\times10^{-3}\times333{,}3^2 \approx 91\ \text{J}\) (moins les pertes).</p>
    <p><strong>C1.</strong> \(E\sqrt2 = \omega\Phi_f = p\,\Omega\,\Phi_f\) et \(E = K\Omega\), donc \(\Phi_f = \sqrt2 K/p = 0{,}053\ \text{Wb}\) et \(k_c = 3K/\sqrt2 = 0{,}318\ \text{N·m/A}\). Contrôle : en fin d'accélération, \(i_q = 1{,}70/0{,}318 = 5{,}34\ \text{A} = I\sqrt2\) ✓. Consigne \(i_d^* = 0\) (équivalent de \(\psi = 0\)).</p>
    <p><strong>C2.</strong> \(v_q = R i_q + L\frac{\mathrm{d}i_q}{\mathrm{d}t} + \omega L i_d + \omega\Phi_f\). En imposant \(v_q = v_q' + \omega L i_d + \omega\Phi_f\) (termes calculés à partir des mesures), il reste \(v_q' = R i_q + L\frac{\mathrm{d}i_q}{\mathrm{d}t}\), soit \(I_q/V_q' = 1/(R + Lp)\) ; de même sur l'axe \(d\) avec \(v_d = v_d' - \omega L i_q\). \(\tau_e = L/R = 5\ \text{ms}\).</p>
    <p><strong>C3.</strong> Avec \(T_i = \tau_e\), le zéro du PI compense le pôle électrique :</p>
    $$H_{BO}(p) = K_i\,\frac{1 + \tau_e p}{\tau_e p}\cdot\frac{1/R}{1 + \tau_e p} = \frac{K_i}{L\,p}$$
    $$H_{BF}(p) = \frac{1}{1 + \frac{L}{K_i}\,p}$$
    <p>Premier ordre de gain unitaire et de constante de temps \(\tau_i = L/K_i\). Pour \(\tau_i = 0{,}5\ \text{ms}\) : \(K_i = L/\tau_i\) \(= 6\times10^{-3}/(0{,}5\times10^{-3})\) \(= 12\ \text{V/A}\) (temps de réponse à 5 % : 1,5 ms).</p>
    <p><strong>C4.</strong></p>
    $$\begin{aligned} J_{eq} &= J_m + m\,(rk)^2\\ &= 2\times10^{-4} + 40\times(6\times10^{-3})^2\\ &= 1{,}64\times10^{-3}\ \text{kg·m}^2\end{aligned}$$
    <p>Avec \(\Omega(p)/I_q^*(p) = k_c/(J_{eq}\,p)\) et un correcteur \(K_\Omega\), la boucle fermée est du premier ordre de constante de temps \(\tau_\Omega = J_{eq}/(K_\Omega k_c)\), d'où</p>
    $$K_\Omega = \frac{1{,}64\times10^{-3}}{0{,}01\times0{,}318} = 0{,}52\ \text{A·s/rad}$$
    <p>L'hypothèse est justifiée : \(\tau_\Omega = 20\,\tau_i\). Le couple résistant agit en aval du correcteur, sans intégrateur en amont : erreur statique \(\Delta\Omega = C_r/(K_\Omega k_c)\), soit \(0{,}2/(0{,}52\times0{,}318) \approx 1{,}2\ \text{rad/s}\). Un correcteur PI de vitesse l'annule.</p>
  </div>
