<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">L'usinage relève de la compétence « Industrialiser un produit » (G2) : <strong>évaluer la capacité d'un procédé à réaliser des opérations de finition</strong>. Le programme le place au semestre S3 (début de 2ᵉ année) ; le site le range avec les autres procédés de fabrication. Comme pour tous les procédés, l'analyse reste <strong>qualitative</strong>. Le chapitre de 2ᵉ année <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a> réutilise ces notions pour choisir un procédé, ordonner une gamme complète et contrôler la pièce.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Enlèvement de matière</strong> : principe de génération des surfaces et cinématique de la coupe (G2, S3) (§1 à §4).</li>
        <li><strong>Choix de cinématique de machine</strong> : classification des machines à commande numérique, tours 2 et 3 axes, centres d'usinage 3, 4 et 5 axes (G2, S3) (§5).</li>
        <li><strong>Choix d'une mise en position</strong> : seul le symbole d'élimination d'un degré de liberté en translation (la normale de repérage) est utilisé (G2, S3) (§6).</li>
        <li><strong>Choix des phases</strong> (G2, S3) (§7, §8) ; la définition détaillée des phases de fabrication n'est pas au programme.</li>
      </ul>
      <p>Non exigibles : les applications numériques des conditions de coupe (fréquence de rotation, vitesse d'avance, temps d'usinage), la puissance de coupe et la rugosité théorique, regroupées en fin de chapitre (« Pour aller plus loin ») ; un sujet qui s'en servirait fournirait les relations. Le contrat de phase détaillé (outils, conditions de coupe, cotes fabriquées) n'est pas au programme.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · PRINCIPE DE L'USINAGE</div>
  <h2>Enlever de la matière pour obtenir cotes et états de surface précis</h2>
  <div class="intro">L'<strong>usinage</strong> obtient la forme finale en <strong>enlevant de la matière</strong> sous forme de <strong>copeaux</strong>, à l'aide d'un <strong>outil coupant</strong>. C'est un procédé <strong>soustractif</strong>, le plus souvent employé en <strong>finition</strong> : il reprend une pièce brute (moulée, forgée, laminée) pour atteindre les tolérances serrées et le bel état de surface des surfaces fonctionnelles.</div>

  <h3>Coupe &amp; copeau</h3>
  <div class="def-box">
    L'arête de l'outil pénètre dans la pièce et <strong>cisaille</strong> la matière, qui s'évacue en copeau. Il y a un <strong>mouvement de coupe</strong> (rapide, qui enlève la matière) et un <strong>mouvement d'avance</strong> (qui déplace l'outil pour usiner toute la surface).
  </div>
  <div class="notice"><strong>Soustractif</strong> : la matière enlevée est perdue (copeaux). L'usinage coûte du temps, de l'outil et de la matière → on n'usine que ce qui doit l'être (surfaces fonctionnelles), en partant d'un brut proche de la forme finale.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PARAMÈTRES DE COUPE</div>
  <h2>Vitesse de coupe, avance, profondeur de passe</h2>

  <div class="def-box">
    <strong>Vitesse de coupe</strong> \(V_c\) (m/min) : vitesse relative entre l'arête de l'outil et la pièce au point de coupe. Pour une pièce (ou un outil) de diamètre \(D\) tournant à la fréquence \(N\) :
    <div class="formula" data-nom="Vitesse de coupe">$$V_c = \pi\, D\, N$$</div>
    Avec \(V_c\) en m/min, \(D\) en mm et \(N\) en tr/min, on prend garde aux unités :
    <div class="formula" data-nom="Fréquence de rotation">$$N = \frac{1000\,V_c}{\pi\, D}\quad(\text{tr/min})$$</div>
  </div>

  <div class="prop-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Avance</strong> \(f\) (mm/tr) : déplacement de l'outil par tour ; fixe l'épaisseur du copeau et l'état de surface.</li>
      <li><strong>Profondeur de passe</strong> \(a_p\) (mm) : épaisseur de matière enlevée à chaque passe.</li>
      <li><strong>\(V_c\) dépend du couple</strong> « matériau usiné / matériau de l'outil » : plus le métal est dur, plus \(V_c\) est faible (sinon l'outil s'use/chauffe trop). Un <strong>fluide de coupe</strong> lubrifie et refroidit.</li>
    </ul>
  </div>

  <div class="notice"><strong>Ce qu'il faut savoir sans calcul.</strong> À \(V_c\) donnée, la fréquence de rotation augmente quand le diamètre diminue. Une avance forte raccourcit l'usinage mais laisse des sillons plus marqués : on la réduit en finition. Une grande profondeur de passe enlève beaucoup de matière à chaque passe (ébauche) mais demande de la puissance, un outil robuste et une pièce bien tenue. Une vitesse de coupe trop élevée échauffe et use l'outil. Les applications numériques (vitesse d'avance, temps de coupe, puissance) ne sont pas exigibles : elles sont regroupées en fin de chapitre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · GÉNÉRATION DES SURFACES</div>
  <h2>Comment l'outil et la machine engendrent une surface</h2>
  <div class="intro">Une machine-outil ne reproduit pas une surface d'un seul coup : elle l'<strong>engendre</strong> en combinant la forme de l'arête et les mouvements relatifs de l'outil et de la pièce. Savoir ce qui fixe la forme obtenue, l'outil ou la machine, c'est savoir de quoi dépend sa précision.</div>

  <h3>Mouvement de coupe et mouvement d'avance</h3>
  <div class="def-box"><strong>Mouvements de génération.</strong> Le <strong>mouvement de coupe</strong> \(M_c\) est le mouvement relatif rapide qui fait passer l'arête dans la matière et forme le copeau, à la vitesse de coupe \(V_c\) ; il absorbe presque toute la puissance. Le <strong>mouvement d'avance</strong> \(M_f\), lent, déplace l'arête pour lui présenter de la matière neuve. En tournage, \(M_c\) est la rotation de la pièce et \(M_f\) une translation de l'outil ; en fraisage et en perçage, \(M_c\) est la rotation de l'outil et \(M_f\) une translation de l'outil ou de la table.</div>

  <h3>Génératrice et directrice</h3>
  <p>Les surfaces usuelles se décrivent comme le balayage d'une ligne, la <strong>génératrice</strong>, qui se déplace en s'appuyant sur une seconde ligne, la <strong>directrice</strong>. Un cylindre de révolution : une droite parallèle à l'axe qui s'appuie sur un cercle. Un plan : une droite qui glisse le long d'une autre droite (ou un cercle qui se translate dans son plan). Un cône : une droite qui passe par un point de l'axe et s'appuie sur un cercle.</p>

  <div class="def-box"><strong>Travail de forme.</strong> La génératrice est <em>matérialisée par l'arête</em> de l'outil : son profil se retrouve tel quel sur la pièce, et le mouvement ne fournit que la directrice. Exemples : gorge tournée en plongée avec un outil de la largeur de la gorge, chanfrein obtenu par une arête inclinée, trou percé au foret ou fini à l'alésoir (le diamètre est celui de l'outil), congé usiné avec une fraise à profil arrondi. La précision dépend surtout de l'<strong>outil</strong> (profil, affûtage, usure) ; il faut un outil par forme, et une arête longue en prise provoque efforts et vibrations.</div>

  <div class="def-box"><strong>Travail d'enveloppe.</strong> L'arête ne touche la surface finale qu'en un point (ou sur une très petite zone) ; génératrice et directrice sont <em>toutes deux engendrées par des mouvements</em>, et la surface est l'<strong>enveloppe</strong> des positions successives de l'outil. Exemples : chariotage d'un cylindre, dressage d'une face, profil de révolution quelconque suivi au tour à commande numérique, contour suivi par une fraise. Un même outil standard réalise des formes variées ; la précision dépend surtout de la <strong>machine</strong> (rectitude des guidages, exactitude des trajectoires, réglage de la position de l'outil).</div>

  <h3>En fraisage : en bout ou de profil</h3>
  <p>Une fraise tourne autour de son axe ; ses dents de <strong>bout</strong> (sur la face d'extrémité) et ses dents <strong>périphériques</strong> (sur le pourtour) ne travaillent pas de la même façon.</p>
  <ul>
    <li><strong>Fraisage en bout</strong> (de face, ou surfaçage) : l'axe de la fraise est <strong>perpendiculaire</strong> à la surface usinée. Les dents de bout décrivent un cercle (génératrice, par le mouvement de coupe) que l'avance translate (directrice) : travail d'enveloppe. La planéité obtenue dépend de la perpendicularité entre l'axe de la broche et la direction d'avance, c'est-à-dire de la machine.</li>
    <li><strong>Fraisage de profil</strong> (en roulant, ou de côté) : l'axe de la fraise est <strong>parallèle</strong> à la surface usinée. Une arête périphérique, droite et parallèle à l'axe, donne la génératrice (travail de forme : la hauteur du flanc est rectiligne parce que l'arête l'est) ; la trajectoire de l'axe donne la directrice (travail d'enveloppe : le contour vu de dessus est l'enveloppe des positions de la fraise, décalée d'un rayon d'outil). C'est ainsi qu'on usine épaulements, flancs de rainures et contours.</li>
  </ul>

    <tr><td>Gorge en plongée, chanfrein à l'outil de forme (tour)</td><td>rotation de la pièce</td><td>translation radiale (ou axiale) courte</td><td>surface de révolution au profil de l'arête</td><td>forme</td></tr>
    <tr><td>Fraisage en bout</td><td>rotation de la fraise</td><td>translation perpendiculaire à l'axe de la fraise</td><td>plan perpendiculaire à l'axe de la fraise</td><td>enveloppe</td></tr>
    <tr><td>Fraisage de profil</td><td>rotation de la fraise</td><td>trajectoire perpendiculaire à l'axe de la fraise</td><td>plan ou flanc parallèle à l'axe de la fraise (épaulement, contour)</td><td>forme (génératrice) et enveloppe (directrice)</td></tr>
    <tr><td>Perçage au foret, alésage à l'alésoir</td><td>rotation de l'outil (ou de la pièce sur un tour)</td><td>translation axiale</td><td>trou cylindrique (fond conique au foret)</td><td>forme</td></tr>
  </table></div>

  <div class="prop-box"><strong>À retenir.</strong> En travail de forme, la qualité de la surface est celle de l'outil : pratique pour une forme répétée en série, mais il faut un outil par forme. En travail d'enveloppe, elle est celle de la machine et de sa commande : un outil standard suffit pour des formes variées, et la commande numérique rend accessibles des profils quelconques. La plupart des opérations réelles combinent les deux, comme le fraisage de profil.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MACHINES À COMMANDE NUMÉRIQUE</div>
  <h2>Choisir la cinématique de la machine</h2>
  <div class="intro">La surface obtenue dépend des mouvements dont la machine dispose. Sur une machine à <strong>commande numérique</strong> (CN), chaque mouvement piloté est un <strong>axe</strong> : la classification des machines se fait d'après ces axes, et choisir une machine revient à vérifier qu'elle sait présenter l'outil devant toutes les surfaces d'une même prise.</div>

  <div class="def-box"><strong>Repérage normalisé des axes.</strong> L'axe \(Z\) est porté par la <strong>broche</strong> (celle qui fait tourner la pièce sur un tour, l'outil sur une fraiseuse). L'axe \(X\) est la direction perpendiculaire à \(Z\) de plus grande course (sur un tour : la direction radiale, qui fixe le diamètre usiné) ; \(Y\) complète le trièdre direct. Les rotations autour de \(X\), \(Y\), \(Z\) s'appellent \(A\), \(B\), \(C\). Le sens positif d'un axe est celui qui <strong>éloigne l'outil de la pièce</strong>.</div>

  <h3>Classification</h3>
  <div style="overflow-x:auto"><table>
    <tr><th>Machine</th><th>Axes pilotés</th><th>Ce que la cinématique permet</th><th>Pièces typiques</th></tr>
    <tr><td>Tour 2 axes</td><td>\(X\), \(Z\)</td><td>toutes les surfaces de révolution autour de l'axe de broche : cylindres, faces, cônes, gorges, profils quelconques, filetages ; perçage et alésage dans l'axe</td><td>arbres, axes, bagues, entretoises</td></tr>
    <tr><td>Tour 3 axes (centre de tournage)</td><td>\(X\), \(Z\) + \(C\) : broche arrêtée et orientée à un angle commandé, outils tournants sur la tourelle</td><td>fraiser ou percer hors de l'axe sans démonter la pièce : méplats, trous radiaux ou décalés, rainures de clavette, six pans</td><td>arbre avec méplat et trou de goupille, raccord, corps de vanne de révolution</td></tr>
    <tr><td>Centre d'usinage 3 axes</td><td>\(X\), \(Y\), \(Z\) ; l'orientation de l'outil par rapport à la pièce est fixe</td><td>toutes les surfaces accessibles selon une seule direction (une face par prise) : plans, épaulements, poches, rainures, perçages parallèles à \(Z\), formes 3D peu creuses à la fraise hémisphérique</td><td>plaques, brides, couvercles, empreintes de moule peu profondes</td></tr>
    <tr><td>Centre 4 axes</td><td>+ une rotation : plateau tournant \(B\) d'un centre à broche horizontale, ou axe \(A\) d'un diviseur</td><td>plusieurs faces réparties autour d'un axe dans la même prise ; rainures hélicoïdales, cames cylindriques</td><td>carters, corps de pompe, blocs hydrauliques</td></tr>
    <tr><td>Centre 5 axes</td><td>+ deux rotations (par exemple \(A\) et \(C\), ou \(B\) et \(C\))</td><td>orienter l'axe de l'outil dans presque toute direction : faces et trous inclinés, surfaces gauches, cinq faces d'un bloc en une seule prise</td><td>aubes et roues de turbine, pièces de structure aéronautique, moules complexes</td></tr>
  </table></div>

  <div class="prop-box"><strong>Choisir le nombre d'axes.</strong> On recense, pour chaque surface, la direction depuis laquelle l'outil doit l'atteindre (normale d'un plan, axe d'un trou ou d'un alésage). Toutes les surfaces de révolution d'un même axe → tour 2 axes, et un tour 3 axes s'il s'y ajoute quelques formes hors de l'axe. Toutes les directions d'accès parallèles → centre 3 axes. Directions réparties autour d'un même axe → 4 axes. Directions inclinées quelconques ou surfaces gauches → 5 axes. Chaque axe supplémentaire coûte (machine, programmation), mais il évite des démontages : moins de temps de remise en position et de meilleures positions relatives entre surfaces.</div>
  <div class="notice"><strong>5 axes positionnés ou continus.</strong> Sur une machine 5 axes, on peut seulement orienter la pièce avant d'usiner en 3 axes (« 3 + 2 », pour des faces inclinées), ou faire bouger les cinq axes ensemble (surfaces gauches comme une aube). Le nombre d'axes d'une machine ne dit donc pas combien bougent à la fois.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MISE EN POSITION DE LA PIÈCE</div>
  <h2>Placer la pièce toujours au même endroit, sans contrainte inutile</h2>
  <div class="intro">Pour que l'outil, piloté dans le repère de la machine, usine la surface au bon endroit, chaque pièce d'une série doit occuper la même position sur son porte-pièce. On distingue la <strong>mise en position</strong> (les appuis qui fixent la position) du <strong>maintien en position</strong> (le serrage qui la conserve sous les efforts de coupe).</div>

  <div class="def-box"><strong>Normale de repérage.</strong> Une pièce libre a six degrés de liberté : trois translations et trois rotations. Un contact ponctuel théorique entre la pièce et le porte-pièce interdit, en ce point, la translation selon la normale à la surface : il élimine <strong>un degré de liberté</strong>. On le symbolise par une petite flèche perpendiculaire à la surface, placée du côté extérieur et pointée vers la matière, avec un numéro ; c'est le seul symbole demandé. Plusieurs normales bien disposées éliminent aussi des rotations.</div>

  <div class="prop-box"><strong>Isostatisme.</strong> La mise en position est <strong>isostatique</strong> quand chaque degré de liberté à supprimer l'est par une seule normale : au plus six normales, toutes utiles. S'il en manque, la pièce garde une mobilité et sa position n'est pas définie. Si deux normales éliminent le même degré de liberté, la mise en position est <strong>hyperstatique</strong> : la pièce ne touche pas tous ses appuis (position qui change d'une pièce à l'autre) ou se déforme au serrage, puis reprend sa forme une fois desserrée, avec une surface usinée faussée.</div>

  <h3>Les dispositions types</h3>
  <ul>
    <li><strong>Pièce prismatique : principe 3-2-1.</strong> Un appui plan de trois normales (1, 2, 3) sur la surface la plus étendue (une translation et deux rotations éliminées), écartées le plus possible ; deux normales (4, 5) alignées sur une deuxième surface (une translation et une rotation), éloignées l'une de l'autre ; une butée (6) sur une troisième surface.</li>
    <li><strong>Pièce de révolution longue : centrage long + butée.</strong> Quatre normales sur le cylindre (deux translations et deux rotations perpendiculaires à l'axe), une butée sur une face (translation axiale).</li>
    <li><strong>Pièce de révolution courte : appui plan + centrage court.</strong> Trois normales sur une face, deux sur le cylindre.</li>
    <li>Dans ces deux derniers cas, la rotation autour de l'axe reste libre. Il ne faut une sixième normale (sur un méplat, une rainure, un trou décalé) que si l'opération doit être orientée par rapport à une forme déjà réalisée.</li>
  </ul>

  <h3>Bien placer les normales</h3>
  <ul>
    <li>S'appuyer sur les <strong>surfaces de référence</strong> du dessin : si une cote ou une tolérance de position part d'une surface, la prendre comme appui permet d'obtenir la cote directement (voir le chapitre « Cotation &amp; tolérances »).</li>
    <li>Préférer des surfaces déjà usinées ; la toute première prise s'appuie forcément sur des surfaces brutes, choisies aussi régulières que possible.</li>
    <li>Écarter les normales d'un même groupe au maximum : une petite erreur sur un appui devient une petite rotation de la pièce.</li>
    <li>Serrer <strong>en face des appuis</strong> et vers eux, sans faire fléchir la pièce ; ne jamais serrer là où il n'y a pas d'appui en regard.</li>
    <li>Une pièce longue et flexible peut demander un soutien supplémentaire (contre-pointe, lunette, vérin réglable) : il ne positionne pas, il limite les flexions et se règle après la mise en position.</li>
  </ul>
  <div class="notice"><strong>Plus loin en 2ᵉ année</strong> : principe 3-2-1 sur une pièce prismatique, lien entre système de références du dessin (A | B | C) et appuis, porte-pièces usuels (étau, mandrin, montages) : chapitre <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>, §8.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · PLACE DE L'USINAGE</div>
  <h2>Un procédé de finition, précis mais coûteux</h2>
  <div class="def-box">
    <strong>Atouts</strong> : <strong>grande précision</strong> (tolérances serrées) et <strong>excellent état de surface</strong> (Ra faible, jusqu'à &lt; 1 µm en rectification), grande liberté de formes.<br>
    <strong>Limites</strong> : matière <strong>perdue</strong> en copeaux, <strong>temps</strong> d'usinage et <strong>usure</strong> des outils → coût élevé à la pièce. À réserver aux surfaces fonctionnelles.
  </div>
  <div class="notice"><strong>Logique de gamme</strong> : on obtient d'abord un <strong>brut</strong> proche de la forme finale (moulage, forgeage) puis on <strong>usine</strong> seulement les portées, alésages et surfaces de contact. La <em>surépaisseur d'usinage</em> prévue sur le brut est la matière que l'usinage enlèvera.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CHOIX DES PHASES</div>
  <h2>Regrouper et ordonner les surfaces à usiner</h2>
  <div class="intro">Une pièce passe par plusieurs postes avant d'être finie. Le programme demande de savoir <strong>justifier un découpage en phases</strong> : quelles surfaces usiner ensemble, sur quelle machine, dans quel ordre et avec quelle mise en position. La définition détaillée de chaque phase (contrat de phase avec outils, conditions de coupe et cotes de fabrication) n'est pas au programme.</div>

  <div class="def-box"><strong>Vocabulaire.</strong> Une <strong>phase</strong> regroupe tout ce qui est fait sur un même poste de travail (une machine, un four, un poste de contrôle). Une même phase peut demander plusieurs <strong>prises</strong> (ou sous-phases) quand on démonte la pièce pour la remonter autrement. Une <strong>opération</strong> est le travail d'un outil sur une surface ou un groupe de surfaces (ébauche, finition, perçage…). La <strong>gamme</strong> est la suite ordonnée des phases, du brut au contrôle final.</div>

  <div class="prop-box"><strong>Ce qui guide le découpage.</strong>
    <ul style="margin:0.3rem 0">
      <li>Usiner dans une <strong>même prise</strong> les surfaces liées par une exigence serrée (coaxialité, perpendicularité, position) : un démontage ajoute l'erreur de remise en position à la relation entre ces surfaces.</li>
      <li>Usiner d'abord les surfaces qui serviront d'<strong>appuis</strong> aux prises suivantes.</li>
      <li><strong>Ébauche avant finition</strong>, et finitions les plus précises en dernier.</li>
      <li>Placer les traitements thermiques durcissants après l'usinage à l'outil coupant et avant la rectification (chapitre « Traitements thermiques »).</li>
      <li>Choisir la machine de chaque phase d'après les directions d'accès (§5) : une machine plus riche en axes peut fusionner plusieurs prises.</li>
    </ul>
  </div>

  <div class="method-box"><strong>Exemple — une bague épaulée</strong>
    <p>Une bague en acier, tirée d'une barre, porte un alésage \(\varnothing\) 20 H7, une portée extérieure \(\varnothing\) 35 g6 qui doit être coaxiale à l'alésage à 0,02 mm près, et une collerette dont la face d'appui doit être perpendiculaire à l'alésage. L'autre face ne porte qu'une cote de longueur.</p>
    <ol>
      <li>Toutes les surfaces sont de révolution autour d'un même axe : un <strong>tour 2 axes</strong> suffit.</li>
      <li>1ʳᵉ prise, pièce serrée dans le mandrin par la barre brute : dresser la face, percer puis aléser \(\varnothing\) 20, charioter \(\varnothing\) 35, dresser la face d'appui de la collerette. Ces surfaces sont liées par la coaxialité et la perpendicularité : elles sont réalisées <strong>sans démontage</strong>.</li>
      <li>Tronçonner, puis 2ᵉ prise, pièce retournée et serrée sur \(\varnothing\) 35 finie (mors doux qui ne marquent pas) : dresser la seconde face à la longueur. Seule une cote de longueur relie cette face au reste : la reprise ne pénalise aucune exigence serrée.</li>
      <li>Terminer par un contrôle (diamètres, coaxialité).</li>
    </ol>
  </div>
  <div class="notice"><strong>Pour une gamme complète</strong> (brut, traitements, rectification, contrôle) et la liste des règles d'ordonnancement, voir le chapitre de 2ᵉ année <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>, §8, qui en donne un exemple commenté.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · CONDITIONS DE COUPE CHIFFRÉES</div>
  <h2>Vitesse d'avance, temps de coupe, puissance</h2>
  <div class="intro">Hors programme : l'analyse des procédés reste qualitative au concours. Ces relations servent en atelier et en TP ; un sujet qui en aurait besoin les fournirait.</div>

  <div class="def-box"><strong>Vitesse d'avance et temps de coupe.</strong> En tournage, l'outil avance de \(f\) à chaque tour, soit \(V_f = f\,N\) (mm/min). En fraisage, l'avance est donnée par dent : pour une fraise de \(Z\) dents, \(V_f = f_z\,Z\,N\). Une passe de longueur \(L\) dure :
    <div class="formula" data-nom="Temps de coupe">$$t_c = \frac{L}{V_f}$$</div>
  </div>
  <div class="method-box"><strong>Exemple — surfaçage d'une semelle</strong>
    <p>Fraise à surfacer \(\varnothing\) 50 mm à 4 dents, \(V_c = 180\) m/min, \(f_z = 0{,}1\) mm/dent, passe de 300 mm.</p>
    <ol>
      <li>\(N = \dfrac{1000 \times 180}{\pi \times 50} \approx 1\,146\) tr/min.</li>
      <li>\(V_f = 0{,}1 \times 4 \times 1\,146 \approx 458\) mm/min.</li>
      <li>\(t_c = 300/458 \approx 0{,}65\) min, soit environ 39 s.</li>
    </ol>
  </div>
  <p>La <strong>puissance de coupe</strong> (effort de coupe proportionnel à la section du copeau) et la <strong>rugosité théorique</strong> laissée par un outil à bec arrondi sont traitées, avec leurs ordres de grandeur, au §9 du chapitre <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>. Qualitativement : la puissance limite surtout l'ébauche (fortes profondeurs de passe) ; en finition, c'est l'état de surface qui commande, et il se dégrade très vite quand l'avance augmente.</p>
</div>

<template class="pan-tpl" data-panneau="usi-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · USINAGE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent le cours : choisir un procédé (§2), interpréter les réglages (§3), analyser la génération d'une surface (§4), choisir la machine (§5), la mise en position (§6) et le découpage en phases (§8).</div>

  <div class="method-box">
    <strong>Méthode 1 — Choisir le procédé selon la surface</strong>
    <ol style="margin-top:.4rem">
      <li>Surface de <strong>révolution</strong> (cylindre, cône, filetage) → <strong>tournage</strong>.</li>
      <li>Surface <strong>plane</strong>, rainure, contour, forme complexe → <strong>fraisage</strong>.</li>
      <li><strong>Trou</strong> → perçage (puis alésage si précision) ; <strong>finition fine</strong> → rectification.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Calculer la fréquence de rotation N</strong>
    <ol style="margin-top:.4rem">
      <li>Relever \(V_c\) (m/min) dans les conditions de coupe (couple matériau/outil).</li>
      <li>Convertir avec les bonnes unités : \(N = \dfrac{1000\,V_c}{\pi\,D}\) (D en mm, N en tr/min).</li>
      <li>En tournage, \(D\) = diamètre de la <em>pièce</em> ; en fraisage/perçage, \(D\) = diamètre de l'<em>outil</em>.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Au concours :</em> l'analyse reste qualitative ; ce calcul n'est pas exigible et l'énoncé fournirait la relation (cours, « Pour aller plus loin »).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Identifier le mode de génération d'une surface</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Mouvements.</span> Repérer le mouvement de coupe (ce qui tourne vite : la pièce au tour, l'outil en fraisage et en perçage) et le mouvement d'avance.</li>
      <li><span class="step">Lignes.</span> Décrire la surface par une génératrice et une directrice (droite et cercle pour un cylindre, deux droites pour un plan).</li>
      <li><span class="step">Origine.</span> Pour chacune, se demander si elle est matérialisée par l'arête de l'outil (travail de forme) ou décrite par un mouvement (travail d'enveloppe).</li>
      <li><span class="step">Conclure.</span> Forme : la précision dépend de l'outil et il faut un outil par forme. Enveloppe : elle dépend de la machine et de son réglage, un outil standard suffit.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> un logement de tête de vis réalisé à la fraise à lamer, avec une simple avance axiale, reproduit les arêtes de bout (fond plan) et de côté (paroi cylindrique) : travail de forme, le diamètre est celui de l'outil. Le même logement obtenu par une fraise plus petite qui décrit un cercle programmé est un travail d'enveloppe : son diamètre se règle dans le programme.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Choisir la cinématique de la machine</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Accès.</span> Pour chaque surface à usiner, noter la direction depuis laquelle l'outil doit l'atteindre : normale d'un plan, axe d'un trou ou d'un alésage.</li>
      <li><span class="step">Révolution ?</span> Toutes les surfaces de révolution autour d'un même axe → tour 2 axes ; s'y ajoutent quelques formes hors de l'axe (méplat, trou radial, rainure) → tour 3 axes (axe \(C\) et outils tournants).</li>
      <li><span class="step">Prismatique.</span> Une seule direction d'accès → centre 3 axes ; directions réparties autour d'un axe → 4 axes ; directions inclinées quelconques ou surfaces gauches → 5 axes.</li>
      <li><span class="step">Arbitrer.</span> Un axe de plus supprime des prises (meilleures positions relatives, moins de temps de remise en position) mais coûte plus cher : en petite série, deux prises sur un 3 axes peuvent suffire si aucune exigence serrée ne relie les faces.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> un corps de distributeur cubique est percé sur ses quatre faces latérales. Sur un centre 3 axes, il faut quatre prises ; sur un centre 4 axes à broche horizontale et plateau tournant \(B\), les quatre faces s'usinent en une seule prise, et la position relative des perçages ne dépend plus des remises en position.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Proposer une mise en position isostatique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Références.</span> Repérer sur le dessin les surfaces dont partent les cotes et les tolérances de l'opération ; ce sont les candidates aux appuis.</li>
      <li><span class="step">Disposition.</span> Pièce prismatique : 3-2-1 (appui plan, deux normales alignées, butée). Pièce de révolution : centrage long + butée, ou appui plan + centrage court ; une normale d'orientation en plus seulement si l'opération doit être orientée par rapport à une forme existante.</li>
      <li><span class="step">Dessiner.</span> Chaque normale est une flèche perpendiculaire à la surface, du côté extérieur, pointée vers la matière, numérotée ; écarter le plus possible les normales d'un même groupe.</li>
      <li><span class="step">Vérifier.</span> Chaque degré de liberté à supprimer l'est une seule fois (pas d'hyperstatisme) ; ceux qui restent libres sont sans effet sur l'opération.</li>
      <li><span class="step">Serrer.</span> Placer le serrage en face des appuis, dirigé vers eux.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> percer un trou au centre d'un flasque déjà tourné (\(\varnothing\) 120, épaisseur 15 mm) : appui plan sur la grande face (normales 1, 2, 3), centrage court sur le \(\varnothing\) 120 (4, 5). La rotation autour de l'axe reste libre, mais le trou est sur l'axe : cinq normales suffisent.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Justifier un découpage en phases</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Exigences.</span> Lister les surfaces à usiner, leurs tolérances et les relations serrées qui les lient (coaxialité, perpendicularité, localisation).</li>
      <li><span class="step">Regrouper.</span> Placer dans une même prise les surfaces liées par une relation serrée, et vérifier que la machine choisie les atteint toutes (méthode 4).</li>
      <li><span class="step">Ordonner.</span> Surfaces d'appui d'abord, ébauche avant finition, traitement thermique durcissant entre l'usinage à l'outil coupant et la rectification, contrôle à la fin.</li>
      <li><span class="step">Positionner.</span> Pour chaque prise, proposer la mise en position (méthode 5). Le détail des outils, des conditions de coupe et des cotes de fabrication n'est pas demandé.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> un arbre porte deux portées de roulement coaxiales et une rainure de clavette. Les deux portées sont tournées sur les mêmes centres, qui restent la référence commune même si l'on retourne l'arbre ; la rainure, qui ne demande qu'une position axiale et une symétrie modérée, est fraisée dans une autre phase (vé + butée) ou dans la même prise sur un tour 3 axes.</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Oublier le facteur <strong>1000</strong> (Vc en m/min, D en mm) → N faux d'un facteur 1000.</li>
      <li>Confondre tournage (la <em>pièce</em> tourne) et fraisage (l'<em>outil</em> tourne).</li>
      <li>Vouloir tout usiner : penser <strong>finition</strong> sur un brut proche de la forme.</li>
    </ul>
  </div>
  <div class="notice"><strong>Piège</strong> : ajouter des normales « par sécurité ». Deux normales qui suppriment le même degré de liberté rendent la mise en position hyperstatique : la pièce ne touche pas tous ses appuis, ou se déforme au serrage. À l'inverse, compter six normales d'office sur une pièce de révolution est inutile si la rotation autour de l'axe n'a aucun effet sur l'opération.</div>
  <div class="notice"><strong>Piège</strong> : attribuer au fraisage de profil un pur travail d'enveloppe. La hauteur du flanc reproduit l'arête latérale (travail de forme) : une fraise usée ou légèrement conique donne un flanc en dépouille, même si la trajectoire est parfaite.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Forme ou enveloppe ?</h3>
  <div class="statement">Pour chacune des opérations suivantes, préciser le mouvement de coupe, la génératrice et la directrice de la surface obtenue, le mode de génération (forme ou enveloppe) et ce dont dépend surtout la précision.</div>
  <div class="q"><strong>Q1.</strong> Dressage de la face d'extrémité d'un arbre au tour, avec un outil à pointe qui se déplace radialement.</div>
  <div class="q"><strong>Q2.</strong> Gorge pour anneau élastique, de largeur 1,1 mm, réalisée en plongée avec un outil de cette largeur.</div>
  <div class="q"><strong>Q3.</strong> Surfaçage de la face supérieure d'un carter avec une fraise à surfacer de \(\varnothing\) 80 mm, d'axe vertical.</div>
  <div class="q"><strong>Q4.</strong> Flanc vertical d'un épaulement usiné avec une fraise cylindrique d'axe vertical qui travaille par ses dents périphériques.</div>
  <div class="q"><strong>Q5.</strong> La face surfacée en Q3 présente un léger creux (« cuvette ») sur toute sa largeur. Quelle cause est la plus probable : une usure régulière des plaquettes, ou un défaut de perpendicularité entre la broche et la table ? Justifier.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Coupe : rotation de la pièce. Directrice : cercle décrit par le bec de l'outil pendant la rotation ; génératrice : droite radiale décrite par l'avance. Les deux lignes viennent des mouvements : <strong>travail d'enveloppe</strong>. La planéité de la face dépend de la machine : perpendicularité entre le déplacement radial du chariot et l'axe de la broche.</p>
    <p><strong>Q2.</strong> Coupe : rotation de la pièce. Génératrice : le profil de l'arête (un segment de 1,1 mm et ses deux angles), reproduit tel quel ; directrice : cercle donné par la rotation ; la plongée ne fixe que la profondeur. <strong>Travail de forme</strong> : la largeur de la gorge est celle de l'outil (sa tolérance est portée par l'outil), le diamètre du fond dépend du réglage de la course radiale.</p>
    <p><strong>Q3.</strong> Coupe : rotation de la fraise. Génératrice : cercle décrit par les dents de bout ; directrice : droite parcourue par l'avance de la table. <strong>Travail d'enveloppe</strong> : la planéité dépend de la machine (perpendicularité broche/table, rectitude des glissières), pas du profil des plaquettes.</p>
    <p><strong>Q4.</strong> Coupe : rotation de la fraise. Génératrice : arête périphérique, droite parallèle à l'axe (<strong>forme</strong> : la rectitude du flanc et son angle avec la face inférieure dépendent de l'outil, de son usure, de sa flexion et de la verticalité de la broche) ; directrice : trajectoire de l'axe (<strong>enveloppe</strong> : la forme du contour vu de dessus dépend des déplacements de la machine et du rayon d'outil pris en compte).</p>
    <p><strong>Q5.</strong> Le défaut de perpendicularité. Une usure régulière des plaquettes déplace toutes les dents de la même quantité : le plan est un peu plus haut, mais reste plan (et la cote se corrige au réglage). Si la broche est inclinée par rapport à la table, le cercle des dents de bout n'est plus parallèle au plan d'avance : les dents descendent plus bas d'un côté de leur trajectoire, et la surface engendrée, enveloppe de ces cercles inclinés, devient légèrement creuse. C'est un défaut typique du travail d'enveloppe : il vient de la machine.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Quelle machine à commande numérique ?</h3>
  <div class="statement">Pour chaque pièce, proposer la machine à commande numérique la plus simple qui permette d'usiner en une seule prise toutes les surfaces citées, et dire ce qu'apporte l'axe éventuellement ajouté.</div>
  <div class="q"><strong>Q1.</strong> Axe de galet : cylindres étagés, gorge d'anneau élastique, chanfreins, filetage en bout.</div>
  <div class="q"><strong>Q2.</strong> Le même axe avec, en plus, un méplat et un trou radial de goupille.</div>
  <div class="q"><strong>Q3.</strong> Plaque de fixation : contour extérieur, poche, six trous taraudés, toutes ces formes étant accessibles par la grande face supérieure.</div>
  <div class="q"><strong>Q4.</strong> Corps de pompe prismatique : alésages et taraudages sur ses quatre faces latérales.</div>
  <div class="q"><strong>Q5.</strong> Roue de compresseur centrifuge, dont les aubes ont des surfaces gauches.</div>
  <div class="q"><strong>Q6.</strong> Pour la pièce de Q4, montrer que la machine choisie améliore la position relative des alésages des différentes faces, et pas seulement le temps de fabrication.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Toutes les surfaces sont de révolution autour du même axe : <strong>tour 2 axes</strong> (\(X\) radial, \(Z\) axial ; le filetage est un mouvement \(Z\) synchronisé avec la rotation de la broche).</p>
    <p><strong>Q2.</strong> Le méplat et le trou radial ne sont pas de révolution : <strong>tour 3 axes</strong>. L'axe \(C\) arrête et oriente la broche à l'angle voulu, et des outils tournants montés sur la tourelle fraisent le méplat et percent le trou sans démonter la pièce ; le trou se trouve ainsi bien orienté par rapport au méplat.</p>
    <p><strong>Q3.</strong> Une seule direction d'accès (perpendiculaire à la grande face) : <strong>centre d'usinage 3 axes</strong>.</p>
    <p><strong>Q4.</strong> Quatre directions d'accès réparties autour d'un axe vertical : <strong>centre 4 axes</strong>, par exemple à broche horizontale avec un plateau tournant \(B\). La table tourne de 90° entre deux faces.</p>
    <p><strong>Q5.</strong> L'axe de l'outil doit s'incliner continûment pour suivre les surfaces gauches et passer entre les aubes : <strong>centre 5 axes</strong> en usinage continu (deux rotations s'ajoutent à \(X\), \(Y\), \(Z\)).</p>
    <p><strong>Q6.</strong> Sur un centre 3 axes, il faudrait une prise par face : à chaque démontage, la nouvelle mise en position ajoute son erreur (appuis, serrage) à la position de l'alésage suivant par rapport aux précédents. En 4 axes, les quatre faces sont usinées sans démontage, dans le même repère pièce : seules comptent l'exactitude de la rotation du plateau et celle des axes linéaires, bien meilleures qu'une remise en position. Le gain de temps (pas de démontage ni de réglage) s'y ajoute.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Reprise d'un moyeu par tournage</h3>
  <div class="exo-source">
    Exercice <strong>original</strong>, calibré sur le format des épreuves PT (industrialisation / conditions de coupe). Les calculs de A2 et B1 dépassent l'approche qualitative du programme : ils sont là pour aller plus loin. Pour t'entraîner sur les sujets réels :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un <strong>moyeu</strong> brut de fonderie en fonte est repris au tour. On usine son diamètre extérieur de \(\varnothing 80\) mm puis on tourne une portée de roulement à \(\varnothing 50\) mm. Conditions de coupe : \(V_c = 90\) m/min (fonte), avance \(f = 0{,}25\) mm/tr.
  </div>

  <p class="exo-part">Partie A — Procédé &amp; réglages</p>
  <div class="q"><strong>A1.</strong> Pourquoi le tournage est-il le procédé adapté ici ? Qu'a-t-on dû prévoir sur le brut ?</div>
  <div class="q"><strong>A2.</strong> Calculer la fréquence de rotation \(N_1\) pour usiner le \(\varnothing 80\), puis \(N_2\) pour le \(\varnothing 50\). Commenter.</div>

  <p class="exo-part">Partie B — Temps d'usinage</p>
  <div class="q"><strong>B1.</strong> La portée de \(\varnothing 50\) a une longueur \(L = 35\) mm. Calculer le temps d'une passe (à \(N_2\)).</div>
  <div class="q"><strong>B2.</strong> Pour gagner du temps sans dégrader l'état de surface, vaut-il mieux augmenter l'avance \(f\) ou la vitesse de coupe \(V_c\) ? Justifier qualitativement.</div>

  <p class="exo-part">Partie C — Place dans la gamme</p>
  <div class="q"><strong>C1.</strong> Situer cette opération de tournage dans la gamme de fabrication complète du moyeu (du brut à la pièce finie).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Les surfaces à usiner (diamètre extérieur, portée de roulement) sont des <strong>surfaces de révolution</strong> → tournage. Sur le brut, on a prévu une <strong>surépaisseur d'usinage</strong> sur ces portées (matière en excès à enlever).</p>
    <p><strong>A2.</strong> \(N = \dfrac{1000\,V_c}{\pi D}\). Pour \(\varnothing 80\) : \(N_1 = \dfrac{1000 \times 90}{\pi \times 80} \approx 358\) tr/min. Pour \(\varnothing 50\) : \(N_2 = \dfrac{1000 \times 90}{\pi \times 50} \approx 573\) tr/min. À \(V_c\) constante, plus le diamètre est petit, plus \(N\) doit être grand (l'arête « voit » moins de circonférence par tour).</p>
    <p><strong>B1.</strong> Avance par minute : \(f\,N_2 = 0{,}25 \times 573 \approx 143\) mm/min. Temps : \(t = \dfrac{L}{f\,N_2} = \dfrac{35}{143} \approx 0{,}24\) min \(\approx 15\) s.</p>
    <p><strong>B2.</strong> L'<strong>avance \(f\)</strong> dégrade l'état de surface (sillons plus marqués), alors qu'augmenter \(V_c\) améliore plutôt l'état de surface mais accélère l'usure de l'outil. Pour gagner du temps <em>sans</em> dégrader l'état de surface, on augmente plutôt \(V_c\) (dans la limite de tenue de l'outil) ; pour la finition, on garde une avance faible.</p>
    <p><strong>C1.</strong> Gamme typique : <strong>moulage</strong> du brut (avec surépaisseurs et noyau éventuel) → <strong>ébarbage/parachèvement</strong> → <strong>tournage</strong> des portées (ébauche puis finition) → contrôle. L'usinage est l'étape de <strong>finition</strong> qui donne aux portées leurs cotes et états de surface fonctionnels.</p>
  </div>
</div>

    <ul>
      <li>face \(A\) : plane, référence principale ;</li>
      <li>face \(C\) : perpendiculaire à \(A\), elle sert de butée sur le bâti ;</li>

      <li>deux trous de fixation \(\varnothing\) 9 qui traversent la semelle, perpendiculaires à \(A\), positionnés par rapport à \(C\).</li>
    </ul>
  </div>

  <p class="exo-part">Partie A — Génération des surfaces</p>
  <div class="q"><strong>A1.</strong> La rainure peut être réalisée (a) en une passe avec une fraise disque « trois tailles » d'épaisseur 20 mm, dont l'axe est parallèle à \(y\) ; (b) avec une fraise cylindrique \(\varnothing\) 16 mm d'axe parallèle à \(z\), qui suit une trajectoire le long de chaque flanc. Pour chaque solution, dire comment la largeur de la rainure est engendrée (forme ou enveloppe) et ce qui garantit la tolérance 20 H9.</div>
  <div class="q"><strong>A2.</strong> L'alésage \(\varnothing\) 16 H7 est d'abord percé, puis fini à l'alésoir. Pourquoi un perçage seul ne suffit-il pas ? Quel est le mode de génération du diamètre final ?</div>

  <p class="exo-part">Partie B — Choix de la machine</p>
  <div class="q"><strong>B1.</strong> Donner la direction d'accès de l'outil pour la rainure, l'alésage et les trous \(\varnothing\) 9. Un centre d'usinage 3 axes à broche verticale peut-il les réaliser en une seule prise, pièce posée sur \(A\) ?</div>
  <div class="q"><strong>B2.</strong> Quelle machine permet de tout réaliser en une seule prise ? Préciser l'axe ajouté et son rôle.</div>

  <p class="exo-part">Partie C — Mise en position de la prise principale</p>
  <div class="q"><strong>C1.</strong> Les faces \(A\) et \(C\) ont été usinées dans une phase précédente. Proposer une mise en position isostatique pour la prise qui réalise la rainure, l'alésage et les trous : donner les surfaces d'appui et le nombre de normales sur chacune, en le justifiant par la cotation.</div>
  <div class="q"><strong>C2.</strong> Un camarade propose quatre normales sur \(A\) et deux sur \(C\). Critiquer cette proposition.</div>
  <div class="q"><strong>C3.</strong> Où et dans quelle direction placer le serrage ?</div>

  <p class="exo-part">Partie D — Choix des phases</p>
  <div class="q"><strong>D1.</strong> Proposer et justifier un découpage en phases, du brut moulé au contrôle (on ne demande ni outils ni conditions de coupe).</div>
  <div class="q"><strong>D2.</strong> L'atelier ne dispose que de centres 3 axes. Que faut-il changer, et quelles précautions prendre pour respecter la position de l'alésage ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> (a) Les flancs sont engendrés par les dents latérales de la fraise disque, qui tournent dans deux plans parallèles distants de son épaisseur : la largeur de la rainure est celle de l'outil, c'est un <strong>travail de forme</strong>. La tolérance 20 H9 est garantie par l'épaisseur de la fraise (et son faible voile). (b) Chaque flanc est engendré par l'arête périphérique (forme selon \(z\)) qui suit une trajectoire programmée : la largeur résulte de l'écart entre les deux trajectoires et du rayon réel de l'outil, c'est un <strong>travail d'enveloppe</strong>. La tolérance dépend de la machine et du réglage du rayon d'outil ; un même outil sert pour toute largeur.</p>
    <p><strong>A2.</strong> Un foret donne un trou de qualité médiocre (diamètre et forme peu précis, de l'ordre de IT 11) : insuffisant pour un H7. L'alésoir, qui enlève une faible surépaisseur, reproduit son propre diamètre : le diamètre final est obtenu par <strong>travail de forme</strong>, ce qui convient bien à un lot (outil simple, résultat répétable).</p>
    <p><strong>B1.</strong> Rainure : par le dessus (fraise d'axe \(z\)) ou selon \(y\) (fraise disque). Trous \(\varnothing\) 9 : selon \(z\). Alésage : selon \(y\), direction parallèle à \(A\). Un centre 3 axes à broche verticale, pièce posée sur \(A\), présente l'outil selon \(z\) seulement : il réalise la rainure (solution b) et les trous, <strong>pas l'alésage</strong>. Il faut une seconde prise.</p>
    <p><strong>B2.</strong> Un <strong>centre 4 axes</strong> à broche verticale avec un axe rotatif \(A\) d'axe parallèle à \(x\) (diviseur) : après la rainure et les trous, une rotation de 90° autour de \(x\) amène l'axe de l'alésage selon la broche. (Autre solution : broche horizontale selon \(y\) et plateau tournant, mais les trous verticaux ne seraient plus accessibles.)</p>
    <p><strong>C1.</strong> Appui plan sur \(A\) (normales 1, 2, 3, écartées au maximum) : \(A\) est la référence de la position de l'alésage et de la perpendicularité des flancs. Deux normales (4, 5) sur \(C\), éloignées l'une de l'autre selon \(y\) : \(C\) positionne les trous et oriente la pièce autour de \(z\) (les flancs doivent être perpendiculaires à \(C\)). Une butée (6) sur une face latérale brute de la semelle, normale selon \(y\) : elle fixe la position transversale de la rainure, ce qui règle l'épaisseur des oreilles. Six degrés de liberté supprimés, chacun une fois : mise en position isostatique.</p>
    <p><strong>C2.</strong> Quatre normales sur un plan : l'une est en trop (un plan ne supprime que trois degrés de liberté), la pièce ne repose que sur trois d'entre elles ou se déforme au serrage : <strong>hyperstatisme</strong>. Et la translation selon \(y\) n'est supprimée par aucune normale : la position transversale de la rainure et de l'alésage varie d'une pièce à l'autre.</p>
    <p><strong>C3.</strong> En face des appuis et dirigé vers eux : un effort principal selon \(-z\), au droit des normales 1, 2, 3, sur le dessus de la semelle (hors des zones usinées), et un effort secondaire qui plaque la pièce contre \(C\), sans faire fléchir les oreilles.</p>
    <p><strong>D1.</strong> Phase 10 : contrôle du brut moulé (surépaisseurs présentes). Phase 20 (centre 3 axes), prise sur surfaces brutes : surfacer \(A\) (fraisage en bout) et fraiser \(C\) (fraisage de profil) ; ces faces deviennent les références des phases suivantes. Phase 30 (centre 4 axes), mise en position de C1 : rainure (ébauche puis finition), perçage des trous \(\varnothing\) 9, rotation de 90°, perçage puis alésage \(\varnothing\) 16. Rainure et alésage sont dans la même prise car l'axe de l'alésage doit être perpendiculaire aux flancs, et sa position par rapport à \(A\) est obtenue sans reprise. Phase 40 : contrôle (largeur de rainure, diamètre et position de l'alésage).</p>
    <p><strong>D2.</strong> L'alésage passe dans une prise supplémentaire, pièce tournée pour que son axe soit vertical. Chaque reprise ajoute une erreur de remise en position : pour la limiter, on s'appuie sur les surfaces dont part la spécification, par exemple un appui plan sur un flanc de la rainure déjà fini, grâce à un tenon du montage logé dans la rainure (perpendicularité de l'axe aux flancs), deux normales sur \(A\) (position par rapport à \(A\), tolérance 0,05 mm) et une butée sur \(C\). La cote est alors obtenue directement, sans transfert.</p>
