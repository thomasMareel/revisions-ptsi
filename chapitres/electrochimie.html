  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties 6.2 à 6.4 du programme de PT : la cinétique des réactions d'oxydoréduction lue sur les courbes courant-potentiel, leur exploitation pour les piles, les électrolyseurs et les accumulateurs, puis la corrosion. La thermodynamique de l'oxydoréduction (partie 6.1) et le bilan énergétique d'une pile sont traités dans « Thermodynamique de la transformation chimique ». Le programme privilégie les raisonnements qualitatifs et l'expérience.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Montage à trois électrodes</strong> ; relier vitesse de réaction électrochimique et intensité (§1).</li>
        <li><strong>Courbes courant-potentiel</strong> : surpotentiel, systèmes rapides et lents, influence de la nature de l'électrode (§2).</li>
        <li><strong>Courant limite de diffusion</strong> : espèces électroactives limitées par la diffusion ; relier le courant limite à la concentration et à la surface de l'électrode (§3).</li>
        <li><strong>Vagues successives, domaine d'inertie du solvant</strong> ; tracer l'allure de courbes à partir de potentiels standard, de concentrations et de surpotentiels (§4).</li>
        <li><strong>Piles</strong> : inégalité entre variation d'enthalpie libre et travail électrique ; tension à vide ; capacité ; fonctionnement et caractéristique à partir des courbes ; résistance interne (§5).</li>
        <li><strong>Électrolyse et recharge</strong> : tension minimale à imposer, contraintes de la recharge d'un accumulateur, masse de produit formé, rendement faradique, bilans de matière et électriques (§6).</li>
        <li><strong>Corrosion</strong> uniforme (milieu acide ou neutre oxygéné) et de deux métaux en contact : potentiel et courant de corrosion, facteurs favorisants (§7, §8).</li>
        <li><strong>Protection</strong> par revêtement, anode sacrificielle, courant imposé ; <strong>passivation</strong> (§9).</li>
      </ul>

<div class="course-section">
  <div class="sec-num">§1 · VITESSE DE RÉACTION ET COURANT</div>
  <h2>Mesurer une vitesse de réaction avec un ampèremètre</h2>
  <div class="intro">Une réaction d'oxydoréduction peut se dérouler à la surface d'une électrode : les électrons échangés passent alors par le circuit extérieur. L'intensité du courant mesure directement la vitesse de la réaction ; la thermodynamique dit si la réaction est possible, les courbes courant-potentiel disent à quelle vitesse.</div>
  <div class="def-box">
    <strong>Électrode, anode, cathode.</strong> Une électrode est un conducteur électronique en contact avec un électrolyte. L'<strong>anode</strong> est le siège d'une oxydation, la <strong>cathode</strong> celui d'une réduction (quel que soit le signe de leur potentiel). Convention : l'intensité \(i\) traversant une électrode est comptée <strong>positivement pour une oxydation</strong> (courant anodique) et négativement pour une réduction (courant cathodique).
  </div>
  <div class="prop-box">
    <strong>Vitesse et intensité.</strong> Pour une demi-équation \(\text{Ox} + n\,e^- = \text{Red}\) se déroulant à la vitesse \(v = \mathrm{d}\xi/\mathrm{d}t\) (en mol·s⁻¹) sur une électrode, la charge échangée pendant \(\mathrm{d}t\) vaut \(nF\,\mathrm{d}\xi\), d'où
    <div class="formula" data-nom="Intensité et vitesse de réaction">$$|i|=n\,F\,v\qquad F=\mathcal N_A\,e\approx96\,500\ \text{C·mol}^{-1}$$</div>
    Le courant est proportionnel à la surface de l'électrode : on raisonne souvent sur la densité de courant \(j = i/S\).
  </div>
  <h3>Le montage à trois électrodes</h3>
  <p>Pour tracer la courbe \(i = f(E)\) d'une électrode, on la place dans la solution étudiée avec deux autres électrodes, reliées à un potentiostat :</p>
  <ul>
    <li>l'<strong>électrode de travail</strong>, celle que l'on étudie (platine, fer, zinc…), dont on impose le potentiel \(E\) ;</li>
    <li>l'<strong>électrode de référence</strong> (au calomel saturé, au chlorure d'argent), parcourue par un courant quasi nul, dont le potentiel est connu et fixe : on mesure la tension entre elle et l'électrode de travail ;</li>
    <li>la <strong>contre-électrode</strong> (souvent en platine), qui ferme le circuit : c'est elle qui débite le courant \(i\), mesuré par l'ampèremètre.</li>
  </ul>
  <p>Séparer la mesure du potentiel (référence, sans courant) de la circulation du courant (contre-électrode) évite que la chute de tension dans la solution et les surpotentiels de la contre-électrode ne faussent la mesure.</p>
</div>

<div class="course-section">
  <div class="sec-num">§2 · COURBES COURANT-POTENTIEL</div>
  <h2>Surpotentiel, systèmes rapides et systèmes lents</h2>
  <div class="def-box">
    <strong>Potentiel d'équilibre et surpotentiel.</strong> À courant nul, une électrode plongeant dans une solution contenant les deux membres d'un couple prend le potentiel d'équilibre \(E_{\text{éq}}\) donné par la formule de Nernst. Pour faire circuler un courant, on écarte son potentiel de cette valeur ; l'écart \(\eta = E - E_{\text{éq}}\) est le <strong>surpotentiel</strong> (positif pour une oxydation, négatif pour une réduction).
  </div>

<figcaption>Courbes courant-potentiel modélisées (même couple, même potentiel d'équilibre, électrode tournante). Système rapide (bleu) : le courant devient notable dès qu'on s'écarte du potentiel d'équilibre. Système lent (rouge) : il faut un surpotentiel de plusieurs centaines de millivolts pour obtenir un courant notable. Aux grands surpotentiels, le courant est limité par la diffusion des espèces (paliers).</figcaption>
</figure>
  <div class="prop-box">
    <strong>Systèmes rapides et lents.</strong>
    <ul>
      <li><strong>Système rapide</strong> : un courant notable circule dès que \(E\) s'écarte de \(E_{\text{éq}}\) ; la courbe est raide au voisinage de \(E_{\text{éq}}\). Exemple : Fe³⁺/Fe²⁺, Ag⁺/Ag sur platine.</li>
      <li><strong>Système lent</strong> : il faut un surpotentiel de seuil (anodique \(\eta_a\) ou cathodique \(\eta_c\)), de plusieurs centaines de millivolts, avant qu'un courant notable ne circule. Exemple : réduction de H⁺ en H₂ sur zinc ou sur plomb, oxydation de l'eau en O₂ sur platine.</li>
    </ul>
    La rapidité dépend du couple <strong>et de la nature de l'électrode</strong> : le dégagement de dihydrogène est rapide sur platine (surpotentiel de quelques dizaines de mV), très lent sur zinc, plomb ou mercure (surpotentiels de 0,7 à 1 V).
  </div>
  <div class="notice"><strong>Thermodynamique et cinétique.</strong> Une réaction thermodynamiquement favorable peut être pratiquement bloquée si les systèmes mis en jeu sont lents : le zinc devrait réduire les ions H⁺ d'une solution acide, mais un zinc très pur s'y dissout à peine. C'est précisément ce que les courbes courant-potentiel permettent de prévoir, et que les diagrammes potentiel-pH (purement thermodynamiques) ne disent pas.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · COURANT LIMITE DE DIFFUSION</div>
  <h2>Quand l'électrode réagit plus vite que les espèces n'arrivent</h2>
  <div class="intro">Aux grands surpotentiels, la réaction à l'électrode devient si rapide que c'est l'apport des espèces électroactives depuis la solution qui limite la vitesse : le courant atteint un palier.</div>
  <div class="prop-box">
    <strong>Courant limite de diffusion.</strong> Les espèces consommées à l'électrode sont renouvelées par diffusion à travers une couche mince de solution (d'épaisseur \(\delta\), de l'ordre de 10 à 100 µm, d'autant plus fine que l'agitation est forte). Le courant limite est proportionnel à la <strong>concentration</strong> de l'espèce dans la solution et à la <strong>surface</strong> immergée de l'électrode :
    <div class="formula" data-nom="Courant limite de diffusion">$$i_{\lim}=n\,F\,S\,\frac{D\,c}{\delta}\ \propto\ S\,c$$</div>
    (expression donnée à titre indicatif : seule la proportionnalité à \(S\) et \(c\) est exigible).
  </div>
  <ul>
    <li>Une espèce minoritaire en solution (ions Fe²⁺ à 0,01 mol·L⁻¹) donne un palier de diffusion.</li>
    <li>Le <strong>solvant</strong> (l'eau) et le métal de l'électrode elle-même ne sont jamais limités : leur courbe ne présente pas de palier.</li>
    <li>Si une espèce n'est pas présente en solution, la branche correspondante n'existe pas : sans Fe³⁺, pas de réduction de Fe³⁺.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — doser par le courant limite</strong>
    <p>Avec une électrode tournante de surface fixée et une agitation constante, on mesure \(i_{\lim} = 0{,}42\ \text{mA}\) pour une solution de Fe²⁺ à \(2{,}0\times10^{-3}\ \text{mol·L}^{-1}\), puis \(0{,}63\ \text{mA}\) pour une solution inconnue.</p>
    <p>Le courant limite étant proportionnel à la concentration : \(c = 2{,}0\times10^{-3}\times\dfrac{0{,}63}{0{,}42} = 3{,}0\times10^{-3}\ \text{mol·L}^{-1}\). C'est le principe des capteurs ampérométriques (sonde à dioxygène dissous, glucomètre).</p>
  </div>
</div>

<figcaption>Solution acide contenant Fe²⁺ et Fe³⁺, électrode de platine (courbe modélisée). Le couple Fe³⁺/Fe²⁺, rapide, donne une vague d'oxydation et une vague de réduction limitées par la diffusion. Au-delà, le courant n'est plus limité : c'est l'eau, solvant toujours disponible, qui est oxydée en dioxygène ou réduite en dihydrogène (« murs du solvant »). Entre les deux murs, le domaine d'inertie électrochimique (vert).</figcaption>

  <div class="prop-box">
    <strong>Vagues successives.</strong> Si plusieurs espèces électroactives sont présentes, leurs courants s'ajoutent : à potentiel croissant, chaque couple donne sa vague d'oxydation, en commençant par le réducteur le plus facile à oxyder (potentiel d'équilibre le plus bas, surpotentiel compris). Chaque vague s'ajoute au palier de la précédente.
  </div>
  <div class="def-box">
    <strong>Domaine d'inertie électrochimique du solvant.</strong> L'eau est à la fois réductrice (couple O₂/H₂O, \(E^\circ = 1{,}23\ \text{V}\)) et oxydante (couple H⁺/H₂, \(E^\circ = 0\ \text{V}\)). Aux potentiels élevés, elle est oxydée en dioxygène ; aux bas potentiels, réduite en dihydrogène : ce sont les « murs du solvant », sans palier. Entre les deux, aucune réaction du solvant : c'est le domaine d'inertie, élargi par les surpotentiels (sur platine, environ de −0,1 V à 1,7 V à pH 0, au lieu de 0 à 1,23 V).
  </div>
  <div class="method-box">
    <strong>Méthode — tracer l'allure d'une courbe courant-potentiel</strong>
    <ol>
      <li>Lister les espèces présentes (y compris le solvant et le métal de l'électrode) et les réactions possibles à l'anode et à la cathode.</li>
      <li>Calculer chaque potentiel d'équilibre (Nernst) et placer le début de chaque vague, décalé du surpotentiel de seuil pour les systèmes lents.</li>
      <li>Ajouter un palier de diffusion pour chaque espèce dissoute, de hauteur proportionnelle à sa concentration ; pas de palier pour le solvant ni pour le métal de l'électrode.</li>
      <li>Additionner les courants des couples à chaque potentiel.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PILES</div>
  <h2>Conversion d'énergie chimique en énergie électrique</h2>
  <div class="intro">Une pile est le siège d'une réaction d'oxydoréduction spontanée dont les deux demi-réactions sont séparées : l'oxydation à l'anode (pôle −), la réduction à la cathode (pôle +), les électrons passant par le circuit extérieur.</div>
  <div class="prop-box">
    <strong>Bilan énergétique</strong> (établi dans « Thermodynamique de la transformation chimique ») : à \(T\) et \(p\) fixées, le travail électrique fourni par la pile est au plus égal à la diminution d'enthalpie libre, \(W_{\text{élec}} \ge \Delta G\) (travail reçu algébrique), soit pour un avancement \(\mathrm{d}\xi\) : \(-e\,nF\,\mathrm{d}\xi \ge \Delta_rG\,\mathrm{d}\xi\). À courant nul (réversibilité), la <strong>tension à vide</strong> vérifie
    <div class="formula" data-nom="Tension à vide d'une pile">$$e_0=-\frac{\Delta_rG}{nF}=E_+-E_-$$</div>
    et la <strong>capacité</strong>, charge totale débitable, vaut \(Q = nF\,\xi_{\max}\) (souvent exprimée en A·h : 1 A·h = 3 600 C).
  </div>
  <h3>Fonctionnement lu sur les courbes</h3>
  <div class="prop-box">
    Quand la pile débite \(I\), la même intensité traverse les deux électrodes : \(I\) à l'anode (oxydation) et \(-I\) à la cathode (réduction). Les courbes donnent les potentiels \(E_+(I)\) et \(E_-(I)\), et la tension aux bornes vaut
    <div class="formula" data-nom="Tension d'une pile en fonctionnement">$$U(I)=E_+(-I)-E_-(I)-R_{\text{int}}\,I\ \lt\ e_0$$</div>
    La tension baisse quand l'intensité augmente : surpotentiels, chute ohmique dans l'électrolyte et le pont salin, et limitation par la diffusion (courant maximal). La <strong>résistance interne</strong> dépend de la conductivité de l'électrolyte (nature et concentration des ions), de la distance entre les électrodes, de leur surface et de la température.
  </div>
  <div class="method-box">
    <strong>Exemple — pile Daniell</strong>
    <p>Zn | Zn²⁺ (1 mol·L⁻¹) ‖ Cu²⁺ (1 mol·L⁻¹) | Cu ; \(E^\circ(\text{Cu}^{2+}/\text{Cu}) = 0{,}34\ \text{V}\), \(E^\circ(\text{Zn}^{2+}/\text{Zn}) = -0{,}76\ \text{V}\).</p>
    <ol>
      <li>Tension à vide : \(e_0 = 0{,}34 - (-0{,}76) = 1{,}10\ \text{V}\), soit \(\Delta_rG = -2Fe_0 \approx -212\ \text{kJ·mol}^{-1}\) pour Zn + Cu²⁺ → Zn²⁺ + Cu.</li>
      <li>Les deux couples sont rapides sur leur métal : la tension reste proche de \(e_0\) à faible courant ; elle chute surtout à cause de la résistance interne (pont salin) et, à fort courant, du palier de diffusion de Cu²⁺.</li>
      <li>Capacité avec 0,10 mol d'ions Cu²⁺ (réactif limitant) : \(Q = 2\times0{,}10\times96\,500 \approx 1{,}9\times10^{4}\ \text{C} \approx 5{,}4\ \text{A·h}\).</li>
    </ol>
  </div>
</div>

<figcaption>Électrolyse de l'eau en milieu acide (courbes modélisées). Pour faire circuler le courant I, l'anode doit être portée au potentiel E_a et la cathode au potentiel E_c : la tension à imposer, E_a − E_c augmentée de la chute ohmique R I, dépasse largement l'écart thermodynamique de 1,23 V, à cause des surpotentiels, surtout celui du dioxygène.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Tension à imposer.</strong> Pour faire circuler l'intensité \(I\), il faut porter l'anode au potentiel \(E_a(I)\) (oxydation) et la cathode au potentiel \(E_c(-I)\) (réduction) :
    <div class="formula" data-nom="Tension d'électrolyse">$$U = E_a(I) - E_c(-I) + R\,I\ \ \gt\ \ U_{\min}=E_{a,\text{éq}}-E_{c,\text{éq}}+\eta_a-\eta_c$$</div>
    La tension minimale vaut l'écart thermodynamique (calculé par Nernst) augmenté des surpotentiels de seuil. Pour l'électrolyse de l'eau en milieu acide : 1,23 V en théorie, environ 1,8 à 2 V en pratique.
  </div>
  <div class="prop-box">
    <strong>Quelle réaction se produit ?</strong> À l'anode, parmi les oxydations possibles, celle qui démarre au potentiel le plus bas sur la courbe (surpotentiel compris) ; à la cathode, la réduction qui démarre au potentiel le plus haut. Les surpotentiels peuvent inverser la prévision thermodynamique : c'est ce qui permet de déposer du zinc en milieu acide (le dégagement de H₂ est très lent sur zinc), ou de recharger un accumulateur au plomb sans électrolyser l'eau.
  </div>
  <div class="prop-box">
    <strong>Masse de produit et rendement faradique.</strong> Pendant une durée \(\Delta t\) à intensité constante, la charge \(I\Delta t\) correspond à \(I\Delta t/(nF)\) mol d'électrons échangés pour la demi-réaction considérée :
    <div class="formula" data-nom="Masse formée par électrolyse">$$m_{\text{théo}}=\frac{M\,I\,\Delta t}{n\,F}\qquad\rho_F=\frac{m_{\text{réelle}}}{m_{\text{théo}}}$$</div>
    Le rendement faradique \(\rho_F \lt 1\) traduit les réactions parasites (dégagement de H₂ à la cathode, par exemple) et les pertes.
  </div>
  <div class="method-box">
    <strong>Exemple — électrolyse industrielle du zinc</strong>
    <p>Une cellule d'électrolyse d'une solution acide de sulfate de zinc fonctionne sous \(I = 500\ \text{A}\) pendant 24 h ; on recueille 13,5 kg de zinc à la cathode (\(M = 65{,}4\ \text{g·mol}^{-1}\)).</p>
    <ol>
      <li>Masse théorique : \(\dfrac{65{,}4\times500\times86\,400}{2\times96\,500} \approx 1{,}46\times10^{4}\ \text{g} = 14{,}6\ \text{kg}\).</li>
      <li>Rendement faradique : \(13{,}5/14{,}6 \approx 0{,}92\) : 8 % de la charge sert à réduire H⁺ en H₂, réaction thermodynamiquement plus facile mais lente sur zinc.</li>
      <li>Avec une tension de 3,3 V, l'énergie consommée est \(3{,}3\times500\times86\,400 \approx 1{,}4\times10^{8}\ \text{J}\), soit environ 3 kWh par kilogramme de zinc.</li>
      <li>La solution doit être purifiée : des traces d'ions plus nobles (Cu²⁺, Ni²⁺, Co²⁺) se réduiraient avant le zinc et, déposées, abaisseraient le surpotentiel de H₂, effondrant le rendement.</li>
    </ol>
  </div>
  <h3>Recharge d'un accumulateur</h3>
  <p>Un accumulateur est une pile dont la réaction peut être inversée par une électrolyse. Dans l'accumulateur au plomb, la recharge régénère Pb et PbO₂ à partir de PbSO₄ ; elle n'est possible que parce que la réduction de l'eau sur le plomb et son oxydation sur PbO₂ sont très lentes. Les courbes courant-potentiel justifient les contraintes de la recharge : choix des électrodes (fort surpotentiel pour le solvant), solution purifiée, tension de charge limitée pour éviter l'électrolyse de l'eau (dégagement gazeux, perte d'électrolyte).</p>
</div>

  <h2>Un métal qui s'oxyde dans son milieu</h2>
  <div class="intro">La corrosion humide est l'oxydation d'un métal au contact d'une solution. Le métal joue à la fois le rôle d'anode (il s'oxyde) et de cathode (un oxydant de la solution s'y réduit) : c'est une pile en court-circuit. Elle coûte de l'ordre de 3 % du produit intérieur brut des pays industrialisés.</div>

<figcaption>Zinc dans une solution acide (courbes modélisées). Branche anodique : oxydation du zinc (rapide). Branche cathodique : réduction des ions H⁺ sur le zinc, système très lent. Le métal prend le potentiel de corrosion E_corr où les courants anodique et cathodique se compensent (le symétrique de la branche cathodique, en tirets, coupe la branche anodique) ; i_corr mesure la vitesse de corrosion.</figcaption>
</figure>
  <div class="def-box">
    <strong>Potentiel et courant de corrosion.</strong> Le métal, isolé, ne débite aucun courant extérieur : le courant d'oxydation du métal compense exactement le courant de réduction de l'oxydant, \(i_a = -i_c\). Le potentiel pris par le métal est le <strong>potentiel de corrosion</strong> \(E_{\text{corr}}\) ; le courant anodique commun est le <strong>courant de corrosion</strong> \(i_{\text{corr}}\), qui mesure la vitesse d'oxydation du métal.
  </div>
  <ul>
    <li><strong>Milieu acide</strong> : l'oxydant est H⁺, réduit en H₂ sur le métal ; la vitesse dépend fortement du surpotentiel de H₂ sur ce métal (faible sur fer, fort sur zinc pur).</li>
    <li><strong>Milieu neutre oxygéné</strong> (eau de mer, humidité) : l'oxydant est le dioxygène dissous, peu concentré ; sa réduction est souvent limitée par la diffusion : \(i_{\text{corr}}\) est alors le courant limite de O₂, et la corrosion est d'autant plus rapide que l'eau est aérée et agitée.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — vitesse de corrosion d'une tôle d'acier</strong>
    <p>Une densité de courant de corrosion \(j_{\text{corr}} = 10\ \text{µA·cm}^{-2}\) (fer, Fe → Fe²⁺ + 2 e⁻, \(M = 55{,}8\ \text{g·mol}^{-1}\), \(\rho = 7{,}9\ \text{g·cm}^{-3}\)) correspond, par cm² et par an, à une masse oxydée \(\dfrac{55{,}8\times10\times10^{-6}\times3{,}15\times10^{7}}{2\times96\,500} \approx 0{,}091\ \text{g}\), soit une épaisseur de \(0{,}091/7{,}9 \approx 0{,}12\ \text{mm}\) par an. Une tôle de 1 mm est percée en moins de dix ans.</p>
  </div>
  <p><strong>Facteurs favorisant la corrosion</strong> : acidité, dioxygène dissous et agitation, sels dissous (qui augmentent la conductivité, comme le sel de déneigement ou l'eau de mer), température, impuretés et contraintes mécaniques dans le métal, contact avec un métal plus noble (§8).</p>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DEUX MÉTAUX EN CONTACT</div>
  <h2>Corrosion galvanique</h2>
  <div class="prop-box">
    Deux métaux en contact électrique dans un même électrolyte prennent un potentiel commun. Le métal le <strong>moins noble</strong> (potentiel de corrosion le plus bas) devient l'anode et se corrode, souvent plus vite que s'il était seul ; le plus noble devient la cathode, siège de la réduction de l'oxydant, et se trouve protégé. Sur les courbes : on additionne les courants d'oxydation et de réduction des deux métaux ; le potentiel mixte est celui où leur somme est nulle.
  </div>
  <p>Exemples : une vis en acier sur une tôle de cuivre se corrode rapidement ; à l'inverse, un rivet en cuivre sur une coque en acier fait corroder l'acier autour de lui. Le cuivre, sur lequel la réduction du dioxygène ou de H⁺ est plus rapide, accélère la réaction cathodique : la surface où s'effectue la réduction s'agrandit, donc le courant de corrosion du fer augmente.</p>
  <div class="notice"><strong>Erreur classique</strong> : conclure à partir des seuls potentiels standard. C'est le potentiel de corrosion dans le milieu réel, résultat de la cinétique (surpotentiels, diffusion), qui décide : l'aluminium, très réducteur, se corrode peu à l'air parce qu'il est passivé (§9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · PROTECTION ET PASSIVATION</div>
  <h2>Ralentir ou empêcher la corrosion</h2>
  <h3>Revêtements</h3>
  <ul>
    <li><strong>Revêtement isolant</strong> (peinture, vernis, polymère) : il sépare le métal de l'électrolyte.</li>
    <li><strong>Revêtement par un métal plus noble</strong> (étain sur le fer du fer-blanc, chrome, nickel) : efficace tant qu'il est intact ; rayé, il forme avec le fer une pile où le fer est l'anode : la corrosion se concentre dans la rayure et devient plus rapide.</li>
    <li><strong>Revêtement par un métal moins noble</strong> (zinc sur l'acier galvanisé) : même rayé, il protège, car c'est le zinc qui s'oxyde à la place du fer ; il s'use progressivement.</li>
  </ul>
  <h3>Anode sacrificielle et courant imposé</h3>
  <div class="prop-box">
    <strong>Protection cathodique.</strong> On abaisse le potentiel du métal à protéger sous son potentiel de corrosion, dans un domaine où son oxydation est négligeable : il devient la cathode.
    <ul>
      <li><strong>Anode sacrificielle</strong> : un bloc de métal moins noble (zinc, magnésium, aluminium allié) relié au métal à protéger s'oxyde à sa place : coques de navires, canalisations enterrées, chauffe-eau. On remplace les anodes usées.</li>
      <li><strong>Courant imposé</strong> : un générateur relie le métal (au pôle −) à une électrode auxiliaire inerte : ponts, plateformes pétrolières, réservoirs enterrés.</li>
    </ul>
  </div>

<figcaption>Allure de la branche anodique d'un métal passivable (fer en milieu sulfurique, acier inoxydable, aluminium). Au-delà d'un potentiel, un film d'oxyde compact et adhérent se forme : le courant d'oxydation, donc la vitesse de corrosion, chute de plusieurs ordres de grandeur. À très haut potentiel, le film est détruit ou l'eau est oxydée (transpassivité).</figcaption>
</figure>
  <div class="prop-box">
    Certains métaux (aluminium, chrome, titane, fer en milieu oxydant, aciers inoxydables) se recouvrent, au-delà d'un potentiel, d'une couche d'oxyde compacte, adhérente et imperméable : sur la courbe d'oxydation, le courant chute brutalement et reste très faible sur un large domaine de potentiel. Le métal est <strong>passivé</strong> : thermodynamiquement oxydable, il est cinétiquement protégé. Les aciers inoxydables contiennent au moins 12 % de chrome, qui forme cette couche ; les ions chlorure peuvent la percer (corrosion par piqûres).
  </div>
  <div class="method-box">
    <strong>Exemple — protéger une coque de navire</strong>
    <ol>
      <li>Coque en acier dans l'eau de mer (neutre, aérée) : la réduction de O₂ dissous, limitée par la diffusion, fixe le courant de corrosion du fer.</li>
      <li>Des blocs de zinc vissés sur la coque forment avec elle une pile : le zinc, moins noble, est l'anode et s'oxyde ; le potentiel de l'acier descend sous son potentiel de corrosion et son oxydation devient négligeable.</li>
      <li>Masse de zinc consommée pour un courant de protection de 2 A pendant un an : \(\dfrac{65{,}4\times2\times3{,}15\times10^{7}}{2\times96\,500} \approx 21\ \text{kg}\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉLECTROCHIMIE</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Tracer l'allure d'une courbe courant-potentiel</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Inventaire.</span> Espèces présentes (solutés, solvant, métal de l'électrode) ; oxydations possibles (branche \(i \gt 0\)) et réductions possibles (branche \(i \lt 0\)).</li>
      <li><span class="step">Potentiels.</span> Potentiel d'équilibre de chaque couple par la formule de Nernst, décalé des surpotentiels de seuil donnés pour les systèmes lents.</li>
      <li><span class="step">Paliers.</span> Un palier de diffusion par soluté, proportionnel à sa concentration ; aucun pour le solvant et le métal de l'électrode (« murs »).</li>
      <li><span class="step">Somme.</span> Additionner les courants des couples ; vérifier que \(i = 0\) au potentiel d'équilibre si les deux membres d'un couple sont présents.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Prévoir ce qui se passe dans une pile ou un électrolyseur</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Électrodes.</span> Tracer la branche d'oxydation pertinente à l'anode et la branche de réduction à la cathode, sur le même graphique.</li>
      <li><span class="step">Même intensité.</span> Le courant \(I\) traverse l'anode (\(+I\)) et la cathode (\(-I\)) : lire \(E_a\) et \(E_c\) à ces ordonnées.</li>
      <li><span class="step">Pile</span> : \(U = E_c - E_a - RI\), décroissante avec \(I\) ; tension à vide à \(I = 0\). <span class="step">Électrolyseur</span> : \(U = E_a - E_c + RI\) ; tension minimale au démarrage des deux branches.</li>
      <li><span class="step">Réactions réelles</span> : à l'anode, l'oxydation qui démarre au plus bas potentiel ; à la cathode, la réduction qui démarre au plus haut, surpotentiels compris.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Bilans électriques et de matière</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Charge.</span> \(Q = I\,\Delta t\) (intensité constante), ou \(\int i\,\mathrm{d}t\).</li>
      <li><span class="step">Quantité d'électrons.</span> \(n_e = Q/F\) ; quantité de produit \(n_e/n\) pour une demi-réaction à \(n\) électrons.</li>
      <li><span class="step">Masse, volume</span> (\(V = nRT/p\) pour un gaz), rendement faradique \(\rho_F = m_{\text{réelle}}/m_{\text{théo}}\), énergie \(W = UI\Delta t\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Analyser une situation de corrosion</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Oxydant.</span> H⁺ (milieu acide) ou O₂ dissous (milieu neutre aéré), éventuellement limité par la diffusion.</li>
      <li><span class="step">Potentiel de corrosion</span> : intersection de la branche d'oxydation du métal et du symétrique de la branche de réduction de l'oxydant ; \(i_{\text{corr}}\) donne la vitesse.</li>
      <li><span class="step">Deux métaux.</span> Le moins noble se corrode ; le plus noble, siège de la réduction, est protégé.</li>
      <li><span class="step">Protection.</span> Choisir revêtement (et sa nature), anode sacrificielle, courant imposé, ou passivation ; justifier sur les courbes.</li>
    </ol>
  </div>
</div>
</template>

  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Lire une courbe courant-potentiel</h3>
  <div class="statement">On trace, sur une électrode de platine, la courbe d'une solution acide (pH 0) contenant Fe²⁺ à \(1\times10^{-2}\ \text{mol·L}^{-1}\) et Fe³⁺ à \(5\times10^{-3}\ \text{mol·L}^{-1}\) (\(E^\circ = 0{,}77\ \text{V}\)). Surpotentiels de seuil sur platine : O₂ +0,5 V, H₂ −0,1 V.</div>
  <div class="q"><strong>Q1.</strong> Calculer le potentiel à courant nul.</div>
  <div class="q"><strong>Q2.</strong> Décrire l'allure de la courbe, de −0,5 V à 2 V : vagues, paliers et murs, avec leurs potentiels de début. Comparer les hauteurs des deux paliers.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Nernst : \(E = 0{,}77 + 0{,}059\log\dfrac{5\times10^{-3}}{1\times10^{-2}} \approx 0{,}75\ \text{V}\).</p>
    <p><strong>Q2.</strong> Fe³⁺/Fe²⁺ est rapide sur platine : la courbe traverse l'axe à 0,75 V avec une pente forte ; vague d'oxydation de Fe²⁺ au-dessus (palier \(i_{la} \propto 10^{-2}\)), vague de réduction de Fe³⁺ en dessous (palier \(i_{lc} \propto 5\times10^{-3}\), deux fois moins haut en valeur absolue). Mur d'oxydation de l'eau à partir de \(1{,}23 + 0{,}5 \approx 1{,}7\ \text{V}\) ; mur de réduction (H⁺ → H₂) en dessous de \(0 - 0{,}1 = -0{,}1\ \text{V}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Cuivrage électrolytique</h3>
  <div class="statement">On dépose du cuivre sur une pièce de 50 cm² plongée dans une solution de sulfate de cuivre, sous \(I = 1{,}5\ \text{A}\) pendant 40 min. \(M(\text{Cu}) = 63{,}5\ \text{g·mol}^{-1}\), \(\rho = 8{,}9\ \text{g·cm}^{-3}\).</div>
  <div class="q"><strong>Q1.</strong> La pièce est-elle l'anode ou la cathode ? Écrire la demi-réaction.</div>
  <div class="q"><strong>Q2.</strong> Masse et épaisseur de cuivre déposées, pour un rendement faradique de 95 %.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le cuivre s'y dépose par réduction : Cu²⁺ + 2 e⁻ → Cu ; la pièce est la cathode (reliée au pôle − du générateur).</p>
    <p><strong>Q2.</strong> \(m = 0{,}95\times\dfrac{63{,}5\times1{,}5\times2\,400}{2\times96\,500}\approx 1{,}13\ \text{g}\) ; épaisseur \(\dfrac{1{,}13}{8{,}9\times50}\approx 2{,}5\times10^{-3}\ \text{cm} = 25\ \text{µm}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Pourquoi le zinc pur résiste-t-il aux acides ?</h3>
  <div class="statement">\(E^\circ(\text{Zn}^{2+}/\text{Zn}) = -0{,}76\ \text{V}\). Surpotentiel de seuil du dégagement de H₂ : −0,75 V sur zinc, −0,05 V sur cuivre. On plonge une lame de zinc pur dans une solution d'acide chlorhydrique à pH 0.</div>
  <div class="q"><strong>Q1.</strong> La réaction Zn + 2 H⁺ → Zn²⁺ + H₂ est-elle thermodynamiquement favorable ?</div>
  <div class="q"><strong>Q2.</strong> À l'aide de l'allure des courbes, expliquer qu'on observe à peine un dégagement gazeux.</div>
  <div class="q"><strong>Q3.</strong> On touche la lame de zinc avec un fil de cuivre plongeant dans la même solution. Qu'observe-t-on, et où ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta_rG^\circ = -2F\big(0 - (-0{,}76)\big) \lt 0\) : oui, et \(K^\circ\) est énorme (\(\approx 10^{26}\)).</p>
    <p><strong>Q2.</strong> La réduction de H⁺ sur zinc ne démarre qu'en dessous de −0,75 V environ, alors que l'oxydation du zinc démarre vers −0,76 V : les deux branches se coupent à courant très faible. Le potentiel de corrosion est voisin de −0,76 V et \(i_{\text{corr}}\) est minuscule : la réaction est cinétiquement bloquée.</p>
    <p><strong>Q3.</strong> Le cuivre, relié au zinc, prend le même potentiel ; la réduction de H⁺ y est rapide (seuil −0,05 V). Le courant de réduction sur le cuivre devient important au potentiel du zinc : un dégagement abondant de H₂ apparaît <strong>sur le cuivre</strong>, et le zinc se corrode vite. C'est une corrosion galvanique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Accumulateur au plomb</h3>
  <div class="statement">En décharge, à l'électrode négative Pb + SO₄²⁻ → PbSO₄ + 2 e⁻ ; à l'électrode positive PbO₂ + SO₄²⁻ + 4 H⁺ + 2 e⁻ → PbSO₄ + 2 H₂O. La tension à vide d'un élément vaut 2,05 V. Une batterie de 12 V comporte six éléments en série et a une capacité de 60 A·h.</div>
  <div class="q"><strong>Q1.</strong> Écrire l'équation de la réaction de décharge et calculer son enthalpie libre de réaction.</div>
  <div class="q"><strong>Q2.</strong> Masse de plomb consommée dans un élément pour une décharge complète. (\(M(\text{Pb}) = 207\ \text{g·mol}^{-1}\).)</div>
  <div class="q"><strong>Q3.</strong> Pendant la recharge, l'eau pourrait être électrolysée (écart thermodynamique 1,23 V, inférieur à 2,05 V). Pourquoi ne l'est-elle presque pas ? Quelle précaution prendre sur la tension de charge ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pb + PbO₂ + 2 SO₄²⁻ + 4 H⁺ → 2 PbSO₄ + 2 H₂O, avec 2 électrons échangés : \(\Delta_rG = -2Fe_0 \approx -396\ \text{kJ·mol}^{-1}\).</p>
    <p><strong>Q2.</strong> \(Q = 60\times3\,600 = 2{,}16\times10^{5}\ \text{C}\), qui traverse chaque élément (série) : \(n(\text{Pb}) = Q/(2F) \approx 1{,}12\ \text{mol}\), soit 232 g par élément.</p>
    <p><strong>Q3.</strong> Les surpotentiels de H₂ sur plomb et de O₂ sur PbO₂ sont très grands : sur les courbes, la réduction de PbSO₄ en Pb démarre avant celle de l'eau, et l'oxydation de PbSO₄ en PbO₂ avant celle de l'eau. La tension de charge doit rester sous le seuil de démarrage de ces réactions parasites (environ 2,4 V par élément), sinon l'eau s'électrolyse (dégagement de H₂ et O₂, perte d'électrolyte, risque d'explosion).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Concours PT — Protection d'une canalisation enterrée</h3>
  <div class="statement">Une canalisation en acier de 1 km, de diamètre 30 cm, est enterrée dans un sol humide et aéré. Sans protection, la densité de courant de corrosion vaut \(20\ \text{µA·cm}^{-2}\) sur 10 % de sa surface, là où le revêtement est dégradé.</div>
  <div class="q"><strong>Q1.</strong> Quel est l'oxydant ? Pourquoi la corrosion est-elle limitée par la diffusion ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la masse de fer perdue par an (fer oxydé en Fe²⁺, \(M = 55{,}8\ \text{g·mol}^{-1}\)).</div>
  <div class="q"><strong>Q3.</strong> On protège la canalisation par des anodes en magnésium (Mg → Mg²⁺ + 2 e⁻, \(M = 24{,}3\ \text{g·mol}^{-1}\)), avec un rendement de 50 % (autocorrosion). Estimer la masse de magnésium à prévoir pour dix ans, si le courant de protection égale le courant de corrosion.</div>
  <div class="q"><strong>Q4.</strong> Quelle autre méthode peut-on employer ? Avantage ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le dioxygène dissous dans l'eau du sol, peu concentré (environ \(3\times10^{-4}\ \text{mol·L}^{-1}\)) : sa réduction atteint vite son courant limite de diffusion.</p>
    <p><strong>Q2.</strong> Surface latérale \(\pi\times0{,}30\times1\,000 \approx 942\ \text{m}^2\), dont 10 % dégradés : \(94\ \text{m}^2 = 9{,}4\times10^{5}\ \text{cm}^2\). Courant \(I = 9{,}4\times10^{5}\times20\times10^{-6} \approx 19\ \text{A}\). Masse annuelle : \(\dfrac{55{,}8\times19\times3{,}15\times10^{7}}{2\times96\,500} \approx 1{,}7\times10^{5}\ \text{g}\), soit 170 kg de fer par an.</p>
    <p><strong>Q3.</strong> Masse théorique de Mg sur dix ans : \(\dfrac{24{,}3\times19\times3{,}15\times10^{8}}{2\times96\,500} \approx 7{,}5\times10^{5}\ \text{g}\) ; avec 50 % de rendement, environ 1,5 tonne de magnésium, répartie en anodes le long du tracé.</p>
    <p><strong>Q4.</strong> La protection par courant imposé (générateur, pôle − relié à la canalisation, anode inerte enterrée) : réglable, adaptée aux grandes structures, sans anode à remplacer ; mais elle consomme de l'énergie et demande une surveillance.</p>
  </div>
</div>
