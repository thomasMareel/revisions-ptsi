      <h2>Vocabulaire : économie &amp; entreprise</h2>
      <div class="intro">Le lexique économique revient dans une grande partie des documents de colle (presse anglo-saxonne). À mémoriser par familles.</div>
      <div class="prop-box"><strong>Grandes tendances</strong> : growth · a recession / a downturn / a slump · unemployment · inflation · GDP (Gross Domestic Product).</div>
      <div class="prop-box"><strong>Marché</strong> : supply and demand · purchasing power · the cost of living · the wealth gap · inequality.</div>
      <div class="sec-num" style="margin-top:1.5rem">§2 · ENTREPRISE &amp; EMPLOI</div>
      <div class="prop-box"><strong>Entreprise</strong> : a company / a firm / a business · shareholders · the board · turnover / revenue · profit.</div>
      <div class="prop-box"><strong>Emploi</strong> : to hire / to recruit · to lay off / to make redundant · wages / a salary · a rise · a fall.</div>
      <div class="notice">Faux-amis : <em>benefit</em> = avantage / allocation (≠ bénéfice = profit) ; <em>to demand</em> = exiger (≠ demander = to ask).</div>
