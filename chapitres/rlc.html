<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite, du côté électrique, la partie 1.4 du programme de PTSI, « Oscillateurs libres et forcés ». Le circuit RLC série est l'oscillateur électrique : il obéit à la même équation que la masse-ressort amortie, dont l'exposé de référence est le chapitre <a href="#oscill/cours">« Oscillateurs harmoniques »</a> (pulsation propre \(\omega_0\), facteur de qualité \(Q\), constante de temps \(\tau=2Q/\omega_0\), pseudo-pulsation \(\omega_p\)). On y renvoie pour ce qui est commun, et l'on développe ici ce qui est propre au circuit : continuités, conditions initiales, courant, impédance, surtension, mesures.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Circuit LC</strong>, oscillateur harmonique : établir et reconnaître l'équation différentielle ; la résoudre compte tenu des conditions initiales ; amplitude, phase, période, fréquence, pulsation (§1).</li>
        <li><strong>Circuit RLC série</strong> : écrire l'équation sous forme canonique afin d'identifier la pulsation propre et le facteur de qualité (§2).</li>
        <li>Décrire la <strong>nature de la réponse</strong> en fonction de la valeur du facteur de qualité ; déterminer la <strong>réponse détaillée</strong> en régime libre ou pour un échelon, en recherchant les racines du polynôme caractéristique (§3, §4).</li>
        <li>Déterminer un <strong>ordre de grandeur de la durée du régime transitoire</strong> selon la valeur du facteur de qualité (§4).</li>
        <li><strong>Impédances complexes</strong> : celle du RLC série ; utiliser la représentation complexe pour étudier le régime forcé (§5). Établir les impédances de R, L, C et associer deux impédances : chapitre <a href="#filtres/cours">« Régime sinusoïdal forcé et filtrage linéaire »</a>, §1 à §3.</li>
        <li><strong>Résonance</strong> : relier l'acuité d'une résonance au facteur de qualité ; déterminer la pulsation propre et le facteur de qualité à partir de graphes expérimentaux d'amplitude et de phase (§6, §9).</li>
        <li><strong>Stockage et dissipation d'énergie</strong> : réaliser un bilan énergétique ; prévoir l'évolution du système à partir de considérations énergétiques (§7).</li>
        <li>Mettre en évidence la <strong>similitude des comportements</strong> des oscillateurs mécanique et électronique (§8).</li>
        <li>Analyser, sur des <strong>relevés expérimentaux</strong>, l'évolution de la forme des régimes transitoires ; réaliser l'acquisition d'un régime transitoire du deuxième ordre ; mettre en œuvre un dispositif qui caractérise une résonance (§9).</li>
        <li><strong>Capacité numérique</strong> (annexe « outils numériques ») : transformer une équation d'ordre 2 en système d'ordre 1 et la résoudre avec <code>odeint</code> ou la méthode d'Euler (§10).</li>
      </ul>
      <p>Hors programme (regroupé en fin de chapitre) : la valeur exacte de la pulsation de résonance en tension, le circuit RLC parallèle, la puissance moyenne fournie par le générateur et le facteur de puissance. L'onglet « Simulateur » trace les régimes libre et indiciel et la courbe de résonance en tension ; ses réglages par défaut (\(R=20\ \Omega\), \(L=50\ \text{mH}\), \(C=10\ \mu\text{F}\)) servent d'exemple tout au long du chapitre.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · DIPÔLES ET OSCILLATEUR LC</div>
  <h2>Un condensateur qui se décharge dans une bobine</h2>
  <div class="intro">Le condensateur stocke de l'énergie électrique, la bobine de l'énergie magnétique. Reliés l'un à l'autre, ils se la renvoient indéfiniment si rien ne la dissipe : c'est l'oscillateur électrique le plus simple, le circuit LC, première étape vers le RLC.</div>
  <p><strong>Rappels.</strong> Les relations des dipôles, les continuités et les énergies sont établies dans le chapitre <a href="#premierordre/cours">« Circuit linéaire du premier ordre »</a> (§1, §2) ; on les utilise ici telles quelles, en convention récepteur :</p>
  <div class="formula" data-nom="Dipôles R, L, C">$$u_R=Ri\qquad u_L=L\,\frac{\mathrm{d}i}{\mathrm{d}t}\qquad i=C\,\frac{\mathrm{d}u_C}{\mathrm{d}t}\qquad\mathcal E_L=\tfrac12Li^2\qquad\mathcal E_C=\tfrac12Cu_C^2$$</div>
  <p>La tension \(u_C\) aux bornes d'un condensateur et l'intensité \(i\) qui traverse une bobine sont <strong>continues</strong> : une discontinuité demanderait une puissance infinie. Ce sont ces deux grandeurs qui fixent les conditions initiales d'un circuit RLC.</p>
  <div class="def-box">
    <strong>Circuit LC.</strong> Un condensateur chargé sous \(U_0\) est relié à \(t=0\) à une bobine idéale. La loi des mailles \(L\,\dfrac{\mathrm{d}i}{\mathrm{d}t}+u_C=0\), avec \(i=C\,\dfrac{\mathrm{d}u_C}{\mathrm{d}t}\), donne l'équation d'un oscillateur harmonique :
    <div class="formula" data-nom="Oscillateur LC">$$\frac{\mathrm{d}^2u_C}{\mathrm{d}t^2}+\omega_0^2\,u_C=0\qquad\omega_0=\frac1{\sqrt{LC}}\qquad T_0=2\pi\sqrt{LC}$$</div>
    Avec \(u_C(0)=U_0\) et \(i(0)=0\) (continuités) : \(u_C=U_0\cos(\omega_0t)\) et \(i=-U_0\sqrt{C/L}\,\sin(\omega_0t)\). Le courant est en quadrature avec la tension, d'amplitude \(I_m=U_0\sqrt{C/L}\).
  </div>
  <p><strong>Énergie.</strong> \(\mathcal E=\tfrac12Cu_C^2+\tfrac12Li^2=\tfrac12CU_0^2\) reste constante : l'énergie passe du condensateur (aux instants où \(i=0\)) à la bobine (quand \(u_C=0\)), deux fois par période. C'est exactement l'échange entre énergies potentielle et cinétique de la masse-ressort (<a href="#oscill/cours">« Oscillateurs harmoniques »</a>, §4).</p>
  <div class="method-box">
    <strong>Exemple — un circuit LC de travaux pratiques</strong>
    <ol>
      <li>\(L=10\ \text{mH}\), \(C=1{,}0\ \mu\text{F}\) : \(\omega_0=1/\sqrt{10^{-2}\times10^{-6}}=1{,}0\times10^4\ \text{rad·s}^{-1}\), \(f_0=\omega_0/(2\pi)\approx1{,}6\ \text{kHz}\), \(T_0\approx0{,}63\ \text{ms}\).</li>
      <li>Condensateur chargé sous \(U_0=5{,}0\ \text{V}\) : \(\mathcal E=\tfrac12CU_0^2=12{,}5\ \mu\text{J}\) ; amplitude du courant \(I_m=U_0\sqrt{C/L}=50\ \text{mA}\). Contrôle : \(\tfrac12LI_m^2=\tfrac12\times10^{-2}\times0{,}050^2=12{,}5\ \mu\text{J}\).</li>
      <li>Une bobine réelle a une résistance de l'ordre de \(10\ \Omega\) : le circuit est en fait un RLC, et les oscillations s'amortissent (§3).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire la loi des mailles \(L\,\mathrm{d}i/\mathrm{d}t=u_C\) en oubliant les orientations. Avec \(i\) orienté dans le sens de la maille et \(u_C\), \(u_L\) en convention récepteur, la somme des tensions est nulle : \(u_L+u_C=0\). Contrôle : un signe faux donne \(\ddot u_C-\omega_0^2u_C=0\), dont les solutions divergent.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · MISE EN ÉQUATION</div>
  <h2>Forme canonique, pulsation propre et facteur de qualité</h2>
  <div class="intro">On ajoute une résistance, qui modélise la résistance de la bobine, celle du générateur et celle d'un éventuel conducteur ohmique, et l'on alimente le circuit par une tension \(e(t)\). L'équation obtenue est celle de l'oscillateur amorti : deux paramètres, \(\omega_0\) et \(Q\), suffisent à décrire tout son comportement.</div>

</figure>
  <p>La loi des mailles s'écrit \(e=u_R+u_L+u_C=Ri+L\,\dfrac{\mathrm{d}i}{\mathrm{d}t}+u_C\). On choisit pour inconnue la grandeur continue \(u_C\), et l'on remplace \(i\) par \(C\,\mathrm{d}u_C/\mathrm{d}t\) :</p>
  <div class="formula">$$LC\,\frac{\mathrm{d}^2u_C}{\mathrm{d}t^2}+RC\,\frac{\mathrm{d}u_C}{\mathrm{d}t}+u_C=e(t)$$</div>
  <div class="prop-box">
    <strong>Forme canonique.</strong> En divisant par \(LC\) :
    <div class="formula" data-nom="Équation du RLC série">$$\frac{\mathrm{d}^2u_C}{\mathrm{d}t^2}+\frac{\omega_0}Q\,\frac{\mathrm{d}u_C}{\mathrm{d}t}+\omega_0^2\,u_C=\omega_0^2\,e(t)$$</div>
    <div class="formula" data-nom="Pulsation propre et facteur de qualité du RLC">$$\omega_0=\frac1{\sqrt{LC}}\qquad Q=\frac1R\sqrt{\frac LC}=\frac{L\omega_0}R=\frac1{RC\omega_0}\qquad\tau=\frac{2Q}{\omega_0}=\frac{2L}R$$</div>
    \(\omega_0\) est la pulsation propre (en \(\text{rad·s}^{-1}\)), \(Q\) le facteur de qualité (sans dimension) et \(\tau\) la constante de temps de l'amortissement des oscillations (§3), avec les conventions du chapitre <a href="#oscill/cours">« Oscillateurs harmoniques »</a> (§5).
  </div>
  <p><strong>Identifier.</strong> On divise par le coefficient de la dérivée seconde, on lit \(\omega_0^2\) devant \(u_C\), puis \(\omega_0/Q\) devant la dérivée première, ici \(R/L\) : \(Q=L\omega_0/R\). Les trois expressions de \(Q\) sont égales, puisque \(L\omega_0=1/(C\omega_0)=\sqrt{L/C}\). Plus \(R\) est petite, plus \(Q\) est grand et plus le circuit oscille longtemps.</p>
  <p><strong>Autres inconnues.</strong> La charge \(q=Cu_C\) vérifie la même équation (\(L\ddot q+R\dot q+q/C=e\)). L'intensité s'obtient en dérivant la loi des mailles : \(L\,\dfrac{\mathrm{d}^2i}{\mathrm{d}t^2}+R\,\dfrac{\mathrm{d}i}{\mathrm{d}t}+\dfrac iC=\dfrac{\mathrm{d}e}{\mathrm{d}t}\) : même membre de gauche, donc mêmes régimes ; pour un échelon, le second membre est nul après \(t=0\).</p>
  <div class="method-box">
    <strong>Exemple — le circuit du simulateur</strong>
    <p>Réglages par défaut de l'onglet « Simulateur » : \(R=20\ \Omega\), \(L=50\ \text{mH}\), \(C=10\ \mu\text{F}\).</p>
    <ol>
      <li>\(LC=5\times10^{-7}\ \text{s}^2\), donc \(\omega_0=1/\sqrt{LC}\approx1\,414\ \text{rad·s}^{-1}\), soit \(f_0\approx225\ \text{Hz}\) et \(T_0\approx4{,}44\ \text{ms}\).</li>
      <li>\(\sqrt{L/C}=\sqrt{5\,000}\approx70{,}7\ \Omega\), donc \(Q=70{,}7/20\approx3{,}54\) ; \(\tau=2L/R=5{,}0\ \text{ms}\).</li>
      <li>Contrôle : \(L\omega_0/R=0{,}050\times1\,414/20=3{,}54\) et \(2Q/\omega_0=2\times3{,}54/1\,414=5{,}0\ \text{ms}\).</li>
    </ol>
  </div>
  <p><strong>Ordres de grandeur.</strong> En travaux pratiques, \(L\) va de quelques millihenrys à 1 H (bobines à noyau), \(C\) du nanofarad au millifarad, \(R\) de quelques ohms au kilohm : \(f_0\) va de quelques hertz à quelques centaines de kilohertz, \(Q\) de 0,1 à quelques dizaines. Un circuit d'accord de radio atteint \(Q\approx100\).</p>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(Q=R\sqrt{C/L}\), à l'envers. Contrôle physique : une résistance plus grande dissipe davantage et doit donner un \(Q\) plus <em>petit</em>. Contrôle d'unités : \(\sqrt{L/C}\) est en ohms (\(L\omega\) et \(1/(C\omega)\) sont des impédances), et \(Q\) est sans dimension.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · RÉGIME LIBRE</div>
  <h2>Trois régimes selon le facteur de qualité</h2>
  <div class="intro">Un condensateur chargé, relié à une bobine et à une résistance, se décharge : on étudie ce régime libre (\(e=0\)). La solution s'obtient comme pour l'oscillateur mécanique ; ce qui est propre au circuit, ce sont les conditions initiales, données par les continuités, et la résistance critique.</div>
  <div class="prop-box">
    <strong>Polynôme caractéristique.</strong> \(r^2+\dfrac{\omega_0}Q\,r+\omega_0^2=0\), de discriminant \(\Delta=\omega_0^2\left(\dfrac1{Q^2}-4\right)\).
    <ul>
      <li>\(Q\gt\tfrac12\) : <strong>pseudo-périodique</strong>. \(u_C=e^{-t/\tau}\left(A\cos\omega_pt+B\sin\omega_pt\right)\), avec \(\tau=\dfrac{2Q}{\omega_0}\) et la pseudo-pulsation \(\omega_p=\omega_0\sqrt{1-\dfrac1{4Q^2}}\) ; pseudo-période \(T_p=2\pi/\omega_p\).</li>
      <li>\(Q=\tfrac12\) : <strong>critique</strong>. \(u_C=(A+Bt)\,e^{-\omega_0t}\).</li>
      <li>\(Q\lt\tfrac12\) : <strong>apériodique</strong>. \(u_C=Ae^{r_1t}+Be^{r_2t}\), avec \(r_{1,2}=-\dfrac{\omega_0}{2Q}\left(1\mp\sqrt{1-4Q^2}\right)\lt0\).</li>
    </ul>
    Exposé détaillé, solutions et figure en fonction de \(\omega_0t\) : <a href="#oscill/cours">« Oscillateurs harmoniques »</a>, §6.
  </div>
  <div class="def-box">
    <strong>Résistance critique.</strong> Le régime critique est obtenu pour \(Q=1/2\), c'est-à-dire pour
    <div class="formula" data-nom="Résistance critique">$$R_c=2\sqrt{\frac LC}$$</div>
    Le circuit oscille si \(R\lt R_c\), il revient sans osciller si \(R\geq R_c\).
  </div>
  <p><strong>Conditions initiales.</strong> Le condensateur est chargé sous \(U_0\) et aucun courant ne circule avant \(t=0\). Les continuités donnent \(u_C(0^+)=U_0\) et \(i(0^+)=0\), d'où \(\dfrac{\mathrm{d}u_C}{\mathrm{d}t}(0^+)=\dfrac{i(0^+)}C=0\) : la courbe part avec une tangente horizontale. La loi des mailles à \(0^+\) donne aussi \(L\,\dfrac{\mathrm{d}i}{\mathrm{d}t}(0^+)=-u_C(0^+)=-U_0\) : le courant, nul, démarre avec une pente \(-U_0/L\).</p>

  <div class="method-box">
    <strong>Exemple — décharge pseudo-périodique, en détail</strong>
    <p>\(R=20\ \Omega\), \(L=50\ \text{mH}\), \(C=10\ \mu\text{F}\) (\(Q=3{,}54\), \(\tau=5{,}0\ \text{ms}\)), \(U_0=5{,}0\ \text{V}\).</p>
    <ol>
      <li>\(\omega_p=\omega_0\sqrt{1-1/(4Q^2)}=1\,414\times\sqrt{0{,}98}=1\,400\ \text{rad·s}^{-1}\), \(T_p\approx4{,}49\ \text{ms}\), un peu plus que \(T_0=4{,}44\ \text{ms}\).</li>
      <li>\(u_C(0)=U_0\) donne \(A=U_0\) ; \(\dot u_C(0)=-A/\tau+B\omega_p=0\) donne \(B=U_0/(\omega_p\tau)=U_0/7\) :
      <div class="formula">$$u_C=U_0\,e^{-t/\tau}\left(\cos\omega_pt+\frac{\sin\omega_pt}{\omega_p\tau}\right)\qquad i=C\frac{\mathrm{d}u_C}{\mathrm{d}t}=-\frac{U_0}{L\omega_p}\,e^{-t/\tau}\sin\omega_pt$$</div></li>
      <li>Deux maximums successifs de \(u_C\) sont dans le rapport \(e^{T_p/\tau}\approx2{,}45\) ; on compte environ \(Q\approx3\) à 4 oscillations visibles. Le courant atteint \(57{,}7\ \text{mA}\) en valeur absolue, à \(t\approx1{,}0\ \text{ms}\).</li>
      <li>Avec \(R=R_c=141\ \Omega\), \(u_C=U_0(1+\omega_0t)\,e^{-\omega_0t}\) : retour sans oscillation, à 5 % près en \(4{,}7/\omega_0\approx3{,}4\ \text{ms}\). Avec \(R=400\ \Omega\) (\(Q=0{,}18\)), il faut près de 12 ms.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(\mathrm{d}u_C/\mathrm{d}t(0^+)=0\) par réflexe. C'est vrai ici parce que \(i(0^+)=0\) ; si un courant \(I_0\) circulait dans la bobine avant la commutation, on aurait \(\mathrm{d}u_C/\mathrm{d}t(0^+)=I_0/C\). Les conditions initiales portent toujours sur \(u_C\) et \(i\), jamais directement sur une dérivée.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · RÉPONSE À UN ÉCHELON DE TENSION</div>
  <h2>Charger le condensateur à travers la bobine</h2>
  <div class="intro">À \(t=0\), on ferme l'interrupteur : le circuit, au repos, reçoit la tension constante \(E\). C'est l'expérience la plus courante en travaux pratiques (un créneau de GBF est une suite d'échelons, §9) et le scénario le plus fréquent en exercice.</div>
  <p>Pour \(t\gt0\), l'équation canonique a pour second membre la constante \(\omega_0^2E\). Sa solution est la somme d'une <strong>solution particulière constante</strong>, \(u_C=E\) (en régime permanent, le condensateur chargé bloque le courant : plus de tension aux bornes de \(R\) ni de \(L\)), et de la solution de l'équation homogène (§3). Conditions initiales : \(u_C(0^+)=0\) et \(i(0^+)=0\), donc \(\dot u_C(0^+)=0\).</p>
  <div class="prop-box">
    <strong>Réponse indicielle.</strong> Pour un circuit initialement au repos soumis à l'échelon \(E\) :
    <ul>
      <li>\(Q\gt\tfrac12\) :
      <div class="formula" data-nom="Réponse du RLC à un échelon">$$u_C=E\left[1-e^{-t/\tau}\left(\cos\omega_pt+\frac{\sin\omega_pt}{\omega_p\tau}\right)\right]\qquad i=\frac E{L\omega_p}\,e^{-t/\tau}\sin\omega_pt$$</div></li>
      <li>\(Q=\tfrac12\) : \(u_C=E\left[1-(1+\omega_0t)\,e^{-\omega_0t}\right]\).</li>
      <li>\(Q\lt\tfrac12\) : \(u_C=E\left[1+\dfrac{r_2e^{r_1t}-r_1e^{r_2t}}{r_1-r_2}\right]\).</li>
    </ul>
  </div>
  <p><strong>Premier dépassement.</strong> En régime pseudo-périodique, le courant s'annule pour la première fois en \(t=T_p/2\) : c'est le premier maximum de \(u_C\). En ce point, \(\cos\omega_pt=-1\) et \(\sin\omega_pt=0\), d'où \(u_C=E(1+D)\) avec</p>
  <div class="formula" data-nom="Premier dépassement">$$D=e^{-T_p/(2\tau)}=\exp\left(-\frac{\pi}{\sqrt{4Q^2-1}}\right)\approx e^{-\pi/(2Q)}\ \ (Q\gg1)$$</div>

  <div class="method-box">
    <strong>Exemple — échelon de 5 V sur le circuit du simulateur</strong>
    <ol>
      <li>\(Q=3{,}54\) : \(\sqrt{4Q^2-1}=\sqrt{49}=7\), donc \(D=e^{-\pi/7}\approx0{,}64\) : \(u_C\) monte jusqu'à \(E(1+D)\approx8{,}2\ \text{V}\) à \(t=T_p/2\approx2{,}2\ \text{ms}\). Un condensateur choisi pour 5 V « voit » 8,2 V.</li>
      <li>Courant : \(E/(L\omega_p)=5/(0{,}050\times1\,400)\approx71\ \text{mA}\) ; son maximum, réduit par l'amortissement, vaut 58 mA, à 1,0 ms.</li>
      <li>Durée du transitoire : \(u_C\) reste à 5 % près de \(E\) au-delà de 14 ms, soit environ \(3\tau=15\ \text{ms}\) ou trois pseudo-périodes.</li>
    </ol>
  </div>
  <p><strong>Durée du régime transitoire</strong> (étude complète : <a href="#oscill/cours">« Oscillateurs harmoniques »</a>, §7). Pour \(Q\gg1\), quelques \(\tau=2Q/\omega_0\), soit environ \(Q\) pseudo-périodes ; pour \(Q\ll1\), la racine \(r_1\approx-Q\omega_0\) impose une durée de l'ordre de \(3/(Q\omega_0)\) ; la plus courte, quelques \(1/\omega_0\), est obtenue au voisinage du régime critique (\(4{,}7/\omega_0\) pour \(Q=1/2\)).</p>
  <p><strong>Bilan d'énergie de la charge.</strong> Le générateur fournit \(\displaystyle\int_0^\infty Ei\,\mathrm{d}t=E\,q_\infty=CE^2\), puisque la charge totale qui a circulé est \(q_\infty=CE\). En fin de charge, le condensateur stocke \(\tfrac12CE^2\) et la bobine rien (\(i_\infty=0\)) : la résistance a dissipé \(\tfrac12CE^2\), <strong>quelles que soient \(R\) et \(L\)</strong>. C'est le résultat du circuit RC (<a href="#premierordre/cours">« Circuit linéaire du premier ordre »</a>, §8) : la bobine change la forme du transitoire, pas le bilan. Ici, \(CE^2=250\ \mu\text{J}\), dont 125 µJ stockés et 125 µJ dissipés.</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les conditions initiales à la seule solution homogène, sans y ajouter la solution particulière \(E\) ; on trouve alors \(A=0\) au lieu de \(A=-E\). Autre erreur : prendre \(i(0^+)=E/R\), comme pour un circuit RC ; ici la bobine impose \(i(0^+)=i(0^-)=0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RÉGIME SINUSOÏDAL FORCÉ</div>
  <h2>L'impédance du circuit RLC série</h2>
  <div class="intro">Si le générateur impose \(e(t)=E_m\cos(\omega t)\) en permanence, le transitoire s'éteint en quelques \(\tau\) et le circuit oscille à la pulsation \(\omega\) imposée : c'est le régime sinusoïdal forcé. La notation complexe ramène son étude à de l'algèbre.</div>
  <p><strong>Outils.</strong> La notation complexe (\(x=X_m\cos(\omega t+\varphi)\) représentée par \(\underline x=\underline X_me^{j\omega t}\), avec \(\underline X_m=X_me^{j\varphi}\) ; dériver revient à multiplier par \(j\omega\)), les impédances \(\underline Z_R=R\), \(\underline Z_L=jL\omega\), \(\underline Z_C=1/(jC\omega)\) et leurs associations sont établies dans le chapitre <a href="#filtres/cours">« Régime sinusoïdal forcé et filtrage linéaire »</a>, §1 à §3. On les applique au RLC série.</p>
  <div class="prop-box">
    <strong>Impédance du RLC série.</strong> Les impédances en série s'ajoutent :
    <div class="formula" data-nom="Impédance du RLC série">$$\underline Z=R+j\left(L\omega-\frac1{C\omega}\right)=R\left[1+jQ\left(x-\frac1x\right)\right]\qquad x=\frac\omega{\omega_0}$$</div>
    <div class="formula">$$|\underline Z|=\sqrt{R^2+\left(L\omega-\frac1{C\omega}\right)^2}\qquad\arg\underline Z=\arctan\frac{L\omega-1/(C\omega)}R\in\left]-\frac\pi2,\frac\pi2\right[$$</div>
    La seconde écriture vient de \(L\omega/R=Qx\) et \(1/(RC\omega)=Q/x\). L'arc tangente donne bien l'argument, car la partie réelle \(R\) est positive.
  </div>

<figcaption>Impédance du circuit RLC série des réglages par défaut du simulateur (\(R = 20\ \Omega\), \(L = 50\ \text{mH}\), \(C = 10\ \mu\text{F}\)), en échelles logarithmiques. Aux basses fréquences, le condensateur domine : \(|\underline Z| \approx 1/(C\omega)\), argument proche de \(-90^\circ\) (comportement capacitif). Aux hautes fréquences, la bobine domine : \(|\underline Z| \approx L\omega\), argument proche de \(+90^\circ\) (comportement inductif). À \(f_0\), les deux réactances se compensent : \(\underline Z = R\), minimum du module, argument nul.</figcaption>
</figure>
  <p><strong>Trois comportements.</strong> Pour \(\omega\lt\omega_0\), \(1/(C\omega)\gt L\omega\) : le circuit est <strong>capacitif</strong> (\(\arg\underline Z\lt0\)). Pour \(\omega\gt\omega_0\), il est <strong>inductif</strong> (\(\arg\underline Z\gt0\)). En \(\omega_0\), les réactances de la bobine et du condensateur se compensent exactement : \(\underline Z=R\), réelle et minimale.</p>
  <p><strong>Courant.</strong> L'amplitude complexe du courant est \(\underline I_m=\underline E_m/\underline Z\) (avec \(\underline E_m=E_m\), réelle si \(e\) est prise comme origine des phases) : \(I_m=E_m/|\underline Z|\), et le courant est déphasé de \(\varphi=-\arg\underline Z\) par rapport à \(e\), en avance aux basses fréquences, en retard aux hautes.</p>
  <div class="method-box">
    <strong>Exemple — trois fréquences, \(E_m=2{,}0\ \text{V}\)</strong>
    <p>Circuit du simulateur (\(R=20\ \Omega\), \(L=50\ \text{mH}\), \(C=10\ \mu\text{F}\), \(f_0=225\ \text{Hz}\)).</p>
    <ol>
      <li>\(f=100\ \text{Hz}\) : \(L\omega=31{,}4\ \Omega\), \(1/(C\omega)=159\ \Omega\), \(\underline Z=20-127{,}7j\ \Omega\) : \(|\underline Z|=129\ \Omega\), \(\arg\underline Z=-81^\circ\). \(I_m=15{,}5\ \text{mA}\), en avance de \(81^\circ\) sur \(e\).</li>
      <li>\(f=f_0\) : \(L\omega_0=1/(C\omega_0)=70{,}7\ \Omega\), \(\underline Z=20\ \Omega\) : \(I_m=100\ \text{mA}\), en phase avec \(e\).</li>
      <li>\(f=500\ \text{Hz}\) : \(L\omega=157\ \Omega\), \(1/(C\omega)=31{,}8\ \Omega\), \(|\underline Z|=127\ \Omega\), \(\arg\underline Z=+81^\circ\) : \(I_m=15{,}8\ \text{mA}\), en retard.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner des amplitudes. Les tensions \(u_R\), \(u_L\), \(u_C\) ne sont pas en phase : \(E_m\neq U_{Rm}+U_{Lm}+U_{Cm}\). Ce sont les amplitudes <em>complexes</em> qui s'ajoutent (représentation de Fresnel, chapitre « Régime sinusoïdal forcé et filtrage linéaire », §3). À \(f_0\), par exemple, \(U_{Lm}=U_{Cm}=QE_m=7{,}1\ \text{V}\) alors que \(E_m=2\ \text{V}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉSONANCES</div>
  <h2>Résonance en intensité, résonance en tension</h2>
  <div class="intro">Quand on balaie la fréquence du générateur à amplitude constante, l'amplitude du courant passe toujours par un maximum en \(\omega_0\) ; celle de la tension aux bornes du condensateur peut dépasser largement celle du générateur. Le facteur de qualité fixe l'acuité de la résonance et l'ampleur de la surtension.</div>
  <div class="prop-box">
    <strong>Résonance en intensité.</strong>
    <div class="formula" data-nom="Amplitude du courant dans le RLC série">$$I_m(\omega)=\frac{E_m}{\sqrt{R^2+\left(L\omega-\dfrac1{C\omega}\right)^2}}=\frac{E_m/R}{\sqrt{1+Q^2\left(x-\dfrac1x\right)^2}}$$</div>
    \(I_m\) est maximale pour \(L\omega=1/(C\omega)\), c'est-à-dire en \(\omega=\omega_0\), <strong>quel que soit \(Q\)</strong> ; elle y vaut \(I_{\max}=E_m/R\), et le courant est en phase avec \(e\). La bande passante, intervalle où \(I_m\geq I_{\max}/\sqrt2\), a pour largeur exacte
    <div class="formula" data-nom="Bande passante du RLC série">$$\Delta\omega=\omega_2-\omega_1=\frac{\omega_0}Q\qquad\omega_1\omega_2=\omega_0^2$$</div>
    et la phase du courant y vaut \(\pm45^\circ\) à ses bornes. Plus \(Q\) est grand, plus la résonance est aiguë.
  </div>
  <p>La tension \(u_R=Ri\) est proportionnelle au courant : la résonance en intensité est celle du passe-bande RLC (sortie sur \(R\)), dont la bande passante est démontrée au §7 du chapitre <a href="#filtres/cours">« Régime sinusoïdal forcé et filtrage linéaire »</a>. C'est aussi l'analogue de la résonance en vitesse d'un oscillateur mécanique (<a href="#oscill/cours">« Oscillateurs harmoniques »</a>, §10).</p>

  <div class="prop-box">
    <strong>Résonance en tension aux bornes du condensateur.</strong> Diviseur de tension :
    <div class="formula" data-nom="Tension aux bornes du condensateur en régime forcé">$$\frac{\underline U_{Cm}}{\underline E_m}=\frac{1/(jC\omega)}{R+jL\omega+1/(jC\omega)}=\frac1{1-x^2+j\dfrac xQ}$$</div>
    <ul>
      <li>En \(\omega=\omega_0\) (\(x=1\)) : \(\underline U_{Cm}=-jQ\,E_m\), donc \(U_C(\omega_0)=Q\,E_m\) <strong>exactement, pour tout \(Q\)</strong>, avec un retard de \(\pi/2\) sur \(e\).</li>
      <li>\(U_C(\omega)\) passe par un maximum (supérieur à \(E_m\)) si et seulement si \(Q\gt1/\sqrt2\approx0{,}71\), à une pulsation un peu inférieure à \(\omega_0\) ; pour \(Q\gg1\), ce maximum vaut environ \(QE_m\), atteint pratiquement en \(\omega_0\) : c'est la <strong>surtension</strong>.</li>
      <li>Pour \(Q\leq1/\sqrt2\), \(U_C\) décroît sans maximum de \(E_m\) (basses fréquences : le condensateur est un interrupteur ouvert, toute la tension est à ses bornes) jusqu'à 0.</li>
    </ul>
  </div>

<figcaption>Amplitude de \(u_C\) rapportée à celle du générateur, en fonction de \(\omega/\omega_0\). En \(\omega_0\) (points), elle vaut exactement \(Q\), quel que soit \(Q\). Il y a résonance (maximum supérieur à 1) seulement si \(Q \gt 1/\sqrt2 \approx 0{,}71\), un peu avant \(\omega_0\) ; pour \(Q = 5\), le maximum vaut 5,03 et la tension aux bornes du condensateur est cinq fois celle du générateur : c'est la surtension. Pour \(Q \leq 1/\sqrt2\), l'amplitude décroît sans maximum. Aux hautes fréquences, \(u_C\) tend vers 0.</figcaption>
</figure>
  <p>C'est la fonction de transfert du passe-bas d'ordre 2 (sortie sur \(C\)) : son diagramme de Bode est tracé au §7 du chapitre « Régime sinusoïdal forcé et filtrage linéaire ». C'est l'analogue de la résonance en élongation d'un oscillateur mécanique. Le calcul exact de la pulsation du maximum n'est pas exigible (« Pour aller plus loin »).</p>
  <div class="method-box">
    <strong>Exemple — résonances du circuit du simulateur, \(E_m=2{,}0\ \text{V}\)</strong>
    <ol>
      <li>Intensité : \(I_{\max}=E_m/R=100\ \text{mA}\) à \(f_0=225\ \text{Hz}\) ; \(\Delta f=f_0/Q=63{,}7\ \text{Hz}\), entre \(f_1=f_0\left(\sqrt{1+\tfrac1{4Q^2}}-\tfrac1{2Q}\right)\approx195\ \text{Hz}\) et \(f_2\approx259\ \text{Hz}\) (on vérifie \(f_1f_2=f_0^2\)).</li>
      <li>Tension : \(U_C(f_0)=QE_m=3{,}54\times2{,}0\approx7{,}1\ \text{V}\) ; le maximum (7,14 V, à \(0{,}98\,f_0\)) en diffère de 1 %.</li>
      <li>Avec un circuit d'accord de radio (\(Q=100\)) attaqué par 10 mV, le condensateur reçoit 1 V : la résonance sélectionne une station <em>et</em> amplifie son signal.</li>
    </ol>
  </div>
  <p><strong>Déterminer \(\omega_0\) et \(Q\) sur des courbes expérimentales.</strong> La <strong>phase</strong> donne \(\omega_0\) sans ambiguïté : le courant (ou \(u_R\)) est en phase avec \(e\) en \(\omega_0\), et \(u_C\) est alors en quadrature retard. La <strong>largeur</strong> de la résonance en intensité donne \(Q=\omega_0/\Delta\omega=f_0/\Delta f\), les bornes étant repérées par \(I_{\max}/\sqrt2\) ou par une phase de \(\pm45^\circ\). Enfin \(U_C(\omega_0)/E_m=Q\). Mise en œuvre : §9.</p>
  <div class="notice"><strong>Erreur classique</strong> : dire que la résonance en tension a lieu en \(\omega_0\), ou qu'elle existe toujours. C'est vrai de la résonance en intensité ; pour \(u_C\), le maximum est un peu avant \(\omega_0\) et n'existe que si \(Q\gt1/\sqrt2\). Ce qui vaut toujours en \(\omega_0\), c'est \(U_C=QE_m\). Autre erreur : écrire \(\Delta\omega=\omega_0/Q\) pour la courbe de \(U_C\) ; la bande passante se définit sur l'intensité.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ASPECTS ÉNERGÉTIQUES</div>
  <h2>Stockage dans L et C, dissipation dans R</h2>
  <div class="intro">Le bilan de puissance du circuit s'écrit en une ligne : il explique l'amortissement du régime libre, l'énergie perdue pendant une charge et le sens énergétique du facteur de qualité.</div>
  <div class="prop-box">
    <strong>Bilan de puissance.</strong> On multiplie la loi des mailles \(e=Ri+L\dfrac{\mathrm{d}i}{\mathrm{d}t}+u_C\) par \(i\), en écrivant \(i=C\,\mathrm{d}u_C/\mathrm{d}t\) dans le dernier terme :
    <div class="formula" data-nom="Bilan de puissance du RLC">$$e\,i=Ri^2+\frac{\mathrm{d}\mathcal E}{\mathrm{d}t}\qquad\mathcal E=\tfrac12Li^2+\tfrac12Cu_C^2$$</div>
    La puissance fournie par le générateur sert à faire varier l'énergie stockée dans la bobine et le condensateur, et à compenser l'effet Joule \(Ri^2\geq0\).
  </div>
  <p><strong>Régime libre.</strong> Avec \(e=0\), \(\dfrac{\mathrm{d}\mathcal E}{\mathrm{d}t}=-Ri^2\leq0\) : l'énergie ne peut que décroître, et ne décroît plus quand le courant s'annule. Le circuit finit donc au repos (\(u_C=0\), \(i=0\)), ce qu'on prévoit sans résoudre l'équation. Pour \(Q\gg1\), l'énergie décroît en moyenne comme \(e^{-2t/\tau}\) et perd à chaque pseudo-période la fraction \(2\pi/Q\) :</p>
  <div class="formula" data-nom="Interprétation énergétique de Q">$$Q\approx2\pi\,\frac{\mathcal E}{|\Delta\mathcal E|_{\text{une période}}}\qquad(Q\gg1)$$</div>

<figcaption>Régime libre du circuit de la figure du §3 (\(R = 20\ \Omega\), \(Q = 3{,}5\)), condensateur chargé sous \(U_0 = 5\ \text{V}\) : \(\mathcal E_0 = \tfrac12CU_0^2 = 125\ \mu\text{J}\). L'énergie passe du condensateur à la bobine et revient, deux fois par pseudo-période. L'énergie totale ne fait que décroître, puisque \(\mathrm{d}\mathcal E/\mathrm{d}t = -Ri^2\) : vite quand le courant est grand, pas du tout quand il s'annule (paliers). En moyenne, elle suit \(\mathcal E_0\,e^{-2t/\tau}\) (tirets), deux fois plus vite que l'amplitude.</figcaption>
</figure>
  <p><strong>Régime forcé.</strong> La puissance moyenne reçue par la résistance vaut \(\langle\mathcal P_J\rangle=\tfrac12RI_m^2=RI_{\text{eff}}^2\). Elle est maximale à la résonance en intensité, où elle vaut \(E_m^2/(2R)\), et tombe à la moitié aux bornes de la bande passante (d'où le nom de bande passante « à demi-puissance »). En \(\omega_0\), l'énergie stockée reste constante, \(\mathcal E=\tfrac12LI_m^2\) (car \(1/(C\omega_0^2)=L\)), et la relation \(Q=2\pi\mathcal E/(\langle\mathcal P_J\rangle T_0)\) est <strong>exacte</strong>.</p>
  <div class="method-box">
    <strong>Exemple — pertes par période</strong>
    <ol>
      <li>Régime libre du circuit du simulateur (\(Q=3{,}54\)), \(U_0=5\ \text{V}\) : \(\mathcal E_0=\tfrac12CU_0^2=125\ \mu\text{J}\). Après une pseudo-période, il reste la fraction \(e^{-2T_p/\tau}\approx0{,}17\) : 83 % de l'énergie a été dissipée. Pour un \(Q\) aussi modeste, la formule \(2\pi/Q\approx1{,}8\) n'a plus de sens.</li>
      <li>Circuit d'accord avec \(Q=50\) : la perte par pseudo-période vaut 11,8 %, proche de \(2\pi/Q=12{,}6\ \%\).</li>
      <li>Régime forcé à \(f_0\), \(E_m=2\ \text{V}\) : \(I_m=0{,}10\ \text{A}\), \(\langle\mathcal P_J\rangle=0{,}10\ \text{W}\), \(\mathcal E=\tfrac12LI_m^2=250\ \mu\text{J}\), et \(2\pi\mathcal E/(\langle\mathcal P_J\rangle T_0)=2\pi\times250/444=3{,}54=Q\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que l'énergie totale oscille. Ce sont \(\tfrac12Cu_C^2\) et \(\tfrac12Li^2\) qui oscillent, en se l'échangeant ; leur somme, elle, ne fait que décroître en régime libre (figure). Autre erreur : écrire \(\langle Ri^2\rangle=RI_m^2\) ; la moyenne de \(\cos^2\) vaut 1/2.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ANALOGIE ÉLECTROMÉCANIQUE</div>
  <h2>Le même oscillateur sous deux habits</h2>
  <div class="intro">Le programme présente ensemble les oscillateurs électrique et mécanique : leurs équations sont identiques terme à terme. Le dictionnaire complet est au §8 du chapitre <a href="#oscill/cours">« Oscillateurs harmoniques »</a> ; on en retient l'essentiel, et la correspondance des deux résonances.</div>
  <div class="formula">$$L\ddot q+R\dot q+\frac qC=e(t)\qquad\longleftrightarrow\qquad m\ddot x+\alpha\dot x+kx=F(t)$$</div>
  <table>
    <tr><th>Électricité</th><th>Mécanique</th><th>Rôle</th></tr>
    <tr><td>charge \(q=Cu_C\)</td><td>position \(x\)</td><td>grandeur qui oscille</td></tr>
    <tr><td>intensité \(i=\dot q\)</td><td>vitesse \(v=\dot x\)</td><td>sa dérivée, continue</td></tr>
    <tr><td>\(L\), \(R\), \(1/C\)</td><td>\(m\), \(\alpha\), \(k\)</td><td>inertie, dissipation, rappel</td></tr>
    <tr><td>\(\tfrac12Li^2\), \(\tfrac12Cu_C^2\)</td><td>\(\tfrac12mv^2\), \(\tfrac12kx^2\)</td><td>énergies stockées</td></tr>
    <tr><td>\(Q=\tfrac1R\sqrt{L/C}\), \(\tau=2L/R\)</td><td>\(Q=\sqrt{km}/\alpha\), \(\tau=2m/\alpha\)</td><td>amortissement</td></tr>
    <tr><td>résonance en intensité</td><td>résonance en vitesse</td><td>toujours en \(\omega_0\), \(\Delta\omega=\omega_0/Q\)</td></tr>
    <tr><td>résonance de \(u_C=q/C\)</td><td>résonance en élongation</td><td>seulement si \(Q\gt1/\sqrt2\)</td></tr>
  </table>
  <div class="method-box">
    <strong>Exemple — jumeaux numériques</strong>
    <p>Masse \(m=0{,}40\ \text{kg}\), ressort de raideur \(k=1{,}0\times10^3\ \text{N·m}^{-1}\), frottement \(\alpha=4{,}0\ \text{kg·s}^{-1}\) : \(\omega_0=\sqrt{k/m}=50\ \text{rad·s}^{-1}\), \(Q=\sqrt{km}/\alpha=5{,}0\), \(\tau=2m/\alpha=0{,}20\ \text{s}\).</p>
    <ol>
      <li>Circuit jumeau : \(L=0{,}40\ \text{H}\), \(C=1/k=1{,}0\ \text{mF}\), \(R=4{,}0\ \Omega\) : \(\omega_0=1/\sqrt{0{,}40\times10^{-3}}=50\ \text{rad·s}^{-1}\), \(Q=\tfrac14\sqrt{400}=5{,}0\), \(\tau=0{,}20\ \text{s}\).</li>
      <li>Les deux systèmes ont les mêmes régimes libres, à l'échelle près : une courbe mesurée sur l'un prédit l'autre.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : associer \(C\) à la raideur \(k\). Un condensateur de grande capacité se charge sans « résister » : c'est un ressort mou. L'analogue de \(k\) est \(1/C\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · EXPLOITER DES RELEVÉS EXPÉRIMENTAUX</div>
  <h2>Mesurer ω₀ et Q en travaux pratiques</h2>
  <div class="intro">En TP, on observe le régime transitoire en appliquant un créneau, et la résonance en balayant la fréquence d'un générateur basse fréquence (GBF). Deux pièges reviennent toujours : la résistance du générateur et celle de la bobine, et les masses de l'oscilloscope.</div>
  <h3>Le régime transitoire</h3>
  <p><strong>Montage.</strong> Le GBF délivre un créneau entre 0 et \(E\) : chaque front montant est un échelon, chaque front descendant un régime libre. On choisit sa fréquence pour que la demi-période dépasse largement la durée du transitoire (quelques \(\tau\)). L'oscilloscope affiche \(e(t)\) sur une voie et \(u_C(t)\) sur l'autre ; ses deux voies ont une masse commune, reliée à celle du GBF : on place donc le condensateur du côté de la masse. Pour voir le courant, on observe \(u_R=Ri\) en plaçant \(R\) du côté de la masse.</p>
  <p><strong>Résistances parasites.</strong> La résistance du circuit n'est pas seulement \(R\) : il faut ajouter la résistance de sortie du GBF (souvent \(50\ \Omega\)) et la résistance \(r\) de la bobine (quelques ohms à quelques dizaines d'ohms). Elles diminuent \(Q\), parfois beaucoup.</p>

<figcaption>Un GBF délivre un créneau de 0 à 5 V à 20 Hz (gris) : chaque front est un échelon, et la demi-période (25 ms) laisse au transitoire le temps de s'éteindre. Avec \(R = 20\ \Omega\) seule (\(L = 50\ \text{mH}\), \(C = 10\ \mu\text{F}\)), \(Q = 3{,}5\) : oscillations bien visibles. En réalité, la résistance de sortie du GBF (\(50\ \Omega\)) et celle de la bobine (environ \(10\ \Omega\)) s'ajoutent : \(R\) totale \(= 80\ \Omega\), \(Q = 0{,}88\) : un seul dépassement visible, de 12 %.</figcaption>
</figure>
  <p><strong>Exploitation.</strong> On mesure la pseudo-période \(T_p\) et deux maximums successifs de l'écart à la valeur finale (\(u_C-E\) pour un échelon, \(u_C\) pour un régime libre). Leur rapport vaut \(e^{T_p/\tau}\), d'où le décrément logarithmique et le facteur de qualité (<a href="#oscill/cours">« Oscillateurs harmoniques »</a>, §6) :</p>
  <div class="formula" data-nom="Facteur de qualité par le décrément">$$\delta=\ln\frac{x_n}{x_{n+1}}=\frac{T_p}\tau\qquad Q=\frac12\sqrt{1+\left(\frac{2\pi}\delta\right)^2}\approx\frac\pi\delta$$</div>
  <div class="formula">$$\omega_0=\frac{\omega_p}{\sqrt{1-1/(4Q^2)}}\qquad\omega_p=\frac{2\pi}{T_p}$$</div>
  <div class="method-box">
    <strong>Exemple — retrouver la résistance cachée</strong>
    <p>Bobine \(L=0{,}10\ \text{H}\), condensateur \(C=1{,}0\ \mu\text{F}\), sans conducteur ohmique ajouté ; créneau de 0 à \(E=2{,}0\ \text{V}\). Les deux premiers maximums de \(u_C\) valent 3,47 V et 2,79 V, séparés de 2,0 ms.</p>
    <ol>
      <li>\(\delta=\ln\dfrac{3{,}47-2{,}0}{2{,}79-2{,}0}=\ln1{,}86\approx0{,}62\), donc \(Q=\tfrac12\sqrt{1+(2\pi/0{,}62)^2}\approx5{,}1\).</li>
      <li>\(\omega_p=2\pi/T_p\approx3\,140\ \text{rad·s}^{-1}\) et \(\omega_0\approx3\,160\ \text{rad·s}^{-1}\), conforme à \(1/\sqrt{LC}=3\,162\ \text{rad·s}^{-1}\).</li>
      <li>Résistance totale : \(L\omega_0/Q\approx62\ \Omega\). Elle est due au GBF (\(50\ \Omega\)) et à la bobine (\(r\approx12\ \Omega\)) : sans elles, le circuit n'aurait presque pas d'amortissement.</li>
    </ol>
  </div>
  <h3>La résonance</h3>
  <p>On alimente le circuit par une tension sinusoïdale d'amplitude constante et l'on balaie la fréquence. L'amplitude de \(u_R\) donne celle du courant ; le déphasage entre \(u_R\) et \(e\) se mesure par le décalage temporel (\(\varphi=2\pi\,\Delta t/T\)) ou par la méthode de Lissajous (mode XY : l'ellipse devient un segment à la résonance). On repère \(f_0\) (phase nulle, amplitude maximale), puis \(f_1\) et \(f_2\) (amplitude divisée par \(\sqrt2\), phase \(\pm45^\circ\)).</p>
  <div class="method-box">
    <strong>Exemple — une courbe de résonance mesurée</strong>
    <ol>
      <li>On relève \(f_1=2{,}02\ \text{kHz}\) et \(f_2=2{,}51\ \text{kHz}\) : \(f_0=\sqrt{f_1f_2}\approx2{,}25\ \text{kHz}\), \(\Delta f=0{,}49\ \text{kHz}\), \(Q=f_0/\Delta f\approx4{,}6\).</li>
      <li>Si \(e\) est mesurée aux bornes du générateur (après sa résistance interne) et \(R=100\ \Omega\), l'amplitude de \(u_R\) à la résonance vaut \(E_mR/(R+r)\) : un rapport mesuré de 0,89 donne \(r\approx12\ \Omega\) pour la bobine.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : brancher l'oscilloscope aux bornes d'un composant qui n'est pas relié à la masse. Les masses du GBF et de l'oscilloscope étant reliées (par la terre), on court-circuite alors une partie du montage. Autre erreur : oublier la résistance de sortie du GBF dans le calcul de \(Q\), puis s'étonner de ne voir qu'une oscillation.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · SIMULATION NUMÉRIQUE</div>
  <h2>Résoudre l'équation du circuit avec Python</h2>
  <div class="intro">Pour une tension \(e(t)\) quelconque, ou pour suivre l'établissement d'un régime forcé, on résout l'équation numériquement. Une équation d'ordre 2 devient un système de deux équations d'ordre 1, dont l'inconnue est le couple \((u_C,i)\) des deux grandeurs continues du circuit.</div>
  <div class="prop-box">
    <strong>Vecteur d'état.</strong> La loi des mailles et la relation du condensateur s'écrivent
    <div class="formula" data-nom="Système d'ordre 1 du RLC">$$\frac{\mathrm{d}u_C}{\mathrm{d}t}=\frac iC\qquad\frac{\mathrm{d}i}{\mathrm{d}t}=\frac{e(t)-Ri-u_C}L$$</div>
    On les résout avec la fonction <code>odeint</code> de <code>scipy.integrate</code> (spécification fournie), ou par la méthode d'Euler appliquée au couple : principe et précautions dans les chapitres <a href="#pynum/cours">« Méthodes numériques »</a> (§6, §7) et <a href="#premierordre/cours">« Circuit linéaire du premier ordre »</a> (§9).
  </div>
  <p>Le programme suivant excite le circuit du simulateur, au repos, par \(e=E_m\cos(\omega_0t)\) à partir de \(t=0\), et suit \(u_C\) pendant six constantes de temps ; il refait le calcul par la méthode d'Euler pour trois pas.</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">from</span> scipy.integrate <span class="kw">import</span> odeint

R, L, C = 20.0, 50e-3, 10e-6      <span class="cmt"># ohm, henry, farad</span>
w0 = 1 / np.sqrt(L * C)           <span class="cmt"># pulsation propre (rad/s)</span>
Q = np.sqrt(L / C) / R            <span class="cmt"># facteur de qualité</span>
tau = 2 * L / R                   <span class="cmt"># constante de temps (s)</span>
Em = 1.0                          <span class="cmt"># amplitude de e(t) (V)</span>

<span class="kw">def</span> e(t):
    <span class="str">"""Tension du générateur, appliquée à partir de t = 0."""</span>
    <span class="kw">return</span> Em * np.cos(w0 * t)

<span class="kw">def</span> F(Y, t):
    <span class="str">"""Dérivée de Y = [uC, i] ; ordre (Y, t) imposé par odeint."""</span>
    uC, i = Y
    <span class="kw">return</span> [i / C, (e(t) - R * i - uC) / L]

t = np.linspace(0, 6 * tau, 3001)  <span class="cmt"># six constantes de temps</span>
sol = odeint(F, [0.0, 0.0], t)     <span class="cmt"># au repos : uC = 0 et i = 0</span>
uC = sol[:, 0]

<span class="cmt"># valeur attendue Q*Em, amplitude atteinte au-delà de 5 tau</span>
print(round(Q * Em, 3), round(np.max(np.abs(uC[t &gt; 5 * tau])), 3))
<span class="cmt"># premier instant où |uC| atteint 95 % de Q*Em, en unités de tau</span>
k = np.argmax(np.abs(uC) &gt;= 0.95 * Q * Em)
print(round(t[k] / tau, 2))

<span class="kw">def</span> euler(N):
    <span class="str">"""uC à t = 6 tau par la méthode d'Euler, pas h = T0/N."""</span>
    h = 2 * np.pi / w0 / N
    u, i = 0.0, 0.0
    <span class="kw">for</span> k <span class="kw">in</span> range(round(6 * tau / h)):
        <span class="cmt"># affectation multiple : anciennes valeurs à droite</span>
        u, i = u + h * i / C, i + h * (e(k * h) - R * i - u) / L
    <span class="kw">return</span> float(u)

print(round(float(uC[-1]), 3))
print([round(euler(N), 3) <span class="kw">for</span> N <span class="kw">in</span> (200, 2000, 20000)])</pre>
  <p>Le programme, exécuté tel quel, affiche :</p>
  <pre class="codeblock">3.536 3.527
3.31
-3.527
[-3.959, -3.566, -3.531]</pre>
  <ul>
    <li>Après \(5\tau\), l'amplitude atteinte (3,527 V) ne diffère plus que de 0,3 % de la valeur \(QE_m=3{,}536\ \text{V}\) du régime forcé ; 95 % de cette valeur sont atteints à \(3{,}3\tau\) : le transitoire dure quelques \(\tau\), comme au §4.</li>
    <li>La méthode d'Euler donne \(-3{,}96\) ; \(-3{,}57\) ; \(-3{,}53\ \text{V}\) au lieu de \(-3{,}527\ \text{V}\) avec 200, 2 000 et 20 000 pas par période : une erreur de 12 %, 1,1 %, 0,1 %, divisée par 10 quand le pas l'est (méthode d'ordre 1). Euler sous-estime l'amortissement : il faut un pas très petit devant \(T_0\) et devant \(\tau\).</li>
  </ul>

  <h2>Maximum de la surtension, circuit bouchon, puissance</h2>
  <div class="intro">Trois prolongements, utiles pour comprendre et parfois rencontrés en problème, mais non exigibles en PTSI.</div>
  <p><strong>Pulsation de résonance en tension.</strong> \(U_C\) est maximale quand \((1-x^2)^2+x^2/Q^2\) est minimal, soit pour \(x^2=1-\dfrac1{2Q^2}\) (possible si \(Q\gt1/\sqrt2\)) : \(\omega_r=\omega_0\sqrt{1-\dfrac1{2Q^2}}\), et \(U_{C,\max}=\dfrac{QE_m}{\sqrt{1-1/(4Q^2)}}\). Pour le circuit du simulateur, \(\omega_r=0{,}980\,\omega_0\) et \(U_{C,\max}=7{,}14\ \text{V}\) pour \(E_m=2\ \text{V}\).</p>
  <p><strong>Circuit RLC parallèle (« bouchon »).</strong> Une bobine et un condensateur en parallèle ont une admittance \(jC\omega+1/(jL\omega)\), nulle en \(\omega_0\) : l'impédance de l'ensemble y devient très grande. Alimenté par une source de courant, ce circuit présente une résonance en tension en \(\omega_0\) ; c'est le circuit d'accord des récepteurs et des oscillateurs radio.</p>
  <p><strong>Puissance moyenne et facteur de puissance.</strong> Le générateur fournit en moyenne \(\langle ei\rangle=\tfrac12E_mI_m\cos\varphi\), où \(\varphi\) est le déphasage entre \(e\) et \(i\) ; le bilan du §7 montre qu'elle est égale à \(\tfrac12RI_m^2\). Le « facteur de puissance » \(\cos\varphi\) vaut 1 à la résonance. Ces notions sont développées en sciences industrielles (puissances active et réactive).</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · RLC</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 1.4 du programme, côté électrique : mettre le circuit en équation, identifier \(\omega_0\) et \(Q\), trouver les conditions initiales, résoudre un régime libre ou un échelon, faire un bilan d'énergie, traiter le régime forcé et la résonance, exploiter des mesures, simuler. Notations : \(\omega_0=1/\sqrt{LC}\), \(Q=\tfrac1R\sqrt{L/C}\), \(\tau=2Q/\omega_0=2L/R\), pseudo-pulsation \(\omega_p\), amplitude complexe \(\underline X_m\).</div>

  <div class="method-box"><strong>Méthode 1 — Établir l'équation et identifier ω₀ et Q</strong>
    <ol>
      <li><span class="step">Orientations.</span> Orienter le courant \(i\) dans la maille ; tensions des dipôles en convention récepteur, celle du générateur en convention générateur.</li>
      <li><span class="step">Loi des mailles.</span> \(e=Ri+L\,\mathrm{d}i/\mathrm{d}t+u_C\), puis \(i=C\,\mathrm{d}u_C/\mathrm{d}t\) pour n'avoir que \(u_C\) (grandeur continue).</li>
      <li><span class="step">Forme canonique.</span> Diviser par \(LC\) : \(\ddot u_C+\dfrac{\omega_0}Q\dot u_C+\omega_0^2u_C=\omega_0^2e\). Lire \(\omega_0^2\) devant \(u_C\), puis \(\omega_0/Q\) (ici \(R/L\)) devant \(\dot u_C\).</li>
      <li><span class="step">Contrôle.</span> \(Q\) sans dimension et décroissant avec \(R\) ; \(\sqrt{L/C}\) est en ohms.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(R=50\ \Omega\), \(L=0{,}20\ \text{H}\), \(C=2{,}0\ \mu\text{F}\) : \(\omega_0=1/\sqrt{4\times10^{-7}}\approx1\,581\ \text{rad·s}^{-1}\) (\(f_0\approx252\ \text{Hz}\)), \(Q=\sqrt{10^5}/50\approx6{,}3\), \(\tau=2L/R=8{,}0\ \text{ms}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Prévoir le régime et la résistance critique</strong>
    <ol>
      <li><span class="step">Comparer</span> \(Q\) à 1/2, ou \(R\) à la résistance critique \(R_c=2\sqrt{L/C}\).</li>
      <li><span class="step">Conclure.</span> \(R\lt R_c\) (\(Q\gt1/2\)) : pseudo-périodique, environ \(Q\) oscillations visibles ; \(R=R_c\) : critique, retour le plus rapide sans dépassement ; \(R\gt R_c\) : apériodique.</li>
      <li><span class="step">Durée.</span> Quelques \(\tau=2Q/\omega_0\) si \(Q\gg1\) ; \(\approx3/(Q\omega_0)\) si \(Q\ll1\) ; quelques \(1/\omega_0\) au voisinage du critique.</li>
    </ol>
    <p><em>Exemple éclair :</em> circuit de la méthode 1 : \(R_c=2\sqrt{10^5}\approx632\ \Omega\). Avec 50 Ω, le circuit oscille (\(Q=6{,}3\)) et se stabilise en \(3\tau\approx24\ \text{ms}\) ; pour un retour sans oscillation, il faut ajouter au moins 580 Ω.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Trouver les conditions initiales à t = 0⁺</strong>
    <ol>
      <li><span class="step">Avant.</span> Déterminer \(u_C(0^-)\) et \(i(0^-)\) (régime permanent continu : condensateur ouvert, bobine fil).</li>
      <li><span class="step">Continuités.</span> \(u_C(0^+)=u_C(0^-)\) et \(i(0^+)=i(0^-)\) (le courant de la bobine est celui de la maille).</li>
      <li><span class="step">Dérivées.</span> \(\dot u_C(0^+)=i(0^+)/C\) ; \(\mathrm{d}i/\mathrm{d}t(0^+)\) par la loi des mailles écrite à \(0^+\).</li>
    </ol>
    <p><em>Exemple éclair :</em> avant \(t=0\), un courant \(I_0=20\ \text{mA}\) traverse la bobine et le condensateur (\(C=10\ \mu\text{F}\)) est déchargé. Alors \(u_C(0^+)=0\), \(i(0^+)=20\ \text{mA}\) et \(\dot u_C(0^+)=I_0/C=2\,000\ \text{V·s}^{-1}\) : la tangente n'est pas horizontale.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(\dot u_C(0^+)=0\) sans avoir vérifié que \(i(0^+)=0\), ou appliquer la continuité à \(i_C\) dans un circuit RC (le courant d'un condensateur peut sauter). Seules \(u_C\) et le courant des bobines sont continus.</div>

  <div class="method-box"><strong>Méthode 4 — Résoudre un régime libre ou une réponse à un échelon</strong>
    <ol>
      <li><span class="step">Solution particulière.</span> Constante, obtenue en annulant les dérivées : \(u_C=E\) pour un échelon, 0 en régime libre.</li>
      <li><span class="step">Solution homogène</span> selon le régime : \(e^{-t/\tau}(A\cos\omega_pt+B\sin\omega_pt)\), \((A+Bt)e^{-\omega_0t}\) ou \(Ae^{r_1t}+Be^{r_2t}\).</li>
      <li><span class="step">Constantes</span> \(A\), \(B\) par les deux conditions initiales (méthode 3), appliquées à la solution <em>complète</em>.</li>
      <li><span class="step">Contrôle.</span> Valeurs en \(t=0\) et limite en \(t\to\infty\) ; courant par \(i=C\,\dot u_C\).</li>
    </ol>
    <p><em>Exemple éclair :</em> échelon \(E=10\ \text{V}\), \(R=40\ \Omega\), \(L=0{,}10\ \text{H}\), \(C=10\ \mu\text{F}\) : \(\omega_0=1\,000\ \text{rad·s}^{-1}\), \(Q=2{,}5\), \(\tau=5{,}0\ \text{ms}\), \(\omega_p\approx980\ \text{rad·s}^{-1}\). \(A=-E\), \(B=-E/(\omega_p\tau)\approx-2{,}0\ \text{V}\) ; premier maximum \(E(1+D)\) avec \(D=e^{-\pi/\sqrt{24}}\approx0{,}53\), soit 15,3 V à \(t=T_p/2\approx3{,}2\ \text{ms}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Faire un bilan d'énergie</strong>
    <ol>
      <li><span class="step">Puissances.</span> Multiplier la loi des mailles par \(i\) : \(ei=Ri^2+\dfrac{\mathrm{d}}{\mathrm{d}t}\left(\tfrac12Li^2+\tfrac12Cu_C^2\right)\).</li>
      <li><span class="step">Intégrer</span> entre l'état initial et l'état final : énergie fournie = variation de l'énergie stockée + énergie dissipée par effet Joule.</li>
      <li><span class="step">Utiliser</span> les états initial et final seulement, sans résoudre l'équation : \(\int_0^\infty i\,\mathrm{d}t=\Delta q=C\,\Delta u_C\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un condensateur de \(10\ \mu\text{F}\) chargé sous 10 V se décharge dans une bobine et une résistance : toute son énergie, \(\tfrac12CU_0^2=0{,}50\ \text{mJ}\), finit en chaleur dans la résistance, quelle que soit sa valeur et quel que soit le régime.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer l'impédance et l'amplitude du courant en régime forcé</strong>
    <ol>
      <li><span class="step">Impédance.</span> \(\underline Z=R+j(L\omega-1/(C\omega))=R\left[1+jQ\left(x-1/x\right)\right]\), \(x=\omega/\omega_0\) (outils : chapitre « Régime sinusoïdal forcé et filtrage linéaire », §1-§3).</li>
      <li><span class="step">Courant.</span> \(\underline I_m=\underline E_m/\underline Z\) : \(I_m=E_m/|\underline Z|\), déphasage \(\varphi=-\arg\underline Z\) par rapport à \(e\).</li>
      <li><span class="step">Tensions.</span> \(\underline U_{Rm}=R\underline I_m\), \(\underline U_{Lm}=jL\omega\,\underline I_m\), \(\underline U_{Cm}=\underline I_m/(jC\omega)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> circuit de la méthode 1 à \(\omega=2\omega_0\) : \(\underline Z=50\left[1+j\times6{,}32\times1{,}5\right]\), soit \(|\underline Z|\approx477\ \Omega\) et \(\arg\underline Z\approx+84^\circ\) : circuit inductif, courant en retard de 84°, \(I_m\approx2{,}1\ \text{mA}\) pour \(E_m=1\ \text{V}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Étudier une résonance</strong>
    <ol>
      <li><span class="step">Intensité.</span> Maximum en \(\omega_0\) pour tout \(Q\) : \(I_{\max}=E_m/R\), courant en phase avec \(e\) ; bande passante \(\Delta\omega=\omega_0/Q\), phase \(\pm45^\circ\) à ses bornes.</li>
      <li><span class="step">Tension \(u_C\).</span> \(\underline U_{Cm}/\underline E_m=1/(1-x^2+jx/Q)\) : \(U_C(\omega_0)=QE_m\) exactement ; maximum seulement si \(Q\gt1/\sqrt2\), un peu avant \(\omega_0\), voisin de \(QE_m\) si \(Q\gg1\).</li>
      <li><span class="step">Sens physique.</span> Surtension : les composants doivent supporter \(QE_m\).</li>
    </ol>
    <p><em>Exemple éclair :</em> circuit de la méthode 1, \(E_m=1{,}0\ \text{V}\) : \(I_{\max}=20\ \text{mA}\) à 252 Hz, \(\Delta f=f_0/Q\approx40\ \text{Hz}\), \(U_C(f_0)\approx6{,}3\ \text{V}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre les deux résonances. L'intensité résonne toujours, et en \(\omega_0\) ; la tension du condensateur ne résonne que si \(Q\gt1/\sqrt2\), et pas exactement en \(\omega_0\). La bande passante \(\omega_0/Q\) se lit sur la courbe d'intensité.</div>

  <div class="method-box"><strong>Méthode 8 — Déterminer ω₀ et Q à partir de relevés</strong>
    <ol>
      <li><span class="step">Transitoire.</span> Mesurer \(T_p\) et deux maximums successifs de l'écart à la valeur finale ; \(\delta=\ln(x_n/x_{n+1})\), \(Q=\tfrac12\sqrt{1+(2\pi/\delta)^2}\approx\pi/\delta\), \(\omega_0=\omega_p/\sqrt{1-1/(4Q^2)}\).</li>
      <li><span class="step">Résonance.</span> \(f_0\) où le courant est en phase avec \(e\) (Lissajous : segment) ; \(f_1\), \(f_2\) à \(I_{\max}/\sqrt2\) ou à \(\pm45^\circ\) ; \(Q=f_0/(f_2-f_1)\), \(f_0=\sqrt{f_1f_2}\).</li>
      <li><span class="step">Composants.</span> Connaissant \(L\) ou \(C\), en déduire l'autre par \(\omega_0\), puis la résistance totale \(L\omega_0/Q\).</li>
    </ol>
    <p><em>Exemple éclair :</em> régime libre, maximums de 4,0 V puis 1,5 V séparés de 5,0 ms : \(\delta=\ln(4/1{,}5)\approx0{,}98\), \(Q\approx3{,}2\), \(\omega_p=1\,257\ \text{rad·s}^{-1}\), \(\omega_0\approx1\,272\ \text{rad·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Dimensionner un circuit en tenant compte des résistances parasites</strong>
    <ol>
      <li><span class="step">Cahier des charges</span> : \(f_0\) et \(Q\) (ou \(\Delta f\)) voulus, \(L\) imposée.</li>
      <li><span class="step">Capacité</span> \(C=1/(L\omega_0^2)\) ; <span class="step">résistance totale</span> \(R_{\text{tot}}=L\omega_0/Q\).</li>
      <li><span class="step">Résistance à ajouter</span> : \(R_{\text{tot}}\) moins la résistance de la bobine et celle de sortie du générateur (50 Ω). Si le résultat est négatif, le \(Q\) voulu est impossible avec ce matériel.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f_0=500\ \text{Hz}\), \(Q=5\), \(L=0{,}20\ \text{H}\) (\(r=15\ \Omega\)) : \(C=507\ \text{nF}\), \(R_{\text{tot}}=126\ \Omega\), donc une résistance de 61 Ω avec un GBF de 50 Ω.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Simuler le circuit avec Python</strong>
    <ol>
      <li><span class="step">État.</span> Prendre \(Y=[u_C,i]\), les deux grandeurs continues ; écrire \(\dot u_C=i/C\) et \(\dot i=(e(t)-Ri-u_C)/L\).</li>
      <li><span class="step">odeint.</span> Définir <code>F(Y, t)</code> (dans cet ordre), puis <code>odeint(F, [uC0, i0], t)</code> ; la colonne 0 donne \(u_C\), la colonne 1 donne \(i\).</li>
      <li><span class="step">Euler.</span> <code>u, i = u + h*i/C, i + h*(e(t) - R*i - u)/L</code>, avec un pas très petit devant \(T_0\) et \(\tau\).</li>
      <li><span class="step">Valider</span> sur un cas connu (échelon, \(QE_m\) à la résonance), puis diviser le pas par 10 pour vérifier.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec 200 pas par période, Euler surestime de 12 % l'amplitude du régime forcé à \(\omega_0\) du circuit du simulateur ; avec 2 000 pas, de 1,1 % (cours, §10).</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : oublier la résistance du GBF et de la bobine (le \(Q\) mesuré est plus faible que prévu) ; additionner des amplitudes de tensions déphasées ; confondre la pseudo-pulsation \(\omega_p\), la pulsation propre \(\omega_0\) et la pulsation \(\omega\) imposée par le générateur (en régime forcé, le circuit vibre à \(\omega\)) ; prendre une enveloppe en \(e^{-t/(2\tau)}\) : avec \(\tau=2L/R\), l'amplitude décroît en \(e^{-t/\tau}\) et l'énergie en \(e^{-2t/\tau}\).</div>
</div>
</template>
