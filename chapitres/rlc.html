<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Identification de régime</h3>
  <div class="statement">Un circuit RLC série possède \(R=100\ \Omega\), \(L=100\ \text{mH}\), \(C=1{,}0\ \mu\text{F}\). Le condensateur est initialement chargé sous \(U_0=5{,}0\ \text{V}\), aucun courant ne circule ; à \(t=0\), on ferme l'interrupteur (régime libre).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_0\) et \(Q\).</div>
  <div class="q"><strong>Q2.</strong> En déduire le régime, la constante de temps \(\tau\) et la pseudo-période \(T_p\).</div>
  <div class="q"><strong>Q3.</strong> Donner l'allure de \(u_C(t)\) en précisant les valeurs initiales de \(u_C\) et de sa dérivée.</div>
  <div class="q"><strong>Q4.</strong> Quelle résistance faudrait-il pour obtenir le régime critique ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0=1/\sqrt{LC}=1/\sqrt{10^{-7}}\approx3\,162\ \text{rad·s}^{-1}\) ; \(Q=\dfrac1R\sqrt{\dfrac LC}=\dfrac{1}{100}\sqrt{10^5}\approx3{,}16\).</p>
    <p><strong>Q2.</strong> \(Q\gt1/2\) : régime pseudo-périodique. \(\tau=2L/R=2{,}0\ \text{ms}\) ; \(\omega_p=\omega_0\sqrt{1-1/(4Q^2)}\), soit \(\omega_0\sqrt{0{,}975}\approx3\,122\ \text{rad·s}^{-1}\), \(T_p=2\pi/\omega_p\approx2{,}01\ \text{ms}\).</p>
    <p><strong>Q3.</strong> Continuités : \(u_C(0^+)=U_0=5{,}0\ \text{V}\) et \(i(0^+)=0\), donc \(\dot u_C(0^+)=i(0^+)/C=0\) : tangente horizontale au départ. Ensuite, oscillations de pseudo-période 2,0 ms dans une enveloppe \(\pm U_0e^{-t/\tau}\) ; deux maximums successifs sont dans le rapport \(e^{T_p/\tau}\approx2{,}7\) ; \(u_C\) tend vers 0 en une dizaine de millisecondes (environ \(Q\approx3\) oscillations visibles).</p>
    <p><strong>Q4.</strong> \(Q=1/2\) pour \(R_c=2\sqrt{L/C}\approx632\ \Omega\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Résolution complète d'un régime libre</h3>
  <div class="statement">RLC série avec \(R=20\ \Omega\), \(L=10\ \text{mH}\), \(C=10\ \mu\text{F}\). À \(t=0\), \(u_C=U_0=10\ \text{V}\) et \(i=0\) ; le circuit ne comporte pas de générateur (\(e=0\)).</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle vérifiée par \(u_C(t)\).</div>
  <div class="q"><strong>Q2.</strong> Identifier le régime et donner la forme de la solution.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les constantes à l'aide des conditions initiales.</div>
  <div class="q"><strong>Q4.</strong> Calculer la pseudo-période \(T_p\) et comparer à \(T_0\).</div>
  <div class="q"><strong>Q5.</strong> En déduire l'intensité \(i(t)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Loi des mailles : \(0=Ri+L\dot i+u_C\) avec \(i=C\dot u_C\), d'où \(\ddot u_C+\dfrac RL\dot u_C+\dfrac1{LC}u_C=0\).</p>
    <p><strong>Q2.</strong> \(\omega_0=1/\sqrt{10^{-7}}\approx3\,162\ \text{rad·s}^{-1}\) ; \(Q=L\omega_0/R\approx1{,}58\gt1/2\) : pseudo-périodique. \(u_C(t)=e^{-t/\tau}(A\cos\omega_pt+B\sin\omega_pt)\), avec \(\tau=2L/R=1{,}0\ \text{ms}\) et, comme \(Q^2=2{,}5\), \(\omega_p=\omega_0\sqrt{1-1/(4Q^2)}\), soit \(\omega_0\sqrt{0{,}9}=3\,000\ \text{rad·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(u_C(0)=U_0\) donne \(A=10\ \text{V}\). \(\dot u_C(0)=-A/\tau+B\omega_p=i(0)/C=0\) donne \(B=\dfrac{A}{\omega_p\tau}=\dfrac{10}{3}\approx3{,}33\ \text{V}\).</p>
    <p><strong>Q4.</strong> \(T_p=2\pi/\omega_p\approx2{,}09\ \text{ms}\), contre \(T_0=2\pi/\omega_0\approx1{,}99\ \text{ms}\) : avec un \(Q\) aussi modeste, l'écart (5 %) n'est plus négligeable.</p>
    <p><strong>Q5.</strong> En dérivant (ou par le résultat du cours) : \(i=C\dot u_C=-\dfrac{U_0}{L\omega_p}\,e^{-t/\tau}\sin\omega_pt\), avec \(U_0/(L\omega_p)\approx0{,}33\ \text{A}\). Le signe moins traduit la décharge : le courant circule en sens inverse de l'orientation choisie au début.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Résonance en intensité</h3>
  <div class="statement">Un GBF délivre \(e(t)=E_m\cos(\omega t)\), avec \(E_m=5{,}0\ \text{V}\), à un circuit RLC série (\(R=50\ \Omega\), \(L=20\ \text{mH}\), \(C=50\ \text{nF}\)). On néglige la résistance du GBF.</div>
  <div class="q"><strong>Q1.</strong> Donner l'expression de l'amplitude \(I_m\) de l'intensité en fonction de \(\omega\).</div>
  <div class="q"><strong>Q2.</strong> À quelle pulsation \(I_m\) est-elle maximale ? Calculer cette pulsation, la fréquence correspondante et la valeur maximale.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(Q\) et la bande passante \(\Delta\omega\). Montrer que \(\Delta\omega=R/L\).</div>
  <div class="q"><strong>Q4.</strong> Quelle est l'amplitude de \(u_C\) à la résonance en intensité ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(I_m=E_m/|\underline Z|\), soit \(I_m(\omega)=\dfrac{E_m}{\sqrt{R^2+\left(L\omega-\dfrac1{C\omega}\right)^2}}\).</p>
    <p><strong>Q2.</strong> Le dénominateur est minimal quand \(L\omega=1/(C\omega)\) : \(LC=10^{-9}\ \text{s}^2\), donc \(\omega_0=1/\sqrt{LC}\approx3{,}16\times10^4\ \text{rad·s}^{-1}\), soit \(f_0\approx5{,}0\ \text{kHz}\). \(I_{\max}=E_m/R=0{,}10\ \text{A}\).</p>
    <p><strong>Q3.</strong> \(Q=L\omega_0/R\approx12{,}6\) ; \(\Delta\omega=\omega_0/Q=2\,500\ \text{rad·s}^{-1}\) (\(\Delta f\approx400\ \text{Hz}\)). En effet \(\omega_0/Q=\omega_0R/(L\omega_0)=R/L\) : la bande passante ne dépend pas de \(C\).</p>
    <p><strong>Q4.</strong> \(U_C(\omega_0)=QE_m\approx63\ \text{V}\) : le condensateur doit supporter plus de douze fois la tension du générateur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Dimensionnement d'un filtre passe-bande</h3>
  <div class="statement">On souhaite réaliser un filtre passe-bande RLC série centré sur \(f_0=1{,}0\ \text{kHz}\), de bande passante \(\Delta f=100\ \text{Hz}\). On dispose d'une bobine \(L=100\ \text{mH}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la valeur de \(C\) à choisir.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(Q\), puis la résistance totale du circuit.</div>
  <div class="q"><strong>Q3.</strong> La bobine a une résistance \(r=5\ \Omega\). Quelle résistance ajouter ?</div>
  <div class="q"><strong>Q4.</strong> Le circuit est alimenté par un GBF de résistance de sortie \(50\ \Omega\). Que devient la réponse ? Quelle bande passante obtiendrait-on en oubliant ce point avec la résistance de Q3 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0=2\pi f_0\approx6\,283\ \text{rad·s}^{-1}\) ; \(C=1/(L\omega_0^2)=1/(0{,}1\times6\,283^2)\approx253\ \text{nF}\).</p>
    <p><strong>Q2.</strong> \(Q=f_0/\Delta f=10\) ; \(R_{\text{tot}}=L\omega_0/Q=0{,}1\times6\,283/10\approx62{,}8\ \Omega\).</p>
    <p><strong>Q3.</strong> \(R_{\text{ext}}+r=62{,}8\ \Omega\), donc \(R_{\text{ext}}\approx57{,}8\ \Omega\).</p>
    <p><strong>Q4.</strong> La résistance du GBF est en série : il ne faut plus ajouter que \(62{,}8-5-50\approx7{,}8\ \Omega\). Avec 57,8 Ω, la résistance totale serait \(112{,}8\ \Omega\), \(Q=L\omega_0/R_{\text{tot}}\approx5{,}6\) et \(\Delta f\approx180\ \text{Hz}\) : un filtre presque deux fois moins sélectif que prévu.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Surtension à la résonance</h3>
  <div class="statement">RLC série avec \(R=10\ \Omega\), \(L=100\ \text{mH}\), \(C=100\ \text{nF}\), alimenté par \(e=E_m\cos(\omega t)\), \(E_m=1{,}0\ \text{V}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_0\), \(f_0\) et \(Q\).</div>
  <div class="q"><strong>Q2.</strong> Par un diviseur de tension, écrire \(\underline U_{Cm}/\underline E_m\).</div>
  <div class="q"><strong>Q3.</strong> Que vaut l'amplitude de \(u_C\) en \(\omega_0\) ? Conclure.</div>
  <div class="q"><strong>Q4.</strong> Que vaut-elle si la fréquence s'écarte de 1 % de \(f_0\) ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0=1/\sqrt{10^{-1}\times10^{-7}}=1{,}0\times10^4\ \text{rad·s}^{-1}\), \(f_0\approx1{,}59\ \text{kHz}\), \(Q=L\omega_0/R=100\) : circuit très peu amorti.</p>
    <p><strong>Q2.</strong> Diviseur de tension :</p>
    <div class="formula">$$\frac{\underline U_{Cm}}{\underline E_m}=\frac{1/(jC\omega)}{R+j(L\omega-1/(C\omega))}=\frac{1}{1-LC\omega^2+jRC\omega}$$</div>
    <p><strong>Q3.</strong> En \(\omega_0\), \(1-LC\omega_0^2=0\) : \(U_C=E_m/(RC\omega_0)=QE_m=100\ \text{V}\). Le maximum de \(U_C\), un peu avant \(\omega_0\), n'en diffère que de \(10^{-5}\) en valeur relative. Avec 1 V à l'entrée, le condensateur reçoit 100 V : il faut un composant prévu pour cette tension.</p>
    <p><strong>Q4.</strong> Pour \(x=1{,}01\) : \(|1-x^2+jx/Q|=|-0{,}0201+0{,}0101j|\), soit 0,0225, donc \(U_C\approx44\ \text{V}\). La résonance est si aiguë (\(\Delta f=f_0/Q\approx16\ \text{Hz}\)) qu'un écart de 16 Hz divise la surtension par plus de deux : à fort \(Q\), le réglage de la fréquence est délicat.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Réponse à un échelon : cas pseudo-périodique</h3>
  <div class="statement">À \(t=0\), on bascule un interrupteur qui applique une tension constante \(E=5{,}0\ \text{V}\) à un circuit RLC série (\(R=20\ \Omega\), \(L=50\ \text{mH}\), \(C=5{,}0\ \mu\text{F}\)). Avant la fermeture, le circuit est au repos.</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle vérifiée par \(u_C(t)\) pour \(t\gt0\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\omega_0\), \(Q\) et identifier le régime.</div>
  <div class="q"><strong>Q3.</strong> Donner les conditions initiales sur \(u_C\) et \(\dot u_C\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer la solution complète \(u_C(t)\).</div>
  <div class="q"><strong>Q5.</strong> Calculer la valeur maximale de \(u_C\) et l'instant où elle est atteinte.</div>
  <div class="q"><strong>Q6.</strong> Vers quelle valeur \(u_C\) tend-elle ? Au bout de combien de temps peut-on considérer le régime permanent atteint ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Loi des mailles : \(E=Ri+L\dot i+u_C\) avec \(i=C\dot u_C\) : \(\ddot u_C+\dfrac RL\dot u_C+\dfrac1{LC}u_C=\dfrac E{LC}\).</p>
    <p><strong>Q2.</strong> \(\omega_0=1/\sqrt{2{,}5\times10^{-7}}=2\,000\ \text{rad·s}^{-1}\) ; \(Q=L\omega_0/R=5{,}0\gt1/2\) : pseudo-périodique.</p>
    <p><strong>Q3.</strong> Circuit au repos : \(u_C(0^-)=0\) et \(i(0^-)=0\). Par continuité, \(u_C(0^+)=0\) et \(i(0^+)=0\), donc \(\dot u_C(0^+)=i(0^+)/C=0\).</p>
    <p><strong>Q4.</strong> Solution particulière \(E\) ; \(\tau=2Q/\omega_0=5{,}0\ \text{ms}\) et \(\omega_p=2\,000\sqrt{1-1/100}\approx1\,990\ \text{rad·s}^{-1}\). \(u_C=E+e^{-t/\tau}(A\cos\omega_pt+B\sin\omega_pt)\) ; \(u_C(0)=0\) donne \(A=-E\) ; \(\dot u_C(0)=-A/\tau+B\omega_p=0\) donne \(B=A/(\omega_p\tau)\approx-0{,}503\ \text{V}\) :</p>
    <div class="formula">$$u_C(t)=5{,}0-e^{-t/(5\ \text{ms})}\left(5{,}0\cos(1\,990\,t)+0{,}503\sin(1\,990\,t)\right)\ \text{(V)}$$</div>
    <p><strong>Q5.</strong> Le premier maximum est en \(t=T_p/2=\pi/\omega_p\approx1{,}58\ \text{ms}\) (le courant s'y annule), et vaut \(E(1+D)\) avec \(D=e^{-\pi/\sqrt{4Q^2-1}}=e^{-\pi/\sqrt{99}}\approx0{,}73\) : \(u_{C,\max}\approx8{,}6\ \text{V}\).</p>
    <p><strong>Q6.</strong> \(u_C\to E=5{,}0\ \text{V}\) : en régime permanent, le condensateur est chargé et plus aucun courant ne circule. L'écart à \(E\) reste inférieur à 5 % après 14,5 ms (environ \(3\tau\)), à 1 % après 22 ms (moins de \(5\tau=25\ \text{ms}\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Bilan énergétique de la charge d'un condensateur</h3>
  <div class="statement">On reprend un circuit RLC série au repos, sur lequel on applique à \(t=0\) une tension constante \(E\).</div>
  <div class="q"><strong>Q1.</strong> Quelle énergie le condensateur stocke-t-il en régime permanent ?</div>
  <div class="q"><strong>Q2.</strong> Quelle énergie le générateur fournit-il entre \(t=0\) et \(t\to\infty\) ? On utilisera \(W_{\text{gén}}=\int_0^\infty Ei\,\mathrm{d}t\), en remarquant que \(\int_0^\infty i\,\mathrm{d}t\) est la charge totale qui a traversé le circuit.</div>
  <div class="q"><strong>Q3.</strong> En déduire l'énergie dissipée par effet Joule dans la résistance. Commenter.</div>
  <div class="q"><strong>Q4.</strong> On décharge ensuite le condensateur dans le même circuit (générateur remplacé par un fil). Quelle énergie est dissipée ? Quel bilan global pour un cycle charge-décharge ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En régime permanent \(u_C=E\), donc \(\mathcal E_C=\tfrac12CE^2\).</p>
    <p><strong>Q2.</strong> \(W_{\text{gén}}=E\displaystyle\int_0^\infty i\,\mathrm{d}t=E\,q_{\text{tot}}\), avec</p>
    <div class="formula">$$q_{\text{tot}}=\int_0^\infty C\dot u_C\,\mathrm{d}t=C\left[u_C(\infty)-u_C(0)\right]=CE$$</div>
    <p>Donc \(W_{\text{gén}}=CE^2\).</p>
    <p><strong>Q3.</strong> Bilan intégré : \(W_{\text{gén}}=\Delta\mathcal E_C+\Delta\mathcal E_L+W_J\), avec \(\Delta\mathcal E_L=0\) (courant nul au début et à la fin). \(W_J=CE^2-\tfrac12CE^2=\tfrac12CE^2\) : exactement la moitié de l'énergie fournie est dissipée, quelles que soient \(R\) et \(L\) (si \(R\gt0\)). On l'obtient sans calculer \(i(t)\) : seuls les états initial et final interviennent.</p>
    <p><strong>Q4.</strong> En régime libre, \(\mathrm{d}\mathcal E/\mathrm{d}t=-Ri^2\) : toute l'énergie stockée, \(\tfrac12CE^2\), finit en chaleur. Sur un cycle, le générateur a fourni \(CE^2\), entièrement dissipé dans la résistance.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Transitoire, résonance et surtension : synthèse</h3>
  <div class="statement">Un circuit RLC série comporte \(R=20\ \Omega\), \(L=0{,}10\ \text{H}\), \(C=1{,}0\ \mu\text{F}\).</div>
  <p class="exo-part">Partie A — Régime transitoire</p>
  <div class="q"><strong>A1.</strong> Calculer la pulsation propre \(\omega_0\), la fréquence propre \(f_0\) et le facteur de qualité \(Q\).</div>
  <div class="q"><strong>A2.</strong> À \(t=0\), on applique un échelon \(E=5{,}0\ \text{V}\) au circuit au repos. Identifier le régime et décrire l'allure de \(u_C(t)\).</div>
  <div class="q"><strong>A3.</strong> Calculer la valeur du premier maximum de \(u_C\) et la durée du régime transitoire.</div>
  <p class="exo-part">Partie B — Régime sinusoïdal forcé</p>
  <div class="q"><strong>B1.</strong> Le circuit est alimenté par \(e(t)=E_m\cos(\omega t)\), \(E_m=5{,}0\ \text{V}\). Donner l'amplitude \(I_m(\omega)\) du courant. À quelle pulsation est-elle maximale ?</div>
  <div class="q"><strong>B2.</strong> Calculer la bande passante \(\Delta f\), et les fréquences \(f_1\), \(f_2\) qui la limitent.</div>
  <div class="q"><strong>B3.</strong> Calculer l'amplitude de la tension aux bornes du condensateur en \(f_0\). Conclure.</div>
  <div class="q"><strong>B4.</strong> Quelle puissance moyenne la résistance reçoit-elle en \(f_0\) ? et en \(f_1\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(\omega_0=1/\sqrt{0{,}10\times10^{-6}}\approx3{,}16\times10^3\ \text{rad·s}^{-1}\), \(f_0\approx503\ \text{Hz}\) ; \(Q=\dfrac1{20}\sqrt{\dfrac{0{,}10}{10^{-6}}}=\dfrac{316}{20}\approx15{,}8\).</p>
    <p><strong>A2.</strong> \(Q\gt1/2\) : régime pseudo-périodique. \(u_C\) part de 0 avec une tangente horizontale (\(i(0^+)=0\)), dépasse largement \(E\), puis oscille autour de \(E\) en s'amortissant, avec une pseudo-période \(T_p\approx T_0\approx2{,}0\ \text{ms}\).</p>
    <p><strong>A3.</strong> \(D=e^{-\pi/\sqrt{4Q^2-1}}=e^{-\pi/31{,}6}\approx0{,}91\) : \(u_{C,\max}\approx9{,}5\ \text{V}\), presque \(2E\), à \(t\approx1{,}0\ \text{ms}\). \(\tau=2L/R=10\ \text{ms}\) : le transitoire dure environ \(3\tau=30\ \text{ms}\), soit une quinzaine d'oscillations (environ \(Q\)).</p>
    <p><strong>B1.</strong> \(I_m(\omega)=\dfrac{E_m}{\sqrt{R^2+(L\omega-1/(C\omega))^2}}\), maximale en \(\omega_0\) (résonance en intensité), où \(I_{\max}=E_m/R=0{,}25\ \text{A}\).</p>
    <p><strong>B2.</strong> \(\Delta f=f_0/Q\approx31{,}8\ \text{Hz}\) ; \(f_{1,2}=f_0\left(\sqrt{1+\tfrac1{4Q^2}}\mp\tfrac1{2Q}\right)\), soit \(f_1\approx488\ \text{Hz}\) et \(f_2\approx519\ \text{Hz}\).</p>
    <p><strong>B3.</strong> \(U_C(f_0)=QE_m\approx79\ \text{V}\) : la tension aux bornes du condensateur vaut près de seize fois celle du générateur. C'est la surtension, à prendre en compte pour choisir le condensateur (tension de claquage).</p>
    <p><strong>B4.</strong> \(\langle\mathcal P_J\rangle=\tfrac12RI_m^2\) : \(\tfrac12\times20\times0{,}25^2\approx0{,}63\ \text{W}\) en \(f_0\) ; en \(f_1\), \(I_m=I_{\max}/\sqrt2\) et la puissance est divisée par deux : 0,31 W.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Exploiter un enregistrement de travaux pratiques</h3>
  <div class="statement">Un GBF, de résistance de sortie \(50\ \Omega\), délivre un créneau de 0 à \(E=4{,}0\ \text{V}\) à un circuit formé d'une bobine (inductance \(L\) inconnue, résistance \(r\) inconnue) et d'un condensateur \(C=0{,}47\ \mu\text{F}\) en série. L'oscilloscope montre, après un front montant, des maximums successifs de \(u_C\) de 6,99 V puis 5,67 V, séparés de 1,06 ms.</div>
  <div class="q"><strong>Q1.</strong> Comment brancher l'oscilloscope ? Pourquoi choisir un créneau de fréquence assez basse, et laquelle convient ici ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le décrément logarithmique, puis le facteur de qualité.</div>
  <div class="q"><strong>Q3.</strong> En déduire \(\omega_0\), puis l'inductance \(L\).</div>
  <div class="q"><strong>Q4.</strong> Calculer la résistance totale du circuit, puis \(r\).</div>
  <div class="q"><strong>Q5.</strong> Quel facteur de qualité aurait le circuit sans la résistance du GBF ? Comment l'observer ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Voie 1 sur la sortie du GBF, voie 2 aux bornes du condensateur, placé du côté de la masse (masses communes du GBF et de l'oscilloscope). Chaque front est un échelon : il faut que la demi-période dépasse la durée du transitoire, ici quelques \(\tau\), de l'ordre de 5 à 6 ms (Q4). Un créneau de 50 Hz (demi-période 10 ms) convient.</p>
    <p><strong>Q2.</strong> Les écarts à la valeur finale \(E\) sont 2,99 V et 1,67 V : \(\delta=\ln(2{,}99/1{,}67)\approx0{,}58\), et \(Q=\tfrac12\sqrt{1+(2\pi/\delta)^2}\approx5{,}4\) (l'approximation \(\pi/\delta\) donne la même valeur). Diviser les maximums eux-mêmes, \(6{,}99/5{,}67\), serait faux : c'est l'écart à \(E\) qui décroît en \(e^{-t/\tau}\).</p>
    <p><strong>Q3.</strong> \(\omega_p=2\pi/T_p\approx5\,930\ \text{rad·s}^{-1}\), \(\omega_0=\omega_p/\sqrt{1-1/(4Q^2)}\approx5\,950\ \text{rad·s}^{-1}\) ; \(L=1/(C\omega_0^2)\approx60\ \text{mH}\).</p>
    <p><strong>Q4.</strong> \(R_{\text{tot}}=L\omega_0/Q\approx66\ \Omega\), dont 50 Ω pour le GBF : \(r\approx16\ \Omega\). Contrôle : \(\tau=2L/R_{\text{tot}}\approx1{,}8\ \text{ms}\) et \(T_p/\tau\approx0{,}58=\delta\).</p>
    <p><strong>Q5.</strong> Avec \(r\) seule, \(Q=\tfrac1r\sqrt{L/C}\approx22\). On s'en approche en chargeant le condensateur, puis en le déchargeant dans la bobine par un interrupteur, GBF débranché : le régime libre n'est alors amorti que par la bobine.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Lire une courbe de résonance mesurée</h3>
  <div class="statement">Un circuit RLC série comprend une résistance \(R=100\ \Omega\), une bobine \((L,r)\) et un condensateur inconnus. On le soumet à une tension sinusoïdale d'amplitude \(E_m=1{,}00\ \text{V}\), mesurée aux bornes du GBF, et l'on observe \(u_R\) et \(e\). On relève : \(u_R\) en phase avec \(e\) à 2 321 Hz, où son amplitude vaut 0,833 V ; \(u_R\) en avance de \(45^\circ\) sur \(e\) à 2 228 Hz, en retard de \(45^\circ\) à 2 419 Hz.</div>
  <div class="q"><strong>Q1.</strong> Justifier que 2 321 Hz est la fréquence propre. Que vaut la phase de \(u_C\) par rapport à \(e\) à cette fréquence ?</div>
  <div class="q"><strong>Q2.</strong> Que représentent 2 228 Hz et 2 419 Hz ? En déduire \(Q\). Vérifier la relation \(f_1f_2=f_0^2\).</div>
  <div class="q"><strong>Q3.</strong> Déduire de l'amplitude de \(u_R\) à la résonance la résistance totale du circuit, puis \(r\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(L\) et \(C\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u_R=Ri\) est en phase avec \(e\) quand \(\underline Z\) est réelle, c'est-à-dire en \(\omega_0\) : \(f_0=2\,321\ \text{Hz}\). Alors \(\underline U_{Cm}=\underline I_m/(jC\omega_0)\) : \(u_C\) est en quadrature retard (\(-90^\circ\)) sur \(e\).</p>
    <p><strong>Q2.</strong> Ce sont les bornes de la bande passante : la phase \(\pm45^\circ\) correspond à \(Q(x-1/x)=\mp1\), où \(I_m=I_{\max}/\sqrt2\). \(\Delta f=191\ \text{Hz}\), \(Q=f_0/\Delta f\approx12{,}2\). \(\sqrt{2\,228\times2\,419}\approx2\,322\ \text{Hz}\) : relation vérifiée.</p>
    <p><strong>Q3.</strong> À la résonance, \(\underline Z=R+r\) et \(U_{Rm}=E_m\dfrac{R}{R+r}\), d'où \(R+r=100/0{,}833\approx120\ \Omega\) et \(r\approx20\ \Omega\). (La résistance interne du GBF n'intervient pas, puisque \(e\) est mesurée à ses bornes.)</p>
    <p><strong>Q4.</strong> \(Q=L\omega_0/(R+r)\) donne \(L=Q(R+r)/\omega_0\approx0{,}10\ \text{H}\) ; \(C=1/(L\omega_0^2)\approx47\ \text{nF}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Simuler la réponse à un échelon avec Python</h3>
  <div class="statement">On veut retrouver numériquement le premier maximum de la réponse indicielle du circuit \(L=0{,}10\ \text{H}\), \(C=1{,}0\ \mu\text{F}\), résistance totale \(R=62\ \Omega\), soumis à \(E=2{,}0\ \text{V}\) à partir de \(t=0\) (circuit au repos). On dispose de la fonction <code>odeint(F, Y0, t)</code> de <code>scipy.integrate</code>, qui renvoie un tableau dont la ligne \(k\) est l'état à l'instant <code>t[k]</code>, pour un système \(Y'=F(Y,t)\).</div>
  <div class="q"><strong>Q1.</strong> Écrire le système d'ordre 1 vérifié par \(Y=[u_C,i]\).</div>
  <div class="q"><strong>Q2.</strong> Écrire la fonction <code>F</code>, puis les instructions qui calculent \(u_C\) sur 10 ms et affichent l'instant et la valeur de son maximum.</div>
  <div class="q"><strong>Q3.</strong> Quelles valeurs le programme doit-il afficher ? Les prévoir par le cours.</div>
  <div class="q"><strong>Q4.</strong> On remplace <code>odeint</code> par la méthode d'Euler. Écrire la boucle. Comment choisir le pas ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dot u_C=i/C\) (relation du condensateur) et \(\dot i=(E-Ri-u_C)/L\) (loi des mailles).</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">from</span> scipy.integrate <span class="kw">import</span> odeint

L, C, R, E = 0.10, 1.0e-6, 62.0, 2.0

<span class="kw">def</span> F(Y, t):
    uC, i = Y
    <span class="kw">return</span> [i / C, (E - R * i - uC) / L]

t = np.linspace(0, 0.010, 10001)          <span class="cmt"># pas d'affichage de 1 µs</span>
uC = odeint(F, [0.0, 0.0], t)[:, 0]       <span class="cmt"># colonne 0 : uC</span>
k = np.argmax(uC)                         <span class="cmt"># indice du maximum</span>
print(round(t[k] * 1e3, 3), round(uC[k], 3))</pre>
    <p><strong>Q3.</strong> \(Q=\tfrac1{62}\sqrt{10^5}\approx5{,}1\) ; le maximum est \(E(1+e^{-\pi/\sqrt{4Q^2-1}})\approx3{,}47\ \text{V}\), atteint à \(T_p/2\approx1{,}00\ \text{ms}\). Le programme affiche <code>0.998 3.468</code>.</p>
    <p><strong>Q4.</strong> Avec \(N\) pas de durée \(h\) :</p>
    <pre class="codeblock">u, i = 0.0, 0.0
<span class="kw">for</span> k <span class="kw">in</span> range(N):
    u, i = u + h * i / C, i + h * (E - R * i - u) / L</pre>
    <p>Le pas doit être très petit devant \(T_0\approx2\ \text{ms}\) et devant \(\tau\approx3\ \text{ms}\) : par exemple \(h=1\ \mu\text{s}\). On valide en divisant \(h\) par 10 : le résultat ne doit plus changer au chiffre près (Euler est d'ordre 1, l'erreur est proportionnelle au pas).</p>
  </div>
</div>

  <p class="exo-part">Partie A — L'énergie stockée</p>
  <div class="q"><strong>A1.</strong> Calculer l'énergie stockée dans le condensateur chargé.</div>
  <div class="q"><strong>A2.</strong> Le condensateur est chargé par une alimentation de 4,0 kV à travers une résistance de 25 kΩ. Combien de temps faut-il attendre ? Quelle énergie l'alimentation doit-elle fournir ?</div>
  <p class="exo-part">Partie B — La décharge</p>
  <div class="q"><strong>B1.</strong> Établir l'équation différentielle vérifiée par \(u_C\) pendant la décharge, avec \(R_{\text{tot}}=R+r\). Exprimer et calculer \(\omega_0\), puis la résistance critique.</div>
  <div class="q"><strong>B2.</strong> Calculer \(Q\) pour \(R=50\ \Omega\). Le régime est-il oscillant en pratique ? Calculer le premier dépassement \(D\).</div>
  <div class="q"><strong>B3.</strong> On se place au régime critique. Avec les conditions initiales, montrer que \(u_C=U_0(1+\omega_0t)e^{-\omega_0t}\) et \(i=\dfrac{U_0}L\,t\,e^{-\omega_0t}\). Calculer le courant maximal et l'instant où il est atteint.</div>
  <p class="exo-part">Partie C — L'énergie reçue par le patient</p>
  <div class="q"><strong>C1.</strong> Quelle énergie est dissipée au total pendant la décharge ? Montrer que le patient en reçoit la fraction \(R/(R+r)\), quel que soit le régime. Calculer cette énergie pour \(R=50\ \Omega\).</div>
  <div class="q"><strong>C2.</strong> Sans bobine, le condensateur se déchargerait directement dans le patient (\(R=50\ \Omega\), \(r=0\)). Calculer le courant initial et la durée caractéristique. Quel est le rôle de la bobine ?</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(\mathcal E_0=\tfrac12CU_0^2\), soit \(\tfrac12\times40\times10^{-6}\times(4{,}0\times10^3)^2=320\ \text{J}\).</p>
    <p><strong>A2.</strong> Circuit RC : \(\tau_{\text{ch}}=R_{\text{ch}}C=25\times10^3\times40\times10^{-6}=1{,}0\ \text{s}\) ; charge à 95 % en \(3\tau_{\text{ch}}=3\ \text{s}\), à 99 % en 5 s. L'alimentation fournit \(CU_0^2=640\ \text{J}\) : la moitié est perdue dans la résistance de charge (résultat du §4 du cours, valable aussi en RC).</p>
    <p><strong>B1.</strong> Avec l'orientation de la figure, le courant sort de l'armature positive : \(i=-C\,\dot u_C\), et la loi des mailles s'écrit \(u_C=L\,\dot i+R_{\text{tot}}\,i\). D'où \(LC\ddot u_C+R_{\text{tot}}C\dot u_C+u_C=0\), soit \(\ddot u_C+\dfrac{\omega_0}Q\dot u_C+\omega_0^2u_C=0\), avec \(\omega_0=1/\sqrt{LC}=1/\sqrt{1{,}6\times10^{-6}}\approx791\ \text{rad·s}^{-1}\) et \(Q=\dfrac1{R_{\text{tot}}}\sqrt{\dfrac LC}\). Régime critique pour \(R_{\text{tot}}=2\sqrt{L/C}=2\sqrt{1\,000}\approx63\ \Omega\), soit un patient de 53 Ω.</p>
    <p><strong>B2.</strong> \(R_{\text{tot}}=60\ \Omega\) : \(Q=31{,}6/60\approx0{,}53\), juste au-dessus de 1/2 : régime pseudo-périodique en théorie. Mais \(4Q^2-1\approx0{,}11\), \(\sqrt{0{,}11}\approx0{,}33\), et \(D=e^{-\pi/0{,}33}\approx e^{-9{,}4}\approx8\times10^{-5}\) : le courant ne s'inverse pas de façon mesurable. Le circuit est pratiquement au régime critique.</p>
    <p><strong>B3.</strong> Au critique, \(u_C=(A+Bt)e^{-\omega_0t}\). \(u_C(0)=U_0\) donne \(A=U_0\) ; \(i(0^+)=0\) (continuité dans la bobine) donne \(\dot u_C(0)=0\), soit \(B-\omega_0A=0\), \(B=\omega_0U_0\). Donc \(u_C=U_0(1+\omega_0t)e^{-\omega_0t}\), et \(i=-C\dot u_C=CU_0\omega_0^2\,t\,e^{-\omega_0t}=\dfrac{U_0}L\,t\,e^{-\omega_0t}\). Maximum quand \(\mathrm{d}i/\mathrm{d}t=0\) : \(t=1/\omega_0\approx1{,}26\ \text{ms}\), où \(i_{\max}=\dfrac{U_0}{L\omega_0e}=\dfrac{U_0}e\sqrt{\dfrac CL}\approx47\ \text{A}\).</p>
    <p><strong>C1.</strong> Bilan d'énergie (\(\mathrm{d}\mathcal E/\mathrm{d}t=-(R+r)i^2\)) : toute l'énergie stockée, 320 J, est dissipée. Le même courant traverse \(R\) et \(r\) : à chaque instant, les puissances sont dans le rapport \(R/r\), donc le patient reçoit la fraction \(R/(R+r)\) de 320 J, quelle que soit la forme de \(i(t)\). Pour \(R=50\ \Omega\) : \(\tfrac{50}{60}\times320\approx267\ \text{J}\), et 53 J chauffent la bobine.</p>
    <p><strong>C2.</strong> Circuit RC : le courant saute à \(U_0/R=80\ \text{A}\) dès la fermeture, puis décroît avec \(\tau=RC=2{,}0\ \text{ms}\). La bobine, dont le courant est continu, impose \(i(0^+)=0\) : elle étale l'impulsion et limite le courant maximal (48 A au lieu de 80 A), ce qui réduit le risque de brûlure des tissus.</p>
    <p><strong>D1.</strong> D'après B1 : \(\dot u_C=-i/C\) et \(\dot i=(u_C-(R+r)i)/L\).</p>
    <pre class="codeblock"><span class="kw">def</span> F(Y, t):
    uC, i = Y
    <span class="kw">return</span> [-i / C, (uC - (R + r) * i) / L]</pre>
    <p>avec l'état initial <code>[U0, 0.0]</code>.</p>
    <p><strong>D2.</strong> Plus \(R\) est grande, plus \(Q\) est petit : l'impulsion devient apériodique, plus basse et plus longue (90 % de l'énergie délivrée en 7,5 ms pour 150 Ω, contre 3,3 ms pour 50 Ω), mais le patient reçoit une plus grande part des 320 J (300 J contre 267 J), la bobine en dissipant une part plus petite. Pour \(R=25\ \Omega\), \(Q=0{,}90\) : le régime est franchement pseudo-périodique ; le courant culmine à 66 A, puis s'inverse (premier dépassement \(D\approx0{,}12\), courant négatif de 8 A environ) : l'impulsion devient « biphasique », ce que le modèle simple ne contrôle pas. Les appareils modernes mesurent l'impédance du thorax avant le choc et adaptent l'impulsion.</p>
