<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Partie 4.5 « Propagation » du programme de PT, pour les milieux conducteurs : conducteur ohmique (effet de peau), métal parfait (réflexion, onde stationnaire), cavité à une dimension, étude expérimentale en ondes centimétriques. Le chapitre s'appuie sur « Équations de Maxwell et ARQS » (loi d'Ohm locale, ARQS magnétique, vecteur de Poynting) et sur « Ondes électromagnétiques dans le vide » (OPPM, notation complexe en \(e^{i(\omega t-kz)}\)).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Conducteur ohmique</strong> : loi d'Ohm locale (admise, sans modèle microscopique), effet Joule (§1).</li>
        <li><strong>Milieu ohmique en ARQS magnétique</strong> : neutralité, courant de déplacement négligeable, équation de diffusion (§2, §3) ; établir et interpréter l'expression de la grandeur caractéristique d'atténuation, l'épaisseur de peau ; aspects énergétiques (§4).</li>
        <li><strong>Métal parfait</strong> : exploiter la nullité (admise) des champs dans un métal parfait ; relations de passage fournies par les énoncés (§5).</li>
        <li><strong>Réflexion</strong> sous incidence normale d'une OPPM polarisée rectilignement sur un plan conducteur parfait : établir l'onde réfléchie ; interpréter qualitativement les courants localisés en surface ; caractériser une onde stationnaire (§6), y compris du point de vue énergétique (§7).</li>
        <li><strong>Cavité à une dimension</strong> : établir la condition de quantification des modes (§7).</li>
        <li><strong>Ondes centimétriques</strong> : mettre en œuvre un dispositif d'étude d'une onde électromagnétique (§7).</li>
      </ul>
      <p>Hors programme, regroupés en fin de chapitre : le modèle de Drude et la conductivité complexe, le plasma et la vitesse de groupe. Le <strong>guide d'onde à deux plans conducteurs</strong> est cité dans le préambule du programme (« guide d'onde modélisé par deux plans infinis ») sans capacité exigible détaillée : il est traité en fin de chapitre, comme une application des outils de la cavité (§7). La pression de radiation (§7) est un complément. La densité de courant surfacique est au programme, mais pas le calcul de l'intensité qui traverse un segment de la surface.</p>
    </div>

<div class="course-section">
  <div class="sec-num">§1 · LE CONDUCTEUR OHMIQUE</div>
  <h2>Loi d'Ohm locale, effet Joule, domaine de validité</h2>
  <div class="intro">Pour savoir ce que devient une onde qui pénètre dans un métal, il faut décrire comment le métal répond au champ électrique. À l'échelle macroscopique, une seule loi suffit, la loi d'Ohm locale, tant que le champ ne varie pas trop vite. C'est tout ce que le programme demande ; le modèle microscopique qui la justifie (Drude) est donné en fin de chapitre, pour aller plus loin.</div>

  <div class="def-box">
    <strong>Conducteur ohmique.</strong> Milieu où la densité volumique de courant est proportionnelle au champ électrique :
    <div class="formula" data-nom="Loi d'Ohm locale">$$\vec j = \sigma\,\vec E$$</div>
    La <strong>conductivité</strong> \(\sigma\) (en S·m⁻¹) est réelle et positive. On suppose le milieu homogène (\(\sigma\) uniforme) et on lui attribue, sauf mention contraire, la permittivité \(\varepsilon_0\) et la perméabilité \(\mu_0\) du vide.
  </div>
  <div class="prop-box">
    <strong>Domaine de validité.</strong> Dans un métal, la loi d'Ohm avec une conductivité réelle reste valable tant que le champ varie lentement à l'échelle de la durée moyenne entre deux collisions d'un électron de conduction, \(\tau\approx10^{-14}\ \text{s}\) : jusqu'à \(10^{12}\ \text{Hz}\) environ, c'est-à-dire pour les ondes radio, les micro-ondes et l'infrarouge lointain. Au-delà (visible, ultraviolet), l'inertie des électrons intervient et la conductivité devient complexe (voir « Pour aller plus loin · Modèle de Drude »).
  </div>
  <p><strong>Ordres de grandeur</strong> de \(\sigma\) : cuivre \(6{,}0\times10^{7}\ \text{S·m}^{-1}\), aluminium \(3{,}8\times10^{7}\ \text{S·m}^{-1}\), acier \(10^{6}\) à \(10^{7}\ \text{S·m}^{-1}\), eau de mer \(\approx5\ \text{S·m}^{-1}\), sol humide \(\sim10^{-2}\ \text{S·m}^{-1}\), verre \(\sim10^{-11}\ \text{S·m}^{-1}\).</p>

  <h3>Puissance cédée aux porteurs : effet Joule</h3>
  <div class="prop-box">
    <strong>Effet Joule.</strong> La puissance volumique cédée par le champ aux porteurs de charge, \(p=\vec j\cdot\vec E\) (en W·m⁻³), vaut \(p=\sigma E^2\gt0\) dans un conducteur ohmique : les électrons accélérés par le champ cèdent cette énergie au réseau lors des collisions, et elle finit en agitation thermique. En régime sinusoïdal, pour un champ d'amplitude \(E_m\) (amplitude complexe \(\underline{\vec E}\), \(|\underline{\vec E}|=E_m\)) :
    $$\langle p\rangle = \frac12\,\mathrm{Re}\!\left(\underline{\vec j}\cdot\underline{\vec E}^{*}\right) = \frac12\,\sigma E_m^2$$
    Une onde qui traverse un conducteur ohmique lui cède donc de l'énergie : c'est un milieu <strong>absorbant</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Vitesse moyenne des électrons dans un fil de cuivre de section 1 mm² parcouru par 1 A (\(n \approx 8{,}5\times10^{28}\) électrons de conduction par m³) ? Champ électrique dans le fil ?</span>
    <div class="content"><p>\(v = \dfrac{I}{neS}\) avec \(I = 1\ \text{A}\) et \(S = 10^{-6}\ \text{m}^2\) : \(v \approx 7\times10^{-5}\ \text{m·s}^{-1}\), soit moins d'un dixième de millimètre par seconde : l'hypothèse \(v \ll c\), qui permet de négliger la force magnétique sur les électrons, est très largement vérifiée. Champ électrique : \(E=j/\sigma\), avec \(j=10^{6}\ \text{A·m}^{-2}\), soit \(E\approx1{,}7\times10^{-2}\ \text{V·m}^{-1}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · NEUTRALITÉ ET ARQS MAGNÉTIQUE</div>
  <h2>Le conducteur ohmique en régime lentement variable</h2>
  <div class="intro">Dans tout le domaine de validité de la loi d'Ohm à conductivité réelle (§1), on montre que le conducteur reste neutre et que le courant de déplacement y est négligeable : les équations de Maxwell se simplifient nettement, et l'on est dans le cadre de l'ARQS magnétique.</div>

  <h3>Neutralité du conducteur</h3>
  <p>En combinant la conservation de la charge \(\dfrac{\partial\rho}{\partial t} + \operatorname{div}\vec j = 0\), la loi d'Ohm et l'équation de Maxwell-Gauss \(\operatorname{div}\vec E = \rho/\varepsilon_0\), on obtient :</p>
  <div class="formula">$$\frac{\partial\rho}{\partial t} + \frac{\sigma}{\varepsilon_0}\,\rho = 0$$</div>
  <p>Une éventuelle charge volumique disparaît avec une constante de temps \(\varepsilon_0/\sigma \approx 10^{-19}\ \text{s}\) dans le cuivre : <strong>\(\rho = 0\) dans le volume</strong>, les charges ne peuvent subsister qu'en surface. (Ce raisonnement utilise la loi d'Ohm sur une durée plus courte que \(\tau\) : il est qualitatif, mais sa conclusion reste valable.)</p>

  <h3>Courant de déplacement négligeable</h3>
  <p>Comparons, en régime sinusoïdal, le courant de déplacement au courant de conduction :</p>
  <div class="formula">$$\frac{\left|\varepsilon_0\,\partial\vec E/\partial t\right|}{\left|\vec j\right|} = \frac{\varepsilon_0\,\omega}{\sigma}$$</div>
  <p>Pour le cuivre, ce rapport vaut environ \(10^{-8}\) à 10 GHz. Dans un bon conducteur, on peut donc écrire l'équation de Maxwell-Ampère sans courant de déplacement : c'est l'<strong>ARQS magnétique</strong>. Les équations de Maxwell dans le conducteur deviennent :</p>
  <div class="formula">$$\operatorname{div}\vec E = 0 \qquad \overrightarrow{\operatorname{rot}}\,\vec E = -\frac{\partial\vec B}{\partial t}$$</div>
  <div class="formula">$$\operatorname{div}\vec B = 0 \qquad \overrightarrow{\operatorname{rot}}\,\vec B = \mu_0\sigma\,\vec E$$</div>

  <p>Dans le conducteur, \(\vec j=\sigma\vec E\) est donc la seule source du champ magnétique, et la puissance \(\vec j\cdot\vec E\) est dissipée par effet Joule (§1).</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ÉQUATION DE DIFFUSION</div>
  <h2>Dans un conducteur, le champ diffuse</h2>
  <div class="intro">Sans courant de déplacement, le champ électromagnétique dans un conducteur n'obéit plus à l'équation de d'Alembert, mais à une équation de diffusion, de même forme que l'équation de la chaleur.</div>

  <h3>Démonstration</h3>
  <p>On prend le rotationnel de l'équation de Maxwell-Faraday et on utilise \(\operatorname{div}\vec E = 0\) :</p>
  <div class="formula">$$\overrightarrow{\operatorname{rot}}\left(\overrightarrow{\operatorname{rot}}\,\vec E\right) = \overrightarrow{\operatorname{grad}}\left(\operatorname{div}\vec E\right) - \Delta\vec E = -\Delta\vec E$$</div>
  <p>D'autre part, en permutant les dérivations puis en utilisant Maxwell-Ampère sans courant de déplacement :</p>
  <div class="formula">$$\overrightarrow{\operatorname{rot}}\left(\overrightarrow{\operatorname{rot}}\,\vec E\right) = -\frac{\partial}{\partial t}\overrightarrow{\operatorname{rot}}\,\vec B = -\mu_0\sigma\frac{\partial\vec E}{\partial t}$$</div>
  <p>D'où :</p>
  <div class="prop-box">
    <strong>Équation de diffusion du champ.</strong>
    $$\Delta\vec E = \mu_0\sigma\,\frac{\partial\vec E}{\partial t}$$
    Le même calcul (rotationnel de Maxwell-Ampère, \(\operatorname{div}\vec B = 0\)) donne la même équation pour \(\vec B\), et donc pour \(\vec j = \sigma\vec E\). Le coefficient de diffusion vaut \(D = 1/(\mu_0\sigma)\), soit environ \(1{,}3\times10^{-2}\ \text{m}^2\text{·s}^{-1}\) pour le cuivre.
  </div>

  <h3>Interprétation</h3>
  <p>L'équation est du premier ordre en temps : elle n'est pas invariante par \(t \to -t\), ce qui traduit un phénomène <strong>irréversible</strong> (la dissipation par effet Joule). Par analyse dimensionnelle, le temps nécessaire au champ pour pénétrer sur une profondeur \(L\) est</p>
  <div class="formula">$$\tau_d \approx \mu_0\sigma L^2$$</div>
  <p>Un champ qui varie plus vite que \(\tau_d\) n'a pas le temps de s'installer à la profondeur \(L\) : il reste confiné près de la surface. C'est l'origine de l'effet de peau (§4), avec une profondeur \(\sim\sqrt{D/\omega}\).</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Temps de pénétration d'un champ magnétique dans une plaque d'aluminium de 2 mm (\(\sigma = 3{,}8\times10^{7}\ \text{S·m}^{-1}\)) ?</span>
    <div class="content"><p>\(\tau_d \approx \mu_0\sigma L^2\) avec \(\mu_0\sigma \approx 48\ \text{s·m}^{-2}\) et \(L = 2\times10^{-3}\ \text{m}\) : \(\tau_d \approx 2\times10^{-4}\ \text{s}\). Un champ alternatif de période nettement plus courte ne traverse pratiquement pas la plaque : à 50 kHz, par exemple, \(\delta \approx 0{,}4\ \text{mm}\) et l'amplitude est divisée par plus de 200 sur les 2 mm.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · EFFET DE PEAU</div>
  <h2>Relation de dispersion et épaisseur de peau</h2>
  <div class="intro">On cherche une solution de l'équation de diffusion en forme d'onde plane : le vecteur d'onde devient complexe, et l'onde s'éteint sur une distance caractéristique, l'épaisseur de peau.</div>

  <h3>Relation de dispersion</h3>
  <p>Le conducteur occupe le demi-espace \(z \gt 0\). On injecte la pseudo-OPPM \(\underline{\vec E} = E_0\,e^{i(\omega t - \underline{k}z)}\,\vec e_x\) dans l'équation de diffusion : \(\Delta\) devient une multiplication par \(-\underline{k}^2\), et \(\partial/\partial t\) une multiplication par \(i\omega\).</p>
  <div class="formula">$$\underline{k}^2 = -i\,\mu_0\sigma\,\omega$$</div>
  <p>Comme \(-i = e^{-i\pi/2}\), les deux racines sont \(\underline{k} = \pm\dfrac{1-i}{\delta}\), où apparaît une longueur :</p>
  <div class="def-box">
    <strong>Épaisseur de peau.</strong>
    $$\delta = \sqrt{\frac{2}{\mu_0\sigma\,\omega}}$$
    On retient la racine \(\underline{k} = \dfrac{1-i}{\delta} = k' - i\,k''\) avec \(k' = k'' = 1/\delta\) : l'onde se propage vers les \(z\) croissants et son amplitude <strong>décroît</strong> en pénétrant dans le conducteur. L'autre racine décrirait une amplitude croissante vers l'intérieur, physiquement exclue pour une onde entrant par la surface.
  </div>

  <h3>Champ réel dans le conducteur</h3>
  <div class="formula">$$\vec E(z,t) = E_0\,e^{-z/\delta}\cos\!\left(\omega t - \frac{z}{\delta}\right)\vec e_x$$</div>

  <p>Le champ magnétique s'obtient par Maxwell-Faraday, \(\underline{\vec B} = \dfrac{\underline{k}}{\omega}\,\vec e_z \wedge \underline{\vec E}\). Comme \(\underline{k} = \dfrac{\sqrt2}{\delta}\,e^{-i\pi/4}\) :</p>
  <div class="formula">$$\vec B(z,t) = \frac{\sqrt2\,E_0}{\omega\delta}\,e^{-z/\delta}\cos\!\left(\omega t - \frac{z}{\delta} - \frac{\pi}{4}\right)\vec e_y$$</div>
  <p>\(\vec B\) est en retard de \(\pi/4\) sur \(\vec E\), et le rapport \(cB/E = \sqrt2\,c/(\omega\delta)\) est très grand devant 1 : dans un bon conducteur, l'onde est essentiellement <strong>magnétique</strong>.</p>
  <div class="prop-box">
    <strong>Bilan d'énergie dans le conducteur.</strong> Avec \(E_s\) l'amplitude du champ électrique en \(z=0^+\), la puissance moyenne dissipée par effet Joule dans une colonne de section unité vaut
    $$P_S=\int_0^{\infty}\frac{\sigma E_s^2}{2}\,e^{-2z/\delta}\,\mathrm dz=\frac{\sigma E_s^2\,\delta}{4}$$
    Elle est égale au flux moyen du vecteur de Poynting qui entre en \(z=0\) : avec les amplitudes \(E_s\) et \(\sqrt2\,E_s/(\omega\delta)\) de \(E_x\) et \(B_y\), déphasées de \(\pi/4\),
    $$\langle\Pi_z(0)\rangle=\frac{1}{\mu_0}\cdot\frac12\cdot E_s\cdot\frac{\sqrt2\,E_s}{\omega\delta}\cdot\cos\frac{\pi}{4}=\frac{E_s^2}{2\mu_0\omega\delta}$$
    qui vaut bien \(\sigma E_s^2\delta/4\) puisque \(\mu_0\omega=2/(\sigma\delta^2)\). Toute l'énergie qui pénètre est absorbée sur quelques \(\delta\) (exercices 4 et 5).
  </div>

  <h3>Ordres de grandeur (cuivre)</h3>
  <p>Pour le cuivre, \(\delta = 1/\sqrt{\pi\mu_0\sigma f} \approx 6{,}5\ \text{cm}/\sqrt{f}\) (\(f\) en Hz) :</p>

  <h3>Vitesse de phase : milieu dispersif et absorbant</h3>
  <div class="prop-box">
    La phase se propage à la vitesse
    $$v_\varphi = \frac{\omega}{k'} = \omega\delta = \sqrt{\frac{2\omega}{\mu_0\sigma}}$$
    qui dépend de \(\omega\) : le conducteur est <strong>dispersif</strong>. Comme \(k'' \neq 0\), il est aussi <strong>absorbant</strong>. La « longueur d'onde » dans le métal vaut \(2\pi\delta\) : sur cette distance l'amplitude est divisée par \(e^{2\pi} \approx 535\), si bien que l'onde ne se propage pratiquement pas. Exemple : cuivre à 1 MHz, \(v_\varphi \approx 4\times10^{2}\ \text{m·s}^{-1}\).
  </div>
  <div class="prop-box">
    <strong>Conséquences pratiques.</strong>
    <ul style="margin:.4rem 0">
      <li><strong>Câbles en haute fréquence :</strong> le courant se concentre sur une couche d'épaisseur \(\sim\delta\) ; pour un fil de rayon \(a \gg \delta\), \(R \approx \dfrac{\ell}{\sigma\,2\pi a\,\delta}\) croît comme \(\sqrt f\). Parades : fils divisés et isolés (fil de Litz), conducteurs creux ou argentés.</li>
      <li><strong>Blindage :</strong> une paroi métallique épaisse de quelques \(\delta\) arrête les ondes (cage de Faraday, boîtiers d'électronique).</li>
      <li><strong>Chauffage par induction :</strong> à quelques dizaines de kHz, les courants induits dissipent leur énergie dans une fine couche du fond de la casserole.</li>
    </ul>
  </div>
  <div class="notice"><strong>Attention.</strong> \(\delta\) est la distance sur laquelle l'<em>amplitude</em> est divisée par \(e\) ; la puissance, proportionnelle au carré du champ, est divisée par \(e\) sur \(\delta/2\). Ne pas confondre \(\delta\) avec la longueur d'onde dans le conducteur, \(2\pi\delta\).</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">À quelle fréquence l'épaisseur de peau du cuivre vaut-elle 1 mm ?</span>
    <div class="content"><p>\(f = \dfrac{1}{\pi\mu_0\sigma\,\delta^2}\) avec \(\pi\mu_0\sigma \approx 237\ \text{s·m}^{-2}\) et \(\delta = 10^{-3}\ \text{m}\) : \(f \approx 4{,}2\ \text{kHz}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CONDUCTEUR PARFAIT ET RELATIONS DE PASSAGE</div>
  <h2>Le conducteur parfait, limite de l'effet de peau</h2>
  <div class="intro">Quand l'épaisseur de peau est négligeable devant toutes les autres longueurs du problème (longueur d'onde dans le vide, dimensions des objets), on peut considérer que le champ ne pénètre pas du tout dans le métal : c'est le modèle du conducteur parfait.</div>

  <div class="def-box">
    <strong>Conducteur parfait.</strong> Limite \(\sigma \to \infty\), donc \(\delta \to 0\). En régime variable :
    $$\vec E_{\text{int}} = \vec 0 \qquad \vec B_{\text{int}} = \vec 0$$
    Il ne reste de sources que sur la paroi elle-même : une densité surfacique de charge \(\sigma_s\) (C·m⁻²) et une densité surfacique de courant \(\vec j_s\) (A·m⁻¹). (L'indice \(s\) évite la confusion avec la conductivité.)
  </div>
  <p>D'où vient ce courant surfacique ? Faisons tendre \(\delta\) vers 0 en gardant fixé le champ magnétique imposé à la surface : la couche conductrice s'amincit, \(|\vec j|\) y grandit en proportion, et l'intégrale \(\int \vec j\,\mathrm{d}z\) prise à travers la couche garde une valeur finie. C'est cette intégrale qu'on appelle \(\vec j_s\) (exercice CONCOURS, question C4). Exemple : pour le cuivre à 10 GHz, \(\delta \approx 0{,}65\ \mu\text{m}\) contre \(\lambda = 3\ \text{cm}\) : le modèle est excellent (les faibles pertes se calculent ensuite en perturbation).</p>

  <h3>Relations de passage</h3>
  <div class="prop-box">
    À la traversée d'une surface portant \(\sigma_s\) et \(\vec j_s\), du milieu 1 vers le milieu 2 (normale unitaire \(\vec n_{12}\) orientée de 1 vers 2) :
    $$\vec E_2 - \vec E_1 = \frac{\sigma_s}{\varepsilon_0}\,\vec n_{12}$$
    $$\vec B_2 - \vec B_1 = \mu_0\,\vec j_s \wedge \vec n_{12}$$
    Autrement dit : la composante tangentielle de \(\vec E\) et la composante normale de \(\vec B\) sont continues ; la composante normale de \(\vec E\) saute de \(\sigma_s/\varepsilon_0\), la composante tangentielle de \(\vec B\) saute de \(\mu_0 j_s\).
  </div>

  <h3>Champ au voisinage d'un conducteur parfait</h3>
  <div class="prop-box">
    Avec 1 = le conducteur (champs nuls) et \(\vec n\) la normale <strong>sortante</strong> (vers le vide), en un point \(M\) de la surface, côté vide :
    $$\vec E(M) = \frac{\sigma_s}{\varepsilon_0}\,\vec n \qquad \vec B(M) = \mu_0\,\vec j_s \wedge \vec n$$
    Juste à l'extérieur d'un conducteur parfait, \(\vec E\) est <strong>normal</strong> à la surface et \(\vec B\) est <strong>tangent</strong>. Ce sont les conditions aux limites des problèmes de réflexion et de cavité.
  </div>
  <div class="notice"><strong>À retenir.</strong> Ces relations sont valables à chaque instant. Pour trouver \(\vec j_s\) à partir de \(\vec B\), on inverse : \(\vec j_s = \dfrac{1}{\mu_0}\,\vec n \wedge \vec B(M)\) (car \(\vec j_s\) est tangent à la surface).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉFLEXION ET ONDE STATIONNAIRE</div>
  <h2>Réflexion en incidence normale sur un conducteur parfait</h2>
  <div class="intro">Pourquoi un métal poli renvoie-t-il la lumière ou les micro-ondes ? Le champ qui l'atteint fait osciller les électrons de la paroi, et ce courant oscillant émet à son tour une onde, vers l'arrière. Devant le miroir, l'onde qui arrive et celle qui repart se superposent en une onde stationnaire.</div>

  <h3>Existence et forme de l'onde réfléchie</h3>
  <p>Le conducteur parfait occupe \(z \gt 0\). L'onde incidente, venue de \(z \lt 0\), est une OPPM polarisée rectilignement :</p>
  <div class="formula">$$\underline{\vec E}_i = E_0\,e^{i(\omega t - kz)}\,\vec e_x$$</div>
  <div class="formula">$$\underline{\vec B}_i = \frac{E_0}{c}\,e^{i(\omega t - kz)}\,\vec e_y \qquad k = \frac{\omega}{c}$$</div>
  <p>Seule, elle ne peut pas respecter la continuité de la composante tangentielle de \(\vec E\) en \(z = 0\) (champ nul dans le conducteur). Il faut donc ajouter une onde qui repart vers les \(z\) décroissants. On la cherche sous forme d'OPPM de pulsation \(\omega\) : la condition en \(z = 0\) devant être vraie à chaque instant, les deux ondes doivent avoir la même dépendance temporelle. On pose donc \(\underline{\vec E}_r = \underline{r}\,E_0\,e^{i(\omega t + kz)}\,\vec e_x\).</p>
  <div class="def-box">
    <strong>Condition aux limites</strong> en \(z = 0\) : \(E_0(1 + \underline{r})\,e^{i\omega t} = 0\) à tout instant, donc
    $$\underline{r} = -1$$
    L'onde réfléchie est en opposition de phase avec l'onde incidente au niveau du miroir, et de même amplitude : la réflexion est <strong>totale</strong>. Avec la relation de structure (\(\vec k_r = -k\,\vec e_z\)), \(\underline{\vec B}_r = \dfrac{E_0}{c}\,e^{i(\omega t + kz)}\,\vec e_y\) : pour \(\vec B\), le coefficient de réflexion vaut \(+1\).
  </div>

  <h3>Champs totaux</h3>
  <p>En sommant les ondes incidente et réfléchie :</p>
  <div class="formula">$$\underline{\vec E} = E_0\,e^{i\omega t}\left(e^{-ikz} - e^{ikz}\right)\vec e_x$$</div>
  <div class="formula">$$\underline{\vec E} = -2i\,E_0\sin(kz)\,e^{i\omega t}\,\vec e_x$$</div>
  <p>et \(\underline{\vec B} = \dfrac{2E_0}{c}\cos(kz)\,e^{i\omega t}\,\vec e_y\). En réels :</p>
  <div class="formula">$$\vec E(z,t) = 2E_0\sin(kz)\sin(\omega t)\,\vec e_x$$</div>
  <div class="formula">$$\vec B(z,t) = \frac{2E_0}{c}\cos(kz)\cos(\omega t)\,\vec e_y$$</div>

  <h3>Charges et courants de surface</h3>
  <p>Le champ électrique total s'annule sur le miroir, donc la relation de passage pour \(\vec E\) ne laisse apparaître aucune charge : <strong>\(\sigma_s = 0\)</strong> à tout instant (incidence normale). La normale sortante est \(\vec n = -\vec e_z\) ; la relation \(\vec j_s = \dfrac{1}{\mu_0}\vec n \wedge \vec B(0)\) donne :</p>
  <div class="formula">$$\vec j_s = \frac{2E_0}{\mu_0 c}\cos(\omega t)\,\vec e_x = 2\varepsilon_0 c\,E_0\cos(\omega t)\,\vec e_x$$</div>
  <p>Le courant surfacique est parallèle au champ électrique incident : c'est lui qui rayonne l'onde réfléchie (et annule le champ dans le métal).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Onde de 10 GHz d'amplitude \(E_0=100\ \text{V·m}^{-1}\) réfléchie par une plaque métallique : amplitude du courant surfacique, du champ magnétique sur la plaque, distance entre nœuds ?</span>
    <div class="content"><p>\(j_s=2\varepsilon_0cE_0\approx0{,}53\ \text{A·m}^{-1}\), soit environ un demi-ampère par mètre de largeur de plaque. Sur la plaque, \(B=2E_0/c\approx6{,}7\times10^{-7}\ \text{T}\) : le champ magnétique y est double de celui de l'onde incidente, alors que le champ électrique y est nul. Les nœuds de \(\vec E\) sont espacés de \(\lambda/2=1{,}5\ \text{cm}\).</p></div>
  </div>

  <h3>Structure d'onde stationnaire</h3>
  <div class="def-box">
    <strong>Onde stationnaire.</strong> Champ qui s'écrit comme le produit \(f(z)\,g(t)\) d'une fonction de la seule position par une fonction du seul temps. Rien ne se déplace : chaque point oscille, en phase ou en opposition de phase avec ses voisins, avec une amplitude \(|f(z)|\) qui lui est propre. On appelle <strong>nœuds</strong> les points où le champ reste nul en permanence et <strong>ventres</strong> ceux où l'amplitude est la plus grande.
  </div>
  <div class="prop-box">
    <ul style="margin:.4rem 0">
      <li><strong>Nœuds de \(\vec E\)</strong> : \(\sin(kz) = 0\), soit \(z = -p\,\lambda/2\) (\(p \in \mathbb N\)), dont la surface du miroir. <strong>Ventres de \(\vec E\)</strong> : \(z = -\lambda/4 - p\,\lambda/2\).</li>
      <li>Les nœuds de \(\vec B\) sont aux ventres de \(\vec E\), et inversement.</li>
      <li>Deux nœuds consécutifs sont distants de \(\lambda/2\) ; \(\vec E\) et \(\vec B\) sont en <strong>quadrature spatiale</strong> (décalage \(\lambda/4\)) et <strong>temporelle</strong> (\(\sin\omega t\) contre \(\cos\omega t\)).</li>
    </ul>
  </div>

  <h3>Solutions à variables séparées</h3>
  <p>Cherchons une solution de l'équation de d'Alembert \(\dfrac{\partial^2\psi}{\partial z^2} = \dfrac{1}{c^2}\dfrac{\partial^2\psi}{\partial t^2}\) sous la forme \(\psi = f(z)\,g(t)\). En divisant par \(fg\) :</p>
  <div class="formula">$$\frac{f''(z)}{f(z)} = \frac{1}{c^2}\,\frac{g''(t)}{g(t)} = K$$</div>
  <p>Une fonction de \(z\) seul égale à une fonction de \(t\) seul est constante. Une constante \(K \geq 0\) donnerait en temps des solutions exponentielles ou affines, incompatibles avec un régime sinusoïdal permanent ; on pose donc \(K = -k^2\) : \(f(z) = A\cos(kz) + B\sin(kz)\) et \(g(t) = C\cos(\omega t) + D\sin(\omega t)\) avec \(\omega = kc\). Ce sont les <strong>conditions aux limites</strong> qui fixent les constantes (ici \(A = 0\) pour avoir un nœud de \(\vec E\) en \(z = 0\)).</p>
  <div class="notice"><strong>Lien avec les ondes progressives.</strong> Une onde stationnaire est la somme de deux ondes progressives de même amplitude se propageant en sens inverses (\(2\sin a\sin b = \cos(a-b) - \cos(a+b)\)) ; réciproquement, une onde progressive est la somme de deux ondes stationnaires en quadrature.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉNERGIE, CAVITÉ, ONDES CENTIMÉTRIQUES</div>
  <h2>Énergie d'une onde stationnaire, modes propres d'une cavité</h2>
  <div class="intro">Une onde stationnaire ne transporte pas d'énergie en moyenne. Enfermée entre deux miroirs, elle ne peut exister qu'à des fréquences bien précises : ce sont les modes propres de la cavité.</div>

  <h3>Bilan énergétique de l'onde stationnaire</h3>
  <p>Avec les champs totaux du §6, le vecteur de Poynting \(\vec\Pi = \dfrac{\vec E\wedge\vec B}{\mu_0}\) (noté aussi \(\vec R\)) vaut :</p>
  <div class="formula">$$\vec\Pi = \frac{E_0^2}{\mu_0 c}\,\sin(2kz)\,\sin(2\omega t)\,\vec e_z \qquad \langle\vec\Pi\rangle = \vec 0$$</div>
  <p>Aucune énergie n'est transportée en moyenne. \(\vec\Pi\) est nul à chaque instant aux nœuds de \(\vec E\) et de \(\vec B\) (espacés de \(\lambda/4\)) : l'énergie oscille d'avant en arrière à l'intérieur de « cellules » de longueur \(\lambda/4\). La densité volumique d'énergie électromagnétique vaut :</p>
  <div class="formula">$$u = \frac{\varepsilon_0 E^2}{2} + \frac{B^2}{2\mu_0} = u_E + u_B$$</div>
  <div class="formula">$$u_E = 2\varepsilon_0E_0^2\sin^2(kz)\sin^2(\omega t)$$</div>
  <div class="formula">$$u_B = 2\varepsilon_0E_0^2\cos^2(kz)\cos^2(\omega t)$$</div>
  <div class="prop-box">
    En moyenne temporelle, \(\langle u\rangle = \varepsilon_0E_0^2\), <strong>uniforme</strong> : c'est la somme des densités moyennes des ondes incidente et réfléchie (\(\varepsilon_0E_0^2/2\) chacune). L'énergie passe alternativement de la forme électrique (concentrée près des ventres de \(\vec E\)) à la forme magnétique (près des ventres de \(\vec B\)), tous les quarts de période.
  </div>

  <h3>Cavité entre deux plans conducteurs</h3>
  <p>Deux plans conducteurs parfaits sont placés en \(z = 0\) et \(z = L\). Une onde stationnaire \(\vec E = E_m\sin(kz)\cos(\omega t + \varphi)\,\vec e_x\) a déjà un nœud en \(z = 0\) ; il lui faut aussi un nœud en \(z = L\) : \(\sin(kL) = 0\).</p>
  <div class="formula">$$k_n = \frac{n\pi}{L} \qquad f_n = n\,\frac{c}{2L}$$</div>
  <div class="formula">$$\lambda_n = \frac{2L}{n} \qquad (n \in \mathbb N^*)$$</div>
  <div class="def-box">
    <strong>Modes propres.</strong> Laissée à elle-même, la cavité n'admet que cette suite discrète de fréquences, pour lesquelles \(L\) vaut un nombre entier de demi-longueurs d'onde. L'écart entre deux modes voisins est constant, égal à \(c/(2L)\). Une source accordée sur l'un de ces modes provoque une <strong>résonance</strong>, dont l'amplitude n'est bornée que par les pertes dans les parois (conducteur réel). Même structure que la corde de Melde ou le tuyau sonore fermé aux deux bouts.
  </div>

  <div class="method-box">
    <strong>Exemple — mesurer la vitesse de la lumière avec un four à micro-ondes</strong>
    <p>On retire le plateau tournant d'un four (fréquence du magnétron \(f = 2{,}45\ \text{GHz}\)) et l'on y chauffe brièvement une plaque de chocolat. Elle fond par taches régulièrement espacées de \(d \approx 6{,}1\ \text{cm}\).</p>
    <ol>
      <li>Le four est une cavité métallique : il s'y établit des ondes stationnaires, dont les ventres de champ électrique chauffent davantage.</li>
      <li>Deux ventres consécutifs sont séparés de \(\lambda/2\) : \(\lambda = 2d \approx 12{,}2\ \text{cm}\).</li>
      <li>\(c = \lambda f \approx 0{,}122\times2{,}45\times10^{9} \approx 3{,}0\times10^{8}\ \text{m·s}^{-1}\). C'est aussi pourquoi le plateau tourne : il promène les aliments à travers les ventres et les nœuds pour chauffer uniformément.</li>
    </ol>
  </div>

  <p>Ordres de grandeur : pour \(L = 30\ \text{cm}\), \(c/(2L) = 500\ \text{MHz}\) ; dans un laser, la cavité optique sélectionne ainsi les « modes longitudinaux » émis.</p>

  <h3>Étudier une onde centimétrique en TP</h3>
  <p>Les ondes de fréquence voisine de 10 GHz (\(\lambda\approx3\ \text{cm}\)) se prêtent bien à l'expérience : les longueurs se mesurent à la règle, et les objets (plaques, grilles, cornets) ont des tailles commodes.</p>
  <ul>
    <li><strong>Émetteur</strong> : oscillateur hyperfréquence (diode Gunn) suivi d'un cornet ; l'onde émise est polarisée rectilignement et, à quelques dizaines de centimètres du cornet, localement plane.</li>
    <li><strong>Détecteur</strong> : cornet récepteur ou petite sonde à diode, qui délivre une tension proportionnelle au carré moyen du champ électrique (détection quadratique) : on mesure donc un éclairement, et ses minima repèrent les nœuds de \(\vec E\).</li>
    <li><strong>Plaques métalliques</strong> : à 10 GHz, \(\delta\approx0{,}8\ \mu\text{m}\) dans l'aluminium, si bien qu'une plaque de quelques millimètres est un excellent conducteur parfait ; une <strong>grille</strong> de fils parallèles sert de polariseur (axe de transmission perpendiculaire aux fils, chapitre « Ondes dans le vide », §6).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — mesurer la longueur d'onde par les nœuds d'une onde stationnaire</strong>
    <ol>
      <li>Placer une plaque métallique face à l'émetteur, perpendiculairement au faisceau : une onde stationnaire s'établit devant elle (§6).</li>
      <li>Déplacer la sonde le long de l'axe et repérer les minima du signal : ils sont espacés de \(\lambda/2\) (nœuds de \(\vec E\), le premier sur la plaque).</li>
      <li>Mesurer la distance \(D\) entre deux minima éloignés plutôt qu'entre deux voisins : si l'on compte 9 intervalles sur \(D=13{,}5\ \text{cm}\), alors \(\lambda=2D/9=3{,}00\ \text{cm}\) et \(f=c/\lambda=10{,}0\ \text{GHz}\). Une erreur de lecture de 1 mm sur \(D\) ne change \(\lambda\) que de \(0{,}2\ \text{mm}\).</li>
      <li>Les minima ne sont pas tout à fait nuls : la réflexion n'est pas parfaite et l'onde incidente n'est pas rigoureusement plane. Remplacer la sonde électrique par une petite boucle (sensible à \(\vec B\)) décale les minima de \(\lambda/4\).</li>
    </ol>
  </div>

  <h3>Pression de radiation (complément hors programme)</h3>
  <p>Le courant surfacique \(\vec j_s\) du miroir subit la force de Laplace du champ magnétique. Le champ « vu » par la couche de courant est la moyenne des champs de part et d'autre (\(\vec B(0^-)\) et \(\vec 0\)), d'où une force par unité de surface, qui pousse le miroir :</p>
  <div class="formula">$$\vec j_s \wedge \tfrac12\vec B(0^-) = 2\varepsilon_0E_0^2\cos^2(\omega t)\,\vec e_z$$</div>
  <p>En moyenne :</p>
  <div class="formula">$$P_{\text{rad}} = \varepsilon_0E_0^2 = \frac{2\,\langle\Pi_i\rangle}{c} = \frac{2I}{c}$$</div>
  <p>Interprétation corpusculaire : le flux de quantité de mouvement \(I/c\) apporté par les photons est renversé. Pour une surface totalement absorbante, \(P_{\text{rad}} = I/c\). Le Soleil au niveau de la Terre (\(I \approx 1{,}4\ \text{kW·m}^{-2}\)) exerce environ \(9\ \mu\text{Pa}\) sur un miroir parfait : négligeable sur Terre, mais exploitable dans l'espace (voiles solaires) ou avec des lasers focalisés (pinces optiques).</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · MODÈLE DE DRUDE (HORS PROGRAMME)</div>
  <h2>Le conducteur ohmique : un gaz d'électrons freinés</h2>
  <div class="intro">Première image d'un métal : un réseau d'ions positifs immobiles, baigné par des électrons de conduction délocalisés. Plutôt que de suivre chaque choc d'un électron (sur une impureté, un défaut, un ion qui vibre), Drude n'en retient que l'effet moyen, un freinage proportionnel à la vitesse. Ce modèle minimal justifie la loi d'Ohm du §1 et son domaine de validité, et prépare l'étude du plasma.</div>
  <div class="notice"><strong>Hors programme</strong> : aucun modèle microscopique de la loi d'Ohm n'est exigible. Celui-ci est souvent proposé, guidé, par les sujets ; il est donné pour aller plus loin.</div>

  <h3>Hypothèses et équation du mouvement</h3>
  <div class="def-box">
    <strong>Modèle de Drude.</strong> Les électrons de conduction (charge \(-e\), masse \(m\), densité particulaire \(n\)) se déplacent dans un réseau d'ions immobiles. L'effet moyen des collisions est décrit par une force de frottement fluide
    $$\vec f = -\frac{m}{\tau}\,\vec v$$
    où \(\tau\) est le <strong>temps de relaxation</strong> (durée moyenne entre deux collisions). On néglige le poids, la force magnétique (\(v \ll c\)) et les variations spatiales du champ à l'échelle du déplacement d'un électron. Le principe fondamental appliqué à un électron « moyen » s'écrit :
    $$m\frac{\mathrm{d}\vec v}{\mathrm{d}t} = -e\,\vec E - \frac{m}{\tau}\,\vec v$$
  </div>

  <h3>Régime permanent : loi d'Ohm locale</h3>
  <p>En champ constant, la vitesse tend en quelques \(\tau\) vers \(\vec v = -\dfrac{e\tau}{m}\vec E\). La densité volumique de courant \(\vec j = -ne\,\vec v\) est alors proportionnelle au champ : c'est la loi d'Ohm locale du §1, \(\vec j = \sigma_0\vec E\), la conductivité \(\sigma\) valant ici la conductivité statique</p>
  <div class="formula">$$\sigma_0 = \frac{n e^2 \tau}{m}$$</div>
  <div class="prop-box">
    <strong>Ordres de grandeur (cuivre).</strong> \(n \approx 8{,}5\times10^{28}\ \text{m}^{-3}\) (un électron libre par atome), \(\sigma_0 \approx 6{,}0\times10^{7}\ \text{S·m}^{-1}\), d'où
    $$\tau = \frac{m\sigma_0}{ne^2} \approx 2{,}5\times10^{-14}\ \text{s}$$
  </div>

  <h3>Régime sinusoïdal forcé : conductivité complexe</h3>
  <p>On associe aux grandeurs sinusoïdales des grandeurs complexes en \(e^{i\omega t}\) (convention du chapitre). La dérivation devient une multiplication par \(i\omega\) : \(i\omega m\,\underline{\vec v} = -e\,\underline{\vec E} - \dfrac{m}{\tau}\underline{\vec v}\). On en tire \(\underline{\vec j} = \underline{\sigma}\,\underline{\vec E}\) avec</p>
  <div class="formula">$$\underline{\sigma}(\omega) = \frac{\sigma_0}{1 + i\omega\tau}$$</div>
  <div class="prop-box">
    <strong>Deux limites.</strong>
    <ul style="margin:.4rem 0">
      <li>\(\omega\tau \ll 1\), soit \(f \ll 1/(2\pi\tau) \approx 6\times10^{12}\ \text{Hz}\) pour le cuivre (radio, micro-ondes, infrarouge lointain) : \(\underline{\sigma} \approx \sigma_0\) <strong>réelle</strong>, \(\vec j\) et \(\vec E\) sont en phase.</li>
      <li>\(\omega\tau \gg 1\) (visible, ultraviolet) : \(\underline{\sigma} \approx -i\,\dfrac{ne^2}{m\omega}\) est <strong>imaginaire pure</strong> ; l'inertie des électrons domine et \(\vec j\) est en quadrature avec \(\vec E\). C'est le comportement d'un plasma (section suivante).</li>
    </ul>
  </div>
  <div class="notice"><strong>Limite du modèle.</strong> Le modèle de Drude est classique : \(\tau\) y est un paramètre effectif. Il donne pourtant les bons ordres de grandeur pour les métaux usuels et rend compte de la loi d'Ohm ; c'est ce qui en fait l'intérêt.</div>

</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · PLASMA PEU DENSE (HORS PROGRAMME)</div>
  <h2>Plasma : conductivité imaginaire et fréquence de coupure</h2>
  <div class="intro">Un plasma est un gaz ionisé : électrons libres et ions. L'ionosphère, le gaz d'une lampe à décharge ou les électrons d'un métal à très haute fréquence en sont des exemples. S'il est assez peu dense, les collisions sont négligeables, et sa réponse à une onde change radicalement.</div>

  <h3>Conductivité du plasma</h3>
  <p>Hypothèses : ions immobiles (beaucoup plus lourds), aucune collision, poids et force magnétique négligeables, électrons non relativistes. Le principe fondamental se réduit à \(m\,\dfrac{\mathrm{d}\vec v}{\mathrm{d}t} = -e\vec E\), soit \(i\omega m\,\underline{\vec v} = -e\underline{\vec E}\). Avec \(\underline{\vec j} = -ne\,\underline{\vec v}\) :</p>
  <div class="formula">$$\underline{\sigma} = -i\,\frac{ne^2}{m\omega} = -i\,\varepsilon_0\frac{\omega_p^2}{\omega}$$</div>
  <p>avec</p>
  <div class="formula">$$\omega_p = \sqrt{\frac{ne^2}{m\varepsilon_0}}$$</div>
  <div class="prop-box">
    \(\omega_p\) est la <strong>pulsation plasma</strong>. La conductivité est imaginaire pure : \(\vec j\) est en quadrature avec \(\vec E\), donc \(\langle p\rangle = 0\). Le plasma n'absorbe pas d'énergie en moyenne ; elle est échangée périodiquement avec les électrons (énergie cinétique).
  </div>

  <h3>Relation de dispersion de Klein-Gordon</h3>
  <p>Ici, on <strong>ne</strong> peut <strong>pas</strong> négliger le courant de déplacement : \(|\underline{\sigma}| = \varepsilon_0\omega_p^2/\omega\) est du même ordre que \(\varepsilon_0\omega\). Pour une onde transverse, \(\rho = 0\), et le rotationnel de Maxwell-Faraday combiné à Maxwell-Ampère complet donne \(\Delta\vec E = \mu_0\dfrac{\partial\vec j}{\partial t} + \dfrac{1}{c^2}\dfrac{\partial^2\vec E}{\partial t^2}\). Avec la pseudo-OPPM :</p>
  <div class="formula">$$\underline{k}^2 = \frac{\omega^2}{c^2} - i\mu_0\omega\,\underline{\sigma} = \frac{\omega^2 - \omega_p^2}{c^2}$$</div>

  <h3>Deux régimes</h3>
  <div class="prop-box">
    <strong>\(\omega \gt \omega_p\) : propagation.</strong> \(k = \sqrt{\omega^2 - \omega_p^2}/c\) est réel : l'onde se propage sans atténuation, le plasma est <strong>transparent</strong> mais <strong>dispersif</strong>. Indice et vitesses :
    $$n = \sqrt{1 - \frac{\omega_p^2}{\omega^2}} \lt 1$$
    $$v_\varphi = \frac{c}{n} \gt c \qquad v_g = \frac{\mathrm{d}\omega}{\mathrm{d}k} = c\,n \lt c$$
    On a \(v_\varphi\,v_g = c^2\) ; seule \(v_g\), vitesse de l'énergie, doit rester inférieure à \(c\).
  </div>
  <div class="prop-box">
    <strong>\(\omega \lt \omega_p\) : onde évanescente.</strong> \(\underline{k}^2 \lt 0\) : \(\underline{k} = -i/\delta_e\) est imaginaire pur, avec \(\delta_e = c/\sqrt{\omega_p^2 - \omega^2}\). Le champ réel
    $$\vec E = E_0\,e^{-z/\delta_e}\cos(\omega t)\,\vec e_x$$
    vibre avec la même phase à toutes les profondeurs : aucun motif ne se déplace, seule l'amplitude décroît avec \(z\). \(\vec B\) est en quadrature avec \(\vec E\), donc \(\langle\vec\Pi\rangle = \vec 0\) : l'énergie ne pénètre pas, l'onde incidente est <strong>totalement réfléchie</strong> sans absorption. Le plasma se comporte comme un filtre passe-haut de pulsation de coupure \(\omega_p\).
  </div>

  <h3>Ordres de grandeur</h3>
  <p>Numériquement, \(f_p = \omega_p/2\pi \approx 9\sqrt{n}\) (\(f_p\) en Hz, \(n\) en m⁻³).</p>
  <ul>
    <li><strong>Ionosphère</strong> (\(n \sim 10^{11}\) à \(10^{12}\ \text{m}^{-3}\)) : \(f_p\) de quelques MHz. Les ondes courtes sont réfléchies (liaisons radio à grande distance) ; la FM et les signaux des satellites (GHz) traversent.</li>
    <li><strong>Métaux</strong> (\(n \sim 10^{29}\ \text{m}^{-3}\)) : \(f_p \sim 10^{15}\ \text{Hz}\), dans l'ultraviolet. La lumière visible est réfléchie, d'où l'éclat métallique ; au-delà de \(f_p\), certains métaux (les alcalins notamment) deviennent transparents dans l'ultraviolet.</li>
  </ul>
  <div class="notice"><strong>Raccord avec Drude.</strong> Comme \(\sigma_0 = ne^2\tau/m = \varepsilon_0\omega_p^2\tau\), la conductivité de Drude \(\sigma_0/(1+i\omega\tau)\) tend vers \(-i\varepsilon_0\omega_p^2/\omega\) quand \(\omega\tau \gg 1\) : un métal se comporte comme un plasma aux très hautes fréquences.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Fréquence de coupure d'un plasma de tube à décharge, \(n = 1{,}0\times10^{16}\ \text{m}^{-3}\) ?</span>
    <div class="content"><p>\(\omega_p = \sqrt{\dfrac{ne^2}{m\varepsilon_0}} \approx 5{,}6\times10^{9}\ \text{rad·s}^{-1}\), soit \(f_p \approx 0{,}90\ \text{GHz}\) (on retrouve bien \(9\sqrt n\)). Une onde à 2,4 GHz traverse ce plasma ; une onde à 100 MHz est réfléchie.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · DISPERSION, ABSORPTION, INDICE (HORS PROGRAMME)</div>
  <h2>Lire une relation de dispersion</h2>
  <div class="intro">Le conducteur et le plasma sont deux cas d'un cadre général : dans un milieu linéaire, une pseudo-OPPM possède un vecteur d'onde complexe dont les parties réelle et imaginaire ont chacune un sens physique.</div>

  <div class="def-box">
    <strong>Convention.</strong> Pour une onde \(\underline{E} = E_0\,e^{i(\omega t - \underline{k}z)}\), on pose \(\underline{k} = k' - i\,k''\) (\(k'\), \(k''\) réels). Le champ réel vaut alors
    $$E = E_0\,e^{-k''z}\cos(\omega t - k'z)$$
    (Avec la convention \(e^{i(kz - \omega t)}\), on écrirait \(\underline{k} = k' + i\,k''\) pour obtenir la même onde.)
  </div>
  <div class="prop-box">
    <ul style="margin:.4rem 0">
      <li>\(k'\) gouverne la propagation de la phase : \(v_\varphi = \omega/k'\). Le milieu est <strong>dispersif</strong> si \(v_\varphi\) dépend de \(\omega\) : les composantes d'un signal non sinusoïdal se décalent et le signal se déforme.</li>
      <li>\(k''\) gouverne l'atténuation : l'amplitude est divisée par \(e\) sur \(1/k''\). Cette atténuation traduit soit une <strong>absorption</strong> (énergie cédée à la matière : conducteur ohmique), soit une réflexion totale sans absorption (onde évanescente du plasma).</li>
      <li>\(k' = 0\) : <strong>onde évanescente</strong>, pas de propagation de la phase.</li>
      <li>\(k'' = 0\) : milieu <strong>transparent</strong>, d'indice \(n(\omega) = \dfrac{c}{v_\varphi(\omega)} = \dfrac{ck}{\omega}\).</li>
    </ul>
  </div>

  <h3>Vitesse de groupe (complément)</h3>
  <p>Un signal réel est un paquet d'ondes de pulsations voisines de \(\omega_0\). Son enveloppe se déplace à la <strong>vitesse de groupe</strong> \(v_g = \left(\dfrac{\mathrm{d}\omega}{\mathrm{d}k'}\right)_{\omega_0}\), qui est, dans un milieu transparent, la vitesse de propagation de l'énergie et de l'information : elle ne dépasse jamais \(c\). Une vitesse de phase supérieure à \(c\) n'a rien de contradictoire.</p>

  <h3>Exemple : guide d'onde entre deux plans conducteurs</h3>
  <div class="notice"><strong>Statut</strong> : contrairement au reste de cette section, le guide d'onde à deux plans est évoqué par le préambule du programme de PT. Aucune capacité détaillée ne l'accompagne, mais un sujet peut le proposer, guidé : la méthode est celle de la cavité (champ nul sur les plans, équation de d'Alembert).</div>
  <p>Entre deux plans conducteurs \(x = 0\) et \(x = a\), le champ \(\vec E = E_0\sin\!\left(\dfrac{n\pi x}{a}\right)\cos(\omega t - \beta z)\,\vec e_y\) respecte les conditions aux limites (\(\vec E\) tangent nul sur les plans) et se propage selon \(z\). Reporté dans l'équation de d'Alembert, il impose :</p>
  <div class="formula">$$\beta^2 = \frac{\omega^2}{c^2} - \left(\frac{n\pi}{a}\right)^2$$</div>
  <p>La propagation n'est possible que si \(\omega \gt \omega_{c,n} = n\pi c/a\) : le guide est un filtre passe-haut, avec une relation de dispersion de même forme que celle du plasma (et \(v_\varphi v_g = c^2\)). Avec \(\sin p\cos q = \tfrac12[\sin(p+q) + \sin(p-q)]\), ce champ est aussi la somme de deux ondes planes de vecteurs d'onde \((\pm n\pi/a,\ 0,\ \beta)\), qui rebondissent alternativement sur les deux plans.</p>
  <div class="method-box">
    <strong>Exemple — fréquence de coupure d'un guide</strong>
    <p>Deux plans conducteurs distants de \(a = 2{,}0\ \text{cm}\). Le mode \(n = 1\) n'est guidé qu'au-dessus de \(f_{c,1} = \dfrac{c}{2a} = 7{,}5\ \text{GHz}\) : un signal Wi-Fi à 2,4 GHz ne s'y propage pas (onde évanescente, \(\beta\) imaginaire), un radar à 10 GHz si. Pour \(f = 10\ \text{GHz}\), \(\beta = \dfrac{\omega}{c}\sqrt{1-(f_{c,1}/f)^2} \approx 0{,}66\,\dfrac{\omega}{c}\) : la vitesse de phase \(\omega/\beta \approx 1{,}5c\) dépasse \(c\), mais l'énergie avance à \(v_g = c^2/v_\varphi \approx 0{,}66c\).</p>
  </div>

<template class="pan-tpl" data-panneau="oec-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ONDES ET CONDUCTEURS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à simplifier les équations de Maxwell dans un conducteur ohmique, à établir l'équation de diffusion et la relation de dispersion, à interpréter l'épaisseur de peau et à faire le bilan d'énergie, puis à traiter la réflexion sur un métal parfait, l'onde stationnaire, les modes d'une cavité et la mesure en ondes centimétriques. Convention : \(e^{i(\omega t-\underline kz)}\), \(\underline k=k'-ik''\) ; \(\sigma\) est la conductivité, \(\sigma_s\) la charge surfacique.</div>

  <div class="method-box">
    <strong>Méthode 1 — Justifier les simplifications dans un conducteur ohmique</strong>
    <ol>
      <li><span class="step">Loi d'Ohm.</span> Énoncer \(\vec j=\sigma\vec E\) avec \(\sigma\) réelle (fréquences très inférieures à \(10^{12}\ \text{Hz}\) pour un métal).</li>
      <li><span class="step">Neutralité.</span> Conservation de la charge + loi d'Ohm + (MG) : \(\partial_t\rho+(\sigma/\varepsilon_0)\rho=0\) ; temps de relaxation \(\varepsilon_0/\sigma\), d'où \(\rho=0\) en volume.</li>
      <li><span class="step">Courant de déplacement.</span> Comparer \(\varepsilon_0\omega\) à \(\sigma\) : si \(\varepsilon_0\omega/\sigma\ll1\), le négliger dans (MA) (ARQS magnétique).</li>
      <li><span class="step">Écrire le système</span> : \(\operatorname{div}\vec E=0\), \(\operatorname{div}\vec B=0\), \(\overrightarrow{\operatorname{rot}}\,\vec E=-\partial_t\vec B\), \(\overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\sigma\vec E\).</li>
    </ol>
    <p><em>Exemple éclair :</em> eau de mer (\(\sigma=4{,}8\ \text{S·m}^{-1}\)) à 1 MHz : \(\varepsilon_0\omega/\sigma\approx1\times10^{-5}\) (encore \(\approx10^{-3}\) en tenant compte de sa permittivité relative, voisine de 80) et \(\varepsilon_0/\sigma\approx2\times10^{-12}\ \text{s}\) : l'eau de mer se comporte en bon conducteur pour les ondes radio basse fréquence.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Établir l'équation de diffusion du champ</strong>
    <ol>
      <li><span class="step">Rotationnel</span> de (MF), puis (MA) sans courant de déplacement :
      <div class="formula">$$\overrightarrow{\operatorname{rot}}\big(\overrightarrow{\operatorname{rot}}\,\vec E\big)=-\partial_t\big(\overrightarrow{\operatorname{rot}}\,\vec B\big)=-\mu_0\sigma\,\partial_t\vec E$$</div></li>
      <li><span class="step">Double rotationnel</span> avec \(\operatorname{div}\vec E=0\) : le membre de gauche vaut \(-\Delta\vec E\).</li>
      <li><span class="step">Conclure</span> : \(\Delta\vec E=\mu_0\sigma\,\partial_t\vec E\), même équation pour \(\vec B\) et \(\vec j\) ; coefficient de diffusion \(D=1/(\mu_0\sigma)\).</li>
      <li><span class="step">Interpréter</span> : ordre 1 en temps (irréversible, dissipation) ; durée de pénétration sur une profondeur \(L\) : \(\tau_d\sim\mu_0\sigma L^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> aluminium (\(\sigma=3{,}8\times10^{7}\ \text{S·m}^{-1}\)) : \(D\approx2{,}1\times10^{-2}\ \text{m}^2\text{·s}^{-1}\) ; un champ met \(\tau_d\sim\mu_0\sigma L^2\approx5\ \text{ms}\) à pénétrer sur \(L=1\ \text{cm}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Obtenir la relation de dispersion et l'épaisseur de peau</strong>
    <ol>
      <li><span class="step">Injecter</span> la pseudo-OPPM \(E_0\,e^{i(\omega t - \underline{k}z)}\) : \(\Delta \to -\underline{k}^2\), \(\partial/\partial t \to i\omega\) : \(\underline k^2=-i\mu_0\sigma\omega\).</li>
      <li><span class="step">Résoudre</span> : \(-i = e^{-i\pi/2}\), donc \(\sqrt{-i}=\pm(1-i)/\sqrt2\) et \(\underline k=\pm\dfrac{1-i}{\delta}\) avec \(\delta=\sqrt{\dfrac{2}{\mu_0\sigma\omega}}\).</li>
      <li><span class="step">Choisir la racine</span> physique : pour une onde entrant par \(z=0\) vers \(z\gt0\), \(k'\gt0\) et \(k''\gt0\) (amplitude décroissante dans le sens de propagation) : \(\underline k=(1-i)/\delta\).</li>
      <li><span class="step">Interpréter</span> : \(\delta\) est la longueur caractéristique d'atténuation de l'amplitude ; \(v_\varphi=\omega\delta\) dépend de \(\omega\) (milieu dispersif) ; \(k''\neq0\) (milieu absorbant).</li>
    </ol>
    <p><em>Exemple éclair :</em> aluminium à 50 Hz : \(\delta=1/\sqrt{\pi\mu_0\sigma f}\approx12\ \text{mm}\) ; à 50 kHz, \(\delta\) est divisée par \(\sqrt{1000}\approx32\) : \(0{,}37\ \text{mm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : homogénéité. \(\mu_0\sigma\omega\) est en m⁻², donc \(\delta\) en mètres ; et \(\delta\) fait intervenir la <em>pulsation</em> : avec la fréquence, \(\delta=1/\sqrt{\pi\mu_0\sigma f}\).</div>

  <div class="method-box">
    <strong>Méthode 4 — Écrire les champs réels dans le conducteur et les interpréter</strong>
    <ol>
      <li><span class="step">Champ électrique</span> : \(\vec E=E_0\,e^{-z/\delta}\cos(\omega t-z/\delta)\,\vec e_x\), partie réelle de la pseudo-OPPM.</li>
      <li><span class="step">Champ magnétique</span> par (MF) : \(\underline{\vec B}=\dfrac{\underline k}{\omega}\,\vec e_z\wedge\underline{\vec E}\), avec \(\underline k=\dfrac{\sqrt2}{\delta}e^{-i\pi/4}\) : \(\vec B\) est en retard de \(\pi/4\) sur \(\vec E\), d'amplitude \(\sqrt2E_0/(\omega\delta)\).</li>
      <li><span class="step">Lire</span> : amplitude divisée par \(e\) sur \(\delta\), puissance sur \(\delta/2\) ; « longueur d'onde » \(2\pi\delta\), sur laquelle l'amplitude perd un facteur 535.</li>
      <li><span class="step">Conclure</span> sur la pénétration : au-delà de quelques \(\delta\), champs et courants sont négligeables.</li>
    </ol>
    <p><em>Exemple éclair :</em> à la profondeur \(3\delta\), l'amplitude ne vaut plus que \(e^{-3}\approx5\ \%\) de sa valeur en surface, et la puissance volumique dissipée \(e^{-6}\approx0{,}25\ \%\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Faire le bilan d'énergie dans un conducteur (effet de peau)</strong>
    <ol>
      <li><span class="step">Puissance volumique</span> moyenne dissipée : \(\langle p\rangle=\tfrac12\sigma\,|\underline E(z)|^2\), soit \(\tfrac12\sigma E_s^2\,e^{-2z/\delta}\).</li>
      <li><span class="step">Intégrer</span> sur une colonne de section unité : \(P_S=\displaystyle\int_0^{\infty}\langle p\rangle\,\mathrm dz=\dfrac{\sigma E_s^2\,\delta}{4}\).</li>
      <li><span class="step">Comparer</span> au flux moyen du vecteur de Poynting entrant en \(z=0\), \(\tfrac{1}{2\mu_0}\operatorname{Re}\big(\underline E_x\underline B_y^{*}\big)\) : ils sont égaux (bilan intégral de Poynting en régime sinusoïdal établi).</li>
      <li><span class="step">Écrire avec le courant</span> : le courant total par unité de largeur \(\underline J=\int_0^\infty\underline j\,\mathrm dz\) donne \(P_S=\tfrac12R_s|\underline J|^2\), avec la résistance de surface \(R_s=1/(\sigma\delta)\) : tout se passe comme si le courant occupait uniformément une couche d'épaisseur \(\delta\).</li>
    </ol>
    <p><em>Exemple éclair :</em> cuivre à 1 GHz : \(\delta\approx2{,}1\ \mu\text{m}\) et \(R_s\approx8\ \text{m}\Omega\) ; pour un courant surfacique d'amplitude \(1\ \text{A·m}^{-1}\), les pertes valent \(\tfrac12R_s\times1^2\approx4\ \text{mW·m}^{-2}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Exploiter un métal parfait et les relations de passage</strong>
    <ol>
      <li><span class="step">Champs intérieurs nuls</span> (admis) en régime variable : \(\vec E=\vec 0\), \(\vec B=\vec 0\) dans le métal.</li>
      <li><span class="step">Orienter</span> la normale \(\vec n\) <strong>sortante du métal</strong> (vers le vide) ; les relations de passage (fournies) se réduisent à \(\vec E=\dfrac{\sigma_s}{\varepsilon_0}\vec n\) et \(\vec B=\mu_0\vec j_s\wedge\vec n\) juste à l'extérieur.</li>
      <li><span class="step">Conditions aux limites</span> : \(\vec E\) tangentiel nul et \(B_n\) nul sur la paroi (\(\vec E\) normal, \(\vec B\) tangent).</li>
      <li><span class="step">Sources surfaciques</span> : \(\sigma_s=\varepsilon_0\,\vec E\cdot\vec n\) et \(\vec j_s=\dfrac{1}{\mu_0}\,\vec n\wedge\vec B\), calculées avec les champs <em>totaux</em> au contact.</li>
    </ol>
    <p><em>Exemple éclair :</em> métal en \(z\gt0\) (\(\vec n=-\vec e_z\)), champ total au contact \(\vec B=\dfrac{2E_0}{c}\cos(\omega t)\,\vec e_y\) avec \(E_0=10\ \text{V·m}^{-1}\) : \(\vec j_s=\dfrac{1}{\mu_0}(-\vec e_z)\wedge\vec B\), soit \(2\varepsilon_0cE_0\cos(\omega t)\,\vec e_x\), d'amplitude \(5{,}3\times10^{-2}\ \text{A·m}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le sens de \(\vec n\) fixe le signe de \(\vec j_s\). Avec la normale entrante, on trouverait un courant de sens opposé, contraire à la loi de Lenz (le courant surfacique doit annuler le champ dans le métal).</div>

  <div class="method-box">
    <strong>Méthode 7 — Établir l'onde réfléchie en incidence normale</strong>
    <ol>
      <li><span class="step">Onde incidente</span> : écrire \(\vec E_i\), puis \(\vec B_i=\vec k_i\wedge\vec E_i/\omega\).</li>
      <li><span class="step">Nécessité d'une onde réfléchie</span> : seule, l'onde incidente ne peut pas avoir un champ tangentiel nul sur la paroi à tout instant.</li>
      <li><span class="step">Postuler</span> une OPPM de même pulsation (condition vraie à tout instant), de vecteur d'onde \(\vec k_r=-\vec k_i\), de même direction de polarisation : \(\underline{\vec E}_r=\underline r\,E_0\,e^{i(\omega t+kz)}\,\vec u_E\).</li>
      <li><span class="step">Condition aux limites</span> : \(\vec E\) tangentiel total nul sur le miroir \(\Rightarrow\underline r=-1\) ; puis \(\vec B_r=\vec k_r\wedge\vec E_r/\omega\), qui s'ajoute à \(\vec B_i\) sur le miroir (coefficient \(+1\) pour \(\vec B\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec E_i=E_0\cos(\omega t-kz)\,\vec e_y\) sur un miroir en \(z=0\) (métal en \(z\gt0\)) : \(\vec E_r=-E_0\cos(\omega t+kz)\,\vec e_y\), \(\vec B_i=-\dfrac{E_0}{c}\cos(\omega t-kz)\,\vec e_x\) et \(\vec B_r=-\dfrac{E_0}{c}\cos(\omega t+kz)\,\vec e_x\) : en \(z=0\), \(\vec E\) s'annule et \(\vec B\) double.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Caractériser une onde stationnaire</strong>
    <ol>
      <li><span class="step">Mettre en produit</span> : sommer les champs (complexes, ou réels avec \(\cos p\pm\cos q\)) pour obtenir \(f(z)\,g(t)\).</li>
      <li><span class="step">Nœuds et ventres</span> : zéros et extremums de \(|f(z)|\) ; nœud de \(\vec E\) sur chaque métal parfait ; espacement \(\lambda/2\) ; nœuds de \(\vec B\) aux ventres de \(\vec E\) (décalage \(\lambda/4\)).</li>
      <li><span class="step">Phases</span> : \(\vec E\) et \(\vec B\) en quadrature temporelle ; deux points séparés par un nœud vibrent en opposition de phase.</li>
      <li><span class="step">Énergie</span> : \(\langle\vec\Pi\rangle=\vec 0\) (aucun transport moyen) ; \(\langle u\rangle\) uniforme, échange entre énergie électrique et magnétique tous les quarts de période.</li>
    </ol>
    <p><em>Exemple éclair :</em> four à micro-ondes (2,45 GHz) : \(\lambda\approx12{,}2\ \text{cm}\) ; devant une paroi, nœuds de \(\vec E\) tous les \(6{,}1\ \text{cm}\) (le premier sur la paroi), premier ventre à \(3{,}1\ \text{cm}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Quantifier les modes d'une cavité à une dimension</strong>
    <ol>
      <li><span class="step">Forme du champ</span> : solution à variables séparées \(\vec E=E_m\sin(kz)\cos(\omega t+\varphi)\,\vec e_x\), \(\omega=kc\), qui a déjà un nœud en \(z=0\).</li>
      <li><span class="step">Seconde paroi</span> en \(z=L\) : \(\sin(kL)=0\Rightarrow k_n=n\pi/L\), \(n\in\mathbb N^*\).</li>
      <li><span class="step">Fréquences propres</span> : \(f_n=n\,\dfrac{c}{2L}\), \(\lambda_n=2L/n\) : \(L\) contient un nombre entier de demi-longueurs d'onde ; écart constant \(c/(2L)\) entre modes voisins.</li>
      <li><span class="step">Compter</span> les modes dans une bande \([f_1;f_2]\) : entiers \(n\) tels que \(f_1\le nc/(2L)\le f_2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(L=5{,}0\ \text{cm}\) : \(c/(2L)=3{,}0\ \text{GHz}\) ; entre 8 et 16 GHz, trois modes : \(n=3\), 4 et 5 (9, 12 et 15 GHz).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Mesurer une longueur d'onde en ondes centimétriques</strong>
    <ol>
      <li><span class="step">Montage</span> : émetteur à cornet (≈ 10 GHz) face à une plaque métallique perpendiculaire au faisceau ; sonde (ou petit cornet) à diode, sensible au carré moyen du champ, déplacée sur l'axe.</li>
      <li><span class="step">Repérer</span> les minima du signal (nœuds de \(\vec E\)) : ils sont espacés de \(\lambda/2\).</li>
      <li><span class="step">Mesurer</span> la distance \(D\) entre deux minima éloignés de \(N\) intervalles : \(\lambda=2D/N\) (l'incertitude de lecture est divisée par \(N\)).</li>
      <li><span class="step">Critiquer</span> : minima non nuls (réflexion imparfaite, onde pas tout à fait plane, réflexions parasites) ; une sonde sensible à \(\vec B\) donnerait des minima décalés de \(\lambda/4\).</li>
    </ol>
    <p><em>Exemple éclair :</em> 9 intervalles sur \(D=13{,}5\ \text{cm}\) : \(\lambda=3{,}00\ \text{cm}\) et \(f=c/\lambda=10{,}0\ \text{GHz}\) ; une erreur de 1 mm sur \(D\) ne fait varier \(\lambda\) que de \(0{,}2\ \text{mm}\).</p>
  </div>

  <div class="notice"><strong>Hors programme, souvent guidé : conductivité complexe et plasma</strong>. Modèle de Drude : principe fondamental pour un électron avec frottement \(-m\vec v/\tau\), puis \(\mathrm d/\mathrm dt\to i\omega\) et \(\underline{\vec j}=-ne\underline{\vec v}\), d'où \(\underline\sigma=\sigma_0/(1+i\omega\tau)\). Plasma sans collisions : \(\underline\sigma=-i\varepsilon_0\omega_p^2/\omega\) ; on garde alors le courant de déplacement (l'ARQS ne s'applique pas) et l'on obtient \(\underline k^2=(\omega^2-\omega_p^2)/c^2\) : propagation si \(\omega\gt\omega_p\), onde évanescente sinon (réflexion totale, sans absorption).</div>

  <div class="method-box">
    <strong>Pièges et ordres de grandeur</strong>
    <ul>
      <li>Convention de signe : avec \(e^{i(\omega t - kz)}\), on écrit \(\underline{k} = k' - ik''\) ; avec \(e^{i(kz - \omega t)}\), \(\underline{k} = k' + ik''\). Toujours vérifier que l'amplitude décroît dans le sens de propagation.</li>
      <li>\(\delta\) (cuivre) : 9 mm à 50 Hz, 65 µm à 1 MHz, 0,65 µm à 10 GHz ; \(\delta\) varie comme \(1/\sqrt f\).</li>
      <li>Ne pas confondre \(\delta\) (atténuation de l'amplitude d'un facteur \(e\)) avec la « longueur d'onde » \(2\pi\delta\) dans le métal.</li>
      <li>Les courants surfaciques du métal parfait se calculent avec le champ <em>total</em> (incident + réfléchi), jamais avec le seul champ incident.</li>
      <li>Une onde stationnaire ne transporte pas d'énergie en moyenne, mais \(\vec\Pi\) instantané n'est pas nul : l'énergie oscille entre ventres de \(\vec E\) et ventres de \(\vec B\).</li>
    </ul>
  </div>
</div>
