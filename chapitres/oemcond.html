<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Épaisseur de peau : du sous-marin à la plaque à induction</h3>
  <div class="statement">L'épaisseur de peau d'un conducteur ohmique de conductivité \(\sigma\) vaut \(\delta=\sqrt{2/(\mu_0\sigma\omega)}=1/\sqrt{\pi\mu_0\sigma f}\) ; dans un matériau ferromagnétique, on admet que \(\mu_0\) est remplacé par \(\mu_0\mu_r\). Données : \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\), \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\) ; eau de mer \(\sigma=4{,}8\ \text{S·m}^{-1}\) (permittivité relative \(\approx80\)) ; acier de cuisine \(\sigma=1{,}0\times10^{6}\ \text{S·m}^{-1}\), \(\mu_r\approx100\) ; aluminium \(\sigma=3{,}8\times10^{7}\ \text{S·m}^{-1}\), \(\mu_r=1\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que l'eau de mer se comporte comme un conducteur ohmique en ARQS magnétique à 10 kHz (on comparera les courants de déplacement et de conduction, en tenant compte de la permittivité \(80\,\varepsilon_0\)).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\delta\) dans l'eau de mer à 10 kHz et à 76 Hz. Un sous-marin navigue à 20 m de profondeur : de quel facteur l'amplitude d'une onde radio est-elle réduite à chacune de ces fréquences ? Pourquoi les transmissions vers les sous-marins utilisent-elles des fréquences extrêmement basses ?</div>
  <div class="q"><strong>Q3.</strong> Une plaque à induction crée sous la casserole un champ magnétique alternatif de fréquence 25 kHz. Calculer \(\delta\) dans le fond d'une casserole en acier, puis dans une casserole en aluminium. Où la chaleur est-elle produite ?</div>
  <div class="q"><strong>Q4.</strong> À courant induit total égal, les pertes Joule par unité de surface sont proportionnelles à la résistance de surface \(R_s=1/(\sigma\delta)\) (exercice 4). Comparer les deux casseroles et expliquer pourquoi les plaques à induction exigent des fonds en acier.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rapport courant de déplacement / courant de conduction : \(\dfrac{80\,\varepsilon_0\omega}{\sigma}\approx9\times10^{-6}\ll1\) (avec \(\omega=2\pi\times10^{4}\ \text{rad·s}^{-1}\)) : le courant de déplacement est négligeable, l'ARQS magnétique s'applique et l'eau de mer est un (mauvais) conducteur ohmique.</p>
    <p><strong>Q2.</strong> À 10 kHz, \(\delta=1/\sqrt{\pi\times4\pi\times10^{-7}\times4{,}8\times10^{4}}\approx2{,}3\ \text{m}\) ; à 76 Hz, \(\delta\) est multiplié par \(\sqrt{10^{4}/76}\approx11{,}5\) : \(\delta\approx26\ \text{m}\). Atténuation de l'amplitude sur 20 m : \(e^{-20/2{,}3}\approx2\times10^{-4}\) à 10 kHz, mais seulement \(e^{-20/26}\approx0{,}47\) à 76 Hz. Comme \(\delta\propto1/\sqrt f\), seules les fréquences très basses pénètrent assez profondément dans l'eau de mer ; elles imposent en contrepartie des antennes gigantesques et un débit d'information très faible.</p>
    <p><strong>Q3.</strong> Acier : \(\delta=1/\sqrt{\pi\mu_0\mu_r\sigma f}\), avec \(\pi\mu_0\mu_r\sigma f\approx9{,}9\times10^{6}\ \text{m}^{-2}\), donne \(\delta\approx0{,}32\ \text{mm}\). Aluminium : \(\delta\approx0{,}52\ \text{mm}\). Dans les deux cas, \(\delta\) est petite devant l'épaisseur d'un fond de casserole (quelques millimètres) : les courants induits, et donc l'effet Joule, sont concentrés dans une couche de quelques dixièmes de millimètre sous la face inférieure ; la plaque elle-même ne chauffe pas.</p>
    <p><strong>Q4.</strong> \(R_s=1/(\sigma\delta)\) : acier \(\approx3{,}1\ \text{m}\Omega\), aluminium \(\approx5{,}1\times10^{-5}\ \Omega\), soit environ 60 fois moins. À courant égal, l'aluminium chauffe 60 fois moins : sa conductivité est trop bonne. L'acier, moins conducteur et ferromagnétique (\(\mu_r\) réduit \(\delta\)), concentre les courants dans une couche plus mince et plus résistive : il dissipe beaucoup plus.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Onde rasante le long d'un plan métallique</h3>
  <div class="statement">Un métal parfait occupe le demi-espace \(y\lt0\) ; la région \(y\gt0\) est vide. Une OPPM s'y propage parallèlement au plan, selon \(\vec e_z\), avec le champ électrique \(\vec E=E_0\cos(\omega t-kz)\,\vec e_y\), \(k=\omega/c\), \(E_0=50\ \text{V·m}^{-1}\). On rappelle qu'à la surface d'un métal parfait de normale sortante \(\vec n\), le champ juste à l'extérieur vaut \(\vec E=\dfrac{\sigma_s}{\varepsilon_0}\,\vec n\) et \(\vec B=\mu_0\,\vec j_s\wedge\vec n\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer \(\vec B\). Montrer que cette onde est compatible avec la présence du plan métallique, sans onde réfléchie.</div>
  <div class="q"><strong>Q2.</strong> En déduire la densité surfacique de charge \(\sigma_s(z,t)\) et le courant surfacique \(\vec j_s(z,t)\) portés par le plan. Amplitudes ?</div>
  <div class="q"><strong>Q3.</strong> Vérifier la conservation de la charge sur la surface, \(\dfrac{\partial\sigma_s}{\partial t}+\dfrac{\partial j_{s,z}}{\partial z}=0\). Décrire qualitativement ce que font les électrons du métal.</div>
  <div class="q"><strong>Q4.</strong> Pourquoi une onde polarisée selon \(\vec e_x\), \(E_0\cos(\omega t-kz)\,\vec e_x\), ne peut-elle pas se propager seule le long du plan ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Relation de structure : \(\vec B=\dfrac{\vec e_z\wedge\vec E}{c}=-\dfrac{E_0}{c}\cos(\omega t-kz)\,\vec e_x\), car \(\vec e_z\wedge\vec e_y=-\vec e_x\). Sur le plan \(y=0\), \(\vec E\) est normal (selon \(\vec e_y\)) et \(\vec B\) tangent (selon \(\vec e_x\)) : ce sont exactement les conditions imposées au voisinage d'un métal parfait (composante tangentielle de \(\vec E\) et normale de \(\vec B\) nulles). Aucune onde réfléchie n'est nécessaire.</p>
    <p><strong>Q2.</strong> Normale sortante \(\vec n=\vec e_y\). \(\sigma_s=\varepsilon_0\,\vec E\cdot\vec n=\varepsilon_0E_0\cos(\omega t-kz)\), d'amplitude \(\approx4{,}4\times10^{-10}\ \text{C·m}^{-2}\). \(\vec j_s=\dfrac{1}{\mu_0}\,\vec n\wedge\vec B\), où \(\vec n\wedge\vec B=-\dfrac{E_0}{c}\cos(\omega t-kz)\,(\vec e_y\wedge\vec e_x)\), soit \(\vec j_s=\varepsilon_0cE_0\cos(\omega t-kz)\,\vec e_z\) (car \(\vec e_y\wedge\vec e_x=-\vec e_z\)), d'amplitude \(\varepsilon_0cE_0\approx0{,}13\ \text{A·m}^{-1}\).</p>
    <p><strong>Q3.</strong> \(\partial_t\sigma_s=-\omega\varepsilon_0E_0\sin(\omega t-kz)\) et \(\partial_zj_{s,z}=\varepsilon_0cE_0\,k\sin(\omega t-kz)\) ; la somme est nulle puisque \(kc=\omega\). Les électrons de surface oscillent le long de \(Oz\) : ils s'accumulent (\(\sigma_s\lt0\)) et se raréfient (\(\sigma_s\gt0\)) en alternance, sur des bandes de largeur \(\lambda/2\) qui avancent avec l'onde. Ce sont ces charges et courants localisés en surface qui « portent » les lignes de champ de l'onde guidée par le plan.</p>
    <p><strong>Q4.</strong> Ce champ serait tangent au plan et non nul en \(y=0\), alors que la composante tangentielle de \(\vec E\) doit y être nulle (champ nul dans le métal, continuité de \(\vec E_t\)). Une telle onde ne peut exister qu'accompagnée d'autres ondes (réfléchies) qui annulent le champ tangentiel sur le plan.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Blindage d'un boîtier électronique</h3>
  <div class="statement">Un circuit sensible est enfermé dans un boîtier en tôle d'aluminium d'épaisseur \(d = 0{,}50\ \text{mm}\) (\(\sigma = 3{,}8\times10^{7}\ \text{S·m}^{-1}\), \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\)). Pour simplifier, on estime l'efficacité du blindage par la seule atténuation de l'amplitude du champ sur l'épaisseur de la tôle (on ignore les réflexions sur les faces).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'épaisseur de peau de l'aluminium à 50 Hz, 10 kHz et 1 MHz.</div>
  <div class="q"><strong>Q2.</strong> Pour chacune de ces fréquences, calculer le facteur d'atténuation de l'amplitude à travers la tôle, puis l'exprimer en décibels (\(20\log_{10}\) du rapport des amplitudes).</div>
  <div class="q"><strong>Q3.</strong> À partir de quelle fréquence le blindage atténue-t-il d'au moins 60 dB ?</div>
  <div class="q"><strong>Q4.</strong> Pourquoi est-il si difficile de se protéger du champ magnétique à 50 Hz d'un transformateur ? Quel type de matériau utilise-t-on alors (on rappelle que dans un milieu magnétique, \(\mu_0\) est remplacé par \(\mu_0\mu_r\)) ?</div>
  <div class="q"><strong>Q5.</strong> Expliquer pourquoi un téléphone (vers 1 GHz) perd le réseau dans une cabine d'ascenseur métallique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\delta = \dfrac{1}{\sqrt{\pi\mu_0\sigma f}}\) avec \(\pi\mu_0\sigma \approx 150\ \text{s·m}^{-2}\). À 50 Hz : \(\delta \approx 11{,}5\ \text{mm}\) ; à 10 kHz : \(\delta \approx 0{,}82\ \text{mm}\) ; à 1 MHz : \(\delta \approx 82\ \mu\text{m}\).</p>
    <p><strong>Q2.</strong> Facteur \(e^{-d/\delta}\), soit en décibels \(20\log_{10}(e^{d/\delta}) \approx 8{,}69\,d/\delta\).</p>
    <ul>
      <li>50 Hz : \(d/\delta \approx 0{,}043\), facteur 0,96, soit 0,4 dB : aucune protection.</li>
      <li>10 kHz : \(d/\delta \approx 0{,}61\), facteur 0,54, soit 5 dB.</li>
      <li>1 MHz : \(d/\delta \approx 6{,}1\), facteur \(2\times10^{-3}\), soit 53 dB.</li>
    </ul>
    <p><strong>Q3.</strong> 60 dB correspondent à un rapport 1000 : \(d/\delta \geq \ln 1000 \approx 6{,}9\), donc \(\delta \leq 72\ \mu\text{m}\), soit \(f \geq \dfrac{1}{\pi\mu_0\sigma\delta^2} \approx 1{,}3\ \text{MHz}\).</p>
    <p><strong>Q4.</strong> À 50 Hz, \(\delta\) dépasse le centimètre : il faudrait plusieurs centimètres d'aluminium. Avec un matériau ferromagnétique (\(\mu_r\) de \(10^3\) à \(10^5\), alliages de type mu-métal), \(\delta\) est divisée par \(\sqrt{\mu_r}\) ; de plus, ce matériau canalise les lignes de champ autour de la zone à protéger.</p>
    <p><strong>Q5.</strong> À 1 GHz, \(\delta \approx 2{,}6\ \mu\text{m}\) dans l'aluminium (encore moins dans l'acier) : une paroi de quelques millimètres représente des milliers d'épaisseurs de peau. La cabine est une cage de Faraday ; seules les ouvertures laissent passer un peu de signal.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Pertes par effet Joule et résistance de surface</h3>
  <div class="statement">Un bon conducteur de conductivité \(\sigma\) occupe le demi-espace \(z \gt 0\). Le champ à sa surface vaut \(E_s\cos(\omega t)\,\vec e_x\) (\(E_s\) réel) ; dans le conducteur, \(\vec E = E_s\,e^{-z/\delta}\cos(\omega t - z/\delta)\,\vec e_x\), avec \(\delta = \sqrt{2/(\mu_0\sigma\omega)}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer la puissance volumique moyenne \(\langle p\rangle(z)\) cédée aux porteurs de charge.</div>
  <div class="q"><strong>Q2.</strong> En déduire la puissance moyenne \(P_S\) dissipée par unité de surface du conducteur.</div>
  <div class="q"><strong>Q3.</strong> Calculer le courant complexe par unité de largeur \(\underline{J} = \int_0^{\infty}\underline{j}\,\mathrm{d}z\). Montrer que \(P_S = \tfrac12 R_s|\underline{J}|^2\) avec \(R_s = 1/(\sigma\delta)\). Interpréter \(R_s\).</div>
  <div class="q"><strong>Q4.</strong> Un fil de cuivre (\(\sigma = 6{,}0\times10^{7}\ \text{S·m}^{-1}\)) de rayon \(a = 1{,}0\ \text{mm}\) et de longueur 1,0 m est parcouru par un courant à 1 MHz. Comparer sa résistance à sa résistance en continu (on assimile la surface du fil à un plan, puisque \(a \gg \delta\)).</div>
  <div class="q"><strong>Q5.</strong> Pourquoi les bobinages d'alimentations à découpage utilisent-ils des fils formés de nombreux brins fins isolés ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(j = \sigma E\) en phase avec \(E\) : \(\langle p\rangle = \sigma\langle E^2\rangle\), soit \(\tfrac12\sigma E_s^2\,e^{-2z/\delta}\). La puissance dissipée décroît sur \(\delta/2\).</p>
    <p><strong>Q2.</strong> \(P_S = \displaystyle\int_0^{\infty}\tfrac12\sigma E_s^2\,e^{-2z/\delta}\,\mathrm{d}z = \dfrac{\sigma E_s^2\,\delta}{4}\).</p>
    <p><strong>Q3.</strong> \(\underline{j} = \sigma E_s\,e^{-(1+i)z/\delta}e^{i\omega t}\), donc \(\underline{J} = \dfrac{\sigma E_s\,\delta}{1+i}\,e^{i\omega t}\) et \(|\underline J| = \dfrac{\sigma E_s\,\delta}{\sqrt2}\). Alors :</p>
    <div class="formula">$$\frac12R_s|\underline J|^2 = \frac{1}{2\sigma\delta}\cdot\frac{\sigma^2E_s^2\delta^2}{2} = \frac{\sigma E_s^2\delta}{4} = P_S$$</div>
    <p>Tout se passe comme si le courant était uniformément réparti sur une épaisseur \(\delta\) : \(R_s\) est la résistance d'un carré de cette couche (en ohms).</p>
    <p><strong>Q4.</strong> En continu : \(R_0 = \dfrac{\ell}{\sigma\pi a^2} \approx 5{,}3\ \text{m}\Omega\). À 1 MHz, \(\delta \approx 65\ \mu\text{m}\) et le courant occupe une couronne de périmètre \(2\pi a\) et d'épaisseur \(\delta\) : \(R \approx \dfrac{\ell}{\sigma\,2\pi a\,\delta} \approx 41\ \text{m}\Omega\). Le rapport vaut \(a/(2\delta) \approx 8\).</p>
    <p><strong>Q5.</strong> Des brins de diamètre inférieur à \(\delta\) sont parcourus par un courant presque uniforme ; isolés entre eux et torsadés, ils offrent une grande surface totale : la résistance en haute fréquence reste proche de la résistance en continu (fil de Litz).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Bilan d'énergie local dans un conducteur : Poynting et effet Joule</h3>
  <div class="statement">Un bon conducteur de conductivité \(\sigma\) occupe le demi-espace \(z\gt0\). On y étudie, en ARQS magnétique, le champ \(\vec E=E_s\,e^{-z/\delta}\cos(\omega t-z/\delta)\,\vec e_x\), soit en complexe \(\underline{\vec E}=E_s\,e^{i(\omega t-\underline kz)}\,\vec e_x\) avec \(\underline k=(1-i)/\delta\) et \(\delta=\sqrt{2/(\mu_0\sigma\omega)}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer \(\underline{\vec B}\) à partir de Maxwell-Faraday.</div>
  <div class="q"><strong>Q2.</strong> Calculer le vecteur de Poynting moyen \(\langle\vec\Pi\rangle(z)\). Comment varie-t-il avec \(z\) ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance volumique moyenne \(\langle p\rangle(z)\) cédée aux porteurs. Vérifier le bilan local moyen \(\dfrac{\mathrm d\langle\Pi_z\rangle}{\mathrm dz}=-\langle p\rangle\) et l'interpréter. Pourquoi le terme \(\partial_t u_{em}\) n'apparaît-il pas ?</div>
  <div class="q"><strong>Q4.</strong> Application : cuivre (\(\sigma=6{,}0\times10^{7}\ \text{S·m}^{-1}\)) éclairé à 1,0 GHz par une onde d'amplitude \(E_0=100\ \text{V·m}^{-1}\) ; on admet que \(E_s=\sqrt2\,\omega\delta E_0/c\). Calculer \(\delta\), \(E_s\), la puissance absorbée par unité de surface, et la comparer à l'éclairement incident \(\varepsilon_0cE_0^2/2\). Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En complexe, (MF) s'écrit \(-i\underline k\,\vec e_z\wedge\underline{\vec E}=-i\omega\underline{\vec B}\), d'où \(\underline{\vec B}=\dfrac{\underline k}{\omega}\,E_s\,e^{i(\omega t-\underline kz)}\,\vec e_y\), soit \(\underline{\vec B}=\dfrac{1-i}{\omega\delta}\,\underline E\,\vec e_y\) en notant \(\underline E=E_s\,e^{i(\omega t-\underline kz)}\). Comme \(1-i=\sqrt2\,e^{-i\pi/4}\), \(\vec B\) est en retard de \(\pi/4\) sur \(\vec E\), d'amplitude \(\sqrt2E_s\,e^{-z/\delta}/(\omega\delta)\).</p>
    <p><strong>Q2.</strong> Le vecteur de Poynting moyen vaut \(\dfrac{1}{2\mu_0}\operatorname{Re}\big(\underline{\vec E}\wedge\underline{\vec B}^{*}\big)\). Avec \(\vec e_x\wedge\vec e_y=\vec e_z\), \(|e^{-i\underline kz}|^2=e^{-2z/\delta}\) et \(\operatorname{Re}\big((1-i)^{*}\big)=1\) :</p>
    <div class="formula">$$\langle\vec\Pi\rangle=\frac{E_s^2}{2\mu_0\omega\delta}\,e^{-2z/\delta}\,\vec e_z$$</div>
    <p>L'énergie progresse vers l'intérieur du métal et le flux décroît sur la distance \(\delta/2\).</p>
    <p><strong>Q3.</strong> \(\langle p\rangle=\dfrac12\operatorname{Re}\big(\underline{\vec j}\cdot\underline{\vec E}^{*}\big)\), soit \(\langle p\rangle=\tfrac12\sigma E_s^2\,e^{-2z/\delta}\). D'autre part :</p>
    <div class="formula">$$\frac{\mathrm d\langle\Pi_z\rangle}{\mathrm dz}=-\frac{2}{\delta}\cdot\frac{E_s^2}{2\mu_0\omega\delta}\,e^{-2z/\delta}=-\frac{E_s^2}{\mu_0\omega\delta^2}\,e^{-2z/\delta}$$</div>
    <p>et \(\mu_0\omega\delta^2=2/\sigma\) : on retrouve \(-\tfrac12\sigma E_s^2e^{-2z/\delta}=-\langle p\rangle\). C'est la moyenne du bilan local de Poynting : la diminution du flux d'énergie d'une tranche à la suivante est exactement la puissance dissipée par effet Joule dans la tranche. Le terme \(\partial_tu_{em}\) a une moyenne nulle en régime sinusoïdal établi (\(u_{em}\) est périodique).</p>
    <p><strong>Q4.</strong> \(\delta=1/\sqrt{\pi\mu_0\sigma f}\approx2{,}1\ \mu\text{m}\) ; \(E_s=\sqrt2\,\omega\delta E_0/c\approx6{,}1\times10^{-3}\ \text{V·m}^{-1}\) : le champ électrique à la surface est minuscule, ce qui justifie le modèle du métal parfait. Puissance absorbée : \(P_S=\langle\Pi_z(0)\rangle=\dfrac{\sigma E_s^2\delta}{4}\), soit \(1{,}1\times10^{-3}\ \text{W·m}^{-2}\), contre \(\varepsilon_0cE_0^2/2\approx13\ \text{W·m}^{-2}\) incidents : le métal absorbe moins de \(10^{-4}\) de l'énergie reçue (\(2\omega\delta/c\approx9\times10^{-5}\)), il réfléchit tout le reste.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Mesure de longueur d'onde sur un banc micro-ondes</h3>
  <div class="statement">Une plaque métallique, assimilée à un conducteur parfait, occupe le demi-espace \(z \lt 0\). Un émetteur, placé loin du côté \(z \gt 0\), envoie vers elle une onde plane \(\vec E_i = E_0\cos(\omega t + kz)\,\vec e_x\), avec \(k = \omega/c\) et \(E_0 = 20\ \text{V·m}^{-1}\). Une petite antenne-sonde, déplacée le long de l'axe, mesure l'amplitude du champ électrique.</div>
  <div class="q"><strong>Q1.</strong> Dans quel sens se propage l'onde incidente ? Exprimer \(\vec B_i\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer l'onde réfléchie, puis le champ électrique total. Préciser la position des nœuds et des ventres de \(\vec E\).</div>
  <div class="q"><strong>Q3.</strong> La sonde relève un minimum sur la plaque, puis six autres minima, le dernier à 9,0 cm de la plaque. En déduire \(\lambda\) et la fréquence de l'émetteur.</div>
  <div class="q"><strong>Q4.</strong> On remplace la sonde par une petite boucle, sensible au champ magnétique. Où observe-t-on maintenant les maxima ?</div>
  <div class="q"><strong>Q5.</strong> Déterminer la densité surfacique de courant sur la plaque et son amplitude. Que vaut la densité surfacique de charge ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La phase \(\omega t + kz\) correspond à une propagation vers les \(z\) décroissants : \(\vec k_i = -k\,\vec e_z\). Relation de structure : \(\vec B_i = \dfrac{\vec k_i\wedge\vec E_i}{\omega} = -\dfrac{E_0}{c}\cos(\omega t + kz)\,\vec e_y\).</p>
    <p><strong>Q2.</strong> L'onde réfléchie se propage vers les \(z\) croissants ; la nullité de \(\vec E\) tangent en \(z = 0\) impose \(\vec E_r = -E_0\cos(\omega t - kz)\,\vec e_x\). Avec \(\cos p - \cos q = -2\sin\frac{p+q}{2}\sin\frac{p-q}{2}\) :</p>
    <div class="formula">$$\vec E = -2E_0\sin(\omega t)\sin(kz)\,\vec e_x$$</div>
    <p>Nœuds de \(\vec E\) en \(z = p\lambda/2\) (\(p \in \mathbb N\)), ventres en \(z = \lambda/4 + p\lambda/2\).</p>
    <p><strong>Q3.</strong> Du premier au septième minimum, il y a six intervalles de \(\lambda/2\) : \(3\lambda = 9{,}0\ \text{cm}\), donc \(\lambda = 3{,}0\ \text{cm}\) et \(f = c/\lambda = 10\ \text{GHz}\).</p>
    <p><strong>Q4.</strong> \(\vec B_r = \dfrac{k\,\vec e_z\wedge\vec E_r}{\omega} = -\dfrac{E_0}{c}\cos(\omega t - kz)\,\vec e_y\), d'où \(\vec B = -\dfrac{2E_0}{c}\cos(\omega t)\cos(kz)\,\vec e_y\). Les maxima de \(|B|\) sont aux nœuds de \(\vec E\) : sur la plaque, puis tous les 1,5 cm.</p>
    <p><strong>Q5.</strong> La normale sortante du conducteur est \(\vec n = +\vec e_z\) : \(\vec j_s = \dfrac{1}{\mu_0}\vec e_z\wedge\vec B(0) = \dfrac{2E_0}{\mu_0c}\cos(\omega t)\,\vec e_x\) (car \(\vec e_z\wedge\vec e_y = -\vec e_x\)). Amplitude \(2\varepsilon_0cE_0 \approx 0{,}11\ \text{A·m}^{-1}\). Le champ électrique est nul sur la plaque : \(\sigma_s = 0\).</p>
  </div>
</div>

<div class="exo">

  <div class="q"><strong>Q2.</strong> À fréquence fixée, on observe des résonances (signal maximal) pour \(L=15{,}0\), \(16{,}5\), \(18{,}0\) et \(19{,}5\ \text{cm}\). En déduire \(\lambda\), la fréquence de l'émetteur, et l'ordre \(n\) du mode pour \(L=15{,}0\ \text{cm}\).</div>

  <div class="q"><strong>Q5.</strong> Pourquoi mesure-t-on plusieurs résonances successives plutôt qu'une seule position \(L\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec E=E_m\sin(kz)\cos(\omega t+\varphi)\,\vec e_x\), qui s'annule sur la plaque \(z=0\) ; le champ tangent doit aussi s'annuler sur la plaque \(z=L\) : \(\sin(kL)=0\), soit \(L=n\,\dfrac{\lambda}{2}\), \(n\in\mathbb N^*\). La cavité résonne lorsqu'elle contient un nombre entier de demi-longueurs d'onde.</p>
    <p><strong>Q2.</strong> Deux résonances successives correspondent à \(n\) et \(n+1\) : l'écart vaut \(\lambda/2=1{,}5\ \text{cm}\), donc \(\lambda=3{,}0\ \text{cm}\) et \(f=c/\lambda=10\ \text{GHz}\). Pour \(L=15{,}0\ \text{cm}\) : \(n=2L/\lambda=10\). L'écart mesuré sur trois intervalles (\(4{,}5\ \text{cm}\)) donne \(\lambda\) avec une incertitude trois fois plus petite que sur un seul.</p>
    <p><strong>Q3.</strong> Ventres de \(\vec E\) : \(\sin(kz)=\pm1\), soit \(z=\lambda/4+p\,\lambda/2=0{,}75\ \text{cm},\ 2{,}25\ \text{cm},\ \dots\) ; nœuds (signal nul) en \(z=p\,\lambda/2=0,\ 1{,}5\ \text{cm},\ 3{,}0\ \text{cm},\ \dots\), dont les deux plaques.</p>
    <p><strong>Q4.</strong> \(f_n=n\,\dfrac{c}{2L}=n\times1{,}00\ \text{GHz}\) : dans \([8{,}5\,;11{,}5]\ \text{GHz}\), les modes \(n=9\), 10 et 11, soit 9, 10 et 11 GHz.</p>
    <p><strong>Q5.</strong> On ne connaît pas \(n\) a priori, et la position absolue de la plaque mobile (son « zéro ») est mal connue ; l'<em>écart</em> entre résonances, lui, vaut exactement \(\lambda/2\), et le mesurer sur plusieurs intervalles réduit l'incertitude.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Modes propres d'une cavité plane</h3>
  <div class="statement">Deux plans conducteurs parfaits, en \(z = 0\) et \(z = L\), délimitent une cavité vide. On y cherche un champ électrique de la forme \(\vec E = E_m\sin(kz)\cos(\omega t)\,\vec e_x\), avec \(\omega = kc\) et \(E_m\) réel positif.</div>
  <div class="q"><strong>Q1.</strong> Montrer que les conditions aux limites imposent \(k = k_n = n\pi/L\), \(n \in \mathbb N^*\). En déduire les fréquences propres \(f_n\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer le champ magnétique associé (on écartera toute composante statique).</div>
  <div class="q"><strong>Q3.</strong> Pour une section \(S\) de la cavité, calculer l'énergie électrique \(W_E(t)\) et l'énergie magnétique \(W_B(t)\) contenues dans la cavité. Montrer que leur somme est constante et commenter.</div>
  <div class="q"><strong>Q4.</strong> \(L = 12{,}0\ \text{cm}\). Combien de modes propres la cavité possède-t-elle entre 7,0 et 9,5 GHz ?</div>
  <div class="q"><strong>Q5.</strong> La cavité d'un laser hélium-néon mesure \(L = 30{,}0\ \text{cm}\) et émet à \(\lambda = 633\ \text{nm}\). Calculer l'ordre \(n\) du mode et l'écart en fréquence entre deux modes voisins. Le milieu amplificateur amplifie une bande de 1,5 GHz de large : combien de modes peuvent osciller ? Quelle longueur faudrait-il pour un laser monomode ?</div>
  <div class="q"><strong>Q6.</strong> (Complément hors programme.) Calculer la pression moyenne exercée sur la paroi \(z = 0\) pour \(E_m = 1{,}0\ \text{kV·m}^{-1}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec E\) est tangent aux parois et doit y être nul à tout instant : en \(z = 0\), c'est automatique ; en \(z = L\), il faut \(\sin(kL) = 0\), donc \(k = n\pi/L\) (\(n = 0\) donnerait un champ nul). Ainsi \(f_n = \dfrac{k_nc}{2\pi} = n\,\dfrac{c}{2L}\).</p>
    <p><strong>Q2.</strong> Maxwell-Faraday, composante sur \(\vec e_y\) : \(\dfrac{\partial E_x}{\partial z} = -\dfrac{\partial B_y}{\partial t}\), soit \(-\dfrac{\partial B_y}{\partial t} = E_mk\cos(kz)\cos(\omega t)\). Sans composante statique : \(\vec B = -\dfrac{E_m}{c}\cos(kz)\sin(\omega t)\,\vec e_y\).</p>
    <p><strong>Q3.</strong> Avec \(\displaystyle\int_0^L\sin^2(k_nz)\,\mathrm{d}z = \int_0^L\cos^2(k_nz)\,\mathrm{d}z = L/2\) :</p>
    <div class="formula">$$W_E = \frac{\varepsilon_0E_m^2SL}{4}\cos^2(\omega t)$$</div>
    <div class="formula">$$W_B = \frac{E_m^2SL}{4\mu_0c^2}\sin^2(\omega t) = \frac{\varepsilon_0E_m^2SL}{4}\sin^2(\omega t)$$</div>
    <p>La somme \(\varepsilon_0E_m^2SL/4\) est constante : la cavité parfaite ne perd pas d'énergie ; celle-ci passe de la forme électrique à la forme magnétique tous les quarts de période, comme dans un circuit LC idéal.</p>
    <p><strong>Q4.</strong> \(c/(2L) = 1{,}25\ \text{GHz}\) : \(f_n = 1{,}25\,n\) GHz. Dans \([7{,}0 ; 9{,}5]\) GHz : \(n = 6\) (7,50 GHz) et \(n = 7\) (8,75 GHz), soit deux modes.</p>
    <p><strong>Q5.</strong> \(n = 2L/\lambda = \dfrac{0{,}600}{633\times10^{-9}} \approx 9{,}5\times10^{5}\) ; \(\Delta f = c/(2L) = 500\ \text{MHz}\). Trois modes environ tiennent dans 1,5 GHz. Pour un seul mode, il faut \(c/(2L) \gt 1{,}5\ \text{GHz}\), soit \(L \lt 10\ \text{cm}\).</p>
    <p><strong>Q6.</strong> En \(z = 0\), \(\vec n = +\vec e_z\) et \(\vec B(0) = -\dfrac{E_m}{c}\sin(\omega t)\,\vec e_y\), donc \(\vec j_s = \dfrac{1}{\mu_0}\vec e_z\wedge\vec B(0) = \dfrac{E_m}{\mu_0c}\sin(\omega t)\,\vec e_x\). Force surfacique : \(\vec j_s\wedge\tfrac12\vec B(0) = -\dfrac{E_m^2}{2\mu_0c^2}\sin^2(\omega t)\,\vec e_z\), de moyenne \(-\dfrac{\varepsilon_0E_m^2}{4}\,\vec e_z\) : la paroi est poussée vers l'extérieur avec \(P = \varepsilon_0E_m^2/4 \approx 2{,}2\times10^{-6}\ \text{Pa}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ☆ ☆</span>
  <h3>Le modèle de Drude appliqué à l'aluminium (hors programme, pour aller plus loin)</h3>
  <div class="statement">L'aluminium (masse volumique \(\rho_m = 2{,}70\times10^{3}\ \text{kg·m}^{-3}\), masse molaire \(M = 27{,}0\ \text{g·mol}^{-1}\)) libère trois électrons de conduction par atome. Sa conductivité statique vaut \(\sigma_0 = 3{,}8\times10^{7}\ \text{S·m}^{-1}\). Données : \(e = 1{,}60\times10^{-19}\ \text{C}\), \(m = 9{,}11\times10^{-31}\ \text{kg}\), \(N_A = 6{,}02\times10^{23}\ \text{mol}^{-1}\), \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la densité \(n\) d'électrons de conduction.</div>
  <div class="q"><strong>Q2.</strong> En déduire le temps de relaxation \(\tau\) du modèle de Drude.</div>
  <div class="q"><strong>Q3.</strong> On admet que la conductivité peut être considérée comme réelle tant que \(\omega\tau \leq 0{,}1\). Jusqu'à quelle fréquence est-ce le cas ? Quels domaines du spectre sont concernés ?</div>
  <div class="q"><strong>Q4.</strong> Comparer, à 1 GHz, le courant de déplacement au courant de conduction. Jusqu'à quelle fréquence l'ARQS resterait-elle valable ? Commenter.</div>
  <div class="q"><strong>Q5.</strong> Un fil de section 2,5 mm² transporte 16 A. Calculer la vitesse moyenne des électrons et justifier l'hypothèse « force magnétique négligeable ».</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Nombre d'atomes par unité de volume :</p>
    <div class="formula">$$\frac{\rho_m N_A}{M} = \frac{2{,}70\times10^{3}\times6{,}02\times10^{23}}{27{,}0\times10^{-3}}$$</div>
    <p>soit \(6{,}02\times10^{28}\ \text{m}^{-3}\).</p>
    <p>Avec trois électrons par atome : \(n \approx 1{,}8\times10^{29}\ \text{m}^{-3}\).</p>
    <p><strong>Q2.</strong> \(\tau = \dfrac{m\sigma_0}{ne^2}\), soit numériquement :</p>
    <div class="formula">$$\tau = \frac{9{,}11\times10^{-31}\times3{,}8\times10^{7}}{1{,}81\times10^{29}\times(1{,}60\times10^{-19})^2}$$</div>
    <p>donc \(\tau \approx 7{,}5\times10^{-15}\ \text{s}\).</p>
    <p><strong>Q3.</strong> \(f \leq \dfrac{0{,}1}{2\pi\tau} \approx 2\times10^{12}\ \text{Hz}\). Toutes les ondes radio, les micro-ondes et l'infrarouge lointain : dans ce domaine l'aluminium est un conducteur ohmique « ordinaire ».</p>
    <p><strong>Q4.</strong> Le rapport des deux courants vaut \(\varepsilon_0\omega/\sigma_0 \approx 1{,}5\times10^{-9}\) à 1 GHz : le courant de déplacement est totalement négligeable. Avec \(\sigma_0\) réelle, on trouverait un rapport égal à 1 vers \(\sigma_0/(2\pi\varepsilon_0) \approx 7\times10^{17}\ \text{Hz}\), mais ce calcul n'a pas de sens : au-delà de \(\omega\tau \sim 1\), il faut utiliser \(\underline\sigma\) complexe. Le rapport vaut alors \(\varepsilon_0\omega/|\underline\sigma| \approx \omega^2/\omega_p^2\) et atteint 1 vers la fréquence plasma \(f_p = \omega_p/2\pi \approx 4\times10^{15}\ \text{Hz}\) (ultraviolet). Dans tout le domaine où \(\underline\sigma\) est réelle, l'ARQS est donc excellente dans le métal.</p>
    <p><strong>Q5.</strong> \(j = I/S = 6{,}4\times10^{6}\ \text{A·m}^{-2}\), d'où \(v = \dfrac{j}{ne} \approx 2\times10^{-4}\ \text{m·s}^{-1}\). Le rapport force magnétique / force électrique vaut \(vB/E\). Dans le fil, \(E = j/\sigma_0 \approx 0{,}17\ \text{V·m}^{-1}\) ; le champ magnétique créé par le courant est maximal en surface (rayon \(a = \sqrt{S/\pi} \approx 0{,}89\ \text{mm}\)) où il vaut \(B = \dfrac{\mu_0 I}{2\pi a} \approx 3{,}6\ \text{mT}\). Ainsi \(vB/E \approx 5\times10^{-6}\) : l'hypothèse est largement justifiée. (Ne pas utiliser \(B \sim E/c\), valable pour une onde dans le vide : dans un métal, \(B\) est bien plus grand que \(E/c\), cf. §4 ; c'est la petitesse de \(v\) qui rend la force magnétique négligeable.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Le « black-out » radio d'une capsule spatiale (plasma : hors programme, pour aller plus loin)</h3>
  <div class="statement">Lors de sa rentrée dans l'atmosphère, une capsule s'entoure d'une gaine de plasma d'épaisseur \(\ell = 8{,}0\ \text{cm}\), de densité électronique \(n = 1{,}0\times10^{18}\ \text{m}^{-3}\). On modélise ce plasma comme peu dense : ions fixes, collisions négligeables. Données : \(e = 1{,}60\times10^{-19}\ \text{C}\), \(m = 9{,}11\times10^{-31}\ \text{kg}\), \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(c = 3{,}00\times10^{8}\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Établir la conductivité complexe du plasma et faire apparaître la pulsation plasma \(\omega_p\).</div>
  <div class="q"><strong>Q2.</strong> Établir la relation de dispersion pour une onde transverse. Calculer la fréquence de coupure \(f_p\).</div>
  <div class="q"><strong>Q3.</strong> Les liaisons radio de la capsule fonctionnent à 300 MHz. Calculer la distance d'atténuation de l'onde dans la gaine et le facteur d'atténuation de l'amplitude à sa traversée. Conclure.</div>
  <div class="q"><strong>Q4.</strong> On envisage une liaison à 12 GHz. Calculer l'indice du plasma, la vitesse de phase et la vitesse de groupe.</div>
  <div class="q"><strong>Q5.</strong> En fin de rentrée, la densité du plasma diminue. En dessous de quelle densité une liaison à 2,2 GHz est-elle rétablie ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(m\,\mathrm{d}\vec v/\mathrm{d}t = -e\vec E\) donne en complexe \(\underline{\vec v} = \dfrac{-e}{i\omega m}\underline{\vec E}\), puis \(\underline{\vec j} = -ne\underline{\vec v} = -i\dfrac{ne^2}{m\omega}\underline{\vec E}\) : \(\underline\sigma = -i\varepsilon_0\omega_p^2/\omega\) avec \(\omega_p = \sqrt{ne^2/(m\varepsilon_0)}\).</p>
    <p><strong>Q2.</strong> Avec \(\rho = 0\) et Maxwell-Ampère complet : \(\underline k^2 = \dfrac{\omega^2 - \omega_p^2}{c^2}\). Numériquement :</p>
    <div class="formula">$$\omega_p = \sqrt{\frac{10^{18}\times(1{,}60\times10^{-19})^2}{9{,}11\times10^{-31}\times8{,}85\times10^{-12}}}$$</div>
    <p>donc \(\omega_p \approx 5{,}6\times10^{10}\ \text{rad·s}^{-1}\), soit \(f_p \approx 9{,}0\ \text{GHz}\).</p>
    <p><strong>Q3.</strong> \(f = 300\ \text{MHz} \ll f_p\) : onde évanescente, \(\delta_e = \dfrac{c}{\sqrt{\omega_p^2 - \omega^2}} \approx \dfrac{c}{\omega_p} \approx 5{,}3\ \text{mm}\). Facteur \(e^{-\ell/\delta_e} = e^{-15} \approx 3\times10^{-7}\) : aucune communication ne passe, c'est le black-out (l'onde est réfléchie par la gaine).</p>
    <p><strong>Q4.</strong> \(n = \sqrt{1 - (f_p/f)^2}\) avec \(f_p/f = 9{,}0/12\) : \(n \approx 0{,}66\) ; \(v_\varphi = c/n \approx 4{,}5\times10^{8}\ \text{m·s}^{-1}\) (plus grande que \(c\), sans contradiction) ; \(v_g = cn \approx 2{,}0\times10^{8}\ \text{m·s}^{-1}\).</p>
    <p><strong>Q5.</strong> Il faut \(f_p \lt 2{,}2\ \text{GHz}\), soit \(n \lt \dfrac{4\pi^2f^2m\varepsilon_0}{e^2} \approx 6\times10^{16}\ \text{m}^{-3}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Voile solaire et pression de radiation (complément hors programme)</h3>
  <div class="statement">Une sonde spatiale déploie une voile réfléchissante de surface \(S = 800\ \text{m}^2\) ; la masse totale (voile et sonde) vaut \(15\ \text{kg}\). Au voisinage de l'orbite terrestre, la puissance surfacique du rayonnement solaire est \(I = 1{,}36\ \text{kW·m}^{-2}\). On assimile la voile à un conducteur parfait éclairé en incidence normale. Données : \(c = 3{,}00\times10^{8}\ \text{m·s}^{-1}\), \(GM_S = 1{,}33\times10^{20}\ \text{m}^3\text{·s}^{-2}\), distance Soleil–voile \(d = 1{,}50\times10^{11}\ \text{m}\).</div>
  <div class="q"><strong>Q1.</strong> Pour une OPPM d'amplitude \(E_0\) réfléchie par un conducteur parfait, rappeler l'expression du courant surfacique et du champ magnétique au contact du miroir. En admettant que la couche de courant « voit » la moitié de ce champ, montrer que la pression moyenne vaut \(P = \varepsilon_0E_0^2 = 2I/c\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la pression, la force et l'accélération de la sonde.</div>
  <div class="q"><strong>Q3.</strong> Comparer à l'attraction gravitationnelle du Soleil à cette distance. Le rapport dépend-il de la distance au Soleil ?</div>
  <div class="q"><strong>Q4.</strong> Quelle masse surfacique faudrait-il pour que la poussée compense exactement l'attraction solaire ?</div>
  <div class="q"><strong>Q5.</strong> Que deviendrait la force pour une voile noire, parfaitement absorbante ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Au contact du miroir, \(\vec B = \dfrac{2E_0}{c}\cos(\omega t)\,\vec e_y\) et \(\vec j_s = 2\varepsilon_0cE_0\cos(\omega t)\,\vec e_x\). Force par unité de surface : \(\vec j_s\wedge\tfrac12\vec B = 2\varepsilon_0E_0^2\cos^2(\omega t)\,\vec e_z\), de moyenne \(\varepsilon_0E_0^2\). Comme l'intensité incidente vaut \(I = \langle\Pi_i\rangle = \tfrac12\varepsilon_0cE_0^2\), on obtient \(P = 2I/c\).</p>
    <p><strong>Q2.</strong> \(P = \dfrac{2\times1360}{3{,}00\times10^{8}} \approx 9{,}1\times10^{-6}\ \text{Pa}\) ; \(F = PS \approx 7{,}3\times10^{-3}\ \text{N}\) ; \(a = F/m \approx 4{,}8\times10^{-4}\ \text{m·s}^{-2}\).</p>
    <p><strong>Q3.</strong> \(g_S = GM_S/d^2 \approx 5{,}9\times10^{-3}\ \text{m·s}^{-2}\) : la poussée vaut environ 8 % de l'attraction. Les deux varient en \(1/d^2\) (l'intensité lumineuse aussi) : le rapport est indépendant de la distance.</p>
    <p><strong>Q4.</strong> Il faut \(\dfrac{2I}{c}S = m\,g_S\), soit \(\dfrac{m}{S} = \dfrac{2I}{c\,g_S} \approx 1{,}5\times10^{-3}\ \text{kg·m}^{-2}\) : 1,5 g/m², contre 19 g/m² ici. D'où la recherche de films ultra-minces.</p>
    <p><strong>Q5.</strong> Une surface absorbante reçoit la quantité de mouvement des photons sans la renvoyer : \(P = I/c\), la force est divisée par deux.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Du miroir métallique réel à la cavité résonante</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>ondes électromagnétiques et conducteurs</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    On étudie la réflexion d'une onde micro-onde de fréquence \(f = 10\ \text{GHz}\) sur un miroir en cuivre, puis la qualité d'une cavité formée de deux tels miroirs. Données : cuivre \(\sigma_0 = 6{,}0\times10^{7}\ \text{S·m}^{-1}\), \(n = 8{,}5\times10^{28}\ \text{m}^{-3}\) ; \(e = 1{,}60\times10^{-19}\ \text{C}\), \(m = 9{,}11\times10^{-31}\ \text{kg}\), \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\), \(c = 3{,}00\times10^{8}\ \text{m·s}^{-1}\). Notation complexe en \(e^{i\omega t}\). La partie A utilise le modèle de Drude (hors programme), entièrement guidé ; les parties B à E sont au programme.
  </div>

  <p class="exo-part">Partie A — Conduction dans le cuivre (modèle de Drude : hors programme, guidé)</p>
  <div class="q"><strong>A1.</strong> Dans le modèle de Drude (frottement \(-m\vec v/\tau\)), établir la conductivité complexe \(\underline\sigma(\omega)\) et exprimer \(\sigma_0\) en fonction de \(n\), \(e\), \(m\), \(\tau\).</div>
  <div class="q"><strong>A2.</strong> Calculer \(\tau\), puis \(\omega\tau\) à 10 GHz. Conclure. Dans la suite, on note \(\sigma\) la conductivité du cuivre à 10 GHz.</div>
  <div class="q"><strong>A3.</strong> Justifier que, dans le métal, la densité volumique de charge est nulle et que le courant de déplacement est négligeable.</div>

  <p class="exo-part">Partie B — Effet de peau</p>
  <div class="q"><strong>B1.</strong> Le cuivre occupe le demi-espace \(z \gt 0\). Établir l'équation vérifiée par \(\vec E\) dans le métal.</div>
  <div class="q"><strong>B2.</strong> On y cherche \(\underline{\vec E} = \underline{E}_t\,e^{i(\omega t - \underline kz)}\,\vec e_x\). Établir la relation de dispersion, choisir la racine et faire apparaître \(\delta\). Calculer \(\delta\) à 10 GHz.</div>
  <div class="q"><strong>B3.</strong> Exprimer \(\underline{\vec B}\) dans le métal. Calculer le rapport \(c|\underline B|/|\underline E|\) en \(z = 0^+\). Que peut-on en déduire sur le champ électrique tangent à la surface du métal ?</div>

  <p class="exo-part">Partie C — Modèle du conducteur parfait</p>
  <div class="q"><strong>C1.</strong> Justifier que le miroir peut être traité, en première approximation, comme un conducteur parfait.</div>
  <div class="q"><strong>C2.</strong> L'onde incidente, venue de \(z \lt 0\), s'écrit \(\underline{\vec E}_i = E_0\,e^{i(\omega t - kz)}\,\vec e_x\) avec \(E_0\) réel. Déterminer l'onde réfléchie et les champs totaux réels dans le vide.</div>
  <div class="q"><strong>C3.</strong> En déduire la densité surfacique de courant \(\vec j_s\) et la densité surfacique de charge. Application numérique pour \(E_0 = 100\ \text{V·m}^{-1}\).</div>
  <div class="q"><strong>C4.</strong> Revenons au métal réel. En intégrant l'équation de Maxwell-Ampère sur l'épaisseur du métal, montrer que le courant total par unité de largeur \(\int_0^{\infty}\vec j\,\mathrm{d}z\) coïncide avec \(\vec j_s\), si le champ magnétique en \(z = 0^+\) est celui trouvé en C2.</div>

  <p class="exo-part">Partie D — Pertes dans un miroir réel</p>
  <div class="q"><strong>D1.</strong> On admet que la puissance moyenne dissipée par unité de surface du métal vaut \(P_{\text{abs}} = \tfrac12R_s|\underline{J}|^2\), où \(R_s = 1/(\sigma\delta)\) et \(\underline J\) est l'amplitude complexe du courant total par unité de largeur (assimilé à \(\vec j_s\)). Montrer que le coefficient d'absorption \(A = P_{\text{abs}}/\langle\Pi_i\rangle\) vaut \(A = 2\omega\delta/c\).</div>
  <div class="q"><strong>D2.</strong> Calculer \(A\) et le coefficient de réflexion en puissance \(R = 1 - A\). Commenter.</div>

  <p class="exo-part">Partie E — Cavité résonante</p>
  <div class="q"><strong>E1.</strong> Deux miroirs de cuivre parallèles sont distants de \(L = 15{,}0\ \text{cm}\). Donner les fréquences propres de la cavité (miroirs parfaits) et vérifier que 10 GHz en est une. Quel est l'ordre du mode ?</div>
  <div class="q"><strong>E2.</strong> Dans ce mode, le champ est la superposition de deux ondes progressives opposées d'amplitude \(E_0\). Exprimer l'énergie moyenne \(W\) stockée par unité de surface de miroir, puis la puissance moyenne \(P\) perdue par unité de surface dans les deux miroirs. En déduire le facteur de qualité \(Q = \omega W/P\) et montrer que \(Q = L/(2\delta)\).</div>
  <div class="q"><strong>E3.</strong> Calculer \(Q\), la durée caractéristique \(\tau_c\) d'amortissement de l'énergie en l'absence d'excitation, et la largeur \(\Delta f\) de la résonance. Commenter.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(m\dfrac{\mathrm d\vec v}{\mathrm dt} = -e\vec E - \dfrac{m}{\tau}\vec v\) ; en complexe \(\left(i\omega + \dfrac1\tau\right)m\underline{\vec v} = -e\underline{\vec E}\), et \(\underline{\vec j} = -ne\underline{\vec v}\) donne \(\underline\sigma = \dfrac{\sigma_0}{1 + i\omega\tau}\) avec \(\sigma_0 = \dfrac{ne^2\tau}{m}\).</p>
    <p><strong>A2.</strong> \(\tau = \dfrac{m\sigma_0}{ne^2}\), soit :</p>
    <div class="formula">$$\tau = \frac{9{,}11\times10^{-31}\times6{,}0\times10^{7}}{8{,}5\times10^{28}\times(1{,}60\times10^{-19})^2}$$</div>
    <p>donc \(\tau \approx 2{,}5\times10^{-14}\ \text{s}\). À 10 GHz, \(\omega\tau \approx 1{,}6\times10^{-3} \ll 1\) : \(\underline\sigma \approx \sigma_0\), réelle ; le cuivre suit la loi d'Ohm \(\vec j=\sigma\vec E\) avec \(\sigma=\sigma_0\).</p>
    <p><strong>A3.</strong> Conservation de la charge, loi d'Ohm et Maxwell-Gauss : \(\partial\rho/\partial t + (\sigma/\varepsilon_0)\rho = 0\), relaxation en \(\varepsilon_0/\sigma \approx 1{,}5\times10^{-19}\ \text{s}\) : \(\rho = 0\). Rapport déplacement/conduction : \(\varepsilon_0\omega/\sigma \approx 9\times10^{-9}\), négligeable.</p>
    <p><strong>B1.</strong> Rotationnel de Maxwell-Faraday avec \(\operatorname{div}\vec E = 0\) et \(\overrightarrow{\operatorname{rot}}\,\vec B = \mu_0\sigma\vec E\) : \(\Delta\vec E = \mu_0\sigma\,\partial\vec E/\partial t\) (équation de diffusion).</p>
    <p><strong>B2.</strong> \(-\underline k^2 = i\mu_0\sigma\omega\), d'où \(\underline k = \pm\dfrac{1-i}{\delta}\), \(\delta = \sqrt{\dfrac{2}{\mu_0\sigma\omega}}\). On garde \(\underline k = (1-i)/\delta\) : propagation vers \(z \gt 0\) avec amplitude décroissante en \(e^{-z/\delta}\). À 10 GHz : \(\delta = \dfrac{1}{\sqrt{\pi\mu_0\sigma f}} \approx 0{,}65\ \mu\text{m}\).</p>
    <p><strong>B3.</strong> (MF) donne \(\underline{\vec B} = \dfrac{\underline k}{\omega}\vec e_z\wedge\underline{\vec E}\), soit \(\underline{\vec B}=\dfrac{1-i}{\omega\delta}\,\underline E_x\,\vec e_y\), où \(\underline E_x=\underline E_t\,e^{i(\omega t - \underline kz)}\). En \(z = 0^+\) :</p>
    <div class="formula">$$\frac{c|\underline B|}{|\underline E|} = \frac{\sqrt2\,c}{\omega\delta} \approx \frac{1{,}41\times3{,}00\times10^{8}}{6{,}28\times10^{10}\times6{,}5\times10^{-7}}$$</div>
    <p>soit environ \(1\times10^{4}\). Comme \(\vec B\) tangent est continu et vaut, côté vide, environ \(2E_0/c\), le champ électrique tangent à la surface est de l'ordre de \(10^{-4}\times2E_0\) : il est quasi nul, comme pour un conducteur parfait.</p>
    <p><strong>C1.</strong> \(\delta \approx 0{,}65\ \mu\text{m}\) est négligeable devant \(\lambda = c/f = 3{,}0\ \text{cm}\) et devant les dimensions du miroir : on peut prendre \(\delta \to 0\), champs nuls dans le métal.</p>
    <p><strong>C2.</strong> Onde réfléchie \(\underline{\vec E}_r = \underline r\,E_0\,e^{i(\omega t + kz)}\,\vec e_x\) ; \(\vec E\) tangent nul en \(z = 0\) : \(\underline r = -1\). Les champs totaux réels sont</p>
    <div class="formula">$$\vec E = 2E_0\sin(kz)\sin(\omega t)\,\vec e_x$$</div>
    <div class="formula">$$\vec B = \frac{2E_0}{c}\cos(kz)\cos(\omega t)\,\vec e_y$$</div>
    <p><strong>C3.</strong> Normale sortante \(\vec n = -\vec e_z\) : \(\vec j_s = \dfrac1{\mu_0}\vec n\wedge\vec B(0)\), soit \(2\varepsilon_0cE_0\cos(\omega t)\,\vec e_x\), d'amplitude \(2\varepsilon_0cE_0 \approx 0{,}53\ \text{A·m}^{-1}\). \(\vec E(0) = \vec 0\) : \(\sigma_s = 0\).</p>
    <p><strong>C4.</strong> Dans le métal, \(\vec B = B_y(z,t)\,\vec e_y\) et \(\overrightarrow{\operatorname{rot}}\,\vec B = -\dfrac{\partial B_y}{\partial z}\vec e_x = \mu_0\vec j\). En intégrant de \(0^+\) à l'infini (où le champ est nul) : \(\displaystyle\int_0^{\infty}j_x\,\mathrm dz = \dfrac{B_y(0^+)}{\mu_0} = \dfrac{2E_0}{\mu_0c}\cos(\omega t)\) : c'est exactement \(\vec j_s\). Le courant surfacique est la limite du courant volumique confiné sur quelques \(\delta\).</p>
    <p><strong>D1.</strong> \(|\underline J| = 2\varepsilon_0cE_0\) et \(\langle\Pi_i\rangle = \tfrac12\varepsilon_0cE_0^2\). Donc</p>
    <div class="formula">$$A = \frac{\frac12\cdot\frac{1}{\sigma\delta}\cdot4\varepsilon_0^2c^2E_0^2}{\frac12\varepsilon_0cE_0^2} = \frac{4\varepsilon_0c}{\sigma\delta}$$</div>
    <p> Or \(\sigma = \dfrac{2}{\mu_0\omega\delta^2}\), d'où \(A = 2\varepsilon_0\mu_0c\,\omega\delta = \dfrac{2\omega\delta}{c}\).</p>
    <p><strong>D2.</strong> \(A = 2\omega\delta/c \approx 2{,}7\times10^{-4}\), donc \(R \approx 0{,}9997\). Le cuivre est un excellent miroir pour les micro-ondes, ce qui valide le modèle du conducteur parfait ; les pertes, faibles, se calculent « en perturbation ».</p>
    <p><strong>E1.</strong> \(f_n = n\,\dfrac{c}{2L} = n\times1{,}00\ \text{GHz}\) : 10 GHz est le mode \(n = 10\).</p>
    <p><strong>E2.</strong> La densité moyenne d'énergie de l'onde stationnaire est uniforme, \(\varepsilon_0E_0^2\) (deux ondes de densité \(\varepsilon_0E_0^2/2\)) : \(W = \varepsilon_0E_0^2L\). Chaque miroir reçoit une onde d'intensité \(\langle\Pi_i\rangle = \tfrac12\varepsilon_0cE_0^2\) et en absorbe la fraction \(A\) : \(P = 2A\langle\Pi_i\rangle = 2\omega\delta\,\varepsilon_0E_0^2\). D'où</p>
    <div class="formula">$$Q = \frac{\omega W}{P} = \frac{\omega\,\varepsilon_0E_0^2L}{2\omega\delta\,\varepsilon_0E_0^2} = \frac{L}{2\delta}$$</div>
    <p><strong>E3.</strong> \(Q = \dfrac{0{,}150}{2\times6{,}5\times10^{-7}} \approx 1{,}2\times10^{5}\). Sans excitation, \(\mathrm dW/\mathrm dt = -P = -\omega W/Q\) : \(W\) décroît en \(e^{-t/\tau_c}\) avec \(\tau_c = Q/\omega \approx 1{,}8\ \mu\text{s}\), soit près de \(2\times10^{4}\) périodes. Largeur de résonance \(\Delta f = f/Q \approx 90\ \text{kHz}\) : résonance extrêmement fine. Des cavités supraconductrices atteignent des facteurs de qualité de l'ordre de \(10^{10}\).</p>
  </div>
