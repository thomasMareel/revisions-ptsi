  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 2.4 du programme de PTSI, « Mouvement de particules chargées dans des champs électrique et magnétostatique, uniformes et stationnaires » (second semestre). Il réinvestit la mécanique du point (principe fondamental de la dynamique, énergie) sur deux situations de base où le programme demande d'être autonome : le champ électrique uniforme, et le champ magnétique uniforme avec une vitesse initiale orthogonale au champ. La force de Laplace (chapitre « Champ magnétique et actions de Laplace ») en est la version macroscopique ; l'électrostatique est étudiée en 2ᵉ année.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Force de Lorentz</strong> exercée sur une charge ponctuelle ; champs électrique et magnétique (§1).</li>
        <li><strong>Ordres de grandeur</strong> : évaluer les forces électrique et magnétique et les comparer aux forces gravitationnelles (§2).</li>
        <li><strong>Puissance de la force de Lorentz</strong> : justifier qu'un champ électrique peut modifier l'énergie cinétique d'une particule, alors qu'un champ magnétique courbe sa trajectoire sans lui fournir d'énergie (§3).</li>
        <li><strong>Champ électrostatique uniforme</strong> : mettre en équation le mouvement et le caractériser comme un mouvement à vecteur accélération constant, que la vitesse initiale soit orthogonale au champ (déviation entre deux plaques) ou oblique (miroir électrostatique) (§4).</li>
        <li><strong>Bilan énergétique</strong> : déterminer la vitesse d'une particule accélérée par une différence de potentiel (§5).</li>
        <li><strong>Champ magnétostatique uniforme, vitesse initiale orthogonale au champ</strong> : déterminer le rayon de la trajectoire et le sens de parcours (§6, §7).</li>
        <li><strong>Situations physiques variées</strong> : canon à électrons (§5), tube cathodique et miroir électrostatique (§4), déviation magnétique d'un faisceau (§7), spectromètre de masse, cyclotron, sélecteur de vitesse, aurores polaires et détecteurs de particules (§8).</li>
      </ul>
      <p>Hors programme en PTSI (regroupé en fin de chapitre) : vitesse initiale quelconque dans un champ magnétique (hélice), champs électrique et magnétique croisés (dérive), effets relativistes. La relation générale \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) est établie en 2ᵉ année (chapitre « Électrostatique »).</p>

<div class="course-section">
  <div class="sec-num">§1 · LA FORCE DE LORENTZ</div>
  <h2>Une force, deux champs</h2>
  <div class="intro">Une particule chargée ressent les autres charges et les courants par l'intermédiaire de deux champs, électrique et magnétique. La force de Lorentz résume cette action ; tout le chapitre consiste à la placer dans le principe fondamental de la dynamique.</div>
  <div class="def-box">
    <strong>Force de Lorentz.</strong> Dans un référentiel galiléen \(\mathcal R\), une particule de charge \(q\) et de vitesse \(\vec v\), placée en un point où règnent le champ électrique \(\vec E\) et le champ magnétique \(\vec B\), subit la force
    <div class="formula" data-nom="Force de Lorentz">$$\vec F=q\left(\vec E+\vec v\wedge\vec B\right)$$</div>
    \(q\) en coulombs (C), \(\vec E\) en \(\text{V·m}^{-1}\) (ou \(\text{N·C}^{-1}\)), \(\vec B\) en teslas (T). Ces champs sont créés par d'autres sources (plaques chargées, bobines, aimants) : ce sont des champs <strong>extérieurs</strong>, supposés ici uniformes et stationnaires.
  </div>
  <p>La force a deux termes : la force électrique \(q\vec E\), indépendante de la vitesse, et la force magnétique \(q\,\vec v\wedge\vec B\), orthogonale à la fois à \(\vec v\) et à \(\vec B\), nulle pour une particule immobile ou dont la vitesse est parallèle à \(\vec B\). Comme \(\vec v\) dépend du référentiel, le terme magnétique aussi : on travaille dans le référentiel du laboratoire, supposé galiléen.</p>
  <h3>Calculer un produit vectoriel</h3>
  <p>En base orthonormée directe \((\vec e_x,\vec e_y,\vec e_z)\) : \(\vec e_x\wedge\vec e_y=\vec e_z\), \(\vec e_y\wedge\vec e_z=\vec e_x\), \(\vec e_z\wedge\vec e_x=\vec e_y\) (permutation circulaire), et le produit change de signe quand on échange ses facteurs, par exemple \(\vec e_x\wedge\vec e_z=-\vec e_y\). Sa norme vaut \(vB\sin\alpha\) (\(\alpha\) : angle entre \(\vec v\) et \(\vec B\)) ; son sens suit la règle des trois doigts de la main droite (pouce selon \(\vec v\), index selon \(\vec B\), majeur selon \(\vec v\wedge\vec B\)). En composantes :</p>
  <div class="formula">$$\vec v\wedge\vec B=\left(v_yB_z-v_zB_y\right)\vec e_x+\left(v_zB_x-v_xB_z\right)\vec e_y+\left(v_xB_y-v_yB_x\right)\vec e_z$$</div>
  <div class="method-box">
    <strong>Exemple — force sur un proton</strong>
    <p>Un proton (\(q=e\)) se déplace à \(\vec v=v\,\vec e_x\), \(v=2{,}0\times10^{5}\ \text{m·s}^{-1}\), dans le champ \(\vec B=B\,\vec e_z\), \(B=0{,}50\ \text{T}\).</p>
    <ol>
      <li>\(\vec v\wedge\vec B=vB\,(\vec e_x\wedge\vec e_z)=-vB\,\vec e_y\), donc \(\vec F=-evB\,\vec e_y\).</li>
      <li>Norme : \(evB=1{,}6\times10^{-19}\times2{,}0\times10^{5}\times0{,}50=1{,}6\times10^{-14}\ \text{N}\), selon \(-\vec e_y\). Un électron de même vitesse subirait la force opposée, selon \(+\vec e_y\).</li>
      <li>Ajoutons \(\vec E=E\,\vec e_y\) avec \(E=1{,}0\times10^{5}\ \text{V·m}^{-1}\) : \(\vec F=e\,(E-vB)\,\vec e_y=\vec 0\), car \(vB=1{,}0\times10^{5}\ \text{V·m}^{-1}\). Les deux forces se compensent : c'est le principe du sélecteur de vitesse (§8).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\vec B\wedge\vec v\) au lieu de \(\vec v\wedge\vec B\), ce qui inverse la force ; ou oublier le signe de la charge. Pour un électron, \(q=-e\) : la force magnétique est de sens opposé à \(\vec v\wedge\vec B\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ORDRES DE GRANDEUR</div>
  <h2>Comparer les forces : le poids est presque toujours négligeable</h2>
  <div class="intro">Avant toute résolution, on fait le bilan des forces et on compare leurs ordres de grandeur. Pour une particule élémentaire ou un ion, les forces électrique et magnétique écrasent le poids ; ce n'est plus vrai pour un objet chargé de taille macroscopique.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Particule</th><th style="text-align:left">Charge</th><th style="text-align:left">Masse</th></tr>
    <tr><td>électron</td><td>\(-e=-1{,}602\times10^{-19}\ \text{C}\)</td><td>\(m_e=9{,}109\times10^{-31}\ \text{kg}\)</td></tr>
    <tr><td>proton</td><td>\(+e\)</td><td>\(m_p=1{,}673\times10^{-27}\ \text{kg}\approx1836\,m_e\)</td></tr>
    <tr><td>ion de nombre de masse \(A\)</td><td>\(Ze\)</td><td>\(\approx A\,u\), \(u=1{,}661\times10^{-27}\ \text{kg}\)</td></tr>
  </table></div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Champ électrique</th><th style="text-align:left">Champ magnétique</th></tr>
    <tr><td>atmosphère par beau temps : \(\sim100\ \text{V·m}^{-1}\)</td><td>champ terrestre : \(\approx5\times10^{-5}\ \text{T}\)</td></tr>
    <tr><td>entre les plaques d'un tube cathodique : \(\sim10^{4}\ \text{V·m}^{-1}\)</td><td>aimant permanent : 0,1 à 1 T</td></tr>
    <tr><td>claquage de l'air : \(\approx3\times10^{6}\ \text{V·m}^{-1}\)</td><td>IRM : 1,5 à 3 T ; aimants du LHC : 8,3 T</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — électron dans un champ de 1 kV·m⁻¹</strong>
    <ol>
      <li>Force électrique : \(eE=1{,}6\times10^{-19}\times10^{3}=1{,}6\times10^{-16}\ \text{N}\).</li>
      <li>Poids : \(m_eg=9{,}1\times10^{-31}\times9{,}81\approx8{,}9\times10^{-30}\ \text{N}\). Rapport : \(eE/(m_eg)\approx2\times10^{13}\).</li>
      <li>Force magnétique dans le seul champ terrestre, à \(v=10^{7}\ \text{m·s}^{-1}\) : \(evB=1{,}6\times10^{-19}\times10^{7}\times5\times10^{-5}=8\times10^{-17}\ \text{N}\), encore \(10^{13}\) fois le poids.</li>
      <li>Même pour un proton, 1 836 fois plus lourd, dans \(10^{4}\ \text{V·m}^{-1}\), le rapport vaut \(10^{11}\). Entre deux protons, l'attraction gravitationnelle est \(10^{36}\) fois plus faible que la répulsion électrique, quelle que soit leur distance.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Contre-exemple — gouttelette d'huile chargée</strong>
    <p>Une gouttelette de rayon \(1\ \mu\text{m}\) et de masse volumique \(900\ \text{kg·m}^{-3}\) a une masse \(m=\tfrac43\pi r^3\rho\approx3{,}8\times10^{-15}\ \text{kg}\) et un poids \(3{,}7\times10^{-14}\ \text{N}\). Si elle porte 5 charges élémentaires, la force électrique équilibre le poids pour \(E=mg/(5e)\approx4{,}6\times10^{4}\ \text{V·m}^{-1}\) : les deux forces sont du même ordre. C'est le principe de l'expérience de Millikan, qui a mesuré \(e\).</p>
  </div>
  <div class="prop-box"><strong>Règle pratique.</strong> On compare \(|q|E\) et \(|q|vB\) au poids \(mg\). Pour les électrons, protons et ions dans les champs usuels, le rapport dépasse couramment \(10^{10}\), et reste supérieur à \(10^{8}\) même pour un proton lent dans le champ terrestre : on néglige le poids, ainsi que tout frottement (la particule se déplace dans un vide poussé). La force de Lorentz est alors la seule force.</div>
  <div class="notice"><strong>Erreur classique</strong> : juger la force magnétique négligeable parce que \(B\) est « petit », par exemple dans le champ terrestre. C'est le produit \(|q|vB\) qu'il faut comparer au poids : pour un électron à \(10^{7}\ \text{m·s}^{-1}\), il le dépasse encore de 13 ordres de grandeur. Inversement, pour un objet macroscopique, même faiblement chargé, le poids ne se néglige pas sans calcul.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PUISSANCE DE LA FORCE DE LORENTZ</div>
  <h2>Le champ électrique accélère, le champ magnétique courbe</h2>
  <div class="intro">La puissance d'une force indique si elle peut changer l'énergie cinétique (théorème de la puissance cinétique). Pour la force de Lorentz, la réponse est nette : seul le terme électrique compte.</div>
  <div class="prop-box">
    <strong>Puissance de la force de Lorentz.</strong> Comme \(\vec v\wedge\vec B\) est orthogonal à \(\vec v\),
    <div class="formula" data-nom="Puissance de la force de Lorentz">$$\mathcal P=\vec F\cdot\vec v=q\,\vec E\cdot\vec v+q\,(\vec v\wedge\vec B)\cdot\vec v=q\,\vec E\cdot\vec v$$</div>
    <ul>
      <li>La force magnétique a une puissance nulle à chaque instant : elle ne travaille pas. Dans un champ magnétique seul, \(E_c\) et donc la norme \(v\) de la vitesse sont constantes : le champ change seulement la <strong>direction</strong> de la vitesse, il courbe la trajectoire sans fournir d'énergie.</li>
      <li>Le champ électrique peut fournir de l'énergie (\(q\vec E\cdot\vec v\gt0\), la particule accélère) ou en prélever (\(q\vec E\cdot\vec v\lt0\), elle ralentit) : \(\dfrac{\mathrm{d}E_c}{\mathrm{d}t}=q\,\vec E\cdot\vec v\).</li>
    </ul>
  </div>
  <h3>Énergie potentielle électrique</h3>
  <p>Un champ électrique stationnaire dérive d'un <strong>potentiel</strong> \(V\) (en volts) : la force électrique est conservative et la particule possède l'énergie potentielle</p>
  <div class="formula" data-nom="Énergie potentielle électrique">$$E_p=q\,V$$</div>
  <p>Le champ est dirigé vers les potentiels décroissants. Entre deux plaques planes parallèles distantes de \(d\), soumises à la tension \(U=V_+-V_-\gt0\), il est uniforme, dirigé de la plaque positive vers la plaque négative, de norme \(E=U/d\). Avec l'axe \(Oy\) orienté de la plaque négative (\(y=0\), \(V=0\)) vers la plaque positive : \(V(y)=Uy/d\), \(E_p=qUy/d\) et \(q\vec E=-\dfrac{\mathrm{d}E_p}{\mathrm{d}y}\,\vec e_y\), comme pour toute force qui dérive d'une énergie potentielle. En 1ʳᵉ année, on admet \(E_p=qV\) et \(E=U/d\) entre deux plaques.</p>
  <div class="prop-box"><strong>Conservation de l'énergie.</strong> Si la force de Lorentz est la seule force et que les champs sont stationnaires, l'énergie mécanique \(E_m=\tfrac12mv^2+qV\) se conserve, quel que soit \(\vec B\), qui ne travaille pas.</div>
  <div class="method-box">
    <strong>Exemple — un proton entre champ magnétique et champ électrique</strong>
    <ol>
      <li>Un proton d'énergie cinétique 2,0 keV traverse une zone de champ magnétique. Il en ressort avec 2,0 keV, soit \(v=\sqrt{2E_c/m_p}\approx6{,}2\times10^{5}\ \text{m·s}^{-1}\), dans une autre direction.</li>
      <li>Il passe ensuite d'un point A de potentiel 0 à un point B de potentiel \(+500\ \text{V}\) : \(\Delta E_c=q\,(V_A-V_B)=e\,(0-500\ \text{V})=-500\ \text{eV}\).</li>
      <li>Il ressort avec 1,5 keV, soit \(v\approx5{,}4\times10^{5}\ \text{m·s}^{-1}\) : seul le champ électrique a modifié la norme de sa vitesse.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure que « la force magnétique ne travaille pas, donc elle n'a pas d'effet ». Elle change la direction de la vitesse, donc la trajectoire : c'est ce que l'on exploite dans un spectromètre de masse. Le simulateur (onglet Simulateur, mode « Champ B seul ») le montre : la trajectoire tourne, la vitesse reste la même.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · MOUVEMENT DANS UN CHAMP ÉLECTRIQUE UNIFORME</div>
  <h2>Un mouvement à vecteur accélération constant</h2>
  <div class="intro">Dans un champ électrique uniforme et stationnaire, la force est constante : le problème est exactement celui de la chute libre, la pesanteur \(\vec g\) étant remplacée par \(q\vec E/m\). On sait donc déjà le résoudre.</div>
  <div class="prop-box">
    <strong>Mise en équation.</strong> Particule de masse \(m\) et de charge \(q\) dans un champ \(\vec E\) uniforme (\(\vec B=\vec 0\), poids négligé), étudiée dans un référentiel galiléen. Le principe fondamental de la dynamique s'écrit \(m\,\dfrac{\mathrm{d}\vec v}{\mathrm{d}t}=q\vec E\), d'où
    <div class="formula" data-nom="Accélération dans un champ électrique uniforme">$$\vec a=\frac{q\,\vec E}{m}=\overrightarrow{\text{cste}}$$</div>
    Avec \(\vec v(0)=\vec v_0\) et \(M(0)=M_0\) : \(\vec v(t)=\dfrac{q\vec E}{m}\,t+\vec v_0\) et \(\overrightarrow{M_0M}=\dfrac{q\vec E}{2m}\,t^2+\vec v_0\,t\). Le mouvement a lieu dans le plan qui passe par \(M_0\) et contient \(\vec v_0\) et \(\vec E\).
  </div>
  <ul>
    <li>Si \(\vec v_0\) est nulle ou parallèle à \(\vec E\), le mouvement est <strong>rectiligne uniformément varié</strong> : accéléré si \(q\vec E\cdot\vec v_0\gt0\), sinon freiné, puis de retour (§5).</li>
    <li>Sinon, la trajectoire est un arc de <strong>parabole</strong>, comme celle d'un projectile lancé dans la pesanteur.</li>
  </ul>
  <h3>Vitesse initiale orthogonale au champ</h3>
  <p>Prenons \(\vec E=E\,\vec e_y\) et \(\vec v_0=v_0\,\vec e_x\), avec \(M_0=O\). Les projections donnent \(\ddot x=0\), \(\ddot y=qE/m\), \(\ddot z=0\), d'où \(x=v_0t\), \(y=\dfrac{qE}{2m}\,t^2\), \(z=0\). La composante de la vitesse orthogonale au champ ne change pas. En éliminant \(t=x/v_0\) :</p>
  <div class="formula" data-nom="Trajectoire parabolique dans un champ électrique">$$y=\frac{qE}{2m\,v_0^2}\,x^2$$</div>
  <p>La particule est déviée dans le sens de \(\vec E\) si \(q\gt0\), en sens contraire si \(q\lt0\) : un électron est attiré par la plaque de plus haut potentiel.</p>
  <h3>Déviation entre deux plaques</h3>
  <p>La particule pénètre entre deux plaques de longueur \(L\), distantes de \(d\), sous la tension \(U\) : \(E=U/d\). Elle les traverse en \(\tau=L/v_0\) (le mouvement selon \(x\) est uniforme) et en sort avec</p>
  <div class="formula" data-nom="Déviation électrique à la sortie des plaques">$$\delta=\frac{|q|\,U L^2}{2\,m\,d\,v_0^2}\qquad\tan\alpha=\frac{v_y(\tau)}{v_0}=\frac{|q|\,U L}{m\,d\,v_0^2}=\frac{2\delta}{L}$$</div>
  <p>Hors des plaques, le champ est nul : le mouvement est rectiligne uniforme. Comme \(\delta=\tfrac L2\tan\alpha\), cette droite prolongée passe par le milieu des plaques : sur un écran placé à la distance \(D\) du milieu des plaques, le spot est dévié de \(Y=D\tan\alpha\).</p>

  <div class="method-box">
    <strong>Exemple — sensibilité d'un tube cathodique</strong>
    <p>Des électrons accélérés sous \(U_a=1{,}5\ \text{kV}\) entrent entre des plaques de longueur \(L=4{,}0\ \text{cm}\), distantes de \(d=1{,}0\ \text{cm}\), sous \(U=50\ \text{V}\). L'écran est à \(D=25\ \text{cm}\) du milieu des plaques.</p>
    <ol>
      <li>Vitesse d'entrée (§5) : \(v_0=\sqrt{2eU_a/m_e}\approx2{,}3\times10^{7}\ \text{m·s}^{-1}\) ; durée de traversée \(\tau=L/v_0\approx1{,}7\ \text{ns}\).</li>
      <li>En reportant \(v_0^2=2eU_a/m_e\) : \(\delta=\dfrac{UL^2}{4dU_a}=\dfrac{50\times0{,}040^2}{4\times0{,}010\times1500}\approx1{,}3\ \text{mm}\), bien moins que \(d/2\) : le faisceau ne touche pas les plaques.</li>
      <li>\(\tan\alpha=\dfrac{UL}{2dU_a}\approx0{,}067\) (\(\alpha\approx3{,}8°\)), puis \(Y=D\tan\alpha\approx1{,}7\ \text{cm}\) : environ 0,33 mm de déviation par volt.</li>
    </ol>
    <p>Remarque : \(\delta=UL^2/(4dU_a)\) ne dépend ni de \(q\) ni de \(m\). Des particules accélérées puis déviées par les mêmes tensions suivent la même trajectoire : un champ électrique seul ne trie pas les masses, un champ magnétique si (§8).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prolonger la parabole après la sortie des plaques (le champ y est nul, la trajectoire est une droite) ; ou modifier la composante \(v_x\) alors que la force est selon \(\vec e_y\). Le mode « Champ E seul » du simulateur trace la parabole puis la droite de sortie.</div>
  <h3>Vitesse initiale oblique : le miroir électrostatique</h3>
  <p>Quand \(\vec v_0\) fait un angle quelconque avec \(\vec E\), la méthode est la même : axe \(Oy\) selon \(\vec E\), axe \(Ox\) selon la composante de \(\vec v_0\) orthogonale à \(\vec E\). La composante \(v_x\) reste constante, la composante \(v_y\) varie linéairement avec le temps : la trajectoire est la parabole d'un tir oblique. Si la force s'oppose à la composante initiale \(v_{0y}\), la particule s'arrête de « monter » puis revient vers son plan de départ, comme une balle renvoyée par un miroir : c'est un <strong>miroir électrostatique</strong>, utilisé pour réfléchir ou trier des faisceaux par énergie.</p>

  <div class="method-box">
    <strong>Exemple — miroir électrostatique</strong>
    <p>Un électron d'énergie cinétique \(E_{c0}=500\ \text{eV}\) franchit en \(O\) une grille plane, au potentiel 0, sous l'angle \(\beta=30°\) avec la grille. Au-delà, une plaque parallèle à la grille, placée à \(d=1{,}0\ \text{cm}\), est portée au potentiel \(-200\ \text{V}\).</p>
    <ol>
      <li>Champ : uniforme, de norme \(E=200/0{,}010=2{,}0\times10^{4}\ \text{V·m}^{-1}\), dirigé de la grille vers la plaque (vers les potentiels décroissants), selon \(+\vec e_y\). La force \(-eE\,\vec e_y\) est dirigée vers la grille ; l'accélération est constante, \(a=eE/m_e\approx3{,}5\times10^{15}\ \text{m·s}^{-2}\).</li>
      <li>Avec \(v_0=\sqrt{2E_{c0}/m_e}\approx1{,}33\times10^{7}\ \text{m·s}^{-1}\) : \(x=v_0\cos\beta\;t\) et \(y=v_0\sin\beta\;t-\tfrac12at^2\). La hauteur est maximale quand \(v_y=0\) :
      <div class="formula">$$y_{\max}=\frac{(v_0\sin\beta)^2}{2a}=\frac{E_{c0}\sin^2\beta}{eE}=6{,}25\ \text{mm}\lt d$$</div>
      l'électron ne touche pas la plaque.</li>
      <li>Il repasse la grille au bout de \(t_r=2v_0\sin\beta/a\approx3{,}8\ \text{ns}\), à la distance
      <div class="formula">$$x_r=v_0\cos\beta\;t_r=\frac{2E_{c0}\sin2\beta}{eE}\approx4{,}33\ \text{cm}$$</div>
      avec une vitesse de même norme qu'à l'entrée, qui fait de nouveau l'angle \(\beta\) avec la grille.</li>
      <li>Contrôle énergétique : pour atteindre la plaque, il faudrait que l'énergie cinétique associée à \(v_{0y}\), soit \(E_{c0}\sin^2\beta=125\ \text{eV}\), dépasse les 200 eV que coûte la montée de 0 à \(-200\ \text{V}\) ; ce n'est pas le cas. Comme pour la déviation entre plaques, le résultat, écrit avec \(E_{c0}/e\) (en volts), ne dépend pas de la masse. La portée est maximale pour \(\beta=45°\) : 5,0 cm.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BILAN ÉNERGÉTIQUE</div>
  <h2>Accélérer une particule par une différence de potentiel</h2>
  <div class="intro">Pour connaître la vitesse acquise entre deux points, inutile de résoudre le mouvement : l'énergie suffit. C'est ainsi que l'on règle l'énergie des faisceaux, du tube à rayons X aux accélérateurs.</div>
  <div class="prop-box">
    <strong>Théorème de l'énergie cinétique.</strong> Entre deux points A et B, seule la force électrique travaille, et son travail vaut \(q\,(V_A-V_B)\) quel que soit le chemin suivi :
    <div class="formula" data-nom="Théorème de l'énergie cinétique, particule chargée">$$\tfrac12 m v_B^2-\tfrac12 m v_A^2=q\,(V_A-V_B)$$</div>
    Pour une particule partie du repos et accélérée par la tension \(U\gt0\), dans le sens où elle gagne de l'énergie (\(q\,(V_A-V_B)=|q|U\)) :
    <div class="formula" data-nom="Vitesse après accélération sous une tension">$$v=\sqrt{\frac{2|q|U}{m}}$$</div>
  </div>
  <p>Une charge positive accélère vers les potentiels décroissants, une charge négative vers les potentiels croissants. Le résultat ne dépend ni de la forme du champ ni de la trajectoire.</p>
  <h3>Canon à électrons</h3>
  <p>Un filament chauffé (cathode, potentiel 0) émet des électrons de vitesse négligeable ; une anode percée, au potentiel \(U\gt0\), les accélère. De la cathode à l'anode : \(\Delta E_c=(-e)(0-U)=eU\gt0\), et l'électron sort avec \(v=\sqrt{2eU/m_e}\) : \(5{,}9\times10^{6}\ \text{m·s}^{-1}\) sous 100 V, \(1{,}9\times10^{7}\ \text{m·s}^{-1}\) sous 1 kV (6 % de la vitesse de la lumière), \(5{,}9\times10^{7}\ \text{m·s}^{-1}\) sous 10 kV (20 %). La mécanique classique suppose \(E_c\ll mc^2\) (511 keV pour l'électron, 938 MeV pour le proton) : sous 10 kV, l'erreur sur \(v\) n'est que de 1,5 %.</p>
  <div class="def-box"><strong>Électron-volt.</strong> \(1\ \text{eV}=1{,}602\times10^{-19}\ \text{J}\) : énergie gagnée par une charge \(e\) qui franchit une différence de potentiel de 1 V. Une particule de charge \(Ze\) accélérée sous la tension \(U\) gagne \(ZU\) électronvolts, quelle que soit sa masse.</div>
  <div class="method-box">
    <strong>Exemple — électron freiné par un champ retardateur</strong>
    <p>Un électron d'énergie cinétique \(E_{c0}=200\ \text{eV}\) entre, selon \(\vec e_x\), dans une zone de largeur \(d=1{,}0\ \text{cm}\) où le potentiel décroît uniformément de 0 à \(-300\ \text{V}\).</p>
    <ol>
      <li>Conservation de l'énergie : \(\tfrac12m_ev^2+(-e)V(x)=E_{c0}\), avec \(V(x)=-300\,x/d\) (en volts) : \(E_c(x)=E_{c0}-e\times300\,x/d\).</li>
      <li>L'électron s'arrête quand \(E_c=0\), soit en \(x_{\max}=d\times200/300\approx6{,}7\ \text{mm}\lt d\) : il fait demi-tour sans traverser.</li>
      <li>Le mouvement est rectiligne, d'accélération constante \(a=eE/m_e=\dfrac{e\times300}{m_e d}\approx5{,}3\times10^{15}\ \text{m·s}^{-2}\) ; il s'arrête au bout de \(v_0/a\approx1{,}6\ \text{ns}\) (\(v_0\approx8{,}4\times10^{6}\ \text{m·s}^{-1}\)). Sous une tension retardatrice inférieure à 200 V, il aurait traversé : on trie ainsi les électrons par énergie.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\Delta E_c=qU\) sans préciser de quel potentiel à quel potentiel. Écrire toujours \(q\,(V_{\text{départ}}-V_{\text{arrivée}})\), puis vérifier le signe : un électron qui va vers un potentiel plus bas est freiné.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MOUVEMENT DANS UN CHAMP MAGNÉTIQUE UNIFORME</div>
  <h2>Vitesse initiale orthogonale au champ : un cercle parcouru à vitesse constante</h2>
  <div class="intro">La force magnétique, toujours orthogonale à la vitesse, n'en change pas la norme mais en fait tourner la direction à un rythme constant : la trajectoire est un cercle. C'est la seconde situation de base du programme.</div>
  <div class="prop-box">
    <strong>Mouvement circulaire uniforme.</strong> Une particule de masse \(m\) et de charge \(q\), dans un champ \(\vec B\) uniforme et stationnaire (\(\vec E=\vec 0\), poids négligé), lancée avec une vitesse \(\vec v_0\) <strong>orthogonale</strong> à \(\vec B\), décrit à vitesse constante \(v_0\) un cercle situé dans le plan orthogonal à \(\vec B\) passant par \(M_0\), de rayon
    <div class="formula" data-nom="Rayon de la trajectoire dans un champ magnétique">$$R=\frac{m\,v_0}{|q|\,B}$$</div>
    à la <strong>pulsation cyclotron</strong> \(\omega_c\), de période \(T\) :
    <div class="formula" data-nom="Pulsation et période cyclotron">$$\omega_c=\frac{|q|\,B}{m}\qquad T=\frac{2\pi}{\omega_c}=\frac{2\pi m}{|q|\,B}$$</div>
    \(\omega_c\) et \(T\) ne dépendent pas de la vitesse : une particule plus rapide décrit un cercle plus grand, dans la même durée.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Vitesse constante, mouvement plan, courbure constante</span>
    <div class="content">
      <p><strong>1. Vitesse constante.</strong> La puissance de la force magnétique est nulle (§3) : \(E_c\), donc \(v=v_0\), est constante.</p>
      <p><strong>2. Mouvement plan.</strong> Avec \(\vec B=B\,\vec e_z\), la force \(q\vec v\wedge\vec B\) est orthogonale à \(\vec e_z\) : \(m\,\dot v_z=0\), donc \(v_z\) garde sa valeur initiale, nulle. Le mouvement reste dans le plan \(z=z_0\).</p>
      <p><strong>3. Courbure constante.</strong> Le mouvement étant uniforme, l'accélération est normale : \(\vec a=\dfrac{v_0^2}{\rho}\,\vec N\), où \(\rho\) est le rayon de courbure. La force, orthogonale à \(\vec v\), a pour norme \(|q|v_0B\) (car \(\vec v\perp\vec B\)) : \(m\,\dfrac{v_0^2}{\rho}=|q|\,v_0B\), donc \(\rho=\dfrac{mv_0}{|q|B}\) est constant. Une courbe plane de courbure constante est un cercle : \(R=\rho\), et \(T=2\pi R/v_0=2\pi m/(|q|B)\).</p>
    </div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration par les composantes</span>
    <span class="prompt">Méthode systématique, qui donne aussi le centre et le sens</span>
    <div class="content">
      <p>Avec \(\vec B=B\,\vec e_z\), \(\vec v=v_x\vec e_x+v_y\vec e_y\) : \(\vec v\wedge\vec B=B\,(v_y\,\vec e_x-v_x\,\vec e_y)\). En posant \(\omega=qB/m\) (de signe celui de \(q\)), le principe fondamental donne</p>
      <div class="formula">$$\dot v_x=\omega\,v_y\qquad \dot v_y=-\omega\,v_x$$</div>
      <p>D'où \(\ddot v_x=-\omega^2v_x\). Avec \(\vec v(0)=v_0\,\vec e_x\) : \(v_x=v_0\cos\omega t\), \(v_y=-v_0\sin\omega t\). En intégrant depuis \(M_0=O\) : \(x=\dfrac{v_0}{\omega}\sin\omega t\), \(y=\dfrac{v_0}{\omega}(\cos\omega t-1)\), soit</p>
      <div class="formula">$$x^2+\left(y+\frac{v_0}{\omega}\right)^2=\left(\frac{v_0}{\omega}\right)^2$$</div>
      <p>Cercle de centre \(C(0,-v_0/\omega)\) et de rayon \(v_0/|\omega|=mv_0/(|q|B)\). Pour \(q\gt0\), le centre est du côté \(y\lt0\) et le point part vers la droite depuis le haut du cercle : il tourne dans le sens horaire vu depuis \(+z\) (§7).</p>
    </div>
  </div>
  <p>L'indépendance de la période vis-à-vis de la vitesse s'interprète simplement : une particule deux fois plus rapide décrit un cercle deux fois plus grand, dont elle fait donc le tour dans la même durée. C'est l'<strong>isochronisme</strong> du mouvement circulaire dans un champ magnétique, sur lequel repose le cyclotron (§8).</p>

<div class="course-section">
  <div class="sec-num">§7 · SENS DE PARCOURS, RÉGION DE CHAMP LIMITÉE</div>
  <h2>De quel côté la particule tourne-t-elle ?</h2>
  <div class="intro">Le rayon ne dit pas de quel côté la trajectoire s'incurve : c'est le signe de la charge et le sens du champ qui le fixent. Le programme demande de savoir le déterminer, et c'est indispensable pour savoir où une particule sort d'une zone de champ.</div>
  <div class="prop-box">
    <strong>Sens de parcours.</strong> La particule tourne autour de la direction de \(\vec B\) avec le vecteur rotation
    <div class="formula" data-nom="Vecteur rotation dans un champ magnétique">$$\vec\omega=-\frac{q\,\vec B}{m}\qquad\|\vec\omega\|=\omega_c$$</div>
    <ul>
      <li>\(q\gt0\) : rotation dans le sens indirect autour de \(\vec B\), c'est-à-dire <strong>horaire</strong> pour un observateur vers qui \(\vec B\) est dirigé (⊙) ;</li>
      <li>\(q\lt0\) : rotation dans le sens direct autour de \(\vec B\), <strong>trigonométrique</strong> pour ce même observateur.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Méthode — trouver le centre et le sens en un coup d'œil</strong>
    <ol>
      <li>Au point d'entrée \(M_0\), déterminer la direction de \(\vec F=q\,\vec v_0\wedge\vec B\) (trois doigts de la main droite, puis signe de \(q\)).</li>
      <li>La force est centripète : le centre \(C\) est à la distance \(R\) de \(M_0\), dans le sens de \(\vec F\) ; vectoriellement \(\overrightarrow{M_0C}=\dfrac{m}{qB^2}\,\vec v_0\wedge\vec B\).</li>
      <li>La particule part selon \(\vec v_0\) en tournant autour de \(C\) : le sens de parcours s'en déduit.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — électron dans un champ dirigé vers le fond</strong>
    <p>Un électron part de \(M_0\) avec \(\vec v_0=v_0\,\vec e_x\) dans \(\vec B=-B\,\vec e_z\) (⊗ pour un observateur placé du côté \(+z\)).</p>
    <ol>
      <li>\(\vec F=(-e)\,v_0(-B)\,(\vec e_x\wedge\vec e_z)=-ev_0B\,\vec e_y\) : la force, donc le centre, est du côté \(-\vec e_y\).</li>
      <li>L'électron part vers la droite depuis le haut du cercle : sens horaire pour l'observateur.</li>
      <li>Contrôle : \(\vec\omega=-q\vec B/m=-\dfrac{eB}{m}\,\vec e_z\), rotation horaire vue depuis \(+z\). Changer le signe de la charge <strong>ou</strong> celui du champ inverse le sens ; changer les deux le conserve.</li>
    </ol>
  </div>
  <h3>Région de champ limitée</h3>
  <p>Une particule entre perpendiculairement au bord rectiligne d'une zone de champ, de largeur \(\ell\). Comme \(\vec v_0\) est orthogonale au bord, le centre \(C\) est sur ce bord. Si \(\ell\ge R\), elle fait un <strong>demi-tour</strong> en \(T/2=\pi m/(|q|B)\) et ressort à la distance \(2R\) de son point d'entrée, avec la vitesse \(-\vec v_0\). Si \(\ell\lt R\), elle ressort déviée de l'angle \(\theta\) tel que \(\sin\theta=\ell/R\), puis va en ligne droite.</p>

</div>

<div class="course-section">
  <div class="sec-num">§8 · APPLICATIONS</div>
  <h2>Du tube cathodique au cyclotron</h2>
  <div class="intro">Les deux mouvements de base, enchaînés, expliquent de nombreux dispositifs. On découpe le trajet en zones où un seul champ agit, et on raccorde les zones par la position et la vitesse.</div>
  <h3>Spectromètre de masse</h3>
  <p>Des ions de charge \(q\gt0\) sont accélérés depuis le repos par la tension \(U\) (\(v=\sqrt{2qU/m}\), §5), puis entrent dans un champ \(\vec B\) orthogonal à leur vitesse, où ils décrivent un demi-cercle (§6, §7) avant de frapper une plaque détectrice à la distance \(2R\) de la fente d'entrée :</p>
  <div class="formula" data-nom="Spectromètre de masse">$$R=\frac{1}{B}\sqrt{\frac{2mU}{q}}\qquad\Longleftrightarrow\qquad\frac{m}{q}=\frac{B^2R^2}{2U}$$</div>
  <p>À \(U\) et \(B\) fixés, \(R\propto\sqrt{m/q}\) : des isotopes, de même charge mais de masses différentes, arrivent en des points différents.</p>

    <strong>Exemple — isotopes du chlore</strong>

    <ol>
      <li>\(R_1=\dfrac1B\sqrt{\dfrac{2m_1U}{e}}\approx19{,}0\ \text{cm}\) (avec \(m_1=5{,}81\times10^{-26}\ \text{kg}\)).</li>

  </div>
  <h3>Cyclotron</h3>
  <p>Deux électrodes creuses en forme de D sont placées dans un champ \(\vec B\) uniforme. Dans chaque D, où le champ électrique est nul, la particule décrit un demi-cercle en \(T/2=\pi m/(|q|B)\), indépendamment de sa vitesse. Une tension alternative d'amplitude \(U_m\) appliquée entre les D, de fréquence \(f=f_c=|q|B/(2\pi m)\), l'accélère à chaque traversée de l'intervalle : elle gagne au plus \(|q|U_m\) par passage, et son rayon augmente. Elle sort quand son rayon atteint celui des D, \(R_{\max}\) : \(v_{\max}=|q|BR_{\max}/m\), d'où</p>
  <div class="formula" data-nom="Énergie maximale d'un cyclotron">$$E_{c,\max}=\frac{q^2B^2R_{\max}^2}{2m}$$</div>
  <p>Cette énergie ne dépend pas de la tension accélératrice, qui ne fixe que le nombre de tours nécessaires.</p>

  <div class="method-box">
    <strong>Exemple — cyclotron médical</strong>
    <p>Un cyclotron produit des protons pour fabriquer des traceurs d'imagerie médicale : \(B=1{,}5\ \text{T}\), rayon d'extraction \(R_{\max}=41\ \text{cm}\), tension crête 50 kV entre les D.</p>
    <ol>
      <li>\(f_c=\dfrac{eB}{2\pi m_p}\approx22{,}9\ \text{MHz}\) : une tension de radiofréquence.</li>
      <li>\(E_{c,\max}=\dfrac{(eBR_{\max})^2}{2m_p}\approx2{,}9\times10^{-12}\ \text{J}\approx18\ \text{MeV}\).</li>
      <li>Nombre de passages : \(18\ \text{MeV}/50\ \text{keV}\approx360\), soit environ 180 tours. Les protons atteignent 20 % de la vitesse de la lumière : les effets relativistes (2 % à cette énergie) désaccorderaient la fréquence, et les machines réelles corrigent le champ en conséquence.</li>
    </ol>
  </div>
  <h3>Sélecteur de vitesse (filtre de Wien)</h3>
  <p>Des champs \(\vec E\) et \(\vec B\) orthogonaux entre eux et à la vitesse exercent des forces opposées si on les oriente bien (exemple du §1). Une particule les traverse sans déviation, en mouvement rectiligne uniforme, si et seulement si \(\vec F=\vec 0\) :</p>
  <div class="formula" data-nom="Sélecteur de vitesse">$$|q|E=|q|vB\qquad\Longleftrightarrow\qquad v=\frac{E}{B}$$</div>
  <p>La vitesse sélectionnée ne dépend ni de la charge ni de la masse. Placé avant un spectromètre, ce filtre fournit un faisceau de vitesse unique. Cette condition découle directement de la force de Lorentz ; la trajectoire des particules plus lentes ou plus rapides sort du programme (fin de chapitre, mode « Champs croisés » du simulateur).</p>
  <h3>Aurores polaires</h3>
  <p>Le vent solaire apporte des protons et des électrons. Près de la Terre (\(B\approx5\times10^{-5}\ \text{T}\)), un proton de 400 km·s⁻¹ tourne sur un rayon \(m_pv/(eB)\approx80\ \text{m}\), un électron de 1 keV sur 2 m : des longueurs infimes devant le rayon terrestre. Les particules piégées par le champ terrestre restent « enroulées » autour des lignes de champ (mouvement en hélice, voir la fin du chapitre), qui les guident vers les régions polaires où ces lignes plongent dans l'atmosphère ; leurs collisions avec l'oxygène et l'azote, vers 100 à 300 km d'altitude, font briller le ciel. Les mêmes courbures servent dans les détecteurs de particules : le rayon mesure la quantité de mouvement \(mv=|q|BR\), le sens de rotation le signe de la charge.</p>
  <div class="notice"><strong>Erreur classique</strong> : placer l'impact d'un spectromètre à la distance \(R\) de la fente, au lieu de \(2R\) (diamètre du demi-cercle) ; croire que l'énergie de sortie d'un cyclotron augmente avec la tension entre les D : elle est fixée par \(B\) et \(R_{\max}\), la tension ne fixe que le nombre de tours.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Hélice, champs croisés, relativité</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI. Ils se traitent avec les mêmes outils et se visualisent dans l'onglet Simulateur.</div>
  <ul>
    <li><strong>Vitesse initiale quelconque dans \(\vec B\)</strong> : on décompose \(\vec v_0=\vec v_\parallel+\vec v_\perp\). La composante parallèle à \(\vec B\) n'est pas modifiée (la force est orthogonale à \(\vec B\)), la composante orthogonale tourne comme au §6 : la trajectoire est une <strong>hélice</strong> d'axe parallèle à \(\vec B\), de rayon \(R=mv_\perp/(|q|B)\) et de pas \(p=v_\parallel T=2\pi mv_\parallel/(|q|B)\) (mode « Hélicoïdal »).</li>
    <li><strong>Champs croisés</strong> \(\vec E\perp\vec B\) : partie du repos, la particule décrit une cycloïde ; en moyenne, elle dérive à la vitesse \(\vec v_d=\vec E\wedge\vec B/B^2\), indépendante de sa charge (mode « Champs croisés »). Le filtre de Wien correspond au cas où la vitesse initiale vaut déjà \(\vec v_d\).</li>
    <li><strong>Relativité</strong> : la relation \(R=p/(|q|B)\) reste vraie avec la quantité de mouvement relativiste \(p=\gamma mv\), mais la pulsation devient \(|q|B/(\gamma m)\) et décroît avec l'énergie ; le cyclotron se désaccorde au-delà de quelques dizaines de MeV pour les protons. Les synchrotrons (LHC) augmentent \(B\) au fil de l'accélération.</li>
    <li><strong>Lorentz et Laplace</strong> : dans une barre conductrice en mouvement, la force magnétique exercée sur les électrons de conduction a une puissance totale nulle. Elle se partage en deux termes opposés : la puissance des forces de Laplace sur la barre et la puissance électrique \(e\,i\) de la force électromotrice induite, d'où \(\mathcal P_{\text{Laplace}}+e\,i=0\) (chapitre « Induction ») : le champ magnétique transfère l'énergie entre formes mécanique et électrique sans en fournir.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · PARTICULES CHARGÉES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 2.4 du programme : faire le bilan des forces et négliger le poids à bon escient, calculer une force de Lorentz, savoir quel champ change l'énergie, mettre en équation le mouvement dans un champ électrique uniforme, calculer une déviation, trouver une vitesse par un bilan énergétique, établir le mouvement circulaire dans un champ magnétique, en trouver le centre et le sens, traiter une zone de champ limitée et enchaîner les étages d'un dispositif.</div>

  <div class="method-box"><strong>Méthode 1 — Faire le bilan des forces et comparer leurs ordres de grandeur</strong>
    <ol>
      <li><span class="step">Système et référentiel.</span> La particule (charge \(q\) avec son signe, masse \(m\)), étudiée dans le référentiel du laboratoire supposé galiléen ; noter sa position et sa vitesse initiales.</li>
      <li><span class="step">Inventaire.</span> Force de Lorentz \(q(\vec E+\vec v\wedge\vec B)\) et poids \(m\vec g\) ; aucun frottement dans le vide poussé d'un tube, d'un accélérateur ou de l'espace.</li>
      <li><span class="step">Ordres de grandeur.</span> Calculer \(|q|E\) et \(|q|vB\) avec les valeurs de l'énoncé et les comparer à \(mg\). Pour un électron, un proton ou un ion, le rapport dépasse \(10^{8}\) : le poids est négligeable. Pour un objet chargé macroscopique (gouttelette, poussière), faire le calcul : le poids peut compter.</li>
      <li><span class="step">Conclusion écrite.</span> « Le poids est négligeable devant la force de Lorentz, d'où \(m\,\mathrm{d}\vec v/\mathrm{d}t=q(\vec E+\vec v\wedge\vec B)\). »</li>
    </ol>
    <p><em>Exemple éclair :</em> ion \(\text{Na}^+\) (\(m=23{,}0\,u\approx3{,}8\times10^{-26}\ \text{kg}\)) à \(1{,}0\times10^{5}\ \text{m·s}^{-1}\) dans \(B=0{,}10\ \text{T}\) : \(|q|vB=1{,}6\times10^{-15}\ \text{N}\) et \(mg\approx3{,}7\times10^{-25}\ \text{N}\), rapport \(\approx4\times10^{9}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : comparer des grandeurs de natures différentes (\(E\) à \(g\), \(qE\) à \(m\)…). On compare des forces, en newtons, ou des accélérations : \(|q|E/m\) et \(g\).</div>

  <div class="method-box"><strong>Méthode 2 — Calculer une force de Lorentz en composantes</strong>
    <ol>
      <li><span class="step">Base.</span> Choisir une base orthonormée directe adaptée, avec \(\vec B\) selon \(\vec e_z\) si possible.</li>
      <li><span class="step">Produit vectoriel.</span> Utiliser la permutation circulaire \(\vec e_x\wedge\vec e_y=\vec e_z\), \(\vec e_y\wedge\vec e_z=\vec e_x\), \(\vec e_z\wedge\vec e_x=\vec e_y\) (signe changé si l'on échange les facteurs) ; pour \(\vec B=B\,\vec e_z\) : \(\vec v\wedge\vec B=B\,(v_y\,\vec e_x-v_x\,\vec e_y)\).</li>
      <li><span class="step">Charge.</span> Multiplier par \(q\) <strong>avec son signe</strong>, puis ajouter \(q\vec E\).</li>
      <li><span class="step">Contrôle.</span> La force magnétique est orthogonale à \(\vec v\) et à \(\vec B\) : vérifier que \(\vec F_B\cdot\vec v=0\) ; sa norme vaut \(|q|vB\sin\alpha\).</li>
    </ol>
    <p><em>Exemple éclair :</em> électron de vitesse \(\vec v=(2{,}0\,\vec e_x+1{,}0\,\vec e_y)\times10^{6}\ \text{m·s}^{-1}\) dans \(\vec B=0{,}20\ \text{T}\;\vec e_z\) : \(\vec v\wedge\vec B=(2{,}0\,\vec e_x-4{,}0\,\vec e_y)\times10^{5}\ \text{V·m}^{-1}\), d'où \(\vec F=-e\,\vec v\wedge\vec B=(-3{,}2\,\vec e_x+6{,}4\,\vec e_y)\times10^{-14}\ \text{N}\). Contrôle : \(\vec F\cdot\vec v=(-6{,}4+6{,}4)\times10^{-8}=0\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(\vec B\wedge\vec v\) (force opposée) ou oublier que \(q=-e\) pour un électron. Le sens d'une force magnétique se vérifie toujours une seconde fois, par la règle des trois doigts.</div>

  <div class="method-box"><strong>Méthode 3 — Savoir quel champ modifie la vitesse (puissance)</strong>
    <ol>
      <li><span class="step">Puissance.</span> \(\mathcal P=\vec F\cdot\vec v=q\,\vec E\cdot\vec v\) : le terme magnétique est nul à chaque instant.</li>
      <li><span class="step">Théorème de la puissance cinétique.</span> \(\dfrac{\mathrm{d}E_c}{\mathrm{d}t}=q\,\vec E\cdot\vec v\) : la particule accélère si \(q\vec E\cdot\vec v\gt0\), ralentit sinon.</li>
      <li><span class="step">Champ magnétique seul.</span> \(E_c\) et la norme \(v\) sont constantes : le mouvement est uniforme, seule la direction de la vitesse change.</li>
      <li><span class="step">Champs stationnaires.</span> L'énergie mécanique \(E_m=\tfrac12mv^2+qV\) se conserve, quel que soit \(\vec B\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un électron à \(1{,}0\times10^{7}\ \text{m·s}^{-1}\) entre dans un champ \(E=5{,}0\times10^{3}\ \text{V·m}^{-1}\) de même sens que sa vitesse : \(\mathcal P=-eEv=-8{,}0\times10^{-9}\ \text{W}\lt0\), il ralentit. Son énergie \(E_c=4{,}6\times10^{-17}\ \text{J}\) (284 eV) est épuisée après \(E_c/(eE)\approx5{,}7\ \text{cm}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Mettre en équation un mouvement dans un champ électrique uniforme</strong>
    <ol>
      <li><span class="step">Axes.</span> \(Oy\) selon \(\vec E\), \(Ox\) dans le plan formé par \(\vec E\) et \(\vec v_0\), origine au point de départ.</li>
      <li><span class="step">Principe fondamental.</span> \(\vec a=q\vec E/m\), constant : c'est le problème de la chute libre, avec \(\vec g\) remplacé par \(q\vec E/m\).</li>
      <li><span class="step">Intégration.</span> \(v_x=v_{0x}\), \(x=v_{0x}t\) ; \(v_y=\dfrac{qE}{m}t+v_{0y}\), \(y=\dfrac{qE}{2m}t^2+v_{0y}t\).</li>
      <li><span class="step">Trajectoire.</span> Éliminer \(t=x/v_{0x}\) : parabole si \(v_{0x}\neq0\), droite sinon.</li>
      <li><span class="step">Contrôle.</span> Une charge positive est déviée dans le sens de \(\vec E\), une charge négative en sens contraire.</li>
    </ol>
    <p><em>Exemple éclair :</em> proton entrant à \(v_0=1{,}0\times10^{6}\ \text{m·s}^{-1}\) selon \(\vec e_x\) dans \(\vec E=-2{,}0\times10^{4}\ \text{V·m}^{-1}\;\vec e_y\) : \(a_y=-eE/m_p\approx-1{,}9\times10^{12}\ \text{m·s}^{-2}\). Après \(x=5{,}0\ \text{cm}\), soit \(t=50\ \text{ns}\), \(y=\tfrac12a_yt^2\approx-2{,}4\ \text{mm}\) : dévié dans le sens de \(\vec E\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Calculer une déviation électrique, des plaques à l'écran</strong>
    <ol>
      <li><span class="step">Vitesse d'entrée.</span> Par un bilan énergétique (méthode 6) : \(v_0^2=2|q|U_a/m\) pour une accélération sous \(U_a\).</li>
      <li><span class="step">Entre les plaques.</span> \(E=U/d\), durée de traversée \(\tau=L/v_0\) ; à la sortie, \(\delta=\dfrac{|q|UL^2}{2mdv_0^2}\) et \(\tan\alpha=\dfrac{|q|UL}{mdv_0^2}=\dfrac{2\delta}{L}\).</li>
      <li><span class="step">Après les plaques.</span> Mouvement rectiligne uniforme ; la droite de sortie prolongée passe par le milieu des plaques : \(Y=D\tan\alpha\), \(D\) étant mesurée depuis ce milieu.</li>
      <li><span class="step">Résultat.</span> Avec \(v_0^2=2|q|U_a/m\) : \(\delta=\dfrac{UL^2}{4dU_a}\), \(\tan\alpha=\dfrac{UL}{2dU_a}\), indépendants de \(q\) et de \(m\).</li>
      <li><span class="step">Vérification.</span> \(\delta\lt d/2\) : sinon la particule heurte une plaque.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(U_a=2{,}0\ \text{kV}\), \(L=3{,}0\ \text{cm}\), \(d=8{,}0\ \text{mm}\), \(U=40\ \text{V}\), \(D=20\ \text{cm}\) : \(\tan\alpha=\dfrac{40\times0{,}030}{2\times0{,}0080\times2000}=0{,}037\,5\), \(Y=7{,}5\ \text{mm}\) ; \(\delta=0{,}56\ \text{mm}\lt4\ \text{mm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : mesurer \(D\) depuis la sortie des plaques et écrire quand même \(Y=D\tan\alpha\). Avec une distance \(D'\) comptée depuis la sortie, \(Y=\delta+D'\tan\alpha\), ce qui revient au même.</div>

  <div class="method-box"><strong>Méthode 6 — Déterminer une vitesse par un bilan énergétique</strong>
    <ol>
      <li><span class="step">Points et potentiels.</span> Repérer le point de départ A et le point d'arrivée B, et leurs potentiels \(V_A\), \(V_B\).</li>
      <li><span class="step">Théorème de l'énergie cinétique.</span> \(\tfrac12mv_B^2-\tfrac12mv_A^2=q\,(V_A-V_B)\). Ni la trajectoire, ni la forme du champ, ni \(\vec B\) (qui ne travaille pas) n'interviennent.</li>
      <li><span class="step">Signe.</span> L'énergie cinétique doit rester positive : si le calcul donne \(E_c\lt0\) en B, la particule n'atteint pas B ; elle rebrousse chemin là où \(E_c\) s'annule.</li>
      <li><span class="step">Électronvolts.</span> Une charge \(Ze\) qui franchit la tension \(U\) gagne \(ZU\) électronvolts ; convertir (\(1\ \text{eV}=1{,}602\times10^{-19}\ \text{J}\)) avant de calculer \(v=\sqrt{2E_c/m}\).</li>
      <li><span class="step">Validité.</span> Vérifier \(E_c\ll mc^2\) (511 keV pour l'électron, 938 MeV pour le proton).</li>
    </ol>
    <p><em>Exemple éclair :</em> particule \(\alpha\) (\(\text{He}^{2+}\), \(m=6{,}64\times10^{-27}\ \text{kg}\)) partie du repos et accélérée sous 5,0 kV : \(E_c=2\times5{,}0=10\ \text{keV}=1{,}6\times10^{-15}\ \text{J}\), \(v=\sqrt{2E_c/m}\approx6{,}9\times10^{5}\ \text{m·s}^{-1}\ll c\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(\Delta E_c=qU\) sans dire de quel point à quel point. Écrire \(q\,(V_{\text{départ}}-V_{\text{arrivée}})\), puis contrôler : une charge positive accélère vers les potentiels décroissants, une charge négative vers les potentiels croissants.</div>

  <div class="method-box"><strong>Méthode 7 — Établir le mouvement circulaire dans un champ magnétique uniforme</strong>
    <ol>
      <li><span class="step">Hypothèses.</span> \(\vec E=\vec 0\), \(\vec B\) uniforme et stationnaire, \(\vec v_0\perp\vec B\), poids négligé.</li>
      <li><span class="step">Vitesse constante.</span> La puissance de la force magnétique est nulle (méthode 3) : \(v=v_0\).</li>
      <li><span class="step">Mouvement plan.</span> Avec \(\vec B=B\,\vec e_z\) : \(m\,\dot v_z=0\), donc \(v_z=0\) et le mouvement reste dans le plan orthogonal à \(\vec B\) passant par \(M_0\).</li>
      <li><span class="step">Rayon.</span> L'accélération est normale, de norme \(v_0^2/R\), et la force a pour norme \(|q|v_0B\) : \(m\dfrac{v_0^2}{R}=|q|v_0B\), d'où \(R=\dfrac{mv_0}{|q|B}\), constant : la trajectoire est un cercle. (Variante : projeter, \(\dot v_x=\omega v_y\), \(\dot v_y=-\omega v_x\) avec \(\omega=qB/m\), et intégrer.)</li>
      <li><span class="step">Période.</span> \(T=\dfrac{2\pi R}{v_0}=\dfrac{2\pi m}{|q|B}\), indépendante de la vitesse ; pulsation \(\omega_c=|q|B/m\).</li>
    </ol>
    <p><em>Exemple éclair :</em> électrons accélérés sous 150 V (\(v\approx7{,}3\times10^{6}\ \text{m·s}^{-1}\)) dans le champ \(B=1{,}0\ \text{mT}\) des bobines d'un tube à faisceau fin : \(R=\dfrac{m_ev}{eB}\approx4{,}1\ \text{cm}\) et \(T\approx36\ \text{ns}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Trouver le centre et le sens de parcours</strong>
    <ol>
      <li><span class="step">Force au départ.</span> En \(M_0\), déterminer la direction de \(\vec F=q\,\vec v_0\wedge\vec B\) : trois doigts de la main droite pour \(\vec v_0\wedge\vec B\), puis signe de \(q\).</li>
      <li><span class="step">Centre.</span> La force est centripète : le centre \(C\) est à la distance \(R\) de \(M_0\), du côté de \(\vec F\) ; vectoriellement \(\overrightarrow{M_0C}=\dfrac{m}{qB^2}\,\vec v_0\wedge\vec B\).</li>
      <li><span class="step">Sens.</span> La particule part selon \(\vec v_0\) en tournant autour de \(C\). Contrôle par le vecteur rotation \(\vec\omega=-q\vec B/m\) : une charge positive tourne dans le sens horaire pour un observateur vers qui \(\vec B\) pointe (⊙), une charge négative dans le sens trigonométrique.</li>
      <li><span class="step">Symétries.</span> Changer le signe de \(q\) <strong>ou</strong> celui de \(\vec B\) inverse le sens ; changer les deux le conserve.</li>
    </ol>
    <p><em>Exemple éclair :</em> ion positif, \(\vec v_0=v_0\,\vec e_y\) (vers le haut de la feuille), \(\vec B=B\,\vec e_z\) (⊙) : \(\vec F=qv_0B\,(\vec e_y\wedge\vec e_z)=qv_0B\,\vec e_x\). Le centre est à droite du point de départ ; l'ion monte en tournant autour d'un centre situé à sa droite : sens horaire pour le lecteur, comme l'annonce la règle.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dire « sens horaire » sans préciser d'où l'on regarde. Le sens se rapporte toujours à la direction de \(\vec B\).</div>

  <div class="method-box"><strong>Méthode 9 — Traiter une région de champ limitée</strong>
    <ol>
      <li><span class="step">Découper.</span> Dans chaque zone, un seul type de mouvement ; aux frontières, la position et la vitesse se raccordent (elles sont continues).</li>
      <li><span class="step">Géométrie d'entrée.</span> Si la particule entre perpendiculairement au bord rectiligne de la zone de champ, le centre de son cercle est sur ce bord. Comparer le rayon \(R\) à la largeur \(\ell\) de la zone.</li>
      <li><span class="step">Zone large (\(\ell\ge R\)).</span> Demi-tour : sortie à la distance \(2R\) du point d'entrée, après \(T/2=\pi m/(|q|B)\), avec la vitesse \(-\vec v_0\).</li>
      <li><span class="step">Zone étroite (\(\ell\lt R\)).</span> Sortie par le bord opposé, déviée de l'angle \(\theta\) tel que \(\sin\theta=\ell/R\), avec un décalage latéral \(h=R\,(1-\cos\theta)\).</li>
      <li><span class="step">Au-delà.</span> Mouvement rectiligne uniforme : sur un écran à la distance \(D\) du bord de sortie, \(Y=h+D\tan\theta\).</li>
    </ol>
    <p><em>Exemple éclair :</em> proton de 10 keV (\(v\approx1{,}38\times10^{6}\ \text{m·s}^{-1}\)) dans \(B=0{,}10\ \text{T}\) sur \(\ell=5{,}0\ \text{cm}\) : \(R=\dfrac{m_pv}{eB}\approx14{,}5\ \text{cm}\gt\ell\), \(\sin\theta\approx0{,}35\), \(\theta\approx20°\), \(h\approx8{,}9\ \text{mm}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Étudier un dispositif à plusieurs étages</strong>
    <ol>
      <li><span class="step">Zones.</span> Découper le trajet (accélération, filtre, zone de champ magnétique, vol libre) et nommer la vitesse et le point de sortie de chaque zone.</li>
      <li><span class="step">Briques.</span> Accélération sous \(U\) : \(v=\sqrt{2|q|U/m}\) ; filtre de Wien (\(\vec E\perp\vec B\), forces opposées) : \(v=E/B\) ; zone de champ \(\vec B\) seul : \(R=mv/(|q|B)\).</li>
      <li><span class="step">Résultat littéral.</span> Combiner : accélération puis champ magnétique, \(R=\dfrac1B\sqrt{\dfrac{2mU}{|q|}}\propto\sqrt{m/|q|}\) ; filtre puis champ \(B'\), \(R=\dfrac{mE}{|q|BB'}\propto m/|q|\).</li>
      <li><span class="step">Interprétation.</span> Le dispositif mesure \(m/|q|\) (pas \(m\)) ; calculer l'écart entre deux masses voisines pour juger de la séparation.</li>
    </ol>
    <p><em>Exemple éclair :</em> filtre \(E=2{,}0\times10^{4}\ \text{V·m}^{-1}\), \(B=0{,}050\ \text{T}\) : \(v=4{,}0\times10^{5}\ \text{m·s}^{-1}\) ; puis \(B'=0{,}50\ \text{T}\) : \(R\approx16{,}6\ \text{cm}\) pour \(^{20}\text{Ne}^+\) et \(18{,}2\ \text{cm}\) pour \(^{22}\text{Ne}^+\), impacts séparés de \(2\,\Delta R\approx3{,}3\ \text{cm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : conclure qu'un spectromètre « pèse » les ions. Des ions \(^{12}\text{C}^{+}\) et \(^{24}\text{Mg}^{2+}\) ont le même rapport \(m/q\) et arrivent au même point.</div>
</div>
</template>
