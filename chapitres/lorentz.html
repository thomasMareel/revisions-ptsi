<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Accélération d'un proton, puis d'un électron</h3>
  <div class="statement">Un proton (\(e=1{,}6\times10^{-19}\ \text{C}\), \(m_p=1{,}67\times10^{-27}\ \text{kg}\)), initialement au repos, est accéléré par une tension \(U=10\ \text{kV}\). Données : \(m_e=9{,}1\times10^{-31}\ \text{kg}\) ; \(c=3{,}0\times10^{8}\ \text{m·s}^{-1}\) ; énergies de masse \(m_pc^2=938\ \text{MeV}\), \(m_ec^2=511\ \text{keV}\). Le poids est négligé.</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse acquise par le proton à la fin de l'accélération.</div>
  <div class="q"><strong>Q2.</strong> Exprimer son énergie cinétique en joules et en électronvolts. La comparer à \(m_pc^2\) ; la mécanique classique est-elle justifiée ?</div>
  <div class="q"><strong>Q3.</strong> Un électron est accéléré depuis le repos sous la même tension. Dans quel sens doit-il traverser la différence de potentiel ? Calculer sa vitesse et commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Seule la force électrique travaille, et son travail ne dépend que des potentiels de départ et d'arrivée : on applique le théorème de l'énergie cinétique depuis le repos, \(\tfrac12m_pv^2=eU\), d'où</p>
    <div class="formula">$$v=\sqrt{\frac{2eU}{m_p}}=\sqrt{\frac{2\times1{,}6\times10^{-19}\times1{,}0\times10^{4}}{1{,}67\times10^{-27}}}\approx1{,}38\times10^{6}\ \text{m·s}^{-1}$$</div>
    <p><strong>Q2.</strong> \(E_c=eU=1{,}6\times10^{-15}\ \text{J}\), soit \(10\ \text{keV}\) : une charge \(e\) qui franchit 10 kV gagne 10 keV, sans calcul. C'est \(10^{-5}\) fois l'énergie de masse \(m_pc^2\) ; \(v/c\approx0{,}46\ \%\) : la mécanique classique convient parfaitement.</p>
    <p><strong>Q3.</strong> Une charge négative gagne de l'énergie en allant vers les potentiels croissants : l'électron part de la cathode (0 V) et va vers l'anode (\(+10\ \text{kV}\)). Il gagne aussi \(10\ \text{keV}\), mais sa masse est 1 836 fois plus petite : \(v=\sqrt{2eU/m_e}\approx5{,}9\times10^{7}\ \text{m·s}^{-1}\), soit \(0{,}20\,c\), 43 fois (\(\sqrt{1836}\)) la vitesse du proton. \(E_c/(m_ec^2)\approx2\ \%\) : le calcul classique reste acceptable (il surestime \(v\) d'environ 1,5 %), mais il deviendrait faux vers 100 kV, où \(E_c\) n'est plus négligeable devant 511 keV.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Faut-il tenir compte du poids ?</h3>
  <div class="statement">Données : \(e=1{,}6\times10^{-19}\ \text{C}\) ; \(m_e=9{,}1\times10^{-31}\ \text{kg}\) ; \(m_p=1{,}67\times10^{-27}\ \text{kg}\) ; \(g=9{,}8\ \text{m·s}^{-2}\) ; \(\dfrac{1}{4\pi\varepsilon_0}=9{,}0\times10^{9}\ \text{SI}\) ; \(G=6{,}67\times10^{-11}\ \text{SI}\).</div>
  <div class="q"><strong>Q1.</strong> Un électron se trouve entre les plaques de déviation d'un oscilloscope, où \(E=1{,}0\times10^{4}\ \text{V·m}^{-1}\). Comparer la force électrique et le poids.</div>
  <div class="q"><strong>Q2.</strong> Un proton du vent solaire, de vitesse \(4{,}0\times10^{5}\ \text{m·s}^{-1}\), traverse orthogonalement le champ magnétique terrestre \(B=5{,}0\times10^{-5}\ \text{T}\). Comparer la force magnétique et le poids.</div>
  <div class="q"><strong>Q3.</strong> Une gouttelette d'huile sphérique, de rayon \(r=0{,}80\ \mu\text{m}\) et de masse volumique \(880\ \text{kg·m}^{-3}\), porte trois charges élémentaires négatives. Elle se trouve entre deux plaques horizontales distantes de \(1{,}0\ \text{cm}\). Quelle tension faut-il appliquer pour la maintenir immobile ? Quelle plaque doit être au potentiel le plus élevé ?</div>
  <div class="q"><strong>Q4.</strong> Dans un atome d'hydrogène, comparer l'attraction électrique et l'attraction gravitationnelle entre l'électron et le proton. Le rapport dépend-il de leur distance ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(eE=1{,}6\times10^{-15}\ \text{N}\) et \(m_eg=8{,}9\times10^{-30}\ \text{N}\) : le rapport vaut \(1{,}8\times10^{14}\). Le poids est négligeable sans discussion.</p>
    <p><strong>Q2.</strong> \(evB=3{,}2\times10^{-18}\ \text{N}\) et \(m_pg=1{,}6\times10^{-26}\ \text{N}\) : rapport \(\approx2\times10^{8}\). Même dans le faible champ terrestre, la force magnétique l'emporte de très loin : c'est le produit \(|q|vB\), et non \(B\) seul, qu'il faut comparer.</p>
    <p><strong>Q3.</strong> Masse : \(m=\tfrac43\pi r^3\rho=1{,}9\times10^{-15}\ \text{kg}\), poids \(mg=1{,}85\times10^{-14}\ \text{N}\). À l'équilibre, la force électrique compense le poids : \(3eE=mg\), d'où \(E=\dfrac{mg}{3e}\approx3{,}9\times10^{4}\ \text{V·m}^{-1}\) et \(U=Ed\approx3{,}9\times10^{2}\ \text{V}\). La force électrique doit être dirigée vers le haut ; la charge étant négative, le champ est dirigé vers le bas, donc de la plaque supérieure vers la plaque inférieure : la plaque <strong>supérieure</strong> est au potentiel le plus élevé. Ici, poids et force électrique sont du même ordre : on ne peut pas négliger le poids d'un objet macroscopique (c'est le principe de l'expérience de Millikan).</p>
    <p><strong>Q4.</strong> Les deux forces varient en \(1/r^2\), donc leur rapport ne dépend pas de la distance :</p>
    <div class="formula">$$\frac{F_e}{F_g}=\frac{e^2}{4\pi\varepsilon_0\,G\,m_em_p}=\frac{9{,}0\times10^{9}\times(1{,}6\times10^{-19})^2}{6{,}67\times10^{-11}\times9{,}1\times10^{-31}\times1{,}67\times10^{-27}}\approx2{,}3\times10^{39}$$</div>
    <p>La gravitation est sans aucun rôle à l'échelle des particules.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Mouvement circulaire d'un proton</h3>
  <div class="statement">Un proton (\(e=1{,}6\times10^{-19}\ \text{C}\), \(m_p=1{,}67\times10^{-27}\ \text{kg}\)) pénètre en \(O\), avec la vitesse \(\vec v_0=v_0\,\vec e_x\) (\(v_0=1{,}0\times10^{6}\ \text{m·s}^{-1}\)), dans une région où règne le champ magnétique uniforme \(\vec B=B\,\vec e_z\), \(B=0{,}10\ \text{T}\). La base \((\vec e_x,\vec e_y,\vec e_z)\) est orthonormée directe ; le poids est négligé.</div>
  <div class="q"><strong>Q1.</strong> Montrer que le mouvement est uniforme et qu'il a lieu dans le plan \(z=0\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le rayon de la trajectoire circulaire.</div>
  <div class="q"><strong>Q3.</strong> Calculer la pulsation cyclotron et la période. Dépendent-elles de \(v_0\) ?</div>
  <div class="q"><strong>Q4.</strong> Déterminer la position du centre et le sens de parcours pour un observateur placé du côté \(z\gt0\). Mêmes questions pour un électron de même vitesse (\(m_e=9{,}1\times10^{-31}\ \text{kg}\)) ; calculer son rayon.</div>
  <div class="q"><strong>Q5.</strong> La force magnétique fournit-elle de l'énergie au proton ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La force \(e\,\vec v\wedge\vec B\) est orthogonale à \(\vec v\) : sa puissance est nulle, donc \(E_c\) et \(v\) sont constantes (mouvement uniforme). Elle est aussi orthogonale à \(\vec B=B\,\vec e_z\) : \(m_p\dot v_z=0\), donc \(v_z\) garde sa valeur initiale, nulle, et \(z=0\) à tout instant.</p>
    <p><strong>Q2.</strong> La force, de norme \(ev_0B\), est la seule force et elle est normale à la trajectoire : \(m_p\dfrac{v_0^2}{R}=ev_0B\), soit</p>
    <div class="formula">$$R=\frac{m_pv_0}{eB}=\frac{1{,}67\times10^{-27}\times1{,}0\times10^{6}}{1{,}6\times10^{-19}\times0{,}10}\approx10{,}4\ \text{cm}$$</div>
    <p><strong>Q3.</strong> \(\omega_c=\dfrac{eB}{m_p}\approx9{,}6\times10^{6}\ \text{rad·s}^{-1}\) et \(T=\dfrac{2\pi}{\omega_c}\approx6{,}6\times10^{-7}\ \text{s}\). Ni l'une ni l'autre ne dépend de \(v_0\) : un proton plus rapide décrit un cercle plus grand, dans la même durée.</p>
    <p><strong>Q4.</strong> En \(O\) : \(\vec F=ev_0B\,(\vec e_x\wedge\vec e_z)=-ev_0B\,\vec e_y\). Le centre est donc en \(C(0,\,-R,\,0)\). Le proton part selon \(+\vec e_x\) depuis le « haut » du cercle : il tourne dans le sens <strong>horaire</strong> pour l'observateur placé du côté \(z\gt0\), vers qui \(\vec B\) est dirigé, comme l'annonce le vecteur rotation \(-e\vec B/m_p\). Pour l'électron, la force en \(O\) est opposée : centre en \((0,\,+R_e,\,0)\), sens trigonométrique, et \(R_e=\dfrac{m_ev_0}{eB}\approx5{,}7\times10^{-5}\ \text{m}=57\ \mu\text{m}\), 1 836 fois plus petit.</p>
    <p><strong>Q5.</strong> Non : sa puissance est nulle à chaque instant. L'énergie cinétique reste égale à \(\tfrac12m_pv_0^2\approx8{,}4\times10^{-16}\ \text{J}\) (5,2 keV) ; le champ ne fait que tourner la vitesse.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Déflexion électrique dans un oscilloscope</h3>
  <div class="statement">Un électron (\(q=-e\), \(e=1{,}6\times10^{-19}\ \text{C}\), \(m_e=9{,}1\times10^{-31}\ \text{kg}\)) est accéléré depuis le repos par une tension \(U_a=2{,}0\ \text{kV}\). Il pénètre ensuite en \(O\), à mi-distance et parallèlement à deux plaques horizontales de longueur \(L=5{,}0\ \text{cm}\), distantes de \(d=2{,}0\ \text{cm}\), entre lesquelles on applique la tension \(U_d=200\ \text{V}\), la plaque supérieure étant au potentiel le plus élevé. Un écran est placé à la distance \(D=20\ \text{cm}\) du milieu des plaques. Axe \(Ox\) selon la vitesse d'entrée, axe \(Oy\) vers le haut.</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse \(v_0\) à l'entrée des plaques.</div>
  <div class="q"><strong>Q2.</strong> Établir l'équation de la trajectoire entre les plaques. Dans quel sens l'électron est-il dévié ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la déviation \(\delta\) à la sortie des plaques. L'électron en sort-il sans les toucher ?</div>
  <div class="q"><strong>Q4.</strong> Montrer que la droite suivie après les plaques, prolongée, passe par le milieu des plaques. En déduire la déviation \(Y\) du spot sur l'écran et la sensibilité de l'appareil (déviation par volt).</div>
  <div class="q"><strong>Q5.</strong> On remplace les électrons par des protons accélérés sous la même tension (polarité inversée). Que devient la déviation sur l'écran ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Théorème de l'énergie cinétique : \(\tfrac12m_ev_0^2=eU_a\), d'où \(v_0=\sqrt{2eU_a/m_e}\approx2{,}65\times10^{7}\ \text{m·s}^{-1}\).</p>
    <p><strong>Q2.</strong> Le champ est uniforme, dirigé de la plaque positive (en haut) vers la plaque négative : \(\vec E=-E\,\vec e_y\), avec \(E=U_d/d=1{,}0\times10^{4}\ \text{V·m}^{-1}\). La force \(-e\vec E=eE\,\vec e_y\) est constante et dirigée vers le haut. Le principe fondamental donne \(\ddot x=0\) et \(\ddot y=eE/m_e\) ; avec les conditions initiales, \(x=v_0t\) et \(y=\dfrac{eE}{2m_e}t^2\), d'où la parabole</p>
    <div class="formula">$$y=\frac{eE}{2m_ev_0^2}\,x^2$$</div>
    <p>L'électron est dévié vers le haut, vers la plaque positive.</p>
    <p><strong>Q3.</strong> En \(x=L\) : \(\delta=\dfrac{eEL^2}{2m_ev_0^2}\). En reportant \(v_0^2=2eU_a/m_e\) : \(\delta=\dfrac{U_dL^2}{4dU_a}=\dfrac{200\times0{,}050^2}{4\times0{,}020\times2000}\approx3{,}1\ \text{mm}\). (Même résultat par le calcul direct : \(a=eE/m_e\approx1{,}76\times10^{15}\ \text{m·s}^{-2}\), \(\tau=L/v_0\approx1{,}9\ \text{ns}\), \(\delta=\tfrac12a\tau^2\).) Comme \(\delta\lt d/2=10\ \text{mm}\), l'électron sort sans toucher la plaque.</p>
    <p><strong>Q4.</strong> À la sortie, la pente vaut \(\tan\alpha=\dfrac{\mathrm{d}y}{\mathrm{d}x}(L)=\dfrac{eEL}{m_ev_0^2}=\dfrac{2\delta}{L}\). Au-delà, le champ est nul et le mouvement est rectiligne uniforme, selon la droite \(y=\delta+(x-L)\tan\alpha\), qui coupe l'axe \(y=0\) en \(x=L-\delta/\tan\alpha=L/2\) : le milieu des plaques. D'où</p>
    <div class="formula">$$Y=D\tan\alpha=\frac{DU_dL}{2dU_a}=\frac{0{,}20\times200\times0{,}050}{2\times0{,}020\times2000}=2{,}5\ \text{cm}$$</div>
    <p>La sensibilité vaut \(Y/U_d=0{,}125\ \text{mm·V}^{-1}\).</p>
    <p><strong>Q5.</strong> L'expression \(Y=DU_dL/(2dU_a)\) ne contient ni la charge ni la masse : des protons accélérés sous la même tension subissent la même déviation en valeur absolue, mais vers le bas, puisque leur charge est positive. Un champ électrique ne distingue pas des particules accélérées par la même tension.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Analyseur à miroir électrostatique</h3>
  <div class="statement">Une grille plane, au potentiel 0, et une plaque parallèle placée à la distance \(d=2{,}0\ \text{cm}\), au potentiel \(-U\) (\(U=1{,}0\ \text{kV}\)), délimitent une zone de champ uniforme. L'axe \(Ox\) est dans le plan de la grille, l'axe \(Oy\) normal à la grille et dirigé vers la plaque. Des électrons d'énergie cinétique \(E_{c0}=1{,}2\ \text{keV}\) franchissent la grille en \(O\) avec une vitesse \(\vec v_0\) contenue dans le plan \(xOy\), qui fait l'angle \(\beta=45°\) avec la grille. Données : \(e=1{,}6\times10^{-19}\ \text{C}\), \(m_e=9{,}1\times10^{-31}\ \text{kg}\) ; poids négligé.</div>
  <div class="q"><strong>Q1.</strong> Déterminer le champ électrique entre la grille et la plaque (direction, sens, norme) et l'accélération d'un électron.</div>
  <div class="q"><strong>Q2.</strong> Établir \(x(t)\), \(y(t)\) et l'équation de la trajectoire.</div>
  <div class="q"><strong>Q3.</strong> À quelle condition sur \(E_{c0}\), \(\beta\) et \(U\) l'électron n'atteint-il pas la plaque ? Est-elle vérifiée ? Interpréter en termes d'énergie.</div>
  <div class="q"><strong>Q4.</strong> Montrer que l'électron repasse la grille à la distance \(x_r=\dfrac{2E_{c0}\,d\sin2\beta}{eU}\) du point d'entrée. Calculer \(x_r\) et la durée du trajet dans le miroir.</div>
  <div class="q"><strong>Q5.</strong> Une fente percée dans la grille en \(x=x_r\) ne laisse ressortir que certains électrons. De combien se déplace le point de retour pour des électrons d'énergie supérieure de 1 % ? Que vaut \(x_r\) pour des électrons de 1,2 keV entrant sous \(44°\) ? Pourquoi choisit-on \(\beta=45°\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le champ est dirigé vers les potentiels décroissants, de la grille (0) vers la plaque (\(-U\)) : \(\vec E=E\,\vec e_y\), avec \(E=U/d=5{,}0\times10^{4}\ \text{V·m}^{-1}\). La force \(-eE\,\vec e_y\) ramène l'électron vers la grille ; l'accélération est constante : \(\vec a=-\dfrac{eE}{m_e}\,\vec e_y\), de norme \(a\approx8{,}8\times10^{15}\ \text{m·s}^{-2}\).</p>
    <p><strong>Q2.</strong> Avec \(v_0=\sqrt{2E_{c0}/m_e}\approx2{,}05\times10^{7}\ \text{m·s}^{-1}\) : \(x=v_0\cos\beta\,t\) (mouvement uniforme selon \(Ox\), où la force est nulle) et \(y=v_0\sin\beta\,t-\tfrac12at^2\). En éliminant \(t\) :</p>
    <div class="formula">$$y=x\tan\beta-\frac{eE}{4E_{c0}\cos^2\beta}\,x^2$$</div>
    <p>C'est l'arc de parabole d'un tir oblique, tourné vers la grille.</p>
    <p><strong>Q3.</strong> La hauteur maximale est atteinte quand \(v_y=0\) : \(y_{\max}=\dfrac{(v_0\sin\beta)^2}{2a}=\dfrac{E_{c0}\sin^2\beta}{eE}\). L'électron n'atteint pas la plaque si \(y_{\max}\lt d\), soit \(E_{c0}\sin^2\beta\lt eU\). Ici \(E_{c0}\sin^2\beta=600\ \text{eV}\lt1000\ \text{eV}\) et \(y_{\max}=1{,}2\ \text{cm}\lt2{,}0\ \text{cm}\) : la condition est vérifiée. Interprétation : la composante \(v_x\) ne change pas ; seule l'énergie cinétique « normale » \(\tfrac12m_ev_{0y}^2=E_{c0}\sin^2\beta\) peut se convertir en énergie potentielle, et il faudrait \(eU=1{,}0\ \text{keV}\) pour atteindre la plaque.</p>
    <p><strong>Q4.</strong> \(y=0\) pour \(t_r=\dfrac{2v_0\sin\beta}{a}\), d'où</p>
    <div class="formula">$$x_r=v_0\cos\beta\;t_r=\frac{2v_0^2\sin\beta\cos\beta}{a}=\frac{2E_{c0}\sin2\beta}{eE}=\frac{2E_{c0}\,d\sin2\beta}{eU}$$</div>
    <p>Numériquement, avec \(E_{c0}/e=1200\ \text{V}\) : \(x_r=\dfrac{2\times1200\times0{,}020\times1}{1000}=4{,}8\ \text{cm}\), et \(t_r\approx3{,}3\ \text{ns}\).</p>
    <p><strong>Q5.</strong> \(x_r\) est proportionnel à \(E_{c0}\) : pour \(+1\ \%\) d'énergie, le point de retour avance de \(0{,}48\ \text{mm}\). Une fente d'un demi-millimètre trie donc les électrons à 1 % près en énergie : c'est un <strong>analyseur en énergie</strong>. Sous \(44°\), \(x_r=4{,}8\times\sin88°\approx4{,}797\ \text{cm}\) : le point de retour ne bouge que de 0,03 mm. À \(45°\), \(\sin2\beta\) est maximal, donc stationnaire : une petite erreur d'angle ne déplace presque pas le point de retour (au premier ordre), alors qu'un écart d'énergie le déplace proportionnellement. L'appareil accepte un faisceau un peu divergent sans perdre en résolution.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Trois particules de même énergie dans un champ magnétique</h3>
  <div class="statement">Un proton, un électron et un neutron, de même énergie cinétique \(E_c=1{,}0\ \text{keV}\), arrivent en \(O\) avec la vitesse \(\vec v=v\,\vec e_x\) dans une zone de champ magnétique uniforme \(\vec B=B\,\vec e_z\), \(B=0{,}050\ \text{T}\), dirigé vers l'observateur (⊙) ; pour celui-ci, \(\vec e_x\) est dirigé vers la droite et \(\vec e_y\) vers le haut. Le bord de la zone est le plan \(x=0\). Données : \(e=1{,}6\times10^{-19}\ \text{C}\), \(m_p=1{,}67\times10^{-27}\ \text{kg}\), \(m_e=9{,}1\times10^{-31}\ \text{kg}\) ; poids négligé.</div>
  <div class="q"><strong>Q1.</strong> Pour chaque particule, déterminer la force en \(O\) et le sens dans lequel s'incurve la trajectoire.</div>
  <div class="q"><strong>Q2.</strong> Calculer les vitesses et les rayons des trajectoires du proton et de l'électron.</div>
  <div class="q"><strong>Q3.</strong> Montrer qu'à énergie cinétique égale le rapport des rayons vaut \(\sqrt{m_p/m_e}\). Que vaudrait-il à vitesse égale ? À quantité de mouvement égale ?</div>
  <div class="q"><strong>Q4.</strong> Calculer les deux périodes. Combien de tours l'électron fait-il pendant que le proton en fait un ?</div>
  <div class="q"><strong>Q5.</strong> La zone de champ n'a en fait qu'une largeur \(\ell=5{,}0\ \text{cm}\). Décrire la sortie de chaque particule. Quelle valeur minimale de \(B\) renverrait aussi le proton vers l'arrière ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec F=qvB\,(\vec e_x\wedge\vec e_z)=-qvB\,\vec e_y\). Proton (\(q=e\)) : force selon \(-\vec e_y\), la trajectoire s'incurve vers le bas de la figure, dans le sens horaire pour l'observateur. Électron (\(q=-e\)) : force selon \(+\vec e_y\), courbure vers le haut, sens trigonométrique. Neutron : aucune force, trajectoire rectiligne.</p>
    <p><strong>Q2.</strong> \(v=\sqrt{2E_c/m}\) et \(R=\dfrac{mv}{eB}\). Proton : \(v_p\approx4{,}4\times10^{5}\ \text{m·s}^{-1}\), \(R_p\approx9{,}1\ \text{cm}\). Électron : \(v_e\approx1{,}9\times10^{7}\ \text{m·s}^{-1}\), \(R_e\approx2{,}1\ \text{mm}\).</p>
    <p><strong>Q3.</strong> \(mv=\sqrt{2mE_c}\), donc \(R=\dfrac{\sqrt{2mE_c}}{|q|B}\) : à même \(E_c\) et même \(|q|\), \(\dfrac{R_p}{R_e}=\sqrt{\dfrac{m_p}{m_e}}\approx43\). À vitesse égale, le rapport serait \(m_p/m_e\approx1\,840\) ; à quantité de mouvement égale, il vaudrait 1 : le rayon mesure la quantité de mouvement, \(mv=|q|BR\).</p>
    <p><strong>Q4.</strong> \(T_p=\dfrac{2\pi m_p}{eB}\approx1{,}3\ \mu\text{s}\) et \(T_e=\dfrac{2\pi m_e}{eB}\approx0{,}71\ \text{ns}\) : l'électron fait environ 1 800 tours pendant que le proton en fait un. Les périodes ne dépendent pas de l'énergie, seulement de \(m/|q|\).</p>
    <p><strong>Q5.</strong> Les particules entrent perpendiculairement au bord : le centre de chaque cercle est sur ce bord. L'électron (\(R_e\lt\ell\)) fait un demi-tour et ressort par le bord d'entrée, à \(2R_e\approx4{,}3\ \text{mm}\) au-dessus de \(O\), au bout de \(T_e/2\approx0{,}36\ \text{ns}\). Le proton (\(R_p\gt\ell\)) traverse la zone et ressort par le bord opposé, dévié vers le bas de \(\theta\) tel que \(\sin\theta=\ell/R_p\approx0{,}55\), soit \(\theta\approx33°\). Le neutron passe sans déviation. Pour renvoyer le proton, il faut \(R_p\le\ell\), soit \(B\ge\dfrac{m_pv_p}{e\ell}\approx0{,}091\ \text{T}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Spectrométrie de masse : isotopes du carbone</h3>
  <div class="statement">Dans un spectromètre de masse, des ions de charge \(q=e\) (\(e=1{,}6\times10^{-19}\ \text{C}\)), produits avec une vitesse négligeable, sont accélérés par une tension \(U=5{,}0\ \text{kV}\), puis entrent par une fente \(F\), perpendiculairement à la plaque détectrice qui la contient, dans une zone de champ magnétique uniforme \(B=0{,}20\ \text{T}\) orthogonal à leur vitesse. Après un demi-cercle, ils frappent la plaque détectrice. On relève deux impacts, aux distances \(x_1=35{,}3\ \text{cm}\) et \(x_2=36{,}7\ \text{cm}\) de la fente. Unité de masse atomique : \(u=1{,}66\times10^{-27}\ \text{kg}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer le rayon \(R\) de la trajectoire en fonction de \(m\), \(q\), \(U\) et \(B\), puis le rapport \(m/q\) en fonction de la distance \(x\) de l'impact à la fente.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(m/q\) pour chaque impact, puis les masses en unités de masse atomique. Identifier les deux isotopes du carbone.</div>
  <div class="q"><strong>Q3.</strong> Le champ est dirigé vers le lecteur et les ions entrent en montant vers le haut de la feuille. De quel côté de la fente se trouvent les impacts ?</div>
  <div class="q"><strong>Q4.</strong> Où arriveraient des ions \(^{12}\text{C}^{2+}\) ? Des ions \(^{24}\text{Mg}^{2+}\) (masse \(24{,}0\,u\)) arriveraient-ils au même point que l'un des précédents ? Que mesure réellement un spectromètre de masse ?</div>
  <div class="q"><strong>Q5.</strong> Les impacts sont repérés à \(1\ \text{mm}\) près. Quel écart relatif de masse minimal peut-on distinguer au voisinage de \(12\,u\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Accélération : \(\tfrac12mv^2=qU\), donc \(v=\sqrt{2qU/m}\). Dans le champ, mouvement circulaire uniforme de rayon \(R=\dfrac{mv}{qB}=\dfrac1B\sqrt{\dfrac{2mU}{q}}\). L'impact est au bout d'un demi-cercle, à la distance \(x=2R\) de la fente :</p>
    <div class="formula">$$\frac mq=\frac{B^2R^2}{2U}=\frac{B^2x^2}{8U}$$</div>
    <p><strong>Q2.</strong> Pour le premier impact :</p>
    <div class="formula">$$\frac{m_1}{q}=\frac{0{,}20^2\times0{,}353^2}{8\times5000}\approx1{,}25\times10^{-7}\ \text{kg·C}^{-1}$$</div>
    <p>d'où \(m_1\approx1{,}99\times10^{-26}\ \text{kg}\approx12{,}0\,u\). De même \(\dfrac{m_2}{q}\approx1{,}35\times10^{-7}\ \text{kg·C}^{-1}\) et \(m_2\approx2{,}16\times10^{-26}\ \text{kg}\approx13{,}0\,u\). Ce sont les ions \(^{12}\text{C}^+\) et \(^{13}\text{C}^+\).</p>
    <p><strong>Q3.</strong> À l'entrée, \(\vec v=v\,\vec e_y\) et \(\vec B=B\,\vec e_z\) : \(\vec F=qvB\,(\vec e_y\wedge\vec e_z)=qvB\,\vec e_x\). Le centre est à droite de la fente, et les impacts aussi : les ions positifs tournent dans le sens horaire pour le lecteur.</p>
    <p><strong>Q4.</strong> Pour \(^{12}\text{C}^{2+}\), \(m/q\) est divisé par 2, donc \(x\propto\sqrt{m/q}\) est divisé par \(\sqrt2\) : impact à \(35{,}3/\sqrt2\approx25{,}0\ \text{cm}\). Pour \(^{24}\text{Mg}^{2+}\), \(m/q=24\,u/(2e)=12\,u/e\), comme \(^{12}\text{C}^{+}\) : même impact, à 35,3 cm. Le spectromètre mesure le rapport \(m/q\), pas la masse ; il faut connaître la charge pour conclure.</p>
    <p><strong>Q5.</strong> \(x\propto\sqrt m\), donc \(\dfrac{\Delta x}{x}=\dfrac12\dfrac{\Delta m}{m}\), soit \(\dfrac{\Delta m}{m}=\dfrac{2\Delta x}{x}=\dfrac{2\times0{,}1}{35{,}3}\approx6\times10^{-3}\) : environ \(0{,}07\,u\) au voisinage de \(12\,u\). Les deux isotopes, séparés de 1,4 cm, sont donc très bien résolus.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Déviation magnétique d'un faisceau d'électrons</h3>
  <div class="statement">Des électrons accélérés depuis le repos par une tension \(U_a=2{,}5\ \text{kV}\) entrent en \(O\), avec la vitesse \(\vec v_0=v_0\,\vec e_x\), perpendiculairement au bord d'une zone de largeur \(\ell=3{,}0\ \text{cm}\) (de \(x=0\) à \(x=\ell\)) où règne le champ uniforme \(\vec B=-B\,\vec e_z\), \(B=1{,}0\ \text{mT}\) : pour un observateur qui regarde la feuille, \(\vec e_x\) est vers la droite, \(\vec e_y\) vers le haut et \(\vec B\) vers le fond (⊗). Un écran est placé à la distance \(D=25\ \text{cm}\) du bord de sortie. Données : \(e=1{,}602\times10^{-19}\ \text{C}\), \(m_e=9{,}109\times10^{-31}\ \text{kg}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(v_0\) et le rayon \(R\) de la trajectoire dans le champ. Le comparer à \(\ell\).</div>
  <div class="q"><strong>Q2.</strong> Le faisceau est-il dévié vers le haut ou vers le bas ?</div>
  <div class="q"><strong>Q3.</strong> Calculer l'angle de déviation \(\theta\) à la sortie de la zone et le décalage \(h\) du point de sortie par rapport à l'axe \(Ox\).</div>
  <div class="q"><strong>Q4.</strong> En déduire la position \(Y\) du spot sur l'écran.</div>
  <div class="q"><strong>Q5.</strong> Quelle valeur minimale de \(B\) renverrait les électrons vers l'arrière ? Où ressortiraient-ils, et au bout de combien de temps ?</div>
  <div class="q"><strong>Q6.</strong> Des protons accélérés sous la même tension (polarité inversée) seraient-ils déviés de la même façon ? Comparer avec la déviation électrique de l'exercice 4.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v_0=\sqrt{2eU_a/m_e}\approx2{,}97\times10^{7}\ \text{m·s}^{-1}\) (0,1 \(c\) : le calcul classique convient). \(R=\dfrac{m_ev_0}{eB}\approx0{,}169\ \text{m}=16{,}9\ \text{cm}\gt\ell\) : l'électron traverse la zone sans faire demi-tour.</p>
    <p><strong>Q2.</strong> La force à l'entrée vaut</p>
    <div class="formula">$$\vec F=(-e)\,v_0\vec e_x\wedge(-B\,\vec e_z)=ev_0B\,(\vec e_x\wedge\vec e_z)=-ev_0B\,\vec e_y$$</div>
    <p>Elle est dirigée vers le <strong>bas</strong>. Contrôle par la règle : une charge négative tourne dans le sens horaire pour un observateur dont \(\vec B\) s'éloigne ; partant vers la droite, elle s'incurve vers le bas.</p>
    <p><strong>Q3.</strong> Le centre est en \(C(0,\,-R)\), sur le bord d'entrée. La sortie a lieu en \(x=\ell\) : \(\sin\theta=\ell/R\approx0{,}178\), donc \(\theta\approx10{,}2°\). Le point de sortie est en \(y=-(R-R\cos\theta)\), soit un décalage \(h=R\,(1-\cos\theta)\approx2{,}7\ \text{mm}\) vers le bas.</p>
    <p><strong>Q4.</strong> Au-delà, le champ est nul et le mouvement rectiligne uniforme, dans la direction de la vitesse de sortie : \(Y=h+D\tan\theta\), avec \(D\tan\theta=0{,}25\times0{,}181\approx4{,}5\ \text{cm}\), soit \(Y\approx4{,}8\ \text{cm}\) sous l'axe.</p>
    <p><strong>Q5.</strong> Il faut \(R\le\ell\), soit \(B\ge\dfrac{m_ev_0}{e\ell}\approx5{,}6\ \text{mT}\). Les électrons font alors un demi-tour et ressortent par le bord d'entrée, à la distance \(2R\le6{,}0\ \text{cm}\) sous \(O\), au bout de \(T/2=\pi m_e/(eB)\approx3{,}2\ \text{ns}\) (pour \(B=5{,}6\ \text{mT}\)).</p>
    <p><strong>Q6.</strong> Non. Le rayon \(R=\dfrac1B\sqrt{\dfrac{2mU_a}{e}}\) dépend de la masse : pour des protons, il serait \(\sqrt{1836}\approx43\) fois plus grand (7,2 m), la déviation presque nulle et de sens opposé. La déviation électrique, \(\tan\alpha=UL/(2dU_a)\), est au contraire la même pour toutes les particules accélérées sous la même tension. C'est pourquoi on trie les masses avec un champ magnétique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Filtre de Wien, puis tri des isotopes du lithium</h3>
  <div class="statement">Une source émet des ions \(^6\text{Li}^+\) et \(^7\text{Li}^+\) (charge \(q=e\)) de vitesses variées, qui se déplacent selon \(+\vec e_x\). Ils traversent d'abord un <strong>filtre de Wien</strong> : une zone où règnent les champs uniformes \(\vec E=E\,\vec e_y\) et \(\vec B=B\,\vec e_z\), avec \(E=1{,}5\times10^{4}\ \text{V·m}^{-1}\) et \(B=0{,}030\ \text{T}\) ; une fente placée sur l'axe \(Ox\), à la sortie, ne laisse passer que les ions qui n'ont pas été déviés. Ils pénètrent ensuite dans une zone où règne seulement \(\vec B'=B'\,\vec e_z\), \(B'=0{,}30\ \text{T}\), où ils décrivent un demi-cercle avant de frapper un détecteur. Masses : \(6{,}015\,u\) et \(7{,}016\,u\), avec \(u=1{,}66\times10^{-27}\ \text{kg}\) ; \(e=1{,}6\times10^{-19}\ \text{C}\) ; poids négligé.</div>
  <div class="q"><strong>Q1.</strong> Écrire la force subie dans le filtre par un ion de vitesse \(v\,\vec e_x\). Pour quelle vitesse \(v_0\) l'ion n'est-il pas dévié ? Dépend-elle de la masse ? de la charge ?</div>
  <div class="q"><strong>Q2.</strong> Vers quel côté (\(+\vec e_y\) ou \(-\vec e_y\)) les ions plus rapides que \(v_0\) commencent-ils à être déviés ? Et les plus lents ?</div>
  <div class="q"><strong>Q3.</strong> Exprimer le rayon \(R\) de la trajectoire dans la seconde zone en fonction de \(m\), \(q\), \(E\), \(B\) et \(B'\). Calculer \(R\) pour chaque isotope et l'écart entre les deux impacts. De quel côté de l'axe les ions tournent-ils ?</div>
  <div class="q"><strong>Q4.</strong> Dans un spectromètre sans filtre, les ions seraient accélérés depuis le repos sous une tension \(U\), puis déviés. Montrer que le filtre double l'écart relatif des rayons des deux isotopes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec F=q\left(E\,\vec e_y+v\,\vec e_x\wedge B\,\vec e_z\right)=q\,(E-vB)\,\vec e_y\), car \(\vec e_x\wedge\vec e_z=-\vec e_y\). Si \(\vec F=\vec 0\) à l'entrée, la vitesse ne change pas, la force reste nulle et le mouvement est rectiligne uniforme : l'ion n'est pas dévié si et seulement si</p>
    <div class="formula">$$v_0=\frac EB=\frac{1{,}5\times10^{4}}{0{,}030}=5{,}0\times10^{5}\ \text{m·s}^{-1}$$</div>
    <p>Cette vitesse ne dépend ni de la masse ni de la charge (ni même de son signe, les deux forces changeant de sens ensemble).</p>
    <p><strong>Q2.</strong> Pour \(v\gt v_0\), \(E-vB\lt0\) : la force magnétique l'emporte et l'ion (positif) part vers \(-\vec e_y\). Pour \(v\lt v_0\), la force électrique l'emporte : déviation vers \(+\vec e_y\). Dans les deux cas, l'ion manque la fente.</p>
    <p><strong>Q3.</strong> Dans la seconde zone, mouvement circulaire uniforme à la vitesse \(v_0\) (on y entre perpendiculairement à \(\vec B'\)) :</p>
    <div class="formula">$$R=\frac{mv_0}{qB'}=\frac{m\,E}{q\,B\,B'}$$</div>
    <p>\(^6\text{Li}^+\) : \(m=9{,}98\times10^{-27}\ \text{kg}\), \(R_6\approx10{,}4\ \text{cm}\) ; \(^7\text{Li}^+\) : \(m=1{,}165\times10^{-26}\ \text{kg}\), \(R_7\approx12{,}1\ \text{cm}\). Les impacts, aux distances \(2R\) de l'entrée, sont séparés de \(2(R_7-R_6)\approx3{,}5\ \text{cm}\). En entrant, \(\vec F=qv_0B'\,(\vec e_x\wedge\vec e_z)=-qv_0B'\,\vec e_y\) : les centres sont du côté \(-\vec e_y\), et les ions tournent dans le sens horaire pour un observateur vers qui \(\vec B'\) pointe.</p>
    <p><strong>Q4.</strong> Avec le filtre, tous les ions ont la même vitesse et \(R\propto m\) : \(\dfrac{R_7}{R_6}=\dfrac{7{,}016}{6{,}015}\approx1{,}166\), soit un écart relatif de 16,6 %. Sans filtre, tous les ions ont la même énergie \(qU\) et \(R=\dfrac1{B'}\sqrt{\dfrac{2mU}{q}}\propto\sqrt m\) : \(\dfrac{R_7}{R_6}=\sqrt{1{,}166}\approx1{,}080\), un écart de 8,0 %. Pour des masses voisines, \(\dfrac{\Delta R}{R}=\dfrac{\Delta m}{m}\) dans le premier cas et \(\dfrac12\dfrac{\Delta m}{m}\) dans le second : le filtre double la dispersion.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Cyclotron : énergie, nombre de tours, rayons successifs</h3>
  <div class="statement">Un cyclotron accélère des protons (\(e=1{,}6\times10^{-19}\ \text{C}\), \(m_p=1{,}67\times10^{-27}\ \text{kg}\)) dans un champ \(B=1{,}0\ \text{T}\) ; le rayon des D vaut \(R=0{,}50\ \text{m}\). À chaque traversée de l'intervalle entre les D, la tension accélératrice vaut \(U=50\ \text{kV}\) ; on néglige la durée de ces traversées. Les protons partent du centre avec une vitesse négligeable.</div>
  <div class="q"><strong>Q1.</strong> Montrer que la durée d'un demi-tour dans un D ne dépend pas de la vitesse. En déduire la fréquence \(f\) de la tension alternative.</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse maximale et l'énergie cinétique maximale des protons, en joules et en MeV.</div>
  <div class="q"><strong>Q3.</strong> Combien de passages entre les D, et donc de tours, faut-il ? Combien de temps dure l'accélération ?</div>
  <div class="q"><strong>Q4.</strong> Exprimer le rayon \(R_n\) du demi-cercle décrit après le \(n\)-ième passage. Calculer \(R_1\) et vérifier la cohérence avec Q3.</div>
  <div class="q"><strong>Q5.</strong> (Formule fournie, hors programme en PTSI.) En tenant compte de la relativité, la période devient \(2\pi\gamma m_p/(eB)\), avec \(\gamma\approx1+E_c/(m_pc^2)\) et \(m_pc^2=938\ \text{MeV}\). Estimer l'écart relatif de période en fin d'accélération. Pourquoi est-ce gênant ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Dans un D, le champ électrique est nul : le proton, de vitesse orthogonale à \(\vec B\), décrit un demi-cercle à vitesse constante, de rayon \(r=m_pv/(eB)\), en \(\dfrac{\pi r}{v}=\dfrac{\pi m_p}{eB}\), indépendamment de \(v\). La tension doit changer de signe à chaque demi-tour pour accélérer le proton à chaque passage : sa période est \(T=2\pi m_p/(eB)\), sa fréquence</p>
    <div class="formula">$$f=\frac{eB}{2\pi m_p}=\frac{1{,}6\times10^{-19}\times1{,}0}{2\pi\times1{,}67\times10^{-27}}\approx15{,}2\ \text{MHz}$$</div>
    <p><strong>Q2.</strong> Le proton sort quand son rayon atteint \(R\) : \(v_{\max}=\dfrac{eBR}{m_p}\approx4{,}79\times10^{7}\ \text{m·s}^{-1}\) (0,16 \(c\)) et</p>
    <div class="formula">$$E_{c,\max}=\frac{(eBR)^2}{2m_p}\approx1{,}92\times10^{-12}\ \text{J}\approx12{,}0\ \text{MeV}$$</div>
    <p>Cette énergie ne dépend pas de \(U\).</p>
    <p><strong>Q3.</strong> Chaque passage apporte \(eU=50\ \text{keV}\) : \(N=\dfrac{12{,}0\ \text{MeV}}{50\ \text{keV}}=240\) passages, soit 120 tours (deux passages par tour). Durée : \(120\,T=120/f\approx7{,}9\ \mu\text{s}\).</p>
    <p><strong>Q4.</strong> Après \(n\) passages, \(E_c=neU\), donc \(v_n=\sqrt{2neU/m_p}\) et</p>
    <div class="formula">$$R_n=\frac{m_pv_n}{eB}=\frac1B\sqrt{\frac{2nm_pU}{e}}=R_1\sqrt n$$</div>
    <p>avec \(R_1\approx3{,}23\ \text{cm}\). Pour \(n=240\) : \(R_{240}=3{,}23\times\sqrt{240}\approx50\ \text{cm}=R\), cohérent avec Q3. Les demi-cercles se resserrent quand \(n\) croît : \(R_{n+1}-R_n\approx R_1/(2\sqrt n)\), soit environ 1 mm à la fin.</p>
    <p><strong>Q5.</strong> En fin d'accélération, \(\gamma-1\approx12/938\approx1{,}3\ \%\) : la période est allongée de 1,3 %, et de moins au début. À chaque tour, le proton arrive un peu plus tard par rapport à la tension ; ces retards s'accumulent sur 120 tours, jusqu'à près d'une période (environ \(1{,}3\ \%\times120/2\approx0{,}8\,T\)) : le proton finirait par traverser l'intervalle quand la tension le freine. Les cyclotrons réels compensent en augmentant légèrement \(B\) vers la périphérie ; au-delà de quelques dizaines de MeV, on change de machine (synchrotron).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Mesure du rapport e/m de l'électron par des champs croisés</h3>
  <div class="statement">Un faisceau d'électrons, accéléré par une tension \(U_a\) inconnue, entre en \(O\) selon \(+\vec e_x\), à mi-distance de deux plaques horizontales de longueur \(L=5{,}0\ \text{cm}\), distantes de \(d=1{,}5\ \text{cm}\) ; \(\vec e_y\) est vertical vers le haut, \(\vec e_z\) dirigé vers l'observateur. La plaque supérieure est au potentiel le plus élevé ; la tension entre les plaques vaut \(U=150\ \text{V}\). Des bobines créent entre les plaques un champ magnétique uniforme de direction \(\vec e_z\), de norme réglable.</div>
  <div class="q"><strong>Q1.</strong> Sans champ magnétique, dans quel sens le faisceau est-il dévié ? On mesure à la sortie des plaques une déviation \(\delta=3{,}5\ \text{mm}\). Exprimer \(\delta\) en fonction de \(e/m\), \(U\), \(d\), \(L\) et de la vitesse d'entrée \(v_0\).</div>
  <div class="q"><strong>Q2.</strong> On établit le champ magnétique et on règle sa norme jusqu'à ce que le faisceau ne soit plus dévié ; on lit alors \(B=0{,}40\ \text{mT}\). Quel doit être le sens de \(\vec B\) ? En déduire \(v_0\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(e/m\), puis la tension d'accélération \(U_a\).</div>
  <div class="q"><strong>Q4.</strong> La déviation est mesurée à \(\pm0{,}1\ \text{mm}\) ; les autres grandeurs sont connues avec une bien meilleure précision. Estimer l'incertitude relative sur \(e/m\) et comparer à la valeur tabulée \(1{,}759\times10^{11}\ \text{C·kg}^{-1}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec E=-\dfrac Ud\,\vec e_y\), de norme \(E=1{,}0\times10^{4}\ \text{V·m}^{-1}\) ; la force \(-e\vec E\) est dirigée vers le haut : le faisceau est dévié vers la plaque positive. Comme dans un oscilloscope (exercice 4), \(\delta=\dfrac{eEL^2}{2mv_0^2}=\dfrac em\,\dfrac{UL^2}{2dv_0^2}\).</p>
    <p><strong>Q2.</strong> La force magnétique doit compenser la force électrique, donc être dirigée vers le bas. Avec \(\vec B=B_z\,\vec e_z\) : \(-ev_0\,\vec e_x\wedge B_z\vec e_z=ev_0B_z\,\vec e_y\), qui est dirigée vers le bas si \(B_z\lt0\) : \(\vec B\) doit être dirigé vers le fond (⊗). L'équilibre \(eE=ev_0B\) donne la vitesse, sans connaître \(e/m\) :</p>
    <div class="formula">$$v_0=\frac EB=\frac{1{,}0\times10^{4}}{4{,}0\times10^{-4}}=2{,}5\times10^{7}\ \text{m·s}^{-1}$$</div>
    <p><strong>Q3.</strong> D'après Q1 :</p>
    <div class="formula">$$\frac em=\frac{2\delta v_0^2}{EL^2}=\frac{2\times3{,}5\times10^{-3}\times(2{,}5\times10^{7})^2}{1{,}0\times10^{4}\times0{,}050^2}\approx1{,}75\times10^{11}\ \text{C·kg}^{-1}$$</div>
    <p>L'accélération donne \(eU_a=\tfrac12mv_0^2\), soit \(U_a=\dfrac{v_0^2}{2\,e/m}\approx1{,}8\ \text{kV}\).</p>
    <p><strong>Q4.</strong> \(e/m\) est proportionnel à \(\delta\) : l'incertitude relative vaut \(0{,}1/3{,}5\approx3\ \%\), soit \(e/m=(1{,}75\pm0{,}05)\times10^{11}\ \text{C·kg}^{-1}\). La valeur tabulée est dans cet intervalle (écart de 0,5 %). Le principe de la mesure : le champ magnétique sert à mesurer la vitesse, le champ électrique seul fournit ensuite une déviation qui dépend de \(e/m\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un implanteur ionique pour la microélectronique</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>particules chargées : accélération, tri magnétique, déviation électrostatique, bilans d'énergie</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Pour doper une plaquette de silicium au bore, on y implante des ions \(^{11}\text{B}^+\). La source produit, à partir de trifluorure de bore, un mélange d'ions de charge \(e\) : \(^{10}\text{B}^+\), \(^{11}\text{B}^+\) et \(\text{BF}_2^{\,+}\). Le faisceau est accéléré, trié par un aimant, puis balayé sur la plaquette par des plaques de déviation.
    <br>Données : \(e=1{,}602\times10^{-19}\ \text{C}\) ; \(u=1{,}661\times10^{-27}\ \text{kg}\) ; masses \(m(^{10}\text{B}^+)=10{,}013\,u\), \(m(^{11}\text{B}^+)=11{,}009\,u\), \(m(\text{BF}_2^{\,+})=49{,}005\,u\) ; \(g=9{,}81\ \text{m·s}^{-2}\) ; \(c=3{,}00\times10^{8}\ \text{m·s}^{-1}\). On travaille dans le référentiel du laboratoire, supposé galiléen.
  </div>

  <p class="exo-part">Partie A — Extraction et accélération</p>
  <div class="q"><strong>A1.</strong> Les ions sortent de la source avec une vitesse négligeable et sont accélérés entre deux électrodes planes distantes de \(2{,}0\ \text{cm}\), sous la tension \(U_0=40\ \text{kV}\). Comparer la force électrique et le poids d'un ion \(^{11}\text{B}^+\). Quelle est la nature du mouvement pendant l'accélération ?</div>
  <div class="q"><strong>A2.</strong> Quelle électrode doit être au potentiel le plus élevé ? Calculer l'énergie cinétique (en keV et en joules) et la vitesse d'un ion \(^{11}\text{B}^+\) à la sortie. La mécanique classique est-elle justifiée ?</div>
  <div class="q"><strong>A3.</strong> Comparer les énergies cinétiques et les vitesses des trois sortes d'ions. Une déviation électrique permettrait-elle de les trier ?</div>

  <p class="exo-part">Partie B — Analyse magnétique</p>
  <div class="statement">Les ions entrent en \(O\), avec la vitesse \(v\,\vec e_x\), dans une zone où règne un champ uniforme \(\vec B=B\,\vec e_z\) (\(B\gt0\), dirigé vers le lecteur). Cette zone est limitée par le plan \(y=-R_0\), avec \(R_0=0{,}50\ \text{m}\), et elle est assez étendue dans les autres directions. Une fente de largeur \(10\ \text{mm}\), percée dans ce plan, est centrée au point \((R_0,\,-R_0)\).</div>

  <div class="q"><strong>B1.</strong> Montrer que les ions \(^{11}\text{B}^+\) décrivent dans cette zone un arc de cercle ; préciser la position du centre et le sens de parcours.</div>
  <div class="q"><strong>B2.</strong> Montrer que les ions \(^{11}\text{B}^+\) franchissent la fente, perpendiculairement au plan \(y=-R_0\), si le rayon de leur trajectoire vaut \(R_0\). Calculer la valeur de \(B\) correspondante. Avec quelle vitesse sortent-ils ?</div>
  <div class="q"><strong>B3.</strong> Calculer les rayons des trajectoires des ions \(^{10}\text{B}^+\) et \(\text{BF}_2^{\,+}\) dans le même champ.</div>
  <div class="q"><strong>B4.</strong> Déterminer l'abscisse des points où ces ions atteignent le plan \(y=-R_0\). Sont-ils arrêtés ?</div>
  <div class="q"><strong>B5.</strong> Pour deux masses voisines \(m\) et \(m+\Delta m\), montrer que l'écart de leurs points d'arrivée sur le plan de la fente vaut approximativement \(R_0\,\Delta m/(2m)\). Quel écart relatif de masse minimal la fente permet-elle d'éliminer ?</div>

  <p class="exo-part">Partie C — Balayage électrostatique</p>
  <div class="statement">Après la fente, le faisceau de \(^{11}\text{B}^+\) passe à mi-distance entre deux plaques parallèles à sa vitesse, de longueur \(L=10\ \text{cm}\), distantes de \(d=2{,}0\ \text{cm}\), entre lesquelles on applique une tension de balayage \(u\). Il parcourt ensuite, sans champ, jusqu'à la plaquette, la distance \(D=1{,}0\ \text{m}\) comptée depuis le milieu des plaques.</div>
  <div class="q"><strong>C1.</strong> Montrer que le déplacement du point d'impact sur la plaquette vaut \(Y=\dfrac{DLu}{2dU_0}\). Pourquoi est-il important qu'il ne dépende ni de la masse ni de la charge ?</div>
  <div class="q"><strong>C2.</strong> La plaquette a un diamètre de 300 mm. Quelle amplitude \(u_{\max}\) faut-il pour la balayer d'un bord à l'autre ? Les ions touchent-ils les plaques ?</div>
  <div class="q"><strong>C3.</strong> La tension de balayage varie à la fréquence de 1 kHz. Calculer la durée de traversée des plaques et justifier que l'on puisse considérer \(u\) comme constante pendant cette traversée.</div>

  <p class="exo-part">Partie D — Dose et échauffement</p>
  <div class="q"><strong>D1.</strong> Le faisceau transporte un courant \(I=2{,}0\ \text{mA}\). Combien d'ions par seconde arrivent sur la plaquette ?</div>
  <div class="q"><strong>D2.</strong> On veut implanter une dose de \(1{,}0\times10^{15}\) ions par \(\text{cm}^2\), uniformément sur toute la plaquette. Quelle est la durée de l'implantation ?</div>
  <div class="q"><strong>D3.</strong> Quelle puissance le faisceau dépose-t-il dans la plaquette ? L'aimant d'analyse a-t-il fourni de l'énergie aux ions ? Commenter.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Le champ vaut \(E=U_0/\ell=2{,}0\times10^{6}\ \text{V·m}^{-1}\), donc \(eE=3{,}2\times10^{-13}\ \text{N}\). La masse vaut \(m=11{,}009\,u=1{,}829\times10^{-26}\ \text{kg}\) et le poids \(1{,}8\times10^{-25}\ \text{N}\) : rapport \(\approx2\times10^{12}\), le poids est négligeable. La force électrique est alors constante (champ uniforme) et l'ion part du repos : mouvement rectiligne uniformément accéléré, selon \(\vec E\).</p>
    <p><strong>A2.</strong> Un ion positif accélère vers les potentiels décroissants : l'électrode de la source est portée à \(+40\ \text{kV}\), l'électrode de sortie à 0 (la masse de l'installation). Théorème de l'énergie cinétique : \(E_c=eU_0=40\ \text{keV}=6{,}4\times10^{-15}\ \text{J}\) et \(v=\sqrt{2eU_0/m}\approx8{,}37\times10^{5}\ \text{m·s}^{-1}\), soit \(2{,}8\times10^{-3}\,c\) : la mécanique classique est largement justifiée.</p>
    <p><strong>A3.</strong> Les trois ions, de même charge, gagnent la même énergie, 40 keV. Leurs vitesses varient en \(1/\sqrt m\) : \(8{,}78\times10^{5}\ \text{m·s}^{-1}\) pour \(^{10}\text{B}^+\), \(8{,}37\times10^{5}\) pour \(^{11}\text{B}^+\), \(3{,}97\times10^{5}\) pour \(\text{BF}_2^{\,+}\). Une déviation électrique d'ions accélérés sous la même tension ne dépend que de cette tension, pas de la masse (cours, §4) : elle ne trie pas. D'où l'aimant.</p>
    <p><strong>B1.</strong> Dans la zone, \(\vec E=\vec 0\) et \(\vec v\perp\vec B\) : le mouvement est circulaire uniforme, dans le plan \(z=0\), de rayon \(R=mv/(eB)\) (cours, §6). En \(O\), \(\vec F=evB\,(\vec e_x\wedge\vec e_z)=-evB\,\vec e_y\) : le centre est en \(C(0,\,-R)\). Les ions partent selon \(+\vec e_x\) en tournant autour de \(C\) : sens horaire pour le lecteur, vers qui \(\vec B\) est dirigé.</p>
    <p><strong>B2.</strong> Si \(R=R_0\), le cercle de centre \(C(0,\,-R_0)\) passe par \((R_0,\,-R_0)\), son point le plus à droite, où la vitesse est \(-v\,\vec e_y\), orthogonale au plan de la fente : après un quart de tour, les ions la traversent en son centre. Avec \(R_0=\dfrac1B\sqrt{\dfrac{2mU_0}{e}}\) :</p>
    <div class="formula">$$B=\frac1{R_0}\sqrt{\frac{2mU_0}{e}}=\frac1{0{,}50}\sqrt{\frac{2\times1{,}829\times10^{-26}\times4{,}0\times10^{4}}{1{,}602\times10^{-19}}}\approx0{,}191\ \text{T}$$</div>
    <p>Le champ magnétique ne travaille pas : les ions sortent avec la même vitesse \(8{,}37\times10^{5}\ \text{m·s}^{-1}\), dirigée selon \(-\vec e_y\).</p>
    <p><strong>B3.</strong> À \(B\) et \(U_0\) fixés, \(R\propto\sqrt m\) : \(R_{10}=R_0\sqrt{10{,}013/11{,}009}\approx0{,}477\ \text{m}\) et \(R_{\text{BF}_2}=R_0\sqrt{49{,}005/11{,}009}\approx1{,}055\ \text{m}\).</p>
    <p><strong>B4.</strong> Un ion de rayon \(R\) décrit le cercle \(x^2+(y+R)^2=R^2\) ; il atteint le plan \(y=-R_0\) en \(x=\sqrt{R^2-(R-R_0)^2}=\sqrt{2RR_0-R_0^2}\). Pour \(^{10}\text{B}^+\) : \(x\approx0{,}476\ \text{m}\), à 2,4 cm du centre de la fente, bien au-delà de sa demi-largeur (5 mm) : ces ions sont arrêtés. Pour \(\text{BF}_2^{\,+}\) : \(x\approx0{,}897\ \text{m}\), à 40 cm : arrêtés aussi.</p>
    <p><strong>B5.</strong> \(x(R)=\sqrt{2RR_0-R_0^2}\), donc \(\dfrac{\mathrm{d}x}{\mathrm{d}R}=\dfrac{R_0}{x}=1\) en \(R=R_0\) : \(\Delta x\approx\Delta R\). Comme \(R\propto\sqrt m\), \(\dfrac{\Delta R}{R_0}=\dfrac12\dfrac{\Delta m}{m}\), d'où \(\Delta x\approx R_0\dfrac{\Delta m}{2m}\). Un ion est arrêté si \(\Delta x\) dépasse la demi-largeur, 5 mm : \(\dfrac{\Delta m}{m}\gt\dfrac{2\times5\ \text{mm}}{500\ \text{mm}}=2\ \%\). L'écart entre \(^{10}\text{B}\) et \(^{11}\text{B}\), 9 %, est largement suffisant.</p>
    <p><strong>C1.</strong> Comme au §4 du cours, entre les plaques le mouvement est à accélération constante \(eu/(md)\), et à la sortie \(\tan\alpha=\dfrac{euL}{mdv^2}\) ; la droite de sortie prolongée passe par le milieu des plaques, donc \(Y=D\tan\alpha\). Avec \(mv^2=2eU_0\) : \(Y=\dfrac{DLu}{2dU_0}\). Ce déplacement ne dépend que des tensions et des longueurs : le balayage ne trie ni n'étale à nouveau les ions selon leur masse, et la même loi \(Y(u)\) vaut pour toute espèce accélérée sous \(U_0\), ce qui facilite le réglage.</p>
    <p><strong>C2.</strong> Il faut \(Y=\pm0{,}15\ \text{m}\) :</p>
    <div class="formula">$$u_{\max}=\frac{2dU_0Y}{DL}=\frac{2\times0{,}020\times4{,}0\times10^{4}\times0{,}15}{1{,}0\times0{,}10}=2{,}4\ \text{kV}$$</div>
    <p>À la sortie des plaques, \(\delta=\dfrac L2\,\dfrac YD=7{,}5\ \text{mm}\), moins que \(d/2=10\ \text{mm}\) : les ions passent, avec une marge faible.</p>
    <p><strong>C3.</strong> \(\tau=L/v=0{,}10/(8{,}37\times10^{5})\approx1{,}2\times10^{-7}\ \text{s}\), à comparer à la période du balayage, \(10^{-3}\ \text{s}\) : la tension varie de façon négligeable pendant la traversée, et chaque ion voit une tension constante (approximation quasi statique).</p>
    <p><strong>D1.</strong> Chaque ion porte la charge \(e\) : \(\dfrac{I}{e}=\dfrac{2{,}0\times10^{-3}}{1{,}602\times10^{-19}}\approx1{,}25\times10^{16}\) ions par seconde.</p>
    <p><strong>D2.</strong> Aire : \(\pi\times15^2\approx707\ \text{cm}^2\), donc \(N=7{,}1\times10^{17}\) ions, implantés en \(N/(I/e)\approx57\ \text{s}\), environ une minute.</p>
    <p><strong>D3.</strong> Chaque ion apporte \(eU_0\) : \(\mathcal P=\dfrac Ie\,eU_0=IU_0=80\ \text{W}\), concentrés sur une plaquette mince : il faut la refroidir. L'aimant n'a fourni aucune énergie (la force magnétique a une puissance nulle) : il n'a fait que dévier les ions. Toute l'énergie déposée vient de l'alimentation haute tension, qui fournit \(IU_0\).</p>
