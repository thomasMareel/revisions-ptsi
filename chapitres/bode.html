<!-- ============ RÉPONSE FRÉQUENTIELLE ET BODE : COURS ============ -->
<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la <strong>réponse fréquentielle</strong> des systèmes linéaires continus et invariants, au programme du semestre S2 de sciences industrielles (compétences B2 « Modéliser », C2 « Résoudre », D2 « Expérimenter »). <strong>Tout y est exigible en 1ʳᵉ année</strong>, sauf la dernière section. Il s'appuie sur <a href="#slci/cours">« SLCI : modélisation et transformée de Laplace »</a> (fonction de transfert, forme canonique, classe) et sur la réponse fréquentielle de chaque modèle, vue dans <a href="#sys1/cours">« Systèmes du 1er ordre »</a> (§4) et <a href="#sys2/cours">« Systèmes du 2e ordre »</a> (§3). Il prépare <a href="#stabilite/cours">« Stabilité des systèmes asservis »</a>, où les marges se lisent sur le Bode de la boucle ouverte, et <a href="#precision/cours">« Performances : précision et rapidité »</a> (bande passante).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Modéliser le signal d'entrée</strong> (B2, S1) : signaux périodiques, en particulier l'entrée sinusoïdale (§1).</li>
        <li><strong>Déterminer la réponse temporelle</strong> (C2, S1) : allure de la réponse à une entrée sinusoïdale en régime permanent (§1).</li>
        <li><strong>Déterminer la réponse fréquentielle</strong> (C2, S2) : allures des diagrammes réel et asymptotique de Bode. Briques élémentaires (§2), tracé asymptotique (§3), courbe réelle et calcul exact du gain et de la phase, aussi par un programme Python (§4), deuxième ordre (§6), retard pur (§7).</li>
        <li><strong>Établir un modèle de comportement à partir d'une réponse fréquentielle</strong> (B2, S2) : premier ordre, deuxième ordre, dérivateur, intégrateur, gain et retard ; paramètres caractéristiques ; diagramme de Bode (§2, §5, §6, §7).</li>
        <li><strong>Rapidité d'un système : bande passante</strong> (C2, S2) : définition et lecture (§5), bande passante d'une boucle fermée lue sur la boucle ouverte (§8).</li>
        <li><strong>Choisir les entrées à imposer et les sorties à mesurer pour identifier un modèle de comportement</strong> (D2, S2) et <strong>vérifier la cohérence d'un modèle</strong> en le confrontant à des mesures (B3, S2) : relevé d'une réponse fréquentielle (§9).</li>
      </ul>
      <p>Hors programme (dernière section) : les lieux de Black-Nichols et de Nyquist, exclus des programmes des deux années. Le réglage des correcteurs, dont le correcteur à avance de phase, relève de la 2ᵉ année (<a href="#correcteurs/cours">« Correction des SLCI »</a>).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LA RÉPONSE HARMONIQUE</div>
  <h2>Exciter un système à toutes les fréquences</h2>
  <div class="intro">La réponse indicielle montre comment un système démarre ; la réponse fréquentielle montre comment il traite chaque fréquence. Elle se mesure simplement (un générateur de sinusoïdes, deux voies d'oscilloscope), elle s'additionne bloc par bloc, et c'est sur elle que l'on lit la stabilité d'une boucle et que l'on règle les correcteurs.</div>
  <div class="def-box">
    Un SLCI stable soumis à \(e(t) = E_m\sin(\omega t)\) répond, une fois le régime transitoire éteint, par \(s(t) = S_m\sin(\omega t + \varphi)\), de même pulsation, avec
    <div class="formula" data-nom="Réponse harmonique">$$\frac{S_m}{E_m} = |H(j\omega)|,\qquad \varphi = \arg H(j\omega),$$</div>
    où \(H(j\omega)\) est la fonction de transfert évaluée en \(p = j\omega\). Le <strong>diagramme de Bode</strong> représente, en fonction de \(\omega\) en échelle logarithmique, le <strong>gain en décibels</strong> \(G_{dB}(\omega) = 20\log|H(j\omega)|\) et la <strong>phase</strong> \(\varphi(\omega)\).
  </div>
  <div class="prop-box">
    <strong>Pourquoi des décibels et une échelle logarithmique ?</strong> Le logarithme transforme les produits en sommes : pour \(H = H_1H_2\), \(G_{dB} = G_{1,dB} + G_{2,dB}\) et \(\varphi = \varphi_1 + \varphi_2\). Le Bode d'une chaîne de blocs est la <strong>somme</strong> des Bode de ses blocs. L'échelle logarithmique donne la même place à chaque <strong>décade</strong> (pulsation multipliée par 10) et transforme les comportements en puissance de \(\omega\) en droites.
  </div>
  <div style="overflow-x:auto"><table>
    <tr><th>Rapport d'amplitudes</th><th>100</th><th>10</th><th>2</th><th>\(\sqrt2\)</th><th>1</th><th>\(1/\sqrt2\)</th><th>0,5</th><th>0,1</th><th>0,01</th></tr>
    <tr><td>Gain en dB</td><td>+40</td><td>+20</td><td>+6</td><td>+3</td><td>0</td><td>−3</td><td>−6</td><td>−20</td><td>−40</td></tr>
  </table></div>
  <p>Une pente de \(-20\) dB par décade signifie que l'amplitude est divisée par 10 chaque fois que la pulsation est multipliée par 10 : le gain varie comme \(1/\omega\). Une pente de \(-40\) dB par décade correspond à \(1/\omega^2\).</p>
  <p>Le déphasage se voit aussi dans le temps : une phase \(\varphi \lt 0\) est un <strong>retard</strong> de la sortie sur l'entrée, de durée \(\Delta t = -\varphi/\omega\) (phase en radians), soit une fraction \(|\varphi|/360°\) de la période.</p>
  <div class="method-box">
    <strong>Exemple — la réponse d'un premier ordre à une sinusoïde</strong>
    <p>\(H(p) = \dfrac{5}{1 + 0{,}2p}\) reçoit \(e(t) = 2\sin(10t)\) (\(t\) en secondes).</p>
    <ol>
      <li>En \(p = 10j\) : \(H(10j) = \dfrac{5}{1 + 2j}\), de module \(\dfrac{5}{\sqrt{1 + 4}} \approx 2{,}24\) (soit 7,0 dB) et d'argument \(-\arctan 2 \approx -63{,}4°\).</li>
      <li>En régime permanent : \(s(t) = 4{,}47\sin(10t - 1{,}107)\), la phase étant convertie en radians.</li>
      <li>Retard de la sortie : \(\Delta t = 1{,}107/10 \approx 0{,}11\ \text{s}\), soit 18 % de la période \(2\pi/10 \approx 0{,}63\ \text{s}\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · LES BRIQUES ÉLÉMENTAIRES</div>
  <h2>Le Bode de chaque brique</h2>
  <div class="intro">Toute fonction de transfert rationnelle se factorise en un petit nombre de briques. Connaître leur Bode par cœur, c'est savoir tracer n'importe quel diagramme par addition.</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Brique</th><th>Gain</th><th>Phase</th></tr>
    <tr><td>Gain pur \(K \gt 0\)</td><td>horizontale à \(20\log K\)</td><td>0°</td></tr>
    <tr><td>Intégrateur \(\dfrac{1}{p}\)</td><td>droite de pente \(-20\) dB/déc, 0 dB en \(\omega = 1\)</td><td>\(-90°\)</td></tr>
    <tr><td>Dérivateur \(p\)</td><td>droite de pente \(+20\) dB/déc, 0 dB en \(\omega = 1\)</td><td>\(+90°\)</td></tr>
    <tr><td>Premier ordre \(\dfrac{1}{1 + \tau p}\)</td><td>0 dB, puis \(-20\) dB/déc après \(1/\tau\) ; réel : \(-3\) dB en \(1/\tau\)</td><td>0° → \(-90°\), \(-45°\) en \(1/\tau\)</td></tr>
    <tr><td>Zéro \(1 + \tau p\)</td><td>0 dB, puis \(+20\) dB/déc après \(1/\tau\)</td><td>0° → \(+90°\)</td></tr>
    <tr><td>Deuxième ordre \(\dfrac{1}{1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}}\)</td><td>0 dB, puis \(-40\) dB/déc après \(\omega_0\) ; résonance si \(\xi \lt 0{,}71\)</td><td>0° → \(-180°\), \(-90°\) en \(\omega_0\)</td></tr>
    <tr><td>Retard pur \(e^{-Tp}\)</td><td>0 dB à toute pulsation</td><td>\(-\omega T\) (en radians), sans limite</td></tr>
  </table></div>
  <div class="prop-box">
    <ul>
      <li>Un intégrateur avec gain, \(\dfrac{K}{p}\), coupe 0 dB en \(\omega = K\) : sa droite est simplement relevée de \(20\log K\).</li>
      <li>Un zéro a un Bode <strong>symétrique</strong> de celui du pôle correspondant par rapport à l'axe 0 dB et à l'axe 0° : il ajoute de la pente et de la phase au lieu d'en retirer.</li>
      <li>La phase de la courbe réelle d'un premier ordre vaut \(-5{,}7°\) à \(0{,}1/\tau\) et \(-84{,}3°\) à \(10/\tau\) : une cassure influence la phase sur une décade de part et d'autre.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — trois briques à une pulsation donnée</strong>
    <ol>
      <li>Intégrateur \(\dfrac{20}{p}\) en \(\omega = 4\ \text{rad/s}\) : \(|H| = 20/4 = 5\), soit \(20\log 5 \approx 14\) dB, et \(\varphi = -90°\). Il coupe 0 dB en \(\omega = 20\ \text{rad/s}\).</li>
      <li>Dérivateur \(0{,}1p\) en \(\omega = 100\ \text{rad/s}\) : \(|H| = 10\), soit \(+20\) dB, et \(\varphi = +90°\).</li>
      <li>Retard de 50 ms en \(\omega = 20\ \text{rad/s}\) : gain 0 dB, phase \(-\omega T = -1\ \text{rad} \approx -57°\). Le même retard retire 5,7° à 2 rad/s, mais 573° à 200 rad/s.</li>
    </ol>
  </div>
  <div class="notice">Les cinq modèles de comportement du programme (gain, intégrateur, dérivateur, premier et deuxième ordre, retard) sont exactement ces briques. Leur réponse fréquentielle détaillée est établie dans <a href="#sys1/cours">« Systèmes du 1er ordre »</a> (§4) et <a href="#sys2/cours">« Systèmes du 2e ordre »</a> (§3) ; ce chapitre apprend à les combiner.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TRACER UN DIAGRAMME ASYMPTOTIQUE</div>
  <h2>Additionner les briques</h2>
  <div class="method-box">
    <strong>La démarche</strong>
    <ol>
      <li>Écrire \(H(p)\) sous forme canonique \(\dfrac{K}{p^\alpha}\cdot\dfrac{\prod(1 + \tau_i' p)}{\prod(1 + \tau_j p)\prod(\ldots)}\) et lister les pulsations de cassure \(1/\tau\) (et \(\omega_0\)) par ordre croissant.</li>
      <li>Départ (pulsations plus basses que toutes les cassures) : pente \(-20\,\alpha\) dB/déc, sur la droite qui vaut \(20\log K\) en \(\omega = 1\) ; phase \(-90°\,\alpha\).</li>
      <li>À chaque cassure, la pente change : \(-20\) pour un pôle, \(+20\) pour un zéro, \(-40\) pour un deuxième ordre ; la phase asymptotique perd \(90°\) (pôle), en gagne \(90°\) (zéro) ou en perd \(180°\) (deuxième ordre).</li>
      <li>Calculer le gain asymptotique aux cassures de proche en proche : sur une pente de \(-20 n\) dB/déc, passer de \(\omega_1\) à \(\omega_2\) fait varier le gain de \(-20 n\log(\omega_2/\omega_1)\).</li>
      <li>Placer quelques points réels (\(-3\) dB à une cassure isolée, phase exacte par la somme des arctangentes) et raccorder.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple 1 — deux premiers ordres</strong>
    <p>\(H(p) = \dfrac{10}{(1 + p)(1 + 0{,}1p)}\) : gain statique 10, soit 20 dB ; cassures en 1 et 10 rad/s.</p>
    <ol>
      <li>Jusqu'à 1 rad/s : horizontale à 20 dB.</li>
      <li>De 1 à 10 rad/s : pente \(-20\) dB/déc, le gain asymptotique passe de 20 dB à 0 dB.</li>
      <li>Au-delà de 10 rad/s : pente \(-40\) dB/déc. Phase : de 0° à \(-180°\) ; en 3,16 rad/s (milieu des cassures en échelle log), \(\varphi = -\arctan 3{,}16 - \arctan 0{,}316 = -90°\).</li>
    </ol>
  </div>

    <strong>Exemple 2 — un intégrateur, un zéro et deux pôles</strong>
    <p>\(H(p) = \dfrac{100\,(1 + 0{,}5p)}{p\,(1 + 5p)(1 + 0{,}02p)}\) : classe 1, gain 100 ; cassures en 0,2 (pôle), 2 (zéro) et 50 rad/s (pôle).</p>

      <li>Départ : pente \(-20\) dB/déc, sur la droite qui vaut 40 dB en \(\omega = 1\) : en 0,2 rad/s, \(40 + 20\log 5 = 54\) dB.</li>
      <li>De 0,2 à 2 : pente \(-40\), d'où 14 dB en 2 rad/s. De 2 à 50 : pente \(-20\), d'où \(14 - 20\log 25 = -14\) dB en 50 rad/s. Au-delà : \(-40\).</li>
      <li>Passage à 0 dB sur la pente \(-20\) : \(14 - 20\log(\omega/2) = 0\), soit \(\omega \approx 10\) rad/s (le calcul exact donne aussi 10,0 rad/s).</li>
      <li>Phase en 10 rad/s : \(-90° - \arctan 50 + \arctan 5 - \arctan 0{,}2 \approx -112°\). On retrouvera ce calcul dans le chapitre <a href="#stabilite/cours">« Stabilité des systèmes asservis »</a> : la marge de phase de cette boucle vaut \(180° - 112° = 68°\).</li>

<div class="course-section">
  <div class="sec-num">§4 · CALCULER GAIN ET PHASE EXACTEMENT</div>
  <h2>Les modules se multiplient, les phases s'additionnent</h2>
  <div class="prop-box">
    Pour une fonction de transfert écrite en produit de briques, à une pulsation \(\omega\) donnée :
    <ul>
      <li>\(|H(j\omega)|\) = produit des modules des facteurs du numérateur divisé par celui du dénominateur, avec \(|1 + j\tau\omega| = \sqrt{1 + \tau^2\omega^2}\) et \(|j\omega| = \omega\) ;</li>
      <li>\(\arg H(j\omega)\) = somme des arguments du numérateur moins somme de ceux du dénominateur, avec \(\arg(1 + j\tau\omega) = \arctan(\tau\omega)\) et \(\arg(j\omega) = 90°\).</li>
    </ul>
    Pour un deuxième ordre, \(\arg\big(1 - u^2 + 2j\xi u\big)\) vaut \(\arctan\dfrac{2\xi u}{1 - u^2}\) si \(u \lt 1\), et \(180° - \arctan\dfrac{2\xi u}{u^2 - 1}\) si \(u \gt 1\) : attention à la détermination de l'arctangente.
  </div>
  <div class="notice">Les asymptotes suffisent pour situer les cassures et les pentes, mais une marge de stabilité se calcule toujours avec la phase <strong>exacte</strong> : près d'une cassure, l'écart entre asymptote et courbe réelle atteint 45° en phase et 3 dB en gain (davantage pour un deuxième ordre peu amorti).</div>
  <h3>Écart entre la courbe réelle et les asymptotes d'un premier ordre</h3>
  <div style="overflow-x:auto"><table>
    <tr><th>\(\omega\tau\)</th><th>0,1</th><th>0,5</th><th>1</th><th>2</th><th>10</th></tr>
    <tr><td>Écart de gain (dB)</td><td>−0,04</td><td>−1,0</td><td>−3,0</td><td>−1,0</td><td>−0,04</td></tr>
    <tr><td>Phase réelle</td><td>−5,7°</td><td>−26,6°</td><td>−45°</td><td>−63,4°</td><td>−84,3°</td></tr>
  </table></div>
  <p>À une octave (facteur 2) de la cassure, la courbe réelle passe encore 1 dB sous les asymptotes ; à une décade, l'écart est négligeable. Pour un zéro, les écarts changent de signe (+3 dB à la cassure).</p>
  <div class="method-box">
    <strong>Exemple — le point réel au milieu d'un tracé</strong>
    <p>Pour l'exemple 2 du §3, \(H(p) = \dfrac{100\,(1 + 0{,}5p)}{p\,(1 + 5p)(1 + 0{,}02p)}\), en \(\omega = 2\ \text{rad/s}\) (cassure du zéro), l'asymptote donne 14 dB.</p>
    <ol>
      <li>Module :<div class="formula">$$|H(2j)| = \frac{100\,\sqrt{1 + 1}}{2\,\sqrt{1 + 100}\,\sqrt{1 + 0{,}0016}} \approx \frac{141{,}4}{20{,}1} \approx 7{,}0,$$</div>soit 16,9 dB.</li>
      <li>L'écart \(+2{,}9\) dB vient presque entièrement du zéro (\(+3\) dB à sa cassure) : le pôle en 0,2 rad/s est une décade plus bas et celui en 50 rad/s bien plus haut.</li>
      <li>Phase : \(-90° - \arctan 10 + \arctan 1 - \arctan 0{,}04\), soit \(-90° - 84{,}3° + 45° - 2{,}3° \approx -131{,}6°\), alors que la phase asymptotique saute de \(-180°\) à \(-90°\) en ce point.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — l'arctangente d'un deuxième ordre</strong>
    <p>Deuxième ordre \(\xi = 0{,}3\), en \(u = \omega/\omega_0 = 2\) : \(1 - u^2 + 2j\xi u = -3 + 1{,}2j\). Le point est dans le demi-plan gauche : son argument vaut \(180° - \arctan(1{,}2/3) = 158{,}2°\), et la phase du deuxième ordre est \(-158{,}2°\). Le calcul naïf \(\arctan\big(1{,}2/(-3)\big) = -21{,}8°\) donnerait une phase de \(+21{,}8°\), absurde pour un système qui doit tendre vers \(-180°\).</p>
  </div>
  <h3>Calcul numérique d'un diagramme de Bode</h3>
  <p>Le calcul exact se programme en quelques lignes avec les nombres complexes de Python : on remplace \(p\) par \(j\omega\) (écrit <code>1j * w</code>) pour un tableau de pulsations réparties en échelle logarithmique. La fonction <code>np.angle</code> renvoie un angle entre \(-180°\) et \(180°\) : au-delà, la phase « saute » de 360°, et <code>np.unwrap</code> rétablit la continuité.</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="kw">def</span> bode(H, w):
    <span class="str">"""Gain (dB) et phase (°) de H(p) aux pulsations w (rad/s)."""</span>
    Hj = H(1j * w)                                  <span class="cmt"># p remplacé par jω</span>
    G = 20 * np.log10(np.abs(Hj))
    phi = np.degrees(np.unwrap(np.angle(Hj)))       <span class="cmt"># unwrap : pas de saut de 360°</span>
    <span class="kw">return</span> G, phi

H = <span class="kw">lambda</span> p: 2 / (1 + p)**3                        <span class="cmt"># FTBO du chapitre « Stabilité »</span>
w = np.logspace(-2, 2, 2001)                        <span class="cmt"># 4 décades, 500 points par décade</span>
G, phi = bode(H, w)
k = np.argmax(G &lt; 0)                                <span class="cmt"># premier point sous 0 dB</span>
<span class="kw">print</span>(round(w[k], 3), round(phi[k], 1))           <span class="cmt"># 0.769 -112.7</span>
<span class="kw">print</span>(round(phi[-1], 1))                          <span class="cmt"># -268.3 (np.angle seul : +91.7)</span></pre>
  <p>La pulsation trouvée est celle du premier point de la grille sous 0 dB : la précision dépend du pas (ici 0,2 %). La valeur exacte, \(\omega = \sqrt{2^{2/3} - 1} \approx 0{,}766\ \text{rad/s}\), se retrouve en affinant la grille ou par dichotomie.</p>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LIRE UN DIAGRAMME DE BODE</div>
  <h2>Du relevé au modèle</h2>
  <div class="method-box">
    <strong>Identifier une fonction de transfert sur un Bode mesuré</strong>
    <ol>
      <li>Pente et phase aux basses pulsations : 0 dB/déc et 0° pour la classe 0, \(-20\) dB/déc et \(-90°\) pour la classe 1.</li>
      <li>Gain : \(K = 10^{G_0/20}\) en classe 0 ; en classe 1, \(K\) est la pulsation où la droite de départ (prolongée) coupe 0 dB.</li>
      <li>Chaque changement de pente donne une cassure ; une bosse de résonance signale un deuxième ordre peu amorti.</li>
      <li>Vérifier sur la phase : chaque pôle retire 90° au total, chaque zéro en ajoute 90°. Une phase qui continue de chuter alors que le gain a une pente constante trahit un <strong>retard pur</strong>.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — identifier un deuxième ordre résonant</strong>
    <p>Un relevé montre : aux basses pulsations, un palier à 14 dB et une phase nulle ; une bosse de gain ; la phase vaut \(-90°\) en 8 rad/s, où le gain vaut 20 dB ; aux hautes pulsations, une pente de \(-40\) dB/déc et une phase qui tend vers \(-180°\).</p>
    <ol>
      <li>Classe 0, deux pôles (pente finale \(-40\), phase finale \(-180°\)), bosse : deuxième ordre peu amorti, \(K = 10^{14/20} \approx 5\).</li>
      <li>La phase vaut \(-90°\) en \(\omega_0\) quel que soit \(\xi\) : \(\omega_0 = 8\ \text{rad/s}\).</li>
      <li>En \(\omega_0\), \(|H| = K/(2\xi)\) : \(10^{20/20} = 10 = 5/(2\xi)\), d'où \(\xi = 0{,}25\).</li>
      <li>Modèle : \(H(p) = \dfrac{5}{1 + 0{,}0625\,p + p^2/64}\). Contrôle : la résonance prévue est en \(8\sqrt{1 - 2\xi^2} \approx 7{,}5\ \text{rad/s}\), à 20,3 dB.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Bande passante.</strong> La bande passante à \(-3\) dB est l'intervalle de pulsations où le gain reste à moins de 3 dB de sa valeur en basses pulsations. Pour une boucle fermée, sa largeur est de l'ordre de la pulsation de coupure à 0 dB de la boucle ouverte, et le temps de réponse varie comme son inverse (§8).
  </div>
  <div class="method-box">
    <strong>Exemple — bande passante d'un premier ordre</strong>
    <p>\(H(p) = \dfrac{K}{1 + 0{,}2p}\) : le gain réel vaut \(20\log K - 3\) dB à la cassure, donc la bande passante est \([0\ ;\ 5\ \text{rad/s}]\), soit 0,8 Hz. Son temps de réponse à 5 % vaut \(3\tau = 0{,}6\ \text{s}\) : le produit \(t_{r5\%}\cdot\omega_{-3\,dB} = 3\) est fixe, un système rapide a une large bande passante.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LE DEUXIÈME ORDRE DANS UN TRACÉ</div>
  <h2>Deux premiers ordres ou une résonance</h2>
  <div class="intro">Un trinôme \(1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}\) au dénominateur se traite de deux façons selon son amortissement : s'il est bien amorti, comme deux premiers ordres ; sinon, comme une seule cassure de pente \(-40\) dB/déc, corrigée en \(\omega_0\).</div>
  <div class="prop-box">
    <strong>Si \(\xi \geq 1\)</strong>, le trinôme a deux racines réelles négatives et se factorise en \((1 + \tau_1p)(1 + \tau_2p)\), avec \(\tau_1\tau_2 = 1/\omega_0^2\) et \(\tau_1 + \tau_2 = 2\xi/\omega_0\) : deux cassures en \(1/\tau_1\) et \(1/\tau_2\), de part et d'autre de \(\omega_0\) (moyenne géométrique). Le tracé est celui de deux premiers ordres.<br>
    <strong>Si \(\xi \lt 1\)</strong>, asymptotes : horizontale jusqu'à \(\omega_0\), puis pente \(-40\) dB/déc ; phase asymptotique 0° puis \(-180°\). En \(\omega_0\), la courbe réelle passe à
    <div class="formula" data-nom="Gain d'un 2e ordre en ω₀">$$G_{dB}(\omega_0) = 20\log K - 20\log(2\xi),\qquad \varphi(\omega_0) = -90°,$$</div>
    soit au-dessus de l'asymptote si \(\xi \lt 0{,}5\), en dessous si \(\xi \gt 0{,}5\). Il y a résonance (maximum du gain) si et seulement si \(\xi \lt 1/\sqrt2 \approx 0{,}71\) : voir <a href="#sys2/cours">« Systèmes du 2e ordre »</a>, §3, pour \(\omega_r\) et le facteur de résonance \(Q_r = |H(j\omega_r)|/K\).
  </div>
  <div class="method-box">
    <strong>Exemple — un deuxième ordre qui n'en a que le nom</strong>
    <p>\(H(p) = \dfrac{10}{1 + 1{,}1p + 0{,}1p^2}\) : \(\omega_0 = 1/\sqrt{0{,}1} \approx 3{,}16\ \text{rad/s}\) et \(2\xi/\omega_0 = 1{,}1\), d'où \(\xi \approx 1{,}74\).</p>
    <ol>
      <li>\(\xi \gt 1\) : les racines de \(0{,}1p^2 + 1{,}1p + 1\) sont \(-1\) et \(-10\), donc<div class="formula">$$1 + 1{,}1p + 0{,}1p^2 = (1 + p)(1 + 0{,}1p).$$</div></li>
      <li>C'est l'exemple 1 du §3 : deux cassures en 1 et 10 rad/s, de part et d'autre de \(\omega_0 = \sqrt{1 \times 10}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une résonance qui coûte de la marge</strong>
    <p>Boucle ouverte d'un axe avec une transmission souple : \(H(p) = \dfrac{2}{p\,\big(1 + 0{,}02p + 0{,}0025p^2\big)}\), soit \(\omega_0 = 20\ \text{rad/s}\) et \(\xi = 0{,}02 \times 20/2 = 0{,}2\).</p>
    <ol>
      <li>Asymptotes : droite de l'intégrateur (6 dB en \(\omega = 1\), 0 dB en \(\omega = 2\)), puis \(-60\) dB/déc après 20 rad/s. En \(\omega_0\), l'asymptote vaut \(20\log(2/20) = -20\) dB.</li>
      <li>Correction en \(\omega_0\) : \(-20\log(2 \times 0{,}2) = +8\) dB, donc \(-12\) dB réels ; et la phase y vaut exactement \(-90° - 90° = -180°\).</li>
      <li>La boucle coupe 0 dB vers 2 rad/s avec une phase de \(-92°\), mais à 20 rad/s elle n'a que 12 dB de marge de gain, contre 26 dB si la transmission était amortie (\(\xi = 1\)).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · LE RETARD PUR</div>
  <h2>Un gain plat, une phase sans fond</h2>
  <div class="intro">Un transport de matière (tapis, canalisation), une durée de calcul ou de transmission, la propagation de la chaleur dans une paroi retardent le signal sans l'atténuer. Ce retard pur ne change pas le gain mais menace la stabilité, parce que sa phase décroît sans limite.</div>
  <div class="prop-box">
    <strong>Retard pur \(e^{-Tp}\).</strong> Pour \(p = j\omega\), \(|e^{-j\omega T}| = 1\) et \(\arg e^{-j\omega T} = -\omega T\) :
    <div class="formula" data-nom="Bode d'un retard pur">$$G_{dB} = 0,\qquad \varphi(\omega) = -\omega T\ \text{(rad)} = -\frac{180}{\pi}\,\omega T\ \text{(°)}.$$</div>
    La phase est <strong>proportionnelle à \(\omega\)</strong> : sur l'échelle logarithmique du Bode, elle n'a pas d'asymptote et plonge de plus en plus vite. Pour \(\omega T \ll 1\), le retard se confond avec un premier ordre de constante de temps \(T\) (même phase \(-\omega T\) au premier ordre), mais les deux s'écartent dès que \(\omega T\) approche 1.
  </div>
  <div class="method-box">
    <strong>Exemple — repérer et mesurer un retard sur un four</strong>
    <p>Un four est modélisé par \(G(p) = \dfrac{2\,e^{-Tp}}{1 + 5p}\) (temps en secondes). On mesure la phase \(-107{,}3°\) en 1 rad/s et \(-141{,}6°\) en 2 rad/s.</p>
    <ol>
      <li>Phase du premier ordre seul : \(-\arctan 5 = -78{,}7°\) en 1 rad/s, \(-\arctan 10 = -84{,}3°\) en 2 rad/s.</li>
      <li>Phase manquante : \(28{,}6°\) puis \(57{,}3°\), proportionnelle à \(\omega\) : c'est la signature d'un retard.</li>
      <li>\(\omega T = 28{,}6° = 0{,}50\ \text{rad}\) en 1 rad/s : \(T = 0{,}5\ \text{s}\) (même valeur avec le point à 2 rad/s).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§8 · DE LA BOUCLE OUVERTE À LA BOUCLE FERMÉE</div>
  <h2>Le Bode d'un système asservi</h2>
  <div class="intro">On trace le Bode de la boucle ouverte (FTBO) parce qu'il s'obtient par simple addition des blocs. Il renseigne aussi sur la boucle fermée (FTBF) : sa précision aux basses pulsations, sa bande passante et sa résonance éventuelle.</div>
  <div class="prop-box">
    <strong>Boucle à retour unitaire</strong>, \(H_{BF} = \dfrac{H_{BO}}{1 + H_{BO}}\) :
    <ul>
      <li>là où \(|H_{BO}| \gg 1\) (basses pulsations), \(H_{BF} \approx 1\) : gain 0 dB, phase nulle, la sortie suit la consigne ;</li>
      <li>là où \(|H_{BO}| \ll 1\) (hautes pulsations), \(H_{BF} \approx H_{BO}\) : la boucle fermée a le Bode de la boucle ouverte ;</li>
      <li>la transition se fait autour de la pulsation de coupure à 0 dB \(\omega_{c0}\) de la FTBO : la bande passante à \(-3\) dB de la boucle fermée est du même ordre que \(\omega_{c0}\) (typiquement entre \(\omega_{c0}\) et \(2\,\omega_{c0}\)).</li>
    </ul>
    En classe 0, le palier de la FTBF vaut \(\dfrac{K}{1 + K}\), un peu sous 0 dB ; dès la classe 1, il vaut exactement 0 dB.
  </div>
  <div class="method-box">
    <strong>Exemple — bande passante d'un asservissement</strong>
    <p>FTBO \(H_{BO}(p) = \dfrac{10}{p\,(1 + 0{,}1p)}\), retour unitaire.</p>
    <ol>
      <li>Coupure de la FTBO : \(\dfrac{10}{\omega\sqrt{1 + 0{,}01\,\omega^2}} = 1\), soit \(0{,}01\,\omega^4 + \omega^2 - 100 = 0\), d'où \(\omega^2 \approx 61{,}8\) et \(\omega_{c0} \approx 7{,}9\ \text{rad/s}\).</li>
      <li>FTBF : \(\dfrac{10}{0{,}1p^2 + p + 10}\), soit \(\dfrac{1}{1 + 0{,}1p + 0{,}01p^2}\) : deuxième ordre de gain 1, \(\omega_0 = 10\ \text{rad/s}\), \(\xi = 0{,}5\).</li>
      <li>\(\xi \lt 0{,}71\) : légère résonance, \(+1{,}25\) dB en \(\omega_r = 7{,}1\ \text{rad/s}\). Le gain repasse à \(-3\) dB en \(\omega = 12{,}7\ \text{rad/s}\) : bande passante \([0\ ;\ 12{,}7\ \text{rad/s}]\), environ \(1{,}6\,\omega_{c0}\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§9 · MESURER UNE RÉPONSE FRÉQUENTIELLE</div>
  <h2>Du banc d'essai au modèle</h2>
  <div class="intro">Identifier un modèle de comportement (programme D2, B3), c'est choisir l'entrée à imposer et la sortie à mesurer, relever le gain et la phase à plusieurs pulsations, puis vérifier qu'un modèle simple rend compte des mesures.</div>
  <div class="method-box">
    <strong>Le protocole</strong>
    <ol>
      <li><strong>Entrée</strong> : une sinusoïde autour du point de fonctionnement (une vitesse moyenne, une température de consigne), d'amplitude assez faible pour ne saturer ni l'actionneur ni la mesure, assez forte pour dominer le bruit. Vérifier que la sortie reste sinusoïdale : une sortie écrêtée ou déformée signale une non-linéarité, et le modèle linéaire n'est plus valable.</li>
      <li><strong>Pulsations</strong> : réparties en échelle logarithmique (trois à cinq par décade), resserrées près des cassures et de la résonance, sur deux décades au moins de part et d'autre de la zone utile.</li>
      <li><strong>Mesure</strong> : attendre la fin du régime transitoire, puis relever les amplitudes \(E_m\), \(S_m\) et le décalage temporel \(\Delta t\) entre deux maximums (ou deux passages par la valeur moyenne). \(G_{dB} = 20\log(S_m/E_m)\) et \(\varphi = -360°\cdot\Delta t/T = -360°\,f\,\Delta t\) si la sortie est en retard.</li>
      <li><strong>Modèle</strong> : identifier les briques (§5), puis superposer le Bode calculé aux points mesurés (§4) et chiffrer l'écart ; s'il est trop grand, enrichir le modèle (une cassure de plus, un retard).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un point de mesure</strong>
    <p>À \(f = 2\ \text{Hz}\) (\(\omega = 12{,}6\ \text{rad/s}\)), l'entrée a une amplitude de 2,0 V, la sortie de 1,6 V, et ses maximums arrivent 35 ms après ceux de l'entrée.</p>
    <ol>
      <li>Gain : \(20\log(1{,}6/2{,}0) = 20\log 0{,}8 \approx -1{,}9\) dB.</li>
      <li>Phase : la période vaut 500 ms, donc \(\varphi = -360° \times 35/500 = -25{,}2°\).</li>
      <li>Si un modèle prévoit \(-2{,}0\) dB et \(-24°\) à cette pulsation, l'écart (0,1 dB et 1°) est de l'ordre de la précision de lecture : le modèle est validé en ce point.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : mesurer avant la fin du transitoire (amplitude et décalage faux), ou se tromper de signe : une sortie en retard a une phase négative. Pour un décalage supérieur à une demi-période, la phase dépasse \(-180°\) : suivre la phase de proche en proche depuis les basses pulsations pour ne pas la confondre avec une avance.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Autres représentations et suite du cours</h2>
  <div class="intro">Rien de ce qui suit n'est exigible en PTSI.</div>
  <ul>
    <li><strong>Lieux de Black-Nichols et de Nyquist</strong> (hors programme des deux années) : ils portent la même information que le Bode. Le lieu de Black trace le gain en dB en fonction de la phase, gradué en pulsations ; le lieu de Nyquist trace \(H(j\omega)\) dans le plan complexe. Les marges de stabilité s'y lisent aussi, mais le programme les demande sur le diagramme de Bode.</li>
    <li><strong>Correcteur à avance de phase</strong> \(K\,\dfrac{1 + aTp}{1 + Tp}\), \(a \gt 1\) : son Bode se trace avec les outils de ce chapitre (un zéro, puis un pôle) ; il apporte une phase maximale \(\varphi_m\), avec \(\sin\varphi_m = \dfrac{a - 1}{a + 1}\), en \(\omega_m = \dfrac{1}{T\sqrt a}\). Son réglage est au programme de 2ᵉ année : <a href="#correcteurs/cours">« Correction des SLCI »</a>, §5.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · DIAGRAMMES DE BODE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à passer d'une fonction de transfert à son diagramme de Bode, et inversement d'un relevé à un modèle ; elles préparent la lecture des marges de stabilité et de la bande passante.</div>
  <div class="method-box"><strong>Méthode 1 — Calculer gain et phase à une pulsation</strong>
    <ol>
      <li>Remplacer \(p\) par \(j\omega\) dans la forme factorisée.</li>
      <li>Module : produit des modules du numérateur sur produit des modules du dénominateur, avec \(|1 + j\tau\omega| = \sqrt{1 + \tau^2\omega^2}\) ; en dB, sommes et différences de \(20\log\).</li>
      <li>Phase : somme des arctangentes du numérateur moins celles du dénominateur, \(-90°\) par intégrateur, \(-\omega T\) (converti en degrés) pour un retard ; pour un deuxième ordre au-delà de \(\omega_0\), \(-180° + \arctan\dfrac{2\xi u}{u^2 - 1}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(H(p) = \dfrac{50}{p\,(1 + 0{,}1p)}\) en \(\omega = 10\ \text{rad/s}\) : \(|H| = \dfrac{50}{10\sqrt2} \approx 3{,}54\), soit 11,0 dB ; \(\varphi = -90° - \arctan 1 = -135°\).</p>
  </div>
  <div class="method-box"><strong>Méthode 2 — Calculer vite en décibels</strong>
    <ol>
      <li>×2 = +6 dB, ×10 = +20 dB, \(\times\sqrt2\) = +3 dB ; un produit de facteurs donne une somme de décibels.</li>
      <li>Une décade sur une pente de \(-20 n\) dB/déc fait perdre \(20 n\) dB ; une octave (facteur 2), \(6 n\) dB.</li>
      <li>Revenir au rapport : \(|H| = 10^{G_{dB}/20}\) (−12 dB ≈ 0,25 ; +26 dB ≈ 20).</li>
    </ol>
    <p><em>Exemple éclair :</em> un rapport 40 = 4 × 10 vaut \(12 + 20 = 32\) dB ; \(-26\) dB = \(-20 - 6\) dB correspond à \(0{,}1 \times 0{,}5 = 0{,}05\).</p>
  </div>
  <div class="method-box"><strong>Méthode 3 — Mettre une fonction de transfert sous forme canonique</strong>
    <ol>
      <li>Factoriser numérateur et dénominateur ; mettre chaque facteur \(p + a\) sous la forme \(a\,(1 + p/a)\), chaque trinôme sous la forme \(1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}\).</li>
      <li>Rassembler les constantes en un seul gain \(K\) ; compter les \(p\) en facteur au dénominateur : c'est la classe \(\alpha\).</li>
      <li>Lister les cassures \(a = 1/\tau\) (et \(\omega_0\)) par ordre croissant, en notant pour chacune s'il s'agit d'un pôle ou d'un zéro.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{20\,(p + 2)}{p\,(p + 10)} = \dfrac{20 \times 2\,(1 + 0{,}5p)}{10\,p\,(1 + 0{,}1p)} = \dfrac{4\,(1 + 0{,}5p)}{p\,(1 + 0{,}1p)}\) : \(K = 4\), classe 1, zéro en 2 rad/s, pôle en 10 rad/s.</p>
  </div>
  <div class="method-box"><strong>Méthode 4 — Tracer le gain asymptotique</strong>
    <ol>
      <li>Forme canonique ; classe \(\alpha\), gain \(K\), cassures rangées par ordre croissant.</li>
      <li>Droite de départ de pente \(-20\alpha\) dB/déc passant par \(20\log K\) en \(\omega = 1\) (palier à \(20\log K\) en classe 0).</li>
      <li>À chaque cassure : \(-20\) (pôle), \(+20\) (zéro), \(-40\) (deuxième ordre) dB/déc de pente en plus ; gain aux cassures de proche en proche.</li>
      <li>Repérer la pulsation de coupure à 0 dB en résolvant l'équation de la droite qui y passe.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{4\,(1 + 0{,}5p)}{p\,(1 + 0{,}1p)}\) : pente \(-20\) passant par 12 dB en \(\omega = 1\), d'où 6 dB en 2 rad/s ; palier à 6 dB de 2 à 10 rad/s (le zéro compense l'intégrateur) ; pente \(-20\) au-delà, qui coupe 0 dB en \(10 \times 10^{6/20} = 20\ \text{rad/s}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 5 — Tracer la phase</strong>
    <ol>
      <li>Phase de départ \(-90°\alpha\) ; phase finale \(-90° \times\) (degré du dénominateur − degré du numérateur), sauf retard.</li>
      <li>Asymptotes en marches : un pôle retire 90° à sa cassure, un zéro en ajoute 90°, un deuxième ordre retire 180°.</li>
      <li>Calculer la phase exacte aux pulsations utiles (cassures, milieu logarithmique de deux cassures, coupure à 0 dB) par la somme des arctangentes, et raccorder.</li>
    </ol>
    <p><em>Exemple éclair :</em> même \(H\) : phase \(-90°\) au départ, marche à 0° entre 2 et 10 rad/s, retour à \(-90°\) au-delà. Au milieu logarithmique \(\sqrt{20} \approx 4{,}5\ \text{rad/s}\), la phase réelle vaut \(-90° + \arctan 2{,}24 - \arctan 0{,}45 \approx -48°\) : les deux cassures, trop proches, empêchent la phase d'atteindre 0°.</p>
  </div>
  <div class="method-box"><strong>Méthode 6 — Placer la courbe réelle</strong>
    <ol>
      <li>Cassure isolée d'un pôle : \(-3\) dB et \(-45°\) par rapport aux asymptotes ; à une octave, \(-1\) dB ; à une décade, l'écart de gain est négligeable et la phase vaut \(-5{,}7°\) ou \(-84{,}3°\). Pour un zéro, mêmes écarts de signe opposé.</li>
      <li>Deuxième ordre : en \(\omega_0\), le gain réel est à \(-20\log(2\xi)\) de l'asymptote et la phase vaut \(-90°\).</li>
      <li>Cassures à moins d'une décade l'une de l'autre : leurs corrections s'ajoutent ; calculer le point exact (méthode 1).</li>
    </ol>
    <p><em>Exemple éclair :</em> deuxième ordre de gain 1 en \(\omega_0\) : \(+14\) dB si \(\xi = 0{,}1\), \(-2{,}9\) dB si \(\xi = 0{,}7\) (presque comme un premier ordre).</p>
  </div>
  <div class="method-box"><strong>Méthode 7 — Trouver la pulsation de coupure à 0 dB</strong>
    <ol>
      <li>Estimer \(\omega_{c0}\) sur les asymptotes : écrire l'équation du segment qui traverse 0 dB.</li>
      <li>Calculer la valeur exacte en résolvant \(|H(j\omega)| = 1\) : équation bicarrée pour deux facteurs, sinon essais successifs ou dichotomie (à la calculatrice ou en Python) en partant de l'estimation.</li>
      <li>Vérifier que la valeur trouvée est cohérente avec le tracé (même segment, ou à côté d'une cassure proche).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{10}{p\,(1 + 0{,}1p)}\) : l'asymptote coupe 0 dB exactement en 10 rad/s, à la cassure ; la courbe réelle, 3 dB plus bas, coupe plus tôt : \(0{,}01\,\omega^4 + \omega^2 - 100 = 0\) donne \(\omega_{c0} \approx 7{,}9\ \text{rad/s}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 8 — Retrouver une fonction de transfert sur un Bode</strong>
    <ol>
      <li>Classe par la pente de départ et la phase de départ.</li>
      <li>Gain par la valeur de la droite de départ en \(\omega = 1\) (ou par le palier en classe 0).</li>
      <li>Une cassure par changement de pente, avec son signe ; une bosse = deuxième ordre (\(\omega_0\) où la phase vaut \(-90°\) relativement au départ, \(\xi\) par le gain en \(\omega_0\)).</li>
      <li>Contrôler la phase totale ; un excès de phase proportionnel à \(\omega\) révèle un retard.</li>
    </ol>
    <p><em>Exemple éclair :</em> palier à 6 dB, une cassure en 5 rad/s suivie d'une pente de \(-20\) dB/déc, phase de 0° à \(-90°\) passant par \(-45°\) en 5 rad/s : \(H(p) = \dfrac{2}{1 + 0{,}2p}\) (\(10^{6/20} \approx 2\)).</p>
  </div>
  <div class="method-box"><strong>Méthode 9 — Exploiter un relevé à l'oscilloscope</strong>
    <ol>
      <li>Attendre la fin du régime transitoire ; vérifier que la sortie est sinusoïdale (sinon : saturation, amplitude d'entrée à réduire).</li>
      <li>Gain : \(20\log(S_m/E_m)\).</li>
      <li>Phase : \(\varphi = -360°\,f\,\Delta t\) pour une sortie en retard de \(\Delta t\) ; suivre la phase de proche en proche quand la fréquence augmente.</li>
    </ol>
    <p><em>Exemple éclair :</em> à 5 Hz, sortie d'amplitude moitié de celle de l'entrée, en retard de 20 ms : \(G = -6\) dB et \(\varphi = -360° \times 5 \times 0{,}020 = -36°\).</p>
  </div>
  <div class="method-box"><strong>Méthode 10 — Lire la boucle fermée sur la boucle ouverte</strong>
    <ol>
      <li>Basses pulsations (\(|H_{BO}| \gg 1\)) : \(H_{BF} \approx 1\), et exactement \(K/(1 + K)\) en classe 0.</li>
      <li>Hautes pulsations (\(|H_{BO}| \ll 1\)) : \(H_{BF} \approx H_{BO}\).</li>
      <li>Bande passante à \(-3\) dB de la boucle fermée : de l'ordre de \(\omega_{c0}\) (entre \(\omega_{c0}\) et \(2\,\omega_{c0}\) pour une boucle bien amortie) ; une résonance de la FTBF signale une marge de phase faible.</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{99}{1 + p}\) : FTBF \(\dfrac{0{,}99}{1 + 0{,}01p}\), palier à \(-0{,}09\) dB et bande passante de 100 rad/s ; la FTBO coupe 0 dB en \(\sqrt{99^2 - 1} \approx 99\ \text{rad/s}\).</p>
  </div>
  <div class="notice"><strong>Pièges classiques.</strong> Faire partir la pente d'un intégrateur de 0 dB au lieu de \(20\log K\) en \(\omega = 1\) ; oublier qu'un zéro <em>ajoute</em> de la pente ; placer une cassure en \(\tau\) au lieu de \(1/\tau\) ; calculer une marge sur la phase asymptotique ; mal déterminer l'arctangente d'un deuxième ordre au-delà de \(\omega_0\) ; oublier de convertir \(\omega T\) en degrés ; tracer les pulsations en échelle linéaire ; confondre fréquence \(f\) (Hz) et pulsation \(\omega = 2\pi f\) (rad/s).</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Décibels et briques élémentaires</h3>
  <div class="statement">Pulsations en rad/s.</div>
  <div class="q"><strong>Q1.</strong> Convertir en décibels les rapports d'amplitudes 4, 0,5, 1 000 et 0,02.</div>
  <div class="q"><strong>Q2.</strong> Un gain suit une pente de \(-40\) dB/décade sur deux décades. Par combien l'amplitude est-elle divisée ?</div>
  <div class="q"><strong>Q3.</strong> Donner le gain (en dB) et la phase de \(H(p) = \dfrac{5}{p}\) pour \(\omega = 0{,}5\), 5 et 50 rad/s. Où coupe-t-il 0 dB ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(20\log 4 = 12\) dB ; \(20\log 0{,}5 = -6\) dB ; \(20\log 1000 = 60\) dB ; \(20\log 0{,}02 = 20\,(\log 2 - 2) \approx -34\) dB.</p>
    <p><strong>Q2.</strong> \(-80\) dB, soit un rapport \(10^{-4}\) : l'amplitude est divisée par 10 000 (par 100 à chaque décade, car le gain varie comme \(1/\omega^2\)).</p>
    <p><strong>Q3.</strong> \(|H| = 5/\omega\) : \(20\log 10 = 20\) dB en 0,5 rad/s, 0 dB en 5 rad/s, \(-20\) dB en 50 rad/s ; la phase vaut \(-90°\) à toute pulsation. Le gain coupe 0 dB en \(\omega = K = 5\ \text{rad/s}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Tracé asymptotique et coupure à 0 dB</h3>
  <div class="statement">\(H(p) = \dfrac{20}{(1 + 0{,}5p)(1 + 0{,}05p)}\).</div>
  <div class="q"><strong>Q1.</strong> Donner le gain statique en dB et les pulsations de cassure.</div>
  <div class="q"><strong>Q2.</strong> Tracer le diagramme asymptotique du gain ; donner le gain asymptotique en 20 rad/s.</div>
  <div class="q"><strong>Q3.</strong> Estimer, sur les asymptotes, la pulsation où le gain vaut 0 dB. La valeur exacte est 24,9 rad/s : expliquer l'écart.</div>
  <div class="q"><strong>Q4.</strong> Calculer la phase à cette pulsation.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(20\log 20 \approx 26\) dB ; cassures en \(1/0{,}5 = 2\) et \(1/0{,}05 = 20\ \text{rad/s}\).</p>
    <p><strong>Q2.</strong> Horizontale à 26 dB jusqu'à 2 rad/s ; pente \(-20\) dB/déc de 2 à 20 rad/s, d'où \(26 - 20 = 6\) dB en 20 rad/s ; pente \(-40\) dB/déc au-delà.</p>
    <p><strong>Q3.</strong> Sur la pente \(-40\) : \(6 - 40\log(\omega/20) = 0\), soit \(\omega = 20 \times 10^{0{,}15} \approx 28\ \text{rad/s}\). La courbe réelle passe sous les asymptotes au voisinage de la cassure en 20 rad/s (3 dB plus bas en 20 rad/s : 3,0 dB au lieu de 6) : elle atteint donc 0 dB un peu plus tôt, en 24,9 rad/s.</p>
    <p><strong>Q4.</strong> \(\varphi = -\arctan(12{,}45) - \arctan(1{,}245)\), soit \(-85{,}4° - 51{,}2° \approx -137°\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Un réseau à avance de phase</h3>
  <div class="statement">\(C(p) = \dfrac{1 + p}{1 + 0{,}1p}\) (pulsations en rad/s).</div>
  <div class="q"><strong>Q1.</strong> Tracer les asymptotes du gain et de la phase.</div>
  <div class="q"><strong>Q2.</strong> Calculer la phase et le gain en \(\omega_m = \sqrt{1 \times 10}\).</div>
  <div class="q"><strong>Q3.</strong> Pourquoi parle-t-on d'« avance » de phase ? À quoi un tel bloc peut-il servir dans une boucle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Zéro en 1 rad/s puis pôle en 10 rad/s. Gain : 0 dB jusqu'à 1, pente \(+20\) dB/déc de 1 à 10, puis palier à \(+20\) dB. Phase asymptotique : 0°, puis \(+90°\) entre les cassures, puis 0°.</p>
    <p><strong>Q2.</strong> \(\varphi(\omega_m) = \arctan 3{,}16 - \arctan 0{,}316\), soit \(72{,}5° - 17{,}5° = 55°\) : c'est le maximum, atteint au milieu (logarithmique) des cassures. Gain : \(\dfrac{\sqrt{1 + 10}}{\sqrt{1 + 0{,}1}} = \sqrt{10}\), soit 10 dB.</p>
    <p><strong>Q3.</strong> La phase est positive : la sortie est en avance sur l'entrée. Placé dans une boucle, ce bloc remonte la phase de la boucle ouverte au voisinage de sa pulsation de coupure et augmente la marge de phase. C'est le correcteur à avance de phase, étudié en deuxième année.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Retrouver la fonction de transfert</h3>
  <div class="statement">Un diagramme de Bode relevé présente, en basses pulsations, une pente de \(-20\) dB/décade et une phase de \(-90°\) ; la droite de départ, prolongée, vaut 20 dB en \(\omega = 1\ \text{rad/s}\). À 5 rad/s, la pente devient \(-40\) dB/décade, et la phase tend vers \(-180°\) en hautes pulsations.</div>
  <div class="q"><strong>Q1.</strong> Proposer une fonction de transfert.</div>
  <div class="q"><strong>Q2.</strong> Calculer le gain asymptotique et le gain réel en 5 rad/s, ainsi que la phase.</div>
  <div class="q"><strong>Q3.</strong> Où la droite de départ couperait-elle 0 dB ? Le gain réel coupe-t-il 0 dB avant ou après cette pulsation ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Classe 1 (pente et phase de départ), gain \(K = 10^{20/20} = 10\), un pôle en 5 rad/s : \(H(p) = \dfrac{10}{p\,(1 + 0{,}2p)}\). La phase totale \(-90° - 90° = -180°\) est cohérente.</p>
    <p><strong>Q2.</strong> Asymptote : \(20 - 20\log 5 = 6\) dB. Réel : \(\dfrac{10}{5\sqrt2} = \sqrt2\), soit 3 dB. Phase : \(-90° - 45° = -135°\).</p>
    <p><strong>Q3.</strong> La droite \(10/\omega\) coupe 0 dB en 10 rad/s. Mais après 5 rad/s le gain chute à \(-40\) dB/déc : l'asymptote coupe 0 dB en \(5 \times 10^{6/40} \approx 7{,}1\ \text{rad/s}\), et le gain réel vers 6,2 rad/s, donc avant 10 rad/s.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Diagramme de Bode — tracé asymptotique et marges</h3>
  <div class="statement">Un asservissement à retour unitaire a pour fonction de transfert en boucle ouverte \(H_{BO}(p) = \dfrac{100}{p\,(1 + 0{,}1p)(1 + 0{,}01p)}\) (pulsations en rad/s).</div>
  <div class="q"><strong>Q1.</strong> Tracer le diagramme de Bode asymptotique, en gain et en phase. Donner les pulsations de cassure et les pentes.</div>
  <div class="q"><strong>Q2.</strong> Estimer sur les asymptotes la pulsation de coupure à 0 dB \(\omega_{c0}\), puis calculer la phase exacte à cette pulsation. Que peut-on en conclure ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la valeur exacte de \(\omega_{c0}\) et la marge de phase \(M_\varphi\). Calculer la pulsation \(\omega_\pi\) où la phase vaut \(-180°\) et la marge de gain \(M_G\). Conclure.</div>
  <div class="q"><strong>Q4.</strong> On remplace le gain 100 par un gain \(K\) réglable. Quelle valeur de \(K\) donne \(M_\varphi = 45°\) ? Quelle est alors la marge de gain ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Forme canonique : classe 1, \(K = 100\) (40 dB en \(\omega = 1\)), cassures en \(1/0{,}1 = 10\) et \(1/0{,}01 = 100\ \text{rad/s}\). Gain : pente \(-20\) dB/déc jusqu'à 10 rad/s (on y arrive à \(40 - 20 = 20\) dB), \(-40\) dB/déc de 10 à 100 rad/s (on arrive à \(20 - 40 = -20\) dB), \(-60\) dB/déc au-delà. Phase asymptotique : \(-90°\), puis \(-180°\) entre 10 et 100 rad/s, puis \(-270°\).</p>
    <p><strong>Q2.</strong> Sur le segment de pente \(-40\) : \(20 - 40\log(\omega/10) = 0\), soit \(\omega = 10\sqrt{10} \approx 31{,}6\ \text{rad/s}\). Phase exacte : \(-90° - \arctan 3{,}16 - \arctan 0{,}316\), soit \(-90° - 72{,}45° - 17{,}55° = -180°\) (car \(\arctan x + \arctan(1/x) = 90°\)). D'après les asymptotes, la boucle serait exactement à la limite de stabilité : l'estimation asymptotique ne suffit pas pour conclure, il faut le gain exact.</p>
    <p><strong>Q3.</strong> Près de la cassure en 10 rad/s, la courbe réelle passe sous les asymptotes : elle coupe 0 dB un peu avant 31,6 rad/s. La résolution de \(|H_{BO}(j\omega)| = 1\) (dichotomie) donne \(\omega_{c0} \approx 30{,}1\ \text{rad/s}\), où la phase vaut \(-90° - \arctan 3{,}01 - \arctan 0{,}301\), soit \(-178{,}4°\) : \(M_\varphi \approx 1{,}6°\). La phase vaut \(-180°\) quand \(\arctan(0{,}1\omega) + \arctan(0{,}01\omega) = 90°\), c'est-à-dire \(0{,}1\omega \times 0{,}01\omega = 1\) : \(\omega_\pi = \sqrt{1000} \approx 31{,}6\ \text{rad/s}\). Le gain y vaut \(\dfrac{100}{31{,}6\,\sqrt{11}\,\sqrt{1{,}1}} = \dfrac{100}{110} \approx 0{,}91\), soit \(-0{,}83\) dB : \(M_G \approx 0{,}8\) dB. Les deux marges sont positives : la boucle fermée est stable, mais à peine (gain limite 110) ; sa réponse indicielle oscillerait longtemps. Il faut baisser le gain ou corriger la boucle.</p>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Un deuxième ordre résonant</h3>
  <div class="statement">\(H(p) = \dfrac{4}{1 + 0{,}04p + 0{,}01p^2}\).</div>
  <div class="q"><strong>Q1.</strong> Identifier \(K\), \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q2.</strong> Tracer les asymptotes du gain ; calculer le gain réel en \(\omega_0\).</div>
  <div class="q"><strong>Q3.</strong> Le système résonne-t-il ? Calculer la pulsation de résonance et le gain maximal en dB.</div>
  <div class="q"><strong>Q4.</strong> Donner la phase en 5, 10 et 20 rad/s.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(K = 4\) ; \(\dfrac{1}{\omega_0^2} = 0{,}01\) donc \(\omega_0 = 10\ \text{rad/s}\) ; \(\dfrac{2\xi}{\omega_0} = 0{,}04\) donc \(\xi = 0{,}2\).</p>
    <p><strong>Q2.</strong> Horizontale à \(20\log 4 = 12\) dB, puis \(-40\) dB/déc après 10 rad/s. En \(\omega_0\) : \(|H| = \dfrac{K}{2\xi} = 10\), soit 20 dB : 8 dB au-dessus du coin des asymptotes.</p>
    <p><strong>Q3.</strong> \(\xi = 0{,}2 \lt 0{,}71\) : oui. \(\omega_r = 10\sqrt{1 - 2 \times 0{,}04} \approx 9{,}6\ \text{rad/s}\) ; facteur de résonance \(Q_r = \dfrac{1}{2 \times 0{,}2\sqrt{1 - 0{,}04}} \approx 2{,}55\), donc \(|H|_{max} = 4 \times 2{,}55 \approx 10{,}2\), soit 20,2 dB.</p>
    <p><strong>Q4.</strong> En 5 rad/s (\(u = 0{,}5\)) : \(-\arctan\dfrac{2 \times 0{,}2 \times 0{,}5}{1 - 0{,}25}\), soit \(-\arctan 0{,}267 \approx -15°\). En 10 rad/s : \(-90°\). En 20 rad/s (\(u = 2\)) : \(-\Big(180° - \arctan\dfrac{0{,}8}{3}\Big) \approx -165°\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>L'effet d'un retard pur</h3>
  <div class="statement">Un procédé \(G(p) = \dfrac{10}{1 + p}\) est mesuré par un capteur qui introduit un retard \(T = 0{,}1\ \text{s}\) : la boucle ouverte devient \(H(p) = \dfrac{10\,e^{-0{,}1p}}{1 + p}\).</div>
  <div class="q"><strong>Q1.</strong> Comparer les diagrammes de gain de \(G\) et de \(H\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la pulsation où le gain vaut 0 dB, puis la phase de \(G\) et celle de \(H\) à cette pulsation.</div>
  <div class="q"><strong>Q3.</strong> À quelle pulsation la phase de \(H\) atteint-elle \(-180°\) ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(|e^{-j\omega T}| = 1\) : les deux diagrammes de gain sont identiques (20 dB, cassure en 1 rad/s, puis \(-20\) dB/déc).</p>
    <p><strong>Q2.</strong> \(\dfrac{10}{\sqrt{1 + \omega^2}} = 1\) donne \(\omega = \sqrt{99} \approx 9{,}95\ \text{rad/s}\). Phase de \(G\) : \(-\arctan 9{,}95 = -84{,}3°\). Le retard ajoute \(-\omega T = -0{,}995\ \text{rad} = -57{,}0°\) : phase de \(H\) : \(-141{,}3°\).</p>
    <p><strong>Q3.</strong> Il faut \(\arctan\omega + 0{,}1\,\omega\,\dfrac{180}{\pi} = 180°\) ; par essais successifs, \(\omega_{-180} \approx 16{,}3\ \text{rad/s}\) (\(86{,}5° + 93{,}5° = 180°\)). Sans retard, la phase de \(G\) n'atteint jamais \(-180°\) ; avec le retard, elle l'atteint à une pulsation où le gain vaut encore \(10/\sqrt{1 + 16{,}3^2} \approx 0{,}61\) (\(-4{,}3\) dB) : un gain multiplié par 1,6 suffirait à rendre la boucle instable.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Identifier un vérin électrique à partir de relevés</h3>
  <div class="statement">On commande un vérin électrique par une tension sinusoïdale d'amplitude \(E_m = 2\ \text{V}\) autour de son point de fonctionnement, et l'on relève à l'oscilloscope la tension de sa génératrice tachymétrique (image de la vitesse) : amplitude \(S_m\) et retard \(\Delta t\) de ses maximums sur ceux de l'entrée, en régime permanent.
    <div style="overflow-x:auto"><table>
      <tr><th>\(f\) (Hz)</th><th>0,2</th><th>1</th><th>3,18</th><th>10</th></tr>
      <tr><td>\(S_m\) (V)</td><td>4,99</td><td>4,77</td><td>3,54</td><td>1,52</td></tr>
      <tr><td>\(\Delta t\) (ms)</td><td>60</td><td>58</td><td>49</td><td>30</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>Q1.</strong> Calculer, pour chaque mesure, la pulsation, le gain en décibels et la phase en degrés.</div>
  <div class="q"><strong>Q2.</strong> Proposer un modèle du premier ordre \(\dfrac{K}{1 + \tau p}\) en identifiant \(K\) et \(\tau\) sur le gain. Vérifier le gain prévu à 10 Hz.</div>
  <div class="q"><strong>Q3.</strong> Comparer la phase mesurée à celle du modèle. Montrer qu'il faut lui ajouter un retard pur, et estimer ce retard.</div>
  <div class="q"><strong>Q4.</strong> Pourquoi l'amplitude d'entrée doit-elle être modérée ? Pourquoi répartir les fréquences d'essai en échelle logarithmique ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega = 2\pi f\), \(G = 20\log(S_m/2)\), \(\varphi = -360°\,f\,\Delta t\) (sortie en retard). On trouve \(\omega\) ≈ 1,26 ; 6,28 ; 20,0 ; 62,8 rad/s, \(G\) ≈ 7,9 ; 7,5 ; 5,0 ; \(-2{,}4\) dB et \(\varphi\) ≈ \(-4{,}3°\) ; \(-20{,}9°\) ; \(-56{,}1°\) ; \(-108°\).</p>
    <p><strong>Q2.</strong> Aux basses fréquences, le gain tend vers 7,9 dB : \(K \approx 10^{7{,}9/20} \approx 2{,}5\). À 3,18 Hz, le gain vaut 5,0 dB, soit 3 dB sous le palier : c'est la cassure, \(1/\tau = 20\ \text{rad/s}\) et \(\tau = 0{,}05\ \text{s}\). À 10 Hz, le modèle prévoit \(\dfrac{2{,}5}{\sqrt{1 + (0{,}05 \times 62{,}8)^2}} \approx 0{,}76\), soit \(-2{,}4\) dB : le gain est bien décrit.</p>
    <p><strong>Q3.</strong> Le modèle donne \(-\arctan(0{,}05\,\omega)\) : \(-3{,}6°\) ; \(-17{,}4°\) ; \(-45{,}0°\) ; \(-72{,}3°\). Il manque 0,7° ; 3,5° ; 11,1° ; 35,7°, un excès de phase proportionnel à \(\omega\) (il est multiplié par 5 quand \(\omega\) l'est, puis par 3,2) alors que le gain est correct : c'est un retard pur. En radians, \(\omega T \approx 0{,}623\) à 62,8 rad/s, d'où \(T \approx 10\ \text{ms}\) (les autres points donnent 9,7 ms). Modèle retenu : \(H(p) = \dfrac{2{,}5\,e^{-0{,}01p}}{1 + 0{,}05p}\).</p>
    <p><strong>Q4.</strong> Une amplitude trop forte ferait saturer l'actionneur (courant, vitesse maximale) : la sortie ne serait plus sinusoïdale et le modèle linéaire n'aurait plus de sens ; trop faible, la mesure serait noyée dans le bruit. Le Bode se trace en échelle logarithmique : des fréquences réparties en progression géométrique (ici à peu près un rapport 3 à 5) donnent des points régulièrement espacés sur le diagramme, et l'on en ajoute autour de la cassure.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Bande passante d'un asservissement</h3>
  <div class="statement">Un asservissement à retour unitaire a pour FTBO \(H_{BO}(p) = \dfrac{16}{p\,(1 + 0{,}25p)}\) (pulsations en rad/s).</div>
  <div class="q"><strong>Q1.</strong> Calculer la pulsation de coupure à 0 dB \(\omega_{c0}\) de la FTBO et sa marge de phase.</div>
  <div class="q"><strong>Q2.</strong> Écrire la FTBF sous forme canonique ; en déduire \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q3.</strong> La FTBF présente-t-elle une résonance ? Calculer sa bande passante à \(-3\) dB en montrant que \(u = \omega/\omega_0\) y vérifie \(u^4 - 2(1 - 2\xi^2)\,u^2 - 1 = 0\). Comparer à \(\omega_{c0}\).</div>
  <div class="q"><strong>Q4.</strong> On divise le gain de la FTBO par 4. Reprendre \(\omega_{c0}\), \(M_\varphi\), \(\xi\) et la bande passante, et commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{16}{\omega\sqrt{1 + \omega^2/16}} = 1\) donne \(\dfrac{\omega^4}{16} + \omega^2 - 256 = 0\), d'où \(\omega^2 = 8\,(\sqrt{65} - 1) \approx 56{,}5\) et \(\omega_{c0} \approx 7{,}52\ \text{rad/s}\). Phase : \(-90° - \arctan(0{,}25 \times 7{,}52) \approx -152°\), donc \(M_\varphi \approx 28°\) : marge faible.</p>
    <p><strong>Q2.</strong> \(H_{BF} = \dfrac{16}{0{,}25p^2 + p + 16} = \dfrac{1}{1 + \frac{p}{16} + \frac{p^2}{64}}\) : gain 1, \(\omega_0 = 8\ \text{rad/s}\), \(\dfrac{2\xi}{\omega_0} = \dfrac{1}{16}\) donc \(\xi = 0{,}25\).</p>
    <p><strong>Q3.</strong> \(\xi \lt 0{,}71\) : résonance en \(\omega_r = 8\sqrt{1 - 2 \times 0{,}0625} \approx 7{,}5\ \text{rad/s}\), de facteur \(\dfrac{1}{2\xi\sqrt{1 - \xi^2}} \approx 2{,}07\) (+6,3 dB). Le gain vaut \(-3\) dB quand \(|H_{BF}|^2 = \dfrac{1}{(1 - u^2)^2 + 4\xi^2u^2} = \dfrac12\), soit \(u^4 - 2(1 - 2\xi^2)\,u^2 - 1 = 0\) ; la racine positive est \(u^2 = 0{,}875 + \sqrt{0{,}875^2 + 1} \approx 2{,}204\), d'où \(u \approx 1{,}48\) et \(\omega_{-3\,dB} \approx 11{,}9\ \text{rad/s}\), environ \(1{,}6\,\omega_{c0}\).</p>
    <p><strong>Q4.</strong> Avec un gain 4 : \(\dfrac{\omega^4}{16} + \omega^2 - 16 = 0\) donne \(\omega_{c0} \approx 3{,}14\ \text{rad/s}\) et \(M_\varphi \approx 90° - \arctan 0{,}79 \approx 52°\). FTBF : \(\omega_0 = 4\ \text{rad/s}\), \(\xi = 0{,}5\) ; résonance de 1,25 dB seulement ; \(u^2 = 0{,}5 + \sqrt{1{,}25} \approx 1{,}618\), bande passante \(\approx 5{,}1\ \text{rad/s}\). La boucle est deux fois plus lente (bande passante 5,1 au lieu de 11,9 rad/s) mais bien mieux amortie : c'est le compromis rapidité / stabilité qu'arbitrent les marges.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Un deuxième ordre très amorti</h3>
  <div class="statement">\(H(p) = \dfrac{5}{1 + 0{,}6p + 0{,}05p^2}\) (pulsations en rad/s).</div>
  <div class="q"><strong>Q1.</strong> Identifier \(K\), \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q2.</strong> Factoriser le dénominateur et tracer le diagramme asymptotique du gain.</div>
  <div class="q"><strong>Q3.</strong> Calculer le gain réel et la phase en \(\omega_0\). Comparer avec les asymptotes de la question 2, puis avec celles, à une seule cassure en \(\omega_0\), d'un deuxième ordre. Quelles asymptotes faut-il tracer ?</div>
  <div class="q"><strong>Q4.</strong> Calculer gain réel et phase en 2 et en 10 rad/s.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(K = 5\) (14 dB) ; \(1/\omega_0^2 = 0{,}05\) donc \(\omega_0 = \sqrt{20} \approx 4{,}47\ \text{rad/s}\) ; \(2\xi/\omega_0 = 0{,}6\) donc \(\xi \approx 1{,}34\).</p>
    <p><strong>Q2.</strong> \(\xi \gt 1\) : les racines de \(0{,}05p^2 + 0{,}6p + 1\) sont \(-2\) et \(-10\), d'où \((1 + 0{,}5p)(1 + 0{,}1p)\). Asymptotes : palier à 14 dB jusqu'à 2 rad/s, pente \(-20\) dB/déc de 2 à 10 rad/s (on arrive à 0 dB), pente \(-40\) dB/déc au-delà.</p>
    <p><strong>Q3.</strong> En \(\omega_0\), \(|H| = K/(2\xi) = 5/2{,}68 \approx 1{,}86\), soit 5,4 dB, et \(\varphi = -90°\). Les asymptotes à deux cassures donnent \(14 - 20\log(4{,}47/2) \approx 7{,}0\) dB : écart de \(-1{,}6\) dB, les deux cassures étant assez proches pour que leurs corrections s'ajoutent. L'asymptote à une seule cassure en \(\omega_0\) donne 14 dB, à 8,6 dB de la courbe réelle : pour \(\xi \geq 1\), on trace les deux premiers ordres, beaucoup plus fidèles.</p>
    <p><strong>Q4.</strong> En 2 rad/s : \(|H| = \dfrac{5}{\sqrt{1 + 1}\,\sqrt{1 + 0{,}04}} \approx 3{,}47\), soit 10,8 dB (3,2 dB sous l'asymptote), et \(\varphi = -45° - 11{,}3° \approx -56{,}3°\). En 10 rad/s : \(-3{,}2\) dB (asymptote 0 dB) et \(\varphi = -78{,}7° - 45° \approx -123{,}7°\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Identification fréquentielle d'un axe motorisé</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>réponse fréquentielle</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    On relève la réponse fréquentielle d'un axe motorisé entre sa tension de commande et sa position mesurée :
    <div style="overflow-x:auto"><table>
      <tr><th>\(\omega\) (rad/s)</th><th>1</th><th>2</th><th>20</th><th>200</th></tr>
      <tr><td>gain (dB)</td><td>12,0</td><td>6,0</td><td>−17,0</td><td>−54,0</td></tr>
      <tr><td>phase (°)</td><td>−92,9</td><td>−95,7</td><td>−135,0</td><td>−174,3</td></tr>
    </table></div>
  </div>
  <p class="exo-part">Partie A — Identification</p>
  <div class="q"><strong>A1.</strong> Justifier la présence d'un intégrateur et estimer le gain \(K\).</div>
  <div class="q"><strong>A2.</strong> Montrer qu'un modèle \(H(p) = \dfrac{K}{p\,(1 + \tau p)}\) convient et déterminer \(\tau\). Vérifier le modèle sur le point à 200 rad/s.</div>
  <p class="exo-part">Partie B — Mise en boucle</p>
  <div class="q"><strong>B1.</strong> L'axe est bouclé par un retour unitaire. Calculer la pulsation de coupure à 0 dB de la boucle ouverte, la phase correspondante et la marge de phase.</div>
  <div class="q"><strong>B2.</strong> Écrire la fonction de transfert en boucle fermée sous forme canonique. Le positionnement présentera-t-il un dépassement ?</div>
  <p class="exo-part">Partie C — Bande passante de l'axe asservi</p>
  <div class="q"><strong>C1.</strong> Factoriser la FTBF en deux premiers ordres et tracer son diagramme asymptotique de gain.</div>
  <div class="q"><strong>C2.</strong> Calculer la bande passante à \(-3\) dB de la boucle fermée et la comparer à la pulsation de coupure à 0 dB de la boucle ouverte.</div>
  <p class="exo-part">Partie D — Commande numérique</p>
  <div class="q"><strong>D1.</strong> La commande est maintenant calculée par un microcontrôleur, qui ajoute un retard \(T = 20\ \text{ms}\) dans la boucle. Que deviennent le diagramme de gain de la FTBO, sa pulsation de coupure à 0 dB et la marge de phase ?</div>
  <div class="q"><strong>D2.</strong> Le cahier des charges impose \(M_\varphi \geq 45°\). Quel retard la boucle peut-elle tolérer au maximum ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Entre 1 et 2 rad/s, le gain perd 6 dB par octave (soit \(-20\) dB/déc) et la phase est proche de \(-90°\) : comportement d'intégrateur. En \(\omega = 1\), le gain d'un intégrateur \(K/p\) vaut \(20\log K\) : \(K = 10^{12/20} \approx 4\ \text{s}^{-1}\).</p>
    <p><strong>A2.</strong> La phase atteint \(-135°\) en 20 rad/s : le premier ordre y apporte \(-45°\), c'est sa cassure, donc \(\tau = 1/20 = 0{,}05\ \text{s}\). Contrôle à 200 rad/s : \(|H| = \dfrac{4}{200\sqrt{1 + 100}} \approx 1{,}99\times 10^{-3}\), soit \(-54\) dB, et \(\varphi = -90° - \arctan 10 = -174{,}3°\) : le modèle convient.</p>
    <p><strong>B1.</strong> \(\dfrac{4}{\omega\sqrt{1 + 0{,}0025\,\omega^2}} = 1\) donne \(0{,}0025\,\omega^4 + \omega^2 - 16 = 0\), d'où \(\omega^2 \approx 15{,}4\) et \(\omega_{c0} \approx 3{,}9\ \text{rad/s}\). Phase : \(-90° - \arctan(0{,}05 \times 3{,}9) \approx -101°\), donc \(M_\varphi \approx 79°\).</p>
    <p><strong>B2.</strong> \(H_{BF}(p) = \dfrac{4}{0{,}05p^2 + p + 4}\), soit \(H_{BF}(p) = \dfrac{1}{1 + 0{,}25p + 0{,}0125p^2}\) : \(\omega_0 = \sqrt{80} \approx 8{,}9\ \text{rad/s}\) et \(\xi = \dfrac{0{,}25\,\omega_0}{2} \approx 1{,}12\). Comme \(\xi \gt 1\), la réponse est apériodique : aucun dépassement.</p>
    <p><strong>C1.</strong> Les racines de \(0{,}0125p^2 + 0{,}25p + 1\) sont \(p \approx -5{,}53\) et \(-14{,}47\ \text{s}^{-1}\) : \(H_{BF}(p) = \dfrac{1}{(1 + 0{,}181p)(1 + 0{,}069p)}\). Asymptotes : 0 dB jusqu'à 5,5 rad/s, \(-20\) dB/déc jusqu'à 14,5 rad/s, \(-40\) dB/déc au-delà ; pas de résonance.</p>
    <p><strong>C2.</strong> \(|H_{BF}(j\omega)| = 1/\sqrt2\) se résout numériquement : \(\omega_{-3\,dB} \approx 4{,}9\ \text{rad/s}\), un peu sous la première cassure (les deux cassures, proches, se cumulent). C'est environ \(1{,}25\,\omega_{c0}\) : on retrouve que la bande passante de la boucle fermée est du même ordre que la pulsation de coupure à 0 dB de la boucle ouverte.</p>
    <p><strong>D1.</strong> Le retard ne modifie pas le gain : même diagramme de gain, même \(\omega_{c0} \approx 3{,}93\ \text{rad/s}\). Il retire à la phase \(\omega_{c0}T = 3{,}93 \times 0{,}02 \approx 0{,}079\ \text{rad} = 4{,}5°\) : \(M_\varphi \approx 79° - 4{,}5° \approx 74°\). Sur un axe aussi lent, 20 ms de retard sont presque sans effet.</p>
    <p><strong>D2.</strong> Le retard peut consommer au plus \(79° - 45° = 34°\), soit 0,59 rad, à la pulsation \(\omega_{c0}\) : \(T_{max} = 0{,}59/3{,}93 \approx 0{,}15\ \text{s}\).</p>
  </div>
</div>
