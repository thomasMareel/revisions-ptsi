      <h2>Réagir à l'oral &amp; gagner du temps</h2>
      <div class="intro">À l'oral, un blanc se gère : ces amorces servent à <strong>réfléchir tout en parlant</strong>, à se corriger et à relancer sans rester muet.</div>
      <div class="prop-box"><strong>Temporiser</strong> : Well, let me think… · That's an interesting question. · Let me see… · Let me put it this way…</div>
      <div class="prop-box"><strong>Hésiter naturellement</strong> : Well… · You see… · I mean… · Let's say…</div>
      <div class="sec-num" style="margin-top:1.5rem">§2 · NUANCER &amp; SE CORRIGER</div>
      <div class="prop-box"><strong>Incertitude</strong> : I'm not entirely sure, but… · I might be wrong, but… · As far as I know…</div>
      <div class="prop-box"><strong>Se reprendre</strong> : What I meant was… · Or rather… · Let me rephrase that.</div>
      <div class="sec-num" style="margin-top:1.5rem">§3 · INTERAGIR</div>
      <div class="prop-box"><strong>Avec l'examinateur</strong> : Could you repeat the question, please? · If I understood correctly… · Does that answer your question?</div>
      <div class="notice">Quand on sèche : <em>« It's a tricky issue, there's no easy answer, but I'd argue that… »</em> — on gagne du temps tout en relançant.</div>
