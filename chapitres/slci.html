<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre ouvre l'automatique du semestre S1 (compétence B2 « Modéliser ») : décrire un système linéaire par une équation différentielle, puis par une <strong>fonction de transfert</strong>, grâce à la transformée de Laplace. Tout le groupe Automatique en dépend : <a href="#schblocs/cours">« Schéma-blocs et systèmes asservis »</a> assemble les fonctions de transfert ; <a href="#sys1/cours">« Systèmes du 1er ordre »</a>, <a href="#sys2/cours">« Systèmes du 2e ordre »</a> et <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a> étudient les modèles de référence du §5 ; <a href="#stabilite/cours">« Stabilité des systèmes asservis »</a> et <a href="#precision/cours">« Performances : précision et rapidité »</a> reposent sur les pôles (§4) et sur le théorème de la valeur finale (§2, §7).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Établir un modèle de connaissance par des fonctions de transfert</strong> (B2, S1) : systèmes linéaires continus et invariants, causalité (§1) ; modélisation par équations différentielles (§1, §6) ; transformées de Laplace (§2) ; fonction de transfert, forme canonique, gain, ordre, classe, pôles et zéros (§3).</li>
        <li><strong>Modéliser le signal d'entrée</strong> (B2, S1) : impulsion, échelon, rampe, signaux périodiques (§2, §7).</li>
        <li><strong>Établir un modèle de comportement</strong> (B2, S2) : premier ordre, deuxième ordre, dérivateur, intégrateur, gain et retard, allure de leurs réponses (§5) ; paramètres caractéristiques et identification sur une réponse : chapitres du 1er et du 2e ordre.</li>
        <li><strong>Déterminer la réponse temporelle</strong> (C2, S1) : allures et expressions des réponses des systèmes d'ordre 1 et 2 (§5, puis chapitres du 1er et du 2e ordre) ; simulation numérique en Python (§8, lien avec l'informatique).</li>
        <li><strong>Déterminer les performances d'un système</strong> (C2, S2), premiers outils : théorème de la valeur finale (§2, §7), position des pôles dans le plan complexe (§4) ; la suite dans « Stabilité » et « Performances ».</li>
        <li><strong>Identifier les grandeurs physiques d'effort et de flux</strong> (D1, S2) : §6.</li>
      </ul>
      <p>Le programme précise que les théorèmes de la valeur initiale, de la valeur finale et du retard sont <strong>donnés sans démonstration</strong>, et que <strong>la résolution des équations différentielles et la transformée de Laplace inverse ne sont pas au programme</strong> : la décomposition en éléments simples du §4 est un outil de compréhension, non exigible ; ce que l'on doit savoir tirer de \(S(p)\) sans revenir au temps est au §7. Relèvent de la 2ᵉ année (S3-S4), et sont signalés sur place : la linéarisation autour d'un point de fonctionnement, les non-linéarités comme limites de validité d'un modèle (§1), les pôles dominants et la réduction de l'ordre d'un modèle (§4).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LES SYSTÈMES LINÉAIRES CONTINUS ET INVARIANTS</div>
  <h2>Ce que l'on modélise</h2>
  <div class="intro">Un système automatique transforme une grandeur d'<strong>entrée</strong> \(e(t)\) (consigne, tension de commande, couple, débit…) en grandeur de <strong>sortie</strong> \(s(t)\) (position, vitesse, température, niveau…). Pour prévoir ses performances avant de le construire, ou pour régler sa commande, on cherche un <strong>modèle</strong> : une relation mathématique entre \(e\) et \(s\). Toute l'automatique de première année se place dans un cadre précis, celui des SLCI, où cette relation est une équation différentielle linéaire à coefficients constants.</div>

  <div class="def-box">
    Un système est :
    <ul>
      <li><strong>continu</strong> si ses grandeurs sont définies à chaque instant (par opposition aux systèmes échantillonnés, étudiés en deuxième année avec les systèmes numériques) ;</li>
      <li><strong>invariant</strong> si ses caractéristiques ne changent pas au cours du temps : la même entrée appliquée plus tard donne la même sortie, décalée d'autant ;</li>
      <li><strong>linéaire</strong> s'il vérifie le <strong>principe de superposition</strong> : si \(e_1\) donne \(s_1\) et \(e_2\) donne \(s_2\), alors \(\lambda e_1 + \mu e_2\) donne \(\lambda s_1 + \mu s_2\).</li>
    </ul>
    Un système linéaire, continu et invariant (<strong>SLCI</strong>) est régi par une équation différentielle de la forme
    <div class="formula" data-nom="Équation d'un SLCI">$$a_n\frac{d^n s}{dt^n} + \cdots + a_1\frac{ds}{dt} + a_0\,s = b_m\frac{d^m e}{dt^m} + \cdots + b_1\frac{de}{dt} + b_0\,e,$$</div>
    à coefficients \(a_i\), \(b_j\) réels et constants, avec \(m \leq n\) pour un système physique. L'entier \(n\) est l'<strong>ordre</strong> du système.
  </div>
  <div class="prop-box">
    <strong>Ce que la linéarité permet.</strong> Doubler l'entrée double la sortie : la <em>forme</em> d'une réponse ne dépend pas de l'amplitude de l'entrée, et la réponse à une somme d'entrées (une consigne et une perturbation, par exemple) est la somme des réponses à chacune. C'est ce qui rend les calculs des chapitres suivants possibles.
  </div>

  <h3>Causalité</h3>
  <div class="def-box">
    Un système est <strong>causal</strong> si sa sortie à l'instant \(t\) ne dépend que des valeurs de l'entrée aux instants antérieurs ou égaux à \(t\) : l'effet ne précède jamais la cause. Tout système physique est causal. Pour l'équation d'un SLCI, cela impose \(m \leq n\) : l'entrée n'est jamais dérivée plus de fois que la sortie.
  </div>
  <p>Pourquoi \(m \leq n\) ? Avec \(s = \dfrac{de}{dt}\) (\(m = 1\), \(n = 0\)), un échelon d'entrée donnerait une sortie infinie à l'instant du saut. Aucun système réel ne réagit ainsi : une grandeur qui stocke de l'énergie (tension d'un condensateur, vitesse d'une masse, température d'une paroi) ne varie que continûment. Le dérivateur pur du §5 n'est qu'une idéalisation, valable sur une plage de pulsations limitée.</p>
  <div class="method-box">
    <strong>Exemple — reconnaître un SLCI</strong>
    <ol>
      <li>\(0{,}2\,s'(t) + s(t) = 3\,e(t)\) : termes linéaires, coefficients constants, \(m = 0 \leq n = 1\) : SLCI causal du premier ordre.</li>
      <li>\(s(t) = e(t)^2\) : l'entrée 1 donne 1, l'entrée 2 donne 4 et non 2 : <strong>non linéaire</strong>.</li>
      <li>\(s'(t) + (1 + 0{,}1\,t)\,s(t) = e(t)\) : linéaire, mais un coefficient dépend du temps : <strong>non invariant</strong> (le même essai refait une heure plus tard ne donne pas la même réponse).</li>
      <li>\(s'(t) + 2\,s(t) = e(t + 0{,}5)\) : la sortie à l'instant \(t\) dépend de l'entrée une demi-seconde plus tard : <strong>non causal</strong>, donc irréalisable.</li>
      <li>\(s(t) = e(t - 0{,}5)\) : linéaire, invariant et causal. Ce <strong>retard pur</strong> est un SLCI au sens large, bien qu'il ne s'écrive pas comme une équation différentielle d'ordre fini (§5).</li>
    </ol>
  </div>

  <div class="notice"><strong>Hors programme en PTSI (vu en 2ᵉ année)</strong> : les deux sous-parties qui suivent. L'étude des non-linéarités comme limites de validité d'un modèle (S4) et la linéarisation autour d'un point de fonctionnement (S3) sont au programme de PT ; en PTSI, un sujet fournit directement le modèle linéaire. Il est utile de savoir dès maintenant d'où il vient.</div>
  <h3>Les non-linéarités usuelles</h3>
  <p>Aucun système réel n'est parfaitement linéaire. Les écarts les plus fréquents sont la <strong>saturation</strong> (tension maximale d'un amplificateur, couple maximal d'un moteur), le <strong>seuil</strong> ou zone morte (un frottement sec impose une commande minimale avant tout mouvement) et l'<strong>hystérésis</strong> (jeu dans un engrenage, thermostat à deux seuils). Le modèle SLCI reste pertinent tant que le système travaille loin de ces zones ; on vérifie ensuite par simulation que la commande ne sature pas.</p>

  <h3>Linéariser autour d'un point de fonctionnement</h3>
  <p>Quand la physique donne une équation non linéaire, on étudie les <strong>petites variations</strong> autour d'un état d'équilibre : on remplace la fonction non linéaire par sa tangente en ce point.</p>
  <div class="method-box">
    <strong>Exemple — un réservoir qui se vide</strong>
    <p>Un réservoir de section \(S\) reçoit un débit \(q_e(t)\) et se vide par un orifice de fond, avec un débit \(q_s = k\sqrt{h}\) (loi de Torricelli). Le bilan de volume s'écrit \(S\,\dfrac{dh}{dt} = q_e - k\sqrt{h}\) : il n'est pas linéaire à cause de \(\sqrt{h}\).</p>
    <ol>
      <li>Point de fonctionnement : à l'équilibre, \(h = h_0\) et \(q_{e0} = k\sqrt{h_0}\).</li>
      <li>Petites variations : \(h = h_0 + \Delta h\), \(q_e = q_{e0} + \Delta q\), et la tangente donne \(\sqrt{h} \approx \sqrt{h_0} + \dfrac{\Delta h}{2\sqrt{h_0}}\).</li>
      <li>Modèle linéarisé : \(S\,\dfrac{d\Delta h}{dt} + \dfrac{k}{2\sqrt{h_0}}\,\Delta h = \Delta q\), soit \(\tau\,\dfrac{d\Delta h}{dt} + \Delta h = K\,\Delta q\) avec \(\tau = \dfrac{2S\sqrt{h_0}}{k}\) et \(K = \dfrac{2\sqrt{h_0}}{k}\).</li>
      <li>Lecture : pour les variations, le réservoir est un SLCI du premier ordre, mais ses paramètres dépendent du point choisi. Plus le réservoir est rempli, plus il réagit lentement.</li>
      <li>Application : \(S = 2{,}0\ \text{m}^2\), \(k = 0{,}050\ \text{m}^{5/2}\cdot\text{s}^{-1}\) et \(h_0 = 0{,}64\ \text{m}\) donnent \(\sqrt{h_0} = 0{,}80\), \(q_{e0} = 0{,}040\ \text{m}^3/\text{s}\), \(\tau = 64\ \text{s}\) et \(K = 32\ \text{s}\cdot\text{m}^{-2}\) : un excès de débit de 1 L/s finit par élever le niveau de \(32 \times 10^{-3} = 3{,}2\) cm.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LA TRANSFORMÉE DE LAPLACE</div>
  <h2>Remplacer les dérivées par des produits</h2>
  <div class="intro">Résoudre à la main une équation différentielle d'ordre trois avec un second membre quelconque est long et peu parlant. La transformée de Laplace remplace chaque dérivation par une multiplication par une variable \(p\) : l'équation différentielle devient une équation <strong>algébrique</strong>, que l'on manipule comme une fraction. On revient au temps à la fin grâce à une table ou, le plus souvent, on lit directement sur la transformée ce que l'on cherche (§7).</div>

  <div class="def-box">
    Une fonction \(f\) est <strong>causale</strong> si \(f(t) = 0\) pour \(t \lt 0\) : on observe le système à partir d'un instant initial pris comme origine. Sa <strong>transformée de Laplace</strong> est la fonction de la variable complexe \(p\)
    <div class="formula" data-nom="Transformée de Laplace">$$F(p) = \mathcal{L}\big[f(t)\big] = \int_0^{+\infty} f(t)\,e^{-pt}\,dt.$$</div>
    On note \(f(t) \longleftrightarrow F(p)\) ; par convention, minuscules pour les fonctions du temps, majuscules pour leurs transformées. L'exposant \(pt\) est sans dimension : \(p\) s'exprime en \(\text{s}^{-1}\), si bien que \(\tau p\) ou \(p/\omega_0\) sont sans dimension.
  </div>
  <div class="prop-box">
    <strong>Propriétés</strong> (\(f\) causale, \(F = \mathcal{L}[f]\)) :
    <ul>
      <li><strong>Linéarité</strong> : \(\mathcal{L}[\lambda f + \mu g] = \lambda F + \mu G\).</li>
      <li><strong>Dérivation</strong> : \(\mathcal{L}[f'] = p\,F(p) - f(0^+)\). Sous <strong>conditions initiales nulles</strong> (conditions de Heaviside : \(f\) et ses dérivées successives nulles en \(0^+\)), dériver revient à multiplier par \(p\) :</li>
    </ul>
    <div class="formula" data-nom="Dérivation (conditions de Heaviside)">$$\mathcal{L}\big[f^{(n)}\big] = p^n\,F(p).$$</div>
    <ul>
      <li><strong>Intégration</strong> : \(\mathcal{L}\Big[\displaystyle\int_0^t f(u)\,du\Big] = \dfrac{F(p)}{p}\).</li>
      <li><strong>Retard</strong> : décaler \(f\) de \(T \gt 0\) multiplie sa transformée par \(e^{-Tp}\) : \(\mathcal{L}\big[f(t - T)\big] = e^{-Tp}\,F(p)\).</li>
      <li><strong>Amortissement</strong> : \(\mathcal{L}\big[e^{-at} f(t)\big] = F(p + a)\).</li>
    </ul>
  </div>

  <h3>Table des transformées usuelles</h3>
  <div style="overflow-x:auto"><table>
    <tr><th>Fonction causale \(f(t)\), pour \(t \geq 0\)</th><th>Transformée \(F(p)\)</th></tr>
    <tr><td>impulsion de Dirac \(\delta(t)\)</td><td>\(1\)</td></tr>
    <tr><td>échelon unité \(u(t)\)</td><td>\(\dfrac{1}{p}\)</td></tr>
    <tr><td>rampe unité \(t\)</td><td>\(\dfrac{1}{p^2}\)</td></tr>
    <tr><td>\(t^n\)</td><td>\(\dfrac{n!}{p^{n+1}}\)</td></tr>
    <tr><td>\(e^{-at}\)</td><td>\(\dfrac{1}{p + a}\)</td></tr>
    <tr><td>\(t\,e^{-at}\)</td><td>\(\dfrac{1}{(p + a)^2}\)</td></tr>
    <tr><td>\(\sin(\omega t)\)</td><td>\(\dfrac{\omega}{p^2 + \omega^2}\)</td></tr>
    <tr><td>\(\cos(\omega t)\)</td><td>\(\dfrac{p}{p^2 + \omega^2}\)</td></tr>
    <tr><td>\(e^{-at}\sin(\omega t)\)</td><td>\(\dfrac{\omega}{(p + a)^2 + \omega^2}\)</td></tr>
    <tr><td>\(e^{-at}\cos(\omega t)\)</td><td>\(\dfrac{p + a}{(p + a)^2 + \omega^2}\)</td></tr>
  </table></div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Retrouver deux lignes de la table à partir de la définition.</span>
    <div class="content"><p>Pour \(f(t) = e^{-at}\) et \(\operatorname{Re}(p) \gt -a\) :</p>
<div class="formula">$$F(p) = \int_0^{+\infty} e^{-(p+a)t}\,dt = \Big[\frac{-e^{-(p+a)t}}{p+a}\Big]_0^{+\infty} = \frac{1}{p + a}.$$</div>
<p>Avec \(a = 0\), on obtient l'échelon : \(\mathcal{L}[u] = 1/p\). La rampe \(t\) est l'intégrale de l'échelon, donc sa transformée est \(\dfrac{1}{p}\cdot\dfrac{1}{p} = \dfrac{1}{p^2}\) par la propriété d'intégration ; de même \(t\,e^{-at}\) se déduit de \(t\) par la propriété d'amortissement.</p></div>
  </div>

  <h3>Théorèmes des valeurs initiale et finale</h3>
  <div class="prop-box">
    Ils donnent le début et la fin d'une réponse <strong>sans revenir au temps</strong> :
    <div class="formula" data-nom="Valeur initiale">$$\lim_{t \to 0^+} f(t) = \lim_{p \to +\infty} p\,F(p),$$</div>
    <div class="formula" data-nom="Valeur finale">$$\lim_{t \to +\infty} f(t) = \lim_{p \to 0} p\,F(p).$$</div>
  </div>
  <div class="notice">Le théorème de la valeur finale suppose que \(f(t)\) a une limite finie, c'est-à-dire que tous les pôles de \(p\,F(p)\) sont à partie réelle strictement négative. Avec \(F(p) = \dfrac{1}{p - 1}\), le calcul aveugle donne \(\lim p\,F(p) = 0\), alors que \(f(t) = e^{t}\) diverge. On vérifie donc toujours la stabilité <em>avant</em> d'appliquer le théorème.</div>
  <div class="method-box">
    <strong>Exemple — début et fin d'un signal, lus sur sa transformée</strong>
    <p>\(F(p) = \dfrac{3p + 2}{p\,(p + 4)}\).</p>
    <ol>
      <li>Valeur initiale : \(f(0^+) = \lim\limits_{p \to +\infty} \dfrac{3p + 2}{p + 4} = 3\).</li>
      <li>Les pôles de \(p\,F(p) = \dfrac{3p + 2}{p + 4}\) se réduisent à \(-4\), à partie réelle négative : la limite finale existe, et \(f(+\infty) = \lim\limits_{p \to 0} \dfrac{3p + 2}{p + 4} = \dfrac{2}{4} = 0{,}5\).</li>
      <li>Contrôle (avec la table, voir §4) : \(f(t) = 0{,}5 + 2{,}5\,e^{-4t}\) vaut bien 3 en \(0\) et tend vers 0,5.</li>
    </ol>
  </div>

  <h3>Les signaux tests</h3>
  <p>Pour comparer des systèmes, on leur applique des entrées normalisées. L'<strong>échelon</strong> \(e(t) = E_0\,u(t)\), de transformée \(E_0/p\), modélise une mise en marche ou une consigne constante. La <strong>rampe</strong> \(e(t) = a\,t\), de transformée \(a/p^2\), modélise une consigne de vitesse : c'est le test de poursuite. L'<strong>impulsion</strong>, de transformée 1, modélise un choc bref. L'entrée <strong>sinusoïdale</strong> sert à la réponse fréquentielle (chapitre « Réponse fréquentielle et diagrammes de Bode »).</p>

  <p>Un <strong>signal périodique</strong> quelconque est une somme de sinusoïdes (sa série de Fourier, chapitre de physique <a href="#signaux/cours">« Signaux périodiques et spectres »</a>) : par linéarité, connaître la réponse d'un SLCI à chaque sinusoïde suffit (§7).</p>
  <div class="method-box">
    <strong>Exemple — une consigne en rampe saturée</strong>
    <p>La consigne d'une tension de commande monte de 4 V/s pendant \(T = 0{,}5\ \text{s}\), puis reste à 2 V.</p>
    <ol>
      <li>On l'écrit comme une somme de signaux tests décalés : \(e(t) = 4\,t\,u(t) - 4\,(t - 0{,}5)\,u(t - 0{,}5)\). À partir de \(0{,}5\) s, la seconde rampe compense exactement la première.</li>
      <li>Linéarité et théorème du retard : \(E(p) = \dfrac{4}{p^2} - \dfrac{4\,e^{-0{,}5p}}{p^2} = \dfrac{4\,\big(1 - e^{-0{,}5p}\big)}{p^2}\).</li>
      <li>Contrôle par la valeur finale : quand \(p \to 0\), \(1 - e^{-0{,}5p} \approx 0{,}5\,p\), donc \(\lim\limits_{p \to 0} p\,E(p) = 4 \times 0{,}5 = 2\) V, la valeur du palier.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(e(t) = 4\,t\,u(t) - 4\,t\,u(t - 0{,}5)\). Ce signal tombe à 0 après \(0{,}5\) s ; c'est la rampe <strong>décalée</strong> \(4\,(t - 0{,}5)\) qu'il faut retrancher pour que le théorème du retard s'applique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LA FONCTION DE TRANSFERT</div>
  <h2>Un système résumé par une fraction</h2>
  <div class="def-box">
    Sous conditions de Heaviside, la transformée de l'équation du §1 s'écrit \((a_n p^n + \cdots + a_1 p + a_0)\,S(p) = (b_m p^m + \cdots + b_1 p + b_0)\,E(p)\). La <strong>fonction de transfert</strong> (ou transmittance) du système est
    <div class="formula" data-nom="Fonction de transfert">$$H(p) = \frac{S(p)}{E(p)} = \frac{N(p)}{D(p)} = \frac{b_m p^m + \cdots + b_1 p + b_0}{a_n p^n + \cdots + a_1 p + a_0}.$$</div>
    Elle ne dépend que du système, pas de l'entrée : quelle que soit l'entrée, \(S(p) = H(p)\,E(p)\).
  </div>
  <div class="prop-box">
    <strong>Forme canonique et vocabulaire.</strong> On factorise le terme de plus bas degré du numérateur et du dénominateur, de façon que les polynômes restants commencent par 1 :
    <div class="formula" data-nom="Forme canonique d'une FT">$$H(p) = \frac{K}{p^{\alpha}}\cdot\frac{1 + b_1 p + \cdots + b_m p^m}{1 + a_1 p + \cdots + a_{n-\alpha}\,p^{n-\alpha}}.$$</div>
    <ul>
      <li>les <strong>pôles</strong> sont les racines du dénominateur, les <strong>zéros</strong> celles du numérateur (après simplification) ;</li>
      <li>l'<strong>ordre</strong> \(n\) est le degré du dénominateur ;</li>
      <li>la <strong>classe</strong> \(\alpha\) est le nombre de pôles nuls, c'est-à-dire d'intégrateurs \(1/p\) ;</li>
      <li>\(K\) est le <strong>gain</strong> ; pour un système de classe 0, c'est le <strong>gain statique</strong> \(H(0)\), rapport sortie / entrée en régime permanent, avec l'unité de \(s\) divisée par celle de \(e\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — de l'équation à la fonction de transfert</strong>
    <p>Un système est régi par \(2\,s''(t) + 3\,s'(t) + s(t) = 4\,e(t)\).</p>
    <ol>
      <li>Transformée sous conditions initiales nulles : \((2p^2 + 3p + 1)\,S(p) = 4\,E(p)\).</li>
      <li>\(H(p) = \dfrac{4}{1 + 3p + 2p^2}\) est déjà sous forme canonique (terme constant égal à 1).</li>
      <li>Lecture : gain statique \(K = 4\), classe 0, ordre 2 ; comme \(1 + 3p + 2p^2 = (1 + p)(1 + 2p)\), les pôles sont \(-1\) et \(-\tfrac12\), et il n'y a pas de zéro.</li>
    </ol>
    <p>Autre exemple : \(H(p) = \dfrac{6p + 12}{p^3 + 4p^2} = \dfrac{12\,(1 + 0{,}5p)}{4p^2\,(1 + 0{,}25p)} = \dfrac{3}{p^2}\cdot\dfrac{1 + 0{,}5p}{1 + 0{,}25p}\) : gain 3, classe 2, ordre 3, un zéro en \(-2\), un pôle double en 0 et un pôle en \(-4\).</p>
  </div>
  <div class="notice">Toujours mettre sous forme canonique avant de lire le gain : dans \(H(p) = \dfrac{10}{p + 5}\), le gain statique vaut 2 et non 10, car \(H(p) = \dfrac{2}{1 + 0{,}2p}\).</div>
  <h3>La réponse impulsionnelle</h3>
  <p>Puisque \(\mathcal{L}[\delta] = 1\), la réponse à une impulsion a pour transformée \(H(p)\) elle-même : la fonction de transfert est la transformée de la <strong>réponse impulsionnelle</strong> \(h(t)\). Connaître l'une, c'est connaître l'autre, et donc connaître la réponse du système à n'importe quelle entrée. Par exemple, \(H(p) = \dfrac{2}{1 + 0{,}5p} = \dfrac{4}{p + 2}\) a pour réponse impulsionnelle \(h(t) = 4\,e^{-2t}\) (table) : un choc bref d'aire unité fait monter la sortie d'un coup à 4, puis la laisse redescendre avec la constante de temps \(0{,}5\) s.</p>
</div>

<div class="course-section">
  <div class="sec-num">§4 · REVENIR AU TEMPS</div>
  <h2>Décomposer, puis lire la table</h2>
  <div class="intro">\(S(p) = H(p)\,E(p)\) est une fraction rationnelle. Pour retrouver \(s(t)\), on la décompose en somme d'éléments simples dont l'original figure dans la table. Le coefficient associé à un pôle simple \(p_i\) s'obtient en multipliant \(S(p)\) par \((p - p_i)\), puis en remplaçant \(p\) par \(p_i\).</div>
  <div class="notice"><strong>Hors programme (pour aller plus loin)</strong> : le programme exclut la transformée de Laplace inverse et la résolution des équations différentielles. Aucun sujet ne demande donc de décomposer \(S(p)\) : il fournit l'expression temporelle, ou demande ce que l'on tire de \(S(p)\) sans revenir au temps (§7). Les trois exemples ci-dessous montrent d'où viennent les réponses-types des chapitres suivants. Est au programme, en revanche, le lien entre la position des pôles et l'allure de la réponse (encadré, exemple et figure de fin de section), base de l'étude de la stabilité.</div>
  <div class="method-box">
    <strong>Exemple 1 — un premier ordre soumis à un échelon</strong>
    <p>\(H(p) = \dfrac{2}{1 + 0{,}5p}\) et \(e(t)\) est un échelon unité.</p>
    <ol>
      <li>\(S(p) = \dfrac{2}{p\,(1 + 0{,}5p)} = \dfrac{4}{p\,(p + 2)}\) : on rend les dénominateurs unitaires pour décomposer.</li>
      <li>\(\dfrac{4}{p\,(p + 2)} = \dfrac{A}{p} + \dfrac{B}{p + 2}\) avec \(A = \Big[\dfrac{4}{p + 2}\Big]_{p = 0} = 2\) et \(B = \Big[\dfrac{4}{p}\Big]_{p = -2} = -2\).</li>
      <li>Table : \(s(t) = 2 - 2\,e^{-2t} = 2\,(1 - e^{-2t})\) pour \(t \geq 0\).</li>
      <li>Contrôles : \(\lim_{p \to +\infty} p\,S(p) = 0 = s(0)\) et \(\lim_{p \to 0} p\,S(p) = 2 = s(\infty)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple 2 — trois pôles réels</strong>
    <p>\(S(p) = \dfrac{6}{p\,(p + 1)(p + 3)} = \dfrac{A}{p} + \dfrac{B}{p + 1} + \dfrac{C}{p + 3}\).</p>
    <ol>
      <li>\(A = \dfrac{6}{1 \times 3} = 2\), \(B = \dfrac{6}{(-1)\times 2} = -3\), \(C = \dfrac{6}{(-3)\times(-2)} = 1\).</li>
      <li>\(s(t) = 2 - 3\,e^{-t} + e^{-3t}\), et \(s(0) = 2 - 3 + 1 = 0\) comme attendu.</li>
      <li>Le terme \(e^{-3t}\) s'éteint trois fois plus vite que \(e^{-t}\) : au bout de quelques secondes, seul compte le pôle \(-1\), le plus proche de l'axe imaginaire. C'est le <strong>pôle dominant</strong> (notion reprise en 2ᵉ année : réduction de l'ordre d'un modèle).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple 3 — une paire de pôles complexes</strong>
    <p>\(S(p) = \dfrac{5}{p\,(p^2 + 2p + 5)}\). Le trinôme a pour racines \(-1 \pm 2j\) : on garde l'élément de deuxième espèce entier.</p>
    <ol>
      <li>\(S(p) = \dfrac{A}{p} + \dfrac{Bp + C}{p^2 + 2p + 5}\) avec \(A = \dfrac{5}{5} = 1\). En réduisant au même dénominateur : \(5 = (p^2 + 2p + 5) + (Bp + C)\,p\), d'où \(B = -1\) et \(C = -2\).</li>
      <li>On fait apparaître \((p + 1)^2 + 4\) : \(\dfrac{p + 2}{(p + 1)^2 + 4} = \dfrac{p + 1}{(p + 1)^2 + 4} + \dfrac12\cdot\dfrac{2}{(p + 1)^2 + 4}\).</li>
      <li>Table : \(s(t) = 1 - e^{-t}\Big(\cos 2t + \dfrac12\sin 2t\Big)\) : une oscillation de pulsation 2 rad/s, amortie par \(e^{-t}\), autour de la valeur finale 1.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Les pôles décident de l'allure.</strong> Chaque pôle \(p_i\) fait apparaître dans la réponse un terme en \(e^{p_i t}\) :
    <ul>
      <li>pôle réel négatif \(-a\) : terme \(e^{-at}\), qui s'éteint, à 5 % près, au bout de \(3/a\) ;</li>
      <li>paire complexe \(-a \pm j\omega\) : oscillation de pulsation \(\omega\) amortie par \(e^{-at}\) ;</li>
      <li>pôle à partie réelle positive : terme divergent, le système est <strong>instable</strong> ;</li>
      <li>pôle nul : terme constant (en \(t\) s'il est double) ; paire imaginaire pure \(\pm j\omega\) : oscillation entretenue.</li>
    </ul>
    Plus un pôle est loin à gauche, plus son terme disparaît vite : l'allure à long terme est fixée par le ou les pôles dominants.
  </div>

  <div class="method-box">
    <strong>Exemple — prévoir l'allure par les seuls pôles</strong>
    <ol>
      <li>\(H_1(p) = \dfrac{10}{p^2 + 0{,}4\,p + 4}\) : pôles \(-0{,}2 \pm 1{,}99\,j\). Stable ; oscillation de pulsation 1,99 rad/s (pseudo-période \(2\pi/1{,}99 \approx 3{,}2\) s), amortie par \(e^{-0{,}2t}\), qui s'éteint à 5 % près en \(3/0{,}2 = 15\) s : on voit près de cinq oscillations.</li>
      <li>\(H_2(p) = \dfrac{3}{(p - 0{,}5)(p + 2)}\) : le pôle \(+0{,}5\) donne un terme en \(e^{0{,}5t}\), qui double toutes les \(\ln 2/0{,}5 \approx 1{,}4\) s : instable, quelle que soit l'entrée.</li>
    </ol>

<div class="course-section">
  <div class="sec-num">§5 · LES MODÈLES DE RÉFÉRENCE</div>
  <h2>Six briques pour tout décrire</h2>
  <div class="intro">En factorisant numérateur et dénominateur, toute fonction de transfert de SLCI devient un produit de quelques briques élémentaires. Les connaître par cœur, avec leur réponse à un échelon \(E_0\), suffit à lire la plupart des modèles. Les chapitres suivants les étudient une à une.</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Modèle</th><th>Équation</th><th>Fonction de transfert</th><th>Réponse à un échelon \(E_0\)</th><th>Exemples</th></tr>
    <tr><td><strong>Gain pur</strong></td><td>\(s = K\,e\)</td><td>\(K\)</td><td>saut immédiat à \(K E_0\)</td><td>capteur, réducteur, amplificateur idéal</td></tr>
    <tr><td><strong>Intégrateur</strong></td><td>\(\dfrac{ds}{dt} = K\,e\)</td><td>\(\dfrac{K}{p}\)</td><td>rampe de pente \(K E_0\)</td><td>position d'un axe commandé en vitesse, réservoir sans fuite</td></tr>
    <tr><td><strong>Dérivateur</strong></td><td>\(s = K\,\dfrac{de}{dt}\)</td><td>\(K\,p\)</td><td>impulsion (irréalisable seul)</td><td>génératrice tachymétrique sur un signal de position</td></tr>
    <tr><td><strong>Premier ordre</strong></td><td>\(\tau\,\dfrac{ds}{dt} + s = K\,e\)</td><td>\(\dfrac{K}{1 + \tau p}\)</td><td>exponentielle vers \(K E_0\)</td><td>circuit RC, four, moteur à courant continu simplifié</td></tr>
    <tr><td><strong>Deuxième ordre</strong></td><td>\(\dfrac{1}{\omega_0^2}\dfrac{d^2s}{dt^2} + \dfrac{2\xi}{\omega_0}\dfrac{ds}{dt} + s = K\,e\)</td><td>\(\dfrac{K}{1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}}\)</td><td>oscillante ou non selon \(\xi\)</td><td>masse-ressort-amortisseur, circuit RLC</td></tr>
    <tr><td><strong>Retard pur</strong></td><td>\(s(t) = e(t - T)\)</td><td>\(e^{-Tp}\)</td><td>échelon décalé de \(T\)</td><td>convoyeur, canalisation, réseau de communication</td></tr>
  </table></div>

<figcaption>Réponse (en trait plein) de chaque brique à un échelon d'entrée (en pointillé) : saut immédiat du gain pur, rampe de l'intégrateur, impulsion du dérivateur, exponentielle du premier ordre, oscillation amortie d'un deuxième ordre peu amorti, échelon décalé du retard pur.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — reconnaître les briques d'une fonction de transfert</strong>
    <p>\(H(p) = \dfrac{20\,e^{-0{,}1p}}{p\,(1 + 0{,}5p)}\) (position d'un axe commandé en vitesse à travers une liaison qui introduit un temps mort).</p>
    <ol>
      <li>Quatre briques en produit : un gain 20 (en \(\text{s}^{-1}\) fois l'unité de \(s\) sur celle de \(e\)), un intégrateur \(\dfrac1p\), un premier ordre de constante de temps \(\tau = 0{,}5\) s et un retard pur \(T = 0{,}1\) s. Ordre 2 (le retard n'ajoute pas d'ordre), classe 1.</li>
      <li>Réponse à un échelon \(E_0\) : rien pendant 0,1 s (retard), puis un départ à tangente horizontale (le premier ordre arrondit la rampe de l'intégrateur), puis une rampe de pente \(20\,E_0\) par seconde, sans valeur finale.</li>
      <li>En régime établi, la sortie suit la droite \(20\,E_0\,(t - 0{,}1 - 0{,}5)\) : la rampe a pris le retard \(T\) et le retard de traînage \(\tau\) du premier ordre (chapitre « Systèmes du 1er ordre », §3). À \(t = 2{,}6\) s, \(s \approx 40\,E_0\) (calcul exact : \(40{,}07\,E_0\)).</li>
    </ol>
  </div>
  <div class="notice">Le retard pur n'est pas une fraction rationnelle : il ne se décompose pas en pôles et zéros. Il ne modifie pas le gain d'un signal mais le déphase de plus en plus quand la pulsation augmente, ce qui menace la stabilité d'une boucle (chapitre « Stabilité des systèmes asservis »).</div>

<div class="course-section">
  <div class="sec-num">§6 · ÉTABLIR UN MODÈLE DE CONNAISSANCE</div>
  <h2>Des lois de la physique à la fonction de transfert</h2>
  <div class="intro">Un <strong>modèle de connaissance</strong> s'écrit à partir des lois physiques des constituants (loi des mailles, principe fondamental de la dynamique, bilan de matière ou d'énergie) : ses paramètres ont un sens physique (résistance, masse, raideur). Un <strong>modèle de comportement</strong>, au contraire, est choisi pour reproduire une réponse mesurée, et ses paramètres sont lus sur un essai (chapitres du 1er et du 2e ordre, sections « Identifier »). Les sujets combinent les deux : on écrit le modèle de connaissance, puis on le confronte aux mesures.</div>
  <div class="method-box">
    <strong>Méthode — écrire le modèle de connaissance</strong>
    <ol>
      <li>Choisir l'entrée et la sortie, orienter les grandeurs et repérer les positions à partir de l'équilibre.</li>
      <li>Écrire une loi par constituant et les lois d'association (maille, nœud, principe fondamental de la dynamique, bilan).</li>
      <li>Passer en Laplace sous conditions de Heaviside, puis éliminer les grandeurs internes pour ne garder que \(E(p)\) et \(S(p)\).</li>
      <li>Mettre \(H(p)\) sous forme canonique, exprimer \(K\), \(\tau\) ou \(\omega_0\) et \(\xi\) en fonction des paramètres physiques, et contrôler leurs unités.</li>
    </ol>
  </div>

  <h3>Les mêmes équations dans tous les domaines</h3>
  <p>Chaque domaine physique a une grandeur d'<strong>effort</strong> et une grandeur de <strong>flux</strong>, dont le produit est une puissance, et trois comportements élémentaires : dissiper l'énergie, la stocker sous forme « potentielle », la stocker sous forme « cinétique ». Le tableau permet de transposer un modèle d'un domaine à l'autre ; le formalisme effort-flux est développé en 2ᵉ année (<a href="#multiphy/cours">« Modélisation multiphysique »</a>).</p>
  <div style="overflow-x:auto"><table>
    <tr><th>Domaine</th><th>Effort</th><th>Flux</th><th>Dissipation</th><th>Stockage « potentiel »</th><th>Stockage « cinétique »</th></tr>
    <tr><td>Électrique</td><td>tension \(u\) (V)</td><td>courant \(i\) (A)</td><td>résistance : \(u = R\,i\)</td><td>condensateur : \(i = C\,\dfrac{du}{dt}\)</td><td>bobine : \(u = L\,\dfrac{di}{dt}\)</td></tr>
    <tr><td>Translation</td><td>force \(F\) (N)</td><td>vitesse \(v\) (m/s)</td><td>amortisseur : \(F = c\,v\)</td><td>ressort : \(F = k\,x\)</td><td>masse : \(F = m\,\dfrac{dv}{dt}\)</td></tr>
    <tr><td>Rotation</td><td>couple \(C\) (N·m)</td><td>vitesse angulaire \(\omega\) (rad/s)</td><td>frottement visqueux : \(C = f\,\omega\)</td><td>ressort de torsion : \(C = k_\theta\,\theta\)</td><td>inertie : \(C = J\,\dfrac{d\omega}{dt}\)</td></tr>
    <tr><td>Hydraulique</td><td>pression \(P\) (Pa)</td><td>débit volumique \(q\) (m³/s)</td><td>perte de charge linéaire : \(P = R_h\,q\)</td><td>réservoir : \(q = S\,\dfrac{dh}{dt}\), avec \(P = \rho g h\)</td><td>inertie du fluide (souvent négligée)</td></tr>
    <tr><td>Thermique</td><td>température \(\theta\) (K)</td><td>flux thermique \(\Phi\) (W)</td><td>paroi : \(\Phi = \dfrac{\Delta\theta}{R_{th}}\)</td><td>capacité : \(\Phi = C\,\dfrac{d\theta}{dt}\)</td><td>aucun</td></tr>
  </table></div>
  <div class="notice">En thermique, le produit \(\theta\,\Phi\) n'est pas une puissance (\(\Phi\) en est déjà une) : le couple (température, flux thermique) est un « pseudo-couple » effort-flux, commode mais sans la propriété de puissance.</div>

  <div class="method-box">
    <strong>Exemple — le circuit RLC série (domaine électrique)</strong>
    <p>Entrée : tension \(e(t)\) du générateur ; sortie : tension \(u_C(t)\) du condensateur ; \(R = 100\ \Omega\), \(L = 0{,}10\ \text{H}\), \(C = 10\ \mu\text{F}\).</p>
    <ol>
      <li>Lois : maille \(e = R\,i + L\,\dfrac{di}{dt} + u_C\) ; condensateur \(i = C\,\dfrac{du_C}{dt}\).</li>
      <li>Élimination du courant : \(LC\,u_C'' + RC\,u_C' + u_C = e\).</li>
      <li>Laplace : \(H(p) = \dfrac{U_C(p)}{E(p)} = \dfrac{1}{1 + RC\,p + LC\,p^2}\), forme canonique d'un deuxième ordre.</li>
      <li>Identification : \(K = 1\), \(\dfrac{1}{\omega_0^2} = LC\) et \(\dfrac{2\xi}{\omega_0} = RC\), soit \(\omega_0 = \dfrac{1}{\sqrt{LC}} = 1{,}0\times 10^{3}\ \text{rad/s}\) et \(\xi = \dfrac{R}{2}\sqrt{\dfrac{C}{L}} = 0{,}50\).</li>
    </ol>
    <p>En physique, on décrit le même circuit par son facteur de qualité \(Q = \dfrac{1}{2\xi} = 1\) (chapitre <a href="#oscill/cours">« Oscillateurs harmoniques »</a>).</p>
  </div>

  <div class="method-box">
    <strong>Exemple — la suspension d'un quart de véhicule (translation)</strong>
    <p>Masse suspendue \(m = 250\ \text{kg}\), ressort \(k = 2{,}5\times 10^{4}\ \text{N/m}\), amortisseur \(c = 2{,}0\times 10^{3}\ \text{N·s/m}\). Entrée : force verticale supplémentaire \(F(t)\) (une charge posée) ; sortie : enfoncement \(x(t)\), compté vers le bas à partir de la position d'équilibre sous le poids.</p>
    <ol>
      <li>Principe fondamental de la dynamique, projeté sur la verticale : \(m\,x'' = F - k\,x - c\,x'\). Le poids et la tension initiale du ressort se compensent à l'équilibre : ils disparaissent, et le système est bien au repos à \(t = 0\).</li>
      <li>Laplace : \((m\,p^2 + c\,p + k)\,X(p) = F(p)\), soit \(H(p) = \dfrac{X(p)}{F(p)} = \dfrac{1/k}{1 + \dfrac{c}{k}\,p + \dfrac{m}{k}\,p^2}\).</li>
      <li>Identification : \(K = \dfrac1k = 4{,}0\times 10^{-5}\ \text{m/N}\), \(\omega_0 = \sqrt{\dfrac{k}{m}} = 10\ \text{rad/s}\), \(\xi = \dfrac{c}{2\sqrt{km}} = 0{,}40\).</li>
      <li>Lecture : une charge de 1 000 N (un passager d'environ 100 kg) enfonce finalement la caisse de \(K \times 1000 = 4{,}0\) cm, après un dépassement d'environ 25 % (formule du dépassement, chapitre « Systèmes du 2e ordre »).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un rotor freiné par frottement visqueux (rotation)</strong>
    <p>Inertie \(J = 0{,}020\ \text{kg·m}^2\), frottement visqueux \(f = 4{,}0\times 10^{-3}\ \text{N·m·s/rad}\), entrée : couple moteur \(C_m\) ; sortie : vitesse \(\omega\).</p>
    <ol>
      <li>Théorème du moment dynamique autour de l'axe : \(J\,\omega' = C_m - f\,\omega\).</li>
      <li>\(H(p) = \dfrac{\Omega(p)}{C_m(p)} = \dfrac{1/f}{1 + \dfrac{J}{f}\,p}\) : premier ordre, \(K = \dfrac1f = 250\ \text{rad·s}^{-1}/(\text{N·m})\), \(\tau = \dfrac{J}{f} = 5{,}0\ \text{s}\).</li>
      <li>Un couple de 0,10 N·m mène le rotor à \(0{,}10 \times 250 = 25\ \text{rad/s}\) (240 tr/min), atteint à 5 % près en \(3\tau = 15\) s.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : se tromper de signe sur une force de rappel ou de frottement (elles s'opposent au déplacement ou à la vitesse) ; repérer une position ailleurs qu'à l'équilibre (un terme constant subsiste, le système n'est pas au repos à \(t = 0\)) ; écrire \(H(p)\) avant d'avoir éliminé toutes les grandeurs internes. Contrôle systématique : tous les termes d'une équation ont la même unité, \(K\) a l'unité de la sortie divisée par celle de l'entrée, \(\tau\) est en secondes et \(\omega_0\) en rad/s.</div>
  <div class="prop-box">
    <strong>Ordres de grandeur des constantes de temps.</strong> Circuit électronique : de la microseconde à la milliseconde ; moteur électrique de petite puissance : 10 ms à 1 s ; suspension automobile : \(\omega_0 \approx 6\) à \(12\ \text{rad/s}\) (1 à 2 Hz) ; réservoir, échangeur : la minute ; four, pièce d'habitation : de quelques minutes à quelques heures.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · EXPLOITER UNE FONCTION DE TRANSFERT SANS REVENIR AU TEMPS</div>
  <h2>Ce qu'un sujet demande vraiment</h2>
  <div class="intro">La transformée inverse n'étant pas au programme, les questions de modélisation portent sur ce que l'on tire directement de \(H(p)\) et de \(S(p) = H(p)\,E(p)\) : la stabilité, la fin de la réponse, son début, et sa réponse à une sinusoïde. Ces quatre lectures se font en quelques lignes.</div>
  <div class="prop-box">
    <strong>Quatre lectures directes</strong> (\(H\) d'ordre \(n\), à \(m\) zéros, \(m \leq n\)) :
    <ul>
      <li><strong>Stabilité</strong> : tous les pôles de \(H\) à partie réelle strictement négative (§4).</li>
      <li><strong>Valeur finale</strong> : si les pôles de \(p\,S(p)\) sont tous à partie réelle strictement négative, \(s(+\infty) = \lim\limits_{p \to 0} p\,S(p)\). Pour un échelon \(E_0\) appliqué à un système stable de classe 0 : \(s(+\infty) = H(0)\,E_0 = K\,E_0\). Pour une classe \(\alpha \geq 1\), la sortie ne converge pas.</li>
      <li><strong>Valeur initiale</strong> : \(s(0^+) = \lim\limits_{p \to +\infty} p\,S(p)\). Pour un échelon, elle est nulle dès que \(m \lt n\).</li>
      <li><strong>Pente à l'origine</strong> : si \(s(0^+) = 0\), la transformée de \(s'\) est \(p\,S(p)\), d'où la formule ci-dessous. Pour un échelon, la tangente à l'origine est oblique si \(n - m = 1\), horizontale si \(n - m \geq 2\).</li>
    </ul>
    <div class="formula" data-nom="Pente à l'origine">$$s'(0^+) = \lim_{p \to +\infty} p^2\,S(p)\qquad\text{lorsque } s(0^+) = 0.$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — lire une réponse indicielle sur \(S(p)\)</strong>
    <p>\(H(p) = \dfrac{6\,(1 + 0{,}2p)}{(1 + p)(1 + 0{,}5p)}\), échelon \(E_0 = 2\) : \(S(p) = \dfrac{12\,(1 + 0{,}2p)}{p\,(1 + p)(1 + 0{,}5p)}\).</p>
    <ol>
      <li>Pôles de \(H\) : \(-1\) et \(-2\). Le système est stable ; classe 0, donc \(s(+\infty) = H(0)\,E_0 = 6 \times 2 = 12\).</li>
      <li>\(n - m = 2 - 1 = 1\) : \(s(0^+) = \lim\limits_{p \to +\infty} \dfrac{12\,(1 + 0{,}2p)}{(1 + p)(1 + 0{,}5p)} = 0\) (degré 1 sur degré 2).</li>
      <li>\(s'(0^+) = \lim\limits_{p \to +\infty} p^2\,S(p)\) : pour \(p\) grand, \(p^2 S(p) = \dfrac{12\,p\,(1 + 0{,}2p)}{(1 + p)(1 + 0{,}5p)}\) se comporte comme \(\dfrac{12 \times 0{,}2\,p^2}{0{,}5\,p^2}\), d'où \(s'(0^+) = 4{,}8\) par seconde : la tangente à l'origine est oblique.</li>
      <li>Sans le zéro, avec \(H(p) = \dfrac{6}{(1 + p)(1 + 0{,}5p)}\), la même limite vaudrait 0 : c'est le zéro qui donne ce départ franc.</li>
    </ol>
  </div>

  <h3>Réponse à une entrée sinusoïdale</h3>
  <div class="prop-box">
    <strong>Régime sinusoïdal permanent.</strong> Pour un SLCI stable soumis à \(e(t) = E_m \sin(\omega t)\), la sortie tend, une fois le régime transitoire éteint, vers une sinusoïde de même pulsation :
    <div class="formula" data-nom="Régime sinusoïdal permanent">$$s(t) = \big|H(j\omega)\big|\,E_m\,\sin\!\big(\omega t + \arg H(j\omega)\big).$$</div>
    Il suffit de remplacer \(p\) par \(j\omega\) : le module donne l'amplification, l'argument le déphasage. C'est le point de départ du chapitre <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a>.
  </div>
  <div class="method-box">
    <strong>Exemple — un premier ordre excité à sa pulsation de cassure</strong>
    <p>\(H(p) = \dfrac{4}{1 + 0{,}5p}\) et \(e(t) = 3\sin(2t)\).</p>
    <ol>
      <li>\(H(2j) = \dfrac{4}{1 + j}\) : module \(\dfrac{4}{\sqrt 2} \approx 2{,}83\), argument \(-\arctan 1 = -45°\).</li>
      <li>Une fois le transitoire éteint (environ \(3\tau = 1{,}5\) s) : \(s(t) \approx 8{,}5\,\sin\!\big(2t - \tfrac{\pi}{4}\big)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : calculer \(\lim S(p)\) au lieu de \(\lim p\,S(p)\) ; appliquer le théorème de la valeur finale à un système instable, ou de classe \(\alpha \geq 1\) soumis à un échelon (sa sortie diverge) ; utiliser \(\lim p^2 S(p)\) pour la pente alors que \(s(0^+) \neq 0\) (il faut alors \(\lim p\,\big(p\,S(p) - s(0^+)\big)\), puisque \(\mathcal{L}[s'] = p\,S(p) - s(0^+)\)) ; parler de régime sinusoïdal permanent pour un système instable.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SIMULER UN SLCI EN PYTHON</div>
  <h2>La réponse calculée pas à pas</h2>
  <div class="intro">Quand l'entrée est quelconque (profil de consigne, perturbation enregistrée) ou le modèle trop gros pour une lecture directe, on calcule la réponse numériquement, sur l'équation différentielle elle-même. C'est ce que font les logiciels de simulation utilisés en TP ; en Python, la méthode d'Euler du chapitre <a href="#pynum/cours">« Méthodes numériques »</a> suffit : on y reprend la fonction <code>euler</code> de son §6.</div>
  <div class="method-box">
    <strong>Exemple — simuler la rampe saturée du §2 à travers un premier ordre</strong>
    <p>Premier ordre \(K = 2\), \(\tau = 0{,}5\ \text{s}\) : \(\tau\,s' + s = K\,e\), soit \(s' = \dfrac{K\,e(t) - s}{\tau}\), avec \(s(0) = 0\).</p>
    <pre class="codeblock"><span class="kw">def</span> euler(F, t0, y0, h, n):
    <span class="str">"""Méthode d'Euler pour y' = F(t, y), y(t0) = y0 : renvoie les listes</span>
<span class="str">    des instants t_k = t0 + k*h et des approximations y_k de y(t_k), k = 0, …, n."""</span>
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)      <span class="cmt"># pente au point (t_k, y_k)</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys

K, tau = 2.0, 0.5           <span class="cmt"># premier ordre K / (1 + tau p)</span>

<span class="kw">def</span> e(t):                    <span class="cmt"># rampe saturée, palier 2 V</span>
    <span class="kw">return</span> 4 * t <span class="kw">if</span> t &lt; 0.5 <span class="kw">else</span> 2.0

<span class="kw">def</span> F(t, s):                 <span class="cmt"># tau s' + s = K e</span>
    <span class="kw">return</span> (K * e(t) - s) / tau</pre>
    <pre class="codeblock">&gt;&gt;&gt; ts, ss = euler(F, 0, 0.0, 0.05, 40)  <span class="cmt"># jusqu'à t = 2 s</span>
&gt;&gt;&gt; round(ss[20], 3), round(ss[40], 3)   <span class="cmt"># s(1), s(2)</span>
(3.092, 3.89)</pre>
    <ol>
      <li>La solution exacte vaut \(s(1) = 3{,}070\) et \(s(2) = 3{,}874\) : avec \(h = \tau/10\), l'écart est inférieur à 1 %.</li>
      <li>Avec \(h = 0{,}01\) s, on obtient \(s(1) \approx 3{,}074\) et \(s(2) \approx 3{,}877\) : l'erreur de la méthode d'Euler est proportionnelle au pas.</li>
      <li>La valeur finale, \(K \times 2 = 4\), est confirmée par le théorème du §2.</li>
    </ol>
  </div>

<figcaption>Premier ordre \(K = 2\), \(\tau = 0{,}5\ \text{s}\) soumis à la rampe saturée du §2. Avec un pas \(h = 0{,}05\ \text{s}\) (un dixième de \(\tau\)), la méthode d'Euler colle à la solution exacte ; avec \(h = 0{,}25\ \text{s}\) (la moitié de \(\tau\)), elle prend d'abord du retard (pente calculée au début du pas), puis de l'avance, avant de rejoindre la valeur finale 4.</figcaption>
</figure>
  <p>Pour un deuxième ordre, on suit le couple \((s, s')\), état du système, avec la fonction <code>euler_ordre2</code> de « Méthodes numériques » (§7). Sur la suspension du §6 soumise à un échelon de 1 000 N, un pas \(h = 0{,}001\) s donne un enfoncement maximal de 0,0503 m, proche de la valeur exacte 0,0502 m ; avec \(h = 0{,}01\) s, Euler surestime ce maximum de 4 % (0,0521 m), et au-delà de \(h = 0{,}08\) s les oscillations calculées divergent.</p>
  <div class="prop-box">
    <strong>Choisir le pas.</strong> Prendre \(h\) petit devant la plus petite constante de temps du modèle (de l'ordre de \(\tau/10\), ou de \(1/(10\,\omega_0)\) pour un deuxième ordre), puis vérifier en divisant \(h\) par deux que le résultat ne change plus à la précision voulue. La méthode d'Euler, explicite, amortit trop peu les oscillations : elle exige un pas plus fin pour un système peu amorti. En TP et en physique, on utilise aussi la fonction <code>odeint</code> de <code>scipy.integrate</code>, dont la spécification est fournie.
  </div>
  <p>Simuler sert aussi à <strong>valider</strong> un modèle : on compare la réponse calculée à un relevé expérimental, sur un autre essai que celui qui a servi à l'identifier. Cette démarche est détaillée au §8 de <a href="#sys1/cours">« Systèmes du 1er ordre »</a> et au §8 de <a href="#sys2/cours">« Systèmes du 2e ordre »</a>.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · MODÉLISATION ET LAPLACE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix savoir-faire qui reviennent dans toutes les questions de modélisation : écrire le modèle, passer en Laplace, lire la fonction de transfert, puis en tirer la réponse sans revenir au temps. Les méthodes 3 et 5 vont au-delà du programme de PTSI (signalé dans leur titre).</div>
  <div class="method-box"><strong>Méthode 1 — Passer d'une équation différentielle à la fonction de transfert</strong>
    <ol>
      <li>Se placer sous conditions de Heaviside (système au repos à \(t = 0\)) : chaque dérivée \(\dfrac{d^k}{dt^k}\) devient \(p^k\).</li>
      <li>Regrouper les termes en \(S(p)\) d'un côté, en \(E(p)\) de l'autre, puis isoler \(H(p) = S(p)/E(p)\).</li>
      <li>Chemin inverse : à partir de \(H(p)\,E(p) = S(p)\), chasser les dénominateurs puis remplacer \(p^k\) par \(\dfrac{d^k}{dt^k}\).</li>
      <li>Contrôle : le degré du dénominateur est l'ordre de dérivation le plus élevé de la sortie, et celui du numérateur ne le dépasse pas (causalité).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(0{,}5\,s'' + 2\,s' + 4\,s = 8\,e\) donne \(H(p) = \dfrac{8}{4 + 2p + 0{,}5p^2} = \dfrac{2}{1 + 0{,}5p + p^2/8}\) : \(K = 2\), \(\omega_0 = \sqrt 8 \approx 2{,}83\ \text{rad/s}\), \(\dfrac{2\xi}{\omega_0} = 0{,}5\) d'où \(\xi \approx 0{,}71\).</p>
  </div>
  <div class="method-box"><strong>Méthode 2 — Lire une fonction de transfert</strong>
    <ol>
      <li>Factoriser les puissances de \(p\) au dénominateur : leur nombre est la classe \(\alpha\).</li>
      <li>Diviser numérateur et dénominateur par leurs termes constants pour faire apparaître des polynômes qui commencent par 1 : le facteur restant est le gain \(K\).</li>
      <li>Ordre = degré du dénominateur ; pôles et zéros = racines du dénominateur et du numérateur, après simplification des facteurs communs.</li>
      <li>Vérifier l'unité du gain : unité de la sortie divisée par celle de l'entrée (et par seconde de plus pour chaque intégrateur).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(H(p) = \dfrac{4p + 8}{p^3 + 5p^2 + 4p} = \dfrac{4\,(p + 2)}{p\,(p + 1)(p + 4)} = \dfrac{2}{p}\cdot\dfrac{1 + 0{,}5p}{(1 + p)(1 + 0{,}25p)}\) : gain 2, classe 1, ordre 3, un zéro \(-2\), pôles \(0\), \(-1\) et \(-4\).</p>
  </div>
  <div class="method-box"><strong>Méthode 3 — Calculer une réponse temporelle par décomposition (hors programme, pour aller plus loin)</strong>
    <ol>
      <li>Écrire \(S(p) = H(p)\,E(p)\) avec la transformée de l'entrée (\(E_0/p\) pour un échelon, \(a/p^2\) pour une rampe).</li>
      <li>Rendre unitaires les facteurs du dénominateur (\(1 + \tau p = \tau\,(p + 1/\tau)\)), puis décomposer en éléments simples : coefficient d'un pôle simple \(p_i\) = valeur de \((p - p_i)\,S(p)\) en \(p = p_i\).</li>
      <li>Pour une paire de pôles complexes, garder \(\dfrac{Bp + C}{(p + a)^2 + \omega^2}\) et le découper en un terme en \(p + a\) et un terme en \(\omega\).</li>
      <li>Lire l'original de chaque élément dans la table, puis contrôler \(s(0^+)\) et \(s(+\infty)\) par les théorèmes des valeurs initiale et finale.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(S(p) = \dfrac{3}{p\,(1 + 2p)} = \dfrac{1{,}5}{p\,(p + 0{,}5)} = \dfrac{3}{p} - \dfrac{3}{p + 0{,}5}\), donc \(s(t) = 3\,\big(1 - e^{-t/2}\big)\). Le programme ne demande pas ce calcul : un sujet fournit l'expression temporelle (§4 du cours).</p>
  </div>
  <div class="method-box"><strong>Méthode 4 — Prévoir le début et la fin d'une réponse sans revenir au temps</strong>
    <ol>
      <li>Vérifier que les pôles de \(p\,S(p)\) sont tous à partie réelle strictement négative (sinon la limite finale n'existe pas).</li>
      <li>Valeur finale : \(\lim\limits_{p \to 0} p\,S(p)\) ; pour un échelon \(E_0\) appliqué à un système stable de classe 0, on trouve \(H(0)\,E_0\).</li>
      <li>Valeur initiale : \(\lim\limits_{p \to +\infty} p\,S(p)\) ; pour un échelon, elle est nulle dès que le degré du numérateur est inférieur à celui du dénominateur.</li>
      <li>Pente à l'origine, si \(s(0^+) = 0\) : \(s'(0^+) = \lim\limits_{p \to +\infty} p^2\,S(p)\). Elle est non nulle pour un échelon si et seulement si les degrés diffèrent de 1.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(H(p) = \dfrac{2\,(1 + 4p)}{(1 + p)(1 + 2p)}\), échelon \(E_0 = 3\) : pôles \(-1\) et \(-0{,}5\), \(s(+\infty) = 6\), \(s(0^+) = 0\), \(s'(0^+) = \dfrac{2 \times 4 \times 3}{1 \times 2} = 12\) par seconde.</p>
  </div>
  <div class="method-box"><strong>Méthode 5 — Linéariser autour d'un point de fonctionnement (vu en 2ᵉ année)</strong>
    <ol>
      <li>Déterminer l'équilibre (dérivées nulles) : valeurs \(e_0\), \(s_0\).</li>
      <li>Poser \(e = e_0 + \Delta e\), \(s = s_0 + \Delta s\) et remplacer chaque fonction non linéaire par sa tangente : \(g(s) \approx g(s_0) + g'(s_0)\,\Delta s\).</li>
      <li>Simplifier les termes d'équilibre : il reste une équation linéaire en \(\Delta e\), \(\Delta s\), valable pour de petites variations.</li>
    </ol>
    <p><em>Exemple éclair :</em> une vanne débite \(q = k\sqrt{P}\) sous la différence de pression \(P\), avec \(k = 2{,}0\ \text{L·s}^{-1}\text{·bar}^{-1/2}\). Autour de \(P_0 = 4{,}0\) bar : \(q_0 = 4{,}0\ \text{L/s}\) et \(\Delta q \approx \dfrac{k}{2\sqrt{P_0}}\,\Delta P = 0{,}50\,\Delta P\) (L/s par bar).</p>
  </div>
  <div class="method-box"><strong>Méthode 6 — Reconnaître un modèle sur une réponse indicielle</strong>
    <ol>
      <li>Saut instantané : gain pur. Sortie qui croît sans limite à vitesse constante : intégrateur (classe 1).</li>
      <li>Palier atteint avec une tangente de pente non nulle à l'origine : premier ordre. Tangente horizontale à l'origine : ordre 2 au moins ; dépassement et oscillations : deuxième ordre peu amorti.</li>
      <li>Réponse qui ne commence qu'au bout d'un temps \(T\) : retard pur en série.</li>
    </ol>
    <p><em>Exemple éclair :</em> une sortie nulle pendant 0,2 s, qui part ensuite avec une tangente oblique, atteint 63 % de sa valeur finale 0,8 en \(t = 1{,}0\) s et ne dépasse jamais : premier ordre retardé, \(H(p) = \dfrac{0{,}8\,e^{-0{,}2p}}{1 + 0{,}8p}\) pour un échelon unité (\(\tau = 1{,}0 - 0{,}2 = 0{,}8\) s).</p>
  </div>
  <div class="method-box"><strong>Méthode 7 — Établir le modèle de connaissance d'un système physique</strong>
    <ol>
      <li>Choisir l'entrée et la sortie ; orienter ; repérer les positions à partir de l'équilibre.</li>
      <li>Écrire une loi par constituant (résistance, ressort, inertie, paroi…) et les lois d'association (maille, PFD, bilan).</li>
      <li>Passer en Laplace et éliminer les grandeurs internes.</li>
      <li>Identifier \(K\), \(\tau\) ou \(\omega_0\), \(\xi\) sur la forme canonique et vérifier leurs unités.</li>
    </ol>
    <p><em>Exemple éclair :</em> rotor d'inertie \(J = 0{,}050\ \text{kg·m}^2\) freiné par \(f = 0{,}010\ \text{N·m·s/rad}\) : \(J\,\omega' + f\,\omega = C\) donne \(\dfrac{\Omega}{C} = \dfrac{1/f}{1 + (J/f)\,p}\), soit \(K = 100\ \text{rad·s}^{-1}/(\text{N·m})\) et \(\tau = 5{,}0\ \text{s}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 8 — Calculer le régime sinusoïdal permanent</strong>
    <ol>
      <li>Vérifier que le système est stable (sinon il n'y a pas de régime permanent).</li>
      <li>Remplacer \(p\) par \(j\omega\) et calculer le module \(|H(j\omega)|\) (produit et quotient des modules des facteurs) et l'argument (somme et différence des arguments).</li>
      <li>Écrire \(s(t) = |H(j\omega)|\,E_m\sin\big(\omega t + \arg H(j\omega)\big)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(H(p) = \dfrac{10}{1 + 0{,}2p}\). À \(\omega = 5\ \text{rad/s}\) : \(|H| = \dfrac{10}{\sqrt 2} \approx 7{,}1\), argument \(-45°\). À \(\omega = 50\ \text{rad/s}\) : \(|H| = \dfrac{10}{\sqrt{101}} \approx 1{,}0\), argument \(-\arctan 10 \approx -84°\).</p>
  </div>
  <div class="method-box"><strong>Méthode 9 — Écrire la transformée d'une entrée composée</strong>
    <ol>
      <li>Décomposer le signal en somme d'échelons et de rampes, chacun <strong>décalé</strong> à son instant de départ : \(f(t - T)\,u(t - T)\).</li>
      <li>Appliquer la linéarité et le théorème du retard : chaque terme décalé de \(T\) est multiplié par \(e^{-Tp}\).</li>
      <li>Contrôler la valeur initiale et la valeur finale du signal par les théorèmes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(+5\) V de 0 à 2 s, \(-5\) V de 2 à 4 s, puis 0 : \(e(t) = 5\,u(t) - 10\,u(t - 2) + 5\,u(t - 4)\), donc \(E(p) = \dfrac{5\,\big(1 - 2\,e^{-2p} + e^{-4p}\big)}{p}\), et \(\lim\limits_{p \to 0} p\,E(p) = 5\,(1 - 2 + 1) = 0\).</p>
  </div>
  <div class="method-box"><strong>Méthode 10 — Simuler un SLCI par la méthode d'Euler</strong>
    <ol>
      <li>Écrire l'équation sous la forme \(s' = F(t, s)\) ; pour un deuxième ordre, suivre le couple \((s, s')\).</li>
      <li>Choisir un pas \(h\) de l'ordre du dixième de la plus petite constante de temps (ou de \(1/\omega_0\)).</li>
      <li>Itérer \(s_{k+1} = s_k + h\,F(t_k, s_k)\) (fonction <code>euler</code> du chapitre « Méthodes numériques »), puis recommencer avec \(h/2\) : le résultat ne doit plus bouger.</li>
      <li>Contrôler la valeur finale par le théorème de la valeur finale.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(0{,}5\,s' + s = 2\) (échelon), \(s(0) = 0\), \(h = 0{,}1\) s : \(s_1 = 0 + 0{,}1 \times \dfrac{2 - 0}{0{,}5} = 0{,}40\), \(s_2 = 0{,}4 + 0{,}1 \times \dfrac{2 - 0{,}4}{0{,}5} = 0{,}72\), contre \(s(0{,}2) = 2\,(1 - e^{-0{,}4}) \approx 0{,}66\) : 9 % d'écart, il faut un pas plus fin.</p>
  </div>
  <div class="notice"><strong>Pièges classiques</strong> : oublier que \(\mathcal{L}[f'] = p\,F - f(0^+)\) quand le système n'est pas au repos ; appliquer le théorème de la valeur finale à un système instable ou oscillant ; lire un gain sur une fraction qui n'est pas sous forme canonique ; confondre l'ordre (degré du dénominateur) et la classe (nombre de pôles nuls) ; retrancher une rampe non décalée dans un signal composé ; repérer une position ailleurs qu'à l'équilibre dans un modèle de connaissance.</div>
</div>
</template>

<div class="exo">

  <h3>Réponse indicielle par décomposition en éléments simples (hors programme, pour aller plus loin)</h3>
  <div class="statement">Un système a pour fonction de transfert \(H(p) = \dfrac{10}{(1 + p)(1 + 0{,}2p)}\). Il est soumis à un échelon d'amplitude \(E_0 = 2\).</div>
  <div class="q"><strong>Q1.</strong> Écrire \(S(p)\), puis le décomposer en éléments simples.</div>
  <div class="q"><strong>Q2.</strong> En déduire \(s(t)\) ; contrôler \(s(0)\) et \(s(\infty)\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer la pente de la réponse à l'origine par le théorème de la valeur initiale.</div>
  <div class="q"><strong>Q4.</strong> Estimer le temps au bout duquel la sortie reste à moins de 5 % de sa valeur finale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong></p>
    <div class="formula">$$S(p) = \dfrac{20}{p\,(1 + p)(1 + 0{,}2p)} = \dfrac{100}{p\,(p + 1)(p + 5)} = \dfrac{A}{p} + \dfrac{B}{p + 1} + \dfrac{C}{p + 5},$$</div>
    <p>avec \(A = \dfrac{100}{5} = 20\), \(B = \dfrac{100}{(-1)\times 4} = -25\), \(C = \dfrac{100}{(-5)\times(-4)} = 5\).</p>
    <p><strong>Q2.</strong> \(s(t) = 20 - 25\,e^{-t} + 5\,e^{-5t}\). On a bien \(s(0) = 20 - 25 + 5 = 0\) et \(s(\infty) = 20 = H(0)\,E_0\).</p>
    <p><strong>Q3.</strong> Comme \(s(0^+) = 0\), la transformée de \(s'\) est \(p\,S(p)\), et</p>
    <div class="formula">$$s'(0^+) = \lim_{p \to +\infty} p^2\,S(p) = \lim_{p \to +\infty} \dfrac{100\,p}{(p + 1)(p + 5)} = 0.$$</div>
    <p>Tangente horizontale à l'origine, signature d'un système d'ordre 2 au moins. Directement : \(s'(t) = 25\,e^{-t} - 25\,e^{-5t}\) s'annule bien en 0.</p>
    <p><strong>Q4.</strong> Le terme \(5\,e^{-5t}\) disparaît vite : le pôle dominant est \(-1\). Il faut \(25\,e^{-t} \leq 0{,}05 \times 20 = 1\), soit \(t \geq \ln 25 \approx 3{,}2\ \text{s}\) ; à cet instant \(5\,e^{-16}\) est négligeable, l'estimation est donc excellente.</p>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Décomposer \(S(p)\) sous la forme \(\dfrac{A}{p} + \dfrac{Bp + C}{p^2 + 2p + 10}\).</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Théorème de la valeur finale : usages et pièges</h3>
  <div class="statement">Pour chacune des transformées suivantes, dire si \(s(t)\) admet une limite finie quand \(t \to +\infty\) et, si oui, la donner. Comparer avec le résultat d'une application « aveugle » du théorème.</div>
  <div class="q"><strong>Q1.</strong> \(S_1(p) = \dfrac{3}{p\,(1 + 2p)}\) et \(S_2(p) = \dfrac{4}{p^2\,(1 + p)}\).</div>
  <div class="q"><strong>Q2.</strong> \(S_3(p) = \dfrac{2}{p\,(p - 1)}\).</div>
  <div class="q"><strong>Q3.</strong> \(S_4(p) = \dfrac{5}{p\,(p^2 + 4)}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(p\,S_1(p) = \dfrac{3}{1 + 2p}\) a un seul pôle, \(-0{,}5\) : la limite existe et vaut 3. \(p\,S_2(p) = \dfrac{4}{p\,(1 + p)}\) garde un pôle nul : pas de limite finie. En effet \(S_2 = \dfrac{4}{p^2} - \dfrac{4}{p} + \dfrac{4}{p + 1}\), donc \(s_2(t) = 4t - 4 + 4\,e^{-t} \to +\infty\) (un intégrateur soumis à un échelon).</p>
    <p><strong>Q2.</strong> \(p\,S_3(p) = \dfrac{2}{p - 1}\) a un pôle positif : \(s_3(t) = -2 + 2\,e^{t}\) diverge. Le calcul aveugle donnerait \(-2\) : résultat faux.</p>
    <p><strong>Q3.</strong> \(p\,S_4(p) = \dfrac{5}{p^2 + 4}\) a deux pôles imaginaires purs \(\pm 2j\) : \(S_4 = \dfrac{5/4}{p} - \dfrac54\cdot\dfrac{p}{p^2 + 4}\), donc \(s_4(t) = \dfrac54\,(1 - \cos 2t)\), qui oscille sans fin. Le calcul aveugle donnerait \(5/4\), qui n'est que la valeur moyenne.</p>
  </div>
