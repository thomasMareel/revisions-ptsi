<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Linéarisation d'un réservoir (vue en 2ᵉ année)</h3>
  <div class="statement">Un réservoir de section \(S = 0{,}50\ \text{m}^2\) reçoit un débit \(q_e(t)\) et se vide par un orifice : \(q_s = k\sqrt{h}\) avec \(k = 0{,}020\ \text{m}^{5/2}\cdot\text{s}^{-1}\). Le bilan s'écrit \(S\,\dfrac{dh}{dt} = q_e - k\sqrt{h}\). On travaille autour du niveau \(h_0 = 1{,}0\ \text{m}\).</div>
  <div class="q"><strong>Q1.</strong> Quel débit \(q_{e0}\) maintient le niveau \(h_0\) ?</div>
  <div class="q"><strong>Q2.</strong> Linéariser le modèle et donner la fonction de transfert \(\Delta H(p)/\Delta Q(p)\) : valeurs numériques de \(K\) et \(\tau\).</div>
  <div class="q"><strong>Q3.</strong> On augmente le débit de \(\Delta q = 2{,}0\times 10^{-3}\ \text{m}^3/\text{s}\). Variation finale de niveau prévue par le modèle linéaire ? Temps de réponse à 5 % ? Comparer au nouvel équilibre exact.</div>
  <div class="q"><strong>Q4.</strong> Même question pour \(\Delta q = 0{,}020\ \text{m}^3/\text{s}\). Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À l'équilibre \(q_{e0} = k\sqrt{h_0} = 0{,}020\ \text{m}^3/\text{s}\).</p>
    <p><strong>Q2.</strong> \(\sqrt{h} \approx \sqrt{h_0} + \dfrac{\Delta h}{2\sqrt{h_0}}\) donne \(S\,\dfrac{d\Delta h}{dt} + \dfrac{k}{2\sqrt{h_0}}\,\Delta h = \Delta q\), soit \(\dfrac{\Delta H(p)}{\Delta Q(p)} = \dfrac{K}{1 + \tau p}\) avec \(K = \dfrac{2\sqrt{h_0}}{k} = 100\ \text{s}\cdot\text{m}^{-2}\) et \(\tau = \dfrac{2S\sqrt{h_0}}{k} = 50\ \text{s}\).</p>
    <p><strong>Q3.</strong> \(\Delta h_\infty = K\,\Delta q = 0{,}20\ \text{m}\), atteint à 5 % près en \(3\tau = 150\ \text{s}\). Exact : \(\sqrt{h} = \dfrac{0{,}022}{0{,}020} = 1{,}1\), donc \(h = 1{,}21\ \text{m}\) et \(\Delta h = 0{,}21\ \text{m}\). L'erreur du modèle linéaire est de 5 % : il est très bon.</p>
    <p><strong>Q4.</strong> Modèle linéaire : \(\Delta h = 2{,}0\ \text{m}\), donc \(h = 3{,}0\ \text{m}\). Exact : \(\sqrt{h} = 2\), \(h = 4{,}0\ \text{m}\) : l'erreur atteint 33 %. Le modèle linéarisé ne vaut que pour de <strong>petites variations</strong> autour du point de fonctionnement.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>SLCI ou pas ?</h3>
  <div class="statement">Pour chacun des systèmes suivants (entrée \(e\), sortie \(s\), temps en secondes), dire s'il est linéaire, invariant et causal, en justifiant, puis conclure : est-ce un SLCI ?</div>
  <div class="q"><strong>Q1.</strong> (a) \(0{,}5\,s'(t) + s(t) = 2\,e(t)\) ; (b) \(s(t) = 3\,e(t) + 1\).</div>
  <div class="q"><strong>Q2.</strong> (c) \(s'(t) + 2\,s(t) = e(t + 0{,}1)\) ; (d) \(s'(t) + (1 + 0{,}1\,t)\,s(t) = e(t)\).</div>
  <div class="q"><strong>Q3.</strong> (e) \(s(t) = e(t - 2)\) ; (f) \(s(t)\,s'(t) = e(t)\).</div>
  <div class="q"><strong>Q4.</strong> Pour (a), donner la fonction de transfert, son gain et sa constante de temps. Pour (b), montrer que les variations \(\Delta e = e\) et \(\Delta s = s - 1\) sont reliées par un SLCI.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) Chaque terme est linéaire, les coefficients sont constants, et l'entrée n'est pas dérivée (\(m = 0 \leq n = 1\)) : linéaire, invariant, causal, donc SLCI du premier ordre. (b) Superposition en défaut : \(e_1 = 1\) donne 4, \(e_2 = 2\) donne 7, mais \(e_1 + e_2 = 3\) donne 10 et non \(4 + 7 = 11\). Le système est invariant et causal, mais <strong>affine</strong>, pas linéaire : ce n'est pas un SLCI (une entrée nulle ne donne pas une sortie nulle).</p>
    <p><strong>Q2.</strong> (c) Linéaire et invariant, mais \(s(t)\) dépend de \(e(t + 0{,}1)\), valeur future de l'entrée : <strong>non causal</strong>, donc physiquement irréalisable. (d) Linéaire et causal, mais le coefficient \(1 + 0{,}1\,t\) change avec le temps : <strong>non invariant</strong>. Ni l'un ni l'autre n'est un SLCI.</p>
    <p><strong>Q3.</strong> (e) Retard pur : linéaire (le retard d'une somme est la somme des retards), invariant, causal (on lit le passé) : SLCI au sens large, de fonction de transfert \(e^{-2p}\). (f) Si \(s\) répond à \(e\), alors \(\sqrt2\,s\) vérifie \(\sqrt2\,s \cdot \sqrt2\,s' = 2\,e\) : doubler l'entrée multiplie la sortie par \(\sqrt2\) et non par 2 : <strong>non linéaire</strong>.</p>
    <p><strong>Q4.</strong> (a) \(H(p) = \dfrac{2}{1 + 0{,}5p}\) : \(K = 2\), \(\tau = 0{,}5\ \text{s}\). (b) \(\Delta s = s - 1 = 3\,e = 3\,\Delta e\) : pour les variations, c'est un gain pur de 3, un SLCI. C'est l'idée de la linéarisation autour d'un point de fonctionnement (vue en 2ᵉ année) : on étudie les écarts à un état de référence.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Modèle de connaissance d'un siège suspendu</h3>
  <div class="statement">Le siège d'un engin de chantier (masse avec le conducteur \(m = 80\ \text{kg}\)) est relié au plancher de la cabine par un ressort de raideur \(k = 3{,}2\times 10^{4}\ \text{N/m}\) et un amortisseur de coefficient \(c = 1{,}6\times 10^{3}\ \text{N·s/m}\), montés en parallèle. Entrée : déplacement vertical du plancher \(z(t)\) ; sortie : déplacement vertical du siège \(x(t)\) ; les deux sont comptés vers le haut à partir de la position d'équilibre, et le système est au repos à \(t = 0\). Le ressort exerce sur le siège la force \(-k\,(x - z)\), l'amortisseur \(-c\,(x' - z')\).</div>
  <div class="q"><strong>Q1.</strong> Écrire le principe fondamental de la dynamique pour le siège et en déduire l'équation différentielle qui lie \(x\) et \(z\).</div>
  <div class="q"><strong>Q2.</strong> Établir \(H(p) = X(p)/Z(p)\) sous forme canonique. Donner son gain, son ordre, sa classe, ses pôles et ses zéros.</div>
  <div class="q"><strong>Q3.</strong> Identifier \(\omega_0\) et \(\xi\) (valeurs numériques).</div>
  <div class="q"><strong>Q4.</strong> Le plancher monte brusquement de 5 cm (échelon). Sans calculer \(x(t)\), donner \(x(0^+)\), la vitesse initiale \(x'(0^+)\) et \(x(+\infty)\).</div>
  <div class="q"><strong>Q5.</strong> Le plancher vibre selon \(z(t) = Z_m\sin(\omega t)\) avec \(\omega = 20\ \text{rad/s}\). Calculer le rapport des amplitudes \(X_m/Z_m\) en régime permanent et commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le poids est compensé à l'équilibre (positions comptées depuis l'équilibre), d'où \(m\,x'' = -k\,(x - z) - c\,(x' - z')\), soit \(m\,x'' + c\,x' + k\,x = c\,z' + k\,z\). Le second membre contient la dérivée de l'entrée : la fonction de transfert aura un zéro.</p>
    <p><strong>Q2.</strong> Sous conditions de Heaviside : \((m\,p^2 + c\,p + k)\,X = (c\,p + k)\,Z\), donc</p>
    <div class="formula">$$H(p) = \frac{1 + \dfrac{c}{k}\,p}{1 + \dfrac{c}{k}\,p + \dfrac{m}{k}\,p^2} = \frac{1 + 0{,}05\,p}{1 + 0{,}05\,p + 0{,}0025\,p^2}.$$</div>
    <p>Gain \(K = 1\) (sans unité : le siège finit par suivre le plancher), ordre 2, classe 0. Zéro : \(-k/c = -20\ \text{s}^{-1}\). Pôles : racines de \(p^2 + 20\,p + 400 = 0\), soit \(-10 \pm 10\sqrt3\,j \approx -10 \pm 17{,}3\,j\).</p>
    <p><strong>Q3.</strong> \(\dfrac{1}{\omega_0^2} = \dfrac{m}{k}\) donne \(\omega_0 = \sqrt{k/m} = 20\ \text{rad/s}\) ; \(\dfrac{2\xi}{\omega_0} = \dfrac{c}{k}\) donne \(\xi = \dfrac{c}{2\sqrt{km}} = \dfrac{1600}{2 \times 1600} = 0{,}50\).</p>
    <p><strong>Q4.</strong> \(X(p) = H(p)\,\dfrac{Z_0}{p}\) avec \(Z_0 = 0{,}05\ \text{m}\). Valeur initiale : \(x(0^+) = \lim\limits_{p \to +\infty} H(p)\,Z_0 = 0\) (degré 1 sur degré 2). Pente : \(x'(0^+) = \lim\limits_{p \to +\infty} p\,H(p)\,Z_0\), qui vaut \(\dfrac{c/k}{m/k}\,Z_0 = \dfrac{c}{m}\,Z_0\), soit \(20 \times 0{,}05 = 1{,}0\ \text{m/s}\) : l'amortisseur transmet immédiatement le choc sous forme de vitesse. Valeur finale (pôles à partie réelle négative) : \(x(+\infty) = H(0)\,Z_0 = 5\ \text{cm}\). Le calcul exact (non demandé) donne un maximum de 6,5 cm : 30 % de dépassement, plus que les 16 % d'un deuxième ordre sans zéro de même \(\xi\), à cause du zéro.</p>
    <p><strong>Q5.</strong> \(\omega = \omega_0\) : \(H(j\omega_0) = \dfrac{1 + j\,(c/k)\,\omega_0}{1 + j\,2\xi - 1} = \dfrac{1 + j}{j} = 1 - j\), car \((c/k)\,\omega_0 = 0{,}05 \times 20 = 1\) et \(2\xi = 1\). Donc \(X_m/Z_m = \sqrt2 \approx 1{,}41\) : à cette pulsation, le siège vibre 41 % plus fort que le plancher. La suspension n'atténue les vibrations qu'au-delà de \(\omega = \sqrt2\,\omega_0 \approx 28\ \text{rad/s}\) (4,5 Hz) : à 40 rad/s, le rapport tombe à 0,62.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Consignes composées et valeurs finales</h3>
  <div class="statement">Le temps est en secondes. On rappelle (chapitre « Systèmes du 1er ordre ») qu'en réponse à une rampe de pente \(a\), la sortie d'un premier ordre \(\dfrac{K}{1 + \tau p}\) rejoint la droite \(K\,a\,(t - \tau)\).</div>
  <div class="q"><strong>Q1.</strong> Une électrovanne reçoit une tension de commande en créneau : 3 V de \(t = 0\) à \(t = 2\) s, puis 0. Écrire \(e(t)\) à l'aide d'échelons, puis \(E(p)\). Vérifier \(e(0^+)\) et \(e(+\infty)\) par les théorèmes.</div>
  <div class="q"><strong>Q2.</strong> La consigne de vitesse d'un convoyeur passe linéairement de 0 à 1,5 m/s en 3 s, puis reste constante. Écrire \(v_c(t)\), puis \(V_c(p)\).</div>
  <div class="q"><strong>Q3.</strong> Cette consigne est appliquée à un premier ordre de gain \(K = 0{,}8\) et de constante de temps \(\tau = 0{,}4\ \text{s}\). Donner la valeur finale et la pente initiale de la sortie.</div>
  <div class="q"><strong>Q4.</strong> Estimer la sortie à \(t = 3\) s, puis à \(t = 3 + 3\tau = 4{,}2\) s.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(e(t) = 3\,u(t) - 3\,u(t - 2)\), donc \(E(p) = \dfrac{3\,\big(1 - e^{-2p}\big)}{p}\). Valeur initiale : \(\lim\limits_{p \to +\infty} 3\,(1 - e^{-2p}) = 3\) V ; valeur finale : \(\lim\limits_{p \to 0} 3\,(1 - e^{-2p}) = 0\). Les deux théorèmes retrouvent le créneau.</p>
    <p><strong>Q2.</strong> Pente \(a = 0{,}5\ \text{m/s}^2\) : \(v_c(t) = 0{,}5\,t\,u(t) - 0{,}5\,(t - 3)\,u(t - 3)\), d'où \(V_c(p) = \dfrac{0{,}5\,\big(1 - e^{-3p}\big)}{p^2}\). On retranche la rampe décalée \(0{,}5\,(t - 3)\), et non \(0{,}5\,t\).</p>
    <p><strong>Q3.</strong> \(S(p) = \dfrac{0{,}8}{1 + 0{,}4p}\cdot\dfrac{0{,}5\,(1 - e^{-3p})}{p^2}\). Quand \(p \to 0\), \(1 - e^{-3p} \approx 3p\) : \(p\,S(p) \to 0{,}8 \times 0{,}5 \times 3 = 1{,}2\ \text{m/s}\) (le seul pôle restant de \(p\,S\) est \(-2{,}5\)). C'est bien \(K\) fois le palier de 1,5 m/s. Pente initiale : \(\lim\limits_{p \to +\infty} p^2\,S(p) = \lim \dfrac{0{,}4\,(1 - e^{-3p})}{1 + 0{,}4p} = 0\) : la sortie part à tangente horizontale, puisque la consigne elle-même part de 0 sans saut.</p>
    <p><strong>Q4.</strong> À \(t = 3\) s, le régime de poursuite de la rampe est établi (\(3\ \text{s} \gg 3\tau\)) : \(s \approx K\,a\,(t - \tau)\), soit \(0{,}8 \times 0{,}5 \times 2{,}6 = 1{,}04\ \text{m/s}\). Ensuite, l'entrée est constante : la sortie rejoint 1,2 m/s avec la constante de temps \(\tau\), et à \(t = 4{,}2\) s, \(s \approx 1{,}2 - (1{,}2 - 1{,}04)\,e^{-3} \approx 1{,}19\ \text{m/s}\). Le calcul exact donne 1,040 et 1,192.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Lire une fonction de transfert sans revenir au temps</h3>
  <div class="statement">Un système a pour fonction de transfert \(H(p) = \dfrac{5\,(1 + 2p)}{(1 + 0{,}5p)(1 + 4p)}\) (temps en secondes). On lui applique un échelon unité.</div>
  <div class="q"><strong>Q1.</strong> Donner ses pôles, son zéro, son gain statique ; est-il stable ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(s(0^+)\), \(s'(0^+)\) et \(s(+\infty)\). Comparer la pente initiale à celle du premier ordre \(\dfrac{5}{1 + 4p}\).</div>
  <div class="q"><strong>Q3.</strong> Quelle est la réponse permanente à \(e(t) = \sin t\) ?</div>
  <div class="q"><strong>Q4.</strong> On donne la réponse indicielle exacte \(s(t) = 5 - \dfrac{15}{7}\,e^{-2t} - \dfrac{20}{7}\,e^{-t/4}\). Retrouver les résultats de Q2 et estimer le temps de réponse à 5 %.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Zéro \(-0{,}5\) ; pôles \(-2\) et \(-0{,}25\), tous deux négatifs : stable. Gain statique \(H(0) = 5\).</p>
    <p><strong>Q2.</strong> \(S(p) = H(p)/p\). \(s(0^+) = \lim\limits_{p \to +\infty} H(p) = 0\) (degré 1 sur degré 2). Pente : \(s'(0^+) = \lim\limits_{p \to +\infty} p\,H(p) = \dfrac{5 \times 2}{0{,}5 \times 4} = 5\) par seconde. Valeur finale : \(s(+\infty) = H(0) = 5\). Le premier ordre \(\dfrac{5}{1 + 4p}\) part avec la pente \(K/\tau = 1{,}25\) par seconde : le zéro multiplie la pente initiale par 4, il « anticipe ».</p>
    <p><strong>Q3.</strong> \(H(j) = \dfrac{5\,(1 + 2j)}{(1 + 0{,}5j)(1 + 4j)}\) : module \(\dfrac{5\sqrt5}{\sqrt{1{,}25}\,\sqrt{17}} \approx 2{,}43\) ; argument \(\arctan 2 - \arctan 0{,}5 - \arctan 4\), soit \(63{,}4° - 26{,}6° - 76{,}0° = -39{,}1°\) (\(-0{,}68\) rad). En régime permanent, \(s(t) \approx 2{,}43\,\sin(t - 0{,}68)\).</p>
    <p><strong>Q4.</strong> \(s(0) = 5 - \dfrac{15}{7} - \dfrac{20}{7} = 0\) ; \(s'(t) = \dfrac{30}{7}\,e^{-2t} + \dfrac{5}{7}\,e^{-t/4}\), donc \(s'(0) = \dfrac{35}{7} = 5\) ; \(s \to 5\). Le terme \(e^{-2t}\) s'éteint vite : le temps de réponse est fixé par \(\dfrac{20}{7}\,e^{-t/4} \leq 0{,}05 \times 5\), soit \(t \geq 4\ln\dfrac{80}{7} \approx 9{,}7\ \text{s}\) (la réponse ne dépasse pas sa valeur finale).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Simuler une suspension par la méthode d'Euler</h3>
  <div class="statement">On reprend le quart de véhicule du cours (§6) : \(m\,x'' + c\,x' + k\,x = F(t)\), avec \(m = 250\ \text{kg}\), \(k = 2{,}5\times 10^{4}\ \text{N/m}\), \(c = 2{,}0\times 10^{3}\ \text{N·s/m}\), au repos à \(t = 0\), et \(F = 1\,000\ \text{N}\) à partir de \(t = 0\). On pose \(v = x'\).</div>
  <div class="q"><strong>Q1.</strong> Écrire le système d'ordre 1 vérifié par \((x, v)\), puis le schéma d'Euler de pas \(h\).</div>
  <div class="q"><strong>Q2.</strong> Avec \(h = 0{,}01\) s, calculer à la main \((x_1, v_1)\) et \((x_2, v_2)\).</div>
  <div class="q"><strong>Q3.</strong> Sans simulation, donner la valeur finale de \(x\) et la valeur maximale attendue (dépassement d'un deuxième ordre sans zéro : \(D_1 = e^{-\pi\xi/\sqrt{1 - \xi^2}}\)).</div>
  <div class="q"><strong>Q4.</strong> La fonction <code>euler_ordre2</code> du chapitre « Méthodes numériques » donne un maximum de 0,0521 m pour \(h = 0{,}01\) s et de 0,0503 m pour \(h = 0{,}001\) s. Commenter.</div>
  <div class="q"><strong>Q5.</strong> On admet qu'à chaque pas, Euler multiplie un mode \(e^{\lambda t}\) de la réponse (\(\lambda\) pôle du système) par \(1 + h\lambda\), au lieu de \(e^{h\lambda}\). Calculer les pôles, puis \(|1 + h\lambda|\) pour \(h = 0{,}01\) s et \(h = 0{,}1\) s. En déduire le pas au-delà duquel la simulation diverge.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(x' = v\) et \(v' = \dfrac{F - c\,v - k\,x}{m}\). Euler : \(x_{k+1} = x_k + h\,v_k\) et \(v_{k+1} = v_k + h\,\dfrac{F - c\,v_k - k\,x_k}{m}\), les deux calculés avec les valeurs du pas \(k\).</p>
    <p><strong>Q2.</strong> \(x_1 = 0 + 0{,}01 \times 0 = 0\) ; \(v_1 = 0 + 0{,}01 \times \dfrac{1000}{250} = 0{,}040\ \text{m/s}\). Puis \(x_2 = 0 + 0{,}01 \times 0{,}040 = 4{,}0\times 10^{-4}\ \text{m}\) et</p>
    <div class="formula">$$v_2 = 0{,}040 + 0{,}01 \times \dfrac{1000 - 2000 \times 0{,}040}{250} = 0{,}0768\ \text{m/s}.$$</div>
    <p>La valeur exacte \(x(0{,}02) \approx 7{,}6\times 10^{-4}\) m montre qu'Euler prend du retard au démarrage : la vitesse utilisée au premier pas est celle du départ, nulle.</p>
    <p><strong>Q3.</strong> Valeur finale \(x_\infty = F/k = 4{,}0\) cm (cours, §6) ; \(\xi = 0{,}40\) donne \(D_1 = e^{-\pi \times 0{,}4/\sqrt{0{,}84}} \approx 0{,}254\), d'où un maximum d'environ \(4{,}0 \times 1{,}254 \approx 5{,}02\) cm, atteint à \(t = \dfrac{\pi}{\omega_0\sqrt{1 - \xi^2}} \approx 0{,}34\) s.</p>
    <p><strong>Q4.</strong> Avec \(h = 0{,}01\) s, Euler surestime le maximum de 4 % (5,21 cm) : il amortit trop peu les oscillations. Avec \(h = 0{,}001\) s, l'écart tombe à 0,4 % : l'erreur est à peu près proportionnelle au pas. On choisit \(h\) petit devant \(1/\omega_0 = 0{,}1\) s, et l'on vérifie qu'en divisant \(h\) par deux le résultat ne bouge plus.</p>
    <p><strong>Q5.</strong> Les pôles sont les racines de \(250\,p^2 + 2000\,p + 25000 = 0\) : \(\lambda = -4 \pm 9{,}17\,j\) (\(|\lambda| = \omega_0 = 10\)). \(|1 + h\lambda|^2 = (1 - 4h)^2 + (9{,}17\,h)^2\), soit \(1 - 8h + 100\,h^2\). Pour \(h = 0{,}01\) s : \(|1 + h\lambda| \approx 0{,}964\), contre \(e^{-4h} \approx 0{,}961\) pour la solution exacte : le mode décroît, mais un peu moins vite (amortissement sous-estimé). Pour \(h = 0{,}1\) s : \(|1 + h\lambda| \approx 1{,}10 \gt 1\), les oscillations calculées grandissent sans fin. La limite est \(1 - 8h + 100\,h^2 \lt 1\), soit \(h \lt 0{,}08\) s.</p>
  </div>
</div>
<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Température d'une enceinte mesurée avec retard</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>modélisation des SLCI</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une enceinte de capacité thermique \(C = 2{,}0\times 10^{4}\ \text{J}\cdot\text{K}^{-1}\) est chauffée par une résistance de puissance \(P(t)\). Elle perd de la chaleur vers l'extérieur à travers une paroi de résistance thermique \(R_{th} = 5{,}0\times 10^{-2}\ \text{K}\cdot\text{W}^{-1}\). On note \(\theta(t)\) l'écart de température entre l'enceinte et l'extérieur, nul à \(t = 0\). Le bilan d'énergie s'écrit \(C\,\dfrac{d\theta}{dt} = P(t) - \dfrac{\theta(t)}{R_{th}}\).
  </div>
  <p class="exo-part">Partie A — Modèle de l'enceinte</p>
  <div class="q"><strong>A1.</strong> Établir la fonction de transfert \(H(p) = \Theta(p)/P(p)\) sous forme canonique ; donner son gain et sa constante de temps, avec leurs unités.</div>
  <div class="q"><strong>A2.</strong> La puissance passe de 0 à 400 W à \(t = 0\). Calculer l'écart de température final et le temps de réponse à 5 %.</div>
  <p class="exo-part">Partie B — Une mesure retardée</p>
  <div class="q"><strong>B1.</strong> La sonde est placée dans une gaine de reprise d'air : la mesure \(\theta_m(t)\) reproduit \(\theta(t)\) avec un retard de transport \(T = 30\ \text{s}\). Écrire \(\Theta_m(p)/P(p)\).</div>
  <div class="q"><strong>B2.</strong> Donner \(\theta_m(t)\) pour l'échelon de A2 et l'instant où la mesure atteint 95 % de sa valeur finale.</div>
  <div class="q"><strong>B3.</strong> Ce retard ne modifie ni le gain ni la valeur finale. Expliquer pourquoi il peut pourtant gêner une régulation en boucle fermée.</div>
  <p class="exo-part">Partie C — Une puissance modulée</p>
  <div class="q"><strong>C1.</strong> Le régime établi, la puissance est modulée : \(P(t) = 400 + 200\sin(\omega t)\) (en W), de période 1 h. Montrer qu'en régime permanent \(\theta(t) = 20 + \theta_1\sin(\omega t + \varphi)\) et calculer \(\theta_1\) et \(\varphi\).</div>
  <div class="q"><strong>C2.</strong> Quel décalage temporel sépare un maximum de puissance du maximum de température qui le suit ? Et du maximum de la mesure \(\theta_m\) ? Le retard de la sonde change-t-il l'amplitude mesurée ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Sous conditions initiales nulles : \(Cp\,\Theta = P - \Theta/R_{th}\), donc \(H(p) = \dfrac{R_{th}}{1 + R_{th}C\,p}\) : gain \(K = R_{th} = 0{,}050\ \text{K}\cdot\text{W}^{-1}\), constante de temps \(\tau = R_{th}C = 1{,}0\times 10^{3}\ \text{s}\).</p>
    <p><strong>A2.</strong> \(\theta_\infty = K\,P_0 = 0{,}050 \times 400 = 20\ \text{K}\), atteint à 5 % près au bout de \(3\tau = 3{,}0\times 10^{3}\ \text{s}\), soit 50 min.</p>
    <p><strong>B1.</strong> Théorème du retard : \(\dfrac{\Theta_m(p)}{P(p)} = e^{-Tp}\,H(p) = \dfrac{0{,}050\,e^{-30p}}{1 + 1000\,p}\).</p>
    <p><strong>B2.</strong> \(\theta_m(t) = 0\) pour \(t \lt 30\ \text{s}\), puis \(\theta_m(t) = 20\,\big(1 - e^{-(t - 30)/1000}\big)\) : 95 % sont atteints à \(t = 3030\ \text{s}\).</p>
    <p><strong>B3.</strong> Une régulation compare la mesure à la consigne pour doser la puissance. Avec le retard, elle découvre l'effet de son action 30 s trop tard : si elle est réglée vivement, elle continue de chauffer alors que l'enceinte a déjà dépassé la consigne, d'où des dépassements puis des oscillations. En fréquentiel, le retard ajoute un déphasage \(-\omega T\) qui croît sans limite et ronge la marge de phase (chapitre « Stabilité des systèmes asservis »).</p>
    <p><strong>C1.</strong> Le système est linéaire : la réponse à \(P(t)\) est la somme des réponses à la partie constante (400 W donnent \(K \times 400 = 20\) K, A2) et à la partie sinusoïdale. Pour celle-ci, \(\omega = \dfrac{2\pi}{3600} \approx 1{,}75\times 10^{-3}\ \text{rad/s}\), \(\tau\omega \approx 1{,}75\), et \(H(j\omega) = \dfrac{R_{th}}{1 + j\tau\omega}\) : \(|H| = \dfrac{0{,}050}{\sqrt{1 + 1{,}75^2}} \approx 0{,}0249\ \text{K/W}\), d'où \(\theta_1 \approx 200 \times 0{,}0249 \approx 5{,}0\ \text{K}\), et \(\varphi = -\arctan(\tau\omega) \approx -60°\) (\(-1{,}05\) rad).</p>
    <p><strong>C2.</strong> Le déphasage de \(-1{,}05\) rad correspond à un décalage \(\dfrac{1{,}05}{\omega} \approx 600\ \text{s}\), soit 10 min. La mesure ajoute son retard de 30 s : environ 630 s. Le retard pur a pour module \(|e^{-j\omega T}| = 1\) : il ne change pas l'amplitude mesurée (5,0 K), seulement la phase, de \(-\omega T \approx -3°\).</p>
  </div>
