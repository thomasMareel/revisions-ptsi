<div class="course-section">
  <div class="sec-num">§1 · PRINCIPE</div>
  <h2>Détecter les défauts sans détruire la pièce</h2>
  <div class="notice"><strong>Hors programme en PTSI</strong> (pour aller plus loin) : le contrôle non destructif (ressuage, magnétoscopie, ultrasons, radiographie, courants de Foucault) ne figure au programme de SI de 2021 dans aucune des deux années ; ce chapitre est de la culture technologique. Le programme demande seulement, en 2ᵉ année, de contrôler la conformité géométrique et dimensionnelle d'un produit (dispositifs de contrôle, nuages de points, méthodes d'association).</div>
  <div class="intro">Le <strong>contrôle non destructif (CND)</strong> recherche des défauts (fissures, porosités, inclusions, retassures, manque de fusion d'une soudure) <strong>sans détruire ni altérer</strong> la pièce : on peut la mettre en service après contrôle. Indispensable pour les pièces <strong>critiques</strong> (aéronautique, soudures, fonderie).</div>
  <div class="def-box">
    On l'oppose au <strong>contrôle destructif</strong> (essais de traction, de résilience…) qui détruit une <strong>éprouvette</strong> et ne porte que sur un échantillon. Le CND, lui, peut contrôler <strong>100 %</strong> des pièces produites.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · MÉTHODES DE SURFACE (DÉFAUTS DÉBOUCHANTS)</div>
  <h2>Ressuage &amp; magnétoscopie</h2>

  <figure class="schema" style="max-width:320px">
  <svg viewBox="0 0 320 130" role="img" aria-label="Ressuage : un pénétrant remplit une fissure débouchante et ressort sous l'effet du révélateur, rendant le défaut visible">
    <rect x="40" y="48" width="240" height="70" class="fl-soft sk-ink"/>
    <path d="M156,48 L160,98 L164,48 Z" class="fl-accent sk-accent"/>
    <ellipse cx="160" cy="46" rx="18" ry="6" class="fl-accent-soft"/>
    <line x1="210" y1="30" x2="168" y2="46" class="sk-axis"/>
    <text x="212" y="28" class="lab-accent" style="font-size:8.5px">le pénétrant ressort</text>
    <text x="160" y="112" class="lab-muted" text-anchor="middle" style="font-size:8.5px">fissure débouchante</text>
  </svg>
  <figcaption>Ressuage : un pénétrant s'infiltre dans la fissure <strong>débouchante</strong> ; après essuyage, un révélateur le fait « ressuer » → le défaut devient visible.</figcaption>
  </figure>

  <div class="prop-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Ressuage</strong> : un <strong>pénétrant</strong> (coloré ou fluorescent) s'infiltre dans les fissures <strong>débouchantes</strong> ; après essuyage, un <strong>révélateur</strong> le fait ressortir → défaut visible. Tous matériaux non poreux. <em>Défauts débouchants seulement.</em></li>
      <li><strong>Magnétoscopie</strong> : on aimante une pièce <strong>ferromagnétique</strong> (acier) ; un défaut dévie les lignes de champ et crée une <strong>fuite de flux</strong> qui retient une poudre magnétique → révèle les défauts débouchants <em>et</em> sous-cutanés (faible profondeur). <em>Matériaux ferromagnétiques uniquement.</em></li>
    </ul>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MÉTHODES VOLUMIQUES (DÉFAUTS INTERNES)</div>
  <h2>Ultrasons, radiographie, courants de Foucault</h2>

  <figure class="schema" style="max-width:320px">
  <svg viewBox="0 0 320 170" role="img" aria-label="Contrôle par ultrasons : une sonde émet une onde qui se réfléchit sur un défaut interne et revient en écho">

    <rect x="128" y="38" width="44" height="14" class="fl-accent2-soft sk-accent2"/>
    <text x="150" y="32" class="lab-accent2" text-anchor="middle" style="font-size:9px">sonde</text>
    <ellipse cx="148" cy="112" rx="16" ry="9" class="fl-amber-soft sk-amber"/>
    <text x="148" y="134" class="lab-muted" text-anchor="middle" style="font-size:8.5px">défaut</text>
    <line x1="145" y1="52" x2="145" y2="103" class="sk-accent" marker-end="url(#sk-arrow-accent)"/>
    <line x1="158" y1="103" x2="158" y2="52" class="sk-accent2" marker-end="url(#sk-arrow-accent2)"/>
    <text x="208" y="80" class="lab-accent" style="font-size:8px">émission</text>
    <text x="208" y="92" class="lab-accent2" style="font-size:8px">écho</text>
  </svg>
  <figcaption>Ultrasons : la sonde émet une onde ; l'<strong>écho</strong> renvoyé par un défaut interne permet de le détecter et de le <strong>localiser en profondeur</strong> (profondeur \(= c\,t/2\), comme un sonar).</figcaption>
  </figure>

  <div class="prop-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Ultrasons (UT)</strong> : une sonde émet des ultrasons ; les défauts internes renvoient un <strong>écho</strong> → détection <em>et</em> localisation en profondeur (\(p = c\,t/2\)). Matériaux denses.</li>
      <li><strong>Radiographie (RT)</strong> : des rayons X ou γ traversent la pièce ; les défauts (porosités, retassures, manque de fusion, moins denses) apparaissent plus <strong>sombres</strong> sur l'image. Idéal pour soudures et pièces moulées. <em>Rayonnements → zone contrôlée.</em></li>
      <li><strong>Courants de Foucault</strong> : une bobine induit des courants dans un matériau <strong>conducteur</strong> ; un défaut les perturbe → détection de défauts de surface/sous-surface, mesure d'épaisseur de revêtement.</li>
    </ul>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CHOISIR &amp; SITUER LE CND</div>
  <h2>Quelle méthode pour quel défaut ?</h2>
  <div class="def-box">
    Le choix dépend de :
    <ul style="margin:0.3rem 0">
      <li>la <strong>position du défaut</strong> : débouchant (ressuage, magnétoscopie) ou interne (ultrasons, radiographie) ;</li>
      <li>le <strong>matériau</strong> : ferromagnétique → magnétoscopie ; conducteur → courants de Foucault ;</li>
      <li>l'<strong>accessibilité</strong>, le coût et la <strong>sécurité</strong> (la radiographie impose une zone contrôlée à cause des rayonnements).</li>
    </ul>
  </div>
  <div class="notice">Place dans la fabrication : le CND <strong>contrôle la conformité</strong> après obtention (soudures, pièces moulées critiques) ; il complète le contrôle <strong>dimensionnel</strong> (cotation/tolérances) qui, lui, vérifie les cotes.</div>
</div>

<template class="pan-tpl" data-panneau="cnd-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CND</div>

  <div class="method-box">
    <strong>Méthode 1 — Défaut débouchant ou interne ?</strong>
    <ol style="margin-top:.4rem">
      <li><strong>Débouchant</strong> (en surface) → ressuage (tous matériaux) ou magnétoscopie (acier).</li>
      <li><strong>Interne</strong> (en volume) → ultrasons (localisation en profondeur) ou radiographie (image des porosités/soudures).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Tenir compte du matériau</strong>
    <ol style="margin-top:.4rem">
      <li>Acier (ferromagnétique) → la magnétoscopie est possible.</li>
      <li>Matériau conducteur → courants de Foucault possibles.</li>
      <li>Matériau non ferromagnétique et défaut débouchant → ressuage.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Localiser un défaut par ultrasons</strong>
    <ol style="margin-top:.4rem">
      <li>Mesurer le temps de vol \(t\) entre l'émission et l'écho du défaut.</li>
      <li>Profondeur : \(p = \dfrac{c\,t}{2}\) (aller-retour), avec \(c\) la célérité des ultrasons dans le matériau.</li>
    </ol>
  </div>
</div>
</template>

  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Quelle méthode ?</h3>
  <div class="statement">Associer une méthode de CND à chaque situation.</div>
  <div class="q"><strong>Q1.</strong> Fissure débouchante sur une pièce en aluminium.</div>
  <div class="q"><strong>Q2.</strong> Porosité interne dans une soudure d'acier.</div>
  <div class="q"><strong>Q3.</strong> Fissure débouchante sur une pièce en acier.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> <strong>Ressuage</strong> (aluminium non ferromagnétique, défaut débouchant).</p>
    <p><strong>Q2.</strong> <strong>Radiographie</strong> (ou ultrasons) : défaut interne, image des porosités d'une soudure.</p>
    <p><strong>Q3.</strong> <strong>Magnétoscopie</strong> (acier ferromagnétique) ou ressuage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Destructif ou non destructif ?</h3>
  <div class="statement">On veut garantir l'intégrité de 100 % des soudures d'un réservoir.</div>
  <div class="q"><strong>Q1.</strong> Un essai de traction sur éprouvette convient-il ? Pourquoi ?</div>
  <div class="q"><strong>Q2.</strong> Quel intérêt majeur du CND ici ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Non : un essai de traction est <strong>destructif</strong> et ne porte que sur une éprouvette (échantillon) — on ne peut pas détruire les soudures du réservoir.</p>
    <p><strong>Q2.</strong> Le CND ne détruit pas la pièce : on peut contrôler <strong>100 %</strong> des soudures et mettre le réservoir en service ensuite.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Profondeur par ultrasons</h3>
  <div class="statement">Une sonde ultrasons contrôle une pièce en acier (\(c = 5900\) m/s). L'écho d'un défaut revient \(t = 12\ \mu\text{s}\) après l'émission.</div>
  <div class="q"><strong>Q1.</strong> À quelle profondeur se trouve le défaut ?</div>
  <div class="q"><strong>Q2.</strong> Pourquoi le facteur \(1/2\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(p = \dfrac{c\,t}{2} = \dfrac{5900 \times 12\times10^{-6}}{2} \approx 0{,}035\) m \(= 35\) mm.</p>
    <p><strong>Q2.</strong> Parce que l'onde fait l'<strong>aller-retour</strong> (descente jusqu'au défaut + remontée de l'écho) : la distance parcourue est \(2p\), donc \(p = c\,t/2\) (même principe que le sonar).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Plan de contrôle d'une pièce critique</h3>
  <div class="exo-source">
    Exercice <strong>original</strong>, calibré sur le format des épreuves PT (qualité / contrôle). Pour t'entraîner sur les sujets réels :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un support critique en acier est obtenu par <strong>moulage</strong> puis assemblé par <strong>soudage</strong> ; certaines portées sont ensuite <strong>usinées</strong>. On établit son plan de contrôle. La célérité des ultrasons dans l'acier est \(c = 5900\) m/s.
  </div>

  <p class="exo-part">Partie A — Choix des méthodes</p>
  <div class="q"><strong>A1.</strong> Pour détecter des retassures/porosités internes issues du moulage, quelle(s) méthode(s) de CND choisir ?</div>
  <div class="q"><strong>A2.</strong> Pour vérifier les soudures (porosités, manque de fusion internes), que choisir ? Et pour des fissures débouchantes en surface de soudure ?</div>

  <p class="exo-part">Partie B — Localisation par ultrasons</p>
  <div class="q"><strong>B1.</strong> Lors d'un contrôle UT, l'écho d'un défaut revient \(t = 10\ \mu\text{s}\) après l'émission. Calculer sa profondeur.</div>
  <div class="q"><strong>B2.</strong> Pourquoi cette méthode donne-t-elle, en plus de la détection, la position du défaut ?</div>

  <p class="exo-part">Partie C — Place dans la chaîne qualité</p>
  <div class="q"><strong>C1.</strong> Le CND remplace-t-il le contrôle dimensionnel (cotation/tolérances) des portées usinées ? Justifier.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Des méthodes <strong>volumiques</strong> : <strong>radiographie</strong> (image des retassures/porosités) et/ou <strong>ultrasons</strong> (détection + localisation en profondeur) — les défauts de fonderie sont internes.</p>
    <p><strong>A2.</strong> Soudures, défauts <strong>internes</strong> → radiographie ou ultrasons. Fissures <strong>débouchantes</strong> en surface → ressuage, ou magnétoscopie (l'acier est ferromagnétique).</p>
    <p><strong>B1.</strong> \(p = \dfrac{c\,t}{2} = \dfrac{5900 \times 10\times10^{-6}}{2} \approx 0{,}0295\) m \(\approx 29{,}5\) mm.</p>
    <p><strong>B2.</strong> Parce qu'on mesure le <strong>temps de vol</strong> de l'écho : la profondeur s'en déduit par \(p = c\,t/2\) (l'onde fait l'aller-retour). Le défaut est donc à la fois détecté et localisé.</p>
    <p><strong>C1.</strong> Non : ce sont deux contrôles <strong>complémentaires</strong>. Le CND vérifie l'<strong>intégrité interne</strong> (absence de défauts) ; le contrôle dimensionnel vérifie que les <strong>cotes</strong> et tolérances des portées usinées sont respectées. Une pièce saine mais hors-cote (ou l'inverse) serait refusée.</p>
  </div>
</div>
