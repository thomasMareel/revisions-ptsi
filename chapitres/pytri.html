<tr><td><span class="code-inline">j</span> = 3</td><td>1</td><td>1 &lt; 6 : <span class="code-inline">k</span> avance, échange</td><td><span class="code-inline">k</span> = 2</td><td><span class="code-inline">[6, 3, 1, 8, 9, 4]</span></td></tr>
<tr><td><span class="code-inline">j</span> = 4</td><td>9</td><td>9 ≥ 6 : rien</td><td><span class="code-inline">k</span> = 2</td><td><span class="code-inline">[6, 3, 1, 8, 9, 4]</span></td></tr>
<tr><td><span class="code-inline">j</span> = 5</td><td>4</td><td>4 &lt; 6 : <span class="code-inline">k</span> avance, échange</td><td><span class="code-inline">k</span> = 3</td><td><span class="code-inline">[6, 3, 1, 4, 9, 8]</span></td></tr>
<tr><td>fin</td><td>—</td><td>échange du pivot avec <span class="code-inline">t[3]</span></td><td>renvoie 3</td><td><span class="code-inline">[4, 3, 1, 6, 9, 8]</span></td></tr>
</table></div>
    <p>La fonction renvoie 3 : le pivot 6 est à sa place définitive, avec [4, 3, 1] à gauche et [9, 8] à droite.</p>
    <p><strong>Q2.</strong> Sur une portion triée, le pivot \(t[g]\) est le minimum : aucune valeur ne lui est inférieure, \(k = g\), la partie gauche est vide et la partie droite \(t[g+1..d]\) a perdu une seule case. Partitionner \(L\) cases coûte \(L - 1\) comparaisons, d'où \((n-1) + (n-2) + \dots + 1 = \dfrac{n(n-1)}{2}\) comparaisons, un coût \(O(n^2)\). La profondeur vaut \(n\) (un appel par longueur, de \(n\) à 1). Pour \(n = 1000\), elle dépasse la limite d'environ mille appels de la pile de Python : le programme s'arrête sur une <span class="code-inline">RecursionError</span>.</p>
    <p><strong>Q3.</strong> Le test <span class="code-inline">t[j] &lt; p</span> est toujours faux : comme pour une liste triée, \(k = g\) à chaque partition, \(\dfrac{n(n-1)}{2}\) comparaisons et une profondeur \(n\). Une partition en trois zones (\(\lt p\), \(= p\), \(\gt p\), comme dans l'exercice 8) règlerait ce cas en un seul appel.</p>
    <p><strong>Q4.</strong> On échange la case \(g\) avec une case tirée au hasard avant de partitionner ; la fonction <span class="code-inline">partition</span> est inchangée.</p>
<pre class="codeblock"><span class="kw">import</span> random
<span class="cmt"># random.randint(a, b) : entier au hasard</span>
<span class="cmt"># entre a et b inclus</span>


<span class="kw">def</span> tri_rapide_alea_rec(t, g, d):
    <span class="cmt"># trie t[g..d] en place, pivot tiré au hasard</span>
    <span class="kw">if</span> g &lt; d:
        r = random.randint(g, d)
        t[g], t[r] = t[r], t[g]     <span class="cmt"># pivot en case g</span>
        k = partition(t, g, d)
        tri_rapide_alea_rec(t, g, k - 1)
        tri_rapide_alea_rec(t, k + 1, d)</pre>
    <p>Aucune liste particulière ne provoque plus systématiquement le pire cas : sur une liste déjà triée de mille ou cinq mille valeurs, la profondeur reste de quelques dizaines d'appels.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Notes sur 20 : comptage et médiane</h3>
  <div class="statement">Les notes d'un concours blanc sont des entiers de 0 à 20. On dispose de <span class="code-inline">tri_comptage(t, m)</span> (§7 du cours).</div>
  <div class="q"><strong>Q1.</strong> Que renvoie <span class="code-inline">tri_comptage([12, 7, 15, 12, 9, 7, 12], 20)</span> ? Quelle est la longueur de la liste des compteurs ?</div>
  <div class="q"><strong>Q2.</strong> Pour une liste de longueur impaire, la médiane est la valeur d'indice <span class="code-inline">len(t) // 2</span> de la liste triée. Écrire <span class="code-inline">mediane_notes(t)</span> qui la calcule à partir des compteurs, sans construire la liste triée.</div>
  <div class="q"><strong>Q3.</strong> Comparer le coût avec celui d'un tri par partition-fusion suivi de la lecture de la case du milieu.</div>
  <div class="q"><strong>Q4.</strong> Pourquoi ne pourrait-on pas utiliser la même méthode pour des temps de course mesurés au centième de seconde en flottants ? Que faire si on les exprime en centièmes entiers, entre 0 et \(10^6\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> <span class="code-inline">[7, 7, 9, 12, 12, 12, 15]</span> ; les compteurs forment une liste de \(m + 1 = 21\) cases (notes 0 à 20).</p>
    <p><strong>Q2.</strong> On cumule les effectifs jusqu'à dépasser le rang cherché : la variable <span class="code-inline">vu</span> compte les notes strictement inférieures à <span class="code-inline">v</span>, qui occupent les indices <span class="code-inline">0</span> à <span class="code-inline">vu - 1</span> de la liste triée ; les notes égales à <span class="code-inline">v</span> occupent les indices <span class="code-inline">vu</span> à <span class="code-inline">vu + c[v] - 1</span>.</p>
<pre class="codeblock"><span class="kw">def</span> mediane_notes(t):
    <span class="cmt"># t : notes entières de 0 à 20, en nombre impair ;</span>
    <span class="cmt"># renvoie la médiane sans trier t</span>
    c = [0] * 21
    <span class="kw">for</span> x <span class="kw">in</span> t:
        c[x] = c[x] + 1
    rang = len(t) // 2    <span class="cmt"># indice dans la liste triée</span>
    vu = 0                <span class="cmt"># nombre de notes &lt; v</span>
    <span class="kw">for</span> v <span class="kw">in</span> range(21):
        <span class="kw">if</span> vu + c[v] &gt; rang:
            <span class="kw">return</span> v
        vu = vu + c[v]</pre>
<pre class="codeblock">mediane_notes([12, 7, 15, 12, 9, 7, 12])     <span class="cmt"># 12</span></pre>
    <p>La boucle sur <span class="code-inline">v</span> s'arrête toujours par <span class="code-inline">return</span>, puisque la somme des effectifs vaut <span class="code-inline">len(t)</span>, qui dépasse <span class="code-inline">rang</span>.</p>
    <p><strong>Q3.</strong> Comptage : \(n\) tours puis au plus 21, soit \(O(n)\). Tri par partition-fusion : \(O(n \log n)\). Pour \(n = 10^5\) copies, environ \(10^5\) opérations contre \(1{,}7 \times 10^6\).</p>
    <p><strong>Q4.</strong> Des flottants ne peuvent pas servir d'indices d'une liste. En centièmes entiers, la méthode s'applique, mais la liste des compteurs a \(10^6 + 1\) cases et la boucle de réécriture fait autant de tours, même pour trier trente coureurs : le comptage n'est intéressant que si \(m\) n'est pas grand devant \(n\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Compter les inversions en \(O(n \log n)\)</h3>
  <div class="statement">Le nombre d'inversions d'une liste mesure son désordre ; il sert par exemple à comparer deux classements (le nombre de couples de candidats que deux jurys rangent dans des ordres différents). La fonction <span class="code-inline">nb_inversions</span> du cours examine tous les couples.</div>
  <div class="q"><strong>Q1.</strong> Quel est le coût de <span class="code-inline">nb_inversions</span> ?</div>
  <div class="q"><strong>Q2.</strong> On coupe \(t\) en deux moitiés \(G = t[0..m-1]\) et \(D = t[m..n-1]\). Montrer que le nombre d'inversions de \(t\) est la somme des inversions de \(G\), de celles de \(D\) et du nombre de couples \((x, y)\) avec \(x\) dans \(G\), \(y\) dans \(D\) et \(x \gt y\) ; puis que ce dernier nombre ne change pas si l'on trie \(G\) et \(D\).</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">fusion_inv(a, b)</span>, qui renvoie la fusion de deux listes triées et le nombre de couples \((x, y)\), \(x\) dans <span class="code-inline">a</span>, \(y\) dans <span class="code-inline">b</span>, \(x \gt y\) ; puis <span class="code-inline">tri_inv(t)</span>, qui renvoie la liste triée et son nombre d'inversions. Donner le coût de <span class="code-inline">tri_inv</span>.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Une comparaison par couple \((i, j)\), \(i \lt j\) : \(\dfrac{n(n-1)}{2}\) comparaisons, \(O(n^2)\).</p>
    <p><strong>Q2.</strong> Un couple d'indices \(i \lt j\) a ses deux indices dans \(G\), ou ses deux indices dans \(D\), ou \(i\) dans \(G\) et \(j\) dans \(D\) : les trois familles se partagent les inversions. Dans la troisième, un couple est une inversion si la valeur de gauche est plus grande que celle de droite ; leur nombre ne dépend que des ensembles de valeurs de \(G\) et de \(D\), pas de leur ordre interne : il est inchangé si l'on trie chaque moitié.</p>
    <p><strong>Q3.</strong> Dans la fusion, quand on prend \(b[j]\) parce que \(a[i] \gt b[j]\), toutes les valeurs \(a[i], a[i+1], \dots\) (triées) sont aussi \(\gt b[j]\) : on compte d'un coup <span class="code-inline">len(a) - i</span> couples. Quand on prend \(a[i]\), aucune valeur restante de <span class="code-inline">b</span> ne lui est inférieure.</p>
<pre class="codeblock"><span class="kw">def</span> fusion_inv(a, b):
    <span class="cmt"># a et b triées ; renvoie (fusion de a et b,</span>
    <span class="cmt"># nombre de couples (x, y) de a × b avec x &gt; y)</span>
    res, inv = [], 0
    i, j = 0, 0
    <span class="kw">while</span> i &lt; len(a) <span class="kw">and</span> j &lt; len(b):
        <span class="kw">if</span> a[i] &lt;= b[j]:
            res.append(a[i])
            i = i + 1
        <span class="kw">else</span>:
            res.append(b[j])
            inv = inv + len(a) - i   <span class="cmt"># a[i..] &gt; b[j]</span>
            j = j + 1
    <span class="kw">return</span> res + a[i:] + b[j:], inv


<span class="kw">def</span> tri_inv(t):
    <span class="cmt"># renvoie (t triée, nombre d'inversions de t)</span>
    n = len(t)
    <span class="kw">if</span> n &lt;= 1:
        <span class="kw">return</span> t.copy(), 0
    m = n // 2
    g, ng = tri_inv(t[0:m])    <span class="cmt"># dans la moitié gauche</span>
    d, nd = tri_inv(t[m:n])    <span class="cmt"># dans la moitié droite</span>
    r, nf = fusion_inv(g, d)   <span class="cmt"># à cheval sur les deux</span>
    <span class="kw">return</span> r, ng + nd + nf</pre>
<pre class="codeblock">tri_inv([4, 9, 2, 7, 1])      <span class="cmt"># ([1, 2, 4, 7, 9], 7)</span></pre>
    <p>On ajoute à la fusion un travail constant par tour : le coût vérifie la même relation que le tri fusion, \(C(n) = 2\,C(n/2) + c\,n\), d'où \(O(n \log n)\). Pour \(n = 10^6\), environ \(2 \times 10^7\) opérations au lieu de \(5 \times 10^{11}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Le drapeau à trois couleurs</h3>
  <div class="statement">Une liste <span class="code-inline">t</span> ne contient que des 0, des 1 et des 2 (par exemple les couleurs bleu, blanc, rouge de cases à ranger). On veut la trier en place, en un seul parcours.</div>
  <div class="q"><strong>Q1.</strong> Le tri par comptage convient-il ? Quelle est sa limite si chaque case contient une fiche dont la couleur n'est qu'un des champs ?</div>
  <div class="q"><strong>Q2.</strong> On maintient trois indices \(a \le i \le b + 1\) et l'invariant : \(t[0..a-1]\) ne contient que des 0, \(t[a..i-1]\) que des 1, \(t[b+1..n-1]\) que des 2, la zone \(t[i..b]\) n'étant pas encore examinée. Écrire <span class="code-inline">trier_012(t)</span>.</div>
  <div class="q"><strong>Q3.</strong> Prouver la terminaison, la correction et donner le coût.</div>
  <div class="q"><strong>Q4.</strong> Quel intérêt cette partition en trois zones présente-t-elle pour le tri rapide ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Oui pour des nombres : compter les 0, 1, 2 puis réécrire, en \(O(n)\), mais en deux parcours. Pour des fiches, réécrire « une couleur » ne suffit pas : il faut déplacer les fiches elles-mêmes, d'où la méthode par échanges.</p>
    <p><strong>Q2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> trier_012(t):
    <span class="cmt"># t ne contient que des 0, des 1 et des 2 ;</span>
    <span class="cmt"># trie t en place en un seul parcours</span>
    a, i, b = 0, 0, len(t) - 1
    <span class="kw">while</span> i &lt;= b:
        <span class="cmt"># invariant : t[0..a-1] que des 0,</span>
        <span class="cmt"># t[a..i-1] que des 1, t[b+1..n-1] que des 2</span>
        <span class="kw">if</span> t[i] == 0:
            t[a], t[i] = t[i], t[a]
            a, i = a + 1, i + 1
        <span class="kw">elif</span> t[i] == 1:
            i = i + 1
        <span class="kw">else</span>:
            t[i], t[b] = t[b], t[i]
            b = b - 1</pre>
<pre class="codeblock">t = [2, 0, 1, 2, 0, 1, 0]
trier_012(t)
t              <span class="cmt"># [0, 0, 0, 1, 1, 2, 2]</span></pre>
    <p><strong>Q3.</strong> Au départ \(a = i = 0\), \(b = n - 1\) : les trois zones décrites sont vides. Un tour examine \(t[i]\) : un 0 est échangé avec \(t[a]\) (qui est un 1, ou \(t[i]\) lui-même si \(a = i\)) et les zones des 0 et des 1 avancent ; un 1 agrandit la zone des 1 ; un 2 est échangé avec \(t[b]\), non examiné, et la zone des 2 s'agrandit, \(i\) restant sur place puisque la valeur reçue n'est pas encore examinée. Dans tous les cas, l'invariant est conservé et le variant \(b - i + 1\) (taille de la zone non examinée) diminue de 1. Il vaut \(n\) au départ : la boucle fait exactement \(n\) tours, avec au plus un échange chacun. À la sortie, \(i = b + 1\) : la zone non examinée est vide, la liste est triée. Coût \(O(n)\), espace \(O(1)\).</p>
    <p><strong>Q4.</strong> Avec une partition en zones \(\lt p\), \(= p\), \(\gt p\), le tri rapide ne trie récursivement que les zones \(\lt p\) et \(\gt p\). Sur une liste où une même valeur se répète beaucoup (toutes égales, à l'extrême), il évite le pire cas quadratique de l'exercice 5.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Classement d'une course d'orientation</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : algorithmes de tri, stabilité, complexité).</div>
  <div class="statement">À l'arrivée d'une course d'orientation, chaque coureur est enregistré par un triplet <span class="code-inline">(dossard, categorie, temps)</span> d'entiers : <span class="code-inline">categorie</span> est compris entre 0 et <span class="code-inline">nc - 1</span>, <span class="code-inline">temps</span> est la durée de course en secondes. Les résultats forment une liste <span class="code-inline">res</span> de \(n\) triplets, dans l'ordre d'enregistrement. Exemple :</div>
<pre class="codeblock">res = [(31, 2, 2710), (7, 0, 3105), (12, 2, 2650),
       (44, 1, 2988), (5, 0, 2874), (18, 1, 2650)]</pre>
  <div class="statement">Seuls les éléments de Python de l'annexe du programme sont autorisés ; en particulier, les fonctions <span class="code-inline">sorted</span> et <span class="code-inline">sort</span> sont interdites. Le triplet <span class="code-inline">r</span> a pour temps <span class="code-inline">r[2]</span>.</div>
  <div class="exo-part"><strong>Partie A — Classement général d'une petite course</strong></div>
  <div class="q"><strong>Q1.</strong> Écrire une fonction <span class="code-inline">classer_temps(res: list) -&gt; None</span> qui trie <span class="code-inline">res</span> en place par temps croissants, par la méthode du tri par insertion.</div>
  <div class="q"><strong>Q2.</strong> Donner l'ordre des dossards obtenu sur l'exemple. Les coureurs 12 et 18 sont ex aequo : dans quel ordre apparaissent-ils, et pourquoi ?</div>
  <div class="q"><strong>Q3.</strong> Donner la complexité dans le pire cas de <span class="code-inline">classer_temps</span>. Les coureurs étant enregistrés à peu près dans leur ordre d'arrivée, on suppose que chacun se trouve à au plus \(k\) places de son rang final. Montrer que le coût est alors \(O(n\,k)\).</div>
  <div class="exo-part"><strong>Partie B — Un marathon de \(10^5\) coureurs</strong></div>
  <div class="q"><strong>Q4.</strong> Écrire <span class="code-inline">fusion_temps(a: list, b: list) -&gt; list</span>, qui fusionne deux listes de triplets triées par temps, puis <span class="code-inline">tri_fusion_temps(res: list) -&gt; list</span>, qui renvoie une nouvelle liste triée par temps par la méthode de partition-fusion. Les ex aequo doivent rester dans leur ordre d'enregistrement.</div>
  <div class="q"><strong>Q5.</strong> Comparer les ordres de grandeur du nombre de comparaisons des deux méthodes, dans le pire cas, pour \(n = 10^5\).</div>
  <div class="exo-part"><strong>Partie C — Classement par catégories</strong></div>
  <div class="q"><strong>Q6.</strong> Écrire <span class="code-inline">effectifs_cat(res: list, nc: int) -&gt; list</span>, qui renvoie la liste <span class="code-inline">eff</span> de longueur <span class="code-inline">nc</span> telle que <span class="code-inline">eff[c]</span> est le nombre de coureurs de la catégorie <span class="code-inline">c</span>.</div>
  <div class="q"><strong>Q7.</strong> Écrire <span class="code-inline">debuts(eff: list) -&gt; list</span>, qui renvoie la liste <span class="code-inline">deb</span> telle que <span class="code-inline">deb[c]</span> est le nombre de coureurs des catégories 0 à <span class="code-inline">c - 1</span>.</div>
  <div class="q"><strong>Q8.</strong> En déduire <span class="code-inline">classer_categories(res: list, nc: int) -&gt; list</span>, qui renvoie une nouvelle liste triée par catégories croissantes, l'ordre de <span class="code-inline">res</span> étant conservé à l'intérieur de chaque catégorie. Donner sa complexité.</div>
  <div class="q"><strong>Q9.</strong> Comment obtenir, avec les fonctions précédentes, le classement par catégorie puis, dans chaque catégorie, par temps ? Justifier et donner la complexité totale pour le marathon.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le tri par insertion du cours, en comparant les temps :</p>
<pre class="codeblock"><span class="kw">def</span> classer_temps(res):
    <span class="cmt"># res : liste de triplets (dossard, categorie,</span>
    <span class="cmt"># temps) ; trie res en place par temps croissants</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(res)):
        r = res[i]
        j = i - 1
        <span class="kw">while</span> j &gt;= 0 <span class="kw">and</span> res[j][2] &gt; r[2]:
            res[j + 1] = res[j]
            j = j - 1
        res[j + 1] = r</pre>
    <p><strong>Q2.</strong> Dossards 12, 18, 31, 5, 44, 7 (temps 2650, 2650, 2710, 2874, 2988, 3105). Le coureur 12 précède le coureur 18 : il était enregistré avant lui, et le tri par insertion est stable (le test <span class="code-inline">res[j][2] &gt; r[2]</span> est strict, donc 18 s'arrête derrière 12).</p>
    <p><strong>Q3.</strong> Pire cas (liste rangée par temps décroissants) : \(\dfrac{n(n-1)}{2}\) comparaisons, \(O(n^2)\). Si chaque coureur est à au plus \(k\) places de son rang final : quand on insère le coureur d'indice \(i\), les coureurs qu'il dépasse le précèdent dans la liste (indices \(\lt i\)) mais le suivent dans le classement (rangs \(\gt\) le sien, qui est \(\ge i - k\)) ; leurs rangs sont aussi \(\le\) leur indice \(+ k\), donc \(\lt i + k\). Ils ont des rangs dans \(]i - k, i + k[\) : il y en a au plus \(2k\). Chaque insertion coûte \(O(k)\) (plus une comparaison d'arrêt), soit \(O(n\,k)\) en tout, presque linéaire si \(k\) est petit.</p>
    <p><strong>Q4.</strong> Le test <span class="code-inline">&lt;=</span> place d'abord, à temps égal, le coureur de la moitié gauche, enregistré plus tôt : le tri est stable.</p>
<pre class="codeblock"><span class="kw">def</span> fusion_temps(a, b):
    <span class="cmt"># a, b : triplets triés par temps ; renvoie la fusion</span>
    f = []
    i, j = 0, 0
    <span class="kw">while</span> i &lt; len(a) <span class="kw">and</span> j &lt; len(b):
        <span class="kw">if</span> a[i][2] &lt;= b[j][2]:
            f.append(a[i])
            i = i + 1
        <span class="kw">else</span>:
            f.append(b[j])
            j = j + 1
    <span class="kw">return</span> f + a[i:] + b[j:]


<span class="kw">def</span> tri_fusion_temps(res):
    <span class="cmt"># renvoie une nouvelle liste : res triée par temps</span>
    n = len(res)
    <span class="kw">if</span> n &lt;= 1:
        <span class="kw">return</span> res.copy()
    m = n // 2
    a = tri_fusion_temps(res[0:m])
    b = tri_fusion_temps(res[m:n])
    <span class="kw">return</span> fusion_temps(a, b)</pre>
    <p><strong>Q5.</strong> Insertion, pire cas : \(\dfrac{n(n-1)}{2} \approx 5 \times 10^9\) comparaisons. Partition-fusion : au plus de l'ordre de \(n \log_2 n \approx 1{,}7 \times 10^6\). Trois mille fois moins : quelques secondes au lieu de plusieurs heures en Python.</p>
    <p><strong>Q6, Q7, Q8.</strong> Les coureurs de la catégorie <span class="code-inline">c</span> occuperont, dans le résultat, les places <span class="code-inline">deb[c]</span> à <span class="code-inline">deb[c] + eff[c] - 1</span>. On parcourt <span class="code-inline">res</span> dans l'ordre et l'on range chaque coureur à la première place libre de sa catégorie, qu'on avance ensuite d'une case : deux coureurs d'une même catégorie gardent leur ordre relatif.</p>
<pre class="codeblock"><span class="kw">def</span> effectifs_cat(res, nc):
    <span class="cmt"># eff[c] : nombre de coureurs de la catégorie c</span>
    eff = [0] * nc
    <span class="kw">for</span> r <span class="kw">in</span> res:
        eff[r[1]] = eff[r[1]] + 1
    <span class="kw">return</span> eff


<span class="kw">def</span> debuts(eff):
    <span class="cmt"># deb[c] : nombre de coureurs des catégories 0 à</span>
    <span class="cmt"># c - 1, première place libre pour la catégorie c</span>
    deb = [0] * len(eff)
    <span class="kw">for</span> c <span class="kw">in</span> range(1, len(eff)):
        deb[c] = deb[c - 1] + eff[c - 1]
    <span class="kw">return</span> deb


<span class="kw">def</span> classer_categories(res, nc):
    <span class="cmt"># renvoie une nouvelle liste : res triée par</span>
    <span class="cmt"># catégories, l'ordre de res étant conservé dans</span>
    <span class="cmt"># chaque catégorie (tri stable)</span>
    deb = debuts(effectifs_cat(res, nc))
    sortie = [<span class="kw">None</span>] * len(res)
    <span class="kw">for</span> r <span class="kw">in</span> res:         <span class="cmt"># dans l'ordre de res</span>
        c = r[1]
        sortie[deb[c]] = r
        deb[c] = deb[c] + 1
    <span class="kw">return</span> sortie</pre>
    <p>Complexité : <span class="code-inline">effectifs_cat</span> en \(O(n + nc)\) (la création de la liste compte), <span class="code-inline">debuts</span> en \(O(nc)\), la boucle de rangement en \(O(n)\) : \(O(n + nc)\) au total, linéaire. Sur l'exemple, après la partie A :</p>
<pre class="codeblock">classer_temps(res)
[r[0] <span class="kw">for</span> r <span class="kw">in</span> res]       <span class="cmt"># [12, 18, 31, 5, 44, 7]</span>
effectifs_cat(res, 3)                     <span class="cmt"># [2, 2, 2]</span>
debuts([2, 2, 2])                         <span class="cmt"># [0, 2, 4]</span>
u = classer_categories(res, 3)
[r[0] <span class="kw">for</span> r <span class="kw">in</span> u]         <span class="cmt"># [5, 7, 18, 44, 12, 31]</span></pre>
    <p><strong>Q9.</strong> On trie d'abord par temps (<span class="code-inline">tri_fusion_temps</span>), puis on applique <span class="code-inline">classer_categories</span> au résultat. Ce second tri est stable : à l'intérieur d'une catégorie, il conserve l'ordre de la liste qu'il reçoit, c'est-à-dire l'ordre des temps. Complexité : \(O(n \log n)\) pour le premier tri, \(O(n + nc)\) pour le second, \(O(n \log n)\) au total (\(nc\) étant petit). Trier dans l'ordre inverse (catégories puis temps) ne marcherait pas : le tri par temps mélangerait les catégories.</p>
  </div>
