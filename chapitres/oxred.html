<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 4.4.2 du programme de PTSI (« Réactions d'oxydo-réduction »), sauf les diagrammes potentiel-pH, traités dans <a href="#eph/cours">« Diagrammes E-pH »</a>, et la partie expérimentale sur les titrages (« Analyses qualitatives et quantitatives »). Il réinvestit l'avancement, le quotient de réaction et la constante d'équilibre de <a href="#equilchim/cours">« Équilibres chimiques »</a>, ainsi que les diagrammes de prédominance et d'existence de <a href="#acidobase/cours">« Réactions acido-basiques »</a> et de <a href="#precipitation/cours">« Réactions de dissolution et de précipitation »</a>. La formule de Nernst est <strong>admise</strong> en première année.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Oxydants, réducteurs, réactions d'oxydo-réduction</strong> : identifier l'oxydant et le réducteur d'un couple, écrire une demi-équation et l'équation d'une réaction (§1).</li>
        <li><strong>Nombre d'oxydation</strong> ; relier la position d'un élément dans le tableau périodique au caractère oxydant ou réducteur du corps simple ; prévoir les nombres d'oxydation extrêmes d'un élément (§2).</li>
        <li><strong>Oxydants et réducteurs minéraux usuels</strong> : nom, nature et formule des ions thiosulfate, permanganate, hypochlorite et du peroxyde d'hydrogène (§2).</li>
        <li><strong>Potentiel d'électrode, formule de Nernst</strong> (admise) (§3).</li>
        <li><strong>Aspect thermodynamique</strong> : prévoir qualitativement ou quantitativement le caractère thermodynamiquement favorisé ou défavorisé d'une réaction à partir des potentiels standard (§4, §8).</li>
        <li><strong>Pile, tension à vide</strong> : décrire le fonctionnement d'une pile à partir d'une mesure de tension à vide ou à partir des potentiels d'électrode ; réaliser une pile et étudier son fonctionnement (§5).</li>
        <li><strong>Électrodes de référence</strong> (§6).</li>
        <li><strong>Diagrammes de prédominance ou d'existence</strong> : les utiliser pour prévoir les espèces incompatibles ou la nature des espèces majoritaires (§7).</li>
        <li><strong>Dismutation et médiamutation</strong> (§9) ; leur dépendance au pH est vue dans « Diagrammes E-pH ».</li>
        <li><strong>Analyse quantitative</strong> (capacités expérimentales) : mettre en œuvre une réaction d'oxydo-réduction pour doser une espèce ; titrages directs et indirects, suivi potentiométrique, repérage de l'équivalence (§10).</li>
        <li><strong>Influence du milieu</strong> : réinvestir les réactions acido-basiques et de précipitation pour étudier les espèces oxydantes ou réductrices présentes (§11).</li>
      </ul>
      <p>Hors programme en PTSI (vu en 2ᵉ année) : la démonstration de la formule de Nernst, la relation \(\Delta_rG^\circ = -nF\,\Delta E^\circ\) et le calcul d'un potentiel standard par combinaison d'enthalpies libres (<a href="#thermochimie/cours">« Thermodynamique de la transformation chimique »</a>), la capacité d'une pile, l'électrolyse, les courbes courant-potentiel et la corrosion (<a href="#electrochimie/cours">« Électrochimie »</a>). Ils sont regroupés en fin de chapitre.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · OXYDANTS, RÉDUCTEURS ET DEMI-ÉQUATIONS</div>
  <h2>Une réaction d'oxydoréduction est un échange d'électrons</h2>
  <div class="intro">Piles et batteries, rouille, eau de Javel, respiration, combustion, métallurgie : toutes ces transformations reposent sur un transfert d'électrons d'une espèce à une autre. Cette section fixe le vocabulaire et apprend à écrire, puis à équilibrer, les équations qui décrivent ces transferts.</div>
  <div class="def-box">
    <strong>Oxydant, réducteur, couple.</strong> Un <strong>oxydant</strong> est une espèce capable de capter un ou plusieurs électrons ; un <strong>réducteur</strong> est une espèce capable d'en céder. Un oxydant Ox et un réducteur Red qui se transforment l'un en l'autre par échange de \(n\) électrons forment un <strong>couple oxydant/réducteur</strong>, noté Ox/Red, décrit par la <strong>demi-équation électronique</strong> formelle
    <div class="formula" data-nom="Demi-équation électronique">$$\mathrm{Ox} + n\,e^- = \mathrm{Red}$$</div>
    Une <strong>oxydation</strong> est une perte d'électrons (Red → Ox), une <strong>réduction</strong> un gain d'électrons (Ox → Red).
  </div>
  <p>Exemples : Cu²⁺/Cu (Cu²⁺ + 2 e⁻ = Cu), Fe³⁺/Fe²⁺ (Fe³⁺ + e⁻ = Fe²⁺), H⁺/H₂ (2 H⁺ + 2 e⁻ = H₂), I₂/I⁻ (I₂ + 2 e⁻ = 2 I⁻). Un oxydant <em>subit</em> une réduction : il oxyde son partenaire et se réduit lui-même ; un réducteur s'oxyde en réduisant son partenaire.</p>
  <div class="prop-box">
    <strong>Réaction d'oxydoréduction.</strong> Les électrons n'existent pas libres en solution aqueuse : une réaction d'oxydoréduction transfère des électrons du réducteur Red₂ d'un couple à l'oxydant Ox₁ d'un autre couple. On combine les deux demi-équations de façon que les électrons cédés soient tous captés : si le couple 1 échange \(n_1\) électrons et le couple 2 en échange \(n_2\), on multiplie la première par \(n_2\), la seconde par \(n_1\) (ou par les plus petits facteurs qui égalisent les électrons), et on les soustrait :
    <div class="formula" data-nom="Réaction d'oxydoréduction">$$n_2\,\mathrm{Ox}_1 + n_1\,\mathrm{Red}_2 = n_2\,\mathrm{Red}_1 + n_1\,\mathrm{Ox}_2$$</div>
    Aucun électron ne figure dans l'équation de réaction ; le nombre \(n\) d'électrons échangés par l'équation ainsi écrite servira au calcul de sa constante d'équilibre (§4).
  </div>
  <h3>Équilibrer une demi-équation</h3>
  <div class="method-box"><strong>Méthode — équilibrer une demi-équation en milieu acide</strong>
    <ol>
      <li>Écrire l'oxydant et le réducteur ; équilibrer l'élément qui change de nombre d'oxydation.</li>
      <li>Équilibrer l'oxygène avec des molécules d'eau H₂O.</li>
      <li>Équilibrer l'hydrogène avec des ions H⁺ (on écrit indifféremment H⁺ ou H₃O⁺, en ajoutant alors autant de H₂O de l'autre côté).</li>
      <li>Équilibrer les charges avec des électrons, du côté de l'oxydant ; vérifier avec les nombres d'oxydation (§2).</li>
    </ol>
    <p><em>Exemple</em> : couple Cr₂O₇²⁻/Cr³⁺. Chrome : Cr₂O₇²⁻ → 2 Cr³⁺ ; oxygène : + 7 H₂O à droite ; hydrogène : + 14 H⁺ à gauche ; charges : à gauche \(-2 + 14 = +12\), à droite \(+6\), donc 6 électrons à gauche :</p>
    <div class="formula">$$\mathrm{Cr_2O_7^{2-}} + 14\,\mathrm{H^+} + 6\,e^- = 2\,\mathrm{Cr^{3+}} + 7\,\mathrm{H_2O}$$</div>
  </div>
  <p><strong>En milieu basique</strong>, les ions H⁺ sont ultra-minoritaires : on équilibre d'abord avec H⁺, puis on ajoute autant d'ions HO⁻ des deux côtés et on remplace H⁺ + HO⁻ par H₂O. Pour MnO₄⁻/MnO₂ : MnO₄⁻ + 4 H⁺ + 3 e⁻ = MnO₂ + 2 H₂O devient, après ajout de 4 HO⁻ de chaque côté et simplification de l'eau, MnO₄⁻ + 2 H₂O + 3 e⁻ = MnO₂ + 4 HO⁻ (charges : −4 de chaque côté).</p>
  <div class="method-box"><strong>Exemple — du zinc dans une solution de sulfate de cuivre</strong>
    <p>On verse 0,327 g de zinc en poudre (\(M = 65{,}38\ \text{g·mol}^{-1}\)) dans une solution contenant un excès d'ions Cu²⁺. Le zinc se recouvre d'un dépôt rouge de cuivre et la solution se décolore partiellement. Écrire l'équation, puis calculer la quantité d'électrons transférés et la masse de cuivre déposée (\(M_{\mathrm{Cu}} = 63{,}55\ \text{g·mol}^{-1}\)).</p>
    <ol>
      <li>Couples Cu²⁺/Cu (Cu²⁺ + 2 e⁻ = Cu) et Zn²⁺/Zn (Zn²⁺ + 2 e⁻ = Zn) ; le cuivre se dépose, donc Cu²⁺ est réduit et Zn oxydé : Cu²⁺ + Zn = Cu + Zn²⁺, avec \(n = 2\) électrons échangés.</li>
      <li>\(n(\mathrm{Zn}) = 0{,}327/65{,}38 = 5{,}00\ \text{mmol}\) ; le zinc est limitant et cède \(2\times5{,}00 = 10{,}0\ \text{mmol}\) d'électrons.</li>
      <li>Il se dépose \(5{,}00\ \text{mmol}\) de cuivre, soit \(5{,}00\times10^{-3}\times63{,}55 = 0{,}318\ \text{g}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : laisser des électrons dans l'équation de réaction, ou ajouter les deux demi-équations sans égaliser les électrons. Autre piège : écrire des ions H⁺ dans une équation en milieu basique, ou confondre « oxydant » (ce qui oxyde, donc se réduit) et « oxydé » (ce qui a perdu des électrons).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · NOMBRE D'OXYDATION</div>
  <h2>Une comptabilité des électrons et le tableau périodique</h2>
  <div class="intro">Dans une molécule, les électrons sont partagés : on ne voit pas directement qui en a gagné ou perdu. Le nombre d'oxydation (n.o.) est une comptabilité commode qui repère l'état d'oxydation d'un élément, permet d'identifier l'oxydant d'un couple et de contrôler une demi-équation. Le tableau périodique en donne les valeurs extrêmes.</div>
  <div class="def-box">
    <strong>Nombre d'oxydation.</strong> C'est la charge fictive que porterait un atome si chaque doublet de liaison était attribué en entier à l'atome le plus électronégatif des deux (et partagé à égalité entre deux atomes identiques). On l'écrit en chiffres romains : Fe(+III), S(+VI). Règles pratiques :
    <ul>
      <li>un corps simple (Fe, O₂, Cl₂, S₈) : n.o. nul ; un ion monoatomique : sa charge ;</li>
      <li>l'oxygène vaut −II (sauf dans les peroxydes, −I, et dans OF₂) ; l'hydrogène vaut +I (sauf dans les hydrures métalliques comme NaH, −I) ;</li>
      <li>la somme des n.o. des atomes d'un édifice est égale à sa charge.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>N.o. et échange d'électrons.</strong> Au cours d'une oxydation, le n.o. de l'élément concerné augmente ; au cours d'une réduction, il diminue. Dans un couple, l'oxydant est l'espèce où l'élément a le n.o. le plus élevé, et le nombre d'électrons de la demi-équation est égal à la variation totale du n.o. (multipliée par le nombre d'atomes concernés).
  </div>
  <div class="method-box"><strong>Exemple — n.o. du soufre et couple tétrathionate/thiosulfate</strong>
    <p>Calculer le n.o. du soufre dans SO₄²⁻, S₂O₃²⁻ et S₄O₆²⁻ ; identifier l'oxydant du couple S₄O₆²⁻/S₂O₃²⁻ et vérifier la demi-équation S₄O₆²⁻ + 2 e⁻ = 2 S₂O₃²⁻.</p>
    <ol>
      <li>SO₄²⁻ : \(x + 4\times(-2) = -2\), donc \(x = +6\) : S(+VI). S₂O₃²⁻ : \(2x - 6 = -2\), \(x = +2\) : S(+II) en moyenne.</li>
      <li>S₄O₆²⁻ : \(4x - 12 = -2\), \(x = +2{,}5\). Un n.o. fractionnaire est une <em>moyenne</em> : les quatre atomes de soufre ne sont pas dans le même environnement.</li>
      <li>Le soufre a le n.o. le plus élevé dans S₄O₆²⁻ : c'est l'oxydant. Quatre atomes passent de +2,5 à +2 : variation totale \(4\times0{,}5 = 2\), donc 2 électrons, en accord avec la demi-équation.</li>
    </ol>
  </div>
  <h3>Nombres d'oxydation extrêmes et position dans le tableau périodique</h3>
  <p>Un élément des blocs s et p ne peut pas perdre plus que ses électrons de valence, ni en gagner plus qu'il n'en faut pour atteindre la configuration du gaz noble suivant (règle de l'octet, voir <a href="#atome/cours">« Architecture de la matière »</a>).</p>
  <div class="prop-box">
    <strong>N.o. extrêmes.</strong> Pour un élément possédant \(v\) électrons de valence : n.o. maximal \(+v\) (tous les électrons de valence « perdus ») ; pour un non-métal, n.o. minimal \(-(8 - v)\) (octet complété). Pour un métal, le n.o. minimal est 0 (corps simple). Les métaux de transition atteignent un n.o. maximal égal au nombre de leurs électrons \(n\text{s}\) et \((n-1)\text{d}\) jusqu'à la colonne 7 : Mn (3d⁵ 4s², colonne 7) monte jusqu'à +VII dans MnO₄⁻, Cr (colonne 6) jusqu'à +VI dans Cr₂O₇²⁻.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">Élément (colonne)</th><th>Valence</th><th>n.o. min.</th><th>n.o. max.</th><th style="text-align:left">Exemples</th></tr>
    <tr><td>Na (1)</td><td>3s¹</td><td>0</td><td>+I</td><td style="text-align:left">Na, Na⁺</td></tr>
    <tr><td>N (15)</td><td>2s² 2p³</td><td>−III</td><td>+V</td><td style="text-align:left">NH₃, NO, NO₃⁻</td></tr>
    <tr><td>S (16)</td><td>3s² 3p⁴</td><td>−II</td><td>+VI</td><td style="text-align:left">H₂S, S₂O₃²⁻, SO₄²⁻</td></tr>
    <tr><td>Cl (17)</td><td>3s² 3p⁵</td><td>−I</td><td>+VII</td><td style="text-align:left">Cl⁻, Cl₂, ClO⁻, ClO₄⁻</td></tr>
    <tr><td>Mn (7)</td><td>3d⁵ 4s²</td><td>0</td><td>+VII</td><td style="text-align:left">Mn, Mn²⁺, MnO₂, MnO₄⁻</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Caractère du corps simple.</strong> Les <strong>métaux</strong>, à gauche du tableau, peu électronégatifs, perdent facilement leurs électrons de valence : leurs corps simples sont <strong>réducteurs</strong>, d'autant plus qu'ils sont à gauche (les alcalins Na, K réduisent l'eau violemment). Les <strong>non-métaux</strong> de droite, très électronégatifs, captent des électrons : dioxygène et dihalogènes sont <strong>oxydants</strong>. Dans la colonne des halogènes, le pouvoir oxydant décroît en descendant : F₂ (\(E^\circ = 2{,}87\ \text{V}\)) > Cl₂ (1,36 V) > Br₂ (1,07 V) > I₂ (0,54 V).
  </div>
  <h3>Oxydants et réducteurs usuels</h3>
  <p>Le programme demande le nom, la nature et la formule de quatre espèces très utilisées au laboratoire et dans la vie courante :</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">Espèce</th><th>Formule</th><th>n.o.</th><th style="text-align:left">Nature et usage</th></tr>
    <tr><td style="text-align:left">ion permanganate</td><td>MnO₄⁻</td><td>Mn(+VII)</td><td style="text-align:left">oxydant fort, violet (MnO₄⁻/Mn²⁺, 1,51 V en milieu acide) ; titrages, désinfection</td></tr>
    <tr><td style="text-align:left">ion hypochlorite</td><td>ClO⁻</td><td>Cl(+I)</td><td style="text-align:left">oxydant, principe actif de l'eau de Javel (couple ClO⁻/Cl⁻ ; acide conjugué HClO)</td></tr>
    <tr><td style="text-align:left">peroxyde d'hydrogène</td><td>H₂O₂</td><td>O(−I)</td><td style="text-align:left">eau oxygénée ; oxydant (H₂O₂/H₂O, 1,77 V) <em>et</em> réducteur (O₂/H₂O₂, 0,68 V)</td></tr>
    <tr><td style="text-align:left">ion thiosulfate</td><td>S₂O₃²⁻</td><td>S(+II)</td><td style="text-align:left">réducteur (S₄O₆²⁻/S₂O₃²⁻, 0,08 V) ; sert à doser le diiode (§10)</td></tr>
  </table></div>
  <div class="method-box"><strong>Exemple — l'eau oxygénée, oxydant et réducteur</strong>
    <p>Écrire les deux demi-équations faisant intervenir H₂O₂ en milieu acide et préciser son rôle dans chacune.</p>
    <ol>
      <li>Couple H₂O₂/H₂O : l'oxygène passe de −I à −II. H₂O₂ → 2 H₂O ; hydrogène : + 2 H⁺ à gauche ; charges : + 2 e⁻ : H₂O₂ + 2 H⁺ + 2 e⁻ = 2 H₂O. H₂O₂ est l'<strong>oxydant</strong>.</li>
      <li>Couple O₂/H₂O₂ : l'oxygène passe de 0 à −I. O₂ + 2 H⁺ + 2 e⁻ = H₂O₂ : ici H₂O₂ est le <strong>réducteur</strong>. Une espèce qui est l'oxydant d'un couple et le réducteur d'un autre peut se dismuter (§9).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre le n.o. pour une charge réelle (le manganèse de MnO₄⁻ ne porte pas une charge +7), ou oublier qu'un n.o. calculé pour plusieurs atomes identiques est une moyenne. Autre piège : écrire « l'oxygène vaut toujours −II » dans H₂O₂.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · POTENTIEL D'ÉLECTRODE ET FORMULE DE NERNST</div>
  <h2>Chiffrer le pouvoir oxydant d'un couple</h2>
  <div class="intro">Pour savoir qui oxyde qui, il faut un nombre attaché à chaque couple. Ce nombre est un potentiel électrique, mesurable au voltmètre : le potentiel d'électrode. Sa valeur dépend du couple (potentiel standard) et de la composition de la solution (formule de Nernst).</div>
  <div class="def-box">
    <strong>Électrode, potentiel d'électrode.</strong> Une <strong>électrode</strong> (ou demi-pile) est un conducteur électronique (métal, graphite) au contact d'une solution qui contient les deux membres d'un couple : lame de cuivre dans une solution de Cu²⁺, fil de platine dans une solution de Fe³⁺ et Fe²⁺. Son <strong>potentiel</strong> \(E\) est la tension, mesurée à courant nul, entre cette électrode et l'<strong>électrode standard à hydrogène</strong> (ESH, couple H⁺/H₂), dont le potentiel est nul par convention à toute température.
  </div>
  <div class="def-box">
    <strong>Potentiel standard.</strong> Le potentiel standard \(E^\circ\) d'un couple est son potentiel quand toutes les espèces du couple sont dans leur état standard : activités égales à 1 (solutés à \(c^\circ = 1\ \text{mol·L}^{-1}\), gaz sous \(P^\circ = 1\ \text{bar}\)). Il dépend de la température ; les tables le donnent à 298 K.
  </div>
  <div class="prop-box">
    <strong>Formule de Nernst</strong> (admise en PTSI). Pour un couple de demi-équation \(\alpha\,\mathrm{Ox} + p\,\mathrm{H^+} + n\,e^- = \beta\,\mathrm{Red} + q\,\mathrm{H_2O}\), le potentiel d'une électrode à l'équilibre vaut
    <div class="formula" data-nom="Formule de Nernst">$$E = E^\circ + \frac{RT}{nF}\ln\frac{a_{\mathrm{Ox}}^{\,\alpha}\,a_{\mathrm{H^+}}^{\,p}}{a_{\mathrm{Red}}^{\,\beta}} \;\approx\; E^\circ + \frac{0{,}06}{n}\log\frac{a_{\mathrm{Ox}}^{\,\alpha}\,a_{\mathrm{H^+}}^{\,p}}{a_{\mathrm{Red}}^{\,\beta}}\quad\text{à 298 K}$$</div>
    avec \(\dfrac{RT}{F}\ln 10 = 0{,}0592\ \text{V} \approx 0{,}06\ \text{V}\) à 298 K (\(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\), \(F = 96\,485\ \text{C·mol}^{-1}\), charge d'une mole d'électrons). Toutes les espèces de la demi-équation figurent, avec leur coefficient en exposant, du côté où elles apparaissent : celles du côté de l'oxydant au numérateur.
  </div>
  <p>Activités, comme dans <a href="#equilchim/cours">« Équilibres chimiques »</a> : \(a = [\mathrm{X}]/c^\circ\) pour un soluté dilué, \(a = P_{\mathrm{X}}/P^\circ\) pour un gaz, \(a = 1\) pour un solide pur ou pour le solvant. Comme \(\log a_{\mathrm{H^+}}^{\,p} = -p\,\text{pH}\), un couple qui échange des H⁺ a un potentiel qui <strong>diminue</strong> de \(0{,}06\,p/n\) volt par unité de pH.</p>
  <div class="method-box"><strong>Exemple — quatre potentiels de Nernst</strong>
    <p>Données à 298 K : \(E^\circ(\mathrm{Cu^{2+}/Cu}) = 0{,}34\ \text{V}\), \(E^\circ(\mathrm{Fe^{3+}/Fe^{2+}}) = 0{,}77\ \text{V}\), \(E^\circ(\mathrm{MnO_4^-/Mn^{2+}}) = 1{,}51\ \text{V}\), \(E^\circ(\mathrm{O_2/H_2O}) = 1{,}23\ \text{V}\).</p>
    <ol>
      <li>Lame de cuivre dans Cu²⁺ à \(1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) : Cu²⁺ + 2 e⁻ = Cu, le cuivre solide a une activité 1 : \(E = 0{,}34 + 0{,}03\log(1{,}0\times10^{-2}) = 0{,}28\ \text{V}\).</li>
      <li>Platine dans [Fe³⁺] = 0,010 et [Fe²⁺] = 0,10 mol·L⁻¹ : \(E = 0{,}77 + 0{,}06\log(0{,}010/0{,}10) = 0{,}71\ \text{V}\).</li>
      <li>MnO₄⁻ + 8 H⁺ + 5 e⁻ = Mn²⁺ + 4 H₂O, avec [MnO₄⁻] = [Mn²⁺] : \(E = 1{,}51 - \dfrac{0{,}06\times8}{5}\,\text{pH} = 1{,}51 - 0{,}096\,\text{pH}\), soit 1,51 V à pH 0 et 1,22 V à pH 3.</li>
      <li>O₂ + 4 H⁺ + 4 e⁻ = 2 H₂O, dioxygène de l'air (\(P = 0{,}21\ \text{bar}\)) à pH 7 : \(E = 1{,}23 + \dfrac{0{,}06}{4}\log 0{,}21 - 0{,}06\times7 = 1{,}23 - 0{,}010 - 0{,}42 = 0{,}80\ \text{V}\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Lecture qualitative.</strong> Augmenter l'activité de l'oxydant (ou celle des H⁺, s'ils sont du côté de l'oxydant) augmente \(E\) ; augmenter celle du réducteur le diminue. Multiplier le rapport des activités par 10 change \(E\) de \(0{,}06/n\) volt seulement : le potentiel reste en général à quelques dixièmes de volt de \(E^\circ\), alors que les \(E^\circ\) usuels s'étalent de −3 V (Li⁺/Li) à +2,9 V (F₂/F⁻).
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier les coefficients (pour Cr₂O₇²⁻/Cr³⁺, le terme est \([\mathrm{Cr^{3+}}]^2\) au dénominateur), oublier de diviser 0,06 par \(n\), faire figurer un solide ou l'eau dans le logarithme, ou oublier le signe moins devant le terme en pH. Autre piège : croire que l'état standard impose 298 K ; il impose les activités, pas la température.</div>
</div>

<figcaption>Échelle des potentiels standard à 25 °C (V, par rapport à l'ESH). Chaque couple est placé à son E° ; l'oxydant est écrit à gauche, son réducteur conjugué à droite. Plus un couple est haut, plus son oxydant est fort ; plus il est bas, plus son réducteur est fort. Une réaction de constante K° &gt; 1 associe un oxydant à un réducteur placé plus bas (règle du γ) : c'est le cas de Cu²⁺ et Zn, encadrés en vert. Hors de l'échelle : F₂/F⁻ (+2,87 V), Al³⁺/Al (−1,66 V), Mg²⁺/Mg (−2,37 V), Na⁺/Na (−2,71 V), Li⁺/Li (−3,04 V).</figcaption>

  <div class="prop-box">
    <strong>Règle du γ.</strong> On place les couples sur une échelle verticale des potentiels standard, oxydants à gauche, réducteurs à droite. La réaction thermodynamiquement favorisée (\(K^\circ \gt 1\)) entre deux couples a lieu entre l'<strong>oxydant le plus fort</strong> (couple du haut) et le <strong>réducteur le plus fort</strong> (couple du bas) : en reliant Ox₁ (en haut à gauche) à Red₁, puis Red₂ (en bas à droite) à Ox₂, on dessine un γ.
  </div>
  <div class="prop-box">
    <strong>Constante d'équilibre.</strong> Pour la réaction entre Ox₁ et Red₂, écrite de façon à échanger \(n\) électrons,
    <div class="formula" data-nom="Constante d'une réaction d'oxydoréduction">$$\log K^\circ = \frac{n\,\left(E_1^\circ - E_2^\circ\right)}{0{,}06}\qquad\text{à 298 K}$$</div>
    où \(E_1^\circ\) est le potentiel standard du couple de l'oxydant qui réagit et \(E_2^\circ\) celui du couple du réducteur qui réagit. La réaction est favorisée (\(K^\circ \gt 1\)) si et seulement si \(E_1^\circ \gt E_2^\circ\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Retrouver la relation à partir de la formule de Nernst</span>
    <div class="content">
      <p>À l'équilibre, la solution n'a qu'un seul potentiel : les deux couples ont le même potentiel de Nernst (une pile formée de ces deux couples a une tension nulle, elle est « usée », §5). Avec la réaction \(n_2\,\mathrm{Ox}_1 + n_1\,\mathrm{Red}_2 = n_2\,\mathrm{Red}_1 + n_1\,\mathrm{Ox}_2\), qui échange \(n = n_1 n_2\) électrons, on écrit chaque formule de Nernst avec \(n\) électrons (demi-équations multipliées par \(n_2\) et \(n_1\)) :</p>
      <div class="formula">$$E_1^\circ + \frac{0{,}06}{n}\log\frac{a_{\mathrm{Ox_1}}^{\,n_2}}{a_{\mathrm{Red_1}}^{\,n_2}} = E_2^\circ + \frac{0{,}06}{n}\log\frac{a_{\mathrm{Ox_2}}^{\,n_1}}{a_{\mathrm{Red_2}}^{\,n_1}}$$</div>
      <p>En regroupant les logarithmes, on fait apparaître le quotient de réaction à l'équilibre, \(Q_{r,\text{éq}} = \dfrac{a_{\mathrm{Red_1}}^{\,n_2}\,a_{\mathrm{Ox_2}}^{\,n_1}}{a_{\mathrm{Ox_1}}^{\,n_2}\,a_{\mathrm{Red_2}}^{\,n_1}} = K^\circ\), et \(\dfrac{0{,}06}{n}\log K^\circ = E_1^\circ - E_2^\circ\). Si \(n_1\) et \(n_2\) ont un facteur commun, on divise les coefficients par ce facteur : \(n\) est alors leur PPCM, et la relation reste vraie avec le \(n\) de l'équation écrite.</p>
    </div>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">\(\Delta E^\circ = E_1^\circ - E_2^\circ\)</th><td>0,06 V</td><td>0,12 V</td><td>0,18 V</td><td>0,30 V</td><td>0,60 V</td></tr>
    <tr><th style="text-align:left">\(K^\circ\) pour \(n = 1\)</th><td>10</td><td>10²</td><td>10³</td><td>10⁵</td><td>10¹⁰</td></tr>
    <tr><th style="text-align:left">\(K^\circ\) pour \(n = 2\)</th><td>10²</td><td>10⁴</td><td>10⁶</td><td>10¹⁰</td><td>10²⁰</td></tr>
  </table></div>
  <div class="method-box"><strong>Exemple — trois réactions classiques</strong>
    <p>Données : \(E^\circ\) (V) Cu²⁺/Cu 0,34 ; Zn²⁺/Zn −0,76 ; Fe³⁺/Fe²⁺ 0,77 ; I₂/I⁻ 0,54 ; MnO₄⁻/Mn²⁺ 1,51.</p>
    <ol>
      <li>Cu²⁺ + Zn = Cu + Zn²⁺ (\(n = 2\)) : \(\log K^\circ = 2\times(0{,}34 + 0{,}76)/0{,}06 = 36{,}7\), \(K^\circ \approx 5\times10^{36}\) : réaction quasi totale, celle de la pile Daniell (§5).</li>
      <li>2 Fe³⁺ + 2 I⁻ = 2 Fe²⁺ + I₂ (\(n = 2\)) : \(\log K^\circ = 2\times0{,}23/0{,}06 = 7{,}7\). Écrite avec un seul Fe³⁺ (Fe³⁺ + I⁻ = Fe²⁺ + ½ I₂, \(n = 1\)), sa constante vaut \(10^{3{,}8}\), la racine carrée de la précédente.</li>
      <li>MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ = Mn²⁺ + 5 Fe³⁺ + 4 H₂O (\(n = 5\)) : \(\log K^\circ = 5\times0{,}74/0{,}06 = 61{,}7\). Les H⁺ figurent dans \(K^\circ\) : la réaction est d'autant plus favorisée que le milieu est acide (§11).</li>
    </ol>
  </div>
  <p>Comme pour toute réaction (<a href="#equilchim/cours">« Équilibres chimiques »</a>, §9), une grande constante annonce une réaction quasi totale ; en pratique, un écart \(\Delta E^\circ\) de 0,3 V environ suffit pour \(n = 1\) (\(K^\circ \approx 10^5\)), deux fois moins pour \(n = 2\). Si \(\Delta E^\circ\) ne vaut que quelques centièmes de volt, l'équilibre est atteint avec des quantités comparables de réactifs et de produits, et le sens d'évolution dépend des concentrations : il faut alors comparer les potentiels de Nernst \(E\), pas les \(E^\circ\) (§5, §8).</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la règle du γ « à l'envers » (oxydant du bas sur réducteur du haut), ou oublier \(n\) dans \(\log K^\circ\). Autre piège : conclure qu'une réaction favorisée est rapide. La thermodynamique ne dit rien de la vitesse : l'eau oxygénée se dismute avec \(K^\circ = 10^{36}\) et se conserve pourtant des mois en flacon (§9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PILES ET TENSION À VIDE</div>

  <div class="def-box">
    <strong>Pile.</strong> Une pile est formée de deux <strong>demi-piles</strong> (deux électrodes de couples différents, ou du même couple à des concentrations différentes) reliées par une <strong>jonction électrolytique</strong> : pont salin (solution gélifiée d'ions spectateurs, KNO₃ ou KCl) ou paroi poreuse, qui laisse passer les ions sans mélanger les solutions. L'électrode siège d'une <strong>oxydation</strong> est l'<strong>anode</strong> ; celle qui est le siège d'une <strong>réduction</strong> est la <strong>cathode</strong>. Notation conventionnelle, pôle ⊖ à gauche : ⊖ Zn(s) | Zn²⁺, SO₄²⁻ ‖ Cu²⁺, SO₄²⁻ | Cu(s) ⊕.
  </div>
  <div class="prop-box">
    <strong>Tension à vide.</strong> La <strong>tension à vide</strong> (ou force électromotrice) d'une pile est la tension mesurée entre ses bornes à courant nul, avec un voltmètre de grande résistance :
    <div class="formula" data-nom="Tension à vide d'une pile">$$e = E_+ - E_- \gt 0$$</div>
    Le <strong>pôle positif</strong> est l'électrode de plus haut potentiel. Quand la pile débite, les électrons vont, dans le circuit extérieur, du pôle ⊖ au pôle ⊕ (le courant en sens inverse) : au pôle ⊖, le réducteur s'oxyde (<strong>anode</strong>) ; au pôle ⊕, l'oxydant se réduit (<strong>cathode</strong>). Dans la jonction, le courant est porté par les ions : les cations migrent vers la cathode, les anions vers l'anode, et chaque solution reste électriquement neutre.
  </div>
  <div class="method-box"><strong>Exemple — décrire une pile à partir des potentiels d'électrode</strong>
    <p>Demi-pile A : fil d'argent dans Ag⁺ à \(1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) ; demi-pile B : lame de cuivre dans Cu²⁺ à 0,10 mol·L⁻¹ ; \(E^\circ(\mathrm{Ag^+/Ag}) = 0{,}80\ \text{V}\), \(E^\circ(\mathrm{Cu^{2+}/Cu}) = 0{,}34\ \text{V}\). Polarité, tension à vide, réactions aux électrodes, sens des porteurs de charge.</p>
    <ol>
      <li>\(E_A = 0{,}80 + 0{,}06\log(1{,}0\times10^{-2}) = 0{,}68\ \text{V}\) ; \(E_B = 0{,}34 + 0{,}03\log 0{,}10 = 0{,}31\ \text{V}\).</li>
      <li>\(E_A \gt E_B\) : l'électrode d'argent est le pôle ⊕, celle de cuivre le pôle ⊖ ; \(e = 0{,}68 - 0{,}31 = 0{,}37\ \text{V}\).</li>
      <li>Cathode (argent) : Ag⁺ + e⁻ → Ag ; anode (cuivre) : Cu → Cu²⁺ + 2 e⁻ ; fonctionnement : 2 Ag⁺ + Cu → 2 Ag + Cu²⁺.</li>
      <li>Électrons de la lame de cuivre vers le fil d'argent dans le circuit extérieur ; dans le pont salin, les cations vont vers la demi-pile d'argent (qui perd des Ag⁺), les anions vers celle du cuivre (qui gagne des Cu²⁺).</li>
    </ol>
  </div>
  <p><strong>À partir d'une mesure.</strong> Un voltmètre affiche \(U = V_{\text{V}} - V_{\text{COM}}\). Si la lecture est positive, l'électrode reliée à la borne V est le pôle ⊕ et \(e = U\) ; si elle est négative, c'est l'électrode reliée à COM, et \(e = -U\). On en déduit les réactions aux électrodes sans aucune donnée de potentiel standard.</p>
  <h3>Évolution pendant le fonctionnement</h3>
  <p>Quand la pile débite, l'oxydant du pôle ⊕ et le réducteur du pôle ⊖ sont consommés : \(E_+\) baisse, \(E_-\) monte, et \(e\) diminue. La pile est <strong>usée</strong> quand \(e = 0\) : les deux couples ont le même potentiel, la réaction de fonctionnement a atteint son équilibre (\(Q_r = K^\circ\)). Pour une pile Daniell (100 mL de Zn²⁺ et 100 mL de Cu²⁺ à 1,0 mol·L⁻¹ au départ), \(e = 1{,}10 - 0{,}03\log\dfrac{[\mathrm{Zn^{2+}}]}{[\mathrm{Cu^{2+}}]}\) vaut 1,10 V au départ, 1,09 V à mi-décharge, 1,06 V à 90 %, 1,03 V à 99 % et encore 0,97 V à 99,99 % : la tension reste presque constante tant qu'il reste du réactif, parce que \(K^\circ\) est immense.</p>
  <div class="method-box"><strong>Exemple — pile Daniell hors des conditions standard ; pile de concentration</strong>
    <ol>
      <li>Daniell avec [Cu²⁺] = 0,10 et [Zn²⁺] = 1,0 mol·L⁻¹ : \(E_+ = 0{,}34 + 0{,}03\log 0{,}10 = 0{,}31\ \text{V}\), \(E_- = -0{,}76\ \text{V}\), \(e = 1{,}07\ \text{V}\).</li>
      <li>Deux lames de cuivre, l'une dans Cu²⁺ à 1,0 mol·L⁻¹, l'autre dans Cu²⁺ à 0,010 mol·L⁻¹ : \(e = 0{,}03\log(1{,}0/0{,}010) = 0{,}06\ \text{V}\). Le pôle ⊕ est dans la solution concentrée, où Cu²⁺ se réduit ; la pile s'arrête quand les deux concentrations sont égales.</li>
    </ol>
  </div>
  <p><strong>Ordres de grandeur</strong> : pile Daniell 1,1 V ; pile alcaline 1,5 V ; accumulateur au plomb 2,1 V ; élément lithium-ion 3,7 V (électrolyte organique : en solution aqueuse, la décomposition de l'eau limite les tensions vers 2 V). L'électrolyse, transformation forcée par un générateur, et l'énergie que peut fournir une pile sont vues en 2ᵉ année (fin du chapitre).</p>
  <div class="notice"><strong>Erreur classique</strong> : associer l'anode au pôle ⊕ (dans une pile, l'anode est le pôle ⊖), croire que le pont salin transporte des électrons, ou calculer \(e\) avec les \(E^\circ\) alors que les concentrations ne sont pas standard. Autre piège : mesurer la tension avec un courant non négligeable ; la tension aux bornes est alors inférieure à \(e\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · ÉLECTRODES DE RÉFÉRENCE</div>
  <h2>Mesurer un potentiel en pratique</h2>
  <div class="intro">L'électrode standard à hydrogène est une référence de définition : elle demande une solution d'activité unité en H⁺ au comportement idéal et du dihydrogène sous 1 bar, ce qu'on ne réalise pas au laboratoire. On mesure donc les potentiels par rapport à des électrodes de référence commodes, de potentiel connu et stable.</div>

</figure>
  <div class="def-box">
    <strong>Électrode de référence.</strong> Électrode dont le potentiel est connu et ne dépend pas de la solution étudiée. Les deux plus courantes contiennent une solution interne de chlorure de potassium saturée, qui fixe leur potentiel : l'<strong>électrode au calomel saturée</strong> (ECS, Hg | Hg₂Cl₂(s) | KCl saturé), \(E_{\text{ECS}} = 0{,}244\ \text{V}\) à 25 °C, et l'<strong>électrode argent/chlorure d'argent</strong> (Ag | AgCl(s) | KCl saturé), \(E = 0{,}197\ \text{V}\) ; cette dernière remplace aujourd'hui l'ECS, qui contient du mercure.
  </div>
  <p>Vocabulaire des électrodes de mesure : un métal plongeant dans une solution de ses ions (Cu | Cu²⁺) mesure l'activité de ces ions ; un métal recouvert d'un de ses sels peu solubles, plongeant dans une solution de l'anion (Ag | AgCl | Cl⁻), a un potentiel fixé par la concentration de l'anion (§11) — c'est le principe des électrodes de référence ; un conducteur inerte (platine, graphite) dans une solution contenant l'oxydant et le réducteur d'un couple (Fe³⁺/Fe²⁺, MnO₄⁻/Mn²⁺) prend le potentiel de ce couple : c'est l'électrode des titrages potentiométriques (§10).</p>
  <div class="prop-box">
    <strong>Mesure d'un potentiel.</strong> On relie l'électrode étudiée à la borne V d'un voltmètre de grande résistance (le courant reste négligeable, l'électrode est à l'équilibre) et l'électrode de référence à la borne COM ; la lecture \(U = E - E_{\text{réf}}\) donne
    <div class="formula" data-nom="Potentiel mesuré">$$E = U + E_{\text{réf}}$$</div>
  </div>
  <div class="method-box"><strong>Exemple — doser des ions cuivre(II) par une mesure de potentiel</strong>
    <p>Une lame de cuivre plonge dans une solution de Cu²⁺ ; on lit \(U = 0{,}036\ \text{V}\) par rapport à l'ECS. Concentration en Cu²⁺ ? Qu'aurait-on lu avec une électrode Ag/AgCl ?</p>
    <ol>
      <li>\(E = 0{,}036 + 0{,}244 = 0{,}280\ \text{V}\) par rapport à l'ESH.</li>
      <li>\(0{,}280 = 0{,}34 + 0{,}03\log[\mathrm{Cu^{2+}}]\), d'où \([\mathrm{Cu^{2+}}] = 10^{-0{,}060/0{,}03} = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\).</li>
      <li>Avec Ag/AgCl : \(U' = 0{,}280 - 0{,}197 = 0{,}083\ \text{V}\). Changer de référence décale toutes les lectures de la même quantité.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre la tension lue pour le potentiel (oublier \(E_{\text{réf}}\)), ou ajouter \(E_{\text{réf}}\) avec le mauvais signe quand l'électrode de référence est reliée à la borne V. Une sensibilité de 0,03 V par décade (\(n = 2\)) montre aussi que la mesure d'une concentration par potentiométrie est peu précise : une erreur de 3 mV sur \(U\) donne 26 % d'erreur sur [Cu²⁺].</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DIAGRAMMES DE PRÉDOMINANCE ET D'EXISTENCE</div>
  <h2>Lire d'un coup d'œil les espèces stables à un potentiel donné</h2>

  <div class="def-box">
    <strong>Conventions de tracé.</strong> Pour un couple Ox/Red, l'oxydant est majoritaire au-dessus de la frontière, le réducteur au-dessous. Les conventions doivent toujours être précisées ; les plus courantes :
    <ul>
      <li>entre deux espèces dissoutes : frontière à <strong>égalité des concentrations</strong> (en élément). Pour Ox + n e⁻ = Red, elle est en \(E = E^\circ\) : c'est une frontière de <strong>prédominance</strong> ;</li>
      <li>entre une espèce dissoute et un solide (métal) : le solide <strong>existe</strong> ou n'existe pas ; la frontière est le potentiel où il apparaît quand l'espèce dissoute est à la <strong>concentration de tracé</strong> \(c_{\text{tr}}\) : pour Mⁿ⁺/M, \(E = E^\circ + \dfrac{0{,}06}{n}\log c_{\text{tr}}\) (domaine d'<strong>existence</strong>, comme dans <a href="#precipitation/cours">« Réactions de dissolution et de précipitation »</a>, §5) ;</li>
      <li>un gaz est pris sous une pression de tracé, en général \(P^\circ = 1\ \text{bar}\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Espèces incompatibles.</strong> Deux espèces dont les domaines sont <strong>disjoints</strong> ne peuvent pas coexister à l'équilibre : elles réagissent (réaction de grande constante si l'écart entre les domaines est grand). Deux espèces dont les domaines ont une partie commune sont <strong>compatibles</strong> : elles coexistent sans réaction notable.
  </div>
  <div class="method-box"><strong>Exemple — prévoir quatre mélanges à l'aide de la figure</strong>
    <p>Que se passe-t-il quand on met en présence (a) Fe³⁺ et Cu ; (b) Fe²⁺ et Cu ; (c) Cu²⁺ et Fe ; (d) Fe³⁺ et Sn²⁺ ? Données : \(E^\circ\) (V) Fe³⁺/Fe²⁺ 0,77 ; Cu²⁺/Cu 0,34 ; Fe²⁺/Fe −0,44 ; Sn⁴⁺/Sn²⁺ 0,15.</p>
    <ol>
      <li>(a) Domaine de Fe³⁺ (au-dessus de 0,77 V) et domaine de Cu (au-dessous de 0,28 V) disjoints : 2 Fe³⁺ + Cu = 2 Fe²⁺ + Cu²⁺, \(\log K^\circ = 2\times0{,}43/0{,}06 = 14{,}3\). C'est la gravure des circuits imprimés au chlorure de fer(III).</li>
      <li>(b) Le domaine de Fe²⁺ (de −0,50 à 0,77 V) recouvre en partie celui de Cu : pas de réaction notable.</li>
      <li>(c) Cu²⁺ (au-dessus de 0,28 V) et Fe (au-dessous de −0,50 V) : Cu²⁺ + Fe = Cu + Fe²⁺, \(\log K^\circ = 2\times0{,}78/0{,}06 = 26\) : un clou de fer se cuivre dans une solution de sulfate de cuivre.</li>
      <li>(d) Fe³⁺ et Sn²⁺ (entre −0,20 et 0,15 V) : 2 Fe³⁺ + Sn²⁺ = 2 Fe²⁺ + Sn⁴⁺, \(\log K^\circ = 2\times0{,}62/0{,}06 = 20{,}7\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier que la position d'une frontière ion/métal dépend de la convention (à \(c_{\text{tr}} = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\), la frontière Cu²⁺/Cu est à 0,28 V, pas à 0,34 V). Pour deux domaines séparés de quelques centièmes de volt seulement, la conclusion dépend des concentrations réelles : on calcule alors \(K^\circ\) et l'état final (§8).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ÉTAT FINAL D'UNE TRANSFORMATION</div>
  <h2>À l'équilibre, la solution n'a qu'un potentiel</h2>
  <div class="intro">Prévoir le sens d'une réaction ne suffit pas : on veut la composition finale. La méthode est celle de <a href="#equilchim/cours">« Équilibres chimiques »</a> (tableau d'avancement et constante d'équilibre) ; l'oxydoréduction y ajoute un outil commode, l'égalité des potentiels à l'équilibre.</div>
  <div class="prop-box">
    <strong>État d'équilibre.</strong> À l'équilibre, tous les couples présents dans la solution ont le <strong>même potentiel</strong> de Nernst, appelé potentiel de la solution. Pour déterminer l'état final d'une transformation modélisée par une réaction unique :
    <ol>
      <li>écrire la réaction (règle du γ) et calculer \(K^\circ\) (§4) ;</li>
      <li>dresser le tableau d'avancement ; si \(K^\circ\) est très grand, supposer la réaction totale, puis calculer la concentration résiduelle du réactif limitant avec \(K^\circ\) (et vérifier qu'elle est négligeable) ; sinon, résoudre \(Q_r = K^\circ\) ;</li>
      <li>calculer le potentiel final avec la formule de Nernst de l'un ou l'autre couple (même valeur).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple 1 — zinc en excès dans une solution de Cu²⁺</strong>
    <p>Un excès de zinc est ajouté à une solution de Cu²⁺ à 0,10 mol·L⁻¹. Composition et potentiel à l'équilibre ?</p>
    <ol>
      <li>Cu²⁺ + Zn = Cu + Zn²⁺, \(K^\circ = 10^{36{,}7}\) : réaction quasi totale, [Zn²⁺] = 0,10 mol·L⁻¹.</li>
      <li>\([\mathrm{Cu^{2+}}] = \dfrac{[\mathrm{Zn^{2+}}]}{K^\circ} = 0{,}10\times10^{-36{,}7} \approx 2\times10^{-38}\ \text{mol·L}^{-1}\) : valeur formelle (moins d'un ion par litre), qui dit simplement que la réaction est totale.</li>
      <li>\(E = -0{,}76 + 0{,}03\log 0{,}10 = -0{,}79\ \text{V}\) ; la formule de Nernst du couple Cu²⁺/Cu donne la même valeur, \(0{,}34 + 0{,}03\log(2\times10^{-38}) = -0{,}79\ \text{V}\).</li>
    </ol>
  </div>
<figure class="schema">
<svg viewBox="0 0 560 318" role="img" aria-label="Potentiels des couples Fe3+/Fe2+ et Ag+/Ag en fonction de l'avancement volumique, qui se croisent à l'équilibre">
<line x1="152" y1="24" x2="152" y2="274" class="sk-axis" style="opacity:.3"/>

  <div class="method-box"><strong>Exemple 2 — une réaction de constante inférieure à 1 qui avance quand même</strong>
    <p>On agite un excès d'argent avec une solution de Fe³⁺ à 0,10 mol·L⁻¹ (sans Fe²⁺ ni Ag⁺ au départ). \(E^\circ(\mathrm{Fe^{3+}/Fe^{2+}}) = 0{,}77\ \text{V}\), \(E^\circ(\mathrm{Ag^+/Ag}) = 0{,}80\ \text{V}\).</p>
    <ol>
      <li>Ag + Fe³⁺ = Ag⁺ + Fe²⁺, \(n = 1\) : \(\log K^\circ = (0{,}77 - 0{,}80)/0{,}06 = -0{,}5\), \(K^\circ = 0{,}32\). Défavorisée au sens de la règle du γ, mais \(Q_{r,0} = 0 \lt K^\circ\) : elle avance.</li>
      <li>Avec l'avancement volumique \(x\) : \(\dfrac{x^2}{0{,}10 - x} = 0{,}32\), soit \(x^2 + 0{,}32\,x - 0{,}032 = 0\), d'où \(x = 0{,}080\ \text{mol·L}^{-1}\) : 80 % des ions Fe³⁺ sont réduits.</li>
      <li>\(E = 0{,}80 + 0{,}06\log 0{,}080 = 0{,}734\ \text{V} = 0{,}77 + 0{,}06\log(0{,}020/0{,}080)\) : les deux potentiels se croisent (figure).</li>
    </ol>
  </div>
  <p>La résolution numérique d'une équation \(Q_r(x) = K^\circ\) se programme comme dans <a href="#equilchim/cours">« Équilibres chimiques »</a> (§11, capacité numérique) : seule l'expression de \(K^\circ\), tirée des potentiels standard, est propre à l'oxydoréduction.</p>
  <div class="notice"><strong>Erreur classique</strong> : conclure « \(K^\circ \lt 1\), il ne se passe rien ». Le sens d'évolution se lit en comparant \(Q_r\) à \(K^\circ\), ou les potentiels \(E\) (et non \(E^\circ\)) des deux couples dans l'état initial : ici, \(E(\mathrm{Fe^{3+}/Fe^{2+}})\) est infini au départ (aucun Fe²⁺), bien au-dessus de \(E(\mathrm{Ag^+/Ag})\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · DISMUTATION ET MÉDIAMUTATION</div>
  <h2>Quand une espèce réagit sur elle-même</h2>
  <div class="intro">Une espèce de nombre d'oxydation intermédiaire est à la fois l'oxydant d'un couple et le réducteur d'un autre (H₂O₂, Cu⁺, Fe²⁺, Cl₂). Selon la position de ces deux couples, elle se décompose en ses deux voisines, ou au contraire elle se forme à partir d'elles.</div>
  <div class="def-box">
    <strong>Dismutation, médiamutation.</strong> Soit X une espèce de n.o. intermédiaire, oxydant du couple X/Red et réducteur du couple Ox/X. Une <strong>dismutation</strong> est la réaction de X sur lui-même, qui donne Ox et Red (une partie de X s'oxyde, l'autre se réduit). La <strong>médiamutation</strong> (ou rétrodismutation) est la réaction inverse : Ox et Red réagissent pour donner X.
  </div>
  <div class="prop-box">
    <strong>Critère.</strong> D'après la règle du γ, X se dismute (\(K^\circ \gt 1\)) si \(E^\circ(\mathrm{X/Red}) \gt E^\circ(\mathrm{Ox/X})\) : l'oxydant le plus fort et le réducteur le plus fort des deux couples sont la même espèce X. Sur un diagramme de prédominance, X n'a plus de domaine : les frontières se croisent. Dans le cas contraire (\(E^\circ(\mathrm{Ox/X}) \gt E^\circ(\mathrm{X/Red})\)), X est stable et c'est la médiamutation de Ox et Red qui est favorisée.
  </div>
  <div class="method-box"><strong>Exemple — trois cas à connaître</strong>
    <p>Données (V) : Cu²⁺/Cu⁺ 0,16 ; Cu⁺/Cu 0,52 ; H₂O₂/H₂O 1,77 ; O₂/H₂O₂ 0,68 ; Fe³⁺/Fe²⁺ 0,77 ; Fe²⁺/Fe −0,44.</p>
    <ol>
      <li>Cu⁺ : \(0{,}52 \gt 0{,}16\), il se dismute : 2 Cu⁺ = Cu²⁺ + Cu, \(\log K^\circ = (0{,}52 - 0{,}16)/0{,}06 = 6\). Les ions cuivre(I) n'existent pas durablement en solution aqueuse (seulement dans des solides comme Cu₂O ou des complexes).</li>
      <li>H₂O₂ : \(1{,}77 \gt 0{,}68\), dismutation 2 H₂O₂ = 2 H₂O + O₂ (\(n = 2\)), \(\log K^\circ = 2\times1{,}09/0{,}06 = 36{,}3\). Elle est pourtant très lente sans catalyseur : l'eau oxygénée se conserve au frais et à l'abri de la lumière ; le dioxyde de manganèse, les ions Fe³⁺ ou une enzyme du sang (la catalase) la décomposent en quelques secondes. C'est un <strong>blocage cinétique</strong>.</li>
      <li>Fe²⁺ : \(0{,}77 \gt -0{,}44\), donc Fe²⁺ est stable ; la médiamutation Fe + 2 Fe³⁺ = 3 Fe²⁺ est favorisée, \(\log K^\circ = 2\times1{,}21/0{,}06 = 40{,}3\). On conserve une solution de Fe²⁺ avec un clou de fer : les ions Fe³⁺ formés par l'air sont aussitôt réduits.</li>
    </ol>
  </div>
  <p>La dismutation dépend souvent du pH : le dichlore se dismute en milieu basique (Cl₂ + 2 HO⁻ = Cl⁻ + ClO⁻ + H₂O, préparation de l'eau de Javel) alors qu'en milieu acide, c'est la médiamutation HClO + Cl⁻ + H⁺ = Cl₂ + H₂O qui est favorisée (\(\log K^\circ = (1{,}63 - 1{,}36)/0{,}06 = 4{,}5\) à pH 0, avec \(E^\circ(\mathrm{HClO/Cl_2}) = 1{,}63\ \text{V}\) et \(E^\circ(\mathrm{Cl_2/Cl^-}) = 1{,}36\ \text{V}\)). D'où le danger de mélanger eau de Javel et détartrant acide : il se dégage du dichlore, toxique. Le seuil de pH se lit sur un diagramme potentiel-pH (<a href="#eph/cours">« Diagrammes E-pH »</a>).</p>
  <div class="notice"><strong>Erreur classique</strong> : comparer les potentiels de deux couples qui ne font pas intervenir X, ou appliquer le critère à l'envers. Méthode sûre : écrire les deux demi-équations où X apparaît, placer les deux couples sur l'échelle et appliquer la règle du γ à X (oxydant du couple du haut) et X (réducteur du couple du bas).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · TITRAGES D'OXYDORÉDUCTION</div>
  <h2>Doser une espèce par une réaction d'oxydoréduction</h2>
  <div class="intro">Les titrages sont étudiés en travaux pratiques, mais leurs capacités sont exigibles : choisir la réaction support, repérer l'équivalence, exploiter une courbe. Le vocabulaire général (direct, indirect, simple, successif) est celui de <a href="#acidobase/cours">« Réactions acido-basiques »</a> (§9) ; on présente ici le suivi potentiométrique et les deux titrages d'oxydoréduction les plus utilisés.</div>
  <div class="prop-box">
    <strong>Titrage direct, suivi potentiométrique.</strong> La réaction support doit être unique, rapide et quasi totale. On suit le potentiel de la solution avec une électrode de platine (inerte) et une électrode de référence (§6). Avant l'équivalence, l'espèce titrée et sa forme conjuguée sont présentes : leur couple fixe \(E\) ; après, le couple du réactif titrant fixe \(E\) ; à l'équivalence, \(E\) varie brutalement (saut de potentiel).
  </div>

  <p>Titrage des ions Fe²⁺ par le permanganate en milieu acide : MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ = Mn²⁺ + 5 Fe³⁺ + 4 H₂O (\(K^\circ = 10^{61{,}7}\)). À l'équivalence, \(n(\mathrm{Fe^{2+}})_0 = 5\,n(\mathrm{MnO_4^-})_{\text{versé}}\). Pour un volume \(V \lt V_E\) versé, le rapport \([\mathrm{Fe^{3+}}]/[\mathrm{Fe^{2+}}]\) vaut \(V/(V_E - V)\), d'où \(E = 0{,}77 + 0{,}06\log\dfrac{V}{V_E - V}\) : à la <strong>demi-équivalence</strong>, \(E = E^\circ(\mathrm{Fe^{3+}/Fe^{2+}})\). À \(V = 2V_E\), [MnO₄⁻] = [Mn²⁺] et \(E = E^\circ(\mathrm{MnO_4^-/Mn^{2+}}) - 0{,}096\,\text{pH}\).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour aller plus loin</span>
    <span class="prompt">Potentiel à l'équivalence</span>
    <div class="content">
      <p>À l'équivalence, les réactifs ont été mélangés dans les proportions stœchiométriques : \([\mathrm{Fe^{3+}}] = 5[\mathrm{Mn^{2+}}]\) et \([\mathrm{Fe^{2+}}] = 5[\mathrm{MnO_4^-}]\). En ajoutant la formule de Nernst du fer et cinq fois celle du manganèse, les concentrations se simplifient : \(6E_{\text{éq}} = E_1^\circ + 5E_2^\circ - 0{,}48\,\text{pH}\), soit \(E_{\text{éq}} = (0{,}77 + 5\times1{,}51)/6 = 1{,}39\ \text{V}\) à pH 0. Le point d'équivalence n'est pas au milieu du saut quand les deux couples n'échangent pas le même nombre d'électrons.</p>
    </div>
  </div>
  <div class="method-box"><strong>Exemple — doser un sel de fer(II)</strong>
    <p>On titre \(V_0 = 20{,}0\ \text{mL}\) d'une solution de Fe²⁺ acidifiée par l'acide sulfurique, par le permanganate de potassium à \(c = 2{,}00\times10^{-2}\ \text{mol·L}^{-1}\) ; la teinte violette persiste à partir de \(V_E = 12{,}6\ \text{mL}\). Concentration en Fe²⁺ ? Pourquoi l'acide sulfurique et pas l'acide chlorhydrique ?</p>
    <ol>
      <li>Repérage : MnO₄⁻ est violet, Mn²⁺, Fe²⁺ et Fe³⁺ (dilués) sont presque incolores. Avant l'équivalence, chaque goutte est décolorée ; la première teinte rose persistante marque l'équivalence : le permanganate est son propre indicateur.</li>
      <li>\([\mathrm{Fe^{2+}}] = \dfrac{5\,c\,V_E}{V_0}\) \(= \dfrac{5\times2{,}00\times10^{-2}\times12{,}6}{20{,}0}\) \(= 6{,}30\times10^{-2}\ \text{mol·L}^{-1}\).</li>
      <li>Le permanganate oxyde aussi les ions chlorure : 2 MnO₄⁻ + 10 Cl⁻ + 16 H⁺ = 2 Mn²⁺ + 5 Cl₂ + 8 H₂O, \(\log K^\circ = 10\times(1{,}51 - 1{,}36)/0{,}06 = 25\). Même lente, cette réaction consommerait du permanganate et fausserait le dosage par excès.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Titrage indirect : iodométrie.</strong> Pour doser un oxydant (eau oxygénée, eau de Javel, dioxygène dissous, Cu²⁺…), on le fait réagir avec un <strong>excès</strong> d'ions iodure : il se forme une quantité de diiode qui lui est proportionnelle. On titre ensuite ce diiode par le thiosulfate :
    <div class="formula" data-nom="Titrage du diiode par le thiosulfate">$$\mathrm{I_2} + 2\,\mathrm{S_2O_3^{2-}} = 2\,\mathrm{I^-} + \mathrm{S_4O_6^{2-}}\qquad \log K^\circ = \frac{2\times(0{,}54 - 0{,}08)}{0{,}06} = 15{,}3$$</div>
    Le diiode (jaune-brun en présence d'iodure) donne une teinte bleu foncé avec l'empois d'amidon ou le thiodène, ajouté près de l'équivalence : la disparition du bleu marque l'équivalence, où \(n(\mathrm{S_2O_3^{2-}}) = 2\,n(\mathrm{I_2})\).
  </div>
  <div class="method-box"><strong>Exemple — doser une eau oxygénée par iodométrie</strong>
    <p>À \(V_0 = 10{,}0\ \text{mL}\) d'eau oxygénée diluée, on ajoute un excès d'iodure de potassium et d'acide sulfurique ; le diiode formé est titré par le thiosulfate à \(0{,}100\ \text{mol·L}^{-1}\), équivalence à 15,0 mL. Concentration en H₂O₂ ?</p>
    <ol>
      <li>H₂O₂ + 2 I⁻ + 2 H⁺ = I₂ + 2 H₂O, \(\log K^\circ = 2\times(1{,}77 - 0{,}54)/0{,}06 = 41\) : totale, et l'iodure en excès garantit que tout H₂O₂ réagit.</li>
      <li>\(n(\mathrm{S_2O_3^{2-}}) = 0{,}100\times15{,}0 = 1{,}50\ \text{mmol}\), donc \(n(\mathrm{I_2}) = 0{,}750\ \text{mmol} = n(\mathrm{H_2O_2})\).</li>
      <li>\([\mathrm{H_2O_2}] = 0{,}750/10{,}0 = 7{,}50\times10^{-2}\ \text{mol·L}^{-1}\). La quantité d'iodure ajoutée n'intervient pas : seul compte le diiode formé.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(n(\mathrm{Fe^{2+}}) = n(\mathrm{MnO_4^-})\) en oubliant le facteur 5, ou \(n(\mathrm{I_2}) = n(\mathrm{S_2O_3^{2-}})\) en oubliant le facteur 2. Autre piège : croire que la quantité d'iodure ajoutée doit être connue précisément ; il suffit qu'elle soit en excès.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · INFLUENCE DU MILIEU : pH ET PRÉCIPITATION</div>
  <h2>Le pH et les précipités changent le pouvoir oxydant</h2>
  <div class="intro">Le potentiel d'un couple dépend de tout ce qui figure dans sa demi-équation. Quand des ions H⁺ y interviennent, ou quand l'oxydant ou le réducteur est engagé dans un précipité, le milieu déplace le potentiel de plusieurs dixièmes de volt. Ce sont les acquis des réactions acido-basiques et de précipitation réinvestis ; les diagrammes potentiel-pH en sont la représentation systématique.</div>
  <div class="prop-box">
    <strong>Potentiel standard apparent.</strong> Pour un couple \(\alpha\,\mathrm{Ox} + p\,\mathrm{H^+} + n\,e^- = \beta\,\mathrm{Red} + q\,\mathrm{H_2O}\), on regroupe les termes en pH dans un <strong>potentiel standard apparent</strong>, valable à pH fixé :
    <div class="formula" data-nom="Potentiel standard apparent">$$E^{\circ}_{\text{app}}(\text{pH}) = E^\circ - \frac{0{,}06\,p}{n}\,\text{pH}$$</div>
    Le pouvoir oxydant d'un tel oxydant diminue quand le pH augmente.
  </div>
  <div class="method-box"><strong>Exemple — permanganate et dichromate selon le pH</strong>
    <ol>
      <li>MnO₄⁻/Mn²⁺ (\(p = 8\), \(n = 5\)) : \(E^\circ_{\text{app}} = 1{,}51 - 0{,}096\,\text{pH}\), soit 1,51 V à pH 0, 1,22 V à pH 3, 1,03 V à pH 5. Les titrages au permanganate se font en milieu très acide ; en milieu peu acide ou basique, MnO₄⁻ est d'ailleurs réduit en MnO₂ (solide brun), et non plus en Mn²⁺.</li>
      <li>Cr₂O₇²⁻/Cr³⁺ (\(p = 14\), \(n = 6\)) : pente \(0{,}06\times14/6 = 0{,}14\ \text{V}\) par unité de pH ; \(E^\circ_{\text{app}} = 1{,}33 - 0{,}14\times3 = 0{,}91\ \text{V}\) à pH 3.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Précipitation.</strong> Si l'oxydant (ou le réducteur) d'un couple est engagé dans un précipité, sa concentration libre est fixée par le produit de solubilité : le potentiel change. Pour l'argent en présence d'ions chlorure (\(\text{p}K_s(\mathrm{AgCl}) = 9{,}75\)), \([\mathrm{Ag^+}] = K_s/[\mathrm{Cl^-}]\) et
    <div class="formula" data-nom="Potentiel du couple AgCl/Ag">$$E = 0{,}80 + 0{,}06\log\frac{K_s}{[\mathrm{Cl^-}]} = 0{,}215 - 0{,}06\log[\mathrm{Cl^-}]$$</div>
    C'est le potentiel du couple AgCl(s)/Ag (AgCl + e⁻ = Ag + Cl⁻), de potentiel standard 0,22 V : en présence de chlorure, l'argent est un réducteur bien plus fort. C'est aussi ce qui fixe le potentiel de l'électrode de référence Ag/AgCl (§6).
  </div>
  <div class="method-box"><strong>Exemple — l'argent et les ions fer(III), avec et sans chlorure</strong>
    <p>Au §8, l'argent ne réduisait que 80 % des ions Fe³⁺ (\(K^\circ = 10^{-0{,}5}\)). Que devient la réaction en présence d'ions chlorure à 0,10 mol·L⁻¹ ?</p>
    <ol>
      <li>Nouvelle réaction : Ag + Fe³⁺ + Cl⁻ = AgCl(s) + Fe²⁺, entre les couples Fe³⁺/Fe²⁺ (0,77 V) et AgCl/Ag (0,215 V).</li>
      <li>\(\log K^\circ = (0{,}77 - 0{,}215)/0{,}06 = 9{,}25\) : la réaction devient quasi totale. La précipitation de AgCl « tire » la réaction : c'est l'oxydation de l'argent qui est facilitée.</li>
      <li>Potentiel de l'argent dans la solution de chlorure : \(E = 0{,}215 - 0{,}06\log 0{,}10 = 0{,}275\ \text{V}\), au lieu de 0,80 V pour Ag⁺ à 1 mol·L⁻¹.</li>
    </ol>
  </div>
  <p>De même, la précipitation des hydroxydes Fe(OH)₂ et Fe(OH)₃ en milieu basique modifie les couples du fer ; la représentation de toutes ces espèces dans un plan (pH, \(E\)) est l'objet du chapitre suivant, <a href="#eph/cours">« Diagrammes E-pH »</a>.</p>
  <div class="notice"><strong>Erreur classique</strong> : comparer les \(E^\circ\) tabulés (valables à pH 0, sans précipité) alors que la réaction se fait à pH 7 ou en présence d'un ion qui précipite ; il faut comparer les potentiels apparents dans le milieu réel.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · ÉLECTROLYSE ET ÉNERGIE (2ᵉ ANNÉE)</div>
  <h2>Ce qui sera vu en PT</h2>
  <div class="intro">Hors programme en PTSI (vu en 2ᵉ année). Ces notions prolongent le chapitre ; elles sont développées dans <a href="#thermochimie/cours">« Thermodynamique de la transformation chimique »</a> (§9, §10) et <a href="#electrochimie/cours">« Électrochimie »</a>.</div>
  <ul>
    <li><strong>Enthalpie libre et potentiels.</strong> \(\Delta_rG^\circ = -nF\,(E_1^\circ - E_2^\circ)\) et \(\Delta_rG^\circ = -RT\ln K^\circ\) redonnent la relation du §4 ; la tension à vide d'une pile vérifie \(e = -\Delta_rG/(nF)\). Des potentiels standard se combinent en additionnant les enthalpies libres, jamais les potentiels : \(E^\circ(\mathrm{Fe^{3+}/Fe}) = \dfrac{0{,}77 + 2\times(-0{,}44)}{3} = -0{,}04\ \text{V}\), et non la moyenne des deux.</li>
    <li><strong>Capacité d'une pile</strong> : charge totale débitable \(Q = nF\,\xi_{\max}\) ; une pile Daniell dont le réactif limitant est 1,0 g de zinc débite 2,9 kC, soit 0,82 A·h.</li>
    <li><strong>Électrolyse</strong> : un générateur impose une tension supérieure à \(e\) en sens inverse et force la réaction non favorisée (production de l'aluminium, du dichlore et de la soude, du dihydrogène, recharge d'un accumulateur). La cathode reste le siège de la réduction, mais c'est désormais le pôle ⊖. La tension réellement nécessaire se lit sur les courbes courant-potentiel.</li>
    <li><strong>Corrosion</strong> humide des métaux, corrosion galvanique de deux métaux en contact, protection par revêtement, anode sacrificielle ou courant imposé : étudiées avec les courbes courant-potentiel.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · OXYDORÉDUCTION</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix savoir-faire couvrent les capacités exigibles : identifier et équilibrer, chiffrer un potentiel, prévoir une réaction et son état final, décrire une pile, exploiter un titrage. Notations du cours : \(E^\circ\), \(E\), \(K^\circ\), \(c^\circ = 1\ \text{mol·L}^{-1}\), \(\dfrac{RT}{F}\ln 10 \approx 0{,}06\ \text{V}\) à 298 K.</div>

  <div class="method-box"><strong>Méthode 1 — Déterminer un nombre d'oxydation et identifier l'oxydant d'un couple</strong>
    <ol>
      <li>Appliquer les règles : O vaut −II (−I dans un peroxyde), H vaut +I, corps simple 0, somme des n.o. = charge de l'édifice.</li>
      <li>Poser l'équation pour l'élément cherché ; un résultat fractionnaire est une moyenne sur plusieurs atomes.</li>
      <li>Dans un couple, l'oxydant est l'espèce où l'élément a le n.o. le plus élevé ; la variation totale de n.o. donne le nombre d'électrons de la demi-équation.</li>
      <li>Pour les n.o. extrêmes : \(+v\) au plus (\(v\) électrons de valence) ; \(-(8 - v)\) au moins pour un non-métal.</li>
    </ol>
    <p><em>Exemple éclair :</em> ClO⁻ : \(x - 2 = -1\), Cl(+I) ; Cl⁻ : −I. Dans le couple ClO⁻/Cl⁻, ClO⁻ est l'oxydant et la demi-équation échange \(1 - (-1) = 2\) électrons. Le chlore (\(v = 7\)) varie de −I (Cl⁻) à +VII (ClO₄⁻).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Équilibrer une demi-équation électronique</strong>
    <ol>
      <li>Équilibrer l'élément qui change de n.o.</li>
      <li>Équilibrer O avec H₂O, puis H avec H⁺.</li>
      <li>Équilibrer les charges avec des électrons, du côté de l'oxydant ; contrôler : nombre d'électrons = variation totale de n.o.</li>
      <li>En milieu basique : ajouter autant de HO⁻ que de H⁺ des deux côtés, remplacer H⁺ + HO⁻ par H₂O et simplifier l'eau.</li>
    </ol>
    <p><em>Exemple éclair :</em> NO₃⁻/NO en milieu acide : N(+V) → N(+II), 3 électrons. NO₃⁻ → NO + 2 H₂O, + 4 H⁺ à gauche ; charges \(-1 + 4 = +3\) à gauche, 0 à droite : NO₃⁻ + 4 H⁺ + 3 e⁻ = NO + 2 H₂O. En milieu basique : NO₃⁻ + 2 H₂O + 3 e⁻ = NO + 4 HO⁻.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Écrire l'équation d'une réaction d'oxydoréduction</strong>
    <ol>
      <li>Repérer, dans l'énoncé ou par la règle du γ, l'oxydant Ox₁ qui réagit et le réducteur Red₂ qui réagit.</li>
      <li>Écrire les deux demi-équations dans le sens de la réaction : Ox₁ + \(n_1\) e⁻ → Red₁ et Red₂ → Ox₂ + \(n_2\) e⁻.</li>
      <li>Multiplier par les plus petits facteurs qui égalisent les électrons, additionner, simplifier H⁺, H₂O (et HO⁻) présents des deux côtés.</li>
      <li>Vérifier la conservation des éléments et des charges ; noter le nombre \(n\) d'électrons échangés par l'équation écrite.</li>
    </ol>
    <p><em>Exemple éclair :</em> MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O et (Fe²⁺ → Fe³⁺ + e⁻) × 5 donnent MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O, \(n = 5\) ; charges \(-1 + 10 + 8 = 17 = 2 + 15\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Appliquer la formule de Nernst</strong>
    <ol>
      <li>Écrire la demi-équation équilibrée \(\alpha\,\mathrm{Ox} + p\,\mathrm{H^+} + n\,e^- = \beta\,\mathrm{Red} + q\,\mathrm{H_2O}\).</li>
      <li>Écrire \(E = E^\circ + \dfrac{0{,}06}{n}\log\dfrac{a_{\mathrm{Ox}}^{\,\alpha}\,a_{\mathrm{H^+}}^{\,p}}{a_{\mathrm{Red}}^{\,\beta}}\), chaque activité à la puissance de son coefficient.</li>
      <li>Activités : \([\mathrm{X}]/c^\circ\) pour un soluté, \(P/P^\circ\) pour un gaz, 1 pour un solide pur ou l'eau.</li>
      <li>Sortir le terme en pH : \(-\dfrac{0{,}06\,p}{n}\,\text{pH}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> Cr₂O₇²⁻ + 14 H⁺ + 6 e⁻ = 2 Cr³⁺ + 7 H₂O, [Cr₂O₇²⁻] = 0,10, [Cr³⁺] = 0,010 mol·L⁻¹, pH 1 : \(E = 1{,}33 + 0{,}01\log\dfrac{0{,}10}{0{,}010^2} - 0{,}14 = 1{,}33 + 0{,}03 - 0{,}14 = 1{,}22\ \text{V}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \([\mathrm{Cr^{3+}}]^2\) et non \([\mathrm{Cr^{3+}}]\) ; \(0{,}06/6 = 0{,}01\) et non 0,06 ; signe moins devant le terme en pH.</div>

  <div class="method-box"><strong>Méthode 5 — Prévoir le sens d'une réaction et calculer sa constante</strong>
    <ol>
      <li>Placer les couples sur une échelle verticale des \(E^\circ\) ; repérer l'oxydant le plus fort (en haut) et le réducteur le plus fort (en bas) : ils réagissent (règle du γ).</li>
      <li>Écrire l'équation (méthode 3) et noter \(n\).</li>
      <li>Calculer \(\log K^\circ = \dfrac{n\,(E^\circ_{\text{ox}} - E^\circ_{\text{red}})}{0{,}06}\), avec \(E^\circ_{\text{ox}}\) le potentiel du couple de l'oxydant qui réagit.</li>
      <li>Conclure : \(K^\circ \gt 1\), favorisée ; \(K^\circ\) très grand (\(\gtrsim 10^4\)), quasi totale. Si \(\Delta E^\circ\) ne fait que quelques centièmes de volt, comparer les potentiels \(E\) réels (méthode 9).</li>
    </ol>
    <p><em>Exemple éclair :</em> le diiode oxyde-t-il le thiosulfate ? \(E^\circ(\mathrm{I_2/I^-}) = 0{,}54\ \text{V} \gt E^\circ(\mathrm{S_4O_6^{2-}/S_2O_3^{2-}}) = 0{,}08\ \text{V}\) : oui, I₂ + 2 S₂O₃²⁻ = 2 I⁻ + S₄O₆²⁻, \(n = 2\), \(\log K^\circ = 2\times0{,}46/0{,}06 = 15{,}3\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Décrire une pile (potentiels ou mesure de tension à vide)</strong>
    <ol>
      <li>Calculer le potentiel de chaque électrode par la formule de Nernst ; ou, à partir d'une mesure, lire le signe de \(U = V_{\text{V}} - V_{\text{COM}}\).</li>
      <li>Le pôle ⊕ est l'électrode de plus haut potentiel : cathode, siège de la réduction de l'oxydant de son couple. Le pôle ⊖ est l'anode, siège de l'oxydation.</li>
      <li>Tension à vide \(e = E_+ - E_-\) ; équation de fonctionnement = somme des deux demi-équations.</li>
      <li>Porteurs de charge : électrons de ⊖ vers ⊕ dans les fils, courant de ⊕ vers ⊖ ; dans le pont salin, cations vers la cathode, anions vers l'anode.</li>
      <li>Mesure d'un potentiel avec une électrode de référence : \(E = U + E_{\text{réf}}\) (ECS : 0,244 V ; Ag/AgCl : 0,197 V).</li>
    </ol>
    <p><em>Exemple éclair :</em> zinc dans Zn²⁺ (borne COM) et fil de platine dans Fe³⁺/Fe²⁺ (borne V) ; on lit \(U = +1{,}53\ \text{V}\). L'électrode de platine est le pôle ⊕ (réduction de Fe³⁺), le zinc le pôle ⊖ (oxydation de Zn) ; \(e = 1{,}53\ \text{V}\) ; fonctionnement : 2 Fe³⁺ + Zn → 2 Fe²⁺ + Zn²⁺.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dans une pile, l'anode est le pôle ⊖ ; et le pôle ⊕ se décide avec les potentiels \(E\) (concentrations réelles), pas avec les \(E^\circ\).</div>

  <div class="method-box"><strong>Méthode 7 — Prévoir une dismutation ou une médiamutation</strong>
    <ol>
      <li>Repérer l'espèce X de n.o. intermédiaire et écrire les deux couples où elle intervient : Ox/X et X/Red.</li>
      <li>Si \(E^\circ(\mathrm{X/Red}) \gt E^\circ(\mathrm{Ox/X})\), X se dismute : 2 X → Ox + Red (coefficients à ajuster) ; sinon, Ox et Red se médiamutent en X.</li>
      <li>Calculer \(K^\circ\) comme pour toute réaction (méthode 5) ; garder en tête qu'une dismutation favorisée peut être bloquée cinétiquement.</li>
    </ol>
    <p><em>Exemple éclair :</em> Sn²⁺ avec \(E^\circ(\mathrm{Sn^{4+}/Sn^{2+}}) = 0{,}15\ \text{V}\) et \(E^\circ(\mathrm{Sn^{2+}/Sn}) = -0{,}14\ \text{V}\) : \(-0{,}14 \lt 0{,}15\), Sn²⁺ est stable ; c'est Sn + Sn⁴⁺ = 2 Sn²⁺ qui est favorisée, \(\log K^\circ = 2\times0{,}29/0{,}06 = 9{,}7\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Utiliser un diagramme de prédominance ou d'existence en potentiel</strong>
    <ol>
      <li>Préciser la convention : égalité des concentrations entre espèces dissoutes (frontière en \(E^\circ\) pour Ox + n e⁻ = Red) ; concentration de tracé \(c_{\text{tr}}\) pour un solide : frontière \(E^\circ + \dfrac{0{,}06}{n}\log c_{\text{tr}}\) pour Mⁿ⁺/M.</li>
      <li>Tracer les axes de chaque élément côte à côte, oxydants en haut.</li>
      <li>Deux espèces de domaines disjoints réagissent ; des domaines qui se recouvrent indiquent des espèces compatibles.</li>
      <li>À un potentiel imposé, lire l'espèce majoritaire de chaque élément.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(c_{\text{tr}} = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) : Fe²⁺/Fe à \(-0{,}44 - 0{,}06 = -0{,}50\ \text{V}\), Sn²⁺/Sn à \(-0{,}20\ \text{V}\). Fe et Sn²⁺ ont des domaines disjoints : Fe + Sn²⁺ = Fe²⁺ + Sn, \(\log K^\circ = 2\times0{,}30/0{,}06 = 10\) ; Sn et Fe²⁺ sont compatibles.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Déterminer l'état final d'une transformation</strong>
    <ol>
      <li>Écrire la réaction et calculer \(K^\circ\) ; comparer \(Q_{r,0}\) à \(K^\circ\) (ou les potentiels \(E\) des deux couples à l'état initial) pour le sens.</li>
      <li>Tableau d'avancement. \(K^\circ\) très grand : réaction totale, puis concentration résiduelle du réactif limitant par \(K^\circ\). Sinon, résoudre \(Q_r(x) = K^\circ\) (à la main ou en Python).</li>
      <li>Potentiel final : formule de Nernst de n'importe quel couple présent (tous ont le même potentiel).</li>
    </ol>
    <p><em>Exemple éclair :</em> poudre de cuivre en excès dans Fe³⁺ à 0,10 mol·L⁻¹ : 2 Fe³⁺ + Cu = 2 Fe²⁺ + Cu²⁺, \(K^\circ = 10^{14{,}3}\), totale : [Fe²⁺] = 0,10, [Cu²⁺] = 0,050 mol·L⁻¹ ; \(E = 0{,}34 + 0{,}03\log 0{,}050 = 0{,}30\ \text{V}\) ; d'où \([\mathrm{Fe^{3+}}] = 0{,}10\times10^{(0{,}30 - 0{,}77)/0{,}06} \approx 1{,}5\times10^{-9}\ \text{mol·L}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Exploiter un titrage d'oxydoréduction</strong>
    <ol>
      <li>Écrire la réaction support (méthode 3), vérifier qu'elle est quasi totale ; pour un titrage indirect, écrire aussi la réaction qui forme l'espèce titrée (I₂ en iodométrie).</li>
      <li>À l'équivalence, les quantités sont dans les proportions des coefficients : pour \(a\,\mathrm{A} + b\,\mathrm{B}\), \(n_A/a = n_B/b\).</li>
      <li>Repérer l'équivalence : saut de potentiel (électrode de platine + référence), changement de teinte (MnO₄⁻ autoindicateur, disparition du bleu de l'empois d'amidon).</li>
      <li>Sur une courbe \(E = f(V)\) : à la demi-équivalence, \(E \approx E^\circ\) du couple titré (si ses deux formes ont le même coefficient) ; après \(2V_E\), \(E\) est fixé par le couple titrant.</li>
    </ol>
    <p><em>Exemple éclair :</em> 10,0 mL d'une solution de diiode titrés par le thiosulfate à 0,0500 mol·L⁻¹, \(V_E = 8{,}0\ \text{mL}\) : \(n(\mathrm{I_2}) = \tfrac12\times0{,}0500\times8{,}0 = 0{,}20\ \text{mmol}\), \([\mathrm{I_2}] = 2{,}0\times10^{-2}\ \text{mol·L}^{-1}\).</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : confondre oxydant (qui se réduit) et espèce oxydée ; inverser la règle du γ ; oublier \(n\) dans \(\log K^\circ\) ou les coefficients stœchiométriques à l'équivalence ; comparer des \(E^\circ\) quand les concentrations ou le pH changent le classement ; croire qu'une réaction favorisée est forcément rapide.</div>
</div>

    <strong>SO₄²⁻ + 4 H⁺ + 2 e⁻ = SO₂ + 2 H₂O</strong> (S de +VI à +IV : 2 électrons).</p>
    <p><strong>Q3.</strong> N équilibré. O : 3 → 1, ajouter 2 H₂O à droite. H : 4 à droite, ajouter 4 H⁺ à gauche. Charges : gauche +4−1 = +3, droite 0, donc 3 e⁻ à gauche.<br>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Réaction globale et K°</h3>
  <div class="statement">On mélange une solution de Cu²⁺ et un morceau de zinc métallique. Données : E°(Cu²⁺/Cu) = 0,34 V ; E°(Zn²⁺/Zn) = −0,76 V.</div>
  <div class="q"><strong>Q1.</strong> Quelle est la réaction spontanée ? L'écrire de manière équilibrée.</div>
  <div class="q"><strong>Q2.</strong> Calculer la constante d'équilibre K° à 298 K.</div>
  <div class="q"><strong>Q3.</strong> Conclure sur l'avancement de la réaction.</div>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> Face au permanganate (\(E^\circ = 1{,}51\ \text{V}\)), H₂O₂ est le réducteur du couple O₂/H₂O₂ (0,68 V) : il est oxydé en O₂. MnO₄⁻ + 8 H⁺ + 5 e⁻ = Mn²⁺ + 4 H₂O (×2) et H₂O₂ = O₂ + 2 H⁺ + 2 e⁻ (×5) donnent 2 MnO₄⁻ + 5 H₂O₂ + 6 H⁺ = 2 Mn²⁺ + 5 O₂ + 8 H₂O (charges : +4 de chaque côté), \(n = 10\), \(\log K^\circ = 10\times0{,}83/0{,}06 = 138\).</p>
    <p><strong>Q2.</strong> Le permanganate est son propre indicateur : avant l'équivalence il est réduit en Mn²⁺ (presque incolore) ; l'équivalence est repérée par la première teinte rose persistante.</p>
    <p><strong>Q3.</strong> À l'équivalence, \(n(\mathrm{H_2O_2}) = \tfrac52\,n(\mathrm{MnO_4^-})\) : \(c_{\text{dil}} = \dfrac{5\times2{,}00\times10^{-2}\times17{,}6}{2\times10{,}0}\) \(= 8{,}80\times10^{-2}\ \text{mol·L}^{-1}\), et la solution commerciale est à \(c = 0{,}880\ \text{mol·L}^{-1}\).</p>
    <p><strong>Q4.</strong> Un litre contient 0,880 mol de H₂O₂, qui libère 0,440 mol de O₂, soit \(0{,}440\times22{,}4 = 9{,}86\ \text{L}\) : titre 9,9 volumes. Une eau à 10 volumes exacte serait à \(2\times10/22{,}4 = 0{,}893\ \text{mol·L}^{-1}\) : l'écart de 1,4 % est de l'ordre de la précision du titrage, ou traduit une légère décomposition (dismutation lente) depuis la fabrication.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Conserver une solution de fer(II)</h3>
  <div class="statement">Une solution de sel de Mohr (ions Fe²⁺ à 0,100 mol·L⁻¹), acidifiée à pH 1, est laissée à l'air. \(E^\circ\) (V) : O₂/H₂O 1,23 ; Fe³⁺/Fe²⁺ 0,77 ; H⁺/H₂ 0,00 ; Fe²⁺/Fe −0,44. \(M(\mathrm{Fe}) = 55{,}85\ \text{g·mol}^{-1}\). Pression partielle du dioxygène de l'air : 0,21 bar.</div>
  <div class="q"><strong>Q1.</strong> Montrer que le dioxygène dissous peut oxyder les ions Fe²⁺ : potentiel du couple O₂/H₂O à pH 1, équation, constante. Au laboratoire, la solution jaunit pourtant en plusieurs jours seulement : interpréter.</div>
  <div class="q"><strong>Q2.</strong> Après une semaine, 100 mL de solution contiennent [Fe³⁺] = 0,010 et [Fe²⁺] = 0,090 mol·L⁻¹. Calculer son potentiel.</div>
  <div class="q"><strong>Q3.</strong> On y plonge un clou de fer (en excès). Quelle réaction se produit ? Nommer ce type de réaction et calculer sa constante. Quelle masse de fer est consommée, et quelle est la concentration finale en Fe²⁺ ?</div>
  <div class="q"><strong>Q4.</strong> Le fer réduit aussi les ions H⁺ (\(K^\circ\) à calculer), mais on n'observe qu'un très faible dégagement gazeux. Conclure sur l'intérêt du clou et sur le potentiel de la solution qui le contient.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> O₂ + 4 H⁺ + 4 e⁻ = 2 H₂O : \(E = 1{,}23 + \dfrac{0{,}06}{4}\log 0{,}21 - 0{,}06\times1\) \(= 1{,}16\ \text{V}\), bien au-dessus de 0,77 V. Réaction : 4 Fe²⁺ + O₂ + 4 H⁺ = 4 Fe³⁺ + 2 H₂O, \(n = 4\), \(\log K^\circ = 4\times0{,}46/0{,}06 = 30{,}7\). Thermodynamiquement totale, elle est lente (dioxygène peu soluble, réaction lente en milieu acide) : l'écart entre la prévision et l'observation est d'origine cinétique.</p>
    <p><strong>Q2.</strong> \(E = 0{,}77 + 0{,}06\log(0{,}010/0{,}090) = 0{,}71\ \text{V}\).</p>
    <p><strong>Q3.</strong> Fe (domaine le plus bas) et Fe³⁺ (le plus haut) donnent l'espèce intermédiaire : médiamutation Fe + 2 Fe³⁺ = 3 Fe²⁺, \(\log K^\circ = 2\times(0{,}77 + 0{,}44)/0{,}06 = 40{,}3\), totale. \(n(\mathrm{Fe^{3+}}) = 1{,}0\ \text{mmol}\) consomme 0,50 mmol de fer, soit 28 mg, et forme 1,5 mmol de Fe²⁺ : [Fe²⁺] = 0,090 + 0,015 = 0,105 mol·L⁻¹.</p>
    <p><strong>Q4.</strong> Fe + 2 H⁺ = Fe²⁺ + H₂ : \(\log K^\circ = 2\times0{,}44/0{,}06 = 14{,}7\), favorisée mais lente (dégagement de dihydrogène lent sur le fer) ; elle ne consomme qu'un peu de fer et d'acide. Le clou réduit au fur et à mesure les ions Fe³⁺ formés par l'air : la solution reste au fer(II). Son potentiel est alors fixé par le couple Fe²⁺/Fe : \(E = -0{,}44 + 0{,}03\log 0{,}105 = -0{,}47\ \text{V}\), ce qui laisse une concentration en Fe³⁺ négligeable (de l'ordre de \(10^{-22}\ \text{mol·L}^{-1}\)).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Eau de Javel : dangers, dosage et conservation</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : oxydoréduction en solution aqueuse).</div>
  <div class="statement">L'eau de Javel est une solution aqueuse basique d'hypochlorite de sodium (Na⁺, ClO⁻) et de chlorure de sodium (Na⁺, Cl⁻), en quantités égales. Données à 298 K : \(E^\circ\) (V) HClO/Cl₂ 1,63 ; Cl₂/Cl⁻ 1,36 ; HClO/Cl⁻ 1,49 ; I₂/I⁻ 0,54 ; S₄O₆²⁻/S₂O₃²⁻ 0,08 ; \(\text{p}K_a(\mathrm{HClO/ClO^-}) = 7{,}5\) ; volume molaire d'un gaz à 20 °C : 24,0 L·mol⁻¹ ; \(\dfrac{RT}{F}\ln10 = 0{,}06\ \text{V}\).</div>
  <div class="exo-part">Partie A — Les espèces du chlore</div>
  <div class="q"><strong>A1.</strong> Donner le n.o. du chlore dans Cl⁻, Cl₂, HClO et ClO⁻. Parmi les couples HClO/ClO⁻, HClO/Cl₂ et Cl₂/Cl⁻, lesquels sont acido-basiques, lesquels d'oxydoréduction ?</div>
  <div class="q"><strong>A2.</strong> Écrire les demi-équations des couples HClO/Cl₂ et Cl₂/Cl⁻ en milieu acide, puis celle du couple ClO⁻/Cl⁻ en milieu basique.</div>
  <div class="exo-part">Partie B — Ne jamais mélanger eau de Javel et détartrant acide</div>
  <div class="q"><strong>B1.</strong> Sous quelle forme se trouve l'hypochlorite dans un milieu de pH inférieur à 6 ? Écrire la réaction entre cette espèce et les ions chlorure en milieu acide ; de quel type de réaction s'agit-il ? Calculer sa constante à pH 0 pour un HClO consommé.</div>
  <div class="q"><strong>B2.</strong> On verse par erreur 20 mL d'eau de Javel ([ClO⁻] = [Cl⁻] = 0,36 mol·L⁻¹) dans un excès de détartrant acide. Volume maximal de dichlore dégagé à 20 °C ?</div>
  <div class="exo-part">Partie C — Dosage iodométrique</div>
  <div class="statement">On dilue 10 fois l'eau de Javel. À \(V_0 = 10{,}0\ \text{mL}\) de solution diluée, on ajoute un excès d'iodure de potassium et d'acide éthanoïque (pH ≈ 4,5). Le diiode formé est titré par le thiosulfate de sodium à \(5{,}00\times10^{-2}\ \text{mol·L}^{-1}\) : équivalence à \(V_E = 14{,}4\ \text{mL}\). On admet que l'hypochlorite oxyde le thiosulfate en un mélange de produits de proportions mal définies.</div>
  <div class="q"><strong>C1.</strong> Écrire la réaction de HClO sur les ions iodure et calculer sa constante. Pourquoi l'iodure en excès ? Pourquoi un titrage indirect plutôt qu'un titrage direct par le thiosulfate ?</div>
  <div class="q"><strong>C2.</strong> Écrire la réaction de titrage, justifier qu'elle convient et proposer un moyen de repérer l'équivalence.</div>
  <div class="q"><strong>C3.</strong> Calculer la concentration en hypochlorite de l'eau de Javel.</div>
  <div class="exo-part">Partie D — Pourquoi l'eau de Javel est-elle basique ?</div>
  <div class="q"><strong>D1.</strong> Pour \(\text{pH} \lt 7{,}5\), exprimer en fonction du pH les potentiels des couples HClO/Cl₂ et Cl₂/Cl⁻, avec les conventions [HClO] = [Cl⁻] = 1 mol·L⁻¹ et \(P(\mathrm{Cl_2}) = 1\ \text{bar}\).</div>
  <div class="q"><strong>D2.</strong> En déduire le pH au-delà duquel le dichlore se dismute. Écrire cette dismutation en milieu basique et expliquer pourquoi on fabrique et conserve l'eau de Javel en milieu basique (pH ≈ 11,5).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Cl⁻ : −I ; Cl₂ : 0 ; HClO et ClO⁻ : +I. HClO/ClO⁻ est un couple acido-basique (même n.o., échange d'un proton) ; HClO/Cl₂ et Cl₂/Cl⁻ sont des couples d'oxydoréduction.</p>
    <p><strong>A2.</strong> 2 HClO + 2 H⁺ + 2 e⁻ = Cl₂ + 2 H₂O ; Cl₂ + 2 e⁻ = 2 Cl⁻ ; en milieu basique : ClO⁻ + 2 H⁺ + 2 e⁻ = Cl⁻ + H₂O devient, avec 2 HO⁻ de chaque côté, ClO⁻ + H₂O + 2 e⁻ = Cl⁻ + 2 HO⁻.</p>
    <p><strong>B1.</strong> Pour \(\text{pH} \lt \text{p}K_a - 1 = 6{,}5\), HClO prédomine (diagramme de prédominance acido-basique). HClO (n.o. +I) et Cl⁻ (−I) donnent Cl₂ (0) : c'est une <strong>médiamutation</strong>. Combinaison des demi-équations : 2 HClO + 2 Cl⁻ + 2 H⁺ = 2 Cl₂ + 2 H₂O, \(n = 2\), \(\log K^\circ = 2\times(1{,}63 - 1{,}36)/0{,}06 = 9\) ; pour un HClO : HClO + Cl⁻ + H⁺ = Cl₂ + H₂O, \(\log K^\circ = 4{,}5\). Favorisée, et d'autant plus que le milieu est acide (H⁺ est réactif).</p>
    <p><strong>B2.</strong> \(n(\mathrm{ClO^-}) = n(\mathrm{Cl^-})\) \(= 0{,}36\times0{,}020 = 7{,}2\ \text{mmol}\) ; avec l'acide en excès et \(K^\circ\) grand, au plus 7,2 mmol de Cl₂, soit \(7{,}2\times10^{-3}\times24{,}0 = 0{,}17\ \text{L}\) de gaz toxique.</p>
    <p><strong>C1.</strong> HClO + 2 I⁻ + H⁺ = Cl⁻ + I₂ + H₂O, \(n = 2\), \(\log K^\circ = 2\times(1{,}49 - 0{,}54)/0{,}06 = 31{,}7\) : totale. L'iodure en excès garantit que tout l'hypochlorite réagit, et donc qu'il se forme exactement une mole de I₂ par mole d'hypochlorite. Le titrage direct est impossible parce que la réaction hypochlorite-thiosulfate n'a pas une stœchiométrie unique ; on passe par le diiode, dont la réaction avec le thiosulfate est, elle, bien définie.</p>
    <p><strong>C2.</strong> I₂ + 2 S₂O₃²⁻ = 2 I⁻ + S₄O₆²⁻, \(\log K^\circ = 2\times(0{,}54 - 0{,}08)/0{,}06 = 15{,}3\) : unique, rapide et quasi totale. Près de l'équivalence (solution jaune pâle), on ajoute de l'empois d'amidon ou du thiodène : la solution devient bleue, et l'équivalence correspond à la disparition de cette teinte.</p>
    <p><strong>C3.</strong> \(n(\mathrm{S_2O_3^{2-}}) = 5{,}00\times10^{-2}\times14{,}4\) \(= 0{,}720\ \text{mmol}\), \(n(\mathrm{I_2}) = 0{,}360\ \text{mmol} = n(\mathrm{HClO})\) dans 10,0 mL de solution diluée : \(3{,}60\times10^{-2}\ \text{mol·L}^{-1}\), soit \([\mathrm{ClO^-}] = 0{,}360\ \text{mol·L}^{-1}\) dans l'eau de Javel, valeur cohérente avec la partie B.</p>
    <p><strong>D1.</strong> Formule de Nernst des deux couples, avec les conventions de l'énoncé :</p>
    <div class="formula">$$E_1 = 1{,}63 + \frac{0{,}06}{2}\log\frac{[\mathrm{HClO}]^2\,[\mathrm{H^+}]^2}{P(\mathrm{Cl_2})} = 1{,}63 - 0{,}06\,\text{pH}$$</div>
    <div class="formula">$$E_2 = 1{,}36 + 0{,}03\log\frac{P(\mathrm{Cl_2})}{[\mathrm{Cl^-}]^2} = 1{,}36\ \text{V}$$</div>
    <p>Le second ne dépend pas du pH.</p>
    <p><strong>D2.</strong> Cl₂ est l'oxydant du couple Cl₂/Cl⁻ et le réducteur du couple HClO/Cl₂ : il se dismute quand \(E_2 \gt E_1\), soit \(1{,}36 \gt 1{,}63 - 0{,}06\,\text{pH}\), c'est-à-dire \(\text{pH} \gt 4{,}5\). En milieu basique : Cl₂ + 2 HO⁻ = Cl⁻ + ClO⁻ + H₂O, qui est précisément la réaction de fabrication de l'eau de Javel (dichlore barboté dans la soude), avec Cl⁻ et ClO⁻ en quantités égales. À pH 11,5, l'hypochlorite est stable vis-à-vis de la médiamutation (il est présent à 99,99 % sous forme ClO⁻) ; si l'on acidifie au-dessous de pH 4,5, la médiamutation en Cl₂ redevient favorisée : c'est l'accident de la partie B.</p>
  </div>
</div>
