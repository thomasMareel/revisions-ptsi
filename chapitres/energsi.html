<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">L'énergétique aborde la dynamique par les <strong>énergies</strong> et les <strong>puissances</strong> : une seule équation scalaire, dans laquelle les liaisons parfaites n'apparaissent pas. C'est l'outil du concepteur qui choisit un moteur : quelle inertie voit-il, quel couple résistant, quelle puissance, quelles pertes ? Le programme de sciences industrielles place ces notions au semestre <strong>S3</strong> (début de 2ᵉ année). Ce chapitre en donne une <strong>introduction</strong> pour des mécanismes plans à un paramètre. Il s'appuie sur <a href="#dynsolide/cours">« Dynamique du solide »</a> (masse, centre d'inertie, moments d'inertie, principe fondamental) et sur <a href="#transm/cours">« Transmission de puissance »</a> (rapports de transmission, rendement d'un transmetteur) ; il est repris en 3D dans <a href="#energ2a/cours">« Énergétique des systèmes de solides »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités du programme, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Énergie cinétique</strong> d'un solide et d'un ensemble de solides par rapport à un référentiel galiléen (C2, S3) (§1).</li>
        <li><strong>Puissance d'une action mécanique extérieure</strong> à un solide ou à un ensemble de solides, dans son mouvement par rapport au repère galiléen (C2, S3) (§2).</li>
        <li><strong>Puissance intérieure</strong> à un ensemble de solides : liaisons parfaites, frottements, actionneur placé entre deux solides (C2, S3) (§3) ; énergie potentielle (§4).</li>
        <li><strong>Théorème de l'énergie cinétique</strong> : déterminer la loi de mouvement quand les efforts extérieurs sont connus (C2, S3) (§5, §7).</li>
        <li><strong>Inertie et masse équivalentes</strong> ; effort ou couple résistant ramené sur l'actionneur (C2, S3) (§6, §7).</li>
        <li><strong>Rendement en régime permanent</strong> (C2, S3) (§8) ; couple et puissance d'un moteur sur un cycle (§9).</li>
        <li><strong>Choix des équations</strong> : principe fondamental de la dynamique ou théorème de l'énergie cinétique (C1, S3) (§10).</li>
      </ul>
      <p>Vus en 2ᵉ année seulement (fin de chapitre) : la puissance comme comoment de deux torseurs en 3D, le rendement inverse et la réversibilité chiffrée, le couple thermique équivalent et le choix d'un moteur sur documentation (S4), l'équation de mouvement d'un mécanisme à inertie variable.</p>
    </div>
  </div>
  <div class="notice"><strong>Vu en avance (2ᵉ année)</strong> : tout ce chapitre relève du semestre S3 et n'est pas exigible en PTSI. Il est rangé en 1ʳᵉ année parce qu'on y a besoin, dès les premiers dossiers, de relier puissance, couple et vitesse (« Transmission de puissance », « Machine à courant continu »). La physique de 1ʳᵉ année établit le théorème de l'énergie cinétique pour un point (<a href="#energie/cours">« Énergie mécanique »</a>) et pour un solide en rotation (<a href="#mvtsolide/cours">« Mouvement d'un solide »</a>) ; ce chapitre l'étend aux mécanismes.</div>

<div class="course-section">
  <div class="sec-num">§1 · ÉNERGIE CINÉTIQUE D'UN SOLIDE ET D'UN ENSEMBLE</div>
  <h2>Ce que coûte un mouvement</h2>
  <div class="intro">L'énergie cinétique est l'énergie qu'il faut fournir pour amener un système du repos à son mouvement, et qu'il rendra (ou qu'il faudra dissiper) pour l'arrêter. Pour un mécanisme, c'est la somme des énergies de ses pièces, chacune calculée selon son mouvement.</div>
  <div class="def-box"><strong>Énergie cinétique.</strong> Pour un solide \(S\) en mouvement par rapport à \(\mathcal R_g\) :
    <div class="formula" data-nom="Énergie cinétique">$$E_c(S/\mathcal R_g) = \frac12\int_S \vec V(M/\mathcal R_g)^2\,\mathrm dm \qquad\text{(en J)}$$</div></div>
  <div class="prop-box"><strong>Les trois cas plans.</strong>
    <ul>
      <li><strong>Translation</strong> à la vitesse \(V\) : \(E_c = \tfrac12 m V^2\).</li>
      <li><strong>Rotation autour d'un axe fixe</strong> \(\Delta\) à la vitesse \(\omega\) : \(E_c = \tfrac12 J_\Delta\,\omega^2\).</li>
      <li><strong>Mouvement plan</strong> (théorème de König) : \(E_c = \tfrac12 m V(G)^2 + \tfrac12 J_G\,\omega^2\), translation de \(G\) plus rotation autour de \(G\).</li>
    </ul>
    Pour un ensemble de solides, les énergies cinétiques <strong>s'additionnent</strong> : \(E_c(\Sigma/\mathcal R_g) = \sum_i E_c(S_i/\mathcal R_g)\), chaque terme étant écrit dans le cas qui convient à la pièce.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Rotation autour d'un axe fixe : \(\tfrac12 J_\Delta\,\omega^2\)</span>
    <div class="content"><p>Un point à la distance \(r\) de l'axe va à la vitesse \(r\omega\). Donc \(E_c = \tfrac12\int_S r^2\omega^2\,\mathrm dm\), et comme \(\omega\) est la même pour tous les points, \(E_c = \tfrac12 J_\Delta\,\omega^2\), par définition du moment d'inertie (« Dynamique du solide », §2). La formule de König se démontre de même en écrivant \(\vec V(M) = \vec V(G) + \vec\Omega\wedge\overrightarrow{GM}\) : le terme croisé contient \(\int_S\overrightarrow{GM}\,\mathrm dm = \vec 0\).</p></div>
  </div>
  <div class="method-box"><strong>Exemple — l'énergie d'un volant d'inertie</strong>
    <ol>
      <li>Volant à jante de \(20\ \text{kg}\) et de rayon \(0{,}25\ \text{m}\) : \(J \approx 1{,}25\ \text{kg·m}^2\) (« Dynamique du solide », §2), lancé à 3 000 tr/min, soit \(\omega = 3\,000\times2\pi/60 \approx 314\ \text{rad/s}\).</li>
      <li>\(E_c = \tfrac12\times1{,}25\times314^2 \approx 6{,}2\cdot10^4\ \text{J}\), soit 62 kJ, ou \(0{,}017\ \text{kWh}\).</li>
      <li>C'est à peu près l'énergie qu'il faut pour monter une voiture de 1 200 kg de 5 m (59 kJ) : beaucoup pour une pièce de 20 kg, peu pour stocker l'électricité d'une maison. Les volants servent surtout à <strong>lisser</strong> une vitesse (presses, moteurs à pistons, §5).</li>
    </ol></div>
  <div class="method-box"><strong>Exemple — un chariot et ses roues</strong>
    <ol>
      <li>Chariot de manutention : 248 kg en tout, dont quatre roues pleines de \(2\ \text{kg}\) et de rayon \(R = 0{,}10\ \text{m}\) (\(J = \tfrac12\times2\times0{,}1^2 = 0{,}01\ \text{kg·m}^2\)), poussé à \(1{,}5\ \text{m/s}\) ; les roues roulent sans glisser (\(\omega = v/R = 15\ \text{rad/s}\)).</li>
      <li>Par König, chaque roue a l'énergie \(\tfrac12 m_r v^2 + \tfrac12 J\omega^2\) ; la translation de toutes les pièces est comptée dans \(\tfrac12\times248\times1{,}5^2 = 279\ \text{J}\).</li>
      <li>Rotation des quatre roues : \(4\times\tfrac12\times0{,}01\times15^2 = 4{,}5\ \text{J}\), soit 1,6 % : négligeable ici. Il en va autrement dès qu'une pièce tourne vite : le rotor d'un moteur placé derrière un réducteur peut peser plus lourd que toute la charge (§6).</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : oublier la translation d'une pièce qui tourne (une roue qui roule a les deux énergies), ou compter deux fois la masse des roues, une fois dans la masse totale et une fois dans un terme \(\tfrac12 m_r v^2\) à part.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · PUISSANCE D'UNE ACTION MÉCANIQUE EXTÉRIEURE</div>
  <h2>Le débit d'énergie apporté à un solide</h2>
  <div class="intro">La puissance mesure l'énergie qu'une action mécanique apporte, à chaque instant, à un solide en mouvement. Elle est positive si l'action est <strong>motrice</strong> (elle pousse dans le sens du mouvement), négative si elle est <strong>résistante</strong>.</div>
  <div class="prop-box"><strong>Puissance d'une force, d'un couple.</strong> Dans le mouvement de \(S\) par rapport à \(\mathcal R_g\) :
    <ul>
      <li>force \(\vec F\) appliquée au point \(P\) de \(S\) : \(\mathcal P = \vec F\cdot\vec V(P, S/\mathcal R_g)\) ;</li>
      <li>couple \(\vec C\) (action de résultante nulle) : \(\mathcal P = \vec C\cdot\vec\Omega(S/\mathcal R_g)\), soit \(C\,\omega\) autour d'un axe ;</li>
      <li>action quelconque, de torseur \(\{\vec R\ ;\ \vec M(A)\}_A\) : on écrit le torseur et le torseur cinématique <strong>au même point</strong> \(A\), quelconque :</li>
    </ul>
    <div class="formula" data-nom="Puissance d'une action extérieure">$$\mathcal P(\bar S\to S/\mathcal R_g) = \vec R(\bar S\to S)\cdot\vec V(A, S/\mathcal R_g) + \vec M(A, \bar S\to S)\cdot\vec\Omega(S/\mathcal R_g)$$</div>
    Unité : le watt (W). Ce produit des deux torseurs s'appelle leur <strong>comoment</strong> ; il ne dépend pas du point choisi.</div>
  <div class="prop-box"><strong>Cas à connaître.</strong> Poids (\(\vec z\) vertical ascendant) : \(\mathcal P = -mg\,\dot z_G\). Moteur dont le stator est fixé au bâti : \(\mathcal P = C_m\,\omega_m\). Vérin dont le corps est fixé au bâti : \(\mathcal P = F\,v\), et pour un vérin hydraulique ou pneumatique \(F v = p\,S\,v = p\,Q_v\) (pression × débit volumique). Solide en rotation autour d'un axe fixe : seul le moment sur l'axe travaille, \(\mathcal P = M_\Delta\,\omega\).</div>
  <div class="def-box"><strong>Travail.</strong> Entre deux instants, \(W_{1\to2} = \int_{t_1}^{t_2}\mathcal P\,\mathrm dt\), en joules. Couple constant sur une rotation \(\Delta\theta\) : \(W = C\,\Delta\theta\). Effort constant sur une translation rectiligne : \(W = \vec F\cdot\overrightarrow{\Delta x}\). Poids : \(W = -mg\,(z_{G2} - z_{G1})\), qui ne dépend que des altitudes.</div>
  <div class="method-box"><strong>Exemple — la puissance du poids d'une barrière levante</strong>
    <ol>
      <li>Lisse de parking : \(m = 6\ \text{kg}\), centre d'inertie à \(a = 1{,}8\ \text{m}\) de l'axe horizontal du pivot ; \(\theta\) est l'angle de la lisse avec l'horizontale. À l'instant étudié, \(\theta = 30°\) et la lisse monte à \(\dot\theta = 0{,}4\ \text{rad/s}\).</li>
      <li>Altitude de \(G\) : \(z_G = a\sin\theta\), donc \(\dot z_G = a\,\dot\theta\cos\theta\).</li>
      <li>\(\mathcal P = -mg\,a\,\dot\theta\cos\theta\), soit \(-6\times9{,}81\times1{,}8\times0{,}4\times0{,}866 \approx -36{,}7\ \text{W}\) : le poids est résistant pendant la montée ; le moteur doit fournir au moins 36,7 W à cet instant, plus de quoi accélérer la lisse.</li>
      <li>Même résultat par le moment : le poids a pour moment sur l'axe \(-mga\cos\theta\), qui multiplié par \(\dot\theta\) redonne \(\mathcal P\).</li>
    </ol></div>
  <p><strong>Ordre de grandeur</strong> : un vérin pneumatique de diamètre 50 mm sous 6 bar développe \(F = p\,S = 6\cdot10^5\times\pi\times0{,}025^2 \approx 1\,180\ \text{N}\) ; sortant à \(0{,}3\ \text{m/s}\), il fournit environ 350 W.</p>
  <div class="notice"><strong>Erreur classique</strong> : calculer \(\vec R\cdot\vec V(B) + \vec M(A)\cdot\vec\Omega\) avec deux points différents. Les deux torseurs doivent être écrits au même point. Autre piège : laisser une vitesse en tr/min ; \(\omega = \pi N/30\) en rad/s.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PUISSANCE DES ACTIONS INTÉRIEURES</div>
  <h2>Ce que les liaisons consomment</h2>
  <div class="intro">Dans un ensemble de solides, chaque liaison transmet des actions mutuelles. Elles disparaissent du principe fondamental appliqué à l'ensemble (actions réciproques), mais pas forcément du bilan d'énergie : un frottement, un ressort ou un moteur placé entre deux pièces mobiles consomment ou fournissent de la puissance.</div>
  <div class="prop-box"><strong>Puissance des actions mutuelles entre deux solides.</strong> Pour deux solides \(S_1\) et \(S_2\) en liaison, la somme des puissances des actions de 1 sur 2 et de 2 sur 1 ne dépend que de leur mouvement <strong>relatif</strong> :
    <div class="formula" data-nom="Puissance des actions mutuelles">$$\mathcal P(S_1\leftrightarrow S_2) = \vec R(1\to2)\cdot\vec V(A, 2/1) + \vec M(A, 1\to2)\cdot\vec\Omega(2/1)$$</div>
    La puissance intérieure d'un ensemble est la somme sur toutes ses liaisons. Elle est nulle pour un solide seul (indéformable) et la même dans tous les référentiels.</div>
  <div class="prop-box"><strong>Liaisons parfaites et liaisons réelles.</strong>
    <ul>
      <li><strong>Liaison parfaite</strong> : par définition, la puissance de ses actions mutuelles est nulle pour tout mouvement qu'elle permet (pivot sans frottement : moment nul sur l'axe ; glissière sans frottement : effort nul selon la direction).</li>
      <li><strong>Frottement sec avec glissement</strong> (vitesse de glissement \(V_g\)) : \(\mathcal P = -f\,N\,V_g \leq 0\) ; dans un pivot, couple de frottement constant : \(\mathcal P = -C_f\,|\omega_{2/1}|\).</li>
      <li><strong>Frottement visqueux</strong> : \(\mathcal P = -f_v\,\omega_{2/1}^2\) en rotation, \(-c\,v_{2/1}^2\) en translation.</li>
      <li><strong>Roulement sans glissement</strong> : le point de contact a une vitesse relative nulle, l'action de contact ne travaille pas. L'adhérence permet le mouvement sans rien dissiper ; seule la résistance au roulement, faible, consomme (« Statique », §12).</li>
      <li><strong>Actionneur entre deux solides de l'ensemble</strong> : moteur dont le stator est sur \(S_1\) et le rotor sur \(S_2\), \(\mathcal P = C_m\,\omega(2/1)\) ; vérin entre deux bras, \(\mathcal P = F\,v_{\text{tige/corps}}\).</li>
    </ul></div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi seul le mouvement relatif compte</span>
    <div class="content"><p>Par les actions réciproques, \(\vec R(2\to1) = -\vec R(1\to2)\) et \(\vec M(A, 2\to1) = -\vec M(A, 1\to2)\). En ajoutant les deux puissances écrites au même point \(A\) :</p>
    <div class="formula">$$\mathcal P(S_1\leftrightarrow S_2) = \vec R(1\to2)\cdot\big(\vec V(A, 2/\mathcal R) - \vec V(A, 1/\mathcal R)\big) + \vec M(A, 1\to2)\cdot\big(\vec\Omega(2/\mathcal R) - \vec\Omega(1/\mathcal R)\big)$$</div>
    <p>et la composition des mouvements (« Cinématique », §5) donne \(\vec V(A, 2/\mathcal R) - \vec V(A, 1/\mathcal R) = \vec V(A, 2/1)\) et \(\vec\Omega(2/\mathcal R) - \vec\Omega(1/\mathcal R) = \vec\Omega(2/1)\).</p></div>
  </div>
  <div class="method-box"><strong>Exemple — ce que dissipent les freins d'un VTT en descente</strong>
    <ol>
      <li>Cycliste et VTT : \(90\ \text{kg}\), descente à vitesse constante \(v = 5\ \text{m/s}\) (18 km/h) sur une pente de 15 % (\(\sin\alpha \approx 0{,}148\)). On néglige l'air et la résistance au roulement.</li>
      <li>On isole {cycliste, vélo}. Vitesse constante, donc énergie cinétique constante : la somme des puissances est nulle (§5).</li>
      <li>Le poids fournit \(mg\,v\sin\alpha \approx 90\times9{,}81\times5\times0{,}148 \approx 655\ \text{W}\). Les roues roulent sans glisser sur le sol : l'action du sol ne travaille pas. Il reste les patins (ou plaquettes) qui frottent sur les jantes (ou disques) : une puissance intérieure de \(-655\ \text{W}\), transformée en chaleur. D'où l'échauffement des disques dans les longues descentes.</li>
    </ol></div>
  <div class="method-box"><strong>Exemple — le moteur du coude d'un robot</strong>
    <ol>
      <li>Robot à deux bras : le bras 1 tourne par rapport au bâti 0 à \(\omega(1/0) = 1\ \text{rad/s}\) ; le moteur du coude, dont le stator est fixé sur le bras 1, entraîne le bras 2 avec un couple \(C = 5\ \text{N·m}\), à \(\omega(2/1) = 2\ \text{rad/s}\).</li>
      <li>Pour l'ensemble {bras 1, bras 2}, ce moteur est intérieur : \(\mathcal P = C\,\omega(2/1) = 10\ \text{W}\).</li>
      <li>Écrire \(C\,\omega(2/0) = 5\times3 = 15\ \text{W}\) serait faux : la vitesse qui compte est celle du rotor par rapport au stator.</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : compter \(-f N v\) pour une roue qui roule sans glisser. Sans glissement, le frottement sec ne dissipe rien : il rend seulement l'adhérence possible.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉNERGIE POTENTIELLE ET ÉNERGIE MÉCANIQUE</div>
  <h2>Les actions qui stockent et restituent</h2>
  <div class="intro">Le poids et les ressorts ne dissipent rien : ils stockent l'énergie, puis la rendent. Leur puissance est la dérivée, au signe près, d'une fonction de la seule position, l'énergie potentielle. On les traite une fois pour toutes, sans recalculer leur puissance à chaque instant.</div>
  <div class="def-box"><strong>Énergie potentielle.</strong> Une action dérive d'une énergie potentielle \(E_p\), fonction de la position seule (définie à une constante près), si sa puissance s'écrit \(\mathcal P = -\dfrac{\mathrm dE_p}{\mathrm dt}\).
    <ul>
      <li>Pesanteur, \(\vec z\) vertical ascendant : \(E_p = m g\,z_G\).</li>
      <li>Ressort de traction-compression de raideur \(k\) (N/m), de longueur libre \(\ell_0\) : \(E_p = \tfrac12 k\,(\ell - \ell_0)^2\).</li>
      <li>Ressort de torsion de raideur \(k_t\) (N·m/rad), d'angle libre \(\theta_0\) : \(E_p = \tfrac12 k_t\,(\theta - \theta_0)^2\).</li>
    </ul></div>
  <div class="prop-box"><strong>Énergie mécanique.</strong> \(E_m = E_c + E_p\). Elle se <strong>conserve</strong> si toutes les autres actions ont une puissance nulle : liaisons parfaites, ni moteur, ni frein, ni frottement. Sinon, sa variation est égale au travail des actions qui ne dérivent pas d'une énergie potentielle (§5).</div>

</figure>
  <div class="method-box"><strong>Exemple — l'essai de résilience au mouton-pendule</strong>
    <ol>
      <li>Pour mesurer l'énergie qu'absorbe la rupture d'un matériau (sa résilience), on casse une éprouvette entaillée avec un marteau pendulaire : \(m = 20\ \text{kg}\), centre d'inertie à \(a = 0{,}8\ \text{m}\) de l'axe. Lâché sans vitesse à \(\theta_0 = 140°\) de la verticale descendante, il remonte après le choc jusqu'à \(\theta_1 = 60°\).</li>
      <li>Altitude de \(G\) au-dessus de l'axe : \(-a\cos\theta\). Énergie potentielle disponible au départ, mesurée depuis le point bas : \(mg\,a\,(1 - \cos140°) \approx 20\times9{,}81\times0{,}8\times1{,}766 \approx 277\ \text{J}\).</li>
      <li>Entre le départ et la fin, \(E_c\) est nulle aux deux instants : l'énergie absorbée par la rupture vaut \(mg\,a\,(\cos60° - \cos140°) \approx 156{,}96\times1{,}266 \approx 199\ \text{J}\) (on néglige le frottement de l'axe et l'air, ou on les mesure par un lancer à vide).</li>
      <li>Vitesse du marteau au choc (assimilé à une masse ponctuelle) : \(v = \sqrt{2ga\,(1 - \cos140°)} \approx 5{,}3\ \text{m/s}\), l'ordre de grandeur normalisé de ces machines.</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : écrire la conservation de l'énergie mécanique pour un système qui contient un moteur, un frein ou un frottement. On revient alors au théorème de l'énergie cinétique, avec la puissance de ces actions.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · THÉORÈME DE L'ÉNERGIE CINÉTIQUE</div>
  <h2>Une équation qui ignore les liaisons parfaites</h2>
  <div class="intro">Le théorème de l'énergie cinétique (TEC), ou théorème de l'énergie-puissance, relie la variation de l'énergie cinétique à la puissance de toutes les actions. Ce n'est pas un principe nouveau : c'est une conséquence du principe fondamental. Son intérêt est pratique : les liaisons parfaites n'y apparaissent pas.</div>
  <div class="prop-box"><strong>Théorème de l'énergie cinétique.</strong> Dans un référentiel galiléen \(\mathcal R_g\), pour un solide :
    <div class="formula" data-nom="Théorème de l'énergie cinétique (solide)">$$\frac{\mathrm d}{\mathrm dt}E_c(S/\mathcal R_g) = \mathcal P(\bar S\to S/\mathcal R_g)$$</div>
    et pour un ensemble de solides \(\Sigma\) :
    <div class="formula" data-nom="Théorème de l'énergie cinétique (ensemble)">$$\frac{\mathrm d}{\mathrm dt}E_c(\Sigma/\mathcal R_g) = \mathcal P(\bar\Sigma\to\Sigma/\mathcal R_g) + \mathcal P_{int}(\Sigma)$$</div>
    Forme intégrée, entre deux instants : \(E_{c2} - E_{c1} = W_{ext} + W_{int}\). En regroupant les actions qui dérivent d'une énergie potentielle : \(\Delta(E_c + E_p) = W\) des autres actions (moteurs, freins, frottements).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le TEC d'un solide en rotation, tiré du principe fondamental</span>
    <div class="content"><p>Pour un solide en rotation autour d'un axe fixe, le principe fondamental projeté sur l'axe donne \(J_\Delta\,\dot\omega = M_\Delta\) (« Dynamique du solide », §8). On multiplie par \(\omega\) : \(J_\Delta\,\omega\,\dot\omega = \dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12 J_\Delta\,\omega^2\right) = M_\Delta\,\omega\), qui est la puissance des actions extérieures. En translation, \(m\,\dot v = F\) multiplié par \(v\) donne de même \(\dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12 m v^2\right) = F v\). Pour un ensemble, on écrit le théorème pour chaque solide et on additionne : les actions mutuelles laissent leur puissance \(\mathcal P(S_i\leftrightarrow S_j)\), nulle seulement si la liaison est parfaite. Démonstration générale en 3D : « Énergétique des systèmes de solides », §5.</p></div>
  </div>
  <div class="prop-box"><strong>Portée du théorème.</strong> (1) Il ne fournit qu'<strong>une</strong> équation scalaire, qui n'est pas indépendante de celles du principe fondamental : il suffit pour un mécanisme à un paramètre, pas au-delà. (2) Les inconnues des liaisons parfaites n'y figurent pas : on ne peut pas les calculer avec lui. (3) Les puissances extérieures se calculent dans un référentiel galiléen.</div>
  <div class="method-box"><strong>Exemple — forme intégrée : la presse à volant</strong>
    <ol>
      <li>Une presse mécanique accumule l'énergie dans un volant (\(J = 15\ \text{kg·m}^2\)) qui tourne à 240 tr/min (\(\omega_0 \approx 25{,}1\ \text{rad/s}\)). Un coup de presse prélève \(W = 2{,}4\ \text{kJ}\) en un temps très court, pendant lequel le moteur n'apporte presque rien.</li>
      <li>TEC intégré sur le volant pendant la frappe : \(\tfrac12 J\omega_1^2 - \tfrac12 J\omega_0^2 = -W\), d'où \(\omega_1^2 = \omega_0^2 - 2W/J \approx 631{,}7 - 320 = 311{,}7\).</li>
      <li>\(\omega_1 \approx 17{,}7\ \text{rad/s}\) (169 tr/min) : la vitesse chute de 30 % (la moitié de l'énergie du volant a été prélevée). Le moteur de 1,5 kW recharge le volant en \(2{,}4/1{,}5 = 1{,}6\ \text{s}\) environ (pertes négligées). Sans volant, il faudrait un moteur capable de fournir 2,4 kJ en une fraction de seconde : plusieurs dizaines de kilowatts.</li>
    </ol></div>
  <div class="method-box"><strong>Exemple — forme dérivée : équation du mouvement d'un treuil</strong>
    <ol>
      <li>Tambour de treuil (\(J_t = 0{,}4\ \text{kg·m}^2\), rayon \(R = 0{,}1\ \text{m}\)) entraîné par un couple constant \(C = 160\ \text{N·m}\) ; il soulève une charge de 150 kg par un câble inextensible ; pivot parfait.</li>
      <li>On isole {tambour, câble, charge} : \(E_c = \tfrac12\left(J_t + mR^2\right)\omega^2\) avec \(v = R\omega\). Puissances : couple \(C\omega\), poids \(-mgR\,\omega\) ; la tension du câble est intérieure et ne travaille pas (câble inextensible qui ne glisse pas).</li>
      <li>TEC, puis division par \(\omega\) : \((J_t + mR^2)\,\dot\omega = C - mgR\), soit \(\dot\omega = \dfrac{160 - 147{,}2}{0{,}4 + 1{,}5} \approx 6{,}76\ \text{rad/s}^2\) : la charge monte avec une accélération de \(0{,}68\ \text{m/s}^2\).</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : écrire le TEC avec la seule puissance des actions extérieures pour un ensemble qui contient un frottement entre deux pièces mobiles ou un moteur entre deux bras. La puissance intérieure est nulle pour un solide, pas pour un ensemble.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · INERTIE ET MASSE ÉQUIVALENTES</div>
  <h2>Voir tout le mécanisme depuis l'arbre moteur</h2>
  <div class="intro">Pour choisir un moteur, on veut voir le mécanisme « depuis son arbre » : une seule inertie à accélérer. Dans un mécanisme à un paramètre, toutes les vitesses sont proportionnelles à celle du moteur ; l'énergie cinétique de l'ensemble se met sous la forme d'une seule inertie, dite <strong>équivalente</strong> ou <strong>ramenée</strong>.</div>
  <div class="def-box"><strong>Inertie équivalente.</strong> Si toutes les vitesses s'expriment en fonction de la vitesse \(\omega_m\) de l'arbre moteur, on pose
    <div class="formula" data-nom="Inertie équivalente">$$E_c(\Sigma/\mathcal R_g) = \frac12 J_{eq}\,\omega_m^2 \qquad J_{eq} = \sum_i J_i\left(\frac{\omega_i}{\omega_m}\right)^2 + \sum_k m_k\left(\frac{V_k}{\omega_m}\right)^2$$</div>
    (pièces en rotation autour d'axes fixes ou en translation ; sinon, König). Pour un actionneur linéaire de vitesse \(v\), on définit de même une <strong>masse équivalente</strong> : \(E_c = \tfrac12 M_{eq}\,v^2\).</div>
  <table>
    <tr><th>Élément après une transmission de rapport \(i = \omega_s/\omega_m\)</th><th>Vitesse</th><th>Contribution à \(J_{eq}\)</th></tr>
    <tr><td>pièce tournante d'inertie \(J_s\) sur l'arbre de sortie</td><td>\(\omega_s = i\,\omega_m\)</td><td>\(J_s\,i^2\)</td></tr>
    <tr><td>masse \(m\) entraînée par un tambour, une poulie ou un pignon de rayon \(R\) sur l'arbre de sortie</td><td>\(v = R\,i\,\omega_m\)</td><td>\(m\,(R\,i)^2\)</td></tr>
    <tr><td>masse \(m\) entraînée par une vis de pas \(p\) tournant à \(i\,\omega_m\)</td><td>\(v = \dfrac{p\,i}{2\pi}\,\omega_m\)</td><td>\(m\left(\dfrac{p\,i}{2\pi}\right)^2\)</td></tr>
  </table>
  <p>Une inertie est multipliée par le <strong>carré</strong> du rapport : un réducteur (\(i \lt 1\)) écrase les inerties de la charge. Réciproquement, vu de la charge, le moteur est démultiplié : son rotor devient une masse équivalente \(J_m/(R\,i)^2\), parfois énorme.</p>

      <li>Les trois termes valent \(1{,}2\cdot10^{-3}\), \(0{,}2\cdot10^{-3}\) et \(3{,}75\cdot10^{-3}\ \text{kg·m}^2\), d'où \(J_{eq} \approx 5{,}15\cdot10^{-3}\ \text{kg·m}^2\) : charge 73 %, rotor 23 %, tambour 4 %.</li>
      <li>Vu de la bande, le rotor de quelques kilogrammes équivaut à une masse \(J_m/(R\,i)^2 = 1{,}2\cdot10^{-3}/(0{,}005)^2 = 48\ \text{kg}\) à mettre en mouvement avec les colis.</li>
    </ol></div>
  <h3>Mécanisme à inertie variable</h3>
  <p>Si le rapport des vitesses dépend de la position (bielle-manivelle, came), l'inertie équivalente dépend de l'angle du moteur : \(J_{eq}(\theta)\). Pour un compresseur ou un moteur à pistons, \(J_{eq}(\theta) = J_1 + m_p\left(\dfrac{\mathrm dx}{\mathrm d\theta}\right)^2\), où \(x(\theta)\) est la position du piston, donnée par la fermeture géométrique (« Liaisons », §8).</p>

<div class="course-section">
  <div class="sec-num">§7 · COUPLE RÉSISTANT RAMENÉ ET ÉQUATION DU MOUVEMENT</div>
  <h2>Le modèle équivalent d'un axe motorisé</h2>
  <div class="intro">Il reste à ramener sur l'arbre moteur les actions de la charge (poids, frottements, efforts de travail). On le fait par une égalité de puissance : le mécanisme se réduit alors à une inertie, un couple moteur et un couple résistant, et le TEC donne l'équation du mouvement.</div>
  <div class="def-box"><strong>Couple résistant ramené.</strong> La somme des puissances de toutes les actions autres que le moteur, extérieures et intérieures, s'écrit \(-C_{r,eq}\,\omega_m\) (transmission parfaite ; les pertes au §8). Effort \(F\) sur une masse entraînée par un tambour de rayon \(R\) : \(R\,i\,F\) ; couple \(C_s\) sur l'arbre de sortie : \(i\,C_s\) ; effort \(F\) sur l'écrou d'une vis de pas \(p\) : \(\dfrac{p\,i}{2\pi}\,F\).</div>
  <div class="prop-box"><strong>Équation du mouvement</strong> (inertie équivalente constante). Le TEC, \(J_{eq}\,\omega_m\,\dot\omega_m = C_m\,\omega_m - C_{r,eq}\,\omega_m\), donne après division par \(\omega_m\) :
    <div class="formula" data-nom="Modèle équivalent ramené au moteur">$$J_{eq}\,\frac{\mathrm d\omega_m}{\mathrm dt} = C_m - C_{r,eq}$$</div>
    Avec un actionneur linéaire : \(M_{eq}\,\dfrac{\mathrm dv}{\mathrm dt} = F_m - F_{r,eq}\).</div>
  <p>Si le couple moteur dépend de la vitesse, cette équation est une équation différentielle. Pour un moteur à courant continu alimenté sous tension constante (<a href="#mcc/cours">« Machine à courant continu »</a>), la caractéristique est une droite \(C_m = C_0 - b\,\omega_m\) : le mouvement est du premier ordre, de constante de temps \(\tau = J_{eq}/b\), et tend vers la vitesse où \(C_m = C_{r,eq}\).</p>
  <div class="method-box"><strong>Exemple — démarrage d'un portail coulissant</strong>
    <ol>
      <li>Portail de 350 kg sur galets, entraîné par un pignon (rayon \(R = 25\ \text{mm}\)) engrenant sur une crémaillère ; réducteur \(i = 1/40\) ; rotor \(J_m = 4\cdot10^{-4}\ \text{kg·m}^2\). Résistance au roulement des galets : \(F_r = 60\ \text{N}\). Moteur : \(C_m = C_0 - b\,\omega_m\) avec \(C_0 = 0{,}40\ \text{N·m}\) et \(b = 1{,}25\cdot10^{-3}\ \text{N·m·s/rad}\). Transmission parfaite.</li>
      <li>\(R\,i = 6{,}25\cdot10^{-4}\ \text{m}\) ; <div class="formula">$$J_{eq} = 4\cdot10^{-4} + 350\times\left(6{,}25\cdot10^{-4}\right)^2 \approx 4\cdot10^{-4} + 1{,}37\cdot10^{-4} \approx 5{,}37\cdot10^{-4}\ \text{kg·m}^2$$</div> Le rotor pèse les trois quarts de l'inertie : la réduction est si forte que le portail, vu du moteur, est léger.</li>
      <li>\(C_{r,eq} = F_r\,R\,i = 60\times6{,}25\cdot10^{-4} = 0{,}0375\ \text{N·m}\).</li>
      <li>Équation : \(J_{eq}\,\dot\omega_m + b\,\omega_m = C_0 - C_{r,eq}\). Vitesse finale \(\omega_\infty = 0{,}3625/1{,}25\cdot10^{-3} = 290\ \text{rad/s}\) (2 770 tr/min), soit \(v = R\,i\,\omega_\infty \approx 0{,}18\ \text{m/s}\) ; constante de temps \(\tau = J_{eq}/b \approx 0{,}43\ \text{s}\).</li>
      <li>Accélération du portail au démarrage : \(R\,i\,(C_0 - C_{r,eq})/J_{eq} \approx 0{,}42\ \text{m/s}^2\) ; il atteint 95 % de sa vitesse au bout de \(3\tau \approx 1{,}3\ \text{s}\).</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : ramener l'effort de la charge avec le carré du rapport, comme une inertie. Une inertie se ramène avec \((R\,i)^2\), un effort avec \(R\,i\) : ce sont l'énergie et la puissance qui doivent être conservées.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · RENDEMENT EN RÉGIME PERMANENT</div>
  <h2>Pertes et puissance absorbée</h2>
  <div class="intro">Aucun constituant réel n'est parfait : engrènements, roulements, joints, enroulements dissipent une partie de la puissance qui les traverse. Plutôt que de modéliser chaque frottement, on résume les pertes d'un constituant par son <strong>rendement</strong>, mesuré en régime permanent et donné par la documentation.</div>
  <div class="def-box"><strong>Rendement.</strong> En régime permanent, un constituant reçoit la puissance \(\mathcal P_e \gt 0\), en restitue \(\mathcal P_s\) et dissipe \(\mathcal P_{pertes} = \mathcal P_e - \mathcal P_s \geq 0\) :
    <div class="formula" data-nom="Rendement">$$\eta = \frac{\mathcal P_s}{\mathcal P_e} = 1 - \frac{\mathcal P_{pertes}}{\mathcal P_e}$$</div>
    Pour des constituants en série, les rendements se multiplient : \(\eta = \eta_1\,\eta_2\cdots\eta_n\). Pour un réducteur de rapport \(i\) : \(C_s\,\omega_s = \eta\,C_e\,\omega_e\), donc \(C_s = \eta\,C_e/i\).</div>
  <p><strong>Pourquoi « en régime permanent » ?</strong> Pendant un démarrage, une partie de la puissance reçue est stockée en énergie cinétique, puis rendue au freinage. Le rapport instantané \(\mathcal P_s/\mathcal P_e\) ne mesure alors plus les pertes (il peut même dépasser 1 au freinage). On raisonne sur un régime établi, ou sur un cycle complet.</p>

  <p><strong>Sens du flux de puissance.</strong> Le rendement s'applique dans le sens où la puissance circule. Quand la charge résiste, le moteur doit fournir \(C_m = C_{r,eq}/\eta\) en régime permanent. Quand elle entraîne (charge qui descend), c'est elle qui fournit la puissance et le moteur freine ; on utilise alors le rendement inverse \(\eta'\), qui peut être nul ou négatif pour un transmetteur irréversible (« Transmission de puissance », §7 et §8 ; étude complète en 2ᵉ année).</p>

<div class="course-section">
  <div class="sec-num">§9 · CYCLE DE FONCTIONNEMENT : COUPLE ET PUISSANCE DU MOTEUR</div>
  <h2>Ce que le moteur doit fournir, phase par phase</h2>
  <div class="intro">Le cahier des charges impose une loi de mouvement, souvent en trapèze de vitesse (« Dynamique du solide », §9). Le modèle équivalent (§6, §7) et le rendement (§8) donnent le couple moteur dans chaque phase, puis la puissance : on en déduit le couple crête, la vitesse maximale et la puissance crête que le moteur doit tenir.</div>
  <div class="prop-box"><strong>Couple moteur sur un cycle.</strong> Avec \(J_{amont}\) l'inertie des pièces placées avant la transmission (rotor, souvent arbre et vis) et \(J_{aval}\) l'inertie ramenée des pièces placées après, et tant que la puissance circule du moteur vers la charge :
    <div class="formula" data-nom="Couple moteur avec pertes">$$C_m = J_{amont}\,\dot\omega_m + \frac{J_{aval}\,\dot\omega_m + C_{r,eq}}{\eta}$$</div>
    Les pertes ne portent que sur la puissance qui traverse la transmission. Transmission parfaite : \(C_m = J_{eq}\,\dot\omega_m + C_{r,eq}\). La puissance moteur vaut \(\mathcal P_m = C_m\,\omega_m\) : elle culmine en fin d'accélération.</div>
  <div class="method-box"><strong>Exemple — élévateur à vis à billes</strong>
    <ol>
      <li>Un élévateur monte une charge de \(m = 80\ \text{kg}\) de \(0{,}3\ \text{m}\) en \(1{,}0\ \text{s}\), loi en trapèze avec \(t_a = t_d = 0{,}2\ \text{s}\). Vis à billes de pas \(p = 10\ \text{mm}\), entraînée directement (\(i = 1\)), de rendement \(\eta = 0{,}9\) ; rotor et vis : \(J_{amont} = 4{,}5\cdot10^{-4}\ \text{kg·m}^2\).</li>
      <li>Cinématique : \(v_{max} = 0{,}3/(1 - 0{,}2) = 0{,}375\ \text{m/s}\), d'où \(\omega_{max} = 2\pi v_{max}/p \approx 236\ \text{rad/s}\) (2 250 tr/min) et \(\dot\omega_m = 236/0{,}2 \approx 1\,178\ \text{rad/s}^2\).</li>
      <li>Modèle ramené : \(J_{aval} = m\,(p/2\pi)^2 \approx 2{,}03\cdot10^{-4}\ \text{kg·m}^2\) ; poids ramené \(C_{r,eq} = mg\,p/2\pi \approx 1{,}25\ \text{N·m}\).</li>
      <li>Accélération :

<div class="course-section">
  <div class="sec-num">§10 · THÉORÈME DE L'ÉNERGIE CINÉTIQUE OU PRINCIPE FONDAMENTAL ?</div>
  <h2>Deux outils pour un même problème</h2>
  <div class="intro">Le TEC et le principe fondamental décrivent la même physique. Le choix est une affaire d'efficacité : obtenir l'équation cherchée avec le moins d'inconnues parasites, après avoir tracé le graphe des liaisons et repéré les paramètres du mouvement.</div>
  <table>
    <tr><th>Je cherche…</th><th>Outil conseillé</th><th>Pourquoi</th></tr>
    <tr><td>la loi de mouvement d'un mécanisme à un paramètre, liaisons parfaites</td><td>TEC sur tout le mécanisme</td><td>aucune inconnue de liaison n'apparaît</td></tr>
    <tr><td>le couple ou l'effort moteur pour un mouvement imposé</td><td>TEC, ou modèle équivalent (§7)</td><td>une équation pour une inconnue</td></tr>
    <tr><td>une vitesse atteinte après un déplacement, une distance d'arrêt</td><td>TEC intégré</td><td>inutile de connaître la durée</td></tr>
    <tr><td>une action dans une liaison, la tension d'un câble</td><td>principe fondamental sur l'isolement adapté</td><td>une liaison parfaite ne travaille pas : le TEC ne la voit pas</td></tr>
    <tr><td>le mouvement d'un système à plusieurs paramètres</td><td>principe fondamental (une équation par paramètre)</td><td>le TEC ne donne qu'une équation</td></tr>
    <tr><td>un mouvement avec frottement sec qui glisse</td><td>principe fondamental pour l'effort normal, puis TEC</td><td>la puissance perdue dépend de \(N\)</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — le cylindre qui roule sur un plan incliné</strong>
    <ol>
      <li>Cylindre plein (\(J_G = \tfrac12 mR^2\)) qui roule sans glisser sur un plan incliné d'un angle \(\alpha\), lâché sans vitesse (« Dynamique du solide », §10).</li>
      <li>TEC : \(E_c = \tfrac12 m v^2 + \tfrac12\cdot\tfrac12 mR^2\,(v/R)^2 = \tfrac34 m v^2\) (König). Le poids fournit \(mg\,v\sin\alpha\) ; l'action du plan ne travaille pas (roulement sans glissement).</li>
      <li>\(\tfrac32 m v\,\dot v = mg\,v\sin\alpha\), d'où \(\dot v = \tfrac23 g\sin\alpha\), soit \(3{,}27\ \text{m/s}^2\) pour \(\alpha = 30°\) : trois lignes, sans inconnue de contact.</li>
      <li>Mais pour savoir si le cylindre roule vraiment, il faut l'action tangentielle \(T\) et la comparer à \(fN\) : seul le principe fondamental la donne (\(T = \tfrac13 mg\sin\alpha\)). Les deux outils se complètent.</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le TEC à un système à deux paramètres et espérer en tirer deux inconnues, ou chercher par le TEC l'effort dans une liaison parfaite. Dans le doute, compter les inconnues et les équations, comme en statique.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · 2ᵉ ANNÉE</div>
  <h2>Ce que la 2ᵉ année ajoute</h2>
  <div class="intro">Le chapitre <a href="#energ2a/cours">« Énergétique des systèmes de solides »</a> reprend ce qui précède pour des solides quelconques dans l'espace, et le complète.</div>
  <ul>
    <li><strong>Puissance en 3D</strong> : comoment \(\{\mathcal T\}\otimes\{\mathcal V\}\) des torseurs des actions et cinématique ; démonstration générale du TEC à partir du principe fondamental.</li>
    <li><strong>Rendement direct et rendement inverse</strong> : couple moteur quand la charge entraîne (\(C_m = \eta'\,C_{r,eq}\)), transmetteurs irréversibles (\(\eta' \leq 0\)), fonctionnement d'un moteur dans les quatre quadrants.</li>
    <li><strong>Couple thermique équivalent</strong> : valeur efficace du couple sur un cycle, \(C_{th} = \sqrt{\tfrac1T\int_0^T C_m^2\,\mathrm dt}\), à comparer au couple nominal du moteur. Pour l'élévateur du §9, montée suivie d'une seconde d'arrêt : \(C_{th} \approx 1{,}04\ \text{N·m}\).</li>
    <li><strong>Adaptation d'inertie</strong> : pour une charge purement inertielle \(J_c\), le couple d'accélération est minimal pour le rapport \(i = \sqrt{J_m/J_c}\), qui égale l'inertie ramenée de la charge à celle du rotor.</li>
    <li><strong>Mécanisme à inertie variable</strong> : \(J_{eq}(q)\,\ddot q + \tfrac12\,\dfrac{\mathrm dJ_{eq}}{\mathrm dq}\,\dot q^2 = Q\), où \(Q\) est l'effort généralisé ; c'est ce terme qui fait onduler la vitesse d'une bielle-manivelle.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉNERGÉTIQUE DES SYSTÈMES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : énergies et puissances (§1 à §4), théorème de l'énergie cinétique (§5), modèle équivalent ramené sur le moteur (§6, §7), rendement et cycle de fonctionnement (§8, §9), choix de l'outil (§10). Chacune se termine par un exemple court, chiffré et vérifié. Masses, centres d'inertie, moments d'inertie et principe fondamental : méthodes de « Dynamique du solide ».</div>

  <div class="method-box">
    <strong>Méthode 1 — Calculer l'énergie cinétique d'un ensemble de solides</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Inventaire.</span> Lister les pièces mobiles et la nature du mouvement de chacune : translation, rotation autour d'un axe fixe, mouvement plan.</li>
      <li><span class="step">Formule adaptée.</span> \(\tfrac12 mV^2\), \(\tfrac12 J_\Delta\omega^2\), ou König \(\tfrac12 mV(G)^2 + \tfrac12 J_G\omega^2\).</li>
      <li><span class="step">Un seul paramètre.</span> Exprimer toutes les vitesses en fonction d'une seule (rapports de transmission, roulement sans glissement), puis additionner.</li>
      <li><span class="step">Contrôle.</span> Chaque masse comptée une seule fois ; énergie positive, en joules.</li>
    </ol>
    <p><em>Exemple éclair :</em> scie circulaire : lame \(J = 0{,}012\ \text{kg·m}^2\) et rotor \(2\cdot10^{-4}\ \text{kg·m}^2\) en prise directe, à 4 500 tr/min (\(471\ \text{rad/s}\)) : \(E_c = \tfrac12\times0{,}0122\times471^2 \approx 1{,}35\ \text{kJ}\). C'est l'énergie que le frein de lame doit dissiper en quelques secondes.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Calculer la puissance d'une action extérieure</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Nature de l'action.</span> Force en un point, couple, ou action quelconque (torseur).</li>
      <li><span class="step">Même point.</span> Écrire le torseur de l'action et le torseur cinématique du solide qui la subit au même point, choisi pour simplifier (point d'application, point d'un axe fixe).</li>
      <li><span class="step">Produit.</span> \(\mathcal P = \vec R\cdot\vec V(A) + \vec M(A)\cdot\vec\Omega\) ; pour une force, \(\vec F\cdot\vec V(P)\) ; pour un couple, \(C\,\omega\) ; pour le poids, \(-mg\,\dot z_G\).</li>
      <li><span class="step">Signe.</span> \(\mathcal P \gt 0\) : action motrice ; \(\mathcal P \lt 0\) : résistante.</li>
    </ol>
    <p><em>Exemple éclair :</em> perçage : le foret résiste avec un couple de \(4\ \text{N·m}\) à 800 tr/min (\(83{,}8\ \text{rad/s}\)), soit \(\mathcal P = -4\times83{,}8 \approx -335\ \text{W}\) ; l'effort d'avance de 600 N à \(0{,}5\ \text{mm/s}\) ne consomme que \(0{,}3\ \text{W}\) : c'est la rotation qui coûte.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Faire le bilan des puissances intérieures</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Liaisons internes.</span> Parcourir les liaisons entre solides de l'ensemble isolé.</li>
      <li><span class="step">Parfaites.</span> Puissance nulle (pivot, glissière sans frottement, contact en roulement sans glissement).</li>
      <li><span class="step">Dissipatives.</span> Frottement sec \(-fN\,V_g\) ou \(-C_f\,|\omega_{2/1}|\) ; visqueux \(-f_v\,\omega_{2/1}^2\) ou \(-c\,v_{2/1}^2\).</li>
      <li><span class="step">Actionneurs internes.</span> Moteur ou vérin placé entre deux pièces de l'ensemble : \(C_m\,\omega(\text{rotor}/\text{stator})\), \(F\,v(\text{tige}/\text{corps})\).</li>
    </ol>
    <p><em>Exemple éclair :</em> frein à disque d'une roue : les plaquettes, fixées à l'étrier, exercent un couple de frottement de \(120\ \text{N·m}\) sur le disque qui tourne à \(50\ \text{rad/s}\) par rapport à l'étrier : \(\mathcal P_{int} = -120\times50 = -6\ \text{kW}\), entièrement converti en chaleur.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Obtenir l'équation du mouvement par le théorème de l'énergie cinétique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Isoler</span> tout le mécanisme mobile (un seul paramètre \(q\)), dans le référentiel galiléen du bâti.</li>
      <li><span class="step">Énergie cinétique</span> \(E_c = \tfrac12 J_{eq}\,\dot q^2\) (méthode 1).</li>
      <li><span class="step">Puissances</span> extérieures et intérieures, toutes proportionnelles à \(\dot q\) : \(Q\,\dot q\).</li>
      <li><span class="step">Dériver et simplifier.</span> \(J_{eq}\,\dot q\,\ddot q = Q\,\dot q\), d'où \(J_{eq}\,\ddot q = Q\) (inertie constante).</li>
    </ol>
    <p><em>Exemple éclair :</em> plateau (\(J = 0{,}5\ \text{kg·m}^2\)) entraîné par un couple de \(3\ \text{N·m}\) contre un frottement visqueux \(f_v = 0{,}05\ \text{N·m·s/rad}\) : \(0{,}5\,\dot\omega = 3 - 0{,}05\,\omega\), premier ordre de constante de temps \(\tau = 10\ \text{s}\) et de vitesse finale \(60\ \text{rad/s}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Utiliser la forme intégrée : vitesse atteinte, distance d'arrêt</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Deux états.</span> Choisir l'état initial et l'état final (souvent : repos, ou vitesse connue).</li>
      <li><span class="step">Énergies.</span> \(E_c\) (et \(E_p\)) dans chaque état.</li>
      <li><span class="step">Travaux.</span> Travail des actions qui ne dérivent pas d'une énergie potentielle sur le déplacement : effort constant \(\times\) distance, couple constant \(\times\) angle.</li>
      <li><span class="step">Bilan.</span> \(\Delta(E_c + E_p) = W\) ; la durée n'intervient pas.</li>
    </ol>
    <p><em>Exemple éclair :</em> chariot de 400 kg lancé à \(1{,}2\ \text{m/s}\), freiné par un effort constant de 300 N : \(0 - \tfrac12\times400\times1{,}2^2 = -300\,d\), d'où \(d \approx 0{,}96\ \text{m}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Ramener inerties et masses sur l'arbre moteur</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Chaîne cinématique.</span> Écrire chaque vitesse en fonction de \(\omega_m\) : \(\omega_s = i\,\omega_m\), \(v = R\,i\,\omega_m\), \(v = p\,i\,\omega_m/2\pi\).</li>
      <li><span class="step">Égalité d'énergie.</span> \(J_{eq} = \sum J_k\,(\omega_k/\omega_m)^2 + \sum m_k\,(V_k/\omega_m)^2\).</li>
      <li><span class="step">Comparer</span> les contributions : qui domine, le rotor ou la charge ?</li>
      <li><span class="step">Contrôle.</span> Un réducteur (\(i \lt 1\)) doit diminuer l'inertie ramenée de la charge.</li>
    </ol>
    <p><em>Exemple éclair :</em> table de 120 kg entraînée directement par une vis à billes de pas 5 mm ; rotor et vis : \(1{,}5\cdot10^{-4}\ \text{kg·m}^2\). Table ramenée : \(120\times(0{,}005/2\pi)^2 \approx 7{,}6\cdot10^{-5}\ \text{kg·m}^2\), d'où \(J_{eq} \approx 2{,}26\cdot10^{-4}\ \text{kg·m}^2\) : le moteur et la vis font les deux tiers de l'inertie.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Ramener les efforts et écrire le modèle équivalent</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Puissances de la charge.</span> Calculer la puissance de chaque action autre que le moteur (poids, effort de travail, frottements) en fonction de \(\omega_m\).</li>
      <li><span class="step">Couple ramené.</span> Leur somme s'écrit \(-C_{r,eq}\,\omega_m\) : un effort \(F\) se ramène avec le rapport (\(R\,i\,F\), \(p\,i\,F/2\pi\)), pas avec son carré.</li>
      <li><span class="step">Modèle.</span> \(J_{eq}\,\dot\omega_m = C_m - C_{r,eq}\).</li>
      <li><span class="step">Moteur.</span> Avec une caractéristique \(C_m = C_0 - b\,\omega_m\) : premier ordre, \(\tau = J_{eq}/b\), \(\omega_\infty = (C_0 - C_{r,eq})/b\).</li>
    </ol>
    <p><em>Exemple éclair :</em> même table, effort de coupe de 2 000 N le long de la vis : \(C_{r,eq} = 2\,000\times0{,}005/2\pi \approx 1{,}59\ \text{N·m}\) (transmission parfaite).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Utiliser les rendements d'une chaîne de transmission</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Sens du flux.</span> Repérer qui fournit la puissance (moteur ou charge entraînante).</li>
      <li><span class="step">Produit.</span> Constituants en série : \(\eta = \prod\eta_k\).</li>
      <li><span class="step">Puissances.</span> Puissance absorbée \(= \) puissance utile \(/\eta\) ; pertes \(= (1-\eta)\times\) puissance reçue.</li>
      <li><span class="step">Couples.</span> \(C_s\,\omega_s = \eta\,C_e\,\omega_e\), soit \(C_s = \eta\,C_e/i\) : le rendement s'applique à la puissance, le rapport aux vitesses.</li>
    </ol>
    <p><em>Exemple éclair :</em> treuil fournissant 2 kW utiles, réducteur \(\eta = 0{,}9\), moteur \(\eta = 0{,}85\) : puissance électrique \(2/(0{,}9\times0{,}85) \approx 2{,}61\ \text{kW}\). Avec un réducteur \(i = 1/25\) et un couple moteur de \(10\ \text{N·m}\) : \(C_s = 0{,}9\times10\times25 = 225\ \text{N·m}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Dimensionner un moteur sur une loi de mouvement en trapèze</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cinématique.</span> Ramener la loi de mouvement de la charge sur l'arbre moteur : \(\omega_{max}\), \(\dot\omega\) de chaque phase.</li>
      <li><span class="step">Modèle.</span> \(J_{eq}\) et \(C_{r,eq}\) (méthodes 6 et 7), rendement si la transmission n'est pas parfaite.</li>
      <li><span class="step">Couples par phase.</span> \(C_m = J_{eq}\,\dot\omega + C_{r,eq}\) (avec pertes : \(J_{amont}\dot\omega + (J_{aval}\dot\omega + C_{r,eq})/\eta\) tant que le moteur entraîne).</li>
      <li><span class="step">Vérifications.</span> Vitesse maximale, couple crête, puissance crête en fin d'accélération ; échauffement (couple efficace, 2ᵉ année).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(J_{eq} = 2\cdot10^{-3}\ \text{kg·m}^2\), \(C_{r,eq} = 0{,}2\ \text{N·m}\), \(\omega_{max} = 300\ \text{rad/s}\) atteinte en \(0{,}15\ \text{s}\) : \(\dot\omega = 2\,000\ \text{rad/s}^2\) ; \(C_1 = 4{,}2\ \text{N·m}\), \(C_2 = 0{,}2\ \text{N·m}\), \(C_3 = -3{,}8\ \text{N·m}\) (freinage) ; puissance crête \(4{,}2\times300 = 1{,}26\ \text{kW}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Choisir entre théorème de l'énergie cinétique et principe fondamental</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Compter.</span> Paramètres du mouvement, inconnues cherchées.</li>
      <li><span class="step">Loi de mouvement ou couple moteur</span> d'un mécanisme à un paramètre, liaisons parfaites : théorème de l'énergie cinétique sur tout le mécanisme.</li>
      <li><span class="step">Action dans une liaison</span>, tension d'un câble, effort normal d'un contact frottant : principe fondamental sur un isolement où elle est extérieure.</li>
      <li><span class="step">Plusieurs paramètres</span> : principe fondamental, une équation par paramètre.</li>
    </ol>
    <p><em>Exemple éclair :</em> lisse de barrière (tige de 6 kg et 3,6 m, articulée à une extrémité : \(J_O = mL^2/3 \approx 25{,}9\ \text{kg·m}^2\)) qui démarre de l'horizontale avec \(\dot\omega = 0{,}5\ \text{rad/s}^2\). Couple moteur par le TEC : \(C = J_O\dot\omega + mg\,\tfrac L2 \approx 13{,}0 + 106 \approx 119\ \text{N·m}\). L'effort vertical du pivot demande le principe fondamental : \(R_y = mg + m\,\tfrac L2\,\dot\omega \approx 58{,}9 + 5{,}4 \approx 64{,}3\ \text{N}\).</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong>
    <ul>
      <li>Oublier une puissance intérieure : moteur monté entre deux pièces mobiles, frottement entre deux pièces de l'ensemble isolé.</li>
      <li>Compter une dissipation \(-fNv\) pour une roue qui roule sans glisser.</li>
      <li>Ramener une inertie avec le rapport au lieu de son carré, ou un effort avec le carré du rapport.</li>
      <li>Diviser par le rendement quand la charge entraîne le moteur, ou appliquer le rendement à l'inertie du rotor, placée avant la transmission.</li>
      <li>Parler de rendement pendant une phase transitoire : il se définit en régime permanent ou sur un cycle.</li>
      <li>Espérer tirer deux inconnues du seul théorème de l'énergie cinétique, ou une action de liaison parfaite.</li>
      <li>Mélanger tr/min et rad/s dans \(C\omega\) ou \(\tfrac12 J\omega^2\).</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Oscillateur masse-ressort-amortisseur — bilan énergétique</h3>
  <div class="statement">Un bloc de masse \(m = 2\ \text{kg}\), guidé sans frottement sur un rail horizontal, est relié au bâti par un ressort de raideur \(k = 200\ \text{N/m}\) et par un amortisseur de coefficient \(c = 4\ \text{N·s/m}\). À \(t = 0\), il est lâché sans vitesse avec un allongement \(x_0 = 5\ \text{cm}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'énergie mécanique initiale \(E_{m0}\).</div>
  <div class="q"><strong>Q2.</strong> Écrire le théorème de l'énergie cinétique et en déduire l'équation du mouvement. Calculer la pulsation propre \(\omega_0\) et le coefficient d'amortissement \(\xi\).</div>
  <div class="q"><strong>Q3.</strong> Exprimer la puissance de l'amortisseur. Pour un amortissement faible, l'énergie mécanique décroît en moyenne comme \(E_{m0}\,e^{-2\xi\omega_0 t}\) : quelle est sa constante de temps ? Quelle énergie a été dissipée au bout d'une seconde ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Vitesse nulle : \(E_{m0} = \tfrac12 k x_0^2 = \tfrac12\times200\times0{,}05^2 = 0{,}25\ \text{J}\).</p>
    <p><strong>Q2.</strong> On isole le bloc. Puissances : ressort \(-kx\dot x = -\dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12 kx^2\right)\), amortisseur \(-c\dot x^2\) ; le poids et le rail (sans frottement) ne travaillent pas. TEC : \(m\dot x\ddot x = -kx\dot x - c\dot x^2\), soit \(m\ddot x + c\dot x + kx = 0\). \(\omega_0 = \sqrt{k/m} = 10\ \text{rad/s}\) et \(\xi = \dfrac{c}{2\sqrt{km}} = \dfrac{4}{40} = 0{,}1\) : régime pseudo-périodique faiblement amorti.</p>
    <p><strong>Q3.</strong> \(\mathcal P = -c\dot x^2 \leq 0\) : l'amortisseur dissipe \(c\dot x^2\), maximal au passage par la position d'équilibre (vitesse maximale) et nul aux élongations extrêmes. \(E_m \approx 0{,}25\,e^{-2t}\ \text{J}\) : constante de temps de l'énergie \(1/(2\xi\omega_0) = 0{,}5\ \text{s}\), moitié de celle de l'amplitude (\(1/(\xi\omega_0) = 1\ \text{s}\)), puisque l'énergie varie comme le carré de l'amplitude. Au bout d'une seconde : \(0{,}25\,(1 - e^{-2}) \approx 0{,}22\ \text{J}\) ont été dissipés, 86 % de l'énergie initiale.</p>
  </div>
</div>

  <h3>Course de solides roulants</h3>
  <div class="statement">Un anneau (\(J_G = mR^2\)), un cylindre plein (\(J_G = \tfrac12 mR^2\)) et une boule pleine (\(J_G = \tfrac25 mR^2\)) sont lâchés ensemble, sans vitesse, en haut d'une rampe inclinée de \(\alpha = 20°\), d'un dénivelé \(h = 1\ \text{m}\). Ils roulent sans glisser. On compare aussi un bloc qui glisserait sans frottement. \(g = 9{,}81\ \text{m/s}^2\).</div>
  <div class="q"><strong>Q1.</strong> En posant \(J_G = \kappa\,mR^2\), exprimer l'énergie cinétique d'un solide roulant en fonction de la vitesse \(v\) de son centre.</div>
  <div class="q"><strong>Q2.</strong> Par le théorème de l'énergie cinétique sous forme intégrée, calculer la vitesse de chaque solide en bas de la rampe. Dépend-elle de la masse et du rayon ?</div>
  <div class="q"><strong>Q3.</strong> Par la forme dérivée, calculer l'accélération de chacun et la durée de la descente. Dans quel ordre arrivent-ils ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> König, avec \(\omega = v/R\) (roulement sans glissement) : \(E_c = \tfrac12 mv^2 + \tfrac12\kappa mR^2(v/R)^2\), soit \(E_c = \tfrac12(1 + \kappa)\,mv^2\). Tout se passe comme si la masse valait \((1 + \kappa)\,m\) : c'est la masse équivalente.</p>
    <p><strong>Q2.</strong> Seul le poids travaille (l'action de la rampe ne travaille pas en roulement sans glissement) : \(\tfrac12(1 + \kappa)\,mv^2 = mgh\), d'où \(v = \sqrt{2gh/(1 + \kappa)}\), indépendante de \(m\) et de \(R\). Bloc glissant (\(\kappa = 0\)) : \(4{,}43\ \text{m/s}\) ; boule : \(3{,}74\ \text{m/s}\) ; cylindre : \(3{,}62\ \text{m/s}\) ; anneau : \(3{,}13\ \text{m/s}\).</p>
    <p><strong>Q3.</strong> \((1 + \kappa)\,m v\dot v = mg\,v\sin\alpha\), d'où \(\dot v = g\sin\alpha/(1 + \kappa)\), constante. Longueur de la rampe \(\ell = h/\sin\alpha \approx 2{,}92\ \text{m}\), durée \(\sqrt{2\ell/\dot v}\) : bloc \(1{,}32\ \text{s}\), boule \(1{,}56\ \text{s}\), cylindre \(1{,}62\ \text{s}\), anneau \(1{,}87\ \text{s}\). La boule gagne la course des solides roulants : c'est elle dont la matière est la plus proche de l'axe, donc qui consacre la plus petite part de l'énergie à la rotation.</p>
  </div>
</div>

  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Freinage d'une voiture : où passe l'énergie ?</h3>
  <div class="statement">Une voiture de \(1\,300\ \text{kg}\) roulant à \(90\ \text{km/h}\) freine jusqu'à l'arrêt avec une décélération constante de \(8\ \text{m/s}^2\), sans que les roues glissent sur la route. On néglige l'air, la résistance au roulement et, sauf en Q4, l'inertie de rotation des roues. Les freins avant absorbent 70 % de l'énergie, répartie également entre les deux disques avant, de 8 kg de fonte chacun (capacité thermique massique \(c_m = 500\ \text{J·kg}^{-1}\text{·K}^{-1}\)).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'énergie cinétique initiale, la durée et la distance de freinage.</div>
  <div class="q"><strong>Q2.</strong> En isolant toute la voiture, quelles actions ont une puissance non nulle ? Que valent la puissance de freinage au début et en moyenne ?</div>
  <div class="q"><strong>Q3.</strong> De combien s'élève la température d'un disque avant, si l'on néglige le refroidissement pendant le freinage ?</div>
  <div class="q"><strong>Q4.</strong> Chaque roue a un moment d'inertie de \(0{,}9\ \text{kg·m}^2\) et un rayon de \(0{,}30\ \text{m}\). Quelle part de l'énergie cinétique leur rotation représente-t-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v_0 = 25\ \text{m/s}\) ; \(E_c = \tfrac12\times1\,300\times25^2 \approx 406\ \text{kJ}\). Durée \(25/8 \approx 3{,}1\ \text{s}\), distance \(v_0^2/(2a) \approx 39\ \text{m}\).</p>
    <p><strong>Q2.</strong> Les roues roulent sans glisser : l'action de la route sur les pneus ne travaille pas (elle freine la voiture, mais en un point de vitesse nulle). Le poids est perpendiculaire au déplacement. Il reste les actions mutuelles des plaquettes et des disques, qui frottent avec glissement : une puissance <strong>intérieure</strong>, négative. TEC : \(\mathcal P_{int} = \mathrm dE_c/\mathrm dt = -m a v\), soit \(260\ \text{kW}\) dissipés au début (à 25 m/s), puis de moins en moins ; en moyenne, \(406\ \text{kJ}/3{,}1\ \text{s} \approx 130\ \text{kW}\).</p>
    <p><strong>Q3.</strong> Chaque disque avant reçoit \(0{,}35\times406 \approx 142\ \text{kJ}\), d'où \(\Delta T = \dfrac{142\,000}{8\times500} \approx 36\ \text{K}\) par freinage. Une série de freinages ou une longue descente sans refroidissement suffisant mène vite à plusieurs centaines de degrés : c'est l'échauffement qui limite les freins.</p>
    <p><strong>Q4.</strong> \(\omega = v/R \approx 83{,}3\ \text{rad/s}\) ; rotation des quatre roues : \(4\times\tfrac12\times0{,}9\times83{,}3^2 \approx 12{,}5\ \text{kJ}\), soit 3 % de l'énergie de translation : l'approximation était justifiée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Axe vertical à vis à billes : modèle ramené sur le moteur</h3>
  <div class="statement">Un axe vertical lève un chariot chargé de \(m = 50\ \text{kg}\). Le moteur (rotor \(J_m = 2\cdot10^{-4}\ \text{kg·m}^2\)) entraîne par une courroie crantée (rapport \(i = 1/2\), rendement \(0{,}95\)) une vis à billes de pas \(p = 5\ \text{mm}\) (inertie \(J_v = 10^{-4}\ \text{kg·m}^2\), rendement \(0{,}9\)) dont l'écrou porte le chariot. Guidages sans frottement ; \(g = 9{,}81\ \text{m/s}^2\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer la vitesse du chariot en fonction de \(\omega_m\). La calculer pour 3 000 tr/min.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'inertie équivalente ramenée sur l'arbre moteur et la part de chaque élément.</div>
  <div class="q"><strong>Q3.</strong> Calculer le couple résistant ramené (transmission parfaite), puis le couple et la puissance du moteur en montée à vitesse constante, avec les rendements. Vérifier par la puissance utile.</div>
  <div class="q"><strong>Q4.</strong> Transmission supposée parfaite : quel couple faut-il pour atteindre 3 000 tr/min en 0,1 s en montée ?</div>
  <div class="q"><strong>Q5.</strong> Quelle masse le chariot « voit-il » en translation ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La vis tourne à \(i\,\omega_m\) et l'écrou avance d'un pas par tour : \(v = \dfrac{p\,i}{2\pi}\,\omega_m\), avec \(p\,i/2\pi \approx 3{,}98\cdot10^{-4}\ \text{m}\). À 3 000 tr/min (\(314\ \text{rad/s}\)) : \(v = 0{,}125\ \text{m/s}\).</p>
    <p><strong>Q2.</strong> \(J_{eq} = J_m + J_v\,i^2 + m\,(p\,i/2\pi)^2\) ; les trois termes valent \(2\cdot10^{-4}\), \(0{,}25\cdot10^{-4}\) et \(0{,}079\cdot10^{-4}\), d'où \(J_{eq} \approx 2{,}33\cdot10^{-4}\ \text{kg·m}^2\) : rotor 86 %, vis 11 %, chariot 3 %.</p>
    <p><strong>Q3.</strong> Puissance du poids : \(-mg\,v = -mg\,\dfrac{p\,i}{2\pi}\,\omega_m\), d'où \(C_{r,eq} = mg\,p\,i/2\pi \approx 0{,}195\ \text{N·m}\). Rendement de la chaîne \(\eta = 0{,}95\times0{,}9 = 0{,}855\) ; en montée, la charge résiste : \(C_m = C_{r,eq}/\eta \approx 0{,}228\ \text{N·m}\) et \(\mathcal P_m \approx 0{,}228\times314 \approx 72\ \text{W}\). Contrôle : \(mgv \approx 61{,}3\ \text{W}\) et \(61{,}3/0{,}855 \approx 71{,}7\ \text{W}\).</p>
    <p><strong>Q4.</strong> \(\dot\omega_m = 314/0{,}1 \approx 3\,140\ \text{rad/s}^2\) ; \(C_m = J_{eq}\,\dot\omega_m + C_{r,eq}\), soit \(0{,}73 + 0{,}20 \approx 0{,}93\ \text{N·m}\) : l'accélération coûte près de quatre fois le couple de levage, et presque tout sert à lancer le rotor.</p>
    <p><strong>Q5.</strong> Masse équivalente : \(M_{eq} = J_{eq}/(p\,i/2\pi)^2 \approx 1\,470\ \text{kg}\), dont \(1\,260\ \text{kg}\) pour le seul rotor. Une vis de petit pas est un réducteur très fort : vu de la charge, le moteur est énorme. C'est pourquoi on choisit, sur les axes rapides, des moteurs à faible inertie et des pas plus grands.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Convoyeur à avance pas à pas : couple, puissance et énergie sur un cycle</h3>
  <div class="statement">On reprend le convoyeur du cours (§6) : inertie équivalente ramenée sur le moteur \(J_{eq} = 5{,}15\cdot10^{-3}\ \text{kg·m}^2\), rapport \(R\,i = 5\cdot10^{-3}\ \text{m}\) entre la vitesse de la bande et celle du moteur. Les frottements des rouleaux équivalent à un effort constant \(F_r = 100\ \text{N}\) sur la bande. La bande doit avancer de \(0{,}6\ \text{m}\) en \(1{,}2\ \text{s}\), avec une loi en trapèze symétrique (\(t_a = t_d = 0{,}3\ \text{s}\)), puis marquer une pause. Transmission parfaite.</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse maximale de la bande, la vitesse maximale du moteur et son accélération angulaire.</div>
  <div class="q"><strong>Q2.</strong> Calculer le couple résistant ramené, puis le couple moteur dans chaque phase.</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance crête du moteur.</div>
  <div class="q"><strong>Q4.</strong> Calculer l'énergie fournie par le moteur dans chaque phase. Vérifier le bilan sur le cycle et interpréter le signe de la dernière phase.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v_{max} = 0{,}6/(1{,}2 - 0{,}3) \approx 0{,}667\ \text{m/s}\) ; \(\omega_{max} = v_{max}/(R\,i) \approx 133\ \text{rad/s}\) (1 270 tr/min) ; \(\dot\omega = 133/0{,}3 \approx 444\ \text{rad/s}^2\).</p>
    <p><strong>Q2.</strong> \(C_{r,eq} = F_r\,R\,i = 0{,}5\ \text{N·m}\). Phases : \(C_1 = J_{eq}\dot\omega + C_{r,eq} \approx 2{,}29 + 0{,}5 \approx 2{,}79\ \text{N·m}\) ; \(C_2 = 0{,}5\ \text{N·m}\) ; \(C_3 \approx -2{,}29 + 0{,}5 \approx -1{,}79\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> En fin d'accélération : \(2{,}79\times133 \approx 372\ \text{W}\).</p>
    <p><strong>Q4.</strong> La vitesse varie linéairement pendant les phases 1 et 3 (vitesse moyenne \(\omega_{max}/2\)) : \(W_1 = 2{,}79\times66{,}7\times0{,}3 \approx 55{,}8\ \text{J}\), \(W_2 = 0{,}5\times133\times0{,}6 = 40\ \text{J}\), \(W_3 \approx -1{,}79\times66{,}7\times0{,}3 \approx -35{,}8\ \text{J}\). Total : 60 J, exactement le travail des frottements \(F_r\times0{,}6\ \text{m}\) : l'énergie cinétique, nulle au début et à la fin, ne coûte rien sur le cycle. En phase 3, le moteur reçoit 35,8 J (l'énergie cinétique, 45,8 J, moins les frottements de cette phase) : il fonctionne en génératrice, et le variateur doit savoir freiner (résistance de freinage ou renvoi au réseau).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Monte-charge de chantier à pignon et crémaillère</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de sciences industrielles PT (thème : énergie cinétique d'un ensemble, puissances intérieures, inertie et couple ramenés, rendement, choix entre théorème de l'énergie cinétique et principe fondamental). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">
    <p>Un monte-charge de chantier grimpe le long d'un mât vertical fixe qui porte une crémaillère. La cabine (masse totale avec sa charge, son moteur et son réducteur : \(m = 600\ \text{kg}\)) est guidée sur le mât par des galets (liaisons supposées parfaites). Le moteur asynchrone, fixé sur la cabine, tourne à 1 450 tr/min en régime établi ; par un réducteur de rapport \(i = 1/18\), il entraîne un pignon de rayon primitif \(R = 60\ \text{mm}\) qui engrène sur la crémaillère.</p>
    <p>Données : rotor \(J_m = 0{,}02\ \text{kg·m}^2\) ; pignon et arbre de sortie \(J_p = 0{,}01\ \text{kg·m}^2\) ; inerties du réducteur négligées ; rendement du réducteur \(\eta = 0{,}90\) quand le moteur entraîne, \(\eta' = 0{,}85\) quand la charge entraîne ; engrènement pignon-crémaillère parfait (roulement sans glissement des cercles primitifs). \(g = 9{,}81\ \text{m/s}^2\).</p>
  </div>
  <p class="exo-part">Partie A — Cinématique</p>
  <div class="q"><strong>A1.</strong> Calculer la vitesse de montée de la cabine en régime établi.</div>
  <p class="exo-part">Partie B — Modèle équivalent</p>
  <div class="q"><strong>B1.</strong> On isole \(\Sigma\) = {cabine, moteur, réducteur, pignon}. Exprimer son énergie cinétique et l'inertie équivalente \(J_{eq}\) ramenée sur l'arbre moteur. Quel élément domine ? Quelle masse la cabine « voit-elle » ?</div>
  <div class="q"><strong>B2.</strong> Faire le bilan des puissances extérieures et intérieures à \(\Sigma\). Pourquoi le couple moteur est-il une action intérieure, et quelle vitesse faut-il utiliser pour sa puissance ?</div>
  <div class="q"><strong>B3.</strong> Transmission supposée parfaite, écrire l'équation du mouvement sous la forme \(J_{eq}\,\dot\omega_m = C_m - C_{r,eq}\) et calculer \(C_{r,eq}\).</div>
  <p class="exo-part">Partie C — Montée à pleine charge</p>
  <div class="q"><strong>C1.</strong> Calculer le couple et la puissance du moteur en montée établie, et la puissance utile.</div>
  <div class="q"><strong>C2.</strong> Le démarrage en montée se fait en 1 s à accélération constante. Calculer le couple moteur nécessaire et la puissance crête, en tenant compte du rendement (l'inertie du rotor est avant le réducteur).</div>
  <p class="exo-part">Partie D — Descente à pleine charge</p>
  <div class="q"><strong>D1.</strong> En descente établie à la même vitesse, la charge entraîne. Calculer le couple et la puissance du moteur ; dans quel mode fonctionne-t-il ?</div>
  <div class="q"><strong>D2.</strong> Quelle énergie le moteur reçoit-il sur une descente de 20 m ? La comparer à la variation d'énergie potentielle.</div>
  <p class="exo-part">Partie E — Dimensionner la crémaillère</p>
  <div class="q"><strong>E1.</strong> Peut-on obtenir l'effort transmis par la crémaillère au pignon avec le théorème de l'énergie cinétique ? Le calculer pendant le démarrage en montée, par l'outil adapté.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(\omega_m = 1\,450\times2\pi/60 \approx 151{,}8\ \text{rad/s}\) ; pignon : \(\omega_p = i\,\omega_m \approx 8{,}44\ \text{rad/s}\) (80,6 tr/min). Le cercle primitif roule sans glisser sur la crémaillère fixe : \(v = R\,\omega_p \approx 0{,}506\ \text{m/s}\).</p>
    <p><strong>B1.</strong> Toute la masse \(m\) se translate à \(v\) ; le rotor tourne en plus à \(\omega_m\) par rapport à la cabine, le pignon à \(\omega_p\) (les rotations sont mesurées par rapport à la cabine, qui est en translation). \(E_c = \tfrac12 m v^2 + \tfrac12 J_m\omega_m^2 + \tfrac12 J_p\omega_p^2\), que l'on écrit \(\tfrac12 J_{eq}\,\omega_m^2\) avec</p>
    <div class="formula">$$J_{eq} = J_m + J_p\,i^2 + m\,(R\,i)^2 = 0{,}02 + 3{,}1\cdot10^{-5} + 6{,}67\cdot10^{-3} \approx 0{,}0267\ \text{kg·m}^2$$</div>
    <p>Le rotor en fait les trois quarts. Vue de la cabine : \(M_{eq} = J_{eq}/(R\,i)^2 \approx 2\,400\ \text{kg}\), quatre fois sa masse réelle.</p>
    <p><strong>B2.</strong> Extérieures : poids, de puissance \(-mgv\) ; action de la crémaillère sur le pignon, nulle (roulement sans glissement sur une pièce fixe) ; galets, nulle (parfaits). Intérieures : le moteur, dont le stator est sur la cabine et le rotor tourne par rapport à elle, de puissance \(C_m\,\omega_m\) avec \(\omega_m\) vitesse du rotor <strong>par rapport à la cabine</strong> (ici égale à sa vitesse de rotation absolue, la cabine ne tournant pas) ; les pertes du réducteur (nulles en B3).</p>
    <p><strong>B3.</strong> TEC : \(J_{eq}\,\omega_m\dot\omega_m = C_m\,\omega_m - mg\,R\,i\,\omega_m\), d'où \(J_{eq}\,\dot\omega_m = C_m - C_{r,eq}\) avec \(C_{r,eq} = mg\,R\,i \approx 19{,}6\ \text{N·m}\).</p>
    <p><strong>C1.</strong> La charge résiste : \(C_m = C_{r,eq}/\eta \approx 21{,}8\ \text{N·m}\) ; \(\mathcal P_m \approx 21{,}8\times151{,}8 \approx 3{,}31\ \text{kW}\) ; puissance utile \(mgv \approx 2{,}98\ \text{kW}\).</p>
    <p><strong>C2.</strong> \(\dot\omega_m = 151{,}8/1 \approx 151{,}8\ \text{rad/s}^2\). L'inertie en aval du réducteur vaut \(J_{aval} = J_p i^2 + m(Ri)^2 \approx 6{,}70\cdot10^{-3}\ \text{kg·m}^2\). </p>
    <div class="formula">$$C_m = J_m\dot\omega_m + \frac{J_{aval}\dot\omega_m + C_{r,eq}}{\eta} \approx 3{,}04 + \frac{1{,}02 + 19{,}6}{0{,}9} \approx 26{,}0\ \text{N·m}$$</div>
    <p> Puissance crête en fin de démarrage : \(26{,}0\times151{,}8 \approx 3{,}94\ \text{kW}\). Sans pertes, on aurait trouvé \(23{,}7\ \text{N·m}\).</p>
    <p><strong>D1.</strong> En descente, \(\omega_m \lt 0\) et le poids fournit la puissance \(mg\,|v| \approx 2{,}98\ \text{kW}\), qui traverse le réducteur de la charge vers le moteur : \(C_m = \eta'\,C_{r,eq} \approx 16{,}7\ \text{N·m}\) (positif, opposé à la rotation). \(\mathcal P_m = C_m\,\omega_m \approx -2{,}53\ \text{kW}\) : le moteur freine, il fonctionne en génératrice et renvoie de l'énergie au réseau (ou la dissipe dans une résistance de freinage).</p>
    <p><strong>D2.</strong> Durée : \(20/0{,}506 \approx 39{,}5\ \text{s}\) ; énergie reçue : \(2{,}53\times39{,}5 \approx 100\ \text{kJ}\), pour une énergie potentielle cédée de \(mgh \approx 118\ \text{kJ}\) : le rapport est \(\eta' = 0{,}85\).</p>
    <p><strong>E1.</strong> Non : l'engrènement pignon-crémaillère ne travaille pas, l'effort cherché n'apparaît dans aucune puissance. On applique le principe fondamental à \(\Sigma\), dont la crémaillère est une action extérieure : résultante verticale, \(F - mg = m\,a\), avec \(a = v/1\ \text{s} \approx 0{,}506\ \text{m/s}^2\) (les galets, horizontaux, ne portent rien verticalement). \(F = m(g + a) \approx 6{,}19\ \text{kN}\), contre \(5{,}89\ \text{kN}\) en régime établi : on dimensionne les dentures avec la valeur de démarrage (et un coefficient de sécurité pour les à-coups).</p>
  </div>
</div>
