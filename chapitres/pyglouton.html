<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Points d'eau sur un sentier</h3>
  <div class="statement">Un randonneur parcourt un sentier de 52 km avec une gourde qui lui permet de marcher au plus \(A\) km sans s'arrêter. Les points d'eau sont aux kilomètres <span class="code-inline">P = [0, 8, 15, 21, 30, 34, 45, 52]</span> (départ en 0, arrivée en 52). Il veut faire le moins d'arrêts possible. Stratégie gloutonne : depuis le point où il se trouve, aller jusqu'au point d'eau le plus lointain qu'il peut atteindre.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">faisable(points, A)</span>, qui teste si le trajet est possible, et <span class="code-inline">arrets(points, A)</span>, qui renvoie les indices des points où il s'arrête. Justifier la terminaison.</div>
  <div class="q"><strong>Q2.</strong> Dérouler pour \(A = 15\) et pour \(A = 25\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que la stratégie est optimale : si \(g_k\) et \(o_k\) sont les positions du \(k\)-ième arrêt du glouton et d'un trajet optimal, montrer \(g_k \ge o_k\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong></p>
<pre class="codeblock"><span class="kw">def</span> arrets(points, A):
    <span class="cmt"># points : positions croissantes ; points[0] départ, dernier</span>
    <span class="cmt"># = arrivée ; deux points consécutifs à distance &lt;= A</span>
    <span class="cmt"># renvoie les indices des points de ravitaillement</span>
    res = []
    i, n = 0, len(points)
    <span class="kw">while</span> i &lt; n - 1:
        j = i
        <span class="kw">while</span> j + 1 &lt; n <span class="kw">and</span> points[j + 1] - points[i] &lt;= A:
            j = j + 1     <span class="cmt"># points[j + 1] encore atteignable</span>
        <span class="kw">if</span> j &lt; n - 1:
            res.append(j)     <span class="cmt"># arrêt au plus loin possible</span>
        i = j
    <span class="kw">return</span> res

<span class="kw">def</span> faisable(points, A):
    <span class="kw">for</span> i <span class="kw">in</span> range(len(points) - 1):
        <span class="kw">if</span> points[i + 1] - points[i] &gt; A:
            <span class="kw">return</span> <span class="kw">False</span>
    <span class="kw">return</span> <span class="kw">True</span></pre>
    <p>Si le trajet est faisable, le point suivant est toujours atteignable, donc la boucle intérieure avance au moins une fois : \(j \gt i\), et \(i\) augmente strictement à chaque tour de la boucle extérieure. Le variant \(n - 1 - i\) assure la terminaison.</p>
    <p><strong>Q2.</strong> \(A = 15\) : de 0, il atteint 8 et 15 (pas 21) : arrêt au km 15 (indice 2) ; de 15, jusqu'à 30 : arrêt (indice 4) ; de 30, jusqu'à 45 : arrêt (indice 6) ; de 45, l'arrivée est à 7 km. Trois arrêts. \(A = 25\) : arrêts aux km 21 et 45, soit deux arrêts.</p>
<pre class="codeblock">P = [0, 8, 15, 21, 30, 34, 45, 52]    <span class="cmt"># en km</span>
arrets(P, 15)       <span class="cmt"># [2, 4, 6]</span>
arrets(P, 25)       <span class="cmt"># [3, 6]</span>
faisable(P, 10)     <span class="cmt"># False</span></pre>
    <p><strong>Q3.</strong> Récurrence, avec \(g_0 = o_0 = 0\). Si \(g_k \ge o_k\), alors \(o_{k+1} \le o_k + A \le g_k + A\) : le point \(o_{k+1}\) est atteignable depuis \(g_k\), et le glouton va au moins aussi loin, \(g_{k+1} \ge o_{k+1}\). Si le trajet optimal a \(m\) arrêts, l'arrivée est à au plus \(A\) km de \(o_m\), donc de \(g_m \ge o_m\) : le glouton atteint l'arrivée depuis \(g_m\) sans autre arrêt. Il fait donc au plus \(m\) arrêts : il est optimal.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Rendre la monnaie avec une caisse limitée</h3>
  <div class="statement">Une caisse ne contient qu'un nombre limité de pièces de chaque valeur, décrit par un dictionnaire : pour une caisse qui contient une pièce de 50 c et trois de 20 c, <span class="code-inline">caisse = {50: 1, 20: 3, 10: 0, 5: 0, 2: 0, 1: 0}</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">rendu_stock(s, pieces, stock)</span>, glouton qui rend pour chaque valeur autant de pièces que possible dans la limite du stock, et renvoie le dictionnaire des pièces rendues et le reste non rendu.</div>
  <div class="q"><strong>Q2.</strong> Que se passe-t-il pour 60 c avec cette caisse ? Une solution existe-t-elle ?</div>
  <div class="q"><strong>Q3.</strong> Pour deux valeurs \(a\) et \(b\) disponibles en \(n_a\) et \(n_b\) exemplaires, écrire une recherche exhaustive <span class="code-inline">rendu_deux(s, a, na, b, nb)</span> qui renvoie le nombre minimal de pièces pour rendre exactement \(s\) (\(-1\) si c'est impossible). Coût ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong></p>
<pre class="codeblock"><span class="kw">def</span> rendu_stock(s, pieces, stock):
    <span class="cmt"># pieces décroissantes ; stock[c] : nombre de pièces c</span>
    <span class="cmt"># disponibles ; renvoie (pièces rendues, reste non rendu)</span>
    rendu = {}
    <span class="kw">for</span> c <span class="kw">in</span> pieces:
        k = s // c
        <span class="kw">if</span> k &gt; stock[c]:
            k = stock[c]          <span class="cmt"># pas assez de pièces c</span>
        <span class="kw">if</span> k &gt; 0:
            rendu[c] = k
            s = s - k * c
    <span class="kw">return</span> rendu, s</pre>
    <p><strong>Q2.</strong> Le glouton rend la pièce de 50 c, puis il reste 10 c, qu'aucune pièce disponible ne permet de rendre. Pourtant trois pièces de 20 c conviennent. Même avec un système canonique, la limite de stock suffit à mettre le glouton en échec : le premier choix (la plus grosse pièce) rend la suite impossible.</p>
<pre class="codeblock">caisse = {50: 1, 20: 3, 10: 0, 5: 0, 2: 0, 1: 0}
rendu_stock(60, [50, 20, 10, 5, 2, 1], caisse)
<span class="cmt"># ({50: 1}, 10)  : 10 centimes restent dus</span></pre>
    <p><strong>Q3.</strong> On essaie tous les couples \((i, j)\) de nombres de pièces :</p>
<pre class="codeblock"><span class="kw">def</span> rendu_deux(s, a, na, b, nb):
    <span class="cmt"># au plus na pièces a et nb pièces b ; renvoie le nombre</span>
    <span class="cmt"># minimal de pièces pour rendre exactement s, -1 si impossible</span>
    meilleur = -1
    <span class="kw">for</span> i <span class="kw">in</span> range(na + 1):
        <span class="kw">for</span> j <span class="kw">in</span> range(nb + 1):
            <span class="kw">if</span> i * a + j * b == s:
                <span class="kw">if</span> meilleur == -1 <span class="kw">or</span> i + j &lt; meilleur:
                    meilleur = i + j
    <span class="kw">return</span> meilleur</pre>
<pre class="codeblock">rendu_deux(60, 50, 1, 20, 3)    <span class="cmt"># 3</span>
rendu_deux(70, 50, 1, 20, 3)    <span class="cmt"># 2</span>
rendu_deux(30, 50, 1, 20, 3)    <span class="cmt"># -1</span></pre>
    <p>Deux boucles imbriquées : \((n_a + 1)(n_b + 1)\) essais. Une telle énumération explose avec le nombre de valeurs différentes (un niveau de boucle par valeur) : pour le cas général, on utilise la programmation dynamique (deuxième année).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Relais radio dans un tunnel</h3>
  <div class="statement">Des capteurs sont fixés le long d'un tunnel rectiligne, aux abscisses (en centaines de mètres) <span class="code-inline">x = [1, 3, 4, 9, 11, 12, 20]</span>, triées. Un relais radio placé à l'abscisse \(p\) capte tous les capteurs de l'intervalle \([p - r, p + r]\). On veut capter tous les capteurs avec le moins de relais possible. Stratégie gloutonne : placer un relais le plus à droite possible tout en captant le premier capteur non couvert, c'est-à-dire en \(x_i + r\).</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">bornes(x, r)</span>, qui renvoie la liste des positions des relais. Dérouler pour \(r = 2\).</div>
  <div class="q"><strong>Q2.</strong> Montrer par un argument d'échange qu'il existe une solution optimale dont le premier relais est en \(x_0 + r\). En déduire l'optimalité du glouton.</div>
  <div class="q"><strong>Q3.</strong> Coût, si les abscisses ne sont pas triées au départ ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong></p>
<pre class="codeblock"><span class="kw">def</span> bornes(x, r):
    <span class="cmt"># x : positions triées des capteurs ; une borne en p couvre</span>
    <span class="cmt"># [p - r, p + r] ; renvoie les positions des bornes</span>
    res = []
    i = 0
    <span class="kw">while</span> i &lt; len(x):
        p = x[i] + r          <span class="cmt"># le plus à droite possible</span>
        res.append(p)
        <span class="kw">while</span> i &lt; len(x) <span class="kw">and</span> x[i] &lt;= p + r:
            i = i + 1         <span class="cmt"># capteurs couverts par p</span>
    <span class="kw">return</span> res</pre>
    <p>Pour \(r = 2\) : le capteur 1 impose un relais en 3, qui couvre \([1, 5]\) : capteurs 1, 3, 4. Le capteur 9 impose un relais en 11, qui couvre \([9, 13]\) : 9, 11, 12. Le capteur 20 impose un relais en 22. Trois relais.</p>
<pre class="codeblock">bornes([1, 3, 4, 9, 11, 12, 20], 2)   <span class="cmt"># [3, 11, 22]</span></pre>
    <p><strong>Q2.</strong> Dans une solution optimale, le capteur \(x_0\) (le plus à gauche) est couvert par un relais \(p\) avec \(x_0 - r \le p \le x_0 + r\). Les capteurs couverts par \(p\) sont tous dans \([x_0, p + r] \subset [x_0, x_0 + 2r]\), donc couverts aussi par un relais en \(x_0 + r\). En remplaçant \(p\) par \(x_0 + r\), on garde une solution de même taille : il existe une solution optimale qui contient le choix glouton (propriété du choix glouton). Les capteurs restants à couvrir sont ceux au-delà de \(x_0 + 2r\), et une solution optimale pour eux, complétée par ce relais, est optimale (sous-structure optimale). En recommençant, on retrouve les choix du glouton : il est optimal.</p>
    <p><strong>Q3.</strong> Chaque capteur est examiné une seule fois par la boucle intérieure (l'indice \(i\) ne fait qu'augmenter) : \(O(n)\). Avec un tri préalable, le coût total est \(O(n \log n)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Le sac à dos : un glouton presque juste</h3>
  <div class="statement">Des objets sont donnés par des couples (valeur, masse) ; on veut emporter la plus grande valeur totale dans un sac de capacité 10 kg. Chaque objet est pris entièrement ou laissé.</div>
  <div class="q"><strong>Q1.</strong> Le glouton « meilleur rapport valeur/masse d'abord » est-il optimal pour les objets (30, 6), (20, 5), (20, 5) ?</div>
  <div class="q"><strong>Q2.</strong> Trouver un contre-exemple au glouton « le plus léger d'abord », puis au glouton « le plus précieux d'abord ».</div>
  <div class="q"><strong>Q3.</strong> On peut maintenant emporter une <em>fraction</em> d'un objet (du sable, de la farine), avec une valeur proportionnelle. Écrire <span class="code-inline">sac_fractionnaire(objets, capacite)</span>, glouton par rapport décroissant, et calculer sa valeur pour les objets de Q1. Pourquoi est-il optimal ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Rapports 5, 4 et 4 : le glouton prend (30, 6) ; il reste 4 kg et aucun objet de 5 kg ne rentre : valeur 30. Les deux objets de 5 kg tiennent ensemble et valent 40. Le glouton n'est pas optimal.</p>
    <p><strong>Q2.</strong> « Plus léger d'abord » : (1, 1) et (100, 10) ; le glouton prend (1, 1), puis (100, 10) ne rentre plus : 1 contre 100. « Plus précieux d'abord » : (10, 10), (7, 5), (7, 5) ; le glouton prend l'objet de valeur 10, qui remplit le sac : 10 contre 14.</p>
    <p><strong>Q3.</strong> Pour parcourir par rapport décroissant avec <span class="code-inline">sorted</span> (ordre croissant), on parcourt la liste triée depuis la fin.</p>
<pre class="codeblock"><span class="kw">def</span> sac_fractionnaire(objets, capacite):
    <span class="cmt"># objets : couples (valeur, masse) ; on peut emporter une</span>
    <span class="cmt"># fraction de chaque objet ; renvoie la valeur maximale</span>
    par_ratio = sorted([(v / m, v, m) <span class="kw">for</span> (v, m) <span class="kw">in</span> objets])
    total, reste = 0, capacite
    k = len(par_ratio) - 1     <span class="cmt"># du meilleur rapport au moins bon</span>
    <span class="kw">while</span> k &gt;= 0 <span class="kw">and</span> reste &gt; 0:
        r, v, m = par_ratio[k]
        <span class="kw">if</span> m &lt;= reste:
            total, reste = total + v, reste - m    <span class="cmt"># objet entier</span>
        <span class="kw">else</span>:
            total, reste = total + r * reste, 0    <span class="cmt"># une fraction</span>
        k = k - 1
    <span class="kw">return</span> total</pre>
<pre class="codeblock">objets = [(30, 6), (20, 5), (20, 5)]
sac_fractionnaire(objets, 10)    <span class="cmt"># 46.0</span></pre>
    <p>L'objet (30, 6) est pris en entier, puis 4 kg d'un objet de rapport 4 : \(30 + 16 = 46\). Optimalité par échange : si une solution contient une masse \(m\) d'un objet de rapport \(r'\) alors qu'il reste une masse \(m\) inutilisée d'un objet de rapport \(r \gt r'\), remplacer l'une par l'autre augmente la valeur de \((r - r')\,m\). Une solution optimale remplit donc le sac par rapports décroissants, comme le glouton. Pour le sac à dos entier, la propriété d'échange tombe (on ne peut pas couper un objet) : il faut la programmation dynamique.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Les imprimantes 3D d'un FabLab</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique PT (thème : algorithmes gloutons, sélection d'activités, allocation de ressources, contre-exemples, récursivité).</div>
  <div class="statement">Le FabLab d'un lycée possède des imprimantes 3D identiques. Une demande d'impression est un couple <span class="code-inline">(debut, fin)</span> d'entiers (en heures), qui occupe une imprimante sur l'intervalle \([\textit{debut}, \textit{fin}[\), avec \(\textit{debut} \lt \textit{fin}\). Une imprimante ne traite qu'une demande à la fois ; deux demandes qui se suivent exactement peuvent passer sur la même imprimante. On utilisera l'exemple :
<pre class="codeblock">F = [(9, 11), (9, 10), (10, 13), (11, 12), (12, 14),
     (13, 15), (14, 16), (10, 11), (15, 17)]</pre>
  On note \(n\) le nombre de demandes. On pourra utiliser la fonction <span class="code-inline">sorted(L)</span>, qui renvoie une nouvelle liste contenant les éléments de <span class="code-inline">L</span> dans l'ordre croissant (ordre lexicographique pour des tuples), avec un coût \(O(n \log n)\).</div>

  <p class="exo-part">Partie A — Modélisation</p>
  <div class="q"><strong>A1.</strong> Écrire <span class="code-inline">compatibles(a: tuple, b: tuple) -&gt; bool</span>, qui indique si deux demandes peuvent passer sur la même imprimante.</div>
  <div class="q"><strong>A2.</strong> Écrire <span class="code-inline">planning_valide(L: list) -&gt; bool</span>, qui indique si les demandes de <span class="code-inline">L</span> peuvent toutes passer sur une seule imprimante, avec un coût \(O(n \log n)\). Justifier qu'il suffit de comparer des demandes voisines après un tri par début.</div>

  <p class="exo-part">Partie B — Une seule imprimante</p>
  <div class="q"><strong>B1.</strong> Écrire <span class="code-inline">max_impressions(F: list) -&gt; list</span>, qui renvoie un plus grand ensemble de demandes deux à deux compatibles, par le glouton de la fin au plus tôt (\(F\) non vide).</div>
  <div class="q"><strong>B2.</strong> Dérouler <span class="code-inline">max_impressions(F)</span> sur l'exemple. Quel est son coût ?</div>
  <div class="q"><strong>B3.</strong> On note \(g_1, \dots, g_k\) les demandes retenues et \(o_1, \dots, o_m\) celles d'une solution optimale, rangées par fin croissante. Montrer par récurrence que la fin de \(g_i\) est inférieure ou égale à celle de \(o_i\) pour tout \(i \le k\), puis que \(k = m\).</div>

  <p class="exo-part">Partie C — Plusieurs imprimantes</p>
  <div class="q"><strong>C1.</strong> Écrire <span class="code-inline">nb_imprimantes(F: list) -&gt; int</span>, qui renvoie le nombre d'imprimantes utilisées quand on traite les demandes par début croissant en plaçant chacune sur la première imprimante libre.</div>
  <div class="q"><strong>C2.</strong> Montrer que l'exemple demande au moins trois imprimantes et que <span class="code-inline">nb_imprimantes(F)</span> vaut 3.</div>
  <div class="q"><strong>C3.</strong> Montrer qu'en général, quand la fonction met en service une \((p+1)\)-ième imprimante, \(p + 1\) demandes sont en cours au même instant. Conclure.</div>
  <div class="q"><strong>C4.</strong> Donner le coût dans le pire cas.</div>

  <p class="exo-part">Partie D — Demandes prioritaires</p>
  <div class="q"><strong>D1.</strong> Chaque demande reçoit désormais un poids (sa priorité) : <span class="code-inline">(debut, fin, poids)</span>. On veut maximiser la somme des poids des demandes retenues sur une imprimante. Pour <span class="code-inline">G = [(9, 10, 1), (10, 11, 1), (11, 12, 1), (9, 13, 5)]</span>, que donne le glouton de la fin au plus tôt ? Quel est l'optimum ?</div>
  <div class="q"><strong>D2.</strong> On propose de traiter les demandes par poids décroissant. Donner un contre-exemple.</div>
  <div class="q"><strong>D3.</strong> Les demandes \(T\) sont rangées par fin croissante. Écrire une fonction récursive <span class="code-inline">meilleur_poids(T: list, i: int, libre: int) -&gt; int</span> qui renvoie le poids maximal que l'on peut obtenir avec les demandes \(T[i], T[i+1], \dots\), l'imprimante étant occupée jusqu'à l'instant <span class="code-inline">libre</span>, en distinguant le cas où \(T[i]\) est refusée et celui où elle est acceptée. Majorer le nombre d'appels.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1, A2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> compatibles(a, b):
    <span class="kw">return</span> a[1] &lt;= b[0] <span class="kw">or</span> b[1] &lt;= a[0]

<span class="kw">def</span> planning_valide(L):
    <span class="cmt"># True si les demandes de L sont deux à deux compatibles</span>
    T = sorted(L)                         <span class="cmt"># par début croissant</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(T) - 1):
        <span class="kw">if</span> T[i][1] &gt; T[i + 1][0]:         <span class="cmt"># chevauchement</span>
            <span class="kw">return</span> <span class="kw">False</span>
    <span class="kw">return</span> <span class="kw">True</span></pre>
    <p>Si les demandes triées par début sont voisines compatibles (\(f_i \le d_{i+1}\)), alors pour \(i \lt j\) : \(f_i \le d_{i+1} \lt f_{i+1} \le d_{i+2} \lt \dots \le d_j\), donc \(f_i \le d_j\) : toutes les paires sont compatibles. Réciproquement, deux voisines incompatibles suffisent à invalider le planning. Coût : le tri, \(O(n \log n)\), puis \(n - 1\) comparaisons. La version naïve, qui teste toutes les paires, coûte \(O(n^2)\).</p>
    <p><strong>B1, B2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> max_impressions(F):
    <span class="cmt"># F : liste non vide de demandes (debut, fin)</span>
    T = sorted([(f, d) <span class="kw">for</span> (d, f) <span class="kw">in</span> F])     <span class="cmt"># par fin croissante</span>
    retenues = [(T[0][1], T[0][0])]
    libre = T[0][0]
    <span class="kw">for</span> k <span class="kw">in</span> range(1, len(T)):
        f, d = T[k]
        <span class="kw">if</span> d &gt;= libre:
            retenues.append((d, f))
            libre = f
    <span class="kw">return</span> retenues</pre>
<pre class="codeblock">max_impressions(F)
<span class="cmt"># [(9, 10), (10, 11), (11, 12), (12, 14), (14, 16)]</span></pre>
    <p>Ordre par fin (à fin égale, par début) : [9, 10[ retenue (libre = 10) ; [9, 11[ écartée ; [10, 11[ retenue (11) ; [11, 12[ retenue (12) ; [10, 13[ écartée ; [12, 14[ retenue (14) ; [13, 15[ écartée ; [14, 16[ retenue (16) ; [15, 17[ écartée. Cinq impressions. Coût \(O(n \log n)\) (tri), puis \(O(n)\).</p>
    <p><strong>B3.</strong> Pour \(i = 1\) : \(g_1\) a la plus petite fin de toutes les demandes. Si \(\textit{fin}(g_i) \le \textit{fin}(o_i)\) : \(o_{i+1}\) commence après la fin de \(o_i\), donc après celle de \(g_i\) ; elle était compatible avec \(g_1, \dots, g_i\), et le glouton, qui retient la première demande compatible dans l'ordre des fins, en a retenu une qui finit au plus tard en même temps : \(\textit{fin}(g_{i+1}) \le \textit{fin}(o_{i+1})\). Si l'on avait \(m \gt k\), la demande \(o_{k+1}\), qui commence après \(\textit{fin}(o_k) \ge \textit{fin}(g_k)\), serait compatible avec tous les choix du glouton, qui l'aurait retenue ou en aurait retenu une autre : contradiction. Donc \(k = m\).</p>
    <p><strong>C1, C2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> nb_imprimantes(F):
    fins = []          <span class="cmt"># fins[p] : fin de la dernière demande de p</span>
    <span class="kw">for</span> (d, f) <span class="kw">in</span> sorted(F):
        p = 0
        <span class="kw">while</span> p &lt; len(fins) <span class="kw">and</span> fins[p] &gt; d:
            p = p + 1
        <span class="kw">if</span> p == len(fins):
            fins.append(f)
        <span class="kw">else</span>:
            fins[p] = f
    <span class="kw">return</span> len(fins)</pre>
<pre class="codeblock">nb_imprimantes(F)     <span class="cmt"># 3</span>
profondeur(F)         <span class="cmt"># 3</span></pre>
    <p>De 10 h à 11 h, les demandes [9, 11[, [10, 13[ et [10, 11[ sont en cours : il faut au moins trois imprimantes. La fonction en utilise trois (la fonction <span class="code-inline">profondeur</span> du cours confirme la valeur 3).</p>
    <p><strong>C3.</strong> Quand une \((p+1)\)-ième imprimante est mise en service pour une demande \([d, f[\), les \(p\) imprimantes existantes ont une dernière demande qui finit après \(d\) et qui a commencé au plus tard en \(d\) (traitement par début croissant) : avec la nouvelle, \(p + 1\) demandes sont en cours à l'instant \(d\). Aucune répartition ne peut donc utiliser moins d'imprimantes que la fonction : elle est optimale.</p>
    <p><strong>C4.</strong> Tri en \(O(n \log n)\) ; chaque demande parcourt au plus toutes les imprimantes déjà en service : \(O(n^2)\) dans le pire cas (toutes les demandes simultanées).</p>
    <p><strong>D1.</strong> Par fin : [9, 10[, [10, 11[, [11, 12[ sont retenues, [9, 13[ est écartée : poids 3. La demande [9, 13[ seule a le poids 5, et c'est l'optimum (elle chevauche les trois autres). La fin au plus tôt ne tient pas compte des poids.</p>
    <p><strong>D2.</strong> <span class="code-inline">[(9, 13, 5), (9, 10, 4), (10, 11, 4), (11, 13, 4)]</span> : par poids décroissant, [9, 13[ (poids 5) est retenue et bloque les trois autres ; or les trois autres, compatibles entre elles, totalisent 12.</p>
    <p><strong>D3.</strong></p>
<pre class="codeblock"><span class="kw">def</span> meilleur_poids(T, i, libre):
    <span class="cmt"># T : demandes (debut, fin, poids) triées par fin croissante ;</span>
    <span class="cmt"># poids maximal que l'on peut obtenir avec T[i], T[i+1], …</span>
    <span class="cmt"># sachant que l'imprimante est occupée jusqu'à libre</span>
    <span class="kw">if</span> i == len(T):
        <span class="kw">return</span> 0
    d, f, w = T[i]
    sans = meilleur_poids(T, i + 1, libre)    <span class="cmt"># on refuse T[i]</span>
    <span class="kw">if</span> d &gt;= libre:
        avec = w + meilleur_poids(T, i + 1, f)
        <span class="kw">if</span> avec &gt; sans:
            <span class="kw">return</span> avec
    <span class="kw">return</span> sans</pre>
<pre class="codeblock">G = [(9, 10, 1), (10, 11, 1), (11, 12, 1), (9, 13, 5)]
meilleur_poids(G, 0, 0)     <span class="cmt"># 5</span></pre>
    <p>La fonction termine car \(i\) augmente à chaque appel et s'arrête à \(n\). Chaque appel en provoque au plus deux, sur l'indice suivant : au plus \(1 + 2 + 4 + \dots + 2^n = 2^{n+1} - 1\) appels, coût exponentiel \(O(2^n)\), atteint quand toutes les demandes sont compatibles. Les mêmes sous-problèmes (même \(i\), même <span class="code-inline">libre</span>) sont recalculés de nombreuses fois : la programmation dynamique de deuxième année (mémoïsation dans un dictionnaire, ordonnancement de tâches pondérées) ramène ce calcul à un coût polynomial.</p>
  </div>
</div>
