  <h3>Calculs élémentaires</h3>
  <div class="statement">Calculer les expressions suivantes sous forme algébrique \(a + ib\) :</div>
  <div class="q"><strong>Q1.</strong> \(z_1 = (2 + 3i)(1 - i)\)</div>
  <div class="q"><strong>Q2.</strong> \(z_2 = \dfrac{1+i}{1-i}\)</div>
  <div class="q"><strong>Q3.</strong> \(z_3 = (1+i)^6\)</div>
  <div class="q"><strong>Q4.</strong> Donner module et argument de chacun.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> $$z_1 = 2 - 2i + 3i - 3i^2 = 2 - 2i + 3i + 3 = 5 + i .$$</p>
    <p><strong>Q2.</strong> Multiplier par le conjugué : $$z_2 = \dfrac{(1+i)(1+i)}{(1-i)(1+i)} = \dfrac{(1+i)^2}{2} = \dfrac{2i}{2} = i .$$</p>
    <p><strong>Q3.</strong> Forme exponentielle : \(1+i = \sqrt{2}\,e^{i\pi/4}\). Donc $$z_3 = (\sqrt{2})^6\,e^{6i\pi/4} = 8\,e^{3i\pi/2} = 8(-i) = -8i .$$</p>
    <p><strong>Q4.</strong> \(|z_1| = \sqrt{26}\), \(\arg(z_1) = \arctan(1/5)\). \(|z_2| = 1\), \(\arg(z_2) = \pi/2\). \(|z_3| = 8\), \(\arg(z_3) = -\pi/2\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Équation du second degré dans ℂ</h3>
  <div class="statement">Résoudre dans \(\mathbb{C}\) les équations suivantes :</div>
  <div class="q"><strong>Q1.</strong> \(z^2 - 2z + 2 = 0\)</div>
  <div class="q"><strong>Q2.</strong> \(z^2 - (3+i)z + (2+i) = 0\)</div>
  <div class="q"><strong>Q3.</strong> \(z^2 = 3 - 4i\) (racines carrées de \(3-4i\))</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta = 4 - 8 = -4\). \(\delta = 2i\). \(z = (2 \pm 2i)/2 = 1 \pm i\). <strong>Solutions : \(1+i\) et \(1-i\)</strong> (complexes conjuguées car coefficients réels).</p>
    <p><strong>Q2.</strong> $$\Delta = (3+i)^2 - 4(2+i) = 9 + 6i - 1 - 8 - 4i = 2i .$$ Racine carrée \(\delta\) telle que \(\delta^2 = 2i\) : si \(\delta = x+iy\), \(x^2 - y^2 = 0\), \(2xy = 2\), \(x^2+y^2 = 2\). D'où \(x^2 = y^2 = 1\) et \(xy > 0\), soit \(\delta = 1+i\) (ou \(-1-i\)). \(z = ((3+i) \pm (1+i))/2 = (2+i)\) ou \(1\). <strong>Solutions : \(z = 1\) et \(z = 2+i\)</strong>. Vérification : produit \(= 2+i\) ✓, somme \(= 3+i\) ✓.</p>
    <p><strong>Q3.</strong> \(z = x+iy\), \(|3-4i| = 5\). Système : \(x^2 - y^2 = 3\), \(2xy = -4\), \(x^2 + y^2 = 5\). D'où \(x^2 = 4\), \(y^2 = 1\), \(xy < 0\). Solutions : \(\boxed{z = 2 - i \text{ et } z = -2 + i}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Racines de l'unité</h3>
  <div class="statement">Soit \(n \in \mathbb{N}^*\). On note \(\omega = e^{2i\pi/n}\) et \(\mathbb{U}_n = \{1, \omega, \omega^2, \ldots, \omega^{n-1}\}\).</div>
  <div class="q"><strong>Q1.</strong> Donner explicitement \(\mathbb{U}_6\) sous forme \(a + ib\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\sum_{k=0}^{n-1} \omega^k\) pour \(n \geq 2\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\prod_{k=0}^{n-1} \omega^k\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega = e^{i\pi/3} = 1/2 + i\sqrt{3}/2\). Les 6 racines : \(\{1, e^{i\pi/3}, e^{2i\pi/3}, e^{i\pi}, e^{4i\pi/3}, e^{5i\pi/3}\}\). Forme algébrique :
    $$\begin{gathered} \Big\{1,\ \tfrac{1}{2}+i\tfrac{\sqrt{3}}{2},\ -\tfrac{1}{2}+i\tfrac{\sqrt{3}}{2}, \\ -1,\ -\tfrac{1}{2}-i\tfrac{\sqrt{3}}{2},\ \tfrac{1}{2}-i\tfrac{\sqrt{3}}{2}\Big\} . \end{gathered}$$</p>
    <p><strong>Q2.</strong> Somme géométrique de raison \(\omega \neq 1\) : \(\sum_{k=0}^{n-1} \omega^k = \dfrac{\omega^n - 1}{\omega - 1} = \dfrac{1-1}{\omega-1} = 0\).</p>
    <p><strong>Q3.</strong> Produit : $$\prod_{k=0}^{n-1} \omega^k = \omega^{0+1+\cdots+(n-1)} = \omega^{n(n-1)/2} = e^{i\pi(n-1)} = (-1)^{n-1} .$$</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Linéarisation et calcul d'intégrale</h3>
  <div class="statement">Soit \(\theta \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Linéariser \(\cos^4\theta\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(\displaystyle\int_0^{\pi/2} \cos^4\theta\,\mathrm{d}\theta\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> $$\cos^4\theta = \left(\dfrac{e^{i\theta} + e^{-i\theta}}{2}\right)^4 = \dfrac{1}{16}\sum_{k=0}^{4} \binom{4}{k} e^{i(4-2k)\theta} .$$
    Coefficients binomiaux : $$\binom{4}{0}=1, \binom{4}{1}=4, \binom{4}{2}=6, \binom{4}{3}=4, \binom{4}{4}=1 .$$ Termes : \(e^{4i\theta} + 4e^{2i\theta} + 6 + 4e^{-2i\theta} + e^{-4i\theta}\). Regrouper :
    $$\cos^4\theta = \dfrac{1}{16}\left(2\cos(4\theta) + 8\cos(2\theta) + 6\right) = \dfrac{\cos(4\theta) + 4\cos(2\theta) + 3}{8}$$</p>
    <p><strong>Q2.</strong> Intégration de la forme linéarisée (chaque \(\cos(k\theta)\) s'intègre facilement) :
    $$\begin{aligned} \int_0^{\pi/2}\cos^4\theta\,\mathrm{d}\theta &= \dfrac{1}{8}\left[\dfrac{\sin(4\theta)}{4} + 2\sin(2\theta) + 3\theta\right]_0^{\pi/2} \\ &= \dfrac{1}{8}\left[0 + 0 + \dfrac{3\pi}{2} - 0\right] = \dfrac{3\pi}{16} . \end{aligned}$$</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Somme trigonométrique et angle moitié</h3>
  <div class="statement">Soit \(n \in \mathbb{N}^*\) et \(\theta \in \mathbb{R}\), \(\theta \not\equiv 0 \pmod{2\pi}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(S_n = \sum_{k=0}^{n-1} e^{ik\theta}\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(C_n = \sum_{k=0}^{n-1} \cos(k\theta)\) et \(S'_n = \sum_{k=0}^{n-1} \sin(k\theta)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Somme géométrique de raison \(q = e^{i\theta} \neq 1\) : \(S_n = \dfrac{1 - e^{in\theta}}{1 - e^{i\theta}}\). Angle moitié au numérateur et dénominateur :
    \(1 - e^{in\theta} = -2i\sin(n\theta/2)\,e^{in\theta/2}\),
    \(1 - e^{i\theta} = -2i\sin(\theta/2)\,e^{i\theta/2}\).
    Donc :
    $$S_n = \dfrac{\sin(n\theta/2)}{\sin(\theta/2)}\,e^{i(n-1)\theta/2}$$</p>
    <p><strong>Q2.</strong> $$C_n = \mathrm{Re}(S_n) = \dfrac{\sin(n\theta/2)}{\sin(\theta/2)}\,\cos\!\left(\dfrac{(n-1)\theta}{2}\right) .$$ De même : \(S'_n = \dfrac{\sin(n\theta/2)}{\sin(\theta/2)}\,\sin\!\left(\dfrac{(n-1)\theta}{2}\right)\).</p>
    <p><em>Remarque :</em> ces sommes apparaissent dans le calcul des interférences à \(N\) ondes (figures de diffraction).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Géométrie : une rotation suivie d'une homothétie de même centre</h3>
  <div class="statement">On considère l'application \(f\) du plan complexe dans lui-même définie par \(f(z) = (1+i)z + 2 - i\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f\) admet un unique point fixe \(\Omega\). Donner son affixe \(\omega\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(f(z) - \omega = (1+i)(z - \omega)\) pour tout \(z\). En déduire que \(f\) est la composée de la rotation de centre \(\Omega\) et d'angle \(\frac\pi4\) et de l'homothétie de centre \(\Omega\) et de rapport \(\sqrt2\).</div>
  <div class="q"><strong>Q3.</strong> Calculer l'image par \(f\) du point \(M\) d'affixe \(1\) et vérifier le résultat de Q2 sur ce point.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> $$\begin{aligned} f(z) = z &\iff (1+i)z + 2 - i = z \iff iz = -2 + i \\ &\iff z = \dfrac{-2+i}{i} = (-2+i)(-i) = 1 + 2i . \end{aligned}$$ Un seul point fixe : \(\Omega\) d'affixe \(\omega = 1 + 2i\).</p>
    <p><strong>Q2.</strong> Puisque \(f(\omega) = \omega\), on soustrait : $$f(z) - \omega = f(z) - f(\omega) = (1+i)(z - \omega) .$$ Or \(1 + i = \sqrt2\,e^{i\pi/4}\). L'application \(z \mapsto \omega + e^{i\pi/4}(z - \omega)\) est la rotation de centre \(\Omega\) et d'angle \(\frac\pi4\) (on se ramène à l'origine, on tourne, on revient) ; \(z \mapsto \omega + \sqrt2\,(z - \omega)\) est l'homothétie de centre \(\Omega\) et de rapport \(\sqrt2\). Les composer (dans un ordre ou dans l'autre) donne \(z \mapsto \omega + \sqrt2\,e^{i\pi/4}(z - \omega) = f(z)\).</p>
    <p><strong>Q3.</strong> \(f(1) = 1 + i + 2 - i = 3\). Contrôle : \(\dfrac{3 - \omega}{1 - \omega} = \dfrac{2 - 2i}{-2i} = \dfrac{(2 - 2i)\,i}{2} = 1 + i\) : le rapport des distances \(\Omega M'/\Omega M\) vaut \(|1 + i| = \sqrt2\) (\(2\sqrt2\) contre \(2\)) et l'angle \((\overrightarrow{\Omega M}, \overrightarrow{\Omega M'})\) vaut \(\frac\pi4\).</p>
    <p><em>Remarque :</em> toute application \(z \mapsto az + b\) avec \(a \neq 0\), \(a \neq 1\) se décompose ainsi autour de son point fixe ; l'étude générale de ces « similitudes directes » est hors programme (fin du cours), mais ce calcul n'utilise que des outils du programme.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Formule de Moivre : valeurs exactes de \(\cos\frac{\pi}{10}\) et \(\sin\frac{\pi}{10}\)</h3>
  <div class="statement">On note \(c = \cos t\) et \(s = \sin t\) pour \(t\) réel.</div>
  <div class="q"><strong>Q1.</strong> À l'aide de la formule de Moivre, exprimer \(\cos 5t\) comme un polynôme en \(c\).</div>
  <div class="q"><strong>Q2.</strong> En déduire que \(x = \cos\frac{\pi}{10}\) vérifie \(16x^4 - 20x^2 + 5 = 0\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(\cos^2\frac{\pi}{10}\), puis \(\cos\frac{\pi}{10}\) et \(\sin\frac{\pi}{10}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\cos 5t = \operatorname{Re}\big((c + is)^5\big)\). Dans le binôme, les termes réels sont ceux où \(i\) apparaît à une puissance paire : $$\cos 5t = c^5 - 10c^3s^2 + 5cs^4 .$$ Avec \(s^2 = 1 - c^2\) : $$\begin{aligned} &c^5 - 10c^3(1 - c^2) + 5c(1 - 2c^2 + c^4) \\ &= 16c^5 - 20c^3 + 5c . \end{aligned}$$</p>
    <p><strong>Q2.</strong> Pour \(t = \frac{\pi}{10}\), \(\cos 5t = \cos\frac\pi2 = 0\), donc \(x(16x^4 - 20x^2 + 5) = 0\), et \(x \neq 0\) (car \(\frac\pi{10} \in \left]0, \frac\pi2\right[\)) : \(16x^4 - 20x^2 + 5 = 0\).</p>
    <p><strong>Q3.</strong> \(X = x^2\) est racine de \(16X^2 - 20X + 5 = 0\), de discriminant \(400 - 320 = 80\) : \(X = \frac{20 \pm \sqrt{80}}{32} = \frac{5 \pm \sqrt5}{8}\). Pour choisir : \(\frac{\pi}{10} \lt \frac\pi4\), donc \(\cos^2\frac\pi{10} \gt \cos^2\frac\pi4 = \frac12\), et seule \(\frac{5 + \sqrt5}{8} \approx 0{,}905\) convient (\(\frac{5 - \sqrt5}{8} \approx 0{,}345\) est \(\cos^2\frac{3\pi}{10}\), l'autre angle dont le cosinus annule \(\cos 5t\)). Comme \(\cos\frac\pi{10} \gt 0\) :
    $$\begin{gathered} \cos\frac{\pi}{10} = \sqrt{\frac{5 + \sqrt5}{8}} \approx 0{,}951, \\ \sin^2\frac{\pi}{10} = 1 - \frac{5 + \sqrt5}{8} = \frac{3 - \sqrt5}{8} . \end{gathered}$$
    Or \(\left(\frac{\sqrt5 - 1}{4}\right)^2 = \frac{6 - 2\sqrt5}{16} = \frac{3 - \sqrt5}{8}\), et \(\sin\frac\pi{10} \gt 0\) : \(\sin\frac{\pi}{10} = \frac{\sqrt5 - 1}{4} \approx 0{,}309\) (c'est le sinus de 18°).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Angle moitié : forme trigonométrique, quotient, équation</h3>
  <div class="statement">Soit \(\theta \in \,]0, 2\pi[\).</div>
  <div class="q"><strong>Q1.</strong> Mettre \(1 + e^{i\theta}\) sous forme trigonométrique, en distinguant selon les valeurs de \(\theta\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(Z = \dfrac{1 + e^{i\theta}}{1 - e^{i\theta}}\) est imaginaire pur et l'exprimer à l'aide de \(\theta\). Contrôler pour \(\theta = \frac\pi2\).</div>
  <div class="q"><strong>Q3.</strong> Résoudre dans \([0, 2\pi[\) l'équation \(\sin x + \sin 2x + \sin 3x = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Par l'angle moitié, \(1 + e^{i\theta} = 2\cos\frac\theta2\,e^{i\theta/2}\), avec \(\frac\theta2 \in \left]0, \pi\right[\). Si \(\theta \in \left]0, \pi\right[\), \(\cos\frac\theta2 \gt 0\) : module \(2\cos\frac\theta2\), argument \(\frac\theta2\). Si \(\theta = \pi\), \(1 + e^{i\pi} = 0\) n'a pas de forme trigonométrique. Si \(\theta \in \left]\pi, 2\pi\right[\), \(\cos\frac\theta2 \lt 0\) : \(1 + e^{i\theta} = \left(-2\cos\frac\theta2\right)e^{i(\theta/2 + \pi)}\), module \(-2\cos\frac\theta2\), argument \(\frac\theta2 + \pi\).</p>
    <p><strong>Q2.</strong> \(1 - e^{i\theta} = -2i\sin\frac\theta2\,e^{i\theta/2} \neq 0\) car \(\sin\frac\theta2 \gt 0\). Donc
    $$Z = \frac{2\cos\frac\theta2\,e^{i\theta/2}}{-2i\sin\frac\theta2\,e^{i\theta/2}} = \frac{\cos\frac\theta2}{-i\sin\frac\theta2} = i\,\frac{\cos\frac\theta2}{\sin\frac\theta2},$$
    car \(\frac{1}{-i} = i\) : \(Z\) est imaginaire pur. Pour \(\theta = \frac\pi2\) : \(\frac{1 + i}{1 - i} = \frac{(1 + i)^2}{2} = i\), et la formule donne \(i\,\frac{\cos(\pi/4)}{\sin(\pi/4)} = i\).</p>
    <p><strong>Q3.</strong> On factorise \(\sin x + \sin 3x = 2\sin 2x\cos x\) (somme en produit, retrouvée par l'angle moitié). L'équation devient \(\sin 2x\,(2\cos x + 1) = 0\). D'une part \(\sin 2x = 0 \iff x \equiv 0\ \left[\frac\pi2\right]\) ; d'autre part \(\cos x = -\frac12 \iff x \equiv \pm\frac{2\pi}{3}\ [2\pi]\). Solutions dans \([0, 2\pi[\) : \(0, \frac\pi2, \frac{2\pi}{3}, \pi, \frac{4\pi}{3}, \frac{3\pi}{2}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Racines \(n\)-ièmes et équation se ramenant au second degré</h3>
  <div class="q"><strong>Q1.</strong> Résoudre \(z^4 = -8 - 8i\sqrt3\). Donner les solutions sous forme trigonométrique et algébrique.</div>
  <div class="q"><strong>Q2.</strong> Résoudre \(z^6 + 7z^3 - 8 = 0\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la somme et le produit des six solutions de Q2.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(|-8 - 8i\sqrt3| = \sqrt{64 + 192} = 16\), et $$-8 - 8i\sqrt3 = 16\left(-\frac12 - i\frac{\sqrt3}{2}\right) = 16\,e^{-2i\pi/3} .$$ Les solutions sont \(z_k = 16^{1/4}\,e^{i\left(-\frac\pi6 + \frac{k\pi}{2}\right)} = 2\,e^{i\left(-\frac\pi6 + \frac{k\pi}{2}\right)}\), \(k = 0, 1, 2, 3\) :
    $$\begin{gathered} 2e^{-i\pi/6} = \sqrt3 - i, \qquad 2e^{i\pi/3} = 1 + i\sqrt3, \\ 2e^{5i\pi/6} = -\sqrt3 + i, \qquad 2e^{4i\pi/3} = -1 - i\sqrt3 . \end{gathered}$$
    Contrôle : \((1 + i\sqrt3)^4 = 16\,e^{4i\pi/3} = -8 - 8i\sqrt3\). Les quatre points forment un carré inscrit dans le cercle de rayon 2.</p>
    <p><strong>Q2.</strong> On pose \(w = z^3\) : \(w^2 + 7w - 8 = 0\), de racines \(w = 1\) et \(w = -8\) (produit \(-8\), somme \(-7\)). \(z^3 = 1\) donne \(1, j, j^2\) ; \(z^3 = -8\) donne \(-2, -2j, -2j^2\), c'est-à-dire \(-2\), \(1 - i\sqrt3\), \(1 + i\sqrt3\). Six solutions distinctes.</p>
    <p><strong>Q3.</strong> Somme : \((1 + j + j^2) - 2(1 + j + j^2) = 0\). Produit : $$(1 \cdot j \cdot j^2) \times (-2)^3 (1 \cdot j \cdot j^2) = 1 \times (-8) \times 1 = -8 ,$$ car \(j^3 = 1\). On retrouve les relations entre coefficients et racines du chapitre « Polynômes » : somme \(-\frac{0}{1}\), produit \((-1)^6 \times \frac{-8}{1}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Exponentielle complexe et oscillation amortie</h3>
  <div class="q"><strong>Q1.</strong> Résoudre \(e^z = -\sqrt3 + i\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les complexes \(z\) tels que \(e^z = e^{\overline z}\), puis ceux tels que \(|e^{iz}| = 1\).</div>
  <div class="q"><strong>Q3.</strong> On pose \(\lambda = -0{,}2 + 2\pi i\) (en \(\text{s}^{-1}\)) et \(x(t) = \operatorname{Re}\big(e^{\lambda t}\big)\). Écrire \(x(t)\) à l'aide de fonctions réelles, donner sa pseudo-période \(T\), le rapport \(\frac{x(t + T)}{x(t)}\), et le temps au bout duquel l'amplitude est divisée par 10.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(-\sqrt3 + i = 2\,e^{5i\pi/6}\) (§4 du cours). Donc $$e^z = 2e^{5i\pi/6} \iff z = \ln 2 + i\left(\frac{5\pi}{6} + 2k\pi\right) ,$$ \(k \in \mathbb Z\).</p>
    <p><strong>Q2.</strong> $$\begin{aligned} e^z = e^{\overline z} &\iff z - \overline z \in 2i\pi\mathbb Z \\ &\iff 2i\operatorname{Im} z \in 2i\pi\mathbb Z \iff \operatorname{Im} z \in \pi\mathbb Z \ : \end{aligned}$$ des droites horizontales. Avec \(z = x + iy\), \(iz = -y + ix\) et \(|e^{iz}| = e^{-y}\) : \(|e^{iz}| = 1 \iff y = 0 \iff z\) réel.</p>
    <p><strong>Q3.</strong> \(e^{\lambda t} = e^{-0{,}2t}\,e^{2i\pi t}\), donc \(x(t) = e^{-0{,}2t}\cos(2\pi t)\). La pseudo-période est \(T = \frac{2\pi}{2\pi} = 1\) s, et \(\frac{x(t + T)}{x(t)} = e^{-0{,}2} \approx 0{,}819\) (quand \(x(t) \neq 0\)) : l'amplitude perd environ 18 % à chaque oscillation. Elle est divisée par 10 quand \(e^{-0{,}2t} = \frac{1}{10}\), soit \(t = 5\ln 10 \approx 11{,}5\) s, environ 11 oscillations et demie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Géométrie : triangle équilatéral et cercle de diamètre donné</h3>
  <div class="statement">On note \(j = e^{2i\pi/3}\). Soient \(A\), \(B\), \(C\) trois points distincts d'affixes \(a\), \(b\), \(c\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(ABC\) est équilatéral direct (c'est-à-dire \(AB = AC\) et \((\overrightarrow{AB}, \overrightarrow{AC}) \equiv \frac\pi3\ [2\pi]\)) si et seulement si \(c - a = e^{i\pi/3}(b - a)\).</div>
  <div class="q"><strong>Q2.</strong> Vérifier que \(e^{i\pi/3} = -j^2\), puis montrer que \(ABC\) est équilatéral direct si et seulement si \(a + jb + j^2c = 0\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(a = 1 + i\) et \(b = 4 + 2i\), déterminer \(c\) tel que \(ABC\) soit équilatéral direct, et contrôler par Q2.</div>
  <div class="q"><strong>Q4.</strong> Déterminer l'ensemble des points \(M\) d'affixe \(z \neq 1\) tels que \(\dfrac{z - i}{z - 1}\) soit imaginaire pur (on admet 0 comme imaginaire pur).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le quotient \(Z = \frac{c - a}{b - a}\) a pour module \(\frac{AC}{AB}\) et pour argument \((\overrightarrow{AB}, \overrightarrow{AC})\) (cours, §10). Donc \(AB = AC\) et \((\overrightarrow{AB}, \overrightarrow{AC}) \equiv \frac\pi3\) si et seulement si \(Z = 1 \cdot e^{i\pi/3}\). Un triangle isocèle en \(A\) d'angle \(\frac\pi3\) en \(A\) est équilatéral.</p>
    <p><strong>Q2.</strong> \(j^2 = e^{4i\pi/3} = e^{i\pi}e^{i\pi/3} = -e^{i\pi/3}\). La condition devient \(c - a = -j^2(b - a)\), soit \(c + j^2 b - (1 + j^2)a = 0\). Comme \(1 + j + j^2 = 0\), \(1 + j^2 = -j\) : \(c + j^2 b + ja = 0\). En multipliant par \(j^2\) (non nul) et avec \(j^3 = 1\), \(j^4 = j\) : \(j^2c + jb + a = 0\).</p>
    <p><strong>Q3.</strong> $$c = a + e^{i\pi/3}(b - a) = 1 + i + \left(\frac12 + i\frac{\sqrt3}{2}\right)(3 + i) .$$ Or \(\left(\frac12 + i\frac{\sqrt3}{2}\right)(3 + i) = \frac{3 - \sqrt3}{2} + i\,\frac{1 + 3\sqrt3}{2}\), donc
    $$c = \frac{5 - \sqrt3}{2} + i\,\frac{3 + 3\sqrt3}{2} \approx 1{,}634 + 4{,}098\,i .$$
    Contrôle numérique de \(a + jb + j^2c\) avec \(j \approx -0{,}5 + 0{,}866\,i\) : on trouve 0 (à \(10^{-15}\) près) ; et \(AB = AC = \sqrt{10}\).</p>
    <p><strong>Q4.</strong> Notons \(A(i)\) et \(B(1)\). Pour \(z = i\), le quotient est nul : \(A\) convient. Pour \(z \neq i, 1\), \(\frac{z - i}{z - 1}\) est imaginaire pur si et seulement si \((\overrightarrow{MB}, \overrightarrow{MA}) \equiv \frac\pi2\ [\pi]\), c'est-à-dire \((MA) \perp (MB)\) : \(M\) est sur le cercle de diamètre \([AB]\). Réponse : le cercle de diamètre \([AB]\) (centre \(\frac{1 + i}{2}\), rayon \(\frac{\sqrt2}{2}\)), privé de \(B\). Vérification par le calcul, avec \(z = x + iy\) : $$\operatorname{Re}\big((z - i)(\overline z - 1)\big) = x^2 + y^2 - x - y = 0 ,$$ soit \(\left(x - \frac12\right)^2 + \left(y - \frac12\right)^2 = \frac12\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Racines cubiques, linéarisation et courants triphasés</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format de l'épreuve de Mathématiques PT (thème <em>nombres complexes</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    On travaille dans \(\mathbb{C}\) ; on note \(j = e^{2i\pi/3}\). Les parties B et C utilisent les résultats de la partie A.
  </div>

  <figure class="schema" style="max-width:230px">

  <p class="exo-part">Partie A — Racines cubiques de 8</p>
  <div class="q"><strong>A1.</strong> Résoudre \(z^3 = 8\) dans \(\mathbb{C}\). Donner les solutions sous forme exponentielle et algébrique.</div>
  <div class="q"><strong>A2.</strong> Représenter les solutions et montrer que leur somme est nulle. Plus généralement, montrer que pour tout réel \(\varphi\), \(e^{i\varphi} + e^{i(\varphi - 2\pi/3)} + e^{i(\varphi - 4\pi/3)} = 0\).</div>

  <p class="exo-part">Partie B — Linéarisation</p>
  <div class="q"><strong>B1.</strong> À l'aide des formules d'Euler, linéariser \(\cos^3\theta\).</div>
  <div class="q"><strong>B2.</strong> Pour \(\theta\) réel, on pose \(\theta_k = \theta - \frac{2k\pi}{3}\) (\(k = 0, 1, 2\)). Montrer que \(\sum_{k=0}^{2}\cos\theta_k = 0\) et que \(\sum_{k=0}^{2}\cos^2\theta_k = \frac32\).</div>
  <div class="q"><strong>B3.</strong> En déduire \(\sum_{k=0}^{2}\cos^3\theta_k\) en fonction de \(\cos 3\theta\).</div>

  <p class="exo-part">Partie C — Courants triphasés</p>
  <div class="statement">Trois résistances identiques \(R\) sont parcourues par les courants \(i_k(t) = I\sqrt2\,\cos\left(\omega t - \frac{2k\pi}{3}\right)\), \(k = 0, 1, 2\) (\(I \gt 0\) est la valeur efficace).</div>
  <div class="q"><strong>C1.</strong> Montrer que \(i_0(t) + i_1(t) + i_2(t) = 0\) à chaque instant.</div>
  <div class="q"><strong>C2.</strong> Montrer que la puissance totale reçue \(p(t) = R\big(i_0^2 + i_1^2 + i_2^2\big)\) est constante, et la calculer pour \(I = 10\) A et \(R = 22\ \Omega\).</div>
  <div class="q"><strong>C3.</strong> Que vaut \(\sum_{k=0}^{2} i_k(t)^3\) ? Est-il nul en général ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(z^3 = 8 = 8e^{i\,0}\). Module \(|z| = 2\), arguments \(\frac{2k\pi}{3}\) (\(k=0,1,2\)) : \(z_0 = 2\) ; \(z_1 = 2e^{i2\pi/3} = -1 + i\sqrt3\) ; \(z_2 = 2e^{i4\pi/3} = -1 - i\sqrt3\).</p>
    <p><strong>A2.</strong> Les trois points sont sur le cercle de rayon 2, espacés de 120° (triangle équilatéral). Somme : $$z_0+z_1+z_2 = 2 + (-1+i\sqrt3) + (-1-i\sqrt3) = 0$$ (le coefficient de \(z^2\) dans \(z^3-8\) est nul). En général, \(e^{i(\varphi - 2\pi/3)} = e^{i\varphi}\,\overline j = e^{i\varphi} j^2\) et \(e^{i(\varphi - 4\pi/3)} = e^{i\varphi} j\), donc la somme vaut \(e^{i\varphi}(1 + j^2 + j) = 0\) : c'est la somme des racines cubiques de \(e^{3i\varphi}\).</p>
    <p><strong>B1.</strong> \(\cos\theta = \frac{e^{i\theta}+e^{-i\theta}}{2}\), donc $$\begin{aligned} \cos^3\theta &= \frac{1}{8}\bigl(e^{i\theta}+e^{-i\theta}\bigr)^3 = \frac{1}{8}\bigl(e^{3i\theta} + 3e^{i\theta} + 3e^{-i\theta} + e^{-3i\theta}\bigr) \\ &= \frac{1}{8}\bigl(2\cos3\theta + 6\cos\theta\bigr) = \frac{1}{4}\cos3\theta + \frac{3}{4}\cos\theta . \end{aligned}$$</p>
    <p><strong>B2.</strong> \(\sum\cos\theta_k = \operatorname{Re}\sum e^{i\theta_k} = 0\) par A2 (\(\varphi = \theta\)). Puis \(\cos^2\theta_k = \frac{1 + \cos 2\theta_k}{2}\), et \(2\theta_k = 2\theta - \frac{4k\pi}{3}\) : pour \(k = 0, 1, 2\), les angles \(\frac{4k\pi}{3}\) valent \(0, \frac{4\pi}{3}, \frac{8\pi}{3} \equiv \frac{2\pi}{3}\), donc \(\sum e^{2i\theta_k} = e^{2i\theta}(1 + j + j^2) = 0\). D'où \(\sum\cos^2\theta_k = \frac32 + \frac12 \times 0 = \frac32\).</p>
    <p><strong>B3.</strong> Par B1, \(\sum\cos^3\theta_k = \frac34\sum\cos\theta_k + \frac14\sum\cos 3\theta_k\). Or \(3\theta_k = 3\theta - 2k\pi\), donc \(\cos 3\theta_k = \cos 3\theta\) pour les trois valeurs de \(k\). Ainsi \(\sum_{k=0}^{2}\cos^3\theta_k = 0 + \frac34\cos 3\theta = \frac34\cos 3\theta\).</p>
    <p><strong>C1.</strong> Avec \(\theta = \omega t\), \(i_0 + i_1 + i_2 = I\sqrt2\sum\cos\theta_k = 0\) (B2) : en triphasé équilibré, le courant de retour dans le fil neutre est nul. Géométriquement, les trois amplitudes complexes \(I\sqrt2\,e^{-2ik\pi/3}\) forment, comme en A, un triangle équilatéral centré en 0.</p>
    <p><strong>C2.</strong> $$p(t) = R \cdot 2I^2\sum\cos^2\theta_k = R \cdot 2I^2 \cdot \frac32 = 3RI^2 \ :$$ constante (alors qu'en monophasé, la puissance \(2RI^2\cos^2\omega t\) oscille entre 0 et \(2RI^2\)). Numériquement : \(3 \times 22 \times 10^2 = 6\,600\) W.</p>
    <p><strong>C3.</strong> $$\sum i_k^3 = (I\sqrt2)^3 \cdot \frac34\cos(3\omega t) = \frac{3\sqrt2}{2}I^3\cos 3\omega t$$ par B3 : ce n'est pas nul en général. Les termes de fréquence triple ne se compensent pas : c'est ce qui rend gênants, en électrotechnique, les harmoniques de rang 3.</p>
  </div>
