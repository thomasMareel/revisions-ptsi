  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la section « Nombres complexes » du programme de PTSI (premier semestre) : calcul algébrique dans \(\mathbb C\), conjugué et module, nombres de module 1 et trigonométrie, forme trigonométrique, équations algébriques, racines \(n\)-ièmes, exponentielle complexe et interprétation géométrique. Les formules de trigonométrie elles-mêmes (cercle trigonométrique, formules d'addition et de duplication, tangente) sont dans le chapitre <a href="#fonctions/cours">« Fonctions réelles — généralités »</a> (§8 et §9) ; les sommes \(\sum\) et la formule du binôme dans le chapitre <a href="#calculs/cours">« Calculs algébriques et arithmétique »</a>. Les complexes servent ensuite partout : polynômes, équations différentielles, géométrie, et en physique le régime sinusoïdal (où l'on écrit \(j\) au lieu de \(i\)). L'onglet <a href="#complexes/simu">Simulateur</a> montre l'effet géométrique des opérations.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Forme algébrique</strong> : parties réelle et imaginaire, opérations ; brève extension à \(\mathbb C\) du calcul de \(\sum_{k=0}^{n} x^k\), de la factorisation de \(a^n - b^n\) et de la formule du binôme ; point et vecteur du plan associés à un complexe, affixe (« plan complexe ») (§1).</li>
        <li><strong>Conjugaison et module</strong> : compatibilité de la conjugaison avec les opérations, image du conjugué ; \(|z|^2 = z\overline z\), module d'un produit, d'un quotient ; interprétation de \(|z - z_0|\), cercles et disques ; inégalité triangulaire et cas d'égalité (§2).</li>
        <li><strong>Nombres de module 1</strong> : le cercle trigonométrique identifié à \(\mathbb U\), définition de \(e^{it}\), exponentielle d'une somme, formules d'Euler, formule de Moivre (§3).</li>
        <li><strong>Forme trigonométrique</strong> \(r e^{i\theta}\) (\(r \gt 0\)) d'un complexe non nul, arguments, arguments d'un produit, d'un quotient ; transformation de \(a\cos t + b\sin t\) en \(A\cos(t - \varphi)\) (§4).</li>
        <li><strong>Technique de l'angle moitié</strong> : factorisation de \(1 \pm e^{it}\), de \(e^{ip} \pm e^{iq}\) ; savoir retrouver \(\cos p \pm \cos q\), \(\sin p \pm \sin q\) (§5).</li>
        <li><strong>Linéarisation</strong>, calcul de \(\sum_{k=0}^{n} \cos(kt)\) et de \(\sum_{k=0}^{n} \sin(kt)\) ; savoir retrouver \(\cos(nt)\) et \(\sin(nt)\) en fonction de \(\cos t\) et \(\sin t\) (§6).</li>
        <li><strong>Équations algébriques</strong> : factorisation de \(P(z)\) par \(z - a\) si \(a\) est racine ; racines carrées d'un complexe donné sous forme algébrique ; équation du second degré dans \(\mathbb C\), somme et produit des racines (§7).</li>
        <li><strong>Racines \(n\)-ièmes</strong> de l'unité (notation \(\mathbb U_n\)) et d'un complexe non nul donné sous forme trigonométrique ; représentation géométrique (§8).</li>
        <li><strong>Exponentielle complexe</strong> \(e^z = e^{\operatorname{Re} z}\, e^{i \operatorname{Im} z}\), module et arguments de \(e^z\), exponentielle d'une somme ; \(e^z = e^{z'}\) si et seulement si \(z - z' \in 2i\pi\mathbb Z\) (§9).</li>
        <li><strong>Interprétation géométrique</strong> du module et des arguments de \(\frac{c - a}{b - a}\), traduction de l'alignement et de l'orthogonalité ; interprétation de \(z \mapsto az\) et \(z \mapsto z + b\) (translations, homothéties, rotations) et de la conjugaison (§10).</li>
      </ul>
      <p>Hors programme : la construction de \(\mathbb C\) et l'étude générale des similitudes \(z \mapsto az + b\), présentées brièvement en fin de chapitre pour aller plus loin. Le lien avec le produit scalaire et le produit mixte est dans le chapitre <a href="#geometrie/cours">« Géométrie du plan »</a> (§10) ; le théorème de d'Alembert-Gauss dans le chapitre <a href="#polynomes/cours">« Polynômes »</a> (§9).</p>

<div class="course-section">
  <div class="sec-num">§1 · FORME ALGÉBRIQUE ET PLAN COMPLEXE</div>
  <h2>Calculer avec \(i\), dessiner dans le plan</h2>
  <div class="intro">L'équation \(x^2 = -1\) n'a pas de solution réelle. On ajoute aux réels un nombre \(i\) tel que \(i^2 = -1\), et l'on calcule avec les règles habituelles : on obtient l'ensemble \(\mathbb C\) des nombres complexes, où toute équation du second degré a des solutions et où les rotations du plan deviennent des multiplications.</div>

  <div class="def-box">
    Tout nombre complexe \(z\) s'écrit de façon unique \(z = a + ib\) avec \(a\), \(b\) <strong>réels</strong> : c'est sa <strong>forme algébrique</strong>. Le réel \(a = \operatorname{Re} z\) est sa <strong>partie réelle</strong>, le réel \(b = \operatorname{Im} z\) sa <strong>partie imaginaire</strong>. Le complexe \(z\) est réel si \(\operatorname{Im} z = 0\), <strong>imaginaire pur</strong> si \(\operatorname{Re} z = 0\) ; on note \(i\mathbb R\) l'ensemble des imaginaires purs. L'unicité donne l'identification : \(a + ib = a' + ib'\) si et seulement si \(a = a'\) et \(b = b'\).
  </div>
  <p>On additionne et on multiplie comme avec des polynômes en \(i\), en remplaçant \(i^2\) par \(-1\) :</p>
  <div class="formula" data-nom="Produit sous forme algébrique">$$(a + ib)(c + id) = (ac - bd) + i\,(ad + bc).$$</div>
  <p>Ces opérations ont les mêmes propriétés que dans \(\mathbb R\) (associativité, commutativité, distributivité). Tout complexe non nul a un inverse : pour \((a, b) \neq (0, 0)\), \(\dfrac{1}{a + ib} = \dfrac{a - ib}{a^2 + b^2}\), car \((a + ib)(a - ib) = a^2 + b^2\) est un réel non nul. Pour mettre un quotient sous forme algébrique, on multiplie donc le numérateur et le dénominateur par le conjugué du dénominateur (§2). La construction rigoureuse de \(\mathbb C\) est hors programme.</p>

  <div class="prop-box">
    <strong>Brève extension des calculs de sommes.</strong> Les démonstrations faites dans \(\mathbb R\) (chapitre <a href="#calculs/cours">« Calculs algébriques et arithmétique »</a>, §3 et §5) n'utilisent que les règles de calcul ; elles restent valables pour des complexes \(a\), \(b\), \(z\) et \(n \in \mathbb N\) :
    <div class="formula" data-nom="Somme géométrique complexe">$$\begin{gathered} \sum_{k=0}^{n} z^k = \frac{1 - z^{n+1}}{1 - z}\quad (z \neq 1), \qquad a^n - b^n = (a - b)\sum_{k=0}^{n-1} a^{n-1-k}\,b^k, \\ (a + b)^n = \sum_{k=0}^{n} \binom nk a^k\,b^{n-k}. \end{gathered}$$</div>
  </div>

  <h3>Le plan complexe</h3>
  <p>On identifie \(\mathbb C\) au plan muni d'un repère orthonormé direct \((O, \vec u, \vec v)\) : au complexe \(z = x + iy\) on associe le point \(M(x, y)\) et le vecteur \(\vec w = x\vec u + y\vec v\). On dit que \(z\) est l'<strong>affixe</strong> de \(M\) et de \(\vec w\). L'axe des abscisses porte les réels, l'axe des ordonnées les imaginaires purs. Si \(A\) et \(B\) ont pour affixes \(a\) et \(b\), le vecteur \(\overrightarrow{AB}\) a pour affixe \(b - a\), et le milieu de \([AB]\) a pour affixe \(\frac{a + b}{2}\). La somme \(z + z'\) correspond à la somme des vecteurs : règle du parallélogramme.</p>

  <div class="method-box">
    <strong>Exemple — un quotient, une puissance, une somme</strong>
    <ol>
      <li>\(\dfrac{2 + 3i}{1 - 2i} = \dfrac{(2 + 3i)(1 + 2i)}{(1 - 2i)(1 + 2i)} = \dfrac{2 + 4i + 3i - 6}{1 + 4} = -\dfrac45 + \dfrac75\,i\).</li>
      <li>Par la formule du binôme, avec \(i^2 = -1\), \(i^3 = -i\), \(i^4 = 1\), \(i^5 = i\) :
      $$(1 + i)^5 = 1 + 5i + 10i^2 + 10i^3 + 5i^4 + i^5 = (1 - 10 + 5) + (5 - 10 + 1)\,i = -4 - 4i .$$
      Contrôle : \((1 + i)^2 = 2i\), donc \((1 + i)^4 = (2i)^2 = -4\) et \((1 + i)^5 = -4(1 + i)\).</li>
      <li>\(1 + i + i^2 + \cdots + i^{11} = \dfrac{1 - i^{12}}{1 - i} = 0\), car \(i^{12} = (i^4)^3 = 1\) : les puissances de \(i\) reviennent tous les 4 pas, et quatre termes consécutifs ont une somme nulle.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(ib\) pour la partie imaginaire de \(a + ib\) : c'est le <strong>réel</strong> \(b\). Ne jamais écrire d'inégalité entre complexes non réels (« \(z \gt 0\) » n'a de sens que si \(z\) est réel) : \(\mathbb C\) n'est pas ordonné. Et \(\frac{1}{a + ib} \neq \frac1a + \frac{1}{ib}\) : on passe par le conjugué.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CONJUGUÉ ET MODULE</div>
  <h2>Symétrie et distance</h2>
  <div class="intro">Le conjugué fait passer d'un point à son symétrique par rapport à l'axe réel ; le module mesure la distance à l'origine. Avec eux, on rend réel un dénominateur, on reconnaît un réel ou un imaginaire pur, et l'on décrit cercles et disques par une seule équation.</div>

  <div class="def-box">
    Le <strong>conjugué</strong> de \(z = a + ib\) (\(a\), \(b\) réels) est \(\overline z = a - ib\). Son <strong>module</strong> est le réel positif \(|z| = \sqrt{a^2 + b^2}\), distance de l'origine au point d'affixe \(z\). Pour \(z\) réel, \(|z|\) est la valeur absolue.
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> Pour tous complexes \(z\), \(z'\) :
    <ul>
      <li>\(\overline{\overline z} = z\), \(\overline{z + z'} = \overline z + \overline{z'}\), \(\overline{z z'} = \overline z\,\overline{z'}\), \(\overline{z/z'} = \overline z/\overline{z'}\) si \(z' \neq 0\), \(\overline{z^n} = \overline z^{\,n}\) ;</li>
      <li>\(\operatorname{Re} z = \dfrac{z + \overline z}{2}\), \(\operatorname{Im} z = \dfrac{z - \overline z}{2i}\) ; \(z\) est réel si et seulement si \(\overline z = z\), imaginaire pur si et seulement si \(\overline z = -z\) ;</li>
      <li>\(|z|^2 = z\,\overline z\) ; \(|z| = 0\) si et seulement si \(z = 0\) ; \(|\overline z| = |z|\) ; \(|\operatorname{Re} z| \le |z|\) et \(|\operatorname{Im} z| \le |z|\) ;</li>
      <li>\(|z z'| = |z|\,|z'|\), \(\left|\dfrac{z}{z'}\right| = \dfrac{|z|}{|z'|}\) si \(z' \neq 0\), \(|z^n| = |z|^n\) ; pour \(z \neq 0\), \(\dfrac1z = \dfrac{\overline z}{|z|^2}\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le module d'un produit, sans développer.</span>
    <div class="content"><p>Les règles sur le conjugué se vérifient en forme algébrique (pour le produit, développer les deux membres). Puis \(|z z'|^2 = (z z')\,\overline{z z'} = z\,\overline z\; z'\,\overline{z'} = |z|^2\,|z'|^2\), et l'on prend les racines carrées de ces réels positifs. Pour le quotient, \(z = \frac{z}{z'}\,z'\) donne \(|z| = \left|\frac{z}{z'}\right|\,|z'|\).</p></div>
  </div>
  <p><strong>Distance, cercles et disques.</strong> Si \(M\) et \(M_0\) ont pour affixes \(z\) et \(z_0\), \(|z - z_0| = M_0M\). Pour \(r \gt 0\), l'ensemble des \(z\) tels que \(|z - z_0| = r\) est le cercle de centre \(M_0\) et de rayon \(r\) ; \(|z - z_0| \le r\) décrit le disque fermé, \(|z - z_0| \lt r\) le disque ouvert. L'ensemble des \(z\) tels que \(|z - a| = |z - b|\) (\(a \neq b\)) est la médiatrice du segment joignant les points d'affixes \(a\) et \(b\).</p>

  <div class="prop-box">
    <strong>Inégalité triangulaire.</strong> Pour tous complexes \(z\), \(z'\) :
    <div class="formula" data-nom="Inégalité triangulaire">$$\big|\,|z| - |z'|\,\big| \le |z + z'| \le |z| + |z'| .$$</div>
    Il y a égalité \(|z + z'| = |z| + |z'|\) si et seulement si \(z' = 0\) ou \(z = \lambda z'\) avec \(\lambda\) réel positif : les vecteurs d'affixes \(z\) et \(z'\) ont même direction et même sens.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Développer \(|z + z'|^2\) et majorer une partie réelle par un module.</span>
    <div class="content"><p>$$\begin{aligned} |z + z'|^2 &= (z + z')(\overline z + \overline{z'}) = |z|^2 + |z'|^2 + z\overline{z'} + \overline z z' \\ &= |z|^2 + |z'|^2 + 2\operatorname{Re}(z\overline{z'}) , \end{aligned}$$ car \(\overline z z'\) est le conjugué de \(z\overline{z'}\). Or \(\operatorname{Re}(z\overline{z'}) \le |z\overline{z'}| = |z|\,|z'|\), d'où \(|z + z'|^2 \le (|z| + |z'|)^2\) et l'inégalité de droite. Égalité si et seulement si \(\operatorname{Re}(z\overline{z'}) = |z\overline{z'}|\), c'est-à-dire \(z\overline{z'} = \mu\) réel positif. Si \(z' \neq 0\), on multiplie par \(z'\) : \(z\,|z'|^2 = \mu z'\), soit \(z = \lambda z'\) avec \(\lambda = \mu/|z'|^2 \ge 0\) ; la réciproque est immédiate. L'inégalité de gauche s'obtient en écrivant \(z = (z + z') + (-z')\), d'où \(|z| \le |z + z'| + |z'|\), et de même en échangeant \(z\) et \(z'\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — modules sans développer, un disque, une impédance</strong>
    <ol>
      <li>\(Z = \dfrac{(3 + 4i)^3}{(1 - i)^4}\) : \(|3 + 4i| = 5\) et \(|1 - i| = \sqrt2\), donc \(|Z| = \dfrac{5^3}{(\sqrt2)^4} = \dfrac{125}{4}\). Développer d'abord aurait demandé deux puissances et un quotient.</li>
      <li>\(|z - 2 + i| \le 3\) s'écrit \(|z - (2 - i)| \le 3\) : disque fermé de centre le point d'affixe \(2 - i\), de rayon 3. Le point \(z = 4 + i\) y est : \(|2 + 2i| = 2\sqrt2 \approx 2{,}83 \le 3\).</li>
      <li>\(|z - 1| = |z + i|\) : \(z\) est équidistant des points d'affixes \(1\) et \(-i\), donc sur leur médiatrice. En posant \(z = x + iy\) : \((x - 1)^2 + y^2 = x^2 + (y + 1)^2\), soit \(y = -x\).</li>
      <li>En électricité, une bobine (\(R = 30\ \Omega\), \(L\omega = 40\ \Omega\)) a pour impédance complexe \(30 + 40j\) (on y écrit \(j\) pour \(i\)) : son module \(\sqrt{30^2 + 40^2} = 50\ \Omega\) est le rapport des amplitudes de la tension et du courant (chapitre <a href="#filtres/cours">« Régime sinusoïdal forcé et filtrage linéaire »</a>).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(|z|^2\) et \(z^2\). Pour \(z = 1 + i\), \(z^2 = 2i\) alors que \(|z|^2 = z\overline z = 2\). De même \(|z + z'| \neq |z| + |z'|\) en général : \(|1 + i| = \sqrt2 \lt 2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · NOMBRES DE MODULE 1, EXPONENTIELLE \(e^{i\theta}\)</div>
  <h2>Le cercle trigonométrique devient un ensemble de nombres</h2>
  <div class="intro">Les complexes de module 1 sont les points du cercle trigonométrique. La notation \(e^{i\theta}\) transforme l'addition des angles en multiplication : c'est elle qui donne les formules d'Euler et de Moivre, outils de toute la trigonométrie (§5, §6) et du traitement des signaux sinusoïdaux.</div>

  <div class="def-box">
    On note \(\mathbb U = \{z \in \mathbb C : |z| = 1\}\) l'ensemble des complexes de module 1 : dans le plan complexe, c'est le <strong>cercle trigonométrique</strong>. Pour tout réel \(\theta\), on pose
    <div class="formula" data-nom="Exponentielle i thêta">$$e^{i\theta} = \cos\theta + i\sin\theta .$$</div>
    Un complexe \(z\) est de module 1 si et seulement s'il existe un réel \(\theta\) tel que \(z = e^{i\theta}\) : si \(z = a + ib\) avec \(a^2 + b^2 = 1\), le point \((a, b)\) est sur le cercle trigonométrique, donc \(a = \cos\theta\) et \(b = \sin\theta\) pour un réel \(\theta\).
  </div>

</figure>
  <div class="prop-box">
    <strong>Propriétés de \(e^{i\theta}\).</strong> Pour tous réels \(\theta\), \(\theta'\) et tout entier \(n \in \mathbb Z\) :
    <div class="formula" data-nom="Exponentielle d'une somme">$$\begin{gathered} e^{i\theta}\,e^{i\theta'} = e^{i(\theta + \theta')}, \\ \frac{1}{e^{i\theta}} = e^{-i\theta} = \overline{e^{i\theta}}, \qquad \big(e^{i\theta}\big)^n = e^{in\theta} ; \end{gathered}$$</div>
    \(e^{i\theta} = e^{i\theta'}\) si et seulement si \(\theta \equiv \theta'\ [2\pi]\) ; en particulier \(e^{i\theta} = 1\) si et seulement si \(\theta \in 2\pi\mathbb Z\). Valeurs à connaître : \(e^{i\pi/2} = i\), \(e^{i\pi} = -1\), \(e^{2i\pi} = 1\), \(e^{i\pi/3} = \frac12 + i\frac{\sqrt3}{2}\), \(e^{i\pi/4} = \frac{\sqrt2}{2}(1 + i)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Les formules d'addition du cosinus et du sinus, et rien d'autre.</span>
    <div class="content"><p>$$\begin{aligned} e^{i\theta}e^{i\theta'} &= (\cos\theta\cos\theta' - \sin\theta\sin\theta') + i(\sin\theta\cos\theta' + \cos\theta\sin\theta') \\ &= \cos(\theta + \theta') + i\sin(\theta + \theta') \end{aligned}$$ par les formules d'addition (chapitre <a href="#fonctions/cours">« Fonctions réelles — généralités »</a>, §8). Avec \(\theta' = -\theta\) : \(e^{i\theta}e^{-i\theta} = e^{0} = 1\), et \(e^{-i\theta} = \cos\theta - i\sin\theta = \overline{e^{i\theta}}\). La puissance \(n \ge 0\) s'obtient par récurrence, puis \(n \lt 0\) par passage à l'inverse. Enfin \(e^{i\theta} = e^{i\theta'}\) équivaut à \(\cos\theta = \cos\theta'\) et \(\sin\theta = \sin\theta'\) : les deux réels repèrent le même point du cercle, ce qui équivaut à \(\theta \equiv \theta'\ [2\pi]\).</p></div>
  </div>
  <p>Ainsi \(\mathbb U\) est stable par produit et par passage à l'inverse : multiplier par \(e^{i\theta}\), c'est tourner de l'angle \(\theta\) autour de l'origine.</p>
  <div class="prop-box">
    <strong>Formules d'Euler et de Moivre.</strong> Pour tout réel \(\theta\) et tout \(n \in \mathbb Z\) :
    <div class="formula" data-nom="Formules d'Euler">$$\cos\theta = \frac{e^{i\theta} + e^{-i\theta}}{2}, \qquad \sin\theta = \frac{e^{i\theta} - e^{-i\theta}}{2i},$$</div>
    <div class="formula" data-nom="Formule de Moivre">$$(\cos\theta + i\sin\theta)^n = \cos(n\theta) + i\sin(n\theta).$$</div>
    Euler découle de \(\operatorname{Re} z = \frac{z + \overline z}{2}\) et \(\operatorname{Im} z = \frac{z - \overline z}{2i}\) appliqués à \(z = e^{i\theta}\) ; Moivre n'est autre que \(\big(e^{i\theta}\big)^n = e^{in\theta}\).
  </div>

  <div class="method-box">
    <strong>Exemple — une valeur exacte par un produit d'exponentielles</strong>
    <ol>
      <li>\(\frac{7\pi}{12} = \frac\pi3 + \frac\pi4\), donc \(e^{7i\pi/12} = e^{i\pi/3}\,e^{i\pi/4} = \left(\frac12 + i\frac{\sqrt3}{2}\right)\frac{\sqrt2}{2}(1 + i)\).</li>
      <li>On développe : \(\frac{\sqrt2}{4}\big[(1 - \sqrt3) + i(1 + \sqrt3)\big]\). Par identification des parties réelle et imaginaire :
      $$\cos\frac{7\pi}{12} = \frac{\sqrt2 - \sqrt6}{4} \approx -0{,}259, \qquad \sin\frac{7\pi}{12} = \frac{\sqrt2 + \sqrt6}{4} \approx 0{,}966 .$$</li>
      <li>Contrôle : la somme des carrés vaut \(\frac{(2 - 2\sqrt{12} + 6) + (2 + 2\sqrt{12} + 6)}{16} = 1\), et l'angle \(\frac{7\pi}{12}\) (105°) est dans le deuxième quadrant : cosinus négatif, sinus positif.</li>
    </ol>
  </div>
  <p><strong>En physique</strong>, un signal \(x(t) = X_m\cos(\omega t + \varphi)\) est la partie réelle de \(X_m\,e^{i(\omega t + \varphi)}\), point qui tourne sur un cercle de rayon \(X_m\) à la vitesse angulaire \(\omega\). Pour \(f = 50\) Hz, \(\omega = 2\pi f \approx 314\ \text{rad/s}\) : ce point fait 50 tours par seconde.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire que \(e^{i\theta} = e^{i\theta'}\) entraîne \(\theta = \theta'\) : seulement \(\theta \equiv \theta'\ [2\pi]\) (\(e^{0} = e^{2i\pi} = 1\)). Et \(e^{i\theta}\) n'est pas un réel positif : \(e^{i\pi} = -1\). Les propriétés de l'exponentielle réelle ne se transposent qu'après démonstration.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · FORME TRIGONOMÉTRIQUE ET ARGUMENTS</div>
  <h2>Longueur et direction d'un complexe</h2>
  <div class="intro">Tout complexe non nul est un réel positif (sa longueur) fois un nombre de module 1 (sa direction). Sous cette forme, les produits, les quotients et les puissances deviennent immédiats : les modules se multiplient, les arguments s'ajoutent.</div>

  <div class="def-box">
    Tout complexe \(z \neq 0\) s'écrit \(z = r\,e^{i\theta}\) avec \(r \gt 0\) et \(\theta\) réel : c'est une <strong>forme trigonométrique</strong> de \(z\). Nécessairement \(r = |z|\), et \(\theta\), défini à un multiple de \(2\pi\) près, est <strong>un argument</strong> de \(z\), noté \(\arg z\) (égalités « modulo \(2\pi\) »). Deux écritures \(r e^{i\theta} = r' e^{i\theta'}\) (\(r, r' \gt 0\)) sont égales si et seulement si \(r = r'\) et \(\theta \equiv \theta'\ [2\pi]\). Le complexe 0 n'a pas d'argument.
  </div>
  <p>En effet \(\frac{z}{|z|}\) est de module 1, donc s'écrit \(e^{i\theta}\) (§3). En pratique, pour \(z = a + ib \neq 0\) : \(r = \sqrt{a^2 + b^2}\), puis \(\theta\) est déterminé par \(\cos\theta = \frac ar\) et \(\sin\theta = \frac br\). Si \(a \gt 0\), on peut prendre \(\theta = \arctan\frac ba\) ; si \(a \lt 0\), \(\theta = \arctan\frac ba + \pi\) ; si \(a = 0\), \(\theta = \frac\pi2\) ou \(-\frac\pi2\) selon le signe de \(b\). On choisit souvent l'argument dans \(]-\pi, \pi]\).</p>
  <div class="prop-box">
    <strong>Arguments d'un produit, d'un quotient.</strong> Pour \(z\), \(z'\) non nuls et \(n \in \mathbb Z\) :
    <div class="formula" data-nom="Arguments d'un produit, d'un quotient">$$\begin{gathered} \arg(z z') \equiv \arg z + \arg z', \qquad \arg\frac{z}{z'} \equiv \arg z - \arg z', \\ \arg \overline z \equiv -\arg z, \qquad \arg z^n \equiv n\arg z \qquad [2\pi]. \end{gathered}$$</div>
    \(z\) est un réel strictement positif si et seulement si \(\arg z \equiv 0\ [2\pi]\), un réel non nul si et seulement si \(\arg z \equiv 0\ [\pi]\), un imaginaire pur non nul si et seulement si \(\arg z \equiv \frac\pi2\ [\pi]\).
  </div>
  <p>Ces règles viennent de \(r e^{i\theta} \cdot r' e^{i\theta'} = r r'\,e^{i(\theta + \theta')}\) (§3) : multiplier par \(r' e^{i\theta'}\), c'est tourner de \(\theta'\) et dilater dans le rapport \(r'\).</p>

  <div class="prop-box">
    <strong>Transformation de \(a\cos t + b\sin t\).</strong> Pour \(a\), \(b\) réels non tous deux nuls, il existe un réel \(\varphi\) tel que, pour tout réel \(t\) :
    <div class="formula" data-nom="Amplitude et phase">$$a\cos t + b\sin t = A\cos(t - \varphi), \qquad A = \sqrt{a^2 + b^2}, \quad \cos\varphi = \frac aA, \quad \sin\varphi = \frac bA .$$</div>
    \(\varphi\) est un argument de \(a + ib\) : \(a + ib = A\,e^{i\varphi}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une partie réelle.</span>
    <div class="content"><p>$$a\cos t + b\sin t = \operatorname{Re}\big((a - ib)(\cos t + i\sin t)\big) = \operatorname{Re}\big((a - ib)\,e^{it}\big) .$$ Écrivons \(a + ib = A e^{i\varphi}\) ; alors \(a - ib = A e^{-i\varphi}\), et \(\operatorname{Re}\big(A e^{i(t - \varphi)}\big) = A\cos(t - \varphi)\). Sans complexes : on met \(A\) en facteur et l'on reconnaît \(\cos\varphi\cos t + \sin\varphi\sin t = \cos(t - \varphi)\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — forme trigonométrique, puissance, amplitude</strong>
    <ol>
      <li>\(z = -\sqrt3 + i\) : \(r = \sqrt{3 + 1} = 2\), \(\cos\theta = -\frac{\sqrt3}{2}\), \(\sin\theta = \frac12\), donc \(\theta \equiv \frac{5\pi}{6}\) et \(z = 2\,e^{5i\pi/6}\).</li>
      <li>\((1 + i\sqrt3)^{10}\) : \(1 + i\sqrt3 = 2e^{i\pi/3}\), donc \((1 + i\sqrt3)^{10} = 2^{10}e^{10i\pi/3}\). Comme \(\frac{10\pi}{3} = 2\pi + \frac{4\pi}{3}\) :
      $$\begin{aligned} (1 + i\sqrt3)^{10} &= 1024\,e^{4i\pi/3} = 1024\left(-\frac12 - i\frac{\sqrt3}{2}\right) \\ &= -512 - 512\sqrt3\,i . \end{aligned}$$</li>
      <li>L'impédance \(30 + 40j\) du §2 vaut \(50\,e^{j\varphi}\) avec \(\varphi = \arctan\frac43 \approx 0{,}927\) rad, soit environ 53,1° (partie réelle positive) : la tension est en avance de 53° sur le courant.</li>
      <li>\(\sqrt3\cos t + \sin t\) : \(A = 2\), \(\cos\varphi = \frac{\sqrt3}{2}\), \(\sin\varphi = \frac12\), donc \(\varphi = \frac\pi6\) et \(\sqrt3\cos t + \sin t = 2\cos\left(t - \frac\pi6\right)\). Maximum 2, atteint en \(t = \frac\pi6\) (modulo \(2\pi\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(\theta = \arctan\frac ba\) quand \(a \lt 0\). Pour \(z = -1 - i\), \(\arctan 1 = \frac\pi4\) donne le point \(1 + i\), à l'opposé : l'argument est \(-\frac{3\pi}{4}\). Autre piège : \(-2e^{i\pi/5}\) n'est pas une forme trigonométrique (le facteur doit être positif) ; c'est \(2e^{i(\pi/5 + \pi)} = 2e^{6i\pi/5}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · TRIGONOMÉTRIE : TECHNIQUE DE L'ANGLE MOITIÉ</div>
  <h2>Factoriser une somme d'exponentielles</h2>
  <div class="intro">Une somme \(e^{ip} + e^{iq}\) se factorise en mettant en facteur l'exponentielle de l'angle moyen. On obtient d'un coup son module et son argument, et l'on retrouve sans les apprendre les formules qui transforment une somme de cosinus ou de sinus en produit.</div>

  <div class="prop-box">
    <strong>Technique de l'angle moitié.</strong> Pour tous réels \(t\), \(p\), \(q\) :
    <div class="formula" data-nom="Angle moitié">$$1 + e^{it} = 2\cos\frac t2\;e^{it/2}, \qquad 1 - e^{it} = -2i\sin\frac t2\;e^{it/2},$$</div>
    <div class="formula" data-nom="Somme de deux exponentielles">$$\begin{gathered} e^{ip} + e^{iq} = 2\cos\frac{p - q}{2}\;e^{i\frac{p + q}{2}}, \\ e^{ip} - e^{iq} = 2i\sin\frac{p - q}{2}\;e^{i\frac{p + q}{2}} . \end{gathered}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Mettre en facteur l'angle moyen, puis Euler.</span>
    <div class="content"><p>$$e^{ip} + e^{iq} = e^{i\frac{p + q}{2}}\left(e^{i\frac{p - q}{2}} + e^{-i\frac{p - q}{2}}\right) = e^{i\frac{p + q}{2}} \cdot 2\cos\frac{p - q}{2}$$ par la formule d'Euler ; de même \(e^{i\frac{p - q}{2}} - e^{-i\frac{p - q}{2}} = 2i\sin\frac{p - q}{2}\). Avec \(p = 0\) et \(q = t\), puis en échangeant les rôles : \(1 + e^{it} = 2\cos\left(-\frac t2\right)e^{it/2}\) et \(1 - e^{it} = 2i\sin\left(-\frac t2\right)e^{it/2}\).</p></div>
  </div>

  <p><strong>Retrouver les formules de factorisation.</strong> On prend les parties réelle et imaginaire des deux égalités précédentes :</p>
  <div class="formula" data-nom="Factorisation de cos p ± cos q">$$\begin{gathered} \cos p + \cos q = 2\cos\frac{p + q}{2}\cos\frac{p - q}{2}, \\ \cos p - \cos q = -2\sin\frac{p + q}{2}\sin\frac{p - q}{2}, \end{gathered}$$</div>
  <div class="formula" data-nom="Factorisation de sin p ± sin q">$$\begin{gathered} \sin p + \sin q = 2\sin\frac{p + q}{2}\cos\frac{p - q}{2}, \\ \sin p - \sin q = 2\cos\frac{p + q}{2}\sin\frac{p - q}{2}. \end{gathered}$$</div>
  <p>Le programme demande de savoir les <strong>retrouver</strong>, pas de les réciter : il suffit de refaire la factorisation par l'angle moyen. Module et argument : \(|1 + e^{it}| = 2\left|\cos\frac t2\right|\) ; un argument de \(1 + e^{it}\) est \(\frac t2\) si \(\cos\frac t2 \gt 0\), et \(\frac t2 + \pi\) si \(\cos\frac t2 \lt 0\).</p>

  <div class="method-box">
    <strong>Exemple — un module, une équation, des battements</strong>
    <ol>
      <li>\(1 + e^{2i\pi/3} = 2\cos\frac\pi3\,e^{i\pi/3} = e^{i\pi/3}\) ; mais \(1 + e^{4i\pi/3} = 2\cos\frac{2\pi}{3}\,e^{2i\pi/3} = -e^{2i\pi/3} = e^{-i\pi/3}\) : ici \(\cos\frac t2 \lt 0\), le module est \(1\) et un argument est \(\frac{2\pi}{3} + \pi \equiv -\frac\pi3\). Contrôle : \(1 + \left(-\frac12 - i\frac{\sqrt3}{2}\right) = \frac12 - i\frac{\sqrt3}{2}\).</li>
      <li>\(\cos x + \cos 3x = 0\) : \(2\cos(2x)\cos x = 0\), donc \(\cos 2x = 0\) ou \(\cos x = 0\), soit \(x \equiv \frac\pi4\ \left[\frac\pi2\right]\) ou \(x \equiv \frac\pi2\ [\pi]\). Dans \([0, \pi]\) : \(\frac\pi4, \frac\pi2, \frac{3\pi}{4}\).</li>
      <li>Deux diapasons de fréquences \(f_1 = 440\) Hz et \(f_2 = 444\) Hz :
      $$\cos(2\pi f_1 t) + \cos(2\pi f_2 t) = 2\cos\big(\pi(f_2 - f_1)t\big)\cos\big(\pi(f_1 + f_2)t\big) .$$
      On entend un son de 442 Hz dont l'amplitude \(2|\cos(4\pi t)|\) s'annule 4 fois par seconde : ce sont les <strong>battements</strong>, de fréquence \(f_2 - f_1 = 4\) Hz.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : lire \(\frac t2\) comme argument de \(1 + e^{it}\) sans regarder le signe de \(\cos\frac t2\) ; ou oublier le facteur \(-2i\) dans \(1 - e^{it}\), qui décale l'argument de \(-\frac\pi2\) : un argument de \(1 - e^{it}\) est \(\frac t2 - \frac\pi2\) si \(\sin\frac t2 \gt 0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TRIGONOMÉTRIE : LINÉARISER, MOIVRE, SOMMES</div>
  <h2>Passer des puissances aux harmoniques, et retour</h2>
  <div class="intro">Linéariser, c'est écrire \(\cos^3 t\) ou \(\sin^2 t\cos t\) comme une combinaison de \(\cos(kt)\) et de \(\sin(kt)\) : on peut alors les intégrer, lire leurs harmoniques, calculer leurs valeurs moyennes. La formule de Moivre fait le chemin inverse. Les sommes \(\sum\cos(kt)\) sont des sommes géométriques déguisées.</div>

  <div class="method-box">
    <strong>Méthode — linéariser \(\cos^p t\,\sin^q t\)</strong>
    <ol>
      <li>Remplacer \(\cos t\) et \(\sin t\) par leurs expressions d'Euler.</li>
      <li>Développer avec la formule du binôme ; les termes s'écrivent \(e^{ikt}\).</li>
      <li>Regrouper \(e^{ikt}\) avec \(e^{-ikt}\) et reconnaître \(2\cos(kt)\) ou \(2i\sin(kt)\) par Euler.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — linéariser \(\sin^4 t\) et intégrer</strong>
    <ol>
      <li>\(\sin^4 t = \left(\dfrac{e^{it} - e^{-it}}{2i}\right)^4 = \dfrac{1}{16}\left(e^{4it} - 4e^{2it} + 6 - 4e^{-2it} + e^{-4it}\right)\), car \((2i)^4 = 16\).</li>
      <li>On regroupe : \(\sin^4 t = \dfrac{2\cos 4t - 8\cos 2t + 6}{16} = \dfrac{3 - 4\cos 2t + \cos 4t}{8}\). Contrôle en \(t = \frac\pi2\) : \(\frac{3 + 4 + 1}{8} = 1\).</li>
      <li>Les termes en \(\cos(2t)\) et \(\cos(4t)\) ont une intégrale nulle sur \([0, \pi]\), donc \(\displaystyle\int_0^\pi \sin^4 t\,\mathrm dt = \frac{3\pi}{8}\) : valeur moyenne \(\frac38\) de \(\sin^4\).</li>
    </ol>
  </div>
  <p>Résultats à savoir retrouver : \(\cos^2 t = \frac{1 + \cos 2t}{2}\), \(\sin^2 t = \frac{1 - \cos 2t}{2}\), \(\cos^3 t = \frac{3\cos t + \cos 3t}{4}\), \(\sin^3 t = \frac{3\sin t - \sin 3t}{4}\). En physique, les deux premières donnent la valeur moyenne \(\frac12\) de \(\cos^2\) : c'est pourquoi la puissance moyenne dans une résistance vaut \(\frac12 R I_m^2\).</p>

  <h3>Formule de Moivre : \(\cos(nt)\) et \(\sin(nt)\) en fonction de \(\cos t\) et \(\sin t\)</h3>
  <p>On développe \((\cos t + i\sin t)^n = \cos(nt) + i\sin(nt)\) par la formule du binôme et l'on identifie parties réelle et imaginaire. Pour \(n = 3\) : \((c + is)^3 = c^3 + 3ic^2s - 3cs^2 - is^3\) (avec \(c = \cos t\), \(s = \sin t\)), donc</p>
  <div class="formula" data-nom="Triplication">$$\begin{aligned} \cos 3t &= \cos^3 t - 3\cos t\sin^2 t = 4\cos^3 t - 3\cos t, \\ \sin 3t &= 3\cos^2 t\sin t - \sin^3 t = 3\sin t - 4\sin^3 t, \end{aligned}$$</div>
  <p>en remplaçant \(\sin^2 t\) par \(1 - \cos^2 t\), ou \(\cos^2 t\) par \(1 - \sin^2 t\). De même, \(\cos 4t = c^4 - 6c^2s^2 + s^4 = 8\cos^4 t - 8\cos^2 t + 1\). Ainsi \(\cos(nt)\) est un polynôme en \(\cos t\).</p>

  <h3>Sommes de cosinus et de sinus</h3>
  <div class="prop-box">
    <strong>Sommes \(\sum \cos(kt)\) et \(\sum \sin(kt)\).</strong> Pour \(n \in \mathbb N\) et \(t \notin 2\pi\mathbb Z\) :
    <div class="formula" data-nom="Somme des cos(kt)">$$\begin{gathered} \sum_{k=0}^{n} \cos(kt) = \frac{\sin\frac{(n + 1)t}{2}}{\sin\frac t2}\,\cos\frac{nt}{2}, \\ \sum_{k=0}^{n} \sin(kt) = \frac{\sin\frac{(n + 1)t}{2}}{\sin\frac t2}\,\sin\frac{nt}{2}. \end{gathered}$$</div>
    Si \(t \in 2\pi\mathbb Z\), tous les cosinus valent 1 : la première somme vaut \(n + 1\), la seconde 0.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Somme géométrique de raison \(e^{it}\), puis angle moitié en haut et en bas.</span>
    <div class="content"><p>Comme \(e^{it} \neq 1\), $$\sum_{k=0}^{n} e^{ikt} = \frac{1 - e^{i(n + 1)t}}{1 - e^{it}} = \frac{-2i\sin\frac{(n + 1)t}{2}\,e^{i(n + 1)t/2}}{-2i\sin\frac t2\,e^{it/2}} = \frac{\sin\frac{(n + 1)t}{2}}{\sin\frac t2}\,e^{int/2} .$$ Le facteur devant \(e^{int/2}\) est réel : les parties réelle et imaginaire donnent les deux sommes, puisque \(\operatorname{Re}\big(e^{ikt}\big) = \cos(kt)\) et \(\operatorname{Im}\big(e^{ikt}\big) = \sin(kt)\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — contrôler la formule sur des cas simples</strong>
    <ol>
      <li>\(t = \frac\pi4\), \(n = 3\) : directement, \(1 + \frac{\sqrt2}{2} + 0 - \frac{\sqrt2}{2} = 1\). Par la formule : \(\dfrac{\sin\frac\pi2}{\sin\frac\pi8}\cos\frac{3\pi}{8} = \dfrac{\cos\frac{3\pi}{8}}{\sin\frac\pi8} = 1\), car \(\cos\frac{3\pi}{8} = \sin\left(\frac\pi2 - \frac{3\pi}{8}\right) = \sin\frac\pi8\).</li>
      <li>\(t = \frac{2\pi}{n + 1}\) : \(\sin\frac{(n + 1)t}{2} = \sin\pi = 0\), donc \(\sum_{k=0}^{n}\cos\frac{2k\pi}{n + 1} = 0\) : c'est la partie réelle de la somme des racines \((n + 1)\)-ièmes de l'unité (§8).</li>

<div class="course-section">
  <div class="sec-num">§7 · RACINES CARRÉES ET ÉQUATION DU SECOND DEGRÉ</div>
  <h2>Tout trinôme a des racines dans \(\mathbb C\)</h2>
  <div class="intro">Dans \(\mathbb C\), tout complexe a deux racines carrées : le discriminant d'un trinôme n'est plus jamais un obstacle. On sait les calculer sous forme algébrique, ce qui suffit pour résoudre toute équation du second degré, même à coefficients complexes.</div>

  <div class="prop-box">
    <strong>Factorisation par \(z - a\).</strong> Soit \(P(z) = \sum_{k=0}^{n} c_k z^k\) une fonction polynomiale à coefficients complexes. Si \(P(a) = 0\), il existe une fonction polynomiale \(Q\) de degré au plus \(n - 1\) telle que \(P(z) = (z - a)\,Q(z)\) pour tout \(z \in \mathbb C\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Factoriser chaque \(z^k - a^k\).</span>
    <div class="content"><p>$$P(z) = P(z) - P(a) = \sum_{k=1}^{n} c_k\,(z^k - a^k) ,$$ et chaque \(z^k - a^k = (z - a)\sum_{j=0}^{k-1} z^{k-1-j}a^j\) (§1). On met \(z - a\) en facteur. En pratique, \(Q\) se calcule par la méthode de Horner (chapitre <a href="#polynomes/cours">« Polynômes »</a>, §4).</p></div>
  </div>

  <div class="prop-box">
    <strong>Racines carrées.</strong> Tout complexe \(Z \neq 0\) a exactement deux racines carrées (les complexes \(\delta\) tels que \(\delta^2 = Z\)), opposées. Si \(Z = R\,e^{i\Theta}\), ce sont \(\pm\sqrt R\,e^{i\Theta/2}\). Si \(Z = A + iB\) est donné sous forme algébrique, \(\delta = x + iy\) est une racine carrée si et seulement si
    <div class="formula" data-nom="Racines carrées sous forme algébrique">$$x^2 - y^2 = A, \qquad x^2 + y^2 = |Z| = \sqrt{A^2 + B^2}, \qquad 2xy = B .$$</div>
  </div>
  <p>Les deux premières équations donnent \(x^2 = \frac{|Z| + A}{2}\) et \(y^2 = \frac{|Z| - A}{2}\) ; la troisième fixe le signe du produit \(xy\) (celui de \(B\)). La deuxième équation vient de \(|\delta|^2 = |\delta^2| = |Z|\) : elle n'est pas nécessaire, mais elle évite une équation de degré 4. Par exemple, les racines carrées de \(5 - 12i\) : \(|Z| = 13\), \(x^2 = 9\), \(y^2 = 4\), \(xy \lt 0\), donc \(\delta = \pm(3 - 2i)\). Contrôle : \((3 - 2i)^2 = 9 - 12i - 4 = 5 - 12i\).</p>

  <div class="prop-box">
    <strong>Équation du second degré.</strong> Soient \(a, b, c \in \mathbb C\), \(a \neq 0\), et \(\Delta = b^2 - 4ac\). Les solutions de \(az^2 + bz + c = 0\) sont
    <div class="formula" data-nom="Second degré dans C">$$z_1 = \frac{-b + \delta}{2a}, \qquad z_2 = \frac{-b - \delta}{2a}, \qquad\text{où } \delta^2 = \Delta ,$$</div>
    distinctes si \(\Delta \neq 0\), confondues (\(z_1 = z_2 = -\frac{b}{2a}\), racine double) si \(\Delta = 0\). Dans tous les cas \(az^2 + bz + c = a(z - z_1)(z - z_2)\), et
    <div class="formula" data-nom="Somme et produit des racines">$$z_1 + z_2 = -\frac ba, \qquad z_1 z_2 = \frac ca .$$</div>
    Réciproquement, deux complexes de somme \(s\) et de produit \(p\) sont les solutions de \(z^2 - sz + p = 0\). Si \(a\), \(b\), \(c\) sont réels et \(\Delta \lt 0\), les solutions sont conjuguées : \(\frac{-b \pm i\sqrt{-\Delta}}{2a}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La forme canonique, qui ne demande que l'existence de \(\delta\).</span>
    <div class="content"><p>$$\begin{aligned} az^2 + bz + c &= a\left[\left(z + \frac{b}{2a}\right)^2 - \frac{\Delta}{4a^2}\right] = a\left[\left(z + \frac{b}{2a}\right)^2 - \left(\frac{\delta}{2a}\right)^2\right] \\ &= a\left(z + \frac{b - \delta}{2a}\right)\left(z + \frac{b + \delta}{2a}\right) . \end{aligned}$$ Un produit de complexes est nul si et seulement si l'un des facteurs l'est : d'où les solutions et la factorisation. En développant $$a(z - z_1)(z - z_2) = az^2 - a(z_1 + z_2)z + az_1z_2$$ et en identifiant les coefficients (chapitre <a href="#polynomes/cours">« Polynômes »</a>, §5), on obtient la somme et le produit.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — coefficients complexes, puis réels</strong>
    <ol>
      <li>\(z^2 - (3 + 4i)z - 1 + 5i = 0\) : \(\Delta = (3 + 4i)^2 - 4(-1 + 5i) = (9 + 24i - 16) + 4 - 20i = -3 + 4i\).</li>
      <li>Racine carrée de \(-3 + 4i\) : \(|\Delta| = 5\), \(x^2 = \frac{5 - 3}{2} = 1\), \(y^2 = \frac{5 + 3}{2} = 4\), \(xy \gt 0\) : \(\delta = 1 + 2i\).</li>
      <li>\(z_1 = \frac{3 + 4i + 1 + 2i}{2} = 2 + 3i\), \(z_2 = \frac{3 + 4i - 1 - 2i}{2} = 1 + i\). Contrôle : somme \(3 + 4i\), produit \((2 + 3i)(1 + i) = -1 + 5i\).</li>
      <li>\(z^2 + 2z + 5 = 0\) (coefficients réels) : \(\Delta = -16\), solutions \(-1 \pm 2i\). C'est l'équation caractéristique de \(y'' + 2y' + 5y = 0\), dont les solutions oscillent dans une enveloppe \(e^{-t}\) (chapitre <a href="#edo/cours">« Équations différentielles »</a>, §7).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\sqrt{\Delta}\) pour un \(\Delta\) complexe, ou \(\sqrt{-4} = 2i\) : la notation \(\sqrt{\ }\) est réservée aux réels positifs (sinon \(\sqrt{-1}\sqrt{-1} = \sqrt{1}\) donnerait \(-1 = 1\)). On écrit « soit \(\delta\) une racine carrée de \(\Delta\) ». Et ne pas oublier la condition de signe sur \(xy\) : sans elle on trouve quatre candidats au lieu de deux.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · RACINES \(n\)-IÈMES</div>
  <h2>Des polygones réguliers inscrits dans un cercle</h2>
  <div class="intro">Résoudre \(z^n = Z\), c'est diviser l'argument de \(Z\) par \(n\) de \(n\) façons différentes : les solutions forment un polygone régulier à \(n\) sommets. Les racines de l'unité servent en géométrie (polygones réguliers), en algèbre (factorisation de \(X^n - 1\)) et en électrotechnique (tensions triphasées décalées de \(\frac{2\pi}{3}\)).</div>

  <div class="prop-box">
    <strong>Racines \(n\)-ièmes de l'unité.</strong> Soit \(n \ge 1\). L'ensemble \(\mathbb U_n = \{z \in \mathbb C : z^n = 1\}\) a exactement \(n\) éléments :
    <div class="formula" data-nom="Racines n-ièmes de l'unité">$$\mathbb U_n = \left\{e^{2ik\pi/n} : k = 0, 1, \ldots, n - 1\right\} = \left\{1, \omega, \omega^2, \ldots, \omega^{n-1}\right\}, \qquad \omega = e^{2i\pi/n} .$$</div>
    Pour \(n \ge 2\), leur somme est nulle : \(\sum_{k=0}^{n-1}\omega^k = \frac{1 - \omega^n}{1 - \omega} = 0\). Dans le plan, ce sont les sommets d'un polygone régulier à \(n\) côtés inscrit dans le cercle unité, dont 1 est un sommet.
  </div>
  <div class="prop-box">
    <strong>Racines \(n\)-ièmes d'un complexe non nul.</strong> Soit \(Z = R\,e^{i\Theta}\) avec \(R \gt 0\). L'équation \(z^n = Z\) a exactement \(n\) solutions :
    <div class="formula" data-nom="Racines n-ièmes de Z">$$z_k = R^{1/n}\,e^{i\left(\frac{\Theta}{n} + \frac{2k\pi}{n}\right)}, \qquad k = 0, 1, \ldots, n - 1 .$$</div>
    Si \(z_0\) est l'une d'elles, ce sont les \(z_0\,u\) pour \(u \in \mathbb U_n\) : un polygone régulier inscrit dans le cercle de rayon \(R^{1/n}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Chercher \(z\) sous forme trigonométrique.</span>
    <div class="content"><p>\(z = 0\) n'est pas solution ; écrivons \(z = r e^{i\theta}\) avec \(r \gt 0\). Alors \(z^n = r^n e^{in\theta}\), et \(z^n = R e^{i\Theta}\) si et seulement si \(r^n = R\) et \(n\theta \equiv \Theta\ [2\pi]\) (§4), c'est-à-dire \(r = R^{1/n}\) et \(\theta = \frac{\Theta}{n} + \frac{2k\pi}{n}\) avec \(k \in \mathbb Z\). Deux valeurs de \(k\) donnent le même \(z\) si et seulement si elles diffèrent d'un multiple de \(n\) : on obtient exactement \(n\) solutions distinctes, pour \(k = 0, \ldots, n - 1\). Le cas \(Z = 1\) (\(R = 1\), \(\Theta = 0\)) donne \(\mathbb U_n\).</p></div>
  </div>
  <p>Pour \(n = 3\), on note \(j = e^{2i\pi/3} = -\frac12 + i\frac{\sqrt3}{2}\) : \(\mathbb U_3 = \{1, j, j^2\}\), avec \(j^3 = 1\), \(j^2 = \overline j = \frac1j\) et \(1 + j + j^2 = 0\). Et \(\mathbb U_4 = \{1, i, -1, -i\}\).</p>

    <ol>
      <li>\(z^4 = -16\) : \(-16 = 16\,e^{i\pi}\), donc \(z_k = 2\,e^{i\left(\frac\pi4 + \frac{k\pi}{2}\right)}\), \(k = 0, 1, 2, 3\) : \(\sqrt2(1 + i)\), \(\sqrt2(-1 + i)\), \(\sqrt2(-1 - i)\), \(\sqrt2(1 - i)\), les sommets d'un carré. Contrôle : \(\big(\sqrt2(1 + i)\big)^2 = 2 \times 2i = 4i\), et \((4i)^2 = -16\).</li>
      <li>\(z^3 = 8i\) : \(8i = 8\,e^{i\pi/2}\), donc \(z_k = 2\,e^{i\left(\frac\pi6 + \frac{2k\pi}{3}\right)}\) : \(\sqrt3 + i\), \(-\sqrt3 + i\) et \(-2i\) (figure). Contrôle : \((-2i)^3 = -8i^3 = 8i\).</li>

</div>

<div class="course-section">
  <div class="sec-num">§9 · EXPONENTIELLE COMPLEXE</div>
  <h2>\(e^z\) pour tout complexe \(z\)</h2>
  <div class="intro">En recollant l'exponentielle réelle (pour la partie réelle) et \(e^{i\theta}\) (pour la partie imaginaire), on définit \(e^z\) pour tout complexe. C'est la fonction des oscillations amorties : \(e^{(-\alpha + i\omega)t}\) tourne à la pulsation \(\omega\) en voyant son module décroître comme \(e^{-\alpha t}\).</div>

  <div class="def-box">
    Pour \(z = x + iy\) (\(x\), \(y\) réels), on pose \(e^z = \exp(z) = e^x\,e^{iy} = e^x(\cos y + i\sin y)\). Ainsi
    <div class="formula" data-nom="Module et argument de exp(z)">$$|e^z| = e^{\operatorname{Re} z}, \qquad \arg e^z \equiv \operatorname{Im} z\ [2\pi] ;$$</div>
    en particulier \(e^z \neq 0\) pour tout \(z\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> Pour tous complexes \(z\), \(z'\) : \(e^{z + z'} = e^z\,e^{z'}\), \(\dfrac{1}{e^z} = e^{-z}\), \(\overline{e^z} = e^{\overline z}\), et
    <div class="formula" data-nom="Égalité de deux exponentielles">$$e^z = e^{z'} \iff z - z' \in 2i\pi\mathbb Z .$$</div>
    Pour \(Z \neq 0\), les solutions de \(e^z = Z\) sont les \(z = \ln|Z| + i(\theta + 2k\pi)\), \(k \in \mathbb Z\), où \(\theta\) est un argument de \(Z\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Séparer module et argument.</span>
    <div class="content"><p>Avec \(z = x + iy\) et \(z' = x' + iy'\) : $$e^z e^{z'} = e^x e^{x'}\,e^{iy}e^{iy'} = e^{x + x'}\,e^{i(y + y')} = e^{z + z'}$$ (§3 et propriété de l'exponentielle réelle). Ensuite \(e^z = e^{z'}\) équivaut à \(e^{z - z'} = 1\), c'est-à-dire \(e^{x - x'} = 1\) (module) et \(y - y' \equiv 0\ [2\pi]\) (argument), soit \(x = x'\) et \(y - y' \in 2\pi\mathbb Z\). Enfin \(e^x e^{iy} = |Z|\,e^{i\theta}\) si et seulement si \(e^x = |Z|\) et \(y \equiv \theta\ [2\pi]\) (unicité de la forme trigonométrique).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — résoudre, puis lire une oscillation amortie</strong>
    <ol>
      <li>\(e^z = 1 + i\sqrt3 = 2\,e^{i\pi/3}\) : \(z = \ln 2 + i\left(\frac\pi3 + 2k\pi\right)\), \(k \in \mathbb Z\) ; une infinité de solutions, toutes de partie réelle \(\ln 2 \approx 0{,}693\).</li>
      <li>\(e^{2z} = -1 = e^{i\pi}\) : \(2z = i\pi + 2ik\pi\), soit \(z = i\left(\frac\pi2 + k\pi\right)\), \(k \in \mathbb Z\).</li>
      <li>\(\lambda = -0{,}5 + 3i\) (en \(\text{s}^{-1}\)) : \(|e^{\lambda t}| = e^{-0{,}5\,t}\) et \(\arg e^{\lambda t} \equiv 3t\). La partie réelle \(e^{-0{,}5\,t}\cos 3t\) est une oscillation de période \(\frac{2\pi}{3} \approx 2{,}09\) s dont l'amplitude est divisée par 2 en \(2\ln 2 \approx 1{,}39\) s. On dérive \(t \mapsto e^{\lambda t}\) comme dans le cas réel : \(\frac{\mathrm d}{\mathrm dt}e^{\lambda t} = \lambda\,e^{\lambda t}\) (chapitre <a href="#fonctions/cours">« Fonctions réelles — généralités »</a>, §12).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure \(z = z'\) de \(e^z = e^{z'}\) (l'exponentielle complexe n'est pas injective : \(e^{2i\pi} = e^0\)), ou croire \(e^z \gt 0\) (\(e^{i\pi} = -1\)). Et \(|e^{iz}| = 1\) seulement pour \(z\) réel : \(|e^{i(1 + i)}| = |e^{-1 + i}| = e^{-1}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · INTERPRÉTATION GÉOMÉTRIQUE</div>
  <h2>Distances, angles et transformations du plan</h2>
  <div class="intro">Un quotient de deux affixes de vecteurs contient à la fois un rapport de longueurs (son module) et un angle (son argument). On en déduit en une ligne l'alignement, l'orthogonalité, la nature d'un triangle, et l'on décrit les transformations simples du plan par des formules.</div>

  <div class="prop-box">
    <strong>Quotient d'affixes.</strong> Soient \(A\), \(B\), \(C\) d'affixes \(a\), \(b\), \(c\), avec \(A \neq B\) et \(A \neq C\). Alors
    <div class="formula" data-nom="Module et argument d'un quotient d'affixes">$$\left|\frac{c - a}{b - a}\right| = \frac{AC}{AB}, \qquad \arg\frac{c - a}{b - a} \equiv \big(\overrightarrow{AB}, \overrightarrow{AC}\big)\ [2\pi] .$$</div>
    Par conséquent : \(A\), \(B\), \(C\) sont <strong>alignés</strong> si et seulement si \(\frac{c - a}{b - a} \in \mathbb R\) ; \((AB) \perp (AC)\) si et seulement si \(\frac{c - a}{b - a} \in i\mathbb R\). Plus généralement, pour \(C \neq D\), \((AB) \perp (CD)\) si et seulement si \(\frac{d - c}{b - a} \in i\mathbb R\).
  </div>
  <p>En effet, \(\arg(c - a)\) est l'angle orienté \((\vec u, \overrightarrow{AC})\) et \(\arg(b - a)\) l'angle \((\vec u, \overrightarrow{AB})\) ; la différence est \((\overrightarrow{AB}, \overrightarrow{AC})\). Un réel non nul a un argument \(\equiv 0\ [\pi]\) (vecteurs colinéaires), un imaginaire pur non nul un argument \(\equiv \frac\pi2\ [\pi]\) (vecteurs orthogonaux). Le produit \(\overline{z}\,z'\), qui contient le produit scalaire et le produit mixte, est étudié dans le chapitre <a href="#geometrie/cours">« Géométrie du plan »</a> (§10).</p>

  <div class="prop-box">
    <strong>Transformations élémentaires.</strong> Le point \(M\) d'affixe \(z\) est envoyé sur le point d'affixe :
    <ul>
      <li>\(z + b\) (\(b \in \mathbb C\)) : <strong>translation</strong> de vecteur d'affixe \(b\) ;</li>
      <li>\(kz\) (\(k\) réel non nul) : <strong>homothétie</strong> de centre \(O\) et de rapport \(k\) ;</li>
      <li>\(e^{i\alpha}z\) (\(\alpha\) réel) : <strong>rotation</strong> de centre \(O\) et d'angle \(\alpha\) ;</li>
      <li>\(az\) avec \(a = |a|\,e^{i\alpha} \in \mathbb C^*\) : composée (dans un ordre indifférent) de la rotation de centre \(O\) d'angle \(\alpha\) et de l'homothétie de centre \(O\) de rapport \(|a|\) ;</li>
      <li>\(\overline z\) : <strong>symétrie</strong> (réflexion) d'axe réel.</li>
    </ul>
    La rotation de centre \(\Omega\) (d'affixe \(\omega\)) et d'angle \(\alpha\) s'écrit \(z \mapsto \omega + e^{i\alpha}(z - \omega)\) : on se ramène à l'origine, on tourne, on revient.
  </div>

  <div class="method-box">
    <strong>Exemple — reconnaître un triangle, construire un point</strong>
    <ol>
      <li>\(A(1 + i)\), \(B(3 + 2i)\), \(C(3i)\) : \(\dfrac{c - a}{b - a} = \dfrac{-1 + 2i}{2 + i} = \dfrac{(-1 + 2i)(2 - i)}{5} = \dfrac{5i}{5} = i\). Donc \(AC = AB\) et \((\overrightarrow{AB}, \overrightarrow{AC}) \equiv \frac\pi2\) : le triangle est rectangle isocèle en \(A\).</li>
      <li>\(A(1)\), \(B(2 + i)\), \(C(4 + 3i)\) : \(\dfrac{c - a}{b - a} = \dfrac{3 + 3i}{1 + i} = 3\), réel : les points sont alignés, et \(\overrightarrow{AC} = 3\,\overrightarrow{AB}\).</li>
      <li>Triangle équilatéral direct sur \(O\) et \(B(2)\) : le troisième sommet est l'image de \(B\) par la rotation de centre \(O\) et d'angle \(\frac\pi3\), d'affixe \(2e^{i\pi/3} = 1 + i\sqrt3\). Côtés : \(|1 + i\sqrt3| = 2\) et \(|1 + i\sqrt3 - 2| = |-1 + i\sqrt3| = 2\).</li>
      <li>Rotation de centre \(\Omega(1 + i)\) et d'angle \(\frac\pi2\) appliquée à \(M(4 + i)\) : \(1 + i + i\,(4 + i - 1 - i) = 1 + 4i\). Contrôle : \(\Omega M = 3 = \Omega M'\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : inverser le quotient : \(\frac{b - a}{c - a}\) donne l'angle \((\overrightarrow{AC}, \overrightarrow{AB})\), opposé. Pour une rotation de centre \(\Omega \neq O\), écrire \(e^{i\alpha}z\) oublie le centre : il faut \(\omega + e^{i\alpha}(z - \omega)\). Enfin, l'étude générale de \(z \mapsto az + b\) (similitude) est hors programme : on la décompose en une translation et une transformation \(z \mapsto az\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Similitudes directes, construction de \(\mathbb C\)</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI ni en PT ; ils prolongent le §10 et le §1.</div>
  <p><strong>Similitudes directes.</strong> Pour \(a \in \mathbb C^*\) et \(b \in \mathbb C\), l'application \(f : z \mapsto az + b\) est une similitude directe. Si \(a = 1\), c'est une translation. Si \(a \neq 1\), elle a un unique point fixe \(\Omega\), d'affixe \(\omega = \frac{b}{1 - a}\), et \(f(z) - \omega = a\,(z - \omega)\) : \(f\) est la composée de la rotation de centre \(\Omega\) et d'angle \(\arg a\) et de l'homothétie de centre \(\Omega\) et de rapport \(|a|\). Par exemple \(z \mapsto (1 + i)z + 2 - i\) a pour centre \(\omega = \frac{2 - i}{-i} = 1 + 2i\), pour rapport \(\sqrt2\) et pour angle \(\frac\pi4\). Une similitude conserve les angles orientés et multiplie les longueurs par \(|a|\).</p>
  <p><strong>Construction de \(\mathbb C\).</strong> On peut définir \(\mathbb C\) comme \(\mathbb R^2\) muni de l'addition des couples et du produit \((a, b)(c, d) = (ac - bd, ad + bc)\) ; \(i\) est alors le couple \((0, 1)\), et l'on vérifie que \((0, 1)^2 = (-1, 0)\). Il n'existe aucune relation d'ordre sur \(\mathbb C\) compatible avec les opérations : on aurait à la fois \(i^2 \ge 0\) (carré) et \(i^2 = -1 \lt 0\).</p>
</div>

<template class="pan-tpl" data-panneau="cpx-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · NOMBRES COMPLEXES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix gestes pour calculer vite et juste : choisir la bonne forme (algébrique pour les sommes, trigonométrique pour les produits et les puissances), factoriser par l'angle moitié, linéariser et sommer, résoudre les équations du second degré et \(z^n = Z\), traduire la géométrie en calcul.</div>

  <div class="method-box">
    <strong>Méthode 1 — Calculer avec la forme algébrique et le conjugué</strong>
    <ol>
      <li>Développer les produits en remplaçant \(i^2\) par \(-1\) ; regrouper parties réelles et imaginaires.</li>
      <li>Pour un quotient, multiplier numérateur et dénominateur par le <strong>conjugué du dénominateur</strong> : le dénominateur devient le réel \(|w|^2\).</li>
      <li>Pour montrer qu'un complexe \(Z\) est réel (ou imaginaire pur), il est souvent plus court de montrer \(\overline Z = Z\) (ou \(\overline Z = -Z\)) que de calculer sa forme algébrique. Si \(|z| = 1\), utiliser \(\overline z = \frac1z\).</li>
      <li>Contrôler par le module : \(\left|\frac zw\right| = \frac{|z|}{|w|}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{1 + 2i}{3 - i} = \dfrac{(1 + 2i)(3 + i)}{10} = \dfrac{1 + 7i}{10}\) ; contrôle : \(\frac{\sqrt{50}}{10} = \frac{\sqrt5}{\sqrt{10}} = \frac{1}{\sqrt2}\). Si \(|z| = 1\) et \(z \neq 1\), \(Z = \frac{1 + z}{1 - z}\) vérifie \(\overline Z = \dfrac{1 + 1/z}{1 - 1/z} = \dfrac{z + 1}{z - 1} = -Z\) : \(Z\) est imaginaire pur.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Passer à la forme trigonométrique pour un produit, un quotient, une puissance</strong>
    <ol>
      <li>Mettre <strong>chaque facteur</strong> sous forme \(r e^{i\theta}\) : \(r = \sqrt{a^2 + b^2}\), puis \(\cos\theta = \frac ar\), \(\sin\theta = \frac br\) ; reconnaître un angle usuel, ou prendre \(\arctan\frac ba\) (plus \(\pi\) si \(a \lt 0\)).</li>
      <li>Multiplier les modules, ajouter les arguments (soustraire pour un quotient, multiplier par \(n\) pour une puissance) — sans jamais développer.</li>
      <li>Ramener l'argument modulo \(2\pi\) à un angle usuel, puis revenir à la forme algébrique si on la demande.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(z = \dfrac{1 - i}{\sqrt3 + i} = \dfrac{\sqrt2\,e^{-i\pi/4}}{2\,e^{i\pi/6}} = \dfrac{\sqrt2}{2}\,e^{-5i\pi/12}\), donc \(z^{12} = \dfrac{1}{64}\,e^{-5i\pi} = -\dfrac{1}{64}\). Et \((1 + i)^n = 2^{n/2}e^{in\pi/4}\) est réel si et seulement si \(\frac{n\pi}{4} \equiv 0\ [\pi]\), c'est-à-dire \(n\) multiple de 4.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\arctan\frac ba\) est dans \(\left]-\frac\pi2, \frac\pi2\right[\) : il ne donne l'argument que si \(a \gt 0\). Toujours placer le point dans son quadrant avant de conclure.</div>

  <div class="method-box">
    <strong>Méthode 3 — Factoriser par l'angle moitié</strong>
    <ol>
      <li>Dans \(e^{ip} \pm e^{iq}\) (ou \(1 \pm e^{it}\), avec \(p = 0\)), mettre en facteur \(e^{i\frac{p + q}{2}}\), l'exponentielle de l'angle moyen.</li>
      <li>Reconnaître par Euler \(2\cos\frac{p - q}{2}\) (somme) ou \(2i\sin\frac{p - q}{2}\) (différence).</li>
      <li>Pour le module et l'argument, regarder le <strong>signe</strong> du facteur réel : s'il est négatif, ajouter \(\pi\) à l'argument ; le facteur \(i = e^{i\pi/2}\) ajoute \(\frac\pi2\).</li>
      <li>Parties réelle et imaginaire : on retrouve \(\cos p \pm \cos q\) et \(\sin p \pm \sin q\) sous forme de produits.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(1 - e^{i\pi/3} = -2i\sin\frac\pi6\,e^{i\pi/6} = -i\,e^{i\pi/6} = e^{-i\pi/2}\,e^{i\pi/6} = e^{-i\pi/3}\) : module 1, argument \(-\frac\pi3\) (contrôle : \(1 - \frac12 - i\frac{\sqrt3}{2}\)). Et \(\sin 5t - \sin t = 2\cos 3t\,\sin 2t\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Linéariser \(\cos^p t\,\sin^q t\)</strong>
    <ol>
      <li>Remplacer \(\cos t = \frac{e^{it} + e^{-it}}{2}\) et \(\sin t = \frac{e^{it} - e^{-it}}{2i}\).</li>
      <li>Développer par la formule du binôme (et le produit) ; ne pas oublier les puissances de \(2\) et de \(i\) au dénominateur.</li>
      <li>Regrouper \(e^{ikt}\) et \(e^{-ikt}\) : \(e^{ikt} + e^{-ikt} = 2\cos kt\), \(e^{ikt} - e^{-ikt} = 2i\sin kt\).</li>
      <li>Contrôler en une valeur simple (\(t = 0\) ou \(\frac\pi2\)). Pour un petit degré, les formules de duplication vont plus vite.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sin^2 t\cos t = \frac{1 - \cos 2t}{2}\cos t = \frac{\cos t}{2} - \frac{\cos 3t + \cos t}{4} = \frac{\cos t - \cos 3t}{4}\) ; contrôle en \(t = 0\) : \(0 = \frac{1 - 1}{4}\). D'où \(\int_0^{\pi/2}\sin^2 t\cos t\,\mathrm dt = \frac14\left[\sin t - \frac{\sin 3t}{3}\right]_0^{\pi/2} = \frac14\left(1 + \frac13\right) = \frac13\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Exprimer \(\cos(nt)\) et \(\sin(nt)\) en fonction de \(\cos t\) et \(\sin t\)</strong>
    <ol>
      <li>Écrire \(\cos(nt) + i\sin(nt) = (\cos t + i\sin t)^n\) (formule de Moivre).</li>
      <li>Développer par le binôme, avec \(i^2 = -1\), \(i^3 = -i\), \(i^4 = 1\).</li>
      <li>Identifier parties réelle et imaginaire ; si l'on veut un polynôme en \(\cos t\) seul, remplacer \(\sin^2 t\) par \(1 - \cos^2 t\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \((c + is)^4 = c^4 + 4ic^3s - 6c^2s^2 - 4ics^3 + s^4\), donc \(\sin 4t = 4\cos^3 t\sin t - 4\cos t\sin^3 t = 4\sin t\cos t\,(\cos^2 t - \sin^2 t)\), ce que confirme \(\sin 4t = 2\sin 2t\cos 2t\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Calculer \(\sum \cos(kt)\) ou \(\sum \sin(kt)\)</strong>
    <ol>
      <li>Traiter à part le cas \(t \in 2\pi\mathbb Z\) (tous les termes sont égaux).</li>
      <li>Sinon, poser \(S = \sum e^{ikt}\) : somme géométrique de raison \(e^{it} \neq 1\), \(S = \frac{1 - e^{i(n + 1)t}}{1 - e^{it}}\) (attention au nombre de termes).</li>
      <li>Factoriser numérateur et dénominateur par l'angle moitié (méthode 3) : le quotient des \(-2i\) se simplifie.</li>
      <li>Prendre la partie réelle (cosinus) ou imaginaire (sinus). Pour \(\sum\cos(a + kt)\), partir de \(e^{ia}S\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sum_{k=0}^{2}\sin\frac{k\pi}{4} = 0 + \frac{\sqrt2}{2} + 1\), et la formule donne \(\dfrac{\sin\frac{3\pi}{8}}{\sin\frac\pi8}\,\sin\frac\pi4 \approx \frac{0{,}924}{0{,}383} \times 0{,}707 \approx 1{,}707\) : les deux valent \(1 + \frac{\sqrt2}{2}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Écrire \(a\cos t + b\sin t\) sous la forme \(A\cos(t - \varphi)\)</strong>
    <ol>
      <li>Calculer \(A = \sqrt{a^2 + b^2}\) (l'amplitude).</li>
      <li>Chercher \(\varphi\) tel que \(\cos\varphi = \frac aA\) et \(\sin\varphi = \frac bA\) : c'est un argument de \(a + ib\).</li>
      <li>En déduire le maximum \(A\) (atteint pour \(t \equiv \varphi\)), ou résoudre \(a\cos t + b\sin t = c\) par \(\cos(t - \varphi) = \frac cA\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(3\cos t - 4\sin t = 5\cos(t - \varphi)\) avec \(\cos\varphi = \frac35\), \(\sin\varphi = -\frac45\), soit \(\varphi = -\arctan\frac43 \approx -0{,}927\). L'équation \(3\cos t - 4\sin t = \frac52\) devient \(\cos(t - \varphi) = \frac12\) : \(t \equiv \varphi \pm \frac\pi3\ [2\pi]\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Résoudre une équation du second degré dans \(\mathbb C\)</strong>
    <ol>
      <li>Chercher d'abord une racine évidente (alors l'autre vient du produit \(\frac ca\) ou de la somme \(-\frac ba\)).</li>
      <li>Sinon, calculer \(\Delta = b^2 - 4ac\) puis <strong>une</strong> racine carrée \(\delta = x + iy\) de \(\Delta = A + iB\) : \(x^2 = \frac{|\Delta| + A}{2}\), \(y^2 = \frac{|\Delta| - A}{2}\), \(xy\) du signe de \(B\).</li>
      <li>Conclure : \(z = \frac{-b \pm \delta}{2a}\), et contrôler par la somme et le produit.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(z^2 + (1 - 3i)z - 4 = 0\) : \(\Delta = (1 - 3i)^2 + 16 = 8 - 6i\), \(|\Delta| = 10\), \(x^2 = 9\), \(y^2 = 1\), \(xy \lt 0\) : \(\delta = 3 - i\). Solutions \(\frac{-1 + 3i \pm (3 - i)}{2}\), soit \(1 + i\) et \(-2 + 2i\) ; produit \(-4\), somme \(-1 + 3i\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : ne jamais écrire \(\sqrt{\Delta}\) si \(\Delta\) n'est pas un réel positif ; et pour des coefficients réels avec \(\Delta \lt 0\), les solutions \(\frac{-b \pm i\sqrt{-\Delta}}{2a}\) sont conjuguées : en trouver une suffit.</div>

  <div class="method-box">
    <strong>Méthode 9 — Résoudre \(z^n = Z\) ou \(e^z = Z\)</strong>
    <ol>
      <li>Mettre \(Z\) sous forme trigonométrique \(R\,e^{i\Theta}\).</li>
      <li>\(z^n = Z\) : chercher \(z = r e^{i\theta}\) ; \(r = R^{1/n}\) et \(\theta = \frac{\Theta + 2k\pi}{n}\), \(k = 0, \ldots, n - 1\) : exactement \(n\) solutions.</li>
      <li>\(e^z = Z\) : \(z = \ln R + i(\Theta + 2k\pi)\), \(k \in \mathbb Z\) : une infinité de solutions, alignées verticalement.</li>
      <li>Une équation \(z^{2n} + \alpha z^n + \beta = 0\) se ramène au second degré en posant \(w = z^n\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(z^3 = -8 = 8e^{i\pi}\) : \(z_k = 2e^{i(\pi/3 + 2k\pi/3)}\), soit \(1 + i\sqrt3\), \(-2\), \(1 - i\sqrt3\). Et \(e^z = -2\) : \(z = \ln 2 + i(\pi + 2k\pi)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Traduire une propriété géométrique</strong>
    <ol>
      <li>Nommer les affixes \(a\), \(b\), \(c\) des points ; former le quotient \(Z = \frac{c - a}{b - a}\) (sommet \(A\), de \(\overrightarrow{AB}\) vers \(\overrightarrow{AC}\)).</li>
      <li>Lire : \(|Z| = \frac{AC}{AB}\), \(\arg Z \equiv (\overrightarrow{AB}, \overrightarrow{AC})\) ; \(Z\) réel : alignés ; \(Z\) imaginaire pur : angle droit en \(A\) ; \(Z = e^{\pm i\pi/3}\) : triangle équilatéral.</li>
      <li>Un ensemble de points \(M(z)\) : se ramener à \(|z - a| = r\) (cercle), \(|z - a| = |z - b|\) (médiatrice), ou à un quotient réel ou imaginaire pur (droite, cercle de diamètre donné).</li>
      <li>Une transformation : translation \(z + b\), rotation \(\omega + e^{i\alpha}(z - \omega)\), homothétie \(\omega + k(z - \omega)\), symétrie \(\overline z\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(O\), \(B(1 + i)\), \(C(1 - i)\) : \(\frac{1 - i}{1 + i} = -i\), de module 1 et d'argument \(-\frac\pi2\) : triangle rectangle isocèle en \(O\). Les points \(M(z)\), \(z \neq -1\), tels que \(\frac{z - 2i}{z + 1}\) est réel sont ceux de la droite passant par \(A(2i)\) et \(B(-1)\), privée de \(B\).</p>
  </div>
  <div class="notice"><strong>Pièges</strong> : écrire une inégalité entre complexes non réels (\(\mathbb C\) n'est pas ordonné) ; égaler des arguments sans « modulo \(2\pi\) » ; confondre \(|z|^2 = z\overline z\) et \(z^2\) ; prendre \(e^{z} = e^{z'}\) pour \(z = z'\) ; oublier le centre d'une rotation qui n'est pas \(O\).</div>
</div>
</template>
