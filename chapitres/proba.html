<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit les parties a), b), c) et e) de la section « Probabilités sur un univers fini, variables aléatoires et lois » du programme de PTSI (second semestre) : univers, événements, probabilité, conditionnement et indépendance. L'univers est toujours <strong>fini</strong>. Les calculs par dénombrement s'appuient sur le chapitre <a href="#denombrmt/cours">« Dénombrement et combinatoire »</a> ; les variables aléatoires, leurs lois, l'espérance et la variance font l'objet du chapitre suivant, <a href="#va/cours">« Variables aléatoires »</a>. En 2ᵉ année, <a href="#espproba/cours">« Espaces probabilisés »</a> reprend tout ce chapitre sur des univers infinis.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Univers, événements</strong> : lien entre vocabulaire ensembliste et vocabulaire des probabilités ; événement élémentaire, événements incompatibles, système complet d'événements ; variable aléatoire et notations \((X \in A)\), \(\{X = x\}\) (§1).</li>
        <li><strong>Probabilité sur un univers fini</strong>, espace probabilisé fini \((\Omega, P)\) ; distribution de probabilités ; probabilité uniforme (§2).</li>
        <li><strong>Règles de calcul</strong> : probabilité de la réunion ou de la différence de deux événements, de l'événement contraire ; croissance (§3).</li>
        <li><strong>Probabilité conditionnelle</strong> \(P(A \mid B) = P_B(A)\) ; \(P_B\) est une probabilité (§4).</li>
        <li><strong>Formules des probabilités composées</strong> (§5), <strong>des probabilités totales</strong> avec la convention \(P(A \mid B)P(B) = 0\) si \(P(B) = 0\) (§6), <strong>de Bayes</strong> (§7).</li>
        <li><strong>Indépendance de deux événements</strong> ; si \(P(B) \gt 0\), elle s'écrit \(P(A \mid B) = P(A)\) ; indépendance de \(A\) et \(\overline B\) (§8).</li>
        <li><strong>Famille finie d'événements indépendants</strong> ; l'indépendance deux à deux n'implique pas l'indépendance ; passage aux contraires pour \(n\) événements (§9).</li>
        <li><strong>Lemme des coalitions</strong>, présenté ici pour des événements (démonstration hors programme), et modélisation de \(n\) expériences indépendantes (§10). Sa version pour des variables aléatoires est au chapitre « Variables aléatoires ».</li>
      </ul>
      <p>Hors programme (en fin de chapitre) : la formule du crible, la σ-additivité et les univers infinis (2ᵉ année), donc les lois géométrique et de Poisson.</p>

<div class="course-section">
  <div class="sec-num">§1 · EXPÉRIENCE ALÉATOIRE, UNIVERS, ÉVÉNEMENTS</div>
  <h2>Le vocabulaire des ensembles, au service du hasard</h2>
  <div class="intro">Une expérience est <em>aléatoire</em> si l'on ne peut pas prévoir son résultat, même en la répétant à l'identique : lancer de dés, tirage d'une carte, durée de vie d'un composant, bruit sur un signal. Pour en parler mathématiquement, on décrit l'ensemble de ses résultats possibles ; les questions qu'on se pose deviennent alors des parties de cet ensemble.</div>

  <div class="def-box">
    L'<strong>univers</strong> \(\Omega\) est l'ensemble des issues (résultats possibles) de l'expérience ; dans ce chapitre, il est <strong>fini</strong>. Un <strong>événement</strong> est une partie \(A\) de \(\Omega\) ; il est <strong>réalisé</strong> si l'issue obtenue appartient à \(A\). Un singleton \(\{\omega\}\) est un <strong>événement élémentaire</strong>.
  </div>
  <table>
    <thead><tr><th>Ensembles</th><th>Probabilités</th></tr></thead>
    <tbody>
      <tr><td>\(\Omega\), \(\varnothing\)</td><td>événement certain, événement impossible</td></tr>
      <tr><td>\(A \cup B\)</td><td>« \(A\) ou \(B\) » (au moins l'un des deux)</td></tr>
      <tr><td>\(A \cap B\)</td><td>« \(A\) et \(B\) »</td></tr>
      <tr><td>\(\overline A = \Omega \setminus A\)</td><td>événement contraire, « non \(A\) »</td></tr>
      <tr><td>\(A \subset B\)</td><td>\(A\) implique \(B\)</td></tr>
      <tr><td>\(A \cap B = \varnothing\)</td><td>\(A\) et \(B\) sont <strong>incompatibles</strong> (disjoints)</td></tr>
    </tbody>
  </table>
  <div class="def-box">
    Un <strong>système complet d'événements</strong> est une famille \((A_1, \dots, A_n)\) d'événements deux à deux incompatibles dont la réunion est \(\Omega\) : chaque issue réalise <strong>exactement un</strong> des \(A_i\). Exemples : \((A, \overline A)\) ; les six événements « le dé donne \(k\) », \(k = 1, \dots, 6\).
  </div>

  <h3>Variables aléatoires : une première rencontre</h3>
  <p>Une <strong>variable aléatoire</strong> \(X\) est une application définie sur \(\Omega\), à valeurs dans un ensemble \(E\) : elle associe un nombre (ou un objet) à chaque issue, comme la somme de deux dés. Pour \(A \subset E\), l'ensemble \(\{\omega \in \Omega,\ X(\omega) \in A\}\) est un événement, noté \((X \in A)\) ou \(\{X \in A\}\) ; de même \((X = x)\), \((X \leq x)\). Le programme veut que l'on travaille tôt avec ces événements : une situation aléatoire se décrit souvent par quelques variables (les résultats successifs \(X_1, \dots, X_n\) d'une expérience répétée), sans écrire \(\Omega\) en détail. Leurs lois sont étudiées au chapitre <a href="#va/cours">« Variables aléatoires »</a>.</p>

<div class="course-section">
  <div class="sec-num">§2 · PROBABILITÉ SUR UN UNIVERS FINI</div>
  <h2>Mesurer la vraisemblance des événements</h2>
  <div class="intro">Une probabilité attribue à chaque événement un nombre entre 0 et 1, de façon additive : la probabilité de « \(A\) ou \(B\) » est la somme des probabilités quand \(A\) et \(B\) ne peuvent pas se produire ensemble. Sur un univers fini, tout se ramène aux probabilités des issues.</div>

  <div class="def-box">
    Une <strong>probabilité</strong> sur l'univers fini \(\Omega\) est une application \(P : \mathcal P(\Omega) \to [0, 1]\) telle que
    <ul>
      <li>\(P(\Omega) = 1\) ;</li>
      <li>pour tous événements \(A\), \(B\) <strong>incompatibles</strong>, \(P(A \cup B) = P(A) + P(B)\).</li>
    </ul>
    Le couple \((\Omega, P)\) est un <strong>espace probabilisé fini</strong>.
  </div>
  <div class="prop-box">
    <strong>Distribution de probabilités.</strong> Une <strong>distribution de probabilités</strong> sur un ensemble fini \(E\) est une famille \((p_x)_{x \in E}\) de réels positifs de somme 1. Une probabilité \(P\) sur \(\Omega\) est déterminée par la distribution \(\big(P(\{\omega\})\big)_{\omega \in \Omega}\) :
    <div class="formula" data-nom="Probabilité d'un événement (univers fini)">$$P(A) = \sum_{\omega \in A} P(\{\omega\}).$$</div>
    Réciproquement, toute distribution \((p_\omega)_{\omega \in \Omega}\) définit une probabilité par cette formule.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un événement est la réunion disjointe de ses singletons.</span>
    <div class="content"><p>Par récurrence, l'additivité s'étend à toute famille finie d'événements deux à deux incompatibles. Un événement \(A\) est la réunion des singletons \(\{\omega\}\), \(\omega \in A\), deux à deux disjoints : \(P(A) = \sum_{\omega \in A} P(\{\omega\})\). En particulier, avec \(A = \Omega\), la somme des \(P(\{\omega\})\) vaut 1. Réciproquement, si les \(p_\omega\) sont positifs de somme 1, \(A \mapsto \sum_{\omega \in A} p_\omega\) prend ses valeurs dans \([0, 1]\), vaut 1 en \(\Omega\) et est additive, car la somme sur une réunion disjointe se découpe en deux sommes.</p></div>
  </div>
  <div class="prop-box">
    <strong>Probabilité uniforme.</strong> Si toutes les issues ont la même probabilité, celle-ci vaut \(\dfrac{1}{|\Omega|}\), et
    <div class="formula" data-nom="Probabilité uniforme">$$P(A) = \frac{|A|}{|\Omega|}.$$</div>
  </div>
  <p>C'est le modèle des expressions « au hasard », « dé équilibré », « pièce équilibrée » : on se ramène à compter (chapitre « Dénombrement »). Sur l'exemple des deux dés, \(P(S = 7) = \frac{6}{36} = \frac16\) et \(P(B) = \frac{11}{36}\).</p>
  <div class="method-box">
    <strong>Exemple — un dé truqué</strong>
    <ol>
      <li>Un dé est truqué de sorte que la probabilité d'obtenir \(k\) soit proportionnelle à \(k\) : \(P(\{k\}) = ck\).</li>
      <li>La somme des probabilités vaut 1 : \(c(1 + 2 + \dots + 6) = 21c = 1\), donc \(c = \frac{1}{21}\).</li>
      <li>La probabilité d'un résultat pair vaut \(\frac{2 + 4 + 6}{21} = \frac{12}{21}\), soit \(\frac47 \approx 0{,}571\), contre \(\frac12\) pour un dé équilibré. Ici on ne peut pas « compter » : la probabilité n'est pas uniforme.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : choisir un univers dont les issues ne sont pas équiprobables, puis compter. Pour la somme de deux dés, l'univers \(\{2, \dots, 12\}\) est correct, mais la probabilité n'y est pas uniforme : \(P(S = 2) = \frac{1}{36}\), \(P(S = 7) = \frac{6}{36}\). C'est sur les 36 couples que l'équiprobabilité est justifiée (dés équilibrés et lancers sans influence l'un sur l'autre).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · RÈGLES DE CALCUL</div>
  <h2>Contraire, différence, réunion</h2>
  <div class="intro">Les règles qui suivent découlent de la seule additivité. Elles permettent de calculer la probabilité d'un événement à partir d'événements plus simples, et surtout de passer au contraire, réflexe n° 1 dès qu'apparaît « au moins un ».</div>

  <div class="prop-box">
    <strong>Règles de calcul.</strong> Pour tous événements \(A\), \(B\) :
    <div class="formula" data-nom="Règles de calcul des probabilités">$$\begin{aligned} P(\varnothing) &= 0, \qquad P(\overline A) = 1 - P(A), \\ P(B \setminus A) &= P(B) - P(A \cap B), \\ P(A \cup B) &= P(A) + P(B) - P(A \cap B). \end{aligned}$$</div>
    <strong>Croissance</strong> : si \(A \subset B\), alors \(P(A) \leq P(B)\). Et \(P(A \cup B) \leq P(A) + P(B)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Découper en morceaux incompatibles.</span>
    <div class="content"><p>\(\Omega = A \cup \overline A\) avec \(A\), \(\overline A\) incompatibles : \(1 = P(A) + P(\overline A)\) ; avec \(A = \Omega\), on obtient \(P(\varnothing) = 0\). \(B\) est la réunion disjointe de \(A \cap B\) et \(B \setminus A\), d'où la deuxième formule ; si \(A \subset B\), \(A \cap B = A\) et \(P(B) - P(A) = P(B \setminus A) \geq 0\). Enfin \(A \cup B\) est la réunion disjointe de \(A\) et \(B \setminus A\) : \(P(A \cup B) = P(A) + P(B) - P(A \cap B)\), qui est au plus \(P(A) + P(B)\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — retour aux deux dés, et le problème du chevalier de Méré</strong>
    <ol>
      <li>\(P(A \cup B) = \frac{6}{36} + \frac{11}{36} - \frac{2}{36}\), soit \(\frac{15}{36} = \frac{5}{12}\) : la somme vaut 7 ou au moins un dé donne 6.</li>
      <li>On lance quatre fois un dé (\(6^4\) issues équiprobables). « Au moins un 6 » a pour contraire « aucun 6 », qui compte \(5^4\) issues : \(P = 1 - \big(\frac56\big)^4 = \frac{671}{1\,296} \approx 0{,}518\).</li>
      <li>On lance 24 fois deux dés. « Au moins un double six » : par le même raisonnement, \(1 - \big(\frac{35}{36}\big)^{24} \approx 0{,}491\). Le chevalier de Méré pensait ces deux jeux équivalents ; le second est légèrement défavorable.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(P(A \cup B) = P(A) + P(B)\) sans vérifier l'incompatibilité, ou étendre au hasard la formule à trois événements. Pour « au moins un parmi plusieurs », on passe au contraire « aucun », qui est une intersection ; la formule générale du crible est hors programme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PROBABILITÉS CONDITIONNELLES</div>
  <h2>Mettre à jour une probabilité quand on apprend quelque chose</h2>
  <div class="intro">Savoir que \(B\) est réalisé change les chances des autres événements : sachant que le premier dé donne 6, une somme d'au moins 10 devient bien plus probable. La probabilité conditionnelle formalise ce changement d'information ; elle est l'outil de base des arbres, des tests médicaux et des chaînes de décisions.</div>

  <div class="def-box">
    Soit \(B\) un événement de probabilité <strong>non nulle</strong>. La <strong>probabilité de \(A\) sachant \(B\)</strong> est
    <div class="formula" data-nom="Probabilité conditionnelle">$$P(A \mid B) = P_B(A) = \frac{P(A \cap B)}{P(B)}.$$</div>
  </div>
  <div class="prop-box">
    <strong>\(P_B\) est une probabilité</strong> sur \(\Omega\). Toutes les règles du §3 valent donc sachant \(B\) : par exemple \(P(\overline A \mid B) = 1 - P(A \mid B)\), et \(P(A \cup C \mid B) = P(A \mid B) + P(C \mid B)\) si \(A\) et \(C\) sont incompatibles.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Vérifier les deux conditions de la définition.</span>
    <div class="content"><p>Par croissance, \(0 \leq P(A \cap B) \leq P(B)\), donc \(P_B(A) \in [0, 1]\), et \(P_B(\Omega) = \frac{P(B)}{P(B)} = 1\). Si \(A\) et \(C\) sont incompatibles, \(A \cap B\) et \(C \cap B\) le sont aussi et leur réunion est \((A \cup C) \cap B\) : en divisant \(P\big((A \cup C) \cap B\big) = P(A \cap B) + P(C \cap B)\) par \(P(B)\), on obtient l'additivité de \(P_B\).</p></div>
  </div>
  <p><strong>Cas uniforme.</strong> Si \(P\) est uniforme, \(P(A \mid B) = \dfrac{|A \cap B|}{|B|}\) : conditionner par \(B\), c'est <em>restreindre l'univers à \(B\)</em>, où la probabilité reste uniforme.</p>
  <div class="method-box">
    <strong>Exemple — deux dés, information partielle</strong>
    <ol>
      <li>Sans information, \(P(S \geq 10) = \frac{6}{36} = \frac16\) (couples \((4,6)\), \((5,5)\), \((6,4)\), \((5,6)\), \((6,5)\), \((6,6)\)).</li>
      <li>Sachant que le premier dé donne 6 (6 couples équiprobables), il faut que le second donne 4, 5 ou 6 : \(P(S \geq 10 \mid X_1 = 6) = \frac36 = \frac12\).</li>
      <li>Dans l'autre sens, \(P(X_1 = 6 \mid S \geq 10) = \frac{3}{6} = \frac12\) : parmi les 6 couples de somme au moins 10, trois commencent par 6. Les deux probabilités conditionnelles sont égales ici par coïncidence ; en général elles diffèrent (§7).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(P(A \mid B)\), \(P(B \mid A)\) et \(P(A \cap B)\). Une famille a deux enfants (les quatre cas FF, FG, GF, GG étant équiprobables) ; sachant qu'il y a au moins une fille, la probabilité que les deux soient des filles est \(\frac13\), et non \(\frac12\) : l'information « au moins une fille » élimine un seul des quatre cas.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FORMULE DES PROBABILITÉS COMPOSÉES</div>
  <h2>Multiplier le long d'un chemin</h2>
  <div class="intro">Dans une expérience en plusieurs étapes, on connaît souvent les probabilités de chaque étape <em>sachant</em> ce qui s'est passé avant (tirages sans remise, essais successifs). La formule des probabilités composées assemble ces conditionnelles : c'est la règle « on multiplie le long d'une branche » des arbres pondérés.</div>

  <div class="prop-box">
    <strong>Probabilités composées.</strong> Si \(P(A) \gt 0\), \(P(A \cap B) = P(A)\,P(B \mid A)\). Plus généralement, si \(P(A_1 \cap \dots \cap A_{n-1}) \gt 0\) :
    <div class="formula" data-nom="Probabilités composées">$$\begin{aligned} P(A_1 \cap \cdots \cap A_n) &= P(A_1)\,P(A_2 \mid A_1)\,P(A_3 \mid A_1 \cap A_2) \\ &\quad \times \cdots \times P(A_n \mid A_1 \cap \cdots \cap A_{n-1}). \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un produit télescopique.</span>
    <div class="content"><p>Chaque intersection \(A_1 \cap \dots \cap A_k\) (\(k \leq n-1\)) contient \(A_1 \cap \dots \cap A_{n-1}\), donc a une probabilité non nulle (croissance) : toutes les probabilités conditionnelles sont définies. En remplaçant chacune par sa définition, le produit devient</p>
    <div class="formula">$$\begin{aligned} &P(A_1) \times \frac{P(A_1 \cap A_2)}{P(A_1)} \times \cdots \\ &\times \frac{P(A_1 \cap \cdots \cap A_n)}{P(A_1 \cap \cdots \cap A_{n-1})}, \end{aligned}$$</div>
    <p>où tout se simplifie sauf le dernier numérateur.</p></div>
  </div>
  <figure class="schema">

    <strong>Exemple — tirages sans remise</strong>
    <ol>
      <li>Une urne contient 5 boules rouges et 3 bleues ; on tire successivement sans remise. \(R_k\) : « la \(k\)-ième boule est rouge ».</li>
      <li>Deux rouges : \(P(R_1 \cap R_2) = P(R_1)\,P(R_2 \mid R_1)\), soit \(\frac58 \times \frac47 = \frac{5}{14}\).</li>
      <li>Trois tirages : \(P(R_1 \cap R_2 \cap R_3) = \frac58 \times \frac47 \times \frac36\), soit \(\frac{5}{28} \approx 0{,}179\), et dans un autre ordre \(P(R_1 \cap \overline{R_2} \cap R_3) = \frac58 \times \frac37 \times \frac46\) vaut aussi \(\frac{5}{28}\) : seule compte la composition du tirage, pas l'ordre.</li>
      <li>Contrôle par dénombrement : \(\frac{5 \times 4 \times 3}{8 \times 7 \times 6} = \frac{60}{336} = \frac{5}{28}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : multiplier des probabilités non conditionnelles, \(P(R_1)P(R_2)\), alors que les tirages s'influencent. Le produit simple n'est juste que pour des événements indépendants (§8) ; en général il faut la probabilité de chaque étape <em>sachant</em> les précédentes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · FORMULE DES PROBABILITÉS TOTALES</div>
  <h2>Raisonner par cas</h2>
  <div class="intro">Quand la probabilité d'un événement dépend d'une circonstance (quelle machine a produit la pièce ? quelle urne a été choisie ?), on découpe selon les circonstances possibles, qui forment un système complet, et l'on additionne les contributions. Sur un arbre : on somme les chemins qui mènent à l'événement.</div>

  <div class="prop-box">
    <strong>Probabilités totales.</strong> Si \((B_1, \dots, B_n)\) est un système complet d'événements, alors pour tout événement \(A\) :
    <div class="formula" data-nom="Probabilités totales">$$P(A) = \sum_{i=1}^n P(A \cap B_i) = \sum_{i=1}^n P(A \mid B_i)\,P(B_i),$$</div>
    avec la convention \(P(A \mid B_i)\,P(B_i) = 0\) lorsque \(P(B_i) = 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Découper A selon le système complet.</span>
    <div class="content"><p>Les événements \(A \cap B_i\) sont deux à deux incompatibles (car les \(B_i\) le sont) et leur réunion est \(A \cap (B_1 \cup \dots \cup B_n) = A \cap \Omega = A\). L'additivité donne la première égalité, et les probabilités composées \(P(A \cap B_i) = P(A \mid B_i)P(B_i)\) la seconde lorsque \(P(B_i) \gt 0\) ; si \(P(B_i) = 0\), alors \(P(A \cap B_i) = 0\), ce que traduit la convention.</p></div>
  </div>
  <p>Le cas le plus fréquent est le système complet \((B, \overline B)\) : \(P(A) = P(A \mid B)P(B) + P(A \mid \overline B)P(\overline B)\). Sur l'arbre de l'urne (§5), on obtient ainsi \(P(R_2) = \frac{20}{56} + \frac{15}{56} = \frac58 = P(R_1)\) : sans information sur le premier tirage, la deuxième boule est rouge avec la même probabilité que la première.</p>

    <strong>Exemple — trois machines</strong>

      <li>\((M_1, M_2, M_3)\) est un système complet (chaque pièce vient d'une machine et d'une seule).</li>
      <li>Probabilités totales :<div class="formula">$$\begin{aligned} P(D) &= 0{,}02 \times 0{,}5 + 0{,}03 \times 0{,}3 + 0{,}05 \times 0{,}2 \\ &= 0{,}010 + 0{,}009 + 0{,}010 = 0{,}029, \end{aligned}$$</div>soit 2,9 % des pièces sont défectueuses, une moyenne des taux pondérée par les parts de production.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : utiliser une famille qui n'est pas un système complet (événements qui se recouvrent, ou qui ne couvrent pas tout), ou oublier les poids \(P(B_i)\) en faisant la moyenne simple \(\frac{2 + 3 + 5}{3} \approx 3{,}3\) % des taux de défaut.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · FORMULE DE BAYES</div>
  <h2>Remonter de l'effet à la cause</h2>
  <div class="intro">On connaît souvent \(P(\text{effet} \mid \text{cause})\) (taux de défaut d'une machine, fiabilité d'un test) et l'on veut \(P(\text{cause} \mid \text{effet})\) : une pièce est défectueuse, de quelle machine vient-elle probablement ? un test est positif, le patient est-il malade ? La formule de Bayes inverse le conditionnement.</div>

  <div class="prop-box">
    <strong>Formule de Bayes.</strong> Si \(P(A) \gt 0\) et \(P(B) \gt 0\), \(P(B \mid A) = \dfrac{P(A \mid B)\,P(B)}{P(A)}\). Si \((B_1, \dots, B_n)\) est un système complet et \(P(A) \gt 0\), pour tout \(j\) :
    <div class="formula" data-nom="Formule de Bayes">$$P(B_j \mid A) = \frac{P(A \mid B_j)\,P(B_j)}{\displaystyle\sum_{i=1}^n P(A \mid B_i)\,P(B_i)}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Écrire P(A ∩ B) de deux façons.</span>
    <div class="content"><p>Par définition, \(P(B \mid A)P(A)\) et \(P(A \mid B)P(B)\) sont toutes deux égales à \(P(A \cap B)\) ; on divise par \(P(A)\). Avec un système complet, on remplace \(P(A)\) par son expression du §6.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — d'où vient la pièce défectueuse ?</strong>
    <ol>
      <li>Avec les données du §6 : \(P(M_3 \mid D) = \dfrac{P(D \mid M_3)P(M_3)}{P(D)}\), soit \(\dfrac{0{,}010}{0{,}029} = \dfrac{10}{29} \approx 0{,}345\).</li>
      <li>De même \(P(M_1 \mid D) = \frac{10}{29}\) et \(P(M_2 \mid D) = \frac{9}{29}\) (contrôle : la somme vaut 1, car \(P_D\) est une probabilité).</li>
      <li>Interprétation : \(M_3\) ne fabrique que 20 % des pièces, mais plus d'un tiers des pièces défectueuses. La part de chaque machine parmi les pièces défectueuses est proportionnelle à « part de production × taux de défaut ».</li>
    </ol>
  </div>

      <li>Probabilités totales : \(P(+) = 0{,}9 \times 0{,}02 + 0{,}05 \times 0{,}98\), soit \(0{,}018 + 0{,}049 = 0{,}067\).</li>
      <li>Bayes : \(P(M \mid +) = \dfrac{0{,}018}{0{,}067} \approx 0{,}27\). Un test positif ne signale un malade qu'une fois sur quatre environ : la maladie est rare, et les faux positifs, pris dans une population saine 49 fois plus nombreuse, l'emportent sur les vrais.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier la probabilité <em>a priori</em> \(P(B_j)\) (ici la prévalence). « Le test est fiable à 90 % » ne dit rien de \(P(M \mid +)\) tant qu'on ne connaît pas la proportion de malades. Le calcul en effectifs (sur 10 000 personnes) est un excellent contrôle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · INDÉPENDANCE DE DEUX ÉVÉNEMENTS</div>
  <h2>Quand une information n'apprend rien</h2>
  <div class="intro">Deux événements sont indépendants si savoir que l'un est réalisé ne change pas la probabilité de l'autre. C'est l'hypothèse qui permet de multiplier les probabilités, au cœur de la modélisation des expériences répétées (§10).</div>

  <div class="def-box">
    Deux événements \(A\) et \(B\) sont <strong>indépendants</strong> si
    <div class="formula" data-nom="Indépendance de deux événements">$$P(A \cap B) = P(A)\,P(B).$$</div>
    Si \(P(B) \gt 0\), cela équivaut à \(P(A \mid B) = P(A)\).
  </div>
  <div class="prop-box">
    <strong>Passage aux contraires.</strong> Si \(A\) et \(B\) sont indépendants, alors \(A\) et \(\overline B\), \(\overline A\) et \(B\), \(\overline A\) et \(\overline B\) le sont aussi.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une différence d'événements.</span>
    <div class="content"><p>\(A \cap \overline B\) est la différence \(A \setminus (A \cap B)\), donc</p>
    <div class="formula">$$P(A \cap \overline B) = P(A) - P(A \cap B) = P(A) - P(A)P(B) = P(A)\,P(\overline B).$$</div>
    <p>En échangeant les rôles, \(\overline A\) et \(B\) sont indépendants, puis on applique le résultat au couple \((\overline A, B)\) pour obtenir \(\overline A\) et \(\overline B\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — l'indépendance se vérifie, elle ne se devine pas</strong>
    <ol>
      <li>Deux dés équilibrés ; \(A\) : « le premier dé est pair », \(P(A) = \frac12\).</li>
      <li>\(C_7\) : « la somme vaut 7 », \(P(C_7) = \frac16\). \(A \cap C_7 = \{(2,5), (4,3), (6,1)\}\) : \(P(A \cap C_7) = \frac{3}{36} = \frac{1}{12} = \frac12 \times \frac16\). Indépendants.</li>
      <li>\(C_8\) : « la somme vaut 8 », \(P(C_8) = \frac{5}{36}\). \(A \cap C_8 = \{(2,6), (4,4), (6,2)\}\) : \(\frac{3}{36} = \frac{1}{12} \neq \frac12 \times \frac{5}{36} = \frac{5}{72}\). Pas indépendants : savoir que la somme vaut 8 rend plus probable un premier dé pair.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre indépendants et incompatibles. Deux événements incompatibles de probabilités non nulles ne sont <strong>jamais</strong> indépendants : \(P(A \cap B) = 0 \neq P(A)P(B)\) ; savoir que \(A\) est réalisé apprend que \(B\) ne l'est pas. Autre piège : l'indépendance dépend de la probabilité choisie, pas seulement des événements (avec un dé truqué, \(A\) et \(C_7\) cessent en général d'être indépendants).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · INDÉPENDANCE MUTUELLE</div>
  <h2>Une famille d'événements indépendants</h2>
  <div class="intro">Pour trois événements ou plus, il ne suffit pas que les paires soient indépendantes : il faut que toute information sur certains d'entre eux, même combinée, n'apprenne rien sur les autres. C'est l'indépendance (mutuelle), indispensable pour multiplier plus de deux probabilités.</div>

  <div class="def-box">
    Les événements \(A_1, \dots, A_n\) sont <strong>(mutuellement) indépendants</strong> si, pour toute partie \(I\) non vide de \(\{1, \dots, n\}\),
    <div class="formula" data-nom="Indépendance mutuelle">$$P\Big(\bigcap_{i \in I} A_i\Big) = \prod_{i \in I} P(A_i).$$</div>
    Ils sont <strong>indépendants deux à deux</strong> si \(A_i\) et \(A_j\) sont indépendants pour tous \(i \neq j\).
  </div>
  <p>Pour \(n = 3\), il y a \(2^3 - 3 - 1 = 4\) égalités à vérifier : les trois égalités sur les paires et \(P(A_1 \cap A_2 \cap A_3) = P(A_1)P(A_2)P(A_3)\). L'indépendance mutuelle entraîne l'indépendance deux à deux ; la réciproque est fausse.</p>
  <table>
    <thead><tr><th>Issue</th><th>\(A\) : pile au 1ᵉʳ</th><th>\(B\) : pile au 2ᵉ</th><th>\(C\) : résultats égaux</th></tr></thead>
    <tbody>
      <tr><td>PP</td><td>oui</td><td>oui</td><td>oui</td></tr>
      <tr><td>PF</td><td>oui</td><td>non</td><td>non</td></tr>
      <tr><td>FP</td><td>non</td><td>oui</td><td>non</td></tr>
      <tr><td>FF</td><td>non</td><td>non</td><td>oui</td></tr>
    </tbody>
  </table>
  <div class="method-box">
    <strong>Exemple — indépendants deux à deux, pas mutuellement</strong>
    <ol>
      <li>Deux lancers d'une pièce équilibrée : quatre issues équiprobables (tableau). \(P(A) = P(B) = P(C) = \frac12\).</li>
      <li>Chaque intersection de deux événements est \(\{\text{PP}\}\), de probabilité \(\frac14 = \frac12 \times \frac12\) : les trois paires sont indépendantes.</li>
      <li>Mais \(A \cap B \cap C = \{\text{PP}\}\) a pour probabilité \(\frac14 \neq \frac18\) : si \(A\) et \(B\) sont réalisés, \(C\) l'est forcément. Les trois événements ne sont pas indépendants.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Passage aux contraires.</strong> Si \(A_1, \dots, A_n\) sont indépendants, on obtient encore une famille d'événements indépendants en remplaçant certains des \(A_i\) par leurs contraires. En particulier
    <div class="formula" data-nom="Au moins un parmi n événements indépendants">$$P(A_1 \cup \cdots \cup A_n) = 1 - \prod_{i=1}^n \big(1 - P(A_i)\big).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Remplacer un seul événement, puis recommencer.</span>
    <div class="content"><p>Il suffit de remplacer \(A_1\) par \(\overline{A_1}\) (puis de recommencer, un événement à la fois). Soit \(I\) une partie contenant 1 et \(J = I \setminus \{1\}\) ; notons \(C = \bigcap_{j \in J} A_j\) (\(C = \Omega\) si \(J\) est vide). Comme au §8,</p>
    <div class="formula">$$\begin{aligned} P(\overline{A_1} \cap C) &= P(C) - P(A_1 \cap C) \\ &= \prod_{j \in J}P(A_j) - P(A_1)\prod_{j \in J}P(A_j) = P(\overline{A_1})\prod_{j \in J}P(A_j). \end{aligned}$$</div>
    <p>Les parties \(I\) ne contenant pas 1 ne sont pas concernées. Pour la formule finale : le contraire de la réunion est \(\overline{A_1} \cap \dots \cap \overline{A_n}\), dont la probabilité est le produit des \(1 - P(A_i)\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — trois composants indépendants</strong>
    <ol>
      <li>Trois composants fonctionnent pendant un an avec les probabilités 0,9, 0,95 et 0,8, indépendamment.</li>
      <li>Tous fonctionnent : \(0{,}9 \times 0{,}95 \times 0{,}8 = 0{,}684\). Au moins un fonctionne : \(1 - 0{,}1 \times 0{,}05 \times 0{,}2 = 0{,}999\).</li>
      <li>Exactement une panne : trois cas incompatibles (le composant en panne est le 1ᵉʳ, le 2ᵉ ou le 3ᵉ), de probabilités \(0{,}1 \times 0{,}95 \times 0{,}8 = 0{,}076\), \(0{,}9 \times 0{,}05 \times 0{,}8 = 0{,}036\) et \(0{,}9 \times 0{,}95 \times 0{,}2 = 0{,}171\), soit au total \(0{,}283\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · LEMME DES COALITIONS, EXPÉRIENCES INDÉPENDANTES</div>
  <h2>Regrouper des événements indépendants</h2>
  <div class="intro">Dans un réseau, un système redondant ou une suite de lancers, on combine des événements indépendants (par « ou », « et », « non ») en événements plus gros. Le lemme des coalitions dit que des « paquets » construits sur des événements différents restent indépendants : c'est lui qui justifie la plupart des calculs de fiabilité.</div>

  <div class="prop-box">
    <strong>Lemme des coalitions (pour des événements).</strong> Soit \(A_1, \dots, A_n\) des événements indépendants et \(1 \leq m \lt n\). Tout événement construit à partir de \(A_1, \dots, A_m\) par réunions, intersections et passages au contraire est indépendant de tout événement construit de même à partir de \(A_{m+1}, \dots, A_n\). Le résultat s'étend à plus de deux coalitions disjointes (événements construits sur des paquets d'indices deux à deux disjoints, qui sont alors indépendants).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de la démonstration (hors programme)</span>
    <span class="prompt">Découper en « atomes ».</span>
    <div class="content"><p>Un événement construit à partir de \(A_1, \dots, A_m\) est une réunion disjointe d'« atomes » \(A_1^{\varepsilon_1} \cap \dots \cap A_m^{\varepsilon_m}\), où chaque \(A_i^{\varepsilon_i}\) vaut \(A_i\) ou \(\overline{A_i}\). Par le passage aux contraires (§9), un atome du premier paquet et un atome du second sont indépendants : la probabilité de leur intersection est le produit des \(n\) probabilités. En sommant sur les atomes (additivité), on obtient \(P(E \cap F) = P(E)P(F)\). Le programme admet ce résultat.</p></div>
  </div>
  <figure class="schema">

  <div class="method-box">
    <strong>Exemple — fiabilité d'un montage</strong>
    <ol>
      <li>Les composants 1, 2, 3 fonctionnent indépendamment, avec les probabilités 0,9, 0,95 et 0,8 ; \(A_i\) : « le composant \(i\) fonctionne ».</li>
      <li>Le montage fonctionne si et seulement si \((A_1 \cup A_2) \cap A_3\) est réalisé. Par le lemme des coalitions, \(A_1 \cup A_2\) (construit sur \(A_1\), \(A_2\)) est indépendant de \(A_3\).</li>
      <li>\(P(A_1 \cup A_2) = 1 - 0{,}1 \times 0{,}05\), soit \(0{,}995\), donc la fiabilité vaut \(0{,}995 \times 0{,}8 = 0{,}796\) : c'est le composant 3, seul en série, qui limite le montage.</li>
    </ol>
  </div>

  <h3>Modéliser des expériences indépendantes</h3>
  <p>« On répète \(n\) fois, de façon indépendante, une expérience » signifie que les événements relatifs à des répétitions différentes sont indépendants : si \(E_k\) ne dépend que de la \(k\)-ième expérience, alors \(E_1, \dots, E_n\) sont indépendants, et le lemme des coalitions s'applique aux événements portant sur des groupes de répétitions distincts. En pratique, on décrit les résultats par des variables \(X_1, \dots, X_n\) indépendantes (chapitre <a href="#va/cours">« Variables aléatoires »</a>, qui énonce le lemme des coalitions pour les variables).</p>
  <div class="method-box">
    <strong>Exemple — attendre le premier 6</strong>
    <ol>
      <li>On lance un dé équilibré, les lancers étant indépendants. Le premier 6 sort au 3ᵉ lancer si et seulement si « pas de 6 au 1ᵉʳ », « pas de 6 au 2ᵉ » et « 6 au 3ᵉ » sont réalisés.</li>
      <li>Ces trois événements portent sur des lancers différents, donc sont indépendants : \(P = \frac56 \times \frac56 \times \frac16 = \frac{25}{216} \approx 0{,}116\).</li>
      <li>De même, le premier 6 sort au \(k\)-ième lancer avec la probabilité \(\big(\frac56\big)^{k-1}\frac16\). Étudier le rang du premier 6 sans limiter le nombre de lancers demande un univers infini : c'est la loi géométrique, vue en 2ᵉ année.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le lemme des coalitions à des paquets qui partagent un événement. \(A_1 \cup A_2\) et \(A_2 \cup A_3\) ne sont en général pas indépendants, puisque tous deux dépendent de \(A_2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Formule du crible, univers infinis</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI ; le second est le point de départ de la 2ᵉ année.</div>
  <p><strong>Formule du crible.</strong> Pour trois événements,</p>
  <div class="formula">$$\begin{aligned} P(A \cup B \cup C) &= P(A) + P(B) + P(C) - P(A \cap B) \\ &\quad - P(A \cap C) - P(B \cap C) + P(A \cap B \cap C) ; \end{aligned}$$</div>
  <p>la formule générale (de Poincaré) alterne les signes sur toutes les intersections. Elle est hors programme des deux années : on lui préfère le passage au contraire ou un découpage en cas incompatibles.</p>
  <p><strong>Univers infinis et σ-additivité.</strong> « Lancer une pièce jusqu'à obtenir pile » n'a pas de nombre de lancers borné : l'univers est infini, et il faut additionner une infinité de probabilités. On remplace alors l'additivité par la <strong>σ-additivité</strong> (\(P\) d'une réunion d'une suite d'événements deux à deux incompatibles est la somme de la série des probabilités), et les événements forment une tribu. Toutes les formules de ce chapitre restent vraies ; s'y ajoutent la continuité monotone et la notion d'événement presque sûr. C'est le chapitre <a href="#espproba/cours">« Espaces probabilisés »</a> de 2ᵉ année ; les lois à valeurs infinies (géométrique, de Poisson) sont dans <a href="#vadisc1/cours">« Variables aléatoires discrètes I »</a>.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="prb-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · PROBABILITÉS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix gestes pour traduire un énoncé en événements, choisir le bon outil (contraire, conditionnement, probabilités composées ou totales, Bayes) et utiliser l'indépendance à bon escient.</div>

  <div class="method-box"><strong>Méthode 1 — Modéliser une expérience aléatoire</strong>
    <ol>
      <li>Décrire une issue (un couple de résultats, une liste de tirages, une partie) et en déduire \(\Omega\).</li>
      <li>Préciser la probabilité : uniforme (« au hasard », « équilibré ») ou donnée par une distribution \((p_\omega)\) de somme 1.</li>
      <li>Nommer les événements utiles par des lettres, ou par des variables : \((X_k = 6)\), \((S \geq 10)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> deux lancers d'une pièce équilibrée, \(\Omega = \{P, F\}^2\), 4 issues équiprobables ; « au moins un pile » a pour probabilité \(1 - \frac14 = \frac34\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Traduire « au moins », « aucun », « exactement »</strong>
    <ol>
      <li>« Au moins un » : passer au contraire « aucun », qui est une intersection.</li>
      <li>« Exactement \(k\) » : réunion d'événements incompatibles, un par choix des \(k\) épreuves réussies.</li>
      <li>« Au plus », « pas tous » : complémentaire de « au moins \(k+1\) », de « tous ».</li>
    </ol>
    <p><em>Exemple éclair :</em> trois dés équilibrés, exactement un 6 : trois positions possibles pour le 6, chacune de probabilité \(\frac16\big(\frac56\big)^2\), soit \(3 \times \frac{25}{216} = \frac{25}{72}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Calculer une probabilité conditionnelle</strong>
    <ol>
      <li>Vérifier que l'événement conditionnant \(B\) est de probabilité non nulle.</li>
      <li>Soit appliquer la définition \(P(A \mid B) = P(A \cap B)/P(B)\), soit, quand la probabilité est uniforme, compter dans l'univers restreint : \(|A \cap B|/|B|\).</li>
      <li>Soit lire directement la donnée de l'énoncé : « sachant que… » donne souvent une conditionnelle toute faite.</li>
    </ol>
    <p><em>Exemple éclair :</em> on tire une carte d'un jeu de 52 ; sachant que c'est une figure (12 cartes), la probabilité que ce soit un roi est \(\frac{4}{12} = \frac13\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(P(A \mid B)\) et \(P(B \mid A)\) ne sont pas égales en général. Écrire chaque fois la phrase complète (« probabilité que … sachant que … ») avant d'écrire la formule.</div>

  <div class="method-box"><strong>Méthode 4 — Utiliser les probabilités composées (arbre)</strong>
    <ol>
      <li>Découper l'expérience en étapes et écrire l'événement cherché comme une intersection \(A_1 \cap \dots \cap A_n\) dans l'ordre chronologique.</li>
      <li>Calculer chaque probabilité <em>sachant les étapes précédentes</em> (composition de l'urne, état du système).</li>
      <li>Multiplier ; sur un arbre, multiplier le long du chemin.</li>
    </ol>
    <p><em>Exemple éclair :</em> deux as de suite en tirant deux cartes sans remise : \(\frac{4}{52} \times \frac{3}{51} = \frac{1}{221}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Appliquer la formule des probabilités totales</strong>
    <ol>
      <li>Repérer la circonstance inconnue dont dépend l'événement (urne choisie, machine, état précédent) et former le système complet correspondant \((B_1, \dots, B_n)\), souvent \((B, \overline B)\).</li>
      <li>Calculer les \(P(B_i)\) et les \(P(A \mid B_i)\).</li>
      <li>Conclure par \(P(A) = \sum_i P(A \mid B_i)P(B_i)\) ; contrôler que le résultat est bien entre le plus petit et le plus grand des \(P(A \mid B_i)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> on choisit l'urne \(U_1\) (2 rouges, 1 noire) avec la probabilité \(\frac13\), l'urne \(U_2\) (1 rouge, 3 noires) sinon, puis on tire une boule : \(P(R) = \frac13 \times \frac23 + \frac23 \times \frac14\), soit \(\frac29 + \frac16 = \frac{7}{18}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Inverser un conditionnement par Bayes</strong>
    <ol>
      <li>Identifier la cause \(B_j\) et l'effet observé \(A\) ; l'énoncé donne en général \(P(A \mid B_i)\) et les \(P(B_i)\).</li>
      <li>Calculer \(P(A)\) par les probabilités totales.</li>
      <li>Conclure par \(P(B_j \mid A) = \dfrac{P(A \mid B_j)P(B_j)}{P(A)}\) et interpréter (contrôle en effectifs sur 1 000 ou 10 000 individus).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec les urnes de la méthode 5, sachant que la boule est rouge, l'urne était \(U_1\) avec la probabilité \(\dfrac{2/9}{7/18} = \dfrac47\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Démontrer ou réfuter l'indépendance de deux événements</strong>
    <ol>
      <li>Calculer séparément \(P(A)\), \(P(B)\) et \(P(A \cap B)\), puis comparer \(P(A \cap B)\) et \(P(A)P(B)\).</li>
      <li>Ou, si \(P(B) \gt 0\), comparer \(P(A \mid B)\) et \(P(A)\) (« l'information \(B\) change-t-elle les chances de \(A\) ? »).</li>
      <li>Ne jamais conclure à l'indépendance d'après l'intuition seule, ni à partir de l'incompatibilité.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(P(A) = 0{,}3\), \(P(B) = 0{,}5\), \(P(A \cup B) = 0{,}65\) donnent \(P(A \cap B) = 0{,}3 + 0{,}5 - 0{,}65\), soit \(0{,}15 = 0{,}3 \times 0{,}5\) : \(A\) et \(B\) sont indépendants.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Vérifier l'indépendance mutuelle de plusieurs événements</strong>
    <ol>
      <li>Si l'énoncé dit « expériences indépendantes », les événements relatifs à des expériences différentes sont indépendants : rien à vérifier.</li>
      <li>Sinon, vérifier la formule produit pour <strong>toutes</strong> les sous-familles (4 égalités pour trois événements).</li>
      <li>Pour réfuter, une seule égalité fausse suffit, souvent celle de l'intersection totale.</li>
    </ol>
    <p><em>Exemple éclair :</em> deux pièces, \(A\) « pile au 1ᵉʳ », \(B\) « pile au 2ᵉ », \(C\) « résultats égaux » : les trois paires sont indépendantes, mais \(P(A \cap B \cap C) = \frac14 \neq \frac18\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « indépendants deux à deux » ne permet pas de multiplier trois probabilités. Le produit \(P(A)P(B)P(C)\) n'est garanti que pour une famille mutuellement indépendante.</div>

  <div class="method-box"><strong>Méthode 9 — Calculer une fiabilité avec le lemme des coalitions</strong>
    <ol>
      <li>Écrire l'événement « le système fonctionne » à partir des \(A_i\) (« le composant \(i\) fonctionne ») : série = intersection, parallèle = réunion.</li>
      <li>Regrouper en paquets qui portent sur des composants <strong>distincts</strong> : ils sont indépendants (lemme des coalitions).</li>
      <li>Calculer : série \(\prod p_i\), parallèle \(1 - \prod(1 - p_i)\), et assembler.</li>
    </ol>
    <p><em>Exemple éclair :</em> composants 1 et 2 en série, l'ensemble en parallèle avec 3, tous de fiabilité 0,9 : \(1 - (1 - 0{,}81)(1 - 0{,}9) = 1 - 0{,}019\), soit \(0{,}981\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Traiter une suite d'épreuves qui dépendent de la précédente</strong>
    <ol>
      <li>Noter \(p_n\) la probabilité de l'état étudié à l'étape \(n\).</li>
      <li>Probabilités totales avec le système complet (état réalisé ou non à l'étape \(n\)) : on obtient une relation \(p_{n+1} = a\,p_n + b\).</li>
      <li>Résoudre cette suite arithmético-géométrique : point fixe \(\ell = \frac{b}{1-a}\), puis \(p_n - \ell = a^n(p_0 - \ell)\) ; limite \(\ell\) si \(|a| \lt 1\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(p_{n+1} = 0{,}5\,p_n + 0{,}3\) et \(p_0 = 0\) : \(\ell = 0{,}6\) et \(p_n = 0{,}6\,(1 - 0{,}5^n)\), donc \(p_3 = 0{,}525\).</p>
  </div>
  <div class="notice"><strong>Pièges classiques</strong> : additionner des probabilités d'événements non incompatibles ; multiplier des probabilités d'événements dépendants ; confondre indépendants et incompatibles ; utiliser un « système complet » qui n'en est pas un ; oublier la probabilité a priori dans Bayes.</div>
</div>
</template>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Règles de calcul</h3>
  <div class="statement">\(A\) et \(B\) sont deux événements tels que \(P(A) = 0{,}5\), \(P(B) = 0{,}4\) et \(P(A \cup B) = 0{,}7\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(P(A \cap B)\), \(P(\overline A \cap B)\), \(P(A \setminus B)\) et \(P(\overline A \cap \overline B)\).</div>
  <div class="q"><strong>Q2.</strong> \(A\) et \(B\) sont-ils indépendants ? incompatibles ? Calculer \(P(A \mid B)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(P(A \cap B) = P(A) + P(B) - P(A \cup B)\), soit \(0{,}2\). Puis \(P(\overline A \cap B) = P(B) - P(A \cap B)\), soit \(0{,}2\) et \(P(A \setminus B) = P(A) - P(A \cap B)\), soit \(0{,}3\). Enfin \(\overline A \cap \overline B\) est le contraire de \(A \cup B\) (De Morgan) : \(P = 1 - 0{,}7 = 0{,}3\). Contrôle : \(0{,}2 + 0{,}2 + 0{,}3 + 0{,}3 = 1\) (les quatre « cases » forment un système complet).</p>
    <p><strong>Q2.</strong> \(P(A)P(B) = 0{,}5 \times 0{,}4\), soit \(0{,}2 = P(A \cap B)\) : indépendants. Ils ne sont pas incompatibles, puisque \(P(A \cap B) \neq 0\). \(P(A \mid B) = \frac{0{,}2}{0{,}4} = 0{,}5 = P(A)\), comme l'indépendance le prévoit.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Un dé truqué</h3>
  <div class="statement">Un dé est truqué : la probabilité d'obtenir la face \(k\) (\(1 \leq k \leq 6\)) est proportionnelle à \(k\). On note \(A\) : « le résultat est pair » et \(B\) : « le résultat est au moins 4 ».</div>
  <div class="q"><strong>Q1.</strong> Déterminer la distribution de probabilités.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(A)\), \(P(B)\) et \(P(B \mid A)\).</div>
  <div class="q"><strong>Q3.</strong> \(A\) et \(B\) sont-ils indépendants ? Et avec un dé équilibré ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(P(\{k\}) = ck\) et la somme vaut 1 : \(21c = 1\), d'où \(P(\{k\}) = \frac{k}{21}\).</p>
    <p><strong>Q2.</strong> \(P(A) = \frac{2 + 4 + 6}{21} = \frac47\) ; \(P(B) = \frac{4 + 5 + 6}{21} = \frac57\) ; \(A \cap B = \{4, 6\}\), \(P(A \cap B) = \frac{10}{21}\), donc \(P(B \mid A) = \frac{10/21}{12/21} = \frac56\).</p>
    <p><strong>Q3.</strong> \(P(A)P(B) = \frac{20}{49} \approx 0{,}408\) et \(P(A \cap B) = \frac{10}{21} \approx 0{,}476\) : pas indépendants (savoir que le résultat est pair rend « au moins 4 » plus probable). Avec un dé équilibré : \(P(A) = P(B) = \frac12\) et \(P(A \cap B) = \frac26 = \frac13 \neq \frac14\) : pas indépendants non plus. L'indépendance se calcule, elle ne se devine pas.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Tirages sans remise</h3>
  <div class="statement">Une urne contient 5 boules rouges et 3 bleues. On tire successivement des boules, sans remise. On note \(R_k\) : « la \(k\)-ième boule tirée est rouge ».</div>
  <div class="q"><strong>Q1.</strong> Calculer la probabilité que les deux premières boules soient rouges.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(R_2)\).</div>
  <div class="q"><strong>Q3.</strong> Sachant que la deuxième boule est rouge, quelle est la probabilité que la première le soit aussi ?</div>
  <div class="q"><strong>Q4.</strong> On tire trois boules. Probabilité d'obtenir au moins une bleue ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Probabilités composées : \(P(R_1 \cap R_2) = P(R_1)P(R_2 \mid R_1)\), soit \(\frac58 \times \frac47 = \frac{5}{14}\).</p>
    <p><strong>Q2.</strong> Probabilités totales avec le système complet \((R_1, \overline{R_1})\) : \(P(R_2) = \frac47 \times \frac58 + \frac57 \times \frac38\), soit \(\frac{20 + 15}{56} = \frac58\). C'est \(P(R_1)\) : sans information sur le premier tirage, le deuxième se comporte comme le premier (par symétrie, chaque boule a la même chance d'être tirée en 2ᵉ position).</p>
    <p><strong>Q3.</strong> Bayes : \(P(R_1 \mid R_2) = \dfrac{P(R_1 \cap R_2)}{P(R_2)}\), soit \(\dfrac{5/14}{5/8} = \dfrac47\). L'information porte sur le <em>futur</em> du premier tirage, mais le calcul est le même : le conditionnement n'a rien de chronologique.</p>
    <p><strong>Q4.</strong> Contraire : trois rouges, \(\frac58 \times \frac47 \times \frac36 = \frac{5}{28}\). Donc la probabilité d'au moins une bleue vaut \(1 - \frac{5}{28} = \frac{23}{28} \approx 0{,}821\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Deux urnes et un dé</h3>
  <div class="statement">L'urne \(U_1\) contient 3 boules rouges et 2 noires, l'urne \(U_2\) 1 rouge et 4 noires. On lance un dé équilibré : s'il donne 6, on tire dans \(U_1\), sinon dans \(U_2\).</div>
  <div class="q"><strong>Q1.</strong> Probabilité de tirer une boule rouge ?</div>
  <div class="q"><strong>Q2.</strong> La boule tirée est rouge. Probabilité qu'elle vienne de \(U_1\) ?</div>
  <div class="q"><strong>Q3.</strong> Après le lancer du dé, on effectue <em>deux</em> tirages avec remise dans l'urne désignée. Calculer \(P(R_1 \cap R_2)\) et comparer à \(P(R_1)P(R_2)\). Les deux tirages sont-ils indépendants ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Système complet \((U_1, U_2)\) (urne choisie) : \(P(R) = \frac35 \times \frac16 + \frac15 \times \frac56\), soit \(\frac{3}{30} + \frac{5}{30} = \frac{4}{15} \approx 0{,}267\).</p>
    <p><strong>Q2.</strong> Bayes : \(P(U_1 \mid R) = \dfrac{3/30}{8/30} = \dfrac38\). L'urne \(U_1\), choisie une fois sur six seulement, fournit pourtant 3 boules rouges sur 8 : elle en contient beaucoup plus.</p>
    <p><strong>Q3.</strong> Sachant l'urne, les deux tirages avec remise sont indépendants : \(P(R_1 \cap R_2 \mid U_1) = \big(\frac35\big)^2\) et \(P(R_1 \cap R_2 \mid U_2) = \big(\frac15\big)^2\). Probabilités totales :</p>
    <div class="formula">$$P(R_1 \cap R_2) = \frac16 \times \frac{9}{25} + \frac56 \times \frac{1}{25} = \frac{14}{150} = \frac{7}{75} = \frac{21}{225}.$$</div>
    <p>Or \(P(R_1) = P(R_2) = \frac{4}{15}\) (même calcul qu'en Q1) et \(P(R_1)P(R_2) = \frac{16}{225}\) : les tirages ne sont <strong>pas</strong> indépendants. Une première boule rouge rend plus probable que l'on tire dans \(U_1\), donc qu'une deuxième soit rouge : \(P(R_2 \mid R_1) = \frac{7/75}{4/15}\), soit \(\frac{7}{20} \gt \frac{4}{15}\). Des épreuves indépendantes <em>sachant chaque cas</em> ne sont pas indépendantes quand le cas est inconnu.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Test de dépistage</h3>
  <div class="statement">Un test a une sensibilité de 95 % (\(P(+ \mid M) = 0{,}95\)) et une spécificité de 90 % (\(P(- \mid \overline M) = 0{,}90\)). La maladie touche 1 % de la population.</div>
  <div class="q"><strong>Q1.</strong> Calculer la probabilité d'un test positif.</div>
  <div class="q"><strong>Q2.</strong> Sachant que le test est positif, probabilité d'être malade ?</div>
  <div class="q"><strong>Q3.</strong> Sachant que le test est négatif, probabilité d'être malade ?</div>
  <div class="q"><strong>Q4.</strong> Une personne positive passe un second test, dont le résultat est, sachant l'état de santé, indépendant du premier. Il est encore positif. Que devient la probabilité qu'elle soit malade ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Probabilités totales avec \((M, \overline M)\) : \(P(+) = 0{,}95 \times 0{,}01 + 0{,}10 \times 0{,}99\), soit \(0{,}0095 + 0{,}099 = 0{,}1085\).</p>
    <p><strong>Q2.</strong> Bayes : \(P(M \mid +) = \dfrac{0{,}0095}{0{,}1085} \approx 0{,}088\). Moins de 9 % des positifs sont malades : la maladie est rare et les faux positifs (9,9 % de la population) écrasent les vrais (0,95 %).</p>
    <p><strong>Q3.</strong> \(P(-) = 1 - 0{,}1085 = 0{,}8915\) et \(P(M \cap -) = 0{,}05 \times 0{,}01\), soit \(0{,}0005\), donc \(P(M \mid -) \approx 0{,}00056\) : un test négatif est très rassurant. Le test sert à <em>éliminer</em> la maladie plus qu'à la confirmer.</p>
    <p><strong>Q4.</strong> Notons \(T_1\), \(T_2\) les deux résultats positifs. Sachant \(M\), \(P(T_1 \cap T_2 \mid M) = 0{,}95^2\) ; sachant \(\overline M\), \(0{,}1^2\). Bayes :</p>
    <div class="formula">$$P(M \mid T_1 \cap T_2) = \frac{0{,}01 \times 0{,}9025}{0{,}01 \times 0{,}9025 + 0{,}99 \times 0{,}01} \approx 0{,}477.$$</div>
    <p>Le second test positif fait passer la probabilité d'être malade de 9 % à près de 48 % : c'est le principe des tests de confirmation.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Indépendance deux à deux sans indépendance</h3>
  <div class="statement">On lance deux dés équilibrés. On note \(A\) : « le premier dé donne un résultat pair », \(B\) : « le second dé donne un résultat impair », \(C\) : « la somme est impaire ».</div>
  <div class="q"><strong>Q1.</strong> Calculer \(P(A)\), \(P(B)\), \(P(C)\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(A\), \(B\), \(C\) sont indépendants deux à deux.</div>
  <div class="q"><strong>Q3.</strong> Sont-ils indépendants ? Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(P(A) = P(B) = \frac12\). La somme est impaire si et seulement si les deux dés sont de parités différentes : \(P(C) = \frac12 \times \frac12 + \frac12 \times \frac12 = \frac12\) (18 issues sur 36).</p>
    <p><strong>Q2.</strong> \(A \cap B\) : premier pair et second impair, 9 issues, probabilité \(\frac14\). \(A \cap C\) : premier pair et somme impaire, c'est-à-dire premier pair et second impair, encore \(\frac14\). \(B \cap C\) : second impair et somme impaire, c'est-à-dire premier pair, \(\frac14\). Chaque fois \(\frac14 = \frac12 \times \frac12\).</p>
    <p><strong>Q3.</strong> \(A \cap B \subset C\), donc \(A \cap B \cap C = A \cap B\) et \(P(A \cap B \cap C) = \frac14 \neq \frac18\). Les trois événements ne sont pas indépendants : chacun est indépendant de chacun des autres pris isolément, mais \(A\) et \(B\) <em>ensemble</em> déterminent \(C\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Deux architectures redondantes</h3>
  <div class="statement">Quatre composants fonctionnent indépendamment, chacun avec la probabilité \(p\) (\(0 \lt p \lt 1\)). Montage 1 : la chaîne « 1 puis 2 » (en série) est placée en parallèle avec la chaîne « 3 puis 4 ». Montage 2 : le bloc « 1 ou 3 » (en parallèle) est placé en série avec le bloc « 2 ou 4 ».</div>
  <div class="q"><strong>Q1.</strong> Exprimer les fiabilités \(R_1\) et \(R_2\) des deux montages en fonction de \(p\), en justifiant les produits. Valeurs pour \(p = 0{,}9\) ?</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(R_2 \geq R_1\) pour tout \(p\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(p = 0{,}9\), le montage 1 est en panne. Probabilité que le composant 1 soit en panne ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Montage 1 : la chaîne « 1 puis 2 » fonctionne avec la probabilité \(p^2\) (indépendance) ; les deux chaînes portent sur des composants distincts, donc sont indépendantes (coalitions), et le montage est en panne si les deux chaînes le sont : \(R_1 = 1 - (1 - p^2)^2\). Montage 2 : chaque bloc parallèle fonctionne avec la probabilité \(1 - (1-p)^2\), et les deux blocs (composants \(\{1, 3\}\) et \(\{2, 4\}\)) sont indépendants : \(R_2 = \big(1 - (1-p)^2\big)^2\). Pour \(p = 0{,}9\) : \(R_1 = 1 - 0{,}19^2 = 0{,}9639\) et \(R_2 = 0{,}99^2 = 0{,}9801\).</p>
    <p><strong>Q2.</strong> En développant (calcul à faire au brouillon), \(R_2 - R_1 = 2p^2(1-p)^2 \geq 0\). Interprétation : dans le montage 2, une panne de 1 peut être compensée par 3 tandis que 2 fonctionne encore ; le montage 1 perd une chaîne entière dès qu'un de ses deux composants lâche.</p>
    <p><strong>Q3.</strong> Notons \(F\) : « le montage 1 est en panne », \(P(F) = 1 - R_1 = 0{,}0361\). Si le composant 1 est en panne, la première chaîne l'est, et le montage est en panne si et seulement si la seconde chaîne l'est, ce qui est indépendant de l'état de 1 (coalitions) : \(P(\overline{A_1} \cap F) = 0{,}1 \times (1 - 0{,}81)\), soit \(0{,}019\). Bayes : \(P(\overline{A_1} \mid F) = \dfrac{0{,}019}{0{,}0361} \approx 0{,}526\), contre \(0{,}1\) a priori.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>La pièce truquée cachée</h3>
  <div class="statement">Un sac contient 5 pièces : 4 sont équilibrées et la cinquième a deux faces « pile ». On en prend une au hasard et on la lance \(n\) fois ; les lancers sont indépendants sachant la pièce choisie. On obtient \(n\) fois pile.</div>
  <div class="q"><strong>Q1.</strong> Montrer que la probabilité \(t_n\) que la pièce soit la pièce truquée vaut \(t_n = \dfrac{2^n}{2^n + 4}\). Calculer \(t_1\), \(t_3\), \(t_5\).</div>
  <div class="q"><strong>Q2.</strong> À partir de combien de piles consécutifs est-on sûr à 99 % au moins que la pièce est truquée ?</div>
  <div class="q"><strong>Q3.</strong> Après 3 piles, quelle est la probabilité que le lancer suivant donne encore pile ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Notons \(T\) : « la pièce est truquée » et \(P_n\) : « \(n\) piles ». \(P(P_n \mid T) = 1\) et \(P(P_n \mid \overline T) = \frac{1}{2^n}\) (lancers indépendants sachant la pièce). Bayes :</p>
    <div class="formula">$$t_n = \frac{1 \times \frac15}{1 \times \frac15 + \frac{1}{2^n} \times \frac45} = \frac{1}{1 + 4 \times 2^{-n}} = \frac{2^n}{2^n + 4}.$$</div>
    <p>\(t_1 = \frac26 = \frac13\), \(t_3 = \frac{8}{12} = \frac23\), \(t_5 = \frac{32}{36} = \frac89\) : chaque pile renforce le soupçon.</p>
    <p><strong>Q2.</strong> \(t_n \geq 0{,}99\) équivaut à \(2^n \geq 0{,}99\,(2^n + 4)\), soit \(0{,}01 \times 2^n \geq 3{,}96\), c'est-à-dire \(2^n \geq 396\). Comme \(2^8 = 256\) et \(2^9 = 512\), il faut \(n \geq 9\) (\(t_8 \approx 0{,}985\), \(t_9 \approx 0{,}992\)).</p>
    <p><strong>Q3.</strong> Probabilités totales sachant \(P_3\) (on travaille avec la probabilité \(P_{P_3}\)) : \(t_3 \times 1 + (1 - t_3) \times \frac12 = \frac23 + \frac16\), soit \(\frac56\). Le lancer suivant n'est pas « pile avec probabilité \(\frac12\) » : les lancers successifs ne sont pas indépendants quand on ignore la pièce.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Gagner un match en plusieurs manches</h3>
  <div class="statement">Une joueuse gagne chaque manche avec la probabilité \(p = 0{,}6\), indépendamment des autres manches ; on note \(q = 1 - p\). Le match s'arrête dès qu'une joueuse a gagné le nombre de manches requis.</div>
  <div class="q"><strong>Q1.</strong> Match en deux manches gagnantes : décrire les déroulements gagnants et calculer la probabilité de gagner le match.</div>
  <div class="q"><strong>Q2.</strong> Même question pour un match en trois manches gagnantes.</div>
  <div class="q"><strong>Q3.</strong> Quel format la meilleure joueuse a-t-elle intérêt à choisir ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Déroulements gagnants : GG, PGG, GPG (incompatibles). Par indépendance des manches : \(p^2 + 2p^2q = 0{,}36 + 2 \times 0{,}36 \times 0{,}4\), soit \(0{,}648\).</p>
    <p><strong>Q2.</strong> On classe selon le nombre de manches perdues avant la 3ᵉ victoire, qui conclut le match : aucune (GGG), une perdue parmi les 3 premières manches (\(\binom31 = 3\) déroulements, de 4 manches), deux perdues parmi les 4 premières (\(\binom42 = 6\) déroulements, de 5 manches). Probabilité \(p^3(1 + 3q + 6q^2) = 0{,}216 \times 3{,}16 \approx 0{,}683\). (Contrôle : c'est aussi la probabilité de gagner au moins 3 manches sur 5 si l'on jouait fictivement les 5.)</p>
    <p><strong>Q3.</strong> \(0{,}683 \gt 0{,}648 \gt 0{,}6\) : allonger le match favorise la meilleure joueuse, car le hasard d'une manche isolée compte moins. C'est l'idée de la loi des grands nombres (chapitre « Variables aléatoires »).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Beau temps, mauvais temps</h3>
  <div class="statement">Dans une région, s'il fait beau un jour, il fait beau le lendemain avec la probabilité 0,8 ; s'il pleut, il fait beau le lendemain avec la probabilité 0,4. On note \(B_n\) : « il fait beau le jour \(n\) » et \(p_n = P(B_n)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(p_{n+1} = 0{,}4\,p_n + 0{,}4\) pour tout \(n \geq 0\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(p_n\) en fonction de \(p_0\) et \(n\), et la limite de \(p_n\). Calculer \(p_3\) lorsqu'il fait beau le jour 0.</div>
  <div class="q"><strong>Q3.</strong> On suppose \(p_0 = \frac12\). Il fait beau le jour 2 : probabilité qu'il ait fait beau le jour 0 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Probabilités totales avec le système complet \((B_n, \overline{B_n})\) :</p>
    <div class="formula">$$p_{n+1} = P(B_{n+1} \mid B_n)\,p_n + P(B_{n+1} \mid \overline{B_n})\,(1 - p_n) = 0{,}8\,p_n + 0{,}4\,(1 - p_n) = 0{,}4\,p_n + 0{,}4.$$</div>
    <p><strong>Q2.</strong> Suite arithmético-géométrique : le point fixe vérifie \(\ell = 0{,}4\ell + 0{,}4\), soit \(\ell = \frac23\). La suite \(p_n - \frac23\) est géométrique de raison 0,4 : \(p_n = \frac23 + \big(p_0 - \frac23\big)0{,}4^n\), qui tend vers \(\frac23\) quel que soit \(p_0\) (le climat « oublie » l'état initial). Avec \(p_0 = 1\) : \(p_3 = \frac23 + \frac13 \times 0{,}064 \approx 0{,}688\) (directement : 0,8 ; 0,72 ; 0,688).</p>
    <p><strong>Q3.</strong> Sachant qu'il fait beau le jour 0, la formule de Q2 avec \(p_0 = 1\) donne \(P(B_2 \mid B_0) = 0{,}72\). Avec \(p_0 = \frac12\) : \(p_2 = \frac23 - \frac16 \times 0{,}16 = 0{,}64\). Bayes : \(P(B_0 \mid B_2) = \dfrac{0{,}72 \times 0{,}5}{0{,}64}\), soit \(\dfrac{9}{16} \approx 0{,}56\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Coalitions et contraires</h3>
  <div class="statement">\(A\), \(B\), \(C\) sont trois événements indépendants, de probabilités \(a\), \(b\), \(c\).</div>
  <div class="q"><strong>Q1.</strong> Sans utiliser le lemme des coalitions, montrer par le calcul que \(A \cup B\) et \(C\) sont indépendants.</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(P(A \cup B \cup C)\) en fonction de \(a\), \(b\), \(c\).</div>
  <div class="q"><strong>Q3.</strong> On lance un dé équilibré \(n\) fois. Combien de lancers faut-il pour que la probabilité d'obtenir au moins un 6 dépasse 0,9 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \((A \cup B) \cap C = (A \cap C) \cup (B \cap C)\), et \((A \cap C) \cap (B \cap C) = A \cap B \cap C\). Par la formule de la réunion puis l'indépendance :</p>
    <div class="formula">$$P\big((A \cup B) \cap C\big) = ac + bc - abc = (a + b - ab)\,c = P(A \cup B)\,P(C).$$</div>
    <p>C'est un cas particulier du lemme des coalitions : \(A \cup B\) est construit sur \(\{A, B\}\), \(C\) sur \(\{C\}\).</p>
    <p><strong>Q2.</strong> Le contraire de \(A \cup B \cup C\) est \(\overline A \cap \overline B \cap \overline C\), et les contraires d'événements indépendants sont indépendants : \(P(A \cup B \cup C) = 1 - (1-a)(1-b)(1-c)\).</p>
    <p><strong>Q3.</strong> Les événements « le \(k\)-ième lancer donne 6 » sont indépendants, de probabilité \(\frac16\) : \(P(\text{au moins un } 6) = 1 - \big(\frac56\big)^n\). La condition \(\big(\frac56\big)^n \leq 0{,}1\) s'écrit \(n \geq \dfrac{\ln 10}{\ln 1{,}2} \approx 12{,}6\). Il faut 13 lancers (\(\big(\frac56\big)^{12} \approx 0{,}112\), \(\big(\frac56\big)^{13} \approx 0{,}093\)).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : transmission d'un bit à travers des relais, probabilités totales, Bayes et indépendance).</div>
  <h3>Transmission d'un bit à travers des relais</h3>
  <div class="statement">Un bit (0 ou 1) est transmis à travers une chaîne de relais. Chaque relais retransmet le bit reçu correctement avec la probabilité \(1 - p\) et l'inverse avec la probabilité \(p\), où \(0 \lt p \lt \frac12\), indépendamment des autres relais. On note \(E_k\) : « après \(k\) relais, le bit est égal au bit émis », et \(r_k = P(E_k)\), avec \(r_0 = 1\). Applications numériques : \(p = 0{,}1\).</div>
  <div class="exo-part"><strong>Partie A — Un ou deux relais</strong></div>
  <div class="q"><strong>A1.</strong> Calculer \(r_1\) et \(r_2\) à l'aide d'un arbre.</div>
  <div class="exo-part"><strong>Partie B — Une chaîne de \(n\) relais</strong></div>
  <div class="q"><strong>B1.</strong> Montrer que \(r_{k+1} = (1 - 2p)\,r_k + p\) pour tout \(k \geq 0\).</div>
  <div class="q"><strong>B2.</strong> En déduire \(r_n = \dfrac{1 + (1 - 2p)^n}{2}\). Limite quand \(n \to +\infty\) ? Interpréter. Calculer \(r_5\).</div>
  <div class="exo-part"><strong>Partie C — Que conclure du bit reçu ?</strong></div>
  <div class="q"><strong>C1.</strong> La source émet 1 avec la probabilité 0,6 et 0 avec la probabilité 0,4, indépendamment de la chaîne. Après 5 relais, on reçoit 1. Probabilité que la source ait émis 1 ?</div>
  <div class="exo-part"><strong>Partie D — Redondance</strong></div>
  <div class="q"><strong>D1.</strong> Pour fiabiliser, on envoie le même bit par trois chaînes indépendantes de 5 relais chacune, et l'on décode à la majorité des trois bits reçus. Montrer que la probabilité de décoder correctement vaut \(f(q) = q^3 + 3q^2(1 - q)\), où \(q = r_5\). Valeur numérique ?</div>
  <div class="q"><strong>D2.</strong> Montrer que \(f(q) - q = q(1-q)(2q-1)\). Pour quelles valeurs de \(q\) le vote majoritaire améliore-t-il la transmission ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(r_1 = 1 - p = 0{,}9\). Après deux relais, le bit est correct si les deux relais sont corrects ou si les deux l'inversent (deux inversions se compensent) : chemins incompatibles, relais indépendants, \(r_2 = (1-p)^2 + p^2 = 0{,}81 + 0{,}01 = 0{,}82\).</p>
    <p><strong>B1.</strong> Système complet \((E_k, \overline{E_k})\). Si le bit est correct après \(k\) relais, il le reste avec la probabilité \(1 - p\) ; s'il est faux, il redevient correct avec la probabilité \(p\) (le relais \(k+1\) est indépendant des précédents, donc ces conditionnelles valent bien \(1 - p\) et \(p\)). Probabilités totales : \(r_{k+1} = (1-p)\,r_k + p\,(1 - r_k)\), soit \((1 - 2p)\,r_k + p\).</p>
    <p><strong>B2.</strong> Le point fixe vérifie \(\ell = (1 - 2p)\ell + p\), soit \(\ell = \frac12\). La suite \(r_k - \frac12\) est géométrique de raison \(1 - 2p\) et de premier terme \(\frac12\) : \(r_n = \frac12 + \frac12(1 - 2p)^n\). Comme \(0 \lt 1 - 2p \lt 1\), \(r_n \to \frac12\) : après un grand nombre de relais, le bit reçu ne dit plus rien du bit émis (pile ou face). Pour \(p = 0{,}1\) : \(r_5 = \frac{1 + 0{,}8^5}{2}\), soit \(\frac{1{,}32768}{2} \approx 0{,}664\). Contrôle avec A1 : \(r_2 = \frac{1 + 0{,}64}{2} = 0{,}82\).</p>
    <p><strong>C1.</strong> Notons \(S\) : « la source émet 1 » et \(R\) : « on reçoit 1 ». \(P(R \mid S) = r_5\) et \(P(R \mid \overline S) = 1 - r_5\) (un 0 émis arrive en 1 si la chaîne l'a inversé). Bayes :</p>
    <div class="formula">$$P(S \mid R) = \frac{0{,}6\,r_5}{0{,}6\,r_5 + 0{,}4\,(1 - r_5)} \approx \frac{0{,}3983}{0{,}3983 + 0{,}1345} \approx 0{,}748.$$</div>
    <p>Recevoir 1 fait passer la confiance de 0,6 à 0,75 seulement : cinq relais dégradent beaucoup l'information.</p>
    <p><strong>D1.</strong> Les trois chaînes sont indépendantes : les événements « la chaîne \(i\) transmet correctement » sont indépendants, de probabilité \(q\). Le décodage est correct si au moins deux chaînes sur trois sont correctes : soit les trois (\(q^3\)), soit exactement deux, ce qui fait trois cas incompatibles selon la chaîne fautive, chacun de probabilité \(q^2(1 - q)\). D'où \(f(q) = q^3 + 3q^2(1-q) \approx 0{,}737\) pour \(q = r_5 \approx 0{,}664\).</p>
    <p><strong>D2.</strong> \(f(q) - q = 3q^2 - 2q^3 - q\), soit \(-q(2q^2 - 3q + 1)\), soit \(-q(2q - 1)(q - 1) = q(1-q)(2q-1)\). Pour \(q \in \,]0, 1[\), le signe est celui de \(2q - 1\) : la majorité améliore la transmission si et seulement si \(q \gt \frac12\), c'est-à-dire si chaque chaîne transmet mieux que le hasard. Ici \(q = r_5 \gt \frac12\) pour tout nombre de relais (B2), donc la redondance est toujours utile, de 0,664 à 0,737 pour cinq relais.</p>
  </div>
</div>
