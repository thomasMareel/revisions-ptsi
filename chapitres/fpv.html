<div class="course-section">
  <div class="sec-num">MÉTHODES · FONCTIONS DE PLUSIEURS VARIABLES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire du programme sur les fonctions de deux ou trois variables : reconnaître un ouvert ou un fermé, étudier une limite, dériver (dérivées partielles, gradient, règle de la chaîne), résoudre une équation aux dérivées partielles par changement de variables, puis chercher et classer les extremums.</div>

  <div class="method-box"><strong>Méthode 1 — Montrer qu'une partie est ouverte, fermée ou bornée</strong>
    <ol>
      <li>Écrire la partie avec des inégalités ou des égalités portant sur des fonctions continues (polynômes, fonctions usuelles).</li>
      <li>Conclure par la propriété du cours : \(\{f \gt 0\}\) est ouvert, \(\{f = 0\}\) et \(\{f \geq 0\}\) sont fermés. Une intersection finie d'ouverts est ouverte (prendre le plus petit des rayons), une intersection de fermés est fermée (son complémentaire est une réunion d'ouverts).</li>
      <li>Pour « borné », majorer \(\|x\|\) sur la partie ; pour « non borné », exhiber des points de la partie de norme arbitrairement grande.</li>
      <li>Pour « ni ouvert ni fermé », trouver un point de la partie qui ne lui est pas intérieur, et un point adhérent qui ne lui appartient pas.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = \{(x, y),\ x^2 + 4y^2 \leq 4,\ x + y \geq 0\}\) est l'intersection des fermés \(\{4 - x^2 - 4y^2 \geq 0\}\) et \(\{x + y \geq 0\}\) : il est fermé. Il est borné, car \(|x| \leq 2\) et \(|y| \leq 1\) donnent \(\|(x, y)\| \leq \sqrt5\). Toute fonction continue sur \(K\) y atteint donc ses bornes.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « fermé » n'est pas le contraire d'« ouvert ». \(\mathbb{R}^2\) est les deux à la fois, et \(]0, 1] \times [0, 1]\) n'est ni l'un ni l'autre.</div>

  <div class="method-box"><strong>Méthode 2 — Étudier une limite en un point</strong>
    <ol>
      <li>Conjecturer la limite \(\ell\) en testant les axes et quelques droites.</li>
      <li>Pour prouver la limite : majorer \(|f(x, y) - \ell|\) par une quantité qui ne dépend que de la distance au point et tend vers 0. En \((0, 0)\), passer en polaires et chercher une majoration <strong>indépendante de \(\theta\)</strong>.</li>
      <li>Pour prouver qu'il n'y a pas de limite : trouver deux chemins aboutissant au point le long desquels \(f\) a des limites différentes (axes, droites \(y = mx\), paraboles \(y = x^2\)…).</li>
      <li>Conclure sur la continuité ou le prolongement par continuité.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(f(x, y) = \dfrac{x^2 y}{x^2 + y^2}\), en polaires \(|f| = r\cos^2\theta\,|\sin\theta| \leq r\), qui tend vers 0 : \(f\) se prolonge par continuité en \((0, 0)\) par 0. Pour \(g(x, y) = \dfrac{x^2 - y^2}{x^2 + y^2}\), \(g = 1\) sur l'axe des abscisses et \(g = -1\) sur celui des ordonnées : pas de limite.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : obtenir la même limite le long de toutes les droites ne prouve rien (une parabole peut donner une autre limite), et « \(r \to 0\) à \(\theta\) fixé » n'est qu'un chemin parmi d'autres. Seule une majoration uniforme prouve la limite.</div>

  <div class="method-box"><strong>Méthode 3 — Calculer des dérivées partielles et justifier la classe \(C^1\)</strong>
    <ol>
      <li>Pour \(\dfrac{\partial f}{\partial x}\), dériver par rapport à \(x\) en traitant les autres variables comme des constantes ; de même pour \(y\) (et \(z\)).</li>
      <li>Là où \(f\) est donnée par une expression construite avec les fonctions usuelles sur un ouvert, invoquer les opérations : \(f\) y est de classe \(C^1\).</li>
      <li>En un point particulier (point où la formule change, origine…), revenir à la définition : limite du taux d'accroissement de la fonction partielle, par exemple \(\dfrac{f(h, 0) - f(0, 0)}{h}\).</li>
      <li>Rassembler les dérivées dans le gradient \(\nabla f\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x, y) = x\sin(xy) + y^3\) est \(C^1\) sur \(\mathbb{R}^2\), avec \(\dfrac{\partial f}{\partial x} = \sin(xy) + xy\cos(xy)\) et \(\dfrac{\partial f}{\partial y} = x^2\cos(xy) + 3y^2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'existence des dérivées partielles en un point n'entraîne pas la continuité en ce point. C'est la continuité des dérivées partielles (classe \(C^1\)) qui donne la formule de Taylor-Young.</div>

  <div class="method-box"><strong>Méthode 4 — Exploiter le gradient : approximation affine, dérivée selon un vecteur, plus forte pente</strong>
    <ol>
      <li>Calculer \(f(a)\) et \(\nabla f(a)\).</li>
      <li>Approximation au premier ordre (Taylor-Young) : \(f(a + h) \approx f(a) + \langle \nabla f(a), h\rangle\) ; c'est aussi la base du calcul d'incertitudes.</li>
      <li>Dérivée selon un vecteur \(u\) : \(D_u f(a) = \langle \nabla f(a), u\rangle\) (avec \(u\) unitaire pour un taux de variation par unité de longueur).</li>
      <li>Si \(\nabla f(a) \neq 0\) : \(f\) croît le plus vite dans la direction de \(\nabla f(a)\), au taux \(\|\nabla f(a)\|\) ; elle ne varie pas au premier ordre dans la direction orthogonale (tangente à la ligne de niveau).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x, y) = xy^2\) en \(a = (1, 2)\) : \(f(a) = 4\), \(\nabla f(a) = (4, 4)\). Pour \(u = (\frac35, \frac45)\), \(D_u f(a) = \frac{28}{5} = 5{,}6\), un peu moins que le taux maximal \(4\sqrt2 \approx 5{,}66\), atteint dans la direction \((1, 1)\). Et \(f(1{,}02;\ 1{,}97) \approx 4 + 4 \times 0{,}02 - 4 \times 0{,}03 = 3{,}96\) (valeur exacte \(3{,}9585\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Dériver une composée (règle de la chaîne)</strong>
    <ol>
      <li><strong>Le long d'une courbe</strong> \(\gamma(t) = (x(t), y(t))\) :
      <div class="formula">$$(f \circ \gamma)'(t) = \frac{\partial f}{\partial x}\big(\gamma(t)\big)\,x'(t) + \frac{\partial f}{\partial y}\big(\gamma(t)\big)\,y'(t).$$</div></li>
      <li><strong>Changement de variables</strong> \(g(u, v) = f\big(\varphi(u, v), \psi(u, v)\big)\) :
      <div class="formula">$$\frac{\partial g}{\partial u} = \frac{\partial f}{\partial x}\,\frac{\partial \varphi}{\partial u} + \frac{\partial f}{\partial y}\,\frac{\partial \psi}{\partial u},$$</div>
      et de même pour \(v\), les dérivées de \(f\) étant prises en \(\big(\varphi(u, v), \psi(u, v)\big)\).</li>
      <li>Garder deux noms distincts, \(f\) pour les variables \((x, y)\) et \(g\) pour \((u, v)\), jusqu'à la fin du calcul.</li>
      <li>Contrôler, quand c'est possible, par un calcul direct de la composée.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x, y) = xy^2\) et \(\gamma(t) = (\cos t, \sin t)\) : \((f \circ \gamma)'(t) = \sin^2 t \times (-\sin t) + 2\cos t\sin t \times \cos t\). Contrôle : \(f(\gamma(t)) = \cos t\sin^2 t\) a bien pour dérivée \(-\sin^3 t + 2\sin t\cos^2 t\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Résoudre une équation aux dérivées partielles par changement de variables</strong>
    <ol>
      <li>Prendre les nouvelles variables \((u, v)\) indiquées (linéaires, polaires…) et vérifier qu'elles réalisent une bijection de l'ouvert étudié sur un ouvert, de réciproque \(C^1\) (\(C^2\) pour une équation du second ordre).</li>
      <li>Poser \(f(x, y) = g(u, v)\) et exprimer les dérivées partielles de \(f\) à l'aide de celles de \(g\) (méthode 5 ; Schwarz pour l'ordre 2).</li>
      <li>Reporter : on obtient une équation simple, du type \(\dfrac{\partial g}{\partial u} = 0\) ou \(\dfrac{\partial^2 g}{\partial u\,\partial v} = 0\), que l'on intègre (sur un ouvert « convexe dans la bonne direction », par exemple un rectangle).</li>
      <li>Revenir aux variables \((x, y)\), puis exploiter les éventuelles conditions imposées.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur le demi-plan \(x \gt 0\), avec les polaires (\(r \gt 0\), \(\theta \in \,]-\frac\pi2, \frac\pi2[\)), \(r\,\dfrac{\partial g}{\partial r} = x\,\dfrac{\partial f}{\partial x} + y\,\dfrac{\partial f}{\partial y}\). L'équation \(x\,\dfrac{\partial f}{\partial x} + y\,\dfrac{\partial f}{\partial y} = 0\) devient \(\dfrac{\partial g}{\partial r} = 0\) : \(g = h(\theta)\), soit \(f(x, y) = \Phi\big(\frac{y}{x}\big)\), avec \(\Phi\) de classe \(C^1\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « \(\dfrac{\partial g}{\partial u} = 0\), donc \(g\) ne dépend que de \(v\) » n'est valable que si chaque droite \(v = \text{cte}\) coupe l'ouvert selon un intervalle.</div>

  <div class="method-box"><strong>Méthode 7 — Calculer des dérivées secondes, un laplacien</strong>
    <ol>
      <li>Dériver les dérivées premières ; sous l'hypothèse \(C^2\), le théorème de Schwarz assure \(\dfrac{\partial^2 f}{\partial x\,\partial y} = \dfrac{\partial^2 f}{\partial y\,\partial x}\) : calculer les deux dérivées croisées sert de contrôle.</li>
      <li>Laplacien : \(\Delta f = \dfrac{\partial^2 f}{\partial x^2} + \dfrac{\partial^2 f}{\partial y^2}\) ; \(f\) est harmonique si \(\Delta f = 0\).</li>
      <li>Pour une fonction qui s'exprime simplement en polaires, \(g(r, \theta) = f(r\cos\theta, r\sin\theta)\), utiliser, pour \(r \gt 0\) :
      <div class="formula">$$\Delta f = \frac{\partial^2 g}{\partial r^2} + \frac1r\,\frac{\partial g}{\partial r} + \frac{1}{r^2}\,\frac{\partial^2 g}{\partial \theta^2}.$$</div></li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x, y) = x^3 - 3xy^2\) : \(\dfrac{\partial^2 f}{\partial x^2} = 6x\), \(\dfrac{\partial^2 f}{\partial y^2} = -6x\), donc \(f\) est harmonique. En polaires, \(f = r^3\cos(3\theta)\) et l'on trouve bien \(6r\cos 3\theta + 3r\cos 3\theta - 9r\cos 3\theta = 0\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Trouver les points critiques et décider de leur nature par la hessienne</strong>
    <ol>
      <li>Vérifier que \(f\) est de classe \(C^2\) sur un <strong>ouvert</strong> ; résoudre \(\dfrac{\partial f}{\partial x} = \dfrac{\partial f}{\partial y} = 0\) en factorisant et en séparant les cas, sans diviser par une quantité qui peut s'annuler.</li>
      <li>En chaque point critique \(a\), calculer \(r\), \(s\), \(t\) (notations de Monge) et la hessienne \(H_f(a) = \begin{pmatrix} r & s \\ s & t \end{pmatrix}\).</li>
      <li>Conclure : \(\det H = rt - s^2 \gt 0\) et \(\operatorname{tr} H = r + t \gt 0\) : minimum local strict ; \(\det H \gt 0\) et \(\operatorname{tr} H \lt 0\) : maximum local strict ; \(\det H \lt 0\) : point col.</li>
      <li>Si \(\det H = 0\) (cas douteux) : étudier directement le signe de \(f(a + h) - f(a)\), le long de chemins bien choisis ou par une identité remarquable.</li>
      <li>Pour savoir si un extremum local est global : minorer (ou majorer) \(f\) sur tout le domaine, ou au contraire trouver des points où \(f\) dépasse la valeur trouvée.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x, y) = x^3 - 3x + y^2 - 2y\) : \(\nabla f = (3x^2 - 3,\ 2y - 2)\), points critiques \((1, 1)\) et \((-1, 1)\). \(H = \begin{pmatrix} 6x & 0 \\ 0 & 2 \end{pmatrix}\) : en \((1, 1)\), \(\det H = 12 \gt 0\) et \(\operatorname{tr} H = 8 \gt 0\), minimum local de valeur \(-3\) ; en \((-1, 1)\), \(\det H = -12\), col. Le minimum n'est pas global : \(f(x, 1) \to -\infty\) quand \(x \to -\infty\). Cas douteux : \(x^2 + y^3\) en \((0, 0)\) a \(\det H = 0\), et \(y \mapsto y^3\) change de signe : pas d'extremum.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : conclure « minimum » dès que \(\det H \gt 0\) sans regarder le signe de la trace ; appliquer la classification en un point qui n'est pas critique ; affirmer « pas d'extremum » parce que \(\det H = 0\).</div>

  <div class="method-box"><strong>Méthode 9 — Chercher les extremums globaux sur une partie fermée bornée</strong>
    <ol>
      <li><strong>Existence</strong> : la partie \(K\) est fermée (méthode 1) et bornée, \(f\) est continue : le maximum et le minimum sont atteints.</li>
      <li><strong>Intérieur</strong> : un extremum atteint en un point intérieur est un point critique. Garder les points critiques situés à l'intérieur de \(K\).</li>
      <li><strong>Bord</strong> : le paramétrer (segments, arcs de cercle \((R\cos\theta, R\sin\theta)\)…) et étudier les fonctions d'une variable obtenues, extrémités et coins compris.</li>
      <li><strong>Comparer</strong> les valeurs de \(f\) en tous les candidats. Inutile de classer les points critiques intérieurs par la hessienne.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x, y) = x^2 - xy + y^2 - x - y\) sur le triangle \(T\) : \(x \geq 0\), \(y \geq 0\), \(x + y \leq 3\). Intérieur : seul \((1, 1)\) est critique, \(f(1, 1) = -1\). Bord : sur \(y = 0\), \(x^2 - x\) varie entre \(-\frac14\) et \(6\) ; même chose sur \(x = 0\) ; sur \(x + y = 3\), \(f = 3(x - 1)(x - 2)\) varie entre \(-\frac34\) et \(6\). Minimum \(-1\) en \((1, 1)\), maximum \(6\) aux sommets \((3, 0)\) et \((0, 3)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : se contenter des points critiques. Sur un fermé borné, les extremums sont souvent atteints sur le bord, en des points où le gradient ne s'annule pas ; un point critique situé hors de \(K\) n'est pas un candidat.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="fpv-exos">
<div class="exo-wrapper">

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Ouvert, fermé, borné</h3>
  <div class="statement">On considère les parties de \(\mathbb{R}^2\) suivantes :
    \(A = \{(x, y),\ x \gt 0,\ y \gt 0,\ xy \lt 1\}\), \(B = \{(x, y),\ x^2 + y^2 \leq 2,\ y \geq x^2\}\) et \(C = \{(x, y),\ 0 \lt x \leq 1\}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(A\) est ouverte. Est-elle fermée ? bornée ?</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(B\) est fermée et bornée. Le point \((0, 1)\) est-il intérieur à \(B\) ? Et le point \((1, 1)\) ?</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(C\) n'est ni ouverte ni fermée.</div>
  <div class="q"><strong>Q4.</strong> Justifier que \(h(x, y) = x + y\) admet un maximum et un minimum sur \(B\), puis les déterminer.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(A = \{x \gt 0\} \cap \{y \gt 0\} \cap \{1 - xy \gt 0\}\) : chacune de ces parties est ouverte (fonctions continues), et une intersection finie d'ouverts est ouverte (autour d'un point de \(A\), on prend la plus petite des trois boules). \(A\) n'est pas fermée : \((0, 0)\) est adhérent à \(A\) (les points \((\varepsilon, \varepsilon)\), \(0 \lt \varepsilon \lt 1\), sont dans \(A\)) sans lui appartenir. Elle n'est pas bornée : \((n, \frac{1}{2n}) \in A\) pour tout \(n \geq 1\), de norme au moins \(n\).</p>
    <p><strong>Q2.</strong> \(B = \{2 - x^2 - y^2 \geq 0\} \cap \{y - x^2 \geq 0\}\) est une intersection de fermés, donc fermée ; et \(\|(x, y)\| \leq \sqrt2\) sur \(B\). Le point \((0, 1)\) vérifie les deux inégalités <strong>strictement</strong> : il est dans l'ouvert \(\{x^2 + y^2 \lt 2\} \cap \{y \gt x^2\}\), contenu dans \(B\), donc une boule centrée en \((0, 1)\) est contenue dans \(B\) : il est intérieur. Le point \((1, 1)\) est dans \(B\) (\(1 + 1 = 2\) et \(1 \geq 1\)), mais les points \((1 + \varepsilon, 1 + \varepsilon)\), arbitrairement proches, n'y sont pas : il n'est pas intérieur.</p>
    <p><strong>Q3.</strong> \((1, 0) \in C\) n'est pas intérieur (les points \((1 + \varepsilon, 0)\) sont hors de \(C\)) : \(C\) n'est pas ouverte. \((0, 0)\) est adhérent à \(C\) (points \((\varepsilon, 0)\)) sans lui appartenir : \(C\) n'est pas fermée.</p>
    <p><strong>Q4.</strong> \(h\) est continue sur la partie fermée bornée non vide \(B\) : elle y est bornée et atteint ses bornes. Sur \(B\), \(x + y \leq \sqrt2\,\sqrt{x^2 + y^2} \leq 2\) (Cauchy-Schwarz), avec égalité en \((1, 1) \in B\) : le maximum vaut 2. Et \(y \geq x^2\) donne \(x + y \geq x + x^2 = \big(x + \frac12\big)^2 - \frac14 \geq -\frac14\), avec égalité en \(\big(-\frac12, \frac14\big)\), qui est bien dans \(B\) : le minimum vaut \(-\frac14\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Dérivées partielles, gradient, approximation</h3>
  <div class="statement">Soit \(f(x, y) = x^2 y + 3xy^3\), définie sur \(\mathbb{R}^2\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\dfrac{\partial f}{\partial x}\) et \(\dfrac{\partial f}{\partial y}\). Justifier que \(f\) est de classe \(C^1\).</div>
  <div class="q"><strong>Q2.</strong> Donner \(\nabla f(1, 1)\).</div>
  <div class="q"><strong>Q3.</strong> Donner une valeur approchée de \(f(1{,}01;\ 0{,}98)\) et la comparer à la valeur exacte.</div>
  <div class="q"><strong>Q4.</strong> Calculer la dérivée de \(f\) en \((1, 1)\) selon le vecteur unitaire \(u = \big(\frac45, -\frac35\big)\). Dans quelle direction \(f\) croît-elle le plus vite à partir de \((1, 1)\), et à quel taux ?</div>
  <div class="q"><strong>Q5.</strong> Donner une équation du plan tangent à la surface \(z = f(x, y)\) au point \((1, 1, 4)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En gelant \(y\) : \(\dfrac{\partial f}{\partial x} = 2xy + 3y^3\) ; en gelant \(x\) : \(\dfrac{\partial f}{\partial y} = x^2 + 9xy^2\). Ces fonctions polynomiales sont continues : \(f\) est de classe \(C^1\) sur \(\mathbb{R}^2\).</p>
    <p><strong>Q2.</strong> \(\nabla f(1, 1) = (2 + 3,\ 1 + 9) = (5,\ 10)\).</p>
    <p><strong>Q3.</strong> Avec \(f(1, 1) = 4\) et \(h = (0{,}01;\ -0{,}02)\), Taylor-Young à l'ordre 1 donne</p>
    <div class="formula">$$f(1{,}01;\ 0{,}98) \approx 4 + 5 \times 0{,}01 + 10 \times (-0{,}02) = 3{,}85.$$</div>
    <p>La valeur exacte est \(3{,}8515\) à \(10^{-4}\) près : l'erreur, de l'ordre de \(10^{-3}\), est bien en \(\|h\|^2\).</p>
    <p><strong>Q4.</strong> \(D_u f(1, 1) = \langle \nabla f(1, 1), u\rangle\), soit \(5 \times \frac45 - 10 \times \frac35 = -2\) : \(f\) décroît dans cette direction. La croissance la plus rapide se fait dans la direction de \(\nabla f(1, 1)\), soit \(\frac{1}{\sqrt5}(1, 2)\), au taux \(\|\nabla f(1, 1)\| = \sqrt{125} = 5\sqrt5 \approx 11{,}2\).</p>
    <p><strong>Q5.</strong> \(z = f(1, 1) + 5(x - 1) + 10(y - 1)\), soit \(5x + 10y - z - 11 = 0\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Limites en l'origine et dérivées partielles</h3>
  <div class="statement">On pose, pour \((x, y) \neq (0, 0)\), \(f(x, y) = \dfrac{xy}{x^2 + y^2}\) et \(g(x, y) = \dfrac{xy}{\sqrt{x^2 + y^2}}\), et \(f(0, 0) = g(0, 0) = 0\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la limite de \(f\) en \((0, 0)\) le long de l'axe \(y = 0\), puis le long de la droite \(y = x\). Conclure.</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(f\) admet des dérivées partielles en \((0, 0)\). Qu'en conclure ?</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(g\) est continue en \((0, 0)\) et qu'elle admet des dérivées partielles nulles en ce point.</div>
  <div class="q"><strong>Q4.</strong> Calculer \(\dfrac{\partial g}{\partial x}\) hors de l'origine. La fonction \(g\) est-elle de classe \(C^1\) sur \(\mathbb{R}^2\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Sur \(y = 0\) : \(f(x, 0) = 0 \to 0\). Sur \(y = x\) : \(f(x, x) = \dfrac{x^2}{2x^2} = \dfrac12 \to \dfrac12\). Deux chemins, deux limites différentes : \(f\) n'a pas de limite en \((0, 0)\), elle n'y est pas continue.</p>
    <p><strong>Q2.</strong> \(\dfrac{f(h, 0) - f(0, 0)}{h} = 0\) et de même pour \(f(0, h)\) : les deux dérivées partielles existent en \((0, 0)\) et sont nulles. Une fonction peut donc avoir des dérivées partielles en un point sans y être continue.</p>
    <p><strong>Q3.</strong> En polaires, \(|g(r\cos\theta, r\sin\theta)| = r\,|\cos\theta\sin\theta| \leq \dfrac{r}{2}\), majoration indépendante de \(\theta\) qui tend vers 0 : \(g\) tend vers \(0 = g(0, 0)\). Comme \(g(h, 0) = g(0, h) = 0\), les taux d'accroissement sont nuls : \(\dfrac{\partial g}{\partial x}(0, 0) = \dfrac{\partial g}{\partial y}(0, 0) = 0\).</p>
    <p><strong>Q4.</strong> Hors de l'origine, en dérivant \(xy\,(x^2 + y^2)^{-1/2}\) :</p>
    <div class="formula">$$\frac{\partial g}{\partial x} = \frac{y}{\sqrt{x^2 + y^2}} - \frac{x^2 y}{(x^2 + y^2)^{3/2}} = \frac{y^3}{(x^2 + y^2)^{3/2}}.$$</div>
    <p>Sur l'axe \(x = 0\), elle vaut \(\dfrac{y^3}{|y|^3}\), soit \(1\) pour \(y \gt 0\) et \(-1\) pour \(y \lt 0\) : elle n'a pas de limite en \((0, 0)\). La dérivée partielle n'est pas continue à l'origine : \(g\) n'est pas de classe \(C^1\) sur \(\mathbb{R}^2\), bien qu'elle soit continue et admette partout des dérivées partielles.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Fonctions homogènes et coordonnées polaires</h3>
  <div class="statement">Soit \(P = \{(x, y),\ x \gt 0\}\) et \(f\) une fonction de classe \(C^1\) sur l'ouvert \(P\). On note \(\Phi(r, \theta) = (r\cos\theta, r\sin\theta)\) et \(g = f \circ \Phi\), définie sur \(V = \,]0, +\infty[\, \times \,]-\frac{\pi}{2}, \frac{\pi}{2}[\).</div>
  <div class="q"><strong>Q1.</strong> On suppose que \(f(tx, ty) = t^2 f(x, y)\) pour tout \(t \gt 0\) et tout \((x, y) \in P\). En dérivant \(t \mapsto f(tx, ty)\), montrer que \(x\,\dfrac{\partial f}{\partial x} + y\,\dfrac{\partial f}{\partial y} = 2f\) sur \(P\).</div>
  <div class="q"><strong>Q2.</strong> Justifier que \(\Phi\) est une bijection de \(V\) sur \(P\) et montrer que, pour \((x, y) = \Phi(r, \theta)\) :
    <div class="formula">$$r\,\frac{\partial g}{\partial r}(r, \theta) = x\,\frac{\partial f}{\partial x}(x, y) + y\,\frac{\partial f}{\partial y}(x, y).$$</div></div>
  <div class="q"><strong>Q3.</strong> Déterminer toutes les fonctions \(f\) de classe \(C^1\) sur \(P\) telles que \(x\,\dfrac{\partial f}{\partial x} + y\,\dfrac{\partial f}{\partial y} = 2f\). On montrera qu'elles s'écrivent \(f(x, y) = x^2\,\psi\big(\frac{y}{x}\big)\).</div>
  <div class="q"><strong>Q4.</strong> Vérifier sur \(f(x, y) = x^2 + 3xy - y^2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \((x, y)\) fixé, \(\gamma(t) = (tx, ty)\) reste dans \(P\) pour \(t \gt 0\), avec \(\gamma'(t) = (x, y)\). Par la règle de la chaîne, la dérivée de \(t \mapsto f(tx, ty)\) vaut \(x\,\dfrac{\partial f}{\partial x}(tx, ty) + y\,\dfrac{\partial f}{\partial y}(tx, ty)\) ; celle de \(t \mapsto t^2 f(x, y)\) vaut \(2t\,f(x, y)\). En \(t = 1\), on obtient la relation (dite d'Euler).</p>
    <p><strong>Q2.</strong> Tout point de \(P\) s'écrit de façon unique \((r\cos\theta, r\sin\theta)\) avec \(r = \sqrt{x^2 + y^2} \gt 0\) et \(\theta = \arctan\frac{y}{x} \in \,]-\frac\pi2, \frac\pi2[\) (car \(x \gt 0\)) ; la réciproque est de classe \(C^1\). Par la règle de la chaîne (passage en polaires du cours), la dérivée de \(g\) par rapport à \(r\) vaut \(\cos\theta\,\frac{\partial f}{\partial x} + \sin\theta\,\frac{\partial f}{\partial y}\) ; en multipliant par \(r\), \(r\cos\theta = x\) et \(r\sin\theta = y\) donnent la relation.</p>
    <p><strong>Q3.</strong> D'après Q2, l'équation équivaut à \(r\,\dfrac{\partial g}{\partial r} = 2g\) sur \(V\). Or</p>
    <div class="formula">$$\frac{\partial}{\partial r}\Big(\frac{g}{r^2}\Big) = \frac{r\,\dfrac{\partial g}{\partial r} - 2g}{r^3}.$$</div>
    <p>L'équation équivaut donc à : \(g/r^2\) a une dérivée nulle par rapport à \(r\). Pour chaque \(\theta\), \(r\) décrit l'intervalle \(]0, +\infty[\), donc \(g(r, \theta) = r^2 h(\theta)\), avec \(h(\theta) = g(1, \theta)\) de classe \(C^1\). Ainsi \(f(x, y) = (x^2 + y^2)\,h\big(\arctan\frac{y}{x}\big)\), et comme \(x^2 + y^2 = x^2\big(1 + \frac{y^2}{x^2}\big)\), \(f(x, y) = x^2\,\psi\big(\frac yx\big)\) avec \(\psi(s) = (1 + s^2)\,h(\arctan s)\), de classe \(C^1\). Réciproquement, une telle fonction vérifie \(f(tx, ty) = t^2 f(x, y)\), donc l'équation d'après Q1.</p>
    <p><strong>Q4.</strong> On a</p>
    <div class="formula">$$x\,\frac{\partial f}{\partial x} + y\,\frac{\partial f}{\partial y} = x(2x + 3y) + y(3x - 2y) = 2x^2 + 6xy - 2y^2 = 2f,$$</div>
    <p>et \(f(x, y) = x^2\big(1 + 3\frac yx - \frac{y^2}{x^2}\big)\), soit \(\psi(s) = 1 + 3s - s^2\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une équation aux dérivées partielles du second ordre</h3>
  <div class="statement">On cherche les fonctions \(f\) de classe \(C^2\) sur \(\mathbb{R}^2\) telles que
    <div class="formula">$$(\mathcal{E}) : \quad \frac{\partial^2 f}{\partial x^2} - 3\,\frac{\partial^2 f}{\partial x\,\partial y} + 2\,\frac{\partial^2 f}{\partial y^2} = 0.$$</div>
    On pose \(u = x + y\), \(v = 2x + y\), et \(f(x, y) = g(u, v)\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \((x, y) \mapsto (u, v)\) est une bijection de \(\mathbb{R}^2\) sur \(\mathbb{R}^2\) et exprimer sa réciproque.</div>
  <div class="q"><strong>Q2.</strong> Exprimer les dérivées partielles d'ordre 1 et 2 de \(f\) en fonction de celles de \(g\), puis montrer que \((\mathcal{E})\) équivaut à \(\dfrac{\partial^2 g}{\partial u\,\partial v} = 0\).</div>
  <div class="q"><strong>Q3.</strong> En déduire les solutions de \((\mathcal{E})\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer la solution telle que \(f(x, 0) = x^2\) et \(\dfrac{\partial f}{\partial y}(x, 0) = 0\) pour tout \(x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le système \(u = x + y\), \(v = 2x + y\) a pour solution unique \(x = v - u\), \(y = 2u - v\) : c'est une bijection linéaire de \(\mathbb{R}^2\), de réciproque linéaire, donc de classe \(C^2\). Ainsi \(g(u, v) = f(v - u, 2u - v)\) est de classe \(C^2\).</p>
    <p><strong>Q2.</strong> Par la règle de la chaîne, \(\dfrac{\partial f}{\partial x} = g_u + 2g_v\) et \(\dfrac{\partial f}{\partial y} = g_u + g_v\) (notation \(g_u = \frac{\partial g}{\partial u}\)). En dérivant à nouveau, avec Schwarz (\(g_{uv} = g_{vu}\)) :</p>
    <div class="formula">$$\begin{aligned} \frac{\partial^2 f}{\partial x^2} &= g_{uu} + 4g_{uv} + 4g_{vv}, \\ \frac{\partial^2 f}{\partial x\,\partial y} &= g_{uu} + 3g_{uv} + 2g_{vv}, \\ \frac{\partial^2 f}{\partial y^2} &= g_{uu} + 2g_{uv} + g_{vv}. \end{aligned}$$</div>
    <p>La combinaison de \((\mathcal{E})\) vaut</p>
    <div class="formula">$$(1 - 3 + 2)\,g_{uu} + (4 - 9 + 4)\,g_{uv} + (4 - 6 + 2)\,g_{vv} = -g_{uv},$$</div>
    <p>donc \((\mathcal{E})\) équivaut à \(g_{uv} = 0\).</p>
    <p><strong>Q3.</strong> \(\dfrac{\partial}{\partial u}\Big(\dfrac{\partial g}{\partial v}\Big) = 0\) sur \(\mathbb{R}^2\) : \(\dfrac{\partial g}{\partial v} = k(v)\), puis \(g(u, v) = G(v) + F(u)\), où \(G\) est une primitive de \(k\). Les solutions sont les</p>
    <div class="formula">$$f(x, y) = F(x + y) + G(2x + y),$$</div>
    <p>avec \(F\), \(G\) de classe \(C^2\) sur \(\mathbb{R}\) (réciproquement, ces fonctions conviennent).</p>
    <p><strong>Q4.</strong> Les conditions s'écrivent \(F(x) + G(2x) = x^2\) et \(F'(x) + G'(2x) = 0\). En dérivant la première, \(F'(x) + 2G'(2x) = 2x\) ; par différence, \(G'(2x) = 2x\), soit \(G'(s) = s\) et \(G(s) = \frac{s^2}{2} + C\). Puis \(F(x) = x^2 - 2x^2 - C = -x^2 - C\). Finalement</p>
    <div class="formula">$$f(x, y) = -(x + y)^2 + \frac{(2x + y)^2}{2} = x^2 - \frac{y^2}{2}.$$</div>
    <p>Contrôle : \(2 - 3 \times 0 + 2 \times (-1) = 0\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Minimum, maximum et cols sur une même surface</h3>
  <div class="statement">Soit \(f(x, y) = y\,(x^2 + y^2 - 3)\), définie sur \(\mathbb{R}^2\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer les points critiques de \(f\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer leur nature à l'aide de la hessienne.</div>
  <div class="q"><strong>Q3.</strong> Les extremums locaux trouvés sont-ils globaux ?</div>
  <div class="q"><strong>Q4.</strong> Décrire la ligne de niveau 0 de \(f\) et le signe de \(f\) dans le plan. Interpréter les résultats de Q2.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{\partial f}{\partial x} = 2xy\) et \(\dfrac{\partial f}{\partial y} = x^2 + 3y^2 - 3\). La première s'annule si \(x = 0\) ou \(y = 0\). Si \(x = 0\) : \(3y^2 = 3\), \(y = \pm1\). Si \(y = 0\) : \(x^2 = 3\). Quatre points critiques : \((0, 1)\), \((0, -1)\), \((\sqrt3, 0)\), \((-\sqrt3, 0)\).</p>
    <p><strong>Q2.</strong> \(r = 2y\), \(s = 2x\), \(t = 6y\).</p>
    <ul>
      <li>\((0, 1)\) : \(H = \begin{pmatrix} 2 & 0 \\ 0 & 6 \end{pmatrix}\), \(\det H = 12 \gt 0\), \(\operatorname{tr} H = 8 \gt 0\) : minimum local strict, \(f(0, 1) = -2\).</li>
      <li>\((0, -1)\) : \(\det H = 12 \gt 0\), \(\operatorname{tr} H = -8 \lt 0\) : maximum local strict, \(f(0, -1) = 2\).</li>
      <li>\((\pm\sqrt3, 0)\) : \(H = \begin{pmatrix} 0 & \pm 2\sqrt3 \\ \pm 2\sqrt3 & 0 \end{pmatrix}\), \(\det H = -12 \lt 0\) : points cols, où \(f\) vaut 0.</li>
    </ul>
    <p><strong>Q3.</strong> Non : \(f(0, y) = y^3 - 3y\) tend vers \(+\infty\) quand \(y \to +\infty\) et vers \(-\infty\) quand \(y \to -\infty\). Par exemple \(f(0, -10) = -970 \lt -2\) et \(f(0, 10) = 970 \gt 2\).</p>
    <p><strong>Q4.</strong> \(f = 0\) sur la réunion de l'axe des abscisses et du cercle de centre \(O\) et de rayon \(\sqrt3\). Ces deux courbes se croisent en \((\pm\sqrt3, 0)\) : comme dans le cours, deux lignes d'un même niveau qui se croisent signalent un point critique, ici des cols. \(f\) est du signe de \(y\) hors du disque et du signe opposé à l'intérieur : \(f \lt 0\) dans le demi-disque supérieur, qui contient le minimum \((0, 1)\), et \(f \gt 0\) dans le demi-disque inférieur, qui contient le maximum \((0, -1)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Extremums sur un disque</h3>
  <div class="statement">Soit \(f(x, y) = x^2 + y^2 - 2x\) et \(D = \{(x, y),\ x^2 + y^2 \leq 4\}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer les points critiques de \(f\) sur \(\mathbb{R}^2\) et leur nature.</div>
  <div class="q"><strong>Q2.</strong> En écrivant \(f\) sous forme canonique, montrer que le minimum trouvé est global.</div>
  <div class="q"><strong>Q3.</strong> Justifier que \(f\) admet un maximum et un minimum sur \(D\), puis les déterminer.</div>
  <div class="q"><strong>Q4.</strong> Interpréter géométriquement le résultat de Q3.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\nabla f = (2x - 2,\ 2y) = (0, 0)\) si et seulement si \((x, y) = (1, 0)\). La hessienne vaut \(\begin{pmatrix} 2 & 0 \\ 0 & 2 \end{pmatrix}\), de déterminant 4 et de trace 4 : minimum local strict.</p>
    <p><strong>Q2.</strong> \(f(x, y) = (x - 1)^2 + y^2 - 1 \geq -1\), avec égalité seulement en \((1, 0)\) : minimum global, \(f_{\min} = -1\).</p>
    <p><strong>Q3.</strong> \(D = \{4 - x^2 - y^2 \geq 0\}\) est fermé et borné, \(f\) est continue : le maximum et le minimum existent. À l'intérieur, le seul point critique est \((1, 0)\), où \(f = -1\). Sur le bord, \((2\cos\theta, 2\sin\theta)\) donne \(f = 4 - 4\cos\theta\), qui varie de 0 (en \(\theta = 0\), point \((2, 0)\)) à 8 (en \(\theta = \pi\), point \((-2, 0)\)). Conclusion : minimum \(-1\) en \((1, 0)\), maximum \(8\) en \((-2, 0)\), sur le bord, où le gradient \((-6, 0)\) n'est pas nul.</p>
    <p><strong>Q4.</strong> \(f(x, y) + 1\) est le carré de la distance de \((x, y)\) au point \(\Omega(1, 0)\). Les lignes de niveau sont les cercles de centre \(\Omega\) ; le minimum est atteint en \(\Omega\), le maximum au point de \(D\) le plus éloigné de \(\Omega\), à la distance \(3\) : \(9 - 1 = 8\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Un cas douteux : minimum sur toutes les droites, et pourtant…</h3>
  <div class="statement">Soit \(f(x, y) = (y - x^2)(y - 3x^2) = y^2 - 4x^2 y + 3x^4\), définie sur \(\mathbb{R}^2\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \((0, 0)\) est le seul point critique de \(f\) et que la hessienne ne permet pas de conclure.</div>
  <div class="q"><strong>Q2.</strong> Soit \(u = (\cos\alpha, \sin\alpha)\) un vecteur unitaire. Montrer que \(\varphi : t \mapsto f(t\cos\alpha, t\sin\alpha)\) admet en 0 un minimum local strict.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(f(x, 2x^2)\). La fonction \(f\) admet-elle un extremum local en \((0, 0)\) ?</div>
  <div class="q"><strong>Q4.</strong> Décrire le signe de \(f\) dans le plan et tirer la leçon de l'exercice.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{\partial f}{\partial x} = -8xy + 12x^3 = 4x(3x^2 - 2y)\) et \(\dfrac{\partial f}{\partial y} = 2y - 4x^2\). La seconde impose \(y = 2x^2\) ; la première devient \(4x(3x^2 - 4x^2) = -4x^3 = 0\), donc \(x = 0\), puis \(y = 0\). En \((0, 0)\) : \(r = 0\), \(s = 0\), \(t = 2\), donc \(\det H = 0\) : cas douteux.</p>
    <p><strong>Q2.</strong> Si \(\sin\alpha \neq 0\) : \(\varphi(t) = t^2(\sin\alpha - t\cos^2\alpha)(\sin\alpha - 3t\cos^2\alpha)\). Le produit des deux parenthèses tend vers \(\sin^2\alpha \gt 0\) quand \(t \to 0\) : il est strictement positif pour \(t\) assez petit, et \(\varphi(t) \gt 0 = \varphi(0)\) pour \(t \neq 0\) petit. Si \(\sin\alpha = 0\) : \(\varphi(t) = 3t^4 \gt 0\) pour \(t \neq 0\). Dans tous les cas, minimum local strict en 0.</p>
    <p><strong>Q3.</strong> \(f(x, 2x^2) = x^2 \times (-x^2) = -x^4 \lt 0\) pour \(x \neq 0\) : il y a des points arbitrairement proches de l'origine où \(f \lt f(0, 0)\), donc pas de minimum local. Et \(f(0, y) = y^2 \gt 0\) : pas de maximum local non plus. \(f\) n'a pas d'extremum en \((0, 0)\).</p>
    <p><strong>Q4.</strong> \(f \lt 0\) exactement entre les deux paraboles \(y = x^2\) et \(y = 3x^2\), et \(f \gt 0\) ailleurs, hors de ces courbes. Toute droite passant par l'origine finit par quitter cette région, ce qui explique Q2, mais la région s'approche de l'origine en s'aplatissant. Leçon : étudier les droites ne suffit pas pour conclure dans le cas douteux ; il faut un argument valable pour tous les points voisins (ici une courbe bien choisie).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Laplacien en polaires : un cylindre conducteur dans un champ uniforme</h3>
  <div class="statement">Sur \(\Omega = \mathbb{R}^2 \setminus \{(0, 0)\}\), on cherche les fonctions harmoniques de la forme \(f(x, y) = \varphi(r)\cos\theta\), où \((r, \theta)\) sont les coordonnées polaires de \((x, y)\) et \(\varphi\) est de classe \(C^2\) sur \(]0, +\infty[\). On rappelle que, pour \(g(r, \theta) = f(r\cos\theta, r\sin\theta)\) :
    <div class="formula">$$\Delta f = \frac{\partial^2 g}{\partial r^2} + \frac1r\,\frac{\partial g}{\partial r} + \frac{1}{r^2}\,\frac{\partial^2 g}{\partial \theta^2}.$$</div></div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f\) est harmonique si et seulement si \(r^2\varphi'' + r\,\varphi' - \varphi = 0\) sur \(]0, +\infty[\).</div>
  <div class="q"><strong>Q2.</strong> Résoudre cette équation différentielle (on cherchera des solutions de la forme \(r^\beta\)).</div>
  <div class="q"><strong>Q3.</strong> En déduire les fonctions cherchées, exprimées en \(x\) et \(y\).</div>
  <div class="q"><strong>Q4.</strong> Un cylindre conducteur d'axe \((Oz)\) et de rayon \(R\) est placé dans un champ électrique uniforme \(E_0\,\vec u_x\). Hors du cylindre, le potentiel \(V\) est harmonique, nul sur le cylindre (\(r = R\)), et \(V + E_0\,x\) tend vers 0 quand \(r \to +\infty\). Déterminer \(V\) parmi les fonctions de Q3.</div>
  <div class="q"><strong>Q5.</strong> Calculer le champ \(\vec E = -\nabla V\) sur le cylindre. Où est-il le plus intense ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(g = \varphi(r)\cos\theta\) : \(\Delta f = \Big(\varphi'' + \dfrac{\varphi'}{r} - \dfrac{\varphi}{r^2}\Big)\cos\theta\). Cette expression est nulle pour tout \(\theta\) (prendre \(\theta = 0\)) si et seulement si la parenthèse est nulle, ce qui équivaut, en multipliant par \(r^2\), à l'équation annoncée.</p>
    <p><strong>Q2.</strong> C'est une équation d'Euler. Pour \(\varphi = r^\beta\) : \(\big(\beta(\beta - 1) + \beta - 1\big)\,r^\beta = (\beta^2 - 1)\,r^\beta\), nul pour \(\beta = \pm1\). Sur \(]0, +\infty[\), l'équation se résout en \(\varphi''\) (coefficients continus) ; \(r\) et \(\frac1r\) ont pour wronskien \(-\frac2r \neq 0\) : les solutions sont les \(\varphi(r) = a\,r + \dfrac{b}{r}\).</p>
    <p><strong>Q3.</strong> Avec \(r\cos\theta = x\) et \(\dfrac{\cos\theta}{r} = \dfrac{x}{x^2 + y^2}\) :</p>
    <div class="formula">$$f(x, y) = a\,x + \frac{b\,x}{x^2 + y^2},\qquad (a, b) \in \mathbb{R}^2.$$</div>
    <p><strong>Q4.</strong> \(V + E_0 x = (a + E_0)\,x + \dfrac{b\,x}{x^2 + y^2}\) : le second terme tend vers 0 (il est majoré par \(\frac{|b|}{r}\)), le premier seulement si \(a = -E_0\). Sur le cylindre, \(V = \big(aR + \frac{b}{R}\big)\cos\theta = 0\) pour tout \(\theta\) impose \(b = -aR^2 = E_0 R^2\). Donc</p>
    <div class="formula">$$V(x, y) = -E_0\,x\Big(1 - \frac{R^2}{x^2 + y^2}\Big).$$</div>
    <p><strong>Q5.</strong> En polaires, \(g = -E_0\big(r - \frac{R^2}{r}\big)\cos\theta\), et le gradient s'écrit (cours, §4)</p>
    <div class="formula">$$\nabla V = \frac{\partial g}{\partial r}\,\vec u_r + \frac1r\,\frac{\partial g}{\partial \theta}\,\vec u_\theta.$$</div>
    <p>En \(r = R\) : \(\dfrac{\partial g}{\partial r} = -E_0\big(1 + \frac{R^2}{r^2}\big)\cos\theta = -2E_0\cos\theta\) et \(\dfrac{\partial g}{\partial \theta} = 0\). Donc \(\vec E = 2E_0\cos\theta\,\vec u_r\) : normal au conducteur (équipotentiel), d'intensité maximale \(2E_0\) en \(\theta = 0\) et \(\theta = \pi\), le double du champ appliqué.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un potentiel périodique et ses points critiques</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème <em>fonctions de deux variables, extremums</em>).</div>
  <div class="statement">On étudie sur \(\mathbb{R}^2\) la fonction
    <div class="formula">$$U(x, y) = \cos x + \cos y + \cos(x + y),$$</div>
    qui sert de modèle simple de potentiel périodique (par exemple pour un atome adsorbé sur la surface d'un cristal).</div>

  <p class="exo-part">Partie A — Généralités</p>
  <div class="q"><strong>A1.</strong> Justifier que \(U\) est de classe \(C^2\) sur \(\mathbb{R}^2\). Montrer que \(U(x + 2\pi, y) = U(x, y + 2\pi) = U(x, y)\), \(U(y, x) = U(x, y)\) et \(U(-x, -y) = U(x, y)\).</div>
  <div class="q"><strong>A2.</strong> Montrer que \(U\) admet sur \(\mathbb{R}^2\) un maximum et un minimum globaux.</div>
  <div class="q"><strong>A3.</strong> Déterminer le maximum de \(U\) et les points où il est atteint.</div>

  <p class="exo-part">Partie B — Points critiques</p>
  <div class="q"><strong>B1.</strong> Montrer que \((x, y)\) est un point critique si et seulement si \(\sin x = \sin y = -\sin(x + y)\).</div>
  <div class="q"><strong>B2.</strong> Déterminer les points critiques de \(U\) dans le carré \([0, 2\pi[^2\). On distinguera les cas \(y = x\) et \(y = \pi - x\) (modulo \(2\pi\)).</div>
  <div class="q"><strong>B3.</strong> Déterminer la nature de chacun d'eux à l'aide de la hessienne.</div>

  <p class="exo-part">Partie C — Le minimum global</p>
  <div class="q"><strong>C1.</strong> Montrer que \(\big|1 + \mathrm{e}^{ix} + \mathrm{e}^{i(x + y)}\big|^2 = 3 + 2\,U(x, y)\). En déduire que \(U \geq -\frac32\).</div>
  <div class="q"><strong>C2.</strong> Déterminer les points de \([0, 2\pi[^2\) où \(U = -\frac32\) et comparer avec la partie B.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(U\) est construite avec cosinus et sommes : elle est de classe \(C^2\) (et même \(C^\infty\)). Les égalités découlent de la \(2\pi\)-périodicité et de la parité du cosinus, et de la symétrie de l'expression en \(x\) et \(y\).</p>
    <p><strong>A2.</strong> Le carré \(K = [0, 2\pi]^2\) est fermé et borné, \(U\) est continue : elle y atteint un maximum \(M\) et un minimum \(m\). Par périodicité, tout point de \(\mathbb{R}^2\) a la même image qu'un point de \(K\) : \(M\) et \(m\) sont le maximum et le minimum globaux de \(U\) sur \(\mathbb{R}^2\).</p>
    <p><strong>A3.</strong> \(U \leq 1 + 1 + 1 = 3\), avec égalité si et seulement si \(\cos x = \cos y = 1\) (ce qui donne aussi \(\cos(x + y) = 1\)), c'est-à-dire \((x, y) \in (2\pi\mathbb{Z})^2\). Le maximum vaut 3.</p>
    <p><strong>B1.</strong> \(\dfrac{\partial U}{\partial x} = -\sin x - \sin(x + y)\) et \(\dfrac{\partial U}{\partial y} = -\sin y - \sin(x + y)\). Les deux sont nulles si et seulement si \(\sin x = -\sin(x + y) = \sin y\).</p>
    <p><strong>B2.</strong> \(\sin x = \sin y\) équivaut à \(y \equiv x\) ou \(y \equiv \pi - x \pmod{2\pi}\).</p>
    <ul>
      <li>Si \(y \equiv \pi - x\) : \(\sin(x + y) = \sin\pi = 0\), donc \(\sin x = 0\), \(x \in \{0, \pi\}\) : points \((0, \pi)\) et \((\pi, 0)\).</li>
      <li>Si \(y = x\) : \(\sin x + \sin 2x = \sin x\,(1 + 2\cos x) = 0\), donc \(x \in \{0, \pi\}\) ou \(\cos x = -\frac12\), \(x \in \{\frac{2\pi}{3}, \frac{4\pi}{3}\}\) : points \((0, 0)\), \((\pi, \pi)\), \((\frac{2\pi}{3}, \frac{2\pi}{3})\), \((\frac{4\pi}{3}, \frac{4\pi}{3})\).</li>
    </ul>
    <p>Six points critiques dans \([0, 2\pi[^2\).</p>
    <p><strong>B3.</strong> \(r = -\cos x - \cos(x + y)\), \(s = -\cos(x + y)\), \(t = -\cos y - \cos(x + y)\).</p>
    <ul>
      <li>\((0, 0)\) : \(H = \begin{pmatrix} -2 & -1 \\ -1 & -2 \end{pmatrix}\), \(\det H = 3 \gt 0\), \(\operatorname{tr} H = -4 \lt 0\) : maximum local, \(U = 3\).</li>
      <li>\((\frac{2\pi}{3}, \frac{2\pi}{3})\) et \((\frac{4\pi}{3}, \frac{4\pi}{3})\) : tous les cosinus valent \(-\frac12\), \(H = \begin{pmatrix} 1 & \frac12 \\ \frac12 & 1 \end{pmatrix}\), \(\det H = \frac34 \gt 0\), \(\operatorname{tr} H = 2 \gt 0\) : minimums locaux, \(U = -\frac32\).</li>
      <li>\((\pi, \pi)\) : \(H = \begin{pmatrix} 0 & -1 \\ -1 & 0 \end{pmatrix}\), \(\det H = -1\) : col, \(U = -1\).</li>
      <li>\((0, \pi)\) : \(H = \begin{pmatrix} 0 & 1 \\ 1 & 2 \end{pmatrix}\), \(\det H = -1\) : col ; de même \((\pi, 0)\) par symétrie. \(U = -1\).</li>
    </ul>
    <p><strong>C1.</strong> Pour \(a, b, c\) complexes, en développant \((a + b + c)(\bar a + \bar b + \bar c)\) :</p>
    <div class="formula">$$|a + b + c|^2 = |a|^2 + |b|^2 + |c|^2 + 2\operatorname{Re}(a\bar b + a\bar c + b\bar c).$$</div>
    <p>Avec \(a = 1\), \(b = \mathrm{e}^{ix}\), \(c = \mathrm{e}^{i(x + y)}\) : les modules valent 1 et \(a\bar b = \mathrm{e}^{-ix}\), \(a\bar c = \mathrm{e}^{-i(x + y)}\), \(b\bar c = \mathrm{e}^{-iy}\), de parties réelles \(\cos x\), \(\cos(x + y)\), \(\cos y\). D'où \(3 + 2U\), qui est positif : \(U \geq -\frac32\).</p>
    <p><strong>C2.</strong> \(U = -\frac32\) si et seulement si \(1 + \mathrm{e}^{ix} + \mathrm{e}^{i(x + y)} = 0\). Alors \(|1 + \mathrm{e}^{ix}| = 1\), soit \(2 + 2\cos x = 1\), \(\cos x = -\frac12\). Si \(x = \frac{2\pi}{3}\), \(\mathrm{e}^{i(x + y)} = -1 - \mathrm{e}^{2i\pi/3} = \mathrm{e}^{4i\pi/3}\), donc \(y = \frac{2\pi}{3}\) ; si \(x = \frac{4\pi}{3}\), on trouve de même \(y = \frac{4\pi}{3}\). Les deux minimums locaux de B3 sont donc les points de minimum global, \(m = -\frac32\) : les trois vecteurs unitaires \(1\), \(\mathrm{e}^{ix}\), \(\mathrm{e}^{i(x + y)}\) forment alors un triangle équilatéral. Les cols, de valeur \(-1\), sont les « passages » les plus bas entre deux puits de potentiel.</p>
  </div>
</div>
