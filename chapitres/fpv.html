  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie « Fonctions de deux ou trois variables » du programme de PT (section « Équations différentielles et calcul différentiel », B). Il reprend et prolonge le chapitre de première année consacré aux fonctions de deux variables : on y ajoute la topologie de \(\mathbb{R}^2\) et \(\mathbb{R}^3\), les dérivées d'ordre 2, les équations aux dérivées partielles et l'étude complète des extremums. La notion de différentielle est hors programme : tout se fait avec les dérivées partielles et le gradient. Les applications géométriques (tangente à une courbe \(f(x, y) = 0\), plan tangent à une surface) sont développées dans les chapitres « Courbes du plan et coniques » et « Courbes et surfaces de l'espace ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Topologie de \(\mathbb{R}^2\) et \(\mathbb{R}^3\)</strong> : norme euclidienne et distance, boules ouvertes et fermées, parties ouvertes, fermées, bornées, point intérieur, point adhérent, chaque notion illustrée par une figure (§1).</li>
        <li><strong>Limite et continuité</strong> : limite en un point adhérent, continuité, opérations ; si \(f\) est continue, \(\{f \gt 0\}\) est ouvert, \(\{f = 0\}\) et \(\{f \geq 0\}\) sont fermés ; théorème des bornes atteintes, démonstration hors programme. L'étude de la continuité n'est pas un objectif en soi (§2).</li>
        <li><strong>Dérivées partielles d'ordre 1</strong> en un point intérieur, notations \(\frac{\partial f}{\partial x_i}(a)\), \(\partial_i f(a)\) ; classe \(C^1\) sur un ouvert (définie par les dérivées partielles continues) ; opérations ; formule de Taylor-Young à l'ordre 1 ; gradient \(\nabla f\) (§3).</li>
        <li><strong>Dérivée selon un vecteur</strong>, expression \(\langle \nabla f(a), u\rangle\) ; <strong>règle de la chaîne</strong> le long d'une courbe, \((f\circ\gamma)'(t) = \langle \nabla f(\gamma(t)), \gamma'(t)\rangle\) ; dérivées partielles de \((u, v) \mapsto f(\varphi(u, v), \psi(u, v))\) (§4).</li>
        <li><strong>Dérivées partielles d'ordre 2</strong>, classe \(C^2\), <strong>théorème de Schwarz</strong> (démonstration hors programme) (§5) ; exemples simples d'<strong>équations aux dérivées partielles</strong> du premier et du second ordre (§6).</li>
        <li><strong>Extremums d'une fonction de \(\mathbb{R}^2\) dans \(\mathbb{R}\)</strong> : point critique, extremum local ou global, condition nécessaire sur un ouvert (§7) ; matrice hessienne \(H_f(a)\), formule de Taylor-Young à l'ordre 2 (démonstration hors programme), nature d'un point critique par le déterminant et la trace de la hessienne, exemples de maximums, minimums et points cols (§8) ; exemples de recherche d'extremums globaux sur une partie fermée bornée (§9).</li>
        <li><strong>Fonctions de \(\mathbb{R}^p\) dans \(\mathbb{R}^n\)</strong> (\(p, n \leq 3\)) : limite, continuité, dérivées partielles et classes \(C^1\), \(C^2\), coordonnée par coordonnée (§10).</li>
      </ul>
      <p>Hors programme : la différentielle, la matrice jacobienne et les difféomorphismes, les extremums liés (multiplicateurs de Lagrange), la classification des points critiques en trois variables (section finale).</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · TOPOLOGIE DE ℝ² ET ℝ³</div>
  <h2>Voisinages, ouverts et fermés</h2>
  <div class="intro">Dériver une fonction en un point demande de pouvoir s'en écarter dans toutes les directions ; garantir l'existence d'un maximum demande au contraire que le domaine « contienne son bord » et ne parte pas à l'infini. Ces deux besoins se formulent avec quelques mots de topologie, tous construits à partir de la distance euclidienne. Dans tout le chapitre, \(p \in \{2, 3\}\).</div>
  <div class="def-box">
    La <strong>norme euclidienne</strong> de \(x = (x_1, \ldots, x_p) \in \mathbb{R}^p\) est \(\|x\| = \sqrt{x_1^2 + \cdots + x_p^2}\), et la <strong>distance</strong> de \(a\) à \(b\) est \(\|b - a\|\). Elle vérifie \(\|x\| = 0 \iff x = 0\), \(\|\lambda x\| = |\lambda|\,\|x\|\) et l'<strong>inégalité triangulaire</strong> \(\|x + y\| \leq \|x\| + \|y\|\). Pour chaque coordonnée :
    <div class="formula" data-nom="Norme et coordonnées">$$|x_i| \leq \|x\| \leq |x_1| + \cdots + |x_p|.$$</div>
  </div>
  <div class="def-box">
    Soit \(a \in \mathbb{R}^p\) et \(r \gt 0\).
    <ul>
      <li><strong>Boule ouverte</strong> : \(B(a, r) = \{x \in \mathbb{R}^p,\ \|x - a\| \lt r\}\) ; <strong>boule fermée</strong> : \(\overline{B}(a, r) = \{x,\ \|x - a\| \leq r\}\). Dans le plan, ce sont des disques, sans ou avec leur cercle bord.</li>
      <li>Une partie \(U\) est <strong>ouverte</strong> si pour tout \(a \in U\), il existe \(r \gt 0\) tel que \(B(a, r) \subset U\) : autour de chacun de ses points, \(U\) contient une petite boule.</li>
      <li>Une partie \(F\) est <strong>fermée</strong> si son complémentaire \(\mathbb{R}^p \setminus F\) est ouvert.</li>
      <li>Une partie \(A\) est <strong>bornée</strong> s'il existe \(R \gt 0\) tel que \(A \subset \overline{B}(0, R)\).</li>
      <li>Un point \(a\) est <strong>intérieur</strong> à \(A\) s'il existe \(r \gt 0\) tel que \(B(a, r) \subset A\) ; il est <strong>adhérent</strong> à \(A\) si toute boule \(B(a, r)\) rencontre \(A\).</li>
    </ul>
  </div>

  <p>Un point intérieur à \(A\) appartient à \(A\) ; un point de \(A\) est adhérent à \(A\), mais un point adhérent peut ne pas appartenir à \(A\) (point du bord d'un ouvert). Une partie est ouverte si et seulement si tous ses points lui sont intérieurs, et fermée si et seulement si elle contient tous ses points adhérents.</p>
  <div class="prop-box">
    <strong>Exemples de référence.</strong> Une boule ouverte est une partie ouverte, une boule fermée est une partie fermée. \(\mathbb{R}^p\) et \(\varnothing\) sont à la fois ouverts et fermés. Un produit d'intervalles ouverts (rectangle ouvert, pavé ouvert) est ouvert ; un produit de segments est fermé et borné.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une boule ouverte est ouverte : l'inégalité triangulaire suffit.</span>
    <div class="content"><p>Soit \(b \in B(a, r)\) et \(\rho = r - \|b - a\| \gt 0\). Pour \(x \in B(b, \rho)\) :</p>
    <div class="formula">$$\begin{aligned} \|x - a\| &\leq \|x - b\| + \|b - a\| \\ &\lt \rho + \|b - a\| = r. \end{aligned}$$</div>
    <p>Donc \(B(b, \rho) \subset B(a, r)\). Pour la boule fermée, on montre de même que le complémentaire \(\{x,\ \|x - a\| \gt r\}\) est ouvert, avec le rayon \(\|b - a\| - r\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — ouvert, fermé, ou ni l'un ni l'autre</strong>
    <ol>
      <li>Le demi-plan \(P = \{(x, y),\ x \gt 0\}\) est ouvert : si \(a = (a_1, a_2) \in P\), la boule \(B(a, a_1)\) est dans \(P\), car pour \((x, y)\) dans cette boule, \(|x - a_1| \leq \|(x, y) - a\| \lt a_1\), donc \(x \gt 0\).</li>
      <li>Le carré \([0, 1]^2\) est fermé et borné.</li>
      <li>\(A = \,]0, 1] \times [0, 1]\) n'est <strong>ni ouvert ni fermé</strong> : le point \((1, \frac12)\) appartient à \(A\) sans lui être intérieur (toute boule centrée en ce point contient des points d'abscisse \(\gt 1\)) ; le point \((0, \frac12)\) est adhérent à \(A\) sans lui appartenir.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que « fermé » signifie « non ouvert ». Les deux notions ne sont pas contraires : \(\mathbb{R}^2\) est les deux à la fois, et \(]0, 1] \times [0, 1]\) n'est ni l'un ni l'autre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LIMITE ET CONTINUITÉ</div>
  <h2>S'approcher d'un point par tous les chemins</h2>
  <div class="intro">En une variable, on s'approche d'un point par la gauche ou par la droite. Dans le plan, on peut s'en approcher par une infinité de chemins : la limite doit être la même sur tous. Le programme précise que la continuité est introduite <strong>en vue du calcul différentiel</strong> : son étude n'est pas un objectif en soi.</div>
  <p>Une fonction \(f : D \to \mathbb{R}\), avec \(D \subset \mathbb{R}^2\), se représente par sa <strong>surface</strong> d'équation \(z = f(x, y)\), ou par ses <strong>lignes de niveau</strong> \(\{(x, y) \in D,\ f(x, y) = k\}\), comme les courbes de niveau d'une carte de randonnée. Pour une fonction de trois variables (température, potentiel électrique), on parle de <strong>surfaces de niveau</strong>.</p>
  <div class="def-box">
    Soit \(f : D \to \mathbb{R}\), \(a\) un point adhérent à \(D\) et \(\ell \in \mathbb{R}\). On dit que \(f\) <strong>tend vers \(\ell\)</strong> en \(a\) si
    <div class="formula" data-nom="Limite en un point">$$\begin{aligned} &\forall \varepsilon \gt 0,\ \exists \delta \gt 0,\ \forall x \in D, \\ &\|x - a\| \lt \delta \implies |f(x) - \ell| \lt \varepsilon. \end{aligned}$$</div>
    Si \(a \in D\), \(f\) est <strong>continue en \(a\)</strong> lorsque \(f(x) \to f(a)\) ; elle est continue sur \(D\) si elle l'est en tout point de \(D\).
  </div>
  <div class="prop-box">
    <strong>Opérations.</strong> Les fonctions coordonnées \((x, y) \mapsto x\) et \((x, y) \mapsto y\) sont continues (car \(|x - a_1| \leq \|(x, y) - a\|\)). Sommes, produits, quotients à dénominateur non nul de fonctions continues sont continus, ainsi que les composées \(\varphi \circ f\) avec \(\varphi\) continue d'une variable. En particulier, les fonctions polynomiales sont continues sur \(\mathbb{R}^p\), et une expression construite avec les fonctions usuelles est continue là où elle est définie.
  </div>
  <div class="method-box">
    <strong>Méthode — étudier une limite en un point</strong>
    <ol>
      <li><strong>Pour montrer que \(f \to \ell\)</strong> : majorer \(|f(x) - \ell|\) par une quantité qui ne dépend que de \(\|x - a\|\) et tend vers 0. En \((0, 0)\), on peut passer en polaires : si \(|f(r\cos\theta, r\sin\theta) - \ell| \leq \eta(r)\) avec \(\eta(r) \to 0\) <strong>indépendamment de \(\theta\)</strong>, c'est gagné.</li>
      <li><strong>Pour montrer qu'il n'y a pas de limite</strong> : trouver deux chemins aboutissant en \(a\) le long desquels \(f\) a des limites différentes (axes, droites, paraboles…).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une limite par majoration, une non-limite par deux chemins</strong>
    <ol>
      <li>\(f(x, y) = \dfrac{x^3 + y^3}{x^2 + y^2}\) sur \(\mathbb{R}^2 \setminus \{0\}\). Comme \(|x|^3 \leq |x|(x^2 + y^2)\), on a \(|f(x, y)| \leq |x| + |y| \leq 2\|(x, y)\|\), qui tend vers 0. En posant \(f(0, 0) = 0\), \(f\) devient continue sur \(\mathbb{R}^2\).</li>
      <li>\(g(x, y) = \dfrac{x^2 y}{x^4 + y^2}\). Sur la droite \(y = mx\) : \(g(x, mx) = \dfrac{m x}{x^2 + m^2} \to 0\) (et \(g = 0\) sur l'axe des ordonnées) : la limite vaut 0 le long de toutes les droites. Mais sur la parabole \(y = x^2\) : \(g(x, x^2) = \frac12\). La fonction \(g\) n'a pas de limite en \((0, 0)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure à l'existence d'une limite après avoir testé les droites passant par le point, ou après avoir fait tendre \(r\) vers 0 « à \(\theta\) fixé ». L'exemple de \(g\) montre que les droites ne suffisent pas : seule une majoration uniforme prouve la limite.</div>
  <h3>Continuité, ouverts et fermés</h3>
  <div class="prop-box">
    <strong>Propriété.</strong> Si \(f : \mathbb{R}^p \to \mathbb{R}\) est continue, alors l'ensemble \(\{x,\ f(x) \gt 0\}\) est <strong>ouvert</strong>, et les ensembles \(\{x,\ f(x) = 0\}\) et \(\{x,\ f(x) \geq 0\}\) sont <strong>fermés</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une valeur strictement positive le reste au voisinage.</span>
    <div class="content">
      <p>Soit \(a\) tel que \(f(a) \gt 0\). La continuité en \(a\) avec \(\varepsilon = f(a)/2\) fournit \(\delta \gt 0\) tel que \(\|x - a\| \lt \delta \implies |f(x) - f(a)| \lt f(a)/2\), donc \(f(x) \gt f(a)/2 \gt 0\) : la boule \(B(a, \delta)\) est contenue dans \(\{f \gt 0\}\), qui est donc ouvert.</p>
      <p>Le complémentaire de \(\{f \geq 0\}\) est \(\{-f \gt 0\}\), ouvert : \(\{f \geq 0\}\) est fermé. Le complémentaire de \(\{f = 0\}\) est \(\{f \gt 0\} \cup \{-f \gt 0\}\), réunion de deux ouverts, donc ouvert (une boule contenue dans l'un est contenue dans la réunion).</p>
    </div>
  </div>
  <p>Ainsi le disque \(\{x^2 + y^2 \lt 1\}\) est ouvert (\(f = 1 - x^2 - y^2\)), la région \(\{\frac{x^2}{4} + y^2 \leq 1\}\) limitée par une ellipse est fermée, l'hyperbole \(\{xy = 1\}\) est fermée (mais pas bornée), la boule \(\{x^2 + y^2 + z^2 \leq 4\}\) est fermée et bornée.</p>
  <div class="prop-box">
    <strong>Théorème des bornes atteintes.</strong> Une fonction réelle continue sur une partie <strong>fermée bornée</strong> non vide \(K\) de \(\mathbb{R}^p\) est bornée et <strong>atteint ses bornes</strong> : il existe \(a, b \in K\) tels que \(f(a) \leq f(x) \leq f(b)\) pour tout \(x \in K\). (Démonstration hors programme.)
  </div>
  <p>Les deux hypothèses sont indispensables : sur le disque ouvert \(\{x^2 + y^2 \lt 1\}\), la fonction \(x^2 + y^2\) a pour borne supérieure 1, jamais atteinte ; sur le demi-plan fermé \(\{x \geq 0\}\), non borné, la fonction \((x, y) \mapsto x\) n'est pas majorée. Ce théorème garantit l'existence des extremums cherchés au §9.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · DÉRIVÉES PARTIELLES, CLASSE C¹, GRADIENT</div>
  <h2>Dériver une variable à la fois</h2>
  <div class="intro">Pour mesurer comment varie \(f(x, y)\), on commence par ne faire bouger qu'une variable : on gèle les autres, et l'on dérive une fonction d'une seule variable. Les dérivées partielles se rassemblent en un vecteur, le gradient, qui donne l'approximation affine de \(f\) au voisinage d'un point.</div>
  <div class="def-box">
    Soit \(f : D \to \mathbb{R}\) et \(a = (a_1, a_2)\) un point <strong>intérieur</strong> à \(D \subset \mathbb{R}^2\). La <strong>dérivée partielle</strong> de \(f\) par rapport à \(x\) en \(a\) est, si elle existe, la dérivée en \(a_1\) de la fonction partielle \(x \mapsto f(x, a_2)\) :
    <div class="formula" data-nom="Dérivée partielle">$$\begin{aligned} \frac{\partial f}{\partial x}(a) &= \partial_1 f(a) \\ &= \lim_{h \to 0} \frac{f(a_1 + h,\, a_2) - f(a_1, a_2)}{h}. \end{aligned}$$</div>
    On définit de même \(\frac{\partial f}{\partial y}(a) = \partial_2 f(a)\) et, en trois variables, \(\frac{\partial f}{\partial z}(a) = \partial_3 f(a)\). Le point doit être intérieur pour que la fonction partielle soit définie autour de \(a_1\).
  </div>
  <div class="def-box">
    Soit \(U\) un ouvert. Une fonction \(f : U \to \mathbb{R}\) est <strong>de classe \(C^1\)</strong> sur \(U\) si ses dérivées partielles existent en tout point de \(U\) et sont <strong>continues</strong> sur \(U\). Son <strong>gradient</strong> en \(a \in U\) est le vecteur
    <div class="formula" data-nom="Gradient">$$\nabla f(a) = \Big(\frac{\partial f}{\partial x_1}(a),\ \ldots,\ \frac{\partial f}{\partial x_p}(a)\Big).$$</div>
  </div>
  <div class="prop-box">
    <strong>Opérations.</strong> Sommes, produits, quotients à dénominateur non nul de fonctions \(C^1\) sont \(C^1\), ainsi que \(\varphi \circ f\) avec \(\varphi\) de classe \(C^1\) d'une variable (démonstrations hors programme). Les fonctions polynomiales sont \(C^1\) sur \(\mathbb{R}^p\).
  </div>
  <div class="prop-box">
    <strong>Formule de Taylor-Young à l'ordre 1.</strong> Si \(f\) est de classe \(C^1\) sur l'ouvert \(U\) et \(a \in U\), alors, quand \(h \to 0\) (démonstration hors programme) :
    <div class="formula" data-nom="Taylor-Young à l'ordre 1">$$f(a + h) = f(a) + \langle \nabla f(a), h\rangle + o(\|h\|).$$</div>
    En deux variables, avec \(h = (h_1, h_2)\) :
    <div class="formula">$$\begin{aligned} f(a_1 + h_1, a_2 + h_2) = f(a) &+ \frac{\partial f}{\partial x}(a)\,h_1 \\ &+ \frac{\partial f}{\partial y}(a)\,h_2 + o(\|h\|). \end{aligned}$$</div>
    En particulier, une fonction de classe \(C^1\) est continue. Géométriquement, le plan d'équation \(z = f(a) + \partial_1 f(a)(x - a_1) + \partial_2 f(a)(y - a_2)\) est le <strong>plan tangent</strong> en \((a, f(a))\) à la surface \(z = f(x, y)\) : voir le chapitre « Courbes et surfaces de l'espace ».
  </div>
  <div class="method-box">
    <strong>Exemple — dérivées partielles et approximation affine</strong>
    <p>\(f(x, y) = x\,\mathrm{e}^y + y^2\), de classe \(C^1\) sur \(\mathbb{R}^2\) (opérations).</p>
    <ol>
      <li>En gelant \(y\) : \(\dfrac{\partial f}{\partial x} = \mathrm{e}^y\). En gelant \(x\) : \(\dfrac{\partial f}{\partial y} = x\,\mathrm{e}^y + 2y\).</li>
      <li>En \(a = (2, 0)\) : \(f(a) = 2\) et \(\nabla f(a) = (1, 2)\).</li>
      <li>Approximation :
        <div class="formula">$$f(2{,}01;\ -0{,}02) \approx 2 + 1 \times 0{,}01 + 2 \times (-0{,}02) = 1{,}97.$$</div>
        La valeur exacte est \(1{,}9706\) à \(10^{-4}\) près : l'erreur est d'ordre \(\|h\|^2\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le gradient de la distance à l'origine</strong>
    <p>Sur \(\mathbb{R}^3 \setminus \{0\}\), soit \(r(x, y, z) = \sqrt{x^2 + y^2 + z^2}\).</p>
    <ol>
      <li>\(\dfrac{\partial r}{\partial x} = \dfrac{2x}{2\sqrt{x^2 + y^2 + z^2}} = \dfrac{x}{r}\), et de même pour \(y\), \(z\) : \(\nabla r = \dfrac{1}{r}(x, y, z) = \vec u_r\), le vecteur unitaire radial.</li>
      <li>Par la règle de la chaîne en une variable : \(\nabla\big(\tfrac{1}{r}\big) = -\dfrac{1}{r^2}\nabla r = -\dfrac{(x, y, z)}{r^3}\).</li>
      <li>En physique, le potentiel \(V = \dfrac{q}{4\pi\varepsilon_0 r}\) donne le champ de Coulomb \(\vec E = -\nabla V = \dfrac{q}{4\pi\varepsilon_0}\,\dfrac{\vec u_r}{r^2}\).</li>
    </ol>
  </div>
  <p><strong>Calcul d'incertitudes.</strong> La formule de Taylor-Young justifie la propagation des petites erreurs. Pour le volume \(V = \pi R^2 h\) d'un cylindre, \(\frac{\partial V}{\partial R} = 2\pi R h\) et \(\frac{\partial V}{\partial h} = \pi R^2\), d'où \(\Delta V \approx 2\pi R h\,\Delta R + \pi R^2\,\Delta h\), soit \(\dfrac{\Delta V}{V} \approx 2\dfrac{\Delta R}{R} + \dfrac{\Delta h}{h}\) : une erreur de 1 % sur le rayon pèse deux fois plus que la même erreur sur la hauteur.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire que l'existence des dérivées partielles entraîne la continuité. La fonction \(g\) du §2, prolongée par \(g(0, 0) = 0\), vérifie \(g(x, 0) = g(0, y) = 0\) : ses deux dérivées partielles en \((0, 0)\) existent et sont nulles, et pourtant \(g\) n'est pas continue en ce point. C'est pourquoi la classe \(C^1\) exige la <strong>continuité</strong> des dérivées partielles : c'est elle qui donne la formule de Taylor-Young.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · DÉRIVÉE SELON UN VECTEUR ET RÈGLE DE LA CHAÎNE</div>
  <h2>Dériver le long d'une direction, le long d'une courbe</h2>
  <div class="intro">Les dérivées partielles mesurent la variation de \(f\) le long des axes. Le gradient donne bien plus : la variation dans n'importe quelle direction, et le long de n'importe quelle courbe. C'est l'outil central des applications géométriques et physiques.</div>
  <div class="def-box">
    Soit \(f\) définie sur un ouvert \(U\), \(a \in U\) et \(u \in \mathbb{R}^p\). La <strong>dérivée de \(f\) en \(a\) selon le vecteur \(u\)</strong> est, si elle existe, la dérivée en 0 de \(t \mapsto f(a + tu)\) :
    <div class="formula">$$D_u f(a) = \lim_{t \to 0} \frac{f(a + tu) - f(a)}{t}.$$</div>
    Pour \(u = (1, 0)\), on retrouve \(\frac{\partial f}{\partial x}(a)\).
  </div>
  <div class="prop-box">
    <strong>Expression par le gradient.</strong> Si \(f\) est de classe \(C^1\) sur \(U\), elle admet en tout point une dérivée selon tout vecteur \(u\), et
    <div class="formula" data-nom="Dérivée selon un vecteur">$$D_u f(a) = \langle \nabla f(a), u\rangle.$$</div>
    Pour \(u\) unitaire, \(D_u f(a) = \|\nabla f(a)\|\cos\alpha\), où \(\alpha\) est l'angle entre \(u\) et \(\nabla f(a)\) : lorsque \(\nabla f(a) \neq 0\), \(f\) croît le plus vite dans la direction du gradient, à la vitesse \(\|\nabla f(a)\|\), décroît le plus vite dans la direction opposée, et ne varie pas au premier ordre dans les directions orthogonales.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Taylor-Young avec h = tu.</span>
    <div class="content"><p>Avec \(h = tu\), la formule de Taylor-Young donne \(f(a + tu) = f(a) + t\,\langle \nabla f(a), u\rangle + o(t)\). On divise par \(t\) et on fait tendre \(t\) vers 0. L'inégalité de Cauchy-Schwarz \(|\langle \nabla f(a), u\rangle| \leq \|\nabla f(a)\|\), avec égalité pour \(u\) colinéaire au gradient, donne l'interprétation.</p></div>
  </div>
  <div class="prop-box">
    <strong>Règle de la chaîne le long d'une courbe.</strong> Soit \(\gamma : t \mapsto \big(x_1(t), \ldots, x_p(t)\big)\) de classe \(C^1\) sur un intervalle \(I\), à valeurs dans l'ouvert \(U\), et \(f\) de classe \(C^1\) sur \(U\). Alors \(f \circ \gamma\) est de classe \(C^1\) sur \(I\) et
    <div class="formula" data-nom="Règle de la chaîne">$$\begin{aligned} (f \circ \gamma)'(t) &= \langle \nabla f(\gamma(t)), \gamma'(t)\rangle \\ &= \sum_{i=1}^p \frac{\partial f}{\partial x_i}\big(\gamma(t)\big)\,x_i'(t). \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de la preuve</span>
    <span class="prompt">Le déplacement γ(t + s) − γ(t) vaut s γ′(t) au premier ordre.</span>
    <div class="content"><p>On applique la formule de Taylor-Young en \(\gamma(t)\) avec \(h = \gamma(t + s) - \gamma(t) = s\,\gamma'(t) + o(s)\) :</p>
    <div class="formula">$$\begin{aligned} f(\gamma(t + s)) - f(\gamma(t)) &= \langle \nabla f(\gamma(t)), h\rangle + o(\|h\|) \\ &= s\,\langle \nabla f(\gamma(t)), \gamma'(t)\rangle + o(s). \end{aligned}$$</div>
    <p>On divise par \(s\). La continuité de la dérivée obtenue vient de celle des dérivées partielles et de \(\gamma'\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — dans quelle direction la température monte-t-elle le plus vite ?</strong>
    <p>Sur une plaque, la température vaut \(T(x, y) = 20 - x^2 - 2y^2\) (en °C, distances en dm). On se place en \(A(1, 1)\).</p>
    <ol>
      <li>\(\nabla T = (-2x, -4y)\), donc \(\nabla T(A) = (-2, -4)\).</li>
      <li>Dans la direction unitaire \(u = (\frac35, \frac45)\) : \(D_u T(A) = -2 \times \frac35 - 4 \times \frac45 = -4{,}4\) °C/dm : la température baisse.</li>
      <li>La montée la plus rapide se fait dans la direction de \(\nabla T(A)\), c'est-à-dire de \(-(1, 2)/\sqrt5\), au taux \(\|\nabla T(A)\| = 2\sqrt5 \approx 4{,}47\) °C/dm. Dans la direction \(\pm(2, -1)/\sqrt5\), orthogonale au gradient, la variation est nulle au premier ordre : c'est la tangente à la ligne de niveau.</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Gradient et lignes de niveau.</strong> Si \(\gamma\) est une courbe de classe \(C^1\) tracée sur la ligne de niveau \(\{f = k\}\), alors \(f(\gamma(t)) = k\) pour tout \(t\), donc \(\langle \nabla f(\gamma(t)), \gamma'(t)\rangle = 0\) : <strong>le gradient est orthogonal aux lignes de niveau</strong> (aux surfaces de niveau en dimension 3), et il est orienté vers les valeurs croissantes de \(f\). L'équation de la tangente à une courbe \(f(x, y) = 0\) en un point où \(\nabla f \neq 0\) en découle (chapitre « Courbes du plan et coniques »), ainsi que celle du plan tangent à une surface \(F(x, y, z) = 0\) (chapitre « Courbes et surfaces de l'espace »).
  </div>
  <div class="method-box">
    <strong>Exemple — dériver le long d'un cercle</strong>
    <p>\(f(x, y) = x^2 + 3y^2\) et \(\gamma(t) = (\cos t, \sin t)\).</p>
    <ol>
      <li>Règle de la chaîne : \(\nabla f(\gamma(t)) = (2\cos t, 6\sin t)\) et \(\gamma'(t) = (-\sin t, \cos t)\), donc \((f\circ\gamma)'(t) = -2\cos t\sin t + 6\sin t\cos t\), soit \((f\circ\gamma)'(t) = 2\sin(2t)\).</li>
      <li>Contrôle direct : \(f(\gamma(t)) = 1 + 2\sin^2 t\), de dérivée \(4\sin t\cos t\).</li>
      <li>Cette dérivée s'annule en \(t = \pi/2\) : au point \((0, 1)\), le cercle est tangent à la ligne de niveau \(x^2 + 3y^2 = 3\), et \(f\) y est maximale sur le cercle.</li>
    </ol>
  </div>
  <h3>Composée avec un changement de variables</h3>
  <div class="prop-box">
    <strong>Dérivées partielles d'une composée.</strong> Soit \(\varphi, \psi\) de classe \(C^1\) sur un ouvert \(V\) de \(\mathbb{R}^2\), telles que \((\varphi(u, v), \psi(u, v))\) reste dans l'ouvert \(U\) où \(f\) est \(C^1\). Alors \(g(u, v) = f\big(\varphi(u, v), \psi(u, v)\big)\) est de classe \(C^1\) et
    <div class="formula" data-nom="Dérivées partielles d'une composée">$$\begin{aligned} \frac{\partial g}{\partial u} &= \frac{\partial f}{\partial x}\,\frac{\partial \varphi}{\partial u} + \frac{\partial f}{\partial y}\,\frac{\partial \psi}{\partial u}, \\ \frac{\partial g}{\partial v} &= \frac{\partial f}{\partial x}\,\frac{\partial \varphi}{\partial v} + \frac{\partial f}{\partial y}\,\frac{\partial \psi}{\partial v}, \end{aligned}$$</div>
    les dérivées de \(f\) étant prises en \((\varphi(u, v), \psi(u, v))\). C'est la règle de la chaîne appliquée, à \(v\) fixé, à la courbe \(u \mapsto (\varphi(u, v), \psi(u, v))\), puis de même à \(u\) fixé.
  </div>
  <div class="method-box">
    <strong>Exemple — passage en coordonnées polaires</strong>
    <p>Soit \(f\) de classe \(C^1\) sur \(\mathbb{R}^2\) et \(g(r, \theta) = f(r\cos\theta, r\sin\theta)\).</p>
    <ol>
      <li>Avec \(\varphi = r\cos\theta\), \(\psi = r\sin\theta\) :
        <div class="formula" data-nom="Dérivées en coordonnées polaires">$$\begin{aligned} \frac{\partial g}{\partial r} &= \cos\theta\,\frac{\partial f}{\partial x} + \sin\theta\,\frac{\partial f}{\partial y}, \\ \frac{\partial g}{\partial \theta} &= -r\sin\theta\,\frac{\partial f}{\partial x} + r\cos\theta\,\frac{\partial f}{\partial y}. \end{aligned}$$</div></li>
      <li>Puisque \(x = r\cos\theta\) et \(y = r\sin\theta\), la seconde relation s'écrit \(\dfrac{\partial g}{\partial \theta} = x\,\dfrac{\partial f}{\partial y} - y\,\dfrac{\partial f}{\partial x}\).</li>
      <li>Avec \(\vec u_r = (\cos\theta, \sin\theta)\) et \(\vec u_\theta = (-\sin\theta, \cos\theta)\), ces relations disent que \(\frac{\partial g}{\partial r} = \langle \nabla f, \vec u_r\rangle\) et \(\frac{1}{r}\frac{\partial g}{\partial \theta} = \langle \nabla f, \vec u_\theta\rangle\) ; d'où, pour \(r \gt 0\), le <strong>gradient en polaires</strong> utilisé en physique :
        <div class="formula" data-nom="Gradient en coordonnées polaires">$$\nabla f = \frac{\partial g}{\partial r}\,\vec u_r + \frac{1}{r}\,\frac{\partial g}{\partial \theta}\,\vec u_\theta.$$</div></li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : noter de la même lettre la fonction \(f\) des variables \((x, y)\) et la fonction \(g\) des variables \((r, \theta)\), puis confondre \(\frac{\partial f}{\partial x}\) et \(\frac{\partial g}{\partial r}\). La physique s'autorise cette notation ; en mathématiques, on garde deux noms tant que le calcul n'est pas terminé.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DÉRIVÉES PARTIELLES D'ORDRE 2</div>
  <h2>Dériver deux fois, dans le désordre</h2>
  <div class="intro">Les dérivées partielles d'une fonction sont elles-mêmes des fonctions de plusieurs variables, que l'on peut dériver à nouveau. Le théorème de Schwarz assure que l'ordre des dérivations n'importe pas pour les fonctions usuelles ; les dérivées secondes servent ensuite pour les équations aux dérivées partielles (§6) et pour la nature des points critiques (§8).</div>
  <div class="def-box">
    Soit \(f\) admettant des dérivées partielles d'ordre 1 au voisinage d'un point intérieur \(a\). Lorsqu'elle existe, la <strong>dérivée partielle d'ordre 2</strong>
    <div class="formula" data-nom="Dérivée partielle d'ordre 2">$$\frac{\partial^2 f}{\partial x_i\,\partial x_j}(a) = \frac{\partial}{\partial x_i}\Big(\frac{\partial f}{\partial x_j}\Big)(a)$$</div>
    s'obtient en dérivant d'abord par rapport à \(x_j\), puis par rapport à \(x_i\). On note \(\frac{\partial^2 f}{\partial x^2}\) pour \(i = j\). Une fonction est <strong>de classe \(C^2\)</strong> sur un ouvert \(U\) si toutes ses dérivées partielles d'ordre 2 existent et sont continues sur \(U\) (elle est alors de classe \(C^1\)).
  </div>
  <div class="prop-box">
    <strong>Théorème de Schwarz.</strong> Si \(f\) est de classe \(C^2\) sur l'ouvert \(U\), alors pour tous \(i, j\) (démonstration hors programme) :
    <div class="formula" data-nom="Théorème de Schwarz">$$\frac{\partial^2 f}{\partial x_i\,\partial x_j} = \frac{\partial^2 f}{\partial x_j\,\partial x_i}.$$</div>
    Une fonction \(C^2\) de deux variables a donc trois dérivées secondes distinctes au plus, \(\frac{\partial^2 f}{\partial x^2}\), \(\frac{\partial^2 f}{\partial x\,\partial y}\), \(\frac{\partial^2 f}{\partial y^2}\) ; une fonction de trois variables en a six.
  </div>
  <div class="method-box">
    <strong>Exemple — vérifier Schwarz sur un calcul</strong>
    <p>\(f(x, y) = x^3 y^2 + \mathrm{e}^{xy}\), de classe \(C^2\) sur \(\mathbb{R}^2\).</p>
    <ol>
      <li>\(\dfrac{\partial f}{\partial x} = 3x^2y^2 + y\,\mathrm{e}^{xy}\) et \(\dfrac{\partial f}{\partial y} = 2x^3y + x\,\mathrm{e}^{xy}\).</li>
      <li>\(\dfrac{\partial^2 f}{\partial x^2} = 6xy^2 + y^2\mathrm{e}^{xy}\) et \(\dfrac{\partial^2 f}{\partial y^2} = 2x^3 + x^2\mathrm{e}^{xy}\).</li>
      <li>Dérivées croisées : \(\dfrac{\partial}{\partial y}\Big(\dfrac{\partial f}{\partial x}\Big) = 6x^2y + (1 + xy)\,\mathrm{e}^{xy}\), et \(\dfrac{\partial}{\partial x}\Big(\dfrac{\partial f}{\partial y}\Big) = 6x^2y + (1 + xy)\,\mathrm{e}^{xy}\) : elles coïncident.</li>
    </ol>
  </div>
  <h3>Le laplacien</h3>
  <div class="def-box">
    Le <strong>laplacien</strong> d'une fonction \(f\) de classe \(C^2\) est \(\Delta f = \dfrac{\partial^2 f}{\partial x^2} + \dfrac{\partial^2 f}{\partial y^2}\) (\(+ \dfrac{\partial^2 f}{\partial z^2}\) en dimension 3). Une fonction de laplacien nul est dite <strong>harmonique</strong>.
  </div>
  <p>Le potentiel électrostatique dans une région vide de charges, la température en régime stationnaire, le potentiel des vitesses d'un écoulement parfait sont des fonctions harmoniques. Exemples : \((x, y) \mapsto \ln(x^2 + y^2)\) sur \(\mathbb{R}^2 \setminus \{0\}\) (potentiel d'un fil chargé), \((x, y, z) \mapsto \frac{1}{r}\) sur \(\mathbb{R}^3 \setminus \{0\}\) (potentiel d'une charge ponctuelle). Pour la première : \(\frac{\partial}{\partial x}\ln(x^2 + y^2) = \frac{2x}{x^2 + y^2}\), puis \(\frac{\partial^2}{\partial x^2} = \frac{2(y^2 - x^2)}{(x^2 + y^2)^2}\), et la dérivée seconde en \(y\) est l'opposée.</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le théorème de Schwarz sans vérifier la classe \(C^2\). Pour \(f(x, y) = \dfrac{x^3 y}{x^2 + y^2}\), prolongée par \(f(0, 0) = 0\), on calcule \(\frac{\partial f}{\partial x}(0, y) = 0\) pour tout \(y\) et \(\frac{\partial f}{\partial y}(x, 0) = x\) pour tout \(x\). Donc \(\frac{\partial}{\partial y}\big(\frac{\partial f}{\partial x}\big)(0, 0) = 0\) tandis que \(\frac{\partial}{\partial x}\big(\frac{\partial f}{\partial y}\big)(0, 0) = 1\) : les dérivées secondes de \(f\) ne sont pas continues en l'origine.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · ÉQUATIONS AUX DÉRIVÉES PARTIELLES</div>
  <h2>Quand l'inconnue est une fonction de plusieurs variables</h2>
  <div class="intro">Les lois de la physique s'écrivent souvent comme des relations entre dérivées partielles d'une grandeur : équation de d'Alembert pour les ondes, équation de la chaleur, équation de Laplace. Le programme demande de savoir résoudre des exemples simples, en général par un <strong>changement de variables</strong> qui ramène l'équation à des intégrations successives.</div>
  <div class="prop-box">
    <strong>Les trois équations de base</strong> (sur \(\mathbb{R}^2\), ou sur un rectangle ouvert).
    <ul>
      <li>\(\dfrac{\partial f}{\partial x} = 0 \iff f(x, y) = \varphi(y)\), avec \(\varphi\) de classe \(C^1\) : à \(y\) fixé, \(x \mapsto f(x, y)\) est de dérivée nulle sur un intervalle, donc constante.</li>
      <li>\(\dfrac{\partial f}{\partial x} = h(x, y)\) avec \(h\) continue \(\iff f(x, y) = H(x, y) + \varphi(y)\), où \(H\) est une primitive de \(h\) par rapport à \(x\), à \(y\) fixé.</li>
      <li>\(\dfrac{\partial^2 f}{\partial x\,\partial y} = 0 \iff f(x, y) = \varphi(x) + \psi(y)\) (\(f\) de classe \(C^2\) ; appliquer deux fois le premier point).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Méthode — résoudre par un changement de variables</strong>
    <ol>
      <li>Choisir de nouvelles variables \((u, v)\), en général fournies par l'énoncé (souvent linéaires en \(x, y\), ou polaires), et vérifier que le changement est une bijection de l'ouvert de départ sur un ouvert, de réciproque \(C^1\) (ou \(C^2\)).</li>
      <li>Poser \(f(x, y) = g(u, v)\) et exprimer les dérivées partielles de \(f\) avec celles de \(g\) par la règle de la chaîne (§4).</li>
      <li>Reporter dans l'équation : on obtient une équation simple en \(g\), que l'on intègre.</li>
      <li>Revenir aux variables \((x, y)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une équation de transport</strong>
    <p>Trouver les \(f\) de classe \(C^1\) sur \(\mathbb{R}^2\) telles que \(\dfrac{\partial f}{\partial x} - 2\dfrac{\partial f}{\partial y} = 0\).</p>
    <ol>
      <li>On pose \(u = x\), \(v = 2x + y\) : bijection linéaire de \(\mathbb{R}^2\) (réciproque \(x = u\), \(y = v - 2u\)), et \(f(x, y) = g(u, v)\).</li>
      <li>\(\dfrac{\partial f}{\partial x} = \dfrac{\partial g}{\partial u} + 2\dfrac{\partial g}{\partial v}\) et \(\dfrac{\partial f}{\partial y} = \dfrac{\partial g}{\partial v}\) : l'équation devient \(\dfrac{\partial g}{\partial u} = 0\).</li>
      <li>Donc \(g(u, v) = \varphi(v)\), soit \(f(x, y) = \varphi(2x + y)\) avec \(\varphi\) de classe \(C^1\) sur \(\mathbb{R}\). La fonction \(f\) est constante sur chaque droite \(2x + y = \text{cte}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — l'équation des ondes (d'Alembert)</strong>
    <p>Trouver les \(f\) de classe \(C^2\) sur \(\mathbb{R}^2\) telles que \(\dfrac{\partial^2 f}{\partial t^2} = c^2\,\dfrac{\partial^2 f}{\partial x^2}\) (\(c \gt 0\)), à l'aide de \(u = x + ct\), \(v = x - ct\).</p>
    <ol>
      <li>Le changement \((x, t) \mapsto (u, v)\) est une bijection linéaire de \(\mathbb{R}^2\) ; on pose \(f(x, t) = g(u, v)\), avec \(g\) de classe \(C^2\).</li>
      <li>\(\dfrac{\partial f}{\partial x} = g_u + g_v\) et \(\dfrac{\partial f}{\partial t} = c\,g_u - c\,g_v\) (en notant \(g_u = \frac{\partial g}{\partial u}\)). En dérivant à nouveau et avec Schwarz :
        <div class="formula">$$\begin{aligned} \frac{\partial^2 f}{\partial x^2} &= g_{uu} + 2g_{uv} + g_{vv}, \\ \frac{\partial^2 f}{\partial t^2} &= c^2\big(g_{uu} - 2g_{uv} + g_{vv}\big). \end{aligned}$$</div></li>
      <li>L'équation devient \(-4c^2\,g_{uv} = 0\), soit \(\dfrac{\partial^2 g}{\partial u\,\partial v} = 0\), d'où \(g(u, v) = F(u) + G(v)\) avec \(F\), \(G\) de classe \(C^2\).</li>
      <li>Conclusion :
        <div class="formula" data-nom="Solution de l'équation des ondes">$$f(x, t) = F(x + ct) + G(x - ct).$$</div>
        Toute solution est la superposition de deux ondes qui se propagent sans déformation à la vitesse \(c\), l'une vers les \(x\) décroissants, l'autre vers les \(x\) croissants.</li>
    </ol>
  </div>
  <h3>Le laplacien en coordonnées polaires</h3>
  <div class="prop-box">
    <strong>Formule.</strong> Si \(f\) est de classe \(C^2\) et \(g(r, \theta) = f(r\cos\theta, r\sin\theta)\), alors pour \(r \gt 0\) :
    <div class="formula" data-nom="Laplacien en polaires">$$\Delta f = \frac{\partial^2 g}{\partial r^2} + \frac{1}{r}\,\frac{\partial g}{\partial r} + \frac{1}{r^2}\,\frac{\partial^2 g}{\partial \theta^2}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dériver une seconde fois les formules du §4.</span>
    <div class="content">
      <p>On note \(c = \cos\theta\), \(s = \sin\theta\), et les dérivées de \(f\) sont prises en \((rc, rs)\). En dérivant \(\frac{\partial g}{\partial r} = c\,f_x + s\,f_y\) par rapport à \(r\) (règle de la chaîne, Schwarz) :</p>
      <div class="formula">$$\frac{\partial^2 g}{\partial r^2} = c^2 f_{xx} + 2cs\,f_{xy} + s^2 f_{yy}.$$</div>
      <p>En dérivant \(\frac{\partial g}{\partial \theta} = -rs\,f_x + rc\,f_y\) par rapport à \(\theta\) :</p>
      <div class="formula">$$\begin{aligned} \frac{\partial^2 g}{\partial \theta^2} = &-r\big(c f_x + s f_y\big) \\ &+ r^2\big(s^2 f_{xx} - 2cs\,f_{xy} + c^2 f_{yy}\big). \end{aligned}$$</div>
      <p>En divisant la seconde par \(r^2\), en remarquant que \(c f_x + s f_y = \frac{\partial g}{\partial r}\) et en ajoutant la première, les termes croisés disparaissent et \(c^2 + s^2 = 1\) donne</p>
      <div class="formula">$$\frac{\partial^2 g}{\partial r^2} + \frac{1}{r^2}\frac{\partial^2 g}{\partial \theta^2} = f_{xx} + f_{yy} - \frac{1}{r}\frac{\partial g}{\partial r}.$$</div>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — fonctions harmoniques radiales</strong>
    <p>Chercher les fonctions harmoniques sur \(\mathbb{R}^2 \setminus \{0\}\) qui ne dépendent que de \(r = \sqrt{x^2 + y^2}\) : \(f(x, y) = g(r)\).</p>
    <ol>
      <li>Le laplacien en polaires se réduit à \(g'' + \frac{1}{r}g' = 0\), équation différentielle d'ordre 1 en \(g'\) : \((r\,g')' = r\,g'' + g' = 0\).</li>
      <li>Donc \(r\,g'(r) = A\), puis \(g(r) = A\ln r + B\). Les solutions sont les \(f(x, y) = \frac{A}{2}\ln(x^2 + y^2) + B\).</li>
      <li>C'est le profil de potentiel autour d'un fil chargé, ou de température dans la paroi d'un tuyau (chapitre « Équations différentielles linéaires d'ordre 2 », §2).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure de \(\frac{\partial f}{\partial x} = 0\) que \(f\) ne dépend que de \(y\) sur un ouvert quelconque. L'argument demande que chaque droite horizontale coupe l'ouvert selon un <strong>intervalle</strong>. Sur \(U = \mathbb{R}^2\) privé de la demi-droite \(\{0\} \times \,]-\infty, 0]\), la fonction égale à \(y^2\) quand \(x \gt 0\) et \(y \lt 0\), et à 0 ailleurs, est \(C^1\) sur \(U\) avec \(\frac{\partial f}{\partial x} = 0\), mais \(f(1, -1) = 1 \neq f(-1, -1) = 0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · EXTREMUMS ET POINTS CRITIQUES</div>
  <h2>Où chercher les maximums et les minimums</h2>
  <div class="intro">Trouver la meilleure forme, le coût minimal, l'énergie potentielle minimale (position d'équilibre stable) : ce sont des problèmes d'extremums. Comme en une variable, la dérivée s'annule en un extremum intérieur ; ici, c'est le gradient tout entier. Dans ce paragraphe et les deux suivants, \(f\) est une fonction de deux variables.</div>
  <div class="def-box">
    Soit \(f : D \to \mathbb{R}\) et \(a \in D\). On dit que \(f\) admet en \(a\) :
    <ul>
      <li>un <strong>maximum global</strong> si \(f(x) \leq f(a)\) pour tout \(x \in D\) ;</li>
      <li>un <strong>maximum local</strong> s'il existe \(r \gt 0\) tel que \(f(x) \leq f(a)\) pour tout \(x \in D \cap B(a, r)\) ;</li>
      <li>de même un minimum global ou local ; un <strong>extremum</strong> est un maximum ou un minimum, <strong>strict</strong> si l'inégalité est stricte pour \(x \neq a\).</li>
    </ul>
    Si \(f\) est de classe \(C^1\) sur un ouvert \(U\), un point \(a \in U\) tel que \(\nabla f(a) = 0\) est un <strong>point critique</strong> de \(f\).
  </div>
  <div class="prop-box">
    <strong>Condition nécessaire du premier ordre.</strong> Si \(f\) est de classe \(C^1\) sur un <strong>ouvert</strong> \(U\) de \(\mathbb{R}^2\) et admet un extremum local en \(a \in U\), alors \(a\) est un point critique :
    <div class="formula" data-nom="Condition nécessaire d'extremum">$$\frac{\partial f}{\partial x}(a) = \frac{\partial f}{\partial y}(a) = 0.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">On se ramène à une variable.</span>
    <div class="content"><p>Comme \(U\) est ouvert, la fonction partielle \(\varphi : x \mapsto f(x, a_2)\) est définie sur un intervalle ouvert contenant \(a_1\), et elle admet un extremum local en \(a_1\). D'après le résultat de première année, \(\varphi'(a_1) = \frac{\partial f}{\partial x}(a) = 0\). De même avec \(y \mapsto f(a_1, y)\).</p></div>
  </div>
  <p>La réciproque est fausse : en \((0, 0)\), \(f(x, y) = x^2 - y^2\) a un gradient nul, mais prend des valeurs positives sur l'axe des abscisses et négatives sur l'axe des ordonnées. Un point critique en lequel \(f - f(a)\) prend les deux signes au voisinage de \(a\) s'appelle un <strong>point col</strong> (ou point selle). L'hypothèse « ouvert » est également indispensable : sur le disque fermé \(\{x^2 + y^2 \leq 1\}\), la fonction \((x, y) \mapsto x\) atteint son maximum en \((1, 0)\), où son gradient vaut \((1, 0)\).</p>
  <div class="method-box">
    <strong>Exemple — points critiques et étude directe</strong>
    <p>\(f(x, y) = x^2y - 2xy + y^2\) sur \(\mathbb{R}^2\).</p>
    <ol>
      <li>\(\dfrac{\partial f}{\partial x} = 2y(x - 1)\) et \(\dfrac{\partial f}{\partial y} = x^2 - 2x + 2y\). Si \(y = 0\), la seconde équation donne \(x = 0\) ou \(x = 2\) ; si \(x = 1\), elle donne \(y = \frac12\). Trois points critiques : \((0, 0)\), \((2, 0)\), \((1, \frac12)\).</li>
      <li>En \((1, \frac12)\) : en posant \(x = 1 + h\), \(y = \frac12 + k\), un développement donne
        <div class="formula">$$f(1 + h, \tfrac12 + k) = -\tfrac14 + k^2 + \big(\tfrac12 + k\big)h^2,$$</div>
        qui est \(\geq -\frac14\) dès que \(|k| \lt \frac12\) : <strong>minimum local</strong> strict, de valeur \(-\frac14\).</li>
      <li>En \((0, 0)\), où \(f\) vaut 0 : \(f(0, y) = y^2 \gt 0\) pour \(y \neq 0\), mais \(f(t, \frac{t}{2}) = \frac{t^3}{2} - \frac{3t^2}{4} \lt 0\) pour \(t\) petit non nul : c'est un <strong>col</strong>. Même conclusion en \((2, 0)\) par symétrie (\(f\) est invariante par \(x \mapsto 2 - x\)).</li>
      <li>Le minimum n'est pas global : \(f(10, -40) = -1600\). La fonction n'a aucun extremum global.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§8 · NATURE D'UN POINT CRITIQUE : LA HESSIENNE</div>
  <h2>Les dérivées secondes décident</h2>
  <div class="intro">En une variable, en un point où \(f'\) s'annule, le signe de \(f''\) dit si l'on a un minimum ou un maximum. En deux variables, les dérivées secondes forment une matrice symétrique, la hessienne ; son déterminant et sa trace permettent, dans la plupart des cas, de conclure sans étude directe.</div>
  <div class="def-box">
    Soit \(f\) de classe \(C^2\) sur un ouvert \(U\) de \(\mathbb{R}^p\) et \(a \in U\). La <strong>matrice hessienne</strong> de \(f\) en \(a\) est la matrice \(H_f(a)\) de terme général \(\frac{\partial^2 f}{\partial x_i\,\partial x_j}(a)\) ; elle est <strong>symétrique</strong> d'après le théorème de Schwarz. En deux variables, avec les notations de Monge :
    <div class="formula" data-nom="Matrice hessienne">$$H_f(a) = \begin{pmatrix} r & s \\ s & t \end{pmatrix}$$</div>
    <div class="formula">$$\begin{aligned} &r = \frac{\partial^2 f}{\partial x^2}(a),\quad s = \frac{\partial^2 f}{\partial x\,\partial y}(a), \\ &t = \frac{\partial^2 f}{\partial y^2}(a). \end{aligned}$$</div>
  </div>
  <div class="prop-box">
    <strong>Formule de Taylor-Young à l'ordre 2.</strong> Si \(f\) est de classe \(C^2\) sur l'ouvert \(U \subset \mathbb{R}^2\) et \(a \in U\), alors, quand \(h = (h_1, h_2) \to 0\) (démonstration hors programme) :
    <div class="formula" data-nom="Taylor-Young à l'ordre 2">$$\begin{aligned} f(a + h) = f(a) &+ \langle \nabla f(a), h\rangle \\ &+ \frac12\,h^\top H_f(a)\,h + o(\|h\|^2), \end{aligned}$$</div>
    avec \(h^\top H_f(a)\,h = r\,h_1^2 + 2s\,h_1h_2 + t\,h_2^2\).
  </div>
  <p>En un point critique, le terme du premier ordre disparaît : le signe de \(f(a + h) - f(a)\) est gouverné par la forme quadratique \(q(h) = h^\top H_f(a)\,h\), du moins quand elle ne s'annule pas pour \(h \neq 0\).</p>
  <div class="prop-box">
    <strong>Nature d'un point critique.</strong> Soit \(f\) de classe \(C^2\) sur un ouvert de \(\mathbb{R}^2\) et \(a\) un point critique de \(f\), de hessienne \(H = H_f(a)\).
    <ul>
      <li>Si \(\det H \gt 0\) et \(\operatorname{tr} H \gt 0\) : \(f\) admet en \(a\) un <strong>minimum local strict</strong>.</li>
      <li>Si \(\det H \gt 0\) et \(\operatorname{tr} H \lt 0\) : \(f\) admet en \(a\) un <strong>maximum local strict</strong>.</li>
      <li>Si \(\det H \lt 0\) : \(a\) est un <strong>point col</strong>, \(f\) n'a pas d'extremum en \(a\).</li>
      <li>Si \(\det H = 0\) : on ne peut pas conclure avec la hessienne (<strong>cas douteux</strong>).</li>
    </ul>
    Avec les notations de Monge, \(\det H = rt - s^2\) et \(\operatorname{tr} H = r + t\) ; lorsque \(rt - s^2 \gt 0\), \(r\) et \(t\) ont le signe de la trace.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Diagonaliser la hessienne dans une base orthonormée.</span>
    <div class="content">
      <p>\(H\) est symétrique réelle : d'après le théorème spectral (chapitre « Réduction des coniques et matrices symétriques »), il existe une base orthonormée \((e_1, e_2)\) de vecteurs propres, de valeurs propres \(\lambda_1\), \(\lambda_2\), avec \(\det H = \lambda_1\lambda_2\) et \(\operatorname{tr} H = \lambda_1 + \lambda_2\). Pour \(h = u\,e_1 + v\,e_2\), on a \(\|h\|^2 = u^2 + v^2\) et \(h^\top H h = \lambda_1 u^2 + \lambda_2 v^2\).</p>
      <p>Si \(\det H \gt 0\) et \(\operatorname{tr} H \gt 0\), les deux valeurs propres sont strictement positives ; avec \(m = \min(\lambda_1, \lambda_2)\), \(h^\top H h \geq m\|h\|^2\), donc \(f(a + h) - f(a) \geq \|h\|^2\big(\frac{m}{2} + \varepsilon(h)\big)\) avec \(\varepsilon(h) \to 0\) : c'est strictement positif pour \(h \neq 0\) assez petit. Le cas du maximum s'en déduit avec \(-f\).</p>
      <p>Si \(\det H \lt 0\), les valeurs propres sont de signes contraires, par exemple \(\lambda_1 \gt 0 \gt \lambda_2\). Alors \(f(a + \tau e_1) - f(a) = \frac{\lambda_1}{2}\tau^2 + o(\tau^2)\) est \(\gt 0\) et \(f(a + \tau e_2) - f(a) = \frac{\lambda_2}{2}\tau^2 + o(\tau^2)\) est \(\lt 0\) pour \(\tau\) petit non nul : \(a\) est un col.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — retrouver les natures du §7</strong>
    <p>\(f(x, y) = x^2y - 2xy + y^2\) : \(r = 2y\), \(s = 2x - 2\), \(t = 2\).</p>
    <ol>
      <li>En \((0, 0)\) : \(H = \begin{pmatrix} 0 & -2 \\ -2 & 2 \end{pmatrix}\), \(\det H = -4 \lt 0\) : col. En \((2, 0)\) : \(H = \begin{pmatrix} 0 & 2 \\ 2 & 2 \end{pmatrix}\), \(\det H = -4\) : col.</li>
      <li>En \((1, \frac12)\) : \(H = \begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix}\), \(\det H = 2 \gt 0\), \(\operatorname{tr} H = 3 \gt 0\) : minimum local strict. On retrouve, sans calcul de développement, les conclusions du §7.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — maximums, minimums et col réunis</strong>
    <p>\(f(x, y) = xy\,\mathrm{e}^{-(x^2 + y^2)/2}\) sur \(\mathbb{R}^2\).</p>
    <ol>
      <li>\(\dfrac{\partial f}{\partial x} = y(1 - x^2)\,\mathrm{e}^{-(x^2+y^2)/2}\) et \(\dfrac{\partial f}{\partial y} = x(1 - y^2)\,\mathrm{e}^{-(x^2+y^2)/2}\). Points critiques : \((0, 0)\), et les quatre points \((\pm1, \pm1)\).</li>
      <li>Dérivées secondes : \(r = xy(x^2 - 3)\,E\), \(s = (1 - x^2)(1 - y^2)\,E\), \(t = xy(y^2 - 3)\,E\), avec \(E = \mathrm{e}^{-(x^2+y^2)/2}\).</li>
      <li>En \((0, 0)\) : \(r = t = 0\), \(s = 1\), \(\det H = -1\) : col.</li>
      <li>En \((1, 1)\) et \((-1, -1)\) : \(r = t = -2/\mathrm{e}\), \(s = 0\) : \(\det H \gt 0\), \(\operatorname{tr} H \lt 0\), maximum local, de valeur \(1/\mathrm{e}\). En \((1, -1)\) et \((-1, 1)\) : \(r = t = 2/\mathrm{e}\), minimum local, de valeur \(-1/\mathrm{e}\).</li>
      <li>Ces extremums sont globaux : avec \(\rho = \frac{x^2 + y^2}{2}\), on a \(|xy| \leq \rho\), donc \(|f| \leq \rho\,\mathrm{e}^{-\rho} \leq \frac{1}{\mathrm{e}}\) (étude de \(\rho \mapsto \rho\,\mathrm{e}^{-\rho}\)).</li>
    </ol>
  </div>

  <p><strong>Cas douteux.</strong> En \((0, 0)\), \(f_1(x, y) = x^4 + y^2\) et \(f_2(x, y) = y^2 - x^3\) ont la même hessienne \(\begin{pmatrix} 0 & 0 \\ 0 & 2 \end{pmatrix}\), de déterminant nul. Pourtant \(f_1 \geq 0 = f_1(0, 0)\) : minimum global ; et \(f_2(x, 0) = -x^3\) change de signe avec \(x\) : pas d'extremum. Seule une étude directe du signe de \(f(a + h) - f(a)\) permet de trancher.</p>

<div class="course-section">
  <div class="sec-num">§9 · EXTREMUMS SUR UNE PARTIE FERMÉE BORNÉE</div>
  <h2>Chercher à l'intérieur, puis sur le bord</h2>
  <div class="intro">Sur une partie fermée bornée \(K\), une fonction continue atteint son maximum et son minimum (§2) : la question est de les trouver. Le gradient ne s'annule qu'en un extremum intérieur ; sur le bord, il faut une étude spécifique, en paramétrant le bord.</div>
  <div class="method-box">
    <strong>Méthode — extremums globaux sur un fermé borné</strong>
    <ol>
      <li><strong>Existence</strong> : justifier que \(K\) est fermé et borné (souvent par la propriété du §2) et que \(f\) est continue : le maximum et le minimum existent.</li>
      <li><strong>Intérieur</strong> : sur l'ouvert formé des points intérieurs à \(K\), un extremum est un point critique (§7). Chercher les points critiques <strong>situés à l'intérieur</strong> de \(K\).</li>
      <li><strong>Bord</strong> : le paramétrer (segments, cercle \((\cos\theta, \sin\theta)\), arcs…) et étudier les fonctions d'une variable obtenues, sans oublier les extrémités et les coins.</li>
      <li><strong>Comparer</strong> les valeurs de \(f\) en tous les candidats : la plus grande est le maximum, la plus petite le minimum.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — sur le disque unité</strong>
    <p>Extremums de \(f(x, y) = x^2 + 2y^2 - x\) sur \(D = \{(x, y),\ x^2 + y^2 \leq 1\}\).</p>
    <ol>
      <li>\(D = \{1 - x^2 - y^2 \geq 0\}\) est fermé (§2) et borné, \(f\) est continue : \(f\) admet un maximum et un minimum sur \(D\).</li>
      <li>Intérieur : \(\nabla f = (2x - 1, 4y) = 0\) en \((\frac12, 0)\), qui est bien dans le disque ouvert ; \(f(\frac12, 0) = -\frac14\).</li>
      <li>Bord : pour \((\cos\theta, \sin\theta)\), \(f = \cos^2\theta + 2\sin^2\theta - \cos\theta = 2 - c - c^2\) avec \(c = \cos\theta \in [-1, 1]\). La fonction \(\phi(c) = 2 - c - c^2\) a pour dérivée \(-1 - 2c\) : elle est maximale en \(c = -\frac12\), où \(\phi = \frac94\), et \(\phi(1) = 0\), \(\phi(-1) = 2\).</li>
      <li>Comparaison des valeurs \(-\frac14\), \(\frac94\), \(0\), \(2\) : le <strong>minimum</strong> vaut \(-\frac14\), atteint en \((\frac12, 0)\) ; le <strong>maximum</strong> vaut \(\frac94\), atteint sur le bord en \((-\frac12, \pm\frac{\sqrt3}{2})\).</li>
    </ol>
  </div>

    <span class="label">Application</span>
    <span class="prompt">Extremums de \(f(x, y) = x^2 - xy + y^2\) sur le carré \([-1, 1]^2\).</span>
    <div class="content">
      <p>Le carré est fermé borné et \(f\) est continue. Intérieur : \(\nabla f = (2x - y, 2y - x) = 0\) seulement en \((0, 0)\), où \(f = 0\). Bord : sur le côté \(x = 1\), \(f = 1 - y + y^2\) pour \(y \in [-1, 1]\), de minimum \(\frac34\) en \(y = \frac12\) et de maximum 3 en \(y = -1\) ; sur \(x = -1\), \(f = 1 + y + y^2\), de maximum 3 en \(y = 1\) ; les côtés \(y = \pm1\) se traitent de même (\(f\) est symétrique en \(x\) et \(y\)). Conclusion : minimum 0 en \((0, 0)\), maximum 3 en \((1, -1)\) et \((-1, 1)\). Comme \(f(x, y) = (x - \frac{y}{2})^2 + \frac34y^2\), le minimum se voyait aussi directement.</p>
    </div>

<div class="course-section">
  <div class="sec-num">§10 · FONCTIONS DE ℝᵖ DANS ℝⁿ</div>
  <h2>Plusieurs variables, plusieurs coordonnées</h2>
  <div class="intro">Un champ électrique associe un vecteur à chaque point de l'espace ; un changement de coordonnées associe un point à un couple ou un triplet de nombres ; une nappe paramétrée associe un point de l'espace à deux paramètres. Ce sont des fonctions de \(\mathbb{R}^p\) dans \(\mathbb{R}^n\) (\(p, n \leq 3\)), que l'on étudie coordonnée par coordonnée.</div>
  <div class="def-box">
    Soit \(F : D \subset \mathbb{R}^p \to \mathbb{R}^n\), de <strong>fonctions coordonnées</strong> \(F_1, \ldots, F_n\) : \(F(x) = \big(F_1(x), \ldots, F_n(x)\big)\). Les définitions de limite et de continuité sont celles du §2, avec \(\|F(x) - \ell\|\) à la place de \(|f(x) - \ell|\).
  </div>
  <div class="prop-box">
    <strong>Tout se lit sur les coordonnées.</strong>
    <ul>
      <li>\(F\) tend vers \(\ell = (\ell_1, \ldots, \ell_n)\) en \(a\) si et seulement si chaque \(F_i\) tend vers \(\ell_i\) ; \(F\) est continue si et seulement si chaque \(F_i\) l'est (conséquence de \(|y_i| \leq \|y\| \leq |y_1| + \cdots + |y_n|\)).</li>
      <li>Les dérivées partielles se calculent coordonnée par coordonnée, de même à l'ordre 2 :
        <div class="formula" data-nom="Dérivée partielle d'une fonction vectorielle">$$\frac{\partial F}{\partial x_j}(a) = \Big(\frac{\partial F_1}{\partial x_j}(a), \ldots, \frac{\partial F_n}{\partial x_j}(a)\Big).$$</div></li>
      <li>\(F\) est de classe \(C^1\) (resp. \(C^2\)) sur un ouvert si et seulement si chaque \(F_i\) l'est.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — les coordonnées polaires et sphériques</strong>
    <ol>
      <li>\(\Phi(r, \theta) = (r\cos\theta, r\sin\theta)\) : \(\dfrac{\partial \Phi}{\partial r} = (\cos\theta, \sin\theta) = \vec u_r\) et \(\dfrac{\partial \Phi}{\partial \theta} = (-r\sin\theta, r\cos\theta) = r\,\vec u_\theta\). Ce sont les vecteurs tangents aux lignes de coordonnées : la demi-droite \(\theta = \text{cte}\) et le cercle \(r = \text{cte}\).</li>
      <li>Coordonnées sphériques :
        <div class="formula">$$\begin{aligned} \Psi(r, \theta, \varphi) = (&r\sin\theta\cos\varphi, \\ &r\sin\theta\sin\varphi,\ r\cos\theta). \end{aligned}$$</div>
        Les trois dérivées partielles sont deux à deux orthogonales, de normes \(1\), \(r\) et \(r\sin\theta\). D'où l'élément de volume \(r^2\sin\theta\,\mathrm{d}r\,\mathrm{d}\theta\,\mathrm{d}\varphi\) utilisé en physique.</li>
      <li>\(F(x, y) = (x^2 - y^2, 2xy)\), qui correspond à \(z \mapsto z^2\) dans \(\mathbb{C}\) : \(\dfrac{\partial F}{\partial x} = (2x, 2y)\) et \(\dfrac{\partial F}{\partial y} = (-2y, 2x)\) sont orthogonaux et de même norme : cette transformation conserve les angles hors de l'origine.</li>
    </ol>
  </div>
  <p>Les nappes paramétrées \((u, v) \mapsto M(u, v)\), leurs vecteurs \(\frac{\partial M}{\partial u}\), \(\frac{\partial M}{\partial v}\) et le plan tangent qu'ils engendrent sont étudiés dans le chapitre « Courbes et surfaces de l'espace ».</p>
  <div class="notice"><strong>Erreur classique</strong> : confondre les rôles de \(p\) et \(n\). Une fonction de \(\mathbb{R}^p\) dans \(\mathbb{R}^n\) a \(p\) dérivées partielles (une par variable), chacune étant un vecteur de \(\mathbb{R}^n\) (une coordonnée par fonction coordonnée).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Différentielle, jacobienne, extremums liés</h2>
  <div class="intro">Les notions suivantes ne sont pas exigibles. Elles éclairent les notations de la physique et de la mécanique, et prolongent naturellement le chapitre.</div>
  <h3>Différentielle</h3>
  <p>L'application linéaire \(h \mapsto \langle \nabla f(a), h\rangle\) qui apparaît dans la formule de Taylor-Young s'appelle la <strong>différentielle</strong> de \(f\) en \(a\), notée \(\mathrm{d}f_a\). La physique l'écrit \(\mathrm{d}f = \frac{\partial f}{\partial x}\mathrm{d}x + \frac{\partial f}{\partial y}\mathrm{d}y + \frac{\partial f}{\partial z}\mathrm{d}z\), où \(\mathrm{d}x, \mathrm{d}y, \mathrm{d}z\) désignent les coordonnées du petit déplacement \(h\) : c'est exactement la formule de Taylor-Young sans le reste.</p>
  <h3>Matrice jacobienne</h3>
  <p>Pour \(F : \mathbb{R}^p \to \mathbb{R}^n\), la matrice \(J_F(a)\) de terme général \(\frac{\partial F_i}{\partial x_j}(a)\) a pour colonnes les dérivées partielles de \(F\). La règle de la chaîne s'écrit \(J_{F \circ G}(a) = J_F(G(a))\,J_G(a)\) ; les formules du §4 en sont un cas particulier. Pour les coordonnées polaires, \(\det J_\Phi = r\), d'où l'élément d'aire \(r\,\mathrm{d}r\,\mathrm{d}\theta\).</p>
  <h3>Extremums liés</h3>
  <p>Chercher les extremums de \(f\) sous une contrainte \(g(x, y) = 0\) : en un extremum où \(\nabla g \neq 0\), les gradients sont colinéaires, \(\nabla f(a) = \lambda\,\nabla g(a)\) (<strong>multiplicateur de Lagrange</strong> \(\lambda\)). Géométriquement, la ligne de niveau de \(f\) est tangente à la courbe de contrainte, comme sur la figure du §9 : au point \((-\frac12, \frac{\sqrt3}{2})\), \(\nabla f = (-2, 2\sqrt3)\) et, pour \(g = x^2 + y^2 - 1\), \(\nabla g = (-1, \sqrt3)\), soit \(\lambda = 2\).</p>
  <h3>Trois variables</h3>
  <p>Pour une fonction de trois variables, en un point critique : si les trois valeurs propres de la hessienne sont strictement positives, minimum local ; toutes strictement négatives, maximum local ; une strictement positive et une strictement négative, pas d'extremum. Le déterminant et la trace ne suffisent plus à conclure.</p>
</div>
  <div class="video-resources">
    <span class="vr-label">▶ Ressources vidéo</span>

    <span class="vr-src">Animations externes hébergées par matimatheque.fr.</span>
  </div>
