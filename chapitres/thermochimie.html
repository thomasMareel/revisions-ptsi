<template class="pan-tpl" data-panneau="thc-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · THERMOCHIMIE</div>
  <h2>Stratégies pour les exercices de thermochimie</h2>

  <div class="method-box">
    <strong>Méthode 1 — Calculer les grandeurs standard d'une réaction</strong>
    <ol>
      <li><span class="step">Équation.</span> Écrire l'équation équilibrée avec les états physiques ; repérer les corps simples dans leur ESR (\(\Delta_fH^\circ = \Delta_fG^\circ = 0\)).</li>
      <li><span class="step">Enthalpie.</span> Loi de Hess : \(\Delta_rH^\circ = \sum_i \nu_i\,\Delta_fH^\circ_i\), en kJ·mol⁻¹. Signe : exo- ou endothermique.</li>
      <li><span class="step">Entropie.</span> Prévoir son signe avec \(\Delta\nu_{\text{gaz}}\), puis calculer \(\Delta_rS^\circ = \sum_i \nu_i\,S^\circ_{m,i}\) <em>sans oublier les corps simples</em>, en J·K⁻¹·mol⁻¹. Comparer au signe prévu.</li>
      <li><span class="step">Enthalpie libre.</span> \(\Delta_rG^\circ(T) = \Delta_rH^\circ - T\,\Delta_rS^\circ\) (Ellingham), après conversion en J·mol⁻¹ ; ou \(\sum_i \nu_i\,\Delta_fG^\circ_i\) à 298 K.</li>
      <li><span class="step">Exploiter.</span> \(K^\circ = \exp(-\Delta_rG^\circ/RT)\) ; température d'inversion \(T_i = \Delta_rH^\circ/\Delta_rS^\circ\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Prévoir le sens d'évolution</strong>
    <ol>
      <li><span class="step">Quotient.</span> Écrire \(Q_r = \prod a_i^{\,\nu_i}\) avec les bonnes activités (gaz : \(P_i/P^\circ\) ; soluté : \(c_i/c^\circ\) ; solide, liquide pur et solvant : 1).</li>
      <li><span class="step">Constante.</span> Calculer \(K^\circ(T)\) à la température de l'expérience (pas forcément 298 K).</li>
      <li><span class="step">Comparer.</span> \(Q_r \lt K^\circ\) : sens direct ; \(Q_r \gt K^\circ\) : sens indirect. Ou, ce qui revient au même, signe de \(\Delta_rG = RT\ln(Q_r/K^\circ)\).</li>
      <li><span class="step">Justifier.</span> C'est le signe de \(\Delta_rG\), jamais celui de \(\Delta_rG^\circ\), qui conclut.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Déterminer l'état final : équilibre ou transformation totale</strong>
    <ol>
      <li><span class="step">Tableau.</span> Dresser le tableau d'avancement ; calculer \(\xi_{\max}\) (et \(\xi_{\min}\) si le sens est inconnu).</li>
      <li><span class="step">Sens.</span> Comparer \(Q_{r,0}\) à \(K^\circ\).</li>
      <li><span class="step">Hypothèse.</span> Supposer l'équilibre atteint et résoudre \(Q_r(\xi_{\text{éq}}) = K^\circ\).</li>
      <li><span class="step">Vérification.</span> Si \(\xi_{\text{éq}} \leq \xi_{\max}\), l'hypothèse est validée. Sinon, la transformation est totale (\(\xi_F = \xi_{\max}\)) : vérifier \(Q_r(\xi_{\max}) \lt K^\circ\). Rupture d'équilibre si l'espèce épuisée est une phase condensée pure.</li>
      <li><span class="step">Raccourci.</span> Si \(K^\circ\) est très grande, supposer la réaction quasi totale, puis calculer la petite quantité restante du réactif limitant avec \(K^\circ\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Température finale en réacteur adiabatique</strong>
    <ol>
      <li><span class="step">Avancement.</span> Tableau d'avancement : \(\xi_F\) (souvent \(\xi_{\max}\) pour une combustion).</li>
      <li><span class="step">Inventaire.</span> Lister <em>tout</em> l'état final : produits, réactifs en excès, espèces spectatrices (N₂ de l'air, solvant, calorimètre).</li>
      <li><span class="step">Chemin fictif.</span> Réaction à \(T_I\), puis échauffement : \(\xi_F\,\Delta_rH^\circ(T_I) + \left(\sum_j n_jC^\circ_{p,m,j}\right)(T_F - T_I) = 0\).</li>
      <li><span class="step">Changement d'état.</span> S'il en survient un pendant l'échauffement, couper l'étape à la température de transition et ajouter l'enthalpie de changement d'état.</li>
      <li><span class="step">Contrôle.</span> \(T_F \gt T_I\) pour une réaction exothermique ; ordre de grandeur plausible.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Calculer \(K^\circ\) à une température quelconque</strong>
    <ol>
      <li><span class="step">Voie directe.</span> \(\Delta_rG^\circ(T) = \Delta_rH^\circ - T\,\Delta_rS^\circ\), puis \(K^\circ(T) = \exp(-\Delta_rG^\circ/RT)\).</li>
      <li><span class="step">Voie de Van 't Hoff.</span> À partir d'une valeur connue \(K^\circ(T_1)\) : \(\ln\dfrac{K^\circ(T_2)}{K^\circ(T_1)} = -\dfrac{\Delta_rH^\circ}{R}\left(\dfrac{1}{T_2} - \dfrac{1}{T_1}\right)\).</li>
      <li><span class="step">Contrôle.</span> Les deux voies coïncident dans l'approximation d'Ellingham ; le sens de variation doit suivre le signe de \(\Delta_rH^\circ\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Prévoir l'effet d'une perturbation sur un équilibre</strong>
    <ol>
      <li><span class="step">Levier.</span> La température modifie \(K^\circ\) (Van 't Hoff) ; les autres paramètres modifient \(Q_r\).</li>
      <li><span class="step">Expression.</span> Écrire \(Q_r\) en fonction de la grandeur modifiée (\(P\), \(n_i\), \(n_{\text{tot,gaz}}\)…), les autres restant fixes ; pour des gaz, \(Q_r = \prod n_i^{\,\nu_i}\,\big(P/(n_{\text{tot,gaz}}P^\circ)\big)^{\Delta\nu_{\text{gaz}}}\).</li>
      <li><span class="step">Variation.</span> Partant de \(Q_r = K^\circ\), dire si la perturbation fait croître ou décroître \(Q_r\).</li>
      <li><span class="step">Conclure.</span> \(Q_r \lt K^\circ\) : sens direct ; \(Q_r \gt K^\circ\) : sens indirect. Distinguer un ajout d'inerte à \(P\) fixée (effet) et à \(V\) fixé (aucun effet).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Calculer un potentiel standard inconnu</strong>
    <ol>
      <li><span class="step">Cible.</span> Écrire la demi-équation cherchée avec ses \(\gamma\) électrons.</li>
      <li><span class="step">Décomposer.</span> L'obtenir comme combinaison linéaire de demi-équations connues et de réactions de constante connue (\(K_s\), \(K_a\), \(\Delta_fG^\circ\)…).</li>
      <li><span class="step">Additionner.</span> Sommer les enthalpies libres standard : \(-\gamma_kF\,E^\circ_k\) pour une demi-équation, \(-RT\ln K^\circ\) pour une réaction.</li>
      <li><span class="step">Conclure.</span> Diviser par \(-\gamma F\). Ne jamais additionner directement des potentiels.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Faire le bilan d'une pile</strong>
    <ol>
      <li><span class="step">Électrodes.</span> Identifier les couples ; réduction à la cathode (pôle +, plus haut potentiel), oxydation à l'anode (pôle −).</li>
      <li><span class="step">Réaction.</span> Écrire la réaction de fonctionnement et repérer \(\gamma\).</li>
      <li><span class="step">Tension.</span> \(e = E_+ - E_-\) (Nernst), ou \(e = -\Delta_rG/(\gamma F)\) à partir de données thermodynamiques.</li>
      <li><span class="step">Capacité.</span> Réactif limitant → \(\xi_{\max}\) → \(q_{\max} = \gamma F\,\xi_{\max}\) ; énergie \(W \approx q_{\max}\,e\) ; durée \(\Delta t = q_{\max}/i\).</li>
    </ol>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="thc-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Le four à chaux</h3>
  <div class="statement">On étudie la décomposition du calcaire, CaCO₃(s) = CaO(s) + CO₂(g), dans l'approximation d'Ellingham. Données à 298 K : \(\Delta_fH^\circ\) (kJ·mol⁻¹) : CaCO₃ −1 207,6 ; CaO −634,9 ; CO₂ −393,5. \(S^\circ_m\) (J·K⁻¹·mol⁻¹) : CaCO₃ 91,7 ; CaO 38,1 ; CO₂ 213,8. \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Prévoir le signe de \(\Delta_rS^\circ\), puis calculer \(\Delta_rH^\circ\) et \(\Delta_rS^\circ\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(\Delta_rG^\circ(T)\) et calculer la température d'inversion.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(K^\circ\) à 1 200 K. Quelle est la pression de CO₂ à l'équilibre, en enceinte fermée, à cette température ?</div>
  <div class="q"><strong>Q4.</strong> Un four à chaux est ouvert sur l'air, où la pression partielle de CO₂ vaut environ \(4\times10^{-4}\ \text{bar}\). Le calcaire peut-il s'y décomposer à 1 000 K, en dessous de la température d'inversion ? Jusqu'où ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La réaction crée une mole de gaz (\(\Delta\nu_{\text{gaz}} = +1\)) : \(\Delta_rS^\circ \gt 0\). Hess : \(\Delta_rH^\circ\) \(= -634{,}9 - 393{,}5 + 1\,207{,}6\) \(= +179{,}2\ \text{kJ·mol}^{-1}\) (endothermique). \(\Delta_rS^\circ\) \(= 38{,}1 + 213{,}8 - 91{,}7\) \(= +160{,}2\ \text{J·K}^{-1}\text{·mol}^{-1}\), positive comme prévu.</p>
    <p><strong>Q2.</strong> \(\Delta_rG^\circ(T)\) \(= 179{,}2\times10^3 - 160{,}2\,T\) (J·mol⁻¹). Elle s'annule pour \(T_i\) \(= \dfrac{179{,}2\times10^3}{160{,}2}\) \(\approx 1\,119\ \text{K}\).</p>
    <p><strong>Q3.</strong> \(\Delta_rG^\circ(1200)\) \(= 179{,}2\times10^3 - 1200\times160{,}2\) \(= -13{,}0\ \text{kJ·mol}^{-1}\), d'où \(K^\circ\) \(= \exp\left(\dfrac{13{,}0\times10^3}{8{,}314\times1200}\right)\) \(\approx 3{,}7\). Les solides ont une activité égale à 1 : \(K^\circ = P_{\mathrm{CO_2,éq}}/P^\circ\), soit \(P_{\mathrm{CO_2}} \approx 3{,}7\ \text{bar}\) (si assez de calcaire est présent).</p>
    <p><strong>Q4.</strong> À 1 000 K, \(\Delta_rG^\circ = +19{,}0\ \text{kJ·mol}^{-1}\) et \(K^\circ \approx 0{,}10\). Dans le four ouvert, \(Q_r = P_{\mathrm{CO_2}}/P^\circ \approx 4\times10^{-4} \lt K^\circ\) : \(\Delta_rG\) \(= RT\ln\dfrac{Q_r}{K^\circ}\) \(\approx -46\ \text{kJ·mol}^{-1} \lt 0\), le calcaire se décompose bien qu'on soit sous \(T_i\). Le CO₂ formé est sans cesse évacué : \(Q_r\) reste petit, l'équilibre n'est jamais atteint et la décomposition est totale (rupture d'équilibre). La température d'inversion n'est pas un seuil d'évolution : c'est \(\Delta_rG\), et non \(\Delta_rG^\circ\), qui décide.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Synthèse de l'ammoniac</h3>
  <div class="statement">On étudie N₂(g) + 3 H₂(g) = 2 NH₃(g) dans l'approximation d'Ellingham. Données à 298 K : \(\Delta_fH^\circ(\mathrm{NH_3}) = -45{,}9\ \text{kJ·mol}^{-1}\) ; \(S^\circ_m\) (J·K⁻¹·mol⁻¹) : N₂ 191,6 ; H₂ 130,7 ; NH₃ 192,8.</div>
  <div class="q"><strong>Q1.</strong> Prévoir le signe de \(\Delta_rS^\circ\), puis calculer \(\Delta_rH^\circ\) et \(\Delta_rS^\circ\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(\Delta_rG^\circ(T)\). Calculer la température d'inversion et \(K^\circ\) à 298 K.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(K^\circ\) à 723 K de deux façons.</div>
  <div class="q"><strong>Q4.</strong> Dans un réacteur à 723 K, les pressions partielles valent \(P_{\mathrm{N_2}} = 50\ \text{bar}\), \(P_{\mathrm{H_2}} = 150\ \text{bar}\) et \(P_{\mathrm{NH_3}} = 20\ \text{bar}\). Dans quel sens le système évolue-t-il ?</div>
  <div class="q"><strong>Q5.</strong> Quel est l'effet, à température et pression totale fixées, de l'accumulation d'argon dans le réacteur ? Justifier les conditions industrielles : 450 °C, 200 bar, catalyseur au fer, liquéfaction de l'ammoniac.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta\nu_{\text{gaz}} = -2\) : \(\Delta_rS^\circ \lt 0\). \(\Delta_rH^\circ = 2\,\Delta_fH^\circ(\mathrm{NH_3}) = -91{,}8\ \text{kJ·mol}^{-1}\) (N₂ et H₂ sont dans leur ESR). \(\Delta_rS^\circ\) \(= 2(192{,}8) - 191{,}6 - 3(130{,}7)\) \(= -198{,}1\ \text{J·K}^{-1}\text{·mol}^{-1}\).</p>
    <p><strong>Q2.</strong> \(\Delta_rG^\circ(T) = -91{,}8\times10^3 + 198{,}1\,T\) (J·mol⁻¹), nulle pour \(T_i \approx 463\ \text{K}\). À 298 K : \(\Delta_rG^\circ = -32{,}7\ \text{kJ·mol}^{-1}\) et \(K^\circ \approx 5{,}4\times10^5\).</p>
    <p><strong>Q3.</strong> Directement : \(\Delta_rG^\circ(723) = 51{,}4\ \text{kJ·mol}^{-1}\), donc \(K^\circ \approx 1{,}9\times10^{-4}\). Par Van 't Hoff intégrée depuis 298 K : \(5{,}4\times10^5\times\exp\left[\dfrac{91{,}8\times10^3}{8{,}314}\left(\dfrac{1}{723} - \dfrac{1}{298}\right)\right]\) \(\approx 1{,}9\times10^{-4}\).</p>
    <p><strong>Q4.</strong> \(Q_r\) \(= \dfrac{(P_{\mathrm{NH_3}}/P^\circ)^2}{(P_{\mathrm{N_2}}/P^\circ)(P_{\mathrm{H_2}}/P^\circ)^3}\) \(= \dfrac{20^2}{50\times150^3}\) \(\approx 2{,}4\times10^{-6} \lt K^\circ\). Donc \(\Delta_rG = RT\ln(Q_r/K^\circ) \approx -26\ \text{kJ·mol}^{-1} \lt 0\) : évolution dans le sens direct, de l'ammoniac se forme.</p>
    <p><strong>Q5.</strong> \(Q_r = \dfrac{n_{\mathrm{NH_3}}^2}{n_{\mathrm{N_2}}\,n_{\mathrm{H_2}}^3}\left(\dfrac{n_{\text{tot,gaz}}P^\circ}{P}\right)^{2}\) : l'argon augmente \(n_{\text{tot,gaz}}\), donc \(Q_r\) ; l'équilibre est déplacé dans le sens indirect, d'où la purge des inertes. Réaction exothermique : \(K^\circ\) diminue avec \(T\), mais sous 400 °C la réaction est trop lente même catalysée ; 450 °C est un compromis. \(\Delta\nu_{\text{gaz}} \lt 0\) : une haute pression diminue \(Q_r\) et favorise la synthèse. Le catalyseur accélère sans changer \(K^\circ\). La liquéfaction retire NH₃, ce qui diminue \(Q_r\), et permet de recycler N₂ et H₂.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Flamme et calorimétrie</h3>
  <div class="statement">Données à 298 K : \(C^\circ_{p,m}\) (J·K⁻¹·mol⁻¹) : CO₂ 37,1 ; H₂O(g) 33,6. Pour CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(g), \(\Delta_rH^\circ = -802{,}5\ \text{kJ·mol}^{-1}\). Dans l'air, la température de flamme adiabatique calculée est d'environ 2 680 K.</div>
  <p class="exo-part">Partie A — Flamme dans le dioxygène pur</p>
  <div class="q"><strong>Q1.</strong> Un mélange stœchiométrique CH₄ + 2 O₂, initialement à 298 K, brûle de façon adiabatique et monobare. Calculer la température de flamme et la comparer à celle obtenue dans l'air.</div>
  <div class="q"><strong>Q2.</strong> La température réelle d'une flamme oxy-méthane est de l'ordre de 3 000 K. Commenter.</div>
  <p class="exo-part">Partie B — Mesure d'une enthalpie de réaction</p>
  <div class="statement">Dans un calorimètre de capacité thermique \(C_{\text{cal}} = 120\ \text{J·K}^{-1}\), on mélange 100 mL d'acide chlorhydrique à 1,00 mol·L⁻¹ et 100 mL de soude à 1,00 mol·L⁻¹, tous deux à 20,0 °C. La température finale vaut 25,8 °C. On assimile les solutions à de l'eau (\(c = 4{,}18\ \text{J·g}^{-1}\text{·K}^{-1}\), \(\rho = 1\ \text{g·mL}^{-1}\)). Données : \(\Delta_fH^\circ\) (kJ·mol⁻¹) : H₂O(ℓ) −285,8 ; HO⁻(aq) −230,0 ; convention \(\Delta_fH^\circ(\mathrm{H^+}) = 0\).</div>
  <div class="q"><strong>Q3.</strong> Écrire la réaction et justifier qu'elle est totale.</div>
  <div class="q"><strong>Q4.</strong> En déduire \(\Delta_rH^\circ\) et la comparer à la valeur tabulée.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> État final : CO₂ + 2 H₂O(g), de capacité thermique \(37{,}1 + 2\times33{,}6 = 104{,}3\ \text{J·K}^{-1}\). \(T_F\) \(= 298 + \dfrac{802{,}5\times10^3}{104{,}3}\) \(\approx 8\,000\ \text{K}\). Sans les 8 moles de diazote, il y a environ trois fois moins de matière à chauffer : la température calculée est trois fois plus élevée.</p>
    <p><strong>Q2.</strong> La valeur calculée est irréaliste : à ces températures, CO₂ et H₂O se dissocient (réactions très endothermiques qui consomment de l'énergie) et les capacités thermiques augmentent. Les hypothèses « combustion totale » et « \(C_p\) constants » ne tiennent plus. Qualitativement, la conclusion reste juste : la flamme dans le dioxygène pur est bien plus chaude, d'où son usage en soudage et en découpage.</p>
    <p><strong>Q3.</strong> H⁺ + HO⁻ → H₂O, de constante \(K^\circ = 1/K_e = 10^{14}\) : réaction quasi totale. \(\xi_F = 0{,}100\ \text{mol}\).</p>
    <p><strong>Q4.</strong> Calorimètre adiabatique et monobare : \(0 = \xi_F\,\Delta_rH^\circ + (m\,c + C_{\text{cal}})(T_F - T_I)\), avec \(m\,c = 200\times4{,}18 = 836\ \text{J·K}^{-1}\). D'où \(\Delta_rH^\circ\) \(= -\dfrac{(836 + 120)\times5{,}8}{0{,}100}\) \(\approx -55{,}4\ \text{kJ·mol}^{-1}\). Valeur tabulée : \(-285{,}8 - (-230{,}0) - 0 = -55{,}8\ \text{kJ·mol}^{-1}\). L'écart, inférieur à 1 %, vient des pertes thermiques et de l'assimilation des solutions à de l'eau pure.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Équilibre de Boudouard</h3>
  <div class="statement">On étudie C(graphite) + CO₂(g) = 2 CO(g), réaction clé du haut fourneau, dans l'approximation d'Ellingham. Données à 298 K : \(\Delta_fH^\circ\) (kJ·mol⁻¹) : CO −110,5 ; CO₂ −393,5. \(S^\circ_m\) (J·K⁻¹·mol⁻¹) : C(gr) 5,7 ; CO 197,7 ; CO₂ 213,8.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\Delta_rH^\circ\) et \(\Delta_rS^\circ\) ; commenter leurs signes. Calculer la température d'inversion.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(K^\circ\) à 1 000 K et à 800 K.</div>
  <div class="q"><strong>Q3.</strong> On place 1 mol de CO₂ au contact d'un excès de graphite à 1 000 K, sous \(P = 1\ \text{bar}\). Déterminer la composition à l'équilibre.</div>
  <div class="q"><strong>Q4.</strong> Même question sous 10 bar, puis sous 1 bar en présence de 4 mol de N₂. Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta_rH^\circ\) \(= 2(-110{,}5) - (-393{,}5)\) \(= +172{,}5\ \text{kJ·mol}^{-1}\) : endothermique. \(\Delta_rS^\circ\) \(= 2(197{,}7) - 213{,}8 - 5{,}7\) \(= +175{,}9\ \text{J·K}^{-1}\text{·mol}^{-1}\) : positive, cohérente avec \(\Delta\nu_{\text{gaz}} = +1\). \(T_i = 172{,}5\times10^3/175{,}9 \approx 981\ \text{K}\).</p>
    <p><strong>Q2.</strong> \(K^\circ(1000)\) \(= \exp\left(-\dfrac{172{,}5\times10^3 - 1000\times175{,}9}{8{,}314\times1000}\right)\) \(\approx 1{,}50\) ; \(K^\circ(800) \approx 8{,}4\times10^{-3}\). Réaction endothermique : \(K^\circ\) croît avec \(T\).</p>
    <p><strong>Q3.</strong> Le graphite, en excès, a une activité égale à 1. Avec \(n_{\mathrm{CO_2}} = 1 - \xi\), \(n_{\mathrm{CO}} = 2\xi\) et \(n_{\text{tot,gaz}} = 1 + \xi\) : \(K^\circ\) \(= \dfrac{4\xi^2}{(1-\xi)(1+\xi)}\,\dfrac{P}{P^\circ}\), d'où \(\xi_{\text{éq}}\) \(= \sqrt{\dfrac{K^\circ}{K^\circ + 4P/P^\circ}}\) \(= \sqrt{\dfrac{1{,}50}{5{,}50}}\) \(\approx 0{,}52\ \text{mol}\). Composition : 0,48 mol de CO₂ et 1,05 mol de CO, soit \(x_{\mathrm{CO}} \approx 0{,}69\).</p>
    <p><strong>Q4.</strong> Sous 10 bar : \(\xi_{\text{éq}} = \sqrt{1{,}50/41{,}5} \approx 0{,}19\ \text{mol}\) (\(x_{\mathrm{CO}} \approx 0{,}32\)) : \(\Delta\nu_{\text{gaz}} \gt 0\), la hausse de pression défavorise la formation de CO. Avec 4 mol de N₂ sous 1 bar : \(\dfrac{4\xi^2}{(1-\xi)(5+\xi)} = 1{,}50\) donne numériquement \(\xi_{\text{éq}} \approx 0{,}74\ \text{mol}\) : la dilution par un inerte à pression fixée équivaut à une baisse de pression et favorise ici le sens direct. Le haut fourneau produit donc efficacement le réducteur CO à haute température et sous pression modérée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ☆ ☆</span>
  <h3>Degrés d'oxydation du cuivre</h3>
  <div class="statement">Données à 298 K : \(E^\circ(\mathrm{Cu^{2+}/Cu}) = 0{,}34\ \text{V}\) ; \(E^\circ(\mathrm{Cu^{2+}/Cu^+}) = 0{,}16\ \text{V}\) ; \(F = 96\,485\ \text{C·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(E^\circ(\mathrm{Cu^+/Cu})\).</div>
  <div class="q"><strong>Q2.</strong> Écrire la réaction de dismutation de Cu⁺ ; calculer \(\Delta_rG^\circ\) et \(K^\circ\).</div>
  <div class="q"><strong>Q3.</strong> On prépare une solution de Cu⁺ à 0,010 mol·L⁻¹. Que se passe-t-il ? Calculer la concentration résiduelle en Cu⁺.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Cu²⁺ + 2 e⁻ = Cu est la somme de Cu²⁺ + e⁻ = Cu⁺ et de Cu⁺ + e⁻ = Cu. Les enthalpies libres s'additionnent : \(-2F(0{,}34) = -F(0{,}16) - F\,E^\circ(\mathrm{Cu^+/Cu})\), donc \(E^\circ(\mathrm{Cu^+/Cu}) = 2\times0{,}34 - 0{,}16 = 0{,}52\ \text{V}\).</p>
    <p><strong>Q2.</strong> 2 Cu⁺ = Cu²⁺ + Cu(s), avec \(\gamma = 1\) : Cu⁺ est l'oxydant du couple Cu⁺/Cu (0,52 V) et le réducteur du couple Cu²⁺/Cu⁺ (0,16 V). \(\Delta_rG^\circ\) \(= -F(0{,}52 - 0{,}16)\) \(\approx -34{,}7\ \text{kJ·mol}^{-1}\) ; \(K^\circ = 10^{0{,}36/0{,}06} = 10^6\).</p>
    <p><strong>Q3.</strong> \(K^\circ\) est grande : la dismutation est quasi totale, il se forme du cuivre métallique et des ions Cu²⁺ à environ 0,005 mol·L⁻¹. Alors \(\dfrac{[\mathrm{Cu^{2+}}]\,c^\circ}{[\mathrm{Cu^+}]^2} = 10^6\) donne \([\mathrm{Cu^+}] = \sqrt{0{,}005\times10^{-6}} \approx 7\times10^{-5}\ \text{mol·L}^{-1}\). L'ion Cu⁺ n'est pas stable en solution aqueuse ; la règle du gamma le montre aussi, puisque l'oxydant Cu⁺ est placé au-dessus du réducteur Cu⁺ sur l'échelle des potentiels.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Pile bouton argent–zinc</h3>
  <div class="statement">Une pile de montre fonctionne selon Zn(s) + Ag₂O(s) → ZnO(s) + 2 Ag(s), dans un électrolyte de potasse concentrée. Données à 298 K : \(\Delta_fG^\circ\) (kJ·mol⁻¹) : ZnO(s) −320,5 ; Ag₂O(s) −11,2. \(M(\mathrm{Ag_2O}) = 231{,}7\ \text{g·mol}^{-1}\) ; \(M(\mathrm{Zn}) = 65{,}4\ \text{g·mol}^{-1}\) ; \(F = 96\,485\ \text{C·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Écrire les demi-équations en milieu basique ; identifier l'anode et la cathode.</div>
  <div class="q"><strong>Q2.</strong> Calculer la tension à vide standard. Pourquoi la tension à vide reste-t-elle constante pendant toute la décharge ?</div>
  <div class="q"><strong>Q3.</strong> La pile contient 0,50 g d'oxyde d'argent, réactif limitant. Calculer sa capacité en mA·h et la masse minimale de zinc nécessaire.</div>
  <div class="q"><strong>Q4.</strong> Une montre consomme en moyenne 2 µA. Estimer la durée de vie de la pile.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Anode (pôle −, oxydation) : Zn + 2 HO⁻ → ZnO + H₂O + 2 e⁻. Cathode (pôle +, réduction) : Ag₂O + H₂O + 2 e⁻ → 2 Ag + 2 HO⁻. Bilan avec \(\gamma = 2\).</p>
    <p><strong>Q2.</strong> \(\Delta_rG^\circ\) \(= -320{,}5 - (-11{,}2)\) \(= -309{,}3\ \text{kJ·mol}^{-1}\), d'où \(e^\circ\) \(= \dfrac{309{,}3\times10^3}{2\times96\,485}\) \(\approx 1{,}60\ \text{V}\). Tous les constituants du bilan sont des solides purs (\(a = 1\)) ; les ions HO⁻ et l'eau s'éliminent. \(Q_r = 1\) en permanence, donc \(e = e^\circ\) pendant toute la décharge : une qualité recherchée en horlogerie.</p>
    <p><strong>Q3.</strong> \(\xi_{\max} = n(\mathrm{Ag_2O}) = 0{,}50/231{,}7 \approx 2{,}16\ \text{mmol}\) ; \(q_{\max} = 2F\,\xi_{\max} \approx 416\ \text{C} \approx 116\ \text{mA·h}\). Zinc : au moins \(2{,}16\ \text{mmol}\times65{,}4\ \text{g·mol}^{-1} \approx 141\ \text{mg}\). Énergie : \(q_{\max}\,e^\circ \approx 0{,}67\ \text{kJ}\).</p>
    <p><strong>Q4.</strong> \(\Delta t = q_{\max}/i = 416/(2\times10^{-6}) \approx 2{,}1\times10^8\ \text{s}\), soit environ 6,6 ans (un peu moins en pratique, à cause de l'autodécharge).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Pile à combustible à hydrogène</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>thermochimie et piles</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">Dans une pile à combustible à électrolyte acide, le dihydrogène est oxydé à une électrode et le dioxygène réduit à l'autre, avec formation d'eau liquide. Données à 298 K : \(\Delta_fH^\circ(\mathrm{H_2O(\ell)}) = -285{,}8\ \text{kJ·mol}^{-1}\) ; \(\Delta_fG^\circ(\mathrm{H_2O(\ell)}) = -237{,}1\ \text{kJ·mol}^{-1}\) ; \(S^\circ_m\) (J·K⁻¹·mol⁻¹) : H₂ 130,7 ; O₂ 205,2 ; H₂O(ℓ) 70,0. \(M(\mathrm{H_2}) = 2{,}016\ \text{g·mol}^{-1}\) ; \(F = 96\,485\ \text{C·mol}^{-1}\). Approximation d'Ellingham.</div>

  <p class="exo-part">Partie A — Réaction et tension</p>
  <div class="q"><strong>A1.</strong> Écrire les demi-équations, préciser l'anode et la cathode, et écrire la réaction de fonctionnement pour une mole de H₂.</div>
  <div class="q"><strong>A2.</strong> Calculer la tension à vide standard \(e^\circ\) à 298 K. Retrouver ce résultat avec les potentiels standard des couples O₂/H₂O et H⁺/H₂.</div>

  <p class="exo-part">Partie B — Énergie et rendement</p>
  <div class="q"><strong>B1.</strong> Quelle énergie électrique maximale peut-on obtenir avec 1 kg de H₂ ? Quelle capacité, en A·h, cela représente-t-il ?</div>
  <div class="q"><strong>B2.</strong> On définit le rendement maximal \(\eta = \Delta_rG^\circ/\Delta_rH^\circ\). Le calculer et l'interpréter. Pourquoi n'est-il pas limité par le rendement de Carnot ?</div>

  <p class="exo-part">Partie C — Conditions de fonctionnement</p>
  <div class="q"><strong>C1.</strong> Calculer \(\dfrac{\mathrm{d}e^\circ}{\mathrm{d}T}\), puis \(e^\circ\) à 80 °C, température de fonctionnement usuelle.</div>
  <div class="q"><strong>C2.</strong> La cathode est alimentée par de l'air (\(P_{\mathrm{O_2}} = 0{,}2\ \text{bar}\)) et l'anode par H₂ sous 1 bar. Calculer la tension à vide à 298 K.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Anode (pôle −, oxydation) : H₂ → 2 H⁺ + 2 e⁻. Cathode (pôle +, réduction) : O₂ + 4 H⁺ + 4 e⁻ → 2 H₂O. Bilan pour une mole de H₂ : H₂(g) + ½ O₂(g) → H₂O(ℓ), avec \(\gamma = 2\).</p>
    <p><strong>A2.</strong> \(\Delta_rG^\circ = \Delta_fG^\circ(\mathrm{H_2O(\ell)}) = -237{,}1\ \text{kJ·mol}^{-1}\), donc \(e^\circ\) \(= \dfrac{237{,}1\times10^3}{2\times96\,485}\) \(\approx 1{,}23\ \text{V}\). On retrouve \(E^\circ(\mathrm{O_2/H_2O}) - E^\circ(\mathrm{H^+/H_2}) = 1{,}23 - 0\).</p>
    <p><strong>B1.</strong> \(n = 1000/2{,}016 \approx 496\ \text{mol}\) ; \(W_{\max} = n\times237{,}1\ \text{kJ} \approx 118\ \text{MJ} \approx 33\ \text{kWh}\). Capacité : \(q_{\max} = 2F\,n \approx 9{,}6\times10^7\ \text{C} \approx 2{,}7\times10^4\ \text{A·h}\).</p>
    <p><strong>B2.</strong> \(\eta = 237{,}1/285{,}8 \approx 0{,}83\). Au mieux, 83 % de l'énergie de la réaction devient électrique ; le reste, \(-T\Delta_rS^\circ\) avec \(\Delta_rS^\circ \lt 0\), est nécessairement cédé sous forme de chaleur. La pile convertit directement de l'énergie chimique en travail, sans passer par un cycle entre deux sources de chaleur : la limite de Carnot ne s'applique pas.</p>
    <p><strong>C1.</strong> \(e^\circ = -\dfrac{\Delta_rH^\circ - T\,\Delta_rS^\circ}{2F}\), donc \(\dfrac{\mathrm{d}e^\circ}{\mathrm{d}T} = \dfrac{\Delta_rS^\circ}{2F}\), avec \(\Delta_rS^\circ\) \(= 70{,}0 - 130{,}7 - \tfrac12(205{,}2)\) \(= -163{,}3\ \text{J·K}^{-1}\text{·mol}^{-1}\) : \(\dfrac{\mathrm{d}e^\circ}{\mathrm{d}T} \approx -0{,}85\ \text{mV·K}^{-1}\). À 353 K : \(e^\circ \approx 1{,}229 - 55\times0{,}85\times10^{-3} \approx 1{,}18\ \text{V}\).</p>
    <p><strong>C2.</strong> \(Q_r = \dfrac{1}{(P_{\mathrm{H_2}}/P^\circ)(P_{\mathrm{O_2}}/P^\circ)^{1/2}}\) (l'eau liquide a une activité 1), donc \(e\) \(= e^\circ - \dfrac{0{,}059}{2}\log Q_r\) \(= 1{,}229 + \dfrac{0{,}059}{4}\log 0{,}2\) \(\approx 1{,}22\ \text{V}\). L'alimentation en air au lieu de dioxygène pur ne coûte que quelques millivolts.</p>
