<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Parties 5 « Transformations chimiques de la matière : aspects thermodynamiques » et 6.1 « Étude thermodynamique des réactions d'oxydo-réduction » du programme de PT, avec le bilan énergétique des piles (début de la partie 6.3). La cinétique électrochimique, l'électrolyse et la corrosion sont traitées dans « Électrochimie : courbes courant-potentiel, électrolyse, corrosion ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Premier principe</strong> : état standard, enthalpie standard de réaction, loi de Hess, enthalpies de formation ; transfert thermique en réacteur monobare isotherme, température atteinte en réacteur adiabatique ; capacité numérique : évolution de la température d'un réacteur adiabatique (§1 à §6).</li>
        <li><strong>Deuxième principe</strong> : entropie standard de réaction (signe), lien entre création d'entropie et enthalpie libre de réaction, sens d'évolution par \(\Delta_rG\), grandeurs standard par combinaison linéaire (§2, §4, §5, §7).</li>
        <li><strong>Constante d'équilibre</strong> : relation de Van 't Hoff, valeur à toute température ; état final : équilibre ou transformation totale (§7, §8).</li>
        <li><strong>Optimisation</strong> d'un procédé par modification de \(K^\circ\) ou du quotient de réaction (§8).</li>
        <li><strong>Oxydoréduction</strong> : relation entre enthalpie libre de réaction et potentiels ; potentiel standard d'un couple à partir de données thermodynamiques (§9).</li>
        <li><strong>Piles</strong> : inégalité entre variation d'enthalpie libre et travail électrique, tension à vide, capacité (§10).</li>
      </ul>
      <p>Enthalpies et entropies standard de réaction sont supposées indépendantes de la température (approximation d'Ellingham) en dehors des changements d'état ; l'affinité chimique n'est pas utilisée.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · RAPPELS DE PREMIÈRE ANNÉE</div>
  <h2>Avancement, activité, quotient de réaction</h2>
  <div class="intro">Trois outils de PTSI reviennent à chaque ligne de ce chapitre : l'avancement, qui décrit une réaction avec une seule variable ; l'activité, qui mesure le poids d'un constituant dans le mélange ; le quotient de réaction, qui situe le système par rapport à l'équilibre. Les rappels d'oxydoréduction sont regroupés au §9.</div>

  <h3>Constituant et phase</h3>
  <div class="def-box">
    Un <strong>constituant</strong> est une espèce chimique <em>dans un état physique donné</em> : H₂O(ℓ) et H₂O(g) sont deux constituants différents.<br>
    Une <strong>phase</strong> est une région de l'espace où les grandeurs intensives (masse volumique, concentrations…) varient continûment. Un mélange de gaz ne forme qu'une seule phase ; deux solides distincts en forment deux.
  </div>

  <h3>Coefficients stœchiométriques algébriques</h3>
  <p>On écrit désormais toute équation de réaction sous la forme compacte</p>
  <div class="formula" data-nom="Équation de réaction">$$0 = \sum_i \nu_i\,\mathrm{A}_i$$</div>
  <p>où le <strong>coefficient stœchiométrique algébrique</strong> \(\nu_i\) est positif pour un produit, négatif pour un réactif et nul pour une espèce spectatrice. Pour la synthèse de l'ammoniac, N₂(g) + 3 H₂(g) = 2 NH₃(g) : \(\nu_{\mathrm{N_2}} = -1\), \(\nu_{\mathrm{H_2}} = -3\) et \(\nu_{\mathrm{NH_3}} = +2\). Ce signe permet d'écrire avec une seule somme ce qui concerne à la fois les réactifs et les produits.</p>
  <div class="def-box">
    L'<strong>avancement</strong> \(\xi\) (en mol) est défini, pour tout constituant, par
    $$n_i = n_{i,0} + \nu_i\,\xi \qquad\Longleftrightarrow\qquad \mathrm{d}n_i = \nu_i\,\mathrm{d}\xi$$
    Il est positif si la réaction progresse dans le sens direct, négatif dans le sens indirect. L'<strong>avancement maximal</strong> \(\xi_{\max}\) correspond à l'épuisement du réactif limitant.
  </div>

  <h3>Activité d'un constituant</h3>
  <p>L'<strong>activité</strong> \(a_i\) est un nombre sans dimension. Dans les cas idéaux du programme :</p>
  <div style="overflow-x:auto"><table>
    <tr><th>Constituant</th><th>Activité</th></tr>
    <tr><td>gaz parfait (seul ou en mélange)</td><td>\(a_i = \dfrac{P_i}{P^\circ} = x_i\,\dfrac{P}{P^\circ}\), avec \(P_i\) sa pression partielle</td></tr>
    <tr><td>soluté en solution diluée</td><td>\(a_i = \dfrac{c_i}{c^\circ}\)</td></tr>
    <tr><td>solvant (l'eau, en général)</td><td>\(a = 1\)</td></tr>
    <tr><td>solide ou liquide pur, seul dans sa phase</td><td>\(a = 1\)</td></tr>
  </table></div>
  <p>avec la pression standard \(P^\circ = 1\ \text{bar}\) et la concentration standard \(c^\circ = 1\ \text{mol·L}^{-1}\).</p>

  <h3>Quotient de réaction et constante d'équilibre</h3>
  <div class="formula" data-nom="Quotient de réaction">$$Q_r = \prod_i a_i^{\,\nu_i}$$</div>
  <p>Comme \(\nu_i\) est positif pour les produits et négatif pour les réactifs, les produits se retrouvent au numérateur et les réactifs au dénominateur. \(Q_r\) dépend de l'état du système : il évolue pendant la transformation.</p>
  <div class="prop-box">
    <strong>Ce qui était admis en PTSI.</strong> À l'équilibre, \(Q_{r,\text{éq}} = K^\circ(T)\) : la constante d'équilibre ne dépend que de la température (loi d'action des masses). Hors équilibre, le système évolue dans le sens direct si \(Q_r \lt K^\circ\), dans le sens indirect si \(Q_r \gt K^\circ\).<br>
    Ce chapitre <em>démontre</em> ce critère à partir du deuxième principe (§7) et apprend à <em>calculer</em> \(K^\circ\) à partir de tables (§4 à §7).
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Écrire le quotient de réaction de la décomposition du calcaire, CaCO₃(s) = CaO(s) + CO₂(g).</span>
    <div class="content"><p>Les deux solides, purs et seuls dans leur phase, ont une activité égale à 1. Il ne reste que le gaz : \(Q_r = \dfrac{P_{\mathrm{CO_2}}}{P^\circ}\). À l'équilibre, la pression en dioxyde de carbone vaut donc \(K^\circ P^\circ\), quelles que soient les quantités de solides présentes.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ENTHALPIE LIBRE ET POTENTIEL CHIMIQUE</div>
  <h2>La fonction d'état des transformations à T et P fixées</h2>
  <div class="intro">Au laboratoire comme à l'usine, la plupart des transformations chimiques se déroulent à température et pression fixées : bécher ouvert sur l'air, bain thermostaté, réacteur régulé. La fonction d'état adaptée à ces deux variables est l'enthalpie libre. Quand la composition change, on lui associe une grandeur par constituant : le potentiel chimique.</div>

  <h3>Enthalpie libre</h3>
  <div class="def-box">
    L'<strong>enthalpie libre</strong> (ou énergie de Gibbs) d'un système est la fonction d'état
    $$G = H - TS = U + PV - TS$$
    où \(U\) est l'énergie interne, \(H = U + PV\) l'enthalpie et \(S\) l'entropie. C'est une grandeur extensive, en joules.
  </div>
  <div class="prop-box">
    <strong>Identité thermodynamique</strong> (système fermé de composition fixée) :
    $$\mathrm{d}G = V\,\mathrm{d}P - S\,\mathrm{d}T$$
    Les variables naturelles de \(G\) sont \(T\) et \(P\) : à \(T\) et \(P\) fixées, \(G\) ne varie pas tant que la composition reste la même.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir l'identité thermodynamique de \(G\).</span>
    <div class="content"><p>On différentie : \(\mathrm{d}G = \mathrm{d}U + P\,\mathrm{d}V + V\,\mathrm{d}P - T\,\mathrm{d}S - S\,\mathrm{d}T\). Pour une évolution réversible élémentaire, \(\mathrm{d}U = -P\,\mathrm{d}V + T\,\mathrm{d}S\) : les termes en \(P\,\mathrm{d}V\) et en \(T\,\mathrm{d}S\) se compensent, et il reste \(\mathrm{d}G = V\,\mathrm{d}P - S\,\mathrm{d}T\). Comme \(G\) est une fonction d'état, cette relation entre deux états voisins vaut pour n'importe quelle transformation.</p></div>
  </div>
  <div class="notice"><strong>Deux erreurs fréquentes.</strong> Le signe devant \(PV\) est un plus : \(G = U + PV - TS\), puisque \(H = U + PV\). Et \(\mathrm{d}G = V\,\mathrm{d}P - S\,\mathrm{d}T\) suppose la composition fixée : dès qu'une réaction a lieu, il faut ajouter un terme par constituant.</div>

  <h3>Potentiel chimique</h3>
  <div class="def-box">
    Le <strong>potentiel chimique</strong> du constituant \(\mathrm{A}_i\) dans un mélange est
    $$\mu_i = \left(\frac{\partial G}{\partial n_i}\right)_{T,\,P,\,n_{j\neq i}} \qquad(\text{J·mol}^{-1})$$
    C'est une grandeur intensive : l'augmentation de \(G\) par mole de \(\mathrm{A}_i\) ajoutée, à \(T\), \(P\) et autres quantités de matière fixées (pour un ajout infinitésimal). C'est la pente de la courbe de \(G\) en fonction de \(n_i\).
  </div>
  <div class="prop-box">
    <strong>Système de composition variable :</strong>
    $$\mathrm{d}G = V\,\mathrm{d}P - S\,\mathrm{d}T + \sum_i \mu_i\,\mathrm{d}n_i \qquad\qquad G = \sum_i n_i\,\mu_i$$
    La seconde relation (identité d'Euler) est admise ; elle traduit l'extensivité de \(G\). Pour un corps pur, \(G = n\,\mu\) : le potentiel chimique d'un corps pur est son <strong>enthalpie libre molaire</strong>.
  </div>

  <h3>Expression du potentiel chimique (admise)</h3>
  <div class="formula" data-nom="Potentiel chimique">$$\mu_i = \mu_i^\circ(T) + RT\ln a_i$$</div>
  <p>\(\mu_i^\circ(T)\) est le <strong>potentiel chimique standard</strong> : la valeur de \(\mu_i\) quand \(a_i = 1\), c'est-à-dire dans l'état standard (§3). Il ne dépend que de la température. Avec les activités du §1 :</p>
  <div class="formula">$$\mu_{\text{gaz}} = \mu^\circ + RT\ln\frac{P_i}{P^\circ} \qquad \mu_{\text{soluté}} = \mu^\circ + RT\ln\frac{c_i}{c^\circ} \qquad \mu_{\text{solide ou liquide pur}} = \mu^\circ$$</div>
  <p>Plus un constituant est concentré, plus son potentiel chimique est élevé, mais la variation est lente : à 298 K, \(RT \approx 2{,}48\ \text{kJ·mol}^{-1}\), et doubler la pression partielle d'un gaz n'augmente son potentiel chimique que de \(RT\ln 2 \approx 1{,}7\ \text{kJ·mol}^{-1}\).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour comprendre (hors programme)</span>
    <span class="prompt">D'où vient le terme \(RT\ln a_i\) ?</span>
    <div class="content"><p>Pour un gaz parfait pur, l'identité thermodynamique appliquée à une mole donne, à \(T\) fixée, \(\mathrm{d}\mu = V_m\,\mathrm{d}P = \dfrac{RT}{P}\,\mathrm{d}P\). En intégrant de \(P^\circ\) à \(P\) : \(\mu = \mu^\circ + RT\ln(P/P^\circ)\). Les autres expressions s'obtiennent par analogie, dans le modèle de la solution idéale. Seul le résultat est exigible.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ÉTATS STANDARD</div>
  <h2>Une référence de calcul, à chaque température</h2>
  <div class="intro">Toutes les grandeurs « standard » (\(\mu^\circ\), \(\Delta_rH^\circ\), \(K^\circ\)…) reposent sur un état de référence conventionnel. Bien le définir évite deux contresens fréquents : « standard » ne veut dire ni « à 25 °C », ni « état réellement observé ».</div>

  <div class="def-box">
    L'<strong>état standard</strong> d'un constituant à la température \(T\) est un état de référence pris à cette même température et sous la <strong>pression standard</strong> \(P^\circ = 1\ \text{bar}\) :
    <ul>
      <li><strong>gaz</strong> : le constituant pur, se comportant comme un gaz parfait ;</li>
      <li><strong>solide ou liquide</strong> : le constituant pur, dans le même état physique ;</li>
      <li><strong>soluté</strong> : le soluté à \(c^\circ = 1\ \text{mol·L}^{-1}\), se comportant comme en solution infiniment diluée ;</li>
      <li><strong>solvant</strong> : le solvant pur.</li>
    </ul>
  </div>
  <div class="notice"><strong>Trois pièges.</strong> Il n'existe pas de température standard : il y a un état standard à chaque température, et les tables sont données à 298 K par simple commodité. L'état standard peut être fictif (aucun gaz réel n'est parfait, aucun soluté à 1 mol·L⁻¹ n'est infiniment dilué) : c'est une référence de calcul. Pour l'ion H⁺, l'état standard correspond à pH = 0, d'où les potentiels standard mesurés à pH = 0.</div>

  <h3>État standard de référence d'un élément</h3>
  <div class="def-box">
    L'<strong>état standard de référence</strong> (ESR) d'un élément à la température \(T\) est l'état standard du <strong>corps simple</strong> correspondant, dans l'état physique le plus stable à cette température.<br>
    Conventions : pour H, N, O, F et Cl, l'ESR est le gaz diatomique (H₂, N₂, O₂, F₂, Cl₂) à toute température ; pour le carbone, c'est le graphite.
  </div>
  <ul>
    <li>Oxygène : O₂(g), et non l'ozone O₃, corps simple moins stable.</li>
    <li>Brome : Br₂(ℓ) à 298 K, mais Br₂(g) au-dessus de sa température d'ébullition, 332 K.</li>
    <li>Fer : Fe(s) jusqu'à 1 811 K, puis Fe(ℓ).</li>
  </ul>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">À 298 K, \(\mu^\circ(\text{diamant}) - \mu^\circ(\text{graphite}) = +2{,}9\ \text{kJ·mol}^{-1}\). Pourquoi le diamant ne se transforme-t-il pas en graphite ?</span>
    <div class="content"><p>Les deux sont des solides purs (\(a = 1\)), donc \(\mu = \mu^\circ\) : le diamant a le potentiel chimique le plus élevé. La matière évolue spontanément vers les potentiels chimiques les plus bas (démontré au §7) : la transformation diamant → graphite est thermodynamiquement possible. Mais elle est infiniment lente à température ambiante ; on dit que le diamant est <strong>métastable</strong>. La thermodynamique dit ce qui <em>peut</em> se produire, la cinétique dit <em>à quelle vitesse</em>.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · GRANDEURS DE RÉACTION</div>
  <h2>Dériver par rapport à l'avancement</h2>
  <div class="intro">Le système est le siège d'une seule réaction, d'avancement \(\xi\), à température et pression fixées. Toute grandeur extensive \(X\) (\(G\), \(H\), \(S\), \(V\)…) dépend alors de \(\xi\). La question centrale : comment \(X\) varie-t-elle quand la réaction avance ?</div>

  <div class="def-box">
    La <strong>grandeur de réaction</strong> associée à \(X\) est sa dérivée par rapport à l'avancement :
    $$\Delta_r X = \left(\frac{\partial X}{\partial \xi}\right)_{T,P} = \sum_i \nu_i\,X_{m,i} \qquad\text{avec}\qquad X_{m,i} = \left(\frac{\partial X}{\partial n_i}\right)_{T,P,n_{j\neq i}}$$
    \(X_{m,i}\) est la <strong>grandeur molaire partielle</strong> de \(\mathrm{A}_i\) (pour \(X = G\), c'est \(\mu_i\)). \(\Delta_rX\) s'exprime « par mole d'avancement » : J·mol⁻¹ (J·K⁻¹·mol⁻¹ pour \(\Delta_rS\)). Elle dépend de \(T\), de \(P\) et de la composition.
  </div>
  <div class="formula" data-nom="Enthalpie libre de réaction">$$\Delta_r G = \sum_i \nu_i\,\mu_i$$</div>
  <p>Justification : à \(T\) et \(P\) fixées, \(\mathrm{d}X = \sum_i X_{m,i}\,\mathrm{d}n_i = \left(\sum_i \nu_i X_{m,i}\right)\mathrm{d}\xi\). Pour la synthèse de l'ammoniac, \(\Delta_rG = 2\mu_{\mathrm{NH_3}} - \mu_{\mathrm{N_2}} - 3\mu_{\mathrm{H_2}}\).</p>
  <div class="notice"><strong>Ce n'est pas une différence.</strong> Malgré la lettre \(\Delta\), \(\Delta_r\) désigne une dérivée : \(\Delta_rG\) est la <em>pente</em> de la courbe \(G(\xi)\). Ne pas confondre \(\Delta_rH\) (J·mol⁻¹) et \(\Delta H\) (J, variation entre deux états) : \(\Delta H = \int \Delta_rH\,\mathrm{d}\xi\). Enfin, une grandeur de réaction est attachée à l'équation <em>écrite</em> : multiplier tous les coefficients par 2 la multiplie par 2.</div>

  <h3>Grandeurs standard de réaction</h3>
  <div class="def-box">
    La <strong>grandeur standard de réaction</strong> est calculée en prenant chaque constituant dans son état standard à la température \(T\) :
    $$\Delta_r X^\circ(T) = \sum_i \nu_i\,X^\circ_{m,i}(T) \qquad\text{par exemple}\qquad \Delta_rG^\circ = \sum_i \nu_i\,\mu_i^\circ$$
    Elle ne dépend que de \(T\) : on peut la mettre dans des tables. On peut se la représenter comme la variation de \(X\) pour une réaction <em>fictive</em> d'une mole d'avancement, à \(T\) et \(P^\circ\), où réactifs et produits resteraient purs et séparés dans leur état standard.
  </div>
  <div class="formula" data-nom="Relation fondamentale">$$\Delta_r G^\circ(T) = \Delta_r H^\circ(T) - T\,\Delta_r S^\circ(T)$$</div>
  <p>Elle découle de \(G = H - TS\) appliquée à chaque constituant dans son état standard : \(\mu_i^\circ = H^\circ_{m,i} - T\,S^\circ_{m,i}\), que l'on multiplie par \(\nu_i\) avant de sommer.</p>

  <h3>Ce que disent les signes</h3>
  <p>Une réaction est <strong>exothermique</strong> si \(\Delta_rH^\circ \lt 0\), <strong>endothermique</strong> si \(\Delta_rH^\circ \gt 0\), <strong>athermique</strong> si \(\Delta_rH^\circ \approx 0\) (le sens physique, chaleur cédée ou reçue, est établi au §6).</p>
  <div class="prop-box">
    <strong>Signe de l'entropie standard de réaction.</strong> L'entropie molaire d'un gaz (de l'ordre de 200 J·K⁻¹·mol⁻¹) est très supérieure à celle d'un solide ou d'un liquide (quelques dizaines). En notant \(\Delta\nu_{\text{gaz}} = \sum_{\text{gaz}} \nu_i\) :
    $$\Delta\nu_{\text{gaz}} \gt 0 \Rightarrow \Delta_rS^\circ \gt 0 \qquad \Delta\nu_{\text{gaz}} \lt 0 \Rightarrow \Delta_rS^\circ \lt 0 \qquad \Delta\nu_{\text{gaz}} = 0 \Rightarrow |\Delta_rS^\circ|\ \text{faible}$$
    Créer du gaz augmente fortement le nombre de configurations accessibles, donc le désordre.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Signe puis valeur de \(\Delta_rS^\circ\) pour N₂(g) + 3 H₂(g) = 2 NH₃(g), avec \(S^\circ_m\) (J·K⁻¹·mol⁻¹) : N₂ 191,6 ; H₂ 130,7 ; NH₃ 192,8.</span>
    <div class="content"><p>On passe de 4 moles de gaz à 2 : \(\Delta\nu_{\text{gaz}} = -2\), on prévoit \(\Delta_rS^\circ \lt 0\). Le calcul le confirme : \(\Delta_rS^\circ\) \(= 2(192{,}8) - 191{,}6 - 3(130{,}7)\) \(= -198{,}1\ \text{J·K}^{-1}\text{·mol}^{-1}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LOI DE HESS ET APPROXIMATION D'ELLINGHAM</div>
  <h2>Calculer une grandeur standard avec des tables</h2>
  <div class="intro">On ne peut pas tabuler toutes les réactions possibles. On tabule une seule réaction par espèce, sa réaction de formation, et l'on reconstruit toutes les autres à partir d'elles.</div>

  <div class="def-box">
    La <strong>réaction standard de formation</strong> d'un constituant forme <em>une mole</em> de ce constituant, dans son état standard, à partir des éléments qui le composent pris dans leur <strong>état standard de référence</strong>. La <strong>grandeur standard de formation</strong> \(\Delta_fX^\circ\) est la grandeur standard de cette réaction.<br>
    Exemple : ½ N₂(g) + 3/2 H₂(g) → NH₃(g), avec \(\Delta_fH^\circ(\mathrm{NH_3}) = -45{,}9\ \text{kJ·mol}^{-1}\).
  </div>
  <div class="prop-box">
    <strong>Corps simple dans son ESR :</strong> \(\Delta_fX^\circ = 0\), car sa « réaction de formation » ne transforme rien (O₂ → O₂). En revanche, \(\Delta_fX^\circ \neq 0\) pour un corps composé, et aussi pour un corps simple hors de son ESR : ozone, diamant, Br₂(g) à 298 K…
  </div>
  <div class="formula" data-nom="Loi de Hess">$$\Delta_r H^\circ = \sum_i \nu_i\,\Delta_f H^\circ_i \qquad\qquad \Delta_r G^\circ = \sum_i \nu_i\,\Delta_f G^\circ_i$$</div>
  <p>L'enthalpie est une fonction d'état : sa variation ne dépend pas du chemin. On passe des réactifs aux produits par un détour fictif : on décompose les réactifs en éléments dans leur ESR (contribution \(-\Delta_fH^\circ\) pour chaque réactif), puis on reforme les produits (\(+\Delta_fH^\circ\) pour chacun). Les coefficients algébriques réunissent les deux étapes en une seule somme.</p>

    <span class="label">Application</span>
    <span class="prompt">Chloration du méthane : CH₄(g) + Cl₂(g) → CH₃Cl(g) + HCl(g). Calculer \(\Delta_rH^\circ\) à 298 K.</span>
    <div class="content"><p>Avec les données du tableau ci-dessous et \(\Delta_fH^\circ(\mathrm{Cl_2}) = 0\) (corps simple dans son ESR) : \(\Delta_rH^\circ\) \(= -81{,}9 - 92{,}3 - (-74{,}6)\) \(= -99{,}6\ \text{kJ·mol}^{-1}\). La réaction est exothermique.</p></div>
  </div>

  <h3>Et pour l'entropie ?</h3>
  <p>Les tables donnent directement les <strong>entropies molaires standard absolues</strong> \(S^\circ_m\) (le troisième principe fixe \(S_m = 0\) pour un cristal parfait à 0 K). On calcule donc \(\Delta_rS^\circ = \sum_i \nu_i\,S^\circ_{m,i}\).</p>
  <div class="notice"><strong>Pièges.</strong> \(\Delta_fH^\circ(\mathrm{O_2}) = 0\), mais \(S^\circ_m(\mathrm{O_2}) = 205{,}2\ \text{J·K}^{-1}\text{·mol}^{-1}\) : l'entropie molaire d'un corps simple n'est jamais nulle, et l'oublier est l'erreur la plus fréquente. Les enthalpies sont en kJ·mol⁻¹, les entropies en J·K⁻¹·mol⁻¹ : convertir avant de combiner. Vérifier l'état physique : \(\Delta_fH^\circ\) vaut \(-285{,}8\ \text{kJ·mol}^{-1}\) pour H₂O(ℓ) et \(-241{,}8\ \text{kJ·mol}^{-1}\) pour H₂O(g), l'écart étant l'enthalpie de vaporisation.</div>

  <h3>Combinaisons linéaires de réactions</h3>
  <div class="prop-box">
    Si l'équation (3) s'écrit \((3) = a\,(1) + b\,(2)\), alors, puisque \(\Delta_rX^\circ\) est linéaire en les \(\nu_i\) :
    $$\Delta_rX^\circ_3 = a\,\Delta_rX^\circ_1 + b\,\Delta_rX^\circ_2 \quad (X = H, S, G) \qquad\qquad K^\circ_3 = \left(K^\circ_1\right)^a\left(K^\circ_2\right)^b$$
    (la seconde relation découle de \(\Delta_rG^\circ = -RT\ln K^\circ\), établie au §7).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">On ne sait pas brûler le carbone en CO sans former un peu de CO₂. Calculer \(\Delta_fH^\circ(\mathrm{CO})\) à partir de C(gr) + O₂ → CO₂ (\(-393{,}5\ \text{kJ·mol}^{-1}\)) et CO + ½ O₂ → CO₂ (\(-283{,}0\ \text{kJ·mol}^{-1}\)).</span>
    <div class="content"><p>La formation C(gr) + ½ O₂ → CO est la première réaction moins la seconde : \(\Delta_fH^\circ(\mathrm{CO})\) \(= -393{,}5 - (-283{,}0)\) \(= -110{,}5\ \text{kJ·mol}^{-1}\).</p></div>
  </div>

  <h3>Approximation d'Ellingham</h3>
  <div class="def-box">
    Dans l'<strong>approximation d'Ellingham</strong>, imposée par le programme, \(\Delta_rH^\circ\) et \(\Delta_rS^\circ\) sont indépendantes de la température sur tout intervalle où aucun constituant ne change d'état. Alors
    $$\Delta_rG^\circ(T) = \Delta_rH^\circ - T\,\Delta_rS^\circ$$
    est une <strong>fonction affine</strong> de \(T\), de pente \(-\Delta_rS^\circ\) et d'ordonnée à l'origine \(\Delta_rH^\circ\).
  </div>
  <p>L'approximation est raisonnable : \(\Delta_rH^\circ\) et \(\Delta_rS^\circ\) varient peu avec \(T\), alors que le terme \(T\Delta_rS^\circ\) change beaucoup.</p>
  <div class="def-box">
    La <strong>température d'inversion</strong> \(T_i\) est la température où \(\Delta_rG^\circ(T_i) = 0\), c'est-à-dire \(K^\circ(T_i) = 1\). Dans l'approximation d'Ellingham, \(T_i = \dfrac{\Delta_rH^\circ}{\Delta_rS^\circ}\).
  </div>

  <figure class="schema" style="max-width:440px">

<div class="course-section">
  <div class="sec-num">§6 · EFFETS THERMIQUES DES RÉACTIONS</div>
  <h2>Premier principe : chaleur échangée ou échauffement</h2>
  <div class="intro">Une réaction libère ou absorbe de l'énergie. Dans un réacteur thermostaté, cette énergie est échangée avec l'extérieur sous forme de chaleur ; dans un réacteur calorifugé, elle change la température de son contenu. Dans les deux cas, l'outil est le premier principe écrit avec l'enthalpie.</div>

  <div class="def-box">
    Pour une transformation d'un état initial (I) à un état final (F) :
    <ul>
      <li><strong>monobare</strong> : la pression extérieure est constante et \(P_I = P_F = P_{\text{ext}}\) (réacteur ouvert sur l'atmosphère) ;</li>
      <li><strong>isobare</strong> : la pression du système est définie et constante à chaque instant ;</li>
      <li><strong>monotherme</strong> : le système n'échange de chaleur qu'avec un thermostat de température \(T_{\text{ext}}\) ;</li>
      <li><strong>isotherme</strong> : la température est définie et constante (en pratique, \(T_I = T_F = T_{\text{ext}}\) dans un réacteur thermostaté) ;</li>
      <li><strong>adiabatique</strong> : aucun transfert thermique (calorimètre, réaction très rapide).</li>
    </ul>
  </div>
  <p>Pour un système fermé, au repos, subissant une transformation monobare où seules les forces de pression travaillent, le premier principe s'écrit \(\Delta H = Q\), où \(Q\) est le transfert thermique <em>reçu</em>. À \(T\) et \(P\) fixées, \(\mathrm{d}H = \Delta_rH\,\mathrm{d}\xi\), et l'on fait toujours l'approximation \(\Delta_rH \approx \Delta_rH^\circ\) : l'enthalpie d'un gaz parfait ne dépend que de \(T\), celle d'une phase condensée dépend très peu de \(P\), et le mélange idéal se fait sans effet thermique.</p>

  <h3>Réacteur monobare et isotherme</h3>
  <div class="formula" data-nom="Transfert thermique (réacteur isotherme)">$$Q = \Delta H = \xi_F\,\Delta_rH^\circ(T)$$</div>
  <p>Réaction exothermique : \(Q \lt 0\), le système <em>cède</em> de la chaleur au milieu extérieur. Réaction endothermique : \(Q \gt 0\), il en <em>reçoit</em>.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">On brûle 1 m³ de méthane, pris à 1 bar et 298 K : CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(ℓ). Quelle chaleur récupère-t-on si les produits sont ramenés à 298 K ?</span>
    <div class="content"><p>\(n\) \(= \dfrac{PV}{RT}\) \(= \dfrac{10^5\times1}{8{,}314\times298}\) \(\approx 40{,}3\ \text{mol}\). Loi de Hess : \(\Delta_rH^\circ\) \(= -393{,}5 + 2(-285{,}8) - (-74{,}6)\) \(= -890{,}5\ \text{kJ·mol}^{-1}\). Réaction totale : \(Q = \xi_F\,\Delta_rH^\circ\) \(\approx -35{,}9\ \text{MJ}\), soit environ 10 kWh cédés : c'est l'ordre de grandeur du « pouvoir calorifique » du gaz naturel facturé au mètre cube.</p></div>
  </div>

  <h3>Réacteur monobare et adiabatique : température finale</h3>
  <p>Si le réacteur est calorifugé (ou la réaction très rapide), \(Q = 0\), donc \(\Delta H = 0\) : l'énergie libérée par une réaction exothermique chauffe le contenu du réacteur. Comme \(H\) est une fonction d'état, on remplace la transformation réelle (réaction et échauffement simultanés) par un <strong>chemin fictif</strong> en deux étapes.</p>
  <figure class="schema" style="max-width:440px">
  <svg viewBox="0 0 360 214" role="img" aria-label="Chemin fictif : réaction à la température initiale, puis échauffement du système final jusqu'à la température finale ; la somme des deux variations d'enthalpie est nulle">

  <figcaption>Chemin fictif : (a) réaction complète à \(T_I\), \(\Delta H_a = \xi_F\,\Delta_rH^\circ(T_I)\) ; (b) échauffement de tout le système final, \(\Delta H_b = \left(\sum_j n_j C^\circ_{p,m,j}\right)(T_F - T_I)\).</figcaption>
  </figure>
  <div class="formula" data-nom="Température finale (réacteur adiabatique)">$$T_F = T_I - \frac{\xi_F\,\Delta_rH^\circ(T_I)}{\sum_j n_j\,C^\circ_{p,m,j}}$$</div>
  <div class="notice"><strong>La somme porte sur tout l'état final</strong> : produits, réactifs en excès <em>et</em> espèces spectatrices (diazote de l'air, solvant, calorimètre). Si un constituant change d'état pendant l'échauffement, on coupe l'étape (b) à la température du changement d'état et l'on ajoute l'enthalpie correspondante.</div>
  <div class="def-box">La <strong>température de flamme adiabatique</strong> d'une combustion est la température atteinte par les gaz brûlés quand la combustion, totale, a lieu de façon adiabatique et monobare.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Flamme méthane–air : mélange stœchiométrique CH₄ + 2 O₂ + 8 N₂ (environ 4 N₂ par O₂ dans l'air) à 298 K. Estimer la température de flamme.</span>
    <div class="content"><p>État final : CO₂ + 2 H₂O(g) + 8 N₂. On forme directement l'eau gazeuse dans l'étape (a) : \(\Delta_rH^\circ\) \(= -393{,}5 + 2(-241{,}8) + 74{,}6\) \(= -802{,}5\ \text{kJ·mol}^{-1}\). Capacité thermique de l'état final : \(37{,}1 + 2(33{,}6) + 8(29{,}1)\) \(= 337{,}1\ \text{J·K}^{-1}\). D'où \(T_F\) \(= 298 + \dfrac{802{,}5\times10^3}{337{,}1}\) \(\approx 2\,680\ \text{K}\).</p><p>La valeur mesurée est plus proche de 2 200 K : les capacités thermiques augmentent avec \(T\), une partie de CO₂ et H₂O se dissocie (réactions endothermiques) et il y a des pertes. Le diazote, spectateur, absorbe près de 70 % de l'énergie libérée.</p></div>
  </div>

  <h3>Capacité numérique : l'emballement thermique</h3>
  <p>Si la loi de vitesse est connue, on peut suivre \(T(t)\). La constante de vitesse croît avec la température (loi d'Arrhenius, \(k = A\,\mathrm{e}^{-E_a/RT}\)) : une réaction exothermique en réacteur adiabatique <strong>s'auto-accélère</strong>. Pour \(\mathrm{A} \to \mathrm{B}\) d'ordre 1, dans un réacteur de capacité thermique totale \(C\), le bilan d'enthalpie du chemin fictif, appliqué à chaque pas de temps, donne :</p>
  <div class="formula">$$\frac{\mathrm{d}\xi}{\mathrm{d}t} = k(T)\,(n_0 - \xi) \qquad\qquad C\,\frac{\mathrm{d}T}{\mathrm{d}t} = -\Delta_rH^\circ\,\frac{\mathrm{d}\xi}{\mathrm{d}t}$$</div>
<pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
R, Ea, A = 8.314, 80e3, 2.0e-4*np.exp(80e3/(8.314*298))   <span class="cmt"># k(298 K) = 2,0e-4 s⁻¹</span>
dH, C, n0 = -120e3, 3.0e3, 1.0                             <span class="cmt"># J/mol, J/K, mol</span>
dt, T, xi = 1.0, 298.0, 0.0
Ts = [T]
<span class="kw">for</span> i <span class="kw">in</span> range(3600):                                    <span class="cmt"># une heure, pas de 1 s</span>
    v = A*np.exp(-Ea/(R*T))*(n0 - xi)                       <span class="cmt"># vitesse dξ/dt</span>
    xi = xi + v*dt
    T = T - dH/C*v*dt                                       <span class="cmt"># bilan d'enthalpie</span>
    Ts.append(T)</pre>
  <p>La température finale vaut \(T_I + \Delta T_{\text{ad}}\), avec \(\Delta T_{\text{ad}} = -n_0\Delta_rH^\circ/C = 40\ \text{K}\) : on retrouve le chemin fictif. Mais entre-temps la constante de vitesse est multipliée par environ 45 : la courbe \(T(t)\) prend une allure en S, signature de l'<strong>emballement thermique</strong> que le génie chimique cherche à éviter (refroidissement, dilution, ajout progressif des réactifs).</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉVOLUTION ET ÉQUILIBRE</div>
  <h2>Deuxième principe : le critère d'évolution démontré</h2>
  <div class="intro">Tout découle d'une seule idée : à température et pression fixées, l'enthalpie libre d'un système ne peut que diminuer. Cadre de toute la section : système fermé, siège d'une réaction unique, maintenu à \(T = T_{\text{ext}}\) et \(P = P_{\text{ext}}\), où seules les forces de pression travaillent.</div>

  <div class="prop-box">
    <strong>Création d'entropie due à la réaction :</strong>
    $$T\,\delta S_c = -\Delta_rG\,\mathrm{d}\xi \geq 0 \qquad\Longleftrightarrow\qquad \mathrm{d}G = -T\,\delta S_c \leq 0$$
    À \(T\) et \(P\) fixées, \(G\) joue le rôle de <strong>potentiel thermodynamique</strong> : elle décroît au cours de toute évolution spontanée et elle est minimale à l'équilibre.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Relier la création d'entropie à l'enthalpie libre de réaction.</span>
    <div class="content"><p>Premier principe (monobare, forces de pression seules) : \(\mathrm{d}H = \delta Q\). Deuxième principe (monotherme) : \(\mathrm{d}S = \delta Q/T + \delta S_c\), avec \(\delta S_c \geq 0\). À \(T\) fixée : \(\mathrm{d}G = \mathrm{d}H - T\,\mathrm{d}S = -T\,\delta S_c\). Par ailleurs, à \(T\) et \(P\) fixées, \(\mathrm{d}G = \sum_i \mu_i\,\mathrm{d}n_i = \Delta_rG\,\mathrm{d}\xi\). En égalant les deux expressions : \(T\,\delta S_c = -\Delta_rG\,\mathrm{d}\xi\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Sens d'évolution à \(T\) et \(P\) fixées :</strong> le deuxième principe impose \(\Delta_rG\,\mathrm{d}\xi \leq 0\).
    <ul>
      <li>\(\Delta_rG \lt 0\) : \(\mathrm{d}\xi \gt 0\), évolution dans le <strong>sens direct</strong> ;</li>
      <li>\(\Delta_rG \gt 0\) : \(\mathrm{d}\xi \lt 0\), évolution dans le <strong>sens indirect</strong> ;</li>
      <li>\(\Delta_rG = 0\) : <strong>équilibre chimique</strong>.</li>
    </ul>
  </div>
  <div class="notice"><strong>\(\Delta_rG\), pas \(\Delta_rG^\circ\).</strong> C'est le signe de \(\Delta_rG\), qui dépend de la composition actuelle, qui donne le sens d'évolution ; \(\Delta_rG^\circ\) ne dépend que de \(T\). Et le critère dit si une évolution est <em>possible</em>, pas si elle est <em>rapide</em> (le diamant du §3).</div>

  <h3>Expression de l'enthalpie libre de réaction</h3>
  <p>En injectant \(\mu_i = \mu_i^\circ + RT\ln a_i\) dans \(\Delta_rG = \sum_i \nu_i\mu_i\), les \(\nu_i\) passent en exposants dans le logarithme :</p>
  <div class="formula" data-nom="Enthalpie libre de réaction et quotient">$$\Delta_rG = \Delta_rG^\circ + RT\ln Q_r$$</div>
  <div class="def-box">
    La <strong>constante thermodynamique d'équilibre</strong> à la température \(T\) est
    $$K^\circ(T) = \exp\left(-\frac{\Delta_rG^\circ(T)}{RT}\right) \qquad\Longleftrightarrow\qquad \Delta_rG^\circ = -RT\ln K^\circ$$
    Sans dimension, elle ne dépend que de \(T\) (et de l'écriture de l'équation).
  </div>
  <div class="formula" data-nom="Critère d'évolution">$$\Delta_rG = RT\ln\frac{Q_r}{K^\circ}$$</div>
  <div class="prop-box">
    <strong>Loi d'action des masses et critère en \(Q_r\).</strong> À l'équilibre, \(\Delta_rG = 0\), donc \(Q_{r,\text{éq}} = K^\circ(T)\). Hors équilibre : \(Q_r \lt K^\circ \Leftrightarrow \Delta_rG \lt 0\), sens direct ; \(Q_r \gt K^\circ \Leftrightarrow \Delta_rG \gt 0\), sens indirect. Le quotient de réaction évolue toujours vers la constante d'équilibre.
  </div>
  <figure class="schema" style="max-width:420px">

  <p>Le signe de \(\Delta_rG^\circ\) renseigne seulement sur \(K^\circ\) : \(K^\circ \gt 1 \Leftrightarrow \Delta_rG^\circ \lt 0\), la réaction est dite <em>thermodynamiquement favorisée</em>. Repères : si \(K^\circ \gtrsim 10^4\), la réaction est souvent quasi totale ; si \(K^\circ \lesssim 10^{-4}\), elle est quasi nulle ; l'état final dépend aussi des quantités initiales.</p>
  <div class="prop-box">
    <strong>Les visages de \(\Delta_rG^\circ\), à connaître :</strong>
    $$\Delta_rG^\circ = \sum_i \nu_i\,\mu_i^\circ = \sum_i \nu_i\,\Delta_fG^\circ_i = \Delta_rH^\circ - T\,\Delta_rS^\circ = -RT\ln K^\circ$$
    et, pour une réaction d'oxydoréduction (§9), \(\Delta_rG^\circ = -\gamma F\,(E_1^\circ - E_2^\circ)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Synthèse de l'ammoniac à 298 K (\(\Delta_rG^\circ = -32{,}7\ \text{kJ·mol}^{-1}\)) : calculer \(K^\circ\).</span>
    <div class="content"><p>\(K^\circ\) \(= \exp\left(\dfrac{32{,}7\times10^3}{8{,}314\times298}\right)\) \(\approx 5{,}4\times10^5\). La synthèse est très favorisée à température ambiante… mais infiniment lente sans catalyseur ni chauffage (§8).</p></div>
  </div>

  <h3>La courbe \(G(\xi)\)</h3>
  <p>À \(T\) et \(P\) fixées, \(G\) ne dépend plus que de \(\xi\), et la pente de la courbe vaut \(\Delta_rG\). Pour l'isomérisation gazeuse A(g) = B(g) sous \(P^\circ\), avec 1 mol de A au départ (\(a_A = 1 - \xi\), \(a_B = \xi\)) et \(\mu_A^\circ\) pris comme origine :</p>
  <div class="formula">$$G(\xi) - G(0) = \xi\,\Delta_rG^\circ + RT\left[(1-\xi)\ln(1-\xi) + \xi\ln\xi\right]$$</div>

  <p><strong>Pourquoi le minimum est-il à l'intérieur ?</strong> Le terme de mélange a une pente infinie en \(\xi = 0\) et en \(\xi = 1\) : dès qu'un constituant d'un mélange (gaz, soluté) est absent, \(\Delta_rG\) est infini et pousse à le former. Un équilibre entre gaz ou solutés n'est donc jamais rigoureusement total. Il en va autrement quand les constituants qui disparaissent sont des solides ou des liquides purs : leur activité reste égale à 1 jusqu'au bout, et la réaction peut s'arrêter par épuisement.</p>

  <h3>État final : équilibre ou transformation totale</h3>
  <div class="def-box">
    <ul>
      <li><strong>Équilibre chimique</strong> : tous les constituants de l'équation sont présents ; \(\Delta_rG = 0\) et \(Q_r = K^\circ\).</li>
      <li><strong>Transformation totale</strong> : un réactif est entièrement consommé, \(\xi_F = \xi_{\max}\). Le système s'arrête <em>hors équilibre</em>, avec \(\Delta_rG \lt 0\), faute de réactif.</li>
      <li><strong>Rupture d'équilibre</strong> : l'espèce épuisée est une phase condensée pure (solide, liquide) ou un précipité entièrement dissous.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">CaCO₃(s) = CaO(s) + CO₂(g) à 1 100 K (\(K^\circ = 0{,}722\)), dans une enceinte initialement vide de 10 L. État final pour \(n_0 = 0{,}100\ \text{mol}\), puis \(n_0 = 0{,}050\ \text{mol}\) de calcaire ?</span>
    <div class="content"><p>Si l'équilibre est atteint, \(P_{\mathrm{CO_2}} = K^\circ P^\circ = 0{,}722\ \text{bar}\), ce qui demande \(\xi_{\text{éq}}\) \(= \dfrac{P_{\mathrm{CO_2}}V}{RT}\) \(= \dfrac{0{,}722\times10^5\times10^{-2}}{8{,}314\times1100}\) \(\approx 78{,}9\ \text{mmol}\).</p><p>Avec 0,100 mol : \(\xi_{\text{éq}} \lt n_0\), équilibre ; il reste 21 mmol de calcaire et \(P = 0{,}722\ \text{bar}\). Avec 0,050 mol : \(\xi_{\text{éq}} \gt n_0\), <strong>rupture d'équilibre</strong> ; tout le calcaire se décompose, \(P = n_0RT/V \approx 0{,}457\ \text{bar} \lt K^\circ P^\circ\) et \(\Delta_rG = RT\ln(Q_r/K^\circ) \approx -4{,}2\ \text{kJ·mol}^{-1}\) : la réaction continuerait s'il restait du réactif.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · OPTIMISATION D'UN ÉQUILIBRE</div>
  <h2>Déplacer un équilibre : agir sur \(K^\circ\) ou sur \(Q_r\)</h2>
  <div class="intro">Pour améliorer le rendement d'une synthèse, on joue sur les conditions opératoires. Deux leviers existent : modifier \(K^\circ\), ce que seule la température permet, ou modifier \(Q_r\) (pression, composition) pour l'écarter de \(K^\circ\) dans le bon sens.</div>

  <h3>Influence de la température : relation de Van 't Hoff</h3>
  <div class="formula" data-nom="Relation de Van 't Hoff">$$\frac{\mathrm{d}\ln K^\circ}{\mathrm{d}T} = \frac{\Delta_rH^\circ}{RT^2}$$</div>
  <p>Réaction <strong>endothermique</strong> : \(K^\circ\) augmente avec \(T\). Réaction <strong>exothermique</strong> : \(K^\circ\) diminue quand \(T\) augmente. Réaction athermique : \(K^\circ\) varie peu.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir la relation de Van 't Hoff dans l'approximation d'Ellingham.</span>
    <div class="content"><p>\(\ln K^\circ = -\dfrac{\Delta_rG^\circ}{RT} = -\dfrac{\Delta_rH^\circ}{RT} + \dfrac{\Delta_rS^\circ}{R}\). Avec \(\Delta_rH^\circ\) et \(\Delta_rS^\circ\) constantes, la dérivée par rapport à \(T\) vaut \(\dfrac{\Delta_rH^\circ}{RT^2}\). (La relation reste vraie hors de cette approximation : on le montre avec la relation de Gibbs–Helmholtz, hors programme.)</p></div>
  </div>
  <div class="formula" data-nom="Van 't Hoff intégrée">$$\ln\frac{K^\circ(T_2)}{K^\circ(T_1)} = -\frac{\Delta_rH^\circ}{R}\left(\frac{1}{T_2} - \frac{1}{T_1}\right)$$</div>
  <p>\(\ln K^\circ\) est une fonction affine de \(1/T\), de pente \(-\Delta_rH^\circ/R\) et d'ordonnée à l'origine \(\Delta_rS^\circ/R\) : en mesurant \(K^\circ\) à plusieurs températures, une régression linéaire donne les deux grandeurs (et l'alignement des points teste l'approximation d'Ellingham).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Synthèse de l'ammoniac : sachant \(K^\circ(298) = 5{,}4\times10^5\), calculer \(K^\circ\) à 450 °C de deux façons.</span>
    <div class="content"><p>Directement : \(\Delta_rG^\circ(723)\) \(= -91{,}8 + 723\times0{,}1981\) \(= 51{,}4\ \text{kJ·mol}^{-1}\), d'où \(K^\circ\) \(= \exp\left(-\dfrac{51{,}4\times10^3}{8{,}314\times723}\right)\) \(\approx 1{,}9\times10^{-4}\). Par Van 't Hoff intégrée :</p><div class="formula">$$K^\circ(723) = 5{,}4\times10^5\times\exp\left[\frac{91{,}8\times10^3}{8{,}314}\left(\frac{1}{723} - \frac{1}{298}\right)\right] \approx 1{,}9\times10^{-4}$$</div><p> De 25 à 450 °C, \(K^\circ\) est divisée par environ \(3\times10^9\).</p></div>
  </div>
  <p><strong>Choix de la température.</strong> Pour augmenter le rendement à l'équilibre, on travaille à basse température pour une réaction exothermique, à haute température pour une réaction endothermique. Mais la vitesse augmente toujours avec \(T\) (loi d'Arrhenius) : pour une réaction exothermique, il faut un <strong>compromis</strong> entre thermodynamique et cinétique, que l'on améliore avec un catalyseur (qui accélère la réaction sans changer \(K^\circ\)).</p>

  <h3>Influence de la pression et de la composition</h3>
  <p>On part d'un équilibre (\(Q_r = K^\circ\)), on le perturbe instantanément à \(T\) fixée, et l'on regarde comment \(Q_r\) a varié : le système évolue ensuite pour ramener \(Q_r\) vers \(K^\circ\). Pour des gaz parfaits, \(a_i = \dfrac{n_i}{n_{\text{tot,gaz}}}\,\dfrac{P}{P^\circ}\), d'où :</p>
  <div class="formula" data-nom="Quotient d'un mélange gazeux">$$Q_r = \Big(\prod_{\text{gaz}} n_i^{\,\nu_i}\Big)\left(\frac{P}{n_{\text{tot,gaz}}\,P^\circ}\right)^{\Delta\nu_{\text{gaz}}}\times(\text{activités des autres constituants})$$</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Perturbation (\(T\) fixée)</th><th>Effet sur \(Q_r\) et conséquence</th></tr>
    <tr><td>hausse de la pression totale</td><td>\(Q_r \propto P^{\Delta\nu_{\text{gaz}}}\) : si \(\Delta\nu_{\text{gaz}} \lt 0\), \(Q_r\) diminue, évolution dans le sens direct (vers moins de gaz) ; aucun effet si \(\Delta\nu_{\text{gaz}} = 0\)</td></tr>
    <tr><td>ajout d'un gaz inerte à \(P\) fixée</td><td>\(n_{\text{tot,gaz}}\) augmente : même effet qu'une baisse de pression (sens indirect si \(\Delta\nu_{\text{gaz}} \lt 0\))</td></tr>
    <tr><td>ajout d'un gaz inerte à \(V\) fixé</td><td>pressions partielles \(P_i = n_iRT/V\) inchangées : aucun effet</td></tr>
    <tr><td>élimination d'un produit (liquéfaction, distillation, précipitation)</td><td>\(Q_r\) diminue : sens direct</td></tr>
    <tr><td>ajout d'un réactif (soluté, ou gaz à \(V\) fixé)</td><td>\(Q_r\) diminue : sens direct</td></tr>
    <tr><td>ajout ou retrait d'un solide ou liquide pur (sans le faire disparaître)</td><td>activité égale à 1 : aucun effet</td></tr>
  </table></div>
  <div class="notice"><strong>Raisonner sur \(Q_r\).</strong> L'ajout d'un gaz inerte n'a pas le même effet à \(P\) fixée et à \(V\) fixé, et un catalyseur ne change ni \(K^\circ\) ni \(Q_r\). Le principe de modération de Le Chatelier (« le système s'oppose à la perturbation ») n'est qu'un moyen mnémotechnique : aux concours, on attend la justification par \(Q_r\) et \(K^\circ\).</div>

  <h3>Application : le procédé Haber–Bosch</h3>
  <p>N₂(g) + 3 H₂(g) = 2 NH₃(g) est exothermique (\(\Delta_rH^\circ = -91{,}8\ \text{kJ·mol}^{-1}\)) et diminue la quantité de gaz (\(\Delta\nu_{\text{gaz}} = -2\)).</p>
  <ul>
    <li><strong>Température</strong> : la thermodynamique réclame une basse température, mais la réaction y est trop lente ; compromis vers 400 à 500 °C avec un catalyseur au fer.</li>
    <li><strong>Pression</strong> : haute, de 150 à 300 bar, pour diminuer \(Q_r\) ; au-delà, le coût des installations devient prohibitif.</li>
    <li><strong>Composition</strong> : on liquéfie l'ammoniac en sortie et l'on recycle N₂ et H₂ ; on purge les gaz inertes (argon de l'air), qui défavorisent la synthèse à \(P\) fixée.</li>
  </ul>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Résultats numériques</span>
    <span class="prompt">Mélange stœchiométrique (1 mol N₂, 3 mol H₂) à 723 K : avancement à l'équilibre selon la pression.</span>
    <div class="content"><p>On résout numériquement l'équation</p><div class="formula">$$\frac{(2\xi)^2\,(4 - 2\xi)^2}{(1 - \xi)\,(3 - 3\xi)^3}\left(\frac{P^\circ}{P}\right)^2 = K^\circ = 1{,}9\times10^{-4}$$</div><p>On obtient :</p>
    <div style="overflow-x:auto"><table>
      <tr><th>\(P\) (bar)</th><th>1</th><th>50</th><th>200</th><th>300</th></tr>
      <tr><td>\(\xi_{\text{éq}}\) (mol)</td><td>0,009</td><td>0,27</td><td>0,53</td><td>0,60</td></tr>
      <tr><td>fraction molaire de NH₃</td><td>0,004</td><td>0,16</td><td>0,36</td><td>0,43</td></tr>
    </table></div>
    <p>Sous 1 bar à 450 °C, la synthèse est quasi nulle ; sous 200 bar, plus du tiers du mélange est de l'ammoniac.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · THERMODYNAMIQUE DE L'OXYDORÉDUCTION</div>
  <h2>Potentiels et enthalpie libre : deux langages pour la même tendance</h2>
  <div class="intro">Les potentiels d'électrode de PTSI et l'enthalpie libre de réaction décrivent la même chose : la tendance d'un système d'oxydoréduction à évoluer. Faire le lien permet de calculer des potentiels standard à partir de données thermodynamiques, et inversement.</div>

  <h3>Rappels de première année</h3>
  <div class="def-box">
    Un <strong>oxydant</strong> capte des électrons, un <strong>réducteur</strong> en cède ; ils forment un couple relié par la demi-équation \(\alpha\,\mathrm{Ox} + \gamma\,e^- = \beta\,\mathrm{Red}\) (équilibrée si besoin avec H⁺ et H₂O). Le <strong>nombre d'oxydation</strong> (n.o.) d'un élément est la charge fictive qu'il porterait si chaque doublet de liaison revenait à l'atome le plus électronégatif. Règles : la somme des n.o. est égale à la charge de l'édifice ; O vaut −II (−I dans un peroxyde), H vaut +I ; un corps simple a des n.o. nuls. Une oxydation fait croître le n.o., une réduction le fait décroître.
  </div>
  <div class="formula" data-nom="Formule de Nernst">$$E = E^\circ + \frac{RT}{\gamma F}\ln\frac{a_{\mathrm{Ox}}^{\,\alpha}}{a_{\mathrm{Red}}^{\,\beta}} \;\approx\; E^\circ + \frac{0{,}06}{\gamma}\log\frac{a_{\mathrm{Ox}}^{\,\alpha}}{a_{\mathrm{Red}}^{\,\beta}}\quad\text{à 298 K}$$</div>
  <p>Les autres espèces de la demi-équation (H⁺…) figurent dans le logarithme avec leur coefficient. Le potentiel est mesuré par rapport à l'électrode standard à hydrogène (ESH), de potentiel nul par convention. Le « 0,06 » vaut \(RT\ln 10/F = 0{,}0592\ \text{V}\) à 298 K. Règle du gamma : l'oxydant le plus fort (en haut de l'échelle des \(E^\circ\)) réagit sur le réducteur le plus fort (en bas).</p>

  <h3>Enthalpie libre d'une réaction d'oxydoréduction</h3>
  <p>On considère \(a_1\,\mathrm{Ox}_1 + b_2\,\mathrm{Red}_2 = b_1\,\mathrm{Red}_1 + a_2\,\mathrm{Ox}_2\), écrite pour échanger \(\gamma\) électrons.</p>
  <div class="formula" data-nom="Réaction rédox et enthalpie libre">$$\Delta_rG = -\gamma F\,(E_1 - E_2) \qquad\qquad \Delta_rG^\circ = -\gamma F\,(E_1^\circ - E_2^\circ)$$</div>
  <p>\(E_1\) et \(E_2\) sont les potentiels de Nernst des deux couples avec la composition actuelle ; \(F \approx 96\,500\ \text{C·mol}^{-1}\) est la constante de Faraday. Le facteur \(-\gamma F\) est justifié par l'étude des piles (§10).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Vérification</span>
    <span class="prompt">Montrer que cette relation est cohérente avec la formule de Nernst.</span>
    <div class="content"><p>En écrivant Nernst pour chaque couple (avec \(\gamma\) électrons) et en soustrayant : \(E_1 - E_2\) \(= (E_1^\circ - E_2^\circ) - \dfrac{RT}{\gamma F}\ln Q_r\). En multipliant par \(-\gamma F\) : \(-\gamma F(E_1 - E_2)\) \(= -\gamma F(E_1^\circ - E_2^\circ) + RT\ln Q_r\), qui a exactement la structure \(\Delta_rG = \Delta_rG^\circ + RT\ln Q_r\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Conséquences.</strong>
    <ul>
      <li>Sens d'évolution : \(\Delta_rG \lt 0 \Leftrightarrow E_1 \gt E_2\) ; l'oxydant du couple de plus haut potentiel est réduit. C'est la justification thermodynamique de la règle du gamma.</li>
      <li>Équilibre : \(E_1 = E_2\), la solution n'a plus qu'un seul potentiel.</li>
      <li>Constante d'équilibre : \(\ln K^\circ = \dfrac{\gamma F}{RT}\,(E_1^\circ - E_2^\circ)\), soit à 298 K :</li>
    </ul>
    $$\log K^\circ = \frac{\gamma\,(E_1^\circ - E_2^\circ)}{0{,}06}$$
  </div>
  <p>Ordres de grandeur à 298 K : un écart \(\Delta E^\circ = 0{,}1\ \text{V}\) avec \(\gamma = 1\) correspond à \(\Delta_rG^\circ \approx -9{,}6\ \text{kJ·mol}^{-1}\) et \(K^\circ \approx 50\) ; pour la pile Daniell (\(\gamma = 2\), \(\Delta E^\circ = 1{,}10\ \text{V}\)), \(\Delta_rG^\circ \approx -212\ \text{kJ·mol}^{-1}\) et \(K^\circ \approx 10^{37}\).</p>

  <h3>Enthalpie libre standard d'une demi-équation</h3>
  <div class="def-box">
    À la demi-équation \(\alpha\,\mathrm{Ox} + \gamma\,e^- = \beta\,\mathrm{Red}\), on associe par convention
    $$\Delta_{1/2}G^\circ = -\gamma F\,E^\circ(\mathrm{Ox/Red})$$
    C'est l'enthalpie libre standard de la réaction de l'oxydant avec H₂ (couple H⁺/H₂, de potentiel standard nul). Pour toute réaction d'oxydoréduction, \(\Delta_rG^\circ = \Delta_{1/2}G_1^\circ - \Delta_{1/2}G_2^\circ\).
  </div>
  <p>Ces enthalpies libres s'additionnent comme des grandeurs de réaction ordinaires et se combinent avec celles d'autres réactions (dissolution, formation, acido-basicité). C'est ce qui permet de calculer un <strong>potentiel standard inconnu</strong>.</p>
  <div class="notice"><strong>On additionne les enthalpies libres, jamais les potentiels.</strong> Quand un terme comme \(\dfrac{0{,}059}{2}\,\mathrm{p}K_s\) apparaît avec un grand \(\mathrm{p}K\), garder 0,059 : l'arrondi à 0,06 fausserait le résultat d'un centième de volt.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Calculer \(E^\circ(\mathrm{Fe^{3+}/Fe})\) à partir de \(E^\circ(\mathrm{Fe^{3+}/Fe^{2+}}) = 0{,}77\ \text{V}\) et \(E^\circ(\mathrm{Fe^{2+}/Fe}) = -0{,}44\ \text{V}\).</span>
    <div class="content"><p>Fe³⁺ + 3 e⁻ = Fe est la somme de Fe³⁺ + e⁻ = Fe²⁺ et de Fe²⁺ + 2 e⁻ = Fe. Les enthalpies libres s'additionnent : \(-3F\,E_3^\circ\) \(= -F(0{,}77) - 2F(-0{,}44)\), d'où \(E_3^\circ\) \(= \dfrac{0{,}77 - 0{,}88}{3}\) \(\approx -0{,}04\ \text{V}\). Les potentiels se combinent pondérés par le nombre d'électrons.</p></div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Calculer \(E^\circ(\mathrm{O_2/H_2O})\) sachant \(\Delta_fG^\circ(\mathrm{H_2O(\ell)}) = -237{,}1\ \text{kJ·mol}^{-1}\).</span>
    <div class="content"><p>La demi-équation O₂ + 4 H⁺ + 4 e⁻ = 2 H₂O, associée à l'ESH, correspond à O₂ + 2 H₂ → 2 H₂O(ℓ), avec \(\gamma = 4\) : \(\Delta_rG^\circ\) \(= 2\times(-237{,}1)\) \(= -474{,}2\ \text{kJ·mol}^{-1}\) \(= -4F\,(E^\circ - 0)\), d'où \(E^\circ\) \(= \dfrac{474{,}2\times10^3}{4\times96\,485}\) \(\approx 1{,}23\ \text{V}\).</p></div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Électrode au calomel : calculer \(E^\circ(\mathrm{Hg_2Cl_2/Hg})\) à partir de \(E^\circ(\mathrm{Hg_2^{2+}/Hg}) = 0{,}797\ \text{V}\) et du \(\mathrm{p}K_s = 17{,}9\) de Hg₂Cl₂.</span>
    <div class="content"><p>Hg₂Cl₂(s) + 2 e⁻ = 2 Hg(ℓ) + 2 Cl⁻ est la somme de la dissolution Hg₂Cl₂ = Hg₂²⁺ + 2 Cl⁻ (\(\Delta_rG^\circ = -RT\ln K_s\)) et de Hg₂²⁺ + 2 e⁻ = 2 Hg (\(-2F\,E_1^\circ\)). D'où \(-2F\,E^\circ = -RT\ln K_s - 2F\,E_1^\circ\), soit \(E^\circ\) \(= E_1^\circ - \dfrac{0{,}059}{2}\,\mathrm{p}K_s\) \(= 0{,}797 - 0{,}0295\times17{,}9\) \(\approx 0{,}27\ \text{V}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · PILES ÉLECTROCHIMIQUES</div>
  <h2>Convertir l'enthalpie libre en travail électrique</h2>
  <div class="intro">Une pile récupère sous forme électrique l'énergie d'une réaction d'oxydoréduction spontanée. L'enthalpie libre fixe à la fois la tension qu'elle peut délivrer et l'énergie maximale qu'elle peut fournir.</div>

  <div class="def-box">
    Une <strong>pile</strong> est un générateur où une réaction d'oxydoréduction spontanée a lieu <em>sans contact direct</em> entre les réactifs : oxydation et réduction se déroulent dans deux <strong>demi-piles</strong>, reliées par une <strong>jonction électrolytique</strong> (pont salin, paroi poreuse) qui laisse passer les ions ; les électrons passent par le circuit extérieur.<br>
    L'<strong>anode</strong> est le siège de l'oxydation (pôle −), la <strong>cathode</strong> celui de la réduction (pôle +). La <strong>tension à vide</strong> est \(e = V_+ - V_- = E_+ - E_- \gt 0\), mesurée à courant nul.
  </div>
  <figure class="schema" style="max-width:420px">
  <svg viewBox="0 0 360 230" role="img" aria-label="Pile Daniell : électrode de zinc dans une solution d'ions zinc à gauche, anode et pôle moins ; électrode de cuivre dans une solution d'ions cuivre à droite, cathode et pôle plus ; pont salin entre les deux béchers ; les électrons circulent du zinc vers le cuivre dans le circuit extérieur">

  </figure>
  <p>Notation conventionnelle : ⊖ Zn(s) | Zn²⁺, SO₄²⁻ ‖ Cu²⁺, SO₄²⁻ | Cu(s) ⊕. Réaction de fonctionnement : Zn(s) + Cu²⁺ → Zn²⁺ + Cu(s), avec \(\gamma = 2\).</p>

  <h3>Bilan énergétique</h3>
  <div class="prop-box">
    Pour un système évoluant de façon monotherme et monobare, recevant un travail électrique \(W_{\text{élec}}\) en plus du travail des forces de pression :
    $$\Delta G \leq W_{\text{élec}}$$
    avec égalité si la transformation est réversible. Une pile fournit \(-W_{\text{élec}} \leq -\Delta G\) : l'énergie électrique maximale récupérable est \(-\Delta G\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir l'inégalité \(\Delta G \leq W_{\text{élec}}\).</span>
    <div class="content"><p>Sur une évolution élémentaire à \(P\) fixée : \(\mathrm{d}H = \delta Q + \delta W_{\text{élec}}\) (premier principe). Deuxième principe : \(\mathrm{d}S = \delta Q/T + \delta S_c\) avec \(\delta S_c \geq 0\). À \(T\) fixée :</p><div class="formula">$$\mathrm{d}G = \mathrm{d}H - T\,\mathrm{d}S = \delta W_{\text{élec}} - T\,\delta S_c \leq \delta W_{\text{élec}}$$</div><p>On intègre. L'enthalpie libre porte bien son nom : \(-\Delta G\) est la part de l'énergie de la réaction « libre » d'être convertie en travail ; le reste est échangé sous forme de chaleur.</p></div>
  </div>

  <h3>Tension à vide et enthalpie libre de réaction</h3>
  <div class="formula" data-nom="Tension à vide d'une pile">$$e = -\frac{\Delta_rG}{\gamma F} \qquad\qquad e^\circ = -\frac{\Delta_rG^\circ}{\gamma F} = E^\circ_+ - E^\circ_-$$</div>
  <div class="formula">$$e = e^\circ - \frac{RT}{\gamma F}\ln Q_r \;\approx\; e^\circ - \frac{0{,}06}{\gamma}\log Q_r\quad\text{à 298 K}$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Relier la tension à vide à l'enthalpie libre de réaction.</span>
    <div class="content"><p>Quand l'avancement croît de \(\mathrm{d}\xi\), \(\gamma\,\mathrm{d}\xi\) moles d'électrons traversent le circuit : la charge \(\mathrm{d}q = \gamma F\,\mathrm{d}\xi\) passe dans la pile du pôle − au pôle + sous la tension \(u\). La pile reçoit donc \(\delta W_{\text{élec}} = -u\,\gamma F\,\mathrm{d}\xi\). À la limite réversible (courant nul), \(u \to e\) et \(\mathrm{d}G = \delta W_{\text{élec}}\) ; or \(\mathrm{d}G = \Delta_rG\,\mathrm{d}\xi\) à \(T\) et \(P\) fixées. D'où \(\Delta_rG = -\gamma F e\). Avec \(e = E_+ - E_-\), on retrouve \(\Delta_rG = -\gamma F(E_+ - E_-)\), relation utilisée au §9.</p></div>
  </div>
  <p>Pendant la décharge, \(Q_r\) augmente, donc \(e\) diminue. La pile est <strong>usée</strong> quand elle atteint l'équilibre : \(e = 0 \Leftrightarrow \Delta_rG = 0 \Leftrightarrow Q_r = K^\circ\). Pour la pile Daniell, \(K^\circ \approx 10^{37}\) : \(\log Q_r\) ne varie que de quelques unités pendant presque toute la décharge, et la tension reste proche de 1,10 V (encore 1,03 V à 99 % de la décharge) ; elle ne chute qu'à l'épuisement des ions Cu²⁺.</p>

  <h3>Capacité d'une pile</h3>
  <div class="def-box">
    La <strong>capacité</strong> d'une pile est la charge totale qu'elle peut débiter jusqu'à l'épuisement du réactif limitant :
    $$q_{\max} = \gamma F\,\xi_{\max}$$
    en coulombs ou, en pratique, en ampères-heures : \(1\ \text{A·h} = 3\,600\ \text{C}\).
  </div>
  <p>Si la tension reste quasi constante pendant la décharge, l'énergie électrique maximale vaut \(W_{\max} = -\xi_{\max}\,\Delta_rG \approx q_{\max}\,e\), et la durée de fonctionnement sous un courant \(i\) est \(\Delta t = q_{\max}/i\).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Pile Daniell dont le réactif limitant est 1,0 g de zinc (\(M = 65{,}4\ \text{g·mol}^{-1}\)) : capacité, énergie, durée sous 10 mA ?</span>
    <div class="content"><p>\(\xi_{\max}\) \(= \dfrac{1{,}0}{65{,}4}\) \(\approx 15{,}3\ \text{mmol}\), donc \(q_{\max}\) \(= 2\times96\,485\times15{,}3\times10^{-3}\) \(\approx 2{,}95\times10^3\ \text{C}\) \(\approx 0{,}82\ \text{A·h}\). Énergie : \(W \approx q_{\max}\,e^\circ\) \(\approx 2\,950\times1{,}10\) \(\approx 3{,}2\ \text{kJ}\). Sous 10 mA : \(\Delta t = q_{\max}/i \approx 82\ \text{h}\).</p></div>
  </div>
  <div class="notice"><strong>Ordres de grandeur.</strong> Pile alcaline AA : environ 1,5 V et 2,5 A·h, soit 3,5 W·h. Élément lithium-ion : environ 3,7 V ; une batterie de téléphone stocke de l'ordre de 15 W·h. En électrolyte aqueux, la décomposition de l'eau limite en pratique la tension vers 2 V (accumulateur au plomb : 2,1 V) ; les accumulateurs lithium-ion dépassent 3 V grâce à un électrolyte organique.</div>
</div>
