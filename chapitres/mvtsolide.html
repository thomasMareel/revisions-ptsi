<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 2.7 du programme de PTSI, « Mouvement d'un solide » (second semestre). Il s'appuie sur le chapitre « Moment cinétique » (moment cinétique scalaire, moment d'une force, bras de levier, théorème du moment cinétique, conservation) et sur « Énergie mécanique » (théorème de l'énergie cinétique, énergie potentielle). Le programme se limite à deux mouvements : la translation et la rotation autour d'un axe fixe ; le moment d'inertie est toujours <strong>fourni</strong>. La mécanique du solide plus générale (roulement, solides en 3D) est traitée en sciences industrielles (chapitres « Cinématique », « Liaisons, graphe et schéma cinématique », « Dynamique du solide »).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Définition d'un solide, translation</strong> : différencier un solide d'un système déformable ; reconnaître et décrire une translation rectiligne ainsi qu'une translation circulaire (§1).</li>
        <li><strong>Rotation autour d'un axe fixe</strong> : décrire la trajectoire d'un point quelconque du solide et exprimer sa vitesse en fonction de sa distance à l'axe et de la vitesse angulaire (§2).</li>
        <li><strong>Moment cinétique d'un solide en rotation, moment d'inertie</strong> : exploiter la relation entre le moment cinétique scalaire, la vitesse angulaire et le moment d'inertie fourni ; relier qualitativement le moment d'inertie à la répartition des masses (§3).</li>
        <li><strong>Couple, liaison pivot</strong> : définir un couple ; définir une liaison pivot et justifier le moment qu'elle peut produire (§4).</li>
        <li><strong>Théorème scalaire du moment cinétique</strong> appliqué au solide en rotation autour d'un axe fixe dans un référentiel galiléen (§5).</li>
        <li><strong>Pendule pesant</strong> : établir l'équation du mouvement ; établir une intégrale première du mouvement (§6) ; réaliser l'étude énergétique et mettre en évidence une diminution de l'énergie mécanique (§9).</li>
        <li><strong>Capacité numérique</strong> : mettre en évidence le non-isochronisme des oscillations à l'aide d'un langage de programmation (§7).</li>
        <li><strong>Énergie cinétique d'un solide en rotation, théorème de l'énergie cinétique</strong> : utiliser l'expression de l'énergie cinétique (moment d'inertie fourni) ; établir l'équivalence entre le théorème scalaire du moment cinétique et celui de l'énergie cinétique (§8).</li>
        <li><strong>Système déformable</strong> : prendre en compte le travail des forces intérieures, utiliser sa nullité dans le cas d'un solide ; conduire le bilan énergétique du tabouret d'inertie (§10).</li>
      </ul>
      <p>Hors programme (regroupé en fin de chapitre) : le calcul des moments d'inertie et le théorème de Huygens-Steiner, le mouvement composé d'une translation et d'une rotation (roulement), la rotation autour d'un axe mobile.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · SOLIDE, SYSTÈME DÉFORMABLE ET TRANSLATION</div>
  <h2>Un système indéformable</h2>
  <div class="intro">Une roue, une porte, une barre : tant que leurs déformations sont négligeables, on les modélise par un solide, dont la position se décrit avec très peu de paramètres. Un gymnaste, un ressort, deux pièces articulées sont au contraire des systèmes déformables, dont les forces intérieures peuvent fournir ou dissiper de l'énergie (§10).</div>
  <div class="def-box">
    <strong>Solide.</strong> Un solide est un système <strong>indéformable</strong> : la distance entre deux quelconques de ses points reste constante au cours du temps. Sinon, le système est <strong>déformable</strong> (ressort, corde, être vivant qui bouge, solides articulés).
  </div>
  <div class="def-box">
    <strong>Translation.</strong> Un solide est en translation si, à chaque instant, <strong>tous ses points ont le même vecteur vitesse</strong>. Un segment qui relie deux de ses points garde alors une direction fixe. La translation est <strong>rectiligne</strong> si les trajectoires sont des droites (tiroir, ascenseur, piston), <strong>circulaire</strong> si ce sont des cercles de même rayon, décalés les uns des autres (nacelle de grande roue, bielle d'accouplement des roues d'une locomotive).
  </div>

  <div class="method-box"><strong>Exemple — la nacelle d'une grande roue</strong>
    <p>Une grande roue de 30 m de rayon fait un tour en 15 min. La nacelle, suspendue à un pivot au bout d'un rayon, reste verticale.</p>
    <ol>
      <li>La nacelle ne tourne pas sur elle-même : elle est en translation circulaire. Chacun de ses points décrit un cercle de 30 m de rayon, décalé du cercle du pivot.</li>
      <li>Tous ses points ont la vitesse du pivot : \(v=2\pi R/T=2\pi\times30/900\approx0{,}21\ \text{m·s}^{-1}\), et la même accélération centripète \(v^2/R\approx1{,}5\times10^{-3}\ \text{m·s}^{-2}\) : un passager ne sent pas la rotation.</li>
      <li>Pour l'étude de la nacelle, le principe fondamental appliqué au centre de masse suffit (chapitre « Principes de la dynamique », §4) : en translation, le solide se comporte comme un point.</li>
    </ol>
  </div>

</div>

<div class="course-section">
  <div class="sec-num">§2 · ROTATION AUTOUR D'UN AXE FIXE</div>
  <h2>Un seul paramètre : l'angle</h2>
  <div class="intro">Le second mouvement simple du programme est la rotation autour d'un axe fixe, celle d'une roue de vélo vue du cadre, d'une porte, d'un rotor de moteur. Un seul angle suffit à décrire la position de tout le solide.</div>
  <div class="prop-box">
    <strong>Cinématique de la rotation.</strong> Un solide tourne autour de l'axe fixe \(\Delta\) si ses points situés sur \(\Delta\) restent immobiles. Alors :
    <ul>
      <li>chaque point \(M\) décrit un <strong>cercle</strong> centré sur l'axe, dans un plan perpendiculaire à l'axe, de rayon \(r\) égal à sa distance à l'axe ;</li>
      <li>tous les points tournent du <strong>même angle</strong> \(\theta(t)\) : le solide a une seule <strong>vitesse angulaire</strong> \(\omega=\dot\theta\) (en \(\text{rad·s}^{-1}\)) ;</li>
      <li>la vitesse de \(M\) est orthoradiale (tangente au cercle), de valeur proportionnelle à la distance à l'axe :</li>
    </ul>
    <div class="formula" data-nom="Vitesse d'un point d'un solide en rotation">$$\vec v(M)=r\,\omega\,\vec e_\theta\qquad v=r\,|\omega|$$</div>
    Son accélération est celle du mouvement circulaire, \(-r\omega^2\,\vec e_r+r\dot\omega\,\vec e_\theta\) (chapitre « Cinématique du point », §7).
  </div>
  <div class="method-box"><strong>Exemple — disque dur</strong>
    <p>Le plateau d'un disque dur tourne à 7 200 tours par minute ; son bord est à 4,6 cm de l'axe.</p>
    <ol>
      <li>\(\omega=7\,200\times2\pi/60\approx754\ \text{rad·s}^{-1}\).</li>
      <li>Au bord : \(v=r\omega\approx35\ \text{m·s}^{-1}\) (125 km/h) ; à mi-rayon, la moitié.</li>
      <li>Accélération centripète au bord : \(r\omega^2\approx2{,}6\times10^4\ \text{m·s}^{-2}\), près de 2 700 fois \(g\) : le plateau doit être très rigide et parfaitement équilibré.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : utiliser des tours par minute ou des degrés dans \(v=r\omega\). La relation n'est vraie qu'avec \(\omega\) en \(\text{rad·s}^{-1}\) : \(1\ \text{tr/min}=2\pi/60\approx0{,}105\ \text{rad·s}^{-1}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MOMENT CINÉTIQUE D'UN SOLIDE, MOMENT D'INERTIE</div>
  <h2>La masse ne suffit plus : sa répartition compte</h2>
  <div class="intro">Pour mettre en rotation un solide, ce n'est pas seulement sa masse qui compte, mais la distance de cette masse à l'axe. Le moment d'inertie mesure cette répartition ; il joue pour la rotation le rôle de la masse pour la translation.</div>
  <div class="prop-box">
    <strong>Moment cinétique scalaire d'un solide.</strong> Un solide en rotation à la vitesse angulaire \(\omega\) autour de l'axe fixe \(\Delta\) est un système de points qui tournent tous à la même vitesse angulaire (chapitre « Moment cinétique », §3) :
    <div class="formula" data-nom="Moment cinétique d'un solide en rotation">$$L_\Delta=J_\Delta\,\omega\qquad J_\Delta=\sum_im_ir_i^2$$</div>
    \(J_\Delta\), en \(\text{kg·m}^2\), est le <strong>moment d'inertie</strong> du solide par rapport à \(\Delta\) (pour un solide continu, la somme devient \(\int r^2\,\mathrm dm\)). Il dépend de la masse, de sa répartition et de l'axe ; il est toujours positif.
  </div>
  <div class="prop-box">
    <strong>Répartition des masses.</strong> Chaque élément compte avec le <strong>carré</strong> de sa distance à l'axe : à masse égale, un solide dont la masse est loin de l'axe a un moment d'inertie plus grand. On écrit parfois \(J=mk^2\), où \(k\), le rayon de giration, est la distance à laquelle il faudrait concentrer toute la masse pour obtenir le même \(J\).
  </div>
  <table>
    <tr><th>Solide homogène de masse \(m\)</th><th>Axe</th><th>\(J_\Delta\)</th></tr>
    <tr><td>anneau ou cylindre creux à paroi mince, rayon \(R\)</td><td>son axe de symétrie</td><td>\(mR^2\)</td></tr>
    <tr><td>disque ou cylindre plein, rayon \(R\)</td><td>son axe de symétrie</td><td>\(\tfrac12mR^2\)</td></tr>
    <tr><td>sphère pleine, rayon \(R\)</td><td>un diamètre</td><td>\(\tfrac25mR^2\)</td></tr>
    <tr><td>sphère creuse à paroi mince, rayon \(R\)</td><td>un diamètre</td><td>\(\tfrac23mR^2\)</td></tr>
    <tr><td>tige mince de longueur \(L\)</td><td>perpendiculaire, par son milieu</td><td>\(\tfrac1{12}mL^2\)</td></tr>
    <tr><td>tige mince de longueur \(L\)</td><td>perpendiculaire, par une extrémité</td><td>\(\tfrac13mL^2\)</td></tr>
  </table>
  <p>En physique, ces valeurs sont <strong>fournies</strong> par l'énoncé ; il faut savoir les exploiter et les comparer, pas les calculer.</p>
  <div class="method-box"><strong>Exemple — anneau ou disque ?</strong>
    <p>Un anneau et un disque ont la même masse, 2,0 kg, et le même rayon, 0,30 m. Ils tournent autour de leur axe à \(10\ \text{rad·s}^{-1}\).</p>
    <ol>
      <li>\(J_{\text{anneau}}=mR^2=0{,}18\ \text{kg·m}^2\) : toute la masse est à la distance \(R\). \(J_{\text{disque}}=\tfrac12mR^2=0{,}090\ \text{kg·m}^2\) : une partie de la masse est près de l'axe.</li>
      <li>Moments cinétiques : 1,8 et \(0{,}90\ \text{kg·m}^2\text{·s}^{-1}\). Pour lancer l'anneau à la même vitesse, il faut deux fois plus de « quantité de rotation » : c'est pourquoi les volants d'inertie ont leur masse en périphérie.</li>
      <li>La Terre : \(J\approx0{,}33\,M_TR_T^2\approx8{,}0\times10^{37}\ \text{kg·m}^2\), moins que les \(0{,}40\,M_TR_T^2\) d'une sphère homogène : sa masse est concentrée vers le centre (noyau de fer, dense).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que le moment d'inertie est une propriété du solide seul. Il dépend de l'axe : la même tige a un moment d'inertie quatre fois plus grand autour d'une extrémité qu'autour de son milieu.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ACTIONS SUR UN SOLIDE EN ROTATION : POIDS, COUPLE, LIAISON PIVOT</div>
  <h2>Ce qui fait tourner, ce qui freine, ce qui guide</h2>
  <div class="intro">Pour appliquer le théorème du moment cinétique, il faut le moment de chaque action par rapport à l'axe. Trois actions reviennent sans cesse : le poids, les couples, et l'action de la liaison qui guide la rotation.</div>
  <div class="prop-box">
    <strong>Moment du poids.</strong> Par rapport à un axe horizontal, le moment du poids d'un solide est celui d'une force \(m\vec g\) appliquée en son centre de masse \(G\). Si \(G\) est à la distance \(d\) de l'axe et que \(\theta\) est l'angle entre \(OG\) et la verticale descendante : \(\mathcal M_\Delta(\vec P)=-mgd\sin\theta\). Il est nul si l'axe passe par \(G\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Le poids agit « en G »</span><div class="content">
    <p>Axe \(Oz\) horizontal, \(\vec e_x\) horizontal et \(\vec e_y\) vertical ascendant. Le poids de l'élément \(m_i\), \(-m_ig\,\vec e_y\), a pour moment \(-m_ig\,x_i\) par rapport à \(Oz\) (bras de levier \(|x_i|\)). En sommant : \(-g\sum m_ix_i=-mg\,x_G\), par définition du centre de masse. C'est le moment d'une force \(-mg\,\vec e_y\) appliquée en \(G\) ; avec \(x_G=d\sin\theta\), on obtient \(-mgd\sin\theta\).</p>
  </div></div>
  <div class="def-box">
    <strong>Couple.</strong> Un <strong>couple</strong> est une action mécanique de résultante nulle mais de moment non nul ; son moment, noté \(\Gamma\), est le même par rapport à tous les axes parallèles (chapitre « Moment cinétique », §5). Exemples : le couple moteur d'un moteur électrique (\(\Gamma\) de 1 à 100 N·m pour un moteur de quelques kilowatts), le couple de rappel d'un fil de torsion \(\Gamma=-K\theta\), le couple exercé par deux mains sur un volant.
  </div>
  <div class="def-box">
    <strong>Liaison pivot.</strong> Une liaison pivot entre deux solides n'autorise qu'une rotation autour d'un axe (gonds d'une porte, roulements d'une roue, axe d'un pendule). Elle exerce sur le solide une action de contact dont la résultante est en général <strong>non nulle</strong> (elle porte le solide). Elle est dite <strong>parfaite</strong> si le moment de cette action par rapport à l'axe est <strong>nul</strong> : elle guide la rotation sans la freiner.
  </div>

<figcaption>Coupe d'une liaison pivot : l'arbre (au centre, axe \(\Delta\) vers le lecteur) tourne dans un coussinet. Sans frottement (à gauche), chaque force de contact est normale à la surface cylindrique, donc radiale : sa droite d'action rencontre l'axe, et son moment par rapport à \(\Delta\) est nul. Avec frottement (à droite), les forces s'inclinent dans le sens opposé au glissement : leur moment total est un couple résistant \(\Gamma_f\), de signe opposé à \(\omega\).</figcaption>
</figure>
  <div class="prop-box">
    <strong>Justifier le moment d'un pivot.</strong> Sans frottement, chaque force de contact entre l'arbre et son logement est normale à leur surface cylindrique commune, donc radiale : sa droite d'action rencontre l'axe et son moment est nul. Avec frottement, des composantes tangentielles apparaissent, opposées au glissement : leur moment est un <strong>couple résistant</strong> \(\Gamma_f\), de signe opposé à \(\omega\). On le modélise par un couple constant en valeur absolue (frottement solide) ou par \(\Gamma_f=-\lambda\,\omega\) (frottement visqueux, \(\lambda\) en \(\text{N·m·s}\)).
  </div>
  <div class="method-box"><strong>Exemple — bilan des moments sur une poulie</strong>
    <p>Une poulie de rayon \(R=0{,}10\ \text{m}\), montée sur un pivot d'axe horizontal passant par son centre, est entraînée par un fil tendu à \(T=20\ \text{N}\) qui s'en déroule tangentiellement ; le pivot exerce un couple de frottement de \(0{,}30\ \text{N·m}\).</p>
    <ol>
      <li>Poids : l'axe passe par le centre de masse, moment nul.</li>
      <li>Tension : tangente à la poulie, sa droite d'action est à la distance \(R\) de l'axe : moment \(+TR=2{,}0\ \text{N·m}\) (sens positif choisi dans le sens où le fil fait tourner).</li>
      <li>Pivot : moment \(-0{,}30\ \text{N·m}\) (opposé à la rotation). Total : \(1{,}7\ \text{N·m}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier l'action du pivot dans le principe fondamental. Son moment par rapport à l'axe est nul (pivot parfait), mais sa résultante ne l'est pas : c'est elle qui empêche le solide de tomber.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LE THÉORÈME SCALAIRE DU MOMENT CINÉTIQUE</div>
  <h2>L'équation du mouvement de rotation</h2>
  <div class="intro">Le théorème du moment cinétique, projeté sur l'axe fixe et appliqué au solide, donne directement l'équation de son mouvement. C'est l'équivalent, pour la rotation, du principe fondamental pour la translation.</div>
  <div class="prop-box">
    <strong>Théorème scalaire du moment cinétique.</strong> Pour un solide en rotation autour d'un axe \(\Delta\) fixe dans un référentiel galiléen, \(J_\Delta\) étant constant :
    <div class="formula" data-nom="Théorème scalaire du moment cinétique (solide)">$$J_\Delta\,\frac{\mathrm d\omega}{\mathrm dt}=J_\Delta\,\ddot\theta=\sum\mathcal M_\Delta(\text{actions extérieures})$$</div>
    Seules les actions extérieures comptent : les moments des forces intérieures se compensent (chapitre « Moment cinétique », §6).
  </div>
  <div class="method-box"><strong>Exemple — mise en rotation et arrêt d'une meule</strong>
    <p>Une meule (\(J=0{,}10\ \text{kg·m}^2\)) est entraînée par un moteur de couple \(\Gamma_m=2{,}0\ \text{N·m}\) ; le frottement au pivot exerce un couple résistant de \(0{,}40\ \text{N·m}\), supposé constant.</p>
    <ol>
      <li>Démarrage : \(J\dot\omega=2{,}0-0{,}40\), \(\dot\omega=16\ \text{rad·s}^{-2}\). La vitesse de 3 000 tr/min (\(314\ \text{rad·s}^{-1}\)) est atteinte en \(314/16\approx20\ \text{s}\).</li>
      <li>Moteur coupé : \(J\dot\omega=-0{,}40\), \(\dot\omega=-4{,}0\ \text{rad·s}^{-2}\). La meule s'arrête en \(314/4{,}0\approx79\ \text{s}\), après \(\omega^2/(2|\dot\omega|)\approx1{,}2\times10^4\ \text{rad}\), soit près de 2 000 tours.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — treuil : deux systèmes reliés par un fil</strong>
    <p>Un tambour (\(J=0{,}040\ \text{kg·m}^2\), rayon \(R=0{,}10\ \text{m}\), pivot parfait) porte un fil enroulé auquel pend une charge de masse \(M=5{,}0\ \text{kg}\), lâchée sans vitesse.</p>
    <ol>
      <li>Tambour (théorème du moment cinétique) : \(J\dot\omega=TR\), \(T\) tension du fil.</li>
      <li>Charge (principe fondamental, axe descendant) : \(Ma=Mg-T\).</li>
      <li>Fil inextensible qui ne glisse pas : \(a=R\dot\omega\). En éliminant \(T\) et \(\dot\omega\) : \(a=\dfrac{Mg}{M+J/R^2}=\dfrac{5{,}0\times9{,}81}{5{,}0+4{,}0}\approx5{,}5\ \text{m·s}^{-2}\), et \(T=M(g-a)\approx22\ \text{N}\).</li>
      <li>Contrôle : si \(J\to0\), \(a\to g\) (chute libre) ; le tambour se comporte comme une masse supplémentaire \(J/R^2=4{,}0\ \text{kg}\) à entraîner.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(T=Mg\) pour la tension du fil d'une charge qui accélère. La tension n'égale le poids qu'à l'équilibre ou à vitesse constante ; ici, elle n'en vaut que 44 %.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LE PENDULE PESANT</div>
  <h2>Un solide qui oscille autour d'un axe horizontal</h2>
  <div class="intro">Balancier d'horloge, porte de garage basculante, jambe qui marche, cloche : tout solide mobile autour d'un axe horizontal qui ne passe pas par son centre de masse oscille. C'est le pendule pesant, version « solide » du pendule simple.</div>

  <div class="prop-box">
    <strong>Équation du mouvement.</strong> Un solide de masse \(m\), de moment d'inertie \(J\) par rapport à l'axe horizontal \(\Delta\) (pivot parfait), a son centre de masse à la distance \(d\) de l'axe ; \(\theta\) est l'angle entre \(OG\) et la verticale descendante. Si l'on néglige l'air, le théorème scalaire du moment cinétique donne
    <div class="formula" data-nom="Équation du pendule pesant">$$J\,\ddot\theta=-mgd\sin\theta\qquad\text{soit}\qquad\ddot\theta+\omega_0^2\sin\theta=0,\quad\omega_0=\sqrt{\frac{mgd}{J}}$$</div>
  </div>
  <div class="prop-box">
    <strong>Petites oscillations.</strong> Pour \(|\theta|\ll1\ \text{rad}\), \(\sin\theta\approx\theta\) : oscillateur harmonique de période
    <div class="formula" data-nom="Période du pendule pesant">$$T_0=2\pi\sqrt{\frac{J}{mgd}}$$</div>
    Le pendule simple de longueur \(\ell_{\text{eq}}=\dfrac{J}{md}\) a la même période (pour le pendule simple, \(J=m\ell^2\) et \(d=\ell\)).
  </div>
  <div class="prop-box">
    <strong>Intégrale première.</strong> En multipliant l'équation par \(\dot\theta\), on reconnaît une dérivée : \(\dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12J\dot\theta^2-mgd\cos\theta\right)=0\). Donc
    <div class="formula" data-nom="Intégrale première du pendule pesant">$$\frac12J\dot\theta^2-mgd\cos\theta=\text{constante}$$</div>
    C'est la conservation de l'énergie mécanique (§9) : énergie cinétique de rotation et énergie potentielle de pesanteur \(-mgd\cos\theta\) (altitude de \(G\) : \(-d\cos\theta\)). Elle relie directement la vitesse angulaire à la position, sans résoudre l'équation.
  </div>
  <div class="method-box"><strong>Exemple — tige tenue par une extrémité</strong>
    <p>Une tige homogène de longueur \(L=1{,}0\ \text{m}\) oscille autour d'un axe horizontal passant par une extrémité. On donne \(J=\tfrac13mL^2\) ; \(d=L/2\).</p>
    <ol>
      <li>\(\omega_0^2=\dfrac{mgL/2}{mL^2/3}=\dfrac{3g}{2L}\) : \(\omega_0\approx3{,}84\ \text{rad·s}^{-1}\), \(T_0=2\pi\sqrt{2L/(3g)}\approx1{,}64\ \text{s}\). La masse ne joue aucun rôle.</li>
      <li>Longueur du pendule simple synchrone : \(\ell_{\text{eq}}=J/(md)=2L/3\approx0{,}67\ \text{m}\). Une tige oscille plus vite qu'une masse ponctuelle placée à son extrémité.</li>
      <li>Lâchée à l'horizontale (\(\theta_0=90^\circ\)) : l'intégrale première entre \(\theta=90^\circ\) et \(\theta=0\) donne \(\tfrac12J\dot\theta^2=mgd\), soit \(|\dot\theta|=\sqrt{3g/L}\approx5{,}4\ \text{rad·s}^{-1}\) au passage à la verticale ; l'extrémité va alors à \(5{,}4\ \text{m·s}^{-1}\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — cerceau suspendu à un clou</strong>
    <p>Un cerceau de rayon \(R=0{,}20\ \text{m}\) est suspendu à un clou en un point de sa circonférence. Son moment d'inertie par rapport à cet axe est \(J=2mR^2\) (fourni) ; \(d=R\).</p>
    <ol>
      <li>\(T_0=2\pi\sqrt{\dfrac{2mR^2}{mgR}}=2\pi\sqrt{\dfrac{2R}{g}}\approx1{,}27\ \text{s}\).</li>
      <li>\(\ell_{\text{eq}}=2R=0{,}40\ \text{m}\) : le cerceau oscille comme un pendule simple de la longueur de son diamètre.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : utiliser la période du pendule simple \(2\pi\sqrt{\ell/g}\) avec \(\ell=d\) pour un solide. La période dépend de \(J\) : une tige de 1 m n'a pas la période d'un pendule simple de 50 cm (1,42 s) mais de 67 cm (1,64 s).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · GRANDES OSCILLATIONS : LE NON-ISOCHRONISME</div>
  <h2>La période dépend de l'amplitude</h2>
  <div class="intro">Hors des petits angles, l'équation \(\ddot\theta+\omega_0^2\sin\theta=0\) n'est plus linéaire et l'on ne sait pas l'intégrer avec les fonctions usuelles. Une simulation numérique montre que les oscillations ne sont plus isochrones : leur période dépend de l'amplitude. C'est une capacité numérique du programme.</div>
  <p>On résout le système d'ordre 1 vérifié par le vecteur d'état \((\theta,\omega)\) avec la fonction <span class="code-inline">odeint</span> de <span class="code-inline">scipy.integrate</span> (ou avec la fonction <span class="code-inline">euler_ordre2</span> du chapitre « Méthodes numériques », §7, qui traite le pendule simple de la même façon). Les temps sont mesurés en unités de \(1/\omega_0\), ce qui rend le programme valable pour tout pendule pesant ; on obtient la période en repérant le premier passage par la verticale, au quart de la période.</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">from</span> scipy.integrate <span class="kw">import</span> odeint

w0 = 1.0                      <span class="cmt"># pulsation des petites oscillations : temps en unités de 1/w0</span>

<span class="kw">def</span> F(Y, t):                  <span class="cmt"># attention : odeint impose l'ordre (Y, t)</span>
    theta, omega = Y
    <span class="kw">return</span> [omega, -w0**2 * np.sin(theta)]

<span class="kw">def</span> periode(theta0):
    <span class="str">"""Période du pendule lâché sans vitesse depuis theta0 (en radians) :</span>
<span class="str">    quatre fois la date du premier passage par la verticale."""</span>
    t = np.linspace(0, 20, 200001)                   <span class="cmt"># 200 000 pas de 1e-4</span>
    theta = odeint(F, [theta0, 0.0], t, rtol=1e-10, atol=1e-10)[:, 0]
    k = np.argmax(theta &lt;= 0)                        <span class="cmt"># premier indice où theta &lt;= 0</span>
    tq = t[k-1] + (t[k] - t[k-1]) * theta[k-1] / (theta[k-1] - theta[k])
    <span class="kw">return</span> 4 * tq                                    <span class="cmt"># interpolation linéaire</span>

T0 = 2 * np.pi / w0
<span class="kw">for</span> deg <span class="kw">in</span> [10, 30, 60, 90, 120, 150, 170]:
    print(deg, round(periode(np.radians(deg)) / T0, 4))</pre>

    <tr><th>\(T/T_0\) (programme)</th><td>1,0019</td><td>1,0174</td><td>1,0732</td><td>1,1803</td><td>1,3729</td><td>1,7622</td><td>2,4394</td></tr>
    <tr><th>Borda \(1+\theta_0^2/16\)</th><td>1,0019</td><td>1,0171</td><td>1,0685</td><td>1,1542</td><td>1,2742</td><td>1,4284</td><td>1,5502</td></tr>
  </table>

<figcaption>Pendule pesant lâché sans vitesse (simulation par <span class="code-inline">odeint</span>). À gauche, \(\theta/\theta_0\) en fonction de \(t/T_0\), où \(T_0=2\pi\sqrt{J/(mgd)}\) est la période des petites oscillations : pour 20°, la courbe est une sinusoïde de période \(T_0\) ; pour 90° et 160°, l'oscillation est plus lente et ses sommets s'aplatissent. À droite, période \(T\) en fonction de l'amplitude \(\theta_0\) : valeurs calculées par le programme du §7 (points), courbe exacte, et formule de Borda \(1+\theta_0^2/16\) (tirets), excellente jusqu'à 40° environ.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Non-isochronisme.</strong> La période <strong>augmente</strong> avec l'amplitude : de 0,2 % à 10°, 7 % à 60°, 18 % à 90°. Elle tend vers l'infini quand l'amplitude approche 180° (équilibre instable, pendule à la verticale au-dessus de l'axe). Pour les amplitudes modérées, la formule de Borda \(T\approx T_0\left(1+\theta_0^2/16\right)\) (\(\theta_0\) en radians, admise) suffit : elle sert à corriger une mesure de \(g\) au pendule (chapitre « Mesures et incertitudes », exercice 08).
  </div>
  <div class="method-box"><strong>Exemple — pourquoi une horloge doit garder une amplitude constante</strong>
    <ol>
      <li>Si l'amplitude du balancier passe de 5° à 10°, la période augmente, d'après la simulation (ou Borda), de \(\dfrac{(10^2-5^2)\,(\pi/180)^2}{16}\approx1{,}4\times10^{-3}\) en valeur relative.</li>
      <li>Sur une journée : \(1{,}4\times10^{-3}\times86\,400\approx120\ \text{s}\). L'horloge retarde de deux minutes par jour.</li>
      <li>C'est pourquoi l'échappement d'une horloge entretient une amplitude aussi constante que possible, et faible.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : valider une simulation de pendule sans contrôle. On vérifie qu'aux petits angles elle redonne \(T_0\) (première colonne), et que l'énergie mécanique reste constante en l'absence de frottement. Avec la méthode d'Euler, il faut un pas très petit : elle fait gagner de l'énergie à un oscillateur à chaque période (chapitre « Méthodes numériques », §7).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ÉNERGIE CINÉTIQUE ET THÉORÈME DE L'ÉNERGIE CINÉTIQUE</div>
  <h2>L'approche énergétique de la rotation</h2>
  <div class="intro">Comme pour un point, l'énergie donne souvent une vitesse plus vite que l'équation du mouvement. Pour un solide en rotation, l'énergie cinétique et la puissance des forces s'écrivent avec la vitesse angulaire.</div>
  <div class="prop-box">
    <strong>Énergie cinétique d'un solide en rotation.</strong> Chaque point a la vitesse \(r_i\omega\) :
    <div class="formula" data-nom="Énergie cinétique d'un solide en rotation">$$E_c=\sum_i\tfrac12m_ir_i^2\omega^2=\tfrac12J_\Delta\,\omega^2$$</div>
  </div>
  <div class="prop-box">
    <strong>Puissance d'une action sur un solide en rotation.</strong> Une force appliquée en un point du solide, à la distance \(r\) de l'axe, a pour puissance \(\vec F\cdot\vec v=F_\theta\,r\omega\), c'est-à-dire
    <div class="formula" data-nom="Puissance d'une action sur un solide en rotation">$$\mathcal P=\mathcal M_\Delta\,\omega\qquad\text{(couple : }\mathcal P=\Gamma\,\omega\text{)}$$</div>
    Un pivot parfait a une puissance nulle ; un couple résistant \(-\lambda\omega\) a la puissance \(-\lambda\omega^2\le0\).
  </div>
  <div class="prop-box">
    <strong>Théorème de l'énergie cinétique pour un solide.</strong> Dans un référentiel galiléen, \(\dfrac{\mathrm dE_c}{\mathrm dt}=\sum\mathcal P_{\text{ext}}\), car les forces intérieures d'un solide ont une puissance totale nulle (§10). Pour un solide en rotation autour d'un axe fixe, il est <strong>équivalent</strong> au théorème scalaire du moment cinétique.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Équivalence des deux théorèmes</span><div class="content">
    <p>\(\dfrac{\mathrm dE_c}{\mathrm dt}=\dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12J\omega^2\right)=J\omega\dot\omega\) et \(\sum\mathcal P_{\text{ext}}=\left(\sum\mathcal M_\Delta\right)\omega\). L'égalité \(J\omega\dot\omega=\left(\sum\mathcal M_\Delta\right)\omega\) équivaut, quand \(\omega\ne0\), à \(J\dot\omega=\sum\mathcal M_\Delta\). Pour un solide en rotation autour d'un axe fixe (un seul degré de liberté), les deux théorèmes donnent donc la même équation ; on choisit le plus commode.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — couple d'un moteur, énergie d'un volant</strong>
    <ol>
      <li>Un moteur de 1,5 kW tourne à 1 450 tr/min (\(\omega\approx152\ \text{rad·s}^{-1}\)) : son couple vaut \(\Gamma=\mathcal P/\omega\approx9{,}9\ \text{N·m}\).</li>
      <li>Un volant de stockage d'énergie (disque de 100 kg, rayon 0,30 m, \(J=\tfrac12mR^2=4{,}5\ \text{kg·m}^2\)) tourne à 10 000 tr/min : \(E_c=\tfrac12J\omega^2\approx2{,}5\times10^6\ \text{J}\), soit 0,69 kWh, avec une vitesse de 310 m/s en périphérie.</li>
      <li>Treuil du §5 par l'énergie : la charge descend de \(h\) ; \(\tfrac12Mv^2+\tfrac12J(v/R)^2=Mgh\), donc \(v^2=2\,\dfrac{Mg}{M+J/R^2}\,h\) : mouvement uniformément accéléré, avec la même accélération qu'au §5.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ÉTUDE ÉNERGÉTIQUE DU PENDULE PESANT</div>
  <h2>Conservation, puis diminution de l'énergie mécanique</h2>
  <div class="intro">Un pendule réel finit toujours par s'arrêter. Le bilan d'énergie dit pourquoi : l'énergie mécanique, constante pour un pivot parfait, décroît dès qu'un frottement agit. Le programme demande de mettre en évidence cette diminution.</div>
  <div class="prop-box">
    <strong>Énergie mécanique du pendule pesant.</strong> Avec l'origine de l'énergie potentielle à la position d'équilibre (\(G\) au plus bas) :
    <div class="formula" data-nom="Énergie mécanique du pendule pesant">$$E_m=\tfrac12J\dot\theta^2+mgd\,(1-\cos\theta)$$</div>
    Pivot parfait et air négligé : les seules actions qui travaillent sont le poids (conservatif) et l'action du pivot (puissance nulle) ; \(E_m\) est constante, c'est l'intégrale première du §6.
  </div>
  <div class="prop-box">
    <strong>Avec frottement.</strong> Si le pivot exerce un couple de frottement visqueux \(-\lambda\dot\theta\) (ou si l'air freine de façon analogue), le théorème de l'énergie cinétique donne
    <div class="formula" data-nom="Diminution de l'énergie mécanique du pendule pesant">$$\frac{\mathrm dE_m}{\mathrm dt}=-\lambda\,\dot\theta^2\le0$$</div>
    L'énergie mécanique décroît, d'autant plus vite que le pendule va vite ; elle est convertie en énergie thermique au pivot. Pour les petites oscillations, l'amplitude décroît comme \(e^{-t/\tau}\) avec \(\tau=2J/\lambda=2Q/\omega_0\), où \(Q=J\omega_0/\lambda\) est le facteur de qualité (chapitre « Oscillateurs harmoniques », §6).
  </div>

  <p>La figure est obtenue en ajoutant le terme de frottement à la fonction du §7 et en calculant l'énergie mécanique (divisée par \(J\)) en chaque instant :</p>
  <pre class="codeblock">w0, Q = 3.84, 20               <span class="cmt"># tige de 1 m tenue par une extrémité (rad/s)</span>
k = w0 / Q                       <span class="cmt"># lambda / J (s^-1)</span>

<span class="kw">def</span> F_amorti(Y, t):
    theta, omega = Y
    <span class="kw">return</span> [omega, -w0**2 * np.sin(theta) - k * omega]

t = np.linspace(0, 16, 16001)
theta, omega = odeint(F_amorti, [np.radians(60), 0.0], t).T
Em = 0.5 * omega**2 + w0**2 * (1 - np.cos(theta))   <span class="cmt"># énergie mécanique / J</span>
print(Em[0], Em[-1] / Em[0])                        <span class="cmt"># valeur initiale, fraction restante</span>
print(np.all(np.diff(Em) &lt;= 1e-9))                  <span class="cmt"># Em ne fait que décroître</span></pre>
  <div class="method-box"><strong>Exemple — résultats de la simulation et mesure du frottement</strong>
    <ol>
      <li>Le programme affiche une énergie qui ne fait que décroître : il en reste 72 % après une période, 21 % après cinq, 5 % au bout de 16 s. Les amplitudes successives valent 60°, 50°, 43°, 36°, 31°… : chacune est environ 0,85 fois la précédente, comme le prévoit \(e^{-\pi/Q}\).</li>
      <li>En sens inverse, on mesure \(Q\) sur un pendule réel. Si l'amplitude est divisée par 2 en 12 oscillations, alors \(12\,T_0=\tau\ln2\), d'où \(Q=\dfrac{\omega_0\tau}2=\dfrac{12\pi}{\ln2}\approx54\). L'énergie, proportionnelle au carré de l'amplitude, a été divisée par 4 pendant ces 12 oscillations.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que l'énergie mécanique décroît de la même quantité à chaque instant. Elle diminue surtout au passage par la verticale, où la vitesse est maximale, et presque pas aux points de rebroussement (\(\dot\theta=0\)) : d'où les paliers de la figure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · SYSTÈME DÉFORMABLE : LE RÔLE DES FORCES INTÉRIEURES</div>
  <h2>Le tabouret d'inertie</h2>
  <div class="intro">Pour un solide, les forces intérieures ne travaillent pas : c'est ce qui rend le théorème de l'énergie cinétique si simple. Pour un système qui se déforme, elles peuvent fournir de l'énergie (muscles, ressort qui se détend) ou en dissiper (frottements entre pièces). Le tabouret d'inertie en est l'expérience classique.</div>
  <div class="prop-box">
    <strong>Théorème de l'énergie cinétique pour un système.</strong> Dans un référentiel galiléen, pour un système quelconque :
    <div class="formula" data-nom="Théorème de l'énergie cinétique (système déformable)">$$\frac{\mathrm dE_c}{\mathrm dt}=\mathcal P_{\text{ext}}+\mathcal P_{\text{int}}$$</div>
    Pour un <strong>solide</strong>, \(\mathcal P_{\text{int}}=0\) ; pour un système <strong>déformable</strong>, \(\mathcal P_{\text{int}}\ne0\) en général, alors que les forces intérieures ne changent ni \(\vec p\) ni le moment cinétique.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Les forces intérieures d'un solide ne travaillent pas</span><div class="content">
    <p>Pour deux points \(M_1\), \(M_2\) en interaction :</p>
    <div class="formula">$$\mathcal P_{\text{int}}=\vec F_{2\to1}\cdot\vec v_1+\vec F_{1\to2}\cdot\vec v_2=\vec F_{1\to2}\cdot(\vec v_2-\vec v_1)$$</div>
    <p>Si la distance \(M_1M_2\) est constante, la dérivée de \(\overrightarrow{M_1M_2}^{\,2}\) est nulle : \(\overrightarrow{M_1M_2}\cdot(\vec v_2-\vec v_1)=0\). Comme \(\vec F_{1\to2}\) est portée par \((M_1M_2)\) (troisième loi), \(\mathcal P_{\text{int}}=0\). Pour un système déformable, \(\vec v_2-\vec v_1\) a une composante le long de \((M_1M_2)\) et la puissance ne s'annule plus.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — le tabouret d'inertie</strong>
    <p>Une personne est assise sur un tabouret tournant (pivot parfait d'axe vertical), des haltères dans les mains, bras tendus : le système {personne, haltères, partie mobile du tabouret} a un moment d'inertie \(J_1=5{,}0\ \text{kg·m}^2\) et tourne à \(\omega_1=3{,}0\ \text{rad·s}^{-1}\). Elle ramène les haltères contre sa poitrine : \(J_2=2{,}0\ \text{kg·m}^2\).</p>
    <ol>
      <li>Actions extérieures : poids (verticaux, parallèles à l'axe) et action du pivot parfait : moment total nul par rapport à l'axe. Le moment cinétique \(J\omega\) du système est conservé, même s'il se déforme.</li>
      <li>\(\omega_2=J_1\omega_1/J_2=7{,}5\ \text{rad·s}^{-1}\) : elle tourne 2,5 fois plus vite.</li>
      <li>\(E_c=\dfrac{L_\Delta^2}{2J}\) passe de 22,5 J à 56,3 J. Les actions extérieures ne travaillent pas : les 33,8 J viennent du travail des forces intérieures, c'est-à-dire des muscles qui tirent les haltères vers l'axe contre leur tendance à s'éloigner.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — embrayage : les forces intérieures dissipent</strong>
    <p>Un disque (\(J_1=0{,}20\ \text{kg·m}^2\)) tourne à \(100\ \text{rad·s}^{-1}\) ; on le plaque contre un second disque immobile, de même axe (\(J_2=0{,}30\ \text{kg·m}^2\)). Ils finissent par tourner ensemble.</p>
    <ol>
      <li>Les forces de frottement entre disques sont intérieures au système {deux disques} : le moment cinétique est conservé, \(J_1\omega_1=(J_1+J_2)\,\omega\), d'où \(\omega=40\ \text{rad·s}^{-1}\).</li>
      <li>\(E_c\) passe de 1 000 J à 400 J : les forces intérieures ont un travail négatif, \(-600\ \text{J}\), dissipé en chaleur dans les garnitures.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure de la conservation du moment cinétique à celle de l'énergie cinétique (ou l'inverse). Le tabouret et l'embrayage conservent \(L_\Delta\) et changent \(E_c\), dans un sens ou dans l'autre ; seul le bilan des puissances intérieures tranche.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce qui dépasse la PTSI en physique</h2>
  <div class="notice"><strong>Hors programme en PTSI (pour aller plus loin).</strong> Ces résultats ne sont pas exigibles en physique ; ils sont étudiés en sciences industrielles en 2ᵉ année (chapitres « Dynamique du solide » et « Cinétique et dynamique du solide (3D) »).</div>
  <h3>Théorème de Huygens-Steiner</h3>
  <p>Si \(J_G\) est le moment d'inertie par rapport à un axe passant par le centre de masse \(G\), le moment d'inertie par rapport à un axe parallèle, à la distance \(a\), vaut \(J=J_G+ma^2\). Il est donc minimal pour l'axe qui passe par \(G\). Exemple : tige autour d'une extrémité, \(\tfrac1{12}mL^2+m(L/2)^2=\tfrac13mL^2\), la valeur du tableau du §3.</p>
  <h3>Translation et rotation à la fois</h3>
  <p>Une roue qui roule, un ballon qui tourne en volant ont un mouvement qui combine la translation de leur centre de masse et une rotation autour d'un axe passant par lui. Leur énergie cinétique vaut \(\tfrac12mv_G^2+\tfrac12J_G\omega^2\) ; pour un cylindre qui roule sans glisser sur une pente, cela ralentit la descente par rapport à un glissement sans frottement. Le programme de PTSI exclut cette étude générale, ainsi que la rotation autour d'un axe qui se déplace.</p>
  <h3>Gyroscope</h3>
  <p>Un solide qui tourne vite autour d'un axe mobile (toupie, roue de vélo tenue à la main) précesse au lieu de tomber : voir le chapitre « Moment cinétique », « Pour aller plus loin ».</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · SOLIDE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 2.7 du programme : reconnaître une translation ou une rotation, exprimer la vitesse d'un point d'un solide en rotation, exploiter \(L_\Delta=J_\Delta\omega\) avec un moment d'inertie fourni, faire le bilan des moments (poids, couple, pivot), appliquer le théorème scalaire du moment cinétique, étudier le pendule pesant (équation, intégrale première, simulation, énergie) et conduire le bilan d'un système déformable. Le moment cinétique d'un point et le bras de levier sont dans le chapitre « Moment cinétique ».</div>

  <div class="method-box"><strong>Méthode 1 — Reconnaître une translation ou une rotation</strong>
    <ol>
      <li><span class="step">Solide ?</span> Vérifier que les distances entre points restent constantes ; sinon, le système est déformable (méthode 10).</li>
      <li><span class="step">Translation.</span> Un segment du solide garde-t-il une direction fixe ? Alors tous les points ont la même vitesse : translation rectiligne (trajectoires droites) ou circulaire (cercles de même rayon, de centres différents).</li>
      <li><span class="step">Rotation.</span> Une droite du solide reste-t-elle immobile ? C'est l'axe fixe : chaque point décrit un cercle centré sur l'axe.</li>
      <li><span class="step">Sinon.</span> Le mouvement combine les deux (roue qui roule) : hors programme en physique.</li>
    </ol>
    <p><em>Exemple éclair :</em> tiroir qu'on ouvre : translation rectiligne. Pédale de vélo qui reste horizontale : translation circulaire. Aiguille d'horloge, porte : rotation autour d'un axe fixe. Roue d'un vélo qui avance : ni l'un ni l'autre dans le référentiel du sol (rotation dans celui du cadre).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Exprimer la vitesse d'un point d'un solide en rotation</strong>
    <ol>
      <li><span class="step">Vitesse angulaire.</span> La convertir en \(\text{rad·s}^{-1}\) : \(\omega=2\pi n\) avec \(n\) en tours par seconde, ou \(2\pi N/60\) avec \(N\) en tours par minute.</li>
      <li><span class="step">Distance à l'axe.</span> Mesurer \(r\), distance du point à l'axe (et non à un point de l'axe quelconque).</li>
      <li><span class="step">Résultat.</span> \(v=r\omega\), vitesse tangente au cercle ; accélération centripète \(r\omega^2\) si \(\omega\) est constante.</li>
    </ol>
    <p><em>Exemple éclair :</em> une éolienne à pales de 60 m tourne à 15 tr/min : \(\omega=1{,}57\ \text{rad·s}^{-1}\), et le bout des pales va à \(94\ \text{m·s}^{-1}\), environ 340 km/h, alors que le rotor semble tourner lentement.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Exploiter le moment d'inertie fourni</strong>
    <ol>
      <li><span class="step">Bon axe.</span> Vérifier que le \(J\) fourni est celui de l'axe de rotation (centre ou extrémité d'une tige, diamètre ou axe d'un cylindre).</li>
      <li><span class="step">Relations.</span> \(L_\Delta=J\omega\), \(E_c=\tfrac12J\omega^2=L_\Delta^2/(2J)\).</li>
      <li><span class="step">Comparer.</span> Raisonner sur la répartition des masses : plus la masse est loin de l'axe, plus \(J\) est grand (rapport 2 entre un anneau et un disque de même masse et de même rayon).</li>
    </ol>
    <p><em>Exemple éclair :</em> deux volants de 10 kg et de 25 cm de rayon, l'un plein (\(J=0{,}31\ \text{kg·m}^2\)), l'autre en anneau (\(J=0{,}63\ \text{kg·m}^2\)), doivent porter le même moment cinétique \(30\ \text{kg·m}^2\text{·s}^{-1}\) : il faut 96 rad/s pour le disque, 48 rad/s pour l'anneau.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Faire le bilan des moments sur un solide en rotation</strong>
    <ol>
      <li><span class="step">Orienter l'axe</span> et choisir le sens positif de \(\theta\) (le même pour \(\omega\) et pour les moments).</li>
      <li><span class="step">Poids.</span> Le placer en \(G\) : moment \(-mgd\sin\theta\) pour un axe horizontal, nul si l'axe passe par \(G\).</li>
      <li><span class="step">Pivot.</span> Parfait : moment nul (forces de contact radiales). Avec frottement : couple résistant, de signe opposé à \(\omega\).</li>
      <li><span class="step">Fils et courroies.</span> Un fil qui se déroule d'un tambour de rayon \(R\) est tangent au tambour : moment \(\pm TR\).</li>
      <li><span class="step">Couples.</span> Couple moteur \(\Gamma_m\), couple de rappel \(-K\theta\), couple de frottement \(-\lambda\omega\) : ajouter leurs valeurs algébriques.</li>
    </ol>
    <p><em>Exemple éclair :</em> poulie (axe par son centre, pivot parfait) entre deux brins de fil tendus à \(T_1=17{,}2\ \text{N}\) et \(T_2=16{,}6\ \text{N}\), de part et d'autre, rayon 0,10 m. Moments : \(+T_1R\) et \(-T_2R\), le poids et le pivot ne comptent pas : total \(+0{,}06\ \text{N·m}\), dans le sens du brin le plus tendu.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : croire que les deux brins d'un fil passant sur une poulie ont la même tension. C'est vrai seulement si la poulie a un moment d'inertie négligeable (ou tourne à vitesse constante) et un pivot parfait ; sinon la différence des tensions met la poulie en rotation.</div>

  <div class="method-box"><strong>Méthode 5 — Appliquer le théorème scalaire à des solides couplés</strong>
    <ol>
      <li><span class="step">Un système à la fois.</span> Théorème du moment cinétique pour chaque solide en rotation, principe fondamental pour chaque solide en translation.</li>
      <li><span class="step">Inconnues de liaison.</span> Les tensions des fils apparaissent dans les deux équations : ne pas les supposer égales aux poids.</li>
      <li><span class="step">Liaisons cinématiques.</span> Fil inextensible qui ne glisse pas : \(v=R\omega\), \(a=R\dot\omega\).</li>
      <li><span class="step">Éliminer et contrôler.</span> Résoudre, puis tester les cas limites (\(J\to0\), une masse nulle…).</li>
    </ol>
    <p><em>Exemple éclair :</em> machine d'Atwood avec une poulie réelle : masses de 2,0 kg et 1,5 kg, poulie de rayon \(R\) avec \(J/R^2=0{,}50\ \text{kg}\). \(a=\dfrac{(m_1-m_2)g}{m_1+m_2+J/R^2}=\dfrac{0{,}5\times9{,}81}{4{,}0}\approx1{,}23\ \text{m·s}^{-2}\) ; tensions 17,2 N et 16,6 N, différentes.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Mettre en équation un pendule pesant et en tirer la période</strong>
    <ol>
      <li><span class="step">Données.</span> Repérer \(m\), \(J\) (fourni, par rapport à l'axe de suspension) et la distance \(d\) de l'axe à \(G\).</li>
      <li><span class="step">Théorème.</span> \(J\ddot\theta=-mgd\sin\theta\) (+ couples éventuels), avec \(\theta\) angle de \(OG\) avec la verticale descendante.</li>
      <li><span class="step">Linéariser.</span> Pour \(|\theta|\ll1\) : \(\omega_0^2=mgd/J\), \(T_0=2\pi\sqrt{J/(mgd)}\).</li>
      <li><span class="step">Contrôler.</span> Pour un point au bout d'un fil, \(J=m\ell^2\), \(d=\ell\) : on doit retrouver \(2\pi\sqrt{\ell/g}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> disque de rayon \(R=0{,}20\ \text{m}\) suspendu par un axe perpendiculaire, à \(R/2\) de son centre ; \(J=\tfrac34mR^2\) (fourni), \(d=R/2\). \(T_0=2\pi\sqrt{3R/(2g)}\approx1{,}10\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Utiliser une intégrale première (conservation de l'énergie)</strong>
    <ol>
      <li><span class="step">Justifier.</span> Pivot parfait, frottements négligés : seuls le poids (conservatif) et le pivot (puissance nulle) agissent.</li>
      <li><span class="step">Écrire.</span> \(\tfrac12J\dot\theta^2-mgd\cos\theta=\text{cste}\) (ou multiplier l'équation du mouvement par \(\dot\theta\) et intégrer).</li>
      <li><span class="step">Entre deux positions.</span> \(\tfrac12J\dot\theta^2=mgd(\cos\theta-\cos\theta_0)\) pour un lâcher sans vitesse en \(\theta_0\) ; en déduire \(\dot\theta\), puis la vitesse \(r|\dot\theta|\) d'un point.</li>
    </ol>
    <p><em>Exemple éclair :</em> tige de 1,0 m tenue par une extrémité (\(J=\tfrac13mL^2\), \(d=L/2\)), lâchée à 60° : au passage à la verticale, \(\dot\theta^2=\dfrac{3g}{L}(1-\cos60^\circ)\), \(|\dot\theta|\approx3{,}8\ \text{rad·s}^{-1}\) ; l'extrémité va à \(3{,}8\ \text{m·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Appliquer le théorème de l'énergie cinétique à un solide en rotation</strong>
    <ol>
      <li><span class="step">Énergie cinétique.</span> \(E_c=\tfrac12J\omega^2\) (plus \(\tfrac12mv^2\) pour chaque solide en translation du système).</li>
      <li><span class="step">Puissances.</span> Action de moment \(\mathcal M_\Delta\) : \(\mathcal P=\mathcal M_\Delta\,\omega\) ; couple : \(\Gamma\omega\) ; pivot parfait : 0 ; poids : \(-\mathrm dE_p/\mathrm dt\).</li>
      <li><span class="step">Bilan.</span> \(\mathrm dE_c/\mathrm dt=\sum\mathcal P_{\text{ext}}\) (solide : pas de puissance intérieure), ou entre deux états \(\Delta E_c=\sum W\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un ventilateur (\(J=0{,}020\ \text{kg·m}^2\)) reçoit un couple moteur de \(0{,}15\ \text{N·m}\) ; l'air exerce un couple \(-\lambda\omega\) avec \(\lambda=1{,}0\times10^{-3}\ \text{N·m·s}\). En régime établi, \(\mathrm dE_c/\mathrm dt=0\), donc \(\Gamma\omega=\lambda\omega^2\) : \(\omega=150\ \text{rad·s}^{-1}\), et toute la puissance motrice, 22,5 W, est cédée à l'air. Le régime est atteint en quelques \(J/\lambda=20\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Simuler un pendule et valider la simulation</strong>
    <ol>
      <li><span class="step">Système d'ordre 1.</span> Vecteur d'état \((\theta,\omega)\), dérivées \((\omega,\ -\omega_0^2\sin\theta-k\omega)\) ; fonction <span class="code-inline">F(Y, t)</span> dans l'ordre imposé par <span class="code-inline">odeint</span>.</li>
      <li><span class="step">Unités réduites.</span> Mesurer le temps en \(1/\omega_0\) : un seul programme pour tous les pendules.</li>
      <li><span class="step">Exploiter.</span> Période par le premier passage à \(\theta=0\) (interpolation), énergie \(\tfrac12\dot\theta^2+\omega_0^2(1-\cos\theta)\) en chaque instant.</li>
      <li><span class="step">Valider.</span> Petite amplitude : \(T\to T_0\) ; sans frottement, énergie constante ; résultat inchangé quand on resserre les instants ou la tolérance.</li>
    </ol>
    <p><em>Exemple éclair :</em> le programme du cours (§7) donne \(T/T_0=1{,}0019\) à 10° (formule de Borda : 1,0019) et 1,0400 à 45° : 4 % de plus, une erreur systématique non négligeable pour une mesure de \(g\) faite à grande amplitude.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Faire le bilan d'un système déformable</strong>
    <ol>
      <li><span class="step">Moment cinétique.</span> Moments extérieurs nuls par rapport à l'axe (poids parallèles, pivot parfait) : \(J_1\omega_1=J_2\omega_2\), même si le système change de forme.</li>
      <li><span class="step">Énergie cinétique.</span> \(E_c=L_\Delta^2/(2J)\) : elle augmente quand \(J\) diminue.</li>
      <li><span class="step">Interpréter.</span> \(\Delta E_c=W_{\text{ext}}+W_{\text{int}}\) avec \(W_{\text{ext}}=0\) : l'écart est le travail des forces intérieures, positif (muscles, ressort qui se détend) ou négatif (frottements internes, embrayage).</li>
    </ol>
    <p><em>Exemple éclair :</em> une patineuse tourne à 1 tour par seconde bras écartés (\(J_1=3{,}5\ \text{kg·m}^2\)) ; bras serrés, \(J_2=1{,}0\ \text{kg·m}^2\). Elle passe à 3,5 tr/s, et son énergie cinétique de 69 J à 242 J : 173 J fournis par ses muscles.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire la conservation de l'énergie cinétique « parce qu'il n'y a pas de frottement ». Les forces intérieures d'un système déformable travaillent ; seule la conservation du moment cinétique est garantie par l'absence de moment extérieur.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Translation ou rotation ?</h3>
  <div class="statement">On considère six solides en mouvement par rapport au sol : (a) une cabine de téléphérique sur un câble rectiligne ; (b) une nacelle de grande roue ; (c) le disque d'une meuleuse ; (d) la bielle d'accouplement qui relie deux roues motrices d'une locomotive à vapeur, articulée sur chacune à 0,30 m de son axe ; (e) le piston d'un moteur ; (f) une porte qu'on ouvre.</div>
  <div class="q"><strong>Q1.</strong> Classer ces mouvements : translation rectiligne, translation circulaire, rotation autour d'un axe fixe.</div>
  <div class="q"><strong>Q2.</strong> Les roues de la locomotive tournent à \(5{,}0\ \text{rad·s}^{-1}\). Quelle est la vitesse d'un point quelconque de la bielle par rapport au châssis ? Et celle d'un point d'une roue situé à 0,60 m de son axe ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Translation rectiligne : (a) et (e). Translation circulaire : (b) et (d) (la bielle reste horizontale, ses deux extrémités décrivent des cercles de même rayon centrés sur les axes des deux roues). Rotation autour d'un axe fixe : (c) et (f).</p>
    <p><strong>Q2.</strong> Par rapport au châssis, la bielle est en translation circulaire : tous ses points ont la vitesse de ses articulations, qui tournent avec les roues à 0,30 m de leur axe : \(v=0{,}30\times5{,}0=1{,}5\ \text{m·s}^{-1}\). Un point de la roue à 0,60 m de l'axe va deux fois plus vite, \(3{,}0\ \text{m·s}^{-1}\) : dans une rotation, la vitesse est proportionnelle à la distance à l'axe.</p>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Lequel stocke le plus d'énergie ? Relier ce résultat à la répartition des masses.</div>
  <div class="q"><strong>Q3.</strong> Ordre de grandeur : la Terre (\(J\approx8{,}0\times10^{37}\ \text{kg·m}^2\), un tour en 23 h 56 min) stocke quelle énergie cinétique de rotation ?</div>

    <p><strong>Q2.</strong> L'anneau, deux fois plus que le disque : toute sa masse est à la distance maximale \(R\) de l'axe, et chaque élément compte avec le carré de sa distance. Dans la sphère, beaucoup de masse est proche de l'axe. Les volants réels ont une jante épaisse reliée au moyeu par des rayons légers.</p>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ☆ ☆</span>
  <h3>Pendule pesant : la tige</h3>
  <div class="statement">Une tige homogène de masse \(m\) et de longueur \(L=1{,}0\ \text{m}\), mobile sans frottement autour d'un axe horizontal passant par une extrémité, oscille avec une faible amplitude. On donne \(J=\tfrac13mL^2\) ; le centre de masse est au milieu de la tige.</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation du mouvement par le théorème scalaire du moment cinétique.</div>
  <div class="q"><strong>Q2.</strong> En déduire la période des petites oscillations. Dépend-elle de \(m\) ?</div>
  <div class="q"><strong>Q3.</strong> Quelle est la longueur du pendule simple de même période ? Comparer à la période d'un pendule simple de longueur \(L/2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pivot parfait (moment nul) ; poids appliqué en \(G\), à \(d=L/2\) de l'axe : \(\mathcal M_\Delta=-mg\tfrac L2\sin\theta\). Donc \(\tfrac13mL^2\,\ddot\theta=-mg\tfrac L2\sin\theta\), soit \(\ddot\theta+\dfrac{3g}{2L}\sin\theta=0\).</p>
    <p><strong>Q2.</strong> Aux petits angles : \(\omega_0=\sqrt{3g/(2L)}\approx3{,}84\ \text{rad·s}^{-1}\), \(T_0=2\pi\sqrt{2L/(3g)}\approx1{,}64\ \text{s}\), indépendante de la masse (elle se simplifie, comme pour le pendule simple).</p>
    <p><strong>Q3.</strong> \(\ell_{\text{eq}}=J/(md)=2L/3\approx0{,}67\ \text{m}\). Un pendule simple de \(L/2=0{,}50\ \text{m}\) a une période de 1,42 s : remplacer la tige par sa masse concentrée en \(G\) serait faux de 13 %, car la masse de la tige est répartie entre l'axe et l'extrémité.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Le treuil, deux fois : moment cinétique et énergie</h3>
  <div class="statement">Un tambour de moment d'inertie \(J=0{,}020\ \text{kg·m}^2\) et de rayon \(R=5{,}0\ \text{cm}\) tourne sans frottement autour de son axe horizontal. Un fil inextensible, de masse négligeable, enroulé sur le tambour, soutient une charge de masse \(M=2{,}0\ \text{kg}\), lâchée sans vitesse. Le fil ne glisse pas.</div>
  <div class="q"><strong>Q1.</strong> Écrire le théorème scalaire du moment cinétique pour le tambour et le principe fondamental pour la charge. En déduire l'accélération \(a\) de la charge et la tension du fil.</div>
  <div class="q"><strong>Q2.</strong> Retrouver \(a\) par le théorème de l'énergie cinétique appliqué au système {tambour + fil + charge}.</div>
  <div class="q"><strong>Q3.</strong> Calculer la vitesse de la charge et la vitesse angulaire du tambour après une descente de 1,5 m.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tambour : la tension, tangente, a un bras de levier \(R\) : \(J\dot\omega=TR\) (poids et pivot sans moment). Charge, axe descendant : \(Ma=Mg-T\). Non-glissement : \(a=R\dot\omega\). Alors \(T=Ja/R^2\) et \(a=\dfrac{Mg}{M+J/R^2}\), avec \(J/R^2=8{,}0\ \text{kg}\) : \(a\approx1{,}96\ \text{m·s}^{-2}\) ; \(T=M(g-a)\approx15{,}7\ \text{N}\).</p>
    <p><strong>Q2.</strong> \(E_c=\tfrac12Mv^2+\tfrac12J\omega^2=\tfrac12\left(M+J/R^2\right)v^2\). Puissances extérieures : poids de la charge \(Mgv\) ; pivot parfait et poids du tambour : nulles. Le fil idéal ne dissipe rien. \(\left(M+J/R^2\right)v\dot v=Mgv\), d'où la même accélération. Les deux méthodes sont équivalentes (cours, §8) ; l'énergie évite d'introduire \(T\), mais ne la donne pas.</p>
    <p><strong>Q3.</strong> Mouvement uniformément accéléré : \(v=\sqrt{2ah}\approx2{,}4\ \text{m·s}^{-1}\) (au lieu de 5,4 en chute libre), au bout de 1,24 s ; \(\omega=v/R\approx49\ \text{rad·s}^{-1}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Une roue de vélo qui ralentit</h3>
  <div class="statement">On retourne un vélo et l'on lance sa roue avant (\(J=0{,}10\ \text{kg·m}^2\)) à \(\omega_0=30\ \text{rad·s}^{-1}\). Le moyeu exerce un couple de frottement modélisé par \(\Gamma_f=-\lambda\omega\). On mesure que la vitesse angulaire est divisée par deux en 60 s.</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle vérifiée par \(\omega(t)\) et la résoudre.</div>
  <div class="q"><strong>Q2.</strong> En déduire \(\lambda\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance dissipée au départ, et l'énergie dissipée pendant les 60 premières secondes. Combien de tours la roue fait-elle au total dans ce modèle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Axe horizontal par le centre de masse (poids sans moment) ; théorème scalaire : \(J\dot\omega=-\lambda\omega\), d'où \(\omega(t)=\omega_0\,e^{-t/\tau}\) avec \(\tau=J/\lambda\).</p>
    <p><strong>Q2.</strong> \(\omega_0/2=\omega_0e^{-60/\tau}\) donne \(\tau=60/\ln2\approx87\ \text{s}\) et \(\lambda=J\ln2/60\approx1{,}2\times10^{-3}\ \text{N·m·s}\).</p>
    <p><strong>Q3.</strong> Puissance du couple de frottement : \(\Gamma_f\omega=-\lambda\omega^2\), soit \(-1{,}0\ \text{W}\) au départ. \(E_c\) passe de \(\tfrac12J\omega_0^2=45\ \text{J}\) à \(11{,}3\ \text{J}\) : 34 J dissipés en 60 s (la puissance diminue comme \(\omega^2\)). Angle total : \(\int_0^\infty\omega\,\mathrm dt=\omega_0\tau\approx2\,600\ \text{rad}\), soit environ 410 tours. (En réalité, un frottement solide constant finit par arrêter la roue en un temps fini.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Disque suspendu par un point de son bord</h3>
  <div class="statement">Un disque homogène de masse \(M=2{,}0\ \text{kg}\) et de rayon \(R=0{,}30\ \text{m}\) peut tourner sans frottement autour d'un axe horizontal, perpendiculaire au disque, passant par un point \(A\) de sa périphérie. Son moment d'inertie par rapport à cet axe est \(J_A=\tfrac32MR^2\) (fourni).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(J_A\). Le disque est lâché sans vitesse, son centre \(G\) à la hauteur de l'axe. Par une intégrale première, calculer sa vitesse angulaire quand \(G\) passe au plus bas.</div>
  <div class="q"><strong>Q2.</strong> Quelle est alors la vitesse du point du disque le plus éloigné de l'axe ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la période des petites oscillations et la longueur du pendule simple synchrone.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(J_A=1{,}5\times2{,}0\times0{,}09=0{,}27\ \text{kg·m}^2\). Avec \(d=R\) : \(\tfrac12J_A\dot\theta^2-MgR\cos\theta\) est constant ; de \(\theta=90^\circ\) (sans vitesse) à \(\theta=0\) : \(\tfrac12J_A\omega^2=MgR\), \(\omega=\sqrt{2MgR/J_A}\approx6{,}6\ \text{rad·s}^{-1}\).</p>
    <p><strong>Q2.</strong> Le point diamétralement opposé à \(A\) est à \(2R\) de l'axe : \(v=2R\omega\approx4{,}0\ \text{m·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(T_0=2\pi\sqrt{J_A/(MgR)}\), soit \(2\pi\sqrt{3R/(2g)}\approx1{,}35\ \text{s}\) ; \(\ell_{\text{eq}}=J_A/(MR)=\tfrac32R=0{,}45\ \text{m}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Mesurer \(g\) au pendule : jusqu'à quelle amplitude ?</h3>
  <div class="statement">On mesure \(g\) avec un pendule pesant en utilisant la formule des petites oscillations \(T_0=2\pi\sqrt{J/(mgd)}\). On souhaite que l'erreur systématique due à l'amplitude reste inférieure à 1 %. On dispose de la fonction <span class="code-inline">periode(theta0)</span> du cours (§7), qui renvoie la période (en unités de \(1/\omega_0\)) d'un pendule lâché sans vitesse depuis l'angle <span class="code-inline">theta0</span>, et de <span class="code-inline">T0 = 2 * np.pi</span>.</div>
  <div class="q"><strong>Q1.</strong> Montrer que, si l'on calcule \(g\) avec la période mesurée \(T\) au lieu de \(T_0\), l'erreur relative sur \(g\) vaut \((T/T_0)^2-1\).</div>
  <div class="q"><strong>Q2.</strong> Écrire une boucle qui affiche, pour des amplitudes de 5° à 30°, le rapport \(T/T_0\) et l'erreur relative sur \(g\) en pourcentage.</div>
  <div class="q"><strong>Q3.</strong> Le programme affiche : 5° : 0,10 % ; 10° : 0,38 % ; 15° : 0,86 % ; 16° : 0,98 % ; 17° : 1,11 % ; 20° : 1,54 % ; 30° : 3,51 %. Conclure. Retrouver l'ordre de grandeur avec la formule de Borda \(T\approx T_0(1+\theta_0^2/16)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(g_{\text{calc}}=\dfrac{4\pi^2J}{mdT^2}\) et la vraie valeur vérifie \(g=\dfrac{4\pi^2J}{mdT_0^2}\). Donc \(g/g_{\text{calc}}=(T/T_0)^2\) : l'erreur relative \(g/g_{\text{calc}}-1\) vaut \((T/T_0)^2-1\), et \(g\) est <strong>sous-estimé</strong>, puisque \(T\gt T_0\).</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock">w0 = 1.0                      <span class="cmt"># temps en unités de 1/w0 (fonction F du cours)</span>
T0 = 2 * np.pi / w0
<span class="kw">for</span> deg <span class="kw">in</span> [5, 10, 15, 16, 17, 20, 30]:
    r = periode(np.radians(deg)) / T0
    print(deg, round(r, 5), round(100 * (r**2 - 1), 2))</pre>
    <p><strong>Q3.</strong> L'erreur atteint 1 % vers 16° : il faut lâcher le pendule à moins de 15° environ (et à moins de 5° pour une erreur de 0,1 %). Avec Borda, \((T/T_0)^2-1\approx\theta_0^2/8\) ; \(\theta_0^2/8=0{,}01\) donne \(\theta_0\approx0{,}28\ \text{rad}\approx16^\circ\), en accord avec la simulation à ce niveau d'amplitude (la formule de Borda n'est fausse que de 0,002 % à 16°). Voir aussi l'exercice 08 du chapitre « Mesures et incertitudes ».</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Le balancier d'une horloge : énergie et entretien</h3>
  <div class="statement">Le balancier d'une horloge est un pendule pesant de masse \(m=1{,}0\ \text{kg}\), de moment d'inertie \(J=0{,}25\ \text{kg·m}^2\) par rapport à son axe, avec \(d=0{,}25\ \text{m}\). Livré à lui-même, son amplitude passe de 5,0° à 4,0° en 50 oscillations. On modélise les pertes par un couple \(-\lambda\dot\theta\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la période des petites oscillations. Pourquoi dit-on que ce pendule « bat la seconde » ?</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\mathrm dE_m/\mathrm dt=-\lambda\dot\theta^2\). Pour un faible amortissement, l'amplitude décroît comme \(e^{-t/\tau}\), avec \(\tau=2J/\lambda\). Calculer \(\tau\), le facteur de qualité \(Q=\omega_0\tau/2\) et \(\lambda\).</div>
  <div class="q"><strong>Q3.</strong> L'énergie, proportionnelle au carré de l'amplitude, décroît comme \(e^{-2t/\tau}\). Calculer l'énergie mécanique à 5° et la puissance moyenne perdue. Quelle fraction de son énergie le balancier perd-il à chaque période ?</div>
  <div class="q"><strong>Q4.</strong> L'horloge est entraînée par un poids de 3,0 kg qui descend de 1,2 m en 8 jours. Comparer sa puissance à celle de la question précédente.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0=\sqrt{mgd/J}=\sqrt{9{,}81}\approx3{,}13\ \text{rad·s}^{-1}\), \(T_0\approx2{,}01\ \text{s}\) : chaque demi-oscillation, un « tic » ou un « tac », dure une seconde.</p>
    <p><strong>Q2.</strong> \(E_m=\tfrac12J\dot\theta^2+mgd(1-\cos\theta)\) ; en dérivant et en utilisant \(J\ddot\theta=-mgd\sin\theta-\lambda\dot\theta\), il reste \(\mathrm dE_m/\mathrm dt=-\lambda\dot\theta^2\). Amplitude divisée par 1,25 en \(50T_0\approx100\ \text{s}\) : \(\tau=100/\ln1{,}25\approx450\ \text{s}\), \(Q\approx700\), \(\lambda=J\omega_0/Q\approx1{,}1\times10^{-3}\ \text{N·m·s}\).</p>
    <p><strong>Q3.</strong> \(E_m=mgd(1-\cos5^\circ)\approx9{,}3\times10^{-3}\ \text{J}\). Puissance perdue : \(2E_m/\tau\approx4{,}2\times10^{-5}\ \text{W}\). Fraction perdue par période : \(1-e^{-2T_0/\tau}\approx0{,}9\ \%\) (c'est \(2\pi/Q\)).</p>
    <p><strong>Q4.</strong> \(\mathcal P=Mgh/\Delta t\), avec \(\Delta t=8\times86\,400\ \text{s}\) : \(\mathcal P\approx5{,}1\times10^{-5}\ \text{W}\) : du même ordre, un peu plus que les pertes du balancier ; le reste se perd dans les engrenages. L'échappement restitue au balancier, à chaque oscillation, l'énergie qu'il a perdue, et maintient son amplitude constante (cours, §7).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Le tabouret d'inertie</h3>
  <div class="statement">Une personne est assise sur un tabouret pivotant (pivot parfait d'axe vertical) ; le moment d'inertie de l'ensemble {personne + partie mobile du tabouret}, bras compris, vaut \(J_0=2{,}0\ \text{kg·m}^2\) quelle que soit la position des bras. Elle tient deux haltères de 2,0 kg, assimilées à des points, à 0,80 m de l'axe, et tourne à \(\omega_1=2{,}0\ \text{rad·s}^{-1}\). Elle les ramène à 0,20 m de l'axe.</div>
  <div class="q"><strong>Q1.</strong> Calculer les moments d'inertie \(J_1\) et \(J_2\) du système avant et après.</div>
  <div class="q"><strong>Q2.</strong> Justifier la conservation du moment cinétique du système par rapport à l'axe, et calculer \(\omega_2\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la variation d'énergie cinétique. Quelles forces ont travaillé ? Le même bilan vaudrait-il pour un solide ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(J_1=J_0+2\times2{,}0\times0{,}80^2=4{,}56\ \text{kg·m}^2\) ; \(J_2=J_0+2\times2{,}0\times0{,}20^2=2{,}16\ \text{kg·m}^2\).</p>
    <p><strong>Q2.</strong> Actions extérieures : poids (verticaux, parallèles à l'axe) et action du pivot parfait (moment nul) ; les forces intérieures (muscles) ne changent pas le moment cinétique. \(J_1\omega_1=J_2\omega_2\), d'où \(\omega_2\approx4{,}2\ \text{rad·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(E_c\) passe de 9,1 J à 19,3 J : \(+10{,}1\ \text{J}\). Les actions extérieures ne travaillent pas (poids : mouvement horizontal ; pivot parfait) : c'est le travail des forces intérieures, fourni par les muscles qui tirent les haltères vers l'axe. Pour un solide, la puissance des forces intérieures est nulle : on ne pourrait pas changer \(J\), et \(E_c\) resterait constante.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Embrayage : des forces intérieures qui dissipent</h3>
  <div class="statement">Deux disques coaxiaux, de moments d'inertie \(J_1=0{,}050\ \text{kg·m}^2\) et \(J_2=0{,}10\ \text{kg·m}^2\), tournent sans frottement autour du même axe. Le premier tourne à \(300\ \text{rad·s}^{-1}\), le second est immobile. On les presse l'un contre l'autre : après une phase de glissement, ils tournent ensemble.</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse angulaire finale.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'énergie dissipée. Où est-elle passée ?</div>
  <div class="q"><strong>Q3.</strong> Reprendre les questions si le second disque tournait initialement à \(-100\ \text{rad·s}^{-1}\) (sens opposé).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les forces de frottement entre les disques sont intérieures au système {deux disques} ; les actions extérieures (poids, pivots parfaits) n'ont pas de moment : \(J_1\omega_1=(J_1+J_2)\,\omega\), d'où \(\omega=100\ \text{rad·s}^{-1}\).</p>
    <p><strong>Q2.</strong> \(E_c\) passe de 2 250 J à 750 J : 1 500 J dissipés en énergie thermique dans les garnitures (travail des forces intérieures de frottement, négatif, car les surfaces glissent l'une sur l'autre).</p>
    <p><strong>Q3.</strong> Moment cinétique algébrique : \(0{,}050\times300+0{,}10\times(-100)\), soit \(5{,}0\ \text{kg·m}^2\text{·s}^{-1}\), donc \(\omega=5{,}0/0{,}15\approx33\ \text{rad·s}^{-1}\), dans le sens du premier disque. \(E_c\) passe de 2 750 J à 83 J : 97 % de l'énergie est dissipée.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>La barre qui pivote : chute, réaction du pivot, grandes oscillations</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>mouvement d'un solide, pendule pesant, énergie, simulation</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une barre homogène de masse \(m=0{,}50\ \text{kg}\) et de longueur \(L=1{,}0\ \text{m}\) peut tourner dans un plan vertical autour d'un axe horizontal \(\Delta\) passant par son extrémité \(O\). Son moment d'inertie par rapport à \(\Delta\) est \(J=\tfrac13mL^2\) (fourni) ; son centre de masse \(G\) est au milieu. \(\theta\) est l'angle entre \(OG\) et la verticale descendante. Référentiel terrestre, galiléen ; \(g=9{,}81\ \text{m·s}^{-2}\). Sauf mention contraire, la liaison pivot est parfaite.
  </div>
  <p class="exo-part">Partie A — Chute depuis l'horizontale</p>
  <div class="q"><strong>A1.</strong> Calculer \(J\). Établir l'équation du mouvement.</div>
  <div class="q"><strong>A2.</strong> La barre est lâchée sans vitesse depuis l'horizontale (\(\theta_0=90^\circ\)). Par une intégrale première, calculer \(\omega\) au passage à la verticale, puis la vitesse de l'extrémité libre.</div>
  <div class="q"><strong>A3.</strong> Calculer l'accélération angulaire juste après le lâcher, puis l'accélération de l'extrémité libre. Une pièce posée sur cette extrémité reste-t-elle en contact ? En quel point de la barre l'accélération initiale vaut-elle exactement \(g\) ?</div>
  <p class="exo-part">Partie B — Action du pivot</p>
  <div class="q"><strong>B1.</strong> Par le principe fondamental appliqué au centre de masse, calculer la composante verticale de l'action \(\vec R\) du pivot juste après le lâcher.</div>
  <div class="q"><strong>B2.</strong> Même question au passage à la verticale. Commenter.</div>
  <p class="exo-part">Partie C — Petites et grandes oscillations</p>
  <div class="q"><strong>C1.</strong> Calculer la période \(T_0\) des petites oscillations.</div>
  <div class="q"><strong>C2.</strong> Une simulation (programme du cours, §7) donne, pour la barre lâchée de l'horizontale, \(T/T_0=1{,}1803\). Calculer \(T\) et comparer à la formule de Borda. Conclure.</div>
  <p class="exo-part">Partie D — Pivot réel</p>
  <div class="q"><strong>D1.</strong> Avec un pivot réel, la barre lâchée de l'horizontale ne remonte plus qu'à 45° après quelques oscillations. Calculer l'énergie mécanique perdue. Sous quelle forme se retrouve-t-elle ?</div>
  <div class="q"><strong>D2.</strong> On modélise le frottement par un couple \(-\lambda\dot\theta\). Montrer que l'énergie mécanique ne peut que décroître. Où, au cours d'une oscillation, décroît-elle le plus vite ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(J=\tfrac13\times0{,}50\times1{,}0^2\approx0{,}167\ \text{kg·m}^2\). Moment du poids : \(-mg\tfrac L2\sin\theta\) ; pivot parfait : 0. Théorème scalaire : \(J\ddot\theta=-mg\tfrac L2\sin\theta\), soit \(\ddot\theta=-\dfrac{3g}{2L}\sin\theta\).</p>
    <p><strong>A2.</strong> \(\tfrac12J\dot\theta^2-mg\tfrac L2\cos\theta\) est constant. De \(90^\circ\) à \(0\) : \(\tfrac12J\omega^2=mg\tfrac L2\), \(\omega=\sqrt{3g/L}\approx5{,}4\ \text{rad·s}^{-1}\) ; extrémité : \(L\omega\approx5{,}4\ \text{m·s}^{-1}\) (contre \(\sqrt{2gL}\approx4{,}4\ \text{m·s}^{-1}\) pour une masse qui tomberait librement de 1 m).</p>
    <p><strong>A3.</strong> En \(\theta=90^\circ\) : \(|\ddot\theta|=\dfrac{3g}{2L}\approx14{,}7\ \text{rad·s}^{-2}\). L'extrémité, à \(L\) de l'axe et de vitesse nulle, a une accélération tangentielle (verticale) \(L|\ddot\theta|=\tfrac32g\approx14{,}7\ \text{m·s}^{-2}\), plus que \(g\) : la pièce, en chute libre, ne suit pas et décolle. Le point d'accélération \(g\) est à \(r\) tel que \(r\cdot\tfrac{3g}{2L}=g\), soit \(r=\tfrac23L\approx0{,}67\ \text{m}\).</p>
    <p><strong>B1.</strong> Principe fondamental pour la barre : \(m\vec a(G)=m\vec g+\vec R\). Au lâcher, \(G\) (à \(L/2\)) a une vitesse nulle : accélération verticale descendante \(\tfrac L2|\ddot\theta|=\tfrac34g\). Selon la verticale descendante : \(m\tfrac34g=mg-R_v\), d'où \(R_v=\tfrac14mg\approx1{,}2\ \text{N}\) : au lâcher, le pivot ne porte plus que le quart du poids.</p>
    <p><strong>B2.</strong> À la verticale, \(\ddot\theta=0\) (\(\sin\theta=0\)) et \(G\) décrit son cercle à la vitesse angulaire \(\omega\) : accélération centripète, vers \(O\) donc vers le haut, \(\tfrac L2\omega^2=\tfrac32g\). Selon la verticale ascendante : \(R_v-mg=m\tfrac32g\), \(R_v=\tfrac52mg\approx12{,}3\ \text{N}\), deux fois et demie le poids. Le pivot doit être dimensionné pour cette charge dynamique, très supérieure à la charge statique.</p>
    <p><strong>C1.</strong> \(\omega_0=\sqrt{3g/(2L)}\approx3{,}84\ \text{rad·s}^{-1}\), \(T_0\approx1{,}64\ \text{s}\).</p>
    <p><strong>C2.</strong> \(T\approx1{,}1803\times1{,}638\approx1{,}93\ \text{s}\), 18 % de plus que \(T_0\). Borda donne \(T_0\left(1+(\pi/2)^2/16\right)\approx1{,}89\ \text{s}\) : 2 % d'erreur, la formule n'est qu'un développement pour les amplitudes modérées. Pour les grandes amplitudes, seule la simulation (ou un calcul exact, hors programme) convient.</p>
    <p><strong>D1.</strong> Origine de l'énergie potentielle au plus bas : \(E_m=mg\tfrac L2(1-\cos\theta_{\max})\) aux points de rebroussement. À 90° : 2,45 J ; à 45° : 0,72 J. Perte : 1,73 J, convertie en énergie thermique au pivot (et un peu dans l'air).</p>
    <p><strong>D2.</strong> Théorème de l'énergie cinétique : \(\mathrm dE_c/\mathrm dt=\mathcal P_{\text{poids}}+\mathcal P_{\text{frott}}\), avec \(\mathcal P_{\text{poids}}=-\mathrm dE_p/\mathrm dt\) et \(\mathcal P_{\text{frott}}=(-\lambda\dot\theta)\dot\theta\). Donc \(\mathrm dE_m/\mathrm dt=-\lambda\dot\theta^2\le0\). La décroissance est la plus rapide quand \(|\dot\theta|\) est maximal, au passage à la verticale ; elle s'annule aux points de rebroussement.</p>
  </div>
</div>
