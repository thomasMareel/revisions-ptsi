<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les points a) « Produit d'espaces vectoriels, somme de sous-espaces vectoriels » et d) « Hyperplans en dimension finie » de la partie « Compléments d'algèbre linéaire » du programme de PT. En première année, la somme n'était étudiée que pour deux sous-espaces : on passe ici à un nombre quelconque de sous-espaces, ce qui prépare la réduction (un endomorphisme diagonalisable découpe l'espace en somme directe de ses sous-espaces propres). Les sous-espaces stables et la trace sont traités dans le chapitre Applications linéaires (approfondissements), les projecteurs et symétries dans leur propre chapitre.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Acquis de première année</strong> : sous-espaces, familles libres et génératrices, bases, dimension, rang d'une famille, théorème de la base incomplète, formule de Grassmann, sous-espaces supplémentaires (§1).</li>
        <li><strong>Produit d'un nombre fini d'espaces vectoriels</strong> ; dimension d'un produit d'espaces de dimension finie (§2).</li>
        <li><strong>Somme d'un nombre fini de sous-espaces vectoriels</strong> (§3).</li>
        <li><strong>Somme directe</strong>, caractérisée par l'unicité de la décomposition du vecteur nul (§4).</li>
        <li><strong>Base adaptée</strong> à une décomposition en somme directe ; <strong>dimension d'une somme directe</strong> ; supplémentaires (§5).</li>
        <li><strong>Hyperplans</strong> : définition comme sous-espaces admettant une droite pour supplémentaire ; caractérisation par la dimension ; équations d'un hyperplan (§6).</li>
        <li><strong>Intersection de \(p\) hyperplans</strong> d'un espace de dimension \(n\) : dimension au moins \(n-p\) ; réciproquement, tout sous-espace de dimension \(n-p\) est intersection de \(p\) hyperplans ; système d'équations d'un sous-espace (§7).</li>
        <li><strong>Interprétation géométrique</strong> de l'ensemble des solutions d'un système d'équations linéaires (§8).</li>
      </ul>
      <p>Hors programme : pour une somme de plus de deux sous-espaces, toute caractérisation de la somme directe autre que l'unicité de la décomposition du vecteur nul (en particulier le critère par les dimensions) ; l'espace dual et la base duale. Ces points sont regroupés, à titre culturel, en fin de chapitre.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · RAPPELS DE PREMIÈRE ANNÉE</div>
  <h2>Le socle : sous-espaces, bases, dimension</h2>
  <div class="intro">Tout le chapitre s'appuie sur les notions de première année, rappelées ici sans démonstration (voir le chapitre Espaces vectoriels). Dans tout le chapitre, \(\mathbb{K}\) désigne \(\mathbb{R}\) ou \(\mathbb{C}\) et \(E\) un \(\mathbb{K}\)-espace vectoriel.</div>

  <div class="def-box">
    Un <strong>sous-espace vectoriel</strong> de \(E\) est une partie qui contient \(0\) et qui est stable par combinaison linéaire. \(\operatorname{Vect}(x_1, \ldots, x_k)\), l'ensemble des combinaisons linéaires des \(x_i\), est le plus petit sous-espace qui les contient. Une <strong>base</strong> est une famille libre et génératrice : tout vecteur y a des coordonnées uniques.
  </div>
  <div class="prop-box">
    <strong>En dimension finie.</strong>
    <ul>
      <li><strong>Base incomplète, base extraite</strong> : toute famille libre se complète en une base ; de toute famille génératrice on extrait une base.</li>
      <li>Toutes les bases ont le même nombre de vecteurs, la <strong>dimension</strong> \(n = \dim E\). Dans un espace de dimension \(n\), une famille de \(n\) vecteurs est une base dès qu'elle est libre, ou dès qu'elle est génératrice.</li>
      <li>Le <strong>rang</strong> d'une famille est la dimension du sous-espace qu'elle engendre : \(\operatorname{rg}(x_1, \ldots, x_k) = \dim \operatorname{Vect}(x_1, \ldots, x_k)\). On le calcule comme le rang de la matrice des coordonnées (nombre de pivots).</li>
      <li>Un sous-espace \(F\) de \(E\) vérifie \(\dim F \leq \dim E\), avec égalité si et seulement si \(F = E\).</li>
      <li>La <strong>somme</strong> de deux sous-espaces est \(F + G = \{y + z,\ y \in F,\ z \in G\}\) ; elle est <strong>directe</strong> lorsque \(F \cap G = \{0\}\), et l'on note alors \(F \oplus G\). La <strong>formule de Grassmann</strong> relie les dimensions :</li>
    </ul>
    <div class="formula" data-nom="Formule de Grassmann">$$\dim(F + G) = \dim F + \dim G - \dim(F \cap G).$$</div>
    <ul>
      <li>\(F\) et \(G\) sont <strong>supplémentaires</strong> si \(E = F \oplus G\). En dimension finie, c'est le cas si et seulement si \(F \cap G = \{0\}\) et \(\dim F + \dim G = \dim E\) (ou, au choix, \(F + G = E\) et \(\dim F + \dim G = \dim E\)). Tout sous-espace possède au moins un supplémentaire, en général pas unique.</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Exemple — Grassmann pour éviter un calcul</strong>
    <p>Dans \(\mathbb{R}^4\), soit \(F = \{x \in \mathbb{R}^4,\ x_1 + x_2 - x_3 = 0\}\) et \(G = \operatorname{Vect}\big((1, 0, 1, 0), (0, 1, 0, 1)\big)\).</p>
    <ol>
      <li>\(F\) est le noyau de la matrice ligne \((1\ \ 1\ \ {-1}\ \ 0)\), de rang 1 : \(\dim F = 4 - 1 = 3\) (théorème du rang). Les deux vecteurs qui engendrent \(G\) ne sont pas colinéaires : \(\dim G = 2\).</li>
      <li>Un vecteur de \(G\) s'écrit \(a(1, 0, 1, 0) + b(0, 1, 0, 1) = (a, b, a, b)\). Il est dans \(F\) si et seulement si \(a + b - a = 0\), c'est-à-dire \(b = 0\). Donc \(F \cap G = \operatorname{Vect}\big((1, 0, 1, 0)\big)\), de dimension 1.</li>
      <li>Grassmann : \(\dim(F + G) = 3 + 2 - 1 = 4\), donc \(F + G = \mathbb{R}^4\) sans avoir rien eu à résoudre de plus. La somme n'est pas directe : tout vecteur de \(\mathbb{R}^4\) se décompose, mais pas de façon unique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la somme \(F + G\) et la réunion \(F \cup G\). La réunion de deux sous-espaces n'est un sous-espace que si l'un contient l'autre : dans \(\mathbb{R}^2\), la réunion des deux axes ne contient pas \((1, 0) + (0, 1) = (1, 1)\). La somme est le plus petit sous-espace contenant la réunion.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · PRODUIT D'ESPACES VECTORIELS</div>
  <h2>Fabriquer un grand espace avec plusieurs petits</h2>
  <div class="intro">Pour traiter d'un seul coup plusieurs vecteurs pris dans des espaces différents (un polynôme et une matrice, une position et une vitesse…), on les range dans un \(p\)-uplet. Le produit cartésien des espaces hérite alors d'une structure d'espace vectoriel, dont la dimension s'obtient en additionnant.</div>

  <div class="def-box">
    Soit \(E_1, \ldots, E_p\) des \(\mathbb{K}\)-espaces vectoriels. Leur <strong>produit</strong> \(E_1 \times \cdots \times E_p\) est l'ensemble des \(p\)-uplets \((x_1, \ldots, x_p)\) avec \(x_i \in E_i\) pour chaque \(i\), muni des opérations <strong>composante par composante</strong> :
    <div class="formula">$$\begin{aligned} &(x_1, \ldots, x_p) + (y_1, \ldots, y_p) \\ &\qquad = (x_1 + y_1, \ldots, x_p + y_p), \\ &\lambda\,(x_1, \ldots, x_p) = (\lambda x_1, \ldots, \lambda x_p). \end{aligned}$$</div>
    Son vecteur nul est \((0_{E_1}, \ldots, 0_{E_p})\). L'exemple type est \(\mathbb{K}^n = \mathbb{K} \times \cdots \times \mathbb{K}\) (\(n\) facteurs).
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> \(E_1 \times \cdots \times E_p\) est un \(\mathbb{K}\)-espace vectoriel (chaque axiome se vérifie composante par composante). Si chaque \(E_i\) est de dimension finie, le produit est de dimension finie et
    <div class="formula" data-nom="Dimension d'un produit">$$\dim(E_1 \times \cdots \times E_p) = \sum_{i=1}^{p} \dim E_i.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Construire une base du produit à partir de bases des facteurs.</span>
    <div class="content">
      <p>Traitons deux facteurs \(E\) et \(F\), de bases \((e_1, \ldots, e_n)\) et \((f_1, \ldots, f_m)\). On considère la famille \(\big((e_1, 0), \ldots, (e_n, 0), (0, f_1), \ldots, (0, f_m)\big)\) de \(E \times F\).</p>
      <p><em>Génératrice</em> : si \(x = \sum x_i e_i\) et \(y = \sum y_j f_j\), alors</p>
      <div class="formula">$$\begin{aligned} (x, y) &= (x, 0) + (0, y) \\ &= \sum_i x_i\,(e_i, 0) + \sum_j y_j\,(0, f_j). \end{aligned}$$</div>
      <p><em>Libre</em> : si \(\sum \lambda_i (e_i, 0) + \sum \mu_j (0, f_j) = (0, 0)\), la première composante donne \(\sum \lambda_i e_i = 0\), la seconde \(\sum \mu_j f_j = 0\), et la liberté de chaque base annule tous les coefficients.</p>
      <p>On obtient une base de \(n + m\) vecteurs. Pour \(p\) facteurs, on raisonne par récurrence en regroupant \(E_1 \times \cdots \times E_p\) en \((E_1 \times \cdots \times E_{p-1}) \times E_p\) : c'est le même calcul.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — un hyperplan dans un produit</strong>
    <p>Dans \(E = \mathbb{R}_2[X] \times \mathbb{R}_2[X]\), de dimension \(3 + 3 = 6\), on considère \(W = \{(P, Q) \in E,\ P(1) = Q(0)\}\).</p>
    <ol>
      <li>\(W\) est le noyau de \(\varphi : (P, Q) \mapsto P(1) - Q(0)\), qui est linéaire (chaque évaluation l'est) : c'est un sous-espace de \(E\).</li>
      <li>\(\varphi\) n'est pas nulle (\(\varphi(1, 0) = 1\)), donc son image est \(\mathbb{R}\) tout entier et le théorème du rang donne \(\dim W = 6 - 1 = 5\).</li>
      <li>Une base explicite : \((1, 1)\), \((X - 1, 0)\), \(\big((X - 1)^2, 0\big)\), \((0, X)\), \((0, X^2)\). Ces cinq couples sont dans \(W\). Si une combinaison \(a(1, 1) + b(X - 1, 0) + c\big((X-1)^2, 0\big) + d(0, X) + e(0, X^2)\) est nulle, sa seconde composante \(a + dX + eX^2\) est nulle, donc \(a = d = e = 0\) ; la première devient \(b(X - 1) + c(X - 1)^2 = 0\), donc \(b = c = 0\). Cinq vecteurs libres dans un espace de dimension 5 : c'est une base.</li>
    </ol>
    <p>On reconnaîtra au §6 que \(W\) est un <strong>hyperplan</strong> de \(E\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : multiplier les dimensions. \(\dim(E \times F) = \dim E + \dim F\) ; c'est \(\dim \mathcal{L}(E, F)\) (ou \(\dim \mathcal{M}_{n,p}(\mathbb{K})\)) qui vaut un produit. Ainsi \(\mathbb{R}^2 \times \mathbb{R}^3\) est de dimension 5, comme \(\mathbb{R}^5\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SOMME D'UN NOMBRE FINI DE SOUS-ESPACES</div>
  <h2>Ajouter un morceau pris dans chaque sous-espace</h2>
  <div class="intro">La somme de deux sous-espaces se généralise sans difficulté à \(p\) sous-espaces. Le bon point de vue est celui d'une application linéaire définie sur le produit du §2 : la somme en est l'image, et la question « somme directe ou non ? » du §4 portera sur son noyau.</div>

  <div class="def-box">
    Soit \(F_1, \ldots, F_p\) des sous-espaces de \(E\). Leur <strong>somme</strong> est
    <div class="formula" data-nom="Somme de p sous-espaces">$$\begin{aligned} \sum_{i=1}^{p} F_i &= F_1 + \cdots + F_p \\ &= \{x_1 + \cdots + x_p,\ x_i \in F_i\}. \end{aligned}$$</div>
    On lui associe l'application \(\sigma : F_1 \times \cdots \times F_p \to E\), \((x_1, \ldots, x_p) \mapsto x_1 + \cdots + x_p\), qui est <strong>linéaire</strong>, et dont l'image est exactement \(\sum F_i\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong>
    <ul>
      <li>\(\sum F_i\) est un sous-espace de \(E\) (image d'une application linéaire). C'est le <strong>plus petit</strong> sous-espace contenant tous les \(F_i\) : il contient chaque \(F_i\) (prendre les autres composantes nulles), et tout sous-espace contenant les \(F_i\) contient leurs sommes.</li>
      <li>L'ordre et les regroupements sont sans importance : \(F_1 + F_2 + F_3 = (F_1 + F_2) + F_3 = F_3 + (F_1 + F_2)\).</li>
      <li>Si \(\mathcal{F}_i\) engendre \(F_i\), la <strong>famille concaténée</strong> \((\mathcal{F}_1, \ldots, \mathcal{F}_p)\) engendre \(\sum F_i\).</li>
      <li>En dimension finie : \(\dim(F_1 + \cdots + F_p) \leq \dim F_1 + \cdots + \dim F_p\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi la dimension d'une somme est-elle au plus la somme des dimensions ?</span>
    <div class="content"><p>Concaténons une base de chaque \(F_i\) : on obtient une famille génératrice de \(\sum F_i\) qui compte \(\sum \dim F_i\) vecteurs. Or la dimension d'un espace est au plus le nombre de vecteurs d'une famille génératrice (on peut en extraire une base). Autre preuve : \(\sum F_i = \operatorname{Im} \sigma\), et le rang d'une application linéaire est au plus la dimension de son espace de départ, ici \(\sum \dim F_i\) d'après le §2.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — trois droites de fonctions qui ne remplissent qu'un plan</strong>
    <p>Dans l'espace des fonctions de \(\mathbb{R}\) dans \(\mathbb{R}\), soit \(F_1 = \operatorname{Vect}(\cos)\), \(F_2 = \operatorname{Vect}(\sin)\) et \(F_3 = \operatorname{Vect}(c)\), où \(c(t) = \cos(t + \pi/3)\).</p>
    <ol>
      <li>La concaténation des familles génératrices donne \(F_1 + F_2 + F_3 = \operatorname{Vect}(\cos, \sin, c)\).</li>
      <li>La formule d'addition donne \(c = \tfrac{1}{2}\cos - \tfrac{\sqrt{3}}{2}\sin\) : \(c\) est déjà dans \(F_1 + F_2\), donc \(F_1 + F_2 + F_3 = \operatorname{Vect}(\cos, \sin)\).</li>
      <li>\(\cos\) et \(\sin\) ne sont pas colinéaires : si \(a\cos + b\sin = 0\), l'évaluation en \(0\) donne \(a = 0\), puis en \(\pi/2\) donne \(b = 0\). La somme est donc un plan : \(\dim(F_1 + F_2 + F_3) = 2 \lt 1 + 1 + 1\). Cette inégalité stricte signale une somme non directe (§4).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SOMME DIRECTE</div>
  <h2>Quand chaque vecteur de la somme se décompose d'une seule façon</h2>
  <div class="intro">Dans une somme, un même vecteur peut en général s'écrire de plusieurs façons. La somme directe est le cas où l'écriture est unique : chaque vecteur a alors une « composante » bien définie dans chaque sous-espace. C'est la situation qui permet de découper un problème en morceaux indépendants.</div>

  <div class="def-box">
    La somme \(F_1 + \cdots + F_p\) est <strong>directe</strong> si tout vecteur \(x\) de cette somme s'écrit de façon <strong>unique</strong> \(x = x_1 + \cdots + x_p\) avec \(x_i \in F_i\) pour chaque \(i\). On la note alors
    <div class="formula">$$F_1 \oplus \cdots \oplus F_p = \bigoplus_{i=1}^{p} F_i.$$</div>
    On dit que \(E\) est <strong>somme directe</strong> des \(F_i\), et l'on écrit \(E = \bigoplus F_i\), si de plus cette somme est égale à \(E\) : tout vecteur de \(E\) se décompose alors de façon unique, et \(x_i\) s'appelle la <strong>composante</strong> de \(x\) sur \(F_i\). Pour \(p = 2\), dire que \(E = F_1 \oplus F_2\), c'est dire que \(F_1\) et \(F_2\) sont supplémentaires.
  </div>
  <div class="prop-box">
    <strong>Caractérisation (programme).</strong> La somme \(F_1 + \cdots + F_p\) est directe si et seulement si le vecteur nul n'a que la décomposition triviale : pour tous \(x_1 \in F_1, \ldots, x_p \in F_p\),
    <div class="formula" data-nom="Somme directe : décomposition de 0">$$\begin{aligned} &x_1 + \cdots + x_p = 0 \\ \implies{} &x_1 = \cdots = x_p = 0. \end{aligned}$$</div>
    Avec l'application \(\sigma\) du §3 : la somme est directe si et seulement si \(\sigma\) est <strong>injective</strong>, c'est-à-dire \(\ker \sigma = \{0\}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">L'unicité pour le seul vecteur nul entraîne l'unicité pour tous.</span>
    <div class="content">
      <p>Si la somme est directe, \(0 = 0 + \cdots + 0\) est une décomposition de \(0\), donc la seule.</p>
      <p>Réciproquement, supposons que \(0\) n'ait que la décomposition triviale, et soit deux décompositions d'un même vecteur : \(x = x_1 + \cdots + x_p = y_1 + \cdots + y_p\), avec \(x_i, y_i \in F_i\). En soustrayant, \((x_1 - y_1) + \cdots + (x_p - y_p) = 0\), et chaque \(x_i - y_i\) est dans \(F_i\) (c'est un sous-espace). L'hypothèse donne \(x_i - y_i = 0\) pour tout \(i\) : les deux décompositions coïncident.</p>
      <p>C'est exactement l'énoncé « une application linéaire est injective si et seulement si son noyau est nul », appliqué à \(\sigma\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Cas de deux sous-espaces (première année).</strong> La somme \(F + G\) est directe si et seulement si \(F \cap G = \{0\}\). En effet, si \(x \in F \cap G\), alors \(x + (-x) = 0\) est une décomposition de \(0\), donc \(x = 0\) ; et si \(F \cap G = \{0\}\) et \(y + z = 0\) avec \(y \in F\), \(z \in G\), alors \(y = -z \in F \cap G\), donc \(y = z = 0\).
  </div>

  <div class="notice"><strong>Erreur classique</strong> : pour trois sous-espaces ou plus, il ne suffit <strong>pas</strong> que les intersections deux à deux soient nulles. La figure ci-dessous montre trois droites du plan qui se coupent deux à deux en \(0\) seulement, mais dont la somme (le plan entier, de dimension 2) n'est pas directe. Seule l'unicité de la décomposition du vecteur nul fait foi.</div>

  <div class="method-box">
    <strong>Exemple — intersections deux à deux nulles, somme non directe</strong>
    <p>Dans \(\mathbb{R}^4\), posons \(a = (1, 1, 0, 0)\), \(b = (0, 1, 1, 0)\), \(c = (0, 0, 1, 1)\), \(d = (1, 0, 0, 1)\) et \(F_1 = \operatorname{Vect}(a)\), \(F_2 = \operatorname{Vect}(b, c)\), \(F_3 = \operatorname{Vect}(d)\).</p>
    <ol>
      <li>Les vecteurs de \(F_2\) sont les \(\beta b + \gamma c = (0, \beta, \beta + \gamma, \gamma)\) : leur première coordonnée est nulle. Celle de \(\lambda a\) et celle de \(\lambda d\) valent \(\lambda\). Donc \(F_1 \cap F_2 = F_3 \cap F_2 = \{0\}\) ; et \(F_1 \cap F_3 = \{0\}\) car \(a\) et \(d\) ne sont pas colinéaires.</li>
      <li>Pourtant \(a - b + c - d = 0\), ce qui s'écrit \(0 = a + (c - b) + (-d)\) avec \(a \in F_1\), \(c - b \in F_2\), \(-d \in F_3\), trois vecteurs non nuls : la décomposition de \(0\) n'est pas unique, la somme n'est <strong>pas directe</strong>.</li>
      <li>Concrètement, le vecteur \(a\) a deux décompositions : \(a = a + 0 + 0 = 0 + (b - c) + d\). Et \(\dim(F_1 + F_2 + F_3) = 3 \lt 1 + 2 + 1\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — des exponentielles en somme directe</strong>
    <p>Dans l'espace des fonctions de \(\mathbb{R}\) dans \(\mathbb{R}\), notons \(e_k : t \mapsto \mathrm{e}^{kt}\) et \(F_k = \operatorname{Vect}(e_k)\) pour \(k = 1, 2, 3\). Montrons que \(F_1 + F_2 + F_3\) est directe.</p>
    <ol>
      <li>Soit \(x_1 + x_2 + x_3 = 0\) avec \(x_k \in F_k\) : il existe des réels \(\alpha, \beta, \gamma\) tels que \(\alpha\,\mathrm{e}^{t} + \beta\,\mathrm{e}^{2t} + \gamma\,\mathrm{e}^{3t} = 0\) pour tout réel \(t\).</li>
      <li>On multiplie par \(\mathrm{e}^{-3t}\) : \(\alpha\,\mathrm{e}^{-2t} + \beta\,\mathrm{e}^{-t} + \gamma = 0\), et la limite en \(+\infty\) donne \(\gamma = 0\).</li>
      <li>Il reste \(\alpha\,\mathrm{e}^{t} + \beta\,\mathrm{e}^{2t} = 0\) ; on multiplie par \(\mathrm{e}^{-2t}\) et on fait tendre \(t\) vers \(+\infty\) : \(\beta = 0\), puis \(\alpha = 0\).</li>
      <li>Les trois composantes sont nulles : la somme est directe. Ces fonctions sont des vecteurs propres de la dérivation pour des valeurs propres distinctes ; le chapitre Éléments propres généralise ce résultat.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode — prouver qu'une somme de \(p\) sous-espaces est directe</strong>
    <ol>
      <li>Se donner \(x_1 \in F_1, \ldots, x_p \in F_p\) tels que \(x_1 + \cdots + x_p = 0\).</li>
      <li>Montrer que chaque \(x_i\) est nul : en évaluant, en appliquant une application linéaire bien choisie, en passant à la limite, ou en résolvant un système sur les coordonnées.</li>
      <li>En dimension finie, on peut aussi concaténer des bases des \(F_i\) et vérifier que la famille obtenue est libre (§5).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BASES ADAPTÉES ET DIMENSION D'UNE SOMME DIRECTE</div>
  <h2>Concaténer des bases, découper une base</h2>
  <div class="intro">En dimension finie, une somme directe se lit sur les bases : mettre bout à bout des bases des morceaux donne une base du tout. Réciproquement, découper une base en paquets fabrique une décomposition en somme directe. Dans cette section, \(E\) est de dimension finie.</div>

  <div class="prop-box">
    <strong>Théorème (base adaptée).</strong> Si la somme \(F_1 + \cdots + F_p\) est directe et si \(\mathcal{B}_i\) est une base de \(F_i\) pour chaque \(i\), la famille concaténée \(\mathcal{B} = (\mathcal{B}_1, \ldots, \mathcal{B}_p)\) est une base de \(F_1 \oplus \cdots \oplus F_p\). Lorsque \(E = \bigoplus F_i\), une telle base s'appelle une <strong>base adaptée</strong> à la décomposition. En particulier :
    <div class="formula" data-nom="Dimension d'une somme directe">$$\dim\big(F_1 \oplus \cdots \oplus F_p\big) = \sum_{i=1}^{p} \dim F_i.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La famille concaténée est génératrice (§3) ; reste à prouver qu'elle est libre.</span>
    <div class="content"><p>Considérons une combinaison linéaire nulle des vecteurs de \(\mathcal{B}\), et regroupons ses termes par paquets : notons \(y_i\) la partie formée avec les vecteurs de \(\mathcal{B}_i\). Alors \(y_i \in F_i\) et \(y_1 + \cdots + y_p = 0\). La somme étant directe, chaque \(y_i\) est nul. Mais \(y_i\) est une combinaison linéaire des vecteurs de la base \(\mathcal{B}_i\) : ses coefficients sont tous nuls. La famille \(\mathcal{B}\) est donc libre, et c'est une base de la somme ; le nombre de ses vecteurs donne la formule.</p></div>
  </div>
  <div class="prop-box">
    <strong>Réciproquement, découper une base.</strong> Si \((e_1, \ldots, e_n)\) est une base de \(E\) et si l'on répartit ses vecteurs en \(p\) paquets disjoints, alors \(E\) est la somme directe des sous-espaces engendrés par ces paquets. L'unicité des coordonnées dans la base donne l'unicité de la décomposition. Par exemple, \(\mathbb{K}^n = \mathbb{K}e_1 \oplus \cdots \oplus \mathbb{K}e_n\) pour la base canonique.
  </div>

  <div class="method-box">
    <strong>Exemple — trois droites de l'espace en somme directe</strong>
    <p>Dans \(\mathbb{R}^3\), soit \(F_1 = \operatorname{Vect}(1, 1, 0)\), \(F_2 = \operatorname{Vect}(0, 1, 1)\), \(F_3 = \operatorname{Vect}(1, 0, 1)\).</p>
    <ol>
      <li>Les trois vecteurs forment une base de \(\mathbb{R}^3\) : le déterminant de leur matrice vaut 2, non nul. En découpant cette base en trois paquets d'un vecteur : \(\mathbb{R}^3 = F_1 \oplus F_2 \oplus F_3\).</li>
      <li>Décomposons \(x = (2, 0, 0)\) : on cherche \(\alpha, \beta, \gamma\) tels que \(\alpha(1, 1, 0) + \beta(0, 1, 1) + \gamma(1, 0, 1) = (2, 0, 0)\), soit \(\alpha + \gamma = 2\), \(\alpha + \beta = 0\), \(\beta + \gamma = 0\).</li>
      <li>Les deux dernières équations donnent \(\beta = -\alpha\) et \(\gamma = \alpha\), puis la première \(\alpha = 1\). D'où la décomposition unique :
      <div class="formula">$$\begin{aligned} (2, 0, 0) = {} &(1, 1, 0) \\ &+ (0, -1, -1) + (1, 0, 1). \end{aligned}$$</div></li>
    </ol>
  </div>

  <h3>Le cas de deux sous-espaces : supplémentaires</h3>
  <div class="prop-box">
    <strong>Supplémentaires et bases.</strong> \(F\) et \(G\) sont supplémentaires dans \(E\) si et seulement si la concaténation d'une base de \(F\) et d'une base de \(G\) est une base de \(E\). Pour <strong>construire</strong> un supplémentaire de \(F\), on complète une base de \(F\) en une base de \(E\) (théorème de la base incomplète) : les vecteurs ajoutés engendrent un supplémentaire. Le choix des vecteurs ajoutés étant libre, un sous-espace (autre que \(\{0\}\) et \(E\)) a une infinité de supplémentaires.
  </div>
  <div class="method-box">
    <strong>Exemple — un supplémentaire dans \(\mathbb{R}_3[X]\)</strong>
    <p>Soit \(F = \{P \in \mathbb{R}_3[X],\ P(1) = P'(1) = 0\}\) et \(G = \mathbb{R}_1[X]\).</p>
    <ol>
      <li>\(P \in F\) signifie que \(1\) est racine au moins double, c'est-à-dire que \((X - 1)^2\) divise \(P\) : \(F = \{(X - 1)^2 Q,\ Q \in \mathbb{R}_1[X]\} = \operatorname{Vect}\big((X-1)^2, X(X-1)^2\big)\), de dimension 2.</li>
      <li>\(F \cap G = \{0\}\) : un polynôme de degré au plus 1 ayant une racine double est nul. Et \(\dim F + \dim G = 2 + 2 = 4 = \dim \mathbb{R}_3[X]\). Donc \(\mathbb{R}_3[X] = F \oplus G\).</li>
      <li>Décomposition de \(X^3\) : sa composante dans \(G\) est le reste de la division par \((X - 1)^2\), qui est aussi le début de sa formule de Taylor en 1, \(P(1) + P'(1)(X - 1) = 1 + 3(X - 1) = 3X - 2\). On vérifie en développant : \(X^3 = (X - 1)^2(X + 2) + (3X - 2)\).</li>
    </ol>
    <p>L'application qui à \(P\) associe sa composante dans \(G\) est la projection sur \(G\) parallèlement à \(F\) (chapitre Projecteurs et symétries).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre le complémentaire ensembliste \(E \setminus F\) pour un supplémentaire. Ce n'est jamais un sous-espace (il ne contient pas \(0\)). Et l'on dit « <strong>un</strong> supplémentaire », jamais « le » : dans \(\mathbb{R}^2\), toute droite distincte de \(F\) est un supplémentaire de la droite \(F\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · HYPERPLANS</div>
  <h2>Les sous-espaces d'une dimension de moins</h2>
  <div class="intro">Dans \(\mathbb{R}^3\), les plans passant par l'origine ; dans \(\mathbb{R}^2\), les droites passant par l'origine : ce sont des hyperplans. Le programme les définit par un supplémentaire, puis les caractérise par leur dimension et par une équation linéaire. Dans cette section, \(E\) est de dimension finie \(n \geq 1\).</div>

  <div class="def-box">
    Un <strong>hyperplan</strong> de \(E\) est un sous-espace \(H\) qui admet une <strong>droite</strong> pour supplémentaire : il existe un vecteur \(a \neq 0\) tel que \(E = H \oplus \mathbb{K}a\), où \(\mathbb{K}a = \operatorname{Vect}(a)\).
  </div>
  <div class="prop-box">
    <strong>Caractérisation par la dimension.</strong> Un sous-espace \(H\) de \(E\) est un hyperplan si et seulement si \(\dim H = n - 1\). Dans ce cas, <strong>toute</strong> droite non contenue dans \(H\) est un supplémentaire de \(H\) : pour tout \(a \notin H\), \(E = H \oplus \mathbb{K}a\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dimension \(n-1\) et droites supplémentaires.</span>
    <div class="content">
      <p>Si \(E = H \oplus \mathbb{K}a\), la dimension d'une somme directe donne \(n = \dim H + 1\).</p>
      <p>Réciproquement, supposons \(\dim H = n - 1\) et prenons \(a \notin H\) (il en existe, car \(H \neq E\)). Si \(\lambda a \in H\) avec \(\lambda \neq 0\), alors \(a = \lambda^{-1}(\lambda a) \in H\), ce qui est exclu : \(H \cap \mathbb{K}a = \{0\}\). Comme \(\dim H + \dim \mathbb{K}a = n\), les deux sous-espaces sont supplémentaires. Ce raisonnement vaut pour n'importe quel \(a \notin H\), d'où la seconde affirmation.</p>
    </div>
  </div>
  <figure class="schema" style="max-width:440px">

  <h3>Formes linéaires et équations</h3>
  <div class="def-box">
    Une <strong>forme linéaire</strong> sur \(E\) est une application linéaire \(\varphi : E \to \mathbb{K}\). Si \(\mathcal{B} = (e_1, \ldots, e_n)\) est une base de \(E\) et si \(x\) a pour coordonnées \((x_1, \ldots, x_n)\), alors \(\varphi(x) = a_1 x_1 + \cdots + a_n x_n\), avec \(a_i = \varphi(e_i)\). Exemples : la \(k\)-ième coordonnée dans une base, l'évaluation \(P \mapsto P(a)\), l'intégrale \(f \mapsto \int_0^1 f\), la trace d'une matrice.
  </div>
  <div class="prop-box">
    <strong>Équations d'un hyperplan.</strong> Soit \(\mathcal{B}\) une base de \(E\) et \(H\) un sous-espace de \(E\). Les propriétés suivantes sont équivalentes :
    <ul>
      <li>\(H\) est un hyperplan ;</li>
      <li>\(H = \ker \varphi\) pour une forme linéaire \(\varphi\) <strong>non nulle</strong> ;</li>
      <li>il existe des scalaires \(a_1, \ldots, a_n\) <strong>non tous nuls</strong> tels que \(x \in H \iff a_1 x_1 + \cdots + a_n x_n = 0\).</li>
    </ul>
    Cette relation est <strong>une équation de \(H\)</strong> dans la base \(\mathcal{B}\). Deux équations d'un même hyperplan sont <strong>proportionnelles</strong> : si \(\ker \varphi = \ker \psi\) avec \(\varphi \neq 0\), il existe \(\lambda \neq 0\) tel que \(\psi = \lambda \varphi\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Hyperplan = noyau d'une forme linéaire non nulle, unique à un facteur près.</span>
    <div class="content">
      <p><em>Formes et coefficients.</em> Le passage de \(\varphi\) aux coefficients \(a_i = \varphi(e_i)\) (et retour) donne l'équivalence des deux derniers points.</p>
      <p><em>Un noyau est un hyperplan.</em> Si \(\varphi \neq 0\), son image est un sous-espace non nul de \(\mathbb{K}\), donc \(\mathbb{K}\) tout entier : \(\operatorname{rg}\varphi = 1\), et le théorème du rang donne \(\dim \ker \varphi = n - 1\).</p>
      <p><em>Un hyperplan est un noyau.</em> Si \(E = H \oplus \mathbb{K}a\), tout \(x\) s'écrit de façon unique \(x = h + \lambda a\) avec \(h \in H\) ; posons \(\varphi(x) = \lambda\). L'unicité de la décomposition rend \(\varphi\) linéaire ; \(\varphi(a) = 1\), donc \(\varphi \neq 0\) ; et \(\varphi(x) = 0\) si et seulement si \(x \in H\).</p>
      <p><em>Proportionnalité.</em> Prenons \(a \notin H = \ker \varphi\), de sorte que \(\varphi(a) \neq 0\), et posons \(\lambda = \psi(a) / \varphi(a)\). La forme \(\psi - \lambda\varphi\) est nulle sur \(H\) (où \(\varphi\) et \(\psi\) s'annulent) et en \(a\) : elle est nulle sur \(H \oplus \mathbb{K}a = E\). Donc \(\psi = \lambda \varphi\), avec \(\lambda \neq 0\) puisque \(\psi\) n'est pas nulle.</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Décomposition selon un hyperplan et une droite.</strong> Si \(\varphi\) est une forme linéaire et si \(\varphi(a) \neq 0\), alors \(E = \ker \varphi \oplus \mathbb{K}a\), et la décomposition de tout vecteur \(x\) est
    <div class="formula" data-nom="Décomposition hyperplan + droite">$$x = \underbrace{\Big(x - \frac{\varphi(x)}{\varphi(a)}\,a\Big)}_{\in\, \ker \varphi} + \underbrace{\frac{\varphi(x)}{\varphi(a)}\,a}_{\in\, \mathbb{K}a}.$$</div>
    On vérifie directement que le premier terme annule \(\varphi\). Cette formule donne la projection sur un hyperplan parallèlement à une droite (chapitre Projecteurs et symétries).
  </div>

  <div class="method-box">
    <strong>Exemple — équation d'un hyperplan donné par une famille génératrice</strong>
    <p>Dans \(\mathbb{R}^4\), soit \(H = \operatorname{Vect}(u_1, u_2, u_3)\) avec \(u_1 = (1, 0, 1, 2)\), \(u_2 = (0, 1, 1, -1)\), \(u_3 = (1, 1, 0, 0)\).</p>
    <ol>
      <li>Rang : \(u_3 - u_1 = (0, 1, -1, -2)\), puis \(u_3 - u_1 - u_2 = (0, 0, -2, -1)\) ; avec \(u_1\) et \(u_2\), on obtient une famille échelonnée à trois pivots. Donc \(\dim H = 3 = 4 - 1\) : \(H\) est un hyperplan.</li>
      <li>On cherche une équation \(a_1x_1 + a_2x_2 + a_3x_3 + a_4x_4 = 0\) vérifiée par \(u_1, u_2, u_3\) (elle le sera alors sur tout \(H\), par linéarité) : \(a_1 + a_3 + 2a_4 = 0\), \(a_2 + a_3 - a_4 = 0\), \(a_1 + a_2 = 0\).</li>
      <li>La troisième équation donne \(a_2 = -a_1\), la deuxième \(a_3 = a_1 + a_4\), puis la première \(2a_1 + 3a_4 = 0\). Avec \(a_4 = -2\) : \(a_1 = 3\), \(a_2 = -3\), \(a_3 = 1\).</li>
      <li>L'hyperplan d'équation \(3x_1 - 3x_2 + x_3 - 2x_4 = 0\) contient \(H\) et a la même dimension : c'est \(H\). Comme \(e_1 = (1, 0, 0, 0)\) n'y est pas (la forme y vaut 3), \(\mathbb{R}^4 = H \oplus \mathbb{R}e_1\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — hyperplans d'espaces de polynômes et de matrices</strong>
    <ol>
      <li>Dans \(\mathbb{R}_n[X]\), \(\{P,\ P(2) = 0\}\) est le noyau de la forme non nulle \(P \mapsto P(2)\) : c'est un hyperplan, de dimension \(n\). Les constantes en forment un supplémentaire, car la forme vaut 1 sur le polynôme constant 1.</li>
      <li>Dans \(\mathbb{R}_3[X]\), \(\{P,\ \int_0^1 P(t)\,\mathrm{d}t = 0\}\) est un hyperplan. Pour \(P = a_0 + a_1X + a_2X^2 + a_3X^3\), son équation dans la base canonique est \(a_0 + \tfrac{1}{2}a_1 + \tfrac{1}{3}a_2 + \tfrac{1}{4}a_3 = 0\).</li>
      <li>Dans \(\mathcal{M}_n(\mathbb{K})\), les matrices de trace nulle forment un hyperplan (noyau de la trace), de dimension \(n^2 - 1\). La droite \(\mathbb{K}I_n\) en est un supplémentaire, puisque \(\operatorname{tr} I_n = n \neq 0\) : \(M = \big(M - \tfrac{\operatorname{tr} M}{n} I_n\big) + \tfrac{\operatorname{tr} M}{n} I_n\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'un hyperplan est un plan. Dans \(\mathbb{R}^4\), un hyperplan est de dimension 3 ; dans \(\mathbb{R}^2\), c'est une droite. Autre piège : une équation d'hyperplan est <strong>homogène</strong>. L'ensemble \(\{x_1 + x_2 = 1\}\) ne contient pas \(0\), ce n'est pas un sous-espace.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · INTERSECTIONS D'HYPERPLANS, ÉQUATIONS D'UN SOUS-ESPACE</div>
  <h2>Décrire un sous-espace par un système d'équations</h2>
  <div class="intro">Un sous-espace se décrit « de l'intérieur », par une famille génératrice (description paramétrique), ou « de l'extérieur », par des équations linéaires (description cartésienne). Chaque équation fait perdre au plus une dimension ; inversement, \(n - d\) équations bien choisies suffisent à décrire un sous-espace de dimension \(d\). Ici encore, \(E\) est de dimension finie \(n\).</div>

  <div class="prop-box">
    <strong>Théorème (intersection de \(p\) hyperplans).</strong> Si \(H_1, \ldots, H_p\) sont des hyperplans de \(E\), alors
    <div class="formula" data-nom="Intersection de p hyperplans">$$\dim(H_1 \cap \cdots \cap H_p) \geq n - p.$$</div>
    Plus précisément, si \(H_i\) a pour équation \(a_{i1}x_1 + \cdots + a_{in}x_n = 0\) dans une base, l'intersection est le noyau de la matrice \(A = (a_{ij}) \in \mathcal{M}_{p,n}(\mathbb{K})\), donc \(\dim(H_1 \cap \cdots \cap H_p) = n - \operatorname{rg} A\) : la dimension vaut exactement \(n - p\) lorsque les \(p\) équations sont indépendantes (lignes de \(A\) libres).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une seule application linéaire regroupe les \(p\) équations.</span>
    <div class="content"><p>Écrivons \(H_i = \ker \varphi_i\) et posons \(\Phi : E \to \mathbb{K}^p\), \(x \mapsto \big(\varphi_1(x), \ldots, \varphi_p(x)\big)\). Cette application est linéaire et \(\ker \Phi = H_1 \cap \cdots \cap H_p\). Son image est un sous-espace de \(\mathbb{K}^p\), donc \(\operatorname{rg}\Phi \leq p\), et le théorème du rang donne \(\dim \ker \Phi = n - \operatorname{rg}\Phi \geq n - p\). Dans une base, la matrice de \(\Phi\) (base canonique à l'arrivée) est \(A\), d'où \(\operatorname{rg}\Phi = \operatorname{rg} A\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Réciproque.</strong> Tout sous-espace \(F\) de dimension \(n - p\) (avec \(1 \leq p \leq n\)) est l'intersection de \(p\) hyperplans. Autrement dit, dans toute base de \(E\), \(F\) est décrit par un <strong>système de \(p\) équations linéaires indépendantes</strong>, et l'on ne peut pas en utiliser moins.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Compléter une base de \(F\) et utiliser les formes coordonnées.</span>
    <div class="content">
      <p>Prenons une base \((e_1, \ldots, e_{n-p})\) de \(F\) et complétons-la en une base \(\mathcal{B} = (e_1, \ldots, e_n)\) de \(E\). Pour \(k \gt n - p\), notons \(\varphi_k\) la forme qui associe à \(x\) sa \(k\)-ième coordonnée dans \(\mathcal{B}\) : elle n'est pas nulle (\(\varphi_k(e_k) = 1\)), donc \(H_k = \ker \varphi_k\) est un hyperplan.</p>
      <p>Un vecteur est dans \(F\) si et seulement si ses \(p\) dernières coordonnées dans \(\mathcal{B}\) sont nulles, c'est-à-dire s'il appartient à \(H_{n-p+1} \cap \cdots \cap H_n\). D'où \(F\) comme intersection de \(p\) hyperplans. Dans une autre base, chacune de ces équations reste une équation linéaire ; elles restent indépendantes, car le théorème précédent impose un rang égal à \(n - \dim F = p\). Enfin, moins de \(p\) équations décriraient un sous-espace de dimension au moins \(n - p + 1\).</p>
    </div>
  </div>
  <figure class="schema" style="max-width:440px">

  <div class="method-box">
    <strong>Méthode — trouver un système d'équations d'un sous-espace engendré</strong>
    <ol>
      <li>Écrire que \(x \in \operatorname{Vect}(u_1, \ldots, u_d)\) si et seulement s'il existe des scalaires \(\lambda_1, \ldots, \lambda_d\) tels que \(x = \sum \lambda_j u_j\) : c'est un système d'inconnues \(\lambda_j\), dont les coordonnées de \(x\) sont les paramètres.</li>
      <li>Éliminer les \(\lambda_j\) par la méthode du pivot : les conditions de compatibilité portant sur les coordonnées de \(x\) sont les équations cherchées.</li>
      <li>Contrôler : on doit trouver \(n - d\) équations indépendantes, si \((u_1, \ldots, u_d)\) est libre.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — d'une famille génératrice à un système d'équations</strong>
    <p>Dans \(\mathbb{R}^4\), soit \(F = \operatorname{Vect}\big((1, 1, 0, 2), (0, 1, -1, 1)\big)\), de dimension 2 (vecteurs non colinéaires).</p>
    <ol>
      <li>\(x \in F\) si et seulement s'il existe \(\lambda, \mu\) tels que \(x_1 = \lambda\), \(x_2 = \lambda + \mu\), \(x_3 = -\mu\), \(x_4 = 2\lambda + \mu\).</li>
      <li>La première et la troisième équations imposent \(\lambda = x_1\) et \(\mu = -x_3\) ; les deux autres deviennent des conditions sur \(x\) : \(x_2 = x_1 - x_3\) et \(x_4 = 2x_1 - x_3\).</li>
      <li>D'où le système, à \(4 - 2 = 2\) équations indépendantes (non proportionnelles) :
      <div class="formula">$$F : \left\{\begin{aligned} x_1 - x_2 - x_3 &= 0 \\ 2x_1 - x_3 - x_4 &= 0. \end{aligned}\right.$$</div>
      On contrôle sur les deux vecteurs générateurs : \(1 - 1 - 0 = 0\) et \(2 - 0 - 2 = 0\) pour le premier, \(0 - 1 + 1 = 0\) et \(0 + 1 - 1 = 0\) pour le second.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — trois plans qui contiennent une même droite</strong>
    <p>Dans \(\mathbb{R}^3\), soit \(H_1 : x + y + z = 0\), \(H_2 : x - y = 0\) et \(H_3 : 2x + z = 0\).</p>
    <ol>
      <li>La troisième équation est la somme des deux premières : la matrice des coefficients est de rang 2.</li>
      <li>L'intersection est donc de dimension \(3 - 2 = 1\), et non \(3 - 3 = 0\) : l'inégalité du théorème peut être stricte.</li>
      <li>\(H_2\) donne \(y = x\), puis \(H_1\) donne \(z = -2x\) : \(H_1 \cap H_2 \cap H_3 = \operatorname{Vect}\big((1, 1, -2)\big)\). On vérifie que ce vecteur satisfait aussi \(H_3\) : \(2 - 2 = 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : compter les équations au lieu de leur rang. \(p\) équations décrivent un sous-espace de dimension \(n - \operatorname{rg} A\), qui vaut \(n - p\) seulement si les équations sont indépendantes. Inversement, pour décrire un sous-espace de dimension \(d\), il faut au moins \(n - d\) équations.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · INTERPRÉTATION GÉOMÉTRIQUE DES SYSTÈMES LINÉAIRES</div>
  <h2>Résoudre un système, c'est intersecter</h2>
  <div class="intro">Un système de \(p\) équations linéaires à \(n\) inconnues se lit géométriquement : chaque équation homogène non triviale décrit un hyperplan de \(\mathbb{K}^n\), et une équation avec second membre décrit un hyperplan « déplacé ». Résoudre le système, c'est chercher l'intersection de ces ensembles.</div>

  <div class="prop-box">
    <strong>Structure de l'ensemble des solutions.</strong> Soit \(A \in \mathcal{M}_{p,n}(\mathbb{K})\) de rang \(r\) et \(B \in \mathbb{K}^p\).
    <ul>
      <li>Les solutions du système <strong>homogène</strong> \(AX = 0\) forment \(\ker A\), intersection des hyperplans décrits par les lignes non nulles de \(A\) : c'est un sous-espace de dimension \(n - r\).</li>
      <li>Le système \(AX = B\) est <strong>compatible</strong> si et seulement si \(B \in \operatorname{Im} A\) (\(B\) est combinaison linéaire des colonnes de \(A\)). Dans ce cas, si \(X_0\) est une solution particulière :</li>
    </ul>
    <div class="formula" data-nom="Solutions d'un système linéaire">$$\mathcal{S} = X_0 + \ker A,$$</div>
    c'est-à-dire l'ensemble des \(X_0 + Y\) pour \(Y \in \ker A\). L'ensemble des solutions est le translaté par \(X_0\) d'un sous-espace de dimension \(n - r\) : un point, une droite, un plan… qui ne passe pas par l'origine si \(B \neq 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Toutes les solutions diffèrent d'une solution du système homogène.</span>
    <div class="content"><p>Si \(AX_0 = B\), alors pour tout \(X\) :</p>
    <div class="formula">$$\begin{aligned} AX = B &\iff A(X - X_0) = 0 \\ &\iff X - X_0 \in \ker A. \end{aligned}$$</div>
    <p>La dimension de \(\ker A\) vient du théorème du rang : \(\dim \ker A = n - \operatorname{rg} A\).</p></div>
  </div>

  <h3>Lecture dans l'espace : trois inconnues</h3>
  <p>Pour un système de trois équations à trois inconnues, chaque équation non triviale décrit un plan de l'espace. Le tableau suivant récapitule les situations possibles selon le rang \(r\) de la matrice des coefficients.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Rang \(r\)</th><th style="text-align:left">Système compatible</th><th style="text-align:left">Système incompatible</th></tr>
    <tr><td>\(r = 3\)</td><td>un seul point (système de Cramer)</td><td>impossible : \(\operatorname{Im} A = \mathbb{K}^3\)</td></tr>
    <tr><td>\(r = 2\)</td><td>une droite : plans sécants selon une même droite</td><td>vide : deux des plans sont parallèles et distincts, ou bien les trois plans se coupent deux à deux selon des droites parallèles</td></tr>
    <tr><td>\(r = 1\)</td><td>un plan : toutes les équations décrivent le même plan</td><td>vide : plans parallèles non tous confondus</td></tr>
  </table></div>
  <p>Dans le plan (\(n = 2\)), chaque équation décrit une droite : pour \(r = 2\), un point ; pour \(r = 1\), une droite ou l'ensemble vide (droites parallèles distinctes).</p>

  <div class="method-box">
    <strong>Exemple — un système à paramètres</strong>
    <p>Résolvons, selon les réels \(\alpha\) et \(\beta\), le système d'inconnues \(x, y, z\) :</p>
    <div class="formula">$$\left\{\begin{aligned} x + 2y - z &= 1 \\ 2x + y + z &= \alpha \\ x - y + 2z &= \beta. \end{aligned}\right.$$</div>
    <ol>
      <li>Pivot : \(L_2 \leftarrow L_2 - 2L_1\) et \(L_3 \leftarrow L_3 - L_1\) donnent deux lignes de coefficients \((0, -3, 3)\), de seconds membres \(\alpha - 2\) et \(\beta - 1\) ; puis \(L_3 \leftarrow L_3 - L_2\) donne \(0 = \beta - \alpha + 1\). La matrice des coefficients est de rang 2.</li>
      <li>Si \(\beta \neq \alpha - 1\), le système est incompatible : les trois plans n'ont aucun point commun (ils se coupent deux à deux selon trois droites parallèles).</li>
      <li>Si \(\beta = \alpha - 1\), les solutions forment une droite. Noyau : \(x + 2y - z = 0\) et \(-3y + 3z = 0\) donnent \(z = y\), \(x = -y\), d'où \(\ker A = \operatorname{Vect}\big((1, -1, -1)\big)\). Solution particulière avec \(z = 0\) : \(y = \tfrac{2 - \alpha}{3}\), puis \(x = 1 - 2y = \tfrac{2\alpha - 1}{3}\), soit
      <div class="formula">$$X_0 = \Big(\frac{2\alpha - 1}{3},\ \frac{2 - \alpha}{3},\ 0\Big).$$</div></li>
      <li>Conclusion : les solutions forment une droite de l'espace commune aux trois plans,
      <div class="formula">$$\mathcal{S} = X_0 + \operatorname{Vect}\big((1, -1, -1)\big).$$</div>
      Contrôle pour \(\alpha = 2\) et \(\beta = 1\) : \(X_0 = (1, 0, 0)\) vérifie bien les trois équations, ainsi que \(X_0 + (1, -1, -1) = (2, -1, -1)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure « trois équations, trois inconnues, donc une unique solution ». Il faut que la matrice soit de rang 3 (déterminant non nul). Autre piège : l'ensemble des solutions de \(AX = B\) avec \(B \neq 0\) n'est pas un sous-espace vectoriel (il ne contient pas \(0\)) ; on ne parle donc pas de sa « base », mais d'une solution particulière et d'une base de \(\ker A\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Critère des dimensions et dualité</h2>
  <div class="intro">Ces compléments éclairent le chapitre et servent souvent dans les exercices, mais ils ne sont pas exigibles : sur une copie, on les redémontre ou on s'en passe.</div>
  <ul>
    <li><strong>Critère des dimensions.</strong> En dimension finie, la somme \(F_1 + \cdots + F_p\) est directe si et seulement si \(\dim(F_1 + \cdots + F_p) = \dim F_1 + \cdots + \dim F_p\). Idée : l'application \(\sigma\) du §3 est surjective sur la somme, et le théorème du rang montre qu'elle est injective si et seulement si les deux dimensions coïncident. Les exemples du §3 et du §4 l'illustrent (dimension 2 au lieu de 3, dimension 3 au lieu de 4). Pour \(p = 2\), c'est la formule de Grassmann, qui, elle, est au programme.</li>
    <li><strong>Caractérisation par intersections successives.</strong> La somme est directe si et seulement si, pour tout \(k \geq 2\), \((F_1 + \cdots + F_{k-1}) \cap F_k = \{0\}\). Ce sont les intersections avec les sommes précédentes qu'il faut tester, pas les intersections deux à deux.</li>
    <li><strong>Espace dual.</strong> L'espace \(E^* = \mathcal{L}(E, \mathbb{K})\) des formes linéaires a la même dimension que \(E\). À une base \((e_1, \ldots, e_n)\) correspond la <strong>base duale</strong> \((e_1^*, \ldots, e_n^*)\) des formes coordonnées utilisées au §7. Les formes qui s'annulent sur un sous-espace de dimension \(d\) forment un sous-espace de \(E^*\) de dimension \(n - d\) : c'est la version abstraite du §7.</li>
    <li><strong>Dimension infinie.</strong> Les hyperplans, définis par une droite supplémentaire, sont encore les noyaux des formes linéaires non nulles ; exemple : \(\{f \in \mathcal{C}([0, 1], \mathbb{R}),\ f(0) = 0\}\).</li>
  </ul>
</div>
</template>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ESPACES VECTORIELS 2A</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à manipuler les sommes de plusieurs sous-espaces (directes ou non), à passer d'une description d'un sous-espace par une famille génératrice à une description par des équations, et à lire géométriquement un système linéaire.</div>

  <div class="method-box"><strong>Méthode 1 — Travailler dans un produit d'espaces</strong>
    <ol>
      <li>Additionner les dimensions des facteurs : \(\dim(E_1 \times \cdots \times E_p) = \dim E_1 + \cdots + \dim E_p\) (jamais un produit).</li>
      <li>Pour une base, prendre chaque vecteur de base d'un facteur, complété par des vecteurs nuls dans les autres composantes.</li>
      <li>Pour un sous-espace défini par des relations entre les composantes, l'écrire comme noyau d'une application linéaire définie sur le produit, puis appliquer le théorème du rang.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E = \mathbb{R}_1[X] \times \mathcal{M}_2(\mathbb{R})\) est de dimension \(2 + 4 = 6\), de base \((1, 0)\), \((X, 0)\), \((0, E_{11})\), \((0, E_{12})\), \((0, E_{21})\), \((0, E_{22})\). Le sous-espace \(\{(P, M) \in E,\ P(0) = \operatorname{tr} M\}\) est le noyau de la forme non nulle \((P, M) \mapsto P(0) - \operatorname{tr} M\) : il est de dimension 5.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Déterminer une somme de sous-espaces</strong>
    <ol>
      <li>Concaténer une famille génératrice de chaque \(F_i\) : on obtient une famille génératrice de \(F_1 + \cdots + F_p\).</li>
      <li>En extraire une base (pivot de Gauss, relations évidentes entre vecteurs) : sa longueur est \(\dim(F_1 + \cdots + F_p)\).</li>
      <li>Comparer à \(\dim F_1 + \cdots + \dim F_p\) : une inégalité stricte prouve que la somme n'est pas directe.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}^3\), avec \(F_1 = \operatorname{Vect}\big((1, 0, 1)\big)\), \(F_2 = \operatorname{Vect}\big((0, 1, 1)\big)\), \(F_3 = \operatorname{Vect}\big((1, 1, 2)\big)\) : \((1, 1, 2) = (1, 0, 1) + (0, 1, 1)\), donc la somme est le plan engendré par les deux premiers vecteurs, d'équation \(x + y - z = 0\). Elle est de dimension \(2 \lt 3\) : elle n'est pas directe.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Prouver qu'une somme de \(p\) sous-espaces est directe</strong>
    <ol>
      <li>Se donner \(x_1 \in F_1, \ldots, x_p \in F_p\) tels que \(x_1 + \cdots + x_p = 0\) : c'est la seule caractérisation au programme pour \(p \geq 3\).</li>
      <li>Montrer que chaque \(x_i\) est nul : évaluer en des points bien choisis, appliquer une application linéaire qui « tue » certaines composantes (transposition, trace, dérivation…), passer à la limite, ou résoudre un système sur les coordonnées.</li>
      <li>En dimension finie, on peut aussi concaténer des bases des \(F_i\) et vérifier que la famille obtenue est libre.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans l'espace des fonctions de \(\mathbb{R}\) dans \(\mathbb{R}\), soit \(F_1\) les constantes, \(F_2 = \operatorname{Vect}(x \mapsto x)\), \(F_3 = \operatorname{Vect}(x \mapsto |x|)\). Si \(a + bx + c|x| = 0\) pour tout réel \(x\) : en \(x = 0\), \(a = 0\) ; en \(x = 1\) et \(x = -1\), \(b + c = 0\) et \(-b + c = 0\), donc \(b = c = 0\). La somme est directe.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : pour trois sous-espaces ou plus, des intersections deux à deux nulles ne prouvent rien. Trois droites distinctes du plan se coupent deux à deux en \(0\), mais leur somme n'est jamais directe : \(\mathbb{R}^2\) n'est que de dimension 2.</div>

  <div class="method-box"><strong>Méthode 4 — Montrer que deux sous-espaces sont supplémentaires</strong>
    <ol>
      <li><em>En dimension finie</em> : montrer \(F \cap G = \{0\}\) (résoudre \(x \in F\) et \(x \in G\)), puis vérifier \(\dim F + \dim G = \dim E\). On peut remplacer la première étape par \(F + G = E\).</li>
      <li><em>En dimension quelconque</em> : raisonner par analyse-synthèse. Analyse : si \(x = y + z\) avec \(y \in F\) et \(z \in G\), exprimer \(y\) et \(z\) en fonction de \(x\) (unicité). Synthèse : vérifier que les expressions trouvées conviennent (existence).</li>
      <li>Conclure \(E = F \oplus G\).</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(E = \mathcal{C}([0, 1], \mathbb{R})\), soit \(F = \{f,\ \int_0^1 f = 0\}\) et \(G\) les constantes. Analyse : si \(f = g + c\) avec \(g \in F\), l'intégration donne \(c = \int_0^1 f\). Synthèse : \(c = \int_0^1 f\) et \(g = f - c\) conviennent, car \(\int_0^1 g = \int_0^1 f - c = 0\). Donc \(E = F \oplus G\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(F \cap G = \{0\}\) seul ne suffit pas (deux droites de \(\mathbb{R}^3\) ne sont pas supplémentaires), ni la seule condition sur les dimensions (une droite contenue dans un plan de \(\mathbb{R}^3\)). Il faut les deux.</div>

  <div class="method-box"><strong>Méthode 5 — Décomposer un vecteur selon une somme directe</strong>
    <ol>
      <li>Écrire \(x = x_1 + \cdots + x_p\) avec \(x_i\) dans \(F_i\), chaque \(x_i\) exprimé avec des coefficients inconnus dans une base de \(F_i\).</li>
      <li>Résoudre le système obtenu : il a une solution unique, puisque la somme est directe et vaut \(E\).</li>
      <li>Pour un hyperplan \(\ker \varphi\) et une droite \(\mathbb{K}a\) avec \(\varphi(a) \neq 0\), utiliser directement la formule \(x = \big(x - \tfrac{\varphi(x)}{\varphi(a)}a\big) + \tfrac{\varphi(x)}{\varphi(a)}a\).</li>
      <li>Contrôler en additionnant les composantes trouvées.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}^3\), le plan \(P : x - y = 0\) et la droite \(D = \operatorname{Vect}(a)\), \(a = (1, 0, 2)\), sont supplémentaires (\(\varphi(a) = 1 \neq 0\) pour \(\varphi(x, y, z) = x - y\)). Pour \(v = (3, 1, 2)\) : \(\varphi(v) = 2\), d'où \(v = (1, 1, -2) + 2a\), et \((1, 1, -2)\) est bien dans \(P\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Construire un supplémentaire ou une base adaptée</strong>
    <ol>
      <li>Prendre une base de \(F\) (par exemple en résolvant ses équations).</li>
      <li>La compléter en une base de \(E\) avec des vecteurs simples (vecteurs de la base canonique) : il suffit que la famille obtenue soit libre, ce qu'un échelonnement montre.</li>
      <li>Les vecteurs ajoutés engendrent <strong>un</strong> supplémentaire \(G\) de \(F\), et la base obtenue est adaptée à \(E = F \oplus G\).</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}^4\), \(F = \operatorname{Vect}\big((1, 1, 0, 0), (0, 1, 1, 0)\big)\). La famille \(\big((1, 1, 0, 0), (0, 1, 1, 0), e_3, e_4\big)\) est échelonnée, avec des pivots en positions 1, 2, 3, 4 : c'est une base, et \(G = \operatorname{Vect}(e_3, e_4)\) est un supplémentaire de \(F\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dire « <strong>le</strong> supplémentaire » (il y en a une infinité, sauf pour \(\{0\}\) et \(E\)), ou prendre le complémentaire \(E \setminus F\), qui n'est même pas un sous-espace (il ne contient pas \(0\)).</div>

  <div class="method-box"><strong>Méthode 7 — Reconnaître un hyperplan et trouver son équation</strong>
    <ol>
      <li>Montrer que l'ensemble est le noyau d'une forme linéaire \(\varphi\) <strong>non nulle</strong> (exhiber un vecteur où elle ne s'annule pas) : c'est un hyperplan, de dimension \(n - 1\).</li>
      <li>Si l'hyperplan est donné par une famille génératrice \((u_1, \ldots, u_{n-1})\) libre, chercher des coefficients \(a_1, \ldots, a_n\) non tous nuls tels que \(a_1x_1 + \cdots + a_nx_n\) s'annule en chaque \(u_j\) : système homogène de \(n - 1\) équations, dont les solutions sont proportionnelles.</li>
      <li>Une droite \(\mathbb{K}a\) est un supplémentaire de \(\ker \varphi\) dès que \(\varphi(a) \neq 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(H = \operatorname{Vect}\big((1, 1, 0), (0, 1, 1)\big)\) dans \(\mathbb{R}^3\), les conditions \(a_1 + a_2 = 0\) et \(a_2 + a_3 = 0\) donnent \((a_1, a_2, a_3) = (1, -1, 1)\) à un facteur près : \(H : x - y + z = 0\). Contrôle : \(1 - 1 + 0 = 0\) et \(0 - 1 + 1 = 0\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un hyperplan de \(\mathbb{R}^n\) est de dimension \(n - 1\) (une droite de \(\mathbb{R}^2\), un sous-espace de dimension 3 de \(\mathbb{R}^4\)) : ce n'est un plan qu'en dimension 3. Et son équation est homogène : \(x + y = 1\) ne décrit pas un sous-espace.</div>

  <div class="method-box"><strong>Méthode 8 — Passer d'une famille génératrice à un système d'équations, et retour</strong>
    <ol>
      <li><em>Vers les équations</em> : écrire \(x = \lambda_1u_1 + \cdots + \lambda_du_d\), éliminer les \(\lambda_j\) par pivot ; les conditions de compatibilité portant sur les coordonnées de \(x\) sont les équations cherchées.</li>
      <li><em>Vers une base</em> : résoudre le système en exprimant les inconnues principales en fonction des inconnues libres ; chaque inconnue libre fournit un vecteur de base.</li>
      <li>Contrôler : un sous-espace de dimension \(d\) de \(\mathbb{K}^n\) est décrit par \(n - d\) équations indépendantes, et pas moins.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans \(\mathbb{R}^4\), \(F = \operatorname{Vect}\big((1, 0, 1, 0), (0, 1, 0, 1)\big)\) : \(x = (\lambda, \mu, \lambda, \mu)\), d'où \(F : x_1 - x_3 = 0,\ x_2 - x_4 = 0\). Retour : \(G : x_1 + x_2 + x_3 + x_4 = 0,\ x_1 - x_2 = 0\) donne \(x_2 = x_1\) et \(x_4 = -2x_1 - x_3\), d'où la base \(\big((1, 1, 0, -2), (0, 0, 1, -1)\big)\) : \(\dim G = 4 - 2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : compter les équations au lieu de leur rang. \(p\) équations décrivent un sous-espace de dimension \(n - \operatorname{rg} A\), qui vaut \(n - p\) seulement si elles sont indépendantes ; en général, on a seulement \(\dim \geq n - p\).</div>

  <div class="method-box"><strong>Méthode 9 — Résoudre un système et l'interpréter géométriquement</strong>
    <ol>
      <li>Échelonner le système \(AX = B\) : le nombre de pivots est le rang \(r\) de \(A\) ; les lignes devenues nulles à gauche donnent les conditions de compatibilité sur \(B\).</li>
      <li>Si le système est compatible, trouver une solution particulière \(X_0\) (en donnant aux inconnues libres la valeur 0) et une base de \(\ker A\) (système homogène).</li>
      <li>Conclure \(\mathcal{S} = X_0 + \ker A\) : un point, une droite, un plan… de dimension \(n - r\), qui ne passe pas par l'origine si \(B \neq 0\).</li>
      <li>Interpréter : chaque équation non triviale est un hyperplan (un plan si \(n = 3\)), et \(\mathcal{S}\) est leur intersection.</li>
    </ol>
    <p><em>Exemple éclair :</em> le système \(x + y + z = 1\), \(x - y = 0\) est de rang 2 : ses solutions \(\big(\tfrac{1}{2}, \tfrac{1}{2}, 0\big) + \operatorname{Vect}\big((1, 1, -2)\big)\) forment la droite d'intersection de deux plans non parallèles.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « trois équations, trois inconnues, donc une solution unique » est faux si le rang est inférieur à 3. Et l'ensemble des solutions de \(AX = B\) avec \(B \neq 0\) n'est pas un sous-espace : on ne parle pas de sa base, mais d'une solution particulière et d'une base de \(\ker A\).</div>
</div>
</template>
