<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Pair et impair</h3>
  <div class="statement">Soit \(E\) l'espace des fonctions de \(\mathbb{R}\) dans \(\mathbb{R}\), \(P\) le sous-espace des fonctions paires et \(I\) celui des fonctions impaires. Montrer que \(E = P \oplus I\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><em>Somme.</em> Pour \(f \in E\), posons \(g(x) = \tfrac{1}{2}\big(f(x) + f(-x)\big)\) et \(h(x) = \tfrac{1}{2}\big(f(x) - f(-x)\big)\). Alors \(g\) est paire, \(h\) est impaire et \(f = g + h\) : \(E = P + I\).</p>
  <p><em>Intersection.</em> Si \(f\) est à la fois paire et impaire, \(f(x) = f(-x) = -f(x)\) pour tout \(x\), donc \(f = 0\) : \(P \cap I = \{0\}\). D'où \(E = P \oplus I\) (en dimension infinie, on ne peut pas raisonner sur les dimensions).</p></div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Grassmann</h3>
  <div class="statement">Dans \(\mathbb{R}^4\), \(F\) et \(G\) sont deux sous-espaces de dimension \(3\). Que dire de \(\dim(F \cap G)\) ? Les valeurs possibles sont-elles toutes atteintes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>\(F + G\) est un sous-espace de \(\mathbb{R}^4\), donc \(\dim(F + G) \leq 4\), et la formule de Grassmann donne \(\dim(F \cap G) = 3 + 3 - \dim(F + G) \geq 2\). Comme \(F \cap G \subset F\), \(\dim(F \cap G) \in \{2, 3\}\).</p>
  <p>Les deux cas se produisent : si \(F = G\), l'intersection est de dimension 3 ; si \(F : x_4 = 0\) et \(G : x_1 = 0\), l'intersection \(\{x_1 = x_4 = 0\} = \operatorname{Vect}(e_2, e_3)\) est de dimension 2. Deux hyperplans distincts de \(\mathbb{R}^4\) se coupent donc toujours selon un sous-espace de dimension 2.</p></div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Somme directe : intersections deux à deux insuffisantes</h3>
  <div class="statement">Dans \(\mathbb{R}^2\), soit \(D_1 = \operatorname{Vect}\big((1, 0)\big)\), \(D_2 = \operatorname{Vect}\big((0, 1)\big)\), \(D_3 = \operatorname{Vect}\big((1, 1)\big)\). Les \(D_i\) sont deux à deux d'intersection nulle. La somme \(D_1 + D_2 + D_3\) est-elle directe ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>Non. On a \((1, 0) + (0, 1) + \big({-(1, 1)}\big) = (0, 0)\) avec \((1, 0) \in D_1\), \((0, 1) \in D_2\), \(-(1, 1) \in D_3\), trois vecteurs non nuls : le vecteur nul a une décomposition non triviale, la somme n'est pas directe (c'est la caractérisation du programme).</p>
  <p>Autrement dit, \((1, 1)\) s'écrit de deux façons dans la somme : \((1, 0) + (0, 1) + 0\) et \(0 + 0 + (1, 1)\). On le voyait aussi sur les dimensions : la somme est \(\mathbb{R}^2\), de dimension \(2 \lt 1 + 1 + 1\). Les intersections deux à deux nulles ne suffisent donc pas.</p></div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ☆ ☆</span>
  <h3>Supplémentaire d'un hyperplan</h3>
  <div class="statement">Dans \(\mathbb{R}^3\), soit \(H = \{(x, y, z),\ x + y + z = 0\}\).</div>
  <div class="q"><strong>Q1.</strong> Donner un supplémentaire de \(H\).</div>
  <div class="q"><strong>Q2.</strong> Décomposer \(v = (1, 2, 3)\) selon cette somme directe.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(H\) est le noyau de la forme non nulle \(\varphi(x, y, z) = x + y + z\) : c'est un hyperplan, \(\dim H = 2\). La droite \(D = \operatorname{Vect}(a)\), \(a = (1, 1, 1)\), vérifie \(D \cap H = \{0\}\), car \(\varphi(a) = 3 \neq 0\), et \(\dim H + \dim D = 3\) : \(\mathbb{R}^3 = H \oplus D\). Toute droite dirigée par un vecteur hors de \(H\) conviendrait aussi.</p>
  <p><strong>Q2.</strong> La composante sur \(D\) est \(\tfrac{\varphi(v)}{\varphi(a)}\,a = \tfrac{6}{3}(1, 1, 1) = (2, 2, 2)\), d'où \(v = (-1, 0, 1) + (2, 2, 2)\), et l'on vérifie que \((-1, 0, 1) \in H\).</p></div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ☆ ☆</span>
  <h3>Un sous-espace d'un produit</h3>
  <div class="statement">Soit \(E = \mathbb{R}_2[X] \times \mathbb{R}^2\) et \(F = \{(P, (a, b)) \in E,\ P(0) = a \text{ et } P(1) = b\}\).</div>
  <div class="q"><strong>Q1.</strong> Quelle est la dimension de \(E\) ?</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(F\) est un sous-espace de \(E\) et calculer sa dimension ; en donner une base.</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(G = \{0\} \times \mathbb{R}^2\) est un supplémentaire de \(F\) dans \(E\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\dim E = \dim \mathbb{R}_2[X] + \dim \mathbb{R}^2 = 3 + 2 = 5\).</p>
  <p><strong>Q2.</strong> \(F\) est le noyau de \(\Phi : E \to \mathbb{R}^2\), \((P, (a, b)) \mapsto \big(P(0) - a,\ P(1) - b\big)\), linéaire (les évaluations le sont) : c'est un sous-espace. \(\Phi\) est surjective, car \(\Phi\big(0, (-c, -d)\big) = (c, d)\) ; le théorème du rang donne \(\dim F = 5 - 2 = 3\). Les trois vecteurs \(\big(1, (1, 1)\big)\), \(\big(X, (0, 1)\big)\), \(\big(X^2, (0, 1)\big)\) sont dans \(F\) et libres (leurs premières composantes \(1, X, X^2\) le sont) : c'est une base de \(F\).</p>
  <p><strong>Q3.</strong> Si \((P, (a, b)) \in F \cap G\), alors \(P = 0\), donc \(a = P(0) = 0\) et \(b = P(1) = 0\) : \(F \cap G = \{0\}\). De plus \(\dim F + \dim G = 3 + 2 = 5 = \dim E\), donc \(E = F \oplus G\).</p></div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Trois sous-espaces de matrices en somme directe</h3>
  <div class="statement">Dans \(\mathcal{M}_2(\mathbb{R})\), soit \(D = \operatorname{Vect}(I_2)\), \(S_0\) l'ensemble des matrices symétriques de trace nulle et \(\mathcal{A}_2\) l'ensemble des matrices antisymétriques.</div>
  <div class="q"><strong>Q1.</strong> Donner une base et la dimension de \(S_0\) et de \(\mathcal{A}_2\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que la somme \(D + S_0 + \mathcal{A}_2\) est directe.</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(\mathcal{M}_2(\mathbb{R}) = D \oplus S_0 \oplus \mathcal{A}_2\), puis décomposer \(M = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Les matrices de \(S_0\) sont les</p>
  <div class="formula">$$\begin{pmatrix} a & b \\ b & -a \end{pmatrix} = a\begin{pmatrix} 1 & 0 \\ 0 & -1 \end{pmatrix} + b\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix} :$$</div>
  <p>ces deux matrices, non colinéaires, forment une base, \(\dim S_0 = 2\). Celles de \(\mathcal{A}_2\) sont les \(c\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}\) : \(\dim \mathcal{A}_2 = 1\).</p>
  <p><strong>Q2.</strong> Soit \(\lambda I_2 + S + A = 0\) avec \(S \in S_0\) et \(A \in \mathcal{A}_2\). En transposant : \(\lambda I_2 + S - A = 0\). La différence des deux égalités donne \(2A = 0\), donc \(A = 0\). Il reste \(\lambda I_2 + S = 0\) ; en prenant la trace, \(2\lambda + 0 = 0\), donc \(\lambda = 0\), puis \(S = 0\). Le vecteur nul n'a que la décomposition triviale : la somme est directe.</p>
  <p><strong>Q3.</strong> La concaténation de bases des trois sous-espaces est une base de leur somme directe, qui est donc de dimension \(1 + 2 + 1 = 4 = \dim \mathcal{M}_2(\mathbb{R})\) : la somme est \(\mathcal{M}_2(\mathbb{R})\) tout entier. Pour \(M\), on reprend l'analyse de Q2 : \(A = \tfrac{1}{2}(M - M^\top)\), puis \(\lambda = \tfrac{1}{2}\operatorname{tr} M\), puis \(S = \tfrac{1}{2}(M + M^\top) - \lambda I_2\). Ici \(\lambda = \tfrac{5}{2}\) et</p>
  <div class="formula">$$M = \frac{5}{2}I_2 + \begin{pmatrix} -\frac{3}{2} & \frac{5}{2} \\ \frac{5}{2} & \frac{3}{2} \end{pmatrix} + \begin{pmatrix} 0 & -\frac{1}{2} \\ \frac{1}{2} & 0 \end{pmatrix}.$$</div>
  <p>Contrôle : la matrice du milieu est symétrique de trace nulle, la dernière antisymétrique, et la somme redonne \(M\).</p></div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Un hyperplan défini par une intégrale</h3>
  <div class="statement">Dans \(E = \mathbb{R}_3[X]\), soit \(H = \Big\{P \in E,\ \displaystyle\int_{-1}^{1} P(t)\,\mathrm{d}t = 0\Big\}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(H\) est un hyperplan et donner son équation dans la base canonique.</div>
  <div class="q"><strong>Q2.</strong> Donner une base de \(H\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(E = H \oplus \mathbb{R}_0[X]\) et décomposer \(P = X^2 + X\).</div>
  <div class="q"><strong>Q4.</strong> Les droites \(\operatorname{Vect}(X)\) et \(\operatorname{Vect}(X^2)\) sont-elles des supplémentaires de \(H\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\varphi : P \mapsto \int_{-1}^{1} P(t)\,\mathrm{d}t\) est une forme linéaire (linéarité de l'intégrale), non nulle car \(\varphi(1) = 2\). Son noyau \(H\) est un hyperplan, de dimension 3. Pour \(P = a_0 + a_1X + a_2X^2 + a_3X^3\), les termes impairs s'intègrent en 0 sur \([-1, 1]\) et \(\varphi(P) = 2a_0 + \tfrac{2}{3}a_2\) : l'équation de \(H\) est \(3a_0 + a_2 = 0\).</p>
  <p><strong>Q2.</strong> \(X\), \(X^3\) et \(3X^2 - 1\) vérifient l'équation et sont de degrés distincts, donc libres : trois vecteurs libres dans un espace de dimension 3, c'est une base de \(H\).</p>
  <p><strong>Q3.</strong> \(\varphi(1) = 2 \neq 0\) : la droite des constantes n'est pas contenue dans \(H\), elle en est un supplémentaire. La composante de \(P\) sur \(\mathbb{R}_0[X]\) est \(\tfrac{\varphi(P)}{\varphi(1)} = \tfrac{2/3}{2} = \tfrac{1}{3}\), d'où \(X^2 + X = \big(X^2 + X - \tfrac{1}{3}\big) + \tfrac{1}{3}\), et l'on vérifie que \(\int_{-1}^{1}(t^2 + t - \tfrac{1}{3})\,\mathrm{d}t = \tfrac{2}{3} - \tfrac{2}{3} = 0\).</p>
  <p><strong>Q4.</strong> \(\varphi(X) = 0\) : \(X \in H\), donc \(\operatorname{Vect}(X) \subset H\) n'est pas un supplémentaire. \(\varphi(X^2) = \tfrac{2}{3} \neq 0\) : \(\operatorname{Vect}(X^2)\) en est un (toute droite non contenue dans un hyperplan en est un supplémentaire).</p></div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Équations, intersection et somme de deux sous-espaces de \(\mathbb{R}^4\)</h3>
  <div class="statement">Dans \(\mathbb{R}^4\), soit \(F = \operatorname{Vect}(u_1, u_2)\) avec \(u_1 = (1, 0, 1, 1)\) et \(u_2 = (0, 1, 1, -1)\), et \(G\) le sous-espace défini par le système \(x_1 + x_2 + x_3 + x_4 = 0\), \(x_1 - x_4 = 0\).</div>
  <div class="q"><strong>Q1.</strong> Donner un système d'équations de \(F\).</div>
  <div class="q"><strong>Q2.</strong> Donner la dimension et une base de \(G\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(F \cap G\). Que peut-on en conclure ?</div>
  <div class="q"><strong>Q4.</strong> Décomposer \(e_1 = (1, 0, 0, 0)\) selon cette décomposition.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(u_1\) et \(u_2\) ne sont pas colinéaires : \(\dim F = 2\), il faut \(4 - 2 = 2\) équations. \(x \in F\) si et seulement s'il existe \(\lambda, \mu\) tels que \(x = (\lambda, \mu, \lambda + \mu, \lambda - \mu)\) ; avec \(\lambda = x_1\) et \(\mu = x_2\), les deux dernières coordonnées imposent</p>
  <div class="formula">$$F : \left\{\begin{aligned} x_1 + x_2 - x_3 &= 0 \\ x_1 - x_2 - x_4 &= 0. \end{aligned}\right.$$</div>
  <p>Contrôle sur \(u_1\) : \(1 + 0 - 1 = 0\) et \(1 - 0 - 1 = 0\) ; sur \(u_2\) : \(0 + 1 - 1 = 0\) et \(0 - 1 + 1 = 0\).</p>
  <p><strong>Q2.</strong> Les deux équations de \(G\) ne sont pas proportionnelles : \(\dim G = 4 - 2 = 2\). Avec \(x_4 = x_1\) puis \(x_2 = -2x_1 - x_3\), les inconnues libres \(x_1\) et \(x_3\) donnent la base \(\big((1, -2, 0, 1), (0, -1, 1, 0)\big)\).</p>
  <p><strong>Q3.</strong> Un vecteur de \(F\) s'écrit \((\lambda, \mu, \lambda + \mu, \lambda - \mu)\). La seconde équation de \(G\) donne \(\lambda - (\lambda - \mu) = \mu = 0\), la première \(3\lambda + \mu = 0\), donc \(\lambda = 0\) : \(F \cap G = \{0\}\). Comme \(\dim F + \dim G = 4\), on conclut que \(\mathbb{R}^4 = F \oplus G\).</p>
  <p><strong>Q4.</strong> On cherche \(e_1 = \lambda u_1 + \mu u_2 + g\) avec \(g \in G\). Le vecteur \(g = (1 - \lambda, -\mu, -\lambda - \mu, -\lambda + \mu)\) doit vérifier les équations de \(G\) : \(1 - 3\lambda - \mu = 0\) et \(1 - \mu = 0\), d'où \(\mu = 1\), \(\lambda = 0\). Ainsi</p>
  <div class="formula">$$e_1 = \underbrace{(0, 1, 1, -1)}_{=\,u_2\ \in\ F} + \underbrace{(1, -1, -1, 1)}_{\in\ G}.$$</div></div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Trois plans et un système à paramètres</h3>
  <div class="statement">Soit \(m\) et \(b\) deux réels. On étudie le système d'inconnues réelles \(x, y, z\) :</div>
  <div class="formula">$$\left\{\begin{aligned} x + y + z &= 1 \\ x + 2y + mz &= 2 \\ 2x + 3y + 4z &= b. \end{aligned}\right.$$</div>
  <div class="q"><strong>Q1.</strong> Calculer le déterminant de la matrice \(A\) du système. Pour quelles valeurs de \(m\) le système a-t-il une unique solution ? La calculer.</div>
  <div class="q"><strong>Q2.</strong> On suppose \(m = 3\). Déterminer le rang de \(A\), la condition de compatibilité sur \(b\) et, lorsqu'elle est remplie, l'ensemble des solutions.</div>
  <div class="q"><strong>Q3.</strong> Interpréter géométriquement les différents cas à l'aide des trois plans de l'espace définis par les équations.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> En développant selon la première ligne :</p>
  <div class="formula">$$\det A = (8 - 3m) - (4 - 2m) + (3 - 4) = 3 - m.$$</div>
  <p>Si \(m \neq 3\), \(A\) est inversible (rang 3) : le système a une unique solution. Les opérations \(L_2 \leftarrow L_2 - L_1\) et \(L_3 \leftarrow L_3 - 2L_1\) donnent \(y + (m - 1)z = 1\) et \(y + 2z = b - 2\) ; leur différence donne \((m - 3)z = 3 - b\). En posant \(k = \dfrac{b - 3}{3 - m}\), on obtient</p>
  <div class="formula">$$z = k, \quad y = 1 - (m - 1)k, \quad x = (m - 2)k.$$</div>
  <p>Contrôle : pour \(b = 3\), \(k = 0\) et \((x, y, z) = (0, 1, 0)\) vérifie bien les trois équations.</p>
  <p><strong>Q2.</strong> Pour \(m = 3\), la troisième ligne de \(A\), \((2, 3, 4)\), est la somme des deux premières, \((1, 1, 1)\) et \((1, 2, 3)\), qui ne sont pas proportionnelles : \(\operatorname{rg} A = 2\). Le système est compatible si et seulement si le second membre vérifie la même relation : \(b = 1 + 2 = 3\). Dans ce cas, \(X_0 = (0, 1, 0)\) est solution et \(\ker A\) est donné par \(x + y + z = 0\), \(y + 2z = 0\), soit \(\ker A = \operatorname{Vect}\big((1, -2, 1)\big)\). Ainsi</p>
  <div class="formula">$$\mathcal{S} = (0, 1, 0) + \operatorname{Vect}\big((1, -2, 1)\big).$$</div>
  <p><strong>Q3.</strong> Les vecteurs normaux \((1, 1, 1)\), \((1, 2, m)\), \((2, 3, 4)\) ne sont jamais deux à deux proportionnels : deux des plans se coupent toujours selon une droite.</p>
  <ul>
    <li>\(m \neq 3\) : les trois plans ont un unique point commun.</li>
    <li>\(m = 3\), \(b = 3\) : les trois plans contiennent une même droite, dirigée par \((1, -2, 1)\).</li>
    <li>\(m = 3\), \(b \neq 3\) : aucun point commun ; les trois droites d'intersection deux à deux sont parallèles (toutes dirigées par \((1, -2, 1)\)) et distinctes, les plans forment un « prisme ».</li>
  </ul></div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Évaluations, hyperplans et sommes directes dans \(\mathbb{R}_3[X]\)</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : hyperplans, intersection d'hyperplans, somme directe de plusieurs sous-espaces, systèmes linéaires).</div>
  <div class="statement">On note \(E = \mathbb{R}_3[X]\). Pour tout réel \(a\), on note \(\varphi_a : E \to \mathbb{R}\), \(P \mapsto P(a)\), et \(H_a = \ker \varphi_a\). On fixe les quatre réels \(a_0 = -1\), \(a_1 = 0\), \(a_2 = 1\), \(a_3 = 2\).</div>

  <p class="exo-part">Partie A — Hyperplans d'évaluation</p>
  <div class="q"><strong>A1.</strong> Montrer que \(H_a\) est un hyperplan de \(E\), puis que \(E = H_a \oplus \mathbb{R}_0[X]\) ; écrire la décomposition d'un polynôme \(P\).</div>
  <div class="q"><strong>A2.</strong> Soit \(a, b, c\) trois réels distincts. Quelle minoration de \(\dim(H_a \cap H_b \cap H_c)\) le cours donne-t-il ? Déterminer cette intersection et en déduire que les trois équations \(P(a) = 0\), \(P(b) = 0\), \(P(c) = 0\) sont indépendantes.</div>
  <div class="q"><strong>A3.</strong> Montrer que \(H_{a_0} \cap H_{a_1} \cap H_{a_2} \cap H_{a_3} = \{0\}\). En déduire que \(\Phi : P \mapsto \big(P(a_0), P(a_1), P(a_2), P(a_3)\big)\) est un isomorphisme de \(E\) sur \(\mathbb{R}^4\).</div>

  <p class="exo-part">Partie B — Une somme directe de quatre droites</p>
  <div class="q"><strong>B1.</strong> Justifier que, pour chaque \(k \in \{0, 1, 2, 3\}\), il existe un unique \(L_k \in E\) tel que \(L_k(a_j) = 1\) si \(j = k\) et \(L_k(a_j) = 0\) sinon. Donner \(L_1\) et \(L_3\) sous forme factorisée.</div>
  <div class="q"><strong>B2.</strong> On note \(D_k = \operatorname{Vect}(L_k)\). Montrer que la somme \(D_0 + D_1 + D_2 + D_3\) est directe, puis que \(E = D_0 \oplus D_1 \oplus D_2 \oplus D_3\).</div>
  <div class="q"><strong>B3.</strong> Montrer que la décomposition de \(P \in E\) est \(P = P(a_0)L_0 + P(a_1)L_1 + P(a_2)L_2 + P(a_3)L_3\). Que vaut \(L_0 + L_1 + L_2 + L_3\) ? Décomposer \(X^3\).</div>

  <p class="exo-part">Partie C — Un système linéaire et son interprétation</p>
  <div class="q"><strong>C1.</strong> Déterminer l'ensemble \(\mathcal{S}\) des \(P \in E\) tels que \(P(-1) = 0\), \(P(0) = 1\), \(P(1) = 2\). Quelle est sa nature géométrique ? Est-ce un sous-espace de \(E\) ?</div>
  <div class="q"><strong>C2.</strong> Déterminer l'unique élément de \(\mathcal{S}\) qui s'annule en 2.</div>

  <p class="exo-part">Partie D — Application : une formule d'intégration exacte</p>
  <div class="q"><strong>D1.</strong> À l'aide de B3, montrer qu'il existe des réels \(c_0, c_1, c_2, c_3\) tels que, pour tout \(P \in E\) :</div>
  <div class="formula">$$\int_{-1}^{2} P(t)\,\mathrm{d}t = c_0P(-1) + c_1P(0) + c_2P(1) + c_3P(2).$$</div>
  <div class="q"><strong>D2.</strong> Calculer les \(c_k\) en appliquant cette égalité à \(1, X, X^2, X^3\). La formule reste-t-elle exacte pour \(P = X^4\) ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>A1.</strong> \(\varphi_a\) est linéaire et non nulle (\(\varphi_a(1) = 1\)) : \(H_a\) est un hyperplan, de dimension 3. Comme \(\varphi_a(1) \neq 0\), la droite des constantes est un supplémentaire de \(H_a\), et la décomposition est \(P = \big(P - P(a)\big) + P(a)\).</p>
  <p><strong>A2.</strong> L'intersection de trois hyperplans d'un espace de dimension 4 est de dimension au moins \(4 - 3 = 1\). Un polynôme de \(H_a \cap H_b \cap H_c\) a les trois racines distinctes \(a, b, c\) : il est divisible par \(Q = (X - a)(X - b)(X - c)\), de degré 3, donc de la forme \(\lambda Q\). Réciproquement \(\lambda Q\) convient : \(H_a \cap H_b \cap H_c = \operatorname{Vect}(Q)\), de dimension exactement 1. La matrice des trois équations est donc de rang \(4 - 1 = 3\) : elles sont indépendantes.</p>
  <p><strong>A3.</strong> Un polynôme de degré au plus 3 qui s'annule en quatre points distincts est nul : l'intersection est \(\{0\}\). Or cette intersection est exactement \(\ker \Phi\) : \(\Phi\), linéaire, est injective ; comme \(\dim E = \dim \mathbb{R}^4 = 4\), c'est un isomorphisme.</p>
  <p><strong>B1.</strong> \(L_k\) est l'unique antécédent par \(\Phi\) du \(k\)-ième vecteur de la base canonique de \(\mathbb{R}^4\). Par exemple, \(L_1\) s'annule en \(-1\), \(1\), \(2\) : \(L_1 = \lambda(X + 1)(X - 1)(X - 2)\), et \(L_1(0) = 2\lambda = 1\). De même pour \(L_3\) :</p>
  <div class="formula">$$L_1 = \frac{(X + 1)(X - 1)(X - 2)}{2}, \qquad L_3 = \frac{(X + 1)X(X - 1)}{6}.$$</div>
  <p><strong>B2.</strong> Soit \(\lambda_0L_0 + \lambda_1L_1 + \lambda_2L_2 + \lambda_3L_3 = 0\). En évaluant en \(a_j\), tous les termes s'annulent sauf le \(j\)-ième : \(\lambda_j = 0\), pour chaque \(j\). Le vecteur nul n'a que la décomposition triviale : la somme est directe. Elle est de dimension \(1 + 1 + 1 + 1 = 4 = \dim E\) (base adaptée), donc égale à \(E\).</p>
  <p><strong>B3.</strong> Le polynôme \(Q = \sum_k P(a_k)L_k\) prend en chaque \(a_j\) la valeur \(P(a_j)\) : \(\Phi(Q) = \Phi(P)\), donc \(Q = P\) par injectivité de \(\Phi\). C'est la décomposition de \(P\), unique d'après B2. Pour \(P = 1\) : \(L_0 + L_1 + L_2 + L_3 = 1\). Pour \(P = X^3\) : \(X^3 = -L_0 + 0 \cdot L_1 + L_2 + 8L_3\).</p>
  <p><strong>C1.</strong> Dans la base canonique, ce sont trois équations linéaires non homogènes en les quatre coefficients de \(P\). Les équations homogènes associées définissent \(H_{-1} \cap H_0 \cap H_1 = \operatorname{Vect}\big((X + 1)X(X - 1)\big)\) (A2). Le polynôme \(P_0 = 1 + X\) est une solution particulière : \(P_0(-1) = 0\), \(P_0(0) = 1\), \(P_0(1) = 2\). Donc</p>
  <div class="formula">$$\mathcal{S} = \big\{1 + X + \lambda(X^3 - X),\ \lambda \in \mathbb{R}\big\}.$$</div>
  <p>C'est une « droite » de \(E\) qui ne passe pas par \(0\) (le polynôme nul ne vérifie pas \(P(0) = 1\)) : ce n'est pas un sous-espace.</p>
  <p><strong>C2.</strong> \(P(2) = 3 + 6\lambda = 0\) impose \(\lambda = -\tfrac{1}{2}\), d'où \(P = 1 + \tfrac{3}{2}X - \tfrac{1}{2}X^3\) ; on vérifie \(P(2) = 1 + 3 - 4 = 0\). C'est aussi \(\Phi^{-1}(0, 1, 2, 0) = L_1 + 2L_2\).</p>
  <p><strong>D1.</strong> L'intégrale est linéaire ; en l'appliquant à la décomposition de B3 :</p>
  <div class="formula">$$\int_{-1}^{2} P = \sum_{k=0}^{3} P(a_k)\int_{-1}^{2} L_k,$$</div>
  <p>ce qui donne la formule avec \(c_k = \int_{-1}^{2} L_k(t)\,\mathrm{d}t\).</p>
  <p><strong>D2.</strong> Avec \(1, X, X^2, X^3\), on obtient le système</p>
  <div class="formula">$$\left\{\begin{aligned} c_0 + c_1 + c_2 + c_3 &= 3 \\ -c_0 + c_2 + 2c_3 &= \tfrac{3}{2} \\ c_0 + c_2 + 4c_3 &= 3 \\ -c_0 + c_2 + 8c_3 &= \tfrac{15}{4}, \end{aligned}\right.$$</div>
  <p>dont l'unique solution est \((c_0, c_1, c_2, c_3) = \big(\tfrac{3}{8}, \tfrac{9}{8}, \tfrac{9}{8}, \tfrac{3}{8}\big)\) : la quatrième moins la deuxième équation donne \(6c_3 = \tfrac{9}{4}\), puis l'on remonte. Pour \(X^4\), l'intégrale vaut \(\tfrac{33}{5}\), alors que la formule donne \(\tfrac{3}{8}(1 + 0 + 3 + 16) = \tfrac{15}{2}\) : elle n'est exacte que sur \(\mathbb{R}_3[X]\), l'espace où elle a été établie.</p></div>
</div>
