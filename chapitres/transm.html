  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre décrit le maillon <strong>transmettre</strong> de la chaîne de puissance : les constituants qui adaptent vitesse, couple ou effort entre l'actionneur et l'effecteur, et qui transforment parfois une rotation en translation. On y établit leurs lois entrée-sortie (semestre 2), puis on les caractérise par leur rapport, leur rendement et leur réversibilité (semestre 3) pour savoir les choisir. Il s'appuie sur « Cinématique » (liaisons, roulement sans glissement) et sur « Statique » (lois de Coulomb).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>

      <ul>
        <li><strong>Déterminer les relations entre les grandeurs géométriques ou cinématiques</strong> : lois entrée-sortie des transmetteurs de puissance (trains d'engrenages simples, trains épicycloïdaux, roue et vis sans fin, poulies-courroie, vis-écrou, pignon-crémaillère) (C2, S2) (§1 à §4, §6).</li>
        <li><strong>Caractériser un constituant de la chaîne de puissance</strong> : transmetteurs de puissance, caractéristiques, réversibilité, domaines d'application (A3, S3) (§2, §4, §7 à §9).</li>
        <li><strong>Modéliser une action mécanique</strong> : frottement sec (lois de Coulomb), utilisé ici pour la condition de réversibilité (B2, S2) (§8).</li>

<div class="course-section">
  <div class="sec-num">§1 · ENGRENAGES</div>
  <h2>Rapport de transmission — couple — rendement</h2>
  <div class="intro">Les engrenages sont les éléments de transmission de puissance les plus courants en mécanique. Ils permettent de modifier vitesse, couple et sens de rotation entre deux axes.</div>
  <h3>Rapport de transmission d'un engrenage</h3>
  <div class="def-box">
    Deux roues dentées en prise : roue 1 (\(Z_1\) dents, \(\omega_1\)), roue 2 (\(Z_2\) dents, \(\omega_2\)). Elles ont le même <strong>module</strong> \(m\) (taille des dents) ; le rayon primitif d'une roue vaut \(R = mZ/2\).
    <strong>Condition de roulement sans glissement</strong> des cercles primitifs : les vitesses au point de contact sont égales, \(|\omega_1|\,R_1 = |\omega_2|\,R_2\), d'où
    $$\frac{\omega_2}{\omega_1} = \mp\frac{R_1}{R_2} = \mp\frac{Z_1}{Z_2}$$
    (signe − si engrènement extérieur, + si intérieur). Le <strong>rapport de transmission</strong> est \(i = \omega_s/\omega_e\) ; pour cet engrenage, \(i_{12} = \omega_2/\omega_1 = -Z_1/Z_2\) (extérieur) ou \(+Z_1/Z_2\) (intérieur).
  </div>

  <h3>Couple et conservation de puissance</h3>
  <div class="prop-box">
    Pour un engrenage idéal (\(\eta=1\)) : \(P_1=P_2\), soit \(C_1\omega_1=C_2\omega_2\). Le couple est inversement proportionnel à la vitesse : \(|C_2/C_1|=|\omega_1/\omega_2|=Z_2/Z_1\).
    Avec rendement \(\eta\) : \(|C_2|=\eta\,(Z_2/Z_1)\,|C_1|\).
  </div>
  <h3>Trains d'engrenages en série</h3>
  <div class="prop-box">
    Rapport global : produit des rapports des engrenages successifs, \(i_{global}=\prod i_k\). Pour un train à axes parallèles :
    $$i_{global} = (-1)^n\,\frac{\prod Z_{\text{menantes}}}{\prod Z_{\text{menées}}}$$
    (\(n\) : nombre de contacts extérieurs). Rendement global : \(\eta_{global}=\prod\eta_k\).
    Roues intermédiaires (folles) : ne changent que le sens de rotation, pas le rapport de vitesse (leur nombre de dents apparaît au numérateur et au dénominateur).
  </div>
</div>
<div class="course-section">
  <div class="sec-num">§2 · RÉDUCTEURS ET VARIATEURS</div>
  <h2>Types de réducteurs — trains épicycloïdaux</h2>
  <div class="def-box">
    <strong>Réducteur à engrenages parallèles</strong> : axes parallèles, roues cylindriques à dents droites ou hélicoïdales (plus silencieuses). Très répandus. Rapport de 1 à 1/6 environ par étage ; au-delà, on enchaîne deux ou trois étages.
    <strong>Renvoi d'angle à engrenages coniques</strong> : axes concourants (souvent à 90°), rapport \(Z_e/Z_s\) en valeur absolue.
    <strong>Réducteur à roue et vis sans fin</strong> : axes orthogonaux non concourants. La vis porte \(Z_{vis}\) filets (souvent 1 à 4) et la roue \(Z_{roue}\) dents : \(|i| = Z_{vis}/Z_{roue}\). Rapport élevé en un seul étage (1/5 à 1/100), mais rendement modeste (0,4 à 0,9 selon l'angle d'hélice) et souvent irréversible (§8).
    <strong>Réducteur épicycloïdal</strong> : planétaire, satellites, couronne. Rapport élevé, compact, coaxial.
    <strong>Variateur</strong> : transmetteur dont le rapport se règle en continu, par exemple deux poulies à flasques mobiles reliées par une courroie (le diamètre d'enroulement change). Aujourd'hui, on fait plus souvent varier la vitesse électriquement, par un variateur électronique qui alimente le moteur.
  </div>
  <h3>Train épicycloïdal — les trois éléments</h3>
  <div class="def-box">
    Un train épicycloïdal a trois éléments en liaison pivot coaxiale avec le bâti : le <strong>planétaire</strong> (\(p\), denture extérieure \(Z_p\)), la <strong>couronne</strong> (\(c\), denture intérieure \(Z_c\)) et le <strong>porte-satellites</strong> (\(ps\)). Les <strong>satellites</strong> (\(Z_{sat}\)) engrènent simultanément avec le planétaire (contact extérieur) et la couronne (contact intérieur), et tournent autour de l'axe central portés par le porte-satellites. Relation géométrique : \(Z_c = Z_p + 2Z_{sat}\).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LA FORMULE DE WILLIS — PLUSIEURS APPROCHES</div>
  <h2>Établir le rapport d'un train épicycloïdal</h2>
  <div class="intro">Le porte-satellites mobile interdit d'appliquer directement la loi des engrenages (valable pour des axes fixes). On présente ici trois chemins équivalents pour obtenir la relation de Willis — choisis celui qui te parle le plus.</div>

  <h3>Approche 1 — Changement de référentiel (la plus fondamentale)</h3>
  <div class="prop-box">
    On se place dans le <strong>référentiel du porte-satellites</strong> \(\mathcal{R}_{ps}\) : vu de là, les axes des satellites sont fixes → le train redevient un <strong>train ordinaire</strong> et la loi des engrenages s'applique aux <strong>vitesses relatives</strong> \(\omega_{x/ps} = \omega_x - \omega_{ps}\) :
    $$\lambda = \frac{\omega_{p} - \omega_{ps}}{\omega_{c} - \omega_{ps}} = (-1)^{k}\,\frac{\prod Z_{\text{menantes}}}{\prod Z_{\text{menées}}} = -\frac{Z_c}{Z_p}$$
    \(\lambda\) est la <strong>raison basique</strong> du train (rapport « porte-satellites bloqué », écrit ici de la couronne, menante, vers le planétaire, mené). Pour le train simple : un contact extérieur (planétaire–satellite) et un intérieur (satellite–couronne), d'où \(k=1\) inversion et \(\lambda=-Z_c/Z_p\).
  </div>

  <h3>Approche 2 — Tableau de Willis (méthode tabulaire systématique)</h3>
  <div class="prop-box">
    On décompose le mouvement de chaque pièce en <strong>entraînement</strong> (rotation d'ensemble \(\omega_{ps}\)) + <strong>relatif</strong> (rotation dans \(\mathcal{R}_{ps}\)). On remplit un tableau, la dernière ligne donnant les \(\omega\) réelles :
    $$
    \begin{array}{l|ccc}
     & \text{planétaire} & \text{satellite} & \text{couronne}\\\hline
    \text{entraînement} & \omega_{ps} & \omega_{ps} & \omega_{ps}\\
    \text{relatif }(/ps) & \omega'_p & \omega'_{sat} & \omega'_c\\\hline
    \text{réel} & \omega_p & \omega_{sat} & \omega_c
    \end{array}
    $$
    avec, dans \(\mathcal{R}_{ps}\), \(\omega'_p = -\dfrac{Z_{sat}}{Z_p}\,\omega'_{sat}\) et \(\omega'_c = +\dfrac{Z_{sat}}{Z_c}\,\omega'_{sat}\) (contact intérieur). En éliminant \(\omega'_{sat}\) : \(\dfrac{\omega'_p}{\omega'_c}=-\dfrac{Z_c}{Z_p}\), soit Willis.
  </div>

  <h3>Approche 3 — Cinématique directe (roulement sans glissement)</h3>
  <div class="prop-box">
    On écrit le <strong>RSG aux deux points de contact</strong> du satellite. Le centre \(O_{sat}\) du satellite, à l'entraxe \(e = (Z_p+Z_{sat})\tfrac{m}{2}\) de l'axe, a pour vitesse \(v_{O_{sat}} = \omega_{ps}\,e\). En \(I\) (contact planétaire/satellite) et \(J\) (contact satellite/couronne), l'égalité des vitesses de glissement nulle relie \(\omega_p\), \(\omega_{sat}\), \(\omega_c\) aux rayons primitifs. On retrouve, sans dérivation abstraite, la même relation de Willis.
  </div>

  <h3>Exploiter Willis : les trois configurations à un étage</h3>
  <div class="prop-box">
    On impose un élément fixe, puis on lit le rapport entrée→sortie :
    <ul style="margin-top:.3rem">
      <li><strong>Couronne fixe</strong> (\(\omega_c=0\)) : \(\dfrac{\omega_p}{\omega_{ps}} = 1+\dfrac{Z_c}{Z_p}\) → réducteur planétaire→porte-satellites de rapport \(\dfrac{Z_p}{Z_p+Z_c}\).</li>
      <li><strong>Planétaire fixe</strong> (\(\omega_p=0\)) : \(\dfrac{\omega_c}{\omega_{ps}} = 1+\dfrac{Z_p}{Z_c}\) → réducteur couronne→porte-satellites de rapport \(\dfrac{Z_c}{Z_p+Z_c}\).</li>
      <li><strong>Porte-satellites fixe</strong> (\(\omega_{ps}=0\)) : \(\dfrac{\omega_p}{\omega_c}=\lambda=-\dfrac{Z_c}{Z_p}\) → simple <strong>inverseur</strong> (train ordinaire).</li>
    </ul>
    En inversant entrée et sortie, chaque configuration devient un multiplicateur.
    <strong>Trains composés</strong> (plusieurs étages, satellites doubles) : la raison basique se généralise en \(\lambda = (-1)^n\,\dfrac{\prod Z_{\text{menantes}}}{\prod Z_{\text{menées}}}\) (\(n\) = nombre de contacts extérieurs).
  </div>
  <div class="notice">Le simulateur du chapitre applique exactement ces relations : change le bâti, l'entrée et la sortie pour voir le rapport recalculé en direct par Willis.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · COURROIES ET CHAÎNES</div>
  <h2>Transmission par adhérence ou obstacle</h2>
  <div class="def-box">
    <strong>Courroie plate ou trapézoïdale</strong> : transmission par adhérence entre poulies. La courroie défile à la vitesse \(v = R_1\omega_1 = R_2\omega_2\) (au glissement près), d'où le rapport \(\omega_2/\omega_1=D_1/D_2\) (D = diamètre primitif). Courroie ouverte : même sens de rotation ; croisée : sens inverses. Silencieuse, flexible, elle autorise de grands entraxes, mais un glissement de 1 à 3 % est possible ; il protège la transmission en cas de blocage.
    <strong>Chaîne et pignons</strong> : transmission par obstacle (maillons). Sans glissement, rapport exact. Rapport : \(\omega_2/\omega_1=Z_1/Z_2\).
    <strong>Courroie crantée</strong> : comme la chaîne, sans glissement, et silencieuse. Utilisée en distribution automobile et sur les axes linéaires légers (§6).
  </div>
  <h3>Tensions et effort dans la courroie</h3>
  <div class="prop-box">
    Côté tendu : \(F_1\), côté mou : \(F_2\). Effort transmissible : \(F_1-F_2\), soit un couple \((F_1-F_2)R\) sur une poulie de rayon \(R\). Équation d'Euler pour la transmission par adhérence : \(F_1/F_2 \leq e^{\mu\theta}\) où \(\mu\) est le coefficient de frottement et \(\theta\) l'angle d'enroulement (en radians).
  </div>
</div>
<div class="course-section">
  <div class="sec-num">§5 · ACCOUPLEMENT ET EMBRAYAGE</div>
  <h2>Connexion d'arbres — transmission de couple</h2>
  <div class="def-box">
    <strong>Accouplement rigide</strong> : arbres coaxiaux, solidaires en rotation et translation. Transmet couple et effort axial, mais exige un alignement parfait.
    <strong>Accouplement élastique</strong> (élément en élastomère) : compense de petits désalignements et amortit les chocs. Protège les roulements et le moteur.
    <strong>Joints d'Oldham et de cardan</strong> : accouplements articulés, sans amortissement ; le joint d'Oldham accepte un décalage parallèle des axes, le cardan un angle entre eux (un cardan seul n'est pas homocinétique).
    <strong>Embrayage à friction</strong> : disques pressés l'un contre l'autre. Couple transmissible : \(C=n\,\mu F_n R_{moyen}\) (\(n\) surfaces de frottement, \(n = 2\) pour un disque serré entre deux plateaux). Glissement lors du patinage → dissipation thermique.
    <strong>Embrayage électromagnétique</strong> : commande électrique instantanée. Utilisé dans les automatismes.
    <strong>Frein</strong> : même principe qu'un embrayage, l'une des deux pièces étant le bâti (rôle dans la sécurité : §8).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TRANSFORMER UNE ROTATION EN TRANSLATION</div>
  <h2>Système vis-écrou et pignon-crémaillère</h2>
  <div class="intro">Beaucoup d'effecteurs se déplacent en ligne droite (table de machine, porte, plateau élévateur) alors que les moteurs tournent. Deux transmetteurs font la conversion : le système vis-écrou, lent et puissant, et le pignon-crémaillère, adapté aux grandes courses. Leurs lois entrée-sortie se lisent sur la géométrie.</div>
  <h3>Système vis-écrou</h3>
  <div class="def-box"><strong>Pas et filets.</strong> Le <strong>pas</strong> \(p\) est la distance, mesurée parallèlement à l'axe, entre deux sommets voisins du filetage. Une vis peut porter \(n\) filets (\(n\) hélices parallèles) : à chaque tour, l'écrou avance alors du <strong>pas de l'hélice</strong> \(p_h = n\,p\) (pour une vis à un filet, \(p_h = p\)). Le sens de l'hélice (à droite, cas courant, ou à gauche) fixe le sens de la translation pour un sens de rotation donné.</div>
  <p>Vis et écrou forment une liaison hélicoïdale (« Cinématique ») : leur rotation relative \(\theta\) et leur translation relative \(x\) sont liées. Le plus souvent, la vis tourne, entraînée par le moteur, et l'écrou, empêché de tourner par un guidage en translation, se déplace ; on peut aussi faire tourner l'écrou autour d'une vis fixe.</p>

<figcaption>Deux transformations de mouvement. <strong>Vis-écrou</strong> : la vis tourne, l'écrou, empêché de tourner par sa glissière, avance de p_h (pas de l'hélice) par tour, d'où v = p_h·ω/2π. <strong>Pignon-crémaillère</strong> : la ligne primitive de la crémaillère (tirets) roule sans glisser sur le cercle primitif du pignon, d'où v = R·ω.</figcaption>
</figure>

  <div class="formula" data-nom="Loi entrée-sortie d'une vis-écrou">$$x = \frac{p_h}{2\pi}\,\theta \qquad\Longrightarrow\qquad v = \frac{p_h}{2\pi}\,\omega \qquad (p_h = n\,p)$$</div>
  <p>avec \(\theta\) en rad et \(\omega\) en rad/s ; avec une fréquence de rotation \(N\) en tr/min, \(v = p_h N/60\). Le rapport \(v/\omega = p_h/2\pi\) est très petit (moins d'un millimètre par radian en général) : la vis-écrou se comporte comme un réducteur de grand rapport, qui développe un effort important sous un couple modeste.</p>
  <div class="prop-box"><strong>Effort axial.</strong> Le bilan de puissance entre la vis (couple \(C\), vitesse \(\omega\)) et l'écrou (effort \(F\), vitesse \(v\)) s'écrit \(F\,v = \eta\,C\,\omega\), d'où
    $$F = \frac{2\pi\,\eta\,C}{p_h}$$
    (\(\eta = 1\) pour une liaison parfaite). Inversement, le couple à fournir pour développer l'effort \(F\) vaut \(C = F\,p_h/(2\pi\eta)\).</div>
  <div class="method-box"><strong>Exemple — Vis à deux filets d'une table de positionnement</strong>
    <p>Une vis à deux filets de pas \(p = 3\ \text{mm}\) tourne à \(N = 600\ \text{tr/min}\).</p>
    <ol>
      <li><span class="step">Pas de l'hélice.</span> \(p_h = 2\times3 = 6\ \text{mm}\) : l'écrou avance de 6 mm par tour.</li>
      <li><span class="step">Vitesse.</span> \(v = p_h N/60 = 6\times600/60 = 60\ \text{mm/s}\) ; une course de 240 mm demande 40 tours, soit 4 s.</li>
      <li><span class="step">Effort.</span> Sous un couple \(C = 2\ \text{N·m}\), l'effort vaudrait \(2\pi\times2/0{,}006 \approx 2{,}09\ \text{kN}\) sans pertes ; avec une vis trapézoïdale de rendement 0,35 (§8), il tombe à 733 N environ.</li>
    </ol>
  </div>
  <h3>Pignon-crémaillère</h3>
  <div class="def-box"><strong>Pignon-crémaillère.</strong> La crémaillère est une roue dentée de rayon infini, c'est-à-dire une barre dentée rectiligne. Le pignon (\(Z\) dents, module \(m\)) a pour rayon primitif \(R = mZ/2\) ; son cercle primitif roule sans glisser sur la ligne primitive de la crémaillère.</div>
  <div class="formula" data-nom="Loi entrée-sortie d'un pignon-crémaillère">$$x = R\,\theta \qquad\Longrightarrow\qquad v = R\,\omega \qquad\left(R = \frac{mZ}{2}\right)$$</div>
  <p>Un tour de pignon fait avancer la crémaillère de \(2\pi R = \pi m Z\). Le bilan de puissance \(F\,v = \eta\,C\,\omega\) donne l'effort \(F = \eta\,C/R\). Le même modèle vaut pour une poulie de rayon \(R\) entraînant une courroie crantée qui porte un chariot, ou pour le tambour d'un treuil qui enroule un câble.</p>
  <div class="method-box"><strong>Exemple — Pignon de module 2</strong>
    <p>Pignon de \(Z = 20\) dents, module \(m = 2\ \text{mm}\) : \(R = 20\ \text{mm}\). À 30 tr/min (\(\omega = \pi\ \text{rad/s}\)), la crémaillère avance à \(v = 0{,}020\times\pi \approx 62{,}8\ \text{mm/s}\), soit 125,7 mm par tour. Un couple de 8 N·m sur le pignon donne, sans pertes, un effort \(F = 8/0{,}020 = 400\ \text{N}\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre le pas \(p\) au lieu du pas de l'hélice \(p_h = n\,p\) sur une vis à plusieurs filets (vitesse et effort faux d'un facteur \(n\)), ou le diamètre extérieur du pignon au lieu de son diamètre primitif \(mZ\). Vérifier aussi les unités : \(p_h\) en mètres pour obtenir \(v\) en m/s.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · RENDEMENT D'UN TRANSMETTEUR</div>
  <h2>Pertes, rendement direct et rendement inverse</h2>
  <div class="intro">Un transmetteur réel dissipe une partie de la puissance qu'il reçoit : frottement des dentures et des filets, roulements, déformation et glissement des courroies, brassage de l'huile. Le rendement chiffre ces pertes ; il fixe la puissance du moteur et l'échauffement.</div>
  <div class="def-box"><strong>Rendement.</strong> En régime permanent, le rendement est le rapport de la puissance de sortie à la puissance d'entrée :
    $$\eta = \frac{P_s}{P_e}, \qquad 0 \lt \eta \le 1, \qquad P_{pertes} = (1-\eta)\,P_e$$
    avec \(P = C\,\omega\) pour une rotation et \(P = F\,v\) pour une translation.</div>
  <div class="prop-box"><strong>Couple et effort en sortie.</strong> Pour un rapport \(i = \omega_s/\omega_e\) : \(C_s = \eta\,C_e/i\) (en valeurs absolues). Pour des transmetteurs en série, les rendements se multiplient : \(\eta = \eta_1\,\eta_2\cdots\eta_n\).</div>
  <p><strong>Marche directe et marche inverse.</strong> En marche normale, dite directe, le moteur fournit la puissance et la charge la reçoit. Quand la charge est <em>entraînante</em> (masse qui descend, véhicule qui ralentit), la puissance circule de la sortie vers l'entrée et c'est le moteur qui la reçoit. On définit alors le <strong>rendement inverse</strong> \(\eta'\) = puissance reçue par l'arbre d'entrée / puissance fournie par la charge. Pour les engrenages et la vis à billes, \(\eta' \approx \eta\) ; pour une vis à glissement ou une roue et vis sans fin, \(\eta'\) est nettement plus faible que \(\eta\), voire nul (§8).</p>
  <div class="method-box"><strong>Exemple — Chaîne de transmission d'un axe linéaire</strong>
    <p>Moteur → réducteur à engrenages (\(\eta_1 = 0{,}96\)) → courroie crantée (\(\eta_2 = 0{,}95\)) → vis à billes (\(\eta_3 = 0{,}90\)). Rendement global : \(\eta = 0{,}96\times0{,}95\times0{,}90 \approx 0{,}82\). Pour fournir 500 W à la charge, le moteur doit délivrer \(500/0{,}82 \approx 609\ \text{W}\) : environ 109 W de pertes chauffent les composants.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le rendement dans le mauvais sens. En marche directe, on <em>divise</em> la puissance utile par \(\eta\) pour obtenir celle du moteur (\(P_{moteur} = P_{charge}/\eta\)) ; en marche inverse, la puissance qui arrive au moteur vaut \(\eta'\,P_{charge}\). Ordres de grandeur des rendements : tableau du §9.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · RÉVERSIBILITÉ D'UN TRANSMETTEUR</div>
  <h2>La charge peut-elle entraîner le moteur ?</h2>
  <div class="intro">Le moteur entraîne la charge à travers le transmetteur ; la question inverse se pose dès que la charge peut bouger d'elle-même : une masse soulevée peut-elle redescendre en faisant tourner le moteur ? La réponse, donnée par le frottement, décide de la sécurité du système, du besoin d'un frein et de la possibilité de récupérer de l'énergie.</div>
  <div class="def-box"><strong>Réversibilité.</strong> Un transmetteur est <strong>réversible</strong> si un effort (ou un couple) appliqué sur sa sortie peut mettre son entrée en mouvement ; il est <strong>irréversible</strong> sinon : la sortie reste immobile tant que l'entrée ne tourne pas, quelle que soit la charge.</div>
  <p>Engrenages, trains épicycloïdaux, courroies, chaînes, pignon-crémaillère et vis à billes sont réversibles : leurs pertes sont faibles dans les deux sens. Seuls des transmetteurs à <strong>glissement</strong> sous fort frottement peuvent être irréversibles : la vis-écrou à filet trapézoïdal (ou triangulaire) et la roue et vis sans fin.</p>
  <h3>Condition liée au frottement</h3>
  <p>Déroulé sur un tour, le filet d'une vis de diamètre moyen \(d_m\) est un plan incliné de longueur \(\pi d_m\) et de hauteur \(p_h\). On note \(\alpha\) son <strong>angle d'hélice</strong> et \(f = \tan\varphi\) le coefficient de frottement entre les filets (\(\varphi\) : angle de frottement des lois de Coulomb, « Statique »).</p>

</figure>

  <div class="formula" data-nom="Angle d'hélice d'une vis">$$\tan\alpha = \frac{p_h}{\pi\,d_m}, \qquad f = \tan\varphi$$</div>
  <div class="prop-box"><strong>Condition d'irréversibilité.</strong> Une vis-écrou, ou une roue et vis sans fin menée par la vis, est irréversible si et seulement si
    $$\alpha \le \varphi \qquad \left(\text{soit } \tan\alpha \le f\right)$$
    Une transmission irréversible a un rendement direct inférieur à 50 %.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Plan incliné et angle de frottement</span>
    <div class="content">
      <p>On isole l'élément d'écrou chargé de l'effort axial \(F\) et poussé par l'effort tangentiel \(T = 2C/d_m\) dû au couple \(C\) de la vis (figure). À la limite du glissement, la réaction \(R\) du filet fait l'angle \(\varphi\) avec la normale, du côté opposé au glissement.</p>
      <p><strong>Montée</strong> (la vis entraîne la charge). L'équilibre des trois forces \(F\), \(T\), \(R\) impose à \(R\) de faire l'angle \(\alpha+\varphi\) avec la direction de \(F\) (l'axe de la vis), d'où \(T = F\tan(\alpha+\varphi)\). Sans frottement, \(T_0 = F\tan\alpha\) suffirait ; le rendement direct vaut</p>
      <div class="formula">$$\eta = \frac{T_0}{T} = \frac{\tan\alpha}{\tan(\alpha+\varphi)}$$</div>
      <p><strong>Descente.</strong> Le glissement change de sens, \(R\) passe de l'autre côté de la normale et l'effort tangentiel qui équilibre la charge vaut \(T' = F\tan(\alpha-\varphi)\). Si \(\alpha \gt \varphi\), \(T' \gt 0\) : il faut <em>retenir</em> la vis, la charge peut l'entraîner (réversible), avec le rendement inverse \(\eta' = \tan(\alpha-\varphi)/\tan\alpha\). Si \(\alpha \le \varphi\), \(T' \le 0\) : il faudrait <em>pousser</em> la vis pour faire descendre la charge, qui reste donc immobile seule (irréversible).</p>
      <p><strong>Rendement d'une vis irréversible.</strong> \(\eta\) croît avec \(\alpha\) sur l'intervalle \(\alpha \le \varphi\) ; à la limite \(\alpha = \varphi\), \(\eta = \tan\varphi/\tan 2\varphi = (1-\tan^2\varphi)/2\), qui est inférieur à 1/2.</p>
      <p>Ces formules de rendement ne sont pas à apprendre : il faut savoir retrouver \(T = F\tan(\alpha+\varphi)\) sur le plan incliné et retenir la condition \(\alpha \le \varphi\).</p>
    </div>
  </div>
  <div class="method-box"><strong>Exemple — Trois transmetteurs face à la réversibilité</strong>
    <ol>
      <li><span class="step">Vis trapézoïdale.</span> Tr 24×5 (un filet, \(p_h = 5\ \text{mm}\), \(d_m = 21{,}5\ \text{mm}\)), acier sur bronze, \(f = 0{,}12\) : \(\tan\alpha = 5/(\pi\times21{,}5) \approx 0{,}074\), \(\alpha \approx 4{,}2°\) ; \(\varphi = \arctan 0{,}12 \approx 6{,}8°\). Comme \(\alpha \le \varphi\), la vis est <strong>irréversible</strong>, avec \(\eta \approx \tan 4{,}2°/\tan 11{,}1° \approx 0{,}38\).</li>
      <li><span class="step">Vis à billes.</span> Diamètre 25 mm, pas 10 mm : \(\alpha \approx 7{,}3°\), et le roulement des billes ramène \(f\) à 0,005 environ (\(\varphi \approx 0{,}3°\)). La vis est <strong>réversible</strong>, avec \(\eta \approx \eta' \approx 0{,}96\).</li>
      <li><span class="step">Roue et vis sans fin.</span> Module 2 mm, vis de diamètre primitif 32 mm, \(f = 0{,}1\) (\(\varphi \approx 5{,}7°\)). À un filet, \(\tan\alpha = 2/32\), \(\alpha \approx 3{,}6°\) : irréversible, \(\eta \approx 0{,}38\). À quatre filets, \(\tan\alpha = 8/32\), \(\alpha \approx 14°\) : réversible, \(\eta \approx 0{,}70\) et \(\eta' \approx 0{,}59\).</li>
    </ol>
  </div>
  <h3>Conséquences sur la sécurité et le choix d'un frein</h3>
  <ul>
    <li><strong>Transmission irréversible</strong> : la charge est maintenue moteur arrêté, sans consommer d'énergie (cric, vérin de réglage, portail entraîné par roue et vis). Mais le rendement est faible (moins de 50 %) : moteur plus puissant, échauffement, usure. Et la marge est fragile : le frottement baisse en mouvement, avec la lubrification ou sous les vibrations, si bien qu'une vis à peine irréversible au repos peut devenir réversible en fonctionnement.</li>
    <li><strong>Transmission réversible</strong> : bon rendement, et la charge entraînante peut renvoyer de l'énergie vers la source (récupération au freinage, si le reste de la chaîne est réversible). En contrepartie, une charge suspendue redescend dès que le moteur n'exerce plus de couple : il faut un <strong>frein</strong>, en général un <strong>frein à manque de courant</strong> (serré par des ressorts, desserré par un électroaimant tant qu'il est alimenté), qui bloque aussi la charge en cas de coupure d'alimentation.</li>
    <li>Pour une charge suspendue au-dessus de personnes (monte-charge, plateforme élévatrice), on ne compte pas sur la seule irréversibilité : on ajoute un frein et, souvent, un dispositif de sécurité (écrou de sécurité, parachute).</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une roue et vis sans fin est toujours irréversible. Tout dépend de l'angle d'hélice : une vis à plusieurs filets est souvent réversible. Autre confusion : « irréversible » ne signifie pas « avec beaucoup de pertes dans l'autre sens », mais « impossible à entraîner par la sortie ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SYNTHÈSE : CHOISIR UN TRANSMETTEUR</div>
  <h2>Caractéristiques et domaines d'application</h2>
  <div class="intro">Le choix d'un transmetteur part du mouvement à produire (rotation ou translation, position relative des axes) et du rapport de transmission nécessaire, puis compare rendement, réversibilité, précision (jeu), encombrement, bruit et coût. Le tableau donne des ordres de grandeur courants ; les valeurs exactes se lisent dans la documentation du constructeur.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th>Transmetteur</th><th>Mouvement</th><th>Loi ou rapport</th><th>Rendement</th><th>Réversible</th><th>Domaines d'application</th></tr>
    <tr><td>Engrenages cylindriques</td><td>rotation, axes parallèles</td><td>\(-Z_e/Z_s\), jusqu'à 1/6 environ par étage</td><td>0,95 à 0,99 par étage</td><td>oui</td><td>réducteurs, boîtes de vitesses</td></tr>
    <tr><td>Engrenages coniques</td><td>rotation, axes concourants</td><td>\(Z_e/Z_s\) en valeur absolue</td><td>0,94 à 0,98</td><td>oui</td><td>renvois d'angle, différentiels</td></tr>
    <tr><td>Train épicycloïdal</td><td>rotation, axes confondus</td><td>Willis, 1/3 à 1/10 par étage</td><td>0,95 à 0,98</td><td>oui</td><td>motoréducteurs compacts, boîtes automatiques</td></tr>
    <tr><td>Roue et vis sans fin</td><td>rotation, axes orthogonaux non concourants</td><td>\(Z_{vis}/Z_{roue}\), 1/5 à 1/100</td><td>0,4 à 0,9</td><td>selon \(\alpha\) (souvent non à un filet)</td><td>grands rapports, levage lent, portails</td></tr>
    <tr><td>Poulies et courroie lisse ou trapézoïdale</td><td>rotation, axes éloignés</td><td>\(\approx D_e/D_s\), glissement de 1 à 3 %</td><td>0,90 à 0,97</td><td>oui</td><td>machines, compresseurs, ventilateurs</td></tr>
    <tr><td>Courroie crantée, chaîne</td><td>rotation, axes éloignés</td><td>\(Z_e/Z_s\) exact</td><td>0,95 à 0,98</td><td>oui</td><td>distribution de moteur, vélo, convoyeurs</td></tr>
    <tr><td>Vis-écrou trapézoïdale</td><td>rotation → translation</td><td>\(v = p_h\,\omega/2\pi\)</td><td>0,2 à 0,5</td><td>souvent non</td><td>crics, étaux, réglages, levage lent</td></tr>
    <tr><td>Vis à billes</td><td>rotation → translation</td><td>\(v = p_h\,\omega/2\pi\)</td><td>0,85 à 0,95</td><td>oui</td><td>machines-outils, vérins électriques, robots</td></tr>
    <tr><td>Pignon-crémaillère</td><td>rotation → translation</td><td>\(v = R\,\omega\)</td><td>0,90 à 0,97</td><td>oui</td><td>grandes courses, portails coulissants, direction</td></tr>
    <tr><td>Poulie et courroie crantée, treuil</td><td>rotation → translation</td><td>\(v = R\,\omega\)</td><td>0,90 à 0,97</td><td>oui</td><td>axes rapides et légers, levage par câble</td></tr>
  </table></div>
  <div class="method-box"><strong>Exemple — Transmission d'une plateforme élévatrice</strong>
    <p>Une plateforme doit lever 250 kg sur 1,2 m à 0,05 m/s, et ne pas descendre en cas de coupure de courant. Puissance utile : \(mgv = 250\times9{,}81\times0{,}05 \approx 123\ \text{W}\).</p>
    <ol>
      <li><span class="step">Mouvement.</span> Rotation du moteur → translation verticale : vis-écrou ou pignon-crémaillère (le treuil, à câble, est écarté pour une plateforme guidée).</li>
      <li><span class="step">Rendement.</span> Vis trapézoïdale (\(\eta \approx 0{,}35\)) : moteur de \(123/0{,}35 \approx 350\ \text{W}\) ; vis à billes (\(\eta \approx 0{,}9\)) : 136 W ; pignon-crémaillère précédé d'un réducteur (\(\eta \approx 0{,}95\times0{,}95 \approx 0{,}9\)) : 136 W environ.</li>
      <li><span class="step">Réversibilité.</span> La vis trapézoïdale tient seule la charge, mais on lui ajoute quand même un frein (vibrations, sécurité) ; les deux autres solutions exigent un frein à manque de courant.</li>
      <li><span class="step">Décision.</span> Pour quelques cycles par jour, la vis trapézoïdale avec frein reste simple et robuste ; pour un usage intensif, la vis à billes divise par 2,5 la puissance installée et l'échauffement. Le critère qui tranche (fréquence d'utilisation, coût) vient du cahier des charges.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : choisir sur le seul rapport de transmission. Deux solutions de même rapport peuvent différer d'un facteur 3 en rendement, l'une tenir la charge et l'autre non, l'une avoir du jeu (courroie, engrenages ordinaires) et l'autre presque pas (vis à billes précontrainte).</div>
</div>

<template class="pan-tpl" data-panneau="tr-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · TRANSMISSION</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à écrire la loi entrée-sortie d'une chaîne de transmission, à relier le couple du moteur à l'effort sur la charge, puis à juger la réversibilité et à choisir un transmetteur.</div>
  <div class="method-box"><strong>Méthode 1 — Calculer le rapport d'un train d'engrenages</strong>
    <ol>
      <li>Numéroter les roues et identifier celles qui engrènent directement (et celles qui sont solidaires d'un même arbre).</li>
      <li>Calculer le rapport de chaque paire : \(i_{12}=-Z_1/Z_2\) (contact extérieur), \(+Z_1/Z_2\) (contact intérieur).</li>
      <li>Multiplier les rapports successifs pour obtenir le rapport global \(i = \omega_s/\omega_e\).</li>
      <li>Vérifier le sens de rotation final : un signe − par contact extérieur (axes parallèles).</li>
    </ol>
    <p><em>Exemple éclair :</em> 1 (12 dents) mène 2 (36 dents), solidaire de 3 (15 dents) qui mène 4 (45 dents) : \(i = (-12/36)(-15/45) = +1/9\). À 1 800 tr/min en entrée, la roue 4 tourne à 200 tr/min, dans le même sens.</p>
  </div>
  <div class="method-box"><strong>Méthode 2 — Exploiter la formule de Willis</strong>
    <ol>
      <li>Identifier planétaire, couronne et porte-satellites.</li>
      <li>Identifier l'élément bloqué (ou la vitesse imposée à chaque élément).</li>
      <li>Écrire Willis : \((\omega_p-\omega_{ps})/(\omega_c-\omega_{ps})=-Z_c/Z_p\) (train simple ; sinon, raison basique calculée porte-satellites bloqué).</li>
      <li>Remplacer la vitesse connue, puis résoudre pour l'inconnue cherchée.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(Z_p = 30\), \(Z_c = 90\), couronne fixe, \(\omega_p = 120\ \text{rad/s}\) : \((120-\omega_{ps})/(0-\omega_{ps}) = -3\), d'où \(120 = 4\,\omega_{ps}\) et \(\omega_{ps} = 30\ \text{rad/s}\) (réduction de 1/4, même sens).</p>
  </div>
  <div class="method-box"><strong>Méthode 3 — Écrire la loi entrée-sortie d'une transformation rotation-translation</strong>
    <ol>
      <li>Repérer le transmetteur, la pièce qui tourne et celle qui se translate.</li>
      <li>Vis-écrou : compter les filets et calculer le pas de l'hélice \(p_h = n\,p\). Pignon-crémaillère, poulie ou tambour : rayon primitif \(R = mZ/2\) ou rayon d'enroulement.</li>
      <li>Écrire \(x = p_h\,\theta/2\pi\) ou \(x = R\,\theta\), puis \(v = p_h\,\omega/2\pi\) ou \(v = R\,\omega\) (avec \(N\) en tr/min : \(v = p_h N/60\)).</li>
      <li>Remonter jusqu'au moteur par le rapport des étages placés en amont : \(\omega_{vis} = i\,\omega_m\).</li>
    </ol>
    <p><em>Exemple éclair :</em> moteur à 1 500 tr/min, réducteur de rapport 1/5, vis à un filet de pas 4 mm : la vis tourne à 300 tr/min, l'écrou avance à \(v = 4\times300/60 = 20\ \text{mm/s}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 4 — Relier le couple du moteur à l'effort sur la charge</strong>
    <ol>
      <li>Écrire la puissance utile côté charge : \(P_u = F\,v\) (translation) ou \(C\,\omega\) (rotation).</li>
      <li>Calculer le rendement global, produit des rendements des étages.</li>
      <li>En marche directe, \(P_m = P_u/\eta\) ; le couple moteur vaut \(C_m = P_m/\omega_m\).</li>
      <li>Si la charge est entraînante (descente, freinage), raisonner en sens inverse avec le rendement inverse : la puissance reçue par le moteur vaut \(\eta'\,P_u\).</li>
    </ol>
    <p><em>Exemple éclair :</em> l'écrou de la méthode 3 pousse 1 500 N ; réducteur \(\eta = 0{,}95\), vis trapézoïdale \(\eta = 0{,}35\). \(P_u = 1\,500\times0{,}020 = 30\ \text{W}\), \(P_m = 30/(0{,}95\times0{,}35) \approx 90\ \text{W}\), \(\omega_m = 157\ \text{rad/s}\), d'où \(C_m \approx 0{,}57\ \text{N·m}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 5 — Juger la réversibilité et en déduire le besoin d'un frein</strong>
    <ol>
      <li>Engrenages, trains, courroies, chaînes, pignon-crémaillère, vis à billes : réversibles.</li>
      <li>Vis à glissement ou roue et vis sans fin : calculer l'angle d'hélice, \(\tan\alpha = p_h/(\pi d_m)\) (roue et vis : \(\tan\alpha = m\,Z_{vis}/d_{vis}\)), et l'angle de frottement \(\varphi = \arctan f\).</li>
      <li>Si \(\alpha \le \varphi\) : irréversible (contrôle : le rendement direct est inférieur à 0,5). Sinon : réversible.</li>
      <li>Conclure : charge entraînante possible → frein (à manque de courant pour tenir aussi en cas de coupure) ; irréversible → maintien sans énergie mais rendement faible, et marge à vérifier (le frottement baisse en mouvement).</li>
    </ol>
    <p><em>Exemple éclair :</em> vis à un filet, \(p_h = 3\ \text{mm}\), \(d_m = 13{,}5\ \text{mm}\), \(f = 0{,}1\) : \(\tan\alpha \approx 0{,}071\), \(\alpha \approx 4{,}0° \le \varphi \approx 5{,}7°\) : irréversible, \(\eta = \tan 4{,}0°/\tan 9{,}8° \approx 0{,}41\).</p>
  </div>
  <div class="method-box"><strong>Méthode 6 — Choisir un transmetteur à partir d'un besoin</strong>
    <ol>
      <li>Caractériser le mouvement : rotation vers rotation (axes parallèles, concourants, orthogonaux, confondus) ou rotation vers translation, avec la course.</li>
      <li>Calculer le rapport nécessaire, \(\omega_{charge}/\omega_{moteur}\) ou \(v/\omega_{moteur}\), et décider du nombre d'étages.</li>
      <li>Estimer le rendement et en déduire la puissance du moteur.</li>
      <li>Décider si la réversibilité est souhaitée (récupération, déplacement manuel) ou à éviter (maintien de la charge), et prévoir le frein en conséquence.</li>
      <li>Départager par les autres critères : jeu et précision, bruit, entretien, encombrement, coût (tableau du §9 du cours).</li>
    </ol>
    <p><em>Exemple éclair :</em> entraîner un tambour à 40 tr/min depuis un moteur à 1 400 tr/min, axes orthogonaux, sans que le tambour puisse entraîner le moteur : une roue et vis sans fin à un filet et à 35 dents (1 400/35 = 40 tr/min), irréversible si son angle d'hélice reste sous l'angle de frottement.</p>
  </div>
  <div class="notice"><strong>Piège</strong> :
    <ul style="margin-top:.4rem">
      <li>Le signe du rapport dépend du type d'engrènement : compter les inversions de sens.</li>
      <li>Les roues folles (intermédiaires) ne modifient pas le rapport de vitesse mais inversent le sens à chaque passage.</li>
      <li>Rendement global = produit des rendements : il diminue vite avec le nombre d'étages.</li>
      <li>Vis à plusieurs filets : la vitesse se calcule avec le pas de l'hélice \(p_h = n\,p\), pas avec le pas \(p\).</li>
      <li>Une roue et vis sans fin n'est pas toujours irréversible (cela dépend de l'angle d'hélice), et une transmission irréversible ne dispense pas d'un frein pour une charge suspendue.</li>
    </ul>
  </div>
</div>

<div class="exo-wrapper">
<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Engrenage simple — rapport et couple</h3>
  <div class="statement">Engrenage externe : \(Z_1=20\) dents, \(\omega_1=100\ \text{rad/s}\), couple d'entrée \(C_1=10\ \text{N·m}\), \(Z_2=60\) dents, \(\eta=0{,}97\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_2\) et le sens de rotation (externe).</div>
  <div class="q"><strong>Q2.</strong> Calculer le couple en sortie \(C_2\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance d'entrée et les pertes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_2=\omega_1\times Z_1/Z_2\) \(=100\times20/60=33{,}3\ \text{rad/s}\). Sens inversé (engrenage externe).</p>
    <p><strong>Q2.</strong> \(C_2=\eta\times(Z_2/Z_1)\times C_1\) \(=0{,}97\times3\times10=29{,}1\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> \(P_e=C_1\omega_1=1000\ \text{W}\). \(P_s=C_2\omega_2=29{,}1\times33{,}3\approx970\ \text{W}\), ce qui est bien \(\eta P_e\). Pertes : \(1000-970=30\ \text{W}\) (3 %), dissipées en chaleur.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Train d'engrenages à 3 roues</h3>
  <div class="statement">Train : roue 1 (\(Z_1=15\)) engrène avec 2 (\(Z_2=45\)) ; roue 2 et 3 (\(Z_3=20\)) sont solidaires ; roue 3 engrène avec 4 (\(Z_4=60\)). \(\omega_1=200\ \text{rad/s}\), tous les engrenages externes.</div>
  <div class="q"><strong>Q1.</strong> Calculer le rapport global \(\omega_4/\omega_1\).</div>
  <div class="q"><strong>Q2.</strong> Quel est le sens de rotation de 4 par rapport à 1 ?</div>
  <div class="q"><strong>Q3.</strong> Pour \(C_1=5\ \text{N·m}\) et \(\eta_{global}=0{,}90\), calculer \(C_4\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(i_{12}=-Z_1/Z_2=-1/3\). \(i_{34}=-Z_3/Z_4=-1/3\). \(i_{global}=i_{12}\times i_{34}=1/9\). \(\omega_4=200/9\approx22{,}2\ \text{rad/s}\).</p>
    <p><strong>Q2.</strong> Deux engrenages externes → deux inversions → sens identique à la roue 1 (les \(-\) se compensent).</p>
    <p><strong>Q3.</strong> \(C_4=\eta_{global}\times(1/i_{global})\times C_1\) \(=0{,}9\times9\times5=40{,}5\ \text{N·m}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Train épicycloïdal — formule de Willis</h3>
  <div class="statement">Train épicycloïdal : planétaire \(Z_p=20\), couronne \(Z_c=80\). La couronne est fixe (\(\omega_c=0\)). Le planétaire tourne à \(\omega_p=100\ \text{rad/s}\).</div>
  <div class="q"><strong>Q1.</strong> Appliquer la formule de Willis pour trouver \(\omega_{ps}\) (porte-satellites).</div>
  <div class="q"><strong>Q2.</strong> Calculer le rapport de réduction \(\omega_p/\omega_{ps}\).</div>
  <div class="q"><strong>Q3.</strong> Si le couple d'entrée (planétaire) est \(C_p=10\ \text{N·m}\) et \(\eta=0{,}95\), calculer le couple \(C_{ps}\) disponible sur le porte-satellites.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Willis : \(\dfrac{\omega_p-\omega_{ps}}{\omega_c-\omega_{ps}}=-\dfrac{Z_c}{Z_p}\). Avec \(\omega_c=0\) : \(\dfrac{\omega_p-\omega_{ps}}{-\omega_{ps}}=-\dfrac{80}{20}=-4\). \(\omega_p-\omega_{ps}=4\omega_{ps}\). \(\omega_p=5\omega_{ps}\). \(\omega_{ps}=100/5=20\ \text{rad/s}\).</p>
    <p><strong>Q2.</strong> Rapport : \(\omega_p/\omega_{ps}=5\) (réducteur de rapport 5).</p>
    <p><strong>Q3.</strong> Bilan de puissance : \(C_{ps}\,\omega_{ps} = \eta\,C_p\,\omega_p\), d'où \(C_{ps}=\eta\,C_p\,\omega_p/\omega_{ps}\) \(=0{,}95\times10\times5=47{,}5\ \text{N·m}\). La couronne fixe n'absorbe aucune puissance (elle ne tourne pas) mais subit un couple : le bâti encaisse la réaction.</p>
  </div>
</div>
<div class="exo">

  <div class="statement">Un vélo transmet le mouvement du pédalier à la roue arrière par une chaîne : plateau avant \(Z_1=40\) dents, pignon arrière \(Z_2=16\) dents, diamètre de roue \(D=700\ \text{mm}\). Cadence de pédalage : \(n_1=80\ \text{tr/min}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse de rotation de la roue arrière.</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse du vélo (en km/h).</div>
  <div class="q"><strong>Q3.</strong> Pour maintenir 30 km/h, quelle cadence de pédalage faut-il avec ce développement ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(n_2=n_1\times Z_1/Z_2\) \(=80\times40/16=200\ \text{tr/min}\).</p>
    <p><strong>Q2.</strong> Vitesse : \(v=\pi D n_2=\pi\times0{,}7\times200/60\) \(=7{,}33\ \text{m/s}=26{,}4\ \text{km/h}\).</p>
    <p><strong>Q3.</strong> \(v=30\ \text{km/h}=8{,}33\ \text{m/s}\). \(n_2=v/(\pi D)=8{,}33/(\pi\times0{,}7)\) \(=3{,}79\ \text{tr/s}=227\ \text{tr/min}\). \(n_1=n_2\times Z_2/Z_1=227\times16/40\) \(=90{,}9\ \text{tr/min}\approx91\ \text{tr/min}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Vis sans fin — irréversibilité</h3>
  <div class="statement">Réducteur à roue et vis sans fin : vis à un filet (\(Z_{vis}=1\)), roue \(Z_{roue}=40\), angle d'hélice de la vis \(\alpha=3°\), coefficient de frottement entre vis et roue \(f = \tan\varphi = 0{,}1\). Couple moteur \(C_m=10\ \text{N·m}\) à \(\omega_m=150\ \text{rad/s}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le rapport de transmission et \(\omega_{sortie}\).</div>
  <div class="q"><strong>Q2.</strong> Le rendement direct vaut \(\eta = \tan\alpha/\tan(\alpha+\varphi)\) (cours, §8). Calculer \(\eta\), puis le couple de sortie.</div>
  <div class="q"><strong>Q3.</strong> Le réducteur est-il irréversible ? Le résultat de Q2 est-il cohérent avec cette conclusion ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(i=Z_{vis}/Z_{roue}=1/40\). \(\omega_s=\omega_m/40=150/40=3{,}75\ \text{rad/s}\) (soit 35,8 tr/min).</p>
    <p><strong>Q2.</strong> \(\varphi = \arctan 0{,}1 \approx 5{,}71°\), donc \(\eta = \tan 3°/\tan 8{,}71°\) \(\approx 0{,}0524/0{,}1532 \approx 0{,}34\). Couple de sortie : \(C_s=\eta\,C_m/i=0{,}34\times40\times10\) \(\approx137\ \text{N·m}\). Sur les 1 500 W fournis par le moteur, près de 990 W sont perdus en frottement : le réducteur chauffe.</p>
    <p><strong>Q3.</strong> \(\alpha = 3° \le \varphi \approx 5{,}7°\) (soit \(\tan\alpha \approx 0{,}052 \le f = 0{,}1\)) : le réducteur est irréversible, la roue ne peut pas entraîner la vis (auto-blocage), ce qui permet de maintenir une position sans moteur. Cohérence : une transmission irréversible a un rendement direct inférieur à 0,5, et l'on trouve bien 0,34.</p>
  </div>
</div>
<div class="exo">
<span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Train épicycloïdal à entrée/sortie sur trois éléments</h3>
  <div class="statement">Train épicycloïdal : \(Z_p=24\), \(Z_c=72\). En mode boîte de vitesses : (a) couronne fixe, planétaire moteur ; (b) planétaire fixe, couronne moteur.</div>
  <div class="q"><strong>Q1.</strong> Cas (a) : calculer \(\omega_{ps}/\omega_p\).</div>
  <div class="q"><strong>Q2.</strong> Cas (b) : calculer \(\omega_{ps}/\omega_c\).</div>
  <div class="q"><strong>Q3.</strong> Comparer les deux rapports. Quel mode donne la vitesse de sortie la plus élevée pour un couple moteur donné ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Willis : \((\omega_p-\omega_{ps})/(\omega_c-\omega_{ps})\) \(=-Z_c/Z_p=-3\). \(\omega_c=0\) : \(\omega_p-\omega_{ps}=3\omega_{ps}\) → \(\omega_{ps}=\omega_p/4\). Rapport (a) : 1/4.</p>
    <p><strong>Q2.</strong> Willis avec \(\omega_p=0\) : \(-\omega_{ps}/(\omega_c-\omega_{ps})=-3\) → \(\omega_{ps}=3(\omega_c-\omega_{ps})\) → \(4\omega_{ps}=3\omega_c\) → \(\omega_{ps}/\omega_c=3/4\). Rapport (b) : 3/4.</p>
    <p><strong>Q3.</strong> Mode (b) : rapport 3/4 > 1/4. La vitesse de sortie est 3 fois plus élevée en mode (b). Conséquence : le couple en sortie est 3 fois plus faible en (b) (si même puissance). Les boîtes automatiques exploitent ces différents modes (passage de rapport) pour adapter la traction.</p>
  </div>
</div>


<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Vis-écrou et pignon-crémaillère — lois entrée-sortie</h3>
  <div class="statement">(a) Une vis à trois filets de pas \(p = 2\ \text{mm}\) tourne à \(N = 450\ \text{tr/min}\) ; son écrou, guidé en translation, porte un chariot. (b) Un pignon de \(Z = 18\) dents, de module \(m = 1{,}5\ \text{mm}\), engrène avec une crémaillère qui doit avancer à \(v = 0{,}20\ \text{m/s}\) en développant un effort \(F = 150\ \text{N}\) ; le rendement de l'engrènement vaut \(\eta = 0{,}95\).</div>
  <div class="q"><strong>Q1.</strong> (a) Calculer le pas de l'hélice puis la vitesse du chariot.</div>
  <div class="q"><strong>Q2.</strong> (a) Combien de temps et combien de tours de vis faut-il pour une course de 90 mm ?</div>
  <div class="q"><strong>Q3.</strong> (b) Calculer le rayon primitif du pignon et sa fréquence de rotation.</div>
  <div class="q"><strong>Q4.</strong> (b) Calculer le couple à appliquer au pignon.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Trois filets : \(p_h = 3\,p = 6\ \text{mm}\) par tour. \(v = p_h N/60 = 6\times450/60\) \(= 45\ \text{mm/s}\). Avec le pas \(p\) seul, on trouverait trois fois moins : c'est l'erreur classique.</p>
    <p><strong>Q2.</strong> \(t = 90/45 = 2\ \text{s}\), pendant lesquels la vis fait \(90/6 = 15\) tours (vérification : \(450\ \text{tr/min} = 7{,}5\ \text{tr/s}\), et \(7{,}5\times2 = 15\)).</p>
    <p><strong>Q3.</strong> \(R = mZ/2 = 1{,}5\times18/2\) \(= 13{,}5\ \text{mm}\). \(\omega = v/R = 0{,}20/0{,}0135\) \(\approx 14{,}8\ \text{rad/s}\), soit \(N = 60\,\omega/2\pi \approx 141\ \text{tr/min}\).</p>
    <p><strong>Q4.</strong> Bilan de puissance \(F\,v = \eta\,C\,\omega\) avec \(v = R\,\omega\) : \(C = F\,R/\eta = 150\times0{,}0135/0{,}95\) \(\approx 2{,}13\ \text{N·m}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Portail coulissant — roue et vis sans fin, pignon-crémaillère</h3>
  <div class="statement">Un portail coulissant est entraîné par un moteur tournant à \(N_m = 1\,400\ \text{tr/min}\), suivi d'un réducteur à roue et vis sans fin : vis à un filet, de module axial \(m = 1{,}5\ \text{mm}\) et de diamètre primitif \(d = 25\ \text{mm}\) ; roue de \(Z_r = 30\) dents. L'arbre de la roue porte un pignon de \(Z = 16\) dents, de module 4 mm, qui engrène avec une crémaillère fixée au portail (rendement de l'engrènement : 0,95). Le coefficient de frottement entre vis et roue vaut \(f = 0{,}08\). Pour déplacer le portail à vitesse constante, il faut vaincre un effort résistant \(F = 300\ \text{N}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse du portail et la durée d'ouverture pour une course de 4,5 m.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'angle d'hélice de la vis (\(\tan\alpha = m/d\) pour une vis à un filet) et l'angle de frottement. Le réducteur est-il réversible ? Calculer son rendement direct \(\eta_{rv} = \tan\alpha/\tan(\alpha+\varphi)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le couple que doit fournir le moteur.</div>
  <div class="q"><strong>Q4.</strong> Lors d'une coupure de courant, peut-on ouvrir le portail en le poussant ? Quelle disposition le constructeur doit-il prévoir ? Quel avantage tire-t-on, en revanche, de ce comportement ?</div>
  <div class="q"><strong>Q5.</strong> Sous les vibrations, \(f\) peut tomber à 0,05. Quel diamètre primitif minimal faudrait-il à la vis (module et nombre de filets inchangés) pour rester irréversible ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Roue : \(N_r = 1\,400/30 \approx 46{,}7\ \text{tr/min}\). Pignon : \(R = 4\times16/2 = 32\ \text{mm}\). \(v = R\,\omega = 0{,}032\times2\pi\times46{,}7/60\) \(\approx 0{,}156\ \text{m/s}\). Durée : \(4{,}5/0{,}156 \approx 29\ \text{s}\).</p>
    <p><strong>Q2.</strong> \(\tan\alpha = 1{,}5/25 = 0{,}06\), \(\alpha \approx 3{,}4°\) ; \(\varphi = \arctan 0{,}08 \approx 4{,}6°\). Comme \(\alpha \le \varphi\), le réducteur est irréversible. \(\eta_{rv} = 0{,}06/\tan 8{,}0° \approx 0{,}43\), inférieur à 0,5 comme il se doit.</p>
    <p><strong>Q3.</strong> Couple sur le pignon : \(C_p = F\,R/0{,}95 = 300\times0{,}032/0{,}95\) \(\approx 10{,}1\ \text{N·m}\). Au moteur : \(C_m = C_p/(30\,\eta_{rv})\) \(= 10{,}1/(30\times0{,}43) \approx 0{,}79\ \text{N·m}\). Puissance utile \(F v \approx 47\ \text{W}\) ; puissance du moteur \(C_m\,\omega_m \approx 0{,}79\times146{,}6 \approx 116\ \text{W}\) : la roue et vis absorbe l'essentiel des pertes.</p>
    <p><strong>Q4.</strong> Non : pousser le portail revient à vouloir entraîner la vis par la roue, ce que l'irréversibilité interdit. Le constructeur prévoit un <strong>déverrouillage manuel</strong> (débrayage du pignon ou de la roue, à clé). En contrepartie, le portail fermé reste bloqué sans serrure ni frein, moteur arrêté.</p>
    <p><strong>Q5.</strong> Il faut \(\tan\alpha \le 0{,}05\), soit \(m/d \le 0{,}05\) et \(d \ge 1{,}5/0{,}05 = 30\ \text{mm}\). Le rendement baissera encore : l'irréversibilité « garantie » se paie en énergie.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ☆</span>
  <h3>Train d'engrenages : réduction et couple</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>transmission de puissance</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un réducteur à engrenages relie un moteur (pignon \(Z_e = 20\) dents) à une charge (roue \(Z_s = 60\) dents). Le rendement de l'engrènement est \(\eta = 0{,}95\).
  </div>

  <p class="exo-part">Partie A — Rapport de transmission</p>
  <div class="q"><strong>A1.</strong> Exprimer le rapport \(i = \omega_s/\omega_e\) en fonction des nombres de dents et le calculer.</div>
  <div class="q"><strong>A2.</strong> Si le moteur tourne à \(N_e = 3000\ \text{tr/min}\), quelle est la vitesse de sortie \(N_s\) ?</div>

  <p class="exo-part">Partie B — Couple transmis</p>
  <div class="q"><strong>B1.</strong> Le couple moteur est \(C_e = 2{,}0\ \text{N·m}\). Calculer le couple disponible en sortie en tenant compte du rendement.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Au contact, les vitesses sont égales : \(Z_e\,\omega_e = Z_s\,\omega_s\), donc \(i = \dfrac{\omega_s}{\omega_e} = \dfrac{Z_e}{Z_s} = \dfrac{20}{60} = \dfrac{1}{3}\) (réducteur).</p>
    <p><strong>A2.</strong> \(N_s = i\,N_e = 3000/3 = 1000\ \text{tr/min}\).</p>
    <p><strong>B1.</strong> Conservation de la puissance avec pertes : \(P_s = \eta P_e\), soit \(C_s\,\omega_s = \eta\,C_e\,\omega_e\). D'où \(C_s = \dfrac{\eta C_e}{i}\) \(= 0{,}95\times2{,}0\times3 = 5{,}7\ \text{N·m}\) : un réducteur diminue la vitesse et augmente le couple.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ☆</span>
  <h3>Train épicycloïdal — réducteur de moyeu de vélo</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format Sciences industrielles PT (thème <em>train épicycloïdal</em>). Annales officielles : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">Banque PT</a>.
  </div>
  <div class="statement">
    Un moyeu de vélo à vitesses intégrées utilise un train épicycloïdal simple : planétaire \(Z_p = 24\) dents, couronne \(Z_c = 60\) dents, satellites engrenant avec les deux. Le <strong>planétaire est bloqué</strong> sur l'axe (fixe). L'entraînement vient du <strong>porte-satellites</strong> (lié au pédalier) et la sortie est la <strong>couronne</strong> (liée à la roue).
  </div>
  <div class="q"><strong>Q1.</strong> Donner la raison basique λ du train. <strong>Q2.</strong> Écrire Willis et en déduire \(\omega_c/\omega_{ps}\). <strong>Q3.</strong> Le train est-il réducteur ou multiplicateur ? Vérifier la cohérence avec un moyeu « vitesse rapide ».</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\lambda = -\dfrac{Z_c}{Z_p} = -\dfrac{60}{24} = -2{,}5\).</p>
    <p><strong>Q2.</strong> Willis : \(\dfrac{\omega_p-\omega_{ps}}{\omega_c-\omega_{ps}} = \lambda\). Avec \(\omega_p=0\) : \(\dfrac{-\omega_{ps}}{\omega_c-\omega_{ps}}=\lambda\) → \(\omega_c-\omega_{ps} = -\dfrac{\omega_{ps}}{\lambda}\) → \(\dfrac{\omega_c}{\omega_{ps}} = 1-\dfrac{1}{\lambda}\) \(= 1+\dfrac{Z_p}{Z_c} = 1+\dfrac{24}{60} = 1{,}4\).</p>
    <p><strong>Q3.</strong> \(\omega_c/\omega_{ps}=1{,}4 \gt 1\) : <strong>multiplicateur</strong> (même sens). La roue tourne 1,4× plus vite que le pédalier → c'est bien une « vitesse rapide ». ✓</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Tableau de Willis — vérification cinématique</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> (thème <em>méthode tabulaire de Willis</em>).
  </div>
  <div class="statement">
    Reprendre le train précédent (\(Z_p=24\), \(Z_c=60\), satellites \(Z_{sat}=18\) tels que \(Z_c=Z_p+2Z_{sat}\)), planétaire fixe, entrée porte-satellites à \(\omega_{ps}=10\ \text{rad/s}\).
  </div>
  <div class="q"><strong>Q1.</strong> Par la méthode du tableau de Willis, déterminer la rotation propre \(\omega'_{sat}\) du satellite dans le référentiel du porte-satellites. <strong>Q2.</strong> En déduire \(\omega_{sat}\) (réelle) et \(\omega_c\). Retrouver \(\omega_c/\omega_{ps}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p>Vérif. géométrie : \(Z_p+2Z_{sat}=24+36=60=Z_c\) ✓.</p>
    <p><strong>Q1.</strong> Dans \(\mathcal{R}_{ps}\), planétaire fixe réel → \(\omega'_p = \omega_p-\omega_{ps} = -10\ \text{rad/s}\). Contact planétaire/satellite (extérieur) : \(\omega'_{sat} = -\dfrac{Z_p}{Z_{sat}}\omega'_p\) \(= -\dfrac{24}{18}\times(-10) = +13{,}3\ \text{rad/s}\).</p>
    <p><strong>Q2.</strong> Contact satellite/couronne (intérieur) : \(\omega'_c = \dfrac{Z_{sat}}{Z_c}\omega'_{sat}\) \(= \dfrac{18}{60}\times13{,}3 = 4{,}0\ \text{rad/s}\). Réelles : \(\omega_{sat}=\omega_{ps}+\omega'_{sat}=23{,}3\ \text{rad/s}\) ; \(\omega_c = \omega_{ps}+\omega'_c = 10+4 = 14\ \text{rad/s}\). D'où \(\omega_c/\omega_{ps}=1{,}4\), cohérent avec Willis. ✓</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Vérin électrique d'une table de levage : vis à billes ou vis trapézoïdale ?</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème <em>transmetteurs de puissance : loi entrée-sortie, rendement, réversibilité, choix</em>).</div>
  <div class="statement">Une table de levage d'atelier soulève une charge totale \(m = 600\ \text{kg}\) (table et pièce, \(g = 9{,}81\ \text{m/s}^2\)) sur une course de 400 mm. La chaîne de puissance comprend : un moteur tournant à \(N_m = 3\,000\ \text{tr/min}\) ; un réducteur à deux étages d'engrenages extérieurs à axes parallèles (roues \(Z_1 = 18\) et \(Z_2 = 54\), puis \(Z_3 = 20\), solidaire de 2, et \(Z_4 = 50\)), de rendement 0,97 par étage dans les deux sens ; une vis à billes à un filet, de pas \(p = 5\ \text{mm}\) et de diamètre moyen \(d_m = 20\ \text{mm}\), dont l'écrou porte la table. Pour la vis à billes, le coefficient de frottement équivalent vaut \(f = 0{,}006\) et l'on retient un rendement de 0,90 dans les deux sens, paliers compris. On néglige les inerties (montée à vitesse constante).</div>
  <p class="exo-part">Partie A — Cinématique</p>
  <div class="q"><strong>A1.</strong> Calculer le rapport \(i = \omega_{vis}/\omega_m\) du réducteur. La vis tourne-t-elle dans le sens du moteur ?</div>
  <div class="q"><strong>A2.</strong> En déduire la vitesse de montée de la table et la durée de la course.</div>
  <p class="exo-part">Partie B — Puissance et couple moteur</p>
  <div class="q"><strong>B1.</strong> Calculer la puissance utile pendant la montée.</div>
  <div class="q"><strong>B2.</strong> Calculer le rendement global de la transmission, puis la puissance et le couple que doit fournir le moteur.</div>
  <p class="exo-part">Partie C — Réversibilité et frein</p>
  <div class="q"><strong>C1.</strong> Calculer l'angle d'hélice et l'angle de frottement de la vis à billes. La transmission est-elle réversible ?</div>
  <div class="q"><strong>C2.</strong> Moteur non alimenté, la table chargée tend à descendre. Calculer le couple qu'il faut exercer sur l'arbre moteur pour la retenir (utiliser les rendements inverses).</div>
  <div class="q"><strong>C3.</strong> Proposer un type de frein et son couple minimal, avec un coefficient de sécurité de 2.</div>
  <p class="exo-part">Partie D — Variante à vis trapézoïdale</p>
  <div class="q"><strong>D1.</strong> On envisage une vis trapézoïdale Tr 16×4 (un filet, pas 4 mm, diamètre moyen 14 mm), acier sur bronze, \(f = 0{,}14\). Est-elle réversible ? Calculer son rendement direct \(\eta = \tan\alpha/\tan(\alpha+\varphi)\).</div>
  <div class="q"><strong>D2.</strong> Quel rapport de réduction faut-il pour garder la même vitesse de montée ?</div>
  <div class="q"><strong>D3.</strong> Calculer la puissance que doit fournir le moteur (rendement du réducteur inchangé) et les pertes, à comparer à la solution à billes.</div>
  <div class="q"><strong>D4.</strong> Conclure : quelle solution retenir pour une table utilisée quelques fois par jour ? pour un poste qui enchaîne les levées ? La solution trapézoïdale dispense-t-elle de frein ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(i = \left(-\dfrac{18}{54}\right)\left(-\dfrac{20}{50}\right)\) \(= \dfrac{2}{15} \approx 0{,}133\). Deux contacts extérieurs : deux inversions, la vis tourne dans le sens du moteur.</p>
    <p><strong>A2.</strong> \(N_{vis} = 3\,000\times2/15 = 400\ \text{tr/min}\) ; \(v = p\,N_{vis}/60 = 5\times400/60\) \(\approx 33{,}3\ \text{mm/s}\). Course : \(400/33{,}3 = 12\ \text{s}\).</p>
    <p><strong>B1.</strong> \(F = mg = 600\times9{,}81 \approx 5\,886\ \text{N}\) ; \(P_u = F\,v = 5\,886\times0{,}0333 \approx 196\ \text{W}\).</p>
    <p><strong>B2.</strong> \(\eta = 0{,}97^2\times0{,}90 \approx 0{,}847\). \(P_m = 196/0{,}847 \approx 232\ \text{W}\) ; \(\omega_m = 3\,000\times2\pi/60 \approx 314\ \text{rad/s}\), d'où \(C_m = 232/314 \approx 0{,}74\ \text{N·m}\).</p>
    <p><strong>C1.</strong> \(\tan\alpha = p/(\pi d_m)\) \(= 5/(\pi\times20) \approx 0{,}080\), \(\alpha \approx 4{,}5°\) ; \(\varphi = \arctan 0{,}006 \approx 0{,}34°\). Comme \(\alpha \gt \varphi\), la vis à billes est réversible ; engrenages réversibles : toute la transmission l'est, la charge peut faire tourner le moteur.</p>
    <p><strong>C2.</strong> Couple exercé par la charge sur la vis, en marche inverse : \(C_{vis} = F\,p\,\eta'_{vis}/2\pi\) \(= 5\,886\times0{,}005\times0{,}90/2\pi\) \(\approx 4{,}22\ \text{N·m}\). Ramené au moteur à travers le réducteur (rapport \(i\), rendement inverse \(0{,}97^2\)) : \(C = 4{,}22\times\dfrac{2}{15}\times0{,}97^2 \approx 0{,}53\ \text{N·m}\). Il faut exercer au moins ce couple sur l'arbre moteur pour retenir la table.</p>
    <p><strong>C3.</strong> Un <strong>frein à manque de courant</strong> sur l'arbre moteur (serré par ressorts, desserré quand il est alimenté) : il retient aussi la charge en cas de coupure. Couple minimal : \(2\times0{,}53 \approx 1{,}1\ \text{N·m}\).</p>
    <p><strong>D1.</strong> \(\tan\alpha = 4/(\pi\times14) \approx 0{,}091\), \(\alpha \approx 5{,}2°\) ; \(\varphi = \arctan 0{,}14 \approx 8{,}0°\). Comme \(\alpha \le \varphi\), la vis est irréversible. \(\eta = \tan 5{,}2°/\tan 13{,}2° \approx 0{,}39\).</p>
    <p><strong>D2.</strong> \(N_{vis} = v/p = 33{,}3\times60/4\) \(= 500\ \text{tr/min}\), soit un rapport \(500/3\,000 = 1/6\).</p>
    <p><strong>D3.</strong> \(\eta_{global} = 0{,}97^2\times0{,}39 \approx 0{,}37\) ; \(P_m = 196/0{,}37 \approx 536\ \text{W}\) (couple moteur \(\approx 1{,}7\ \text{N·m}\)). Pertes : environ 340 W, contre 35 W avec la vis à billes, dix fois plus.</p>
    <p><strong>D4.</strong> Pour quelques levées par jour, la vis trapézoïdale convient : simple, peu coûteuse, elle tient la charge seule ; son mauvais rendement compte peu et l'échauffement a le temps de se dissiper. Pour un poste qui enchaîne les levées, la vis à billes s'impose : moteur deux fois moins puissant, pertes dix fois plus faibles, moins d'usure, au prix d'un frein. Dans les deux cas, une table chargée au-dessus d'un opérateur garde un frein (et un dispositif de sécurité) : l'irréversibilité, sensible aux vibrations et à la lubrification, ne suffit pas comme seule sécurité.</p>
  </div>
</div>
