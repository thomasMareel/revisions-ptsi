  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Le programme de PT ne contient pas de section « intégration sur un segment » : tout ce chapitre est un acquis de 1ʳᵉ année (programme de PTSI, sections « Intégration » et « Techniques fondamentales de calcul »), repris ici parce que la 2ᵉ année l'utilise sans cesse. Les intégrales généralisées et les intégrales à paramètre prolongent ces résultats à des intervalles quelconques ; la formule de Taylor avec reste intégral sert à développer les fonctions en séries entières ; l'inégalité de Cauchy-Schwarz est un cas particulier de celle des espaces préhilbertiens ; les sommes de Riemann et les encadrements par des intégrales reviennent dans le chapitre sur les séries.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions de 1ʳᵉ année à maîtriser, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Intégrale d'une fonction continue sur un segment</strong>, à valeurs réelles ou complexes : linéarité, relation de Chasles, positivité, croissance, inégalité triangulaire, fonction continue positive d'intégrale nulle, parité, périodicité, valeur moyenne (§1).</li>
        <li><strong>Sommes de Riemann</strong> : convergence vers l'intégrale, interprétation géométrique, démonstration pour une fonction de classe \(\mathcal{C}^1\) ; méthodes des rectangles et des trapèzes (§2).</li>
        <li><strong>Lien entre intégrale et primitive</strong> : dérivation de \(x \mapsto \int_a^x f(t)\,\mathrm{d}t\), existence de primitives, intégrale à bornes variables (§3).</li>
        <li><strong>Intégration par parties et changement de variable</strong>, sans rappeler les hypothèses de régularité dans les calculs pratiques (§4).</li>
        <li><strong>Formules de Taylor</strong> : inégalité de Taylor-Lagrange (exigible en PTSI) ; formule de Taylor avec reste intégral (non exigible en PTSI, citée par le programme de PT pour les développements en série entière) (§5).</li>
        <li><strong>Inégalité de Cauchy-Schwarz</strong> pour le produit scalaire \(\langle f, g \rangle = \int_a^b fg\) (programme de PT, Espaces préhilbertiens) et cas d'égalité (§6).</li>
        <li><strong>Intégrales de Wallis</strong> : exemple complet de suite d'intégrales (récurrence, valeurs exactes, équivalent) (§7).</li>
      </ul>
      <p>Hors programme : l'égalité de Taylor-Lagrange, la formule de Stirling, les sommes de Riemann pour des fonctions non continues (rassemblées en fin de chapitre).</p>

<div class="course-section">
  <div class="sec-num">§1 · L'INTÉGRALE SUR UN SEGMENT</div>
  <h2>Les propriétés à connaître avec leurs hypothèses exactes</h2>
  <div class="intro">Toute la théorie de 2ᵉ année repose sur l'intégrale d'une fonction continue sur un segment \([a, b]\). On en rappelle les propriétés en insistant sur les hypothèses : ce sont elles qu'on vérifiera ensuite, après un passage à la limite, pour les intégrales généralisées.</div>

  <div class="def-box">
    Soit \(f\) continue sur un segment \([a, b]\) avec \(a \lt b\), à valeurs réelles. Son <strong>intégrale</strong> \(\int_a^b f(t)\,\mathrm{d}t\) est l'aire algébrique comprise entre la courbe de \(f\) et l'axe des abscisses (comptée positivement au-dessus de l'axe, négativement en dessous) ; on la construit en 1ʳᵉ année comme limite des intégrales de fonctions en escalier qui approchent \(f\). Pour \(f\) à valeurs complexes, on pose \(\int_a^b f = \int_a^b \operatorname{Re} f + i \int_a^b \operatorname{Im} f\). Conventions : \(\int_a^a f = 0\) et \(\int_b^a f = -\int_a^b f\). La variable \(t\) est <strong>muette</strong>.
  </div>
  <div class="prop-box">
    <strong>Propriétés de l'intégrale.</strong> Pour \(f\), \(g\) continues sur \([a, b]\) et \(\lambda, \mu\) scalaires :
    <ul>
      <li><strong>linéarité</strong> : \(\int_a^b (\lambda f + \mu g) = \lambda \int_a^b f + \mu \int_a^b g\) ;</li>
      <li><strong>relation de Chasles</strong> : \(\int_a^c f = \int_a^b f + \int_b^c f\) pour tous \(a, b, c\) de l'intervalle de définition, dans n'importe quel ordre ;</li>
      <li><strong>positivité</strong> : si \(a \le b\) et \(f \ge 0\) sur \([a, b]\), alors \(\int_a^b f \ge 0\) ;</li>
      <li><strong>croissance</strong> : si \(a \le b\) et \(f \le g\) sur \([a, b]\) (fonctions réelles), alors \(\int_a^b f \le \int_a^b g\) ;</li>
      <li><strong>inégalité triangulaire</strong> (réelle ou complexe), avec la majoration qui en découle :</li>
    </ul>
    <div class="formula" data-nom="Inégalité triangulaire intégrale">$$\begin{aligned} \left|\int_a^b f(t)\,\mathrm{d}t\right| &\le \int_a^b |f(t)|\,\mathrm{d}t \\ &\le (b-a)\,\sup_{[a,b]} |f| \qquad (a \le b). \end{aligned}$$</div>
  </div>
  <div class="prop-box">
    <strong>Fonction continue positive d'intégrale nulle.</strong> Si \(f\) est <strong>continue</strong> et <strong>positive</strong> sur \([a, b]\), avec \(a \lt b\), et si \(\int_a^b f = 0\), alors \(f\) est identiquement nulle sur \([a, b]\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi une seule valeur strictement positive suffit à rendre l'intégrale strictement positive.</span>
    <div class="content"><p>Supposons qu'il existe \(c \in [a, b]\) tel que \(f(c) \gt 0\). Par continuité en \(c\), il existe un segment \([\alpha, \beta] \subset [a, b]\) contenant \(c\), de longueur \(\delta = \beta - \alpha \gt 0\) (d'un seul côté de \(c\) si \(c\) est une extrémité), sur lequel \(f \ge f(c)/2\). Par Chasles et positivité de \(f\) sur \([a, \alpha]\) et \([\beta, b]\) :</p>
    <div class="formula">$$\int_a^b f \ \ge\ \int_\alpha^\beta f \ \ge\ \delta\,\frac{f(c)}{2} \ \gt\ 0,$$</div>
    <p>ce qui contredit \(\int_a^b f = 0\). Donc \(f\) est nulle en tout point.</p></div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier une des trois hypothèses. Sans continuité, la fonction nulle sauf en un point a une intégrale nulle ; sans positivité, \(\int_0^{2\pi} \sin t\,\mathrm{d}t = 0\) avec \(\sin \neq 0\) ; et les inégalités (positivité, croissance, inégalité triangulaire) exigent des bornes <strong>dans l'ordre croissant</strong> : pour \(x \lt a\), \(\int_a^x f\) est négative quand \(f\) est positive.</div>

  <h3>Symétries et valeur moyenne</h3>
  <p>Si \(f\) est paire sur \([-a, a]\), \(\int_{-a}^a f = 2\int_0^a f\) ; si elle est impaire, \(\int_{-a}^a f = 0\). Si \(f\) est \(T\)-périodique, \(\int_\alpha^{\alpha + T} f\) ne dépend pas de \(\alpha\). La <strong>valeur moyenne</strong> de \(f\) sur \([a, b]\) est \(\dfrac{1}{b-a}\int_a^b f\) : c'est la hauteur du rectangle de base \([a, b]\) qui a la même aire (algébrique) que le domaine compris entre la courbe et l'axe des abscisses.</p>

  <div class="method-box">
    <strong>Exemple — une suite d'intégrales qui donne \(\pi/4\)</strong>
    <p>Pour \(n \in \mathbb{N}\), on pose \(J_n = \displaystyle\int_0^1 \frac{t^n}{1+t^2}\,\mathrm{d}t\).</p>
    <ol>
      <li>Limite. Sur \([0, 1]\), \(0 \le \dfrac{t^n}{1+t^2} \le t^n\) ; par positivité et croissance, \(0 \le J_n \le \displaystyle\int_0^1 t^n\,\mathrm{d}t = \frac{1}{n+1}\), donc \(J_n \to 0\).</li>
      <li>Relation entre deux termes. Par linéarité :
      <div class="formula">$$J_n + J_{n+2} = \int_0^1 t^n\,\frac{1 + t^2}{1+t^2}\,\mathrm{d}t = \frac{1}{n+1}.$$</div></li>
      <li>Itération. \(J_0 = \arctan 1 = \dfrac{\pi}{4}\), puis \(J_0 = 1 - J_2 = 1 - \dfrac13 + J_4 = \cdots\), et par récurrence sur \(p\) :
      <div class="formula">$$\frac{\pi}{4} = \sum_{k=0}^{p-1} \frac{(-1)^k}{2k+1} + (-1)^p J_{2p}.$$</div></li>
      <li>Conclusion. Comme \(0 \le J_{2p} \le \dfrac{1}{2p+1}\), la somme partielle tend vers \(\pi/4\) : \(1 - \dfrac13 + \dfrac15 - \dfrac17 + \cdots = \dfrac{\pi}{4}\), et l'erreur commise en s'arrêtant au rang \(p\) est au plus \(\dfrac{1}{2p+1}\) (convergence très lente).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SOMMES DE RIEMANN</div>
  <h2>Approcher une intégrale par des sommes, et réciproquement</h2>
  <div class="intro">Découper \([a, b]\) en \(n\) morceaux égaux et remplacer \(f\) par une constante sur chacun donne une somme finie qui tend vers l'intégrale. Ce résultat sert dans les deux sens : calculer une intégrale numériquement, ou trouver la limite d'une somme en y reconnaissant une intégrale.</div>

  <div class="prop-box">
    <strong>Théorème (sommes de Riemann).</strong> Soit \(f\) continue sur \([a, b]\). On pose \(h = \dfrac{b-a}{n}\) (le <strong>pas</strong>) et \(x_k = a + kh\). Alors
    <div class="formula" data-nom="Sommes de Riemann">$$\frac{b-a}{n}\sum_{k=0}^{n-1} f\!\left(a + k\,\frac{b-a}{n}\right) \xrightarrow[n\to+\infty]{} \int_a^b f(t)\,\mathrm{d}t,$$</div>
    et de même avec la somme pour \(k\) de \(1\) à \(n\). Cas le plus fréquent, sur \([0, 1]\) :
    <div class="formula" data-nom="Sommes de Riemann sur [0, 1]">$$\frac{1}{n}\sum_{k=1}^{n} f\!\left(\frac{k}{n}\right) \xrightarrow[n\to+\infty]{} \int_0^1 f(t)\,\mathrm{d}t.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Cas d'une fonction de classe \(\mathcal{C}^1\), avec une estimation de l'erreur en \(1/n\).</span>
    <div class="content"><p>Soit \(M_1 = \sup_{[a,b]} |f'|\), fini car \(f'\) est continue sur un segment. Pour \(t \in [x_k, x_{k+1}]\), l'inégalité des accroissements finis donne \(|f(t) - f(x_k)| \le M_1 (t - x_k)\). En intégrant sur \([x_k, x_{k+1}]\) :</p>
    <div class="formula">$$\begin{aligned} \left|\int_{x_k}^{x_{k+1}} f(t)\,\mathrm{d}t - h\,f(x_k)\right| &\le \int_{x_k}^{x_{k+1}} M_1 (t - x_k)\,\mathrm{d}t \\ &= \frac{M_1 h^2}{2}. \end{aligned}$$</div>
    <p>On somme ces \(n\) inégalités (Chasles et inégalité triangulaire) :</p>
    <div class="formula">$$\begin{aligned} \left|\int_a^b f - h\sum_{k=0}^{n-1} f(x_k)\right| &\le n\,\frac{M_1 h^2}{2} \\ &= \frac{M_1 (b-a)^2}{2n} \xrightarrow[n\to+\infty]{} 0. \end{aligned}$$</div>
    <p>La somme de \(k = 1\) à \(n\) diffère de la précédente de \(h\big(f(b) - f(a)\big)\), qui tend vers 0. Pour une fonction seulement continue, la preuve utilise la continuité uniforme (théorème de Heine, hors programme).</p></div>
  </div>

  <h3>Méthode des rectangles, méthode des trapèzes</h3>
  <p>La somme \(R_n = h\sum_{k=0}^{n-1} f(x_k)\) est la <strong>méthode des rectangles</strong> : d'après la démonstration, l'erreur est au plus \(\dfrac{M_1(b-a)^2}{2n}\). La <strong>méthode des trapèzes</strong> remplace chaque rectangle par le trapèze qui joint \(\big(x_k, f(x_k)\big)\) à \(\big(x_{k+1}, f(x_{k+1})\big)\) :</p>
  <div class="formula" data-nom="Méthode des trapèzes">$$T_n = h\left(\frac{f(a) + f(b)}{2} + \sum_{k=1}^{n-1} f(x_k)\right).$$</div>
  <p>C'est la moyenne des sommes à gauche et à droite ; pour \(f\) de classe \(\mathcal{C}^2\), son erreur est au plus \(\dfrac{M_2 (b-a)^3}{12\,n^2}\) avec \(M_2 = \sup|f''|\) (résultat admis). Doubler \(n\) divise l'erreur par 2 avec les rectangles, par 4 avec les trapèzes. Pour \(\int_0^1 \frac{\mathrm{d}t}{1+t} = \ln 2\) :</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin:.6rem 0">
    <tr><th style="text-align:left">\(n\)</th><th style="text-align:left">rectangles à gauche</th><th style="text-align:left">erreur</th><th style="text-align:left">trapèzes</th><th style="text-align:left">erreur</th></tr>
    <tr><td>10</td><td>0,718 77</td><td>\(2{,}6 \times 10^{-2}\)</td><td>0,693 77</td><td>\(6{,}2 \times 10^{-4}\)</td></tr>
    <tr><td>100</td><td>0,695 65</td><td>\(2{,}5 \times 10^{-3}\)</td><td>0,693 153</td><td>\(6{,}2 \times 10^{-6}\)</td></tr>
  </table></div>
  <pre class="codeblock"><span class="kw">def</span> rectangles(f, a, b, n):
    h = (b - a) / n
    <span class="kw">return</span> h * sum(f(a + k*h) <span class="kw">for</span> k <span class="kw">in</span> range(n))

<span class="kw">def</span> trapezes(f, a, b, n):
    h = (b - a) / n
    <span class="kw">return</span> h * ((f(a) + f(b)) / 2 + sum(f(a + k*h) <span class="kw">for</span> k <span class="kw">in</span> range(1, n)))</pre>

  <div class="method-box">
    <strong>Méthode — reconnaître une somme de Riemann</strong>
    <ol>
      <li>Mettre en facteur le pas \(\dfrac1n\) (ou \(\dfrac{b-a}{n}\)), quitte à factoriser \(n\) dans chaque terme.</li>
      <li>Écrire le terme restant sous la forme \(f(k/n)\) : la fonction \(f\) ne doit dépendre <strong>ni de \(k\) ni de \(n\)</strong> séparément.</li>
      <li>Lire l'intervalle sur les indices : \(k\) de \(1\) à \(n\) (ou de \(0\) à \(n-1\)) donne \([0, 1]\) ; \(k\) de \(1\) à \(2n\) avec \(f(k/n)\) donne \([0, 2]\).</li>
      <li>Conclure par le théorème, puis calculer l'intégrale. Pour un <strong>produit</strong>, passer d'abord au logarithme.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la limite d'une racine \(n\)-ième</strong>
    <p>On cherche la limite de \(P_n = \left(\dfrac{(2n)!}{n!\,n^n}\right)^{1/n}\).</p>
    <ol>
      <li>Réécriture :
      <div class="formula">$$\begin{aligned} \frac{(2n)!}{n!} &= (n+1)(n+2)\cdots(2n) \\ &= \prod_{k=1}^n (n + k) \\ &= n^n \prod_{k=1}^n \left(1 + \frac{k}{n}\right). \end{aligned}$$</div></li>
      <li>Logarithme : \(\ln P_n = \dfrac{1}{n}\displaystyle\sum_{k=1}^n \ln\!\left(1 + \frac{k}{n}\right)\), somme de Riemann de \(f(x) = \ln(1+x)\), continue sur \([0, 1]\).</li>
      <li>Intégrale (une primitive de \(\ln(1+x)\) est \((1+x)\ln(1+x) - x\)) :
      <div class="formula">$$\int_0^1 \ln(1+x)\,\mathrm{d}x = 2\ln 2 - 1.$$</div></li>
      <li>Par continuité de l'exponentielle, \(P_n \to \mathrm{e}^{2\ln 2 - 1} = \dfrac{4}{\mathrm{e}} \approx 1{,}4715\). Contrôle numérique : \(P_{10} \approx 1{,}523\), \(P_{100} \approx 1{,}477\), \(P_{1000} \approx 1{,}472\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le facteur \(\dfrac1n\) ou laisser \(n\) ailleurs que dans \(k/n\). La somme \(\displaystyle\sum_{k=1}^n \frac{1}{n+k}\) n'est une somme de Riemann qu'après factorisation : \(\dfrac{1}{n}\displaystyle\sum_{k=1}^n \frac{1}{1 + k/n} \to \int_0^1 \frac{\mathrm{d}x}{1+x} = \ln 2\). En revanche, \(\displaystyle\sum_{k=1}^n \frac{1}{n^2+k}\) n'en est pas une (elle tend vers 0, par encadrement).</div>
  <p>Pour une fonction <strong>monotone</strong>, on encadre aussi chaque terme d'une somme par deux intégrales, \(\int_k^{k+1} f \le f(k) \le \int_{k-1}^k f\) si \(f\) décroît : c'est la <strong>comparaison série-intégrale</strong>, développée dans le chapitre Séries numériques.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · INTÉGRALE FONCTION DE SES BORNES</div>
  <h2>Dériver une intégrale par rapport à ses bornes</h2>
  <div class="intro">Une intégrale dont une borne varie définit une fonction, dérivable dès que l'intégrande est continue. C'est le pont entre intégrales et primitives, et le premier exemple de fonction définie par une intégrale (le chapitre Intégrales à paramètre traitera le cas où la variable est dans l'intégrande).</div>

  <div class="prop-box">
    <strong>Théorème fondamental de l'analyse.</strong> Soit \(f\) continue sur un intervalle \(I\) et \(a \in I\). La fonction \(F : x \mapsto \int_a^x f(t)\,\mathrm{d}t\) est de classe \(\mathcal{C}^1\) sur \(I\) et \(F' = f\) : c'est l'unique primitive de \(f\) qui s'annule en \(a\). En particulier, <strong>toute fonction continue sur un intervalle admet des primitives</strong>, et pour toute primitive \(G\) de \(f\), \(\int_a^b f = G(b) - G(a)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un taux d'accroissement de \(F\) est une valeur moyenne de \(f\).</span>
    <div class="content"><p>Pour \(x \in I\) et \(h \neq 0\) tel que \(x + h \in I\), la relation de Chasles et \(\int_x^{x+h} f(x)\,\mathrm{d}t = h f(x)\) donnent</p>
    <div class="formula">$$\begin{aligned} &\left|\frac{F(x+h) - F(x)}{h} - f(x)\right| \\ &\qquad = \frac{1}{|h|}\left|\int_x^{x+h} \big(f(t) - f(x)\big)\,\mathrm{d}t\right| \\ &\qquad \le \sup_{|t - x| \le |h|} |f(t) - f(x)|. \end{aligned}$$</div>
    <p>Ce majorant tend vers 0 quand \(h \to 0\) par continuité de \(f\) en \(x\) : \(F'(x) = f(x)\). Comme \(f\) est continue, \(F\) est de classe \(\mathcal{C}^1\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Intégrale à bornes variables.</strong> Soit \(f\) continue sur \(I\) et \(u\), \(v\) dérivables sur un intervalle \(J\), à valeurs dans \(I\). Alors \(G : x \mapsto \int_{u(x)}^{v(x)} f(t)\,\mathrm{d}t\) est dérivable sur \(J\) et
    <div class="formula" data-nom="Dérivée d'une intégrale à bornes variables">$$G'(x) = f\big(v(x)\big)\,v'(x) - f\big(u(x)\big)\,u'(x).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Écrire \(G\) à l'aide d'une primitive.</span>
    <div class="content"><p>Si \(F\) est une primitive de \(f\) sur \(I\), \(G(x) = F\big(v(x)\big) - F\big(u(x)\big)\). On dérive une composée : \(G'(x) = F'\big(v(x)\big)v'(x) - F'\big(u(x)\big)u'(x)\), avec \(F' = f\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — étude de \(F(x) = \int_x^{2x} \mathrm{e}^{-t^2}\,\mathrm{d}t\)</strong>
    <p>On ne connaît pas de primitive explicite de \(t \mapsto \mathrm{e}^{-t^2}\), mais on peut tout de même étudier \(F\).</p>
    <ol>
      <li>Dérivée. \(t \mapsto \mathrm{e}^{-t^2}\) est continue sur \(\mathbb{R}\), \(u(x) = x\) et \(v(x) = 2x\) sont dérivables : \(F\) est dérivable sur \(\mathbb{R}\) et
      <div class="formula">$$\begin{aligned} F'(x) &= 2\,\mathrm{e}^{-4x^2} - \mathrm{e}^{-x^2} \\ &= \mathrm{e}^{-x^2}\big(2\,\mathrm{e}^{-3x^2} - 1\big). \end{aligned}$$</div></li>
      <li>Variations. \(F'(x) \gt 0\) si et seulement si \(\mathrm{e}^{-3x^2} \gt \frac12\), c'est-à-dire \(x^2 \lt \frac{\ln 2}{3}\) : \(F\) croît sur \([-x_0, x_0]\) et décroît sur \(]-\infty, -x_0]\) et sur \([x_0, +\infty[\), avec \(x_0 = \sqrt{\ln 2 / 3} \approx 0{,}481\).</li>
      <li>Parité. Le changement de variable \(t = -s\) envoie les bornes \(-x\), \(-2x\) sur \(x\), \(2x\) :
      <div class="formula">$$\begin{aligned} F(-x) &= \int_{-x}^{-2x} \mathrm{e}^{-t^2}\,\mathrm{d}t \\ &= \int_x^{2x} \mathrm{e}^{-s^2}\,(-\mathrm{d}s) = -F(x), \end{aligned}$$</div>
      donc \(F\) est impaire.</li>
      <li>Limite. Pour \(x \ge 0\), \(\mathrm{e}^{-t^2} \le \mathrm{e}^{-x^2}\) sur \([x, 2x]\), donc \(0 \le F(x) \le x\,\mathrm{e}^{-x^2}\) : \(F(x) \to 0\) en \(+\infty\), et en \(-\infty\) par imparité.</li>
      <li>Valeurs. \(F(0) = 0\), \(F'(0) = 1\) (donc \(F(x) \sim x\) en 0) et le maximum vaut \(F(x_0) \approx 0{,}286\) (calcul numérique).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la formule quand la variable figure aussi <strong>dans l'intégrande</strong>. Pour \(G(x) = \int_0^x (x - t) f(t)\,\mathrm{d}t\), on sépare d'abord : \(G(x) = x\int_0^x f(t)\,\mathrm{d}t - \int_0^x t f(t)\,\mathrm{d}t\), puis \(G'(x) = \int_0^x f + x f(x) - x f(x)\), soit \(G'(x) = \int_0^x f(t)\,\mathrm{d}t\). Ainsi \(G'' = f\) et \(G(0) = G'(0) = 0\) : c'est la formule de Taylor du §5 à l'ordre 1, lue à l'envers.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · INTÉGRATION PAR PARTIES ET CHANGEMENT DE VARIABLE</div>
  <h2>Les deux techniques de calcul et leur bon usage</h2>
  <div class="intro">Ces deux formules transforment une intégrale en une autre, plus simple. Dans les calculs pratiques, le programme n'impose pas de rappeler leurs hypothèses de régularité ; elles s'étendront aux intégrales généralisées moyennant un passage à la limite.</div>

  <div class="prop-box">
    <strong>Intégration par parties.</strong> Si \(u\) et \(v\) sont de classe \(\mathcal{C}^1\) sur \([a, b]\) :
    <div class="formula" data-nom="Intégration par parties">$$\begin{aligned} \int_a^b u'(t)\,v(t)\,\mathrm{d}t &= \Big[u(t)\,v(t)\Big]_a^b \\ &\quad - \int_a^b u(t)\,v'(t)\,\mathrm{d}t. \end{aligned}$$</div>
  </div>
  <div class="prop-box">
    <strong>Changement de variable.</strong> Si \(\varphi\) est de classe \(\mathcal{C}^1\) sur \([\alpha, \beta]\) et \(f\) continue sur un intervalle contenant \(\varphi([\alpha, \beta])\) :
    <div class="formula" data-nom="Changement de variable">$$\int_\alpha^\beta f\big(\varphi(s)\big)\,\varphi'(s)\,\mathrm{d}s = \int_{\varphi(\alpha)}^{\varphi(\beta)} f(t)\,\mathrm{d}t.$$</div>
    En pratique : on pose \(t = \varphi(s)\), on remplace \(\mathrm{d}t\) par \(\varphi'(s)\,\mathrm{d}s\) et on change les bornes.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux formules de dérivation, intégrées.</span>
    <div class="content"><p>Intégration par parties : \((uv)' = u'v + uv'\) est continue, donc \(\int_a^b (uv)' = [uv]_a^b = \int_a^b u'v + \int_a^b uv'\). Changement de variable : si \(F\) est une primitive de \(f\), \((F \circ \varphi)' = (f \circ \varphi)\,\varphi'\), donc le membre de gauche vaut \(F\big(\varphi(\beta)\big) - F\big(\varphi(\alpha)\big)\), qui est aussi le membre de droite. Aucune bijectivité de \(\varphi\) n'est requise sur un segment (elle le sera pour les intégrales généralisées).</p></div>
  </div>

  <div class="method-box">
    <strong>Méthode — choisir la technique</strong>
    <ol>
      <li>Produit polynôme × exponentielle, sinus, cosinus : intégration par parties en <strong>dérivant le polynôme</strong> (une par degré).</li>
      <li>\(\ln\), \(\arctan\) seuls : intégration par parties avec \(u' = 1\) ; on dérive la fonction « difficile ».</li>
      <li>Suite d'intégrales \(\int \cos^n\), \(\int t^n \mathrm{e}^{-t}\), \(\int (\ln t)^n\) : une intégration par parties abaisse l'indice et fournit une <strong>relation de récurrence</strong>.</li>
      <li>Radical \(\sqrt{1 - t^2}\) : \(t = \sin s\) ; fraction en \(\mathrm{e}^t\) : \(u = \mathrm{e}^t\) ; fraction rationnelle : décomposition en éléments simples, forme canonique de \(at^2 + bt + c\).</li>
      <li>Bornes symétriques ou intervalle \([0, \pi/2]\) : essayer \(t \mapsto a + b - t\), qui échange les bornes et transforme \(\sin\) en \(\cos\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une intégration par parties</strong>
    <p>Calcul de \(I = \int_1^{\mathrm{e}} t \ln t\,\mathrm{d}t\).</p>
    <ol>
      <li>On dérive \(\ln\) et on primitive \(t\) : \(u'(t) = t\), \(u(t) = \dfrac{t^2}{2}\), \(v(t) = \ln t\), \(v'(t) = \dfrac1t\).</li>
      <li>D'où :
      <div class="formula">$$\begin{aligned} I &= \left[\frac{t^2}{2}\ln t\right]_1^{\mathrm{e}} - \int_1^{\mathrm{e}} \frac{t}{2}\,\mathrm{d}t \\ &= \frac{\mathrm{e}^2}{2} - \frac{\mathrm{e}^2 - 1}{4} = \frac{\mathrm{e}^2 + 1}{4} \approx 2{,}097. \end{aligned}$$</div></li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — deux changements de variable</strong>
    <ol>
      <li>Quart de disque : dans \(\int_0^1 \sqrt{1 - t^2}\,\mathrm{d}t\), on pose \(t = \sin s\), \(s \in [0, \pi/2]\), \(\mathrm{d}t = \cos s\,\mathrm{d}s\) ; comme \(\cos s \ge 0\), \(\sqrt{1 - \sin^2 s} = \cos s\) et
      <div class="formula">$$\begin{aligned} \int_0^1 \sqrt{1 - t^2}\,\mathrm{d}t &= \int_0^{\pi/2} \cos^2 s\,\mathrm{d}s \\ &= \int_0^{\pi/2} \frac{1 + \cos 2s}{2}\,\mathrm{d}s \\ &= \frac{\pi}{4}, \end{aligned}$$</div>
      l'aire du quart de disque unité.</li>
      <li>Symétrie : \(K = \displaystyle\int_0^{\pi/2} \frac{\sin t}{\sin t + \cos t}\,\mathrm{d}t\) (dénominateur strictement positif). Avec \(t = \frac{\pi}{2} - s\), \(K = \displaystyle\int_0^{\pi/2} \frac{\cos s}{\cos s + \sin s}\,\mathrm{d}s\). En ajoutant les deux écritures, \(2K = \int_0^{\pi/2} 1\,\mathrm{d}s\), d'où \(K = \dfrac{\pi}{4}\), sans aucune primitive.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : changer la variable sans changer les bornes ni le \(\mathrm{d}t\), ou simplifier \(\sqrt{\cos^2 s}\) en \(\cos s\) sans vérifier le signe : \(\sqrt{\cos^2 s} = |\cos s|\). Choisir l'intervalle de la nouvelle variable de sorte que le signe soit constant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FORMULES DE TAYLOR</div>
  <h2>Du reste intégral à l'inégalité de Taylor-Lagrange</h2>
  <div class="intro">La formule de Taylor-Young décrit \(f\) près d'un point avec un reste en \(o\big((x-a)^n\big)\) : c'est une information locale. Le reste intégral, lui, est <strong>exact</strong> ; en le majorant, on obtient une inégalité valable sur tout un intervalle. C'est l'outil qui justifie les développements en série entière.</div>

  <div class="prop-box">
    <strong>Formule de Taylor avec reste intégral.</strong> Soit \(f\) de classe \(\mathcal{C}^{n+1}\) sur un intervalle \(I\), à valeurs réelles ou complexes, et \(a, x \in I\). Alors
    <div class="formula" data-nom="Taylor avec reste intégral">$$\begin{aligned} f(x) = {} &\sum_{k=0}^{n} \frac{f^{(k)}(a)}{k!}(x-a)^k \\ &+ \int_a^x \frac{(x-t)^n}{n!}\,f^{(n+1)}(t)\,\mathrm{d}t. \end{aligned}$$</div>
    Le polynôme \(T_n(x) = \sum_{k=0}^{n} \frac{f^{(k)}(a)}{k!}(x-a)^k\) est le <strong>polynôme de Taylor</strong> d'ordre \(n\) en \(a\) ; l'intégrale est le <strong>reste</strong> \(R_n(x)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Récurrence sur \(n\), par intégrations par parties successives.</span>
    <div class="content"><p>Pour \(n = 0\), la formule s'écrit \(f(x) = f(a) + \int_a^x f'(t)\,\mathrm{d}t\) : c'est le théorème fondamental. Supposons-la vraie au rang \(n\) pour \(f\) de classe \(\mathcal{C}^{n+2}\). Dans \(R_n(x)\), on intègre par parties en primitivant \(t \mapsto \frac{(x-t)^n}{n!}\) en \(t \mapsto -\frac{(x-t)^{n+1}}{(n+1)!}\) et en dérivant \(f^{(n+1)}\) :</p>
    <div class="formula">$$\begin{aligned} R_n(x) &= \left[-\frac{(x-t)^{n+1}}{(n+1)!}\,f^{(n+1)}(t)\right]_a^x \\ &\quad + \int_a^x \frac{(x-t)^{n+1}}{(n+1)!}\,f^{(n+2)}(t)\,\mathrm{d}t \\ &= \frac{f^{(n+1)}(a)}{(n+1)!}(x-a)^{n+1} + R_{n+1}(x). \end{aligned}$$</div>
    <p>Le premier terme complète \(T_n\) en \(T_{n+1}\) : la formule est vraie au rang \(n+1\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Inégalité de Taylor-Lagrange.</strong> Soit \(f\) de classe \(\mathcal{C}^{n+1}\) sur \(I\), à valeurs réelles ou complexes, \(a, x \in I\), et \(M_{n+1}\) un majorant de \(|f^{(n+1)}|\) sur le segment d'extrémités \(a\) et \(x\). Alors
    <div class="formula" data-nom="Inégalité de Taylor-Lagrange">$$\begin{aligned} &\left|f(x) - \sum_{k=0}^{n} \frac{f^{(k)}(a)}{k!}(x-a)^k\right| \\ &\qquad \le M_{n+1}\,\frac{|x-a|^{n+1}}{(n+1)!}. \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Majorer le reste intégral.</span>
    <div class="content"><p>Si \(x \ge a\), l'inégalité triangulaire (bornes dans l'ordre) donne</p>
    <div class="formula">$$\begin{aligned} |R_n(x)| &\le \int_a^x \frac{(x-t)^n}{n!}\,M_{n+1}\,\mathrm{d}t \\ &= M_{n+1}\,\frac{(x-a)^{n+1}}{(n+1)!}. \end{aligned}$$</div>
    <p>Si \(x \lt a\), on écrit \(R_n(x) = -\int_x^a \cdots\) et le même calcul donne \(M_{n+1}\frac{(a-x)^{n+1}}{(n+1)!}\).</p></div>
  </div>

<figcaption>Polynômes de Taylor T₂, T₆, T₁₀ de cos en 0. L'inégalité de Taylor-Lagrange garantit |cos x − Tₙ(x)| ≤ |x|ⁿ⁺¹/(n+1)! : petit près de 0 pour tout n, et petit sur [0, 7] dès que n est grand, car la factorielle finit par écraser la puissance.</figcaption>
</figure>
  <div class="notice"><strong>Local ou global ?</strong> Taylor-Young : \(n\) est fixé et \(x \to a\) ; le reste est un \(o\big((x-a)^n\big)\), sans aucune valeur numérique. Taylor-Lagrange : l'inégalité vaut pour <strong>tout</strong> \(x\) de l'intervalle, avec une constante explicite ; on peut ensuite faire tendre \(n\) vers \(+\infty\) à \(x\) fixé. C'est ce second point de vue qui mène aux séries entières.</div>

  <div class="method-box">
    <strong>Exemple — approcher \(\mathrm{e}\) à \(10^{-6}\) près</strong>
    <ol>
      <li>On applique l'inégalité à \(f = \exp\) entre \(a = 0\) et \(x = 1\) : toutes les dérivées valent \(\exp\), majorée par \(\mathrm{e} \le 3\) sur \([0, 1]\).</li>
      <li>Donc \(\left|\mathrm{e} - \displaystyle\sum_{k=0}^n \frac{1}{k!}\right| \le \dfrac{3}{(n+1)!}\).</li>
      <li>\(\dfrac{3}{9!} \approx 8{,}3 \times 10^{-6}\) ne suffit pas, mais \(\dfrac{3}{10!} \approx 8{,}3 \times 10^{-7} \lt 10^{-6}\) : on prend \(n = 9\).</li>
      <li>\(\displaystyle\sum_{k=0}^{9} \frac{1}{k!} \approx 2{,}718\,281\,5\), alors que \(\mathrm{e} \approx 2{,}718\,281\,8\) : l'erreur réelle, \(3{,}0 \times 10^{-7}\), respecte la majoration.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le cosinus est la somme de sa série de Taylor</strong>
    <ol>
      <li>Toutes les dérivées de \(\cos\) sont \(\pm\cos\) ou \(\pm\sin\), donc bornées par 1 sur \(\mathbb{R}\) : pour tout réel \(x\) et tout \(n\), \(|\cos x - T_n(x)| \le \dfrac{|x|^{n+1}}{(n+1)!}\).</li>
      <li>À \(x\) fixé, \(\dfrac{|x|^{n+1}}{(n+1)!} \to 0\) (le quotient de deux termes consécutifs, \(\frac{|x|}{n+2}\), tend vers 0). Donc \(T_n(x) \to \cos x\) :
      <div class="formula">$$\forall x \in \mathbb{R},\quad \cos x = \sum_{k=0}^{+\infty} \frac{(-1)^k x^{2k}}{(2k)!}.$$</div></li>
      <li>Usage numérique : le terme en \(x^3\) étant nul, \(T_2 = T_3\) et \(|\cos x - (1 - x^2/2)| \le \dfrac{x^4}{24}\). Pour \(x = 0{,}1\) : majorant \(4{,}17 \times 10^{-6}\), erreur réelle \(4{,}17 \times 10^{-6}\) ; la majoration est ici presque optimale.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · INÉGALITÉ DE CAUCHY-SCHWARZ</div>
  <h2>Majorer l'intégrale d'un produit</h2>
  <div class="intro">Sur \(\mathcal{C}([a, b], \mathbb{R})\), \(\langle f, g \rangle = \int_a^b f g\) est un produit scalaire (voir le chapitre Espaces préhilbertiens). L'inégalité de Cauchy-Schwarz de tout espace préhilbertien s'y lit comme une inégalité entre intégrales ; on en donne ici une preuve directe, qui illustre le §1.</div>

  <div class="prop-box">
    <strong>Inégalité de Cauchy-Schwarz.</strong> Pour \(f\), \(g\) continues sur \([a, b]\), à valeurs réelles :
    <div class="formula" data-nom="Cauchy-Schwarz intégrale">$$\begin{aligned} \left(\int_a^b f(t)\,g(t)\,\mathrm{d}t\right)^2 &\le \left(\int_a^b f(t)^2\,\mathrm{d}t\right) \\ &\quad \times \left(\int_a^b g(t)^2\,\mathrm{d}t\right), \end{aligned}$$</div>
    avec égalité si et seulement si \(f\) et \(g\) sont <strong>colinéaires</strong> (l'une est un multiple constant de l'autre).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un trinôme positif a un discriminant négatif.</span>
    <div class="content"><p>Pour tout réel \(\lambda\), par positivité de l'intégrale :</p>
    <div class="formula">$$\begin{aligned} P(\lambda) &= \int_a^b (f + \lambda g)^2 \\ &= \lambda^2 \int_a^b g^2 + 2\lambda\int_a^b fg + \int_a^b f^2 \ \ge\ 0. \end{aligned}$$</div>
    <ul>
      <li>Si \(\int_a^b g^2 = 0\), alors \(g = 0\) (fonction continue positive d'intégrale nulle, §1) et les deux membres sont nuls.</li>
      <li>Sinon \(P\) est un trinôme du second degré de signe constant : son discriminant est négatif ou nul, \(4\left(\int fg\right)^2 - 4\int f^2 \int g^2 \le 0\).</li>
    </ul>
    <p>Cas d'égalité (avec \(g \neq 0\)) : le discriminant est nul, donc \(P\) a une racine \(\lambda_0\) : \(\int_a^b (f + \lambda_0 g)^2 = 0\), et la fonction continue positive \((f + \lambda_0 g)^2\) est nulle, soit \(f = -\lambda_0 g\). La réciproque est immédiate.</p></div>
  </div>
  <p>Avec \(g = 1\) : \(\left(\int_a^b f\right)^2 \le (b-a)\int_a^b f^2\), soit « le carré de la moyenne est inférieur à la moyenne du carré ».</p>
  <div class="method-box">
    <strong>Exemple — une minoration de \(\ln 2\)</strong>
    <ol>
      <li>Sur \([1, 2]\), on prend \(f(t) = \sqrt t\) et \(g(t) = \dfrac{1}{\sqrt t}\), de sorte que \(fg = 1\).</li>
      <li>Cauchy-Schwarz : \(\left(\int_1^2 1\,\mathrm{d}t\right)^2 \le \int_1^2 t\,\mathrm{d}t \times \int_1^2 \frac{\mathrm{d}t}{t}\), soit \(1 \le \dfrac{3}{2}\ln 2\).</li>
      <li>Donc \(\ln 2 \ge \dfrac{2}{3} \approx 0{,}667\) (valeur exacte : \(0{,}693\)) ; l'inégalité est stricte car \(\sqrt t\) et \(1/\sqrt t\) ne sont pas proportionnelles.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — contrôler \(f\) par sa dérivée</strong>
    <p>Soit \(f\) de classe \(\mathcal{C}^1\) sur \([0, 1]\) avec \(f(0) = 0\). Montrons que \(\int_0^1 f^2 \le \frac12 \int_0^1 f'^2\).</p>
    <ol>
      <li>Théorème fondamental : \(f(x) = \int_0^x 1 \times f'(t)\,\mathrm{d}t\) pour \(x \in [0, 1]\).</li>
      <li>Cauchy-Schwarz sur \([0, x]\) : \(f(x)^2 \le x \displaystyle\int_0^x f'^2 \le x \int_0^1 f'^2\) (l'intégrande est positif).</li>
      <li>On intègre en \(x\) sur \([0, 1]\) :
      <div class="formula">$$\begin{aligned} \int_0^1 f^2 &\le \left(\int_0^1 x\,\mathrm{d}x\right) \int_0^1 f'^2 \\ &= \frac12\int_0^1 f'^2. \end{aligned}$$</div></li>
      <li>Contrôle : pour \(f(x) = x\), \(\frac13 \le \frac12\) ; pour \(f(x) = \sin\frac{\pi x}{2}\), \(\frac12 \le \frac{\pi^2}{16} \approx 0{,}617\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : Cauchy-Schwarz majore l'intégrale d'un <strong>produit</strong> ; il ne dit rien de \(\int f \times \int g\), et \(\left(\int f\right)^2\) n'est pas \(\int f^2\). Penser aussi à appliquer l'inégalité sur le bon intervalle (ici \([0, x]\), pas \([0, 1]\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · INTÉGRALES DE WALLIS</div>
  <h2>Un exemple complet : récurrence, valeurs exactes, équivalent</h2>
  <div class="intro">Étudier une suite d'intégrales suit presque toujours le même schéma : sens de variation par comparaison des intégrandes, relation de récurrence par intégration par parties, valeurs exactes, puis équivalent par encadrement. Les intégrales de Wallis en sont le modèle.</div>

  <div class="def-box">
    Pour \(n \in \mathbb{N}\), les <strong>intégrales de Wallis</strong> sont \(W_n = \displaystyle\int_0^{\pi/2} \sin^n t\,\mathrm{d}t\). Le changement de variable \(t = \frac{\pi}{2} - s\) montre que \(W_n = \displaystyle\int_0^{\pi/2} \cos^n s\,\mathrm{d}s\). Premières valeurs : \(W_0 = \dfrac{\pi}{2}\), \(W_1 = 1\).
  </div>

  <div class="method-box">
    <strong>Exemple — étude complète de \((W_n)\)</strong>
    <ol>
      <li>Signe et monotonie. Sur \([0, \pi/2]\), \(0 \le \sin t \le 1\), donc \(0 \le \sin^{n+1} t \le \sin^n t\) : \((W_n)\) est décroissante. De plus \(W_n \gt 0\) : intégrale d'une fonction continue, positive et non identiquement nulle (§1).</li>
      <li>Récurrence. Pour \(n \ge 2\), on écrit \(\sin^n t = \sin^{n-1} t \times \sin t\) et on intègre par parties (\(u' = \sin\), \(u = -\cos\)) :
      <div class="formula">$$\begin{aligned} W_n &= \Big[-\cos t\,\sin^{n-1} t\Big]_0^{\pi/2} \\ &\quad + (n-1)\int_0^{\pi/2} \sin^{n-2} t\,\cos^2 t\,\mathrm{d}t \\ &= (n-1)\big(W_{n-2} - W_n\big), \end{aligned}$$</div>
      en remplaçant \(\cos^2 t\) par \(1 - \sin^2 t\). D'où :
      <div class="formula" data-nom="Récurrence de Wallis">$$n\,W_n = (n-1)\,W_{n-2} \qquad (n \ge 2).$$</div></li>
      <li>Valeurs exactes. En itérant, \(W_2 = \frac{\pi}{4}\), \(W_3 = \frac23\), \(W_4 = \frac{3\pi}{16}\), \(W_5 = \frac{8}{15}\), et en général
      <div class="formula">$$\begin{aligned} W_{2p} &= \frac{(2p)!}{2^{2p}\,(p!)^2}\cdot\frac{\pi}{2}, \\ W_{2p+1} &= \frac{2^{2p}\,(p!)^2}{(2p+1)!}. \end{aligned}$$</div></li>
      <li>Une quantité constante. En multipliant \((n+1)W_{n+1} = n W_{n-1}\) par \(W_n\), on voit que \((n+1)W_{n+1}W_n = n W_n W_{n-1}\) : la suite \(n W_n W_{n-1}\) est constante, égale à \(1 \times W_1 W_0 = \dfrac{\pi}{2}\).</li>
      <li>Deux termes voisins sont équivalents. Par décroissance, \(W_{n+1} \le W_n \le W_{n-1}\) ; on divise par \(W_{n-1} \gt 0\) : \(\dfrac{n}{n+1} = \dfrac{W_{n+1}}{W_{n-1}} \le \dfrac{W_n}{W_{n-1}} \le 1\). Par encadrement, \(W_n \sim W_{n-1}\).</li>
      <li>Équivalent. \(\dfrac{\pi}{2} = n W_n W_{n-1} \sim n W_n^2\), donc \(W_n^2 \sim \dfrac{\pi}{2n}\) et, \(W_n\) étant positif :
      <div class="formula" data-nom="Équivalent de Wallis">$$W_n \underset{n\to+\infty}{\sim} \sqrt{\frac{\pi}{2n}}.$$</div>
      Contrôle : \(W_{10} = \frac{63\pi}{512} \approx 0{,}3866\) et \(\sqrt{\pi/20} \approx 0{,}3963\) (rapport 0,975) ; pour \(n = 20\), le rapport vaut 0,988.</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Les formules explicites de \(W_{2p}\) et \(W_{2p+1}\).</span>
    <div class="content"><p>La récurrence donne \(W_{2p} = \dfrac{2p-1}{2p}\cdot\dfrac{2p-3}{2p-2}\cdots\dfrac{1}{2}\,W_0\). On multiplie numérateur et dénominateur par le produit des nombres pairs \(2p \times (2p-2) \times \cdots \times 2 = 2^p\,p!\) : le numérateur devient \((2p)!\) et le dénominateur \((2^p p!)^2\). De même, en multipliant par le produit des nombres pairs pour compléter le dénominateur en \((2p+1)!\) :</p>
    <div class="formula">$$\begin{aligned} W_{2p+1} &= \frac{2p}{2p+1}\cdot\frac{2p-2}{2p-1}\cdots\frac{2}{3}\,W_1 \\ &= \frac{(2^p\,p!)^2}{(2p+1)!}. \end{aligned}$$</div>
    <p>On vérifie sur \(p = 1\) et \(p = 2\) : \(W_3 = \frac23\), \(W_5 = \frac{(2^2 \times 2!)^2}{5!} = \frac{64}{120} = \frac{8}{15}\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — pile ou face</strong>
    <p>La probabilité d'obtenir exactement \(p\) piles en \(2p\) lancers d'une pièce équilibrée est \(\dbinom{2p}{p}\dfrac{1}{4^p} = \dfrac{(2p)!}{(p!)^2\,4^p} = \dfrac{2}{\pi}\,W_{2p}\).</p>
    <ol>
      <li>Par l'équivalent de Wallis, \(\dfrac{2}{\pi}W_{2p} \sim \dfrac{2}{\pi}\sqrt{\dfrac{\pi}{4p}} = \dfrac{1}{\sqrt{\pi p}}\) : cette probabilité tend vers 0, lentement.</li>
      <li>Pour 100 lancers (\(p = 50\)) : valeur exacte \(0{,}0796\), équivalent \(1/\sqrt{50\pi} \approx 0{,}0798\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : manipuler les équivalents comme des égalités. On peut multiplier, diviser et élever à une puissance fixe (d'où la racine carrée ci-dessus), mais pas <strong>ajouter</strong> des équivalents ni les <strong>composer</strong> par une fonction quelconque (\(n + 1 \sim n\), mais \(\mathrm{e}^{n+1} \not\sim \mathrm{e}^n\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Prolongements, à titre culturel</h2>
  <ul>
    <li><strong>Égalité de Taylor-Lagrange</strong> : pour \(f\) réelle de classe \(\mathcal{C}^{n+1}\), il existe \(c\) strictement entre \(a\) et \(x\) tel que \(f(x) = T_n(x) + \dfrac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}\). Elle est fausse pour les fonctions à valeurs complexes ; l'inégalité suffit dans tous les usages du programme.</li>
    <li><strong>Formule de Stirling</strong> : \(n! \sim \sqrt{2\pi n}\left(\dfrac{n}{\mathrm{e}}\right)^n\). Une comparaison série-intégrale donne la forme \(C\sqrt n\,(n/\mathrm{e})^n\) ; l'équivalent de Wallis fixe la constante \(C = \sqrt{2\pi}\). On en tire aussi le produit de Wallis \(\dfrac{\pi}{2} = \displaystyle\prod_{k \ge 1} \frac{4k^2}{4k^2 - 1}\).</li>
    <li><strong>Sommes de Riemann</strong> : le théorème vaut pour toute fonction continue (continuité uniforme sur un segment, théorème de Heine) et même pour les fonctions continues par morceaux.</li>
    <li><strong>Série de Taylor qui ne converge pas vers la fonction</strong> : \(f(x) = \mathrm{e}^{-1/x^2}\) prolongée par \(f(0) = 0\) est de classe \(\mathcal{C}^\infty\) sur \(\mathbb{R}\), toutes ses dérivées en 0 sont nulles, et pourtant \(f \neq 0\). Le reste de Taylor ne tend pas toujours vers 0 : c'est pourquoi il faut le majorer (chapitre Séries entières).</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="i2a-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · INTÉGRATION SUR UN SEGMENT</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix savoir-faire de 1ʳᵉ année que la 2ᵉ année réinvestit sans cesse : encadrer, calculer, approcher et dériver des intégrales sur un segment, puis étudier une suite d'intégrales.</div>

  <div class="method-box"><strong>Méthode 1 — Encadrer ou majorer une intégrale</strong>
    <ol style="margin-top:.4rem">
      <li>Vérifier que les bornes sont dans l'ordre croissant (\(a \le b\)) : sinon, échanger les bornes et changer le signe.</li>
      <li>Encadrer l'intégrande sur tout le segment (\(m \le f \le M\), ou \(|f| \le g\)) en majorant séparément chaque facteur positif.</li>
      <li>Intégrer l'encadrement (croissance), ou utiliser \(\left|\int_a^b f\right| \le \int_a^b |f| \le (b-a)\sup_{[a,b]}|f|\).</li>
      <li>Pour une limite, conclure par encadrement (théorème des gendarmes).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(I_n = \int_0^1 t^n\,\mathrm{e}^t\,\mathrm{d}t\), on a \(t^n \le t^n\mathrm{e}^t \le \mathrm{e}\,t^n\) sur \([0, 1]\), donc \(\dfrac{1}{n+1} \le I_n \le \dfrac{\mathrm{e}}{n+1}\) et \(I_n \to 0\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : les inégalités ne s'intègrent que bornes dans l'ordre. Pour \(x \lt 0\), \(\int_0^x \mathrm{e}^{t}\,\mathrm{d}t = \mathrm{e}^x - 1\) est négative alors que l'intégrande est positif.</div>

  <div class="method-box"><strong>Méthode 2 — Montrer qu'une fonction est nulle par une intégrale</strong>
    <ol style="margin-top:.4rem">
      <li>Fabriquer une fonction <strong>continue</strong> et <strong>positive</strong> à partir de l'hypothèse, le plus souvent un carré \((f - g)^2\) ou une valeur absolue.</li>
      <li>Montrer que son intégrale sur \([a, b]\), avec \(a \lt b\), est nulle (développer, utiliser les hypothèses).</li>
      <li>Conclure : une fonction continue, positive, d'intégrale nulle sur un segment non réduit à un point est identiquement nulle.</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(f\) est continue sur \([0, 1]\) avec \(\int_0^1 f = \int_0^1 f^2 = 1\), alors \(\int_0^1 (f - 1)^2 = 1 - 2 + 1 = 0\), donc \(f = 1\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Calculer la limite d'une somme par une somme de Riemann</strong>
    <ol style="margin-top:.4rem">
      <li>Mettre en facteur le pas \(\dfrac1n\) (ou \(\dfrac{b-a}{n}\)), en factorisant au besoin \(n\) dans chaque terme.</li>
      <li>Écrire le terme restant sous la forme \(f(k/n)\), avec \(f\) continue indépendante de \(n\) et de \(k\).</li>
      <li>Lire l'intervalle sur les indices (\(k\) de \(1\) à \(n\) : \([0, 1]\)), appliquer le théorème, calculer l'intégrale.</li>
      <li>Pour un produit ou une racine \(n\)-ième, passer au logarithme, puis revenir par l'exponentielle (continue).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\sum_{k=1}^n \frac{n}{(n+k)^2} = \frac1n\sum_{k=1}^n \frac{1}{(1 + k/n)^2} \to \int_0^1 \frac{\mathrm{d}x}{(1+x)^2} = \frac12\) (valeur 0,496 pour \(n = 100\)).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une somme dont le terme général n'a pas la forme \(\frac1n f(k/n)\) n'est pas une somme de Riemann. \(\sum_{k=1}^n \frac{1}{n^2 + k}\) tend vers 0 par simple encadrement (chaque terme est au plus \(1/n^2\)).</div>

  <div class="method-box"><strong>Méthode 4 — Approcher une intégrale et majorer l'erreur</strong>
    <ol style="margin-top:.4rem">
      <li>Choisir le pas \(h = \dfrac{b-a}{n}\) et les points \(x_k = a + kh\).</li>
      <li>Rectangles à gauche : \(R_n = h\sum_{k=0}^{n-1} f(x_k)\), erreur au plus \(\dfrac{M_1(b-a)^2}{2n}\) avec \(M_1 = \sup|f'|\).</li>
      <li>Trapèzes : \(T_n = h\left(\frac{f(a)+f(b)}{2} + \sum_{k=1}^{n-1} f(x_k)\right)\), erreur au plus \(\dfrac{M_2(b-a)^3}{12n^2}\) avec \(M_2 = \sup|f''|\) (admis).</li>
      <li>Pour une précision \(\varepsilon\) imposée, résoudre « majorant \(\le \varepsilon\) » en \(n\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\int_0^1 \mathrm{e}^{-t^2}\,\mathrm{d}t \approx 0{,}746\,82\) et \(n = 10\) : \(M_1 = \sqrt{2/\mathrm{e}} \approx 0{,}86\) garantit une erreur au plus 0,043 pour \(R_{10} \approx 0{,}7778\) (erreur réelle 0,031) ; \(M_2 = 2\) garantit 0,0017 pour \(T_{10} \approx 0{,}7462\) (erreur réelle 0,0006).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Dériver une intégrale dont les bornes dépendent de \(x\)</strong>
    <ol style="margin-top:.4rem">
      <li>Vérifier que l'intégrande \(f\) est continue sur un intervalle \(I\) contenant toutes les bornes, et que \(u\), \(v\) sont dérivables.</li>
      <li>Si \(x\) figure aussi dans l'intégrande, le sortir d'abord de l'intégrale par linéarité.</li>
      <li>Appliquer \(G'(x) = f\big(v(x)\big)\,v'(x) - f\big(u(x)\big)\,u'(x)\), ou passer par une primitive \(F\) : \(G = F \circ v - F \circ u\).</li>
      <li>Exploiter : signe de \(G'\), parité (changement de variable \(t = -s\)), limites par encadrement de l'intégrande.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(G(x) = \int_x^{3x} \frac{\mathrm{d}t}{\sqrt{1+t^4}}\) est dérivable sur \(\mathbb{R}\) et \(G'(x) = \dfrac{3}{\sqrt{1 + 81x^4}} - \dfrac{1}{\sqrt{1 + x^4}}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : pour \(H(x) = \int_0^x \mathrm{e}^{x-t}\,f(t)\,\mathrm{d}t\), la formule ne s'applique pas telle quelle. On écrit \(H(x) = \mathrm{e}^x \int_0^x \mathrm{e}^{-t} f(t)\,\mathrm{d}t\), puis \(H'(x) = H(x) + f(x)\).</div>

  <div class="method-box"><strong>Méthode 6 — Intégrer par parties</strong>
    <ol style="margin-top:.4rem">
      <li>Repérer le facteur à dériver : polynôme (face à \(\exp\), \(\sin\), \(\cos\)), \(\ln\) ou \(\arctan\) (seuls, avec \(u' = 1\)).</li>
      <li>Écrire \(u'\), \(u\), \(v\), \(v'\), puis \(\int_a^b u'v = [uv]_a^b - \int_a^b uv'\).</li>
      <li>Polynôme de degré \(d\) : répéter \(d\) fois. Suite d'intégrales : une intégration par parties donne une relation de récurrence.</li>
      <li>Contrôler le résultat (signe attendu, valeur numérique).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(u' = 1\) et \(v = \arctan\),</p>
    <div class="formula">$$\begin{aligned} \int_0^1 \arctan t\,\mathrm{d}t &= \big[t\arctan t\big]_0^1 - \int_0^1 \frac{t}{1+t^2}\,\mathrm{d}t \\ &= \frac{\pi}{4} - \frac{\ln 2}{2} \approx 0{,}439. \end{aligned}$$</div>
  </div>

  <div class="method-box"><strong>Méthode 7 — Changer de variable</strong>
    <ol style="margin-top:.4rem">
      <li>Poser \(t = \varphi(s)\) (ou \(s = \psi(t)\)) ; remplacer \(\mathrm{d}t\) par \(\varphi'(s)\,\mathrm{d}s\) et changer les <strong>deux</strong> bornes.</li>
      <li>Choix usuels : \(t = \sin s\) pour \(\sqrt{1 - t^2}\) ; \(u = \mathrm{e}^t\) pour une fraction en \(\mathrm{e}^t\) ; \(t \mapsto a + b - t\) pour des bornes symétriques ou \([0, \pi/2]\).</li>
      <li>Sur une racine, garder \(\sqrt{\cos^2 s} = |\cos s|\) et choisir l'intervalle de \(s\) où le signe est connu.</li>
      <li>Sur un segment, aucune bijectivité n'est requise : \(\varphi\) de classe \(\mathcal{C}^1\) suffit.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(u = \mathrm{e}^t\), \(\mathrm{d}t = \frac{\mathrm{d}u}{u}\), et \(\frac{1}{u(u+1)} = \frac1u - \frac{1}{u+1}\) :</p>
    <div class="formula">$$\begin{aligned} \int_0^1 \frac{\mathrm{d}t}{\mathrm{e}^t + 1} &= \int_1^{\mathrm{e}} \frac{\mathrm{d}u}{u(u+1)} = \Big[\ln\frac{u}{u+1}\Big]_1^{\mathrm{e}} \\ &= 1 + \ln\frac{2}{1 + \mathrm{e}} \approx 0{,}380. \end{aligned}$$</div>
  </div>

  <div class="method-box"><strong>Méthode 8 — Encadrer une fonction avec la formule de Taylor</strong>
    <ol style="margin-top:.4rem">
      <li>Écrire la formule de Taylor avec reste intégral à l'ordre voulu, en \(a\) bien choisi (souvent 0).</li>
      <li>Si \(f^{(n+1)}\) est de signe constant entre \(a\) et \(x\) (avec \(x \ge a\)), le reste a ce signe : on obtient une inégalité exacte.</li>
      <li>Sinon, majorer \(|f^{(n+1)}|\) par \(M_{n+1}\) sur le segment : \(|f(x) - T_n(x)| \le M_{n+1}\dfrac{|x-a|^{n+1}}{(n+1)!}\) (Taylor-Lagrange).</li>
      <li>Pour une approximation numérique, choisir \(n\) pour que le majorant passe sous la précision demandée.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(f(x) = \ln(1+x)\) et \(x \ge 0\), \(f''(t) = -\frac{1}{(1+t)^2} \le 0\) et \(f'''(t) = \frac{2}{(1+t)^3} \ge 0\), donc \(x - \dfrac{x^2}{2} \le \ln(1+x) \le x\). Pour \(x = 0{,}1\) : \(0{,}095 \le \ln 1{,}1 \le 0{,}1\), et Taylor-Lagrange (\(M_3 = 2\)) borne l'erreur de 0,095 par \(\frac{2 \times 0{,}1^3}{6} \approx 3{,}3 \times 10^{-4}\) (erreur réelle \(3{,}1 \times 10^{-4}\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Utiliser l'inégalité de Cauchy-Schwarz</strong>
    <ol style="margin-top:.4rem">
      <li>Écrire la fonction à intégrer comme un produit \(f g\) de deux fonctions continues réelles bien choisies (souvent \(g = 1\), ou \(\sqrt{h}\) et \(1/\sqrt{h}\)).</li>
      <li>Appliquer \(\left(\int_a^b fg\right)^2 \le \int_a^b f^2 \times \int_a^b g^2\), sur le bon intervalle.</li>
      <li>Calculer les deux intégrales du membre de droite.</li>
      <li>Pour l'inégalité stricte ou l'optimalité, discuter le cas d'égalité (\(f\) et \(g\) colinéaires).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(f(t) = \sqrt{1 + t^3}\) et \(g = 1\) sur \([0, 1]\) :</p>
    <div class="formula">$$\int_0^1 \sqrt{1 + t^3}\,\mathrm{d}t \le \sqrt{\int_0^1 (1 + t^3)\,\mathrm{d}t} = \sqrt{\frac54} \approx 1{,}118,$$</div>
    <p>pour une valeur exacte d'environ 1,111.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Étudier une suite d'intégrales</strong>
    <ol style="margin-top:.4rem">
      <li>Signe et monotonie : comparer les intégrandes de \(I_n\) et \(I_{n+1}\) sur tout le segment.</li>
      <li>Limite : encadrer l'intégrande par une fonction simple (méthode 1) ; souvent \(t^n\), d'intégrale \(\frac{1}{n+1}\).</li>
      <li>Relation de récurrence : intégration par parties, ou linéarité (\(I_n + I_{n+2}\), \(I_n + I_{n+1}\)…).</li>
      <li>Équivalent : isoler le terme principal dans la relation et montrer que le reste est négligeable ; ou utiliser la monotonie (\(I_{n+1} \le I_n \le I_{n-1}\)) comme pour Wallis.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(I_n = \int_0^1 t^n\mathrm{e}^t\,\mathrm{d}t\), une intégration par parties donne \(I_n = \dfrac{\mathrm{e}}{n+1} - \dfrac{I_{n+1}}{n+1}\) ; comme \(0 \le I_{n+1} \le \frac{\mathrm{e}}{n+2}\), le second terme est négligeable et \(I_n \sim \dfrac{\mathrm{e}}{n}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un équivalent ne s'additionne pas. De \(I_n \sim \frac{\mathrm{e}}{n}\) et \(I_{n+1} \sim \frac{\mathrm{e}}{n}\), on ne peut pas déduire un équivalent de \(I_n - I_{n+1}\) : il faut repasser par la relation exacte.</div>
</div>
</template>

<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Limites de sommes</h3>
  <div class="statement">Calculer les limites, quand \(n \to +\infty\), des deux sommes suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle u_n = \sum_{k=1}^{n} \frac{n}{n^2 + k^2}\).</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle v_n = \sum_{k=1}^{n} \frac{k}{n^2 + k^2}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> On factorise \(n^2\) au dénominateur : \(\dfrac{n}{n^2+k^2} = \dfrac1n \cdot \dfrac{1}{1 + (k/n)^2}\). Donc \(u_n = \dfrac1n\displaystyle\sum_{k=1}^n f\!\left(\frac kn\right)\) avec \(f(x) = \dfrac{1}{1+x^2}\), continue sur \([0, 1]\). Par le théorème des sommes de Riemann :</p>
  <div class="formula">$$u_n \xrightarrow[n\to+\infty]{} \int_0^1 \frac{\mathrm{d}x}{1+x^2} = \arctan 1 = \frac{\pi}{4}.$$</div>
  <p><strong>Q2.</strong> De même, \(\dfrac{k}{n^2+k^2} = \dfrac1n \cdot \dfrac{k/n}{1 + (k/n)^2}\) : somme de Riemann de \(g(x) = \dfrac{x}{1+x^2}\), continue sur \([0, 1]\), d'où</p>
  <div class="formula">$$v_n \xrightarrow[n\to+\infty]{} \int_0^1 \frac{x\,\mathrm{d}x}{1+x^2} = \Big[\tfrac12\ln(1+x^2)\Big]_0^1 = \frac{\ln 2}{2} \approx 0{,}347.$$</div>
  <p>Contrôle : \(v_{100} \approx 0{,}349\), \(v_{1000} \approx 0{,}3468\).</p></div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Trois calculs d'intégrales</h3>
  <div class="statement">Calculer les intégrales suivantes en choisissant la technique adaptée.</div>
  <div class="q"><strong>Q1.</strong> \(A = \displaystyle\int_0^1 t^2\,\mathrm{e}^t\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q2.</strong> \(B = \displaystyle\int_1^{\mathrm{e}} (\ln t)^2\,\mathrm{d}t\). Pourquoi trouve-t-on la même valeur qu'en Q1 ?</div>
  <div class="q"><strong>Q3.</strong> \(C = \displaystyle\int_0^1 t^3\sqrt{1 - t^2}\,\mathrm{d}t\) (on pourra poser \(u = 1 - t^2\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Polynôme de degré 2 face à l'exponentielle : deux intégrations par parties, en dérivant le polynôme.</p>
  <div class="formula">$$\begin{aligned} A &= \big[t^2\mathrm{e}^t\big]_0^1 - 2\int_0^1 t\,\mathrm{e}^t\,\mathrm{d}t \\ &= \mathrm{e} - 2\left(\big[t\,\mathrm{e}^t\big]_0^1 - \int_0^1 \mathrm{e}^t\,\mathrm{d}t\right) \\ &= \mathrm{e} - 2\big(\mathrm{e} - (\mathrm{e} - 1)\big) = \mathrm{e} - 2 \approx 0{,}718. \end{aligned}$$</div>
  <p><strong>Q2.</strong> Intégration par parties avec \(u' = 1\), \(u = t\), \(v = (\ln t)^2\), \(v' = \frac{2\ln t}{t}\), puis la primitive \(t\ln t - t\) de \(\ln\) :</p>
  <div class="formula">$$\begin{aligned} B &= \big[t(\ln t)^2\big]_1^{\mathrm{e}} - 2\int_1^{\mathrm{e}} \ln t\,\mathrm{d}t \\ &= \mathrm{e} - 2\big[t\ln t - t\big]_1^{\mathrm{e}} = \mathrm{e} - 2. \end{aligned}$$</div>
  <p>Ce n'est pas un hasard : le changement de variable \(t = \mathrm{e}^s\), \(s \in [0, 1]\), \(\mathrm{d}t = \mathrm{e}^s\,\mathrm{d}s\), transforme \(B\) en \(\int_0^1 s^2\,\mathrm{e}^s\,\mathrm{d}s = A\).</p>
  <p><strong>Q3.</strong> On écrit \(t^3 = t^2 \cdot t\) et on pose \(u = 1 - t^2\) : \(\mathrm{d}u = -2t\,\mathrm{d}t\), \(t^2 = 1 - u\), et les bornes \(t = 0\), \(t = 1\) deviennent \(u = 1\), \(u = 0\) :</p>
  <div class="formula">$$\begin{aligned} C &= \int_1^0 (1 - u)\sqrt u\,\left(-\frac{\mathrm{d}u}{2}\right) = \frac12\int_0^1 \big(u^{1/2} - u^{3/2}\big)\,\mathrm{d}u \\ &= \frac12\left(\frac23 - \frac25\right) = \frac{2}{15}. \end{aligned}$$</div></div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Limite d'une racine \(n\)-ième</h3>
  <div class="statement">On pose, pour \(n \ge 1\), \(\displaystyle P_n = \left(\prod_{k=1}^{n}\left(1 + \frac{k^2}{n^2}\right)\right)^{1/n}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\ln P_n\) comme une somme de Riemann.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\int_0^1 \ln(1 + x^2)\,\mathrm{d}x\).</div>
  <div class="q"><strong>Q3.</strong> En déduire la limite de \(P_n\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Le logarithme transforme le produit en somme : \(\ln P_n = \dfrac1n\displaystyle\sum_{k=1}^n \ln\!\left(1 + \Big(\frac kn\Big)^2\right)\), somme de Riemann de \(f(x) = \ln(1 + x^2)\), continue sur \([0, 1]\). Elle tend donc vers \(\int_0^1 \ln(1+x^2)\,\mathrm{d}x\).</p>
  <p><strong>Q2.</strong> Intégration par parties (\(u' = 1\), \(v = \ln(1+x^2)\), \(v' = \frac{2x}{1+x^2}\)), puis \(\frac{x^2}{1+x^2} = 1 - \frac{1}{1+x^2}\) :</p>
  <div class="formula">$$\begin{aligned} \int_0^1 \ln(1+x^2)\,\mathrm{d}x &= \big[x\ln(1+x^2)\big]_0^1 - 2\int_0^1 \frac{x^2}{1+x^2}\,\mathrm{d}x \\ &= \ln 2 - 2\left(1 - \frac{\pi}{4}\right) = \ln 2 - 2 + \frac{\pi}{2}. \end{aligned}$$</div>
  <p><strong>Q3.</strong> Par continuité de l'exponentielle, \(P_n \to \exp\!\left(\ln 2 - 2 + \frac{\pi}{2}\right) = 2\,\mathrm{e}^{\pi/2 - 2} \approx 1{,}302\). Contrôle numérique : \(P_{10} \approx 1{,}349\), \(P_{100} \approx 1{,}307\), \(P_{1000} \approx 1{,}3025\).</p></div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Une intégrale à bornes variables</h3>
  <div class="statement">Pour \(x \gt 1\), on pose \(\displaystyle F(x) = \int_x^{x^2} \frac{\mathrm{d}t}{\ln t}\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(F\) est dérivable sur \(]1, +\infty[\) et calculer \(F'(x)\). En déduire les variations de \(F\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\displaystyle\int_x^{x^2} \frac{\mathrm{d}t}{t\ln t}\), puis montrer que \(x\ln 2 \le F(x) \le x^2\ln 2\).</div>
  <div class="q"><strong>Q3.</strong> En déduire les limites de \(F\) en \(1^+\) et en \(+\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(f : t \mapsto \frac{1}{\ln t}\) est continue sur \(]1, +\infty[\), et pour \(x \gt 1\) les bornes \(x\) et \(x^2\) sont dans cet intervalle ; \(u(x) = x\) et \(v(x) = x^2\) sont dérivables. Donc \(F\) est dérivable et</p>
  <div class="formula">$$F'(x) = \frac{2x}{\ln(x^2)} - \frac{1}{\ln x} = \frac{2x}{2\ln x} - \frac{1}{\ln x} = \frac{x - 1}{\ln x}.$$</div>
  <p>Pour \(x \gt 1\), \(x - 1 \gt 0\) et \(\ln x \gt 0\) : \(F\) est strictement croissante.</p>
  <p><strong>Q2.</strong> Une primitive de \(\frac{1}{t\ln t}\) sur \(]1, +\infty[\) est \(\ln(\ln t)\), d'où \(\int_x^{x^2} \frac{\mathrm{d}t}{t\ln t} = \ln(2\ln x) - \ln(\ln x) = \ln 2\). Pour \(t \in [x, x^2]\), on écrit \(\frac{1}{\ln t} = t \times \frac{1}{t\ln t}\) avec \(\frac{1}{t\ln t} \gt 0\) et \(x \le t \le x^2\) :</p>
  <div class="formula">$$\frac{x}{t\ln t} \le \frac{1}{\ln t} \le \frac{x^2}{t\ln t}.$$</div>
  <p>Les bornes sont dans l'ordre (\(x \lt x^2\)) : on intègre l'encadrement, ce qui donne \(x\ln 2 \le F(x) \le x^2 \ln 2\).</p>
  <p><strong>Q3.</strong> Quand \(x \to 1^+\), les deux bornes tendent vers \(\ln 2\) : \(F(x) \to \ln 2\) par encadrement (contrôle : \(F(1{,}01) \approx 0{,}703\), \(F(1{,}001) \approx 0{,}694\)). Quand \(x \to +\infty\), \(F(x) \ge x\ln 2 \to +\infty\). Remarque : l'intégrande n'a pas de limite finie en \(1\), mais l'intervalle d'intégration se réduit assez vite pour que \(F\) ait une limite.</p></div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Rectangles ou trapèzes ?</h3>
  <div class="statement">On veut approcher \(\dfrac{\pi}{4} = \displaystyle\int_0^1 f(t)\,\mathrm{d}t\) avec \(f(t) = \dfrac{1}{1+t^2}\), par la méthode des rectangles à gauche \(R_n\) et par celle des trapèzes \(T_n\) (pas \(h = 1/n\)).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(R_4\) et \(T_4\) sous forme de fractions, puis comparer à \(\frac{\pi}{4} \approx 0{,}785\,40\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(M_1 = \sup_{[0,1]}|f'|\) et montrer que \(M_2 = \sup_{[0,1]}|f''| = 2\).</div>
  <div class="q"><strong>Q3.</strong> À l'aide des majorations d'erreur du cours, déterminer un \(n\) qui garantit une erreur au plus \(10^{-6}\) pour chacune des deux méthodes.</div>
  <div class="q"><strong>Q4.</strong> Écrire une fonction Python <code>trapezes(f, a, b, n)</code>. Que devient l'erreur de \(T_n\) quand on double \(n\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(f(0) = 1\), \(f(\frac14) = \frac{16}{17}\), \(f(\frac12) = \frac45\), \(f(\frac34) = \frac{16}{25}\), \(f(1) = \frac12\). Donc</p>
  <div class="formula">$$\begin{aligned} R_4 &= \frac14\left(1 + \frac{16}{17} + \frac45 + \frac{16}{25}\right) = \frac{1437}{1700} \approx 0{,}8453, \\ T_4 &= R_4 - \frac14 \cdot \frac{f(0) - f(1)}{2} = \frac{5323}{6800} \approx 0{,}7828. \end{aligned}$$</div>
  <p>Erreurs : \(R_4 - \frac{\pi}{4} \approx 0{,}060\) (par excès : \(f\) décroît, chaque rectangle déborde de la courbe) ; \(T_4 - \frac{\pi}{4} \approx -0{,}0026\), vingt fois plus petite.</p>
  <p><strong>Q2.</strong> \(f'(t) = -\dfrac{2t}{(1+t^2)^2}\). La fonction \(t \mapsto \frac{2t}{(1+t^2)^2}\) a pour dérivée \(\frac{2(1 - 3t^2)}{(1+t^2)^3}\) : elle est maximale en \(t = \frac{1}{\sqrt3}\), d'où \(M_1 = \dfrac{2/\sqrt3}{(4/3)^2} = \dfrac{3\sqrt3}{8} \approx 0{,}650\). Ensuite \(f''(t) = \dfrac{2(3t^2 - 1)}{(1+t^2)^3}\). Sur \([0, \frac{1}{\sqrt3}]\), \(|f''(t)| = \frac{2(1 - 3t^2)}{(1+t^2)^3} \le 2\), avec égalité en 0 ; sur \([\frac{1}{\sqrt3}, 1]\), \(|f''(t)| \le \frac{2 \times 2}{(4/3)^3} = \frac{27}{16} \lt 2\). Donc \(M_2 = 2\).</p>
  <p><strong>Q3.</strong> Rectangles : \(\dfrac{M_1}{2n} \le 10^{-6}\) impose \(n \ge \dfrac{3\sqrt3}{16} \times 10^{6} \approx 324\,760\). Trapèzes : \(\dfrac{M_2}{12n^2} = \dfrac{1}{6n^2} \le 10^{-6}\) impose \(n^2 \ge \dfrac{10^6}{6}\), soit \(n \ge 409\). La méthode des trapèzes demande environ 800 fois moins de points.</p>
  <p><strong>Q4.</strong></p>
  <pre class="codeblock"><span class="kw">def</span> trapezes(f, a, b, n):
    h = (b - a) / n
    s = (f(a) + f(b)) / 2
    <span class="kw">for</span> k <span class="kw">in</span> range(1, n):
        s += f(a + k * h)
    <span class="kw">return</span> h * s</pre>
  <p>L'erreur se comporte comme \(\frac{C}{n^2}\) : doubler \(n\) la divise environ par 4 (\(T_{10} - \frac\pi4 \approx -4{,}2 \times 10^{-4}\), et \(T_{20}\) donne environ \(-1{,}0 \times 10^{-4}\)).</p></div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Récurrence de Wallis</h3>
  <div class="statement">Pour \(n \in \mathbb{N}\), on pose \(W_n = \displaystyle\int_0^{\pi/2} \cos^n t\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Établir \(n W_n = (n-1)W_{n-2}\) pour \(n \ge 2\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(W_4\) et \(W_5\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier sur \(n = 5\) que \(n W_n W_{n-1} = \frac{\pi}{2}\), puis démontrer cette égalité pour tout \(n \ge 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> On écrit \(\cos^n t = \cos^{n-1} t \times \cos t\) et on intègre par parties avec \(v = \cos^{n-1}\), \(v' = -(n-1)\cos^{n-2}\sin\), \(u' = \cos\), \(u = \sin\). Le crochet \(\big[\sin t\cos^{n-1} t\big]_0^{\pi/2}\) est nul (\(n - 1 \ge 1\)), donc</p>
  <div class="formula">$$\begin{aligned} W_n &= (n-1)\int_0^{\pi/2} \cos^{n-2} t\,\sin^2 t\,\mathrm{d}t \\ &= (n-1)\big(W_{n-2} - W_n\big), \end{aligned}$$</div>
  <p>en remplaçant \(\sin^2 t\) par \(1 - \cos^2 t\). D'où \(n W_n = (n-1) W_{n-2}\).</p>
  <p><strong>Q2.</strong> \(W_0 = \frac{\pi}{2}\), \(W_1 = \big[\sin t\big]_0^{\pi/2} = 1\), puis \(W_2 = \frac12 W_0 = \frac{\pi}{4}\), \(W_4 = \frac34 W_2 = \frac{3\pi}{16}\), et \(W_3 = \frac23 W_1 = \frac23\), \(W_5 = \frac45 W_3 = \frac{8}{15}\).</p>
  <p><strong>Q3.</strong> \(5\,W_5 W_4 = 5 \times \frac{8}{15} \times \frac{3\pi}{16} = \frac{\pi}{2}\). En général, on pose \(c_n = n W_n W_{n-1}\) pour \(n \ge 1\). La relation de Q1 au rang \(n + 1\) s'écrit \((n+1)W_{n+1} = n W_{n-1}\) ; en la multipliant par \(W_n\), on obtient \(c_{n+1} = (n+1)W_{n+1}W_n = n W_n W_{n-1} = c_n\). La suite \((c_n)\) est constante, égale à \(c_1 = W_1 W_0 = \frac{\pi}{2}\).</p></div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Taylor avec reste intégral pour l'exponentielle</h3>
  <div class="statement">Soit \(n \in \mathbb{N}\) et \(x \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Écrire la formule de Taylor avec reste intégral de \(\exp\) en 0 à l'ordre \(n\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que le reste \(R_n(x)\) vérifie \(|R_n(x)| \le \dfrac{|x|^{n+1}}{(n+1)!}\,\mathrm{e}^{|x|}\), puis que \(R_n(x) \to 0\) quand \(n \to +\infty\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(\mathrm{e}^x = \displaystyle\sum_{k=0}^{+\infty} \frac{x^k}{k!}\).</div>
  <div class="q"><strong>Q4.</strong> Pour \(x = -1\), montrer que \(|R_n(-1)| \le \dfrac{1}{(n+1)!}\) et donner un \(n\) qui assure \(\left|\mathrm{e}^{-1} - \sum_{k=0}^n \frac{(-1)^k}{k!}\right| \le 10^{-4}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Toutes les dérivées de \(\exp\) valent \(\exp\), et \(\exp^{(k)}(0) = 1\) :</p>
  <div class="formula">$$\mathrm{e}^x = \sum_{k=0}^{n} \frac{x^k}{k!} + \underbrace{\int_0^x \frac{(x-t)^n}{n!}\,\mathrm{e}^t\,\mathrm{d}t}_{R_n(x)}.$$</div>
  <p><strong>Q2.</strong> On majore l'exponentielle sur le segment d'extrémités 0 et \(x\), puis on intègre exactement le facteur polynomial. Si \(x \ge 0\) : \(\mathrm{e}^t \le \mathrm{e}^x\) sur \([0, x]\), donc \(0 \le R_n(x) \le \mathrm{e}^x\int_0^x \frac{(x-t)^n}{n!}\,\mathrm{d}t = \mathrm{e}^x\frac{x^{n+1}}{(n+1)!}\). Si \(x \lt 0\) : on remet les bornes dans l'ordre, \(|R_n(x)| \le \int_x^0 \frac{(t-x)^n}{n!}\,\mathrm{e}^t\,\mathrm{d}t \le \frac{|x|^{n+1}}{(n+1)!}\) car \(\mathrm{e}^t \le 1\) sur \([x, 0]\). Dans les deux cas, la majoration annoncée est vraie. Enfin, à \(x\) fixé, \(a_n = \frac{|x|^{n}}{n!}\) vérifie \(\frac{a_{n+1}}{a_n} = \frac{|x|}{n+1} \le \frac12\) dès que \(n + 1 \ge 2|x|\) : la suite \((a_n)\) est alors majorée par une suite géométrique de raison \(\frac12\) et tend vers 0. Donc \(R_n(x) \to 0\).</p>
  <p><strong>Q3.</strong> La somme partielle \(\sum_{k=0}^n \frac{x^k}{k!} = \mathrm{e}^x - R_n(x)\) tend vers \(\mathrm{e}^x\) : la série converge et a pour somme \(\mathrm{e}^x\), pour tout réel \(x\).</p>
  <p><strong>Q4.</strong> Le cas \(x \lt 0\) de Q2 donne \(|R_n(-1)| \le \frac{1}{(n+1)!}\). Il suffit que \((n+1)! \ge 10^4\) : \(7! = 5\,040\) ne suffit pas, \(8! = 40\,320\) convient. On prend \(n = 7\) : l'erreur réelle vaut environ \(2{,}2 \times 10^{-5}\).</p></div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Cauchy-Schwarz et une minoration de \(\pi\)</h3>
  <div class="statement">Soit \(f\) continue et strictement positive sur un segment \([a, b]\) avec \(a \lt b\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\displaystyle\left(\int_a^b f(t)\,\mathrm{d}t\right)\left(\int_a^b \frac{\mathrm{d}t}{f(t)}\right) \ge (b-a)^2\).</div>
  <div class="q"><strong>Q2.</strong> Étudier le cas d'égalité.</div>
  <div class="q"><strong>Q3.</strong> Appliquer à \(f(t) = 1 + t^2\) sur \([0, 1]\) : qu'obtient-on sur \(\pi\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Les fonctions \(\sqrt f\) et \(\frac{1}{\sqrt f}\) sont continues sur \([a, b]\) (car \(f \gt 0\)) et leur produit vaut 1. L'inégalité de Cauchy-Schwarz donne</p>
  <div class="formula">$$\left(\int_a^b \sqrt f \cdot \frac{1}{\sqrt f}\right)^2 \le \int_a^b f \times \int_a^b \frac1f,$$</div>
  <p>et le membre de gauche vaut \(\left(\int_a^b 1\right)^2 = (b-a)^2\).</p>
  <p><strong>Q2.</strong> Il y a égalité si et seulement si \(\sqrt f\) et \(\frac{1}{\sqrt f}\) sont colinéaires, c'est-à-dire s'il existe une constante \(\lambda\) telle que \(\sqrt f = \frac{\lambda}{\sqrt f}\), soit \(f = \lambda\) : l'égalité a lieu exactement pour les fonctions constantes (strictement positives).</p>
  <p><strong>Q3.</strong> \(\int_0^1 (1 + t^2)\,\mathrm{d}t = \frac43\) et \(\int_0^1 \frac{\mathrm{d}t}{1+t^2} = \frac{\pi}{4}\). Donc \(\frac43 \times \frac{\pi}{4} = \frac{\pi}{3} \ge 1\), c'est-à-dire \(\pi \ge 3\), et même \(\pi \gt 3\) puisque \(1 + t^2\) n'est pas constante.</p></div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Une suite d'intégrales qui prouve que e est irrationnel</h3>
  <div class="statement">Pour \(n \in \mathbb{N}\), on pose \(I_n = \displaystyle\int_0^1 (1 - t)^n\,\mathrm{e}^t\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\dfrac{1}{n+1} \le I_n \le \dfrac{\mathrm{e}}{n+1}\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(I_0\) et montrer que \(I_n = n I_{n-1} - 1\) pour \(n \ge 1\).</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(\dfrac{I_n}{n!} = \mathrm{e} - \displaystyle\sum_{k=0}^n \frac{1}{k!}\). Quel lien avec la formule de Taylor ?</div>
  <div class="q"><strong>Q4.</strong> On suppose \(\mathrm{e} = \frac{p}{q}\) avec \(p\), \(q\) entiers, \(q \ge 2\). Montrer que \(A = q!\left(\mathrm{e} - \sum_{k=0}^q \frac{1}{k!}\right)\) est un entier vérifiant \(0 \lt A \lt 1\), et conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Sur \([0, 1]\), \(1 \le \mathrm{e}^t \le \mathrm{e}\) et \((1-t)^n \ge 0\), donc \((1-t)^n \le (1-t)^n\mathrm{e}^t \le \mathrm{e}\,(1-t)^n\). Bornes dans l'ordre : on intègre, avec \(\int_0^1 (1-t)^n\,\mathrm{d}t = \frac{1}{n+1}\).</p>
  <p><strong>Q2.</strong> \(I_0 = \mathrm{e} - 1\). Pour \(n \ge 1\), on dérive \((1-t)^n\) et on primitive \(\mathrm{e}^t\) :</p>
  <div class="formula">$$\begin{aligned} I_n &= \Big[(1-t)^n\,\mathrm{e}^t\Big]_0^1 + n\int_0^1 (1-t)^{n-1}\,\mathrm{e}^t\,\mathrm{d}t \\ &= (0 - 1) + n I_{n-1}. \end{aligned}$$</div>
  <p><strong>Q3.</strong> Récurrence sur \(n\). Pour \(n = 0\), \(I_0 = \mathrm{e} - 1\) : c'est la formule. Si elle est vraie au rang \(n - 1\), alors, en divisant la relation de Q2 par \(n!\),</p>
  <div class="formula">$$\frac{I_n}{n!} = \frac{I_{n-1}}{(n-1)!} - \frac{1}{n!} = \mathrm{e} - \sum_{k=0}^{n-1}\frac{1}{k!} - \frac{1}{n!}.$$</div>
  <p>C'est exactement la formule de Taylor avec reste intégral de \(\exp\) entre 0 et 1 : le reste \(\int_0^1 \frac{(1-t)^n}{n!}\mathrm{e}^t\,\mathrm{d}t\) vaut \(\frac{I_n}{n!}\).</p>
  <p><strong>Q4.</strong> \(q!\,\mathrm{e} = p\,(q-1)!\) est un entier, et chaque \(\frac{q!}{k!}\) (\(k \le q\)) aussi : \(A\) est un entier. Par Q3 et Q1, \(A = I_q\) vérifie \(0 \lt \frac{1}{q+1} \le A \le \frac{\mathrm{e}}{q+1} \le \frac{\mathrm{e}}{3} \lt 1\). Aucun entier n'est strictement compris entre 0 et 1 : contradiction. Comme toute fraction peut s'écrire avec un dénominateur \(q \ge 2\) (\(\frac pq = \frac{2p}{2q}\)), \(\mathrm{e}\) est irrationnel.</p></div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Trois façons d'approcher \(\ln 2\)</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : suites d'intégrales, sommes de Riemann, vitesse de convergence).</div>
  <div class="statement">Pour \(n \in \mathbb{N}\), on pose \(J_n = \displaystyle\int_0^1 \frac{t^n}{1+t}\,\mathrm{d}t\) et, pour \(n \ge 1\), \(S_n = \displaystyle\sum_{k=1}^n \frac{(-1)^{k+1}}{k}\) (avec \(S_0 = 0\)).</div>
  <p class="exo-part">Partie A — Une suite d'intégrales</p>
  <div class="q"><strong>A1.</strong> Calculer \(J_0\). Montrer que \((J_n)\) est décroissante, que \(0 \le J_n \le \frac{1}{n+1}\), et donner sa limite.</div>
  <div class="q"><strong>A2.</strong> Montrer que \(J_n + J_{n+1} = \dfrac{1}{n+1}\) pour tout \(n \in \mathbb{N}\).</div>
  <div class="q"><strong>A3.</strong> Montrer par récurrence que \(\ln 2 = S_n + (-1)^n J_n\). En déduire que \(S_n \to \ln 2\) et que \(|\ln 2 - S_n| \le \frac{1}{n+1}\).</div>
  <p class="exo-part">Partie B — Vitesse de convergence et accélération</p>
  <div class="q"><strong>B1.</strong> Par une intégration par parties, montrer que \(J_n = \dfrac{1}{2(n+1)} + \dfrac{1}{n+1}\displaystyle\int_0^1 \frac{t^{n+1}}{(1+t)^2}\,\mathrm{d}t\).</div>
  <div class="q"><strong>B2.</strong> En déduire que \(J_n \sim \dfrac{1}{2n}\). Que dire de l'erreur \(\ln 2 - S_n\) ?</div>
  <div class="q"><strong>B3.</strong> On pose \(M_n = \frac12(S_n + S_{n+1})\). Montrer que \(|\ln 2 - M_n| \le \dfrac{1}{2(n+1)(n+2)}\).</div>
  <p class="exo-part">Partie C — Sommes de Riemann</p>
  <div class="q"><strong>C1.</strong> Pour \(n \ge 1\), soit \(u_n = \displaystyle\sum_{k=n+1}^{2n} \frac1k\). Montrer que \(u_n \to \ln 2\) à l'aide d'une somme de Riemann.</div>
  <div class="q"><strong>C2.</strong> Montrer que \(u_n = S_{2n}\).</div>
  <div class="q"><strong>C3.</strong> En comparant \(\frac1k\) à des intégrales de \(t \mapsto \frac1t\), montrer que \(\ln\dfrac{2n+1}{n+1} \le u_n \le \ln 2\).</div>
  <p class="exo-part">Partie D — Bilan numérique</p>
  <div class="q"><strong>D1.</strong> Écrire une fonction Python <code>M(n)</code> qui renvoie \(M_n\).</div>
  <div class="q"><strong>D2.</strong> Quel rang \(n\) les majorations de A3 et de B3 garantissent-elles pour une erreur au plus \(10^{-6}\) ? Comparer avec la méthode des trapèzes appliquée à \(\int_0^1 \frac{\mathrm{d}t}{1+t}\), d'erreur au plus \(\frac{M_2}{12n^2}\) avec \(M_2 = \sup_{[0,1]}\left|\frac{2}{(1+t)^3}\right|\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>A1.</strong> \(J_0 = \big[\ln(1+t)\big]_0^1 = \ln 2\). Sur \([0, 1]\), \(t^{n+1} \le t^n\), donc \(\frac{t^{n+1}}{1+t} \le \frac{t^n}{1+t}\) et \(J_{n+1} \le J_n\). De plus \(0 \le \frac{t^n}{1+t} \le t^n\), d'où \(0 \le J_n \le \frac{1}{n+1}\) : \(J_n \to 0\).</p>
  <p><strong>A2.</strong> Par linéarité, \(J_n + J_{n+1} = \int_0^1 \frac{t^n(1+t)}{1+t}\,\mathrm{d}t = \int_0^1 t^n\,\mathrm{d}t = \frac{1}{n+1}\).</p>
  <p><strong>A3.</strong> Au rang 0 : \(S_0 + J_0 = \ln 2\). Si \(\ln 2 = S_n + (-1)^n J_n\), on remplace \(J_n\) par \(\frac{1}{n+1} - J_{n+1}\) (A2) :</p>
  <div class="formula">$$\ln 2 = S_n + \frac{(-1)^{n}}{n+1} + (-1)^{n+1}J_{n+1} = S_{n+1} + (-1)^{n+1}J_{n+1},$$</div>
  <p>car \(\frac{(-1)^n}{n+1} = \frac{(-1)^{(n+1)+1}}{n+1}\) est le terme d'indice \(n+1\) de \(S_{n+1}\). Donc \(|\ln 2 - S_n| = J_n \le \frac{1}{n+1} \to 0\).</p>
  <p><strong>B1.</strong> On primitive \(t^n\) en \(\frac{t^{n+1}}{n+1}\) et on dérive \(\frac{1}{1+t}\) en \(-\frac{1}{(1+t)^2}\) :</p>
  <div class="formula">$$J_n = \left[\frac{t^{n+1}}{(n+1)(1+t)}\right]_0^1 + \frac{1}{n+1}\int_0^1 \frac{t^{n+1}}{(1+t)^2}\,\mathrm{d}t,$$</div>
  <p>et le crochet vaut \(\frac{1}{2(n+1)}\).</p>
  <p><strong>B2.</strong> Comme \(0 \le \frac{t^{n+1}}{(1+t)^2} \le t^{n+1}\), l'intégrale de B1 est comprise entre 0 et \(\frac{1}{n+2}\) ; le second terme est donc au plus \(\frac{1}{(n+1)(n+2)}\), négligeable devant \(\frac{1}{2(n+1)}\). Ainsi \(J_n \sim \frac{1}{2(n+1)} \sim \frac{1}{2n}\). L'erreur \(\ln 2 - S_n = (-1)^n J_n\) change de signe à chaque rang et vaut environ \(\frac{1}{2n}\) en valeur absolue : la convergence est lente, et la majoration de A3 est optimale à un facteur 2 près.</p>
  <p><strong>B3.</strong> Par A3, en moyennant les égalités aux rangs \(n\) et \(n + 1\) :</p>
  <div class="formula">$$\ln 2 - M_n = \frac12\Big((-1)^n J_n + (-1)^{n+1}J_{n+1}\Big) = \frac{(-1)^n}{2}\,(J_n - J_{n+1}).$$</div>
  <p>Or</p>
  <div class="formula">$$0 \le J_n - J_{n+1} = \int_0^1 \frac{t^n(1-t)}{1+t}\,\mathrm{d}t \le \int_0^1 t^n(1-t)\,\mathrm{d}t = \frac{1}{(n+1)(n+2)},$$</div>
  <p>d'où le résultat. Moyenner deux sommes partielles consécutives compense les oscillations de l'erreur.</p>
  <p><strong>C1.</strong> On réindexe \(k = n + j\), \(j\) de 1 à \(n\) : \(u_n = \sum_{j=1}^n \frac{1}{n+j} = \frac1n\sum_{j=1}^n \frac{1}{1 + j/n}\), somme de Riemann de \(x \mapsto \frac{1}{1+x}\), continue sur \([0, 1]\). Donc \(u_n \to \int_0^1 \frac{\mathrm{d}x}{1+x} = \ln 2\).</p>
  <p><strong>C2.</strong> Dans \(S_{2n}\), on sépare les termes d'indice impair (signe +) et pair (signe −) : avec \(H_m = \sum_{k=1}^m \frac1k\),</p>
  <div class="formula">$$S_{2n} = H_{2n} - 2\sum_{j=1}^{n}\frac{1}{2j} = H_{2n} - H_n = u_n.$$</div>
  <p><strong>C3.</strong> \(t \mapsto \frac1t\) décroît sur \(]0, +\infty[\) : pour \(k \ge 1\), \(\int_k^{k+1}\frac{\mathrm{d}t}{t} \le \frac1k \le \int_{k-1}^{k}\frac{\mathrm{d}t}{t}\) (la seconde inégalité pour \(k \ge 2\)). En sommant de \(k = n+1\) à \(2n\) :</p>
  <div class="formula">$$\ln\frac{2n+1}{n+1} = \int_{n+1}^{2n+1}\frac{\mathrm{d}t}{t} \le u_n \le \int_n^{2n}\frac{\mathrm{d}t}{t} = \ln 2.$$</div>
  <p>On retrouve \(u_n \to \ln 2\), avec \(0 \le \ln 2 - u_n \le \ln\frac{2n+2}{2n+1} \le \frac{1}{2n+1}\), conforme à A3 pour \(S_{2n}\).</p>
  <p><strong>D1.</strong></p>
  <pre class="codeblock"><span class="kw">def</span> M(n):
    S = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(1, n + 1):
        S += (-1) ** (k + 1) / k
    S_suiv = S + (-1) ** (n + 2) / (n + 1)
    <span class="kw">return</span> (S + S_suiv) / 2</pre>
  <p><strong>D2.</strong> A3 : \(\frac{1}{n+1} \le 10^{-6}\) impose \(n \ge 999\,999\). B3 : \((n+1)(n+2) \ge 5 \times 10^5\) suffit, soit \(n \ge 706\) (l'erreur réelle pour \(n = 706\) est d'environ \(5 \times 10^{-7}\)). Trapèzes : \(M_2 = 2\) (atteint en \(t = 0\)), et \(\frac{2}{12n^2} \le 10^{-6}\) impose \(n \ge 409\). La série alternée brute est inutilisable ; moyennée, elle rivalise avec la méthode des trapèzes.</p></div>
