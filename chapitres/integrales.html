<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Calculs directs</h3>
  <div class="statement">Calculer les intégrales suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\int_0^1 (3x^2 - 2x + 1)\,\mathrm{d}x\)</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\int_0^{\pi/2} \cos x\,\mathrm{d}x\)</div>
  <div class="q"><strong>Q3.</strong> \(\displaystyle\int_1^e \frac{\mathrm{d}x}{x}\)</div>
  <div class="q"><strong>Q4.</strong> \(\displaystyle\int_0^1 \frac{\mathrm{d}x}{1 + x^2}\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \([x^3 - x^2 + x]_0^1 = 1 - 1 + 1 = 1\).</p>
    <p><strong>Q2.</strong> \([\sin x]_0^{\pi/2} = 1\).</p>
    <p><strong>Q3.</strong> \([\ln x]_1^e = 1\).</p>
    <p><strong>Q4.</strong> \([\arctan x]_0^1 = \pi/4\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Intégration par parties</h3>
  <div class="statement">Calculer les intégrales suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\int_0^1 x\,e^x\,\mathrm{d}x\)</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\int_1^e \ln x\,\mathrm{d}x\)</div>
  <div class="q"><strong>Q3.</strong> \(\displaystyle\int_0^1 \arctan x\,\mathrm{d}x\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> IPP avec \(v = x\), \(u' = e^x\) (donc \(v' = 1\), \(u = e^x\)) :</p><div class="formula">$$\int_0^1 xe^x\,\mathrm{d}x = [xe^x]_0^1 - \int_0^1 e^x\,\mathrm{d}x = e - (e - 1) = 1.$$</div>
    <p><strong>Q2.</strong> \(\ln x = 1 \cdot \ln x\). IPP avec \(v = \ln x\) (priorité LIATE), \(u' = 1\) (donc \(v' = 1/x\), \(u = x\)) :</p><div class="formula">$$\int_1^e \ln x\,\mathrm{d}x = [x\ln x]_1^e - \int_1^e 1\,\mathrm{d}x = e - (e - 1) = 1.$$</div>
    <p><strong>Q3.</strong> IPP avec \(v = \arctan x\), \(u' = 1\) (donc \(v' = 1/(1+x^2)\), \(u = x\)) :</p><div class="formula">$$\int_0^1 \arctan x\,\mathrm{d}x = [x\arctan x]_0^1 - \int_0^1 \frac{x}{1+x^2}\,\mathrm{d}x = \frac{\pi}{4} - \frac{1}{2}\ln 2.$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Changement de variable</h3>
  <div class="statement">Calculer en effectuant un changement de variable judicieux.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\int_0^1 \frac{x}{\sqrt{1 + x^2}}\,\mathrm{d}x\) (poser \(u = 1 + x^2\))</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\int_1^4 \frac{1}{\sqrt{x}(1 + x)}\,\mathrm{d}x\) (poser \(u = \sqrt{x}\))</div>
  <div class="q"><strong>Q3.</strong> \(\displaystyle\int_0^{\ln 2} \frac{e^x}{1 + e^{2x}}\,\mathrm{d}x\) (poser \(u = e^x\))</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u = 1+x^2\), \(\mathrm{d}u = 2x\,\mathrm{d}x\). Bornes : \(x=0 \to u=1\), \(x=1 \to u=2\).</p><div class="formula">$$I = \int_1^2 \frac{1}{\sqrt{u}}\cdot\frac{\mathrm{d}u}{2} = \frac{1}{2}[2\sqrt{u}]_1^2 = \sqrt{2} - 1.$$</div>
    <p><strong>Q2.</strong> \(u = \sqrt{x}\), donc \(x = u^2\), \(\mathrm{d}x = 2u\,\mathrm{d}u\). Bornes : \(x=1 \to u=1\), \(x=4 \to u=2\).</p><div class="formula">$$I = \int_1^2 \frac{2u\,\mathrm{d}u}{u(1 + u^2)} = \int_1^2 \frac{2\,\mathrm{d}u}{1 + u^2} = 2\big[\arctan u\big]_1^2 = 2\left(\arctan 2 - \frac\pi4\right).$$</div>
    <p><strong>Q3.</strong> \(u = e^x\), \(\mathrm{d}u = e^x\,\mathrm{d}x\). Bornes : \(x=0 \to u=1\), \(x=\ln 2 \to u=2\).</p><div class="formula">$$I = \int_1^2 \frac{\mathrm{d}u}{1 + u^2} = [\arctan u]_1^2 = \arctan 2 - \pi/4.$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ★</span>
  <h3>Somme de Riemann</h3>
  <div class="statement">Déterminer les limites suivantes en les reconnaissant comme des sommes de Riemann.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\lim_{n\to\infty} \frac{1}{n}\sum_{k=1}^n \sin\!\left(\frac{k\pi}{n}\right)\)</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\lim_{n\to\infty} \sum_{k=1}^n \frac{n}{n^2 + k^2}\)</div>
  <div class="q"><strong>Q3.</strong> \(\displaystyle\lim_{n\to\infty} \frac{1}{n}\sum_{k=1}^n \sqrt{\frac{k}{n}}\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\frac{1}{n}\sum f(k/n)\) avec \(f(x) = \sin(\pi x)\) sur \([0,1]\). Limite : </p><div class="formula">$$\int_0^1 \sin(\pi x)\,\mathrm{d}x = [-\cos(\pi x)/\pi]_0^1 = 2/\pi.$$</div>
    <p><strong>Q2.</strong> Mettre \(n\) en facteur : </p><div class="formula">$$\sum \frac{n}{n^2 + k^2} = \sum \frac{1}{n}\cdot\frac{1}{1 + (k/n)^2} = \frac{1}{n}\sum f(k/n)$$</div><p> avec \(f(x) = 1/(1+x^2)\). Limite : \(\int_0^1 \frac{\mathrm{d}x}{1+x^2} = \pi/4\).</p>
    <p><strong>Q3.</strong> \(\frac{1}{n}\sum \sqrt{k/n} = \frac{1}{n}\sum f(k/n)\) avec \(f(x) = \sqrt{x}\). Limite : \(\int_0^1 \sqrt{x}\,\mathrm{d}x = 2/3\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Exp × trig</h3>
  <div class="statement">Calculer \(\displaystyle I = \int_0^\pi e^x \cos x\,\mathrm{d}x\) et \(\displaystyle J = \int_0^\pi e^x \sin x\,\mathrm{d}x\) par deux méthodes.</div>
  <div class="q"><strong>Q1.</strong> Méthode 1 : par double IPP. Donner l'idée et calculer \(I\).</div>
  <div class="q"><strong>Q2.</strong> Méthode 2 : passer en complexes. Calculer \(I + iJ\) puis identifier.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> IPP avec \(v = \cos x\), \(u' = e^x\) (\(v' = -\sin x\), \(u = e^x\)) :</p><div class="formula">$$I = [e^x\cos x]_0^\pi + \int_0^\pi e^x\sin x\,\mathrm{d}x = -e^\pi - 1 + J.$$</div><p><br>
    Idem pour \(J\) avec \(v = \sin x\), \(u' = e^x\) :</p><div class="formula">$$J = [e^x\sin x]_0^\pi - \int_0^\pi e^x\cos x\,\mathrm{d}x = 0 - I.$$</div><p><br>
    Système : \(I = -e^\pi - 1 + J\) et \(J = -I\). Donc \(I = -e^\pi - 1 - I\), soit \(I = -\frac{e^\pi + 1}{2}\). Et \(J = \frac{e^\pi + 1}{2}\).</p>
    <p><strong>Q2.</strong></p><div class="formula">$$I + iJ = \int_0^\pi e^x(\cos x + i\sin x)\,\mathrm{d}x = \int_0^\pi e^{(1+i)x}\,\mathrm{d}x = \left[\frac{e^{(1+i)x}}{1+i}\right]_0^\pi = \frac{e^{(1+i)\pi} - 1}{1+i}.$$</div><p>
    Or \(e^{i\pi} = -1\), donc \(e^{(1+i)\pi} = -e^\pi\). Numérateur : \(-e^\pi - 1\). Multiplier numérateur et dénominateur par \(1 - i\) :</p><div class="formula">$$I + iJ = \frac{(-e^\pi - 1)(1 - i)}{2} = \frac{-(e^\pi+1) + i(e^\pi+1)}{2}.$$</div><p><br>
    Identification : \(I = -(e^\pi+1)/2\) et \(J = (e^\pi+1)/2\). ✓</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Étude d'une fonction définie par une intégrale</h3>
  <div class="statement">Soit \(F : x \mapsto \displaystyle\int_0^x \frac{\mathrm{d}t}{1 + t^4}\) sur \(\mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(F\) est bien définie sur \(\mathbb{R}\).</div>
  <div class="q"><strong>Q2.</strong> Étudier la parité de \(F\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(F\) est dérivable et calculer \(F'\). En déduire le sens de variation.</div>
  <div class="q"><strong>Q4.</strong> Montrer que pour tout \(x \geq 0\), \(F(x) \leq x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(t \mapsto 1/(1+t^4)\) est continue sur \(\mathbb{R}\) (car \(1+t^4 > 0\) partout), donc l'intégrale a un sens pour tout \(x\) réel.</p>
    <p><strong>Q2.</strong> Changement de variable \(t = -u\) dans l'intégrale définissant \(F(-x)\) :</p><div class="formula">$$F(-x) = \int_0^{-x} \frac{\mathrm{d}t}{1+t^4} = \int_0^x \frac{-\mathrm{d}u}{1+u^4} = -F(x).$$</div><p> Donc \(F\) est <strong>impaire</strong>.</p>
    <p><strong>Q3.</strong> Par le théorème fondamental, \(F\) est dérivable et \(F'(x) = \frac{1}{1+x^4} > 0\). Donc \(F\) est <strong>strictement croissante</strong> sur \(\mathbb{R}\).</p>
    <p><strong>Q4.</strong> Pour \(t \geq 0\), \(\frac{1}{1+t^4} \leq 1\). Par croissance de l'intégrale (pour \(x \geq 0\)) : \(F(x) = \int_0^x \frac{\mathrm{d}t}{1+t^4} \leq \int_0^x 1\,\mathrm{d}t = x\). ✓</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Fonctions en escalier : calculer une intégrale à partir de la définition</h3>
  <div class="statement">On revient à la construction de l'intégrale (cours §1 et §2) : intégrale d'une fonction en escalier, puis encadrement d'une fonction continue par deux escaliers.</div>
  <div class="q"><strong>Q1.</strong> Soit \(\varphi(t) = \lfloor 2t \rfloor\) (partie entière de \(2t\)) sur \([0, 2]\). Justifier que \(\varphi\) est en escalier, donner une subdivision adaptée et calculer \(\int_{[0,2]}\varphi\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(n \ge 1\), on note \(x_k = \frac kn\). Construire deux fonctions en escalier \(\varphi_n \le \exp \le \psi_n\) sur \([0, 1]\), constantes sur chaque \(]x_k, x_{k+1}[\), et montrer que
  <div class="formula">$$\int\varphi_n = \frac{\mathrm e - 1}{n\left(\mathrm e^{1/n} - 1\right)}, \qquad \int\psi_n = \mathrm e^{1/n}\int\varphi_n .$$</div></div>
  <div class="q"><strong>Q3.</strong> En déduire, sans utiliser de primitive, la valeur de \(\int_0^1 \mathrm e^t\,\mathrm{d}t\). Donner l'encadrement obtenu pour \(n = 10\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sur \([0, \frac12[\), \(0 \le 2t \lt 1\) donc \(\varphi = 0\) ; de même \(\varphi = 1\) sur \([\frac12, 1[\), \(2\) sur \([1, \frac32[\), \(3\) sur \([\frac32, 2[\) et \(\varphi(2) = 4\). La fonction est constante sur les intervalles ouverts de la subdivision \(\left(0, \frac12, 1, \frac32, 2\right)\) : elle est en escalier et cette subdivision est adaptée. La valeur en 2 ne compte pas :</p>
    <div class="formula">$$\int_{[0,2]}\varphi = (0 + 1 + 2 + 3)\times\frac12 = 3 .$$</div>
    <p><strong>Q2.</strong> \(\exp\) est croissante : sur \([x_k, x_{k+1}]\), \(\mathrm e^{k/n} \le \mathrm e^t \le \mathrm e^{(k+1)/n}\). On pose \(\varphi_n = \mathrm e^{k/n}\) et \(\psi_n = \mathrm e^{(k+1)/n}\) sur \(]x_k, x_{k+1}[\), et \(\varphi_n = \psi_n = \exp\) aux points \(x_k\) : \(\varphi_n \le \exp \le \psi_n\). Avec \(q = \mathrm e^{1/n} \neq 1\), la somme géométrique donne</p>
    <div class="formula">$$\int\varphi_n = \frac1n\sum_{k=0}^{n-1} q^k = \frac1n\cdot\frac{q^n - 1}{q - 1} = \frac{\mathrm e - 1}{n\left(\mathrm e^{1/n} - 1\right)},$$</div>
    <p>et \(\int\psi_n = \frac1n\sum_{k=0}^{n-1} q^{k+1} = q\int\varphi_n\).</p>
    <p><strong>Q3.</strong> Par définition de l'intégrale, \(\int\varphi_n \le \int_0^1 \mathrm e^t\,\mathrm{d}t \le \int\psi_n\) pour tout \(n\). Or \(\mathrm e^u - 1 \sim u\) en 0, donc \(n\left(\mathrm e^{1/n} - 1\right) \to 1\) : \(\int\varphi_n \to \mathrm e - 1\), et \(\int\psi_n \to \mathrm e - 1\) puisque \(\mathrm e^{1/n} \to 1\). Par passage à la limite dans l'encadrement, \(\int_0^1 \mathrm e^t\,\mathrm{d}t = \mathrm e - 1\), ce que confirme la primitive. Pour \(n = 10\) : \(1{,}634 \le \int_0^1\mathrm e^t\,\mathrm{d}t \le 1{,}806\) (valeur \(1{,}718\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Propriétés de l'intégrale : positivité et fonction d'intégrale nulle</h3>
  <div class="statement">Trois raisonnements classiques qui n'utilisent que les propriétés du cours (§3), sans calcul de primitive compliqué.</div>
  <div class="q"><strong>Q1.</strong> Soit \(f\) continue sur \([0, 1]\) telle que \(\int_0^1 f(t)\,\mathrm{d}t = \frac12\). Montrer qu'il existe \(c \in [0, 1]\) tel que \(f(c) = c\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les fonctions \(f\) continues sur \([0, 1]\) telles que \(\displaystyle\int_0^1 f(t)^2\,\mathrm{d}t = \int_0^1 f(t)\,\mathrm{d}t - \frac14\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que pour tout \(t \ge 0\), \(1 - t \le \frac{1}{1 + t} \le 1\). En déduire que pour tout \(x \ge 0\), \(x - \frac{x^2}{2} \le \ln(1 + x) \le x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Soit \(g(t) = f(t) - t\), continue sur \([0, 1]\). Par linéarité, \(\int_0^1 g = \frac12 - \frac12 = 0\). Raisonnons par l'absurde : si \(g\) ne s'annulait pas, elle serait de signe constant strict sur \([0, 1]\) (théorème des valeurs intermédiaires), disons \(g \gt 0\). Alors \(g\) serait continue, positive, d'intégrale nulle, donc nulle (cours §3) : contradiction. (Si \(g \lt 0\), on raisonne sur \(-g\).) Donc \(g(c) = 0\) pour un \(c\), soit \(f(c) = c\).</p>
    <p><strong>Q2.</strong> Par linéarité, \(\int_0^1\left(f - \frac12\right)^2 = \int_0^1 f^2 - \int_0^1 f + \frac14\). La condition s'écrit donc \(\int_0^1\left(f(t) - \frac12\right)^2\mathrm{d}t = 0\). La fonction \(\left(f - \frac12\right)^2\) est continue et positive : elle est nulle, d'où \(f = \frac12\). Réciproquement, la fonction constante \(\frac12\) convient (\(\frac14 = \frac12 - \frac14\)). <strong>Une seule solution</strong> : \(f = \frac12\).</p>
    <p><strong>Q3.</strong> Pour \(t \ge 0\), \(\frac{1}{1+t} \le 1\) car \(1 + t \ge 1\), et \(\frac{1}{1+t} - (1 - t) = \frac{1 - (1 - t^2)}{1 + t} = \frac{t^2}{1+t} \ge 0\). Pour \(x \ge 0\), les bornes \(0 \le x\) sont dans l'ordre : par croissance de l'intégrale,</p>
    <div class="formula">$$\int_0^x (1 - t)\,\mathrm{d}t \le \int_0^x\frac{\mathrm{d}t}{1 + t} \le \int_0^x 1\,\mathrm{d}t, \quad\text{soit}\quad x - \frac{x^2}{2} \le \ln(1 + x) \le x .$$</div>
    <p>Contrôle : pour \(x = 0{,}5\), \(0{,}375 \le 0{,}405 \le 0{,}5\). On retrouve l'inégalité \(\ln(1 + x) \le x\) du programme, et l'idée « intégrer une inégalité » sert aussi à l'EXO 11.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Une suite d'intégrales : relation de récurrence et limite</h3>
  <div class="statement">Pour \(n \in \mathbb N\), on pose \(I_n = \displaystyle\int_0^1 (1 - t^2)^n\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(I_0\), \(I_1\), \(I_2\). Montrer que \((I_n)\) est positive et décroissante.</div>
  <div class="q"><strong>Q2.</strong> Par une intégration par parties, montrer que \((2n + 1)\,I_n = 2n\,I_{n-1}\) pour \(n \ge 1\).</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(I_n = \dfrac{4^n\,(n!)^2}{(2n+1)!}\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que \((1 - t^2)^n \le \mathrm e^{-nt^2}\) sur \([0, 1]\). En utilisant le changement de variable \(s = \sqrt n\,t\) et la majoration \(\int_0^x \mathrm e^{-s^2}\,\mathrm{d}s \le 1 + \frac1{\mathrm e}\) (cours §7), montrer que \(I_n \to 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(I_0 = 1\), \(I_1 = \int_0^1 (1 - t^2)\,\mathrm{d}t = \frac23\), \(I_2 = \int_0^1 (1 - 2t^2 + t^4)\,\mathrm{d}t = 1 - \frac23 + \frac15 = \frac{8}{15}\). Sur \([0, 1]\), \(0 \le 1 - t^2 \le 1\), donc \(0 \le (1 - t^2)^{n+1} \le (1 - t^2)^n\) ; par positivité et croissance de l'intégrale, \(0 \le I_{n+1} \le I_n\).</p>
    <p><strong>Q2.</strong> On écrit \(I_n = \int_0^1 1 \times (1 - t^2)^n\,\mathrm{d}t\) et on intègre par parties avec \(u' = 1\), \(u = t\), \(v = (1 - t^2)^n\), \(v' = -2nt(1 - t^2)^{n-1}\). Le crochet \(\big[t(1 - t^2)^n\big]_0^1\) est nul pour \(n \ge 1\), d'où</p>
    <div class="formula">$$I_n = 2n\int_0^1 t^2(1 - t^2)^{n-1}\,\mathrm{d}t = 2n\int_0^1\big(1 - (1 - t^2)\big)(1 - t^2)^{n-1}\,\mathrm{d}t = 2n\,(I_{n-1} - I_n) .$$</div>
    <p>Donc \((2n + 1)I_n = 2nI_{n-1}\). Le passage \(t^2 = 1 - (1 - t^2)\) est l'astuce qui fait réapparaître les intégrales de la suite.</p>
    <p><strong>Q3.</strong> Par récurrence : \(I_0 = 1 = \frac{4^0 (0!)^2}{1!}\). Si la formule vaut au rang \(n - 1\),</p>
    <div class="formula">$$I_n = \frac{2n}{2n + 1}\cdot\frac{4^{n-1}\big((n-1)!\big)^2}{(2n-1)!} = \frac{2n \times 2n}{(2n+1)\,2n}\cdot\frac{4^{n-1}\big((n-1)!\big)^2}{(2n-1)!} = \frac{4^n (n!)^2}{(2n+1)!},$$</div>
    <p>en multipliant numérateur et dénominateur par \(2n\). Contrôle : \(n = 2\) donne \(\frac{16 \times 4}{120} = \frac{8}{15}\).</p>
    <p><strong>Q4.</strong> L'inégalité \(\mathrm e^u \ge 1 + u\) avec \(u = -t^2\) donne \(0 \le 1 - t^2 \le \mathrm e^{-t^2}\) sur \([0, 1]\) ; les deux membres étant positifs, on peut élever à la puissance \(n\) : \((1 - t^2)^n \le \mathrm e^{-nt^2}\). Par croissance, puis avec \(s = \sqrt n\,t\) (\(\mathrm{d}t = \frac{\mathrm{d}s}{\sqrt n}\), bornes \(0\) et \(\sqrt n\)) :</p>
    <div class="formula">$$0 \le I_n \le \int_0^1 \mathrm e^{-nt^2}\,\mathrm{d}t = \frac{1}{\sqrt n}\int_0^{\sqrt n}\mathrm e^{-s^2}\,\mathrm{d}s \le \frac{1 + 1/\mathrm e}{\sqrt n} \xrightarrow[n\to+\infty]{} 0 .$$</div>
    <p>Pour \(n = 10\) : \(I_{10} \approx 0{,}270\), majorant \(0{,}433\). On montre en 2ᵉ année (intégrales de Wallis) que \(I_n \sim \frac{\sqrt\pi}{2\sqrt n}\) (\(0{,}280\) pour \(n = 10\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Rectangles ou trapèzes : approcher \(\int_0^1 \mathrm e^{-t^2}\,\mathrm{d}t\)</h3>
  <div class="statement">On note \(f(t) = \mathrm e^{-t^2}\) et \(K = \int_0^1 f(t)\,\mathrm{d}t\), qu'aucune primitive usuelle ne permet de calculer. On utilise les notations \(R_n\) et \(T_n\) du cours (§6). Valeurs utiles : \(f(\frac14) \approx 0{,}939\,413\), \(f(\frac12) \approx 0{,}778\,801\), \(f(\frac34) \approx 0{,}569\,783\), \(f(1) \approx 0{,}367\,879\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(R_4\) et \(T_4\). Lequel surestime \(K\) à coup sûr ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(f''\) et montrer que \(|f''| \le 2\) sur \([0, 1]\). Majorer \(|K - T_4|\).</div>
  <div class="q"><strong>Q3.</strong> Quelle valeur de \(n\) garantit \(|K - T_n| \le 10^{-4}\) ?</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(|f'| \le \sqrt{2/\mathrm e}\) sur \([0, 1]\). Quelle valeur de \(n\) la majoration des rectangles demande-t-elle pour la même précision ? Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(h = \frac14\) :</p>
    <div class="formula">$$R_4 = \frac14\big(1 + 0{,}939\,413 + 0{,}778\,801 + 0{,}569\,783\big) \approx 0{,}8220$$</div>
    <p>et</p>
    <div class="formula">$$T_4 = \frac14\left(\frac{1 + 0{,}367\,879}{2} + 0{,}939\,413 + 0{,}778\,801 + 0{,}569\,783\right) \approx 0{,}7430 .$$</div>
    <p>\(f\) est décroissante sur \([0, 1]\) : sur chaque morceau, \(f(x_k)\) est le maximum de \(f\), donc \(R_4 \ge K\) (rectangles au-dessus de la courbe).</p>
    <p><strong>Q2.</strong> \(f'(t) = -2t\,\mathrm e^{-t^2}\) et \(f''(t) = (4t^2 - 2)\,\mathrm e^{-t^2}\). On étudie \(g = f''\) : \(g'(t) = t(12 - 8t^2)\,\mathrm e^{-t^2} \ge 0\) sur \([0, 1]\), donc \(g\) croît de \(g(0) = -2\) à \(g(1) = \frac{2}{\mathrm e} \approx 0{,}74\) : \(|f''| \le 2 = M_2\). Alors \(|K - T_4| \le \frac{2 \times 1^3}{12 \times 16} = \frac{1}{96} \approx 0{,}010\). (En fait \(K \approx 0{,}746\,824\) : l'erreur vaut \(3{,}8 \times 10^{-3}\).)</p>
    <p><strong>Q3.</strong> Il suffit que \(\frac{2}{12n^2} \le 10^{-4}\), soit \(n^2 \ge \frac{10^4}{6}\), \(n \ge 40{,}8\) : <strong>\(n = 41\)</strong> convient (erreur réelle \(3{,}6 \times 10^{-5}\)).</p>
    <p><strong>Q4.</strong> \(|f'(t)| = 2t\,\mathrm e^{-t^2}\) a pour dérivée \((2 - 4t^2)\,\mathrm e^{-t^2}\), qui s'annule en \(t = \frac{1}{\sqrt2}\) : le maximum vaut \(\sqrt2\,\mathrm e^{-1/2} = \sqrt{2/\mathrm e} \approx 0{,}858\). La majoration \(\frac{M_1}{2n} \le 10^{-4}\) demande \(n \ge 4\,289\) : environ cent fois plus de calculs de \(f\) que les trapèzes. À précision égale, la méthode des trapèzes est bien plus économique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Taylor-Lagrange et inégalités obtenues en intégrant</h3>
  <div class="statement">On compare deux façons de contrôler l'écart entre une fonction et son polynôme de Taylor : l'inégalité de Taylor-Lagrange (cours §10), et l'intégration successive d'inégalités (cours §3).</div>
  <div class="q"><strong>Q1.</strong> Montrer que pour \(x \in [0 ; 0{,}1]\), \(\left|\mathrm e^x - \left(1 + x + \frac{x^2}{2}\right)\right| \le \frac{\mathrm e^{0{,}1}x^3}{6}\). En déduire une valeur approchée de \(\mathrm e^{0{,}1}\) avec une erreur inférieure à \(2 \times 10^{-4}\).</div>
  <div class="q"><strong>Q2.</strong> En intégrant l'inégalité \(\cos t \le 1\) sur \([0, x]\), puis l'inégalité obtenue, et ainsi de suite, montrer que pour tout \(x \ge 0\) : \(\sin x \le x\), \(1 - \frac{x^2}{2} \le \cos x\), \(x - \frac{x^3}{6} \le \sin x\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que pour tout réel \(\theta\), \(|\mathrm e^{i\theta} - 1| \le |\theta|\), en appliquant l'inégalité de Taylor-Lagrange à l'ordre 0 à une fonction à valeurs complexes. Interpréter géométriquement.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\exp\) est de classe \(\mathcal C^3\) et \(\exp''' = \exp\) est majorée par \(M = \mathrm e^{0{,}1}\) sur \([0, x] \subset [0 ; 0{,}1]\) (croissance). L'inégalité de Taylor-Lagrange en \(a = 0\) à l'ordre 2 donne la majoration demandée. Pour \(x = 0{,}1\) : \(\mathrm e^{0{,}1} \approx 1 + 0{,}1 + 0{,}005 = 1{,}105\), avec une erreur au plus \(\frac{\mathrm e^{0{,}1}\times 10^{-3}}{6} \le \frac{1{,}12 \times 10^{-3}}{6} \approx 1{,}87 \times 10^{-4}\) (on a majoré \(\mathrm e^{0{,}1}\) sans le calculer : \(\mathrm e^{-0{,}1} \ge 1 - 0{,}1\), donc \(\mathrm e^{0{,}1} \le \frac{1}{0{,}9} \lt 1{,}12\)). En effet \(\mathrm e^{0{,}1} \approx 1{,}105\,171\) : l'erreur vaut \(1{,}7 \times 10^{-4}\).</p>
    <p><strong>Q2.</strong> Pour \(x \ge 0\), les bornes \(0 \le x\) sont dans l'ordre, et chaque intégration conserve l'inégalité :</p>
    <ul>
      <li>\(\cos t \le 1\) donne \(\int_0^x \cos t\,\mathrm{d}t \le \int_0^x 1\,\mathrm{d}t\), soit \(\sin x \le x\) ;</li>
      <li>\(\sin t \le t\) (pour \(t \ge 0\)) donne \(\int_0^x\sin t\,\mathrm{d}t \le \frac{x^2}{2}\), soit \(1 - \cos x \le \frac{x^2}{2}\) ;</li>
      <li>\(1 - \frac{t^2}{2} \le \cos t\) donne \(x - \frac{x^3}{6} \le \sin x\).</li>
    </ul>
    <p>Contrôle pour \(x = 1\) : \(0{,}833 \le \sin 1 \approx 0{,}841 \le 1\) et \(0{,}5 \le \cos 1 \approx 0{,}540\). Ces inégalités donnent en plus le <strong>sens</strong> de l'erreur, ce que Taylor-Lagrange ne fournit pas.</p>
    <p><strong>Q3.</strong> Soit \(f(t) = \mathrm e^{it}\), de classe \(\mathcal C^1\) sur \(\mathbb R\), à valeurs complexes, avec \(f'(t) = i\,\mathrm e^{it}\), donc \(|f'| = 1\). L'inégalité de Taylor-Lagrange à l'ordre 0 entre \(0\) et \(\theta\) (valable pour les fonctions complexes, cours §11) donne \(|f(\theta) - f(0)| \le 1 \times |\theta|\), soit \(|\mathrm e^{i\theta} - 1| \le |\theta|\). Géométriquement, \(|\mathrm e^{i\theta} - 1| = 2\left|\sin\frac\theta2\right|\) est la longueur de la <strong>corde</strong> qui joint les points d'angle \(0\) et \(\theta\) du cercle unité, et \(|\theta|\) la longueur de l'<strong>arc</strong> : la corde est plus courte que l'arc. (Pour \(\theta = 2\) : \(1{,}683 \le 2\).)</p>
  </div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Quatre façons d'approcher \(\ln 2\)</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de mathématiques PT (thème : intégration sur un segment, calcul approché). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">On veut calculer \(\ln 2 = \displaystyle\int_1^2\frac{\mathrm{d}t}{t} = \int_0^1\frac{\mathrm{d}x}{1 + x}\) à \(10^{-6}\) près, et comparer le nombre de calculs demandé par quatre méthodes. On rappelle \(\ln 2 \approx 0{,}693\,147\,2\).</div>

  <p class="exo-part">Partie A — Une somme de Riemann</p>
  <div class="q"><strong>A1.</strong> Pour \(n \ge 1\), on pose \(S_n = \displaystyle\sum_{k=1}^{n}\frac{1}{n + k}\). Montrer que \(S_n \to \ln 2\).</div>
  <div class="q"><strong>A2.</strong> En comparant, sur chaque \([\frac kn, \frac{k+1}n]\), la fonction décroissante \(x \mapsto \frac{1}{1+x}\) à ses valeurs aux extrémités, montrer que \(\ln 2 - \frac{1}{2n} \le S_n \le \ln 2\).</div>
  <div class="q"><strong>A3.</strong> Quelle valeur de \(n\) cette majoration impose-t-elle pour une erreur au plus \(10^{-6}\) ?</div>

  <p class="exo-part">Partie B — La méthode des trapèzes</p>
  <div class="q"><strong>B1.</strong> On applique la méthode des trapèzes à \(f(t) = \frac1t\) sur \([1, 2]\). Montrer que \(|\ln 2 - T_n| \le \frac{1}{6n^2}\) et que \(T_n \ge \ln 2\).</div>
  <div class="q"><strong>B2.</strong> Calculer \(T_2\), et déterminer \(n\) pour une erreur au plus \(10^{-6}\).</div>

  <p class="exo-part">Partie C — Une somme géométrique intégrée</p>
  <div class="q"><strong>C1.</strong> Pour \(t \in [0, \frac12]\) et \(n \ge 1\), justifier que \(\dfrac{1}{1 - t} = \displaystyle\sum_{k=0}^{n-1} t^k + \frac{t^n}{1 - t}\).</div>
  <div class="q"><strong>C2.</strong> En intégrant sur \([0, \frac12]\), montrer que
  <div class="formula">$$\ln 2 - \sum_{k=1}^{n}\frac{1}{k\,2^k} = \int_0^{1/2}\frac{t^n}{1 - t}\,\mathrm{d}t, \qquad\text{puis}\qquad 0 \le \ln 2 - \sum_{k=1}^{n}\frac{1}{k\,2^k} \le \frac{1}{(n+1)\,2^n} .$$</div></div>
  <div class="q"><strong>C3.</strong> Combien de termes faut-il pour une erreur au plus \(10^{-6}\) ?</div>

  <p class="exo-part">Partie D — Bilan</p>
  <div class="q"><strong>D1.</strong> L'inégalité de Taylor-Lagrange appliquée à \(\ln(1 + x)\) en \(x = 1\) (cours §10) donne \(\left|\ln 2 - \sum_{k=1}^n\frac{(-1)^{k-1}}{k}\right| \le \frac{1}{n+1}\). Classer les quatre méthodes selon le nombre de termes nécessaires pour \(10^{-6}\), et expliquer d'où vient l'écart entre les parties C et D.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(S_n = \frac1n\sum_{k=1}^n\frac{1}{1 + k/n}\) est une somme de Riemann de \(f(x) = \frac{1}{1+x}\), continue sur \([0, 1]\) : \(S_n \to \int_0^1\frac{\mathrm{d}x}{1+x} = \ln 2\).</p>
    <p><strong>A2.</strong> Sur \([\frac kn, \frac{k+1}n]\), \(f\) décroît, donc \(f\!\left(\frac{k+1}n\right) \le f(x) \le f\!\left(\frac kn\right)\). On intègre (longueur \(\frac1n\)) et on somme pour \(k = 0, \ldots, n-1\) (Chasles) :</p>
    <div class="formula">$$\frac1n\sum_{k=1}^{n} f\!\left(\frac kn\right) \le \ln 2 \le \frac1n\sum_{k=0}^{n-1} f\!\left(\frac kn\right), \quad\text{soit}\quad S_n \le \ln 2 \le S_n + \frac{f(0) - f(1)}{n} = S_n + \frac{1}{2n} .$$</div>
    <p><strong>A3.</strong> La majoration garantit \(10^{-6}\) dès que \(\frac{1}{2n} \le 10^{-6}\) : \(n = 500\,000\) termes. (L'erreur réelle est voisine de \(\frac{1}{4n}\) : pour \(n = 500\), \(S_{500} \approx 0{,}692\,647\), erreur \(5{,}0 \times 10^{-4}\).)</p>
    <p><strong>B1.</strong> \(f''(t) = \frac{2}{t^3}\) est positive et majorée par \(M_2 = 2\) sur \([1, 2]\) (en \(t = 1\)). Le cours donne \(|\ln 2 - T_n| \le \frac{2 \times 1^3}{12n^2} = \frac{1}{6n^2}\). Comme \(f\) est convexe, chaque corde est au-dessus de la courbe : \(T_n \ge \ln 2\).</p>
    <p><strong>B2.</strong> \(T_2 = \frac12\left(\frac{1 + \frac12}{2} + \frac23\right) = \frac{17}{24} \approx 0{,}7083\) (erreur \(0{,}015 \le \frac{1}{24}\)). Pour \(10^{-6}\), \(\frac{1}{6n^2} \le 10^{-6}\) demande \(n \ge 408{,}2\) : \(n = 409\), soit 410 valeurs de \(f\) (erreur réelle \(3{,}7 \times 10^{-7}\)).</p>
    <p><strong>C1.</strong> C'est la somme géométrique : pour \(t \neq 1\), \(\sum_{k=0}^{n-1} t^k = \frac{1 - t^n}{1 - t} = \frac{1}{1-t} - \frac{t^n}{1-t}\).</p>
    <p><strong>C2.</strong> On intègre sur \([0, \frac12]\), où tout est continu : \(\int_0^{1/2}\frac{\mathrm{d}t}{1-t} = \big[-\ln(1 - t)\big]_0^{1/2} = \ln 2\) et \(\int_0^{1/2} t^k\,\mathrm{d}t = \frac{1}{(k+1)2^{k+1}}\). En posant \(j = k + 1\), \(\sum_{k=0}^{n-1}\frac{1}{(k+1)2^{k+1}} = \sum_{j=1}^n\frac{1}{j\,2^j}\), d'où l'égalité. Sur \([0, \frac12]\), \(1 \le \frac{1}{1-t} \le 2\), donc \(0 \le \frac{t^n}{1-t} \le 2t^n\), et par croissance :</p>
    <div class="formula">$$0 \le \int_0^{1/2}\frac{t^n\,\mathrm{d}t}{1 - t} \le 2\int_0^{1/2} t^n\,\mathrm{d}t = \frac{2}{(n+1)2^{n+1}} = \frac{1}{(n+1)\,2^n} .$$</div>
    <p><strong>C3.</strong> \(\frac{1}{16 \times 2^{15}} \approx 1{,}9 \times 10^{-6}\) ne suffit pas, \(\frac{1}{17 \times 2^{16}} \approx 9{,}0 \times 10^{-7}\) convient : <strong>16 termes</strong> (\(\sum_{k=1}^{16}\frac{1}{k\,2^k} \approx 0{,}693\,146\,3\)).</p>
    <p><strong>D1.</strong> Pour \(10^{-6}\) : somme géométrique intégrée, 16 termes ; trapèzes, 410 valeurs ; somme de Riemann, 500 000 termes ; Taylor-Lagrange en \(x = 1\), \(n + 1 \ge 10^6\), soit près d'un million de termes. Les parties C et D développent la même fonction, \(\ln(1 + x)\), en série ; mais en D on l'évalue en \(x = 1\), au bord de la zone où le polynôme de Taylor approche la fonction (majorant \(\frac{x^{n+1}}{n+1}\) qui décroît lentement), alors qu'en C, \(\ln 2 = -\ln\left(1 - \frac12\right)\) est une évaluation en \(\frac12\), où le reste est divisé par 2 à chaque terme : la convergence devient géométrique.</p>
  </div>
