  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la section « Intégration » du programme de PTSI (second semestre). Il reprend aussi les techniques de calcul vues au premier semestre (« Primitives et équations différentielles linéaires » : intégration par parties, changement de variable). L'intégrale y est <strong>construite</strong> à partir des fonctions en escalier, puis reliée aux primitives ; on apprend à la calculer, à l'encadrer et à l'approcher. Ces outils servent ensuite partout : comparaison série-intégrale (chapitre Séries numériques), équations différentielles, physique (travail, valeur moyenne, valeur efficace) et, en 2ᵉ année, intégrales généralisées et à paramètre. Le chapitre « Intégration (approfondissements) » de 2ᵉ année reprend l'essentiel de ce cours.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Fonctions en escalier</strong> : subdivision d'un segment, pas d'une subdivision, fonction en escalier (à valeurs réelles) et son intégrale (§1).</li>
        <li><strong>Intégrale d'une fonction continue sur un segment</strong>, à valeurs réelles : définition, interprétation géométrique, notations \(\int_{[a,b]} f\), \(\int_a^b f\), \(\int_a^b f(t)\,\mathrm{d}t\) ; extension de la notation au cas \(b \le a\) (§2).</li>
        <li><strong>Propriétés</strong> : linéarité, positivité et croissance, inégalité triangulaire, relation de Chasles ; une fonction continue, positive et d'intégrale nulle est nulle (§3).</li>
        <li><strong>Symétries et moyenne</strong> : intégrale d'une fonction paire ou impaire sur un segment centré en 0, d'une fonction périodique sur un intervalle de période ; valeur moyenne d'une fonction continue (§4).</li>
        <li><strong>Sommes de Riemann</strong> : convergence vers l'intégrale, interprétation géométrique, démonstration dans le cas d'une fonction de classe \(\mathcal C^1\) (§5).</li>
        <li><strong>Calcul approché</strong> : méthodes des rectangles et des trapèzes, comparaison de leurs performances (bandeau de la section) (§6).</li>
        <li><strong>Lien entre intégrale et primitive</strong> : dérivation de \(x \mapsto \int_a^x f(t)\,\mathrm{d}t\) pour \(f\) continue ; toute fonction continue sur un intervalle possède des primitives (§7).</li>
        <li><strong>Intégration par parties, changement de variable</strong> (premier semestre ; dans les calculs pratiques, on ne demande pas de rappeler les hypothèses de régularité) (§8, §9).</li>
        <li><strong>Inégalité de Taylor-Lagrange</strong> ; différence de nature entre la formule de Taylor-Young (locale) et l'inégalité de Taylor-Lagrange (globale) (§10).</li>
        <li><strong>Fonctions à valeurs complexes</strong> : intégrale définie par les parties réelle et imaginaire, linéarité, majoration du module de l'intégrale, inégalité de Taylor-Lagrange (§11).</li>
      </ul>
      <p>Non exigible en PTSI : la formule de Taylor avec reste intégral (donnée au §10 ; elle est au programme de PT). Hors programme : l'égalité de Taylor-Lagrange, les fonctions continues par morceaux et la méthode de Simpson (regroupées en fin de chapitre).</p>

<div class="course-section">
  <div class="sec-num">§1 · SUBDIVISIONS ET FONCTIONS EN ESCALIER</div>
  <h2>Les fonctions dont l'aire se calcule sans rien savoir</h2>
  <div class="intro">Pour définir l'aire sous une courbe quelconque, on part des seules fonctions dont l'aire est évidente : celles qui sont constantes par morceaux. Leur « intégrale » est une somme d'aires de rectangles. On approchera ensuite toute fonction continue par de telles fonctions (§2).</div>

  <div class="def-box">
    Soit \([a, b]\) un segment, avec \(a \lt b\). Une <strong>subdivision</strong> de \([a, b]\) est une suite finie \(\sigma = (x_0, x_1, \ldots, x_n)\) telle que
    <div class="formula">$$a = x_0 \lt x_1 \lt \cdots \lt x_{n-1} \lt x_n = b.$$</div>
    Son <strong>pas</strong> est la plus grande des longueurs \(x_{k+1} - x_k\). La subdivision <strong>régulière</strong> en \(n\) morceaux est celle de pas \(h = \dfrac{b-a}{n}\) : \(x_k = a + kh\) pour \(k = 0, \ldots, n\).
  </div>

  <div class="def-box">
    Une fonction \(\varphi : [a, b] \to \mathbb R\) est <strong>en escalier</strong> s'il existe une subdivision \((x_0, \ldots, x_n)\) de \([a, b]\) telle que \(\varphi\) soit constante sur chaque intervalle ouvert \(]x_k, x_{k+1}[\) ; on dit que cette subdivision est <strong>adaptée</strong> à \(\varphi\). Si \(c_k\) est la valeur de \(\varphi\) sur \(]x_k, x_{k+1}[\), l'<strong>intégrale</strong> de \(\varphi\) est
    <div class="formula" data-nom="Intégrale d'une fonction en escalier">$$\int_{[a,b]} \varphi = \sum_{k=0}^{n-1} c_k\,(x_{k+1} - x_k).$$</div>
  </div>
  <p>Chaque terme \(c_k(x_{k+1} - x_k)\) est l'aire d'un rectangle de base \([x_k, x_{k+1}]\) et de hauteur \(c_k\), comptée <strong>négativement</strong> si \(c_k \lt 0\) : c'est une <em>aire algébrique</em>. Les valeurs de \(\varphi\) aux points \(x_k\) eux-mêmes n'interviennent pas, et le résultat ne dépend pas de la subdivision adaptée choisie : ajouter un point coupe un rectangle en deux rectangles de même hauteur, ce qui ne change pas la somme (on l'admet, c'est intuitif).</p>

  <div class="prop-box">
    <strong>Propriétés (admises).</strong> Pour \(\varphi\), \(\psi\) en escalier sur \([a, b]\) et \(\lambda, \mu\) réels : \(\lambda\varphi + \mu\psi\) est en escalier et \(\int (\lambda\varphi + \mu\psi) = \lambda\int\varphi + \mu\int\psi\) (<strong>linéarité</strong>) ; si \(\varphi \ge 0\), alors \(\int\varphi \ge 0\) (<strong>positivité</strong>) ; si \(\varphi \le \psi\), alors \(\int\varphi \le \int\psi\) (<strong>croissance</strong>) ; pour \(c \in \,]a, b[\), \(\int_{[a,b]}\varphi = \int_{[a,c]}\varphi + \int_{[c,b]}\varphi\) (<strong>Chasles</strong>).
  </div>
  <p>Pour la linéarité, on utilise une subdivision adaptée à la fois à \(\varphi\) et à \(\psi\) : la réunion des deux subdivisions convient.</p>

  <div class="method-box">
    <strong>Exemple — deux intégrales de fonctions en escalier</strong>
    <ol>
      <li>Sur \([0, 4]\), \(\varphi\) vaut \(2\) sur \([0, 1[\), \(-1\) sur \([1, 3[\) et \(3\) sur \([3, 4]\). La subdivision \((0, 1, 3, 4)\) est adaptée, et \(\int_{[0,4]}\varphi = 2 \times 1 + (-1) \times 2 + 3 \times 1 = 3\). Le rectangle situé sous l'axe compte pour \(-2\).</li>
      <li>La partie entière \(t \mapsto \lfloor t \rfloor\) est en escalier sur \([0 ; 3{,}5]\), de subdivision adaptée \((0, 1, 2, 3, 3{,}5)\) et de valeurs \(0, 1, 2, 3\) : \(\int_{[0 ; 3{,}5]} \lfloor t \rfloor = 0 + 1 + 2 + 3 \times 0{,}5 = 4{,}5\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : compter les valeurs aux points de la subdivision, ou oublier le signe. Changer la valeur de \(\varphi\) en un nombre fini de points ne change pas son intégrale ; en revanche une valeur négative donne une contribution négative.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · INTÉGRALE D'UNE FONCTION CONTINUE</div>
  <h2>Coincer une fonction continue entre deux escaliers</h2>
  <div class="intro">Une fonction continue sur un segment peut être encadrée d'aussi près qu'on veut par deux fonctions en escalier. Les intégrales de ces escaliers encadrent alors un seul nombre : c'est l'intégrale de la fonction, l'aire algébrique sous sa courbe.</div>

  <div class="prop-box">
    <strong>Théorème d'approximation (admis).</strong> Soit \(f\) continue sur le segment \([a, b]\). Pour tout \(\varepsilon \gt 0\), il existe deux fonctions en escalier \(\varphi\) et \(\psi\) sur \([a, b]\) telles que
    <div class="formula">$$\varphi \le f \le \psi \qquad\text{et}\qquad \psi - \varphi \le \varepsilon .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pourquoi c'est vrai</span>
    <span class="prompt">La preuve dans le cas d'une fonction de classe \(\mathcal C^1\).</span>
    <div class="content"><p>On prend la subdivision régulière de pas \(h\). Sur chaque morceau \([x_k, x_{k+1}]\), la fonction continue \(f\) atteint un minimum \(m_k\) et un maximum \(M_k\) (théorème des bornes atteintes) ; on pose \(\varphi = m_k\) et \(\psi = M_k\) sur \(]x_k, x_{k+1}[\) (et \(\varphi = \psi = f\) aux points \(x_k\)). Alors \(\varphi \le f \le \psi\). Si de plus \(f\) est de classe \(\mathcal C^1\), avec \(|f'| \le M_1\) sur \([a, b]\), l'inégalité des accroissements finis donne \(M_k - m_k \le M_1 h\) : il suffit de choisir \(h \le \varepsilon / M_1\). Pour une fonction seulement continue, l'écart \(M_k - m_k\) devient aussi petit qu'on veut avec le pas, mais la preuve utilise une propriété des fonctions continues sur un segment (la continuité uniforme) qui est hors programme.</p></div>
  </div>

  <div class="def-box">
    Soit \(f\) continue sur \([a, b]\). Il existe un unique réel \(I\) tel que \(\int\varphi \le I \le \int\psi\) pour toutes les fonctions en escalier \(\varphi \le f \le \psi\) : c'est l'<strong>intégrale</strong> de \(f\) sur \([a, b]\), notée
    <div class="formula">$$\int_{[a,b]} f \;=\; \int_a^b f \;=\; \int_a^b f(t)\,\mathrm{d}t .$$</div>
    La variable \(t\) est <strong>muette</strong> : \(\int_a^b f(t)\,\mathrm{d}t = \int_a^b f(x)\,\mathrm{d}x\). Si \(f\) est elle-même en escalier, on retrouve l'intégrale du §1.
  </div>
  <p>L'unicité vient du théorème : si deux réels \(I \le I'\) convenaient, on aurait \(I' - I \le \int\psi - \int\varphi \le \varepsilon(b - a)\) pour tout \(\varepsilon \gt 0\), donc \(I = I'\).</p>

  <h3>Interprétation géométrique et conventions</h3>
  <p>Pour \(f \ge 0\), \(\int_a^b f\) est l'<strong>aire</strong> du domaine compris entre la courbe, l'axe des abscisses et les droites \(t = a\), \(t = b\). En général, c'est une <strong>aire algébrique</strong> : les parties sous l'axe comptent négativement.</p>

<figcaption>Subdivision régulière de [0, 1] en n = 5 morceaux (pas 1/5). La fonction en escalier φ (à gauche) prend sur chaque morceau la plus petite valeur de f(t) = t², la fonction ψ (à droite) la plus grande : φ ≤ f ≤ ψ. Leurs intégrales, sommes d'aires de rectangles, encadrent l'aire sous la courbe : 0,24 ≤ ∫₀¹ t² dt ≤ 0,44. L'écart vaut 1/n : il tend vers 0 quand on raffine la subdivision, et les deux suites tendent vers 1/3.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — calculer \(\int_0^1 t^2\,\mathrm{d}t\) avec des escaliers</strong>
    <ol>
      <li><strong>Encadrement.</strong> Subdivision régulière de pas \(\frac1n\). La fonction carré croît sur \([0, 1]\) : sur \(]\frac kn, \frac{k+1}n[\), \(\left(\frac kn\right)^2 \le t^2 \le \left(\frac{k+1}n\right)^2\). On note \(\varphi_n\) et \(\psi_n\) les fonctions en escalier correspondantes (figure).</li>
      <li><strong>Intégrales des escaliers</strong>, avec \(\sum_{k=0}^{n-1} k^2 = \frac{(n-1)n(2n-1)}{6}\) :
        <div class="formula">$$\int\varphi_n = \frac1n\sum_{k=0}^{n-1}\frac{k^2}{n^2} = \frac{(n-1)(2n-1)}{6n^2}, \qquad \int\psi_n = \frac{(n+1)(2n+1)}{6n^2}.$$</div></li>
      <li><strong>Conclusion.</strong> L'intégrale \(I\) vérifie \(\int\varphi_n \le I \le \int\psi_n\) pour tout \(n\). Les deux bornes tendent vers \(\frac13\) (leur écart vaut exactement \(\frac1n\)) : \(I = \frac13\). Pour \(n = 10\), l'encadrement est \(0{,}285 \le I \le 0{,}385\).</li>
    </ol>
    <p>On retrouve \(\left[\frac{t^3}{3}\right]_0^1 = \frac13\) : le calcul par une primitive, justifié au §7, est bien plus rapide. La définition sert à <em>démontrer</em> les propriétés, pas à calculer.</p>
  </div>

  <h3>Aire entre deux courbes</h3>
  <p>Si \(f \ge g\) sur \([a, b]\), l'aire du domaine compris entre les deux courbes est \(\int_a^b (f - g)\). Sans hypothèse de signe, l'aire géométrique est \(\int_a^b |f - g|\), qu'on calcule en découpant \([a, b]\) aux points où les courbes se croisent.</p>
  <div class="method-box">
    <strong>Exemple — l'aire entre la droite et la parabole</strong>
    <p>Sur \([0, 1]\), \(t \ge t^2\) ; les courbes se coupent en \(0\) et \(1\). L'aire comprise entre elles vaut \(\displaystyle\int_0^1 (t - t^2)\,\mathrm{d}t = \frac12 - \frac13 = \frac16\). Pour \(\sin\) sur \([0, \frac{3\pi}{2}]\) (figure plus haut), l'intégrale vaut \(1\) mais l'aire géométrique vaut \(\int_0^{\pi}\sin - \int_\pi^{3\pi/2}\sin = 2 + 1 = 3\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre l'intégrale (un <strong>nombre</strong>, qui peut être négatif) et une primitive (une <strong>fonction</strong>, définie à une constante près), ou utiliser la même lettre pour la variable d'intégration et pour une borne : écrire \(\int_0^x f(t)\,\mathrm{d}t\), jamais \(\int_0^x f(x)\,\mathrm{d}x\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PROPRIÉTÉS DE L'INTÉGRALE</div>
  <h2>Calculer avec des intégrales et les encadrer</h2>
  <div class="intro">Les propriétés des fonctions en escalier passent aux fonctions continues par l'encadrement du §2. Ce sont les outils de tous les raisonnements : découper une intégrale, la comparer à une autre, la majorer sans la calculer.</div>

  <div class="prop-box">
    <strong>Propriétés de l'intégrale.</strong> Soit \(f\), \(g\) continues sur un intervalle \(I\), \(a, b, c \in I\) et \(\lambda, \mu\) réels.
    <ul>
      <li><strong>Linéarité</strong> : \(\int_a^b (\lambda f + \mu g) = \lambda\int_a^b f + \mu\int_a^b g\).</li>
      <li><strong>Relation de Chasles</strong> : \(\int_a^c f = \int_a^b f + \int_b^c f\), quel que soit l'ordre de \(a\), \(b\), \(c\).</li>
      <li><strong>Positivité</strong> : si \(a \le b\) et \(f \ge 0\) sur \([a, b]\), alors \(\int_a^b f \ge 0\).</li>
      <li><strong>Croissance</strong> : si \(a \le b\) et \(f \le g\) sur \([a, b]\), alors \(\int_a^b f \le \int_a^b g\).</li>
      <li><strong>Inégalité triangulaire</strong> : si \(a \le b\),
        <div class="formula" data-nom="Inégalité triangulaire intégrale">$$\left|\int_a^b f(t)\,\mathrm{d}t\right| \le \int_a^b |f(t)|\,\mathrm{d}t \le (b - a)\max_{[a,b]}|f| .$$</div></li>
    </ul>
    En particulier, si \(m \le f \le M\) sur \([a, b]\) avec \(a \le b\), alors \(m(b - a) \le \int_a^b f \le M(b - a)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Positivité, croissance et inégalité triangulaire.</span>
    <div class="content"><p><strong>Positivité.</strong> Si \(f \ge 0\), la fonction nulle est une fonction en escalier inférieure à \(f\) ; par définition de l'intégrale, \(0 = \int 0 \le \int_a^b f\).</p>
    <p><strong>Croissance.</strong> Si \(f \le g\), \(g - f \ge 0\), donc \(\int_a^b g - \int_a^b f = \int_a^b (g - f) \ge 0\) par linéarité et positivité.</p>
    <p><strong>Inégalité triangulaire.</strong> \(-|f| \le f \le |f|\) donne, par croissance, \(-\int_a^b |f| \le \int_a^b f \le \int_a^b |f|\). La seconde inégalité vient de \(|f| \le \max|f|\) (le maximum existe : bornes atteintes). La linéarité et Chasles s'obtiennent en passant à la limite dans les propriétés des fonctions en escalier ; on les admet.</p></div>
  </div>

  <div class="prop-box">
    <strong>Fonction continue positive d'intégrale nulle.</strong> Si \(f\) est <strong>continue</strong> et <strong>positive</strong> sur \([a, b]\), avec \(a \lt b\), et si \(\int_a^b f = 0\), alors \(f = 0\) sur \([a, b]\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un point où \(f\) est strictement positive rend l'intégrale strictement positive.</span>
    <div class="content"><p>Supposons \(f(c) \gt 0\) pour un \(c \in [a, b]\). Par continuité, \(f \ge \frac{f(c)}2\) sur un segment \([\alpha, \beta] \subset [a, b]\) contenant \(c\), de longueur \(\beta - \alpha \gt 0\). Par Chasles et positivité de \(f\) sur \([a, \alpha]\) et \([\beta, b]\), \(\int_a^b f \ge \int_\alpha^\beta f \ge (\beta - \alpha)\frac{f(c)}2 \gt 0\), ce qui contredit \(\int_a^b f = 0\).</p></div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier une hypothèse. Sans positivité : \(\int_0^{2\pi}\sin t\,\mathrm{d}t = 0\) et pourtant \(\sin \neq 0\). Sans continuité : une fonction nulle sauf en un point a une intégrale nulle. Et toutes les inégalités supposent les <strong>bornes dans l'ordre croissant</strong> : pour \(x \lt 0\), \(\int_0^x t^2\,\mathrm{d}t = \frac{x^3}3 \lt 0\) bien que \(t^2 \ge 0\).</div>

  <div class="method-box">
    <strong>Exemple — encadrer une intégrale qu'on ne sait pas calculer</strong>
    <p>On cherche \(K = \int_0^1 \mathrm{e}^{-t^2}\,\mathrm{d}t\) ; aucune primitive de \(t \mapsto \mathrm{e}^{-t^2}\) ne s'écrit avec les fonctions usuelles.</p>
    <ol>
      <li>L'inégalité \(\mathrm{e}^u \ge 1 + u\) (valable pour tout réel \(u\)), appliquée à \(u = -t^2\), donne \(\mathrm{e}^{-t^2} \ge 1 - t^2\) ; appliquée à \(u = t^2\), elle donne \(\mathrm{e}^{t^2} \ge 1 + t^2\), soit \(\mathrm{e}^{-t^2} \le \dfrac{1}{1 + t^2}\).</li>
      <li>Par croissance de l'intégrale (bornes \(0 \le 1\)) :
        <div class="formula">$$\frac23 = \int_0^1 (1 - t^2)\,\mathrm{d}t \;\le\; K \;\le\; \int_0^1 \frac{\mathrm{d}t}{1 + t^2} = \frac\pi4 .$$</div></li>
      <li>Soit \(0{,}667 \le K \le 0{,}786\) ; la valeur numérique est \(K \approx 0{,}7468\) (on l'approchera au §6).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une suite d'intégrales qui tend vers 0</strong>
    <p>Soit \(J_n = \displaystyle\int_0^1 \frac{t^n}{1 + t}\,\mathrm{d}t\). Sur \([0, 1]\), \(\frac12 \le \frac{1}{1+t} \le 1\), donc \(\frac{t^n}{2} \le \frac{t^n}{1+t} \le t^n\), et par croissance :</p>
    <div class="formula">$$\frac{1}{2(n+1)} \le J_n \le \frac{1}{n+1}, \qquad\text{donc } J_n \xrightarrow[n\to+\infty]{} 0 .$$</div>
    <p>Pour \(n = 10\) : \(0{,}045 \le J_{10} \le 0{,}091\) (valeur : \(J_{10} \approx 0{,}0475\)). Par linéarité, \(J_n + J_{n+1} = \int_0^1 t^n\,\mathrm{d}t = \frac{1}{n+1}\) : avec \(J_0 = \ln 2\), on en tirera \(\ln 2 = 1 - \frac12 + \frac13 - \cdots\) (§10 et chapitre Séries numériques).</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SYMÉTRIES ET VALEUR MOYENNE</div>
  <h2>Gagner du temps, et résumer une fonction par un nombre</h2>
  <div class="intro">Parité et périodicité simplifient beaucoup de calculs, parfois jusqu'à les rendre inutiles. La valeur moyenne résume une fonction sur un intervalle par une seule hauteur : c'est la notion qu'utilisent la physique et les sciences de l'ingénieur (tension moyenne, puissance moyenne, valeur efficace).</div>

  <div class="prop-box">
    <strong>Symétries.</strong> Soit \(f\) continue sur \([-a, a]\). Si \(f\) est <strong>paire</strong>, \(\int_{-a}^a f = 2\int_0^a f\) ; si \(f\) est <strong>impaire</strong>, \(\int_{-a}^a f = 0\).<br>
    <strong>Périodicité.</strong> Si \(f\) est continue sur \(\mathbb R\) et \(T\)-périodique, \(\int_\alpha^{\alpha + T} f\) ne dépend pas de \(\alpha\) : l'intégrale sur une période se calcule sur la période la plus commode.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux changements de variable (§9) et la relation de Chasles.</span>
    <div class="content"><p><strong>Parité.</strong> Avec \(t = -s\) : \(\int_{-a}^0 f(t)\,\mathrm{d}t = \int_a^0 f(-s)(-\mathrm{d}s) = \int_0^a f(-s)\,\mathrm{d}s\), qui vaut \(\int_0^a f\) si \(f\) est paire et \(-\int_0^a f\) si elle est impaire. On ajoute \(\int_0^a f\) (Chasles).</p>
    <p><strong>Périodicité.</strong> \(\int_\alpha^{\alpha+T} f = \int_\alpha^0 f + \int_0^T f + \int_T^{\alpha + T} f\), et avec \(t = s + T\), \(\int_T^{\alpha+T} f(t)\,\mathrm{d}t = \int_0^\alpha f(s + T)\,\mathrm{d}s = \int_0^\alpha f\) : le premier et le dernier terme s'annulent.</p></div>
  </div>

  <div class="def-box">
    La <strong>valeur moyenne</strong> d'une fonction continue \(f\) sur \([a, b]\) (\(a \lt b\)) est
    <div class="formula" data-nom="Valeur moyenne">$$\overline{f} = \frac{1}{b - a}\int_a^b f(t)\,\mathrm{d}t .$$</div>
    C'est la hauteur du rectangle de base \([a, b]\) qui a la même aire algébrique que le domaine sous la courbe. Comme \(\min f \le \overline f \le \max f\), le théorème des valeurs intermédiaires fournit un \(c \in [a, b]\) tel que \(f(c) = \overline f\).
  </div>

  <div class="method-box">
    <strong>Exemple — symétries et moyennes en une ligne chacune</strong>
    <ol>
      <li>\(t \mapsto t^2\sin(3t)\) est impaire : \(\int_{-\pi}^{\pi} t^2\sin(3t)\,\mathrm{d}t = 0\), sans aucune intégration par parties.</li>
      <li>\(|\sin|\) est \(\pi\)-périodique et \([0, 10\pi]\) contient exactement dix périodes : \(\int_0^{10\pi}|\sin t|\,\mathrm{d}t = 10\int_0^\pi \sin t\,\mathrm{d}t = 20\).</li>
      <li>Moyenne de \(\sin\) sur une arche : \(\frac1\pi\int_0^\pi\sin t\,\mathrm{d}t = \frac2\pi \approx 0{,}637\) (figure).</li>
      <li><strong>Valeur efficace</strong> d'une tension \(u(t) = U_m\cos(\omega t)\) : la moyenne de \(\cos^2 = \frac{1 + \cos(2\,\cdot)}{2}\) sur une période vaut \(\frac12\), donc \(\overline{u^2} = \frac{U_m^2}{2}\) et \(U_{\text{eff}} = \sqrt{\overline{u^2}} = \frac{U_m}{\sqrt2}\). Le secteur à \(230\ \text{V}\) efficaces a une amplitude \(U_m = 230\sqrt2 \approx 325\ \text{V}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la règle des fonctions impaires sur un intervalle non centré (\(\int_0^\pi \sin \neq 0\)), ou la périodicité sur un intervalle qui n'est pas une réunion de périodes entières. Et une moyenne nulle ne veut pas dire une fonction nulle : la moyenne de \(\sin\) sur \([0, 2\pi]\) est nulle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · SOMMES DE RIEMANN</div>
  <h2>Une intégrale est une limite de sommes</h2>
  <div class="intro">Découper \([a, b]\) en \(n\) morceaux égaux et remplacer \(f\) sur chacun par sa valeur en un point, c'est intégrer une fonction en escalier : la somme obtenue tend vers l'intégrale. Le résultat se lit dans les deux sens : approcher une intégrale (§6), ou calculer la limite d'une somme en y reconnaissant une intégrale.</div>

  <div class="prop-box">
    <strong>Théorème (sommes de Riemann).</strong> Soit \(f\) continue sur \([a, b]\), \(h = \dfrac{b - a}{n}\) et \(x_k = a + kh\). Alors
    <div class="formula" data-nom="Sommes de Riemann">$$\frac{b-a}{n}\sum_{k=0}^{n-1} f\!\left(a + k\,\frac{b-a}{n}\right) \xrightarrow[n\to+\infty]{} \int_a^b f(t)\,\mathrm{d}t ,$$</div>
    et de même pour la somme de \(k = 1\) à \(n\). Sur \([0, 1]\) :
    <div class="formula" data-nom="Sommes de Riemann sur [0, 1]">$$\frac1n\sum_{k=1}^{n} f\!\left(\frac kn\right) \xrightarrow[n\to+\infty]{} \int_0^1 f(t)\,\mathrm{d}t .$$</div>
  </div>
  <p><strong>Interprétation géométrique.</strong> \(h\,f(x_k)\) est l'aire du rectangle de base \([x_k, x_{k+1}]\) et de hauteur \(f(x_k)\) : la somme de Riemann est l'intégrale de la fonction en escalier qui vaut \(f(x_k)\) sur \([x_k, x_{k+1}[\) (figure du §6, à gauche).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Cas d'une fonction de classe \(\mathcal C^1\), avec une majoration de l'erreur.</span>
    <div class="content"><p>Soit \(M_1 = \max_{[a,b]}|f'|\) (\(f'\) est continue sur un segment). Pour \(t \in [x_k, x_{k+1}]\), l'inégalité des accroissements finis donne \(|f(t) - f(x_k)| \le M_1(t - x_k)\). On intègre sur \([x_k, x_{k+1}]\), en écrivant \(h f(x_k) = \int_{x_k}^{x_{k+1}} f(x_k)\,\mathrm{d}t\) :</p>
    <div class="formula">$$\left|\int_{x_k}^{x_{k+1}} f(t)\,\mathrm{d}t - h f(x_k)\right| \le \int_{x_k}^{x_{k+1}} M_1(t - x_k)\,\mathrm{d}t = \frac{M_1 h^2}{2} .$$</div>
    <p>On ajoute ces \(n\) inégalités (Chasles, inégalité triangulaire sur une somme) :</p>
    <div class="formula">$$\left|\int_a^b f - h\sum_{k=0}^{n-1} f(x_k)\right| \le n\,\frac{M_1 h^2}{2} = \frac{M_1(b-a)^2}{2n} \xrightarrow[n\to+\infty]{} 0 .$$</div>
    <p>La somme de \(k = 1\) à \(n\) diffère de la précédente de \(h\big(f(b) - f(a)\big)\), qui tend vers 0.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — la limite d'une somme</strong>
    <p>On cherche la limite de \(S_n = \displaystyle\sum_{k=1}^{n}\frac{1}{\sqrt{n^2 + kn}}\).</p>
    <ol>
      <li><strong>Faire apparaître \(\frac1n\) et \(\frac kn\)</strong> : \(\sqrt{n^2 + kn} = n\sqrt{1 + \frac kn}\), donc \(S_n = \dfrac1n\displaystyle\sum_{k=1}^{n} f\!\left(\frac kn\right)\) avec \(f(x) = \dfrac{1}{\sqrt{1 + x}}\), continue sur \([0, 1]\).</li>
      <li><strong>Conclure</strong> par le théorème :
        <div class="formula">$$S_n \xrightarrow[n\to+\infty]{} \int_0^1\frac{\mathrm{d}x}{\sqrt{1+x}} = \Big[2\sqrt{1+x}\Big]_0^1 = 2\sqrt2 - 2 \approx 0{,}8284 .$$</div></li>
      <li><strong>Contrôle</strong> : \(S_{10} \approx 0{,}8141\), \(S_{100} \approx 0{,}8270\), \(S_{1000} \approx 0{,}8283\). L'écart diminue comme \(\frac1n\), conformément à la démonstration.</li>
    </ol>
    <p>De même, \(\displaystyle\sum_{k=1}^n \frac{k}{n^2}\,\mathrm{e}^{k/n} = \frac1n\sum_{k=1}^n \frac kn\,\mathrm{e}^{k/n} \to \int_0^1 x\,\mathrm{e}^x\,\mathrm{d}x = 1\) (intégration par parties, §8).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : laisser \(n\) ailleurs que dans le facteur \(\frac1n\) et dans \(\frac kn\). \(\sum_{k=1}^n \frac{1}{n + k}\) devient une somme de Riemann après factorisation (\(\frac1n\sum \frac{1}{1 + k/n} \to \ln 2\)), mais \(\sum_{k=1}^n \frac{1}{n^2 + k}\) n'en est pas une : elle est comprise entre \(\frac{n}{n^2 + n}\) et \(\frac{n}{n^2 + 1}\), donc tend vers 0.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MÉTHODES DES RECTANGLES ET DES TRAPÈZES</div>
  <h2>Approcher une intégrale, et savoir de combien on se trompe</h2>
  <div class="intro">La plupart des intégrales ne se calculent pas exactement (\(\int_0^1 \mathrm{e}^{-t^2}\,\mathrm{d}t\), une intégrale de mesures en physique…). On les approche par des sommes finies. Deux méthodes classiques, qu'on compare sur leur précision : à nombre de calculs égal, les trapèzes sont bien meilleurs. Les programmes Python correspondants sont dans le chapitre d'informatique <a href="#pynum/cours">« Méthodes numériques »</a>, §4 ; l'onglet Simulateur de ce chapitre les compare sur plusieurs fonctions.</div>

  <div class="def-box">
    Soit \(f\) continue sur \([a, b]\), \(n \ge 1\), le pas \(h = \dfrac{b-a}{n}\) et les points \(x_k = a + kh\) (\(x_0 = a\), \(x_n = b\)).
    <ul>
      <li><strong>Méthode des rectangles</strong> (à gauche) : sur \([x_k, x_{k+1}]\), on remplace \(f\) par la constante \(f(x_k)\) :
        <div class="formula" data-nom="Méthode des rectangles">$$R_n = h\sum_{k=0}^{n-1} f(x_k) .$$</div></li>
      <li><strong>Méthode des trapèzes</strong> : sur \([x_k, x_{k+1}]\), on remplace \(f\) par la corde qui joint \(\big(x_k, f(x_k)\big)\) à \(\big(x_{k+1}, f(x_{k+1})\big)\), d'aire \(h\,\frac{f(x_k) + f(x_{k+1})}{2}\) :
        <div class="formula" data-nom="Méthode des trapèzes">$$T_n = h\left(\frac{f(a) + f(b)}{2} + \sum_{k=1}^{n-1} f(x_k)\right) .$$</div></li>
    </ul>
    \(T_n\) est la moyenne de \(R_n\) et de la somme « à droite » \(h\sum_{k=1}^{n} f(x_k)\) : les points intérieurs comptent une fois, les extrémités une demi-fois.
  </div>

  <div class="prop-box">
    <strong>Majorations de l'erreur.</strong> Si \(f\) est de classe \(\mathcal C^1\) et \(|f'| \le M_1\) sur \([a, b]\), et (pour les trapèzes) de classe \(\mathcal C^2\) avec \(|f''| \le M_2\) :
    <div class="formula" data-nom="Erreur des rectangles et des trapèzes">$$\left|\int_a^b f - R_n\right| \le \frac{M_1(b-a)^2}{2n}, \qquad \left|\int_a^b f - T_n\right| \le \frac{M_2(b-a)^3}{12\,n^2} .$$</div>
    L'erreur des rectangles décroît comme \(\frac1n\) (méthode d'ordre 1), celle des trapèzes comme \(\frac{1}{n^2}\) (ordre 2) : doubler \(n\) divise la première par 2 et la seconde par 4.
  </div>
  <p>La majoration des rectangles est celle de la démonstration du §5. Celle des trapèzes se démontre par deux intégrations par parties ; le programme ne l'exige pas, mais elle explique la supériorité des trapèzes.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration (non exigible)</span>
    <span class="prompt">L'erreur des trapèzes sur un morceau, par deux intégrations par parties.</span>
    <div class="content"><p>Sur un morceau \([\alpha, \beta]\) de longueur \(h\), on pose \(\theta(t) = \frac{(t - \alpha)(t - \beta)}{2}\), qui s'annule en \(\alpha\) et \(\beta\), avec \(\theta'(t) = t - \frac{\alpha + \beta}{2}\) et \(\theta'' = 1\). Deux intégrations par parties (§8) donnent :</p>
    <div class="formula">$$\begin{aligned} \int_\alpha^\beta \theta f'' &= \Big[\theta f'\Big]_\alpha^\beta - \int_\alpha^\beta \theta' f' = -\Big[\theta' f\Big]_\alpha^\beta + \int_\alpha^\beta f \\ &= \int_\alpha^\beta f - h\,\frac{f(\alpha) + f(\beta)}{2} . \end{aligned}$$</div>
    <p>Comme \(\theta \le 0\) sur \([\alpha, \beta]\), l'erreur sur le morceau est majorée par</p>
    <div class="formula">$$M_2\int_\alpha^\beta |\theta(t)|\,\mathrm{d}t = M_2 \int_\alpha^\beta \frac{(t-\alpha)(\beta - t)}{2}\,\mathrm{d}t = \frac{M_2 h^3}{12} .$$</div>
    <p> On ajoute les \(n\) morceaux : \(n\,\frac{M_2 h^3}{12} = \frac{M_2 (b - a)^3}{12 n^2}\). La formule montre aussi que, si \(f'' \ge 0\) (fonction convexe), \(T_n\) majore l'intégrale : la corde est au-dessus de la courbe.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — approcher \(\pi = \int_0^1 \frac{4}{1 + t^2}\,\mathrm{d}t\)</strong>
    <p>Pour \(f(t) = \frac{4}{1+t^2}\) sur \([0, 1]\) : \(M_1 = \max|f'| = \frac{3\sqrt3}{2} \approx 2{,}60\) (atteint en \(\frac{1}{\sqrt3}\)) et \(M_2 = \max|f''| = 8\) (atteint en 0).</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin:.6rem 0">
      <tr><th style="text-align:left">\(n\)</th><th style="text-align:left">\(R_n\)</th><th style="text-align:left">erreur</th><th style="text-align:left">majorant</th><th style="text-align:left">\(T_n\)</th><th style="text-align:left">erreur</th><th style="text-align:left">majorant</th></tr>
      <tr><td>4</td><td>3,381</td><td>\(0{,}24\)</td><td>\(0{,}32\)</td><td>3,1312</td><td>\(1{,}0 \times 10^{-2}\)</td><td>\(4{,}2 \times 10^{-2}\)</td></tr>
      <tr><td>10</td><td>3,240</td><td>\(9{,}8 \times 10^{-2}\)</td><td>\(0{,}13\)</td><td>3,13993</td><td>\(1{,}7 \times 10^{-3}\)</td><td>\(6{,}7 \times 10^{-3}\)</td></tr>
      <tr><td>100</td><td>3,1516</td><td>\(1{,}0 \times 10^{-2}\)</td><td>\(1{,}3 \times 10^{-2}\)</td><td>3,141576</td><td>\(1{,}7 \times 10^{-5}\)</td><td>\(6{,}7 \times 10^{-5}\)</td></tr>
    </table></div>
    <p><strong>Choisir \(n\) pour une précision donnée.</strong> Pour une erreur au plus \(10^{-6}\) par les trapèzes, il suffit que \(\frac{8}{12n^2} \le 10^{-6}\), soit \(n \ge 816{,}5\) : \(n = 817\) (erreur réelle \(2{,}5 \times 10^{-7}\)). Par les rectangles, la majoration demande \(n \ge 1{,}3 \times 10^6\) : environ 1 600 fois plus de calculs de \(f\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre le nombre \(n\) de sous-intervalles et le nombre \(n + 1\) de points ; compter les extrémités en entier dans \(T_n\) ; ou prendre \(M_1\) (ou \(M_2\)) sur un autre intervalle que \([a, b]\). Le sens de l'erreur se prévoit souvent : les rectangles à gauche surestiment l'intégrale d'une fonction décroissante, les trapèzes celle d'une fonction convexe.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · INTÉGRALE ET PRIMITIVES</div>
  <h2>Le théorème fondamental de l'analyse</h2>
  <div class="intro">Une intégrale dont la borne supérieure varie est une fonction de cette borne, et sa dérivée est l'intégrande. C'est ce qui justifie le calcul des intégrales par les primitives, utilisé depuis le premier semestre, et qui garantit que toute fonction continue a des primitives.</div>

  <div class="prop-box">
    <strong>Théorème fondamental.</strong> Soit \(f\) continue sur un intervalle \(I\) et \(a \in I\). La fonction
    <div class="formula" data-nom="Théorème fondamental">$$F : x \longmapsto \int_a^x f(t)\,\mathrm{d}t$$</div>
    est de classe \(\mathcal C^1\) sur \(I\), avec \(F' = f\) et \(F(a) = 0\) : c'est l'unique primitive de \(f\) qui s'annule en \(a\). En conséquence :
    <ul>
      <li>toute fonction continue sur un intervalle possède des primitives ;</li>
      <li>pour toute primitive \(G\) de \(f\) sur \(I\), \(\displaystyle\int_a^b f(t)\,\mathrm{d}t = G(b) - G(a) = \Big[G(t)\Big]_a^b\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le taux d'accroissement de \(F\) est une valeur moyenne de \(f\).</span>
    <div class="content"><p>Soit \(x \in I\) et \(h \neq 0\) avec \(x + h \in I\). Par Chasles, \(F(x + h) - F(x) = \int_x^{x+h} f(t)\,\mathrm{d}t\), et \(h f(x) = \int_x^{x+h} f(x)\,\mathrm{d}t\). Donc</p>
    <div class="formula">$$\left|\frac{F(x+h) - F(x)}{h} - f(x)\right| = \frac{1}{|h|}\left|\int_x^{x+h}\big(f(t) - f(x)\big)\,\mathrm{d}t\right| \le \max_{|t - x| \le |h|}|f(t) - f(x)| .$$</div>
    <p>Ce majorant tend vers 0 quand \(h \to 0\), par continuité de \(f\) en \(x\) : \(F\) est dérivable en \(x\) et \(F'(x) = f(x)\). Si \(G\) est une autre primitive, \(G - F\) a une dérivée nulle sur l'intervalle \(I\), donc est constante : \(G(b) - G(a) = F(b) - F(a) = \int_a^b f\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Bornes variables.</strong> Si \(f\) est continue sur \(I\) et \(u\), \(v\) dérivables sur un intervalle \(J\), à valeurs dans \(I\), la fonction \(G(x) = \int_{u(x)}^{v(x)} f(t)\,\mathrm{d}t\) est dérivable sur \(J\) et
    <div class="formula" data-nom="Dérivée d'une intégrale à bornes variables">$$G'(x) = f\big(v(x)\big)\,v'(x) - f\big(u(x)\big)\,u'(x) .$$</div>
    En effet, \(G = F\circ v - F\circ u\) pour une primitive \(F\) de \(f\) ; on dérive les composées.
  </div>

  <div class="method-box">
    <strong>Exemple — le logarithme est une intégrale</strong>
    <p>\(\ln\) est la primitive de \(t \mapsto \frac1t\) sur \(]0, +\infty[\) qui s'annule en 1 : \(\ln x = \int_1^x \frac{\mathrm{d}t}{t}\). Pour \(x \gt 0\), \(G(x) = \int_x^{2x}\frac{\mathrm{d}t}{t}\) a pour dérivée \(\frac{1}{2x}\times 2 - \frac1x \times 1 = 0\) : \(G\) est constante sur l'intervalle \(]0, +\infty[\), égale à \(G(1) = \ln 2\). L'aire sous l'hyperbole entre \(x\) et \(2x\) ne dépend pas de \(x\) : c'est la propriété \(\ln(2x) - \ln x = \ln 2\).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — étudier une fonction sans primitive explicite</strong>
    <p>Soit \(\Phi(x) = \int_0^x \mathrm{e}^{-t^2}\,\mathrm{d}t\) pour \(x \in \mathbb R\).</p>
    <ol>
      <li><strong>Dérivée</strong> : \(t \mapsto \mathrm{e}^{-t^2}\) est continue sur \(\mathbb R\), donc \(\Phi\) est de classe \(\mathcal C^1\) et \(\Phi'(x) = \mathrm{e}^{-x^2} \gt 0\) : \(\Phi\) est strictement croissante, avec \(\Phi(0) = 0\).</li>
      <li><strong>Parité</strong> : l'intégrande est paire, et le changement de variable \(t = -s\) donne \(\Phi(-x) = -\Phi(x)\) : \(\Phi\) est impaire.</li>
      <li><strong>Majoration</strong> : pour \(x \ge 1\), par Chasles et parce que \(t^2 \ge t\) sur \([1, x]\),
        <div class="formula">$$\Phi(x) \le \int_0^1 1\,\mathrm{d}t + \int_1^x \mathrm{e}^{-t}\,\mathrm{d}t = 1 + \mathrm{e}^{-1} - \mathrm{e}^{-x} \le 1 + \frac1{\mathrm{e}} .$$</div></li>
      <li><strong>Limite</strong> : croissante et majorée, \(\Phi\) a une limite finie en \(+\infty\) (théorème de la limite monotone). Elle vaut \(\frac{\sqrt\pi}{2} \approx 0{,}886\), résultat démontré en 2ᵉ année.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la formule des bornes variables quand \(x\) figure aussi <em>dans</em> l'intégrande. Pour \(H(x) = \int_0^x (x + t)\cos t\,\mathrm{d}t\), on sépare d'abord : \(H(x) = x\int_0^x \cos t\,\mathrm{d}t + \int_0^x t\cos t\,\mathrm{d}t\), puis \(H'(x) = \sin x + x\cos x + x\cos x = \sin x + 2x\cos x\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · INTÉGRATION PAR PARTIES</div>
  <h2>Transférer la dérivée d'un facteur à l'autre</h2>
  <div class="intro">L'intégration par parties est la formule de dérivation d'un produit, intégrée. Elle sert à intégrer un produit de deux fonctions de natures différentes et à établir des relations de récurrence entre intégrales. Les primitives usuelles sont dans le chapitre « Primitives ».</div>

  <div class="prop-box">
    <strong>Intégration par parties.</strong> Si \(u\) et \(v\) sont de classe \(\mathcal C^1\) sur \([a, b]\) :
    <div class="formula" data-nom="Intégration par parties">$$\int_a^b u'(t)\,v(t)\,\mathrm{d}t = \Big[u(t)\,v(t)\Big]_a^b - \int_a^b u(t)\,v'(t)\,\mathrm{d}t .$$</div>
    Démonstration : \((uv)' = u'v + uv'\) est continue, donc \(\int_a^b (uv)' = \big[uv\big]_a^b = \int_a^b u'v + \int_a^b uv'\).
  </div>
  <p><strong>Le choix.</strong> On primitive \(u'\) et on dérive \(v\) : on prend pour \(v\) le facteur que la dérivation simplifie (polynôme, \(\ln\), \(\arctan\)) et pour \(u'\) celui qu'on sait primitiver (exponentielle, sinus, cosinus, puissance). Si la nouvelle intégrale est plus compliquée que l'ancienne, on a inversé les rôles.</p>

  <div class="method-box">
    <strong>Exemple — deux intégrations par parties successives</strong>
    <p>\(A = \displaystyle\int_0^{\pi/2} t^2\cos t\,\mathrm{d}t\). On dérive le polynôme, une fois par degré.</p>
    <ol>
      <li>\(v = t^2\), \(u' = \cos t\), \(u = \sin t\) : \(A = \Big[t^2\sin t\Big]_0^{\pi/2} - 2\displaystyle\int_0^{\pi/2} t\sin t\,\mathrm{d}t = \frac{\pi^2}{4} - 2B\).</li>
      <li>\(B = \displaystyle\int_0^{\pi/2} t\sin t\,\mathrm{d}t\), avec \(v = t\), \(u = -\cos t\) : \(B = \Big[-t\cos t\Big]_0^{\pi/2} + \displaystyle\int_0^{\pi/2}\cos t\,\mathrm{d}t = 0 + 1 = 1\).</li>
      <li>Donc \(A = \dfrac{\pi^2}{4} - 2 \approx 0{,}467\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une relation de récurrence</strong>
    <p>Pour \(n \in \mathbb N\), \(I_n = \displaystyle\int_0^1 t^n\,\mathrm{e}^t\,\mathrm{d}t\).</p>
    <ol>
      <li><strong>Récurrence.</strong> Pour \(n \ge 1\), avec \(v = t^n\) et \(u = \mathrm{e}^t\) : \(I_n = \Big[t^n\mathrm{e}^t\Big]_0^1 - n\displaystyle\int_0^1 t^{n-1}\mathrm{e}^t\,\mathrm{d}t\), soit
        <div class="formula">$$I_n = \mathrm{e} - n\,I_{n-1} \qquad (n \ge 1), \qquad I_0 = \mathrm{e} - 1 .$$</div></li>
      <li><strong>Valeurs.</strong> \(I_1 = 1\), \(I_2 = \mathrm e - 2 \approx 0{,}718\), \(I_3 = 6 - 2\mathrm e \approx 0{,}563\).</li>
      <li><strong>Limite.</strong> Sur \([0, 1]\), \(0 \le t^n\mathrm e^t \le \mathrm e\,t^n\), donc \(0 \le I_n \le \frac{\mathrm e}{n+1}\) et \(I_n \to 0\).</li>
    </ol>
    <p><strong>Piège numérique.</strong> Calculer \(I_{20}\) en flottants par la récurrence, à partir de \(I_0\), donne \(-129\), valeur absurde (\(I_{20} \gt 0\) ; en fait \(I_{20} \approx 0{,}124\)). L'erreur d'arrondi \(\varepsilon\) commise sur \(I_0\), de l'ordre de \(10^{-16}\), est multipliée par \(n\) à chaque étape, donc par \(20! \approx 2{,}4 \times 10^{18}\) au total (chapitre d'informatique « Méthodes numériques », §1).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le crochet, ou son signe ; l'évaluer en une seule borne. Pour une intégrale \(\int u'v\) où \(u'\) et \(v\) sont des exponentielles et des fonctions trigonométriques (\(\int \mathrm{e}^t\cos t\,\mathrm{d}t\)), deux intégrations par parties ramènent à l'intégrale de départ ; il est plus rapide de passer en complexes (§11).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · CHANGEMENT DE VARIABLE</div>
  <h2>Remplacer une expression par une nouvelle variable</h2>
  <div class="intro">Le changement de variable est la formule de dérivation d'une composée, intégrée. Il simplifie un intégrande où apparaît une expression \(\varphi(s)\) accompagnée de sa dérivée, ou élimine un radical.</div>

  <div class="prop-box">
    <strong>Changement de variable.</strong> Si \(\varphi\) est de classe \(\mathcal C^1\) sur \([\alpha, \beta]\) et \(f\) continue sur un intervalle contenant \(\varphi([\alpha, \beta])\) :
    <div class="formula" data-nom="Changement de variable">$$\int_\alpha^\beta f\big(\varphi(s)\big)\,\varphi'(s)\,\mathrm{d}s = \int_{\varphi(\alpha)}^{\varphi(\beta)} f(t)\,\mathrm{d}t .$$</div>
    Démonstration : si \(F\) est une primitive de \(f\), \((F\circ\varphi)' = (f\circ\varphi)\,\varphi'\) ; les deux membres valent \(F\big(\varphi(\beta)\big) - F\big(\varphi(\alpha)\big)\).
  </div>
  <p><strong>En pratique</strong>, on pose \(t = \varphi(s)\) : on remplace \(\mathrm{d}t\) par \(\varphi'(s)\,\mathrm{d}s\) et <strong>on change les bornes</strong>. On peut lire la formule dans les deux sens : reconnaître \(f(\varphi(s))\varphi'(s)\) dans l'intégrande (sens direct), ou poser \(t = \varphi(s)\) pour se débarrasser d'un radical (sens inverse).</p>

  <div class="method-box">
    <strong>Exemple — trois changements de variable</strong>
    <ol>
      <li><strong>Sens direct.</strong> Dans \(\int_0^1 \frac{t}{1 + t^4}\,\mathrm{d}t\), on pose \(u = t^2\), \(\mathrm{d}u = 2t\,\mathrm{d}t\) ; les bornes deviennent \(0\) et \(1\) : \(\displaystyle\int_0^1 \frac{t\,\mathrm{d}t}{1 + t^4} = \frac12\int_0^1\frac{\mathrm{d}u}{1 + u^2} = \frac12\times\frac\pi4 = \frac\pi8\).</li>
      <li><strong>Un logarithme.</strong> Dans \(\int_1^{\mathrm e}\frac{\mathrm{d}t}{t(1 + \ln t)}\), on pose \(u = \ln t\), \(\mathrm{d}u = \frac{\mathrm{d}t}{t}\), bornes \(0\) et \(1\) : on obtient \(\int_0^1\frac{\mathrm{d}u}{1 + u} = \ln 2\).</li>
      <li><strong>Sens inverse : un quart de disque.</strong> Dans \(\int_0^2\sqrt{4 - t^2}\,\mathrm{d}t\), on pose \(t = 2\sin s\) avec \(s \in [0, \frac\pi2]\), \(\mathrm{d}t = 2\cos s\,\mathrm{d}s\). Sur cet intervalle \(\cos s \ge 0\), donc \(\sqrt{4 - 4\sin^2 s} = 2\cos s\) et
        <div class="formula">$$\int_0^2\sqrt{4 - t^2}\,\mathrm{d}t = \int_0^{\pi/2} 4\cos^2 s\,\mathrm{d}s = \int_0^{\pi/2} 2\big(1 + \cos 2s\big)\,\mathrm{d}s = \pi ,$$</div>
        l'aire d'un quart du disque de rayon 2.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : changer la variable sans changer les bornes, oublier le facteur \(\varphi'(s)\) dans \(\mathrm{d}t\), ou simplifier \(\sqrt{\cos^2 s}\) en \(\cos s\) sans vérifier son signe (\(\sqrt{\cos^2 s} = |\cos s|\)) : on choisit l'intervalle de \(s\) pour que le signe soit connu.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · INÉGALITÉ DE TAYLOR-LAGRANGE</div>
  <h2>Contrôler l'écart entre une fonction et son polynôme de Taylor</h2>
  <div class="intro">La formule de Taylor-Young (chapitre « Développements limités ») dit que le polynôme de Taylor approche \(f\) <em>près de \(a\)</em>, avec un reste en \(o\big((x - a)^n\big)\) dont on ne connaît pas la taille. L'inégalité de Taylor-Lagrange donne au contraire une majoration <strong>chiffrée</strong>, valable en tout point d'un intervalle : c'est l'outil des calculs approchés (calculatrices, physique) et le point de départ des séries entières de 2ᵉ année.</div>

  <div class="prop-box">
    <strong>Inégalité de Taylor-Lagrange.</strong> Soit \(f\) de classe \(\mathcal C^{n+1}\) sur un intervalle \(I\), \(a, x \in I\), et \(M\) un majorant de \(|f^{(n+1)}|\) sur le segment d'extrémités \(a\) et \(x\). Alors
    <div class="formula" data-nom="Inégalité de Taylor-Lagrange">$$\left|f(x) - \sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}(x - a)^k\right| \le M\,\frac{|x - a|^{n+1}}{(n+1)!} .$$</div>
    Le polynôme \(T_n(x) = \sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}(x - a)^k\) est le <strong>polynôme de Taylor</strong> de \(f\) en \(a\) à l'ordre \(n\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Par récurrence sur \(n\), en intégrant une majoration de la dérivée.</span>
    <div class="content"><p>On traite \(x \ge a\) (le cas \(x \lt a\) est symétrique). Montrons par récurrence sur \(n\) la propriété : « pour toute fonction \(f\) de classe \(\mathcal C^{n+1}\) avec \(|f^{(n+1)}| \le M\) sur \([a, x]\), on a \(|f(x) - T_n(x)| \le M\frac{(x - a)^{n+1}}{(n+1)!}\) ».</p>
    <p><strong>Rang 0.</strong> \(f(x) - f(a) = \int_a^x f'(t)\,\mathrm{d}t\) (§7), et l'inégalité triangulaire donne \(|f(x) - f(a)| \le M(x - a)\).</p>
    <p><strong>Hérédité.</strong> Soit \(f\) de classe \(\mathcal C^{n+1}\) (\(n \ge 1\)) et \(R = f - T_n\). En dérivant terme à terme, \(T_n'\) est le polynôme de Taylor d'ordre \(n - 1\) de \(f'\) en \(a\), et \((f')^{(n)} = f^{(n+1)}\) est majorée par \(M\). L'hypothèse de récurrence, appliquée à \(f'\) en chaque point \(t \in [a, x]\), donne \(|R'(t)| \le M\frac{(t - a)^n}{n!}\). Comme \(R(a) = 0\),</p>
    <div class="formula">$$|R(x)| = \left|\int_a^x R'(t)\,\mathrm{d}t\right| \le \int_a^x M\,\frac{(t - a)^n}{n!}\,\mathrm{d}t = M\,\frac{(x - a)^{n+1}}{(n+1)!} .$$</div>
    <p>La preuve n'utilise que l'inégalité triangulaire intégrale : elle vaut aussi pour une fonction à valeurs complexes (§11).</p></div>
  </div>

  <div class="prop-box">
    <strong>Formule de Taylor avec reste intégral (non exigible en PTSI).</strong> Sous les mêmes hypothèses,
    <div class="formula">$$f(x) = \sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}(x - a)^k + \int_a^x\frac{(x - t)^n}{n!}\,f^{(n+1)}(t)\,\mathrm{d}t .$$</div>
    On la démontre par récurrence et intégration par parties ; en majorant le reste intégral, on retrouve l'inégalité de Taylor-Lagrange. Elle est au programme de PT (chapitre « Intégration (approfondissements) »).
  </div>

  <div class="notice"><strong>Local ou global ?</strong> Taylor-Young : \(n\) est fixé et \(x \to a\) ; le reste est un \(o\big((x - a)^n\big)\), sans valeur numérique ; il sert à calculer des limites et des équivalents. Taylor-Lagrange : l'inégalité vaut pour tout \(x\) de l'intervalle, avec une constante explicite ; elle sert à majorer une erreur, et l'on peut faire tendre \(n\) vers \(+\infty\) à \(x\) fixé.</div>

  <div class="method-box">
    <strong>Exemple — combien vaut \(\sin(0{,}5)\) ?</strong>
    <ol>
      <li>En 0, les dérivées successives de \(\sin\) valent \(0, 1, 0, -1, 0\) : \(T_3(x) = T_4(x) = x - \frac{x^3}{6}\).</li>
      <li>On applique l'inégalité à l'ordre \(n = 4\) (le terme de degré 4 est nul) avec \(|\sin^{(5)}| = |\cos| \le 1\) : \(\left|\sin x - x + \frac{x^3}{6}\right| \le \frac{|x|^5}{120}\).</li>
      <li>Pour \(x = 0{,}5\) : \(0{,}5 - \frac{0{,}125}{6} \approx 0{,}479\,167\), avec une erreur au plus \(\frac{0{,}5^5}{120} \approx 2{,}6 \times 10^{-4}\). En effet \(\sin(0{,}5) \approx 0{,}479\,426\) : l'erreur réelle, \(2{,}59 \times 10^{-4}\), est presque égale au majorant.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la somme \(1 - \frac12 + \frac13 - \frac14 + \cdots\)</strong>
    <ol>
      <li>Pour \(f(t) = \ln(1 + t)\) et \(k \ge 1\), \(f^{(k)}(t) = \dfrac{(-1)^{k-1}(k-1)!}{(1+t)^k}\), donc \(\frac{f^{(k)}(0)}{k!} = \frac{(-1)^{k-1}}{k}\) et, pour \(t \ge 0\), \(|f^{(n+1)}(t)| \le n!\).</li>
      <li>Pour \(x \ge 0\), l'inégalité donne \(\left|\ln(1 + x) - \displaystyle\sum_{k=1}^{n}\frac{(-1)^{k-1}x^k}{k}\right| \le n!\,\frac{x^{n+1}}{(n+1)!} = \frac{x^{n+1}}{n+1}\).</li>
      <li>En \(x = 1\), le majorant \(\frac{1}{n+1}\) tend vers 0 :
        <div class="formula">$$\sum_{k=1}^{n}\frac{(-1)^{k-1}}{k} \xrightarrow[n\to+\infty]{} \ln 2 .$$</div>
        La convergence est lente : pour \(n = 10\), la somme vaut \(0{,}6456\) (erreur \(0{,}047\), majorant \(\frac1{11}\)) ; pour \(n = 1000\), l'erreur vaut encore \(5{,}0 \times 10^{-4}\).</li>
      <li>En \(x = 0{,}1\), en revanche, trois termes suffisent : \(\ln(1{,}1) \approx 0{,}1 - 0{,}005 + 0{,}000\,333 = 0{,}095\,333\), à \(\frac{0{,}1^4}{4} = 2{,}5 \times 10^{-5}\) près (erreur réelle \(2{,}3 \times 10^{-5}\)).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§11 · FONCTIONS À VALEURS COMPLEXES</div>
  <h2>Intégrer partie réelle et partie imaginaire</h2>
  <div class="intro">En physique, on manipule des grandeurs sinusoïdales en notation complexe ; en mathématiques, l'exponentielle complexe simplifie les intégrales de produits \(\mathrm{e}^{at}\cos(bt)\). Il suffit d'étendre l'intégrale aux fonctions à valeurs complexes, en intégrant séparément les parties réelle et imaginaire. Presque tout se transpose, sauf ce qui utilise l'ordre.</div>

  <div class="def-box">
    Soit \(f : [a, b] \to \mathbb C\) continue (c'est-à-dire \(\operatorname{Re} f\) et \(\operatorname{Im} f\) continues). On pose
    <div class="formula" data-nom="Intégrale d'une fonction complexe">$$\int_a^b f(t)\,\mathrm{d}t = \int_a^b \operatorname{Re} f(t)\,\mathrm{d}t + i\int_a^b \operatorname{Im} f(t)\,\mathrm{d}t .$$</div>
    Ainsi \(\operatorname{Re}\int_a^b f = \int_a^b \operatorname{Re} f\) et \(\operatorname{Im}\int_a^b f = \int_a^b \operatorname{Im} f\).
  </div>
  <div class="prop-box">
    <strong>Ce qui se transpose.</strong>
    <ul>
      <li><strong>Linéarité</strong> à coefficients complexes et <strong>relation de Chasles</strong>.</li>
      <li><strong>Majoration du module</strong> : pour \(a \le b\), \(\left|\int_a^b f(t)\,\mathrm{d}t\right| \le \int_a^b |f(t)|\,\mathrm{d}t\).</li>
      <li><strong>Primitives</strong> : la dérivée de \(f\) est \((\operatorname{Re} f)' + i(\operatorname{Im} f)'\) ; si \(F' = f\), alors \(\int_a^b f = F(b) - F(a)\). Pour \(\lambda \in \mathbb C^*\), \(t \mapsto \frac{\mathrm{e}^{\lambda t}}{\lambda}\) est une primitive de \(t \mapsto \mathrm{e}^{\lambda t}\).</li>
      <li>L'intégration par parties, le changement de variable (réel) et l'<strong>inégalité de Taylor-Lagrange</strong>.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La majoration du module, en tournant l'intégrale pour la rendre réelle.</span>
    <div class="content"><p>Notons \(J = \int_a^b f\). Si \(J = 0\), il n'y a rien à montrer. Sinon, écrivons \(J = r\,\mathrm{e}^{i\theta}\) avec \(r = |J| \gt 0\). Par linéarité, \(r = \mathrm{e}^{-i\theta}J = \int_a^b \mathrm{e}^{-i\theta}f\). Ce nombre est réel, donc égal à sa partie réelle :</p>
    <div class="formula">$$|J| = \int_a^b \operatorname{Re}\big(\mathrm{e}^{-i\theta}f(t)\big)\,\mathrm{d}t \le \int_a^b \big|\mathrm{e}^{-i\theta}f(t)\big|\,\mathrm{d}t = \int_a^b |f(t)|\,\mathrm{d}t ,$$</div>
    <p>par croissance de l'intégrale réelle, puisque \(\operatorname{Re} z \le |z|\).</p></div>
  </div>
  <div class="notice"><strong>Ce qui ne se transpose pas.</strong> \(\mathbb C\) n'est pas ordonné : positivité, croissance, encadrements et valeur moyenne atteinte n'ont pas de sens. De même, il n'existe pas d'égalité des accroissements finis : pour \(f(t) = \mathrm{e}^{it}\) sur \([0, 2\pi]\), \(f(2\pi) - f(0) = 0\), alors que \(|f'(t)| = 1\) en tout point. Seules les <strong>inégalités</strong> (module de l'intégrale, Taylor-Lagrange) restent vraies.</div>

  <div class="method-box">
    <strong>Exemple — passer en complexes pour intégrer \(\mathrm{e}^{-t}\cos 2t\)</strong>
    <ol>
      <li>\(\mathrm{e}^{-t}\cos 2t = \operatorname{Re}\big(\mathrm{e}^{(-1+2i)t}\big)\), et une primitive de \(\mathrm{e}^{(-1+2i)t}\) est \(\frac{\mathrm{e}^{(-1+2i)t}}{-1 + 2i}\).</li>
      <li>Comme \(\mathrm{e}^{2i\pi} = 1\) :
        <div class="formula">$$\int_0^\pi \mathrm{e}^{(-1+2i)t}\,\mathrm{d}t = \frac{\mathrm{e}^{-\pi} - 1}{-1 + 2i} = \frac{1 - \mathrm{e}^{-\pi}}{1 - 2i} = \frac{(1 - \mathrm{e}^{-\pi})(1 + 2i)}{5} .$$</div></li>
      <li>Parties réelle et imaginaire : \(\displaystyle\int_0^\pi \mathrm{e}^{-t}\cos 2t\,\mathrm{d}t = \frac{1 - \mathrm{e}^{-\pi}}{5} \approx 0{,}191\) et, gratuitement, \(\displaystyle\int_0^\pi \mathrm{e}^{-t}\sin 2t\,\mathrm{d}t = \frac{2(1 - \mathrm{e}^{-\pi})}{5} \approx 0{,}383\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — deux résultats utiles en physique</strong>
    <ol>
      <li>Pour \(p \in \mathbb Z\), \(p \neq 0\) : \(\displaystyle\int_0^{2\pi}\mathrm{e}^{ipt}\,\mathrm{d}t = \left[\frac{\mathrm{e}^{ipt}}{ip}\right]_0^{2\pi} = 0\), et l'intégrale vaut \(2\pi\) pour \(p = 0\). La moyenne d'une grandeur sinusoïdale sur une période est nulle.</li>
      <li><strong>Taylor-Lagrange pour \(t \mapsto \mathrm{e}^{it}\)</strong> : toutes ses dérivées sont de module 1, d'où \(\left|\mathrm{e}^{ix} - 1 - ix + \frac{x^2}{2}\right| \le \frac{|x|^3}{6}\). En prenant parties réelle et imaginaire : \(\left|\cos x - 1 + \frac{x^2}{2}\right| \le \frac{|x|^3}{6}\) et \(|\sin x - x| \le \frac{|x|^3}{6}\). Pour \(x = 0{,}3\), le module vaut \(4{,}49 \times 10^{-3}\) pour un majorant de \(4{,}5 \times 10^{-3}\). Au chapitre Séries numériques, la même inégalité, appliquée à \(t \mapsto \mathrm{e}^{tz}\), donne \(\mathrm{e}^z = \sum_{n=0}^{+\infty}\frac{z^n}{n!}\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Prolongements, à titre culturel</h2>
  <ul>
    <li><strong>Fonctions continues par morceaux.</strong> Une fonction est continue par morceaux sur \([a, b]\) si elle est continue sur chaque intervalle ouvert d'une subdivision et a des limites finies aux bornes de chacun. On l'intègre morceau par morceau (Chasles). Exemple : un signal créneau de période 4, nul sur \([0, 1[\) et égal à 5 sur \([1, 4[\), a pour valeur moyenne \(\frac{0 \times 1 + 5 \times 3}{4} = 3{,}75\) (son rapport cyclique est \(\frac34\)). La physique et les sciences de l'ingénieur s'en servent sans cesse.</li>
    <li><strong>Égalité de Taylor-Lagrange.</strong> Pour \(f\) <em>réelle</em> de classe \(\mathcal C^{n+1}\), il existe \(c\) strictement entre \(a\) et \(x\) tel que \(f(x) = T_n(x) + \frac{f^{(n+1)}(c)}{(n+1)!}(x - a)^{n+1}\). Elle est fausse pour les fonctions à valeurs complexes (exemple de \(\mathrm{e}^{it}\), §11) ; l'inégalité suffit à tous les usages du programme.</li>
    <li><strong>Méthode de Simpson.</strong> En remplaçant \(f\) sur deux morceaux consécutifs par la parabole qui passe par trois points, on obtient une erreur en \(\frac{1}{n^4}\) pour \(f\) de classe \(\mathcal C^4\). Avec \(n = 10\) et la fonction du §6, elle donne \(\pi\) avec une erreur de \(4 \times 10^{-8}\), contre \(1{,}7 \times 10^{-3}\) pour les trapèzes.</li>
    <li><strong>Sommes de Riemann.</strong> Le théorème vaut pour toute fonction continue (preuve par la continuité uniforme, théorème de Heine) et même pour les fonctions continues par morceaux.</li>
  </ul>

<div class="course-section">
  <div class="sec-num">MÉTHODES · INTÉGRALES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Calculer une intégrale, l'encadrer quand on ne sait pas la calculer, l'approcher avec une erreur garantie, étudier une fonction définie par une intégrale : chaque méthode donne l'ordre des questions à se poser et un exemple éclair vérifié. Les notations sont celles du cours (§1 à §11).</div>

  <div class="method-box">
    <strong>Méthode 1 — Choisir la technique de calcul</strong>
    <ol>
      <li><span class="step">Étape 1.</span> <strong>Symétries d'abord</strong> : intervalle centré et fonction paire ou impaire, intervalle de période (méthode 5). Un calcul peut disparaître.</li>
      <li><span class="step">Étape 2.</span> <strong>Primitive usuelle</strong>, éventuellement après linéarité, ou <strong>forme composée</strong> \(u'\,g(u)\) : \(\frac{u'}{u}\), \(u'\,\mathrm{e}^u\), \(\frac{u'}{1 + u^2}\), \(u'u^\alpha\) (chapitre « Primitives »).</li>
      <li><span class="step">Étape 3.</span> <strong>Produit de deux fonctions de natures différentes</strong> (polynôme × exponentielle ou trigonométrie ; \(\ln\) ou \(\arctan\) seuls) : intégration par parties (méthode 2).</li>
      <li><span class="step">Étape 4.</span> <strong>Expression \(\varphi(t)\) accompagnée de \(\varphi'(t)\)</strong>, ou radical à éliminer : changement de variable (méthode 4).</li>
      <li><span class="step">Étape 5.</span> <strong>Fraction rationnelle</strong> : division euclidienne si le degré du numérateur dépasse celui du dénominateur, puis décomposition en éléments simples ; les pôles simples donnent des \(\ln|t - a|\), un facteur \(t^2 + bt + c\) sans racine réelle donne (après mise sous forme canonique) un \(\arctan\).</li>
      <li><span class="step">Étape 6.</span> <strong>Exponentielle × cosinus ou sinus</strong> : passer en complexes (méthode 3). <strong>Puissances de \(\cos\), \(\sin\)</strong> : linéariser.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\int_0^1\frac{t\,\mathrm{d}t}{t^2 + 1} = \frac12\Big[\ln(t^2 + 1)\Big]_0^1 = \frac{\ln 2}{2}\) (forme \(\frac{u'}{u}\)) ; et, avec \(\frac{1}{t^2 - 1} = \frac12\left(\frac{1}{t - 1} - \frac{1}{t + 1}\right)\), \(\displaystyle\int_2^3\frac{\mathrm{d}t}{t^2 - 1} = \frac12\Big[\ln\frac{t - 1}{t + 1}\Big]_2^3 = \frac12\ln\frac32 \approx 0{,}203\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Choisir \(u'\) et \(v\) dans une intégration par parties</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire l'intégrande comme un produit \(u'\,v\) : \(v\) est le facteur que la dérivation <strong>simplifie</strong>, \(u'\) celui qu'on sait <strong>primitiver</strong>. Ordre de priorité pour \(v\) : \(\ln\), puis \(\arctan\) (ou \(\arcsin\)), puis polynôme, puis fonctions trigonométriques, puis exponentielle (moyen mnémotechnique anglais « LIATE »).</li>
      <li><span class="step">Étape 2.</span> Pour \(\ln\) ou \(\arctan\) seuls, prendre \(u' = 1\), \(u(t) = t\).</li>
      <li><span class="step">Étape 3.</span> Appliquer \(\int_a^b u'v = \big[uv\big]_a^b - \int_a^b uv'\) en évaluant le crochet aux <strong>deux</strong> bornes.</li>
      <li><span class="step">Étape 4.</span> Vérifier que la nouvelle intégrale est plus simple ; sinon, échanger les rôles.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\int_0^1 t\arctan t\,\mathrm{d}t\), avec \(v = \arctan t\), \(u = \frac{t^2}{2}\), et \(\frac{t^2}{1+t^2} = 1 - \frac{1}{1+t^2}\) :</p>
    <div class="formula">$$\int_0^1 t\arctan t\,\mathrm{d}t = \Big[\frac{t^2}{2}\arctan t\Big]_0^1 - \frac12\int_0^1\frac{t^2\,\mathrm{d}t}{1 + t^2} = \frac\pi8 - \frac12\left(1 - \frac\pi4\right) = \frac\pi4 - \frac12 \approx 0{,}285 .$$</div>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Enchaîner les intégrations par parties, ou passer en complexes</strong>
    <ol>
      <li><span class="step">Étape 1.</span> <strong>Polynôme de degré \(p\)</strong> × exponentielle ou trigonométrie : \(p\) intégrations par parties, en dérivant toujours le polynôme.</li>
      <li><span class="step">Étape 2.</span> <strong>Suite d'intégrales</strong> \(I_n\) : une intégration par parties abaisse l'indice et donne une relation de récurrence (cours §8).</li>
      <li><span class="step">Étape 3.</span> <strong>\(\mathrm{e}^{at}\cos(bt)\) ou \(\mathrm{e}^{at}\sin(bt)\)</strong> : écrire \(\int \mathrm{e}^{at}\cos(bt) = \operatorname{Re}\int \mathrm{e}^{(a + ib)t}\), primitiver \(\frac{\mathrm{e}^{(a+ib)t}}{a + ib}\), puis prendre la partie réelle (ou imaginaire) en multipliant par le conjugué. À défaut, deux intégrations par parties en primitivant <em>deux fois</em> l'exponentielle ramènent à l'intégrale de départ.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\int_0^{\pi/2}\mathrm{e}^{(1+i)t}\,\mathrm{d}t = \frac{i\,\mathrm{e}^{\pi/2} - 1}{1 + i} = \frac{(i\,\mathrm{e}^{\pi/2} - 1)(1 - i)}{2}\), dont la partie imaginaire donne \(\displaystyle\int_0^{\pi/2}\mathrm{e}^t\sin t\,\mathrm{d}t = \frac{\mathrm{e}^{\pi/2} + 1}{2} \approx 2{,}905\) et la partie réelle \(\displaystyle\int_0^{\pi/2}\mathrm{e}^t\cos t\,\mathrm{d}t = \frac{\mathrm{e}^{\pi/2} - 1}{2}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dans une double intégration par parties, primitiver l'exponentielle la première fois et la dériver la seconde défait le calcul et redonne \(I = I\).</div>

  <div class="method-box">
    <strong>Méthode 4 — Mener un changement de variable</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Choisir la nouvelle variable : \(u = \sqrt t\) pour \(f(\sqrt t)\) (\(t = u^2\), \(\mathrm{d}t = 2u\,\mathrm{d}u\)) ; \(u = \mathrm{e}^t\) pour une fraction en \(\mathrm{e}^t\) (\(\mathrm{d}t = \frac{\mathrm{d}u}{u}\)) ; \(u = \ln t\) quand \(\frac{\mathrm{d}t}{t}\) apparaît ; \(t = a\sin s\) pour \(\sqrt{a^2 - t^2}\).</li>
      <li><span class="step">Étape 2.</span> Exprimer \(\mathrm{d}t\) (ou \(\mathrm{d}u\)) et <strong>changer les bornes</strong>.</li>
      <li><span class="step">Étape 3.</span> Remplacer <em>tout</em> l'intégrande : il ne doit plus rester l'ancienne variable.</li>
      <li><span class="step">Étape 4.</span> Pour un radical, vérifier le signe de ce qu'on sort de la racine sur l'intervalle de la nouvelle variable.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\int_0^1\frac{\sqrt t}{1 + t}\,\mathrm{d}t\) avec \(u = \sqrt t\) (bornes \(0\) et \(1\)) : \(\displaystyle\int_0^1\frac{u}{1 + u^2}\,2u\,\mathrm{d}u = 2\int_0^1\left(1 - \frac{1}{1 + u^2}\right)\mathrm{d}u = 2 - \frac\pi2 \approx 0{,}429\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Exploiter parité, périodicité et symétrie</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Intervalle \([-a, a]\) : découper l'intégrande en partie paire et partie impaire ; la partie impaire donne 0, la partie paire \(2\int_0^a\).</li>
      <li><span class="step">Étape 2.</span> Fonction \(T\)-périodique : sur un intervalle de \(k\) périodes, l'intégrale vaut \(k\) fois l'intégrale sur la période la plus commode.</li>
      <li><span class="step">Étape 3.</span> Bornes \(a\), \(b\) quelconques : essayer \(t = a + b - s\), qui échange les bornes (sur \([0, \frac\pi2]\), il échange \(\sin\) et \(\cos\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\int_{-1}^1\big(t^3\cos t + t^2\big)\,\mathrm{d}t = 0 + 2\int_0^1 t^2\,\mathrm{d}t = \frac23\). Avec \(t = \frac\pi2 - s\), \(\int_0^{\pi/2}\cos^2 = \int_0^{\pi/2}\sin^2\) ; leur somme vaut \(\int_0^{\pi/2} 1 = \frac\pi2\), donc chacune vaut \(\frac\pi4\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Encadrer une intégrale, ou montrer qu'une suite d'intégrales tend vers 0</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Vérifier que les bornes sont dans l'ordre croissant (sinon, échanger et changer le signe).</li>
      <li><span class="step">Étape 2.</span> Encadrer l'<strong>intégrande</strong> sur l'intervalle par des fonctions qu'on sait intégrer : majorer chaque facteur par son maximum, utiliser \(\mathrm{e}^u \ge 1 + u\), \(\ln(1 + u) \le u\), \(|\sin u| \le |u|\)…</li>
      <li><span class="step">Étape 3.</span> Intégrer l'encadrement (croissance de l'intégrale), ou majorer \(|\int f| \le \int|f| \le (b - a)\max|f|\).</li>
      <li><span class="step">Étape 4.</span> Pour une suite \(\int_0^1 t^n g(t)\,\mathrm{d}t\) avec \(m \le g \le M\) : \(\frac{m}{n+1} \le I_n \le \frac{M}{n+1}\), donc \(I_n \to 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \([0, 1]\), \(1 \le \sqrt{1 + t} \le \sqrt2\), donc \(\frac{1}{n+1} \le \displaystyle\int_0^1 t^n\sqrt{1 + t}\,\mathrm{d}t \le \frac{\sqrt2}{n+1}\) ; pour \(n = 5\), \(0{,}167 \le 0{,}227 \le 0{,}236\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une majoration de \(f\) ne donne une majoration de l'intégrale que si les bornes sont dans l'ordre croissant, et « \(f\) positive d'intégrale nulle, donc nulle » exige la continuité de \(f\).</div>

  <div class="method-box">
    <strong>Méthode 7 — Reconnaître une somme de Riemann</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Mettre en facteur \(\frac1n\) (ou \(\frac{b - a}{n}\)), en factorisant au besoin par une puissance de \(n\) dans chaque terme.</li>
      <li><span class="step">Étape 2.</span> Écrire le terme restant sous la forme \(f\!\left(\frac kn\right)\), avec \(f\) continue indépendante de \(n\) et de \(k\).</li>
      <li><span class="step">Étape 3.</span> Lire l'intervalle sur les indices : \(k\) de \(1\) à \(n\) (ou de \(0\) à \(n - 1\)) donne \([0, 1]\).</li>
      <li><span class="step">Étape 4.</span> Conclure par le théorème, puis calculer \(\int_0^1 f\). Pour un produit, passer d'abord au logarithme.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\sum_{k=1}^n\frac{n}{(n + k)^2} = \frac1n\sum_{k=1}^n\frac{1}{(1 + k/n)^2} \to \int_0^1\frac{\mathrm{d}x}{(1 + x)^2} = \frac12\) (valeur pour \(n = 1000\) : \(0{,}4996\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Approcher une intégrale avec une précision garantie</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Choisir la méthode : trapèzes de préférence (erreur en \(\frac{1}{n^2}\)) ; rectangles si \(f\) n'est connue que par ses valeurs ou si l'énoncé l'impose (erreur en \(\frac1n\)).</li>
      <li><span class="step">Étape 2.</span> Calculer \(M_1 = \max|f'|\) (rectangles) ou \(M_2 = \max|f''|\) (trapèzes) <strong>sur \([a, b]\)</strong>, par une étude de fonction si besoin.</li>
      <li><span class="step">Étape 3.</span> Résoudre \(\frac{M_1(b - a)^2}{2n} \le \varepsilon\) ou \(\frac{M_2(b - a)^3}{12n^2} \le \varepsilon\) ; prendre le plus petit entier qui convient.</li>
      <li><span class="step">Étape 4.</span> Calculer \(R_n\) ou \(T_n\) (à la main pour \(n\) petit, sinon par le programme du chapitre « Méthodes numériques ») ; prévoir le sens de l'erreur (monotonie pour les rectangles, convexité pour les trapèzes).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\int_0^\pi\sin t\,\mathrm{d}t = 2\). Avec \(n = 4\), \(f(0) = f(\pi) = 0\) et \(T_4 = \frac\pi4\big(\sin\frac\pi4 + \sin\frac\pi2 + \sin\frac{3\pi}4\big)\), soit \(T_4 = \frac\pi4(1 + \sqrt2) \approx 1{,}896\) : erreur \(0{,}104\) pour un majorant \(\frac{1 \times \pi^3}{12 \times 16} \approx 0{,}161\). Pour une erreur au plus \(10^{-4}\), il suffit que \(n \ge 161\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Étudier une fonction définie par une intégrale</strong>
    <ol>
      <li><span class="step">Étape 1.</span> <strong>Ensemble de définition</strong> : l'intégrande doit être continue sur le segment d'extrémités \(u(x)\) et \(v(x)\), pour chaque \(x\).</li>
      <li><span class="step">Étape 2.</span> Si \(x\) figure aussi dans l'intégrande, le sortir de l'intégrale (linéarité) avant de dériver.</li>
      <li><span class="step">Étape 3.</span> <strong>Dériver</strong> : \(\frac{\mathrm{d}}{\mathrm{d}x}\int_{u(x)}^{v(x)} f(t)\,\mathrm{d}t = f\big(v(x)\big)v'(x) - f\big(u(x)\big)u'(x)\), puis étudier le signe.</li>
      <li><span class="step">Étape 4.</span> <strong>Parité</strong> par le changement de variable \(t = -s\) ; <strong>limites</strong> par encadrement de l'intégrande (méthode 6) ; valeurs particulières (\(\int_a^a = 0\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(x \gt 1\), \(F(x) = \displaystyle\int_x^{x^2}\frac{\mathrm{d}t}{\ln t}\) est bien définie (\(\ln t \gt 0\) sur \([x, x^2]\)) et \(F'(x) = \dfrac{2x}{\ln(x^2)} - \dfrac{1}{\ln x} = \dfrac{x - 1}{\ln x} \gt 0\) : \(F\) est strictement croissante sur \(]1, +\infty[\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Majorer une erreur par l'inégalité de Taylor-Lagrange</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Choisir le point \(a\) où les dérivées sont simples (souvent \(0\)) et calculer le polynôme de Taylor \(T_n\).</li>
      <li><span class="step">Étape 2.</span> Majorer \(|f^{(n+1)}|\) par \(M\) <strong>sur le segment entre \(a\) et \(x\)</strong> (pas seulement en \(a\)).</li>
      <li><span class="step">Étape 3.</span> Écrire \(|f(x) - T_n(x)| \le M\frac{|x - a|^{n+1}}{(n+1)!}\) et choisir \(n\) pour que ce majorant soit inférieur à la précision voulue.</li>
      <li><span class="step">Étape 4.</span> Pour une limite quand \(n \to +\infty\), vérifier que le majorant tend vers 0 (la factorielle l'emporte sur \(|x - a|^{n+1}\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sqrt{\mathrm e} = \mathrm{e}^{0{,}5}\) à \(10^{-4}\) près : sur \([0 ; 0{,}5]\), \(|\exp^{(n+1)}| \le \mathrm{e}^{0{,}5} \le 2\), d'où l'erreur au plus \(\frac{2 \times 0{,}5^{n+1}}{(n+1)!}\) : \(5{,}2 \times 10^{-4}\) pour \(n = 4\), \(4{,}3 \times 10^{-5}\) pour \(n = 5\). On prend \(n = 5\) : \(1 + 0{,}5 + \frac{0{,}25}{2} + \cdots + \frac{0{,}5^5}{120} \approx 1{,}648\,70\), et en effet \(\sqrt{\mathrm e} \approx 1{,}648\,72\).</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> :
    <ul>
      <li>oublier de changer les bornes (ou le \(\mathrm{d}t\)) dans un changement de variable ;</li>
      <li>appliquer une inégalité entre intégrales avec des bornes dans l'ordre décroissant ;</li>
      <li>confondre l'intégrale \(\int_a^b f\), qui est un <strong>nombre</strong>, et une primitive, qui est une <strong>fonction</strong> ;</li>
      <li>reprendre la lettre de la borne comme variable d'intégration : \(\int_0^x f(t)\,\mathrm{d}t\), jamais \(\int_0^x f(x)\,\mathrm{d}x\) ;</li>
      <li>dans les trapèzes, compter les extrémités en entier ; dans Taylor-Lagrange, majorer \(f^{(n+1)}\) au seul point \(a\) ;</li>
      <li>pour une fonction à valeurs complexes, écrire des inégalités entre complexes : seul le module se majore.</li>
    </ul>
  </div>
</div>
</template>
