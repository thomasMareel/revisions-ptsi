<div class="course-section">
  <div class="sec-num">§1 · SÉQUENCES : INDICES ET TRANCHES</div>
  <h2>Ce que partagent chaînes, tuples et listes</h2>
  <div class="intro">Une chaîne, un tuple et une liste sont des <strong>séquences</strong> : des valeurs rangées dans un ordre, repérées par leur position. Elles partagent la même façon d'accéder aux éléments, de découper, de concaténer et de parcourir ; seule la liste est modifiable.</div>
  <div class="def-box">Une <strong>séquence</strong> <span class="code-inline">s</span> de longueur \(n\) = <span class="code-inline">len(s)</span> a ses éléments aux <strong>indices</strong> \(0, 1, \dots, n - 1\) ; <span class="code-inline">s[i]</span> est l'élément d'indice <span class="code-inline">i</span>. La <strong>tranche</strong> <span class="code-inline">s[a:b]</span> (pour \(0 \le a \le b \le n\)) est la nouvelle séquence des éléments d'indices \(a\) à \(b - 1\) : elle en contient \(b - a\). On peut omettre une borne : <span class="code-inline">s[:b]</span> part du début, <span class="code-inline">s[a:]</span> va jusqu'à la fin. <span class="code-inline">s + u</span> met deux séquences bout à bout (concaténation) ; <span class="code-inline">s * k</span> répète <span class="code-inline">s</span> \(k\) fois.</div>
  <pre class="codeblock">&gt;&gt;&gt; mot = <span class="str">"TRANSISTOR"</span>
&gt;&gt;&gt; t = [3, 1, 4, 1, 5, 9, 2, 6]
&gt;&gt;&gt; len(mot), len(t)
(10, 8)
&gt;&gt;&gt; mot[0], mot[9], t[len(t) - 1]
(<span class="str">'T'</span>, <span class="str">'R'</span>, 6)
&gt;&gt;&gt; mot[2:5], t[3:6], t[:2], t[6:]
(<span class="str">'ANS'</span>, [1, 5, 9], [3, 1], [2, 6])
&gt;&gt;&gt; mot[4:4], t[5:2]
(<span class="str">''</span>, [])
&gt;&gt;&gt; (1, 2) + (3,), <span class="str">"ab"</span> * 3, [0] * 4
((1, 2, 3), <span class="str">'ababab'</span>, [0, 0, 0, 0])</pre>

  <div class="prop-box"><strong>Bornes d'une tranche.</strong> Pour \(0 \le a \le b \le n\) : <span class="code-inline">len(s[a:b])</span> vaut \(b - a\) ; <span class="code-inline">s[a:a]</span> est vide ; <span class="code-inline">s[:k] + s[k:]</span> redonne <span class="code-inline">s</span>. Le dernier élément est <span class="code-inline">s[len(s) - 1]</span>, les \(k\) derniers forment <span class="code-inline">s[len(s) - k:]</span>.</div>
  <p>L'annexe du programme ne retient que les <strong>indices positifs valides</strong> : Python accepte aussi <span class="code-inline">s[-1]</span> pour le dernier élément, mais un sujet qui s'en sert le rappelle (dernière section). Un indice hors de \(\{0, \dots, n - 1\}\) arrête le programme :</p>
  <pre class="codeblock">&gt;&gt;&gt; t = [3, 1, 4, 1, 5, 9, 2, 6]
&gt;&gt;&gt; t[8]
Traceback (most recent call last):
  ...
IndexError: list index out of range</pre>

  <h3>Parcourir une séquence</h3>
  <p>Deux façons, qui conviennent aux trois types : <strong>par élément</strong> (<span class="code-inline">for x in s</span>) quand seule la valeur compte, <strong>par indice</strong> (<span class="code-inline">for i in range(len(s))</span>) quand la position compte aussi, ou pour comparer des voisins.</p>
  <pre class="codeblock"><span class="kw">def</span> compte(s, c):
    <span class="str">"""Nombre d'éléments de la séquence s (chaîne, tuple ou liste) égaux à c."""</span>
    n = 0
    <span class="kw">for</span> x <span class="kw">in</span> s:                  <span class="cmt"># parcours par élément</span>
        <span class="kw">if</span> x == c:
            n = n + 1
    <span class="kw">return</span> n

<span class="kw">def</span> positions(s, c):
    <span class="str">"""Liste des indices i tels que s[i] == c."""</span>
    res = []
    <span class="kw">for</span> i <span class="kw">in</span> range(len(s)):      <span class="cmt"># parcours par indice</span>
        <span class="kw">if</span> s[i] == c:
            res.append(i)
    <span class="kw">return</span> res

compte(<span class="str">"TRANSISTOR"</span>, <span class="str">"S"</span>)              <span class="cmt"># 2</span>
compte((3, 1, 4, 1), 1)                <span class="cmt"># 2</span>
positions([3, 1, 4, 1, 5, 9, 2, 6], 1)  <span class="cmt"># [1, 3]</span></pre>
  <div class="method-box"><strong>Exemple — lire des expressions</strong>
    <p>Avec <span class="code-inline">mot = "TRANSISTOR"</span> et <span class="code-inline">t = [3, 1, 4, 1, 5, 9, 2, 6]</span> (console ci-dessus) :</p>
    <ol>
      <li><span class="code-inline">mot[2:5]</span> prend les indices 2, 3, 4 : <span class="code-inline">'ANS'</span>, de longueur \(5 - 2 = 3\).</li>
      <li><span class="code-inline">t[len(t) - 1]</span> est le dernier élément, 6 ; <span class="code-inline">t[8]</span> provoquerait une erreur, mais <span class="code-inline">t[6:]</span>, qui s'arrête à la fin, vaut <span class="code-inline">[2, 6]</span>.</li>
      <li><span class="code-inline">t[5:2]</span> est vide : la borne de gauche dépasse celle de droite.</li>
      <li><span class="code-inline">compte</span> fonctionne aussi bien sur une chaîne que sur un tuple ou une liste (typage dynamique, chapitre <em>Fonctions</em>) : elle n'utilise que le parcours par élément et la comparaison <span class="code-inline">==</span>.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : compter les éléments d'une tranche comme si la borne de droite était incluse. <span class="code-inline">t[1:3]</span> a 2 éléments, <span class="code-inline">t[1]</span> et <span class="code-inline">t[2]</span> ; de même <span class="code-inline">range(1, 3)</span> donne 1 et 2. La règle est la même partout en Python : borne de gauche incluse, borne de droite exclue.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CHAÎNES DE CARACTÈRES</div>
  <h2>Des séquences de caractères, non modifiables</h2>
  <div class="intro">Les textes, les noms, les codes (ADN, numéros, mots de passe) se manipulent comme des chaînes. On les lit, on les découpe, on les compare ; on ne les modifie jamais sur place : on en fabrique de nouvelles.</div>
  <div class="def-box">Une <strong>chaîne</strong> (type <span class="code-inline">str</span>) s'écrit entre guillemets : <span class="code-inline">"PTSI"</span> ou <span class="code-inline">'PTSI'</span> ; <span class="code-inline">""</span> est la chaîne vide. Ses éléments sont des chaînes d'un caractère. Une chaîne est <strong>immuable</strong> : aucune opération ne change ses caractères ; <span class="code-inline">+</span>, <span class="code-inline">*</span> et les tranches fabriquent de nouvelles chaînes.</div>
  <pre class="codeblock">&gt;&gt;&gt; s = <span class="str">"PTSI"</span>
&gt;&gt;&gt; s[0] = <span class="str">"X"</span>
Traceback (most recent call last):
  ...
TypeError: <span class="str">'str'</span> object does <span class="kw">not</span> support item assignment
&gt;&gt;&gt; <span class="str">"X"</span> + s[1:]
<span class="str">'XTSI'</span></pre>
  <p>Pour « modifier » une chaîne, on construit la nouvelle chaîne caractère par caractère, à partir de la chaîne vide :</p>
  <pre class="codeblock"><span class="kw">def</span> miroir(s):
    <span class="str">"""Chaîne s écrite à l'envers."""</span>
    r = <span class="str">""</span>
    <span class="kw">for</span> c <span class="kw">in</span> s:
        r = c + r                <span class="cmt"># chaque caractère passe devant les précédents</span>
    <span class="kw">return</span> r</pre>
  <div class="method-box"><strong>Exemple — dérouler <span class="code-inline">miroir("PTSI")</span></strong>
    <div><table>
<tr><th>moment</th><th><span class="code-inline">c</span></th><th><span class="code-inline">r</span> après le tour</th></tr>
<tr><td>avant la boucle</td><td></td><td><span class="code-inline">''</span></td></tr>
<tr><td>tour 1</td><td><span class="code-inline">'P'</span></td><td><span class="code-inline">'P'</span></td></tr>
<tr><td>tour 2</td><td><span class="code-inline">'T'</span></td><td><span class="code-inline">'TP'</span></td></tr>
<tr><td>tour 3</td><td><span class="code-inline">'S'</span></td><td><span class="code-inline">'STP'</span></td></tr>
<tr><td>tour 4</td><td><span class="code-inline">'I'</span></td><td><span class="code-inline">'ISTP'</span></td></tr>
</table></div>
    <p>Chaque tour place le caractère lu <em>devant</em> ceux déjà rangés : la fonction renvoie <span class="code-inline">'ISTP'</span>. La variable <span class="code-inline">r</span> désigne à chaque tour une nouvelle chaîne ; l'ancienne est abandonnée.</p>
  </div>
  <pre class="codeblock"><span class="kw">def</span> remplacer(s, a, b):
    <span class="str">"""Copie de s où chaque caractère a est remplacé par la chaîne b."""</span>
    r = <span class="str">""</span>
    <span class="kw">for</span> c <span class="kw">in</span> s:
        <span class="kw">if</span> c == a:
            r = r + b
        <span class="kw">else</span>:
            r = r + c
    <span class="kw">return</span> r

x = float(remplacer(<span class="str">"3,14"</span>, <span class="str">","</span>, <span class="str">"."</span>))   <span class="cmt"># 3.14</span></pre>
  <p>Cette fonction remplace la virgule décimale par un point avant la conversion par <span class="code-inline">float</span> (chapitre <em>Bases de Python</em>), qui n'accepte que le point.</p>

  <h3>Comparer des chaînes</h3>
  <p><span class="code-inline">==</span> teste l'égalité caractère par caractère ; <span class="code-inline">&lt;</span> compare dans l'ordre <strong>lexicographique</strong>, celui du dictionnaire, caractère par caractère, en suivant le codage des caractères : toutes les majuscules passent avant les minuscules, et les chiffres avant les lettres.</p>
  <pre class="codeblock">&gt;&gt;&gt; <span class="str">"abc"</span> &lt; <span class="str">"abd"</span>, <span class="str">"Zèbre"</span> &lt; <span class="str">"abeille"</span>, <span class="str">"10"</span> &lt; <span class="str">"9"</span>, 10 &lt; 9
(<span class="kw">True</span>, <span class="kw">True</span>, <span class="kw">True</span>, <span class="kw">False</span>)</pre>
  <div class="notice"><strong>Erreur classique</strong> : comparer des nombres écrits en chaînes. <span class="code-inline">"10" &lt; "9"</span> est vrai (le caractère 1 précède le caractère 9) ; on convertit d'abord par <span class="code-inline">int</span> ou <span class="code-inline">float</span>.</div>
  <div class="notice"><strong>Coût caché</strong> : <span class="code-inline">r = c + r</span> recopie toute la chaîne <span class="code-inline">r</span>. Construire une chaîne de longueur \(n\) par \(n\) concaténations coûte donc, dans le modèle de coût du programme, \(1 + 2 + \dots + n = O(n^2)\). C'est sans conséquence pour des textes courts ; pour de longues données, on préfère des listes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TUPLES</div>
  <h2>Regrouper des valeurs fixes</h2>
  <div class="intro">Un point du plan, un horaire, une date, un couple (nom, note) : des valeurs qui vont ensemble et ne changent pas. Le tuple les regroupe en un seul objet, qu'une fonction peut renvoyer et qu'on dépaquète en variables.</div>
  <div class="def-box">Un <strong>tuple</strong> s'écrit avec des virgules, en général entre parenthèses : <span class="code-inline">(3, 4)</span>, <span class="code-inline">("Ada", 14)</span>. C'est une séquence <strong>immuable</strong> : <span class="code-inline">len</span>, indices, tranches, <span class="code-inline">+</span>, <span class="code-inline">*</span> et parcours comme pour les chaînes, mais aucune case ne peut être changée. Un tuple à un seul élément s'écrit avec une virgule : <span class="code-inline">(7,)</span>. Le <strong>dépaquetage</strong> <span class="code-inline">x, y = p</span> range les éléments du tuple <span class="code-inline">p</span> dans autant de variables.</div>
  <pre class="codeblock">&gt;&gt;&gt; p = (3, 4)
&gt;&gt;&gt; p[0], len(p)
(3, 2)
&gt;&gt;&gt; x, y = p
&gt;&gt;&gt; x + y
7
&gt;&gt;&gt; type((7)), type((7,))
(&lt;<span class="kw">class</span> <span class="str">'int'</span>&gt;, &lt;<span class="kw">class</span> <span class="str">'tuple'</span>&gt;)
&gt;&gt;&gt; p[0] = 5
Traceback (most recent call last):
  ...
TypeError: <span class="str">'tuple'</span> object does <span class="kw">not</span> support item assignment</pre>
  <p>(<span class="code-inline">type</span>, qui donne le type d'une valeur, n'est utilisé ici que pour l'illustration : <span class="code-inline">(7)</span> est l'entier 7 entre parenthèses, c'est la virgule qui fait le tuple.)</p>

  <h3>L'affectation simultanée</h3>
  <p>Dans <span class="code-inline">a, b = b, a + b</span>, le membre de droite est un tuple, calculé <strong>entièrement</strong> avec les anciennes valeurs avant d'être dépaqueté. C'est ainsi qu'on échange deux variables (<span class="code-inline">a, b = b, a</span>) et qu'on fait avancer d'un pas une suite définie par deux termes.</p>
  <pre class="codeblock"><span class="kw">def</span> fibonacci(n):
    <span class="str">"""Terme F(n) de la suite F(0) = 0, F(1) = 1, F(k+2) = F(k+1) + F(k)."""</span>
    a, b = 0, 1              <span class="cmt"># (F(0), F(1))</span>
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        a, b = b, a + b      <span class="cmt"># (F(k), F(k+1)) devient (F(k+1), F(k+2))</span>
    <span class="kw">return</span> a</pre>
  <div class="method-box"><strong>Exemple — affectation simultanée ou successive</strong>
    <p>La version suivante sépare les deux affectations :</p>
    <pre class="codeblock"><span class="kw">def</span> fibonacci_faux(n):
    a, b = 0, 1
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        a = b                <span class="cmt"># a perd son ancienne valeur…</span>
        b = a + b            <span class="cmt"># … que cette ligne aurait dû utiliser</span>
    <span class="kw">return</span> a</pre>
    <div><table>
<tr><th>moment</th><th><span class="code-inline">(a, b)</span> simultanée</th><th><span class="code-inline">(a, b)</span> successive</th></tr>
<tr><td>départ</td><td><span class="code-inline">(0, 1)</span></td><td><span class="code-inline">(0, 1)</span></td></tr>
<tr><td>tour 1</td><td><span class="code-inline">(1, 1)</span></td><td><span class="code-inline">(1, 2)</span></td></tr>
<tr><td>tour 2</td><td><span class="code-inline">(1, 2)</span></td><td><span class="code-inline">(2, 4)</span></td></tr>
<tr><td>tour 3</td><td><span class="code-inline">(2, 3)</span></td><td><span class="code-inline">(4, 8)</span></td></tr>
<tr><td>tour 4</td><td><span class="code-inline">(3, 5)</span></td><td><span class="code-inline">(8, 16)</span></td></tr>
<tr><td>tour 5</td><td><span class="code-inline">(5, 8)</span></td><td><span class="code-inline">(16, 32)</span></td></tr>
</table></div>
    <p>Dans la version fausse, <span class="code-inline">b = a + b</span> utilise la <em>nouvelle</em> valeur de <span class="code-inline">a</span>, égale à <span class="code-inline">b</span> : on calcule \(2b\), et l'on obtient les puissances de 2 au lieu de la suite de Fibonacci. L'affectation simultanée évite d'introduire une variable auxiliaire.</p>
  </div>

  <h3>Des tuples comme enregistrements</h3>
  <pre class="codeblock">releve = [(<span class="str">"Ada"</span>, 14), (<span class="str">"Blaise"</span>, 9), (<span class="str">"Carl"</span>, 17), (<span class="str">"Dora"</span>, 12)]

<span class="kw">def</span> meilleur(releve):
    <span class="str">"""Nom de l'élève de meilleure note (relevé non vide de couples (nom, note))."""</span>
    nom_max, note_max = releve[0]
    <span class="kw">for</span> nom, note <span class="kw">in</span> releve:         <span class="cmt"># dépaquetage de chaque couple</span>
        <span class="kw">if</span> note &gt; note_max:
            nom_max, note_max = nom, note
    <span class="kw">return</span> nom_max

meilleur(releve)                     <span class="cmt"># 'Carl'</span></pre>
  <p>La boucle <span class="code-inline">for nom, note in releve</span> dépaquète chaque couple à chaque tour. Les tuples se comparent comme les chaînes, élément par élément : c'est commode pour des horaires <span class="code-inline">(h, m)</span>, qui se comparent alors dans l'ordre chronologique.</p>
  <pre class="codeblock">&gt;&gt;&gt; (17, 30) &lt; (18, 5), (8, 9) &lt; (8, 10), (<span class="str">"Ada"</span>, 14) &lt; (<span class="str">"Ada"</span>, 9)
(<span class="kw">True</span>, <span class="kw">True</span>, <span class="kw">False</span>)</pre>
  <div class="notice"><strong>Erreur classique</strong> : vouloir modifier un champ d'un enregistrement, <span class="code-inline">releve[0][1] = 15</span>. Le couple est immuable ; on remplace la case de la liste par un nouveau couple : <span class="code-inline">releve[0] = ("Ada", 15)</span>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LISTES</div>
  <h2>Créer, modifier, faire grandir</h2>
  <div class="intro">La liste est le tableau de Python : une séquence <strong>modifiable</strong>, qu'on peut créer d'un coup, remplir case par case, allonger ou raccourcir par la fin. C'est la structure de base de presque tous les algorithmes du programme.</div>
  <div class="def-box">Une <strong>liste</strong> s'écrit entre crochets : <span class="code-inline">[4, 7, 1]</span>, <span class="code-inline">[]</span> pour la liste vide. En plus des opérations des séquences :
    <ul>
      <li><span class="code-inline">t[i] = x</span> remplace l'élément d'indice \(i\) (qui doit exister) ;</li>
      <li><span class="code-inline">t.append(x)</span> ajoute <span class="code-inline">x</span> à la fin ; la liste est modifiée, rien n'est renvoyé ;</li>
      <li><span class="code-inline">t.pop()</span> retire le dernier élément et le renvoie (erreur si la liste est vide).</li>
    </ul>
    Trois façons de créer une liste : <span class="code-inline">[e] * n</span> (\(n\) fois la même valeur), la <strong>compréhension</strong> <span class="code-inline">[e for x in s]</span> (une valeur <span class="code-inline">e</span>, calculée à partir de <span class="code-inline">x</span>, pour chaque <span class="code-inline">x</span> de la séquence <span class="code-inline">s</span>), et des <span class="code-inline">append</span> successifs à partir de <span class="code-inline">[]</span>.</div>
  <pre class="codeblock">&gt;&gt;&gt; [0] * 5
[0, 0, 0, 0, 0]
&gt;&gt;&gt; [k * k <span class="kw">for</span> k <span class="kw">in</span> range(6)]
[0, 1, 4, 9, 16, 25]
&gt;&gt;&gt; [len(m) <span class="kw">for</span> m <span class="kw">in</span> [<span class="str">"vis"</span>, <span class="str">"écrou"</span>, <span class="str">"rondelle"</span>]]
[3, 5, 8]
&gt;&gt;&gt; t = []
&gt;&gt;&gt; t.append(4)
&gt;&gt;&gt; t.append(7)
&gt;&gt;&gt; t
[4, 7]
&gt;&gt;&gt; t.pop()
7
&gt;&gt;&gt; t
[4]
&gt;&gt;&gt; t[0] = 10
&gt;&gt;&gt; t + [20, 30]
[10, 20, 30]</pre>
  <p>La compréhension convient quand chaque élément se calcule directement ; les <span class="code-inline">append</span> dans une boucle, quand la longueur n'est pas connue d'avance, par exemple quand on ne garde que certains éléments :</p>
  <pre class="codeblock"><span class="kw">def</span> diviseurs(n):
    <span class="str">"""Liste croissante des diviseurs de l'entier n &gt;= 1."""</span>
    res = []
    <span class="kw">for</span> d <span class="kw">in</span> range(1, n + 1):
        <span class="kw">if</span> n % d == 0:
            res.append(d)        <span class="cmt"># longueur inconnue d'avance : append</span>
    <span class="kw">return</span> res</pre>

  <h3>Une pile : <span class="code-inline">append</span> et <span class="code-inline">pop</span></h3>
  <p>Ajouter et retirer seulement à la fin, c'est utiliser la liste comme une <strong>pile</strong> : le dernier élément arrivé est le premier sorti (annuler la dernière action, revenir en arrière, vérifier un parenthésage, parcourir un graphe : chapitre <em>Graphes</em>). Les deux opérations coûtent \(O(1)\).</p>
  <div class="method-box"><strong>Exemple — l'état d'une pile</strong>
    <div><table>
<tr><th>opération</th><th>valeur renvoyée</th><th><span class="code-inline">t</span> après</th></tr>
<tr><td><span class="code-inline">t.append(4)</span></td><td></td><td><span class="code-inline">[4]</span></td></tr>
<tr><td><span class="code-inline">t.append(7)</span></td><td></td><td><span class="code-inline">[4, 7]</span></td></tr>
<tr><td><span class="code-inline">t.append(1)</span></td><td></td><td><span class="code-inline">[4, 7, 1]</span></td></tr>
<tr><td><span class="code-inline">t.pop()</span></td><td>1</td><td><span class="code-inline">[4, 7]</span></td></tr>
<tr><td><span class="code-inline">t.append(9)</span></td><td></td><td><span class="code-inline">[4, 7, 9]</span></td></tr>
<tr><td><span class="code-inline">t.pop()</span></td><td>9</td><td><span class="code-inline">[4, 7]</span></td></tr>
<tr><td><span class="code-inline">t.pop()</span></td><td>7</td><td><span class="code-inline">[4]</span></td></tr>
</table></div>
    <p>Chaque <span class="code-inline">pop</span> renvoie l'élément ajouté le plus récemment parmi ceux qui restent : 1, puis 9, puis 7.</p>
  </div>

  <h3><span class="code-inline">append</span> ou <span class="code-inline">+</span> ?</h3>
  <pre class="codeblock"><span class="kw">def</span> carres_append(n):
    t = []
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        t.append(k * k)          <span class="cmt"># O(1) : la liste est complétée sur place</span>
    <span class="kw">return</span> t

<span class="kw">def</span> carres_plus(n):
    t = []
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        t = t + [k * k]          <span class="cmt"># O(k) : nouvelle liste, recopiée à chaque tour</span>
    <span class="kw">return</span> t</pre>
  <div class="prop-box"><strong>Modifier ou fabriquer.</strong> <span class="code-inline">t.append(x)</span> <strong>modifie</strong> la liste, en temps constant. <span class="code-inline">t + [x]</span> <strong>fabrique</strong> une nouvelle liste en recopiant les \(k\) éléments de <span class="code-inline">t</span> : coût \(O(k)\). Construire une liste de \(n\) éléments par <span class="code-inline">t = t + [x]</span> coûte \(0 + 1 + \dots + (n - 1) = \tfrac{n(n-1)}{2}\) recopies, soit \(O(n^2)\), contre \(O(n)\) avec <span class="code-inline">append</span>.</div>
  <div class="notice"><strong>Erreur classique</strong> : agrandir une liste par une affectation d'indice, ou affecter le résultat de <span class="code-inline">append</span>.
  <pre class="codeblock">&gt;&gt;&gt; t = [1, 2]
&gt;&gt;&gt; t[2] = 3
Traceback (most recent call last):
  ...
IndexError: list assignment index out of range
&gt;&gt;&gt; t = t.append(3)
&gt;&gt;&gt; print(t)
<span class="kw">None</span></pre>
  <span class="code-inline">t[2] = 3</span> exige que la case 2 existe ; <span class="code-inline">append</span> modifie la liste et renvoie <span class="code-inline">None</span>, que <span class="code-inline">t = …</span> range dans <span class="code-inline">t</span> : la liste est perdue.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RÉFÉRENCES, ALIAS ET COPIES</div>
  <h2>Deux noms pour une même liste</h2>
  <div class="intro">Une variable ne contient pas la liste : elle la <em>désigne</em>. Deux variables peuvent désigner la même liste, et une modification faite par l'une se voit par l'autre. C'est la source d'erreurs la plus fréquente avec les listes, et la clé pour comprendre ce qu'une fonction modifie.</div>
  <div class="def-box">Une affectation <span class="code-inline">u = t</span> ne copie rien : elle donne un second nom, un <strong>alias</strong>, à l'objet que désigne <span class="code-inline">t</span>. Pour obtenir une liste indépendante de même contenu, on la <strong>copie</strong> : <span class="code-inline">t.copy()</span>, ou la tranche complète <span class="code-inline">t[:]</span>.</div>
  <pre class="codeblock">&gt;&gt;&gt; t = [1, 2, 3]
&gt;&gt;&gt; u = t              <span class="cmt"># alias : un second nom pour la même liste</span>
&gt;&gt;&gt; v = t.copy()       <span class="cmt"># nouvelle liste, mêmes éléments</span>
&gt;&gt;&gt; w = t[:]           <span class="cmt"># idem, par la tranche complète</span>
&gt;&gt;&gt; u[0] = 99
&gt;&gt;&gt; t, u, v, w
([99, 2, 3], [99, 2, 3], [1, 2, 3], [1, 2, 3])</pre>

  <div class="prop-box"><strong>Modifier l'objet ou réaffecter le nom.</strong> <span class="code-inline">u[i] = …</span>, <span class="code-inline">u.append(…)</span>, <span class="code-inline">u.pop()</span> <strong>modifient</strong> la liste désignée par <span class="code-inline">u</span> : tous ses noms voient le changement. <span class="code-inline">u = …</span> <strong>réaffecte</strong> le nom <span class="code-inline">u</span> à un autre objet, sans toucher à l'ancien. Pour un nombre, une chaîne ou un tuple, la question ne se pose pas : ils sont immuables, seule la réaffectation existe.</div>
  <pre class="codeblock">&gt;&gt;&gt; t = [1, 2]
&gt;&gt;&gt; u = t
&gt;&gt;&gt; u = u + [3]        <span class="cmt"># nouvelle liste donnée au nom u : t n'est pas touchée</span>
&gt;&gt;&gt; t, u
([1, 2], [1, 2, 3])
&gt;&gt;&gt; u = t
&gt;&gt;&gt; u.append(3)        <span class="cmt"># modification de la liste commune</span>
&gt;&gt;&gt; t, u
([1, 2, 3], [1, 2, 3])</pre>
  <p>C'est exactement ce qui se passe quand une liste est passée à une fonction : le paramètre devient un alias de la liste de l'appelant (chapitre <em>Fonctions</em>, §6).</p>

  <h3>Copie superficielle</h3>
  <p><span class="code-inline">t.copy()</span> et <span class="code-inline">t[:]</span> copient un seul niveau : la nouvelle liste contient les <em>mêmes</em> éléments. Si ces éléments sont eux-mêmes des listes, elles restent partagées.</p>
  <pre class="codeblock">&gt;&gt;&gt; m = [[1, 2], [3, 4]]
&gt;&gt;&gt; c = m.copy()       <span class="cmt"># nouvelle liste extérieure, MÊMES lignes</span>
&gt;&gt;&gt; c[0][0] = 99       <span class="cmt"># modifie une ligne partagée</span>
&gt;&gt;&gt; c[1] = [7, 7]      <span class="cmt"># remplace une case de c seulement</span>
&gt;&gt;&gt; m
[[99, 2], [3, 4]]
&gt;&gt;&gt; c
[[99, 2], [7, 7]]</pre>

  <p>Pour copier une liste de listes, on copie chaque ligne :</p>
  <pre class="codeblock"><span class="kw">def</span> copie_matrice(m):
    <span class="str">"""Copie de la liste de listes m : nouvelles lignes, mêmes valeurs."""</span>
    <span class="kw">return</span> [ligne.copy() <span class="kw">for</span> ligne <span class="kw">in</span> m]</pre>
  <div class="method-box"><strong>Exemple — prédire un affichage</strong>
    <pre class="codeblock">a = [[0, 1], [2, 3]]
b = a
c = a.copy()
d = copie_matrice(a)
b[0][0] = 9
c[1] = [7, 7]
c[0][1] = 8
print(a, c, d)</pre>
    <ol>
      <li><span class="code-inline">b</span> est un alias de <span class="code-inline">a</span> ; <span class="code-inline">c</span> est une nouvelle liste extérieure qui partage les deux lignes de <span class="code-inline">a</span> ; <span class="code-inline">d</span> a ses propres lignes.</li>
      <li><span class="code-inline">b[0][0] = 9</span> modifie la première ligne de <span class="code-inline">a</span>, que <span class="code-inline">c</span> partage : <span class="code-inline">a</span> et <span class="code-inline">c</span> commencent par <span class="code-inline">[9, 1]</span>.</li>
      <li><span class="code-inline">c[1] = [7, 7]</span> remplace une case de <span class="code-inline">c</span> seulement : <span class="code-inline">a[1]</span> reste <span class="code-inline">[2, 3]</span>.</li>
      <li><span class="code-inline">c[0][1] = 8</span> modifie encore la ligne partagée. Affichage : <span class="code-inline">[[9, 8], [2, 3]] [[9, 8], [7, 7]] [[0, 1], [2, 3]]</span> ; seule <span class="code-inline">d</span> est restée intacte.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que <span class="code-inline">u = t</span> sauvegarde l'état de <span class="code-inline">t</span> avant de le modifier. Pour garder une version de départ, on copie ; pour une liste de listes, on copie chaque ligne.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TABLEAUX À DEUX DIMENSIONS</div>
  <h2>Des listes de listes</h2>
  <div class="intro">Une grille de jeu, une matrice, une image, un tableau de mesures (une ligne par essai) : on les représente par une liste de lignes, chaque ligne étant une liste. Le chapitre <em>Images : matrices de pixels</em> en fait un usage intensif.</div>
  <div class="def-box">Un <strong>tableau</strong> de \(n\) lignes et \(p\) colonnes est une liste <span class="code-inline">m</span> de \(n\) listes de longueur \(p\) : <span class="code-inline">m[i]</span> est la ligne \(i\), <span class="code-inline">m[i][j]</span> la case de la ligne \(i\) et de la colonne \(j\). Ses dimensions sont <span class="code-inline">len(m)</span> et <span class="code-inline">len(m[0])</span> (tableau non vide).</div>
  <pre class="codeblock"><span class="kw">def</span> matrice_nulle(n, p):
    <span class="str">"""Tableau de n lignes et p colonnes rempli de 0 (lignes distinctes)."""</span>
    <span class="kw">return</span> [[0] * p <span class="kw">for</span> i <span class="kw">in</span> range(n)]</pre>
  <div class="notice"><strong>Erreur classique</strong> : créer le tableau par <span class="code-inline">[[0] * p] * n</span>.
  <pre class="codeblock">&gt;&gt;&gt; bon = matrice_nulle(3, 3)
&gt;&gt;&gt; mauvais = [[0] * 3] * 3
&gt;&gt;&gt; bon[0][1] = 5
&gt;&gt;&gt; mauvais[0][1] = 5
&gt;&gt;&gt; bon
[[0, 5, 0], [0, 0, 0], [0, 0, 0]]
&gt;&gt;&gt; mauvais
[[0, 5, 0], [0, 5, 0], [0, 5, 0]]</pre>
  L'opérateur <span class="code-inline">*</span> répète la <em>référence</em> de la ligne <span class="code-inline">[0] * 3</span> : les trois cases de la liste extérieure désignent la même ligne. La compréhension, elle, évalue <span class="code-inline">[0] * p</span> à chaque tour et crée \(n\) lignes distinctes. (<span class="code-inline">[0] * p</span> ne pose pas ce problème : on ne modifie jamais un entier, on remplace la case.) Même piège avec <span class="code-inline">[[]] * n</span>.</div>

  <h3>Parcourir un tableau</h3>
  <p>Deux boucles imbriquées : sur les lignes, puis sur les colonnes. Le coût est proportionnel au nombre de cases, \(O(n\,p)\).</p>
  <pre class="codeblock"><span class="kw">def</span> position_max(m):
    <span class="str">"""Couple (i, j) d'une case de valeur maximale du tableau non vide m."""</span>
    imax, jmax = 0, 0
    <span class="kw">for</span> i <span class="kw">in</span> range(len(m)):
        <span class="kw">for</span> j <span class="kw">in</span> range(len(m[i])):
            <span class="kw">if</span> m[i][j] &gt; m[imax][jmax]:
                imax, jmax = i, j
    <span class="kw">return</span> imax, jmax</pre>
  <div class="method-box"><strong>Exemple — transposer</strong>
    <p>La transposée d'un tableau \(n \times p\) est le tableau \(p \times n\) dont la case \((j, i)\) vaut la case \((i, j)\) du tableau de départ.</p>
    <pre class="codeblock"><span class="kw">def</span> transposee(m):
    <span class="str">"""Transposée du tableau rectangulaire m (n lignes, p colonnes) : p lignes, n colonnes."""</span>
    n, p = len(m), len(m[0])
    tr = matrice_nulle(p, n)
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(p):
            tr[j][i] = m[i][j]
    <span class="kw">return</span> tr</pre>
    <ol>
      <li>On crée d'abord un tableau de zéros aux bonnes dimensions (\(p\) lignes de \(n\) cases), avec des lignes distinctes.</li>
      <li>Pour <span class="code-inline">m = [[1, 2, 3], [4, 5, 6]]</span> (\(n = 2\), \(p = 3\)), la case <span class="code-inline">m[0][2] = 3</span> va en <span class="code-inline">tr[2][0]</span>, etc. : résultat <span class="code-inline">[[1, 4], [2, 5], [3, 6]]</span>.</li>
      <li>Chaque case est copiée une fois : coût \(O(n\,p)\) en temps, et autant de place pour le résultat.</li>
    </ol>
    <p>Version plus compacte, où la compréhension intérieure fabrique une ligne du résultat :</p>
    <pre class="codeblock"><span class="kw">def</span> transposee(m):
    <span class="str">"""Même résultat, par compréhensions imbriquées."""</span>
    n, p = len(m), len(m[0])
    <span class="kw">return</span> [[m[i][j] <span class="kw">for</span> i <span class="kw">in</span> range(n)] <span class="kw">for</span> j <span class="kw">in</span> range(p)]</pre>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DICTIONNAIRES</div>
  <h2>Accéder à une valeur par une clé</h2>
  <div class="intro">Une liste range ses valeurs aux indices 0, 1, 2… Un dictionnaire les range à des <strong>clés</strong> choisies librement : un symbole chimique, un nom, un couple de coordonnées. On s'en sert au programme « en boîte noire » : on connaît ses opérations et leur coût, pas encore sa construction interne.</div>
  <div class="def-box">Un <strong>dictionnaire</strong> (type <span class="code-inline">dict</span>) est un ensemble de couples <strong>clé : valeur</strong>, les clés étant deux à deux distinctes. On le crée par <span class="code-inline">{c1: v1, …, cn: vn}</span> (<span class="code-inline">{}</span> pour le dictionnaire vide) ; <span class="code-inline">d[c]</span> est la valeur associée à <span class="code-inline">c</span> ; <span class="code-inline">d[c] = v</span> ajoute la clé <span class="code-inline">c</span> si elle est nouvelle, ou remplace sa valeur ; <span class="code-inline">c in d</span> teste la présence de la <em>clé</em> <span class="code-inline">c</span> ; <span class="code-inline">len(d)</span> est le nombre de clés ; <span class="code-inline">d.copy()</span> est une copie (superficielle).</div>
  <pre class="codeblock">&gt;&gt;&gt; M = {<span class="str">"H"</span>: 1.0, <span class="str">"C"</span>: 12.0, <span class="str">"O"</span>: 16.0}    <span class="cmt"># masses molaires en g/mol</span>
&gt;&gt;&gt; M[<span class="str">"O"</span>]
16.0
&gt;&gt;&gt; M[<span class="str">"N"</span>] = 14.0          <span class="cmt"># clé nouvelle : insertion</span>
&gt;&gt;&gt; M[<span class="str">"C"</span>] = 12.01         <span class="cmt"># clé présente : modification</span>
&gt;&gt;&gt; <span class="str">"N"</span> <span class="kw">in</span> M, <span class="str">"Fe"</span> <span class="kw">in</span> M
(<span class="kw">True</span>, <span class="kw">False</span>)
&gt;&gt;&gt; len(M)
4
&gt;&gt;&gt; M[<span class="str">"Fe"</span>]
Traceback (most recent call last):
  ...
KeyError: <span class="str">'Fe'</span></pre>
  <p>On parcourt les clés par <span class="code-inline">for c in d.keys():</span>, les couples par <span class="code-inline">for c, v in d.items():</span> (Python les parcourt dans l'ordre de première insertion) :</p>
  <pre class="codeblock">M = {<span class="str">"H"</span>: 1.0, <span class="str">"C"</span>: 12.0, <span class="str">"O"</span>: 16.0, <span class="str">"N"</span>: 14.0}

<span class="kw">for</span> s <span class="kw">in</span> M.keys():           <span class="cmt"># les clés : H, C, O, N</span>
    print(s)

<span class="kw">for</span> s, m <span class="kw">in</span> M.items():       <span class="cmt"># les couples (clé, valeur)</span>
    print(s, m)

<span class="kw">def</span> au_dessus(M, seuil):
    <span class="str">"""Liste des clés de M dont la valeur dépasse seuil."""</span>
    res = []
    <span class="kw">for</span> s, m <span class="kw">in</span> M.items():
        <span class="kw">if</span> m &gt; seuil:
            res.append(s)
    <span class="kw">return</span> res

au_dessus(M, 10)             <span class="cmt"># ['C', 'O', 'N']</span></pre>
  <div class="prop-box"><strong>Coût des opérations (admis).</strong> <span class="code-inline">d[c]</span>, <span class="code-inline">d[c] = v</span> et <span class="code-inline">c in d</span> coûtent en moyenne un temps constant, quel que soit le nombre de clés ; un parcours complet coûte \(O(k)\) pour \(k\) clés. Le principe (le hachage) et le sens de « en moyenne » sont vus en 2ᵉ année.</div>
  <p>Un dictionnaire sert de table de correspondance. Avec une table des masses molaires, la masse d'une molécule décrite par une liste de couples (symbole, nombre d'atomes) :</p>
  <pre class="codeblock">M = {<span class="str">"H"</span>: 1.0, <span class="str">"C"</span>: 12.0, <span class="str">"N"</span>: 14.0, <span class="str">"O"</span>: 16.0}    <span class="cmt"># g/mol, valeurs arrondies</span>

<span class="kw">def</span> masse_molaire(formule):
    <span class="str">"""formule : liste de couples (symbole, nombre d'atomes), symboles clés de M."""</span>
    s = 0
    <span class="kw">for</span> symbole, nb <span class="kw">in</span> formule:
        s = s + nb * M[symbole]
    <span class="kw">return</span> s

masse_molaire([(<span class="str">"C"</span>, 1), (<span class="str">"O"</span>, 2)])              <span class="cmt"># CO2 : 44.0</span>
masse_molaire([(<span class="str">"C"</span>, 2), (<span class="str">"H"</span>, 6), (<span class="str">"O"</span>, 1)])    <span class="cmt"># éthanol : 46.0</span></pre>

  <div class="method-box"><strong>Exemple — regrouper par clé</strong>
    <p>On range des élèves par groupe de TP : la valeur associée à chaque groupe est la liste de ses élèves, créée à la première rencontre du groupe.</p>
    <pre class="codeblock"><span class="kw">def</span> regrouper(eleves):
    <span class="str">"""eleves : liste de couples (nom, groupe). Renvoie {groupe : liste des noms}."""</span>
    g = {}
    <span class="kw">for</span> nom, groupe <span class="kw">in</span> eleves:
        <span class="kw">if</span> groupe <span class="kw">not</span> <span class="kw">in</span> g:
            g[groupe] = []           <span class="cmt"># première rencontre du groupe</span>
        g[groupe].append(nom)
    <span class="kw">return</span> g</pre>
    <div><table>
<caption>regrouper([("Ada", "B"), ("Blaise", "A"), ("Carl", "B"), ("Dora", "C"), ("Emmy", "A")])</caption>
<tr><th>couple lu</th><th>action</th><th><span class="code-inline">g</span> après le tour</th></tr>
<tr><td><span class="code-inline">('Ada', 'B')</span></td><td>nouveau groupe : liste vide créée</td><td><span class="code-inline">{'B': ['Ada']}</span></td></tr>
<tr><td><span class="code-inline">('Blaise', 'A')</span></td><td>nouveau groupe : liste vide créée</td><td><span class="code-inline">{'B': ['Ada'], 'A': ['Blaise']}</span></td></tr>
<tr><td><span class="code-inline">('Carl', 'B')</span></td><td>groupe déjà présent</td><td><span class="code-inline">{'B': ['Ada', 'Carl'], 'A': ['Blaise']}</span></td></tr>
<tr><td><span class="code-inline">('Dora', 'C')</span></td><td>nouveau groupe : liste vide créée</td><td><span class="code-inline">{'B': ['Ada', 'Carl'], 'A': ['Blaise'], 'C': ['Dora']}</span></td></tr>
<tr><td><span class="code-inline">('Emmy', 'A')</span></td><td>groupe déjà présent</td><td><span class="code-inline">{'B': ['Ada', 'Carl'], 'A': ['Blaise', 'Emmy'], 'C': ['Dora']}</span></td></tr>
</table></div>
    <p>Chaque tour coûte un temps constant en moyenne (un test <span class="code-inline">in</span>, un accès, un <span class="code-inline">append</span>) : le regroupement de \(n\) élèves coûte \(O(n)\). Sans dictionnaire, il faudrait rechercher le groupe dans une liste à chaque tour. Le cas particulier du <strong>comptage</strong> (la valeur est un nombre d'apparitions) est traité dans le chapitre <em>Recherche séquentielle, dictionnaires et dichotomie</em>, §4.</p>
  </div>
  <pre class="codeblock"><span class="kw">def</span> inverser(d):
    <span class="str">"""Dictionnaire {valeur : clé}, pour un dictionnaire d aux valeurs distinctes."""</span>
    inv = {}
    <span class="kw">for</span> c, v <span class="kw">in</span> d.items():
        inv[v] = c
    <span class="kw">return</span> inv</pre>
  <h3>Quelles clés ?</h3>
  <p>Les clés doivent être <strong>immuables</strong> : nombres, chaînes, tuples (de valeurs immuables). Un tuple de coordonnées est une clé courante, par exemple pour une grille dont peu de cases sont occupées. Une liste ne peut pas servir de clé ; la raison, liée au hachage, est vue en 2ᵉ année. Les valeurs, elles, peuvent être de n'importe quel type, listes comprises.</p>
  <pre class="codeblock">&gt;&gt;&gt; grille = {(0, 0): <span class="str">"départ"</span>, (2, 3): <span class="str">"trésor"</span>}
&gt;&gt;&gt; grille[(2, 3)]
<span class="str">'trésor'</span>
&gt;&gt;&gt; (1, 1) <span class="kw">in</span> grille
<span class="kw">False</span>
&gt;&gt;&gt; {[0, 0]: <span class="str">"départ"</span>}
Traceback (most recent call last):
  ...
TypeError: unhashable type: <span class="str">'list'</span></pre>
  <div class="notice"><strong>Erreur classique</strong> : lire <span class="code-inline">d[c]</span> pour une clé absente (<span class="code-inline">KeyError</span>) : on teste <span class="code-inline">c in d</span> d'abord. Autre erreur : croire que <span class="code-inline">v in d</span> cherche parmi les valeurs ; il ne regarde que les clés.</div>
  <div class="notice"><strong>Erreur classique</strong> : ajouter des clés à un dictionnaire pendant qu'on le parcourt.
  <pre class="codeblock">&gt;&gt;&gt; stock = {<span class="str">"vis"</span>: 0, <span class="str">"écrou"</span>: 4}
&gt;&gt;&gt; <span class="kw">for</span> k <span class="kw">in</span> stock.keys():
...     <span class="kw">if</span> stock[k] == 0:
...         stock[k + <span class="str">" (à commander)"</span>] = 50
...
Traceback (most recent call last):
  ...
RuntimeError: dictionary changed size during iteration</pre>
  On parcourt plutôt une copie (<span class="code-inline">stock.copy().keys()</span>), ou l'on range les ajouts dans un autre dictionnaire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CHOISIR SA STRUCTURE ET CONNAÎTRE LES COÛTS</div>
  <h2>Liste, tuple, chaîne ou dictionnaire ?</h2>
  <div class="intro">Le programme demande un « choix éclairé » des collections. Il se fait sur deux critères : ce que représentent les données (une suite ordonnée, un enregistrement fixe, une table de correspondance) et le coût des opérations dont l'algorithme a besoin.</div>
  <div><table>
    <tr><th>type</th><th>écriture</th><th>modifiable</th><th>accès</th><th>usage typique</th></tr>
    <tr><td>chaîne</td><td><span class="code-inline">"ATGC"</span></td><td>non</td><td>par indice</td><td>texte, code, mot</td></tr>
    <tr><td>tuple</td><td><span class="code-inline">(3, 4)</span></td><td>non</td><td>par indice, dépaquetage</td><td>enregistrement fixe, résultat multiple, clé composée</td></tr>
    <tr><td>liste</td><td><span class="code-inline">[3, 4]</span></td><td>oui</td><td>par indice</td><td>suite ordonnée, tableau, pile</td></tr>
    <tr><td>dictionnaire</td><td><span class="code-inline">{"H": 1.0}</span></td><td>oui</td><td>par clé</td><td>table de correspondance, comptage, regroupement</td></tr>
  </table></div>
  <p>Coûts dans le pire cas, \(n\) = <span class="code-inline">len(t)</span> (le tableau complet, avec sa justification, est dans <em>Spécification, correction et complexité</em>, §6) :</p>
  <div><table>
    <tr><th>opération</th><th>coût</th></tr>
    <tr><td><span class="code-inline">len(t)</span>, <span class="code-inline">t[i]</span>, <span class="code-inline">t[i] = x</span>, <span class="code-inline">t.append(x)</span>, <span class="code-inline">t.pop()</span></td><td>\(O(1)\)</td></tr>
    <tr><td>tranche <span class="code-inline">t[a:b]</span></td><td>\(O(b - a)\) : c'est une copie</td></tr>
    <tr><td><span class="code-inline">t + u</span>, avec \(m\) = <span class="code-inline">len(u)</span></td><td>\(O(n + m)\) : nouvelle liste</td></tr>
    <tr><td><span class="code-inline">t.copy()</span>, <span class="code-inline">[0] * n</span>, parcours complet</td><td>\(O(n)\)</td></tr>
    <tr><td>recherche d'une valeur dans une liste</td><td>\(O(n)\) (recherche séquentielle)</td></tr>
    <tr><td><span class="code-inline">d[c]</span>, <span class="code-inline">d[c] = v</span>, <span class="code-inline">c in d</span></td><td>\(O(1)\) en moyenne</td></tr>
  </table></div>
  <div class="method-box"><strong>Exemple — les éléments communs à deux listes</strong>
    <p>On veut les éléments de <span class="code-inline">t</span> (longueur \(n\)) qui figurent aussi dans <span class="code-inline">u</span> (longueur \(m\)).</p>
    <pre class="codeblock"><span class="kw">def</span> communs_naif(t, u):
    <span class="str">"""Liste des éléments de t (dans l'ordre de t) qui figurent aussi dans u."""</span>
    res = []
    <span class="kw">for</span> x <span class="kw">in</span> t:
        trouve = <span class="kw">False</span>
        <span class="kw">for</span> y <span class="kw">in</span> u:                  <span class="cmt"># recherche séquentielle : O(m)</span>
            <span class="kw">if</span> y == x:
                trouve = <span class="kw">True</span>
        <span class="kw">if</span> trouve:
            res.append(x)
    <span class="kw">return</span> res

<span class="kw">def</span> communs(t, u):
    <span class="str">"""Même spécification, à l'aide d'un dictionnaire des éléments de u."""</span>
    dans_u = {}
    <span class="kw">for</span> y <span class="kw">in</span> u:                      <span class="cmt"># O(m)</span>
        dans_u[y] = <span class="kw">True</span>
    res = []
    <span class="kw">for</span> x <span class="kw">in</span> t:                      <span class="cmt"># O(n), chaque test en O(1) en moyenne</span>
        <span class="kw">if</span> x <span class="kw">in</span> dans_u:
            res.append(x)
    <span class="kw">return</span> res</pre>
    <ol>
      <li>Version naïve : pour chacun des \(n\) éléments de <span class="code-inline">t</span>, on parcourt les \(m\) éléments de <span class="code-inline">u</span> : \(n\,m\) comparaisons, coût \(O(n\,m)\), quadratique si les deux listes ont la même taille.</li>
      <li>Version avec dictionnaire : on range une fois les éléments de <span class="code-inline">u</span> comme clés (\(O(m)\)), puis chaque test <span class="code-inline">x in dans_u</span> coûte \(O(1)\) en moyenne : coût \(O(n + m)\) en moyenne. Pour deux listes de \(10^5\) éléments : \(10^{10}\) comparaisons contre quelques centaines de milliers d'opérations.</li>
      <li>Le dictionnaire ne sert ici que d'ensemble de clés : la valeur <span class="code-inline">True</span> n'a pas d'importance.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : choisir une liste de couples <span class="code-inline">[("H", 1.0), ("C", 12.0), …]</span> pour une table qu'on interroge souvent par clé : chaque recherche est séquentielle. Un dictionnaire fait la même chose en temps constant en moyenne.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS DE L'ANNEXE</div>
  <h2>Ce que Python permet, que le programme n'exige pas</h2>
  <div class="intro">L'annexe du programme liste limitativement les opérations exigibles. Celles qui suivent existent et se rencontrent souvent ; un sujet qui en utilise une en rappelle la documentation. Toutes se réécrivent avec les outils de l'annexe.</div>
  <pre class="codeblock">&gt;&gt;&gt; t = [3, 1, 4, 1, 5]
&gt;&gt;&gt; t[-1], t[::-1], 4 <span class="kw">in</span> t
(5, [5, 1, 4, 1, 3], <span class="kw">True</span>)
&gt;&gt;&gt; sorted(t), t.index(4), t.count(1)
([1, 1, 3, 4, 5], 2, 2)
&gt;&gt;&gt; [x <span class="kw">for</span> x <span class="kw">in</span> t <span class="kw">if</span> x &gt; 2]
[3, 4, 5]</pre>
  <ul>
    <li><strong>Indices négatifs</strong> : <span class="code-inline">t[-1]</span> est le dernier élément, <span class="code-inline">t[-k]</span> le \(k\)-ième en partant de la fin. Équivalent dans l'annexe : <span class="code-inline">t[len(t) - k]</span>.</li>
    <li><strong>Tranches avec un pas</strong> : <span class="code-inline">t[a:b:p]</span> ; <span class="code-inline">t[::-1]</span> est la liste renversée.</li>
    <li><strong>Test <span class="code-inline">x in t</span></strong> sur une liste ou une chaîne : une recherche séquentielle cachée, de coût \(O(n)\).</li>
    <li><strong>Méthodes des listes</strong> : <span class="code-inline">t.sort()</span> et <span class="code-inline">sorted(t)</span> (tri, chapitre <em>Algorithmes de tri</em>), <span class="code-inline">t.index(x)</span>, <span class="code-inline">t.count(x)</span>, <span class="code-inline">t.insert(i, x)</span>, <span class="code-inline">t.remove(x)</span>, <span class="code-inline">t.pop(i)</span> (coût \(O(n)\) : les éléments suivants sont décalés), <span class="code-inline">del t[i]</span>, et les fonctions <span class="code-inline">min</span>, <span class="code-inline">max</span>, <span class="code-inline">sum</span>.</li>
    <li><strong>Compréhension avec condition</strong> : <span class="code-inline">[x for x in t if x &gt; 2]</span> ; équivalent dans l'annexe : une boucle avec <span class="code-inline">append</span> (§4).</li>
    <li><strong>Méthodes des chaînes</strong> : <span class="code-inline">upper</span>, <span class="code-inline">replace</span>, <span class="code-inline">join</span>… (<span class="code-inline">split</span>, lui, figure dans l'annexe pour la lecture des fichiers : chapitre <em>Modules, fichiers et statistiques</em>).</li>
    <li><strong>Dictionnaires</strong> : <span class="code-inline">d.get(c, defaut)</span>, <span class="code-inline">d.values()</span>, <span class="code-inline">del d[c]</span> ; <strong>ensembles</strong> <span class="code-inline">set</span> ; copie profonde <span class="code-inline">copy.deepcopy</span>.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="typc-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · TYPES CONSTRUITS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Choisir la bonne structure, lire juste un indice ou une tranche, construire et copier une liste sans piège, se servir d'un dictionnaire : ces gestes reviennent dans chaque programme et dans chaque sujet de concours.</div>

  <div class="method-box"><strong>Méthode 1 — Choisir la structure de données</strong>
    <ol>
      <li>Des valeurs rangées dans un ordre, en nombre variable, qu'on parcourt ou qu'on modifie : une <strong>liste</strong>.</li>
      <li>Quelques valeurs fixes qui vont ensemble (point, horaire, couple nom-note), ou plusieurs résultats d'une fonction : un <strong>tuple</strong>.</li>
      <li>Du texte : une <strong>chaîne</strong>.</li>
      <li>Des valeurs qu'on retrouve par un nom, un symbole, des coordonnées, ou qu'on compte : un <strong>dictionnaire</strong>.</li>
      <li>Vérifier le coût des opérations dont l'algorithme a besoin (méthode 9).</li>
    </ol>
    <p><em>Exemple éclair :</em> un relevé de notes qu'on parcourt dans l'ordre : liste de couples <span class="code-inline">[("Ada", 14), …]</span> ; la note d'un élève qu'on interroge souvent par son nom : dictionnaire <span class="code-inline">{"Ada": 14, …}</span>.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Lire une expression d'indices et de tranches</strong>
    <ol>
      <li>Les indices valides vont de 0 à <span class="code-inline">len(s) - 1</span> ; le dernier élément est <span class="code-inline">s[len(s) - 1]</span>.</li>
      <li><span class="code-inline">s[a:b]</span> contient les indices \(a\) à \(b - 1\), soit \(b - a\) éléments ; vide si \(a \ge b\).</li>
      <li>Placer les bornes <em>entre</em> les cases (cours, §1) ; vérifier sur un petit exemple écrit à la main.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">&gt;&gt;&gt; s = <span class="str">"INFORMATIQUE"</span>
&gt;&gt;&gt; s[2:6], len(s[2:6]), s[:2] + s[2:] == s
(<span class="str">'FORM'</span>, 4, <span class="kw">True</span>)</pre>
  </div>

  <div class="method-box"><strong>Méthode 3 — Construire une liste</strong>
    <ol>
      <li>Une même valeur immuable répétée : <span class="code-inline">[0] * n</span>.</li>
      <li>Chaque élément se calcule à partir d'un indice ou d'un élément d'une autre séquence : compréhension <span class="code-inline">[e for x in s]</span>.</li>
      <li>On ne garde que certains éléments, ou la longueur n'est pas connue d'avance : liste vide, puis <span class="code-inline">append</span> dans une boucle.</li>
      <li>Jamais <span class="code-inline">t = t + [x]</span> dans une boucle (coût quadratique), jamais <span class="code-inline">t = t.append(x)</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> les cinq premiers impairs par compréhension ; les multiples de 5 de <span class="code-inline">[3, 10, 4, 15, 7]</span>, soit <span class="code-inline">[10, 15]</span>, par <span class="code-inline">append</span>.</p>
    <pre class="codeblock">impairs = [2 * k + 1 <span class="kw">for</span> k <span class="kw">in</span> range(5)]      <span class="cmt"># [1, 3, 5, 7, 9]</span>
cases = [0] * 10                             <span class="cmt"># dix cases à 0</span>

<span class="kw">def</span> multiples(t, k):
    <span class="str">"""Éléments de t multiples de k (k &gt; 0) : longueur inconnue d'avance."""</span>
    res = []
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x % k == 0:
            res.append(x)
    <span class="kw">return</span> res</pre>
  </div>

  <div class="method-box"><strong>Méthode 4 — Parcourir : par élément, par indice, par couple</strong>
    <ol>
      <li>Seule la valeur compte : <span class="code-inline">for x in t</span>.</li>
      <li>La position compte, on modifie <span class="code-inline">t[i]</span>, ou l'on compare des voisins : <span class="code-inline">for i in range(len(t))</span> (ou <span class="code-inline">range(len(t) - 1)</span> pour <span class="code-inline">t[i]</span> et <span class="code-inline">t[i + 1]</span>).</li>
      <li>Une liste de couples : <span class="code-inline">for nom, note in releve</span> (dépaquetage) ; un dictionnaire : <span class="code-inline">for c, v in d.items()</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> les écarts entre voisins de <span class="code-inline">[3, 7, 12, 10]</span> sont <span class="code-inline">[4, 5, -2]</span> ; la boucle s'arrête à l'avant-dernier indice pour que <span class="code-inline">t[i + 1]</span> existe.</p>
    <pre class="codeblock"><span class="kw">def</span> ecarts(t):
    <span class="str">"""Liste des différences t[i + 1] - t[i] entre éléments voisins de t."""</span>
    <span class="kw">return</span> [t[i + 1] - t[i] <span class="kw">for</span> i <span class="kw">in</span> range(len(t) - 1)]

ecarts([3, 7, 12, 10])                       <span class="cmt"># [4, 5, -2]</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 5 — Copier sans créer d'alias</strong>
    <ol>
      <li><span class="code-inline">u = t</span> ne copie rien : deux noms, une seule liste.</li>
      <li>Liste de nombres, de chaînes, de tuples : <span class="code-inline">t.copy()</span> ou <span class="code-inline">t[:]</span> suffit.</li>
      <li>Liste de listes : la copie superficielle partage les lignes ; copier chaque ligne, <span class="code-inline">[ligne.copy() for ligne in m]</span>.</li>
      <li>Dictionnaire dont les valeurs sont des listes : même chose, copier chaque valeur.</li>
    </ol>
    <p><em>Exemple éclair :</em> après les copies ci-dessous, modifier <span class="code-inline">c[0][0]</span> ou <span class="code-inline">u[0]</span> ne change ni <span class="code-inline">m</span> ni <span class="code-inline">t</span>.</p>
    <pre class="codeblock">t = [4, 8, 15]
u = t.copy()                         <span class="cmt"># liste simple : un niveau de copie suffit</span>
m = [[1, 2], [3, 4]]
c = [ligne.copy() <span class="kw">for</span> ligne <span class="kw">in</span> m]    <span class="cmt"># liste de listes : copier chaque ligne</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 6 — Créer et parcourir un tableau à deux dimensions</strong>
    <ol>
      <li>Créer par compréhension : <span class="code-inline">[[0] * p for i in range(n)]</span>, jamais <span class="code-inline">[[0] * p] * n</span>.</li>
      <li>Dimensions : \(n\) = <span class="code-inline">len(m)</span> lignes, \(p\) = <span class="code-inline">len(m[0])</span> colonnes ; case <span class="code-inline">m[i][j]</span>, ligne d'abord.</li>
      <li>Deux boucles imbriquées, sur <span class="code-inline">i</span> puis sur <span class="code-inline">j</span> : coût \(O(n\,p)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> les sommes des colonnes de <span class="code-inline">[[1, 2, 3], [4, 5, 6]]</span> sont <span class="code-inline">[5, 7, 9]</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> sommes_colonnes(m):
    <span class="str">"""Liste des sommes des colonnes du tableau rectangulaire non vide m."""</span>
    n, p = len(m), len(m[0])
    s = [0] * p
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(p):
            s[j] = s[j] + m[i][j]
    <span class="kw">return</span> s

sommes_colonnes([[1, 2, 3], [4, 5, 6]])     <span class="cmt"># [5, 7, 9]</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 7 — Utiliser un dictionnaire</strong>
    <ol>
      <li>Avant de lire <span class="code-inline">d[c]</span>, s'assurer que la clé existe : <span class="code-inline">if c in d</span>.</li>
      <li>Pour accumuler (compter, sommer, regrouper) : créer la clé à la première rencontre, puis mettre à jour.</li>
      <li>Parcourir par <span class="code-inline">d.keys()</span> ou <span class="code-inline">d.items()</span> ; ne pas ajouter de clés pendant le parcours.</li>
      <li>Clés immuables (nombres, chaînes, tuples) ; <span class="code-inline">in</span> ne regarde que les clés.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec <span class="code-inline">stock = {"vis": 120}</span>, ajouter 30 vis puis 50 écrous donne <span class="code-inline">{"vis": 150, "écrou": 50}</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> ajouter_stock(stock, piece, n):
    <span class="str">"""Ajoute n unités de piece au dictionnaire stock (effet de bord)."""</span>
    <span class="kw">if</span> piece <span class="kw">in</span> stock:
        stock[piece] = stock[piece] + n
    <span class="kw">else</span>:
        stock[piece] = n             <span class="cmt"># première rencontre : création de la clé</span></pre>
  </div>
  <div class="notice"><strong>Piège</strong> : un dictionnaire n'a pas d'indices. <span class="code-inline">d[0]</span> cherche la <em>clé</em> 0, pas « la première entrée » : <span class="code-inline">KeyError</span> si elle n'existe pas.</div>

  <div class="method-box"><strong>Méthode 8 — Fabriquer une nouvelle chaîne</strong>
    <ol>
      <li>Une chaîne ne se modifie pas : partir de la chaîne vide <span class="code-inline">r = ""</span>.</li>
      <li>Parcourir la chaîne de départ et concaténer à <span class="code-inline">r</span> ce qu'il faut garder ou remplacer.</li>
      <li>Pour changer un seul caractère : tranches et concaténation, <span class="code-inline">s[:i] + "x" + s[i + 1:]</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">sans_espaces("6 022 140")</span> renvoie <span class="code-inline">"6022140"</span>, que <span class="code-inline">int</span> sait convertir.</p>
    <pre class="codeblock"><span class="kw">def</span> sans_espaces(s):
    <span class="str">"""Copie de la chaîne s sans ses espaces."""</span>
    r = <span class="str">""</span>
    <span class="kw">for</span> c <span class="kw">in</span> s:
        <span class="kw">if</span> c != <span class="str">" "</span>:
            r = r + c
    <span class="kw">return</span> r</pre>
  </div>

  <div class="method-box"><strong>Méthode 9 — Évaluer le coût des opérations</strong>
    <ol>
      <li>Coût constant : <span class="code-inline">len</span>, accès et affectation d'une case, <span class="code-inline">append</span>, <span class="code-inline">pop()</span>, et en moyenne <span class="code-inline">d[c]</span>, <span class="code-inline">c in d</span>.</li>
      <li>Coût proportionnel à la longueur concernée : tranche, <span class="code-inline">+</span>, copie, recherche d'une valeur dans une liste.</li>
      <li>Dans une boucle de \(n\) tours, multiplier : une recherche séquentielle par tour donne \(O(n\,m)\), une concaténation <span class="code-inline">t = t + [x]</span> par tour donne \(O(n^2)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> tester l'appartenance de chacun des \(n\) éléments d'une liste à une autre liste de longueur \(m\) coûte \(O(n\,m)\) ; avec un dictionnaire des éléments de la seconde, \(O(n + m)\) en moyenne (cours, §8).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : <span class="code-inline">[[0] * p] * n</span>, <span class="code-inline">u = t</span> et <span class="code-inline">m.copy()</span> pour une liste de listes créent tous des partages cachés. Quand un résultat « bouge tout seul », chercher d'abord un alias.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="typc-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Somme et maximum d'une liste</h3>
  <div class="statement">On n'utilise pas les fonctions <span class="code-inline">sum</span> et <span class="code-inline">max</span> de Python, absentes de l'annexe du programme.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">somme(t)</span>, qui renvoie la somme des éléments d'une liste de nombres.</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">maximum(t)</span>, qui renvoie le plus grand élément d'une liste non vide.</div>
  <div class="q"><strong>Q3.</strong> Que renvoient ces fonctions pour une liste vide ? Quel est leur coût ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> somme(t):
    s = 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        s = s + x
    <span class="kw">return</span> s

<span class="kw">def</span> maximum(t):
    m = t[0]                     <span class="cmt"># t non vide : on part du premier élément</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &gt; m:
            m = x
    <span class="kw">return</span> m</pre>
    <p><strong>Q1, Q2.</strong> Parcours par élément avec un accumulateur. Pour le maximum, on part du premier élément (et non de 0, qui serait faux pour une liste de négatifs) : après chaque tour, <span class="code-inline">m</span> est le maximum des éléments déjà vus.</p>
    <p><strong>Q3.</strong> <span class="code-inline">somme([])</span> vaut 0, la somme vide. <span class="code-inline">maximum([])</span> provoque une erreur <span class="code-inline">IndexError</span> sur <span class="code-inline">t[0]</span> : la précondition « liste non vide » est indispensable (on peut l'imposer par <span class="code-inline">assert len(t) &gt; 0</span>). Chaque fonction fait \(n\) tours de coût constant : coût \(O(n)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Indices, tranches, opérations</h3>
  <div class="statement">On pose <span class="code-inline">s = "OSCILLATEUR"</span>, <span class="code-inline">t = [7, 2, 9, 4, 1, 8]</span> et <span class="code-inline">u = (5, "a", 3.5)</span>.</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Compter les occurrences</h3>
  <div class="statement">On veut connaître le nombre d'apparitions de chaque lettre d'un mot.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">occurrences(mot)</span>, qui renvoie un dictionnaire {lettre : nombre d'apparitions}. Que vaut <span class="code-inline">occurrences("abba")</span> ?</div>
  <div class="q"><strong>Q2.</strong> En déduire <span class="code-inline">plus_frequente(mot)</span>, qui renvoie une lettre la plus fréquente d'un mot non vide. Quel est le coût de ces deux fonctions pour un mot de \(n\) lettres ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> occurrences(mot):
    compte = {}
    <span class="kw">for</span> c <span class="kw">in</span> mot:
        <span class="kw">if</span> c <span class="kw">not</span> <span class="kw">in</span> compte:
            compte[c] = 0
        compte[c] = compte[c] + 1
    <span class="kw">return</span> compte

<span class="kw">def</span> plus_frequente(mot):
    <span class="str">"""Une lettre la plus fréquente du mot non vide."""</span>
    compte = occurrences(mot)
    meilleure = mot[0]
    <span class="kw">for</span> c, n <span class="kw">in</span> compte.items():
        <span class="kw">if</span> n &gt; compte[meilleure]:
            meilleure = c
    <span class="kw">return</span> meilleure</pre>
    <p><strong>Q1.</strong> À la première rencontre d'une lettre, on crée sa clé avec la valeur 0, puis on incrémente. <span class="code-inline">occurrences("abba")</span> vaut <span class="code-inline">{'a': 2, 'b': 2}</span>.</p>
    <p><strong>Q2.</strong> On compte une seule fois, puis on parcourt les couples du dictionnaire. Pour <span class="code-inline">"abracadabra"</span>, la lettre <span class="code-inline">'a'</span> apparaît 5 fois. <span class="code-inline">occurrences</span> fait \(n\) tours de coût constant en moyenne ; le dictionnaire a au plus \(n\) clés : coût total \(O(n)\) en moyenne. Le comptage est étudié en détail dans le chapitre <em>Recherche séquentielle, dictionnaires et dichotomie</em>, §4.</p>
  </div>
</div>

  <div class="statement"><pre class="codeblock">a = [1, 2, 3]
b = a
c = a[:]
b.append(4)
c[0] = 0
d = [a, c]

e[0].append(5)
e[1] = [9]

print(c)
print(d)
print(e)</pre></div>
  <div class="q"><strong>Q1.</strong> Prédire les quatre lignes affichées, en justifiant chaque étape.</div>
  <div class="q"><strong>Q2.</strong> Combien de listes distinctes existent à la fin du programme ?</div>
  <div class="q"><strong>Q3.</strong> Que faudrait-il écrire à la place de <span class="code-inline">e = d.copy()</span> pour que les modifications faites par <span class="code-inline">e</span> n'atteignent jamais <span class="code-inline">a</span> ni <span class="code-inline">c</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong></p>
    <ol>
      <li><span class="code-inline">b</span> est un alias de <span class="code-inline">a</span> ; <span class="code-inline">c</span> est une copie : <span class="code-inline">b.append(4)</span> donne <span class="code-inline">a = [1, 2, 3, 4]</span>, et <span class="code-inline">c[0] = 0</span> donne <span class="code-inline">c = [0, 2, 3]</span> sans toucher à <span class="code-inline">a</span>.</li>
      <li><span class="code-inline">d = [a, c]</span> contient les listes <span class="code-inline">a</span> et <span class="code-inline">c</span> elles-mêmes (pas des copies) ; <span class="code-inline">e = d.copy()</span> est une nouvelle liste qui désigne les mêmes <span class="code-inline">a</span> et <span class="code-inline">c</span>.</li>
      <li><span class="code-inline">e[0].append(5)</span> modifie donc <span class="code-inline">a</span> : <span class="code-inline">[1, 2, 3, 4, 5]</span>, visible aussi par <span class="code-inline">b</span> et <span class="code-inline">d[0]</span>.</li>
      <li><span class="code-inline">e[1] = [9]</span> remplace une case de <span class="code-inline">e</span> seulement : <span class="code-inline">d[1]</span> désigne toujours <span class="code-inline">c</span>.</li>
    </ol>
    <p>Affichage :</p>
<pre class="codeblock">[1, 2, 3, 4, 5]
[0, 2, 3]
[[1, 2, 3, 4, 5], [0, 2, 3]]
[[1, 2, 3, 4, 5], [9]]</pre>
    <p><strong>Q2.</strong> Cinq listes : celle de <span class="code-inline">a</span> (aussi nommée <span class="code-inline">b</span>), <span class="code-inline">c</span>, <span class="code-inline">d</span>, <span class="code-inline">e</span> et <span class="code-inline">[9]</span>.</p>
    <p><strong>Q3.</strong> Copier aussi chaque élément : <span class="code-inline">e = [x.copy() for x in d]</span>. Alors <span class="code-inline">e[0]</span> est une nouvelle liste, et <span class="code-inline">e[0].append(5)</span> laisse <span class="code-inline">a</span> intacte.</p>
