</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Tableaux à deux dimensions</h3>
  <div class="statement">Un tableau est représenté par une liste de lignes, chaque ligne étant une liste de nombres.</div>
  <div class="q"><strong>Q1.</strong> Un élève crée une grille de jeu de 3 × 3 cases vides par <span class="code-inline">g = [[0] * 3] * 3</span>, puis joue <span class="code-inline">g[1][1] = 1</span>. Que vaut <span class="code-inline">g</span> ? Corriger la création.</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">sommes_lignes(m)</span>, qui renvoie la liste des sommes des lignes de <span class="code-inline">m</span>, en s'aidant d'une fonction <span class="code-inline">somme_liste(t)</span>.</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">est_symetrique(m)</span>, qui teste si un tableau carré est égal à sa transposée, sans construire la transposée. Combien de comparaisons fait-elle au pire pour un tableau \(n \times n\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les trois cases de <span class="code-inline">g</span> désignent la même ligne : <span class="code-inline">g</span> vaut <span class="code-inline">[[0, 1, 0], [0, 1, 0], [0, 1, 0]]</span>, un coup joué apparaît trois fois. Création correcte : <span class="code-inline">g = [[0] * 3 for i in range(3)]</span> (cours, §6).</p>
    <pre class="codeblock"><span class="kw">def</span> sommes_lignes(m):
    <span class="str">"""Liste des sommes des lignes de m."""</span>
    <span class="kw">return</span> [somme_liste(ligne) <span class="kw">for</span> ligne <span class="kw">in</span> m]

<span class="kw">def</span> somme_liste(t):
    s = 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        s = s + x
    <span class="kw">return</span> s

<span class="kw">def</span> est_symetrique(m):
    <span class="str">"""True si le tableau carré m est égal à sa transposée."""</span>
    n = len(m)
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):    <span class="cmt"># cases au-dessus de la diagonale</span>
            <span class="kw">if</span> m[i][j] != m[j][i]:
                <span class="kw">return</span> <span class="kw">False</span>
    <span class="kw">return</span> <span class="kw">True</span></pre>
    <p><strong>Q2.</strong> La compréhension applique <span class="code-inline">somme_liste</span> à chaque ligne : pour <span class="code-inline">[[1, 2, 3], [4, 5, 6]]</span>, on obtient <span class="code-inline">[6, 15]</span>. Coût \(O(n\,p)\).</p>
    <p><strong>Q3.</strong> Il suffit de comparer chaque case au-dessus de la diagonale (\(j \gt i\)) à sa symétrique ; la diagonale n'a pas à être testée. Au pire (tableau symétrique), le nombre de comparaisons est
    \((n - 1) + (n - 2) + \dots + 0 = \tfrac{n(n-1)}{2}\), soit \(O(n^2)\) ; on sort au premier écart trouvé.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Compresser une chaîne</h3>
  <div class="statement">Une image en noir et blanc ligne par ligne, ou une séquence de mesures répétées, contient de longues plages de caractères identiques. On la code par la liste des couples (caractère, longueur de la plage) : <span class="code-inline">"aaabccdddd"</span> devient <span class="code-inline">[("a", 3), ("b", 1), ("c", 2), ("d", 4)]</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">compresser(s)</span>. Justifier que la fonction termine.</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">decompresser(plages)</span>, en utilisant la répétition d'une chaîne.</div>
  <div class="q"><strong>Q3.</strong> Quel est le coût de <span class="code-inline">compresser</span> pour une chaîne de longueur \(n\) ? Pour quelles chaînes la représentation compressée est-elle plus longue que la chaîne de départ ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> compresser(s):
    <span class="str">"""Liste des couples (caractère, longueur) des plages de caractères égaux de s."""</span>
    res = []
    i = 0
    <span class="kw">while</span> i &lt; len(s):
        j = i
        <span class="kw">while</span> j &lt; len(s) <span class="kw">and</span> s[j] == s[i]:
            j = j + 1                <span class="cmt"># s[i:j] est une plage de caractères égaux</span>
        res.append((s[i], j - i))
        i = j                        <span class="cmt"># j &gt; i : i augmente strictement</span>
    <span class="kw">return</span> res

<span class="kw">def</span> decompresser(plages):
    <span class="str">"""Chaîne décrite par la liste de couples (caractère, longueur)."""</span>
    s = <span class="str">""</span>
    <span class="kw">for</span> c, n <span class="kw">in</span> plages:
        s = s + c * n                <span class="cmt"># répétition d'une chaîne</span>
    <span class="kw">return</span> s</pre>
    <p><strong>Q1.</strong> La boucle intérieure fait avancer <span class="code-inline">j</span> tant que le caractère est le même que <span class="code-inline">s[i]</span> ; elle s'exécute au moins une fois (<span class="code-inline">s[i] == s[i]</span>), donc \(j \gt i\) en sortie. La quantité <span class="code-inline">len(s) - i</span> est un entier positif ou nul qui diminue strictement à chaque tour de la boucle extérieure : c'est un variant, la fonction termine. Le test <span class="code-inline">j &lt; len(s)</span> est placé avant <span class="code-inline">s[j]</span> : grâce à la paresse de <span class="code-inline">and</span>, on ne lit jamais <span class="code-inline">s[len(s)]</span>.</p>
    <p><strong>Q2.</strong> <span class="code-inline">c * n</span> répète le caractère <span class="code-inline">n</span> fois ; on vérifie que <span class="code-inline">decompresser(compresser(s))</span> redonne <span class="code-inline">s</span>.</p>
    <p><strong>Q3.</strong> Chaque indice de la chaîne est examiné une fois par <span class="code-inline">j</span> (et une fois de plus pour détecter la fin de chaque plage) : coût \(O(n)\). Pour une chaîne sans répétition (<span class="code-inline">"abcd"</span>), on obtient autant de couples que de caractères, chacun plus encombrant qu'un caractère : la compression n'est utile que pour de longues plages.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Une pile pour vérifier un parenthésage</h3>
  <div class="statement">Une expression est bien parenthésée si chaque <span class="code-inline">(</span>, <span class="code-inline">[</span>, <span class="code-inline">{</span> est fermé par le symbole correspondant, dans l'ordre inverse d'ouverture : <span class="code-inline">"f(t[i])"</span> l'est, <span class="code-inline">"([)]"</span> ne l'est pas. Les autres caractères sont ignorés.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">bien_parenthesee(s)</span>, en rangeant les symboles ouvrants dans une liste utilisée comme pile (<span class="code-inline">append</span>, <span class="code-inline">pop</span>) et en utilisant un dictionnaire qui associe à chaque symbole fermant son symbole ouvrant.</div>
  <div class="q"><strong>Q2.</strong> Dérouler la fonction sur <span class="code-inline">"([)]"</span>, puis sur <span class="code-inline">"(()"</span>.</div>
  <div class="q"><strong>Q3.</strong> Quel est son coût ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock">OUVRANTE = {<span class="str">")"</span>: <span class="str">"("</span>, <span class="str">"]"</span>: <span class="str">"["</span>, <span class="str">"}"</span>: <span class="str">"{"</span>}     <span class="cmt"># fermante -&gt; ouvrante associée</span>

<span class="kw">def</span> bien_parenthesee(s):
    <span class="str">"""True si les parenthèses, crochets et accolades de s sont bien appariés."""</span>
    pile = []
    <span class="kw">for</span> c <span class="kw">in</span> s:
        <span class="kw">if</span> c == <span class="str">"("</span> <span class="kw">or</span> c == <span class="str">"["</span> <span class="kw">or</span> c == <span class="str">"{"</span>:
            pile.append(c)                    <span class="cmt"># on attend sa fermante</span>
        <span class="kw">elif</span> c <span class="kw">in</span> OUVRANTE:
            <span class="kw">if</span> len(pile) == 0 <span class="kw">or</span> pile.pop() != OUVRANTE[c]:
                <span class="kw">return</span> <span class="kw">False</span>                  <span class="cmt"># rien à fermer, ou mauvaise paire</span>
    <span class="kw">return</span> len(pile) == 0                     <span class="cmt"># tout ce qui a été ouvert est fermé</span></pre>
    <p><strong>Q1.</strong> Le sommet de la pile est toujours le dernier symbole ouvert et pas encore fermé : c'est lui que doit fermer le prochain symbole fermant. <span class="code-inline">c in OUVRANTE</span> teste si <span class="code-inline">c</span> est une clé, donc un symbole fermant. Dans <span class="code-inline">len(pile) == 0 or pile.pop() != …</span>, la paresse de <span class="code-inline">or</span> évite d'appeler <span class="code-inline">pop</span> sur une pile vide.</p>
    <p><strong>Q2.</strong> <span class="code-inline">"([)]"</span> : on empile <span class="code-inline">(</span>, puis <span class="code-inline">[</span> ; le symbole <span class="code-inline">)</span> dépile <span class="code-inline">[</span>, qui ne lui correspond pas : <span class="code-inline">False</span>. <span class="code-inline">"(()"</span> : on empile <span class="code-inline">(</span> deux fois, <span class="code-inline">)</span> en dépile une ; à la fin, la pile contient encore <span class="code-inline">(</span> : <span class="code-inline">False</span>.</p>
    <p><strong>Q3.</strong> Un tour par caractère, de coût constant (<span class="code-inline">append</span>, <span class="code-inline">pop</span>, accès au dictionnaire) : coût \(O(n)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Recherche dichotomique dans une liste triée</h3>
  <div class="statement">On dispose d'une liste <span class="code-inline">t</span> de nombres <strong>triés par ordre croissant</strong> et l'on cherche un élément <span class="code-inline">x</span>. (L'algorithme et sa preuve sont étudiés dans le chapitre <em>Recherche séquentielle, dictionnaires et dichotomie</em>, §7.)</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">recherche_dicho(t, x)</span>, qui renvoie un indice où se trouve <span class="code-inline">x</span>, ou -1 si <span class="code-inline">x</span> est absent, en maintenant deux bornes <span class="code-inline">g</span> et <span class="code-inline">d</span> qui encadrent la zone de recherche.</div>
  <div class="q"><strong>Q2.</strong> Dérouler la recherche de <span class="code-inline">x = 23</span> dans <span class="code-inline">t = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]</span> : valeurs successives de <span class="code-inline">(g, d, m)</span>.</div>
  <div class="q"><strong>Q3.</strong> Combien de tours fait-on au pire en fonction de \(n\) = <span class="code-inline">len(t)</span> ? Comparer à la recherche séquentielle. Quelle hypothèse est indispensable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> recherche_dicho(t, x):
    <span class="str">"""t triée par ordre croissant : un indice de x dans t, ou -1 si x est absent."""</span>
    g, d = 0, len(t) - 1
    <span class="kw">while</span> g &lt;= d:
        m = (g + d) // 2
        <span class="kw">if</span> t[m] == x:
            <span class="kw">return</span> m
        <span class="kw">elif</span> t[m] &lt; x:
            g = m + 1        <span class="cmt"># x est à droite de m</span>
        <span class="kw">else</span>:
            d = m - 1        <span class="cmt"># x est à gauche de m</span>
    <span class="kw">return</span> -1                <span class="cmt"># absent</span></pre>
    <p><strong>Q2.</strong> \((g, d, m)\) : \((0, 9, 4)\), car \(t[4] = 16 \lt 23\), d'où \(g = 5\) ; \((5, 9, 7)\), car \(t[7] = 56 \gt 23\), d'où \(d = 6\) ; \((5, 6, 5)\), car \(t[5] = 23\) : on renvoie l'indice 5. Trois tours.</p>
    <p><strong>Q3.</strong> Chaque tour divise au moins par deux la taille de la zone de recherche : au plus \(\lfloor \log_2 n \rfloor + 1\) tours, coût \(O(\log n)\). La recherche séquentielle est en \(O(n)\) : pour \(n = 10^6\), une vingtaine de tours contre un million de comparaisons. L'hypothèse indispensable est que la liste soit <strong>triée</strong>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Polynômes : liste ou dictionnaire ?</h3>
  <div class="statement">Un polynôme \(P = a_0 + a_1 X + \dots + a_n X^n\) à coefficients entiers peut être représenté par la liste <span class="code-inline">[a0, a1, …, an]</span> (représentation <strong>dense</strong>), ou par le dictionnaire <span class="code-inline">{k: ak}</span> de ses seuls coefficients non nuls (représentation <strong>creuse</strong>) : \(3X^2 - 1\) s'écrit <span class="code-inline">[-1, 0, 3]</span> ou <span class="code-inline">{2: 3, 0: -1}</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">evaluer(P, x)</span> pour la représentation dense, par le schéma de Horner \(P(x) = a_0 + x\,(a_1 + x\,(a_2 + \dots))\). Combien de multiplications fait-elle ? Calculer <span class="code-inline">evaluer([1, -3, 0, 2], 2)</span>.</div>
  <div class="q"><strong>Q2.</strong> Représenter \(X^{1000} + 1\) dans les deux cas. Combien de cases occupe chaque représentation ?</div>
  <div class="q"><strong>Q3.</strong> Pour la représentation creuse, écrire <span class="code-inline">evaluer_creux(P, x)</span>, <span class="code-inline">somme_creux(P, Q)</span> et <span class="code-inline">produit_creux(P, Q)</span> ; les résultats ne doivent contenir aucun coefficient nul.</div>
  <div class="q"><strong>Q4.</strong> Calculer <span class="code-inline">produit_creux</span> pour \((X^{1000} + 1)(X^{1000} - 1)\). Quel est le coût de <span class="code-inline">produit_creux</span> pour des polynômes à \(k_1\) et \(k_2\) coefficients non nuls ? Comparer au produit en représentation dense, de coût \(O(n_1 n_2)\) pour des degrés \(n_1\) et \(n_2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> evaluer(P, x):
    <span class="str">"""P = [a0, a1, …, an] : valeur de a0 + a1 x + … + an x^n (schéma de Horner)."""</span>
    n = len(P)
    v = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        v = v * x + P[n - 1 - i]     <span class="cmt"># coefficients du plus haut degré au plus bas</span>
    <span class="kw">return</span> v</pre>
    <p><strong>Q1.</strong> On lit les coefficients du plus haut degré au plus bas (indice \(n - 1 - i\), sans <span class="code-inline">range</span> à pas négatif, hors de l'annexe) : une multiplication par coefficient, soit \(n + 1\) pour un polynôme de degré \(n\) (la première, par <span class="code-inline">v = 0</span>, pourrait être évitée). <span class="code-inline">evaluer([1, -3, 0, 2], 2)</span> vaut \(1 - 6 + 0 + 16 = 11\).</p>
    <p><strong>Q2.</strong> Dense : une liste de 1 001 cases, dont 999 zéros. Creuse : <span class="code-inline">{1000: 1, 0: 1}</span>, deux couples.</p>
    <pre class="codeblock"><span class="kw">def</span> evaluer_creux(P, x):
    <span class="str">"""P : dictionnaire {degré : coefficient non nul}."""</span>
    v = 0
    <span class="kw">for</span> k, a <span class="kw">in</span> P.items():
        v = v + a * x ** k
    <span class="kw">return</span> v

<span class="kw">def</span> sans_zeros(P):
    <span class="str">"""Copie de P privée des coefficients nuls."""</span>
    R = {}
    <span class="kw">for</span> k, a <span class="kw">in</span> P.items():
        <span class="kw">if</span> a != 0:
            R[k] = a
    <span class="kw">return</span> R

<span class="kw">def</span> somme_creux(P, Q):
    S = P.copy()
    <span class="kw">for</span> k, b <span class="kw">in</span> Q.items():
        <span class="kw">if</span> k <span class="kw">in</span> S:
            S[k] = S[k] + b
        <span class="kw">else</span>:
            S[k] = b
    <span class="kw">return</span> sans_zeros(S)

<span class="kw">def</span> produit_creux(P, Q):
    R = {}
    <span class="kw">for</span> i, a <span class="kw">in</span> P.items():
        <span class="kw">for</span> j, b <span class="kw">in</span> Q.items():
            <span class="kw">if</span> i + j <span class="kw">in</span> R:
                R[i + j] = R[i + j] + a * b
            <span class="kw">else</span>:
                R[i + j] = a * b
    <span class="kw">return</span> sans_zeros(R)</pre>
    <p><strong>Q3.</strong> Pour la somme, on part d'une copie de <span class="code-inline">P</span> (pour ne pas la modifier) et l'on ajoute les coefficients de <span class="code-inline">Q</span>, en créant les degrés absents ; une compensation peut produire un 0, que <span class="code-inline">sans_zeros</span> retire (<span class="code-inline">del</span> n'est pas dans l'annexe : on reconstruit un dictionnaire). Le produit accumule \(a_i b_j\) au degré \(i + j\).</p>
    <p><strong>Q4.</strong> Les quatre produits donnent \(X^{2000}\), \(-X^{1000}\), \(X^{1000}\) et \(-1\) ; les deux termes de degré 1 000 se compensent : <span class="code-inline">{2000: 1, 0: -1}</span>, c'est-à-dire \(X^{2000} - 1\). <span class="code-inline">produit_creux</span> fait \(k_1 k_2\) tours de coût constant en moyenne, puis un parcours du résultat : \(O(k_1 k_2)\) en moyenne. Ici 4 produits, contre \(1001^2 \approx 10^6\) en représentation dense. La représentation creuse gagne quand il y a peu de coefficients non nuls ; pour un polynôme « plein », la liste est plus simple et plus compacte.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Vélos en libre-service</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique de PT (thème : réseau de vélos en libre-service ; listes, tuples, dictionnaires, copies, coût).</div>
  <div class="statement">Un réseau de vélos en libre-service compte des stations, chacune ayant une capacité (nombre de bornes) et un nombre de vélos présents. L'état du réseau est un dictionnaire qui associe au nom de chaque station la liste <span class="code-inline">[capacité, vélos présents]</span> ; un trajet est un triplet <span class="code-inline">(départ, arrivée, durée en minutes)</span>. Exemple :
  <pre class="codeblock">stations = {<span class="str">"Gare"</span>: [20, 12], <span class="str">"Mairie"</span>: [15, 15], <span class="str">"Campus"</span>: [25, 3],
            <span class="str">"Parc"</span>: [10, 6], <span class="str">"Port"</span>: [12, 0]}     <span class="cmt"># nom -&gt; [capacité, vélos présents]</span>
trajets = [(<span class="str">"Gare"</span>, <span class="str">"Campus"</span>, 14), (<span class="str">"Campus"</span>, <span class="str">"Parc"</span>, 9), (<span class="str">"Mairie"</span>, <span class="str">"Gare"</span>, 11),
           (<span class="str">"Gare"</span>, <span class="str">"Campus"</span>, 16), (<span class="str">"Parc"</span>, <span class="str">"Mairie"</span>, 22)]   <span class="cmt"># (départ, arrivée, durée)</span></pre>
  Seuls les éléments de l'annexe Python du programme sont autorisés. Une question peut utiliser les fonctions des questions précédentes.</div>

  <p class="exo-part">Partie A — Représentation</p>
  <div class="q"><strong>A1.</strong> Pourquoi un trajet est-il représenté par un tuple, et l'état d'une station par une liste ? Que vaut <span class="code-inline">stations["Campus"][1]</span> ? Que se passe-t-il à l'évaluation de <span class="code-inline">stations["Opéra"][0]</span> ?</div>
  <div class="q"><strong>A2.</strong> Écrire <span class="code-inline">taux_remplissage(stations: dict, nom: str) -&gt; float</span>, proportion des bornes occupées à la station <span class="code-inline">nom</span>. Valeur pour Campus ?</div>
  <div class="q"><strong>A3.</strong> Écrire <span class="code-inline">stations_vides(stations: dict) -&gt; list</span>, liste des noms des stations sans vélo.</div>

  <p class="exo-part">Partie B — Statistiques sur les trajets</p>
  <div class="q"><strong>B1.</strong> Écrire <span class="code-inline">duree_moyenne(trajets: list) -&gt; float</span> (liste non vide), en dépaquetant chaque trajet.</div>
  <div class="q"><strong>B2.</strong> Écrire <span class="code-inline">trajet_le_plus_long(trajets: list) -&gt; tuple</span>, qui renvoie le premier trajet de durée maximale.</div>
  <div class="q"><strong>B3.</strong> Écrire <span class="code-inline">nb_departs(trajets: list) -&gt; dict</span>, qui associe à chaque station le nombre de trajets qui en partent (seules les stations d'où part au moins un trajet sont des clés). Donner le résultat pour l'exemple.</div>

  <p class="exo-part">Partie C — Simuler une journée</p>
  <div class="q"><strong>C1.</strong> Écrire <span class="code-inline">appliquer_trajet(stations: dict, trajet: tuple) -&gt; None</span>, qui retire un vélo à la station de départ et en ajoute un à la station d'arrivée, en modifiant <span class="code-inline">stations</span>. Vérifier par des assertions qu'un vélo est disponible au départ et qu'une borne est libre à l'arrivée.</div>
  <div class="q"><strong>C2.</strong> Pour simuler la journée sans modifier <span class="code-inline">stations</span>, un candidat écrit :
  <pre class="codeblock">etat = stations.copy()
appliquer_trajet(etat, trajets[0])
print(stations[<span class="str">"Gare"</span>])                  <span class="cmt"># [20, 11] : stations a changé !</span></pre>
  Expliquer pourquoi <span class="code-inline">stations</span> a quand même changé. Écrire <span class="code-inline">copie_etat(stations: dict) -&gt; dict</span>, qui renvoie une copie indépendante.</div>
  <div class="q"><strong>C3.</strong> Écrire <span class="code-inline">simuler(stations: dict, trajets: list) -&gt; dict</span>, qui renvoie l'état du réseau après tous les trajets, dans l'ordre, sans modifier <span class="code-inline">stations</span>. Donner l'état final pour l'exemple.</div>

  <p class="exo-part">Partie D — Bilan et complexité</p>
  <div class="q"><strong>D1.</strong> Écrire <span class="code-inline">bilan(trajets: list) -&gt; dict</span>, qui associe à chaque station apparaissant dans un trajet la différence (nombre d'arrivées − nombre de départs). Vérifier la cohérence avec C3.</div>
  <div class="q"><strong>D2.</strong> On note \(n\) le nombre de trajets et \(s\) le nombre de stations. Quel est le coût de <span class="code-inline">bilan</span> ? Quel serait-il si l'on rangeait les soldes dans une liste de couples <span class="code-inline">[nom, solde]</span>, parcourue pour retrouver une station ? Conclure sur le choix de la structure.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Un trajet est un enregistrement fixe, qui ne change pas une fois effectué : un tuple convient (et pourrait servir de clé). L'état d'une station évolue (le nombre de vélos change à chaque trajet) : il faut une structure modifiable, une liste. <span class="code-inline">stations["Campus"][1]</span> vaut 3. <span class="code-inline">"Opéra"</span> n'est pas une clé : l'évaluation provoque une erreur <span class="code-inline">KeyError</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> taux_remplissage(stations, nom):
    <span class="str">"""Proportion de places occupées à la station nom."""</span>
    capacite, velos = stations[nom]
    <span class="kw">return</span> velos / capacite

<span class="kw">def</span> stations_vides(stations):
    <span class="str">"""Liste des noms des stations sans aucun vélo."""</span>
    res = []
    <span class="kw">for</span> nom, etat <span class="kw">in</span> stations.items():
        <span class="kw">if</span> etat[1] == 0:
            res.append(nom)
    <span class="kw">return</span> res</pre>
    <p><strong>A2, A3.</strong> Le dépaquetage <span class="code-inline">capacite, velos = stations[nom]</span> fonctionne aussi sur une liste de deux éléments. Campus : \(3/25 = 0{,}12\). <span class="code-inline">stations_vides(stations)</span> vaut <span class="code-inline">["Port"]</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> duree_moyenne(trajets):
    <span class="str">"""Durée moyenne des trajets (liste non vide)."""</span>
    s = 0
    <span class="kw">for</span> depart, arrivee, duree <span class="kw">in</span> trajets:
        s = s + duree
    <span class="kw">return</span> s / len(trajets)

<span class="kw">def</span> trajet_le_plus_long(trajets):
    <span class="str">"""Premier trajet de durée maximale (liste non vide)."""</span>
    meilleur = trajets[0]
    <span class="kw">for</span> t <span class="kw">in</span> trajets:
        <span class="kw">if</span> t[2] &gt; meilleur[2]:
            meilleur = t
    <span class="kw">return</span> meilleur

<span class="kw">def</span> nb_departs(trajets):
    <span class="str">"""Dictionnaire {station : nombre de trajets qui en partent}."""</span>
    d = {}
    <span class="kw">for</span> depart, arrivee, duree <span class="kw">in</span> trajets:
        <span class="kw">if</span> depart <span class="kw">in</span> d:
            d[depart] = d[depart] + 1
        <span class="kw">else</span>:
            d[depart] = 1
    <span class="kw">return</span> d</pre>
    <p><strong>B1.</strong> \((14 + 9 + 11 + 16 + 22)/5 = 72/5 = 14{,}4\) minutes. <strong>B2.</strong> <span class="code-inline">("Parc", "Mairie", 22)</span>. <strong>B3.</strong> <span class="code-inline">{"Gare": 2, "Campus": 1, "Mairie": 1, "Parc": 1}</span> : comptage avec un dictionnaire, coût \(O(n)\) en moyenne.</p>
    <pre class="codeblock"><span class="kw">def</span> appliquer_trajet(stations, trajet):
    <span class="str">"""Déplace un vélo du départ à l'arrivée du trajet : modifie stations."""</span>
    depart, arrivee, duree = trajet
    <span class="kw">assert</span> stations[depart][1] &gt; 0                        <span class="cmt"># un vélo à prendre</span>
    <span class="kw">assert</span> stations[arrivee][1] &lt; stations[arrivee][0]    <span class="cmt"># une place libre</span>
    stations[depart][1] = stations[depart][1] - 1
    stations[arrivee][1] = stations[arrivee][1] + 1

<span class="kw">def</span> copie_etat(stations):
    <span class="str">"""Copie indépendante : un nouveau dictionnaire ET de nouvelles listes."""</span>
    c = {}
    <span class="kw">for</span> nom, etat <span class="kw">in</span> stations.items():
        c[nom] = etat.copy()
    <span class="kw">return</span> c

<span class="kw">def</span> simuler(stations, trajets):
    <span class="str">"""État des stations après tous les trajets ; stations n'est pas modifié."""</span>
    etat = copie_etat(stations)
    <span class="kw">for</span> t <span class="kw">in</span> trajets:
        appliquer_trajet(etat, t)
    <span class="kw">return</span> etat</pre>
    <p><strong>C1.</strong> <span class="code-inline">stations[depart]</span> est la liste de la station : modifier sa case 1 modifie l'état du réseau (effet de bord voulu, rien n'est renvoyé).</p>
    <p><strong>C2.</strong> <span class="code-inline">stations.copy()</span> est une copie <strong>superficielle</strong> : un nouveau dictionnaire, mais dont les valeurs sont les <em>mêmes</em> listes <span class="code-inline">[capacité, vélos]</span>. <span class="code-inline">appliquer_trajet</span> modifie ces listes, partagées : <span class="code-inline">stations["Gare"]</span> passe à <span class="code-inline">[20, 11]</span>. <span class="code-inline">copie_etat</span> copie aussi chaque liste.</p>
    <p><strong>C3.</strong> Gare : 12 − 1 + 1 − 1 = 11 ; Campus : 3 + 1 − 1 + 1 = 4 ; Parc : 6 + 1 − 1 = 6 ; Mairie : 15 − 1 + 1 = 15 (le trajet Mairie → Gare libère une borne avant l'arrivée de Parc → Mairie, sinon l'assertion échouerait) ; Port inchangé. Résultat : <span class="code-inline">{"Gare": [20, 11], "Mairie": [15, 15], "Campus": [25, 4], "Parc": [10, 6], "Port": [12, 0]}</span>, et <span class="code-inline">stations</span> n'a pas changé.</p>
    <pre class="codeblock"><span class="kw">def</span> bilan(trajets):
    <span class="str">"""Dictionnaire {station : arrivées - départs} sur la liste des trajets."""</span>
    b = {}
    <span class="kw">for</span> depart, arrivee, duree <span class="kw">in</span> trajets:
        <span class="kw">if</span> depart <span class="kw">not</span> <span class="kw">in</span> b:
            b[depart] = 0
        <span class="kw">if</span> arrivee <span class="kw">not</span> <span class="kw">in</span> b:
            b[arrivee] = 0
        b[depart] = b[depart] - 1
        b[arrivee] = b[arrivee] + 1
    <span class="kw">return</span> b</pre>
    <p><strong>D1.</strong> <span class="code-inline">bilan(trajets)</span> vaut <span class="code-inline">{"Gare": -1, "Campus": 1, "Parc": 0, "Mairie": 0}</span> : c'est bien la variation du nombre de vélos entre l'état initial et l'état final de C3.</p>
    <p><strong>D2.</strong> Chaque trajet coûte un nombre constant d'opérations sur le dictionnaire, en temps constant en moyenne : <span class="code-inline">bilan</span> coûte \(O(n)\) en moyenne. Avec une liste de couples, chaque mise à jour demande une recherche séquentielle parmi au plus \(s\) stations : \(O(n\,s)\). Pour un réseau d'un millier de stations et des centaines de milliers de trajets par jour, le dictionnaire est le bon choix : c'est une table de correspondance interrogée par clé.</p>
  </div>
</div>
