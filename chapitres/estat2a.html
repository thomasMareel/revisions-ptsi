<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Symétries, invariances et charge totale</h3>
  <div class="statement">On considère trois distributions :
    <ul style="margin:.4rem 0">
      <li>(a) un disque d'axe \(Oz\), de rayon \(R\), portant la densité surfacique \(\sigma(r)=\sigma_0\,r/R\) (\(r\) : distance à l'axe) ; on s'intéresse aux points \(M\) de l'axe ;</li>
      <li>(b) une boule de centre \(O\), de rayon \(R\), de densité \(\rho(r)=\rho_0\,(1-r^2/R^2)\) ;</li>
      <li>(c) deux fils infinis parallèles à \(Oz\), portant \(+\lambda\) en \((x=a,\,y=0)\) et \(-\lambda\) en \((x=-a,\,y=0)\) ; on s'intéresse aux points \(M\) du plan \(x=0\).</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Pour chaque distribution, déterminer la direction du champ au point \(M\) indiqué et les variables dont il dépend.</div>
  <div class="q"><strong>Q2.</strong> Calculer la charge totale du disque (a) et de la boule (b), ainsi que la charge par unité de longueur de (c).</div>
  <div class="q"><strong>Q3.</strong> Pour laquelle de ces distributions le théorème de Gauss permet-il de calculer le champ en tout point ? Justifier.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) Pour \(M\) sur l'axe, tout plan contenant \(Oz\) est plan de symétrie : \(\vec E(M)\) est porté par leur intersection, l'axe \(Oz\). Sur l'axe, la seule variable est \(z\) : \(\vec E=E_z(z)\,\vec e_z\).</p>
    <p>(b) Tout plan contenant \(O\) et \(M\) est plan de symétrie : \(\vec E\) est radial. Invariance par toute rotation autour de \(O\) : \(\vec E=E_r(r)\,\vec e_r\).</p>
    <p>(c) Le plan \(x=0\) est d'antisymétrie (il échange \(+\lambda\) et \(-\lambda\)) : en \(M\) de ce plan, \(\vec E\) est selon \(\vec e_x\). Le plan \(z=z_M\) est de symétrie (\(E_z=0\)), et l'invariance par translation selon \(Oz\) supprime la variable \(z\) : \(\vec E=E_x(y)\,\vec e_x\) dans ce plan.</p>
    <p><strong>Q2.</strong> (a) Couronne d'aire \(2\pi r\,\mathrm{d}r\) : \(Q=\displaystyle\int_0^R\sigma_0\frac rR\,2\pi r\,\mathrm{d}r=\frac{2\pi\sigma_0R^2}{3}\).</p>
    <div class="formula">$$\text{(b)}\quad Q=\int_0^R\rho_0\Big(1-\frac{r^2}{R^2}\Big)4\pi r^2\,\mathrm{d}r=4\pi\rho_0\Big(\frac{R^3}{3}-\frac{R^3}{5}\Big)=\frac{8\pi\rho_0R^3}{15}$$</div>
    <p>(c) \(\lambda-\lambda=0\) : la distribution est globalement neutre.</p>
    <p><strong>Q3.</strong> Seulement pour (b) : en tout point, \(\vec E\) est radial et de norme fonction de \(r\) seul, donc constant sur une sphère de centre \(O\). Pour le disque, hors de l'axe, le champ a deux composantes dépendant de \((r,z)\) ; pour les deux fils, \(\vec E\) dépend de \((x,y)\) : aucune surface fermée ne permet de sortir \(E\) de l'intégrale de flux. On utiliserait la superposition (pour (c), somme des champs de deux fils obtenus chacun par Gauss).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Quatre charges aux sommets d'un carré : superposition et potentiel</h3>
  <div class="statement">Un carré \(ABCD\) de côté \(a=10\ \text{cm}\), de centre \(O\), est placé dans le plan \(xOy\) : \(A(-a/2,\,a/2)\), \(B(a/2,\,a/2)\), \(C(a/2,\,-a/2)\), \(D(-a/2,\,-a/2)\). Les sommets \(A\) et \(B\) portent la charge \(+q\), les sommets \(C\) et \(D\) la charge \(-q\), avec \(q=1{,}0\ \text{nC}\). On note \(I\) le milieu de \([AB]\) et l'on prend \(\dfrac{1}{4\pi\varepsilon_0}=9{,}0\times10^{9}\ \text{SI}\), \(V(\infty)=0\).</div>
  <div class="q"><strong>Q1.</strong> Identifier les plans de symétrie et d'antisymétrie de la distribution qui passent par \(O\). En déduire la direction de \(\vec E(O)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\vec E(O)\) par superposition. Application numérique.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(V(O)\). Retrouver ce résultat sans calcul.</div>
  <div class="q"><strong>Q4.</strong> Calculer \(V(I)\).</div>
  <div class="q"><strong>Q5.</strong> On déplace lentement une charge \(q'=2{,}0\ \text{nC}\) de \(O\) à \(I\). Quel travail fournit la force électrique ? Quel travail doit fournir l'opérateur ? Le chemin suivi importe-t-il ?</div>
  <div class="q"><strong>Q6.</strong> Un électron est placé en \(O\). Calculer la force qu'il subit et comparer son accélération à celle de la pesanteur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le plan \(x=0\) (médiateur de \([AB]\) et de \([CD]\)) échange \(A\) et \(B\), \(D\) et \(C\), qui portent les mêmes charges : il est plan de <strong>symétrie</strong>, donc \(\vec E(O)\) y est contenu (\(E_x=0\)). Le plan \(y=0\) échange \(A\) et \(D\), \(B\) et \(C\), de charges opposées : il est plan d'<strong>antisymétrie</strong>, donc \(\vec E(O)\) lui est orthogonal. Le plan \(z=0\), qui contient les charges, est de symétrie (\(E_z=0\)). Conclusion : \(\vec E(O)=E_y\,\vec e_y\).</p>
    <p><strong>Q2.</strong> Chaque charge est à la distance \(a/\sqrt2\) de \(O\) et y crée un champ de norme \(\dfrac{q}{4\pi\varepsilon_0(a^2/2)}=\dfrac{2q}{4\pi\varepsilon_0a^2}\), dont la projection sur \(\vec e_y\) vaut cette norme multipliée par \(\cos45°=1/\sqrt2\). Les charges \(+q\) du haut repoussent vers le bas, les charges \(-q\) du bas attirent vers le bas : les quatre projections s'ajoutent.</p>
    <div class="formula">$$\vec E(O)=-4\times\frac{2q}{4\pi\varepsilon_0a^2}\times\frac{1}{\sqrt2}\,\vec e_y=-\frac{4\sqrt2\,q}{4\pi\varepsilon_0a^2}\,\vec e_y\approx-5{,}1\times10^{3}\ \text{V·m}^{-1}\ \vec e_y$$</div>
    <p>Le champ est dirigé des charges positives vers les charges négatives, comme attendu.</p>
    <p><strong>Q3.</strong> \(V(O)=\dfrac{1}{4\pi\varepsilon_0}\,\dfrac{q+q-q-q}{a/\sqrt2}=0\). Sans calcul : avec la référence à l'infini, le plan d'antisymétrie \(y=0\) est l'équipotentielle \(V=0\), et \(O\) en fait partie. Le potentiel est nul en \(O\) alors que le champ ne l'est pas : un potentiel nul ne dit rien du champ, qui dépend de ses <em>variations</em>.</p>
    <p><strong>Q4.</strong> \(I\) est à \(a/2\) de \(A\) et de \(B\), à \(\sqrt{a^2+a^2/4}=a\sqrt5/2\) de \(C\) et de \(D\) :</p>
    <div class="formula">$$V(I)=\frac{1}{4\pi\varepsilon_0}\Big(\frac{2q}{a/2}-\frac{2q}{a\sqrt5/2}\Big)=\frac{4q}{4\pi\varepsilon_0a}\Big(1-\frac{1}{\sqrt5}\Big)\approx2{,}0\times10^{2}\ \text{V}$$</div>
    <p><strong>Q5.</strong> Travail de la force électrique : \(W=q'\big(V(O)-V(I)\big)\), soit, avec \(V(I)\approx199\ \text{V}\), \(W\approx-4{,}0\times10^{-7}\ \text{J}\). Il est résistant : \(q'\gt0\) « remonte » les potentiels en allant vers les charges positives. Pour un déplacement lent (énergie cinétique inchangée), l'opérateur fournit \(+4{,}0\times10^{-7}\ \text{J}\). Le chemin n'importe pas : la force électrostatique est conservative, son travail ne dépend que des potentiels de départ et d'arrivée.</p>
    <p><strong>Q6.</strong> \(\vec F=-e\,\vec E(O)\) : dirigée selon \(+\vec e_y\) (vers les charges positives), de norme \(1{,}6\times10^{-19}\times5{,}1\times10^{3}\approx8{,}2\times10^{-16}\ \text{N}\). Accélération \(F/m_e\approx9\times10^{14}\ \text{m·s}^{-2}\), soit près de \(10^{14}\) fois \(g\) : le poids de l'électron est toujours négligeable devant les forces électriques.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Cylindre infini à densité croissante</h3>
  <div class="statement">Un cylindre infini d'axe \(Oz\) et de rayon \(a\) porte la densité volumique \(\rho(r)=\rho_0\,r/a\) pour \(r\le a\) (\(r\) : distance à l'axe), et rien au-delà. Données : \(a=2{,}0\ \text{cm}\), \(\rho_0=5{,}0\ \mu\text{C·m}^{-3}\), \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la forme du champ électrostatique.</div>
  <div class="q"><strong>Q2.</strong> Par le théorème de Gauss, exprimer \(E_r(r)\) pour \(r\le a\) et pour \(r\ge a\). Vérifier la continuité en \(r=a\) et interpréter le champ extérieur.</div>
  <div class="q"><strong>Q3.</strong> Vérifier le résultat intérieur à l'aide de l'équation de Maxwell-Gauss.</div>
  <div class="q"><strong>Q4.</strong> Exprimer le potentiel \(V(r)\) en prenant \(V(0)=0\). Pourquoi ne peut-on pas choisir \(V(\infty)=0\) ?</div>
  <div class="q"><strong>Q5.</strong> Calculer \(E(a)\) et la différence de potentiel entre l'axe et la surface du cylindre.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les plans contenant \(Oz\) et \(M\), et le plan \(z=z_M\), sont plans de symétrie : \(\vec E\) est radial. Invariances par translation selon \(Oz\) et par rotation autour de \(Oz\) : \(\vec E=E_r(r)\,\vec e_r\) en cylindriques.</p>
    <p><strong>Q2.</strong> Surface de Gauss : cylindre fermé coaxial de rayon \(r\), de hauteur \(h\). Flux nul sur les bases, flux latéral \(2\pi rh\,E_r(r)\). Pour \(r\le a\) :</p>
    <div class="formula">$$Q_{\text{int}}=h\int_0^r\rho_0\frac{r'}{a}\,2\pi r'\,\mathrm{d}r'=\frac{2\pi h\rho_0r^3}{3a}\ \Rightarrow\ E_r=\frac{\rho_0\,r^2}{3\varepsilon_0a}$$</div>
    <p>Pour \(r\ge a\) : \(Q_{\text{int}}=\dfrac{2\pi h\rho_0a^2}{3}\), d'où \(E_r=\dfrac{\rho_0a^2}{3\varepsilon_0r}\). En \(r=a\), les deux valent \(\rho_0a/(3\varepsilon_0)\) : continuité (pas de charge surfacique). Avec la charge linéique \(\lambda=2\pi\rho_0a^2/3\), le champ extérieur s'écrit \(\lambda/(2\pi\varepsilon_0r)\) : c'est celui d'un fil portant toute la charge sur l'axe.</p>
    <p><strong>Q3.</strong> Divergence en cylindriques :</p>
    <div class="formula">$$\frac1r\frac{\mathrm{d}}{\mathrm{d}r}\Big(r\,\frac{\rho_0r^2}{3\varepsilon_0a}\Big)=\frac1r\,\frac{\rho_0r^2}{\varepsilon_0a}=\frac{\rho_0r}{\varepsilon_0a}=\frac{\rho(r)}{\varepsilon_0}$$</div>
    <p>L'équation de Maxwell-Gauss est vérifiée. ✓</p>
    <p><strong>Q4.</strong> \(\mathrm{d}V=-E_r\,\mathrm{d}r\). Intérieur : \(V=-\dfrac{\rho_0r^3}{9\varepsilon_0a}\). Extérieur, par continuité en \(r=a\) :</p>
    <div class="formula">$$V(r\ge a)=-\frac{\rho_0a^2}{9\varepsilon_0}-\frac{\rho_0a^2}{3\varepsilon_0}\ln\frac ra$$</div>
    <p>Le terme logarithmique diverge quand \(r\to\infty\) : la distribution s'étend à l'infini, la référence ne peut pas y être placée.</p>
    <p><strong>Q5.</strong> Au bord du cylindre et entre l'axe et la surface :</p>
    <div class="formula">$$E(a)=\frac{\rho_0a}{3\varepsilon_0}=\frac{5{,}0\times10^{-6}\times0{,}020}{3\times8{,}85\times10^{-12}}\approx3{,}8\times10^{3}\ \text{V·m}^{-1}$$</div>
    <div class="formula">$$V(0)-V(a)=\frac{\rho_0a^2}{9\varepsilon_0}=\frac{5{,}0\times10^{-6}\times4{,}0\times10^{-4}}{9\times8{,}85\times10^{-12}}\approx25\ \text{V}$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Couche plane à profil sinusoïdal : Maxwell-Gauss et Poisson</h3>
  <div class="statement">Une couche infinie occupe la région \(-e/2\le z\le e/2\) et porte la densité \(\rho(z)=\rho_0\cos(\pi z/e)\), avec \(\rho_0\gt 0\). Il n'y a pas de charge ailleurs, ni de charge surfacique.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\vec E=E_z(z)\,\vec e_z\) avec \(E_z\) fonction impaire de \(z\).</div>
  <div class="q"><strong>Q2.</strong> Par l'équation de Maxwell-Gauss, déterminer \(E_z(z)\) dans la couche, puis à l'extérieur.</div>
  <div class="q"><strong>Q3.</strong> Calculer la charge par unité de surface \(\sigma_{\text{tot}}\) de la couche et retrouver le champ extérieur par le théorème de Gauss.</div>
  <div class="q"><strong>Q4.</strong> En prenant \(V(0)=0\), déterminer \(V(z)\) dans la couche (vérifier l'équation de Poisson) puis pour \(z\ge e/2\).</div>
  <div class="q"><strong>Q5.</strong> Que devient le champ quand \(e\to0\) à \(\sigma_{\text{tot}}\) fixé ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tout plan contenant \(M\) et perpendiculaire à la couche est plan de symétrie : \(\vec E\) est selon \(\vec e_z\). Invariance par translation selon \(x\) et \(y\) : \(E_z(z)\). Le plan \(z=0\) est plan de symétrie (\(\rho\) paire) : \(E_z(-z)=-E_z(z)\), donc \(E_z(0)=0\).</p>
    <p><strong>Q2.</strong> \(\dfrac{\mathrm{d}E_z}{\mathrm{d}z}=\dfrac{\rho_0}{\varepsilon_0}\cos\dfrac{\pi z}{e}\), et \(E_z(0)=0\) :</p>
    <div class="formula">$$E_z(z)=\frac{\rho_0e}{\pi\varepsilon_0}\sin\frac{\pi z}{e}\qquad(|z|\le e/2)$$</div>
    <p>À l'extérieur, \(\mathrm{d}E_z/\mathrm{d}z=0\) : \(E_z\) est constant. Sans charge surfacique, il y a continuité en \(z=e/2\) : \(E_z=\dfrac{\rho_0e}{\pi\varepsilon_0}\) pour \(z\ge e/2\), et l'opposé pour \(z\le-e/2\).</p>
    <p><strong>Q3.</strong> \(\sigma_{\text{tot}}=\displaystyle\int_{-e/2}^{e/2}\rho_0\cos\frac{\pi z}{e}\,\mathrm{d}z=\frac{2\rho_0e}{\pi}\). Vue de l'extérieur, la couche est équivalente à un plan chargé : \(E_z=\dfrac{\sigma_{\text{tot}}}{2\varepsilon_0}=\dfrac{\rho_0e}{\pi\varepsilon_0}\). ✓ (Gauss sur un cylindre de bases \(S\) en \(\pm z\) : \(2SE_z=S\sigma_{\text{tot}}/\varepsilon_0\).)</p>
    <p><strong>Q4.</strong> \(\mathrm{d}V/\mathrm{d}z=-E_z\) et \(V(0)=0\) :</p>
    <div class="formula">$$V(z)=\frac{\rho_0e^2}{\pi^2\varepsilon_0}\Big(\cos\frac{\pi z}{e}-1\Big)\qquad(|z|\le e/2)$$</div>
    <p>Poisson : \(\dfrac{\mathrm{d}^2V}{\mathrm{d}z^2}=-\dfrac{\rho_0}{\varepsilon_0}\cos\dfrac{\pi z}{e}=-\dfrac{\rho}{\varepsilon_0}\). ✓ Pour \(z\ge e/2\), \(V\) est affine et continu :</p>
    <div class="formula">$$V(z)=-\frac{\rho_0e^2}{\pi^2\varepsilon_0}-\frac{\rho_0e}{\pi\varepsilon_0}\Big(z-\frac e2\Big)$$</div>
    <p><strong>Q5.</strong> À l'extérieur, \(E_z=\pm\sigma_{\text{tot}}/(2\varepsilon_0)\) quel que soit \(e\). Dans la couche, le champ passe de \(-\sigma_{\text{tot}}/(2\varepsilon_0)\) à \(+\sigma_{\text{tot}}/(2\varepsilon_0)\) sur une épaisseur \(e\) de plus en plus faible : à la limite, on obtient le plan chargé et sa discontinuité \(\sigma_{\text{tot}}/\varepsilon_0\). Le modèle surfacique est la limite d'une couche mince.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Le modèle de Thomson de l'atome d'hydrogène</h3>
  <div class="statement">Dans le modèle proposé par J. J. Thomson en 1904, l'atome d'hydrogène est une boule de centre \(O\) et de rayon \(a\), portant la charge \(+e\) répartie uniformément en volume, dans laquelle l'électron (charge \(-e\), masse \(m\)) se déplace librement. Données : \(a=1{,}0\times10^{-10}\ \text{m}\), \(e=1{,}6\times10^{-19}\ \text{C}\), \(m=9{,}1\times10^{-31}\ \text{kg}\), \(\dfrac{1}{4\pi\varepsilon_0}=9{,}0\times10^{9}\ \text{SI}\), \(c=3{,}0\times10^{8}\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer, par le théorème de Gauss, le champ \(\vec E\) créé par la boule en tout point. Calculer sa valeur à la surface de la boule.</div>
  <div class="q"><strong>Q2.</strong> Montrer que l'électron, placé à l'intérieur de la boule, subit une force de rappel proportionnelle à \(\overrightarrow{OM}\). En déduire qu'il oscille autour de \(O\) et calculer la fréquence propre \(f_0\) de ces oscillations, puis la longueur d'onde \(\lambda_0=c/f_0\) de la lumière qu'il émettrait. Commenter.</div>
  <div class="q"><strong>Q3.</strong> En utilisant le potentiel d'une boule uniformément chargée, exprimer l'énergie potentielle \(E_p(r)\) de l'électron pour \(r\le a\). Vérifier que \(O\) est une position d'équilibre stable.</div>
  <div class="q"><strong>Q4.</strong> Le cours affirme qu'une charge ne peut pas être en équilibre stable sous l'effet des seules forces électrostatiques dans une région vide de charges. Pourquoi n'y a-t-il pas de contradiction ?</div>
  <div class="q"><strong>Q5.</strong> Calculer l'énergie qu'il faut fournir pour arracher l'électron initialement immobile en \(O\) et l'envoyer à l'infini, en électronvolts. Comparer à l'énergie d'ionisation mesurée, \(13{,}6\ \text{eV}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Symétrie sphérique : \(\vec E=E_r(r)\,\vec e_r\). Sphère de Gauss de rayon \(r\) : flux \(4\pi r^2E_r\). Charge intérieure \(e\,r^3/a^3\) pour \(r\le a\), \(e\) pour \(r\ge a\) :</p>
    <div class="formula">$$E_r(r\le a)=\frac{e\,r}{4\pi\varepsilon_0a^3}\qquad E_r(r\ge a)=\frac{e}{4\pi\varepsilon_0r^2}$$</div>
    <p>À la surface : \(E(a)=\dfrac{e}{4\pi\varepsilon_0a^2}\approx1{,}4\times10^{11}\ \text{V·m}^{-1}\), un champ colossal, inaccessible à notre échelle (l'air claque à \(3\times10^{6}\ \text{V·m}^{-1}\)).</p>
    <p><strong>Q2.</strong> À l'intérieur, \(\vec F=-e\vec E=-K\,\overrightarrow{OM}\) avec \(K=\dfrac{e^2}{4\pi\varepsilon_0a^3}\) : c'est une force de rappel élastique dirigée vers \(O\). Le principe fondamental de la dynamique donne \(m\ddot{\overrightarrow{OM}}=-K\,\overrightarrow{OM}\) : chaque coordonnée est un oscillateur harmonique de pulsation \(\omega_0=\sqrt{K/m}\).</p>
    <div class="formula">$$\omega_0=\sqrt{\frac{e^2}{4\pi\varepsilon_0\,m\,a^3}}\approx1{,}6\times10^{16}\ \text{rad·s}^{-1}$$</div>
    <p>soit \(f_0=\omega_0/(2\pi)\approx2{,}5\times10^{15}\ \text{Hz}\) et \(\lambda_0=c/f_0\approx1{,}2\times10^{-7}\ \text{m}=120\ \text{nm}\).</p>
    <p>On obtient un rayonnement ultraviolet, et même un ordre de grandeur remarquablement proche de la raie Lyman α de l'hydrogène (122 nm). Mais le modèle prévoit une seule fréquence, alors que l'hydrogène émet toute une série de raies : il a été abandonné après l'expérience de Rutherford (1911), qui a montré que la charge positive est concentrée dans un noyau minuscule.</p>
    <p><strong>Q3.</strong> Le potentiel de la boule (cours, §7, avec \(\rho=3e/(4\pi a^3)\)) vaut \(V(r)=\dfrac{e}{8\pi\varepsilon_0a}\Big(3-\dfrac{r^2}{a^2}\Big)\) pour \(r\le a\). Donc</p>
    <div class="formula">$$E_p(r)=-e\,V(r)=-\frac{e^2}{8\pi\varepsilon_0a}\Big(3-\frac{r^2}{a^2}\Big)$$</div>
    <p>\(E_p\) est une parabole minimale en \(r=0\) : \(O\) est une position d'équilibre stable (on retrouve \(E_p=\tfrac12Kr^2+\text{cste}\)).</p>
    <p><strong>Q4.</strong> Le résultat du cours repose sur l'équation de Laplace, valable là où \(\rho=0\). Ici l'électron se trouve <em>à l'intérieur</em> de la charge positive : l'équation de Poisson donne \(\Delta V=-\rho/\varepsilon_0\lt0\), si bien que \(V\) peut présenter un maximum en \(O\), donc \(E_p=-eV\) un minimum. Il n'y a pas de contradiction.</p>
    <p><strong>Q5.</strong> L'énergie à fournir vaut</p>
    <div class="formula">$$E_p(\infty)-E_p(0)=0-\Big(-\frac{3e^2}{8\pi\varepsilon_0a}\Big)=\frac{3e^2}{8\pi\varepsilon_0a}\approx3{,}5\times10^{-18}\ \text{J}\approx22\ \text{eV}$$</div>
    <p>L'ordre de grandeur est bon (quelques dizaines d'eV : c'est l'échelle de la chimie et de l'ultraviolet), mais la valeur est 1,6 fois trop grande : un modèle classique ne peut pas rendre compte quantitativement de l'atome.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Condensateur plan et déviation d'un faisceau d'électrons</h3>
  <div class="statement">Des électrons (charge \(-e\), masse \(m\)), émis sans vitesse par une cathode, sont accélérés sous la tension \(U_0=1{,}0\ \text{kV}\). Ils entrent ensuite, avec la vitesse \(\vec v_0=v_0\,\vec e_x\), à mi-distance entre les deux armatures horizontales d'un condensateur plan : armatures carrées de côté \(\ell=4{,}0\ \text{cm}\), écartées de \(d=5{,}0\ \text{mm}\) ; l'armature du bas est au potentiel \(0\), celle du haut au potentiel \(U=20\ \text{V}\). Le poids est négligé, ainsi que les effets de bord. Données : \(e=1{,}6\times10^{-19}\ \text{C}\), \(m=9{,}1\times10^{-31}\ \text{kg}\), \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> On modélise les armatures par deux plans infinis portant \(+\sigma\) (en haut) et \(-\sigma\) (en bas). Justifier ce modèle, puis établir par superposition le champ en tout point. Exprimer \(\sigma\) en fonction de \(U\) et \(d\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(E\), \(\sigma\), la capacité \(C\) et la charge \(Q\) de l'armature du haut.</div>
  <div class="q"><strong>Q3.</strong> Par un argument énergétique, calculer \(v_0\).</div>
  <div class="q"><strong>Q4.</strong> Établir l'équation de la trajectoire entre les armatures et montrer que la déviation à la sortie vaut \(y_s=\dfrac{E\ell^2}{4U_0}\). Application numérique.</div>
  <div class="q"><strong>Q5.</strong> Vérifier le résultat de Q4 par l'énergie potentielle : quelle énergie cinétique l'électron a-t-il gagnée entre l'entrée et la sortie ?</div>
  <div class="q"><strong>Q6.</strong> Quelle tension \(U_{\max}\) ne faut-il pas dépasser pour que les électrons sortent du condensateur sans heurter une armature ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'écartement \(d=5\ \text{mm}\) est petit devant les dimensions \(\ell=4\ \text{cm}\) des armatures : vues d'un point situé entre elles, loin des bords, elles se comportent comme des plans infinis (§2 et §8 du cours). Chaque plan crée de part et d'autre un champ uniforme \(\sigma/(2\varepsilon_0)\), dirigé vers l'extérieur pour \(+\sigma\) et vers lui pour \(-\sigma\). Entre les armatures, les deux contributions sont dirigées vers le bas et s'ajoutent : \(\vec E=-\dfrac{\sigma}{\varepsilon_0}\,\vec e_y\) ; à l'extérieur, elles se compensent : \(\vec E=\vec 0\). La tension vaut \(U=V_{\text{haut}}-V_{\text{bas}}=Ed\), d'où \(\sigma=\varepsilon_0U/d\).</p>
    <p><strong>Q2.</strong> \(E=U/d=4{,}0\times10^{3}\ \text{V·m}^{-1}\) ; \(\sigma=\varepsilon_0E\approx3{,}5\times10^{-8}\ \text{C·m}^{-2}\) ; \(C=\dfrac{\varepsilon_0\ell^2}{d}\approx2{,}8\ \text{pF}\) ; \(Q=CU\approx57\ \text{pC}\) (on vérifie \(Q=\sigma\ell^2\)).</p>
    <p><strong>Q3.</strong> Entre la cathode (\(V=0\)) et le point d'entrée (\(V=U_0\)), l'énergie mécanique se conserve avec \(E_p=-eV\) : \(\tfrac12mv_0^2=eU_0\), d'où \(v_0=\sqrt{2eU_0/m}\approx1{,}9\times10^{7}\ \text{m·s}^{-1}\) (6 % de \(c\) : le traitement non relativiste convient).</p>
    <p><strong>Q4.</strong> Entre les armatures, la force \(\vec F=-e\vec E=+eE\,\vec e_y\) est constante et dirigée vers l'armature positive. Le principe fondamental de la dynamique donne \(x=v_0t\) et \(y=\dfrac{eE}{2m}t^2\), soit la parabole</p>
    <div class="formula">$$y=\frac{eE}{2mv_0^2}\,x^2=\frac{E}{4U_0}\,x^2\qquad\text{puisque }mv_0^2=2eU_0$$</div>
    <p>À la sortie (\(x=\ell\)) : \(y_s=\dfrac{4{,}0\times10^{3}\times(0{,}040)^2}{4\times1{,}0\times10^{3}}=1{,}6\ \text{mm}\), inférieur à \(d/2=2{,}5\ \text{mm}\) : l'électron sort. Remarque : la masse et la charge ont disparu, la déviation ne dépend que des tensions et des dimensions.</p>
    <p><strong>Q5.</strong> Le potentiel croît linéairement vers le haut : entre l'entrée et la sortie, l'électron monte de \(y_s\) et son potentiel augmente de \(\Delta V=Ey_s=6{,}4\ \text{V}\). Son énergie potentielle \(-eV\) diminue de \(6{,}4\ \text{eV}\) : il gagne \(6{,}4\ \text{eV}\) d'énergie cinétique, à comparer aux \(1\,000\ \text{eV}\) acquis lors de l'accélération. Contrôle par la vitesse transversale \(v_y=\dfrac{eE\ell}{mv_0}\) : \(\tfrac12mv_y^2=\dfrac{e^2E^2\ell^2}{2mv_0^2}=eE\,\dfrac{E\ell^2}{4U_0}=eEy_s\). ✓</p>
    <p><strong>Q6.</strong> Il faut \(y_s\le d/2\), soit \(\dfrac{U}{d}\,\dfrac{\ell^2}{4U_0}\le\dfrac d2\), d'où</p>
    <div class="formula">$$U_{\max}=\frac{2U_0d^2}{\ell^2}=\frac{2\times1{,}0\times10^{3}\times(5{,}0\times10^{-3})^2}{(0{,}040)^2}\approx31\ \text{V}$$</div>
    <p>C'est le principe des plaques de déflexion des anciens oscilloscopes : la déviation est proportionnelle à la tension appliquée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Condensateur sphérique : capacité, énergie, tenue en tension</h3>
  <div class="statement">Les armatures minces d'un condensateur sphérique sont modélisées par deux sphères concentriques de rayons \(R_1=5{,}0\ \text{cm}\) et \(R_2=6{,}0\ \text{cm}\), séparées par de l'air (assimilé au vide) et chargées uniformément en surface : l'armature intérieure porte \(+Q\), l'extérieure \(-Q\). La capacité est définie comme pour le condensateur plan, \(C=Q/U\). Champ disruptif de l'air : \(E_d=3{,}0\ \text{MV·m}^{-1}\). (Le résultat \(C\) figure en fin de cours, hors programme : on l'établit ici avec les outils du programme.)</div>
  <div class="q"><strong>Q1.</strong> Déterminer le champ en tout point de l'espace.</div>
  <div class="q"><strong>Q2.</strong> En déduire la tension \(U\) entre les armatures et la capacité \(C\). Application numérique.</div>
  <div class="q"><strong>Q3.</strong> Retrouver l'énergie \(Q^2/(2C)\) en intégrant la densité \(\varepsilon_0E^2/2\). Calculer l'énergie stockée sous \(U=1{,}0\ \text{kV}\).</div>
  <div class="q"><strong>Q4.</strong> Où le champ est-il maximal ? Quelle tension maximale peut-on appliquer sans claquage ?</div>
  <div class="q"><strong>Q5.</strong> Comparer \(C\) à la formule du condensateur plan d'aire \(4\pi R_1^2\) et d'épaisseur \(R_2-R_1\). Quelle aire rend la formule plane exacte ?</div>
  <div class="q"><strong>Q6.</strong> À \(R_2\) fixé, quel rayon \(R_1\) maximise la tension supportable ? Que vaut-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Symétrie sphérique : \(\vec E=E_r(r)\,\vec e_r\). Gauss sur une sphère de rayon \(r\) : \(E_r=0\) pour \(r\lt R_1\) (aucune charge intérieure) ; \(E_r=\dfrac{Q}{4\pi\varepsilon_0r^2}\) pour \(R_1\lt r\lt R_2\) ; \(E_r=0\) pour \(r\gt R_2\) (charge intérieure totale nulle).</p>
    <p><strong>Q2.</strong> La tension est la circulation du champ d'une armature à l'autre :</p>
    <div class="formula">$$U=\int_{R_1}^{R_2}\frac{Q\,\mathrm{d}r}{4\pi\varepsilon_0r^2}=\frac{Q}{4\pi\varepsilon_0}\Big(\frac1{R_1}-\frac1{R_2}\Big)$$</div>
    <p>d'où</p>
    <div class="formula">$$C=\frac{4\pi\varepsilon_0R_1R_2}{R_2-R_1}=\frac{1{,}11\times10^{-10}\times0{,}050\times0{,}060}{0{,}010}\approx33\ \text{pF}$$</div>
    <p><strong>Q3.</strong> En intégrant sur les coquilles comprises entre les armatures :</p>
    <div class="formula">$$W_e=\int_{R_1}^{R_2}\frac{\varepsilon_0}{2}\Big(\frac{Q}{4\pi\varepsilon_0r^2}\Big)^24\pi r^2\,\mathrm{d}r=\frac{Q^2}{8\pi\varepsilon_0}\Big(\frac1{R_1}-\frac1{R_2}\Big)=\frac{Q^2}{2C}$$</div>
    <p>✓ Sous \(1{,}0\ \text{kV}\) : \(W_e=\tfrac12CU^2\approx17\ \mu\text{J}\).</p>
    <p><strong>Q4.</strong> \(E\) décroît en \(1/r^2\) : il est maximal en \(r=R_1\). Avec \(Q=CU\) : \(E(R_1)=\dfrac{U\,R_2}{R_1(R_2-R_1)}\), soit \(1{,}2\times10^5\ \text{V·m}^{-1}\) pour \(U=1\ \text{kV}\). Claquage pour</p>
    <div class="formula">$$U_{\max}=\frac{E_dR_1(R_2-R_1)}{R_2}=\frac{3{,}0\times10^6\times0{,}050\times0{,}010}{0{,}060}=25\ \text{kV}$$</div>
    <p><strong>Q5.</strong> \(C_{\text{plan}}=\dfrac{4\pi\varepsilon_0R_1^2}{R_2-R_1}\approx28\ \text{pF}\) : \(C/C_{\text{plan}}=R_2/R_1=1{,}2\) : la formule plane sous-estime \(C\) d'environ 17 %, car l'écart \(R_2-R_1\) n'est pas petit devant \(R_1\). La formule plane est exacte avec l'aire « moyenne géométrique » \(4\pi R_1R_2\).</p>
    <p><strong>Q6.</strong> \(U_{\max}(R_1)=\dfrac{E_d}{R_2}R_1(R_2-R_1)\) est maximal pour \(R_1=R_2/2\) : \(U_{\max}=\dfrac{E_dR_2}{4}=45\ \text{kV}\). Une armature intérieure trop petite concentre le champ à sa surface ; trop grande, elle laisse un intervalle trop mince.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Un champ uniforme dans une cavité : superposition et théorème de Gauss</h3>
  <div class="statement">Un cylindre infini d'axe \(\Delta\) (passant par \(O\), parallèle à \(Oz\)) et de rayon \(R\) porte une charge volumique uniforme \(\rho\gt0\). On y a creusé une cavité cylindrique vide de charges, d'axe \(\Delta'\) parallèle à \(\Delta\) et passant par \(O'\), de rayon \(b\), avec \(OO'=d\) et \(d+b\lt R\). Pour un point \(M\), on note \(H\) et \(H'\) ses projetés orthogonaux sur \(\Delta\) et \(\Delta'\). Données : \(\rho=1{,}0\ \mu\text{C·m}^{-3}\), \(d=2{,}0\ \text{cm}\), \(b=1{,}0\ \text{cm}\), \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(e=1{,}6\times10^{-19}\ \text{C}\), \(m=9{,}1\times10^{-31}\ \text{kg}\).</div>
  <div class="q"><strong>Q1.</strong> Pourquoi le théorème de Gauss ne permet-il pas de calculer directement le champ de cette distribution ?</div>
  <div class="q"><strong>Q2.</strong> Montrer qu'à l'intérieur d'un cylindre plein, infini, uniformément chargé (densité \(\rho\), axe \(\Delta\)), le champ s'écrit \(\vec E=\dfrac{\rho}{2\varepsilon_0}\,\overrightarrow{HM}\).</div>
  <div class="q"><strong>Q3.</strong> Décomposer la distribution étudiée en deux distributions dont on connaît le champ. En déduire le champ en tout point \(M\) de la cavité. Que remarque-t-on ?</div>
  <div class="q"><strong>Q4.</strong> Application numérique. Un électron est lâché sans vitesse dans la cavité (supposée vide d'air, poids négligé) : décrire son mouvement et estimer la durée qu'il met pour parcourir \(1{,}0\ \text{cm}\).</div>
  <div class="q"><strong>Q5.</strong> Que devient le résultat pour une cavité sphérique creusée dans une boule uniformément chargée ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La cavité décentrée brise l'invariance par rotation autour de \(\Delta\) : par un point quelconque ne passe plus qu'un plan de symétrie, le plan perpendiculaire à l'axe (s'y ajoute le plan des deux axes, pour les points qui s'y trouvent). Le champ a donc deux composantes, qui dépendent de deux variables : aucune surface fermée simple ne porte un champ normal de norme constante.</p>
    <p><strong>Q2.</strong> Pour le cylindre plein, \(\vec E=E_r(r)\,\vec e_r\) en cylindriques d'axe \(\Delta\). Surface de Gauss : cylindre coaxial fermé de rayon \(r\le R\) et de hauteur \(h\) ; \(2\pi rh\,E_r=\rho\pi r^2h/\varepsilon_0\), d'où \(E_r=\dfrac{\rho r}{2\varepsilon_0}\). Comme \(r\,\vec e_r=\overrightarrow{HM}\), on obtient \(\vec E=\dfrac{\rho}{2\varepsilon_0}\,\overrightarrow{HM}\).</p>
    <p><strong>Q3.</strong> La distribution est la somme d'un cylindre plein (axe \(\Delta\), densité \(\rho\)) et d'un cylindre occupant la cavité (axe \(\Delta'\), densité \(-\rho\)) : leur somme est bien nulle dans la cavité et vaut \(\rho\) ailleurs. Par superposition, en \(M\) dans la cavité, intérieur aux deux cylindres :</p>
    <div class="formula">$$\vec E(M)=\frac{\rho}{2\varepsilon_0}\,\overrightarrow{HM}-\frac{\rho}{2\varepsilon_0}\,\overrightarrow{H'M}=\frac{\rho}{2\varepsilon_0}\,\overrightarrow{HH'}=\frac{\rho}{2\varepsilon_0}\,\overrightarrow{OO'}$$</div>
    <p>(\(\overrightarrow{HH'}=\overrightarrow{OO'}\) car les deux axes sont parallèles et \(\overrightarrow{OO'}\) est orthogonal à l'axe). Le champ est <strong>uniforme</strong> dans toute la cavité, dirigé de l'axe du cylindre vers celui de la cavité, et indépendant du rayon \(b\).</p>
    <p><strong>Q4.</strong> \(E=\dfrac{\rho d}{2\varepsilon_0}\approx1{,}1\times10^{3}\ \text{V·m}^{-1}\) (avec \(\rho d=2{,}0\times10^{-8}\ \text{C·m}^{-2}\)). L'électron subit la force constante \(-e\vec E\), dirigée de \(O'\) vers \(O\) : mouvement rectiligne uniformément accéléré, d'accélération \(eE/m\approx2{,}0\times10^{14}\ \text{m·s}^{-2}\). Pour parcourir \(L=1{,}0\ \text{cm}\) depuis le repos : \(t=\sqrt{2L/(eE/m)}\approx1{,}0\times10^{-8}\ \text{s}\), soit une dizaine de nanosecondes.</p>
    <p><strong>Q5.</strong> Même raisonnement avec le champ intérieur d'une boule, \(\vec E=\dfrac{\rho}{3\varepsilon_0}\,\overrightarrow{OM}\) : dans une cavité sphérique de centre \(O'\), \(\vec E=\dfrac{\rho}{3\varepsilon_0}\,\overrightarrow{OO'}\), uniforme lui aussi.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Planète à noyau dense : profil de la pesanteur</h3>
  <div class="statement">Une planète sphérique de rayon \(R\) comporte un noyau (\(r\le R/2\)) de masse volumique \(2\mu\) et un manteau (\(R/2\le r\le R\)) de masse volumique \(\mu\). On note \(g(r)=\|\vec{\mathcal G}\|\) et l'on néglige la rotation propre. Données : \(\mu=4{,}0\times10^3\ \text{kg·m}^{-3}\), \(R=5{,}0\times10^3\ \text{km}\), \(G=6{,}67\times10^{-11}\ \text{SI}\).</div>
  <div class="q"><strong>Q1.</strong> Énoncer le théorème de Gauss gravitationnel et en déduire la forme de \(\vec{\mathcal G}\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la masse \(M\) de la planète.</div>
  <div class="q"><strong>Q3.</strong> Exprimer \(g(r)\) dans le noyau, dans le manteau et à l'extérieur. Vérifier la continuité et calculer \(g_0=g(R)\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que, dans le manteau, \(g\) passe par un minimum. Décrire l'évolution de \(g\) le long d'un puits vertical allant de la surface au centre.</div>
  <div class="q"><strong>Q5.</strong> Par la forme locale \(\operatorname{div}\vec{\mathcal G}=-4\pi G\mu\), établir \(\dfrac{\mathrm{d}g}{\mathrm{d}r}=4\pi G\mu_{\text{loc}}-\dfrac{2g}{r}\). En déduire une condition sur la masse volumique locale pour que \(g\) augmente quand on descend.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\displaystyle\oint_\Sigma\vec{\mathcal G}\cdot\vec n\,\mathrm{d}S=-4\pi G\,M_{\text{int}}\). Symétrie sphérique de la répartition de masse : \(\vec{\mathcal G}=-g(r)\,\vec e_r\) ; sphère de Gauss de rayon \(r\) : \(g(r)=\dfrac{G\,M_{\text{int}}(r)}{r^2}\).</p>
    <p><strong>Q2.</strong> Noyau plus manteau :</p>
    <div class="formula">$$M=\frac43\pi\Big(\frac R2\Big)^3 2\mu+\frac43\pi\mu\Big(R^3-\frac{R^3}{8}\Big)=\frac43\pi\mu R^3\Big(\frac14+\frac78\Big)=\frac32\pi\mu R^3$$</div>
    <p><strong>Q3.</strong> Noyau : \(M_{\text{int}}=\tfrac83\pi\mu r^3\), \(g=\tfrac83\pi G\mu\,r\). Manteau : \(M_{\text{int}}=\tfrac43\pi\mu\Big(r^3+\tfrac{R^3}{8}\Big)\), d'où</p>
    <div class="formula">$$g(r)=\frac43\pi G\mu\Big(r+\frac{R^3}{8r^2}\Big)\qquad(R/2\le r\le R)$$</div>
    <p>Extérieur : \(g=\dfrac{3\pi G\mu R^3}{2r^2}\). En \(r=R/2\), noyau et manteau donnent \(\tfrac43\pi G\mu R\) ; en \(r=R\), manteau et extérieur donnent</p>
    <div class="formula">$$g_0=\frac32\pi G\mu R=1{,}5\pi\times6{,}67\times10^{-11}\times4{,}0\times10^3\times5{,}0\times10^6\approx6{,}3\ \text{m·s}^{-2}$$</div>
    <p><strong>Q4.</strong> Dans le manteau, \(\dfrac{\mathrm{d}g}{\mathrm{d}r}\propto1-\dfrac{R^3}{4r^3}\) s'annule en \(r_m=R/4^{1/3}\approx0{,}63\,R\) : minimum \(g_m\approx1{,}26\,\pi G\mu R\approx0{,}84\,g_0\). En descendant : \(g\) diminue de \(g_0\) à \(0{,}84\,g_0\) (à la profondeur \(0{,}37\,R\)), remonte à \(\tfrac89g_0\approx0{,}89\,g_0\) à l'entrée du noyau, puis décroît linéairement jusqu'à 0 au centre.</p>
    <p><strong>Q5.</strong> En sphériques, \(\dfrac1{r^2}\dfrac{\mathrm{d}(r^2\mathcal G_r)}{\mathrm{d}r}=-4\pi G\mu_{\text{loc}}\) avec \(\mathcal G_r=-g\) : \(\dfrac{\mathrm{d}g}{\mathrm{d}r}+\dfrac{2g}{r}=4\pi G\mu_{\text{loc}}\). Or \(g/r=\tfrac43\pi G\bar\mu(r)\), où \(\bar\mu(r)\) est la masse volumique moyenne de la sphère de rayon \(r\). Donc \(\dfrac{\mathrm{d}g}{\mathrm{d}r}=4\pi G\Big(\mu_{\text{loc}}-\tfrac23\bar\mu\Big)\) : \(g\) augmente en descendant (\(\mathrm{d}g/\mathrm{d}r\lt 0\)) si \(\mu_{\text{loc}}\lt\tfrac23\bar\mu(r)\). En surface ici, \(\bar\mu=\tfrac98\mu\) et \(\tfrac23\bar\mu=0{,}75\,\mu\lt\mu\) : \(g\) commence par diminuer, conformément à Q4.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Carte de champ de deux charges inégales en Python</h3>
  <div class="statement">Une charge \(2q\) est placée en \(A(-a,0)\) et une charge \(-q\) en \(B(a,0)\), avec \(q\gt 0\). On prend \(a=1\), \(q=10^{-9}\ \text{C}\), \(k=1/(4\pi\varepsilon_0)=9\times10^9\ \text{SI}\). Un élève commence le script suivant :
  <pre class="codeblock">import numpy as np
import matplotlib.pyplot as plt
k, q, a = 9e9, 1e-9, 1.0
x = np.linspace(-4, 8, 601)
y = np.linspace(-4, 4, 401)
X, Y = np.meshgrid(x, y)
dA = np.hypot(X + a, Y)                  <span class="cmt"># distance à A</span>
dB = np.hypot(X - a, Y)                  <span class="cmt"># distance à B</span>
V = ...                                  <span class="cmt"># à compléter</span>
Ex, Ey = np.gradient(V, x, y)            <span class="cmt"># ligne suspecte</span></pre>
  </div>
  <div class="q"><strong>Q1.</strong> Montrer qu'il existe un unique point de champ nul, situé sur l'axe \(Ox\), et calculer son abscisse \(x_0\).</div>
  <div class="q"><strong>Q2.</strong> Compléter la ligne donnant <span class="code-inline">V</span>. Avec le pas choisi (\(0{,}02\)), que se passe-t-il aux nœuds situés sur les charges ? Proposer une parade.</div>
  <div class="q"><strong>Q3.</strong> La ligne « suspecte » contient deux erreurs. Les identifier et la corriger.</div>
  <div class="q"><strong>Q4.</strong> Écrire une fonction <span class="code-inline">zero_champ(x1, x2)</span> qui localise par dichotomie, sur l'axe \(y=0\), le zéro de \(E_x(x)\) entre \(x_1\) et \(x_2\) (calcul analytique de \(E_x\) sur l'axe, sans la grille).</div>
  <div class="q"><strong>Q5.</strong> Décrire la carte des lignes de champ : d'où partent-elles, où aboutissent-elles, quelle proportion des lignes issues de \(A\) aboutit en \(B\) ? Allure à grande distance ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Hors de l'axe, les champs des deux charges ne sont pas colinéaires : leur somme ne peut s'annuler. Sur l'axe, entre \(A\) et \(B\), les deux champs pointent vers \(B\) : pas de zéro. À gauche de \(A\), le champ de \(2q\) (plus proche et plus forte) domine. Il reste \(x\gt a\), où il faut \(\dfrac{2q}{(x+a)^2}=\dfrac{q}{(x-a)^2}\), soit \(x+a=\sqrt2\,(x-a)\) :</p>
    <div class="formula">$$x_0=a\,\frac{\sqrt2+1}{\sqrt2-1}=a\,(3+2\sqrt2)\approx5{,}83\,a$$</div>
    <p><strong>Q2.</strong> <span class="code-inline">V = k*(2*q/dA - q/dB)</span>. Les abscisses valent \(-4+0{,}02\,j\) : \(x=-1\) et \(x=+1\) sont des nœuds, tout comme \(y=0\). En ces deux points, la distance est nulle : division par zéro (avertissement de NumPy, valeurs <span class="code-inline">inf</span>), qui ruine l'échelle des niveaux et le calcul du gradient au voisinage. Parades : lisser la distance (<span class="code-inline">np.sqrt((X + a)**2 + Y**2 + eps**2)</span> avec <span class="code-inline">eps</span> petit devant \(a\)), décaler la grille (600 points au lieu de 601, par exemple) pour qu'aucun nœud ne tombe sur une charge, ou remplacer par <span class="code-inline">np.nan</span> les valeurs trop proches des charges.</p>
    <p><strong>Q3.</strong> (1) <span class="code-inline">np.gradient</span> dérive d'abord selon l'axe 0 (les lignes, donc \(y\)) : il faut fournir <span class="code-inline">y</span> puis <span class="code-inline">x</span>, et la première sortie est \(\partial V/\partial y\). Ici, l'erreur est même fatale : <span class="code-inline">x</span> a 601 valeurs alors que l'axe 0 de <span class="code-inline">V</span> en compte 401, et NumPy lève une <span class="code-inline">ValueError</span> (sur une grille carrée, le programme tournerait en silence avec des composantes échangées). (2) Il manque le signe moins de \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\). Correction :</p>
    <pre class="codeblock">dVdy, dVdx = np.gradient(V, y, x)
Ex, Ey = -dVdx, -dVdy</pre>
    <p><strong>Q4.</strong> Sur l'axe, \(E_x(x)=k\Big(\dfrac{2q\,(x+a)}{|x+a|^3}-\dfrac{q\,(x-a)}{|x-a|^3}\Big)\) :</p>
    <pre class="codeblock">def Ex_axe(x):
    return k*(2*q*(x + a)/abs(x + a)**3 - q*(x - a)/abs(x - a)**3)

def zero_champ(x1, x2, eps=1e-9):
    <span class="cmt"># on suppose que Ex_axe change de signe entre x1 et x2</span>
    while x2 - x1 &gt; eps:
        m = (x1 + x2)/2
        if Ex_axe(x1)*Ex_axe(m) &lt;= 0:
            x2 = m
        else:
            x1 = m
    return (x1 + x2)/2

print(zero_champ(2, 10))     <span class="cmt"># environ 5.828</span></pre>
    <p>Juste à droite de \(B\), le champ de \(-q\) domine (\(E_x\lt 0\)) ; loin, celui de \(2q\) domine (\(E_x\gt 0\)) : le changement de signe est bien encadré par \([2,10]\).</p>
    <p><strong>Q5.</strong> Toutes les lignes partent de \(A\) (charge positive). Le flux sortant de \(A\) vaut \(2q/\varepsilon_0\), le flux entrant en \(B\) vaut \(q/\varepsilon_0\) : la moitié des lignes issues de \(A\) aboutit en \(B\), l'autre moitié part à l'infini. Les deux familles sont séparées par une ligne qui passe par le point de champ nul \(x_0\). À grande distance, la distribution se comporte comme une charge ponctuelle \(q\) (charge totale) : lignes radiales, équipotentielles quasi circulaires.</p>
  </div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Zone de charge d'espace d'une jonction PN</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>électrostatique : Maxwell-Gauss, Poisson, capacité</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une diode au silicium est formée d'une région dopée P (\(x\lt 0\)) et d'une région dopée N (\(x\gt 0\)), séparées par le plan \(x=0\). Au voisinage de ce plan apparaît une <strong>zone de charge d'espace</strong> modélisée ainsi : \(\rho=-eN_A\) pour \(-x_p\le x\lt 0\), \(\rho=+eN_D\) pour \(0\lt x\le x_n\), et \(\rho=0\) ailleurs, où le champ est nul. Dans le silicium, on admet qu'il suffit de remplacer \(\varepsilon_0\) par \(\varepsilon=\varepsilon_r\varepsilon_0\), avec \(\varepsilon_r=11{,}7\). Les dimensions transverses (aire \(S\)) sont grandes devant l'épaisseur de la zone.
    <br>Données : \(e=1{,}60\times10^{-19}\ \text{C}\) ; \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\) ; \(N_A=1{,}0\times10^{23}\ \text{m}^{-3}\) ; \(N_D=1{,}0\times10^{22}\ \text{m}^{-3}\) ; différence de potentiel interne \(V_{bi}=0{,}75\ \text{V}\) ; \(S=1{,}0\ \text{mm}^2\) ; champ de claquage du silicium \(E_c\approx3\times10^7\ \text{V·m}^{-1}\).
  </div>

  <p class="exo-part">Partie A — Symétries et neutralité</p>
  <div class="q"><strong>A1.</strong> Justifier que \(\vec E=E(x)\,\vec e_x\).</div>
  <div class="q"><strong>A2.</strong> En appliquant le théorème de Gauss à un cylindre d'axe \(Ox\) dont les bases sont hors de la zone de charge d'espace, montrer que \(N_Ax_p=N_Dx_n\). Interpréter.</div>

  <p class="exo-part">Partie B — Champ électrique</p>
  <div class="q"><strong>B1.</strong> Intégrer l'équation de Maxwell-Gauss pour obtenir \(E(x)\) dans chaque région de la zone.</div>
  <div class="q"><strong>B2.</strong> Vérifier la continuité en \(x=0\). Tracer l'allure de \(E(x)\) et exprimer \(E_{\max}=|E(0)|\).</div>

  <p class="exo-part">Partie C — Potentiel et largeur de la zone</p>
  <div class="q"><strong>C1.</strong> Montrer que \(V_{bi}=V(x_n)-V(-x_p)=\dfrac{e}{2\varepsilon}\big(N_Ax_p^2+N_Dx_n^2\big)\) et interpréter graphiquement.</div>
  <div class="q"><strong>C2.</strong> En déduire la largeur \(W=x_p+x_n\) en fonction de \(V_{bi}\), puis calculer \(W\), \(x_n\), \(x_p\) et \(E_{\max}\). Dans quelle région la zone s'étend-elle surtout ?</div>

  <p class="exo-part">Partie D — Polarisation inverse et capacité</p>
  <div class="q"><strong>D1.</strong> Sous une tension inverse \(U_R\), on admet qu'il suffit de remplacer \(V_{bi}\) par \(V_{bi}+U_R\). Comment varie \(W\) ?</div>
  <div class="q"><strong>D2.</strong> La charge de la région N vaut \(Q=eN_Dx_nS\). Montrer que \(C=\left|\dfrac{\mathrm{d}Q}{\mathrm{d}U_R}\right|=\dfrac{\varepsilon S}{W}\). Calculer \(C\) pour \(U_R=0\) et pour \(U_R=8{,}25\ \text{V}\). Citer une application.</div>
  <div class="q"><strong>D3.</strong> Estimer la tension inverse à partir de laquelle le champ atteint \(E_c\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Invariance par translation selon \(y\) et \(z\) (dimensions transverses quasi infinies) : \(E\) ne dépend que de \(x\). Tout plan passant par \(M\) et parallèle à \(Ox\) est plan de symétrie (la densité ne dépend que de \(x\)) : \(\vec E(M)\) est porté par leur intersection, la parallèle à \(Ox\) passant par \(M\).</p>
    <p><strong>A2.</strong> Le champ est nul sur les deux bases et le flux latéral est nul (\(\vec E\) parallèle à la surface) : \(Q_{\text{int}}=0\), soit \(S\big(-eN_Ax_p+eN_Dx_n\big)=0\), d'où \(N_Ax_p=N_Dx_n\). La zone est globalement neutre : elle s'étend davantage du côté le moins dopé.</p>
    <p><strong>B1.</strong> \(\dfrac{\mathrm{d}E}{\mathrm{d}x}=\dfrac{\rho}{\varepsilon}\), avec \(E(-x_p)=0\) et \(E(x_n)=0\) :</p>
    <div class="formula">$$E(x)=-\frac{eN_A}{\varepsilon}(x+x_p)\quad(-x_p\le x\le0)$$</div>
    <div class="formula">$$E(x)=\frac{eN_D}{\varepsilon}(x-x_n)\quad(0\le x\le x_n)$$</div>
    <p><strong>B2.</strong> En \(x=0\) : \(-eN_Ax_p/\varepsilon\) et \(-eN_Dx_n/\varepsilon\), égaux d'après A2 (aucune charge surfacique). \(E\) est négatif (dirigé de N vers P), en « V » de pointe \(x=0\) : \(E_{\max}=\dfrac{eN_Ax_p}{\varepsilon}=\dfrac{eN_Dx_n}{\varepsilon}\).</p>
    <p><strong>C1.</strong> \(V(x_n)-V(-x_p)=-\displaystyle\int_{-x_p}^{x_n}E\,\mathrm{d}x\) est l'aire du triangle compris entre la courbe \(|E(x)|\) et l'axe :</p>
    <div class="formula">$$V_{bi}=\frac12E_{\max}(x_p+x_n)=\frac12\Big(\frac{eN_Ax_p}{\varepsilon}x_p+\frac{eN_Dx_n}{\varepsilon}x_n\Big)=\frac{e}{2\varepsilon}\big(N_Ax_p^2+N_Dx_n^2\big)$$</div>
    <p>La région N est au potentiel le plus élevé.</p>
    <p><strong>C2.</strong> Avec \(x_p=\dfrac{N_DW}{N_A+N_D}\) et \(x_n=\dfrac{N_AW}{N_A+N_D}\) : \(V_{bi}=\dfrac{e}{2\varepsilon}\,\dfrac{N_AN_D}{N_A+N_D}\,W^2\), d'où</p>
    <div class="formula">$$W=\sqrt{\frac{2\varepsilon V_{bi}}{e}\,\frac{N_A+N_D}{N_AN_D}}$$</div>
    <p>\(\varepsilon=\varepsilon_r\varepsilon_0=1{,}04\times10^{-10}\ \text{F·m}^{-1}\) ; \(\dfrac{2\varepsilon V_{bi}}{e}=9{,}7\times10^{8}\ \text{SI}\) ; \(\dfrac{N_A+N_D}{N_AN_D}=1{,}1\times10^{-22}\ \text{m}^3\). D'où \(W\approx3{,}3\times10^{-7}\ \text{m}=0{,}33\ \mu\text{m}\), \(x_n=\tfrac{10}{11}W\approx0{,}30\ \mu\text{m}\), \(x_p\approx0{,}03\ \mu\text{m}\). \(E_{\max}=\dfrac{2V_{bi}}{W}\approx4{,}6\times10^{6}\ \text{V·m}^{-1}\). La zone s'étend surtout dans la région N, dix fois moins dopée.</p>
    <p><strong>D1.</strong> \(W\propto\sqrt{V_{bi}+U_R}\) : la zone s'élargit avec la tension inverse (\(\times\sqrt{12}\approx3{,}5\) pour \(U_R=8{,}25\ \text{V}\), soit \(W\approx1{,}1\ \mu\text{m}\)).</p>
    <p><strong>D2.</strong> \(Q=eN_Dx_nS=eS\,\dfrac{N_AN_D}{N_A+N_D}\,W\) avec \(W^2\propto V_{bi}+U_R\) : \(\dfrac{\mathrm{d}Q}{\mathrm{d}U_R}=\dfrac{Q}{2(V_{bi}+U_R)}\). En remplaçant \(V_{bi}+U_R=\dfrac{e}{2\varepsilon}\dfrac{N_AN_D}{N_A+N_D}W^2\), il vient \(C=\dfrac{\varepsilon S}{W}\) : la zone se comporte comme un condensateur plan d'épaisseur \(W\). \(U_R=0\) : \(C=\dfrac{1{,}04\times10^{-10}\times10^{-6}}{3{,}3\times10^{-7}}\approx0{,}32\ \text{nF}\) ; \(U_R=8{,}25\ \text{V}\) : \(C\approx92\ \text{pF}\). Application : diode à capacité variable (varicap) pour l'accord en fréquence d'un oscillateur ou d'un récepteur radio.</p>
    <p><strong>D3.</strong> \(E_{\max}=\dfrac{2(V_{bi}+U_R)}{W}\propto\sqrt{V_{bi}+U_R}\). Il atteint \(E_c\) quand</p>
    <div class="formula">$$V_{bi}+U_R=V_{bi}\Big(\frac{E_c}{E_{\max}(0)}\Big)^2=0{,}75\times\Big(\frac{3\times10^7}{4{,}6\times10^6}\Big)^2\approx32\ \text{V}$$</div>
    <p>soit \(U_R\approx31\ \text{V}\) : au-delà, claquage par avalanche (exploité dans les diodes Zener à forte tension).</p>
  </div>
</div>
