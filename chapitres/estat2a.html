<div class="course-section">
  <div class="sec-num">§1 · CHARGES, LOI DE COULOMB ET CHAMP</div>
  <h2>De la force entre deux charges au champ électrostatique</h2>
  <div class="intro">En électrostatique, les charges sources sont immobiles dans le référentiel d'étude. Tout part d'une loi d'interaction entre deux charges ponctuelles et du principe de superposition ; la notion de champ sépare ensuite la question « que crée la distribution ? » de la question « que subit la charge placée en M ? ».</div>

  <h3>La charge électrique</h3>
  <p>La charge est une grandeur <strong>algébrique</strong>, <strong>additive</strong> et <strong>conservée</strong> : dans un système isolé, la somme des charges ne varie pas. Elle est <strong>quantifiée</strong> : toute charge isolable est un multiple entier de la charge élémentaire \(e = 1{,}602\times10^{-19}\ \text{C}\) (électron \(-e\), proton \(+e\)). Un objet électrisé porte un excès ou un défaut d'électrons, toujours très petit devant le nombre total de charges qu'il contient.</p>

  <h3>Loi de Coulomb et champ</h3>
  <div class="prop-box">
    <strong>Loi de Coulomb.</strong> Une charge ponctuelle \(q_1\) immobile en \(P\) exerce sur une charge \(q\) placée en \(M\) la force
    <div class="formula" data-nom="Loi de Coulomb">$$\vec F_{P\to M}=\frac{q_1\,q}{4\pi\varepsilon_0}\,\frac{\overrightarrow{PM}}{PM^3}=\frac{q_1\,q}{4\pi\varepsilon_0\,r^2}\,\vec u_{P\to M}$$</div>
    avec \(r = PM\) et \(\vec u_{P\to M}\) le vecteur unitaire dirigé de \(P\) vers \(M\). Permittivité du vide : \(\varepsilon_0 = 8{,}854\times10^{-12}\ \text{F·m}^{-1}\), soit \(\dfrac{1}{4\pi\varepsilon_0}\approx 9{,}0\times10^{9}\ \text{SI}\). Deux charges de même signe se repoussent.
  </div>
  <div class="def-box">
    <strong>Champ électrostatique.</strong> La force subie par \(q\) en \(M\) s'écrit \(\vec F = q\,\vec E(M)\) : le champ \(\vec E(M)\) (en V·m⁻¹) ne dépend que des charges sources et du point \(M\), pas de la charge d'essai. Pour une charge ponctuelle \(q_1\) en \(P\) :
    <div class="formula" data-nom="Champ d'une charge ponctuelle">$$\vec E(M)=\frac{q_1}{4\pi\varepsilon_0}\,\frac{\overrightarrow{PM}}{PM^3}$$</div>
  </div>
  <div class="prop-box">
    <strong>Principe de superposition.</strong> Le champ créé par plusieurs charges \(q_i\) placées en \(P_i\) est la somme <strong>vectorielle</strong> des champs créés par chacune :
    <div class="formula" data-nom="Superposition (charges ponctuelles)">$$\vec E(M)=\frac{1}{4\pi\varepsilon_0}\sum_i q_i\,\frac{\overrightarrow{P_iM}}{P_iM^3}$$</div>
    Le champ est donc une fonction <strong>linéaire</strong> des sources : doubler toutes les charges double le champ en tout point.
  </div>

  <h3>Ordres de grandeur</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Situation</th><th style="text-align:left">Champ électrique</th></tr>
    <tr><td>Atmosphère par beau temps, au sol</td><td>\(\sim 100\ \text{V·m}^{-1}\) (vers le bas)</td></tr>
    <tr><td>Sous un nuage d'orage</td><td>\(\sim 10\ \text{kV·m}^{-1}\)</td></tr>
    <tr><td>Claquage de l'air sec (champ disruptif)</td><td>\(\approx 3\ \text{MV·m}^{-1}\)</td></tr>
    <tr><td>Membrane d'une cellule (70 mV sur 7 nm)</td><td>\(\sim 10^{7}\ \text{V·m}^{-1}\)</td></tr>
    <tr><td>Champ du proton à la distance de l'électron (atome d'hydrogène)</td><td>\(\approx 5\times10^{11}\ \text{V·m}^{-1}\)</td></tr>
  </table></div>
  <p>L'interaction électrique est colossale devant la gravitation : entre deux protons, le rapport des forces vaut \(\dfrac{e^2/(4\pi\varepsilon_0)}{G m_p^2}\approx 10^{36}\). Si la matière ne s'attire ni ne se repousse électriquement à notre échelle, c'est qu'elle est neutre à une précision extraordinaire.</p>

  <div class="method-box">
    <strong>Exemple — deux charges égales, champ sur la médiatrice</strong>
    <p>Deux charges \(+q\) sont placées en \(A(-a, 0)\) et \(B(a, 0)\). On cherche le champ en \(M(0, y)\).</p>
    <ol>
      <li>Les deux charges sont à la même distance \(d = \sqrt{a^2+y^2}\) de \(M\) : leurs champs ont la même norme \(\dfrac{q}{4\pi\varepsilon_0 d^2}\).</li>
      <li>Les composantes selon \(x\) se compensent (symétrie par rapport au plan \(x = 0\)) ; les composantes selon \(y\) s'ajoutent, chacune valant la norme multipliée par \(\cos\alpha = y/d\).</li>
      <li>D'où \(\vec E(M)=\dfrac{2q\,y}{4\pi\varepsilon_0\,(a^2+y^2)^{3/2}}\,\vec e_y\).</li>
      <li>Contrôles : en \(y = 0\), le champ est nul (milieu des charges) ; pour \(y \gg a\), \(\vec E \approx \dfrac{2q}{4\pi\varepsilon_0 y^2}\vec e_y\), le champ d'une charge \(2q\). Entre les deux, sa norme passe par un maximum en \(y = a/\sqrt2\) (annuler la dérivée de \(y(a^2+y^2)^{-3/2}\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner les normes des champs. On additionne des <strong>vecteurs</strong> : projeter chaque contribution sur une base, et utiliser les symétries pour savoir d'avance quelles composantes se compensent.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DISTRIBUTIONS CONTINUES DE CHARGES</div>
  <h2>Remplacer les charges microscopiques par des densités</h2>
  <div class="intro">Un objet chargé contient un nombre astronomique de charges élémentaires. À l'échelle mésoscopique (grande devant les distances atomiques, petite devant l'objet), on décrit la répartition par une densité : les sommes deviennent des intégrales.</div>

  <div class="def-box">
    <strong>Densités de charge.</strong> On définit, à l'échelle mésoscopique :
    <ul>
      <li>la densité <strong>volumique</strong> \(\rho\) (C·m⁻³) : \(\mathrm{d}q = \rho(P)\,\mathrm{d}\tau\) ;</li>
      <li>la densité <strong>surfacique</strong> \(\sigma\) (C·m⁻²) : \(\mathrm{d}q = \sigma(P)\,\mathrm{d}S\), modèle d'une couche d'épaisseur \(a\) négligeable devant les autres longueurs, avec \(\sigma \approx \rho\,a\) ;</li>
      <li>la densité <strong>linéique</strong> \(\lambda\) (C·m⁻¹) : \(\mathrm{d}q = \lambda(P)\,\mathrm{d}\ell\), modèle d'un fil de section \(s\) négligeable, avec \(\lambda \approx \rho\,s\).</li>
    </ul>
    La charge totale s'obtient en sommant sur la distribution :
    <div class="formula" data-nom="Charge totale d'une distribution">$$Q = \iiint_{\mathcal D}\rho\,\mathrm{d}\tau \qquad Q = \iint_{\mathcal S}\sigma\,\mathrm{d}S \qquad Q = \int_{\mathcal C}\lambda\,\mathrm{d}\ell$$</div>
  </div>
  <p><strong>Choisir le modèle</strong> revient à comparer les longueurs : un câble de rayon 1 mm observé à 1 m est un fil (\(\lambda\)) ; une feuille métallique de 10 µm d'épaisseur est une surface (\(\sigma\)) ; un nuage d'orage ou un faisceau d'électrons épais est un volume (\(\rho\)). Le modèle doit rester cohérent avec la question : vu de très près, le fil redevient un cylindre.</p>

  <h3>Éléments de longueur, de surface et de volume</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Coordonnées</th><th style="text-align:left">Volume élémentaire</th><th style="text-align:left">Découpage utile</th></tr>
    <tr><td>Cartésiennes \((x,y,z)\)</td><td>\(\mathrm{d}x\,\mathrm{d}y\,\mathrm{d}z\)</td><td>tranche d'aire \(S\) : \(S\,\mathrm{d}z\)</td></tr>
    <tr><td>Cylindriques \((r,\theta,z)\)</td><td>\(r\,\mathrm{d}r\,\mathrm{d}\theta\,\mathrm{d}z\)</td><td>tube de hauteur \(h\) : \(2\pi r h\,\mathrm{d}r\) ; anneau plan : \(2\pi r\,\mathrm{d}r\)</td></tr>
    <tr><td>Sphériques \((r,\theta,\varphi)\)</td><td>\(r^2\sin\theta\,\mathrm{d}r\,\mathrm{d}\theta\,\mathrm{d}\varphi\)</td><td>coquille : \(4\pi r^2\,\mathrm{d}r\)</td></tr>
  </table></div>

  <div class="method-box">
    <strong>Exemple — charge d'une boule de densité non uniforme</strong>
    <p>Boule de rayon \(R\) de densité \(\rho(r)=\rho_0\,(1-r/R)\). On découpe en coquilles d'épaisseur \(\mathrm{d}r\), de volume \(4\pi r^2\,\mathrm{d}r\), sur lesquelles \(\rho\) est uniforme :</p>
    <div class="formula">$$Q=\int_0^R \rho_0\Big(1-\frac{r}{R}\Big)4\pi r^2\,\mathrm{d}r = 4\pi\rho_0\Big(\frac{R^3}{3}-\frac{R^3}{4}\Big)=\frac{\pi\rho_0R^3}{3}$$</div>
    <p>C'est le quart de \(\tfrac43\pi\rho_0R^3\) : la densité est maximale au centre, mais les coquilles centrales ont un petit volume. « Densité × volume » n'est valable que pour une densité uniforme.</p>
  </div>

  <h3>Décomposer pour superposer : du disque au plan infini</h3>
  <p>Quand aucune symétrie ne permet d'utiliser le théorème de Gauss (§5), on découpe la distribution en morceaux dont on connaît le champ, puis on somme. Le disque est l'exemple type : il se découpe en anneaux, qui se découpent en charges ponctuelles.</p>
  <div class="method-box">
    <strong>Exemple — champ sur l'axe d'un disque uniformément chargé</strong>
    <p>Disque d'axe \(Oz\), de rayon \(R\), de densité \(\sigma\) uniforme ; point \(M\) sur l'axe, à la cote \(z \gt 0\).</p>
    <ol>
      <li><strong>Anneau élémentaire</strong> de rayon \(r\) et de largeur \(\mathrm{d}r\) : charge \(\mathrm{d}q = \sigma\,2\pi r\,\mathrm{d}r\). Tout plan contenant l'axe est plan de symétrie : en \(M\), le champ de l'anneau est porté par \(\vec e_z\).</li>
      <li>Chaque charge de l'anneau est à la distance \(\sqrt{r^2+z^2}\) de \(M\) et sa contribution axiale porte le facteur \(\cos\alpha = z/\sqrt{r^2+z^2}\) : \(\mathrm{d}E_z = \dfrac{\mathrm{d}q}{4\pi\varepsilon_0}\,\dfrac{z}{(r^2+z^2)^{3/2}}\).</li>
      <li>On somme les anneaux de \(r = 0\) à \(R\) :
        <div class="formula" data-nom="Champ sur l'axe d'un disque">$$E_z(z)=\frac{\sigma z}{2\varepsilon_0}\int_0^R\frac{r\,\mathrm{d}r}{(r^2+z^2)^{3/2}}=\frac{\sigma}{2\varepsilon_0}\left(1-\frac{z}{\sqrt{z^2+R^2}}\right)$$</div></li>
      <li><strong>Loin du disque</strong> (\(z \gg R\)) : \(1 - z(z^2+R^2)^{-1/2} \approx \dfrac{R^2}{2z^2}\), donc \(E_z \approx \dfrac{\sigma\pi R^2}{4\pi\varepsilon_0 z^2}\) : champ d'une charge ponctuelle \(Q = \sigma\pi R^2\).</li>
      <li><strong>Près du disque</strong> (\(z \ll R\)) ou disque immense (\(R\to\infty\)) : \(E_z \to \dfrac{\sigma}{2\varepsilon_0}\), le champ du plan infini, indépendant de la distance.</li>
    </ol>
  </div>

  <div class="prop-box"><strong>Quand utiliser un modèle infini ?</strong> Une distribution réelle peut être modélisée par un plan (ou un fil, un cylindre) infini en un point dont la distance à la distribution est petite devant ses dimensions et qui est loin de ses bords. Le calcul du disque le montre : à \(z = R/10\), le champ ne diffère de \(\sigma/2\varepsilon_0\) que de 10 %.</div>

<div class="course-section">
  <div class="sec-num">§3 · SYMÉTRIES ET INVARIANCES</div>
  <h2>Prévoir la direction du champ et ses variables avant tout calcul</h2>
  <div class="intro">Les symétries de la distribution fixent la direction du champ ; ses invariances fixent les coordonnées dont il dépend. Cette analyse, faite en premier, est indispensable pour appliquer le théorème de Gauss et guide tout calcul par superposition.</div>
  <div class="prop-box">
    <strong>Principe de Curie.</strong> Les effets ont au moins les symétries de leurs causes : le champ \(\vec E\) possède au moins les éléments de symétrie de la distribution de charges qui le crée.
  </div>
  <h3>Plans de symétrie et d'antisymétrie</h3>
  <div class="def-box">
    Soit \(P'\) le symétrique d'un point \(P\) par rapport à un plan.
    <ul>
      <li>\(\Pi\) est un <strong>plan de symétrie</strong> de la distribution si \(\rho(P')=\rho(P)\) pour tout \(P\) ;</li>
      <li>\(\Pi^*\) est un <strong>plan d'antisymétrie</strong> si \(\rho(P')=-\rho(P)\) pour tout \(P\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Conséquences pour le champ électrostatique</strong> (vecteur polaire) :
    <ul>
      <li>en un point \(M\) d'un plan de symétrie, \(\vec E(M)\) est <strong>contenu</strong> dans ce plan ;</li>
      <li>en un point \(M\) d'un plan d'antisymétrie, \(\vec E(M)\) est <strong>orthogonal</strong> à ce plan ;</li>
      <li>si deux plans de symétrie distincts passent par \(M\), \(\vec E(M)\) est porté par leur droite d'intersection ;</li>
      <li>hors du plan, \(\vec E(P')\) est le symétrique de \(\vec E(P)\) (plan de symétrie) ou l'opposé du symétrique (plan d'antisymétrie).</li>
    </ul>
  </div>
  <h3>Invariances et choix des coordonnées</h3>
  <ul>
    <li>invariance par translation selon \(Oz\) : les composantes du champ ne dépendent pas de \(z\) ;</li>
    <li>invariance par rotation autour de \(Oz\) : coordonnées cylindriques \((r,\theta,z)\), les composantes ne dépendent pas de \(\theta\) ;</li>
    <li>invariance par toute rotation autour d'un point \(O\) : coordonnées sphériques \((r,\theta,\varphi)\), les composantes ne dépendent que de \(r\).</li>
  </ul>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Symétrie</th><th style="text-align:left">Exemples</th><th style="text-align:left">Forme du champ</th></tr>
    <tr><td>Sphérique</td><td>boule, coquille, \(\rho(r)\)</td><td>\(\vec E = E_r(r)\,\vec e_r\)</td></tr>
    <tr><td>Cylindrique</td><td>fil, cylindre infinis, \(\rho(r)\)</td><td>\(\vec E = E_r(r)\,\vec e_r\)</td></tr>
    <tr><td>Plane</td><td>plan, couche infinis, \(\rho(z)\)</td><td>\(\vec E = E_z(z)\,\vec e_z\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Méthode — analyser les symétries en trois questions</strong>
    <ol>
      <li>Quels plans de symétrie ou d'antisymétrie de la distribution passent par le point \(M\) ? → direction de \(\vec E(M)\).</li>
      <li>Quelles invariances (translations, rotations) laisse la distribution ? → coordonnées dont dépend la composante non nulle.</li>
      <li>Le résultat est-il cohérent avec une situation limite (point très éloigné, point sur un axe) ?</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — deux fils parallèles de charges opposées</strong>
    <p>Fils infinis parallèles à \(Oz\), portant \(+\lambda\) en \(x = a\) et \(-\lambda\) en \(x = -a\).</p>
    <ol>
      <li>Invariance par translation selon \(Oz\) : le champ dépend de \((x, y)\) seulement. Tout plan \(z = \text{cste}\) est plan de symétrie : \(E_z = 0\) partout.</li>
      <li>Le plan \(y = 0\), qui contient les deux fils, est plan de symétrie : sur ce plan, \(E_y = 0\).</li>
      <li>Le plan \(x = 0\) échange les fils en changeant le signe de la charge : c'est un plan d'antisymétrie. Sur ce plan, \(\vec E = E_x(0, y)\,\vec e_x\), orthogonal au plan.</li>
    </ol>
  </div>
  <div class="notice"><strong>Attention.</strong> Seuls comptent les plans qui passent par le point \(M\) où l'on cherche le champ. Le champ magnétique (pseudo-vecteur) obéit aux règles inverses : ne pas les transposer sans réfléchir (chapitre « Magnétostatique »). Un fil, un plan ou un cylindre « infinis » sont des idéalisations, valables loin des bords (§2).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LIGNES ET TUBES DE CHAMP</div>
  <h2>Lire une carte de champ</h2>
  <div class="intro">Une carte de lignes de champ donne en un coup d'œil la direction du champ, son sens et ses régions d'intensité. Savoir la lire, et vérifier qu'elle respecte les symétries, fait partie du programme.</div>
  <div class="def-box">
    Une <strong>ligne de champ</strong> est une courbe tangente en chacun de ses points au champ \(\vec E\), orientée dans le sens de \(\vec E\). Un déplacement élémentaire \(\mathrm{d}\overrightarrow{OM}\) le long d'une ligne vérifie \(\vec E\wedge\mathrm{d}\overrightarrow{OM}=\vec 0\), soit dans un plan \(\dfrac{\mathrm{d}x}{E_x}=\dfrac{\mathrm{d}y}{E_y}\). L'ensemble des lignes s'appuyant sur un petit contour fermé forme un <strong>tube de champ</strong>.
  </div>

<figcaption>Lignes de champ (traits pleins, orientés) et équipotentielles (tirets, pas constant) calculées pour deux charges égales (à gauche) et deux charges opposées (à droite). Les lignes partent des charges positives, coupent les équipotentielles à angle droit et se resserrent là où le champ est intense. À gauche, le milieu des charges est un point de champ nul ; à droite, le plan médiateur est l'équipotentielle V = 0.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Propriétés des cartes de champ électrostatique.</strong>
    <ul>
      <li>Les lignes <strong>partent des charges positives</strong> et aboutissent aux charges négatives (ou à l'infini).</li>
      <li>Deux lignes ne se coupent qu'en un point où le champ est nul ou non défini.</li>
      <li>Aucune ligne de champ électrostatique n'est <strong>fermée</strong> (circulation nulle sur un contour fermé, §7).</li>
      <li>Dans une région sans charge, le flux se conserve le long d'un tube : là où les lignes se <strong>resserrent</strong>, le champ est plus <strong>intense</strong>.</li>
      <li>Un plan de symétrie contient les lignes qui le rencontrent ; un plan d'antisymétrie est traversé à angle droit.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Méthode — vérifier une carte de champ</strong>
    <ol>
      <li>Repérer les charges et leur signe : les lignes doivent en partir (positives) ou y arriver (négatives).</li>
      <li>Repérer les plans de symétrie (lignes contenues) et d'antisymétrie (lignes perpendiculaires).</li>
      <li>Chercher les points où les lignes divergent en croix : ce sont des points de champ nul (milieu de deux charges égales).</li>
      <li>Comparer les densités de lignes pour classer les intensités du champ.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — écartement des lignes et intensité du champ d'un fil</strong>
    <p>Fil infini de charge linéique \(\lambda = 0{,}10\ \mu\text{C·m}^{-1}\). Dans un plan perpendiculaire au fil, les lignes de champ sont des demi-droites issues du fil.</p>
    <ol>
      <li>Tube compris entre deux lignes voisines d'angle \(\Delta\theta\), de hauteur \(h\) le long du fil : à la distance \(r\), sa section vaut \(h\,r\,\Delta\theta\).</li>
      <li>Aucune charge entre \(r_1\) et \(r_2\) : le flux se conserve le long du tube, \(E(r_1)\,h r_1\Delta\theta = E(r_2)\,h r_2\Delta\theta\), donc \(E\propto 1/r\) : on retrouve la loi \(E = \lambda/(2\pi\varepsilon_0 r)\) du §6.</li>
      <li>À \(r_1 = 2{,}0\ \text{cm}\), \(E = \dfrac{2\times9{,}0\times10^{9}\times1{,}0\times10^{-7}}{0{,}020} = 9{,}0\times10^{4}\ \text{V·m}^{-1}\) ; à \(r_2 = 6{,}0\ \text{cm}\), les lignes sont trois fois plus écartées et \(E = 3{,}0\times10^{4}\ \text{V·m}^{-1}\).</li>
    </ol>
    <p>Cette lecture quantitative vaut pour une carte plane d'une distribution invariante par translation (fils parallèles). Dans le plan méridien d'une distribution de révolution (les cartes ci-dessus), la section d'un tube dépend aussi de la distance à l'axe : la densité de lignes ne donne qu'un classement qualitatif.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FLUX ET THÉORÈME DE GAUSS</div>
  <h2>Le flux sortant ne dépend que de la charge intérieure</h2>
  <div class="intro">Le théorème de Gauss relie le flux du champ à travers une surface fermée à la charge qu'elle contient. Combiné aux symétries, il donne le champ des distributions très symétriques sans aucune intégrale de Coulomb.</div>
  <div class="def-box">
    <strong>Flux.</strong> Le flux de \(\vec E\) à travers une surface \(S\) orientée par sa normale unitaire \(\vec n\) est \(\Phi = \iint_S \vec E\cdot\vec n\,\mathrm{d}S\). Pour une surface <strong>fermée</strong>, la normale est orientée vers l'extérieur : on parle de flux <strong>sortant</strong>.
  </div>
  <div class="prop-box">
    <strong>Théorème de Gauss.</strong> Pour toute surface fermée \(\Sigma\), quelle que soit sa forme :
    <div class="formula" data-nom="Théorème de Gauss">$$\oint_{\Sigma}\vec E\cdot\vec n\,\mathrm{d}S = \frac{Q_{\text{int}}}{\varepsilon_0}$$</div>
    où \(Q_{\text{int}}\) est la charge contenue à l'intérieur de \(\Sigma\). Les charges extérieures ont un flux total nul, mais elles contribuent bel et bien au champ en chaque point de \(\Sigma\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de la démonstration</span>
    <span class="prompt">Pourquoi le flux ne dépend-il que de la charge intérieure ?</span>
    <div class="content">
      <p>Pour une charge ponctuelle \(q\) en \(P\), le flux élémentaire à travers \(\mathrm{d}S\) vaut \(\dfrac{q}{4\pi\varepsilon_0}\,\mathrm{d}\Omega\), où \(\mathrm{d}\Omega\) est l'angle solide sous lequel on voit \(\mathrm{d}S\) depuis \(P\) : la décroissance en \(1/r^2\) compense exactement la croissance de l'aire en \(r^2\).</p>
      <p>Si \(P\) est intérieur, les angles solides couvrent tout l'espace : \(\Phi = \dfrac{q}{4\pi\varepsilon_0}\times4\pi = \dfrac{q}{\varepsilon_0}\). Si \(P\) est extérieur, chaque cône élémentaire traverse \(\Sigma\) un nombre pair de fois, avec des contributions opposées : \(\Phi=0\). La superposition étend le résultat à toute distribution. Le théorème repose donc sur la loi en \(1/r^2\) : il vaut aussi pour la gravitation (§11).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Méthode — utiliser le théorème de Gauss</strong>
    <ol>
      <li>Analyser symétries et invariances (§3) : direction de \(\vec E\) et variable dont dépend sa composante.</li>
      <li>Choisir une <strong>surface de Gauss</strong> fermée, passant par \(M\), formée de morceaux où \(\vec E\) est soit normal et de norme constante, soit tangent (flux nul).</li>
      <li>Calculer le flux sortant en fonction de la composante inconnue (par exemple \(4\pi r^2E_r(r)\)).</li>
      <li>Calculer la charge intérieure, en distinguant les cas où \(M\) est dans la distribution ou hors d'elle.</li>
      <li>Égaler, puis vérifier : continuité du champ à la traversée d'une distribution volumique, limite à grande distance.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — charge de la Terre déduite du champ de beau temps</strong>
    <p>Par beau temps, on mesure près du sol un champ vertical dirigé vers le bas, \(E_0 \approx 100\ \text{V·m}^{-1}\) ; on le suppose identique sur tout le globe (rayon \(R = 6{,}4\times10^{6}\ \text{m}\)).</p>
    <ol>
      <li>Symétrie sphérique supposée : \(\vec E = E_r(r)\,\vec e_r\), avec \(E_r(R) = -E_0\) (champ vers le centre).</li>
      <li>Surface de Gauss : sphère concentrique juste au-dessus du sol. Flux sortant : \(4\pi R^2E_r(R) = -4\pi R^2E_0\).</li>
      <li>Théorème de Gauss :
        <div class="formula">$$Q_{\text{int}} = -4\pi\varepsilon_0R^2E_0 = -\frac{(6{,}4\times10^{6})^2\times100}{9{,}0\times10^{9}} \approx -4{,}6\times10^{5}\ \text{C}$$</div></li>
      <li>Densité surfacique correspondante : \(\sigma = -\varepsilon_0E_0 \approx -0{,}9\ \text{nC·m}^{-2}\), soit un électron excédentaire pour environ \(180\ \mu\text{m}^2\) de sol : la Terre est chargée négativement, mais très faiblement.</li>
    </ol>
  </div>
  <div class="notice"><strong>Limite du théorème.</strong> Le théorème de Gauss est toujours vrai, mais il ne <strong>donne</strong> le champ que si les symétries permettent de sortir \(E\) de l'intégrale. Pour un disque, un segment ou un anneau, il est inutilisable : on revient à la superposition (§2). <strong>Erreur classique</strong> : prendre une surface de Gauss qui ne passe pas par le point \(M\) étudié, ou oublier l'un des morceaux de la surface fermée (les bases d'un cylindre).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SPHÈRE, CYLINDRE ET PLAN</div>
  <h2>Les trois distributions de référence</h2>
  <div class="intro">Le programme demande d'établir le champ d'une boule et d'un cylindre infini uniformément chargés en volume, et d'un plan infini chargé en surface. Ces trois calculs suivent exactement la méthode du §5.</div>

  <h3>Boule uniformément chargée en volume</h3>
  <div class="method-box">
    <strong>Établir le champ d'une boule de rayon R et de densité ρ uniforme</strong>
    <ol>
      <li><strong>Symétries</strong> : tout plan contenant \(O\) et \(M\) est plan de symétrie, donc \(\vec E\) est porté par \(\vec e_r\) ; invariance par toute rotation autour de \(O\) : \(\vec E = E_r(r)\,\vec e_r\).</li>
      <li><strong>Surface de Gauss</strong> : sphère de centre \(O\) et de rayon \(r\) ; \(\vec E\) y est normal et de norme constante : \(\Phi = 4\pi r^2E_r(r)\).</li>
      <li><strong>Charge intérieure</strong> : pour \(r \le R\), \(Q_{\text{int}} = \rho\,\tfrac43\pi r^3\) ; pour \(r \ge R\), \(Q_{\text{int}} = Q = \rho\,\tfrac43\pi R^3\).</li>
      <li><strong>Résultat</strong> :
        <div class="formula" data-nom="Champ d'une boule uniformément chargée">$$E_r(r\le R)=\frac{\rho\,r}{3\varepsilon_0}\qquad E_r(r\ge R)=\frac{Q}{4\pi\varepsilon_0\,r^2}$$</div></li>
      <li><strong>Contrôle</strong> : les deux expressions coïncident en \(r = R\) (pas de charge surfacique, champ continu) ; le champ est nul au centre, comme l'impose la symétrie.</li>
    </ol>
  </div>
  <div class="prop-box"><strong>Distribution à symétrie sphérique.</strong> À l'extérieur d'une distribution à symétrie sphérique (\(\rho\) ne dépendant que de \(r\)), de charge totale \(Q\), le champ est celui d'une <strong>charge ponctuelle \(Q\) placée au centre</strong> : la sphère de Gauss de rayon \(r\) contient toute la charge, quelle que soit sa répartition radiale. C'est ce qui justifie de traiter une planète, un noyau ou une goutte chargée comme un point vu de l'extérieur.</div>

  <h3>Cylindre infini uniformément chargé en volume</h3>
  <p>Cylindre d'axe \(Oz\), de rayon \(a\), de densité \(\rho\) uniforme ; on note \(\lambda = \rho\pi a^2\) sa charge par unité de longueur.</p>
  <ol>
    <li>Les plans contenant l'axe et \(M\), et le plan orthogonal à l'axe passant par \(M\), sont plans de symétrie : \(\vec E\) est radial. Invariances par translation selon \(Oz\) et par rotation autour de \(Oz\) : \(\vec E = E_r(r)\,\vec e_r\) en cylindriques.</li>
    <li>Surface de Gauss : cylindre fermé coaxial de rayon \(r\) et de hauteur \(h\). Le flux à travers les bases est nul (\(\vec E \perp \vec n\)) ; le flux latéral vaut \(2\pi r h\,E_r(r)\).</li>
    <li>Charge intérieure : \(\rho\pi r^2h\) si \(r \le a\), \(\lambda h\) si \(r \ge a\).</li>
  </ol>
  <div class="formula" data-nom="Champ d'un cylindre infini uniformément chargé">$$E_r(r\le a)=\frac{\rho\,r}{2\varepsilon_0}\qquad E_r(r\ge a)=\frac{\lambda}{2\pi\varepsilon_0\,r}$$</div>

  </figure>
  <p>Hors du cylindre, on retrouve le champ d'un <strong>fil infini</strong> de densité linéique \(\lambda\) : il décroît en \(1/r\), plus lentement que celui d'une charge ponctuelle.</p>

  <h3>Plan infini chargé en surface</h3>
  <ol>
    <li>Plan \(z = 0\) de densité \(\sigma\) uniforme. Tout plan orthogonal au plan chargé passant par \(M\) est plan de symétrie : \(\vec E\) est porté par \(\vec e_z\). Invariance par translation selon \(x\) et \(y\) : \(\vec E = E_z(z)\,\vec e_z\). Le plan chargé lui-même est plan de symétrie : \(E_z(-z) = -E_z(z)\).</li>
    <li>Surface de Gauss : cylindre droit de section \(S\), de bases en \(z\) et \(-z\). Flux latéral nul ; flux des deux bases \(E_z(z)S + \big(-E_z(-z)\big)S = 2SE_z(z)\).</li>
    <li>Charge intérieure \(\sigma S\), d'où :</li>
  </ol>
  <div class="formula" data-nom="Champ d'un plan infini">$$\vec E=\frac{\sigma}{2\varepsilon_0}\,\vec e_z\ \ (z\gt 0)\qquad \vec E=-\frac{\sigma}{2\varepsilon_0}\,\vec e_z\ \ (z\lt 0)$$</div>
  <p>Le champ est <strong>uniforme</strong> de chaque côté et subit à la traversée du plan un saut \(\sigma/\varepsilon_0\) : c'est l'idéalisation d'une couche mince, dans laquelle le champ varie continûment mais très vite.</p>

  <h3>Récapitulatif</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Distribution</th><th style="text-align:left">Champ intérieur</th><th style="text-align:left">Champ extérieur</th></tr>
    <tr><td>Boule uniforme \(\rho\), rayon \(R\)</td><td>\(E_r=\dfrac{\rho r}{3\varepsilon_0}\)</td><td>\(E_r=\dfrac{Q}{4\pi\varepsilon_0 r^2}\)</td></tr>
    <tr><td>Sphère chargée en surface \(\sigma\)</td><td>\(\vec E=\vec 0\)</td><td>\(E_r=\dfrac{\sigma R^2}{\varepsilon_0 r^2}\)</td></tr>
    <tr><td>Cylindre infini uniforme \(\rho\), rayon \(a\)</td><td>\(E_r=\dfrac{\rho r}{2\varepsilon_0}\)</td><td>\(E_r=\dfrac{\lambda}{2\pi\varepsilon_0 r}\)</td></tr>
    <tr><td>Plan infini \(\sigma\) (en \(z=0\))</td><td>—</td><td>\(E_z=\pm\dfrac{\sigma}{2\varepsilon_0}\) (signe de \(z\))</td></tr>
    <tr><td>Couche uniforme \(\rho\), \(|z|\le e/2\)</td><td>\(E_z=\dfrac{\rho z}{\varepsilon_0}\)</td><td>\(E_z=\pm\dfrac{\rho e}{2\varepsilon_0}\)</td></tr>
  </table></div>

  <div class="method-box">
    <strong>Exemple — boule de densité croissante vers la surface</strong>
    <p>Boule de rayon \(R\) de densité \(\rho(r)=\rho_0\,r/R\). Symétrie sphérique, sphère de Gauss de rayon \(r\).</p>
    <ol>
      <li>Pour \(r\le R\) : \(Q_{\text{int}}=\displaystyle\int_0^r\rho_0\frac{r'}{R}\,4\pi r'^2\,\mathrm{d}r'=\frac{\pi\rho_0r^4}{R}\), d'où \(E_r=\dfrac{\rho_0\,r^2}{4\varepsilon_0R}\).</li>
      <li>Pour \(r\ge R\) : \(Q=\pi\rho_0R^3\) et \(E_r=\dfrac{\rho_0R^3}{4\varepsilon_0r^2}\), champ d'une charge ponctuelle \(Q\) au centre.</li>
      <li>Contrôle : les deux expressions valent \(\rho_0R/(4\varepsilon_0)\) en \(r = R\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CIRCULATION ET POTENTIEL ÉLECTROSTATIQUE</div>
  <h2>Un champ qui dérive d'un potentiel</h2>
  <div class="intro">La circulation du champ électrostatique ne dépend pas du chemin suivi : le champ dérive d'un potentiel scalaire \(V\). Une seule fonction suffit alors à décrire les trois composantes du champ, et la tension entre deux points devient la circulation du champ.</div>
  <h3>Circulation et potentiel</h3>
  <p>Pour une charge ponctuelle, la circulation élémentaire est une différentielle exacte :</p>
  <div class="formula">$$\vec E\cdot\mathrm{d}\vec\ell=\frac{q}{4\pi\varepsilon_0}\,\frac{\mathrm{d}r}{r^2}=-\mathrm{d}\Big(\frac{q}{4\pi\varepsilon_0r}\Big)$$</div>
  <p>Par superposition, c'est vrai pour toute distribution.</p>
  <div class="prop-box">
    <strong>Potentiel électrostatique.</strong> La circulation de \(\vec E\) entre deux points ne dépend pas du chemin ; elle est nulle sur tout contour fermé. Il existe une fonction \(V\) (en volts), définie à une constante près, telle que
    <div class="formula" data-nom="Champ et potentiel">$$\mathrm{d}V=-\vec E\cdot\mathrm{d}\vec\ell\qquad\vec E=-\overrightarrow{\operatorname{grad}}\,V\qquad V(A)-V(B)=\int_A^B\vec E\cdot\mathrm{d}\vec\ell$$</div>
    Le champ est dirigé vers les <strong>potentiels décroissants</strong>. La tension \(U_{AB} = V(A) - V(B)\) est la circulation du champ de \(A\) à \(B\).
  </div>
  <p>Expressions du gradient (celles en cylindriques et sphériques sont <strong>fournies</strong> aux concours) :</p>
  <div class="formula">$$\overrightarrow{\operatorname{grad}}\,V=\frac{\partial V}{\partial x}\vec e_x+\frac{\partial V}{\partial y}\vec e_y+\frac{\partial V}{\partial z}\vec e_z$$
  $$\overrightarrow{\operatorname{grad}}\,V=\frac{\partial V}{\partial r}\vec e_r+\frac{1}{r}\frac{\partial V}{\partial \theta}\vec e_\theta+\frac{\partial V}{\partial z}\vec e_z\quad\text{(cylindriques)}$$
  $$\overrightarrow{\operatorname{grad}}\,V=\frac{\partial V}{\partial r}\vec e_r+\frac{1}{r}\frac{\partial V}{\partial \theta}\vec e_\theta+\frac{1}{r\sin\theta}\frac{\partial V}{\partial \varphi}\vec e_\varphi\quad\text{(sphériques)}$$</div>

  <h3>Potentiel d'une distribution</h3>
  <div class="prop-box">
    Avec la référence \(V = 0\) à l'infini (distribution bornée) :
    <div class="formula" data-nom="Potentiel de charges ponctuelles">$$V(M)=\frac{1}{4\pi\varepsilon_0}\sum_i\frac{q_i}{P_iM}\qquad V(M)=\frac{1}{4\pi\varepsilon_0}\iiint_{\mathcal D}\frac{\rho(P)\,\mathrm{d}\tau}{PM}$$</div>
    Sommer des scalaires est bien plus simple que sommer des vecteurs : on calcule souvent \(V\), puis \(\vec E = -\overrightarrow{\operatorname{grad}}\,V\).
  </div>
  <p><strong>Distributions infinies.</strong> Pour un fil, un plan ou un cylindre infinis, ces intégrales divergent : on calcule d'abord \(\vec E\) (Gauss), puis on intègre en prenant la référence à distance finie. Fil infini : \(V(r)=-\dfrac{\lambda}{2\pi\varepsilon_0}\ln\dfrac{r}{r_0}\) ; plan infini : \(V(z) = -\dfrac{\sigma|z|}{2\varepsilon_0}\) (référence sur le plan). Le potentiel reste continu à la traversée d'une surface chargée.</p>

  <div class="method-box">
    <strong>Exemple — potentiel d'une boule uniformément chargée</strong>
    <ol>
      <li>À l'extérieur : \(E_r = \dfrac{Q}{4\pi\varepsilon_0 r^2}\) et \(V(\infty) = 0\) donnent \(V(r) = \dfrac{Q}{4\pi\varepsilon_0 r}\) ; en surface, \(V(R) = \dfrac{Q}{4\pi\varepsilon_0 R}\).</li>
      <li>À l'intérieur : \(\dfrac{\mathrm{d}V}{\mathrm{d}r} = -E_r = -\dfrac{\rho r}{3\varepsilon_0}\), donc \(V(r) = -\dfrac{\rho r^2}{6\varepsilon_0} + C\).</li>
      <li>Continuité en \(r = R\) : \(C = V(R) + \dfrac{\rho R^2}{6\varepsilon_0} = \dfrac{\rho R^2}{2\varepsilon_0}\), d'où \(V(r)=\dfrac{\rho}{6\varepsilon_0}\big(3R^2-r^2\big)\).</li>
      <li>Au centre, \(V(0)=\tfrac32\,V(R)\) : le potentiel est maximal au centre d'une boule chargée positivement, le champ « descend » vers l'extérieur.</li>
    </ol>
  </div>

  <h3>Topographie : équipotentielles et lignes de champ</h3>
  <div class="prop-box">
    <ul>
      <li>Sur une équipotentielle, \(\mathrm{d}V=-\vec E\cdot\mathrm{d}\vec\ell=0\) : les <strong>équipotentielles sont orthogonales aux lignes de champ</strong>.</li>
      <li>Le champ va des hauts potentiels vers les bas potentiels ; \(\|\vec E\|\approx\Delta V/\Delta n\), où \(\Delta n\) est l'écart entre deux équipotentielles voisines.</li>
      <li>Équipotentielles tracées à pas \(\Delta V\) constant : là où elles se resserrent, le champ est intense (voir les cartes du §4).</li>
      <li>Pour une distribution bornée avec \(V(\infty)=0\), un plan d'antisymétrie est l'équipotentielle \(V=0\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — du potentiel au champ</strong>
    <p>Dans une région, \(V(x, y) = V_0\,\dfrac{x^2-y^2}{a^2}\) (potentiel entre quatre électrodes hyperboliques).</p>
    <ol>
      <li>\(\vec E = -\overrightarrow{\operatorname{grad}}\,V = -\dfrac{2V_0}{a^2}\big(x\,\vec e_x - y\,\vec e_y\big)\).</li>
      <li>Les équipotentielles sont les hyperboles \(x^2 - y^2 = \text{cste}\) ; les lignes de champ, orthogonales, sont les hyperboles \(xy = \text{cste}\).</li>
      <li>Le champ est nul à l'origine, qui n'est pourtant ni un maximum ni un minimum de \(V\) : c'est un col (§10).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CONDENSATEUR PLAN</div>
  <h2>Deux plans chargés en regard</h2>
  <div class="intro">Un condensateur plan est modélisé par deux plans parallèles infinis de densités opposées \(+\sigma\) et \(-\sigma\), séparés de \(e\). La superposition des deux champs de plans donne tout : champ, tension, capacité et énergie.</div>

  <div class="prop-box">
    <strong>Champ du condensateur plan</strong> (effets de bord négligés) : entre les armatures, les deux champs \(\sigma/2\varepsilon_0\) s'ajoutent ; à l'extérieur, ils se compensent.
    <div class="formula" data-nom="Champ d'un condensateur plan">$$\vec E=\frac{\sigma}{\varepsilon_0}\,\vec u_{+\to-}\ \text{ entre les armatures}\qquad\vec E=\vec 0\ \text{ à l'extérieur}$$</div>
  </div>
  <div class="method-box">
    <strong>Établir la capacité</strong>
    <ol>
      <li>Tension : \(U = V_+ - V_- = \displaystyle\int_+^-\vec E\cdot\mathrm{d}\vec\ell = E\,e = \dfrac{\sigma e}{\varepsilon_0}\).</li>
      <li>Charge de l'armature positive d'aire \(S\) : \(Q = \sigma S\).</li>
      <li>Capacité \(C = Q/U\) :
        <div class="formula" data-nom="Capacité d'un condensateur plan">$$C=\frac{\varepsilon_0 S}{e}$$</div></li>
    </ol>
    <p>Le modèle est valable si \(e \ll \sqrt S\) : les lignes de champ ne sont déformées qu'au voisinage des bords.</p>
  </div>
  <h3>Énergie stockée</h3>
  <div class="prop-box">
    L'énergie stockée \(W_e=\dfrac{Q^2}{2C}=\dfrac12CU^2\) est localisée dans le champ, avec la densité volumique d'énergie électrique
    <div class="formula" data-nom="Densité d'énergie électrique">$$w_e=\frac{\varepsilon_0E^2}{2}\qquad\text{(J·m}^{-3}\text{)}$$</div>
    Vérification : \(\dfrac{\varepsilon_0}{2}\Big(\dfrac{U}{e}\Big)^2\times Se=\dfrac12\,\dfrac{\varepsilon_0S}{e}\,U^2\).
  </div>
  <div class="method-box">
    <strong>Exemple — ordres de grandeur d'un condensateur à air</strong>
    <p>Armatures carrées de 10 cm de côté (\(S = 10^{-2}\ \text{m}^2\)), écartées de \(e = 1\ \text{mm}\), sous \(U = 1\ \text{kV}\).</p>
    <ol>
      <li>\(C = \dfrac{8{,}85\times10^{-12}\times10^{-2}}{10^{-3}} \approx 89\ \text{pF}\) : les capacités géométriques dans l'air sont petites.</li>
      <li>\(E = U/e = 1\ \text{MV·m}^{-1}\), un tiers du champ disruptif de l'air : on ne peut guère monter au-delà de 3 kV.</li>
      <li>\(Q = CU \approx 89\ \text{nC}\), \(\sigma = Q/S \approx 8{,}9\ \text{µC·m}^{-2}\) ; énergie \(W_e = \tfrac12 CU^2 \approx 44\ \text{µJ}\).</li>
    </ol>
    <p>Pour stocker davantage, on intercale un isolant (diélectrique) : \(\varepsilon_0\) est remplacé par \(\varepsilon_0\varepsilon_r\) (résultat admis), et le champ de claquage est plus élevé.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ÉNERGIE POTENTIELLE D'UNE CHARGE</div>
  <h2>Une charge dans un champ extérieur</h2>
  <div class="intro">Le champ électrostatique dérive d'un potentiel : la force qu'il exerce sur une charge est conservative, et l'énergie potentielle de la charge se lit directement sur le potentiel.</div>
  <div class="prop-box">
    <strong>Énergie potentielle électrostatique.</strong> Une charge ponctuelle \(q\) placée en \(M\) dans un champ électrostatique extérieur de potentiel \(V\) possède l'énergie potentielle
    <div class="formula" data-nom="Énergie potentielle électrostatique">$$E_p(M)=q\,V(M)$$</div>
    En effet, le travail élémentaire de la force est \(\delta W = q\vec E\cdot\mathrm{d}\vec\ell = -q\,\mathrm{d}V = -\mathrm{d}(qV)\). Le travail de \(A\) à \(B\) vaut \(W_{AB}=q\,(V_A-V_B)\), indépendamment du chemin.
  </div>
  <p>Énergie d'interaction de deux charges ponctuelles distantes de \(r\), nulle à séparation infinie (à compter une seule fois) : \(E_p=\dfrac{q_1\,q_2}{4\pi\varepsilon_0\,r}\). L'<strong>électron-volt</strong>, \(1\ \text{eV}=1{,}602\times10^{-19}\ \text{J}\), est l'énergie gagnée par une charge \(e\) qui descend une différence de potentiel de 1 V.</p>
  <div class="method-box">
    <strong>Exemple — électron accéléré par une tension</strong>
    <p>Un électron part au repos de la cathode (\(V = 0\)) et atteint l'anode (\(V = U = 2\ \text{kV}\)), le poids étant négligeable.</p>
    <ol>
      <li>Conservation de l'énergie mécanique : \(\tfrac12mv^2 + (-e)\times U = 0 + (-e)\times 0\), donc \(\tfrac12mv^2 = eU\).</li>
      <li>Vitesse d'arrivée :
        <div class="formula">$$v = \sqrt{\frac{2eU}{m}} = \sqrt{\frac{2\times1{,}6\times10^{-19}\times2\times10^{3}}{9{,}1\times10^{-31}}} \approx 2{,}7\times10^{7}\ \text{m·s}^{-1}$$</div>
        soit 9 % de la vitesse de la lumière : l'approche non relativiste reste acceptable.</li>
      <li>L'électron, de charge négative, remonte les potentiels : il « tombe » vers le potentiel le plus élevé.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · MAXWELL-GAUSS, POISSON ET LAPLACE</div>
  <h2>Les lois locales de l'électrostatique</h2>
  <div class="intro">Appliqué à un volume infinitésimal, le théorème de Gauss devient une relation locale entre le champ et la densité de charge au même point. Avec \(\vec E = -\overrightarrow{\operatorname{grad}}\,V\), il donne une équation aux dérivées partielles pour le potentiel seul.</div>
  <div class="prop-box">
    <strong>Équation de Maxwell-Gauss</strong> et circulation conservative, sous forme locale :
    <div class="formula" data-nom="Maxwell-Gauss">$$\operatorname{div}\vec E=\frac{\rho}{\varepsilon_0}\qquad\overrightarrow{\operatorname{rot}}\,\vec E=\vec 0$$</div>
    En cartésiennes :
    <div class="formula">$$\operatorname{div}\vec E=\frac{\partial E_x}{\partial x}+\frac{\partial E_y}{\partial y}+\frac{\partial E_z}{\partial z}$$</div>
    Le théorème de Green-Ostrogradski \(\oint_\Sigma\vec E\cdot\vec n\,\mathrm{d}S=\iiint_V\operatorname{div}\vec E\,\mathrm{d}\tau\) fait le lien avec le théorème de Gauss.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Bilan de flux</span>
    <span class="prompt">Retrouver la forme locale sur une tranche, puis sur une coquille sphérique.</span>
    <div class="content">
      <p><strong>Tranche plane</strong> entre \(z\) et \(z+\mathrm{d}z\), de section \(S\), pour \(\vec E = E_z(z)\,\vec e_z\) : flux sortant \(\big[E_z(z+\mathrm{d}z) - E_z(z)\big]S\), charge \(\rho S\,\mathrm{d}z\), d'où \(\dfrac{\mathrm{d}E_z}{\mathrm{d}z} = \dfrac{\rho}{\varepsilon_0}\).</p>
      <p><strong>Coquille sphérique</strong> entre \(r\) et \(r+\mathrm{d}r\), pour \(\vec E = E_r(r)\,\vec e_r\) : flux sortant \(\mathrm{d}\big(4\pi r^2E_r\big)\), charge \(\rho\,4\pi r^2\,\mathrm{d}r\), d'où \(\dfrac{1}{r^2}\dfrac{\mathrm{d}(r^2E_r)}{\mathrm{d}r}=\dfrac{\rho}{\varepsilon_0}\). En cylindriques : \(\dfrac{1}{r}\dfrac{\mathrm{d}(rE_r)}{\mathrm{d}r}=\dfrac{\rho}{\varepsilon_0}\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Équations de Poisson et de Laplace.</strong> En reportant \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) dans Maxwell-Gauss (\(\operatorname{div}\overrightarrow{\operatorname{grad}} = \Delta\)) :
    <div class="formula" data-nom="Équation de Poisson">$$\Delta V+\frac{\rho}{\varepsilon_0}=0\qquad\text{et, là où }\rho=0 :\ \ \Delta V=0\ \ \text{(Laplace)}$$</div>
    En cartésiennes :
    <div class="formula">$$\Delta V=\frac{\partial^2V}{\partial x^2}+\frac{\partial^2V}{\partial y^2}+\frac{\partial^2V}{\partial z^2}$$</div>
    Pour un potentiel ne dépendant que de \(r\) (expressions fournies) : \(\Delta V=\dfrac{1}{r}\dfrac{\mathrm{d}}{\mathrm{d}r}\Big(r\dfrac{\mathrm{d}V}{\mathrm{d}r}\Big)\) en cylindriques, \(\Delta V=\dfrac{1}{r^2}\dfrac{\mathrm{d}}{\mathrm{d}r}\Big(r^2\dfrac{\mathrm{d}V}{\mathrm{d}r}\Big)\) en sphériques.
  </div>
  <p>Solutions de l'équation de Laplace à une variable : \(V = Az + B\) (plane), \(V = A\ln r + B\) (cylindrique), \(V = \dfrac{A}{r} + B\) (sphérique). Les constantes viennent des <strong>conditions aux limites</strong> : potentiels imposés, potentiel fini sur l'axe ou au centre, continuité de \(V\). La solution de l'équation de Poisson est <strong>unique</strong> dès que \(V\) est imposé sur toute la frontière du domaine (admis) : une solution « devinée » qui vérifie l'équation et les conditions aux limites est la bonne.</p>
  <div class="method-box">
    <strong>Exemple — couche plane uniformément chargée, par l'équation de Poisson</strong>
    <p>Couche \(|z| \le e/2\) de densité \(\rho\) uniforme, infinie selon \(x\) et \(y\) : \(V = V(z)\) et \(V(-z) = V(z)\) (plan \(z = 0\) de symétrie).</p>
    <ol>
      <li>Dans la couche : \(V'' = -\rho/\varepsilon_0\), donc \(V' = -\rho z/\varepsilon_0\) (la constante est nulle car \(V'\) est impaire) et \(E_z = -V' = \rho z/\varepsilon_0\).</li>
      <li>Hors de la couche (\(z \gt e/2\)) : \(V'' = 0\), \(V' = \text{cste}\) ; la continuité du champ (aucune charge surfacique) en \(z = e/2\) donne \(E_z = \rho e/(2\varepsilon_0)\).</li>
      <li>On retrouve le tableau du §6, et \(V\) est une parabole dans la couche, raccordée à deux droites.</li>
    </ol>
  </div>
  <div class="notice"><strong>Conséquence de l'équation de Laplace</strong> : dans une région vide de charges, \(V\) n'a ni maximum ni minimum local. Une charge ne peut donc pas être en équilibre stable sous l'effet des seules forces électrostatiques (théorème d'Earnshaw) : les pièges à ions utilisent des champs variables.</div>
  <h3>Traversée d'une surface chargée</h3>
  <p>À la traversée d'une surface portant la densité \(\sigma\), la composante tangentielle du champ est continue et la composante normale subit le saut \(\sigma/\varepsilon_0\) : \(\vec E_2-\vec E_1=\dfrac{\sigma}{\varepsilon_0}\,\vec n_{1\to2}\). Cette <strong>relation de passage</strong> est fournie par les énoncés quand elle est utile ; on la vérifie sur le plan infini (§6).</p>
</div>

<div class="course-section">
  <div class="sec-num">§11 · ANALOGIE GRAVITATIONNELLE</div>
  <h2>Le théorème de Gauss pour la gravitation</h2>
  <div class="intro">La loi de la gravitation universelle a la même structure en \(1/r^2\) que la loi de Coulomb : tous les résultats fondés sur le théorème de Gauss se transposent par un dictionnaire.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Électrostatique</th><th style="text-align:left">Gravitation</th></tr>
    <tr><td>charge \(q\), densité \(\rho\)</td><td>masse \(m\), masse volumique \(\mu\)</td></tr>
    <tr><td>\(\dfrac{1}{4\pi\varepsilon_0}\)</td><td>\(-G\) \((G=6{,}67\times10^{-11}\ \text{SI})\)</td></tr>
    <tr><td>champ \(\vec E\), potentiel \(V\)</td><td>champ \(\vec{\mathcal G}\), potentiel \(V_g\), \(\vec{\mathcal G}=-\overrightarrow{\operatorname{grad}}\,V_g\)</td></tr>
    <tr><td>\(\oint\vec E\cdot\vec n\,\mathrm{d}S=\dfrac{Q_{\text{int}}}{\varepsilon_0}\)</td><td>\(\oint\vec{\mathcal G}\cdot\vec n\,\mathrm{d}S=-4\pi G\,M_{\text{int}}\)</td></tr>
    <tr><td>\(E_p=\dfrac{q_1q_2}{4\pi\varepsilon_0r}\)</td><td>\(E_p=-\dfrac{Gm_1m_2}{r}\)</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Astre à symétrie sphérique</strong> (masse \(M\), rayon \(R\)), sphère de Gauss de rayon \(r\) :
    <div class="formula" data-nom="Champ de gravitation d'un astre">$$r\ge R:\ \vec{\mathcal G}=-\frac{GM}{r^2}\,\vec e_r\qquad r\le R\ \text{(astre homogène)} :\ \vec{\mathcal G}=-\frac{GM\,r}{R^3}\,\vec e_r$$</div>
    À l'extérieur, tout se passe comme si la masse était concentrée au centre. Pour la Terre, \(g_0=GM/R^2\approx9{,}8\ \text{m·s}^{-2}\).
  </div>
  <div class="method-box">
    <strong>Exemple — où la pesanteur vaut-elle g₀/2 ?</strong>
    <p>Pour un astre homogène : à l'intérieur, \(g = g_0\,r/R\), donc \(g = g_0/2\) en \(r = R/2\) ; à l'extérieur, \(g = g_0R^2/r^2\), donc \(g = g_0/2\) en \(r = \sqrt2\,R\), soit une altitude de \(0{,}41\,R\approx2\,600\ \text{km}\) pour la Terre.</p>
  </div>
  <div class="notice"><strong>Différences essentielles.</strong> La masse est toujours positive : la gravitation est toujours attractive, les lignes de champ convergent vers les masses, il n'existe pas de plan d'antisymétrie ni d'écrantage. La Terre réelle n'est pas homogène : son noyau dense fait légèrement croître \(g\) quand on descend dans le manteau.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · CAPACITÉ NUMÉRIQUE</div>
  <h2>Tracer lignes de champ et équipotentielles en Python</h2>
  <p>On maille le plan, on calcule \(V\) par superposition sur la grille, on trace les équipotentielles avec <code>contour</code>, puis le champ \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) avec <code>np.gradient</code> et <code>streamplot</code>. Exemple : deux charges positives égales, dont la carte montre un point de champ nul au milieu, traversé par une équipotentielle en « 8 ».</p>
  <pre class="codeblock">import numpy as np
import matplotlib.pyplot as plt
k = 9e9                                      # 1/(4 pi eps0) en SI
charges = [(1e-9, -0.5, 0.0), (1e-9, 0.5, 0.0)]    # (q, xq, yq) en C et m
eps = 0.02                                   # rayon de lissage (m)
x = np.linspace(-2, 2, 401)
y = np.linspace(-1.5, 1.5, 301)
X, Y = np.meshgrid(x, y)                     # X[i, j] = x[j] ; Y[i, j] = y[i]
V = np.zeros_like(X)
for q, xq, yq in charges:
    d = np.sqrt((X - xq)**2 + (Y - yq)**2 + eps**2)   # jamais nulle
    V += k * q / d
dVdy, dVdx = np.gradient(V, y, x)            # axe 0 = lignes = y, puis axe 1 = x
Ex, Ey = -dVdx, -dVdy                        # E = -grad V
plt.contour(X, Y, V, levels=np.arange(4, 101, 4), linestyles='dotted')
plt.streamplot(X, Y, Ex, Ey)
plt.axis('equal')
plt.show()</pre>
  <p>Le terme <code>eps**2</code> sous la racine (lissage) évite la division par zéro quand un nœud tombe sur une charge ; il ne modifie le potentiel qu'à des distances de l'ordre de <code>eps</code>. Pour un problème de Laplace avec potentiels imposés sur des bords, on discrétise l'équation : en chaque nœud intérieur, \(V\) est la moyenne de ses quatre voisins, et l'on itère cette moyenne jusqu'à convergence (méthode de relaxation).</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Conducteurs, autres condensateurs, dipôle</h2>
  <div class="intro">Ces résultats ne sont plus exigibles en PT depuis 2021 ; ils éclairent des situations rencontrées dans les énoncés, où ils sont alors guidés.</div>
  <h3>Effet de pointe</h3>
  <p>Un conducteur à l'équilibre est équipotentiel et le champ, juste à l'extérieur, vaut \(\sigma/\varepsilon_0\) (relation de passage, champ nul à l'intérieur). Deux sphères conductrices de rayons \(R_1\gg R_2\), éloignées et reliées par un fil, sont au même potentiel \(V\) : chacune porte \(Q_i=4\pi\varepsilon_0R_iV\) et le champ à sa surface vaut \(E_i=V/R_i\). Plus le rayon de courbure est petit, plus le champ est intense : une pointe de 1 mm portée à quelques kilovolts atteint le champ disruptif de l'air (effluves, paratonnerre).</p>
  <h3>Condensateurs cylindrique et sphérique</h3>
  <p>Même démarche qu'au §8 (charge \(+Q\) sur l'armature intérieure, champ par Gauss, tension par circulation) : \(C=\dfrac{2\pi\varepsilon_0L}{\ln(R_2/R_1)}\) (cylindrique, longueur \(L\)) et \(C=\dfrac{4\pi\varepsilon_0R_1R_2}{R_2-R_1}\) (sphérique). Si l'écart est petit devant les rayons, on retrouve \(\varepsilon_0S/e\). Sphère isolée : \(C=4\pi\varepsilon_0R\), soit 0,7 mF seulement pour la Terre. Câble coaxial (polyéthylène) : environ 100 pF·m⁻¹.</p>
  <h3>Dipôle électrostatique</h3>
  <p>Charges \(-q\) en \(N\) et \(+q\) en \(P\), moment dipolaire \(\vec p=q\,\overrightarrow{NP}\) (unité pratique, le debye, \(3{,}34\times10^{-30}\ \text{C·m}\) ; eau : 1,85 D). À grande distance \(r\) devant \(NP\) :</p>
  <div class="formula">$$V(M)=\frac{p\cos\theta}{4\pi\varepsilon_0r^2}\qquad E_r=\frac{2p\cos\theta}{4\pi\varepsilon_0r^3}\qquad E_\theta=\frac{p\sin\theta}{4\pi\varepsilon_0r^3}$$</div>
  <p>Le potentiel décroît en \(1/r^2\) et le champ en \(1/r^3\), plus vite que pour une charge. Dans un champ uniforme \(\vec E_0\), le dipôle rigide subit le couple \(\vec\Gamma=\vec p\wedge\vec E_0\) et possède l'énergie \(E_p=-\vec p\cdot\vec E_0\) : il tend à s'aligner sur le champ.</p>
</div>

<template class="pan-tpl" data-panneau="es2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉLECTROSTATIQUE (2ᵉ ANNÉE)</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles du chapitre : prévoir la forme du champ par les symétries, le calculer par superposition ou par le théorème de Gauss (gravitation comprise), exploiter les lois locales, passer du champ au potentiel, établir la capacité d'un condensateur plan, utiliser l'énergie potentielle \(qV\), lire et tracer une carte de champ.</div>

  <div class="method-box"><strong>Méthode 1 — Prévoir la direction du champ et ses variables</strong>
    <ol>
      <li><span class="step">Point courant.</span> Choisir un point \(M\) <em>quelconque</em> et le repérer dans le système de coordonnées adapté à la géométrie (cartésiennes, cylindriques, sphériques).</li>
      <li><span class="step">Symétries → direction.</span> Chercher les plans de symétrie et d'antisymétrie de la distribution <em>passant par \(M\)</em> : \(\vec E(M)\) est contenu dans chaque plan de symétrie (donc porté par l'intersection de deux d'entre eux) et orthogonal à un plan d'antisymétrie.</li>
      <li><span class="step">Invariances → variables.</span> Translation selon un axe : pas de dépendance en cette coordonnée ; rotation autour d'un axe ou d'un point : pas de dépendance angulaire.</li>
      <li><span class="step">Conclusion écrite.</span> Écrire explicitement, par exemple \(\vec E(M)=E_r(r)\,\vec e_r\), avant tout calcul.</li>
    </ol>
    <p><em>Exemple éclair :</em> charges \(+q\) en \((\pm a,0,0)\), point \(M(0,0,z)\). Les plans \(x=0\) et \(y=0\) sont de symétrie et contiennent \(M\) : \(\vec E(M)=E_z\,\vec e_z\), et seules les composantes axiales des deux contributions s'ajoutent, \(E_z=\dfrac{2qz}{4\pi\varepsilon_0(a^2+z^2)^{3/2}}\). Pour \(q=1{,}0\ \text{nC}\), \(a=z=10\ \text{cm}\) : \(E_z\approx6{,}4\times10^{2}\ \text{V·m}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une invariance ne dit rien sur la direction, une symétrie rien sur les variables ; un plan qui ne contient pas \(M\) ne dit rien sur \(\vec E(M)\). Pour \(\vec E=E_z(z)\,\vec e_z\), si le plan \(z=0\) est de symétrie, \(E_z\) est <strong>impaire</strong> ; s'il est d'antisymétrie, \(E_z\) est <strong>paire</strong>.</div>

  <div class="method-box"><strong>Méthode 2 — Calculer un champ par superposition</strong>
    <ol>
      <li><span class="step">Découper.</span> Décomposer la distribution en charges ponctuelles, ou en éléments dont on connaît le champ (charge \(\mathrm{d}q=\lambda\,\mathrm{d}\ell\), anneau, plan, fil…) ; exprimer \(\mathrm{d}q\) avec la densité.</li>
      <li><span class="step">Symétries d'abord.</span> Repérer les composantes qui se compensent (méthode 1) : on ne calcule que la composante qui subsiste.</li>
      <li><span class="step">Projeter.</span> Écrire la contribution d'un élément sur cette composante (facteur \(\cos\alpha\) entre \(\overrightarrow{PM}\) et l'axe), puis sommer ou intégrer.</li>
      <li><span class="step">Contrôler.</span> Limites : à grande distance, champ d'une charge ponctuelle portant la charge totale ; près d'une distribution étendue, champ du modèle infini.</li>
    </ol>
    <p><em>Exemple éclair :</em> anneau de rayon \(R\), de charge \(Q\), point de l'axe à la cote \(z\). Chaque élément est à la distance \(\sqrt{R^2+z^2}\) et contribue avec le facteur \(z/\sqrt{R^2+z^2}\) : \(E_z=\dfrac{Qz}{4\pi\varepsilon_0(R^2+z^2)^{3/2}}\). Pour \(Q=10\ \text{nC}\), \(R=z=5{,}0\ \text{cm}\) : \(E_z\approx1{,}3\times10^{4}\ \text{V·m}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : additionner les normes des champs, ou oublier le facteur de projection. On additionne des <strong>vecteurs</strong> ; le potentiel, lui, est un scalaire qui s'additionne directement (méthode 5).</div>

  <div class="method-box"><strong>Méthode 3 — Mettre en œuvre le théorème de Gauss (gravitation comprise)</strong>
    <ol>
      <li><span class="step">Analyse.</span> Symétries et invariances (méthode 1) : il faut un champ de norme constante sur des surfaces simples.</li>
      <li><span class="step">Surface.</span> Choisir une surface <strong>fermée</strong> passant par \(M\), formée de morceaux où \(\vec E\) est soit normal et de norme constante, soit tangent : sphère de rayon \(r\) ; cylindre coaxial fermé de rayon \(r\) et de hauteur \(h\) ; cylindre « à cheval » sur un plan, de bases en \(\pm z\).</li>
      <li><span class="step">Flux.</span> Traiter séparément chaque face (bases, face latérale) : contribution nulle là où \(\vec E\perp\vec n\), produit « composante × aire » ailleurs.</li>
      <li><span class="step">Charge intérieure.</span> Intégrer la densité avec la couche élémentaire adaptée (\(4\pi r^2\,\mathrm{d}r\), \(2\pi rh\,\mathrm{d}r\), \(S\,\mathrm{d}z\)), en distinguant \(M\) intérieur et \(M\) extérieur.</li>
      <li><span class="step">Contrôles.</span> Continuité de \(E\) en l'absence de charge surfacique, comportement à grande distance, homogénéité.</li>
      <li><span class="step">Gravitation.</span> Même démarche avec \(\oint\vec{\mathcal G}\cdot\vec n\,\mathrm{d}S=-4\pi G\,M_{\text{int}}\) : le champ est dirigé vers les masses.</li>
    </ol>
    <p><em>Exemple éclair :</em> coquille \(R_1\le r\le R_2\) de densité \(\rho\) uniforme. Pour \(r\lt R_1\), \(Q_{\text{int}}=0\) : \(\vec E=\vec 0\) ; pour \(r\ge R_2\), \(E_r=\dfrac{\rho\,(R_2^3-R_1^3)}{3\varepsilon_0r^2}\). Avec \(\rho=1{,}0\ \mu\text{C·m}^{-3}\), \(R_1=1{,}0\ \text{cm}\), \(R_2=2{,}0\ \text{cm}\) : \(E(R_2)\approx6{,}6\times10^{2}\ \text{V·m}^{-1}\). Version gravitationnelle : à la surface de la Lune (\(M=7{,}35\times10^{22}\ \text{kg}\), \(R=1\,737\ \text{km}\)), \(g=GM/R^2\approx1{,}6\ \text{m·s}^{-2}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(Q_{\text{int}}=\rho\times\text{volume}\) pour une densité variable ; oublier les bases du cylindre (surface non fermée) ; oublier le signe de \(E_z\) de l'autre côté d'un plan ; utiliser Gauss pour un disque ou un segment, où le champ n'est constant sur aucune surface simple.</div>

  <div class="method-box"><strong>Méthode 4 — Exploiter l'équation de Maxwell-Gauss</strong>
    <ol>
      <li><span class="step">Réduction.</span> Se ramener à une composante et une variable (méthode 1).</li>
      <li><span class="step">Intégration.</span> Écrire la divergence adaptée et intégrer : \(\dfrac{\mathrm{d}E_z}{\mathrm{d}z}=\dfrac{\rho}{\varepsilon_0}\), \(\dfrac{1}{r}\dfrac{\mathrm{d}(rE_r)}{\mathrm{d}r}=\dfrac{\rho}{\varepsilon_0}\) ou \(\dfrac{1}{r^2}\dfrac{\mathrm{d}(r^2E_r)}{\mathrm{d}r}=\dfrac{\rho}{\varepsilon_0}\).</li>
      <li><span class="step">Constantes.</span> Champ fini au centre ou sur l'axe ; \(E_z(0)=0\) si \(z=0\) est plan de symétrie ; continuité de \(E\) en l'absence de charge surfacique ; relation de passage (fournie) à la traversée d'une surface chargée.</li>
      <li><span class="step">Problème inverse.</span> Si l'on connaît \(\vec E\), la divergence donne directement \(\rho\) (« quelle distribution crée ce champ ? »).</li>
    </ol>
    <p><em>Exemple éclair :</em> le champ \(\vec E=E_0\,(r/a)^2\,\vec e_r\) (sphériques) est créé par \(\rho=\dfrac{\varepsilon_0}{r^2}\dfrac{\mathrm{d}}{\mathrm{d}r}\Big(\dfrac{E_0r^4}{a^2}\Big)=\dfrac{4\varepsilon_0E_0\,r}{a^2}\) ; pour \(E_0=1{,}0\ \text{kV·m}^{-1}\) et \(a=10\ \text{cm}\), \(\rho(a)\approx3{,}5\times10^{-7}\ \text{C·m}^{-3}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : garder \(r^2E_r=A\neq0\) en intégrant depuis le centre revient à placer une charge ponctuelle en \(O\) ; la constante est nulle si le champ doit rester fini.</div>

  <div class="method-box"><strong>Méthode 5 — Passer du champ au potentiel, et inversement</strong>
    <ol>
      <li><span class="step">Champ → potentiel.</span> \(\mathrm{d}V=-\vec E\cdot\mathrm{d}\vec\ell\) : pour \(\vec E=E_r(r)\,\vec e_r\), seul \(\mathrm{d}r\) intervient et \(\mathrm{d}V=-E_r\,\mathrm{d}r\) ; intégrer zone par zone (une primitive par zone).</li>
      <li><span class="step">Constantes.</span> Référence \(V(\infty)=0\) si la distribution est bornée, sinon \(V=0\) en un point à distance finie ; puis continuité de \(V\) aux frontières.</li>
      <li><span class="step">Potentiel → champ.</span> \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) avec l'expression du gradient adaptée (fournie en cylindriques et en sphériques : facteurs \(1/r\) et \(1/(r\sin\theta)\) des composantes angulaires).</li>
      <li><span class="step">Tension.</span> \(U_{AB}=V(A)-V(B)=\displaystyle\int_A^B\vec E\cdot\mathrm{d}\vec\ell\), sur le chemin le plus commode (le résultat n'en dépend pas).</li>
    </ol>
    <p><em>Exemple éclair :</em> boule uniformément chargée : \(V(0)-V(R)=\displaystyle\int_0^R\frac{\rho r}{3\varepsilon_0}\,\mathrm{d}r=\frac{\rho R^2}{6\varepsilon_0}\), soit \(1{,}9\times10^{2}\ \text{V}\) pour \(\rho=1{,}0\ \mu\text{C·m}^{-3}\) et \(R=10\ \text{cm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : poser \(V(\infty)=0\) pour un fil ou un plan infini (le potentiel diverge) ; croire que \(V\) est discontinu là où \(E\) l'est (il reste continu) ; oublier le signe moins de \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\).</div>

  <div class="method-box"><strong>Méthode 6 — Résoudre l'équation de Poisson ou de Laplace avec des conditions aux limites</strong>
    <ol>
      <li><span class="step">Équation.</span> Écrire \(\Delta V=-\rho/\varepsilon_0\) avec le laplacien à une variable adapté à la symétrie (expressions fournies en cylindriques et sphériques).</li>
      <li><span class="step">Solution générale.</span> Intégrer deux fois : \(Az+B\), \(A\ln r+B\) ou \(A/r+B\) là où \(\rho=0\) ; ajouter une solution particulière là où \(\rho\neq0\) (par exemple \(-\rho z^2/(2\varepsilon_0)\) pour \(\rho\) uniforme).</li>
      <li><span class="step">Conditions.</span> Deux constantes par zone : potentiels imposés, \(V\) fini sur l'axe ou au centre, continuité de \(V\) et (sans charge surfacique) de \(\mathrm{d}V/\mathrm{d}n\).</li>
      <li><span class="step">Exploitation.</span> En déduire \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) et vérifier l'équation de départ ; l'unicité (admise) garantit que la solution trouvée est la bonne.</li>
    </ol>
    <p><em>Exemple éclair :</em> charge d'espace \(\rho\) uniforme entre deux plans \(z=0\) et \(z=d\) tous deux au potentiel 0 : \(V=\dfrac{\rho\,z(d-z)}{2\varepsilon_0}\), maximal au milieu, \(V_{\max}=\dfrac{\rho d^2}{8\varepsilon_0}\approx1{,}4\ \text{V}\) pour \(\rho=1{,}0\ \mu\text{C·m}^{-3}\) et \(d=1{,}0\ \text{cm}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Établir la capacité d'un condensateur plan</strong>
    <ol>
      <li><span class="step">Modèle.</span> Deux plans infinis de densités \(+\sigma\) et \(-\sigma\), distants de \(e\) (effets de bord négligés si \(e\ll\sqrt S\)).</li>
      <li><span class="step">Superposition.</span> Chaque plan crée \(\sigma/(2\varepsilon_0)\) de part et d'autre : les champs s'ajoutent entre les armatures, \(E=\sigma/\varepsilon_0\) de \(+\) vers \(-\), et se compensent à l'extérieur.</li>
      <li><span class="step">Tension.</span> \(U=V_+-V_-=\displaystyle\int_+^-\vec E\cdot\mathrm{d}\vec\ell=\dfrac{\sigma e}{\varepsilon_0}\gt0\).</li>
      <li><span class="step">Capacité.</span> \(Q=\sigma S\) et \(C=Q/U=\varepsilon_0S/e\) : la charge doit disparaître. Contrôle énergétique : \(\dfrac{\varepsilon_0E^2}{2}\times Se=\dfrac12CU^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> armatures de \(20\ \text{cm}\times20\ \text{cm}\) à \(e=2{,}0\ \text{mm}\) : \(C\approx1{,}8\times10^{2}\ \text{pF}\) ; sous \(500\ \text{V}\), \(E=2{,}5\times10^{5}\ \text{V·m}^{-1}\) (loin du claquage de l'air), \(Q\approx89\ \text{nC}\) et \(W_e\approx22\ \mu\text{J}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : prendre \(\sigma/(2\varepsilon_0)\) entre les armatures (champ d'un seul plan) ; oublier que le champ extérieur est nul. Les condensateurs cylindrique et sphérique, hors programme, se traitent de la même façon quand un énoncé guide le calcul (charge \(+Q\) sur l'armature intérieure, Gauss, circulation).</div>

  <div class="method-box"><strong>Méthode 8 — Utiliser l'énergie potentielle \(qV\) d'une charge</strong>
    <ol>
      <li><span class="step">Système.</span> Une charge ponctuelle \(q\) dans un champ extérieur \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) : la force électrique est conservative, \(E_p=qV\).</li>
      <li><span class="step">Bilan.</span> Conservation de l'énergie mécanique entre deux points (autres forces négligées) : \(\tfrac12mv_B^2+qV_B=\tfrac12mv_A^2+qV_A\) ; travail de la force électrique \(W_{AB}=q(V_A-V_B)\), quel que soit le chemin.</li>
      <li><span class="step">Signe.</span> Une charge positive « descend » les potentiels ; une charge négative les remonte.</li>
      <li><span class="step">Unités.</span> Exprimer l'énergie en électronvolts : \(1\ \text{eV}=1{,}602\times10^{-19}\ \text{J}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> proton accéléré depuis le repos sous \(10\ \text{kV}\) : il gagne \(10\ \text{keV}\) et atteint \(v=\sqrt{2eU/m_p}\approx1{,}4\times10^{6}\ \text{m·s}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(W_{AB}=q(V_B-V_A)\) ; oublier le signe de la charge de l'électron ; confondre le potentiel \(V\) (en volts, créé par les sources) et l'énergie potentielle \(qV\) (en joules, celle de la charge placée en \(M\)).</div>

  <div class="method-box"><strong>Méthode 9 — Lire et vérifier une carte de lignes de champ ou d'équipotentielles</strong>
    <ol>
      <li><span class="step">Sources.</span> Lignes divergentes : charge positive ; convergentes : charge négative. Sur une carte tracée à flux constant, le nombre de lignes issues d'une charge est proportionnel à \(|q|\).</li>
      <li><span class="step">Champ nul.</span> Point où des lignes semblent se croiser ; équipotentielle qui se recoupe en forme de « 8 ».</li>
      <li><span class="step">Intensité.</span> Lignes ou équipotentielles resserrées : champ fort, \(E\approx\Delta V/\Delta n\).</li>
      <li><span class="step">Sens.</span> \(\vec E\) va vers les potentiels décroissants, perpendiculairement aux équipotentielles.</li>
      <li><span class="step">Symétries.</span> Lignes contenues dans les plans de symétrie, perpendiculaires aux plans d'antisymétrie ; pour une distribution bornée (\(V(\infty)=0\)), un plan d'antisymétrie est l'équipotentielle \(V=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> deux équipotentielles voisines \(40\ \text{V}\) et \(30\ \text{V}\) sont écartées de \(5\ \text{mm}\) : \(E\approx10/0{,}005=2\ \text{kV·m}^{-1}\), dirigé de l'équipotentielle 40 V vers celle de 30 V.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une ligne de champ n'est pas, en général, la trajectoire d'une particule chargée (c'est l'accélération, pas la vitesse, qui est tangente à la ligne) ; une ligne de champ électrostatique fermée est impossible.</div>

  <div class="method-box"><strong>Méthode 10 — Tracer équipotentielles et lignes de champ en Python</strong>
    <ol>
      <li><span class="step">Maillage.</span> <span class="code-inline">X, Y = np.meshgrid(x, y)</span> : \(X[i,j]=x_j\) et \(Y[i,j]=y_i\) (l'indice de ligne correspond à \(y\)).</li>
      <li><span class="step">Potentiel.</span> Somme des \(kq/d\) sur toutes les charges ; si un nœud peut coïncider avec une charge, ajouter un petit rayon de lissage (<span class="code-inline">np.sqrt(dx**2 + dy**2 + eps**2)</span>) ou décaler la grille.</li>
      <li><span class="step">Équipotentielles.</span> <span class="code-inline">plt.contour(X, Y, V, levels)</span> avec des niveaux régulièrement espacés : leur resserrement traduit un champ intense.</li>
      <li><span class="step">Champ.</span> <span class="code-inline">dVdy, dVdx = np.gradient(V, y, x)</span> puis \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) ; tracer avec <span class="code-inline">plt.streamplot(X, Y, Ex, Ey)</span>.</li>
      <li><span class="step">Mise en forme.</span> <span class="code-inline">plt.axis('equal')</span> pour que l'orthogonalité lignes / équipotentielles soit visible.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(+q\) et \(-q\) placées en \((\mp a,0)\), la carte obtenue doit montrer l'axe \(x=0\) comme équipotentielle \(V=0\), traversée à angle droit par toutes les lignes : c'est un contrôle immédiat du script.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'ordre des dérivées renvoyées par <span class="code-inline">np.gradient</span> (axe 0, donc \(y\), d'abord) ; le signe moins de \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) ; des niveaux de <span class="code-inline">contour</span> trop serrés près des charges, qui masquent le reste de la carte.</div>
</div>
