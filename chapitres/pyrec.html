<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Compter et retourner une chaîne</h3>
  <div class="statement">Toutes les fonctions demandées sont récursives et n'utilisent pas de boucle.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">occurrences(c, s, i)</span> qui renvoie le nombre d'apparitions du caractère <span class="code-inline">c</span> dans la portion \(s[i..n-1]\) de la chaîne <span class="code-inline">s</span> (\(n\) étant sa longueur). Quel appel donne le nombre d'apparitions dans toute la chaîne ?</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">miroir(s)</span> qui renvoie la chaîne <span class="code-inline">s</span> écrite à l'envers.</div>
  <div class="q"><strong>Q3.</strong> Justifier la terminaison des deux fonctions. Quel est le coût de <span class="code-inline">miroir</span> pour une chaîne de longueur \(n\), sachant qu'une tranche ou une concaténation de chaînes coûte leur longueur ? Que se passe-t-il pour une chaîne de 3000 caractères ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Cas de base : la portion est vide quand \(i = n\). Sinon, on compte \(s[i]\) s'il vaut <span class="code-inline">c</span>, et l'on ajoute le résultat sur la portion suivante. L'appel <span class="code-inline">occurrences(c, s, 0)</span> traite toute la chaîne.</p>
<pre class="codeblock"><span class="kw">def</span> occurrences(c, s, i):
    <span class="cmt"># nombre d'apparitions du caractère c dans s[i..]</span>
    <span class="kw">if</span> i == len(s):
        <span class="kw">return</span> 0
    <span class="kw">if</span> s[i] == c:
        <span class="kw">return</span> 1 + occurrences(c, s, i + 1)
    <span class="kw">return</span> occurrences(c, s, i + 1)</pre>
    <p><strong>Q2.</strong> Le miroir de <span class="code-inline">s</span> est le miroir de la fin <span class="code-inline">s[1:len(s)]</span>, suivi du premier caractère :</p>
<pre class="codeblock"><span class="kw">def</span> miroir(s):
    <span class="cmt"># la chaîne s écrite à l'envers</span>
    <span class="kw">if</span> len(s) == 0:
        <span class="kw">return</span> <span class="str">""</span>
    <span class="kw">return</span> miroir(s[1:len(s)]) + s[0]</pre>
<pre class="codeblock">occurrences(<span class="str">"a"</span>, <span class="str">"ananas"</span>, 0)     <span class="cmt"># 3</span>
miroir(<span class="str">"bonjour"</span>)                 <span class="cmt"># 'ruojnob'</span></pre>
    <p><strong>Q3.</strong> Variants : \(n - i\) pour <span class="code-inline">occurrences</span>, la longueur de la chaîne pour <span class="code-inline">miroir</span> ; ils diminuent de 1 à chaque appel. L'appel de <span class="code-inline">miroir</span> sur une chaîne de longueur \(k\) fait une tranche et une concaténation de longueur \(k\) environ : \(n + (n-1) + \dots + 1 = \dfrac{n(n+1)}{2}\), coût \(O(n^2)\) (<span class="code-inline">occurrences</span>, qui n'utilise que des indices, est en \(O(n)\)). Pour 3000 caractères, la profondeur de 3001 appels dépasse la limite de la pile : <span class="code-inline">RecursionError</span>. Une boucle est préférable pour de longues chaînes.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Dichotomie : la première occurrence</h3>
  <div class="statement">On dispose de <span class="code-inline">dicho_rec(x, t, g, d)</span> et <span class="code-inline">dicho_r(x, t)</span> (§4 du cours). La liste <span class="code-inline">t</span> est triée mais peut contenir des valeurs répétées.</div>
  <div class="q"><strong>Q1.</strong> Que renvoie <span class="code-inline">dicho_r(5, [1, 5, 5, 5, 5, 8, 9])</span> ? Est-ce le plus petit indice de 5 ?</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction récursive <span class="code-inline">premiere(x, t, g, d)</span> qui renvoie le plus petit indice \(i\) de \([g, d]\) tel que <span class="code-inline">t[i] == x</span>, ou \(-1\) s'il n'y en a pas, avec un coût logarithmique.</div>
  <div class="q"><strong>Q3.</strong> Justifier la terminaison, la correction et le coût.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le premier milieu est \(m = 3\), et \(t[3] = 5\) : la fonction renvoie 3, alors que la première occurrence est en case 1.</p>
    <p><strong>Q2.</strong> Quand \(t[m] = x\), la première occurrence est soit plus à gauche, soit \(m\) lui-même : on la cherche dans \(t[g..m-1]\), et l'on renvoie \(m\) si elle n'y est pas.</p>
<pre class="codeblock"><span class="kw">def</span> premiere(x, t, g, d):
    <span class="cmt"># t triée ; plus petit indice i de [g, d] tel que</span>
    <span class="cmt"># t[i] == x, ou -1 si x n'est pas dans t[g..d]</span>
    <span class="kw">if</span> g &gt; d:
        <span class="kw">return</span> -1
    m = (g + d) // 2
    <span class="kw">if</span> t[m] &lt; x:
        <span class="kw">return</span> premiere(x, t, m + 1, d)
    <span class="kw">elif</span> t[m] &gt; x:
        <span class="kw">return</span> premiere(x, t, g, m - 1)
    <span class="kw">else</span>:                        <span class="cmt"># t[m] == x : à gauche ?</span>
        i = premiere(x, t, g, m - 1)
        <span class="kw">if</span> i == -1:
            <span class="kw">return</span> m
        <span class="kw">return</span> i</pre>
<pre class="codeblock">t = [1, 5, 5, 5, 5, 8, 9]
premiere(5, t, 0, 6)      <span class="cmt"># 1</span>
premiere(7, t, 0, 6)      <span class="cmt"># -1</span></pre>
    <p><strong>Q3.</strong> Variant : \(d - g + 1\), qui diminue strictement, puisque chaque appel porte sur une portion qui exclut \(m\). Correction, par récurrence sur la longueur : si \(t[m] \lt x\), toutes les cases d'indice \(\le m\) sont \(\lt x\) et la première occurrence, si elle existe, est dans \([m + 1, d]\) ; de même si \(t[m] \gt x\) ; si \(t[m] = x\), la première occurrence est la première de \([g, m - 1]\) s'il y en a une, et \(m\) sinon. Chaque appel fait un seul appel récursif, sur une portion de longueur au plus moitié : \(C(L) = C(L/2) + c\), coût \(O(\log n)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Pyramide et sablier</h3>
  <div class="statement">On veut afficher des figures centrées à l'aide de <span class="code-inline">print</span>, en utilisant la répétition de chaînes (<span class="code-inline">" " * 3</span> vaut trois espaces).</div>
<pre class="codeblock"><span class="kw">def</span> pyramide(n, marge):
    <span class="cmt"># pyramide de n lignes, décalée de marge espaces</span>
    <span class="kw">if</span> n &gt; 0:
        pyramide(n - 1, marge + 1)
        print(<span class="str">" "</span> * marge + <span class="str">"*"</span> * (2 * n - 1))</pre>
  <div class="q"><strong>Q1.</strong> Qu'affiche <span class="code-inline">pyramide(4, 0)</span> ? Quel est le rôle du paramètre <span class="code-inline">marge</span> ?</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction récursive <span class="code-inline">sablier(n, marge)</span> qui affiche un sablier de \(2n - 1\) lignes, dont la ligne du milieu, d'une seule étoile, n'apparaît qu'une fois. Pour \(n = 3\) et une marge nulle : lignes de 5, 3, 1, 3 et 5 étoiles, centrées.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'appel récursif précède le <span class="code-inline">print</span> : la ligne la plus courte, celle de l'appel le plus profond, sort en premier.</p>
<pre class="codeblock">   *
  ***
 *****
*******</pre>
    <p>La ligne \(k\) (\(2k - 1\) étoiles) doit être décalée de \(n - k\) espaces pour être centrée ; chaque appel sur \(n - 1\) ajoute une espace de marge, ce qui réalise ce décalage.</p>
    <p><strong>Q2.</strong> La ligne de l'appel est affichée avant <em>et</em> après l'appel récursif, sauf au cas de base \(n = 1\), affiché une seule fois :</p>
<pre class="codeblock"><span class="kw">def</span> sablier(n, marge):
    ligne = <span class="str">" "</span> * marge + <span class="str">"*"</span> * (2 * n - 1)
    <span class="kw">if</span> n == 1:
        print(ligne)         <span class="cmt"># milieu : une seule fois</span>
    <span class="kw">elif</span> n &gt; 1:
        print(ligne)
        sablier(n - 1, marge + 1)
        print(ligne)</pre>
<pre class="codeblock">*****
 ***
  *
 ***
*****</pre>
    <p>Nombre de lignes : \(\ell(1) = 1\) et \(\ell(n) = \ell(n-1) + 2\), soit \(2n - 1\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Exponentiation rapide : compter les appels</h3>
  <div class="statement">On reprend <span class="code-inline">puissance_rec</span> et <span class="code-inline">puissance_lente</span> du §4 du cours.</div>
  <div class="q"><strong>Q1.</strong> Combien d'appels fait <span class="code-inline">puissance_rec(x, 1000)</span> ? Exprimer ce nombre pour un entier \(n \ge 1\) quelconque, à l'aide du nombre \(k\) de chiffres de \(n\) en base 2.</div>
  <div class="q"><strong>Q2.</strong> Même question pour <span class="code-inline">puissance_lente</span>. En déduire son coût.</div>
  <div class="q"><strong>Q3.</strong> Écrire une fonction récursive <span class="code-inline">puissance_mod(x, n, p)</span> qui renvoie le reste de \(x^n\) dans la division par \(p\), en réduisant modulo \(p\) (opérateur <span class="code-inline">%</span>) chaque résultat intermédiaire. Combien d'appels pour \(n = 10^{18}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les arguments successifs sont \(n, \lfloor n/2 \rfloor, \lfloor n/4 \rfloor, \dots, 1, 0\) : il y en a \(k + 1\), où \(k = \lfloor \log_2 n \rfloor + 1\) est le nombre de chiffres de \(n\) en base 2. Pour \(n = 1000\) (\(k = 10\)) : 11 appels.</p>
    <p><strong>Q2.</strong> Le nombre d'appels \(A(n)\) vérifie \(A(0) = 1\) et \(A(n) = 1 + 2A(\lfloor n/2 \rfloor)\) : chaque niveau double le nombre d'appels, d'où \(A(n) = 2^{k+1} - 1\). Pour \(n = 1000\) : \(2^{11} - 1 = 2047\) appels. Comme \(2^{k-1} \le n\), \(A(n) \le 4n - 1\) : le coût est linéaire, \(O(n)\), comme la méthode naïve.</p>
    <p><strong>Q3.</strong> On réduit modulo \(p\) chaque résultat : \(y\) est un reste, inférieur à \(p\), et les nombres manipulés restent petits, alors que \(x^n\) lui-même aurait des milliards de chiffres pour \(n = 10^{18}\).</p>
<pre class="codeblock"><span class="kw">def</span> puissance_mod(x, n, p):
    <span class="cmt"># x ** n modulo p (x, n entiers &gt;= 0, p &gt;= 2)</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> 1
    y = puissance_mod(x, n // 2, p)
    <span class="kw">if</span> n % 2 == 0:
        <span class="kw">return</span> y * y % p
    <span class="kw">return</span> x * y * y % p</pre>
<pre class="codeblock">puissance_mod(7, 1000, 13)       <span class="cmt"># 9</span>
puissance_mod(2, 10 ** 18, 1000) <span class="cmt"># 376</span></pre>
    <p>Pour \(n = 10^{18}\), \(n\) a 60 chiffres en base 2 : 61 appels, sans risque pour la pile.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Les sous-listes à \(k\) éléments</h3>
  <div class="statement">On veut énumérer les sous-listes d'une liste <span class="code-inline">t</span> de \(n\) valeurs distinctes qui ont exactement \(k\) éléments (par exemple, les équipes de \(k\) joueurs parmi \(n\)).</div>
  <div class="q"><strong>Q1.</strong> Écrire une fonction récursive <span class="code-inline">parties_k(t, k)</span>, sans construire toutes les sous-listes de <span class="code-inline">t</span>.</div>
  <div class="q"><strong>Q2.</strong> On note \(N(n, k)\) le nombre de résultats. Établir une relation de récurrence et reconnaître ce nombre.</div>
  <div class="q"><strong>Q3.</strong> Combien de grilles différentes de 5 numéros parmi 49 ? Est-il raisonnable de toutes les construire ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Une sous-liste à \(k\) éléments contient \(t[0]\), suivi de \(k - 1\) éléments pris dans la suite, ou ne le contient pas, et ses \(k\) éléments sont pris dans la suite. Cas de base : \(k = 0\) (une seule sous-liste, vide) ; liste trop courte (aucune).</p>
<pre class="codeblock"><span class="kw">def</span> parties_k(t, k):
    <span class="cmt"># sous-listes de t à k éléments</span>
    <span class="kw">if</span> k == 0:
        <span class="kw">return</span> [[]]
    <span class="kw">if</span> len(t) &lt; k:
        <span class="kw">return</span> []
    reste = t[1:len(t)]
    avec = [[t[0]] + s <span class="kw">for</span> s <span class="kw">in</span> parties_k(reste, k - 1)]
    sans = parties_k(reste, k)
    <span class="kw">return</span> avec + sans</pre>
<pre class="codeblock">u = parties_k([1, 2, 3, 4], 2)
u[0:3]        <span class="cmt"># [[1, 2], [1, 3], [1, 4]]</span>
u[3:6]        <span class="cmt"># [[2, 3], [2, 4], [3, 4]]</span>
len(parties_k(list(range(10)), 3))     <span class="cmt"># 120</span></pre>
    <p><strong>Q2.</strong> \(N(n, 0) = 1\), \(N(n, k) = 0\) si \(n \lt k\), et \(N(n, k) = N(n - 1, k - 1) + N(n - 1, k)\) : c'est la relation du triangle de Pascal, donc \(N(n, k) = \dbinom{n}{k}\). Ainsi \(\dbinom{10}{3} = 120\).</p>
    <p><strong>Q3.</strong> \(\dbinom{49}{5} = 1\,906\,884\) grilles. On peut les construire (quelques secondes, mais beaucoup de mémoire) ; pour les compter, la formule suffit, et pour en choisir une selon un critère, mieux vaut les explorer une à une sans les stocker.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Les permutations par insertion</h3>
  <div class="statement">Une autre façon d'obtenir les permutations de <span class="code-inline">t</span> : prendre chaque permutation de \(t[1..n-1]\) et y insérer \(t[0]\) à toutes les places possibles.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">inserer_partout(x, p)</span> qui renvoie la liste des listes obtenues en insérant <span class="code-inline">x</span> à chacune des \(\text{len}(p) + 1\) places de <span class="code-inline">p</span>.</div>
  <div class="q"><strong>Q2.</strong> En déduire une fonction récursive <span class="code-inline">permutations2(t)</span>.</div>
  <div class="q"><strong>Q3.</strong> Montrer que, pour des valeurs distinctes, elle renvoie \(n!\) listes deux à deux différentes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1 et Q2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> inserer_partout(x, p):
    <span class="cmt"># listes obtenues en insérant x à chaque place de p</span>
    res = []
    <span class="kw">for</span> i <span class="kw">in</span> range(len(p) + 1):
        res.append(p[0:i] + [x] + p[i:len(p)])
    <span class="kw">return</span> res


<span class="kw">def</span> permutations2(t):
    <span class="cmt"># permutations de t, par insertion de t[0]</span>
    <span class="kw">if</span> len(t) == 0:
        <span class="kw">return</span> [[]]
    res = []
    <span class="kw">for</span> p <span class="kw">in</span> permutations2(t[1:len(t)]):
        <span class="kw">for</span> q <span class="kw">in</span> inserer_partout(t[0], p):
            res.append(q)
    <span class="kw">return</span> res</pre>
<pre class="codeblock">u = inserer_partout(0, [1, 2])
u            <span class="cmt"># [[0, 1, 2], [1, 0, 2], [1, 2, 0]]</span>
len(permutations2([1, 2, 3, 4, 5]))     <span class="cmt"># 120</span></pre>
    <p><strong>Q3.</strong> Par récurrence sur \(n\). Pour \(n = 0\), une seule liste, la liste vide, et \(0! = 1\). Si <span class="code-inline">permutations2</span> renvoie les \((n-1)!\) permutations distinctes de \(t[1..n-1]\), chacune donne \(n\) listes par insertion de \(t[0]\), soit \(n \times (n-1)! = n!\) listes. Elles sont distinctes : en retirant \(t[0]\) d'une liste obtenue, on retrouve la permutation de départ, et la place de \(t[0]\) indique l'insertion faite. Toute permutation de \(t\) est obtenue ainsi (en retirant \(t[0]\), on obtient une permutation de \(t[1..n-1]\)).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Les tours de Hanoï</h3>
  <div class="statement">Trois tiges A, B, C ; sur A sont empilés \(n\) disques de tailles différentes, du plus grand (en bas) au plus petit. On veut les amener sur la tige C, en déplaçant un seul disque à la fois (celui du haut d'une tige) et sans jamais poser un disque sur un plus petit.</div>
  <div class="q"><strong>Q1.</strong> Expliquer pourquoi, pour déplacer les \(n\) disques de A vers C, il suffit de savoir déplacer \(n - 1\) disques d'une tige vers une autre. Écrire une fonction récursive <span class="code-inline">hanoi(n, depart, arrivee, autre)</span> qui affiche les déplacements sous la forme <span class="code-inline">A -&gt; C</span> (les tiges sont des chaînes).</div>
  <div class="q"><strong>Q2.</strong> Qu'affiche <span class="code-inline">hanoi(3, "A", "C", "B")</span> ?</div>
  <div class="q"><strong>Q3.</strong> Calculer le nombre \(M(n)\) de déplacements effectués. Combien de temps faudrait-il pour 64 disques, à raison d'un déplacement par seconde ?</div>
  <div class="q"><strong>Q4.</strong> Montrer qu'aucune méthode ne peut faire moins de \(M(n)\) déplacements.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le plus grand disque ne gêne jamais les autres. On déplace les \(n - 1\) disques du haut de <span class="code-inline">depart</span> vers <span class="code-inline">autre</span> (en se servant de <span class="code-inline">arrivee</span>), puis le plus grand vers <span class="code-inline">arrivee</span>, enfin les \(n - 1\) disques de <span class="code-inline">autre</span> vers <span class="code-inline">arrivee</span>.</p>
<pre class="codeblock"><span class="kw">def</span> hanoi(n, depart, arrivee, autre):
    <span class="cmt"># affiche les déplacements qui amènent les n disques</span>
    <span class="cmt"># du haut de la tige depart sur la tige arrivee</span>
    <span class="kw">if</span> n &gt; 0:
        hanoi(n - 1, depart, autre, arrivee)
        print(depart + <span class="str">" -&gt; "</span> + arrivee)
        hanoi(n - 1, autre, arrivee, depart)</pre>
    <p><strong>Q2.</strong></p>
<pre class="codeblock">A -&gt; C
A -&gt; B
C -&gt; B
A -&gt; C
B -&gt; A
B -&gt; C
A -&gt; C</pre>
    <p><strong>Q3.</strong> \(M(0) = 0\) et \(M(n) = 2M(n-1) + 1\). La suite \(M(n) + 1\) double à chaque rang : \(M(n) = 2^n - 1\) (7 pour 3 disques). Pour 64 disques, \(2^{64} - 1 \approx 1{,}8 \times 10^{19}\) secondes, soit environ \(5{,}8 \times 10^{11}\) ans.</p>
    <p><strong>Q4.</strong> Par récurrence. Le plus grand disque doit bouger au moins une fois ; au moment de son premier déplacement, les \(n - 1\) autres sont tous sur la troisième tige, ce qui a demandé au moins \(M(n - 1)\) déplacements ; après son dernier déplacement, il faut encore les amener sur lui, au moins \(M(n - 1)\) déplacements. Total : au moins \(2M(n-1) + 1 = M(n)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>L'ensemble de Cantor en caractères</h3>
  <div class="statement">L'ensemble de Cantor s'obtient en partant d'un segment, en retirant son tiers central, puis le tiers central de chacun des deux morceaux restants, et ainsi de suite. On le représente par des lignes de caractères <span class="code-inline">#</span> et d'espaces, la ligne \(k\) montrant l'étape \(k\).</div>
  <div class="q"><strong>Q1.</strong> Écrire une fonction récursive <span class="code-inline">cantor(n)</span> qui renvoie la liste des \(n + 1\) lignes (étapes 0 à \(n\)), chacune de \(3^n\) caractères. On remarquera que les lignes 1 à \(n\) de l'ordre \(n\) sont formées de deux copies des lignes de l'ordre \(n - 1\), séparées par des espaces.</div>
  <div class="q"><strong>Q2.</strong> Donner l'affichage de l'ordre 3.</div>
  <div class="q"><strong>Q3.</strong> Combien la ligne \(k\) contient-elle de caractères <span class="code-inline">#</span> ? Quelle proportion de la ligne cela représente-t-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'ordre \(n\) commence par une ligne pleine de \(3w\) caractères, où \(w = 3^{n-1}\) est la largeur de l'ordre \(n - 1\) ; chaque ligne de l'ordre \(n - 1\) donne ensuite une ligne formée d'elle-même, de \(w\) espaces et d'elle-même.</p>
<pre class="codeblock"><span class="kw">def</span> cantor(n):
    <span class="cmt"># lignes 0 à n de l'ensemble de Cantor,</span>
    <span class="cmt"># chacune de 3 ** n caractères</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> [<span class="str">"#"</span>]
    t = cantor(n - 1)
    w = len(t[0])                    <span class="cmt"># 3 ** (n - 1)</span>
    res = [<span class="str">"#"</span> * (3 * w)]
    <span class="kw">for</span> ligne <span class="kw">in</span> t:
        res.append(ligne + <span class="str">" "</span> * w + ligne)
    <span class="kw">return</span> res</pre>
    <p><strong>Q2.</strong></p>
<pre class="codeblock"><span class="kw">for</span> ligne <span class="kw">in</span> cantor(3):
    print(ligne)</pre>
<pre class="codeblock">###########################
#########         #########
###   ###         ###   ###
# #   # #         # #   # #</pre>
    <p><strong>Q3.</strong> La ligne \(k\) contient \(2^k\) blocs de \(3^{n-k}\) caractères <span class="code-inline">#</span>, soit \(2^k\, 3^{n-k}\), donc une proportion \((2/3)^k\) de la ligne, qui tend vers 0 : à la limite, l'ensemble de Cantor a une « longueur » nulle, bien qu'il contienne une infinité de points. Le coût de construction est de l'ordre du nombre total de caractères, \((n + 1)\,3^n\).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Tournée d'un drone de livraison</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : énumération récursive des permutations, élagage, complexité).</div>
  <div class="statement">Un drone part d'un entrepôt, livre \(n - 1\) clients puis revient à l'entrepôt. Les \(n\) lieux sont donnés par une liste <span class="code-inline">pts</span> de couples de coordonnées (en km) ; l'entrepôt est <span class="code-inline">pts[0]</span>. Une <strong>tournée</strong> est une liste d'indices de lieux qui commence par 0 et contient chaque indice de 0 à \(n - 1\) exactement une fois ; sa longueur est la somme des distances entre lieux consécutifs, retour à l'entrepôt compris. On cherche une tournée de longueur minimale. Exemple :</div>
<pre class="codeblock">pts = [(0, 0), (2, 6), (5, 2), (6, 6), (1, 3), (4, 0)]</pre>
  <div class="statement">On dispose de la fonction <span class="code-inline">math.sqrt</span> (racine carrée) du module <span class="code-inline">math</span>, et de la fonction <span class="code-inline">permutations(t)</span> du cours, qui renvoie la liste des permutations d'une liste de valeurs distinctes.</div>
  <div class="exo-part"><strong>Partie A — Longueur d'une tournée</strong></div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">distance(p: tuple, q: tuple) -&gt; float</span>, distance euclidienne entre deux points.</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">longueur(pts: list, tournee: list) -&gt; float</span>. Donner sa complexité.</div>
  <div class="exo-part"><strong>Partie B — Essayer toutes les tournées</strong></div>
  <div class="q"><strong>Q3.</strong> Combien y a-t-il de tournées pour \(n\) lieux ? Pourquoi peut-on dire que deux d'entre elles décrivent toujours le même circuit ?</div>
  <div class="q"><strong>Q4.</strong> Écrire <span class="code-inline">meilleure_tournee(pts: list) -&gt; tuple</span> qui renvoie la longueur minimale et une tournée qui la réalise, en essayant toutes les tournées.</div>
  <div class="q"><strong>Q5.</strong> Donner sa complexité. Estimer le nombre de tournées examinées pour \(n = 13\).</div>
  <div class="exo-part"><strong>Partie C — Abandonner les débuts trop longs</strong></div>
  <div class="q"><strong>Q6.</strong> On construit les tournées lieu par lieu, récursivement : un appel reçoit un début de tournée <span class="code-inline">chemin</span>, sa longueur <span class="code-inline">lg</span>, la liste <span class="code-inline">restants</span> des lieux non visités et la longueur <span class="code-inline">record</span> d'une tournée complète déjà connue ; il renvoie la plus petite longueur trouvée, au plus égale à <span class="code-inline">record</span>. Écrire <span class="code-inline">explorer(pts, chemin, restants, lg, record)</span> en abandonnant tout début de tournée dont la longueur atteint déjà <span class="code-inline">record</span>.</div>
  <div class="q"><strong>Q7.</strong> Justifier que cet abandon ne fait jamais manquer la tournée optimale. Quel premier appel faut-il écrire ?</div>
  <div class="q"><strong>Q8.</strong> Quelle est la profondeur maximale des appels ? Le coût dans le pire cas est-il amélioré ? Sur 10 lieux tirés au hasard, l'exploration complète ferait 986 410 appels, et la version avec abandon en fait 116 843 : commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1 et Q2.</strong> On parcourt les couples de lieux consécutifs, puis on ajoute le retour ; coût \(O(n)\).</p>
<pre class="codeblock"><span class="kw">import</span> math      <span class="cmt"># math.sqrt(x) : racine carrée de x</span>


<span class="kw">def</span> distance(p, q):
    dx, dy = p[0] - q[0], p[1] - q[1]
    <span class="kw">return</span> math.sqrt(dx ** 2 + dy ** 2)


<span class="kw">def</span> longueur(pts, tournee):
    <span class="cmt"># tournee : indices de lieux, commençant par 0 ;</span>
    <span class="cmt"># longueur du circuit, retour au départ compris</span>
    n = len(tournee)
    lg = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(n - 1):
        a, b = pts[tournee[k]], pts[tournee[k + 1]]
        lg = lg + distance(a, b)
    dernier = pts[tournee[n - 1]]
    <span class="kw">return</span> lg + distance(dernier, pts[tournee[0]])</pre>
    <p><strong>Q3.</strong> La tournée commence par 0 ; les \(n - 1\) autres lieux peuvent être dans n'importe quel ordre : \((n - 1)!\) tournées. La tournée parcourue en sens inverse (0, puis les mêmes lieux dans l'ordre inverse) décrit le même circuit, de même longueur : il n'y a que \((n-1)!/2\) circuits différents pour \(n \ge 3\).</p>
    <p><strong>Q4.</strong></p>
<pre class="codeblock"><span class="kw">def</span> meilleure_tournee(pts):
    <span class="cmt"># renvoie (longueur, tournée) d'une tournée la plus</span>
    <span class="cmt"># courte, en essayant toutes les permutations</span>
    autres = [k <span class="kw">for</span> k <span class="kw">in</span> range(1, len(pts))]
    best = longueur(pts, [0] + autres)
    best_t = [0] + autres
    <span class="kw">for</span> p <span class="kw">in</span> permutations(autres):
        lg = longueur(pts, [0] + p)
        <span class="kw">if</span> lg &lt; best:
            best, best_t = lg, [0] + p
    <span class="kw">return</span> best, best_t</pre>
    <p><strong>Q5.</strong> \((n - 1)!\) permutations, chacune de longueur calculée en \(O(n)\) ; leur construction coûte aussi \(O(n)\) chacune : coût \(O(n \cdot (n - 1)!) = O(n!)\), et la liste de toutes les permutations occupe autant de mémoire. Pour \(n = 13\) : \(12! \approx 4{,}8 \times 10^8\) tournées, soit des heures de calcul en Python, et une liste impossible à stocker.</p>
    <p><strong>Q6.</strong></p>
<pre class="codeblock"><span class="kw">def</span> explorer(pts, chemin, restants, lg, record):
    <span class="cmt"># chemin : début de tournée, de longueur lg ;</span>
    <span class="cmt"># restants : lieux non visités ; record : longueur</span>
    <span class="cmt"># d'une tournée complète déjà connue.</span>
    <span class="cmt"># Renvoie la plus petite longueur trouvée (&lt;= record).</span>
    <span class="kw">if</span> lg &gt;= record:                 <span class="cmt"># élagage</span>
        <span class="kw">return</span> record
    dernier = pts[chemin[len(chemin) - 1]]
    <span class="kw">if</span> len(restants) == 0:
        total = lg + distance(dernier, pts[0])
        <span class="kw">if</span> total &lt; record:
            <span class="kw">return</span> total
        <span class="kw">return</span> record
    <span class="kw">for</span> i <span class="kw">in</span> range(len(restants)):
        s = restants[i]
        autres = restants[0:i] + restants[i + 1:]
        d = distance(dernier, pts[s])
        record = explorer(pts, chemin + [s], autres,
                          lg + d, record)
    <span class="kw">return</span> record</pre>
    <p><strong>Q7.</strong> Les distances sont positives : prolonger un début de tournée ne peut qu'augmenter sa longueur. Si <span class="code-inline">lg</span> atteint déjà <span class="code-inline">record</span>, toute tournée complète qui commence ainsi est au moins aussi longue qu'une tournée déjà connue ; on ne perd donc pas l'optimum en l'abandonnant. Premier appel : <span class="code-inline">explorer(pts, [0], [1, 2, …, n - 1], 0, r0)</span>, où <span class="code-inline">r0</span> est la longueur d'une tournée quelconque, par exemple <span class="code-inline">longueur(pts, [0, 1, …, n - 1])</span>. Sur l'exemple :</p>
<pre class="codeblock">lg, tour = meilleure_tournee(pts)
tour                         <span class="cmt"># [0, 5, 2, 3, 1, 4]</span>
round(lg, 2)                 <span class="cmt"># 20.68</span>
r0 = longueur(pts, [0, 1, 2, 3, 4, 5])
round(r0, 2)                 <span class="cmt"># 29.52</span>
e = explorer(pts, [0], [1, 2, 3, 4, 5], 0, r0)
round(e, 2)                  <span class="cmt"># 20.68</span></pre>
    <p><strong>Q8.</strong> Chaque appel visite un lieu de plus : profondeur \(n\) (aucun risque pour la pile). Dans le pire cas (si l'abandon ne sert jamais), on explore encore tous les débuts de tournée : le coût reste de l'ordre de \(n!\). En pratique, dès qu'une bonne tournée est connue, la plupart des débuts sont abandonnés tôt : ici, environ 8 fois moins d'appels. Partir d'un meilleur record initial, par exemple celui d'une tournée gloutonne qui va toujours au client le plus proche (chapitre <em>Algorithmes gloutons</em>), améliore encore l'élagage.</p>
  </div>
</div>
