  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Les fonctions récursives sont un thème du premier semestre d'informatique commune. Le programme insiste sur leur usage hors des mathématiques : recherches dichotomiques, figures dessinées par des <span class="code-inline">print</span> successifs, fractales, énumération de sous-listes et de permutations, et sur le phénomène de dépassement de la pile. La récursivité sert ensuite partout : tris par partition-fusion et rapide (chapitre <em>Algorithmes de tri</em>), parcours en profondeur (chapitre <em>Graphes</em>), programmation dynamique en 2ᵉ année.</div>

<div class="course-section">
  <div class="sec-num">§1 · CAS DE BASE ET APPEL RÉCURSIF</div>
  <h2>Une fonction qui s'appelle elle-même</h2>
  <div class="intro">Beaucoup de problèmes se ramènent au même problème sur une donnée plus petite : un mot est un palindrome si ses deux lettres extrêmes sont égales et si ce qui reste entre elles en est un ; une poupée russe contient une poupée russe plus petite. Une fonction récursive traduit directement cette description.</div>

  <div class="def-box">
    Une fonction est <strong>récursive</strong> si son code contient un appel à elle-même. Elle comporte :
    <ul>
      <li>un ou plusieurs <strong>cas de base</strong>, traités directement, sans appel récursif ;</li>
      <li>un ou plusieurs <strong>appels récursifs</strong>, sur des données <strong>plus petites</strong> (en un sens à préciser), dont les résultats sont combinés pour obtenir le résultat cherché.</li>
    </ul>
    Pour qu'elle termine, toute suite d'appels doit finir par atteindre un cas de base.
  </div>

  <p>L'exemple le plus simple suit la définition \(0! = 1\) et \(n! = n \times (n-1)!\) pour \(n \ge 1\) :</p>
<pre class="codeblock"><span class="kw">def</span> factorielle(n):
    <span class="cmt"># n entier &gt;= 0 ; renvoie n!</span>
    <span class="kw">if</span> n == 0:                       <span class="cmt"># cas de base</span>
        <span class="kw">return</span> 1
    <span class="kw">return</span> n * factorielle(n - 1)    <span class="cmt"># appel sur n - 1</span></pre>
<pre class="codeblock">factorielle(5)       <span class="cmt"># 120</span></pre>

  <div class="method-box">
    <strong>Exemple — Reconnaître un palindrome</strong>
    <p>Un palindrome se lit de la même façon dans les deux sens (« radar », « ressasser »). On travaille sur la portion \(s[i..j]\) de la chaîne, repérée par deux indices, plutôt que sur des copies de morceaux de la chaîne.</p>
<pre class="codeblock"><span class="kw">def</span> est_palindrome(s, i, j):
    <span class="cmt"># True si s[i..j] se lit de la même façon</span>
    <span class="cmt"># dans les deux sens</span>
    <span class="kw">if</span> i &gt;= j:                       <span class="cmt"># 0 ou 1 caractère</span>
        <span class="kw">return</span> <span class="kw">True</span>
    <span class="kw">if</span> s[i] != s[j]:
        <span class="kw">return</span> <span class="kw">False</span>
    <span class="kw">return</span> est_palindrome(s, i + 1, j - 1)


<span class="kw">def</span> palindrome(s):
    <span class="kw">return</span> est_palindrome(s, 0, len(s) - 1)</pre>
<pre class="codeblock">palindrome(<span class="str">"ressasser"</span>)    <span class="cmt"># True</span>
palindrome(<span class="str">"radar"</span>)        <span class="cmt"># True</span>
palindrome(<span class="str">"rotule"</span>)       <span class="cmt"># False</span>
palindrome(<span class="str">""</span>)             <span class="cmt"># True</span></pre>
    <ol>
      <li><strong>Cas de base</strong> : si \(i \ge j\), la portion a 0 ou 1 caractère ; c'est un palindrome.</li>
      <li><strong>Réduction</strong> : si les deux caractères extrêmes diffèrent, ce n'en est pas un ; sinon, la réponse est celle de la portion \(s[i+1..j-1]\), plus courte de deux caractères.</li>
      <li><strong>Déroulé</strong> : <span class="code-inline">palindrome("radar")</span> appelle <span class="code-inline">est_palindrome</span> sur les indices \((0, 4)\), puis \((1, 3)\), puis \((2, 2)\) : cas de base, <span class="code-inline">True</span>, qui est renvoyé tel quel par les deux appels en attente.</li>
      <li>La fonction <span class="code-inline">palindrome</span> fixe les indices du premier appel : c'est une <strong>fonction d'appel</strong> (on dit aussi enveloppe), qui donne à l'utilisateur une signature simple.</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Trois questions pour écrire une fonction récursive.</strong>
    <ul>
      <li>Quel est le plus petit cas, que l'on sait traiter directement ?</li>
      <li>Comment ramener le cas général à un ou plusieurs cas plus petits ?</li>
      <li>Comment fabriquer le résultat à partir des résultats des appels ?</li>
    </ul>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : oublier de <em>renvoyer</em> le résultat de l'appel récursif. L'appel est bien fait, mais sa valeur est perdue et la fonction renvoie <span class="code-inline">None</span> :</div>
<pre class="codeblock"><span class="kw">def</span> est_palindrome_faux(s, i, j):
    <span class="kw">if</span> i &gt;= j:
        <span class="kw">return</span> <span class="kw">True</span>
    <span class="kw">if</span> s[i] != s[j]:
        <span class="kw">return</span> <span class="kw">False</span>
    <span class="cmt"># ERREUR : return oublié devant l'appel</span>
    est_palindrome_faux(s, i + 1, j - 1)</pre>
<pre class="codeblock">print(est_palindrome_faux(<span class="str">"radar"</span>, 0, 4))  <span class="cmt"># None</span></pre>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LA PILE D'APPELS</div>
  <h2>Ce que fait la machine</h2>
  <div class="intro">Quand <span class="code-inline">factorielle(3)</span> appelle <span class="code-inline">factorielle(2)</span>, le calcul de <span class="code-inline">3 * …</span> est suspendu en attendant la réponse. Python doit garder la trace de tous les appels en attente : il les range dans une pile.</div>

  <div class="def-box">
    Chaque appel de fonction crée un <strong>cadre</strong> qui contient ses paramètres, ses variables locales et l'endroit où reprendre le calcul. Ces cadres sont rangés dans la <strong>pile d'appels</strong> : un nouvel appel empile son cadre au sommet ; quand un appel se termine, son cadre est retiré et sa valeur est rendue à l'appel situé juste en dessous, qui reprend son calcul. Le dernier appel commencé est le premier terminé.
  </div>

  <div class="method-box">
    <strong>Exemple — Un compte à rebours</strong>
<pre class="codeblock"><span class="kw">def</span> compte_a_rebours(n):
    <span class="cmt"># affiche n, n - 1, ..., 1 puis "partez"</span>
    <span class="kw">if</span> n == 0:
        print(<span class="str">"partez"</span>)
    <span class="kw">else</span>:
        print(n)
        compte_a_rebours(n - 1)</pre>
    <p><span class="code-inline">compte_a_rebours(3)</span> affiche :</p>
<pre class="codeblock">3
2
1
partez</pre>
    <ol>
      <li>L'appel pour \(n = 3\) affiche 3, puis appelle la fonction pour \(n = 2\) : son cadre reste dans la pile, avec \(n = 3\), jusqu'à la fin de cet appel.</li>
      <li>Au plus profond, quatre cadres sont empilés (\(n = 3, 2, 1, 0\)) ; l'appel pour \(n = 0\) affiche « partez », puis les quatre appels se terminent dans l'ordre inverse, sans rien afficher de plus.</li>
      <li>Chaque appel a son propre \(n\) : les quatre variables \(n\) des quatre cadres coexistent sans se gêner.</li>
    </ol>
  </div>

  <h3>Dépassement de la taille de la pile</h3>
  <p>La pile d'appels occupe de la mémoire, et Python en limite la hauteur à environ mille cadres. Au-delà, le programme s'arrête sur une erreur <span class="code-inline">RecursionError</span> (« maximum recursion depth exceeded »).</p>
<pre class="codeblock">factorielle(900) &gt; 0       <span class="cmt"># True</span></pre>
  <p>En revanche, <span class="code-inline">factorielle(2000)</span> provoque une <span class="code-inline">RecursionError</span> : il faudrait 2001 cadres. La même erreur survient avec un cas de base jamais atteint : <span class="code-inline">compte_a_rebours(-1)</span> appelle la fonction pour \(-2, -3, \dots\), sans jamais rencontrer \(n = 0\), jusqu'à la limite.</p>

  <div class="prop-box">
    <strong>Mémoire d'une fonction récursive.</strong> Une récursion de profondeur \(p\) (nombre maximal d'appels en attente simultanément) utilise un espace au moins proportionnel à \(p\). La profondeur de <span class="code-inline">factorielle(n)</span> vaut \(n + 1\) : espace \(O(n)\), alors que la boucle équivalente n'utilise qu'un espace \(O(1)\). La complexité en espace est étudiée dans le chapitre <em>Spécification, correction et complexité</em>.
  </div>

  <div class="notice"><strong>Erreur classique</strong> : un cas de base trop étroit. Avec le test <span class="code-inline">n == 0</span>, un argument négatif ne l'atteint jamais ; écrire la précondition (« \(n\) entier \(\ge 0\) ») et, si besoin, la vérifier par <span class="code-inline">assert n &gt;= 0</span>. Une condition <span class="code-inline">n &lt;= 0</span> rend le cas de base plus robuste.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TERMINAISON, CORRECTION, COÛT</div>
  <h2>Raisonner par récurrence</h2>
  <div class="intro">Les outils de preuve des boucles se transposent aux fonctions récursives : un variant prouve la terminaison, une récurrence prouve la correction, une relation de récurrence donne le coût. Leur présentation générale est dans le chapitre <em>Spécification, correction et complexité</em> ; on les applique ici.</div>

  <div class="prop-box">
    <strong>Terminaison : un variant.</strong> On cherche une quantité entière, positive ou nulle tant qu'on n'est pas dans un cas de base, qui diminue strictement d'un appel au suivant : \(n\) pour <span class="code-inline">factorielle</span>, \(j - i\) pour <span class="code-inline">est_palindrome</span> (qui baisse de 2), la longueur de la liste pour une fonction qui s'appelle sur une liste plus courte. Une suite d'entiers positifs strictement décroissante est finie : un cas de base finit par être atteint.
  </div>
  <div class="prop-box">
    <strong>Correction : une récurrence.</strong> On démontre « l'appel sur toute donnée de taille \(k\) renvoie le bon résultat » par récurrence (souvent forte) sur \(k\) : on vérifie les cas de base, puis, en supposant les appels plus petits corrects, on montre que la combinaison de leurs résultats est correcte. Pour <span class="code-inline">est_palindrome</span> : si \(s[i] = s[j]\), la portion \(s[i..j]\) est un palindrome si et seulement si \(s[i+1..j-1]\) en est un, ce que l'appel récursif dit correctement par hypothèse de récurrence.
  </div>

  <h3>Le coût : une relation de récurrence</h3>
  <p>Le coût \(C(n)\) d'un appel s'exprime à l'aide du coût des appels qu'il fait. Pour <span class="code-inline">factorielle</span>, un appel fait une multiplication et un appel sur \(n - 1\) : \(C(n) = C(n-1) + c\), d'où \(C(n) = O(n)\). Une écriture récursive peut toutefois cacher un coût bien plus élevé que celui de la boucle correspondante.</p>
<pre class="codeblock"><span class="kw">def</span> fib(n):
    <span class="cmt"># n-ième terme de la suite de Fibonacci (n &gt;= 0)</span>
    <span class="kw">if</span> n &lt;= 1:
        <span class="kw">return</span> n
    <span class="kw">return</span> fib(n - 1) + fib(n - 2)</pre>
<pre class="codeblock"><span class="kw">def</span> nb_appels(n):
    <span class="cmt"># nombre d'appels de fib provoqués par fib(n)</span>
    <span class="kw">if</span> n &lt;= 1:
        <span class="kw">return</span> 1
    <span class="kw">return</span> 1 + nb_appels(n - 1) + nb_appels(n - 2)</pre>
<pre class="codeblock">fib(10)            <span class="cmt"># 55</span>
nb_appels(10)      <span class="cmt"># 177</span>
nb_appels(20)      <span class="cmt"># 21891</span></pre>

<figcaption>Arbre des appels de <span class="code-inline">fib(5)</span> : chaque nœud est un appel <span class="code-inline">fib(k)</span>, étiqueté par \(k\). Il y a 15 appels pour calculer \(F_5 = 5\), et le même calcul <span class="code-inline">fib(2)</span> est refait trois fois (en couleur).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — Pourquoi <span class="code-inline">fib</span> est si lente</strong>
    <ol>
      <li>Le nombre d'appels \(A(n)\) provoqués par <span class="code-inline">fib(n)</span> vérifie \(A(0) = A(1) = 1\) et \(A(n) = 1 + A(n-1) + A(n-2)\).</li>
      <li>On vérifie par récurrence que \(A(n) = 2F_{n+1} - 1\), où \(F_k\) est le \(k\)-ième terme de la suite de Fibonacci : \(A(10) = 2 \times 89 - 1 = 177\), \(A(30) = 2\,692\,537\).</li>
      <li>Comme \(F_n\) croît comme \(\varphi^n\) avec \(\varphi = (1 + \sqrt 5)/2 \approx 1{,}62\), le coût est <strong>exponentiel</strong> : chaque unité de plus sur \(n\) multiplie le temps par 1,6 environ.</li>
      <li>La cause : les mêmes calculs sont refaits (sur l'arbre, <span class="code-inline">fib(2)</span> trois fois pour \(n = 5\)). Une boucle qui garde les deux derniers termes fait \(n\) tours :</li>
    </ol>
<pre class="codeblock"><span class="kw">def</span> fib_iter(n):
    a, b = 0, 1                <span class="cmt"># F(0), F(1)</span>
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        a, b = b, a + b        <span class="cmt"># F(k + 1), F(k + 2)</span>
    <span class="kw">return</span> a</pre>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : juger le coût d'une fonction récursive à la longueur de son code. Deux appels récursifs sur des données à peine plus petites (\(n - 1\) et \(n - 2\)) donnent un coût exponentiel ; deux appels sur des moitiés (tri fusion) donnent \(O(n \log n)\) ; un seul appel sur une moitié donne \(O(\log n)\) (§4). Garder en mémoire les résultats déjà calculés (mémoïsation) supprime les recalculs : c'est l'objet de la programmation dynamique, en 2ᵉ année.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · DICHOTOMIE ET EXPONENTIATION RAPIDE RÉCURSIVES</div>
  <h2>Diviser le problème par deux</h2>
  <div class="intro">Les deux algorithmes dichotomiques du programme s'écrivent naturellement de façon récursive : chercher dans une liste triée, c'est chercher dans l'une de ses moitiés ; calculer \(x^n\), c'est calculer \(x^{\lfloor n/2 \rfloor}\) et l'élever au carré. On garde les notations du chapitre <em>Recherche séquentielle, dictionnaires et dichotomie</em>.</div>

  <h3>Recherche dichotomique</h3>
  <p>Les bornes \(g\) et \(d\) de l'intervalle de recherche, variables de la boucle dans la version itérative, deviennent des paramètres ; l'intervalle vide \(g \gt d\) est le cas de base.</p>
<pre class="codeblock"><span class="kw">def</span> dicho_rec(x, t, g, d):
    <span class="cmt"># t triée ; renvoie un indice i de [g, d] tel que</span>
    <span class="cmt"># t[i] == x, ou -1 si x n'est pas dans t[g..d]</span>
    <span class="kw">if</span> g &gt; d:                        <span class="cmt"># intervalle vide</span>
        <span class="kw">return</span> -1
    m = (g + d) // 2
    <span class="kw">if</span> t[m] == x:
        <span class="kw">return</span> m
    <span class="kw">elif</span> t[m] &lt; x:
        <span class="kw">return</span> dicho_rec(x, t, m + 1, d)
    <span class="kw">else</span>:
        <span class="kw">return</span> dicho_rec(x, t, g, m - 1)


<span class="kw">def</span> dicho_r(x, t):
    <span class="kw">return</span> dicho_rec(x, t, 0, len(t) - 1)</pre>
<pre class="codeblock">t = [3, 8, 12, 17, 21, 26, 30, 34,
     41, 47, 52, 58, 63, 70, 77, 85]
dicho_r(52, t)     <span class="cmt"># 10</span>
dicho_r(50, t)     <span class="cmt"># -1</span>
dicho_r(3, t)      <span class="cmt"># 0</span></pre>
  <div class="method-box">
    <strong>Exemple — Les appels pour \(x = 52\), puis \(x = 50\)</strong>
<div><table>
<tr><th><span class="code-inline">x</span></th><th>appel</th><th><span class="code-inline">g</span></th><th><span class="code-inline">d</span></th><th><span class="code-inline">m</span></th><th><span class="code-inline">t[m]</span></th><th>suite</th></tr>
<tr><td>52</td><td>1</td><td>0</td><td>15</td><td>7</td><td>34</td><td>34 &lt; 52 : appel sur [8, 15]</td></tr>
<tr><td></td><td>2</td><td>8</td><td>15</td><td>11</td><td>58</td><td>58 &gt; 52 : appel sur [8, 10]</td></tr>
<tr><td></td><td>3</td><td>8</td><td>10</td><td>9</td><td>47</td><td>47 &lt; 52 : appel sur [10, 10]</td></tr>
<tr><td></td><td>4</td><td>10</td><td>10</td><td>10</td><td>52</td><td>trouvé : renvoie 10</td></tr>
<tr><td>50</td><td>1</td><td>0</td><td>15</td><td>7</td><td>34</td><td>34 &lt; 50 : appel sur [8, 15]</td></tr>
<tr><td></td><td>2</td><td>8</td><td>15</td><td>11</td><td>58</td><td>58 &gt; 50 : appel sur [8, 10]</td></tr>
<tr><td></td><td>3</td><td>8</td><td>10</td><td>9</td><td>47</td><td>47 &lt; 50 : appel sur [10, 10]</td></tr>
<tr><td></td><td>4</td><td>10</td><td>10</td><td>10</td><td>52</td><td>52 &gt; 50 : appel sur [10, 9]</td></tr>
<tr><td></td><td>5</td><td>10</td><td>9</td><td>—</td><td>—</td><td>intervalle vide : renvoie <span class="code-inline">-1</span></td></tr>
</table></div>
    <ol>
      <li>Chaque appel fait une comparaison avec la case du milieu et au plus un appel récursif, sur un intervalle deux fois plus court.</li>
      <li>La valeur trouvée (10) ou l'échec (\(-1\)) est renvoyée telle quelle par tous les appels en attente : la remontée ne fait aucun calcul.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Terminaison, correction, coût.</strong> Variant : la longueur \(d - g + 1\) de l'intervalle, qui diminue strictement à chaque appel (\(m\) est exclu). Correction par récurrence sur cette longueur : la liste étant triée, si \(t[m] \lt x\), \(x\) ne peut être que dans \(t[m+1..d]\), et l'appel récursif y répond correctement. Coût : \(C(L) = C(\lfloor L/2 \rfloor) + c\), d'où \(O(\log n)\), avec au plus \(\lfloor \log_2 n \rfloor + 2\) appels : 31 pour un milliard de valeurs, la pile n'est jamais un problème.
  </div>
  <div class="notice"><strong>Erreur classique</strong> : passer des tranches au lieu des indices. La fonction ci-dessous est correcte, mais chaque tranche recopie une moitié de liste : \(n/2 + n/4 + \dots \le n\) cases copiées, coût \(O(n)\), et l'on perd tout le gain de la dichotomie. De plus, un indice dans une tranche n'est plus un indice dans <span class="code-inline">t</span>.</div>
<pre class="codeblock"><span class="kw">def</span> appartient(x, t):
    <span class="cmt"># t triée ; version avec tranches : correcte, mais</span>
    <span class="cmt"># chaque appel recopie une moitié de la liste</span>
    <span class="kw">if</span> len(t) == 0:
        <span class="kw">return</span> <span class="kw">False</span>
    m = len(t) // 2
    <span class="kw">if</span> t[m] == x:
        <span class="kw">return</span> <span class="kw">True</span>
    <span class="kw">elif</span> t[m] &lt; x:
        <span class="kw">return</span> appartient(x, t[m + 1:len(t)])
    <span class="kw">else</span>:
        <span class="kw">return</span> appartient(x, t[0:m])</pre>

  <h3>Exponentiation rapide</h3>
  <p>Pour \(n \ge 1\), avec \(y = x^{\lfloor n/2 \rfloor}\), on a \(x^n = y^2\) si \(n\) est pair et \(x^n = x\,y^2\) si \(n\) est impair :</p>
<pre class="codeblock"><span class="kw">def</span> puissance_rec(x, n):
    <span class="cmt"># x nombre, n entier &gt;= 0 ; renvoie x ** n</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> 1
    y = puissance_rec(x, n // 2)     <span class="cmt"># un seul appel</span>
    <span class="kw">if</span> n % 2 == 0:
        <span class="kw">return</span> y * y
    <span class="kw">else</span>:
        <span class="kw">return</span> x * y * y</pre>
<pre class="codeblock">puissance_rec(3, 13)     <span class="cmt"># 1594323</span>
puissance_rec(2, 10)     <span class="cmt"># 1024</span></pre>
  <p>Un appel fait au plus deux multiplications et <strong>un seul</strong> appel récursif, sur \(\lfloor n/2 \rfloor\) : \(C(n) = C(\lfloor n/2 \rfloor) + c\), coût \(O(\log n)\). Pour \(n = 1000\), il y a 11 appels.</p>
  <div class="notice"><strong>Erreur classique</strong> : appeler deux fois la fonction au lieu de ranger le résultat dans une variable. Le résultat est juste, mais \(C(n) = 2\,C(\lfloor n/2 \rfloor) + c\), coût \(O(n)\) : pour \(n = 1000\), 2047 appels au lieu de 11, et l'exponentiation n'est plus rapide.</div>
<pre class="codeblock"><span class="kw">def</span> puissance_lente(x, n):
    <span class="cmt"># même calcul, mais deux appels identiques</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> 1
    a = puissance_lente(x, n // 2)
    b = puissance_lente(x, n // 2)    <span class="cmt"># le même calcul !</span>
    <span class="kw">if</span> n % 2 == 0:
        <span class="kw">return</span> a * b
    <span class="kw">else</span>:
        <span class="kw">return</span> x * a * b</pre>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FIGURES ALPHANUMÉRIQUES</div>
  <h2>Dessiner avec des <span class="code-inline">print</span></h2>
  <div class="intro">Une figure faite de caractères s'affiche ligne par ligne. Chaque <span class="code-inline">print</span> écrit une ligne ; on fabrique cette ligne par répétition (<span class="code-inline">"*" * 4</span> vaut <span class="code-inline">"****"</span>) et concaténation de chaînes. L'ordre des lignes dépend de la place du <span class="code-inline">print</span> par rapport à l'appel récursif.</div>

<pre class="codeblock"><span class="kw">def</span> triangle(n):
    <span class="cmt"># affiche n lignes de 1, 2, ..., n étoiles</span>
    <span class="kw">if</span> n &gt; 0:
        triangle(n - 1)      <span class="cmt"># les n - 1 premières</span>
        print(<span class="str">"*"</span> * n)       <span class="cmt"># puis la plus longue</span></pre>
  <p><span class="code-inline">triangle(4)</span> affiche :</p>
<pre class="codeblock">*
**
***
****</pre>
<pre class="codeblock"><span class="kw">def</span> triangle_inverse(n):
    <span class="kw">if</span> n &gt; 0:
        print(<span class="str">"*"</span> * n)       <span class="cmt"># d'abord la plus longue</span>
        triangle_inverse(n - 1)</pre>
  <p><span class="code-inline">triangle_inverse(4)</span> affiche :</p>
<pre class="codeblock">****
***
**
*</pre>

  <div class="prop-box">
    <strong>Avant ou après l'appel ?</strong> Un <span class="code-inline">print</span> placé <strong>avant</strong> l'appel récursif est exécuté pendant la descente : les lignes sortent dans l'ordre des appels (\(n\), puis \(n - 1\)…). Placé <strong>après</strong>, il est exécuté pendant la remontée : les lignes sortent dans l'ordre inverse (l'appel le plus profond d'abord).
  </div>

  <div class="method-box">
    <strong>Exemple — Les graduations d'une règle</strong>
    <p>Sur une règle, le trait du milieu est le plus long, et chaque moitié reproduit la règle entière en plus petit :</p>
<pre class="codeblock"><span class="kw">def</span> regle(n):
    <span class="cmt"># graduations d'une règle : 2 ** n - 1 traits,</span>
    <span class="cmt"># le plus long (n tirets) au milieu</span>
    <span class="kw">if</span> n &gt; 0:
        regle(n - 1)
        print(<span class="str">"-"</span> * n)
        regle(n - 1)</pre>
    <p><span class="code-inline">regle(3)</span> affiche :</p>
<pre class="codeblock">-
--
-
---
-
--
-</pre>
    <ol>
      <li>Le nombre de lignes \(L(n)\) vérifie \(L(0) = 0\) et \(L(n) = 2L(n-1) + 1\), d'où \(L(n) = 2^n - 1\) (7 lignes pour \(n = 3\), 1023 pour \(n = 10\)).</li>
      <li>La profondeur de la récursion n'est que \(n + 1\) : pas de risque pour la pile, mais un nombre de lignes exponentiel.</li>
    </ol>
  </div>

  <h3>Une fractale en caractères</h3>
  <p>Le triangle de Sierpiński d'ordre \(n\) est formé de trois copies de celui d'ordre \(n - 1\) : une en haut, centrée, deux en bas, côte à côte. La fonction renvoie la liste de ses lignes ; on les affiche ensuite.</p>
<pre class="codeblock"><span class="kw">def</span> sierpinski(n):
    <span class="cmt"># lignes du triangle de Sierpiński d'ordre n</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> [<span class="str">"*"</span>]
    t = sierpinski(n - 1)
    k = len(t)                  <span class="cmt"># 2 ** (n - 1) lignes</span>
    haut = [<span class="str">" "</span> * k + ligne + <span class="str">" "</span> * k <span class="kw">for</span> ligne <span class="kw">in</span> t]
    bas = [ligne + <span class="str">" "</span> + ligne <span class="kw">for</span> ligne <span class="kw">in</span> t]
    <span class="kw">return</span> haut + bas</pre>
<pre class="codeblock"><span class="kw">for</span> ligne <span class="kw">in</span> sierpinski(3):
    print(ligne)</pre>
<pre class="codeblock">       *
      * *
     *   *
    * * * *
   *       *
  * *     * *
 *   *   *   *
* * * * * * * *</pre>
  <p>L'ordre \(n\) a \(2^n\) lignes de \(2^{n+1} - 1\) caractères et \(3^n\) étoiles. Construire la liste puis l'afficher sépare le calcul de la figure de son affichage, ce qui permet aussi de la tester.</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DESSINS DE FRACTALES</div>
  <h2>Des figures faites de copies d'elles-mêmes</h2>
  <div class="intro">Une fractale est une figure qui se compose de copies réduites d'elle-même : un flocon, une côte rocheuse, un arbre. Une fonction récursive en calcule les points ; une bibliothèque graphique, documentée dans l'énoncé, les trace.</div>

  <div class="def-box">
    <strong>Courbe de von Koch.</strong> À l'ordre 0, c'est le segment \([a, b]\). À l'ordre \(n \ge 1\), on coupe \([a, b]\) en trois aux points \(p\) et \(q\), on construit le triangle équilatéral \(p\,r\,q\) vers l'extérieur, et l'on remplace \([a, b]\) par les courbes d'ordre \(n - 1\) sur \([a, p]\), \([p, r]\), \([r, q]\) et \([q, b]\).
  </div>
<pre class="codeblock"><span class="kw">import</span> math      <span class="cmt"># math.sqrt(x) : racine carrée de x</span>


<span class="kw">def</span> koch(a, b, n):
    <span class="cmt"># points de la courbe de von Koch d'ordre n de a à b</span>
    <span class="cmt"># (a, b : couples (x, y)) ; a inclus, b exclu</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> [a]
    xa, ya = a
    xb, yb = b
    dx, dy = (xb - xa) / 3, (yb - ya) / 3
    p = (xa + dx, ya + dy)             <span class="cmt"># au tiers</span>
    q = (xa + 2 * dx, ya + 2 * dy)     <span class="cmt"># aux deux tiers</span>
    h = math.sqrt(3) / 2
    <span class="cmt"># sommet r : [p, q] tourné de 60° autour de p</span>
    r = (p[0] + dx / 2 - h * dy, p[1] + dy / 2 + h * dx)
    <span class="kw">return</span> (koch(a, p, n - 1) + koch(p, r, n - 1)
            + koch(r, q, n - 1) + koch(q, b, n - 1))</pre>
<pre class="codeblock">len(koch((0, 0), (1, 0), 3))     <span class="cmt"># 64</span></pre>

</figure>
  <p>La fonction renvoie les points de la courbe, extrémité \(a\) comprise et \(b\) exclue, ce qui évite de répéter chaque point de jonction ; on ajoute \(b\) à la fin pour tracer. Le tracé utilise le module <span class="code-inline">matplotlib</span>, documenté :</p>
<pre class="codeblock"><span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
<span class="cmt"># plt.plot(X, Y) : ligne brisée des points (X[k], Y[k]) ;</span>
<span class="cmt"># plt.axis("equal") : même échelle sur les deux axes ;</span>
<span class="cmt"># plt.show() : affiche la figure</span>


<span class="kw">def</span> dessiner_koch(n):
    pts = koch((0, 0), (1, 0), n) + [(1, 0)]
    X = [p[0] <span class="kw">for</span> p <span class="kw">in</span> pts]
    Y = [p[1] <span class="kw">for</span> p <span class="kw">in</span> pts]
    plt.plot(X, Y)
    plt.axis(<span class="str">"equal"</span>)
    plt.show()</pre>

  <div class="prop-box">
    <strong>Combien de segments ?</strong> Chaque appel d'ordre \(n \ge 1\) fait quatre appels d'ordre \(n - 1\) : la courbe d'ordre \(n\) a \(4^n\) segments de longueur \(3^{-n}\) (pour \(|ab| = 1\)), donc une longueur totale \((4/3)^n\), qui tend vers l'infini. Le nombre d'appels est \(1 + 4 + \dots + 4^n = \dfrac{4^{n+1} - 1}{3}\) : coût \(O(4^n)\). À l'ordre 10, plus d'un million de points ; au-delà de l'ordre 6, l'écran ne montre plus de différence.
  </div>

  <div class="method-box">
    <strong>Exemple — Un arbre fractal</strong>
    <p>Un arbre est un tronc qui porte deux arbres plus petits. On renvoie la liste des segments à tracer :</p>
<pre class="codeblock"><span class="kw">def</span> branches(x, y, angle, longueur, n):
    <span class="cmt"># segments [(x, y), (x2, y2)] d'un arbre d'ordre n,</span>
    <span class="cmt"># tronc partant de (x, y) dans la direction angle</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> []
    x2 = x + longueur * math.cos(angle)
    y2 = y + longueur * math.sin(angle)
    a1 = angle + math.pi / 6           <span class="cmt"># branche gauche</span>
    a2 = angle - math.pi / 6           <span class="cmt"># branche droite</span>
    lg = 0.7 * longueur          <span class="cmt"># plus courtes</span>
    <span class="kw">return</span> ([[(x, y), (x2, y2)]]
            + branches(x2, y2, a1, lg, n - 1)
            + branches(x2, y2, a2, lg, n - 1))</pre>
<pre class="codeblock">len(branches(0, 0, math.pi / 2, 1, 7))    <span class="cmt"># 127</span></pre>

<div class="course-section">
  <div class="sec-num">§7 · ÉNUMÉRER LES SOUS-LISTES</div>
  <h2>Avec ou sans le premier élément</h2>
  <div class="intro">Choisir des objets à emporter, des projets à financer, des pièces pour faire une somme : quand on ne connaît pas d'algorithme plus astucieux, on essaie tous les choix possibles. La récursion les engendre méthodiquement : chaque élément est pris ou laissé.</div>

  <div class="def-box">
    Une <strong>sous-liste</strong> de \(t\) est une liste obtenue en retirant de \(t\) certains éléments, sans changer l'ordre des autres : [7, 2] est une sous-liste de [4, 7, 1, 2]. Ses éléments ne sont pas forcément voisins dans \(t\) (les tranches <span class="code-inline">t[a:b]</span> n'en sont qu'un cas particulier). Chaque élément étant pris ou non, une liste de \(n\) éléments a \(2^n\) sous-listes (la liste vide et \(t\) comprises).
  </div>
<pre class="codeblock"><span class="kw">def</span> sous_listes(t):
    <span class="cmt"># liste des 2 ** len(t) sous-listes de t</span>
    <span class="cmt"># (éléments gardés dans leur ordre)</span>
    <span class="kw">if</span> len(t) == 0:
        <span class="kw">return</span> [[]]
    reste = sous_listes(t[1:len(t)])     <span class="cmt"># sans t[0]</span>
    avec = [[t[0]] + s <span class="kw">for</span> s <span class="kw">in</span> reste]   <span class="cmt"># avec t[0]</span>
    <span class="kw">return</span> reste + avec</pre>
<pre class="codeblock">u = sous_listes([1, 2, 3])
u[0:4]        <span class="cmt"># [[], [3], [2], [2, 3]]</span>
u[4:8]        <span class="cmt"># [[1], [1, 3], [1, 2], [1, 2, 3]]</span>
len(sous_listes([4, 7, 1, 8, 2, 9, 5]))    <span class="cmt"># 128</span></pre>

  <div class="prop-box">
    <strong>Correction et coût.</strong> Une sous-liste de \(t\) (non vide) ne contient pas \(t[0]\), et c'est une sous-liste de \(t[1..n-1]\), ou elle le contient, et c'est \(t[0]\) suivi d'une sous-liste de \(t[1..n-1]\) : par récurrence sur \(n\), la fonction renvoie chacune exactement une fois. Leur nombre vérifie \(N(0) = 1\) et \(N(n) = 2N(n-1)\), soit \(2^n\). La fonction ne fait que \(n + 1\) appels (un par longueur), mais elle construit \(2^n\) listes de longueur moyenne \(n/2\) : coût \(O(n\,2^n)\), et autant de mémoire.
  </div>

  <div class="method-box">
    <strong>Exemple — Atteindre une somme avec une partie des valeurs</strong>
    <p>Pour savoir si des valeurs de \(t\) peuvent totaliser \(s\), inutile de fabriquer toutes les sous-listes : on explore les deux choix pour \(t[i]\), et l'on s'arrête dès qu'un choix réussit.</p>
<pre class="codeblock"><span class="kw">def</span> somme_atteinte(t, i, s):
    <span class="cmt"># True si une sous-liste de t[i..n-1] a pour somme s</span>
    <span class="kw">if</span> i == len(t):
        <span class="kw">return</span> s == 0
    <span class="kw">if</span> somme_atteinte(t, i + 1, s - t[i]):   <span class="cmt"># avec t[i]</span>
        <span class="kw">return</span> <span class="kw">True</span>
    <span class="kw">return</span> somme_atteinte(t, i + 1, s)       <span class="cmt"># sans t[i]</span></pre>
<pre class="codeblock">somme_atteinte([8, 3, 11, 5, 7], 0, 20)    <span class="cmt"># True</span>
somme_atteinte([8, 3, 11, 5, 7], 0, 6)     <span class="cmt"># False</span></pre>
    <ol>
      <li>\(20 = 8 + 5 + 7\) ; aucune sous-liste n'a pour somme 6.</li>
      <li>Dans le pire cas (réponse négative), les deux appels sont faits à chaque niveau : \(2^{n+1} - 1\) appels, coût \(O(2^n)\). Pour \(n = 30\), plus d'un milliard d'appels : l'énumération n'est praticable que pour de petites listes.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : écrire l'appel récursif deux fois, une pour les sous-listes « avec » et une pour les sous-listes « sans ». Chaque niveau double alors le travail : \(2^{n+1} - 1\) appels au lieu de \(n + 1\). On range le résultat de <span class="code-inline">sous_listes(t[1:len(t)])</span> dans une variable et on s'en sert deux fois.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ÉNUMÉRER LES PERMUTATIONS</div>
  <h2>Choisir le premier, permuter le reste</h2>
  <div class="intro">Dans quel ordre visiter des clients, enchaîner des tâches, placer des invités ? Essayer tous les ordres revient à énumérer les permutations : le premier élément est l'un quelconque des \(n\), suivi d'une permutation des \(n - 1\) autres.</div>

  <div class="def-box">
    Une <strong>permutation</strong> d'une liste de \(n\) valeurs distinctes est une liste formée des mêmes valeurs dans un ordre quelconque. Il y en a \(n! = n \times (n-1) \times \dots \times 1\) : \(n\) choix pour la première place, puis \(n - 1\) pour la deuxième, etc.
  </div>
<pre class="codeblock"><span class="kw">def</span> permutations(t):
    <span class="cmt"># liste des permutations de t (valeurs distinctes)</span>
    <span class="kw">if</span> len(t) &lt;= 1:
        <span class="kw">return</span> [t.copy()]
    res = []
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        reste = t[0:i] + t[i + 1:len(t)]   <span class="cmt"># t sans t[i]</span>
        <span class="kw">for</span> p <span class="kw">in</span> permutations(reste):
            res.append([t[i]] + p)   <span class="cmt"># t[i] en tête</span>
    <span class="kw">return</span> res</pre>
<pre class="codeblock">u = permutations([1, 2, 3])
u[0:3]        <span class="cmt"># [[1, 2, 3], [1, 3, 2], [2, 1, 3]]</span>
u[3:6]        <span class="cmt"># [[2, 3, 1], [3, 1, 2], [3, 2, 1]]</span>
len(permutations([1, 2, 3, 4, 5, 6]))     <span class="cmt"># 720</span></pre>

  <div class="prop-box">
    <strong>Correction et coût.</strong> Une permutation de \(t\) commence par une valeur \(t[i]\) bien déterminée, suivie d'une permutation des autres valeurs : par récurrence sur \(n\), la fonction renvoie chacune exactement une fois, soit \(n \times (n-1)! = n!\) listes. Elle termine car <span class="code-inline">reste</span> est plus court d'un élément. Le résultat compte \(n!\) listes de longueur \(n\) : le coût est au moins de l'ordre de \(n \cdot n!\). Pour \(n = 10\), \(3\,628\,800\) permutations ; pour \(n = 15\), \(1{,}3 \times 10^{12}\), hors de portée.
  </div>

  <div class="method-box">
    <strong>Exemple — Les anagrammes d'un mot</strong>
    <p>Le même schéma s'applique à une chaîne de caractères, en concaténant des chaînes au lieu de listes :</p>
<pre class="codeblock"><span class="kw">def</span> anagrammes(mot):
    <span class="cmt"># chaînes formées des lettres de mot (distinctes)</span>
    <span class="kw">if</span> len(mot) &lt;= 1:
        <span class="kw">return</span> [mot]
    res = []
    <span class="kw">for</span> i <span class="kw">in</span> range(len(mot)):
        reste = mot[0:i] + mot[i + 1:len(mot)]
        <span class="kw">for</span> a <span class="kw">in</span> anagrammes(reste):
            res.append(mot[i] + a)
    <span class="kw">return</span> res</pre>
<pre class="codeblock">anagrammes(<span class="str">"ami"</span>)
<span class="cmt"># ['ami', 'aim', 'mai', 'mia', 'iam', 'ima']</span></pre>
    <ol>
      <li>Les lettres sont supposées distinctes. Avec des lettres répétées, des anagrammes sont produites plusieurs fois : « elle » en donne 24, dont 6 seulement sont différentes. On élimine les doublons avec un dictionnaire (chapitre <em>Recherche séquentielle, dictionnaires et dichotomie</em>).</li>
      <li>La profondeur de la récursion vaut la longueur du mot : seul le nombre de résultats pose problème.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : écrire <span class="code-inline">reste = t[0:i] + t[i:len(t)]</span>. On a oublié de retirer \(t[i]\) : <span class="code-inline">reste</span> est égale à \(t\), l'appel récursif se fait sur une liste de même longueur, et le programme s'arrête sur une <span class="code-inline">RecursionError</span>. Le variant (la longueur) doit diminuer.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · RÉCURSIF OU ITÉRATIF ?</div>
  <h2>Choisir la bonne écriture</h2>
  <div class="intro">Tout algorithme récursif peut s'écrire avec des boucles, quitte à gérer soi-même une pile des tâches en attente, et inversement. Le choix se fait sur la clarté du code, son coût et la profondeur des appels.</div>

  <div class="prop-box">
    <strong>Récursion terminale.</strong> Quand l'appel récursif est la dernière opération et que son résultat est renvoyé tel quel (c'est le cas de <span class="code-inline">dicho_rec</span> et de <span class="code-inline">est_palindrome</span>), la traduction en boucle est immédiate : les paramètres deviennent des variables, l'appel récursif devient une mise à jour de ces variables, et le cas de base devient la condition d'arrêt.
  </div>
<pre class="codeblock"><span class="kw">def</span> dicho_iter(x, t):
    g, d = 0, len(t) - 1    <span class="cmt"># paramètres du 1er appel</span>
    <span class="kw">while</span> g &lt;= d:           <span class="cmt"># pas encore le cas de base</span>
        m = (g + d) // 2
        <span class="kw">if</span> t[m] == x:
            <span class="kw">return</span> m
        <span class="kw">elif</span> t[m] &lt; x:
            g = m + 1       <span class="cmt"># au lieu d'un appel</span>
        <span class="kw">else</span>:
            d = m - 1
    <span class="kw">return</span> -1</pre>

  <div><table>
    <tr><th>Situation</th><th>Écriture conseillée</th><th>Raison</th></tr>
    <tr><td>Diviser pour régner (tri fusion, tri rapide, dichotomie)</td><td>récursive</td><td>code proche de l'idée ; profondeur \(O(\log n)\) le plus souvent</td></tr>
    <tr><td>Énumérations (sous-listes, permutations), figures et fractales</td><td>récursive</td><td>la boucle demanderait de gérer une pile à la main</td></tr>
    <tr><td>Parcours d'une liste, d'une chaîne, compteur de 1 à \(n\)</td><td>itérative</td><td>profondeur \(n\) : <span class="code-inline">RecursionError</span> dès \(n \approx 1000\) ; espace \(O(n)\) au lieu de \(O(1)\)</td></tr>
    <tr><td>Suites récurrentes à plusieurs termes (Fibonacci)</td><td>itérative (ou mémoïsation)</td><td>la récursion naïve refait les mêmes calculs : coût exponentiel</td></tr>
  </table></div>

  <div class="notice"><strong>Erreur classique</strong> : compter sur Python pour transformer une récursion terminale en boucle. Il ne le fait pas : une fonction récursive qui parcourt une liste de \(10^5\) éléments un par un dépasse la pile, même écrite en récursion terminale.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Au-delà du programme</h2>
  <ul>
    <li><strong>Changer la limite de la pile</strong> : <span class="code-inline">sys.setrecursionlimit(10000)</span> (module <span class="code-inline">sys</span>) augmente la profondeur permise, mais la pile réelle de la machine reste bornée et le programme peut s'arrêter brutalement. Mieux vaut réécrire la fonction.</li>
    <li><strong>Mémoïsation</strong> : en rangeant dans un dictionnaire les valeurs déjà calculées, <span class="code-inline">fib(n)</span> ne fait plus que \(O(n)\) appels. C'est le point de départ de la programmation dynamique (2ᵉ année).</li>
    <li><strong>Récursion terminale</strong> : certains langages (OCaml, enseigné en filière MP) transforment automatiquement un appel terminal en saut, sans empiler de cadre.</li>
    <li><strong>Fonctions mutuellement récursives</strong> : <span class="code-inline">pair(n)</span> appelle <span class="code-inline">impair(n - 1)</span> et réciproquement ; les mêmes outils de preuve s'appliquent.</li>
    <li><strong>Fonction d'Ackermann</strong> : définie par une double récurrence, elle termine toujours, mais croît si vite qu'aucune boucle <span class="code-inline">for</span> à nombre de tours fixé à l'avance ne peut la calculer.</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="recu-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · RÉCURSIVITÉ</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Écrire une fonction récursive qui termine, la dérouler, prouver qu'elle est juste, prévoir son coût et sa profondeur, et reconnaître les schémas classiques (dichotomie, figures, énumérations) : les savoir-faire attendus aux écrits comme aux oraux.</div>

  <div class="method-box"><strong>Méthode 1 — Écrire une fonction récursive</strong>
    <ol>
      <li><span class="step">Cas de base.</span> Identifier le plus petit cas, traité sans appel : liste ou chaîne vide, \(n = 0\), intervalle vide \(g \gt d\).</li>
      <li><span class="step">Réduction.</span> Exprimer le cas général à l'aide du même problème sur une donnée strictement plus petite (longueur moins un, moitié, portion intérieure).</li>
      <li><span class="step">Combinaison.</span> Fabriquer le résultat à partir de celui des appels, et le <em>renvoyer</em> par <span class="code-inline">return</span>.</li>
      <li><span class="step">Signature.</span> Si la récursion a besoin de paramètres supplémentaires (indices \(i, j\) ou \(g, d\)), écrire une fonction d'appel qui fixe leurs valeurs initiales.</li>
    </ol>
    <p><em>Exemple éclair :</em> un entier \(n \ge 10\) a un chiffre de plus que \(n /\!/ 10\).</p>
<pre class="codeblock"><span class="kw">def</span> nb_chiffres(n):
    <span class="cmt"># nombre de chiffres de l'entier n &gt;= 0 en base 10</span>
    <span class="kw">if</span> n &lt; 10:                       <span class="cmt"># cas de base</span>
        <span class="kw">return</span> 1
    <span class="kw">return</span> 1 + nb_chiffres(n // 10)  <span class="cmt"># n // 10 &lt; n</span></pre>
<pre class="codeblock">nb_chiffres(2026)      <span class="cmt"># 4</span>
nb_chiffres(7)         <span class="cmt"># 1</span></pre>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire l'appel récursif sans <span class="code-inline">return</span> devant (la fonction renvoie <span class="code-inline">None</span>), ou un cas de base qu'un argument ne peut pas atteindre (<span class="code-inline">n == 0</span> pour un \(n\) négatif ou qui diminue de 2 en 2).</div>

  <div class="method-box"><strong>Méthode 2 — Dérouler un appel récursif</strong>
    <ol>
      <li><span class="step">Descente.</span> Écrire l'appel initial, puis les appels qu'il provoque, avec la valeur des paramètres, jusqu'aux cas de base : une ligne par appel, décalée d'un cran à chaque niveau.</li>
      <li><span class="step">Remontée.</span> Calculer les valeurs renvoyées en partant du cas de base, chaque appel combinant la valeur reçue.</li>
      <li><span class="step">Plusieurs appels.</span> Dessiner l'arbre des appels : un nœud par appel, ses fils sont les appels qu'il fait, de gauche à droite dans l'ordre d'exécution.</li>
      <li><span class="step">Affichages.</span> Un <span class="code-inline">print</span> avant l'appel s'exécute à la descente, après l'appel à la remontée.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">nb_chiffres(2026)</span> \(= 1 +\) <span class="code-inline">nb_chiffres(202)</span> \(= 2 +\) <span class="code-inline">nb_chiffres(20)</span> \(= 3 +\) <span class="code-inline">nb_chiffres(2)</span> \(= 3 + 1 = 4\) ; quatre cadres dans la pile au plus profond.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Prouver la terminaison et la correction</strong>
    <ol>
      <li><span class="step">Variant.</span> Trouver une quantité entière, positive hors des cas de base, qui diminue strictement d'un appel au suivant : un argument entier, une longueur, \(d - g + 1\), \(j - i\).</li>
      <li><span class="step">Récurrence.</span> Énoncer la propriété « l'appel sur une donnée de taille \(k\) renvoie le bon résultat » et la démontrer par récurrence forte sur \(k\).</li>
      <li><span class="step">Cas de base</span>, puis <span class="step">hérédité</span> : en supposant les appels plus petits corrects, vérifier que la combinaison donne le bon résultat.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">nb_chiffres</span>. Variant : \(n\), car \(n /\!/ 10 \lt n\) pour \(n \ge 10\). Correction : si \(10^{k-1} \le n \lt 10^k\) avec \(k \ge 2\), alors \(10^{k-2} \le n /\!/ 10 \lt 10^{k-1}\) : \(n /\!/ 10\) a \(k - 1\) chiffres par hypothèse de récurrence, et \(n\) en a \(k\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Calculer le coût d'une fonction récursive</strong>
    <ol>
      <li><span class="step">Relation.</span> \(C(n)\) = somme des coûts des appels récursifs + travail fait hors des appels (comparaisons, multiplications, tranches et concaténations, qui coûtent leur longueur).</li>
      <li><span class="step">Reconnaître.</span> \(C(n) = C(n-1) + c\) : \(O(n)\) ; \(C(n) = C(n/2) + c\) : \(O(\log n)\) ; \(C(n) = 2\,C(n/2) + c\,n\) : \(O(n \log n)\) ; \(C(n) = 2\,C(n-1) + c\) : \(O(2^n)\).</li>
      <li><span class="step">Compter les appels</span> sur l'arbre des appels quand la relation n'est pas classique : nombre de nœuds par niveau, nombre de niveaux.</li>
      <li><span class="step">Profondeur.</span> Noter aussi la hauteur de l'arbre : c'est la profondeur de la pile, donc la mémoire utilisée et le risque de <span class="code-inline">RecursionError</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">regle(n)</span> fait deux appels sur \(n - 1\) et un <span class="code-inline">print</span> : \(L(n) = 2L(n-1) + 1\), soit \(2^n - 1\) lignes, pour une profondeur de seulement \(n + 1\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : deux appels identiques là où un seul suffit (<span class="code-inline">puissance_lente</span>), ou des appels qui se recouvrent (<span class="code-inline">fib</span>) : le coût passe de logarithmique à linéaire, ou de linéaire à exponentiel. Ranger le résultat d'un appel dans une variable.</div>

  <div class="method-box"><strong>Méthode 5 — Passer des indices plutôt que des tranches</strong>
    <ol>
      <li><span class="step">Repérer la portion</span> traitée par ses bornes (\(g, d\) ou \(i, j\)) au lieu d'en fabriquer une copie par tranche.</li>
      <li><span class="step">Adapter le cas de base</span> à la portion vide (\(g \gt d\), \(i \ge j\), \(i\) égal à la longueur).</li>
      <li><span class="step">Écrire la fonction d'appel</span> avec les bornes de la liste entière.</li>
      <li><span class="step">Gagner</span> : chaque appel coûte \(O(1)\) au lieu de \(O(n)\), et un indice renvoyé est un indice de la liste de départ.</li>
    </ol>
    <p><em>Exemple éclair :</em> une recherche dichotomique par tranches recopie \(n/2 + n/4 + \dots\) cases, soit \(O(n)\) ; avec \(g\) et \(d\), elle coûte \(O(\log n)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Énumérer des choix</strong>
    <ol>
      <li><span class="step">Sous-listes : avec ou sans.</span> Les sous-listes de \(t\) sont celles de \(t[1..n-1]\), et les mêmes précédées de \(t[0]\) : \(2^n\) résultats.</li>
      <li><span class="step">Permutations : choisir le premier.</span> Pour chaque \(i\), \(t[i]\) suivi des permutations de \(t\) privée de \(t[i]\) : \(n!\) résultats.</li>
      <li><span class="step">Recherche d'une solution.</span> Ne pas tout construire : explorer les choix récursivement et s'arrêter au premier succès (ou couper une branche qui ne peut plus réussir).</li>
      <li><span class="step">Estimer la taille</span> avant de lancer le calcul : \(2^{20} \approx 10^6\), \(2^{40} \approx 10^{12}\) ; \(10! \approx 3{,}6 \times 10^6\), \(13! \approx 6 \times 10^9\).</li>
    </ol>
    <p><em>Exemple éclair :</em> les sous-listes de 20 valeurs sont \(2^{20} = 1\,048\,576\) ; les ordres possibles de 8 villes, \(8! = 40\,320\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier de retirer l'élément choisi (<span class="code-inline">t[0:i] + t[i:len(t)]</span> au lieu de <span class="code-inline">t[0:i] + t[i + 1:len(t)]</span>) : la liste ne raccourcit pas et la récursion ne s'arrête plus.</div>

  <div class="method-box"><strong>Méthode 7 — Dessiner une figure ou une fractale</strong>
    <ol>
      <li><span class="step">Décomposer la figure</span> en copies plus petites d'elle-même (une ligne de plus, deux moitiés, trois triangles, quatre segments).</li>
      <li><span class="step">Figures en caractères.</span> Fabriquer chaque ligne par <span class="code-inline">" " * k + "*" * m</span> ; placer le <span class="code-inline">print</span> avant l'appel pour un ordre décroissant, après pour un ordre croissant ; ou renvoyer la liste des lignes et l'afficher ensuite.</li>
      <li><span class="step">Fractales.</span> Renvoyer la liste des points ou des segments, avec une convention fixe sur les extrémités, puis tracer avec la bibliothèque documentée par l'énoncé.</li>
      <li><span class="step">Compter</span> les lignes, segments ou appels par une relation de récurrence (\(4^n\) segments pour Koch).</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">triangle(n)</span> appelle <span class="code-inline">triangle(n - 1)</span> puis affiche \(n\) étoiles : lignes de 1 à \(n\) étoiles ; en inversant les deux instructions, de \(n\) à 1.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Éviter le dépassement de la pile</strong>
    <ol>
      <li><span class="step">Estimer la profondeur</span> : \(n\) appels en attente pour une réduction de 1 en 1, \(\log_2 n\) pour une division par 2.</li>
      <li><span class="step">Comparer</span> à la limite de Python, environ mille appels.</li>
      <li><span class="step">Réécrire en boucle</span> une récursion de profondeur \(n\) quand \(n\) peut être grand ; si l'appel est terminal, les paramètres deviennent des variables mises à jour dans un <span class="code-inline">while</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> compter les occurrences d'un caractère dans un texte de \(10^5\) caractères par une récursion caractère par caractère : <span class="code-inline">RecursionError</span> ; une boucle <span class="code-inline">for</span> convient. Une dichotomie récursive sur \(10^9\) valeurs ne fait que 31 appels.</p>
  </div>
</div>
</template>

  <h3>Aller et retour</h3>

    <span class="kw">if</span> n &gt; 0:
        print(<span class="str">"aller"</span>, n)
        aller_retour(n - 1)

  <div class="q"><strong>Q4.</strong> Avec cet appel <span class="code-inline">aller_retour(n - 2)</span>, on remplace aussi le test <span class="code-inline">n &gt; 0</span> par <span class="code-inline">n != 0</span>. Que se passe-t-il pour <span class="code-inline">aller_retour(3)</span> ? pour <span class="code-inline">aller_retour(4)</span> ?</div>

<pre class="codeblock">aller 3
aller 2
aller 1
retour 1
retour 2
retour 3</pre>

    <p><strong>Q3.</strong> Les appels portent sur 3, puis 1, puis \(-1\), qui ne vérifie pas \(n \gt 0\) : « aller 3 », « aller 1 », « retour 1 », « retour 3 ».</p>
    <p><strong>Q4.</strong> Pour 3, les arguments sont 3, 1, \(-1\), \(-3\)… : ils ne valent jamais 0, et le programme s'arrête sur une <span class="code-inline">RecursionError</span> après avoir affiché près de mille lignes « aller ». Pour 4, les arguments 4, 2, 0 atteignent le cas de base : « aller 4 », « aller 2 », « retour 2 », « retour 4 ». La quantité \(n\) n'est un variant que si elle reste positive ou nulle ; le test <span class="code-inline">n &gt; 0</span> le garantit, pas <span class="code-inline">n != 0</span>.</p>
