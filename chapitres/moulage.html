<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre réunit les procédés qui mettent en forme une matière rendue <strong>fluide</strong> dans une <strong>empreinte</strong> : la fonderie des métaux, l'injection des thermoplastiques et la mise en forme des composites. Le programme de sciences industrielles (compétence G2, « Industrialiser un produit ») demande dès le semestre <strong>S2</strong> d'évaluer la capacité d'un procédé à réaliser une <strong>pièce plastique</strong> et une <strong>pièce composite</strong> ; la fonderie des pièces métalliques est au semestre <strong>S3</strong> (début de 2ᵉ année) et elle est vue ici en avance, parce qu'elle installe le vocabulaire commun à tous les moulages. Les procédés additifs, cités par le programme pour ces mêmes pièces, ont leur chapitre : <a href="#addfab/cours">« Fabrication additive »</a>. En 2ᵉ année, <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a> s'en sert pour choisir et argumenter un procédé.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Évaluer la capacité d'un procédé à réaliser une pièce plastique</strong> (G2, S2) : matériaux polymères (§5), injection plastique, presse et moule (§6), cycle (§7), domaines d'application et <strong>règles de conception</strong> (§8, §12).</li>
        <li><strong>Évaluer la capacité d'un procédé à réaliser une pièce composite</strong> (G2, S2) : constituants et propriétés (§9), mise en forme des matériaux composites et domaines d'application (§10), <strong>règles de conception</strong> (§11).</li>
        <li><strong>Fondements communs</strong> : empreinte, plan de joint, dépouille, noyau, retrait ; phénomènes physiques (écoulement, refroidissement, contraction) et influence du procédé sur la géométrie de la pièce (§1).</li>
        <li><strong>Vu en avance (2ᵉ année, S3)</strong> : mise en forme des bruts métalliques par moulage, domaines d'application et règles de conception (§2 à §4) ; critères de choix d'un procédé (§12).</li>
      </ul>
      <p>Le programme limite l'analyse des procédés à une <strong>approche qualitative</strong>, appuyée sur les phénomènes physiques, les contraintes technologiques et économiques et l'influence du procédé sur la géométrie. Les calculs du chapitre (force de fermeture, temps de refroidissement, loi des mélanges, coût unitaire) donnent des <strong>ordres de grandeur</strong> qui justifient les règles ; un sujet fournirait les relations. Hors programme, regroupés en fin de chapitre : la relation du temps de refroidissement, la règle de Chvorinov, le module transverse d'un composite, les autres procédés de plasturgie et de fonderie.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · UNE EMPREINTE, UNE MATIÈRE FLUIDE, UN RETRAIT</div>
  <h2>Le principe commun à tous les moulages</h2>
  <div class="intro">Mouler, c'est donner sa forme à une matière <strong>rendue fluide</strong> en lui faisant remplir le creux d'un moule, puis la <strong>figer</strong> avant de l'extraire. Que la matière soit un métal fondu, un polymère fondu ou une résine qui imprègne des fibres, on retrouve les mêmes organes et les mêmes contraintes de tracé : les comprendre une fois sert pour tout le chapitre.</div>

  <h3>Trois phénomènes physiques</h3>
  <ul>
    <li><strong>L'écoulement</strong> : la matière doit atteindre tous les recoins de l'empreinte avant de se figer. Un métal liquide coule presque comme l'eau (viscosité de l'ordre du millipascal-seconde) : la <strong>gravité</strong> suffit à remplir un moule. Un polymère fondu est \(10^5\) à \(10^7\) fois plus visqueux (de \(10^2\) à \(10^4\ \text{Pa·s}\)) : il faut le pousser sous forte <strong>pression</strong>, d'où la presse à injecter.</li>
    <li><strong>Le refroidissement</strong> (ou la réticulation d'une résine) : c'est lui qui fige la matière, et c'est presque toujours lui qui fixe la cadence. Une paroi épaisse refroidit lentement.</li>
    <li><strong>La contraction</strong> : en refroidissant (et, pour un métal ou un polymère semi-cristallin, en se solidifiant), la matière diminue de volume. La pièce sort donc plus petite que l'empreinte : c'est le <strong>retrait</strong>.</li>
  </ul>

  <h3>Le vocabulaire commun</h3>
  <div class="def-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Empreinte</strong> : creux du moule qui donne sa forme à la pièce. Un moule peut avoir plusieurs empreintes.</li>
      <li><strong>Moule destructible</strong> (sable, carapace céramique) : détruit pour extraire chaque pièce ; <strong>moule permanent</strong> (acier, fonte) : réutilisé des milliers à des millions de fois.</li>
      <li><strong>Plan de joint</strong> : surface de séparation des parties du moule ; il laisse sur la pièce une fine ligne, parfois une bavure.</li>
      <li><strong>Dépouille</strong> : légère inclinaison des faces parallèles au sens de démoulage, pour extraire la pièce (ou le modèle) sans frottement ni arrachement.</li>
      <li><strong>Contre-dépouille</strong> : forme qui empêche le démoulage dans le sens d'ouverture (rainure latérale, joue, clip) ; elle exige un <strong>noyau</strong> ou une pièce mobile du moule.</li>
      <li><strong>Noyau</strong> : partie rapportée ou mobile qui réserve un creux de la pièce (alésage, cavité intérieure).</li>
    </ul>
  </div>

  <h3>Le retrait se compense dans l'empreinte</h3>
  <p>On note \(r\) le <strong>retrait linéaire</strong> de la matière : une longueur \(L\) de la pièce froide provient d'une longueur \(L(1+r)\) de l'empreinte. Toutes les dimensions de l'empreinte (et des noyaux) sont donc agrandies du même facteur :</p>
  <div class="formula" data-nom="Retrait au moule">$$L_{\text{empreinte}} = (1 + r)\,L_{\text{pièce}}$$</div>
  <table>
    <tr><th>Matière</th><th>Retrait linéaire \(r\) (ordre de grandeur)</th></tr>
    <tr><td>fonte grise</td><td>≈ 1 %</td></tr>
    <tr><td>alliages d'aluminium</td><td>≈ 1,3 %</td></tr>
    <tr><td>acier moulé</td><td>≈ 2 %</td></tr>
    <tr><td>thermoplastiques amorphes (ABS, PC, PS)</td><td>0,4 à 0,8 %</td></tr>
    <tr><td>thermoplastiques semi-cristallins (PP, PE, PA, POM)</td><td>1 à 2,5 %</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — une même cote, quatre empreintes</strong>
    <p>Une pièce doit mesurer 200 mm. Quelle longueur donner à l'empreinte selon la matière ?</p>
    <ol>
      <li>Alliage d'aluminium (\(r = 1{,}3\,\%\)) : \(200 \times 1{,}013 = 202{,}6\) mm.</li>
      <li>Acier moulé (\(r = 2\,\%\)) : 204,0 mm ; polypropylène (\(r = 1{,}8\,\%\)) : 203,6 mm ; ABS (\(r = 0{,}5\,\%\)) : 201,0 mm.</li>
      <li>Une erreur de 0,5 point sur \(r\) décale la cote de 1 mm : bien plus que la tolérance d'une pièce injectée (quelques dixièmes). Le retrait se mesure sur des pièces d'essai, et un moule d'injection est souvent retouché après les premiers essais.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que le moule « a la taille de la pièce ». Le modèle de fonderie et l'empreinte sont toujours plus grands, du retrait, et le modèle porte en plus les surépaisseurs des surfaces qui seront usinées. Autre erreur : oublier que les creux (alésages) suivent la même règle ; un noyau est lui aussi agrandi de \(r\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · FONDERIE : LE MOULAGE EN SABLE</div>
  <h2>Le procédé de référence, à moule destructible</h2>
  <div class="intro">La fonderie coule un métal liquide dans une empreinte. Le moulage en sable, le plus ancien et toujours le plus répandu en tonnage, fabrique un moule neuf pour chaque pièce : un outillage peu coûteux, aucune limite de taille ni de matériau, au prix d'une précision et d'un état de surface médiocres.</div>
  <div class="notice"><strong>Au programme de 2ᵉ année (S3), vu ici en avance</strong> : les §2 à §4 (fonderie des pièces métalliques) ne sont pas exigibles en PTSI. Ils posent le vocabulaire (modèle, noyau, masselotte, retassure) que l'injection et les composites reprennent, et le chapitre <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a> les réutilise en 2ᵉ année.</div>

  <h3>Le moule et ses organes</h3>
  <p>Le sable (grains de silice) est lié par de l'argile humide (« sable vert ») ou par une résine (sable à prise chimique), puis tassé autour d'un <strong>modèle</strong>, réplique de la pièce en bois, en résine ou en métal, agrandie du retrait. Le moule est fait de deux <strong>châssis</strong> séparés par le plan de joint, ce qui permet de retirer le modèle avant de refermer le moule.</p>

  <ul>
    <li><strong>Système de remplissage</strong> : bassin et <strong>descente de coulée</strong>, puis <strong>chenal</strong> et <strong>attaque</strong>, qui amènent le métal calmement jusqu'à l'empreinte.</li>
    <li><strong>Noyau</strong> en sable aggloméré, cuit ou durci, posé dans l'empreinte et tenu par ses <strong>portées</strong> (prolongements logés dans le sable du moule) : il réserve les cavités intérieures.</li>
    <li><strong>Masselotte</strong> : réserve de métal liquide placée sur une zone massive, qui l'alimente pendant la solidification (§4).</li>
    <li><strong>Évents</strong> : petits conduits par où s'échappent l'air et les gaz.</li>
  </ul>

  <h3>Les étapes</h3>
  <ol>
    <li><strong>Moulage</strong> : tasser le sable autour du modèle dans chaque châssis, retirer le modèle (la dépouille le permet), poser les noyaux, refermer.</li>
    <li><strong>Coulée</strong> : le métal remplit l'empreinte par gravité (fonte vers 1 350 à 1 450 °C, acier vers 1 550 à 1 650 °C, alliages d'aluminium vers 700 à 750 °C).</li>
    <li><strong>Solidification et refroidissement</strong> : la masselotte alimente les zones encore liquides.</li>
    <li><strong>Décochage</strong> : on casse le moule ; le sable est en grande partie recyclé.</li>
    <li><strong>Parachèvement</strong> : couper le système de coulée et les masselottes, ébarber le plan de joint, grenailler, puis usiner les surfaces fonctionnelles.</li>
  </ol>
  <div class="method-box"><strong>Exemple — rendement de coulée</strong>
    <p>Un corps de pompe en fonte pèse 12 kg ; le système de remplissage et les masselottes pèsent ensemble 7 kg.</p>
    <ol>
      <li>Masse de métal à fondre pour une pièce : \(12 + 7 = 19\) kg.</li>
      <li>Rendement de coulée : \(12/19 \approx 63\,\%\). Les 7 kg coupés au parachèvement sont refondus, mais l'énergie de fusion est dépensée deux fois.</li>
      <li>Un rendement de 50 à 80 % est courant en sable : on cherche à le relever (masselottes bien placées, système de remplissage compact) pour des raisons de coût et d'énergie.</li>
    </ol>
  </div>

  <h3>Domaine d'application</h3>
  <p><strong>Atouts</strong> : tous les métaux coulables, même à haut point de fusion (fontes, aciers) ; pièces de quelques centaines de grammes à plusieurs dizaines de tonnes ; formes complexes et creuses ; modèle bon marché, donc pièce unique, prototype, petite et moyenne série (bâtis de machines, carters, corps de vannes et de pompes, blocs moteurs). <strong>Limites</strong> : précision médiocre (qualité IT 13 à 16) et surface rugueuse (\(R_a\) de 12,5 à 50 µm), d'où une <strong>surépaisseur d'usinage</strong> sur toutes les surfaces fonctionnelles ; défauts possibles (§4) ; cadence faible.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FONDERIE : MOULES PERMANENTS ET PROCÉDÉS DE PRÉCISION</div>
  <h2>Plus de pièces, plus de précision, un outillage plus cher</h2>
  <div class="intro">Quand la série grandit, refaire un moule à chaque pièce devient trop lent : on passe au moule métallique permanent, rempli par gravité ou sous pression. Quand la précision et la complexité priment, on revient au moule perdu, mais en céramique fine. Chaque gain se paie en outillage ou en restrictions de matériau.</div>
  <h3>Moulage en coquille (gravité, basse pression)</h3>
  <p>La <strong>coquille</strong> est un moule en acier ou en fonte, réutilisé des dizaines de milliers de fois. Elle s'use et se dégrade d'autant plus vite que le métal coulé est chaud : elle est réservée aux alliages non ferreux (aluminium surtout, magnésium, cuivre). Le métal refroidit vite au contact du métal du moule : structure plus fine et meilleures propriétés qu'en sable, meilleure précision. En <strong>basse pression</strong>, le métal monte dans le moule par un tube, poussé par une faible surpression d'air sur le bain : remplissage calme, typique des jantes de voiture en alliage d'aluminium.</p>
  <h3>Moulage sous pression</h3>
  <p>Le métal liquide est <strong>injecté</strong> à grande vitesse dans un moule en acier fermé, puis maintenu sous une pression de plusieurs dizaines de mégapascals. Parois minces (1 à 3 mm), excellente reproduction des détails, cadences de l'ordre de la minute ou moins ; moule très coûteux, donc <strong>grande série</strong> ; alliages d'aluminium, de zinc et de magnésium (carters de boîte de vitesses, boîtiers électroniques, pièces de quincaillerie). L'air entraîné par le remplissage très rapide laisse des <strong>porosités</strong> : ces pièces se soudent et se traitent thermiquement mal.</p>
  <h3>Moulage à la cire perdue</h3>
  <p>Des modèles en cire, injectés dans un petit moule, sont assemblés en grappe, trempés dans une barbotine céramique et sablés plusieurs fois : une <strong>carapace</strong> se forme. On fond la cire (d'où le nom), on cuit la carapace, on y coule le métal puis on casse la carapace. Sans plan de joint ni dépouille, ce procédé reproduit des formes très complexes avec une grande précision, pour tous les alliages, y compris les superalliages des aubes de turbine ou les alliages de titane et de cobalt des prothèses ; il est lent et cher.</p>
  <table>
    <tr><th>Procédé</th><th>Moule</th><th>Matériaux</th><th>Série</th><th>IT · \(R_a\) (µm)</th></tr>
    <tr><td>sable</td><td>détruit à chaque pièce</td><td>tous</td><td>unitaire à moyenne</td><td>13 à 16 · 12,5 à 50</td></tr>
    <tr><td>coquille</td><td>métallique, gravité ou basse pression</td><td>Al, Mg, Cu</td><td>moyenne à grande</td><td>12 à 14 · 3,2 à 12,5</td></tr>
    <tr><td>sous pression</td><td>métallique, injection</td><td>Al, Zn, Mg</td><td>grande</td><td>11 à 13 · 1,6 à 6,3</td></tr>
    <tr><td>cire perdue</td><td>carapace céramique détruite</td><td>tous</td><td>petite à moyenne</td><td>10 à 12 · 1,6 à 3,2</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — taille d'une machine de moulage sous pression</strong>
    <p>Un carter en alliage d'aluminium présente une surface projetée de 600 cm² sur le plan de joint (pièce et canaux compris) ; le métal y est maintenu à 60 MPa.</p>
    <ol>
      <li>Le métal pousse sur chaque demi-moule avec une force \(p\,S_p = 60\cdot10^{6} \times 600\cdot10^{-4} = 3{,}6\cdot10^{6}\) N, soit 3 600 kN.</li>
      <li>La machine doit tenir le moule fermé avec une force supérieure : on choisit une machine de 4 000 kN (environ 400 tonnes-force).</li>
      <li>La même relation sert pour l'injection plastique (§6). Elle explique les « giga-presses » récentes, de plusieurs dizaines de milliers de kilonewtons, qui moulent d'un seul tenant une partie de caisse automobile.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · FONDERIE : RÈGLES DE TRACÉ ET DÉFAUTS</div>
  <h2>Dessiner une pièce qui se moule saine</h2>
  <div class="intro">Une pièce de fonderie « saine » se remplit entièrement, se solidifie sans cavité et se démoule sans abîmer le moule. Chaque règle de tracé découle d'un des trois phénomènes du §1 : on la retient mieux en sachant d'où elle vient.</div>
  <h3>Solidification : le point chaud et la masselotte</h3>
  <p>Le métal se contracte trois fois : à l'état liquide, en se solidifiant (de l'ordre de 3 à 7 % en volume selon l'alliage) et à l'état solide. La contraction à l'état solide est le retrait du §1, compensé par le modèle. La contraction de solidification, elle, doit être <strong>alimentée</strong> en métal liquide : une zone massive, qui se solidifie <strong>en dernier</strong> (le <strong>point chaud</strong>), se retrouve isolée par du métal déjà figé et se creuse d'une cavité, la <strong>retassure</strong>. Deux remèdes : supprimer le point chaud (épaisseurs régulières), ou le nourrir par une <strong>masselotte</strong> qui reste liquide plus longtemps que lui.</p>

<figcaption>Méthode des <strong>cercles inscrits</strong> : le plus grand cercle qu'on peut loger dans la section repère le <strong>point chaud</strong>, dernier à se solidifier. Diamètres calculés pour des parois d'épaisseur e : l'angle vif grossit la section de 17 %, un croisement de 41 % ; des congés à épaisseur constante (rayon extérieur = rayon intérieur + e) la ramènent à e, et deux T décalés valent mieux qu'une croix.</figcaption>
</figure>
  <p>Pour comparer les durées de solidification, on utilise le <strong>module de refroidissement</strong> \(M = V/S\), rapport du volume d'une zone à la surface par laquelle elle cède sa chaleur au moule (les faces en contact avec le reste de la pièce ne comptent pas). La durée de solidification croît comme \(M^2\) ; on retient la règle pratique (empirique, non exigible) :</p>
  <div class="formula" data-nom="Module d'une masselotte">$$M_{\text{masselotte}} \geq 1{,}2\, M_{\text{zone alimentée}}$$</div>
  <div class="method-box"><strong>Exemple — dimensionner une masselotte</strong>
    <p>Un bossage cubique de 60 mm d'arête est relié au reste de la pièce par une face. On le nourrit par une masselotte cylindrique posée dessus, de hauteur égale à son diamètre \(D\).</p>
    <ol>
      <li>Module du bossage : il refroidit par 5 faces, \(M_b = \dfrac{60^3}{5 \times 60^2} = 12\) mm.</li>
      <li>Module de la masselotte (sa base, posée sur le bossage, ne refroidit pas) : \(M_m = \dfrac{\pi D^2 D/4}{\pi D \cdot D + \pi D^2/4} = \dfrac{D}{5}\).</li>
      <li>Condition : \(D/5 \geq 1{,}2 \times 12\), soit \(D \geq 72\) mm. La masselotte se solidifie alors environ \(1{,}2^2 \approx 1{,}44\) fois plus lentement que le bossage.</li>
      <li>Elle contient 293 cm³ de métal pour un bossage de 216 cm³ : c'est le prix d'une pièce saine, et la raison des rendements de coulée du §2.</li>
    </ol>
  </div>

  <h3>Les règles de tracé</h3>
  <ul>
    <li><strong>Épaisseurs régulières</strong> et variations progressives ; une surépaisseur inévitable est placée sous une masselotte ou évidée.</li>
    <li><strong>Congés</strong> à tous les raccordements, avec rayon extérieur = rayon intérieur + épaisseur : l'angle vif crée un point chaud côté intérieur, des concentrations de contraintes et des <strong>criques</strong> (fissures à chaud).</li>
    <li><strong>Pas de croisement de parois</strong> : deux T décalés plutôt qu'une croix (figure ci-dessus).</li>
    <li><strong>Dépouille</strong> de 1 à 3° sur les faces parallèles au démoulage ; plus forte sur les faces intérieures, que le métal serre en se contractant.</li>
    <li><strong>Plan de joint</strong> plan si possible, passant par la plus grande section, choisi pour éviter les contre-dépouilles ; les surfaces qui doivent rester coaxiales se moulent du même côté du joint (un décalage des châssis ne les sépare pas).</li>
    <li><strong>Surépaisseur d'usinage</strong> (quelques millimètres en sable) sur les surfaces fonctionnelles, et <strong>noyaux</strong> pour les grands alésages, ce qui économise matière et usinage.</li>
  </ul>

  <div class="method-box"><strong>Exemple — ce que coûte une dépouille</strong>
    <p>Une paroi de 80 mm de haut, parallèle au démoulage, reçoit 2° de dépouille.</p>
    <ol>
      <li>La face s'écarte de la verticale de \(80 \tan 2° \approx 2{,}8\) mm entre ses deux extrémités.</li>
      <li>Si la face doit être cylindrique ou perpendiculaire à une autre après usinage, il faut prévoir au moins ces 2,8 mm de matière en plus, en plus de la surépaisseur d'usinage. Une surface fonctionnelle parallèle au démoulage est donc presque toujours reprise en usinage.</li>

  </div>

<div class="course-section">
  <div class="sec-num">§5 · LES POLYMÈRES À MOULER</div>
  <h2>Thermoplastiques et thermodurcissables</h2>
  <div class="intro">Le choix du polymère conditionne le procédé, le moule et la précision de la pièce. Une distinction domine : un thermoplastique se refond, un thermodurcissable non. Elle décide de la façon de mouler, de recycler et d'assembler.</div>
  <div class="def-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Thermoplastique</strong> : longues chaînes non reliées entre elles ; il se ramollit et fond à la chaleur, se fige au refroidissement, et peut être refondu (injection, extrusion, recyclage, soudage).</li>
      <li><strong>Thermodurcissable</strong> : résine liquide qui <strong>réticule</strong> (réaction chimique irréversible, à chaud ou avec un durcisseur) en un réseau tridimensionnel ; il ne refond plus. C'est la matrice de la plupart des composites (§9).</li>
      <li><strong>Élastomère</strong> : réseau faiblement réticulé, très déformable de façon réversible (joints, pneus, silicones).</li>
    </ul>
  </div>
  <h3>Amorphes et semi-cristallins</h3>
  <p>Parmi les thermoplastiques, les <strong>amorphes</strong> (ABS, polycarbonate PC, polystyrène PS, PMMA) ont des chaînes en désordre : ils peuvent être transparents et se contractent peu (retrait de 0,4 à 0,8 %). Les <strong>semi-cristallins</strong> (polypropylène PP, polyéthylène PE, polyamides PA, polyoxyméthylène POM) s'organisent en partie en cristaux en se solidifiant : meilleure tenue chimique et au frottement, mais retrait plus fort (1 à 2,5 %) et plus sensible aux conditions de moulage.</p>
  <table>
    <tr><th>Polymère</th><th>Famille</th><th>Matière injectée (°C)</th><th>Moule (°C)</th><th>Emplois</th></tr>
    <tr><td>PP</td><td>semi-cristallin</td><td>200 à 280</td><td>20 à 60</td><td>emballages, bacs, pièces d'habitacle, charnières intégrées</td></tr>
    <tr><td>ABS</td><td>amorphe</td><td>220 à 260</td><td>40 à 80</td><td>boîtiers, coques, pièces d'aspect</td></tr>
    <tr><td>PA6 (polyamide)</td><td>semi-cristallin</td><td>240 à 280</td><td>60 à 90</td><td>engrenages, clips, pièces techniques (souvent chargé de fibres de verre)</td></tr>
    <tr><td>PC</td><td>amorphe</td><td>280 à 320</td><td>80 à 110</td><td>pièces transparentes résistantes aux chocs</td></tr>
  </table>
  <h3>Charges et additifs</h3>
  <p>On ajoute au polymère des <strong>charges et additifs</strong> : fibres de verre courtes (un « PA6 GF30 » contient 30 % en masse de fibres : il est environ trois fois plus rigide, c'est déjà un composite à fibres courtes), talc, colorants, stabilisants contre les ultraviolets, ignifugeants. Les fibres s'orientent dans le sens de l'écoulement : la pièce devient plus rigide dans ce sens, et son retrait devient <strong>anisotrope</strong> (plus faible le long des fibres), source de gauchissement.</p>
  <div class="method-box"><strong>Exemple — c'est la dispersion du retrait qui limite la précision</strong>
    <p>Une cote de 100 mm doit être tenue à ±0,15 mm. Le retrait du PP vaut \(1{,}5 \pm 0{,}3\,\%\) selon les lots et les réglages ; celui de l'ABS \(0{,}5 \pm 0{,}1\,\%\).</p>
    <ol>
      <li>La valeur moyenne se compense dans l'empreinte : 101,5 mm pour le PP, 100,5 mm pour l'ABS.</li>
      <li>La dispersion, elle, se retrouve sur la pièce : ±0,3 mm avec le PP, ±0,1 mm avec l'ABS.</li>
      <li>Seul l'ABS tient la tolérance. Pour une pièce précise, on préfère un polymère amorphe, ou on ouvre la tolérance.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : parler de « plastique » sans préciser. Un thermodurcissable ne s'injecte pas comme un thermoplastique (il réticule dans un moule chaud au lieu de se figer dans un moule froid), ne se recycle pas par refusion et ne se soude pas.</div>
</div>

  <h3>L'unité d'injection</h3>
  <p>Les granulés tombent de la <strong>trémie</strong> dans le <strong>fourreau</strong>, cylindre chauffé par des colliers. La <strong>vis</strong> qui y tourne les entraîne, les fond (chaleur des colliers et frottement de cisaillement) et les homogénéise ; en tournant, elle recule et accumule devant elle la <strong>dose</strong> de matière fondue. Puis elle avance d'un coup, comme un piston (un clapet empêche le reflux), et pousse la dose par la <strong>buse</strong> dans le moule.</p>
  <h3>Le moule</h3>
  <ul>
    <li>Deux parties : le <strong>demi-moule fixe</strong>, côté injection, et le <strong>demi-moule mobile</strong>, qui porte le système d'éjection ; elles se touchent suivant le plan de joint.</li>
    <li>Le chemin de la matière : <strong>carotte</strong>, <strong>canaux</strong> d'alimentation, <strong>seuils</strong> (rétrécissements à l'entrée de chaque empreinte, qui se figent en premier et se détachent facilement). Avec des <strong>canaux chauds</strong>, la matière des canaux reste fondue : pas de carotte à recycler.</li>
    <li>Des circuits d'eau ou d'huile <strong>régulent la température</strong> du moule ; des <strong>évents</strong> de quelques centièmes de millimètre laissent sortir l'air sans laisser passer la matière.</li>
    <li>À l'ouverture, les <strong>éjecteurs</strong> (tiges) poussent la pièce ; ils laissent des marques rondes, qu'on place sur une face cachée.</li>
    <li>Les contre-dépouilles exigent des <strong>tiroirs</strong> (coulisseaux mus à l'ouverture) ou des noyaux mobiles, qui renchérissent fortement le moule ; un clip souple peut parfois être démoulé « en force ».</li>
  </ul>
  <h3>La force de fermeture</h3>
  <p>Pendant l'injection et le maintien, la matière pousse sur le moule avec une pression \(p_e\) de quelques dizaines de mégapascals. Cette pression s'exerce sur la <strong>surface projetée</strong> \(S_p\) des empreintes et des canaux sur le plan de joint : l'unité de fermeture doit au moins équilibrer \(p_e S_p\), sinon le moule s'entrouvre et la pièce sort avec des bavures.</p>
  <div class="formula" data-nom="Force de fermeture">$$F_f \;\geq\; p_e\,S_p$$</div>
  <div class="method-box"><strong>Exemple — choisir une presse</strong>
    <p>Un moule à deux empreintes produit des couvercles de 120 × 80 mm (boîte ouverte de 20 mm de haut, paroi de 2 mm, en PP) ; les canaux ajoutent 12 cm² de surface projetée ; on compte \(p_e = 40\) MPa.</p>
    <ol>
      <li>Surface projetée : \(S_p = 2 \times 12 \times 8 + 12 = 204\ \text{cm}^2\). La hauteur de la boîte n'intervient pas : seule compte la projection sur le plan de joint.</li>
      <li>\(F_f \geq 40\cdot10^{6} \times 204\cdot10^{-4} \approx 816\) kN. On choisit une presse de 1 000 kN, soit 23 % de marge.</li>
      <li>Volume d'un couvercle : \(120 \times 80 \times 20 - 116 \times 76 \times 18 = 33\,312\ \text{mm}^3\), soit 30 g de PP (masse volumique 0,90 g/cm³) et environ 5 centimes de matière : en grande série, le coût d'une pièce injectée tient surtout au moule et au temps de cycle.</li>
    </ol>
  </div>
  <p>Ordres de grandeur : presses de quelques centaines à plusieurs dizaines de milliers de kilonewtons ; moule de quelques dizaines à plusieurs centaines de milliers d'euros, durée de vie de \(10^5\) à \(10^6\) cycles ; précision IT 9 à 12, sans reprise d'usinage.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LE CYCLE D'INJECTION</div>
  <h2>Quelques secondes, dominées par le refroidissement</h2>
  <div class="intro">Le cycle d'injection enchaîne cinq phases, de quelques secondes à environ une minute. Savoir laquelle domine dit tout de suite comment raccourcir le cycle, donc baisser le coût : il faut presque toujours réduire l'épaisseur.</div>
  <ol>
    <li><strong>Fermeture</strong> et verrouillage du moule.</li>
    <li><strong>Injection</strong> (remplissage) : la vis avance vite ; l'empreinte se remplit en une fraction de seconde à quelques secondes.</li>
    <li><strong>Maintien en pression</strong> : la vis continue de pousser pour faire entrer la matière qui compense le retrait, jusqu'au <strong>figeage du seuil</strong>. Un maintien trop court laisse des retassures.</li>
    <li><strong>Refroidissement</strong> : la pièce se fige jusqu'à pouvoir être éjectée sans se déformer ; pendant ce temps, la vis recule en dosant la matière du cycle suivant.</li>
    <li><strong>Ouverture, éjection</strong>, puis nouveau cycle.</li>
  </ol>

  <h3>Le temps de refroidissement</h3>
  <p>La chaleur sort de la paroi par diffusion vers les deux faces du moule. Le temps nécessaire croît comme le <strong>carré de l'épaisseur</strong> \(e\) et décroît avec la diffusivité thermique \(a\) du polymère (de l'ordre de \(10^{-7}\ \text{m}^2/\text{s}\), cent fois moins que celle de l'acier) :</p>
  <div class="formula" data-nom="Temps de refroidissement (loi d'échelle)">$$t_r \;\propto\; \frac{e^2}{a}$$</div>
  <p>Doubler l'épaisseur multiplie le temps de refroidissement par 4. Pour un ordre de grandeur, on admet la relation suivante (plaque entre deux faces de moule à \(T_m\), matière injectée à \(T_i\), éjectable quand son cœur atteint \(T_{\text{éj}}\) ; non exigible, justifiée en fin de chapitre) :</p>
  <div class="formula">$$t_r \approx \frac{e^2}{\pi^2 a}\,\ln\!\left(\frac{4}{\pi}\,\frac{T_i - T_m}{T_{\text{éj}} - T_m}\right)$$</div>
  <div class="method-box"><strong>Exemple — temps de cycle et cadence</strong>
    <p>Couvercles en PP du §6 : \(e = 2\) mm, \(a = 10^{-7}\ \text{m}^2/\text{s}\), \(T_i = 230\) °C, \(T_m = 40\) °C, \(T_{\text{éj}} = 90\) °C ; fermeture 1 s, injection 1 s, ouverture et éjection 2 s.</p>
    <ol>
      <li>Temps de refroidissement (le maintien en pression est inclus dans cette durée) :
        <div class="formula">$$t_r \approx \frac{(2\cdot10^{-3})^2}{\pi^2 \times 10^{-7}}\,\ln\!\left(\frac{4}{\pi}\times\frac{190}{50}\right) \approx 4{,}05 \times 1{,}58 \approx 6{,}4\ \text{s}$$</div></li>
      <li>Cycle : \(1 + 1 + 6{,}4 + 2 \approx 10{,}4\) s ; avec deux empreintes, environ 690 couvercles par heure ; 200 000 couvercles demandent moins de 300 heures de presse.</li>
      <li>Avec une paroi de 3 mm, \(t_r\) passe à \(6{,}4 \times (3/2)^2 \approx 14{,}4\) s et le cycle à 18,4 s : 77 % de temps en plus, pour 50 % de matière en plus.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : épaissir une paroi pour rendre une pièce injectée plus rigide. Le cycle s'allonge comme \(e^2\), la matière augmente, des retassures et des déformations apparaissent. On garde une paroi mince et on la raidit par des <strong>nervures</strong> (§8) ou par la forme (bords tombés, ondulations).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · RÈGLES DE CONCEPTION D'UNE PIÈCE INJECTÉE</div>
  <h2>Dessiner pour le moule</h2>
  <div class="intro">Une pièce injectée se conçoit avec son moule : chaque règle de tracé vise à remplir sans difficulté, à refroidir uniformément et à démouler sans tiroir. Respecter ces règles coûte peu sur le dessin ; les ignorer coûte un moule plus cher, un cycle plus long ou des pièces rebutées.</div>

  <h3>Les règles</h3>
  <ul>
    <li><strong>Épaisseur faible et constante</strong> (1 à 4 mm selon la taille et la matière) ; si elle doit varier, transition progressive. Une surépaisseur refroidit en dernier : retassure en surface, vide à cœur, déformation.</li>
    <li><strong>Nervures</strong> pour la rigidité : épaisseur 0,5 à 0,7 fois celle de la paroi, hauteur au plus 3 fois l'épaisseur de la paroi, espacement d'au moins 2 épaisseurs, congé de pied d'environ 0,25 à 0,5 fois l'épaisseur, dépouille. Plutôt plusieurs nervures basses qu'une haute.</li>
    <li><strong>Congés partout</strong> : rayon intérieur d'au moins la moitié de l'épaisseur, rayon extérieur = rayon intérieur + épaisseur (épaisseur constante dans l'angle) ; la matière s'écoule mieux et les contraintes se concentrent moins.</li>
    <li><strong>Dépouilles</strong> de 0,5° à 2° sur toutes les faces parallèles à l'ouverture, davantage sur une face texturée (grain) ou très haute.</li>
    <li><strong>Bossages</strong> (fûts de vissage) creux, de paroi mince, reliés à la paroi ou aux bords par des nervures plutôt que massifs.</li>
    <li><strong>Pas de contre-dépouille</strong> si on peut l'éviter : une ouverture latérale, un clip ou un filetage extérieur imposent un tiroir ou un noyau mobile.</li>
    <li><strong>Plan de joint</strong> sur une arête peu visible, de préférence plane ; le placer de sorte que la pièce reste sur le demi-moule mobile (celui des éjecteurs).</li>
    <li><strong>Point d'injection</strong> (seuil) dans la partie la plus épaisse, pour que la matière aille de l'épais vers le mince ; loin des zones sollicitées, car deux fronts de matière qui se rejoignent forment une <strong>ligne de soudure</strong>, visible et plus fragile.</li>
    <li><strong>Tolérances</strong> réalistes : IT 9 à 12 ; une cote qui traverse le plan de joint est moins précise qu'une cote moulée d'un seul côté.</li>
  </ul>
  <div class="method-box"><strong>Exemple — dimensionner une nervure</strong>
    <p>Un capot en ABS a une paroi de \(e = 2{,}5\) mm. On veut le raidir par des nervures.</p>
    <ol>
      <li>Épaisseur de nervure : \(0{,}5e\) à \(0{,}7e\), soit 1,25 à 1,75 mm ; on prend 1,5 mm à la base.</li>
      <li>Hauteur au plus \(3e = 7{,}5\) mm ; congé de pied entre 0,6 et 1,25 mm ; espacement d'au moins 5 mm.</li>
      <li>Avec 0,5° de dépouille sur chaque face, l'épaisseur en tête vaut \(1{,}5 - 2 \times 7{,}5 \tan 0{,}5° \approx 1{,}37\) mm : encore assez pour se remplir.</li>
      <li>Angles du capot : rayon intérieur de 1,25 à 2,5 mm, rayon extérieur de 3,75 à 5 mm.</li>
    </ol>
  </div>
  <h3>Défauts et causes</h3>
  <table>
    <tr><th>Défaut</th><th>Ce qu'on voit</th><th>Cause principale</th></tr>
    <tr><td>retassure</td><td>creux en surface, face à une surépaisseur</td><td>paroi ou nervure trop épaisse, maintien insuffisant</td></tr>
    <tr><td>gauchissement</td><td>pièce voilée, déformée</td><td>retraits différents (épaisseurs, refroidissement inégal, fibres orientées)</td></tr>
    <tr><td>ligne de soudure</td><td>trait fin, zone fragile</td><td>deux fronts de matière qui se rejoignent (autour d'un trou, de deux seuils)</td></tr>
    <tr><td>incomplet</td><td>pièce non remplie</td><td>paroi trop mince ou trop longue, matière ou moule trop froids</td></tr>
    <tr><td>bavure</td><td>pellicule au plan de joint</td><td>force de fermeture insuffisante, moule usé</td></tr>
    <tr><td>brûlure, bulle</td><td>tache noire, vide</td><td>air piégé et comprimé (évents), matière humide</td></tr>
  </table>
  <div class="notice"><strong>Erreur classique</strong> : soigner l'aspect d'une face puis y placer le seuil, les éjecteurs ou une nervure épaisse au dos. Chacun laisse une trace sur la face opposée (point d'injection, marques rondes, retassure) : on les met sur les faces cachées.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · LES MATÉRIAUX COMPOSITES</div>
  <h2>Des fibres pour porter, une matrice pour lier</h2>
  <div class="intro">Un composite associe des matériaux non miscibles aux rôles complémentaires : des <strong>fibres</strong> très rigides et résistantes portent les efforts, une <strong>matrice</strong> les lie, leur transmet les charges et les protège. On obtient des pièces très légères pour leur rigidité, mais dont les propriétés dépendent de la direction : le procédé et le dessin doivent placer les fibres là où passent les efforts.</div>
  <h3>Matrices et renforts</h3>
  <ul>
    <li><strong>Matrice thermodurcissable</strong> (polyester, vinylester, époxyde) : imprègne bien les fibres car liquide avant réticulation ; la plus courante. <strong>Thermoplastique</strong> (PP, PA, PEEK) : recyclable, soudable, cycles plus courts, mais visqueuse, donc difficile à faire pénétrer entre les fibres.</li>
    <li><strong>Fibres de verre</strong> : bon marché, \(E_f \approx 72\) GPa, \(\rho_f \approx 2\,540\ \text{kg/m}^3\) ; <strong>de carbone</strong> : très rigides et légères, chères, \(E_f \approx 230\) GPa, \(\rho_f \approx 1\,780\ \text{kg/m}^3\) ; <strong>d'aramide</strong> : très bonne tenue aux chocs, \(E_f \approx 125\) GPa, \(\rho_f \approx 1\,440\ \text{kg/m}^3\), mais faibles en compression. Une matrice époxyde : \(E_m \approx 3{,}5\) GPa, \(\rho_m \approx 1\,200\ \text{kg/m}^3\).</li>
    <li><strong>Formes du renfort</strong> : fibres courtes (mélangées à un thermoplastique injecté), <strong>mat</strong> (fibres coupées, en vrac), <strong>tissu</strong> (fibres tissées à 0° et 90°), <strong>nappe unidirectionnelle</strong> (UD), <strong>préimprégné</strong> (renfort déjà enduit de résine non réticulée, stocké au froid).</li>
  </ul>
  <h3>La loi des mélanges</h3>
  <p>Notons \(V_f\) la <strong>fraction volumique de fibres</strong>. Dans le sens de fibres continues et alignées, fibres et matrice s'allongent ensemble : leurs rigidités s'ajoutent en proportion de leurs volumes. Il en va de même de la masse volumique :</p>
  <div class="formula" data-nom="Loi des mélanges (sens des fibres)">$$E_{\parallel} \approx V_f\,E_f + (1-V_f)\,E_m \qquad \rho_c = V_f\,\rho_f + (1-V_f)\,\rho_m$$</div>
  <p>Perpendiculairement aux fibres, l'effort traverse la matrice, souple : la rigidité \(E_\perp\) n'est que de quelques fois celle de la matrice, et la résistance est faible. Un pli unidirectionnel est donc très <strong>anisotrope</strong> : on empile des plis d'orientations différentes, c'est la <strong>stratification</strong>.</p>

  <div class="method-box"><strong>Exemple — pourquoi le carbone allège</strong>
    <p>Pli unidirectionnel carbone/époxyde à \(V_f = 0{,}6\).</p>
    <ol>
      <li>\(E_\parallel \approx 0{,}6 \times 230 + 0{,}4 \times 3{,}5 \approx 139\) GPa et \(\rho_c \approx 0{,}6 \times 1\,780 + 0{,}4 \times 1\,200 \approx 1\,550\ \text{kg/m}^3\).</li>
      <li>Module spécifique \(E/\rho\) : 90 MJ/kg dans le sens des fibres, contre 27 MJ/kg pour l'acier et 26 MJ/kg pour un alliage d'aluminium.</li>
      <li>En pratique, un panneau doit être rigide dans toutes les directions : un stratifié « quasi isotrope » de ce matériau n'a plus qu'environ 50 GPa (valeur donnée). À rigidité de flexion égale (\(E e^3\) identique), il remplace une tôle d'acier de 2 mm par \(2 \times (210/50)^{1/3} \approx 3{,}2\) mm de composite : 5,0 kg/m² au lieu de 15,7 kg/m² (et 7,8 kg/m² pour l'aluminium), soit le tiers de la masse de l'acier.</li>
    </ol>
  </div>
  <p>Domaines d'application : aéronautique (plus de la moitié de la masse de structure de certains avions de ligne récents) et spatial, pales d'éoliennes (verre ou carbone et époxyde), sport et loisirs (cadres de vélo, raquettes, bateaux), automobile (pièces de carrosserie en grande série en verre et polyester, carbone pour le haut de gamme), réservoirs sous pression. Les <strong>structures sandwich</strong> (deux peaux composites collées sur une âme légère) poussent plus loin la rigidité pour une masse donnée : voir <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>.</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la loi des mélanges dans toutes les directions, ou à des fibres courtes et dispersées. Elle ne vaut que dans le sens de fibres continues ; un mat ou des fibres courtes donnent une rigidité bien plus faible, à peu près la même dans toutes les directions du plan.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · MISE EN FORME DES COMPOSITES</div>
  <h2>Imprégner, compacter, durcir</h2>
  <div class="intro">Mettre en forme un composite, c'est en même temps fabriquer le matériau et la pièce : il faut placer les fibres, les imprégner de résine sans bulles, les compacter pour obtenir assez de fibres, puis faire réticuler la résine. Les procédés se distinguent par la façon de faire ces trois choses, ce qui fixe la qualité, la série et le prix.</div>

    <tr><td>projection simultanée</td><td>fibres coupées et résine projetées ensemble sur le moule</td><td>20 à 30 %</td><td>petite, moyenne</td><td>grandes coques simples</td></tr>
    <tr><td>infusion sous vide</td><td>renforts secs sous bâche ; le vide les compacte et aspire la résine</td><td>50 à 60 %</td><td>petite, moyenne</td><td>pales d'éolienne, coques</td></tr>
    <tr><td>RTM (moulage par transfert de résine)</td><td>renforts secs dans un moule fermé rigide, résine injectée</td><td>40 à 55 %</td><td>moyenne</td><td>pièces de structure, deux faces lisses</td></tr>
    <tr><td>préimprégnés et autoclave</td><td>plis préimprégnés drapés, cuits sous pression et température</td><td>≈ 60 %</td><td>petite</td><td>aéronautique, compétition ; le plus performant</td></tr>
    <tr><td>enroulement filamentaire</td><td>fibres imprégnées enroulées sur un mandrin en rotation</td><td>≈ 60 %</td><td>moyenne, grande</td><td>tubes, réservoirs sous pression</td></tr>
    <tr><td>pultrusion</td><td>fibres tirées à travers un bain de résine puis une filière chauffée</td><td>≈ 60 %</td><td>grande, en continu</td><td>profilés de section constante</td></tr>
    <tr><td>compression de SMC</td><td>feuilles de résine chargée de fibres coupées, pressées dans un moule chaud</td><td>≈ 20 %</td><td>grande</td><td>pièces de carrosserie, capots</td></tr>
  </table>
  <p>Le <strong>drapage</strong> consiste à découper les plis et à les poser un à un dans le moule, à la main ou par robot, dans l'ordre et l'orientation prévus. La <strong>cuisson</strong> (réticulation) dure de quelques minutes (SMC, RTM rapide) à plusieurs heures (autoclave) : c'est ce qui limite les cadences, bien en dessous de celles de l'injection des thermoplastiques. Les composites à matrice thermoplastique se mettent en forme plus vite, par chauffage et estampage de plaques déjà imprégnées.</p>
  <div class="method-box"><strong>Exemple — combien de plis et de résine ?</strong>
    <p>Une plaque RTM de 600 × 400 × 3 mm en verre et époxyde doit avoir \(V_f \approx 0{,}5\) ; on dispose d'un tissu de verre de 500 g/m² (\(\rho_f = 2{,}54\ \text{g/cm}^3\), \(\rho_m = 1{,}2\ \text{g/cm}^3\)).</p>
    <ol>
      <li>Volume de la plaque : \(60 \times 40 \times 0{,}3 = 720\ \text{cm}^3\) ; fibres visées : \(0{,}5 \times 720 \times 2{,}54 \approx 914\) g.</li>
      <li>Un pli pèse \(0{,}24\ \text{m}^2 \times 500\ \text{g/m}^2 = 120\) g : il faut \(914/120 \approx 7{,}6\), donc 8 plis.</li>
      <li>Avec 8 plis : 960 g de fibres, soit 378 cm³ et \(V_f \approx 0{,}525\) ; la résine remplit les 342 cm³ restants, soit 410 g. Plaque de 1,37 kg, de masse volumique 1,90 g/cm³.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'on peut atteindre n'importe quel taux de fibres. Le taux dépend du procédé (compactage) : 30 % au contact, 60 % en autoclave. Un calcul de rigidité fait avec \(V_f = 0{,}6\) est faux pour une pièce moulée au contact.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · RÈGLES DE CONCEPTION DES PIÈCES COMPOSITES</div>
  <h2>Mettre les fibres là où passent les efforts</h2>
  <div class="intro">On ne dessine pas une pièce composite comme une pièce métallique « en noir » : le matériau se construit en même temps que la forme. Les règles visent à orienter les fibres selon les efforts, à éviter les défauts propres aux stratifiés (gauchissement, délaminage) et à limiter les assemblages.</div>
  <ul>
    <li><strong>Orienter les plis selon les efforts</strong> : plis à 0° dans le sens de la traction ou de la flexion principale, à ±45° pour le cisaillement et la torsion, à 90° pour les efforts transversaux ; garder au moins 10 % de plis dans chaque direction pour encaisser les efforts imprévus.</li>
    <li><strong>Empilement symétrique et équilibré</strong> par rapport au plan moyen (figure du §9) : sinon la pièce se gauchit en refroidissant après la cuisson.</li>
    <li><strong>Variations d'épaisseur progressives</strong> : on arrête les plis un à un, en décalant leurs bords (pente de l'ordre de 1/20), jamais d'un coup.</li>
    <li><strong>Rayons généreux</strong>, jamais d'angle vif : les fibres ne suivent pas un angle vif, la résine s'y accumule ou y manque.</li>
    <li><strong>Peu de perçages</strong> : un trou coupe les fibres et amorce un <strong>délaminage</strong> (décollement des plis) ; on préfère le collage, des inserts posés au drapage, et sinon des trous loin des bords (de l'ordre de 3 diamètres).</li>
    <li><strong>Éviter les efforts hors du plan</strong> (arrachement, chocs localisés) : c'est entre les plis que le stratifié est le plus faible.</li>
    <li><strong>Face d'aspect côté moule</strong> (une seule au contact ou en infusion, deux en RTM) ; <strong>dépouille</strong> dans les moules fermés.</li>
    <li><strong>Intégrer les fonctions</strong> : une seule pièce composite remplace souvent plusieurs pièces métalliques assemblées, ce qui compense une partie de son prix.</li>
  </ul>
  <div class="method-box"><strong>Exemple — l'angle d'enroulement d'un réservoir</strong>
    <p>Dans la paroi mince d'un réservoir cylindrique sous pression, la contrainte circonférentielle \(\sigma_\theta\) vaut le double de la contrainte axiale \(\sigma_z\). On l'enroule de fibres croisées à \(\pm\alpha\) de l'axe, en supposant (calcul simplifié, au-delà du programme) que seules les fibres portent l'effort, dans leur direction.</p>
    <ol>
      <li>Une fibre tendue à \(\sigma_f\) suivant la direction \(\alpha\) apporte une contrainte \(\sigma_f\cos^2\alpha\) dans l'axe et \(\sigma_f\sin^2\alpha\) dans le sens circonférentiel.</li>
      <li>Pour que les fibres soient également chargées partout : \(\dfrac{\sigma_\theta}{\sigma_z} = \tan^2\alpha = 2\), soit \(\alpha = \arctan\sqrt 2 \approx 54{,}7°\).</li>
      <li>C'est l'angle d'enroulement « naturel » des tubes et réservoirs bobinés : orienter les fibres d'après les efforts, c'est exactement la règle de conception ci-dessus.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : reprendre le dessin d'une pièce métallique en remplaçant seulement le matériau. Angles vifs, perçages nombreux et épaisseurs brusques ruinent le composite ; on redessine la pièce pour le procédé et pour les fibres.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · CHOISIR UN PROCÉDÉ DE MOULAGE</div>
  <h2>Matériau, forme, série, précision : le compromis</h2>
  <div class="intro">Pour une pièce donnée, plusieurs procédés sont souvent possibles. On les départage d'abord par le matériau (qui en élimine beaucoup), puis par la géométrie et la taille, enfin par la taille de série, qui décide de l'amortissement de l'outillage. Le choix final se justifie par un coût et par un argument environnemental.</div>
  <table>
    <tr><th>Procédé</th><th>Matériaux</th><th>Formes et tailles</th><th>Série</th><th>Outillage</th></tr>
    <tr><td>fonderie en sable</td><td>tous les métaux coulables</td><td>massives, creuses, jusqu'à plusieurs tonnes</td><td>unitaire à moyenne</td><td>modèle peu coûteux</td></tr>
    <tr><td>fonderie sous pression</td><td>Al, Zn, Mg</td><td>parois minces, de quelques grammes à quelques dizaines de kg</td><td>grande</td><td>moule acier très coûteux</td></tr>
    <tr><td>cire perdue</td><td>tous, y compris superalliages</td><td>petites, très complexes, précises</td><td>petite à moyenne</td><td>moule à cire, carapace par pièce</td></tr>
    <tr><td>injection thermoplastique</td><td>thermoplastiques, chargés ou non</td><td>parois minces, complexes, de quelques grammes à quelques kg</td><td>grande (au-delà de \(10^4\))</td><td>moule acier coûteux</td></tr>
    <tr><td>composites, moule ouvert</td><td>verre ou carbone, résine thermodurcissable</td><td>grandes coques</td><td>unitaire, petite</td><td>moule peu coûteux</td></tr>
    <tr><td>composites, RTM ou SMC</td><td>verre ou carbone, résine thermodurcissable</td><td>pièces de structure, panneaux</td><td>moyenne à grande</td><td>moule fermé coûteux</td></tr>
  </table>
  <p>Le coût unitaire sépare un coût fixe \(C_o\) (modèle, moule, réglages), réparti sur les \(N\) pièces, et un coût variable \(C_v\) par pièce (matière, temps machine, énergie, main-d'œuvre) ; deux procédés ont le même coût au seuil \(N^*\) :</p>
  <div class="formula" data-nom="Coût unitaire et seuil de rentabilité">$$C_u(N) = C_v + \frac{C_o}{N} \qquad N^* = \frac{C_{o2} - C_{o1}}{C_{v1} - C_{v2}}$$</div>

<figcaption>Coût unitaire \( C_u = C_v + C_o/N \) d'un carter en alliage d'aluminium : moulage en sable (\( C_o = 3\,000 \) €, \( C_v = 45 \) €) et sous pression (\( C_o = 80\,000 \) €, \( C_v = 12 \) €). L'outillage coûteux ne se rentabilise qu'au-delà du seuil \( N^* \approx 2\,330 \) pièces.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — sable ou sous pression ?</strong>
    <p>Un carter en alliage d'aluminium : en sable, \(C_{o1} = 3\,000\) € et \(C_{v1} = 45\) € (usinage de reprise compris) ; sous pression, \(C_{o2} = 80\,000\) € et \(C_{v2} = 12\) €.</p>
    <ol>
      <li>\(N^* = \dfrac{80\,000 - 3\,000}{45 - 12} \approx 2\,330\) pièces.</li>
      <li>Pour 500 pièces : 51 € en sable contre 172 € sous pression ; pour 10 000 pièces : 45,3 € contre 20 €.</li>
      <li>Au-delà du coût, vérifier que la pièce sous pression convient : paroi mince possible, mais porosités qui interdisent de la souder ou de la traiter thermiquement.</li>
    </ol>
  </div>
  <p><strong>Impact environnemental</strong> : la fonderie consomme beaucoup d'énergie pour fondre le métal (et la refondre pour les jets et masselottes), mais donne un brut proche de la forme finale, donc peu de copeaux ; les thermoplastiques se recyclent par broyage et refusion (avec une perte de propriétés) ; les composites thermodurcissables se recyclent mal. Les procédés additifs complètent ce tableau pour les petites séries et les formes impossibles à mouler : <a href="#addfab/cours">« Fabrication additive »</a>. La comparaison avec la déformation et l'usinage, et la méthode complète de choix, sont l'objet du chapitre de 2ᵉ année <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>.</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>D'où viennent les relations admises</h2>
  <div class="intro">Ces compléments justifient les relations utilisées dans le chapitre et citent d'autres procédés. Ils ne sont pas exigibles : un sujet qui s'en servirait les fournirait.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le temps de refroidissement d'une paroi injectée</span>
    <div class="content">
      <p>La paroi d'épaisseur \(e\) est assimilée à une plaque infinie dont les deux faces sont maintenues à \(T_m\) ; la température obéit à l'équation de la diffusion \(\partial T/\partial t = a\,\partial^2 T/\partial x^2\), avec \(T = T_i\) au départ. La solution est une somme de modes sinusoïdaux qui s'amortissent d'autant plus vite qu'ils sont fins ; après un court instant ne reste que le premier, et la température au cœur vaut :</p>
      <div class="formula">$$T_{\text{cœur}}(t) - T_m \approx \frac{4}{\pi}\,(T_i - T_m)\,\exp\!\left(-\frac{\pi^2 a\, t}{e^2}\right)$$</div>
      <p>En écrivant \(T_{\text{cœur}} = T_{\text{éj}}\), on obtient la relation du §7. Elle surestime un peu le temps réel (le moule n'est pas parfaitement à \(T_m\), la diffusivité varie avec la température) mais donne le bon ordre de grandeur et, surtout, la loi d'échelle en \(e^2/a\).</p>
    </div>
  </div>
  <h3>Règle de Chvorinov (fonderie)</h3>
  <p>Le temps de solidification d'une zone de fonderie suit approximativement \(t_s = C\,M^2\), où \(M = V/S\) est le module du §4 et \(C\) une constante qui dépend du métal et du moule. C'est elle qui justifie la règle \(M_{\text{masselotte}} \geq 1{,}2\,M_{\text{zone}}\) : la masselotte se solidifie environ 1,44 fois plus lentement que la zone qu'elle alimente.</p>
  <h3>Rigidité transverse d'un pli unidirectionnel</h3>
  <p>Perpendiculairement aux fibres, fibres et matrice sont chargées « en série » (même contrainte) ; une estimation simple, par défaut, est \(\dfrac{1}{E_\perp} \approx \dfrac{V_f}{E_f} + \dfrac{1 - V_f}{E_m}\). Pour du verre et de l'époxyde à \(V_f = 0{,}5\) : \(E_\perp \approx 6{,}7\) GPa contre \(E_\parallel \approx 37{,}8\) GPa, un rapport de plus de 5.</p>
  <h3>Autres procédés</h3>
  <ul>
    <li><strong>Plasturgie</strong> : extrusion (profilés, tubes, films, en continu), extrusion-soufflage (flacons, réservoirs), thermoformage (plaque chauffée puis formée : barquettes, carénages), rotomoulage (grands corps creux : cuves, kayaks).</li>
    <li><strong>Fonderie</strong> : centrifugation (tubes, chemises de cylindre), moulage à modèle perdu en polystyrène (« mousse perdue »).</li>
  </ul>
</div>
</template>

<div class="course-section">
  <div class="sec-num">MÉTHODES · MOULAGE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à lire et à critiquer une pièce moulée, injectée ou composite, à justifier un procédé et à chiffrer les ordres de grandeur qui fondent les règles de conception. Les méthodes 4 et 5 portent sur la fonderie (2ᵉ année, vue en avance) ; les autres sont exigibles dès la 1ʳᵉ année.</div>

  <div class="method-box"><strong>Méthode 1 — Choisir un procédé de moulage</strong>
    <ol>
      <li>Partir du <strong>matériau</strong> : métal coulable (fonderie), thermoplastique (injection), fibres et résine (procédés composites). Le matériau élimine déjà la plupart des procédés.</li>
      <li>Regarder la <strong>forme et la taille</strong> : parois minces et détails fins (sous pression, injection), pièces massives ou très grandes (sable, composites au contact ou en infusion), formes très complexes et petites (cire perdue).</li>
      <li>Situer la <strong>taille de série</strong> : quelques pièces (sable, contact, infusion), quelques centaines à quelques milliers (coquille, RTM), au-delà de \(10^4\) (sous pression, injection, SMC).</li>
      <li>Vérifier la <strong>précision et l'aspect</strong> exigés (IT, \(R_a\), nombre de faces lisses) et les <strong>propriétés induites</strong> (porosités du sous pression, taux de fibres d'un composite).</li>
      <li>Conclure par le <strong>coût</strong> (méthode 10) et un argument environnemental.</li>
    </ol>
    <p><em>Exemple éclair :</em> une poignée intérieure de portière en PP, 300 000 par an, se fait par injection ; un capot de moto en carbone à 50 exemplaires, par préimprégnés ou infusion ; un bâti de presse en fonte à 2 exemplaires, en sable.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Choisir le plan de joint et le sens de démoulage</strong>
    <ol>
      <li>Chercher une direction d'ouverture qui laisse <strong>chaque face visible</strong> d'un côté ou de l'autre : aucune matière ne doit se trouver « sous » une autre dans cette direction.</li>
      <li>Faire passer le plan de joint par la <strong>plus grande section</strong>, plan si possible, sur une arête peu visible.</li>
      <li>Repérer les <strong>contre-dépouilles</strong> restantes : les supprimer au dessin, sinon prévoir un noyau (fonderie) ou un tiroir (injection).</li>
      <li>Mettre du <strong>même côté</strong> du joint les surfaces qui doivent rester coaxiales ou parallèles.</li>
      <li>En injection, faire en sorte que la pièce reste sur le <strong>demi-moule mobile</strong>, qui porte les éjecteurs.</li>
    </ol>
    <p><em>Exemple éclair :</em> une poulie à gorge moulée avec un plan de joint perpendiculaire à son axe emprisonne le sable de la gorge ; avec un plan de joint contenant l'axe, la gorge se démoule, et l'alésage est réservé par un noyau horizontal tenu par deux portées.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Dimensionner une empreinte ou un modèle</strong>
    <ol>
      <li>Partir de la cote de la pièce <strong>finie</strong>.</li>
      <li>En fonderie, ajouter les <strong>surépaisseurs d'usinage</strong> sur les surfaces fonctionnelles (cote du brut).</li>
      <li>Multiplier par \(1 + r\) (retrait linéaire de la matière), pour toutes les cotes, creux et noyaux compris : \(L_{\text{empreinte}} = (1 + r)\,L\).</li>
      <li>Garder en tête la <strong>dispersion</strong> de \(r\) : c'est elle qui limite la précision, pas sa valeur moyenne.</li>
    </ol>
    <p><em>Exemple éclair :</em> une cote de 150 mm en PA6 (\(r = 1{,}2\,\%\)) demande une empreinte de 151,8 mm ; l'oublier donne une pièce trop courte de 1,8 mm. Un alésage de fonte usiné à 80 mm, avec 3 mm de surépaisseur de chaque côté et \(r = 1\,\%\), se moule sur un noyau de \(86 \times 1{,}01 \approx 86{,}9\) mm.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Appliquer une dépouille et en mesurer l'effet</strong>
    <ol>
      <li>Repérer les faces <strong>parallèles</strong> au sens de démoulage.</li>
      <li>Leur donner un angle \(\alpha\) : 1 à 3° en sable, 0,5 à 2° en injection, davantage pour une face intérieure ou texturée.</li>
      <li>Calculer l'écart entre les extrémités d'une face de hauteur \(h\) : \(h\tan\alpha\).</li>
      <li>Si la face est fonctionnelle, prévoir cet écart dans la surépaisseur et la reprendre en usinage.</li>
    </ol>
    <p><em>Exemple éclair :</em> un alésage brut de 40 mm de long, dépouillé de 1,5°, s'élargit de \(40\tan 1{,}5° \approx 1{,}05\) mm par côté, soit 2,1 mm sur le diamètre d'un bout à l'autre.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Repérer un point chaud et le nourrir (fonderie)</strong>
    <ol>
      <li>Chercher les zones <strong>massives</strong> : jonctions, croisements, bossages ; le plus grand cercle inscrit dans la section les révèle.</li>
      <li>D'abord <strong>corriger le tracé</strong> : congés à épaisseur constante, T décalés au lieu d'une croix, évidements.</li>
      <li>Sinon, calculer le <strong>module</strong> \(M = V/S\) de la zone (seules comptent les faces qui cèdent leur chaleur au moule).</li>
      <li>Placer au-dessus une <strong>masselotte</strong> de module au moins \(1{,}2\,M\) (règle pratique) ; pour un cylindre de hauteur égale à son diamètre, posé par sa base : \(M = D/5\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une plaque de 300 × 200 × 20 mm refroidit par toutes ses faces :</p>
    <div class="formula">$$M = \frac{300 \times 200 \times 20}{2\,(300 \times 200 + 300 \times 20 + 200 \times 20)} \approx 8{,}6\ \text{mm}$$</div>
    <p>Masselotte : \(D \geq 5 \times 1{,}2 \times 8{,}6 \approx 52\) mm.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Vérifier le tracé d'une pièce injectée</strong>
    <ol>
      <li><strong>Épaisseur</strong> : constante, entre 1 et 4 mm ; repérer toute surépaisseur (base des nervures, bossages pleins, angles vifs).</li>
      <li><strong>Nervures</strong> : épaisseur 0,5 à 0,7 \(e\), hauteur au plus 3 \(e\), congé de pied, dépouille.</li>
      <li><strong>Angles</strong> : rayon intérieur d'au moins \(e/2\), rayon extérieur = rayon intérieur + \(e\).</li>
      <li><strong>Démoulage</strong> : dépouilles partout, pas de contre-dépouille sans tiroir prévu.</li>
      <li><strong>Seuil, éjecteurs, plan de joint</strong> : sur des faces cachées ; seuil dans la partie la plus épaisse, lignes de soudure loin des zones sollicitées.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour une paroi de 3 mm : nervures de 1,5 à 2,1 mm d'épaisseur et de 9 mm de haut au plus, rayons intérieurs d'au moins 1,5 mm et extérieurs de 4,5 mm.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Calculer une force de fermeture et choisir une presse</strong>
    <ol>
      <li>Calculer la <strong>surface projetée</strong> \(S_p\) de toutes les empreintes et des canaux sur le plan de joint (vue dans le sens d'ouverture : les hauteurs ne comptent pas).</li>
      <li>Prendre la pression dans l'empreinte \(p_e\) (donnée, quelques dizaines de MPa).</li>
      <li>Écrire \(F_f \geq p_e S_p\), en unités SI (\(1\ \text{cm}^2 = 10^{-4}\ \text{m}^2\)).</li>
      <li>Choisir la presse immédiatement supérieure, avec une marge de 10 à 20 % au moins.</li>
    </ol>
    <p><em>Exemple éclair :</em> quatre empreintes de 50 × 35 mm et 6 cm² de canaux : \(S_p = 4 \times 17{,}5 + 6 = 76\ \text{cm}^2\) ; avec \(p_e = 50\) MPa, \(F_f \geq 380\) kN : une presse de 500 kN convient.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : prendre la surface totale de la pièce (toutes ses faces) au lieu de sa projection sur le plan de joint, ou oublier les canaux et le nombre d'empreintes.</div>

  <div class="method-box"><strong>Méthode 8 — Estimer l'effet de l'épaisseur sur le cycle</strong>
    <ol>
      <li>Identifier la phase qui domine : presque toujours le <strong>refroidissement</strong>.</li>
      <li>Appliquer la loi d'échelle \(t_r \propto e^2/a\) : \(t_{r2} = t_{r1}\,(e_2/e_1)^2\) pour un même polymère.</li>
      <li>Ajouter les temps fixes (fermeture, injection, ouverture, éjection) pour obtenir le cycle, puis la cadence (empreintes × 3 600 / cycle, en pièces par heure).</li>
    </ol>
    <p><em>Exemple éclair :</em> une paroi de 2,5 mm refroidit en 9 s, et les autres phases durent 5 s. À 1,8 mm, \(t_r \approx 9 \times (1{,}8/2{,}5)^2 \approx 4{,}7\) s : le cycle passe de 14 s à 9,7 s, la cadence est multipliée par 1,45.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Estimer et concevoir un stratifié</strong>
    <ol>
      <li>Fixer \(V_f\) d'après le <strong>procédé</strong> (≈ 30 % au contact, 50 à 60 % en infusion ou autoclave).</li>
      <li>Appliquer la loi des mélanges <strong>dans le sens des fibres</strong> : \(E_\parallel \approx V_f E_f + (1-V_f)E_m\), \(\rho_c = V_f\rho_f + (1-V_f)\rho_m\) ; ailleurs, la rigidité est bien plus faible.</li>
      <li>Orienter les plis d'après les <strong>efforts</strong> (0° traction et flexion, ±45° cisaillement et torsion, 90° transversal), en un empilement <strong>symétrique et équilibré</strong>.</li>
      <li>Compter les plis : épaisseur visée / épaisseur d'un pli (ou masse de fibres / masse surfacique × surface).</li>
    </ol>
    <p><em>Exemple éclair :</em> verre et époxyde à \(V_f = 0{,}55\) : \(E_\parallel \approx 0{,}55 \times 72 + 0{,}45 \times 3{,}5 \approx 41\) GPa et \(\rho_c \approx 1\,940\ \text{kg/m}^3\). Une épaisseur de 2 mm avec des plis de 0,25 mm demande 8 plis, par exemple [0/+45/−45/90]s.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un empilement non symétrique, comme [0/90] seul, se gauchit au refroidissement après cuisson, même si la pièce est bien dessinée.</div>

  <div class="method-box"><strong>Méthode 10 — Comparer deux procédés par le coût</strong>
    <ol>
      <li>Pour chaque procédé, séparer le <strong>coût fixe</strong> \(C_o\) (outillage, réglages) du <strong>coût variable</strong> \(C_v\) par pièce.</li>
      <li>Écrire \(C_u(N) = C_v + C_o/N\).</li>
      <li>Calculer le seuil \(N^* = \dfrac{C_{o2} - C_{o1}}{C_{v1} - C_{v2}}\) (procédé 2 plus outillé) et le comparer à la série prévue sur toute la durée de vie du produit.</li>
      <li>Vérifier qu'au-delà du coût, le procédé le moins cher remplit bien le cahier des charges.</li>
    </ol>
    <p><em>Exemple éclair :</em> une coque composite au contact (\(C_o = 2\,000\) €, \(C_v = 180\) €) contre le RTM (\(C_o = 25\,000\) €, \(C_v = 60\) €) : \(N^* = 23\,000/120 \approx 192\) coques.</p>
  </div>
</div>
</template>

  <h3>Vocabulaire du moule</h3>
  <div class="statement">On observe la coupe d'un moule en sable prêt à couler.</div>
  <div class="q"><strong>Q1.</strong> À quoi sert le plan de joint ?</div>
  <div class="q"><strong>Q2.</strong> Quel élément réserve une partie creuse de la pièce ?</div>

    <p><strong>Q2.</strong> Le noyau.</p>
    <p><strong>Q3.</strong> À constituer une réserve de métal liquide qui alimente la pièce pendant la solidification et compense le retrait, évitant la retassure dans les zones massives.</p>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Choix d'un procédé</h3>
  <div class="statement">Pour chacune des situations, proposer un procédé de moulage adapté en justifiant.</div>
  <div class="q"><strong>Q1.</strong> Bâti de machine-outil en fonte, 5 exemplaires, 800 kg.</div>
  <div class="q"><strong>Q2.</strong> Carter de boîte de vitesses en alliage d'aluminium, 200 000 pièces/an, parois minces.</div>
  <div class="q"><strong>Q3.</strong> Aube de turbine en superalliage, géométrie très complexe, état de surface soigné.</div>
  <div class="q"><strong>Q4.</strong> Boîtier de télécommande en ABS, 1 million de pièces par an, parois de 1,8 mm, clips intégrés.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> <strong>Moulage en sable</strong> : grande pièce, très petite série, fonte (point de fusion élevé) → outillage peu coûteux, taille illimitée.</p>
    <p><strong>Q2.</strong> <strong>Moulage sous pression</strong> : très grande série, alliage d'aluminium (point de fusion assez bas, environ 660 °C, pour ne pas détruire un moule en acier), parois minces et bon état de surface → moule métallique amorti par la série.</p>
    <p><strong>Q3.</strong> <strong>Moulage à la cire perdue</strong> : précision et complexité extrêmes, superalliage, peu d'usinage possible.</p>
    <p><strong>Q4.</strong> <strong>Injection</strong> du thermoplastique : très grande série (le moule, coûteux, est amorti sur un million de pièces), parois minces et régulières, pièce finie à la sortie du moule. Les clips sont des contre-dépouilles : on les dessine pour qu'ils se démoulent par une fenêtre du fond, ou on prévoit des tiroirs.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Retrait au modèle</h3>
  <div class="statement">Une pièce en alliage d'aluminium doit mesurer \(L = 300\) mm après refroidissement. Le retrait linéaire de l'alliage est de \(1{,}2\,\%\).</div>
  <div class="q"><strong>Q1.</strong> Quelle longueur doit-on donner au modèle ?</div>
  <div class="q"><strong>Q2.</strong> Pourquoi le modèle est-il aussi plus « épais » que la pièce finie sur les faces à usiner ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le métal se contracte de 1,2 % en refroidissant ; le modèle doit donc être surdimensionné du même taux :</p>
    <div class="formula">$$L_{\text{modèle}} = L\,(1 + 0{,}012) = 300 \times 1{,}012 = 303{,}6\ \text{mm}$$</div>
    <p><strong>Q2.</strong> Parce qu'on prévoit une <strong>surépaisseur d'usinage</strong> : la pièce brute de fonderie est volontairement plus grande sur les surfaces fonctionnelles, qui seront ensuite usinées pour atteindre la cote et l'état de surface voulus.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ☆ ☆</span>
  <h3>Thermoplastique ou thermodurcissable ?</h3>
  <div class="statement">Un atelier moule des pièces en polypropylène (PP), en polyamide chargé de 30 % de fibres de verre (PA6 GF30), en polycarbonate (PC) et des panneaux en verre et polyester.</div>
  <div class="q"><strong>Q1.</strong> Les carottes de PP et des pièces rebutées peuvent-elles être réutilisées ? Et les chutes des panneaux en polyester ? Justifier.</div>
  <div class="q"><strong>Q2.</strong> Pourquoi injecte-t-on le PP dans un moule froid (vers 40 °C), alors qu'une résine thermodurcissable se moule dans un moule chaud ?</div>
  <div class="q"><strong>Q3.</strong> Quel est l'effet des fibres de verre du PA6 GF30 sur la rigidité et sur le retrait de la pièce ?</div>
  <div class="q"><strong>Q4.</strong> On veut un hublot transparent dont une cote de 60 mm est tolérancée à ±0,08 mm. Quel polymère choisir parmi les trois thermoplastiques, et pourquoi ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le PP est un <strong>thermoplastique</strong> : il fond de nouveau à la chaleur. Carottes et rebuts sont broyés et réinjectés, mélangés en petite proportion à la matière neuve (chaque refusion dégrade un peu les chaînes). Le polyester est un <strong>thermodurcissable</strong> : sa réticulation est irréversible, il ne refond pas ; ses chutes ne peuvent être que broyées comme charge ou valorisées en énergie.</p>
    <p><strong>Q2.</strong> Un thermoplastique se fige en <strong>refroidissant</strong> : le moule froid évacue sa chaleur. Une résine thermodurcissable durcit par une <strong>réaction chimique</strong> accélérée par la chaleur : le moule chaud déclenche la réticulation.</p>
    <p><strong>Q3.</strong> Les fibres rendent la pièce environ trois fois plus rigide. Elles s'orientent dans le sens de l'écoulement et y freinent la contraction : le retrait devient plus faible le long des fibres que perpendiculairement, et cette différence peut gauchir la pièce.</p>

  <div class="q"><strong>Q2.</strong> Calculer le module de refroidissement du bossage.</div>
  <div class="q"><strong>Q3.</strong> On le nourrit par une masselotte cylindrique de hauteur égale à son diamètre \(D\), posée sur lui. Déterminer \(D\) avec la règle \(M_{\text{masselotte}} \geq 1{,}2\,M_{\text{bossage}}\).</div>

    <p><strong>Q3.</strong> Pour un cylindre posé par sa base et de hauteur \(D\) : \(M = \dfrac{\pi D^3/4}{\pi D^2 + \pi D^2/4} = \dfrac{D}{5}\). Condition \(D/5 \geq 1{,}2 \times 9{,}5\), soit \(D \geq 57\) mm : on prend 58 mm.</p>

  <div class="formula">$$t_r \approx \frac{e^2}{\pi^2 a}\,\ln\!\left(\frac{4}{\pi}\,\frac{T_i - T_m}{T_{\text{éj}} - T_m}\right)$$</div>
  Les autres phases du cycle durent 4 s au total. Le moule a 4 empreintes ; l'heure de presse coûte 45 €. Il faut produire 500 000 boîtiers.</div>
  <div class="q"><strong>Q1.</strong> Calculer le temps de refroidissement, le temps de cycle et la cadence horaire.</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{e^2}{\pi^2 a} = \dfrac{(2{,}2\cdot10^{-3})^2}{\pi^2 \times 1{,}1\cdot10^{-7}} \approx 4{,}46\) s et \(\ln\!\left(\dfrac{4}{\pi}\times\dfrac{180}{35}\right) \approx 1{,}88\) : \(t_r \approx 8{,}4\) s. Cycle \(\approx 12{,}4\) s ; cadence \(4 \times 3\,600/12{,}4 \approx 1\,160\) boîtiers par heure.</p>
    <p><strong>Q2.</strong> \(500\,000/1\,163 \approx 430\) h de presse ; coût de presse \(45/1\,163 \approx 0{,}039\) € par boîtier.</p>
    <p><strong>Q3.</strong> \(t_r \approx 8{,}4 \times (1{,}6/2{,}2)^2 \approx 4{,}4\) s ; cycle \(\approx 8{,}4\) s ; cadence \(\approx 1\,710\) par heure ; la production demande environ 293 h au lieu de 430 h, soit 32 % de temps de presse en moins (et 27 % de matière en moins sur les parois).</p>

</div>

  <div class="q"><strong>A4.</strong> Avec une paroi de 2,5 mm, le refroidissement dure 12 s et les autres phases 6 s. Calculer la cadence et le nombre d'heures de presse par an.</div>
  <div class="q"><strong>A5.</strong> Pour rigidifier le capot sans l'épaissir, on ajoute des nervures intérieures. Les dimensionner, et dire où placer le plan de joint et les éjecteurs.</div>

  <p class="exo-part">Partie B — Version composite</p>
  <div class="q"><strong>B1.</strong> Le capot composite est réalisé par RTM à \(V_f = 0{,}5\). Calculer, dans le sens des fibres, le module et la masse volumique d'un pli unidirectionnel. Pourquoi utilise-t-on ensuite \(E_q = 45\) GPa et non cette valeur ?</div>
  <div class="q"><strong>B2.</strong> Le capot doit avoir la même rigidité en flexion que la version injectée de 2,5 mm (même \(E e^3\)). Calculer l'épaisseur de composite nécessaire et le rapport des masses.</div>
  <div class="q"><strong>B3.</strong> On dispose de plis de 0,2 mm. Proposer un empilement, préciser l'épaisseur obtenue et justifier la symétrie.</div>
  <div class="q"><strong>B4.</strong> Quelles modifications du dessin la version composite impose-t-elle par rapport à la version injectée (nervures, fixations, rayons) ?</div>

  <p class="exo-part">Partie C — Choix économique</p>
  <div class="q"><strong>C1.</strong> Injection : \(C_o = 60\,000\) € (moule), \(C_v = 4{,}20\) € ; RTM : \(C_o = 18\,000\) €, \(C_v = 38\) €. Calculer le seuil de rentabilité.</div>
  <div class="q"><strong>C2.</strong> La gamme haute ne représente que 2 000 capots par an pendant 4 ans. Comparer les coûts unitaires, puis le surcoût de la version composite rapporté au kilogramme gagné (la version composite fait 1,6 mm d'épaisseur). Conclure.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> 40 000 pièces par an sur plusieurs années : très au-delà du seuil où un moule d'injection s'amortit ; coque à paroi mince, pièce finie à la sortie du moule, aspect obtenu directement par le moule. Le PA6 GF30 est environ trois fois plus rigide que le PA6 non chargé, à épaisseur égale : il protège mieux la batterie sans épaissir la paroi (donc sans allonger le cycle).</p>
    <p><strong>A2.</strong> Le retrait est plus faible le long des fibres qu'en travers : une coque allongée remplie par un bout gauchit (elle se « banane »). On place le point d'injection au <strong>centre de la face intérieure</strong>, cachée : la matière s'écoule de façon symétrique vers les deux extrémités, les retraits sont équilibrés et la face d'aspect ne porte aucune marque. Un seuil unique central évite aussi des lignes de soudure sur la longueur.</p>
    <p><strong>A3.</strong> \(S_p = 36 \times 11 + 4 = 400\ \text{cm}^2\) ; \(F_f \geq 40\cdot10^{6} \times 0{,}04 = 1{,}6\cdot10^{6}\) N = 1 600 kN. La presse de 1 600 kN n'a aucune marge ; on choisit celle de <strong>2 000 kN</strong> (25 % de marge).</p>
    <p><strong>A4.</strong> Cycle 18 s, soit 200 capots par heure ; 40 000 capots demandent 200 h de presse par an : une presse peut en partager le temps avec d'autres produits.</p>
    <p><strong>A5.</strong> Nervures de 1,25 à 1,75 mm d'épaisseur (0,5 à 0,7 fois 2,5 mm), d'au plus 7,5 mm de haut, avec congé de pied et dépouille ; disposées en croisillons sous les zones d'appui, en évitant les croisements massifs (ou en évidant le nœud). Plan de joint sur le bord de la coque, à sa plus grande section ; la coque reste sur le noyau (côté mobile) et les éjecteurs poussent sur la face intérieure ou sur les nervures, jamais sur la face d'aspect.</p>
    <p><strong>B1.</strong> Loi des mélanges :</p>
    <div class="formula">$$E_\parallel \approx 0{,}5 \times 230 + 0{,}5 \times 3{,}5 \approx 117\ \text{GPa} \qquad \rho_c = 0{,}5 \times 1\,780 + 0{,}5 \times 1\,200 = 1\,490\ \text{kg/m}^3$$</div>
    <p>Cette rigidité ne vaut que dans le sens des fibres ; le capot est fléchi dans plusieurs directions, on emploie donc un empilement à plusieurs orientations, dont le module « quasi isotrope » \(E_q\) est bien plus faible.</p>
    <p><strong>B2.</strong> \(e_c = 2{,}5 \times (9/45)^{1/3} \approx 1{,}46\) mm. Rapport des masses (même surface) : \(\dfrac{1{,}46 \times 1\,490}{2{,}5 \times 1\,360} \approx 0{,}64\) : la version composite est 36 % plus légère.</p>
    <p><strong>B3.</strong> Il faut au moins \(1{,}46/0{,}2 \approx 7{,}3\) plis : on en prend 8, soit 1,6 mm, en [0/+45/−45/90]s : quatre orientations (quasi isotrope), autant de plis à +45° qu'à −45° (équilibré) et un empilement symétrique par rapport au plan moyen, qui ne se gauchit pas après la cuisson.</p>
    <p><strong>B4.</strong> Pas de nervures fines (les fibres n'y entrent pas) : la rigidité vient de la forme (bords tombés, galbe) ou d'une âme de sandwich localement. Pas de fûts de vissage moulés ni de perçages près des bords : des <strong>inserts</strong> posés au drapage ou collés, loin des bords. Rayons généreux partout ; dépouille pour sortir du moule RTM.</p>
    <p><strong>C1.</strong> \(N^* = \dfrac{60\,000 - 18\,000}{38 - 4{,}20} \approx 1\,240\) capots.</p>
    <p><strong>C2.</strong> Sur la gamme haute, \(N = 8\,000\) capots en 4 ans, au-delà du seuil. Si la gamme haute avait son propre moule d'injection : \(4{,}20 + 60\,000/8\,000 = 11{,}70\) € ; en RTM : \(38 + 18\,000/8\,000 \approx 40{,}25\) € (et si la gamme haute reprend la version injectée de la gamme courante, déjà amortie, le surcoût est encore plus net). Masses : \(0{,}10 \times 2{,}5\cdot10^{-3} \times 1\,360 = 340\) g pour l'injection, \(0{,}10 \times 1{,}6\cdot10^{-3} \times 1\,490 \approx 238\) g pour le composite : 102 g gagnés pour 28,55 € de plus, soit environ 280 € par kilogramme gagné. Sur un vélo de 25 kg, ce gain n'est pas justifié techniquement ; il ne se défend que par l'image de la gamme haute. On retient l'injection, et on réserve le carbone aux pièces où la masse compte vraiment (cadre, jantes).</p>
  </div>
