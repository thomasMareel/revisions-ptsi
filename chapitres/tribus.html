  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre ouvre la partie « Variables aléatoires discrètes » du programme de PT (A a et A b). En PTSI, l'univers était fini et toute partie de \(\Omega\) était un événement ; en PT, on étudie des expériences aux issues infiniment nombreuses (lancer un dé jusqu'au premier 6, jouer à pile ou face sans fin). Le programme demande un exposé <em>a minima</em> : la tribu n'appelle aucun développement au-delà de sa définition, l'essentiel est de savoir écrire un événement décrit en mots. Probabilité, conditionnement et indépendance : chapitre « Espaces probabilisés » ; lois et espérance : chapitres « Variables aléatoires discrètes ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Ensemble dénombrable</strong>, <strong>au plus dénombrable</strong> ; les parties de \(\mathbb{N}\) sont au plus dénombrables ; description en extension \(\{x_i,\ i \in I\}\) avec \(I \subset \mathbb{N}\) et les \(x_i\) distincts (§1).</li>
        <li><strong>Dénombrabilité de \(\mathbb{Z}\)</strong> et d'un <strong>produit cartésien</strong> de deux ensembles dénombrables (§2).</li>
        <li><strong>Univers \(\Omega\), tribu \(\mathcal{A}\)</strong> : définition, stabilité par les opérations ensemblistes finies ou dénombrables (§3).</li>
        <li><strong>Événements</strong> : vocabulaire de première année généralisé (contraire, incompatibles, système complet) (§4).</li>
        <li><strong>Traduction</strong> de la réalisation de \(\bigcup A_n\) et \(\bigcap A_n\) avec les quantificateurs \(\exists\) et \(\forall\) (§5) ; jeu de <strong>pile ou face infini</strong> (§6).</li>
        <li><strong>Variable aléatoire discrète</strong> ; univers en général non explicité ; notations \((X = x)\), \(\{X = x\}\), \((X \in A)\), \((X \geq x)\) (§7).</li>
      </ul>
      <p>Hors programme : toute autre connaissance sur la dénombrabilité (non-dénombrabilité de \(\mathbb{R}\)…), la tribu engendrée, la construction des espaces probabilisés (fin du chapitre).</p>

<div class="course-section">
  <div class="sec-num">§1 · ENSEMBLES DÉNOMBRABLES</div>
  <h2>Ranger les éléments en une suite</h2>
  <div class="intro">Le rang du premier 6 dans une suite de lancers de dé peut valoir 1, 2, 3… sans limite : l'ensemble des valeurs possibles est infini, mais on peut en dresser la liste. C'est l'infini « des suites », le seul dont on a besoin en probabilités discrètes.</div>

  <div class="def-box">
    Un ensemble \(E\) est <strong>dénombrable</strong> s'il est en bijection avec \(\mathbb{N}\). Il est <strong>au plus dénombrable</strong> s'il est fini ou dénombrable.
  </div>
  <p>Être dénombrable, c'est pouvoir <strong>numéroter</strong> ses éléments : \(E = \{\varphi(0), \varphi(1), \varphi(2), \ldots\}\), chacun apparaissant une seule fois. Ainsi \(\mathbb{N}^*\) (par \(n \mapsto n + 1\)), les entiers pairs (par \(n \mapsto 2n\)) ou les carrés parfaits (par \(n \mapsto n^2\)) sont dénombrables. Phénomène propre à l'infini : \(\mathbb{N}\) est en bijection avec sa partie stricte \(2\mathbb{N}\).</p>

  <div class="prop-box">
    <strong>Parties de \(\mathbb{N}\).</strong> Toute partie de \(\mathbb{N}\) est au plus dénombrable : une partie infinie \(A\) se range dans l'ordre croissant \(a_0 \lt a_1 \lt a_2 \lt \cdots\), et \(n \mapsto a_n\) est une bijection de \(\mathbb{N}\) sur \(A\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de la démonstration</span>
    <span class="prompt">Énumérer par minimums successifs.</span>
    <div class="content"><p>On pose \(a_0 = \min A\), puis \(a_n = \min\big(A \setminus \{a_0, \ldots, a_{n-1}\}\big)\), ensemble non vide car \(A\) est infini. La suite est strictement croissante, donc injective. Si un \(x \in A\) n'était aucun des \(a_0, \ldots, a_x\), il aurait été candidat à chaque étape, d'où \(a_k \leq x\) pour \(k \leq x\) : ces \(x + 1\) entiers distincts, tous différents de \(x\), seraient dans \(\{0, \ldots, x-1\}\), qui n'en compte que \(x\). Donc tout élément de \(A\) est atteint.</p></div>
  </div>

  <div class="prop-box">
    <strong>Description en extension.</strong> \(E\) est au plus dénombrable si et seulement s'il s'écrit
    <div class="formula" data-nom="Ensemble au plus dénombrable">$$E = \{x_i,\ i \in I\}$$</div>
    avec \(I \subset \mathbb{N}\) et les \(x_i\) deux à deux distincts. Il est fini si \(I\) est fini, dénombrable si \(I\) est infini (on peut alors prendre \(I = \mathbb{N}\)).
  </div>
  <p>C'est sous cette forme qu'apparaissent les ensembles de valeurs des variables discrètes : si \(X(\Omega) = \{x_i,\ i \in I\}\), les sommes \(\sum_{i \in I} P(X = x_i)\) sont des sommes finies ou des <strong>séries</strong>.</p>

  <div class="method-box">
    <strong>Exemple — décrire des ensembles en extension</strong>
    <ol>
      <li>L'ensemble des nombres premiers est une partie infinie de \(\mathbb{N}\), donc il est dénombrable : \(p_0 = 2\), \(p_1 = 3\), \(p_2 = 5\)… Aucune formule pour \(p_n\) n'est nécessaire, la bijection existe.</li>
      <li>\(E = \{0\} \cup \{1/n,\ n \in \mathbb{N}^*\}\) s'écrit \(\{x_i,\ i \in \mathbb{N}\}\) avec \(x_0 = 0\) et \(x_i = 1/i\) pour \(i \geq 1\), valeurs distinctes : \(E\) est dénombrable.</li>
      <li>\(\{-1, 0, 1\} = \{x_0, x_1, x_2\}\) est au plus dénombrable, mais pas dénombrable : ici, « dénombrable » sous-entend « infini ».</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que « infini » veut dire « dénombrable ». \([0, 1]\), \(\mathbb{R}\) ou l'ensemble des suites infinies de piles et de faces ne sont <strong>pas</strong> dénombrables (hors programme, voir la fin du chapitre) : c'est pourquoi les variables « à densité » sortent du cadre du programme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DÉNOMBRABILITÉ DE ℤ ET DES PRODUITS</div>
  <h2>Les deux résultats du programme</h2>
  <div class="intro">Deux résultats, et eux seuls, sont au programme. Ils suffisent en pratique : une variable à valeurs dans \(\mathbb{Z}\), un couple \((X, Y)\) de variables discrètes ont un ensemble de valeurs au plus dénombrable.</div>

  <div class="prop-box">
    <strong>\(\mathbb{Z}\) est dénombrable.</strong> L'application qui envoie les entiers positifs sur les pairs et les négatifs sur les impairs,
    <div class="formula" data-nom="Une bijection de ℤ sur ℕ">$$\psi(m) = \begin{cases} 2m & \text{si } m \geq 0, \\ -2m - 1 & \text{si } m \lt 0, \end{cases}$$</div>
    est une bijection de \(\mathbb{Z}\) sur \(\mathbb{N}\) : elle numérote \(\mathbb{Z}\) dans l'ordre \(0, -1, 1, -2, 2, \ldots\) Sa réciproque est \(\varphi(n) = n/2\) pour \(n\) pair et \(\varphi(n) = -(n+1)/2\) pour \(n\) impair.
  </div>

  <div class="prop-box">
    <strong>Produit cartésien.</strong> Si \(E\) et \(F\) sont dénombrables, \(E \times F\) est dénombrable ; en particulier \(\mathbb{N}^2\), \(\mathbb{Z}^2\), \(\mathbb{N} \times \mathbb{Z}\). Une bijection explicite de \(\mathbb{N}^2\) sur \(\mathbb{N}\) est
    <div class="formula" data-nom="Une bijection de ℕ² sur ℕ">$$f(p, q) = 2^p\,(2q + 1) - 1.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout entier non nul est une puissance de 2 fois un impair, de façon unique.</span>
    <div class="content">
      <p>Pour \(m \geq 1\), on divise par 2 tant que c'est possible : \(m = 2^p r\) avec \(r\) impair, et \(p\) (exposant de 2 dans \(m\)) comme \(r\) sont uniques. Les impairs étant les \(2q + 1\), \((p, q) \mapsto 2^p(2q+1)\) est une bijection de \(\mathbb{N}^2\) sur \(\mathbb{N}^*\) ; en retranchant 1, \(f\) est une bijection sur \(\mathbb{N}\).</p>
      <p>En général, si \(\alpha : E \to \mathbb{N}\) et \(\beta : F \to \mathbb{N}\) sont bijectives, \((x, y) \mapsto (\alpha(x), \beta(y))\) est une bijection de \(E \times F\) sur \(\mathbb{N}^2\), que l'on compose avec \(f\).</p>
    </div>
  </div>

  <p><strong>Conséquences.</strong> Par récurrence, \(\mathbb{N}^k\) et \(\mathbb{Z}^k\) sont dénombrables. Le produit de deux ensembles <strong>au plus</strong> dénombrables est au plus dénombrable : il est en bijection avec une partie de \(\mathbb{N}^2\), donc (par \(f\)) avec une partie de \(\mathbb{N}\). C'est ce qui fait d'un couple de variables discrètes une variable discrète (§7). <em>Remarque non exigible</em> : \(\mathbb{Q}\) est dénombrable, car l'écriture irréductible \(p/q\) (\(q \geq 1\)) l'identifie à une partie infinie de \(\mathbb{Z} \times \mathbb{N}^*\).</p>

  <div class="method-box">
    <strong>Exemple — numéroter les couples d'entiers relatifs</strong>
    <p>\(g(a, b) = f\big(\psi(a), \psi(b)\big)\) est une bijection de \(\mathbb{Z}^2\) sur \(\mathbb{N}\).</p>
    <ol>
      <li>Numéro de \((-1, 2)\) : \(\psi(-1) = 1\), \(\psi(2) = 4\), donc \(g(-1, 2) = f(1, 4)\), soit \(2 \times 9 - 1 = 17\).</li>
      <li>Couple de numéro 47 : \(48 = 2^4 \times 3\), donc \(p = 4\), \(q = 1\), puis \(\varphi(4) = 2\) et \(\varphi(1) = -1\) : c'est \((2, -1)\).</li>
      <li>Vérification : \(g(2, -1) = f(4, 1)\), et \(16 \times 3 - 1 = 47\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§3 · UNIVERS ET TRIBU</div>
  <h2>Choisir les parties qui seront des événements</h2>
  <div class="intro">Dans un univers fini, toute partie de \(\Omega\) est un événement. Dans un univers infini, on se donne une famille de parties, la tribu, stable par les opérations qui servent à construire les événements. Le programme se limite à sa définition et à ses stabilités.</div>

  <p>L'<strong>univers</strong> \(\Omega\) est l'ensemble des issues de l'expérience ; son choix relève de la modélisation : \(\{1, \ldots, 6\}\) pour un dé, \(\mathbb{N}\) pour le nombre d'appels reçus par un standard en une heure, \(\{\mathrm{P}, \mathrm{F}\}^{\mathbb{N}^*}\) (suites infinies de piles et de faces, non dénombrable) pour une pièce lancée indéfiniment.</p>

  <div class="def-box">
    Une <strong>tribu</strong> sur \(\Omega\) est un ensemble \(\mathcal{A}\) de parties de \(\Omega\) tel que :
    <ol>
      <li>\(\Omega \in \mathcal{A}\) ;</li>
      <li><strong>stabilité par complémentaire</strong> : si \(A \in \mathcal{A}\), alors \(\overline{A} = \Omega \setminus A \in \mathcal{A}\) ;</li>
      <li><strong>stabilité par réunion dénombrable</strong> : pour toute suite \((A_n)_{n \in \mathbb{N}}\) d'éléments de \(\mathcal{A}\), \(\bigcup_{n=0}^{+\infty} A_n \in \mathcal{A}\).</li>
    </ol>
    Les éléments de \(\mathcal{A}\) sont les <strong>événements</strong> ; on dit parfois que \((\Omega, \mathcal{A})\) est un espace probabilisable.
  </div>

  <div class="prop-box">
    <strong>Stabilités.</strong> Une tribu contient \(\varnothing\) et elle est stable par réunion finie, par intersection finie ou dénombrable, et par différence (\(A \setminus B = A \cap \overline{B}\)). Le passage aux complémentaires repose sur les <strong>lois de De Morgan</strong> :
    <div class="formula" data-nom="Lois de De Morgan">$$\begin{aligned} \overline{\bigcup_{n=0}^{+\infty} A_n} &= \bigcap_{n=0}^{+\infty} \overline{A_n}, \\ \overline{\bigcap_{n=0}^{+\infty} A_n} &= \bigcup_{n=0}^{+\infty} \overline{A_n}. \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout découle des trois axiomes.</span>
    <div class="content"><p>\(\omega \notin \bigcup A_n\) signifie « pour aucun \(n\), \(\omega \in A_n\) », soit « pour tout \(n\), \(\omega \in \overline{A_n}\) » : c'est la première loi, et la seconde s'en déduit en l'appliquant aux \(\overline{A_n}\). Ensuite \(\varnothing = \overline{\Omega} \in \mathcal{A}\) ; une réunion finie \(A_0 \cup \cdots \cup A_n\) est la réunion de la suite complétée par des \(\varnothing\) ; enfin \(\bigcap A_n\) est le complémentaire de \(\bigcup \overline{A_n}\), qui est dans \(\mathcal{A}\).</p></div>
  </div>
  <p>Exemples de référence : \(\mathcal{P}(\Omega)\), la plus grande tribu, utilisée quand \(\Omega\) est fini ou dénombrable ; \(\{\varnothing, \Omega\}\), la plus petite ; \(\{\varnothing, A, \overline{A}, \Omega\}\), celle d'un observateur qui sait seulement si \(A\) s'est réalisé.</p>

  <div class="method-box">
    <strong>Exemple — reconnaître une tribu</strong>
    <ol>
      <li>Sur \(\{1, \ldots, 6\}\), \(\mathcal{A}_1 = \{\varnothing, \{1, 2\}, \{3, 4, 5, 6\}, \Omega\}\) est une tribu : le complémentaire échange les deux blocs, et toute réunion vaut \(\varnothing\), un bloc ou \(\Omega\).</li>
      <li>La famille \(\mathcal{A}_2\) formée de \(\varnothing\), \(\{6\}\), \(\{1, 2\}\), \(\{1, \ldots, 5\}\), \(\{3, \ldots, 6\}\) et \(\Omega\) est stable par complémentaire, mais \(\{6\} \cup \{1, 2\} \notin \mathcal{A}_2\) : ce n'est pas une tribu.</li>
      <li>Sur \(\mathbb{N}\), soit \(\mathcal{C}\) l'ensemble des parties finies ou de complémentaire fini. \(\mathcal{C}\) contient \(\mathbb{N}\), est stable par complémentaire et par réunion <strong>finie</strong>. Mais les singletons \(\{2k\}\) sont dans \(\mathcal{C}\) et leur réunion \(2\mathbb{N}\), infinie de complémentaire infini, n'y est pas : \(\mathcal{C}\) n'est pas une tribu. Sans la stabilité dénombrable, on ne pourrait même pas former « le résultat est pair ».</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : mélanger les niveaux. Une issue est un élément de \(\Omega\) ; un événement est une partie de \(\Omega\) (\(A \subset \Omega\)) qui appartient à la tribu (\(A \in \mathcal{A}\)) ; on n'écrit jamais \(\omega \in \mathcal{A}\). On rencontre aussi la notation \(\mathcal{T}\) pour une tribu.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉVÉNEMENTS ET VOCABULAIRE</div>
  <h2>Du langage courant au langage des ensembles</h2>
  <div class="intro">Le dictionnaire de première année reste valable mot pour mot ; la nouveauté est qu'un système complet peut compter une infinité dénombrable d'événements.</div>

  <div style="overflow-x:auto"><table>
    <tr><th>En mots</th><th>En ensembles</th></tr>
    <tr><td>événement certain, impossible</td><td>\(\Omega\), \(\varnothing\)</td></tr>
    <tr><td>contraire de \(A\), « non \(A\) »</td><td>\(\overline{A} = \Omega \setminus A\)</td></tr>
    <tr><td>« \(A\) et \(B\) »</td><td>\(A \cap B\)</td></tr>
    <tr><td>« \(A\) ou \(B\) » (l'un au moins)</td><td>\(A \cup B\)</td></tr>
    <tr><td>« \(A\) mais pas \(B\) »</td><td>\(A \setminus B = A \cap \overline{B}\)</td></tr>
    <tr><td>« \(A\) entraîne \(B\) »</td><td>\(A \subset B\)</td></tr>
    <tr><td>\(A\) et \(B\) incompatibles</td><td>\(A \cap B = \varnothing\)</td></tr>
  </table></div>

  <div class="def-box">
    Une famille \((A_i)_{i \in I}\), avec \(I \subset \mathbb{N}\) fini ou infini, est un <strong>système complet d'événements</strong> si ses événements sont deux à deux incompatibles (\(A_i \cap A_j = \varnothing\) pour \(i \neq j\)) et si leur réunion est \(\Omega\) : pour chaque issue, <strong>un et un seul</strong> des \(A_i\) se réalise.
  </div>
  <p>Exemples : \((A, \overline{A})\) ; pour une variable \(X\), la famille des \((X = x)\), \(x \in X(\Omega)\) (§7) ; pour un dé lancé indéfiniment, les événements \(A_n\) « le premier 6 sort au \(n\)-ième lancer » (\(n \geq 1\)) et \(A_\infty\) « le 6 ne sort jamais ». Sans \(A_\infty\), la famille \((A_n)_{n \geq 1}\) ne recouvre pas \(\Omega\) : ce n'est pas un système complet ; comme \(A_\infty\) est de probabilité nulle pour des lancers indépendants d'un dé équilibré (chapitre suivant), elle formera un système « quasi-complet ».</p>

  <div class="method-box">
    <strong>Exemple — contrôle de trois pièces</strong>
    <p>\(D_k\) : « la \(k\)-ième pièce contrôlée est défectueuse » (\(k = 1, 2, 3\)).</p>
    <ol>
      <li>« Aucune pièce défectueuse » : \(\overline{D_1} \cap \overline{D_2} \cap \overline{D_3}\) ; son contraire, « au moins une », est \(D_1 \cup D_2 \cup D_3\).</li>
      <li>« Exactement une » : réunion des trois événements deux à deux incompatibles \(D_1 \cap \overline{D_2} \cap \overline{D_3}\), \(\overline{D_1} \cap D_2 \cap \overline{D_3}\), \(\overline{D_1} \cap \overline{D_2} \cap D_3\).</li>
      <li>« La première pièce défectueuse est la deuxième contrôlée » : \(\overline{D_1} \cap D_2\), sans condition sur la troisième.</li>
      <li>Les quatre événements « exactement \(k\) pièces défectueuses » (\(k = 0, \ldots, 3\)) forment un système complet.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre « incompatibles » et « contraires ». \(\{1\}\) et \(\{2\}\) sont incompatibles sans être contraires ; des contraires sont incompatibles <strong>et</strong> de réunion \(\Omega\). L'incompatibilité est une propriété des ensembles, sans probabilité : elle n'a rien à voir avec l'indépendance.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RÉUNIONS ET INTERSECTIONS DÉNOMBRABLES</div>
  <h2>Traduire « il existe » et « pour tout »</h2>
  <div class="intro">C'est la capacité centrale du chapitre : écrire un événement décrit en mots avec des réunions et des intersections dénombrables. Règle : un « il existe » devient une réunion, un « pour tout » une intersection.</div>

  <div class="prop-box">
    <strong>Réunion, intersection et quantificateurs.</strong> Pour une suite \((A_n)\) d'événements et une issue \(\omega\) :
    <div class="formula" data-nom="Réunion dénombrable et ∃">$$\omega \in \bigcup_{n=0}^{+\infty} A_n \iff \exists\, n \in \mathbb{N},\ \omega \in A_n$$</div>
    (l'un au moins des \(A_n\) se réalise) ;
    <div class="formula" data-nom="Intersection dénombrable et ∀">$$\omega \in \bigcap_{n=0}^{+\infty} A_n \iff \forall\, n \in \mathbb{N},\ \omega \in A_n$$</div>
    (tous les \(A_n\) se réalisent). De même pour tout ensemble d'indices (\(n \geq N\), \(n\) pair…). Les lois de De Morgan sont la négation des quantificateurs : le contraire de « l'un au moins » est « aucun ».
  </div>

  <div class="method-box">
    <strong>Méthode — traduire un événement décrit en mots</strong>
    <ol>
      <li>Choisir des événements de base indexés par un rang, par exemple \(P_n\) : « le \(n\)-ième lancer donne pile ».</li>
      <li>Réécrire la phrase avec des quantificateurs sur l'indice (« il existe un rang \(n\)… », « pour tout \(n \geq N\)… »).</li>
      <li>Remplacer chaque \(\exists\) par une réunion et chaque \(\forall\) par une intersection, dans l'ordre de lecture (de l'extérieur vers l'intérieur).</li>
      <li>Contrôler sur une issue particulière, ou en écrivant le contraire (échanger \(\cup\) et \(\cap\), remplacer chaque événement de base par son contraire).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — une pièce lancée indéfiniment</strong>
    <p>\(P_n\) : « le \(n\)-ième lancer donne pile », \(F_n = \overline{P_n}\) (\(n \geq 1\)).</p>
    <ol>
      <li>« Au moins un pile » : \(\bigcup_{n \geq 1} P_n\) ; son contraire, « que des faces », est \(\bigcap_{n \geq 1} F_n\).</li>
      <li>« Au moins un pile après le dixième lancer » : \(\bigcup_{n \geq 11} P_n\).</li>
      <li>« Le premier pile sort au rang \(n\) » : \(F_1 \cap \cdots \cap F_{n-1} \cap P_n\).</li>
      <li>« Tous les lancers de rang pair donnent pile » : \(\bigcap_{k \geq 1} P_{2k}\).</li>
      <li>« Jamais deux piles consécutifs » : pour tout \(n\), le lancer \(n\) ou le lancer \(n+1\) donne face, soit \(\bigcap_{n \geq 1} (F_n \cup F_{n+1})\). Son contraire est bien \(\bigcup_{n \geq 1} (P_n \cap P_{n+1})\).</li>
    </ol>
  </div>

  <h3>« Une infinité » et « à partir d'un certain rang »</h3>
  <div class="prop-box">
    <strong>Deux traductions à savoir refaire.</strong> « Une infinité de \(A_n\) se réalisent » (pour tout \(N\), il existe \(n \geq N\) tel que \(A_n\) se réalise) et « tous les \(A_n\) se réalisent à partir d'un certain rang » (il existe \(N\) tel que, pour tout \(n \geq N\)…) s'écrivent respectivement
    <div class="formula" data-nom="Une infinité de Aₙ se réalisent">$$\bigcap_{N=0}^{+\infty}\ \bigcup_{n \geq N} A_n$$</div>
    et
    <div class="formula" data-nom="Les Aₙ se réalisent à partir d'un certain rang">$$\bigcup_{N=0}^{+\infty}\ \bigcap_{n \geq N} A_n.$$</div>
    Ce sont des événements, par stabilité de la tribu.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">« Une infinité » = « au-delà de tout rang ».</span>
    <div class="content"><p>Pour \(\omega\) fixé, l'ensemble \(J = \{n,\ \omega \in A_n\}\) est une partie de \(\mathbb{N}\) ; elle est infinie si et seulement si elle n'est pas majorée, c'est-à-dire si, pour tout \(N\), elle contient un \(n \geq N\). Son contraire, « \(J\) majoré », se lit « à partir d'un certain rang, aucun \(A_n\) ne se réalise » : \(\bigcup_N \bigcap_{n \geq N} \overline{A_n}\), conformément à De Morgan.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — infinité de piles, mesures successives</strong>
    <ol>
      <li>« Une infinité de piles » : \(\bigcap_{N \geq 1} \bigcup_{n \geq N} P_n\). Contraire : « que des faces à partir d'un certain rang », \(\bigcup_{N \geq 1} \bigcap_{n \geq N} F_n\). Le chapitre suivant montre que le premier est presque sûr pour des lancers indépendants où pile a une probabilité fixe non nulle.</li>
      <li>Pour une suite \((X_n)\) de mesures aléatoires réelles : « \(X_n\) dépasse \(a\) au moins une fois » s'écrit \(\bigcup_n (X_n \gt a)\) ; « à partir d'un certain rang, \(X_n \leq a\) » s'écrit \(\bigcup_N \bigcap_{n \geq N} (X_n \leq a)\).</li>
      <li>« La suite \((X_n)\) est bornée » : il existe \(M\), que l'on peut prendre <strong>entier</strong> pour que la réunion soit dénombrable, tel que \(|X_n| \leq M\) pour tout \(n\) ; soit \(\bigcup_{M \in \mathbb{N}} \bigcap_{n} (|X_n| \leq M)\).</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Réunions et intersections partielles.</strong> Pour toute suite \((A_k)\), \(\left(\bigcup_{k=0}^{n} A_k\right)_n\) est croissante, \(\left(\bigcap_{k=0}^{n} A_k\right)_n\) est décroissante, et leurs réunion et intersection respectives sont \(\bigcup_{k=0}^{+\infty} A_k\) et \(\bigcap_{k=0}^{+\infty} A_k\). C'est la clé du calcul de \(P\left(\bigcup A_k\right)\) par passage à la limite (chapitre « Espaces probabilisés »).
  </div>
  <div class="notice"><strong>Erreur classique</strong> : intervertir les quantificateurs. Une pièce qui alterne pile et face réalise « une infinité de piles » mais pas « que des piles à partir d'un certain rang ». Et \(\bigcup A_n\) signifie « au moins un », jamais « exactement un ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MODÉLISER LE PILE OU FACE INFINI</div>
  <h2>Un univers que l'on n'écrit presque jamais</h2>
  <div class="intro">Le pile ou face illimité est l'exemple type d'univers infini non dénombrable. Il illustre la position du programme : on ne construit pas l'univers, on travaille avec des événements de base et ceux qu'on en tire par des opérations dénombrables.</div>

  <p>Une issue est une suite \(\omega = (\omega_1, \omega_2, \ldots)\) d'éléments de \(\{\mathrm{P}, \mathrm{F}\}\). Les événements de base sont les \(P_n = \{\omega,\ \omega_n = \mathrm{P}\}\) ; on prend une tribu \(\mathcal{A}\) qui les contient tous, donc qui contient aussi tous les événements du §5. Le chapitre suivant munit \((\Omega, \mathcal{A})\) d'une probabilité ; le programme en admet l'existence sans soulever de difficulté.</p>

  <p>Un événement qui ne dépend que des \(n\) premiers lancers est une réunion finie d'intersections finies : « exactement deux piles parmi les quatre premiers lancers » est la réunion de \(\binom{4}{2} = 6\) événements comme \(P_1 \cap P_2 \cap F_3 \cap F_4\). À l'opposé, une suite particulière \(\omega^0\) donne l'événement \(\{\omega^0\} = \bigcap_{n \geq 1} B_n\), avec \(B_n = P_n\) si \(\omega^0_n = \mathrm{P}\) et \(B_n = F_n\) sinon : une intersection dénombrable. En pratique, on code les lancers par \(X_n = 1\) (pile) ou \(0\) (face), de sorte que \(P_n = (X_n = 1)\), et \(S_n = X_1 + \cdots + X_n\) compte les piles des \(n\) premiers lancers.</p>

  <div class="method-box">
    <strong>Exemple — trois événements du pile ou face infini</strong>
    <ol>
      <li>« Le premier pile sort à un rang pair » : \(\bigcup_{k \geq 1} \left(F_1 \cap \cdots \cap F_{2k-1} \cap P_{2k}\right)\), réunion d'événements deux à deux incompatibles.</li>
      <li>« Les résultats alternent depuis le début » (PFPF… ou FPFP…) :
        <div class="formula">$$\begin{aligned} &\Big(\bigcap_{k \geq 1} (P_{2k-1} \cap F_{2k})\Big) \\ \cup\ &\Big(\bigcap_{k \geq 1} (F_{2k-1} \cap P_{2k})\Big). \end{aligned}$$</div></li>
      <li>« On obtient au total au moins 11 piles » : il existe un rang où l'on en a déjà 11, soit \(\bigcup_{n \geq 11} (S_n \geq 11)\), réunion d'une suite croissante d'événements.</li>
    </ol>
  </div>
  <div class="notice"><strong>À retenir</strong> : l'univers n'est en général pas explicité. Il suffit que chaque événement utilisé soit obtenu à partir des événements de base par un nombre fini ou dénombrable de réunions, d'intersections et de passages au contraire : la tribu garantit que c'est un événement.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · VARIABLES ALÉATOIRES DISCRÈTES</div>
  <h2>Des grandeurs qui dépendent du hasard</h2>
  <div class="intro">En PTSI, une variable aléatoire était une application quelconque sur un univers fini. En PT, elle peut prendre une infinité dénombrable de valeurs, et « \(X\) prend la valeur \(x\) » doit être un événement.</div>

  <div class="def-box">
    Une <strong>variable aléatoire discrète</strong> sur \((\Omega, \mathcal{A})\) est une application \(X : \Omega \to E\) telle que \(X(\Omega)\) est au plus dénombrable et que, pour tout \(x \in X(\Omega)\), \(X^{-1}(\{x\}) = \{\omega \in \Omega,\ X(\omega) = x\}\) est un événement, noté \((X = x)\) ou \(\{X = x\}\). Si \(E \subset \mathbb{R}\), la variable est dite <strong>réelle</strong>.
  </div>

  <div class="prop-box">
    <strong>Événements associés.</strong> Pour toute partie \(A\) de \(E\), \((X \in A) = \{\omega,\ X(\omega) \in A\}\) est un événement :
    <div class="formula" data-nom="Événement (X ∈ A)">$$(X \in A) = \bigcup_{x \in A \cap X(\Omega)} (X = x).$$</div>
    Pour une variable réelle, \((X \geq x)\), \((X \lt x)\), \((a \leq X \leq b)\)… sont donc des événements. La famille \(\big((X = x)\big)_{x \in X(\Omega)}\) est un <strong>système complet d'événements</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une réunion au plus dénombrable d'événements.</span>
    <div class="content"><p>\(A \cap X(\Omega)\), partie de \(X(\Omega)\), est au plus dénombrable : \(\{x_i,\ i \in I\}\) avec \(I \subset \mathbb{N}\). Or \(\omega \in (X \in A)\) si et seulement si \(X(\omega)\) est l'un des \(x_i\) : \((X \in A)\) est la réunion finie ou dénombrable des \((X = x_i)\). Pour une variable réelle, \((X \geq x) = (X \in [x, +\infty[)\). Enfin les \((X = x)\) sont deux à deux incompatibles (\(X(\omega)\) est une seule valeur) et recouvrent \(\Omega\).</p></div>
  </div>
  <p>On note \((X = x, Y = y) = (X = x) \cap (Y = y)\). Le couple \((X, Y)\) est une variable discrète, à valeurs dans \(X(\Omega) \times Y(\Omega)\), au plus dénombrable (§2). Lois, couples et fonctions \(f(X)\) : chapitre « Variables aléatoires discrètes (lois) ».</p>

  <div class="method-box">
    <strong>Exemple — le rang du premier 6</strong>
    <p>Un dé est lancé indéfiniment ; \(X_n\) est le résultat du \(n\)-ième lancer et \(T\) le rang du premier 6, avec la convention \(T = 0\) si le 6 ne sort jamais.</p>
    <ol>
      <li>Pour \(n \geq 1\), intersection finie d'événements :
        <div class="formula">$$\begin{aligned} (T = n) &= \bigcap_{k=1}^{n-1} (X_k \neq 6) \\ &\quad \cap (X_n = 6). \end{aligned}$$</div></li>
      <li>\((T = 0) = \bigcap_{k \geq 1} (X_k \neq 6)\) est un événement. Comme \(T(\Omega) \subset \mathbb{N}\), \(T\) est une variable aléatoire discrète.</li>
      <li>« Au moins un 6 lors des \(n\) premiers lancers » : \(\bigcup_{k=1}^{n} (X_k = 6) = (1 \leq T \leq n)\). Attention : \((T \leq n)\) contiendrait aussi \((T = 0)\).</li>
      <li>« Le premier 6 sort à un rang pair » : \(\bigcup_{k \geq 1} (T = 2k)\), en excluant encore la valeur conventionnelle 0.</li>
    </ol>
    <p>Le chapitre suivant montre que \(P(T = 0) = 0\) : la convention ne change aucune probabilité, elle sert à définir \(T\) partout.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la variable, l'événement et sa probabilité. \(X\) est une application, \((X = x)\) un ensemble d'issues, \(P(X = x)\) un nombre : on n'écrit ni \(P(X)\) ni \(X \in \mathcal{A}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce que le programme laisse de côté</h2>
  <ul>
    <li><strong>\(\mathbb{R}\) n'est pas dénombrable</strong> (argument diagonal de Cantor) : si \([0, 1[ = \{x_0, x_1, \ldots\}\), le réel dont la \((n+1)\)-ième décimale vaut 5 si celle de \(x_n\) n'est pas 5, et 4 sinon, diffère de tous les \(x_n\). Même argument pour \(\{\mathrm{P}, \mathrm{F}\}^{\mathbb{N}^*}\) : on ne calcule pas la probabilité d'un événement du pile ou face infini en additionnant des probabilités de suites (chacune est nulle).</li>
    <li><strong>Une réunion dénombrable d'ensembles dénombrables est dénombrable</strong> (par exemple \(\mathbb{Q} = \bigcup_{q \geq 1} \{p/q,\ p \in \mathbb{Z}\}\)).</li>
    <li><strong>Tribu engendrée</strong> par une famille de parties : la plus petite tribu qui la contient (intersection de toutes ces tribus). La tribu du pile ou face infini est celle qu'engendrent les \(P_n\).</li>
    <li><strong>Limites supérieure et inférieure</strong> : \(\limsup A_n = \bigcap_N \bigcup_{n \geq N} A_n\) et \(\liminf A_n = \bigcup_N \bigcap_{n \geq N} A_n\) ; le lemme de Borel-Cantelli (chapitre suivant) porte sur la première.</li>
    <li><strong>Construction des espaces probabilisés</strong> : l'existence d'une probabilité sur la tribu du pile ou face infini (Kolmogorov, 1933) relève de la théorie de la mesure.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="trb-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · DÉNOMBRABLES ET TRIBUS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à reconnaître un ensemble dénombrable, à vérifier les axiomes d'une tribu \(\mathcal{A}\), et surtout à écrire avec des réunions et des intersections un événement décrit en mots, jusqu'à reconnaître une variable aléatoire discrète.</div>

  <div class="method-box"><strong>Méthode 1 — Montrer qu'un ensemble est dénombrable</strong>
    <ol>
      <li>Exhiber une bijection explicite entre l'ensemble et \(\mathbb{N}\), ou un ensemble déjà connu comme dénombrable (\(\mathbb{N}^*\), \(\mathbb{Z}\), \(\mathbb{N}^2\), \(\mathbb{Z} \times \mathbb{N}\)…) ; le plus sûr est d'en donner la réciproque.</li>
      <li>Si l'ensemble est une partie infinie de \(\mathbb{N}\), conclure directement : toute partie de \(\mathbb{N}\) est au plus dénombrable, et infinie, elle est dénombrable.</li>
      <li>Pour un ensemble de couples, se ramener au produit de deux ensembles dénombrables (résultat du programme) ; pour des \(k\)-uplets, raisonner par récurrence sur \(k\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E = \{(a, b) \in \mathbb{Z}^2,\ a + b = 0\}\). L'application \((a, b) \mapsto a\) est une bijection de \(E\) sur \(\mathbb{Z}\), de réciproque \(a \mapsto (a, -a)\) : \(E\) est en bijection avec \(\mathbb{Z}\), donc dénombrable.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une liste « infinie » ne prouve rien si certains éléments n'y figurent jamais. Écrire \(\mathbb{Z}\) sous la forme \(0, 1, 2, 3, \ldots\) puis \(-1, -2, \ldots\) n'est pas une numérotation : aucun entier négatif ne reçoit de rang fini. Il faut alterner (\(0, -1, 1, -2, 2, \ldots\)).</div>

  <div class="method-box"><strong>Méthode 2 — Décrire en extension un ensemble au plus dénombrable</strong>
    <ol>
      <li>Ranger les éléments en une suite \(x_0, x_1, x_2, \ldots\) (finie ou non) : \(E = \{x_i,\ i \in I\}\) avec \(I \subset \mathbb{N}\).</li>
      <li>Vérifier que les \(x_i\) sont deux à deux distincts (sinon, supprimer les répétitions) et que chaque élément de \(E\) est atteint.</li>
      <li>Conclure : \(E\) est fini si \(I\) est fini, dénombrable si \(I\) est infini. Pour \(X(\Omega) = \{x_i,\ i \in I\}\), les sommes \(\sum_{i \in I} P(X = x_i)\) seront des sommes finies ou des séries.</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(T\) prend ses valeurs dans \(\mathbb{N}^*\), la variable \(Y = (-1)^T/T\) prend ses valeurs parmi les \(x_n = (-1)^n/n\), \(n \geq 1\), soit \(-1, \tfrac{1}{2}, -\tfrac{1}{3}, \ldots\) Ces réels sont distincts, car \(|x_n| = 1/n\) : \(Y(\Omega)\) est inclus dans \(\{x_n,\ n \in \mathbb{N}^*\}\), ensemble dénombrable, donc au plus dénombrable.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Calculer avec une numérotation explicite</strong>
    <ol>
      <li>Pour trouver le <em>numéro</em> d'un élément, appliquer la formule : \(\psi(m) = 2m\) si \(m \geq 0\), \(\psi(m) = -2m - 1\) si \(m \lt 0\) pour \(\mathbb{Z}\) ; \(f(p, q) = 2^p(2q + 1) - 1\) pour \(\mathbb{N}^2\).</li>
      <li>Pour trouver l'<em>élément</em> de numéro \(N\) : avec \(\psi\), distinguer \(N\) pair (\(m = N/2\)) et impair (\(m = -(N+1)/2\)) ; avec \(f\), diviser \(N + 1\) par 2 autant que possible, \(N + 1 = 2^p r\) avec \(r\) impair, puis \(q = (r - 1)/2\).</li>
      <li>Contrôler en recalculant le numéro de l'élément trouvé.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(3, 2) = 8 \times 5 - 1 = 39\). Le couple de numéro 79 : \(80 = 2^4 \times 5\), donc \(p = 4\) et \(q = 2\) ; contrôle \(f(4, 2) = 16 \times 5 - 1 = 79\). Pour \(\mathbb{Z}\) : \(\psi(-7) = 13\), et 13 est impair, d'où \(m = -14/2 = -7\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Vérifier qu'une famille de parties est une tribu (ou ne l'est pas)</strong>
    <ol>
      <li>Vérifier que \(\Omega\) appartient à la famille.</li>
      <li>Stabilité par complémentaire : associer à chaque partie son complémentaire et vérifier qu'il figure dans la famille.</li>
      <li>Stabilité par réunion dénombrable : sur une famille <strong>finie</strong>, une suite d'éléments ne prend qu'un nombre fini de valeurs, donc il suffit de vérifier les réunions de deux éléments ; sur une famille infinie, partir d'une suite quelconque \((A_n)\).</li>
      <li>Pour montrer que ce n'est <strong>pas</strong> une tribu, un seul contre-exemple suffit : un complémentaire ou une réunion qui manque.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \(\Omega = \{a, b, c, d\}\), \(\{\varnothing, \{a\}, \{b, c, d\}, \Omega\}\) est une tribu. La famille \(\{\varnothing, \{a\}, \{b\}, \{b, c, d\}, \{a, c, d\}, \Omega\}\) est stable par complémentaire, mais \(\{a\} \cup \{b\} = \{a, b\}\) n'y figure pas : ce n'est pas une tribu.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la stabilité par réunion <strong>finie</strong> ne suffit pas sur un univers infini. Sur \(\mathbb{N}\), les parties finies ou de complémentaire fini forment une famille stable par complémentaire et réunion finie, mais pas une tribu : la réunion des \(\{2k\}\) est \(2\mathbb{N}\), ni fini ni de complémentaire fini.</div>

  <div class="method-box"><strong>Méthode 5 — Montrer qu'un ensemble construit est un événement</strong>
    <ol>
      <li>Réécrire l'ensemble à l'aide de réunions finies ou dénombrables, d'intersections et de complémentaires d'événements : \(A \setminus B = A \cap \overline{B}\), \(\bigcap A_n = \overline{\bigcup \overline{A_n}}\) (De Morgan).</li>
      <li>Appliquer les stabilités de la tribu de l'intérieur vers l'extérieur de l'écriture.</li>
      <li>Une réunion indexée par un ensemble dénombrable (une partie infinie de \(\mathbb{N}^2\), par exemple) est une réunion dénombrable : on peut ranger les indices en une suite.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(A, B \in \mathcal{A}\), la différence symétrique \(A \,\Delta\, B = (A \cap \overline{B}) \cup (\overline{A} \cap B)\) (« un seul des deux se réalise ») est un événement : complémentaires, puis intersections, puis réunion finie.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Traduire un événement décrit en mots</strong>
    <ol>
      <li>Choisir des événements de base indexés par un rang : \(P_n\) « pile au \(n\)-ième lancer », \(S_n\) « 6 au \(n\)-ième lancer », \((X_n = x)\)…</li>
      <li>Réécrire la phrase avec des quantificateurs sur les indices : « il existe un rang… », « pour tout rang… », « pour tous \(m \lt n\)… ».</li>
      <li>Remplacer chaque \(\exists\) par une réunion et chaque \(\forall\) par une intersection, de l'extérieur vers l'intérieur ; « le premier », « exactement » s'écrivent avec des contraires.</li>
      <li>Contrôler sur une issue qui réalise l'événement et sur une issue qui ne le réalise pas.</li>
    </ol>
    <p><em>Exemple éclair :</em> un dé est lancé indéfiniment. « Jamais deux 6 de suite » : pour tout \(n\), le lancer \(n\) ou le lancer \(n+1\) n'est pas un 6, soit \(\bigcap_{n \geq 1} \big(\overline{S_n} \cup \overline{S_{n+1}}\big)\). « Au moins deux 6 » : il existe \(m \lt n\) avec \(S_m\) et \(S_n\), soit \(\bigcup_{1 \leq m \lt n} (S_m \cap S_n)\), réunion indexée par une partie de \(\mathbb{N}^2\), donc dénombrable.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\bigcup_n A_n\) signifie « au moins un des \(A_n\) », jamais « exactement un » ; « exactement un » s'écrit \(\bigcup_n \big(A_n \cap \bigcap_{k \neq n} \overline{A_k}\big)\).</div>

  <div class="method-box"><strong>Méthode 7 — Traduire « une infinité » et « à partir d'un certain rang »</strong>
    <ol>
      <li>« Une infinité de \(A_n\) se réalisent » : pour tout \(N\), il existe \(n \geq N\) tel que \(A_n\) se réalise, soit \(\bigcap_{N} \bigcup_{n \geq N} A_n\).</li>
      <li>« Les \(A_n\) se réalisent tous à partir d'un certain rang » : il existe \(N\) tel que, pour tout \(n \geq N\)…, soit \(\bigcup_{N} \bigcap_{n \geq N} A_n\).</li>
      <li>« Un nombre fini (éventuellement nul) de \(A_n\) se réalisent » est le contraire de « une infinité » : \(\bigcup_{N} \bigcap_{n \geq N} \overline{A_n}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(X_n\) étant le résultat du \(n\)-ième lancer d'un dé, « le 6 sort une infinité de fois » s'écrit \(\bigcap_{N \geq 1} \bigcup_{n \geq N} (X_n = 6)\) ; « la suite des résultats est constante à partir d'un certain rang » s'écrit \(\bigcup_{N \geq 1} \bigcap_{n \geq N} (X_{n+1} = X_n)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'ordre des quantificateurs compte. Une suite qui alterne 6 et 1 réalise « une infinité de 6 » (\(\forall N\ \exists n \geq N\)) mais pas « que des 6 à partir d'un certain rang » (\(\exists N\ \forall n \geq N\)).</div>

  <div class="method-box"><strong>Méthode 8 — Écrire le contraire d'un événement</strong>
    <ol>
      <li>Appliquer les lois de De Morgan à toute l'écriture : échanger chaque \(\bigcup\) et chaque \(\bigcap\), et remplacer chaque événement de base par son contraire.</li>
      <li>En mots : « il existe » devient « pour tout », « au moins un » devient « aucun », « une infinité » devient « un nombre fini ».</li>
      <li>S'en servir pour contrôler une traduction, ou parce que le contraire est plus simple (au chapitre suivant, \(P(\overline{A}) = 1 - P(A)\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> le contraire de \(\bigcap_{N \geq 1} \bigcup_{n \geq N} (P_n \cap P_{n+1})\) (« deux piles consécutifs une infinité de fois ») est \(\bigcup_{N \geq 1} \bigcap_{n \geq N} (F_n \cup F_{n+1})\) (« à partir d'un certain rang, jamais deux piles consécutifs »).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Montrer qu'une application est une variable aléatoire discrète</strong>
    <ol>
      <li>Déterminer \(X(\Omega)\), ou l'inclure dans un ensemble connu (\(\mathbb{N}\), \(\mathbb{Z}\), \(\mathbb{N}^2\)…) : il est au plus dénombrable.</li>
      <li>Pour chaque \(x \in X(\Omega)\), écrire \((X = x)\) à partir des événements de base par un nombre fini ou dénombrable d'opérations : c'est un événement.</li>
      <li>Une valeur conventionnelle (« 0 si cela n'arrive jamais ») s'obtient souvent comme contraire de la réunion des autres \((X = x)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pile ou face infini, \(U\) le rang du deuxième pile (\(U = 0\) s'il y a moins de deux piles). Pour \(n \geq 2\), un seul pile avant le rang \(n\) (au rang \(k\)) puis un pile au rang \(n\) :</p>
    <div class="formula">$$(U = n) = \bigcup_{k=1}^{n-1} \Big(P_k \cap P_n \cap \bigcap_{i \lt n,\ i \neq k} F_i\Big),$$</div>
    <p>réunion finie d'intersections finies ; \((U = 0)\) est le contraire de \(\bigcup_{n \geq 2} (U = n)\) ; \(U(\Omega) \subset \mathbb{N}\) : \(U\) est une variable aléatoire discrète.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Écrire \((X \in A)\) ou \((X \geq x)\) sans se tromper de valeurs</strong>
    <ol>
      <li>Utiliser \((X \in A) = \bigcup_{x \in A \cap X(\Omega)} (X = x)\) : seules comptent les valeurs de \(A\) que \(X\) peut prendre.</li>
      <li>Repérer les valeurs conventionnelles (« \(T = 0\) si le 6 ne sort jamais ») et se demander si elles appartiennent à \(A\).</li>
      <li>Pour un rang de premier succès \(T\), « pas de succès lors des \(n\) premières épreuves » s'écrit \((T = 0) \cup (T \gt n)\), et non \((T \gt n)\) seul.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(T\) rang du premier pile, \(T = 0\) s'il ne sort jamais. \((T \geq 3) = F_1 \cap F_2 \cap \bigcup_{k \geq 3} P_k\), alors que \(F_1 \cap F_2 = (T \geq 3) \cup (T = 0)\). De même, « au moins un pile lors des 5 premiers lancers » est \((1 \leq T \leq 5)\), pas \((T \leq 5)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre les niveaux. \(X\) est une application, \((X = x)\) un ensemble d'issues (un événement, élément de \(\mathcal{A}\)), \(\omega\) une issue (élément de \(\Omega\)) : on n'écrit ni \(X \in \mathcal{A}\) ni \(\omega \in \mathcal{A}\).</div>
</div>
</template>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Dénombrabilité</h3>
  <div class="statement">Montrer que les ensembles suivants sont dénombrables, en donnant chaque fois une bijection explicite avec \(\mathbb{N}\) ou avec un ensemble dont la dénombrabilité est au programme.</div>
  <div class="q"><strong>Q1.</strong> \(\mathbb{Z}\).</div>
  <div class="q"><strong>Q2.</strong> \(\mathbb{N} \times \mathbb{N}\).</div>
  <div class="q"><strong>Q3.</strong> \(\mathbb{Z} \times \mathbb{N}^*\).</div>
  <div class="q"><strong>Q4.</strong> \(E = \{3k + 1,\ k \in \mathbb{Z}\}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'application \(\psi\) définie par \(\psi(m) = 2m\) si \(m \geq 0\) et \(\psi(m) = -2m - 1\) si \(m \lt 0\) envoie les entiers positifs sur les pairs et les négatifs sur les impairs ; sa réciproque est \(n \mapsto n/2\) (\(n\) pair), \(n \mapsto -(n+1)/2\) (\(n\) impair). C'est une bijection de \(\mathbb{Z}\) sur \(\mathbb{N}\), qui range \(\mathbb{Z}\) dans l'ordre \(0, -1, 1, -2, 2, \ldots\) L'ordre \(0, 1, -1, 2, -2, \ldots\) convient aussi (\(m \mapsto 2m - 1\) pour \(m \gt 0\), \(m \mapsto -2m\) pour \(m \leq 0\)).</p>
    <p><strong>Q2.</strong> \(f(p, q) = 2^p(2q + 1) - 1\) est une bijection de \(\mathbb{N}^2\) sur \(\mathbb{N}\) : tout entier \(N + 1 \geq 1\) s'écrit de façon unique \(2^p r\) avec \(r = 2q + 1\) impair. C'est le cas particulier du résultat du programme : un produit de deux ensembles dénombrables est dénombrable.</p>
    <p><strong>Q3.</strong> \((a, b) \mapsto \big(\psi(a), b - 1\big)\) est une bijection de \(\mathbb{Z} \times \mathbb{N}^*\) sur \(\mathbb{N}^2\) (réciproque \((m, n) \mapsto (\psi^{-1}(m), n + 1)\)). En la composant avec \(f\), \(g(a, b) = 2^{\psi(a)}(2b - 1) - 1\) est une bijection de \(\mathbb{Z} \times \mathbb{N}^*\) sur \(\mathbb{N}\).</p>
    <p><strong>Q4.</strong> \(k \mapsto 3k + 1\) est une bijection de \(\mathbb{Z}\) sur \(E\), de réciproque \(x \mapsto (x - 1)/3\). Composée avec \(\psi\), elle montre que \(E\) est dénombrable : \(x \mapsto \psi\big((x - 1)/3\big)\) est une bijection de \(E\) sur \(\mathbb{N}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Stabilités d'une tribu</h3>
  <div class="statement">Soit \(\mathcal{A}\) une tribu sur \(\Omega\), \(A\) et \(B\) deux événements et \((A_n)_{n \in \mathbb{N}}\) une suite d'événements. On n'utilise que les trois axiomes de la définition.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\bigcap_{n} A_n \in \mathcal{A}\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(A \setminus B\) et \(A \,\Delta\, B = (A \setminus B) \cup (B \setminus A)\) sont des événements. Que signifie la réalisation de \(A \,\Delta\, B\) ?</div>
  <div class="q"><strong>Q3.</strong> Montrer que « exactement un des \(A_n\) se réalise » et « au moins deux des \(A_n\) se réalisent » sont des événements.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Par De Morgan, \(\bigcap_n A_n = \overline{\bigcup_n \overline{A_n}}\). Chaque \(\overline{A_n}\) est dans \(\mathcal{A}\) (complémentaire), leur réunion aussi (réunion dénombrable), puis son complémentaire : \(\bigcap_n A_n \in \mathcal{A}\).</p>
    <p><strong>Q2.</strong> \(A \setminus B = A \cap \overline{B}\) est l'intersection de deux événements (Q1 appliqué à la suite \(A, \overline{B}, \Omega, \Omega, \ldots\)) : c'est un événement. \(A \,\Delta\, B\) est alors la réunion de deux événements (suite \(A \setminus B, B \setminus A, \varnothing, \varnothing, \ldots\)). Il se réalise lorsqu'<strong>un seul</strong> des deux événements \(A\), \(B\) se réalise.</p>
    <p><strong>Q3.</strong> « Exactement un » : il existe \(n\) tel que \(A_n\) se réalise et, pour tout \(k \neq n\), \(A_k\) ne se réalise pas, soit</p>
    <div class="formula">$$\bigcup_{n \in \mathbb{N}} \Big(A_n \cap \bigcap_{k \neq n} \overline{A_k}\Big),$$</div>
    <p>réunion dénombrable d'intersections dénombrables d'événements : c'est un événement. « Au moins deux » : il existe \(m \lt n\) tels que \(A_m\) et \(A_n\) se réalisent, soit \(\bigcup_{m \lt n} (A_m \cap A_n)\). L'ensemble des indices \(\{(m, n) \in \mathbb{N}^2,\ m \lt n\}\) est une partie infinie de \(\mathbb{N}^2\), dénombrable : on peut ranger ces couples en une suite \((m_j, n_j)_{j \in \mathbb{N}}\), et la réunion est celle de la suite d'événements \((A_{m_j} \cap A_{n_j})_j\), qui est dans \(\mathcal{A}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Tribus sur l'univers d'un dé</h3>
  <div class="statement">On lance un dé : \(\Omega = \{1, 2, 3, 4, 5, 6\}\).</div>
  <div class="q"><strong>Q1.</strong> \(\mathcal{A}_1 = \{\varnothing, \{1, 3, 5\}, \{2, 4, 6\}, \Omega\}\) est-elle une tribu ? Quel observateur décrit-elle ?</div>
  <div class="q"><strong>Q2.</strong> Même question pour la famille \(\mathcal{A}_2\) formée de \(\varnothing\), \(\{6\}\), \(\{1, \ldots, 5\}\), \(\{1, 2, 3\}\), \(\{4, 5, 6\}\) et \(\Omega\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(\mathcal{A}\) une tribu contenant \(\{6\}\) et \(\{1, 2, 3\}\). Montrer que \(\{4, 5\} \in \mathcal{A}\), puis que \(\mathcal{A}\) contient les huit réunions de parties de la famille \(\{1, 2, 3\}\), \(\{4, 5\}\), \(\{6\}\). Montrer que ces huit parties forment une tribu.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Oui : \(\Omega \in \mathcal{A}_1\) ; le complémentaire échange \(\varnothing\) et \(\Omega\), ainsi que les deux blocs ; une réunion d'éléments de \(\mathcal{A}_1\) vaut \(\varnothing\), un bloc, ou \(\Omega\) (dès qu'elle contient les deux blocs ou \(\Omega\)). C'est la tribu d'un observateur qui ne connaît que la <strong>parité</strong> du résultat.</p>
    <p><strong>Q2.</strong> \(\mathcal{A}_2\) est stable par complémentaire (\(\{6\} \leftrightarrow \{1, \ldots, 5\}\), \(\{1, 2, 3\} \leftrightarrow \{4, 5, 6\}\)), mais \(\{6\} \cup \{1, 2, 3\} = \{1, 2, 3, 6\} \notin \mathcal{A}_2\) : ce n'est pas une tribu.</p>
    <p><strong>Q3.</strong> \(\mathcal{A}\) contient \(\{1, 2, 3\} \cup \{6\}\), donc son complémentaire \(\{4, 5\}\). Les trois « blocs » \(B_1 = \{1, 2, 3\}\), \(B_2 = \{4, 5\}\), \(B_3 = \{6\}\) sont dans \(\mathcal{A}\), donc toutes leurs réunions aussi : \(\varnothing\), \(B_1\), \(B_2\), \(B_3\), \(B_1 \cup B_2\), \(B_1 \cup B_3\), \(B_2 \cup B_3\), \(\Omega\) (\(2^3 = 8\) parties). Réciproquement, cette famille \(\mathcal{F}\) est une tribu : elle contient \(\Omega\) ; le complémentaire d'une réunion de blocs est la réunion des blocs restants ; une réunion (finie, puisque \(\mathcal{F}\) est finie) de réunions de blocs est une réunion de blocs. C'est donc la plus petite tribu contenant \(\{6\}\) et \(\{1, 2, 3\}\) : celle d'un observateur qui sait seulement si le résultat vaut au plus 3, 4 ou 5, ou 6.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Numéroter les couples par diagonales</h3>
  <div class="statement">Pour \((p, q) \in \mathbb{N}^2\), on pose \(s = p + q\), \(t_s = \dfrac{s(s+1)}{2}\) et \(c(p, q) = t_s + q\). On veut montrer que \(c\) est une bijection de \(\mathbb{N}^2\) sur \(\mathbb{N}\) (c'est la numérotation de la figure du §2).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(c(p, q)\) pour les six couples tels que \(p + q \leq 2\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que les couples de la diagonale \(p + q = s\) reçoivent exactement les numéros \(t_s, t_s + 1, \ldots, t_{s+1} - 1\).</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(c\) est une bijection de \(\mathbb{N}^2\) sur \(\mathbb{N}\).</div>
  <div class="q"><strong>Q4.</strong> Quel est le numéro de \((7, 5)\) ? Quel couple porte le numéro 100 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(c(0, 0) = 0\) ; \(c(1, 0) = 1\), \(c(0, 1) = 2\) ; \(c(2, 0) = 3\), \(c(1, 1) = 4\), \(c(0, 2) = 5\). On retrouve l'ordre de la figure : chaque diagonale est parcourue de \((s, 0)\) à \((0, s)\).</p>
    <p><strong>Q2.</strong> Sur la diagonale \(p + q = s\), \(q\) prend les valeurs \(0, 1, \ldots, s\) (et \(p = s - q\)), donc les numéros sont \(t_s + q\) pour \(0 \leq q \leq s\) : tous les entiers de \(t_s\) à \(t_s + s\). Or \(t_{s+1} - t_s = s + 1\), d'où \(t_s + s = t_{s+1} - 1\).</p>
    <p><strong>Q3.</strong> La suite \((t_s)\) est strictement croissante, \(t_0 = 0\) et \(t_s \to +\infty\) : les intervalles d'entiers \(I_s = [\![t_s, t_{s+1} - 1]\!]\) sont deux à deux disjoints et recouvrent \(\mathbb{N}\). Soit \(N \in \mathbb{N}\) : il appartient à un unique \(I_s\) ; d'après Q2, son seul antécédent possible est sur la diagonale \(s\), avec \(q = N - t_s \in [\![0, s]\!]\) et \(p = s - q\). Tout \(N\) a donc exactement un antécédent : \(c\) est bijective.</p>
    <p><strong>Q4.</strong> \((7, 5)\) : \(s = 12\), \(t_{12} = 78\), d'où \(c(7, 5) = 83\). Pour 100 : \(t_{13} = 91 \leq 100 \lt t_{14} = 105\), donc \(s = 13\), \(q = 100 - 91 = 9\) et \(p = 4\) ; contrôle \(c(4, 9) = 91 + 9 = 100\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Un dé lancé indéfiniment : des mots aux ensembles</h3>
  <div class="statement">On lance un dé indéfiniment et l'on note, pour \(n \geq 1\), \(S_n\) l'événement « le \(n\)-ième lancer donne 6 ». Écrire les événements suivants à l'aide des \(S_n\) et de leurs contraires (on justifiera ainsi que ce sont des événements).</div>
  <div class="q"><strong>Q1.</strong> \(E_1\) : « au moins un 6 lors des dix premiers lancers » ; \(E_2\) : « aucun 6 après le dixième lancer ».</div>
  <div class="q"><strong>Q2.</strong> \(E_3\) : « un 6 sort, mais pas avant le onzième lancer ».</div>
  <div class="q"><strong>Q3.</strong> \(E_4\) : « exactement un 6 » ; \(E_5\) : « au moins deux 6 ».</div>
  <div class="q"><strong>Q4.</strong> \(E_6\) : « une infinité de 6 » ; \(E_7\) : « un nombre fini de 6 (peut-être aucun) ».</div>
  <div class="q"><strong>Q5.</strong> \(E_8\) : « au moins une fois deux 6 consécutifs » ; \(E_9\) : « à partir d'un certain rang, plus jamais deux 6 consécutifs ».</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(E_1 = \bigcup_{k=1}^{10} S_k\) (« il existe \(k \leq 10\) ») ; \(E_2 = \bigcap_{k \geq 11} \overline{S_k}\) (« pour tout \(k \geq 11\) »).</p>
    <p><strong>Q2.</strong> Aucun 6 lors des dix premiers lancers, et il existe un rang \(k \geq 11\) donnant 6 :</p>
    <div class="formula">$$E_3 = \Big(\bigcap_{k=1}^{10} \overline{S_k}\Big) \cap \Big(\bigcup_{k \geq 11} S_k\Big).$$</div>
    <p>On peut aussi écrire \(E_3 = \overline{E_1} \cap \overline{E_2}\).</p>
    <p><strong>Q3.</strong> Il existe un rang \(n\) qui donne 6, et aucun autre :</p>
    <div class="formula">$$E_4 = \bigcup_{n \geq 1} \Big(S_n \cap \bigcap_{k \neq n} \overline{S_k}\Big),$$</div>
    <p>réunion d'événements deux à deux incompatibles. \(E_5 = \bigcup_{1 \leq m \lt n} (S_m \cap S_n)\), réunion indexée par une partie de \(\mathbb{N}^2\), donc dénombrable.</p>
    <p><strong>Q4.</strong> \(E_6 = \bigcap_{N \geq 1} \bigcup_{n \geq N} S_n\) (au-delà de tout rang, il y a encore un 6) ; \(E_7 = \overline{E_6} = \bigcup_{N \geq 1} \bigcap_{n \geq N} \overline{S_n}\) (à partir d'un certain rang, plus de 6).</p>
    <p><strong>Q5.</strong> \(E_8 = \bigcup_{n \geq 1} (S_n \cap S_{n+1})\). \(E_9\) : il existe \(N\) tel que, pour tout \(n \geq N\), les lancers \(n\) et \(n + 1\) ne donnent pas tous deux 6 :</p>
    <div class="formula">$$E_9 = \bigcup_{N \geq 1} \bigcap_{n \geq N} \big(\overline{S_n} \cup \overline{S_{n+1}}\big).$$</div>
    <p>C'est le contraire de « deux 6 consécutifs une infinité de fois ».</p>
    <p>Chaque écriture n'utilise que des réunions et intersections finies ou dénombrables d'événements et des contraires : ce sont des événements.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Lire des événements du pile ou face infini</h3>
  <div class="statement">Une pièce est lancée indéfiniment ; \(P_n\) : « pile au \(n\)-ième lancer », \(F_n = \overline{P_n}\). Décrire en mots les événements suivants.
    <div class="formula">$$\begin{aligned} G_1 &= \bigcup_{n \geq 1} (P_n \cap P_{n+1} \cap P_{n+2}), \\ G_2 &= \bigcap_{n \geq 1} (P_n \cup P_{n+1}), \\ G_3 &= \bigcup_{N \geq 1} \bigcap_{n \geq N} (P_n \cup P_{n+1}), \\ G_4 &= \bigcap_{k \geq 1} (F_{2k-1} \cup P_{2k}). \end{aligned}$$</div>
  </div>
  <div class="q"><strong>Q1.</strong> Interpréter \(G_1\), \(G_2\), \(G_3\) et \(G_4\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(G_2 \subset G_3\) et donner une issue de \(G_3\) qui n'est pas dans \(G_2\).</div>
  <div class="q"><strong>Q3.</strong> Donner une issue de \(G_2\) qui n'est pas dans \(G_4\), et une issue de \(G_4\) qui n'est pas dans \(G_2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(G_1\) : il existe un rang \(n\) tel que les lancers \(n\), \(n + 1\) et \(n + 2\) donnent pile, c'est-à-dire « au moins une fois trois piles de suite ». \(G_2\) : pour tout \(n\), le lancer \(n\) ou le lancer \(n + 1\) donne pile : « jamais deux faces consécutives ». \(G_3\) : « à partir d'un certain rang, jamais deux faces consécutives », soit encore « deux faces consécutives ne se produisent qu'un nombre fini de fois ». \(G_4\) : \(F_{2k-1} \cup P_{2k}\) traduit l'implication « si le lancer \(2k - 1\) donne pile, alors le lancer \(2k\) aussi » ; \(G_4\) : « chaque pile obtenu à un rang impair est suivi d'un pile ».</p>
    <p><strong>Q2.</strong> \(G_2\) est le terme \(N = 1\) de la réunion qui définit \(G_3\) : \(G_2 \subset G_3\). L'issue \(\mathrm{FFPPP}\ldots\) (deux faces puis que des piles) est dans \(G_3\) (prendre \(N = 2\)) mais pas dans \(G_2\) (\(n = 1\) donne deux faces).</p>
    <p><strong>Q3.</strong> \(\mathrm{PFPFPF}\ldots\) n'a jamais deux faces de suite : elle est dans \(G_2\) ; mais le pile du rang 1 (impair) est suivi d'une face : elle n'est pas dans \(G_4\). À l'inverse, \(\mathrm{FFFF}\ldots\) est dans \(G_4\) (aucun pile à un rang impair, l'implication est vraie à chaque \(k\)) et pas dans \(G_2\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Variables aléatoires du pile ou face infini</h3>
  <div class="statement">Avec les notations de l'exercice précédent, on note \(N_n\) le nombre de piles obtenus lors des \(n\) premiers lancers (\(N_0 = 0\)), \(T_1\) le rang du premier pile et \(T_2\) celui du deuxième pile, avec la convention \(T_1 = 0\) (resp. \(T_2 = 0\)) s'il y a moins d'un (resp. de deux) piles.</div>
  <div class="q"><strong>Q1.</strong> Pour \(0 \leq k \leq n\), écrire \((N_n = k)\) à l'aide des \(P_i\) et des \(F_i\). En déduire que \(N_n\) est une variable aléatoire discrète.</div>
  <div class="q"><strong>Q2.</strong> Pour \(n \geq 1\), exprimer \((T_1 = n)\) à l'aide de \(N_{n-1}\) et de \(P_n\) ; pour \(n \geq 2\), exprimer de même \((T_2 = n)\). En déduire que \(T_1\) et \(T_2\) sont des variables aléatoires discrètes.</div>
  <div class="q"><strong>Q3.</strong> Écrire avec \(T_2\) l'événement « au moins deux piles lors des \(n\) premiers lancers ». Pourquoi n'est-ce pas \((T_2 \leq n)\) ?</div>
  <div class="q"><strong>Q4.</strong> Écrire l'événement « les deux premiers piles sont consécutifs » à l'aide de \(T_1\) et des \(P_k\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(N_n = k\) signifie que les piles des \(n\) premiers lancers occupent exactement un ensemble \(K\) de \(k\) rangs :</p>
    <div class="formula">$$(N_n = k) = \bigcup_{\substack{K \subset [\![1, n]\!] \\ \mathrm{card}\, K = k}} \Big(\bigcap_{i \in K} P_i \cap \bigcap_{i \in [\![1, n]\!] \setminus K} F_i\Big),$$</div>
    <p>réunion de \(\binom{n}{k}\) intersections finies : c'est un événement. Comme \(N_n(\Omega) \subset [\![0, n]\!]\) est fini, \(N_n\) est une variable aléatoire discrète.</p>
    <p><strong>Q2.</strong> Le premier pile sort au rang \(n\) si et seulement s'il n'y a aucun pile avant et un pile au rang \(n\) : \((T_1 = n) = (N_{n-1} = 0) \cap P_n\). De même, \((T_2 = n) = (N_{n-1} = 1) \cap P_n\) pour \(n \geq 2\). Ce sont des événements, et \((T_1 = 0)\) (resp. \((T_2 = 0)\)) est le contraire de la réunion dénombrable des \((T_1 = n)\), \(n \geq 1\) (resp. des \((T_2 = n)\), \(n \geq 2\)). Les deux variables sont à valeurs dans \(\mathbb{N}\) : ce sont des variables aléatoires discrètes.</p>
    <p><strong>Q3.</strong> Au moins deux piles parmi les \(n\) premiers lancers si et seulement si le deuxième pile est sorti au plus tard au rang \(n\) : c'est \((2 \leq T_2 \leq n) = (N_n \geq 2)\). L'événement \((T_2 \leq n)\) contient en plus \((T_2 = 0)\), qui regroupe des issues ayant au plus un pile : la valeur conventionnelle 0 ne doit pas être comptée.</p>
    <p><strong>Q4.</strong> Il existe \(k\) tel que le premier pile sorte au rang \(k\) et le lancer \(k + 1\) donne pile : \(\bigcup_{k \geq 1} \big((T_1 = k) \cap P_{k+1}\big)\), réunion d'événements deux à deux incompatibles. C'est aussi \(\bigcup_{k \geq 1} \big((T_1 = k) \cap (T_2 = k + 1)\big)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Les parties finies de \(\mathbb{N}\) et l'écriture binaire</h3>
  <div class="statement">On note \(\mathcal{F}\) l'ensemble des parties <strong>finies</strong> de \(\mathbb{N}\) et, pour \(A \in \mathcal{F}\), \(\sigma(A) = \sum_{a \in A} 2^a\) (avec \(\sigma(\varnothing) = 0\)).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\sigma(\{0, 2, 3\})\). Trouver \(A \in \mathcal{F}\) tel que \(\sigma(A) = 100\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\sigma\) est surjective sur \(\mathbb{N}\) (raisonner par récurrence forte en retirant de \(N \geq 1\) la plus grande puissance de 2 qui ne le dépasse pas).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\sigma\) est injective. En déduire que \(\mathcal{F}\) est dénombrable.</div>
  <div class="q"><strong>Q4.</strong> Pile ou face infini : montrer que l'ensemble \(D\) des suites qui ne comportent qu'un nombre fini de piles est dénombrable, et que c'est un événement.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\sigma(\{0, 2, 3\}) = 1 + 4 + 8 = 13\). \(100 = 64 + 32 + 4 = 2^6 + 2^5 + 2^2\), donc \(A = \{2, 5, 6\}\) convient.</p>
    <p><strong>Q2.</strong> \(0 = \sigma(\varnothing)\). Soit \(N \geq 1\) ; supposons tout entier \(M \lt N\) atteint. Soit \(a\) le plus grand entier tel que \(2^a \leq N\) : alors \(N \lt 2^{a+1}\), donc \(M = N - 2^a \lt 2^a\). Par hypothèse, \(M = \sigma(B)\) avec \(B\) fini ; comme \(\sigma(B) \lt 2^a\), aucun élément de \(B\) n'est supérieur ou égal à \(a\) (un tel élément \(b\) donnerait \(\sigma(B) \geq 2^b \geq 2^a\)). Donc \(a \notin B\) et \(N = \sigma(B \cup \{a\})\).</p>
    <p><strong>Q3.</strong> Soit \(A \neq B\) dans \(\mathcal{F}\). La différence symétrique \(A \,\Delta\, B\) est finie non vide ; soit \(a\) son plus grand élément, par exemple \(a \in A \setminus B\). Les éléments communs à \(A\) et \(B\) contribuent autant aux deux sommes ; ceux de \(A \setminus B\) donnent au moins \(2^a\), ceux de \(B \setminus A\), tous inférieurs à \(a\), au plus \(2^0 + \cdots + 2^{a-1} = 2^a - 1\). Donc \(\sigma(A) - \sigma(B) \geq 2^a - (2^a - 1) = 1\) : \(\sigma(A) \neq \sigma(B)\). Ainsi \(\sigma\) est une bijection de \(\mathcal{F}\) sur \(\mathbb{N}\) : \(\mathcal{F}\) est dénombrable (c'est l'écriture des entiers en base 2).</p>
    <p><strong>Q4.</strong> À une suite \(\omega\) de \(D\), associons l'ensemble fini \(A_\omega = \{n - 1,\ \omega_n = \mathrm{P}\}\) (rangs des piles, décalés de 1). L'application \(\omega \mapsto A_\omega\) est injective (on relit \(\omega\) sur \(A_\omega\)) et surjective sur \(\mathcal{F}\) (toute partie finie de \(\mathbb{N}\) donne une suite avec ces piles et des faces ailleurs, qui est dans \(D\)) : \(D\) est en bijection avec \(\mathcal{F}\), donc dénombrable. C'est aussi l'événement « à partir d'un certain rang, que des faces » : \(D = \bigcup_{N \geq 1} \bigcap_{n \geq N} F_n\). À l'inverse, l'univers \(\{\mathrm{P}, \mathrm{F}\}^{\mathbb{N}^*}\) tout entier n'est pas dénombrable (résultat hors programme).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Dénombrabilité de ℚ, événements limites et nombre de piles</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : dénombrabilité, stabilités d'une tribu, traduction d'événements du pile ou face infini, variable aléatoire discrète). La partie B prépare le lemme de Borel-Cantelli (hors programme).</div>
  <div class="statement">Les parties A et B sont indépendantes ; la partie C utilise la question B1. Dans la partie B, \(\mathcal{A}\) est une tribu sur un univers \(\Omega\) ; dans les questions B3 et C, \(\Omega\) est l'univers du pile ou face infini, muni d'une tribu \(\mathcal{A}\) qui contient les événements \(P_n\) : « pile au \(n\)-ième lancer » (\(n \geq 1\)), et \(F_n = \overline{P_n}\).</div>

  <p class="exo-part">Partie A — ℚ est dénombrable, les irrationnels ne le sont pas</p>
  <div class="q"><strong>A1.</strong> Soit \(E\) un ensemble dénombrable et \(B\) une partie infinie de \(E\). Montrer que \(B\) est dénombrable.</div>
  <div class="q"><strong>A2.</strong> On admet que tout rationnel \(r\) s'écrit de façon unique \(r = p/q\) avec \(p \in \mathbb{Z}\), \(q \in \mathbb{N}^*\), \(p\) et \(q\) premiers entre eux. Montrer que \(\mathbb{Q}\) est dénombrable.</div>
  <div class="q"><strong>A3.</strong> Soit \(E\) dénombrable et \(F\) au plus dénombrable, disjoints. Montrer que \(E \cup F\) est dénombrable.</div>
  <div class="q"><strong>A4.</strong> On admet que \(\mathbb{R}\) n'est pas dénombrable (résultat hors programme). Montrer que \(\mathbb{R} \setminus \mathbb{Q}\) n'est pas au plus dénombrable.</div>

  <p class="exo-part">Partie B — Limites supérieure et inférieure d'une suite d'événements</p>
  <div class="q"><strong>B1.</strong> Soit \((A_n)_{n \in \mathbb{N}}\) une suite d'événements. Montrer que \(\displaystyle L^+ = \bigcap_{N \in \mathbb{N}} \bigcup_{n \geq N} A_n\) et \(\displaystyle L^- = \bigcup_{N \in \mathbb{N}} \bigcap_{n \geq N} A_n\) sont des événements, et interpréter leur réalisation.</div>
  <div class="q"><strong>B2.</strong> Montrer que \(L^- \subset L^+\), et que le contraire de \(L^+\) s'obtient en remplaçant, dans l'écriture de \(L^-\), chaque \(A_n\) par \(\overline{A_n}\).</div>
  <div class="q"><strong>B3.</strong> Pile ou face infini. Interpréter \(L^+\) et \(L^-\) lorsque \(A_n = P_n\). Donner une issue réalisant \(L^+\) mais pas \(L^-\). Écrire l'événement « une infinité de piles et une infinité de faces ».</div>

  <p class="exo-part">Partie C — Le nombre total de piles</p>
  <div class="q"><strong>C1.</strong> On note \(N(\omega)\) le nombre de piles de la suite \(\omega\) s'il est fini, et \(N(\omega) = -1\) s'il y en a une infinité. Montrer que \((N = -1)\) est un événement.</div>
  <div class="q"><strong>C2.</strong> On note \(S_n\) le nombre de piles des \(n\) premiers lancers (\(S_0 = 0\)) ; on admet que les \((S_n = k)\) sont des événements. Montrer que, pour \(k \in \mathbb{N}\) :</div>
  <div class="formula">$$(N = k) = \bigcup_{n \geq k} \Big((S_n = k) \cap \bigcap_{m \gt n} F_m\Big).$$</div>
  <div class="q">En déduire que \(N\) est une variable aléatoire discrète.</div>
  <div class="q"><strong>C3.</strong> Écrire à l'aide de \(N\) l'événement « le nombre de piles est fini et pair », puis l'événement « au moins 3 piles ».</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> Soit \(\alpha : E \to \mathbb{N}\) une bijection. \(\alpha(B)\) est une partie de \(\mathbb{N}\), infinie car \(\alpha\) est injective et \(B\) infini : elle est dénombrable (parties de \(\mathbb{N}\)), et \(\alpha\) restreinte à \(B\) est une bijection de \(B\) sur \(\alpha(B)\). En composant, \(B\) est en bijection avec \(\mathbb{N}\).</p>
    <p><strong>A2.</strong> L'application \(r \mapsto (p, q)\) (forme irréductible) est une injection de \(\mathbb{Q}\) dans \(\mathbb{Z} \times \mathbb{N}^*\), dénombrable (produit de deux ensembles dénombrables). Son image \(B\) est infinie (elle contient les \((n, 1)\), \(n \in \mathbb{Z}\)) : \(B\) est dénombrable (A1) et \(\mathbb{Q}\) est en bijection avec \(B\). Donc \(\mathbb{Q}\) est dénombrable.</p>
    <p><strong>A3.</strong> Soit \(\alpha : E \to \mathbb{N}\) bijective. Si \(F\) est dénombrable, avec \(\beta : F \to \mathbb{N}\) bijective, on pose \(h(x) = 2\alpha(x)\) sur \(E\) et \(h(y) = 2\beta(y) + 1\) sur \(F\) : comme pour \(\mathbb{Z}\), \(h\) est une bijection de \(E \cup F\) sur \(\mathbb{N}\) (les pairs viennent de \(E\), les impairs de \(F\)). Si \(F = \{y_0, \ldots, y_{m-1}\}\) est fini (éléments distincts), on pose \(h(y_j) = j\) et \(h(x) = \alpha(x) + m\) sur \(E\) : \(h\) est bijective de \(E \cup F\) sur \(\mathbb{N}\).</p>
    <p><strong>A4.</strong> \(\mathbb{R} = \mathbb{Q} \cup (\mathbb{R} \setminus \mathbb{Q})\), réunion disjointe. Si \(\mathbb{R} \setminus \mathbb{Q}\) était au plus dénombrable, A3 (avec \(E = \mathbb{Q}\), dénombrable d'après A2) rendrait \(\mathbb{R}\) dénombrable, ce qui est faux. Il y a donc « beaucoup plus » d'irrationnels que de rationnels.</p>
    <p><strong>B1.</strong> Pour chaque \(N\), \(\bigcup_{n \geq N} A_n\) est une réunion dénombrable d'événements, donc un événement ; \(L^+\) est l'intersection dénombrable de ces événements : \(L^+ \in \mathcal{A}\). De même, chaque \(\bigcap_{n \geq N} A_n\) est un événement et \(L^-\) est leur réunion. Interprétation : \(\omega \in L^+ \iff \forall N,\ \exists n \geq N,\ \omega \in A_n\), c'est-à-dire « une infinité de \(A_n\) se réalisent » ; \(\omega \in L^- \iff \exists N,\ \forall n \geq N,\ \omega \in A_n\), « les \(A_n\) se réalisent tous à partir d'un certain rang ».</p>
    <p><strong>B2.</strong> Si \(\omega \in L^-\), il existe \(N_0\) tel que \(\omega \in A_n\) pour tout \(n \geq N_0\). Pour tout \(N\), le rang \(n = \max(N, N_0) \geq N\) vérifie \(\omega \in A_n\) : \(\omega \in L^+\). Par De Morgan appliqué deux fois :</p>
    <div class="formula">$$\overline{L^+} = \bigcup_{N} \overline{\bigcup_{n \geq N} A_n} = \bigcup_{N} \bigcap_{n \geq N} \overline{A_n}.$$</div>
    <p>« Pas une infinité de \(A_n\) » équivaut à « à partir d'un certain rang, aucun \(A_n\) ».</p>
    <p><strong>B3.</strong> Avec \(A_n = P_n\) : \(L^+\) est « une infinité de piles », \(L^-\) « que des piles à partir d'un certain rang ». L'issue \(\mathrm{PFPF}\ldots\) réalise \(L^+\) mais pas \(L^-\). « Une infinité de piles et une infinité de faces » s'écrit</p>
    <div class="formula">$$\Big(\bigcap_{N} \bigcup_{n \geq N} P_n\Big) \cap \Big(\bigcap_{N} \bigcup_{n \geq N} F_n\Big),$$</div>
    <p>c'est-à-dire \(L^+ \cap \overline{L^-}\) : par De Morgan, comme en B2, le contraire de « que des piles à partir d'un certain rang » est « une infinité de faces ».</p>
    <p><strong>C1.</strong> \((N = -1)\) est « une infinité de piles », soit \(\bigcap_{N \geq 1} \bigcup_{n \geq N} P_n\) : un événement (B1).</p>
    <p><strong>C2.</strong> Si \(N(\omega) = k \in \mathbb{N}\), la suite \(\omega\) n'a que \(k\) piles ; soit \(n\) le rang du dernier d'entre eux (\(n = 0\) si \(k = 0\)) : \(n \geq k\), \(S_n(\omega) = k\) et tous les lancers de rang \(m \gt n\) donnent face. Réciproquement, si \(S_n(\omega) = k\) et \(\omega\) n'a que des faces après le rang \(n\), elle a exactement \(k\) piles. D'où l'égalité. Le membre de droite est une réunion dénombrable d'intersections dénombrables d'événements : \((N = k)\) est un événement. Enfin \(N(\Omega) \subset \mathbb{N} \cup \{-1\}\), au plus dénombrable : \(N\) est une variable aléatoire discrète.</p>
    <p><strong>C3.</strong> « Fini et pair » : \(\bigcup_{j \in \mathbb{N}} (N = 2j)\) ; la valeur conventionnelle \(-1\) n'en fait pas partie. « Au moins 3 piles » : \((N \geq 3) \cup (N = -1)\), car une infinité de piles en compte au moins 3 alors que \(-1 \lt 3\) ; c'est aussi \(\bigcup_{n \geq 3} (S_n \geq 3)\).</p>
  </div>
</div>
</div>
</template>
