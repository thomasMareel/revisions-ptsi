      <div class="sec-num">§1 · LES PHRASES PASSE-PARTOUT</div>
      <h2>Les usuels de la colle d'anglais</h2>
      <div class="intro">Ces formulations reviennent à <strong>chaque</strong> colle, quel que soit le document. Les automatiser fait gagner un temps précieux et structure l'oral. À mémoriser via les flashcards (dont les cartes « 3 façons de dire… »).</div>
      <div class="prop-box"><strong>Présenter le document</strong>
        <ul style="margin-top:.3rem">
          <li>This article, <em>taken from / published in</em> The Guardian, <em>deals with / focuses on / is concerned with</em>…</li>
          <li>The document under study is <em>a press article / a cartoon / an extract from</em>…</li>
          <li>It <em>was written by</em> … and <em>was published in</em> 2023.</li>
        </ul>
      </div>
      <div class="prop-box"><strong>Annoncer un plan / structurer</strong>
        <ul style="margin-top:.3rem">
          <li>First(ly)… Then / Secondly… Finally / Lastly…</li>
          <li>I will first <em>deal with</em> … before <em>turning to</em> …</li>
          <li>On the one hand… on the other hand…</li>
        </ul>
      </div>
      <div class="prop-box"><strong>Conclure</strong>
        <ul style="margin-top:.3rem">
          <li>To sum up / All in all / On the whole, …</li>
          <li>This raises the question of whether…</li>
          <li>One might wonder <em>to what extent</em> …</li>
        </ul>
      </div>
      <div class="notice">Réflexe utile pour gagner du temps : <em>« What this article shows is that… »</em>, <em>« The key point here is that… »</em>.</div>
    </div>
  </template>
