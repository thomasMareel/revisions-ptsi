  <div class="prop-box"><strong>Lien avec la cotation</strong> : quand le dessin définit un système de références A | B | C, faire coïncider les appuis avec lui (A → appui plan 1-2-3, B → orientation 4-5, C → butée 6) permet d'obtenir chaque cote <strong>telle qu'elle est spécifiée</strong>. Si l'on s'appuie ailleurs, il faut un <strong>transfert de cotes</strong>, qui resserre les tolérances à tenir en fabrication. Le <strong>serrage</strong> (maintien) vient ensuite, dirigé vers les appuis et au droit de ceux-ci, pour plaquer la pièce sans la faire bouger ni la fléchir.</div>
  <div class="def-box"><strong>Porte-pièces</strong> : en fraisage, l'<strong>étau</strong> (la semelle et le mors fixe font office d'appuis) ; en tournage, le <strong>mandrin</strong> à trois mors (centrage court ou long selon la longueur serrée, avec un appui sur une face) ou la <strong>pince</strong> pour les barres ; le <strong>plateau magnétique</strong> pour les pièces plates en acier. Des mors striés en acier traité « mordent » dans une surface brute ; des mors en métal tendre, usinés sur place à la forme de la pièce, tiennent une surface déjà finie sans la marquer. Au-delà des moyens standard, on construit un <strong>montage</strong> : assemblé à partir d'éléments du commerce réutilisables quand la série est courte, entièrement spécifique (mécanosoudé, avec serrage rapide) quand la série justifie l'investissement.</div>

  <h3>Génération des surfaces par enlèvement de matière</h3>
  <p>Une machine-outil n'« imprime » pas une surface : elle l'<strong>engendre</strong> en combinant la forme de l'arête de l'outil et les mouvements relatifs de l'outil et de la pièce.</p>
  <div class="def-box">
    Le <strong>mouvement de coupe</strong> est le mouvement le plus rapide : il forme le copeau et absorbe presque toute la puissance (vitesse de coupe \(V_c\)). Le <strong>mouvement d'avance</strong>, lent, amène de la matière nouvelle devant l'arête (vitesse d'avance \(V_f\)). Une surface est l'ensemble des positions d'une ligne, la <strong>génératrice</strong>, qui se déplace en s'appuyant sur une autre ligne, la <strong>directrice</strong>.
  </div>
  <div class="prop-box">
    <strong>Deux modes de génération.</strong>
    <ul style="margin:.3rem 0">
      <li><strong>Travail de forme</strong> : la génératrice est la forme même de l'arête, reproduite telle quelle (foret, alésoir, outil à gorge en plongée, fraise de forme). La précision de la surface dépend de celle de l'outil ; il faut un outil par forme.</li>
      <li><strong>Travail d'enveloppe</strong> : l'arête ne touche la surface finale qu'en un point (ou sur un petit arc), et c'est la trajectoire de ce point, pilotée par la commande numérique, qui engendre la surface. Des outils standard suffisent pour des formes quelconques ; la précision dépend de la machine.</li>
    </ul>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Procédé</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Mouvement de coupe</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Mouvement d'avance</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Surfaces typiques</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Tournage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rotation de la pièce</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">translation de l'outil (axes X et Z)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">surfaces de révolution : cylindres (chariotage), plans perpendiculaires à l'axe (dressage), cônes, gorges, filetages</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Fraisage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rotation de l'outil (fraise à plusieurs dents)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">translations relatives outil–pièce (et rotations sur 4 ou 5 axes)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">plans (surfaçage), épaulements, rainures, poches, surfaces gauches</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Perçage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rotation de l'outil (ou de la pièce sur un tour)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">translation de l'outil selon son axe</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">trous cylindriques, finis ensuite par alésage ou taraudage</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Rectification</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rotation rapide de la meule</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">translations, et rotation lente de la pièce cylindrique</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">finition de surfaces dures, après trempe (IT 5 à 7)</td></tr>
  </table></div>
  <p>Exemple : en chariotage, la rotation de la pièce fait décrire au bec de l'outil un cercle (directrice) tandis que l'avance le déplace parallèlement à l'axe (génératrice droite) : le cylindre est obtenu en travail d'enveloppe, et son diamètre ne dépend que de la position de l'outil. Une gorge réalisée en plongée avec un outil de la largeur de la gorge est au contraire un travail de forme. Le choix de la machine découle de ces mouvements et des directions d'accès à toutes les surfaces (paragraphe suivant).</p>

  <h3>Axes d'une machine à commande numérique</h3>
  <div class="def-box">La norme repère les mouvements de la machine dans un trièdre direct lié à la pièce. On place d'abord <strong>Z</strong> sur l'axe de rotation de la <strong>broche</strong> (la broche entraîne la pièce sur un tour, l'outil sur une fraiseuse). Parmi les directions perpendiculaires à Z, celle de la plus grande course devient <strong>X</strong> ; sur un tour, c'est la direction radiale, qui fixe le diamètre usiné. <strong>Y</strong> s'en déduit pour que (X, Y, Z) soit direct. Les rotations éventuelles autour de X, Y et Z s'appellent <strong>A</strong>, <strong>B</strong> et <strong>C</strong>. Pour chaque axe, le sens positif est celui qui <strong>écarte l'outil de la pièce</strong> : un déplacement négatif selon Z fait donc pénétrer l'outil dans la matière.</div>
  <div class="prop-box">
    Tour CN : 2 axes (X, Z), plus un axe C et des outils tournants sur un centre de tournage. Fraiseuse ou centre d'usinage 3 axes : X, Y, Z, l'outil garde une orientation fixe par rapport à la pièce. 4 axes : + une rotation (table tournante B sur un centre à broche horizontale, ou axe A). 5 axes : deux rotations, pour les surfaces gauches et pour usiner presque toutes les faces <strong>en une seule prise</strong>.<br>
    <strong>Combien d'axes ?</strong> Autant qu'il en faut pour présenter l'outil selon toutes les <strong>directions d'accès</strong> nécessaires dans une même prise : surfaces toutes accessibles selon une seule direction → 3 axes ; faces réparties autour d'un axe → 4 axes ; faces inclinées ou gauches → 5 axes. Moins de prises, c'est moins de temps et de meilleures positions relatives.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · PUISSANCE DE COUPE ET CAPACITÉ D'UN PROCÉDÉ</div>
  <h2>La machine peut-elle usiner ? Le procédé peut-il respecter la tolérance ?</h2>
  <div class="intro">Deux vérifications quantitatives accompagnent le choix d'une opération d'usinage : la <strong>puissance</strong> demandée à la broche et l'aptitude du procédé à tenir la <strong>tolérance</strong> et l'<strong>état de surface</strong> demandés. (Les notions de base — \(V_c\), \(N\), avance — sont dans le chapitre « Usinage ».) Seule la comparaison des qualités IT et des états de surface accessibles relève du programme ; les calculs d'effort, de puissance et de rugosité théorique de ce paragraphe vont au-delà de l'approche qualitative qu'il impose : un sujet fournirait ces relations.</div>

  <h3>Effort et puissance de coupe</h3>
  <div class="def-box">L'effort de coupe est proportionnel à la section de copeau \(A_D\) ; le coefficient est la <strong>pression spécifique de coupe</strong> \(k_c\) (N/mm²), qui dépend surtout du matériau usiné : ≈ 500 à 1 000 pour les alliages d'aluminium, ≈ 1 000 à 1 400 pour les fontes, ≈ 1 500 à 2 200 pour les aciers non alliés, davantage pour les inox. En tournage, \(A_D = a_p\,f\) (profondeur de passe × avance par tour) :
    <div class="formula">$$F_c = k_c\,A_D = k_c\,a_p\,f \qquad P_c = F_c\,V_c$$</div>
    En fraisage et en perçage, on passe par le <strong>débit de copeaux</strong> \(Q\) (volume enlevé par unité de temps) ; \(f_z\) est l'avance par dent, \(Z\) le nombre de dents, \(a_e\) l'engagement radial :
    <div class="formula">$$V_f = f_z\,Z\,N \qquad Q = a_p\,a_e\,V_f$$ $$P_c = k_c\,Q$$</div>
    En perçage pleine matière au diamètre \(D\) : \(Q = \pi D^2 V_f/4\).
  </div>
  <div class="prop-box">
    <ul style="margin:.3rem 0">
      <li><strong>Unités</strong> : \(V_c\) est donnée en m/min → diviser par 60 pour avoir des watts ; avec \(k_c\) en N/mm² et \(Q\) en cm³/min, \(P_c\,(\text{W}) = k_c\,Q/60\).</li>
      <li>La broche doit fournir \(P_c\) à travers une transmission de rendement \(\eta\) (≈ 0,7 à 0,85) : il faut \(P_{moteur} \geq P_c/\eta\). Le couple à la broche vaut \(C = P_c/\omega = F_c\,D/2\) en tournage.</li>
      <li>C'est surtout en <strong>ébauche</strong> (fortes profondeurs de passe) que la puissance limite ; en finition, la contrainte est la précision.</li>
    </ul>
  </div>

  <h3>Capacité à respecter une tolérance et un état de surface</h3>
  <div class="prop-box">On compare la qualité IT <strong>spécifiée</strong> à celle que le procédé atteint couramment (tableau du §7). Si la spécification est plus serrée, on ajoute une opération de finition : alésage après perçage, rectification après tournage. Ordres de grandeur : ébauche IT 10 à 12, finition à l'outil coupant IT 7 à 8, rectification IT 5 à 6.</div>
  <p>En tournage, le profil laissé par un outil de rayon de bec \(r_\varepsilon\) avançant de \(f\) par tour donne une rugosité théorique :</p>
  <div class="formula">$$R_t \approx \frac{f^2}{8\,r_\varepsilon} \qquad R_a \approx \frac{R_t}{4}$$</div>
  <p>Pour un bel état de surface, on réduit l'avance (effet au carré) ou on augmente le rayon de bec.</p>
  <p>Pour juger si un procédé tient une tolérance de façon durable sur toute une série, l'industrie emploie des indicateurs statistiques de <strong>capabilité</strong> (hors programme, présentés en fin de chapitre).</p>
</div>

<div class="course-section">
  <div class="sec-num">§10 · CONTRÔLE DES PRODUITS</div>
  <h2>Vérifier qu'une pièce respecte sa spécification</h2>
  <div class="intro">Le contrôle ferme la boucle : la spécification géométrique (GPS) dit <strong>ce qui</strong> doit être vérifié, pas <strong>comment</strong>. Le contrôleur choisit un moyen dont la démarche reproduit au mieux la définition de la spécification, avec une incertitude petite devant la tolérance. (Les défauts internes relèvent du chapitre « Contrôle non destructif ».)</div>

  <h3>Rappels GPS utiles au contrôle</h3>
  <div class="def-box">
    <ul style="margin:.3rem 0">
      <li>Le dessin décrit une pièce parfaite (<strong>modèle nominal</strong>), alors que la pièce fabriquée est imparfaite : on la représente par un <strong>skin model</strong>. Spécifier, c'est imposer une ou deux limites à une grandeur, la <strong>caractéristique</strong>, que l'on calcule sur cette pièce réelle.</li>
      <li>Pour passer de la surface réelle à cette grandeur, on enchaîne des <strong>opérations</strong> : isoler la surface concernée (partition), n'en garder qu'un nombre fini de points (extraction), séparer la forme de l'ondulation et de la rugosité (filtrage), lui ajuster une forme parfaite selon un critère (<strong>association</strong> : moindres carrés, minimax de Tchebychev, élément tangent extérieur à la matière…), grouper plusieurs éléments qui travaillent ensemble (collection), puis en déduire axes, plans médians ou intersections (construction).</li>
      <li>La vérification doit reproduire, avec les moyens disponibles, la démarche décrite par la spécification (<strong>dualité</strong>). Par défaut, une tolérance de taille ne limite pas la forme et réciproquement (<strong>indépendance</strong>) ; l'<strong>exigence de l'enveloppe</strong> Ⓔ fait exception : la surface ne doit pas franchir la forme parfaite de taille au maximum de matière.</li>
      <li>Une exigence s'exprime donc soit sur des <strong>tailles</strong> (distances locales entre points en vis-à-vis), soit par une <strong>zone</strong> de tolérance dont les références fixent l'orientation ou la position, soit par un <strong>gabarit</strong> (enveloppe Ⓔ). Détails : chapitre « Cotation &amp; tolérances ».</li>
    </ul>
  </div>

  <h3>Moyens de contrôle</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Moyen</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Ce qu'il fournit</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Résolution typique</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Quand l'employer</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Pied à coulisse</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">une valeur lue directement</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,02 mm au vernier, 0,01 mm en affichage numérique</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">contrôle rapide des cotes peu serrées (IT 11 et au-delà)</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Micromètre (d'extérieur, d'intérieur, de profondeur)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">une valeur lue directement, sous une force de mesure limitée par un cliquet</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,01 mm ; 0,001 mm en numérique</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">tailles serrées : IT 7 à 9 avec un micromètre numérique</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Comparateur (à cadran ou numérique) sur marbre ou sur montage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">l'écart par rapport à une pièce étalon ou à un empilage de cales</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">de 0,01 à 0,001 mm</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">battement, planéité, parallélisme ; tri rapide d'une série</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Rugosimètre à palpeur</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">le profil de la surface et ses paramètres (\(R_a\), \(R_z\)…)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">de l'ordre de 0,01 µm</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">état de surface des portées fonctionnelles</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Calibres à limites (tampon, bague, mâchoire)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">une réponse bon / mauvais, sans valeur numérique</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">—</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">grande série, au pied de la machine</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Machine à mesurer tridimensionnelle (MMT)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">les coordonnées de points palpés, puis un calcul d'éléments associés</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">de l'ordre du µm</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">formes complexes, localisations, systèmes de références</td></tr>
  </table></div>
  <div class="notice"><strong>Règle pratique</strong> : l'incertitude de mesure doit rester petite devant l'intervalle de tolérance — de l'ordre de \(IT/10\) au plus. Sinon, la zone dans laquelle on peut déclarer la pièce conforme se réduit d'autant.</div>

  <h3>Calibres à limites</h3>
  <div class="def-box">
    <ul style="margin:.3rem 0">
      <li><strong>Alésage</strong> \(\varnothing\) entre \(D_{min}\) et \(D_{max}\) : <strong>tampon lisse</strong>. Le côté <strong>ENTRE</strong> (\(D_{min}\), maximum de matière) doit entrer sur toute la longueur ; le côté <strong>N'ENTRE PAS</strong> (\(D_{max}\)) ne doit pas entrer.</li>
      <li><strong>Arbre</strong> \(\varnothing\) entre \(d_{min}\) et \(d_{max}\) : <strong>bague</strong> ou <strong>mâchoire</strong>. Côté ENTRE = \(d_{max}\) ; côté N'ENTRE PAS = \(d_{min}\).</li>
      <li>Le côté ENTRE, de forme complète, vérifie l'enveloppe au maximum de matière (cohérent avec Ⓔ) ; le côté N'ENTRE PAS, qui ne touche qu'en quelques points, vérifie la taille locale (principe de Taylor).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Diamètres du tampon lisse pour un alésage \(\varnothing\) 20 H7 (IT 7 = 21 µm entre 18 et 30 mm) ?</span>
    <div class="content"><p>Position H : écart inférieur nul. L'alésage est compris entre 20,000 et 20,021 mm. Tampon : côté ENTRE \(\varnothing\) 20,000 mm, côté N'ENTRE PAS \(\varnothing\) 20,021 mm (aux tolérances de fabrication du calibre près).</p></div>
  </div>

  <h3>Machine à mesurer tridimensionnelle</h3>
  <div class="prop-box">
    <ol style="margin:.3rem 0">
      <li><strong>Repère pièce</strong> : palper les surfaces de référence, leur associer des éléments idéaux et construire le système de références (primaire, secondaire, tertiaire).</li>
      <li><strong>Palper</strong> les éléments tolérancés avec un nombre de points suffisant et bien répartis.</li>
      <li><strong>Associer</strong> des éléments idéaux (cylindre, plan…) selon le critère prescrit, puis <strong>construire</strong> les éléments dérivés (axes, plans médians).</li>
      <li><strong>Comparer</strong> à la zone de tolérance → pièce conforme ou non.</li>
    </ol>
    Atouts : polyvalence, géométries complexes, rapport automatique. Limites : coût, temps de mesure, nombre fini de points, salle climatisée (les mesures sont rapportées à 20 °C).
  </div>

  <h3>Nuages de points et méthodes d'association</h3>
  <p>Une machine à mesurer ne voit de la surface réelle qu'un <strong>nuage de points</strong> palpés. Pour en déduire une caractéristique (diamètre, défaut de forme, position d'un axe), on lui <strong>associe</strong> un élément géométrique parfait. Le programme se limite à quatre éléments : le <strong>plan</strong>, la <strong>droite</strong>, le <strong>cercle</strong> et le <strong>cylindre de révolution</strong>.</p>
  <div class="def-box">
    Notons \(e_i\) l'écart signé du point \(i\) à l'élément associé. Les critères usuels sont :
    <ul style="margin:.3rem 0">
      <li><strong>moindres carrés</strong> : rendre \(\sum e_i^2\) minimale (calcul direct, peu sensible à un point isolé, choix par défaut des logiciels) ;</li>
      <li><strong>minimax</strong> (Tchebychev) : rendre \(\max|e_i|\) minimale (c'est la définition de la zone de tolérance de forme) ;</li>
      <li><strong>élément tangent extérieur à la matière</strong> : par exemple le plus grand cylindre inscrit dans un alésage (élément qu'un calibre ENTRE simulerait).</li>
    </ul>
    Le <strong>défaut de forme</strong> (planéité, rectitude, circularité, cylindricité) est alors l'écart \(\max e_i - \min e_i\) des points autour de l'élément associé.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">On palpe une face de 100 × 60 mm aux quatre coins et au centre : hauteurs (en µm) 4 en (0, 0), 10 en (100, 0), 7 en (100, 60), −1 en (0, 60) et 2 au centre (50, 30). Défaut de planéité, comparé à une tolérance de 5 µm ?</span>
    <div class="content">
      <p>Plan des moindres carrés \(z = a + b\,(x - 50) + c\,(y - 30)\) : avec ces points disposés symétriquement autour du centre, les trois paramètres se découplent.</p>
      <div class="formula">$$a = \frac{\sum z_i}{5} = 4{,}4\ \text{µm}$$</div>
      <div class="formula">$$b = \frac{\sum (x_i - 50)\,z_i}{\sum (x_i - 50)^2} = \frac{700}{10\,000} = 0{,}07\ \text{µm/mm}$$</div>
      <div class="formula">$$c = \frac{\sum (y_i - 30)\,z_i}{\sum (y_i - 30)^2} = \frac{-240}{3\,600} \approx -0{,}067\ \text{µm/mm}$$</div>
      <p>Hauteurs du plan associé aux cinq points : 2,9 ; 9,9 ; 5,9 ; −1,1 ; 4,4 µm. Écarts : 1,1 ; 0,1 ; 1,1 ; 0,1 ; −2,4 µm. Défaut de planéité : \(1{,}1 - (-2{,}4) = 3{,}5\ \text{µm}\), inférieur à 5 µm : la face est jugée conforme. Ici le critère minimax donne la même valeur ; en général il donne une zone plus étroite ou égale. Avec cinq points seulement, un creux situé entre les points palpés échapperait à la mesure : le nombre et la répartition des points font partie de l'incertitude.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Désignations, ténacité, capabilité</h2>
  <div class="intro">Trois compléments utiles au bureau d'études ou à l'atelier, mais hors programme : ils ne sont pas exigibles, et un sujet qui s'en servirait les fournirait.</div>

  </table></div>
  <div class="prop-box"><strong>Aciers faiblement alliés</strong> (aucun élément d'addition n'atteint 5 %) : la désignation donne la teneur en carbone ×100, puis les symboles des éléments d'addition par teneurs décroissantes, suivis de leurs teneurs multipliées chacune par un facteur : <strong>4</strong> pour Cr, Co, Mn, Ni, Si, W ; <strong>10</strong> pour Al, Be, Cu, Mo, Nb, Pb, Ta, Ti, V, Zr ; <strong>100</strong> pour Ce (cérium), N, P, S ; <strong>1 000</strong> pour B. Les aciers <strong>fortement alliés</strong> (préfixe X) donnent directement les pourcentages.</div>

  <h3>Ténacité et rupture brutale</h3>
  <p>La ténacité \(K_{Ic}\) (§2) intervient dans un critère de <strong>rupture brutale</strong> : une pièce qui contient une fissure de taille \(a\) casse sans prévenir dès que le facteur d'intensité de contrainte atteint la ténacité (\(Y\) : facteur de forme, voisin de 1) :</p>
  <div class="formula">$$K_I = Y\,\sigma\,\sqrt{\pi\,a} \;\geq\; K_{Ic}$$</div>
  <p>Avec \(Y = 1\), une alumine (\(K_{Ic} \approx 4\ \text{MPa·}\sqrt{\text{m}}\)) qui contient un défaut de 50 µm rompt vers \(\sigma \approx 4/\sqrt{\pi\times 5\cdot10^{-5}} \approx 320\ \text{MPa}\) : c'est l'ordre de grandeur de sa résistance (tableau du §2), qui dépend donc de la taille de ses défauts. Pour un acier (\(K_{Ic} \approx 100\ \text{MPa·}\sqrt{\text{m}}\)), le même défaut ne deviendrait critique que vers 8 000 MPa : c'est la limite élastique qui dimensionne.</p>

  <h3>Capabilité d'un procédé</h3>
  <div class="def-box">Un procédé stable produit des cotes dispersées autour d'une moyenne \(m\) avec un écart-type \(\sigma\) ; presque toutes les pièces tombent dans un intervalle de largeur \(6\sigma\). Pour une tolérance \([T_i\,;\,T_s]\) d'intervalle \(IT\) :
    <div class="formula">$$C_p = \frac{IT}{6\,\sigma}$$ $$C_{pk} = \frac{\min(T_s - m,\; m - T_i)}{3\,\sigma}$$</div>
    On juge usuellement le procédé <strong>capable</strong> si \(C_p\) et \(C_{pk}\) dépassent 1,33. \(C_p\) mesure la dispersion seule, \(C_{pk}\) tient compte du centrage.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un diamètre de 25 mm en IT 7 (21 µm) est tourné avec un écart-type de 3 µm. Le procédé est-il capable ?</span>
    <div class="content"><p>\(C_p = 21/(6\times 3) \approx 1{,}17\), inférieur à 1,33 : le procédé n'est <strong>pas capable</strong>, même parfaitement centré. Il faut réduire la dispersion (machine plus rigide, finition par rectification) ou obtenir une tolérance plus large si la fonction le permet.</p></div>
  </div>
</div>

<template class="pan-tpl" data-panneau="ppm-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · PRODUIT–PROCÉDÉ–MATÉRIAU</div>
  <h2>Savoir-faire pour les épreuves</h2>
  <div class="intro">Ces méthodes suivent le chapitre : choisir un matériau (§2 à §5), puis un procédé (§6, §7), organiser la fabrication (§8, §9) et contrôler la pièce (§10).</div>

  <div class="method-box">
    <strong>Méthode 1 — Établir un indice de performance (§4)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Fonction.</span> Dire en une phrase ce que fait la pièce et modéliser (tirant, poutre, plaque, jante…).</li>
      <li><span class="step">Objectif.</span> Écrire la grandeur à optimiser, en général \(m = \rho\,V\) (ou le coût \(C_m\,\rho\,V\)).</li>
      <li><span class="step">Contraintes.</span> Les traduire en inégalités : raideur (\(S \geq S^*\), flèche ≤ \(\delta\)), résistance (\(\sigma_{max} \leq \sigma_f\)), dimensions imposées.</li>
      <li><span class="step">Paramètre libre.</span> Repérer la (ou les) grandeur(s) géométrique(s) non imposée(s).</li>
      <li><span class="step">Élimination.</span> Tirer le paramètre libre de la contrainte et le reporter dans l'objectif : \(P = f(F)\,g(G)\,h(\text{mat})\).</li>
      <li><span class="step">Indice.</span> Isoler le groupement de propriétés du matériau et l'écrire « à maximiser » (\(M = 1/h\)).</li>
      <li><span class="step">Plusieurs contraintes ?</span> Calculer la masse exigée par chacune : la contrainte <strong>active</strong> est celle qui exige la plus grande masse.</li>
    </ol>
    <strong>Pièges</strong> : l'indice ne doit contenir <strong>que</strong> des propriétés du matériau ; il change si le paramètre libre change (largeur seule libre → \(E/\rho\)) ; un matériau « optimal » peut violer une autre contrainte (encombrement, épaisseur minimale réalisable).
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Exploiter un diagramme d'Ashby (§3)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Axes.</span> Vérifier les grandeurs portées et les échelles (une graduation = une décade, soit un facteur 10).</li>
      <li><span class="step">Pente.</span> Traduire l'indice en droite : \(E^{1/n}/\rho\) → pente \(n\) sur un diagramme \(E\)–\(\rho\) ; \(\sigma_f^{2/3}/\rho\) → pente \(3/2\) sur un diagramme \(\sigma_f\)–\(\rho\).</li>
      <li><span class="step">Translation.</span> Tracer la droite par un matériau de référence, puis la déplacer parallèlement vers les meilleurs indices jusqu'à ne laisser que quelques candidats au-dessus.</li>
      <li><span class="step">Filtres.</span> Ajouter les contraintes simples (droite horizontale \(R_e \geq\) valeur, verticale \(\rho \leq\) valeur, température…).</li>
      <li><span class="step">Choix.</span> Retenir 3 à 5 candidats, puis trancher avec les critères secondaires : coût, procédé, corrosion, recyclabilité.</li>
    </ol>
    <strong>Pièges</strong> : raisonner sur les bulles (étendues), pas sur des points ; sur une échelle log, « deux fois plus haut » ne veut rien dire, il faut compter les décades ; le côté « meilleur » dépend du signe des exposants dans l'indice.
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Intégrer l'écoconception au choix d'un matériau (§5)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Unité fonctionnelle.</span> Ne comparer que des solutions qui rendent le même service : même fonction, même rigidité ou même résistance, même durée de vie.</li>
      <li><span class="step">Phase dominante.</span> Situer l'impact sur le cycle de vie (extraction et élaboration, fabrication, distribution, utilisation, fin de vie) : un produit qui consomme de l'énergie en service est dominé par l'utilisation, un produit passif par la matière et la fabrication.</li>
      <li><span class="step">Indice.</span> Pour l'impact de la matière, remplacer la masse par l'énergie grise \(W = H_m\,m\) : la méthode du §4 donne par exemple \(E^{1/2}/(H_m\,\rho)\) pour une poutre fléchie de rigidité imposée, lu sur une carte d'Ashby « module – énergie grise volumique ».</li>
      <li><span class="step">Bilan.</span> Comparer l'énergie de fabrication \(m\,H_m\) au gain obtenu en service (allègement, rendement) sur toute la durée de vie, en écrivant les hypothèses.</li>
      <li><span class="step">Leviers.</span> Passer en revue nouveau concept, matériaux à moindre impact (recyclés, biosourcés), réduction de matière, techniques de production, logistique, durée de vie, fin de vie.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Exemple éclair :</em> une pièce mobile de 1,5 kg d'acier (30 MJ/kg) est remplacée, à rigidité égale, par 0,9 kg d'aluminium de première fusion (200 MJ/kg) : 45 MJ contre 180 MJ à la fabrication. L'allègement de 0,6 kg doit économiser plus de 135 MJ en service pour que le changement soit favorable ; en aluminium recyclé (20 MJ/kg, 18 MJ), il l'est dès la fabrication.</p>
    <strong>Pièges</strong> : comparer des énergies grises « au kilogramme » au lieu de comparer des pièces qui rendent le même service ; oublier la phase d'utilisation ; présenter une méthode normalisée d'analyse du cycle de vie comme attendue (aucune n'est exigée).
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Choisir un procédé d'obtention du brut (§6, §7)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Matériau.</span> Lister les procédés compatibles (tableau de compatibilité) ; éliminer les incompatibilités franches (oxycoupage d'un inox, déformation à froid d'une fonte, moulage sous pression d'un acier).</li>
      <li><span class="step">Géométrie.</span> Forme (révolution, prismatique, coque mince, corps creux), taille, épaisseurs, contre-dépouilles, cavités : éliminer ce qui ne sait pas faire.</li>
      <li><span class="step">Série.</span> Comparer les coûts \(C_u = C_v + C_o/N\) des procédés restants ; calculer le seuil \(N^*\).</li>
      <li><span class="step">Précision.</span> Comparer IT et \(R_a\) demandés aux capacités du procédé ; prévoir une finition (usinage, rectification) <strong>seulement</strong> sur les surfaces fonctionnelles.</li>
      <li><span class="step">Propriétés induites.</span> Fibrage (forgeage), porosités (fonderie), ZAT (soudure, découpe thermique), anisotropie (composites, fabrication additive).</li>
      <li><span class="step">Conclusion.</span> Rédiger une justification argumentée sur ces critères, dans l'ordre.</li>
    </ol>
    <strong>Pièges</strong> : oublier l'amortissement de l'outillage ; vouloir tout obtenir d'un seul procédé ; proposer un procédé sans dire ce qu'il impose au dessin de la pièce (dépouilles, épaisseurs, congés, plan de joint).
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Ordonnancer une gamme de fabrication (§8)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Inventaire.</span> Lister les surfaces à réaliser, leurs spécifications et leurs références.</li>
      <li><span class="step">Groupes.</span> Regrouper les surfaces liées par une spécification serrée : elles seront faites dans la même prise.</li>
      <li><span class="step">Références d'abord.</span> La première phase (sur surfaces brutes) réalise les surfaces qui serviront d'appui ensuite.</li>
      <li><span class="step">Traitements.</span> Placer les traitements thermiques après l'ébauche et avant la rectification ; le traitement de surface en fin de gamme (en masquant les surfaces précises si besoin).</li>
      <li><span class="step">Numérotation.</span> Phases 10, 20, 30… ; pour chacune : machine, mise en position, opérations, outils.</li>
      <li><span class="step">Contrôle.</span> Terminer par le contrôle final.</li>
    </ol>
    <strong>Pièges</strong> : reprendre une pièce sur une surface brute pour une cote précise ; prévoir un usinage à l'outil coupant après une trempe à cœur ; séparer dans deux phases deux surfaces liées par une coaxialité serrée.
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Définir une mise en position isostatique (§8)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Spécifications.</span> Repérer celles réalisées dans la phase et leurs références (primaire, secondaire, tertiaire).</li>
      <li><span class="step">Appui principal.</span> Placer 1-2-3 sur la référence primaire (souvent la plus grande surface), en triangle le plus grand possible.</li>
      <li><span class="step">Orientation.</span> Placer 4-5 sur la référence secondaire, le plus éloignées possible ; puis 6 sur la tertiaire.</li>
      <li><span class="step">Vérification.</span> Chaque degré de liberté doit être supprimé une seule fois : pas trois normales alignées, pas deux normales qui bloquent le même mouvement.</li>
      <li><span class="step">Réalisation.</span> Choisir les éléments technologiques (touches, appuis plans, vés, centreurs, mandrin, étau) et placer le serrage en face des appuis.</li>
    </ol>
    <strong>Pièges</strong> : mettre une normale sur une surface usinée dans la phase ; appuyer sur une surface brute pour une spécification précise ; oublier l'indexage angulaire d'une pièce de révolution quand une forme doit être orientée.
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Choisir une cinématique de machine (§8)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Surfaces.</span> Lister les surfaces à usiner et leur mode de génération : travail de forme (l'arête reproduit sa forme : foret, alésoir, outil de forme) ou travail d'enveloppe (trajectoire du point générateur pilotée par la commande numérique).</li>
      <li><span class="step">Procédé.</span> Surfaces de révolution → tournage (coupe : rotation de la pièce) ; plans, épaulements, poches, surfaces gauches → fraisage (coupe : rotation de l'outil) ; trous → perçage, puis alésage ou taraudage.</li>
      <li><span class="step">Directions d'accès.</span> Pour chaque surface, la direction que doit prendre l'axe de l'outil (normale d'un plan, axe d'un trou).</li>
      <li><span class="step">Nombre d'axes.</span> Une seule direction d'accès → 3 axes (X, Y, Z) ; directions toutes perpendiculaires à un même axe → 4 axes (rotation autour de cet axe) ; directions quelconques, faces inclinées ou surfaces gauches → 5 axes. Tour : 2 axes (X, Z), 3 axes avec l'axe C et des outils tournants (méplats, perçages hors de l'axe).</li>
      <li><span class="step">Prises.</span> Regrouper dans une même prise les surfaces liées par une spécification serrée ; sinon, prévoir une reprise et en mesurer la conséquence.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Exemple éclair :</em> une bride de révolution porte quatre trous parallèles à son axe et un méplat. Sur un tour 2 axes, seuls les cylindres et les faces sont réalisables ; un centre de tournage 3 axes (axe C indexé, outils tournants) fait tout en une prise : les trous sont percés en indexant C de 90° en 90°, le méplat est fraisé par un outil tournant.</p>
    <strong>Pièges</strong> : compter les surfaces au lieu des directions d'accès ; oublier qu'une table tournante (4ᵉ axe) suffit pour des faces réparties autour d'un axe ; confondre axe de la broche (Z) et axe de plus grande course (X).
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Calculer une puissance de coupe et vérifier la machine (§9, au-delà du programme)</strong>
    <p style="margin-top:.4rem">Le programme limite l'analyse des procédés à une approche qualitative : cette méthode sert en travaux pratiques et pour vérifier un ordre de grandeur ; un sujet fournirait les relations.</p>
    <ol style="margin-top:.4rem">
      <li><span class="step">Fréquence de rotation.</span> \(N = 1000\,V_c/(\pi D)\) en tr/min (\(D\) en mm : diamètre de la <strong>pièce</strong> en tournage, de l'<strong>outil</strong> en fraisage et en perçage).</li>
      <li><span class="step">Vitesse d'avance.</span> \(V_f = f\,N\) (tournage, perçage) ou \(V_f = f_z\,Z\,N\) (fraisage).</li>
      <li><span class="step">Section ou débit.</span> \(A_D = a_p\,f\) en tournage ; \(Q = a_p\,a_e\,V_f\) en fraisage.</li>
      <li><span class="step">Puissance.</span> \(P_c = k_c\,a_p\,f\,V_c\) ou \(P_c = k_c\,Q\), en convertissant les unités en SI.</li>
      <li><span class="step">Machine.</span> Vérifier \(P_c/\eta \leq P_{moteur}\) ; si ce n'est pas le cas, réduire \(a_p\) ou l'avance (plusieurs passes).</li>
      <li><span class="step">Temps.</span> Durée d'une passe : \(t = L/V_f\).</li>
    </ol>
    <strong>Pièges</strong> : mélanger m/min et m/s, mm et m (facteur 60, facteur 1 000) ; confondre avance par tour, par dent et vitesse d'avance ; oublier le rendement.
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Choisir un moyen de contrôle (§10)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Lire la spécification.</span> Taille, forme, orientation, position ou battement ? Avec quelles références ? Avec Ⓔ ?</li>
      <li><span class="step">Résolution.</span> Viser une incertitude de l'ordre de \(IT/10\) : pied à coulisse pour les tolérances larges, micromètre ou comparateur pour les IT fins.</li>
      <li><span class="step">Série.</span> Petite série → instruments, MMT ; grande série → calibres à limites, montages de contrôle dédiés.</li>
      <li><span class="step">Taille avec Ⓔ.</span> Calibre à limites : côté ENTRE au maximum de matière, côté N'ENTRE PAS au minimum de matière.</li>
      <li><span class="step">Géométrie avec références.</span> Montage sur marbre + comparateur, ou MMT (repère des références, palpage, association, construction, comparaison).</li>
    </ol>
    <strong>Pièges</strong> : contrôler une coaxialité avec un pied à coulisse ; inverser les côtés d'un calibre (ENTRE = maximum de matière : \(D_{min}\) pour un alésage, \(d_{max}\) pour un arbre) ; oublier que l'incertitude réduit la zone de conformité.
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Exploiter un nuage de points (§10)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Élément.</span> Identifier la géométrie à associer : plan, droite, cercle ou cylindre de révolution (les seules au programme).</li>
      <li><span class="step">Critère.</span> Celui que prescrit la spécification : moindres carrés (choix par défaut des logiciels), minimax (définition de la zone de tolérance de forme), élément tangent extérieur à la matière (ce que simule un calibre ENTRE).</li>
      <li><span class="step">Écarts.</span> Calculer les écarts signés \(e_i\) des points à l'élément associé ; défaut de forme \(= \max e_i - \min e_i\).</li>
      <li><span class="step">Conclure.</span> Comparer à la tolérance, puis juger le nombre et la répartition des points : un défaut situé entre deux points palpés échappe à la mesure.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Exemple éclair :</em> rectitude d'une ligne palpée en \(x = 0\), 25, 50, 75 et 100 mm, écarts 0, 3, 2, 5 et 4 µm. Droite des moindres carrés \(z = 2{,}8 + 0{,}04\,(x - 50)\) ; écarts \(-0{,}8\), \(1{,}2\), \(-0{,}8\), \(1{,}2\), \(-0{,}8\) µm ; défaut de rectitude \(2{,}0\) µm.</p>
    <strong>Pièges</strong> : prendre l'écart entre le point le plus haut et le plus bas sans associer d'élément (l'inclinaison de la pièce fausse tout) ; conclure à la non-conformité sur le critère des moindres carrés alors que la zone de tolérance est définie par le minimax, toujours plus étroite ou égale.
  </div>

</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Familles, propriétés, essais et désignations (Q2 hors programme)</h3>
  <div class="statement">On cherche à associer quelques pièces courantes à une famille de matériaux, à choisir des essais de caractérisation, puis à lire des désignations normalisées.</div>
  <div class="q"><strong>Q1.</strong> Proposer une famille (et un exemple de matériau) en la justifiant par une ou deux propriétés pour : (a) le joint d'étanchéité d'un couvercle de pompe ; (b) la poignée isolante d'une casserole ; (c) la plaquette d'un outil de tournage ; (d) le bâti d'une machine-outil ; (e) la coque d'un kayak fabriqué à 300 exemplaires par an.</div>
  <div class="q"><strong>Q2.</strong> <em>(Hors programme, pour aller plus loin : la lecture des désignations est rappelée en fin de cours.)</em> Décoder : S355, C35, 36NiCrMo16, X2CrNiMo17-12-2, EN AW-7075.</div>
  <div class="q"><strong>Q3.</strong> Pour une pièce de petit mécanisme, on hésite entre un polyamide PA 6 et un acier. Donner deux avantages et deux inconvénients du polymère.</div>
  <div class="q"><strong>Q4.</strong> Quel essai de caractérisation choisir, et quelle grandeur lire, pour : (a) vérifier sur un lot d'axes finis que leurs portées ont bien été durcies par trempe superficielle ; (b) choisir l'acier de la flèche d'une grue utilisée jusqu'à −30 °C ; (c) dimensionner un arbre de pompe qui tourne en continu, chargé en flexion ; (d) connaître la rigidité d'un nouvel alliage ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) <strong>Élastomère</strong> (EPDM, nitrile, silicone) : très grandes déformations élastiques et module faible, il épouse les surfaces et revient en place. (b) <strong>Thermodurcissable</strong> (phénolique) : isolant thermique (\(\lambda \approx 0{,}2\) W·m⁻¹·K⁻¹) et il ne ramollit pas à la chaleur, contrairement à un thermoplastique. (c) <strong>Carbure métallique ou céramique</strong> (carbure de tungstène lié au cobalt, alumine) : très dur, et qui le reste à haute température (dureté à chaud), résistant à l'usure ; en revanche peu tenace (fragile), d'où une géométrie d'arête renforcée. (d) <strong>Fonte à graphite lamellaire</strong> (EN-GJL-250) : formes complexes obtenues par moulage, excellent amortissement des vibrations, bon marché (mécanosoudure en acier pour une machine unique). (e) <strong>Composite verre/polyester</strong> (moulage au contact ou infusion) ou polyéthylène rotomoulé : grande pièce creuse, petite série sans outillage coûteux, insensible à l'eau.</p>
    <p><strong>Q2.</strong> S355 : acier de construction, \(R_e\) minimale 355 MPa. C35 : acier non allié à 0,35 % de carbone. 36NiCrMo16 : faiblement allié, 0,36 % C, nickel \(16/4 = 4\) %, avec un peu de chrome et de molybdène. X2CrNiMo17-12-2 : inoxydable (fortement allié), 0,02 % C, 17 % Cr, 12 % Ni, 2 % Mo. EN AW-7075 : alliage d'aluminium corroyé de la série 7000 (Al-Zn), à haute résistance (aéronautique).</p>
    <p><strong>Q3.</strong> Avantages : environ 7 fois plus léger ; injectable (formes complexes en grande série, sans finition) ; insensible à la corrosion, isolant, bon frottement à sec. Inconvénients : module 70 à 100 fois plus faible (pièce plus massive à rigidité égale) ; sensibilité à la température et au fluage ; reprise d'humidité du polyamide, qui change ses dimensions et ses propriétés.</p>
    <p><strong>Q4.</strong> (a) Essai de <strong>dureté</strong> (Rockwell C ou Vickers) : il ne laisse qu'une petite empreinte, se pratique sur la pièce finie et vérifie rapidement un traitement thermique (une portée trempée est vers 55 à 60 HRC). (b) Essai de <strong>résilience</strong> Charpy, mené à plusieurs températures : on lit l'énergie absorbée par la rupture et l'on vérifie que la transition ductile-fragile se situe sous −30 °C. (c) Essai de <strong>fatigue</strong> (flexion rotative) : la courbe de Wöhler donne la limite d'endurance \(\sigma_D\), à réduire selon l'état de surface et les entailles de l'arbre. (d) Essai de <strong>traction</strong> : le module d'Young \(E\) est la pente de la partie élastique de la courbe (l'essai donne aussi \(R_e\), \(R_m\) et \(A\,\%\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Tirant léger : la rigidité avant tout</h3>
  <div class="statement">Un tirant de longueur \(L = 2{,}0\) m supporte un effort \(F = 20\) kN ; son allongement ne doit pas dépasser \(\delta = 1{,}0\) mm. Sa section \(A\) est libre ; on cherche la masse minimale.

      <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Matériau</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">ρ (kg/m³)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">E (GPa)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">R<sub>e</sub> (MPa)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">C<sub>m</sub> (€/kg)</th></tr>

      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Alliage de titane TA6V</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">4 400</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">110</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">830</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">30</td></tr>
