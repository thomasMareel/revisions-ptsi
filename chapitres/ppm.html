    </table></div>
    <span style="font-size:.85rem;opacity:.8">* contrainte de rupture dans le sens des fibres.</span>
  </div>
  <div class="q"><strong>Q1.</strong> Montrer que \(m \geq S^* L^2\,\rho/E\) avec \(S^* = F/\delta\). Quel est l'indice de performance ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la masse minimale du tirant pour chaque matériau.</div>
  <div class="q"><strong>Q3.</strong> Vérifier que la contrainte de résistance est respectée. Laquelle des deux contraintes est active ?</div>
  <div class="q"><strong>Q4.</strong> Quel indice faut-il utiliser pour minimiser le coût matière ? Calculer ce coût et conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(m = \rho A L\) et l'allongement \(\Delta L = F L/(E A) \leq \delta\) impose \(A \geq S^* L/E\). D'où \(m \geq S^* L^2 \rho/E\) : seul \(\rho/E\) dépend du matériau, il faut <strong>maximiser \(E/\rho\)</strong>.</p>
    <p><strong>Q2.</strong> \(S^* = 2\cdot 10^4/10^{-3} = 2\cdot 10^7\) N/m et \(S^* L^2 = 8\cdot 10^7\) N·m.</p>
    <div class="formula">$$m_{acier} = 8\cdot 10^7 \times \frac{7\,800}{210\cdot 10^9} \approx 2{,}97\ \text{kg}$$</div>
    <p>De même : aluminium \(\approx 3{,}09\) kg ; titane \(\approx 3{,}20\) kg ; carbone/époxyde \(\approx 1{,}13\) kg. Les trois métaux se valent à 8 % près (même \(E/\rho\)) ; le composite est environ 2,6 fois plus léger.</p>
    <p><strong>Q3.</strong> Sections : \(A = S^* L/E\) soit 190 mm² (acier), 571 mm² (aluminium), 364 mm² (titane et composite). Contraintes \(F/A\) : 105 MPa, 35 MPa, 55 MPa, 55 MPa, toutes bien inférieures aux résistances. Pour l'acier, la résistance seule exigerait \(m = F L \rho/R_e \approx 0{,}88\) kg, moins que 2,97 kg : c'est la <strong>raideur</strong> qui est active.</p>
    <p><strong>Q4.</strong> On remplace \(\rho\) par \(C_m\rho\) : indice \(E/(C_m\rho)\). Coûts matière : acier ≈ 2,4 € ; aluminium ≈ 9,3 € ; titane ≈ 96 € ; composite ≈ 45 €. Conclusion : l'<strong>acier</strong> est de loin le plus économique ; le <strong>composite</strong> ne se justifie que si chaque kilogramme gagné a une grande valeur (aéronautique, compétition). Le titane n'a aucun intérêt ici : sa résistance élevée n'est pas utilisée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Poutre de section carrée : bois, alliage ou acier ?</h3>
  <div class="statement">Une poutre de section carrée pleine, de côté \(a\) libre, repose sur deux appuis distants de \(L = 3\) m. Chargée en son milieu par \(F = 1\) kN, sa flèche ne doit pas dépasser \(\delta = 6\) mm. On rappelle \(\delta = F L^3/(48\,E\,I)\) et \(I = a^4/12\). Matériaux : épicéa dans le sens des fibres (450 kg/m³ ; 12 GPa), alliage d'aluminium (2 700 ; 70), acier (7 800 ; 210), profilé pultrudé carbone/époxyde (1 550 ; 110).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la masse minimale est proportionnelle à \(\rho/E^{1/2}\). Quelle droite trace-t-on sur un diagramme d'Ashby \(E\)–\(\rho\) ?</div>
  <div class="q"><strong>Q2.</strong> Classer les quatre matériaux.</div>
  <div class="q"><strong>Q3.</strong> Calculer le côté \(a\) et la masse de la poutre en épicéa et en acier.</div>
  <div class="q"><strong>Q4.</strong> L'encombrement impose finalement \(a \leq 70\) mm. Quel matériau retenir ? Vérifier sa résistance.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La contrainte de flèche donne \(a^4 \geq 12 F L^3/(48\,E\,\delta)\), donc \(a^2 \geq (F L^3/(4E\delta))^{1/2}\). La masse \(m = \rho a^2 L\) vérifie :</p>
    <div class="formula">$$m \;\geq\; \left(\frac{F}{4\,\delta}\right)^{1/2} L^{5/2}\;\frac{\rho}{E^{1/2}}$$</div>
    <p>Il faut maximiser \(E^{1/2}/\rho\) : droite de <strong>pente 2</strong> sur le diagramme \(\log E\)–\(\log \rho\).</p>
    <p><strong>Q2.</strong> Indices \(E^{1/2}/\rho\) (en GPa\(^{1/2}\)·m³/t) : épicéa \(\sqrt{12}/0{,}45 \approx 7{,}7\) ; carbone/époxyde \(\approx 6{,}8\) ; aluminium \(\approx 3{,}1\) ; acier \(\approx 1{,}9\). Le bois arrive en tête : la flexion favorise les matériaux légers.</p>
    <p><strong>Q3.</strong> D'après Q1 (unités SI) :</p>
    <div class="formula">$$a^4 = \frac{F L^3}{4\,E\,\delta} = \frac{1\,000 \times 27}{4 \times 0{,}006\,E} = \frac{1{,}125\cdot 10^6}{E}$$</div>
    <p>Épicéa : \(a^4 = 9{,}4\cdot 10^{-5}\) m⁴, \(a \approx 98\) mm, \(m = 450 \times 0{,}098^2 \times 3 \approx 13{,}1\) kg. Acier : \(a^4 = 5{,}4\cdot 10^{-6}\) m⁴, \(a \approx 48\) mm, \(m \approx 54\) kg. Rapport des masses ≈ 4,1, égal au rapport des indices.</p>
    <p><strong>Q4.</strong> L'épicéa (98 mm) est éliminé. Côtés et masses : carbone/époxyde \(a \approx 57\) mm, \(m \approx 14{,}9\) kg ; aluminium \(a \approx 63\) mm, \(m \approx 32{,}5\) kg ; acier 48 mm, 54 kg. On retient le <strong>composite</strong> si le budget le permet, sinon l'<strong>aluminium</strong>. Résistance (aluminium) : \(M_{f,max} = F L/4 = 750\) N·m, \(\sigma_{max} = 6 M_f/a^3 \approx 6 \times 750/0{,}063^3 \approx 18\) MPa, très inférieur à \(R_e\). En pratique, un <strong>profilé creux</strong> ferait encore beaucoup mieux : la forme de la section est un levier supplémentaire, que l'indice à section carrée pleine n'exploite pas.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Découper une tôle : quel procédé ?</h3>
  <div class="statement">Un atelier de tôlerie reçoit cinq commandes.
    <ul style="margin:.3rem 0">
      <li>(a) 20 000 rondelles \(\varnothing\) 30 mm percées à \(\varnothing\) 12 mm, dans une tôle S235 de 2 mm ;</li>
      <li>(b) 15 platines de contour complexe en inox, épaisseur 4 mm, précision ±0,1 mm ;</li>
      <li>(c) 5 brides de 120 mm d'épaisseur en acier S355, à découper sur chantier ;</li>
      <li>(d) 40 panneaux en composite verre/époxyde de 8 mm ;</li>
      <li>(e) 200 goussets en acier S235 de 25 mm, tolérance ±0,5 mm, au moindre coût.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Proposer un procédé de découpe pour chaque commande, en justifiant.</div>
  <div class="q"><strong>Q2.</strong> Pour (a), on découpe le trou et le contour en un seul coup de presse. Estimer l'effort de découpage par \(F \approx p\,e\,R_g\) (\(p\) : périmètre découpé ; \(R_m = 400\) MPa, \(R_g \approx 0{,}8\,R_m\)) et choisir une presse parmi 50, 100 et 160 kN. <em>(Ordre de grandeur au-delà du programme, qui limite l'analyse des procédés à une approche qualitative.)</em></div>
  <div class="q"><strong>Q3.</strong> Pourquoi le plasma et l'oxycoupage sont-ils exclus pour (d) ? et l'oxycoupage pour (b) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) <strong>Poinçonnage</strong> avec un outil combiné : très grande série, tôle mince, forme simple ; l'outil est vite amorti et la cadence très élevée. (b) <strong>Laser</strong> : contour complexe, précision ≈ 0,1 mm, faible ZAT, aucun outillage pour 15 pièces (le jet d'eau conviendrait aussi, plus lentement). (c) <strong>Oxycoupage</strong> : très forte épaisseur, acier peu allié, matériel léger et transportable. (d) <strong>Jet d'eau abrasif</strong> : aucun échauffement (la résine brûlerait au laser), coupe les matériaux non métalliques. (e) <strong>Plasma</strong> : 25 mm d'acier, tolérance large, découpe rapide et bon marché (le laser est à sa limite d'épaisseur, l'oxycoupage serait plus lent et moins précis).</p>
    <p><strong>Q2.</strong> Périmètre découpé : \(p = \pi(30 + 12) \approx 132\) mm. Effort :</p>
    <div class="formula">$$F \approx p\,e\,R_g = 132 \times 2 \times 320$$ $$F \approx 8{,}4\cdot 10^4\ \text{N} = 84\ \text{kN}$$</div>
    <p>La presse de 50 kN est insuffisante ; celle de 100 kN convient avec une marge d'environ 20 %.</p>
    <p><strong>Q3.</strong> Le composite verre/époxyde n'est <strong>pas conducteur</strong> (le plasma a besoin de fermer l'arc sur la pièce) et ne <strong>brûle</strong> pas comme le fer dans l'oxygène ; de plus, la chaleur dégraderait la matrice. L'inox ne s'oxycoupe pas : son oxyde de chrome est réfractaire et protège le métal de la combustion.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Boîtier de capteur : usinage ou injection ?</h3>
  <div class="statement">Un boîtier de capteur en polymère (boîte ouverte de 80 × 50 × 30 mm, paroi de 2,5 mm, quatre bossages de fixation) peut être obtenu de deux façons :
    <ul style="margin:.3rem 0">
      <li>S1 : usinage dans un bloc de polyacétal (POM) — coût fixe \(C_{o1} = 600\) € (programmation, montage), coût variable \(C_{v1} = 16{,}50\) € par pièce ;</li>
      <li>S2 : injection de polyamide chargé de fibres de verre — moule \(C_{o2} = 30\,000\) €, \(C_{v2} = 0{,}90\) € par pièce.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Exprimer le coût unitaire de chaque solution en fonction du nombre \(N\) de pièces et calculer le seuil de rentabilité.</div>
  <div class="q"><strong>Q2.</strong> Les prévisions sont de 1 500 boîtiers par an pendant 5 ans. Quelle solution retenir ? Comparer les coûts totaux.</div>
  <div class="q"><strong>Q3.</strong> La pression dans l'empreinte vaut 50 MPa et la surface projetée sur le plan de joint (pièce et canaux) 40 cm². Choisir une presse parmi 100, 250 et 400 kN de force de fermeture.</div>
  <div class="q"><strong>Q4.</strong> Pour rigidifier le boîtier, on propose de porter la paroi à 4 mm. Quelles conséquences ? Que proposer à la place ?</div>
  <div class="q"><strong>Q5.</strong> Citer deux autres règles de tracé à vérifier sur le dessin et indiquer où placer le plan de joint.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(C_{u1} = 16{,}50 + 600/N\) et \(C_{u2} = 0{,}90 + 30\,000/N\). Les coûts sont égaux pour un nombre de pièces :</p>
    <div class="formula">$$N^* = \frac{30\,000 - 600}{16{,}50 - 0{,}90} \approx 1\,885$$</div>
    <p><strong>Q2.</strong> \(N = 7\,500\), bien au-delà de \(N^*\) : on retient l'<strong>injection</strong>. Coûts totaux : S1 \(= 600 + 16{,}50 \times 7\,500 = 124\,350\) € ; S2 \(= 30\,000 + 0{,}90 \times 7\,500 = 36\,750\) €, soit 4,90 € par boîtier au lieu de 16,58 €.</p>
    <p><strong>Q3.</strong> \(F_f \geq p_e S_p = 50\cdot 10^6 \times 40\cdot 10^{-4} = 2{,}0\cdot 10^5\) N = 200 kN. La presse de <strong>250 kN</strong> convient (marge de 25 %) ; celle de 400 kN serait surdimensionnée et plus chère à l'heure.</p>
    <p><strong>Q4.</strong> Le temps de refroidissement varie comme \(e^2\) : \((4/2{,}5)^2 \approx 2{,}6\) fois plus long, donc un cycle beaucoup plus long ; plus de matière, risque de retassures et de déformations. On garde la paroi à 2,5 mm et on ajoute des <strong>nervures</strong> d'environ 1,2 à 1,8 mm d'épaisseur aux endroits sollicités.</p>
    <p><strong>Q5.</strong> <strong>Dépouilles</strong> (0,5° à 2°) sur les parois latérales, intérieures et extérieures ; <strong>congés</strong> aux raccordements paroi–fond et à la base des bossages ; pas de contre-dépouille (un clip ou une ouverture dans une paroi latérale imposerait un tiroir). Le plan de joint se place naturellement au niveau du <strong>bord ouvert</strong> de la boîte : le noyau (partie mobile) forme l'intérieur, la matrice l'extérieur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Semelle de palier : mise en position et nombre d'axes</h3>
  <div class="statement">Une semelle de palier (bloc de 160 × 90 × 50 mm en acier S235, dont les faces ont déjà été surfacées) doit recevoir <strong>en une seule prise</strong> : (i) un alésage \(\varnothing\) 30 H7 débouchant, perpendiculaire à la face inférieure A ; (ii) deux trous taraudés M8 sur la face supérieure ; (iii) un trou taraudé M10 au centre de la petite face d'extrémité C′ (opposée à la face C). Le dessin spécifie la perpendicularité de l'axe de l'alésage par rapport à A et sa localisation dans le système de références A (face inférieure, primaire), B (grande face latérale, secondaire), C (petite face d'extrémité, tertiaire).</div>
  <div class="q"><strong>Q1.</strong> Proposer une mise en position isostatique (normales et surfaces) et la justifier.</div>
  <div class="q"><strong>Q2.</strong> Proposer une réalisation technologique et placer les efforts de serrage.</div>
  <div class="q"><strong>Q3.</strong> Sur une fraiseuse 3 axes à broche verticale, la pièce posée sur A, quelles opérations peut-on faire ? Quelle cinématique minimale (nombre et nature des axes) permettrait de tout réaliser sans démonter la pièce ?</div>
  <div class="q"><strong>Q4.</strong> Si l'on ne dispose que de la machine 3 axes, que faire, et avec quelle conséquence ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Appui plan 1-2-3 sur <strong>A</strong> (grande face, référence primaire), en triangle le plus étendu possible ; orientation 4-5 sur <strong>B</strong> (secondaire), les deux points écartés sur la longueur de 160 mm ; butée 6 sur <strong>C</strong> (tertiaire). Les appuis coïncident avec le système de références du dessin : la perpendicularité et la localisation sont réalisées directement, sans transfert de cotes. Chaque degré de liberté est supprimé une fois : isostatisme.</p>
    <p><strong>Q2.</strong> Montage modulaire sur plaque de base : trois appuis fixes sous A, deux touches contre B, une butée contre C. Serrage par brides verticales sur la face supérieure, au droit des appuis 1-2-3 et hors des zones usinées ; poussoir horizontal sur la face opposée à B, en face de 4-5 ; léger effort vers la butée 6 par un poussoir placé sur C′, décalé du taraudage M10 (ou par frottement des brides).</p>
    <p><strong>Q3.</strong> En 3 axes, l'outil travaille selon la seule direction verticale : l'alésage (i) et les taraudages M8 (ii), accessibles par le dessus, sont réalisables ; le M10 (iii), d'axe horizontal, ne l'est pas. Les directions d'accès nécessaires (normale à la face supérieure, normale à C′) sont toutes deux perpendiculaires à la normale de B : une <strong>rotation autour d'un axe parallèle à la normale de B</strong> suffit à les présenter successivement à la broche. Il faut donc <strong>4 axes</strong> : X, Y, Z et une rotation (axe A si cette direction est l'axe X de la machine, B si c'est l'axe Y), par exemple un centre à broche horizontale avec table tournante B, la pièce bridée sur une équerre.</p>
    <p><strong>Q4.</strong> Réaliser le M10 dans une <strong>deuxième phase</strong> (ou sous-phase), la pièce remise en position sur une autre face. Conséquence : une erreur de reprise s'ajoute sur la position du M10 par rapport aux autres formes et le temps de réglage augmente. C'est acceptable ici, car un taraudage de fixation est en général peu précis.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Tournage d'un arbre : puissance, état de surface et capabilité (hors programme, pour aller plus loin)</h3>
  <div class="statement">On tourne un arbre en C45 (\(k_c = 2\,000\) N/mm²) de diamètre 60 mm. En ébauche : \(V_c = 180\) m/min, \(a_p = 3\) mm, \(f = 0{,}3\) mm/tr. Le tour dispose d'un moteur de 7,5 kW, avec un rendement de transmission \(\eta = 0{,}8\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la fréquence de rotation, l'effort et la puissance de coupe. La machine convient-elle ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le couple à la broche.</div>
  <div class="q"><strong>Q3.</strong> En finition, on exige \(R_a \leq 1{,}6\) µm avec un outil de rayon de bec \(r_\varepsilon = 0{,}8\) mm. Quelle avance maximale ?</div>
  <div class="q"><strong>Q4.</strong> Le diamètre fini est \(\varnothing\) 56 h7 (IT 7 = 30 µm entre 50 et 80 mm). Sur un lot, on mesure une moyenne de 55,984 mm et un écart-type de 4 µm. Calculer \(C_p\) et \(C_{pk}\) et conclure. Quel écart-type faudrait-il atteindre ?</div>
  <div class="q"><strong>Q5.</strong> Quels moyens de contrôle proposer en production pour ce diamètre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Fréquence de rotation et effort de coupe :</p>
    <div class="formula">$$N = \frac{1000\,V_c}{\pi D} = \frac{180\,000}{\pi \times 60} \approx 955\ \text{tr/min}$$</div>
    <p>\(F_c = k_c\,a_p\,f = 2\,000 \times 3 \times 0{,}3 = 1\,800\) N.</p>
    <div class="formula">$$P_c = F_c\,V_c = 1\,800 \times \frac{180}{60} = 5\,400\ \text{W}$$</div>
    <p>Puissance demandée au moteur : \(5\,400/0{,}8 = 6\,750\) W, inférieure à 7,5 kW : la machine convient, avec une marge de 10 % seulement (on ne peut pas augmenter beaucoup \(a_p\)).</p>
    <p><strong>Q2.</strong> \(C = F_c\,D/2 = 1\,800 \times 0{,}030 = 54\) N·m (vérification : \(\omega = 955 \times 2\pi/60 \approx 100\) rad/s et \(P_c/\omega = 54\) N·m).</p>
    <p><strong>Q3.</strong> \(R_a \approx f^2/(32\,r_\varepsilon) \leq 1{,}6\cdot 10^{-3}\) mm, donc \(f \leq \sqrt{32 \times 0{,}8 \times 1{,}6\cdot 10^{-3}} \approx 0{,}20\) mm/tr. Avec \(f = 0{,}2\) mm/tr : \(R_t = 0{,}04/6{,}4 \approx 6{,}3\) µm et \(R_a \approx 1{,}6\) µm.</p>
    <p><strong>Q4.</strong> h7 : écart supérieur nul, donc \(T_s = 56{,}000\) mm et \(T_i = 55{,}970\) mm.</p>
    <div class="formula">$$C_p = \frac{30}{6 \times 4} = 1{,}25$$ $$C_{pk} = \frac{\min(16\,;\,14)}{3 \times 4} \approx 1{,}17$$</div>
    <p>Les deux indices sont inférieurs à 1,33 : le procédé <strong>n'est pas capable</strong>. Recentrer la moyenne (55,985 mm) ne suffirait pas, puisque \(C_p\) lui-même est trop faible. Il faudrait \(\sigma \leq 30/(6 \times 1{,}33) \approx 3{,}8\) µm : améliorer la finition (outil neuf, compensation d'usure, passe de finition plus faible) ou passer en rectification.</p>
    <p><strong>Q5.</strong> L'incertitude visée est d'environ \(IT/10 = 3\) µm : un micromètre au centième est insuffisant. En poste : <strong>mâchoire à limites</strong> (côté ENTRE 56,000 mm, côté N'ENTRE PAS 55,970 mm) pour trier rapidement, et suivi statistique au <strong>micromètre numérique</strong> (0,001 mm) ou au comparateur sur un montage étalonné.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Tablette de train : masse, énergie grise et cycle de vie</h3>
  <div class="statement">La tablette rabattable fixée au dos d'un siège de train est modélisée par une plaque fléchie dont la longueur et la largeur sont imposées ; son épaisseur \(e\) est libre et sa raideur en flexion doit atteindre une valeur fixée. La version actuelle, en tôle d'acier, pèse 3,0 kg. Sur les 30 ans de service de la rame, chaque kilogramme embarqué coûte environ 1 000 MJ d'énergie de traction (ordre de grandeur retenu pour l'exercice). Données arrondies :
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
      <tr><th>Matériau</th><th>\(\rho\) (kg/m³)</th><th>\(E\) (GPa)</th><th>\(H_m\) (MJ/kg)</th></tr>
      <tr><td>acier</td><td>7 800</td><td>210</td><td>30</td></tr>
      <tr><td>alliage d'aluminium de première fusion</td><td>2 700</td><td>70</td><td>200</td></tr>
      <tr><td>alliage d'aluminium recyclé</td><td>2 700</td><td>70</td><td>20</td></tr>
      <tr><td>composite verre/polyester</td><td>1 900</td><td>20</td><td>110</td></tr>
      <tr><td>contreplaqué</td><td>700</td><td>9</td><td>15</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>Q1.</strong> Montrer qu'à raideur imposée la masse de la tablette est proportionnelle à \(\rho/E^{1/3}\). Quel indice faut-il maximiser pour minimiser la masse ? pour minimiser l'énergie grise ? Quelle droite trace-t-on sur un diagramme d'Ashby \(\log E\)–\(\log \rho\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer, pour chaque matériau, la masse de la tablette et son énergie de fabrication (énergie grise de la matière).</div>
  <div class="q"><strong>Q3.</strong> Ajouter l'énergie de traction sur 30 ans. Quelle phase du cycle de vie domine ? Classer les solutions.</div>
  <div class="q"><strong>Q4.</strong> Un fournisseur fait valoir que l'aluminium « demande près de sept fois plus d'énergie que l'acier ». Que lui répondre ?</div>
  <div class="q"><strong>Q5.</strong> Le contreplaqué arrive en tête. Quelles exigences du cahier des charges pourraient l'écarter ? Quelle solution retenir alors ? Citer deux dispositions de conception qui facilitent la fin de vie de la tablette.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour une plaque de largeur \(b\) et de longueur \(L\) imposées, \(I = b\,e^3/12\) et la raideur est proportionnelle à \(E\,I/L^3\), donc à \(E\,e^3\) : à raideur imposée, \(e\) varie comme \(E^{-1/3}\). La masse \(m = \rho\,b\,e\,L\) varie donc comme \(\rho/E^{1/3}\) : il faut maximiser \(E^{1/3}/\rho\) pour la masse, et \(E^{1/3}/(H_m\,\rho)\) pour l'énergie grise \(W = H_m\,m\). Sur le diagramme \(\log E\)–\(\log\rho\), les matériaux de même indice sont sur une droite de pente 3 (\(\log E = 3\log\rho + 3\log M\)).</p>
    <p><strong>Q2.</strong> Masse : \(m = 3{,}0 \times \dfrac{\rho/E^{1/3}}{(\rho/E^{1/3})_{acier}}\), avec \((\rho/E^{1/3})_{acier} = 7\,800/210^{1/3} \approx 1\,312\) (en kg/m³ et GPa) ; fabrication : \(m\,H_m\). Les résultats sont dans le tableau de la question 3.</p>
    <p><strong>Q3.</strong> Traction : \(1\,000\ \text{MJ/kg} \times m\).</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
      <tr><th>Matériau</th><th>\(\rho/E^{1/3}\)</th><th>\(m\) (kg)</th><th>Fabrication (MJ)</th><th>Traction (MJ)</th><th>Total (MJ)</th></tr>
      <tr><td>acier</td><td>1 312</td><td>3,0</td><td>90</td><td>3 000</td><td>3 090</td></tr>
      <tr><td>aluminium de première fusion</td><td>655</td><td>1,50</td><td>300</td><td>1 500</td><td>1 800</td></tr>
      <tr><td>aluminium recyclé</td><td>655</td><td>1,50</td><td>30</td><td>1 500</td><td>1 530</td></tr>
      <tr><td>verre/polyester</td><td>700</td><td>1,60</td><td>176</td><td>1 600</td><td>1 780</td></tr>
      <tr><td>contreplaqué</td><td>336</td><td>0,77</td><td>12</td><td>770</td><td>780</td></tr>
    </table></div>
    <p>L'énergie de traction vaut de 5 fois (aluminium de première fusion) à plus de 60 fois (contreplaqué) l'énergie de fabrication : la phase d'utilisation domine, et c'est l'allègement qui compte d'abord. Classement : contreplaqué (780 MJ), aluminium recyclé (1 530 MJ), composite et aluminium de première fusion presque à égalité (environ 1 800 MJ), acier (3 090 MJ). L'aluminium de première fusion, plus coûteux que l'acier à la fabrication (300 MJ contre 90), devient nettement meilleur sur le cycle de vie.</p>
    <p><strong>Q4.</strong> Le rapport 200/30 ≈ 6,7 compare des kilogrammes, pas des tablettes : à raideur égale, il faut 1,5 kg d'aluminium pour 3,0 kg d'acier. On compare des solutions qui rendent le même service sur toute leur vie (unité fonctionnelle) : à la fabrication, le rapport tombe à 300/90 ≈ 3,3 ; avec la traction, l'aluminium de première fusion consomme 1 800 MJ contre 3 090 ; recyclé, il est meilleur que l'acier dès la fabrication (30 MJ contre 90).</p>
    <p><strong>Q5.</strong> La tenue au feu (réglementation ferroviaire), la tenue à l'humidité et aux produits de nettoyage, la résistance aux chocs et au vandalisme, la durée de vie de 30 ans : un bois brut risque d'être écarté (ou devra être traité et revêtu, ce qui change son bilan). On retient alors l'aluminium recyclé, léger, sobre en énergie et lui-même recyclable. Fin de vie : assemblage par vis plutôt que par collage (démontage), un seul matériau ou des matériaux faciles à séparer, plastiques marqués ; éviter le composite à matrice thermodurcissable, difficile à recycler.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Rectitude d'une génératrice : moindres carrés ou minimax ?</h3>
  <div class="statement">Sur une machine à mesurer tridimensionnelle, on palpe une génératrice d'un arbre \(\varnothing\) 25 h6 en cinq points d'abscisses \(x = 0\), 25, 50, 75 et 100 mm. Les écarts mesurés perpendiculairement à la génératrice, par rapport à une droite de référence de la machine, valent, dans l'ordre (en µm) : 3 ; 3 ; 7 ; 4 ; 8. Le dessin impose une tolérance de rectitude de 4 µm à la génératrice et l'exigence de l'enveloppe Ⓔ au diamètre.</div>
  <div class="q"><strong>Q1.</strong> Associer la droite des moindres carrés \(z = a + b\,(x - 50)\). Calculer les écarts des points à cette droite et le défaut de rectitude correspondant. Conclure.</div>
  <div class="q"><strong>Q2.</strong> Montrer que les points 2 et 4 d'une part, 3 et 5 d'autre part, sont sur deux droites parallèles entre lesquelles se trouve le point 1. En déduire le défaut de rectitude au sens du minimax. Conclure.</div>
  <div class="q"><strong>Q3.</strong> Lequel des deux critères définit la zone de tolérance de rectitude ? Pourquoi le logiciel de la machine propose-t-il pourtant les moindres carrés par défaut ?</div>
  <div class="q"><strong>Q4.</strong> Pour vérifier l'exigence de l'enveloppe sur ce diamètre, quel élément faut-il associer au nuage de points de la surface cylindrique ? Quel calibre simule-t-il ?</div>
  <div class="q"><strong>Q5.</strong> Cinq points suffisent-ils ? Comment améliorer la mesure ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les abscisses sont symétriques autour de 50 mm, ce qui découple les deux paramètres : \(a = \sum z_i/5 = 25/5 = 5\) µm et</p>
    <div class="formula">$$b = \frac{\sum (x_i - 50)\,z_i}{\sum (x_i - 50)^2} = \frac{275}{6\,250} = 0{,}044\ \text{µm/mm}$$</div>
    <p>La droite associée passe aux hauteurs 2,8 ; 3,9 ; 5,0 ; 6,1 ; 7,2 µm ; écarts des points : 0,2 ; −0,9 ; 2,0 ; −2,1 ; 0,8 µm. Défaut de rectitude : \(2{,}0 - (-2{,}1) = 4{,}1\) µm, supérieur à 4 µm : sur ce critère, la pièce serait refusée.</p>
    <p><strong>Q2.</strong> Points 2 (25 ; 3) et 4 (75 ; 4) : pente \((4 - 3)/50 = 0{,}02\) µm/mm. Points 3 (50 ; 7) et 5 (100 ; 8) : pente \((8 - 7)/50 = 0{,}02\) µm/mm, la même : les deux droites sont parallèles. En \(x = 0\), elles passent à \(3 - 0{,}5 = 2{,}5\) µm et à \(7 - 1 = 6\) µm : le point 1 (3 µm) est bien entre elles. Écart entre les deux droites (mesuré en \(x = 50\) : \(3 + 0{,}5 = 3{,}5\) µm et 7 µm ; la pente est si faible que l'écart vertical est la distance perpendiculaire) : 3,5 µm. La zone touche les points 2, 3 et 4 alternativement en bas, en haut, en bas : on ne peut ni la translater ni la faire tourner sans l'élargir, c'est la zone minimale. Défaut de rectitude : 3,5 µm \(\leq\) 4 µm, la génératrice est conforme.</p>
    <p><strong>Q3.</strong> La tolérance de rectitude est définie par la plus petite zone comprise entre deux droites parallèles qui contient la ligne réelle : c'est le critère minimax. Les moindres carrés donnent une valeur supérieure ou égale (4,1 µm contre 3,5 µm ici) et peuvent donc refuser à tort une pièce conforme ; on les emploie par défaut parce que le calcul est direct et unique et qu'il est peu sensible à un point isolé. Près de la limite, on refait l'évaluation selon le critère prescrit.</p>
    <p><strong>Q4.</strong> Avec Ⓔ, la surface ne doit pas franchir le cylindre parfait de diamètre maximal (maximum de matière : \(d_{max} = 25{,}000\) mm pour h6). On associe l'élément tangent extérieur à la matière, c'est-à-dire le plus petit cylindre circonscrit au nuage de points, dont le diamètre doit rester inférieur ou égal à 25,000 mm. Il simule la bague (ou la mâchoire) côté ENTRE ; la taille locale minimale se vérifie à part, comme avec le côté N'ENTRE PAS.</p>
    <p><strong>Q5.</strong> Non : un défaut situé entre deux points palpés passe inaperçu, et cinq points ne révèlent ni une ondulation ni une rugosité de la génératrice. On multiplie les points (palpage en continu), on les répartit sur toute la longueur, et pour le cylindre on palpe plusieurs génératrices et plusieurs sections ; le nombre et la répartition des points font partie de l'incertitude de mesure.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Bras de robot léger : du matériau à la pièce contrôlée</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>produit–procédé–matériau</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un robot de manutention léger possède un bras de longueur \(L = 400\) mm, modélisé par une poutre encastrée à une extrémité et chargée à l'autre par un effort \(F = 50\) N (préhenseur, pièce et effets dynamiques). Pour la précision de positionnement, la flèche en bout doit rester inférieure à \(\delta = 0{,}5\) mm. On rappelle la flèche d'une console : \(\delta = F L^3/(3\,E\,I)\). Le bras porte à chaque extrémité un bossage percé d'un alésage \(\varnothing\) 12 H7 ; les deux axes sont parallèles et distants de 400 mm. Le programme de production prévoit 12 000 bras au total, livrés par lots de 500 par mois.
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
      <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Matériau</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">ρ (kg/m³)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">E (GPa)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">σ<sub>f</sub> (MPa)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">C<sub>m</sub> (€/kg)</th></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Alliage d'aluminium 6061 T6</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">2 700</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">70</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">240</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">4</td></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Acier 42CrMo4 trempé-revenu</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">7 850</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">210</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">750</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">1,5</td></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Carbone/époxyde (fibres surtout axiales)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">1 550</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">100</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">600</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">45</td></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Polyamide chargé 30 % de verre</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">1 360</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">9</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">120</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">5</td></tr>
    </table></div>
  </div>

  <p class="exo-part">Partie A — Choix du matériau</p>
  <div class="q"><strong>A1.</strong> Le bras est un tube mince de rayon moyen \(R = 15\) mm imposé (passage des câbles), d'épaisseur \(t\) libre (\(t \ll R\)) : \(I \approx \pi R^3 t\) et \(m \approx 2\pi R\,t\,L\,\rho\). Montrer que \(m = \dfrac{2 S^* L^4}{3 R^2}\,\dfrac{\rho}{E}\) avec \(S^* = F/\delta\). Quel est l'indice de performance ?</div>
  <div class="q"><strong>A2.</strong> Si l'on choisissait une barre pleine de rayon \(r\) libre, quel serait l'indice ? Expliquer la différence.</div>
  <div class="q"><strong>A3.</strong> Calculer l'épaisseur \(t\) et la masse du tube pour chaque matériau. Commenter, en particulier les cas de l'acier et du polyamide chargé.</div>
  <div class="q"><strong>A4.</strong> Vérifier la résistance du tube en alliage d'aluminium.</div>
  <div class="q"><strong>A5.</strong> Le bureau d'études écarte le composite au profit de l'aluminium. Donner deux arguments.</div>

  <p class="exo-part">Partie B — Procédé d'obtention</p>
  <div class="q"><strong>B1.</strong> Deux solutions sont étudiées. S1 : tube filé en EN AW-6061 et deux embouts usinés soudés (\(C_{o1} = 2\,000\) €, \(C_{v1} = 19\) € par bras). S2 : bras monobloc moulé sous pression en EN AC-AlSi9Cu3, avec reprise d'usinage (\(C_{o2} = 48\,000\) €, \(C_{v2} = 6\) € par bras). Calculer le seuil de rentabilité et choisir.</div>
  <div class="q"><strong>B2.</strong> La section tubulaire fermée est-elle adaptée au moulage sous pression ? Proposer une adaptation de la forme du bras et citer trois règles de tracé à respecter.</div>
  <div class="q"><strong>B3.</strong> Les alésages \(\varnothing\) 12 H7 peuvent-ils être obtenus bruts de fonderie ? Conséquence sur le brut ?</div>

  <p class="exo-part">Partie C — Gamme et usinage</p>
  <div class="q"><strong>C1.</strong> Proposer une gamme de fabrication du bras moulé (du brut à la pièce contrôlée), sachant qu'il reçoit une anodisation.</div>
  <div class="q"><strong>C2.</strong> En phase d'usinage, les deux alésages et les faces des bossages sont réalisés dans la même prise. Pourquoi ? Une machine à 3 axes suffit-elle ? Proposer une mise en position.</div>
  <div class="q"><strong>C3.</strong> Les faces des bossages sont surfacées avec une fraise \(\varnothing\) 20 mm à 3 dents : \(V_c = 300\) m/min, \(f_z = 0{,}08\) mm/dent, \(a_p = 1{,}5\) mm, \(a_e = 16\) mm, \(k_c = 800\) N/mm². Calculer \(N\), \(V_f\), le débit de copeaux et la puissance de coupe. Commenter. <em>(Question au-delà du programme, qui limite l'analyse des procédés à une approche qualitative.)</em></div>

  <p class="exo-part">Partie D — Contrôle</p>
  <div class="q"><strong>D1.</strong> L'intervalle IT 7 vaut 18 µm entre 10 et 18 mm. Donner les diamètres du tampon lisse et ce que vérifie chaque côté.</div>
  <div class="q"><strong>D2.</strong> Le dessin impose la localisation de l'axe du second alésage, à 400 mm (cote encadrée) de l'axe du premier pris comme référence, dans une zone cylindrique de \(\varnothing\) 0,1 mm. Pourquoi un pied à coulisse ne convient-il pas ? Décrire le contrôle sur machine à mesurer tridimensionnelle (incertitude 2 µm).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Raideur en bout : \(S = 3EI/L^3 = 3E\pi R^3 t/L^3 \geq S^*\), donc \(t \geq S^* L^3/(3\pi E R^3)\). En reportant dans la masse :</p>
    <div class="formula">$$m = 2\pi R\,L\,\rho\,t \;\geq\; 2\pi R\,L\,\rho\,\frac{S^* L^3}{3\pi E R^3}$$ $$m \;\geq\; \frac{2\,S^* L^4}{3\,R^2}\,\frac{\rho}{E}$$</div>
    <p>Rayon et longueur étant imposés, il faut maximiser <strong>\(E/\rho\)</strong>.</p>
    <p><strong>A2.</strong> Barre pleine : \(I = \pi r^4/4\), \(m = \pi r^2 L \rho\). La contrainte donne \(r^2 \geq (4 S^* L^3/(3\pi E))^{1/2}\), d'où \(m \propto \rho/E^{1/2}\) : indice <strong>\(E^{1/2}/\rho\)</strong>. Le paramètre libre n'intervient pas avec la même puissance dans \(I\) et dans \(m\) : linéairement dans les deux pour l'épaisseur du tube, à la puissance 4 dans \(I\) et 2 dans \(m\) pour le rayon de la barre. L'indice dépend du paramètre libre, pas seulement du chargement.</p>
    <p><strong>A3.</strong> \(S^* = 50/0{,}5\cdot 10^{-3} = 10^5\) N/m. Numériquement, \(t = 2{,}01\cdot 10^8/E\) (m, avec \(E\) en Pa) et \(m = 7{,}59\cdot 10^6\,\rho/E\) (kg).</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
      <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Matériau</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">t (mm)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">m (g)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Coût matière (€)</th></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Aluminium 6061</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">2,9</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">293</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">1,2</td></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Acier 42CrMo4</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,96</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">284</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,4</td></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Carbone/époxyde</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">2,0</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">118</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">5,3</td></tr>
      <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">PA chargé verre</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">22 (&gt; R !)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">—</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">—</td></tr>
    </table></div>
    <p>Aluminium et acier donnent la même masse (même \(E/\rho\)), mais une paroi d'acier de moins de 1 mm est délicate : flambement local, sensibilité aux chocs, difficulté de fabrication et de soudage. Le composite est 2,5 fois plus léger. Pour le polyamide chargé, l'épaisseur calculée dépasse le rayon : l'hypothèse de tube mince est absurde, même une barre pleine ne suffirait pas → <strong>éliminé</strong> (module trop faible).</p>
    <p><strong>A4.</strong> Moment maximal à l'encastrement \(M = F L = 20\) N·m ; \(I = \pi R^3 t \approx 3{,}05\cdot 10^{-8}\) m⁴.</p>
    <div class="formula">$$\sigma_{max} = \frac{M\,R}{I} = \frac{20 \times 0{,}015}{3{,}05\cdot 10^{-8}}$$ $$\sigma_{max} \approx 9{,}8\ \text{MPa} \;\ll\; 240\ \text{MPa}$$</div>
    <p>La <strong>rigidité</strong> dimensionne le bras, pas la résistance.</p>
    <p><strong>A5.</strong> Coût matière environ 4,5 fois plus élevé, et procédés composites (drapage, cuisson, collage des embouts) lents pour 12 000 bras ; l'aluminium permet d'usiner directement les bossages et alésages, se recycle facilement et tolère mieux les chocs. Le gain de 175 g ne compense pas ces handicaps pour un robot léger.</p>
    <p><strong>B1.</strong></p>
    <div class="formula">$$N^* = \frac{48\,000 - 2\,000}{19 - 6} \approx 3\,540\ \text{bras}$$</div>
    <p>La production totale de 12 000 bras dépasse largement ce seuil : on retient le <strong>moulage sous pression</strong> (coût total ≈ 120 000 € contre ≈ 230 000 €). L'alliage de fonderie a un module voisin (≈ 70 à 75 GPa) et une limite d'élasticité (≈ 150 MPa) encore très supérieure à 10 MPa : l'étude de la partie A reste valable.</p>
    <p><strong>B2.</strong> Non : l'intérieur d'un tube long et fermé aux deux bouts par les bossages exigerait un noyau impossible à extraire (ou des tiroirs très coûteux). On remplace le tube par une <strong>section ouverte nervurée</strong> (profil en U ou en I) de même moment quadratique, démoulable dans la direction d'ouverture : le changement de procédé impose un changement de forme (les câbles passent alors dans le creux du profil, fermé par un capot rapporté). Règles : <strong>épaisseurs régulières</strong> (≈ 3 mm, nervures un peu plus minces), <strong>dépouilles</strong> de 1° à 2° sur les faces parallèles à l'ouverture, <strong>congés</strong> généreux ; plan de joint dans le plan médian du bras.</p>
    <p><strong>B3.</strong> Non : le moulage sous pression tient au mieux IT 11 à 13, loin d'IT 7. On prévoit des alésages bruts plus petits (ou pleins) avec une <strong>surépaisseur d'usinage</strong> d'environ 0,5 à 1 mm sur les alésages et les faces des bossages.</p>
    <p><strong>C1.</strong> 10 : moulage sous pression ; 20 : détourage à la presse (attaques, évents, bavures), ébavurage, grenaillage ; 30 : contrôle du brut (aspect, cotes de mise en position, porosités par radiographie sur échantillon) ; 40 : usinage sur centre CN — surfaçage des faces des bossages, perçage puis alésage \(\varnothing\) 12 H7 des deux bossages ; 50 : anodisation, en <strong>masquant</strong> les alésages (la couche d'oxyde, de l'ordre de 10 à 20 µm, consommerait l'intervalle de tolérance) ; 60 : contrôle final.</p>
    <p><strong>C2.</strong> L'entraxe et le parallélisme relient les deux alésages : réalisés dans la même prise, leur position relative ne dépend que de la précision de la machine, pas d'une reprise. Les axes des alésages sont parallèles et les faces des bossages perpendiculaires à ces axes : une seule direction d'accès : une machine à <strong>3 axes</strong> (X, Y, Z) suffit, broche verticale parallèle aux axes des alésages. Mise en position sur le brut : appui plan 1-2-3 sur la grande face inférieure du bras, orientation 4-5 sur un flanc latéral (dans la direction de l'entraxe), butée 6 en bout ; serrage par brides au droit des appuis, hors bossages.</p>
    <p><strong>C3.</strong> \(N = 1000 \times 300/(\pi \times 20) \approx 4\,775\) tr/min ; \(V_f = f_z\,Z\,N = 0{,}08 \times 3 \times 4\,775 \approx 1\,146\) mm/min ; \(Q = a_p\,a_e\,V_f = 1{,}5 \times 16 \times 1\,146 \approx 27\,500\) mm³/min, soit 27,5 cm³/min.</p>
    <div class="formula">$$P_c = k_c\,Q = 800 \times \frac{27\,500}{60}\ \text{N·mm/s}$$ $$P_c \approx 3{,}7\cdot 10^5\ \text{N·mm/s} \approx 370\ \text{W}$$</div>
    <p>Puissance très faible : en finition, et sur un alliage d'aluminium, la puissance n'est jamais limitante ; ce sont la précision et l'état de surface qui guident le choix des conditions de coupe.</p>
    <p><strong>D1.</strong> H7 : écart inférieur nul ; l'alésage doit être compris entre 12,000 et 12,018 mm. Côté <strong>ENTRE</strong> \(\varnothing\) 12,000 mm : il doit entrer sur toute la longueur, ce qui vérifie qu'aucun point ne dépasse l'enveloppe au maximum de matière. Côté <strong>N'ENTRE PAS</strong> \(\varnothing\) 12,018 mm : il ne doit pas entrer, ce qui vérifie que la taille ne dépasse pas la limite au minimum de matière.</p>
    <p><strong>D2.</strong> La spécification porte sur des <strong>éléments dérivés</strong> (des axes, obtenus par association de cylindres) et sur une zone cylindrique : un pied à coulisse mesure entre deux surfaces réelles, sans association ni construction, et sa résolution (0,02 mm) est trop grossière. Sur MMT : palper l'alésage de référence (plusieurs sections bien réparties), lui associer un cylindre selon le critère prescrit et en construire l'axe ; palper de même le second alésage et construire son axe ; vérifier que cet axe reste dans le cylindre de \(\varnothing\) 0,1 mm centré sur la position théorique (400 mm de l'axe de référence). L'incertitude de 2 µm est bien inférieure au dixième de la zone (10 µm) : le moyen est adapté.</p>
  </div>
</div>
