<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre rassemble les capacités de 2ᵉ année sur les matériaux et les procédés : analyser un compromis produit–procédés–matériaux (A5, semestre S3), concevoir une pièce en optimisant ce triptyque (F3, S4), intégrer les contraintes d'écoconception (F1, S4), choisir et ordonnancer les procédés, évaluer leur capacité à réaliser une pièce métallique ou des opérations de finition, contrôler la conformité d'un produit (G2, S3). Il s'appuie sur les chapitres de fabrication de 1ʳᵉ année, dont il ne reprend pas le détail. Comme le demande le programme, l'analyse des procédés reste qualitative.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Démarche produit–procédés–matériaux</strong> ; influence du procédé sur la géométrie du produit (F3, S4) (§1).</li>
        <li><strong>Classes de matériaux</strong>, domaines généraux d'application, <strong>propriétés physiques</strong> (mécaniques, thermiques, électriques, magnétiques, acoustiques) ; caractérisation par les essais de traction, de dureté, de résilience et de fatigue (A5, S3) (§2).</li>
        <li><strong>Diagrammes d'Ashby</strong> (A5, S3) (§3).</li>
        <li><strong>Méthode de choix</strong> d'un matériau (fonction, objectif, contraintes, paramètres libres), indicateur de performances, résistance et déplacement (F3, S4) (§4).</li>
        <li><strong>Impact environnemental</strong> et <strong>écoconception</strong> : cycle de vie, leviers de réduction de l'impact (A5, S3 ; F1, S4) (§5).</li>
        <li><strong>Pièces plastiques et composites</strong> : injection, mise en forme des composites, règles de conception (G2, rappel S2) (§6).</li>
        <li><strong>Pièces métalliques</strong> : déformation plastique, moulage, découpage, procédés additifs, soudage ; traitements thermiques volumiques et surfaciques des aciers (aspects fonctionnels) ; domaines d'application et règles de conception (G2, S3) (§7).</li>
        <li><strong>Critères de choix des procédés</strong> : forme, matériau, coûts, taille de série, impact environnemental (G2, S3) (§7).</li>
        <li><strong>Opérations de finition</strong> : génération des surfaces par enlèvement de matière, choix d'une cinématique de machine (tours 2 et 3 axes, centres d'usinage 3, 4 et 5 axes), choix des phases, choix d'une mise en position (G2, S3) (§8 ; au §9, comparaison des qualités et des états de surface accessibles).</li>
        <li><strong>Contrôle de conformité</strong> : dispositifs de contrôle, nuages de points, méthodes d'association pour le plan, la droite, le cercle et le cylindre (G2, S3) (§10).</li>
      </ul>
      <p>Hors programme, regroupé en fin de chapitre : les <strong>désignations normalisées</strong> des matériaux, le critère de rupture par la <strong>ténacité</strong>, la <strong>capabilité</strong> d'un procédé. Non exigibles : la définition détaillée des phases (la gamme du §8 est une illustration), les gammes de mesure, l'étude métallurgique des traitements thermiques ; aucune méthode normalisée d'écoconception n'est évaluée. Le programme limite l'analyse des procédés à une approche qualitative : les calculs d'effort de découpage (§7), d'effort et de puissance de coupe et de rugosité théorique (§9) vont au-delà ; ils sont donnés pour les ordres de grandeur et les travaux pratiques, et un sujet fournirait les relations. Pour la mise en position, seul le symbole d'élimination d'un degré de liberté en translation (normale de repérage) est utilisé.</p>

<div class="course-section">
  <div class="sec-num">§1 · LA DÉMARCHE PRODUIT–PROCÉDÉ–MATÉRIAU</div>
  <h2>Concevoir une pièce, c'est faire trois choix à la fois</h2>
  <div class="intro">Une pièce n'est vraiment définie que lorsqu'on connaît sa <strong>forme</strong>, la <strong>matière</strong> dont elle est faite et la <strong>manière de l'obtenir</strong>. Ces trois décisions ne se prennent pas l'une après l'autre : chacune restreint les deux autres. Le but de ce chapitre de 2ᵉ année est d'apprendre à <strong>justifier</strong> un couple matériau–procédé, puis à organiser la fabrication jusqu'à la pièce contrôlée.</div>

  <h3>Les trois pôles</h3>
  <div class="def-box">
    <ul style="margin:.3rem 0">
      <li><strong>Produit</strong> : ce que la pièce doit faire (fonctions, efforts, milieu, durée de vie), sa <strong>géométrie</strong> (formes, dimensions, spécifications) et son <strong>contexte de production</strong> (taille de série, cadence, coût visé).</li>
      <li><strong>Matériau</strong> : un ensemble de propriétés (mécaniques, physiques, chimiques), un coût et un impact environnemental.</li>
      <li><strong>Procédé</strong> : la suite d'opérations qui transforme une matière première en pièce conforme (obtention du brut, traitements, finition, contrôle).</li>
    </ul>
  </div>

  <figure class="schema" style="max-width:360px">
  <svg viewBox="0 0 340 200" role="img" aria-label="Triangle produit, matériau, procédé : chaque pôle contraint les deux autres, au service du cahier des charges">

  <figcaption>Le triptyque : on ne choisit pas un matériau sans penser au procédé qui le mettra en forme, ni un procédé sans tenir compte de la géométrie et de la taille de série.</figcaption>
  </figure>

  <div class="prop-box">
    <strong>Quelques couplages typiques.</strong>
    <ul style="margin:.3rem 0">
      <li>Choisir l'<strong>injection</strong> impose le plus souvent un thermoplastique (ou un composite à matrice thermoplastique) et des parois minces d'épaisseur régulière ; les thermodurcissables s'injectent aussi, dans un moule chaud où ils réticulent.</li>
      <li>Choisir un <strong>acier trempé</strong> impose de terminer les surfaces fonctionnelles par <strong>rectification</strong>, après le traitement.</li>
      <li>Une <strong>petite série</strong> exclut les outillages coûteux (moule métallique, matrice d'estampage) ; une <strong>grande série</strong> les rentabilise.</li>
      <li>Changer de matériau oblige souvent à <strong>redessiner</strong> la pièce : une pièce en polymère n'a pas la forme de la même pièce en acier.</li>
    </ul>
  </div>

  <h3>Vocabulaire de la fabrication</h3>
  <div class="def-box">
    <ul style="margin:.3rem 0">
      <li><strong>Brut</strong> : pièce issue de l'obtention (moulée, forgée, découpée, débitée dans une barre…), avec des <strong>surépaisseurs</strong> sur les surfaces à finir.</li>
      <li><strong>Phase</strong> : ensemble des opérations réalisées sur <strong>un même poste</strong> de travail ; <strong>sous-phase</strong> : opérations faites sans changer la mise en position de la pièce.</li>
      <li><strong>Opération</strong> : travail d'un outil sur une surface (dressage, perçage, alésage…).</li>
      <li><strong>Gamme de fabrication</strong> : liste ordonnée des phases qui mène du brut à la pièce finie.</li>
    </ul>
  </div>
  <div class="notice">Ce chapitre fait la <strong>synthèse</strong> des chapitres de 1ʳᵉ année « Moulage : fonderie, injection plastique et composites », « Mise en forme par déformation et découpage », « Usinage », « Assemblages : soudage, rivetage, collage, vissage », « Fabrication additive », « Traitements thermiques », « Cotation &amp; tolérances » et « Contrôle non destructif ». Leur contenu n'est pas repris ici : on apprend surtout à <strong>choisir</strong> et à <strong>argumenter</strong>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · FAMILLES DE MATÉRIAUX ET PROPRIÉTÉS</div>
  <h2>Cinq grandes familles, des propriétés qui s'étalent sur des décades</h2>
  <div class="intro">Les matériaux de construction se rangent en familles dont les membres partagent une structure (liaisons atomiques, organisation) et donc des propriétés voisines. Connaître les ordres de grandeur de chaque famille permet d'éliminer très vite les mauvais candidats.</div>

  <h3>Les familles</h3>
  <div class="prop-box">
    <ul style="margin:.3rem 0">
      <li><strong>Métaux et alliages ferreux</strong> : <strong>aciers</strong> (fer + au plus 2 % de carbone ; non alliés, faiblement alliés, fortement alliés dont les <strong>inoxydables</strong>, qui contiennent au moins 10,5 % de chrome) et <strong>fontes</strong> (plus de 2 % de carbone, excellente coulabilité). Rigides, résistants, ductiles (sauf les fontes à graphite lamellaire), bon marché, faciles à souder (aciers peu chargés en carbone) et recyclables ; sensibles à la corrosion.</li>
      <li><strong>Métaux non ferreux</strong> : alliages d'<strong>aluminium</strong> (légers, bons conducteurs, filables, moulables, très usinables), de <strong>cuivre</strong> (laitons Cu-Zn, bronzes Cu-Sn : conductivité, frottement, corrosion), de <strong>titane</strong> (résistance élevée pour une densité moyenne, biocompatibles, chers), de <strong>magnésium</strong> (très légers) et de <strong>zinc</strong> (zamaks, moulage sous pression).</li>
      <li><strong>Polymères</strong> : <strong>thermoplastiques</strong> (chaînes non pontées qui ramollissent à chaud : on peut les remettre en forme et les recycler — PE, PP, PA, PVC, PMMA, PC, ABS, POM, PEEK), <strong>thermodurcissables</strong> (réseau tridimensionnel créé par une réaction irréversible : époxydes, polyesters insaturés, phénoliques) et <strong>élastomères</strong> (réseau faiblement ponté, très grandes déformations élastiques : caoutchoucs, EPDM, silicones). Légers, isolants et faciles à mettre en forme ; en revanche peu rigides, ils perdent vite leurs propriétés quand la température monte et se déforment lentement sous une charge constante (<strong>fluage</strong>).</li>
      <li><strong>Céramiques et verres</strong> : alumine Al₂O₃, zircone ZrO₂, carbure de silicium SiC, nitrure de silicium Si₃N₄, carbure de tungstène (dans les carbures métalliques des outils), verres. Très rigides, très durs et inertes chimiquement, mais <strong>fragiles</strong> (faible ténacité). Les céramiques techniques, réfractaires, ne se coulent ni ne se déforment : on les obtient à partir de poudres compactées puis chauffées sous leur point de fusion (<strong>frittage</strong>). Les verres, eux, sont fondus puis mis en forme à l'état visqueux (coulée, flottage, soufflage, pressage, fibrage).</li>
      <li><strong>Composites</strong> : association d'une <strong>matrice</strong> et d'un <strong>renfort</strong> issus de familles différentes. CMO (matrice organique + fibres de verre, de carbone ou d'aramide), CMM (matrice métallique), CMC (matrice céramique) ; le bois est un composite naturel. Anisotropes, avec d'excellentes propriétés <strong>rapportées à la masse</strong>.</li>
    </ul>
  </div>

  <h3>Propriétés usuelles</h3>
  <div class="def-box">
    <ul style="margin:.3rem 0">
      <li><strong>Masse volumique</strong> \(\rho\) (kg/m³).</li>
      <li><strong>Module d'Young</strong> \(E\) (GPa) : pente de la loi de Hooke dans le domaine élastique, il mesure la <strong>rigidité</strong> du matériau.
        <div class="formula">$$\sigma = E\,\varepsilon$$</div></li>
      <li><strong>Limite d'élasticité</strong> \(R_e\) (ou \(R_{p0,2}\)) et <strong>résistance à la traction</strong> \(R_m\) (MPa) ; <strong>allongement à rupture</strong> \(A\,\%\), qui traduit la ductilité. On note \(\sigma_f\) la <strong>résistance</strong> retenue pour le dimensionnement, c'est-à-dire la contrainte à ne pas dépasser (\(R_e\) pour un matériau ductile, la contrainte de rupture pour un matériau fragile), avant tout coefficient de sécurité.</li>
      <li><strong>Ténacité</strong> \(K_{Ic}\) (MPa·√m) : aptitude à résister à la propagation brutale d'une fissure ; faible pour les céramiques, les verres et les polymères rigides, élevée pour les métaux ductiles. Le critère de rupture qui l'emploie est hors programme (dernière section).</li>
      <li><strong>Dureté</strong> (Brinell HB, Vickers HV, Rockwell HRC), <strong>conductivité thermique</strong> \(\lambda\) (W·m⁻¹·K⁻¹), <strong>conductivité électrique</strong>, <strong>coefficient de dilatation</strong> \(\alpha\) (K⁻¹), <strong>température maximale d'emploi</strong>.</li>
      <li><strong>Propriétés électriques</strong> : résistivité (conducteurs : cuivre, aluminium ; isolants : polymères, céramiques, verres). <strong>Magnétiques</strong> : aptitude à canaliser un champ magnétique (tôles d'acier au silicium et ferrites des moteurs et des transformateurs) ou à le créer durablement (aimants permanents aux terres rares). <strong>Acoustiques</strong> : aptitude à amortir les vibrations (fontes à graphite lamellaire, élastomères) ou à absorber le bruit (mousses, matériaux poreux).</li>
      <li><strong>Coût massique</strong> \(C_m\) (€/kg) : le coût matière d'une pièce de volume \(V\) vaut \(C_m\,\rho\,V\).</li>
      <li><strong>Impact environnemental</strong> : <strong>énergie grise</strong> (énergie dépensée pour produire 1 kg de matériau, en MJ/kg), empreinte carbone (kg équivalent CO₂ par kg), recyclabilité. L'<strong>analyse du cycle de vie</strong> (ACV) additionne extraction, fabrication, transport, usage et fin de vie : pour un véhicule, alléger réduit surtout la phase d'usage.</li>
    </ul>
  </div>

  <p style="font-size:.85rem;opacity:.8">* contrainte de rupture (matériau sans palier plastique) ; ** selon l'orientation des plis (unidirectionnel dans l'axe : jusqu'à ≈ 150 GPa).</p>
  <div class="notice"><strong>À retenir</strong> : l'acier, l'aluminium et le titane ont des rapports \(E/\rho\) presque identiques (≈ 25 MJ/kg) ; seuls les composites à fibres longues font nettement mieux. Les polymères sont environ <strong>100 fois moins rigides</strong> que les métaux, les élastomères encore 100 à 1 000 fois moins.</div>


  <h3>Caractériser un matériau : les essais</h3>
  <p>Les valeurs du tableau sont mesurées par des <strong>essais normalisés</strong>, sur des éprouvettes prélevées dans le matériau. Le programme en retient quatre : il faut savoir ce que chacun mesure et à quel besoin de conception il répond.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Essai</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Principe</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Grandeur mesurée</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Utile pour</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Traction</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">éprouvette étirée lentement jusqu'à rupture ; effort et allongement enregistrés</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(E\), \(R_e\) (ou \(R_{p0,2}\)), \(R_m\), \(A\,\%\)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rigidité, résistance, ductilité (chapitre Résistance des matériaux, §6)</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Dureté</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">pénétrateur très dur enfoncé sous une charge fixée : bille (Brinell), pyramide en diamant (Vickers), cône ou bille dont on mesure l'enfoncement (Rockwell)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">taille ou profondeur de l'empreinte : HB, HV, HRC</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">résistance à l'usure et au marquage ; contrôle rapide d'un traitement thermique, sur la pièce elle-même</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Résilience (Charpy)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">un mouton-pendule rompt d'un seul choc une éprouvette entaillée</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">énergie absorbée par la rupture, en joules (perte de hauteur du pendule)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">tenue aux chocs ; température de transition ductile-fragile</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Fatigue</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">éprouvettes soumises à une contrainte alternée (par exemple en flexion rotative), à plusieurs amplitudes, jusqu'à rupture</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">nombre de cycles à rupture pour chaque amplitude : courbe de Wöhler, limite d'endurance \(\sigma_D\)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">pièces sous charges répétées : arbres, bielles, ressorts, roues</td></tr>
  </table></div>
  <ul>
    <li><strong>Dureté.</strong> L'essai ne laisse qu'une petite empreinte : on le pratique sur la pièce finie. Pour les aciers, il donne une estimation de la résistance, \(R_m\) (en MPa) valant environ 3,3 à 3,5 fois la dureté Brinell : un acier de 200 HB a un \(R_m\) voisin de 680 MPa. L'échelle Rockwell C sert aux aciers trempés (une piste de roulement est vers 60 HRC).</li>
    <li><strong>Résilience.</strong> Quand la température baisse, les aciers de construction courants passent d'une rupture ductile (forte déformation, énergie élevée) à une rupture fragile (cassure nette, quelques joules seulement). On les choisit pour que cette <strong>transition</strong> reste sous la température minimale d'emploi : navires, ponts, engins de chantier en climat froid. Les aciers inoxydables austénitiques et les alliages d'aluminium ne présentent pas cette transition.</li>
    <li><strong>Fatigue.</strong> Une pièce peut rompre sous une contrainte alternée bien inférieure à \(R_e\), après un grand nombre de cycles : une fissure naît en surface, souvent à un défaut, et progresse un peu à chaque cycle. Pour les aciers, la courbe de Wöhler devient horizontale : sous la <strong>limite d'endurance</strong> \(\sigma_D\) (de l'ordre de 0,4 à 0,5 fois \(R_m\) sur éprouvette polie), la durée de vie est illimitée. L'<strong>état de surface</strong> compte beaucoup : rayures, entailles, gorges, corrosion la font chuter ; polissage, galetage, grenaillage ou nitruration, qui laissent la surface comprimée, l'améliorent.</li>
  </ul>

  <div class="sec-num">§3 · LES DIAGRAMMES D'ASHBY</div>
  <h2>Comparer des milliers de matériaux sur une seule carte</h2>

  <h3>Pourquoi des échelles logarithmiques ?</h3>
  <p>Les propriétés couvrent plusieurs <strong>décades</strong> (\(E\) va d'environ \(10^{-3}\) GPa pour un élastomère à \(10^{3}\) GPa pour le diamant) : seule une échelle log les fait tenir sur la même carte. Surtout, les combinaisons de type puissance y deviennent des <strong>droites</strong>.</p>

  <h3>Droites d'indice constant</h3>
  <div class="prop-box">
    Pour un indice de la forme \(M = E^{1/n}/\rho\), on a :
    <div class="formula">$$M = \frac{E^{1/n}}{\rho}$$ $$\iff\; \log E = n\,\log \rho + n\,\log M$$</div>
    Sur un diagramme \(\log E\)–\(\log \rho\), les matériaux de même indice sont donc alignés sur une droite de <strong>pente \(n\)</strong> : pente 1 pour \(E/\rho\), pente 2 pour \(E^{1/2}/\rho\), pente 3 pour \(E^{1/3}/\rho\). Translater la droite vers le haut (à pente fixée) revient à augmenter \(M\) : les candidats retenus sont ceux qui restent <strong>au-dessus</strong> de la droite.
  </div>
  <div class="def-box"><strong>Autres cartes courantes</strong> : résistance–masse volumique (\(\sigma_f\)–\(\rho\)), module–coût, ténacité–module, conductivité–dilatation, module–énergie grise… On y ajoute les contraintes de <strong>filtrage</strong> sous forme de droites horizontales ou verticales (par exemple \(R_e \geq 300\) MPa) : on ne garde que la région admissible.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Acier (210 GPa ; 7 800 kg/m³) et alliage d'aluminium (70 GPa ; 2 700 kg/m³) sont-ils équivalents en traction ? en flexion ?</span>
    <div class="content"><p>En traction (indice \(E/\rho\)) : \(210\cdot 10^9/7\,800 \approx 27\) MJ/kg contre \(70\cdot 10^9/2\,700 \approx 26\) MJ/kg : pratiquement la même droite de pente 1, les deux se valent. En flexion (indice \(E^{1/2}/\rho\), en GPa\(^{1/2}\)·m³/t) : \(\sqrt{210}/7{,}8 \approx 1{,}9\) contre \(\sqrt{70}/2{,}7 \approx 3{,}1\) : l'aluminium l'emporte nettement, car la droite de pente 2 avantage les matériaux légers.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LES INDICES DE PERFORMANCE</div>
  <h2>Traduire un cahier des charges en un critère de choix</h2>
  <div class="intro">La méthode d'Ashby remplace la question vague « quel est le meilleur matériau ? » par une question précise : <strong>quelle combinaison de propriétés rend la pièce la plus légère (ou la moins chère) tout en respectant ses contraintes ?</strong> Cette combinaison est l'<strong>indice de performance</strong>.</div>

  <h3>Les quatre éléments de l'analyse</h3>
  <div class="def-box">
    <ul style="margin:.3rem 0">
      <li><strong>Fonction</strong> : ce que fait la pièce (supporter une traction, une flexion, stocker de l'énergie, isoler…).</li>
      <li><strong>Objectif</strong> : la grandeur à minimiser ou maximiser (masse, coût, énergie stockée, encombrement…).</li>
      <li><strong>Contraintes</strong> : les conditions à respecter impérativement (raideur minimale, absence de rupture, longueur imposée, température d'emploi…).</li>
      <li><strong>Paramètres libres</strong> : ce que le concepteur peut ajuster (une section, une épaisseur… et le choix du matériau).</li>
    </ul>
  </div>
  <div class="prop-box">
    On écrit l'objectif, puis on <strong>élimine le paramètre libre</strong> grâce à la contrainte active. Il reste une <strong>équation de performance</strong> qui, le plus souvent, se sépare en trois facteurs :
    <div class="formula">$$P = f(F)\cdot g(G)\cdot h(\text{mat})$$</div>
    où \(F\) regroupe les paramètres fonctionnels (efforts, raideur…), \(G\) les paramètres géométriques imposés et \(h\) les propriétés du matériau. Les deux premiers facteurs ne dépendent pas du matériau : le meilleur matériau est celui qui optimise \(h\). On définit l'indice \(M\) de façon qu'il soit <strong>à maximiser</strong>.
  </div>

  <h3>Exemple 1 — Tirant léger et rigide</h3>
  <p>Barre de longueur \(L\) imposée, tendue par un effort \(F\), dont l'allongement ne doit pas dépasser \(\delta\) : la raideur \(S^* = F/\delta\) est imposée. La section \(A\) est libre ; on minimise la masse.</p>
  <div class="formula">$$m = \rho\,A\,L$$ $$S = \frac{E\,A}{L} \geq S^* \;\Rightarrow\; A \geq \frac{S^*\,L}{E}$$</div>
  <div class="formula">$$m \;\geq\; S^*\,L^2\,\frac{\rho}{E} \qquad\Longrightarrow\qquad M_1 = \frac{E}{\rho}$$</div>
  <p>Si la contrainte est la <strong>résistance</strong> (\(F/A \leq \sigma_f\)), on obtient de même \(m \geq F\,L\,\rho/\sigma_f\), d'où l'indice \(\sigma_f/\rho\).</p>

  <h3>Exemple 2 — Poutre légère en flexion</h3>
  <p>Poutre de longueur \(L\), de section carrée de côté \(a\) <strong>libre</strong> (la forme de la section est fixée, pas sa taille). Sa flèche sous un effort \(F\) s'écrit \(\delta = F L^3/(C\,E\,I)\), où \(C\) dépend du chargement (3 pour une console chargée en bout, 48 pour une poutre sur deux appuis chargée au milieu) et \(I = a^4/12\).</p>
  <div class="formula">$$S = \frac{C\,E\,a^4}{12\,L^3} \geq S^*$$ $$\Rightarrow\; a^2 \geq \left(\frac{12\,S^*\,L^3}{C\,E}\right)^{1/2}$$</div>
  <div class="formula">$$m = \rho\,a^2\,L \;\geq\; K\,\frac{\rho}{E^{1/2}}$$ $$\text{avec } K = \left(\frac{12\,S^*}{C}\right)^{1/2} L^{5/2}$$ $$\Longrightarrow\quad M_2 = \frac{E^{1/2}}{\rho}$$</div>
  <p>En résistance (\(\sigma_{max} = 6\,M_f/a^3 \leq \sigma_f\)), le même calcul donne \(M = \sigma_f^{2/3}/\rho\). Pour une <strong>plaque</strong> dont seule l'épaisseur est libre, on trouve \(E^{1/3}/\rho\) : plus le paramètre libre est « enfoui » dans une puissance élevée, plus les matériaux légers sont favorisés.</p>

  <h3>Exemple 3 — Volant d'inertie</h3>
  <p>On veut stocker un maximum d'énergie cinétique <strong>par unité de masse</strong> sans faire éclater le volant. Modèle simple : une <strong>jante mince</strong> de rayon \(R\) tournant à \(\omega\) ; toute la masse va à la vitesse \(v = R\,\omega\). Rayon et vitesse sont libres.</p>
  <div class="formula">$$E_c = \frac{1}{2}\,m\,v^2 \qquad \sigma = \rho\,v^2 \leq \sigma_f$$</div>
  <div class="formula">$$\frac{E_c}{m} = \frac{v^2}{2} \;\leq\; \frac{\sigma_f}{2\,\rho}$$ $$\Longrightarrow\quad M_3 = \frac{\sigma_f}{\rho}$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi la contrainte dans la jante vaut-elle \(\rho\,v^2\) ?</span>
    <div class="content"><p>Isolons une demi-jante (section \(A\)), dans le repère tournant. Un élément d'angle \(\mathrm{d}\theta\) a une masse \(\rho A R\,\mathrm{d}\theta\) et subit l'effort d'inertie d'entraînement \(\rho A R\,\mathrm{d}\theta\,R\omega^2\), radial. La résultante sur la demi-jante, selon son axe de symétrie, vaut \(\int_0^\pi \rho A R^2\omega^2 \sin\theta\,\mathrm{d}\theta = 2\rho A R^2 \omega^2\). Elle est équilibrée par les deux sections de coupure, chacune tendue par \(\sigma A\) : \(2\sigma A = 2\rho A R^2\omega^2\), soit \(\sigma = \rho R^2\omega^2 = \rho v^2\). La contrainte ne dépend ni de \(A\) ni de \(R\) séparément : seule la vitesse périphérique compte.</p></div>
  </div>

  <h3>Tableau récapitulatif (masse minimale)</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Fonction et paramètre libre</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Rigidité imposée</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Résistance imposée</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Tirant, section libre</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(E/\rho\)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(\sigma_f/\rho\)</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Poutre en flexion, taille de section libre (forme fixée)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(E^{1/2}/\rho\)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(\sigma_f^{2/3}/\rho\)</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Plaque en flexion, épaisseur libre</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(E^{1/3}/\rho\)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(\sigma_f^{1/2}/\rho\)</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Volant d'inertie, énergie par unité de masse</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">—</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">\(\sigma_f/\rho\)</td></tr>
  </table></div>
  <div class="notice"><strong>L'indice dépend du paramètre libre, pas seulement du chargement.</strong> Une poutre fléchie dont seule la largeur est libre (hauteur imposée) conduit à \(E/\rho\), et non à \(E^{1/2}/\rho\). Pour viser le <strong>coût minimal</strong>, on remplace \(\rho\) par \(C_m\,\rho\) (par exemple \(E/(C_m\rho)\)). Enfin, plusieurs objectifs ou contraintes conduisent à plusieurs indices : le choix final est un <strong>compromis</strong> qui intègre aussi le procédé, la tenue au milieu et le prix.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · ÉCOCONCEPTION</div>
  <h2>Réduire l'impact environnemental sur tout le cycle de vie</h2>
  <div class="intro">Écoconcevoir, c'est traiter l'impact environnemental comme une exigence du cahier des charges, au même titre que la fonction et le coût, et dès les premiers choix. Le matériau et le procédé y pèsent lourd, mais pas seuls : l'impact d'un produit se répartit sur tout son cycle de vie, et la phase qui domine change d'un produit à l'autre. Le programme demande une démarche raisonnée et chiffrée à partir de bases de données, sans méthode normalisée à appliquer. On s'en tient ici à la pièce (matériau, quantité de matière, procédé, fin de vie) ; l'écoconception d'une architecture (choix des constituants, énergie consommée en service) est traitée dans le chapitre Chaînes fonctionnelles : choisir et dimensionner les composants, §10.</div>

  <h3>Cycle de vie</h3>
  <div class="def-box">
    Le <strong>cycle de vie</strong> d'un produit enchaîne cinq phases : <strong>extraction et élaboration</strong> des matières, <strong>fabrication</strong> (procédés, assemblage), <strong>distribution</strong> (transport, emballage), <strong>utilisation</strong> (énergie et consommables, maintenance) et <strong>fin de vie</strong> (réemploi, recyclage, valorisation énergétique, mise en décharge). L'<strong>analyse du cycle de vie</strong> chiffre l'impact de chaque phase (énergie, émissions de gaz à effet de serre, eau, toxicité…) pour savoir où agir en priorité.
  </div>
  <p>Deux situations typiques : pour un produit qui consomme de l'énergie en service (véhicule, ascenseur, pompe, électroménager), l'<strong>utilisation</strong> domine souvent : on gagne surtout en allégeant les pièces mobiles et en améliorant le rendement. Pour un produit passif ou de courte durée (emballage, mobilier, outillage à main), <strong>matière et fabrication</strong> dominent : on gagne en réduisant la matière, en choisissant un matériau sobre et en préparant le recyclage.</p>

  <h3>Les leviers de l'écoconception</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Levier</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Exemples d'actions</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Nouveau concept</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rendre le même service autrement : location ou partage plutôt que vente, fonction assurée par le logiciel plutôt que par une pièce, produit multifonction</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Matériaux à moindre impact</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">faible énergie grise et faible empreinte carbone, matière recyclée, matériau biosourcé (bois, fibres végétales), absence de substances dangereuses</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Moins de matière</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">indices de performance (§4), sections creuses, nervures, parois minces, optimisation de forme (topologique) ; ne pas surdimensionner</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Techniques de production</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">procédés proches de la forme finale (moins de copeaux et de chutes), procédés sobres en énergie, chutes recyclées sur place, moins de rebuts</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Logistique</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">produit plus léger et moins encombrant, emballage réduit, fabrication proche de l'utilisateur</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Durée de vie</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">robustesse, pièces d'usure remplaçables, réparabilité, maintenance facilitée, conception modulaire et évolutive</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Fin de vie</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">démontage facile (vis plutôt que colle), peu de matériaux différents, plastiques marqués, matériaux recyclables ou valorisables</td></tr>
  </table></div>

  <h3>Choisir un matériau sur son énergie grise</h3>
  <p>La méthode des indices (§4) s'applique sans changement : on prend pour objectif l'énergie grise de la pièce, \(W = H_m\,m\), où \(H_m\) est l'énergie grise massique du matériau (MJ/kg), au lieu de sa masse. Pour une poutre fléchie de rigidité imposée dont la taille de section est libre, la masse minimale vaut \(K\rho/E^{1/2}\) (§4, exemple 2), d'où :</p>
  <div class="formula" data-nom="Indice d'énergie grise">$$W = K\,\frac{H_m\,\rho}{E^{1/2}} \qquad\Longrightarrow\qquad M = \frac{E^{1/2}}{H_m\,\rho}$$</div>
  <p>Ce choix se lit sur une carte d'Ashby « module – énergie grise volumique \(H_m\rho\) », avec une droite de pente 2, comme au §3.</p>
  <div class="method-box">
    <strong>Exemple — poutre légère ou poutre sobre ?</strong>
    <p>Même poutre fléchie, même rigidité, valeurs moyennes du tableau du §2 (pour le bois : 525 kg/m³, 11 GPa, 10 MJ/kg) ; masse et énergie grise rapportées à celles de la poutre en acier.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Matériau</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Masse relative \(\rho/E^{1/2}\)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Énergie grise relative \(H_m\rho/E^{1/2}\)</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">acier</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">1</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">1</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">alliage d'aluminium de première fusion</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,60</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">4,0</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">alliage d'aluminium recyclé</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,60</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,40</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">bois résineux</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,29</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,10</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">composite carbone/époxyde</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">0,29</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">2,6</td></tr>
  </table></div>
    <ol>
      <li>Le bois est, à égalité avec le composite carbone, le plus léger, et de loin le plus sobre : c'est le bon choix partout où son domaine d'emploi le permet (humidité, feu, durée de vie).</li>
      <li>L'aluminium allège de 40 %, mais sa production à partir du minerai coûte quatre fois plus d'énergie que la poutre en acier ; recyclé, il devient le meilleur des métaux.</li>
      <li>Le composite carbone est aussi léger que le bois mais très coûteux en énergie : il ne se justifie que si l'allègement est rentabilisé en service.</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Une pièce de voiture en acier (10 kg) est remplacée, à rigidité égale, par une pièce en aluminium (6 kg). Le bilan énergétique est-il favorable sur 200 000 km ?</span>
    <div class="content">
      <p>Hypothèses (ordres de grandeur à discuter) : 100 kg d'allègement font économiser environ 0,4 L de carburant aux 100 km ; un litre de carburant représente environ 35 MJ ; énergies grises de 30 MJ/kg (acier), 200 MJ/kg (aluminium de première fusion), 20 MJ/kg (aluminium recyclé).</p>
      <ol>
        <li>Fabrication : acier \(10\times 30 = 300\ \text{MJ}\) ; aluminium de première fusion \(6\times 200 = 1\,200\ \text{MJ}\), soit 900 MJ de plus ; aluminium recyclé \(6\times 20 = 120\ \text{MJ}\).</li>
        <li>Utilisation : 4 kg en moins économisent \(0{,}4\times 0{,}04\times 2\,000 = 32\ \text{L}\) sur 200 000 km, soit environ 1 100 MJ.</li>
        <li>Bilan : l'aluminium de première fusion ne rattrape son surcoût énergétique qu'en fin de vie du véhicule (gain net de 200 MJ environ) ; l'aluminium recyclé est gagnant dès la fabrication. Le résultat dépend fortement des hypothèses : c'est précisément ce que l'analyse du cycle de vie oblige à expliciter.</li>
      </ol>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : comparer des matériaux « au kilogramme ». L'aluminium a une énergie grise six à sept fois plus grande que l'acier par kilogramme, mais il en faut moins pour la même fonction. On compare toujours des solutions qui rendent le <strong>même service</strong> (même rigidité, même durée de vie) : c'est l'unité fonctionnelle de l'analyse du cycle de vie.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · INJECTION PLASTIQUE ET MISE EN FORME DES COMPOSITES</div>
  <h2>Mettre en forme les polymères et les composites</h2>
  <div class="intro">Les polymères et les composites se mettent en forme à température modérée (de l'ambiante à environ 400 °C selon la matière, bien en dessous des températures de la fonderie des métaux) et donnent directement des pièces quasi finies, souvent complexes. En contrepartie, ils imposent leurs propres <strong>règles de tracé</strong>.</div>

  <h3>Injection des thermoplastiques</h3>
  <div class="def-box">La matière arrive en granulés par une trémie. Une vis, dite de <strong>plastification</strong>, tourne dans un cylindre chauffé, le <strong>fourreau</strong> : le chauffage et le cisaillement la fondent et l'homogénéisent, et en tournant la vis recule en constituant devant elle une réserve de matière fondue, la <strong>dose</strong>. Elle avance alors d'un coup, comme le piston d'une seringue, et pousse cette dose à travers la <strong>buse</strong> dans l'<strong>empreinte</strong> d'un moule métallique régulé en température. Le moule est fait de deux demi-moules, côté fixe et côté mobile, qui se touchent suivant le <strong>plan de joint</strong>.</div>

  <figcaption>Presse à injecter (schéma de principe). Le moule est maintenu fermé par une force de fermeture supérieure à l'effort de la matière sur le plan de joint.</figcaption>
  </figure>

  <div class="prop-box">
    <strong>Cycle d'injection</strong> (de quelques secondes à environ une minute) : (1) fermeture et verrouillage du moule ; (2) <strong>injection</strong> rapide ; (3) <strong>maintien</strong> en pression pour compenser le retrait ; (4) <strong>refroidissement</strong> (pendant lequel la vis dose la matière du cycle suivant) ; (5) ouverture et <strong>éjection</strong>. La force de fermeture doit vaincre la pression de la matière, qui s'exerce sur la surface <strong>projetée</strong> \(S_p\) de la pièce (et de ses canaux) sur le plan de joint :
    <div class="formula">$$F_f \;\geq\; p_e\,S_p$$</div>
    où \(p_e\), pression dans l'empreinte, vaut typiquement quelques dizaines de MPa. Le refroidissement, limité par la <strong>diffusion thermique</strong> (diffusivité \(a\)), dure d'autant plus que la paroi est épaisse :
    <div class="formula">$$t_r \;\propto\; \frac{e^2}{a}$$</div>
    Doubler l'épaisseur multiplie le temps de refroidissement, donc le temps de cycle, par environ 4.
  </div>

  <h3>Règles de tracé d'une pièce injectée</h3>
  <ul>
    <li><strong>Épaisseurs faibles et régulières</strong> (1 à 4 mm) : une surépaisseur refroidit plus lentement et crée retassures, vides et déformations.</li>
    <li><strong>Dépouilles</strong> de 0,5° à 2° sur les faces parallèles à la direction d'ouverture, pour démouler sans frotter.</li>
    <li><strong>Congés</strong> partout : meilleur écoulement, moins de concentrations de contraintes.</li>
    <li><strong>Nervures</strong> (épaisseur ≈ 0,5 à 0,7 fois celle de la paroi) plutôt qu'une paroi épaisse pour rigidifier.</li>
    <li>Pas de <strong>contre-dépouille</strong> si possible : sinon il faut des tiroirs ou des noyaux mobiles, et le moule coûte beaucoup plus cher.</li>
    <li><strong>Plan de joint</strong> placé sur un contour peu visible (il laisse une ligne, voire une bavure) ; <strong>retrait</strong> de 0,5 à 2 % à prévoir dans l'empreinte (plus fort pour les polymères semi-cristallins).</li>
  </ul>
  <div class="notice"><strong>Économie</strong> : un moule d'injection coûte de quelques dizaines à plusieurs centaines de milliers d'euros, mais le coût variable par pièce est très faible : procédé de <strong>grande série</strong> (au-delà de quelques milliers à quelques dizaines de milliers de pièces), précis (IT 9 à 12) et sans finition. Les autres procédés de plasturgie : <strong>extrusion</strong> (profilés, tubes, films en continu), <strong>extrusion-soufflage</strong> (flacons, réservoirs), <strong>thermoformage</strong> (plaques chauffées puis formées : barquettes, carénages), <strong>rotomoulage</strong> (grands corps creux).</div>

  <h3>Composites à matrice organique</h3>
  <div class="def-box">
    <ul style="margin:.3rem 0">
      <li><strong>Matrice</strong> : elle lie les fibres, leur transmet les efforts et les protège — thermodurcissable (époxyde, polyester, vinylester) ou thermoplastique (PA, PP, PEEK).</li>
      <li><strong>Renfort</strong> : il porte les efforts — fibres de <strong>verre</strong> (bon marché), de <strong>carbone</strong> (très rigides et légères, chères), d'<strong>aramide</strong> (tenue aux chocs) ; sous forme de mat (fibres coupées disposées au hasard), de tissu, de nappe unidirectionnelle ou de <strong>préimprégné</strong> (renfort déjà enduit de résine non polymérisée).</li>
      <li><strong>Stratification</strong> : on empile des plis orientés (0°, ±45°, 90°…) pour adapter la rigidité à la direction des efforts ; un empilement <strong>symétrique</strong> évite le gauchissement au refroidissement.</li>
    </ul>
    Dans le sens des fibres, pour une fraction volumique de fibres \(V_f\), la <strong>loi des mélanges</strong> donne :
    <div class="formula">$$E_{\parallel} \approx V_f\,E_f + (1-V_f)\,E_m$$ $$\rho_c = V_f\,\rho_f + (1-V_f)\,\rho_m$$</div>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Procédé</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Principe</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">V<sub>f</sub> typique</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Série</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Remarques</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Moulage au contact</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">moule ouvert ; renforts imprégnés de résine au rouleau, couche par couche</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">≈ 30 %</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">unitaire, petite</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">outillage minimal ; une seule face lisse ; émissions de solvants</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Projection simultanée</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">fibres coupées et résine projetées ensemble sur le moule</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">20 – 30 %</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">petite, moyenne</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">grandes coques simples, propriétés modestes</td></tr>

    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">RTM (moulage par transfert de résine)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">renforts placés dans un moule fermé rigide, résine injectée</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">40 – 55 %</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">moyenne</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">deux faces lisses ; épaisseur maîtrisée</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Préimprégnés + autoclave</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">plis préimprégnés drapés, cuits sous pression et température</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">≈ 60 %</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">petite</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">aéronautique, sport ; très performant, coûteux</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Enroulement filamentaire · pultrusion</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">fibres enroulées sur un mandrin · tirées à travers une filière chauffée</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">≈ 60 %</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">grande</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">tubes, réservoirs · profilés de section constante</td></tr>
  </table></div>

  <h3>Structures sandwich</h3>
  <div class="def-box">Deux <strong>peaux</strong> minces et rigides (épaisseur \(e\)) collées sur une <strong>âme</strong> légère (nid d'abeille, mousse, balsa) qui les maintient écartées d'une distance \(d\) (entre plans moyens des peaux) et reprend le cisaillement. Pour des peaux minces devant \(d\), sur une largeur \(b\) :
    <div class="formula">$$I \approx 2\,(b\,e)\left(\frac{d}{2}\right)^2 = \frac{b\,e\,d^2}{2}$$</div>
    La rigidité en flexion croît comme \(d^2\) alors que la masse n'augmente que de celle de l'âme : c'est la solution la plus efficace pour des panneaux légers et rigides (planchers d'avion, coques de bateau, cloisons).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Peaux de 1 mm : de combien augmente la rigidité en flexion si l'âme passe de 10 mm à 20 mm ?</span>
    <div class="content"><p>Distance entre plans moyens : \(d_1 = 10 + 1 = 11\) mm, puis \(d_2 = 20 + 1 = 21\) mm. Rapport des rigidités : \((21/11)^2 \approx 3{,}6\). La masse ajoutée n'est que 10 mm d'âme, très peu dense (quelques dizaines de kg/m³).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · PIÈCES MÉTALLIQUES ET CRITÈRES DE CHOIX D'UN PROCÉDÉ</div>
  <h2>Choisir le bon procédé, du découpage à la grande série</h2>
  <div class="intro">Pour une pièce donnée, plusieurs procédés sont souvent possibles. On les départage par la compatibilité avec le matériau, la géométrie, la taille de série, la précision visée et le coût — en commençant par un cas fréquent : la découpe de contours dans une tôle.</div>

  <h3>Découpage mécanique : poinçonnage</h3>
  <div class="def-box">Un <strong>poinçon</strong> pénètre dans une <strong>matrice</strong> en cisaillant la tôle le long de son contour ; le jeu poinçon–matrice vaut quelques pourcents de l'épaisseur. Procédé très rapide, adapté aux trous et contours répétitifs dans des tôles d'épaisseur modeste, avec un outil dédié (grande série) ou une poinçonneuse à commande numérique et des outils standard. L'effort s'estime à partir du périmètre découpé \(p\), de l'épaisseur \(e\) et de la résistance au cisaillement \(R_g\) (ordre de grandeur pour choisir une presse, non exigible : le programme s'en tient à une analyse qualitative des procédés) :
    <div class="formula">$$F \approx p\,e\,R_g$$</div>
    avec \(R_g \approx 0{,}6\) à \(0{,}8\,R_m\) pour les aciers usuels.
  </div>

  <h3>Découpes thermiques et par jet d'eau</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Procédé</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Principe</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Matériaux</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Épaisseurs usuelles (acier)</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Qualité · zone affectée thermiquement (ZAT)</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Laser</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">faisceau focalisé qui fond ou vaporise la matière ; gaz d'assistance</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">métaux, polymères, bois, composites…</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">de quelques dixièmes de mm à ≈ 25 mm (davantage avec les sources fibre les plus puissantes)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">saignée fine, précision ≈ 0,1 mm, ZAT faible ; sans outillage</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Plasma</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">arc électrique dans un gaz ionisé à très haute température</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">conducteurs électriques uniquement</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">surtout de 5 à 50 mm environ (bien plus en forte puissance)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rapide et économique ; saignée plus large, flancs en dépouille, ZAT notable</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Jet d'eau (avec abrasif)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">eau à très haute pression (plusieurs milliers de bars) chargée d'abrasif</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">tous : métaux, verre, pierre, composites, mousses</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">de la feuille mince à plus de 150 mm, mais d'autant plus lentement que c'est épais</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">aucune ZAT, bonne précision ; plus lent</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Oxycoupage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">préchauffage par flamme puis jet d'oxygène pur qui brûle le fer</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">aciers non ou faiblement alliés seulement</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">de quelques mm à plus de 300 mm</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">investissement faible, fortes épaisseurs ; ZAT large, précision médiocre</td></tr>
  </table></div>
  <div class="notice"><strong>Pourquoi l'oxycoupage ne coupe ni l'inox, ni l'aluminium, ni le cuivre ?</strong> Il faut que le métal <strong>brûle</strong> dans l'oxygène et que son oxyde <strong>fonde à plus basse température</strong> que le métal pour être chassé par le jet. C'est vrai pour le fer peu allié, pas pour ces métaux : les oxydes de chrome (inox) et d'aluminium sont réfractaires et forment une couche qui protège le métal, et le cuivre conduit si bien la chaleur qu'on ne parvient pas à amorcer sa combustion.</div>

  <h3>Pièces métalliques : principes, domaines et règles de conception</h3>
  <p>Le découpage n'est qu'un des procédés d'obtention des pièces métalliques. Le programme demande, pour chacun, le phénomène physique en jeu, le domaine d'emploi et les règles de conception qui en découlent ; les chapitres de fabrication de 1ʳᵉ année les décrivent plus en détail.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Procédé</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Phénomène physique</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Domaine d'emploi</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Règles de conception</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Moulage (sable, coquille, sous pression)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">métal liquide coulé dans une empreinte ; retrait à la solidification</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">formes complexes et creuses ; fontes, alliages d'aluminium, de zinc, de cuivre ; de la pièce unique (sable) à la très grande série (sous pression)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">épaisseurs régulières, congés, dépouilles, pas de masse isolée (retassure), surépaisseurs sur les surfaces à usiner</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Forgeage, estampage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">déformation plastique à chaud, entre des outils ou dans des matrices</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">pièces massives très sollicitées (bielles, vilebrequins, leviers, crochets) ; aciers, alliages d'aluminium et de titane ; série pour l'estampage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">dépouilles et congés généreux, plan de joint simple, pas de cavité fermée, variations de section progressives ; le fibrage suit la forme et améliore la tenue en fatigue</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Emboutissage, pliage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">déformation plastique d'une tôle, le plus souvent à froid</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">carrosseries, boîtiers, capots, supports ; tôles ductiles d'acier ou d'aluminium ; grande série pour l'emboutissage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">épaisseur à peu près constante, rayon de pliage au moins égal à l'épaisseur, trous éloignés des plis, emboutis peu profonds (sinon plusieurs passes), retour élastique à compenser</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Soudage</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">fusion locale des bords à assembler, avec ou sans métal d'apport, puis solidification</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">assemblage permanent de tôles et de profilés : mécanosoudure, châssis, réservoirs ; surtout aciers pauvres en carbone</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">joints accessibles, soudures hors des zones les plus sollicitées, épaisseurs voisines, peu de cordons (déformations, zone affectée thermiquement), usinage après soudage des surfaces précises</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Fabrication additive métallique</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">fusion par laser d'un lit de poudre, couche par couche</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">petites séries de pièces complexes : canaux internes, structures allégées en treillis, pièces regroupant plusieurs pièces ; titane, inox, aluminium, alliages de nickel</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">supports sous les surfaces trop inclinées (moins d'environ 45° sur le plateau), évacuation de la poudre des cavités, surépaisseur sur les surfaces fonctionnelles reprises en usinage, orientation choisie pour limiter supports et déformations</td></tr>
  </table></div>

  <h3>Traitements thermiques des aciers : ce qu'ils changent</h3>
  <p>Un traitement thermique modifie les propriétés mécaniques d'un acier sans changer sa forme (aux déformations près). Seuls leurs effets fonctionnels sont au programme, pas les transformations métallurgiques qui les expliquent.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Traitement</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Principe</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Effet et emploi</th></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Trempe</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">chauffage puis refroidissement rapide (eau, huile)</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">dureté et résistance fortement accrues, mais fragilité et contraintes internes ; aciers assez chargés en carbone ou alliés</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Revenu</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">réchauffage modéré, toujours après une trempe</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">rend de la ténacité au prix d'un peu de dureté, réduit les contraintes internes</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Recuit</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">chauffage puis refroidissement lent</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">adoucit et supprime les contraintes internes : avant usinage, après forgeage ou soudage</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Trempe superficielle</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">chauffage rapide de la seule couche superficielle (induction, flamme, laser), puis refroidissement</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">surface dure, cœur resté tenace : portées de roulement, dentures, cames</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Cémentation</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">surface enrichie en carbone à chaud, puis trempe et revenu</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">couche très dure (quelques dixièmes de millimètre à 2 mm environ) sur le cœur tenace d'un acier pauvre en carbone : engrenages</td></tr>
    <tr><td style="padding:.3rem .45rem;border:1px solid var(--grid)">Nitruration</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">diffusion d'azote dans la surface vers 500 °C, sans trempe</td><td style="padding:.3rem .45rem;border:1px solid var(--grid)">couche mince très dure, peu de déformation, meilleure tenue à l'usure et à la fatigue : pièces finies précises, moules</td></tr>
  </table></div>
  <div class="notice">Le choix de la nuance conditionne les <strong>traitements thermiques</strong> possibles : un acier non allié à 0,45 % de carbone ou un acier faiblement allié au chrome se trempe, un acier de construction courant, pauvre en carbone, pratiquement pas (on le cémente si sa surface doit être dure). Un traitement qui durcit impose de finir les surfaces précises par rectification après lui : voir le chapitre « Traitements thermiques ».</div>

  <h3>Critères de choix d'un procédé</h3>
  <div class="prop-box">
    <ul style="margin:.3rem 0">
      <li><strong>Matériau</strong> : il faut une aptitude au procédé (coulabilité pour le moulage, ductilité pour la déformation, fusibilité contrôlée pour l'injection, usinabilité…).</li>
      <li><strong>Géométrie</strong> : forme (révolution, prismatique, coque mince, corps creux), dimensions, épaisseurs, contre-dépouilles, cavités internes.</li>
      <li><strong>Taille de série</strong> : elle décide de l'amortissement des outillages.</li>
      <li><strong>Précision et état de surface</strong> : qualité IT et rugosité \(R_a\) accessibles.</li>
      <li><strong>Propriétés induites</strong> : fibrage favorable du forgeage, porosités possibles en fonderie, ZAT des découpes thermiques et des soudures, contraintes résiduelles.</li>
      <li><strong>Coût et délai</strong> : outillages, temps de cycle, taille de série (ci-dessous).</li>
      <li><strong>Impact environnemental</strong> : énergie consommée par le procédé, matière perdue (copeaux, chutes, systèmes de coulée), fluides de coupe, émissions. Il s'ajoute à l'énergie grise de la matière (§5) : une pièce aéronautique usinée dans la masse, dont le brut pèse dix fois la pièce finie, consomme dix fois l'énergie grise de la matière utile ; un brut forgé, moulé ou obtenu par fabrication additive, proche de la forme finale, réduit fortement cette part.</li>
    </ul>
  </div>

  <h3>Coût et taille de série</h3>
  <div class="prop-box">
    Le coût unitaire d'une pièce sépare un coût <strong>fixe</strong> \(C_o\) (outillage, programmation, réglages), réparti sur les \(N\) pièces, et un coût <strong>variable</strong> \(C_v\) par pièce (matière, temps machine, énergie, main-d'œuvre) :
    <div class="formula">$$C_u(N) = C_v + \frac{C_o}{N}$$</div>
    Entre un procédé 1 peu outillé (\(C_{o1}\) faible, \(C_{v1}\) élevé) et un procédé 2 fortement outillé, le <strong>seuil de rentabilité</strong> est :
    <div class="formula">$$N^* = \frac{C_{o2} - C_{o1}}{C_{v1} - C_{v2}}$$</div>
    Au-delà de \(N^*\) pièces, le procédé outillé devient le moins cher.
  </div>
  <div class="notice"><strong>Repères</strong> : pièce unique ou prototype → usinage, fabrication additive, mécanosoudure ; petite série (dizaines à centaines) → usinage, moulage en sable, moulage au contact ou infusion ; grande série (au-delà de \(10^4\)) → injection, moulage sous pression, estampage, emboutissage, poinçonnage.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · GAMME, MISE EN POSITION ET MACHINES À COMMANDE NUMÉRIQUE</div>
  <h2>Du brut à la pièce finie : ordonner, positionner, usiner</h2>
  <div class="intro">Une fois le brut défini, il faut organiser la suite des phases, décider comment la pièce sera tenue à chaque phase et choisir une machine dont la cinématique permet d'atteindre toutes les surfaces.</div>

  <h3>La gamme de fabrication</h3>
  <div class="def-box">La gamme liste les phases, numérotées 10, 20, 30… (pour pouvoir en intercaler), depuis l'<strong>obtention du brut</strong> jusqu'au <strong>contrôle final</strong>, en passant par les éventuels <strong>traitements</strong> (recuit, trempe, revenu, traitement de surface) et l'<strong>usinage</strong> (ébauche puis finition). Pour chaque phase : la machine, la mise en position, les opérations et les outils.</div>
  <div class="prop-box">
    <strong>Règles d'ordonnancement</strong>
    <ol style="margin:.3rem 0">
      <li>Usiner d'abord les surfaces qui serviront de <strong>références</strong> (d'appui) aux phases suivantes ; la toute première phase s'appuie sur des surfaces brutes.</li>
      <li><strong>Ébauche avant finition</strong> : l'ébauche enlève l'essentiel de la matière et libère les contraintes internes ; la finition donne les cotes.</li>
      <li>Une <strong>trempe</strong> durcit et déforme : on usine à l'outil coupant <strong>avant</strong> (en laissant une surépaisseur), on <strong>rectifie après</strong>.</li>
      <li>Les surfaces liées par une spécification serrée (coaxialité, perpendicularité, localisation) sont réalisées <strong>dans la même prise de pièce</strong> : chaque reprise ajoute une erreur de remise en position.</li>
      <li>Dresser la face d'entrée avant de percer ; percer avant d'aléser ou de tarauder ; ébavurer avant de contrôler.</li>
      <li>Terminer par un <strong>contrôle</strong> (et contrôler après les phases critiques).</li>
    </ol>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0">
    <tr><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Phase</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Désignation</th><th style="padding:.3rem .45rem;border:1px solid var(--grid);background:var(--paper-dark);text-align:left">Commentaire</th></tr>

  </table></div>
  <p style="font-size:.85rem;opacity:.8">Exemple de gamme pour un axe de galet trempé : les centres réalisés en phase 20 servent de référence commune au tournage et à la rectification. Ce tableau est une illustration : la définition détaillée des phases n'est pas au programme ; on retiendra les règles d'ordonnancement qui justifient cet ordre.</p>

  <h3>Mise en position isostatique</h3>
  <div class="def-box">Posée sur la table, une pièce garde a priori ses <strong>6 degrés de liberté</strong> (3 translations, 3 rotations). Chaque contact ponctuel théorique entre la pièce et le porte-pièce en ôte un ; on le dessine par une petite flèche perpendiculaire à la surface, qui vient de l'extérieur et pointe vers la matière : la <strong>normale de repérage</strong>. On les numérote par ordre d'importance des appuis (6 au plus). Le posage est <strong>isostatique</strong> quand les normales bloquent les 6 degrés de liberté sans qu'aucun ne le soit deux fois ; s'il y a redondance, il est <strong>hyperstatique</strong> : la pièce ne touche pas tous ses appuis, ou se déforme quand on serre.</div>
  <div class="prop-box">
    <strong>Principe 3-2-1</strong> (pièce prismatique) :
    <ul style="margin:.3rem 0">
      <li><strong>appui plan</strong> (normales 1-2-3) sur la plus grande surface de référence, en formant le plus grand triangle possible ;</li>
      <li><strong>orientation</strong> ou linéaire rectiligne (normales 4-5) sur une deuxième surface, les deux points le plus éloignés possible ;</li>
      <li><strong>butée</strong> (normale 6) sur une troisième surface.</li>
    </ul>
    <strong>Pièce de révolution</strong> : centrage long (4 normales) + butée (1), ou appui plan (3) + centrage court (2) ; une sixième normale (indexage) n'est nécessaire que si une forme angulaire doit être positionnée.
  </div>
