<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la <strong>stabilité des systèmes asservis</strong>, au programme du semestre S2 de sciences industrielles (compétences C2 « Déterminer les performances d'un système asservi » et C1 « Proposer une démarche permettant d'évaluer les performances »). <strong>Tout y est exigible en 1ʳᵉ année</strong>, sauf ce qui est signalé et la dernière section. Il s'appuie sur <a href="#schblocs/cours">« Schéma-blocs et systèmes asservis »</a> (FTBO, FTBF), <a href="#sys2/cours">« Systèmes du 2e ordre »</a> (amortissement, dépassement) et <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a>, sur lequel se lisent les marges. Il prépare <a href="#precision/cours">« Performances : précision et rapidité »</a> et, en 2ᵉ année, <a href="#correcteurs/cours">« Correction des SLCI »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Stabilité d'un système asservi : définition</strong> (C2, S2) ; stabilité d'une boucle fermée et équation caractéristique (§1).</li>
        <li><strong>Position des pôles dans le plan complexe</strong> (C2, S2) : condition de stabilité (§1), conditions sur les coefficients et pôles imaginaires purs à la limite de stabilité (§2), position des pôles et allure de la réponse (§6).</li>
        <li><strong>Marges de stabilité</strong> (C2, S2) : point critique et critère du revers sur le Bode de la boucle ouverte (§3), marges de phase et de gain (§4), influence du gain et d'un retard (§5), structures types de boucle ouverte et gain limite (§7).</li>
        <li><strong>Amortissement</strong> (C2, S2) : lien entre pôles, amortissement et dépassement, lien entre marge de phase et amortissement (§4, §6).</li>
        <li><strong>Proposer une démarche permettant d'évaluer les performances</strong> (C1, S2) : critères de stabilité du cahier des charges (marges, amortissement, dépassement relatif) ; démarche complète sur un axe asservi (§8).</li>
      </ul>
      <p>Hors programme des deux années (dernière section) : les critères de Routh et de Nyquist, les lieux de Black-Nichols et de Nyquist. La condition sur les coefficients d'un polynôme de degré 3 (§2) est un cas particulier du critère de Routh : elle n'est pas exigible et n'est utilisable que si l'énoncé la rappelle. Le réglage des correcteurs relève de la 2ᵉ année.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LA NOTION DE STABILITÉ</div>
  <h2>Revenir à l'équilibre</h2>
  <div class="intro">Boucler un système le rend plus rapide et plus précis, mais un bouclage trop énergique le fait osciller, puis diverger : une perceuse à colonne qui vibre, un drone qui se met à tanguer, un régulateur de chauffage qui alterne surchauffe et refroidissement. La stabilité est la première exigence d'un cahier des charges : un système instable est inutilisable, et souvent dangereux.</div>
  <div class="def-box">
    Un système est <strong>stable</strong> si à toute entrée bornée correspond une sortie bornée. Pour un SLCI, c'est équivalent à : sa réponse impulsionnelle tend vers 0, ou encore, écarté de son équilibre puis laissé libre, il y revient.
  </div>
  <div class="prop-box">
    <strong>Condition sur les pôles.</strong> Un SLCI est stable si et seulement si <strong>tous les pôles de sa fonction de transfert sont à partie réelle strictement négative</strong>. Un pôle à partie réelle positive suffit à le rendre instable ; une paire de pôles imaginaires purs (et aucun pôle à droite) donne une oscillation entretenue : c'est la <strong>limite de stabilité</strong>, que l'on range avec les systèmes instables.
  </div>
  <div class="prop-box">
    <strong>Pour un système bouclé</strong>, ce sont les pôles de la FTBF qui comptent. Avec un retour unitaire et \(H_{BO} = N_{BO}/D_{BO}\), ce sont les racines de l'<strong>équation caractéristique</strong>
    <div class="formula" data-nom="Équation caractéristique">$$1 + H_{BO}(p) = 0 \iff D_{BO}(p) + N_{BO}(p) = 0.$$</div>
    Une boucle ouverte stable peut donner une boucle fermée instable, et inversement.
  </div>

    <strong>Exemple — lire la stabilité sur les pôles</strong>
    <ol>
      <li>\(H_{BF}(p) = \dfrac{5}{(p + 1)(p^2 + 2p + 5)}\) : pôles \(-1\) et \(-1 \pm 2j\), tous à partie réelle négative : stable. Sa réponse impulsionnelle contient \(e^{-t}\) et \(e^{-t}\sin(2t)\), qui tendent vers 0.</li>
      <li>Une boucle ouverte instable peut être stabilisée par le bouclage : pour un processus \(\dfrac{2}{p - 1}\) (pôle \(+1\), comme un pendule inversé linéarisé), la boucle à retour unitaire donne \(H_{BF} = \dfrac{2}{p - 1 + 2} = \dfrac{2}{p + 1}\), de pôle \(-1\) : stable.</li>

<div class="course-section">
  <div class="sec-num">§2 · LES CRITÈRES ALGÉBRIQUES</div>
  <h2>Conclure sans calculer les pôles</h2>
  <div class="intro">Le polynôme caractéristique d'une boucle d'ordre 3 ou plus n'a pas de racines simples à calculer. Deux outils permettent pourtant de conclure : une condition nécessaire sur les coefficients, et la recherche des pôles imaginaires purs, qui marquent la limite de stabilité.</div>
  <div class="prop-box">
    Soit le polynôme caractéristique \(a_n p^n + \cdots + a_1 p + a_0\), avec \(a_n \gt 0\).
    <ul>
      <li><strong>Condition nécessaire</strong> : tous les coefficients sont strictement positifs. Un coefficient nul ou négatif suffit à conclure à l'instabilité.</li>
      <li>Pour \(n = 1\) et \(n = 2\), cette condition est aussi <strong>suffisante</strong>.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi les coefficients d'un polynôme stable sont positifs, et pourquoi cela suffit au degré 2.</span>
    <div class="content"><p>Un polynôme réel se factorise en facteurs \((p + a)\) (racine réelle \(-a\)) et \((p^2 + bp + c)\) (racines complexes conjuguées, de somme \(-b\) et de produit \(c\)). Si toutes les racines sont à partie réelle négative, alors \(a \gt 0\), \(b \gt 0\) et \(c \gt 0\) : le produit de ces facteurs n'a que des coefficients positifs. Au degré 2, \(a_2p^2 + a_1p + a_0\) a des racines de somme \(-a_1/a_2 \lt 0\) et de produit \(a_0/a_2 \gt 0\) : deux racines réelles de même signe, négatives, ou deux racines complexes conjuguées de partie réelle \(-a_1/(2a_2) \lt 0\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Limite de stabilité.</strong> Quand un paramètre (le gain \(K\) le plus souvent) varie, les pôles se déplacent continûment ; la boucle passe de stable à instable quand des pôles traversent l'axe imaginaire. On trouve ce gain limite en cherchant les pôles <strong>imaginaires purs</strong> : on remplace \(p\) par \(j\omega\) dans l'équation caractéristique et on annule séparément sa partie réelle et sa partie imaginaire. La pulsation \(\omega\) trouvée est celle de l'oscillation entretenue.
  </div>
  <div class="method-box">
    <strong>Exemple — le gain limite d'une boucle d'ordre 3</strong>
    <p>FTBO \(\dfrac{K}{(1 + p)^3}\), retour unitaire, \(K \gt 0\).</p>
    <ol>
      <li>Équation caractéristique : \((1 + p)^3 + K = 0\), soit \(p^3 + 3p^2 + 3p + (1 + K) = 0\). Tous les coefficients sont positifs, mais au degré 3 cela ne suffit pas.</li>
      <li>Pôles imaginaires purs \(p = j\omega\) : \(-j\omega^3 - 3\omega^2 + 3j\omega + 1 + K = 0\). Partie imaginaire : \(3\omega - \omega^3 = 0\), donc \(\omega = \sqrt3 \approx 1{,}73\ \text{rad/s}\). Partie réelle : \(1 + K - 3\omega^2 = 0\), donc \(K = 8\).</li>
      <li>Pour \(K\) proche de 0, les pôles sont proches de \(-1\) : stable. Ils ne franchissent l'axe imaginaire qu'en \(K = 8\) : la boucle est stable pour \(K \lt 8\), à la limite pour \(K = 8\) (oscillation de période \(2\pi/\sqrt3 \approx 3{,}6\ \text{s}\), celle de la figure du §1), instable au-delà.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une boucle d'ordre 2 toujours stable</strong>
    <p>FTBO \(\dfrac{K}{p\,(1 + 0{,}5p)}\) : équation caractéristique \(0{,}5p^2 + p + K = 0\). Pour \(K \gt 0\), les trois coefficients sont positifs et le degré est 2 : la boucle fermée est stable pour tout gain positif, de moins en moins amortie quand \(K\) augmente (\(\xi = 1/\sqrt{2K}\)).</p>
  </div>
  <div class="notice"><strong>Hors programme en PTSI</strong> (cas particulier du critère de Routh, à n'utiliser que si l'énoncé le rappelle) : au degré 3, \(a_3p^3 + a_2p^2 + a_1p + a_0\) est stable si et seulement si tous les coefficients sont positifs <strong>et</strong> \(a_2a_1 \gt a_3a_0\). Sur l'exemple : \(3 \times 3 \gt 1 \times (1 + K)\), soit \(K \lt 8\), le même résultat que par les pôles imaginaires purs.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LE CRITÈRE DU REVERS</div>
  <h2>Lire la stabilité sur la boucle ouverte</h2>
  <div class="intro">Les critères algébriques demandent la fonction de transfert. Le critère du revers se lit sur le diagramme de Bode de la <strong>boucle ouverte</strong>, éventuellement mesuré. Il repose sur le <strong>point critique</strong> \(H_{BO}(j\omega) = -1\), soit un gain de 0 dB et une phase de \(-180°\) : à cette pulsation, \(1 + H_{BO} = 0\) et la boucle fermée a des pôles imaginaires purs.</div>
  <div class="prop-box">
    <strong>Critère du revers</strong> (boucle ouverte stable, sans retour positif). La boucle fermée à retour unitaire est stable si et seulement si, à la pulsation \(\omega_{c0}\) où le gain de la FTBO vaut 0 dB, sa phase est <strong>au-dessus</strong> de \(-180°\). De façon équivalente, à la pulsation \(\omega_\pi\) où la phase vaut \(-180°\), le gain doit être <strong>négatif</strong> (en dB).
  </div>
  <div class="notice"><strong>Pourquoi ?</strong> Un déphasage de \(-180°\) ajouté au signe moins du comparateur fait un tour complet : à cette pulsation, un signal qui parcourt la boucle revient <em>dans le même sens</em>. Si son amplitude a été amplifiée (gain supérieur à 0 dB), il se renforce à chaque tour et l'oscillation croît ; s'il a été atténué, elle s'éteint.</div>
  <div class="method-box">
    <strong>Exemple — le critère du revers sur la boucle du §1</strong>
    <p>FTBO \(\dfrac{K}{(1 + p)^3}\) : gain \(\dfrac{K}{(1 + \omega^2)^{3/2}}\), phase \(-3\arctan\omega\), indépendante de \(K\).</p>
    <ol>
      <li>\(K = 2\) : le gain vaut 1 pour \(1 + \omega^2 = 2^{2/3}\), soit \(\omega_{c0} \approx 0{,}77\ \text{rad/s}\), où la phase vaut \(-3 \times 37{,}5° \approx -112°\), au-dessus de \(-180°\) : stable.</li>
      <li>\(K = 10\) : \(1 + \omega^2 = 10^{2/3}\), soit \(\omega_{c0} \approx 1{,}91\ \text{rad/s}\), où la phase vaut \(-3 \times 62{,}3° \approx -187°\), en dessous : instable.</li>
      <li>Lecture équivalente : la phase vaut \(-180°\) en \(\omega_\pi = \tan 60° = \sqrt3\), où le gain vaut \(K/8\) ; il est inférieur à 1 (négatif en dB) si et seulement si \(K \lt 8\). On retrouve le gain limite du §2.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§4 · LES MARGES DE STABILITÉ</div>
  <h2>Mesurer la distance au point critique</h2>
  <div class="def-box">
    <ul>
      <li>La <strong>marge de phase</strong> est l'écart de la phase de la FTBO à \(-180°\), à la pulsation de coupure à 0 dB : \(M_\varphi = 180° + \arg H_{BO}(j\omega_{c0})\), avec \(|H_{BO}(j\omega_{c0})| = 1\).</li>
      <li>La <strong>marge de gain</strong> est l'écart du gain à 0 dB, à la pulsation où la phase vaut \(-180°\) : \(M_G = -20\log|H_{BO}(j\omega_\pi)|\), avec \(\arg H_{BO}(j\omega_\pi) = -180°\).</li>
    </ul>
    <div class="formula" data-nom="Marges de stabilité">$$M_\varphi = 180° + \arg H_{BO}(j\omega_{c0}),\qquad M_G = -20\log\big|H_{BO}(j\omega_\pi)\big|.$$</div>
    La boucle fermée est stable si les deux marges sont positives. Si la phase n'atteint jamais \(-180°\), la marge de gain est infinie.
  </div>

</figure>
  <div class="method-box">
    <strong>Exemple — calculer les marges pas à pas</strong>
    <p>FTBO de la figure : \(H_{BO}(p) = \dfrac{4}{p\,(1 + 0{,}5p)(1 + 0{,}05p)}\) (classe 1, cassures en 2 et 20 rad/s).</p>
    <ol>
      <li>Estimation de \(\omega_{c0}\) sur les asymptotes : 12 dB en \(\omega = 1\), 6 dB en 2 rad/s, puis pente \(-40\) : 0 dB en \(2 \times 10^{6/40} \approx 2{,}8\ \text{rad/s}\). La courbe réelle, plus basse près de la cassure, coupe en fait 0 dB en \(\omega_{c0} \approx 2{,}49\ \text{rad/s}\) (résolution de \(|H_{BO}(j\omega)| = 1\)).</li>
      <li>Phase exacte : \(-90° - \arctan 1{,}24 - \arctan 0{,}124\), soit \(-148{,}3°\), d'où \(M_\varphi \approx 32°\).</li>
      <li>\(\omega_\pi\) : \(\arctan(0{,}5\omega) + \arctan(0{,}05\omega) = 90°\) équivaut à \(0{,}5\omega \times 0{,}05\omega = 1\), d'où \(\omega_\pi = \sqrt{40} \approx 6{,}3\ \text{rad/s}\). Gain : \(\dfrac{4}{6{,}32\,\sqrt{11}\,\sqrt{1{,}1}} = \dfrac{4}{22} \approx 0{,}18\), soit \(-14{,}8\) dB : \(M_G \approx 15\) dB.</li>
      <li>Conclusion : stable, marge de gain confortable, mais marge de phase trop faible pour un cahier des charges usuel ; la réponse indicielle dépasse d'environ 40 %.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Valeurs usuelles d'un cahier des charges</strong> : \(M_\varphi \geq 45°\) et \(M_G \geq 6\) à 10 dB. Les marges sont des <strong>garanties de robustesse</strong> : la marge de gain dit de combien le gain peut augmenter (vieillissement, charge, erreur de modèle) avant l'instabilité ; la marge de phase, quel déphasage supplémentaire (retard, constante de temps négligée) la boucle peut supporter.
  </div>
  <div class="prop-box">
    <strong>Marge de phase et amortissement.</strong> Quand la boucle fermée se comporte comme un deuxième ordre, \(\xi \approx M_\varphi(°)/100\) : \(M_\varphi = 45°\) donne un dépassement d'environ 20 %, \(M_\varphi = 60°\) environ 10 %, \(M_\varphi = 70°\) presque aucun (valeurs exactes au §6). Une marge de phase faible, même positive, se traduit par une réponse très oscillante.
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : lire les marges sur la FTBF (elles se lisent sur la FTBO) ; calculer la marge de phase à la pulsation de coupure asymptotique ou avec la phase asymptotique ; oublier le \(-90°\) d'un intégrateur ; écrire \(M_G = 20\log|H_{BO}(j\omega_\pi)|\) (le signe moins rend la marge positive quand le gain est négatif).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · L'INFLUENCE DU GAIN ET DU RETARD</div>
  <h2>Ce qui rapproche du point critique</h2>
  <div class="prop-box">
    <strong>Augmenter le gain</strong> \(K\) de la FTBO translate la courbe de gain vers le haut sans changer la phase :
    <ul>
      <li>\(\omega_\pi\) ne change pas et \(M_G\) diminue de \(20\log(K'/K)\) ;</li>
      <li>\(\omega_{c0}\) augmente : la boucle est plus rapide, mais la phase y est plus basse et \(M_\varphi\) diminue ;</li>
      <li>le <strong>gain limite</strong> \(K_{lim} = K\cdot 10^{M_G/20}\) rend la boucle juste oscillante.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — régler un gain pour une marge de phase</strong>
    <p>FTBO \(\dfrac{K}{p\,(1 + 0{,}5p)}\) : on veut \(M_\varphi = 45°\).</p>
    <ol>
      <li>Il faut \(-90° - \arctan(0{,}5\,\omega_{c0}) = -135°\), donc \(0{,}5\,\omega_{c0} = 1\) et \(\omega_{c0} = 2\ \text{rad/s}\).</li>
      <li>On impose 0 dB en cette pulsation : \(\dfrac{K}{2\sqrt{1 + 1}} = 1\), d'où \(K = 2\sqrt2 \approx 2{,}8\ \text{s}^{-1}\).</li>
      <li>La phase de cette FTBO ne descend jamais sous \(-180°\) : la marge de gain est infinie, la boucle est stable pour tout \(K\), mais de moins en moins amortie quand \(K\) croît.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — gain limite tiré de la marge de gain</strong>
    <p>Pour la FTBO du §4 (\(K = 4\), \(M_G \approx 14{,}8\) dB) : \(K_{lim} = 4 \times 10^{14{,}8/20} \approx 22\). Doubler le gain (\(K = 8\)) retire 6 dB de marge de gain, qui tombe à 8,8 dB, et fait encore baisser la marge de phase.</p>
  </div>
  <div class="prop-box">
    <strong>Un retard rogne la marge de phase.</strong> Un retard \(T\) dans la boucle ne change pas le gain mais ajoute \(-\omega T\) à la phase : en \(\omega_{c0}\), la marge de phase perd \(\omega_{c0}T\) radians. Le plus grand retard tolérable est
    <div class="formula" data-nom="Retard maximal tolérable">$$T_{max} = \frac{M_\varphi\ (\text{en rad})}{\omega_{c0}}.$$</div>
    Avec \(M_\varphi = 45°\) et \(\omega_{c0} = 10\ \text{rad/s}\) : \(T_{max} = 0{,}785/10 \approx 79\ \text{ms}\). Plus une boucle est rapide, moins elle tolère de retard : c'est la limite des commandes à distance et des réseaux lents.
  </div>
  <div class="method-box">
    <strong>Exemple — un retard de mesure</strong>
    <p>La boucle du §4 (\(\omega_{c0} \approx 2{,}49\ \text{rad/s}\), \(M_\varphi \approx 31{,}7°\)) reçoit sa mesure avec un retard de 0,1 s.</p>
    <ol>
      <li>Le gain ne change pas : \(\omega_{c0}\) reste 2,49 rad/s.</li>
      <li>Perte de phase : \(\omega_{c0}T = 0{,}249\ \text{rad} \approx 14{,}3°\) ; la marge de phase tombe à \(17{,}4°\).</li>
      <li>Retard maximal : la marge vaut \(31{,}7° = 0{,}553\ \text{rad}\), d'où \(T_{max} = 0{,}553/2{,}49 \approx 0{,}22\ \text{s}\).</li>
    </ol>
  </div>
  <div class="notice">Une FTBO du premier ou du deuxième ordre sans retard n'atteint jamais \(-180°\) : la boucle fermée est stable pour tout gain positif. Dès que la FTBO est d'ordre 3 ou contient un retard, il existe un gain limite. Les constantes de temps négligées dans un modèle (capteur, inductance, filtre) sont donc à garder en tête : ce sont elles qui fixent la stabilité réelle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · PÔLES, AMORTISSEMENT ET DÉPASSEMENT</div>
  <h2>Ce que la position des pôles dit de la réponse</h2>
  <div class="intro">Être stable ne suffit pas : une réponse qui oscille longtemps est inacceptable. La position des pôles de la FTBF dans le plan complexe dit à la fois si la réponse s'éteint, à quelle vitesse, et avec quelles oscillations ; c'est ce qu'exige un cahier des charges sous la forme d'un amortissement ou d'un dépassement relatif maximal.</div>
  <div class="prop-box">
    Un pôle \(p_k = \sigma \pm j\omega_d\) engendre dans la réponse un mode \(e^{\sigma t}\cos(\omega_d t + \phi)\) :
    <ul>
      <li>la partie réelle \(\sigma\) fixe l'évolution de l'enveloppe : décroissante si \(\sigma \lt 0\), en \(1/|\sigma|\) secondes à 37 % ; plus le pôle est loin à gauche de l'axe imaginaire, plus son mode s'éteint vite ;</li>
      <li>la partie imaginaire \(\omega_d\) est la pulsation des oscillations (aucune pour un pôle réel) ;</li>
      <li>pour un deuxième ordre, les pôles valent \(-\xi\omega_0 \pm j\omega_0\sqrt{1 - \xi^2}\) : leur module est \(\omega_0\) et l'angle \(\theta\) qu'ils font avec le demi-axe réel négatif vérifie \(\cos\theta = \xi\). Des pôles sur une même demi-droite issue de l'origine ont le même amortissement, donc le même dépassement.</li>
    </ul>
  </div>

<figcaption>Position des pôles et réponse impulsionnelle (chaque courbe est mise à l'échelle de sa fenêtre). A (\(-0{,}5 \pm 2j\)) : oscillation lentement amortie (\(\xi \approx 0{,}24\)). B (\(-1{,}5 \pm 1{,}5j\)) : bien amortie (\(\xi \approx 0{,}71\), sur la droite en tirets). C (\(-2\)) : décroissance sans oscillation. D (\(\pm 1{,}2j\)) : oscillation entretenue, limite de stabilité. E (\(0{,}5 \pm 2j\)) : oscillation croissante, instable. La distance à l'axe imaginaire fixe la vitesse d'extinction, l'angle avec l'axe réel l'amortissement.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Dépassement relatif</strong> d'un deuxième ordre (voir <a href="#sys2/cours">« Systèmes du 2e ordre »</a>, §2) :
    <div class="formula" data-nom="Dépassement relatif">$$D_1 = \frac{s_{\max} - s_\infty}{s_\infty} = \exp\!\left(-\frac{\pi\xi}{\sqrt{1 - \xi^2}}\right).$$</div>
    Pour une FTBO \(\dfrac{K}{p\,(1 + \tau p)}\), la FTBF est un deuxième ordre et la marge de phase donne \(\xi\) exactement :
    <div style="overflow-x:auto"><table>
      <tr><th>\(M_\varphi\)</th><th>30°</th><th>45°</th><th>60°</th><th>70°</th></tr>
      <tr><td>\(\xi\) de la boucle fermée</td><td>0,27</td><td>0,42</td><td>0,61</td><td>0,80</td></tr>
      <tr><td>Dépassement \(D_1\)</td><td>42 %</td><td>23 %</td><td>9 %</td><td>1,4 %</td></tr>
    </table></div>
    D'où la règle \(\xi \approx M_\varphi(°)/100\), qui reste un bon repère quand la boucle fermée a deux pôles dominants.
  </div>
  <div class="method-box">
    <strong>Exemple — de la position des pôles aux performances</strong>
    <p>La FTBF d'un asservissement a deux pôles dominants \(-2 \pm 3j\) (en s⁻¹) et un gain statique de 1.</p>
    <ol>
      <li>\(\omega_0 = |p| = \sqrt{4 + 9} \approx 3{,}61\ \text{rad/s}\) et \(\xi = 2/3{,}61 \approx 0{,}55\) (angle \(\theta \approx 56°\)).</li>
      <li>Dépassement :<div class="formula">$$D_1 = \exp\big(-\pi \times 0{,}55/\sqrt{1 - 0{,}31}\big) = e^{-2\pi/3} \approx 12\ \%.$$</div></li>
      <li>Pseudo-période \(2\pi/3 \approx 2{,}1\ \text{s}\) ; l'enveloppe décroît comme \(e^{-2t}\), et le temps de réponse à 5 % vaut environ \(3/2 = 1{,}5\ \text{s}\) (1,47 s exactement).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : juger la rapidité sur la partie imaginaire des pôles. Ce sont les parties réelles qui fixent la durée du régime transitoire : un pôle peu amorti proche de l'axe imaginaire, même à haute pulsation, laisse une oscillation qui s'éteint lentement. La réduction d'un modèle à ses pôles dominants est au programme de 2ᵉ année (<a href="#correcteurs/cours">« Correction des SLCI »</a>, §1).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LES CAS TYPES DE BOUCLE OUVERTE</div>
  <h2>Reconnaître d'un coup d'œil le risque d'instabilité</h2>
  <div class="intro">La forme de la FTBO suffit souvent à savoir si un gain limite existe : tout dépend de la phase vers laquelle elle tend. Si la phase n'atteint jamais \(-180°\), aucun gain ne déstabilise la boucle ; si elle la franchit, il existe un gain limite ; si elle reste en dessous, aucun gain ne la stabilise.</div>
  <div style="overflow-x:auto"><table>
    <tr><th>FTBO (\(K \gt 0\), constantes de temps positives)</th><th>Phase</th><th>Boucle fermée</th></tr>
    <tr><td>\(\dfrac{K}{1 + \tau p}\)</td><td>de 0° à \(-90°\)</td><td>stable pour tout \(K\)</td></tr>
    <tr><td>\(\dfrac{K}{(1 + \tau_1 p)(1 + \tau_2 p)}\), \(\dfrac{K}{p\,(1 + \tau p)}\)</td><td>tend vers \(-180°\) sans l'atteindre</td><td>stable pour tout \(K\), de moins en moins amortie</td></tr>
    <tr><td>\(\dfrac{K}{p\,(1 + \tau_1 p)(1 + \tau_2 p)}\)</td><td>de \(-90°\) à \(-270°\)</td><td>stable si \(K \lt \dfrac{1}{\tau_1} + \dfrac{1}{\tau_2}\)</td></tr>
    <tr><td>\(\dfrac{K}{(1 + \tau p)^3}\)</td><td>de 0° à \(-270°\)</td><td>stable si \(K \lt 8\)</td></tr>
    <tr><td>\(\dfrac{K}{p^2}\)</td><td>\(-180°\) constante</td><td>oscillation entretenue pour tout \(K\)</td></tr>
    <tr><td>\(\dfrac{K}{p^2\,(1 + \tau p)}\)</td><td>sous \(-180°\)</td><td>instable pour tout \(K\)</td></tr>
    <tr><td>\(\dfrac{K\,(1 + \tau_a p)}{p^2\,(1 + \tau p)}\)</td><td>\(-180° + \arctan(\tau_a\omega) - \arctan(\tau\omega)\)</td><td>stable pour tout \(K\) si \(\tau_a \gt \tau\), instable sinon</td></tr>
    <tr><td>toute FTBO avec un retard \(e^{-Tp}\)</td><td>tend vers \(-\infty\)</td><td>gain limite</td></tr>
  </table></div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le gain limite d'un intégrateur suivi de deux premiers ordres.</span>
    <div class="content"><p>La phase \(-90° - \arctan(\tau_1\omega) - \arctan(\tau_2\omega)\) vaut \(-180°\) quand \(\arctan(\tau_1\omega) + \arctan(\tau_2\omega) = 90°\), c'est-à-dire quand \(\tau_1\omega \cdot \tau_2\omega = 1\) : \(\omega_\pi = 1/\sqrt{\tau_1\tau_2}\). Alors</p><div class="formula">$$(1 + \tau_1^2\omega_\pi^2)(1 + \tau_2^2\omega_\pi^2) = \Big(1 + \frac{\tau_1}{\tau_2}\Big)\Big(1 + \frac{\tau_2}{\tau_1}\Big) = \frac{(\tau_1 + \tau_2)^2}{\tau_1\tau_2},$$</div><p>et le gain vaut \(|H_{BO}(j\omega_\pi)| = \dfrac{K\,\tau_1\tau_2}{\tau_1 + \tau_2}\). Il vaut 1 pour \(K_{lim} = \dfrac{\tau_1 + \tau_2}{\tau_1\tau_2} = \dfrac{1}{\tau_1} + \dfrac{1}{\tau_2}\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — gain limite sans calcul de marge</strong>
    <p>Pour la FTBO \(\dfrac{K}{p\,(1 + 0{,}5p)(1 + 0{,}05p)}\) du §4 : \(K_{lim} = \dfrac{1}{0{,}5} + \dfrac{1}{0{,}05} = 2 + 20 = 22\), comme au §5. Le terme dominant est \(1/\tau_2\) : c'est la plus <strong>petite</strong> constante de temps qui fixe le gain limite. La négliger (FTBO \(\dfrac{K}{p\,(1 + 0{,}5p)}\)) ferait croire la boucle stable pour tout gain.</p>
  </div>
  <div class="method-box">
    <strong>Exemple — stabiliser un double intégrateur</strong>
    <p>Un satellite (ou un mobile sans frottement) commandé en force est un double intégrateur. Avec la FTBO \(\dfrac{K}{p^2\,(1 + 0{,}1p)}\), la phase est toujours sous \(-180°\) : instable pour tout \(K\). Ajouter un zéro, \(\dfrac{K\,(1 + 0{,}5p)}{p^2\,(1 + 0{,}1p)}\), remonte la phase au-dessus de \(-180°\) puisque \(0{,}5 \gt 0{,}1\) : elle atteint au mieux \(-180° + \arctan 2{,}24 - \arctan 0{,}45\), soit \(-138°\), en \(\omega = 1/\sqrt{0{,}05} \approx 4{,}5\ \text{rad/s}\). En réglant \(K \approx 8{,}9\) pour couper 0 dB à cette pulsation, on obtient \(M_\varphi \approx 42°\). C'est le principe de l'avance de phase, étudiée en 2ᵉ année.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DÉMARCHE COMPLÈTE : RÉGLER LE GAIN D'UN AXE</div>
  <h2>Du cahier des charges au réglage</h2>
  <div class="intro">On rassemble ici tout le chapitre sur un cas réaliste : un axe de positionnement (amplificateur, moteur, réducteur, capteur de position), dont la boucle ouverte a une constante de temps mécanique de 50 ms et une constante de temps électrique de 5 ms. Le cahier des charges impose \(M_\varphi \geq 45°\) et \(M_G \geq 10\ \text{dB}\) ; on cherche le plus grand gain qui les respecte, car c'est le plus rapide et le plus précis.</div>
  <div class="prop-box">
    <strong>Retour non unitaire.</strong> La FTBO est le produit de <strong>tous</strong> les blocs de la boucle, chaîne de retour (capteur) comprise : \(H_{BO} = A(p)\,B(p)\). La stabilité et les marges ne dépendent que d'elle ; la placer en retour unitaire (adaptateur de même gain que le capteur) ne change ni les pôles de la FTBF ni les marges.
  </div>
  <div class="method-box">
    <strong>Exemple — l'axe asservi</strong>
    <p>Après réduction du schéma-blocs : \(H_{BO}(p) = \dfrac{K}{p\,(1 + 0{,}05p)(1 + 0{,}005p)}\), \(K\) en s⁻¹ réglé par le gain de l'amplificateur.</p>
    <ol>
      <li><strong>Stabilité</strong> (§7) : \(K_{lim} = \dfrac{1}{0{,}05} + \dfrac{1}{0{,}005} = 220\ \text{s}^{-1}\), atteint en \(\omega_\pi = 1/\sqrt{0{,}05 \times 0{,}005} \approx 63\ \text{rad/s}\).</li>
      <li><strong>Marge de gain</strong> : \(M_G = 20\log(220/K) \geq 10\ \text{dB}\) impose \(K \leq 220/10^{0{,}5} \approx 70\).</li>
      <li><strong>Marge de phase</strong> : la phase vaut \(-135°\) quand \(\arctan(0{,}05\omega) + \arctan(0{,}005\omega) = 45°\), soit \(\dfrac{0{,}055\,\omega}{1 - 0{,}00025\,\omega^2} = 1\) : \(\omega \approx 16{,}9\ \text{rad/s}\). Le gain y vaut 1 pour<div class="formula">$$K = 16{,}9\,\sqrt{1 + 0{,}845^2}\,\sqrt{1 + 0{,}0845^2} \approx 22{,}2.$$</div>Il faut donc \(K \leq 22\).</li>
      <li><strong>Réglage</strong> : la marge de phase est la contrainte la plus forte ; avec \(K = 22\ \text{s}^{-1}\) : \(\omega_{c0} \approx 16{,}8\ \text{rad/s}\), \(M_\varphi \approx 45°\), \(M_G = 20\log 10 = 20\ \text{dB}\). Les pôles dominants de la FTBF, \(-8{,}8 \pm 18{,}9j\), donnent \(\xi \approx 0{,}42\) et un dépassement d'environ 23 %.</li>
      <li><strong>Commande numérique</strong> : si le calculateur ajoute un retard de 10 ms, la marge de phase perd \(16{,}8 \times 0{,}01\ \text{rad} \approx 9{,}6°\) et tombe à 35° : il faut ramener le gain à \(K \approx 16\) (\(\omega_{c0} \approx 13{,}3\ \text{rad/s}\), \(M_G \approx 13\ \text{dB}\)).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Autres critères de stabilité</h2>
  <div class="intro">Rien de ce qui suit n'est exigible, ni en PTSI ni en PT : le programme exclut explicitement les critères de Routh et de Nyquist et les lieux de Black-Nichols et de Nyquist.</div>
  <ul>
    <li><strong>Critère de Routh</strong> : on range les coefficients sur deux lignes (\(a_n, a_{n-2}, \ldots\) puis \(a_{n-1}, a_{n-3}, \ldots\)) et l'on calcule chaque ligne suivante par des déterminants croisés : \(b_1 = \dfrac{a_{n-1}a_{n-2} - a_na_{n-3}}{a_{n-1}}\), etc. Le système est stable si et seulement si tous les termes de la première colonne sont de même signe ; le nombre de changements de signe est le nombre de pôles à partie réelle positive. Pour \(n = 3\), on retrouve la condition \(a_2a_1 \gt a_3a_0\) du §2.</li>
    <li><strong>Critère de Nyquist</strong> : il généralise le critère du revers aux boucles ouvertes instables et aux gains qui coupent 0 dB plusieurs fois. Sous sa forme simplifiée, le lieu de Nyquist de la FTBO (\(H_{BO}(j\omega)\) dans le plan complexe), parcouru dans le sens des pulsations croissantes, doit laisser le point \(-1\) à sa gauche.</li>
    <li><strong>Lieu de Black-Nichols</strong> : gain en dB de la FTBO en fonction de sa phase, gradué en pulsations ; les marges s'y lisent aussi, ainsi que la résonance de la boucle fermée grâce à des abaques.</li>
    <li><strong>Lieu des racines</strong> : trajectoire des pôles de la FTBF dans le plan complexe quand le gain varie ; il visualise le passage à la limite de stabilité étudié au §2.</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="stab-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · STABILITÉ</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à décider si une boucle fermée est stable, à mesurer sa marge par rapport à l'instabilité et à régler un gain pour respecter les exigences de stabilité d'un cahier des charges.</div>
  <div class="method-box"><strong>Méthode 1 — Étudier la stabilité par les pôles</strong>
    <ol>
      <li>Écrire la FTBF, ou directement l'équation caractéristique \(1 + H_{BO}(p) = 0\), soit \(D_{BO} + N_{BO} = 0\) pour un retour unitaire.</li>
      <li>Un coefficient nul ou de signe contraire aux autres : instable, sans autre calcul.</li>
      <li>Ordre 1 ou 2 : stable si et seulement si tous les coefficients sont strictement positifs. Au-delà : pôles imaginaires purs (méthode 2) ou critère du revers (méthode 3).</li>
    </ol>
    <p><em>Exemple éclair :</em> équation caractéristique \(2p^3 + 3p^2 - p + 5 = 0\) : le coefficient \(-1\) suffit, la boucle est instable (deux pôles \(0{,}36 \pm 0{,}99j\) à droite).</p>
  </div>
  <div class="method-box"><strong>Méthode 2 — Trouver un gain limite par les pôles imaginaires purs</strong>
    <ol>
      <li>Écrire l'équation caractéristique en fonction du gain \(K\).</li>
      <li>Y remplacer \(p\) par \(j\omega\) ; annuler la partie imaginaire (elle donne \(\omega\)) et la partie réelle (elle donne \(K_{lim}\)).</li>
      <li>Vérifier le sens : stable pour \(K\) petit (pôles de la boucle ouverte stables), instable au-delà de \(K_{lim}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{K}{p\,(1 + p)(1 + 0{,}2p)}\) : \(0{,}2p^3 + 1{,}2p^2 + p + K = 0\). Avec \(p = j\omega\) : \(\omega - 0{,}2\omega^3 = 0\), d'où \(\omega = \sqrt5 \approx 2{,}24\ \text{rad/s}\), et \(K - 1{,}2\omega^2 = 0\), d'où \(K_{lim} = 6\) (\(= 1/1 + 1/0{,}2\)).</p>
  </div>
  <div class="method-box"><strong>Méthode 3 — Appliquer le critère du revers</strong>
    <ol>
      <li>Vérifier que la boucle ouverte est stable (intégrateurs admis) et que son gain ne coupe 0 dB qu'une fois.</li>
      <li>Trouver \(\omega_{c0}\) (\(|H_{BO}| = 1\)) et y calculer la phase exacte.</li>
      <li>Stable si cette phase est au-dessus de \(-180°\) ; ou, de façon équivalente, si le gain est négatif (en dB) à la pulsation \(\omega_\pi\) où la phase vaut \(-180°\).</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{10\,e^{-0{,}1p}}{1 + p}\) : \(\omega_{c0} = \sqrt{99} \approx 9{,}95\ \text{rad/s}\), phase \(-84{,}3° - 57{,}0° \approx -141°\) : stable.</p>
  </div>
  <div class="method-box"><strong>Méthode 4 — Calculer la marge de phase</strong>
    <ol>
      <li>Estimer \(\omega_{c0}\) sur les asymptotes, puis la calculer exactement : résoudre \(|H_{BO}(j\omega)| = 1\) (équation bicarrée, essais successifs ou dichotomie).</li>
      <li>Calculer la phase exacte \(\arg H_{BO}(j\omega_{c0})\) par la somme des arctangentes.</li>
      <li>\(M_\varphi = 180° + \arg H_{BO}(j\omega_{c0})\).</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{10}{p\,(1 + 0{,}1p)}\) : \(0{,}01\,\omega^4 + \omega^2 - 100 = 0\) donne \(\omega_{c0} \approx 7{,}86\ \text{rad/s}\) ; phase \(-90° - \arctan 0{,}786 \approx -128{,}2°\) ; \(M_\varphi \approx 52°\).</p>
  </div>
  <div class="method-box"><strong>Méthode 5 — Calculer la marge de gain et le gain limite</strong>
    <ol>
      <li>Résoudre \(\arg H_{BO}(j\omega) = -180°\) : avec deux premiers ordres et un intégrateur, \(\arctan(\tau_1\omega) + \arctan(\tau_2\omega) = 90°\) donne \(\tau_1\tau_2\omega_\pi^2 = 1\).</li>
      <li>\(M_G = -20\log|H_{BO}(j\omega_\pi)|\) ; gain limite \(K_{lim} = K/|H_{BO}(j\omega_\pi)| = K \cdot 10^{M_G/20}\).</li>
      <li>Si la phase n'atteint pas \(-180°\), la marge de gain est infinie.</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{2}{p\,(1 + p)(1 + 0{,}2p)}\) : \(\omega_\pi = \sqrt5\), \(|H_{BO}(j\omega_\pi)| = \dfrac{2 \times 0{,}2}{1{,}2} = \dfrac13\) : \(M_G \approx 9{,}5\) dB et \(K_{lim} = 6\).</p>
  </div>
  <div class="method-box"><strong>Méthode 6 — Régler un gain pour une marge de phase imposée</strong>
    <ol>
      <li>La phase ne dépend pas du gain : chercher la pulsation \(\omega_\varphi\) où \(\arg H_{BO}(j\omega_\varphi) = -180° + M_\varphi\).</li>
      <li>Choisir \(K\) pour que le gain y vaille 0 dB : \(K = K_{actuel}/|H_{BO}(j\omega_\varphi)|\).</li>
      <li>Vérifier ensuite la marge de gain et la rapidité (\(\omega_{c0} = \omega_\varphi\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{K}{p\,(1 + 0{,}1p)}\), \(M_\varphi = 60°\) : il faut \(\arctan(0{,}1\omega) = 30°\), soit \(\omega_\varphi \approx 5{,}77\ \text{rad/s}\), et \(K = 5{,}77\sqrt{1 + 0{,}333} \approx 6{,}7\ \text{s}^{-1}\) ; marge de gain infinie.</p>
  </div>
  <div class="method-box"><strong>Méthode 7 — Tenir compte d'un retard</strong>
    <ol>
      <li>Le gain est inchangé, donc \(\omega_{c0}\) aussi ; retrancher \(\omega T\) (converti en degrés : \(\times 180/\pi\)) à la phase.</li>
      <li>Nouvelle marge de phase : \(M_\varphi - \omega_{c0}T\) ; retard maximal \(T_{max} = M_\varphi/\omega_{c0}\), la marge en radians.</li>
      <li>Le retard crée aussi une pulsation \(\omega_\pi\) là où il n'y en avait pas : recalculer la marge de gain.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M_\varphi = 50°\) à \(\omega_{c0} = 20\ \text{rad/s}\), retard de 15 ms : perte \(0{,}3\ \text{rad} \approx 17°\), il reste 33° ; retard maximal \(0{,}873/20 \approx 44\ \text{ms}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 8 — Relier pôles, amortissement et dépassement</strong>
    <ol>
      <li>Pour une paire \(-\sigma \pm j\omega_d\) : \(\omega_0 = \sqrt{\sigma^2 + \omega_d^2}\) et \(\xi = \sigma/\omega_0\) (cosinus de l'angle avec le demi-axe réel négatif).</li>
      <li>Dépassement \(D_1 = \exp\big(-\pi\xi/\sqrt{1 - \xi^2}\big)\) ; durée du transitoire de l'ordre de \(3/\sigma\).</li>
      <li>Depuis la boucle ouverte : \(\xi \approx M_\varphi(°)/100\) (exact pour une FTBO \(\dfrac{K}{p\,(1 + \tau p)}\), voir le tableau du cours).</li>
    </ol>
    <p><em>Exemple éclair :</em> pôles \(-3 \pm 4j\) : \(\omega_0 = 5\ \text{rad/s}\), \(\xi = 0{,}6\), \(D_1 = e^{-\pi \times 0{,}6/0{,}8} \approx 9{,}5\ \%\), temps de réponse de l'ordre de 1 s.</p>
  </div>
  <div class="method-box"><strong>Méthode 9 — Vérifier les exigences de stabilité d'un cahier des charges</strong>
    <ol>
      <li>Écrire la FTBO complète (chaîne directe et chaîne de retour), sans négliger les petites constantes de temps ni les retards.</li>
      <li>Calculer \(K_{lim}\), puis \(M_G\) et \(M_\varphi\) au gain prévu ; en déduire l'amortissement et le dépassement attendus.</li>
      <li>Conclure exigence par exigence (valeur obtenue, valeur exigée) ; si un gain ne suffit pas à tout respecter, prévoir un correcteur.</li>
    </ol>
    <p><em>Exemple éclair :</em> axe de FTBO \(\dfrac{22}{p\,(1 + 0{,}05p)(1 + 0{,}005p)}\), exigences \(M_\varphi \geq 45°\) et \(M_G \geq 10\) dB : \(M_\varphi \approx 45°\) (juste satisfaite) et \(M_G = 20\log(220/22) = 20\) dB (satisfaite).</p>
  </div>
  <div class="notice"><strong>Pièges classiques.</strong> Étudier les pôles de la FTBO au lieu de ceux de la FTBF ; lire les marges sur la FTBF (elles se lisent sur la FTBO) ; utiliser la phase asymptotique ou la pulsation de coupure asymptotique ; oublier le \(-90°\) d'un intégrateur ; conclure « stable » sur la seule positivité des coefficients pour un ordre 3 ; appliquer le critère du revers à une boucle ouverte instable ; compenser un pôle instable par un zéro (la moindre erreur de modèle laisse le pôle instable).</div>
</div>
</template>
<template class="pan-tpl" data-panneau="stab-exos">
<div class="exo-wrapper">
<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Stabilité par les pôles</h3>
  <div class="statement">Un système a pour FT en BF : \(H_{BF}(p) = \frac{10}{(p+1)(p+5)(p-2)}\).</div>
  <div class="q"><strong>Q1.</strong> Lister les pôles et leurs parties réelles.</div>
  <div class="q"><strong>Q2.</strong> Le système est-il stable ? Justifier.</div>
  <div class="q"><strong>Q3.</strong> Quelle modification du système le rendrait stable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pôles : \(p_1=-1\) (partie réelle négative), \(p_2=-5\) (négative), \(p_3=+2\) (positive).</p>
    <p><strong>Q2.</strong> Le système est <strong>instable</strong> : le pôle \(p_3=+2\) a une partie réelle positive → la réponse impulsionnelle contient un terme \(e^{2t}\) qui diverge.</p>
    <p><strong>Q3.</strong> C'est une boucle fermée : il faut changer son réglage (diminuer le gain, ajouter un correcteur, par exemple à avance de phase) jusqu'à ramener les trois pôles de la FTBF dans le demi-plan gauche, ce que l'on vérifie en recalculant ses pôles. Ajouter un zéro en \(p = 2\) pour « compenser » le pôle instable est illusoire : la moindre erreur de modèle laisse le pôle en place, et le mode \(e^{2t}\) diverge toujours à l'intérieur du système.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Marges d'une boucle ouverte « intégrateur et premier ordre »</h3>
  <div class="statement">\(H_{BO}(p) = \frac{K}{p(1+0{,}1p)}\). On veut \(M_\varphi \geq 45°\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\arg H_{BO}(j\omega)\).</div>
  <div class="q"><strong>Q2.</strong> La phase peut-elle atteindre −180° ? En déduire la marge de gain \(M_G\).</div>
  <div class="q"><strong>Q3.</strong> Trouver la valeur de \(K\) qui donne \(M_\varphi = 45°\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\arg H_{BO} = -90° - \arctan(0{,}1\omega)\). La phase varie de −90° (à \(\omega=0\)) à −180° (à \(\omega\to\infty\)).</p>
    <p><strong>Q2.</strong> La phase atteint −180° seulement à \(\omega\to\infty\), où le gain est nul → \(|H_{BO}(\omega_\pi)| = 0\) → \(M_G = \infty\ \text{dB}\). Ce type de système est toujours stable en gain.</p>
    <p><strong>Q3.</strong> \(M_\varphi = 45°\) → \(\arg H_{BO}(\omega_{c0}) = -135°\) → \(-90°-\arctan(0{,}1\omega_{c0}) = -135°\) → \(\arctan(0{,}1\omega_{c0}) = 45°\) → \(\omega_{c0} = 10\ \text{rad/s}\). À \(\omega_{c0}=10\) : \(|H_{BO}| = K/(\omega_{c0}\sqrt{1+(0{,}1\omega_{c0})^2})\), soit \(K/(10\sqrt{2}) = 1\). \(K = 10\sqrt{2} \approx 14{,}1\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Gain limite de stabilité</h3>
  <div class="statement">\(H_{BO}(p) = \frac{K}{(1+p)(1+0{,}5p)(1+0{,}2p)}\).</div>
  <div class="q"><strong>Q1.</strong> Trouver \(\omega_\pi\) (phase = −180°).</div>
  <div class="q"><strong>Q2.</strong> Calculer le gain limite \(K_{lim}\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(K = K_{lim}/2\), calculer \(M_G\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La phase vaut \(-180°\) quand \(D(j\omega) = (1 + j\omega)(1 + 0{,}5j\omega)(1 + 0{,}2j\omega)\) est réel (négatif). En développant : \(D(j\omega) = 1 - 0{,}8\,\omega^2 + j\,\omega\,(1{,}7 - 0{,}1\,\omega^2)\). La partie imaginaire s'annule pour \(\omega^2 = 17\) : \(\omega_\pi = \sqrt{17} \approx 4{,}12\ \text{rad/s}\).</p>
    <p><strong>Q2.</strong> En \(\omega_\pi\), \(D(j\omega_\pi) = 1 - 0{,}8 \times 17 = -12{,}6\), donc \(|H_{BO}(j\omega_\pi)| = K/12{,}6\). La boucle devient instable quand ce module atteint 1 : \(K_{lim} = 12{,}6\).</p>
    <p><strong>Q3.</strong> Pour \(K = K_{lim}/2 = 6{,}3\) : \(|H_{BO}(j\omega_\pi)| = 0{,}5\), soit \(-6\ \text{dB}\) : \(M_G = 6\ \text{dB}\), la marge minimale usuelle.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Gain limite par les pôles imaginaires purs</h3>
  <div class="statement">Une boucle fermée a pour polynôme caractéristique \(D(p) = p^3 + 3p^2 + 2p + K\), avec \(K\) réglable.</div>
  <div class="q"><strong>Q1.</strong> Quelle condition nécessaire de stabilité porte sur \(K\) ?</div>
  <div class="q"><strong>Q2.</strong> Chercher les valeurs de \(K\) pour lesquelles la boucle fermée a des pôles imaginaires purs. En déduire les valeurs de \(K\) qui rendent la boucle stable.</div>
  <div class="q"><strong>Q3.</strong> Quel est le comportement à la limite (\(K = K_{lim}\)) ?</div>
  <div class="q"><strong>Q4.</strong> (Hors programme, pour aller plus loin.) Retrouver le résultat par le tableau de Routh.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tous les coefficients doivent être strictement positifs : \(K \gt 0\). Au degré 3, cette condition ne suffit pas.</p>
    <p><strong>Q2.</strong> Avec \(p = j\omega\) : \(-j\omega^3 - 3\omega^2 + 2j\omega + K = 0\). Partie imaginaire : \(2\omega - \omega^3 = 0\), d'où \(\omega = \sqrt2\) ; partie réelle : \(K - 3\omega^2 = 0\), d'où \(K = 6\). Pour \(K\) petit, les pôles sont voisins de ceux de \(p^3 + 3p^2 + 2p = p\,(p + 1)(p + 2)\), et le pôle voisin de 0 vaut environ \(-K/2\) : stable. Les pôles ne traversent l'axe imaginaire qu'en \(K = 6\) : la boucle est stable pour \(0 \lt K \lt 6\).</p>
    <p><strong>Q3.</strong> À \(K = 6\), deux pôles valent \(\pm j\sqrt2\) : oscillation entretenue de pulsation \(\sqrt2 \approx 1{,}41\ \text{rad/s}\) (période 4,4 s). Au-delà, ces pôles passent à droite de l'axe imaginaire : oscillation croissante, instable.</p>
    <p><strong>Q4.</strong> Tableau de Routh : lignes \((1,\ 2)\), \((3,\ K)\), puis \(\big((3 \times 2 - 1 \times K)/3,\ 0\big) = \big((6 - K)/3,\ 0\big)\), puis \((K)\). Première colonne : \(1,\ 3,\ (6 - K)/3,\ K\), toute positive si et seulement si \(0 \lt K \lt 6\) : même conclusion. C'est aussi la condition \(a_2a_1 \gt a_3a_0\) du degré 3 : \(3 \times 2 \gt 1 \times K\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Lecture des marges sur Bode</h3>
  <div class="statement">La BO d'un asservissement donne : à \(\omega=10\ \text{rad/s}\), le gain est 0 dB et la phase est −120°. À \(\omega=30\ \text{rad/s}\), la phase est −180° et le gain est −10 dB.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(M_\varphi\) et \(M_G\).</div>
  <div class="q"><strong>Q2.</strong> Le système est-il stable ? Les marges sont-elles satisfaisantes ?</div>
  <div class="q"><strong>Q3.</strong> Si on double le gain K, de combien chute la marge de gain ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(M_\varphi = 180° + (-120°) = 60°\). \(M_G = -(-10) = +10\ \text{dB}\).</p>
    <p><strong>Q2.</strong> Système stable (les deux marges positives). Marges satisfaisantes : \(M_\varphi = 60° \geq 45°\) ✓ et \(M_G = 10\ \text{dB} \geq 6\ \text{dB}\) ✓.</p>
    <p><strong>Q3.</strong> Doubler K ajoute \(+6\ \text{dB}\) au gain. La marge de gain diminue de 6 dB : \(M_G = 10-6 = 4\ \text{dB}\). La marge de phase change aussi (le nouveau \(\omega_{c0}\) est différent) mais moins prévisible sans le tracé complet.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Marges insuffisantes et avance de phase (Q2-Q3 vues en 2ᵉ année)</h3>
  <div class="statement">\(H_{BO}(p) = \frac{K}{p(1+p)(1+0{,}1p)}\), \(K = 2\). Le cahier des charges impose \(M_\varphi \geq 45°\) et \(M_G \geq 10\) dB. On envisage un correcteur à avance de phase \(C(p) = \frac{1+\tau p}{1+a\tau p}\) avec \(a \lt 1\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(M_\varphi\) et \(M_G\) pour \(K=2\) sans correcteur. Quelle exigence n'est pas satisfaite ?</div>
  <div class="q"><strong>Q2.</strong> Quel est l'effet qualitatif d'un correcteur à avance de phase sur \(M_\varphi\) ?</div>
  <div class="q"><strong>Q3.</strong> Avec \(a=0{,}1\), l'avance de phase maximale est \(\varphi_{max} = \arcsin\frac{1-a}{1+a}\). Calculer \(\varphi_{max}\) et le gain du correcteur à la pulsation où elle est atteinte.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La résolution de \(\dfrac{2}{\omega\sqrt{1 + \omega^2}\sqrt{1 + 0{,}01\omega^2}} = 1\) (essais successifs) donne \(\omega_{c0} \approx 1{,}24\ \text{rad/s}\). Phase : \(-90° - \arctan 1{,}24 - \arctan 0{,}124\), soit \(-148{,}3°\), d'où \(M_\varphi \approx 32°\), insuffisante. La phase vaut \(-180°\) en \(\omega_\pi = 1/\sqrt{0{,}1} \approx 3{,}16\ \text{rad/s}\) ; le gain limite vaut \(1/1 + 1/0{,}1 = 11\), donc \(M_G = 20\log(11/2) \approx 14{,}8\ \text{dB}\), suffisante.</p>
    <p><strong>Q2.</strong> Un correcteur à avance de phase apporte une phase positive entre ses deux cassures → augmente \(M_\varphi\) s'il est placé autour de \(\omega_{c0}\). Il accélère aussi la réponse. En revanche il amplifie les bruits haute fréquence.</p>
    <p><strong>Q3.</strong> \(\varphi_{max} = \arcsin\frac{1-0{,}1}{1+0{,}1}\), soit \(\arcsin(0{,}818) \approx 54{,}9°\), atteinte au milieu logarithmique des cassures, où le gain du correcteur vaut \(1/\sqrt a \approx 3{,}16\) (+10 dB). Cette amplification déplace la pulsation de coupure : le réglage complet (choix de \(\tau\) et du gain) est la démarche de 2ᵉ année (<a href="#correcteurs/cours">« Correction des SLCI »</a>, §5).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Compenser le pôle du procédé : une fausse bonne idée (Q3-Q4 vues en 2ᵉ année)</h3>
  <div class="statement">Un procédé a pour fonction de transfert \(G(p) = \dfrac{K}{p(\tau p + 1)}\) avec \(K = 2\ \text{s}^{-1}\) et \(\tau = 0{,}5\ \text{s}\). On ferme une boucle à retour unitaire avec un correcteur \(C(p) = K_c\).</div>
  <div class="q"><strong>Q1.</strong> Écrire la FTBO \(H_{BO}(p) = C(p)\,G(p)\). Déterminer sa pulsation de coupure à 0 dB \(\omega_{c0}\) pour \(K_c = 1\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la marge de phase \(M_\varphi\). Le système est-il stable ?</div>
  <div class="q"><strong>Q3.</strong> Pour annuler l'écart de traînage, on remplace le gain par un correcteur PI \(C(p) = K_c\,\dfrac{1 + \tau_i p}{\tau_i p}\) et l'on choisit \(\tau_i = \tau\), pour que le zéro du correcteur compense le pôle du procédé. Calculer la FTBO, sa marge de phase et la FTBF. Conclure.</div>
  <div class="q"><strong>Q4.</strong> Proposer un meilleur choix de \(\tau_i\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(H_{BO}(p) = \dfrac{2K_c}{p\,(1 + 0{,}5p)}\), de module \(\dfrac{2K_c}{\omega\sqrt{1 + 0{,}25\,\omega^2}}\). Pour \(K_c = 1\), il vaut 1 quand \(\omega^2\,(1 + 0{,}25\,\omega^2) = 4\), soit \(0{,}25\,\omega^4 + \omega^2 - 4 = 0\). Avec \(u = \omega^2\) : \(u = \dfrac{-1 + \sqrt{1 + 4}}{0{,}5} \approx 2{,}47\), donc \(\omega_{c0} \approx 1{,}57\ \text{rad/s}\).</p>
    <p><strong>Q2.</strong> \(\arg H_{BO}(j\omega_{c0}) = -90° - \arctan(0{,}786)\), soit \(-128{,}2°\), d'où \(M_\varphi \approx 51{,}8°\). La phase n'atteint jamais \(-180°\) : la boucle est stable pour tout gain positif, et la marge de phase est confortable (au-dessus de 45°).</p>
    <p><strong>Q3.</strong> \(H_{BO}(p) = K_c\,\dfrac{1 + \tau p}{\tau p}\cdot\dfrac{K}{p\,(1 + \tau p)} = \dfrac{K_cK}{\tau p^2}\) : un double intégrateur, dont la phase vaut \(-180°\) à toute pulsation. La marge de phase est <strong>nulle</strong>. La FTBF \(\dfrac{K_cK/\tau}{p^2 + K_cK/\tau}\) a des pôles imaginaires purs : la sortie oscille indéfiniment, la boucle est à la limite de stabilité. Compenser le pôle d'un procédé qui contient déjà un intégrateur est désastreux.</p>
    <p><strong>Q4.</strong> On place la cassure du PI une décade sous la coupure : \(1/\tau_i \approx \omega_{c0}/10 \approx 0{,}16\ \text{rad/s}\), soit \(\tau_i \approx 6\ \text{s}\). En \(\omega_{c0}\), le PI ne retire qu'environ \(\arctan(1/(6 \times 1{,}57)) \approx 6°\) : la marge de phase reste voisine de 46° ; l'écart de traînage s'annule (classe 2), au prix d'une convergence finale lente.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Pôles, amortissement et dépassement</h3>
  <div class="statement">Un asservissement à retour unitaire a pour FTBO \(H_{BO}(p) = \dfrac{K}{p\,(1 + 0{,}2p)}\), \(K \gt 0\) en s⁻¹.</div>
  <div class="q"><strong>Q1.</strong> Écrire l'équation caractéristique. La boucle fermée est-elle stable ?</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(\omega_0\) et \(\xi\) de la FTBF en fonction de \(K\). Pour quelle valeur de \(K\) a-t-on \(\xi = 0{,}5\) ? Placer alors les pôles dans le plan complexe et calculer le dépassement.</div>
  <div class="q"><strong>Q3.</strong> Le cahier des charges impose un dépassement inférieur à 5 %. Quel gain maximal peut-on choisir ?</div>
  <div class="q"><strong>Q4.</strong> Pour \(K = 5\), calculer la marge de phase et vérifier la règle \(\xi \approx M_\varphi/100\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(1 + H_{BO} = 0\) donne \(0{,}2p^2 + p + K = 0\), soit \(p^2 + 5p + 5K = 0\) : degré 2, coefficients positifs, stable pour tout \(K \gt 0\).</p>
    <p><strong>Q2.</strong> Par identification avec \(p^2 + 2\xi\omega_0 p + \omega_0^2\) : \(\omega_0 = \sqrt{5K}\) et \(\xi = \dfrac{5}{2\sqrt{5K}}\). \(\xi = 0{,}5\) impose \(\sqrt{5K} = 5\), soit \(K = 5\ \text{s}^{-1}\) : \(\omega_0 = 5\ \text{rad/s}\), pôles \(-2{,}5 \pm 4{,}33j\), sur la demi-droite à 60° de l'axe réel négatif (\(\cos 60° = 0{,}5\)). Dépassement : \(e^{-\pi \times 0{,}5/\sqrt{0{,}75}} \approx 16\ \%\) ; temps de réponse à 5 % voisin de \(3/2{,}5 \approx 1{,}2\ \text{s}\) (1,06 s exactement).</p>
    <p><strong>Q3.</strong> \(D_1 \leq 5\ \%\) demande \(\xi \geq 0{,}69\), soit \(\sqrt{5K} \leq \dfrac{5}{2 \times 0{,}69} \approx 3{,}62\) et \(K \leq 2{,}6\ \text{s}^{-1}\). Moins de gain, c'est un meilleur amortissement mais une boucle plus lente et moins précise en traînage.</p>
    <p><strong>Q4.</strong> \(\dfrac{5}{\omega\sqrt{1 + 0{,}04\,\omega^2}} = 1\) donne \(0{,}04\,\omega^4 + \omega^2 - 25 = 0\), \(\omega_{c0} \approx 3{,}93\ \text{rad/s}\) ; \(M_\varphi = 90° - \arctan 0{,}786 \approx 52°\). La règle donne \(\xi \approx 0{,}52\), pour une valeur exacte de 0,5 : elle est vérifiée.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Stabiliser un système instable en boucle ouverte</h3>
  <div class="statement">Un système de lévitation magnétique, linéarisé autour de son point d'équilibre, a pour fonction de transfert \(G(p) = \dfrac{4}{(p - 2)(1 + 0{,}1p)}\) (temps en secondes). On le commande par un correcteur proportionnel \(C(p) = K_c \gt 0\), en retour unitaire.</div>
  <div class="q"><strong>Q1.</strong> Le processus seul est-il stable ? Peut-on appliquer le critère du revers à cette boucle ?</div>
  <div class="q"><strong>Q2.</strong> Écrire l'équation caractéristique de la boucle fermée. Pour quelles valeurs de \(K_c\) est-elle stable ?</div>
  <div class="q"><strong>Q3.</strong> Pour \(K_c = 2\), calculer les pôles de la FTBF, son amortissement et son gain statique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le processus a un pôle \(+2\) à partie réelle positive : il est instable (la bille tombe ou se colle à l'électroaimant). Le critère du revers suppose une boucle ouverte stable : il ne s'applique pas ; on revient aux pôles de la FTBF.</p>
    <p><strong>Q2.</strong> \(1 + K_c\,G(p) = 0\) donne \((p - 2)(1 + 0{,}1p) + 4K_c = 0\), soit \(0{,}1p^2 + 0{,}8p + (4K_c - 2) = 0\). Degré 2 : stable si et seulement si les trois coefficients sont positifs, c'est-à-dire \(K_c \gt 0{,}5\). Il faut un gain <strong>minimal</strong> pour stabiliser, à l'inverse des boucles ouvertes stables.</p>
    <p><strong>Q3.</strong> \(0{,}1p^2 + 0{,}8p + 6 = 0\), soit \(p^2 + 8p + 60 = 0\) : pôles \(-4 \pm 6{,}63j\), stables. \(\omega_0 = \sqrt{60} \approx 7{,}75\ \text{rad/s}\), \(\xi = 4/7{,}75 \approx 0{,}52\) (dépassement voisin de 15 %). Gain statique : \(\dfrac{K_c\,G(0)}{1 + K_c\,G(0)}\) avec \(G(0) = -2\), soit \(\dfrac{-4}{1 - 4} \approx 1{,}33\) : la sortie dépasse durablement la consigne d'un tiers, il faudra un correcteur plus riche (ou une consigne corrigée) pour la précision.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Commande à distance : l'effet d'un retard</h3>
  <div class="statement">Un robot d'inspection est piloté à distance. Sa boucle de position a pour FTBO \(H_{BO}(p) = \dfrac{5\,e^{-Tp}}{p\,(1 + 0{,}2p)}\), où \(T\) est le retard de la liaison radio.</div>
  <div class="q"><strong>Q1.</strong> Sans retard (\(T = 0\)), calculer \(\omega_{c0}\) et \(M_\varphi\). Quelle est la marge de gain ?</div>
  <div class="q"><strong>Q2.</strong> Le retard modifie-t-il \(\omega_{c0}\) ? Quel retard maximal la boucle tolère-t-elle avant de devenir instable ?</div>
  <div class="q"><strong>Q3.</strong> Pour \(T = 0{,}1\ \text{s}\) : calculer la marge de phase, puis la pulsation \(\omega_\pi\) (par essais successifs) et la marge de gain.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(0{,}04\,\omega^4 + \omega^2 - 25 = 0\) donne \(\omega_{c0} \approx 3{,}93\ \text{rad/s}\) ; \(M_\varphi = 90° - \arctan(0{,}786) \approx 51{,}8°\). Sans retard, la phase n'atteint jamais \(-180°\) : marge de gain infinie.</p>
    <p><strong>Q2.</strong> \(|e^{-j\omega T}| = 1\) : le gain et donc \(\omega_{c0}\) sont inchangés. Le retard retire \(\omega_{c0}T\) à la marge de phase ; la boucle devient instable quand \(\omega_{c0}T\) atteint \(51{,}8° = 0{,}904\ \text{rad}\), soit \(T_{max} = 0{,}904/3{,}93 \approx 0{,}23\ \text{s}\).</p>
    <p><strong>Q3.</strong> Perte \(3{,}93 \times 0{,}1 = 0{,}393\ \text{rad} \approx 22{,}5°\) : \(M_\varphi \approx 29°\). La phase vaut \(-180°\) quand \(\arctan(0{,}2\omega) + 5{,}73\,\omega = 90°\) (le terme \(0{,}1\omega\) converti en degrés) : par essais, \(\omega_\pi \approx 6{,}5\ \text{rad/s}\). Le gain y vaut \(\dfrac{5}{6{,}53\sqrt{1 + 0{,}04 \times 6{,}53^2}} \approx 0{,}47\), soit \(M_G \approx 6{,}6\ \text{dB}\) : le retard a fait apparaître un gain limite (environ 10,7 au lieu de l'infini).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Stabilité de l'asservissement d'une antenne</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>stabilité et marges</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    On étudie l'asservissement en position angulaire d'une antenne de télécommunication. Le cahier des charges impose : boucle fermée stable, \(M_\varphi \geq 45°\), \(M_G \geq 10\ \text{dB}\), dépassement inférieur à 25 %.
  </div>
  <p class="exo-part">Partie A — Lecture d'un premier relevé</p>
  <div class="statement">Sur un premier prototype, on relève le diagramme de Bode de la FTBO : à la pulsation de coupure à 0 dB \(\omega_{c0}\), la phase vaut \(-135°\) ; à la pulsation \(\omega_\pi\) où la phase vaut \(-180°\), le gain vaut \(-8\ \text{dB}\).</div>
  <div class="q"><strong>A1.</strong> Définir et déterminer la marge de phase \(M_\varphi\) et la marge de gain \(M_G\).</div>
  <div class="q"><strong>A2.</strong> Le prototype est-il stable ? Respecte-t-il le cahier des charges ? Que se passe-t-il si l'on augmente le gain de la FTBO de 8 dB ?</div>
  <p class="exo-part">Partie B — Modèle de l'antenne</p>
  <div class="statement">Le modèle retenu pour l'antenne définitive (moteur, réducteur, capteur, amplificateur de gain réglable \(K_c\)) donne, après réduction du schéma-blocs, \(H_{BO}(p) = \dfrac{10\,K_c}{p\,(1 + 0{,}1p)(1 + 0{,}01p)}\) (temps en secondes).</div>
  <div class="q"><strong>B1.</strong> Écrire l'équation caractéristique. Déterminer, par la recherche des pôles imaginaires purs, le gain \(K_c\) limite et la pulsation des oscillations à la limite.</div>
  <div class="q"><strong>B2.</strong> Pour \(K_c = 1\), calculer \(\omega_{c0}\) (par essais successifs), \(M_\varphi\) et \(M_G\).</div>
  <p class="exo-part">Partie C — Réglage du gain</p>
  <div class="q"><strong>C1.</strong> Déterminer \(K_c\) pour obtenir exactement \(M_\varphi = 45°\). Vérifier la marge de gain.</div>
  <div class="q"><strong>C2.</strong> Estimer le dépassement de la réponse indicielle. Le cahier des charges est-il respecté ?</div>
  <div class="q"><strong>C3.</strong> Quel gain faudrait-il pour \(M_\varphi = 60°\) ? Quel en serait l'inconvénient ?</div>
  <p class="exo-part">Partie D — Télécommande par liaison radio</p>
  <div class="q"><strong>D1.</strong> La consigne et la mesure transitent par une liaison radio qui ajoute un retard \(T = 30\ \text{ms}\) dans la boucle. Avec le réglage de C1, que devient la marge de phase ?</div>
  <div class="q"><strong>D2.</strong> Proposer un nouveau gain \(K_c\) qui rétablit \(M_\varphi = 45°\) et vérifier la marge de gain.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> La marge de phase est l'écart à \(-180°\) de la phase à la pulsation de coupure à 0 dB : \(M_\varphi = 180° + \varphi(\omega_{c0}) = 180° - 135° = 45°\). La marge de gain est l'écart à 0 dB du gain à la pulsation où la phase vaut \(-180°\) : \(M_G = 0 - (-8) = 8\ \text{dB}\).</p>
    <p><strong>A2.</strong> Les deux marges sont positives : stable. La marge de phase est conforme, mais \(M_G = 8\ \text{dB} \lt 10\ \text{dB}\) : le cahier des charges n'est pas respecté. Augmenter le gain de 8 dB monte la courbe de gain de 8 dB sans changer la phase : en \(\omega_\pi\) le gain atteint 0 dB, \(M_G = 0\), et la boucle est à la limite de stabilité (oscillations entretenues).</p>
    <p><strong>B1.</strong> \(p\,(1 + 0{,}1p)(1 + 0{,}01p) + 10K_c = 0\), soit \(0{,}001p^3 + 0{,}11p^2 + p + 10K_c = 0\). Avec \(p = j\omega\) : partie imaginaire \(\omega - 0{,}001\,\omega^3 = 0\), donc \(\omega = \sqrt{1000} \approx 31{,}6\ \text{rad/s}\) ; partie réelle \(10K_c - 0{,}11\,\omega^2 = 0\), donc \(10K_c = 110\) et \(K_{c,lim} = 11\). Stable pour \(0 \lt K_c \lt 11\) (on retrouve \(10K_{c,lim} = 1/0{,}1 + 1/0{,}01\)).</p>
    <p><strong>B2.</strong> \(|H_{BO}(j\omega)| = 1\) donne, par essais, \(\omega_{c0} \approx 7{,}84\ \text{rad/s}\) ; phase \(-90° - \arctan 0{,}784 - \arctan 0{,}0784\), soit \(-132{,}6°\) : \(M_\varphi \approx 47°\). \(M_G = 20\log(K_{c,lim}/K_c)\), soit \(20\log 11 \approx 20{,}8\ \text{dB}\).</p>
    <p><strong>C1.</strong> La phase vaut \(-135°\) quand \(\arctan(0{,}1\omega) + \arctan(0{,}01\omega) = 45°\), soit \(\dfrac{0{,}11\,\omega}{1 - 0{,}001\,\omega^2} = 1\) : \(\omega \approx 8{,}44\ \text{rad/s}\). On y impose un gain de 1 :</p><div class=\"formula\">$$10K_c = 8{,}44\,\sqrt{1 + 0{,}844^2}\,\sqrt{1 + 0{,}0844^2} \approx 11{,}1,$$</div><p>donc \(K_c \approx 1{,}11\). \(M_G = 20\log(11/1{,}11) \approx 19{,}9\ \text{dB} \geq 10\ \text{dB}\).</p>
    <p><strong>C2.</strong> Règle \(\xi \approx M_\varphi/100 \approx 0{,}45\), d'où \(D_1 \approx e^{-\pi \times 0{,}45/\sqrt{1 - 0{,}2}} \approx 20\ \%\) ; le calcul des pôles de la FTBF (\(-4{,}4 \pm 9{,}5j\) et \(-101\)) donne \(\xi \approx 0{,}42\) et 23 %. Moins de 25 % : le cahier des charges est respecté, de justesse.</p>
    <p><strong>C3.</strong> La phase vaut \(-120°\) quand \(\dfrac{0{,}11\,\omega}{1 - 0{,}001\,\omega^2} = \tan 30°\), soit \(\omega \approx 5{,}1\ \text{rad/s}\), d'où \(10K_c \approx 5{,}75\) et \(K_c \approx 0{,}57\). La réponse dépasserait peu (environ 9 %) mais la boucle serait plus lente (\(\omega_{c0}\) de 8,4 à 5,1 rad/s) et moins précise en traînage (gain divisé par 2).</p>
    <p><strong>D1.</strong> Le retard ne change pas \(\omega_{c0} \approx 8{,}44\ \text{rad/s}\) mais retire \(8{,}44 \times 0{,}03 = 0{,}253\ \text{rad} \approx 14{,}5°\) : \(M_\varphi \approx 30{,}5°\), insuffisant ; dépassement attendu autour de 40 %.</p>
    <p><strong>D2.</strong> Il faut maintenant</p><div class=\"formula\">$$\arctan(0{,}1\omega) + \arctan(0{,}01\omega) + 0{,}03\,\omega \times \frac{180}{\pi} = 45°\ ;$$</div><p>par essais, \(\omega \approx 6{,}04\ \text{rad/s}\), d'où</p><div class=\"formula\">$$10K_c = 6{,}04\,\sqrt{1 + 0{,}604^2}\,\sqrt{1 + 0{,}0604^2} \approx 7{,}08$$</div><p>et \(K_c \approx 0{,}71\). La phase vaut alors \(-180°\) vers 14,8 rad/s, où \(M_G \approx 11{,}6\ \text{dB}\) : conforme. Le retard coûte environ 30 % de rapidité.</p>
  </div>
</div>
