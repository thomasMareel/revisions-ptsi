<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">La machine à courant continu (MCC) est l'actionneur électrique le plus simple à modéliser : deux relations linéaires, \(E = K\Omega\) et \(C_{em} = KI\), relient le monde électrique au monde mécanique. Elle occupe la fonction <strong>convertir</strong> de la chaîne de puissance, juste après le convertisseur statique qui assure la fonction <strong>moduler</strong> (<a href="#ingsys/cours">« Ingénierie système »</a>, §8 ; <a href="#cvs/cours">« Convertisseurs statiques »</a>). Son principe physique est établi en physique (<a href="#induction/cours">« Induction électromagnétique »</a>, §8 et §11) ; ce chapitre en fait un modèle d'ingénieur : équations, schéma-blocs, quadrants, bilan de puissance, réponse à un échelon, association avec un hacheur.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités du programme, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Identifier et décrire les chaînes fonctionnelles</strong> : fonctions alimenter, moduler, convertir, transmettre et agir (A3, S1) ; <strong>identifier les grandeurs d'effort et de flux</strong> (D1, S2) : tension et courant, couple et vitesse (§1).</li>
        <li><strong>Analyser le fonctionnement du moteur à courant continu</strong> à partir des rails de Laplace et citer des exemples d'utilisation (programme de physique de PTSI, partie 1.7.5) : force de Laplace, f.é.m. induite, conversion parfaite \(EI = C_{em}\Omega\) (§2, §3, §10).</li>
        <li><strong>Écrire les équations électrique et mécanique en précisant les conventions de signe</strong> (physique, 1.7.5) (§3).</li>
        <li><strong>Établir un modèle de connaissance par des fonctions de transfert</strong> et <strong>modéliser un système par schéma-blocs</strong> (B2, S1) (§4, §6).</li>
        <li><strong>Réversibilité</strong> : fonctionnement dans les quatre quadrants et réversibilité exigée de l'alimentation (B2, S2, avec « Convertisseurs statiques » §3) (§4, §8).</li>
        <li><strong>Effectuer un bilan énergétique</strong> (physique, 1.7.5) : pertes et rendement (§5).</li>
        <li><strong>Déterminer la réponse temporelle</strong> d'un modèle d'ordre 1 ou 2 à un échelon (C2, S1) et <strong>établir un modèle de comportement</strong> à partir d'une réponse temporelle (B2, S2) (§6, §9).</li>
        <li>Point de fonctionnement avec une charge (§7) ; association avec le convertisseur qui la module, le hacheur (B2, S2) (§8).</li>
        <li><strong>Choisir les entrées à imposer et les sorties pour identifier un modèle</strong> (D2, S2) : essais d'identification (§9).</li>
      </ul>
      <p><strong>Vu en avance (2ᵉ année)</strong> : le programme de sciences industrielles place le <em>modèle électromécanique de la machine à courant continu</em> et le <em>bilan des puissances</em> d'un convertisseur électromécanique au semestre S4 (compétence B2 « Modéliser un convertisseur électromécanique »), de même que la commande des machines en couple et en vitesse ; le rendement, l'inertie et le couple ramenés relèvent du semestre S3, l'ondulation du courant dans un convertisseur aussi. Ce modèle est pourtant utilisé dès la 1ʳᵉ année : ses équations sont exactement celles que la physique de PTSI établit pour le moteur à entrefer plan, et la MCC est l'exemple type des modèles du premier et du deuxième ordre. Le chapitre « Machines synchrone et asynchrone » de 2ᵉ année en fait le rappel (§9).</p>
      <p>Hors programme (fin de chapitre) : la physique interne des machines (formule de la f.é.m. en fonction du bobinage, réaction d'induit, commutation), les modes d'excitation et le réglage de vitesse par le flux.</p>
      <p>Notations (celles de la 2ᵉ année) : \(u\), \(i\), \(e\) pour les grandeurs qui varient, \(U\), \(I\), \(E\) en régime permanent ; \(K\) constante de f.é.m. et de couple (on la trouve aussi notée \(k\), en particulier dans le simulateur et les premières cartes de ce chapitre, et dans « Convertisseurs statiques ») ; \(C_{em}\) couple électromagnétique, \(C_r\) couple résistant, \(C_u\) couple utile sur l'arbre ; \(\Omega\) vitesse angulaire en rad/s ; \(\alpha\) rapport cyclique du hacheur.</p>
    </div>

<div class="course-section">
  <div class="sec-num">§1 · PRÉSENTATION</div>
  <h2>La machine à courant continu : convertisseur électromécanique</h2>
  <div class="intro">La MCC est un convertisseur d'énergie totalement réversible. Elle peut fonctionner dans les deux sens : électrique → mécanique (moteur) ou mécanique → électrique (génératrice). C'est l'actionneur électromécanique de référence en automatique et en robotique.</div>

  <h3>Deux modes de fonctionnement</h3>
  <div class="def-box">
    <strong>Mode moteur (récepteur) :</strong> la machine convertit de l'énergie électrique en énergie mécanique.
    $$P_{\text{élec}} = U \cdot I \longrightarrow P_{\text{méc}} = C_u \cdot \Omega$$
  </div>
  <div class="def-box">
    <strong>Mode génératrice (générateur) :</strong> la machine convertit de l'énergie mécanique en énergie électrique.
    $$P_{\text{méc}} = C_u \cdot \Omega \longrightarrow P_{\text{élec}} = U \cdot I$$
  </div>
  <p>Dans les deux cas, un <strong>champ magnétique</strong> est indispensable à la conversion. C'est pourquoi on parle de convertisseur <em>électromécanique</em>.</p>

  <h3>Les trois grandes parties de la machine</h3>
  <ul>
    <li><strong>Stator (inducteur) :</strong> partie fixe. Produit le champ magnétique, soit par des aimants permanents (ferrites, néodyme-fer-bore), soit par des bobines (enroulement inducteur) parcourues par un courant continu.</li>
    <li><strong>Rotor (induit) :</strong> partie mobile. Cylindre en tôles magnétiques isolées, sur lequel sont répartis les conducteurs actifs. C'est la partie qui tourne.</li>
    <li><strong>Collecteur à balais :</strong> assure la liaison électrique entre le circuit fixe et le rotor en rotation. Le collecteur (lames de cuivre) est solidaire du rotor, les balais (charbons) sont fixes et frottent sur le collecteur.</li>
  </ul>
  <p>L'<strong>entrefer</strong> désigne l'espace entre le stator et le rotor, là où se situent les conducteurs actifs soumis aux forces électromagnétiques.</p>

  <h3>Rôle du collecteur à balais</h3>
  <p>Le collecteur remplit deux fonctions essentielles :</p>
  <ul>
    <li>Alimenter l'induit en courant (passage du courant des balais fixes vers les conducteurs rotatifs).</li>
    <li><strong>Inverser le sens du courant</strong> dans les spires au bon moment, afin de maintenir le couple toujours dans le même sens et assurer la continuité du mouvement.</li>
  </ul>
  <div class="notice">
    Sans le collecteur, le couple changerait de sens à chaque demi-tour et le moteur s'arrêterait. C'est le collecteur qui transforme un courant alternatif induit en courant continu aux bornes (ou inversement). Revers de la médaille : les balais s'usent et produisent des étincelles, d'où l'essor des machines « sans balais », où un onduleur et un capteur de position remplacent le collecteur (2ᵉ année : « Machines synchrone et asynchrone », §7).
  </div>

  <h3>La MCC dans la chaîne de puissance</h3>
  <p>Dans un système, la MCC assure la fonction <strong>convertir</strong> : elle reçoit l'énergie électrique dosée par le modulateur (un hacheur, piloté par la chaîne d'information) et la rend sous forme mécanique au transmetteur (réducteur, poulies, vis), qui la porte jusqu'à l'effecteur. Chaque liaison transporte une puissance qui est le produit d'une <strong>grandeur d'effort</strong> et d'une <strong>grandeur de flux</strong> : tension \(U\) et courant \(I\) côté électrique, couple \(C\) et vitesse angulaire \(\Omega\) côté mécanique (force et vitesse en translation).</p>
  <div class="method-box">
    <strong>Exemple — efforts et flux le long de la chaîne d'une visseuse sans fil</strong>
    <p>Batterie 18 V (alimenter), variateur à gâchette, c'est-à-dire un hacheur (moduler), MCC (convertir), réducteur épicycloïdal de rapport 1/12 et de rendement 0,90 (transmettre), mandrin et embout (agir). Gâchette enfoncée : le moteur absorbe 10 A et tourne à 18 000 tr/min avec un rendement de 0,75.</p>
    <ol>
      <li>Puissance absorbée par le moteur : \(P_a = UI = 18 \times 10 = 180\ \text{W}\) (effort \(U\), flux \(I\)).</li>
      <li>Puissance mécanique du moteur : \(0{,}75 \times 180 = 135\ \text{W}\) ; vitesse \(\Omega_m = 18\,000 \times \pi/30 = 1\,885\ \text{rad/s}\), d'où le couple \(C_m = 135/1\,885 = 0{,}072\ \text{N·m}\).</li>
      <li>En sortie du réducteur : \(\Omega_s = \Omega_m/12 = 157\ \text{rad/s}\) (1 500 tr/min), \(P_s = 0{,}90 \times 135 = 121{,}5\ \text{W}\), \(C_s = 121{,}5/157 = 0{,}77\ \text{N·m}\) : le réducteur divise le flux par 12 et multiplie l'effort par \(12 \times 0{,}90 = 10{,}8\).</li>
      <li>Autonomie à pleine puissance avec une batterie de 2 Ah : énergie \(18 \times 2 = 36\ \text{Wh}\), soit environ \(36/180\ \text{h} = 12\ \text{min}\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · PRINCIPE DE FONCTIONNEMENT</div>
  <h2>Loi de Laplace et force électromotrice</h2>
  <div class="intro">Le fonctionnement de la MCC repose sur deux lois de l'électromagnétisme, établies en physique : la force de Laplace (force sur un conducteur parcouru par un courant dans un champ magnétique) et la loi de Faraday (f.é.m. induite dans un conducteur en mouvement dans un champ magnétique). Le moteur à entrefer plan de <a href="#induction/cours">« Induction électromagnétique »</a> (§11) en est la version la plus simple : des rails de Laplace « enroulés » en cercle.</div>

  <h3>Force de Laplace — mode moteur</h3>
  <div class="def-box">
    Un élément de conducteur \(\mathrm{d}\vec\ell\), parcouru par un courant \(I\) et plongé dans un champ magnétique \(\vec{B}\), est soumis à la force élémentaire :
    $$\mathrm{d}\vec{F} = I\,\mathrm{d}\vec{\ell} \wedge \vec{B}$$
    Direction : règle des trois doigts de la main droite (pouce = courant, index = champ, majeur = force).
  </div>
  <p>Dans la MCC en mode moteur : l'induit, parcouru par le courant, est plongé dans le champ de l'inducteur → forces de Laplace → couple → rotation. Le collecteur inverse le courant au bon moment pour maintenir le couple dans le même sens.</p>

  <h3>Loi de Faraday — mode génératrice</h3>
  <p>Un circuit dont le flux magnétique \(\Phi\) varie est le siège d'une force électromotrice (f.é.m.), en convention générateur :</p>
  <div class="formula">$$e = -\frac{\mathrm{d}\Phi}{\mathrm{d}t}$$</div>
  <p>Dans la MCC en mode génératrice : un couple extérieur impose la rotation → les conducteurs balaient le champ de l'inducteur → f.é.m. → courant si une charge est branchée. En mode moteur, la même f.é.m. existe et s'oppose au courant qui fait tourner la machine (loi de Lenz) : on l'appelle <strong>force contre-électromotrice</strong> et on la note \(E\), fléchée en convention récepteur.</p>

  <h3>Les deux situations résumées</h3>
  <div class="prop-box">
    <strong>Courant \(I\) imposé + champ \(\vec B\)</strong> → forces → couple → rotation → <em>moteur</em> (récepteur).<br>
    <strong>Vitesse \(\Omega\) imposée + champ \(\vec B\)</strong> → f.é.m. \(E\) → tension aux bornes → <em>génératrice</em> (générateur).<br>
    Les deux effets coexistent toujours : un moteur qui tourne produit une f.é.m., une génératrice qui débite subit un couple résistant.
  </div>
  <div class="method-box">
    <strong>Exemple — d'où vient la constante \(K\) (modèle simplifié)</strong>
    <p>Un induit de rayon \(r = 2\ \text{cm}\) porte, sous les pôles, \(N = 100\) conducteurs actifs de longueur \(\ell = 5\ \text{cm}\), reliés en série par le collecteur, dans un champ radial \(B = 0{,}60\ \text{T}\).</p>
    <ol>
      <li>Force sur un conducteur parcouru par \(I = 3\ \text{A}\) : \(F = BI\ell = 0{,}60 \times 3 \times 0{,}05 = 0{,}090\ \text{N}\), tangente au rotor ; moment \(rF = 1{,}8\ \text{mN·m}\). Pour les 100 conducteurs : \(C_{em} = NB\ell r\,I = 0{,}18\ \text{N·m}\).</li>
      <li>F.é.m. d'un conducteur, de vitesse \(v = r\Omega\) : \(B\ell v = B\ell r\,\Omega\) ; à \(\Omega = 340\ \text{rad/s}\), \(0{,}204\ \text{V}\), soit \(E = NB\ell r\,\Omega = 20{,}4\ \text{V}\) pour les 100 conducteurs en série.</li>
      <li>Le même produit \(K = NB\ell r = 0{,}060\) apparaît dans les deux relations : \(C_{em} = KI\) (en N·m/A) et \(E = K\Omega\) (en V·s/rad). Ce sont les valeurs du moteur de référence utilisé dans tout le chapitre (§3).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MODÉLISATION ÉLECTROMÉCANIQUE</div>
  <h2>F.é.m., couple et équations de la MCC</h2>
  <div class="intro">Pour analyser et concevoir des systèmes utilisant une MCC, on établit des modèles mathématiques reliant les grandeurs électriques (\(U\), \(I\), \(E\)) aux grandeurs mécaniques (\(\Omega\), \(C_{em}\)). Ces modèles sont les fondements du dimensionnement et de l'asservissement. On suppose le flux de l'inducteur constant (aimants permanents, ou inducteur bobiné alimenté sous courant constant).</div>

  <h3>Force électromotrice et couple électromagnétique</h3>
  <div class="prop-box">
    <strong>Relations de la MCC à flux constant.</strong> La f.é.m. est proportionnelle à la vitesse, le couple électromagnétique au courant, avec la <strong>même constante</strong> \(K\) :
    <div class="formula" data-nom="F.é.m. et couple de la MCC">$$E = K\,\Omega \qquad\qquad C_{em} = K\,I$$</div>
    \(K\) s'exprime en V·s/rad (pour \(E\)) ou, ce qui est équivalent, en N·m/A (pour \(C_{em}\)). La puissance électromagnétique est convertie sans perte : \(P_{em} = EI = C_{em}\,\Omega\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi la même constante dans les deux relations</span>
    <div class="content">
      <p>Les forces de Laplace qui s'exercent sur les conducteurs et la f.é.m. induite dans ces mêmes conducteurs ont la même origine. En physique, on montre que la puissance des forces de Laplace est l'opposée de la puissance électrique de la f.é.m. induite (\(P_L + e\,i = 0\), <a href="#induction/cours">« Induction »</a>, §8). Avec \(e = -E\) (f.c.é.m. fléchée en convention récepteur) : \(C_{em}\,\Omega = E\,I\) quels que soient \(I\) et \(\Omega\). Si \(E = K_E\,\Omega\) et \(C_{em} = K_T\,I\), alors \(K_T\,I\,\Omega = K_E\,\Omega\,I\), donc \(K_T = K_E\) en unités SI.</p>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : un catalogue donne souvent la constante de f.é.m. en V pour 1 000 tr/min et la constante de couple en mN·m/A ; les deux nombres diffèrent, mais c'est la même constante une fois convertie en unités SI (§10). Toujours exprimer \(\Omega\) en rad/s : \(\Omega = \pi N/30\) si \(N\) est en tr/min.</div>

  <h3>Équation électrique de l'induit</h3>
  <p>L'induit est modélisé par une résistance \(R\) (résistance des bobinages et des contacts balais-collecteur), une inductance \(L\) (inductance du bobinage) et la f.é.m. en série. En convention récepteur (moteur) :</p>

</figure>
  <div class="formula" data-nom="Équation électrique de la MCC">$$u = e + R\,i + L\,\frac{\mathrm{d}i}{\mathrm{d}t} \qquad\text{avec } e = K\,\Omega$$</div>
  <p><strong>En régime permanent</strong> (courant constant, \(L\,\mathrm{d}i/\mathrm{d}t = 0\)) :</p>
  <div class="formula" data-nom="MCC en régime permanent">$$U = E + R\,I$$</div>
  <p><strong>En convention générateur</strong> (génératrice qui débite, courant fléché sortant par la borne +) : \(u = e - R\,i - L\,\dfrac{\mathrm{d}i}{\mathrm{d}t}\), soit \(U = E - RI\) en régime permanent. On peut aussi garder la convention récepteur : le courant est alors simplement négatif (§4).</p>

  <h3>Équation mécanique</h3>
  <p>Le principe fondamental de la dynamique appliqué au rotor et à la charge qu'il entraîne, en rotation autour de son axe (théorème du moment dynamique) :</p>
  <div class="formula" data-nom="Équation mécanique de la MCC">$$J\,\frac{\mathrm{d}\Omega}{\mathrm{d}t} = C_{em} - C_r - f\,\Omega$$</div>
  <p>avec \(J\) le moment d'inertie du rotor et de la charge ramenée sur son arbre (kg·m²), \(f\) le coefficient de frottement visqueux (N·m·s/rad), \(C_r\) le couple résistant de la charge (N·m). En régime permanent (\(\mathrm{d}\Omega/\mathrm{d}t = 0\)) : \(C_{em} = C_r + f\,\Omega\).</p>
  <div class="method-box">
    <strong>Exemple — point de fonctionnement du moteur de référence</strong>
    <p>Moteur de référence du chapitre : \(R = 1{,}2\ \Omega\), \(L = 1{,}5\ \text{mH}\), \(K = 0{,}060\ \text{V·s/rad}\), \(J = 4{,}0\times10^{-5}\ \text{kg·m}^2\) (rotor et charge), frottements négligés. Alimenté sous \(U = 24\ \text{V}\), il entraîne une charge de couple résistant \(C_r = 0{,}18\ \text{N·m}\).</p>
    <ol>
      <li>Équation mécanique en régime permanent : \(C_{em} = C_r\), donc \(I = C_r/K = 0{,}18/0{,}060 = 3{,}0\ \text{A}\). C'est la charge qui fixe le courant.</li>
      <li>Équation électrique : \(E = U - RI = 24 - 1{,}2 \times 3{,}0 = 20{,}4\ \text{V}\).</li>
      <li>Vitesse : \(\Omega = E/K = 20{,}4/0{,}060 = 340\ \text{rad/s}\), soit \(340 \times 30/\pi \approx 3\,250\ \text{tr/min}\). C'est la tension qui fixe (à peu près) la vitesse.</li>
      <li>Contrôle énergétique : \(UI = 72\ \text{W} = RI^2 + EI = 10{,}8 + 61{,}2\) et \(EI = 61{,}2\ \text{W} = C_{em}\Omega = 0{,}18 \times 340\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SCHÉMA BLOC ET CARACTÉRISTIQUE</div>
  <h2>Modèle de comportement et fonctionnement en 4 quadrants</h2>
  <div class="intro">Le passage dans le domaine de Laplace permet d'obtenir le schéma-blocs de la chaîne de conversion électromécanique, indispensable pour l'automatique. La caractéristique couple-vitesse illustre les quatre modes de fonctionnement possibles.</div>

  <h3>Modèle dans le domaine de Laplace</h3>
  <p>En appliquant la transformée de Laplace (conditions initiales nulles) aux équations de la MCC :</p>
  <div class="formula">$$U(p) = E(p) + (R + Lp)\,I(p)$$</div>
  <div class="formula">$$E(p) = K\,\Omega(p) \qquad C_{em}(p) = K\,I(p)$$</div>
  <div class="formula">$$C_{em}(p) - C_r(p) = (f + Jp)\,\Omega(p)$$</div>

  <div class="notice">
    La boucle de la f.é.m. n'est pas celle d'un système asservi : aucun capteur, aucun correcteur, c'est la <strong>contre-réaction naturelle</strong> de la machine. Elle stabilise la vitesse : si \(\Omega\) augmente, \(E\) augmente, \(I\) diminue et \(C_{em}\) diminue. Réduction du schéma (<a href="#schblocs/cours">« Schéma-blocs »</a>, §3) et réponse à un échelon : §6.
  </div>

  <h3>Caractéristique couple-vitesse</h3>
  <p>En régime permanent, \(U = K\Omega + RI\) et \(C_{em} = KI\) donnent :</p>
  <div class="formula" data-nom="Caractéristique couple-vitesse">$$C_{em} = \frac{K}{R}\,U - \frac{K^2}{R}\,\Omega \qquad\Longleftrightarrow\qquad \Omega = \frac{U}{K} - \frac{R}{K^2}\,C_{em}$$</div>
  <p>C'est un réseau de droites parallèles, une par valeur de \(U\), de pente \(-K^2/R\) (toujours négative). Deux points remarquables : le <strong>couple de démarrage</strong> \(C_{dém} = KU/R\) (à \(\Omega = 0\), courant \(I_{dém} = U/R\)) et la <strong>vitesse à vide</strong> \(\Omega_0 = U/K\) (à \(C_{em} = 0\), frottements négligés).</p>
  <div class="method-box">
    <strong>Exemple — caractéristique du moteur de référence sous 24 V</strong>
    <ol>
      <li>Vitesse à vide : \(\Omega_0 = 24/0{,}060 = 400\ \text{rad/s}\) (3 820 tr/min).</li>
      <li>Démarrage : \(I_{dém} = 24/1{,}2 = 20\ \text{A}\), \(C_{dém} = 0{,}060 \times 20 = 1{,}2\ \text{N·m}\) : près de sept fois le courant et le couple du point de fonctionnement du §3.</li>
      <li>Pente : \(R/K^2 = 1{,}2/0{,}0036 = 333\ \text{rad·s}^{-1}\) par N·m. Pour \(C_{em} = 0{,}18\ \text{N·m}\), la vitesse baisse de \(333 \times 0{,}18 = 60\ \text{rad/s}\) : \(\Omega = 340\ \text{rad/s}\), comme au §3. La vitesse varie peu avec la charge : la MCC est « raide ».</li>
    </ol>
  </div>

  <h3>Fonctionnement dans les 4 quadrants</h3>
  <div class="def-box">
    La MCC peut fonctionner dans les 4 quadrants du plan \((C_{em}, \Omega)\), couple en abscisse :
    <ul style="margin-top:0.4rem">
      <li><strong>Quadrant 1</strong> (\(C_{em} > 0\), \(\Omega > 0\)) : moteur en marche avant — \(I > 0\), \(U > 0\).</li>
      <li><strong>Quadrant 2</strong> (\(C_{em} \lt 0\), \(\Omega > 0\)) : frein en marche avant, la machine fonctionne en génératrice — \(I \lt 0\), \(U > 0\) en général.</li>
      <li><strong>Quadrant 3</strong> (\(C_{em} \lt 0\), \(\Omega \lt 0\)) : moteur en marche arrière — \(I \lt 0\), \(U \lt 0\).</li>
      <li><strong>Quadrant 4</strong> (\(C_{em} > 0\), \(\Omega \lt 0\)) : frein en marche arrière, la machine fonctionne en génératrice — \(I > 0\), \(U \lt 0\) en général.</li>
    </ul>
  </div>

  <p>En mode moteur (Q1 et Q3) : \(C_{em}\) et \(\Omega\) de <strong>même signe</strong> — le couple crée le mouvement, la puissance électromagnétique \(EI = C_{em}\Omega\) est positive.</p>
  <p>En mode génératrice (Q2 et Q4) : \(C_{em}\) et \(\Omega\) de <strong>signes opposés</strong> — le couple s'oppose au mouvement (effet de frein), la machine reçoit de la puissance mécanique et la convertit en puissance électrique.</p>
  <div class="prop-box">
    Le signe de \(I\) est celui de \(C_{em}\) (\(C_{em} = KI\)) ; celui de \(U\) est celui de \(\Omega\), au terme \(RI\) près (\(U = K\Omega + RI\)).<br>
    Pour passer de Q1 à Q2 ou de Q3 à Q4 (le couple s'inverse, le sens de rotation est gardé) : alimentation réversible <strong>en courant</strong>.<br>
    Pour passer de Q1 à Q4 ou de Q2 à Q3 (le sens de rotation s'inverse, le signe du couple est gardé) : alimentation réversible <strong>en tension</strong>.<br>
    Les quatre quadrants exigent une alimentation réversible en tension et en courant (hacheur en pont en H, §8).
  </div>
  <div class="method-box">
    <strong>Exemple — charge retenue à la descente (point B de la figure)</strong>
    <p>Le moteur de référence entraîne un petit treuil. À la descente, la charge exerce sur l'arbre un couple moteur que la machine doit retenir : \(C_{em} = +0{,}18\ \text{N·m}\) alors que \(\Omega = -200\ \text{rad/s}\).</p>
    <ol>
      <li>\(I = C_{em}/K = 3{,}0\ \text{A}\) et \(E = K\Omega = -12\ \text{V}\), d'où \(U = E + RI = -12 + 3{,}6 = -8{,}4\ \text{V}\) : quadrant 4, frein en marche arrière.</li>
      <li>Puissance électromagnétique : \(EI = -36\ \text{W}\) : la machine reçoit 36 W de la charge qui descend (\(C_{em}\,|\Omega| = 0{,}18 \times 200\)).</li>
      <li>Puissance électrique : \(UI = -25{,}2\ \text{W}\) : 25,2 W sont renvoyés vers l'alimentation, 10,8 W perdus par effet Joule (\(RI^2\)). L'alimentation doit être réversible en tension (le courant garde son signe).</li>
    </ol>
  </div>
  <div class="notice">
    <strong>Freinage par contre-courant.</strong> Inverser brutalement la tension d'un moteur qui tourne en marche avant place aussi la machine en Q2, mais avec \(U \lt 0\) : elle reçoit alors de l'énergie de la source <em>et</em> de la charge, et tout est dissipé dans \(R\) (courant très élevé, exercice 04). Le freinage avec récupération garde \(U > 0\) et inverse seulement le courant.<br>
    <strong>Plan choisi.</strong> La numérotation dépend du plan : dans le plan \((u, i)\) de la sortie d'un convertisseur (<a href="#cvs/cours">« Convertisseurs statiques »</a>, §3 ; <a href="#hacheurs/cours">« Les hacheurs »</a>), les axes sont échangés et le freinage en marche avant y porte le numéro 4. Toujours préciser le plan avant de nommer un quadrant.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BILAN DE PUISSANCE ET RENDEMENT</div>
  <h2>Les pertes et le rendement de la MCC</h2>
  <div class="intro">La MCC n'est pas un convertisseur parfait. Une partie de l'énergie est dissipée sous forme de pertes Joule, de pertes magnétiques et de pertes mécaniques. Le bilan de puissance permet de quantifier ces pertes et de calculer le rendement.</div>

  <h3>Bilan en mode moteur</h3>
  <p>La puissance suit la chaîne : électrique → électromagnétique → mécanique utile, avec des pertes à chaque étape.</p>
  <div class="formula">$$P_a = U I \ \xrightarrow{\ -P_j = RI^2\ }\ P_{em} = E I = C_{em}\Omega \ \xrightarrow{\ -P_c\ }\ P_u = C_u\,\Omega$$</div>
  <div class="prop-box">
    \(P_{em} = P_a - P_j = U\,I - R\,I^2\)<br>
    \(P_u = P_{em} - P_c\)<br>
    \(\boxed{P_u = P_a - P_j - P_c}\)
  </div>
  <div class="notice">Les pertes mécaniques (frottements des balais et des roulements, ventilation) et les pertes magnétiques \(P_{fer}\) (voir ci-dessous) se retranchent au même étage. On les regroupe en <strong>pertes collectives</strong> \(P_c\), à peu près indépendantes de la charge à vitesse donnée : un essai à vide les mesure (\(P_c = U I_0 - R I_0^2\)). Elles correspondent à un couple de pertes \(C_p = P_c/\Omega = C_{em} - C_u\) : le couple utile est un peu plus faible que le couple électromagnétique.</div>

  <h3>Bilan en mode génératrice</h3>
  <p>La puissance suit la chaîne inverse : mécanique → électromagnétique → électrique utile.</p>
  <div class="formula">$$P_a = C_u\,\Omega \ \xrightarrow{\ -P_c\ }\ P_{em} = E I \ \xrightarrow{\ -P_j = RI^2\ }\ P_u = U I$$</div>
  <div class="prop-box">
    \(P_{em} = P_a - P_c\)<br>
    \(P_u = P_{em} - P_j\)<br>
    \(\boxed{P_u = P_a - P_j - P_c}\)
  </div>
  <p>Ici \(C_u\) est le couple fourni sur l'arbre par ce qui entraîne la génératrice, et \(I\) le courant débité (convention générateur).</p>

  <h3>Rendement</h3>
  <div class="formula" data-nom="Rendement d'une MCC">$$\eta = \frac{P_u}{P_a}$$</div>

  <h3>Les trois types de pertes</h3>
  <div class="def-box">
    <strong>Pertes Joule</strong> \(P_j = R\,I^2\) : dues à la résistance du bobinage d'induit (un inducteur bobiné ajoute ses propres pertes Joule \(r\,i_e^2\), fournies par sa source d'excitation). Augmentent avec \(I^2\), donc avec le carré du couple. Remède : ventilation, limitation du courant.
  </div>
  <div class="def-box">
    <strong>Pertes magnétiques</strong> \(P_{fer}\) : dues à l'hystérésis et aux courants de Foucault dans le fer de l'induit. Dépendent de \(B\) et de \(\Omega\). Remèdes : fer au silicium, feuilletage de l'induit.
  </div>
  <div class="def-box">
    <strong>Pertes mécaniques</strong> \(P_{méc}\) : dues aux frottements (balais-collecteur, roulements) et à la ventilation. Augmentent avec \(\Omega\). Remèdes : roulements de qualité, lubrification.
  </div>

    <strong>Exemple — bilan du moteur de référence au point A</strong>
    <p>Un essai à vide sous 24 V donne \(I_0 = 0{,}15\ \text{A}\). En charge, le moteur absorbe \(I = 3{,}0\ \text{A}\) sous 24 V.</p>
    <ol>
      <li>Pertes collectives (essai à vide) : \(P_c = 24 \times 0{,}15 - 1{,}2 \times 0{,}15^2 = 3{,}6\ \text{W}\) (les pertes Joule à vide, 0,03 W, sont négligeables).</li>
      <li>En charge : \(P_a = 72\ \text{W}\), \(P_j = 1{,}2 \times 3^2 = 10{,}8\ \text{W}\), \(P_{em} = 61{,}2\ \text{W}\), \(P_u = 61{,}2 - 3{,}6 = 57{,}6\ \text{W}\).</li>
      <li>Rendement : \(\eta = 57{,}6/72 = 0{,}80\). Vitesse \(\Omega = (24 - 3{,}6)/0{,}060 = 340\ \text{rad/s}\), couple utile \(C_u = 57{,}6/340 = 0{,}169\ \text{N·m}\), à comparer à \(C_{em} = 0{,}18\ \text{N·m}\).</li>
      <li>Le rendement est maximal quand \(RI^2 = P_c\), c'est-à-dire pour \(I = \sqrt{3{,}6/1{,}2} \approx 1{,}7\ \text{A}\) : il vaut alors 0,83 (figure). Au démarrage, ou à vide, il est nul : toute l'énergie absorbée est perdue.</li>
    </ol>
  </div>
  <div class="notice"><strong>Ordres de grandeur</strong> : rendement de 50 à 70 % pour un petit moteur de quelques watts, 75 à 90 % pour un moteur de quelques centaines de watts à quelques kilowatts, plus de 90 % pour les grosses machines. Les pertes finissent en chaleur : c'est l'échauffement qui limite le courant permanent (§10).</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉPONSE À UN ÉCHELON : MODÈLE D'ORDRE 1 OU 2</div>
  <h2>Deux constantes de temps, électrique et électromécanique</h2>
  <div class="intro">Brancher le moteur sur une tension fixe, c'est lui appliquer un échelon. Selon les constantes de temps de l'induit et de la charge, sa vitesse se comporte comme un premier ou un deuxième ordre : c'est l'exemple type des chapitres <a href="#sys1/cours">« Systèmes du 1er ordre »</a> et <a href="#sys2/cours">« Systèmes du 2e ordre »</a>, dont on reprend le vocabulaire.</div>

  <h3>Fonction de transfert complète</h3>
  <p>En réduisant le schéma-blocs du §4 (boucle de retour \(K\)), pour \(C_r = 0\) :</p>
  <div class="formula" data-nom="FT de la MCC">$$H(p) = \frac{\Omega(p)}{U(p)} = \frac{K}{(R + Lp)(f + Jp) + K^2} = \frac{K}{LJ\,p^2 + (RJ + Lf)\,p + Rf + K^2}$$</div>
  <p>C'est un <strong>deuxième ordre</strong>, de gain statique \(K_s = \dfrac{K}{Rf + K^2}\) (noté \(K\) dans « Systèmes du 1er ordre », où la constante du moteur est notée \(k\)). On fait apparaître deux durées caractéristiques :</p>
  <div class="def-box">
    <strong>Constante de temps électrique</strong> \(\tau_e = \dfrac{L}{R}\) : temps d'établissement du courant, rotor bloqué.<br>
    <strong>Constante de temps électromécanique</strong> \(\tau_m = \dfrac{RJ}{K^2}\) (frottements négligés) : temps de mise en vitesse du rotor et de sa charge.
  </div>
  <p>Frottements négligés (\(f = 0\)), le dénominateur s'écrit \(K^2\,(1 + \tau_m p + \tau_e\tau_m p^2)\), d'où :</p>
  <div class="formula" data-nom="MCC : forme canonique (f = 0)">$$H(p) = \frac{1/K}{1 + \tau_m\,p + \tau_e\tau_m\,p^2} \qquad \omega_0 = \frac{1}{\sqrt{\tau_e\tau_m}} \qquad \xi = \frac{1}{2}\sqrt{\frac{\tau_m}{\tau_e}}$$</div>
  <div class="prop-box">
    <strong>Ordre 1 ou ordre 2 ?</strong> Si \(\tau_m \geq 4\tau_e\), alors \(\xi \geq 1\) : les deux pôles sont réels, la vitesse monte sans dépassement. Si de plus \(\tau_e \ll \tau_m\) (en pratique \(\tau_m \gt 10\,\tau_e\)), le pôle électrique, beaucoup plus rapide, peut être négligé :
    <div class="formula" data-nom="MCC : modèle du premier ordre">$$H(p) \approx \frac{K_s}{1 + \tau_m\,p} \qquad K_s = \frac{1}{K} \qquad t_{r5\%} \approx 3\,\tau_m$$</div>
    Avec un frottement visqueux, le premier ordre devient \(K_s = \dfrac{K}{Rf + K^2}\) et \(\tau = \dfrac{RJ}{Rf + K^2}\) (« Systèmes du 1er ordre », §1). Si \(\tau_m \lt 4\tau_e\) (charge très légère, inductance élevée), la vitesse oscille : modèle du deuxième ordre obligatoire.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Réduction du schéma-blocs et forme canonique</span>
    <div class="content">
      <p>Chaîne directe : \(\dfrac{K}{(R + Lp)(f + Jp)}\) ; chaîne de retour : \(K\). Formule de la boucle fermée : \(H = \dfrac{G}{1 + GK} = \dfrac{K}{(R + Lp)(f + Jp) + K^2}\). Avec \(f = 0\) :</p>
      <div class="formula">$$(R + Lp)Jp + K^2 = K^2\left(1 + \frac{RJ}{K^2}\,p + \frac{LJ}{K^2}\,p^2\right)$$</div>
      <p>et \(\dfrac{LJ}{K^2} = \dfrac{L}{R}\cdot\dfrac{RJ}{K^2} = \tau_e\tau_m\). Par identification avec \(1 + \dfrac{2\xi}{\omega_0}p + \dfrac{p^2}{\omega_0^2}\) : \(\omega_0^2 = \dfrac{1}{\tau_e\tau_m}\) et \(\dfrac{2\xi}{\omega_0} = \tau_m\), d'où \(\xi = \dfrac{\tau_m\,\omega_0}{2} = \dfrac{1}{2}\sqrt{\dfrac{\tau_m}{\tau_e}}\).</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · POINT DE FONCTIONNEMENT AVEC UNE CHARGE</div>
  <h2>Où se fixent la vitesse et le courant</h2>
  <div class="intro">En régime permanent, la vitesse se fixe là où le couple du moteur équilibre exactement celui de la charge : c'est le <strong>point de fonctionnement</strong>. Le trouver demande de connaître la caractéristique de la charge, ramenée sur l'arbre moteur.</div>

  <h3>Caractéristiques des charges usuelles</h3>
  <ul>
    <li><strong>Couple constant</strong> : levage, convoyeur, frottement sec : \(C_r = C_0\), quelle que soit la vitesse.</li>
    <li><strong>Frottement visqueux</strong> : \(C_r = f\,\Omega\).</li>
    <li><strong>Couple quadratique</strong> : ventilateur, pompe centrifuge, hélice, véhicule à grande vitesse (traînée aérodynamique) : \(C_r = a\,\Omega^2\).</li>
  </ul>
  <div class="prop-box">
    <strong>Point de fonctionnement.</strong> Il vérifie \(C_{em}(\Omega) = C_r(\Omega)\), avec \(C_{em}(\Omega) = \dfrac{K}{R}\,(U - K\Omega)\) (frottements internes inclus dans \(C_r\)). Graphiquement : intersection de la caractéristique du moteur et de celle de la charge. Le courant s'en déduit : \(I = C_{em}/K\).<br>
    Il est <strong>stable</strong> si un léger excès de vitesse fait apparaître un couple qui ralentit : \(\dfrac{\mathrm{d}(C_{em} - C_r)}{\mathrm{d}\Omega} \lt 0\). C'est toujours le cas avec la MCC (pente \(-K^2/R\)) et une charge dont le couple ne décroît pas avec la vitesse.
  </div>

  <div class="method-box">
    <strong>Exemple — régler la vitesse d'un ventilateur</strong>
    <p>Le moteur de référence entraîne un ventilateur : \(C_r = a\Omega^2\), \(a = 1{,}5\times10^{-6}\ \text{N·m·s}^2\) (frottements du moteur compris).</p>
    <ol>
      <li>Sous 24 V : \(a\Omega^2 = \dfrac{K}{R}(U - K\Omega)\), soit \(1{,}5\times10^{-6}\,\Omega^2 + 0{,}003\,\Omega - 1{,}2 = 0\). La racine positive vaut \(\Omega = 342\ \text{rad/s}\) ; \(C_r = 0{,}175\ \text{N·m}\), \(I = 2{,}92\ \text{A}\).</li>
      <li>Sous 12 V : la même méthode donne \(\Omega = 183\ \text{rad/s}\), \(I = 0{,}84\ \text{A}\). Diviser la tension par 2 divise ici la vitesse par 1,9 et le couple par 3,5.</li>
      <li>Tension pour \(\Omega = 250\ \text{rad/s}\) : \(C_r = 1{,}5\times10^{-6} \times 250^2 = 0{,}094\ \text{N·m}\), \(I = 1{,}56\ \text{A}\), \(U = K\Omega + RI = 15 + 1{,}9 = 16{,}9\ \text{V}\). Un hacheur alimenté sous 24 V la fournit avec un rapport cyclique \(\alpha = 16{,}9/24 \approx 0{,}70\) (§8).</li>
    </ol>
  </div>
  <h3>Charge ramenée sur l'arbre moteur</h3>
  <p>Entre le moteur et la charge, un transmetteur de rapport \(k = \Omega_{\text{charge}}/\Omega_m\) et de rendement \(\eta\) transforme le couple : en marche motrice, la charge de couple \(C_{\text{charge}}\) impose au moteur \(C_r = k\,C_{\text{charge}}/\eta\), et son inertie compte pour \(J_{\text{charge}}\,k^2\) dans \(J\). Ce calcul, au programme de 2ᵉ année (S3), est détaillé dans <a href="#energsi/cours">« Énergétique des systèmes »</a> (§6, §7).</p>
  <div class="method-box">
    <strong>Exemple — treuil à réducteur</strong>
    <p>Une masse \(m = 20\ \text{kg}\) est levée par un tambour de rayon 1 cm, entraîné par le moteur à travers un réducteur de rapport \(k = 1/50\) et de rendement 0,80 (\(g = 9{,}81\ \text{m/s}^2\)).</p>
    <ol>
      <li>Couple sur le tambour : \(mg \times 0{,}01 = 1{,}96\ \text{N·m}\).</li>
      <li>Couple ramené sur l'arbre moteur, à la montée : \(C_r = 1{,}96/(50 \times 0{,}80) = 0{,}049\ \text{N·m}\), soit \(I = 0{,}82\ \text{A}\) pour le moteur de référence.</li>
      <li>Inertie équivalente de la masse, ramenée sur l'arbre moteur : \(m\,(0{,}01/50)^2 = 8\times10^{-7}\ \text{kg·m}^2\), négligeable devant l'inertie du rotor : le réducteur « cache » l'inertie de la charge.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ALIMENTATION PAR UN HACHEUR</div>
  <h2>Moduler la tension pour régler la vitesse et freiner</h2>
  <div class="intro">Une batterie ou un bus continu fournit une tension fixe \(U_0\). Pour régler la vitesse, il faut moduler la tension appliquée à l'induit : c'est le rôle du <strong>hacheur</strong>, qui découpe \(U_0\) à haute fréquence (<a href="#cvs/cours">« Convertisseurs statiques »</a>, §8 ; <a href="#hacheurs/cours">« Les hacheurs »</a>). La source est notée \(U_0\) ici, car \(E\) désigne la f.é.m. ; les chapitres sur les convertisseurs la notent \(E\) et la f.é.m. du moteur \(E_m\).</div>
  <div class="prop-box">
    <strong>Valeur moyenne.</strong> Un hacheur série de rapport cyclique \(\alpha\) applique \(u = U_0\) pendant \(\alpha T\), puis \(u = 0\) : \(\langle u\rangle = \alpha\,U_0\). La période de découpage (de l'ordre de \(50\ \mu\text{s}\)) est très courte devant \(\tau_e\) et \(\tau_m\) : le courant ondule peu, la vitesse pas du tout, et en moyenne
    <div class="formula" data-nom="MCC sur hacheur">$$\alpha\,U_0 = K\,\Omega + R\,\langle i\rangle \qquad\Longrightarrow\qquad \Omega = \frac{\alpha\,U_0 - R\,\langle i\rangle}{K}$$</div>
    Le rapport cyclique règle la vitesse ; la charge fixe le courant moyen \(\langle i\rangle = C_{em}/K\).
  </div>
  <h3>Quel hacheur pour quels quadrants ?</h3>
  <div style="overflow-x:auto"><table>
    <tr><th>Besoin</th><th>Quadrants \((C_{em}, \Omega)\)</th><th>Signes à la sortie</th><th>Hacheur</th></tr>
    <tr><td>Tourner dans un sens, sans freinage électrique</td><td>Q1</td><td>\(u \geq 0\), \(i \geq 0\)</td><td>série (« Les hacheurs », §2)</td></tr>
    <tr><td>Freiner en récupérant l'énergie, un seul sens de rotation</td><td>Q1 et Q2</td><td>\(u \geq 0\), \(i\) des deux signes</td><td>réversible en courant (§3)</td></tr>
    <tr><td>Retenir une charge entraînante (levage)</td><td>Q1 et Q4</td><td>\(i \geq 0\), \(u\) des deux signes</td><td>réversible en tension</td></tr>
    <tr><td>Les deux sens, en moteur et en frein (robot, véhicule)</td><td>les quatre</td><td>\(u\) et \(i\) des deux signes</td><td>pont en H (§4)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — rapport cyclique pour une vitesse imposée</strong>
    <p>Le moteur de référence, alimenté par un hacheur série sous \(U_0 = 24\ \text{V}\) à \(f_d = 20\ \text{kHz}\), entraîne la charge du §3 (\(C_r = 0{,}18\ \text{N·m}\)). On veut \(\Omega = 200\ \text{rad/s}\).</p>
    <ol>
      <li>Courant moyen fixé par la charge : \(\langle i\rangle = 0{,}18/0{,}060 = 3{,}0\ \text{A}\).</li>
      <li>Tension moyenne nécessaire : \(\langle u\rangle = K\Omega + R\langle i\rangle = 12 + 3{,}6 = 15{,}6\ \text{V}\), d'où \(\alpha = 15{,}6/24 = 0{,}65\).</li>
      <li>Ondulation crête à crête du courant (formule établie dans « Les hacheurs », §5) :
        <div class="formula">$$\Delta i \approx \frac{\alpha(1-\alpha)\,U_0}{L f_d} = \frac{0{,}65 \times 0{,}35 \times 24}{1{,}5\times10^{-3} \times 2\times10^4} = 0{,}18\ \text{A}$$</div>
        soit 6 % du courant moyen : le couple ondule à peine.</li>
    </ol>
  </div>
  <h3>Démarrer sans surintensité</h3>
  <p>Un échelon de tension appelle un fort courant (§6). Avec un hacheur, on fait croître \(\alpha\) progressivement : si la tension moyenne monte de 0 à \(U_0\) en une durée \(T_r\) grande devant \(\tau_m\), la vitesse suit la rampe, avec l'accélération \(\dfrac{U_0}{K\,T_r}\), et le courant vaut à peu près</p>
  <div class="formula" data-nom="Démarrage en rampe">$$i \approx \frac{J\,U_0}{K^2\,T_r} + \frac{C_r}{K}$$</div>

<div class="course-section">
  <div class="sec-num">§9 · IDENTIFIER LES PARAMÈTRES PAR DES ESSAIS</div>
  <h2>Trois essais simples pour R, K, les pertes et l'inertie</h2>
  <div class="intro">Une documentation n'est pas toujours disponible, et la charge modifie l'inertie et les frottements. On identifie alors le modèle par des essais : on choisit l'entrée à imposer (tension, couple) et la sortie à mesurer (courant, vitesse) de façon à isoler un seul paramètre à la fois (<a href="#sys1/cours">« Systèmes du 1er ordre »</a>, §5).</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Essai</th><th>Entrée imposée</th><th>Mesures</th><th>Paramètre obtenu</th></tr>
    <tr><td>Rotor bloqué</td><td>faible tension continue \(U_b\)</td><td>courant \(I_b\) établi</td><td>\(R = U_b/I_b\) (car \(\Omega = 0\), donc \(E = 0\))</td></tr>
    <tr><td>Rotor bloqué, échelon</td><td>échelon de tension</td><td>courant \(i(t)\)</td><td>\(\tau_e = L/R\), à 63 % du courant final</td></tr>
    <tr><td>À vide</td><td>tension nominale \(U\)</td><td>courant \(I_0\), vitesse \(\Omega_0\)</td><td>\(K = \dfrac{U - RI_0}{\Omega_0}\) ; pertes collectives \(P_c = UI_0 - RI_0^2\)</td></tr>
    <tr><td>Réponse indicielle</td><td>échelon de tension</td><td>vitesse \(\Omega(t)\)</td><td>\(\tau_m\) (premier ordre), d'où \(J = \tau_m K^2/R\)</td></tr>
    <tr><td>Lâcher (ralentissement)</td><td>alimentation coupée à \(\Omega_0\)</td><td>décélération initiale</td><td>\(J = \dfrac{C_p}{|\mathrm{d}\Omega/\mathrm{d}t|}\) avec \(C_p = P_c/\Omega_0\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — identification d'un moteur inconnu</strong>
    <ol>
      <li>Rotor bloqué sous 2,0 V : le courant s'établit à 2,5 A, d'où \(R = 0{,}80\ \Omega\). Il atteint 63 % de cette valeur en 1,0 ms : \(\tau_e = 1{,}0\ \text{ms}\), \(L = R\tau_e = 0{,}80\ \text{mH}\).</li>
      <li>À vide sous 24 V : \(I_0 = 0{,}30\ \text{A}\) et 2 950 tr/min, soit \(\Omega_0 = 309\ \text{rad/s}\). \(E = 24 - 0{,}80 \times 0{,}30 = 23{,}76\ \text{V}\), d'où \(K = 23{,}76/309 = 0{,}0769\ \text{V·s/rad}\) ; \(P_c = 7{,}2 - 0{,}07 = 7{,}13\ \text{W}\).</li>
      <li>Réponse à un échelon de tension, moteur accouplé à sa charge : temps de réponse à 5 % de la vitesse 75 ms, sans dépassement. Premier ordre : \(\tau_m = 75/3 = 25\ \text{ms}\) et \(J = \tau_m K^2/R = 0{,}025 \times 0{,}0769^2/0{,}80 = 1{,}85\times10^{-4}\ \text{kg·m}^2\). Contrôle : \(\tau_m = 25\ \text{ms} \gg 4\tau_e\), le premier ordre est justifié.</li>
      <li>Vérification par un lâcher : couple de pertes \(C_p = 7{,}13/309 = 0{,}023\ \text{N·m}\) ; décélération attendue \(C_p/J = 125\ \text{rad/s}^2\), soit un arrêt en 2,5 s environ si \(C_p\) reste constant. Une mesure très différente signalerait une erreur sur \(J\) ou sur le modèle des pertes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : mesurer \(R\) à l'ohmmètre rotor libre, ou sous une tension trop forte qui fait tourner le rotor (la f.é.m. fausse la mesure). Autre piège : identifier \(\tau_m\) sur le moteur seul, puis l'utiliser une fois la charge accouplée ; \(\tau_m\) est proportionnelle à l'inertie totale.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · DOCUMENTATION, ORDRES DE GRANDEUR ET UTILISATIONS</div>
  <h2>Lire un catalogue et choisir un point de fonctionnement</h2>
  <div class="intro">Les fabricants donnent les paramètres du modèle sous des formes et des unités variées. Savoir les convertir et les recouper permet de vérifier qu'un moteur convient à un point de fonctionnement, et de repérer une donnée incohérente.</div>
  <h3>Données d'un catalogue et conversions</h3>
  <ul>
    <li><strong>Constante de couple</strong> en mN·m/A : diviser par 1 000 pour obtenir \(K\) en N·m/A.</li>
    <li><strong>Constante de vitesse</strong> en tr/min par volt : c'est \(1/K\) exprimée en tr/min ; \(K = \dfrac{30}{\pi\,k_n}\) avec \(k_n\) en tr/min/V.</li>
    <li><strong>Constante de f.é.m.</strong> en V pour 1 000 tr/min : diviser par \(1\,000\,\pi/30 \approx 104{,}7\).</li>
    <li><strong>Courant permanent maximal</strong> (limite thermique) et <strong>courant crête</strong> (limite des aimants et du collecteur) ; couple permanent \(\approx K\,I_{\text{perm}}\), moins le couple de frottement \(K I_0\).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — vérifier une fiche technique et un point de service</strong>
    <p>Fiche d'un moteur 24 V : constante de couple 49,7 mN·m/A ; constante de vitesse 192 tr/min/V ; constante de f.é.m. 5,20 V pour 1 000 tr/min ; résistance 1,6 Ω ; courant à vide 0,12 A ; courant permanent maximal 2,4 A.</p>
    <ol>
      <li>Cohérence : \(K = 0{,}0497\ \text{N·m/A}\) ; \(1/K = 20{,}1\ \text{rad·s}^{-1}\text{/V} = 192\ \text{tr/min/V}\) ; \(5{,}20/104{,}7 = 0{,}0497\ \text{V·s/rad}\). Les trois données décrivent la même constante.</li>
      <li>Vitesse à vide sous 24 V : \((24 - 1{,}6 \times 0{,}12)/0{,}0497 = 479\ \text{rad/s}\), soit 4 570 tr/min. Courant de démarrage : 15 A, plus de six fois le courant permanent.</li>
      <li>Point de service demandé : 0,10 N·m à 3 000 tr/min (314 rad/s). Courant \(I = 0{,}10/0{,}0497 + 0{,}12 = 2{,}13\ \text{A}\) (inférieur à 2,4 A : acceptable en permanence) ; tension \(U = 0{,}0497 \times 314 + 1{,}6 \times 2{,}13 = 19{,}0\ \text{V}\), donc \(\alpha \approx 0{,}79\) sous 24 V. Puissance utile : 31 W.</li>
    </ol>
  </div>
  <h3>Ordres de grandeur</h3>
  <div style="overflow-x:auto"><table>
    <tr><th>Application</th><th>Tension</th><th>Puissance</th><th>\(K\) (V·s/rad)</th><th>\(R\)</th></tr>
    <tr><td>Micromoteur de jouet</td><td>1,5 à 6 V</td><td>0,1 à 2 W</td><td>0,001 à 0,005</td><td>1 à 10 Ω</td></tr>
    <tr><td>Robot, imprimante, petit axe</td><td>12 à 48 V</td><td>10 à 200 W</td><td>0,02 à 0,2</td><td>0,2 à 5 Ω</td></tr>
    <tr><td>Lève-vitre, essuie-glace</td><td>12 V</td><td>20 à 100 W</td><td>0,01 à 0,05</td><td>0,1 à 1 Ω</td></tr>
    <tr><td>Démarreur d'automobile</td><td>12 V</td><td>1 à 3 kW</td><td>0,01 à 0,02</td><td>≈ 10 mΩ</td></tr>
    <tr><td>Traction industrielle (chariots), laminoirs anciens</td><td>48 à 750 V</td><td>1 kW à 1 MW</td><td>0,1 à plus de 10</td><td>de 1 Ω à quelques mΩ</td></tr>
  </table></div>
  <p>Exemples d'utilisation (programme de physique) : jouets et modélisme, petits appareils sur batterie (visseuses, brosses à dents), équipements automobiles (essuie-glaces, lève-vitres, sièges, démarreur), robotique et servomoteurs. Dans les applications neuves de puissance, la MCC laisse place aux machines synchrones autopilotées (« sans balais ») et asynchrones, qui ne demandent pas d'entretien de collecteur (2ᵉ année : <a href="#machalt/cours">« Machines synchrone et asynchrone »</a>, §9).</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Un peu de physique des machines</h2>
  <div class="intro">Le programme de sciences industrielles précise que la physique des convertisseurs électromécaniques n'est pas au programme : le modèle \(E = K\Omega\), \(C_{em} = KI\) suffit. Voici d'où viennent les valeurs de \(K\) et quelques compléments de culture technique.</div>
  <h3>Expression de \(K\) en fonction du bobinage</h3>
  <p>Pour une machine à \(p\) paires de pôles, dont l'induit porte \(N\) conducteurs actifs répartis en \(2a\) voies d'enroulement en parallèle, sous un flux \(\Phi\) par pôle, la f.é.m. vaut (formule dite d'Arnold) :</p>
  <div class="formula">$$E = \frac{p\,N}{2\pi\,a}\,\Phi\,\Omega \qquad\text{soit}\qquad K = \frac{p\,N}{2\pi\,a}\,\Phi$$</div>
  <p>\(K\) est proportionnelle au flux de l'inducteur. L'exemple du §2 en est une version simplifiée (un conducteur dans un champ uniforme \(B\), une seule voie).</p>
  <h3>Excitation et réglage par le flux</h3>
  <p>Un inducteur bobiné permet de faire varier le flux : en excitation séparée, réduire le courant d'excitation diminue \(K\), ce qui augmente la vitesse à tension donnée mais diminue le couple par ampère (fonctionnement à puissance constante, ou <em>défluxage</em>, exercice 05). D'autres couplages existent : excitation série (inducteur en série avec l'induit, couple de démarrage très élevé, ancienne traction ferroviaire et démarreurs), excitation shunt (en parallèle). Les machines à aimants permanents, qui dominent aujourd'hui, ont un flux fixe.</p>
  <h3>Réaction d'induit et commutation</h3>
  <p>Le courant de l'induit crée lui-même un champ, qui déforme celui de l'inducteur (réaction d'induit) et réduit légèrement le flux à fort courant. Au moment où le collecteur inverse le courant d'une spire, l'inductance de celle-ci s'y oppose : la commutation produit des étincelles aux balais, que l'on limite par des pôles auxiliaires dans les grosses machines. Ces phénomènes, comme la saturation magnétique, sont négligés dans le modèle linéaire du cours.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · MCC</div>
  <h2>Stratégies pour les exercices sur la MCC</h2>
  <div class="intro">Les exercices de MCC suivent des schémas récurrents : point de fonctionnement en régime permanent (§3, §4, §7), bilan de puissance (§5), quadrant de fonctionnement (§4), modèle dynamique et schéma-blocs (§4, §6), association avec un hacheur (§8), identification et documentation (§9, §10). Notations du cours : \(E = K\Omega\), \(C_{em} = KI\), \(U = E + RI\) en moteur (convention récepteur), \(K\) en unités SI (notée \(k\) dans le simulateur).</div>

  <div class="method-box">
    <strong>Méthode 1 — Résoudre un problème de régime permanent</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Identifier le mode (moteur ou génératrice) et la convention de signe (récepteur ou générateur).</li>
      <li><span class="step">Étape 2.</span> Écrire la loi des mailles : moteur → \(U = E + R\,I\) ; génératrice en convention générateur → \(U = E - R\,I\).</li>
      <li><span class="step">Étape 3.</span> Utiliser \(E = K\,\Omega\) pour relier \(E\) et \(\Omega\) (\(\Omega\) en rad/s : \(\Omega = \pi N/30\) si \(N\) est en tr/min).</li>
      <li><span class="step">Étape 4.</span> Utiliser \(C_{em} = K\,I\) pour relier \(C_{em}\) et \(I\).</li>
      <li><span class="step">Étape 5.</span> Appliquer l'équation mécanique en régime permanent : \(C_{em} = C_r + f\,\Omega\).</li>
      <li><span class="step">Étape 6.</span> Faire le bilan de puissance pour vérifier la cohérence (\(U I = R I^2 + E I\) et \(E I = C_{em}\Omega\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 0{,}20\ \text{V·s/rad}\), \(R = 1{,}5\ \Omega\), \(U = 36\ \text{V}\), \(C_r = 1{,}2\ \text{N·m}\), frottements négligés. \(I = C_r/K = 6\ \text{A}\), \(E = 36 - 1{,}5\times6 = 27\ \text{V}\), \(\Omega = 27/0{,}20 = 135\ \text{rad/s}\) (≈ 1 290 tr/min). Contrôle : \(UI = 216\ \text{W} = 54 + 162\) et \(EI = 162\ \text{W} = C_{em}\Omega\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Calculer la vitesse à vide et le couple de démarrage</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Vitesse à vide idéale</span> (\(C_r = 0\) et frottements négligés, donc \(I = 0\)) : \(\Omega_0 = U/K\).</li>
      <li><span class="step">Vitesse à vide réelle</span> (frottement visqueux \(f\)) : \(KI_0 = f\Omega_0\) et \(U = RI_0 + K\Omega_0\) donnent \(\Omega_0 = \dfrac{KU}{K^2 + Rf}\), un peu inférieure à \(U/K\), avec \(I_0 = f\Omega_0/K \neq 0\).</li>
      <li><span class="step">Couple de démarrage</span> (\(\Omega = 0\), donc \(E = 0\)) : \(I_{dém} = U/R\) donc \(C_{dém} = K\,U/R\). C'est le couple maximal sur la caractéristique — attention à ne pas dépasser le courant admissible !</li>
      <li><span class="step">Caractéristique</span> \(C_{em}(\Omega)\) : droite passant par \((0, C_{dém})\) et \((U/K, 0)\) : \(C_{em} = \dfrac{KU}{R} - \dfrac{K^2}{R}\,\Omega\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 0{,}08\ \text{V·s/rad}\), \(R = 1{,}2\ \Omega\), \(U = 12\ \text{V}\) : \(U/K = 150\ \text{rad/s}\), \(I_{dém} = 10\ \text{A}\), \(C_{dém} = 0{,}8\ \text{N·m}\). Avec \(f = 10^{-4}\ \text{N·m·s/rad}\) : \(\Omega_0 = 0{,}96/0{,}00652 \approx 147\ \text{rad/s}\) et \(I_0 \approx 0{,}18\ \text{A}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Trouver le point de fonctionnement avec une charge</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Moteur.</span> Écrire la caractéristique \(C_{em}(\Omega) = \dfrac{K}{R}(U - K\Omega)\) (méthode 2).</li>
      <li><span class="step">Charge.</span> Écrire le couple résistant ramené à l'arbre moteur, frottements compris : constant (levage), proportionnel à \(\Omega\) (frottement visqueux), en \(\Omega^2\) (ventilateur, pompe).</li>
      <li><span class="step">Équilibre.</span> Résoudre \(C_{em}(\Omega) = C_r(\Omega)\) et garder la racine physique (\(\Omega > 0\) en marche avant) ; en déduire \(I = C_{em}/K\).</li>
      <li><span class="step">Stabilité.</span> Le point est stable si \(\dfrac{\mathrm{d}(C_{em} - C_r)}{\mathrm{d}\Omega} \lt 0\) : toujours le cas avec la pente \(-K^2/R\) de la MCC et une charge dont le couple ne décroît pas avec la vitesse.</li>
    </ol>
    <p><em>Exemple éclair :</em> moteur de la méthode 2 (\(C_{em} = 0{,}8 - 0{,}00533\,\Omega\)) et ventilateur \(C_r = 2\times10^{-5}\,\Omega^2\). L'équation \(2\times10^{-5}\,\Omega^2 + 0{,}00533\,\Omega - 0{,}8 = 0\) donne \(\Omega \approx 107\ \text{rad/s}\), \(C \approx 0{,}23\ \text{N·m}\), \(I \approx 2{,}9\ \text{A}\) ; point stable.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Faire le bilan de puissance et calculer le rendement</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Moteur :</span> \(P_a = UI\) → \(P_{em} = EI\) → \(P_u = C_u\Omega\). Pertes : \(P_j = RI^2\) entre \(P_a\) et \(P_{em}\) ; pertes collectives \(P_c\) (mécaniques et fer) entre \(P_{em}\) et \(P_u\).</li>
      <li><span class="step">Génératrice :</span> \(P_a = C_u\Omega\) → \(P_{em} = EI\) → \(P_u = UI\). Mêmes types de pertes, dans l'ordre inverse.</li>
      <li><span class="step">Essai à vide :</span> à la vitesse de service, sans charge, la machine absorbe \(U I_0\) ; les pertes collectives valent \(P_c = U I_0 - R I_0^2\) et sont supposées inchangées en charge.</li>
      <li><span class="step">Vérifier :</span> \(P_a = P_u + P_j + P_c\). Rendement : \(\eta = P_u/P_a\) (toujours inférieur à 1) ; il est maximal quand \(RI^2 = P_c\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(R = 2\ \Omega\), \(U = 24\ \text{V}\) ; à vide \(I_0 = 0{,}5\ \text{A}\), d'où \(P_c = 12 - 0{,}5 = 11{,}5\ \text{W}\). En charge, \(I = 3\ \text{A}\) : \(P_a = 72\ \text{W}\), \(P_j = 18\ \text{W}\), \(P_u = 72 - 18 - 11{,}5 = 42{,}5\ \text{W}\), \(\eta \approx 0{,}59\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Identifier le quadrant et choisir la réversibilité de l'alimentation</strong>
    <ol style="margin-top:0.4rem">
      <li>Calculer ou identifier le signe de \(\Omega\) (sens de rotation), puis celui de \(C_{em} = K\,I\) (signe de \(I\)).</li>
      <li>Placer le point dans le plan \((C_{em}, \Omega)\) du cours (couple en abscisse) : Q1 (\(\Omega > 0\), \(C > 0\)) moteur en marche avant ; Q2 (\(\Omega > 0\), \(C \lt 0\)) frein en marche avant ; Q3 (\(\Omega \lt 0\), \(C \lt 0\)) moteur en marche arrière ; Q4 (\(\Omega \lt 0\), \(C > 0\)) frein en marche arrière.</li>
      <li>En déduire les signes de \(I\) (celui de \(C_{em}\)) et de \(U\) (celui de \(\Omega\), au terme \(RI\) près : \(U = K\Omega + RI\)).</li>
      <li>En frein (Q2, Q4), la puissance électrique \(UI\) est négative : la machine, génératrice, renvoie de l'énergie vers sa source — à condition que l'alimentation l'accepte (ascenseurs, trains, véhicules électriques). Sinon, il faut une résistance de freinage.</li>
      <li>Réversibilité nécessaire : en courant pour passer de Q1 à Q2 (freiner sans changer de sens) ; en tension pour passer de Q1 à Q4 (changer de sens à couple de même signe) ; les deux pour les quatre quadrants (pont en H).</li>
    </ol>

  <div class="notice"><strong>Piège</strong> : la numérotation des quadrants dépend du plan. Dans le plan \((u, i)\) de la sortie d'un hacheur, le freinage en marche avant porte le numéro 4. Toujours dire dans quel plan on raisonne, et nommer le régime en clair (« frein en marche avant »).</div>

  <div class="method-box">
    <strong>Méthode 6 — Établir le schéma-blocs et la fonction de transfert</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Laplace.</span> Transformer les équations, conditions initiales nulles : \(U = E + (R + Lp)I\), \(E = K\Omega\), \(C_{em} = KI\), \(C_{em} - C_r = (f + Jp)\Omega\).</li>
      <li><span class="step">Schéma-blocs.</span> Comparateur \(U - E\), bloc \(1/(R + Lp)\), gain \(K\), comparateur \(C_{em} - C_r\), bloc \(1/(f + Jp)\), retour de f.é.m. par le gain \(K\).</li>
      <li><span class="step">Fonction de transfert</span> (\(C_r = 0\)) : \(\dfrac{\Omega(p)}{U(p)} = \dfrac{K}{(R + Lp)(f + Jp) + K^2}\), du deuxième ordre.</li>
      <li><span class="step">Ordre 1 ou 2.</span> Calculer \(\tau_e = L/R\) et \(\tau_m = RJ/K^2\). Si \(\tau_m \gg \tau_e\) (en pratique plus de 10 fois), \(L\) et \(f\) négligés : \(\dfrac{\Omega(p)}{U(p)} = \dfrac{1/K}{1 + \tau_m p}\), temps de réponse à 5 % ≈ \(3\tau_m\). Sinon, garder le deuxième ordre : \(\omega_0 = 1/\sqrt{\tau_e\tau_m}\), \(\xi = \frac12\sqrt{\tau_m/\tau_e}\) (sans frottement) ; dépassement si \(\tau_m \lt 4\tau_e\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 0{,}05\ \text{V·s/rad}\), \(R = 1\ \Omega\), \(J = 5\times10^{-5}\ \text{kg·m}^2\) : \(\tau_m = 5\times10^{-5}/0{,}0025 = 20\ \text{ms}\), gain \(1/K = 20\ \text{rad·s}^{-1}\text{/V}\). Avec \(L = 0{,}5\ \text{mH}\), \(\tau_e = 0{,}5\ \text{ms}\) : 40 fois plus court, premier ordre justifié. Sous un échelon de 12 V : 240 rad/s atteints à 5 % près en 60 ms environ.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Exploiter une documentation constructeur</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Unités.</span> Ramener toutes les données en SI : vitesses en rad/s (\(\times\pi/30\) depuis les tr/min), constante de f.é.m. donnée en V pour 1 000 tr/min à diviser par \(1000\pi/30 \approx 104{,}7\), constante de couple en mN·m/A à diviser par 1 000, constante de vitesse en tr/min/V à inverser (\(K = 30/(\pi k_n)\)).</li>
      <li><span class="step">Cohérence.</span> En SI, constante de f.é.m. et constante de couple sont égales : les valeurs converties doivent coïncider (aux arrondis du catalogue près).</li>
      <li><span class="step">Limites.</span> Repérer le courant permanent admissible (échauffement) et le courant crête ; en déduire le couple permanent \(KI_n\) et la tension nécessaire au point de service par \(U = K\Omega + RI\).</li>
    </ol>
    <p><em>Exemple éclair :</em> constante de f.é.m. 12 V pour 1 000 tr/min, soit \(K = 12/104{,}7 \approx 0{,}115\ \text{V·s/rad}\) : le catalogue doit annoncer une constante de couple d'environ \(115\ \text{mN·m/A}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Identifier les paramètres d'une MCC à partir d'essais</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Résistance.</span> Rotor bloqué (\(\Omega = 0\), donc \(E = 0\)), sous une faible tension continue : \(R = U_b/I_b\). Le temps de montée du courant donne \(\tau_e = L/R\).</li>
      <li><span class="step">Constante \(K\).</span> À vide sous une tension \(U\) : mesurer \(I_0\) et \(\Omega_0\) ; \(K = (U - RI_0)/\Omega_0\). En même temps, \(P_c = UI_0 - RI_0^2\).</li>
      <li><span class="step">Inertie.</span> Imposer un échelon de tension, relever la vitesse : si elle monte sans dépassement, premier ordre, \(\tau_m = t_{r5\%}/3\) (ou à 63 % de la valeur finale), puis \(J = \tau_m K^2/R\) (frottements négligés).</li>
      <li><span class="step">Contrôle.</span> Vérifier \(\tau_m \gg \tau_e\) (sinon le modèle du premier ordre ne vaut pas) et recouper par un autre essai (lâcher, documentation).</li>
    </ol>
    <p><em>Exemple éclair :</em> rotor bloqué sous 1,5 V : 3,0 A, d'où \(R = 0{,}50\ \Omega\). À vide sous 12 V : 0,40 A à 2 200 tr/min (230 rad/s) : \(K = (12 - 0{,}20)/230 = 0{,}051\ \text{V·s/rad}\), \(P_c = 4{,}7\ \text{W}\). Échelon : \(t_{r5\%} = 60\ \text{ms}\), d'où \(\tau_m = 20\ \text{ms}\) et \(J = 0{,}020 \times 0{,}051^2/0{,}50 \approx 1{,}0\times10^{-4}\ \text{kg·m}^2\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Régler la vitesse par un hacheur : rapport cyclique et réversibilité</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Courant moyen.</span> La charge le fixe : \(\langle i\rangle = (C_r + f\Omega)/K\), positif en moteur, négatif pour freiner.</li>
      <li><span class="step">Tension moyenne.</span> \(\langle u\rangle = K\Omega + R\langle i\rangle\) (les tensions moyennes aux bornes de \(L\) sont nulles en régime périodique).</li>
      <li><span class="step">Rapport cyclique.</span> Hacheur série ou réversible en courant : \(\alpha = \langle u\rangle/U_0\), qui doit rester entre 0 et 1 ; sinon la tension de la source ne suffit pas. Pont en H en commande bipolaire : \(\langle u\rangle = (2\alpha - 1)U_0\).</li>
      <li><span class="step">Réversibilité.</span> Signes de \(\langle u\rangle\) et \(\langle i\rangle\) sur tout le cycle → type de hacheur (cours, §8).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(U_0 = 48\ \text{V}\), \(K = 0{,}15\ \text{V·s/rad}\), \(R = 0{,}4\ \Omega\), \(C_r = 1{,}2\ \text{N·m}\), vitesse 1 500 tr/min (157 rad/s). \(\langle i\rangle = 8\ \text{A}\), \(\langle u\rangle = 23{,}6 + 3{,}2 = 26{,}8\ \text{V}\), \(\alpha = 0{,}56\). Pour freiner à la même vitesse avec \(\langle i\rangle = -8\ \text{A}\) : \(\langle u\rangle = 23{,}6 - 3{,}2 = 20{,}4\ \text{V}\), \(\alpha = 0{,}42\), \(u > 0\) et \(i \lt 0\) : hacheur réversible en courant, qui renvoie 163 W à la source.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Limiter le courant de démarrage</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Diagnostic.</span> Démarrage direct : \(I_{dém} = U/R\) ; comparer au courant crête admissible \(I_{max}\).</li>
      <li><span class="step">Résistance de démarrage</span> (solution ancienne, dissipative) : \(R_{add} = U/I_{max} - R\), retirée quand \(E = K\Omega\) a assez augmenté.</li>
      <li><span class="step">Rampe de tension</span> (hacheur) : pendant une montée de 0 à \(U_0\) en \(T_r \gg \tau_m\), \(i \approx \dfrac{JU_0}{K^2T_r} + \dfrac{C_r}{K}\) ; choisir \(T_r \geq \dfrac{J\,U_0}{K^2\,(I_{max} - C_r/K)}\).</li>
      <li><span class="step">Boucle de courant</span> (2ᵉ année) : la consigne de courant est simplement saturée à \(I_{max}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> moteur de la méthode 9, \(J = 2\times10^{-3}\ \text{kg·m}^2\), \(I_{max} = 15\ \text{A}\). Démarrage direct sous 48 V : 120 A. Rampe : \(T_r \geq \dfrac{2\times10^{-3} \times 48}{0{,}0225 \times (15 - 8)} = 0{,}61\ \text{s}\), grand devant \(\tau_m = RJ/K^2 = 36\ \text{ms}\) : la formule s'applique.</p>
  </div>

  <div class="notice"><strong>Pièges classiques de la MCC</strong>
    <ul style="margin-top:0.4rem">
      <li>Confondre la convention récepteur (\(U = E + RI\)) et générateur (\(U = E - RI\)). En moteur → récepteur ; en génératrice → générateur, ou récepteur avec \(I \lt 0\).</li>
      <li>Oublier les frottements dans l'équation mécanique (\(C_{em} \neq C_r\) en général) ou les pertes collectives dans le bilan.</li>
      <li>Laisser une vitesse en tr/min dans \(E = K\Omega\) ou une constante de catalogue non convertie.</li>
      <li>Démarrage : à \(\Omega = 0\), \(E = 0\) donc \(I = U/R\) → peut être très élevé ! Nécessité d'un rhéostat de démarrage ou d'une alimentation progressive avec limitation de courant (hacheur).</li>
      <li>À vide : \(I_0 \neq 0\) car il faut un couple pour vaincre les frottements. Donc \(E_0 = U - R\,I_0 \lt U\).</li>
      <li>Annoncer « freinage avec récupération » pour une simple inversion de tension : c'est un freinage par contre-courant, dissipatif.</li>
      <li>Utiliser le modèle du premier ordre sans vérifier \(\tau_m \gg \tau_e\), ou un \(\tau_m\) mesuré sans la charge.</li>
    </ul>
  </div>
</div>

</template>
