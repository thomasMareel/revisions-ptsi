<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Caractéristique de la MCC</h3>
  <div class="statement">Une MCC à flux constant a les paramètres : \(R = 2\ \Omega\), \(K = 0{,}5\ \text{V·s/rad}\), \(J = 0{,}01\ \text{kg·m}^2\), \(f = 0{,}02\ \text{N·m·s/rad}\). Elle est alimentée par \(U = 24\ \text{V}\).</div>
  <div class="q"><strong>Q1.</strong> Rappeler l'équation de la f.é.m. \(E = K\,\Omega\). Calculer la vitesse à vide idéale (frottements négligés, \(I = 0\)), puis la vitesse à vide réelle compte tenu du frottement visqueux, et le courant à vide correspondant.</div>
  <div class="q"><strong>Q2.</strong> En charge, le moteur tourne à \(\Omega = 40\ \text{rad/s}\). Calculer le courant \(I\), le couple électromagnétique \(C_{em} = K\,I\) et le couple résistant \(C_r\) de la charge.</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance électrique absorbée, la puissance mécanique utile et le rendement.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À vide idéal : \(U = E = K\,\Omega_0\), donc \(\Omega_0 = U/K = 24/0{,}5 = 48\ \text{rad/s}\) (environ 460 tr/min). Avec le frottement, \(KI_0 = f\Omega_0\) et \(U = RI_0 + K\Omega_0\), d'où</p>
    <div class="formula">$$\Omega_0 = \frac{KU}{K^2 + Rf} = \frac{12}{0{,}25 + 0{,}04} \approx 41{,}4\ \text{rad/s}$$</div>
    <p>et \(I_0 = f\Omega_0/K \approx 1{,}66\ \text{A}\) : le frottement est loin d'être négligeable ici.</p>
    <p><strong>Q2.</strong> Loi des mailles : \(U = R I + K\Omega\), donc \(I = (U - K\Omega)/R\), soit \(I = (24 - 0{,}5\times40)/2 = 2\ \text{A}\). \(C_{em} = K\,I = 0{,}5\times2 = 1\ \text{N·m}\). Équation mécanique en régime permanent : \(C_r = C_{em} - f\Omega = 1 - 0{,}8 = 0{,}2\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> \(P_a = UI = 24\times2 = 48\ \text{W}\). Pertes Joule : \(R I^2 = 2\times4 = 8\ \text{W}\). \(P_u = C_{em}\Omega - f\Omega^2 = 40 - 32 = 8\ \text{W}\) (\(= C_r\Omega\)). Rendement : \(\eta = P_u/P_a = 8/48 \approx 17\ \%\). Il est faible car le moteur, à 40 rad/s, est presque à vide (vitesse à vide réelle 41,4 rad/s) : les frottements absorbent l'essentiel de la puissance électromagnétique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Bilan de puissance</h3>
  <div class="statement">Une MCC à flux constant (\(R = 1\ \Omega\)) tourne à \(N = 1500\ \text{tr/min}\) sous \(U = 220\ \text{V}\) en absorbant \(I = 15\ \text{A}\). Le couple utile mesuré sur l'arbre vaut \(C_u = 18{,}5\ \text{N·m}\).</div>
  <div class="q"><strong>Q1.</strong> Convertir la vitesse en rad/s. Calculer la f.é.m., en déduire la constante \(K\) et le couple électromagnétique.</div>
  <div class="q"><strong>Q2.</strong> Établir le bilan de puissance : \(P_a \to P_j \to P_{em} \to P_u\).</div>
  <div class="q"><strong>Q3.</strong> En déduire les pertes collectives (mécaniques et fer), le couple de pertes correspondant et le rendement.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Omega = 1500\times\pi/30 = 157{,}1\ \text{rad/s}\). \(E = U - R I = 220 - 1\times15 = 205\ \text{V}\), d'où \(K = E/\Omega = 205/157{,}1 \approx 1{,}305\ \text{V·s/rad}\) et \(C_{em} = KI \approx 19{,}6\ \text{N·m}\).</p>
    <p><strong>Q2.</strong> \(P_a = UI = 220\times15 = 3300\ \text{W}\). \(P_j = R I^2 = 225\ \text{W}\). \(P_{em} = EI = 205\times15 = 3075\ \text{W}\) (\(= C_{em}\Omega\), contrôle). \(P_u = C_u\Omega = 18{,}5\times157{,}1 \approx 2906\ \text{W}\).</p>
    <p><strong>Q3.</strong> Pertes collectives : \(P_c = P_{em} - P_u \approx 3075 - 2906 = 169\ \text{W}\), soit un couple de pertes \(C_{em} - C_u \approx 1{,}1\ \text{N·m}\). Rendement : \(\eta = P_u/P_a = 2906/3300 \approx 88\ \%\). Vérification : \(3300 = 2906 + 225 + 169\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Démarrage par résistance additionnelle</h3>
  <div class="statement">Une MCC (\(U = 220\ \text{V}\), \(R = 0{,}5\ \Omega\), \(K = 1{,}5\ \text{V·s/rad}\), courant admissible \(I_{max} = 30\ \text{A}\)) démarre avec une résistance additionnelle \(R_{add}\) en série avec l'induit, pour limiter le courant au démarrage (\(\Omega = 0\)).</div>
  <div class="q"><strong>Q1.</strong> Sans \(R_{add}\), quel courant circulerait au démarrage ? Pourquoi est-ce dangereux ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(R_{add}\) pour limiter le courant de démarrage à \(I_{max} = 30\ \text{A}\).</div>
  <div class="q"><strong>Q3.</strong> À partir de quelle vitesse peut-on retirer \(R_{add}\) tout en restant sous \(I_{max}\) ? Comparer à la vitesse à vide idéale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Au démarrage : \(E = 0\) (pas encore de rotation). \(I_{dém} = U/R = 220/0{,}5 = 440\ \text{A}\). Dangereux : près de 15 fois le courant admissible, d'où un échauffement brutal de l'induit, des efforts mécaniques violents, une usure des balais et, pour une machine à aimants, un risque de démagnétisation.</p>
    <p><strong>Q2.</strong> Avec \(R_{add}\) : \(I_{max} = U/(R + R_{add})\), soit</p>
    <div class="formula">$$R_{add} = \frac{U}{I_{max}} - R = \frac{220}{30} - 0{,}5 = \boxed{6{,}83\ \Omega}$$</div>
    <p><strong>Q3.</strong> Sans \(R_{add}\), \(I = (U - E)/R \leq I_{max}\) impose \(E \geq U - R I_{max} = 220 - 0{,}5\times30 = 205\ \text{V}\), soit \(\Omega \geq E/K\) :</p>
    <div class="formula">$$\Omega \geq \frac{205}{1{,}5} = 136{,}7\ \text{rad/s} \approx 1305\ \text{tr/min}$$</div>
    <p>La vitesse à vide idéale vaut \(U/K = 146{,}7\ \text{rad/s}\) : il faut atteindre environ 93 % de cette vitesse. En pratique, on retire la résistance par crans successifs, ou l'on alimente l'induit sous tension progressive avec limitation de courant (hacheur, cours §8).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Freinage par contre-courant ou avec récupération — quadrants</h3>
  <div class="statement">Une MCC (\(R = 1\ \Omega\), \(K = 1{,}5\ \text{V·s/rad}\)) entraîne une charge inertielle (\(J = 0{,}02\ \text{kg·m}^2\), couple résistant négligé). Elle tourne en marche avant à \(\Omega_0 = 100\ \text{rad/s}\). On veut la freiner. On raisonne dans le plan \((C_{em}, \Omega)\) du cours, couple en abscisse.</div>
  <div class="q"><strong>Q1.</strong> On inverse brutalement la tension d'alimentation (\(U = -220\ \text{V}\)). Dans quel quadrant se trouve-t-on juste après l'inversion ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le courant et le couple électromagnétique juste après l'inversion (la vitesse n'a pas encore changé).</div>
  <div class="q"><strong>Q3.</strong> Écrire l'équation dynamique et en déduire la décélération initiale.</div>
  <div class="q"><strong>Q4.</strong> Faire le bilan des puissances juste après l'inversion : puissance fournie par la source, puissance électromagnétique, pertes Joule. Où va l'énergie cinétique ?</div>
  <div class="q"><strong>Q5.</strong> On freine maintenant avec un hacheur réversible en courant, qui abaisse la tension à \(U = 120\ \text{V}\) sans l'inverser. Calculer le courant, le couple, la décélération initiale et la puissance renvoyée à la source. Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Omega > 0\) (marche avant) et, on va le voir, \(C_{em} \lt 0\) (couple freinant) → <strong>quadrant 2</strong> : frein en marche avant. Ce mode, obtenu en inversant la tension, est le <em>freinage par contre-courant</em> (à ne pas confondre avec le freinage rhéostatique, où l'induit débite dans une résistance).</p>
    <p><strong>Q2.</strong> Juste après l'inversion : \(\Omega = 100\ \text{rad/s}\) (inertie), \(E = K\Omega = 1{,}5\times100 = 150\ \text{V}\). La tension vaut \(-220\ \text{V}\), donc</p>
    <div class="formula">$$I = \frac{U - E}{R} = \frac{-220 - 150}{1} = -370\ \text{A}$$</div>
    <p>Très élevé ! \(C_{em} = K\,I = 1{,}5\times(-370) = -555\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> \(J\,\mathrm{d}\Omega/\mathrm{d}t = C_{em} - C_r \approx -555\ \text{N·m}\), soit \(\mathrm{d}\Omega/\mathrm{d}t = -555/0{,}02 = -27\,750\ \text{rad/s}^2\). Décélération extrêmement rapide, au prix d'un courant destructeur : il faudrait insérer une résistance de limitation.</p>
    <p><strong>Q4.</strong> La source fournit \(UI = (-220)\times(-370) = 81\,400\ \text{W}\) ; la puissance électromagnétique \(EI = 150\times(-370) = -55\,500\ \text{W}\) est négative : la machine reçoit 55,5 kW de la charge (énergie cinétique). Les pertes Joule \(RI^2 = 136\,900\ \text{W} = 81\,400 + 55\,500\) absorbent tout : en contre-courant, la machine prend de l'énergie des deux côtés et la dissipe dans l'induit. Rien n'est récupéré, même si le point est en Q2 (avec ici \(U \lt 0\)).</p>
    <p><strong>Q5.</strong> \(I = (120 - 150)/1 = -30\ \text{A}\) (le hacheur accepte le courant négatif), \(C_{em} = -45\ \text{N·m}\) : toujours le quadrant 2, mais avec \(U > 0\). Décélération initiale : \(-45/0{,}02 = -2250\ \text{rad/s}^2\). La source reçoit \(-UI = 3600\ \text{W}\) ; la charge cède \(-EI = 4500\ \text{W}\), dont 900 W de pertes Joule. C'est le <strong>freinage avec récupération</strong> : courant maîtrisé (de l'ordre du courant nominal) et énergie renvoyée vers la source, à condition que celle-ci l'accepte (batterie, bus réversible). Pour freiner jusqu'à l'arrêt, le hacheur abaisse progressivement \(U\) en suivant \(E\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Réglage de vitesse par variation de flux (hors programme, pour aller plus loin)</h3>
  <div class="statement">Le modèle du cours suppose un flux constant ; une MCC à excitation séparée permet pourtant de réduire le flux (<em>défluxage</em>) pour dépasser la vitesse nominale. On écrit toujours \(E = K\,\Omega\) et \(C_{em} = K\,I\), mais la constante \(K\) est proportionnelle au flux de l'inducteur, réglé par le courant d'excitation : \(K = K_n\,\Phi/\Phi_n\). À flux nominal \(\Phi_n\) : \(\Omega_n = 100\ \text{rad/s}\), \(C_n = 20\ \text{N·m}\), \(U_n = 200\ \text{V}\), \(R = 0{,}5\ \Omega\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(K_n\) et le courant nominal \(I_n\).</div>
  <div class="q"><strong>Q2.</strong> On réduit le flux à \(\Phi = 0{,}6\,\Phi_n\) en gardant \(U = U_n\). Calculer la nouvelle vitesse à vide idéale et la vitesse en charge pour le même courant \(I_n\).</div>
  <div class="q"><strong>Q3.</strong> Quel est le couple électromagnétique dans ce cas ? Pourquoi parle-t-on d'un fonctionnement à « puissance constante » ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(C_n = K_n I_n\) et \(U_n = R I_n + K_n\Omega_n\). En posant \(x = K_n\) et \(I_n = 20/x\) : \(200 = 0{,}5\times20/x + 100x\), soit \(100x^2 - 200x + 10 = 0\), \(x^2 - 2x + 0{,}1 = 0\), \(x = 1 \pm \sqrt{0{,}9} = 1 \pm 0{,}949\). La solution physique (petite chute \(RI\)) est \(K_n \approx 1{,}949\ \text{V·s/rad}\), d'où \(I_n \approx 10{,}26\ \text{A}\) (l'autre racine donnerait 390 A).</p>
    <p><strong>Q2.</strong> \(K' = 0{,}6\times1{,}949 = 1{,}169\ \text{V·s/rad}\). Vitesse à vide idéale : \(U_n/K' = 200/1{,}169 \approx 171\ \text{rad/s}\). En charge (\(I = I_n\)) :</p>
    <div class="formula">$$\Omega' = \frac{U_n - R I_n}{K'} = \frac{200 - 5{,}13}{1{,}169} \approx 166{,}7\ \text{rad/s}$$</div>
    <p>La vitesse a augmenté de 67 % (rapport exactement \(1/0{,}6\), puisque \(E = U_n - RI_n\) n'a pas changé).</p>
    <p><strong>Q3.</strong> \(C'_{em} = K'\,I_n = 1{,}169\times10{,}26 \approx 12{,}0\ \text{N·m}\) (réduit dans le rapport 0,6). Puissance électromagnétique : \(P_{em} = EI_n = C'_{em}\Omega' \approx 2000\ \text{W} = C_n\Omega_n\). À tension et courant nominaux, \(E = U_n - RI_n\) est fixé, donc \(P_{em} = EI_n\) aussi : réduire le flux échange du couple contre de la vitesse à puissance constante. C'est le mode utilisé pour dépasser la vitesse nominale.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Hacheur série + MCC — régime permanent et modèle dynamique</h3>
  <div class="statement">Une MCC (\(K = 1{,}2\ \text{V·s/rad}\), \(R = 0{,}8\ \Omega\), \(L = 5\ \text{mH}\), \(J = 5\times10^{-3}\ \text{kg·m}^2\), \(f = 0{,}01\ \text{N·m·s/rad}\)) est alimentée par un hacheur série depuis une batterie de tension \(U_0 = 48\ \text{V}\), avec un rapport cyclique \(\alpha = 0{,}7\). La charge oppose un couple constant \(C_r = 1{,}5\ \text{N·m}\).</div>
  <div class="q"><strong>Q1.</strong> Donner la valeur moyenne \(\langle u \rangle\) de la tension d'alimentation de l'induit.</div>
  <div class="q"><strong>Q2.</strong> En régime permanent, calculer la vitesse \(\Omega\) et le courant moyen \(\langle i \rangle\) (on travaille sur les valeurs moyennes).</div>
  <div class="q"><strong>Q3.</strong> Écrire les équations dans le domaine de Laplace et la fonction de transfert \(H(p) = \Omega(p)/U(p)\) pour \(C_r = 0\). Donner son gain statique, sa pulsation propre et son coefficient d'amortissement. Peut-on ici négliger l'inductance ?</div>
  <div class="q"><strong>Q4.</strong> Dans quels quadrants ce hacheur permet-il de fonctionner ? Que faudrait-il pour freiner en récupérant l'énergie dans la batterie, puis pour inverser le sens de rotation ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\langle u \rangle = \alpha U_0 = 0{,}7\times48 = 33{,}6\ \text{V}\).</p>
    <p><strong>Q2.</strong> En régime permanent, les termes \(L\,\mathrm{d}i/\mathrm{d}t\) et \(J\,\mathrm{d}\Omega/\mathrm{d}t\) sont nuls en moyenne : \(\langle u\rangle = R\langle i\rangle + K\Omega\) et \(K\langle i\rangle = C_r + f\Omega\). La seconde donne \(\langle i\rangle = (1{,}5 + 0{,}01\,\Omega)/1{,}2\) ; en reportant dans la première :</p>
    <div class="formula">$$\Omega = \frac{K\langle u\rangle - R\,C_r}{K^2 + Rf} = \frac{40{,}32 - 1{,}2}{1{,}44 + 0{,}008} \approx 27{,}0\ \text{rad/s}$$</div>
    <p>puis \(\langle i\rangle = (1{,}5 + 0{,}27)/1{,}2 \approx 1{,}48\ \text{A}\). (Négliger le frottement donnerait 1,25 A : 15 % d'erreur sur le courant.)</p>
    <p><strong>Q3.</strong> \(U(p) = (R + Lp)I(p) + K\Omega(p)\) et \(KI(p) - C_r(p) = (f + Jp)\Omega(p)\). Pour \(C_r = 0\) :</p>
    <div class="formula">$$H(p) = \frac{K}{(R + Lp)(f + Jp) + K^2} = \frac{K}{LJ\,p^2 + (RJ + Lf)\,p + Rf + K^2}$$</div>
    <p>Numériquement (unités SI) : \(LJ = 2{,}5\times10^{-5}\), \(RJ + Lf = 4{,}05\times10^{-3}\), \(Rf + K^2 = 1{,}448\). Gain statique \(K_s = K/(Rf + K^2) \approx 0{,}83\ \text{rad·s}^{-1}\text{/V}\) ; \(\omega_0 = \sqrt{1{,}448/2{,}5\times10^{-5}} \approx 241\ \text{rad/s}\) ; \(\xi = \dfrac{4{,}05\times10^{-3}}{2\sqrt{2{,}5\times10^{-5}\times1{,}448}} \approx 0{,}34\). Les pôles \(-81 \pm 227j\) sont à partie réelle négative : système stable, mais peu amorti (dépassement d'environ 32 % sur un échelon). On ne peut pas négliger \(L\) : la constante de temps électrique \(\tau_e = L/R = 6{,}25\ \text{ms}\) dépasse la constante électromécanique \(\tau_m = RJ/K^2 \approx 2{,}8\ \text{ms}\) ; le modèle du premier ordre ne vaut que si \(\tau_e \ll \tau_m\) (cours, §6 : ici \(\tau_m \lt 4\tau_e\), d'où les oscillations).</p>
    <p><em>Remarque (hors programme) :</em> les mêmes équations s'écrivent sous forme matricielle \(\dot x = Ax + Bu\) avec \(x = (i, \Omega)\) ; les valeurs propres de \(A\) sont les pôles de \(H\).</p>
    <p><strong>Q4.</strong> Le hacheur série ne fournit que \(u \geq 0\) et \(i \geq 0\) : la MCC ne peut fonctionner qu'en <strong>quadrant 1</strong> (moteur en marche avant). Pour freiner en marche avant avec récupération (quadrant 2 : \(I \lt 0\), \(U > 0\)), il faut un hacheur réversible en courant ; pour inverser aussi le sens de rotation (quadrants 3 et 4), un hacheur réversible en tension et en courant (pont en H).</p>
  </div>
</div>

  <div class="solution">
    <h4>Correction</h4>

    <p><strong>Q2.</strong> \(v = 6/3{,}6 = 1{,}667\ \text{m/s}\) ; roue : \(\omega = v/r = 9{,}80\ \text{rad/s}\) ; moteur : \(\Omega = \omega/k = 32 \times 9{,}80 = 314\ \text{rad/s}\) (environ 3 000 tr/min). Couple à la roue : \(30 \times 0{,}17 = 5{,}1\ \text{N·m}\). Sur l'arbre moteur, le réducteur divise le couple par 32 mais le moteur doit aussi fournir les pertes du réducteur : \(C_{em} = \dfrac{5{,}1}{32 \times 0{,}85} = 0{,}1875\ \text{N·m}\).</p>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rotor bloqué : \(\Omega = 0\) donc \(E = 0\), et en continu \(L\,\mathrm{d}i/\mathrm{d}t = 0\) : la tension ne sert qu'à vaincre \(R\) ; on impose une faible tension pour ne pas dépasser le courant admissible. \(R = 3{,}0/2{,}0 = 1{,}5\ \Omega\). À vide : le courant est faible, la chute \(RI_0\) petite et connue : la tension donne \(E\), la vitesse mesurée donne \(K\). Échelon : la vitesse en fonction du temps révèle la dynamique, donc l'inertie.</p>
    <p><strong>Q2.</strong> \(\Omega_0 = 3400\pi/30 = 356\ \text{rad/s}\) ; \(E = 24 - 1{,}5 \times 0{,}20 = 23{,}7\ \text{V}\) ; \(K = 23{,}7/356 = 0{,}0666\ \text{V·s/rad}\). \(P_c = 24 \times 0{,}20 - 1{,}5 \times 0{,}20^2 = 4{,}74\ \text{W}\) ; \(C_p = P_c/\Omega_0 = 0{,}0133\ \text{N·m}\) (c'est aussi \(KI_0\)).</p>
    <p><strong>Q3.</strong> Valeur finale lue : 355 rad/s. 95 % (337 rad/s) est atteint vers 57 ms, 63 % (224 rad/s) vers 20 ms. La réponse ne dépasse pas et a l'allure d'une exponentielle (l'arrondi du tout début, dû à l'inductance, ne dure qu'une à deux millisecondes) : modèle du premier ordre. \(\tau_m \approx 20\ \text{ms}\) (méthode des 63 %) ou \(57/3 = 19\ \text{ms}\) (méthode des 5 %). Avec \(\tau_m = 20\ \text{ms}\) :</p>
    <div class="formula">$$J = \frac{\tau_m K^2}{R} = \frac{0{,}020 \times 0{,}0666^2}{1{,}5} = 5{,}9\times10^{-5}\ \text{kg·m}^2$$</div>
    <p> Les deux lectures diffèrent de 5 % : l'inductance de l'induit, négligée, rend le pôle dominant un peu plus rapide que \(\tau_m\) (cours, §6), et la lecture graphique a sa propre incertitude.</p>
    <p><strong>Q4.</strong> Alimentation coupée, plus de courant donc plus de couple moteur : \(J\,\mathrm{d}\Omega/\mathrm{d}t = -C_p\), soit une décélération \(C_p/J = 0{,}0133/5{,}9\times10^{-5} \approx 225\ \text{rad/s}^2\) et un arrêt en \(356/225 \approx 1{,}6\ \text{s}\). Mesurer ce ralentissement permet de recouper \(J\) indépendamment de \(K\) et de \(R\) (essai de lâcher).</p>
  </div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Ventilateur d'habitacle : hacheur ou résistance série ?</h3>
  <div class="statement">Le pulseur d'air d'une voiture est entraîné par une MCC (\(K = 0{,}025\ \text{V·s/rad}\), \(R = 0{,}15\ \Omega\), inductance \(L = 0{,}2\ \text{mH}\)) alimentée par la batterie de 12 V. Le couple résistant du ventilateur, frottements compris, vaut \(C_r = a\Omega^2\) avec \(a = 1{,}0\times10^{-6}\ \text{N·m·s}^2\).</div>
  <div class="q"><strong>Q1.</strong> Sous 12 V, calculer la vitesse, le couple, le courant, la puissance utile (\(a\Omega^3\)) et le rendement du moteur.</div>
  <div class="q"><strong>Q2.</strong> On veut la moitié de cette vitesse avec un hacheur série commuté à 20 kHz. Calculer le couple, le courant moyen, la tension moyenne et le rapport cyclique.</div>
  <div class="q"><strong>Q3.</strong> Les anciens véhicules obtenaient cette vitesse avec une résistance en série. Calculer sa valeur, la puissance qu'elle dissipe et le rendement de l'ensemble ; comparer au hacheur, supposé parfait.</div>
  <div class="q"><strong>Q4.</strong> Estimer l'ondulation du courant avec la formule \(\Delta i \approx \alpha(1 - \alpha)U_0/(Lf_d)\) (chapitre « Les hacheurs », §5). Le courant reste-t-il continu ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Point de fonctionnement : \(a\Omega^2 = \dfrac{K}{R}(U - K\Omega)\), soit \(10^{-6}\,\Omega^2 + 4{,}17\times10^{-3}\,\Omega - 2{,}0 = 0\). Racine positive : \(\Omega = 435\ \text{rad/s}\) (4 150 tr/min). \(C = a\Omega^2 = 0{,}189\ \text{N·m}\), \(I = C/K = 7{,}56\ \text{A}\). Puissance utile \(a\Omega^3 = 82{,}1\ \text{W}\), absorbée \(12 \times 7{,}56 = 90{,}7\ \text{W}\), pertes Joule 8,6 W : \(\eta = 0{,}91\) (seules les pertes Joule sont comptées, les frottements étant inclus dans la charge).</p>
    <p><strong>Q2.</strong> \(\Omega = 217\ \text{rad/s}\) : \(C = 10^{-6} \times 217^2 = 0{,}0472\ \text{N·m}\) (quatre fois moins), \(\langle i\rangle = 1{,}89\ \text{A}\), \(\langle u\rangle = K\Omega + R\langle i\rangle = 5{,}43 + 0{,}28 = 5{,}72\ \text{V}\), \(\alpha = 5{,}72/12 = 0{,}48\).</p>
    <p><strong>Q3.</strong> Même point avec une résistance \(R_s\) : \(12 = K\Omega + (R + R_s)\,I\), d'où \(R_s = \dfrac{12 - 5{,}43}{1{,}89} - 0{,}15 = 3{,}33\ \Omega\), qui dissipe \(R_sI^2 = 11{,}9\ \text{W}\), plus que la puissance utile (10,3 W). Rendement : \(10{,}3/(12 \times 1{,}89) = 0{,}45\), contre \(10{,}3/(5{,}72 \times 1{,}89) = 0{,}95\) avec le hacheur parfait. C'est tout l'intérêt de <strong>moduler</strong> par découpage : la tension est abaissée sans dissiper la différence.</p>
    <p><strong>Q4.</strong></p>
    <div class="formula">$$\Delta i \approx \frac{0{,}48 \times 0{,}52 \times 12}{0{,}2\times10^{-3} \times 2\times10^4} = 0{,}75\ \text{A}$$</div>
    <p>crête à crête : le courant varie entre 1,52 et 2,26 A environ ; il reste positif, donc continu. La formule suppose \(R\) négligeable sur une période (\(\tau_e = L/R = 1{,}3\ \text{ms}\), contre une période de 50 µs : c'est le cas). L'ondulation relative (40 %) est forte mais sans effet sur la vitesse, filtrée par l'inertie.</p>
  </div>
</div>

<div class="exo">

  <h3>Monte-charge : quadrants et choix du convertisseur</h3>

  <div class="q"><strong>Q1.</strong> Calculer la vitesse du tambour, celle du moteur et le couple exercé par la charge sur le tambour.</div>
  <div class="q"><strong>Q2.</strong> Montée : calculer le couple électromagnétique, le courant et la tension d'induit. Placer le point dans le plan \((C_{em}, \Omega)\).</div>
  <div class="q"><strong>Q3.</strong> Descente : le moteur retient la charge. Mêmes calculs ; dans quel quadrant est-on ?</div>
  <div class="q"><strong>Q4.</strong> Faire le bilan des puissances à la descente : puissance cédée par la charge, pertes du réducteur, pertes Joule, puissance renvoyée à la source.</div>
  <div class="q"><strong>Q5.</strong> Quelle réversibilité le convertisseur doit-il avoir ? On utilise deux cellules en pont, deux diagonales fermées alternativement, qui donnent \(\langle u\rangle = (2\alpha - 1)\,U_0\) (« Convertisseurs statiques », §7). Calculer \(\alpha\) à la montée et à la descente.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tambour : \(\omega_t = v/r = 0{,}5/0{,}05 = 10\ \text{rad/s}\) ; moteur : \(\Omega = \omega_t/k = 200\ \text{rad/s}\) (1 910 tr/min). Couple de la charge sur le tambour : \(mgr = 50 \times 9{,}81 \times 0{,}05 = 24{,}5\ \text{N·m}\).</p>
    <p><strong>Q2.</strong> \(C_{em} = C_r = \dfrac{24{,}5}{20 \times 0{,}90} = 1{,}36\ \text{N·m}\) ; \(I = 1{,}36/0{,}20 = 6{,}81\ \text{A}\) ; \(U = K\Omega + RI = 40 + 3{,}4 = 43{,}4\ \text{V}\). \(C_{em} > 0\), \(\Omega > 0\) : quadrant 1, moteur en marche avant.</p>
    <p><strong>Q3.</strong> À la descente, le couple du moteur garde son signe (il retient le poids) alors que la vitesse s'inverse : \(C_{em} = \dfrac{24{,}5 \times 0{,}90}{20} = 1{,}10\ \text{N·m}\), \(I = 5{,}52\ \text{A}\), \(\Omega = -200\ \text{rad/s}\), \(U = -40 + 2{,}8 = -37{,}2\ \text{V}\). Quadrant 4 du plan \((C_{em}, \Omega)\) : frein en marche arrière. (Dans le plan \((u, i)\) d'un convertisseur, c'est le quadrant 2.)</p>
    <p><strong>Q4.</strong> La charge cède \(mgv = 245\ \text{W}\) ; le réducteur en perd 10 %, il en arrive \(220{,}7\ \text{W}\) à l'arbre (\(= C_{em}|\Omega|\)) ; pertes Joule \(RI^2 = 15{,}2\ \text{W}\) ; la source reçoit \(-UI = 37{,}2 \times 5{,}52 = 205{,}5\ \text{W}\). Bilan : \(220{,}7 = 15{,}2 + 205{,}5\).</p>
    <p><strong>Q5.</strong> Le courant ne change pas de signe, la tension si : convertisseur <strong>réversible en tension</strong>, non réversible en courant (deux transistors et deux diodes en diagonale, « Convertisseurs statiques », §7). Montée : \(\alpha = \dfrac{1 + 43{,}4/48}{2} = 0{,}95\) ; descente : \(\alpha = \dfrac{1 - 37{,}2/48}{2} = 0{,}11\). La source doit pouvoir recevoir 205 W (batterie, ou résistance de freinage sur le bus).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Micromoteur : modèle du deuxième ordre et simulation par la méthode d'Euler</h3>
  <div class="statement">Un micromoteur à vide (\(R = 2{,}0\ \Omega\), \(L = 4{,}0\ \text{mH}\), \(K = 0{,}020\ \text{V·s/rad}\), \(J = 5{,}0\times10^{-7}\ \text{kg·m}^2\), frottements négligés) reçoit, à l'arrêt, un échelon de tension de 6,0 V.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\tau_e\) et \(\tau_m\). Le modèle du premier ordre est-il justifié ? Mettre \(\Omega(p)/U(p)\) sous forme canonique et calculer \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q2.</strong> Donner la vitesse finale, le dépassement relatif \(D_1 = e^{-\pi\xi/\sqrt{1-\xi^2}}\), la vitesse maximale et l'instant où elle est atteinte (\(t = \pi/\omega_p\), avec \(\omega_p = \omega_0\sqrt{1 - \xi^2}\)). Comparer au temps de réponse qu'annoncerait le premier ordre.</div>
  <div class="q"><strong>Q3.</strong> Écrire les deux équations différentielles sous la forme \(i' = F(i, \Omega)\), \(\Omega' = G(i, \Omega)\), puis un programme Python qui les résout par la méthode d'Euler explicite. Quel pas choisir ?</div>
  <div class="q"><strong>Q4.</strong> La simulation montre que le courant devient brièvement négatif pendant le dépassement. Expliquer.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\tau_e = L/R = 2{,}0\ \text{ms}\) ; \(\tau_m = RJ/K^2\), soit \(\tau_m = 2{,}0 \times 5\times10^{-7}/(4\times10^{-4}) = 2{,}5\ \text{ms}\). Les deux constantes sont du même ordre (\(\tau_m \lt 4\tau_e\)) : le premier ordre n'est <strong>pas</strong> justifié. \(\dfrac{\Omega(p)}{U(p)} = \dfrac{1/K}{1 + \tau_m p + \tau_e\tau_m p^2}\), d'où \(\omega_0 = 1/\sqrt{\tau_e\tau_m} = 1/\sqrt{5\times10^{-6}} = 447\ \text{rad/s}\) et \(\xi = \frac12\sqrt{\tau_m/\tau_e} = \frac12\sqrt{1{,}25} = 0{,}56\).</p>
    <p><strong>Q2.</strong> Vitesse finale \(U/K = 300\ \text{rad/s}\). \(D_1 = e^{-\pi \times 0{,}559/0{,}829} = 0{,}12\) : vitesse maximale \(300 \times 1{,}12 = 336\ \text{rad/s}\), atteinte à \(t = \pi/\omega_p\) avec \(\omega_p = 447 \times 0{,}829 = 371\ \text{rad/s}\), soit 8,5 ms. Le temps de réponse à 5 % vaut environ 11,8 ms (\(\omega_0 t_{r5\%} \approx 5{,}3\), abaque de « Systèmes du 2e ordre »), alors que le premier ordre annoncerait \(3\tau_m = 7{,}5\ \text{ms}\) et aucun dépassement.</p>
    <p><strong>Q3.</strong> \(i' = \dfrac{U - Ri - K\Omega}{L}\) et \(\Omega' = \dfrac{K i}{J}\). Avec un pas \(h\) petit devant la plus courte constante de temps (ici \(\tau_e = 2\ \text{ms}\)), par exemple \(h = 20\ \mu\text{s}\) :</p>
    <pre class="codeblock">R, L, K, J, U = 2.0, 4.0e-3, 0.020, 5.0e-7, 6.0
h, n = 20e-6, 2000                    <span class="cmt"># pas de 20 µs, 40 ms simulées</span>
t, i, w = 0.0, 0.0, 0.0                <span class="cmt"># départ à l'arrêt</span>
T, I, W = [t], [i], [w]
<span class="kw">for</span> k <span class="kw">in</span> range(n):
    di = (U - R * i - K * w) / L     <span class="cmt"># équation électrique</span>
    dw = K * i / J                   <span class="cmt"># équation mécanique</span>
    i, w, t = i + h * di, w + h * dw, t + h
    T.append(t); I.append(i); W.append(w)
<span class="kw">print</span>(max(W), max(I), min(I))      <span class="cmt"># ≈ 336.7  1.74  -0.21</span></pre>
    <p>Les deux mises à jour utilisent les valeurs de l'instant \(t_k\) (Euler explicite). Avec \(h = 20\ \mu\text{s}\), la vitesse maximale vaut 336,7 rad/s (valeur exacte 336,1) ; avec \(h = 0{,}1\ \text{ms}\), 339,3 rad/s : l'erreur croît avec le pas, et la méthode diverge si \(h\) devient comparable à \(\tau_e\).</p>
    <p><strong>Q4.</strong> Pendant le dépassement, \(\Omega > U/K\), donc \(E = K\Omega > U\) : le courant \(i = (U - E - L\,\mathrm{d}i/\mathrm{d}t)/R\) s'inverse, le couple devient freinant et ramène la vitesse vers 300 rad/s. La machine passe brièvement en quadrant 2 ; avec un hacheur série (non réversible en courant), ce courant négatif serait impossible et la réponse serait différente.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Machine à courant continu : modélisation, dynamique et freinage</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>MCC</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une machine à courant continu à aimants permanents (flux constant) entraîne l'axe d'un petit convoyeur. Elle a une résistance d'induit \(R = 2{,}0\ \Omega\), une constante \(K = 0{,}10\ \text{V·s/rad}\) (= N·m/A) et une inertie totale ramenée sur son arbre \(J = 2{,}0\times10^{-4}\ \text{kg·m}^2\). On néglige l'inductance de l'induit, les frottements et les pertes fer. Elle est alimentée par un hacheur réversible en courant, sous \(U = 24\ \text{V}\) en marche normale.
  </div>

  <p class="exo-part">Partie A — Équations et point de fonctionnement</p>
  <div class="q"><strong>A1.</strong> Rappeler l'équation électrique de l'induit ainsi que les relations \(E = K\Omega\) et \(C_{em} = KI\).</div>
  <div class="q"><strong>A2.</strong> En charge, l'induit appelle \(I = 2{,}0\ \text{A}\). Calculer la f.é.m. \(E\), la vitesse \(\Omega\) et le couple électromagnétique \(C_{em}\), égal au couple résistant \(C_r\) de la charge.</div>

  <p class="exo-part">Partie B — Bilan de puissance</p>
  <div class="q"><strong>B1.</strong> Calculer la puissance absorbée, les pertes Joule et la puissance électromagnétique. En déduire le rendement.</div>

  <p class="exo-part">Partie C — Démarrage</p>
  <div class="q"><strong>C1.</strong> Établir la fonction de transfert \(\Omega(p)/U(p)\) à vide (\(C_r = 0\)). Montrer qu'elle est du premier ordre et calculer son gain et sa constante de temps \(\tau_m\).</div>
  <div class="q"><strong>C2.</strong> La machine, à l'arrêt et à vide, reçoit un échelon de 24 V. Donner \(\Omega(t)\), le temps de réponse à 5 % et le courant \(i(t)\). Comparer le courant initial au courant de A2 et proposer une solution s'il dépasse le courant crête admissible de 8 A.</div>

  <p class="exo-part">Partie D — Freinage avec récupération</p>
  <div class="q"><strong>D1.</strong> La machine tourne au point de A2. Le hacheur abaisse brusquement la tension à \(U = 16\ \text{V}\). Calculer le courant et le couple juste après, situer le point dans le plan \((C_{em}, \Omega)\) et faire le bilan des puissances.</div>
  <div class="q"><strong>D2.</strong> La charge de A2 restant appliquée, écrire l'équation de la vitesse, en déduire \(\Omega(t)\) et la vitesse finale. Pendant combien de temps la machine renvoie-t-elle de l'énergie à la source ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Équation électrique (convention récepteur, inductance négligée) : \(U = E + RI\). F.é.m. : \(E = K\Omega\). Couple électromagnétique : \(C_{em} = KI\) (même constante \(K\) en unités SI).</p>
    <p><strong>A2.</strong> \(E = U - RI = 24 - 2{,}0\times2{,}0 = 20\ \text{V}\). \(\Omega = E/K = 20/0{,}10 = 200\ \text{rad/s}\) (≈ 1 910 tr/min). \(C_{em} = KI = 0{,}10\times2{,}0 = 0{,}20\ \text{N·m} = C_r\) (frottements négligés).</p>
    <p><strong>B1.</strong> \(P_a = UI = 48\ \text{W}\) ; pertes Joule \(P_j = RI^2 = 8{,}0\ \text{W}\) ; puissance électromagnétique \(P_{em} = EI = 40\ \text{W}\) (\(= C_{em}\Omega = 40\ \text{W}\), cohérent). Pertes mécaniques et fer négligées, \(P_u = P_{em}\) : \(\eta = 40/48 \approx 0{,}83\) (83 %).</p>
    <p><strong>C1.</strong> \(U = RI + K\Omega\) et \(KI = Jp\,\Omega\) donnent \(U = \left(\dfrac{RJ}{K}p + K\right)\Omega\), soit</p>
    <div class="formula">$$\frac{\Omega(p)}{U(p)} = \frac{1/K}{1 + \tau_m p} \qquad \tau_m = \frac{RJ}{K^2} = \frac{2\times2\times10^{-4}}{0{,}01} = 0{,}04\ \text{s}$$</div>
    <p>Gain \(1/K = 10\ \text{rad·s}^{-1}\text{/V}\).</p>
    <p><strong>C2.</strong> \(\Omega(t) = 240\left(1 - e^{-t/\tau_m}\right)\) rad/s, qui atteint 95 % de 240 rad/s en \(3\tau_m = 0{,}12\ \text{s}\). Le courant \(i = (U - K\Omega)/R = 12\,e^{-t/\tau_m}\) A vaut 12 A au démarrage, six fois le courant de A2 et au-delà des 8 A admissibles. Solution : limiter le courant par le hacheur (boucle de courant saturée à 8 A, ou rampe de tension), ce qui allonge un peu le démarrage.</p>
    <p><strong>D1.</strong> La vitesse n'a pas le temps de varier : \(E = 20\ \text{V}\), \(I = (16 - 20)/2{,}0 = -2{,}0\ \text{A}\), \(C_{em} = -0{,}20\ \text{N·m}\). Avec \(\Omega > 0\) et \(C_{em} \lt 0\) : <strong>quadrant 2</strong>, frein en marche avant (\(U > 0\), \(I \lt 0\)), possible parce que le hacheur est réversible en courant. Bilan : \(UI = -32\ \text{W}\) (la source <em>reçoit</em> 32 W), \(EI = -40\ \text{W}\) (la machine reçoit 40 W de la charge et de l'inertie), \(RI^2 = 8\ \text{W}\) : \(40 = 32 + 8\).</p>
    <p><strong>D2.</strong> \(J\,\dfrac{\mathrm{d}\Omega}{\mathrm{d}t} = \dfrac{K(U - K\Omega)}{R} - C_r\), soit</p>
    <div class="formula">$$\tau_m\frac{\mathrm{d}\Omega}{\mathrm{d}t} + \Omega = \frac{U}{K} - \frac{RC_r}{K^2} = 160 - 40 = 120\ \text{rad/s}$$</div>
    <p>Avec \(\Omega(0) = 200\ \text{rad/s}\) :</p>
    <div class="formula">$$\Omega(t) = 120 + 80\,e^{-t/\tau_m}\ \ \text{rad/s}$$</div>
    <p>La vitesse tend vers 120 rad/s (nouveau point moteur, \(I = 2\ \text{A}\)). La décélération initiale vaut \((-0{,}20 - 0{,}20)/J = -2000\ \text{rad/s}^2\). Le courant est négatif tant que \(E > U\), c'est-à-dire \(\Omega > 160\ \text{rad/s}\) : \(80\,e^{-t/\tau_m} = 40\) donne \(t = \tau_m\ln 2 \approx 28\ \text{ms}\). Pendant ces 28 ms, la machine fonctionne en génératrice et renvoie de l'énergie à la source ; ensuite, elle repasse en moteur (quadrant 1) à vitesse réduite.</p>
  </div>
</div>
