<div class="course-section">
  <div class="sec-num">§1 · ARCHITECTURE D'UN SYSTÈME (RAPPELS)</div>
  <h2>Du système réel au modèle multiphysique</h2>
  <div class="intro">Un produit industriel actuel associe mécanique, électrotechnique, électronique, hydraulique, thermique et informatique. Pour prévoir ses performances avant de le fabriquer, ou pour comprendre pourquoi il ne se comporte pas comme prévu, on assemble dans un logiciel de simulation les modèles de chacun de ses constituants : c'est la <strong>modélisation multiphysique</strong>.</div>

  <h3>Chaîne d'information et chaîne de puissance</h3>
  <p>Le découpage fonctionnel de 1<sup>re</sup> année reste l'ossature de tout modèle :</p>
  <ul>
    <li><strong>chaîne d'information</strong> : <em>acquérir</em> (capteurs, interface homme-machine), <em>traiter</em> (microcontrôleur, automate, carte de commande), <em>communiquer</em> (bus de terrain, liaison sans fil, afficheur). Elle manipule des signaux de très faible puissance : seule leur valeur compte ;</li>
    <li><strong>chaîne de puissance</strong> (ou d'énergie) : <em>alimenter</em> (batterie, réseau, compresseur), <em>moduler</em> ou <em>distribuer</em> (variateur, hacheur, distributeur hydraulique), <em>convertir</em> (moteur, vérin, résistance chauffante), <em>transmettre</em> (réducteur, vis, courroie, bielle-manivelle), puis <em>agir</em> sur la matière d'œuvre par l'effecteur. Elle véhicule de l'énergie.</li>
  </ul>

  <div class="def-box"><strong>Diagramme de blocs internes (ibd, SysML).</strong> Il décrit l'architecture structurelle du système : les constituants (blocs) y sont reliés par leurs <strong>ports</strong>, et chaque connecteur indique ce qui circule (énergie électrique, énergie mécanique, fluide, information…). Un modèle multiphysique acausal en reprend directement la topologie : un bloc devient un composant, un connecteur devient un lien.</div>

  <div class="prop-box"><strong>À quoi sert un modèle multiphysique ?</strong>
    <ul style="margin:.4rem 0">
      <li><strong>dimensionner</strong> : choisir un moteur, une batterie, un vérin, un réducteur ;</li>
      <li><strong>prévoir les performances</strong> (rapidité, précision, consommation, échauffement) et les confronter au cahier des charges ;</li>
      <li><strong>tester une loi de commande</strong> sans risquer le matériel ;</li>
      <li><strong>expliquer un écart</strong> entre le comportement attendu et le comportement mesuré.</li>
    </ul>
  </div>

  <div class="notice"><strong>Trois systèmes, trois écarts.</strong> On compare en permanence le système <em>souhaité</em> (exigences du cahier des charges), le système <em>réel</em> (mesures sur le prototype) et le système <em>simulé</em> (modèle). L'écart souhaité–simulé dit si la solution envisagée répond au besoin ; l'écart réel–simulé dit si le modèle est fidèle ; l'écart souhaité–réel dit si le produit est conforme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DEUX FAMILLES DE MODÈLES</div>
  <h2>Modèle de connaissance et modèle de comportement</h2>
  <div class="intro">Avant de choisir un logiciel, il faut décider d'où viennent les équations de chaque constituant : de la physique, ou de l'expérience.</div>

  <h3>Modèle de connaissance</h3>
  <div class="def-box"><strong>Modèle de connaissance.</strong> Ses équations découlent des lois physiques : principe fondamental de la dynamique, lois de Kirchhoff, conservation de la masse, bilan d'énergie… Ses paramètres ont un sens physique (résistance \(R\), inertie \(J\), raideur \(k\), section \(S\)…) et s'obtiennent par le calcul, la documentation du constructeur ou la CAO. Il reste utilisable hors des conditions d'essai, tant que ses hypothèses restent vraies.</div>
  <p>Exemple : une bobine réelle est décrite par la loi des mailles,</p>
  <div class="formula">$$u(t) = R\,i(t) + L\,\frac{di}{dt}$$</div>

  <h3>Modèle de comportement</h3>
  <div class="def-box"><strong>Modèle de comportement</strong> (ou de représentation). Modèle « boîte noire » dont on choisit a priori la structure (gain pur, premier ordre, deuxième ordre, retard…) et dont on ajuste les paramètres pour reproduire des essais : c'est l'<strong>identification</strong>. Il ne renseigne pas sur les mécanismes internes et n'est fiable que dans le domaine exploré par les essais (amplitude, fréquence, point de fonctionnement).</div>
  <div class="formula">$$H(p) = \frac{K}{1+\tau p}\qquad\text{ou}$$ $$H(p) = \frac{K}{1+\dfrac{2\xi}{\omega_0}\,p+\dfrac{p^2}{\omega_0^2}}$$</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un échelon de 10 V appliqué à un moteur fait passer sa vitesse de 0 à 150 rad/s, et 63 % de cette variation sont atteints au bout de 40 ms. Quel modèle de comportement proposer ?</span>
    <div class="content"><p>Échelon de 10 V, vitesse finale 150 rad/s, 63 % atteints à 40 ms. La réponse ne présente ni dépassement ni tangente horizontale à l'origine : on retient un premier ordre. Gain statique \(K = \Delta\omega_\infty/\Delta u = 150/10 = 15\ \text{rad·s}^{-1}\text{·V}^{-1}\) ; constante de temps \(\tau = 40\ \text{ms}\) (instant où \(\omega = 0{,}63\times150 \approx 95\ \text{rad/s}\)). D'où :</p>
    <div class="formula">$$H(p) = \frac{15}{1+0{,}04\,p}$$</div>
    <p>Contrôle : temps de réponse à 5 % \(\approx 3\tau = 0{,}12\ \text{s}\), à comparer à la courbe mesurée.</p></div>
  </div>

  <h3>Paramétrer un modèle</h3>
  <div class="prop-box">Les sources de paramètres sont, par ordre de préférence : la <strong>documentation constructeur</strong> (\(R\), \(L\), \(K\), \(J\) d'un moteur, rapport d'un réducteur) ; le <strong>modeleur volumique</strong> (masses, centres d'inertie, moments d'inertie) ; le <strong>calcul</strong> (inertie ramenée, raideur d'une poutre) ; les <strong>essais</strong>. Un paramètre impossible à mesurer directement (frottement, raideur de contact) est <strong>recalé</strong> en comparant simulation et essai.</div>

  <div class="notice"><strong>Principe de parcimonie.</strong> Le bon modèle est le plus simple qui permet de répondre à la question posée. Chaque phénomène ajouté alourdit le calcul et introduit des paramètres mal connus.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MODÉLISATION CAUSALE</div>
  <h2>Relations de cause à effet et schéma-blocs</h2>
  <div class="intro">En modélisation causale, chaque relation est écrite comme une instruction de calcul : connaissant la cause, on en déduit l'effet. Le modèle est un graphe orienté de blocs reliés par des signaux.</div>

  <h3>Cause, effet et causalité intégrale</h3>
  <p>Le courant dans une inductance soumise à la tension \(u_L\) s'obtient en intégrant la loi \(u_L = L\,di/dt\) :</p>
  <div class="formula">$$i(t) = i(0) + \frac{1}{L}\int_0^t u_L(\tau)\,d\tau$$</div>
  <p>Le courant à l'instant \(t\) résulte de toute l'histoire de la tension : la tension est la <strong>cause</strong>, le courant l'<strong>effet</strong>. Il en va de même pour la tension d'un condensateur, qui cumule les charges apportées par le courant, ou pour la vitesse d'un solide, qui cumule l'action de la résultante des efforts. Ce sens, imposé par la physique (une grandeur « stockée » ne peut pas varier instantanément), est la <strong>causalité intégrale</strong>. Les simulateurs la préfèrent : l'intégration numérique est stable et lisse les discontinuités, alors qu'une dérivation amplifie le bruit et transforme un échelon en impulsion.</p>

  <h3>Le schéma-blocs, modèle causal linéaire</h3>
  <div class="def-box"><strong>Schéma-blocs.</strong> Traduction graphique, après transformation de Laplace, d'un modèle linéaire invariant. Un <strong>bloc</strong> contient une fonction de transfert qui calcule son signal de sortie à partir de son signal d'entrée ; une <strong>flèche</strong> transmet <strong>un signal unique</strong> (par exemple un courant ou une vitesse angulaire) dans un sens imposé ; sommateurs et points de prélèvement combinent ou recopient ces signaux.</div>
  <p>Une équation différentielle linéaire à coefficients constants, d'entrée \(e(t)\) et de sortie \(s(t)\),</p>
  <div class="formula">$$\sum_{i=0}^{n} a_i\,\frac{d^i s}{dt^i} = \sum_{j=0}^{m} b_j\,\frac{d^j e}{dt^j}$$</div>
  <p>devient, par transformation de Laplace,</p>
  <div class="formula">$$H(p)=\frac{S(p)}{E(p)}=\frac{b_m p^m+\dots+b_1 p+b_0}{a_n p^n+\dots+a_1 p+a_0}$$</div>
  <div class="prop-box"><strong>Conditions de Heaviside.</strong> Cette écriture suppose nulles, à l'instant initial, l'entrée, la sortie et toutes leurs dérivées utiles. On s'y ramène en travaillant sur les <strong>variations</strong> autour d'un point d'équilibre : \(e = e_0 + \Delta e\), \(s = s_0 + \Delta s\). Le schéma-blocs relie alors \(\Delta E(p)\) à \(\Delta S(p)\).</div>

  <h3>Linéariser autour d'un point de fonctionnement</h3>
  <p>Une loi non linéaire \(y = g(x)\) (débit à travers un orifice, couple aérodynamique en \(\omega^2\), force d'un électroaimant…) est remplacée, pour de petites variations autour de \(x_0\), par sa tangente :</p>
  <div class="formula">$$\Delta y \approx g'(x_0)\,\Delta x$$</div>
  <p>Le gain du bloc obtenu dépend du point de fonctionnement : un modèle linéarisé n'est valable qu'au voisinage de ce point.</p>

  <h3>Atouts et limites</h3>
  <ul>
    <li><strong>+</strong> Le modèle est prêt pour l'automatique : FTBO, diagramme de Bode, marges, réglage d'un correcteur ; le calcul est léger et rapide.</li>
    <li><strong>−</strong> C'est le modélisateur qui écrit toutes les équations et décide du sens de chaque relation.</li>
    <li><strong>−</strong> On ne « voit » plus le système : un bloc rassemble souvent plusieurs pièces (une inertie équivalente regroupe rotor, réducteur et charge), un même système admet plusieurs schémas, et changer un constituant impose de reprendre les calculs à la main.</li>
    <li><strong>−</strong> Hors des quelques blocs non linéaires fournis par le logiciel (saturation, seuil, hystérésis, retard), toute loi non linéaire doit d'abord être linéarisée.</li>
  </ul>

  <h3>Rôle du solveur</h3>
  <div class="def-box"><strong>Solveur.</strong> Algorithme qui intègre numériquement les équations du modèle, pas à pas : il calcule l'état à l'instant \(t_{k+1} = t_k + h\) à partir de l'état à l'instant \(t_k\). Le schéma le plus simple, Euler explicite, s'écrit
  $$x_{k+1} = x_k + h\,f(x_k, u_k)$$
  Les logiciels emploient des méthodes plus précises (Runge-Kutta, méthodes implicites) et adaptent le pas \(h\) pour respecter une tolérance d'erreur.</div>
  <p>Un pas trop grand devant la plus petite constante de temps donne des résultats faux, voire divergents. Un modèle qui mêle des constantes de temps très différentes (par exemple 1 ms pour l'électrique et 1 s pour la mécanique) est dit <strong>raide</strong> : il demande un solveur adapté.</p>
  <div class="notice"><strong>Boucle algébrique.</strong> Une boucle fermée qui ne contient ni intégrateur ni retard oblige le solveur à résoudre une équation implicite à chaque pas ; la plupart des logiciels le signalent par un avertissement.</div>

  <h3>Mener une simulation : grandeurs, pas, durée, influence d'un paramètre</h3>
  <div class="method-box">
    <strong>Méthode — préparer puis exploiter une simulation</strong>
    <ol>
      <li><strong>Grandeurs observées</strong> : celles des critères du cahier des charges (vitesse, position, temps de réponse, dépassement…), plus les grandeurs internes qui dimensionnent ou limitent les constituants (courant, couple, tension de commande, pression, puissance). Un réglage qui sature l'actionneur n'est pas validé par la seule courbe de sortie.</li>
      <li><strong>Durée</strong> : assez longue pour atteindre le régime permanent, soit 3 à 5 fois la plus grande constante de temps (ou le temps de réponse attendu), ou un cycle de fonctionnement complet pour un bilan d'énergie.</li>
      <li><strong>Solveur et pas</strong> : à pas fixe, un pas de l'ordre du dixième de la plus petite constante de temps à représenter ; pour un modèle raide, un solveur à pas variable réglé par une tolérance. Contrôle simple : diviser le pas par deux ne doit plus changer les résultats.</li>
      <li><strong>Influence d'un paramètre</strong> : faire varier un seul paramètre à la fois (balayage), tracer chaque performance en fonction de ce paramètre et repérer la plage de valeurs qui respecte le cahier des charges.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — démarrage du moteur du convoyeur</strong>
    <p>On reprend le moteur du §6 (\(R = 1\ \Omega\), \(L = 1\ \text{mH}\), \(K = 0{,}05\ \text{N·m/A}\), frottement et charge négligés), démarré par un échelon de 12 V, et l'on intègre ses deux équations (courant et vitesse) par Euler explicite.</p>
    <ol>
      <li><strong>Pas et durée</strong> : \(\tau_e = L/R = 1\ \text{ms}\) et, pour \(J_{eq} = 10^{-4}\ \text{kg·m}^2\), \(\tau_m = RJ_{eq}/K^2 = 40\ \text{ms}\). On prend \(h = 0{,}1\ \text{ms}\) et une durée de \(5\tau_m = 0{,}2\ \text{s}\), soit 2 000 pas.</li>
      <li><strong>Résultats</strong> : vitesse finale \(U/K = 240\ \text{rad/s}\), temps de réponse à 5 % de 118 ms (environ \(3\tau_m\)), courant maximal de 11,2 A, proche de \(U/R\) : au démarrage, le moteur est presque un court-circuit.</li>
      <li><strong>Pas trop grand</strong> : avec \(h = 1{,}5\ \text{ms}\), plus grand que \(\tau_e\), le calcul annonce un courant maximal de 18 A, faux (oscillation purement numérique) ; avec \(h = 2{,}5\ \text{ms}\), il diverge, alors que le moteur est stable.</li>
      <li><strong>Influence de l'inertie</strong> (masse transportée) : voir le tableau. Le temps de réponse et l'énergie perdue par effet Joule sont proportionnels à \(J_{eq}\) ; le courant maximal n'augmente presque pas. Pour \(J_{eq} = 4\cdot10^{-4}\ \text{kg·m}^2\), une durée de 0,2 s ne montrerait pas le régime permanent : la durée se règle sur le cas le plus lent du balayage (ici 1 s).</li>

      <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted)">\(t_{r5\%}\) (ms)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">58</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">118</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">238</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">477</td></tr>
      <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted)">\(i_{max}\) (A)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">10,8</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">11,2</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">11,5</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">11,7</td></tr>
      <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted)">Pertes Joule au démarrage (J)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">1,4</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">2,9</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">5,8</td><td style="padding:.35rem .5rem;border:1px solid var(--muted)">11,5</td></tr>
    </table></div>
    <p>Les pertes Joule du démarrage valent exactement l'énergie cinétique finale \(\frac12 J_{eq}\,\Omega^2\) : la source fournit \(U\!\int i\,\mathrm{d}t = J_{eq}\,\Omega^2\) (car \(K\!\int i\,\mathrm{d}t = J_{eq}\,\Omega\) et \(U = K\,\Omega\)), dont la moitié seulement est stockée. La simulation le retrouve à 1 % près.</p>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme</span>
    <span class="prompt">Euler explicite sur le vecteur d'état (courant, vitesse) et balayage de l'inertie.</span>
    <div class="content">
  <pre class="codeblock"><span class="kw">def</span> demarrage(J, h=1e-4, tf=1.0, U=12.0, R=1.0, L=1e-3, K=0.05):
    n = int(round(tf/h))
    i, w = 0.0, 0.0
    I, W = [i], [w]
    <span class="kw">for</span> _ <span class="kw">in</span> range(n):                     <span class="cmt"># Euler explicite</span>
        i, w = i + h*(U - K*w - R*i)/L, w + h*K*i/J
        I.append(i); W.append(w)
    <span class="kw">return</span> I, W

<span class="kw">for</span> J <span class="kw">in</span> [0.5e-4, 1e-4, 2e-4, 4e-4]:     <span class="cmt"># balayage du paramètre</span>
    I, W = demarrage(J)
    print(J, max(I))</pre>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · MODÉLISATION ACAUSALE</div>
  <h2>Composants à ports et liens de puissance</h2>
  <div class="intro">En modélisation acausale, on reconstitue le système pièce par pièce, comme si on le câblait : chaque constituant devient un composant, chaque liaison physique un lien entre ports. Personne ne décide qui est la cause et qui est l'effet : c'est le logiciel qui organise le calcul.</div>

  <h3>Composants et ports</h3>
  <div class="def-box"><strong>Composant acausal.</strong> Modèle d'un constituant physique (résistance, moteur, ressort, vérin, pompe, paroi…) défini par ses équations internes et ses paramètres, et muni de <strong>ports</strong> appartenant chacun à un domaine physique. Un <strong>lien acausal</strong> n'est pas orienté : il relie deux ports du même domaine et porte <strong>deux grandeurs</strong> dont le produit est la puissance échangée :
  $$\mathcal{P} = e\times f \qquad (\text{effort}\times\text{flux})$$</div>
  <p>Le signe de \(\mathcal{P}\) indique le sens de transfert de l'énergie à l'instant considéré : un même lien peut la transporter dans un sens puis dans l'autre (moteur qui retient une charge en descente).</p>

  <h3>Règles de connexion</h3>
  <div class="prop-box">Quand plusieurs ports sont reliés en un même nœud, le logiciel écrit automatiquement :
    <ul style="margin:.4rem 0">
      <li>l'<strong>égalité des grandeurs transversales</strong> (<em>across</em>) : potentiel électrique, vitesse, pression ou température commun(e) ;</li>
      <li>la <strong>conservation des grandeurs traversantes</strong> (<em>through</em>) : la somme des courants, des forces, des débits ou des flux thermiques entrant dans le nœud est nulle.</li>
    </ul>
    Ce sont les lois de Kirchhoff, généralisées à tous les domaines.</div>
  <div class="notice"><strong>Across/through n'est pas effort/flux.</strong> En électricité et en hydraulique, l'effort (tension, pression) est la grandeur transversale et le flux (courant, débit) la grandeur traversante. En mécanique, c'est l'inverse : la vitesse (flux) est commune aux ports reliés, et ce sont les forces (efforts) dont la somme est nulle. Les logiciels de type Modelica ou Simscape raisonnent en <em>across/through</em> ; le programme de PT raisonne en <em>effort/flux</em> : ne pas confondre les deux grilles.</div>

  <h3>Compatibilité des domaines</h3>
  <p>On ne relie que des ports de même nature. Tout changement de domaine passe par un composant de conversion :</p>
  <ul>
    <li>moteur électrique : électrique → rotation ;</li>
    <li>pignon-crémaillère, vis-écrou, poulie-courroie, tambour-câble : rotation ↔ translation ;</li>
    <li>pompe : rotation → hydraulique ; vérin : hydraulique → translation ;</li>
    <li>résistance chauffante : électrique → thermique.</li>
  </ul>
  <p>Entre le monde acausal et les signaux de la commande, deux interfaces : les <strong>sources pilotées</strong> (un signal impose une tension, un couple, une vitesse…) et les <strong>capteurs</strong> (une grandeur physique devient un signal). Les ports de signal ne transportent aucune puissance.</p>

  <h3>Références et sources</h3>
  <ul>
    <li>Une <strong>référence</strong> est indispensable dans chaque domaine : masse électrique, bâti fixe, réservoir à pression atmosphérique, température ambiante imposée.</li>
    <li>Une <strong>source d'effort</strong> impose l'effort quel que soit le flux demandé (alimentation de tension idéale, poids, couple résistant constant, pression de réseau) ; une <strong>source de flux</strong> impose le flux quel que soit l'effort (générateur de courant, vitesse imposée, pompe volumétrique idéale).</li>
  </ul>

  <h3>Résolution, atouts et limites</h3>
  <p>Le logiciel rassemble les équations de tous les composants et de toutes les connexions en un système d'équations différentielles et algébriques, le réorganise symboliquement pour décider lui-même de l'ordre de calcul, puis l'intègre avec un solveur capable de traiter de fortes non-linéarités (mécanismes à géométrie variable, frottements, saturations).</p>
  <ul>
    <li><strong>+</strong> L'architecture réelle est conservée : le modèle se lit comme le diagramme de blocs internes.</li>
    <li><strong>+</strong> Composants réutilisables, paramètres physiques (catalogues, CAO) ; on change un moteur sans réécrire une équation.</li>
    <li><strong>+</strong> Toutes les grandeurs physiques, donc toutes les puissances, sont disponibles en chaque lien.</li>
    <li><strong>−</strong> Simulation plus lourde ; fonction de transfert et Bode non immédiats ; conditions initiales à rendre cohérentes ; contenu des composants de bibliothèque moins maîtrisé.</li>
  </ul>
  <div class="notice">Les deux approches se combinent : un modèle global comporte souvent une partie <strong>acausale</strong> (la chaîne de puissance) et une partie <strong>causale</strong> (consigne, correcteur, logique de commande), reliées par des sources pilotées et des capteurs.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · EFFORT, FLUX ET ANALOGIES</div>
  <h2>Une même structure dans tous les domaines</h2>
  <div class="intro">Chaque domaine physique possède son couple (effort, flux) et trois composants passifs de base : un élément qui dissipe l'énergie, un élément qui stocke de l'énergie « potentielle », un élément qui stocke de l'énergie « cinétique ». Repérer ces analogies permet de transposer d'un domaine à l'autre tout ce que l'on sait du circuit RLC.</div>

  <h3>Couples effort/flux</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;min-width:480px">
    <tr><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Domaine</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Effort \(e\)</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Flux \(f\)</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Puissance</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Translation</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">force \(F\) (N)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">vitesse \(v\) (m/s)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(F\,v\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Rotation</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">couple \(C\) (N·m)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">vitesse angulaire \(\omega\) (rad/s)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(C\,\omega\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Électricité</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">tension \(u\) (V)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">courant \(i\) (A)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(u\,i\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Hydraulique</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">pression \(p\) (Pa)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">débit volumique \(Q_v\) (m³/s)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(p\,Q_v\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Pneumatique</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">pression \(p\) (Pa)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">débit massique \(q_m\) (kg/s), ou débit volumique \(Q_v\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(p\,Q_v\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Thermique</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">température \(T\) (K)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">flux d'entropie \(\dot S\) (W/K)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(T\,\dot S\)</td></tr>
  </table></div>
  <div class="notice"><strong>Pneumatique : l'air est compressible.</strong> Les logiciels décrivent souvent le débit d'air par un débit <em>massique</em> \(q_m\), parce que le débit volumique change avec la pression le long du circuit. Surtout, une chambre d'air se comporte comme un <strong>ressort</strong> : comprimer l'air d'un vérin fait monter sa pression. Le volume d'une chambre est donc un élément de stockage « potentiel » (comme l'accumulateur hydraulique), que l'on néglige souvent pour l'huile, presque incompressible, mais presque jamais pour l'air.</div>
  <div class="prop-box">
    <strong>Raideur d'une chambre de vérin.</strong> Pour une chambre de volume \(V\) et de section \(S\), sous la pression absolue \(p\), une petite évolution polytropique (\(pV^n\) constant) donne
    <div class="formula" data-nom="Raideur pneumatique">$$k = \frac{n\,p\,S^2}{V}$$</div>
    avec \(n = 1\) pour une évolution lente (isotherme) et \(n = \gamma = 1{,}4\) pour une évolution rapide (adiabatique). Pour une huile de module de compressibilité \(B\), le même calcul donne \(k = B\,S^2/V\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration et exemple</span>
    <span class="prompt">Raideur d'un vérin pneumatique Ø 50 mm comparée à celle d'un vérin hydraulique.</span>
    <div class="content">
      <p>En différentiant \(pV^n = \text{cste}\) : \(\mathrm{d}p/p = -n\,\mathrm{d}V/V\). Si la tige s'enfonce de \(\mathrm{d}x\) dans la chambre, \(\mathrm{d}V = -S\,\mathrm{d}x\) et l'effort de l'air sur le piston augmente de \(\mathrm{d}F = S\,\mathrm{d}p = (n\,p\,S^2/V)\,\mathrm{d}x\) : c'est la raideur annoncée.</p>
      <p>Vérin de diamètre 50 mm (\(S \approx 19{,}6\ \text{cm}^2\)), chambre longue de 10 cm (\(V \approx 196\ \text{cm}^3\)), sous 6 bar absolus : \(k \approx 11{,}8\ \text{N/mm}\) en isotherme, \(16{,}5\ \text{N/mm}\) en adiabatique. Avec une masse mobile de 10 kg, la pulsation propre \(\sqrt{k/m}\) correspond à 5,5 à 6,5 Hz : la charge « rebondit » sur son coussin d'air.</p>
      <p>Le même vérin rempli d'huile (\(B \approx 1{,}4\cdot10^9\ \text{Pa}\)) a une raideur \(k \approx 2{,}7\cdot10^7\ \text{N/m}\), environ 2 300 fois plus grande (fréquence propre voisine de 260 Hz). D'où l'usage : vérins pneumatiques pour des mouvements tout ou rien entre butées, vérins hydrauliques ou électriques pour un positionnement précis.</p>
    </div>
  </div>
  <div class="notice"><strong>Thermique : un « pseudo-couple ».</strong> Les logiciels utilisent le plus souvent la température \(T\) et le <em>flux thermique</em> \(\Phi\) (en W). Le produit \(T\,\Phi\) n'est alors pas une puissance : \(\Phi\) est déjà une puissance. Les lois de connexion restent valables (température commune, somme des flux nulle).</div>

  <h3>Composants passifs élémentaires</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;min-width:480px">
    <tr><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Rôle</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Électricité</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Translation</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Rotation</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Hydraulique</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top"><strong>Dissipation</strong> \(e = R\,f\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">résistance \(u = R\,i\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">amortisseur \(F = c\,v\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">frottement visqueux \(C = f_v\,\omega\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">perte de charge linéaire \(\Delta p = R_h\,Q_v\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top"><strong>Stockage « potentiel »</strong> \(f = C\,\dfrac{de}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">condensateur \(i = C\,\dfrac{du}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">ressort \(v = \dfrac{1}{k}\dfrac{dF}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">barre de torsion \(\omega = \dfrac{1}{k_\theta}\dfrac{dC}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">accumulateur \(Q_v = C_h\,\dfrac{dp}{dt}\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top"><strong>Stockage « cinétique »</strong> \(e = I\,\dfrac{df}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">inductance \(u = L\,\dfrac{di}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">masse \(F = m\,\dfrac{dv}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">inertie \(C = J\,\dfrac{d\omega}{dt}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">inertance \(\Delta p = I_h\,\dfrac{dQ_v}{dt}\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top"><strong>Énergie stockée</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(\tfrac12 C u^2\) ; \(\tfrac12 L i^2\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(\tfrac12 k x^2\) ; \(\tfrac12 m v^2\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(\tfrac12 k_\theta \theta^2\) ; \(\tfrac12 J\omega^2\)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">\(\tfrac12 C_h p^2\) ; \(\tfrac12 I_h Q_v^2\)</td></tr>
  </table></div>
  <p>Le coefficient de frottement visqueux en rotation est noté ici \(f_v\) pour ne pas le confondre avec le flux \(f\) (on le note souvent \(f\) dans le chapitre sur la MCC).</p>

  <h3>Analogie force–tension</h3>
  <div class="prop-box">En associant effort à effort et flux à flux : masse \(m\) ↔ inductance \(L\) ; raideur \(k\) ↔ inverse de la capacité \(1/C\) ; amortisseur \(c\) ↔ résistance \(R\) ; déplacement \(x\) ↔ charge \(q\). Des éléments mécaniques qui ont la <strong>même vitesse</strong> correspondent à des dipôles parcourus par le <strong>même courant</strong>, c'est-à-dire en série.
  $$m\ddot{x}+c\,\dot{x}+k\,x=F(t)\quad\longleftrightarrow$$
  $$L\ddot{q}+R\,\dot{q}+\frac{q}{C}=u(t)$$
  $$\omega_0=\sqrt{\frac{k}{m}}\ \leftrightarrow\ \frac{1}{\sqrt{LC}}$$
  $$\xi=\frac{c}{2\sqrt{k\,m}}\ \leftrightarrow\ \frac{R}{2}\sqrt{\frac{C}{L}}$$</div>

  <h3>Convertisseurs idéaux</h3>
  <ul>
    <li><strong>Transformateur</strong> : relie les efforts entre eux et les flux entre eux, sans perte. Réducteur : \(\omega_2 = k\,\omega_1\) et \(C_2 = C_1/k\) ; pignon-crémaillère : \(v = R_p\,\omega\) et \(F = C/R_p\) ; vérin : \(F = p\,S\) et \(Q_v = S\,v\).</li>
    <li><strong>Gyrateur</strong> : croise effort et flux. C'est le cas de la machine à courant continu : la f.é.m. (effort électrique) est proportionnelle à la vitesse (flux mécanique), le couple (effort mécanique) au courant (flux électrique).</li>
  </ul>
  <div class="formula">$$e = K\,\omega,\qquad C_m = K\,i$$ $$\Longrightarrow\quad e\,i = C_m\,\omega$$</div>
  <p>Dans les deux cas, la puissance qui entre est égale à la puissance qui sort ; les pertes sont apportées par des composants dissipatifs (résistance d'induit, frottements) ou par un rendement.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un vérin de section 12 cm² reçoit un débit de 0,6 L/min sous 80 bar. Vitesse de tige, effort développé, puissance ?</span>
    <div class="content"><p>Vérin : \(S = 12\ \text{cm}^2\), débit 0,6 L/min, pression 80 bar. \(Q_v = 0{,}6\cdot10^{-3}/60 = 1{,}0\cdot10^{-5}\ \text{m}^3/\text{s}\), d'où \(v = Q_v/S = 10^{-5}/1{,}2\cdot10^{-3} \approx 8{,}3\ \text{mm/s}\). Effort : \(F = p\,S = 8\cdot10^{6}\times1{,}2\cdot10^{-3} = 9\,600\ \text{N}\).</p>
    <p>Puissance : \(F\,v = p\,Q_v = 8\cdot10^{6}\times10^{-5} = 80\ \text{W}\). Le vérin idéal est un transformateur : il conserve la puissance.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · EXEMPLE : MOTORISATION D'UN CONVOYEUR</div>
  <h2>Un même système, deux modèles</h2>
  <div class="intro">Un convoyeur à bande est entraîné par un moteur à courant continu, alimenté par un variateur, à travers un réducteur et un rouleau moteur. On le modélise d'abord en causal, puis en acausal.</div>

  <h3>Hypothèses et notations</h3>
  <ul>
    <li>Induit de résistance \(R\) et d'inductance \(L\) ; constante de f.é.m. et de couple \(K\) ; inertie du rotor \(J_m\) ; frottement visqueux équivalent \(f_v\) sur l'arbre moteur.</li>
    <li>Réducteur de rapport \(k = \omega_r/\omega_m\) (\(k \lt 1\)), d'inertie négligée ; rouleau de rayon \(r\) ; bande et charges de masse totale \(M\), de vitesse \(v = r\,\omega_r = k\,r\,\omega_m\).</li>
    <li>Effort résistant \(F_r\) sur la bande (frottements, pente) ; transmission sans perte et sans glissement.</li>
  </ul>

  <h3>Réduction à l'arbre moteur</h3>
  <p>L'énergie cinétique de l'ensemble s'écrit avec la seule vitesse \(\omega_m\) :</p>
  <div class="formula">$$E_c=\frac12 J_m\,\omega_m^2+\frac12 M v^2$$ $$E_c=\frac12\underbrace{\left(J_m+M\,k^2r^2\right)}_{J_{eq}}\,\omega_m^2$$</div>
  <p>La puissance de l'effort résistant vaut \(-F_r\,v = -(k\,r\,F_r)\,\omega_m\) : tout se passe comme si un couple résistant \(C_{r,eq} = k\,r\,F_r\) s'exerçait sur l'arbre moteur. Le théorème de l'énergie cinétique donne alors l'équation mécanique.</p>

  <h3>Modèle causal</h3>
  <div class="formula">$$u = e + R\,i + L\frac{di}{dt}$$ $$e = K\,\omega_m,\qquad C_m = K\,i$$</div>

  <p>Pour \(C_{r,eq} = 0\), la formule de la boucle donne :</p>
  <div class="formula">$$\frac{\Omega_m(p)}{U(p)}=\frac{K}{(R+L\,p)(J_{eq}\,p+f_v)+K^2}$$</div>
  <div class="prop-box"><strong>Modèle réduit.</strong> Si la constante de temps électrique \(\tau_e = L/R\) est petite devant la constante de temps mécanique et si \(f_v\) est négligeable :
  $$\frac{\Omega_m(p)}{U(p)}\approx\frac{1/K}{1+\tau_m\,p}$$ $$\tau_m=\frac{R\,J_{eq}}{K^2}$$
  Ordres de grandeur pour un moteur de quelques dizaines de watts : \(R \approx 1\ \Omega\), \(L \approx 1\ \text{mH}\), \(K \approx 0{,}05\ \text{N·m/A}\), \(J_{eq} \approx 10^{-4}\ \text{kg·m}^2\) charge comprise, d'où \(\tau_e \approx 1\ \text{ms}\) et \(\tau_m \approx 40\ \text{ms}\).</div>

    <ul>
      <li>translation : \(\mathcal{P} = F_r\,v\) ;</li>
      <li>rotation (arbre moteur) : \(C_m\,\omega_m = (C_{r,eq} + f_v\,\omega_m)\,\omega_m\), soit \(F_r\,v + f_v\,\omega_m^2\) ;</li>

<div class="course-section">
  <div class="sec-num">§7 · CHOISIR, PARAMÉTRER, VALIDER</div>
  <h2>Un modèle au service d'un objectif</h2>
  <div class="intro">Il n'existe pas de modèle « vrai » d'un système, seulement des modèles adaptés ou non à une question. On choisit un modèle d'après ce que l'on veut prédire, puis on le valide en le confrontant à l'expérience.</div>

  <h3>Choisir le niveau de modèle</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;min-width:480px">
    <tr><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Objectif</th><th style="padding:.35rem .5rem;border:1px solid var(--muted);background:var(--paper-dark);text-align:left;vertical-align:top">Modèle adapté</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Régler un correcteur ; étudier stabilité, précision, bande passante</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">causal linéarisé (fonctions de transfert)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Dimensionner un actionneur (couple, courant, puissance crête)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">causal non linéaire ou acausal, avec observation des puissances</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Évaluer une consommation, une autonomie, un échauffement</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">acausal sur un cycle complet, avec rendements et pertes</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">Étudier un mécanisme dont la loi entrée-sortie n'est pas linéaire (came, bras articulé…)</td><td style="padding:.35rem .5rem;border:1px solid var(--muted);vertical-align:top">acausal multicorps, souvent importé de la CAO</td></tr>
  </table></div>

  <h3>Solide indéformable ou déformable ?</h3>
  <p>Le modèle de solide <strong>indéformable</strong> suffit tant que les déformations des pièces n'influencent ni le mouvement étudié ni les performances attendues. Deux situations imposent un modèle <strong>déformable</strong> :</p>
  <ul>
    <li>la performance cherchée est elle-même une déformation ou une contrainte (flèche d'un bras, raideur d'un bâti, tenue d'un arbre) : modèle de poutre (« Résistance des matériaux ») ou calcul par éléments finis ;</li>
    <li>une élasticité de la transmission (arbre long en torsion, courroie, accouplement élastique, câble, bras de robot élancé) crée un mode de vibration dont la fréquence approche la bande passante de la commande.</li>
  </ul>
  <div class="def-box">
    <strong>Modèle à deux inerties.</strong> Le moteur (inertie \(J_m\)) et la charge (inertie \(J_c\)) sont reliés par une raideur de torsion \(k_\theta\) (et un léger amortissement). Le mode élastique a pour pulsation propre
    <div class="formula" data-nom="Pulsation du mode élastique">$$\omega_r = \sqrt{k_\theta\,\frac{J_m+J_c}{J_m\,J_c}}$$</div>
    Vue de l'arbre moteur (là où se trouve souvent le capteur de vitesse), la transmission présente d'abord une <strong>antirésonance</strong> en \(\omega_a = \sqrt{k_\theta/J_c}\), puis la résonance en \(\omega_r\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pulsation propre du mode élastique.</span>
    <div class="content">
      <p>Sans couple extérieur ni amortissement, le PFD appliqué à chaque inertie donne \(J_m\ddot\theta_m = -k_\theta(\theta_m-\theta_c)\) et \(J_c\ddot\theta_c = k_\theta(\theta_m-\theta_c)\). En retranchant ces équations divisées par \(J_m\) et \(J_c\), l'angle de torsion \(\varphi = \theta_m - \theta_c\) vérifie</p>
      <div class="formula">$$\ddot\varphi + k_\theta\left(\frac{1}{J_m}+\frac{1}{J_c}\right)\varphi = 0$$</div>
      <p>C'est un oscillateur de pulsation \(\omega_r\). Le mouvement d'ensemble (\(J_m\theta_m + J_c\theta_c\)) n'est soumis à aucun couple : c'est le mode « rigide », seul pris en compte par le modèle indéformable.</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Critère.</strong> On garde le modèle de solide indéformable si la plus basse pulsation propre vue par la commande (ici \(\omega_a\)) est au moins <strong>5 à 10 fois</strong> supérieure à la pulsation de coupure \(\omega_{c0}\) de la boucle. Sinon, la résonance, peu amortie, relève le gain de la FTBO près de la coupure et peut déstabiliser la boucle : il faut un modèle déformable, et soit raidir la transmission, soit réduire la bande passante, soit filtrer la commande.
  </div>
  <div class="method-box">
    <strong>Exemple — arbre d'entraînement d'un plateau tournant</strong>
    <p>Moteur \(J_m = 2\cdot10^{-3}\ \text{kg·m}^2\), plateau \(J_c = 6\cdot10^{-3}\ \text{kg·m}^2\), reliés par un arbre en acier de diamètre 12 mm et de longueur 0,5 m (\(G = 80\ \text{GPa}\)).</p>
    <ol>
      <li>Raideur de torsion : \(I_0 = \pi d^4/32 \approx 2{,}04\cdot10^{-9}\ \text{m}^4\), \(k_\theta = G I_0/\ell \approx 326\ \text{N·m/rad}\).</li>
      <li>Pulsations, avec \(J_m + J_c = 8\cdot10^{-3}\) et \(J_mJ_c = 12\cdot10^{-6}\) (unités SI) : \(\omega_r \approx 466\ \text{rad/s}\) (74 Hz) et \(\omega_a \approx 233\ \text{rad/s}\) (37 Hz).</li>
      <li>Boucle de vitesse réglée à \(\omega_{c0} = 40\ \text{rad/s}\) : \(\omega_a/\omega_{c0} \approx 5{,}8\), le modèle rigide (\(J = J_m + J_c = 8\cdot10^{-3}\ \text{kg·m}^2\)) convient.</li>
      <li>Pour \(\omega_{c0} = 150\ \text{rad/s}\), le rapport tombe à 1,6 : le modèle doit inclure la raideur. Un arbre de 20 mm de diamètre et de 0,25 m de long multiplie \(k_\theta\) par 15 et \(\omega_a\) par 3,9 (environ 915 rad/s, rapport 6) : on retrouve un comportement rigide.</li>
    </ol>
  </div>

  <h3>Non-linéarités usuelles</h3>
  <ul>
    <li><strong>Saturation</strong> : une grandeur ne peut pas dépasser une limite (tension d'alimentation, courant maximal du variateur, course d'un vérin). Effet : pour un grand échelon, réponse plus lente que celle prévue par le modèle linéaire ; l'intégrateur d'un correcteur peut se « charger » exagérément (<em>windup</em>).</li>
    <li><strong>Frottement sec</strong> (Coulomb) : couple de valeur \(C_s\) opposé au mouvement, indépendant de la vitesse. Effet : seuil de démarrage, zone morte, erreur statique en position, broutement à basse vitesse.</li>
    <li><strong>Jeu</strong> (engrenage, liaison) : le mouvement n'est transmis qu'après rattrapage du jeu. Effet : imprécision de position, petites oscillations entretenues en boucle fermée.</li>
    <li><strong>Courbure</strong> : caractéristique qui n'est pas une droite (débit d'un orifice en \(\sqrt{\Delta p}\), couple aérodynamique en \(\omega^2\), rendement variable avec la charge). Effet : le gain du modèle linéarisé (§3) change avec le point de fonctionnement ; un réglage fait à un point peut ne plus convenir à un autre.</li>
    <li><strong>Seuil et hystérésis</strong> : zone morte d'un distributeur ou d'un variateur, thermostat qui bascule à deux températures différentes à la montée et à la descente. Effet : petite erreur permanente, ou oscillation entretenue (cycle limite) autour de la consigne.</li>
    <li><strong>Retard pur</strong> : transport de matière (bande, canalisation), temps de calcul et échantillonnage d'une commande numérique (« Systèmes numériques », §4). Il ne change pas le gain mais retire \(\omega\tau\) radians de phase : la marge de phase diminue d'autant à la coupure (chapitre « Stabilité » de 1ʳᵉ année).</li>
    <li>Autres : quantification d'un codeur, variation d'un paramètre avec la température (résistance d'un bobinage).</li>
  </ul>

  <h3>Valider un modèle</h3>
  <ol>
    <li>Simuler <strong>l'essai réellement réalisé</strong> : même entrée, mêmes conditions initiales, même charge.</li>
    <li>Superposer les courbes mesurée et simulée ; chiffrer les écarts sur des critères du cahier des charges (valeur finale, temps de réponse à 5 %, dépassement, courant maximal…).</li>
    <li>Chercher les causes : paramètre mal connu, phénomène négligé (frottement sec, élasticité, saturation, échauffement), instrumentation (filtrage, résolution du capteur).</li>
    <li>Recaler les paramètres incertains, puis valider sur <strong>un autre essai</strong> que celui qui a servi au recalage.</li>
  </ol>
  <div class="formula">$$\varepsilon_r = \frac{x_{sim}-x_{mes}}{x_{mes}}$$</div>
  <div class="notice">Un écart sur la <strong>valeur finale</strong> oriente vers un gain mal estimé ou une non-linéarité statique (frottement sec, saturation, rendement) ; un écart sur la <strong>forme du transitoire</strong> oriente vers une inertie, une constante de temps ou un élément négligé (inductance, élasticité, retard).</div>
</div>

  <div class="sec-num">MÉTHODES · MODÉLISATION MULTIPHYSIQUE</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Construire un modèle causal d'une chaîne de puissance</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Isoler chaque constituant et écrire ses équations : lois électriques, équation mécanique ramenée à un arbre (TEC ou PFD), relations de couplage (\(e = K\omega\), \(C_m = K i\)), relations cinématiques.</li>
      <li><span class="step">Étape 2.</span> Linéariser si nécessaire autour du point de fonctionnement, passer en variations (conditions de Heaviside), puis dans le domaine de Laplace.</li>
      <li><span class="step">Étape 3.</span> Orienter chaque équation de la cause vers l'effet en isolant la grandeur « intégrée » : \(I(p) = \dfrac{U(p)-E(p)}{R+Lp}\), \(\Omega(p) = \dfrac{C_m(p)-C_r(p)}{Jp+f_v}\).</li>
      <li><span class="step">Étape 4.</span> Chaîner les blocs : les perturbations (couple résistant, effort extérieur) entrent par un sommateur, les couplages (f.é.m.) forment des boucles internes.</li>
      <li><span class="step">Étape 5.</span> Contrôler chaque lien (une seule grandeur, une seule unité) et les signes des sommateurs.</li>
    </ol>
    <p><em>Piège</em> : obtenir une vitesse en dérivant une position (bloc \(p\) seul) ; préférer l'écriture intégrale, plus robuste en simulation.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Construire un modèle acausal</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Partir du diagramme de blocs internes (ou du schéma cinématique, électrique, hydraulique) et lister les constituants.</li>
      <li><span class="step">Étape 2.</span> Associer à chacun un composant de bibliothèque et repérer le domaine de chacun de ses ports.</li>
      <li><span class="step">Étape 3.</span> Ne relier que des ports de même domaine ; insérer un convertisseur à chaque changement de domaine.</li>
      <li><span class="step">Étape 4.</span> Placer les références (masse électrique, bâti, réservoir, ambiance) et les sources d'effort ou de flux ; interfacer la commande par des sources pilotées et des capteurs.</li>
      <li><span class="step">Étape 5.</span> Paramétrer (catalogue, CAO, essais), fixer des conditions initiales cohérentes, régler le solveur et la durée de simulation.</li>
    </ol>
    <p><em>Pièges</em> : oublier la masse électrique ou le bâti (système indéterminé) ; mettre en parallèle deux sources d'effort différentes, ou en série deux sources de flux (équations contradictoires) ; lier rigidement deux inerties lancées à des vitesses initiales différentes.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Identifier la nature des grandeurs d'un lien</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Le lien transporte-t-il de l'énergie ? Sinon, c'est un lien d'<strong>information</strong> : un signal (consigne, mesure, ordre) dont seule la valeur compte, la puissance qu'il met en jeu étant négligeable.</li>
      <li><span class="step">Étape 2.</span> Si oui, reconnaître le domaine : électrique, translation, rotation, hydraulique, thermique.</li>
      <li><span class="step">Étape 3.</span> Nommer l'effort (tension, force, couple, pression, température) et le flux (courant, vitesse, vitesse angulaire, débit, flux d'entropie).</li>
      <li><span class="step">Étape 4.</span> Contrôle : le produit effort × flux s'exprime en watts.</li>
    </ol>
    <p><em>Piège</em> : dans un schéma-blocs, un lien « couple » ou « vitesse » ne porte qu'une grandeur ; ce n'est pas un lien de puissance.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Ramener inerties et efforts sur l'arbre moteur</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Écrire les lois entrée-sortie : \(\omega_i = \lambda_i\,\omega_m\) pour les pièces en rotation, \(v_j = \mu_j\,\omega_m\) pour les pièces en translation.</li>
      <li><span class="step">Étape 2.</span> Égaler les énergies cinétiques : \(J_{eq} = \sum_i J_i\lambda_i^2 + \sum_j m_j\mu_j^2\).</li>
      <li><span class="step">Étape 3.</span> Égaler les puissances des actions extérieures : \(C_{r,eq} = \sum_i C_i\lambda_i + \sum_j F_j\mu_j\) (signes selon les sens).</li>
      <li><span class="step">Étape 4.</span> Avec un rendement \(\eta\) et un moteur entraînant, la puissance à fournir côté moteur est celle de la charge divisée par \(\eta\).</li>
      <li><span class="step">Étape 5.</span> Écrire le TEC : \(J_{eq}\,\dot\omega_m = C_m - C_{r,eq}\).</li>
    </ol>
    <p><em>Piège</em> : quand la charge devient entraînante (descente), le flux d'énergie s'inverse et le rendement multiplie au lieu de diviser.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Choisir un modèle adapté à l'objectif</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Formuler précisément la question : quelle grandeur, avec quelle précision, sur quel scénario.</li>
      <li><span class="step">Étape 2.</span> Repérer les phénomènes dominants sur ce scénario et négliger le reste en le justifiant par un ordre de grandeur (\(\tau_e \ll \tau_m\), inertie d'un réducteur devant celle du rotor…).</li>
      <li><span class="step">Étape 3.</span> Choisir : causal linéaire pour le réglage et la stabilité, causal non linéaire ou acausal pour le dimensionnement, l'énergie et les mécanismes.</li>
      <li><span class="step">Étape 4.</span> Prévoir les grandeurs à observer (capteurs virtuels, puissances aux liens).</li>
    </ol>
    <p><em>Piège</em> : un modèle linéaire ne prédit ni la limitation du courant au démarrage, ni le seuil dû au frottement sec.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Exploiter une courbe de simulation</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Découper la courbe en phases (démarrage, régime établi, perturbation, freinage) et associer un événement du scénario à chaque changement.</li>
      <li><span class="step">Étape 2.</span> Vérifier le régime établi par un calcul à la main (toutes les dérivées nulles).</li>
      <li><span class="step">Étape 3.</span> Relier les grandeurs : courant ↔ couple (\(C_m = K i\)), vitesse ↔ f.é.m. ; une puissance négative sur un lien signale un retour d'énergie vers la source.</li>
      <li><span class="step">Étape 4.</span> Repérer les signatures de non-linéarités : palier (saturation), démarrage retardé ou erreur résiduelle (frottement sec, seuil), oscillations entretenues (jeu, hystérésis), réponse simplement décalée dans le temps (retard pur : transport, calcul, échantillonnage).</li>
      <li><span class="step">Étape 5.</span> Conclure vis-à-vis du cahier des charges, valeurs chiffrées à l'appui.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Analyser l'écart entre réel et simulé</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Superposer les courbes et calculer l'écart relatif \(\varepsilon_r\) sur chaque critère.</li>
      <li><span class="step">Étape 2.</span> Classer l'écart : statique (valeur finale) ou dynamique (forme, rapidité, dépassement).</li>
      <li><span class="step">Étape 3.</span> Formuler une hypothèse physique (frottement sec, saturation, inertie sous-estimée, élasticité, rendement) et la tester en modifiant le modèle.</li>
      <li><span class="step">Étape 4.</span> Recaler, puis valider sur un essai différent.</li>
    </ol>
    <p><em>Piège</em> : ajuster un paramètre jusqu'à coller à un seul essai masque souvent un phénomène non modélisé.</p>
  </div>
  <div class="method-box">
    <strong>Méthode 8 — Identifier un modèle de comportement sur une réponse indicielle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Reconnaître l'allure : tangente non nulle à l'origine et aucun dépassement → premier ordre ; tangente horizontale à l'origine ou dépassement → deuxième ordre ; départ décalé dans le temps → retard pur à ajouter.</li>
      <li><span class="step">Étape 2.</span> Gain statique \(K = \Delta s_\infty/\Delta e\), calculé sur les <em>variations</em> autour du point de fonctionnement.</li>
      <li><span class="step">Étape 3.</span> Premier ordre : \(\tau\) = instant où la sortie atteint 63 % de sa variation finale ; contrôle \(t_{r5\%} \approx 3\tau\).</li>
      <li><span class="step">Étape 4.</span> Deuxième ordre avec dépassement : \(\xi\) tiré de \(D = e^{-\pi\xi/\sqrt{1-\xi^2}}\), soit \(\xi = \dfrac{-\ln D}{\sqrt{\pi^2 + \ln^2 D}}\) ; puis \(\omega_0\) tiré de la pseudo-période \(T_p = \dfrac{2\pi}{\omega_0\sqrt{1-\xi^2}}\).</li>
      <li><span class="step">Étape 5.</span> Superposer la réponse du modèle à l'essai, et retenir que le modèle ne vaut que dans le domaine exploré (amplitude, point de fonctionnement).</li>
    </ol>
    <p><em>Exemple éclair :</em> un échelon de 2 V fait varier une vitesse de 3 rad/s, avec un dépassement de 16 % et une pseudo-période de 0,5 s : \(K = 1{,}5\ \text{rad·s}^{-1}\text{·V}^{-1}\), \(\xi = 1{,}833/\sqrt{9{,}870 + 3{,}358} \approx 0{,}50\), \(\omega_0 = 2\pi/(0{,}5 \times 0{,}864) \approx 14{,}5\ \text{rad/s}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Préparer et exploiter une simulation</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Choisir les grandeurs observées : celles des critères du cahier des charges, plus les grandeurs internes qui dimensionnent ou limitent les constituants (courant, couple, tension de commande, pression, puissance).</li>
      <li><span class="step">Étape 2.</span> Fixer le scénario (entrées et conditions initiales de l'essai) et la durée : 3 à 5 fois la plus grande constante de temps, ou un cycle complet pour un bilan d'énergie ; pour un balayage, la régler sur le cas le plus lent.</li>
      <li><span class="step">Étape 3.</span> Régler le solveur : à pas fixe, \(h\) de l'ordre de \(\tau_{\min}/10\) ; pour un modèle raide, pas variable réglé par une tolérance, ou modèle réduit. Contrôle : diviser le pas par 2 ne doit plus changer les résultats.</li>
      <li><span class="step">Étape 4.</span> Étudier un paramètre à la fois (balayage) : tracer chaque performance en fonction du paramètre, repérer la plage qui respecte le cahier des charges, comparer les paramètres par leur sensibilité relative.</li>
    </ol>
    <p><em>Exemple éclair :</em> moteur à courant continu avec \(\tau_e = 1\ \text{ms}\) et \(\tau_m = 40\ \text{ms}\) : \(h = 0{,}1\ \text{ms}\) et une durée de \(5\tau_m = 0{,}2\ \text{s}\). Si l'on balaie l'inertie jusqu'à 4 fois sa valeur, \(\tau_m\) monte à 160 ms : simuler 1 s.</p>
    <p><em>Piège</em> : valider un réglage sur la seule courbe de sortie alors que le courant ou la tension de commande sature.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Décider si une transmission doit être modélisée déformable</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Évaluer la raideur : arbre en torsion \(k_\theta = GI_0/\ell\) avec \(I_0 = \pi d^4/32\) ; courroie ou accouplement élastique : documentation du constructeur.</li>
      <li><span class="step">Étape 2.</span> Calculer les pulsations du modèle à deux inerties : antirésonance vue du moteur \(\omega_a = \sqrt{k_\theta/J_c}\), résonance \(\omega_r = \sqrt{k_\theta\,(J_m+J_c)/(J_mJ_c)}\).</li>
      <li><span class="step">Étape 3.</span> Comparer à la coupure de la boucle : si \(\omega_a\) vaut au moins 5 à 10 fois \(\omega_{c0}\), garder le modèle rigide (inertie \(J_m + J_c\)) ; sinon, modèle à deux inerties et raideur.</li>
      <li><span class="step">Étape 4.</span> Remédier si besoin : raidir la transmission (\(k_\theta\) varie comme \(d^4/\ell\)), réduire la bande passante ou filtrer la commande.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(J_m = 1\cdot10^{-3}\ \text{kg·m}^2\), \(J_c = 4\cdot10^{-3}\ \text{kg·m}^2\), \(k_\theta = 100\ \text{N·m/rad}\) : \(\omega_a = \sqrt{100/(4\cdot10^{-3})} \approx 158\ \text{rad/s}\) et \(\omega_r \approx 354\ \text{rad/s}\). Pour une boucle à \(\omega_{c0} = 50\ \text{rad/s}\), le rapport ne vaut que 3,2 : il faut le modèle déformable.</p>
  </div>
</div>
