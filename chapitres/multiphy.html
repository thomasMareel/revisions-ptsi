<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Nature des liens d'un pont élévateur électro-hydraulique</h3>
  <div class="statement">Un pont élévateur d'atelier comprend : une batterie, un contacteur commandé par un automate, un moteur électrique, une pompe à engrenages, un distributeur, un vérin simple effet et le plateau qui soulève le véhicule. Un capteur de pression renseigne l'automate.</div>
  <div class="q"><strong>Q1.</strong> Répartir ces constituants entre chaîne d'information et chaîne de puissance, et associer à chacun une fonction générique.</div>
  <div class="q"><strong>Q2.</strong> Pour les liens batterie → moteur, moteur → pompe, pompe → vérin et vérin → plateau, donner l'effort, le flux et leurs unités. Quelle est la nature du lien automate → contacteur ?</div>
  <div class="q"><strong>Q3.</strong> Pendant la levée à vitesse constante, la pression dans le vérin vaut 120 bar et le débit 2 L/min ; la section du piston est \(S = 20\ \text{cm}^2\). Calculer la puissance hydraulique, la vitesse de la tige et l'effort développé, puis vérifier la cohérence.</div>
  <div class="q"><strong>Q4.</strong> La pompe, de rendement 0,8, tourne à 150 rad/s. Quel couple le moteur doit-il fournir ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaîne d'information : capteur de pression (acquérir), automate (traiter et communiquer les ordres). Chaîne de puissance : batterie (alimenter), contacteur et distributeur (distribuer, moduler), moteur (convertir électrique → mécanique), pompe (convertir mécanique → hydraulique), vérin (convertir hydraulique → translation), plateau (effecteur, agir sur le véhicule).</p>
    <p><strong>Q2.</strong> Batterie → moteur : tension \(u\) (V) et courant \(i\) (A). Moteur → pompe : couple \(C\) (N·m) et vitesse angulaire \(\omega\) (rad/s). Pompe → vérin : pression \(p\) (Pa) et débit \(Q_v\) (m³/s). Vérin → plateau : force \(F\) (N) et vitesse \(v\) (m/s). Le lien automate → contacteur est un lien d'<strong>information</strong> : il ne porte pas de puissance utile, seulement un ordre (tout ou rien).</p>
    <p><strong>Q3.</strong> \(p = 1{,}2\cdot10^{7}\ \text{Pa}\), \(Q_v = 2\cdot10^{-3}/60 = 3{,}33\cdot10^{-5}\ \text{m}^3/\text{s}\), donc \(\mathcal{P}_h = p\,Q_v = 400\ \text{W}\). Vitesse : \(v = Q_v/S\), soit \(v \approx 1{,}67\ \text{cm/s}\). Effort : \(F = p\,S = 1{,}2\cdot10^{7}\times2\cdot10^{-3} = 24\ \text{kN}\). Vérification : \(F\,v = 24\,000\times0{,}0167 = 400\ \text{W}\) : le vérin (supposé parfait) transmet la puissance sans la modifier.</p>
    <p><strong>Q4.</strong> Puissance mécanique absorbée par la pompe : \(400/0{,}8 = 500\ \text{W}\). Couple : \(C = 500/150 \approx 3{,}3\ \text{N·m}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Support antivibratoire et circuit analogue</h3>
  <div class="statement">Un appareil de mesure de masse \(m = 2\ \text{kg}\) repose sur un support assimilé à un ressort de raideur \(k = 800\ \text{N/m}\) en parallèle avec un amortisseur de coefficient \(c = 16\ \text{N·s/m}\). On note \(x\) son déplacement vertical autour de l'équilibre et \(F(t)\) une force perturbatrice.</div>
  <div class="q"><strong>Q1.</strong> Écrire l'équation du mouvement, puis la fonction de transfert \(X(p)/F(p)\) sous forme canonique. Calculer \(\omega_0\) et \(\xi\).</div>
  <div class="q"><strong>Q2.</strong> Proposer le circuit électrique analogue (analogie force–tension) : nature, association et valeurs des composants.</div>
  <div class="q"><strong>Q3.</strong> Retrouver \(\omega_0\) et \(\xi\) à partir du circuit.</div>
  <div class="q"><strong>Q4.</strong> À un instant donné, \(x = 1\ \text{cm}\) et \(\dot x = 0{,}2\ \text{m/s}\). Calculer les énergies stockées dans le ressort et dans la masse, et dans les composants analogues.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> PFD : \(m\ddot x = F - c\dot x - kx\), soit \(m\ddot x + c\dot x + kx = F\). Avec des conditions initiales nulles :</p>
    <div class="formula">$$\frac{X(p)}{F(p)} = \frac{1/k}{1+\dfrac{c}{k}\,p+\dfrac{m}{k}\,p^2}$$</div>
    <p>\(\omega_0 = \sqrt{k/m} = \sqrt{400} = 20\ \text{rad/s}\) ; \(\xi = \dfrac{c}{2\sqrt{km}} = \dfrac{16}{2\times40} = 0{,}2\) : système peu amorti, qui présente une résonance (\(\xi \lt 0{,}707\)) vers \(\omega_0\sqrt{1-2\xi^2} \approx 19{,}2\ \text{rad/s}\).</p>
    <p><strong>Q2.</strong> La masse, le ressort et l'amortisseur ont la même vitesse \(\dot x\) : leurs analogues sont parcourus par le même courant, donc placés <strong>en série</strong> avec une source de tension \(u \leftrightarrow F\). Inductance \(L = m = 2\ \text{H}\), résistance \(R = c = 16\ \Omega\), condensateur \(C = 1/k = 1{,}25\ \text{mF}\) ; la charge \(q\) joue le rôle de \(x\).</p>
    <p><strong>Q3.</strong> Avec \(L = 2\ \text{H}\), \(C = 1{,}25\ \text{mF}\) et \(R = 16\ \Omega\) :</p>
    <div class="formula">$$\omega_0 = \frac{1}{\sqrt{2\times1{,}25\cdot10^{-3}}} = 20\ \text{rad/s}$$ $$\xi = \frac{R}{2}\sqrt{\frac{C}{L}} = 8\times0{,}025 = 0{,}2$$</div>
    <p>Mêmes valeurs : les deux systèmes obéissent à la même équation.</p>
    <p><strong>Q4.</strong> Ressort : \(\tfrac12 kx^2 = 0{,}5\times800\times10^{-4} = 0{,}04\ \text{J}\) ; masse : \(\tfrac12 m\dot x^2 = 0{,}5\times2\times0{,}04 = 0{,}04\ \text{J}\). Analogues (\(q = 0{,}01\ \text{C}\), \(i = 0{,}2\ \text{A}\)) : condensateur \(q^2/(2C) = 10^{-4}/(2{,}5\cdot10^{-3}) = 0{,}04\ \text{J}\) ; inductance \(\tfrac12 Li^2 = 0{,}04\ \text{J}\). Le ressort et le condensateur stockent l'énergie « potentielle », la masse et l'inductance l'énergie « cinétique ».</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Réservoir tampon : linéarisation et conditions de Heaviside</h3>
  <div class="statement">Un réservoir cylindrique de section \(S = 0{,}5\ \text{m}^2\) reçoit un débit \(Q_e(t)\) et se vide par un orifice de fond. Le débit de sortie suit la loi \(Q_s = a\sqrt{h}\), avec \(a = 2{,}5\cdot10^{-3}\ \text{m}^{5/2}\text{/s}\) et \(h\) la hauteur d'eau. Le point de fonctionnement nominal est \(h_0 = 0{,}64\ \text{m}\).</div>
  <div class="q"><strong>Q1.</strong> Écrire l'équation de conservation du volume (eau incompressible).</div>
  <div class="q"><strong>Q2.</strong> Calculer le débit d'entrée \(Q_{e0}\) qui maintient \(h = h_0\).</div>
  <div class="q"><strong>Q3.</strong> Linéariser la loi de sortie autour de \(h_0\) sous la forme \(\Delta Q_s = \Delta h/R_h\). Exprimer et calculer \(R_h\).</div>
  <div class="q"><strong>Q4.</strong> En déduire la fonction de transfert \(\Delta H(p)/\Delta Q_e(p)\). Pourquoi raisonne-t-on sur des variations ? Calculer la constante de temps.</div>
  <div class="q"><strong>Q5.</strong> Le débit d'entrée augmente brusquement de 0,2 L/s. Comparer la variation finale de hauteur prévue par le modèle linéarisé à la valeur exacte. Conclure.</div>
  <div class="q"><strong>Q6.</strong> Interpréter le réservoir et l'orifice à l'aide des composants passifs élémentaires.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La variation du volume stocké est égale au débit entrant moins le débit sortant : \(S\,\dfrac{dh}{dt} = Q_e - a\sqrt{h}\). L'équation est non linéaire à cause de \(\sqrt{h}\).</p>
    <p><strong>Q2.</strong> À l'équilibre \(dh/dt = 0\) : \(Q_{e0} = a\sqrt{h_0}\), soit \(Q_{e0} = 2{,}5\cdot10^{-3}\times0{,}8 = 2\cdot10^{-3}\ \text{m}^3/\text{s}\) (2 L/s).</p>
    <p><strong>Q3.</strong> Tangente en \(h_0\) : \(\Delta Q_s \approx \dfrac{a}{2\sqrt{h_0}}\,\Delta h\), donc \(R_h = \dfrac{2\sqrt{h_0}}{a} = \dfrac{1{,}6}{2{,}5\cdot10^{-3}} = 640\ \text{s/m}^2\).</p>
    <p><strong>Q4.</strong> En variations : \(S\,\dfrac{d\Delta h}{dt} = \Delta Q_e - \dfrac{\Delta h}{R_h}\). Les variations sont nulles à l'instant initial (on part de l'équilibre) : les conditions de Heaviside sont respectées et la transformée de Laplace s'applique directement.</p>
    <div class="formula">$$\frac{\Delta H(p)}{\Delta Q_e(p)} = \frac{R_h}{1+R_h S\,p}$$ $$\tau = R_h S = 320\ \text{s}$$</div>
    <p><strong>Q5.</strong> Modèle linéarisé : \(\Delta h_\infty = R_h\,\Delta Q_e\), soit \(640\times2\cdot10^{-4} = 0{,}128\ \text{m}\). Valeur exacte : \(\sqrt{h_\infty} = (Q_{e0}+\Delta Q_e)/a = 0{,}88\), d'où \(h_\infty = 0{,}774\ \text{m}\) et \(\Delta h_\infty = 0{,}134\ \text{m}\). Écart relatif d'environ 5 % pour une variation de débit de 10 % : le modèle linéarisé reste acceptable pour de petites variations, mais se dégrade quand on s'éloigne de \(h_0\).</p>
    <p><strong>Q6.</strong> La pression au fond, \(p = \rho g h\), est l'effort et le débit le flux. Le réservoir stocke de l'énergie potentielle : c'est une <strong>capacité hydraulique</strong> (\(Q_v = C_h\,dp/dt\) avec \(C_h = S/(\rho g)\)), analogue d'un condensateur. L'orifice dissipe : c'est une <strong>résistance hydraulique</strong>, non linéaire, que la linéarisation remplace par \(R_p = \Delta p/\Delta Q_s = \rho g\,R_h \approx 6{,}3\cdot10^{6}\ \text{Pa·s/m}^3\) (le \(R_h\) de Q3, en s/m², relie hauteur et débit ; \(R_p\) relie pression et débit, comme dans le tableau du cours). L'ensemble est l'analogue d'un circuit RC alimenté par une source de courant, de constante de temps \(\tau = R_p\,C_h = R_h S = 320\ \text{s}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Modèle causal d'une motorisation à courant continu</h3>
  <div class="statement">Un moteur à courant continu entraîne une charge. Données : \(R = 2\ \Omega\), \(L = 0{,}8\ \text{mH}\), \(K = 0{,}04\ \text{N·m/A}\) (et V·s/rad), inertie totale ramenée sur l'arbre \(J = 4\cdot10^{-5}\ \text{kg·m}^2\). Les frottements visqueux sont négligés ; \(C_r\) désigne le couple résistant ramené sur l'arbre.</div>
  <div class="q"><strong>Q1.</strong> Écrire les équations du moteur et en déduire le schéma-blocs d'entrées \(U(p)\) et \(C_r(p)\), de sortie \(\Omega(p)\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(C_r = 0\), établir \(\Omega(p)/U(p)\) et la mettre sous la forme \(\dfrac{K_m}{1+\tau_m p+\tau_e\tau_m p^2}\). Calculer \(\tau_e\), \(\tau_m\) et le coefficient d'amortissement.</div>
  <div class="q"><strong>Q3.</strong> Justifier un modèle du premier ordre et donner ses paramètres.</div>
  <div class="q"><strong>Q4.</strong> On applique un échelon de 12 V à vide. Donner la vitesse finale, le temps de réponse à 5 % et l'ordre de grandeur du courant et du couple au démarrage.</div>
  <div class="q"><strong>Q5.</strong> À tension constante, on applique un couple résistant de 0,02 N·m. De combien la vitesse établie chute-t-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u = e + Ri + L\,di/dt\), \(e = K\omega\), \(C_m = Ki\), \(J\,d\omega/dt = C_m - C_r\). En Laplace : \(I(p) = \dfrac{U(p)-E(p)}{R+Lp}\), \(C_m = K\,I\), \(\Omega(p) = \dfrac{C_m(p)-C_r(p)}{Jp}\), \(E = K\,\Omega\). Schéma : \(U\) → sommateur (\(-E\)) → \(\dfrac{1}{R+Lp}\) → \(K\) → sommateur (\(-C_r\)) → \(\dfrac{1}{Jp}\) → \(\Omega\), avec un retour \(K\) de \(\Omega\) vers le premier sommateur.</p>
    <p><strong>Q2.</strong> Formule de la boucle : \(\dfrac{\Omega}{U} = \dfrac{K}{(R+Lp)Jp + K^2}\). En divisant par \(K^2\) :</p>
    <div class="formula">$$\frac{\Omega(p)}{U(p)} = \frac{1/K}{1+\dfrac{RJ}{K^2}\,p+\dfrac{LJ}{K^2}\,p^2}$$</div>
    <p>\(K_m = 1/K = 25\ \text{rad·s}^{-1}\text{·V}^{-1}\) ; \(\tau_m = RJ/K^2 = 50\ \text{ms}\) ; \(\tau_e = L/R = 0{,}4\ \text{ms}\) (on vérifie que \(\tau_e\tau_m = LJ/K^2\)). Par identification, \(2\xi/\omega_0 = \tau_m\) et \(1/\omega_0^2 = \tau_e\tau_m\), d'où \(\xi = \tfrac12\sqrt{\tau_m/\tau_e} = \tfrac12\sqrt{125} \approx 5{,}6\).</p>
    <p><strong>Q3.</strong> \(\xi \gg 1\) : les deux pôles sont réels et très éloignés, \(p_1 \approx -1/\tau_m = -20\ \text{s}^{-1}\) et \(p_2 \approx -1/\tau_e = -2\,500\ \text{s}^{-1}\). Le pôle rapide n'influe que pendant une fraction de milliseconde : on le néglige (\(L \approx 0\)) et \(\dfrac{\Omega}{U} \approx \dfrac{25}{1+0{,}05\,p}\).</p>
    <p><strong>Q4.</strong> \(\omega_\infty = 25\times12 = 300\ \text{rad/s}\) (≈ 2 900 tr/min) ; \(t_{5\%} \approx 3\tau_m = 0{,}15\ \text{s}\). Au démarrage, \(e = 0\) : le courant monte en quelques \(\tau_e\) vers \(U/R = 6\ \text{A}\), soit un couple d'environ \(K\times6 = 0{,}24\ \text{N·m}\), puis décroît à mesure que la f.é.m. s'établit.</p>
    <p><strong>Q5.</strong> En régime établi : \(K i = C_r\) et \(U = K\omega + Ri\), d'où \(\omega = \dfrac{U}{K} - \dfrac{R\,C_r}{K^2}\). Chute : \(\dfrac{2\times0{,}02}{1{,}6\cdot10^{-3}} = 25\ \text{rad/s}\) ; la vitesse passe de 300 à 275 rad/s.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Axe linéaire à vis à billes : grandeurs ramenées</h3>
  <div class="statement">Un axe de machine-outil est entraîné par un moteur (inertie \(J_m = 5\cdot10^{-5}\ \text{kg·m}^2\), constante de couple \(K = 0{,}1\ \text{N·m/A}\)), une transmission poulie-courroie de rapport \(k = 1/2\) (\(\omega_{vis} = k\,\omega_m\)), puis une vis à billes de pas \(p_v = 20\ \text{mm}\) (inertie de la vis et de sa poulie \(J_v = 1\cdot10^{-5}\ \text{kg·m}^2\)). Le chariot a une masse \(M = 20\ \text{kg}\) et subit un effort d'usinage \(F_r = 150\ \text{N}\). Le rendement global de la transmission (courroie et vis) vaut \(\eta = 0{,}9\) ; le moteur est entraînant.</div>
  <div class="q"><strong>Q1.</strong> Exprimer la vitesse du chariot \(v\) en fonction de \(\omega_m\) : \(v = \lambda\,\omega_m\). Calculer \(\lambda\).</div>
  <div class="q"><strong>Q2.</strong> Calculer l'inertie équivalente ramenée sur l'arbre moteur sans tenir compte des pertes. Commenter la part de chaque élément.</div>
  <div class="q"><strong>Q3.</strong> Le chariot accélère à \(a = 3\ \text{m/s}^2\) tout en subissant \(F_r\). Calculer le couple moteur nécessaire, pertes comprises, et le courant correspondant.</div>
  <div class="q"><strong>Q4.</strong> La vitesse maximale du chariot est 0,4 m/s. Calculer la vitesse de rotation du moteur et la puissance mécanique crête à la fin de l'accélération.</div>
  <div class="q"><strong>Q5.</strong> Quels composants faudrait-il assembler pour construire le modèle acausal de cet axe ? Qu'est-ce qui disparaît par rapport à l'approche des questions précédentes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Un tour de vis fait avancer le chariot d'un pas : \(v = \dfrac{p_v}{2\pi}\,\omega_{vis} = \dfrac{k\,p_v}{2\pi}\,\omega_m\), donc \(\lambda = \dfrac{0{,}5\times0{,}02}{2\pi} = 1{,}59\cdot10^{-3}\ \text{m/rad}\).</p>
    <p><strong>Q2.</strong> Égalité des énergies cinétiques :</p>
    <div class="formula">$$J_{eq} = J_m + k^2 J_v + M\lambda^2$$ $$J_{eq} \approx (5 + 0{,}25 + 5{,}07)\cdot10^{-5}$$ $$J_{eq} \approx 1{,}03\cdot10^{-4}\ \text{kg·m}^2$$</div>
    <p>Le chariot ramené pèse autant que le rotor : l'inertie de charge est « adaptée » à celle du moteur, situation favorable pour accélérer. La vis, tournant deux fois moins vite que le moteur, ne compte que pour le quart de son inertie propre, soit 2 % du total.</p>
    <p><strong>Q3.</strong> \(\dot\omega_m = a/\lambda = 3/1{,}59\cdot10^{-3} \approx 1\,885\ \text{rad/s}^2\). Le moteur accélère son rotor et fournit à la transmission la puissance utile divisée par \(\eta\) :</p>
    <div class="formula">$$C_m = J_m\dot\omega_m + \frac{k^2J_v\,\dot\omega_m + \lambda\,(M a + F_r)}{\eta}$$</div>
    <p>\(J_m\dot\omega_m = 0{,}094\ \text{N·m}\) ; numérateur : \(0{,}0047 + 1{,}59\cdot10^{-3}\times210\), soit \(0{,}339\ \text{N·m}\), qui divisé par 0,9 donne \(0{,}377\ \text{N·m}\). D'où \(C_m \approx 0{,}47\ \text{N·m}\) et \(i = C_m/K \approx 4{,}7\ \text{A}\). (Diviser par le rendement global le terme d'inertie de la vis, que seule la courroie précède, le majore un peu : l'effet est négligeable ici.)</p>
    <p><strong>Q4.</strong> \(\omega_m = v/\lambda = 0{,}4/1{,}59\cdot10^{-3} \approx 251\ \text{rad/s}\), soit 2 400 tr/min. Puissance crête : \(C_m\,\omega_m \approx 0{,}47\times251 \approx 118\ \text{W}\).</p>
    <p><strong>Q5.</strong> Source de tension pilotée, MCC, inertie du rotor (souvent incluse dans la MCC), poulie-courroie idéale (transformateur rotation → rotation, rapport \(k\)), inertie \(J_v\), vis-écrou (transformateur rotation → translation, pas \(p_v\), rendement), masse \(M\), source d'effort \(F_r\), bâti et masse électrique. Les grandeurs ramenées \(J_{eq}\) et \(C_{r,eq}\) disparaissent : le logiciel les prend en compte implicitement, et l'on peut lire la puissance sur chaque lien.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Chauffage d'un local régulé par thermostat</h3>
  <div class="statement">Un local est chauffé par un convecteur électrique de puissance \(P = 1{,}5\ \text{kW}\), commandé en tout-ou-rien par un thermostat. La capacité thermique du local (air, mobilier, cloisons) vaut \(C_{th} = 2\cdot10^{6}\ \text{J/K}\) ; les pertes à travers les parois sont modélisées par une conductance \(G = 50\ \text{W/K}\) vers l'extérieur, à \(T_{ext} = 5\ °\text{C}\) constante. Le thermostat coupe le chauffage à 20 °C et le rallume à 18 °C.</div>
  <div class="q"><strong>Q1.</strong> Lister les composants d'un modèle acausal de ce système et préciser la nature de chaque lien.</div>
  <div class="q"><strong>Q2.</strong> Établir l'équation différentielle vérifiée par la température intérieure \(T\) quand le convecteur fonctionne. Donner la constante de temps.</div>
  <div class="q"><strong>Q3.</strong> Dessiner (décrire) le circuit électrique analogue.</div>
  <div class="q"><strong>Q4.</strong> Si le convecteur fonctionnait en permanence, quelle température atteindrait le local ?</div>
  <div class="q"><strong>Q5.</strong> Calculer la durée d'une phase de chauffe (18 → 20 °C), celle d'une phase de refroidissement (20 → 18 °C), puis la puissance moyenne consommée. Vérifier ce dernier résultat par un raisonnement direct.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Source de tension (réseau) et interrupteur commandé : liens électriques \((u, i)\). Résistance chauffante : port électrique et port thermique (convertisseur électrique → thermique). Capacité thermique du local, conductance des parois, source de température \(T_{ext}\) : liens thermiques (température, flux thermique). Capteur de température : il transforme la température en <strong>signal</strong>, traité par le thermostat, bloc causal à <strong>hystérésis</strong> qui commande l'interrupteur. Remarque : le couple (température, flux thermique) est un pseudo-couple, son produit n'est pas une puissance.</p>
    <p><strong>Q2.</strong> Bilan d'énergie sur le local pendant \(dt\) : \(C_{th}\,\dfrac{dT}{dt} = P - G\,(T - T_{ext})\), soit</p>
    <div class="formula">$$\tau\,\frac{dT}{dt} + T = T_{ext} + \frac{P}{G}$$ $$\tau = \frac{C_{th}}{G} = 4\cdot10^{4}\ \text{s} \approx 11\ \text{h}$$</div>
    <p><strong>Q3.</strong> Température ↔ potentiel, flux thermique ↔ courant. Un nœud de potentiel \(T\) est relié : à la masse par un condensateur \(C_{th}\) ; à une source de tension \(T_{ext}\) (référencée à la masse) par une résistance \(1/G\) ; à une source de courant \(P\), coupée ou non par le thermostat, qui l'alimente.</p>
    <p><strong>Q4.</strong> Régime permanent : \(T_\infty = T_{ext} + P/G = 5 + 30 = 35\ °\text{C}\).</p>
    <p><strong>Q5.</strong> Chauffe : \(T\) tend vers 35 °C avec la constante \(\tau\) ; refroidissement (\(P = 0\)) : \(T\) tend vers 5 °C. D'où</p>
    <div class="formula">$$t_{on} = \tau\ln\frac{35-18}{35-20} \approx 5\,000\ \text{s}$$ $$t_{off} = \tau\ln\frac{20-5}{18-5} \approx 5\,700\ \text{s}$$</div>
    <p>soit environ 1 h 23 min de chauffe et 1 h 35 min de refroidissement. Rapport cyclique \(\alpha = t_{on}/(t_{on}+t_{off}) \approx 0{,}47\) et puissance moyenne \(\alpha P \approx 700\ \text{W}\). Vérification : en moyenne \(T \approx 19\ °\text{C}\) et le chauffage compense les pertes, \(G\,(19-5) = 700\ \text{W}\). Le modèle linéaire seul ne donnerait pas ce fonctionnement cyclique : il faut la non-linéarité du thermostat.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Positionnement d'une vanne motorisée : frottement sec et saturation</h3>
  <div class="statement">Une vanne quart de tour est positionnée par un moteur à courant continu (\(R = 2\ \Omega\), \(K = 0{,}04\ \text{N·m/A}\), inertie ramenée \(J = 4\cdot10^{-5}\ \text{kg·m}^2\), inductance et frottement visqueux négligés) suivi d'un réducteur de rapport \(k = 1/50\). L'angle de la vanne \(\theta\) est mesuré, et la commande élabore la tension \(u = K_a\,(\theta_c - \theta)\) avec \(K_a = 20\ \text{V/rad}\). L'alimentation limite \(u\) à \(\pm12\ \text{V}\). Le modèle « idéal » ignore cette limite et les frottements.</div>
  <div class="q"><strong>Q1.</strong> Avec le modèle idéal, établir la FTBO et la FTBF. Préciser la classe, l'erreur statique pour un échelon, \(\omega_0\) et \(\xi\) en boucle fermée.</div>
  <div class="q"><strong>Q2.</strong> Les essais montrent une erreur résiduelle de position d'environ 2° qui varie d'un essai à l'autre. On soupçonne un frottement sec, de couple \(C_s = 0{,}016\ \text{N·m}\) ramené sur l'arbre moteur. Montrer que la vanne peut s'arrêter dans toute une bande d'erreur, et calculer sa largeur.</div>
  <div class="q"><strong>Q3.</strong> Pour quelle amplitude d'erreur la tension sature-t-elle ? Pour une consigne de 90°, estimer la vitesse de la vanne pendant la phase saturée et la durée de cette phase. Le temps de réponse prévu par le modèle idéal est-il crédible ?</div>
  <div class="q"><strong>Q4.</strong> On propose de porter \(K_a\) à 80 V/rad. Effets sur l'erreur résiduelle et sur l'amortissement ? Citer une autre solution.</div>
  <div class="q"><strong>Q5.</strong> Pour la consigne de 90°, le modèle enrichi (frottement sec et saturation) donne un temps de réponse à 5 % de 0,36 s et une erreur finale de 0,2° ; l'essai donne 0,41 s et 1,8°. Chiffrer l'écart sur le temps de réponse. L'écart sur l'erreur finale suffit-il à rejeter le modèle ? Proposer une démarche d'amélioration.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Moteur : \(\dfrac{\Omega_m}{U} = \dfrac{1/K}{1+\tau_m p}\) avec \(\tau_m = RJ/K^2 = 50\ \text{ms}\) ; vanne : \(\Theta = k\,\Omega_m/p\). D'où</p>
    <div class="formula">$$\text{FTBO} = \frac{K_a\,k/K}{p\,(1+\tau_m p)} = \frac{10}{p\,(1+0{,}05\,p)}$$ $$\text{FTBF} = \frac{1}{1+0{,}1\,p+0{,}005\,p^2}$$</div>
    <p>Classe 1 : erreur statique nulle pour un échelon. \(\omega_0 = \sqrt{200} \approx 14{,}1\ \text{rad/s}\) et \(2\xi/\omega_0 = 0{,}1\), soit \(\xi \approx 0{,}71\) ; temps de réponse à 5 % \(\approx 3/\omega_0 \approx 0{,}21\ \text{s}\).</p>
    <p><strong>Q2.</strong> À l'arrêt, \(e = 0\) et \(i = u/R = K_a\varepsilon/R\), d'où un couple moteur \(C_m = K K_a\,\varepsilon/R\). Le moteur ne repart que si \(C_m\) dépasse \(C_s\) ; il peut donc rester immobile pour toute erreur telle que</p>
    <div class="formula">$$|\varepsilon| \le \frac{R\,C_s}{K\,K_a} = 0{,}04\ \text{rad} \approx 2{,}3°$$</div>
    <p>La bande d'arrêt s'étend donc de −2,3° à +2,3° autour de la consigne : largeur totale 0,08 rad, soit environ 4,6°. La position d'arrêt dans cette bande dépend de la manière dont la vanne approche la consigne : d'où une erreur comprise entre 0 et 2,3° en valeur absolue, qui change d'un essai à l'autre, cohérente avec les 2° mesurés. Le modèle idéal ne pouvait pas la prévoir.</p>
    <p><strong>Q3.</strong> Saturation dès que \(K_a|\varepsilon| \gt 12\ \text{V}\), soit \(|\varepsilon| \gt 0{,}6\ \text{rad}\) (34°). Pour 90° (1,57 rad), la tension reste à 12 V tant que l'erreur dépasse 0,6 rad : le moteur tend vers \(\omega_m \approx 12/K = 300\ \text{rad/s}\) (un peu moins à cause de \(C_s\)), soit une vanne à \(k\,\omega_m \approx 6\ \text{rad/s}\). Durée de la phase saturée : environ \((1{,}57-0{,}6)/6 \approx 0{,}16\ \text{s}\), plus un retard de l'ordre de \(\tau_m\) dû à la mise en vitesse, soit à peu près 0,2 s. Le modèle linéaire prévoit \(0{,}21\ \text{s}\) quelle que soit l'amplitude ; en réalité la phase saturée s'ajoute à la phase linéaire finale : le temps de réponse sera nettement plus long (une simulation avec saturation donne environ 0,33 s, et 0,36 s en ajoutant le frottement sec).</p>
    <p><strong>Q4.</strong> La bande d'arrêt est inversement proportionnelle à \(K_a\) : elle tombe à 0,01 rad (0,6°). Mais la FTBO devient \(40/[p(1+0{,}05p)]\) : \(\omega_0 = \sqrt{800} \approx 28{,}3\ \text{rad/s}\) et \(\xi = \dfrac{\omega_0}{2\times40} \approx 0{,}35\), soit un dépassement d'environ 30 % en régime linéaire, c'est-à-dire pour de petites consignes (la tension sature désormais dès 0,15 rad d'erreur). Autres solutions : correcteur à action intégrale (qui force le moteur à sortir de la zone morte, au risque d'un cycle limite de petite amplitude) ou compensation du frottement par anticipation (ajout d'une tension \(\pm R\,C_s/K\) selon le sens du mouvement souhaité).</p>
    <p><strong>Q5.</strong> Temps de réponse : \((0{,}36-0{,}41)/0{,}41 \approx -12\ \%\). Le modèle est un peu trop rapide : inertie sous-estimée (pièces de la vanne, accouplement), frottement visqueux négligé ou limitation de courant du variateur. Erreur finale : 0,2° et 1,8° sont toutes deux dans la bande d'arrêt ±2,3° de Q2. Avec un frottement sec, le point d'arrêt dans cette bande dépend finement de l'approche (vitesse d'arrivée, adhérence plus forte que le frottement de glissement, jeu du réducteur) : une seule valeur ne suffit ni à valider ni à rejeter le modèle. On compare plutôt la dispersion des arrêts sur plusieurs essais à la largeur de bande prévue (le même modèle prévoit d'ailleurs un arrêt vers 2° pour une consigne de 10°). On recale enfin les paramètres dynamiques sur cet essai, puis on valide sur une consigne d'amplitude différente.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Enrouleuse : faut-il modéliser l'accouplement élastique ?</h3>
  <div class="statement">Le moteur d'une enrouleuse de film (inertie \(J_m = 3\cdot10^{-4}\ \text{kg·m}^2\)) entraîne le mandrin (inertie \(J_c = 1{,}2\cdot10^{-3}\ \text{kg·m}^2\), réducteur compris) par un accouplement élastique de raideur de torsion \(k_\theta = 60\ \text{N·m/rad}\) ; amortissement et frottements sont négligés. La vitesse est asservie à partir d'un codeur monté sur l'arbre moteur ; \(C_m\) est le couple moteur, \(\theta_m\) et \(\theta_c\) les angles du moteur et du mandrin.</div>
  <div class="q"><strong>Q1.</strong> Appliquer le principe fondamental de la dynamique à chaque inertie. En déduire l'équation de l'angle de torsion \(\varphi = \theta_m - \theta_c\) pour \(C_m = 0\), et la pulsation propre \(\omega_r\) du mode élastique.</div>
  <div class="q"><strong>Q2.</strong> Montrer que, conditions initiales nulles,
    <div class="formula">$$\frac{\Omega_m(p)}{C_m(p)} = \frac{J_cp^2 + k_\theta}{p\,\big[J_mJ_cp^2 + k_\theta(J_m+J_c)\big]}$$</div>
    Interpréter les racines du numérateur et du dénominateur, et le comportement en basses pulsations.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\omega_a\) et \(\omega_r\) (en rad/s et en Hz). La boucle de vitesse coupe à \(\omega_{c0} = 30\ \text{rad/s}\) : le modèle de solide indéformable convient-il ?</div>
  <div class="q"><strong>Q4.</strong> Pour accélérer la production, on veut porter \(\omega_{c0}\) à 100 rad/s. Conclure. Quelle raideur faudrait-il pour retrouver un rapport \(\omega_a/\omega_{c0}\) de 8 ? Citer deux autres solutions.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'accouplement exerce sur le mandrin le couple \(k_\theta(\theta_m - \theta_c)\) et, sur le moteur, son opposé : \(J_m\ddot\theta_m = C_m - k_\theta(\theta_m - \theta_c)\) et \(J_c\ddot\theta_c = k_\theta(\theta_m - \theta_c)\). Pour \(C_m = 0\), en divisant par \(J_m\) et \(J_c\) puis en retranchant :</p>
    <div class="formula">$$\ddot\varphi + k_\theta\left(\frac{1}{J_m} + \frac{1}{J_c}\right)\varphi = 0,\qquad \omega_r = \sqrt{k_\theta\,\frac{J_m + J_c}{J_mJ_c}}$$</div>
    <p><strong>Q2.</strong> En Laplace, la seconde équation donne \(\Theta_c = \dfrac{k_\theta}{J_cp^2 + k_\theta}\,\Theta_m\). En reportant dans la première, \(\big[J_mp^2 + k_\theta - \frac{k_\theta^2}{J_cp^2 + k_\theta}\big]\Theta_m = C_m\), soit, après réduction au même dénominateur, \(\Theta_m\,\dfrac{p^2\big[J_mJ_cp^2 + k_\theta(J_m + J_c)\big]}{J_cp^2 + k_\theta} = C_m\). Avec \(\Omega_m = p\,\Theta_m\), on obtient l'expression annoncée. Le numérateur s'annule pour \(p = \pm j\omega_a\), \(\omega_a = \sqrt{k_\theta/J_c}\) : antirésonance vue du moteur (le mandrin oscille alors seul et le moteur reste immobile). Le dénominateur s'annule pour \(p = 0\) (intégrateur du mouvement d'ensemble) et \(p = \pm j\omega_r\) : résonance. En basses pulsations (\(p \to 0\)), le rapport tend vers \(\dfrac{1}{(J_m + J_c)\,p}\) : on retrouve le modèle rigide d'inertie \(J_m + J_c = 1{,}5\cdot10^{-3}\ \text{kg·m}^2\).</p>
    <p><strong>Q3.</strong> Avec \(J_m + J_c = 1{,}5\cdot10^{-3}\) et \(J_mJ_c = 3{,}6\cdot10^{-7}\) (unités SI) :</p>
    <div class="formula">$$\omega_a = \sqrt{\frac{60}{1{,}2\cdot10^{-3}}} \approx 224\ \text{rad/s},\qquad \omega_r = \sqrt{\frac{60 \times 1{,}5\cdot10^{-3}}{3{,}6\cdot10^{-7}}} = 500\ \text{rad/s}$$</div>
    <p>soit 35,6 Hz et 79,6 Hz. Rapport \(\omega_a/\omega_{c0} \approx 7{,}5\), compris entre 5 et 10 : le modèle rigide convient pour régler la boucle, en restant attentif au mode élastique lors de la validation.</p>
    <p><strong>Q4.</strong> Le rapport tombe à 2,2 : la résonance, très peu amortie, relève le gain de la FTBO près de la coupure et peut déstabiliser la boucle ; le modèle rigide n'est plus fiable, il faut le modèle à deux inerties. Pour \(\omega_a \geq 8 \times 100 = 800\ \text{rad/s}\), il faut \(k_\theta \geq 800^2 \times 1{,}2\cdot10^{-3} \approx 770\ \text{N·m/rad}\), près de 13 fois plus raide (accouplement rigide, arbre plus court ou plus gros : \(k_\theta\) varie comme \(d^4/\ell\)). Autres solutions : garder une bande passante plus modeste, ou filtrer la commande autour de la résonance (filtre réjecteur) en le prenant en compte dans le réglage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Vérin pneumatique : coussin d'air et choix de simulation</h3>
  <div class="statement">Un vérin pneumatique de diamètre 32 mm déplace horizontalement une pince de masse \(m = 1{,}5\ \text{kg}\) (frottements négligés). En fin de mouvement, la chambre arrière a une longueur \(\ell = 0{,}12\ \text{m}\) et contient de l'air sous la pression absolue \(p = 7\ \text{bar}\) ; on étudie les petits mouvements de la pince autour de cette position, l'autre chambre étant à l'échappement.</div>
  <div class="q"><strong>Q1.</strong> Quelles grandeurs effort et flux porte le lien entre le distributeur et le vérin ? Pourquoi les logiciels utilisent-ils souvent un débit massique en pneumatique ?</div>
  <div class="q"><strong>Q2.</strong> Pour une petite évolution polytropique (\(pV^n\) constant), montrer que la chambre se comporte comme un ressort de raideur \(k = n\,p\,S^2/V\). Calculer \(k\) en isotherme (\(n = 1\)) et en adiabatique (\(n = 1{,}4\)).</div>
  <div class="q"><strong>Q3.</strong> En déduire la fréquence propre des oscillations de la pince. Même question si le vérin était rempli d'huile (\(B = 1{,}4\cdot10^{9}\ \text{Pa}\), \(k = BS^2/V\)). Conclure sur l'usage des deux technologies.</div>
  <div class="q"><strong>Q4.</strong> On simule le vérin pneumatique (adiabatique) à pas fixe. Proposer un pas et une durée de simulation pour observer ces oscillations. Que deviendrait le pas avec le modèle hydraulique compressible ? Comment l'éviter si la compressibilité de l'huile n'intéresse pas ?</div>
  <div class="q"><strong>Q5.</strong> Comment la fréquence propre varie-t-elle avec la pression d'alimentation (4 à 8 bar absolus) et avec la longueur de la chambre ? Calculer les valeurs extrêmes pour la pression, puis la fréquence quand la chambre ne mesure plus que 3 cm.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Effort : la pression \(p\) (Pa) ; flux : le débit (volumique \(Q_v\) en m³/s, ou massique \(q_m\) en kg/s), avec la puissance \(p\,Q_v\). L'air est compressible : son débit volumique change avec la pression le long du circuit, alors que le débit massique se conserve d'un composant à l'autre. On l'emploie donc pour écrire les nœuds.</p>
    <p><strong>Q2.</strong> En différentiant \(pV^n = \text{cste}\) : \(\mathrm{d}p/p = -n\,\mathrm{d}V/V\). Si la tige s'enfonce de \(\mathrm{d}x\), \(\mathrm{d}V = -S\,\mathrm{d}x\), et l'effort de l'air sur le piston augmente de \(\mathrm{d}F = S\,\mathrm{d}p = \dfrac{n\,p\,S^2}{V}\,\mathrm{d}x\). Ici \(S = \pi \times 0{,}016^2 \approx 8{,}04\cdot10^{-4}\ \text{m}^2\) et \(V = S\ell\), donc \(k = n\,p\,S/\ell\) : \(k \approx 4\,690\ \text{N/m}\) en isotherme et \(6\,570\ \text{N/m}\) en adiabatique.</p>
    <p><strong>Q3.</strong> \(f_0 = \dfrac{1}{2\pi}\sqrt{k/m}\) : 8,9 Hz (isotherme) à 10,5 Hz (adiabatique ; c'est ce cas qui vaut pour une oscillation de quelques hertz, trop rapide pour les échanges de chaleur). Avec de l'huile, \(k = BS/\ell \approx 9{,}4\cdot10^{6}\ \text{N/m}\), environ 1 400 fois plus raide, et \(f_0 \approx 400\ \text{Hz}\). La pince « rebondit » sur son coussin d'air : le vérin pneumatique convient pour des mouvements tout ou rien entre butées, pas pour un positionnement précis à mi-course, qui demande un vérin hydraulique ou électrique.</p>
    <p><strong>Q4.</strong> Période des oscillations : \(1/10{,}5 \approx 0{,}095\ \text{s}\). Il faut un pas petit devant elle : au plus \(T/10 \approx 10\ \text{ms}\), et plutôt 1 ms pour une courbe propre, vérifiée en divisant le pas par 2. Durée : plusieurs périodes, et, s'il y a un amortissement, jusqu'à leur extinction, soit au moins une seconde ici. Avec le modèle hydraulique compressible, la période tombe à 2,5 ms : le pas devrait descendre à 0,25 ms au plus, alors que le mouvement utile dure des dixièmes de seconde : modèle raide. Si la compressibilité n'intéresse pas, on modélise l'huile incompressible (vérin = transformateur parfait \(F = pS\), \(Q_v = Sv\)), ou l'on emploie un solveur à pas variable.</p>
    <p><strong>Q5.</strong> \(k\) est proportionnelle à \(p\) et inversement proportionnelle à \(\ell\), donc \(f_0\) varie comme \(\sqrt{p/\ell}\). En adiabatique : 8,0 Hz sous 4 bar et 11,3 Hz sous 8 bar ; pour \(\ell = 3\ \text{cm}\) (quatre fois moins), \(f_0\) double : environ 21 Hz. Un balayage de la position montrerait donc une raideur très variable le long de la course : un modèle linéarisé n'est valable qu'autour d'une position donnée.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Monte-matériaux de chantier : du modèle causal au modèle acausal</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>modélisation multiphysique</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un monte-matériaux élève une plate-forme chargée le long d'un mât. Un variateur (hacheur) alimente un moteur à courant continu qui entraîne, par un réducteur, un tambour sur lequel s'enroule le câble de levage. Un codeur incrémental sur l'arbre moteur informe la carte de commande, qui reçoit aussi les ordres d'une boîte à boutons.<br>
    Données : masse plate-forme + charge \(m = 200\ \text{kg}\) ; \(g = 9{,}81\ \text{m/s}^2\) ; tambour de rayon \(r_t = 0{,}10\ \text{m}\) ; réducteur de rapport \(k = \omega_t/\omega_m = 1/40\), sans perte ; câble inextensible ; inerties du réducteur et du tambour négligées. Moteur : \(R = 0{,}5\ \Omega\), \(L = 5\ \text{mH}\), \(K = 0{,}6\ \text{N·m/A}\), \(J_m = 2\cdot10^{-3}\ \text{kg·m}^2\), frottements négligés. Vitesse nominale de la plate-forme : \(V = 0{,}5\ \text{m/s}\). Le variateur limite le courant à \(I_{max} = 10\ \text{A}\).
  </div>

  <p class="exo-part">Partie A — Architecture et nature des grandeurs</p>
  <div class="q"><strong>A1.</strong> Associer à chaque constituant (réseau et redresseur, hacheur, moteur, réducteur, tambour et câble, plate-forme, codeur, carte de commande, boîte à boutons) sa chaîne et sa fonction générique.</div>
  <div class="q"><strong>A2.</strong> Préciser l'effort et le flux portés par les liens hacheur → moteur, moteur → réducteur et câble → plate-forme. Quelle est la nature du lien codeur → carte ?</div>

  <p class="exo-part">Partie B — Modèle causal</p>
  <div class="q"><strong>B1.</strong> Calculer l'inertie équivalente \(J_{eq}\) ramenée sur l'arbre moteur et le couple \(C_{r,eq}\) dû au poids, ramené sur le même arbre.</div>
  <div class="q"><strong>B2.</strong> Écrire les équations du modèle et décrire son schéma-blocs (entrées : tension \(U\) et couple \(C_{r,eq}\) ; sortie : vitesse \(V\) de la plate-forme).</div>
  <div class="q"><strong>B3.</strong> En montée à vitesse nominale, calculer \(\omega_m\), le courant, la f.é.m., la tension d'alimentation, puis faire le bilan des puissances et calculer le rendement du moteur.</div>

  <p class="exo-part">Partie C — Modèle acausal</p>
  <div class="q"><strong>C1.</strong> Lister, dans l'ordre de la chaîne de puissance, les composants du modèle acausal, avec le domaine de leurs ports. Comment modéliser le poids ?</div>
  <div class="q"><strong>C2.</strong> Quel intérêt présente ce modèle pour l'étude de la descente ?</div>

  <p class="exo-part">Partie D — Simulation, non-linéarités et validation</p>
  <div class="q"><strong>D1.</strong> Une simulation sans limitation de courant, pour un échelon de tension de 124 V plate-forme à l'arrêt, donne un pic de courant d'environ 110 A. Justifier l'ordre de grandeur (majorant simple) et le rôle de \(I_{max}\). Où placer cette non-linéarité dans le modèle causal ?</div>
  <div class="q"><strong>D2.</strong> Avec \(i = I_{max}\) pendant le démarrage en montée, calculer l'accélération de la plate-forme, la durée de mise en vitesse et la distance parcourue pendant celle-ci.</div>
  <div class="q"><strong>D3.</strong> En descente à 0,5 m/s, calculer \(u\), \(i\) et la puissance électrique. Conclure sur le convertisseur et sur l'énergie disponible pour une descente de 10 m.</div>
  <div class="q"><strong>D4.</strong> Sur le prototype, le courant mesuré en montée établie vaut 9,0 A. Chiffrer l'écart avec le modèle, proposer une cause et la façon de recaler le modèle acausal.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Chaîne de puissance : réseau et redresseur (alimenter), hacheur (moduler), moteur (convertir), réducteur, tambour et câble (transmettre), plate-forme (effecteur, agir sur les matériaux). Chaîne d'information : codeur (acquérir), boîte à boutons (acquérir les consignes de l'opérateur), carte de commande (traiter, communiquer les ordres au hacheur).</p>
    <p><strong>A2.</strong> Hacheur → moteur : tension \(u\) et courant \(i\). Moteur → réducteur : couple \(C_m\) et vitesse angulaire \(\omega_m\). Câble → plate-forme : force (tension du câble) \(T_c\) et vitesse \(V\). Codeur → carte : lien d'information (impulsions), sans puissance utile.</p>
    <p><strong>B1.</strong> \(V = k\,r_t\,\omega_m\) avec \(k\,r_t = 2{,}5\cdot10^{-3}\ \text{m/rad}\). Égalité des énergies cinétiques :</p>
    <div class="formula">$$J_{eq} = J_m + m\,(k r_t)^2$$ $$J_{eq} = 2\cdot10^{-3} + 1{,}25\cdot10^{-3}$$ $$J_{eq} = 3{,}25\cdot10^{-3}\ \text{kg·m}^2$$</div>
    <p>Puissance du poids : \(-m g V = -(m g\,k r_t)\,\omega_m\), d'où \(C_{r,eq} = m g\,k r_t \approx 4{,}9\ \text{N·m}\) (\(1\,962\ \text{N}\times2{,}5\cdot10^{-3}\ \text{m}\)).</p>
    <p><strong>B2.</strong> \(u = e + Ri + L\,di/dt\) ; \(e = K\omega_m\) ; \(C_m = Ki\) ; \(J_{eq}\,d\omega_m/dt = C_m - C_{r,eq}\) ; \(V = k r_t\,\omega_m\). Schéma : \(U\) → sommateur (\(-E\)) → \(\dfrac{1}{R+Lp}\) → \(K\) → sommateur (\(-C_{r,eq}\)) → \(\dfrac{1}{J_{eq}p}\) → \(\Omega_m\) → \(k r_t\) → \(V\), avec le retour \(K\) (f.é.m.). Le poids, constant, entre comme une perturbation en échelon.</p>
    <p><strong>B3.</strong> \(\omega_m = V/(k r_t) = 200\ \text{rad/s}\) ; \(i = C_{r,eq}/K = 4{,}905/0{,}6 \approx 8{,}2\ \text{A}\) ; \(e = K\omega_m = 120\ \text{V}\) ; \(u = e + Ri = 120 + 4{,}1 \approx 124\ \text{V}\). Puissances : électrique \(u\,i \approx 1\,014\ \text{W}\) ; mécanique \(C_m\omega_m = m g V = 981\ \text{W}\) ; pertes Joule \(R i^2 \approx 33\ \text{W}\). Rendement du moteur \(981/1\,014 \approx 0{,}97\).</p>
    <p><strong>C1.</strong> Source de tension pilotée (port électrique, entrée signal) et masse électrique ; MCC (ports électriques, port de rotation) ; réducteur idéal (rotation → rotation) ; tambour et câble (rotation → translation, rayon \(r_t\)) ; masse \(m\) (translation) ; poids : <strong>source d'effort</strong> constante \(m g\), car il impose une force quelle que soit la vitesse ; bâti en référence ; capteur de vitesse ou de position (sortie signal) pour la commande. On pourrait remplacer le câble inextensible par un ressort si son élasticité devenait gênante.</p>
    <p><strong>C2.</strong> En descente, la charge devient motrice : la puissance change de signe sur les liens mécaniques puis électrique. Le modèle acausal décrit ce renversement sans aucune réécriture et donne la puissance sur chaque lien ; il suffit de choisir un composant de convertisseur réversible (ou non) pour voir si l'énergie peut remonter vers la source.</p>
    <p><strong>D1.</strong> À l'arrêt, \(e = 0\) : seuls \(R\) et \(L\) limitent le courant, majoré par \(u/R = 248\ \text{A}\). Le pic réel (≈ 110 A) est plus faible car la f.é.m. croît pendant que le courant s'établit (\(\tau_e = L/R = 10\ \text{ms}\)), mais il vaut plus de dix fois le courant nominal : inacceptable pour le moteur et le hacheur. La limitation \(I_{max}\) se modélise par un bloc <strong>saturation</strong> sur la consigne de courant d'une boucle de courant interne (ou sur le courant lui-même dans un modèle simplifié).</p>
    <p><strong>D2.</strong> \(C_m = K I_{max} = 6\ \text{N·m}\) ; \(\dot\omega_m = (6 - 4{,}905)/J_{eq} \approx 337\ \text{rad/s}^2\) ; accélération \(a = k r_t\,\dot\omega_m \approx 0{,}84\ \text{m/s}^2\). Durée : \(200/337 \approx 0{,}59\ \text{s}\) ; distance \(V^2/(2a) = 0{,}25/1{,}68 \approx 0{,}15\ \text{m}\).</p>
    <p><strong>D3.</strong> En descente établie, le moteur retient la charge : \(C_m = C_{r,eq}\), donc \(i \approx 8{,}2\ \text{A}\) (même signe qu'en montée), tandis que \(\omega_m = -200\ \text{rad/s}\) et \(e = -120\ \text{V}\). \(u = -120 + 4{,}1 \approx -116\ \text{V}\) et \(u\,i \approx -948\ \text{W}\) : le moteur fonctionne en génératrice et renvoie de l'énergie. Le convertisseur doit être réversible en <strong>tension</strong> (\(u \lt 0\) avec \(i \gt 0\)), et la source doit accepter cette énergie ; sinon une résistance de freinage la dissipe. Pour 10 m (20 s) : \(948\times20 \approx 19\ \text{kJ}\), soit l'énergie potentielle \(m g h = 19{,}6\ \text{kJ}\) moins les pertes Joule (\(33\times20 \approx 0{,}7\ \text{kJ}\)).</p>
    <p><strong>D4.</strong> Écart : \((8{,}2 - 9{,}0)/9{,}0 \approx -9\ \%\) : le modèle sous-estime le couple nécessaire. Cause probable : pertes du réducteur (frottements des engrenages, paliers) supposées nulles. Rendement apparent \(\eta \approx 8{,}2/9{,}0 \approx 0{,}91\). Dans le modèle acausal, il suffit de renseigner ce rendement dans le composant réducteur (ou d'ajouter un frottement), puis de vérifier le recalage sur un autre essai, par exemple la descente, où le courant mesuré doit être plus faible que celui du modèle sans pertes.</p>
  </div>
