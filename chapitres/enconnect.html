      <div class="sec-num">§1 · CONNECTEURS LOGIQUES</div>
      <h2>Les mots de liaison (linkers)</h2>
      <div class="intro">Les connecteurs articulent un raisonnement et rendent l'anglais fluide. Classés par fonction.</div>
      <div class="prop-box"><strong>Addition / illustration</strong> : moreover, furthermore, in addition, besides ; for instance, namely, such as.</div>
      <div class="prop-box"><strong>Contraste / concession</strong> : however, nevertheless, nonetheless, yet, whereas, although, despite / in spite of (+ nom).</div>
      <div class="prop-box"><strong>Cause / conséquence</strong> : because, since, as, due to / owing to (+ nom) ; therefore, thus, hence, as a result, consequently, so.</div>
      <div class="prop-box"><strong>But / condition / temps</strong> : so as to / in order to, so that ; unless, provided that, as long as ; meanwhile, eventually (= finalement), then.</div>
      <div class="notice">Faux-amis fréquents : <em>eventually</em> = finalement (≠ éventuellement) ; <em>actually</em> = en fait (≠ actuellement = currently).</div>
