  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite la partie 3.4 du programme de PTSI, « Deuxième principe : bilans d'entropie ». Il s'appuie sur <a href="#thermo1/cours">« Introduction thermodynamique »</a> (états d'équilibre, gaz parfait, phases condensées) et sur <a href="#thermo2/cours">« Premier principe : bilans d'énergie »</a> (transformations, travail, transfert thermique, énergie interne, enthalpie) ; il prépare <a href="#machines/cours">« Machines thermiques »</a> et <a href="#changement/cours">« Corps pur diphasé et changements d'état »</a>. Conformément au programme, l'expression de l'entropie d'un système est toujours <strong>fournie</strong> : on apprend à l'utiliser, pas à l'établir.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

      <ul>
        <li><strong>Deuxième principe</strong> : entropie créée, entropie échangée, \(\Delta S=S_{\text{éch}}+S_{\text{créée}}\) avec \(S_{\text{éch}}=\sum_iQ_i/T_i\) ; définir un système fermé et établir pour ce système un bilan entropique (§2, §5).</li>
        <li><strong>Fonction d'état entropie</strong> : interpréter qualitativement l'entropie en termes de désordre statistique à l'aide de la formule de Boltzmann fournie (§3).</li>
        <li><strong>Variation d'entropie d'un système</strong> : utiliser l'expression fournie de la fonction d'état entropie ; exploiter l'extensivité de l'entropie (§4).</li>
        <li>Analyser le cas particulier d'un système en <strong>évolution adiabatique</strong> (§5, §9).</li>

<div class="course-section">
  <div class="sec-num">§1 · LE SENS DES TRANSFORMATIONS</div>
  <h2>Ce que le premier principe ne dit pas</h2>
  <div class="intro">Le premier principe interdit de créer ou de détruire de l'énergie, mais il ne dit pas dans quel sens les choses se passent. Or l'expérience montre que beaucoup de transformations ne se font que dans un sens : il faut un second principe pour le traduire.</div>
  <p><strong>Trois constats.</strong> Une tasse de café chaud posée dans une pièce refroidit ; jamais l'air de la pièce ne la réchauffe spontanément, même si l'énergie se conserverait. Un gaz enfermé dans la moitié d'une enceinte vide l'autre moitié dès qu'on ouvre la cloison (détente de Joule-Gay-Lussac) ; il ne se rassemble jamais tout seul. Une voiture qui freine transforme son énergie cinétique en chaleur dans les freins ; des freins chauds ne remettent jamais la voiture en marche.</p>
  <div class="def-box">
    <strong>Transformation réversible.</strong> Transformation dont on peut inverser le sens par une modification infinitésimale des conditions extérieures, le système et le milieu extérieur repassant par les mêmes états. Elle est quasi statique et sans phénomène dissipatif. Toute transformation réelle est <strong>irréversible</strong> ; la transformation réversible est une limite idéale, dont on s'approche par des évolutions très lentes, sans frottement, sous de très faibles écarts de température et de pression.
  </div>
  <p>Les définitions des transformations (isotherme, monotherme, monobare, adiabatique, quasi statique) et du thermostat sont dans le chapitre <a href="#thermo2/cours">« Premier principe : bilans d'énergie »</a>, §1. Les causes d'irréversibilité y sont énumérées ; on les relie ici à la création d'entropie (§6).</p>
  <div class="method-box">
    <strong>Exemple — l'énergie d'une tasse de café</strong>
    <ol>
      <li>250 g de café (eau, \(c=4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\)) refroidissent de 80 °C à 20 °C : ils cèdent à la pièce \(Q=mc\,\Delta T=0{,}25\times4\,180\times60\approx63\ \text{kJ}\).</li>
      <li>Le premier principe autoriserait le contraire : la pièce rendant 63 kJ au café. Personne ne l'a jamais observé. Le deuxième principe affirme cette impossibilité et la chiffre (§7).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre quasi statique et réversible. Un piston déplacé très lentement mais qui frotte sur son cylindre évolue de façon quasi statique, et pourtant irréversible : le frottement dissipe de l'énergie (§6).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LE DEUXIÈME PRINCIPE</div>
  <h2>Entropie échangée, entropie créée</h2>
  <div class="intro">Le deuxième principe introduit une nouvelle fonction d'état, l'entropie, dont la variation se décompose en une part échangée avec l'extérieur et une part créée à l'intérieur du système, qui ne peut être négative.</div>
  <div class="prop-box">
    <strong>Deuxième principe.</strong> À tout système est associée une fonction d'état <strong>extensive</strong>, l'<strong>entropie</strong> \(S\) (en \(\text{J·K}^{-1}\)). Pour un système fermé qui évolue entre deux états d'équilibre :
    <div class="formula" data-nom="Deuxième principe">$$\Delta S=S_{\text{éch}}+S_{\text{créée}}\qquad S_{\text{éch}}=\sum_i\frac{Q_i}{T_i}\qquad S_{\text{créée}}\geq0$$</div>
    \(Q_i\) est le transfert thermique reçu par le système de la source \(i\), à la température \(T_i\) (en kelvins) ; \(S_{\text{créée}}=0\) si la transformation est réversible, \(S_{\text{créée}}\gt0\) si elle est irréversible. Pour une transformation élémentaire : \(\mathrm{d}S=\delta S_{\text{éch}}+\delta S_{\text{créée}}\), avec \(\delta S_{\text{éch}}=\delta Q/T_{\text{ext}}\).
  </div>

</figure>
  <p><strong>Statuts différents.</strong> Comme pour le premier principe (\(\Delta U=W+Q\)), la variation \(\Delta S\) ne dépend que des états initial et final, tandis que \(S_{\text{éch}}\) et \(S_{\text{créée}}\) dépendent du chemin suivi. On calcule donc \(\Delta S\) par l'expression de \(S\) (fournie, §4), \(S_{\text{éch}}\) par les échanges, et l'on en déduit \(S_{\text{créée}}\). Le travail n'échange pas d'entropie : seuls les transferts thermiques en échangent.</p>
  <p><strong>Quelle température ?</strong> Celle de la source (ou de la frontière à travers laquelle se fait l'échange), pas celle du système, qui n'est d'ailleurs pas toujours définie au cours d'une transformation irréversible. Les deux sont égales lors d'un échange réversible.</p>
  <div class="method-box">
    <strong>Exemple — entropie échangée avec deux sources</strong>
    <ol>
      <li>Un système reçoit \(Q_1=+500\ \text{J}\) d'une source à 400 K et cède 300 J à une source à 300 K (\(Q_2=-300\ \text{J}\)).</li>
      <li>\(S_{\text{éch}}=\dfrac{500}{400}+\dfrac{-300}{300}=1{,}25-1{,}00=+0{,}25\ \text{J·K}^{-1}\).</li>
      <li>Si l'état final est l'état initial (cycle), \(\Delta S=0\) et \(S_{\text{créée}}=-0{,}25\ \text{J·K}^{-1}\lt0\) : un tel cycle est impossible (§11).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(S_{\text{éch}}=Q/T\) avec la température du système, ou oublier le signe de \(Q\) (positif si le système reçoit, négatif s'il cède). Autre erreur : croire que l'entropie d'un système ne peut qu'augmenter ; c'est l'entropie <em>créée</em> qui est positive. Un système qui cède de la chaleur peut voir son entropie diminuer (§4).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · INTERPRÉTATION STATISTIQUE</div>
  <h2>La formule de Boltzmann</h2>
  <div class="intro">Que mesure l'entropie ? À l'échelle microscopique, un même état macroscopique (\(P\), \(V\), \(T\)) est réalisé par un nombre gigantesque de configurations des molécules. L'entropie compte, à une échelle logarithmique, ces configurations : c'est une mesure du désordre, ou du manque d'information sur l'état microscopique.</div>
  <div class="prop-box">
    <strong>Formule de Boltzmann</strong> (fournie). Si \(\Omega\) est le nombre de configurations microscopiques compatibles avec l'état macroscopique d'un système isolé :
    <div class="formula" data-nom="Formule de Boltzmann">$$S=k_B\ln\Omega\qquad k_B=1{,}38\times10^{-23}\ \text{J·K}^{-1}$$</div>
    Plus un état est désordonné (plus il est réalisé de façons différentes), plus son entropie est grande. Le logarithme rend \(S\) extensive : pour deux systèmes indépendants, \(\Omega=\Omega_1\Omega_2\) et \(S=S_1+S_2\).
  </div>

  <p><strong>Pourquoi l'évolution a un sens.</strong> Après l'ouverture de la cloison, les configurations où les molécules sont réparties à peu près également entre les deux moitiés sont incomparablement plus nombreuses que celles où elles sont toutes à gauche. Le système, qui explore au hasard ses configurations, se retrouve presque sûrement dans l'état de plus grand \(\Omega\) : l'état d'équilibre, d'entropie maximale. L'évolution inverse n'est pas impossible en principe, elle est seulement d'une improbabilité inimaginable.</p>

    <strong>Exemple — un ordre de grandeur vertigineux</strong>
    <ol>
      <li>Une mole de gaz double son volume (détente de Joule-Gay-Lussac) : son entropie augmente de \(R\ln2\approx5{,}76\ \text{J·K}^{-1}\) (expression du §4).</li>
      <li>D'après Boltzmann, \(\ln\Omega\) augmente de \(5{,}76/k_B\approx4{,}2\times10^{23}\) : \(\Omega\) est multiplié par \(2^{N_A}\), un nombre à \(1{,}8\times10^{23}\) chiffres. C'est cohérent : chaque molécule a deux fois plus de positions accessibles.</li>
      <li>La probabilité de retrouver spontanément toutes les molécules dans la moitié de départ vaut \(2^{-N_A}\) : rigoureusement jamais observée.</li>
    </ol>
  </div>
  <p>Autres illustrations : le gaz est plus désordonné que le liquide, lui-même plus que le solide (\(s_{\text{vapeur}}\gt s_{\text{liquide}}\gt s_{\text{solide}}\), §10) ; chauffer un corps augmente l'agitation et le nombre d'états accessibles, donc son entropie.</p>
  <div class="notice"><strong>Erreur classique</strong> : utiliser la formule de Boltzmann pour calculer une variation d'entropie dans un exercice de thermodynamique. En PTSI, elle sert à <em>interpréter</em> ; les calculs se font avec les expressions macroscopiques fournies (§4).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ENTROPIE DES SYSTÈMES USUELS</div>
  <h2>Utiliser l'expression fournie de l'entropie</h2>
  <div class="intro">Comme l'énergie interne, l'entropie s'exprime en fonction des variables d'état. Ses expressions sont données par l'énoncé ; il faut savoir les reconnaître, choisir la forme adaptée aux données et les appliquer entre l'état initial et l'état final.</div>
  <div class="prop-box">
    <strong>Expressions usuelles</strong> (fournies ; \(C_V\), \(C_P\) et \(C\) constantes, températures en kelvins).
    <ul>
      <li><strong>Gaz parfait</strong> (\(n\) moles) : \(S(T,V)=C_V\ln T+nR\ln V+\text{cste}\), d'où
      <div class="formula" data-nom="Entropie d'un gaz parfait">$$\Delta S=C_V\ln\frac{T_f}{T_i}+nR\ln\frac{V_f}{V_i}=C_P\ln\frac{T_f}{T_i}-nR\ln\frac{P_f}{P_i}=C_V\ln\frac{P_f}{P_i}+C_P\ln\frac{V_f}{V_i}$$</div>
      Les trois formes sont équivalentes (\(PV=nRT\) et relation de Mayer \(C_P-C_V=nR\)) : on choisit celle dont les variables sont connues.</li>
      <li><strong>Phase condensée</strong> incompressible et indilatable, de capacité thermique \(C=mc\) :
      <div class="formula" data-nom="Entropie d'une phase condensée">$$\Delta S=C\ln\frac{T_f}{T_i}$$</div></li>
      <li><strong>Thermostat</strong> à la température \(T_0\), qui reçoit le transfert thermique \(Q_{\text{th}}\) : \(\Delta S_{\text{th}}=Q_{\text{th}}/T_0\). Sa température étant uniforme et constante, ses transformations internes sont réversibles.</li>
    </ul>
  </div>
  <p><strong>Cas particuliers du gaz parfait.</strong> Isochore : \(\Delta S=C_V\ln(T_f/T_i)\) ; isobare : \(\Delta S=C_P\ln(T_f/T_i)\) ; isotherme : \(\Delta S=nR\ln(V_f/V_i)=-nR\ln(P_f/P_i)\). Chauffer augmente l'entropie, détendre l'augmente aussi (plus de place pour les molécules), comprimer à température constante la diminue.</p>
  <p><strong>Extensivité.</strong> L'entropie d'un système formé de plusieurs parties est la somme de leurs entropies : \(\Delta S=\sum_k\Delta S_k\), chaque partie avec sa propre expression (eau, calorimètre, gaz…).</p>
  <div class="method-box">
    <strong>Exemple — trois variations d'entropie</strong>
    <ol>
      <li>1,0 kg d'eau chauffé de 20 °C à 80 °C : \(\Delta S=4\,180\ln\dfrac{353{,}15}{293{,}15}\approx+778\ \text{J·K}^{-1}\).</li>
      <li>Une mole de gaz parfait dont le volume double à température constante : \(\Delta S=R\ln2\approx+5{,}76\ \text{J·K}^{-1}\).</li>
      <li>La même, comprimée de 1 à 5 bar à température constante : \(\Delta S=-R\ln5\approx-13{,}4\ \text{J·K}^{-1}\). L'entropie diminue : le gaz cède de la chaleur, ce qui est permis (§2).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre les températures en degrés Celsius dans le logarithme. \(\ln(80/20)=1{,}39\) au lieu de \(\ln(353{,}15/293{,}15)=0{,}186\) : sept fois trop. Autre erreur : écrire \(\Delta S=Q/T\) pour un corps dont la température varie ; seul le thermostat, à température constante, vérifie \(\Delta S=Q/T\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BILAN D'ENTROPIE</div>
  <h2>La méthode, et le cas d'une évolution adiabatique</h2>
  <div class="intro">Un bilan d'entropie répond à deux questions : la transformation est-elle possible, et, si elle l'est, est-elle réversible ? Il se mène toujours de la même façon, sur un système fermé bien défini.</div>
  <div class="method-box">
    <strong>Méthode — bilan d'entropie</strong>
    <ol>
      <li>Définir le <strong>système</strong> (fermé) et repérer les <strong>sources</strong> avec lesquelles il échange de la chaleur, et leurs températures.</li>
      <li>Déterminer l'état final (premier principe, équilibres mécanique et thermique), puis \(\Delta S\) par l'expression fournie.</li>
      <li>Calculer \(S_{\text{éch}}=\sum_iQ_i/T_i\), avec les \(Q_i\) tirés du premier principe.</li>
      <li>En déduire \(S_{\text{créée}}=\Delta S-S_{\text{éch}}\) ; vérifier \(S_{\text{créée}}\geq0\) (un résultat négatif signale une erreur ou une transformation impossible) ; identifier la cause d'irréversibilité.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — chauffer de l'eau au contact d'un thermostat</strong>
    <p>1,0 kg d'eau à 20 °C est placé au contact d'un thermostat à 80 °C, sous pression atmosphérique, jusqu'à l'équilibre.</p>
    <ol>
      <li>État final : 80 °C. \(\Delta S=+778\ \text{J·K}^{-1}\) (§4).</li>
      <li>Premier principe (monobare) : \(Q=\Delta H=mc\,\Delta T=250{,}8\ \text{kJ}\), reçu du thermostat ; \(S_{\text{éch}}=Q/T_0=250\,800/353{,}15\approx710\ \text{J·K}^{-1}\).</li>
      <li>\(S_{\text{créée}}=778-710\approx68\ \text{J·K}^{-1}\gt0\) : transformation irréversible, à cause de l'écart de température entre l'eau et le thermostat. Avec un thermostat à 100 °C, l'écart est plus grand et \(S_{\text{créée}}\approx106\ \text{J·K}^{-1}\).</li>
      <li>Contrôle : le thermostat perd \(710\ \text{J·K}^{-1}\) ; l'ensemble eau et thermostat, isolé, gagne \(778-710=68\ \text{J·K}^{-1}\), toute l'entropie créée.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Évolution adiabatique.</strong> Sans transfert thermique, \(S_{\text{éch}}=0\) et \(\Delta S=S_{\text{créée}}\geq0\) : l'entropie d'un système en évolution adiabatique ne peut qu'augmenter, ou rester constante si l'évolution est réversible (<strong>isentropique</strong>). En particulier, un système isolé évolue jusqu'à un état d'équilibre où son entropie est maximale.
  </div>
  <p>Conséquence : de deux états \(A\) et \(B\) d'un système calorifugé, si \(S_B\lt S_A\), le passage de \(A\) à \(B\) est impossible. La détente de Joule-Gay-Lussac (\(\Delta S=nR\ln(V_f/V_i)\gt0\)) est possible ; la « recompression » spontanée, qui diminuerait \(S\) sans échange, ne l'est pas.</p>
  <div class="notice"><strong>Erreur classique</strong> : « adiabatique donc \(\Delta S=0\) ». Adiabatique donne seulement \(S_{\text{éch}}=0\) ; \(\Delta S=0\) demande en plus la réversibilité. Une compression adiabatique brutale augmente l'entropie du gaz (§9). Inversement, isentropique ne veut pas dire adiabatique en général, mais adiabatique et réversible si l'on suppose \(S_{\text{créée}}=0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · CAUSES D'IRRÉVERSIBILITÉ</div>
  <h2>D'où vient l'entropie créée</h2>
  <div class="intro">Le programme demande de relier la création d'entropie à ses causes physiques. Trois grandes familles reviennent sans cesse : les transferts thermiques sous un écart fini de température, les phénomènes dissipatifs, les inhomogénéités (de pression, de concentration). Chacune se chiffre par un bilan.</div>
  <h3>Transfert thermique sous un écart de température</h3>
  <p>Un corps de capacité \(C\), à \(T_i\), est mis au contact d'un thermostat à \(T_0\). Bilan : \(\Delta S=C\ln(T_0/T_i)\), \(Q=C(T_0-T_i)\), \(S_{\text{éch}}=Q/T_0\), d'où, avec \(x=T_i/T_0\) :</p>
  <div class="formula" data-nom="Entropie créée par un contact avec un thermostat">$$S_{\text{créée}}=C\left(x-1-\ln x\right)\geq0\qquad x=\frac{T_i}{T_0}$$</div>

  <h3>Phénomènes dissipatifs : frottements, effet Joule</h3>
  <p>Un travail dissipé finit en énergie interne, puis en chaleur cédée au milieu ambiant. Si le système revient à son état initial (ou à un état d'entropie inchangée), \(\Delta S=0\) et \(S_{\text{créée}}=-S_{\text{éch}}=W_{\text{dissipé}}/T_0\).</p>
  <div class="method-box">
    <strong>Exemple — trois créations d'entropie</strong>
    <ol>
      <li>Chute d'une masse : une pierre de 2,0 kg tombe de 5,0 m dans un lac à 17 °C et s'y immobilise. Pierre et eau du lac : l'énergie potentielle \(mgh=98\ \text{J}\) finit en chaleur dans le lac, thermostat : \(S_{\text{créée}}=mgh/T_0\approx0{,}34\ \text{J·K}^{-1}\).</li>
      <li>Effet Joule : une résistance de 100 Ω parcourue par 0,50 A pendant une minute, en régime permanent dans l'air à 20 °C. Son état ne change pas (\(\Delta S=0\)) ; elle cède \(RI^2\Delta t=1\,500\ \text{J}\) à l'air : \(S_{\text{éch}}=-5{,}12\ \text{J·K}^{-1}\), donc \(S_{\text{créée}}=+5{,}12\ \text{J·K}^{-1}\).</li>
      <li>Inhomogénéité de pression : la détente de Joule-Gay-Lussac d'une mole qui double son volume crée \(R\ln2\approx5{,}76\ \text{J·K}^{-1}\) (enceinte calorifugée : tout est créé).</li>
    </ol>
  </div>
  <p><strong>Autres causes.</strong> La diffusion de particules (mélange de deux gaz, d'une goutte d'encre dans l'eau), les réactions chimiques, les inhomogénéités de concentration créent aussi de l'entropie ; leur calcul n'est pas au programme de PTSI. Toutes ont en commun un écart fini (de température, de pression, de concentration) ou une dissipation : les supprimer, c'est tendre vers la réversibilité.</p>
  <div class="notice"><strong>Erreur classique</strong> : chercher la cause d'irréversibilité dans le système seul. Dans l'exemple de l'eau chauffée (§5), l'eau évolue de façon parfaitement régulière ; l'irréversibilité est à l'interface, dans l'écart de température entre l'eau et le thermostat.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CONTACT THERMIQUE ET MÉLANGE</div>
  <h2>Deux corps qui s'équilibrent, et la limite réversible</h2>
  <div class="intro">Mettre en contact deux corps de températures différentes est l'exemple type d'une transformation irréversible : l'énergie passe du chaud au froid, jamais l'inverse. Le bilan d'entropie le démontre et montre comment s'approcher de la réversibilité.</div>
  <p>Deux phases condensées de capacités \(C_1\), \(C_2\), aux températures \(T_1\), \(T_2\), sont mises en contact dans une enceinte calorifugée, sous pression constante. Le premier principe (\(\Delta H=0\)) donne la température finale ; l'ensemble est calorifugé, donc \(S_{\text{créée}}=\Delta S\) :</p>
  <div class="formula" data-nom="Contact thermique de deux corps">$$T_f=\frac{C_1T_1+C_2T_2}{C_1+C_2}\qquad S_{\text{créée}}=C_1\ln\frac{T_f}{T_1}+C_2\ln\frac{T_f}{T_2}$$</div>
  <p>Le corps chaud perd de l'entropie, le froid en gagne davantage : le total est positif. Pour deux capacités égales, \(T_f=(T_1+T_2)/2\) et \(S_{\text{créée}}=2C\ln\dfrac{(T_1+T_2)/2}{\sqrt{T_1T_2}}\geq0\), car la moyenne arithmétique de deux nombres positifs dépasse leur moyenne géométrique.</p>
  <div class="method-box">
    <strong>Exemple — mélange de deux masses d'eau</strong>
    <ol>
      <li>300 g d'eau à 80 °C et 200 g à 20 °C dans un calorimètre de capacité négligeable : \(T_f=0{,}6\times353{,}15+0{,}4\times293{,}15=329{,}15\ \text{K}\), soit 56 °C.</li>
      <li>\(\Delta S_1=0{,}3\times4\,180\ln\dfrac{329{,}15}{353{,}15}\approx-88{,}3\ \text{J·K}^{-1}\) et \(\Delta S_2=0{,}2\times4\,180\ln\dfrac{329{,}15}{293{,}15}\approx+96{,}8\ \text{J·K}^{-1}\).</li>
      <li>\(S_{\text{créée}}\approx+8{,}6\ \text{J·K}^{-1}\) : petite différence de deux grands nombres, très sensible à \(T_f\) : une erreur de 0,1 K sur la température finale donnerait 8,0. On garde donc \(T_f\) exacte et quatre chiffres significatifs dans les logarithmes.</li>
    </ol>
  </div>
  <h3>Tendre vers la réversibilité</h3>
  <p>Chauffer un corps de \(T_i\) à \(T_f\) avec un seul thermostat crée de l'entropie. En le mettant successivement au contact de \(N\) thermostats de températures étagées, chaque étape ne crée qu'une entropie de l'ordre du carré de son petit écart : au total, \(S_{\text{créée}}\approx\dfrac{C(T_f-T_i)^2}{2N\,T_iT_f}\), qui tend vers 0 quand \(N\) tend vers l'infini.</p>

<div class="course-section">
  <div class="sec-num">§8 · LOI DE LAPLACE</div>
  <h2>L'adiabatique réversible d'un gaz parfait</h2>
  <div class="intro">Quand un gaz parfait évolue de façon adiabatique et réversible, son entropie reste constante. L'expression fournie de \(S\) traduit alors cette constance par une relation simple entre pression, volume et température : la loi de Laplace.</div>
  <div class="prop-box">
    <strong>Loi de Laplace.</strong> Pour un <strong>gaz parfait</strong>, de rapport \(\gamma=C_P/C_V\) <strong>constant</strong>, qui subit une transformation <strong>adiabatique</strong> et <strong>réversible</strong> (donc isentropique) :
    <div class="formula" data-nom="Loi de Laplace">$$PV^\gamma=\text{cste}\qquad TV^{\gamma-1}=\text{cste}\qquad T^\gamma P^{1-\gamma}=\text{cste}$$</div>
    Ces relations valent à chaque instant de la transformation, puisqu'elle passe par une suite d'états d'équilibre.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">La loi de Laplace à partir de l'expression de l'entropie</span><div class="content">
    <p>Adiabatique : \(S_{\text{éch}}=0\) ; réversible : \(S_{\text{créée}}=0\) ; donc \(\Delta S=0\) entre l'état initial et tout état intermédiaire. Avec la troisième forme du §4 et \(C_P=\gamma C_V\) :</p>
    <div class="formula">$$0=C_V\ln\frac{P}{P_i}+\gamma C_V\ln\frac{V}{V_i}=C_V\ln\frac{PV^\gamma}{P_iV_i^\gamma}\quad\Longrightarrow\quad PV^\gamma=P_iV_i^\gamma$$</div>
    <p>Avec \(P=nRT/V\), on obtient \(TV^{\gamma-1}=\text{cste}\), puis \(T^\gamma P^{1-\gamma}=\text{cste}\). La même loi s'établit aussi par le premier principe appliqué à une transformation élémentaire (chapitre « Premier principe : bilans d'énergie », §5).</p>
  </div></div>
  <p><strong>Conditions, une par une.</strong> Gaz parfait (pas un liquide, pas un gaz réel à haute pression) ; \(\gamma\) constant (1,4 pour l'air autour de la température ambiante) ; adiabatique (évolution assez rapide, ou parois calorifugées) ; réversible (assez lente pour rester quasi statique, sans frottement). Une compression de quelques secondes ou dixièmes de seconde dans un cylindre satisfait souvent les deux dernières à la fois.</p>
  <div class="method-box">
    <strong>Exemple — l'allumage d'un moteur Diesel</strong>
    <ol>
      <li>De l'air à 20 °C et 1,0 bar est comprimé d'un facteur 20 en volume, de façon supposée adiabatique et réversible (\(\gamma=1{,}4\)).</li>
      <li>\(T_f=T_i\left(V_i/V_f\right)^{\gamma-1}=293{,}15\times20^{0{,}4}\approx972\ \text{K}\), soit environ 700 °C ; \(P_f=P_i\times20^{1{,}4}\approx66\ \text{bar}\).</li>
      <li>Le gazole injecté s'enflamme spontanément vers 250 °C : un moteur Diesel n'a pas besoin de bougie. (Cycles moteurs : chapitre « Machines thermiques », §8.)</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(PV^\gamma=\text{cste}\) à une compression brutale, à un gaz qui échange de la chaleur, ou entre deux états d'une transformation dont seuls les extrêmes sont des équilibres. Dans ces cas, on écrit le premier principe et l'on calcule \(\Delta S\) avec l'expression générale (§9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · DÉTENTES ET COMPRESSIONS D'UN GAZ PARFAIT</div>
  <h2>Comparer les chemins réversibles et irréversibles</h2>
  <div class="intro">Entre les mêmes états, ou vers la même pression finale, un chemin réversible et un chemin brutal n'échangent pas les mêmes énergies. Le bilan d'entropie chiffre l'écart, et montre ce que coûte l'irréversibilité.</div>
  <h3>Détente de Joule-Gay-Lussac</h3>
  <p>Enceinte rigide et calorifugée : \(W=0\), \(Q=0\), donc \(\Delta U=0\) et, pour un gaz parfait, \(T_f=T_i\) (chapitre « Premier principe : bilans d'énergie », §6). Entropie : \(\Delta S=nR\ln(V_f/V_i)\gt0\), et \(S_{\text{éch}}=0\) : \(S_{\text{créée}}=nR\ln(V_f/V_i)\), due à l'inhomogénéité de pression au moment de l'ouverture.</p>
  <h3>Détente isotherme, réversible ou brutale</h3>
  <p>Une mole à 300 K passe de 4 à 2 bar au contact d'un thermostat à 300 K. Mêmes états, donc même \(\Delta S=R\ln2=5{,}76\ \text{J·K}^{-1}\). Réversible : \(Q=-W=RT\ln2=1\,729\ \text{J}\), \(S_{\text{éch}}=\Delta S\), rien n'est créé. Brutale, contre une pression extérieure constante de 2 bar : \(-W=P_f(V_f-V_i)=RT/2=1\,247\ \text{J}=Q\) ; \(S_{\text{éch}}=4{,}16\ \text{J·K}^{-1}\) et \(S_{\text{créée}}=1{,}61\ \text{J·K}^{-1}\). Le gaz a fourni 482 J de travail de moins, soit \(T_0S_{\text{créée}}\) : c'est le travail perdu.</p>
  <h3>Compression adiabatique, réversible ou brutale</h3>
  <p>Une mole d'air (\(\gamma=1{,}4\)) à 293 K et 1 bar est comprimée jusqu'à 5 bar dans un cylindre calorifugé.</p>
  <ul>
    <li><strong>Réversible</strong> (Laplace) : \(T_f=T_i(P_f/P_i)^{(\gamma-1)/\gamma}\approx464\ \text{K}\), \(\Delta S=0\), travail reçu \(C_V\Delta T\approx3\,560\ \text{J}\).</li>
    <li><strong>Brutale</strong> : on pose sur le piston une masse qui impose \(P_{\text{ext}}=P_f=5\ \text{bar}\). Premier principe : \(C_V(T_f-T_i)=-P_f(V_f-V_i)\), avec \(P_fV_f=nRT_f\) et \(V_i=nRT_i/P_i\), d'où \(T_f=T_i\dfrac{1+(\gamma-1)P_f/P_i}{\gamma}\approx628\ \text{K}\). Travail reçu \(\approx6\,960\ \text{J}\) ; \(S_{\text{créée}}=\Delta S=C_P\ln\dfrac{T_f}{T_i}-nR\ln\dfrac{P_f}{P_i}\approx8{,}8\ \text{J·K}^{-1}\).</li>
  </ul>

<div class="course-section">
  <div class="sec-num">§10 · ENTROPIE ET CHANGEMENT D'ÉTAT</div>
  <h2>La relation Δh₁₂ = T Δs₁₂</h2>
  <div class="intro">Fondre, vaporiser, sublimer : un changement d'état à température constante absorbe une enthalpie de changement d'état et augmente fortement l'entropie. Les deux sont reliées par une formule simple, au programme.</div>
  <div class="prop-box">
    <strong>Entropie de changement d'état.</strong> Pour la transition de la phase 1 à la phase 2 à la température d'équilibre \(T\) (en kelvins), sous la pression d'équilibre :
    <div class="formula" data-nom="Entropie de changement d'état">$$\Delta h_{12}(T)=T\,\Delta s_{12}(T)\qquad\text{soit}\qquad\Delta S=\frac{m\,\Delta h_{12}}T$$</div>
    \(\Delta s_{12}\) est l'entropie massique de changement d'état. Justification : la transition à l'équilibre est réversible, et la chaleur reçue \(m\,\Delta h_{12}\) l'est à la température constante \(T\). Détails et bilans : chapitre <a href="#changement/cours">« Corps pur diphasé et changements d'état »</a>, §9 et §10.
  </div>
  <p>Ordres de grandeur pour l'eau : \(\Delta s_{\text{fus}}=334/273{,}15\approx1{,}22\ \text{kJ·K}^{-1}\text{·kg}^{-1}\) ; \(\Delta s_{\text{vap}}(100\ ^\circ\text{C})=2\,257/373{,}15\approx6{,}05\ \text{kJ·K}^{-1}\text{·kg}^{-1}\). La vaporisation augmente beaucoup plus l'entropie que la fusion : le gaz est bien plus désordonné que le liquide (§3).</p>
  <div class="method-box">
    <strong>Exemple — un glaçon qui fond dans une pièce</strong>
    <p>Un glaçon de 20 g à 0 °C fond dans une pièce à 20 °C, puis l'eau formée se réchauffe jusqu'à 20 °C (\(\Delta h_{\text{fus}}=334\ \text{kJ·kg}^{-1}\), \(c=4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\)).</p>
    <ol>
      <li>Extensivité, deux étapes (fusion à 0 °C, puis échauffement de l'eau) :
      <div class="formula">$$\Delta S=\frac{m\,\Delta h_{\text{fus}}}{273{,}15}+mc\ln\frac{293{,}15}{273{,}15}=24{,}5+5{,}9\approx30{,}4\ \text{J·K}^{-1}$$</div></li>
      <li>Chaleur reçue de la pièce : \(Q=m\,\Delta h_{\text{fus}}+mc\times20=8\,352\ \text{J}\) ; \(S_{\text{éch}}=Q/293{,}15\approx28{,}5\ \text{J·K}^{-1}\).</li>
      <li>\(S_{\text{créée}}\approx1{,}9\ \text{J·K}^{-1}\gt0\) : la fusion elle-même serait réversible au contact d'un thermostat à 0 °C ; l'irréversibilité vient de l'écart de 20 °C avec la pièce.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : utiliser \(\Delta h_{12}=T\Delta s_{12}\) avec \(T\) en degrés Celsius, ou à une température qui n'est pas celle du changement d'état. Autre erreur : appliquer \(\Delta S=Q/T\) à toute la transformation alors que la température de l'eau varie après la fusion.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · CYCLES : CE QU'IMPOSE LE DEUXIÈME PRINCIPE</div>
  <h2>Inégalité de Clausius, pas de moteur monotherme</h2>
  <div class="intro">Pour un système qui décrit un cycle, les fonctions d'état reviennent à leur valeur initiale. Le deuxième principe devient alors une contrainte sur les seuls échanges : c'est le point de départ de l'étude des machines thermiques.</div>
  <div class="prop-box">
    <strong>Inégalité de Clausius.</strong> Sur un cycle, \(\Delta S=0\), donc \(S_{\text{éch}}=-S_{\text{créée}}\) :
    <div class="formula" data-nom="Inégalité de Clausius">$$\sum_i\frac{Q_i}{T_i}=-S_{\text{créée}}\leq0$$</div>
    avec égalité pour un cycle réversible.
  </div>
  <p><strong>Pas de moteur monotherme.</strong> Si le système n'échange de la chaleur qu'avec une source à \(T_0\), \(Q/T_0\leq0\), donc \(Q\leq0\) et, par le premier principe sur le cycle, \(W=-Q\geq0\) : un cycle monotherme ne peut que <em>recevoir</em> du travail (énoncé de Kelvin). Plus précisément \(W=T_0S_{\text{créée}}\) : le travail reçu est intégralement perdu en chaleur. Un moteur doit échanger avec au moins deux sources : rendement, théorème de Carnot et cycles réels sont l'objet du chapitre <a href="#machines/cours">« Machines thermiques »</a> (§2, §4, §5).</p>
  <div class="method-box">
    <strong>Exemple — un inventeur trop optimiste</strong>
    <ol>
      <li>Un moteur cyclique recevrait 1 000 J d'une source à 600 K et n'en céderait que 400 J à une source à 300 K, fournissant 600 J de travail.</li>
      <li>\(\sum Q_i/T_i=\dfrac{1\,000}{600}-\dfrac{400}{300}=+0{,}33\ \text{J·K}^{-1}\gt0\) : impossible. Son rendement (0,60) dépasserait d'ailleurs celui de Carnot, \(1-300/600=0{,}50\).</li>
      <li>En cédant 700 J, il fournirait 300 J : \(\sum Q_i/T_i=-0{,}67\ \text{J·K}^{-1}\), possible, avec \(S_{\text{créée}}=0{,}67\ \text{J·K}^{-1}\) par cycle.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\Delta S\gt0\) pour un cycle irréversible. Sur un cycle, \(\Delta S=0\) toujours (fonction d'état) ; c'est l'entropie <em>créée</em> qui est positive, compensée par une entropie échangée négative : la machine rejette de l'entropie vers les sources.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>D'où viennent les expressions de l'entropie</h2>
  <div class="intro">Ces compléments sont exigibles en 2ᵉ année (chapitre <a href="#thermodiff/cours">« Thermodynamique différentielle et fluides réels »</a>, §2) ou hors de tout programme ; ils éclairent les expressions fournies en PTSI.</div>
  <p><strong>Identités thermodynamiques</strong> (vues en 2ᵉ année). Pour une transformation élémentaire réversible d'un système fermé, \(\delta W=-P\,\mathrm{d}V\) et \(\delta Q=T\,\mathrm{d}S\), donc \(\mathrm{d}U=T\,\mathrm{d}S-P\,\mathrm{d}V\), et, avec \(H=U+PV\), \(\mathrm{d}H=T\,\mathrm{d}S+V\,\mathrm{d}P\). Ces relations ne lient que des fonctions d'état : elles valent pour toute transformation entre deux états d'équilibre voisins. Pour un gaz parfait, \(\mathrm{d}U=C_V\,\mathrm{d}T\) et \(P/T=nR/V\) donnent \(\mathrm{d}S=C_V\,\mathrm{d}T/T+nR\,\mathrm{d}V/V\), d'où l'expression du §4 ; pour une phase condensée, \(\mathrm{d}S=C\,\mathrm{d}T/T\).</p>
  <p><strong>Entropie de mélange.</strong> Deux gaz parfaits différents, \(n_1\) et \(n_2\) moles à la même température et à la même pression, se mélangent en ouvrant une cloison. Chacun se détend dans tout le volume : \(\Delta S=-R\left(n_1\ln x_1+n_2\ln x_2\right)\gt0\), où \(x_k\) est la fraction molaire. Pour une mole d'air reconstituée à partir d'azote et d'oxygène séparés, \(\Delta S\approx4{,}3\ \text{J·K}^{-1}\). Si les deux gaz sont identiques, il ne se passe rien : rien n'est créé (paradoxe de Gibbs).</p>
  <p><strong>Troisième principe.</strong> L'entropie d'un cristal parfait tend vers 0 quand \(T\) tend vers 0 K : il n'a plus qu'une configuration (\(\Omega=1\)). On peut ainsi définir une entropie absolue, tabulée pour les espèces chimiques (thermochimie de 2ᵉ année).</p>
</div>
</template>
<template class="pan-tpl" data-panneau="th3-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · 2E PRINCIPE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 3.4 du programme : définir le système et ses sources, calculer \(\Delta S\) avec l'expression fournie, calculer \(S_{\text{éch}}\), conclure par \(S_{\text{créée}}\), utiliser la loi de Laplace, et traiter les situations types (contact thermique, dissipation, détente ou compression, changement d'état, cycle). Notations : \(S_{\text{éch}}=\sum_iQ_i/T_i\), \(S_{\text{créée}}\geq0\), températures en kelvins, transferts thermiques reçus par le système.</div>

  <div class="method-box"><strong>Méthode 1 — Définir le système et repérer les sources</strong>
    <ol>
      <li><span class="step">Système fermé.</span> Choisir ce qui évolue (gaz, eau, eau et calorimètre…) et le délimiter par une frontière.</li>
      <li><span class="step">Sources.</span> Repérer chaque thermostat (air ambiant, lac, four, bain) et sa température ; une paroi calorifugée ou une évolution très rapide : pas d'échange.</li>
      <li><span class="step">Choix utile.</span> Englober deux corps qui échangent entre eux dans un seul système calorifugé : il n'y a plus qu'à calculer \(\Delta S\), égal à \(S_{\text{créée}}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un bloc chaud plongé dans un seau d'eau, le tout dans l'air ambiant. Si l'échange avec l'air est lent devant l'équilibre bloc-eau, système = bloc et eau, calorifugé pendant l'équilibre ; l'air n'intervient qu'ensuite, comme thermostat.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Calculer ΔS avec l'expression fournie</strong>
    <ol>
      <li><span class="step">Reconnaître</span> le modèle : gaz parfait, phase condensée, thermostat, changement d'état.</li>
      <li><span class="step">Choisir la forme</span> dont les variables sont connues : \((T,V)\), \((T,P)\) ou \((P,V)\) pour un gaz parfait.</li>
      <li><span class="step">Calculer</span> entre l'état initial et l'état final, températures en kelvins, sans se soucier du chemin (fonction d'état).</li>
      <li><span class="step">Additionner</span> les \(\Delta S\) des différentes parties (extensivité).</li>
    </ol>
    <p><em>Exemple éclair :</em> 0,50 kg de cuivre (\(c=385\ \text{J·K}^{-1}\text{·kg}^{-1}\)) chauffé de 20 °C à 200 °C : \(\Delta S=0{,}50\times385\ln\dfrac{473{,}15}{293{,}15}\approx+92\ \text{J·K}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : températures en degrés Celsius dans un logarithme ; écrire \(\Delta S=Q/T\) pour un corps dont la température varie ; oublier que \(\Delta S\) peut être négatif (corps qui refroidit, gaz comprimé à température constante).</div>

  <div class="method-box"><strong>Méthode 3 — Calculer l'entropie échangée</strong>
    <ol>
      <li><span class="step">Transferts thermiques.</span> Les obtenir par le premier principe (\(Q=\Delta U-W\), ou \(Q=\Delta H\) en monobare), comptés positivement quand le système reçoit.</li>
      <li><span class="step">Températures.</span> Celles des sources (ou de la frontière), constantes pour un thermostat : \(S_{\text{éch}}=\sum_iQ_i/T_i\).</li>
      <li><span class="step">Cas simples.</span> Adiabatique : \(S_{\text{éch}}=0\). Réversible : \(S_{\text{éch}}=\Delta S\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une tasse cède 2,0 kJ à l'air de la pièce, à 20 °C : \(S_{\text{éch}}=-2\,000/293{,}15\approx-6{,}8\ \text{J·K}^{-1}\) pour la tasse.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Faire un bilan d'entropie et conclure</strong>
    <ol>
      <li><span class="step">Bilan.</span> \(S_{\text{créée}}=\Delta S-S_{\text{éch}}\).</li>
      <li><span class="step">Signe.</span> \(S_{\text{créée}}\gt0\) : irréversible ; \(=0\) : réversible ; \(\lt0\) : erreur de calcul, ou transformation impossible.</li>
      <li><span class="step">Cause.</span> Nommer l'irréversibilité : écart de température, frottement, effet Joule, détente brutale, mélange.</li>
      <li><span class="step">Contrôle.</span> L'ensemble système et sources, isolé, doit gagner exactement \(S_{\text{créée}}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> 1,0 kg d'eau refroidi de 80 °C à 20 °C par l'air à 20 °C : \(\Delta S=-778\ \text{J·K}^{-1}\), \(S_{\text{éch}}=-250\,800/293{,}15\approx-856\ \text{J·K}^{-1}\), \(S_{\text{créée}}\approx+77\ \text{J·K}^{-1}\) : irréversible (écart de température).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Utiliser la loi de Laplace</strong>
    <ol>
      <li><span class="step">Vérifier les conditions</span> : gaz parfait, \(\gamma\) constant, adiabatique, réversible (quasi statique, sans frottement).</li>
      <li><span class="step">Choisir la forme</span> selon les données : \(PV^\gamma\), \(TV^{\gamma-1}\) ou \(T^\gamma P^{1-\gamma}\) constant.</li>
      <li><span class="step">Compléter</span> par l'équation d'état \(PV=nRT\) et, pour le travail, par le premier principe \(W=\Delta U=C_V\Delta T\).</li>
    </ol>
    <p><em>Exemple éclair :</em> l'air d'une pompe à vélo (20 °C) comprimé de 1,0 à 2,5 bar, assez vite pour être adiabatique, assez lentement pour être quasi statique : \(T_f=293{,}15\times2{,}5^{0{,}4/1{,}4}\approx381\ \text{K}\), soit 108 °C. C'est pourquoi l'embout chauffe.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer Laplace à une compression brutale (pression extérieure imposée d'un coup) ou à une transformation où le gaz échange de la chaleur. Dans ces cas : premier principe pour l'état final, puis \(\Delta S\) par l'expression fournie.</div>

  <div class="method-box"><strong>Méthode 6 — Traiter un contact thermique</strong>
    <ol>
      <li><span class="step">Température finale</span> par le premier principe : \(\sum_kC_k(T_f-T_k)=0\) (calorimètre), ou \(T_f=T_0\) (thermostat).</li>
      <li><span class="step">Entropie</span> : \(S_{\text{créée}}=\sum_kC_k\ln(T_f/T_k)\) pour deux corps calorifugés ; \(C(x-1-\ln x)\), \(x=T_i/T_0\), avec un thermostat.</li>
      <li><span class="step">Précision</span> : garder \(T_f\) exacte, la différence de grands nombres est sensible.</li>
    </ol>
    <p><em>Exemple éclair :</em> 1,0 kg de fer (\(c=450\ \text{J·K}^{-1}\text{·kg}^{-1}\)) à 100 °C plongé dans 2,0 kg d'eau à 20 °C : \(T_f\approx297{,}24\ \text{K}\) (24,1 °C) et \(S_{\text{créée}}\approx+13\ \text{J·K}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Chiffrer une dissipation (frottement, effet Joule)</strong>
    <ol>
      <li><span class="step">Énergie dissipée</span> \(W_d\) : énergie mécanique perdue, ou \(RI^2\Delta t\).</li>
      <li><span class="step">Système revenu à son état</span> (régime permanent, objet refroidi) : \(\Delta S=0\), la chaleur \(W_d\) part dans l'ambiance à \(T_0\).</li>
      <li><span class="step">Conclure</span> : \(S_{\text{créée}}=W_d/T_0\). Si le système est calorifugé, il s'échauffe et \(S_{\text{créée}}=\Delta S\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un skieur de 70 kg descend 100 m de dénivelé à vitesse constante sur une neige à −5 °C : toute l'énergie potentielle est dissipée, \(S_{\text{créée}}=mgh/T_0=68\,700/268{,}15\approx256\ \text{J·K}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Traiter une détente ou une compression d'un gaz parfait</strong>
    <ol>
      <li><span class="step">État final</span> par les conditions imposées et le premier principe (Joule-Gay-Lussac : \(\Delta U=0\) ; monobare : \(W=-P_{\text{ext}}\Delta V\)).</li>
      <li><span class="step">\(\Delta S\)</span> par l'expression fournie, quel que soit le chemin.</li>
      <li><span class="step">Comparer</span> au chemin réversible entre les mêmes états : le travail « perdu » vaut \(T_0S_{\text{créée}}\) au contact d'un thermostat \(T_0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> 2 moles se détendent de 10 L à 30 L à 300 K : \(\Delta S=2R\ln3\approx18{,}3\ \text{J·K}^{-1}\), que la détente soit réversible, brutale ou dans le vide ; seuls \(S_{\text{éch}}\) et \(S_{\text{créée}}\) changent.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Faire un bilan avec changement d'état</strong>
    <ol>
      <li><span class="step">Découper</span> le chemin : échauffement de chaque phase, changement d'état à la température d'équilibre.</li>
      <li><span class="step">Changement d'état</span> : \(\Delta S=m\,\Delta h_{12}/T_{12}\) (\(T_{12}\) en kelvins), positif pour fusion, vaporisation, sublimation.</li>
      <li><span class="step">Additionner</span>, puis faire le bilan comme d'habitude (méthode 4).</li>
    </ol>
    <p><em>Exemple éclair :</em> 10 g de vapeur à 100 °C se condensent sur une vitre : \(\Delta S=-0{,}010\times2\,257\times10^3/373{,}15\approx-60\ \text{J·K}^{-1}\) ; l'entropie diminue, l'air plus froid qui reçoit la chaleur en gagne davantage.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Tester la possibilité d'une machine cyclique</strong>
    <ol>
      <li><span class="step">Premier principe</span> sur le cycle : \(W+\sum Q_i=0\).</li>
      <li><span class="step">Deuxième principe</span> : \(\Delta S=0\), donc \(\sum Q_i/T_i=-S_{\text{créée}}\leq0\) (inégalité de Clausius).</li>
      <li><span class="step">Conclure</span> : possible si \(\sum Q_i/T_i\leq0\), réversible si \(=0\). Une seule source : \(W\geq0\), jamais de moteur (chapitre « Machines thermiques »).</li>
    </ol>
    <p><em>Exemple éclair :</em> un moteur annoncé reçoit 1 000 J à 600 K et cède 400 J à 300 K : \(\sum Q_i/T_i=+0{,}33\ \text{J·K}^{-1}\gt0\), impossible.</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : « adiabatique donc isentropique » (il faut aussi la réversibilité) ; « l'entropie d'un système ne peut qu'augmenter » (seule l'entropie créée est positive, ou l'entropie d'un système calorifugé) ; « ΔS > 0 sur un cycle irréversible » (sur un cycle, \(\Delta S=0\) toujours) ; utiliser la température du système au lieu de celle de la source dans \(S_{\text{éch}}\) ; calculer une variation d'entropie avec la formule de Boltzmann (elle sert à interpréter, pas à calculer en PTSI).</div>
</div>
</template>

  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Bilan entropique d'une phase condensée</h3>
  <div class="statement">On chauffe \(m=500\ \text{g}\) d'eau liquide (\(c=4{,}18\ \text{J·K}^{-1}\text{·g}^{-1}\)) de \(\theta_i=20\ ^\circ\text{C}\) à \(\theta_f=80\ ^\circ\text{C}\) en la plaçant au contact d'un thermostat à \(100\ ^\circ\text{C}\). La transformation est monobare.</div>
  <div class="q"><strong>Q1.</strong> Calculer la variation d'entropie \(\Delta S\) de l'eau.</div>
  <div class="q"><strong>Q2.</strong> Calculer le transfert thermique \(Q\) reçu par l'eau, puis \(S_{\text{éch}}\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(S_{\text{créée}}\) et commenter.</div>
  <div class="q"><strong>Q4.</strong> Reprendre le calcul avec un thermostat à 80 °C. Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Phase condensée : \(\Delta S=C\ln(T_f/T_i)\), avec \(C=mc=2\,090\ \text{J·K}^{-1}\) et les températures en kelvins : \(\Delta S=2\,090\ln\dfrac{353{,}15}{293{,}15}\approx+389\ \text{J·K}^{-1}\).</p>
    <p><strong>Q2.</strong> Monobare, équilibre mécanique au début et à la fin : \(Q=\Delta H=C\,\Delta T=2\,090\times60=125\,400\ \text{J}\). \(S_{\text{éch}}=Q/T_0=125\,400/373{,}15\approx336\ \text{J·K}^{-1}\).</p>
    <p><strong>Q3.</strong> \(S_{\text{créée}}=389-336\approx+53\ \text{J·K}^{-1}\gt0\) : transformation irréversible, à cause de l'écart de température entre l'eau (de 20 à 80 °C) et le thermostat (100 °C).</p>
    <p><strong>Q4.</strong> \(\Delta S\) et \(Q\) sont inchangés (mêmes états) ; \(S_{\text{éch}}=125\,400/353{,}15\approx355\ \text{J·K}^{-1}\), donc \(S_{\text{créée}}\approx34\ \text{J·K}^{-1}\) : un écart de température plus faible crée moins d'entropie. Elle ne s'annulerait qu'avec une suite infinie de thermostats (cours, §7).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Détente isotherme : réversible ou brutale</h3>
  <div class="statement">Une mole de gaz parfait passe de l'état A (\(T_0=300\ \text{K}\), \(P_1=4{,}0\ \text{bar}\)) à l'état B (\(T_0\), \(P_2=P_1/2\), donc \(V_2=2V_1\)), au contact d'un thermostat à \(T_0\). Deux chemins : (1) détente quasi statique (réversible) ; (2) détente brutale contre une pression extérieure constante \(P_2\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\Delta S\). Pourquoi est-ce la même valeur pour les deux chemins ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(W\) et \(Q\) pour chaque chemin, puis \(S_{\text{éch}}\) et \(S_{\text{créée}}\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier \(S_{\text{créée}}\geq0\) et identifier la cause d'irréversibilité.</div>
  <div class="q"><strong>Q4.</strong> Comparer le travail fourni par le gaz sur les deux chemins. Relier l'écart à \(T_0S_{\text{créée}}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S\) est une fonction d'état : \(\Delta S\) ne dépend que de A et B. Isotherme d'un gaz parfait : \(\Delta S=nR\ln(V_2/V_1)\), soit \(8{,}314\ln2\approx+5{,}76\ \text{J·K}^{-1}\).</p>
    <p><strong>Q2.</strong> Chemin 1 : \(W_1=-nRT_0\ln2\approx-1\,729\ \text{J}\) ; \(\Delta U=0\) (isotherme, gaz parfait), donc \(Q_1=+1\,729\ \text{J}\) ; \(S_{\text{éch},1}=Q_1/T_0=5{,}76\ \text{J·K}^{-1}\) et \(S_{\text{créée},1}=0\). Chemin 2 : \(W_2=-P_2(V_2-V_1)=-P_2V_1\), soit \(-nRT_0/2\approx-1\,247\ \text{J}\), \(Q_2=+1\,247\ \text{J}\), \(S_{\text{éch},2}\approx4{,}16\ \text{J·K}^{-1}\) et \(S_{\text{créée},2}\approx+1{,}61\ \text{J·K}^{-1}\).</p>
    <p><strong>Q3.</strong> Les deux valeurs sont positives ou nulles. Sur le chemin 2, la pression du gaz est très supérieure à la pression extérieure au début : la détente est brutale (inhomogénéité de pression, mouvements internes amortis par viscosité).</p>
    <p><strong>Q4.</strong> Le gaz fournit 1 729 J sur le chemin réversible, 1 247 J sur le chemin brutal : 482 J de moins, exactement \(T_0S_{\text{créée},2}=300\times1{,}61\). L'entropie créée mesure le travail perdu.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Mélange thermique et irréversibilité</h3>
  <div class="statement">On mélange \(m_1=300\ \text{g}\) d'eau à \(80\ ^\circ\text{C}\) et \(m_2=200\ \text{g}\) d'eau à \(20\ ^\circ\text{C}\) dans un calorimètre de capacité négligeable, sous pression atmosphérique. \(c=4{,}18\ \text{J·K}^{-1}\text{·g}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la température finale.</div>
  <div class="q"><strong>Q2.</strong> Calculer la variation d'entropie de chaque masse d'eau.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(S_{\text{créée}}\) et conclure.</div>
  <div class="q"><strong>Q4.</strong> Un élève prend 353 K et 293 K, et trouve une température finale de 328,9 K au lieu de 329,0 K. Quelle entropie créée obtient-il ? Qu'en conclure sur la précision des calculs ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Calorimètre calorifugé, monobare : \(\Delta H=0\), soit \(m_1c(T_f-T_1)+m_2c(T_f-T_2)=0\) : \(T_f=\dfrac{m_1T_1+m_2T_2}{m_1+m_2}\), soit \(0{,}6\times353{,}15+0{,}4\times293{,}15=329{,}15\ \text{K}\) (56 °C).</p>
    <p><strong>Q2.</strong> \(\Delta S_1=m_1c\ln\dfrac{T_f}{T_1}\), soit \(1\,254\ln\dfrac{329{,}15}{353{,}15}\approx-88{,}3\ \text{J·K}^{-1}\) ; \(\Delta S_2=836\ln\dfrac{329{,}15}{293{,}15}\approx+96{,}8\ \text{J·K}^{-1}\).</p>
    <p><strong>Q3.</strong> Ensemble calorifugé : \(S_{\text{éch}}=0\), donc \(S_{\text{créée}}=\Delta S_1+\Delta S_2\approx+8{,}6\ \text{J·K}^{-1}\gt0\) : irréversible, à cause du transfert thermique sous un écart fini de température. On ne voit jamais un verre d'eau tiède se séparer en eau chaude et eau froide.</p>
    <p><strong>Q4.</strong> \(\Delta S_1=1\,254\ln\dfrac{328{,}9}{353}\approx-88{,}7\ \text{J·K}^{-1}\) et \(\Delta S_2=836\ln\dfrac{328{,}9}{293}\approx+96{,}6\ \text{J·K}^{-1}\), d'où 8,0 J/K au lieu de 8,6 : une erreur de 0,1 K sur \(T_f\) fausse le résultat de 7 %, car \(S_{\text{créée}}\) est une petite différence de deux grands nombres. Avec la valeur exacte 329,0 K, on retrouve 8,6 J/K. Il faut garder \(T_f\) exacte et quatre chiffres significatifs dans les logarithmes. (Une version précédente de cet exercice donnait 7,8 J/K pour cette raison.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ★</span>
  <h3>Compression adiabatique : réversible ou brutale</h3>
  <div class="statement">Une mole d'air (gaz parfait, \(\gamma=1{,}4\), \(C_V=\tfrac52R\)) est dans un cylindre calorifugé, à \(T_i=300\ \text{K}\) et \(P_i=1{,}0\ \text{bar}\). On la comprime jusqu'à \(P_f=10\ \text{bar}\) par deux chemins : (1) lentement, sans frottement ; (2) brutalement, en posant sur le piston une masse qui impose d'emblée la pression extérieure constante \(P_f\).</div>
  <div class="q"><strong>Q1.</strong> Chemin 1 : calculer la température finale, le rapport des volumes \(V_i/V_f\) et \(\Delta S\).</div>
  <div class="q"><strong>Q2.</strong> Chemin 2 : par le premier principe, montrer que \(T_f=T_i\,\dfrac{1+(\gamma-1)P_f/P_i}{\gamma}\). Calculer \(T_f\) et \(V_i/V_f\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\Delta S\) et \(S_{\text{créée}}\) pour le chemin 2, puis les travaux reçus sur les deux chemins. Interpréter.</div>
  <div class="q"><strong>Q4.</strong> Montrer qu'une compression brutale de ce type ne peut pas diviser le volume par plus de \(\gamma/(\gamma-1)\). Pourquoi l'énoncé « on comprime brutalement l'air jusqu'au quart de son volume, sous une pression extérieure égale à la pression finale » est-il impossible ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Gaz parfait, adiabatique, réversible : loi de Laplace. \(T_f=T_i(P_f/P_i)^{(\gamma-1)/\gamma}\), soit \(300\times10^{0{,}286}\approx579\ \text{K}\) ; \(V_i/V_f=(P_f/P_i)^{1/\gamma}=10^{0{,}714}\approx5{,}18\) ; \(\Delta S=0\).</p>
    <p><strong>Q2.</strong> \(\Delta U=W\) (adiabatique) : </p>
    <div class="formula">$$C_V(T_f-T_i)=-P_f(V_f-V_i)=-nRT_f+nRT_i\frac{P_f}{P_i}$$</div>
    <p>Avec \(C_V+nR=C_P=\gamma C_V\) et \(nR=(\gamma-1)C_V\) : \(\gamma T_f=T_i\left[1+(\gamma-1)P_f/P_i\right]\). D'où \(T_f=300\times5/1{,}4\approx1\,071\ \text{K}\), et \(V_i/V_f=\dfrac{P_fT_i}{P_iT_f}\approx2{,}80\).</p>
    <p><strong>Q3.</strong> \(\Delta S=C_P\ln\dfrac{T_f}{T_i}-nR\ln\dfrac{P_f}{P_i}\), soit \(R\left[3{,}5\ln3{,}571-\ln10\right]\approx+17{,}9\ \text{J·K}^{-1}\) ; adiabatique, donc \(S_{\text{créée}}=\Delta S\gt0\). Travaux reçus \(W=C_V\Delta T\) : 5,8 kJ (chemin 1) contre 16,0 kJ (chemin 2). La compression brutale coûte presque trois fois plus de travail pour atteindre la même pression : le surplus a seulement chauffé le gaz, d'où l'entropie créée.</p>
    <p><strong>Q4.</strong> \(\dfrac{V_i}{V_f}=\dfrac{\gamma P_f/P_i}{1+(\gamma-1)P_f/P_i}\) croît avec \(P_f\) vers \(\gamma/(\gamma-1)=3{,}5\) sans l'atteindre. Imposer \(V_f=V_i/4\) donnerait, par le premier principe, \(\tfrac52(T_f-T_i)=3T_f\), soit une température finale négative : un tel état n'existe pas. (Cet énoncé figurait dans une version précédente de cet exercice, avec une erreur de signe qui menait à 600 K.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Bilan complet : gaz parfait au contact de deux thermostats</h3>
  <div class="statement">Une mole de gaz parfait monoatomique (\(C_V=\tfrac32R\)) passe de l'état A (\(T_A=400\ \text{K}\), \(V_A\)) à l'état B (\(T_B=300\ \text{K}\), \(V_B=2V_A\)). Elle échange de la chaleur avec deux thermostats seulement : la source chaude à \(T_1=400\ \text{K}\), qui lui fournit \(Q_1=+800\ \text{J}\), et la source froide à \(T_2=300\ \text{K}\), qui lui fournit \(Q_2\). Le gaz reçoit le travail \(W=-1\,000\ \text{J}\) (il fournit 1 000 J).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\Delta U\), puis \(Q_2\). Commenter son signe.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\Delta S\), \(S_{\text{éch}}\) et \(S_{\text{créée}}\). La transformation est-elle possible ?</div>
  <div class="q"><strong>Q3.</strong> \(Q_1=800\ \text{J}\) étant fixé, quel travail maximal le gaz peut-il fournir entre A et B ? Dans quelles conditions ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta U=\tfrac32R(T_B-T_A)\approx-1\,247\ \text{J}\). Premier principe : \(Q_2=\Delta U-W-Q_1\), soit \(-1\,247+1\,000-800\approx-1\,047\ \text{J}\) : le gaz cède 1 047 J à la source froide.</p>
    <p><strong>Q2.</strong> \(\Delta S=C_V\ln\dfrac{T_B}{T_A}+R\ln\dfrac{V_B}{V_A}\), soit \(8{,}314\,(1{,}5\ln0{,}75+\ln2)\approx+2{,}18\ \text{J·K}^{-1}\). \(S_{\text{éch}}=\dfrac{800}{400}+\dfrac{-1\,047}{300}\approx-1{,}49\ \text{J·K}^{-1}\). \(S_{\text{créée}}\approx+3{,}67\ \text{J·K}^{-1}\gt0\) : transformation possible, irréversible.</p>
    <p><strong>Q3.</strong> \(S_{\text{créée}}\geq0\) impose \(S_{\text{éch}}\leq\Delta S\), soit \(\dfrac{Q_2}{300}\leq2{,}18-2\), \(Q_2\leq+52\ \text{J}\). Alors \(W=\Delta U-Q_1-Q_2\geq-1\,247-800-52\), soit \(W\geq-2\,100\ \text{J}\) : le gaz fournit au plus 2,1 kJ, en recevant même un peu de chaleur de la source froide, et seulement si la transformation est réversible (échanges sans écart de température, sans frottement). Le deuxième principe limite le travail qu'on peut tirer d'une évolution, comme pour les machines thermiques.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Pompe à chaleur : ce que permet le deuxième principe</h3>
  <div class="statement">Une pompe à chaleur chauffe une maison à \(T_C=293{,}15\ \text{K}\) (20 °C) en prélevant de l'énergie à l'air extérieur à \(T_F=273{,}15\ \text{K}\) (0 °C). En régime permanent, elle reçoit une puissance électrique \(\mathcal P_W=1{,}0\ \text{kW}\). On raisonne sur une seconde de fonctionnement (énergies reçues par le fluide : \(W\), \(Q_C\), \(Q_F\)). Notations du chapitre « Machines thermiques ».</div>
  <div class="q"><strong>Q1.</strong> Calculer l'efficacité maximale \(e_{PAC,C}=T_C/(T_C-T_F)\) permise par le deuxième principe.</div>
  <div class="q"><strong>Q2.</strong> La machine réelle a une efficacité \(e_{PAC}=-Q_C/W=3{,}0\). Calculer \(Q_C\), \(Q_F\), puis l'entropie créée par seconde. Comparer à un radiateur électrique.</div>
  <div class="q"><strong>Q3.</strong> Quelle puissance électrique minimale suffirait pour fournir les mêmes 3,0 kW à la maison ? Montrer que l'écart avec 1,0 kW vaut \(T_FS_{\text{créée}}\) par seconde.</div>
  <div class="q"><strong>Q4.</strong> En été, la machine climatise la maison (25 °C) quand il fait 35 °C dehors. Calculer l'efficacité de Carnot du climatiseur. Pourquoi est-elle si grande ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(e_{PAC,C}=293{,}15/20\approx14{,}7\).</p>
    <p><strong>Q2.</strong> Par seconde : \(W=1{,}0\ \text{kJ}\), \(Q_C=-e_{PAC}W=-3{,}0\ \text{kJ}\) (cédés à la maison), et sur un cycle \(Q_F=-W-Q_C=+2{,}0\ \text{kJ}\) (pris dehors). Le fluide décrivant des cycles, \(\Delta S=0\) : \(S_{\text{créée}}=-\left(\dfrac{Q_C}{T_C}+\dfrac{Q_F}{T_F}\right)\), soit \(\dfrac{3\,000}{293{,}15}-\dfrac{2\,000}{273{,}15}\approx2{,}9\ \text{J·K}^{-1}\) par seconde. Un radiateur électrique fournirait 1,0 kW seulement ; la pompe en fournit 3,0, dont 2,0 pris à l'air extérieur.</p>
    <p><strong>Q3.</strong> Avec \(S_{\text{créée}}=0\) : \(W_{\min}=-Q_C\left(1-T_F/T_C\right)\), soit \(3\,000\times\dfrac{20}{293{,}15}\approx205\ \text{J}\), soit 0,20 kW. En général, \(Q_F=-W-Q_C\) et \(S_{\text{créée}}=-Q_C/T_C-Q_F/T_F\) donnent \(W=W_{\min}+T_FS_{\text{créée}}\) : \(273{,}15\times2{,}91\approx795\ \text{J}\), soit bien \(1\,000-205\). Les irréversibilités coûtent 0,8 kW sur 1,0 kW.</p>
    <p><strong>Q4.</strong> \(e_{F,C}=T_F/(T_C-T_F)=298{,}15/10\approx30\) : l'écart de température à franchir n'est que de 10 K. Les climatiseurs réels atteignent 3 à 5, à cause des écarts de température dans les échangeurs et des autres irréversibilités (chapitre « Machines thermiques », §6).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Freiner une voiture, lâcher une pierre</h3>
  <div class="statement">(a) Une voiture de 1 200 kg roulant à 90 km/h freine jusqu'à l'arrêt sur une route horizontale ; ses freins, échauffés, reviennent ensuite à la température de l'air, 20 °C. (b) Une pierre de 2,0 kg tombe d'une hauteur de 5,0 m dans un lac à 15 °C et s'immobilise au fond.</div>
  <div class="q"><strong>Q1.</strong> Pour (a), choisir le système, puis calculer \(\Delta S\), \(Q\) et \(S_{\text{créée}}\).</div>
  <div class="q"><strong>Q2.</strong> Même question pour (b).</div>
  <div class="q"><strong>Q3.</strong> Identifier la cause d'irréversibilité. Pourquoi ne voit-on jamais une voiture repartir en refroidissant ses freins ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système : voiture (et freins). État final : arrêtée, freins revenus à 20 °C : son état thermodynamique interne est inchangé, \(\Delta S=0\). Bilan d'énergie : l'énergie cinétique \(\tfrac12mv^2=\tfrac12\times1\,200\times25^2=375\ \text{kJ}\) a été cédée à l'air, \(Q=-375\ \text{kJ}\). \(S_{\text{éch}}=Q/T_0\approx-1\,279\ \text{J·K}^{-1}\), donc \(S_{\text{créée}}\approx+1\,280\ \text{J·K}^{-1}\).</p>
    <p><strong>Q2.</strong> Système : la pierre. Elle finit à la température du lac, état inchangé (\(\Delta S=0\)) ; son énergie potentielle \(mgh=98{,}1\ \text{J}\) est cédée à l'eau : \(S_{\text{créée}}=mgh/T_0\), soit \(98{,}1/288{,}15\approx0{,}34\ \text{J·K}^{-1}\).</p>
    <p><strong>Q3.</strong> Frottements (freins, résistance de l'eau) : de l'énergie mécanique est dissipée en énergie interne puis en chaleur. L'évolution inverse demanderait \(S_{\text{créée}}\lt0\) : elle respecterait le premier principe, pas le deuxième.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ☆ ☆</span>
  <h3>Résistance chauffante</h3>
  <div class="statement">Une résistance \(R=50\ \Omega\) est parcourue par un courant \(I=2{,}0\ \text{A}\).</div>
  <div class="q"><strong>Q1.</strong> En régime permanent, elle est à température constante et cède sa chaleur à l'air ambiant, à 20 °C. Calculer l'entropie créée en 10 minutes.</div>
  <div class="q"><strong>Q2.</strong> On l'enferme dans une enveloppe parfaitement calorifugée ; sa capacité thermique vaut \(C=100\ \text{J·K}^{-1}\), et elle part de 20 °C. Calculer sa température et l'entropie créée au bout de 10 s.</div>
  <div class="q"><strong>Q3.</strong> Où se trouve l'irréversibilité dans les deux cas ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système : la résistance, d'état inchangé (\(\Delta S=0\)). Elle reçoit le travail électrique \(RI^2\Delta t=200\times600=120\ \text{kJ}\) et cède la même énergie à l'air : \(Q=-120\ \text{kJ}\), \(S_{\text{éch}}=Q/T_0\approx-409\ \text{J·K}^{-1}\), \(S_{\text{créée}}\approx+409\ \text{J·K}^{-1}\).</p>
    <p><strong>Q2.</strong> Premier principe : \(C\Delta T=RI^2\Delta t=2\,000\ \text{J}\), \(\Delta T=20\ \text{K}\), soit 40 °C. Adiabatique : \(S_{\text{créée}}=\Delta S=C\ln\dfrac{313{,}15}{293{,}15}\approx+6{,}6\ \text{J·K}^{-1}\).</p>
    <p><strong>Q3.</strong> Dans la résistance : l'effet Joule est un phénomène dissipatif (conversion de travail électrique en énergie interne). Dans le cas 1 s'y ajoute le transfert thermique de la résistance, plus chaude, vers l'air.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Détente de Joule-Gay-Lussac et formule de Boltzmann</h3>
  <div class="statement">Un récipient rigide et calorifugé comprend deux compartiments : l'un de 1,0 L contient \(n=0{,}10\ \text{mol}\) de gaz parfait, l'autre, de 2,0 L, est vide. On ouvre le robinet qui les sépare. \(N_A=6{,}02\times10^{23}\ \text{mol}^{-1}\) ; formule de Boltzmann fournie : \(S=k_B\ln\Omega\), \(R=N_Ak_B\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la température finale du gaz parfait est égale à la température initiale.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\Delta S\), \(S_{\text{éch}}\) et \(S_{\text{créée}}\).</div>
  <div class="q"><strong>Q3.</strong> Chaque molécule dispose maintenant de trois fois plus de volume. Par quel facteur le nombre \(\Omega\) de configurations est-il multiplié ? Retrouver \(\Delta S\) par la formule de Boltzmann.</div>
  <div class="q"><strong>Q4.</strong> Quelle est la probabilité que toutes les molécules se retrouvent un jour, ensemble, dans le premier compartiment ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Récipient rigide : \(W=0\) ; calorifugé : \(Q=0\) ; donc \(\Delta U=0\). Pour un gaz parfait, \(U\) ne dépend que de \(T\) : \(T_f=T_i\).</p>
    <p><strong>Q2.</strong> \(\Delta S=nR\ln(V_f/V_i)\), soit \(0{,}10\times8{,}314\ln3\approx+0{,}91\ \text{J·K}^{-1}\) ; \(S_{\text{éch}}=0\) ; \(S_{\text{créée}}=0{,}91\ \text{J·K}^{-1}\) : irréversible (détente brutale, inhomogénéité de pression).</p>
    <p><strong>Q3.</strong> \(N=nN_A\approx6{,}0\times10^{22}\) molécules, chacune avec trois fois plus de positions : \(\Omega\) est multiplié par \(3^N\). \(\Delta S=k_B\ln3^N=Nk_B\ln3=nR\ln3\) : même résultat.</p>
    <p><strong>Q4.</strong> Chaque molécule est dans le premier compartiment avec la probabilité 1/3 ; toutes ensemble : \(3^{-N}\), soit \(10^{-2{,}9\times10^{22}}\). C'est en pratique impossible : c'est la traduction statistique de \(S_{\text{créée}}\gt0\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Un glaçon dans un verre d'eau</h3>
  <div class="statement">On plonge un glaçon de 20 g à 0 °C dans 200 g d'eau à 25 °C, dans un verre calorifugé de capacité négligeable, sous pression atmosphérique. \(\Delta h_{\text{fus}}=334\ \text{J·g}^{-1}\) à 0 °C ; \(c=4{,}18\ \text{J·K}^{-1}\text{·g}^{-1}\) pour l'eau liquide.</div>
  <div class="q"><strong>Q1.</strong> Vérifier que le glaçon fond entièrement et calculer la température finale.</div>
  <div class="q"><strong>Q2.</strong> Calculer la variation d'entropie de l'eau issue du glaçon (fusion, puis échauffement) et celle de l'eau initialement liquide.</div>
  <div class="q"><strong>Q3.</strong> En déduire \(S_{\text{créée}}\). Quelle est la cause de l'irréversibilité ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Fondre le glaçon demande \(20\times334=6\,680\ \text{J}\) ; l'eau peut céder jusqu'à \(200\times4{,}18\times25=20\,900\ \text{J}\) en descendant à 0 °C : il fond entièrement. Bilan monobare et calorifugé (\(\Delta H=0\)) : \(6\,680+83{,}6\,\theta_f+836(\theta_f-25)=0\) (en joules, \(\theta_f\) en °C), d'où \(\theta_f\approx15{,}5\ ^\circ\text{C}\) (288,6 K).</p>
    <p><strong>Q2.</strong> Glaçon :</p>
    <div class="formula">$$\Delta S_g=\frac{20\times334}{273{,}15}+20\times4{,}18\ln\frac{288{,}61}{273{,}15}\approx24{,}5+4{,}6=+29{,}1\ \text{J·K}^{-1}$$</div>
    <p>Eau : \(\Delta S_e=200\times4{,}18\ln\dfrac{288{,}61}{298{,}15}\approx-27{,}2\ \text{J·K}^{-1}\).</p>
    <p><strong>Q3.</strong> \(S_{\text{créée}}=\Delta S_g+\Delta S_e\approx+1{,}9\ \text{J·K}^{-1}\) (système calorifugé). La fusion à 0 °C n'est pas en cause en elle-même ; l'irréversibilité vient des transferts thermiques entre l'eau à 25 °C et la glace à 0 °C, sous un écart de température fini.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Chauffer en plusieurs étapes : vers la réversibilité</h3>
  <div class="statement">On chauffe 1,0 kg d'eau (\(C=4\,180\ \text{J·K}^{-1}\)) de 20 °C à 80 °C, sous pression constante, en la mettant successivement en contact avec \(N\) thermostats de températures \(T_k=T_i+k\,\dfrac{T_f-T_i}N\) (\(k=1,\dots,N\)), jusqu'à l'équilibre avec chacun.</div>
  <div class="q"><strong>Q1.</strong> Calculer l'entropie créée pour \(N=1\), puis \(N=2\) (thermostats à 50 °C et 80 °C).</div>
  <div class="q"><strong>Q2.</strong> Exprimer l'entropie créée par l'étape \(k\), puis le total. Le calculer pour \(N=3\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(N\) grand, on admet \(S_{\text{créée}}\approx\dfrac{C(T_f-T_i)^2}{2N\,T_iT_f}\). Combien d'étapes faut-il pour créer moins de 1 J/K ? Que se passe-t-il à la limite ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(N=1\) : \(\Delta S=C\ln\dfrac{353{,}15}{293{,}15}\approx778\ \text{J·K}^{-1}\), \(S_{\text{éch}}=\dfrac{C\times60}{353{,}15}\approx710\ \text{J·K}^{-1}\), \(S_{\text{créée}}\approx68\ \text{J·K}^{-1}\). \(N=2\) : même \(\Delta S\) ; \(S_{\text{éch}}=\dfrac{C\times30}{323{,}15}+\dfrac{C\times30}{353{,}15}\approx743\ \text{J·K}^{-1}\) ; \(S_{\text{créée}}\approx35\ \text{J·K}^{-1}\), presque moitié moins.</p>
    <p><strong>Q2.</strong> Étape \(k\), de \(T_{k-1}\) à \(T_k\) : \(S_{\text{créée},k}=C\ln\dfrac{T_k}{T_{k-1}}-C\,\dfrac{T_k-T_{k-1}}{T_k}\). La somme des logarithmes redonne \(\Delta S\) : \(S_{\text{créée}}=\Delta S-C\sum_k\dfrac{T_k-T_{k-1}}{T_k}\). Pour \(N=3\) (thermostats à 40, 60 et 80 °C) : \(S_{\text{créée}}\approx24\ \text{J·K}^{-1}\).</p>
    <p><strong>Q3.</strong> \(\dfrac{4\,180\times60^2}{2\times293{,}15\times353{,}15}\approx72{,}7\ \text{J·K}^{-1}\), divisé par \(N\) : il faut \(N\geq73\) étapes. Quand \(N\to\infty\), \(S_{\text{créée}}\to0\) : la transformation devient réversible, chaque échange se faisant sous un écart de température infinitésimal.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Stocker de l'énergie dans de l'air comprimé</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>loi de Laplace, bilans d'entropie, irréversibilité, cycle monotherme, stockage d'énergie</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Pour stocker de l'électricité, on peut comprimer de l'air quand elle est abondante, et le détendre dans une turbine quand on en a besoin. On modélise l'opération sur \(n=40\ \text{mol}\) d'air (gaz parfait, \(\gamma=1{,}4\), \(C_V=\tfrac52nR\), \(R=8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\)), initialement à \(T_0=293{,}15\ \text{K}\) et \(P_0=1{,}0\ \text{bar}\) (volume \(V_0\)), enfermées dans un cylindre fermé par un piston. L'air ambiant, à \(T_0\), joue le rôle de thermostat. Le cycle comprend quatre étapes :
    <ul>
      <li>A : compression adiabatique et réversible jusqu'au volume \(V_1=V_0/5\) ;</li>
      <li>B : stockage, à volume \(V_1\) constant, pendant lequel l'air revient à \(T_0\) au contact de l'ambiance ;</li>
      <li>C : détente adiabatique et réversible jusqu'au volume \(V_0\), qui restitue du travail ;</li>
      <li>D : retour à l'état initial, à volume \(V_0\) constant, au contact de l'ambiance.</li>
    </ul>
  </div>
  <p class="exo-part">Partie A — La compression</p>
  <div class="q"><strong>A1.</strong> Calculer \(V_0\). Justifier l'emploi de la loi de Laplace, puis calculer la température \(T_1\) et la pression \(P_1\) en fin de compression.</div>
  <div class="q"><strong>A2.</strong> Calculer le travail \(W_A\) reçu par l'air.</div>
  <p class="exo-part">Partie B — Le stockage</p>
  <div class="q"><strong>B1.</strong> Calculer la pression \(P_2\) à la fin du stockage et le transfert thermique \(Q_B\) reçu par l'air.</div>
  <div class="q"><strong>B2.</strong> Calculer \(\Delta S_B\), \(S_{\text{éch},B}\) et \(S_{\text{créée},B}\). Quelle est la cause de l'irréversibilité ?</div>
  <p class="exo-part">Partie C — La restitution</p>
  <div class="q"><strong>C1.</strong> Calculer la température \(T_3\), la pression \(P_3\) et le travail \(W_C\) reçu par l'air pendant la détente. Commenter \(T_3\).</div>
  <div class="q"><strong>C2.</strong> On définit le rendement du stockage \(\eta=-W_C/W_A\). Le calculer et montrer que \(\eta=(V_1/V_0)^{\gamma-1}\).</div>
  <p class="exo-part">Partie D — Bilan du cycle</p>
  <div class="q"><strong>D1.</strong> Calculer \(Q_D\) et \(S_{\text{créée},D}\) pour l'étape D.</div>
  <div class="q"><strong>D2.</strong> Calculer le travail total \(W\) reçu par l'air sur le cycle et l'entropie totale créée. Vérifier que \(W=T_0S_{\text{créée}}\) et expliquer pourquoi ce résultat était prévisible.</div>
  <div class="q"><strong>D3.</strong> Proposer une modification qui rapprocherait le rendement de 1. Quelle étape faudrait-il rendre réversible ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(V_0=nRT_0/P_0\approx0{,}97\ \text{m}^3\). Gaz parfait, \(\gamma\) constant, compression adiabatique et réversible : loi de Laplace. \(T_1=T_0\times5^{\gamma-1}=293{,}15\times5^{0{,}4}\approx558\ \text{K}\) (285 °C) ; \(P_1=P_0\times5^{\gamma}\approx9{,}5\ \text{bar}\).</p>
    <p><strong>A2.</strong> Adiabatique : \(W_A=\Delta U=C_V(T_1-T_0)\), avec \(C_V=\tfrac52\times40\times8{,}314\approx831\ \text{J·K}^{-1}\) : \(W_A\approx831\times264{,}9\approx220\ \text{kJ}\).</p>
    <p><strong>B1.</strong> Isochore : \(P_2=P_1T_0/T_1=P_0\times5=5{,}0\ \text{bar}\). \(W=0\), donc \(Q_B=\Delta U=C_V(T_0-T_1)\approx-220\ \text{kJ}\) : toute l'énergie reçue en A part dans l'ambiance.</p>
    <p><strong>B2.</strong> \(\Delta S_B=C_V\ln(T_0/T_1)\approx-535\ \text{J·K}^{-1}\) ; \(S_{\text{éch},B}=Q_B/T_0\approx-751\ \text{J·K}^{-1}\) ; \(S_{\text{créée},B}\approx+216\ \text{J·K}^{-1}\). Cause : transfert thermique entre l'air à 558 K et l'ambiance à 293 K, sous un grand écart de température.</p>
    <p><strong>C1.</strong> Laplace : \(T_3=T_0/5^{0{,}4}\approx154\ \text{K}\) (−119 °C), \(P_3=P_2/5^{1{,}4}\approx0{,}53\ \text{bar}\). \(W_C=C_V(T_3-T_0)\approx-116\ \text{kJ}\) : l'air fournit 116 kJ. Il sort très froid : partant de la température ambiante, la détente le refroidit autant que la compression l'avait chauffé (en rapport de températures).</p>
    <p><strong>C2.</strong> Les travaux de A et C valent \(C_V(T_1-T_0)\) et \(C_V(T_3-T_0)\) :</p>
    <div class="formula">$$\eta=\frac{T_0-T_3}{T_1-T_0}=\frac{T_0\left(1-5^{-0{,}4}\right)}{T_0\left(5^{0{,}4}-1\right)}=5^{-0{,}4}=\left(\frac{V_1}{V_0}\right)^{\gamma-1}\approx0{,}53$$</div>
    <p>Près de la moitié de l'énergie stockée est perdue.</p>
    <p><strong>D1.</strong> \(Q_D=C_V(T_0-T_3)\approx+116\ \text{kJ}\) ; \(\Delta S_D=C_V\ln(T_0/T_3)\approx+535\ \text{J·K}^{-1}\) ; \(S_{\text{éch},D}=Q_D/T_0\approx395\ \text{J·K}^{-1}\) ; \(S_{\text{créée},D}\approx+141\ \text{J·K}^{-1}\).</p>
    <p><strong>D2.</strong> \(W=W_A+W_C\approx220-116=104\ \text{kJ}\) reçus ; \(S_{\text{créée}}=216+141\approx357\ \text{J·K}^{-1}\) ; \(T_0S_{\text{créée}}\approx293{,}15\times357\approx105\ \text{kJ}\) : égalité, aux arrondis près. Prévisible : sur un cycle, \(\Delta U=0\) et \(\Delta S=0\) ; l'air n'échange de chaleur qu'avec l'ambiance (cycle monotherme), donc \(Q=-W\) et \(S_{\text{éch}}=Q/T_0=-S_{\text{créée}}\), d'où \(W=T_0S_{\text{créée}}\geq0\). Un cycle monotherme ne peut que recevoir du travail (cours, §11) ; toute l'énergie perdue l'est par les irréversibilités des étapes B et D.</p>
    <p><strong>D3.</strong> Il faut éviter de jeter la chaleur de compression : la stocker dans un réservoir thermique (roches, sels fondus) pendant l'étape B, puis la rendre à l'air avant la détente, de façon à détendre de l'air chaud. Si ces échanges se faisaient sous des écarts de température très faibles (échangeurs à contre-courant), B et D deviendraient quasi réversibles et le rendement tendrait vers 1. Les installations existantes réchauffent l'air en brûlant du gaz ; les projets « adiabatiques » visent environ 70 %.</p>
  </div>
