    <div class="course-section">
      <div class="sec-num">§1 · IDENTIFIER LE DOCUMENT</div>
      <h2>Présenter et commenter un document</h2>
      <div class="intro">Toute colle commence par la <strong>présentation</strong> du document, puis sa <strong>description</strong> (surtout pour une image) et enfin son <strong>commentaire</strong>. Voici les outils pour chaque étape.</div>
      <div class="prop-box"><strong>Nature</strong> : a press / news article · an op-ed (tribune) · a cartoon · a photograph · an extract from a novel / a speech · a graph / a chart.</div>
      <div class="prop-box"><strong>Source &amp; contexte</strong> : This document, <em>taken from / drawn from</em> The Economist, <em>was published in</em> 2023 and <em>was written by</em>…</div>
      <div class="sec-num" style="margin-top:1.5rem">§2 · DÉCRIRE UNE IMAGE</div>
      <div class="prop-box"><strong>Situer</strong> : in the <em>foreground / background</em> · in the <em>top-left / bottom-right corner</em> · on the <em>left-hand side</em>.</div>
      <div class="prop-box"><strong>Décrire</strong> : we can see / one can make out… · the cartoon <em>depicts / portrays</em>… · the caption <em>reads</em>… · it <em>pokes fun at / satirises</em>…</div>
      <div class="sec-num" style="margin-top:1.5rem">§3 · COMMENTER</div>
      <div class="prop-box"><strong>Interpréter</strong> : the author <em>seems to suggest / implies</em> that… · the underlying message is… · this is meant to <em>denounce / criticise</em>…</div>
      <div class="notice">Réflexe : <em>« At first sight…, but on closer inspection… »</em> pour montrer une lecture en deux temps.</div>
    </div>

    <div class="course-section">
      <div class="sec-num">§4 · L'ORAL D'ANGLAIS DE LA BANQUE PT</div>
      <h2>L'oral d'anglais de la Banque PT</h2>
      <div class="intro">À l'oral d'anglais de la Banque PT, le support n'est ni un texte ni une image mais un <strong>enregistrement</strong> : tu l'écoutes pendant la préparation, puis tu le résumes et tu le commentes devant l'examinateur, avant un entretien. Les outils des §1 à §3 restent valables ; ce qui change, c'est qu'il faut comprendre et noter à l'oreille, puis parler sans lire.</div>
      <div class="reveal" onclick="this.classList.toggle('open')">
        <span class="label">AU PROGRAMME · PT</span>
        <span class="prompt">Ce qu'on sait de l'épreuve orale</span>
        <div class="content">
          <ul>
            <li><strong>Durée</strong> : environ 40 minutes, dont environ 20 minutes de préparation, puis environ 20 minutes d'exposé et d'entretien avec l'examinateur (d'après les rapports du jury 2025 et 2026).</li>
            <li><strong>Support</strong> : un enregistrement en anglais, à <strong>résumer</strong> puis à <strong>commenter</strong>.</li>
            <li><strong>Le reste</strong> (durée de l'enregistrement, nombre d'écoutes, matériel autorisé, partage du temps entre l'exposé et l'entretien) : vérifie dans la notice et le dernier rapport du jury (banquept.fr). Ces détails peuvent changer d'une session à l'autre.</li>
          </ul>
          <p>À l'écrit, l'épreuve d'anglais est une synthèse de documents : voir le chapitre <a href="#ensynth/cours">« Synthèse de documents : l'épreuve écrite »</a>.</p>
        </div>
      </div>
      <h3>Préparer en 20 minutes</h3>
      <div class="method-box"><strong>Les étapes de la préparation</strong> (répartition indicative, à adapter à la durée de l'enregistrement)
        <ol>
          <li><span class="step">Première écoute : le sens général.</span> Le thème, qui parle (journaliste, expert, témoin, responsable politique), à qui, sur quel ton, et les grandes étapes. Ne noter que des mots-clés.</li>
          <li><span class="step">Écoutes suivantes : les détails.</span> Chiffres, dates, noms propres, exemples, une ou deux formules frappantes à citer. Noter en anglais, avec des abréviations (voir ci-dessous).</li>
          <li><span class="step">Reconstituer le plan de l'enregistrement</span> en trois ou quatre points, en anglais : ce sera ton résumé.</li>
          <li><span class="step">Construire le commentaire</span> : une problématique, deux parties, deux ou trois arguments et exemples par partie.</li>
          <li><span class="step">Rédiger seulement l'introduction</span> (deux ou trois phrases) ; pour le reste, des mots-clés et des flèches. Un exposé entièrement rédigé se lit, et se lit mal.</li>
        </ol>
      </div>
      <div class="prop-box"><strong>Prendre des notes à l'oreille</strong> : ↑ <em>rise / increase</em> · ↓ <em>fall / drop</em> · → <em>leads to</em> · ≠ <em>contrast</em> · = <em>same as</em> · <em>gvt</em> (government) · <em>ppl</em> (people) · <em>w/</em> (with) · <em>b/c</em> (because) · <em>e.g.</em> (for example). Note les chiffres <strong>avec leur unité</strong> et ce qu'ils mesurent (<em>40% of… / 2 million…</em>) : un chiffre seul ne sert à rien. Réutilise les mots entendus en respectant leur accent tonique.</div>
      <div class="notice"><strong>Piège</strong> : vouloir tout comprendre. Un mot inconnu ne bloque pas le sens général ; repère la structure (<em>first…, but…, so…</em>), les mots répétés et le ton (ironique, inquiet, enthousiaste) : ils suffisent pour un résumé fidèle.</div>
    </div>

    <div class="course-section">
      <div class="sec-num">§5 · CONDUIRE L'EXPOSÉ ET L'ENTRETIEN</div>
      <h2>Conduire l'exposé et l'entretien</h2>
      <div class="intro">L'exposé enchaîne trois temps, la présentation, le résumé et le commentaire, puis vient l'entretien. Garde l'essentiel du temps pour le commentaire : c'est là que tu montres ta capacité à argumenter en anglais. Entraîne-toi à tenir un exposé structuré d'une dizaine de minutes, que tu sauras raccourcir si le rapport du jury attend moins.</div>
      <div class="prop-box"><strong>1. Présenter l'enregistrement</strong> (30 secondes à une minute) : <em>The recording is an extract from a radio programme / a podcast / a news report</em> · <em>It was broadcast on… in 2025</em> (<em>broadcast</em> : même forme au prétérit et au participe passé) · <em>It features an interview with…, an expert in…</em> · <em>The speakers are a journalist and…</em> · <em>It deals with… / It focuses on…</em></div>
      <div class="prop-box"><strong>2. Résumer</strong> (deux à trois minutes, dans l'ordre de l'enregistrement, avec tes mots, sans commenter) : <em>The journalist starts by explaining that…</em> · <em>She then points out that…</em> · <em>He goes on to say that…</em> (il poursuit en disant) · <em>According to the expert, …</em> · <em>The speaker concludes by + V-ing</em>. Verbes introducteurs au présent, comme dans une synthèse.</div>
      <div class="prop-box"><strong>3. Commenter</strong> (l'essentiel de l'exposé) : la problématique (<em>This raises the question of whether…</em>), le plan (<em>I will first…, then I will…</em>), deux parties argumentées, une conclusion qui répond à la question. Ici, et contrairement à la synthèse écrite, <strong>ton avis et tes connaissances</strong> sont attendus : <em>In my view…</em>, <em>This reminds me of…</em>, <em>A good example of this is…</em> (voir <a href="#enavis/cours">« Donner son avis &amp; nuancer »</a>).</div>
      <div class="prop-box"><strong>4. L'entretien</strong> : <em>Could you repeat the question, please?</em> · <em>If I understand you correctly, you are asking whether…</em> · <em>That's an interesting point. Let me think…</em> · <em>I hadn't thought of that, but…</em> · <em>I see what you mean, but I would still argue that…</em> · <em>As I said in my presentation, …</em> (voir <a href="#enreac/cours">« Réagir &amp; gagner du temps »</a>).</div>
      <div>
      <table>
        <tr><th></th><th>Synthèse écrite</th><th>Oral (commentaire)</th></tr>
        <tr><td>Support</td><td>un dossier de documents</td><td>un enregistrement</td></tr>
        <tr><td>Avis personnel</td><td><strong>interdit</strong></td><td><strong>attendu</strong>, argumenté</td></tr>
        <tr><td>Connaissances extérieures</td><td>interdites</td><td>bienvenues (exemples, chiffres connus)</td></tr>
        <tr><td>Pronom <em>I</em></td><td>à éviter</td><td>naturel : <em>I will first…</em></td></tr>
        <tr><td>Commun aux deux</td><td colspan="2">une problématique, un plan annoncé, des connecteurs, des verbes introducteurs variés</td></tr>
      </table>
      </div>
      <div class="notice"><strong>Pièges</strong> : lire ses notes (lève les yeux, parle à l'examinateur) ; un résumé trop long qui dévore le commentaire ; parler trop vite par stress ; les hésitations en français (<em>euh…</em>) : remplace-les par <em>Well…</em>, <em>Let me see…</em> ; écorcher les mots-clés de l'enregistrement, que l'examinateur vient d'entendre bien prononcés.</div>
