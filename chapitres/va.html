<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit les parties d) et f) de la partie A « Probabilités sur un univers fini, variables aléatoires et lois » et toute la partie B « Espérance et variance » du programme de PTSI. L'univers est <strong>fini</strong> : une variable aléatoire ne prend qu'un nombre fini de valeurs. Le vocabulaire (univers, événements, conditionnement, indépendance d'événements) vient du chapitre <a href="#proba/cours">« Probabilités sur un univers fini »</a>, les calculs de dénombrement de <a href="#denombrmt/cours">« Dénombrement et combinatoire »</a>. Notations du site, identiques à celles de la 2ᵉ année : \(E(X)\), \(V(X)\), \(\sigma(X)\), \(\operatorname{Cov}(X, Y)\), \(X \perp\!\!\!\perp Y\).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Loi d'une variable aléatoire</strong> \(P_X\), déterminée par la distribution \(\big(P(X = x)\big)_{x \in X(\Omega)}\) ; notation \(X \sim Y\) ; variable \(f(X)\), et si \(X \sim Y\) alors \(f(X) \sim f(Y)\) (§1).</li>
        <li><strong>Lois usuelles</strong> : variable certaine, uniforme \(\mathcal U(E)\), de Bernoulli \(\mathcal B(p)\) (interprétation comme succès d'une expérience), binomiale \(\mathcal B(n, p)\) (§2).</li>
        <li><strong>Loi conditionnelle</strong> d'une variable sachant un événement (§3).</li>
        <li><strong>Couples</strong> de variables : loi conjointe, lois marginales, notation \(P(X = x, Y = y)\) ; extension aux \(n\)-uplets (§4).</li>
        <li><strong>Variables indépendantes</strong>, caractérisation par la loi conjointe, extension aux \(n\)-uplets ; modélisation de \(n\) expériences indépendantes ; \(f(X)\) et \(g(Y)\) indépendantes ; lemme des coalitions (démonstration hors programme) (§5).</li>
        <li><strong>Somme de \(n\) variables de Bernoulli indépendantes</strong> de même paramètre : loi \(\mathcal B(n, p)\), nombre de succès (§6).</li>
        <li><strong>Espérance</strong> : définition, formule \(\sum_\omega X(\omega)P(\{\omega\})\), variable centrée ; linéarité, positivité, croissance, inégalité triangulaire ; espérance d'une variable constante, de Bernoulli, binomiale, \(E(\mathbf 1_A) = P(A)\) ; formule de transfert (couples et \(n\)-uplets compris) ; \(E(XY) = E(X)E(Y)\) pour des variables indépendantes (§7).</li>
        <li><strong>Variance et écart type</strong>, \(V(aX + b) = a^2V(X)\), \(V(X) = E(X^2) - E(X)^2\), variable centrée réduite ; variance d'une variable de Bernoulli, binomiale (§8, §9).</li>
        <li><strong>Covariance</strong>, \(\operatorname{Cov}(X, Y) = E(XY) - E(X)E(Y)\), cas de variables indépendantes, variables décorrélées ; variance d'une somme (§9).</li>
        <li><strong>Inégalités de Markov et de Bienaymé-Tchebychev</strong>, inégalités de concentration (§10) ; application à une moyenne de variables indépendantes de même loi, interprétation fréquentiste (§11).</li>
      </ul>
      <p>Hors programme en PTSI (en fin de chapitre) : les variables prenant une infinité de valeurs, donc les lois géométrique et de Poisson, et la loi faible des grands nombres sous forme de limite (2ᵉ année) ; la loi hypergéométrique et la fonction de répartition (hors programme des deux années).</p>

<div class="course-section">
  <div class="sec-num">§1 · VARIABLE ALÉATOIRE ET LOI</div>
  <h2>Résumer une expérience par une grandeur</h2>
  <div class="intro">On s'intéresse rarement à l'issue complète d'une expérience, mais à une grandeur qui en dépend : la somme de deux dés, le nombre de pièces défectueuses d'un lot, un gain. Une variable aléatoire est cette grandeur ; sa loi dit avec quelles probabilités elle prend chaque valeur, et c'est presque toujours tout ce dont on a besoin.</div>

  <div class="def-box">
    Soit \((\Omega, P)\) un espace probabilisé fini. Une <strong>variable aléatoire</strong> est une application \(X : \Omega \to E\) ; elle est <strong>réelle</strong> si \(E \subset \mathbb R\). L'ensemble \(X(\Omega)\) de ses valeurs est fini. Pour \(A \subset E\), on note \((X \in A)\) l'événement \(\{\omega \in \Omega,\ X(\omega) \in A\}\), et de même \((X = x)\), \((X \leq x)\).
  </div>
  <div class="prop-box">
    <strong>Loi d'une variable aléatoire.</strong> Les événements \((X = x)\), \(x \in X(\Omega)\), forment un système complet. La <strong>loi</strong> de \(X\) est la probabilité \(P_X : A \mapsto P(X \in A)\) sur \(X(\Omega)\) ; elle est déterminée par la distribution \(\big(P(X = x)\big)_{x \in X(\Omega)}\) :
    <div class="formula" data-nom="Loi d'une variable aléatoire">$$\begin{gathered} P(X \in A) = \sum_{x \in A \cap X(\Omega)} P(X = x), \\ \sum_{x \in X(\Omega)} P(X = x) = 1. \end{gathered}$$</div>
    On note \(X \sim Y\) lorsque \(X\) et \(Y\) ont la même loi.
  </div>

</figure>
  <div class="method-box">
    <strong>Exemple — la somme de deux dés</strong>
    <ol>
      <li>Sur \(\Omega = \{1, \dots, 6\}^2\) muni de la probabilité uniforme, \(S(i, j) = i + j\) prend les valeurs 2 à 12.</li>
      <li>On compte les couples de somme \(s\) : \(P(S = s) = \dfrac{6 - |s - 7|}{36}\), soit \(\frac{1}{36}, \frac{2}{36}, \dots, \frac{6}{36}\) (pour \(s = 7\)), \(\dots, \frac{1}{36}\). Contrôle : la somme des numérateurs vaut 36.</li>
      <li>\(P(S \in \{7, 11\}) = \frac{6 + 2}{36} = \frac29\) : il suffit de la loi, sans revenir à \(\Omega\).</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Variable \(f(X)\).</strong> Si \(f\) est une fonction définie sur \(X(\Omega)\), \(f(X) = f \circ X\) est une variable aléatoire, et
    <div class="formula" data-nom="Loi de f(X)">$$P\big(f(X) = y\big) = \sum_{\substack{x \in X(\Omega) \\ f(x) = y}} P(X = x).$$</div>
    En particulier, si \(X \sim Y\), alors \(f(X) \sim f(Y)\).
  </div>
  <div class="method-box">
    <strong>Exemple — l'écart à 7</strong>
    <ol>
      <li>\(T = |S - 7|\) prend les valeurs 0 à 5. \(P(T = 0) = P(S = 7) = \frac{6}{36}\).</li>
      <li>Pour \(t \geq 1\), deux valeurs de \(S\) donnent \(T = t\) : \(P(T = t)\) est la somme de \(P(S = 7 - t)\) et de \(P(S = 7 + t)\), c'est-à-dire \(\frac{2(6 - t)}{36}\), soit \(\frac{10}{36}, \frac{8}{36}, \frac{6}{36}, \frac{4}{36}, \frac{2}{36}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre « même loi » et « égales ». Si \(X_1\) et \(X_2\) sont les résultats de deux dés, \(X_1 \sim X_2\), mais \(X_1 \neq X_2\) en général ; de même \(X_1 \sim 7 - X_1\). Autre piège : oublier qu'une fonction non injective regroupe plusieurs valeurs (\(P(X^2 = 1)\) vaut \(P(X = 1) + P(X = -1)\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LOIS USUELLES</div>
  <h2>Certaine, uniforme, de Bernoulli, binomiale</h2>
  <div class="intro">Quatre lois suffisent à décrire une grande partie des situations de première année. Ce qui compte n'est pas la formule, mais de reconnaître la situation qu'elle modélise.</div>

  <div class="def-box">
    <ul>
      <li><strong>Variable certaine</strong> : \(X\) est certaine égale à \(a\) si \(P(X = a) = 1\).</li>
      <li><strong>Loi uniforme</strong> sur un ensemble fini non vide \(E\), notée \(X \sim \mathcal U(E)\) : \(P(X = x) = \dfrac{1}{|E|}\) pour tout \(x \in E\). Exemple : le résultat d'un dé équilibré suit \(\mathcal U(\{1, \dots, 6\})\).</li>
      <li><strong>Loi de Bernoulli</strong> de paramètre \(p \in [0, 1]\), notée \(X \sim \mathcal B(p)\) : \(X\) prend les valeurs 0 et 1, avec \(P(X = 1) = p\) et \(P(X = 0) = 1 - p\). On interprète \(X = 1\) comme le <strong>succès</strong> d'une expérience.</li>
      <li><strong>Loi binomiale</strong> de paramètres \(n \in \mathbb N^*\) et \(p \in [0, 1]\), notée \(X \sim \mathcal B(n, p)\) : \(X\) prend les valeurs \(0, 1, \dots, n\), et
      <div class="formula" data-nom="Loi binomiale">$$\begin{gathered} P(X = k) = \binom nk p^k (1-p)^{n-k}, \\ 0 \leq k \leq n. \end{gathered}$$</div></li>
    </ul>
  </div>
  <p>La formule binomiale définit bien une loi : par la formule du binôme, \(\sum_{k=0}^n \binom nk p^k(1-p)^{n-k} = \big(p + (1-p)\big)^n\), soit \(1\). Son interprétation (nombre de succès en \(n\) expériences indépendantes) est démontrée au §6. <strong>Indicatrice</strong> : pour tout événement \(A\), la variable \(\mathbf 1_A\), qui vaut 1 si \(A\) est réalisé et 0 sinon, suit la loi \(\mathcal B\big(P(A)\big)\) : toute variable de Bernoulli est l'indicatrice de son succès.</p>

<div class="course-section">
  <div class="sec-num">§3 · LOI CONDITIONNELLE</div>
  <h2>La loi d'une variable sachant un événement</h2>
  <div class="intro">Une information sur l'expérience modifie la loi d'une variable : sachant que le premier dé donne 6, la somme ne prend plus que les valeurs 7 à 12. Combinée aux probabilités totales, la loi conditionnelle permet de calculer la loi d'une variable « par cas ».</div>

  <div class="def-box">
    Soit \(A\) un événement de probabilité non nulle. La <strong>loi conditionnelle de \(X\) sachant \(A\)</strong> est la loi de \(X\) pour la probabilité \(P_A\) : elle est donnée par la distribution \(\big(P(X = x \mid A)\big)_{x \in X(\Omega)}\), qui est de somme 1.
  </div>
  <div class="prop-box">
    <strong>Loi par cas.</strong> Si \((A_1, \dots, A_m)\) est un système complet d'événements de probabilités non nulles, pour toute valeur \(x\) :
    <div class="formula" data-nom="Loi par probabilités totales">$$P(X = x) = \sum_{i=1}^m P(X = x \mid A_i)\,P(A_i).$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — la somme sachant le premier dé, puis sachant qu'elle est grande</strong>
    <ol>
      <li>Sachant \(X_1 = 6\), la somme \(S = 6 + X_2\) suit la loi uniforme sur \(\{7, \dots, 12\}\).</li>
      <li>Sachant \(S \geq 10\) (6 couples) : \(P(S = 10 \mid S \geq 10) = \frac36\), \(P(S = 11 \mid S \geq 10) = \frac26\), \(P(S = 12 \mid S \geq 10) = \frac16\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une pièce choisie au hasard</strong>
    <ol>
      <li>Un sac contient une pièce équilibrée et une pièce qui donne pile avec la probabilité 0,8. On en prend une au hasard et on la lance trois fois ; \(N\) est le nombre de piles. Sachant la pièce, les lancers sont indépendants.</li>
      <li>Lois conditionnelles : sachant la pièce équilibrée \(B\), \(N\) suit \(\mathcal B(3, \frac12)\) : \(\frac18, \frac38, \frac38, \frac18\) ; sachant la pièce truquée \(T\), \(\mathcal B(3; 0{,}8)\) : 0,008 ; 0,096 ; 0,384 ; 0,512.</li>
      <li>Loi de \(N\) par cas :<div class="formula">$$P(N = k) = \frac{P(N = k \mid B) + P(N = k \mid T)}{2},$$</div>soit 0,0665 ; 0,2355 ; 0,3795 ; 0,3185 (somme 1).</li>
      <li>Ce n'est pas une loi binomiale : \(\mathcal B(3; 0{,}65)\), de même moyenne, donnerait \(P(N = 3) \approx 0{,}275\). Et Bayes donne \(P(T \mid N = 3) = \frac{0{,}5 \times 0{,}512}{0{,}3185} \approx 0{,}80\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que des épreuves indépendantes <em>sachant chaque cas</em> restent indépendantes quand le cas est inconnu. Ici, un premier pile rend la pièce truquée plus probable, donc un deuxième pile plus probable : les lancers ne sont pas indépendants, et \(N\) n'est pas binomiale.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · COUPLES ET n-UPLETS DE VARIABLES</div>
  <h2>Loi conjointe et lois marginales</h2>
  <div class="intro">Pour étudier deux grandeurs ensemble (le minimum et le maximum de deux dés, le nombre de pièces bonnes et défectueuses), il faut connaître les probabilités de leurs valeurs <em>simultanées</em>, et pas seulement celles de chacune.</div>

  <div class="def-box">
    Si \(X : \Omega \to E\) et \(Y : \Omega \to F\) sont deux variables, le <strong>couple</strong> \((X, Y) : \omega \mapsto \big(X(\omega), Y(\omega)\big)\) est une variable à valeurs dans \(E \times F\). Sa loi, la <strong>loi conjointe</strong>, est donnée par les nombres \(P(X = x, Y = y)\), probabilités des événements \((X = x) \cap (Y = y)\). Les lois de \(X\) et de \(Y\) sont les <strong>lois marginales</strong>. De même, un \(n\)-uplet \((X_1, \dots, X_n)\) est une variable à valeurs dans un produit de \(n\) ensembles.
  </div>
  <div class="prop-box">
    <strong>Lois marginales.</strong> Les \((Y = y)\) formant un système complet :
    <div class="formula" data-nom="Lois marginales">$$\begin{gathered} P(X = x) = \sum_{y \in Y(\Omega)} P(X = x, Y = y), \\ P(Y = y) = \sum_{x \in X(\Omega)} P(X = x, Y = y). \end{gathered}$$</div>
    Dans un tableau à double entrée, ce sont les sommes des lignes et des colonnes. La <strong>loi conditionnelle de \(Y\) sachant \((X = x)\)</strong> s'obtient en divisant la ligne \(x\) par \(P(X = x)\).
  </div>
  <table>
    <thead><tr><th>\(X\) \ \(Y\)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>\(P(X = i)\)</th></tr></thead>
    <tbody>
      <tr><th>1</th><td>1</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>11</td></tr>
      <tr><th>2</th><td>0</td><td>1</td><td>2</td><td>2</td><td>2</td><td>2</td><td>9</td></tr>
      <tr><th>3</th><td>0</td><td>0</td><td>1</td><td>2</td><td>2</td><td>2</td><td>7</td></tr>
      <tr><th>4</th><td>0</td><td>0</td><td>0</td><td>1</td><td>2</td><td>2</td><td>5</td></tr>
      <tr><th>5</th><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>2</td><td>3</td></tr>
      <tr><th>6</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td></tr>
      <tr><th>\(P(Y = j)\)</th><td>1</td><td>3</td><td>5</td><td>7</td><td>9</td><td>11</td><td>36</td></tr>
    </tbody>
  </table>
  <div class="method-box">
    <strong>Exemple — minimum et maximum de deux dés (tableau en 36ᵉ)</strong>
    <ol>
      <li>\(X = \min(X_1, X_2)\), \(Y = \max(X_1, X_2)\). Pour \(i \lt j\), \((X = i, Y = j)\) contient deux couples, \((i, j)\) et \((j, i)\) : probabilité \(\frac{2}{36}\) ; pour \(i = j\), un seul : \(\frac{1}{36}\) ; pour \(i \gt j\), aucun.</li>
      <li>Marginales : \(P(X = i) = \frac{13 - 2i}{36}\) (sommes des lignes) et \(P(Y = j) = \frac{2j - 1}{36}\) (sommes des colonnes).</li>
      <li>Loi de \(Y\) sachant \(X = 4\) : la ligne 4 divisée par \(\frac{5}{36}\), soit \(P(Y = 4 \mid X = 4) = \frac15\), puis \(P(Y = 5 \mid X = 4)\) et \(P(Y = 6 \mid X = 4)\) égales à \(\frac25\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que les lois marginales déterminent la loi conjointe. Les couples \((X_1, X_2)\) (deux dés) et \((X_1, X_1)\) ont les mêmes marginales uniformes, mais le premier prend 36 valeurs et le second seulement 6. Seule l'indépendance (§5) permet de reconstruire la loi conjointe à partir des marginales.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · VARIABLES ALÉATOIRES INDÉPENDANTES</div>
  <h2>Quand une variable n'apprend rien sur l'autre</h2>
  <div class="intro">Deux variables sont indépendantes si toute information sur l'une laisse inchangée la loi de l'autre. C'est l'hypothèse de modélisation des expériences répétées « dans les mêmes conditions et sans influence mutuelle », et c'est elle qui permet de multiplier les probabilités et les espérances.</div>

  <div class="def-box">
    Les variables \(X\) et \(Y\) sont <strong>indépendantes</strong>, ce que l'on note \(X \perp\!\!\!\perp Y\), si pour toutes parties \(A \subset X(\Omega)\) et \(B \subset Y(\Omega)\), les événements \((X \in A)\) et \((Y \in B)\) sont indépendants. Les variables \(X_1, \dots, X_n\) sont <strong>(mutuellement) indépendantes</strong> si, pour tous \(A_1, \dots, A_n\), les événements \((X_1 \in A_1), \dots, (X_n \in A_n)\) sont indépendants.
  </div>
  <div class="prop-box">
    <strong>Caractérisation par la loi conjointe.</strong> \(X \perp\!\!\!\perp Y\) si et seulement si, pour tous \(x \in X(\Omega)\) et \(y \in Y(\Omega)\),
    <div class="formula" data-nom="Indépendance de deux variables">$$P(X = x, Y = y) = P(X = x)\,P(Y = y).$$</div>
    De même pour \(n\) variables, pour toutes valeurs :<div class="formula">$$P(X_1 = x_1, \dots, X_n = x_n) = \prod_{i=1}^n P(X_i = x_i).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration (cas de deux variables)</span>
    <span class="prompt">Sommer la formule produit.</span>
    <div class="content"><p>Le sens direct est le cas \(A = \{x\}\), \(B = \{y\}\). Réciproquement, \((X \in A) \cap (Y \in B)\) est la réunion disjointe des \((X = x, Y = y)\) pour \(x \in A\), \(y \in B\), donc</p>
    <div class="formula">$$\begin{aligned} P(X \in A, Y \in B) &= \sum_{x \in A}\sum_{y \in B} P(X = x)P(Y = y) \\ &= \Big(\sum_{x \in A} P(X = x)\Big)\Big(\sum_{y \in B} P(Y = y)\Big), \end{aligned}$$</div>
    <p>qui vaut \(P(X \in A)\,P(Y \in B)\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Fonctions de variables indépendantes, lemme des coalitions.</strong> Si \(X \perp\!\!\!\perp Y\), alors \(f(X) \perp\!\!\!\perp g(Y)\) pour toutes fonctions \(f\) et \(g\). Plus généralement, si \(X_1, \dots, X_n\) sont indépendantes et \(1 \leq m \lt n\), alors \(f(X_1, \dots, X_m)\) et \(g(X_{m+1}, \dots, X_n)\) sont indépendantes (<strong>lemme des coalitions</strong>, démonstration hors programme), avec extension à plus de deux paquets de variables disjoints.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration (cas de f(X) et g(Y))</span>
    <span class="prompt">Revenir aux événements portant sur X et sur Y.</span>
    <div class="content"><p>Pour toutes parties \(C\), \(D\), \(\big(f(X) \in C\big) = \big(X \in f^{-1}(C)\big)\) et \(\big(g(Y) \in D\big) = \big(Y \in g^{-1}(D)\big)\), où \(f^{-1}(C)\) est l'ensemble des valeurs \(x\) telles que \(f(x) \in C\). Ce sont des événements de la forme \((X \in A)\) et \((Y \in B)\), indépendants par définition. Le lemme des coalitions est la même idée pour des paquets de variables ; c'est la version « variables » du lemme vu pour les événements au chapitre « Probabilités », §10.</p></div>
  </div>
  <p><strong>Modélisation.</strong> « On répète \(n\) fois une expérience, de façon indépendante » se traduit par une suite \((X_1, \dots, X_n)\) de variables indépendantes, \(X_k\) décrivant le résultat de la \(k\)-ième expérience ; « dans les mêmes conditions » ajoute qu'elles ont la même loi. On ne construit pas l'univers : le programme admet qu'il en existe un qui convient.</p>
  <div class="method-box">
    <strong>Exemple — ce qui est indépendant, et ce qui ne l'est pas</strong>
    <ol>
      <li>Deux dés : \(X_1 \perp\!\!\!\perp X_2\) (\(P(X_1 = i, X_2 = j) = \frac{1}{36}\), soit \(\frac16 \times \frac16\)).</li>
      <li>La somme \(S\) et la différence \(D = X_1 - X_2\) ne sont pas indépendantes : \(P(S = 12, D = 0) = \frac{1}{36}\), alors que \(P(S = 12)P(D = 0) = \frac{1}{36} \times \frac{6}{36}\). Une seule valeur suffit pour réfuter.</li>
      <li>Le minimum et le maximum ne sont pas indépendants : \(P(X = 6, Y = 1) = 0\), alors que \(P(X = 6)P(Y = 1) \neq 0\).</li>
      <li>Avec quatre dés indépendants, \(X_1 + X_2\) et \(\max(X_3, X_4)\) sont indépendantes par le lemme des coalitions : la probabilité que \(X_1 + X_2 = 7\) et \(\max(X_3, X_4) = 6\) vaut \(\frac{6}{36} \times \frac{11}{36} = \frac{11}{216}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le lemme des coalitions à des paquets qui se recouvrent. \(X_1 + X_2\) et \(X_2 + X_3\) ne sont pas indépendantes, puisqu'elles dépendent toutes deux de \(X_2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SOMME DE VARIABLES DE BERNOULLI INDÉPENDANTES</div>
  <h2>D'où vient la loi binomiale</h2>
  <div class="intro">Compter des succès, c'est additionner des indicatrices. Ce théorème justifie l'emploi de la loi binomiale dans toutes les situations « \(n\) épreuves indépendantes, même probabilité de succès, on compte les succès ».</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Si \(X_1, \dots, X_n\) sont indépendantes et suivent toutes la loi \(\mathcal B(p)\), alors
    <div class="formula" data-nom="Somme de Bernoulli indépendantes">$$X_1 + \cdots + X_n \sim \mathcal B(n, p).$$</div>
    Interprétation : le nombre de succès lors de la répétition de \(n\) expériences indépendantes ayant chacune la probabilité \(p\) de succès suit la loi \(\mathcal B(n, p)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Choisir les rangs des succès.</span>
    <div class="content"><p>Soit \(S = X_1 + \dots + X_n\) et \(k \in \{0, \dots, n\}\). L'événement \((S = k)\) est la réunion, sur les parties \(I \subset \{1, \dots, n\}\) à \(k\) éléments, des événements</p>
    <div class="formula">$$E_I = \bigcap_{i \in I}(X_i = 1) \cap \bigcap_{i \notin I}(X_i = 0)$$</div>
    <p>(« les succès sont exactement aux rangs de \(I\) »). Ces événements sont deux à deux incompatibles. Par indépendance, \(P(E_I) = p^k(1-p)^{n-k}\) pour chacune des \(\binom nk\) parties \(I\). Donc \(P(S = k) = \binom nk p^k(1-p)^{n-k}\).</p></div>
  </div>
  <p><strong>Conséquence.</strong> Si \(X \sim \mathcal B(m, p)\) et \(Y \sim \mathcal B(n, p)\) sont indépendantes, \(X + Y \sim \mathcal B(m + n, p)\) : on réalise \(X\) et \(Y\) comme sommes de \(m\) et \(n\) variables de Bernoulli toutes indépendantes (même paramètre \(p\) !).</p>
  <div class="method-box">
    <strong>Exemple — un QCM rempli au hasard</strong>
    <ol>
      <li>Un QCM compte 10 questions à 4 choix, dont un seul juste. Un élève répond au hasard, indépendamment d'une question à l'autre. \(X_k = 1\) si la réponse \(k\) est juste : \(X_k \sim \mathcal B\big(\frac14\big)\), indépendantes.</li>
      <li>Le nombre de bonnes réponses \(X = X_1 + \dots + X_{10}\) suit \(\mathcal B\big(10, \frac14\big)\).</li>
      <li>\(P(X = 0) = 0{,}75^{10} \approx 0{,}056\) et<div class="formula">$$P(X \geq 5) = \sum_{k=5}^{10}\binom{10}{k}\,0{,}25^k\,0{,}75^{10-k} \approx 0{,}078 :$$</div>la moyenne par le hasard reste rare.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner des binomiales de paramètres \(p\) différents (\(\mathcal B(m, p) + \mathcal B(n, p')\) n'est pas binomiale si \(p \neq p'\)), ou oublier l'hypothèse d'indépendance (la pièce choisie au hasard du §3).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ESPÉRANCE</div>
  <h2>La valeur moyenne d'une variable</h2>
  <div class="intro">L'espérance est la moyenne des valeurs de \(X\) pondérées par leurs probabilités : c'est un indicateur de <em>position</em>, le centre de gravité de la loi. Elle mesure le gain moyen d'un jeu, le nombre moyen de pièces défectueuses, la durée moyenne d'une attente. Sa linéarité en fait l'outil de calcul le plus puissant du chapitre.</div>

  <div class="def-box">
    L'<strong>espérance</strong> d'une variable aléatoire réelle \(X\) est
    <div class="formula" data-nom="Espérance">$$\begin{aligned} E(X) &= \sum_{x \in X(\Omega)} x\,P(X = x) \\ &= \sum_{\omega \in \Omega} X(\omega)\,P(\{\omega\}). \end{aligned}$$</div>
    \(X\) est <strong>centrée</strong> si \(E(X) = 0\).
  </div>
  <p>La seconde formule s'obtient en regroupant les issues selon la valeur de \(X\). Exemples immédiats : une variable certaine égale à \(a\) a pour espérance \(a\) ; si \(X \sim \mathcal B(p)\), \(E(X) = 0 \times (1 - p) + 1 \times p\), soit \(p\) ; en particulier <strong>\(E(\mathbf 1_A) = P(A)\)</strong>.</p>
  <div class="prop-box">
    <strong>Propriétés.</strong> Pour des variables réelles \(X\), \(Y\) et des réels \(a\), \(b\) :
    <ul>
      <li><strong>linéarité</strong> : \(E(aX + bY) = aE(X) + bE(Y)\), et \(E(aX + b) = aE(X) + b\) ;</li>
      <li><strong>positivité</strong> : si \(X \geq 0\), alors \(E(X) \geq 0\) ; <strong>croissance</strong> : si \(X \leq Y\), alors \(E(X) \leq E(Y)\) ;</li>
      <li><strong>inégalité triangulaire</strong> : \(|E(X)| \leq E(|X|)\).</li>
    </ul>
    Toutes ces propriétés valent <strong>sans hypothèse d'indépendance</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Écrire l'espérance comme une somme sur les issues.</span>
    <div class="content"><p>Avec la formule \(E(X) = \sum_\omega X(\omega)P(\{\omega\})\), l'espérance est une combinaison linéaire des valeurs \(X(\omega)\) à coefficients positifs :</p>
    <div class="formula">$$E(aX + bY) = \sum_\omega \big(aX(\omega) + bY(\omega)\big)P(\{\omega\}) = aE(X) + bE(Y).$$</div>
    <p> Si \(X(\omega) \geq 0\) pour tout \(\omega\), la somme est positive ; la croissance s'en déduit en appliquant la positivité à \(Y - X\), et l'inégalité triangulaire à \(-|X| \leq X \leq |X|\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Espérance d'une loi binomiale.</strong> Si \(X \sim \mathcal B(n, p)\), \(E(X) = np\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Par linéarité, ou par la formule du capitaine.</span>
    <div class="content"><p>L'espérance ne dépend que de la loi : on peut supposer \(X = X_1 + \dots + X_n\) avec \(X_i \sim \mathcal B(p)\) indépendantes (§6), et la linéarité donne \(E(X) = np\). Par le calcul, grâce à \(k\binom nk = n\binom{n-1}{k-1}\) et à la formule du binôme :</p>
    <div class="formula">$$\sum_{k=0}^n k\binom nk p^k(1-p)^{n-k} = np\sum_{k=1}^n\binom{n-1}{k-1}p^{k-1}(1-p)^{n-k} = np\,\big(p + 1 - p\big)^{n-1} = np.$$</div></div>
  </div>
  <div class="prop-box">
    <strong>Formule de transfert.</strong> Pour toute fonction \(f\) définie sur \(X(\Omega)\) :
    <div class="formula" data-nom="Formule de transfert">$$E\big(f(X)\big) = \sum_{x \in X(\Omega)} f(x)\,P(X = x).$$</div>
    Elle s'applique aux couples, et de même aux \(n\)-uplets :<div class="formula">$$E\big(g(X, Y)\big) = \sum_{x, y} g(x, y)\,P(X = x, Y = y).$$</div>
  </div>
  <p>Intérêt : on calcule \(E(X^2)\), \(E(|X - 3|)\) ou \(E(XY)\) sans déterminer la loi de \(X^2\), \(|X - 3|\) ou \(XY\). Démonstration : on regroupe les issues de la somme \(\sum_\omega f\big(X(\omega)\big)P(\{\omega\})\) selon la valeur de \(X(\omega)\).</p>
  <div class="prop-box">
    <strong>Produit de variables indépendantes.</strong> Si \(X \perp\!\!\!\perp Y\), alors \(E(XY) = E(X)\,E(Y)\) ; plus généralement \(E(X_1 \cdots X_n) = E(X_1) \cdots E(X_n)\) pour des variables indépendantes.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Transfert sur le couple, puis la loi conjointe factorisée.</span>
    <div class="content"><div class="formula">$$\begin{aligned} E(XY) &= \sum_{x, y} xy\,P(X = x)P(Y = y) \\ &= \Big(\sum_x x\,P(X = x)\Big)\Big(\sum_y y\,P(Y = y)\Big) = E(X)E(Y). \end{aligned}$$</div></div>
  </div>
  <div class="method-box">
    <strong>Exemple — trois calculs d'espérance</strong>
    <ol>
      <li>Somme de deux dés : par la loi, \(E(S) = \frac{2 \times 1 + 3 \times 2 + \dots + 12 \times 1}{36}\), soit \(\frac{252}{36} = 7\) ; par linéarité, \(E(S) = E(X_1) + E(X_2)\), soit \(3{,}5 + 3{,}5 = 7\), sans calcul de loi.</li>
      <li>Transfert, avec la loi de \(T = |S - 7|\) du §1 : \(E(T) = \frac{10 + 16 + 18 + 16 + 10}{36}\), soit \(\frac{70}{36} = \frac{35}{18} \approx 1{,}94\) (on peut aussi sommer \(|s - 7|\,P(S = s)\) sur les valeurs de \(S\)).</li>
      <li>Points fixes : on range au hasard \(n\) lettres dans leurs \(n\) enveloppes (permutation uniforme). Le nombre \(N\) de lettres bien rangées vaut \(\mathbf 1_{A_1} + \dots + \mathbf 1_{A_n}\), où \(A_i\) : « la lettre \(i\) est bien rangée », \(P(A_i) = \frac1n\). Par linéarité, \(E(N) = n \times \frac1n = 1\), quel que soit \(n\), alors que la loi de \(N\) est compliquée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(E(XY) = E(X)E(Y)\) ou \(E\big(f(X)\big) = f\big(E(X)\big)\) sans justification. Pour un dé, \(E(X^2) = \frac{91}{6} \approx 15{,}2\), alors que \(E(X)^2 = 12{,}25\). Et l'espérance n'est pas forcément une valeur possible : 3,5 pour un dé.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · VARIANCE ET ÉCART TYPE</div>
  <h2>Mesurer la dispersion</h2>
  <div class="intro">Deux variables de même espérance peuvent être très différentes : un gain certain de 10 € et un gain de 0 ou 20 € à pile ou face. La variance mesure l'écart moyen à l'espérance, au carré ; l'écart type ramène cette mesure à l'unité de \(X\). Ce sont des indicateurs de <em>dispersion</em>.</div>

  <div class="def-box">
    La <strong>variance</strong> et l'<strong>écart type</strong> d'une variable réelle \(X\) sont
    <div class="formula" data-nom="Variance et écart type">$$\begin{gathered} V(X) = E\Big(\big(X - E(X)\big)^2\Big) \geq 0, \\ \sigma(X) = \sqrt{V(X)}. \end{gathered}$$</div>
    Si \(\sigma(X) \gt 0\), la variable \(\dfrac{X - E(X)}{\sigma(X)}\) est <strong>centrée réduite</strong> : d'espérance 0 et de variance 1.
  </div>
  <div class="prop-box">
    <strong>Formules de calcul.</strong>
    <div class="formula" data-nom="Formule de König-Huygens">$$\begin{gathered} V(X) = E(X^2) - E(X)^2, \\ V(aX + b) = a^2\,V(X). \end{gathered}$$</div>
    \(V(X) = 0\) si et seulement si \(X\) prend la valeur \(E(X)\) avec probabilité 1.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Développer le carré et utiliser la linéarité.</span>
    <div class="content"><p>Avec \(m = E(X)\), constante : \(E\big((X - m)^2\big) = E(X^2) - 2mE(X) + m^2\), soit \(E(X^2) - m^2\). Puis \(aX + b - E(aX + b) = a(X - m)\), d'où \(V(aX + b) = E\big(a^2(X - m)^2\big)\), soit \(a^2V(X)\). Enfin \(V(X) = \sum_x (x - m)^2P(X = x)\) est une somme de termes positifs : elle est nulle si et seulement si \(P(X = x) = 0\) pour tout \(x \neq m\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Variances usuelles.</strong> Si \(X \sim \mathcal B(p)\), \(V(X) = p(1-p)\) ; si \(X \sim \mathcal B(n, p)\), \(V(X) = np(1-p)\) (démontré au §9) ; si \(X \sim \mathcal U(\{1, \dots, n\})\), \(E(X) = \dfrac{n+1}{2}\) et \(V(X) = \dfrac{n^2 - 1}{12}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Bernoulli : X² = X. Uniforme : sommes des entiers et des carrés.</span>
    <div class="content"><p>Si \(X \sim \mathcal B(p)\), \(X^2 = X\) (car \(X \in \{0, 1\}\)), donc \(V(X) = p - p^2\). Si \(X \sim \mathcal U(\{1, \dots, n\})\) : \(E(X) = \frac1n\sum_{k=1}^n k = \frac{n+1}{2}\) et \(E(X^2) = \frac1n\sum_{k=1}^n k^2\), soit \(\frac{(n+1)(2n+1)}{6}\), d'où \(V(X) = \frac{(n+1)(2n+1)}{6} - \frac{(n+1)^2}{4}\), soit \(\frac{(n+1)(n-1)}{12}\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — un dé, et un dé transformé</strong>
    <ol>
      <li>\(X \sim \mathcal U(\{1, \dots, 6\})\) : \(E(X) = \frac72\), \(E(X^2) = \frac{91}{6}\), \(V(X) = \frac{91}{6} - \frac{49}{4}\), soit \(\frac{35}{12} \approx 2{,}92\) (et la formule \(\frac{n^2 - 1}{12} = \frac{35}{12}\) le confirme), \(\sigma(X) \approx 1{,}71\).</li>
      <li>\(Y = 2X - 3\) : \(E(Y) = 2 \times 3{,}5 - 3 = 4\) et \(V(Y) = 4 \times \frac{35}{12} = \frac{35}{3}\) ; la constante \(-3\) décale sans disperser.</li>
      <li>Pour une variable de Bernoulli, \(p(1-p)\) est maximale (égale à \(\frac14\)) pour \(p = \frac12\) : c'est la pièce équilibrée qui est la plus imprévisible.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(V(aX + b) = aV(X) + b\), ou \(V(-X) = -V(X)\) (une variance est positive : \(V(-X) = V(X)\)). Autre piège : oublier que \(V(X)\) a l'unité de \(X\) au carré ; on compare les dispersions avec \(\sigma\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · COVARIANCE ET VARIANCE D'UNE SOMME</div>
  <h2>Comment deux variables varient ensemble</h2>
  <div class="intro">La variance d'une somme n'est pas la somme des variances : il faut tenir compte de la tendance des deux variables à s'écarter de leur moyenne dans le même sens ou en sens contraires. La covariance mesure cette tendance.</div>

  <div class="def-box">
    La <strong>covariance</strong> de deux variables réelles \(X\) et \(Y\) est
    <div class="formula" data-nom="Covariance">$$\begin{aligned} \operatorname{Cov}(X, Y) &= E\Big(\big(X - E(X)\big)\big(Y - E(Y)\big)\Big) \\ &= E(XY) - E(X)E(Y). \end{aligned}$$</div>
    \(X\) et \(Y\) sont <strong>décorrélées</strong> si \(\operatorname{Cov}(X, Y) = 0\). On a \(\operatorname{Cov}(X, X) = V(X)\) ; la covariance est symétrique et, par linéarité de l'espérance, bilinéaire : \(\operatorname{Cov}(aX + bY, Z)\) vaut \(a\operatorname{Cov}(X, Z) + b\operatorname{Cov}(Y, Z)\).
  </div>
  <div class="prop-box">
    <strong>Variance d'une somme.</strong>
    <div class="formula" data-nom="Variance d'une somme">$$\begin{gathered} V(X + Y) = V(X) + V(Y) + 2\operatorname{Cov}(X, Y), \\ V\Big(\sum_{i=1}^n X_i\Big) = \sum_{i=1}^n V(X_i) + 2\sum_{i \lt j}\operatorname{Cov}(X_i, X_j). \end{gathered}$$</div>
    Si \(X \perp\!\!\!\perp Y\), alors \(\operatorname{Cov}(X, Y) = 0\) ; si les \(X_i\) sont deux à deux décorrélées (en particulier indépendantes), \(V\big(\sum X_i\big) = \sum V(X_i)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Développer le carré de la somme des écarts.</span>
    <div class="content"><p>Avec \(\tilde X = X - E(X)\) et \(\tilde Y = Y - E(Y)\), on a \((X + Y) - E(X + Y) = \tilde X + \tilde Y\), donc \(V(X + Y) = E(\tilde X^2) + E(\tilde Y^2) + 2E(\tilde X\tilde Y)\). L'expression \(E(XY) - E(X)E(Y)\) s'obtient en développant \(\tilde X\tilde Y\). Si \(X \perp\!\!\!\perp Y\), \(E(XY) = E(X)E(Y)\) (§7), donc la covariance est nulle. Pour \(n\) variables, on développe \(\big(\sum \tilde X_i\big)^2\).</p></div>
  </div>
  <p><strong>Variance binomiale retrouvée.</strong> Si \(X = X_1 + \dots + X_n\) avec \(X_i \sim \mathcal B(p)\) indépendantes, \(V(X) = \sum V(X_i) = np(1-p)\).</p>
  <div class="method-box">
    <strong>Exemple — minimum et maximum de deux dés</strong>
    <ol>
      <li>Avec la loi du §4 :<div class="formula">$$E(X) = \frac{11 + 18 + 21 + 20 + 15 + 6}{36} = \frac{91}{36},$$</div>et \(E(Y) = \frac{161}{36}\). Contrôle : \(X + Y = X_1 + X_2\), donc \(E(X) + E(Y) = 7\).</li>
      <li>Astuce : \(XY = \min \times \max = X_1X_2\), et \(X_1 \perp\!\!\!\perp X_2\) : \(E(XY) = 3{,}5^2 = \frac{49}{4}\). D'où \(\operatorname{Cov}(X, Y) = \frac{49}{4} - \frac{91 \times 161}{1\,296}\), soit \(\frac{1\,225}{1\,296} \approx 0{,}945 \gt 0\) : un grand minimum va de pair avec un grand maximum.</li>
      <li>Comme \(Y \sim 7 - X\) (échanger \(k\) et \(7 - k\) sur les deux dés), \(V(X) = V(Y)\) ; et \(V(X + Y) = V(X_1 + X_2)\), soit \(2 \times \frac{35}{12} = \frac{35}{6}\). La formule de la variance d'une somme donne \(2V(X) + 2 \times \frac{1\,225}{1\,296} = \frac{35}{6}\), soit \(V(X) = \frac{2\,555}{1\,296} \approx 1{,}97\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — décorrélées mais pas indépendantes</strong>
    <ol>
      <li>\(X \sim \mathcal U(\{-1, 0, 1\})\) et \(Y = X^2\). \(E(X) = 0\) et \(E(XY) = E(X^3) = 0\), donc \(\operatorname{Cov}(X, Y) = 0\).</li>
      <li>Pourtant \(P(X = 0, Y = 1) = 0\), alors que \(P(X = 0)P(Y = 1) = \frac13 \times \frac23\) : \(X\) et \(Y\) ne sont pas indépendantes (\(Y\) est même une fonction de \(X\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(V(X + Y) = V(X) + V(Y)\) sans hypothèse, ou \(V(X - Y) = V(X) - V(Y)\). Pour des variables indépendantes, \(V(X - Y) = V(X) + V(-Y)\), soit \(V(X) + V(Y)\) : les dispersions s'ajoutent toujours. Et « covariance nulle » n'entraîne pas « indépendantes ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · INÉGALITÉS DE MARKOV ET DE BIENAYMÉ-TCHEBYCHEV</div>
  <h2>Majorer une probabilité sans connaître la loi</h2>
  <div class="intro">Connaître seulement l'espérance, ou l'espérance et la variance, suffit à majorer la probabilité de grandes valeurs ou de grands écarts. Ces bornes sont souvent grossières, mais universelles : elles valent pour toutes les lois, et elles sont à la base de l'interprétation fréquentiste des probabilités (§11).</div>

  <div class="prop-box">
    <strong>Inégalité de Markov.</strong> Si \(X\) est une variable réelle <strong>positive</strong>, pour tout \(a \gt 0\) :
    <div class="formula" data-nom="Inégalité de Markov">$$P(X \geq a) \leq \frac{E(X)}{a}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Comparer X à a fois une indicatrice.</span>
    <div class="content"><p>Comme \(X \geq 0\), on a \(X \geq a\,\mathbf 1_{(X \geq a)}\) en tout point (si \(X \geq a\), les deux membres valent \(X\) et \(a\) ; sinon le second est nul). Par croissance de l'espérance, \(E(X) \geq a\,E\big(\mathbf 1_{(X \geq a)}\big) = a\,P(X \geq a)\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Inégalité de Bienaymé-Tchebychev.</strong> Pour toute variable réelle \(X\) et tout \(\varepsilon \gt 0\) :
    <div class="formula" data-nom="Inégalité de Bienaymé-Tchebychev">$$P\big(|X - E(X)| \geq \varepsilon\big) \leq \frac{V(X)}{\varepsilon^2}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Markov appliquée au carré de l'écart.</span>
    <div class="content"><p>Les événements \(\big(|X - E(X)| \geq \varepsilon\big)\) et \(\big((X - E(X))^2 \geq \varepsilon^2\big)\) sont égaux. La variable \((X - E(X))^2\) est positive, d'espérance \(V(X)\) : l'inégalité de Markov avec \(a = \varepsilon^2\) conclut.</p></div>
  </div>
  <p>Ces <strong>inégalités de concentration</strong> disent qu'une variable de petite variance est concentrée près de son espérance. Avec \(\varepsilon = k\sigma(X)\), la probabilité de s'écarter de plus de \(k\) écarts types est au plus \(\frac{1}{k^2}\) : au plus 25 % pour 2 écarts types, 11 % pour 3.</p>

<div class="course-section">
  <div class="sec-num">§11 · MOYENNE DE VARIABLES INDÉPENDANTES</div>
  <h2>Pourquoi la fréquence approche la probabilité</h2>
  <div class="intro">Lancer une pièce 1 000 fois donne « environ » 50 % de piles. Le programme de première année s'achève sur la justification de cette expérience : la moyenne de \(n\) variables indépendantes de même loi a la même espérance que chacune, mais une variance divisée par \(n\), et Bienaymé-Tchebychev la concentre autour de cette espérance.</div>

  <div class="prop-box">
    <strong>Moyenne empirique.</strong> Soit \(X_1, \dots, X_n\) des variables indépendantes de même loi, d'espérance \(m\) et de variance \(\sigma^2\), et \(\overline X_n = \frac1n(X_1 + \dots + X_n)\). Alors \(E(\overline X_n) = m\), \(V(\overline X_n) = \frac{\sigma^2}{n}\), et pour tout \(\varepsilon \gt 0\) :
    <div class="formula" data-nom="Bienaymé-Tchebychev pour une moyenne">$$P\big(|\overline X_n - m| \geq \varepsilon\big) \leq \frac{\sigma^2}{n\,\varepsilon^2}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Linéarité, variance d'une somme indépendante, puis Bienaymé-Tchebychev.</span>
    <div class="content"><p>\(E(\overline X_n) = \frac1n \times nm\), soit \(m\). Par indépendance, \(V(X_1 + \dots + X_n) = n\sigma^2\), d'où \(V(\overline X_n) = \frac{1}{n^2} \times n\sigma^2\), soit \(\frac{\sigma^2}{n}\). On applique Bienaymé-Tchebychev à \(\overline X_n\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Interprétation fréquentiste.</strong> On répète \(n\) fois, de façon indépendante, une expérience où un événement a la probabilité \(p\). La fréquence \(F_n\) de réalisation de l'événement est la moyenne de \(n\) variables de Bernoulli indépendantes de paramètre \(p\), d'où
    <div class="formula" data-nom="Fréquence et probabilité">$$P\big(|F_n - p| \geq \varepsilon\big) \leq \frac{p(1-p)}{n\,\varepsilon^2} \leq \frac{1}{4n\,\varepsilon^2}.$$</div>
    Pour \(\varepsilon\) fixé, cette borne tend vers 0 quand \(n\) grandit : la fréquence observée se rapproche de la probabilité.
  </div>

</figure>
  <div class="method-box">
    <strong>Exemple — taille d'un sondage</strong>
    <ol>
      <li>On veut estimer la proportion \(p\) d'électeurs d'un candidat par la fréquence \(F_n\) observée sur \(n\) personnes tirées au hasard (tirages assimilés à des tirages indépendants), à \(\varepsilon = 0{,}03\) près, avec un risque d'erreur d'au plus 5 %.</li>
      <li>On ne connaît pas \(p\), mais \(p(1-p) \leq \frac14\) : il suffit que \(\frac{1}{4n \times 0{,}03^2} \leq 0{,}05\), soit \(n \geq \frac{1}{4 \times 0{,}0009 \times 0{,}05} \approx 5\,555{,}6\).</li>
      <li>Conclusion : 5 556 personnes suffisent. La borne est prudente : un calcul plus fin (approximation normale, hors programme) montre qu'environ 1 100 personnes suffiraient.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier l'hypothèse d'indépendance (des variables très corrélées ne se « moyennent » pas : si \(X_1 = \dots = X_n\), \(\overline X_n = X_1\) ne se concentre pas), ou croire qu'après une série de piles, face devient « plus probable » pour rattraper la moyenne : les lancers sont indépendants, c'est la <em>fréquence</em> qui se stabilise, pas le nombre de piles moins le nombre de faces.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Variables à valeurs infinies, loi faible des grands nombres</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI ; les deux premiers sont au programme de 2ᵉ année.</div>
  <p><strong>Lois géométrique et de Poisson (2ᵉ année).</strong> Le rang \(T\) du premier succès dans une suite illimitée d'épreuves de Bernoulli indépendantes de paramètre \(p \in \,]0, 1[\) prend une infinité de valeurs : \(P(T = k) = (1-p)^{k-1}p\) pour \(k \geq 1\), \(E(T) = \frac1p\), \(V(T) = \frac{1-p}{p^2}\) (loi géométrique, sans mémoire). La loi de Poisson \(\mathcal P(\lambda)\), \(P(X = k) = e^{-\lambda}\frac{\lambda^k}{k!}\) pour \(k \in \mathbb N\), d'espérance et de variance \(\lambda\), modélise les événements rares ; elle approche \(\mathcal B(n, p)\) lorsque \(n\) est grand, \(p\) petit et \(np = \lambda\) (la binomiale restant la loi exacte). Ces lois demandent un univers infini et des séries : chapitres <a href="#vadisc1/cours">« Variables aléatoires discrètes I »</a> et <a href="#vadisc2/cours">« Variables aléatoires discrètes II »</a>, après <a href="#espproba/cours">« Espaces probabilisés »</a>.</p>
  <p><strong>Loi faible des grands nombres (2ᵉ année).</strong> La borne du §11 montre que \(P\big(|\overline X_n - m| \geq \varepsilon\big) \to 0\) quand \(n \to +\infty\), pour tout \(\varepsilon \gt 0\) : c'est la loi faible des grands nombres, énoncée en 2ᵉ année.</p>
  <p><strong>Loi hypergéométrique et fonction de répartition (hors programme des deux années).</strong> Le nombre d'objets marqués dans un tirage simultané (sans remise) suit la loi hypergéométrique, vue en exemple au chapitre « Dénombrement » ; sa variance est plus petite que celle de la binomiale correspondante (les tirages sans remise sont négativement corrélés). La fonction de répartition \(F_X(t) = P(X \leq t)\), en escalier, n'est pas au programme.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · VARIABLES ALÉATOIRES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix gestes : déterminer une loi, reconnaître une loi usuelle, raisonner par cas avec une loi conditionnelle, exploiter un couple, prouver ou réfuter l'indépendance, calculer espérance et variance (indicatrices, transfert, covariance), majorer par Markov ou Bienaymé-Tchebychev, dimensionner un échantillon.</div>

  <div class="method-box"><strong>Méthode 1 — Déterminer la loi d'une variable</strong>
    <ol>
      <li>Lister les valeurs possibles \(X(\Omega)\).</li>
      <li>Pour chaque valeur \(x\), décrire l'événement \((X = x)\) en mots, puis calculer sa probabilité (dénombrement, probabilités composées, indépendance). Pour un maximum ou un minimum, passer par \(P(X \leq k)\) puis \(P(X = k)\) comme différence \(P(X \leq k) - P(X \leq k - 1)\).</li>
      <li>Contrôler que la somme des probabilités vaut 1.</li>
    </ol>
    <p><em>Exemple éclair :</em> on tire successivement sans remise deux boules parmi quatre numérotées de 1 à 4 ; \(X\) = plus grand numéro. \(P(X \leq k) = \frac{k(k-1)}{12}\), d'où \(P(X = 2) = \frac16\), \(P(X = 3) = \frac13\), \(P(X = 4) = \frac12\) (somme 1).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Reconnaître une loi usuelle</strong>
    <ol>
      <li>Une seule épreuve à deux issues, on note le succès : \(\mathcal B(p)\) (c'est une indicatrice).</li>
      <li>Un choix « au hasard » dans un ensemble fini : \(\mathcal U(E)\).</li>
      <li>On compte les succès de \(n\) épreuves <strong>indépendantes</strong> de <strong>même</strong> probabilité \(p\) : écrire \(X = X_1 + \dots + X_n\) avec \(X_i \sim \mathcal B(p)\) indépendantes et conclure \(X \sim \mathcal B(n, p)\), en citant les deux hypothèses.</li>
    </ol>
    <p><em>Exemple éclair :</em> nombre de 6 en 10 lancers d'un dé : \(\mathcal B\big(10, \frac16\big)\), d'espérance \(\frac{10}{6} = \frac53\). Tirages simultanés dans un lot : pas binomiale (méthode 1, par dénombrement).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : les lois géométrique et de Poisson ne sont pas au programme de PTSI ; « le rang du premier succès » sans borne sur le nombre d'essais demande un univers infini (2ᵉ année). En PTSI, on limite le nombre d'essais.</div>

  <div class="method-box"><strong>Méthode 3 — Calculer une loi par cas (loi conditionnelle)</strong>
    <ol>
      <li>Repérer la circonstance qui détermine la loi (pièce choisie, résultat d'un premier dé) et former le système complet \((A_i)\).</li>
      <li>Écrire la loi conditionnelle de \(X\) sachant chaque \(A_i\), souvent une loi usuelle.</li>
      <li>Probabilités totales, puis Bayes pour remonter à la circonstance :<div class="formula">$$P(X = x) = \sum_i P(X = x \mid A_i)\,P(A_i).$$</div></li>
    </ol>
    <p><em>Exemple éclair :</em> un dé donne \(D = d\), puis on lance \(d\) pièces ; \(P(N = 0) = \sum_{d=1}^{6}\frac16 \times \frac{1}{2^d} = \frac{21}{128}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Exploiter la loi conjointe d'un couple</strong>
    <ol>
      <li>Dresser le tableau des \(P(X = x, Y = y)\) et vérifier que la somme vaut 1.</li>
      <li>Marginales : sommes des lignes et des colonnes. Loi de \(Y\) sachant \((X = x)\) : ligne \(x\) divisée par \(P(X = x)\).</li>
      <li>Toute variable \(g(X, Y)\) : regrouper les cases de même valeur (loi) ou utiliser le transfert (espérance).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(P(0,0) = 0{,}1\), \(P(0,1) = 0{,}2\), \(P(1,0) = 0{,}3\), \(P(1,1) = 0{,}4\) : \(P(X = 1) = 0{,}7\), \(P(Y = 1) = 0{,}6\), et \(X + Y\) vaut 0, 1, 2 avec les probabilités 0,1 ; 0,5 ; 0,4.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Calculer une espérance</strong>
    <ol>
      <li>Si la loi est connue : \(E(X) = \sum x\,P(X = x)\), ou la formule de la loi usuelle (\(p\), \(np\), \(\frac{n+1}{2}\)).</li>
      <li>Pour \(E\big(f(X)\big)\) ou \(E\big(g(X, Y)\big)\) : formule de transfert, sans chercher la loi de \(f(X)\).</li>
      <li>Pour un <strong>nombre d'objets</strong> : l'écrire comme une somme d'indicatrices et utiliser \(E(\mathbf 1_A) = P(A)\) et la linéarité, <em>même si les indicatrices ne sont pas indépendantes</em>.</li>
    </ol>
    <p><em>Exemple éclair :</em> nombre de faces différentes obtenues avec 3 dés : \(\sum_{k=1}^{6}\mathbf 1_{A_k}\), \(A_k\) : « la face \(k\) apparaît », \(P(A_k) = 1 - \big(\frac56\big)^3\), d'où \(E = 6\big(1 - \frac{125}{216}\big) = \frac{91}{36} \approx 2{,}53\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer une variance</strong>
    <ol>
      <li>En général : \(V(X) = E(X^2) - E(X)^2\), avec \(E(X^2)\) par transfert.</li>
      <li>Transformation affine : \(V(aX + b) = a^2V(X)\).</li>
      <li>Somme : les covariances disparaissent si les variables sont indépendantes (ou décorrélées) :<div class="formula">$$V\Big(\sum_i X_i\Big) = \sum_i V(X_i) + 2\sum_{i \lt j}\operatorname{Cov}(X_i, X_j).$$</div></li>
    </ol>
    <p><em>Exemple éclair :</em> \(X \sim \mathcal B\big(10, \frac14\big)\) : \(V(X) = 10 \times \frac14 \times \frac34 = \frac{15}{8}\) ; le score \(N = \frac{4X - 10}{3}\) a pour variance \(\frac{16}{9} \times \frac{15}{8} = \frac{10}{3}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la linéarité vaut pour l'espérance sans condition, mais la variance d'une somme demande les covariances. Pour des indicatrices dépendantes (tirages sans remise, points fixes), calculer \(E(\mathbf 1_{A_i}\mathbf 1_{A_j}) = P(A_i \cap A_j)\).</div>

  <div class="method-box"><strong>Méthode 7 — Montrer ou réfuter l'indépendance de deux variables</strong>
    <ol>
      <li>Pour réfuter : trouver un couple de valeurs \((x, y)\) pour lequel \(P(X = x, Y = y)\) diffère de \(P(X = x)P(Y = y)\) ; une case nulle du tableau avec des marginales non nulles suffit.</li>
      <li>Pour prouver : vérifier la formule produit pour <strong>toutes</strong> les cases, ou invoquer la modélisation (expériences indépendantes) et le lemme des coalitions.</li>
      <li>Une covariance non nulle prouve la dépendance ; une covariance nulle ne prouve rien (sauf pour deux variables de Bernoulli).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour le minimum \(X\) et le maximum \(Y\) de deux dés, \(P(X = 6, Y = 1) = 0\) alors que \(P(X = 6)P(Y = 1) = \frac{1}{36^2}\) : dépendantes.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Utiliser le lemme des coalitions</strong>
    <ol>
      <li>Partir de variables indépendantes \(X_1, \dots, X_n\) (expériences indépendantes).</li>
      <li>Repérer deux fonctions qui portent sur des paquets <strong>disjoints</strong> de variables.</li>
      <li>Conclure à leur indépendance, puis multiplier probabilités ou espérances (l'espérance du produit des deux fonctions est le produit de leurs espérances).</li>
    </ol>
    <p><em>Exemple éclair :</em> quatre dés ; \(U = X_1 + X_2\) et \(W = \max(X_3, X_4)\) sont indépendantes, donc \(E(UW) = 7 \times \frac{161}{36} = \frac{1\,127}{36}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Majorer une probabilité par Markov ou Bienaymé-Tchebychev</strong>
    <ol>
      <li>Grande valeur d'une variable <strong>positive</strong> dont on ne connaît que l'espérance : Markov, \(P(X \geq a) \leq \frac{E(X)}{a}\).</li>
      <li>Écart à la moyenne, espérance et variance connues : Bienaymé-Tchebychev ; ramener l'événement à \((|X - E(X)| \geq \varepsilon)\), au besoin par une inclusion.</li>
      <li>Comparer, si possible, à la valeur exacte : la borne est souvent grossière.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(X \sim \mathcal B\big(10, \frac14\big)\), \(E(X) = 2{,}5\) : \((X \geq 5{,}5)\) est inclus dans \((|X - 2{,}5| \geq 3)\), donc \(P(X \geq 6) \leq \frac{15/8}{9} = \frac{5}{24} \approx 0{,}21\) (valeur exacte \(\approx 0{,}020\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Dimensionner un échantillon (interprétation fréquentiste)</strong>
    <ol>
      <li>Modéliser les observations par des variables indépendantes de même loi \(X_1, \dots, X_n\) et introduire la moyenne \(\overline X_n\) (une fréquence pour des Bernoulli).</li>
      <li>Écrire \(P(|\overline X_n - m| \geq \varepsilon) \leq \frac{\sigma^2}{n\varepsilon^2}\), avec \(\sigma^2 \leq \frac14\) pour une fréquence quand \(p\) est inconnu.</li>
      <li>Imposer que la borne soit au plus le risque \(\alpha\) toléré : \(n \geq \frac{\sigma^2}{\alpha\varepsilon^2}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> précision \(\varepsilon = 0{,}05\), risque \(\alpha = 0{,}1\) : \(n \geq \frac{1}{4 \times 0{,}0025 \times 0{,}1} = 1\,000\).</p>
  </div>
  <div class="notice"><strong>Pièges classiques</strong> : confondre « même loi » et « égales » ; appliquer la loi binomiale sans indépendance ; écrire \(E(XY) = E(X)E(Y)\) ou \(V(X + Y) = V(X) + V(Y)\) sans indépendance ; croire qu'une covariance nulle prouve l'indépendance ; appliquer Markov à une variable non positive.</div>
</div>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Loi, espérance et variance d'un dé</h3>
  <div class="statement">On lance un dé équilibré à 6 faces. Soit \(X\) le résultat.</div>
  <div class="q"><strong>Q1.</strong> Donner la loi de \(X\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(E(X)\) et \(V(X)\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(Y = 2X - 3\). Calculer \(E(Y)\) et \(V(Y)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(X \sim \mathcal U(\{1, \dots, 6\})\) : \(P(X = k) = \frac16\) pour \(k = 1, \dots, 6\).</p>
    <p><strong>Q2.</strong> \(E(X) = \frac{1 + 2 + \dots + 6}{6} = \frac{21}{6} = \frac72\). Transfert : \(E(X^2) = \frac{1 + 4 + 9 + 16 + 25 + 36}{6} = \frac{91}{6}\). König-Huygens : \(V(X) = \frac{91}{6} - \frac{49}{4}\), soit \(\frac{182 - 147}{12} = \frac{35}{12} \approx 2{,}92\), conforme à \(\frac{n^2 - 1}{12}\) pour \(n = 6\).</p>
    <p><strong>Q3.</strong> Linéarité : \(E(Y) = 2E(X) - 3 = 4\). \(V(Y) = 2^2\,V(X) = \frac{35}{3}\) (la constante ne change pas la dispersion).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Le maximum de deux dés</h3>
  <div class="statement">On lance deux dés équilibrés, de résultats \(X_1\) et \(X_2\) indépendants, et l'on note \(Y = \max(X_1, X_2)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(P(Y \leq k)\) pour \(k \in \{1, \dots, 6\}\), puis la loi de \(Y\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(E(Y)\). Un jeu consiste à payer 4 € puis à recevoir \(Y\) euros : est-il favorable au joueur ?</div>
  <div class="q"><strong>Q3.</strong> Calculer \(V(Y)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \((Y \leq k) = (X_1 \leq k) \cap (X_2 \leq k)\), deux événements indépendants : \(P(Y \leq k) = \big(\frac k6\big)^2\), soit \(\frac{k^2}{36}\). Donc \(P(Y = k) = \frac{k^2 - (k-1)^2}{36}\), soit \(\frac{2k - 1}{36}\) : on obtient \(\frac{1}{36}, \frac{3}{36}, \frac{5}{36}, \frac{7}{36}, \frac{9}{36}, \frac{11}{36}\) (somme 1).</p>
    <p><strong>Q2.</strong> \(E(Y) = \frac{1 + 6 + 15 + 28 + 45 + 66}{36}\), soit \(\frac{161}{36} \approx 4{,}47\). Le gain net \(Y - 4\) a pour espérance \(\frac{161}{36} - 4 = \frac{17}{36} \approx 0{,}47\) € : le jeu est favorable au joueur (en moyenne, sur un grand nombre de parties).</p>
    <p><strong>Q3.</strong> \(E(Y^2) = \frac{1 + 12 + 45 + 112 + 225 + 396}{36}\), soit \(\frac{791}{36}\), donc \(V(Y) = \frac{791}{36} - \big(\frac{161}{36}\big)^2\), soit \(\frac{28\,476 - 25\,921}{1\,296} = \frac{2\,555}{1\,296} \approx 1{,}97\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Tirs répétés</h3>
  <div class="statement">Un tireur atteint sa cible avec la probabilité \(p = 0{,}7\). Il tire 5 fois ; les tirs sont indépendants. Soit \(X\) le nombre de cibles atteintes.</div>
  <div class="q"><strong>Q1.</strong> Quelle est la loi de \(X\) ? Justifier.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(X = 3)\) et \(P(X \geq 4)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(E(X)\) et \(\sigma(X)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(X = X_1 + \dots + X_5\), où \(X_i\) indique la réussite du tir \(i\) : variables de Bernoulli de même paramètre 0,7, indépendantes. Donc \(X \sim \mathcal B(5; 0{,}7)\).</p>
    <p><strong>Q2.</strong> \(P(X = 3) = \binom 53\,0{,}7^3\,0{,}3^2\), soit \(10 \times 0{,}343 \times 0{,}09 = 0{,}3087\). \(P(X = 4) = 5 \times 0{,}2401 \times 0{,}3\), soit \(0{,}36015\) et \(P(X = 5) = 0{,}7^5 = 0{,}16807\), d'où \(P(X \geq 4) = 0{,}52822\).</p>
    <p><strong>Q3.</strong> \(E(X) = np = 3{,}5\) ; \(V(X) = np(1-p) = 1{,}05\), donc \(\sigma(X) = \sqrt{1{,}05} \approx 1{,}02\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Un QCM rempli au hasard</h3>
  <div class="statement">Un QCM compte 20 questions, chacune à 4 propositions dont une seule est juste. Un candidat répond au hasard à toutes les questions, indépendamment. Une bonne réponse rapporte 1 point, une mauvaise en retire \(\frac13\).</div>
  <div class="q"><strong>Q1.</strong> Loi, espérance et variance du nombre \(X\) de bonnes réponses ?</div>
  <div class="q"><strong>Q2.</strong> Exprimer la note \(N\) en fonction de \(X\), puis calculer \(E(N)\) et \(V(N)\). Commenter le choix de la pénalité.</div>
  <div class="q"><strong>Q3.</strong> Majorer \(P(X \geq 10)\) par Markov, puis par Bienaymé-Tchebychev. La valeur exacte est environ 0,014 : commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Somme de 20 variables de Bernoulli indépendantes de paramètre \(\frac14\) : \(X \sim \mathcal B\big(20, \frac14\big)\), \(E(X) = 5\), \(V(X) = 20 \times \frac14 \times \frac34\), soit \(\frac{15}{4}\).</p>
    <p><strong>Q2.</strong> \(N = X - \frac13(20 - X) = \frac{4X - 20}{3}\). Donc \(E(N) = \frac{4 \times 5 - 20}{3} = 0\) et \(V(N) = \frac{16}{9} \times \frac{15}{4} = \frac{20}{3}\). La pénalité de \(\frac13\) est choisie pour que répondre au hasard rapporte 0 en moyenne : sur une question, \(1 \times \frac14 - \frac13 \times \frac34 = 0\).</p>
    <p><strong>Q3.</strong> Markov (\(X \geq 0\)) : \(P(X \geq 10) \leq \frac{5}{10} = 0{,}5\). Bienaymé-Tchebychev : \((X \geq 10) \subset (|X - 5| \geq 5)\), donc \(P(X \geq 10) \leq \frac{15/4}{25} = 0{,}15\). Les deux bornes sont justes mais très au-dessus de la valeur exacte \(\approx 0{,}014\) : la seconde, qui utilise plus d'information (la variance), est meilleure.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Un dé, puis des pièces</h3>
  <div class="statement">On lance un dé équilibré, qui donne \(D\). On lance ensuite \(D\) pièces équilibrées, indépendamment, et l'on note \(N\) le nombre de piles obtenus.</div>
  <div class="q"><strong>Q1.</strong> Quelle est la loi conditionnelle de \(N\) sachant \((D = d)\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(N = 0)\) et \(P(N = 6)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(E(N)\) en écrivant \(E(N) = \sum_n n\,P(N = n)\) et en utilisant les probabilités totales.</div>
  <div class="q"><strong>Q4.</strong> On n'a obtenu aucun pile. Probabilité que le dé ait donné 1 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Sachant \(D = d\), \(N\) est le nombre de piles en \(d\) lancers indépendants : loi \(\mathcal B\big(d, \frac12\big)\).</p>
    <p><strong>Q2.</strong> Système complet \((D = d)_{1 \leq d \leq 6}\) :</p>
    <div class="formula">$$P(N = 0) = \sum_{d=1}^{6}\frac16 \times \frac{1}{2^d} = \frac16\Big(1 - \frac{1}{64}\Big) = \frac{63}{384} = \frac{21}{128} \approx 0{,}164.$$</div>
    <p>\(N = 6\) exige \(D = 6\) et six piles : \(P(N = 6) = \frac16 \times \frac{1}{64} = \frac{1}{384}\).</p>
    <p><strong>Q3.</strong> Probabilités totales, puis échange de deux sommes finies :</p>
    <div class="formula">$$E(N) = \sum_n n\sum_d P(N = n \mid D = d)\,P(D = d) = \sum_d \frac16\sum_n n\,P(N = n \mid D = d).$$</div>
    <p> La somme intérieure est l'espérance de \(\mathcal B\big(d, \frac12\big)\), soit \(\frac d2\). Donc \(E(N) = \frac16 \times \frac{1 + 2 + \dots + 6}{2}\), soit \(\frac{21}{12} = \frac74\) : la moitié de \(E(D) = 3{,}5\), comme l'intuition le suggère.</p>
    <p><strong>Q4.</strong> Bayes : \(P(D = 1 \mid N = 0) = \dfrac{\frac16 \times \frac12}{21/128}\), soit \(\dfrac{1/12}{21/128} = \dfrac{32}{63} \approx 0{,}51\). Aucun pile rend un petit nombre de pièces très probable.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Loi conjointe et indépendance</h3>
  <div class="statement">Le couple \((X, Y)\) a pour loi : \(P(X = 0, Y = 0) = 0{,}1\), \(P(X = 0, Y = 1) = 0{,}2\), \(P(X = 1, Y = 0) = 0{,}3\), \(P(X = 1, Y = 1) = 0{,}4\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les lois marginales de \(X\) et \(Y\).</div>
  <div class="q"><strong>Q2.</strong> \(X\) et \(Y\) sont-elles indépendantes ?</div>
  <div class="q"><strong>Q3.</strong> Calculer \(E(X)\), \(E(Y)\), \(E(XY)\) et \(\operatorname{Cov}(X, Y)\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(V(X + Y)\) de deux façons.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Sommes des lignes et des colonnes : \(P(X = 0) = 0{,}3\), \(P(X = 1) = 0{,}7\) ; \(P(Y = 0) = 0{,}4\), \(P(Y = 1) = 0{,}6\).</p>
    <p><strong>Q2.</strong> \(P(X = 0)P(Y = 0) = 0{,}12\), alors que \(P(X = 0, Y = 0) = 0{,}1\) : \(X\) et \(Y\) ne sont pas indépendantes (une seule case suffit).</p>
    <p><strong>Q3.</strong> \(E(X) = 0{,}7\), \(E(Y) = 0{,}6\) (Bernoulli). \(XY\) ne vaut 1 que si \(X = Y = 1\) : \(E(XY) = 0{,}4\). \(\operatorname{Cov}(X, Y) = 0{,}4 - 0{,}42 = -0{,}02\), non nulle, ce qui confirme la dépendance.</p>
    <p><strong>Q4.</strong> \(V(X) = 0{,}7 \times 0{,}3 = 0{,}21\), \(V(Y) = 0{,}24\), donc \(V(X + Y) = 0{,}21 + 0{,}24 - 0{,}04 = 0{,}41\). Directement : \(X + Y\) vaut 0, 1, 2 avec les probabilités 0,1 ; 0,5 ; 0,4, d'où \(E = 1{,}3\), \(E\big((X+Y)^2\big) = 0{,}5 + 1{,}6\), soit \(2{,}1\) et \(V = 2{,}1 - 1{,}69 = 0{,}41\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Décorrélation et indépendance</h3>
  <div class="statement">On compare « covariance nulle » et « indépendance ».</div>
  <div class="q"><strong>Q1.</strong> \(X\) suit la loi uniforme sur \(\{-2, -1, 1, 2\}\) et \(Y = X^2\). Calculer \(\operatorname{Cov}(X, Y)\). \(X\) et \(Y\) sont-elles indépendantes ?</div>
  <div class="q"><strong>Q2.</strong> Soit \(X\) et \(Y\) deux variables de Bernoulli. Montrer que si \(\operatorname{Cov}(X, Y) = 0\), alors \(X\) et \(Y\) sont indépendantes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(E(X) = 0\) (loi symétrique) et \(E(XY) = E(X^3) = \frac{-8 - 1 + 1 + 8}{4} = 0\), donc \(\operatorname{Cov}(X, Y) = 0\). Mais \(P(X = 1, Y = 4) = 0\), alors que \(P(X = 1)P(Y = 4) = \frac14 \times \frac12\) : pas indépendantes. \(Y\) est même entièrement déterminée par \(X\) ; la covariance ne détecte que les liaisons « affines ».</p>
    <p><strong>Q2.</strong> \(XY\) est une variable de Bernoulli, qui vaut 1 exactement sur \((X = 1, Y = 1)\) : \(E(XY) = P(X = 1, Y = 1)\). La covariance nulle s'écrit donc \(P(X = 1, Y = 1) = P(X = 1)P(Y = 1)\) : les événements \((X = 1)\) et \((Y = 1)\) sont indépendants. Par passage aux contraires (chapitre « Probabilités », §8), les quatre égalités \(P(X = x, Y = y) = P(X = x)P(Y = y)\) sont vraies, et \(X \perp\!\!\!\perp Y\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Tirages sans remise : une covariance négative</h3>
  <div class="statement">Une urne contient 3 boules rouges et 2 noires. On tire successivement 3 boules sans remise. Pour \(i = 1, 2, 3\), \(X_i\) vaut 1 si la \(i\)-ième boule est rouge, 0 sinon ; \(N = X_1 + X_2 + X_3\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que chaque \(X_i\) suit la loi \(\mathcal B\big(\frac35\big)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\operatorname{Cov}(X_i, X_j)\) pour \(i \neq j\). Les \(X_i\) sont-elles indépendantes ?</div>
  <div class="q"><strong>Q3.</strong> En déduire \(E(N)\) et \(V(N)\). Comparer avec des tirages avec remise.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(P(X_1 = 1) = \frac35\). Par symétrie (toutes les listes ordonnées de 3 boules distinctes sont équiprobables, et chaque boule a la même chance d'occuper la position \(i\)), \(P(X_i = 1) = \frac35\). Pour \(i = 2\), on peut aussi passer par les probabilités totales : \(\frac35 \times \frac24 + \frac25 \times \frac34 = \frac35\).</p>
    <p><strong>Q2.</strong> \(E(X_iX_j) = P(X_i = 1, X_j = 1)\), soit \(\frac35 \times \frac24 = \frac{3}{10}\) (même argument de symétrie que pour les deux premières positions). Donc \(\operatorname{Cov}(X_i, X_j) = \frac{3}{10} - \frac{9}{25}\), soit \(-\frac{3}{50} = -0{,}06\). Non nulle : les \(X_i\) ne sont pas indépendantes (une rouge tirée rend la suivante moins probable).</p>
    <p><strong>Q3.</strong> Linéarité : \(E(N) = 3 \times \frac35 = \frac95\). Variance d'une somme :</p>
    <div class="formula">$$V(N) = 3 \times \frac35 \times \frac25 + 2 \times 3 \times \Big(-\frac{3}{50}\Big) = \frac{18}{25} - \frac{9}{25} = \frac{9}{25} = 0{,}36.$$</div>
    <p>Avec remise, \(N \sim \mathcal B\big(3, \frac35\big)\) : même espérance, mais variance \(\frac{18}{25} = 0{,}72\), deux fois plus grande. Le tirage sans remise est moins dispersé : on ne peut pas tirer « trop » de rouges.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Lettres et enveloppes : nombre de points fixes</h3>
  <div class="statement">Une secrétaire distraite place au hasard \(n \geq 2\) lettres dans leurs \(n\) enveloppes (toutes les permutations sont équiprobables). \(N\) est le nombre de lettres placées dans la bonne enveloppe ; \(A_i\) : « la lettre \(i\) est bien placée ».</div>
  <div class="q"><strong>Q1.</strong> Calculer \(P(A_i)\), puis \(E(N)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(P(A_i \cap A_j)\) pour \(i \neq j\), puis \(V(N)\).</div>
  <div class="q"><strong>Q3.</strong> Majorer \(P(N \geq 3)\) par Markov puis par Bienaymé-Tchebychev. Pour \(n = 4\), la loi de \(N\) est \(P(N = 0) = \frac{9}{24}\), \(P(N = 1) = \frac{8}{24}\), \(P(N = 2) = \frac{6}{24}\), \(P(N = 4) = \frac{1}{24}\) : comparer.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les permutations qui placent bien la lettre \(i\) correspondent aux permutations des \(n - 1\) autres : \(P(A_i) = \frac{(n-1)!}{n!} = \frac1n\). Comme \(N = \sum_i \mathbf 1_{A_i}\), \(E(N) = n \times \frac1n = 1\), quel que soit \(n\).</p>
    <p><strong>Q2.</strong> \(P(A_i \cap A_j) = \frac{(n-2)!}{n!}\), soit \(\frac{1}{n(n-1)}\), donc \(\operatorname{Cov}(\mathbf 1_{A_i}, \mathbf 1_{A_j}) = \frac{1}{n(n-1)} - \frac{1}{n^2}\), soit \(\frac{1}{n^2(n-1)}\). Variance d'une somme, avec \(n(n-1)\) couples \((i, j)\), \(i \neq j\) :</p>
    <div class="formula">$$V(N) = n \times \frac1n\Big(1 - \frac1n\Big) + n(n-1) \times \frac{1}{n^2(n-1)} = 1 - \frac1n + \frac1n = 1.$$</div>
    <p><strong>Q3.</strong> Markov : \(P(N \geq 3) \leq \frac13\). Bienaymé-Tchebychev : \((N \geq 3) \subset (|N - 1| \geq 2)\), donc \(P(N \geq 3) \leq \frac{1}{4}\). Pour \(n = 4\), la valeur exacte est \(P(N = 4) = \frac{1}{24} \approx 0{,}042\) (avoir exactement 3 lettres bien placées est impossible : la 4ᵉ le serait aussi). Contrôle de la loi : \(E(N) = \frac{8 + 12 + 4}{24} = 1\), \(E(N^2) = \frac{8 + 24 + 16}{24} = 2\), \(V(N) = 1\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Bienaymé-Tchebychev et fréquence</h3>
  <div class="statement">Soit \(X_1, \dots, X_n\) des variables indépendantes de loi \(\mathcal B(p)\), et \(F_n = \frac1n(X_1 + \dots + X_n)\) la fréquence de succès.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(E(F_n)\) et \(V(F_n)\).</div>
  <div class="q"><strong>Q2.</strong> Majorer \(P(|F_n - p| \geq \varepsilon)\) pour \(\varepsilon \gt 0\), puis par une borne indépendante de \(p\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(p = 0{,}5\) et \(\varepsilon = 0{,}01\), trouver \(n\) assurant \(P(|F_n - p| \geq 0{,}01) \leq 0{,}01\). Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Linéarité : \(E(F_n) = p\). Indépendance : \(V(F_n) = \frac{1}{n^2} \times np(1-p)\), soit \(\frac{p(1-p)}{n}\).</p>
    <p><strong>Q2.</strong> Bienaymé-Tchebychev : \(P(|F_n - p| \geq \varepsilon) \leq \frac{p(1-p)}{n\varepsilon^2}\). Comme \(p(1-p) = \frac14 - \big(p - \frac12\big)^2 \leq \frac14\), on a aussi la borne \(\frac{1}{4n\varepsilon^2}\), utile quand \(p\) est inconnu.</p>
    <p><strong>Q3.</strong> Il suffit que \(\frac{0{,}25}{n \times 10^{-4}} \leq 0{,}01\), soit \(n \geq 250\,000\). Avec 250 000 lancers d'une pièce équilibrée, la fréquence de pile est entre 0,49 et 0,51 avec une probabilité d'au moins 99 % : c'est l'interprétation fréquentiste de la probabilité. Quand \(n \to +\infty\), la borne tend vers 0 (loi faible des grands nombres, énoncée en 2ᵉ année).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Coalitions avec quatre dés</h3>
  <div class="statement">On lance quatre dés équilibrés, de résultats \(X_1, X_2, X_3, X_4\) indépendants. On pose \(U = X_1 + X_2\) et \(W = \max(X_3, X_4)\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(U\) et \(W\) sont indépendantes. Calculer \(P(U = 7, W = 6)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(E(UW)\) et \(V(U + W)\) (on pourra utiliser l'exercice 2).</div>
  <div class="q"><strong>Q3.</strong> \(U\) et \(U' = X_2 + X_3\) sont-elles indépendantes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(U\) est une fonction de \((X_1, X_2)\), \(W\) une fonction de \((X_3, X_4)\), paquets disjoints de variables indépendantes : lemme des coalitions. Donc \(P(U = 7, W = 6) = P(U = 7)P(W = 6)\), soit \(\frac{6}{36} \times \frac{11}{36} = \frac{11}{216}\).</p>
    <p><strong>Q2.</strong> Indépendance : \(E(UW) = E(U)E(W)\), soit \(7 \times \frac{161}{36} = \frac{1\,127}{36} \approx 31{,}3\). Covariance nulle :</p>
    <div class="formula">$$V(U + W) = V(U) + V(W) = 2 \times \frac{35}{12} + \frac{2\,555}{1\,296} = \frac{10\,115}{1\,296} \approx 7{,}80.$$</div>
    <p><strong>Q3.</strong> Non : les deux sommes partagent \(X_2\). Par exemple \(P(U = 2, U' = 12) = 0\) (il faudrait \(X_2 = 1\) et \(X_2 = 6\)), alors que \(P(U = 2)P(U' = 12) = \frac{1}{36^2} \neq 0\). Par bilinéarité, \(\operatorname{Cov}(U, U') = \operatorname{Cov}(X_2, X_2)\), soit \(V(X_2) = \frac{35}{12}\), les autres covariances étant nulles par indépendance.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : marche aléatoire sur les entiers, loi binomiale, indicatrices, covariance et Bienaymé-Tchebychev).</div>
  <h3>Une marche aléatoire en temps fini</h3>
  <div class="statement">Un pion part de 0 sur une droite graduée. À chaque instant \(k = 1, 2, \dots, n\), il fait un pas \(X_k = +1\) avec la probabilité \(p\) ou \(X_k = -1\) avec la probabilité \(q = 1 - p\) (\(0 \lt p \lt 1\)) ; les variables \(X_1, \dots, X_n\) sont indépendantes. Sa position à l'instant \(k\) est \(S_k = X_1 + \dots + X_k\), avec \(S_0 = 0\).</div>
  <div class="exo-part"><strong>Partie A — Loi de la position</strong></div>
  <div class="q"><strong>A1.</strong> On pose \(Y_k = \frac{X_k + 1}{2}\). Quelle est la loi de \(Y_k\) ? En déduire la loi de \(B_n = Y_1 + \dots + Y_n\), puis exprimer \(S_n\) en fonction de \(B_n\).</div>
  <div class="q"><strong>A2.</strong> En déduire \(E(S_n)\) et \(V(S_n)\), puis \(P(S_n = n)\).</div>
  <div class="q"><strong>A3.</strong> Montrer que \(S_n\) a la parité de \(n\), et que \(P(S_{2m} = 0) = \binom{2m}{m}(pq)^m\). Application : \(p = \frac13\), \(m = 2\).</div>
  <div class="exo-part"><strong>Partie B — Nombre de retours à l'origine</strong></div>
  <div class="q"><strong>B1.</strong> On note \(R_m\) le nombre d'instants \(k \in \{1, \dots, 2m\}\) où le pion est en 0. Exprimer \(E(R_m)\) comme une somme.</div>
  <div class="q"><strong>B2.</strong> Calculer \(E(R_5)\) pour \(p = \frac12\).</div>
  <div class="exo-part"><strong>Partie C — Deux instants</strong></div>
  <div class="q"><strong>C1.</strong> Pour \(1 \leq m \lt n\), justifier que \(S_m\) et \(S_n - S_m\) sont indépendantes, puis montrer que \(\operatorname{Cov}(S_m, S_n) = 4mpq\).</div>
  <div class="exo-part"><strong>Partie D — Vitesse moyenne</strong></div>
  <div class="q"><strong>D1.</strong> Montrer que pour tout \(\varepsilon \gt 0\), \(P\Big(\Big|\dfrac{S_n}{n} - (p - q)\Big| \geq \varepsilon\Big) \leq \dfrac{4pq}{n\varepsilon^2}\). Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(Y_k\) vaut 1 si \(X_k = 1\) et 0 si \(X_k = -1\) : \(Y_k \sim \mathcal B(p)\). Les \(Y_k\) sont indépendantes (fonctions des \(X_k\) indépendantes), donc \(B_n \sim \mathcal B(n, p)\) : c'est le nombre de pas vers la droite. Comme \(X_k = 2Y_k - 1\), \(S_n = 2B_n - n\).</p>
    <p><strong>A2.</strong> \(E(S_n) = 2np - n = n(p - q)\) et \(V(S_n) = 4V(B_n) = 4npq\). \(P(S_n = n) = P(B_n = n) = p^n\) (tous les pas vers la droite).</p>
    <p><strong>A3.</strong> \(S_n = 2B_n - n\) a la parité de \(n\). \(S_{2m} = 0 \iff B_{2m} = m\), d'où \(P(S_{2m} = 0) = \binom{2m}{m}p^mq^m\). Pour \(p = \frac13\), \(m = 2\) : \(6 \times \frac19 \times \frac49 = \frac{24}{81}\), soit \(\frac{8}{27} \approx 0{,}30\).</p>
    <p><strong>B1.</strong> Aux instants impairs, le pion n'est jamais en 0 (A3). Donc \(R_m = \sum_{k=1}^m \mathbf 1_{(S_{2k} = 0)}\) et, par linéarité (sans indépendance : ces indicatrices sont dépendantes),</p>
    <div class="formula">$$E(R_m) = \sum_{k=1}^m P(S_{2k} = 0) = \sum_{k=1}^m \binom{2k}{k}(pq)^k.$$</div>
    <p><strong>B2.</strong> Pour \(p = \frac12\), \(pq = \frac14\) :</p>
    <div class="formula">$$E(R_5) = \frac12 + \frac38 + \frac{5}{16} + \frac{35}{128} + \frac{63}{256} = \frac{437}{256} \approx 1{,}71.$$</div>
    <p><strong>C1.</strong> \(S_m\) ne dépend que de \(X_1, \dots, X_m\), et \(S_n - S_m = X_{m+1} + \dots + X_n\) que des pas suivants : lemme des coalitions. Par bilinéarité de la covariance,</p>
    <div class="formula">$$\operatorname{Cov}(S_m, S_n) = \operatorname{Cov}(S_m, S_m) + \operatorname{Cov}(S_m, S_n - S_m) = V(S_m) + 0 = 4mpq.$$</div>
    <p>La position à l'instant \(n\) « se souvient » de celle à l'instant \(m\) : les deux sont positivement corrélées.</p>
    <p><strong>D1.</strong> \(E\big(\frac{S_n}{n}\big) = p - q\) et \(V\big(\frac{S_n}{n}\big) = \frac{4npq}{n^2}\), soit \(\frac{4pq}{n}\) ; Bienaymé-Tchebychev donne la majoration. Pour \(\varepsilon\) fixé, elle tend vers 0 : la vitesse moyenne \(\frac{S_n}{n}\) se rapproche de \(p - q\). Si \(p \gt \frac12\), le pion dérive vers la droite à la vitesse moyenne \(p - q\) ; si \(p = \frac12\), \(\frac{S_n}{n}\) se concentre autour de 0, bien que \(S_n\) lui-même ait un écart type \(\sqrt n\) qui grandit.</p>
  </div>
