<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Titrage indirect du carbonate de calcium d'une coquille d'œuf</h3>
  <div class="statement">On introduit \(m = 0{,}500\ \text{g}\) de coquille d'œuf broyée dans 50,0 mL d'acide chlorhydrique à 0,500 mol·L⁻¹ (en excès). Après la fin de l'effervescence, on chauffe doucement pour chasser le CO₂ dissous, on refroidit et on complète à 100,0 mL en fiole jaugée. On titre 20,0 mL de cette solution par la soude à 0,200 mol·L⁻¹ en présence de BBT : le virage a lieu pour \(V_E = 15{,}6\ \text{mL}\). Données : \(M(\mathrm{CaCO_3}) = 100{,}1\ \text{g·mol}^{-1}\) ; \(\text{p}K_a\) : CO₂,H₂O/HCO₃⁻ 6,4 ; HCO₃⁻/CO₃²⁻ 10,3 ; constante de CaCO₃(s) = Ca²⁺ + CO₃²⁻ : \(K_s = 10^{-8{,}5}\) (chapitre suivant). On admet que seul CaCO₃ réagit avec l'acide.</div>
  <div class="q"><strong>Q1.</strong> Écrire la réaction de CaCO₃ avec un excès d'ions H₃O⁺ et calculer sa constante par combinaison.</div>
  <div class="q"><strong>Q2.</strong> Pourquoi ne titre-t-on pas directement le carbonate de calcium ? Pourquoi parle-t-on de titrage indirect ?</div>
  <div class="q"><strong>Q3.</strong> Écrire la réaction de titrage et justifier le choix du BBT.</div>
  <div class="q"><strong>Q4.</strong> Calculer la quantité d'acide en excès, puis la masse et le pourcentage massique de CaCO₃ dans la coquille.</div>
  <div class="q"><strong>Q5.</strong> Si l'on avait oublié de chasser le CO₂ dissous, le pourcentage trouvé serait-il trop grand ou trop petit ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> CaCO₃(s) + 2 H₃O⁺ = Ca²⁺ + CO₂,H₂O + 2 H₂O. C'est la dissolution (\(K_s\)) suivie de deux captures de proton par CO₃²⁻ puis HCO₃⁻ (\(1/K_{a2}\) et \(1/K_{a1}\)) : \(K^\circ = \dfrac{K_s}{K_{a1}K_{a2}} = 10^{-8{,}5 + 10{,}3 + 6{,}4} = 10^{8{,}2}\). Réaction totale tant qu'il reste de l'acide.</p>
    <p><strong>Q2.</strong> CaCO₃ est un solide insoluble qui réagit lentement : on ne pourrait pas repérer une équivalence nette en versant un acide dessus. On le fait réagir avec un excès connu d'acide, puis on titre ce qui reste d'acide (titrage « en retour ») : on dose l'acide, et on en déduit le carbonate.</p>
    <p><strong>Q3.</strong> H₃O⁺ + HO⁻ → 2 H₂O (\(K^\circ = 10^{14}\)). Il s'agit d'un acide fort titré par une base forte (Ca²⁺ et Cl⁻ sont spectateurs) : pH 7 à l'équivalence, saut large, le BBT (6,0 – 7,6) convient.</p>
    <p><strong>Q4.</strong> Dans 20,0 mL : \(n = 0{,}200\times15{,}6\times10^{-3} = 3{,}12\times10^{-3}\ \text{mol}\) de H₃O⁺, donc \(1{,}56\times10^{-2}\ \text{mol}\) dans les 100,0 mL. Acide introduit : \(0{,}500\times0{,}0500 = 2{,}50\times10^{-2}\ \text{mol}\) ; consommé par le carbonate : \(9{,}4\times10^{-3}\ \text{mol}\), soit \(n(\mathrm{CaCO_3}) = 4{,}7\times10^{-3}\ \text{mol}\) (deux H₃O⁺ par CaCO₃). Masse : \(0{,}47\ \text{g}\), soit 94 % de la coquille.</p>
    <p><strong>Q5.</strong> Le CO₂ dissous (diacide faible) serait en partie titré par la soude avant le virage du BBT (à pH ≈ 7, CO₂,H₂O est déjà en grande partie transformé en HCO₃⁻) : \(V_E\) serait trop grand, l'excès d'acide surestimé, donc la quantité de CaCO₃ <strong>sous-estimée</strong>.</p>
  </div>
</div>

  <p class="exo-part">Partie A — Les espèces en présence</p>
  <div class="q"><strong>A1.</strong> Tracer le diagramme de prédominance de l'acide phosphorique. Quelle forme prédomine dans S (pH initial lu sur la courbe) ? Les autres sont-elles négligeables ?</div>
  <div class="q"><strong>A2.</strong> Écrire les trois réactions successives de la soude sur l'acide phosphorique et ses bases conjuguées, et calculer leurs constantes. Lesquelles peuvent servir de réactions de titrage ?</div>
  <p class="exo-part">Partie B — Exploitation du titrage</p>
  <div class="q"><strong>B1.</strong> Relever les volumes \(V_1\) et \(V_2\) des deux sauts. Quelle réaction a lieu de 0 à \(V_1\), puis de \(V_1\) à \(V_2\) ? Justifier que \(V_2 = 2V_1\).</div>
  <div class="q"><strong>B2.</strong> Pourquoi n'observe-t-on pas de troisième saut vers \(3V_1\) ?</div>
  <div class="q"><strong>B3.</strong> En déduire la concentration de S, celle du détartrant, sa concentration massique et son pourcentage massique en H₃PO₄.</div>
  <div class="q"><strong>B4.</strong> Pour un titrage de routine sans pH-mètre, quel indicateur choisir pour repérer chaque équivalence ? On donne : pH 4,69 à \(V_1\) (3,75 à \(V_1 - 0{,}3\) mL ; 5,64 à \(V_1 + 0{,}3\) mL) et pH 9,66 à \(V_2\) (8,76 à \(V_2 - 0{,}3\) mL ; 10,54 à \(V_2 + 0{,}3\) mL).</div>
  <p class="exo-part">Partie C — Réaction prépondérante et calcul numérique</p>
  <div class="q"><strong>C1.</strong> Retrouver le pH initial de S par la méthode de la réaction prépondérante. L'hypothèse « acide peu dissocié » est-elle valable ?</div>
  <div class="q"><strong>C2.</strong> À la demi-première équivalence (\(V = V_1/2\)), on pourrait s'attendre à pH = 2,1. La courbe donne 2,3. Expliquer cet écart.</div>
  <div class="q"><strong>C3.</strong> Écrire un programme Python qui calcule ce pH par dichotomie, après la réaction totale de la soude, et vérifier la valeur lue.</div>
  <p class="exo-part">Partie D — Action sur le tartre</p>
  <div class="q"><strong>D1.</strong> Le tartre est du carbonate de calcium. Montrer par combinaison de constantes que la réaction CaCO₃(s) + 2 H₃PO₄ = Ca²⁺ + 2 H₂PO₄⁻ + CO₂,H₂O a pour constante \(K^\circ = 10^{4{,}0}\).</div>
  <div class="q"><strong>D2.</strong> Quelle masse de tartre 100 mL de détartrant pur peuvent-ils dissoudre, en n'utilisant que la première acidité ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> H₃PO₄ pour pH &lt; 2,1 ; H₂PO₄⁻ entre 2,1 et 7,2 ; HPO₄²⁻ entre 7,2 et 12,4 ; PO₄³⁻ au-delà. Le pH initial lu est 1,75 : H₃PO₄ prédomine, mais à 0,35 unité seulement de la frontière, H₂PO₄⁻ n'est pas négligeable (\([\mathrm{H_2PO_4^-}]/[\mathrm{H_3PO_4}] = 10^{-0{,}35} = 0{,}45\), soit 31 % de H₂PO₄⁻). HPO₄²⁻ et PO₄³⁻ sont négligeables.</p>
    <p><strong>A2.</strong> H₃PO₄ + HO⁻ = H₂PO₄⁻ + H₂O, \(K_1 = 10^{14 - 2{,}1} = 10^{11{,}9}\) ; H₂PO₄⁻ + HO⁻ = HPO₄²⁻ + H₂O, \(K_2 = 10^{6{,}8}\) ; HPO₄²⁻ + HO⁻ = PO₄³⁻ + H₂O, \(K_3 = 10^{14 - 12{,}4} = 10^{1{,}6}\). Les deux premières sont quasi totales et utilisables ; la troisième ne l'est pas.</p>
    <p><strong>B1.</strong> On lit \(V_1 = 11{,}4\ \text{mL}\) et \(V_2 = 22{,}8\ \text{mL}\). De 0 à \(V_1\), la réaction prépondérante est la première (la plus grande constante, et H₃PO₄ est l'acide le plus fort) : titrage de H₃PO₄ en H₂PO₄⁻. De \(V_1\) à \(V_2\), H₂PO₄⁻ formé est titré en HPO₄²⁻. Chaque étape consomme autant de HO⁻ qu'il y avait de H₃PO₄ au départ : \(V_2 - V_1 = V_1\). C'est un titrage successif.</p>
    <p><strong>B2.</strong> \(K_3 = 10^{1{,}6}\) est trop faible : la réaction HPO₄²⁻ + HO⁻ n'est pas quasi totale, et le pH de la solution (vers 12) est imposé par la soude elle-même, voisin de \(\text{p}K_{a3}\). Il n'y a pas de saut.</p>
    <p><strong>B3.</strong> À la première équivalence : \(C V_0 = C_b V_1\), d'où \(C = 0{,}100\times11{,}4/20{,}0 = 0{,}0570\ \text{mol·L}^{-1}\). Détartrant : \(50\times0{,}0570 = 2{,}85\ \text{mol·L}^{-1}\), soit \(2{,}85\times98{,}0 = 279\ \text{g·L}^{-1}\). Un litre pèse 1 140 g : pourcentage massique \(279/1140 = 24{,}5\ \%\).</p>
    <p><strong>B4.</strong> Première équivalence : le vert de bromocrésol (3,8 – 5,4) est contenu dans le saut [3,75 ; 5,64] et contient 4,69 (il vire entre 11,1 et 11,6 mL). L'hélianthine virerait trop tôt, le rouge de méthyle déborde du saut. Seconde équivalence : la thymolphtaléine (9,3 – 10,5) est dans le saut [8,76 ; 10,54] et contient 9,66 (virage entre 22,7 et 23,1 mL) ; la phénolphtaléine commencerait à rosir dès pH 8,2, soit vers 21,8 mL, 4 % trop tôt.</p>
    <p><strong>C1.</strong> RP : H₃PO₄ + H₂O = H₂PO₄⁻ + H₃O⁺, \(K^\circ = 10^{-2{,}1}\). L'hypothèse \(x \ll C\) donnerait \(x = \sqrt{10^{-2{,}1}\times0{,}0570} = 2{,}1\times10^{-2}\), du même ordre que \(C\) : elle est fausse. On résout \(x^2 + K_a x - K_a C = 0\) : \(x = 1{,}77\times10^{-2}\ \text{mol·L}^{-1}\), pH = 1,75 (31 % de l'acide est dissocié), comme sur la courbe.</p>
    <p><strong>C2.</strong> « pH = \(\text{p}K_a\) à la demi-équivalence » suppose qu'après la réaction de la soude, \([\mathrm{H_3PO_4}] = [\mathrm{H_2PO_4^-}]\) exactement. Mais H₃PO₄ est assez fort pour réagir encore notablement sur l'eau : il se dissocie davantage, ce qui augmente \([\mathrm{H_2PO_4^-}]\) et diminue \([\mathrm{H_3PO_4}]\). Le rapport \([\mathrm{H_2PO_4^-}]/[\mathrm{H_3PO_4}]\) dépasse 1, et le pH est supérieur à \(\text{p}K_{a1}\).</p>
    <p><strong>C3.</strong> Pour \(V = 5{,}70\ \text{mL}\), la soude a réagi totalement : \(c_1 = [\mathrm{H_3PO_4}]\) et \(c_2 = [\mathrm{H_2PO_4^-}]\) valent tous deux \(0{,}0222\ \text{mol·L}^{-1}\) (dans 25,7 mL). Puis l'équilibre H₃PO₄ + H₂O = H₂PO₄⁻ + H₃O⁺ avance de \(x\) : \(\dfrac{x\,(c_2 + x)}{c_1 - x} = K_{a1}\).</p>
    <pre class="codeblock"><span class="kw">import</span> math

Ka1 = 10**-2.1
V0, C, Cb, V = 20.0e-3, 0.0570, 0.100, 5.70e-3      <span class="cmt"># L, mol/L</span>
c1 = (C * V0 - Cb * V) / (V0 + V)    <span class="cmt"># H3PO4 restant après la RP totale</span>
c2 = Cb * V / (V0 + V)               <span class="cmt"># H2PO4- formé</span>

<span class="kw">def</span> f(x):                           <span class="cmt"># ln Qr - ln K, croissante sur ]0, c1[</span>
    <span class="kw">return</span> math.log(x * (c2 + x) / (c1 - x)) - math.log(Ka1)

a, b = 1e-12, c1 - 1e-12
<span class="kw">while</span> b - a > 1e-12:
    m = (a + b) / 2
    <span class="kw">if</span> f(m) > 0:
        b = m
    <span class="kw">else</span>:
        a = m
print(c1, (a + b) / 2, -math.log10((a + b) / 2))   <span class="cmt"># 0.0222  0.00501  2.30</span></pre>
    <p>Le programme donne \(x = 5{,}0\times10^{-3}\ \text{mol·L}^{-1}\), soit pH = 2,30, la valeur lue sur la courbe. On vérifie : \([\mathrm{H_2PO_4^-}]/[\mathrm{H_3PO_4}] = 0{,}0272/0{,}0172 = 1{,}58\) et \(2{,}1 + \log 1{,}58 = 2{,}30\).</p>
    <p><strong>D1.</strong> L'équation est la somme de : CaCO₃(s) = Ca²⁺ + CO₃²⁻ (\(K_s\)) ; CO₃²⁻ + H₃O⁺ = HCO₃⁻ + H₂O (\(1/K_{a2}'\), \(K_{a2}' = 10^{-10{,}3}\)) ; HCO₃⁻ + H₃O⁺ = CO₂,H₂O + H₂O (\(1/K_{a1}'\), \(K_{a1}' = 10^{-6{,}4}\)) ; et 2 × (H₃PO₄ + H₂O = H₂PO₄⁻ + H₃O⁺) (\(K_{a1}^2\), \(K_{a1} = 10^{-2{,}1}\)). Les H₃O⁺ et H₂O se simplifient. Donc \(\log K^\circ = -8{,}5 + 10{,}3 + 6{,}4 - 2\times2{,}1 = 4{,}0\) : réaction très favorable, d'autant plus que le CO₂ se dégage.</p>
    <p><strong>D2.</strong> 100 mL de détartrant contiennent \(0{,}100\times2{,}85 = 0{,}285\ \text{mol}\) de H₃PO₄, qui dissolvent \(0{,}285/2 = 0{,}143\ \text{mol}\) de CaCO₃, soit \(0{,}143\times100{,}1 \approx 14\ \text{g}\) de tartre.</p>
