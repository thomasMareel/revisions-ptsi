<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les réactions acido-basiques de la partie 4.4.1 du programme de PTSI (« Réactions acide-base et de précipitation »), les titrages de la partie expérimentale (« Analyses qualitatives et quantitatives ») et réinvestit la partie 4.1.1 (avancement, quotient réactionnel, état final) vue dans <a href="#equilchim/cours">« Équilibres chimiques »</a>. Il prépare <a href="#precipitation/cours">« Réactions de dissolution et de précipitation »</a>, <a href="#oxred/cours">« Oxydoréduction »</a> et <a href="#eph/cours">« Diagrammes E-pH »</a>. Le programme insiste : on raisonne sur des <strong>diagrammes</strong> et sur une <strong>réaction unique</strong> bien choisie, et <strong>aucune formule de calcul de pH n'est exigible</strong>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Caractère acido-basique d'une réaction</strong> : l'identifier en solution aqueuse (§1).</li>
        <li><strong>Constante d'acidité</strong> : autoprotolyse de l'eau, pH, \(K_a\) et \(\text{p}K_a\) (§2, §3).</li>
        <li><strong>Acides et bases usuels</strong> : nom, formule et nature (faible ou forte) des acides sulfurique, nitrique, chlorhydrique, phosphorique, acétique, de la soude, de l'ion hydrogénocarbonate et de l'ammoniac (§3).</li>
        <li><strong>Diagrammes de prédominance et de distribution</strong> : les tracer et les lire (§4).</li>
        <li><strong>Constante d'équilibre</strong> d'une équation de réaction, combinaison linéaire d'équations dont les constantes sont connues (§5).</li>
        <li><strong>Utiliser les diagrammes de prédominance</strong> pour prévoir les espèces incompatibles ou la nature des espèces majoritaires ; <strong>écrire l'équation de la réaction</strong> qui modélise une transformation, en tenant compte du milieu (pH, espèces présentes) et des observations expérimentales (§6).</li>
        <li><strong>Composition du système dans l'état final</strong>, en distinguant équilibre chimique et transformation totale, pour une transformation modélisée par une réaction unique (§7).</li>
        <li><strong>Capacité numérique</strong> : déterminer, à l'aide d'un langage de programmation, l'état final d'un système à partir des conditions initiales et de la constante d'équilibre (§8).</li>
        <li><strong>Titrages</strong> (capacités expérimentales) : titrages directs et indirects, simples, successifs ou simultanés ; équivalence ; réaction support ; suivi par pH-métrie, conductimétrie ou indicateur coloré ; exploiter une courbe de titrage ; confronter une courbe simulée à la courbe expérimentale ; choisir un indicateur et distinguer équivalence et virage (§9, §10).</li>
        <li><strong>Analyse quantitative</strong> : mettre en œuvre une réaction acide-base pour doser une espèce (§9, §10) ; solutions tampons, utiles en TP pour étalonner le pH-mètre (§11).</li>
      </ul>
      <p>Hors programme : toute formule de calcul de pH (« aucune formule de calcul de pH n'est exigible ») ; elles sont regroupées en fin de chapitre et se retrouvent toutes par la méthode de la réaction prépondérante (§7). Sont aussi hors programme la constante de basicité \(K_b\), le pouvoir tampon chiffré et les coefficients d'activité.</p>
    </div>

<div class="course-section">
  <div class="sec-num">§1 · ACIDES, BASES ET COUPLES</div>
  <h2>Une réaction acido-basique est un échange de proton</h2>
  <div class="intro">Vinaigre, détartrant, soude, eau de Javel, sang, eau de mer : leur comportement chimique se comprend dès qu'on repère qui cède un proton et qui le capte. Cette section fixe le vocabulaire de Brønsted et apprend à reconnaître une réaction acido-basique parmi les autres types de réactions en solution aqueuse.</div>
  <div class="def-box">
    <strong>Acide, base, couple (Brønsted).</strong> Un <strong>acide</strong> est une espèce capable de céder un proton H⁺ ; une <strong>base</strong> est une espèce capable d'en capter un. L'acide AH et la base A⁻ qui diffèrent d'un proton forment un <strong>couple acide-base</strong>, noté AH/A⁻ et décrit par la demi-équation formelle
    <div class="formula">$$\mathrm{AH} = \mathrm{A^-} + \mathrm{H^+}$$</div>
    Le proton ne reste jamais libre en solution : une <strong>réaction acido-basique</strong> est un <strong>transfert de proton</strong> de l'acide d'un couple à la base d'un autre couple,
    <div class="formula" data-nom="Réaction acido-basique">$$\mathrm{A_1H} + \mathrm{A_2^-} = \mathrm{A_1^-} + \mathrm{A_2H}$$</div>
  </div>
  <p>La charge n'importe pas : NH₄⁺/NH₃, CH₃COOH/CH₃COO⁻ et HCO₃⁻/CO₃²⁻ sont des couples au même titre. Une espèce qui est l'acide d'un couple et la base d'un autre est un <strong>ampholyte</strong> (ou espèce amphotère) : l'eau (couples H₃O⁺/H₂O et H₂O/HO⁻), l'ion hydrogénocarbonate HCO₃⁻ (couples CO₂,H₂O/HCO₃⁻ et HCO₃⁻/CO₃²⁻), les ions H₂PO₄⁻ et HPO₄²⁻. Un acide qui peut céder plusieurs protons est un <strong>polyacide</strong> : l'acide phosphorique H₃PO₄ est un triacide, le « dioxyde de carbone dissous » CO₂,H₂O un diacide.</p>
  <div class="prop-box">
    <strong>Reconnaître le type d'une réaction.</strong> Dans une réaction <strong>acido-basique</strong>, un H⁺ passe d'une espèce à une autre et aucun nombre d'oxydation ne change. Dans une réaction d'<strong>oxydoréduction</strong>, ce sont des électrons qui sont échangés (des nombres d'oxydation changent). Dans une réaction de <strong>précipitation</strong>, des ions s'assemblent en un solide (chapitre suivant).
  </div>
  <div class="method-box"><strong>Exemple — classer des réactions et compter les protons</strong>
    <p>(a) NH₄⁺ + HO⁻ = NH₃ + H₂O ; (b) Fe + 2 H₃O⁺ = Fe²⁺ + H₂ + 2 H₂O ; (c) Ag⁺ + Cl⁻ = AgCl(s) ; (d) HCO₃⁻ + H₃O⁺ = CO₂,H₂O + H₂O. Quelle quantité d'ions HO⁻ faut-il pour transformer 0,10 mol de H₃PO₄ en ions PO₄³⁻ ?</p>
    <ol>
      <li>(a) : NH₄⁺ cède un proton à HO⁻, couples NH₄⁺/NH₃ et H₂O/HO⁻ : acido-basique. (d) : HCO₃⁻ capte un proton de H₃O⁺, il joue ici le rôle de base : acido-basique.</li>
      <li>(b) : le fer passe de 0 à +II et l'hydrogène de +I à 0 : oxydoréduction (même si H₃O⁺ intervient). (c) : formation d'un solide ionique, sans échange de proton ni d'électron : précipitation.</li>
      <li>H₃PO₄ est un triacide : il cède trois protons, donc il faut \(3\times0{,}10 = 0{,}30\ \text{mol}\) de HO⁻ (H₃PO₄ → H₂PO₄⁻ → HPO₄²⁻ → PO₄³⁻).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une réaction qui fait intervenir H₃O⁺ est forcément acido-basique (contre-exemple (b), attaque d'un métal par un acide). Seul le critère « transfert de proton, nombres d'oxydation inchangés » tranche.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · L'EAU ET LE pH</div>
  <h2>Autoprotolyse de l'eau et échelle de pH</h2>
  <div class="intro">L'eau est à la fois acide et base : elle réagit très peu sur elle-même, et c'est cette petite réaction qui fixe le lien entre H₃O⁺ et HO⁻ dans toute solution aqueuse. Le pH, mesuré au pH-mètre, repère la concentration en ions oxonium sur une échelle logarithmique.</div>
  <div class="def-box">
    <strong>Autoprotolyse de l'eau.</strong> L'équation 2 H₂O = H₃O⁺ + HO⁻ a pour constante d'équilibre le <strong>produit ionique de l'eau</strong>
    <div class="formula" data-nom="Produit ionique de l'eau">$$K_e = \frac{[\mathrm{H_3O^+}]\,[\mathrm{HO^-}]}{(c^\circ)^2}, \qquad \text{p}K_e = -\log K_e = 14{,}0\ \text{à}\ 25\ °\text{C}$$</div>
    avec \(c^\circ = 1\ \text{mol·L}^{-1}\) (l'eau solvant a une activité égale à 1). Cette relation est vérifiée dans <strong>toute</strong> solution aqueuse à l'équilibre.
  </div>
  <div class="def-box">
    <strong>pH.</strong> Pour une solution diluée, \(\text{pH} = -\log\dfrac{[\mathrm{H_3O^+}]}{c^\circ}\), soit \([\mathrm{H_3O^+}] = c^\circ\,10^{-\text{pH}}\). On note souvent \(h = [\mathrm{H_3O^+}]/c^\circ = 10^{-\text{pH}}\). Une solution est <strong>neutre</strong> si \([\mathrm{H_3O^+}] = [\mathrm{HO^-}]\), c'est-à-dire si \(\text{pH} = \tfrac12\text{p}K_e\) ; acide si \(\text{pH} \lt \tfrac12\text{p}K_e\), basique au-dessus.
  </div>
  <p>Comme \(K_e\) dépend de la température, le pH neutre aussi : 7,0 n'est la neutralité qu'à 25 °C.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">θ (°C)</th><td>0</td><td>25</td><td>37</td><td>50</td><td>100</td></tr>
    <tr><th style="text-align:left">\(\text{p}K_e\)</th><td>14,9</td><td>14,0</td><td>13,6</td><td>13,3</td><td>12,3</td></tr>
    <tr><th style="text-align:left">pH neutre</th><td>7,5</td><td>7,0</td><td>6,8</td><td>6,6</td><td>6,1</td></tr>
  </table></div>
  <p><strong>Ordres de grandeur</strong> (25 °C) : suc gastrique 1 à 2 ; soda au cola 2,5 ; vinaigre 2,9 ; eau de pluie (CO₂ dissous) 5,6 ; sang 7,4 ; eau de mer 8,1 ; solution d'ammoniac ménager 11 ; eau de Javel 11 à 12 ; soude à 1 mol·L⁻¹ 14. Le pH-mètre mesure ordinairement à ±0,05 unité près : une valeur de pH ne mérite guère plus d'une décimale.</p>
  <div class="method-box"><strong>Exemple — concentrations dans le sang</strong>
    <p>Le sang a un pH de 7,4. Calculer \([\mathrm{H_3O^+}]\) et \([\mathrm{HO^-}]\) en prenant \(\text{p}K_e = 14{,}0\), puis dire si le sang est acide ou basique à 37 °C, où \(\text{p}K_e = 13{,}6\).</p>
    <ol>
      <li>\([\mathrm{H_3O^+}] = 10^{-7{,}4} = 4{,}0\times10^{-8}\ \text{mol·L}^{-1}\) et \([\mathrm{HO^-}] = K_e\,(c^\circ)^2/[\mathrm{H_3O^+}] = 10^{-6{,}6} = 2{,}5\times10^{-7}\ \text{mol·L}^{-1}\).</li>
      <li>À 37 °C, le pH neutre vaut \(13{,}6/2 = 6{,}8\) : à pH 7,4, le sang est (légèrement) basique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : diluer indéfiniment un acide ne rend pas la solution basique. Une solution d'acide chlorhydrique à \(10^{-8}\ \text{mol·L}^{-1}\) n'a pas un pH de 8 mais de 6,98 : les ions H₃O⁺ apportés par l'autoprotolyse de l'eau (\(10^{-7}\ \text{mol·L}^{-1}\)) ne sont plus négligeables devant ceux de l'acide.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CONSTANTE D'ACIDITÉ</div>
  <h2>Force des acides et des bases dans l'eau</h2>
  <div class="intro">Tous les acides ne cèdent pas leur proton à l'eau avec la même facilité. La constante d'acidité mesure cette aptitude et permet de classer les couples sur une seule échelle, celle des \(\text{p}K_a\), valable pour toutes les réactions entre eux (§5).</div>
  <div class="def-box">
    <strong>Constante d'acidité.</strong> La constante d'acidité \(K_a\) du couple AH/A⁻ est la constante d'équilibre de la réaction de l'acide sur l'eau, AH + H₂O = A⁻ + H₃O⁺ :
    <div class="formula" data-nom="Constante d'acidité">$$K_a = \frac{[\mathrm{A^-}]\,[\mathrm{H_3O^+}]}{[\mathrm{AH}]\;c^\circ}, \qquad \text{p}K_a = -\log K_a$$</div>
    Comme toute constante d'équilibre, \(K_a\) est sans dimension et ne dépend que de la température. Les deux couples de l'eau ont \(\text{p}K_a(\mathrm{H_3O^+/H_2O}) = 0\) et \(\text{p}K_a(\mathrm{H_2O/HO^-}) = \text{p}K_e = 14\).
  </div>
  <div class="prop-box">
    <strong>Force.</strong> Plus \(K_a\) est grand (\(\text{p}K_a\) petit), plus l'acide est fort et plus sa base conjuguée est faible. Un <strong>acide fort</strong> réagit totalement sur l'eau (HCl + H₂O → H₃O⁺ + Cl⁻) : en solution, il n'existe que sous forme de H₃O⁺, l'acide le plus fort qui puisse exister dans l'eau (effet nivelant du solvant). De même, une <strong>base forte</strong> est entièrement transformée en HO⁻. Un acide (ou une base) <strong>faible</strong> ne réagit que partiellement avec l'eau : son couple a un \(\text{p}K_a\) compris entre 0 et 14.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">Espèce (programme)</th><th style="text-align:left">Formule</th><th style="text-align:left">Nature dans l'eau</th><th style="text-align:left">\(\text{p}K_a\) (25 °C)</th></tr>
    <tr><td>Acide chlorhydrique</td><td>HCl (H₃O⁺ + Cl⁻)</td><td>acide fort</td><td>—</td></tr>
    <tr><td>Acide nitrique</td><td>HNO₃</td><td>acide fort</td><td>—</td></tr>
    <tr><td>Acide sulfurique</td><td>H₂SO₄</td><td>diacide : 1ʳᵉ acidité forte, HSO₄⁻ faible</td><td>2,0 (HSO₄⁻/SO₄²⁻)</td></tr>
    <tr><td>Acide phosphorique</td><td>H₃PO₄</td><td>triacide faible</td><td>2,1 ; 7,2 ; 12,4</td></tr>
    <tr><td>Acide acétique (éthanoïque)</td><td>CH₃COOH</td><td>acide faible</td><td>4,8</td></tr>
    <tr><td>Ion hydrogénocarbonate</td><td>HCO₃⁻</td><td>ampholyte faible</td><td>6,4 (CO₂,H₂O/HCO₃⁻) ; 10,3 (HCO₃⁻/CO₃²⁻)</td></tr>
    <tr><td>Ammoniac</td><td>NH₃</td><td>base faible</td><td>9,2 (NH₄⁺/NH₃)</td></tr>
    <tr><td>Soude (hydroxyde de sodium)</td><td>NaOH (Na⁺ + HO⁻)</td><td>base forte</td><td>—</td></tr>
  </table></div>
  <p>Ces valeurs (à une ou deux décimales près selon les tables) servent dans tout le chapitre ; on y ajoutera HF/F⁻ (3,2), HCOOH/HCOO⁻ (3,8) et HClO/ClO⁻ (7,5). On ne définit pas de « constante de basicité » : la force d'une base se lit sur le \(\text{p}K_a\) de son couple.</p>
  <div class="method-box"><strong>Exemple — un acide faible se dissocie davantage quand on le dilue</strong>
    <p>Proportion d'acide acétique transformée en ions acétate dans des solutions à 0,10 ; 10⁻² ; 10⁻³ mol·L⁻¹ (calcul exact de l'état d'équilibre, mené au §7).</p>
    <ol>
      <li>À 0,10 mol·L⁻¹ : pH 2,90 et seulement 1,3 % de CH₃COO⁻ ; l'acide est très majoritairement sous forme CH₃COOH.</li>
      <li>À 10⁻² mol·L⁻¹ : pH 3,41 et 3,9 % ; à 10⁻³ mol·L⁻¹ : pH 3,93 et 12 %.</li>
      <li>Conclusion : un acide faible n'est pas « un acide qui ne réagit pas » ; sa réaction sur l'eau est un équilibre, d'autant plus avancé que la solution est diluée. Un acide fort, lui, est transformé à 100 % quelle que soit la concentration.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre <em>force</em> et <em>concentration</em>. Une solution d'acide acétique à 1 mol·L⁻¹ (pH 2,4) est plus acide qu'une solution d'acide chlorhydrique à 10⁻⁴ mol·L⁻¹ (pH 4,0), bien que l'acide acétique soit un acide faible.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PRÉDOMINANCE ET DISTRIBUTION</div>
  <h2>Quelle forme d'un couple domine à un pH donné ?</h2>
  <div class="intro">Le pH d'une solution impose le rapport des deux formes de chaque couple. Les diagrammes de prédominance le résument d'un coup d'œil ; les diagrammes de distribution donnent les proportions exactes. Ce sont les outils principaux du chapitre : le programme demande de s'en servir plutôt que de calculer.</div>
  <div class="prop-box">
    <strong>Relation de Henderson.</strong> En prenant le logarithme de \(K_a\) :
    <div class="formula" data-nom="pH et pKa">$$\text{pH} = \text{p}K_a + \log\frac{[\mathrm{A^-}]}{[\mathrm{AH}]}$$</div>
    Si \(\text{pH} \lt \text{p}K_a\), l'acide AH <strong>prédomine</strong> (\([\mathrm{AH}] \gt [\mathrm{A^-}]\)) ; si \(\text{pH} \gt \text{p}K_a\), la base A⁻ prédomine ; à \(\text{pH} = \text{p}K_a\), les deux formes sont à égalité.
  </div>
  <p>Une unité de pH au-delà de la frontière, la forme prédominante est dix fois plus concentrée que l'autre (91 % du total) ; deux unités au-delà, cent fois (99 %) : on dit alors que l'autre forme est <strong>négligeable</strong>. Pour un polyacide, on juxtapose les domaines : chaque forme prédomine entre deux \(\text{p}K_a\) successifs.</p>

    <p>Quelles formes du phosphate sont présentes dans le sang (pH 7,4) et dans quelles proportions ?</p>

      <li>Prédominance : 7,2 &lt; 7,4 &lt; 12,4, donc HPO₄²⁻ prédomine ; mais 7,4 est à moins d'une unité de 7,2 : H₂PO₄⁻ n'est pas négligeable.</li>

<div class="course-section">
  <div class="sec-num">§5 · CONSTANTE D'UNE RÉACTION ACIDO-BASIQUE</div>
  <h2>Combiner des équations, combiner des constantes</h2>
  <div class="intro">Toute réaction entre l'acide d'un couple et la base d'un autre a une constante d'équilibre qui se déduit des deux \(K_a\), sans aucune donnée nouvelle. La règle générale de combinaison des constantes sert dans tout le programme de chimie (précipitation, oxydoréduction).</div>
  <div class="prop-box">
    <strong>Combinaison linéaire.</strong> Si l'équation (R) est la combinaison \(\text{(R)} = \sum_i \lambda_i\,\text{(R}_i\text{)}\) d'équations de constantes \(K^\circ_i\), alors
    <div class="formula" data-nom="Combinaison de constantes">$$K^\circ = \prod_i \left(K^\circ_i\right)^{\lambda_i}$$</div>
    Additionner deux équations multiplie les constantes ; inverser le sens d'une équation inverse sa constante ; multiplier les coefficients par \(\lambda\) élève la constante à la puissance \(\lambda\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi les constantes se multiplient</span>
    <div class="content"><p>Pour une équation de coefficients stœchiométriques algébriques \(\nu_j\) (positifs pour les produits), \(\ln K^\circ = \sum_j \nu_j \ln a_{j,\text{éq}}\) : c'est une fonction <strong>linéaire</strong> des coefficients. Les activités à l'équilibre étant les mêmes pour toutes les réactions qui ont lieu dans la même solution, la combinaison \(\sum_i\lambda_i\,\text{(R}_i\text{)}\) a pour logarithme de constante \(\sum_i\lambda_i \ln K^\circ_i\). En passant à l'exponentielle, on obtient le produit.</p></div>
  </div>
  <div class="prop-box">
    <strong>Réaction entre deux couples.</strong> Pour A₁H + A₂⁻ = A₁⁻ + A₂H, qui est (A₁H + H₂O = A₁⁻ + H₃O⁺) moins (A₂H + H₂O = A₂⁻ + H₃O⁺) :
    <div class="formula" data-nom="K° d'une réaction acide-base">$$K^\circ = \frac{K_{a1}}{K_{a2}} = 10^{\,\text{p}K_{a2} - \text{p}K_{a1}}$$</div>
    La réaction est favorable (\(K^\circ \gt 1\)) quand l'acide qui réagit est plus fort que l'acide formé, c'est-à-dire quand la base qui réagit a le \(\text{p}K_a\) le plus grand. Cas particuliers : un acide AH sur HO⁻ a pour constante \(K_a/K_e\) ; une base A⁻ sur H₃O⁺, \(1/K_a\).
  </div>

    <p>Calculer \(K^\circ\) pour (a) CH₃COOH + NH₃ = CH₃COO⁻ + NH₄⁺ ; (b) HCO₃⁻ + HO⁻ = CO₃²⁻ + H₂O ; (c) 2 HCO₃⁻ = CO₂,H₂O + CO₃²⁻.</p>

      <li>(c) HCO₃⁻ joue l'acide du couple de \(\text{p}K_a\) 10,3 et la base du couple de \(\text{p}K_a\) 6,4 : \(K^\circ = 10^{6{,}4 - 10{,}3} = 10^{-3{,}9} \approx 1{,}3\times10^{-4}\). L'ion hydrogénocarbonate ne se « dismute » donc presque pas : il est stable en solution.</li>

</div>

<div class="course-section">
  <div class="sec-num">§6 · PRÉVOIR ET ÉCRIRE LA RÉACTION</div>
  <h2>Espèces incompatibles et choix de l'équation</h2>
  <div class="intro">Avant tout calcul, il faut savoir quelles espèces vont réagir et écrire la bonne équation. Les diagrammes de prédominance répondent directement ; le milieu (son pH) et les observations (gaz, odeur, couleur) confirment le choix.</div>
  <div class="prop-box">
    <strong>Espèces compatibles ou incompatibles.</strong> Deux espèces dont les domaines de prédominance ont une partie commune peuvent coexister en quantités notables : elles sont <strong>compatibles</strong>. Si leurs domaines sont <strong>disjoints</strong> (un acide de \(\text{p}K_a\) plus petit que celui du couple d'une base), elles sont <strong>incompatibles</strong> : elles réagissent, avec \(K^\circ \gt 1\), jusqu'à épuisement de l'une d'elles si \(K^\circ\) est grand.
  </div>
  <div class="prop-box">
    <strong>Écrire l'équation en tenant compte du milieu.</strong> Dans un milieu de pH connu (solution tamponnée, milieu très acide ou très basique), chaque couple est écrit sous sa forme <strong>prédominante à ce pH</strong>. Une espèce ajoutée réagit avec celle-ci, et l'équation fait apparaître les formes réellement présentes.
  </div>
  <div class="method-box"><strong>Exemple — soude versée dans une solution de phosphate à pH 4,7</strong>
    <p>On verse peu à peu de la soude dans une solution de dihydrogénophosphate de pH 4,7. Quelle équation modélise la transformation ?</p>
    <ol>
      <li>À pH 4,7, entre 2,1 et 7,2, la forme prédominante est H₂PO₄⁻ (99,4 % d'après la distribution).</li>
      <li>La base HO⁻ réagit donc sur H₂PO₄⁻ et non sur H₃PO₄ : H₂PO₄⁻ + HO⁻ = HPO₄²⁻ + H₂O, avec \(K^\circ = 10^{14 - 7{,}2} = 10^{6{,}8}\) : réaction quasi totale.</li>
      <li>Écrire « H₃PO₄ + HO⁻ » serait faux : H₃PO₄ ne représente que 0,25 % du phosphore à ce pH.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — bicarbonate de soude et vinaigre</strong>
    <p>On verse 50 mL de vinaigre (acide acétique à 1,0 mol·L⁻¹) sur 2,0 g d'hydrogénocarbonate de sodium (\(M = 84\ \text{g·mol}^{-1}\)). Une vive effervescence se produit. Écrire la réaction et estimer le volume de gaz dégagé à 25 °C sous 1 bar (\(V_m = 24{,}8\ \text{L·mol}^{-1}\)).</p>
    <ol>
      <li>Espèces : CH₃COOH (acide, \(\text{p}K_a = 4{,}8\)) et HCO₃⁻ (base du couple CO₂,H₂O/HCO₃⁻, \(\text{p}K_a = 6{,}4\)) ; domaines disjoints, elles réagissent : CH₃COOH + HCO₃⁻ = CH₃COO⁻ + CO₂,H₂O, de constante \(K^\circ = 10^{6{,}4 - 4{,}8} = 10^{1{,}6} \approx 40\).</li>
      <li>\(K^\circ\) n'est pas très grand, mais le CO₂ formé quitte la solution (effervescence observée) : son activité reste faible, le quotient réactionnel reste inférieur à \(K^\circ\) et la réaction se poursuit jusqu'à épuisement du réactif limitant.</li>
      <li>\(n(\mathrm{HCO_3^-}) = 2{,}0/84 = 2{,}4\times10^{-2}\ \text{mol}\) et \(n(\mathrm{CH_3COOH}) = 5{,}0\times10^{-2}\ \text{mol}\) : l'hydrogénocarbonate est limitant ; au plus \(2{,}4\times10^{-2}\times24{,}8 \approx 0{,}59\ \text{L}\) de CO₂ (un peu moins en réalité, une partie restant dissoute).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : juger une réaction seulement sur sa constante. Un produit qui quitte le milieu (gaz, solide) déplace la transformation ; à l'inverse, une réaction de grande constante peut ne pas se faire si l'un des réactifs est en quantité infime. C'est l'état final complet (§7) qui renseigne.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉTAT FINAL : LA RÉACTION PRÉPONDÉRANTE</div>
  <h2>Ramener une solution compliquée à une seule réaction</h2>
  <div class="intro">Une solution contient souvent plusieurs couples, et en principe toutes les réactions entre eux ont lieu. La méthode de la réaction prépondérante, recommandée par le programme, montre qu'une seule réaction fixe l'essentiel de l'état final ; on la traite par l'avancement, comme dans <a href="#equilchim/cours">« Équilibres chimiques »</a>, puis on vérifie que les autres sont négligeables. Elle remplace toutes les formules de pH.</div>
  <div class="method-box"><strong>Méthode — réaction prépondérante (RP)</strong>
    <ol>
      <li><span class="step">Inventaire.</span> Lister les espèces introduites (avec l'eau) et leurs quantités ; placer leurs couples sur l'échelle des \(\text{p}K_a\).</li>
      <li><span class="step">Réaction prépondérante.</span> C'est la réaction entre l'acide le plus fort et la base la plus forte présents, celle de plus grande constante \(K^\circ\).</li>
      <li><span class="step">Si \(K^\circ\) est grand</span> (en pratique \(K^\circ \ge 10^{3}\) à \(10^{4}\)), la supposer totale : faire le bilan, obtenir une solution « équivalente », puis recommencer à l'étape 2.</li>
      <li><span class="step">Si \(K^\circ\) n'est pas grand</span>, c'est la <strong>réaction prépondérante d'équilibre</strong> : écrire \(Q_r(\xi) = K^\circ\) et résoudre, en faisant si possible une hypothèse simplificatrice (\(\xi\) très petit ou très proche de sa valeur maximale).</li>
      <li><span class="step">Vérifier</span> les hypothèses et la cohérence du pH obtenu avec les diagrammes de prédominance ; contrôler que les autres réactions (dont l'autoprotolyse de l'eau) modifient peu le résultat.</li>
    </ol>
  </div>
  <p>Le seuil « \(K^\circ \ge 10^4\) ⇒ totale » n'est qu'une règle d'usage : pour deux réactifs introduits en mêmes quantités dans une réaction A + B = C + D, \(K^\circ = 10^4\) donne un avancement final de 99 % de sa valeur maximale, \(K^\circ = 10^3\) seulement 97 %. On vérifie donc toujours a posteriori.</p>
  <div class="method-box"><strong>Exemple — acide acétique à 0,10 mol·L⁻¹</strong>
    <ol>
      <li>Espèces : CH₃COOH, H₂O. Acide le plus fort : CH₃COOH ; base la plus forte : H₂O. RP : CH₃COOH + H₂O = CH₃COO⁻ + H₃O⁺, \(K^\circ = K_a = 10^{-4{,}8}\) : équilibre très peu avancé.</li>
      <li>Avancement volumique \(x\) : \(\dfrac{x^2}{(0{,}10 - x)\,c^\circ} = 10^{-4{,}8}\). Hypothèse \(x \ll 0{,}10\) : \(x = \sqrt{10^{-4{,}8}\times0{,}10} = 1{,}3\times10^{-3}\ \text{mol·L}^{-1}\), donc pH = 2,9.</li>
      <li>Vérifications : \(x/0{,}10 = 1{,}3\ \%\) (hypothèse justifiée ; la résolution exacte du trinôme donne aussi 2,90) ; pH 2,9 &lt; \(\text{p}K_a - 1\) : l'acide prédomine bien ; \([\mathrm{HO^-}] = 10^{-11{,}1}\ \text{mol·L}^{-1}\) : l'autoprotolyse est négligeable.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — mélange d'acide acétique et d'ammoniac</strong>
    <p>On mélange 10 mL d'acide acétique et 10 mL d'ammoniac, tous deux à 0,10 mol·L⁻¹. Déterminer l'état final.</p>
    <ol>
      <li>Concentrations apportées après mélange : 0,050 mol·L⁻¹ chacun. RP : CH₃COOH + NH₃ = CH₃COO⁻ + NH₄⁺, \(K^\circ = 10^{4{,}4}\) : supposée totale. Solution équivalente : CH₃COO⁻ et NH₄⁺ à 0,050 mol·L⁻¹.</li>
      <li>Nouvelle RP (acide le plus fort NH₄⁺, base la plus forte CH₃COO⁻) : la réaction inverse, de constante \(10^{-4{,}4}\), qui contrôle l'équilibre : \(\varepsilon^2/(0{,}050-\varepsilon)^2 = 10^{-4{,}4}\) ; avec \(\varepsilon \ll 0{,}050\), \(\varepsilon = 0{,}050\times10^{-2{,}2} = 3{,}2\times10^{-4}\ \text{mol·L}^{-1}\) de CH₃COOH et de NH₃.</li>
      <li>pH par le couple acétique : \(\text{pH} = 4{,}8 + \log(0{,}050/\varepsilon) = 4{,}8 + 2{,}2 = 7{,}0\), cohérent avec les deux diagrammes (CH₃COO⁻ et NH₄⁺ prédominent bien entre 4,8 et 9,2). La réaction était totale à 0,6 % près.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — transformation totale suivie d'un équilibre</strong>
    <p>On mélange 20 mL de chlorure d'ammonium (NH₄⁺ + Cl⁻) à 0,10 mol·L⁻¹ et 10 mL de soude à 0,10 mol·L⁻¹.</p>
    <ol>
      <li>Quantités : 2,0 mmol de NH₄⁺, 1,0 mmol de HO⁻. RP : NH₄⁺ + HO⁻ = NH₃ + H₂O, \(K^\circ = 10^{14 - 9{,}2} = 10^{4{,}8}\) : totale, HO⁻ limitant.</li>
      <li>État après RP : 1,0 mmol de NH₄⁺ et 1,0 mmol de NH₃ ; la réaction suivante (NH₄⁺ + NH₃, échange sans effet) ne change rien.</li>
      <li>\(\text{pH} = 9{,}2 + \log(1{,}0/1{,}0) = 9{,}2\) (le calcul exact donne 9,20). On a fabriqué une solution tampon (§11).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) oublier la dilution lors d'un mélange ; (2) prendre une RP qui n'est pas celle de plus grande constante ; (3) conclure sans vérifier l'hypothèse de calcul (une RP d'équilibre peut être assez avancée : acide acétique à 10⁻³ mol·L⁻¹, 12 % dissocié ; il faut alors résoudre le trinôme) ; (4) oublier qu'après une RP totale, une deuxième réaction peut devenir prépondérante.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CAPACITÉ NUMÉRIQUE : L'ÉTAT FINAL EN PYTHON</div>
  <h2>Résoudre \(Q_r(\xi) = K^\circ\) par dichotomie</h2>
  <div class="intro">Quand aucune hypothèse simplificatrice ne s'applique (\(K^\circ\) voisin de 1, quantités du même ordre), l'équation en \(\xi\) se résout numériquement. Le programme demande de savoir le faire « à l'aide d'un langage de programmation » ; la méthode, générale, vaut pour toute réaction unique (voir aussi <a href="#equilchim/cours">« Équilibres chimiques »</a>).</div>
  <div class="prop-box">
    <strong>Principe.</strong> Pour une réaction \(\sum_j \nu_j \mathrm{A}_j = 0\) (\(\nu_j \gt 0\) pour les produits), les quantités valent \(n_j(\xi) = n_{j,0} + \nu_j\xi\). L'avancement est compris entre \(\xi_{\min}\) et \(\xi_{\max}\), valeurs qui annulent la quantité d'un produit ou d'un réactif. Sur cet intervalle, \(\ln Q_r(\xi)\) est <strong>strictement croissante</strong>, de \(-\infty\) à \(+\infty\) : l'équation \(\ln Q_r(\xi) = \ln K^\circ\) a une unique solution, que la <strong>dichotomie</strong> encadre en divisant l'intervalle par deux à chaque étape.
  </div>
  <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> etat_final(n0, nu, solutes, K, V, eps=1e-15):
    <span class="str">"""n0 : quantités initiales (mol) ; nu : coefficients (> 0 produits) ;
    solutes : True pour un soluté (activité n/(V c°)), False pour le
    solvant ou un solide (activité 1) ; V en L. Renvoie xi final."""</span>
    <span class="cmt"># bornes : un réactif ou un produit soluté s'épuise</span>
    xmin = max((-n / v <span class="kw">for</span> n, v, s <span class="kw">in</span> zip(n0, nu, solutes) <span class="kw">if</span> s <span class="kw">and</span> v > 0), default=-1e9)
    xmax = min((-n / v <span class="kw">for</span> n, v, s <span class="kw">in</span> zip(n0, nu, solutes) <span class="kw">if</span> s <span class="kw">and</span> v &lt; 0), default=1e9)

    <span class="kw">def</span> f(x):                      <span class="cmt"># ln Qr(x) - ln K, croissante</span>
        <span class="kw">return</span> sum(v * math.log((n + v * x) / V) <span class="kw">for</span> n, v, s
                   <span class="kw">in</span> zip(n0, nu, solutes) <span class="kw">if</span> s) - math.log(K)

    a, b = xmin, xmax
    <span class="kw">while</span> b - a > eps * max(1.0, abs(b)):
        m = (a + b) / 2
        <span class="kw">if</span> m == a <span class="kw">or</span> m == b:        <span class="cmt"># précision machine atteinte</span>
            <span class="kw">break</span>
        <span class="kw">try</span>:
            pos = f(m) > 0
        <span class="kw">except</span> ValueError:            <span class="cmt"># log(0) au bord : on resserre</span>
            pos = m > (xmin + xmax) / 2
        <span class="kw">if</span> pos:
            b = m
        <span class="kw">else</span>:
            a = m
    <span class="kw">return</span> (a + b) / 2

<span class="cmt"># 1) CH3COOH + H2O = CH3COO- + H3O+, 0,10 mol dans 1,0 L</span>
xi = etat_final([0.10, 0, 0, 0], [-1, -1, 1, 1],
                [True, False, True, True], 10**-4.8, 1.0)
print(xi, -math.log10(xi))           <span class="cmt"># 0.001251...  2.903</span>

<span class="cmt"># 2) HCOOH + CH3COO- = HCOO- + CH3COOH, 1,0 mmol de chaque, 20 mL</span>
xi = etat_final([1e-3, 1e-3, 0, 0], [-1, -1, 1, 1],
                [True] * 4, 10**(4.8 - 3.8), 0.020)
print(xi / 1e-3)                     <span class="cmt"># 0.7597...  (76 % d'avancement)</span></pre>
  <p>Le module <code>scipy</code> fournit des fonctions toutes faites : <code>from scipy.optimize import brentq</code> puis <code>brentq(f, a, b)</code> renvoie le zéro de <code>f</code> sur \([a, b]\) (même prérequis que la dichotomie : un changement de signe), en moins d'itérations. Écrire soi-même la dichotomie reste exigible : elle montre qu'on comprend pourquoi la solution existe et est unique.</p>
  <div class="method-box"><strong>Exemple — interpréter la sortie</strong>
    <ol>
      <li>Cas 1 : \(\xi = 1{,}25\times10^{-3}\ \text{mol}\) dans 1,0 L, donc \([\mathrm{H_3O^+}] = 1{,}25\times10^{-3}\ \text{mol·L}^{-1}\) et pH = 2,90, la même valeur qu'au §7 : l'hypothèse \(\xi \ll n_0\) était justifiée.</li>
      <li>Cas 2 : \(K^\circ = 10\), aucune hypothèse n'est possible. Le programme donne un avancement de 76 % ; on vérifie à la main : \(0{,}76^2/0{,}24^2 = 10\). Le pH vaut \(4{,}8 + \log(0{,}24/0{,}76) = 4{,}3\) (calcul exact : 4,30).</li>
    </ol>
  </div>
  <div class="notice"><strong>Pièges numériques</strong> : (1) borner l'intervalle par les épuisements des espèces, sinon le logarithme reçoit une quantité négative ; (2) ne pas compter le solvant ni un solide dans \(Q_r\) ; (3) travailler sur \(\ln Q_r - \ln K^\circ\) plutôt que sur \(Q_r - K^\circ\), dont les valeurs varient sur des dizaines d'ordres de grandeur ; (4) une réaction de précipitation peut ne pas atteindre l'équilibre (tout le solide se dissout) : il faut alors tester la présence du solide (chapitre <a href="#precipitation/cours">« Dissolution et précipitation »</a>).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · TITRAGES : SUIVI pH-MÉTRIQUE</div>
  <h2>Doser une espèce par une réaction acido-basique</h2>
  <div class="intro">Titrer, c'est déterminer la quantité d'une espèce en la faisant réagir avec un réactif de concentration connue. Le programme réserve les titrages aux travaux pratiques, mais leurs capacités sont exigibles : identifier la réaction support, repérer l'équivalence, justifier l'allure de la courbe, exploiter le résultat.</div>
  <div class="def-box">
    <strong>Réaction support, équivalence.</strong> La réaction support d'un titrage doit être <strong>unique</strong>, <strong>rapide</strong> et <strong>quasi totale</strong> (\(K^\circ\) grand). L'<strong>équivalence</strong> est atteinte quand les réactifs ont été introduits dans les <strong>proportions stœchiométriques</strong> de cette réaction ; pour \(a\,\text{A} + b\,\text{B}\) : \(\dfrac{n_A}{a} = \dfrac{n_B}{b}\). Avant l'équivalence, le réactif titrant est limitant ; après, c'est l'espèce titrée.
  </div>
  <p>Un titrage est <strong>direct</strong> quand le réactif titrant réagit sur l'espèce à doser ; <strong>indirect</strong> quand on dose autre chose qui lui est lié, par exemple l'excès d'un réactif (titrage « en retour », utile pour une espèce lente à réagir, volatile ou insoluble). Il est <strong>simple</strong> pour une seule espèce, <strong>successif</strong> quand plusieurs espèces réagissent l'une après l'autre (plusieurs sauts), <strong>simultané</strong> quand elles réagissent en même temps (un seul saut, qui donne leur somme).</p>

    <strong>Allure des courbes pH = f(V).</strong> Acide fort titré par une base forte : pH bas et lentement croissant, <strong>saut</strong> de plusieurs unités à l'équivalence, pH 7 à l'équivalence (seuls Na⁺ et Cl⁻ restent). Acide faible : pH initial plus élevé, zone tampon où \(\text{pH} = \text{p}K_a\) à la <strong>demi-équivalence</strong> (\([\mathrm{AH}] = [\mathrm{A^-}]\)), saut plus court, pH basique à l'équivalence (la base conjuguée A⁻ est seule). Le saut est d'autant plus marqué que l'acide est fort et concentré.

  <p><strong>Repérer l'équivalence</strong> sur une courbe expérimentale : abscisse du point d'inflexion du saut, obtenue par le maximum de \(\mathrm{d}\text{pH}/\mathrm{d}V\) (calculé par le logiciel d'acquisition) ou par la méthode des tangentes parallèles. Pour un titrage <strong>successif</strong>, deux sauts séparés exigent des réactions de constantes très différentes (en pratique, des \(\text{p}K_a\) écartés d'environ 4 unités au moins).</p>

  <div class="method-box"><strong>Exemple — exploiter une courbe de titrage</strong>
    <p>On titre \(V_0 = 10{,}0\ \text{mL}\) d'un vinaigre dilué par la soude à \(C_b = 0{,}100\ \text{mol·L}^{-1}\) ; le saut est centré sur \(V_E = 14{,}2\ \text{mL}\) et on lit pH 4,8 pour \(V = 7{,}1\ \text{mL}\). Exploiter.</p>
    <ol>
      <li>Réaction support : CH₃COOH + HO⁻ = CH₃COO⁻ + H₂O, \(K^\circ = 10^{14 - 4{,}8} = 10^{9{,}2}\) : quasi totale, rapide, unique.</li>
      <li>Équivalence : \(C_a V_0 = C_b V_E\), d'où \(C_a = 0{,}100\times14{,}2/10{,}0 = 0{,}142\ \text{mol·L}^{-1}\).</li>
      <li>À la demi-équivalence (\(V_E/2 = 7{,}1\ \text{mL}\)), \(\text{pH} = \text{p}K_a\) : on retrouve \(\text{p}K_a = 4{,}8\), ce qui confirme qu'on titre bien l'acide acétique.</li>
      <li>pH à l'équivalence (pour 20,0 mL d'acide à 0,100 mol·L⁻¹, courbe ci-dessus) : il reste CH₃COO⁻ à 0,050 mol·L⁻¹ ; RP : CH₃COO⁻ + H₂O = CH₃COOH + HO⁻, \(K^\circ = 10^{-9{,}2}\) ; \(\omega = \sqrt{10^{-9{,}2}\times0{,}050} = 5{,}6\times10^{-6}\ \text{mol·L}^{-1}\) de HO⁻, pH = 8,75.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) écrire « \(n_{\text{acide}} = n_{\text{base}}\) » sans regarder les coefficients (pour H₂SO₄ + 2 HO⁻, c'est \(2\,n(\mathrm{H_2SO_4}) = n(\mathrm{HO^-})\)) ; (2) croire que le pH à l'équivalence vaut toujours 7 ; (3) utiliser « pH = \(\text{p}K_a\) à la demi-équivalence » pour un acide trop fort ou trop dilué, qui réagit déjà notablement sur l'eau (voir l'exercice concours).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · INDICATEURS COLORÉS ET CONDUCTIMÉTRIE</div>
  <h2>Deux autres façons de repérer l'équivalence</h2>
  <div class="intro">Le pH-mètre n'est pas toujours nécessaire : une goutte d'indicateur coloré suffit pour un titrage de routine, et la conductimétrie permet de titrer des solutions où le saut de pH est trop faible. Dans les deux cas, il faut savoir justifier le choix.</div>
  <div class="def-box">
    <strong>Indicateur coloré.</strong> C'est un couple acide-base HIn/In⁻ dont les deux formes ont des couleurs différentes, introduit en très petite quantité. On perçoit la couleur de l'acide si \(\text{pH} \lt \text{p}K_{a,\text{ind}} - 1\), celle de la base si \(\text{pH} \gt \text{p}K_{a,\text{ind}} + 1\) ; entre les deux, la <strong>zone de virage</strong> montre une teinte intermédiaire.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">Indicateur</th><th style="text-align:left">Zone de virage</th><th style="text-align:left">Teintes (acide → base)</th></tr>
    <tr><td>Hélianthine</td><td>3,1 – 4,4</td><td>rouge → jaune orangé</td></tr>
    <tr><td>Vert de bromocrésol</td><td>3,8 – 5,4</td><td>jaune → bleu</td></tr>
    <tr><td>Rouge de méthyle</td><td>4,2 – 6,2</td><td>rouge → jaune</td></tr>
    <tr><td>Bleu de bromothymol (BBT)</td><td>6,0 – 7,6</td><td>jaune → bleu</td></tr>
    <tr><td>Phénolphtaléine</td><td>8,2 – 10,0</td><td>incolore → rose</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Choisir un indicateur ; virage et équivalence.</strong> L'indicateur convient si sa zone de virage est <strong>entièrement contenue dans le saut de pH</strong> (idéalement, elle contient le pH à l'équivalence). Le <strong>virage</strong> observé n'est pas l'équivalence elle-même : c'est le repère d'un volume voisin, d'autant plus proche que le saut est raide. Le volume lu au virage approche \(V_E\) à mieux que 1 % si la zone de virage est dans la partie verticale du saut.
  </div>
  <div class="method-box"><strong>Exemple — choisir l'indicateur</strong>
    <p>Pour les deux titrages de la figure du §9 et pour le titrage de 20,0 mL d'ammoniac à 0,100 mol·L⁻¹ par l'acide chlorhydrique à 0,100 mol·L⁻¹ (pH 5,25 à l'équivalence, saut de 7,2 à 3,3 entre 19,8 et 20,2 mL).</p>
    <ol>
      <li>HCl par la soude : saut de 3,3 à 10,7 ; BBT, rouge de méthyle ou phénolphtaléine conviennent.</li>
      <li>Acide acétique par la soude : saut de 6,8 à 10,7, équivalence à 8,75 : phénolphtaléine (le BBT virerait avant l'équivalence).</li>
      <li>Ammoniac par HCl : équivalence acide (NH₄⁺ seul) ; rouge de méthyle (4,2 – 6,2), dont la zone contient 5,25.</li>
    </ol>
  </div>
  <div class="def-box">
    <strong>Conductimétrie.</strong> La conductivité \(\sigma\) d'une solution diluée est la somme des contributions de ses ions (loi de Kohlrausch, fournie dans les énoncés) : \(\sigma = \sum_i \lambda_i\,[\mathrm{X}_i]\), où \(\lambda_i\) est la conductivité molaire ionique (en mS·m²·mol⁻¹, avec \([\mathrm{X}_i]\) en mol·m⁻³). Valeurs à 25 °C : H₃O⁺ 35,0 ; HO⁻ 19,9 ; Cl⁻ 7,6 ; NO₃⁻ 7,1 ; Na⁺ 5,0 ; CH₃COO⁻ 4,1.
  </div>
  <p>Au cours d'un titrage, chaque ion consommé est remplacé par un autre : la conductivité varie linéairement par morceaux en fonction du volume versé, si l'on corrige la dilution (\(\sigma_{\text{corr}} = \sigma\,(V_0 + V)/V_0\)) ou si l'on travaille dans un grand volume d'eau. L'équivalence est à l'<strong>intersection</strong> de deux segments. H₃O⁺ et HO⁻, beaucoup plus conducteurs que les autres ions, donnent les pentes les plus fortes.</p>

<div class="course-section">
  <div class="sec-num">§11 · SOLUTIONS TAMPONS</div>
  <h2>Un pH qui résiste aux ajouts et à la dilution</h2>
  <div class="intro">Un mélange d'un acide faible et de sa base conjuguée en quantités voisines tient son pH : c'est ce qui stabilise le pH du sang et ce qui sert à étalonner un pH-mètre (tampons de pH 4, 7 et 10). Le mot n'est pas au programme, mais la notion découle directement des §4 et §7.</div>
  <div class="def-box">
    <strong>Solution tampon.</strong> Solution dont le pH varie peu par ajout modéré d'acide ou de base, ou par dilution. Un mélange de AH et A⁻ en quantités comparables en est une : \(\text{pH} = \text{p}K_a + \log\dfrac{n(\mathrm{A^-})}{n(\mathrm{AH})}\), proche de \(\text{p}K_a\) (à ±1 unité si le rapport reste entre 1/10 et 10).
  </div>
  <p>Pourquoi le pH résiste : un acide fort ajouté réagit totalement sur A⁻ (A⁻ + H₃O⁺ → AH + H₂O), une base forte sur AH ; seul le <strong>rapport</strong> \(n(\mathrm{A^-})/n(\mathrm{AH})\) change, et le logarithme en atténue l'effet. La dilution ne change pas ce rapport : le pH reste le même tant que les réactions des deux formes avec l'eau restent négligeables.</p>

    <p>(a) On ajoute 1,0 mL d'acide chlorhydrique à 1,0 mol·L⁻¹ à 100 mL de tampon acétique (CH₃COOH et CH₃COO⁻ à 0,10 mol·L⁻¹ chacun). (b) Quel volume de soude à 0,10 mol·L⁻¹ ajouter à 50 mL d'acide acétique à 0,10 mol·L⁻¹ pour obtenir un tampon de pH 4,5 ?</p>
    <ol>
      <li>(a) RP totale : CH₃COO⁻ + H₃O⁺ → CH₃COOH + H₂O (\(K^\circ = 10^{4{,}8}\)) ; on passe de 10 mmol / 10 mmol à 9,0 mmol de CH₃COO⁻ et 11 mmol de CH₃COOH : \(\text{pH} = 4{,}8 + \log(9{,}0/11) = 4{,}71\). Dans 100 mL d'eau pure, le même ajout donnerait pH 2,0.</li>
      <li>(b) Il faut \(n(\mathrm{A^-})/n(\mathrm{AH}) = 10^{4{,}5 - 4{,}8} = 0{,}50\). La soude transforme \(n_b\) mol d'acide : \(n_b/(5{,}0\times10^{-3} - n_b) = 0{,}50\), soit \(n_b = 1{,}67\times10^{-3}\ \text{mol}\) et \(V = 16{,}7\ \text{mL}\) (pH calculé exactement : 4,50).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'un tampon garde son pH quoi qu'on ajoute. Dès que la quantité d'acide (ou de base) ajoutée approche celle de A⁻ (ou de AH), le tampon est « épuisé » et le pH chute. Le sang, tamponné par le couple CO₂,H₂O/HCO₃⁻ (et les phosphates, les protéines), ne supporte que des écarts de quelques dixièmes autour de 7,4.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · FORMULES DE pH (HORS PROGRAMME)</div>
  <h2>Les formules classiques, et leurs limites</h2>
  <div class="intro">Hors programme en PTSI : « aucune formule de calcul de pH n'est exigible ». Ces formules ne sont que les résultats de la méthode de la réaction prépondérante (§7) dans des cas types, avec des hypothèses qu'il faut vérifier. Mieux vaut savoir les retrouver que les apprendre.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">Solution (concentration apportée \(C\))</th><th style="text-align:left">Réaction prépondérante</th><th style="text-align:left">Résultat</th><th style="text-align:left">Validité</th></tr>
    <tr><td>Acide fort</td><td>totale sur l'eau</td><td>\(\text{pH} = -\log(C/c^\circ)\)</td><td>\(\text{pH} \lt 6{,}5\)</td></tr>
    <tr><td>Base forte</td><td>totale sur l'eau</td><td>\(\text{pH} = \text{p}K_e + \log(C/c^\circ)\)</td><td>\(\text{pH} \gt 7{,}5\)</td></tr>
    <tr><td>Acide faible</td><td>AH + H₂O, peu avancée</td><td>\(\text{pH} = \tfrac12\left(\text{p}K_a - \log(C/c^\circ)\right)\)</td><td>\(\text{pH} \lt \text{p}K_a - 1\) et \(\text{pH} \lt 6{,}5\)</td></tr>
    <tr><td>Base faible</td><td>A⁻ + H₂O, peu avancée</td><td>\(\text{pH} = \tfrac12\left(\text{p}K_e + \text{p}K_a + \log(C/c^\circ)\right)\)</td><td>\(\text{pH} \gt \text{p}K_a + 1\) et \(\text{pH} \gt 7{,}5\)</td></tr>
    <tr><td>Ampholyte (ex. HCO₃⁻)</td><td>2 HA⁻ = H₂A + A²⁻</td><td>\(\text{pH} = \tfrac12(\text{p}K_{a1} + \text{p}K_{a2})\)</td><td>\(C\) pas trop faible</td></tr>
    <tr><td>Mélange AH + A⁻</td><td>aucune (échange sans effet)</td><td>\(\text{pH} = \text{p}K_a + \log(C_{A^-}/C_{AH})\)</td><td>concentrations pas trop faibles</td></tr>
  </table></div>
  <div class="method-box"><strong>Exemple — quand les formules trompent</strong>
    <ol>
      <li>Acide chlorhydrique à \(10^{-8}\ \text{mol·L}^{-1}\) : la formule donne 8, le calcul complet 6,98 (l'autoprotolyse domine).</li>
      <li>Acide acétique à \(10^{-5}\ \text{mol·L}^{-1}\) : la formule de l'acide faible donne 4,9, au-dessus de \(\text{p}K_a - 1\) ; le calcul exact donne 5,16 (l'acide est dissocié à 69 %, l'hypothèse « peu avancée » est fausse).</li>
      <li>Hydrogénocarbonate de sodium à 0,10 mol·L⁻¹ : la formule de l'ampholyte donne 8,35, comme le calcul exact.</li>
    </ol>
  </div>
  <p>Deux autres prolongements hors programme : la constante de basicité \(K_b = K_e/K_a\), qui n'apporte rien de plus que \(K_a\) ; et les coefficients d'activité, qui deviennent nécessaires au-delà de 10⁻² à 10⁻¹ mol·L⁻¹ en ions (l'activité n'y est plus égale à \([\mathrm{X}]/c^\circ\)).</p>
</div>
</template>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ACIDO-BASIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur les réactions acido-basiques : reconnaître une réaction et ses couples, lire les diagrammes, combiner des constantes, prévoir les espèces incompatibles, déterminer un état final par la réaction prépondérante ou par un programme, exploiter un titrage. Aucune ne demande de formule de pH.</div>

  <div class="method-box"><strong>Méthode 1 — Reconnaître une réaction acido-basique et ses couples</strong>
    <ol>
      <li><span class="step">Proton.</span> Repérer l'espèce qui perd un H⁺ (l'acide) et celle qui le gagne (la base) ; vérifier qu'aucun nombre d'oxydation ne change (sinon : oxydoréduction).</li>
      <li><span class="step">Couples.</span> Écrire les deux couples sous la forme acide/base, chacun avec sa demi-équation AH = A⁻ + H⁺.</li>
      <li><span class="step">Ampholytes.</span> Pour H₂O, HCO₃⁻, H₂PO₄⁻, HPO₄²⁻, préciser le rôle joué dans cette réaction (acide ou base).</li>
    </ol>
    <p><em>Exemple éclair :</em> H₂PO₄⁻ + NH₃ = HPO₄²⁻ + NH₄⁺. H₂PO₄⁻ cède un proton (couple H₂PO₄⁻/HPO₄²⁻, \(\text{p}K_a = 7{,}2\)), NH₃ le capte (couple NH₄⁺/NH₃, \(\text{p}K_a = 9{,}2\)) ; \(K^\circ = 10^{9{,}2 - 7{,}2} = 10^{2{,}0}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Lire un diagramme de prédominance ou de distribution</strong>
    <ol>
      <li><span class="step">Axe.</span> Placer les \(\text{p}K_a\) sur l'axe des pH ; l'acide à gauche de sa frontière, la base à droite ; pour un polyacide, une forme entre deux \(\text{p}K_a\) successifs.</li>
      <li><span class="step">Forme prédominante</span> au pH donné : celle du domaine qui contient ce pH.</li>
      <li><span class="step">Proportions.</span> \([\mathrm{A^-}]/[\mathrm{AH}] = 10^{\,\text{pH} - \text{p}K_a}\) : à une unité de la frontière, 91 % / 9 % ; à deux unités, 99 % / 1 % (forme minoritaire négligeable). Sur un diagramme de distribution, lire directement les pourcentages.</li>
    </ol>
    <p><em>Exemple éclair :</em> ammoniac dans un milieu de pH 8,2 : 8,2 &lt; 9,2, NH₄⁺ prédomine ; \([\mathrm{NH_3}]/[\mathrm{NH_4^+}] = 10^{-1}\), soit 9,1 % de NH₃ et 90,9 % de NH₄⁺.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « prédominer » ne veut pas dire « être seul ». À \(\text{pH} = \text{p}K_a + 0{,}5\), la forme minoritaire représente encore 24 % du total.</div>

  <div class="method-box"><strong>Méthode 3 — Calculer une constante d'équilibre par combinaison</strong>
    <ol>
      <li><span class="step">Briques.</span> Disposer des équations de référence : AH + H₂O = A⁻ + H₃O⁺ (\(K_a\)), 2 H₂O = H₃O⁺ + HO⁻ (\(K_e\)) et, au chapitre suivant, les dissolutions (\(K_s\)).</li>
      <li><span class="step">Combinaison.</span> Écrire l'équation cherchée comme somme de ces briques, chacune multipliée par un coefficient \(\lambda_i\) (négatif si on l'inverse) ; vérifier que les espèces intermédiaires (H₃O⁺, H₂O…) se simplifient.</li>
      <li><span class="step">Constante.</span> \(K^\circ = \prod_i (K^\circ_i)^{\lambda_i}\) ; en logarithmes, \(\log K^\circ = \sum_i \lambda_i \log K^\circ_i\).</li>
      <li><span class="step">Contrôle.</span> Pour un acide sur une base : \(K^\circ = 10^{\,\text{p}K_a(\text{base}) - \text{p}K_a(\text{acide})}\), supérieur à 1 si la base est au-dessus de l'acide sur l'échelle.</li>
    </ol>
    <p><em>Exemple éclair :</em> CO₃²⁻ + 2 CH₃COOH = CO₂,H₂O + 2 CH₃COO⁻ est la somme de 2 × (CH₃COOH + H₂O = CH₃COO⁻ + H₃O⁺), de CO₃²⁻ + H₃O⁺ = HCO₃⁻ + H₂O et de HCO₃⁻ + H₃O⁺ = CO₂,H₂O + H₂O. Donc \(\log K^\circ = 2(-4{,}8) + 10{,}3 + 6{,}4 = 7{,}1\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Prévoir les espèces incompatibles et écrire la réaction</strong>
    <ol>
      <li><span class="step">Diagrammes.</span> Tracer sur un même axe les diagrammes de prédominance des couples présents.</li>
      <li><span class="step">Compatibilité.</span> Un acide et une base dont les domaines sont disjoints sont incompatibles : ils réagissent (\(K^\circ \gt 1\)). S'ils ont un domaine commun, ils coexistent.</li>
      <li><span class="step">Milieu imposé.</span> Si le pH est fixé (tampon, milieu très acide ou basique), écrire chaque couple sous sa forme prédominante à ce pH avant d'écrire l'équation.</li>
      <li><span class="step">Observations.</span> Confirmer par l'expérience : dégagement gazeux (CO₂, NH₃), odeur, changement de couleur d'un indicateur.</li>
    </ol>
    <p><em>Exemple éclair :</em> eau de Javel (ions ClO⁻, couple HClO/ClO⁻ de \(\text{p}K_a\) 7,5) et vinaigre : CH₃COOH (domaine pH &lt; 4,8) et ClO⁻ (pH &gt; 7,5) sont incompatibles ; CH₃COOH + ClO⁻ = CH₃COO⁻ + HClO, \(K^\circ = 10^{2{,}7}\). En présence d'ions chlorure, l'acidification libère ensuite du dichlore toxique (oxydoréduction) : on ne mélange jamais Javel et produit acide.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Déterminer l'état final et le pH par la réaction prépondérante</strong>
    <ol>
      <li><span class="step">Inventaire.</span> Espèces introduites et concentrations <em>après mélange</em> (dilution !), placées sur l'échelle des \(\text{p}K_a\).</li>
      <li><span class="step">RP.</span> Réaction entre l'acide le plus fort et la base la plus forte. Si \(K^\circ\) est grand, la supposer totale, faire le bilan et recommencer avec la nouvelle composition.</li>
      <li><span class="step">RP d'équilibre.</span> Quand la RP a une constante faible, écrire \(Q_r = K^\circ\) avec l'avancement volumique ; simplifier si possible (\(x\) petit devant les concentrations), sinon résoudre le trinôme ou programmer (méthode 7).</li>
      <li><span class="step">pH.</span> Le déduire de \([\mathrm{H_3O^+}]\) ou de \([\mathrm{HO^-}]\), ou de la relation de Henderson appliquée à un couple dont on connaît les deux formes.</li>
      <li><span class="step">Vérifications.</span> Hypothèse de calcul, cohérence du pH avec les diagrammes (les espèces supposées majoritaires prédominent-elles ?), autoprotolyse négligeable.</li>
    </ol>
    <p><em>Exemple éclair :</em> ammoniac à 0,10 mol·L⁻¹. RP : NH₃ + H₂O = NH₄⁺ + HO⁻, \(K^\circ = K_e/K_a = 10^{-4{,}8}\), peu avancée : \(\omega = \sqrt{10^{-4{,}8}\times0{,}10} = 1{,}3\times10^{-3}\ \text{mol·L}^{-1}\) de HO⁻, pH = 14 − 2,9 = 11,1. Vérification : \(\omega/C = 1{,}3\ \%\) et 11,1 &gt; 9,2 + 1 : NH₃ prédomine bien.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer une formule de pH apprise par cœur hors de son domaine de validité (acide très dilué, acide assez fort, ampholyte trop dilué). La méthode de la réaction prépondérante impose la vérification ; une formule la fait oublier.</div>

  <div class="method-box"><strong>Méthode 6 — Distinguer transformation totale et équilibre</strong>
    <ol>
      <li><span class="step">Constante.</span> Calculer \(K^\circ\) de la réaction qui modélise la transformation.</li>
      <li><span class="step">Hypothèse.</span> \(K^\circ\) très grand : transformation totale, l'avancement final est l'avancement maximal fixé par le réactif limitant. \(K^\circ\) très petit : équilibre très peu avancé. Sinon : équilibre, à résoudre exactement.</li>
      <li><span class="step">Contrôle.</span> Dans le cas « totale », calculer la petite quantité de réactif limitant restante par l'équilibre inverse, pour chiffrer l'écart ; dans tous les cas, vérifier \(Q_r = K^\circ\) à l'état final (sauf si un réactif est épuisé ou si un produit quitte le milieu).</li>
    </ol>
    <p><em>Exemple éclair :</em> 1,0 mmol de CH₃COOH et 1,0 mmol de HCOO⁻ : CH₃COOH + HCOO⁻ = CH₃COO⁻ + HCOOH, \(K^\circ = 10^{3{,}8 - 4{,}8} = 0{,}10\). Ni totale ni négligeable : \(\xi^2/(1{,}0 - \xi)^2 = 0{,}10\), d'où \(\xi = 0{,}24\ \text{mmol}\) (24 %). On retrouve exactement l'état final obtenu au §8 du cours à partir de HCOOH et CH₃COO⁻ : l'état d'équilibre ne dépend pas du chemin.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Programmer la recherche de l'état final</strong>
    <ol>
      <li><span class="step">Modèle.</span> Écrire les quantités \(n_j(\xi) = n_{j,0} + \nu_j \xi\) et l'activité de chaque espèce (\(n_j/(V c^\circ)\) pour un soluté, 1 pour le solvant ou un solide).</li>
      <li><span class="step">Intervalle.</span> \(\xi_{\min}\) et \(\xi_{\max}\) : valeurs où un produit, puis un réactif, est épuisé.</li>
      <li><span class="step">Fonction.</span> \(f(\xi) = \ln Q_r(\xi) - \ln K^\circ\), strictement croissante sur l'intervalle et changeant de signe.</li>
      <li><span class="step">Dichotomie.</span> Couper l'intervalle en deux, garder la moitié où \(f\) change de signe, jusqu'à la précision voulue (ou <code>scipy.optimize.brentq</code>).</li>
      <li><span class="step">Contrôle.</span> Recalculer \(Q_r\) avec le \(\xi\) trouvé, comparer à un cas limite connu (réaction totale, très peu avancée).</li>
    </ol>
    <p><em>Exemple éclair :</em> partir d'un intervalle de largeur \(10^{-3}\ \text{mol}\) et viser \(10^{-12}\ \text{mol}\) demande \(\log_2(10^9) \approx 30\) itérations : la dichotomie est lente mais toujours sûre.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Exploiter une courbe de titrage pH-métrique</strong>
    <ol>
      <li><span class="step">Réaction support.</span> L'écrire, calculer \(K^\circ\) (il doit être grand) et repérer l'espèce titrée et le réactif titrant.</li>
      <li><span class="step">Équivalence.</span> Lire \(V_E\) au point d'inflexion du saut (maximum de \(\mathrm{d}\text{pH}/\mathrm{d}V\) ou tangentes parallèles) ; pour un titrage successif, un \(V_E\) par saut.</li>
      <li><span class="step">Relation.</span> Écrire \(n_{\text{titré}}/a = n_{\text{titrant}}/b\) avec les coefficients de la réaction support ; en déduire la concentration cherchée.</li>
      <li><span class="step">Contrôles.</span> pH à l'équivalence (neutre, acide ou basique selon l'espèce qui reste) ; pour un acide faible, \(\text{pH} \approx \text{p}K_a\) à la demi-équivalence, si l'acide est peu dissocié par l'eau.</li>
    </ol>
    <p><em>Exemple éclair :</em> 10,0 mL d'acide sulfurique titrés par la soude à 0,100 mol·L⁻¹ : un seul saut à \(V_E = 12{,}0\ \text{mL}\) (les deux acidités réagissent ensemble, \(K^\circ = 10^{12}\) pour HSO₄⁻ + HO⁻). H₂SO₄ + 2 HO⁻ → SO₄²⁻ + 2 H₂O, donc \(C = \dfrac{0{,}100\times12{,}0}{2\times10{,}0} = 0{,}0600\ \text{mol·L}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(n_{\text{acide}} = n_{\text{base}}\) pour un polyacide, ou lire « pH = \(\text{p}K_a\) » à la demi-équivalence d'un acide assez fort (comme H₃PO₄, \(\text{p}K_{a1} = 2{,}1\)) : il réagit déjà notablement sur l'eau et le pH lu est plus élevé que \(\text{p}K_a\).</div>

  <div class="method-box"><strong>Méthode 9 — Choisir un indicateur coloré de fin de titrage</strong>
    <ol>
      <li><span class="step">pH à l'équivalence.</span> L'estimer par la réaction prépondérante dans la solution obtenue à l'équivalence (ou le lire sur une courbe simulée).</li>
      <li><span class="step">Saut.</span> Repérer l'étendue de la partie verticale du saut (par exemple entre \(0{,}99\,V_E\) et \(1{,}01\,V_E\)).</li>
      <li><span class="step">Choix.</span> Retenir un indicateur dont la zone de virage est contenue dans le saut et, idéalement, contient le pH à l'équivalence ; noter le changement de teinte attendu.</li>
    </ol>
    <p><em>Exemple éclair :</em> 20,0 mL d'ammoniac à 0,100 mol·L⁻¹ titrés par HCl à 0,100 mol·L⁻¹ : à l'équivalence, NH₄⁺ seul à 0,050 mol·L⁻¹, pH 5,25 ; saut de 7,2 à 3,3. Rouge de méthyle (4,2 – 6,2), passage du jaune au rouge.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Exploiter un suivi conductimétrique</strong>
    <ol>
      <li><span class="step">Ions.</span> Avant et après l'équivalence, lister les ions qui disparaissent et ceux qui apparaissent quand on verse le réactif titrant.</li>
      <li><span class="step">Pentes.</span> Chaque segment a pour pente (en conductivité corrigée de la dilution) la somme des \(\lambda\) des ions apparus moins celle des ions disparus, par mole versée.</li>
      <li><span class="step">Équivalence.</span> Tracer les deux segments et prendre l'abscisse de leur intersection ; appliquer la relation d'équivalence.</li>
    </ol>
    <p><em>Exemple éclair :</em> ammoniac titré par HCl. Avant l'équivalence, NH₃ (non conducteur) devient NH₄⁺ et Cl⁻ s'ajoute : pente \(\lambda(\mathrm{NH_4^+}) + \lambda(\mathrm{Cl^-}) = 7{,}3 + 7{,}6 = 15\ \text{mS·m}^2\text{·mol}^{-1}\). Après, H₃O⁺ et Cl⁻ s'ajoutent : pente \(35{,}0 + 7{,}6 = 42{,}6\), trois fois plus forte. Le changement de pente marque l'équivalence.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier la correction de dilution, qui courbe les segments, ou les ions spectateurs (Na⁺, Cl⁻) qui contribuent à la conductivité même s'ils ne réagissent pas.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Acides et bases usuels, couples et prédominance</h3>
  <div class="statement">Données à 25 °C, \(\text{p}K_a\) : HSO₄⁻/SO₄²⁻ 2,0 ; H₃PO₄/H₂PO₄⁻ 2,1 ; CH₃COOH/CH₃COO⁻ 4,8 ; CO₂,H₂O/HCO₃⁻ 6,4 ; H₂PO₄⁻/HPO₄²⁻ 7,2 ; NH₄⁺/NH₃ 9,2 ; HCO₃⁻/CO₃²⁻ 10,3 ; HPO₄²⁻/PO₄³⁻ 12,4 ; \(\text{p}K_e = 14\).</div>
  <div class="q"><strong>Q1.</strong> Les réactions suivantes sont-elles acido-basiques ? Si oui, donner les deux couples mis en jeu. (a) HNO₃ + H₂O → NO₃⁻ + H₃O⁺ ; (b) Zn + 2 H₃O⁺ → Zn²⁺ + H₂ + 2 H₂O ; (c) Ba²⁺ + SO₄²⁻ → BaSO₄(s) ; (d) HCO₃⁻ + HO⁻ = CO₃²⁻ + H₂O ; (e) H₂PO₄⁻ + NH₃ = HPO₄²⁻ + NH₄⁺.</div>
  <div class="q"><strong>Q2.</strong> Nommer et classer (acide ou base, fort ou faible) : HCl, H₂SO₄, HNO₃, H₃PO₄, CH₃COOH, NaOH, NH₃, HCO₃⁻. Citer les ampholytes rencontrés dans cet exercice.</div>
  <div class="q"><strong>Q3.</strong> Quelle est la forme prédominante, à pH 8,0, des couples acétique, ammonium, carbonate et phosphate ? Quelle proportion de l'ammoniac est sous forme NH₃ ?</div>
  <div class="q"><strong>Q4.</strong> Quelle quantité d'ions HO⁻ faut-il pour transformer en ions SO₄²⁻ l'acide sulfurique contenu dans 10,0 mL d'une solution à 0,10 mol·L⁻¹ ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On cherche un transfert de H⁺ sans changement de nombre d'oxydation. (a) Oui : HNO₃/NO₃⁻ et H₃O⁺/H₂O (réaction totale, acide fort). (b) Non : le zinc passe de 0 à +II, l'hydrogène de +I à 0, c'est une oxydoréduction. (c) Non : précipitation. (d) Oui : HCO₃⁻/CO₃²⁻ (HCO₃⁻ y est acide) et H₂O/HO⁻. (e) Oui : H₂PO₄⁻/HPO₄²⁻ et NH₄⁺/NH₃.</p>
    <p><strong>Q2.</strong> Acides forts : chlorhydrique HCl, nitrique HNO₃, sulfurique H₂SO₄ (première acidité forte, la seconde, HSO₄⁻, faible). Acides faibles : phosphorique H₃PO₄ (triacide), acétique CH₃COOH. Base forte : soude NaOH (Na⁺ + HO⁻). Base faible : ammoniac NH₃. HCO₃⁻ (hydrogénocarbonate) est un ampholyte faible, acide du couple de \(\text{p}K_a\) 10,3 et base de celui de \(\text{p}K_a\) 6,4. Autres ampholytes ici : H₂O, H₂PO₄⁻, HPO₄²⁻.</p>
    <p><strong>Q3.</strong> On place 8,0 sur chaque diagramme. Acétique : 8,0 &gt; 4,8, CH₃COO⁻ (à plus de 99,9 %). Ammonium : 8,0 &lt; 9,2, NH₄⁺. Carbonate : 6,4 &lt; 8,0 &lt; 10,3, HCO₃⁻. Phosphate : 7,2 &lt; 8,0 &lt; 12,4, HPO₄²⁻. Pour l'ammoniac, \([\mathrm{NH_3}]/[\mathrm{NH_4^+}] = 10^{8{,}0 - 9{,}2} = 0{,}063\), soit \(0{,}063/1{,}063 = 5{,}9\ \%\) de NH₃.</p>
    <p><strong>Q4.</strong> \(n(\mathrm{H_2SO_4}) = 1{,}0\times10^{-3}\ \text{mol}\) ; diacide : H₂SO₄ + 2 HO⁻ → SO₄²⁻ + 2 H₂O, donc \(n(\mathrm{HO^-}) = 2{,}0\times10^{-3}\ \text{mol}\) (20 mL de soude à 0,10 mol·L⁻¹).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>pH de solutions d'acide fort et de base forte</h3>
  <div class="statement">À 25 °C (\(\text{p}K_e = 14{,}0\)), on prépare (a) une solution d'acide chlorhydrique à \(C = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) et (b) une solution de soude à \(C = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Écrire la réaction de chaque soluté avec l'eau et en déduire le pH des deux solutions.</div>
  <div class="q"><strong>Q2.</strong> Préciser le caractère acide ou basique.</div>
  <div class="q"><strong>Q3.</strong> On dilue la solution (a) un million de fois. Son pH vaut-il 8 ? Le calculer en écrivant que la solution est électriquement neutre.</div>
  <div class="q"><strong>Q4.</strong> À 37 °C, \(\text{p}K_e = 13{,}6\). Une solution de pH 7,0 à cette température est-elle acide, neutre ou basique ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) HCl + H₂O → H₃O⁺ + Cl⁻, réaction totale (acide fort) : \([\mathrm{H_3O^+}] = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\), pH = 2,0. L'autoprotolyse est négligeable : \([\mathrm{HO^-}] = 10^{-12}\ \text{mol·L}^{-1}\). (b) NaOH → Na⁺ + HO⁻ : \([\mathrm{HO^-}] = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\), \([\mathrm{H_3O^+}] = K_e (c^\circ)^2/[\mathrm{HO^-}] = 10^{-12}\ \text{mol·L}^{-1}\), pH = 12,0.</p>
    <p><strong>Q2.</strong> pH 2 &lt; 7 : acide ; pH 12 &gt; 7 : basique (à 25 °C).</p>
    <p><strong>Q3.</strong> Non : diluer un acide ne le rend pas basique. À \(C = 1{,}0\times10^{-8}\ \text{mol·L}^{-1}\), les ions H₃O⁺ de l'autoprotolyse (de l'ordre de \(10^{-7}\ \text{mol·L}^{-1}\)) dominent. Électroneutralité : \([\mathrm{H_3O^+}] = [\mathrm{Cl^-}] + [\mathrm{HO^-}]\), soit \(h = C + K_e/h\) (en mol·L⁻¹), d'où \(h^2 - C h - K_e = 0\) et \(h = \tfrac12\left(C + \sqrt{C^2 + 4K_e}\right) = 1{,}05\times10^{-7}\), pH = 6,98 : légèrement acide, comme attendu.</p>
    <p><strong>Q4.</strong> À 37 °C, la neutralité correspond à \(\text{pH} = 13{,}6/2 = 6{,}8\). À pH 7,0, \([\mathrm{HO^-}] = 10^{-6{,}6} \gt [\mathrm{H_3O^+}] = 10^{-7{,}0}\) : la solution est (faiblement) basique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Diagramme de distribution de l'acide phosphorique</h3>
  <div class="statement">On s'aide du diagramme de distribution de l'acide phosphorique du cours (§4), \(\text{p}K_a\) = 2,1 ; 7,2 ; 12,4. L'acide phosphorique est un additif de certains sodas (pH ≈ 2,5) et les phosphates tamponnent en partie le milieu intracellulaire.</div>
  <div class="q"><strong>Q1.</strong> Comment lit-on les trois \(\text{p}K_a\) sur le diagramme de distribution ?</div>
  <div class="q"><strong>Q2.</strong> Quelles formes sont présentes dans un soda de pH 2,5 ? Calculer leurs proportions.</div>
  <div class="q"><strong>Q3.</strong> Dans quel intervalle de pH HPO₄²⁻ représente-t-il au moins 99 % du phosphore (estimation par la règle des deux unités) ?</div>
  <div class="q"><strong>Q4.</strong> Montrer que \([\mathrm{H_3PO_4}] = [\mathrm{HPO_4^{2-}}]\) pour \(\text{pH} = \tfrac12(\text{p}K_{a1} + \text{p}K_{a2})\). Que vaut alors la fraction de H₂PO₄⁻ ?</div>
  <div class="q"><strong>Q5.</strong> On dissout du dihydrogénophosphate de sodium NaH₂PO₄ dans l'eau (0,10 mol·L⁻¹). Écrire la réaction prépondérante et en déduire le pH.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Aux abscisses des points de croisement à 50 % de deux formes successives (H₃PO₄ et H₂PO₄⁻ à 2,1 ; H₂PO₄⁻ et HPO₄²⁻ à 7,2 ; HPO₄²⁻ et PO₄³⁻ à 12,4) : en ces points, les deux formes d'un même couple sont à égalité, donc \(\text{pH} = \text{p}K_a\).</p>
    <p><strong>Q2.</strong> pH 2,5 est entre 2,1 et 7,2, à moins d'une unité de 2,1 : H₂PO₄⁻ prédomine mais H₃PO₄ n'est pas négligeable ; HPO₄²⁻ (4,7 unités plus loin) est négligeable. \([\mathrm{H_2PO_4^-}]/[\mathrm{H_3PO_4}] = 10^{2{,}5 - 2{,}1} = 2{,}5\), d'où 72 % de H₂PO₄⁻ et 28 % de H₃PO₄.</p>
    <p><strong>Q3.</strong> Il faut être à au moins deux unités des deux frontières de HPO₄²⁻ : \(7{,}2 + 2 = 9{,}2 \le \text{pH} \le 12{,}4 - 2 = 10{,}4\). (Le calcul exact donne 9,23 à 10,37.)</p>
    <p><strong>Q4.</strong> En multipliant les deux premières constantes : \(\dfrac{[\mathrm{HPO_4^{2-}}]\,h^2}{[\mathrm{H_3PO_4}]} = K_{a1}K_{a2}\) (en notant \(h = 10^{-\text{pH}}\)). L'égalité \([\mathrm{H_3PO_4}] = [\mathrm{HPO_4^{2-}}]\) impose \(h^2 = K_{a1}K_{a2}\), soit \(\text{pH} = \tfrac12(2{,}1 + 7{,}2) = 4{,}65\). Chacune de ces deux formes est à 2,55 unités de sa frontière avec H₂PO₄⁻ : \([\mathrm{H_2PO_4^-}]/[\mathrm{H_3PO_4}] = 10^{2{,}55} = 355\), d'où 99,4 % de H₂PO₄⁻ (c'est son maximum).</p>
    <p><strong>Q5.</strong> H₂PO₄⁻ est l'acide le plus fort et la base la plus forte présents (ampholyte). RP : 2 H₂PO₄⁻ = H₃PO₄ + HPO₄²⁻, \(K^\circ = 10^{2{,}1 - 7{,}2} = 10^{-5{,}1}\) : très peu avancée, mais elle forme autant de H₃PO₄ que de HPO₄²⁻. D'après Q4, le pH vaut donc 4,65. Vérification : à ce pH, H₂PO₄⁻ (99,4 %) est bien l'espèce majoritaire ; le calcul complet donne 4,67.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Constantes par combinaison et espèces incompatibles</h3>
  <div class="statement">Données (\(\text{p}K_a\), 25 °C) : celles de l'exercice 1, et HClO/ClO⁻ 7,5 ; \(\text{p}K_e = 14\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la constante d'équilibre de : (a) CH₃COOH + HCO₃⁻ = CH₃COO⁻ + CO₂,H₂O ; (b) NH₄⁺ + CO₃²⁻ = NH₃ + HCO₃⁻ ; (c) H₃PO₄ + 2 HO⁻ = HPO₄²⁻ + 2 H₂O ; (d) HClO + CH₃COO⁻ = ClO⁻ + CH₃COOH ; (e) CO₃²⁻ + 2 H₃O⁺ = CO₂,H₂O + 2 H₂O.</div>
  <div class="q"><strong>Q2.</strong> Lesquelles peut-on considérer comme quasi totales ? Lesquelles sont très peu avancées ?</div>
  <div class="q"><strong>Q3.</strong> À l'aide des diagrammes de prédominance, dire si les couples d'espèces suivants sont compatibles : (i) NH₄⁺ et CH₃COO⁻ ; (ii) NH₄⁺ et CO₃²⁻ ; (iii) HClO et CH₃COO⁻. Relier la réponse à Q1.</div>
  <div class="q"><strong>Q4.</strong> Pourquoi une goutte d'acide chlorhydrique sur du calcaire ou une solution de carbonate de sodium provoque-t-elle une effervescence ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) \(K^\circ = 10^{6{,}4 - 4{,}8} = 10^{1{,}6} \approx 40\). (b) \(10^{10{,}3 - 9{,}2} = 10^{1{,}1} \approx 13\). (c) C'est la somme de H₃PO₄ + HO⁻ = H₂PO₄⁻ + H₂O (\(10^{14 - 2{,}1}\)) et de H₂PO₄⁻ + HO⁻ = HPO₄²⁻ + H₂O (\(10^{14 - 7{,}2}\)) : \(K^\circ = 10^{11{,}9 + 6{,}8} = 10^{18{,}7}\). (d) \(10^{4{,}8 - 7{,}5} = 10^{-2{,}7} \approx 2\times10^{-3}\). (e) Inverse des deux réactions des acides du carbonate sur l'eau : \(K^\circ = 1/(K_{a1}K_{a2}) = 10^{6{,}4 + 10{,}3} = 10^{16{,}7}\).</p>
    <p><strong>Q2.</strong> (c) et (e) sont quasi totales. (d) est très peu avancée. (a) et (b) sont favorables (\(K^\circ \gt 1\)) sans être totales a priori : leur avancement dépend des quantités introduites et doit être calculé.</p>
    <p><strong>Q3.</strong> (i) NH₄⁺ prédomine pour pH &lt; 9,2, CH₃COO⁻ pour pH &gt; 4,8 : domaine commun [4,8 ; 9,2], compatibles (la réaction NH₄⁺ + CH₃COO⁻ a pour constante \(10^{-4{,}4}\)). (ii) NH₄⁺ (pH &lt; 9,2) et CO₃²⁻ (pH &gt; 10,3) : domaines disjoints, incompatibles, réaction (b), de constante modeste car les domaines ne sont séparés que de 1,1 unité. (iii) HClO (pH &lt; 7,5) et CH₃COO⁻ (pH &gt; 4,8) : compatibles, réaction (d) défavorable.</p>
    <p><strong>Q4.</strong> Les ions carbonate réagissent quasi totalement avec H₃O⁺ (réaction (e), ou sa première étape vers HCO₃⁻ si l'acide est en défaut). Le CO₂ dissous formé dépasse vite sa solubilité et se dégage en bulles : l'effervescence est le test classique des carbonates.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Acide éthanoïque : pH par la réaction prépondérante</h3>
  <div class="statement">L'acide éthanoïque (acétique) CH₃COOH, couple de \(\text{p}K_a = 4{,}8\), est dissous dans l'eau à \(C = 0{,}10\ \text{mol·L}^{-1}\) ; \(\text{p}K_e = 14\).</div>
  <div class="q"><strong>Q1.</strong> Identifier la réaction prépondérante et sa constante.</div>
  <div class="q"><strong>Q2.</strong> En faisant une hypothèse que l'on justifiera, déterminer le pH. Quelle espèce du couple prédomine ?</div>
  <div class="q"><strong>Q3.</strong> Vérifier toutes les hypothèses faites.</div>
  <div class="q"><strong>Q4.</strong> On dilue la solution 100 fois. Reprendre le calcul. L'hypothèse de Q2 est-elle encore satisfaisante ? Conclure par une résolution exacte.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Espèces : CH₃COOH et H₂O. L'acide le plus fort est CH₃COOH, la base la plus forte H₂O. RP : CH₃COOH + H₂O = CH₃COO⁻ + H₃O⁺, \(K^\circ = K_a = 10^{-4{,}8}\) : petite constante, équilibre peu avancé.</p>
    <p><strong>Q2.</strong> Avec l'avancement volumique \(x\) : \(\dfrac{x^2}{(C - x)\,c^\circ} = K_a\). Hypothèse \(x \ll C\) (petite constante) : \(x = \sqrt{K_a C c^\circ}\) \(= \sqrt{10^{-5{,}8}}\) \(= 1{,}3\times10^{-3}\ \text{mol·L}^{-1}\), pH = 2,9. À ce pH, inférieur à 4,8, l'acide CH₃COOH prédomine.</p>
    <p><strong>Q3.</strong> \(x/C = 1{,}3\ \%\) : hypothèse justifiée (le trinôme donne aussi pH 2,90). \(\text{pH} = 2{,}9 \lt \text{p}K_a - 1\) : la forme acide représente plus de 98 %, cohérent. \([\mathrm{HO^-}] = 10^{-11{,}1}\ \text{mol·L}^{-1}\), donc l'autoprotolyse de l'eau, qui produit autant de H₃O⁺ que de HO⁻, apporte au plus \(10^{-11}\ \text{mol·L}^{-1}\) de H₃O⁺ : négligeable.</p>
    <p><strong>Q4.</strong> \(C' = 1{,}0\times10^{-3}\ \text{mol·L}^{-1}\). Même hypothèse : \(x = \sqrt{10^{-6{,}8}} = 1{,}26\times10^{-4}\), pH 3,90, mais \(x/C' = 12{,}6\ \%\) : l'hypothèse devient discutable. Résolution du trinôme \(x^2 + K_a x - K_a C' = 0\) : \(x = 1{,}18\times10^{-4}\ \text{mol·L}^{-1}\), pH = 3,93, et 12 % de l'acide est dissocié. La dilution a augmenté la proportion dissociée (de 1,3 % à 12 %), tout en faisant monter le pH d'un seul point.</p>

  <h3>Capacité numérique : état final par dichotomie</h3>
  <div class="statement">On veut déterminer numériquement l'état final de deux systèmes, sans hypothèse simplificatrice. \(\text{p}K_a\) : HCOOH/HCOO⁻ 3,8 ; NH₄⁺/NH₃ 9,2 ; HCO₃⁻/CO₃²⁻ 10,3.</div>
  <div class="q"><strong>Q1.</strong> Écrire une fonction Python <code>dichotomie(f, a, b, eps)</code> qui renvoie une valeur approchée à <code>eps</code> près du zéro d'une fonction <code>f</code> croissante et changeant de signe sur \([a, b]\). Combien d'itérations faut-il pour passer d'un intervalle de largeur \(10^{-3}\) à une précision de \(10^{-12}\) ?</div>
  <div class="q"><strong>Q2.</strong> Acide méthanoïque (formique) à \(C = 1{,}0\times10^{-3}\ \text{mol·L}^{-1}\) : écrire la réaction prépondérante, la fonction \(f(x) = \ln Q_r(x) - \ln K^\circ\) de l'avancement volumique, et calculer le pH. Comparer au résultat de l'hypothèse « acide peu dissocié ».</div>
  <div class="q"><strong>Q3.</strong> On mélange 1,0 mmol d'ammoniac et 2,0 mmol d'hydrogénocarbonate de sodium dans 50 mL d'eau. Écrire la réaction prépondérante, calculer sa constante, déterminer l'avancement final par dichotomie et en déduire le pH.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque itération divise la largeur par 2 : il faut \(\log_2(10^{-3}/10^{-12}) = 9\log_2 10 \approx 30\) itérations.</p>
    <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> dichotomie(f, a, b, eps):
    <span class="str">"""Zéro de f, croissante et changeant de signe sur [a, b]."""</span>
    <span class="kw">while</span> b - a > eps:
        m = (a + b) / 2
        <span class="kw">if</span> f(m) > 0:
            b = m
        <span class="kw">else</span>:
            a = m
    <span class="kw">return</span> (a + b) / 2

<span class="cmt"># Q2 : HCOOH + H2O = HCOO- + H3O+, x en mol/L (c° = 1 mol/L)</span>
C, K = 1.0e-3, 10**-3.8
f = <span class="kw">lambda</span> x: math.log(x**2 / (C - x)) - math.log(K)
x = dichotomie(f, 1e-15, C - 1e-15, 1e-15)
print(x, -math.log10(x))                       <span class="cmt"># 0.000327  3.486</span>

<span class="cmt"># Q3 : NH3 + HCO3- = NH4+ + CO3^2-, xi en mmol</span>
K = 10**(9.2 - 10.3)
g = <span class="kw">lambda</span> xi: math.log(xi**2 / ((1.0 - xi) * (2.0 - xi))) - math.log(K)
xi = dichotomie(g, 1e-9, 1.0 - 1e-9, 1e-9)
print(xi, 10.3 + math.log10(xi / (2.0 - xi)))   <span class="cmt"># 0.306  9.56</span></pre>
    <p><strong>Q2.</strong> RP : HCOOH + H₂O = HCOO⁻ + H₃O⁺, \(K^\circ = 10^{-3{,}8}\) ; \(Q_r(x) = x^2/((C - x)c^\circ)\) sur \(]0 ; C[\). Le programme donne \(x = 3{,}27\times10^{-4}\ \text{mol·L}^{-1}\), pH = 3,49 (33 % de l'acide est dissocié). L'hypothèse « peu dissocié » aurait donné \(x = \sqrt{K C} = 3{,}98\times10^{-4}\), pH 3,40 : 22 % d'erreur sur \(x\), l'hypothèse n'était pas valable.</p>
    <p><strong>Q3.</strong> La base la plus forte est NH₃ (\(\text{p}K_a\) 9,2), l'acide le plus fort HCO₃⁻ (10,3) : RP NH₃ + HCO₃⁻ = NH₄⁺ + CO₃²⁻, \(K^\circ = 10^{9{,}2 - 10{,}3} = 10^{-1{,}1} = 0{,}079\). La réaction ne change pas le nombre de solutés : le volume se simplifie et on peut raisonner en mmol. Le programme donne \(\xi = 0{,}306\ \text{mmol}\) (31 % de l'ammoniac). D'où \(\text{pH} = 10{,}3 + \log\dfrac{0{,}306}{2{,}0 - 0{,}306} = 9{,}56\), en accord avec le couple de l'ammonium : \(9{,}2 + \log\dfrac{1{,}0 - 0{,}306}{0{,}306} = 9{,}56\) (le calcul complet donne 9,556).</p>
  </div>
</div>

  <h3>Titrage d'un acide faible par une base forte</h3>
  <div class="statement">On titre \(V_a = 20{,}0\ \text{mL}\) d'acide acétique CH₃COOH à \(C_a = 0{,}10\ \text{mol·L}^{-1}\) (\(\text{p}K_a = 4{,}8\)) par la soude à \(C_b = 0{,}10\ \text{mol·L}^{-1}\) ; \(\text{p}K_e = 14\). La courbe est celle de la figure du cours (§9, courbe rouge).</div>

  <div class="q"><strong>A1.</strong> Écrire la réaction de titrage, calculer sa constante et déterminer le volume équivalent \(V_E\).</div>

  <p class="exo-part">Partie B — pH à l'équivalence et indicateur</p>
  <div class="q"><strong>B1.</strong> Déterminer le pH à l'équivalence par la méthode de la réaction prépondérante. Pourquoi est-il basique ?</div>
  <div class="q"><strong>B2.</strong> Le saut de pH va de 6,8 (pour 19,8 mL) à 10,7 (pour 20,2 mL). Choisir un indicateur parmi l'hélianthine (3,1 – 4,4), le BBT (6,0 – 7,6) et la phénolphtaléine (8,2 – 10,0).</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> CH₃COOH + HO⁻ = CH₃COO⁻ + H₂O, \(K^\circ = K_a/K_e = 10^{9{,}2}\) : quasi totale. À l'équivalence : \(C_a V_a = C_b V_E\), donc \(V_E = C_a V_a/C_b = 20{,}0\ \text{mL}\).</p>
    <p><strong>A2.</strong> Pour \(V = 10{,}0\ \text{mL}\), la moitié de l'acide a été transformée : \([\mathrm{CH_3COOH}] = [\mathrm{CH_3COO^-}]\), d'où \(\text{pH} = \text{p}K_a = 4{,}8\) par la relation de Henderson. C'est valable parce que l'acide acétique réagit très peu sur l'eau à cette concentration (vérifié : le calcul complet donne 4,80).</p>
    <p><strong>B1.</strong> À l'équivalence, il ne reste que CH₃COO⁻ (et Na⁺) : \([\mathrm{CH_3COO^-}] = C_a V_a/(V_a + V_E)\) \(= 0{,}050\ \text{mol·L}^{-1}\). RP : CH₃COO⁻ + H₂O = CH₃COOH + HO⁻, \(K^\circ = K_e/K_a = 10^{-9{,}2}\), peu avancée : \(\omega = \sqrt{10^{-9{,}2}\times0{,}050} = 5{,}6\times10^{-6}\ \text{mol·L}^{-1}\), pH = 14 + log ω = 8,75. Vérification : \(\omega \ll 0{,}050\) et 8,75 &gt; 4,8 + 1 (CH₃COO⁻ prédomine). Le pH est basique car la seule espèce acido-basique restante, l'ion acétate, est une base.</p>
    <p><strong>B2.</strong> La phénolphtaléine : sa zone de virage (8,2 – 10,0) est dans le saut et contient 8,75. Le BBT commencerait à virer vers 19 mL, avant l'équivalence ; l'hélianthine virerait dès le début du titrage (pH 3,1 à 4,4 avant 10 mL).</p>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Dans un grand volume, les 12 mL de soude versés ne changent presque pas le volume (de 100 à 112 mL) : la conductivité varie alors presque linéairement. La correction \(\sigma(V_0 + V)/V_0\) supprime l'effet résiduel de la dilution (12 %) et rend les segments rigoureusement rectilignes.</p>
    <p><strong>Q2.</strong> Avant l'équivalence, H₃O⁺ + HO⁻ → 2 H₂O : chaque HO⁻ versé remplace un ion H₃O⁺ par un ion Na⁺, beaucoup moins conducteur (\(5{,}0 - 35{,}0 = -30\)) : σ diminue. Après, on ajoute Na⁺ et HO⁻ sans réaction : σ augmente (\(5{,}0 + 19{,}9 = +24{,}9\)).</p>
    <p><strong>Q3.</strong> \(C_S = 0{,}100\times12{,}4/10{,}0 = 0{,}124\ \text{mol·L}^{-1}\). Dans 100 mL, \([\mathrm{H_3O^+}] = [\mathrm{Cl^-}]\) \(= 1{,}24\times10^{-2}\ \text{mol·L}^{-1}\) \(= 12{,}4\ \text{mol·m}^{-3}\) : \(\sigma_0 = (35{,}0 + 7{,}6)\times12{,}4 = 528\ \text{mS·m}^{-1}\). À l'équivalence, Na⁺ et Cl⁻ à 12,4 mol·m⁻³ (en conductivité corrigée) : \(\sigma = (5{,}0 + 7{,}6)\times12{,}4 = 156\ \text{mS·m}^{-1}\), trois fois et demie moins.</p>
