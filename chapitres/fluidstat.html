  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">La statique des fluides ouvre le programme de PT (partie 1.1, « Éléments de statique des fluides dans un référentiel galiléen »). Au-delà des résultats, elle sert de premier terrain d'entraînement au <strong>découpage</strong> d'un système en éléments infinitésimaux et à la <strong>sommation</strong> d'une grandeur extensive (ici, une force) sur ce découpage.</div>

<div class="course-section">
  <div class="sec-num">§1 · FORCES SUR UN FLUIDE</div>
  <h2>Forces volumiques, forces surfaciques, champ de pression</h2>
  <div class="intro">Un fluide (liquide ou gaz) se déforme sans résistance. On le décrit à l'échelle mésoscopique par des grandeurs locales : masse volumique \(\mu(M)\), pression \(p(M)\), température. Les forces qui s'exercent sur une portion de fluide sont de deux natures très différentes.</div>
  <div class="def-box">
    <strong>Force volumique.</strong> Elle agit sur toute la matière d'un volume et lui est proportionnelle : le poids d'un élément de volume \(\mathrm{d}\tau\) de masse volumique \(\mu\) vaut \(\mathrm{d}\vec P = \mu\,\vec g\,\mathrm{d}\tau\). La force volumique de pesanteur est \(\mu\vec g\) (en N·m⁻³).<br>
    <strong>Force surfacique.</strong> Elle agit à travers une surface, par contact, et est proportionnelle à son aire. Dans un fluide <strong>au repos</strong>, la seule force de contact est la force de pression, <strong>normale</strong> à la surface : le fluide exerce sur un élément de paroi \(\mathrm{d}S\)
    <div class="formula" data-nom="Force de pression élémentaire">$$\mathrm{d}\vec F = p(M)\,\mathrm{d}S\,\vec n$$</div>
    où \(\vec n\) est la normale unitaire dirigée <strong>du fluide vers la paroi</strong>. La pression est une grandeur scalaire, la même dans toutes les directions en un point (isotropie) : on parle de <strong>champ de pression</strong> \(p(M)\).
  </div>
  <p>Unités : le pascal, \(1\ \text{Pa} = 1\ \text{N·m}^{-2}\) ; le bar, \(1\ \text{bar} = 10^5\ \text{Pa}\). Ordres de grandeur : atmosphère au niveau de la mer \(1{,}013\ \text{bar}\) ; pneu de voiture 2 à 3 bar (au-delà de l'atmosphère) ; fond de la fosse des Mariannes, environ 1 100 bar.</p>
  <div class="notice"><strong>Ne pas confondre.</strong> Le poids d'un élément de fluide est proportionnel à son <strong>volume</strong> (\(\propto\mathrm{d}x^3\)) ; la force de pression sur une de ses faces, à son <strong>aire</strong> (\(\propto\mathrm{d}x^2\)). C'est la <strong>différence</strong> des forces de pression sur deux faces opposées, du même ordre que le volume, qui peut équilibrer le poids.</div>
</div>

  <div class="sec-num">§2 · RELATION FONDAMENTALE DE LA STATIQUE</div>

</figure>
  <div class="method-box">
    <strong>Établir la relation fondamentale</strong> (axe \(Oz\) vertical ascendant, \(\vec g = -g\,\vec e_z\))
    <ol>
      <li><strong>Système</strong> : élément de fluide de section horizontale \(S\), compris entre \(z\) et \(z+\mathrm{d}z\), de volume \(\mathrm{d}\tau = S\,\mathrm{d}z\), au repos.</li>
      <li><strong>Forces latérales</strong> : sur deux faces latérales opposées, à la même altitude, les forces de pression sont opposées et se compensent.</li>
      <li><strong>Selon z</strong> : force de pression sur la face inférieure \(+p(z)S\,\vec e_z\) (le fluide du dessous pousse vers le haut), sur la face supérieure \(-p(z+\mathrm{d}z)S\,\vec e_z\), poids \(-\mu g S\,\mathrm{d}z\,\vec e_z\).</li>
      <li><strong>Équilibre</strong> : \(p(z)S - p(z+\mathrm{d}z)S - \mu gS\,\mathrm{d}z = 0\), soit \(-\dfrac{\mathrm{d}p}{\mathrm{d}z}S\,\mathrm{d}z = \mu gS\,\mathrm{d}z\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Relation fondamentale de la statique des fluides</strong> (axe \(Oz\) ascendant) :
    <div class="formula" data-nom="Relation fondamentale de la statique des fluides">$$\frac{\mathrm{d}p}{\mathrm{d}z}=-\mu\,g$$</div>
    La pression <strong>diminue quand on monte</strong> et ne dépend que de l'altitude : dans un fluide au repos, les surfaces isobares sont des plans horizontaux. Forme vectorielle : \(\overrightarrow{\operatorname{grad}}\,p = \mu\vec g\).
  </div>
  <div class="notice"><strong>Erreur classique</strong> : le signe. Avec un axe orienté vers le bas (profondeur \(h\)), la relation devient \(\mathrm{d}p/\mathrm{d}h = +\mu g\). Vérifier toujours que la pression augmente avec la profondeur.</div>
  <p>Conséquences immédiates : deux points d'un même fluide au repos, connexe, à la même altitude ont la même pression (principe des vases communicants) ; à la surface libre d'un liquide en contact avec l'air, la pression vaut la pression atmosphérique \(p_0\) (continuité de la pression à travers une interface plane, en l'absence de tension superficielle).</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FLUIDE INCOMPRESSIBLE</div>
  <h2>La pression croît linéairement avec la profondeur</h2>
  <div class="prop-box">
    Pour un fluide <strong>incompressible et homogène</strong> (\(\mu\) uniforme), l'intégration de la relation fondamentale donne, avec \(p = p_0\) à la surface libre (\(z = z_0\)) :
    <div class="formula" data-nom="Pression dans un liquide">$$p(z)=p_0+\mu g\,(z_0-z)=p_0+\mu g\,h$$</div>
    où \(h = z_0 - z\) est la profondeur. La surpression \(\mu g h\) ne dépend ni de la forme du récipient ni de la quantité de liquide au-dessus, seulement de la profondeur.
  </div>
  <p>Pour l'eau (\(\mu = 10^3\ \text{kg·m}^{-3}\)), \(\mu g \approx 10^4\ \text{Pa·m}^{-1}\) : <strong>un bar tous les dix mètres</strong>. Pour le mercure (\(13{,}6\times10^3\ \text{kg·m}^{-3}\)), une colonne de 760 mm équilibre la pression atmosphérique : c'est le baromètre de Torricelli.</p>
  <div class="method-box">
    <strong>Exemple — plongée et manomètre à liquide</strong>
    <ol>
      <li>À 30 m de profondeur en mer (\(\mu = 1\,025\ \text{kg·m}^{-3}\)) : \(p = 1{,}013\times10^5 + 1\,025\times9{,}81\times30 \approx 4{,}0\ \text{bar}\). L'air d'un poumon, à température constante, y occupe un volume divisé par 4 (loi de Boyle-Mariotte) : d'où les règles de remontée.</li>
      <li>Un tube en U contenant de l'eau est relié par une branche à une canalisation de gaz, l'autre branche étant ouverte. La dénivellation entre les deux surfaces libres vaut \(\Delta h = 12\ \text{cm}\) : la surpression du gaz est \(\mu g\Delta h \approx 1\,200\ \text{Pa} = 12\ \text{mbar}\), l'ordre de grandeur du gaz de ville.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ATMOSPHÈRE ISOTHERME</div>
  <h2>Un gaz parfait dont la masse volumique dépend de la pression</h2>
  <div class="intro">Dans un gaz, la masse volumique n'est plus constante : elle est proportionnelle à la pression. La relation fondamentale devient une équation différentielle linéaire, dont la solution est exponentielle.</div>
  <div class="method-box">
    <strong>Établir le profil de pression de l'atmosphère isotherme</strong>
    <ol>
      <li>Gaz parfait de masse molaire \(M\) à la température uniforme \(T\) : \(\mu = \dfrac{pM}{RT}\).</li>
      <li>Relation fondamentale : \(\dfrac{\mathrm{d}p}{\mathrm{d}z} = -\dfrac{Mg}{RT}\,p\), équation du premier ordre à coefficients constants.</li>
      <li>Solution avec \(p(0) = p_0\) :
        <div class="formula" data-nom="Atmosphère isotherme">$$p(z)=p_0\,\exp\!\Big(-\frac{z}{H}\Big)\qquad H=\frac{RT}{Mg}$$</div></li>
      <li>Hauteur caractéristique : pour l'air (\(M = 29\ \text{g·mol}^{-1}\)) à \(T = 290\ \text{K}\), \(H = \dfrac{8{,}31\times290}{0{,}029\times9{,}81} \approx 8{,}5\ \text{km}\).</li>
    </ol>
  </div>

    <strong>Comparer océan et atmosphère.</strong> Sur 10 m de dénivellation, la pression de l'océan varie de 1 bar, soit 100 % de la pression de surface ; celle de l'atmosphère varie de \(\Delta p/p = \Delta z/H \approx 10/8\,500 \approx 0{,}12\ \%\). À l'échelle d'une salle ou d'un récipient de laboratoire, <strong>la pression d'un gaz est uniforme</strong> : c'est ce qui permet de parler de « la » pression d'un gaz en thermodynamique.
  </div>
  <div class="method-box">
    <strong>Exemple — pression au sommet du mont Blanc</strong>
    <p>Avec le modèle isotherme (\(H = 8{,}5\ \text{km}\)) : \(p = 1{,}013\times\exp(-4{,}81/8{,}5) \approx 0{,}57\ \text{bar}\). La valeur mesurée est d'environ 0,55 bar : l'écart vient de ce que la température diminue en réalité d'environ 6,5 K par kilomètre dans la troposphère. L'eau y bout vers 84 °C.</p>
  </div>
  <div class="notice"><strong>Limites du modèle.</strong> L'atmosphère réelle n'est pas isotherme et \(g\) diminue légèrement avec l'altitude ; le modèle reste une bonne première approximation sur une dizaine de kilomètres. Il explique aussi que la moitié de la masse de l'atmosphère se trouve sous 6 km environ.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RÉSULTANTE DES FORCES DE PRESSION</div>
  <h2>Découper, exprimer, sommer</h2>
  <div class="intro">Pour obtenir la force exercée par un fluide sur une paroi ou un objet, on découpe la surface en éléments \(\mathrm{d}S\) sur lesquels la pression est uniforme, on exprime chaque force élémentaire, puis on somme. Les symétries indiquent d'avance la direction de la résultante.</div>
  <div class="method-box">
    <strong>Méthode — calculer une résultante de forces de pression</strong>
    <ol>
      <li><strong>Pression</strong> en chaque point de la surface (statique : \(p_0 + \mu g h\) pour un liquide).</li>
      <li><strong>Surface élémentaire</strong> dans des coordonnées adaptées : bande horizontale \(L\,\mathrm{d}z\) sur une paroi plane ; \(R\,\mathrm{d}\theta\,\mathrm{d}z\) sur un cylindre ; \(R^2\sin\theta\,\mathrm{d}\theta\,\mathrm{d}\varphi\) sur une sphère.</li>
      <li><strong>Symétries</strong> : un plan de symétrie de la surface et de la répartition de pression contient la résultante ; deux plans → la résultante est portée par leur intersection. On ne calcule alors qu'une composante.</li>
      <li><strong>Sommer</strong> \(\mathrm{d}F_z = p\,\mathrm{d}S\,\vec n\cdot\vec e_z\) (ou la composante utile) en intégrant.</li>
      <li><strong>Pression atmosphérique</strong> : si elle s'exerce des deux côtés de la paroi, elle ne contribue pas ; ne garder que la surpression \(\mu g h\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — paroi verticale d'un barrage</strong>
    <p>Paroi rectangulaire de largeur \(L\), retenant une hauteur d'eau \(h\) ; l'air est à \(p_0\) des deux côtés.</p>
    <ol>
      <li>À la profondeur \(y\) (comptée depuis la surface), la surpression vaut \(\mu g y\) ; bande horizontale \(\mathrm{d}S = L\,\mathrm{d}y\).</li>
      <li>Toutes les forces élémentaires sont horizontales et orthogonales à la paroi : \(F = \displaystyle\int_0^h \mu g y\,L\,\mathrm{d}y = \frac{\mu g L h^2}{2}\).</li>
      <li>Pour \(h = 50\ \text{m}\) et \(L = 200\ \text{m}\) : \(F \approx 2{,}5\times10^{9}\ \text{N}\), le poids de 250 000 tonnes. La force croît comme \(h^2\) : les barrages sont plus épais à la base.</li>
      <li>Point d'application (centre de poussée) : la répartition triangulaire des pressions place la résultante à \(2h/3\) sous la surface, soit \(h/3\) au-dessus du fond.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — hémisphères de Magdebourg</strong>
    <p>Deux demi-sphères creuses de rayon \(R\), accolées, dans lesquelles on a fait un vide partiel (pression \(p_i\)), l'extérieur étant à \(p_0\). Quelle force faut-il pour les séparer ?</p>
    <ol>
      <li>Sur la demi-sphère \(z \gt 0\) (axe \(Oz\) normal au plan de jonction), la surpression extérieure \(p_0 - p_i\) est uniforme. L'axe \(Oz\) est l'intersection de plans de symétrie : la résultante est portée par \(\vec e_z\), dirigée vers le bas.</li>
      <li>Surface élémentaire en sphériques : \(\mathrm{d}S = R^2\sin\theta\,\mathrm{d}\theta\,\mathrm{d}\varphi\) ; la force élémentaire est dirigée selon \(-\vec e_r\), de composante \(-(p_0-p_i)\,\mathrm{d}S\cos\theta\) selon \(z\).</li>
      <li>\(F = (p_0 - p_i)R^2\displaystyle\int_0^{2\pi}\!\!\int_0^{\pi/2}\cos\theta\sin\theta\,\mathrm{d}\theta\,\mathrm{d}\varphi = (p_0 - p_i)\,\pi R^2\).</li>
      <li>Une pression uniforme exerce sur une surface la même résultante que sur sa <strong>projection</strong> plane : ici le disque \(\pi R^2\). Pour \(R = 25\ \text{cm}\) et \(p_i = 0{,}1\ \text{bar}\), \(F \approx 1{,}8\times10^{4}\ \text{N}\) : il fallait des attelages de chevaux.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§6 · POUSSÉE D'ARCHIMÈDE</div>
  <h2>La résultante des forces de pression sur un corps immergé</h2>
  <div class="intro">Un objet plongé dans un fluide au repos subit, de la part de ce fluide, des forces de pression plus intenses sur ses parties basses que sur ses parties hautes. Leur résultante est une force verticale, dirigée vers le haut, que l'on calcule sans aucune intégrale grâce à un raisonnement de substitution.</div>
  <div class="method-box">
    <strong>Démontrer le théorème d'Archimède</strong>
    <ol>
      <li>Soit un corps de volume \(V\), entièrement immergé dans un fluide au repos. Les forces de pression qu'il subit ne dépendent que de la forme de sa surface et du champ de pression, qui est imposé par le fluide environnant.</li>
      <li>Remplaçons par la pensée le corps par du fluide identique au fluide environnant, occupant exactement le même volume (le « fluide déplacé »). Le fluide entier est alors au repos : ce volume de fluide est en équilibre sous son poids \(\mu_f V\vec g\) et la résultante \(\vec\Pi\) des forces de pression sur sa surface.</li>
      <li>D'où \(\vec\Pi = -\mu_f V\vec g\). Or ces forces de pression sont les mêmes que celles qui s'exercent sur le corps : c'est la poussée qu'il subit.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Théorème d'Archimède.</strong> Un corps immergé dans un fluide au repos subit de sa part une force, la <strong>poussée d'Archimède</strong>, opposée au poids du fluide déplacé :
    <div class="formula" data-nom="Poussée d'Archimède">$$\vec\Pi_A=-\mu_f\,V_{\text{imm}}\,\vec g$$</div>
    où \(V_{\text{imm}}\) est le volume immergé. Elle s'applique au centre de masse du fluide déplacé (centre de poussée). Pour un corps flottant à l'interface entre deux fluides (eau et air), on somme les poussées des deux fluides ; celle de l'air est le plus souvent négligeable.
  </div>
  <div class="method-box">
    <strong>Exemple — la partie émergée d'un iceberg</strong>
    <p>Glace : \(\mu_g = 917\ \text{kg·m}^{-3}\) ; eau de mer : \(\mu_m = 1\,025\ \text{kg·m}^{-3}\). À l'équilibre, poids et poussée se compensent : \(\mu_g V g = \mu_m V_{\text{imm}} g\), d'où \(\dfrac{V_{\text{imm}}}{V} = \dfrac{917}{1\,025} \approx 0{,}89\). Près de 90 % du volume est immergé : seule la « pointe » est visible.</p>
  </div>
  <div class="method-box">
    <strong>Exemple — une montgolfière</strong>
    <p>Enveloppe de \(V = 2\,500\ \text{m}^3\) contenant de l'air chauffé à 100 °C, dans l'air extérieur à 15 °C sous 1 bar. Masse volumique de l'air : \(\mu = pM/(RT)\), soit 1,21 kg·m⁻³ dehors et 0,93 kg·m⁻³ dedans. La force ascensionnelle nette (poussée moins poids de l'air chaud) vaut \((1{,}21 - 0{,}93)\,V g \approx 6{,}8\ \text{kN}\) : de quoi soulever environ 700 kg (enveloppe, nacelle et passagers compris).</p>
  </div>
  <div class="notice"><strong>Conditions d'application.</strong> Le fluide doit être au repos (sinon la répartition de pression change : portance, traînée). Si l'objet repose sur le fond, collé sans fluide en dessous (ventouse), il n'y a plus de pression sur sa face inférieure : le théorème ne s'applique pas tel quel.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Fluide en rotation, tension superficielle</h2>
  <p>Dans un référentiel non galiléen, la relation fondamentale garde sa forme vectorielle à condition d'ajouter les forces d'inertie volumiques : \(\overrightarrow{\operatorname{grad}}\,p = \mu(\vec g - \vec a_e)\). Pour un liquide en rotation uniforme autour d'un axe vertical (centrifugeuse, verre que l'on fait tourner), la surface libre prend la forme d'un paraboloïde de révolution. À très petite échelle (gouttes, capillaires), la tension superficielle crée une différence de pression à travers une interface courbe (loi de Laplace) et la pression n'est plus continue à la traversée de la surface libre.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="fst-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · STATIQUE DES FLUIDES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Établir une loi de pression par un bilan sur un élément</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Axe.</span> Choisir l'orientation de \(Oz\) et l'écrire (ascendant : \(\vec g = -g\vec e_z\)).</li>
      <li><span class="step">Élément.</span> Tranche de section \(S\) entre \(z\) et \(z+\mathrm{d}z\) ; forces : pression en bas, en haut, poids \(\mu gS\,\mathrm{d}z\).</li>
      <li><span class="step">Équilibre.</span> \(\mathrm{d}p/\mathrm{d}z = -\mu g\) ; exprimer \(\mu\) : constante (liquide) ou \(pM/(RT)\) (gaz parfait).</li>
      <li><span class="step">Intégrer</span> avec la condition à la surface libre ou au sol, puis contrôler : la pression croît avec la profondeur.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Calculer une résultante de forces de pression</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Pression locale.</span> Exprimer \(p\) sur la paroi en fonction de la coordonnée pertinente (profondeur).</li>
      <li><span class="step">Élément de surface</span> dans des coordonnées adaptées, et normale \(\vec n\) (du fluide vers la paroi).</li>
      <li><span class="step">Symétries</span> pour réduire le calcul à une composante.</li>
      <li><span class="step">Intégrer</span> ; ne garder que la surpression si \(p_0\) agit des deux côtés. Raccourci : sous pression uniforme, la résultante sur une surface vaut \(p\) fois l'aire de sa projection orthogonale à la direction de la résultante.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Utiliser la poussée d'Archimède</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Volume immergé.</span> Identifier la partie du corps dans chaque fluide.</li>
      <li><span class="step">Poussée</span> \(\mu_f V_{\text{imm}} g\), verticale vers le haut, pour chaque fluide (négliger l'air devant l'eau, pas devant un ballon).</li>
      <li><span class="step">Bilan</span> : équilibre (flottaison) ou principe fondamental de la dynamique (ascension, chute). Comparer masses volumiques moyennes : le corps flotte si la sienne est inférieure à celle du fluide.</li>
    </ol>
    <p><em>Piège :</em> la poussée dépend du volume immergé, pas de la profondeur (fluide incompressible) ni de la masse du corps.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Manomètres et vases communicants</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Chemin.</span> Parcourir le fluide continu d'un point à l'autre ; à chaque descente de \(h\) dans un liquide de masse volumique \(\mu\), ajouter \(\mu gh\) ; à chaque montée, retrancher.</li>
      <li><span class="step">Interfaces.</span> La pression est continue à la traversée d'une interface plane.</li>
      <li><span class="step">Gaz.</span> Dans un gaz, à l'échelle du laboratoire, la pression est uniforme.</li>
    </ol>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Tube en U à deux liquides</h3>
  <div class="statement">Un tube en U ouvert aux deux extrémités contient du mercure (\(\mu_{Hg} = 13{,}6\times10^3\ \text{kg·m}^{-3}\)). On verse dans la branche de gauche une colonne d'eau de hauteur \(h_e = 27{,}2\ \text{cm}\).</div>
  <div class="q"><strong>Q1.</strong> Quelle est la dénivellation \(\Delta h\) entre les surfaces de mercure des deux branches ?</div>
  <div class="q"><strong>Q2.</strong> Quelle est la différence de hauteur entre la surface libre de l'eau et celle du mercure de droite ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Au niveau de l'interface eau-mercure (gauche), la pression vaut \(p_0 + \mu_e g h_e\). Au même niveau dans la branche de droite (même fluide continu, le mercure), elle vaut \(p_0 + \mu_{Hg}g\Delta h\). D'où \(\Delta h = \dfrac{\mu_e}{\mu_{Hg}}h_e = \dfrac{27{,}2}{13{,}6} = 2{,}0\ \text{cm}\), le mercure de droite étant plus haut.</p>
    <p><strong>Q2.</strong> La surface de l'eau est à \(h_e - \Delta h = 25{,}2\ \text{cm}\) au-dessus de celle du mercure de droite.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Atmosphère isotherme et masse de l'atmosphère</h3>
  <div class="statement">On modélise l'atmosphère par un gaz parfait isotherme à \(T = 280\ \text{K}\), de masse molaire \(M = 29\ \text{g·mol}^{-1}\), dans un champ de pesanteur uniforme ; pression au sol \(p_0 = 1{,}0\times10^5\ \text{Pa}\).</div>
  <div class="q"><strong>Q1.</strong> Établir \(p(z)\) et calculer la hauteur caractéristique \(H\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer la masse de la colonne d'air de section \(S\) au-dessus du sol, de deux façons : en intégrant \(\mu(z)\), et par un bilan des forces. Conclure pour la masse totale de l'atmosphère (rayon terrestre 6 400 km).</div>
  <div class="q"><strong>Q3.</strong> À quelle altitude se trouve la moitié de cette masse ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\mathrm{d}p/\mathrm{d}z = -\dfrac{Mg}{RT}p\), d'où \(p = p_0e^{-z/H}\) avec \(H = \dfrac{RT}{Mg} = \dfrac{8{,}31\times280}{0{,}029\times9{,}81}\approx 8{,}2\ \text{km}\).</p>
    <p><strong>Q2.</strong> \(\mu = \dfrac{pM}{RT} = \dfrac{p_0}{gH}e^{-z/H}\), donc \(m = S\displaystyle\int_0^\infty\mu\,\mathrm{d}z = \frac{p_0S}{g}\). Bilan des forces sur la colonne : la pression au sol \(p_0S\) équilibre son poids \(mg\) (pression nulle au sommet) : même résultat. Masse totale : \(\dfrac{p_0\,4\pi R_T^2}{g} \approx \dfrac{10^5\times5{,}1\times10^{14}}{9{,}81}\approx 5\times10^{18}\ \text{kg}\).</p>
    <p><strong>Q3.</strong> La masse au-dessous de \(z\) vaut \(m(1 - e^{-z/H})\) : la moitié pour \(z = H\ln2 \approx 5{,}7\ \text{km}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Force sur une vanne circulaire</h3>
  <div class="statement">Une vanne en forme de disque de rayon \(R = 0{,}50\ \text{m}\) ferme un orifice dans la paroi verticale d'un réservoir d'eau ; son centre est à la profondeur \(h_C = 4{,}0\ \text{m}\). L'air est à \(p_0\) des deux côtés.</div>
  <div class="q"><strong>Q1.</strong> Montrer que la résultante des forces de pression vaut \(F = \mu g h_C\,\pi R^2\) (on pourra repérer un point du disque par ses coordonnées polaires et utiliser un argument de symétrie pour le terme en \(\sin\theta\)).</div>
  <div class="q"><strong>Q2.</strong> Application numérique. Comparer au poids d'une voiture.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Un point du disque de coordonnées \((r,\theta)\), \(\theta\) mesuré depuis l'horizontale, est à la profondeur \(h_C - r\sin\theta\). Élément \(\mathrm{d}S = r\,\mathrm{d}r\,\mathrm{d}\theta\), forces toutes orthogonales au disque : \(F = \displaystyle\int_0^R\!\!\int_0^{2\pi}\mu g(h_C - r\sin\theta)\,r\,\mathrm{d}\theta\,\mathrm{d}r\). Le terme en \(\sin\theta\) s'annule sur un tour : \(F = \mu g h_C\pi R^2\). La force est celle d'une pression uniforme égale à la pression au centre (valable pour toute surface plane : pression au centre de gravité).</p>
    <p><strong>Q2.</strong> \(F = 10^3\times9{,}81\times4{,}0\times\pi\times0{,}25\approx 3{,}1\times10^{4}\ \text{N}\), le poids de trois voitures.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Densimètre et ballon-sonde</h3>
  <div class="statement">(a) Un densimètre est un flotteur lesté, de masse \(m = 20\ \text{g}\), surmonté d'une tige graduée de section \(s = 0{,}20\ \text{cm}^2\). Dans l'eau pure, il flotte avec un volume immergé \(V_0 = 20\ \text{cm}^3\). (b) Un ballon-sonde contient de l'hélium ; son enveloppe et sa charge ont une masse de 2,5 kg.</div>
  <div class="q"><strong>Q1.</strong> (a) Dans un liquide de masse volumique \(\mu = 1\,050\ \text{kg·m}^{-3}\), de combien la tige émerge-t-elle davantage que dans l'eau ?</div>
  <div class="q"><strong>Q2.</strong> (b) Quel volume d'hélium faut-il, au sol (air à 1,2 kg·m⁻³, hélium à 0,17 kg·m⁻³), pour que le ballon décolle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Flottaison : \(m = \mu V_{\text{imm}}\), donc \(V_{\text{imm}} = m/\mu = 19{,}05\ \text{cm}^3\). Le volume immergé diminue de \(0{,}95\ \text{cm}^3\), soit une émersion supplémentaire de \(0{,}95/0{,}20 \approx 4{,}8\ \text{cm}\) de tige : graduation très lisible.</p>
    <p><strong>Q2.</strong> Il faut \((\mu_{air} - \mu_{He})Vg \ge Mg\), soit \(V \ge \dfrac{2{,}5}{1{,}2 - 0{,}17}\approx 2{,}4\ \text{m}^3\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Concours PT — Hublot hémisphérique d'un sous-marin</h3>
  <div class="statement">Un sous-marin d'exploration porte un hublot en forme de demi-sphère de rayon \(R = 20\ \text{cm}\), d'axe horizontal \(Ox\). Le sous-marin est à 500 m de profondeur ; l'intérieur est à la pression atmosphérique. On néglige la variation de pression sur la hauteur du hublot.</div>
  <div class="q"><strong>Q1.</strong> Justifier par les symétries la direction de la résultante des forces de pression exercées par l'eau sur le hublot.</div>
  <div class="q"><strong>Q2.</strong> Calculer cette résultante par intégration en coordonnées sphériques d'axe \(Ox\), puis la retrouver par l'argument de la projection.</div>
  <div class="q"><strong>Q3.</strong> On tient compte de la variation de pression avec l'altitude sur le hublot. Montrer que cela ajoute une composante verticale, et l'identifier à une poussée d'Archimède.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pression uniforme : tout plan contenant l'axe \(Ox\) est plan de symétrie de la surface et des forces ; la résultante est portée par \(Ox\), dirigée vers l'intérieur du sous-marin.</p>
    <p><strong>Q2.</strong> Surpression \(\Delta p = \mu g h \approx 1{,}0\times10^3\times9{,}81\times500 \approx 4{,}9\times10^{6}\ \text{Pa}\). Avec \(\theta\) l'angle à l'axe \(Ox\) : \(F = \Delta p\displaystyle\int_0^{2\pi}\!\!\int_0^{\pi/2}\cos\theta\,R^2\sin\theta\,\mathrm{d}\theta\,\mathrm{d}\varphi = \Delta p\,\pi R^2 \approx 6{,}2\times10^{5}\ \text{N}\). Projection : le disque de rayon \(R\) subit la même force, \(\Delta p\,\pi R^2\).</p>
    <p><strong>Q3.</strong> Avec \(p = p_C - \mu g z\) (\(z\) altitude relative au centre), le terme \(-\mu g z\) est impair en \(z\) : il ne change pas la composante selon \(Ox\) mais donne une composante verticale. Le hublot et le disque plan qui le ferme délimitent un volume \(\tfrac23\pi R^3\) ; si ce volume était plein d'eau, il serait en équilibre : la composante verticale sur la calotte est donc la poussée d'Archimède de ce demi-volume, \(\mu g\,\tfrac23\pi R^3 \approx 164\ \text{N}\), négligeable devant \(F\).</p>
  </div>
</div>
