<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie B « Géométrie de l'espace » de la section « Géométrie du plan et de l'espace » du programme de PTSI (second semestre). Il prolonge le chapitre Géométrie du plan : même démarche, avec un outil nouveau, le produit vectoriel, et un produit mixte de trois vecteurs. Ces outils sont réinvestis partout ensuite : en physique et en sciences industrielles (moments, torseurs, force de Lorentz, champs), et en 2ᵉ année dans les chapitres Courbes et surfaces de l'espace (nappes paramétrées, plans tangents) et Isométries vectorielles (rotations d'axe quelconque).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Modes de repérage</strong> : coordonnées cartésiennes, coordonnées cylindriques (§1).</li>
        <li><strong>Produit scalaire</strong> : norme euclidienne dans \(\mathbb R^3\) ; définition géométrique, bilinéarité, symétrie, expression dans une base orthonormée (§2).</li>
        <li><strong>Produit vectoriel</strong> dans l'espace orienté : définition géométrique (l'orientation, reposant sur les conventions physiques usuelles, est admise), bilinéarité, antisymétrie, expression dans une base orthonormée directe, interprétation de \(\|\vec u\wedge\vec v\|\) comme aire du parallélogramme, condition de colinéarité (§3).</li>
        <li><strong>Produit mixte</strong> : définition \([\vec u,\vec v,\vec w]=(\vec u\wedge\vec v)\cdot\vec w\), trilinéarité, antisymétrie, expression dans une base orthonormée directe, volume orienté du parallélépipède, condition de coplanarité (§4).</li>
        <li><strong>Plans</strong> : définition par un point et deux vecteurs non colinéaires, par un point et un vecteur normal, par trois points non alignés ; notation \(A+\operatorname{Vect}(\vec u,\vec v)\) ; représentation paramétrique et équation cartésienne ; régionnement de l'espace ; exemples d'intersections de plusieurs plans (§5).</li>
        <li><strong>Droites</strong> : définition par un point et un vecteur directeur, par deux points distincts, comme intersection de deux plans ; représentation paramétrique et système d'équations cartésiennes ; exemples de problèmes d'intersection (§6).</li>
        <li><strong>Projeté orthogonal</strong> d'un point sur une droite ou un plan ; application aux calculs de distances (§7). La distance de deux droites et leur perpendiculaire commune (§8) en sont l'application classique, que le programme ne cite pas nommément.</li>
        <li><strong>Sphères</strong> : équation cartésienne en repère orthonormé, exemples de problèmes d'intersection (§9).</li>
      </ul>
      <p>Les démonstrations des propriétés algébriques des produits scalaire, vectoriel et mixte sont hors programme. Hors programme en PTSI : le double produit vectoriel (donné en remarque au §3) ; les cylindres et cônes de révolution et les matrices de rotation d'axe un axe du repère (§10, vus en 2ᵉ année) ; en fin de chapitre, à titre culturel, les cylindres et cônes d'axe quelconque et les coordonnées sphériques. Le moment d'une force (§3) est une application, au programme de physique et de sciences industrielles.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · REPÈRES ET COORDONNÉES</div>
  <h2>Repérer un point de l'espace</h2>
  <div class="intro">Tous les calculs du chapitre se font dans un repère orthonormé direct. Les coordonnées cartésiennes conviennent aux plans et aux droites ; les coordonnées cylindriques, aux objets qui ont un axe de symétrie (cylindres, cônes, surfaces de révolution), d'où leur omniprésence en physique.</div>

  <div class="def-box">
    Un <strong>repère orthonormé</strong> \(\mathcal R=(O;\vec\imath,\vec\jmath,\vec k)\) est formé d'un point \(O\) et d'une base orthonormée \((\vec\imath,\vec\jmath,\vec k)\). Il est <strong>direct</strong> si la base est orientée selon la règle de la main droite (pouce, index, majeur selon \(\vec\imath\), \(\vec\jmath\), \(\vec k\)) ; cette convention physique est admise. Les <strong>coordonnées</strong> \((x,y,z)\) de \(M\) sont définies par \(\overrightarrow{OM}=x\,\vec\imath+y\,\vec\jmath+z\,\vec k\), et l'on a \(\overrightarrow{AB}=(x_B-x_A,\ y_B-y_A,\ z_B-z_A)\).
  </div>
  <p>On écrit \(B=A+\vec u\) pour \(\overrightarrow{AB}=\vec u\), et \(A+\operatorname{Vect}(\vec u)\), \(A+\operatorname{Vect}(\vec u,\vec v)\) pour la droite et le plan passant par \(A\) dirigés par \(\vec u\), ou par \(\vec u\) et \(\vec v\).</p>

  <h3>Coordonnées cylindriques</h3>
  <div class="def-box">
    Soit \(M(x,y,z)\) et \(m(x,y,0)\) son projeté orthogonal sur le plan \((xOy)\). Des <strong>coordonnées cylindriques</strong> de \(M\) sont des réels \((r,\theta,z)\) tels que \((r,\theta)\) soient des coordonnées polaires de \(m\) dans le plan \((xOy)\) (chapitre Géométrie du plan, §1) :
    <div class="formula" data-nom="Coordonnées cylindriques">$$x=r\cos\theta,\qquad y=r\sin\theta,\qquad z=z .$$</div>
    Avec \(r\geqslant0\), \(r=\sqrt{x^2+y^2}\) est la distance de \(M\) à l'axe \((Oz)\), et \(\theta\) est défini à \(2\pi\) près lorsque \(M\notin(Oz)\).
  </div>
  <p>On associe à \(M\) hors de l'axe la base orthonormée directe \((\vec e_r,\vec e_\theta,\vec e_z)\), avec \(\vec e_r=\cos\theta\,\vec\imath+\sin\theta\,\vec\jmath\), \(\vec e_\theta=-\sin\theta\,\vec\imath+\cos\theta\,\vec\jmath\), \(\vec e_z=\vec k\) ; alors \(\overrightarrow{OM}=r\,\vec e_r+z\,\vec e_z\). C'est la base locale de la cinématique et de l'électromagnétisme.</p>

      <li>La surface d'équation \(x^2+y^2=4x\) : en cylindriques, \(r^2=4r\cos\theta\), soit \(r=0\) ou \(r=4\cos\theta\). Comme \(z\) n'apparaît pas, c'est un cylindre dont les génératrices sont parallèles à \((Oz)\).</li>
      <li>En cartésiennes, \(x^2-4x+y^2=0\) s'écrit \((x-2)^2+y^2=4\) : cylindre de révolution d'axe la droite \(x=2,\ y=0\), de rayon 2 (§10). L'équation \(r=4\cos\theta\) en est la section par le plan \((xOy)\), un cercle passant par \(O\).</li>
    </ol>

</div>

<div class="course-section">
  <div class="sec-num">§2 · PRODUIT SCALAIRE</div>
  <h2>Mesurer longueurs et angles</h2>
  <div class="intro">Le produit scalaire mesure à la fois les longueurs, les angles et les projections. Il sert à écrire l'équation d'un plan (vecteur normal), à calculer distances et angles, et, en physique, le travail d'une force ou le flux d'un champ.</div>

  <div class="def-box">
    Si \(\vec u\) et \(\vec v\) sont non nuls, leur <strong>produit scalaire</strong> est \(\vec u\cdot\vec v=\|\vec u\|\,\|\vec v\|\cos\theta\), où \(\theta\in[0,\pi]\) est l'angle géométrique entre \(\vec u\) et \(\vec v\) ; si l'un est nul, \(\vec u\cdot\vec v=0\). Interprétation : si \(\vec u\neq\vec0\), \(\vec u\cdot\vec v=\|\vec u\|\times\overline{p}\), où \(\overline{p}\) est la mesure algébrique du projeté orthogonal de \(\vec v\) sur la droite dirigée par \(\vec u\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> Le produit scalaire est bilinéaire et symétrique, et \(\vec u\cdot\vec u=\|\vec u\|^2\). Dans une base <strong>orthonormée</strong>, si \(\vec u=(x,y,z)\) et \(\vec v=(x',y',z')\) :
    <div class="formula" data-nom="Produit scalaire en base orthonormée">$$\vec u\cdot\vec v=xx'+yy'+zz',\qquad \|\vec u\|=\sqrt{x^2+y^2+z^2} .$$</div>
    <ul>
      <li>\(\vec u\) et \(\vec v\) sont <strong>orthogonaux</strong> si et seulement si \(\vec u\cdot\vec v=0\).</li>
      <li>\(\|\vec u+\vec v\|^2=\|\vec u\|^2+\|\vec v\|^2+2\,\vec u\cdot\vec v\), d'où la formule de polarisation \(\vec u\cdot\vec v=\frac12\big(\|\vec u+\vec v\|^2-\|\vec u\|^2-\|\vec v\|^2\big)\).</li>
      <li>Inégalité de Cauchy-Schwarz : \(|\vec u\cdot\vec v|\leqslant\|\vec u\|\,\|\vec v\|\) (car \(|\cos\theta|\leqslant1\)), avec égalité si et seulement si \(\vec u\) et \(\vec v\) sont colinéaires. On en déduit l'<strong>inégalité triangulaire</strong> \(\|\vec u+\vec v\|\leqslant\|\vec u\|+\|\vec v\|\), en développant \(\|\vec u+\vec v\|^2\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Projection orthogonale sur une direction.</strong> Pour \(\vec u\neq\vec0\), tout vecteur \(\vec w\) se décompose de façon unique en \(\vec w=\lambda\vec u+\vec w_\perp\) avec \(\vec w_\perp\perp\vec u\), et
    <div class="formula" data-nom="Projeté orthogonal sur une droite vectorielle">$$\lambda\,\vec u=\frac{\vec w\cdot\vec u}{\|\vec u\|^2}\,\vec u .$$</div>
    En effet, comme \(\vec w_\perp\cdot\vec u=0\), on a \(\vec w\cdot\vec u=\lambda\|\vec u\|^2\).
  </div>
  <div class="method-box">
    <strong>Exemple — angle et décomposition</strong>
    <p>Soit \(\vec u=(1,2,2)\), \(\vec v=(2,-1,2)\) et \(\vec w=(3,1,2)\).</p>
    <ol>
      <li>\(\vec u\cdot\vec v=2-2+4=4\) et \(\|\vec u\|=\|\vec v\|=3\), donc \(\cos\theta=\frac49\) et \(\theta\approx63{,}6^\circ\).</li>
      <li>Projection de \(\vec w\) sur la direction de \(\vec u\) : \(\frac{\vec w\cdot\vec u}{\|\vec u\|^2}=\frac{3+2+4}{9}=1\), d'où \(\vec w=(1,2,2)+(2,-1,0)\).</li>
      <li>Contrôle : \((2,-1,0)\cdot(1,2,2)=2-2+0=0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(xx'+yy'+zz'\) avec des coordonnées dans une base qui n'est pas orthonormée. Cette formule, comme \(\|\vec u\|=\sqrt{x^2+y^2+z^2}\), n'est valable qu'en base orthonormée.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PRODUIT VECTORIEL</div>
  <h2>Un vecteur orthogonal à deux autres</h2>
  <div class="intro">Le produit vectoriel fabrique, à partir de deux vecteurs, un vecteur qui leur est orthogonal et dont la norme mesure une aire. C'est l'outil des vecteurs normaux en géométrie, et des moments, de la force de Lorentz et du champ des vitesses d'un solide en physique et en mécanique.</div>

  <div class="def-box">
    Soit \(\vec u\) et \(\vec v\) deux vecteurs de l'espace orienté. S'ils ne sont pas colinéaires, leur <strong>produit vectoriel</strong> \(\vec u\wedge\vec v\) est l'unique vecteur \(\vec n\) tel que :
    <ul>
      <li>\(\vec n\) est orthogonal à \(\vec u\) et à \(\vec v\) ;</li>
      <li>\(\|\vec n\|=\|\vec u\|\,\|\vec v\|\,\sin\theta\), où \(\theta\in\,]0,\pi[\) est l'angle géométrique entre \(\vec u\) et \(\vec v\) ;</li>
      <li>la base \((\vec u,\vec v,\vec n)\) est directe.</li>
    </ul>
    S'ils sont colinéaires, \(\vec u\wedge\vec v=\vec0\).
  </div>

  <div class="prop-box">
    <strong>Propriétés (démonstrations hors programme).</strong>
    <ul>
      <li>Bilinéarité ; <strong>antisymétrie</strong> : \(\vec v\wedge\vec u=-\vec u\wedge\vec v\), en particulier \(\vec u\wedge\vec u=\vec0\).</li>
      <li>\(\vec u\wedge\vec v=\vec0\) si et seulement si \(\vec u\) et \(\vec v\) sont <strong>colinéaires</strong>.</li>
      <li>\(\|\vec u\wedge\vec v\|\) est l'<strong>aire du parallélogramme</strong> construit sur \(\vec u\) et \(\vec v\) ; l'aire du triangle \(ABC\) vaut \(\frac12\|\overrightarrow{AB}\wedge\overrightarrow{AC}\|\).</li>
      <li>Pour la base orthonormée directe : \(\vec\imath\wedge\vec\jmath=\vec k\), \(\vec\jmath\wedge\vec k=\vec\imath\), \(\vec k\wedge\vec\imath=\vec\jmath\) (permutation circulaire).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Expression dans une base orthonormée directe.</strong> Si \(\vec u=(x,y,z)\) et \(\vec v=(x',y',z')\) :
    <div class="formula" data-nom="Produit vectoriel en base orthonormée directe">$$\vec u\wedge\vec v=\big(\,yz'-zy',\ \ zx'-xz',\ \ xy'-yx'\,\big) .$$</div>
    Moyen mnémotechnique : la première coordonnée est le déterminant \(\begin{vmatrix} y & y'\\ z & z'\end{vmatrix}\) obtenu en masquant la première ligne, puis on continue par permutation circulaire \(x\to y\to z\to x\).
  </div>
  <div class="method-box">
    <strong>Exemple — produit vectoriel, aire et vecteur normal</strong>
    <ol>
      <li>\(\vec u=(1,2,2)\), \(\vec v=(2,-1,2)\) : \(\vec u\wedge\vec v=(4+2,\ 4-2,\ -1-4)=(6,2,-5)\).</li>
      <li>Contrôles : \((6,2,-5)\cdot\vec u=6+4-10=0\) et \((6,2,-5)\cdot\vec v=12-2-10=0\).</li>
      <li>Triangle \(A(1,0,0)\), \(B(0,2,0)\), \(C(0,0,2)\) : \(\overrightarrow{AB}=(-1,2,0)\), \(\overrightarrow{AC}=(-1,0,2)\) et \(\overrightarrow{AB}\wedge\overrightarrow{AC}=(4,2,2)\), de norme \(2\sqrt6\). Aire du triangle : \(\sqrt6\).</li>
      <li>Le vecteur \((4,2,2)\), ou \((2,1,1)\), est normal au plan \((ABC)\), d'équation \(2x+y+z=2\) (§5).</li>
    </ol>
  </div>
  <h3>Deux identités utiles (remarques)</h3>
  <div class="formula" data-nom="Identité de Lagrange">$$\|\vec u\wedge\vec v\|^2+(\vec u\cdot\vec v)^2=\|\vec u\|^2\,\|\vec v\|^2$$</div>
  <p>Elle découle de \(\sin^2\theta+\cos^2\theta=1\) ; sur l'exemple, \(65+16=81=9\times9\). Le <strong>double produit vectoriel</strong> se développe par la formule (hors programme en PTSI, à savoir retrouver)</p>
  <div class="formula" data-nom="Double produit vectoriel">$$\vec a\wedge(\vec b\wedge\vec c)=(\vec a\cdot\vec c)\,\vec b-(\vec a\cdot\vec b)\,\vec c .$$</div>
  <p>Par exemple, avec \(\vec a=(1,0,2)\), \(\vec b=(0,1,1)\), \(\vec c=(1,1,0)\) : \(\vec a\wedge(\vec b\wedge\vec c)=(-2,-1,1)\), alors que \((\vec a\wedge\vec b)\wedge\vec c=(-1,1,-1)\).</p>
  <div class="notice"><strong>Erreur classique</strong> : le produit vectoriel n'est <strong>pas associatif</strong> (exemple ci-dessus) et n'est pas commutatif : l'ordre des facteurs change le signe. On ne peut pas non plus « simplifier » : \(\vec u\wedge\vec v=\vec u\wedge\vec w\) signifie seulement que \(\vec v-\vec w\) est colinéaire à \(\vec u\).</div>

  <h3>Application : moment d'une force</h3>
  <p>En physique et en sciences industrielles, le produit vectoriel mesure l'effet de rotation d'une force. Le <strong>moment</strong> au point \(O\) de la force \(\vec F\) appliquée en \(P\) est le vecteur</p>
  <div class="formula" data-nom="Moment d'une force">$$\vec{\mathcal M}_O(\vec F)=\overrightarrow{OP}\wedge\vec F .$$</div>
  <p>Sa norme vaut \(F\,d\), où \(d=OP\,|\sin\theta|\) est le <strong>bras de levier</strong>, distance de \(O\) à la droite d'action \(P+\operatorname{Vect}(\vec F)\) (§7). Il ne dépend pas du choix de \(P\) sur cette droite, puisque \(\vec F\wedge\vec F=\vec 0\) : remplacer \(\overrightarrow{OP}\) par \(\overrightarrow{OP}+\lambda\vec F\) ne change pas le produit. En changeant de point, la relation de Chasles \(\overrightarrow{O'P}=\overrightarrow{O'O}+\overrightarrow{OP}\) donne la <strong>formule de transport</strong> :</p>
  <div class="formula" data-nom="Transport du moment">$$\vec{\mathcal M}_{O'}(\vec F)=\vec{\mathcal M}_O(\vec F)+\overrightarrow{O'O}\wedge\vec F .$$</div>
  <div class="method-box">
    <strong>Exemple — moment et transport</strong>
    <ol>
      <li>\(\vec F=(2,0,-4)\) (en N) appliquée en \(P(1,2,0)\) (en m) : \(\vec{\mathcal M}_O=(1,2,0)\wedge(2,0,-4)\), soit \((-8,4,-4)\ \text{N·m}\).</li>
      <li>Bras de levier : \(d=\frac{\|\vec{\mathcal M}_O\|}{\|\vec F\|}=\frac{\sqrt{96}}{\sqrt{20}}\), soit \(\sqrt{4{,}8}\approx2{,}19\ \text{m}\).</li>
      <li>Transport en \(O'(1,0,0)\) : \(\overrightarrow{O'O}\wedge\vec F=(-1,0,0)\wedge(2,0,-4)\), soit \((0,-4,0)\), d'où \(\vec{\mathcal M}_{O'}=(-8,0,-4)\). Contrôle direct : \(\overrightarrow{O'P}\wedge\vec F=(0,2,0)\wedge(2,0,-4)\), qui vaut bien \((-8,0,-4)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\overrightarrow{OO'}\wedge\vec F\) dans la formule de transport, ce qui change le signe du terme correctif. Le vecteur va du <em>nouveau</em> point vers l'<em>ancien</em> ; en cas de doute, refaire le calcul par Chasles.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PRODUIT MIXTE</div>
  <h2>Volume orienté et coplanarité</h2>
  <div class="intro">Le produit mixte de trois vecteurs est un nombre : au signe près, c'est le volume du parallélépipède qu'ils engendrent. Il est nul exactement quand les trois vecteurs sont coplanaires, ce qui en fait le test de référence pour les problèmes d'incidence.</div>

  <div class="def-box">
    Le <strong>produit mixte</strong> de trois vecteurs est le réel \([\vec u,\vec v,\vec w]=(\vec u\wedge\vec v)\cdot\vec w\).
  </div>
  <div class="prop-box">
    <strong>Propriétés (démonstrations hors programme).</strong>
    <ul>
      <li>Trilinéarité ; <strong>antisymétrie</strong> : échanger deux vecteurs change le signe ; le produit mixte est invariant par permutation circulaire, \([\vec u,\vec v,\vec w]=[\vec v,\vec w,\vec u]=[\vec w,\vec u,\vec v]\).</li>
      <li>Dans une base orthonormée directe, c'est le déterminant des coordonnées :
        <div class="formula" data-nom="Produit mixte et déterminant">$$[\vec u,\vec v,\vec w]=\begin{vmatrix} x & x' & x''\\ y & y' & y''\\ z & z' & z''\end{vmatrix} .$$</div></li>
      <li>\(|[\vec u,\vec v,\vec w]|\) est le <strong>volume du parallélépipède</strong> construit sur \(\vec u,\vec v,\vec w\) ; le signe indique l'orientation : \([\vec u,\vec v,\vec w]\gt0\) si et seulement si \((\vec u,\vec v,\vec w)\) est une base directe.</li>
      <li>\(\vec u,\vec v,\vec w\) sont <strong>coplanaires</strong> si et seulement si \([\vec u,\vec v,\vec w]=0\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Interprétation</span>
    <span class="prompt">Pourquoi le produit mixte est-il un volume ?</span>
    <div class="content"><p>Si \(\vec u\) et \(\vec v\) ne sont pas colinéaires, la base du parallélépipède a pour aire \(\|\vec u\wedge\vec v\|\), et \(\vec n=\frac{\vec u\wedge\vec v}{\|\vec u\wedge\vec v\|}\) est unitaire et normal à cette base. La hauteur est la distance de l'extrémité de \(\vec w\) au plan de base, c'est-à-dire \(h=|\vec w\cdot\vec n|\). Donc</p>
      <div class="formula">$$\text{aire}\times h=\|\vec u\wedge\vec v\|\,|\vec w\cdot\vec n|=|(\vec u\wedge\vec v)\cdot\vec w| .$$</div>
      <p>Ce volume est nul si et seulement si \(\vec w\) est dans le plan de \(\vec u\) et \(\vec v\), d'où le critère de coplanarité.</p></div>
  </div>

  <div class="formula" data-nom="Volume d'un tétraèdre">$$\mathcal V(ABCD)=\frac16\,\Big|\big[\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}\big]\Big|$$</div>

    <strong>Exemple — volume d'un tétraèdre et test de coplanarité</strong>
    <p>\(A(1,0,1)\), \(B(2,1,0)\), \(C(0,1,3)\), \(D(2,3,2)\) et \(E(4,1,-3)\).</p>
    <ol>
      <li>\(\overrightarrow{AB}=(1,1,-1)\), \(\overrightarrow{AC}=(-1,1,2)\), \(\overrightarrow{AD}=(1,3,1)\).</li>
      <li>Le déterminant des trois colonnes vaut
        <div class="formula">$$\big[\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}\big]=\begin{vmatrix} 1 & -1 & 1\\ 1 & 1 & 3\\ -1 & 2 & 1\end{vmatrix}=2 :$$</div>
        le tétraèdre \(ABCD\) a pour volume \(\frac26=\frac13\), et \(\big(\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}\big)\) est une base directe.</li>
      <li>\(\overrightarrow{AE}=(3,1,-4)\) et \(\big[\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AE}\big]=0\) : les points \(A,B,C,E\) sont coplanaires. De fait, \(\overrightarrow{AE}=2\,\overrightarrow{AB}-\overrightarrow{AC}\).</li>
    </ol>
  </div>

</div>

<div class="course-section">
  <div class="sec-num">§5 · PLANS</div>
  <h2>Représentations paramétrique et cartésienne d'un plan</h2>
  <div class="intro">Un plan se donne par un point et deux directions, par un point et une normale, ou par trois points. Les deux premières données conduisent aux deux représentations, paramétrique et cartésienne ; savoir passer de l'une à l'autre est le geste de base.</div>

  <div class="prop-box">
    <strong>Représentation paramétrique.</strong> Le plan \(\mathcal P=A+\operatorname{Vect}(\vec u,\vec v)\), où \(\vec u\) et \(\vec v\) ne sont pas colinéaires, est l'ensemble des points
    <div class="formula">$$M=A+s\,\vec u+t\,\vec v,\qquad (s,t)\in\mathbb{R}^2 .$$</div>
    <strong>Équation cartésienne.</strong> Un plan est l'ensemble des points vérifiant une équation \(ax+by+cz+d=0\) avec \((a,b,c)\neq(0,0,0)\), et \(\vec n=(a,b,c)\) est un <strong>vecteur normal</strong> au plan. Réciproquement, le plan passant par \(A\) et de vecteur normal \(\vec n\neq\vec0\) est
    <div class="formula" data-nom="Plan par un point et un vecteur normal">$$M\in\mathcal P\iff\overrightarrow{AM}\cdot\vec n=0\iff a(x-x_A)+b(y-y_A)+c(z-z_A)=0 .$$</div>
  </div>
  <div class="method-box">
    <strong>Méthode — passer d'une représentation à l'autre</strong>
    <ol>
      <li><strong>Paramétrique → cartésienne</strong> : un vecteur normal est \(\vec n=\vec u\wedge\vec v\) ; on écrit \(\overrightarrow{AM}\cdot\vec n=0\). Variante : \(\big[\overrightarrow{AM},\vec u,\vec v\big]=0\), ou élimination de \(s\) et \(t\).</li>
      <li><strong>Trois points</strong> \(A,B,C\) non alignés : \(\vec n=\overrightarrow{AB}\wedge\overrightarrow{AC}\).</li>
      <li><strong>Cartésienne → paramétrique</strong> : on exprime une coordonnée en fonction des deux autres, qui jouent le rôle des paramètres.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le plan passant par \(A(1,0,2)\), dirigé par \(\vec u=(1,1,0)\) et \(\vec v=(0,1,-1)\)</strong>
    <ol>
      <li>Vecteur normal : \(\vec n=\vec u\wedge\vec v=(-1,1,1)\).</li>
      <li>\(-(x-1)+y+(z-2)=0\), soit \(x-y-z+1=0\). Contrôle : \(A\) vérifie \(1-0-2+1=0\).</li>
      <li>Retour au paramétrique : \(x=-1+y+z\), donc \(M=(-1,0,0)+y\,(1,1,0)+z\,(1,0,1)\) avec \(y,z\in\mathbb{R}\) : même plan, autre paramétrage.</li>
    </ol>
  </div>

  <h3>Positions relatives, angles, régionnement</h3>
  <ul>
    <li>Deux plans de vecteurs normaux \(\vec n\) et \(\vec n'\) sont <strong>parallèles</strong> si \(\vec n\wedge\vec n'=\vec0\) (confondus ou disjoints) ; sinon, ils sont <strong>sécants</strong> selon une droite dirigée par \(\vec n\wedge\vec n'\) (§6). Ils sont perpendiculaires si \(\vec n\cdot\vec n'=0\) : par exemple \(x-y-z+1=0\) et \(2x+y+z=2\).</li>
    <li>L'intersection de trois plans s'étudie comme un système linéaire de trois équations : un point (normales formant une base), une droite, un plan, ou l'ensemble vide.</li>
    <li><strong>Régionnement</strong> : le plan \(ax+by+cz+d=0\) partage l'espace en deux demi-espaces ouverts, \(ax+by+cz+d\gt0\), du côté vers lequel pointe \(\vec n\), et \(ax+by+cz+d\lt0\). Ainsi \(P(0,0,0)\) et \(Q(1,2,3)\) donnent \(1\) et \(-3\) dans \(x-y-z+1\) : ils sont de part et d'autre de ce plan.</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : prendre \((a,b,c)\) pour un vecteur directeur du plan ; c'est un vecteur <strong>normal</strong>. Et un plan a une infinité d'équations, toutes proportionnelles : pour comparer deux plans, on compare les normales, puis on teste un point.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DROITES</div>
  <h2>Droites de l'espace et intersections</h2>
  <div class="intro">Dans l'espace, une seule équation cartésienne définit un plan : une droite demande deux équations, ou un paramètre. On passe de l'une à l'autre description, et on étudie les positions relatives d'une droite et d'un plan, puis de deux droites.</div>

  <div class="prop-box">
    <strong>Représentations.</strong> La droite \(\mathcal D=A+\operatorname{Vect}(\vec u)\), avec \(\vec u\neq\vec0\), admet la représentation paramétrique \(M=A+t\,\vec u\), \(t\in\mathbb{R}\). Par deux points distincts \(A\) et \(B\), on prend \(\vec u=\overrightarrow{AB}\). Toute droite est aussi l'intersection de deux plans non parallèles :
    <div class="formula">$$\mathcal D : \begin{cases} ax+by+cz+d=0\\ a'x+b'y+c'z+d'=0\end{cases}$$</div>
    dirigée par \(\vec n\wedge\vec n'\), où \(\vec n=(a,b,c)\) et \(\vec n'=(a',b',c')\). Un tel système n'est pas unique : toute paire de plans distincts contenant \(\mathcal D\) convient.
  </div>
  <div class="method-box">
    <strong>Exemple — de deux équations à un paramétrage</strong>
    <p>\(\mathcal D : x+y+z=3\) et \(x-y+2z=1\).</p>
    <ol>
      <li>Direction : \((1,1,1)\wedge(1,-1,2)=(3,-1,-2)\).</li>
      <li>Un point : avec \(z=0\), \(x+y=3\) et \(x-y=1\) donnent \(x=2\), \(y=1\), d'où \(A(2,1,0)\).</li>
      <li>\(\mathcal D : M=(2,1,0)+t\,(3,-1,-2)\). Contrôle : \((2+3t)+(1-t)+(-2t)=3\) et \((2+3t)-(1-t)+2(-2t)=1\) pour tout \(t\).</li>
    </ol>
  </div>
  <h3>Positions relatives</h3>
  <ul>
    <li><strong>Droite et plan</strong> : \(\mathcal D=A+\operatorname{Vect}(\vec u)\) et \(\mathcal P\) de normale \(\vec n\). Si \(\vec u\cdot\vec n\neq0\), ils se coupent en un point unique ; si \(\vec u\cdot\vec n=0\), \(\mathcal D\) est parallèle à \(\mathcal P\), contenue dans \(\mathcal P\) si \(A\in\mathcal P\), disjointe sinon. En pratique, on reporte le paramétrage de \(\mathcal D\) dans l'équation de \(\mathcal P\).</li>
    <li><strong>Deux droites</strong> \(\mathcal D_1=A+\operatorname{Vect}(\vec u)\), \(\mathcal D_2=B+\operatorname{Vect}(\vec v)\) : parallèles si \(\vec u\wedge\vec v=\vec0\) ; sinon, elles sont <strong>coplanaires</strong> (donc sécantes) si et seulement si \(\big[\overrightarrow{AB},\vec u,\vec v\big]=0\), et <strong>non coplanaires</strong> dans le cas contraire (§8).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — intersection d'une droite et d'un plan</strong>
    <ol>
      <li>\(\mathcal D : M=(1,2,0)+t\,(1,-1,2)\) et \(\mathcal P : 2x+y-z=1\). Comme \((1,-1,2)\cdot(2,1,-1)=-1\neq0\), ils sont sécants.</li>
      <li>En reportant : \(2(1+t)+(2-t)-2t=1\), soit \(4-t=1\), d'où \(t=3\).</li>
      <li>Point d'intersection : \((4,-1,6)\). Contrôle : \(8-1-6=1\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire « la droite \(y=2x+1\) » dans l'espace. L'équation \(y=2x+1\) y définit un <strong>plan</strong>, parallèle à \((Oz)\) ; il faut une seconde équation, par exemple \(z=0\), pour obtenir une droite.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · PROJETÉS ORTHOGONAUX ET DISTANCES</div>
  <h2>Distance d'un point à un plan, à une droite</h2>
  <div class="intro">La distance d'un point à un plan ou à une droite est atteinte au projeté orthogonal du point. Le produit scalaire donne la première, le produit vectoriel la seconde, chacune par une formule directe.</div>

  <div class="prop-box">
    <strong>Distance à un plan.</strong> Soit \(\mathcal P : ax+by+cz+d=0\), de vecteur normal \(\vec n=(a,b,c)\), et \(M_0(x_0,y_0,z_0)\). Le projeté orthogonal \(H\) de \(M_0\) sur \(\mathcal P\) est le seul point de \(\mathcal P\) tel que \(\overrightarrow{HM_0}\) soit colinéaire à \(\vec n\), et
    <div class="formula" data-nom="Distance d'un point à un plan">$$d(M_0,\mathcal P)=M_0H=\frac{|ax_0+by_0+cz_0+d|}{\sqrt{a^2+b^2+c^2}} .$$</div>
    C'est la plus petite distance de \(M_0\) à un point de \(\mathcal P\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Projeter \(\overrightarrow{AM_0}\) sur la normale.</span>
    <div class="content"><p>Cherchons \(H=M_0-\lambda\vec n\) dans \(\mathcal P\) ; la condition</p>
      <div class="formula">$$a(x_0-\lambda a)+b(y_0-\lambda b)+c(z_0-\lambda c)+d=0$$</div>
      <p>donne \(\lambda=\frac{ax_0+by_0+cz_0+d}{\|\vec n\|^2}\), d'où \(M_0H=|\lambda|\,\|\vec n\|\), qui est la formule annoncée. Pour tout point \(A\) de \(\mathcal P\), le triangle \(AHM_0\) est rectangle en \(H\), donc \(M_0A^2=M_0H^2+HA^2\geqslant M_0H^2\) : \(H\) réalise la distance minimale. On note aussi que \(M_0H=\frac{|\overrightarrow{AM_0}\cdot\vec n|}{\|\vec n\|}\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Distance à une droite.</strong> Soit \(\mathcal D=A+\operatorname{Vect}(\vec u)\). Le projeté orthogonal de \(M_0\) sur \(\mathcal D\) est \(H=A+\dfrac{\overrightarrow{AM_0}\cdot\vec u}{\|\vec u\|^2}\,\vec u\), et
    <div class="formula" data-nom="Distance d'un point à une droite">$$d(M_0,\mathcal D)=M_0H=\frac{\big\|\overrightarrow{AM_0}\wedge\vec u\big\|}{\|\vec u\|} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une aire divisée par une base.</span>
    <div class="content"><p>L'expression de \(H\) vient du §2 (projection de \(\overrightarrow{AM_0}\) sur la direction \(\vec u\)). Le parallélogramme construit sur \(\vec u\) et \(\overrightarrow{AM_0}\) a pour aire \(\big\|\overrightarrow{AM_0}\wedge\vec u\big\|\) ; c'est aussi sa base \(\|\vec u\|\) multipliée par sa hauteur, qui est la distance \(M_0H\) de \(M_0\) à la droite. Comme pour le plan, Pythagore montre que \(H\) est le point de \(\mathcal D\) le plus proche de \(M_0\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — distance et projeté, plan puis droite</strong>
    <ol>
      <li>\(M_0(2,3,1)\) et \(\mathcal P : x+2y+2z-1=0\) : \(d=\frac{|2+6+2-1|}{\sqrt{1+4+4}}=\frac93=3\).</li>
      <li>Projeté : \(\lambda=\frac{9}{9}=1\), donc \(H=M_0-\vec n=(1,1,-1)\). Contrôle : \(1+2-2-1=0\) et \(M_0H=\|(1,2,2)\|=3\).</li>
      <li>\(M_0'(1,2,3)\) et \(\mathcal D=A+\operatorname{Vect}(\vec u)\) avec \(A(0,0,1)\), \(\vec u=(1,1,0)\) : \(\overrightarrow{AM_0'}=(1,2,2)\) et \(\overrightarrow{AM_0'}\wedge\vec u=(-2,2,-1)\), de norme 3 ; donc \(d=\frac{3}{\sqrt2}\).</li>
      <li>Projeté : \(\frac{\overrightarrow{AM_0'}\cdot\vec u}{\|\vec u\|^2}=\frac32\), \(H=\big(\frac32,\frac32,1\big)\), et \(\overrightarrow{HM_0'}=\big(-\frac12,\frac12,2\big)\), de norme \(\sqrt{\frac92}=\frac{3}{\sqrt2}\).</li>
    </ol>
  </div>
  <p><strong>Symétrique d'un point.</strong> Le symétrique de \(M_0\) par rapport au plan \(\mathcal P\) (ou à la droite \(\mathcal D\)) est \(M_0'=2H-M_0\), c'est-à-dire le point tel que \(H\) soit le milieu de \([M_0M_0']\). Dans le premier exemple : \((0,-1,-3)\).</p>
  <div class="notice"><strong>Erreur classique</strong> : oublier de diviser par \(\|\vec n\|=\sqrt{a^2+b^2+c^2}\) (inutile seulement si \(\vec n\) est unitaire), ou appliquer la formule du plan à une droite de l'espace, qui n'a pas d'équation cartésienne unique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DISTANCE DE DEUX DROITES</div>
  <h2>La perpendiculaire commune</h2>
  <div class="intro">Deux droites non parallèles de l'espace sont en général non coplanaires : elles ne se coupent pas, mais elles ont une plus courte distance. Elle est réalisée sur une droite unique, perpendiculaire aux deux, qu'on sait construire. Le programme ne cite pas ce résultat nommément : c'est l'application classique des projetés et des distances du §7, fréquente aux concours.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(\mathcal D_1=A+\operatorname{Vect}(\vec u)\) et \(\mathcal D_2=B+\operatorname{Vect}(\vec v)\) deux droites <strong>non parallèles</strong>. Il existe une unique droite \(\Delta\), la <strong>perpendiculaire commune</strong>, qui coupe \(\mathcal D_1\) en \(H\) et \(\mathcal D_2\) en \(K\) en leur étant orthogonale. Elle est dirigée par \(\vec u\wedge\vec v\), et la distance \(HK\) est la plus petite distance entre un point de \(\mathcal D_1\) et un point de \(\mathcal D_2\) :
    <div class="formula" data-nom="Distance de deux droites">$$d(\mathcal D_1,\mathcal D_2)=HK=\frac{\Big|\big[\overrightarrow{AB},\vec u,\vec v\big]\Big|}{\|\vec u\wedge\vec v\|} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un système 2 × 2, puis Pythagore.</span>
    <div class="content">
      <p><strong>Existence et unicité.</strong> On cherche \(H=A+s\,\vec u\) et \(K=B+t\,\vec v\) tels que \(\overrightarrow{HK}\cdot\vec u=0\) et \(\overrightarrow{HK}\cdot\vec v=0\). Avec \(\overrightarrow{HK}=\overrightarrow{AB}+t\,\vec v-s\,\vec u\), on obtient le système linéaire</p>
      <div class="formula">$$\begin{cases} s\,\|\vec u\|^2-t\,(\vec u\cdot\vec v)=\overrightarrow{AB}\cdot\vec u\\ s\,(\vec u\cdot\vec v)-t\,\|\vec v\|^2=\overrightarrow{AB}\cdot\vec v\end{cases}$$</div>
      <p>dont le déterminant vaut \(-\|\vec u\wedge\vec v\|^2\neq0\) (identité de Lagrange ; droites non parallèles) : il a une unique solution.</p>
      <p><strong>Distance.</strong> \(\overrightarrow{HK}\), orthogonal à \(\vec u\) et à \(\vec v\), s'écrit \(\lambda\,(\vec u\wedge\vec v)\). Comme \(\overrightarrow{AB}=s\,\vec u+\lambda\,(\vec u\wedge\vec v)-t\,\vec v\), la trilinéarité et la permutation circulaire donnent</p>
      <div class="formula">$$\big[\overrightarrow{AB},\vec u,\vec v\big]=\lambda\,[\vec u\wedge\vec v,\vec u,\vec v]=\lambda\,\|\vec u\wedge\vec v\|^2 .$$</div>
      <p>D'où \(HK=|\lambda|\,\|\vec u\wedge\vec v\|\), qui est la formule annoncée.</p>
      <p><strong>Minimalité.</strong> Pour \(M\in\mathcal D_1\) et \(N\in\mathcal D_2\), le vecteur \(\overrightarrow{MN}\) est la somme de \(\overrightarrow{HK}\) et de \(\overrightarrow{MH}+\overrightarrow{KN}\), qui appartient à \(\operatorname{Vect}(\vec u,\vec v)\), donc est orthogonal à \(\overrightarrow{HK}\). Par Pythagore, \(MN^2\geqslant HK^2\).</p>
    </div>
  </div>

  <p>Géométriquement, \(HK\) est la distance entre les deux plans parallèles \(A+\operatorname{Vect}(\vec u,\vec v)\) et \(B+\operatorname{Vect}(\vec u,\vec v)\), qui contiennent respectivement \(\mathcal D_1\) et \(\mathcal D_2\). Pour des droites sécantes, produit mixte et distance sont nuls. Pour des droites parallèles, la formule ne s'applique pas : la distance est celle d'un point de \(\mathcal D_2\) à \(\mathcal D_1\) (§7).</p>
  <div class="method-box">
    <strong>Exemple — distance et perpendiculaire commune</strong>
    <p>\(\mathcal D_1 : M=(0,-1,0)+s\,(1,1,0)\) et \(\mathcal D_2 : N=(2,-3,-1)+t\,(0,1,1)\).</p>
    <ol>
      <li>\(\vec u\wedge\vec v=(1,1,0)\wedge(0,1,1)=(1,-1,1)\) : les droites ne sont pas parallèles. Avec \(\overrightarrow{AB}=(2,-2,-1)\), \(\big[\overrightarrow{AB},\vec u,\vec v\big]=2+2-1=3\neq0\) : elles sont non coplanaires.</li>
      <li>Distance : \(d=\frac{3}{\sqrt3}=\sqrt3\).</li>
      <li>\(\overrightarrow{HK}=(2-s,\ -2+t-s,\ -1+t)\). Les conditions \(\overrightarrow{HK}\cdot\vec u=t-2s=0\) et \(\overrightarrow{HK}\cdot\vec v=2t-s-3=0\) donnent \(s=1\) et \(t=2\).</li>
      <li>\(H(1,0,0)\), \(K(2,-1,1)\) et \(\overrightarrow{HK}=(1,-1,1)\), colinéaire à \(\vec u\wedge\vec v\), de norme \(\sqrt3\) : on retrouve la distance. La perpendiculaire commune est la droite \(H+\operatorname{Vect}\big((1,-1,1)\big)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour perpendiculaire commune n'importe quelle droite dirigée par \(\vec u\wedge\vec v\). Elle doit en plus <strong>rencontrer</strong> les deux droites : seule la résolution du système (ou l'intersection de \(\mathcal D_2\) avec le plan contenant \(\mathcal D_1\) et dirigé par \(\vec u\wedge\vec v\)) la détermine.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SPHÈRES</div>
  <h2>Équation d'une sphère, intersections</h2>
  <div class="intro">La sphère est l'analogue du cercle dans l'espace. Son équation se reconnaît en complétant des carrés, et son intersection avec un plan se lit sur la distance du centre au plan : c'est ainsi qu'on décrit un cercle de l'espace.</div>

  <div class="def-box">
    La <strong>sphère</strong> de centre \(\Omega(a,b,c)\) et de rayon \(R\gt0\) est l'ensemble des points \(M\) tels que \(\Omega M=R\) :
    <div class="formula" data-nom="Équation d'une sphère">$$(x-a)^2+(y-b)^2+(z-c)^2=R^2 .$$</div>
  </div>
  <p><strong>Reconnaître une sphère.</strong> Une équation \(x^2+y^2+z^2+\alpha x+\beta y+\gamma z+\delta=0\) se met sous la forme \((x-a)^2+(y-b)^2+(z-c)^2=k\) en complétant les carrés : c'est une sphère si \(k\gt0\), le seul point \(\Omega\) si \(k=0\), l'ensemble vide si \(k\lt0\). La sphère de diamètre \([AB]\) a pour équation \(\overrightarrow{MA}\cdot\overrightarrow{MB}=0\).</p>

  <div class="prop-box">
    <strong>Intersection d'une sphère et d'un plan.</strong> Soit \(\mathcal S\) de centre \(\Omega\) et de rayon \(R\), \(\mathcal P\) un plan, \(d=d(\Omega,\mathcal P)\) et \(H\) le projeté orthogonal de \(\Omega\) sur \(\mathcal P\).
    <ul>
      <li>Si \(d\lt R\) : \(\mathcal S\cap\mathcal P\) est le <strong>cercle</strong> de \(\mathcal P\) de centre \(H\) et de rayon \(r=\sqrt{R^2-d^2}\).</li>
      <li>Si \(d=R\) : \(\mathcal S\cap\mathcal P=\{H\}\) ; le plan est <strong>tangent</strong> à la sphère en \(H\), et orthogonal au rayon \(\Omega H\).</li>
      <li>Si \(d\gt R\) : l'intersection est vide.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pythagore dans le triangle \(\Omega HM\).</span>
    <div class="content"><p>Pour \(M\in\mathcal P\), le triangle \(\Omega HM\) est rectangle en \(H\), donc \(\Omega M^2=d^2+HM^2\). Ainsi \(M\in\mathcal S\) si et seulement si \(HM^2=R^2-d^2\), ce qui décrit, dans le plan \(\mathcal P\), un cercle de centre \(H\) si \(R^2-d^2\gt0\), le point \(H\) si \(R^2-d^2=0\), et rien sinon.</p></div>
  </div>

  <p><strong>Plan tangent en un point.</strong> Le plan tangent à \(\mathcal S\) en \(M_0\in\mathcal S\) est le plan passant par \(M_0\) et orthogonal à \(\overrightarrow{\Omega M_0}\) : \(\overrightarrow{M_0M}\cdot\overrightarrow{\Omega M_0}=0\). C'est le plan normal au gradient de \(F=\Omega M^2-R^2\) (2ᵉ année, chapitre Courbes et surfaces de l'espace). <strong>Droite et sphère</strong> : en reportant un paramétrage de la droite, on obtient une équation du second degré en \(t\), donc zéro, un (droite tangente) ou deux points d'intersection. <strong>Deux sphères</strong> de centres distincts : la différence de leurs équations est l'équation d'un plan, et leur intersection est celle de l'une d'elles avec ce plan.</p>

  <div class="method-box">
    <strong>Exemple — centre, rayon, cercle d'intersection, plan tangent</strong>
    <p>\(\mathcal S : x^2+y^2+z^2-2x+4y-6z+5=0\).</p>
    <ol>
      <li>En complétant les carrés : \((x-1)^2+(y+2)^2+(z-3)^2=1+4+9-5=9\). Sphère de centre \(\Omega(1,-2,3)\) et de rayon 3.</li>
      <li>Plan \(\mathcal P : x+2y+2z=0\) : \(d(\Omega,\mathcal P)=\frac{|1-4+6|}{3}=1\lt3\). L'intersection est un cercle de rayon \(\sqrt{9-1}=2\sqrt2\).</li>
      <li>Son centre est le projeté \(H=\Omega-\frac{3}{9}(1,2,2)=\big(\frac23,-\frac83,\frac73\big)\). Contrôle : \(\frac23-\frac{16}{3}+\frac{14}{3}=0\).</li>
      <li>Le point \(M_0(3,-1,5)\) est sur \(\mathcal S\) (\(4+1+4=9\)) ; avec \(\overrightarrow{\Omega M_0}=(2,1,2)\), le plan tangent en \(M_0\) est \(2(x-3)+(y+1)+2(z-5)=0\), soit \(2x+y+2z=15\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire « le cercle \(x^2+y^2=4\) » dans l'espace. Cette équation y définit un <strong>cylindre</strong> d'axe \((Oz)\) (§10) ; un cercle de l'espace se décrit par deux équations, par exemple \(x^2+y^2=4\) et \(z=0\), ou une sphère et un plan.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · CYLINDRES, CÔNES ET ROTATIONS</div>
  <h2>Surfaces de révolution usuelles et matrices de rotation</h2>
  <div class="intro">Cylindres et cônes de révolution sont les surfaces les plus courantes après les plans et les sphères (arbres, alésages, pièces coniques). Quand leur axe est un axe du repère, leur équation est immédiate, et les matrices de rotation autour des axes permettent de les faire tourner. Plans tangents et surfaces de révolution générales : chapitre Courbes et surfaces de l'espace.</div>
  <div class="notice"><strong>Hors programme en PTSI (vu en 2ᵉ année)</strong> : cylindres, cônes de révolution et matrices de rotation relèvent du programme de PT (chapitres Courbes et surfaces de l'espace et Isométries vectorielles). Ils sont donnés ici parce qu'ils prolongent directement les §7 et §9 ; en PTSI, seule la matrice d'une rotation vectorielle du plan est au programme (chapitre Applications linéaires).</div>

  <div class="def-box">
    Soit \(\Delta\) une droite. Le <strong>cylindre de révolution</strong> d'axe \(\Delta\) et de rayon \(R\gt0\) est l'ensemble des points dont la distance à \(\Delta\) vaut \(R\). Le <strong>cône de révolution</strong> de sommet \(S\in\Delta\), d'axe \(\Delta\) et de demi-angle \(\alpha\in\,]0,\frac\pi2[\) est la réunion des droites passant par \(S\) qui font l'angle \(\alpha\) avec \(\Delta\).
  </div>
  <div class="prop-box">
    <strong>Équations quand l'axe est \((Oz)\).</strong> La distance de \(M(x,y,z)\) à \((Oz)\) vaut \(\sqrt{x^2+y^2}=r\) (§1) :
    <div class="formula" data-nom="Cylindre et cône de révolution d'axe (Oz)">$$\begin{aligned}&\text{cylindre :} && x^2+y^2=R^2\\ &\text{cône de sommet } O : && x^2+y^2=z^2\tan^2\alpha\end{aligned}$$</div>
    En cylindriques : \(r=R\) et \(r=|z|\tan\alpha\). Pour un axe \((Ox)\) ou \((Oy)\), on permute les rôles des variables : \(y^2+z^2=R^2\) est le cylindre d'axe \((Ox)\). Pour un axe parallèle à \((Oz)\) passant par \((x_0,y_0,0)\), ou un sommet \(S(0,0,z_0)\), on translate : \((x-x_0)^2+(y-y_0)^2=R^2\), \(x^2+y^2=(z-z_0)^2\tan^2\alpha\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">L'équation du cône, à partir de l'angle avec l'axe.</span>
    <div class="content"><p>Pour \(M\neq O\), la droite \((OM)\) fait avec \((Oz)\) l'angle géométrique \(\varphi\in[0,\frac\pi2]\) tel que \(\cos\varphi=\frac{|z|}{OM}\). Elle est une génératrice si et seulement si \(\varphi=\alpha\), c'est-à-dire si la distance à l'axe et la cote vérifient \(\sqrt{x^2+y^2}=|z|\tan\alpha\) (triangle rectangle formé par \(O\), \(M\) et le projeté de \(M\) sur l'axe). En élevant au carré, on obtient l'équation annoncée, que \(O\) vérifie aussi.</p></div>
  </div>

  <h3>Matrices de rotation d'axe un axe du repère</h3>
  <div class="prop-box">
    <strong>Rotations autour des axes.</strong> Dans la base orthonormée directe \((\vec\imath,\vec\jmath,\vec k)\), la rotation d'angle \(\theta\) autour de l'axe orienté par \(\vec k\) a pour matrice \(R_z(\theta)\), et de même autour de \(\vec\imath\) et de \(\vec\jmath\) :
    <div class="formula" data-nom="Matrices de rotation autour des axes">$$\begin{aligned}R_z(\theta)&=\begin{pmatrix}\cos\theta & -\sin\theta & 0\\ \sin\theta & \cos\theta & 0\\ 0 & 0 & 1\end{pmatrix}\\ R_x(\theta)&=\begin{pmatrix}1 & 0 & 0\\ 0 & \cos\theta & -\sin\theta\\ 0 & \sin\theta & \cos\theta\end{pmatrix}\\ R_y(\theta)&=\begin{pmatrix}\cos\theta & 0 & \sin\theta\\ 0 & 1 & 0\\ -\sin\theta & 0 & \cos\theta\end{pmatrix}\end{aligned}$$</div>
    Ce sont des matrices orthogonales de déterminant 1 : \(R(\theta)^{-1}=R(-\theta)=R(\theta)^{\mathsf T}\), et \(R(\theta)R(\theta')=R(\theta+\theta')\) pour un même axe. L'image de \(M\) a pour coordonnées \(X'=R\,X\).
  </div>
  <p>Pour \(R_y\), les signes des sinus semblent inversés : la rotation autour de \(\vec\jmath\) agit dans le plan \((\vec k,\vec\imath)\), dans cet ordre (permutation circulaire), et l'on vérifie que \(R_y(\frac\pi2)\) envoie \(\vec\imath\) sur \(-\vec k\), comme le veut la règle de la main droite. Pour un axe quelconque, la méthode de recherche de l'axe et de l'angle est au chapitre Isométries vectorielles.</p>
  <div class="method-box">
    <strong>Méthode — équation de l'image d'une surface par une rotation</strong>
    <ol>
      <li>Soit \(\mathcal S : F(x,y,z)=0\) et \(\rho\) la rotation de matrice \(R\). Un point \(M'\) est dans \(\rho(\mathcal S)\) si et seulement si \(\rho^{-1}(M')\in\mathcal S\).</li>
      <li>On calcule donc \(X=R^{\mathsf T}X'\) (et non \(RX'\)), puis on remplace dans \(F\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — faire basculer un cône</strong>
    <ol>
      <li>Rotation d'angle \(\frac\pi2\) autour de \((Ox)\) : \(R_x\big(\frac\pi2\big)=\begin{pmatrix}1 & 0 & 0\\ 0 & 0 & -1\\ 0 & 1 & 0\end{pmatrix}\), qui envoie \(\vec k\) sur \(-\vec\jmath\).</li>
      <li>Pour \(M'(x',y',z')\), \(R^{\mathsf T}X'=(x',\ z',\ -y')\).</li>
      <li>Le cône \(x^2+y^2=z^2\) (d'axe \((Oz)\), de demi-angle \(\frac\pi4\)) a pour image \(x'^2+z'^2=y'^2\) : un cône de même demi-angle, d'axe \((Oy)\), comme prévu.</li>
      <li>Intersection du cône \(x^2+y^2=z^2\) et de la sphère \(x^2+y^2+z^2=8\) : en reportant, \(2z^2=8\), donc \(z=\pm2\) et \(x^2+y^2=4\) : deux cercles de rayon 2, dans les plans \(z=2\) et \(z=-2\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : pour obtenir l'équation de l'image d'une surface, remplacer \(X\) par \(RX'\) au lieu de \(R^{\mathsf T}X'\) ; on obtient alors l'image par la rotation inverse. Le contrôle sur un point simple (image de \(\vec k\), d'un sommet…) évite l'erreur.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Axes quelconques et coordonnées sphériques</h2>
  <div class="intro">Ces compléments ne sont pas exigibles, mais ils prolongent naturellement le chapitre.</div>
  <p><strong>Cylindre et cône d'axe quelconque.</strong> Si l'axe \(\Delta\) passe par \(A\) et est dirigé par \(\vec u\), la distance du §7 donne le cylindre de rayon \(R\) : \(\big\|\overrightarrow{AM}\wedge\vec u\big\|^2=R^2\|\vec u\|^2\). Le cône de sommet \(S\) et de demi-angle \(\alpha\) exprime que l'angle entre \((SM)\) et l'axe vaut \(\alpha\) :</p>
  <div class="formula">$$\big(\overrightarrow{SM}\cdot\vec u\big)^2=\cos^2\alpha\;\big\|\overrightarrow{SM}\big\|^2\,\|\vec u\|^2 .$$</div>
  <p><strong>Coordonnées sphériques.</strong> Les physiciens repèrent aussi \(M\) par \(r=OM\), la colatitude \(\theta\in[0,\pi]\) (angle entre \(\vec k\) et \(\overrightarrow{OM}\)) et la longitude \(\varphi\) :</p>
  <div class="formula">$$x=r\sin\theta\cos\varphi,\qquad y=r\sin\theta\sin\varphi,\qquad z=r\cos\theta .$$</div>
  <p>La sphère de centre \(O\) s'écrit alors \(r=R\), et le cône d'axe \((Oz)\) de demi-angle \(\alpha\), \(\theta=\alpha\) ou \(\theta=\pi-\alpha\). Les notations varient selon les disciplines (latitude au lieu de colatitude, \(\theta\) et \(\varphi\) échangés) : toujours préciser la convention.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · GÉOMÉTRIE DANS L'ESPACE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes rassemblent les gestes de base de la géométrie de l'espace, toujours dans un repère orthonormé direct \((O;\vec\imath,\vec\jmath,\vec k)\) : changer de coordonnées, calculer avec les produits scalaire, vectoriel et mixte, écrire plans et droites, calculer projetés et distances, traiter les sphères ; la dernière méthode (cylindres, cônes et rotations d'axe un axe du repère) relève de la 2ᵉ année.</div>

  <div class="method-box"><strong>Méthode 1 — Passer en coordonnées cylindriques et reconnaître une surface</strong>
    <ol>
      <li>De cylindriques à cartésiennes : \(x=r\cos\theta\), \(y=r\sin\theta\), \(z=z\).</li>
      <li>De cartésiennes à cylindriques : \(r=\sqrt{x^2+y^2}\) (distance à l'axe \((Oz)\)), puis \(\theta\) par \(\cos\theta=\frac xr\) et \(\sin\theta=\frac yr\) (les deux, pour placer le bon quadrant).</li>
      <li>Une équation où \(z\) n'apparaît pas décrit un cylindre de génératrices parallèles à \((Oz)\) ; une équation en \(r\) et \(z\) seuls, une surface de révolution d'axe \((Oz)\).</li>
      <li>Compléter les carrés pour reconnaître un axe décalé : \((x-x_0)^2+(y-y_0)^2=R^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(-1,1,3)\) : \(r=\sqrt2\), \(\cos\theta=-\frac{1}{\sqrt2}\), \(\sin\theta=\frac{1}{\sqrt2}\), donc \(\theta=\frac{3\pi}{4}\) : coordonnées cylindriques \(\big(\sqrt2,\frac{3\pi}{4},3\big)\). La surface \(x^2+y^2=2y\) s'écrit \(r=2\sin\theta\), et aussi \(x^2+(y-1)^2=1\) : cylindre de révolution d'axe la droite \(x=0,\ y=1\), de rayon 1.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\theta=\arctan\frac yx\) ne donne l'angle qu'à \(\pi\) près (pour \(M(-1,1,3)\), il donnerait \(-\frac\pi4\)). Et \(r\) est la distance à l'axe, pas à l'origine : \(OM=\sqrt{r^2+z^2}\).</div>

  <div class="method-box"><strong>Méthode 2 — Mesurer un angle et projeter sur une direction</strong>
    <ol>
      <li>En base orthonormée : \(\vec u\cdot\vec v=xx'+yy'+zz'\) et \(\|\vec u\|=\sqrt{x^2+y^2+z^2}\).</li>
      <li>Angle géométrique : \(\cos\theta=\dfrac{\vec u\cdot\vec v}{\|\vec u\|\,\|\vec v\|}\), \(\theta\in[0,\pi]\) ; orthogonalité si et seulement si \(\vec u\cdot\vec v=0\).</li>
      <li>Projeté de \(\vec w\) sur la direction de \(\vec u\neq\vec0\) : \(\dfrac{\vec w\cdot\vec u}{\|\vec u\|^2}\,\vec u\) ; le reste \(\vec w-\frac{\vec w\cdot\vec u}{\|\vec u\|^2}\,\vec u\) est orthogonal à \(\vec u\) (à vérifier).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec u=(2,1,-2)\), \(\vec v=(1,1,0)\) : \(\vec u\cdot\vec v=3\), \(\|\vec u\|=3\), \(\|\vec v\|=\sqrt2\), donc \(\cos\theta=\frac{1}{\sqrt2}\) et \(\theta=\frac\pi4\). Projeté de \(\vec v\) sur la direction de \(\vec u\) : \(\frac39\,\vec u=\frac13(2,1,-2)\), et \(\vec v-\frac13\vec u=\frac13(1,2,2)\) est bien orthogonal à \(\vec u\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Calculer un produit vectoriel et s'en servir</strong>
    <ol>
      <li>Coordonnées en base orthonormée directe : \(\vec u\wedge\vec v=\big(yz'-zy',\ zx'-xz',\ xy'-yx'\big)\) (déterminants \(2\times2\) par permutation circulaire).</li>
      <li>Contrôler aussitôt : le résultat doit être orthogonal à \(\vec u\) et à \(\vec v\).</li>
      <li>Utiliser : vecteur normal à un plan dirigé par \(\vec u,\vec v\) ; aire du parallélogramme \(\|\vec u\wedge\vec v\|\), du triangle \(ABC\) : \(\frac12\|\overrightarrow{AB}\wedge\overrightarrow{AC}\|\) ; colinéarité si et seulement si \(\vec u\wedge\vec v=\vec0\).</li>
      <li>En mécanique : moment \(\vec{\mathcal M}_O(\vec F)=\overrightarrow{OP}\wedge\vec F\), et transport \(\vec{\mathcal M}_{O'}=\vec{\mathcal M}_O+\overrightarrow{O'O}\wedge\vec F\) (cours, §3).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A(1,1,0)\), \(B(2,0,1)\), \(C(0,2,2)\) : \(\overrightarrow{AB}=(1,-1,1)\) et \(\overrightarrow{AC}=(-1,1,2)\) donnent \(\overrightarrow{AB}\wedge\overrightarrow{AC}=(-3,-3,0)\), de norme \(3\sqrt2\). Aire du triangle : \(\frac{3\sqrt2}{2}\) ; plan \((ABC)\) de normale \((1,1,0)\) : \(x+y=2\), vérifié par les trois points.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\vec v\wedge\vec u=-\vec u\wedge\vec v\), et le produit vectoriel n'est pas associatif : \((\vec a\wedge\vec b)\wedge\vec c\neq\vec a\wedge(\vec b\wedge\vec c)\) en général.</div>

  <div class="method-box"><strong>Méthode 4 — Utiliser le produit mixte : volume, coplanarité, orientation</strong>
    <ol>
      <li>Calculer \([\vec u,\vec v,\vec w]\) comme le déterminant des coordonnées rangées en colonnes (base orthonormée directe), ou comme \((\vec u\wedge\vec v)\cdot\vec w\).</li>
      <li>Volume du parallélépipède : \(|[\vec u,\vec v,\vec w]|\) ; du tétraèdre \(ABCD\) : \(\frac16\big|[\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}]\big|\).</li>
      <li>Coplanarité de trois vecteurs (ou de quatre points) si et seulement si le produit mixte est nul ; signe strictement positif si et seulement si la base est directe.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec u=(1,1,0)\), \(\vec v=(0,1,1)\), \(\vec w=(1,0,a)\) : \([\vec u,\vec v,\vec w]=\begin{vmatrix}1&0&1\\1&1&0\\0&1&a\end{vmatrix}=a+1\). Les vecteurs sont coplanaires si et seulement si \(a=-1\) ; pour \(a=1\), ils forment une base directe et engendrent un parallélépipède de volume 2.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Écrire l'équation d'un plan</strong>
    <ol>
      <li>Par un point \(A\) et un vecteur normal \(\vec n=(a,b,c)\) : \(a(x-x_A)+b(y-y_A)+c(z-z_A)=0\).</li>
      <li>Par un point et deux vecteurs directeurs \(\vec u,\vec v\) non colinéaires : \(\vec n=\vec u\wedge\vec v\) ; par trois points non alignés : \(\vec n=\overrightarrow{AB}\wedge\overrightarrow{AC}\).</li>
      <li>Vérifier l'équation sur les points donnés.</li>
      <li>Retour au paramétrique : exprimer une coordonnée en fonction des deux autres, qui servent de paramètres.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A(1,0,0)\), \(B(0,1,0)\), \(C(1,1,1)\) : \(\overrightarrow{AB}=(-1,1,0)\) et \(\overrightarrow{AC}=(0,1,1)\) donnent \(\overrightarrow{AB}\wedge\overrightarrow{AC}=(1,1,-1)\), d'où le plan \(x+y-z=1\) ; contrôle : \(1\), \(1\) et \(1+1-1\) valent bien 1. Paramétrage : \(z=x+y-1\), \(M=(0,0,-1)+x\,(1,0,1)+y\,(0,1,1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \((a,b,c)\) est un vecteur <strong>normal</strong>, pas directeur ; deux équations proportionnelles décrivent le même plan : comparer les normales puis tester un point.</div>

  <div class="method-box"><strong>Méthode 6 — Paramétrer une droite et étudier une intersection</strong>
    <ol>
      <li>Droite donnée par deux équations de plans de normales \(\vec n\), \(\vec n'\) : direction \(\vec n\wedge\vec n'\) ; un point en fixant une coordonnée (souvent \(z=0\) ou \(y=0\)) et en résolvant le système \(2\times2\) restant.</li>
      <li>Droite et plan : reporter le paramétrage dans l'équation du plan ; une solution unique en \(t\) (point d'intersection), aucune (droite parallèle), toutes (droite contenue).</li>
      <li>Deux droites \(A+\operatorname{Vect}(\vec u)\), \(B+\operatorname{Vect}(\vec v)\) : parallèles si \(\vec u\wedge\vec v=\vec0\) ; sinon sécantes si et seulement si \([\overrightarrow{AB},\vec u,\vec v]=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\mathcal D : x-y=1,\ y+z=2\). Direction \((1,-1,0)\wedge(0,1,1)=(-1,-1,1)\), point \((1,0,2)\) (pour \(y=0\)) : \(M=(1,0,2)+t\,(1,1,-1)\). Avec le plan \(x+2y+z=9\) : \(3+2t=9\), \(t=3\), point d'intersection \((4,3,-1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dans l'espace, une seule équation comme \(y=2x+1\) définit un plan, pas une droite.</div>

  <div class="method-box"><strong>Méthode 7 — Calculer une distance, un projeté, un symétrique</strong>
    <ol>
      <li>Point–plan \(ax+by+cz+d=0\) : \(d=\dfrac{|ax_0+by_0+cz_0+d|}{\sqrt{a^2+b^2+c^2}}\) ; projeté \(H=M_0-\lambda\vec n\) avec \(\lambda=\dfrac{ax_0+by_0+cz_0+d}{\|\vec n\|^2}\).</li>
      <li>Point–droite \(A+\operatorname{Vect}(\vec u)\) : \(d=\dfrac{\|\overrightarrow{AM_0}\wedge\vec u\|}{\|\vec u\|}\) ; projeté \(H=A+\dfrac{\overrightarrow{AM_0}\cdot\vec u}{\|\vec u\|^2}\,\vec u\).</li>
      <li>Symétrique de \(M_0\) par rapport au plan ou à la droite : \(2H-M_0\).</li>
      <li>Contrôler : \(H\) est bien sur le plan (ou la droite) et \(M_0H\) redonne la distance.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M_0(1,-1,2)\) et \(2x-y+2z+2=0\) : \(d=\frac{|2+1+4+2|}{3}=3\), \(\lambda=1\), \(H=(-1,0,0)\), symétrique \((-3,1,-2)\). Droite passant par \(O\) dirigée par \((1,0,1)\) : \(\overrightarrow{OM_0}\wedge\vec u=(-1,1,1)\), \(d=\frac{\sqrt3}{\sqrt2}=\frac{\sqrt6}{2}\), projeté \(\big(\frac32,0,\frac32\big)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : ne pas oublier de diviser par \(\|\vec n\|\) (ou par \(\|\vec u\|\)) : la formule « sans racine » ne vaut que pour un vecteur unitaire.</div>

  <div class="method-box"><strong>Méthode 8 — Distance de deux droites et perpendiculaire commune</strong>
    <ol>
      <li>Vérifier que les droites ne sont pas parallèles : \(\vec u\wedge\vec v\neq\vec0\) (sinon, distance d'un point de l'une à l'autre, méthode 7).</li>
      <li>Distance : \(d=\dfrac{\big|[\overrightarrow{AB},\vec u,\vec v]\big|}{\|\vec u\wedge\vec v\|}\) ; elle est nulle si et seulement si les droites sont sécantes.</li>
      <li>Perpendiculaire commune : poser \(H=A+s\,\vec u\), \(K=B+t\,\vec v\), écrire \(\overrightarrow{HK}\cdot\vec u=0\) et \(\overrightarrow{HK}\cdot\vec v=0\), résoudre en \((s,t)\) ; c'est la droite \((HK)\).</li>
      <li>Contrôler : \(\overrightarrow{HK}\) est colinéaire à \(\vec u\wedge\vec v\) et \(HK=d\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\mathcal D_1=(Ox)\) (\(A=O\), \(\vec u=\vec\imath\)) et \(\mathcal D_2=B+\operatorname{Vect}(\vec v)\), \(B(0,0,3)\), \(\vec v=(0,1,1)\). \(\vec u\wedge\vec v=(0,-1,1)\), \([\overrightarrow{AB},\vec u,\vec v]=3\), \(d=\frac{3}{\sqrt2}\). Le système donne \(s=0\), \(t=-\frac32\) : \(H=O\), \(K=\big(0,-\frac32,\frac32\big)\), et \(HK=\frac{3}{\sqrt2}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une droite dirigée par \(\vec u\wedge\vec v\) n'est pas forcément la perpendiculaire commune : elle doit aussi rencontrer les deux droites.</div>

  <div class="method-box"><strong>Méthode 9 — Étudier une sphère et écrire un plan tangent</strong>
    <ol>
      <li>Compléter les carrés : \((x-a)^2+(y-b)^2+(z-c)^2=k\) ; sphère de centre \(\Omega(a,b,c)\) et de rayon \(\sqrt k\) si \(k\gt0\), un point si \(k=0\), vide si \(k\lt0\).</li>
      <li>Intersection avec un plan : calculer \(d=d(\Omega,\mathcal P)\) ; si \(d\lt R\), cercle de centre le projeté \(H\) de \(\Omega\) et de rayon \(\sqrt{R^2-d^2}\) ; si \(d=R\), plan tangent en \(H\) ; si \(d\gt R\), vide.</li>
      <li>Plan tangent en \(M_0\in\mathcal S\) : passant par \(M_0\), de normale \(\overrightarrow{\Omega M_0}\).</li>
      <li>Variante (programme de PTSI, « Fonctions de deux variables », fin d'année ; reprise en 2ᵉ année) : pour une surface \(z=g(x,y)\), le plan tangent en \(M_0\) a pour équation \(z-z_0=\partial_xg(x_0,y_0)\,(x-x_0)+\partial_yg(x_0,y_0)\,(y-y_0)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x^2+y^2+z^2+4x-2z-4=0\) s'écrit \((x+2)^2+y^2+(z-1)^2=9\) : centre \(\Omega(-2,0,1)\), rayon 3. Le plan \(z=3\) est à la distance 2 de \(\Omega\) : il coupe la sphère selon le cercle de centre \((-2,0,3)\) et de rayon \(\sqrt5\). En \(M_0(0,2,2)\in\mathcal S\), \(\overrightarrow{\Omega M_0}=(2,2,1)\) et le plan tangent est \(2x+2y+z=6\). Pour \(z=xy\) en \((1,2,2)\) : \(z=2x+y-2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Cylindres, cônes et rotations d'axe un axe du repère (hors programme en PTSI, vu en 2ᵉ année)</strong>
    <ol>
      <li>Axe \((Oz)\) : cylindre de rayon \(R\) : \(x^2+y^2=R^2\) ; cône de sommet \(O\) et de demi-angle \(\alpha\) : \(x^2+y^2=z^2\tan^2\alpha\). Pour l'axe \((Ox)\) ou \((Oy)\), permuter les variables ; pour un axe parallèle décalé ou un sommet déplacé, translater.</li>
      <li>Rotation d'angle \(\theta\) autour de \(\vec\imath\), \(\vec\jmath\) ou \(\vec k\) : écrire \(R_x(\theta)\), \(R_y(\theta)\) ou \(R_z(\theta)\) (attention aux signes de \(R_y\)), et contrôler l'image d'un vecteur de base.</li>
      <li>Image d'une surface \(F(X)=0\) par la rotation de matrice \(R\) : \(M'\) est sur l'image si et seulement si \(R^{\mathsf T}X'\) vérifie l'équation ; remplacer \(X\) par \(R^{\mathsf T}X'\).</li>
    </ol>
    <p><em>Exemple éclair :</em> le cône de sommet \(O\), d'axe \((Ox)\) et de demi-angle \(\frac\pi6\) a pour équation \(y^2+z^2=\frac{x^2}{3}\). La rotation \(R_y\big(\frac\pi2\big)\) envoie \(\vec k\) sur \(\vec\imath\) et \(R^{\mathsf T}X'=(-z',y',x')\) : le cylindre \(x^2+y^2=1\) a pour image \(z'^2+y'^2=1\), le cylindre d'axe \((Ox)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : remplacer \(X\) par \(RX'\) donne l'image par la rotation <strong>inverse</strong>. Et une seule équation comme \(x^2+y^2=4\) décrit dans l'espace un cylindre, pas un cercle.</div>
</div>
</template>
