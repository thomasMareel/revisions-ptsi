  <h3>Distance d'un point à un plan</h3>
  <div class="statement">Plan \(\mathcal P : 2x-y+2z-3=0\), point \(A=(1,2,3)\), dans un repère orthonormé.</div>
  <div class="q"><strong>Q1.</strong> Distance de \(A\) à \(\mathcal P\).</div>
  <div class="q"><strong>Q2.</strong> Vecteur normal unitaire ?</div>
  <div class="q"><strong>Q3.</strong> Projeté orthogonal \(H\) de \(A\) sur \(\mathcal P\) et symétrique \(A'\) de \(A\) par rapport à \(\mathcal P\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(d=\dfrac{|2\cdot1-2+2\cdot3-3|}{\sqrt{4+1+4}}=\dfrac{|3|}{3}=1\).</p>
  <p><strong>Q2.</strong> \(\vec n=(2,-1,2)\), \(\|\vec n\|=3\), normal unitaire \(\tfrac13(2,-1,2)\) (ou son opposé).</p>
  <p><strong>Q3.</strong> \(H=A-\lambda\vec n\) avec \(\lambda=\frac{3}{9}=\frac13\) : \(H=\big(\frac13,\frac73,\frac73\big)\). Contrôle : \(\frac23-\frac73+\frac{14}{3}-3=0\) et \(AH=\frac13\|\vec n\|=1\). Symétrique : \(A'=2H-A=\big(-\frac13,\frac83,\frac53\big)\).</p></div>
</div>
<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Volume d'un parallélépipède</h3>
  <div class="statement">\(\vec u=(1,0,0)\), \(\vec v=(1,1,0)\), \(\vec w=(1,1,1)\) dans une base orthonormée directe.</div>
  <div class="q"><strong>Q1.</strong> Calculer le produit mixte \([\vec u,\vec v,\vec w]\).</div>
  <div class="q"><strong>Q2.</strong> Les trois vecteurs sont-ils coplanaires ? Forment-ils une base directe ?</div>
  <div class="q"><strong>Q3.</strong> Calculer l'aire de la face construite sur \(\vec u\) et \(\vec v\), puis la hauteur correspondante du parallélépipède.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \([\vec u,\vec v,\vec w]=\det\begin{pmatrix}1&1&1\\0&1&1\\0&0&1\end{pmatrix}=1\) (matrice triangulaire). Volume \(=1\).</p>
  <p><strong>Q2.</strong> Non : le produit mixte est non nul, ils forment une base ; elle est directe car le produit mixte est strictement positif.</p>
  <p><strong>Q3.</strong> \(\vec u\wedge\vec v=(0,0,1)\) : aire 1. Hauteur \(=\dfrac{\text{volume}}{\text{aire}}=1\) : c'est bien la distance de l'extrémité de \(\vec w\) au plan \(z=0\) qui contient \(\vec u\) et \(\vec v\).</p></div>
</div>
<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Plan tangent à un paraboloïde</h3>
  <div class="statement">Soit la surface \(\Sigma\) d'équation \(z=x^2+y^2\) et le point \(A(1,1,2)\) de \(\Sigma\). (La formule du plan tangent à un graphe \(z=g(x,y)\) est au programme de PTSI, partie « Fonctions de deux variables » ; elle est reprise en 2ᵉ année au chapitre Courbes et surfaces de l'espace.)</div>
  <div class="q"><strong>Q1.</strong> Équation du plan tangent \(\mathcal T\) à \(\Sigma\) en \(A\).</div>
  <div class="q"><strong>Q2.</strong> Distance de l'origine à \(\mathcal T\).</div>
  <div class="q"><strong>Q3.</strong> La normale à \(\Sigma\) en \(A\) (droite passant par \(A\), orthogonale à \(\mathcal T\)) recoupe-t-elle \(\Sigma\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Avec \(g(x,y)=x^2+y^2\) : \(\partial_x g=2x=2\), \(\partial_y g=2y=2\) en \((1,1)\). Plan : \(z-2=2(x-1)+2(y-1)\), soit \(z=2x+2y-2\), ou encore \(2x+2y-z-2=0\).</p>
  <p><strong>Q2.</strong> \(d(O,\mathcal T)=\dfrac{|-2|}{\sqrt{4+4+1}}=\dfrac23\).</p>
  <p><strong>Q3.</strong> La normale est \(M(t)=(1,1,2)+t\,(2,2,-1)\). En reportant dans \(z=x^2+y^2\) : \(2-t=2(1+2t)^2\), soit \(8t^2+9t=0\) : \(t=0\) (le point \(A\)) ou \(t=-\frac98\), qui donne le point \(\big(-\frac54,-\frac54,\frac{25}{8}\big)\) ; on vérifie \(\frac{25}{16}+\frac{25}{16}=\frac{25}{8}\). Oui, elle recoupe \(\Sigma\) en ce point.</p></div>
</div>
<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Plans et droites</h3>
  <div class="statement">On donne \(A(1,0,1)\), \(B(2,1,0)\), \(C(0,2,1)\) et la droite \(\mathcal D\) d'équations \(x-y=1\) et \(y-z=0\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(A\), \(B\), \(C\) ne sont pas alignés et donner une équation du plan \(\mathcal P=(ABC)\).</div>
  <div class="q"><strong>Q2.</strong> Donner un point et un vecteur directeur de \(\mathcal D\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\mathcal D\) coupe \(\mathcal P\) en un point \(I\) que l'on déterminera, et calculer l'angle entre \(\mathcal D\) et \(\mathcal P\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer le plan \(\mathcal Q\) contenant \(\mathcal D\) et perpendiculaire à \(\mathcal P\).</div>
  <div class="q"><strong>Q5.</strong> Les points \(O\) et \(E(2,2,2)\) sont-ils du même côté de \(\mathcal P\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\overrightarrow{AB}=(1,1,-1)\), \(\overrightarrow{AC}=(-1,2,0)\), \(\overrightarrow{AB}\wedge\overrightarrow{AC}=(2,1,3)\neq\vec0\) : les points ne sont pas alignés. Plan : \(2(x-1)+y+3(z-1)=0\), soit \(\mathcal P : 2x+y+3z=5\) ; contrôle : \(B\) donne \(4+1+0=5\), \(C\) donne \(0+2+3=5\).</p>
  <p><strong>Q2.</strong> Direction \((1,-1,0)\wedge(0,1,-1)=(1,1,1)\). Pour \(z=0\) : \(y=0\), \(x=1\). Donc \(\mathcal D : M=(1,0,0)+t\,(1,1,1)\).</p>
  <p><strong>Q3.</strong> \((1,1,1)\cdot(2,1,3)=6\neq0\) : \(\mathcal D\) n'est pas parallèle à \(\mathcal P\). En reportant : \(2(1+t)+t+3t=5\), soit \(t=\frac12\), d'où \(I\big(\frac32,\frac12,\frac12\big)\). L'angle \(\alpha\) entre la droite et le plan vérifie \(\sin\alpha=\dfrac{|\vec u\cdot\vec n|}{\|\vec u\|\,\|\vec n\|}=\dfrac{6}{\sqrt3\,\sqrt{14}}=\sqrt{\dfrac67}\), soit \(\alpha\approx67{,}8^\circ\).</p>
  <p><strong>Q4.</strong> \(\mathcal Q\) contient la direction \((1,1,1)\) de \(\mathcal D\) et la normale \((2,1,3)\) de \(\mathcal P\) : sa normale est \((1,1,1)\wedge(2,1,3)=(2,-1,-1)\). Passant par \((1,0,0)\) : \(\mathcal Q : 2x-y-z=2\). Contrôles : \(2(1+t)-t-t=2\) pour tout \(t\), et \((2,-1,-1)\cdot(2,1,3)=0\).</p>
  <p><strong>Q5.</strong> \(2x+y+3z-5\) vaut \(-5\) en \(O\) et \(4+2+6-5=7\) en \(E\) : signes contraires, \(O\) et \(E\) sont de part et d'autre de \(\mathcal P\).</p></div>
</div>
<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Distance d'un point à une droite et sphère tangente</h3>
  <div class="statement">Soit \(\mathcal D\) la droite passant par \(A(1,0,1)\) dirigée par \(\vec u=(1,1,0)\), et \(M_0(3,0,2)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(d(M_0,\mathcal D)\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer le projeté orthogonal \(H\) de \(M_0\) sur \(\mathcal D\), et retrouver la distance.</div>
  <div class="q"><strong>Q3.</strong> Symétrique de \(M_0\) par rapport à \(\mathcal D\).</div>
  <div class="q"><strong>Q4.</strong> Équation de la sphère de centre \(M_0\) tangente à \(\mathcal D\), et point de contact.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\overrightarrow{AM_0}=(2,0,1)\) et \(\overrightarrow{AM_0}\wedge\vec u=(-1,1,2)\), de norme \(\sqrt6\). Donc \(d=\dfrac{\sqrt6}{\sqrt2}=\sqrt3\).</p>
  <p><strong>Q2.</strong> \(\dfrac{\overrightarrow{AM_0}\cdot\vec u}{\|\vec u\|^2}=\dfrac22=1\), d'où \(H=A+\vec u=(2,1,1)\). \(\overrightarrow{HM_0}=(1,-1,1)\) est orthogonal à \(\vec u\) et de norme \(\sqrt3\).</p>
  <p><strong>Q3.</strong> \(2H-M_0=(1,2,0)\).</p>
  <p><strong>Q4.</strong> Une sphère de centre \(M_0\) est tangente à \(\mathcal D\) si et seulement si son rayon vaut \(d(M_0,\mathcal D)=\sqrt3\) : \((x-3)^2+y^2+(z-2)^2=3\). Le point de contact est \(H(2,1,1)\). Contrôle : en reportant \(M=A+t\,\vec u\), on obtient \((t-2)^2+t^2+1=3\), soit \(2(t-1)^2=0\), racine double \(t=1\).</p></div>
</div>
<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Sphère, plans et cercles</h3>
  <div class="statement">Soit \(\mathcal S\) la surface d'équation \(x^2+y^2+z^2-2x-4y+2z-10=0\) et \(\mathcal P\) le plan d'équation \(x+2y+2z=9\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathcal S\) est une sphère ; centre \(\Omega\) et rayon \(R\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\mathcal S\cap\mathcal P\) est un cercle ; centre et rayon.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les plans parallèles à \(\mathcal P\) tangents à \(\mathcal S\), et les points de contact.</div>
  <div class="q"><strong>Q4.</strong> La droite \(\Delta : M=(1,2,3)+t\,(1,-1,0)\) est-elle tangente à \(\mathcal S\) ?</div>
  <div class="q"><strong>Q5.</strong> Montrer que \(\mathcal S\) et la sphère \(\mathcal S' : x^2+y^2+z^2=4\) se coupent selon un cercle dont on donnera le plan, le centre et le rayon.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> En complétant les carrés : \((x-1)^2+(y-2)^2+(z+1)^2=16\) (car \(1+4+1+10=16\)). Sphère de centre \(\Omega(1,2,-1)\), de rayon \(R=4\).</p>
  <p><strong>Q2.</strong> \(d(\Omega,\mathcal P)=\dfrac{|1+4-2-9|}{3}=2\lt4\) : l'intersection est un cercle de rayon \(\sqrt{16-4}=2\sqrt3\), de centre le projeté de \(\Omega\) : \(H=\Omega-\frac{-6}{9}(1,2,2)=\big(\frac53,\frac{10}{3},\frac13\big)\) ; contrôle : \(\frac{5+20+2}{3}=9\).</p>
  <p><strong>Q3.</strong> Un plan \(x+2y+2z=k\) est tangent à \(\mathcal S\) si et seulement si \(\frac{|3-k|}{3}=4\), soit \(k=15\) ou \(k=-9\). Les points de contact sont \(\Omega\pm\frac43(1,2,2)\) : \(\big(\frac73,\frac{14}{3},\frac53\big)\) pour \(k=15\) et \(\big(-\frac13,-\frac23,-\frac{11}{3}\big)\) pour \(k=-9\).</p>
  <p><strong>Q4.</strong> En reportant \(x=1+t\), \(y=2-t\), \(z=3\) dans l'équation réduite : \(t^2+t^2+16=16\), soit \(2t^2=0\) : racine double \(t=0\). \(\Delta\) est tangente à \(\mathcal S\) en \((1,2,3)\) (elle est orthogonale au rayon \(\overrightarrow{\Omega M}=(0,0,4)\)).</p>
  <p><strong>Q5.</strong> En retranchant les équations : \(-2x-4y+2z-6=0\), soit le plan \(\Pi : x+2y-z+3=0\), et \(\mathcal S\cap\mathcal S'=\mathcal S'\cap\Pi\). Or \(d(O,\Pi)=\frac{3}{\sqrt6}=\frac{\sqrt6}{2}\lt2\) : c'est le cercle de \(\Pi\) de rayon \(\sqrt{4-\frac32}=\sqrt{\frac52}\), de centre le projeté de \(O\), \(O-\frac36(1,2,-1)=\big(-\frac12,-1,\frac12\big)\). (Avec \(\mathcal S\) : \(d(\Omega,\Pi)=\frac{9}{\sqrt6}\) et \(16-\frac{27}{2}=\frac52\), même rayon.)</p></div>
</div>
<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Cylindre, cône et rotation (hors programme en PTSI, vu en 2ᵉ année)</h3>
  <div class="statement">Dans un repère orthonormé direct, on note \(\mathcal C\) le cylindre de révolution d'axe \((Oz)\) et de rayon 2, et \(\Gamma\) le cône de révolution de sommet \(O\), d'axe \((Oz)\) et de demi-angle \(\frac\pi3\).</div>
  <div class="q"><strong>Q1.</strong> Équations cartésiennes et cylindriques de \(\mathcal C\) et de \(\Gamma\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(\mathcal C\cap\Gamma\).</div>
  <div class="q"><strong>Q3.</strong> Décrire les sections de \(\Gamma\) par le plan \(z=1\), puis par le plan \(x=1\).</div>
  <div class="q"><strong>Q4.</strong> Équation de l'image de \(\Gamma\) par la rotation d'angle \(\frac\pi2\) autour de \(\vec\imath\). Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\mathcal C : x^2+y^2=4\), soit \(r=2\). \(\Gamma : x^2+y^2=z^2\tan^2\frac\pi3=3z^2\), soit \(r=\sqrt3\,|z|\).</p>
  <p><strong>Q2.</strong> En reportant \(x^2+y^2=4\) : \(3z^2=4\), \(z=\pm\frac{2}{\sqrt3}\). L'intersection est formée de deux cercles de rayon 2 et d'axe \((Oz)\), dans les plans \(z=\frac{2}{\sqrt3}\) et \(z=-\frac{2}{\sqrt3}\).</p>
  <p><strong>Q3.</strong> Pour \(z=1\) : \(x^2+y^2=3\), cercle de centre \((0,0,1)\) et de rayon \(\sqrt3\). Pour \(x=1\) : \(1+y^2=3z^2\), soit \(\dfrac{z^2}{1/3}-y^2=1\) dans le plan \(x=1\) (coordonnées \((y,z)\)) : une hyperbole d'axe focal la droite \(x=1,\ y=0\), avec \(a=\frac{1}{\sqrt3}\), \(b=1\).</p>
  <p><strong>Q4.</strong> \(R=R_x\big(\frac\pi2\big)=\begin{pmatrix}1&0&0\\0&0&-1\\0&1&0\end{pmatrix}\) et \(R^{\mathsf T}X'=(x',\ z',\ -y')\). L'image a pour équation \(x'^2+z'^2=3y'^2\) : c'est le cône de sommet \(O\), d'axe \((Oy)\) et de même demi-angle, ce qui est cohérent avec \(R\,\vec k=-\vec\jmath\).</p></div>
</div>
<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Distance de deux droites, de deux façons</h3>
  <div class="statement">\(\mathcal D_1 : M=A+s\,\vec u\) avec \(A(1,0,0)\), \(\vec u=(1,1,0)\) ; \(\mathcal D_2 : N=B+t\,\vec v\) avec \(B(0,0,2)\), \(\vec v=(1,-1,1)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathcal D_1\) et \(\mathcal D_2\) ne sont pas coplanaires et calculer leur distance.</div>
  <div class="q"><strong>Q2.</strong> Déterminer la perpendiculaire commune (points \(H\in\mathcal D_1\) et \(K\in\mathcal D_2\)).</div>
  <div class="q"><strong>Q3.</strong> Écrire le plan \(\mathcal P_1\) contenant \(\mathcal D_1\) et parallèle à \(\mathcal D_2\), et retrouver la distance comme \(d(B,\mathcal P_1)\).</div>
  <div class="q"><strong>Q4.</strong> Retrouver \(H\) et \(K\) en minimisant \(\varphi(s,t)=\|\overrightarrow{MN}\|^2\) (point critique d'une fonction de deux variables).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(\vec u\wedge\vec v=(1,-1,-2)\neq\vec0\) : les droites ne sont pas parallèles. \(\overrightarrow{AB}=(-1,0,2)\) et le produit mixte \(\overrightarrow{AB}\cdot(\vec u\wedge\vec v)\) vaut \(-1-4=-5\neq0\) : elles ne sont pas coplanaires. Distance \(d=\dfrac{5}{\sqrt6}=\dfrac{5\sqrt6}{6}\).</p>
  <p><strong>Q2.</strong> \(\overrightarrow{HK}=(t-1-s,\ -t-s,\ 2+t)\) pour \(H=A+s\vec u\), \(K=B+t\vec v\). \(\overrightarrow{HK}\cdot\vec u=-1-2s=0\) et \(\overrightarrow{HK}\cdot\vec v=3t+1=0\) donnent \(s=-\frac12\), \(t=-\frac13\) : \(H\big(\frac12,-\frac12,0\big)\), \(K\big(-\frac13,\frac13,\frac53\big)\), \(\overrightarrow{HK}=\frac56(-1,1,2)\), colinéaire à \(\vec u\wedge\vec v\) et de norme \(\frac56\sqrt6=\frac{5}{\sqrt6}\). La perpendiculaire commune est la droite \(H+\operatorname{Vect}\big((1,-1,-2)\big)\).</p>
  <p><strong>Q3.</strong> \(\mathcal P_1\) passe par \(A\) et a pour normale \(\vec u\wedge\vec v\) : \(x-y-2z=1\). Alors \(d(B,\mathcal P_1)=\dfrac{|0-0-4-1|}{\sqrt6}=\dfrac{5}{\sqrt6}\).</p>
  <p><strong>Q4.</strong> \(\varphi(s,t)=(t-1-s)^2+(t+s)^2+(2+t)^2\). Ses dérivées partielles</p>
  <div class="formula">$$\begin{aligned}\partial_s\varphi&=-2(t-1-s)+2(t+s)=2+4s,\\ \partial_t\varphi&=2(t-1-s)+2(t+s)+2(2+t)=6t+2\end{aligned}$$</div>
  <p>s'annulent en \(\big(-\frac12,-\frac13\big)\) : on retrouve \(H\) et \(K\), et \(\varphi\big(-\frac12,-\frac13\big)=\frac{25}{6}=d^2\). Ce point critique est bien le minimum : le §8 du cours montre que \(MN\geqslant HK\) pour tous \(M\), \(N\).</p></div>
</div>
<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Un tétraèdre régulier inscrit dans un cube</h3>
  <div class="statement">On considère \(A(1,1,1)\), \(B(1,-1,-1)\), \(C(-1,1,-1)\), \(D(-1,-1,1)\), quatre sommets du cube \([-1,1]^3\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que les six arêtes de \(ABCD\) ont la même longueur, et calculer le volume de \(ABCD\).</div>
  <div class="q"><strong>Q2.</strong> Équation du plan \((BCD)\), distance de \(A\) à ce plan ; retrouver le volume par « base × hauteur / 3 ».</div>
  <div class="q"><strong>Q3.</strong> Équation du plan \((ACD)\). Calculer l'angle entre les normales des plans \((BCD)\) et \((ACD)\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que les quatre sommets sont sur une même sphère centrée en \(O\), et que la rotation d'angle \(\pi\) autour de \((Oz)\) laisse le tétraèdre globalement invariant.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Deux sommets diffèrent par le signe d'exactement deux coordonnées : chaque arête vaut \(\sqrt{0+4+4}=2\sqrt2\). Avec \(\overrightarrow{AB}=(0,-2,-2)\), \(\overrightarrow{AC}=(-2,0,-2)\), \(\overrightarrow{AD}=(-2,-2,0)\) :</p>
  <div class="formula">$$\big[\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}\big]=\begin{vmatrix}0&-2&-2\\-2&0&-2\\-2&-2&0\end{vmatrix}=-16 ,$$</div>
  <p>d'où le volume \(\frac{16}{6}=\frac83\) (la base \((\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD})\) est indirecte).</p>
  <p><strong>Q2.</strong> \(B\), \(C\), \(D\) vérifient \(x+y+z=-1\) et ne sont pas alignés : \((BCD) : x+y+z=-1\). \(d(A,(BCD))=\frac{|1+1+1+1|}{\sqrt3}=\frac{4}{\sqrt3}\). La face \(BCD\) est un triangle équilatéral de côté \(2\sqrt2\), d'aire \(\frac{\sqrt3}{4}\cdot8=2\sqrt3\). Volume : \(\frac13\cdot2\sqrt3\cdot\frac{4}{\sqrt3}=\frac83\).</p>
  <p><strong>Q3.</strong> \(\overrightarrow{AC}\wedge\overrightarrow{AD}=(-4,4,4)\), normale \((-1,1,1)\) : \((ACD) : -x+y+z=1\). L'angle \(\beta\) entre les normales \((1,1,1)\) et \((-1,1,1)\) vérifie \(\cos\beta=\frac{1}{3}\), soit \(\beta\approx70{,}5^\circ\).</p>
  <p><strong>Q4.</strong> \(OA=OB=OC=OD=\sqrt3\) : les sommets sont sur la sphère \(x^2+y^2+z^2=3\). La rotation \(R_z(\pi)\) a pour matrice \(\operatorname{diag}(-1,-1,1)\) : \((x,y,z)\mapsto(-x,-y,z)\). Elle échange \(A\) et \(D\), ainsi que \(B\) et \(C\) : le tétraèdre est globalement invariant.</p></div>
</div>
<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Moment d'une force et formule de transport</h3>
  <div class="statement">Une force \(\vec F=(0,0,-10)\) (en N) est appliquée au point \(P(3,0,0)\) (en m), dans un repère orthonormé direct. On note \(O'(1,0,0)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le moment \(\vec{\mathcal M}_O(\vec F)=\overrightarrow{OP}\wedge\vec F\) et retrouver sa norme à l'aide du bras de levier.</div>
  <div class="q"><strong>Q2.</strong> Calculer directement \(\vec{\mathcal M}_{O'}(\vec F)\).</div>
  <div class="q"><strong>Q3.</strong> Retrouver ce résultat par la formule de transport.</div>
  <div class="q"><strong>Q4.</strong> Déterminer l'ensemble des points \(Q\) de l'espace en lesquels le moment de \(\vec F\) est nul.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\overrightarrow{OP}=(3,0,0)\), et la formule du produit vectoriel donne</p>
    <div class="formula">$$(3,0,0)\wedge(0,0,-10)=\big(0\times(-10)-0\times0,\ 0\times0-3\times(-10),\ 3\times0-0\times0\big)=(0,30,0)\ \text{N·m} .$$</div>
    <p> La droite d'action est la verticale passant par \(P\) ; sa distance à \(O\) est \(d=3\ \text{m}\), et \(F\,d=10\times3=30\) : on retrouve la norme.</p>
    <p><strong>Q2.</strong> \(\overrightarrow{O'P}=(2,0,0)\), d'où \(\vec{\mathcal M}_{O'}=(2,0,0)\wedge(0,0,-10)\), soit \((0,20,0)\ \text{N·m}\) (le bras de levier n'est plus que de 2 m).</p>
    <p><strong>Q3.</strong> \(\vec{\mathcal M}_{O'}=\vec{\mathcal M}_O+\overrightarrow{O'O}\wedge\vec F\), avec \(\overrightarrow{O'O}=(-1,0,0)\) et \((-1,0,0)\wedge(0,0,-10)=(0,-10,0)\) : on obtient \((0,30,0)+(0,-10,0)=(0,20,0)\). Piège classique : écrire \(\overrightarrow{OO'}\wedge\vec F\) donnerait \((0,40,0)\), faux.</p>
    <p><strong>Q4.</strong> \(\vec{\mathcal M}_Q(\vec F)=\overrightarrow{QP}\wedge\vec F=\vec 0\) si et seulement si \(\overrightarrow{QP}\) est colinéaire à \(\vec F\) (§3), c'est-à-dire si \(Q\) est sur la droite d'action \(P+\operatorname{Vect}(\vec F)\) : la droite d'équations \(x=3\), \(y=0\).</p>
  </div>
</div>
<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Une pyramide, ses sphères circonscrite et inscrite</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : géométrie de l'espace de PTSI — plans, régionnement, angles, produit mixte, distances, sphères et intersections).</div>
  <div class="statement">Dans un repère orthonormé direct \((O;\vec\imath,\vec\jmath,\vec k)\) (unité : le décimètre), on considère la pyramide \(\mathcal K\) de base le carré \(OABC\), avec \(A(2,0,0)\), \(B(2,2,0)\), \(C(0,2,0)\), et de sommet \(S(1,1,3)\). On note \(\Delta\) la droite d'équations \(x=1\), \(y=1\).</div>
  <p class="exo-part">Partie A — Faces, angle et volume</p>
  <div class="q"><strong>A1.</strong> Montrer que le plan \((SAB)\) a pour équation \(3x+z=6\). Donner sans calcul les équations des plans \((SBC)\), \((SCO)\) et \((SOA)\), puis les vérifier.</div>
  <div class="q"><strong>A2.</strong> Décrire la pyramide pleine \(\mathcal K\) par cinq inégalités. Le point \(G\big(1,1,\frac34\big)\) est-il dans \(\mathcal K\) ?</div>
  <div class="q"><strong>A3.</strong> Calculer l'angle \(\alpha\) entre le plan \((SAB)\) et le plan de base (angle de leurs vecteurs normaux) ; le retrouver dans le triangle rectangle formé par \(S\), le centre \(H_0(1,1,0)\) de la base et le milieu de \([AB]\).</div>
  <div class="q"><strong>A4.</strong> Calculer le volume de \(\mathcal K\) à l'aide de deux produits mixtes, et contrôler par la formule \(\frac13\times\text{base}\times\text{hauteur}\).</div>
  <p class="exo-part">Partie B — La sphère circonscrite</p>
  <div class="q"><strong>B1.</strong> Montrer qu'un point équidistant de \(O\), \(A\) et \(C\) est sur \(\Delta\).</div>
  <div class="q"><strong>B2.</strong> En déduire le centre \(\Omega\) et le rayon \(R\) de la sphère \(\Sigma\) passant par les cinq sommets, et une équation de \(\Sigma\).</div>
  <p class="exo-part">Partie C — La sphère inscrite</p>
  <div class="q"><strong>C1.</strong> On cherche une sphère de centre \(I\) intérieur à \(\mathcal K\), tangente aux cinq faces. En écrivant que \(I\) est à la même distance des plans \((SAB)\) et \((SCO)\), puis de \((SBC)\) et \((SOA)\), montrer que \(I\in\Delta\).</div>
  <div class="q"><strong>C2.</strong> On pose \(I(1,1,\rho)\). Déterminer \(\rho\), rayon de la sphère inscrite.</div>
  <div class="q"><strong>C3.</strong> Déterminer le point de contact de la sphère inscrite avec la face \((SAB)\).</div>
  <p class="exo-part">Partie D — Section de la sphère circonscrite par une face</p>
  <div class="q"><strong>D1.</strong> Montrer que \(\Sigma\cap(SAB)\) est un cercle ; préciser son centre et son rayon.</div>
  <div class="q"><strong>D2.</strong> Ce cercle est le cercle circonscrit au triangle \(SAB\). Vérifier son rayon à l'aide de la formule \(\frac{SA\times SB\times AB}{4\,\mathcal A(SAB)}\), l'aire étant calculée par un produit vectoriel.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(\overrightarrow{AB}=(0,2,0)\), \(\overrightarrow{AS}=(-1,1,3)\), \(\overrightarrow{AB}\wedge\overrightarrow{AS}=(6,0,2)\), normale \((3,0,1)\) : \(3(x-2)+z=0\), soit \(3x+z=6\) (contrôle : \(S\) donne \(3+3=6\)). La pyramide est invariante par le quart de tour d'axe \(\Delta\) qui envoie \(A\) sur \(B\), \(B\) sur \(C\), \(C\) sur \(O\) ; on obtient \((SBC) : 3y+z=6\), \((SCO) : 3x-z=0\), \((SOA) : 3y-z=0\). Contrôles : \(B\), \(C\), \(S\) vérifient la première ; \(O\), \(C\), \(S\) la deuxième ; \(O\), \(A\), \(S\) la troisième.</p>
    <p><strong>A2.</strong> En lisant chaque signe sur le centre \(H_0(1,1,0)\) de la base, intérieur au solide : \(z\geqslant0\), \(3x+z\leqslant6\), \(3y+z\leqslant6\), \(3x-z\geqslant0\), \(3y-z\geqslant0\). Pour \(G\) : \(\frac34\geqslant0\), \(3+\frac34\leqslant6\), \(3-\frac34\geqslant0\) (et de même en \(y\)) : \(G\in\mathcal K\). (C'est le centre de gravité de la pyramide, au quart de la hauteur.)</p>
    <p><strong>A3.</strong> \(\cos\alpha=\frac{(3,0,1)\cdot(0,0,1)}{\sqrt{10}\times1}=\frac{1}{\sqrt{10}}\), soit \(\alpha\approx71{,}6^\circ\). Le milieu de \([AB]\) est \((2,1,0)\), à la distance 1 de \(H_0\), et \(SH_0=3\) : \(\tan\alpha=3\), et l'on a bien \(\cos\alpha=\frac{1}{\sqrt{1+9}}\).</p>
    <p><strong>A4.</strong> On coupe \(\mathcal K\) par le plan \((SOB)\) en deux tétraèdres \(SOAB\) et \(SOBC\). \(\overrightarrow{OA}\wedge\overrightarrow{OB}=(0,0,4)\), donc \([\overrightarrow{OA},\overrightarrow{OB},\overrightarrow{OS}]\) vaut \((0,0,4)\cdot(1,1,3)=12\) ; de même \(\overrightarrow{OB}\wedge\overrightarrow{OC}=(0,0,4)\) et \([\overrightarrow{OB},\overrightarrow{OC},\overrightarrow{OS}]=12\). Volume : \(\frac{12}{6}+\frac{12}{6}=4\ \text{dm}^3\), égal à \(\frac13\times4\times3\).</p>
    <p><strong>B1.</strong> \(MO=MA\) s'écrit \(x^2=(x-2)^2\), soit \(x=1\) (plan médiateur de \([OA]\)) ; \(MO=MC\) donne de même \(y=1\). Donc \(M\in\Delta\).</p>
    <p><strong>B2.</strong> \(\Omega(1,1,c)\) est alors équidistant des quatre sommets de la base (par symétrie, \(\Omega B=\Omega O\)). Il reste \(\Omega O=\Omega S\) : \(1+1+c^2=(3-c)^2\), soit \(2=9-6c\), \(c=\frac76\). Puis \(R^2=2+\frac{49}{36}=\frac{121}{36}\), \(R=\frac{11}{6}\). \(\Sigma : (x-1)^2+(y-1)^2+\big(z-\frac76\big)^2=\frac{121}{36}\).</p>
    <p><strong>C1.</strong> Pour un point intérieur, \(6-3x-z\gt0\) et \(3x-z\gt0\) (A2), et les deux normales ont la même norme \(\sqrt{10}\) : l'égalité des distances s'écrit \(6-3x-z=3x-z\), soit \(x=1\). De même, \((SBC)\) et \((SOA)\) donnent \(y=1\). Donc \(I\in\Delta\).</p>
    <p><strong>C2.</strong> La distance de \(I(1,1,\rho)\) à la base est \(\rho\), à \((SAB)\) : \(\frac{|3+\rho-6|}{\sqrt{10}}=\frac{3-\rho}{\sqrt{10}}\) (car \(\rho\lt3\) à l'intérieur). L'égalité donne \(3-\rho=\sqrt{10}\,\rho\), d'où</p>
    <div class="formula">$$\rho=\frac{3}{1+\sqrt{10}}=\frac{\sqrt{10}-1}{3}\approx0{,}72\ \text{dm} .$$</div>
    <p><strong>C3.</strong> C'est le projeté de \(I\) sur \((SAB)\) : \(I-\lambda(3,0,1)\) avec \(\lambda=\frac{3+\rho-6}{10}=\frac{\rho-3}{10}\). Avec \(\rho-3=\frac{\sqrt{10}-10}{3}\), on obtient le point \(\Big(2-\frac{\sqrt{10}}{10},\ 1,\ \frac{3\sqrt{10}}{10}\Big)\approx(1{,}68\,;\,1\,;\,0{,}95)\). Contrôle : \(3\big(2-\frac{\sqrt{10}}{10}\big)+\frac{3\sqrt{10}}{10}=6\).</p>
    <p><strong>D1.</strong> \(d\big(\Omega,(SAB)\big)=\frac{|3+\frac76-6|}{\sqrt{10}}=\frac{11}{6\sqrt{10}}\lt R\) : l'intersection est un cercle, de rayon \(\sqrt{R^2-d^2}=\frac{11}{6}\sqrt{1-\frac1{10}}=\frac{11}{2\sqrt{10}}\approx1{,}74\ \text{dm}\). Son centre est le projeté de \(\Omega\) : \(\lambda=\frac{3+\frac76-6}{10}=-\frac{11}{60}\), d'où \(\Omega-\lambda(3,0,1)=\big(\frac{31}{20},1,\frac{27}{20}\big)\).</p>
    <p><strong>D2.</strong> \(S\), \(A\), \(B\) sont sur \(\Sigma\) et dans \((SAB)\), donc sur ce cercle. \(SA=SB=\sqrt{1+1+9}=\sqrt{11}\), \(AB=2\), et l'aire vaut \(\frac12\big\|\overrightarrow{AB}\wedge\overrightarrow{AS}\big\|\), soit \(\frac12\sqrt{36+4}=\sqrt{10}\). La formule donne \(\frac{11\times2}{4\sqrt{10}}=\frac{11}{2\sqrt{10}}\) : c'est bien le rayon trouvé en D1.</p>
  </div>
</div>
<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Couper un cône par un plan : une conique de foyer le sommet projeté (2ᵉ année)</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : cône de révolution, plans, angles, projection, coniques par foyer et directrice ; les sections planes de cônes ne sont pas au programme : tout est guidé). Il utilise les coniques et les cônes de révolution, vus en 2ᵉ année : à garder pour les révisions de PT.</div>
  <div class="statement">L'espace est rapporté à un repère orthonormé direct \((O;\vec\imath,\vec\jmath,\vec k)\). On note \(\Gamma\) la surface d'équation \(x^2+y^2=z^2\). Pour \(e\gt0\) et \(h\gt0\), on note \(\mathcal P_{e,h}\) le plan d'équation \(z=e(x+h)\), \(\mathcal C=\Gamma\cap\mathcal P_{e,h}\), et \(\mathcal C'\) le projeté orthogonal de \(\mathcal C\) sur le plan \((xOy)\), que l'on identifie au plan muni du repère \((O;\vec\imath,\vec\jmath)\).</div>

  <p class="exo-part">Partie A — Le cône et le plan</p>
  <div class="q"><strong>A1.</strong> Montrer que \(\Gamma\) est le cône de révolution de sommet \(O\), d'axe \((Oz)\) et de demi-angle \(\frac\pi4\). Donner son équation en coordonnées cylindriques.</div>
  <div class="q"><strong>A2.</strong> Donner un vecteur normal à \(\mathcal P_{e,h}\). On note \(\psi\in[0,\frac\pi2]\) l'angle entre l'axe \((Oz)\) et le plan \(\mathcal P_{e,h}\). Montrer que \(\sin\psi=\dfrac{1}{\sqrt{1+e^2}}\), puis que \(\psi\gt\frac\pi4\) si et seulement si \(e\lt1\).</div>

  <p class="exo-part">Partie B — La projection est une conique</p>
  <div class="q"><strong>B1.</strong> Montrer qu'un point \(m(x,y)\) du plan appartient à \(\mathcal C'\) si et seulement si \(x^2+y^2=e^2(x+h)^2\), et que la projection est une bijection de \(\mathcal C\) sur \(\mathcal C'\).</div>
  <div class="q"><strong>B2.</strong> En déduire que \(\mathcal C'\) est la conique de foyer \(O\), de directrice la droite \(\Delta : x=-h\) et d'excentricité \(e\). Interpréter \(\Delta\) à l'aide de \(\mathcal P_{e,h}\). Nature de \(\mathcal C'\) selon \(e\) ?</div>

  <p class="exo-part">Partie C — Le cas \(e=\frac12\), \(h=2\)</p>
  <div class="q"><strong>C1.</strong> Écrire l'équation réduite de \(\mathcal C'\) ; centre, demi-axes, foyers, directrices.</div>
  <div class="q"><strong>C2.</strong> Paramétrer \(\mathcal C'\), puis \(\mathcal C\).</div>
  <div class="q"><strong>C3.</strong> Déterminer le point le plus haut et le point le plus bas de \(\mathcal C\), et vérifier qu'ils sont sur \(\Gamma\).</div>
  <div class="q"><strong>C4.</strong> Calculer la longueur de la corde de \(\mathcal C'\) portée par l'axe \((Oy)\), et la comparer au paramètre \(p=e\,h\).</div>

  <p class="exo-part">Partie D — Un plan oblique</p>
  <div class="q"><strong>D1.</strong> Soit \(\mathcal Q\) le plan d'équation \(x+y-2z+4=0\). Montrer que la projection sur \((xOy)\) de \(\Gamma\cap\mathcal Q\) est la conique de foyer \(O\), de directrice la droite \(\Delta' : x+y+4=0\) et d'excentricité \(\frac{\sqrt2}{2}\).</div>
  <div class="q"><strong>D2.</strong> On pose \(X=\frac{x+y}{\sqrt2}\), \(Y=\frac{-x+y}{\sqrt2}\) (coordonnées dans le repère tourné de \(\frac\pi4\) autour de \((Oz)\)). Écrire l'équation réduite de cette conique, puis donner son centre et ses foyers dans le repère \((O;\vec\imath,\vec\jmath)\).</div>
  <div class="q"><strong>D3.</strong> Vérifier que, pour \(\mathcal P_{e,h}\) comme pour \(\mathcal Q\), l'excentricité de la conique projetée est la tangente de l'angle entre le plan de coupe et le plan \((xOy)\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>A1.</strong> Pour \(M(x,y,z)\neq O\), la droite \((OM)\) fait avec \((Oz)\) l'angle \(\varphi\in[0,\frac\pi2]\) tel que \(\cos\varphi=\frac{|z|}{OM}\). Si \(M\in\Gamma\), alors \(z\neq0\), \(OM^2=2z^2\) et \(\cos\varphi=\frac{1}{\sqrt2}\) : \(\varphi=\frac\pi4\). Réciproquement, \(\varphi=\frac\pi4\) donne \(2z^2=x^2+y^2+z^2\), soit \(M\in\Gamma\). Comme \(O\in\Gamma\), \(\Gamma\) est la réunion des droites passant par \(O\) qui font l'angle \(\frac\pi4\) avec \((Oz)\) : le cône annoncé. En cylindriques : \(r=|z|\).</p>
  <p><strong>A2.</strong> \(\mathcal P_{e,h} : ex-z+eh=0\), de normale \(\vec n=(e,0,-1)\). L'angle entre une droite et un plan est le complémentaire de l'angle entre la droite et la normale : \(\sin\psi=\dfrac{|\vec n\cdot\vec k|}{\|\vec n\|}=\dfrac{1}{\sqrt{1+e^2}}\). Ainsi</p>
  <div class="formula">$$\psi\gt\frac\pi4\iff\sin\psi\gt\frac{1}{\sqrt2}\iff1+e^2\lt2\iff e\lt1 .$$</div>
  <p>(Le plan est parallèle à une génératrice du cône exactement quand \(\psi=\frac\pi4\), c'est-à-dire \(e=1\).)</p>
  <p><strong>B1.</strong> \(m(x,y)\in\mathcal C'\) si et seulement s'il existe \(z\) tel que \(M(x,y,z)\in\Gamma\cap\mathcal P_{e,h}\), c'est-à-dire \(z=e(x+h)\) et \(x^2+y^2=z^2\). La cote est imposée par la première condition, et l'on obtient \(x^2+y^2=e^2(x+h)^2\). La cote étant déterminée par \(x\), un point de \(\mathcal C'\) provient d'un seul point de \(\mathcal C\) : la projection est bijective de \(\mathcal C\) sur \(\mathcal C'\).</p>
  <p><strong>B2.</strong> Dans le plan, \(Om=\sqrt{x^2+y^2}\) et \(d(m,\Delta)=|x+h|\). Les deux membres étant positifs, la condition de B1 équivaut à \(Om=e\,d(m,\Delta)\), avec \(O\notin\Delta\) car \(h\gt0\) : \(\mathcal C'\) est la conique de foyer \(O\), de directrice \(\Delta\) et d'excentricité \(e\). La droite \(\Delta\) est la trace de \(\mathcal P_{e,h}\) sur \((xOy)\) (faire \(z=0\) dans \(z=e(x+h)\)). \(\mathcal C'\) est une ellipse si \(e\lt1\), une parabole si \(e=1\), une hyperbole si \(e\gt1\) : avec A2, on retrouve le classement des sections de cône selon l'angle \(\psi\) et le demi-angle \(\frac\pi4\).</p>
  <p><strong>C1.</strong> \(x^2+y^2=\frac14(x+2)^2\) s'écrit \(\frac34x^2-x+y^2=1\), puis \(\frac34\big(x-\frac23\big)^2+y^2=\frac43\), soit</p>
  <div class="formula">$$\frac{\big(x-\frac23\big)^2}{16/9}+\frac{y^2}{4/3}=1 .$$</div>
  <p>Ellipse de centre \(\big(\frac23,0\big)\), de demi-axes \(a=\frac43\) et \(b=\frac{2}{\sqrt3}\) ; \(c=\sqrt{\frac{16}{9}-\frac{12}{9}}=\frac23\) et \(\frac ca=\frac12=e\). Foyers \(\big(\frac23\pm\frac23,0\big)\), soit \(O\) et \(\big(\frac43,0\big)\) ; directrices \(x=\frac23\pm\frac ae=\frac23\pm\frac83\), soit \(x=-2\) (c'est \(\Delta\)) et \(x=\frac{10}{3}\).</p>
  <p><strong>C2.</strong> \(\mathcal C' : t\mapsto\big(\frac23+\frac43\cos t,\ \frac{2}{\sqrt3}\sin t\big)\), \(t\in[0,2\pi[\). On remonte sur \(\mathcal C\) avec \(z=\frac12(x+2)\) :</p>
  <div class="formula">$$\mathcal C :\ t\mapsto\Big(\frac23+\frac43\cos t,\ \frac{2}{\sqrt3}\sin t,\ \frac43+\frac23\cos t\Big).$$</div>
  <p><strong>C3.</strong> La cote \(\frac43+\frac23\cos t\) est maximale pour \(t=0\) et minimale pour \(t=\pi\) : point le plus haut \((2,0,2)\), point le plus bas \(\big(-\frac23,0,\frac23\big)\). Les deux vérifient \(x^2+y^2=z^2\).</p>
  <p><strong>C4.</strong> Pour \(x=0\) : \(y^2=\frac14\cdot4=1\), \(y=\pm1\) : corde de longueur 2. Or \(p=e\,h=1\) et \(\frac{b^2}{a}=\frac{4/3}{4/3}=1\) : la corde focale perpendiculaire à l'axe a pour longueur \(2p\).</p>
  <p><strong>D1.</strong> Sur \(\mathcal Q\), \(z=\frac{x+y+4}{2}\). Comme en B1, la projection de \(\Gamma\cap\mathcal Q\) est la courbe \(x^2+y^2=\frac{(x+y+4)^2}{4}\). Or \(d(m,\Delta')=\frac{|x+y+4|}{\sqrt2}\), donc \(\frac{(x+y+4)^2}{4}=\frac12\,d(m,\Delta')^2\), et la condition s'écrit \(Om=\frac{\sqrt2}{2}\,d(m,\Delta')\) : conique de foyer \(O\), de directrice \(\Delta'\) (trace de \(\mathcal Q\) sur \((xOy)\)) et d'excentricité \(\frac{\sqrt2}{2}\lt1\), donc une ellipse.</p>
  <p><strong>D2.</strong> On a \(x^2+y^2=X^2+Y^2\) (rotation) et \(x+y=\sqrt2\,X\). L'équation devient \(X^2+Y^2=\frac{(\sqrt2X+4)^2}{4}=\frac{X^2}{2}+2\sqrt2\,X+4\), soit \(\frac12\big(X-2\sqrt2\big)^2+Y^2=8\) :</p>
  <div class="formula">$$\frac{\big(X-2\sqrt2\big)^2}{16}+\frac{Y^2}{8}=1 .$$</div>
  <p>Ellipse de demi-axes \(a=4\), \(b=2\sqrt2\), \(c=2\sqrt2\) (et \(\frac ca=\frac{\sqrt2}{2}\)). Centre \(X=2\sqrt2\), \(Y=0\), c'est-à-dire \(x=\frac{X-Y}{\sqrt2}=2\), \(y=\frac{X+Y}{\sqrt2}=2\) : \((2,2)\). Foyers \((2,2)\pm c\,\vec u\) avec \(\vec u=\frac{1}{\sqrt2}(1,1)\) : \(O\) et \((4,4)\).</p>
  <p><strong>D3.</strong> L'angle entre deux plans est celui de leurs normales. Pour \(\mathcal P_{e,h}\), \(\cos\big(\vec n,\vec k\big)=\frac{1}{\sqrt{1+e^2}}\), d'où une tangente égale à \(e\). Pour \(\mathcal Q\), de normale \((1,1,-2)\) : \(\cos=\frac{2}{\sqrt6}\), \(\sin=\sqrt{1-\frac46}=\frac{1}{\sqrt3}\), et la tangente vaut \(\frac{1/\sqrt3}{2/\sqrt6}=\frac{\sqrt2}{2}\), l'excentricité trouvée en D1.</p></div>
