  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 3.5 « Machines thermiques » du programme de PTSI : l'application des deux principes aux machines cycliques <strong>dithermes</strong>. Tout y est exigible en 1ʳᵉ année, sauf la dernière section. Il s'appuie sur <a href="#thermo2/cours">« 1er principe »</a> (travail des forces de pression, gaz parfait, loi de Laplace), <a href="#thermo3/cours">« 2e principe »</a> (bilans d'entropie) et <a href="#changement/cours">« Corps pur diphasé et changements d'état »</a> (diagramme de Clapeyron). Les cycles industriels étudiés organe par organe sont en 2ᵉ année : <a href="#thermoouv/cours">« Systèmes ouverts et thermodynamique industrielle »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Machine thermique cyclique</strong> : définir le système, les sources, le sens des échanges ; analyser un dispositif concret et le modéliser par une machine cyclique ditherme (§1, §10).</li>
        <li><strong>Application des deux principes à un cycle</strong> : bilans d'énergie et d'entropie, inégalité de Clausius, impossibilité du moteur monotherme (§2).</li>
        <li><strong>Interpréter géométriquement le travail</strong> dans un diagramme de Clapeyron ; sens de parcours d'un cycle moteur ou récepteur (§3, partie 3.2 du programme).</li>
        <li><strong>Donner le sens des échanges énergétiques</strong> pour un moteur ou un récepteur thermique ditherme (§4, §6).</li>
        <li><strong>Définir un rendement ou une efficacité</strong> et les relier aux énergies échangées au cours d'un cycle (§4, §6).</li>
        <li><strong>Justifier et utiliser le théorème de Carnot</strong> (§5, §6, §7).</li>
        <li><strong>Analyser des cycles</strong> de gaz parfait décrits par un énoncé (Carnot, Beau de Rochas, Diesel, Stirling) et des machines à changement d'état (§7 à §10). Le nom et le détail de ces cycles ne sont pas à connaître : savoir les analyser l'est.</li>
        <li><strong>Citer quelques ordres de grandeur</strong> des rendements des machines thermiques réelles actuelles (§4, §6, §11).</li>
        <li><strong>Expliquer le principe de la cogénération</strong> (§11).</li>
        <li><strong>Mettre en œuvre une machine thermique cyclique ditherme</strong> (pompe à chaleur pédagogique, moteur de Stirling) (§6, §9).</li>
      </ul>
      <p>Vu en 2ᵉ année (chapitres « Systèmes ouverts et thermodynamique industrielle » et « Thermodynamique différentielle et fluides réels ») : le premier et le second principe pour un fluide en écoulement, le travail indiqué, l'étude organe par organe (compresseur, turbine, détendeur, échangeur), les diagrammes (T, s), (h, s) et (log P, h) des fluides réels et les tables. Un aperçu en est donné en fin de chapitre.</p>

<div class="course-section">
  <div class="sec-num">§1 · MACHINES THERMIQUES ET SOURCES</div>
  <h2>Un fluide qui tourne en rond</h2>
  <div class="intro">Moteur de voiture, centrale électrique, réfrigérateur, climatiseur, pompe à chaleur : toutes ces machines font décrire à un fluide une suite de transformations qui le ramène à son état initial. On peut ainsi les faire fonctionner indéfiniment. Cette section fixe le vocabulaire et la convention de signe, la même pour tout le chapitre.</div>
  <div class="def-box">
    <strong>Machine thermique.</strong> Une <strong>machine thermique</strong> est un dispositif dans lequel un <strong>fluide</strong>, le système étudié, décrit des <strong>cycles</strong> : à la fin de chaque cycle, il retrouve son état initial. Au cours d'un cycle, il reçoit du <strong>travail</strong> \(W\) (forces de pression d'un piston, aubes d'une turbine, compresseur) et des <strong>transferts thermiques</strong> de la part de <strong>sources</strong>. Elle est <strong>ditherme</strong> quand elle échange de l'énergie thermique avec deux sources seulement, une source chaude et une source froide.
  </div>
  <div class="def-box">
    <strong>Source (thermostat).</strong> Une <strong>source de chaleur</strong>, ou thermostat, est un système qui échange de l'énergie thermique sans que sa température varie : l'atmosphère, l'eau d'un fleuve, la flamme d'un brûleur réglée en continu. On note \(T_C\) la température de la source chaude et \(T_F\) celle de la source froide, en kelvins, avec \(T_C \gt T_F\).
  </div>
  <div class="prop-box">
    <strong>Convention de signe (tout le chapitre).</strong> \(W\), \(Q_C\) et \(Q_F\) désignent les énergies <strong>reçues par le fluide</strong> au cours d'un cycle : travail, transfert thermique venu de la source chaude, transfert thermique venu de la source froide. Ce sont des grandeurs algébriques : une énergie que le fluide <em>cède</em> est comptée négativement. C'est la convention des chapitres <a href="#thermo2/cours">« 1er principe »</a> et <a href="#thermo3/cours">« 2e principe »</a> : \(\Delta U = W + Q\).
  </div>
  <p>On distingue deux familles :</p>
  <ul>
    <li>un <strong>moteur</strong> fournit du travail au milieu extérieur : \(W \lt 0\) ;</li>
    <li>un <strong>récepteur</strong> reçoit du travail : \(W \gt 0\). Il sert à faire passer de l'énergie thermique de la source froide vers la source chaude, sens contraire au sens spontané : c'est un réfrigérateur ou un climatiseur (on s'intéresse à la source froide) ou une pompe à chaleur (on s'intéresse à la source chaude).</li>
  </ul>

  <div class="method-box"><strong>Exemple — puissance d'un moteur de voiture</strong>
    <p>Un moteur à quatre cylindres et à quatre temps tourne à 3 000 tours par minute. Chaque cylindre réalise un cycle tous les deux tours, et l'air de chaque cylindre fournit \(|W| \approx 400\ \text{J}\) par cycle (valeur calculée au §8).</p>
    <ol>
      <li>Fréquence des cycles d'un cylindre : \(f = \dfrac{3\,000}{60 \times 2} = 25\ \text{cycles par seconde}\).</li>
      <li>Puissance mécanique : \(\mathcal P = 4 \times f \times |W| = 4 \times 25 \times 400 = 4{,}0\times10^{4}\ \text{W}\), soit 40 kW.</li>
    </ol>
    <p>Une puissance est une énergie par cycle multipliée par le nombre de cycles par seconde : tous les bilans de ce chapitre, écrits par cycle, se transposent en puissances.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour système « le moteur » ou « la machine ». Le système est le <strong>fluide</strong> (l'air du cylindre, l'eau de la centrale, le fluide frigorigène) ; c'est lui qui décrit un cycle. Dans un moteur à combustion interne, l'air est renouvelé à chaque cycle : on le modélise par une masse d'air fixe qui reçoit l'énergie de la combustion comme d'une source (§8).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · BILANS SUR UN CYCLE</div>
  <h2>Premier principe, second principe et inégalité de Clausius</h2>
  <div class="intro">Sur un cycle, l'énergie interne et l'entropie du fluide reviennent à leur valeur initiale, puisque ce sont des fonctions d'état. Les deux principes se réduisent alors à deux relations simples entre \(W\), \(Q_C\) et \(Q_F\). Elles suffisent à démontrer tout le reste du chapitre.</div>
  <div class="prop-box">
    <strong>Premier principe sur un cycle.</strong> \(\Delta U_{\text{cycle}} = 0\) (le fluide est macroscopiquement au repos d'un cycle à l'autre), donc pour une machine ditherme :
    <div class="formula" data-nom="Premier principe sur un cycle ditherme">$$W + Q_C + Q_F = 0$$</div>
  </div>
  <div class="prop-box">
    <strong>Second principe sur un cycle : inégalité de Clausius.</strong> \(\Delta S_{\text{cycle}} = 0\) et \(\Delta S = S_{\text{éch}} + S_{\text{créée}}\) avec \(S_{\text{éch}} = \dfrac{Q_C}{T_C} + \dfrac{Q_F}{T_F}\) et \(S_{\text{créée}} \ge 0\). Donc :
    <div class="formula" data-nom="Inégalité de Clausius (cycle ditherme)">$$\frac{Q_C}{T_C} + \frac{Q_F}{T_F} = -S_{\text{créée}} \le 0$$</div>
    avec égalité si et seulement si le cycle est réversible. Pour une machine en contact avec \(N\) sources : \(\displaystyle\sum_{i=1}^{N} \frac{Q_i}{T_i} \le 0\).
  </div>
  <p>Les températures qui figurent dans \(S_{\text{éch}}\) sont celles des <strong>sources</strong>, pas celles du fluide (chapitre <a href="#thermo3/cours">« 2e principe »</a>). Le fluide peut avoir, pendant l'échange, une température bien différente : c'est précisément une cause d'irréversibilité.</p>
  <div class="prop-box">
    <strong>Pas de moteur monotherme.</strong> Une machine cyclique en contact avec une seule source ne peut pas fournir de travail : \(W \ge 0\). Il faut une source froide pour « jeter » une partie de l'énergie reçue.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Une seule source impose W ≥ 0</span><div class="content">
    <p>Avec une seule source à \(T_0\) : premier principe \(W + Q = 0\) ; inégalité de Clausius \(Q/T_0 \le 0\), donc \(Q \le 0\) et \(W = -Q \ge 0\). La machine ne peut que transformer du travail en chaleur (frottement, effet Joule), jamais l'inverse sur un cycle : c'est l'énoncé historique du second principe par Kelvin.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — tester une machine annoncée par un inventeur</strong>
    <p>Un inventeur annonce un moteur qui, entre une source à 400 K et une source à 300 K, reçoit \(Q_C = 1\,000\ \text{J}\) par cycle et fournit 300 J de travail. Est-ce possible ?</p>
    <ol>
      <li>Convention : \(W = -300\ \text{J}\), \(Q_C = 1\,000\ \text{J}\).</li>
      <li>Premier principe : \(Q_F = -W - Q_C = 300 - 1\,000 = -700\ \text{J}\) (700 J cédés à la source froide).</li>
      <li>Clausius : \(\dfrac{Q_C}{T_C} + \dfrac{Q_F}{T_F} = \dfrac{1\,000}{400} - \dfrac{700}{300} = 2{,}50 - 2{,}33 = +0{,}17\ \text{J·K}^{-1} \gt 0\).</li>
      <li>Conclusion : l'entropie créée serait négative, ce que le second principe interdit. La machine est <strong>impossible</strong>, bien qu'elle respecte la conservation de l'énergie.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire le bilan d'entropie avec \(|Q_F|\) d'un côté et \(Q_C\) de l'autre, en « corrigeant les signes à la main ». Avec la convention de l'énergie reçue, on écrit toujours \(Q_C/T_C + Q_F/T_F\) tel quel ; c'est le signe de \(Q_F\) qui porte l'information.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LE CYCLE DANS LES DIAGRAMMES</div>
  <h2>Sens de parcours et aires</h2>
  <div class="intro">Un cycle formé de transformations quasi statiques se dessine comme une courbe fermée. Le sens dans lequel on la parcourt dit si la machine est motrice ou réceptrice, et son aire mesure le travail échangé : c'est la lecture la plus rapide d'un cycle.</div>
  <div class="prop-box">
    <strong>Diagramme de Clapeyron (P, V).</strong> Pour un cycle quasi statique, le travail reçu par le fluide vaut
    <div class="formula" data-nom="Travail sur un cycle">$$W = -\oint P\,\mathrm{d}V$$</div>
    et \(|W|\) est l'aire intérieure du cycle. Parcouru dans le <strong>sens horaire</strong> (volume en abscisse), le cycle est <strong>moteur</strong> : \(W \lt 0\) ; dans le <strong>sens trigonométrique</strong>, il est <strong>récepteur</strong> : \(W \gt 0\).
  </div>
  <p>Pourquoi ? Sur la branche du haut, parcourue vers la droite (détente, \(\mathrm{d}V \gt 0\)), le fluide fournit un travail égal à l'aire sous cette branche ; sur la branche du bas, parcourue vers la gauche (compression), il en reçoit un plus petit, égal à l'aire sous la branche basse. Le bilan est l'aire comprise entre les deux, fournie par le fluide.</p>
  <div class="prop-box">
    <strong>Diagramme entropique (T, S).</strong> Pour une transformation réversible, \(\delta Q = T\,\mathrm{d}S\), donc le transfert thermique reçu sur un cycle réversible vaut \(Q_{\text{cycle}} = \oint T\,\mathrm{d}S\), aire intérieure du cycle dans le plan (S, T). Comme \(W = -Q_{\text{cycle}}\), un cycle réversible parcouru dans le sens horaire dans ce plan est aussi moteur.
  </div>

  <div class="method-box"><strong>Exemple — un cycle rectangulaire de gaz parfait</strong>
    <p>0,04 mol d'air (gaz parfait diatomique, \(C_V = \tfrac52 nR\), \(C_P = \tfrac72 nR\)) décrit le cycle ABCD de la figure : A (1 L ; 1 bar) → B (1 L ; 2 bar) → C (2 L ; 2 bar) → D (2 L ; 1 bar) → A.</p>

      <li>Travail : le cycle est parcouru dans le sens horaire, \(W = -(P_B - P_A)(V_C - V_B) = -(1\times10^{5})(1\times10^{-3}) = -100\ \text{J}\) : moteur.</li>
      <li>Transferts thermiques (avec \(nRT = PV\)) : isochore AB, \(Q_{AB} = \tfrac52 V_A(P_B - P_A) = +250\ \text{J}\) ; isobare BC, \(Q_{BC} = \tfrac72 P_B(V_C - V_B) = +700\ \text{J}\) ; isochore CD, \(Q_{CD} = \tfrac52 V_C(P_D - P_C) = -500\ \text{J}\) ; isobare DA, \(Q_{DA} = \tfrac72 P_A(V_A - V_D) = -350\ \text{J}\).</li>

    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§4 · MOTEUR DITHERME ET RENDEMENT</div>
  <h2>Ce qu'on paie, ce qu'on obtient</h2>
  <div class="intro">Un moteur prend de l'énergie à la source chaude, en convertit une partie en travail et cède le reste à la source froide. Les deux principes imposent ce sens des échanges ; le rendement mesure la part convertie.</div>
  <div class="prop-box">
    <strong>Sens des échanges d'un moteur ditherme.</strong> Si \(W \lt 0\), alors nécessairement \(Q_C \gt 0\) et \(Q_F \lt 0\) : le moteur <strong>reçoit</strong> de l'énergie de la source chaude et en <strong>cède</strong> à la source froide.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Raisonner par l'absurde avec les deux principes</span><div class="content">
    <p>\(W \lt 0\) et le premier principe donnent \(Q_C + Q_F = -W \gt 0\). Supposons \(Q_F \ge 0\). Clausius donne \(Q_C \le -\dfrac{T_C}{T_F}Q_F\), d'où \(Q_C + Q_F \le Q_F\left(1 - \dfrac{T_C}{T_F}\right) \le 0\) puisque \(T_C \gt T_F\) : contradiction. Donc \(Q_F \lt 0\), puis \(Q_C \gt -Q_F \gt 0\).</p>
  </div></div>
  <p>Le <strong>diagramme de Raveau</strong> résume les possibilités : on place chaque cycle par le point \((Q_F, Q_C)\) ; le second principe interdit un demi-plan, et le signe de \(W = -(Q_C + Q_F)\) sépare les moteurs des récepteurs.</p>

  <div class="def-box">
    <strong>Rendement d'un moteur.</strong> Rapport de l'énergie utile (le travail fourni, \(-W\)) à l'énergie coûteuse (le transfert thermique reçu de la source chaude, payé en combustible) :
    <div class="formula" data-nom="Rendement d'un moteur ditherme">$$\eta = \frac{-W}{Q_C} = 1 + \frac{Q_F}{Q_C}$$</div>
    La seconde forme vient du premier principe. Comme \(Q_F \lt 0\), on a \(\eta \lt 1\) : il faut toujours céder de l'énergie à la source froide.
  </div>
  <div class="method-box"><strong>Exemple — rendement d'une voiture sur route</strong>
    <p>À 90 km·h⁻¹, une voiture consomme 5,0 L d'essence aux 100 km et son moteur fournit 12 kW. Le pouvoir calorifique de l'essence vaut environ 32 MJ par litre.</p>
    <ol>
      <li>Consommation horaire : \(5{,}0 \times 0{,}90 = 4{,}5\ \text{L·h}^{-1}\).</li>
      <li>Puissance thermique reçue de la combustion : \(\dfrac{4{,}5 \times 32\times10^{6}}{3\,600} = 4{,}0\times10^{4}\ \text{W}\).</li>
      <li>Rendement : \(\eta = \dfrac{12}{40} = 0{,}30\) ; les 28 kW restants partent dans les gaz d'échappement et le radiateur.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\eta = W/Q_C\) avec la convention du travail reçu, ce qui donne un rendement négatif. Avec \(W\) reçu par le fluide, le travail fourni est \(-W\). Autre piège : le dénominateur n'est pas « toute l'énergie échangée » mais seulement celle qu'on paie, \(Q_C\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · THÉORÈME DE CARNOT</div>
  <h2>Une borne qui ne dépend que des températures</h2>
  <div class="intro">Peut-on construire un moteur de rendement 0,9 entre une chaudière à 300 °C et l'air ambiant ? Le théorème de Carnot répond sans rien savoir de la machine : le rendement est borné par une valeur fixée par les deux températures des sources.</div>
  <div class="prop-box">
    <strong>Théorème de Carnot (moteur).</strong> Le rendement d'un moteur ditherme fonctionnant entre des sources à \(T_C\) et \(T_F\) vérifie
    <div class="formula" data-nom="Rendement de Carnot">$$\eta \le \eta_C = 1 - \frac{T_F}{T_C}$$</div>
    L'égalité a lieu si et seulement si le cycle est <strong>réversible</strong>. Tous les moteurs dithermes réversibles entre les mêmes sources ont donc le même rendement, quel que soit le fluide.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Deux lignes, à partir de Clausius</span><div class="content">
    <p>Pour un moteur, \(Q_C \gt 0\). En divisant l'inégalité de Clausius par \(Q_C/T_F \gt 0\) : \(\dfrac{T_F}{T_C} + \dfrac{Q_F}{Q_C} \le 0\), soit \(\dfrac{Q_F}{Q_C} \le -\dfrac{T_F}{T_C}\). Donc \(\eta = 1 + \dfrac{Q_F}{Q_C} \le 1 - \dfrac{T_F}{T_C}\), avec égalité si et seulement si \(S_{\text{créée}} = 0\).</p>
  </div></div>
  <p>Plus précisément, en éliminant \(Q_F\) entre les deux bilans, le travail fourni s'écrit</p>
  <div class="formula" data-nom="Travail perdu par irréversibilité">$$-W = \eta_C\,Q_C - T_F\,S_{\text{créée}}$$</div>
  <p>Chaque joule par kelvin d'entropie créée fait perdre \(T_F\) joules de travail : frottements, transferts thermiques sous un écart de température fini, combustion, détentes brutales sont autant de pertes.</p>
  <div class="method-box"><strong>Exemple — centrale au charbon</strong>
    <p>La vapeur d'une centrale atteint 547 °C (\(T_C = 820\ \text{K}\)) et le condenseur est refroidi par une rivière à 27 °C (\(T_F = 300\ \text{K}\)). Le rendement réel est 0,42. Pour \(Q_C = 1{,}0\ \text{MJ}\) :</p>
    <ol>
      <li>\(\eta_C = 1 - \dfrac{300}{820} = 0{,}63\).</li>
      <li>Travail fourni : \(0{,}42\ \text{MJ}\) au lieu de \(0{,}63\ \text{MJ}\) ; manque \(0{,}21\ \text{MJ}\).</li>
      <li>Entropie créée, d'après la formule ci-dessus : \(S_{\text{créée}} = \dfrac{(\eta_C - \eta)\,Q_C}{T_F}\) \(= \dfrac{0{,}214\times10^{6}}{300} \approx 7{,}1\times10^{2}\ \text{J·K}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : calculer \(\eta_C\) avec des températures Celsius. Entre 100 °C et 20 °C, \(1 - 20/100 = 0{,}80\) est faux ; \(1 - 293/373 = 0{,}21\) est juste. Une machine qui ne dispose que d'un faible écart de température (eau chaude solaire, géothermie peu profonde, chaleur des océans) a un rendement de Carnot faible.</div>
  <p><strong>Ordres de grandeur.</strong> Le rendement de Carnot croît avec \(T_C\) : on cherche les plus hautes températures que supportent les matériaux. Centrale nucléaire à eau pressurisée (vapeur vers 285 °C, condenseur vers 30 °C) : \(\eta_C \approx 0{,}46\), rendement réel 0,33. Turbine à gaz (gaz à 1 400 °C) : \(\eta_C \approx 0{,}83\), rendement réel d'environ 0,40, et jusqu'à 0,62 en cycle combiné avec une turbine à vapeur (§11).</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉFRIGÉRATEUR, CLIMATISEUR, POMPE À CHALEUR</div>
  <h2>Faire remonter la chaleur, contre le sens naturel</h2>
  <div class="intro">Spontanément, l'énergie thermique passe du chaud vers le froid. Un récepteur ditherme fait l'inverse au prix d'un travail. Selon la source qui intéresse l'utilisateur, la même machine est un réfrigérateur ou une pompe à chaleur.</div>
  <div class="prop-box">
    <strong>Sens des échanges d'un récepteur utile.</strong> Un récepteur ditherme (\(W \gt 0\)) qui prend de l'énergie à la source froide (\(Q_F \gt 0\)) en cède à la source chaude : \(Q_C \lt 0\), avec \(-Q_C = W + Q_F \gt Q_F\). Sans travail (\(W = 0\)), le passage du froid vers le chaud est impossible : c'est l'énoncé du second principe par Clausius.
  </div>
  <div class="def-box">
    <strong>Efficacités.</strong> Rapport de l'énergie utile au travail payé (en électricité). On les appelle aussi coefficients de performance (COP).
    <div class="formula" data-nom="Efficacité d'un réfrigérateur">$$e_F = \frac{Q_F}{W}$$</div>
    <div class="formula" data-nom="Efficacité d'une pompe à chaleur">$$e_{PAC} = \frac{-Q_C}{W} = 1 + e_F$$</div>
    La relation \(e_{PAC} = 1 + e_F\) (pour une même machine) vient du premier principe. Un <strong>climatiseur</strong> est un réfrigérateur dont la source froide est l'intérieur d'un local.
  </div>
  <div class="prop-box">
    <strong>Théorème de Carnot (récepteurs).</strong> Avec les mêmes sources, les efficacités sont bornées par celles du cycle réversible :
    <div class="formula" data-nom="Efficacités de Carnot">$$e_F \le e_{F,C} = \frac{T_F}{T_C - T_F} \qquad e_{PAC} \le e_{PAC,C} = \frac{T_C}{T_C - T_F}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Même méthode que pour le moteur</span><div class="content">
    <p>Clausius avec \(Q_F \gt 0\) : \(Q_C \le -\dfrac{T_C}{T_F}Q_F\), donc \(W = -Q_C - Q_F \ge Q_F\left(\dfrac{T_C}{T_F} - 1\right)\) et \(e_F = \dfrac{Q_F}{W} \le \dfrac{T_F}{T_C - T_F}\). Pour la pompe à chaleur : \(Q_F \le -\dfrac{T_F}{T_C}Q_C\), donc \(W = -Q_C - Q_F \ge -Q_C\left(1 - \dfrac{T_F}{T_C}\right)\) et \(e_{PAC} \le \dfrac{T_C}{T_C - T_F}\).</p>
  </div></div>
  <p>Une efficacité peut dépasser 1, et c'est tout l'intérêt de la pompe à chaleur : elle « pompe » de l'énergie gratuite dans l'air extérieur ou dans le sol, et le travail électrique ne sert qu'à la faire remonter en température. Les efficacités de Carnot sont d'autant plus grandes que l'écart \(T_C - T_F\) est faible.</p>
  <div class="method-box"><strong>Exemple — chauffer une maison</strong>
    <p>Une maison perd 8,0 kW quand il fait 0 °C dehors et 20 °C dedans.</p>
    <ol>
      <li>Radiateurs électriques : ils transforment intégralement l'électricité en chaleur, il faut 8,0 kW électriques.</li>
      <li>Pompe à chaleur idéale : \(e_{PAC,C} = \dfrac{293{,}15}{20} \approx 15\), il suffirait de 0,55 kW.</li>
      <li>Pompe à chaleur réelle air-eau d'efficacité 3,5 : \(\mathcal P_{\text{élec}} = \dfrac{8{,}0}{3{,}5} \approx 2{,}3\ \text{kW}\), soit 3,5 fois moins que les radiateurs ; les 5,7 kW restants sont pris à l'air extérieur.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — congélateur et climatiseur</strong>
    <p>Congélateur à −18 °C dans une cuisine à 20 °C : \(e_{F,C} = \dfrac{255{,}15}{38} \approx 6{,}7\) ; un appareil réel atteint 1,5 à 2. Climatiseur entre 25 °C (intérieur) et 35 °C (extérieur) : \(e_{F,C} \approx 30\) ; les appareils réels affichent 3 à 4. L'écart vient surtout de ce que le fluide doit être plus froid que la source froide et plus chaud que la source chaude pour que la chaleur circule (§10).</p>
  </div>
  <h3>Mettre en œuvre une pompe à chaleur</h3>
  <p>Une pompe à chaleur pédagogique relie deux seaux d'eau : l'évaporateur plonge dans le seau froid, le condenseur dans le seau chaud, un wattmètre mesure la puissance électrique \(\mathcal P\) du compresseur. On relève les températures \(\theta_C(t)\) et \(\theta_F(t)\) au cours du temps. Si le seau chaud (masse \(m\), capacité \(c\)) ne perd rien, la puissance thermique qu'il reçoit est \(-\dot Q_C = m\,c\,\dfrac{\mathrm d\theta_C}{\mathrm dt}\), d'où l'efficacité instantanée</p>
  <div class="formula" data-nom="Efficacité mesurée d'une pompe à chaleur">$$e_{PAC}(t) = \frac{m\,c}{\mathcal P}\,\frac{\mathrm d\theta_C}{\mathrm dt}$$</div>
  <div class="method-box"><strong>Exemple — exploiter les relevés</strong>
    <p>Deux seaux de 4,0 kg d'eau (\(c = 4\,180\ \text{J·K}^{-1}\text{·kg}^{-1}\)), compresseur de 120 W.</p>
    <ol>
      <li>Au départ, les deux seaux sont à 20 °C et \(\theta_C\) monte de 1,3 K par minute : \(e_{PAC} = \dfrac{4{,}0 \times 4\,180}{120} \times \dfrac{1{,}3}{60} \approx 3{,}0\).</li>
      <li>Vingt minutes plus tard, \(\theta_C = 38\ °\text{C}\), \(\theta_F = 4\ °\text{C}\), et la pente n'est plus que 0,85 K par minute : \(e_{PAC} \approx 2{,}0\). L'efficacité baisse quand l'écart de température se creuse, comme le prévoit Carnot (ici \(e_{PAC,C} = 311/34 \approx 9{,}2\)).</li>
      <li>Les seaux ne sont pas des thermostats : leurs températures varient. Le modèle ditherme vaut sur une courte durée, pendant laquelle elles sont presque fixes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(e_{PAC}\) pour un réfrigérateur (ou l'inverse). On se demande toujours : « qu'est-ce qui intéresse l'utilisateur ? » L'énergie prise au froid pour un réfrigérateur, l'énergie donnée au chaud pour une pompe à chaleur. Laisser la porte d'un réfrigérateur ouverte réchauffe la cuisine : la machine lui rend \(Q_F + W\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LE CYCLE DE CARNOT D'UN GAZ PARFAIT</div>
  <h2>Le seul cycle ditherme réversible</h2>
  <div class="intro">Pour qu'un cycle ditherme soit réversible, le fluide ne doit échanger de chaleur qu'à la température de la source avec laquelle il est en contact, et passer d'une température à l'autre sans échange. D'où un cycle unique, décrit par Sadi Carnot en 1824.</div>
  <div class="def-box">
    <strong>Cycle de Carnot.</strong> Deux <strong>isothermes réversibles</strong> (au contact de chaque source, à sa température) reliées par deux <strong>adiabatiques réversibles</strong> (isentropiques). Dans le diagramme (S, T), c'est un rectangle.
  </div>

</figure>
  <div class="method-box"><strong>Exemple — calcul complet pour 0,1 mol d'air</strong>
    <p>\(n = 0{,}10\ \text{mol}\), \(\gamma = 1{,}4\), \(T_C = 600\ \text{K}\), \(T_F = 300\ \text{K}\). État 1 : \(V_1 = 1{,}0\ \text{L}\) ; la détente isotherme double le volume : \(V_2 = 2{,}0\ \text{L}\).</p>
    <ol>
      <li>Isotherme 1 → 2 (\(\Delta U = 0\)) : \(Q_C = -W_{12} = nRT_C\ln\dfrac{V_2}{V_1} = 0{,}10 \times 8{,}314 \times 600 \times \ln 2 = 346\ \text{J}\).</li>
      <li>Adiabatique 2 → 3 (loi de Laplace \(TV^{\gamma - 1} = \text{cste}\)) : \(V_3 = V_2\left(\dfrac{T_C}{T_F}\right)^{1/(\gamma - 1)} = 2{,}0 \times 2^{2{,}5} = 11{,}3\ \text{L}\) ; de même \(V_4 = V_1 \times 2^{2{,}5} = 5{,}66\ \text{L}\), d'où \(V_3/V_4 = V_2/V_1\).</li>
      <li>Isotherme 3 → 4 : \(Q_F = nRT_F\ln\dfrac{V_4}{V_3} = -nRT_F\ln 2 = -173\ \text{J}\).</li>
      <li>Les adiabatiques échangent des travaux opposés : \(W_{23} = C_V(T_F - T_C) = -624\ \text{J}\) et \(W_{41} = +624\ \text{J}\).</li>
      <li>\(W = -(Q_C + Q_F) = -173\ \text{J}\) et \(\eta = 173/346 = 0{,}50 = 1 - T_F/T_C\) : on retrouve le théorème de Carnot, et \(Q_C/T_C + Q_F/T_F = 0{,}576 - 0{,}576 = 0\).</li>
    </ol>
  </div>
  <p>Pourquoi ne construit-on pas de moteurs de Carnot ? Les échanges isothermes réversibles exigent un écart de température infinitésimal entre fluide et source, donc une lenteur extrême : la puissance tend vers zéro. Et le cycle est très étroit dans le diagramme de Clapeyron : un volume balayé de plus de 10 L pour 173 J. Le cycle de Carnot est une <strong>référence</strong>, pas un modèle de machine.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire que « réversible » suffit à donner le rendement de Carnot à n'importe quel cycle. Un cycle réversible qui échange de la chaleur à des températures variables (cycle rectangulaire du §3, cycles du §8) n'est pas ditherme ; son rendement est inférieur à celui de Carnot entre ses températures extrêmes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · MOTEURS À COMBUSTION INTERNE</div>
  <h2>Cycles de Beau de Rochas et de Diesel</h2>
  <div class="intro">Dans un moteur de voiture, le carburant brûle dans le cylindre même. On modélise ce fonctionnement par un cycle d'air, gaz parfait de masse fixe, qui reçoit l'énergie de combustion d'une « source chaude » fictive. Le modèle n'est pas ditherme, mais il explique le rôle décisif du rapport volumétrique.</div>
  <h3>Les quatre temps</h3>
  <p>Un piston se déplace entre un volume minimal \(V_{\min}\) (point mort haut) et un volume maximal \(V_{\max}\) (point mort bas). En deux tours de vilebrequin : <strong>admission</strong> du mélange air-carburant, <strong>compression</strong>, <strong>combustion et détente</strong> (seul temps moteur), <strong>échappement</strong>. Le <strong>rapport volumétrique</strong> est \(a = V_{\max}/V_{\min}\).</p>
  <div class="def-box">
    <strong>Cycle modèle de Beau de Rochas (moteur à essence, cycle d'Otto).</strong> 1 → 2 compression adiabatique réversible ; 2 → 3 combustion <strong>isochore</strong> (très rapide, déclenchée par la bougie), le gaz reçoit \(Q_{23} \gt 0\) ; 3 → 4 détente adiabatique réversible ; 4 → 1 ouverture de l'échappement, modélisée par une isochore où le gaz cède \(Q_{41} \lt 0\).
  </div>
  <div class="prop-box">
    <strong>Rendement du cycle de Beau de Rochas.</strong>
    <div class="formula" data-nom="Rendement de Beau de Rochas">$$\eta = 1 - a^{1-\gamma}$$</div>
    Il ne dépend que du rapport volumétrique et croît avec lui.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Deux isochores et la loi de Laplace</span><div class="content">
    <p>Isochores : \(Q_{23} = C_V(T_3 - T_2) \gt 0\) et \(Q_{41} = C_V(T_1 - T_4) \lt 0\). Donc \(\eta = 1 + \dfrac{Q_{41}}{Q_{23}} = 1 - \dfrac{T_4 - T_1}{T_3 - T_2}\). Laplace sur les adiabatiques réversibles : \(T_2 = T_1 a^{\gamma - 1}\) et \(T_3 = T_4 a^{\gamma - 1}\), d'où \(T_3 - T_2 = (T_4 - T_1)\,a^{\gamma - 1}\) et \(\eta = 1 - a^{1 - \gamma}\).</p>
  </div></div>

<figcaption>Cycles modèles calculés pour un cylindre de cylindrée 500 cm³ rempli d'air (gaz parfait, \( \gamma = 1{,}4 \)) admis à 1 bar et 300 K. À gauche, Beau de Rochas de rapport volumétrique \( a = 10 \), combustion isochore jusqu'à 2 200 K : pression maximale 73 bar. À droite, Diesel de rapport volumétrique 18 et de rapport de détente préalable \( b = 2 \) : compression jusqu'à 57 bar et 953 K, assez pour enflammer le gazole sans bougie. Dans les deux cas, 1 → 2 et 3 → 4 sont des adiabatiques réversibles et 4 → 1 modélise l'échappement et l'admission par une isochore.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — un cylindre de 500 cm³</strong>
    <p>Cylindrée \(V_{\max} - V_{\min} = 500\ \text{cm}^3\), \(a = 10\), air admis à 1,0 bar et 300 K, \(\gamma = 1{,}4\), température en fin de combustion \(T_3 = 2\,200\ \text{K}\).</p>
    <ol>
      <li>\(V_{\max} = 556\ \text{cm}^3\), \(V_{\min} = 55{,}6\ \text{cm}^3\) ; quantité d'air : \(n = \dfrac{P_1V_{\max}}{RT_1} = 2{,}23\times10^{-2}\ \text{mol}\).</li>
      <li>Fin de compression : \(T_2 = 300 \times 10^{0{,}4} = 754\ \text{K}\) et \(P_2 = 10^{1{,}4} = 25{,}1\ \text{bar}\). Fin de combustion : \(P_3 = P_2\,T_3/T_2 = 73\ \text{bar}\). Fin de détente : \(T_4 = 2\,200/10^{0{,}4} = 876\ \text{K}\).</li>
      <li>Par mole, \(C_{V,m} = R/(\gamma - 1) = 20{,}8\ \text{J·K}^{-1}\text{·mol}^{-1}\) : \(Q_{23} = 30{,}1\ \text{kJ}\), \(Q_{41} = -12{,}0\ \text{kJ}\), \(W = -18{,}1\ \text{kJ}\) ; \(\eta = 0{,}60 = 1 - 10^{-0{,}4}\).</li>
      <li>Par cycle : \(W = -18{,}1\times10^{3} \times 2{,}23\times10^{-2} \approx -403\ \text{J}\), la valeur utilisée au §1.</li>
    </ol>
    <p>Le moteur réel n'atteint que 30 à 38 % : combustion non instantanée, pertes thermiques par les parois, frottements, pompage de l'air, mélange qui n'est pas de l'air pur.</p>
  </div>
  <p>Pourquoi ne pas augmenter \(a\) indéfiniment ? Le mélange comprimé s'échauffe ; au-delà de \(a \approx 10\) à 13, il s'enflamme spontanément avant l'étincelle (cliquetis), ce qui détruit le moteur. Le <strong>moteur Diesel</strong> tourne la difficulté : il ne comprime que de l'air, assez fort pour que le gazole injecté s'enflamme seul.</p>
  <div class="def-box">
    <strong>Cycle modèle de Diesel.</strong> Il diffère du précédent par la combustion, <strong>isobare</strong> (2 → 3) : l'injection dure pendant le début de la détente. On note \(b = V_3/V_2\) le rapport de détente préalable (ou d'injection).
    <div class="formula" data-nom="Rendement de Diesel">$$\eta = 1 - \frac{a^{1-\gamma}}{\gamma}\,\frac{b^{\gamma} - 1}{b - 1}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Une isobare, une isochore et Laplace</span><div class="content">
    <p>\(Q_{23} = C_P(T_3 - T_2)\) (isobare) et \(Q_{41} = C_V(T_1 - T_4)\), donc \(\eta = 1 - \dfrac{T_4 - T_1}{\gamma\,(T_3 - T_2)}\). Laplace : \(T_2 = T_1 a^{\gamma - 1}\) ; isobare : \(T_3 = b\,T_2\) ; détente de \(V_3 = bV_2\) à \(V_1 = aV_2\) : \(T_4 = T_3\left(\dfrac{b}{a}\right)^{\gamma - 1} = T_1 b^{\gamma}\). D'où \(T_4 - T_1 = T_1(b^{\gamma} - 1)\) et \(T_3 - T_2 = T_1 a^{\gamma - 1}(b - 1)\).</p>
  </div></div>
  <div class="method-box"><strong>Exemple — Diesel ou essence ?</strong>
    <ol>
      <li>Diesel, \(a = 18\), \(b = 2{,}0\), \(\gamma = 1{,}4\) : \(\dfrac{18^{-0{,}4}}{1{,}4} \times \dfrac{2^{1{,}4} - 1}{1} = \dfrac{0{,}315 \times 1{,}639}{1{,}4} = 0{,}368\), donc \(\eta = 0{,}63\). Fin de compression : \(T_2 = 300 \times 18^{0{,}4} = 953\ \text{K}\), au-dessus de la température d'auto-inflammation du gazole (environ 500 K).</li>
      <li>Beau de Rochas au même \(a = 18\) : \(\eta = 1 - 18^{-0{,}4} = 0{,}69\), mieux que le Diesel ; mais ce rapport est interdit par le cliquetis. À \(a = 10\), \(\eta = 0{,}60\).</li>
      <li>Conclusion : à rapport volumétrique égal, la combustion isochore est meilleure ; en pratique, le Diesel l'emporte parce qu'il comprime davantage (rendements réels 40 à 45 % pour les gros moteurs).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(\eta_C = 1 - T_F/T_C\) à ces cycles. Ils ne sont pas dithermes ; le rendement de Carnot entre leurs températures extrêmes (300 K et 2 200 K : 0,86) n'est qu'une borne. Les énoncés décrivent toujours le cycle étudié : on n'a pas à connaître par cœur ces modèles, mais à savoir les analyser transformation par transformation.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · MOTEUR DE STIRLING</div>
  <h2>Une combustion externe et un régénérateur</h2>
  <div class="intro">Le moteur de Stirling enferme une masse fixe de gaz (air, hélium, hydrogène) chauffée de l'extérieur : il accepte n'importe quelle source chaude (flamme, soleil concentré, eau chaude) et fonctionne en silence. C'est aussi la machine de travaux pratiques la plus courante, utilisable en moteur ou en pompe à chaleur.</div>
  <div class="def-box">
    <strong>Cycle modèle de Stirling.</strong> 1 → 2 détente isotherme à \(T_C\) ; 2 → 3 refroidissement isochore à \(V_{\max}\) ; 3 → 4 compression isotherme à \(T_F\) ; 4 → 1 échauffement isochore à \(V_{\min}\). Un <strong>régénérateur</strong> (matériau poreux traversé par le gaz) stocke l'énergie cédée sur l'isochore 2 → 3 et la rend sur l'isochore 4 → 1.
  </div>

  <div class="prop-box">
    <strong>Rendement.</strong> Avec un régénérateur parfait, les isochores n'échangent rien avec les sources : seules les isothermes échangent avec \(T_C\) et \(T_F\), le cycle est ditherme réversible et \(\eta = \eta_C = 1 - T_F/T_C\). Sans régénérateur, la source chaude doit aussi fournir l'échauffement isochore et le rendement chute.
  </div>
  <div class="method-box"><strong>Exemple — l'intérêt du régénérateur</strong>
    <p>Une mole d'hélium (\(C_{V,m} = \tfrac32 R\)) entre \(T_C = 900\ \text{K}\) et \(T_F = 300\ \text{K}\), rapport volumétrique \(a = 2\).</p>
    <ol>
      <li>Isothermes : \(Q_{12} = RT_C\ln a = 5\,187\ \text{J}\) ; \(Q_{34} = -RT_F\ln a = -1\,729\ \text{J}\) ; travail \(W = -R(T_C - T_F)\ln a = -3\,458\ \text{J}\).</li>
      <li>Isochores : \(Q_{41} = \tfrac32 R(T_C - T_F) = 7\,483\ \text{J} = -Q_{23}\).</li>
      <li>Régénérateur parfait : la source chaude fournit seulement \(Q_{12}\), \(\eta = 3\,458/5\,187 = 0{,}67 = \eta_C\).</li>
      <li>Sans régénérateur : elle fournit \(Q_{12} + Q_{41} = 12\,670\ \text{J}\), \(\eta = 0{,}27\). Le régénérateur multiplie le rendement par 2,4.</li>
    </ol>
    <p>Les moteurs réels (générateurs solaires « parabole-Stirling ») atteignent 25 à 32 % ; les petits moteurs de démonstration, à peine 1 %.</p>
  </div>
  <h3>Mise en œuvre en travaux pratiques</h3>
  <p>Un moteur de Stirling instrumenté (capteurs de pression et de position du piston, thermocouples) permet de tracer le cycle réel dans le diagramme (P, V), d'en mesurer l'aire (travail indiqué), de la comparer au travail mécanique mesuré au frein, et à l'énergie fournie par la résistance chauffante. Entraîné par un moteur électrique, le même appareil fonctionne en pompe à chaleur ou en réfrigérateur : le sens de parcours du cycle s'inverse.</p>
  <div class="notice"><strong>Erreur classique</strong> : compter les échanges sur les isochores avec les sources quand l'énoncé précise un régénérateur parfait. Bien lire : « le régénérateur restitue intégralement » signifie que seules les isothermes échangent avec l'extérieur.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · MACHINES À CHANGEMENT D'ÉTAT</div>
  <h2>Centrales à vapeur et machines frigorifiques</h2>
  <div class="intro">Les grandes machines (centrales électriques, réfrigérateurs, pompes à chaleur) utilisent un fluide qui change d'état. La vaporisation et la liquéfaction échangent beaucoup d'énergie à température constante : ce sont des échanges presque isothermes, proches de ceux du cycle de Carnot.</div>
  <h3>Analyser un dispositif concret</h3>
  <p>Le fluide circule en boucle, en régime permanent, à travers des <strong>organes</strong> : chacun ne fait qu'une chose. On suit un kilogramme de fluide : il décrit un cycle. Pour modéliser la machine par une machine ditherme, on repère :</p>
  <ol>
    <li>l'organe où le fluide <strong>reçoit du travail</strong> (pompe, compresseur) ou en <strong>fournit</strong> (turbine) ;</li>
    <li>l'échangeur où il reçoit de l'énergie thermique de la source chaude, et celui où il en cède à la source froide (ou l'inverse pour un récepteur) ;</li>
    <li>le sens de parcours, qui dit si la machine est motrice ou réceptrice.</li>
  </ol>

  <div class="method-box"><strong>Exemple — rendement d'une centrale à vapeur</strong>
    <p>Pour le cycle de la figure (0,1 bar ; 60 bar ; surchauffe à 500 °C), les tables de l'eau donnent, par kilogramme d'eau, un transfert thermique reçu dans le générateur de vapeur \(q_C = 3\,225\ \text{kJ·kg}^{-1}\) et un transfert reçu dans le condenseur \(q_F = -1\,988\ \text{kJ·kg}^{-1}\).</p>
    <ol>
      <li>Premier principe sur le cycle : le travail reçu au total (pompe + turbine) vaut \(w = -(q_C + q_F) = -1\,237\ \text{kJ·kg}^{-1}\).</li>
      <li>Rendement : \(\eta = \dfrac{-w}{q_C} = \dfrac{1\,237}{3\,225} = 0{,}38\).</li>
      <li>Carnot entre la vapeur la plus chaude (773 K) et le condenseur (319 K) : 0,59. Entre les deux paliers (549 K et 319 K) : 0,42, beaucoup plus proche du rendement réel du cycle : l'essentiel de l'énergie est reçu sur le palier.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — refroidir une centrale nucléaire</strong>
    <p>Un réacteur de 1,0 GW électrique a un rendement de 0,33. Il reçoit donc \(1{,}0/0{,}33 = 3{,}0\ \text{GW}\) de la fission et cède \(2{,}0\ \text{GW}\) à la source froide. Si une rivière l'absorbe en s'échauffant de 3 K au plus, son débit doit dépasser \(\dfrac{2{,}0\times10^{9}}{4\,180 \times 3} \approx 1{,}6\times10^{5}\ \text{kg·s}^{-1}\), soit 160 m³·s⁻¹ : le débit d'un grand fleuve. D'où les tours de refroidissement sur les rivières plus modestes.</p>
  </div>

</figure>
  <p>Le fluide frigorigène s'évapore à basse pression et basse température (vers −25 °C sous 1 bar pour le R134a), ce qui lui permet de prendre de l'énergie à l'intérieur de l'appareil ; comprimé, il se liquéfie à haute pression et à une température (vers 40 °C) supérieure à celle de la cuisine, ce qui lui permet de lui céder de l'énergie. Le détendeur, un simple tube fin, fait chuter sa pression et donc sa température d'ébullition.</p>
  <div class="method-box"><strong>Exemple — efficacité d'un réfrigérateur</strong>
    <p>Pour le R134a entre −25 °C et 40 °C, les tables donnent, par kilogramme de fluide, \(q_F = 127\ \text{kJ·kg}^{-1}\) reçu dans l'évaporateur et \(w = 47\ \text{kJ·kg}^{-1}\) reçu dans le compresseur.</p>
    <ol>
      <li>\(e_F = q_F/w = 2{,}7\) ; transfert reçu au condenseur : \(q_C = -(w + q_F) = -174\ \text{kJ·kg}^{-1}\).</li>
      <li>Carnot entre les températures du fluide (248 K et 313 K) : \(e_{F,C} = 248/65 = 3{,}8\). Entre l'intérieur (−18 °C) et la cuisine (20 °C) : 6,7.</li>
      <li>Les écarts de température nécessaires dans les échangeurs coûtent plus que les imperfections du cycle lui-même.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour \(T_F\) la température du fluide dans l'évaporateur au lieu de celle de la source (ou l'inverse) sans le dire. Les deux calculs ont un sens : avec les températures des sources, on obtient la borne absolue ; avec celles du fluide, la borne du cycle. L'énoncé précise ce qu'il attend.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · RENDEMENTS RÉELS ET COGÉNÉRATION</div>
  <h2>Ordres de grandeur et chaleur valorisée</h2>
  <div class="intro">Une machine réelle reste loin de sa borne de Carnot. Mais l'énergie cédée à la source froide n'est pas forcément perdue : à une température assez haute, elle peut chauffer des bâtiments. C'est le principe de la cogénération.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Machine</th><th style="text-align:left">Valeur réelle</th><th style="text-align:left">Borne de Carnot</th></tr>
    <tr><td>Moteur à essence de voiture</td><td>\(\eta \approx 0{,}30\) à 0,38</td><td>≈ 0,85 (températures extrêmes)</td></tr>
    <tr><td>Moteur Diesel (voiture, camion, navire)</td><td>\(\eta \approx 0{,}40\) à 0,50</td><td>≈ 0,85</td></tr>
    <tr><td>Centrale nucléaire à eau pressurisée</td><td>\(\eta \approx 0{,}33\)</td><td>≈ 0,46</td></tr>
    <tr><td>Centrale au charbon moderne</td><td>\(\eta \approx 0{,}42\) à 0,45</td><td>≈ 0,63</td></tr>
    <tr><td>Turbine à gaz seule</td><td>\(\eta \approx 0{,}35\) à 0,40</td><td>≈ 0,83</td></tr>
    <tr><td>Cycle combiné gaz-vapeur</td><td>\(\eta \approx 0{,}60\) à 0,62</td><td>≈ 0,83</td></tr>
    <tr><td>Réfrigérateur, congélateur</td><td>\(e_F \approx 1{,}5\) à 3</td><td>≈ 7 à 17 (−18 °C ou 4 °C / 20 °C)</td></tr>
    <tr><td>Climatiseur</td><td>\(e_F \approx 3\) à 4</td><td>≈ 30 (25 °C / 35 °C)</td></tr>
    <tr><td>Pompe à chaleur air-eau, géothermique</td><td>\(e_{PAC} \approx 3\) à 5</td><td>≈ 6 à 15 (selon les températures)</td></tr>
  </table></div>
  <div class="def-box">
    <strong>Cogénération.</strong> Production simultanée de travail (en pratique d'électricité) et de chaleur utile : l'énergie que le moteur doit céder à sa source froide sert à chauffer des logements, un réseau de chaleur urbain ou un procédé industriel, au lieu d'être rejetée dans l'environnement. On évalue l'installation par son <strong>rendement global</strong> \(\dfrac{\text{électricité} + \text{chaleur utile}}{\text{énergie du combustible}}\), qui atteint 80 à 90 %.
  </div>
  <div class="method-box"><strong>Exemple — moteur de cogénération d'un hôpital</strong>
    <p>Un moteur à gaz brûle 100 kW de combustible, fournit 38 kW électriques et 47 kW de chaleur récupérée sur ses gaz d'échappement et son eau de refroidissement.</p>
    <ol>
      <li>Rendement électrique : 0,38 ; rendement global : \((38 + 47)/100 = 0{,}85\).</li>
      <li>Production séparée des mêmes besoins : centrale de rendement 0,40 (\(38/0{,}40 = 95\ \text{kW}\) de combustible) et chaudière de rendement 0,90 (\(47/0{,}90 = 52\ \text{kW}\)) : 147 kW au total.</li>
      <li>Économie de combustible : \(1 - 100/147 = 0{,}32\), soit 32 %.</li>
    </ol>
  </div>

</figure>
  <p>La cogénération a un prix : pour que la chaleur soit utile, il faut la céder vers 80 à 90 °C au lieu de 30 °C. Le rendement de Carnot d'une machine dont la source chaude est à 600 °C passe ainsi de \(1 - 303/873 = 0{,}65\) à \(1 - 363/873 = 0{,}58\) : on perd un peu d'électricité pour gagner beaucoup de chaleur. Elle n'a d'intérêt que s'il existe, à proximité, un besoin de chaleur toute l'année.</p>
  <div class="notice"><strong>Erreur classique</strong> : additionner électricité et chaleur comme si elles avaient la même valeur. Un joule électrique peut être converti intégralement en chaleur, mais un joule de chaleur à 90 °C ne peut fournir au mieux que \(1 - 293/363 \approx 0{,}19\) joule de travail avec l'air ambiant pour source froide. Le rendement global ne remplace pas le rendement électrique : il le complète.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · LES CYCLES INDUSTRIELS (2ᵉ ANNÉE)</div>
  <h2>Ce que la 2ᵉ année ajoute</h2>
  <div class="intro">En 2ᵉ année, on étudie les machines organe par organe, en appliquant les deux principes à un fluide <em>en écoulement</em> ; on lit alors directement les énergies dans les diagrammes des fluides réels. Rien de ce qui suit n'est exigible en PTSI.</div>
  <p>Pour un fluide qui traverse un organe en régime permanent (une entrée, une sortie, variations d'énergie cinétique et potentielle négligées), le premier principe s'écrit \(\Delta h = w_i + q\), où \(w_i\) est le travail massique reçu des parties mobiles et \(q\) le transfert thermique massique reçu. Un compresseur ou une turbine calorifugés ont \(w_i = \Delta h\) ; un échangeur sans partie mobile, \(q = \Delta h\) ; un détendeur calorifugé, \(\Delta h = 0\). Voir <a href="#thermoouv/cours">« Systèmes ouverts et thermodynamique industrielle »</a>.</p>

<div class="course-section">
  <div class="sec-num">MÉTHODES · MACHINES THERMIQUES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur les machines thermiques : modéliser un dispositif par une machine ditherme, écrire les deux bilans sur un cycle, en déduire le sens des échanges, définir et borner un rendement ou une efficacité, analyser un cycle de gaz parfait transformation par transformation et exploiter des mesures. Convention unique : \(W\), \(Q_C\), \(Q_F\) sont les énergies <strong>reçues par le fluide</strong>.</div>

  <div class="method-box"><strong>Méthode 1 — Modéliser un dispositif par une machine ditherme</strong>
    <ol>
      <li><span class="step">Système.</span> Choisir le <strong>fluide</strong> qui décrit le cycle (air du cylindre, eau de la centrale, fluide frigorigène), jamais « la machine ».</li>
      <li><span class="step">Sources.</span> Identifier la source chaude (\(T_C\)) et la source froide (\(T_F\)) : combustion, réacteur, air extérieur, intérieur d'un réfrigérateur, eau d'une rivière. Températures en kelvins.</li>
      <li><span class="step">Travail.</span> Repérer l'organe qui fournit ou reçoit du travail (piston, turbine, compresseur).</li>
      <li><span class="step">Fonction.</span> Dire ce qui intéresse l'utilisateur : le travail (moteur), \(Q_F\) (réfrigérateur, climatiseur) ou \(Q_C\) (pompe à chaleur).</li>
    </ol>
    <p><em>Exemple éclair :</em> un climatiseur de voiture. Fluide : le R134a de la boucle. Source froide : l'air de l'habitacle (≈ 25 °C, 298 K) ; source chaude : l'air extérieur (≈ 35 °C, 308 K). Travail : le compresseur entraîné par le moteur. Utile : \(Q_F \gt 0\), pris à l'habitacle. C'est un réfrigérateur.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Écrire les deux bilans sur un cycle</strong>
    <ol>
      <li><span class="step">Premier principe.</span> \(\Delta U = 0\) sur un cycle : \(W + Q_C + Q_F = 0\).</li>
      <li><span class="step">Second principe.</span> \(\Delta S = 0\) sur un cycle : \(\dfrac{Q_C}{T_C} + \dfrac{Q_F}{T_F} + S_{\text{créée}} = 0\), avec \(S_{\text{créée}} \ge 0\) (nulle si et seulement si le cycle est réversible).</li>
      <li><span class="step">Résoudre.</span> Deux équations : connaissant deux des grandeurs \(W\), \(Q_C\), \(Q_F\), \(S_{\text{créée}}\), on trouve les deux autres.</li>
      <li><span class="step">Contrôle.</span> \(S_{\text{créée}} \lt 0\) signale une machine impossible (ou une erreur de signe).</li>
    </ol>
    <p><em>Exemple éclair :</em> moteur entre 500 K et 300 K, \(Q_C = 2{,}0\ \text{kJ}\), \(W = -0{,}50\ \text{kJ}\). \(Q_F = -1{,}5\ \text{kJ}\) ; \(S_{\text{créée}} = -\dfrac{2\,000}{500} + \dfrac{1\,500}{300} = 1{,}0\ \text{J·K}^{-1} \gt 0\) : possible, irréversible.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : mettre dans \(S_{\text{éch}}\) la température du fluide au lieu de celle de la source. Les températures des sources sont les seules qui interviennent dans l'entropie échangée.</div>

  <div class="method-box"><strong>Méthode 3 — Trouver le sens des échanges</strong>
    <ol>
      <li><span class="step">Moteur</span> (\(W \lt 0\)) : nécessairement \(Q_C \gt 0\) et \(Q_F \lt 0\).</li>
      <li><span class="step">Récepteur utile</span> (\(W \gt 0\) et \(Q_F \gt 0\)) : nécessairement \(Q_C \lt 0\), avec \(|Q_C| = W + Q_F\).</li>
      <li><span class="step">Justification</span> (si elle est demandée) : par l'absurde, avec les deux bilans de la méthode 2, ou par le diagramme de Raveau.</li>
      <li><span class="step">Monotherme.</span> Avec une seule source, \(W \ge 0\) et \(Q \le 0\) : jamais de moteur.</li>
    </ol>
    <p><em>Exemple éclair :</em> une machine prendrait \(Q_F = 1{,}0\ \text{kJ}\) à la source froide, fournirait 0,2 kJ de travail (\(W = -0{,}2\ \text{kJ}\)) et céderait 0,8 kJ à la source chaude (\(Q_C = -0{,}8\ \text{kJ}\)). Le premier principe est respecté ; mais c'est un moteur qui reçoit de l'énergie de la source froide : impossible. En effet \(\dfrac{Q_C}{T_C} + \dfrac{Q_F}{T_F} = \dfrac{1{,}0}{T_F} - \dfrac{0{,}8}{T_C} \gt 0\) puisque \(T_F \lt T_C\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Définir et calculer un rendement ou une efficacité</strong>
    <ol>
      <li><span class="step">Principe.</span> \(\dfrac{\text{énergie utile}}{\text{énergie payée}}\), chacune comptée positivement.</li>
      <li><span class="step">Moteur.</span> \(\eta = \dfrac{-W}{Q_C} = 1 + \dfrac{Q_F}{Q_C}\), toujours \(\lt 1\).</li>
      <li><span class="step">Réfrigérateur.</span> \(e_F = \dfrac{Q_F}{W}\) ; <span class="step">pompe à chaleur.</span> \(e_{PAC} = \dfrac{-Q_C}{W} = 1 + e_F\) ; elles peuvent dépasser 1.</li>
      <li><span class="step">Puissances.</span> Les mêmes rapports valent pour les puissances moyennes (énergies par cycle × nombre de cycles par seconde).</li>
      <li><span class="step">Cogénération.</span> Rendement global \(\dfrac{\mathcal P_{\text{élec}} + \mathcal P_{\text{chaleur utile}}}{\mathcal P_{\text{comb}}}\) ; pour l'économie, comparer au combustible d'une production séparée des mêmes quantités (centrale et chaudière).</li>
    </ol>
    <p><em>Exemple éclair :</em> un réfrigérateur de puissance électrique 100 W extrait 180 W de l'enceinte : \(e_F = 1{,}8\) ; il rejette \(280\ \text{W}\) dans la cuisine (\(\dot Q_C = -280\ \text{W}\)) ; utilisé en pompe à chaleur, il aurait \(e_{PAC} = 2{,}8\). Cogénération : 1,0 MW de gaz donne 0,35 MW électriques et 0,50 MW de chaleur utile (rendement global 0,85) ; séparément, une centrale à 0,45 et une chaudière à 0,92 brûleraient \(0{,}35/0{,}45 + 0{,}50/0{,}92 = 1{,}32\ \text{MW}\) : économie de 24 %.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\eta = W/Q_C\) avec \(W\) reçu donne un rendement négatif ; et le dénominateur est l'énergie payée (\(Q_C\) pour un moteur, \(W\) pour un récepteur), pas la somme des énergies échangées.</div>
  <div class="notice"><strong>Piège</strong> : vanter un « rendement de 85 % » en le comparant au rendement électrique d'une centrale. Ce n'est pas la même grandeur : la chaleur à 80 °C vaut beaucoup moins que l'électricité (borne de Carnot, méthode 5).</div>

  <div class="method-box"><strong>Méthode 5 — Utiliser le théorème de Carnot</strong>
    <ol>
      <li><span class="step">Bornes.</span> \(\eta \le 1 - \dfrac{T_F}{T_C}\), \(e_F \le \dfrac{T_F}{T_C - T_F}\), \(e_{PAC} \le \dfrac{T_C}{T_C - T_F}\), températures des <strong>sources</strong> en kelvins.</li>
      <li><span class="step">Justifier.</span> Diviser l'inégalité de Clausius par la grandeur positive qui convient (\(Q_C/T_F\) pour un moteur, \(Q_F/T_C\) ou \(-Q_C/T_F\) pour un récepteur).</li>
      <li><span class="step">Comparer.</span> Une performance annoncée au-dessus de la borne est impossible ; le rapport \(\eta/\eta_C\) (ou \(e/e_C\)) mesure la qualité de la machine.</li>
      <li><span class="step">Chiffrer les pertes.</span> \(-W = \eta_C Q_C - T_F S_{\text{créée}}\) : l'entropie créée coûte \(T_F\) joules de travail par joule par kelvin.</li>
    </ol>
    <p><em>Exemple éclair :</em> une pompe à chaleur géothermique prend l'énergie du sol à 10 °C et chauffe une eau à 35 °C : \(e_{PAC,C} = \dfrac{308}{25} = 12{,}3\). Une efficacité annoncée de 4,5 est plausible (37 % de la borne), une efficacité de 15 ne l'est pas.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer W et Q transformation par transformation (gaz parfait)</strong>
    <ol>
      <li><span class="step">Tableau.</span> Une ligne par transformation : état initial, état final, \(W\), \(Q\), \(\Delta U\).</li>
      <li><span class="step">Formules.</span> Isochore : \(W = 0\), \(Q = C_V\Delta T\). Isobare : \(W = -P\Delta V\), \(Q = C_P\Delta T\). Isotherme réversible : \(\Delta U = 0\), \(Q = -W = nRT\ln\dfrac{V_f}{V_i}\). Adiabatique réversible : \(Q = 0\), \(W = C_V\Delta T\), états reliés par \(TV^{\gamma - 1} = \text{cste}\) ou \(PV^{\gamma} = \text{cste}\).</li>
      <li><span class="step">Contrôle.</span> \(\sum W + \sum Q = 0\) sur le cycle.</li>
      <li><span class="step">Sources.</span> Regrouper les \(Q \gt 0\) (énergie payée) et les \(Q \lt 0\) (énergie cédée) pour le rendement.</li>
    </ol>
    <p><em>Exemple éclair :</em> 0,10 mol de gaz diatomique de 300 K à 500 K à volume constant : \(Q = \tfrac52 \times 0{,}10 \times 8{,}314 \times 200 = 416\ \text{J}\), \(W = 0\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer la loi de Laplace à une adiabatique qui n'est pas réversible (détente brutale), ou à une transformation qui échange de la chaleur. Elle suppose gaz parfait, adiabatique et réversible.</div>

  <div class="method-box"><strong>Méthode 7 — Lire un cycle dans un diagramme</strong>
    <ol>
      <li><span class="step">Clapeyron (P en ordonnée, V en abscisse).</span> Sens horaire : moteur, \(W \lt 0\) ; sens trigonométrique : récepteur, \(W \gt 0\).</li>
      <li><span class="step">Aire.</span> \(|W|\) = aire enfermée par le cycle (échelles linéaires seulement).</li>
      <li><span class="step">Entropique (T en ordonnée, S en abscisse).</span> Pour un cycle réversible, l'aire vaut \(Q_{\text{cycle}} = -W\) ; une isotherme est horizontale, une adiabatique réversible verticale.</li>
      <li><span class="step">Branches.</span> Sur une isotherme de gaz parfait, \(PV = \text{cste}\) ; une adiabatique réversible est plus pentue (\(PV^{\gamma}\), \(\gamma \gt 1\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> un cycle triangulaire de sommets (1 L ; 1 bar), (3 L ; 1 bar), (1 L ; 3 bar), parcouru dans cet ordre : sens trigonométrique, récepteur, \(W = +\tfrac12 \times 2\times10^{-3} \times 2\times10^{5} = +200\ \text{J}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Établir le rendement d'un cycle à deux adiabatiques</strong>
    <ol>
      <li><span class="step">Échanges.</span> Seules les deux autres transformations échangent de la chaleur : \(Q_{\text{reçu}} \gt 0\) et \(Q_{\text{cédé}} \lt 0\), exprimés avec \(C_V\) ou \(C_P\).</li>
      <li><span class="step">Rendement.</span> \(\eta = 1 + \dfrac{Q_{\text{cédé}}}{Q_{\text{reçu}}}\) : une fraction de différences de températures.</li>
      <li><span class="step">Laplace.</span> Exprimer les températures en fonction des rapports de volumes (\(a = V_{\max}/V_{\min}\)) pour simplifier.</li>
      <li><span class="step">Vérifier.</span> Le résultat ne doit pas dépasser le rendement de Carnot entre les températures extrêmes du cycle.</li>
    </ol>
    <p><em>Exemple éclair :</em> Beau de Rochas avec \(a = 8\), \(\gamma = 1{,}4\) : \(\eta = 1 - 8^{-0{,}4} = 0{,}56\). Avec \(a = 12\) : 0,63. Un rapport volumétrique plus grand améliore le rendement.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Analyser une machine à changement d'état</strong>
    <ol>
      <li><span class="step">Organes.</span> Nommer chaque organe et son rôle : échangeur (transfert thermique, isobare), turbine ou compresseur (travail), détendeur (chute de pression), pompe (travail faible sur un liquide).</li>
      <li><span class="step">Températures.</span> Le fluide doit être plus chaud que la source à laquelle il cède de l'énergie et plus froid que celle dont il en reçoit : en déduire les pressions de fonctionnement (pression de vapeur saturante).</li>
      <li><span class="step">Bilans par kilogramme.</span> Avec les énergies massiques reçues fournies par l'énoncé (\(q_C\), \(q_F\), \(w\)) : \(w + q_C + q_F = 0\), puis \(\eta\) ou \(e\).</li>
      <li><span class="step">Puissances.</span> Multiplier par le débit massique \(D_m\) : \(\mathcal P = D_m\,|w|\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour garder un congélateur à −18 °C dans une cuisine à 20 °C, le fluide doit s'évaporer en dessous de −18 °C (par exemple à −25 °C) et se condenser au-dessus de 20 °C (par exemple à 40 °C) ; pour le R134a, cela fixe \(P_{\text{BP}} \approx 1{,}1\ \text{bar}\) et \(P_{\text{HP}} \approx 10\ \text{bar}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Exploiter des mesures sur une machine réelle</strong>
    <ol>
      <li><span class="step">Puissances thermiques.</span> Pour un réservoir de masse \(m\) et de capacité \(c\) : \(\mathcal P_{\text{th}} = m\,c\,\dfrac{\mathrm d\theta}{\mathrm dt}\) (pente de la courbe de température, en K·s⁻¹).</li>
      <li><span class="step">Efficacité instantanée.</span> \(e_{PAC} = \dfrac{m\,c}{\mathcal P_{\text{élec}}}\,\dfrac{\mathrm d\theta_C}{\mathrm dt}\), à comparer à \(\dfrac{T_C}{T_C - T_F}\) au même instant.</li>
      <li><span class="step">Combustible.</span> Puissance thermique = débit de combustible × pouvoir calorifique ; rendement = puissance mécanique / puissance thermique.</li>
      <li><span class="step">Écarts.</span> Discuter les pertes vers l'ambiance (réservoirs non isolés), le fait que les réservoirs ne sont pas des thermostats, la puissance électrique qui n'est pas entièrement reçue par le fluide.</li>
    </ol>
    <p><em>Exemple éclair :</em> un seau chaud de 5,0 kg d'eau gagne 1,2 K par minute avec un compresseur de 150 W : \(e_{PAC} = \dfrac{5{,}0 \times 4\,180 \times 1{,}2/60}{150} \approx 2{,}8\).</p>
  </div>
