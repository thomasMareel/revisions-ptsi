<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Rendement de Carnot, moteur réel et machine inversée</h3>
  <div class="statement">Une machine ditherme fonctionne entre une source chaude à \(T_C = 600\ \text{K}\) et une source froide à \(T_F = 300\ \text{K}\). Convention : \(W\), \(Q_C\), \(Q_F\) sont les énergies reçues par le fluide au cours d'un cycle.</div>
  <div class="q"><strong>Q1.</strong> Calculer le rendement maximal d'un moteur fonctionnant entre ces sources.</div>
  <div class="q"><strong>Q2.</strong> Ce moteur idéal reçoit \(Q_C = 1\,000\ \text{J}\) par cycle. Calculer \(W\) et \(Q_F\).</div>
  <div class="q"><strong>Q3.</strong> Un moteur réel entre les mêmes sources a un rendement de 30 % pour le même \(Q_C\). Calculer \(W\), \(Q_F\) et l'entropie créée par cycle.</div>
  <div class="q"><strong>Q4.</strong> Vérifier que le travail manquant par rapport au moteur idéal vaut \(T_F\,S_{\text{créée}}\).</div>
  <div class="q"><strong>Q5.</strong> La machine idéale est inversée et utilisée en pompe à chaleur. Quelle est son efficacité ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Théorème de Carnot : \( \eta_C = 1 - \dfrac{T_F}{T_C} \) \( = 1 - \dfrac{300}{600} = 0{,}50 \).</p>
    <p><strong>Q2.</strong> Le moteur fournit \(-W = \eta_C\,Q_C = 500\ \text{J}\), donc \(W = -500\ \text{J}\). Premier principe sur un cycle : \( Q_F = -W - Q_C = 500 - 1\,000 \) \( = -500\ \text{J} \) (500 J cédés à la source froide). Contrôle : \(\dfrac{1\,000}{600} - \dfrac{500}{300} = 0\), cycle réversible.</p>
    <p><strong>Q3.</strong> \( W = -0{,}30 \times 1\,000 \) \( = -300\ \text{J} \) ; \(Q_F = -W - Q_C = -700\ \text{J}\). Bilan d'entropie sur un cycle (\(\Delta S = 0\)) : \( S_{\text{créée}} \) \( = -\left(\dfrac{Q_C}{T_C} + \dfrac{Q_F}{T_F}\right) \) \( = -\left(\dfrac{1\,000}{600} - \dfrac{700}{300}\right) \) \( = -1{,}667 + 2{,}333 \) \( = 0{,}67\ \text{J·K}^{-1} \), positive : le moteur est irréversible.</p>
    <p><strong>Q4.</strong> Travail manquant : \(500 - 300 = 200\ \text{J}\) ; \( T_F\,S_{\text{créée}} \) \( = 300 \times 0{,}667 \) \( = 200\ \text{J} \). C'est la relation \(-W = \eta_C Q_C - T_F S_{\text{créée}}\) du cours.</p>
    <p><strong>Q5.</strong> Une machine réversible inversée est une pompe à chaleur réversible : \( e_{PAC} = \dfrac{T_C}{T_C - T_F} \) \( = \dfrac{600}{300} = 2{,}0 \). Pour 1 J de travail, elle fournit 2 J à la source chaude, dont 1 J pris à la source froide.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Machines possibles ou impossibles</h3>
  <div class="statement">Toutes les machines ci-dessous fonctionnent entre une source chaude à \(T_C = 500\ \text{K}\) et une source froide à \(T_F = 300\ \text{K}\). On donne les énergies par cycle annoncées par leurs constructeurs.<br>(a) Moteur : reçoit 1 000 J de la source chaude, fournit 350 J de travail.<br>(b) Moteur : reçoit 1 000 J de la source chaude, fournit 450 J de travail.<br>(c) Réfrigérateur : reçoit 100 J de travail, prend 200 J à la source froide.<br>(d) Pompe à chaleur : reçoit 100 J de travail, cède 220 J à la source chaude.<br>(e) Machine sans travail : reçoit 500 J de la source chaude et en cède 500 J à la source froide.</div>
  <div class="q"><strong>Q1.</strong> Calculer les bornes de Carnot \(\eta_C\), \(e_{F,C}\) et \(e_{PAC,C}\).</div>
  <div class="q"><strong>Q2.</strong> Pour chaque machine, écrire \(W\), \(Q_C\), \(Q_F\) avec la convention du cours, calculer \(Q_C/T_C + Q_F/T_F\) et conclure.</div>
  <div class="q"><strong>Q3.</strong> Placer qualitativement les machines possibles dans le diagramme de Raveau du cours.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\eta_C = 1 - \dfrac{300}{500} = 0{,}40\) ; \(e_{F,C} = \dfrac{300}{200} = 1{,}5\) ; \(e_{PAC,C} = \dfrac{500}{200} = 2{,}5\).</p>
    <p><strong>Q2.</strong> Le premier principe donne la troisième énergie ; le second principe exige \(Q_C/T_C + Q_F/T_F \le 0\).</p>
    <ul>
      <li>(a) \(W = -350\), \(Q_C = 1\,000\), \(Q_F = -650\ \text{J}\) ; \(2{,}000 - 2{,}167 = -0{,}17\ \text{J·K}^{-1} \le 0\) : <strong>possible</strong>, irréversible (\(\eta = 0{,}35 \lt 0{,}40\)).</li>
      <li>(b) \(W = -450\), \(Q_F = -550\ \text{J}\) ; \(2{,}000 - 1{,}833 = +0{,}17 \gt 0\) : <strong>impossible</strong> (\(\eta = 0{,}45 \gt \eta_C\)).</li>
      <li>(c) \(W = 100\), \(Q_F = 200\), \(Q_C = -300\ \text{J}\) ; \(-0{,}600 + 0{,}667 = +0{,}07 \gt 0\) : <strong>impossible</strong> (\(e_F = 2{,}0 \gt 1{,}5\)).</li>
      <li>(d) \(W = 100\), \(Q_C = -220\), \(Q_F = 120\ \text{J}\) ; \(-0{,}440 + 0{,}400 = -0{,}04 \le 0\) : <strong>possible</strong> (\(e_{PAC} = 2{,}2 \lt 2{,}5\)).</li>
      <li>(e) \(W = 0\), \(Q_C = 500\), \(Q_F = -500\ \text{J}\) ; \(1{,}000 - 1{,}667 = -0{,}67 \le 0\) : <strong>possible</strong> mais sans intérêt, c'est une simple conduction de la chaleur du chaud vers le froid.</li>
    </ul>
    <p>Les machines (b) et (c) respectent la conservation de l'énergie : seul le second principe les élimine.</p>
    <p><strong>Q3.</strong> Dans le plan \((Q_F, Q_C)\) : (a) est dans le domaine des moteurs (\(Q_F \lt 0\), \(Q_C \gt 0\), sous la droite des cycles réversibles) ; (d) dans celui des récepteurs (\(Q_F \gt 0\), \(Q_C \lt 0\)) ; (e) sur la droite \(W = 0\) ; (b) et (c) dans le demi-plan interdit.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Réfrigérateur : efficacité et irréversibilité</h3>
  <div class="statement">Un réfrigérateur maintient son intérieur à \(\theta_F = 5\ °\text{C}\) dans une cuisine à \(\theta_C = 30\ °\text{C}\). En régime permanent, son compresseur reçoit une puissance \(\mathcal P = 100\ \text{W}\) et le fluide prend une puissance thermique \(\dot Q_F = 250\ \text{W}\) à l'intérieur.</div>
  <div class="q"><strong>Q1.</strong> Calculer l'efficacité réelle et l'efficacité de Carnot. Commenter.</div>
  <div class="q"><strong>Q2.</strong> Calculer la puissance thermique reçue de la cuisine par le fluide.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'entropie créée par seconde.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( e_F \) \( = \dfrac{\dot Q_F}{\mathcal P} \) \( = \dfrac{250}{100} = 2{,}5 \). Avec \(T_F = 278{,}15\ \text{K}\) et \(T_C = 303{,}15\ \text{K}\) : \( e_{F,C} = \dfrac{T_F}{T_C - T_F} \) \( = \dfrac{278{,}15}{25} = 11{,}1 \). Le réfrigérateur réel n'atteint que 22 % de la borne : le fluide doit s'évaporer bien en dessous de 5 °C et se condenser bien au-dessus de 30 °C, et le compresseur n'est pas réversible.</p>
    <p><strong>Q2.</strong> Premier principe en puissances (régime permanent, cycle) : \(\mathcal P + \dot Q_C + \dot Q_F = 0\), donc \( \dot Q_C = -(100 + 250) \) \( = -350\ \text{W} \) : le fluide cède 350 W à la cuisine, plus que ce qu'il prend à l'intérieur.</p>
    <p><strong>Q3.</strong> Bilan d'entropie par seconde : \(\dot S_{\text{créée}} = -\left(\dfrac{\dot Q_C}{T_C} + \dfrac{\dot Q_F}{T_F}\right)\) \(= \dfrac{350}{303{,}15} - \dfrac{250}{278{,}15}\) \( = 1{,}155 - 0{,}899 \) \( = 0{,}256\ \text{W·K}^{-1} \gt 0 \) : fonctionnement irréversible.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Pompe à chaleur ou chauffage électrique</h3>
  <div class="statement">Une pompe à chaleur chauffe une maison à \(\theta_C = 20\ °\text{C}\) en prenant de l'énergie à l'air extérieur à \(\theta_F = 5\ °\text{C}\). Son efficacité réelle vaut \(e_{PAC} = 4{,}0\) et elle reçoit une puissance électrique \(\mathcal P = 2{,}0\ \text{kW}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'efficacité de Carnot de cette pompe à chaleur et la comparer à l'efficacité réelle.</div>
  <div class="q"><strong>Q2.</strong> Quelle puissance thermique fournit-elle à la maison ? Quelle puissance prend-elle à l'air extérieur ?</div>
  <div class="q"><strong>Q3.</strong> Comparer à des radiateurs électriques recevant la même puissance électrique. Quelle part de l'électricité économise-t-on pour le même chauffage ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(T_C = 293{,}15\ \text{K}\), \(T_F = 278{,}15\ \text{K}\) : \( e_{PAC,C} \) \( = \dfrac{T_C}{T_C - T_F} \) \( = \dfrac{293{,}15}{15} = 19{,}5 \). L'efficacité réelle en vaut environ 20 %, ordre de grandeur habituel.</p>
    <p><strong>Q2.</strong> \( -\dot Q_C = e_{PAC}\,\mathcal P \) \( = 4{,}0 \times 2{,}0 \) \( = 8{,}0\ \text{kW} \) fournis à la maison. Premier principe : \( \dot Q_F = -\dot Q_C - \mathcal P \) \( = 8{,}0 - 2{,}0 = 6{,}0\ \text{kW} \) pris à l'air extérieur.</p>
    <p><strong>Q3.</strong> Les radiateurs (effet Joule) fournissent 2,0 kW pour 2,0 kW consommés. Pour fournir 8,0 kW, il leur faudrait 8,0 kW électriques contre 2,0 kW pour la pompe à chaleur : on économise \(1 - 2/8 = 75\ \%\) de l'électricité, parce que les trois quarts de la chaleur viennent gratuitement de l'air extérieur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Cycle de Carnot d'un gaz monoatomique</h3>
  <div class="statement">Une mole de gaz parfait monoatomique (\(\gamma = 5/3\), \(C_{V,m} = \tfrac32 R\)) décrit un cycle de Carnot moteur entre \(T_C = 500\ \text{K}\) et \(T_F = 300\ \text{K}\). Au début de la détente isotherme, \(V_1 = 1{,}0\ \text{L}\) ; à la fin, \(V_2 = 5{,}0\ \text{L}\). \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(Q_C\), transfert thermique reçu sur l'isotherme chaude.</div>
  <div class="q"><strong>Q2.</strong> En déduire \(Q_F\) par le théorème de Carnot, puis \(W\).</div>
  <div class="q"><strong>Q3.</strong> Calculer les volumes \(V_3\) (fin de la détente adiabatique) et \(V_4\) (fin de la compression isotherme). Vérifier \(Q_F\) directement.</div>
  <div class="q"><strong>Q4.</strong> Calculer le travail reçu sur chacune des adiabatiques. Pourquoi n'interviennent-ils pas dans le bilan ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Isotherme de gaz parfait : \(\Delta U = 0\), donc \( Q_C = -W_{12} \) \( = RT_C\ln\dfrac{V_2}{V_1} \) \( = 8{,}314 \times 500 \times \ln 5 \) \( = 6{,}69\ \text{kJ} \).</p>
    <p><strong>Q2.</strong> Cycle réversible : \(\dfrac{Q_C}{T_C} + \dfrac{Q_F}{T_F} = 0\), d'où \( Q_F = -Q_C\dfrac{T_F}{T_C} \) \( = -6{,}69 \times 0{,}6 \) \( = -4{,}01\ \text{kJ} \). Puis \(W = -(Q_C + Q_F) = -2{,}68\ \text{kJ}\), et \( \eta = 2{,}68/6{,}69 = 0{,}40 \) \( = 1 - T_F/T_C \).</p>
    <p><strong>Q3.</strong> Laplace sur l'adiabatique 2 → 3 : \(T_C V_2^{\gamma - 1} = T_F V_3^{\gamma - 1}\), donc \( V_3 \) \( = V_2\left(\dfrac{T_C}{T_F}\right)^{1/(\gamma - 1)} \) \( = 5{,}0 \times \left(\dfrac53\right)^{1{,}5} \) \( = 10{,}8\ \text{L} \). De même sur 4 → 1 : \( V_4 \) \( = V_1\left(\dfrac53\right)^{1{,}5} \) \( = 2{,}15\ \text{L} \). Donc \(V_4/V_3 = V_1/V_2 = 0{,}20\) et \( Q_F = RT_F\ln\dfrac{V_4}{V_3} \) \( = -RT_F\ln 5 = -4{,}01\ \text{kJ} \), conforme.</p>
    <p><strong>Q4.</strong> \( W_{23} = \Delta U \) \( = C_V(T_F - T_C) \) \( = 1{,}5 \times 8{,}314 \times (-200) \) \( = -2{,}49\ \text{kJ} \) et \(W_{41} = +2{,}49\ \text{kJ}\). Ils se compensent exactement, car les deux adiabatiques relient les mêmes températures : le travail du cycle n'est dû qu'aux isothermes.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Cycle de Beau de Rochas d'un moteur à essence</h3>
  <div class="statement">On modélise un moteur à essence par le cycle de Beau de Rochas d'une mole d'air (gaz parfait, \(\gamma = 1{,}4\), \(C_{V,m} = \tfrac52 R\)) : compression adiabatique réversible 1 → 2 de rapport volumétrique \(a = V_1/V_2 = 8\), combustion isochore 2 → 3, détente adiabatique réversible 3 → 4, refroidissement isochore 4 → 1. État 1 : \(T_1 = 300\ \text{K}\), \(P_1 = 1{,}0\ \text{bar}\). En fin de combustion, \(T_3 = 2\,000\ \text{K}\).</div>
  <div class="q"><strong>Q1.</strong> Donner le rendement théorique \(\eta = 1 - a^{1-\gamma}\) de ce cycle.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(T_2\) et \(P_2\) après la compression.</div>
  <div class="q"><strong>Q3.</strong> Calculer les transferts thermiques reçus \(Q_{23}\) et \(Q_{41}\), puis \(W\), et vérifier le rendement.</div>
  <div class="q"><strong>Q4.</strong> Comparer au rendement de Carnot entre les températures extrêmes du cycle et expliquer l'écart.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\eta = 1 - 8^{-0{,}4}\) ; \(8^{0{,}4} = e^{0{,}4\ln 8} = 2{,}297\), donc \(\eta = 1 - 1/2{,}297 = 0{,}565\).</p>
    <p><strong>Q2.</strong> Laplace : \( T_2 = T_1 a^{\gamma - 1} \) \( = 300 \times 2{,}297 \) \( = 689\ \text{K} \) ; \( P_2 = P_1 a^{\gamma} = 8^{1{,}4} \) \( = 18{,}4\ \text{bar} \).</p>
    <p><strong>Q3.</strong> \( Q_{23} = C_V(T_3 - T_2) \) \( = 2{,}5 \times 8{,}314 \times (2\,000 - 689) \) \( = 27{,}2\ \text{kJ} \). Détente : \( T_4 = T_3/a^{\gamma - 1} \) \( = 2\,000/2{,}297 = 871\ \text{K} \), d'où \( Q_{41} = C_V(T_1 - T_4) \) \( = 2{,}5 \times 8{,}314 \times (300 - 871) \) \( = -11{,}9\ \text{kJ} \). \( W = -(Q_{23} + Q_{41}) \) \( = -15{,}4\ \text{kJ} \) (négatif : moteur) ; \( \eta = \dfrac{-W}{Q_{23}} \) \( = \dfrac{15{,}4}{27{,}2} = 0{,}565 \).</p>
    <p><strong>Q4.</strong> \(1 - \dfrac{300}{2\,000} = 0{,}85\). Le cycle n'est pas ditherme : il reçoit son énergie entre 689 et 2 000 K et la cède entre 871 et 300 K. Recevoir de l'énergie à des températures inférieures à la plus haute, et en céder à des températures supérieures à la plus basse, abaisse le rendement par rapport au cycle de Carnot entre les extrêmes.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Cycle Diesel</h3>
  <div class="statement">Un moteur Diesel est modélisé par le cycle d'une mole d'air (gaz parfait, \(\gamma = 1{,}4\)) : 1 → 2 compression adiabatique réversible de rapport volumétrique \(a = V_1/V_2 = 20\) ; 2 → 3 combustion isobare jusqu'à \(T_3 = 2\,000\ \text{K}\) ; 3 → 4 détente adiabatique réversible jusqu'à \(V_4 = V_1\) ; 4 → 1 refroidissement isochore. État 1 : \(T_1 = 300\ \text{K}\), \(P_1 = 1{,}0\ \text{bar}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(T_2\) et \(P_2\). Pourquoi le gazole s'enflamme-t-il sans bougie ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le rapport de détente préalable \(b = V_3/V_2\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(T_4\) et montrer que \(T_4 = T_1 b^{\gamma}\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(Q_{23}\), \(Q_{41}\), \(W\) et le rendement.</div>
  <div class="q"><strong>Q5.</strong> Comparer au rendement d'un cycle de Beau de Rochas de même rapport volumétrique, puis de rapport volumétrique 9. Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Laplace : \( T_2 = T_1 a^{\gamma - 1} \) \( = 300 \times 20^{0{,}4} \) \( = 994\ \text{K} \) ; \( P_2 = P_1 a^{\gamma} = 20^{1{,}4} \) \( = 66\ \text{bar} \). L'air comprimé est à près de 1 000 K, bien au-dessus de la température d'auto-inflammation du gazole (environ 500 K) : le carburant injecté s'enflamme spontanément.</p>
    <p><strong>Q2.</strong> Isobare d'un gaz parfait : \(V/T\) constant, donc \( b = \dfrac{V_3}{V_2} \) \( = \dfrac{T_3}{T_2} \) \( = \dfrac{2\,000}{994} = 2{,}01 \).</p>
    <p><strong>Q3.</strong> Laplace sur 3 → 4, de \(V_3 = bV_2\) à \(V_4 = aV_2\) : \( T_4 \) \( = T_3\left(\dfrac{b}{a}\right)^{\gamma - 1} \) \( = 2\,000 \times \left(\dfrac{2{,}01}{20}\right)^{0{,}4} \) \( = 798\ \text{K} \). Et \(T_3 = bT_2 = b\,T_1 a^{\gamma - 1}\), d'où \(T_4 = T_1\,b\,a^{\gamma - 1}\,b^{\gamma - 1}a^{1 - \gamma}\), soit \( T_4 = T_1 b^{\gamma} \) \( = 300 \times 2{,}01^{1{,}4} \) \( = 798\ \text{K} \).</p>
    <p><strong>Q4.</strong> \( C_{P,m} \) \( = \dfrac{\gamma R}{\gamma - 1} \) \( = 29{,}1 \) et \( C_{V,m} = \dfrac{R}{\gamma - 1} \) \( = 20{,}8\ \text{J·K}^{-1}\text{·mol}^{-1} \). \( Q_{23} = C_P(T_3 - T_2) \) \( = 29{,}1 \times 1\,006 \) \( = 29{,}3\ \text{kJ} \) ; \( Q_{41} = C_V(T_1 - T_4) \) \( = 20{,}8 \times (-498) \) \( = -10{,}4\ \text{kJ} \) ; \( W = -(Q_{23} + Q_{41}) \) \( = -18{,}9\ \text{kJ} \) ; \(\eta = \dfrac{18{,}9}{29{,}3} = 0{,}65\). La formule du cours donne la même valeur : \(1 - \dfrac{20^{-0{,}4}}{1{,}4} \times \dfrac{2{,}01^{1{,}4} - 1}{1{,}01} = 0{,}65\).</p>
    <p><strong>Q5.</strong> Beau de Rochas à \(a = 20\) : \(1 - 20^{-0{,}4} = 0{,}70\), meilleur à rapport égal. Mais un moteur à essence ne peut pas dépasser \(a \approx 10\) à 13 (le mélange s'enflammerait avant l'étincelle) ; à \(a = 9\) : \(1 - 9^{-0{,}4} = 0{,}58\). Le Diesel l'emporte parce qu'il comprime de l'air pur, sans risque d'auto-inflammation prématurée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Moteur de Stirling et régénérateur</h3>
  <div class="statement">Un moteur de Stirling contient \(n = 0{,}040\ \text{mol}\) d'air (gaz parfait, \(C_{V,m} = \tfrac52 R\)). Son cycle : 1 → 2 détente isotherme à \(T_C = 650\ \text{K}\) de \(V_{\min} = 0{,}20\ \text{L}\) à \(V_{\max} = 0{,}60\ \text{L}\) ; 2 → 3 refroidissement isochore jusqu'à \(T_F = 320\ \text{K}\) ; 3 → 4 compression isotherme à \(T_F\) ; 4 → 1 échauffement isochore. Toutes les transformations sont réversibles.</div>
  <div class="q"><strong>Q1.</strong> Calculer la pression dans les quatre états. Représenter l'allure du cycle dans le diagramme de Clapeyron et justifier qu'il est moteur.</div>
  <div class="q"><strong>Q2.</strong> Calculer les transferts thermiques \(Q_{12}\), \(Q_{23}\), \(Q_{34}\), \(Q_{41}\) et le travail \(W\) par cycle.</div>
  <div class="q"><strong>Q3.</strong> Calculer le rendement sans régénérateur (la source chaude fournit \(Q_{12}\) et \(Q_{41}\)), puis avec un régénérateur parfait. Comparer à \(\eta_C\).</div>
  <div class="q"><strong>Q4.</strong> Le régénérateur réel ne restitue que 80 % de l'énergie qu'il a stockée. Calculer le rendement.</div>
  <div class="q"><strong>Q5.</strong> Le moteur tourne à 600 tours par minute (un cycle par tour). Quelle est sa puissance ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(P = nRT/V\) : \(P_1 = 10{,}8\ \text{bar}\) (650 K ; 0,20 L), \(P_2 = 3{,}60\ \text{bar}\) (650 K ; 0,60 L), \(P_3 = 1{,}77\ \text{bar}\) (320 K ; 0,60 L), \(P_4 = 5{,}32\ \text{bar}\) (320 K ; 0,20 L). Deux branches d'hyperbole reliées par deux verticales ; la détente se fait sur l'isotherme haute et la compression sur l'isotherme basse : le cycle est parcouru dans le sens horaire, il est moteur.</p>
    <p><strong>Q2.</strong> Isothermes : \( Q_{12} = nRT_C\ln 3 \) \( = 0{,}040 \times 8{,}314 \times 650 \times 1{,}099 \) \( = 237\ \text{J} \) ; \(Q_{34} = -nRT_F\ln 3 = -117\ \text{J}\). Isochores : \( Q_{41} = \tfrac52 nR(T_C - T_F) \) \( = 274\ \text{J} \) et \(Q_{23} = -274\ \text{J}\). Premier principe : \( W = -(237 - 117 + 274 - 274) \) \( = -121\ \text{J} \).</p>
    <p><strong>Q3.</strong> Sans régénérateur : \(\eta = \dfrac{121}{237 + 274} = 0{,}24\). Avec un régénérateur parfait, l'énergie \(Q_{41}\) vient du régénérateur, qui l'a stockée pendant 2 → 3 : la source chaude ne fournit que \(Q_{12}\) et \( \eta = \dfrac{121}{237} = 0{,}51 \) \( = 1 - \dfrac{320}{650} = \eta_C \). Le cycle est alors ditherme et réversible.</p>
    <p><strong>Q4.</strong> La source chaude doit compléter les 20 % manquants : elle fournit \(237 + 0{,}20 \times 274 = 292\ \text{J}\) ; \(\eta = 121/292 = 0{,}41\).</p>
    <p><strong>Q5.</strong> 10 cycles par seconde : \(\mathcal P = 10 \times 121 \approx 1{,}2\ \text{kW}\) (pour ce modèle réversible ; un moteur réel en fournit nettement moins).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Moteur ditherme réel : entropie créée et travail perdu</h3>
  <div class="statement">Un moteur fonctionne en cycles entre une source chaude à \(T_C = 800\ \text{K}\) et une source froide à \(T_F = 300\ \text{K}\). À chaque cycle, il reçoit \(Q_C = 1\,000\ \text{J}\) de la source chaude ; son rendement réel mesuré vaut \(\eta = 0{,}35\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le rendement de Carnot ; commenter.</div>
  <div class="q"><strong>Q2.</strong> Calculer, par cycle, le travail \(W\) et le transfert thermique \(Q_F\) reçus par le fluide.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'entropie créée par cycle. Conclure sur la réversibilité.</div>
  <div class="q"><strong>Q4.</strong> Quel travail le moteur fournirait-il s'il était réversible, à \(Q_C\) identique ? Relier le travail perdu à l'entropie créée.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( \eta_C = 1 - \dfrac{T_F}{T_C} \) \( = 1 - \dfrac{300}{800} = 0{,}625 \). Le rendement réel, \(0{,}35 \lt \eta_C\), est conforme au théorème de Carnot ; il en vaut 56 %.</p>
    <p><strong>Q2.</strong> Le moteur fournit \(\eta\,Q_C = 350\ \text{J}\), donc \(W = -350\ \text{J}\). Premier principe sur un cycle : \( Q_F = -W - Q_C = 350 - 1\,000 \) \( = -650\ \text{J} \) (650 J cédés à la source froide).</p>
    <p><strong>Q3.</strong> Sur un cycle, \( \Delta S = 0 \) \( = \dfrac{Q_C}{T_C} + \dfrac{Q_F}{T_F} + S_{\text{créée}} \), d'où \( S_{\text{créée}} \) \( = -\dfrac{1\,000}{800} + \dfrac{650}{300} \) \( = -1{,}25 + 2{,}17 \) \( = 0{,}92\ \text{J·K}^{-1} \gt 0 \) : le fonctionnement est <strong>irréversible</strong>.</p>
    <p><strong>Q4.</strong> Réversible : \(S_{\text{créée}} = 0\), \(\eta = \eta_C\), travail fourni \(0{,}625 \times 1\,000 = 625\ \text{J}\). Travail perdu : \(625 - 350 = 275\ \text{J}\), et \( T_F\,S_{\text{créée}} \) \( = 300 \times 0{,}917 \) \( = 275\ \text{J} \) : en éliminant \(Q_F\) entre les deux bilans, \(-W = \eta_C Q_C - T_F S_{\text{créée}}\). Chaque irréversibilité coûte du travail.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Cycle combiné d'une centrale électrique</h3>
  <div class="statement">Une centrale utilise deux moteurs en série : le moteur 1 (turbine à gaz) fonctionne entre \(T_1 = 1\,200\ \text{K}\) et \(T_m = 600\ \text{K}\) ; l'énergie qu'il cède à \(T_m\) est intégralement reçue par le moteur 2 (turbine à vapeur), qui fonctionne entre \(T_m\) et \(T_2 = 300\ \text{K}\). On suppose d'abord les deux cycles réversibles.</div>
  <div class="q"><strong>Q1.</strong> Calculer les rendements \(\eta_1\) et \(\eta_2\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(Q = 1\) unité reçue par le moteur 1, calculer le travail total fourni. En déduire le rendement global et montrer que \(\eta_{\text{global}} = 1 - (1 - \eta_1)(1 - \eta_2)\).</div>
  <div class="q"><strong>Q3.</strong> Comparer au rendement d'un seul moteur réversible entre \(T_1\) et \(T_2\). Interpréter.</div>
  <div class="q"><strong>Q4.</strong> En réalité, la turbine à gaz a un rendement de 0,38 et le cycle à vapeur, alimenté par la chaleur des gaz d'échappement, un rendement de 0,36. Calculer le rendement global.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( \eta_1 = 1 - \dfrac{600}{1\,200} \) \( = 0{,}50 \) ; \(\eta_2 = 1 - \dfrac{300}{600} = 0{,}50\).</p>
    <p><strong>Q2.</strong> Le moteur 1 fournit \(\eta_1 = 0{,}50\) et cède \(1 - \eta_1 = 0{,}50\), que le moteur 2 reçoit ; il en convertit \(\eta_2(1 - \eta_1) = 0{,}25\). Travail total : \(0{,}75\), donc \(\eta_{\text{global}} = 0{,}75\). En général : \( \eta_{\text{global}} \) \( = \eta_1 + (1 - \eta_1)\eta_2 \) \( = 1 - (1 - \eta_1)(1 - \eta_2) \).</p>
    <p><strong>Q3.</strong> Un moteur réversible unique : \(1 - \dfrac{300}{1\,200} = 0{,}75\), identique. En effet \( (1 - \eta_1)(1 - \eta_2) \) \( = \dfrac{T_m}{T_1}\cdot\dfrac{T_2}{T_m} \) \( = \dfrac{T_2}{T_1} \). Deux moteurs réversibles en série équivalent à un seul entre les températures extrêmes : chaîner les machines ne fait pas mieux que Carnot, mais permet d'exploiter toute la plage de températures avec deux technologies adaptées.</p>
    <p><strong>Q4.</strong> \( \eta_{\text{global}} \) \( = 1 - (1 - 0{,}38)(1 - 0{,}36) \) \( = 1 - 0{,}62 \times 0{,}64 \) \( = 0{,}60 \). C'est l'ordre de grandeur des meilleures centrales à cycle combiné (environ 60 %), contre 35 à 40 % pour la turbine à gaz seule.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Moteur entre deux réservoirs de capacité finie</h3>
  <div class="statement">Deux réservoirs contiennent chacun \(m = 10\ \text{kg}\) d'eau (\(c = 4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\)), l'un à \(T_1 = 360\ \text{K}\), l'autre à \(T_2 = 280\ \text{K}\). Ce ne sont pas des thermostats : leur température varie. Un moteur ditherme réversible fonctionne entre eux, par cycles très courts (pendant un cycle, les températures des réservoirs restent presque constantes), jusqu'à ce que les deux réservoirs atteignent la même température \(T_e\). On néglige les échanges avec l'extérieur.</div>
  <div class="q"><strong>Q1.</strong> On considère le système {réservoirs + fluide du moteur}. Écrire son bilan d'entropie entre l'état initial et l'état final (le fluide a décrit un nombre entier de cycles). En déduire \(T_e\).</div>
  <div class="q"><strong>Q2.</strong> Écrire le bilan d'énergie et en déduire le travail total fourni. Application numérique.</div>
  <div class="q"><strong>Q3.</strong> Calculer le rapport du travail fourni à l'énergie cédée par le réservoir chaud. Comparer au rendement de Carnot calculé avec les températures initiales et expliquer.</div>
  <div class="q"><strong>Q4.</strong> Sans moteur, on met les réservoirs en contact. Calculer la température finale et l'entropie créée. Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le système est isolé thermiquement et le moteur est réversible : \(S_{\text{éch}} = 0\), \(S_{\text{créée}} = 0\), donc \(\Delta S = 0\). Le fluide revient à son état initial (\(\Delta S_{\text{fluide}} = 0\)) ; pour les réservoirs (phases condensées) : \(mc\ln\dfrac{T_e}{T_1} + mc\ln\dfrac{T_e}{T_2} = 0\), d'où \( T_e = \sqrt{T_1T_2} \) \( = \sqrt{360 \times 280} \) \( = 317{,}5\ \text{K} \).</p>
    <p><strong>Q2.</strong> Énergie : \(\Delta U_{\text{réservoirs}} + \Delta U_{\text{fluide}} = W\) avec \(\Delta U_{\text{fluide}} = 0\), d'où le travail fourni \( -W \) \( = -mc(T_e - T_1) - mc(T_e - T_2) \) \( = mc\,(T_1 + T_2 - 2T_e) \). A.N. : \( -W \) \( = 10 \times 4\,180 \times (640 - 635{,}0) \) \( = 2{,}1\times10^{5}\ \text{J} \), soit 210 kJ.</p>
    <p><strong>Q3.</strong> Le réservoir chaud cède \( mc\,(T_1 - T_e) \) \( = 41\,800 \times 42{,}5 \) \( = 1{,}78\ \text{MJ} \) ; rapport : \(0{,}21/1{,}78 = 0{,}12\). Le rendement de Carnot initial vaut \(1 - 280/360 = 0{,}22\) ; mais à mesure que les températures se rapprochent, le rendement de Carnot de chaque cycle diminue jusqu'à 0. Le rendement moyen est donc bien inférieur au rendement initial.</p>
    <p><strong>Q4.</strong> Par conservation de l'énergie, avec des masses égales : \( T = \dfrac{T_1 + T_2}{2} \) \( = 320\ \text{K} \), plus chaud que \(T_e\) puisque l'énergie n'a pas été convertie en travail. Entropie créée : \( S_{\text{créée}} = \Delta S \) \( = mc\ln\dfrac{T^2}{T_1T_2} \) \(= 41\,800 \times \ln\dfrac{320^2}{360 \times 280}\) \( = 41\,800 \times 0{,}0157 \) \( = 658\ \text{J·K}^{-1} \). Le contact direct gaspille toute la possibilité de produire du travail.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Chauffer un bâtiment : pompe à chaleur ou cogénération ?</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème <em>machines thermiques, efficacité, cogénération</em>). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">Un petit bâtiment doit être maintenu à \(\theta_i = 21\ °\text{C}\) quand il fait \(\theta_e = -2\ °\text{C}\) dehors ; il perd alors une puissance thermique \(\mathcal P_{\text{th}} = 12\ \text{kW}\). On compare plusieurs solutions. Toutes les énergies sont celles reçues par le fluide des machines ; \(c_{\text{eau}} = 4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\).</div>
  <p class="exo-part">Partie A — La pompe à chaleur</p>
  <div class="q"><strong>A1.</strong> Préciser la source chaude, la source froide et le signe de chaque échange d'énergie d'une pompe à chaleur air-eau qui chauffe ce bâtiment. Calculer son efficacité maximale \(e_{PAC,C}\).</div>
  <div class="q"><strong>A2.</strong> Pour que la chaleur circule, le fluide se condense à 45 °C (dans les radiateurs) et s'évapore à −10 °C (dans l'échangeur extérieur). Expliquer ces choix, puis calculer l'efficacité de Carnot entre ces deux températures.</div>
  <div class="q"><strong>A3.</strong> La machine réelle atteint 60 % de cette dernière valeur. Calculer son efficacité, la puissance électrique consommée et la puissance prise à l'air extérieur.</div>
  <p class="exo-part">Partie B — Essai sur banc</p>
  <div class="q"><strong>B1.</strong> Sur un banc d'essai, le condenseur d'une pompe à chaleur plonge dans un bac de 30 kg d'eau, l'évaporateur dans un autre bac de 30 kg. Le compresseur reçoit 1,20 kW. À un instant où \(\theta_C = 30\ °\text{C}\) et \(\theta_F = 5\ °\text{C}\), la température du bac chaud monte de 1,6 K par minute. Calculer l'efficacité à cet instant et la comparer à sa borne de Carnot.</div>
  <div class="q"><strong>B2.</strong> Au même instant, le bac froid se refroidit de 1,1 K par minute. Calculer la puissance que ce bac cède au fluide et l'efficacité frigorifique apparente \(e_F\). Le premier principe impose \(e_{PAC} = 1 + e_F\) : est-ce vérifié ? Proposer une explication.</div>
  <div class="q"><strong>B3.</strong> Comment évolue l'efficacité mesurée au cours de l'essai ? Pourquoi ?</div>
  <p class="exo-part">Partie C — La cogénération</p>
  <div class="q"><strong>C1.</strong> Un moteur à gaz de cogénération a un rendement électrique de 0,32 et récupère, sous forme de chaleur utile, 52 % de l'énergie du combustible. Expliquer le principe de la cogénération et calculer le rendement global.</div>
  <div class="q"><strong>C2.</strong> Ce moteur fournit les 12 kW de chauffage. Calculer la puissance de combustible brûlée et la puissance électrique produite.</div>
  <div class="q"><strong>C3.</strong> L'électricité produite est injectée dans le réseau, où elle évite de la faire produire dans une centrale à gaz de rendement 0,50. Quelle puissance de gaz la cogénération consomme-t-elle « en net » ?</div>
  <p class="exo-part">Partie D — Bilan</p>
  <div class="q"><strong>D1.</strong> Comparer les puissances de gaz consommées pour chauffer le bâtiment par : une chaudière de rendement 0,97 ; la pompe à chaleur de A3, alimentée par une centrale à gaz de rendement 0,50 ; la cogénération (C3). Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Source chaude : l'intérieur du bâtiment (\(T_C = 294{,}15\ \text{K}\)), source froide : l'air extérieur (\(T_F = 271{,}15\ \text{K}\)). Le fluide reçoit du travail (\(W \gt 0\)), prend de l'énergie à l'air extérieur (\(Q_F \gt 0\)) et en cède au bâtiment (\(Q_C \lt 0\)). \( e_{PAC,C} \) \( = \dfrac{T_C}{T_C - T_F} \) \( = \dfrac{294{,}15}{23} = 12{,}8 \).</p>
    <p><strong>A2.</strong> Un transfert thermique ne va spontanément que du chaud vers le froid : pour céder de l'énergie à l'eau des radiateurs (et donc au bâtiment), le fluide doit être plus chaud qu'elle ; pour en prendre à l'air extérieur, il doit être plus froid que lui. Entre 318,15 K et 263,15 K : \( e_{PAC,C}' = \dfrac{318{,}15}{55} \) \( = 5{,}78 \), deux fois moins que la borne de A1 : les écarts de température dans les échangeurs coûtent cher.</p>
    <p><strong>A3.</strong> \(e_{PAC} = 0{,}60 \times 5{,}78 = 3{,}47\). Puissance électrique : \( \mathcal P = \dfrac{12}{3{,}47} \) \( = 3{,}46\ \text{kW} \). Premier principe : puissance prise à l'air \( \dot Q_F = 12 - 3{,}46 \) \( = 8{,}54\ \text{kW} \).</p>
    <p><strong>B1.</strong> Puissance reçue par le bac chaud : \( m\,c\,\dfrac{\mathrm d\theta_C}{\mathrm dt} \) \( = 30 \times 4\,180 \times \dfrac{1{,}6}{60} \) \( = 3{,}34\ \text{kW} \) ; \( e_{PAC} = \dfrac{3{,}34}{1{,}20} \) \( = 2{,}79 \). Borne de Carnot entre les bacs : \(\dfrac{303{,}15}{25} = 12{,}1\) ; la machine en atteint 23 %.</p>
    <p><strong>B2.</strong> Puissance cédée par le bac froid : \(30 \times 4\,180 \times \dfrac{1{,}1}{60} = 2{,}30\ \text{kW}\), d'où \(e_F = 2{,}30/1{,}20 = 1{,}92\). Or \(1 + e_F = 2{,}92 \gt e_{PAC} = 2{,}79\) : le bac chaud reçoit moins que \(\mathcal P + \dot Q_F\), soit environ 0,16 kW de moins. Explications : le bac chaud, plus chaud que la pièce, lui cède de l'énergie ; une partie de la puissance électrique échauffe le moteur du compresseur et l'air de la pièce au lieu du fluide. Le bac froid, plus froid que la pièce, en reçoit au contraire un peu d'énergie : son \(e_F\) apparent sous-estime même l'énergie réellement prise par le fluide. Les échanges parasites avec la pièce expliquent l'écart.</p>
    <p><strong>B3.</strong> Le bac chaud se réchauffe et le bac froid se refroidit : l'écart \(T_C - T_F\) se creuse, la borne de Carnot \(T_C/(T_C - T_F)\) diminue et l'efficacité réelle avec elle. Les bacs ne sont pas des thermostats : le modèle ditherme ne vaut que sur une courte durée.</p>
    <p><strong>C1.</strong> Tout moteur doit céder de l'énergie à une source froide ; la cogénération récupère cette énergie (eau de refroidissement, gaz d'échappement) à une température assez haute pour chauffer, au lieu de la rejeter. Rendement global : \(0{,}32 + 0{,}52 = 0{,}84\).</p>
    <p><strong>C2.</strong> Combustible : \(\dfrac{12}{0{,}52} = 23{,}1\ \text{kW}\) ; électricité : \(0{,}32 \times 23{,}1 = 7{,}4\ \text{kW}\).</p>
    <p><strong>C3.</strong> La centrale aurait brûlé \(\dfrac{7{,}4}{0{,}50} = 14{,}8\ \text{kW}\) de gaz pour produire ces 7,4 kW ; consommation nette de la cogénération : \(23{,}1 - 14{,}8 = 8{,}3\ \text{kW}\).</p>
    <p><strong>D1.</strong> Chaudière : \(\dfrac{12}{0{,}97} = 12{,}4\ \text{kW}\) de gaz. Pompe à chaleur : \(\dfrac{3{,}46}{0{,}50} = 6{,}9\ \text{kW}\). Cogénération : 8,3 kW nets. Les deux machines thermiques divisent presque par deux la consommation de la chaudière, la meilleure étant ici la pompe à chaleur. La chaudière brûle un combustible capable de produire du travail pour obtenir seulement de la chaleur à basse température ; la pompe à chaleur et la cogénération exploitent cette différence de « qualité » des énergies, mesurée par le théorème de Carnot.</p>
  </div>
</div>
