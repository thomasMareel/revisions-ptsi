<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les <strong>performances</strong> d'un système asservi autres que la stabilité, au programme du semestre S2 de sciences industrielles (compétences C2 « Déterminer les performances d'un système asservi » et C1 « Proposer une démarche permettant d'évaluer les performances »). <strong>Tout y est exigible en 1ʳᵉ année</strong>, sauf ce qui est signalé au §5 et la dernière section. Il s'appuie sur <a href="#slci/cours">« SLCI : modélisation et transformée de Laplace »</a> (théorème de la valeur finale, classe), <a href="#schblocs/cours">« Schéma-blocs et systèmes asservis »</a> (FTBO, FTBF, perturbations), <a href="#sys2/cours">« Systèmes du 2e ordre »</a> (dépassement, abaque du temps de réponse) et <a href="#stabilite/cours">« Stabilité des systèmes asservis »</a> (marges). Il prépare, en 2ᵉ année, <a href="#correcteurs/cours">« Correction des SLCI »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Critères du cahier des charges</strong> (C1, S2) : stabilité (amortissement, dépassement relatif), précision (écart statique, erreur de traînage), rapidité (temps de réponse à 5 %, temps de montée, bande passante, retard de traînage) (§1, §4, §7).</li>
        <li><strong>Précision d'un système asservi</strong> (C2, S2) : théorème de la valeur finale ; écart statique vis-à-vis de la consigne ; lien entre la classe de la fonction de transfert en boucle ouverte et l'écart statique (§2).</li>
        <li><strong>Écart et erreur vis-à-vis d'une perturbation</strong> (C2, S2) ; perturbation, poursuite et régulation dans la structure d'un système asservi (B2, S1) (§3).</li>
        <li><strong>Rapidité d'un système</strong> (C2, S2) : temps de réponse à 5 %, temps de montée, bande passante (§4).</li>
        <li><strong>Écart et erreur</strong> (C2, S2) : distinction avec une chaîne de retour non unitaire (§6) ; <strong>erreur de traînage</strong> vis-à-vis de la consigne et retard de traînage (§2, §7).</li>
        <li><strong>Proposer une démarche permettant d'évaluer les performances</strong> (C1, S2) et <strong>vérifier la cohérence du modèle</strong> en confrontant ses résultats à des mesures (B3, S2) : démarche complète (§8).</li>
      </ul>
      <p>Relève de la 2ᵉ année : le réglage des correcteurs proportionnel, proportionnel intégral et à avance de phase, dont le §5 ne présente que le principe, et la réduction d'un modèle à ses pôles dominants (<a href="#correcteurs/cours">« Correction des SLCI »</a>). Hors programme des deux années : correcteurs PD et PID, réglage de Ziegler et Nichols.</p>
    </div>

<div class="course-section">
  <div class="sec-num">§1 · LES PERFORMANCES D'UN ASSERVISSEMENT</div>
  <h2>Quatre exigences du cahier des charges</h2>
  <div class="intro">Un asservissement stable n'est pas forcément satisfaisant : il doit aussi atteindre la consigne (précision), vite (rapidité), sans trop la dépasser (amortissement), et résister aux perturbations. Ces exigences se chiffrent sur la réponse à un échelon de consigne ; ce chapitre montre comment les prévoir à partir de la boucle ouverte.</div>

<figcaption>Les performances se lisent sur la réponse à un échelon de consigne : <strong>dépassement</strong> \(D_1\) (amortissement), <strong>temps de réponse à 5 %</strong> \(t_{r5\%}\), instant à partir duquel la sortie reste dans la bande ± 5 % autour de sa valeur finale (rapidité), et <strong>écart statique</strong> \(\varepsilon_s\) entre consigne et valeur finale (précision).</figcaption>
</figure>
  <div class="def-box">
    <ul>
      <li>L'<strong>écart</strong> \(\varepsilon(t)\) est la différence entre la consigne et la sortie (exprimées dans la même unité, retour unitaire). Sa limite en régime permanent est l'<strong>écart statique</strong> \(\varepsilon_s\) pour une consigne en échelon, l'<strong>écart de traînage</strong> \(\varepsilon_v\) pour une consigne en rampe.</li>
      <li>Le <strong>temps de réponse à 5 %</strong> \(t_{r5\%}\) est l'instant à partir duquel la sortie reste à moins de 5 % de sa variation finale.</li>
      <li>Le <strong>temps de montée</strong> \(t_m\) est la durée que met la sortie pour passer de 10 % à 90 % de sa variation finale. C'est la convention la plus courante ; certains sujets prennent l'instant du premier passage à la valeur finale : l'énoncé le précise.</li>
      <li>Le <strong>dépassement</strong> \(D_1\) est l'excès relatif du premier maximum sur la valeur finale : \(D_1 = \dfrac{s_{\max} - s_\infty}{s_\infty}\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — lire les performances sur la figure</strong>
    <p>La figure est tracée pour une boucle fermée du deuxième ordre de gain statique 0,9, de pulsation propre \(\omega_0 = 1\ \text{rad/s}\) et d'amortissement \(\xi = 0{,}4\), soumise à un échelon de consigne unité.</p>
    <ol>
      <li>Précision : la sortie tend vers 0,9, l'écart statique vaut \(\varepsilon_s = 1 - 0{,}9 = 0{,}1\), soit 10 % de la consigne.</li>
      <li>Amortissement : le maximum vaut 1,13, d'où \(D_1 = (1{,}13 - 0{,}9)/0{,}9 \approx 25\ \%\), rapporté à la valeur finale et non à la consigne.</li>
      <li>Rapidité : la sortie passe de 0,09 à 0,81 en \(t_m \approx 1{,}5\ \text{s}\) ; elle entre définitivement dans la bande \(0{,}9 \pm 0{,}045\) vers \(t_{r5\%} \approx 7{,}6\ \text{s}\). Une sortie qui monte vite peut mettre longtemps à se stabiliser.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : mesurer le temps de réponse à 5 % de la consigne au lieu de 5 % de la <strong>valeur finale</strong>, ou rapporter le dépassement à la consigne. Quand la valeur finale diffère de la consigne (écart statique non nul), les deux lectures donnent des résultats différents.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CALCULER L'ÉCART EN RÉGIME PERMANENT</div>
  <h2>La classe de la boucle ouverte décide</h2>
  <div class="prop-box">
    <strong>Théorème de la valeur finale</strong> (admis). Si \(f(t)\) a une limite finie quand \(t \to +\infty\), ce qui est le cas pour la sortie ou l'écart d'un système <strong>stable</strong> soumis à une entrée qui tend vers une constante, alors
    <div class="formula" data-nom="Théorème de la valeur finale">$$\lim_{t \to +\infty} f(t) = \lim_{p \to 0} p\,F(p).$$</div>
  </div>
  <div class="prop-box">
    Pour une boucle à retour unitaire, \(\varepsilon(p) = E(p) - S(p) = E(p) - H_{BF}(p)E(p)\), soit
    <div class="formula" data-nom="Écart d'une boucle à retour unitaire">$$\varepsilon(p) = \frac{E(p)}{1 + H_{BO}(p)},\qquad \varepsilon_\infty = \lim_{p \to 0} p\,\frac{E(p)}{1 + H_{BO}(p)}\quad\text{(boucle fermée stable)}.$$</div>
    Avec la FTBO sous forme canonique \(H_{BO}(p) = \dfrac{K}{p^\alpha}\cdot\dfrac{1 + \cdots}{1 + \cdots}\), seuls comptent la <strong>classe</strong> \(\alpha\) et le <strong>gain</strong> \(K\).
  </div>
  <div style="overflow-x:auto"><table>
    <tr><th>Consigne</th><th>Classe 0</th><th>Classe 1</th><th>Classe 2</th></tr>
    <tr><td>Échelon \(E_0\) : écart statique</td><td>\(\dfrac{E_0}{1 + K}\)</td><td>0</td><td>0</td></tr>
    <tr><td>Rampe \(a\,t\) : écart de traînage</td><td>infini</td><td>\(\dfrac{a}{K}\)</td><td>0</td></tr>
    <tr><td>Parabole \(\tfrac12 b\,t^2\) : écart en accélération</td><td>infini</td><td>infini</td><td>\(\dfrac{b}{K}\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — un écart statique et un écart de traînage</strong>
    <ol>
      <li>FTBO \(\dfrac{9}{(1 + 2p)(1 + 0{,}1p)}\) : classe 0, \(K = 9\). Pour un échelon unité, \(\varepsilon_s = \dfrac{1}{1 + 9} = 0{,}1\) : la sortie s'arrête à 90 % de la consigne.</li>
      <li>FTBO \(\dfrac{20}{p\,(1 + 0{,}1p)}\) : classe 1, \(K = 20\ \text{s}^{-1}\). Échelon : écart nul. Rampe de pente \(a = 0{,}5\ \text{m/s}\) : \(\varepsilon_v = \dfrac{0{,}5}{20} = 2{,}5\ \text{cm}\) de retard permanent.</li>
    </ol>
  </div>
  <div class="notice">Ces résultats supposent la boucle fermée <strong>stable</strong> : on la vérifie d'abord. Avec un retour non unitaire, on se ramène au retour unitaire (adaptateur de même gain que le capteur) ; si ce n'est pas possible, on calcule directement \(e - s\) avec la FTBF (§6).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Retrouver la ligne « échelon » du tableau.</span>
    <div class="content"><p>Avec \(E(p) = E_0/p\) : \(\varepsilon_\infty = \lim_{p \to 0} \dfrac{E_0}{1 + H_{BO}(p)}\). En classe 0, \(H_{BO}(0) = K\) et \(\varepsilon_\infty = E_0/(1 + K)\). En classe \(\alpha \geq 1\), \(H_{BO}(p) \sim K/p^\alpha \to \infty\) quand \(p \to 0\), donc \(\varepsilon_\infty = 0\). Pour une rampe, \(E(p) = a/p^2\) et \(\varepsilon_\infty = \lim \dfrac{a}{p\,(1 + H_{BO}(p))}\), soit \(\varepsilon_\infty = \lim \dfrac{a}{p + p\,H_{BO}(p)}\) : \(p\,H_{BO} \to K\) en classe 1, d'où \(a/K\).</p></div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le théorème de la valeur finale sans vérifier la stabilité. Avec la FTBO \(\dfrac{10}{p^2\,(1 + 0{,}5p)}\) (classe 2) et une rampe, le calcul donne un écart nul ; mais l'équation caractéristique \(0{,}5p^3 + p^2 + 10 = 0\) n'a pas de terme en \(p\) : la boucle est instable, la sortie diverge et la « limite » calculée n'a aucun sens.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · REJETER UNE PERTURBATION</div>
  <h2>Où placer l'intégrateur</h2>
  <div class="intro">Une régulation doit maintenir la sortie malgré les perturbations : couple résistant sur un moteur, ouverture d'une porte sur un four, rafale sur un drone. Par superposition, \(S = H_E\,E + H_D\,D\) ; l'effet permanent d'une perturbation constante \(D_0\) vaut \(H_D(0)\,D_0\).</div>
  <div class="def-box">
    On parle de <strong>poursuite</strong> (ou d'asservissement) quand la consigne varie et que la sortie doit la suivre (position d'un axe, cap d'un navire), et de <strong>régulation</strong> quand la consigne est constante et que la boucle doit surtout compenser les perturbations (température d'un four, vitesse d'un convoyeur chargé). Les mêmes outils s'appliquent : \(H_E\) pour la poursuite, \(H_D\) pour la régulation.
  </div>

  <div class="prop-box">
    Pour une boucle à retour unitaire de correcteur \(C\), où la perturbation \(D\) se soustrait entre un bloc amont \(G_1\) et un bloc aval \(G_2\) :
    <div class="formula" data-nom="Transfert d'une perturbation">$$H_D(p) = \frac{S(p)}{D(p)} = \frac{-\,G_2(p)}{1 + C(p)\,G_1(p)\,G_2(p)}.$$</div>
    Une perturbation constante est <strong>entièrement rejetée</strong> en régime permanent si et seulement si la chaîne <strong>en amont</strong> de son point d'entrée (\(C\,G_1\)) contient un intégrateur. Un intégrateur situé en aval ne suffit pas.
  </div>
  <div class="method-box">
    <strong>Exemple — deux intégrateurs qui ne se valent pas</strong>
    <p>\(G_1(p) = \dfrac{2}{1 + 0{,}5p}\) (actionneur), perturbation, puis processus \(G_2\) ; perturbation constante \(D_0\).</p>
    <ol>
      <li>\(G_2 = \dfrac{5}{1 + 2p}\), correcteur \(C = K_c = 4\) : \(H_D(0) = \dfrac{-5}{1 + 4 \times 2 \times 5} = -\dfrac{5}{41}\) : la sortie baisse durablement de \(0{,}12\,D_0\).</li>
      <li>Processus intégrateur \(G_2 = \dfrac{5}{p}\), même correcteur : \(H_D(p) = \dfrac{-5/p}{1 + 40/\big(p\,(1 + 0{,}5p)\big)}\), et \(H_D(0) = -\dfrac{5}{40} = -\dfrac{1}{8}\) : toujours un écart, malgré l'intégrateur.</li>
      <li>Correcteur à action intégrale \(C(p) = K_c\,\dfrac{1 + T_ip}{T_ip}\) : \(C(p) \to \infty\) quand \(p \to 0\), donc \(H_D(0) = 0\) : la perturbation est rejetée, à condition que la boucle reste stable.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — consigne et perturbation ensemble</strong>
    <p>Même boucle qu'au cas 1 (\(C = 4\), \(G_2 = \dfrac{5}{1 + 2p}\)), consigne en échelon \(E_0 = 1\) et perturbation \(D_0 = 0{,}5\) (dans l'unité de la sortie de \(G_1\)).</p>
    <ol>
      <li>Poursuite : \(H_E(0) = \dfrac{40}{1 + 40} \approx 0{,}976\).</li>
      <li>Régulation : \(H_D(0)\,D_0 = -\dfrac{5}{41} \times 0{,}5 \approx -0{,}061\).</li>
      <li>Par superposition, \(s_\infty \approx 0{,}976 - 0{,}061 = 0{,}915\) : l'écart permanent passe de 2,4 % (consigne seule) à 8,5 %, la perturbation en est la principale cause.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LA RAPIDITÉ</div>
  <h2>Lire le temps de réponse sur la boucle ouverte</h2>
  <div class="intro">Trois grandeurs chiffrent la rapidité : le temps de réponse à 5 %, le temps de montée (§1) et la bande passante de la boucle fermée, qui en est l'image fréquentielle (voir <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a>, §8). Toutes trois varient comme l'inverse de la pulsation de coupure à 0 dB de la boucle ouverte.</div>
  <div class="prop-box">
    <ul>
      <li>Si la boucle fermée est un premier ordre de constante de temps \(\tau'\) : \(t_{r5\%} = 3\tau'\), \(t_m = \tau'\ln 9 \approx 2{,}2\,\tau'\), bande passante \(1/\tau'\).</li>
      <li>Si c'est un deuxième ordre : abaque \(t_{r5\%}\,\omega_0\) en fonction de \(\xi\) (minimum ≈ 3 pour \(\xi \approx 0{,}7\) : voir <a href="#sys2/cours">« Systèmes du 2e ordre »</a>, §2).</li>
      <li>Repère général, pour une boucle bien amortie (\(M_\varphi\) de 45° à 70°) : \(t_{r5\%} \approx \dfrac{3}{\omega_{c0}}\), à un facteur 2 près, et la bande passante de la boucle fermée est voisine de \(\omega_{c0}\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — ce que le bouclage fait gagner</strong>
    <p>Processus \(\dfrac{9}{1 + 2p}\) (temps en secondes), retour unitaire, correcteur unité.</p>
    <ol>
      <li>En boucle ouverte : \(t_{r5\%} = 3 \times 2 = 6\ \text{s}\), \(t_m = 2\ln 9 \approx 4{,}4\ \text{s}\).</li>
      <li>FTBF : \(\dfrac{9}{10 + 2p} = \dfrac{0{,}9}{1 + 0{,}2p}\), premier ordre de constante de temps \(\tau' = 0{,}2\ \text{s}\) : \(t_{r5\%} = 0{,}6\ \text{s}\), \(t_m \approx 0{,}44\ \text{s}\), bande passante 5 rad/s. La boucle est dix fois plus rapide, au prix d'un écart statique de 10 %.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une boucle fermée du deuxième ordre</strong>
    <p>FTBO \(\dfrac{10}{p\,(1 + 0{,}1p)}\) : \(\omega_{c0} \approx 7{,}9\ \text{rad/s}\), \(M_\varphi \approx 52°\) ; FTBF \(\dfrac{1}{1 + 0{,}1p + 0{,}01p^2}\), \(\omega_0 = 10\ \text{rad/s}\), \(\xi = 0{,}5\).</p>
    <ol>
      <li>Abaque : \(t_{r5\%}\,\omega_0 \approx 5{,}3\) pour \(\xi = 0{,}5\), soit \(t_{r5\%} \approx 0{,}53\ \text{s}\) ; dépassement 16 % ; \(t_m \approx 0{,}16\ \text{s}\).</li>
      <li>Repère : \(3/\omega_{c0} \approx 0{,}38\ \text{s}\), bien du même ordre (facteur 1,4).</li>
      <li>Bande passante de la FTBF : 12,7 rad/s, environ \(1{,}6\,\omega_{c0}\).</li>
    </ol>
  </div>
  <div class="notice">Être rapide demande une pulsation de coupure élevée, donc un gain élevé et une commande énergique : la saturation de l'actionneur (tension, couple, courant maximal) fixe en pratique la rapidité accessible, quels que soient les calculs linéaires.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LE DILEMME STABILITÉ – PRÉCISION</div>
  <h2>Pourquoi il faut des correcteurs</h2>
  <div class="prop-box">
    <ul>
      <li><strong>Augmenter le gain</strong> : l'écart statique d'une classe 0 diminue sans s'annuler, l'écart de traînage d'une classe 1 diminue, la boucle accélère… mais les marges de stabilité fondent.</li>
      <li><strong>Ajouter un intégrateur</strong> : un écart s'annule et les perturbations en amont sont rejetées… mais la phase perd 90° à <em>toutes</em> les pulsations, ce qui dégrade fortement la marge de phase.</li>
    </ul>
    On ne peut donc pas tout obtenir avec un simple gain : on insère un <strong>correcteur</strong> \(C(p)\) qui agit différemment selon les pulsations — fort gain en basses pulsations (précision), phase préservée autour de \(\omega_{c0}\) (stabilité).
  </div>
  <div class="notice"><strong>Vu en 2ᵉ année</strong> : les correcteurs P, PI et à avance de phase sont au programme de PT, avec leur réglage (<a href="#correcteurs/cours">« Correction des SLCI »</a>). On en donne ici les structures et le principe, qui découlent directement de la classe et des marges ; les correcteurs PD et PID sont hors programme des deux années.</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Correcteur</th><th>Fonction de transfert</th><th>Effet principal</th></tr>
    <tr><td>Proportionnel (P)</td><td>\(K_p\)</td><td>règle rapidité et écart statique, au détriment des marges</td></tr>
    <tr><td>Intégral (I)</td><td>\(\dfrac{1}{T_ip}\)</td><td>classe + 1, mais \(-90°\) partout : rarement utilisé seul</td></tr>
    <tr><td>Proportionnel intégral (PI) (2ᵉ année)</td><td>\(K_p\Big(1 + \dfrac{1}{T_ip}\Big) = K_p\,\dfrac{1 + T_ip}{T_ip}\)</td><td>classe + 1 ; retard de phase limité aux basses pulsations si \(1/T_i \ll \omega_{c0}\)</td></tr>
    <tr><td>Proportionnel dérivé (PD) (hors programme)</td><td>\(K_p\,(1 + T_dp)\)</td><td>avance de phase, plus rapide et mieux amorti, mais amplifie le bruit</td></tr>
    <tr><td>PID (hors programme)</td><td>\(K_p\Big(1 + \dfrac{1}{T_ip} + T_dp\Big)\)</td><td>cumule précision (I) et amortissement (D)</td></tr>
    <tr><td>Avance de phase (2ᵉ année)</td><td>\(K\,\dfrac{1 + aTp}{1 + Tp}\), \(a \gt 1\)</td><td>remonte la phase autour de \(\omega_{c0}\) : dérivée filtrée, réalisable</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — un PI qui annule l'écart sans ruiner la marge (aperçu de 2ᵉ année)</strong>
    <p>Processus \(G(p) = \dfrac{2}{(1 + p)(1 + 0{,}2p)}\), retour unitaire. Sans correction (\(C = 1\)) : \(\varepsilon_s = 1/3\), et la boucle coupe 0 dB vers 1,6 rad/s.</p>
    <ol>
      <li>On ajoute \(C(p) = \dfrac{1 + T_ip}{T_ip}\) (\(K_p = 1\)) : la classe passe à 1, l'écart statique s'annule.</li>
      <li>On place la cassure \(1/T_i\) une décade sous la coupure : \(1/T_i = 0{,}16\ \text{rad/s}\), soit \(T_i \approx 6\ \text{s}\).</li>
      <li>Autour de \(\omega_{c0}\), \(|C| \approx 1\) et \(\arg C = -\arctan\dfrac{1}{T_i\omega} \approx -6°\) : la marge de phase ne perd qu'environ 6°. Le prix à payer est une fin de réponse plus lente (le PI « rattrape » l'écart avec la constante de temps \(T_i\)).</li>
    </ol>
  </div>
  <p>Le réglage méthodique des correcteurs (P, PI, avance de phase, boucles imbriquées) est l'objet du chapitre de deuxième année <a href="#correcteurs/cours">« Correction des SLCI — réglage des correcteurs »</a>.</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · ÉCART ET ERREUR : LE RETOUR NON UNITAIRE</div>
  <h2>Ce que mesure le comparateur, ce que voit l'utilisateur</h2>
  <div class="intro">Dans un système réel, le comparateur ne reçoit pas la sortie elle-même mais son image par un capteur (une tension pour une température, une vitesse, une position). Il faut alors distinguer l'écart, signal interne de la boucle, de l'erreur, qui intéresse l'utilisateur.</div>

<figcaption>Régulation de température : la consigne \(\theta_c\) (en °C) est convertie en tension par l'adaptateur \(K_a\) ; le capteur \(K_c\) convertit la température mesurée. L'<strong>écart</strong> \(\varepsilon = u_c - u_m\) est une tension ; l'<strong>erreur</strong> \(\theta_c - \theta\) est une température.</figcaption>
</figure>
  <div class="def-box">
    <ul>
      <li>L'<strong>écart</strong> \(\varepsilon(t) = u_c(t) - u_m(t)\) est la sortie du comparateur : différence entre l'image de la consigne et la mesure, dans l'unité du capteur (souvent des volts).</li>
      <li>L'<strong>erreur</strong> est la différence entre la sortie souhaitée et la sortie obtenue, dans l'unité de la sortie : \(\theta_c - \theta\) dans l'exemple d'un four (°C).</li>
    </ul>
    Si l'adaptateur a le même gain que le capteur (\(K_a = K_c\)), \(\varepsilon = K_c\,(\theta_c - \theta)\) : l'écart est l'image exacte de l'erreur, et l'on se ramène au retour unitaire avec la FTBO \(K_c\,C\,G\). On calcule alors l'écart par le tableau du §2, puis l'erreur en divisant par \(K_c\).
  </div>
  <div class="method-box">
    <strong>Exemple — la régulation d'un four</strong>
    <p>Four \(G(p) = \dfrac{4}{1 + 600p}\) (°C/V, temps en secondes), capteur \(K_c = 0{,}05\ \text{V/°C}\), correcteur proportionnel \(C = 20\), consigne \(\theta_c = 200\ \text{°C}\).</p>
    <ol>
      <li>Adaptateur réglé comme le capteur, \(K_a = 0{,}05\ \text{V/°C}\) : FTBO \(K_c\,C\,G = \dfrac{4}{1 + 600p}\), classe 0, \(K = 4\).</li>
      <li>Écart statique : \(u_c = 0{,}05 \times 200 = 10\ \text{V}\), \(\varepsilon_s = \dfrac{10}{1 + 4} = 2\ \text{V}\) ; erreur : \(2/0{,}05 = 40\ \text{°C}\). Le four se stabilise à 160 °C.</li>
      <li>Rapidité : FTBF du premier ordre de constante de temps \(600/(1 + 4) = 120\ \text{s}\), soit \(t_{r5\%} = 6\ \text{min}\), contre 30 min en boucle ouverte.</li>
      <li>Adaptateur mal étalonné, \(K_a = 0{,}055\ \text{V/°C}\) :<div class="formula">$$\theta_\infty = \frac{K_a\,C\,G(0)}{1 + K_c\,C\,G(0)}\,\theta_c = \frac{4{,}4}{5} \times 200 = 176\ \text{°C}.$$</div>L'erreur vaut 24 °C, mais l'écart \(11 - 0{,}05 \times 176 = 2{,}2\ \text{V}\) correspond à 44 °C : écart et erreur ne sont plus proportionnels.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : annoncer un « écart nul » comme une « erreur nulle ». Avec un adaptateur mal réglé ou un capteur dérivant, un intégrateur annule l'écart (la mesure égale l'image de la consigne) mais pas l'erreur : un asservissement n'est jamais plus précis que sa mesure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SUIVRE UNE RAMPE : ERREUR ET RETARD DE TRAÎNAGE</div>
  <h2>Poursuivre une consigne qui varie</h2>
  <div class="intro">Un axe de machine-outil qui suit une trajectoire, une antenne qui poursuit un satellite, un convoyeur qui accélère reçoivent des consignes en rampe. La précision se juge alors sur l'erreur de traînage, et la rapidité sur le retard de traînage.</div>
  <div class="prop-box">
    Pour une boucle à retour unitaire de classe 1 et de gain \(K\), soumise à la rampe \(e(t) = a\,t\), la sortie finit par suivre une rampe de même pente, décalée de l'<strong>erreur de traînage</strong> \(\varepsilon_v\), ou retardée du <strong>retard de traînage</strong> \(t_v\) :
    <div class="formula" data-nom="Erreur et retard de traînage (classe 1)">$$\varepsilon_v = \frac{a}{K},\qquad t_v = \frac{\varepsilon_v}{a} = \frac{1}{K}.$$</div>
    En classe 0, l'erreur croît sans limite (la sortie ne suit pas la pente) ; en classe 2, elle s'annule.
  </div>

<figcaption>Boucle de FTBO \(\dfrac{20}{p\,(1 + 0{,}1p)}\) (classe 1, \(K = 20\ \text{s}^{-1}\)) et consigne en rampe de pente \(a = 0{,}5\ \text{m/s}\). Après le transitoire, la sortie est une rampe de même pente : <strong>erreur de traînage</strong> \(\varepsilon_v = a/K = 2{,}5\ \text{cm}\) (écart vertical), ou <strong>retard de traînage</strong> \(t_v = 1/K = 50\ \text{ms}\) (écart horizontal).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — l'axe d'une machine de découpe</strong>
    <p>FTBO \(\dfrac{20}{p\,(1 + 0{,}1p)}\), consigne de position en rampe à \(a = 0{,}5\ \text{m/s}\).</p>
    <ol>
      <li>Classe 1, \(K = 20\ \text{s}^{-1}\) : la boucle est stable (degré 2, coefficients positifs).</li>
      <li>Erreur de traînage : \(\varepsilon_v = 0{,}5/20 = 2{,}5\ \text{cm}\) ; retard de traînage : \(t_v = 1/20 = 50\ \text{ms}\).</li>
      <li>Pour une erreur de 1 cm à la même vitesse, il faudrait \(K = 50\ \text{s}^{-1}\) ; mais la FTBF \(\dfrac{1}{1 + p/K + 0{,}1p^2/K}\) aurait alors \(\xi = \dfrac{1}{2\sqrt{0{,}1K}} \approx 0{,}22\) au lieu de 0,35 : précision et amortissement s'opposent encore.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(a/K\) avec le gain de la FTBF, ou à une boucle de classe 0 (l'erreur y est infinie). Le gain \(K\) d'une classe 1 a la dimension de l'inverse d'un temps : \(t_v = 1/K\) est un ordre de grandeur direct de la « réactivité » de la boucle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · VÉRIFIER UN CAHIER DES CHARGES</div>
  <h2>Une démarche complète</h2>
  <div class="intro">Évaluer un asservissement, c'est vérifier toutes les exigences à la fois, sur un modèle d'abord, sur des mesures ensuite. On l'applique au convoyeur d'une ligne de conditionnement : FTBO \(\dfrac{K}{(1 + 0{,}5p)(1 + 0{,}05p)}\) (classe 0, temps en secondes), correcteur proportionnel de gain réglable. Cahier des charges : boucle stable avec \(M_\varphi \geq 45°\), écart statique au plus 5 %, dépassement au plus 10 %.</div>
  <div class="method-box">
    <strong>Exemple — le convoyeur</strong>
    <ol>
      <li><strong>Stabilité</strong> : FTBO d'ordre 2 sans retard, stable pour tout \(K \gt 0\) (§7 de « Stabilité »).</li>
      <li><strong>Précision</strong> : \(\varepsilon_s = \dfrac{1}{1 + K} \leq 0{,}05\) impose \(K \geq 19\).</li>
      <li><strong>Amortissement</strong> avec \(K = 19\) : FTBF \(\dfrac{0{,}95}{1 + 0{,}0275p + 0{,}00125p^2}\), \(\omega_0 \approx 28{,}3\ \text{rad/s}\), \(\xi \approx 0{,}39\), dépassement 27 % ; \(M_\varphi \approx 44°\). Deux exigences sur quatre échouent.</li>
      <li><strong>Réglage inverse</strong> : un dépassement de 10 % demande \(\xi \geq 0{,}59\), donc \(K \leq 7{,}7\) ; l'écart statique vaut alors 12 %.</li>
      <li><strong>Conclusion</strong> : aucun gain ne satisfait à la fois la précision et l'amortissement. Il faut une action intégrale (classe 1 : écart nul quel que soit le gain), réglée sans dégrader la marge : c'est le correcteur PI de 2ᵉ année.</li>
    </ol>
  </div>

</figure>
  <div class="method-box">
    <strong>Exemple — confronter le modèle à la mesure</strong>
    <p>Un essai sur le convoyeur réel, réglé à \(K = 19\), donne une valeur finale de 0,94, un maximum de 1,21 et un temps de réponse à 5 % de 0,30 s.</p>
    <ol>
      <li>Le modèle prévoit 0,95, 1,20 et 0,27 s : valeur finale et dépassement (29 % mesuré, 27 % prévu) sont bien rendus.</li>
      <li>Le temps de réponse est sous-estimé de 10 % : un frottement ou une constante de temps négligée ralentit le système réel. Le modèle reste suffisant pour conclure, puisque les exigences non satisfaites le sont nettement.</li>
    </ol>
  </div>
  <div class="notice">Toujours conclure <strong>exigence par exigence</strong>, avec la valeur obtenue et la valeur exigée, et dire quel paramètre joue sur quelle exigence : le gain améliore précision et rapidité mais dégrade l'amortissement et les marges.</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · PRÉCISION ET RAPIDITÉ</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à chiffrer la précision et la rapidité d'un asservissement à partir de sa boucle ouverte, à évaluer l'effet des perturbations et à vérifier un cahier des charges exigence par exigence.</div>
  <div class="method-box"><strong>Méthode 1 — Calculer un écart en régime permanent</strong>
    <ol>
      <li>Vérifier la stabilité de la boucle fermée.</li>
      <li>Se ramener à un retour unitaire et mettre la FTBO sous forme canonique : classe \(\alpha\), gain \(K\).</li>
      <li>Lire le tableau (échelon : \(E_0/(1 + K)\) en classe 0, nul au-delà ; rampe : \(a/K\) en classe 1) ou appliquer \(\varepsilon_\infty = \lim_{p \to 0} \dfrac{p\,E(p)}{1 + H_{BO}(p)}\).</li>
      <li>Exprimer le résultat avec l'unité de la consigne (un écart de traînage en mètres, en degrés…).</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{49}{(1 + p)(1 + 0{,}1p)}\), échelon de 2 : classe 0, \(\varepsilon_s = \dfrac{2}{1 + 49} = 0{,}04\), soit 2 % de la consigne.</p>
  </div>
  <div class="method-box"><strong>Méthode 2 — Appliquer le théorème de la valeur finale</strong>
    <ol>
      <li>Vérifier que la limite existe : système (ou boucle fermée) stable, entrée qui tend vers une constante.</li>
      <li>Écrire la transformée de la grandeur cherchée : \(S(p) = H(p)\,E(p)\), \(\varepsilon(p) = \dfrac{E(p)}{1 + H_{BO}(p)}\)…</li>
      <li>Calculer \(\lim_{p \to 0} p\,F(p)\) en simplifiant d'abord les puissances de \(p\).</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBF \(\dfrac{0{,}9}{1 + 0{,}2p}\), échelon de 5 : \(s_\infty = \lim_{p \to 0} p \times \dfrac{0{,}9}{1 + 0{,}2p} \times \dfrac{5}{p} = 4{,}5\).</p>
  </div>
  <div class="method-box"><strong>Méthode 3 — Passer de l'écart à l'erreur avec un retour non unitaire</strong>
    <ol>
      <li>Identifier le gain du capteur \(K_c\) et celui de l'adaptateur \(K_a\).</li>
      <li>Si \(K_a = K_c\) : se ramener au retour unitaire de FTBO \(K_c\,C\,G\), calculer l'écart (en volts), puis l'erreur \(= \varepsilon/K_c\) (dans l'unité de la sortie).</li>
      <li>Si \(K_a \neq K_c\) : calculer directement la sortie par la FTBF, \(s_\infty = \dfrac{K_a\,C\,G(0)}{1 + K_c\,C\,G(0)}\,e_0\), puis l'erreur \(e_0 - s_\infty\).</li>
    </ol>
    <p><em>Exemple éclair :</em> génératrice tachymétrique de 0,1 V par tr/min, adaptateur identique, écart statique 0,5 V : l'erreur de vitesse vaut \(0{,}5/0{,}1 = 5\) tr/min.</p>
  </div>
  <div class="method-box"><strong>Méthode 4 — Évaluer l'effet d'une perturbation</strong>
    <ol>
      <li>Écrire \(H_D = \dfrac{\pm\,\text{blocs entre } D \text{ et } S}{1 + H_{BO}}\) (le signe est celui de l'entrée de \(D\) au sommateur).</li>
      <li>Effet permanent d'une perturbation en échelon \(D_0\) : \(H_D(0)\,D_0\) ; avec une consigne, superposer \(H_E(0)\,E_0 + H_D(0)\,D_0\).</li>
      <li>Conclusion rapide : rejet total si et seulement si un intégrateur se trouve entre le comparateur et le point d'entrée de la perturbation.</li>
    </ol>
    <p><em>Exemple éclair :</em> correcteur \(C = 10\), actionneur \(G_1 = 1\), perturbation soustraite, processus \(G_2 = \dfrac{2}{1 + p}\) : \(H_D(0) = \dfrac{-2}{1 + 20} \approx -0{,}095\) ; une perturbation unité fait baisser la sortie de 0,095 en régime permanent.</p>
  </div>
  <div class="method-box"><strong>Méthode 5 — Calculer l'erreur et le retard de traînage</strong>
    <ol>
      <li>Vérifier la stabilité ; identifier la classe de la FTBO.</li>
      <li>Classe 1 de gain \(K\) : \(\varepsilon_v = a/K\) pour une rampe de pente \(a\) ; retard de traînage \(t_v = \varepsilon_v/a = 1/K\). Classe 0 : erreur infinie ; classe 2 : nulle.</li>
      <li>Pour une erreur imposée, en déduire le gain minimal \(K = a/\varepsilon_{v,max}\), puis contrôler l'amortissement et les marges.</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO \(\dfrac{25}{p\,(1 + 0{,}04p)}\), consigne en rampe de 2 rad/s : \(\varepsilon_v = 2/25 = 0{,}08\ \text{rad}\), \(t_v = 40\ \text{ms}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 6 — Estimer la rapidité</strong>
    <ol>
      <li>Boucle fermée du premier ordre : \(t_{r5\%} = 3\tau'\), \(t_m \approx 2{,}2\,\tau'\), bande passante \(1/\tau'\) ; du deuxième ordre : abaque avec \(\xi\) et \(\omega_0\).</li>
      <li>Ordre de grandeur à partir de la boucle ouverte : \(t_{r5\%} \approx 3/\omega_{c0}\) et bande passante de la boucle fermée voisine de \(\omega_{c0}\), pour une boucle bien amortie.</li>
      <li>Vérifier que la commande nécessaire ne sature pas l'actionneur.</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBF \(\dfrac{1}{1 + 0{,}05p}\) : \(t_{r5\%} = 0{,}15\ \text{s}\), \(t_m = 0{,}05\ln 9 \approx 0{,}11\ \text{s}\), bande passante 20 rad/s.</p>
  </div>
  <div class="method-box"><strong>Méthode 7 — Lire les performances sur une réponse indicielle</strong>
    <ol>
      <li>Valeur finale \(s_\infty\) ; écart statique \(E_0 - s_\infty\) (en valeur et en % de la consigne).</li>
      <li>Dépassement \(D_1 = (s_{\max} - s_\infty)/s_\infty\), rapporté à la <strong>valeur finale</strong>.</li>
      <li>Temps de réponse à 5 % : dernier instant où la courbe sort de la bande \(s_\infty \pm 5\ \%\) ; temps de montée : de 10 % à 90 % de \(s_\infty\).</li>
    </ol>
    <p><em>Exemple éclair :</em> consigne 2, valeur finale 1,9, maximum 2,28 : écart statique 0,1 (5 %), dépassement \(0{,}38/1{,}9 = 20\ \%\) ; la bande des 5 % est \([1{,}805\ ;\ 1{,}995]\).</p>
  </div>
  <div class="method-box"><strong>Méthode 8 — Choisir une structure de correction pour la précision (réglage en 2ᵉ année)</strong>
    <ol>
      <li>Écart à réduire sans l'annuler : augmenter le gain (P), dans la limite des marges.</li>
      <li>Écart à annuler (ou perturbation constante à rejeter) : ajouter une action intégrale (PI) en amont de la perturbation.</li>
      <li>Placer la cassure du PI une décade sous \(\omega_{c0}\) (\(T_i \approx 10/\omega_{c0}\)), puis recontrôler la marge de phase.</li>
    </ol>
    <p><em>Exemple éclair :</em> boucle de classe 0 coupant 0 dB à 1,6 rad/s : un PI de \(T_i \approx 6\ \text{s}\) annule l'écart statique et ne retire qu'environ 6° de marge de phase.</p>
  </div>
  <div class="method-box"><strong>Méthode 9 — Vérifier un cahier des charges complet</strong>
    <ol>
      <li>Stabilité et marges d'abord (critère du revers sur la FTBO).</li>
      <li>Précision : classe et gain de la FTBO, effet des perturbations, écart ou erreur selon la chaîne de retour.</li>
      <li>Rapidité et dépassement : modèle de la boucle fermée ou repères \(\xi \approx M_\varphi/100\), \(t_{r5\%} \approx 3/\omega_{c0}\).</li>
      <li>Conclure critère par critère, avec la valeur obtenue et la valeur exigée ; comparer aux mesures s'il y en a.</li>
    </ol>
    <p><em>Exemple éclair :</em> convoyeur de FTBO \(\dfrac{19}{(1 + 0{,}5p)(1 + 0{,}05p)}\) : écart statique 5 % (exigé ≤ 5 %, conforme), dépassement 27 % (exigé ≤ 10 %, non conforme), \(M_\varphi \approx 44°\) (exigé ≥ 45°, non conforme).</p>
  </div>
  <div class="notice"><strong>Pièges classiques.</strong> Appliquer le théorème de la valeur finale à une boucle instable ; compter un intégrateur situé en aval d'une perturbation ; utiliser le gain de la FTBF au lieu de celui de la FTBO dans le tableau ; confondre écart (sortie du comparateur, en volts) et erreur (dans l'unité de la sortie) ; rapporter le dépassement à la consigne au lieu de la valeur finale ; oublier qu'un intégrateur dégrade la marge de phase.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Théorème de la valeur finale — perturbation</h3>
  <div class="statement">Système avec perturbation \(d(t)\) ajoutée en entrée du processus. \(H_p(p) = \frac{1}{p(1+p)}\), correcteur \(C(p) = 10\), retour unitaire. Consigne nulle, perturbation échelon \(D\).</div>
  <div class="q"><strong>Q1.</strong> Écrire le transfert perturbation → sortie \(S(p)/D(p)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(s_\infty\) sous perturbation échelon \(D=1\).</div>
  <div class="q"><strong>Q3.</strong> Comment le correcteur C réduit-il l'effet de la perturbation ? Comment l'annuler ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S/D = H_p/(1+C H_p) = \frac{1}{p(1+p)+10}\), soit \(S/D = \frac{1}{p^2+p+10}\). Le dénominateur est de degré 2 à coefficients positifs : la boucle est stable, le théorème de la valeur finale s'applique.</p>
    <p><strong>Q2.</strong> \(S_\infty = \lim_{p\to0}p\times\frac{1}{p}\times\frac{1}{p^2+p+10} = \frac{1}{10} = 0{,}1\). La perturbation crée une erreur résiduelle de 0,1 en sortie.</p>
    <p><strong>Q3.</strong> Le dénominateur vaut 10 à \(p=0\) grâce au gain \(C=10\). Plus le gain est élevé, plus l'effet de la perturbation est atténué, sans jamais s'annuler : l'intégrateur du processus est <strong>en aval</strong> de la perturbation et ne la rejette pas. Il faut un intégrateur en amont, dans le correcteur. Un intégrateur pur \(C = K/p\) rendrait la boucle instable (polynôme caractéristique \(p^3 + p^2 + K\), sans terme en \(p\)). Avec un PI \(C = K_p\big(1 + 1/(T_ip)\big)\) (vu en 2ᵉ année), le polynôme caractéristique est \(T_ip^3 + T_ip^2 + K_pT_ip + K_p\) ; en y cherchant des pôles imaginaires purs \(p = j\omega\), on trouve \(\omega^2 = K_p\) et \(T_i = 1\ \text{s}\) : la limite de stabilité est \(T_i = 1\ \text{s}\), la boucle est stable pour \(T_i \gt 1\ \text{s}\) (pour \(T_i\) grand, le PI se réduit au gain \(K_p\), stable), et l'effet permanent de la perturbation devient nul.</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Calculer \(K_P\), \(T_i\), \(T_d\) par Ziegler-Nichols.</div>
  <div class="q"><strong>Q2.</strong> Écrire \(C(p)\) et identifier ses zéros.</div>
  <div class="q"><strong>Q3.</strong> Quel est l'effet de chaque terme (P, I, D) sur les performances ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Formules Z-N (boucle fermée) : \(K_P = 0{,}6K_{ult} = 7{,}2\). \(T_i = T_{ult}/2 = 1\ \text{s}\). \(T_d = T_{ult}/8 = 0{,}25\ \text{s}\).</p>
    <p><strong>Q2.</strong> \(C(p) = 7{,}2\left(1+\frac{1}{p}+0{,}25p\right)\), soit \(C(p) = 7{,}2\times\frac{0{,}25p^2+p+1}{p}\). Les zéros du numérateur : \(0{,}25p^2+p+1=0\) → \(p_{1,2}=\frac{-1\pm\sqrt{1-1}}{0{,}5} = -2\) (double). Zéro double en \(p=-2\).</p>
    <p><strong>Q3.</strong> Terme P : règle le gain → rapidité et précision de base. Terme I : annule l'erreur statique (intégration de l'erreur accumulée). Terme D : accélère la réponse en anticipant les variations → réduit le dépassement, améliore \(M_\varphi\), mais amplifie le bruit HF. Z-N est un point de départ — un affinage par simulation est toujours nécessaire.</p>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Précision — effet de la classe, et le piège de la stabilité</h3>
  <div class="statement">
    <p>Un système en retour unitaire a pour boucle ouverte \(H_{BO}(p) = \dfrac{10}{p(1+0{,}5p)}\). On veut analyser la précision à l'échelon et à la rampe, puis l'effet d'un intégrateur supplémentaire.</p>
  </div>
  <div class="q"><strong>Q1.</strong> Identifier la classe \(\alpha\) et le gain \(K\) de la FTBO. Vérifier la stabilité, puis calculer \(\varepsilon_\infty\) pour un échelon \(E_0 = 1\) et pour une rampe de pente \(a = 2\).</div>
  <div class="q"><strong>Q2.</strong> Pour annuler l'écart de traînage, on ajoute un intégrateur : \(H'_{BO}(p) = \dfrac{10}{p^2(1+0{,}5p)}\). Que donne le théorème de la valeur finale pour la rampe ? Ce résultat est-il valable ?</div>
  <div class="q"><strong>Q3.</strong> Un correcteur PI \(C(p) = K_p(1 + 1/(T_i p))\) (vu en 2ᵉ année) est ajouté en série avec la FTBO initiale. Quel est l'effet sur la classe ? Pourquoi peut-il rester stable, contrairement à l'intégrateur pur ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Un facteur \(1/p\) : classe \(\alpha = 1\), \(K = 10\ \text{s}^{-1}\). Équation caractéristique \(0{,}5p^2 + p + 10 = 0\) : degré 2, coefficients positifs, stable. Échelon : \(\varepsilon_\infty = 0\). Rampe : \(\varepsilon_\infty = a/K = 2/10 = 0{,}2\).</p>
    <p><strong>Q2.</strong> Formellement, classe 2 donne un écart de traînage nul. Mais l'équation caractéristique \(0{,}5p^3 + p^2 + 10 = 0\) n'a pas de terme en \(p\) : un coefficient nul suffit, la boucle est <strong>instable</strong> (deux pôles \(0{,}78 \pm 2{,}23j\)). La sortie diverge : le théorème de la valeur finale ne s'applique pas et « écart nul » n'a aucun sens. La phase de \(H'_{BO}\) est partout sous \(-180°\) (chapitre « Stabilité », §7).</p>
    <p><strong>Q3.</strong> Le PI contient un intégrateur \(1/(T_i p)\) : la classe augmente de 1 (ici de 1 à 2, écart de traînage nul). Mais il apporte aussi un zéro \(1 + T_ip\), qui remonte la phase au-dessus de \(-180°\) aux pulsations supérieures à \(1/T_i\) : la boucle peut rester stable si ce zéro est placé assez bas (\(T_i\) assez grand). C'est l'intérêt du PI : la précision d'un intégrateur sans en payer tout le prix en stabilité.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Synthèse — précision et marge, puis correcteur PI (vu en 2ᵉ année)</h3>
  <div class="statement">
    <p>Un système en boucle ouverte sans correcteur : \(G(p) = \dfrac{4}{(1+p)(1+0{,}2p)}\), retour unitaire. On veut : écart nul à l'échelon, marge de phase ≥ 45°.</p>
  </div>
  <div class="q"><strong>Q1.</strong> Sans correcteur : calculer \(\varepsilon_\infty\) à l'échelon, estimer \(\omega_{c0}\) sur les asymptotes, puis la calculer exactement et en déduire la marge de phase.</div>
  <div class="q"><strong>Q2.</strong> On ajoute un correcteur PI : \(C(p) = K_p\left(1 + \dfrac{1}{T_i p}\right)\). Quelle est la nouvelle classe ? Quel est le nouvel écart statique ?</div>
  <div class="q"><strong>Q3.</strong> Expliquer comment choisir \(T_i\) pour minimiser la dégradation de la marge de phase apportée par le correcteur PI.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sans correcteur, classe 0, \(K = 4\) : \(\varepsilon_\infty = E_0/(1+4) = 20\ \%\) de la consigne, insatisfaisant. Asymptotes : palier à \(20\log 4 \approx 12\) dB jusqu'à 1 rad/s, pente \(-20\) dB/déc jusqu'à 5 rad/s (où l'on arrive à \(12 - 14 = -2\) dB), \(-40\) au-delà : l'asymptote coupe 0 dB sur la pente \(-20\), en \(\omega = 10^{12/20} \approx 4\ \text{rad/s}\). La courbe réelle, plus basse près des cassures, coupe plus tôt : \(16 = (1 + \omega^2)(1 + 0{,}04\,\omega^2)\) donne \(\omega_{c0} \approx 3{,}2\ \text{rad/s}\). Phase : \(-\arctan 3{,}21 - \arctan 0{,}64 \approx -105{,}4°\), d'où \(M_\varphi \approx 75°\) : marge confortable, mais précision insuffisante. (Avec l'estimation asymptotique, on aurait trouvé \(M_\varphi \approx 65°\) : le calcul exact s'impose.)</p>
    <p><strong>Q2.</strong> Le PI ajoute un intégrateur : nouvelle classe 1 → \(\varepsilon_\infty = 0\) à l'échelon, si la boucle reste stable.</p>
    <p><strong>Q3.</strong> Le PI <strong>retarde</strong> la phase : \(-90°\) en basses pulsations, \(-45°\) en \(\omega = 1/T_i\), presque 0° au-delà de \(10/T_i\). Pour qu'il dégrade peu la marge, on place sa cassure une décade sous la coupure : \(1/T_i \approx \omega_{c0}/10\), soit \(T_i \approx 10/3{,}2 \approx 3\ \text{s}\). En \(\omega_{c0}\), il se comporte alors presque comme un gain pur et ne retire qu'environ \(\arctan 0{,}1 \approx 6°\) : \(M_\varphi \approx 69°\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Écart et erreur d'une régulation de vitesse</h3>
  <div class="statement">Un moteur est asservi en vitesse. La consigne \(N_c\) (tr/min) est convertie en tension par un adaptateur de gain \(K_a\) ; une génératrice tachymétrique de gain \(K_c = 0{,}01\ \text{V/(tr/min)}\) mesure la vitesse \(N\). Correcteur proportionnel \(C = K_p\) ; amplificateur et moteur : \(G(p) = \dfrac{50}{1 + 0{,}2p}\) (tr/min par volt). Consigne : échelon de 1 500 tr/min.</div>
  <div class="q"><strong>Q1.</strong> L'adaptateur est réglé comme le capteur, \(K_a = K_c\). Écrire la FTBO de la boucle à retour unitaire équivalente. Pour \(K_p = 20\), calculer l'écart statique (en volts), l'erreur (en tr/min) et la vitesse atteinte.</div>
  <div class="q"><strong>Q2.</strong> Quel gain \(K_p\) faudrait-il pour une erreur de 1 % ? Que vaudrait la tension de commande à l'instant de l'échelon ? Conclure.</div>
  <div class="q"><strong>Q3.</strong> Comparer les temps de réponse à 5 % en boucle ouverte et en boucle fermée (\(K_p = 20\)).</div>
  <div class="q"><strong>Q4.</strong> L'adaptateur dérive : \(K_a = 0{,}0102\ \text{V/(tr/min)}\). Calculer la vitesse atteinte, l'erreur et l'écart. Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> FTBO \(K_c\,K_p\,G(p) = \dfrac{0{,}5\,K_p}{1 + 0{,}2p}\), classe 0 ; pour \(K_p = 20\), \(K = 10\). L'image de la consigne vaut \(0{,}01 \times 1500 = 15\ \text{V}\) ; écart statique \(\varepsilon_s = \dfrac{15}{1 + 10} \approx 1{,}36\ \text{V}\) ; erreur \(1{,}36/0{,}01 \approx 136\ \text{tr/min}\) ; vitesse atteinte \(1500 \times \dfrac{10}{11} \approx 1364\ \text{tr/min}\).</p>
    <p><strong>Q2.</strong> \(\dfrac{1}{1 + K} \leq 0{,}01\) impose \(K \geq 99\), soit \(K_p \geq 198\). À l'instant de l'échelon, la vitesse est nulle et l'écart vaut 15 V : la commande demandée serait \(198 \times 15 \approx 3000\ \text{V}\). L'amplificateur sature bien avant : le modèle linéaire ne vaut plus et la précision ne s'obtient pas en augmentant indéfiniment le gain. Il faut une action intégrale.</p>
    <p><strong>Q3.</strong> Boucle ouverte : \(t_{r5\%} = 3 \times 0{,}2 = 0{,}6\ \text{s}\). Boucle fermée : premier ordre de constante de temps \(0{,}2/(1 + 10) \approx 18\ \text{ms}\), \(t_{r5\%} \approx 55\ \text{ms}\), si l'amplificateur ne sature pas (la commande initiale vaut déjà \(20 \times 15 = 300\ \text{V}\) : en pratique, la montée sera limitée par la saturation).</p>
    <p><strong>Q4.</strong> La FTBF de consigne vaut \(\dfrac{K_a\,K_p\,G(0)}{1 + K_c\,K_p\,G(0)} = \dfrac{0{,}0102 \times 1000}{11} \approx 0{,}927\) (tr/min par tr/min) : \(N_\infty \approx 1391\ \text{tr/min}\), erreur \(\approx 109\ \text{tr/min}\). L'écart vaut \(0{,}0102 \times 1500 - 0{,}01 \times 1391 \approx 1{,}39\ \text{V}\), soit l'image de 139 tr/min : écart et erreur ne correspondent plus. Un adaptateur mal réglé fausse la consigne ; seul un étalonnage commun capteur-adaptateur garantit qu'un écart nul est une erreur nulle.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Temps de réponse, temps de montée et bande passante</h3>
  <div class="statement">Un asservissement à retour unitaire a pour FTBO \(H_{BO}(p) = \dfrac{K}{p\,(1 + 0{,}05p)}\). On compare les réglages \(K = 10\) et \(K = 40\ \text{s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Mettre la FTBF sous forme canonique ; en déduire \(\omega_0\) et \(\xi\) pour chaque réglage.</div>
  <div class="q"><strong>Q2.</strong> Pour chaque réglage, donner le dépassement, et lire le temps de réponse à 5 % sur l'abaque (\(t_{r5\%}\,\omega_0 \approx 2{,}9\) pour \(\xi = 0{,}7\), \(\approx 7{,}9\) pour \(\xi = 0{,}35\)).</div>
  <div class="q"><strong>Q3.</strong> Les temps de montée valent 0,15 s et 0,05 s, les bandes passantes 14 et 40 rad/s. Quel réglage est le plus rapide ? Conclure en comparant aussi les écarts de traînage.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(H_{BF} = \dfrac{K}{0{,}05p^2 + p + K}\), soit \(H_{BF} = \dfrac{1}{1 + \frac{p}{K} + \frac{0{,}05}{K}p^2}\) : \(\omega_0 = \sqrt{K/0{,}05}\) et \(\xi = \dfrac{1}{2\sqrt{0{,}05\,K}}\). \(K = 10\) : \(\omega_0 \approx 14{,}1\ \text{rad/s}\), \(\xi \approx 0{,}71\). \(K = 40\) : \(\omega_0 \approx 28{,}3\ \text{rad/s}\), \(\xi \approx 0{,}35\).</p>
    <p><strong>Q2.</strong> \(K = 10\) : dépassement 4,3 %, \(t_{r5\%} \approx 2{,}9/14{,}1 \approx 0{,}21\ \text{s}\). \(K = 40\) : dépassement 30 %, \(t_{r5\%} \approx 7{,}9/28{,}3 \approx 0{,}28\ \text{s}\).</p>
    <p><strong>Q3.</strong> Avec \(K = 40\), la sortie monte trois fois plus vite (\(t_m\) de 0,05 s contre 0,15 s) et la bande passante est presque triple, mais elle oscille et se stabilise <em>plus tard</em> dans la bande des 5 % : au sens du temps de réponse, le réglage \(K = 10\) est le plus rapide. L'écart de traînage, \(a/K\), est en revanche quatre fois plus faible avec \(K = 40\). Le choix dépend de l'exigence prioritaire : temps d'établissement et dépassement (\(K = 10\)) ou poursuite d'une rampe (\(K = 40\), au prix d'une marge de phase de 39° seulement).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Imprimante 3D : erreur et retard de traînage</h3>
  <div class="statement">La tête d'une imprimante 3D est asservie en position ; la FTBO de l'axe vaut \(H_{BO}(p) = \dfrac{K}{p\,(1 + 0{,}02p)}\) (\(K\) en s⁻¹). Pendant le dépôt d'un trait, la consigne est une rampe à 50 mm/s ; le cahier des charges impose une erreur de traînage d'au plus 0,5 mm et un dépassement d'au plus 5 % lors des arrêts (échelons).</div>
  <div class="q"><strong>Q1.</strong> Quel gain minimal faut-il pour respecter l'erreur de traînage ? Que vaut alors le retard de traînage ?</div>
  <div class="q"><strong>Q2.</strong> Avec ce gain, calculer \(\xi\) de la boucle fermée et le dépassement. Le cahier des charges est-il respecté ?</div>
  <div class="q"><strong>Q3.</strong> Quel gain donne \(\xi = 0{,}7\) ? Quelle erreur de traînage obtient-on alors ? Que faudrait-il pour concilier les deux exigences ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Classe 1 : \(\varepsilon_v = a/K \leq 0{,}5\ \text{mm}\) avec \(a = 50\ \text{mm/s}\) impose \(K \geq 100\ \text{s}^{-1}\). Retard de traînage \(t_v = 1/K = 10\ \text{ms}\) : la tête passe en chaque point 10 ms après la consigne.</p>
    <p><strong>Q2.</strong> FTBF \(\dfrac{1}{1 + p/K + 0{,}02p^2/K}\) : \(\xi = \dfrac{1}{2\sqrt{0{,}02\,K}} = \dfrac{1}{2\sqrt2} \approx 0{,}35\), dépassement \(\approx 30\ \%\). L'exigence de dépassement n'est pas respectée (la marge de phase ne vaut que 39°).</p>
    <p><strong>Q3.</strong> \(\xi = 0{,}7\) demande \(0{,}02\,K = \dfrac{1}{4 \times 0{,}49}\), soit \(K \approx 25{,}5\ \text{s}^{-1}\) ; l'erreur de traînage vaut alors \(50/25{,}5 \approx 2\ \text{mm}\), quatre fois trop. Un simple gain ne concilie pas précision en poursuite et amortissement : il faut une FTBO de classe 2 stable (correcteur PI, 2ᵉ année) ou une anticipation de la consigne (hors programme).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Régulation de vitesse d'un convoyeur à bande</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>précision, rapidité et perturbations</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    La vitesse \(v\) (m/s) d'un convoyeur est asservie. La chaîne directe comprend un correcteur proportionnel \(K_p\), un ensemble amplificateur-moteur \(G_1(p) = \dfrac{1}{1 + 0{,}02p}\) (couple moteur en N·m par volt), puis la mécanique du convoyeur \(G_2(p) = \dfrac{2}{1 + 0{,}4p}\) (m/s par N·m). Les produits posés sur la bande exercent un couple résistant \(D\) qui se soustrait au couple moteur, entre \(G_1\) et \(G_2\). Le capteur et l'adaptateur ont le même gain, 1 V par m/s : on travaille en retour unitaire.<br>
    Cahier des charges, pour une consigne en échelon de 1 m/s : boucle stable avec \(M_\varphi \geq 45°\) ; écart statique au plus 5 % ; dépassement au plus 15 % ; temps de réponse à 5 % au plus 0,2 s ; une charge \(D_0 = 0{,}5\ \text{N·m}\) ne doit pas faire varier la vitesse de plus de 0,02 m/s en régime permanent.
  </div>
  <p class="exo-part">Partie A — Premier réglage</p>
  <div class="q"><strong>A1.</strong> Écrire la FTBO ; donner sa classe et son gain \(K\) en fonction de \(K_p\). Avec \(K_p = 4{,}5\), calculer l'écart statique.</div>
  <div class="q"><strong>A2.</strong> Comment annuler cet écart en agissant sur la structure de la FTBO ? Pourquoi un intégrateur placé dans le processus n'aiderait-il pas contre la charge ?</div>
  <p class="exo-part">Partie B — Stabilité et amortissement</p>
  <div class="q"><strong>B1.</strong> La boucle fermée est-elle stable pour tout \(K_p \gt 0\) ? Écrire la FTBF sous forme canonique et exprimer \(\omega_0\) et \(\xi\) en fonction de \(K\).</div>
  <p class="exo-part">Partie C — Réglage pour la précision</p>
  <div class="q"><strong>C1.</strong> Quel gain \(K_p\) minimal respecte l'écart statique ? Calculer alors \(\xi\), le dépassement, et vérifier la marge de phase (\(\omega_{c0} \approx 37{,}8\ \text{rad/s}\)) et le temps de réponse (abaque : \(t_{r5\%}\,\omega_0 \approx 5{,}3\) pour \(\xi \approx 0{,}5\)).</div>
  <p class="exo-part">Partie D — Effet de la charge</p>
  <div class="q"><strong>D1.</strong> Exprimer le transfert \(H_D(p) = V(p)/D(p)\), puis la variation permanente de vitesse due à \(D_0\) avec le réglage de C1. L'exigence est-elle respectée ?</div>
  <div class="q"><strong>D2.</strong> Quel gain faudrait-il pour la respecter ? Que deviendraient l'amortissement et la marge de phase ?</div>
  <p class="exo-part">Partie E — Conclusion</p>
  <div class="q"><strong>E1.</strong> Conclure sur la possibilité de satisfaire le cahier des charges avec un correcteur proportionnel, et proposer une structure de correction (son réglage relève de la 2ᵉ année).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(H_{BO}(p) = \dfrac{2K_p}{(1 + 0{,}02p)(1 + 0{,}4p)}\) : classe 0, \(K = 2K_p\). Avec \(K_p = 4{,}5\), \(K = 9\) et l'écart statique vaut \(\dfrac{1}{1 + 9} = 0{,}10\ \text{m/s}\), soit 10 % : trop.</p>
    <p><strong>A2.</strong> Ajouter un intégrateur dans la chaîne directe (FTBO de classe 1) annule l'écart statique vis-à-vis de la consigne. Pour la charge, seul un intégrateur <strong>en amont</strong> de son point d'entrée (dans le correcteur) la rejette ; un intégrateur dans \(G_2\), en aval, ne ferait que réduire son effet.</p>
    <p><strong>B1.</strong> Équation caractéristique \((1 + 0{,}02p)(1 + 0{,}4p) + K = 0\), soit \(0{,}008p^2 + 0{,}42p + 1 + K = 0\) : degré 2, coefficients positifs, stable pour tout \(K_p \gt 0\). \(H_{BF} = \dfrac{K}{1 + K}\cdot\dfrac{1}{1 + \frac{0{,}42}{1 + K}p + \frac{0{,}008}{1 + K}p^2}\), d'où \(\omega_0 = \sqrt{\dfrac{1 + K}{0{,}008}}\) et \(\xi = \dfrac{0{,}21}{\sqrt{0{,}008\,(1 + K)}}\).</p>
    <p><strong>C1.</strong> \(\dfrac{1}{1 + K} \leq 0{,}05\) impose \(K \geq 19\), soit \(K_p \geq 9{,}5\). Alors \(\omega_0 = \sqrt{20/0{,}008} = 50\ \text{rad/s}\) et \(\xi = 0{,}21/\sqrt{0{,}16} \approx 0{,}53\) : dépassement \(\approx 14\ \%\) (conforme). Phase en \(\omega_{c0} \approx 37{,}8\ \text{rad/s}\) : \(-\arctan 0{,}756 - \arctan 15{,}1 \approx -123°\), donc \(M_\varphi \approx 57°\) (conforme). \(t_{r5\%} \approx 5{,}3/50 \approx 0{,}11\ \text{s}\) (conforme).</p>
    <p><strong>D1.</strong> Avec \(E = 0\) : \(H_D(p) = \dfrac{-G_2}{1 + K_p\,G_1\,G_2}\), et \(H_D(0) = \dfrac{-2}{1 + 19} = -0{,}1\ \text{m/s par N·m}\). La charge fait chuter la vitesse de \(0{,}1 \times 0{,}5 = 0{,}05\ \text{m/s}\) : plus que les 0,02 m/s admis. Exigence non respectée.</p>
    <p><strong>D2.</strong> Il faudrait \(\dfrac{2 \times 0{,}5}{1 + K} \leq 0{,}02\), soit \(K \geq 49\) (\(K_p \geq 24{,}5\)). Alors \(\xi = 0{,}21/\sqrt{0{,}4} \approx 0{,}33\) : dépassement de 33 %, et \(M_\varphi \approx 37°\) : deux exigences ne sont plus respectées.</p>
    <p><strong>E1.</strong> Aucun gain proportionnel ne satisfait à la fois le rejet de la charge et l'amortissement : c'est le dilemme stabilité-précision. Il faut une action intégrale dans le correcteur, en amont de la charge : un correcteur PI rend la FTBO de classe 1, annule l'écart statique et l'effet permanent de la charge. Avec \(K_p = 9{,}5\) et une cassure \(1/T_i\) une décade sous \(\omega_{c0}\) (\(T_i \approx 0{,}26\ \text{s}\)), il ne retire qu'environ 6° de marge de phase (\(M_\varphi \approx 51°\)) : le cahier des charges devient accessible.</p>
  </div>
