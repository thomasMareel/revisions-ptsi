  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Lave-linge : configuration active et temporisations</h3>
  <div class="statement">On reprend les deux diagrammes du lave-linge du cours (§4 : état composite Cycle et état Lavage à deux régions). Remplissage par une électrovanne de 12 L/min jusqu'à 15 L ; vidange par une pompe de 20 L/min ; eau froide à 15 °C. Résistance de 2 kW : alimentée, elle réchauffe l'eau de 1,7 °C/min ; coupée, l'eau refroidit de 0,25 °C/min. Seuils \(T_1 = 37\ \text{°C}\), \(T_2 = 40\ \text{°C}\). Le client appuie sur départ à \(t = 0\), porte fermée.</div>
  <div class="q"><strong>Q1.</strong> Donner la configuration active complète à \(t = 30\ \text{s}\), \(t = 20\ \text{min}\ 10\ \text{s}\) et \(t = 45\ \text{min}\).</div>
  <div class="q"><strong>Q2.</strong> Dater les changements d'état de la région chauffage pendant Lavage. Durée d'alimentation de la résistance et énergie consommée ?</div>
  <div class="q"><strong>Q3.</strong> Une fuite est détectée pendant Lavage. Décrire ce qui se passe. Pourquoi le déverrouillage de la porte est-il un effet de la transition d'achèvement plutôt qu'une action <code>exit</code> de Cycle ?</div>
  <div class="q"><strong>Q4.</strong> Combien d'états compterait un diagramme à plat équivalent à Cycle ? Combien de flèches <code>fuite</code> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le remplissage dure \(15/12 = 1{,}25\ \text{min}\) : à 30 s, configuration (Cycle, Remplissage). Lavage commence à 1 min 15 s ; à 20 min 10 s, il est actif depuis \(1\,135\ \text{s}\). Brassage : \(1\,135 = 75\times15 + 10\), on est 10 s après le début de la 76ᵉ alternance de 15 s, donc dans Tourne (de 0 à 12 s). Chauffage : première chauffe pendant \((40 - 15)/1{,}7 = 14{,}7\ \text{min}\), puis veille pendant \(3/0{,}25 = 12\ \text{min}\), jusqu'à 26,7 min de lavage ; à 18,9 min : Veille. Configuration (Cycle, Lavage, Tourne, Veille). Lavage s'achève à 41 min 15 s, la vidange à 42 min, l'essorage à 50 min : à 45 min, (Cycle, Essorage).</p>
    <p><strong>Q2.</strong> En temps de lavage : Chauffe de 0 à 14,71 min (15 → 40 °C) ; Veille de 14,71 à 26,71 min (40 → 37 °C) ; Chauffe de 26,71 à 28,47 min (\(3/1{,}7 = 1{,}76\ \text{min}\)) ; Veille ensuite jusqu'à la fin, l'eau n'étant redescendue qu'à \(40 - 0{,}25\times11{,}53 = 37{,}1\ \text{°C}\) au bout des 40 min. Ajouter 1,25 min pour les dates comptées depuis le départ. Résistance alimentée \(14{,}71 + 1{,}76 = 16{,}47\ \text{min}\) : \(W = 2\ \text{kW}\times16{,}47/60\ \text{h} = 0{,}55\ \text{kWh}\), soit 2,0 MJ.</p>
    <p><strong>Q3.</strong> Quels que soient les sous-états actifs, <code>fuite</code> part du contour de Cycle : les activités sont interrompues (rotation et chauffe arrêtées), les régions puis Lavage puis Cycle sont quittés, et <code>entry / alarme</code> de Défaut s'exécute. La porte reste verrouillée, ce qui est voulu : le tambour contient encore de l'eau. Une action <code>exit / déverrouiller</code> de Cycle s'exécuterait à <em>toute</em> sortie de Cycle, y compris sur fuite ; placée sur la transition d'achèvement, elle n'a lieu qu'après l'essorage.</p>
    <p><strong>Q4.</strong> Lavage contient \(2\times2 = 4\) configurations ; à plat, Cycle compterait Remplissage, les 4 configurations de Lavage, Vidange et Essorage : 7 états, et 7 flèches <code>fuite</code> au lieu d'une. Pour Lavage seul, le gain des régions est nul (\(2 + 2 = 2\times2\)) ; il apparaît dès que les régions grossissent (3 et 4 sous-états : 7 dessinés au lieu de 12).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Barrière de parking : du diagramme au programme</h3>
  <div class="statement">La barrière d'entrée d'un parking de 120 places suit le diagramme : état initial Baissée ; Baissée → Montée : <code>ticket [n &lt; 120] / n ← n + 1</code> ; dans Baissée, transition interne <code>ticket [n = 120] / afficher « complet »</code> ; Montée (<code>do / monter</code>) → Levée : <code>when(fh)</code> ; Levée → Passage : <code>when(v)</code> ; Passage → Descente : <code>when(non v)</code> ; Descente (<code>do / descendre</code>) → Baissée : <code>when(fb)</code> ; Descente → Montée : <code>when(v)</code>. <code>ticket</code> est l'événement « ticket retiré » ; <em>fh</em> et <em>fb</em> sont les fins de course haute et basse ; \(v = 1\) si une boucle magnétique détecte un véhicule sous la barrière ; \(n\) est le nombre de voitures dans le parking (la barrière de sortie le diminue). Le cycle du programme dure 10 ms ; la lisse met 2,5 s à monter comme à descendre. Le programmeur a écrit :
<pre class="codeblock"><code><span class="kw">def</span> barriere(etat, n, ticket, fh, fb, v):
    <span class="kw">if</span> etat == BAISSEE:
        <span class="kw">if</span> ticket <span class="kw">and</span> n &lt; N:
            etat = MONTEE
    <span class="kw">elif</span> etat == MONTEE:
        n = n + 1
        <span class="kw">if</span> fh:
            etat = LEVEE
    <span class="kw">elif</span> etat == LEVEE:
        <span class="kw">if</span> v:
            etat = PASSAGE
    <span class="kw">elif</span> etat == PASSAGE:
        <span class="kw">if</span> <span class="kw">not</span> v:
            etat = DESCENTE
    <span class="kw">elif</span> etat == DESCENTE:
        <span class="kw">if</span> fb:
            etat = BAISSEE
    <span class="kw">return</span> etat, n</code></pre>
  </div>
  <div class="q"><strong>Q1.</strong> Pourquoi deux états Levée et Passage, au lieu d'un seul état Levée quitté par <code>when(non v)</code> ?</div>
  <div class="q"><strong>Q2.</strong> Trouver les deux écarts entre le programme et le diagramme. Avec \(n = 10\) avant l'arrivée d'une voiture, quelle valeur le programme donne-t-il après son passage ? Quel danger présente l'autre écart ?</div>
  <div class="q"><strong>Q3.</strong> Écrire le programme corrigé.</div>
  <div class="q"><strong>Q4.</strong> Que se passe-t-il quand \(n = 120\) ? Le compteur peut-il s'écarter du nombre réel de voitures ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Quand la lisse arrive en haut, la voiture n'est pas encore sous la barrière : \(v = 0\). Lu comme une condition surveillée, un unique <code>when(non v)</code> ferait redescendre la lisse aussitôt, devant la voiture. Les deux états rendent la séquence explicite, quelle que soit la lecture de <code>when</code> : attendre l'arrivée de la voiture (Levée), puis son départ (Passage).</p>
    <p><strong>Q2.</strong> Premier écart : l'incrément est écrit dans le corps de la branche Montée, parcouru à chaque cycle pendant les 2,5 s de montée, soit 250 fois : \(n = 260\) après une voiture au lieu de 11. Le parking paraît plein dès la première voiture et refuse tout le monde. L'incrément est l'effet de la transition Baissée → Montée : une fois par ticket. Second écart : la transition de sécurité Descente → Montée : <code>when(v)</code> manque. Une voiture qui s'arrête sous la barrière pendant la descente reçoit la lisse sur le capot. (Le message « complet » manque aussi.)</p>
    <p><strong>Q3.</strong> Le test de sécurité est placé en tête de la branche Descente.</p>
<pre class="codeblock"><code><span class="kw">def</span> barriere(etat, n, ticket, fh, fb, v):
    <span class="kw">if</span> etat == BAISSEE:
        <span class="kw">if</span> ticket <span class="kw">and</span> n &lt; N:
            n = n + 1               <span class="cmt"># effet : une fois par ticket</span>
            etat = MONTEE
        <span class="kw">elif</span> ticket:
            afficher(<span class="str">"complet"</span>)     <span class="cmt"># transition interne</span>
    <span class="kw">elif</span> etat == MONTEE:
        <span class="kw">if</span> fh:
            etat = LEVEE
    <span class="kw">elif</span> etat == LEVEE:
        <span class="kw">if</span> v:
            etat = PASSAGE
    <span class="kw">elif</span> etat == PASSAGE:
        <span class="kw">if</span> <span class="kw">not</span> v:
            etat = DESCENTE
    <span class="kw">elif</span> etat == DESCENTE:
        <span class="kw">if</span> v:                       <span class="cmt"># véhicule sous la barrière</span>
            etat = MONTEE
        <span class="kw">elif</span> fb:
            etat = BAISSEE
    <span class="kw">return</span> etat, n</code></pre>
    <p>Une simulation (montée et descente de 2,5 s, voiture sous la barrière de 4 à 6 s) donne bien \(n = 11\) et le retour en Baissée à 8,5 s.</p>
    <p><strong>Q4.</strong> Avec \(n = 120\), la garde \(n \lt 120\) est fausse : le ticket ne déclenche que le message « complet » et la barrière reste baissée. Le compteur dérive si une voiture entre sans ticket (en suivant la précédente de près) ou sort sans être comptée : il ne mesure pas, il suppose. Compter les passages réels (sortie de l'état Passage) et recaler régulièrement le compteur (comptage de nuit, capteurs de places) le rend fiable.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Portail : ajouter un arrêt intermédiaire</h3>
  <div class="statement">On part du portail du cours (diagramme du §5, programme du §6). Le client demande : (E1) un appui sur la télécommande pendant l'ouverture ou la fermeture arrête le portail (nouvel état Arrêt) ; (E2) depuis Arrêt, un appui referme le portail, et il n'y a pas de refermeture automatique ; (E3) un feu orange F est allumé pendant tout mouvement ; (E4) l'obstacle reste prioritaire sur tout.</div>
  <div class="q"><strong>Q1.</strong> Compléter le diagramme : nouvelles transitions et leurs libellés.</div>
  <div class="q"><strong>Q2.</strong> Dans Fermeture, <code>tel</code> et <code>obs</code> peuvent survenir au même cycle. Laquelle des deux transitions doit l'emporter ? Comment le garantir dans le diagramme et dans le programme ?</div>
  <div class="q"><strong>Q3.</strong> Modifier les fonctions <code>evolution</code> et <code>sorties</code>.</div>
  <div class="q"><strong>Q4.</strong> Écrire un scénario de test qui vérifie E1, E2 et E4.</div>
  <div class="q"><strong>Q5.</strong> La propriété « MO et MF jamais à 1 ensemble » est-elle conservée ? Le portail peut-il désormais rester ouvert indéfiniment ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Nouvel état Arrêt, sans activité. Transitions : Ouverture → Arrêt : <code>tel</code> ; Fermeture → Arrêt : <code>tel</code> ; Arrêt → Fermeture : <code>tel</code>. Arrêt n'a pas de <code>after</code> (E2).</p>
    <p><strong>Q2.</strong> L'obstacle (E4, sécurité). Dans le diagramme, la garde <code>tel [non obs]</code> sur Fermeture → Arrêt rend le comportement déterministe ; dans le programme, <code>obs</code> est testé en premier dans la branche Fermeture.</p>
    <p><strong>Q3.</strong> Une constante d'état de plus, trois branches modifiées ou ajoutées (le reste de la fonction est inchangé) :</p>
<pre class="codeblock"><code>FERME, OUVERTURE = <span class="str">'Fermé'</span>, <span class="str">'Ouverture'</span>
OUVERT, FERMETURE, ARRET = <span class="str">'Ouvert'</span>, <span class="str">'Fermeture'</span>, <span class="str">'Arrêt'</span>

    <span class="kw">elif</span> etat == OUVERTURE:
        <span class="kw">if</span> fo:
            suivant = OUVERT
        <span class="kw">elif</span> tel:
            suivant = ARRET
    <span class="kw">elif</span> etat == OUVERT:
        <span class="kw">if</span> tel <span class="kw">or</span> t - t_entree &gt;= TEMPO:
            suivant = FERMETURE
    <span class="kw">elif</span> etat == FERMETURE:
        <span class="kw">if</span> obs:                 <span class="cmt"># sécurité : toujours en premier</span>
            suivant = OUVERTURE
        <span class="kw">elif</span> ff:
            suivant = FERME
        <span class="kw">elif</span> tel:
            suivant = ARRET
    <span class="kw">elif</span> etat == ARRET:
        <span class="kw">if</span> tel:
            suivant = FERMETURE</code></pre>
<pre class="codeblock"><code><span class="kw">def</span> sorties(etat):
    MO = etat == OUVERTURE
    MF = etat == FERMETURE
    <span class="kw">return</span> MO, MF, MO <span class="kw">or</span> MF     <span class="cmt"># feu : allumé pendant tout mouvement</span></code></pre>
    <p><strong>Q4.</strong> Les dates sont arbitraires ; chaque appel représente un cycle.</p>
<pre class="codeblock"><code>e, te = FERME, 0.0
e, te = evolution(e, te, 1.0, <span class="kw">True</span>, <span class="kw">False</span>, <span class="kw">True</span>, <span class="kw">False</span>)
<span class="kw">assert</span> e == OUVERTURE
e, te = evolution(e, te, 5.0, <span class="kw">True</span>, <span class="kw">False</span>, <span class="kw">False</span>, <span class="kw">False</span>)
<span class="kw">assert</span> e == ARRET
e, te = evolution(e, te, 60.0, <span class="kw">False</span>, <span class="kw">False</span>, <span class="kw">False</span>, <span class="kw">False</span>)
<span class="kw">assert</span> e == ARRET             <span class="cmt"># pas de refermeture automatique</span>
e, te = evolution(e, te, 61.0, <span class="kw">True</span>, <span class="kw">False</span>, <span class="kw">False</span>, <span class="kw">False</span>)
<span class="kw">assert</span> e == FERMETURE
e, te = evolution(e, te, 62.0, <span class="kw">True</span>, <span class="kw">False</span>, <span class="kw">False</span>, <span class="kw">True</span>)
<span class="kw">assert</span> e == OUVERTURE         <span class="cmt"># appui et obstacle : l'obstacle gagne</span></code></pre>
    <p><strong>Q5.</strong> MO et MF restent attachés à deux états distincts : la propriété est conservée. En revanche, le portail peut rester indéfiniment dans Arrêt, éventuellement à moitié ouvert : c'est la conséquence de E2. Si le client veut que le portail finisse toujours fermé, il faut une transition Arrêt → Fermeture : <code>after(60 s)</code>, à discuter avec lui.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Concours PT — Automatisation d'une écluse</h3>
  <div class="statement">Une écluse de canal fait franchir aux bateaux une chute \(H = 3{,}2\ \text{m}\). Le sas, de 40 m sur 6 m, est fermé par une porte amont et une porte aval ; une vanne amont VA le remplit depuis le bief amont, une vanne aval VV le vide vers le bief aval. Capteurs : fins de course des portes (<em>pao</em>, <em>paf</em> : porte amont ouverte, fermée ; <em>pvo</em>, <em>pvf</em> : porte aval ouverte, fermée), niveaux (<em>na</em> : sas au niveau amont à 2 cm près ; <em>nv</em> : sas au niveau aval), cellule <em>c</em> de l'embrasure de la porte aval (1 si un bateau y est engagé), bouton <code>prêt</code> de l'éclusier. Chaque porte met 1 min à s'ouvrir ou à se fermer. Le comportement est décrit par le diagramme d'états suivant (état initial E1) :
    <table>
      <tr><th>État</th><th>Comportement</th><th>Transitions sortantes</th></tr>
      <tr><td>E1 Aval ouvert</td><td>—</td><td><code>prêt [non c]</code> → E2</td></tr>
      <tr><td>E2 Fermeture aval</td><td><code>do / fermer porte aval</code></td><td><code>when(pvf)</code> → E3 ; <code>when(c)</code> → E8</td></tr>
      <tr><td>E3 Remplissage</td><td><code>entry / ouvrir VA</code> ; <code>exit / fermer VA</code></td><td><code>when(na)</code> → E4 ; <code>after(8 min)</code> → Défaut</td></tr>
      <tr><td>E4 Ouverture amont</td><td><code>do / ouvrir porte amont</code></td><td><code>when(pao)</code> → E5</td></tr>
      <tr><td>E5 Amont ouvert</td><td>—</td><td><code>prêt</code> → E6</td></tr>
      <tr><td>E6 Fermeture amont</td><td><code>do / fermer porte amont</code></td><td><code>when(paf)</code> → E7</td></tr>
      <tr><td>E7 Vidange</td><td><code>entry / ouvrir VV</code> ; <code>exit / fermer VV</code></td><td><code>when(nv)</code> → E8 ; <code>after(8 min)</code> → Défaut</td></tr>
      <tr><td>E8 Ouverture aval</td><td><code>do / ouvrir porte aval</code></td><td><code>when(pvo)</code> → E1</td></tr>
      <tr><td>Défaut</td><td><code>entry / alarme</code></td><td>(réarmement manuel)</td></tr>
    </table>
  </div>
  <div class="exo-part">Partie A — Lecture du diagramme</div>
  <div class="q"><strong>Q1.</strong> Décrire le passage d'un bateau qui monte, de E1 à E5 : états successifs, actionneurs commandés, événement attendu dans chaque état.</div>
  <div class="q"><strong>Q2.</strong> Montrer sur le diagramme que : (S1) les deux portes ne sont jamais ouvertes ou en mouvement en même temps ; (S2) une porte ne s'ouvre qu'à niveaux égaux de part et d'autre ; (S3) les deux vannes ne sont jamais ouvertes ensemble.</div>
  <div class="exo-part">Partie B — Durées</div>
  <div class="q"><strong>Q3.</strong> Le débit de la vanne amont vaut \(Q = C_d\,s\,\sqrt{2gh}\), où \(h\) est la différence de niveau entre le bief amont et le sas, \(s = 1{,}5\ \text{m}^2\) et \(C_d = 0{,}6\). Établir l'équation différentielle vérifiée par \(h(t)\) pendant le remplissage et en déduire sa durée \(T_r = \dfrac{2A\sqrt{H}}{C_d\,s\,\sqrt{2g}}\), où \(A\) est la surface du sas. Application numérique ; débits initial et moyen.</div>
  <div class="q"><strong>Q4.</strong> Durée de E1 (appui sur <code>prêt</code>) à E5. Justifier la valeur de 8 min choisie pour détecter un défaut, et dire ce qui se passerait sans cette transition.</div>
  <div class="exo-part">Partie C — Programme</div>
  <div class="q"><strong>Q5.</strong> Le programme suit la structure du cours : variable <code>etat</code>, date <code>t_entree</code> mise à jour à la fin de la fonction d'évolution à chaque changement d'état, fonctions fournies <code>ouvrir_vanne(nom)</code>, <code>fermer_vanne(nom)</code> et <code>alarme()</code>. Écrire les branches E2 et E3, avec les actions <code>entry</code> et <code>exit</code> à leur place.</div>
  <div class="q"><strong>Q6.</strong> Pour simplifier, un programmeur remplace <code>when(na)</code> par <code>after(4 min)</code>, « puisque le remplissage dure 3,6 min ». Un jour, des branchages obstruent à moitié la vanne amont (\(C_d\,s\) divisé par deux). Que se passe-t-il ? Quelle exigence est violée ?</div>
  <div class="exo-part">Partie D — Évolution</div>
  <div class="q"><strong>Q7.</strong> Un bateau qui veut descendre le signale à tout moment par un bouton <code>dm</code> placé à l'amont. Aucun état du diagramme ne traite cet événement : que devient-il ? Proposer une modification du diagramme et du programme pour que la demande soit mémorisée, et que l'écluse monte à vide chercher le bateau quand elle est en E1 sans bateau à faire monter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> E1 : le bateau entre dans le sas par l'aval ; l'éclusier appuie sur <code>prêt</code> quand il est amarré, embrasure libre. E2 : fermeture de la porte aval (1 min), jusqu'à <em>pvf</em> ; si un bateau s'engage dans l'embrasure, E8 rouvre la porte. E3 : VA ouverte, le sas se remplit jusqu'à <em>na</em>, puis VA se ferme (action <code>exit</code>). E4 : ouverture de la porte amont (1 min), jusqu'à <em>pao</em>. E5 : le bateau sort vers l'amont.</p>
    <p><strong>Q2.</strong> (S1) La porte amont ne bouge qu'en E4 et E6 et n'est ouverte qu'en E5 ; elle est fermée de <em>paf</em> (sortie de E6) jusqu'à l'entrée en E4, donc dans E7, E8, E1, E2, E3. La porte aval ne bouge qu'en E2 et E8 et n'est ouverte qu'en E1 ; elle est fermée de <em>pvf</em> (sortie de E2 vers E3) jusqu'à E8, donc dans E3 à E7. Les deux ensembles d'états sont disjoints. (S2) On n'entre dans E4 que par <code>when(na)</code> : niveaux amont et sas égaux. On entre dans E8 par <code>when(nv)</code> depuis E7, ou depuis E2, où le sas est encore au niveau aval (VA n'a pas été ouverte). (S3) VA n'est ouverte que dans E3 et VV que dans E7, deux états distincts ; les actions <code>exit</code> les ferment quelle que soit la sortie, Défaut compris.</p>
    <p><strong>Q3.</strong> Le bief amont est assez grand pour garder son niveau ; le niveau \(z\) du sas monte de \(\mathrm{d}z = Q\,\mathrm{d}t/A\) et \(h = H - z\), d'où</p>
    <div class="formula">$$A\,\frac{\mathrm{d}h}{\mathrm{d}t} = -C_d\,s\,\sqrt{2gh}\quad\Longrightarrow\quad \frac{\mathrm{d}h}{\sqrt h} = -\frac{C_d\,s\,\sqrt{2g}}{A}\,\mathrm{d}t\quad\Longrightarrow\quad 2\left(\sqrt H - \sqrt{h}\right) = \frac{C_d\,s\,\sqrt{2g}}{A}\,t$$</div>
    <p>\(h\) s'annule pour \(t = T_r\). Avec \(A = 240\ \text{m}^2\) et \(C_d\,s\,\sqrt{2g} = 0{,}9\times4{,}43 = 3{,}99\ \text{m}^{5/2}\text{·s}^{-1}\) :</p>
    <div class="formula">$$T_r = \frac{2\times240\times1{,}789}{3{,}99} = 215\ \text{s} \approx 3{,}6\ \text{min}.$$</div>
    <p>Volume \(240\times3{,}2 = 768\ \text{m}^3\) ; débit initial \(0{,}9\times\sqrt{2\times9{,}81\times3{,}2} = 7{,}1\ \text{m}^3/\text{s}\), débit moyen \(768/215 = 3{,}6\ \text{m}^3/\text{s}\), moitié du débit initial puisque \(\sqrt h\) décroît linéairement. Le capteur <em>na</em> réagit à 2 cm : 198 s suffisent, les 2 derniers centimètres demandant à eux seuls 17 s.</p>
    <p><strong>Q4.</strong> \(1 + 3{,}6 + 1 \approx 5{,}6\ \text{min}\) (un peu moins, environ 5,3 min, en comptant la tolérance de <em>na</em>). La durée de 8 min vaut plus de deux fois la durée normale : elle tolère les variations (niveau du bief, vanne encrassée) mais signale une vanne bloquée ou un capteur en panne. Sans elle, E3 deviendrait un puits : l'écluse attendrait <em>na</em> indéfiniment, sans alerter personne.</p>
    <p><strong>Q5.</strong> L'action <code>exit</code> de E3 apparaît dans les deux transitions sortantes : elle s'exécute quelle que soit la sortie. La date d'entrée est mise à jour à la fin de la fonction, comme dans le cours.</p>
<pre class="codeblock"><code><span class="kw">elif</span> etat == E2:
    <span class="kw">if</span> c:
        etat = E8
    <span class="kw">elif</span> pvf:
        ouvrir_vanne(<span class="str">'VA'</span>)          <span class="cmt"># entry de E3</span>
        etat = E3
<span class="kw">elif</span> etat == E3:
    <span class="kw">if</span> na:
        fermer_vanne(<span class="str">'VA'</span>)          <span class="cmt"># exit de E3</span>
        etat = E4
    <span class="kw">elif</span> t - t_entree &gt;= 8*60:      <span class="cmt"># after(8 min)</span>
        fermer_vanne(<span class="str">'VA'</span>)          <span class="cmt"># exit de E3</span>
        alarme()                    <span class="cmt"># entry de Défaut</span>
        etat = DEFAUT</code></pre>
    <p><strong>Q6.</strong> \(T_r\) double : 431 s, soit 7,2 min. Au bout de 4 min, \(\sqrt h = 1{,}789 - \dfrac{0{,}45\times4{,}43\times240}{2\times240} = 0{,}79\), soit \(h = 0{,}63\ \text{m}\). Le programme commande l'ouverture de la porte amont avec 63 cm d'écart de niveau : l'exigence S2 est violée. La porte, plaquée par la poussée de l'eau, ne s'ouvre pas, ou s'ouvre brutalement en lançant une vague dans le sas ; et le défaut n'est plus détecté. Une durée est une hypothèse sur la partie opérative, un niveau est une mesure : la transition doit porter sur la mesure, la durée ne servant que de surveillance.</p>
    <p><strong>Q7.</strong> L'événement <code>dm</code> est perdu : la demande est oubliée. Diagramme : englober E1 à E8 dans un état composite Éclusage muni d'une transition interne <code>dm / demande ← vrai</code>, valable quel que soit le sous-état ; ajouter <code>entry / demande ← faux</code> à E5, où la demande est servie, et une seconde transition E1 → E2 de garde <code>[demande]</code>, surveillée pendant tout le séjour dans E1 (avec <code>when(demande)</code> lu selon la norme, une demande arrivée avant l'entrée en E1 ne serait jamais servie). Programme : le drapeau est mis à jour avant les branches, donc dans tout état.</p>
<pre class="codeblock"><code><span class="kw">if</span> dm:                              <span class="cmt"># avant les branches : quel</span>
    demande_amont = <span class="kw">True</span>            <span class="cmt"># que soit l'état actif</span>
<span class="kw">if</span> etat == E1:
    <span class="kw">if</span> (pret <span class="kw">and</span> <span class="kw">not</span> c) <span class="kw">or</span> demande_amont:
        etat = E2
...
<span class="kw">elif</span> etat == E4:
    <span class="kw">if</span> pao:
        demande_amont = <span class="kw">False</span>       <span class="cmt"># entry de E5 : demande servie</span>
        etat = E5</code></pre>
  </div>
</div>
