<div class="exo-wrapper">

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Une base de solutions sur ℝ</h3>
  <div class="statement">On considère sur \(\mathbb{R}\) l'équation \((H) : (1 + t^2)\,y'' - 2t\,y' + 2y = 0\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que l'ensemble des solutions de \((H)\) sur \(\mathbb{R}\) est un espace vectoriel de dimension 2.</div>
  <div class="q"><strong>Q2.</strong> Vérifier que \(y_1(t) = t\) et \(y_2(t) = t^2 - 1\) sont solutions, puis qu'elles forment une base de cet espace.</div>
  <div class="q"><strong>Q3.</strong> Contrôler le wronskien obtenu à l'aide de la relation \(W' = -a\,W\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer la solution telle que \(y(0) = 1\) et \(y'(0) = 3\).</div>
  <div class="q"><strong>Q5.</strong> Résoudre sur \(\mathbb{R}\) l'équation \((1 + t^2)\,y'' - 2t\,y' + 2y = 4\).</div>
  <div class="q"><strong>Q6.</strong> Par la même méthode, vérifier que \(y_1 = \cos\) et \(y_2 = \sin\) forment une base des solutions de \(y'' + y = 0\) sur \(\mathbb{R}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le coefficient \(1 + t^2\) ne s'annule pas sur \(\mathbb{R}\) : en divisant, \((H)\) s'écrit \(y'' + a(t)\,y' + b(t)\,y = 0\) avec \(a(t) = -\dfrac{2t}{1 + t^2}\) et \(b(t) = \dfrac{2}{1 + t^2}\), continues sur l'intervalle \(\mathbb{R}\). D'après le théorème de structure (conséquence du théorème de Cauchy), les solutions forment un plan vectoriel.</p>
    <p><strong>Q2.</strong> Pour \(y_1 = t\) : \(y_1'' = 0\) et \(-2t \times 1 + 2t = 0\). Pour \(y_2 = t^2 - 1\) :</p>
    <div class="formula">$$(1 + t^2) \times 2 - 2t \times 2t + 2(t^2 - 1) = 2 + 2t^2 - 4t^2 + 2t^2 - 2 = 0.$$</div>
    <p>Le wronskien vaut</p>
    <div class="formula">$$W(t) = y_1 y_2' - y_1' y_2 = t \times 2t - 1 \times (t^2 - 1) = t^2 + 1,$$</div>
    <p>qui ne s'annule pas : \(y_1\) et \(y_2\) ne sont pas proportionnelles, et deux solutions indépendantes d'un plan en forment une base.</p>
    <p><strong>Q3.</strong> \(-a\,W = \dfrac{2t}{1 + t^2}\,(1 + t^2) = 2t\), qui est bien la dérivée de \(t^2 + 1\).</p>
    <p><strong>Q4.</strong> On cherche \(y = \lambda t + \mu(t^2 - 1)\) : \(y(0) = -\mu = 1\) et \(y'(0) = \lambda = 3\). D'où \(y(t) = 1 + 3t - t^2\), unique d'après le théorème de Cauchy.</p>
    <p><strong>Q5.</strong> Une constante \(y = k\) donne \(2k = 4\) : \(y_p = 2\) est solution. Les solutions sont les \(2 + \lambda t + \mu(t^2 - 1)\), \((\lambda, \mu) \in \mathbb{R}^2\).</p>
    <p><strong>Q6.</strong> Les deux fonctions sont solutions, et \(W = y_1 y_2' - y_1' y_2 = \cos^2 t + \sin^2 t = 1 \neq 0\) : elles ne sont pas proportionnelles, donc forment une base de l'espace des solutions, de dimension 2.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Abaissement de l'ordre</h3>
  <div class="statement">On considère sur \(I = \,]0, +\infty[\) l'équation \((H) : t^2 y'' - 2t\,y' + 2y = 0\) et l'équation complète \((E) : t^2 y'' - 2t\,y' + 2y = t^3\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(y_1(t) = t\) est solution de \((H)\) et qu'elle ne s'annule pas sur \(I\).</div>
  <div class="q"><strong>Q2.</strong> En posant \(y = t\,z\), résoudre \((H)\) sur \(I\).</div>
  <div class="q"><strong>Q3.</strong> Avec le même changement d'inconnue, résoudre \((E)\) sur \(I\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer la solution de \((E)\) telle que \(y(1) = 1\) et \(y'(1) = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(y_1' = 1\), \(y_1'' = 0\) : \(0 - 2t + 2t = 0\). Et \(t \gt 0\) sur \(I\).</p>
    <p><strong>Q2.</strong> Comme \(t\) ne s'annule pas, toute fonction deux fois dérivable s'écrit \(y = t\,z\) avec \(z\) deux fois dérivable. Alors \(y' = z + t\,z'\), \(y'' = 2z' + t\,z''\), et</p>
    <div class="formula">$$t^2(2z' + t\,z'') - 2t(z + t\,z') + 2t\,z = t^3 z''.$$</div>
    <p>Le terme en \(z\) a disparu, comme prévu. \((H)\) équivaut à \(z'' = 0\), soit \(z = \alpha t + \beta\) : les solutions sont les \(\alpha t^2 + \beta t\), de base \((t, t^2)\).</p>
    <p><strong>Q3.</strong> Le même calcul donne \(t^3 z'' = t^3\), soit \(z'' = 1\) sur \(I\) : \(z = \frac{t^2}{2} + \alpha t + \beta\). Les solutions de \((E)\) sont</p>
    <div class="formula">$$y(t) = \frac{t^3}{2} + \alpha t^2 + \beta t,\qquad (\alpha, \beta) \in \mathbb{R}^2.$$</div>
    <p>Contrôle pour \(y_p = \frac{t^3}{2}\) : \(t^2 \times 3t - 2t \times \frac{3t^2}{2} + t^3 = t^3\).</p>
    <p><strong>Q4.</strong> \(y(1) = \frac12 + \alpha + \beta = 1\) et \(y'(1) = \frac32 + 2\alpha + \beta = 0\). Par différence, \(1 + \alpha = -1\) : \(\alpha = -2\), puis \(\beta = \frac52\). La solution est \(y(t) = \frac{t^3}{2} - 2t^2 + \frac{5t}{2}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Ce que dit l'unicité</h3>
  <div class="statement">On considère sur \(\mathbb{R}\) l'équation \((H) : y'' + (1 + \cos^2 t)\,y = 0\), dont on ne cherchera pas à exprimer les solutions. On note \(\varphi\) la solution telle que \(\varphi(0) = 1\), \(\varphi'(0) = 0\), et \(\psi\) celle telle que \(\psi(0) = 0\), \(\psi'(0) = 1\).</div>
  <div class="q"><strong>Q1.</strong> Justifier l'existence et l'unicité de \(\varphi\) et \(\psi\) sur \(\mathbb{R}\). Montrer que toute solution \(y\) s'écrit \(y = y(0)\,\varphi + y'(0)\,\psi\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\varphi\) est paire et que \(\psi\) est impaire.</div>
  <div class="q"><strong>Q3.</strong> Montrer que le wronskien \(W = \varphi\,\psi' - \varphi'\,\psi\) est constant, égal à 1. En déduire que \(\varphi\) et \(\psi\) n'ont aucun zéro commun.</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(u : t \mapsto \varphi(t + \pi)\) est solution de \((H)\), puis que \(u = \varphi(\pi)\,\varphi + \varphi'(\pi)\,\psi\).</div>
  <div class="q"><strong>Q5.</strong> En déduire que si \(\varphi(\pi) = 1\) et \(\varphi'(\pi) = 0\), alors \(\varphi\) est \(\pi\)-périodique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'équation est résolue, à coefficients \(a = 0\) et \(b(t) = 1 + \cos^2 t\) continus sur \(\mathbb{R}\) : le théorème de Cauchy linéaire donne l'existence et l'unicité de \(\varphi\) et de \(\psi\), définies sur \(\mathbb{R}\) tout entier. Si \(y\) est solution, \(z = y(0)\,\varphi + y'(0)\,\psi\) est solution (linéarité) et vérifie \(z(0) = y(0)\), \(z'(0) = y'(0)\) : par unicité, \(z = y\). Ainsi \((\varphi, \psi)\) engendre l'espace des solutions, de dimension 2 : c'est une base.</p>
    <p><strong>Q2.</strong> Soit \(z(t) = \varphi(-t)\). Alors</p>
    <div class="formula">$$z''(t) = \varphi''(-t) = -\big(1 + \cos^2(-t)\big)\varphi(-t) = -(1 + \cos^2 t)\,z(t) :$$</div>
    <p>\(z\) est solution, car le coefficient est pair. De plus \(z(0) = 1\) et \(z'(0) = -\varphi'(0) = 0\) : par unicité, \(z = \varphi\), donc \(\varphi\) est paire. De même \(v(t) = -\psi(-t)\) est solution, avec \(v(0) = 0\) et \(v'(0) = \psi'(0) = 1\) : \(v = \psi\), donc \(\psi\) est impaire.</p>
    <p><strong>Q3.</strong> Avec \(b(t) = 1 + \cos^2 t\) :</p>
    <div class="formula">$$W' = \varphi\,\psi'' - \varphi''\,\psi = \varphi\,(-b\,\psi) - (-b\,\varphi)\,\psi = 0$$</div>
    <p>(c'est \(W' = -a\,W\) avec \(a = 0\)). Donc \(W\) est constant, égal à \(W(0) = 1 \times 1 - 0 \times 0 = 1\). En un zéro commun \(t_0\), on aurait \(W(t_0) = 0\) : impossible.</p>
    <p><strong>Q4.</strong> Comme \(\cos^2\) est \(\pi\)-périodique :</p>
    <div class="formula">$$u''(t) = \varphi''(t + \pi) = -\big(1 + \cos^2(t + \pi)\big)\varphi(t + \pi) = -(1 + \cos^2 t)\,u(t).$$</div>
    <p>Ainsi \(u\) est solution. D'après Q1 appliquée à \(u\), avec \(u(0) = \varphi(\pi)\) et \(u'(0) = \varphi'(\pi)\) : \(u = \varphi(\pi)\,\varphi + \varphi'(\pi)\,\psi\).</p>
    <p><strong>Q5.</strong> Sous ces hypothèses, \(u = \varphi\), c'est-à-dire \(\varphi(t + \pi) = \varphi(t)\) pour tout \(t\). Deux conditions en un seul point (\(t = \pi\)) suffisent : c'est toute la force du théorème de Cauchy.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Deux solutions évidentes, puis tout le reste</h3>
  <div class="statement">On considère sur \(I = \,]-1, +\infty[\) l'équation \((E) : (t + 1)\,y'' - (t + 2)\,y' + y = (t + 1)^2\,\mathrm{e}^t\), et \((H)\) l'équation homogène associée.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(t \mapsto \mathrm{e}^t\) est solution de \((H)\). Trouver une solution de \((H)\) polynomiale de degré 1.</div>
  <div class="q"><strong>Q2.</strong> En déduire une base de l'espace des solutions de \((H)\) sur \(I\).</div>
  <div class="q"><strong>Q3.</strong> On pose \(y = z\,\mathrm{e}^t\). Montrer que \(y\) est solution de \((E)\) si et seulement si \((t + 1)\,z'' + t\,z' = (t + 1)^2\).</div>
  <div class="q"><strong>Q4.</strong> Résoudre cette équation d'ordre 1 en \(w = z'\), puis donner toutes les solutions de \((E)\) sur \(I\).</div>
  <div class="q"><strong>Q5.</strong> Déterminer la solution de \((E)\) telle que \(y(0) = y'(0) = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(y = \mathrm{e}^t\), \(y = y' = y''\) et la somme des coefficients vaut \((t + 1) - (t + 2) + 1 = 0\). Pour \(y = at + b\) : \(-(t + 2)\,a + at + b = b - 2a\), nul pour \(b = 2a\). Donc \(t \mapsto t + 2\) est solution.</p>
    <p><strong>Q2.</strong> Sur \(I\), \(t + 1 \neq 0\) : l'équation se met sous forme résolue à coefficients continus, et l'espace des solutions de \((H)\) est un plan. Le wronskien de \((\mathrm{e}^t, t + 2)\) vaut \(\mathrm{e}^t \times 1 - \mathrm{e}^t\,(t + 2) = -(t + 1)\,\mathrm{e}^t \neq 0\) sur \(I\) : c'est une base.</p>
    <p><strong>Q3.</strong> \(\mathrm{e}^t\) ne s'annule pas, donc toute fonction s'écrit \(z\,\mathrm{e}^t\). Avec \(y' = (z' + z)\,\mathrm{e}^t\) et \(y'' = (z'' + 2z' + z)\,\mathrm{e}^t\) :</p>
    <div class="formula">$$\begin{aligned} (t + 1)\,y'' - (t + 2)\,y' + y &= \mathrm{e}^t\big[(t + 1)\,z'' + (2t + 2 - t - 2)\,z'\big] \\ &\quad + \mathrm{e}^t\,(t + 1 - t - 2 + 1)\,z \\ &= \mathrm{e}^t\big[(t + 1)\,z'' + t\,z'\big]. \end{aligned}$$</div>
    <p>En simplifiant par \(\mathrm{e}^t \neq 0\), on obtient l'équivalence annoncée.</p>
    <p><strong>Q4.</strong> Sur \(I\), \(w' + \dfrac{t}{t + 1}\,w = t + 1\). Comme \(\dfrac{t}{t + 1} = 1 - \dfrac{1}{t + 1}\) a pour primitive \(t - \ln(t + 1)\), les solutions homogènes sont les \(K\,(t + 1)\,\mathrm{e}^{-t}\). La fonction \(w = t + 1\) est solution évidente : \(1 + t = t + 1\). Donc \(w = t + 1 + K(t + 1)\,\mathrm{e}^{-t}\). Une primitive de \((t + 1)\,\mathrm{e}^{-t}\) est \(-(t + 2)\,\mathrm{e}^{-t}\), d'où \(z = \frac{t^2}{2} + t - K(t + 2)\,\mathrm{e}^{-t} + \mu\) et, avec \(\lambda = -K\) :</p>
    <div class="formula">$$y(t) = \Big(\frac{t^2}{2} + t\Big)\mathrm{e}^t + \lambda\,(t + 2) + \mu\,\mathrm{e}^t,\qquad (\lambda, \mu) \in \mathbb{R}^2.$$</div>
    <p>On retrouve la base de Q2, à laquelle s'ajoute la solution particulière \(\big(\frac{t^2}{2} + t\big)\mathrm{e}^t\).</p>
    <p><strong>Q5.</strong> La solution particulière vaut 0 en 0 et sa dérivée \(\big(\frac{t^2}{2} + 2t + 1\big)\mathrm{e}^t\) vaut 1. Donc \(y(0) = 2\lambda + \mu = 0\) et \(y'(0) = 1 + \lambda + \mu = 0\), soit \(\lambda = 1\), \(\mu = -2\) :</p>
    <div class="formula">$$y(t) = \Big(\frac{t^2}{2} + t - 2\Big)\mathrm{e}^t + t + 2.$$</div>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une série entière qui se reconnaît</h3>
  <div class="statement">On considère sur \(\mathbb{R}\) l'équation \((H) : (1 + t^2)\,y'' + t\,y' - y = 0\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(t \mapsto t\) est solution de \((H)\).</div>
  <div class="q"><strong>Q2.</strong> Soit \(y(t) = \sum_{n \geq 0} a_n t^n\) une série entière de rayon \(R \gt 0\), solution de \((H)\) sur \(]-R, R[\). Montrer que \((n + 2)\,a_{n+2} = -(n - 1)\,a_n\) pour tout \(n \geq 0\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que la partie impaire de \(y\) est \(a_1 t\). Pour \(a_0 = 1\), calculer \(a_2\), \(a_4\), \(a_6\) et le rayon de la série paire obtenue.</div>
  <div class="q"><strong>Q4.</strong> On rappelle que \(\sqrt{1 + u} = \sum_{k \geq 0} b_k u^k\) pour \(|u| \lt 1\), avec \(b_0 = 1\) et \(\dfrac{b_{k+1}}{b_k} = \dfrac{\frac12 - k}{k + 1}\). Reconnaître la série paire de Q3.</div>
  <div class="q"><strong>Q5.</strong> Vérifier directement que \(t \mapsto \sqrt{1 + t^2}\) est solution sur \(\mathbb{R}\), puis donner toutes les solutions de \((H)\) sur \(\mathbb{R}\). Commenter le rayon trouvé.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(y'' = 0\) et \(t \times 1 - t = 0\).</p>
    <p><strong>Q2.</strong> Sur \(]-R, R[\), on dérive terme à terme. Les contributions au coefficient de \(t^n\) sont : \((n + 2)(n + 1)\,a_{n+2}\) pour \(y''\) ; \(n(n - 1)\,a_n\) pour \(t^2 y''\) ; \(n\,a_n\) pour \(t\,y'\) ; \(-a_n\) pour \(-y\). Par unicité des coefficients :</p>
    <div class="formula">$$(n + 2)(n + 1)\,a_{n+2} + (n^2 - 1)\,a_n = 0.$$</div>
    <p>Comme \(n^2 - 1 = (n - 1)(n + 1)\) et \(n + 1 \neq 0\), on obtient \((n + 2)\,a_{n+2} = -(n - 1)\,a_n\).</p>
    <p><strong>Q3.</strong> Pour \(n = 1\) : \(3a_3 = 0\), donc \(a_3 = 0\), puis tous les coefficients impairs d'indice \(\geq 3\) sont nuls : la partie impaire est \(a_1 t\) (c'est la solution de Q1). Avec \(a_0 = 1\) : \(a_2 = \frac12\), \(a_4 = -\frac14 a_2 = -\frac18\), \(a_6 = -\frac36 a_4 = \frac{1}{16}\). Les \(a_{2k}\) ne s'annulent pas (le facteur \(n - 1\) est non nul pour \(n\) pair) et</p>
    <div class="formula">$$\left|\frac{a_{2k+2}\,t^{2k+2}}{a_{2k}\,t^{2k}}\right| = \frac{2k - 1}{2k + 2}\,t^2 \longrightarrow t^2 :$$</div>
    <p>d'après la règle de d'Alembert, la série converge pour \(|t| \lt 1\) et diverge pour \(|t| \gt 1\) : son rayon vaut 1.</p>
    <p><strong>Q4.</strong> Posons \(b_k = a_{2k}\). La relation de Q2 avec \(n = 2k\) donne \(\dfrac{b_{k+1}}{b_k} = -\dfrac{2k - 1}{2k + 2} = \dfrac{\frac12 - k}{k + 1}\), et \(b_0 = 1\) : ce sont les coefficients de \(\sqrt{1 + u}\). La série paire vaut donc \(\sqrt{1 + t^2}\) sur \(]-1, 1[\).</p>
    <p><strong>Q5.</strong> Pour \(y = \sqrt{1 + t^2}\) : \(y' = \dfrac{t}{\sqrt{1 + t^2}}\), \(y'' = \dfrac{1}{(1 + t^2)^{3/2}}\), et</p>
    <div class="formula">$$(1 + t^2)\,y'' + t\,y' - y = \frac{1 + t^2 - (1 + t^2)}{\sqrt{1 + t^2}} = 0.$$</div>
    <p>Comme \(1 + t^2 \neq 0\), les solutions sur \(\mathbb{R}\) forment un plan ; \(t\) et \(\sqrt{1 + t^2}\) ont pour wronskien \(-\dfrac{1}{\sqrt{1 + t^2}} \neq 0\). Les solutions sont les \(\lambda t + \mu\sqrt{1 + t^2}\). La série a pour rayon 1 alors que la solution \(\sqrt{1 + t^2}\) vit sur \(\mathbb{R}\) tout entier : comme dans le cours (§6), le rayon de convergence ne mesure pas l'intervalle de vie de la solution.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Une équation qui dégénère en 0</h3>
  <div class="statement">On considère l'équation \((H) : t\,y'' - (t + 1)\,y' + y = 0\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(t \mapsto \mathrm{e}^t\) et \(t \mapsto t + 1\) sont solutions de \((H)\) sur \(\mathbb{R}\).</div>
  <div class="q"><strong>Q2.</strong> Donner les solutions de \((H)\) sur \(]0, +\infty[\) et sur \(]-\infty, 0[\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer les solutions de \((H)\) sur \(\mathbb{R}\). Quelle est la dimension de leur espace ?</div>
  <div class="q"><strong>Q4.</strong> Montrer que toute solution sur \(\mathbb{R}\) vérifie \(y'(0) = y(0)\). Discuter, selon \((y_0, y_1)\), le problème « \(y\) solution sur \(\mathbb{R}\), \(y(0) = y_0\), \(y'(0) = y_1\) ». Que se passe-t-il pour les conditions \(y(1) = y_0\), \(y'(1) = y_1\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(\mathrm{e}^t\) : \(\big(t - (t + 1) + 1\big)\,\mathrm{e}^t = 0\). Pour \(t + 1\) : \(0 - (t + 1) + (t + 1) = 0\).</p>
    <p><strong>Q2.</strong> Sur chacun des deux intervalles, \(t \neq 0\) : l'équation se résout en \(y''\), à coefficients continus, et ses solutions forment un plan. Le wronskien de \((\mathrm{e}^t, t + 1)\) vaut \(\mathrm{e}^t - (t + 1)\,\mathrm{e}^t = -t\,\mathrm{e}^t \neq 0\). Les solutions sont les \(a\,\mathrm{e}^t + b\,(t + 1)\), avec des constantes qui peuvent différer d'un intervalle à l'autre.</p>
    <p><strong>Q3.</strong> Une solution sur \(\mathbb{R}\) s'écrit \(a_1\mathrm{e}^t + b_1(t + 1)\) pour \(t \lt 0\) et \(a_2\mathrm{e}^t + b_2(t + 1)\) pour \(t \gt 0\).</p>
    <ul>
      <li>Continuité en 0 : \(a_1 + b_1 = a_2 + b_2 = y(0)\).</li>
      <li>Dérivabilité : \(y'\) tend vers \(a_1 + b_1\) à gauche et vers \(a_2 + b_2\) à droite. Ces limites sont égales d'après le point précédent ; par le théorème de la limite de la dérivée, \(y\) est dérivable en 0, avec \(y'(0) = y(0)\), et \(y'\) est continue en 0.</li>
      <li>Dérivée seconde : \(y''\) tend vers \(a_1\) à gauche et vers \(a_2\) à droite ; \(y''(0)\) existe si et seulement si \(a_1 = a_2\), et alors \(b_1 = b_2\).</li>
      <li>En \(t = 0\), l'équation se réduit à \(-y'(0) + y(0) = 0\) : vrai.</li>
    </ul>
    <p>Les solutions sur \(\mathbb{R}\) sont donc les \(a\,\mathrm{e}^t + b\,(t + 1)\) : un espace de dimension 2, bien que le théorème de Cauchy ne s'applique pas sur \(\mathbb{R}\).</p>
    <p><strong>Q4.</strong> On a vu que \(y'(0) = a + b = y(0)\) ; c'est aussi ce que dit l'équation en \(t = 0\). Si \(y_1 \neq y_0\), le problème n'a aucune solution ; si \(y_1 = y_0\), il en a une infinité : toutes les \(a\,\mathrm{e}^t + (y_0 - a)(t + 1)\), \(a \in \mathbb{R}\). En revanche, en \(t_0 = 1\), le système \(a\,\mathrm{e} + 2b = y_0\), \(a\,\mathrm{e} + b = y_1\), de déterminant \(-\mathrm{e} \neq 0\), a toujours une unique solution : chaque solution sur \(]0, +\infty[\) se prolonge d'une seule façon à \(\mathbb{R}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Variation des constantes, pas à pas</h3>
  <div class="statement">On veut résoudre sur \(I = \,]0, +\infty[\) l'équation \((E) : y'' - 2y' + y = \dfrac{\mathrm{e}^t}{t}\), dont le second membre n'est pas du type \(P(t)\,\mathrm{e}^{mt}\).</div>
  <div class="q"><strong>Q1.</strong> Donner une base \((y_1, y_2)\) des solutions de l'équation homogène et calculer son wronskien.</div>
  <div class="q"><strong>Q2.</strong> On cherche une solution \(y = \lambda_1 y_1 + \lambda_2 y_2\), où \(\lambda_1\), \(\lambda_2\) sont dérivables et vérifient \(\lambda_1' y_1 + \lambda_2' y_2 = 0\). Montrer que \(y\) est solution si \(\lambda_1' y_1' + \lambda_2' y_2' = \dfrac{\mathrm{e}^t}{t}\), puis calculer \(\lambda_1'\) et \(\lambda_2'\).</div>
  <div class="q"><strong>Q3.</strong> En déduire les solutions de \((E)\) sur \(I\).</div>
  <div class="q"><strong>Q4.</strong> Retrouver ce résultat en posant \(y = z\,\mathrm{e}^t\).</div>
  <div class="q"><strong>Q5.</strong> Déterminer la solution telle que \(y(1) = y'(1) = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'équation caractéristique \(r^2 - 2r + 1 = (r - 1)^2\) a la racine double 1 : \(y_1 = \mathrm{e}^t\), \(y_2 = t\,\mathrm{e}^t\). Leur wronskien vaut \(\mathrm{e}^t\,(1 + t)\,\mathrm{e}^t - \mathrm{e}^t \times t\,\mathrm{e}^t = \mathrm{e}^{2t}\).</p>
    <p><strong>Q2.</strong> Avec la condition imposée, \(y' = \lambda_1 y_1' + \lambda_2 y_2'\), puis \(y'' = \lambda_1 y_1'' + \lambda_2 y_2'' + \lambda_1' y_1' + \lambda_2' y_2'\). Comme \(y_1\) et \(y_2\) sont solutions homogènes, il reste \(y'' - 2y' + y = \lambda_1' y_1' + \lambda_2' y_2'\), égal au second membre si la seconde condition est vérifiée. Le système s'écrit, après simplification par \(\mathrm{e}^t\) :</p>
    <div class="formula">$$\begin{cases} \lambda_1' + t\,\lambda_2' = 0 \\ \lambda_1' + (1 + t)\,\lambda_2' = \dfrac{1}{t} \end{cases}$$</div>
    <p>Par différence, \(\lambda_2' = \dfrac1t\), puis \(\lambda_1' = -1\) (ce sont les formules \(-y_2 c/W\) et \(y_1 c/W\)).</p>
    <p><strong>Q3.</strong> On choisit \(\lambda_1 = -t\) et \(\lambda_2 = \ln t\) (licite car \(t \gt 0\)) : \(y_p = -t\,\mathrm{e}^t + t\ln t\,\mathrm{e}^t\). Le terme \(-t\,\mathrm{e}^t\) est solution homogène ; les solutions de \((E)\) sont</p>
    <div class="formula">$$y(t) = \big(\lambda + \mu t + t\ln t\big)\,\mathrm{e}^t,\qquad (\lambda, \mu) \in \mathbb{R}^2.$$</div>
    <p><strong>Q4.</strong> Avec \(y = z\,\mathrm{e}^t\) : \(y' = (z' + z)\,\mathrm{e}^t\), \(y'' = (z'' + 2z' + z)\,\mathrm{e}^t\), donc \(y'' - 2y' + y = z''\,\mathrm{e}^t\). L'équation devient \(z'' = \dfrac1t\) : \(z' = \ln t + \alpha\), \(z = t\ln t - t + \alpha t + \beta\). On retrouve la même famille (avec \(\mu = \alpha - 1\), \(\lambda = \beta\)).</p>
    <p><strong>Q5.</strong> \(y(1) = (\lambda + \mu)\,\mathrm{e} = 0\). Comme \(y' = (\lambda + \mu t + t\ln t + \mu + \ln t + 1)\,\mathrm{e}^t\), \(y'(1) = (\lambda + 2\mu + 1)\,\mathrm{e} = 0\). D'où \(\mu = -1\), \(\lambda = 1\), et \(y(t) = (1 - t + t\ln t)\,\mathrm{e}^t\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Une équation d'Euler et le changement de variable exponentiel</h3>
  <div class="statement">On considère sur \(I = \,]0, +\infty[\) l'équation \((E) : t^2 y'' - t\,y' + 5y = t\). À une fonction \(y\) deux fois dérivable sur \(I\), on associe \(z(x) = y(\mathrm{e}^x)\), définie sur \(\mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(z'(x)\) et \(z''(x)\) à l'aide de \(t = \mathrm{e}^x\), \(y'(t)\) et \(y''(t)\). Montrer que \(y\) est solution de \((E)\) si et seulement si \(z'' - 2z' + 5z = \mathrm{e}^x\).</div>
  <div class="q"><strong>Q2.</strong> Résoudre cette équation, puis en déduire les solutions de \((E)\) sur \(I\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer la solution telle que \(y(1) = 0\) et \(y'(1) = 0\).</div>
  <div class="q"><strong>Q4.</strong> Retrouver les solutions homogènes en cherchant des solutions de la forme \(t^r\), avec \(r\) complexe.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Par dérivation d'une composée, avec \(t = \mathrm{e}^x\) :</p>
    <div class="formula">$$\begin{aligned} z'(x) &= \mathrm{e}^x\,y'(\mathrm{e}^x) = t\,y'(t), \\ z''(x) &= \mathrm{e}^x\,y'(\mathrm{e}^x) + \mathrm{e}^{2x}\,y''(\mathrm{e}^x) \\ &= t\,y'(t) + t^2 y''(t). \end{aligned}$$</div>
    <p>Donc \(t^2 y'' = z'' - z'\) et \(t\,y' = z'\), et</p>
    <div class="formula">$$t^2 y'' - t\,y' + 5y = z'' - 2z' + 5z.$$</div>
    <p>Comme \(x \mapsto \mathrm{e}^x\) est une bijection de \(\mathbb{R}\) sur \(I\), \(y\) est solution de \((E)\) sur \(I\) si et seulement si \(z'' - 2z' + 5z = \mathrm{e}^x\) sur \(\mathbb{R}\).</p>
    <p><strong>Q2.</strong> \(r^2 - 2r + 5 = 0\) a pour racines \(1 \pm 2i\) : solutions homogènes \(\mathrm{e}^x(\lambda\cos 2x + \mu\sin 2x)\). Comme 1 n'est pas racine, on cherche \(z_p = C\,\mathrm{e}^x\) : \(C(1 - 2 + 5) = 1\), \(C = \frac14\). En revenant à \(t = \mathrm{e}^x\), soit \(x = \ln t\) :</p>
    <div class="formula">$$y(t) = t\big(\lambda\cos(2\ln t) + \mu\sin(2\ln t)\big) + \frac{t}{4}.$$</div>
    <p><strong>Q3.</strong> \(y(1) = \lambda + \frac14 = 0\). Ensuite</p>
    <div class="formula">$$y'(t) = (\lambda + 2\mu)\cos(2\ln t) + (\mu - 2\lambda)\sin(2\ln t) + \frac14,$$</div>
    <p>donc \(y'(1) = \lambda + 2\mu + \frac14 = 0\). D'où \(\lambda = -\frac14\), \(\mu = 0\) et \(y(t) = \dfrac{t}{4}\big(1 - \cos(2\ln t)\big)\).</p>
    <p><strong>Q4.</strong> Pour \(y = t^r = \mathrm{e}^{r\ln t}\) : \(\big(r(r - 1) - r + 5\big)\,t^r = (r^2 - 2r + 5)\,t^r\). Avec \(r = 1 + 2i\), \(t^r = t\,\mathrm{e}^{2i\ln t}\) ; ses parties réelle et imaginaire, \(t\cos(2\ln t)\) et \(t\sin(2\ln t)\), sont les solutions homogènes réelles trouvées en Q2.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Systèmes différentiels X′ = AX (hors programme, pour aller plus loin)</h3>
  <div class="statement">Les systèmes linéaires à coefficients constants ne sont pas au programme de mathématiques, mais ils servent en physique et en SI (voir la section finale du cours). On note \(X = \begin{pmatrix} x \\ y \end{pmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Résoudre \(X' = AX\) avec \(A = \begin{pmatrix} 1 & 2 \\ 0 & 3 \end{pmatrix}\), puis déterminer la solution telle que \(X(0) = \begin{pmatrix} 3 \\ 1 \end{pmatrix}\).</div>
  <div class="q"><strong>Q2.</strong> Résoudre \(X' = BX\) avec \(B = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}\).</div>
  <div class="q"><strong>Q3.</strong> Pour le système de Q2, montrer que \(x'' + x = 0\) et retrouver le résultat avec le cours de première année.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(A\) est triangulaire : valeurs propres 1 et 3, distinctes, donc \(A\) est diagonalisable. Vecteur propre pour 1 : \((1, 0)\) ; pour 3 : \((A - 3I)\,V = 0\) donne \(-2v_1 + 2v_2 = 0\), soit \(V = (1, 1)\). Les solutions sont</p>
    <div class="formula">$$X(t) = c_1\,\mathrm{e}^{t}\begin{pmatrix}1\\0\end{pmatrix} + c_2\,\mathrm{e}^{3t}\begin{pmatrix}1\\1\end{pmatrix},\qquad (c_1, c_2) \in \mathbb{R}^2.$$</div>
    <p>\(X(0) = (c_1 + c_2,\ c_2) = (3, 1)\) donne \(c_2 = 1\), \(c_1 = 2\) : \(x(t) = 2\mathrm{e}^t + \mathrm{e}^{3t}\), \(y(t) = \mathrm{e}^{3t}\). Contrôle : \(x' = 2\mathrm{e}^t + 3\mathrm{e}^{3t} = x + 2y\).</p>
    <p><strong>Q2.</strong> \(B\) a pour valeurs propres \(\pm i\) : elle n'est pas diagonalisable dans \(\mathbb{R}\). Les solutions réelles sont \(X(t) = \begin{pmatrix} \cos t & -\sin t \\ \sin t & \cos t\end{pmatrix}X_0\), soit \(x(t) = c_1\cos t - c_2\sin t\), \(y(t) = c_1\sin t + c_2\cos t\) : on vérifie \(x' = -y\) et \(y' = x\). Les trajectoires sont des cercles centrés en \(O\), parcourus à vitesse angulaire 1.</p>
    <p><strong>Q3.</strong> \(x' = -y\) donne \(x'' = -y' = -x\). Les solutions de \(x'' + x = 0\) sont les \(c_1\cos t - c_2\sin t\), puis \(y = -x' = c_1\sin t + c_2\cos t\). Inversement, une équation d'ordre 2 se ramène à un système d'ordre 1 en posant \(X = (y, y')\) : c'est le point de vue de la section finale du cours.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Solutions polynomiales et oscillateur quantique</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème <em>équations différentielles linéaires d'ordre 2, séries entières</em>).</div>
  <div class="statement">En mécanique quantique, l'étude de l'oscillateur harmonique conduit à l'équation d'Hermite. On étudie ici sur \(\mathbb{R}\) l'équation
    <div class="formula">$$(H) : \quad y'' - 2t\,y' + 4y = 0.$$</div>
  </div>

  <p class="exo-part">Partie A — Solutions développables en série entière</p>
  <div class="q"><strong>A1.</strong> Justifier que l'ensemble des solutions de \((H)\) sur \(\mathbb{R}\) est un plan vectoriel.</div>
  <div class="q"><strong>A2.</strong> Soit \(y(t) = \sum_{k \geq 0} a_k t^k\) une série entière de rayon \(R \gt 0\), solution sur \(]-R, R[\). Montrer que pour tout \(k \geq 0\) :
    <div class="formula">$$a_{k+2} = \frac{2(k - 2)}{(k + 2)(k + 1)}\,a_k.$$</div></div>
  <div class="q"><strong>A3.</strong> Montrer que la série paire obtenue pour \(a_0 = 1\), \(a_1 = 0\) est un polynôme \(P\), que l'on déterminera.</div>
  <div class="q"><strong>A4.</strong> Pour \(a_0 = 0\), \(a_1 = 1\), on note \(S\) la série obtenue. Calculer \(a_3\), \(a_5\), \(a_7\), montrer que \(S\) n'est pas un polynôme et que son rayon est infini.</div>
  <div class="q"><strong>A5.</strong> En déduire que toute solution de \((H)\) sur \(\mathbb{R}\) est développable en série entière, de rayon infini.</div>

  <p class="exo-part">Partie B — Seconde solution par abaissement de l'ordre</p>
  <div class="q"><strong>B1.</strong> Déterminer le plus grand intervalle \(J\) contenant 0 sur lequel \(P\) ne s'annule pas. Sur \(J\), on pose \(y = z\,P\). Montrer que \(y\) est solution si et seulement si \(w = z'\) vérifie \(P\,w' + 2(P' - t\,P)\,w = 0\), et en déduire \(w = C\,\dfrac{\mathrm{e}^{t^2}}{P^2}\).</div>
  <div class="q"><strong>B2.</strong> On pose, pour \(t \in J\), \(y_2(t) = P(t)\displaystyle\int_0^t \frac{\mathrm{e}^{s^2}}{P(s)^2}\,\mathrm{d}s\). Justifier que \(y_2\) est solution de \((H)\) sur \(J\), calculer \(y_2(0)\) et \(y_2'(0)\), et en déduire que \(y_2 = S\) sur \(J\).</div>
  <div class="q"><strong>B3.</strong> Calculer le wronskien \(W = P\,S' - P'\,S\) sur \(\mathbb{R}\).</div>

  <p class="exo-part">Partie C — Retour à la physique</p>
  <div class="q"><strong>C1.</strong> Pour \(y\) deux fois dérivable, on pose \(u(t) = \mathrm{e}^{-t^2/2}\,y(t)\). Montrer que \(y\) est solution de \((H)\) si et seulement si \(u'' + (5 - t^2)\,u = 0\).</div>
  <div class="q"><strong>C2.</strong> Montrer que les solutions paires de \(u'' + (5 - t^2)\,u = 0\) sont les multiples de \(U(t) = (1 - 2t^2)\,\mathrm{e}^{-t^2/2}\). Donner les zéros et la limite en \(\pm\infty\) de \(U\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> L'équation est résolue, à coefficients \(-2t\) et \(4\) continus sur l'intervalle \(\mathbb{R}\) : théorème de structure.</p>
    <p><strong>A2.</strong> Sur \(]-R, R[\), on dérive terme à terme et on réindexe : \(y'' = \sum_{k \geq 0} (k + 2)(k + 1)\,a_{k+2} t^k\), \(-2t\,y' = \sum_{k \geq 0} (-2k)\,a_k t^k\). Par unicité des coefficients, \((k + 2)(k + 1)\,a_{k+2} - 2k\,a_k + 4a_k = 0\), d'où la relation.</p>
    <p><strong>A3.</strong> Avec \(a_0 = 1\) : \(a_2 = \frac{2 \times (-2)}{2}\,a_0 = -2\), puis \(a_4 = \frac{2 \times 0}{12}\,a_2 = 0\), et tous les coefficients pairs suivants sont nuls. Les impairs sont nuls car \(a_1 = 0\). Donc \(P(t) = 1 - 2t^2\), polynôme solution sur \(\mathbb{R}\) (contrôle : \(-4 - 2t(-4t) + 4(1 - 2t^2) = 0\)).</p>
    <p><strong>A4.</strong> \(a_3 = \frac{2 \times (-1)}{6} = -\frac13\), \(a_5 = \frac{2 \times 1}{20}\,a_3 = -\frac{1}{30}\), \(a_7 = \frac{2 \times 3}{42}\,a_5 = -\frac{1}{210}\). Pour \(k\) impair, \(k - 2 \neq 0\) : par récurrence à partir de \(a_1 = 1\), aucun coefficient impair ne s'annule, et \(S\) n'est pas un polynôme. Enfin</p>
    <div class="formula">$$\left|\frac{a_{k+2}}{a_k}\right| = \frac{2|k - 2|}{(k + 2)(k + 1)} \longrightarrow 0,$$</div>
    <p>donc (règle de d'Alembert appliquée à \(\sum a_{2j+1} t^{2j+1}\)) la série converge pour tout \(t\) : \(R = +\infty\).</p>
    <p><strong>A5.</strong> Les calculs de A2 se remontent : \(P\) et \(S\) sont des solutions sur \(\mathbb{R}\). Elles ne sont pas proportionnelles (l'une est paire et non nulle, l'autre impaire et non nulle), donc forment une base du plan des solutions. Toute solution \(\lambda P + \mu S\) est développable en série entière, de rayon infini.</p>
    <p><strong>B1.</strong> \(P\) s'annule en \(\pm\frac{1}{\sqrt2}\) : \(J = \,\big]-\frac{1}{\sqrt2}, \frac{1}{\sqrt2}\big[\). Avec \(a = -2t\), l'abaissement de l'ordre donne \(P\,z'' + (2P' - 2t\,P)\,z' = 0\), soit \(P\,w' + 2(P' - tP)\,w = 0\). Sur \(J\), en divisant par \(P\) : \(w' = \Big(2t - \dfrac{2P'}{P}\Big)w\). Une primitive de \(2t - \dfrac{2P'}{P}\) est \(t^2 - 2\ln|P|\), d'où \(w = C\,\mathrm{e}^{t^2}\,P^{-2}\).</p>
    <p><strong>B2.</strong> \(z(t) = \int_0^t \frac{\mathrm{e}^{s^2}}{P(s)^2}\,\mathrm{d}s\) a pour dérivée la fonction \(w\) obtenue pour \(C = 1\) : d'après B1, \(y_2 = z\,P\) est solution sur \(J\). \(y_2(0) = 0\) et \(y_2' = z'P + zP'\) donne \(y_2'(0) = \frac{1}{P(0)^2} \times P(0) = 1\). \(S\) est la solution de conditions initiales \((0, 1)\) en 0 : par unicité du problème de Cauchy sur \(J\), \(y_2 = S\) sur \(J\). On obtient une expression intégrale de \(S\) près de 0.</p>
    <p><strong>B3.</strong> \(W' = -a\,W = 2t\,W\), donc \(W(t) = W(0)\,\mathrm{e}^{t^2}\), avec \(W(0) = P(0)\,S'(0) - P'(0)\,S(0) = 1\). Ainsi \(W(t) = \mathrm{e}^{t^2}\) sur \(\mathbb{R}\), ce qui confirme que \((P, S)\) est une base.</p>
    <p><strong>C1.</strong> On écrit \(y = \mathrm{e}^{t^2/2}\,u\) : \(y' = \mathrm{e}^{t^2/2}(u' + t\,u)\) et \(y'' = \mathrm{e}^{t^2/2}\big(u'' + 2t\,u' + (1 + t^2)\,u\big)\). Donc</p>
    <div class="formula">$$y'' - 2t\,y' + 4y = \mathrm{e}^{t^2/2}\big(u'' + (5 - t^2)\,u\big),$$</div>
    <p>et l'exponentielle ne s'annule pas.</p>
    <p><strong>C2.</strong> \(u\) est paire si et seulement si \(y = \mathrm{e}^{t^2/2}u\) l'est. Une solution paire \(y = \lambda P + \mu S\) vérifie \(y'(0) = \mu = 0\) (dérivée d'une fonction paire dérivable en 0) : \(y = \lambda P\), et \(u = \lambda U\). Réciproquement \(U\) est paire et solution. \(U\) s'annule en \(\pm\frac{1}{\sqrt2}\) et tend vers 0 en \(\pm\infty\) (croissances comparées). En physique, \(U\) décrit un état lié de l'oscillateur : une fonction d'onde qui s'annule à l'infini n'existe que pour des valeurs particulières de l'énergie (ici la valeur 5), c'est la quantification.</p>
  </div>
</div>
