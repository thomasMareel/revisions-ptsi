<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite la partie « Équations différentielles scalaires d'ordre 2 » du programme de PT (section « Équations différentielles et calcul différentiel »). En première année, on a résolu complètement les équations linéaires d'ordre 1 et celles d'ordre 2 <strong>à coefficients constants</strong>. On passe ici aux équations d'ordre 2 <strong>à coefficients variables</strong>, pour lesquelles il n'existe plus de méthode générale de résolution explicite : la théorie (théorème de Cauchy, structure de l'ensemble des solutions) prend le relais, complétée par des techniques de résolution guidées. Le chapitre s'appuie sur le chapitre « Séries entières » (§6) et sert sans cesse en physique et en SI.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Rappels de première année</strong> : équation linéaire d'ordre 1 (variation de la constante, problème de Cauchy), équation d'ordre 2 à coefficients constants (§1).</li>
        <li><strong>Équation scalaire d'ordre 2 à coefficients continus</strong> \(y'' + a(t)y' + b(t)y = c(t)\) ; équation homogène associée (§2).</li>
        <li><strong>Théorème de Cauchy linéaire</strong> : existence et unicité de la solution d'un problème de Cauchy, la démonstration étant hors programme (§3).</li>
        <li><strong>Espace vectoriel des solutions de l'équation homogène</strong> ; principe de superposition ; description de l'ensemble des solutions à partir d'une solution particulière et des solutions de l'équation homogène associée (§4). Équations non résolues en \(y''\) : choix des intervalles, recollement (§5).</li>
        <li><strong>Exemples de recherche de solutions développables en série entière</strong> ; la résolution explicite comporte toujours des indications (§6).</li>
        <li><strong>Résolution lorsqu'on connaît une solution de l'équation homogène ne s'annulant pas</strong> (§7).</li>
        <li><strong>Variation des constantes</strong> : méthode que le programme ne cite pas pour l'ordre 2 ; elle est présentée ici comme une méthode guidée, qu'un énoncé détaillera (§8).</li>
      </ul>
      <p>Hors programme : les systèmes différentiels linéaires et l'exponentielle de matrice, les équations non linéaires (section finale). Le wronskien n'est pas au programme : il est utilisé ici comme un outil commode, toujours justifiable par le théorème de Cauchy.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · RAPPELS DE PREMIÈRE ANNÉE</div>
  <h2>L'ordre 1 et l'ordre 2 à coefficients constants</h2>
  <div class="intro">Deux résultats de PTSI resservent constamment : la résolution complète d'une équation linéaire d'ordre 1, et celle d'une équation d'ordre 2 à coefficients constants. Ils réapparaissent à l'intérieur des méthodes de ce chapitre : l'abaissement de l'ordre (§7) ramène par exemple une équation d'ordre 2 à une équation d'ordre 1. Dans tout le chapitre, \(\mathbb{K}\) désigne \(\mathbb{R}\) ou \(\mathbb{C}\) et \(I\) un intervalle de \(\mathbb{R}\) non réduit à un point.</div>

  <h3>Équation linéaire d'ordre 1</h3>
  <div class="prop-box">
    <strong>Résolution de \(y' + a(t)\,y = b(t)\).</strong> Soit \(a, b : I \to \mathbb{K}\) continues et \(A\) une primitive de \(a\) sur \(I\).
    <ul>
      <li>Les solutions de l'équation homogène \(y' + a(t)\,y = 0\) sont les fonctions
        <div class="formula" data-nom="Ordre 1 : équation homogène">$$y(t) = K\,\mathrm{e}^{-A(t)},\qquad K\in\mathbb{K}.$$</div>
        Elles forment une droite vectorielle ; une solution non nulle ne s'annule jamais.</li>
      <li><strong>Variation de la constante</strong> : on cherche une solution particulière \(y_p = K(t)\,\mathrm{e}^{-A(t)}\) ; on obtient \(K'(t) = b(t)\,\mathrm{e}^{A(t)}\), qu'il reste à primitiver.</li>
      <li>Les solutions de l'équation complète sont les \(y_p + K\mathrm{e}^{-A}\), et pour tout \(t_0 \in I\), \(y_0 \in \mathbb{K}\), il en existe une seule vérifiant \(y(t_0) = y_0\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — variation de la constante</strong>
    <p>Résoudre \(t\,y' - 2y = t^3\,\mathrm{e}^t\) sur \(I = \,]0, +\infty[\).</p>
    <ol>
      <li>Sur \(I\), \(t \neq 0\) : forme résolue \(y' - \dfrac{2}{t}\,y = t^2\,\mathrm{e}^t\). Une primitive de \(-2/t\) est \(-2\ln t\), donc les solutions homogènes sont \(K\,\mathrm{e}^{2\ln t} = K t^2\).</li>
      <li>On pose \(y = K(t)\,t^2\) : les termes en \(K\) se simplifient et il reste \(K'(t)\,t^2 = t^2\,\mathrm{e}^t\), soit \(K' = \mathrm{e}^t\), d'où \(K(t) = \mathrm{e}^t\) convient.</li>
      <li>Solutions : \(y(t) = (\mathrm{e}^t + K)\,t^2\), \(K \in \mathbb{R}\). Vérification :
        <div class="formula">$$\begin{aligned} t\,y' - 2y &= t^3\mathrm{e}^t + 2t^2(\mathrm{e}^t + K) - 2t^2(\mathrm{e}^t + K) \\ &= t^3\mathrm{e}^t. \end{aligned}$$</div></li>
    </ol>
  </div>

  <h3>Équation d'ordre 2 à coefficients constants</h3>
  <div class="prop-box">
    <strong>Résolution de \(y'' + a\,y' + b\,y = 0\)</strong> (\(a, b\) constantes réelles). Soit \(r_1, r_2\) les racines de l'<strong>équation caractéristique</strong> \(r^2 + a r + b = 0\), de discriminant \(\Delta\). Les solutions réelles sont :
    <ul>
      <li>si \(\Delta \gt 0\) : \(\lambda\,\mathrm{e}^{r_1 t} + \mu\,\mathrm{e}^{r_2 t}\) ;</li>
      <li>si \(\Delta = 0\) (racine double \(r\)) : \((\lambda + \mu t)\,\mathrm{e}^{r t}\) ;</li>
      <li>si \(\Delta \lt 0\) (racines \(\alpha \pm i\beta\)) : \(\mathrm{e}^{\alpha t}\big(\lambda\cos(\beta t) + \mu\sin(\beta t)\big)\),</li>
    </ul>
    avec \((\lambda, \mu) \in \mathbb{R}^2\). Avec un second membre \(c(t)\), on ajoute une solution particulière : pour \(c(t) = P(t)\,\mathrm{e}^{m t}\) (\(P\) polynôme), on la cherche sous la forme \(t^k Q(t)\,\mathrm{e}^{mt}\), où \(\deg Q = \deg P\) et \(k \in \{0, 1, 2\}\) est la multiplicité de \(m\) comme racine de l'équation caractéristique ; un second membre en \(\cos(\omega t)\) se traite comme la partie réelle de \(\mathrm{e}^{i\omega t}\).
  </div>
  <div class="method-box">
    <strong>Exemple — second membre résonant</strong>
    <p>Résoudre \(y'' - 3y' + 2y = \mathrm{e}^t\) avec \(y(0) = 0\) et \(y'(0) = 0\).</p>
    <ol>
      <li>\(r^2 - 3r + 2 = (r - 1)(r - 2)\) : solutions homogènes \(\lambda\,\mathrm{e}^t + \mu\,\mathrm{e}^{2t}\).</li>
      <li>\(1\) est racine simple : on cherche \(y_p = C\,t\,\mathrm{e}^t\). Avec \(y_p' = C(1 + t)\mathrm{e}^t\) et \(y_p'' = C(2 + t)\mathrm{e}^t\), il vient \(y_p'' - 3y_p' + 2y_p = -C\,\mathrm{e}^t\), donc \(C = -1\).</li>
      <li>\(y = \lambda\,\mathrm{e}^t + \mu\,\mathrm{e}^{2t} - t\,\mathrm{e}^t\). Les conditions initiales donnent \(\lambda + \mu = 0\) et \(\lambda + 2\mu - 1 = 0\), d'où \(\mu = 1\), \(\lambda = -1\) :
        <div class="formula">$$y(t) = \mathrm{e}^{2t} - (1 + t)\,\mathrm{e}^t.$$</div></li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : chercher \(y_p = C\,\mathrm{e}^t\) alors que \(1\) est racine de l'équation caractéristique. Ce candidat est solution de l'équation homogène : on obtient \(0 = \mathrm{e}^t\), contradiction. Il faut multiplier par \(t\) (par \(t^2\) pour une racine double).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ÉQUATIONS LINÉAIRES D'ORDRE 2 À COEFFICIENTS VARIABLES</div>
  <h2>Le cadre du chapitre</h2>
  <div class="intro">En physique, les coefficients d'une équation différentielle dépendent souvent de la variable : laplacien écrit en coordonnées cylindriques ou sphériques, ressort dont la raideur varie, longueur d'un pendule que l'on modifie. On fixe ici le vocabulaire et le point de vue linéaire qui organise tout le chapitre.</div>
  <div class="def-box">
    Soit \(a, b, c : I \to \mathbb{K}\) des fonctions <strong>continues</strong>. On considère l'<strong>équation différentielle linéaire scalaire d'ordre 2</strong>
    <div class="formula" data-nom="Équation linéaire d'ordre 2">$$(E)\qquad y'' + a(t)\,y' + b(t)\,y = c(t).$$</div>
    Une <strong>solution</strong> de \((E)\) sur \(I\) est une fonction \(y : I \to \mathbb{K}\) deux fois dérivable telle que \(y''(t) + a(t)y'(t) + b(t)y(t) = c(t)\) pour tout \(t \in I\). La fonction \(c\) est le <strong>second membre</strong> ; l'<strong>équation homogène associée</strong> est
    <div class="formula">$$(H)\qquad y'' + a(t)\,y' + b(t)\,y = 0.$$</div>
  </div>
  <p>Une solution est automatiquement de classe \(C^2\) : \(y'' = c - a\,y' - b\,y\) est continue comme somme et produits de fonctions continues. Le coefficient de \(y''\) vaut 1 : on dit que l'équation est <strong>résolue</strong> (ou normalisée). Une équation \(\alpha(t)\,y'' + \beta(t)\,y' + \gamma(t)\,y = \delta(t)\) se ramène à cette forme sur tout intervalle où \(\alpha\) ne s'annule pas, en divisant par \(\alpha\) (le cas où \(\alpha\) s'annule est traité au §5).</p>
  <div class="prop-box">
    <strong>Point de vue linéaire.</strong> L'application \(L : y \mapsto y'' + a\,y' + b\,y\), de \(C^2(I, \mathbb{K})\) dans \(C^0(I, \mathbb{K})\), est <strong>linéaire</strong>. Résoudre \((H)\), c'est déterminer le noyau \(\ker L\) ; résoudre \((E)\), c'est déterminer les antécédents de \(c\) par \(L\). Toute la structure de l'ensemble des solutions (§4) en découle.
  </div>
  <h3>Quelques équations rencontrées ailleurs</h3>
  <ul>
    <li><strong>Laplace en géométrie cylindrique</strong> : une température stationnaire \(T(r)\) qui ne dépend que de la distance à l'axe vérifie \(T'' + \frac{1}{r}\,T' = 0\).</li>
    <li><strong>Oscillateur paramétrique</strong> (balançoire, raideur modulée) : \(x'' + \omega^2(t)\,x = 0\), où la pulsation propre dépend du temps.</li>
    <li><strong>Équation de Bessel</strong> (membrane de tambour, guide d'onde cylindrique) : \(t^2 y'' + t\,y' + (t^2 - n^2)\,y = 0\).</li>
    <li><strong>Équation d'Euler</strong> \(t^2 y'' + \alpha\,t\,y' + \beta\,y = 0\) : on y cherche des solutions de la forme \(t^r\) (§5).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — conduction dans la paroi d'un tuyau</strong>
    <p>Une conduite a une paroi comprise entre les rayons \(R_1 = 1\ \text{cm}\) et \(R_2 = 2\ \text{cm}\), aux températures \(T_1 = 80\ \text{°C}\) (intérieur) et \(T_2 = 20\ \text{°C}\) (extérieur). En régime stationnaire, \(T'' + \frac{1}{r}T' = 0\) sur \([R_1, R_2]\).</p>
    <ol>
      <li>La fonction \(T\) elle-même n'apparaît pas : \(u = T'\) vérifie l'équation d'ordre 1 \(u' + \frac{1}{r}u = 0\), d'où \(u = A\,\mathrm{e}^{-\ln r} = A/r\).</li>
      <li>En primitivant : \(T(r) = A\ln r + B\). Les conditions aux deux bords donnent \(A = \dfrac{T_2 - T_1}{\ln(R_2/R_1)} = -\dfrac{60}{\ln 2} \approx -86{,}6\ \text{°C}\).</li>
      <li>Au milieu de la paroi : \(T(1{,}5\ \text{cm}) = T_1 + A\ln(1{,}5) \approx 44{,}9\ \text{°C}\), et non 50 °C : le profil n'est pas affine, contrairement à celui d'un mur plan.</li>
    </ol>
    <p>Les deux conditions sont données en deux points différents : c'est un problème <strong>aux limites</strong>, pas un problème de Cauchy (§3).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire une « équation caractéristique » pour une équation à coefficients variables. La méthode \(r^2 + ar + b = 0\) repose sur le fait que \(\mathrm{e}^{rt}\) est transformée en un multiple d'elle-même par \(L\) ; c'est faux dès que \(a\) ou \(b\) dépend de \(t\). Pour \(T'' + T'/r = 0\), aucune exponentielle n'est solution.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · THÉORÈME DE CAUCHY LINÉAIRE</div>
  <h2>Deux conditions initiales, une solution et une seule</h2>
  <div class="intro">Pour un mobile régi par une équation d'ordre 2, la position seule ne détermine pas le mouvement : il faut aussi la vitesse initiale. Le théorème de Cauchy dit que ces deux données suffisent toujours, et que la solution vit sur tout l'intervalle où les coefficients sont continus.</div>
  <div class="def-box">
    Soit \(t_0 \in I\) et \((y_0, y_1) \in \mathbb{K}^2\). Le <strong>problème de Cauchy</strong> associé à \((E)\) consiste à chercher les solutions \(y\) de \((E)\) sur \(I\) vérifiant
    <div class="formula">$$y(t_0) = y_0 \qquad\text{et}\qquad y'(t_0) = y_1.$$</div>
  </div>
  <div class="prop-box">
    <strong>Théorème de Cauchy linéaire.</strong> Si \(a\), \(b\) et \(c\) sont continues sur l'intervalle \(I\), alors pour tout \(t_0 \in I\) et tout \((y_0, y_1) \in \mathbb{K}^2\), le problème de Cauchy admet une <strong>unique</strong> solution, et elle est <strong>définie sur \(I\) tout entier</strong>. (Démonstration hors programme.)
  </div>

  <h3>Conséquences immédiates</h3>
  <ul>
    <li>Deux solutions de \((E)\) qui ont même valeur et même dérivée en <strong>un</strong> point de \(I\) sont égales sur tout \(I\).</li>
    <li>Une solution de \((H)\) telle que \(y(t_0) = y'(t_0) = 0\) est la fonction nulle (la fonction nulle est une solution qui convient, et elle est unique).</li>
    <li>Une solution non nulle de \((H)\) n'a que des zéros <strong>simples</strong> : si \(y(t_0) = 0\), alors \(y'(t_0) \neq 0\). Sa courbe traverse l'axe sans jamais lui être tangente.</li>
    <li>Si \(a\), \(b\), \(c\) sont réelles et les conditions initiales réelles, la solution est réelle : sa conjuguée est solution du même problème, donc lui est égale.</li>
    <li>L'existence est <strong>globale</strong> : pas d'explosion en temps fini, contrairement à certaines équations non linéaires (voir la section finale).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — l'unicité donne une symétrie</strong>
    <p>Soit \(y\) la solution de \(y'' + t^2 y = 0\) sur \(\mathbb{R}\) telle que \(y(0) = 1\), \(y'(0) = 0\). On ne sait pas l'exprimer avec des fonctions usuelles, mais on peut montrer qu'elle est paire.</p>
    <ol>
      <li>On pose \(z(t) = y(-t)\). Alors \(z''(t) = y''(-t) = -(-t)^2\,y(-t) = -t^2 z(t)\) : \(z\) est solution de la même équation.</li>
      <li>\(z(0) = y(0) = 1\) et \(z'(0) = -y'(0) = 0\) : \(z\) et \(y\) résolvent le même problème de Cauchy en \(t_0 = 0\).</li>
      <li>Par unicité, \(z = y\) : \(y\) est paire. De même, la solution telle que \(y(0) = 0\), \(y'(0) = 1\) est impaire.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre problème de Cauchy et problème aux limites. Avec deux conditions en deux points différents, le théorème ne dit rien : pour \(y'' + y = 0\), les conditions \(y(0) = 0\), \(y(\pi) = 0\) sont satisfaites par toutes les fonctions \(\lambda\sin t\), alors que \(y(0) = 0\), \(y(\pi) = 1\) n'est satisfaite par aucune solution.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · STRUCTURE DE L'ENSEMBLE DES SOLUTIONS</div>
  <h2>Un plan vectoriel, puis un plan affine</h2>
  <div class="intro">Même sans savoir résoudre l'équation, on connaît la forme de l'ensemble de ses solutions : un plan vectoriel pour l'équation homogène, un plan affine dirigé par lui pour l'équation complète. Trouver deux solutions homogènes indépendantes et une solution particulière suffit donc à tout résoudre.</div>
  <div class="prop-box">
    <strong>Théorème.</strong> Si \(a\) et \(b\) sont continues sur \(I\), l'ensemble \(\mathcal{S}_H\) des solutions de \((H)\) sur \(I\) est un sous-espace vectoriel de \(C^2(I, \mathbb{K})\) de <strong>dimension 2</strong>. Plus précisément, pour tout \(t_0 \in I\), l'application
    <div class="formula" data-nom="Isomorphisme des conditions initiales">$$\Phi : \mathcal{S}_H \to \mathbb{K}^2,\qquad y \mapsto \big(y(t_0),\,y'(t_0)\big)$$</div>
    est un isomorphisme.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout découle du théorème de Cauchy.</span>
    <div class="content">
      <p>\(\mathcal{S}_H = \ker L\) est un sous-espace vectoriel (noyau d'une application linéaire). L'application \(\Phi\) est linéaire, car \((\lambda y + \mu z)(t_0) = \lambda y(t_0) + \mu z(t_0)\), et de même pour les dérivées.</p>
      <p><strong>Surjectivité</strong> : pour tout \((y_0, y_1)\), le théorème de Cauchy fournit une solution de \((H)\) de conditions initiales \((y_0, y_1)\). <strong>Injectivité</strong> : si \(\Phi(y) = (0, 0)\), \(y\) et la fonction nulle résolvent le même problème de Cauchy, donc \(y = 0\). Ainsi \(\Phi\) est un isomorphisme et \(\dim \mathcal{S}_H = \dim \mathbb{K}^2 = 2\).</p>
    </div>
  </div>
  <div class="def-box">
    Une base \((y_1, y_2)\) de \(\mathcal{S}_H\) s'appelle un <strong>système fondamental de solutions</strong>. Alors \(\mathcal{S}_H = \{\lambda y_1 + \mu y_2,\ (\lambda, \mu) \in \mathbb{K}^2\}\). Deux solutions forment une base si et seulement si elles ne sont pas proportionnelles.
  </div>
  <div class="prop-box">
    <strong>Structure de l'ensemble des solutions de \((E)\).</strong> Si \(y_p\) est une solution particulière de \((E)\) et \((y_1, y_2)\) une base de \(\mathcal{S}_H\), les solutions de \((E)\) sur \(I\) sont exactement les fonctions
    <div class="formula" data-nom="Solution générale (ordre 2)">$$y = y_p + \lambda\,y_1 + \mu\,y_2,\qquad (\lambda, \mu) \in \mathbb{K}^2.$$</div>
    <strong>Principe de superposition</strong> : si \(L(u_1) = c_1\) et \(L(u_2) = c_2\), alors \(L(\alpha u_1 + \beta u_2) = \alpha c_1 + \beta c_2\). On découpe un second membre compliqué en morceaux plus simples.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi « particulière + homogène » donne toutes les solutions.</span>
    <div class="content"><p>Par linéarité de \(L\) :</p>
    <div class="formula">$$\begin{aligned} L(y) = c &\iff L(y) = L(y_p) \\ &\iff L(y - y_p) = 0 \\ &\iff y - y_p \in \mathcal{S}_H. \end{aligned}$$</div>
    <p>L'ensemble des solutions est le translaté \(y_p + \mathcal{S}_H\), plan affine de direction \(\mathcal{S}_H\).</p></div>
  </div>
  <h3>Le wronskien : tester une base d'un coup d'œil</h3>
  <div class="def-box">
    Le <strong>wronskien</strong> de deux solutions \(y_1, y_2\) de \((H)\) est la fonction
    <div class="formula" data-nom="Wronskien">$$\begin{aligned} W(t) &= \begin{vmatrix} y_1(t) & y_2(t) \\ y_1'(t) & y_2'(t) \end{vmatrix} \\ &= y_1(t)\,y_2'(t) - y_1'(t)\,y_2(t). \end{aligned}$$</div>
  </div>
  <div class="prop-box">
    <strong>Propriété.</strong> Pour deux solutions de \((H)\), il n'y a que deux possibilités : ou bien \(W\) ne s'annule <strong>en aucun point</strong> de \(I\), et \((y_1, y_2)\) est une base de \(\mathcal{S}_H\) ; ou bien \(W\) est <strong>identiquement nul</strong>, et \(y_1\), \(y_2\) sont proportionnelles. De plus \(W' = -a\,W\), donc \(W(t) = W(t_0)\,\mathrm{e}^{-\int_{t_0}^t a(s)\,\mathrm{d}s}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un déterminant transporté par l'isomorphisme \(\Phi\).</span>
    <div class="content">
      <p>Pour \(t_0 \in I\) fixé, \(W(t_0)\) est le déterminant des vecteurs \(\Phi(y_1)\) et \(\Phi(y_2)\) de \(\mathbb{K}^2\). Comme \(\Phi\) est un isomorphisme, \((y_1, y_2)\) est une base de \(\mathcal{S}_H\) si et seulement si \((\Phi(y_1), \Phi(y_2))\) est une base de \(\mathbb{K}^2\), c'est-à-dire si et seulement si \(W(t_0) \neq 0\). Cette condition ne dépend pas de \(t_0\) : si \(W\) s'annule en un point, la famille est liée, et \(W\) est nul partout.</p>
      <p>Enfin \(W' = y_1 y_2'' - y_1'' y_2\) (les termes \(y_1'y_2'\) se compensent) ; en remplaçant \(y_i'' = -a\,y_i' - b\,y_i\), il reste \(W' = -a\,(y_1 y_2' - y_1' y_2) = -a\,W\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — une base, puis un problème de Cauchy</strong>
    <p>On considère sur \(I = \,]0, +\infty[\) l'équation \((H) : y'' - \dfrac{1}{t}\,y' - 4t^2\,y = 0\).</p>
    <ol>
      <li>\(y_1 = \mathrm{e}^{t^2}\) : \(y_1' = 2t\,\mathrm{e}^{t^2}\), \(y_1'' = (2 + 4t^2)\,\mathrm{e}^{t^2}\), et \((2 + 4t^2) - 2 - 4t^2 = 0\) : solution. De même \(y_2 = \mathrm{e}^{-t^2}\) est solution.</li>
      <li>Le wronskien vaut
        <div class="formula">$$W(t) = \mathrm{e}^{t^2}\cdot(-2t\,\mathrm{e}^{-t^2}) - 2t\,\mathrm{e}^{t^2}\cdot\mathrm{e}^{-t^2} = -4t,$$</div>
        qui ne s'annule pas sur \(I\) : \((y_1, y_2)\) est une base. Contrôle : \(W' = \frac{1}{t}W\) donne bien \(W = Ct\).</li>
      <li>Solution telle que \(y(1) = 1\), \(y'(1) = 0\) : \(\lambda\mathrm{e} + \mu\mathrm{e}^{-1} = 1\) et \(2\lambda\mathrm{e} - 2\mu\mathrm{e}^{-1} = 0\) donnent \(\lambda\mathrm{e} = \mu\mathrm{e}^{-1} = \tfrac12\), d'où
        <div class="formula">$$y(t) = \tfrac12\big(\mathrm{e}^{t^2 - 1} + \mathrm{e}^{1 - t^2}\big) = \operatorname{ch}(t^2 - 1).$$</div></li>
      <li>Avec le second membre \(c(t) = -4t^2\), la constante \(y_p = 1\) est solution évidente : les solutions de \(y'' - \frac{1}{t}y' - 4t^2 y = -4t^2\) sont les \(1 + \lambda\,\mathrm{e}^{t^2} + \mu\,\mathrm{e}^{-t^2}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le critère du wronskien à des fonctions qui ne sont pas solutions d'une même équation résolue. Pour \(t\) et \(t^2\), \(W(t) = t^2\) s'annule en 0 sans être identiquement nul : la propriété montre justement qu'aucune équation \((H)\) à coefficients continus sur un intervalle contenant 0 n'admet ces deux solutions (elles sont solutions de \(t^2y'' - 2ty' + 2y = 0\), qui n'est pas résolue en 0).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · ÉQUATIONS NON RÉSOLUES : INTERVALLES ET RECOLLEMENT</div>
  <h2>Quand le coefficient de y″ s'annule</h2>
  <div class="intro">Une équation \(\alpha(t)\,y'' + \beta(t)\,y' + \gamma(t)\,y = \delta(t)\), avec \(\alpha\), \(\beta\), \(\gamma\), \(\delta\) continues, se résout sur chaque intervalle où \(\alpha\) ne s'annule pas grâce aux paragraphes précédents. Aux points où \(\alpha\) s'annule, le théorème de Cauchy ne s'applique plus et la dimension 2 peut tomber en défaut. La recherche des solutions sur un intervalle contenant ces points est une question d'écrit très fréquente.</div>
  <div class="method-box">
    <strong>Méthode — résoudre sur \(\mathbb{R}\) par recollement</strong>
    <ol>
      <li>Repérer les zéros de \(\alpha\). Sur chaque intervalle ouvert \(J\) qui les évite, l'équation se met sous forme résolue : écrire sa solution générale (deux constantes par intervalle).</li>
      <li>Une solution sur \(\mathbb{R}\) coïncide sur chaque \(J\) avec l'une de ces solutions : on écrit \(y\) par morceaux.</li>
      <li>En chaque zéro \(t_0\) de \(\alpha\), on impose que \(y\) soit continue, dérivable, puis deux fois dérivable en \(t_0\) (limites des deux côtés, taux d'accroissement), et que l'équation soit vérifiée en \(t_0\).</li>
      <li>Compter les constantes restées libres : c'est la dimension de l'espace des solutions sur \(\mathbb{R}\) (équation homogène), qui peut valoir 0, 1, 2, 3 ou 4.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une équation d'Euler : dimension 3 sur ℝ</strong>
    <p>Résoudre \(t^2y'' - 4t\,y' + 6y = 0\) sur \(]0, +\infty[\), sur \(]-\infty, 0[\), puis sur \(\mathbb{R}\).</p>
    <ol>
      <li><strong>Solutions puissances.</strong> Pour \(y = t^r\) sur \(]0, +\infty[\) :
        <div class="formula">$$\begin{aligned} t^2y'' - 4ty' + 6y &= \big(r(r-1) - 4r + 6\big)t^r \\ &= (r - 2)(r - 3)\,t^r. \end{aligned}$$</div>
        Donc \(t^2\) et \(t^3\) sont solutions, sur \(]0, +\infty[\) comme sur \(]-\infty, 0[\) (calcul polynomial).</li>
      <li><strong>Base sur chaque demi-droite.</strong> \(W(t) = t^2\cdot 3t^2 - 2t\cdot t^3 = t^4 \neq 0\) ; sur chacun des deux intervalles, l'équation résolue \(y'' - \frac{4}{t}y' + \frac{6}{t^2}y = 0\) a pour solutions les \(a\,t^2 + b\,t^3\).</li>
      <li><strong>Recollement en 0.</strong> Une solution sur \(\mathbb{R}\) s'écrit \(a_1t^2 + b_1t^3\) pour \(t \lt 0\) et \(a_2t^2 + b_2t^3\) pour \(t \gt 0\). Elle tend vers 0 des deux côtés : \(y(0) = 0\). Le taux \(y(t)/t\) tend vers 0 : \(y'(0) = 0\). Ensuite \(y'(t)/t\) vaut \(2a_1 + 3b_1t\) à gauche et \(2a_2 + 3b_2t\) à droite : \(y''(0)\) existe si et seulement si \(a_1 = a_2\). L'équation en \(t = 0\) se réduit à \(6y(0) = 0\), vraie.</li>
      <li><strong>Conclusion.</strong> Les solutions sur \(\mathbb{R}\) sont les fonctions égales à \(a\,t^2 + b_1t^3\) sur \(]-\infty, 0]\) et à \(a\,t^2 + b_2t^3\) sur \([0, +\infty[\) : un espace de <strong>dimension 3</strong>, de base \(\big(t^2,\ t^3,\ |t|^3\big)\) (la fonction \(|t|^3\) est bien de classe \(C^2\), de dérivée seconde \(6|t|\)).</li>
    </ol>
  </div>

  <p>La situation peut aussi être inverse. Pour \(t^2y'' + t\,y' - 4y = 0\), les solutions sur chaque demi-droite sont les \(a\,t^2 + b\,t^{-2}\) ; la continuité en 0 impose \(b = 0\) des deux côtés, puis l'existence de \(y''(0)\) impose le même coefficient \(a\) : sur \(\mathbb{R}\), il ne reste que les \(\lambda t^2\), un espace de <strong>dimension 1</strong>.</p>
  <div class="notice"><strong>Erreur classique</strong> : affirmer « l'espace des solutions sur \(\mathbb{R}\) est de dimension 2 » sans vérifier que le coefficient de \(y''\) ne s'annule pas. Le théorème de Cauchy et la dimension 2 ne valent que pour l'équation <strong>résolue</strong>, à coefficients continus sur l'intervalle considéré.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SOLUTIONS DÉVELOPPABLES EN SÉRIE ENTIÈRE</div>
  <h2>Chercher les solutions sous forme de séries</h2>
  <div class="intro">Lorsque les coefficients sont des polynômes, on cherche les solutions sous la forme \(y(t) = \sum a_n t^n\) : l'équation différentielle devient une relation de récurrence entre les coefficients. On utilise deux résultats du chapitre « Séries entières » : la dérivation terme à terme sur l'intervalle ouvert de convergence, et l'unicité des coefficients d'une série entière de rayon non nul. Le programme précise qu'un énoncé fournit toujours des indications.</div>
  <div class="method-box">
    <strong>Méthode — chercher les solutions développables en série entière</strong>
    <ol>
      <li><strong>Analyse.</strong> Supposer que \(y(t) = \sum_{n \geq 0} a_n t^n\) a un rayon \(R \gt 0\) et est solution sur \(]-R, R[\). Y dériver terme à terme : \(y' = \sum n\,a_n t^{n-1}\), \(y'' = \sum n(n-1)\,a_n t^{n-2}\).</li>
      <li>Reporter dans l'équation, multiplier par les coefficients polynomiaux, puis <strong>décaler les indices</strong> pour écrire chaque somme avec la même puissance \(t^n\) ; traiter à part les premiers termes.</li>
      <li>Par unicité des coefficients, le coefficient de chaque \(t^n\) est nul : on obtient une <strong>relation de récurrence</strong>, et les premiers coefficients restent souvent libres.</li>
      <li>Résoudre la récurrence (souvent séparément pour les indices pairs et impairs), puis <strong>calculer le rayon</strong> de la série obtenue, par exemple avec la règle de d'Alembert.</li>
      <li><strong>Synthèse.</strong> Si ce rayon est non nul, les calculs se remontent : la somme est solution sur \(]-R, R[\). Reconnaître si possible la somme à l'aide des développements usuels.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une solution de rayon infini</strong>
    <p>On cherche les solutions développables en série entière de \(4t\,y'' + 2y' - y = 0\).</p>
    <ol>
      <li>Avec \(y = \sum a_n t^n\) : \(4t\,y'' = \sum_{n \geq 1} 4(n+1)n\,a_{n+1}t^n\) et \(2y' = \sum_{n \geq 0} 2(n+1)\,a_{n+1}t^n\) (décalage d'indice). Le coefficient de \(t^n\) donne, pour tout \(n \geq 0\) :
        <div class="formula">$$\begin{aligned} &2(n+1)(2n+1)\,a_{n+1} = a_n, \\ &\text{donc}\quad a_n = \frac{a_0}{(2n)!}. \end{aligned}$$</div></li>
      <li>Rayon : \(\dfrac{|a_{n+1}|}{|a_n|} = \dfrac{1}{(2n+2)(2n+1)} \to 0\), donc \(R = +\infty\).</li>
      <li>Reconnaissance : pour \(t \geq 0\), \(\sum \dfrac{t^n}{(2n)!} = \sum \dfrac{(\sqrt t\,)^{2n}}{(2n)!} = \operatorname{ch}\sqrt t\) ; pour \(t \leq 0\), on obtient \(\cos\sqrt{-t}\). Les solutions développables en série entière forment une <strong>droite</strong>, dirigée par cette fonction \(\varphi\).</li>
      <li>Sur \(]0, +\infty[\), l'équation est résolue (diviser par \(4t\)) : il y a une seconde solution indépendante, \(\operatorname{sh}\sqrt t\), qui n'est pas développable en série entière en 0 (elle équivaut à \(\sqrt t\), non dérivable en 0). Les solutions sur \(]0, +\infty[\) sont les \(\lambda\operatorname{ch}\sqrt t + \mu\operatorname{sh}\sqrt t\).</li>
    </ol>
    <p>Le changement de variable \(t = u^2\) explique ce résultat : \(z(u) = y(u^2)\) vérifie \(z'' - z = 0\).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — le rayon n'est pas l'intervalle de vie</strong>
    <p>On cherche les solutions développables en série entière de \((1 + t^2)\,y'' + 4t\,y' + 2y = 0\).</p>
    <ol>
      <li>Le coefficient de \(t^n\) vaut \((n+2)(n+1)\,a_{n+2} + \big(n(n-1) + 4n + 2\big)\,a_n\), et \(n(n-1) + 4n + 2 = (n+1)(n+2)\). D'où \(a_{n+2} = -a_n\).</li>
      <li>Donc \(y = a_0(1 - t^2 + t^4 - \cdots) + a_1(t - t^3 + t^5 - \cdots)\), de rayon 1, de somme \(\dfrac{a_0 + a_1 t}{1 + t^2}\) sur \(]-1, 1[\).</li>
      <li>Or \(1 + t^2\) ne s'annule pas : l'équation est résolue sur \(\mathbb{R}\), dont les solutions forment un plan. Les fonctions \(\dfrac{1}{1+t^2}\) et \(\dfrac{t}{1+t^2}\) sont solutions sur \(\mathbb{R}\) tout entier (l'équation s'écrit \(\big((1+t^2)\,y\big)'' = 0\)) et ne sont pas proportionnelles : elles forment une base.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · UNE SOLUTION NE S'ANNULANT PAS EST CONNUE</div>
  <h2>Abaisser l'ordre avec y = z·y₁</h2>
  <div class="intro">Si l'on connaît une solution \(y_1\) de l'équation homogène qui ne s'annule pas sur \(I\) (solution évidente, solution donnée par l'énoncé, ou obtenue par une série entière), le changement d'inconnue \(y = z\,y_1\) transforme \((E)\) en une équation d'ordre 1 en \(z'\). C'est la seconde méthode de résolution explicite au programme.</div>
  <div class="prop-box">
    <strong>Abaissement de l'ordre.</strong> Soit \(y_1\) une solution de \((H)\) ne s'annulant pas sur \(I\). Toute fonction \(y\) deux fois dérivable s'écrit \(y = z\,y_1\) avec \(z = y/y_1\) deux fois dérivable, et
    <div class="formula" data-nom="Abaissement de l'ordre">$$\begin{aligned} &y \text{ solution de } (E) \\ \iff\ &y_1\,z'' + \big(2y_1' + a\,y_1\big)\,z' = c. \end{aligned}$$</div>
    C'est une équation linéaire d'ordre 1 en l'inconnue \(w = z'\), résolue après division par \(y_1\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le terme en z disparaît parce que y₁ est solution.</span>
    <div class="content">
      <p>Avec \(y = z\,y_1\) : \(y' = z'y_1 + z\,y_1'\) et \(y'' = z''y_1 + 2z'y_1' + z\,y_1''\). Donc</p>
      <div class="formula">$$\begin{aligned} y'' + a\,y' + b\,y = y_1\,z'' &+ \big(2y_1' + a\,y_1\big)\,z' \\ &+ \big(y_1'' + a\,y_1' + b\,y_1\big)\,z. \end{aligned}$$</div>
      <p>La dernière parenthèse est nulle puisque \(y_1\) est solution de \((H)\). Comme \(y_1\) ne s'annule pas, \(z = y/y_1\) est deux fois dérivable dès que \(y\) l'est : le changement d'inconnue ne perd aucune solution.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Méthode — abaisser l'ordre</strong>
    <ol>
      <li>Trouver \(y_1\) : essayer des polynômes de petit degré, des exponentielles \(\mathrm{e}^{mt}\), des puissances \(t^r\). Pour \(\alpha y'' + \beta y' + \gamma y = 0\) : si \(\alpha + \beta + \gamma = 0\), \(\mathrm{e}^t\) est solution ; si \(\beta + t\gamma = 0\), \(t\) est solution.</li>
      <li>Vérifier que \(y_1\) ne s'annule pas sur \(I\) (sinon, travailler sur des intervalles plus petits).</li>
      <li>Poser \(y = z\,y_1\), calculer, constater la disparition du terme en \(z\) (sinon, il y a une erreur de calcul).</li>
      <li>Résoudre l'équation d'ordre 1 vérifiée par \(w = z'\), primitiver pour obtenir \(z\) (deux constantes apparaissent), multiplier par \(y_1\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — résolution complète</strong>
    <p>Résoudre \(t^2y'' - t(t + 2)\,y' + (t + 2)\,y = t^3\) sur \(I = \,]0, +\infty[\).</p>
    <ol>
      <li><strong>Solution évidente.</strong> Ici \(\beta + t\gamma = -t(t+2) + t(t+2) = 0\) : \(y_1(t) = t\) est solution de l'équation homogène, et ne s'annule pas sur \(I\).</li>
      <li><strong>Changement d'inconnue</strong> \(y = t\,z\) : \(y' = z + t\,z'\), \(y'' = 2z' + t\,z''\). En reportant, les termes en \(z\) se compensent et il reste
        <div class="formula">$$\begin{aligned} &t^3 z'' + 2t^2 z' - t^2(t + 2)\,z' = t^3, \\ &\text{soit}\quad z'' - z' = 1. \end{aligned}$$</div></li>
      <li><strong>Ordre 1.</strong> \(w = z'\) vérifie \(w' - w = 1\) : \(w = \lambda\,\mathrm{e}^t - 1\).</li>
      <li><strong>Conclusion.</strong> \(z = \lambda\,\mathrm{e}^t - t + \mu\), d'où les solutions
        <div class="formula">$$y(t) = \lambda\,t\,\mathrm{e}^t + \mu\,t - t^2,\qquad (\lambda, \mu) \in \mathbb{R}^2.$$</div>
        On lit au passage une base \((t\,\mathrm{e}^t,\ t)\) des solutions homogènes et la solution particulière \(-t^2\).</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Quand la seconde solution n'est qu'une intégrale : \(y'' + t\,y' + y = 0\).</span>
    <div class="content">
      <p>\(y_1 = \mathrm{e}^{-t^2/2}\) est solution : \(y_1' = -t\,y_1\), \(y_1'' = (t^2 - 1)\,y_1\), et \((t^2 - 1) - t^2 + 1 = 0\). Elle ne s'annule pas sur \(\mathbb{R}\). Avec \(y = z\,y_1\), l'équation en \(w = z'\) est \(y_1 w' + (2y_1' + t\,y_1)\,w = 0\), soit \(w' - t\,w = 0\) : \(w = \lambda\,\mathrm{e}^{t^2/2}\). Les solutions sont donc</p>
      <div class="formula">$$y(t) = \mathrm{e}^{-t^2/2}\Big(\mu + \lambda\int_0^t \mathrm{e}^{s^2/2}\,\mathrm{d}s\Big).$$</div>
      <p>La primitive de \(\mathrm{e}^{s^2/2}\) ne s'exprime pas à l'aide des fonctions usuelles : le problème est néanmoins entièrement résolu. (On pouvait aussi remarquer que l'équation s'écrit \((y' + t\,y)' = 0\).)</p>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : utiliser une solution \(y_1\) qui s'annule sur \(I\). La division par \(y_1\) est alors illégitime ; on résout sur chaque intervalle où \(y_1\) ne s'annule pas, puis on recolle (§5).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · VARIATION DES CONSTANTES</div>
  <h2>Une solution particulière à partir d'une base</h2>
  <div class="intro">Dès qu'une base \((y_1, y_2)\) des solutions homogènes est connue, on obtient toujours une solution particulière de l'équation complète en faisant « varier » les deux constantes. Le programme ne cite pas cette méthode pour l'ordre 2 : à l'écrit, elle est toujours guidée. Elle est très utile en physique pour calculer la réponse d'un système à une excitation quelconque.</div>
  <div class="prop-box">
    <strong>Variation des constantes.</strong> Soit \((y_1, y_2)\) une base de \(\mathcal{S}_H\), de wronskien \(W\). Si \(\lambda_1\), \(\lambda_2\) sont des fonctions dérivables vérifiant
    <div class="formula">$$\begin{cases} \lambda_1'\,y_1 + \lambda_2'\,y_2 = 0 \\ \lambda_1'\,y_1' + \lambda_2'\,y_2' = c \end{cases}$$</div>
    alors \(y = \lambda_1 y_1 + \lambda_2 y_2\) est solution de \((E)\). Ce système a pour déterminant \(W(t) \neq 0\), et sa solution est
    <div class="formula" data-nom="Variation des constantes">$$\lambda_1' = -\frac{y_2\,c}{W},\qquad \lambda_2' = \frac{y_1\,c}{W}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La première équation simplifie y′, la seconde fournit c.</span>
    <div class="content">
      <p>Grâce à la première équation,</p>
      <div class="formula">$$y' = \lambda_1 y_1' + \lambda_2 y_2' + (\lambda_1' y_1 + \lambda_2' y_2) = \lambda_1 y_1' + \lambda_2 y_2'.$$</div>
      <p>Puis \(y'' = \lambda_1 y_1'' + \lambda_2 y_2'' + \lambda_1' y_1' + \lambda_2' y_2'\). Donc</p>
      <div class="formula">$$\begin{aligned} y'' + a\,y' + b\,y &= \lambda_1\,L(y_1) + \lambda_2\,L(y_2) + \big(\lambda_1' y_1' + \lambda_2' y_2'\big) \\ &= 0 + 0 + c. \end{aligned}$$</div>
      <p>Les formules de \(\lambda_1'\), \(\lambda_2'\) sont celles de Cramer pour un système 2 × 2 de déterminant \(W\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — un second membre hors catalogue</strong>
    <p>Résoudre \(y'' + y = \dfrac{1}{\sin t}\) sur \(]0, \pi[\).</p>
    <ol>
      <li>Base des solutions homogènes : \(y_1 = \cos\), \(y_2 = \sin\), de wronskien \(W = \cos^2 t + \sin^2 t = 1\).</li>
      <li>\(\lambda_1' = -\sin t \cdot \dfrac{1}{\sin t} = -1\) et \(\lambda_2' = \dfrac{\cos t}{\sin t}\) ; on choisit \(\lambda_1 = -t\) et \(\lambda_2 = \ln(\sin t)\), licite car \(\sin t \gt 0\) sur \(]0, \pi[\).</li>
      <li>Solutions :
        <div class="formula">$$\begin{aligned} y(t) = \lambda\cos t &+ \mu\sin t \\ &- t\cos t + \sin t\,\ln(\sin t). \end{aligned}$$</div></li>
    </ol>
  </div>
  <h3>Réponse d'un oscillateur à une excitation</h3>
  <div class="prop-box">
    <strong>Formule intégrale.</strong> Soit \(\omega \gt 0\) et \(c\) continue sur \(I\). La solution de \(y'' + \omega^2 y = c(t)\) telle que \(y(t_0) = y'(t_0) = 0\) est
    <div class="formula" data-nom="Réponse d'un oscillateur à une excitation">$$y(t) = \frac{1}{\omega}\int_{t_0}^{t} \sin\big(\omega(t - s)\big)\,c(s)\,\mathrm{d}s.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">C'est la variation des constantes, écrite d'un seul bloc.</span>
    <div class="content">
      <p>Avec \(y_1 = \cos(\omega t)\), \(y_2 = \sin(\omega t)\), on a \(W = \omega\). On choisit les primitives nulles en \(t_0\) :</p>
      <div class="formula">$$\begin{aligned} \lambda_1(t) &= -\frac{1}{\omega}\int_{t_0}^t \sin(\omega s)\,c(s)\,\mathrm{d}s, \\ \lambda_2(t) &= \frac{1}{\omega}\int_{t_0}^t \cos(\omega s)\,c(s)\,\mathrm{d}s. \end{aligned}$$</div>
      <p>Alors \(y = \lambda_1 y_1 + \lambda_2 y_2\), et la formule d'addition</p>
      <div class="formula">$$\begin{aligned} \sin(\omega t)\cos(\omega s) &- \cos(\omega t)\sin(\omega s) \\ &= \sin\big(\omega(t - s)\big) \end{aligned}$$</div>
      <p>donne l'expression annoncée. Enfin \(y(t_0) = 0\), et \(y'(t_0) = \lambda_1(t_0)y_1'(t_0) + \lambda_2(t_0)y_2'(t_0) = 0\) d'après le calcul de \(y'\) fait plus haut.</p>
    </div>
  </div>
  <p>Contrôle : pour une force constante \(c = 1\) et \(t_0 = 0\), on trouve \(y(t) = \dfrac{1 - \cos(\omega t)}{\omega^2}\), qui oscille autour de la nouvelle position d'équilibre \(1/\omega^2\). En physique et en SI, la fonction \(s \mapsto \frac{1}{\omega}\sin(\omega s)\) est la <strong>réponse impulsionnelle</strong> de l'oscillateur : la réponse à une excitation quelconque est la superposition des réponses aux impulsions successives.</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les formules à une équation non résolue. Pour \(\alpha(t)\,y'' + \beta(t)\,y' + \gamma(t)\,y = \delta(t)\), le second membre \(c\) du système est \(\delta/\alpha\), pas \(\delta\). Autre oubli fréquent : la condition \(\lambda_1' y_1 + \lambda_2' y_2 = 0\), sans laquelle \(y''\) fait apparaître les dérivées secondes de \(\lambda_1\) et \(\lambda_2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Systèmes différentiels linéaires, équations non linéaires</h2>
  <div class="intro">Rien de ce qui suit n'est exigible en mathématiques. Ces outils sont pourtant très utilisés en physique (circuits ou oscillateurs couplés, échanges thermiques, cinétique chimique) et en SI (représentation d'état des systèmes asservis). L'exercice du site sur les systèmes \(X' = AX\), signalé « hors programme » dans l'onglet Exercices, relève de ce paragraphe.</div>
  <h3>L'ordre 2 comme système d'ordre 1</h3>
  <p>En posant \(X = \begin{pmatrix} y \\ y' \end{pmatrix}\), l'équation \((E)\) équivaut au système \(X' = A(t)\,X + B(t)\) avec \(A(t) = \begin{pmatrix} 0 & 1 \\ -b(t) & -a(t) \end{pmatrix}\) et \(B(t) = \begin{pmatrix} 0 \\ c(t) \end{pmatrix}\). Le théorème de Cauchy se généralise : pour \(A\) et \(B\) continues sur \(I\) (matrices de taille \(n\)), le problème \(X' = A(t)X + B(t)\), \(X(t_0) = X_0\) a une unique solution sur \(I\), et les solutions du système homogène forment un espace de dimension \(n\). Notre théorème est le cas \(n = 2\). Lorsque \(a\), \(b\) sont constantes, le polynôme caractéristique de \(A\) est \(r^2 + ar + b\) : l'équation caractéristique de première année cherche les valeurs propres de \(A\).</p>
  <h3>Coefficients constants : la réduction</h3>
  <p>Pour \(X' = AX\) avec \(A \in \mathcal{M}_n(\mathbb{R})\) diagonalisable, \(A = PDP^{-1}\), l'inconnue \(Y = P^{-1}X\) vérifie \(Y' = DY\), système découplé. Si \(V_1, \ldots, V_n\) est une base de vecteurs propres associés à \(\lambda_1, \ldots, \lambda_n\) :</p>
  <div class="formula" data-nom="Système X′ = AX diagonalisable">$$X(t) = \sum_{i=1}^n c_i\,\mathrm{e}^{\lambda_i t}\,V_i,\qquad (c_1, \ldots, c_n) \in \mathbb{R}^n.$$</div>
  <p>Dans le cas général, \(X(t) = \mathrm{e}^{tA}X(0)\), où l'<strong>exponentielle de matrice</strong> est \(\mathrm{e}^{tA} = \sum_{k \geq 0} \frac{t^k}{k!}A^k\).</p>
  <div class="method-box">
    <strong>Exemple — deux corps qui échangent de la chaleur</strong>
    <p>Deux corps identiques, d'écarts de température \(x_1\), \(x_2\) à l'extérieur, échangent de la chaleur entre eux et avec l'extérieur : \(x_1' = -2x_1 + x_2\), \(x_2' = x_1 - 2x_2\).</p>
    <ol>
      <li>\(A = \begin{pmatrix} -2 & 1 \\ 1 & -2 \end{pmatrix}\) a pour valeurs propres \(-1\), de vecteur propre \((1, 1)\), et \(-3\), de vecteur propre \((1, -1)\).</li>
      <li>Solutions :
        <div class="formula">$$X(t) = c_1\,\mathrm{e}^{-t}\begin{pmatrix} 1 \\ 1 \end{pmatrix} + c_2\,\mathrm{e}^{-3t}\begin{pmatrix} 1 \\ -1 \end{pmatrix}.$$</div>
        L'écart \(x_1 - x_2\) entre les deux corps s'efface trois fois plus vite que leur écart moyen à l'extérieur.</li>
    </ol>
  </div>
  <h3>Équations non linéaires</h3>
  <p>Le pendule simple obéit à \(\theta'' + \frac{g}{\ell}\sin\theta = 0\), équation non linéaire. Le théorème de Cauchy-Lipschitz assure encore l'existence et l'unicité d'une solution de chaque problème de Cauchy, mais sur un intervalle qui peut être plus petit que celui où l'équation a un sens. Ainsi \(y' = y^2\), \(y(0) = 1\) a pour solution \(y(t) = \frac{1}{1 - t}\), qui n'existe que sur \(]-\infty, 1[\) et « explose » en \(t = 1\), alors que la fonction \(y \mapsto y^2\) est parfaitement régulière : un tel phénomène est impossible pour une équation linéaire. Pour de petites oscillations, on <strong>linéarise</strong> : \(\sin\theta \approx \theta\) redonne l'oscillateur harmonique.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="ed2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉQUATIONS DIFFÉRENTIELLES D'ORDRE 2</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes organisent l'étude d'une équation \(y'' + a(t)\,y' + b(t)\,y = c(t)\) à coefficients variables : choisir l'intervalle, exploiter le théorème de Cauchy, décrire l'ensemble des solutions, puis le résoudre explicitement avec une solution évidente, une série entière, l'abaissement de l'ordre ou une méthode guidée par l'énoncé.</div>

  <div class="method-box"><strong>Méthode 1 — Mettre l'équation sous forme résolue et appliquer le théorème de Cauchy</strong>
    <ol>
      <li>Écrire l'équation sous la forme \(\alpha(t)\,y'' + \beta(t)\,y' + \gamma(t)\,y = \delta(t)\) et repérer les zéros de \(\alpha\).</li>
      <li>Sur chaque intervalle \(I\) où \(\alpha\) ne s'annule pas, diviser par \(\alpha\) : on obtient \((E)\) \(y'' + a\,y' + b\,y = c\) avec \(a = \beta/\alpha\), \(b = \gamma/\alpha\), \(c = \delta/\alpha\) continues sur \(I\).</li>
      <li>Conclure : pour tout \(t_0 \in I\) et tout \((y_0, y_1)\), il existe une unique solution sur \(I\) tout entier telle que \(y(t_0) = y_0\) et \(y'(t_0) = y_1\) ; l'ensemble des solutions de l'équation homogène sur \(I\) est un plan vectoriel.</li>
      <li>Ne pas oublier que \(I\) doit être un <strong>intervalle</strong> : sur une réunion d'intervalles, on raisonne morceau par morceau.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(t\,y'' + (1 - t)\,y' + y = \cos t\), le coefficient de \(y''\) s'annule en 0. Le théorème s'applique sur \(]0, +\infty[\) et sur \(]-\infty, 0[\) : il existe une unique solution sur \(]0, +\infty[\) telle que \(y(1) = 0\) et \(y'(1) = 2\). Il ne dit rien sur \(\mathbb{R}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un problème aux limites (une condition en \(t_0\), une autre en \(t_1 \neq t_0\)) n'est pas un problème de Cauchy. Il peut n'avoir aucune solution ou en avoir une infinité.</div>

  <div class="method-box"><strong>Méthode 2 — Exploiter l'unicité de Cauchy</strong>
    <ol>
      <li>Fabriquer à partir d'une solution \(y\) une autre fonction \(z\) : \(z(t) = y(-t)\), \(z(t) = -y(-t)\), \(z(t) = y(t + T)\), \(z = \lambda y_1 + \mu y_2\)…</li>
      <li>Vérifier que \(z\) est solution de la <strong>même</strong> équation (c'est là qu'interviennent la parité ou la périodicité des coefficients).</li>
      <li>Comparer les conditions initiales de \(y\) et de \(z\) en un même point \(t_0\).</li>
      <li>Si elles coïncident, conclure \(z = y\) sur \(I\) : parité, imparité, périodicité, ou égalité de deux solutions.</li>
    </ol>
    <p><em>Exemple éclair :</em> les coefficients de \(y'' + (2 + \cos t)\,y = 0\) sont \(2\pi\)-périodiques, donc \(z(t) = y(t + 2\pi)\) est solution dès que \(y\) l'est. Si \(y(2\pi) = y(0)\) et \(y'(2\pi) = y'(0)\), alors \(z\) et \(y\) ont les mêmes conditions initiales en 0 : \(z = y\), et \(y\) est \(2\pi\)-périodique.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Décrire l'ensemble des solutions à partir d'une base</strong>
    <ol>
      <li>Vérifier que \(y_1\) et \(y_2\) sont solutions de l'équation homogène \((H)\) sur l'intervalle \(I\).</li>
      <li>Montrer qu'elles ne sont pas proportionnelles : il suffit que leur wronskien \(W = y_1 y_2' - y_1' y_2\) soit non nul <strong>en un point</strong> de \(I\). Comme l'espace des solutions est de dimension 2, \((y_1, y_2)\) en est une base.</li>
      <li>Trouver une solution particulière \(y_p\) de \((E)\) (évidente, donnée, ou par superposition si le second membre est une somme).</li>
      <li>Conclure : les solutions de \((E)\) sur \(I\) sont les \(y_p + \lambda\,y_1 + \mu\,y_2\), \((\lambda, \mu) \in \mathbb{K}^2\) ; les constantes se fixent avec les conditions initiales.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \(]0, +\infty[\), \(t^2 y'' - 3t\,y' + 4y = 0\) admet \(t^2\) et \(t^2\ln t\) pour solutions, de wronskien \(W(t) = t^3 \neq 0\). La constante 1 est solution évidente avec le second membre 4 : les solutions de \(t^2 y'' - 3t\,y' + 4y = 4\) sur \(]0, +\infty[\) sont les \(1 + \lambda t^2 + \mu t^2\ln t\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la propriété « \(W\) nul partout ou nulle part » ne vaut que pour deux solutions d'une même équation résolue à coefficients continus sur un intervalle. Pour deux fonctions quelconques, un wronskien qui s'annule ne prouve rien.</div>

  <div class="method-box"><strong>Méthode 4 — Chercher une solution évidente</strong>
    <ol>
      <li>Pour \(\alpha y'' + \beta y' + \gamma y = 0\), faire les tests rapides : \(\alpha + \beta + \gamma = 0\) donne la solution \(\mathrm{e}^t\) ; \(\alpha - \beta + \gamma = 0\) donne \(\mathrm{e}^{-t}\) ; \(\beta + t\gamma = 0\) donne \(t\).</li>
      <li>Essayer un polynôme \(P\) de degré \(n\) : le terme de plus haut degré de \(\alpha P'' + \beta P' + \gamma P\) fixe souvent \(n\), puis on identifie les coefficients.</li>
      <li>Pour une équation d'Euler \(t^2 y'' + p\,t\,y' + q\,y = 0\), essayer \(t^r\) sur \(]0, +\infty[\) : \(r\) est racine de \(r(r - 1) + p\,r + q = 0\).</li>
      <li>Si l'énoncé propose une forme (\(\mathrm{e}^{mt}\), \(t^r\), \(\mathrm{e}^{t^2}\)…), reporter et identifier.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \((t + 1)\,y'' - (t + 2)\,y' + y = 0\), \(\alpha + \beta + \gamma = 0\), donc \(\mathrm{e}^t\) est solution. Avec \(y = at + b\), il reste \(-2a + b = 0\) : \(t + 2\) est aussi solution. Leur wronskien vaut \(-(t + 1)\,\mathrm{e}^t\) : base sur \(]-1, +\infty[\) et sur \(]-\infty, -1[\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Chercher les solutions développables en série entière</strong>
    <ol>
      <li><strong>Analyse.</strong> Supposer \(y(t) = \sum a_n t^n\) de rayon \(R \gt 0\), solution sur \(]-R, R[\) ; dériver terme à terme.</li>
      <li>Reporter, distribuer les coefficients polynomiaux, puis réindexer chaque somme pour faire apparaître la même puissance \(t^n\) ; traiter à part les premiers indices.</li>
      <li>Par unicité des coefficients d'une série entière, annuler le coefficient de chaque \(t^n\) : relation de récurrence (souvent séparée entre indices pairs et impairs).</li>
      <li>Résoudre la récurrence et calculer le rayon (règle de d'Alembert sur les termes non nuls).</li>
      <li><strong>Synthèse.</strong> Si le rayon est non nul, la somme est bien solution sur \(]-R, R[\) ; la reconnaître si possible (exponentielle, \(\operatorname{ch}\), \((1 + u)^\alpha\)…).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(y'' - 2t\,y' - 2y = 0\), le coefficient de \(t^n\) donne \((n + 2)(n + 1)\,a_{n+2} = 2(n + 1)\,a_n\), soit \(a_{n+2} = \dfrac{2\,a_n}{n + 2}\). Avec \(a_0 = 1\), \(a_1 = 0\) : \(a_{2k} = \dfrac{1}{k!}\), d'où la solution \(\mathrm{e}^{t^2}\), de rayon infini.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : sans calcul du rayon, l'analyse ne prouve rien (une série de rayon nul ne définit aucune fonction). Et le rayon peut être plus petit que l'intervalle où vit la solution : la série ne décrit la solution que sur \(]-R, R[\).</div>

  <div class="method-box"><strong>Méthode 6 — Abaisser l'ordre avec une solution qui ne s'annule pas</strong>
    <ol>
      <li>Disposer d'une solution \(y_1\) de \((H)\) et d'un intervalle \(I\) où elle <strong>ne s'annule pas</strong>.</li>
      <li>Poser \(y = z\,y_1\) ; calculer \(y'\) et \(y''\), reporter : le terme en \(z\) disparaît (sinon, chercher l'erreur de calcul). On obtient \(y_1\,z'' + (2y_1' + a\,y_1)\,z' = c\).</li>
      <li>Résoudre cette équation linéaire d'ordre 1 en \(w = z'\) (primitive de \(a\), variation de la constante).</li>
      <li>Primitiver \(w\) pour obtenir \(z\) (deux constantes), puis multiplier par \(y_1\). On lit au passage une base de \(\mathcal{S}_H\) et une solution particulière.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(t\,y'' - (2t + 1)\,y' + (t + 1)\,y = 0\) sur \(]0, +\infty[\), \(\alpha + \beta + \gamma = 0\) donne \(y_1 = \mathrm{e}^t\), qui ne s'annule pas. Avec \(y = z\,\mathrm{e}^t\), il reste \(t\,z'' - z' = 0\), donc \(z' = Ct\) et \(z = \lambda t^2 + \mu\) : les solutions sont les \((\lambda t^2 + \mu)\,\mathrm{e}^t\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : si \(y_1\) s'annule sur \(I\), la division par \(y_1\) est illégitime. On résout sur chaque intervalle où \(y_1\) ne s'annule pas, puis on recolle (méthode 8).</div>

  <div class="method-box"><strong>Méthode 7 — Appliquer la variation des constantes (méthode guidée)</strong>
    <ol>
      <li>Partir d'une base \((y_1, y_2)\) de \(\mathcal{S}_H\) et de son wronskien \(W\), sur une équation <strong>résolue</strong> (diviser d'abord par le coefficient de \(y''\)).</li>
      <li>Chercher \(y = \lambda_1 y_1 + \lambda_2 y_2\) avec \(\lambda_1' y_1 + \lambda_2' y_2 = 0\) et \(\lambda_1' y_1' + \lambda_2' y_2' = c\).</li>
      <li>Résoudre ce système de déterminant \(W\) (Cramer) : \(\lambda_1' = -\dfrac{y_2\,c}{W}\), \(\lambda_2' = \dfrac{y_1\,c}{W}\).</li>
      <li>Primitiver (une primitive suffit pour une solution particulière), puis ajouter la solution générale de \((H)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(y'' - y = \mathrm{e}^t\), avec \(y_1 = \mathrm{e}^t\), \(y_2 = \mathrm{e}^{-t}\), \(W = -2\) : \(\lambda_1' = \frac12\) et \(\lambda_2' = -\frac12\mathrm{e}^{2t}\). On prend \(\lambda_1 = \frac{t}{2}\), \(\lambda_2 = -\frac14\mathrm{e}^{2t}\), d'où \(y_p = \frac{t}{2}\mathrm{e}^t - \frac14\mathrm{e}^t\) ; on peut garder \(\frac{t}{2}\mathrm{e}^t\), l'autre terme étant solution de \((H)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Résoudre sur \(\mathbb{R}\) quand le coefficient de \(y''\) s'annule</strong>
    <ol>
      <li>Résoudre sur chaque intervalle ouvert délimité par les zéros de \(\alpha\) (deux constantes par intervalle).</li>
      <li>Écrire une solution sur \(\mathbb{R}\) par morceaux, puis imposer en chaque zéro \(t_0\) de \(\alpha\) : continuité, dérivabilité, double dérivabilité (limites à gauche et à droite, taux d'accroissement ou théorème de la limite de la dérivée), et l'équation au point \(t_0\).</li>
      <li>Compter les constantes restées libres : c'est la dimension de l'espace des solutions homogènes sur \(\mathbb{R}\) (de 0 à 4).</li>
      <li>En déduire, si on le demande, les problèmes de Cauchy en \(t_0\) qui ont une solution, aucune, ou une infinité.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(t^2 y'' - 6y = 0\) a pour solutions \(a\,t^3 + b\,t^{-2}\) sur chaque demi-droite. La continuité en 0 impose \(b = 0\) des deux côtés ; ensuite \(y = a_1 t^3\) à gauche, \(a_2 t^3\) à droite est de classe \(C^2\) pour tous \(a_1\), \(a_2\) : sur \(\mathbb{R}\), dimension 2, base \((t^3, |t|^3)\), mais toujours \(y(0) = y'(0) = 0\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Effectuer un changement de variable ou d'inconnue indiqué</strong>
    <ol>
      <li>Poser la nouvelle fonction proposée : \(z(x) = y(\mathrm{e}^x)\) pour une équation d'Euler sur \(]0, +\infty[\), \(z(u) = y(u^2)\), \(z = t\,y\), \(u = y'\) quand \(y\) n'apparaît pas…</li>
      <li>Exprimer \(y'\) et \(y''\) en fonction de \(z\) et de ses dérivées par la dérivation des fonctions composées. Pour \(t = \mathrm{e}^x\) : \(t\,y'(t) = z'(x)\) et \(t^2 y''(t) = z''(x) - z'(x)\).</li>
      <li>Reporter : on obtient en général une équation à coefficients constants, ou d'ordre 1.</li>
      <li>La résoudre, puis revenir à la variable de départ, en vérifiant que le changement est une bijection de l'intervalle étudié.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(t^2 y'' + t\,y' + y = 0\) sur \(]0, +\infty[\), \(z(x) = y(\mathrm{e}^x)\) vérifie \(z'' + z = 0\). Donc \(z = \lambda\cos x + \mu\sin x\) et \(y(t) = \lambda\cos(\ln t) + \mu\sin(\ln t)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire une « équation caractéristique » \(r^2 + a\,r + b = 0\) alors que \(a\) ou \(b\) dépend de \(t\). Elle n'a de sens que pour des coefficients constants (après un éventuel changement de variable).</div>
</div>
