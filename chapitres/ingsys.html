  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre ouvre presque tous les sujets de sciences industrielles : avant de calculer quoi que ce soit, on situe le système, son besoin, ses exigences et son architecture. Il couvre les compétences A1 « analyser le besoin et les exigences » (semestre S1), A2 « définir les frontières de l'analyse » (S2) et A3 « analyser l'organisation fonctionnelle et structurelle » (S1), et introduit la comparaison des performances attendues, simulées et mesurées. Les diagrammes SysML sont fournis par l'énoncé : on les <strong>lit</strong> et on les <strong>complète</strong>, on ne les écrit pas de zéro. Le fil rouge est un robot de tonte inventé pour l'occasion, mais réaliste.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Décrire le besoin et les exigences</strong> : ingénierie système et diagrammes associés, cahier des charges (A1, S1) (§1, §3).</li>
        <li><strong>Isoler un système et justifier l'isolement</strong>, <strong>définir les éléments influents du milieu extérieur</strong> : frontière de l'étude, milieu extérieur (A2, S2) ; <strong>identifier la nature des flux</strong> de matière, d'énergie et d'information traversant la frontière d'étude (définition, nature et codage) (A2, S2) (§2).</li>
        <li><strong>Traduire un besoin fonctionnel en exigences</strong> ; <strong>qualifier et quantifier les exigences</strong> : critères et niveaux (A1, S1) (§3, §4).</li>
        <li><strong>Définir les critères technico-économiques et environnementaux</strong> ; <strong>évaluer l'impact environnemental et sociétal</strong> : analyse du cycle de vie (extraction, fabrication, utilisation, fin de vie, recyclage et transport) (A1, S1) (§5).</li>
        <li><strong>Associer les fonctions aux constituants</strong> : architecture fonctionnelle et structurelle, diagramme de définition de blocs, diagramme de blocs internes, à lire ou à compléter (A3, S1) (§6, §7).</li>
        <li><strong>Identifier et décrire les chaînes fonctionnelles</strong> : fonctions acquérir, traiter et communiquer ; alimenter, moduler, convertir, transmettre et agir (A3, S1) (§8).</li>
        <li><strong>Identifier et décrire les liens entre les chaînes fonctionnelles</strong> : systèmes asservis et séquentiels (A3, S1) (§9). La structure d'un système asservi est détaillée dans <a href="#schblocs/cours">« Schéma-blocs et systèmes asservis »</a>, le diagramme d'états (A3, S2) dans <a href="#sequentiel/cours">« Systèmes séquentiels »</a>.</li>
        <li><strong>Vérifier la cohérence du modèle</strong> en confrontant les résultats analytiques ou numériques aux résultats expérimentaux : critères de performances (B3, S2) (§10). Extraire un indicateur de performance, caractériser les écarts et en rechercher les causes (A4) est exigible en fin de 2ᵉ année (S4) ; la démarche est introduite ici.</li>
      </ul>
      <p>La syntaxe d'un langage d'ingénierie système n'est pas exigible : la structure des diagrammes SysML est fournie, et leur écriture se limite à la complétion et à la modification. Hors programme, regroupés en fin de chapitre : diagrammes de séquence, d'activité et paramétrique, outils de l'ancienne analyse fonctionnelle (bête à cornes, diagramme pieuvre, FAST), analyse de cycle de vie normalisée. Relèvent de la 2ᵉ année : le choix et le dimensionnement des constituants et l'écoconception d'une architecture (<a href="#chfonc/cours">« Chaînes fonctionnelles : choisir et dimensionner les composants »</a>), la modélisation multiphysique et le recalage d'un modèle (<a href="#multiphy/cours">« Modélisation multiphysique »</a>).</p>

<div class="course-section">
  <div class="sec-num">§1 · SYSTÈME, BESOIN ET INGÉNIERIE SYSTÈME</div>
  <h2>Du besoin au produit</h2>
  <div class="intro">Un produit industriel naît d'un besoin, pas d'une technologie. L'ingénierie système organise le passage du besoin au produit vérifié en gardant, à chaque étape, la trace des choix faits. SysML est le langage graphique qui porte cette trace.</div>

  <h3>Système, besoin, matière d'œuvre</h3>
  <div class="def-box">
    <p><strong>Système</strong> : ensemble organisé de constituants en interaction, conçu pour rendre un service à un utilisateur dans un environnement donné.</p>
    <p><strong>Besoin</strong> : nécessité ou désir d'un utilisateur, exprimé <em>sans référence à une solution</em> : « garder ma pelouse courte sans y passer mes week-ends », et non « je veux un robot ».</p>
    <p><strong>Matière d'œuvre</strong> : ce sur quoi le système agit (une matière, de l'énergie ou de l'information). <strong>Valeur ajoutée</strong> : différence entre l'état de la matière d'œuvre en sortie et son état en entrée.</p>
  </div>
  <p>Pour le robot de tonte, la matière d'œuvre est la pelouse : elle entre à 40 mm de hauteur et ressort à 30 mm, les brins coupés très court restant sur place comme engrais (paillage, ou <em>mulching</em>). La valeur ajoutée est une pelouse tenue à hauteur constante sans intervention humaine.</p>
  <p>Pour énoncer un besoin, on répond à trois questions : <strong>à qui</strong> le produit rend-il service (au propriétaire du jardin), <strong>sur quoi</strong> agit-il (sur la pelouse), <strong>dans quel but</strong> (la garder courte et régulière sans effort) ? On se demande ensuite pourquoi ce besoin existe et ce qui pourrait le faire disparaître : manque de temps, goût pour un gazon ras… mais une prairie fleurie fauchée deux fois par an, plus favorable à la biodiversité, supprimerait le besoin. C'est la <strong>validation du besoin</strong> : un produit parfait qui répond à un besoin mal posé est un échec.</p>

  <h3>La démarche d'ingénierie système</h3>
  <ol>
    <li><strong>Analyser le besoin et le contexte</strong> : utilisateurs, lieux, moments d'utilisation, contraintes (réglementation, sécurité, environnement).</li>
    <li><strong>Écrire les exigences</strong>, chiffrées et vérifiables (§3, §4, §5).</li>
    <li><strong>Définir l'architecture fonctionnelle</strong> (ce que le système doit faire), puis l'<strong>architecture structurelle</strong> (avec quels constituants) (§6 à §8).</li>
    <li><strong>Réaliser</strong> les constituants et les intégrer.</li>
    <li><strong>Vérifier</strong> que le produit satisfait ses exigences et <strong>valider</strong> qu'il répond au besoin, par des essais et des simulations (§10).</li>
  </ol>
  <p>Ces étapes se représentent souvent par un « cycle en V » : la branche descendante va du besoin aux constituants, la branche montante de l'intégration aux essais, et chaque niveau de conception est vérifié au même niveau de la branche montante.</p>
  <div class="prop-box">
    <strong>Vérifier n'est pas valider.</strong> <em>Vérifier</em>, c'est contrôler que le produit est conforme à ses exigences : a-t-on bien fait le produit ? <em>Valider</em>, c'est contrôler qu'il répond au besoin : a-t-on fait le bon produit ? Un robot peut tenir toutes ses exigences et décevoir, si une exigence a été oubliée (tondre au ras des bordures, par exemple).
  </div>

  <h3>Un modèle, plusieurs vues : SysML</h3>
  <p><strong>SysML</strong> (<em>Systems Modeling Language</em>) est un langage graphique normalisé, dérivé d'UML, qui décrit un système par un <strong>modèle unique</strong> vu sous plusieurs angles. Chaque diagramme répond à une question ; ils partagent les mêmes éléments (un bloc du diagramme de définition de blocs est celui qui satisfait une exigence et qui apparaît dans le diagramme de blocs internes).</p>
  <div>
  <table>
    <tr><th>Diagramme</th><th>Question</th><th>Section</th></tr>
    <tr><td>cas d'utilisation (uc)</td><td>À quoi sert le système, et pour qui ?</td><td>§3</td></tr>
    <tr><td>exigences (req)</td><td>Que doit-il garantir, à quel niveau ?</td><td>§4</td></tr>
    <tr><td>définition de blocs (bdd)</td><td>De quoi est-il fait ?</td><td>§6</td></tr>
    <tr><td>blocs internes (ibd)</td><td>Comment ses constituants sont-ils reliés, quels flux échangent-ils ?</td><td>§7</td></tr>
    <tr><td>états (stm)</td><td>Comment se comporte-t-il au cours du temps ?</td><td>§9</td></tr>
  </table>
  </div>
  <div class="notice"><strong>Au concours</strong>, l'énoncé fournit les diagrammes et, si besoin, la signification de leurs symboles : il faut savoir y trouver vite l'information utile (noms des blocs, valeurs chiffrées, multiplicités, relations) et compléter ce qui manque. Personne ne demande de redessiner un diagramme entier.</div>

  <div class="method-box"><strong>Exemple — Traduire le besoin en premières grandeurs chiffrées</strong>
    <p>Le jardin fait 800 m² ; au printemps, l'herbe pousse d'environ 2 mm par jour et l'utilisateur veut la garder entre 30 et 40 mm. Le robot coupe une bande de 22 cm en avançant à 0,30 m/s ; sa trajectoire aléatoire repasse souvent aux mêmes endroits, si bien que la moitié seulement de la surface balayée est « neuve » (efficacité de couverture de 50 %).</p>
    <ol>
      <li><strong>Débit de tonte effectif</strong> : \(0{,}22 \times 0{,}30 \times 0{,}5 = 0{,}033\ \text{m}^2/\text{s}\), soit environ 119 m² par heure.</li>
      <li><strong>Rythme</strong> : 10 mm de pousse tolérée à 2 mm par jour, donc tout le terrain doit être repassé tous les 5 jours, soit 1,4 fois par semaine.</li>
      <li><strong>Temps de tonte</strong> : \(800 \times 1{,}4 / 119 \approx 9{,}4\ \text{h}\) par semaine.</li>
      <li><strong>Conclusion</strong> : avec une heure d'autonomie et un peu plus d'une heure de recharge, le robot fonctionne environ 20 h par semaine, ce qui tient largement dans une plage de 8 h à 20 h (84 h par semaine). Le besoin a fait apparaître les grandeurs qui deviendront des exigences : surface, hauteur, autonomie, temps de recharge.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : formuler le besoin avec une solution (« il faut un robot muni d'une batterie de 54 W·h »). On s'interdit alors d'emblée d'autres réponses : tondeuse partagée entre voisins, tonte moins fréquente, autre couvert végétal. Le besoin et les exigences disent <em>quoi</em> ; l'architecture dit <em>comment</em>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · FRONTIÈRE D'ÉTUDE, MILIEU EXTÉRIEUR ET FLUX</div>
  <h2>Isoler le système et inventorier ce qui le traverse</h2>
  <div class="intro">Avant toute étude, on dit ce qui est dedans et ce qui est dehors. Ce choix fixe la liste des flux à décrire, exactement comme l'isolement d'un solide fixe, en statique, la liste des actions mécaniques à écrire.</div>
  <div class="def-box">
    <p><strong>Frontière de l'étude</strong> : limite qui sépare le système étudié de son milieu extérieur ; elle dépend de la question posée.</p>
    <p><strong>Milieu extérieur</strong> : tout ce qui n'est pas à l'intérieur de la frontière : utilisateurs, autres systèmes, environnement physique (sol, air, météo).</p>
    <p><strong>Élément influent</strong> : élément du milieu extérieur qui agit sur le fonctionnement ou sur les performances (pente du sol, température, humidité de l'herbe), même s'il n'échange pas de flux propre au service rendu.</p>
    <p><strong>Flux</strong> : ce qui traverse la frontière : de la <strong>matière</strong>, de l'<strong>énergie</strong> ou de l'<strong>information</strong>.</p>
  </div>

  <h3>Isoler, et justifier l'isolement</h3>
  <p>La frontière n'est pas imposée par l'objet : elle est choisie pour répondre à une question.</p>
  <ul>
    <li>Pour étudier l'<strong>autonomie</strong>, on isole le robot : la station de charge est extérieure, elle lui fournit un flux d'énergie.</li>
    <li>Pour chiffrer la <strong>consommation électrique annuelle</strong> du produit vendu, on isole le robot <em>et</em> sa station : la station, branchée en permanence, consomme en veille (§5), ce qu'une frontière autour du seul robot ne verrait pas.</li>
    <li>Pour <strong>dimensionner la batterie</strong>, on peut isoler la seule chaîne de puissance (§8).</li>
  </ul>
  <p>Justifier l'isolement, c'est dire quelle question on se pose et vérifier que tous les flux et tous les éléments influents utiles à cette question ont été recensés.</p>

  <h3>Nature des flux</h3>
  <div>
  <table>
    <tr><th>Flux</th><th>Nature</th><th>Exemples pour le robot</th></tr>
    <tr><td>Matière</td><td>solides, liquides, gaz, objets, personnes transportées</td><td>herbe coupée (matière d'œuvre), débris</td></tr>
    <tr><td>Énergie</td><td>électrique, mécanique (translation ou rotation), hydraulique, pneumatique, thermique, rayonnante, acoustique</td><td>charge sous 20 V et 2,5 A ; bruit émis</td></tr>
    <tr><td>Information</td><td>logique (tout ou rien), analogique, numérique</td><td>soulèvement (logique), tension de la batterie (analogique), trame radio (numérique)</td></tr>
  </table>
  </div>
  <p>Un flux d'énergie se caractérise par sa <strong>puissance</strong>, produit d'une grandeur « effort » par une grandeur « flux » :</p>
  <div class="formula" data-nom="Puissance d'un flux d'énergie">$$P = U\,I \qquad P = F\,v \qquad P = C\,\omega \qquad P = p\,Q_v$$</div>
  <p>(tension et intensité ; force et vitesse ; couple et vitesse angulaire ; pression et débit volumique). Un flux d'information porte une puissance négligeable : seule sa <em>valeur</em> compte.</p>

  <h3>Codage de l'information</h3>
  <p>Une information numérique est codée en binaire : \(n\) bits distinguent \(2^n\) valeurs. Codes usuels : le <strong>binaire naturel</strong> (pour compter) ; l'<strong>hexadécimal</strong>, qui écrit 4 bits en un seul symbole (1101 s'écrit D) ; le <strong>code de Gray</strong>, dans lequel deux valeurs voisines ne diffèrent que d'un bit (codeurs absolus : <a href="#capteurs/cours">« Capteurs et chaîne de mesure »</a>, §5) ; le code ASCII pour les caractères. La nature des signaux (logique, analogique, numérique) est détaillée dans « Capteurs et chaîne de mesure » (§2), les trames dans <a href="#reseaux/cours">« Réseaux de communication »</a> (§6).</p>
  <div class="prop-box">
    <strong>Nombre de bits.</strong> Pour coder \(N\) valeurs distinctes, il faut \(n\) bits avec \(2^{n-1} \lt N \le 2^n\) :
    <div class="formula" data-nom="Nombre de bits pour N valeurs">$$n = \left\lceil \log_2 N \right\rceil$$</div>
  </div>
  <div class="method-box"><strong>Exemple — Les flux du robot à sa frontière</strong>
    <ol>
      <li><strong>Énergie reçue</strong> : la station délivre 2,5 A sous 20 V, soit 50 W. Pour remettre les 48,6 W·h utilisables de la batterie avec un rendement de charge de 0,9 : \(48{,}6 / (50 \times 0{,}9) \approx 1{,}08\ \text{h}\), environ 65 min.</li>
      <li><strong>Réglage de hauteur</strong> : de 20 à 60 mm par pas de 5 mm, soit 9 positions ; \(2^3 = 8 \lt 9 \le 16 = 2^4\) : il faut 4 bits.</li>
      <li><strong>Code PIN</strong> à 4 chiffres : \(10^4 = 10\,000\) combinaisons ; \(2^{13} = 8192 \lt 10\,000 \le 16\,384 = 2^{14}\) : 14 bits.</li>
      <li><strong>Matière</strong> : l'herbe entre dans la zone de coupe à 40 mm et en ressort à 30 mm ; les brins coupés restent sur la pelouse.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre un flux et son support. Les 3,3 V d'une entrée logique transportent une <em>information</em> (seule compte la valeur 0 ou 1), pas une énergie utile ; les 18 V qui alimentent un moteur sont un flux d'<em>énergie</em>, même s'ils sont « commandés ». Autre erreur : oublier un élément influent (pente, température) et s'étonner ensuite des écarts entre prévision et mesure (§10).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CAS D'UTILISATION</div>
  <h2>Lire un diagramme de cas d'utilisation (uc)</h2>
  <div class="intro">Le diagramme de cas d'utilisation répond à la question « à quoi sert le système, et pour qui ? ». Il décrit les services vus de l'extérieur, sans rien dire de la manière dont ils sont rendus.</div>
  <div class="def-box">
    <p><strong>Acteur</strong> : entité extérieure au système qui interagit avec lui : une personne (utilisateur, technicien) ou un autre système (station de charge, serveur). Il est dessiné par un bonhomme ou par un bloc marqué «actor».</p>
    <p><strong>Cas d'utilisation</strong> : service rendu par le système à un acteur, nommé par un verbe à l'infinitif (« Tondre la pelouse ») et dessiné par une ellipse à l'intérieur du rectangle qui représente le système (le <strong>sujet</strong>).</p>
    <p><strong>Association</strong> : trait entre un acteur et un cas auquel il participe. L'acteur <strong>principal</strong> déclenche le cas et en tire le service ; un acteur <strong>secondaire</strong> est sollicité par le système pour le rendre.</p>
  </div>

</figure>

  <h3>Relations entre cas</h3>
  <ul>
    <li><strong>«include»</strong> (inclusion) : le cas de base contient <em>toujours</em> le cas inclus ; la flèche va du cas de base vers le cas inclus. Recharger la batterie impose toujours de retourner à la station. L'inclusion sert aussi à mettre en commun un comportement partagé par plusieurs cas.</li>
    <li><strong>«extend»</strong> (extension) : le cas d'extension s'ajoute au cas de base <em>dans certaines conditions seulement</em> ; la flèche va de l'extension vers la base. L'alarme ne se déclenche que si le robot est soulevé pendant la tonte sans que le code ait été saisi.</li>
  </ul>
  <p>Le diagramme ne donne ni l'ordre chronologique des échanges (c'est le rôle du diagramme de séquence, hors programme), ni les niveaux de performance, ni les solutions. Chaque cas se traduit ensuite en exigences chiffrées (§4), et un cas peut <strong>raffiner</strong> une exigence (relation «refine»).</p>

  <div class="method-box"><strong>Exemple — Un cas inclus impose une exigence chiffrée</strong>
    <p>« Recharger la batterie » inclut « Retourner à la station » : pour rentrer, le robot suit le fil périphérique enterré au bord de la pelouse. Le jardin est un rectangle de 20 m sur 40 m.</p>
    <ol>
      <li><strong>Pire cas</strong> : le robot rejoint le fil juste après la station dans son sens de suivi et doit en faire tout le tour : \(2 \times (20 + 40) = 120\ \text{m}\).</li>
      <li><strong>Durée</strong> : \(120 / 0{,}30 = 400\ \text{s}\), soit 6,7 min.</li>
      <li><strong>Énergie</strong> : lame arrêtée, le robot consomme environ 18 W (roues et électronique) : \(18 \times 400 / 3600 = 2{,}0\ \text{W·h}\).</li>
      <li><strong>Conséquence</strong> : le seuil « batterie faible » qui déclenche le retour doit laisser au moins 2 W·h en réserve, plus une marge. C'est une exigence dérivée, que l'on retrouve au §4.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : placer dans le rectangle du sujet un élément extérieur (la station de charge est un acteur, pas un cas ni une partie du robot), ou nommer un cas par un constituant (« Moteur de lame ») au lieu d'un service (« Tondre la pelouse »). Autre piège : inverser le sens des flèches, «include» va de la base vers l'inclus, «extend» de l'extension vers la base.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · EXIGENCES</div>
  <h2>Traduire le besoin en exigences qualifiées et quantifiées</h2>
  <div class="intro">Une exigence est une phrase du cahier des charges qui peut être vérifiée. Les rassembler, les chiffrer et les relier entre elles et aux solutions est le cœur de l'ingénierie système : c'est ce que montre le diagramme des exigences.</div>
  <div class="def-box">
    <p><strong>Exigence</strong> : propriété ou service que le système doit garantir, repérée par un identifiant (id) et énoncée par un texte.</p>
    <p><strong>Exigence fonctionnelle</strong> : ce que le système doit faire (tondre, se recharger, alerter). <strong>Exigence non fonctionnelle</strong> : comment, combien, dans quelles limites : performance (autonomie, surface), contraintes d'environnement, de sécurité, de normes, d'interface, de coût, d'impact environnemental.</p>
    <p><strong>Critère</strong> : grandeur qui permet de juger l'exigence (l'autonomie, en minutes). <strong>Niveau</strong> : valeur visée (60 min). <strong>Flexibilité</strong> : marge de négociation sur ce niveau, d'une flexibilité nulle (niveau impératif, classe F0) à une flexibilité forte (niveau très négociable, classe F3).</p>
  </div>

  <h3>Une bonne exigence</h3>
  <ul>
    <li><strong>unique</strong> : une seule idée par exigence ;</li>
    <li><strong>vérifiable</strong> : on sait par quel essai, quelle simulation ou quel calcul la vérifier ;</li>
    <li><strong>quantifiée</strong> : critère, niveau avec son unité, flexibilité ;</li>
    <li><strong>précise sur ses conditions</strong> : herbe sèche, 20 °C, pente au plus de 35 % ;</li>
    <li><strong>sans solution imposée</strong>, sauf contrainte réelle (une norme, une interface existante).</li>
  </ul>
  <p>« Le robot doit avoir une bonne autonomie » n'est pas une exigence ; « autonomie d'au moins 60 min en tonte, sur herbe sèche, à 20 °C, flexibilité nulle » en est une.</p>

  <h3>Les relations du diagramme des exigences</h3>
  <ul>
    <li><strong>contenance</strong> (symbole ⊕ du côté de l'exigence mère) : décomposition d'une exigence en sous-exigences ; satisfaire toutes les filles revient à satisfaire la mère ;</li>
    <li><strong>«deriveReqt»</strong> (dérivation) : exigence obtenue par analyse ou par calcul à partir d'une autre ;</li>
    <li><strong>«refine»</strong> (raffinement) : un élément, souvent un cas d'utilisation, précise le contenu d'une exigence ;</li>
    <li><strong>«satisfy»</strong> (satisfaction) : un bloc, c'est-à-dire une solution, satisfait l'exigence ;</li>
    <li><strong>«verify»</strong> (vérification) : un cas de test (essai, simulation, calcul) vérifie l'exigence ;</li>
    <li><strong>«trace»</strong> : simple lien de traçabilité, moins précis que les précédents.</li>
  </ul>
  <div class="notice"><strong>Sens des flèches</strong> : pour toutes les relations pointillées, la flèche part de l'élément qui dépend (l'exigence dérivée, le bloc, le cas de test, le cas d'utilisation qui raffine) et pointe vers l'exigence concernée. Lire « 1.3.1 est dérivée de 1.3 », « la batterie satisfait 1.3.1 ».</div>

  <div class="method-box"><strong>Exemple — Dériver l'énergie de la batterie à partir de l'autonomie</strong>
    <p>Puissance moyenne estimée en tonte : 40 W. Le circuit de gestion de la batterie interdit de la vider complètement : 90 % de son énergie nominale est utilisable. Il faut garder 2 W·h pour le retour à la station (§3).</p>
    <ol>
      <li><strong>Énergie consommée en 60 min</strong> : \(40 \times 1 = 40\ \text{W·h}\).</li>
      <li><strong>Énergie nominale minimale</strong> : \(E \ge (40 + 2)/0{,}9 \approx 46{,}7\ \text{W·h}\). D'où l'exigence dérivée 1.3.1 : énergie nominale d'au moins 47 W·h.</li>
      <li><strong>Choix</strong> : une batterie de 18 V et 2,5 A·h emporte \(18 \times 2{,}5 = 45\ \text{W·h}\) : insuffisant. Une batterie de 18 V et 3,0 A·h emporte 54 W·h, avec une marge de 16 % : elle satisfait 1.3.1.</li>
      <li><strong>Traçabilité</strong> : la relation «satisfy» relie le bloc Batterie à 1.3.1 ; l'essai d'autonomie vérifiera directement 1.3.</li>
    </ol>
  </div>
  <div class="formula" data-nom="Énergie d'une batterie">$$E = U_{\text{nom}}\,Q \qquad (\text{W·h} = \text{V} \times \text{A·h})$$</div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la capacité \(Q\) (en A·h, une charge électrique) et l'énergie \(E\) (en W·h). Deux batteries de 3 A·h, l'une sous 18 V, l'autre sous 36 V, emportent 54 et 108 W·h. Autre oubli fréquent : la part non utilisable de la batterie.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CYCLE DE VIE ET IMPACT ENVIRONNEMENTAL</div>
  <h2>Évaluer l'impact environnemental et sociétal d'un produit</h2>
  <div class="intro">Les exigences environnementales font partie du cahier des charges au même titre que les performances. Pour les chiffrer, on suit le produit sur toute sa vie, de l'extraction des matières à sa fin de vie : c'est l'analyse du cycle de vie.</div>
  <div class="def-box">
    <p><strong>Cycle de vie</strong> : extraction des matières premières ; fabrication (élaboration des matériaux, des pièces, assemblage) ; distribution jusqu'à l'utilisateur ; utilisation (énergie, consommables, entretien) ; fin de vie (collecte, réemploi, recyclage, valorisation énergétique, élimination). Des transports relient chaque étape à la suivante.</p>
    <p><strong>Analyse du cycle de vie (ACV)</strong> : méthode qui recense, phase par phase, les ressources consommées et les émissions rejetées, puis les traduit en impacts sur l'environnement.</p>
    <p><strong>Unité fonctionnelle</strong> : le service rendu qui sert de base commune de comparaison, par exemple « entretenir 800 m² de pelouse pendant 8 saisons ». Sans elle, comparer deux produits n'a pas de sens.</p>
  </div>

<figcaption>Les phases du cycle de vie. Chaque phase consomme des ressources et rejette des émissions ; l'<strong>analyse du cycle de vie</strong> (ACV) les additionne pour un même service rendu. Le recyclage et le réemploi referment la boucle et réduisent la part de l'extraction.</figcaption>
</figure>

  <h3>Indicateurs et ordres de grandeur</h3>
  <ul>
    <li><strong>changement climatique</strong>, en kg CO₂e (kilogrammes équivalent CO₂ : chaque gaz à effet de serre est compté par la masse de CO₂ qui aurait le même effet) ;</li>
    <li><strong>énergie primaire</strong> consommée, en MJ ou en kW·h ;</li>
    <li><strong>épuisement des ressources</strong> minérales : métaux des batteries et de l'électronique (lithium, cobalt, cuivre) ;</li>
    <li>consommation d'<strong>eau</strong>, pollution de l'air, de l'eau et des sols, écotoxicité.</li>
  </ul>
  <p>Ordres de grandeur, à retenir comme tels : l'électricité produite en France émet environ 0,05 à 0,06 kg CO₂e par kW·h (nucléaire et renouvelables), la moyenne européenne environ 0,25, une centrale au charbon environ 1 ; un litre d'essence brûlé rejette environ 2,3 kg de CO₂, environ 2,8 kg CO₂e si l'on compte l'extraction, le raffinage et le transport du carburant ; fabriquer une batterie lithium-ion émet de l'ordre de 100 kg CO₂e par kW·h de capacité (60 à 150 selon les études).</p>
  <div class="prop-box">
    <strong>Chercher la phase dominante.</strong> Pour un produit qui consomme beaucoup d'énergie pendant longtemps (véhicule, moteur industriel, compresseur), l'utilisation domine souvent : le rendement devient un critère environnemental. Pour un produit qui consomme peu, ce sont l'extraction et la fabrication : durée de vie, réparabilité et recyclage sont alors les leviers. Le mix électrique du pays d'utilisation peut faire basculer la conclusion.
  </div>

  <div class="method-box"><strong>Exemple — Robot de tonte ou tondeuse thermique ?</strong>
    <p>Étude simplifiée, valeurs arrondies, même unité fonctionnelle : entretenir 800 m² pendant 30 semaines par an, durant 8 ans. Robot : extraction et fabrication 70 kg CO₂e, plus une batterie de remplacement (6 kg) ; transport 6 kg ; fin de vie 2 kg ; 9,4 h de tonte par semaine à 40 W (§1), rendement de charge 0,85, station en veille sous 1 W toute l'année. Tondeuse thermique : fabrication 35 kg, transport 5 kg, fin de vie 2 kg ; une heure par semaine à 0,5 L d'essence par heure.</p>
    <ol>
      <li><strong>Électricité du robot</strong> : tonte \(9{,}4 \times 30 \times 40 \approx 11{,}3\ \text{kW·h}\) par an aux bornes de la batterie, soit \(11{,}3/0{,}85 \approx 13{,}3\ \text{kW·h}\) prélevés au réseau ; veille \(1 \times 8760\ \text{h} \approx 8{,}8\ \text{kW·h}\) ; total environ 22 kW·h par an, 177 kW·h sur 8 ans.</li>
      <li><strong>Utilisation du robot</strong> : \(177 \times 0{,}06 \approx 11\ \text{kg CO}_2\text{e}\) avec l'électricité française ; \(177 \times 0{,}4 \approx 71\ \text{kg}\) avec un mix électrique à 0,4 kg CO₂e par kW·h.</li>
      <li><strong>Tondeuse</strong> : \(0{,}5 \times 30 \times 8 = 120\ \text{L}\) d'essence, soit \(120 \times 2{,}8 \approx 336\ \text{kg CO}_2\text{e}\).</li>
      <li><strong>Totaux</strong> : robot environ 95 kg (France) ou 155 kg (mix carboné) ; tondeuse environ 380 kg, dont 89 % pour l'utilisation.</li>
      <li><strong>Conclusion</strong> : en France, la fabrication (batterie de remplacement comprise) fait 80 % de l'empreinte du robot : sa durée de vie et sa réparabilité comptent davantage que sa consommation. La veille représente 40 % de son électricité : une exigence « veille ≤ 0,5 W » serait un levier simple.</li>
    </ol>
  </div>

  <h3>Impact sociétal</h3>
  <p>Au-delà de l'environnement, un produit agit sur la société : <strong>sécurité</strong> (lames rotatives, enfants et animaux domestiques), <strong>bruit</strong> pour le voisinage, <strong>faune</strong> (des robots qui tondent la nuit blessent des hérissons, d'où l'exigence de plage horaire 1.7), <strong>conditions de fabrication</strong> et emploi, <strong>réparabilité</strong> (pièces disponibles, batterie remplaçable sans outil spécial), <strong>accessibilité</strong> du produit. Ces aspects deviennent des exigences de contrainte, chiffrées quand c'est possible.</p>
  <div class="notice"><strong>Erreur classique</strong> : comparer deux produits sans unité fonctionnelle commune (un robot sur 8 ans contre une tondeuse sur 3 ans), ou n'examiner que l'utilisation (« électrique, donc propre ») en oubliant la fabrication et la fin de vie. La manière d'intégrer ces contraintes dès le choix des constituants (écoconception) est vue en 2ᵉ année.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · ARCHITECTURE ET DIAGRAMME DE DÉFINITION DE BLOCS</div>
  <h2>De quoi le système est-il fait ? (bdd)</h2>
  <div class="intro">Après le « quoi » des exigences vient le « avec quoi » : l'architecture structurelle liste les constituants qui vont remplir les fonctions. Le diagramme de définition de blocs en donne l'arborescence.</div>
  <div class="def-box">
    <p><strong>Architecture fonctionnelle</strong> : les fonctions que le système doit remplir et les flux qu'elles échangent, sans choix technologique (« stocker l'énergie », « convertir l'énergie électrique en énergie mécanique »).</p>
    <p><strong>Architecture structurelle</strong> (ou organique) : les constituants retenus (batterie lithium-ion, moteur à courant continu…) et leurs liaisons. <strong>Associer les fonctions aux constituants</strong>, c'est dire quel constituant remplit chaque fonction ; de même, chaque exigence est satisfaite par un ou plusieurs blocs.</p>
    <p><strong>Bloc</strong> : élément de structure (constituant matériel ou logiciel, voire une personne), décrit par son nom et ses propriétés, rangées dans le compartiment <em>values</em> (masse, tension…).</p>
  </div>

  <h3>Lire un bdd</h3>
  <ul>
    <li><strong>composition</strong> (losange plein, du côté du tout) : la partie appartient au tout ; on lit « le robot est composé de… » ;</li>
    <li><strong>multiplicité</strong> : nombre d'exemplaires de la partie dans un tout : « 2 » motorisations de déplacement ; « 0..1 » pour une partie facultative, « 1..* » pour au moins une ;</li>
    <li><strong>association</strong> (trait simple, éventuellement fléché) : lien entre deux blocs indépendants, comme le robot et sa station ;</li>
    <li><strong>agrégation</strong> (losange vide) : partie partagée ou amovible ; <strong>généralisation</strong> (triangle creux) : « est une sorte de » (un moteur à courant continu est une sorte de moteur).</li>
  </ul>
  <p>Le bdd dit de quoi le système est fait, pas comment ses parties sont reliées : c'est le rôle du diagramme de blocs internes (§7).</p>

  <div class="method-box"><strong>Exemple — Bilan de masse à partir du bdd</strong>
    <p>Les masses unitaires des blocs sont données par le dossier technique ; une motorisation de déplacement pèse 0,90 kg (moteur 0,25 kg, réducteur 0,20 kg, roue 0,45 kg).</p>

<div class="course-section">
  <div class="sec-num">§7 · DIAGRAMME DE BLOCS INTERNES</div>
  <h2>Comment les constituants sont-ils reliés ? (ibd)</h2>
  <div class="intro">Le diagramme de blocs internes ouvre un bloc et montre ses parties, leurs points de connexion et ce qui circule entre elles. C'est la vue des interfaces : une bonne part des erreurs de conception se cache dans une interface mal décrite.</div>
  <div class="def-box">
    <p><strong>Partie</strong> : exemplaire d'un bloc à l'intérieur d'un autre, noté « nom : Bloc » (bat : Batterie).</p>
    <p><strong>Port</strong> : point d'interaction d'une partie avec ce qui l'entoure (petit carré sur son bord) ; il précise ce qui peut entrer ou sortir (énergie électrique continue, couple, signal logique…). Un port posé sur le cadre du diagramme est une interface du bloc étudié avec le milieu extérieur.</p>
    <p><strong>Connecteur</strong> : trait entre deux ports ; il porte un <strong>flux</strong> dont on précise la nature (matière, énergie, information), les grandeurs et le sens.</p>
  </div>

  <h3>Compléter un ibd</h3>
  <ol>
    <li>Repérer les parties : le bdd en donne la liste et les multiplicités.</li>
    <li>Pour chaque connecteur, chercher ce qui le traverse et dans quel sens : l'énergie va de la source vers son utilisation, l'information de l'émetteur vers le récepteur.</li>
    <li>Nommer la nature du flux et ses grandeurs.</li>
    <li>Vérifier que les deux ports reliés sont <strong>compatibles</strong> : même nature, niveaux admissibles (tension, courant, couple, vitesse), même format d'information.</li>
    <li>Vérifier qu'aucune partie n'est isolée : une partie sans alimentation ou sans commande trahit un oubli.</li>
  </ol>
  <div class="method-box"><strong>Exemple — Rendre compatible une interface</strong>
    <p>La carte de commande doit mesurer la tension de la batterie (pour estimer sa charge) sur une entrée analogique de 0 à 3,3 V. La batterie comporte 5 éléments lithium-ion en série : de \(5 \times 3{,}0 = 15\ \text{V}\) (vide) à \(5 \times 4{,}2 = 21\ \text{V}\) (pleine).</p>
    <ol>
      <li><strong>Incompatibilité</strong> : 21 V sur une entrée prévue pour 3,3 V la détruirait. Il faut un pont diviseur, c'est-à-dire une partie et deux connecteurs de plus dans l'ibd.</li>
      <li><strong>Rapport maximal</strong> : \(k = \dfrac{R_2}{R_1 + R_2} \le \dfrac{3{,}3}{21} \approx 0{,}157\).</li>
      <li><strong>Choix</strong> : \(R_1 = 56\ \text{k}\Omega\) et \(R_2 = 10\ \text{k}\Omega\) donnent \(k = 10/66 \approx 0{,}152\) : la tension mesurée va de 2,27 V (batterie vide) à 3,18 V (pleine), dans la plage de l'entrée.</li>
      <li><strong>Coût</strong> : le pont prélève en permanence \(18/66\,000 \approx 0{,}27\ \text{mA}\) : négligeable en tonte, mais 2,4 A·h sur une année d'hivernage, de quoi vider la batterie. Il faut pouvoir le déconnecter.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dessiner un connecteur sans dire ce qui y passe, ou relier deux ports incompatibles (une sortie de capteur 0–10 V sur une entrée 0–3,3 V, un moteur 24 V sur une batterie 18 V). Ne pas confondre non plus l'ibd et la chaîne fonctionnelle : l'ibd relie des constituants réels par leurs ports ; la chaîne (§8) range ces mêmes constituants par fonction.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CHAÎNES DE PUISSANCE ET D'INFORMATION</div>
  <h2>Les chaînes fonctionnelles d'un système</h2>
  <div class="intro">Tout système commandé se lit comme deux chaînes couplées : la chaîne de puissance transporte et transforme l'énergie jusqu'à la matière d'œuvre ; la chaîne d'information acquiert des informations, les traite et communique des ordres. Ce découpage, commun à tous les sujets, permet de reconnaître vite le rôle de chaque constituant.</div>

  <h3>La chaîne de puissance</h3>
  <div class="def-box">
    <p><strong>Alimenter → Moduler → Convertir → Transmettre → Agir</strong></p>
    <ul>
      <li><strong>Alimenter</strong> : fournir l'énergie : réseau électrique, batterie, réservoir d'air comprimé ou d'huile sous pression, réservoir de carburant.</li>
      <li><strong>Moduler</strong> : doser l'énergie envoyée à l'actionneur selon les ordres reçus : <strong>préactionneur</strong> ou modulateur (hacheur, variateur, onduleur, contacteur ou relais en tout ou rien, distributeur pneumatique ou hydraulique).</li>
      <li><strong>Convertir</strong> : changer la forme de l'énergie : <strong>actionneur</strong> (moteur électrique : électrique vers mécanique ; vérin : pneumatique ou hydraulique vers mécanique ; résistance chauffante : électrique vers thermique).</li>
      <li><strong>Transmettre</strong> : adapter et acheminer l'énergie mécanique : <strong>transmetteur</strong> (réducteur, poulies et courroie, système vis-écrou, pignon et crémaillère, accouplement).</li>
      <li><strong>Agir</strong> : agir sur la matière d'œuvre : <strong>effecteur</strong> (roue, lame, pince, ventouse, tambour).</li>
    </ul>
  </div>
  <p>Les anciens programmes parlaient de « chaîne d'énergie » et de fonction « distribuer » ; le programme actuel, et la 2ᵉ année, disent <strong>chaîne de puissance</strong> et <strong>moduler</strong>. Une fonction peut manquer : la lame du robot est montée directement sur l'arbre de son moteur, sans transmetteur.</p>

  <h3>La chaîne d'information</h3>
  <div class="def-box">
    <p><strong>Acquérir → Traiter → Communiquer</strong></p>
    <ul>
      <li><strong>Acquérir</strong> : prélever les informations : capteurs (état du système et de son environnement), interface homme-machine d'entrée (boutons, clavier, écran tactile), réception de messages.</li>
      <li><strong>Traiter</strong> : élaborer les ordres à partir des consignes et des mesures : microcontrôleur, carte de commande, automate programmable, calculateur.</li>
      <li><strong>Communiquer</strong> : transmettre les ordres aux préactionneurs, informer l'utilisateur (écran, voyants, son), échanger avec d'autres systèmes (liaison radio, réseau).</li>
    </ul>
  </div>
  <p>Les capteurs et leurs signaux sont étudiés dans « Capteurs et chaîne de mesure », les échanges entre constituants dans « Réseaux de communication ».</p>

  <h3>L'énergie le long de la chaîne de puissance</h3>
  <p>Chaque constituant reçoit une puissance \(P_e\) et en restitue \(P_s = \eta\,P_e\), où \(\eta\) est son <strong>rendement</strong> ; le reste est dissipé, surtout en chaleur. Le long d'une chaîne, les rendements se multiplient :</p>
  <div class="formula" data-nom="Rendement d'une chaîne">$$\eta_{\text{global}} = \frac{P_{\text{utile}}}{P_{\text{absorbée}}} = \eta_1\,\eta_2\cdots\eta_n$$</div>
  <p>Ordres de grandeur des rendements : hacheur ou variateur 0,95 à 0,98 ; petit moteur électrique 0,6 à 0,85 (au-delà de 0,9 pour un gros moteur) ; réducteur à engrenages 0,95 à 0,98 par étage, mais 0,4 à 0,8 pour un réducteur à roue et vis sans fin ; vis-écrou trapézoïdale 0,3 à 0,5, vis à billes environ 0,9.</p>
  <div class="method-box"><strong>Exemple — Puissance prélevée sur la batterie en montée</strong>
    <p>Le robot (8,0 kg) monte à 0,30 m/s une pente de 35 % (angle \(\alpha\) tel que \(\tan\alpha = 0{,}35\), \(\alpha \approx 19{,}3^\circ\)). La résistance au roulement dans l'herbe vaut 10 % de l'effort normal. Roues de rayon \(R = 0{,}10\ \text{m}\) ; réducteur de rapport 1/40 et de rendement 0,85 ; moteur de rendement 0,80 ; hacheur de rendement 0,95.</p>
    <ol>
      <li><strong>Effort de traction</strong> (pente et roulement) :
        <div class="formula">$$F = m\,g\,(\sin\alpha + 0{,}1\cos\alpha) = 8{,}0 \times 9{,}81 \times (0{,}330 + 0{,}094) \approx 33{,}3\ \text{N}$$</div>
        puissance aux roues \(F\,v \approx 10{,}0\ \text{W}\).</li>
      <li><strong>Par roue</strong> : couple \(C_r = F R/2 \approx 1{,}67\ \text{N·m}\) à \(\omega_r = v/R = 3{,}0\ \text{rad/s}\).</li>
      <li><strong>Moteur</strong> : \(\omega_m = 40 \times 3{,}0 = 120\ \text{rad/s}\) (environ 1150 tr/min) ; \(C_m = C_r/(40 \times 0{,}85) \approx 0{,}049\ \text{N·m}\) ; puissance mécanique \(5{,}0/0{,}85 \approx 5{,}9\ \text{W}\).</li>
      <li><strong>Batterie</strong> : \(5{,}9/(0{,}80 \times 0{,}95) \approx 7{,}7\ \text{W}\) par roue, 15,5 W pour les deux ; rendement global \(0{,}85 \times 0{,}80 \times 0{,}95 \approx 0{,}65\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : ranger un constituant selon sa technologie plutôt que selon sa fonction. Un hacheur est un composant électronique, mais il appartient à la chaîne de puissance (il module l'énergie du moteur) ; un codeur est monté sur un moteur, mais il appartient à la chaîne d'information. Autre erreur : additionner les rendements, ou multiplier par \(\eta\) au lieu de diviser : la puissance absorbée \(P_{\text{utile}}/\eta\) est toujours la plus grande.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · LIENS ENTRE LES CHAÎNES : SYSTÈMES ASSERVIS ET SÉQUENTIELS</div>
  <h2>Ce que la chaîne d'information fait de ses mesures</h2>
  <div class="intro">La chaîne d'information commande la chaîne de puissance par des ordres et reçoit en retour des informations sur son état. Selon la nature de ce lien, on parle de système asservi ou de système séquentiel ; un même produit est presque toujours les deux à la fois.</div>
  <div class="def-box">
    <p><strong>Système asservi</strong> : une grandeur physique continue (vitesse, position, température) est mesurée en permanence par un capteur et comparée à une <strong>consigne</strong> ; la commande dépend de l'écart (boucle fermée). Si la consigne varie et que la sortie doit la suivre, on parle de <strong>poursuite</strong> ; si la consigne est constante et que la sortie doit résister aux perturbations, de <strong>régulation</strong>.</p>
    <p><strong>Système séquentiel</strong> : la commande enchaîne des phases (des <strong>états</strong>) en réponse à des <strong>événements</strong>, souvent issus d'informations tout ou rien (bouton, fin de course, détection) ; la sortie dépend des entrées et de l'état mémorisé.</p>
  </div>
  <p>La structure d'un système asservi (consigne, adaptateur, comparateur, correcteur, chaîne directe, capteur, perturbation) est détaillée dans <a href="#schblocs/cours">« Schéma-blocs et systèmes asservis »</a> (§1), son modèle dans <a href="#slci/cours">« SLCI : modélisation et transformée de Laplace »</a>, le diagramme d'états dans <a href="#sequentiel/cours">« Systèmes séquentiels »</a>.</p>

  <p>À l'échelle de la mission, le robot est <strong>séquentiel</strong> : ses modes s'enchaînent sur des événements (début de la plage horaire, pluie, contact avec la station, soulèvement). À l'intérieur des modes, des grandeurs continues sont <strong>asservies</strong> : la vitesse de la lame est maintenue malgré la densité variable de l'herbe (régulation) ; sur les modèles à réglage motorisé, la hauteur de la lame rejoint la hauteur choisie par l'utilisateur chaque fois qu'il la modifie (poursuite). La séquence fournit leurs consignes aux asservissements, et les asservissements renvoient des événements à la séquence (« station atteinte »).</p>

  <div class="method-box"><strong>Exemple — Boucle ouverte ou boucle fermée pour la lame</strong>
    <p>Le moteur de lame, à courant continu, vérifie en régime permanent \(\omega = (U - R I)/K\) et \(C = K I\), avec \(K = 0{,}05\ \text{N·m/A}\) et \(R = 1{,}0\ \Omega\). Consigne : 280 rad/s (environ 2670 tr/min). Couple résistant : 0,08 N·m dans une herbe normale, 0,16 N·m dans une herbe haute.</p>
    <ol>
      <li><strong>Herbe normale</strong> : \(I = 0{,}08/0{,}05 = 1{,}6\ \text{A}\) ; tension nécessaire \(U = 0{,}05 \times 280 + 1{,}0 \times 1{,}6 = 15{,}6\ \text{V}\).</li>
      <li><strong>Boucle ouverte</strong> (tension fixée à 15,6 V), herbe haute : \(I = 3{,}2\ \text{A}\) et \(\omega = (15{,}6 - 3{,}2)/0{,}05 = 248\ \text{rad/s}\). La vitesse chute de 11 % et la coupe se dégrade.</li>
      <li><strong>Boucle fermée</strong> : la carte mesure \(\omega\) avec un codeur, constate l'écart et augmente la tension jusqu'à \(0{,}05 \times 280 + 3{,}2 = 17{,}2\ \text{V}\) : la vitesse revient à 280 rad/s.</li>
      <li><strong>Limite</strong> : batterie presque vide (15 V), la tension plafonne ; au mieux \(\omega = (15 - 3{,}2)/0{,}05 = 236\ \text{rad/s}\). Un asservissement ne fait pas de miracle au-delà de ce que peut fournir sa chaîne de puissance.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§10 · PERFORMANCES ET ÉCARTS</div>
  <h2>Comparer les performances attendues, simulées et mesurées</h2>
  <div class="intro">Une exigence chiffrée n'a de sens que si on la confronte à des résultats : ceux d'un modèle (calcul ou simulation) pendant la conception, ceux d'essais sur un prototype ensuite. L'ingénieur compare en permanence trois versions du même système.</div>
  <div class="def-box">
    <p><strong>Performance attendue</strong> : niveau fixé par l'exigence (système souhaité). <strong>Performance simulée</strong> : valeur prévue par un modèle (calcul analytique, simulation numérique). <strong>Performance mesurée</strong> : valeur obtenue par un essai sur le système réel ou sur un prototype.</p>
    <p><strong>Indicateur de performance</strong> : grandeur, tirée du cahier des charges ou des résultats, qui permet la comparaison : autonomie en minutes, temps de réponse à 5 %, écart statique, dépassement…</p>
  </div>

</figure>
  <div class="prop-box">
    <strong>Trois écarts, trois questions.</strong>
    <ul>
      <li><strong>attendu – simulé</strong> : la solution envisagée répond-elle au besoin ? Écart de conception, réduit en changeant de solution ou de dimensionnement.</li>
      <li><strong>simulé – mesuré</strong> : le modèle représente-t-il bien le réel ? Écart de modèle, dû à des hypothèses simplificatrices, à des paramètres mal connus, à des éléments influents oubliés.</li>
      <li><strong>attendu – mesuré</strong> : le produit est-il conforme ? Écart de performance : c'est lui qui décide si l'exigence est vérifiée.</li>
    </ul>
  </div>

  <h3>Juger un écart</h3>
  <ul>
    <li>Comparer des grandeurs <strong>homogènes</strong>, obtenues <strong>dans les mêmes conditions</strong> (charge, température, état de la batterie).</li>
    <li>Raisonner en <strong>écart relatif</strong>, rapporté à la valeur de référence : quelques pour cent signalent un modèle satisfaisant ; 20 % une hypothèse à revoir.</li>
  </ul>
  <div class="formula" data-nom="Écart relatif">$$\varepsilon_r = \frac{x_{\text{mesuré}} - x_{\text{simulé}}}{x_{\text{simulé}}}$$</div>
  <ul>
    <li>Contrôler l'<strong>ordre de grandeur</strong> avant d'interpréter : un résultat dix fois trop grand signale une erreur d'unité, pas un phénomène.</li>
    <li><strong>Chercher les causes</strong> : hypothèses (pertes négligées, rendement supposé constant), valeurs des paramètres, éléments influents (température, pente, état du sol), dispersion de fabrication, incertitudes de mesure.</li>
  </ul>

  <div class="method-box"><strong>Exemple — L'autonomie du robot</strong>
    <p>Modèle : batterie de 54 W·h dont 90 % utilisables, réserve de 2 W·h pour le retour, puissance constante de 40 W. Essai : 58 min d'autonomie mesurée sur une herbe humide.</p>
    <ol>
      <li><strong>Simulé</strong> : \((0{,}9 \times 54 - 2)/40 = 46{,}6/40 \approx 1{,}165\ \text{h}\), soit environ 70 min.</li>
      <li><strong>Attendu – simulé</strong> : + 10 min (+ 17 %) : sur le papier, la solution tient l'exigence avec une marge.</li>
      <li><strong>Simulé – mesuré</strong> : − 12 min, soit − 17 % : le modèle est trop optimiste. La puissance moyenne réelle vaut \(46{,}6/(58/60) \approx 48\ \text{W}\) au lieu de 40 W (+ 20 %).</li>
      <li><strong>Attendu – mesuré</strong> : − 2 min : l'exigence 1.3 n'est pas vérifiée par cet essai. Mais elle est énoncée pour une herbe sèche à 20 °C : l'essai n'a pas respecté ses conditions. Il faut le refaire dans les bonnes conditions et enrichir le modèle (couple de coupe fonction de l'état de l'herbe). Si l'usage réel inclut l'herbe humide, il faut revoir l'exigence ou la batterie : à 48 W, il faudrait \((48 + 2)/0{,}9 \approx 56\ \text{W·h}\), soit 3,1 A·h sous 18 V.</li>
    </ol>
  </div>
  <p>Les chapitres d'automatique font les mêmes comparaisons sur les critères de stabilité, de précision et de rapidité. Modifier les paramètres d'un modèle et l'enrichir pour réduire l'écart avec la mesure est une compétence de 2ᵉ année (« Modélisation multiphysique »).</p>
  <div class="notice"><strong>Erreur classique</strong> : conclure « le système ne marche pas » à partir d'un écart sans dire lequel, ou retoucher le modèle pour qu'il colle à une mesure faite hors des conditions de l'exigence. Un écart ne s'interprète qu'avec les conditions dans lesquelles chaque valeur a été obtenue.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Compléments non exigibles</h2>
  <div class="intro">Ces outils apparaissent dans des dossiers techniques et dans d'anciens sujets ; ils ne sont pas au programme.</div>
  <ul>
    <li><strong>Autres diagrammes SysML</strong> : séquence (sd, ordre chronologique des messages échangés entre acteurs et blocs, par exemple pour un retrait de colis) ; activité (act, enchaînement d'actions et de flux) ; paramétrique (par, équations reliant les propriétés des blocs) ; paquetages.</li>
    <li><strong>Analyse fonctionnelle de l'ancien programme</strong> (méthode APTE) : « bête à cornes » (à qui, sur quoi, dans quel but), diagramme « pieuvre » et diagramme FAST (de la fonction à la solution). Son vocabulaire est encore rencontré : les fonctions de service se partagent en <em>fonctions principales</em> (le produit met en relation deux éléments du milieu extérieur) et <em>fonctions contraintes</em> (limitations imposées au concepteur).</li>
    <li><strong>Analyse de cycle de vie normalisée</strong> (normes ISO 14040 et 14044), affichage environnemental des produits, indice de réparabilité.</li>
    <li><strong>Ingénierie système fondée sur les modèles</strong> (MBSE) : un logiciel tient le modèle unique, dont tous les diagrammes sont des vues, et vérifie automatiquement la traçabilité des exigences.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="afs-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ANALYSE SYSTÈME</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : situer le système (§2), lire ses diagrammes SysML et ses exigences (§3 à §7), le découper en chaînes fonctionnelles (§8, §9), puis juger ses performances (§10). Au concours, ce sont les questions d'ouverture de presque tous les sujets : elles se traitent vite si l'on sait où regarder.</div>

  <div class="method-box">
    <strong>Méthode 1 — Isoler un système et inventorier les flux à sa frontière</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Question.</span> Écrire la question à laquelle l'étude doit répondre (autonomie, consommation annuelle, effort…) : elle fixe la frontière.</li>
      <li><span class="step">Frontière.</span> Dire ce qui est à l'intérieur, puis lister les éléments du milieu extérieur en contact avec le système : utilisateurs, autres systèmes, environnement physique.</li>
      <li><span class="step">Flux.</span> Pour chaque élément extérieur, noter ce qui traverse la frontière, sa nature (matière, énergie, information), son sens et ses grandeurs (puissance, débit, valeur et codage).</li>
      <li><span class="step">Éléments influents.</span> Ajouter ce qui n'échange pas de flux propre au service mais modifie les performances : température, pente, humidité, vent.</li>
      <li><span class="step">Contrôle.</span> Toute énergie qui entre ressort, sous forme utile ou de pertes ; la matière d'œuvre entre et sort avec une valeur ajoutée.</li>
    </ol>
    <p><em>Exemple éclair :</em> une bouilloire électrique de 2,2 kW. Énergie électrique entrante (230 V), énergie thermique sortante (pertes) ; matière d'œuvre : l'eau, froide en entrée, bouillante en sortie ; information : appui sur l'interrupteur, voyant allumé ; éléments influents : température ambiante, altitude (qui abaisse la température d'ébullition). Chauffer 1 L de 20 à 100 °C demande \(4180 \times 80 \approx 334\ \text{kJ}\) ; avec un rendement de 0,9, il faut \(334\,000/(2200 \times 0{,}9) \approx 170\ \text{s}\), un peu moins de 3 min.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Lire un diagramme de cas d'utilisation</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Sujet.</span> Le rectangle est le système ; tout ce qui est dehors appartient au milieu extérieur.</li>
      <li><span class="step">Acteurs.</span> Les classer : principal (déclenche le cas et en tire le service) ou secondaire (sollicité par le système).</li>
      <li><span class="step">Cas.</span> Lire chaque ellipse comme un service rendu (verbe à l'infinitif), jamais comme un constituant.</li>
      <li><span class="step">Relations.</span> «include» : toujours, flèche de la base vers l'inclus ; «extend» : sous condition, flèche de l'extension vers la base.</li>
      <li><span class="step">Exigences.</span> Traduire chaque cas en au moins une exigence chiffrée (méthode 3).</li>
    </ol>
    <p><em>Exemple éclair :</em> le cas « Tondre la pelouse » d'un robot qui doit entretenir 1200 m², repassés deux fois par semaine, à 119 m² par heure : \(1200 \times 2/119 \approx 20\ \text{h}\) de tonte par semaine ; avec autant de temps de recharge, environ 40 h de fonctionnement, ce qui tient encore dans une plage de 8 h à 20 h (84 h par semaine).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Traduire un besoin en exigences quantifiées</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Une idée.</span> Une seule propriété par exigence ; la classer : fonctionnelle (ce que le système fait) ou non fonctionnelle (performance, contrainte).</li>
      <li><span class="step">Critère.</span> Choisir une grandeur mesurable et son unité.</li>
      <li><span class="step">Niveau et flexibilité.</span> Fixer la valeur visée (borne, intervalle) et la marge de négociation (de F0, impératif, à F3, très négociable).</li>
      <li><span class="step">Conditions.</span> Préciser dans quelles conditions le niveau doit être tenu (charge, température, pente).</li>
      <li><span class="step">Vérification.</span> Dire par quel essai, quelle simulation ou quel calcul on la vérifiera.</li>
    </ol>
    <p><em>Exemple éclair :</em> « la recharge doit être rapide » devient « recharger 80 % d'une batterie de 54 W·h en 30 min au plus, à 20 °C, flexibilité F1 ». On en dérive une exigence sur le chargeur : puissance moyenne de charge d'au moins \(0{,}8 \times 54/0{,}5 \approx 86\ \text{W}\), avant pertes.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Lire un diagramme d'exigences</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Arborescence.</span> Partir de l'exigence racine et suivre les contenances (⊕ du côté de la mère) jusqu'aux exigences feuilles.</li>
      <li><span class="step">Contenu.</span> Pour chaque feuille, relever id, critère, niveau et conditions.</li>
      <li><span class="step">Relations.</span> Lire chaque flèche pointillée depuis l'élément qui dépend : « 1.3.1 est dérivée de 1.3 », « le bloc satisfait », « le test vérifie », « le cas raffine ».</li>
      <li><span class="step">Traçabilité.</span> Vérifier que chaque feuille est satisfaite par au moins un bloc et vérifiée par au moins un test ; une exigence orpheline est un oubli.</li>
      <li><span class="step">Cohérence.</span> Confronter les exigences qui portent sur les mêmes grandeurs : elles peuvent se contredire.</li>
    </ol>
    <p><em>Exemple éclair :</em> un portail de 4,5 m doit s'ouvrir en 15 s au plus, et la norme limite la vitesse du vantail à 0,30 m/s. Or \(4{,}5/15 = 0{,}30\ \text{m/s}\) : il faudrait rouler à la vitesse maximale du début à la fin, sans aucune phase d'accélération. Les deux exigences sont incompatibles en pratique : il faut en négocier une (d'où l'intérêt de la flexibilité).</p>
  </div>

  <div class="notice"><strong>Piège</strong> : confondre «deriveReqt» et contenance. La contenance découpe une exigence en morceaux (les filles <em>sont</em> la mère) ; la dérivation crée une exigence nouvelle, souvent sur un constituant, obtenue par un calcul (l'énergie de la batterie déduite de l'autonomie).</div>

  <div class="method-box">
    <strong>Méthode 5 — Exploiter une analyse de cycle de vie</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Unité fonctionnelle.</span> Définir le service rendu commun aux solutions comparées (quantité, durée).</li>
      <li><span class="step">Inventaire.</span> Pour chaque phase (extraction, fabrication, transport, utilisation, fin de vie), chiffrer l'indicateur choisi (kg CO₂e, énergie, ressources), ramené à l'unité fonctionnelle.</li>
      <li><span class="step">Utilisation.</span> Énergie consommée sur toute la durée de vie, multipliée par le facteur d'émission de la source (mix électrique, carburant).</li>
      <li><span class="step">Phase dominante.</span> Repérer la phase qui pèse le plus : c'est sur elle qu'il faut agir.</li>
      <li><span class="step">Sensibilité.</span> Refaire le calcul en changeant une hypothèse incertaine (durée de vie, mix électrique) : la conclusion tient-elle ?</li>
    </ol>
    <p><em>Exemple éclair :</em> un sèche-cheveux de 1,8 kW utilisé 10 min par jour pendant 5 ans consomme \(1{,}8 \times \frac{10}{60} \times 365 \times 5 \approx 550\ \text{kW·h}\), soit environ 33 kg CO₂e avec l'électricité française, contre une dizaine de kilogrammes pour sa fabrication : l'utilisation fait plus des trois quarts de l'impact. Le levier est la puissance et la durée d'usage, pas le choix du plastique.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Lire un diagramme de définition de blocs</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Racine.</span> Repérer le bloc étudié et ses compositions (losange plein contre le tout).</li>
      <li><span class="step">Multiplicités.</span> Lire le nombre d'exemplaires de chaque partie ; le nombre total d'un constituant est le produit des multiplicités le long de l'arbre.</li>
      <li><span class="step">Propriétés.</span> Relever les valeurs utiles (masse, tension, capacité) dans les compartiments <em>values</em>.</li>
      <li><span class="step">Associations.</span> Distinguer les parties (composition) des blocs simplement associés, qui ne font pas partie du système.</li>
      <li><span class="step">Bilan.</span> Masse, coût ou énergie totale : somme des valeurs unitaires multipliées par les nombres d'exemplaires.</li>
    </ol>
    <p><em>Exemple éclair :</em> un chariot est composé d'une caisse (3 kg), de 4 roues (0,6 kg chacune) et de 2 motorisations, chacune composée d'un moteur de 1,1 kg : \(3 + 4 \times 0{,}6 + 2 \times 1{,}1 = 7{,}6\ \text{kg}\). Un robot composé de 2 bras, chacun composé de 3 articulations motorisées, compte \(2 \times 3 = 6\) moteurs d'articulation.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Compléter un diagramme de blocs internes</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Parties.</span> Lister les parties à partir du bdd (« nom : Bloc ») ; repérer les ports du cadre, interfaces avec l'extérieur.</li>
      <li><span class="step">Connecteurs.</span> Pour chacun, dire ce qui passe et dans quel sens : énergie de la source vers l'utilisation, information de l'émetteur vers le récepteur, matière de l'amont vers l'aval.</li>
      <li><span class="step">Nature.</span> Écrire la nature précise : énergie électrique continue ou alternative, mécanique de rotation ou de translation, hydraulique ; information logique, analogique ou numérique.</li>
      <li><span class="step">Compatibilité.</span> Comparer les deux ports : nature, niveaux (tension, couple, pression), format de l'information. Une incompatibilité appelle un constituant d'adaptation.</li>
      <li><span class="step">Complétude.</span> Chaque partie active doit recevoir de l'énergie et, si elle est commandée, un ordre ; un port non relié signale un oubli.</li>
    </ol>
    <p><em>Exemple éclair :</em> un moteur de 24 V relié directement à une batterie de 36 V serait détruit. L'ibd doit comporter un hacheur entre les deux, dont la tension de sortie moyenne \(\alpha\,U\) ne dépasse pas 24 V : rapport cyclique \(\alpha \le 24/36 \approx 0{,}67\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Identifier les chaînes de puissance et d'information</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Matière d'œuvre.</span> Dire sur quoi le système agit et quel constituant la touche : l'effecteur (agir).</li>
      <li><span class="step">Remonter la puissance.</span> De l'effecteur vers la source : transmetteur (transmettre), actionneur (convertir), préactionneur (moduler), source (alimenter). Noter la nature de l'énergie entre chaque fonction.</li>
      <li><span class="step">Information.</span> Capteurs et boutons (acquérir), calculateur (traiter), ordres aux préactionneurs, affichage et liaisons (communiquer).</li>
      <li><span class="step">Liens.</span> Repérer les ordres (vers « moduler ») et les comptes rendus (des capteurs vers « acquérir »).</li>
      <li><span class="step">Puissances.</span> Si besoin, chiffrer la puissance utile \(F\,v\) ou \(C\,\omega\) et remonter par les rendements : \(P_{\text{absorbée}} = P_{\text{utile}}/(\eta_1\eta_2\cdots)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un vérin électrique pousse 600 N à 0,05 m/s : \(P_u = 30\ \text{W}\). Variateur (0,95), moteur (0,80), vis-écrou trapézoïdale (0,40) : rendement global \(0{,}304\), puissance absorbée \(30/0{,}304 \approx 99\ \text{W}\). La vis est le maillon le plus coûteux en énergie.</p>
  </div>

  <div class="notice"><strong>Piège</strong> : un constituant se range par sa <em>fonction</em>, pas par sa technologie ni par sa position. Le hacheur, électronique, est dans la chaîne de puissance ; le codeur, vissé sur le moteur, est dans la chaîne d'information ; une batterie qui alimente la carte de commande reste « alimenter ».</div>

  <div class="method-box">
    <strong>Méthode 9 — Distinguer un système asservi d'un système séquentiel</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Ce qui est commandé.</span> Une grandeur continue à maintenir ou à faire suivre (vitesse, position, température, éclairement) ? Ou une suite de phases (ouvrir, attendre, fermer) ?</li>
      <li><span class="step">Boucle.</span> Système asservi si cette grandeur est mesurée et comparée <em>en permanence</em> à une consigne, la commande dépendant de l'écart. Préciser alors consigne, capteur, perturbations, et s'il s'agit de poursuite (consigne variable) ou de régulation (consigne constante).</li>
      <li><span class="step">Séquence.</span> Système séquentiel si des événements, souvent tout ou rien, font passer la commande d'un état au suivant : nommer les états et les événements.</li>
      <li><span class="step">Niveaux.</span> Un même produit est souvent séquentiel au niveau de sa mission et asservi au niveau de ses actionneurs : dire à quel niveau on se place.</li>
    </ol>
    <p><em>Exemple éclair :</em> un store qui rentre quand l'anémomètre indique plus de 40 km/h est séquentiel (un seuil franchi déclenche une phase). Un éclairage de bureau qui maintient 500 lux est une régulation : quand la lumière du jour passe de 300 à 400 lux, le capteur le mesure et la lampe passe de 200 à 100 lux d'apport.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Caractériser les écarts entre performances attendues, simulées et mesurées</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Indicateur.</span> Choisir la grandeur comparée et vérifier que les trois valeurs ont été obtenues dans les mêmes conditions.</li>
      <li><span class="step">Écarts.</span> Calculer les trois écarts, en valeur et en relatif : attendu–simulé, simulé–mesuré, attendu–mesuré.</li>
      <li><span class="step">Questions.</span> Répondre à chacune : la solution répond-elle au besoin ? le modèle est-il fidèle ? le produit est-il conforme ?</li>
      <li><span class="step">Causes.</span> Pour un écart de modèle, chercher les hypothèses simplificatrices, les paramètres incertains, les éléments influents oubliés ; vérifier l'ordre de grandeur et l'homogénéité.</li>
      <li><span class="step">Action.</span> Proposer une suite : enrichir le modèle, refaire l'essai dans les bonnes conditions, changer de solution ou renégocier l'exigence.</li>
    </ol>
    <p><em>Exemple éclair :</em> temps de réponse exigé de 0,5 s au plus, simulé 0,42 s, mesuré 0,55 s. Attendu–simulé : marge de 0,08 s (16 %) ; simulé–mesuré : + 31 %, le modèle est trop optimiste (frottements négligés ?) ; attendu–mesuré : + 0,05 s, le produit n'est pas conforme.</p>
  </div>

  <div class="notice"><strong>Piège</strong> : rapporter l'écart à la mauvaise référence. Pour juger un modèle, on divise par la valeur simulée (ou mesurée, en le disant) ; pour juger la conformité, on compare à l'exigence en tenant compte de sa flexibilité. Et un écart obtenu hors des conditions de l'exigence ne prouve rien sur la conformité.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="afs-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Portail automatique — besoin, chaînes fonctionnelles et frontière</h3>
  <div class="statement">Un portail coulissant motorisé s'ouvre quand l'utilisateur appuie sur une télécommande. Un moteur électrique alimenté par le secteur entraîne, via un réducteur, un pignon qui engrène sur une crémaillère fixée au vantail. Un capteur de fin de course détecte la position « ouvert » ; une cellule photoélectrique (barrière infrarouge) détecte un obstacle dans le passage ; un feu clignotant signale le mouvement.</div>
  <div class="q"><strong>Q1.</strong> Énoncer le besoin auquel répond le portail motorisé, puis donner deux exigences non fonctionnelles avec un critère et un niveau.</div>
  <div class="q"><strong>Q2.</strong> Identifier les éléments de la chaîne de puissance (alimenter → agir).</div>
  <div class="q"><strong>Q3.</strong> Identifier les éléments de la chaîne d'information.</div>
  <div class="q"><strong>Q4.</strong> Où se trouve la boucle de retour ? Le portail est-il un système asservi ?</div>
  <div class="q"><strong>Q5.</strong> On isole le portail motorisé, vantail compris. Citer deux flux d'énergie et deux flux d'information qui traversent la frontière, puis deux éléments influents du milieu extérieur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Besoin : permettre à l'utilisateur d'ouvrir et de fermer l'accès à sa propriété à distance, sans descendre de voiture. Exigences non fonctionnelles, par exemple : temps d'ouverture (critère : durée ; niveau : 15 s au plus) ; sécurité (critère : effort exercé sur un obstacle ; niveau : 150 N au plus) ; alimentation (réseau 230 V) ; température de fonctionnement de −20 à +50 °C. Un <em>critère</em> est une grandeur mesurable, un <em>niveau</em> la valeur attendue, à laquelle on associe une flexibilité.</p>
    <p><strong>Q2.</strong> Alimenter : le réseau 230 V. Moduler : le relais (ou le variateur) qui commande le moteur. Convertir : le moteur électrique (énergie électrique → énergie mécanique de rotation). Transmettre : le réducteur, puis le pignon et la crémaillère, qui transforment la rotation en translation. Agir : le vantail, qui ouvre ou ferme le passage.</p>
    <p><strong>Q3.</strong> Acquérir : le récepteur de la télécommande (la consigne de l'utilisateur), le fin de course (détection tout ou rien de la position « ouvert »), la cellule (présence d'un obstacle). Traiter : la carte de commande. Communiquer : les ordres envoyés au relais, le feu clignotant.</p>
    <p><strong>Q4.</strong> Le capteur de fin de course renvoie à la carte l'information « portail ouvert », qui coupe alors l'alimentation du moteur. Ce retour est une information tout ou rien qui fait passer la commande d'un état (« ouverture en cours ») au suivant (« ouvert, moteur arrêté ») : le portail est un <strong>système séquentiel</strong>, pas un asservissement. Il y aurait asservissement si une grandeur continue, la position du vantail mesurée par un codeur, était comparée en permanence à une consigne, la commande du moteur dépendant de l'écart.</p>
    <p><strong>Q5.</strong> Énergie : énergie électrique entrante (réseau 230 V) ; chaleur sortante (pertes du moteur et du réducteur) ; en cas de contact, effort exercé sur l'obstacle. Information : ordre radio de la télécommande (entrant) ; signal lumineux du feu clignotant (sortant) ; présence d'un obstacle, détectée par la coupure du faisceau (entrante). Éléments influents : le vent sur le vantail (effort résistant), la température (viscosité de la graisse, pile de la télécommande), l'encrassement ou la pente du rail.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Lecture d'un diagramme des exigences : un drone</h3>
  <div class="statement">Le cahier des charges d'un drone impose : « autonomie de vol ≥ 25 min », « masse totale ≤ 900 g », « se stabiliser en vol stationnaire ». On modélise ces exigences en SysML. En vol stationnaire, le drone consomme 120 W ; sa batterie, de tension nominale 11,1 V, n'est utilisable qu'à 80 % ; les batteries disponibles stockent 150 W·h par kilogramme.</div>
  <div class="q"><strong>Q1.</strong> Pour l'exigence « autonomie ≥ 25 min », donner le critère, le niveau et la flexibilité.</div>
  <div class="q"><strong>Q2.</strong> Quel type de relation lie l'exigence « stabilité en vol » à une exigence plus précise « erreur d'altitude ≤ 5 cm » ?</div>
  <div class="q"><strong>Q3.</strong> Comment vérifie-t-on, en pratique, qu'une exigence est satisfaite ?</div>
  <div class="q"><strong>Q4.</strong> Dériver de l'exigence d'autonomie une exigence sur l'énergie de la batterie, puis sur sa capacité et sur sa masse. Quel conflit entre exigences apparaît ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Critère : la durée de vol (en vol stationnaire, dans des conditions à préciser : température, vent). Niveau : 25 min, valeur minimale ; toute valeur supérieure convient. Flexibilité : l'énoncé n'en donne pas ; si l'exigence est impérative, aucune tolérance en dessous de 25 min (classe F0).</p>
    <p><strong>Q2.</strong> Une relation de <em>raffinement</em> («refine») : l'exigence précise quantifie l'exigence qualitative « stabilité en vol ». Si la stabilité était décomposée en plusieurs exigences chiffrées (altitude, cap, position horizontale), on les relierait à elle par <em>contenance</em>.</p>
    <p><strong>Q3.</strong> Par un <em>cas de test</em> (essai ou simulation) relié à l'exigence par une relation «verify» : on mesure la grandeur dans les conditions prévues et on la compare au niveau exigé, avec sa flexibilité.</p>
    <p><strong>Q4.</strong> Énergie consommée en 25 min : \(120 \times 25/60 = 50\ \text{W·h}\) ; seuls 80 % sont utilisables, d'où l'exigence dérivée («deriveReqt») \(E \ge 50/0{,}8 = 62{,}5\ \text{W·h}\). Capacité : \(Q \ge 62{,}5/11{,}1 \approx 5{,}6\ \text{A·h}\). Masse : \(62{,}5/150 \approx 0{,}42\ \text{kg}\), soit 46 % des 900 g autorisés : il ne reste que 480 g pour la structure, les moteurs, les hélices, l'électronique et la charge utile. Les exigences d'autonomie et de masse sont en <strong>conflit</strong> ; de plus, alourdir le drone augmente sa consommation. Il faut arbitrer : négocier l'une des deux exigences (d'où l'intérêt de la flexibilité) ou changer de solution (batterie plus dense, hélices plus grandes et plus efficaces).</p>
  </div>
</div>

<div class="exo">

  <div class="q"><strong>Q1.</strong> Lister les acteurs et dire lesquels sont principaux et lesquels sont secondaires.</div>
  <div class="q"><strong>Q2.</strong> Que signifient les trois flèches «include» ? Et la flèche «extend» ?</div>
  <div class="q"><strong>Q3.</strong> Un élève propose d'ajouter un cas « Serrure électrique » dans le rectangle. Est-ce correct ?</div>
  <div class="q"><strong>Q4.</strong> Combien de colis la consigne contient-elle en moyenne ? Qu'en est-il un jour de pointe à 70 colis ? Proposer une exigence chiffrée.</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Acteurs principaux, qui déclenchent un cas et en tirent un service : le livreur (déposer), le client (retirer), le technicien (assurer la maintenance). Acteur secondaire : la plateforme de livraison, sollicitée par la consigne pour notifier le client. Ce n'est pas une personne mais un système extérieur : un acteur n'est pas forcément humain.</p>
    <p><strong>Q2.</strong> Déposer un colis inclut <em>toujours</em> « Ouvrir un casier » et « Notifier le client » ; retirer un colis inclut toujours « Ouvrir un casier ». L'inclusion met en commun l'ouverture, utilisée par deux cas. « Signaler un blocage » étend « Retirer un colis » : ce comportement ne s'ajoute au retrait que dans un cas particulier, si le casier ne s'ouvre pas.</p>
    <p><strong>Q3.</strong> Non. Un cas d'utilisation est un <em>service</em> rendu à un acteur, nommé par un verbe ; une serrure est un <em>constituant</em>, qui a sa place dans le diagramme de définition de blocs (et dans le diagramme de blocs internes), où il satisfera l'exigence liée à « Ouvrir un casier ».</p>
    <p><strong>Q4.</strong> Chaque jour arrivent 40 colis, qui restent chacun 1,2 jour en moyenne : en régime établi, la consigne contient en moyenne \(40 \times 1{,}2 = 48\) colis, soit 80 % des 60 casiers. Un jour de pointe, \(70 \times 1{,}2 = 84\) colis dépasseraient la capacité. Exigence possible : « nombre de casiers ≥ 105 », pour rester à 80 % d'occupation en pointe (\(84/0{,}8 = 105\)) ; ou bien agir sur la durée de séjour : « relance du client au bout de 24 h, retour à l'expéditeur au bout de 3 jours ».</p>
    <p><strong>Q5.</strong> Il y a \(10^6\) codes possibles ; avec 3 essais, la probabilité de tomber sur le bon vaut \(3/10^6 = 3 \times 10^{-6}\). Cela devient une exigence de sécurité chiffrée, vérifiable par le calcul.</p>
  </div>
</div>

      <tr><th></th><th>Personnelle</th><th>Libre-service</th></tr>
      <tr><td>Extraction et fabrication (batterie comprise)</td><td>120 kg CO₂e</td><td>120 kg CO₂e</td></tr>
      <tr><td>Transport jusqu'à l'utilisateur</td><td>10 kg CO₂e</td><td>10 kg CO₂e</td></tr>
      <tr><td>Fin de vie</td><td>5 kg CO₂e</td><td>5 kg CO₂e</td></tr>
      <tr><td>Durée de vie</td><td>8 000 km</td><td>2 500 km</td></tr>
      <tr><td>Consommation électrique</td><td>1,5 kW·h aux 100 km</td><td>1,5 kW·h aux 100 km</td></tr>
      <tr><td>Collecte et recharge par camionnette</td><td>aucune</td><td>50 g CO₂e par km parcouru</td></tr>
    </table>
    </div>
    Électricité : 0,06 kg CO₂e par kW·h. Voiture thermique avec un seul passager : environ 200 g CO₂e par km.</div>
  <div class="q"><strong>Q1.</strong> Proposer une unité fonctionnelle qui permette la comparaison.</div>
  <div class="q"><strong>Q2.</strong> Calculer les émissions par kilomètre dans chaque cas.</div>
  <div class="q"><strong>Q3.</strong> Quelle est la phase dominante dans chaque cas ? Proposer un levier d'amélioration pour chacun.</div>
  <div class="q"><strong>Q4.</strong> Que devient le résultat de la trottinette personnelle si sa durée de vie double ?</div>
  <div class="q"><strong>Q5.</strong> Un trajet de 3 km est fait en trottinette en libre-service. Comparer son bilan selon qu'il remplace un trajet en voiture ou un trajet à pied. Que retenir ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> « Transporter une personne sur 1 km ». Les deux trottinettes n'ont pas la même durée de vie : comparer les produits entiers n'aurait pas de sens, il faut comparer le service rendu.</p>
    <p><strong>Q2.</strong> Électricité : \(1{,}5/100 \times 0{,}06 = 9 \times 10^{-4}\ \text{kg}\), soit 0,9 g par km. Personnelle : \(135/8000 \approx 16{,}9\ \text{g/km}\) pour la fabrication, le transport et la fin de vie, plus 0,9 g : environ 18 g/km. Libre-service : \(135/2500 = 54\ \text{g/km}\), plus 0,9 g, plus 50 g de collecte : environ 105 g/km.</p>
    <p><strong>Q3.</strong> Personnelle : la fabrication, environ 95 % du total ; levier : durée de vie (robustesse, réparabilité, batterie remplaçable). Libre-service : fabrication (51 %) et collecte (48 %) presque à égalité ; leviers : robustesse contre le vandalisme et l'usage intensif, batteries échangeables collectées par des vélos-cargos électriques plutôt que par des camionnettes. L'électricité consommée est négligeable dans les deux cas, avec le mix français.</p>
    <p><strong>Q4.</strong> \(135/16\,000 + 0{,}9 \approx 9{,}3\ \text{g/km}\) : le résultat est presque divisé par deux, puisque la fabrication domine.</p>
    <p><strong>Q5.</strong> Remplaçant la voiture : \(3 \times (200 - 105) \approx 285\ \text{g}\) de CO₂e évités. Remplaçant la marche : \(3 \times 105 \approx 315\ \text{g}\) ajoutés. L'ACV d'un produit ne dit pas tout : son bilan dépend de l'usage qu'il remplace, ce qui relève de l'impact sociétal (habitudes de déplacement) autant que de la conception.</p>
  </div>
