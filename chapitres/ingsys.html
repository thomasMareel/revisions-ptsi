  <div class="q"><strong>Q1.</strong> Combien le fauteuil compte-t-il de moteurs ? de roues ?</div>
  <div class="q"><strong>Q2.</strong> Faire le bilan de masse. L'exigence de masse est-elle satisfaite ?</div>
  <div class="q"><strong>Q3.</strong> Quelles sont la tension et l'énergie de l'ensemble des batteries ? Pourquoi le montage en série n'apparaît-il pas dans le bdd ?</div>
  <div class="q"><strong>Q4.</strong> L'exigence d'autonomie est-elle satisfaite ?</div>
  <div class="q"><strong>Q5.</strong> On ajoute un frein électromagnétique sur chaque roue motrice. Où le placer dans le bdd, avec quelle multiplicité ? Pourquoi le chargeur n'est-il pas relié par une composition ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Deux motorisations, composées chacune d'un moteur : \(2 \times 1 = 2\) moteurs. Roues : 2 roues motrices (une par motorisation) et 2 roues avant pivotantes, soit 4 roues.</p>
    <p><strong>Q2.</strong> En multipliant chaque masse unitaire par sa multiplicité :</p>
    <div class="formula">$$\begin{aligned} M &= 18 + 6 + 2 \times 7{,}5 + 2 \times 1{,}2\\ &\quad + 2 \times 5{,}5 + 1{,}5 = 53{,}9\ \text{kg}\end{aligned}$$</div>
    <p>Sans les batteries : \(53{,}9 - 11 = 42{,}9\ \text{kg} \le 45\ \text{kg}\) : exigence satisfaite, avec 2,1 kg de marge. En oubliant les multiplicités, on trouverait 39,7 kg.</p>
    <p><strong>Q3.</strong> En série, les tensions s'ajoutent et la capacité reste celle d'une batterie : 24 V et 40 A·h (cohérent avec le moteur 24 V), soit \(24 \times 40 = 960\ \text{W·h}\). Le bdd ne montre que la <em>composition</em> (le fauteuil contient deux batteries), jamais les connexions : le câblage en série se lit dans le diagramme de blocs internes.</p>
    <p><strong>Q4.</strong> Énergie utilisable : \(0{,}9 \times 960 = 864\ \text{W·h}\) ; durée à 120 W : \(864/120 = 7{,}2\ \text{h}\) ; distance à 6 km/h : 43 km, au-delà des 25 km exigés. Il suffirait de 500 W·h utilisables (\(25/6 \times 120\)) : la marge permet de rouler en pente, par temps froid, ou avec des batteries vieillies.</p>
    <p><strong>Q5.</strong> Dans le bloc Motorisation, par une composition de multiplicité 1, à côté du moteur, du réducteur et de la roue motrice : on obtient automatiquement 2 freins en tout. Le chargeur reste à la maison, il ne fait pas partie du fauteuil : il lui est seulement <em>associé</em>.</p>
  </div>
</div>

    <h4>Correction</h4>

    <div>
    <table>
      <tr><th>N°</th><th>De → vers</th><th>Nature</th></tr>
      <tr><td>1</td><td>réseau → alim</td><td>énergie électrique alternative 230 V</td></tr>

    <p><strong>Q2.</strong> La pompe n'a pas d'énergie, et rien ne lui dit quand démarrer. Il faut ajouter une partie « rel : Relais » (le préactionneur de la pompe), reliée au réseau 230 V par un port du cadre, reliée à la pompe par un connecteur d'énergie électrique 230 V commutée, et commandée par le programmateur par un connecteur d'information logique (ordre de marche). Une partie active sans alimentation ou sans commande trahit toujours un oubli.</p>
    <p><strong>Q3.</strong> Chaîne de puissance (la matière d'œuvre est l'eau) : alimenter, le réseau électrique et la cuve ; moduler, le relais (énergie électrique de la pompe) et l'électrovanne (débit d'eau, en tout ou rien) ; convertir, la pompe (énergie électrique en énergie hydraulique) ; transmettre, les tuyaux ; agir, les arroseurs. Chaîne d'information : acquérir, le capteur d'humidité (et l'horloge du programmateur) ; traiter, le programmateur ; communiquer, les ordres au relais et à l'électrovanne, l'écran du programmateur. Le transformateur alimente la partie commande.</p>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Bilan de puissance le long d'une chaîne de puissance</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format concours SI (thème <em>chaîne de puissance, rendements, bilan de puissance</em>).</div>
  <div class="statement">
    Un treuil motorisé doit fournir une puissance mécanique <strong>utile</strong> \(P_u = 180\ \text{W}\) à sa charge. Sa chaîne de puissance est : alimentation → <strong>variateur</strong> (\(\eta_1 = 0{,}95\)) → <strong>moteur</strong> (\(\eta_2 = 0{,}80\)) → <strong>réducteur</strong> (\(\eta_3 = 0{,}90\)) → effecteur.
  </div>

  <p class="exo-part">Partie A — Rendement et pertes</p>
  <div class="q"><strong>A1.</strong> Exprimer puis calculer le rendement global \(\eta\) de la chaîne.</div>
  <div class="q"><strong>A2.</strong> En déduire la puissance électrique \(P_e\) que doit fournir l'alimentation.</div>
  <div class="q"><strong>A3.</strong> Calculer la puissance dissipée dans chaque étage. Quel composant est le maillon faible énergétique ?</div>

  <p class="exo-part">Partie B — Optimisation</p>
  <div class="q"><strong>B1.</strong> On peut remplacer un seul composant par un modèle de rendement \(0{,}90\). Sur lequel agir pour réduire le plus la consommation \(P_e\) (à \(P_u\) fixé) ? Quantifier le gain.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Les rendements se <strong>multiplient</strong> le long de la chaîne : \(\eta = \eta_1\eta_2\eta_3 = 0{,}95\times0{,}80\times0{,}90 = 0{,}684\) (soit \(68{,}4\,\%\)).</p>
    <p><strong>A2.</strong> \(\eta = P_u/P_e\) donc \(P_e = \dfrac{P_u}{\eta} = \dfrac{180}{0{,}684} \approx 263\ \text{W}\).</p>
    <p><strong>A3.</strong> Puissances transmises : après variateur \(P_1 = 263\times0{,}95 \approx 250\ \text{W}\) (perte \(\approx 13\ \text{W}\)) ; après moteur \(P_2 = 250\times0{,}80 = 200\ \text{W}\) (perte \(50\ \text{W}\)) ; après réducteur \(P_3 = 200\times0{,}90 = 180\ \text{W} = P_u\) (perte \(20\ \text{W}\)). Pertes totales \(\approx 83\ \text{W} = P_e - P_u\) ✓. Le <strong>moteur</strong> (\(\eta_2 = 0{,}80\)) est le maillon faible : il dissipe à lui seul \(50\ \text{W}\).</p>
    <p><strong>B1.</strong> Il faut améliorer l'étage de <strong>plus mauvais rendement</strong>, donc le moteur (\(0{,}80 \to 0{,}90\)). Nouveau rendement \(\eta' = 0{,}95\times0{,}90\times0{,}90 \approx 0{,}770\), d'où \(P_e' = 180/0{,}770 \approx 234\ \text{W}\) : on économise \(\approx 29\ \text{W}\) (le réducteur est déjà à 0,90, et remplacer le variateur, à 0,95, par un modèle à 0,90 dégraderait au contraire le bilan : 278 W). Agir sur le maillon faible est le plus rentable.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ☆ ☆</span>
  <h3>Asservi ou séquentiel ?</h3>
  <div class="statement">On considère les systèmes suivants.
    <ul>
      <li>(a) Le régulateur de vitesse d'une voiture, qui maintient 110 km/h dans les montées comme dans les descentes.</li>

      <li>(d) Un distributeur de boissons.</li>
      <li>(e) Le pilote automatique d'un voilier, qui tient le cap affiché malgré les vagues, et que l'on peut faire virer de 10° d'un appui sur un bouton.</li>
      <li>(f) Une imprimante 3D dont la tête est déplacée par des moteurs pas à pas commandés sans capteur de position, et dont la buse est maintenue à 210 °C.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Classer chaque système : asservi, séquentiel, ou les deux à des niveaux différents.</div>
  <div class="q"><strong>Q2.</strong> Pour chaque grandeur asservie, donner la consigne, le capteur, une perturbation, et dire s'il s'agit de poursuite ou de régulation.</div>
  <div class="q"><strong>Q3.</strong> Dans une côte, une voiture sans régulateur (pédale immobile) passe de 110 à 96 km/h ; avec le régulateur, sa vitesse ne descend qu'à 108 km/h. Calculer les deux écarts relatifs à la consigne.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1 et Q2.</strong></p>
    <ul>
      <li>(a) <strong>Asservi</strong> : la vitesse, mesurée par un capteur de rotation des roues, est comparée en permanence à la consigne de 110 km/h ; perturbations : pente, vent, chargement. Régulation tant que la consigne est fixe ; poursuite quand le conducteur la change.</li>
      <li>(b) <strong>Séquentiel</strong> : des états (vert, orange, rouge, passage piétons) qui s'enchaînent sur des événements (fin de temporisation, appui sur le bouton).</li>
      <li>(c) <strong>Asservi</strong> : c'est une régulation de température en tout ou rien. La température est mesurée et comparée en permanence à la consigne ; elle oscille entre 52 et 58 °C. Perturbations : puisage d'eau chaude, pertes thermiques. La commande tout ou rien ne rend pas le système séquentiel.</li>
      <li>(d) <strong>Séquentiel</strong> : choix, paiement, préparation, service, rendu de la monnaie, enchaînés sur des événements. (Un chauffe-eau interne serait, lui, régulé.)</li>
      <li>(e) <strong>Asservi</strong> : le cap, mesuré par un compas électronique, comparé au cap affiché ; perturbations : vagues, vent, courant. Régulation en route droite ; poursuite pendant le virement, où la consigne change.</li>
      <li>(f) <strong>Les deux, et un piège</strong> : la position de la tête n'est <em>pas</em> asservie, car aucun capteur ne la mesure ; les moteurs pas à pas suivent les impulsions en boucle ouverte, et un pas perdu n'est jamais corrigé. La température de la buse est régulée (consigne 210 °C, thermistance, perturbation : flux d'air, filament froid). L'impression elle-même enchaîne des phases (chauffe, impression, refroidissement) : séquentiel au niveau de la mission.</li>
    </ul>
    <p><strong>Q3.</strong> Sans régulateur : \((110 - 96)/110 \approx 12{,}7\,\%\). Avec : \((110 - 108)/110 \approx 1{,}8\,\%\). La boucle fermée divise l'effet de la perturbation par environ 7.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Halage d'un bateau sur une cale : performances attendues, simulées et mesurées</h3>
  <div class="statement">Un treuil électrique hisse sur une cale un bateau posé sur sa remorque, de masse totale \(m = 450\ \text{kg}\). La cale a une pente de 12 % (\(\tan\alpha = 0{,}12\)). Le câble, parallèle à la cale, s'enroule sur un tambour de rayon \(R_t = 50\ \text{mm}\), entraîné par un moteur à courant continu à travers un réducteur de rapport 1/60. Sous 12 V, la vitesse du moteur vérifie \(\omega_m = \omega_0\,(1 - C_m/C_d)\), avec \(\omega_0 = 300\ \text{rad/s}\) et \(C_d = 4{,}0\ \text{N·m}\) ; \(\omega_0\) et \(C_d\) sont proportionnels à la tension d'alimentation.
    <ul>
      <li>Exigence : vitesse de halage d'au moins 10 m/min à pleine charge.</li>
      <li>Modèle du bureau d'études : rendement du réducteur 0,70, roulement de la remorque négligé, tension de 12 V.</li>
      <li>Essai à pleine charge : 9,4 m/min, avec 11,0 V mesurés aux bornes du moteur.</li>
    </ul>
    On prend \(g = 9{,}81\ \text{m/s}^2\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse de halage simulée.</div>
  <div class="q"><strong>Q2.</strong> Calculer les trois écarts (en valeur et en relatif) et répondre à la question que pose chacun.</div>
  <div class="q"><strong>Q3.</strong> Proposer des causes possibles à l'écart entre la simulation et l'essai.</div>
  <div class="q"><strong>Q4.</strong> On enrichit le modèle : résistance au roulement de la remorque \(f\,m\,g\cos\alpha\) avec \(f = 0{,}04\), et tension réelle de 11,0 V. Recalculer la vitesse simulée et l'écart restant. Laquelle des deux corrections pèse le plus ?</div>
  <div class="q"><strong>Q5.</strong> (Pour aller plus loin : recaler un modèle est une compétence de 2ᵉ année.) Quel rendement du réducteur expliquerait entièrement la mesure ? Est-ce plausible ? Quelle action proposer ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\sin\alpha = 0{,}12/\sqrt{1 + 0{,}12^2} \approx 0{,}119\). Effort dans le câble (régime établi, roulement négligé) : \(F = m\,g\sin\alpha \approx 526\ \text{N}\). Couple sur le tambour : \(C_t = F\,R_t \approx 26{,}3\ \text{N·m}\). Couple moteur : \(C_m = C_t/(60 \times 0{,}70) \approx 0{,}626\ \text{N·m}\). Vitesse moteur : \(\omega_m = 300\,(1 - 0{,}626/4{,}0) \approx 253\ \text{rad/s}\). Tambour : \(253/60 \approx 4{,}22\ \text{rad/s}\), d'où \(v = 4{,}22 \times 0{,}050 \approx 0{,}211\ \text{m/s}\), soit <strong>12,7 m/min</strong>.</p>
    <p><strong>Q2.</strong> Attendu–simulé : \(+2{,}7\ \text{m/min}\) (+ 26 %) : sur le papier, la solution répond au besoin avec une marge confortable. Simulé–mesuré : \(9{,}4 - 12{,}7 = -3{,}3\ \text{m/min}\), soit − 26 % de la valeur simulée : le modèle est nettement trop optimiste. Attendu–mesuré : \(-0{,}6\ \text{m/min}\) (− 6 %) : le produit n'est pas conforme.</p>
    <p><strong>Q3.</strong> Hypothèses du modèle à remettre en cause : roulement de la remorque négligé ; tension supposée égale à 12 V alors que la batterie et les câbles chutent sous le fort courant ; rendement du réducteur supposé (0,70) ; frottement du câble et du bateau ; état de la cale (pente réelle, algues). L'écart de 26 % est trop grand pour une simple incertitude de mesure.</p>
    <p><strong>Q4.</strong> Roulement : \(0{,}04 \times 450 \times 9{,}81 \times \cos\alpha \approx 175\ \text{N}\), d'où \(F \approx 701\ \text{N}\) et \(C_t \approx 35{,}1\ \text{N·m}\), \(C_m = 35{,}1/42 \approx 0{,}835\ \text{N·m}\). Sous 11 V : \(\omega_0 = 300 \times 11/12 = 275\ \text{rad/s}\) et \(C_d = 4{,}0 \times 11/12 \approx 3{,}67\ \text{N·m}\), donc \(\omega_m = 275\,(1 - 0{,}835/3{,}67) \approx 212\ \text{rad/s}\) et \(v \approx 10{,}6\ \text{m/min}\). Écart restant : \((9{,}4 - 10{,}6)/10{,}6 \approx -11{,}5\,\%\). Chaque correction seule donne 11,4 m/min (tension) et 11,9 m/min (roulement) : la chute de tension pèse un peu plus.</p>
    <p><strong>Q5.</strong> À 9,4 m/min : \(\omega_t = 0{,}157/0{,}050 \approx 3{,}13\ \text{rad/s}\), \(\omega_m = 60 \times 3{,}13 \approx 188\ \text{rad/s}\), d'où \(C_m = 3{,}67\,(1 - 188/275) \approx 1{,}16\ \text{N·m}\) et un rendement \(\eta = 35{,}1/(60 \times 1{,}16) \approx 0{,}50\). C'est plausible pour un réducteur à roue et vis sans fin (0,4 à 0,8), souvent choisi parce qu'il est <em>irréversible</em> : le bateau ne redescend pas quand le moteur s'arrête. Actions : avec un réducteur de rendement 0,90, le modèle enrichi donne 11,3 m/min, mais il faut alors ajouter un frein ; ou bien réduire la chute de tension (câbles plus gros, batterie en meilleur état). Le choix est un compromis entre performance et sécurité.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Station météo : nature et codage des informations</h3>
  <div class="statement">Une station météo transmet par radio la direction et la vitesse du vent. La girouette porte un codeur absolu de 4 bits en code de Gray : 16 secteurs de 22,5°, le secteur 0 centré sur le nord, numérotés dans le sens des aiguilles d'une montre. L'anémomètre délivre une impulsion par tour ; la vitesse du vent vaut 2,4 km/h par hertz. Toutes les 10 s, la station envoie une trame de 16 bits : les 4 bits de la girouette (en code de Gray, tels que lus), puis la vitesse en dixièmes de km/h, codée en binaire naturel sur 12 bits.</div>
  <div class="q"><strong>Q1.</strong> Quelle est la nature de l'information fournie par la girouette ? par l'anémomètre ? transmise par la radio ?</div>
  <div class="q"><strong>Q2.</strong> Pourquoi coder la girouette en code de Gray plutôt qu'en binaire naturel ? Illustrer avec le passage du secteur 7 au secteur 8.</div>
  <div class="q"><strong>Q3.</strong> La girouette lit 1101. Quel est le secteur, et quelle est la direction du vent ?</div>
  <div class="q"><strong>Q4.</strong> L'anémomètre a donné 7 impulsions en 2 s. Quelle est la vitesse du vent ? Combien de bits faut-il au minimum pour coder une vitesse de 0 à 200 km/h au dixième près ?</div>
  <div class="q"><strong>Q5.</strong> Écrire la trame correspondant à ces deux mesures, en binaire puis en hexadécimal. Quel est le débit utile de la liaison ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Girouette : information numérique, un mot de 4 bits lu en parallèle. Anémomètre : information logique (impulsions tout ou rien), devenue numérique après comptage par la carte. Radio : information numérique transmise en série, bit après bit, sur un support sans fil.</p>
    <p><strong>Q2.</strong> En binaire naturel, 7 = 0111 et 8 = 1000 : les quatre bits changent. Comme les pistes du codeur ne basculent jamais exactement au même instant, une lecture pendant la transition peut donner n'importe quel mot (1111 = 15, par exemple : la direction opposée). En code de Gray, 7 = 0100 et 8 = 1100 : un seul bit change, et une lecture pendant la transition donne 7 ou 8, jamais une valeur aberrante.</p>
    <p><strong>Q3.</strong> Conversion du Gray en binaire : le premier bit est recopié, puis chaque bit binaire est le OU exclusif du bit binaire précédent et du bit de Gray courant : \(b_3 = 1\), \(b_2 = 1 \oplus 1 = 0\), \(b_1 = 0 \oplus 0 = 0\), \(b_0 = 0 \oplus 1 = 1\). Binaire 1001 = secteur 9, soit \(9 \times 22{,}5 = 202{,}5^\circ\) depuis le nord : vent de sud-sud-ouest.</p>
    <p><strong>Q4.</strong> Fréquence : \(7/2 = 3{,}5\ \text{Hz}\), d'où \(3{,}5 \times 2{,}4 = 8{,}4\ \text{km/h}\). De 0 à 200,0 km/h au dixième : 2001 valeurs ; \(2^{10} = 1024 \lt 2001 \le 2048 = 2^{11}\) : 11 bits au minimum. Les 12 bits de la trame permettent d'aller jusqu'à 409,5 km/h.</p>
    <p><strong>Q5.</strong> Vitesse : 84 dixièmes, soit 0000 0101 0100 sur 12 bits. Trame : 1101 0000 0101 0100, soit D054 en hexadécimal (chaque groupe de 4 bits donne un chiffre : 1101 = D, 0000 = 0, 0101 = 5, 0100 = 4). Débit utile : 16 bits toutes les 10 s, soit 1,6 bit/s, dérisoire pour n'importe quelle liaison radio.</p>
  </div>
</div>

</figure>
  <div class="q"><strong>B1.</strong> Quelle est la matière d'œuvre de la plateforme ? On isole la motorisation représentée par l'ibd : quels flux traversent sa frontière ? Citer deux éléments influents du milieu extérieur.</div>
  <div class="q"><strong>B2.</strong> Donner la nature de chacun des flux 1 à 10.</div>
  <div class="q"><strong>B3.</strong> Décrire la chaîne de puissance et la chaîne d'information de la plateforme.</div>

  <p class="exo-part">Partie C — Dimensionnement de la chaîne de puissance</p>
  <div class="q"><strong>C1.</strong> Calculer la puissance utile à la vitesse nominale, à charge nominale.</div>
  <div class="q"><strong>C2.</strong> Calculer le rendement global, la puissance prélevée sur les batteries et le courant qu'elles débitent.</div>
  <div class="q"><strong>C3.</strong> Calculer la vitesse de rotation de la vis, le rapport de réduction et le couple du moteur.</div>

  <p class="exo-part">Partie D — Fonctionnement sur batteries (exigence 1.4)</p>
  <div class="q"><strong>D1.</strong> Calculer l'énergie prélevée pour une montée à charge nominale, puis pour un aller-retour. En déduire la valeur de l'exigence dérivée 1.4.1.</div>
  <div class="q"><strong>D2.</strong> Les batteries de 2 × 12 V et 17 A·h satisfont-elles 1.4.1 ? Des batteries de 12 A·h conviendraient-elles ?</div>

  <p class="exo-part">Partie E — Comportement et écarts</p>
  <div class="q"><strong>E1.</strong> La plateforme est-elle un système asservi ou séquentiel ? Citer ses états et les événements qui les font changer. La vitesse du plateau est-elle asservie ?</div>
  <div class="q"><strong>E2.</strong> Un essai à charge nominale donne une montée de 1,50 m en 18,2 s. Le modèle simple (vitesse constante de 0,10 m/s) prévoyait 15 s. Calculer les trois écarts et conclure.</div>
  <div class="q"><strong>E3.</strong> Le variateur impose en réalité une accélération et une décélération d'une seconde chacune (rampes linéaires). Recalculer la durée simulée. Quelle cause peut expliquer l'écart restant ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Contenance (⊕) : l'exigence 1 se décompose en 1.1 à 1.4. «verify» : la mesure du temps vérifie 1.3. «deriveReqt» : 1.4.1 est dérivée de 1.4 par un calcul. «satisfy» : les batteries satisfont 1.4.1. Sécurité : la vitesse limitée (1.2, imposée par la norme pour ce type d'appareil), la commande à action maintenue et l'arrêt par la barre palpeuse ; le fonctionnement sans secteur (1.4) évite aussi de bloquer un usager pendant une coupure.</p>
    <p><strong>A2.</strong> Pour monter 1,50 m en 20 s au plus, il faut une vitesse moyenne d'au moins \(1{,}50/20 = 0{,}075\ \text{m/s}\) ; 1.2 limite la vitesse à 0,15 m/s. La vitesse nominale de 0,10 m/s laisse une marge des deux côtés : elle tolère des démarrages progressifs et un ralentissement sous charge sans dépasser la limite de sécurité.</p>
    <p><strong>B1.</strong> La matière d'œuvre est l'usager dans son fauteuil : il entre en bas et sort en haut (ou l'inverse), sa valeur ajoutée est le dénivelé franchi. Flux traversant la frontière de la motorisation : énergie électrique du réseau (1), entrante ; énergie mécanique transmise par l'écrou au plateau (7), sortante, et chaleur dissipée par les pertes ; information de l'usager, appui sur le bouton (10), entrante ; contact d'un obstacle, détecté par la barre palpeuse. Éléments influents : la température (une batterie au plomb perd une partie de sa capacité au froid), la charge réelle sur le plateau.</p>
    <p><strong>B2.</strong></p>
    <div>
    <table>
      <tr><th>N°</th><th>Nature</th></tr>
      <tr><td>1</td><td>énergie électrique alternative 230 V (réseau → chargeur)</td></tr>
      <tr><td>2</td><td>énergie électrique continue (chargeur → batteries)</td></tr>
      <tr><td>3</td><td>énergie électrique continue 24 V (batteries → variateur)</td></tr>
      <tr><td>4</td><td>énergie électrique modulée (variateur → moteur)</td></tr>
      <tr><td>5</td><td>énergie mécanique de rotation rapide (moteur → réducteur)</td></tr>
      <tr><td>6</td><td>énergie mécanique de rotation lente (réducteur → vis)</td></tr>
      <tr><td>7</td><td>énergie mécanique de translation (écrou → plateau)</td></tr>
      <tr><td>8</td><td>information : commande du variateur (carte → variateur)</td></tr>
      <tr><td>9</td><td>information logique : contact détecté (barre palpeuse → carte)</td></tr>
      <tr><td>10</td><td>information logique : appui maintenu sur le bouton (usager → carte)</td></tr>
    </table>
    </div>
    <p><strong>B3.</strong> Chaîne de puissance : alimenter, les batteries (rechargées depuis le réseau par le chargeur) ; moduler, le variateur ; convertir, le moteur à courant continu ; transmettre, le réducteur et la vis-écrou (rotation → translation) ; agir, le plateau, qui élève l'usager. Chaîne d'information : acquérir, les boutons, la barre palpeuse, les fins de course ; traiter, la carte de commande ; communiquer, les ordres au variateur et la signalisation à l'usager.</p>
    <p><strong>C1.</strong> Masse déplacée : \(250 + 120 = 370\ \text{kg}\) ; \(P_u = m\,g\,v = 370 \times 9{,}81 \times 0{,}10 \approx 363\ \text{W}\).</p>
    <p><strong>C2.</strong> \(\eta = 0{,}95 \times 0{,}80 \times 0{,}90 \times 0{,}40 \approx 0{,}274\) ; \(P_{\text{bat}} = 363/0{,}274 \approx 1327\ \text{W}\) ; \(I = 1327/24 \approx 55\ \text{A}\). La vis trapézoïdale divise à elle seule la puissance utile par 2,5 : c'est le prix de son irréversibilité (le plateau ne redescend pas seul si le moteur s'arrête).</p>
    <p><strong>C3.</strong> Un tour de vis fait monter l'écrou d'un pas : \(n_{\text{vis}} = 0{,}10/0{,}005 = 20\ \text{tr/s} = 1200\ \text{tr/min}\). Rapport de réduction : \(1200/3000 = 0{,}4\). Puissance mécanique du moteur : \(363/(0{,}90 \times 0{,}40) \approx 1008\ \text{W}\), à \(\omega_m = 3000 \times 2\pi/60 \approx 314\ \text{rad/s}\) : \(C_m \approx 1008/314 \approx 3{,}2\ \text{N·m}\).</p>
    <p><strong>D1.</strong> Une montée dure \(1{,}50/0{,}10 = 15\ \text{s}\) : \(1327 \times 15 \approx 19\,900\ \text{J} \approx 5{,}53\ \text{W·h}\). Un aller-retour : \(5{,}53 \times 1{,}3 \approx 7{,}19\ \text{W·h}\). Pour 20 allers-retours : environ 144 W·h. Exigence 1.4.1 : énergie utilisable des batteries d'au moins 144 W·h.</p>
    <p><strong>D2.</strong> Avec 17 A·h : \(2 \times 12 \times 17 = 408\ \text{W·h}\) nominaux, 204 W·h utilisables : 1.4.1 est satisfaite avec 42 % de marge. Avec 12 A·h : 144 W·h utilisables, exactement le besoin : aucune marge pour le froid ou le vieillissement, à rejeter.</p>
    <p><strong>E1.</strong> Séquentiel : états « arrêt en bas », « montée », « arrêt en haut », « descente », « arrêt de sécurité » ; événements : appui ou relâchement du bouton, fins de course haut et bas, contact de la barre palpeuse. La vitesse du plateau n'est pas asservie : aucun capteur ne la mesure, le variateur applique une consigne de tension (boucle ouverte).</p>
    <p><strong>E2.</strong> Attendu–simulé : 15 s pour 20 s exigées, 5 s de marge : la solution répond au besoin. Simulé–mesuré : \(+3{,}2\ \text{s}\), soit + 21 % : le modèle est trop simple. Attendu–mesuré : 18,2 s ≤ 20 s : le produit est conforme, avec seulement 1,8 s de marge.</p>
    <p><strong>E3.</strong> Pendant chaque rampe, la vitesse moyenne vaut 0,05 m/s : \(0{,}05\ \text{m}\) parcourus en 1 s, deux fois, soit 0,10 m. Le reste, 1,40 m, est parcouru à 0,10 m/s en 14 s. Durée simulée : \(1 + 14 + 1 = 16\ \text{s}\). Écart restant : 2,2 s (+ 14 %). Cause plausible : la vitesse en palier est plus faible que prévu, environ \(1{,}40/16{,}2 \approx 0{,}086\ \text{m/s}\), parce que le moteur ralentit sous la charge et que la tension des batteries baisse sous 55 A. Pour rendre la durée indépendante de la charge, il faudrait asservir la vitesse (un codeur sur le moteur).</p>
