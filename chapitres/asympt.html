  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit les paragraphes « Relations de comparaison : cas des fonctions » et « Relations de comparaison : cas des suites » de la section « Analyse asymptotique » du programme de PTSI (début du second semestre). Il apprend à comparer deux fonctions près d'un point : laquelle est négligeable, laquelle domine, quand deux fonctions « se ressemblent ». Les développements limités, principal outil de calcul de cette même section, font l'objet du chapitre des développements limités, qui s'appuie sur les notations \(o\) et \(\sim\) d'ici. Les limites et la continuité sont supposées connues (chapitre « Continuité et dérivabilité »).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Relations de domination, de négligeabilité, d'équivalence</strong> en un point \(a\) de \(\mathbb R\) ou en \(\pm\infty\) ; notations \(f(x) = O(g(x))\), \(f(x) = o(g(x))\), \(f(x) \sim g(x)\) ; définitions par le quotient \(f/g\), \(g\) ne s'annulant pas localement ; liens entre ces relations ; les deux formes de l'équivalence, \(f/g \to 1\) et \(f = g + o(g)\) ; étude au voisinage de \(a \ne 0\) par \(h \mapsto f(a + h)\) (§1).</li>
        <li><strong>Croissances comparées</strong> de \(\ln^\beta x\), \(x^\alpha\), \(e^{\gamma x}\) en \(+\infty\), et de \(\ln^\beta x\), \(x^\alpha\) en 0, traduites avec le symbole \(o\) (§2).</li>
        <li><strong>Règles usuelles de manipulation</strong> des symboles \(o\) et \(O\) (§3) et des équivalents (§4, §5).</li>
        <li><strong>Propriétés conservées par équivalence</strong> : signe, limite ; <strong>équivalent par encadrement</strong> (§6).</li>
        <li>Calculs d'<strong>équivalents et de limites</strong> (§7) ; les situations où les équivalents ne suffisent pas renvoient aux développements limités.</li>
        <li><strong>Cas des suites</strong> : adaptation des définitions et des résultats, notations \(u_n = O(v_n)\), \(u_n = o(v_n)\), \(u_n \sim v_n\) ; retour sur la vitesse de convergence (§8).</li>
      </ul>
      <p>Hors programme, regroupés en fin de chapitre : la formule de Stirling, les développements asymptotiques à plusieurs termes sur une échelle générale, la sommation des relations de comparaison (hors programme en PTSI comme en PT).</p>

<div class="course-section">
  <div class="sec-num">§1 · NÉGLIGEABLE, DOMINÉE, ÉQUIVALENTE</div>
  <h2>Comparer deux fonctions près d'un point</h2>
  <div class="intro">Deux fonctions qui tendent vers 0 en un point ne le font pas à la même vitesse : \(x^2\) devient bien plus petit que \(x\). Les relations de comparaison décrivent <em>comment</em> une fonction tend vers sa limite. Elles disent quels termes on peut négliger : c'est ce qu'il faut pour lever les formes indéterminées, et ce que fait un physicien quand il « néglige les termes d'ordre 2 ».</div>
  <div class="def-box">
    Soit \(a \in \mathbb R\) ou \(a = \pm\infty\), et \(f\), \(g\) définies au voisinage de \(a\), avec \(g\) <strong>ne s'annulant pas</strong> au voisinage de \(a\) (sauf peut-être en \(a\), où \(f\) et \(g\) seraient alors nulles).
    <ul>
      <li>\(f\) est <strong>négligeable</strong> devant \(g\) en \(a\), noté \(f(x) = o(g(x))\) quand \(x \to a\), si \(\dfrac{f(x)}{g(x)} \to 0\) ;</li>
      <li>\(f\) est <strong>dominée</strong> par \(g\) en \(a\), noté \(f(x) = O(g(x))\), si \(\dfrac{f}{g}\) est bornée au voisinage de \(a\) ;</li>
      <li>\(f\) est <strong>équivalente</strong> à \(g\) en \(a\), noté \(f(x) \sim g(x)\) quand \(x \to a\) (ou \(f \underset{a}{\sim} g\)), si \(\dfrac{f(x)}{g(x)} \to 1\).</li>
    </ul>
    En particulier \(o(1)\) désigne une fonction qui tend vers 0, et \(O(1)\) une fonction bornée au voisinage de \(a\).
  </div>
  <div class="prop-box">
    <strong>Liens entre les relations.</strong> Si \(f = o(g)\), alors \(f = O(g)\) ; si \(f \sim g\), alors \(f = O(g)\) et \(g = O(f)\). Et surtout :
    <div class="formula" data-nom="Équivalence et petit o">$$f \underset{a}{\sim} g \iff f - g = o(g) \iff f = g + o(g) .$$</div>
    La seconde forme est la plus utile dans les calculs : être équivalent à \(g\), c'est valoir \(g\) à un terme négligeable près.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un rapport qui tend vers 1, c'est un écart relatif qui tend vers 0.</span>
    <div class="content"><p>\(\dfrac{f - g}{g} = \dfrac fg - 1\) : cette quantité tend vers 0 si et seulement si \(\dfrac fg\) tend vers 1. Pour les deux premiers liens : une fonction qui a une limite finie est bornée au voisinage du point (chapitre « Continuité et dérivabilité », §1), et si \(f/g \to 1\), alors \(g/f \to 1\).</p></div>
  </div>

<figcaption>À gauche, les courbes de sin et de x se confondent au voisinage de 0. À droite, le rapport (sin x)/x tend vers 1 quand x tend vers 0 (cercle : valeur limite, la fonction n'est pas définie en 0) : c'est la définition de sin x ∼ x en 0. Loin de 0, le rapport n'est plus proche de 1 : un équivalent est une information locale, attachée au point.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — un même polynôme, deux comportements</strong>
    <ol>
      <li>En 0 : \(\dfrac{3x^2 + x}{x} = 3x + 1 \to 1\), donc \(3x^2 + x \sim x\) ; le terme \(3x^2 = o(x)\) est négligeable. Pour \(x = 0{,}01\), \(3x^2 + x = 0{,}010\,3\), à 3 % de \(x\).</li>
      <li>En \(+\infty\) : \(\dfrac{3x^2 + x}{3x^2} = 1 + \dfrac{1}{3x} \to 1\), donc \(3x^2 + x \sim 3x^2\) ; c'est \(x = o(x^2)\) qui est négligeable. Pour \(x = 100\), \(30\,100\) contre \(30\,000\).</li>
      <li>Un équivalent dépend donc du point : un polynôme est équivalent à son terme de plus bas degré en 0, de plus haut degré en \(\pm\infty\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — domination sans équivalence, et étude en un point \(a \ne 0\)</strong>
    <ol>
      <li>En \(+\infty\), \(x\sin x = O(x)\) (rapport \(\sin x\), borné), mais \(x\sin x\) n'est ni équivalente à \(x\) ni négligeable devant \(x\) : le rapport n'a pas de limite.</li>
      <li>En \(a = 1\), on pose \(x = 1 + h\) avec \(h \to 0\) : \(x^2 - 1 = (1 + h)^2 - 1 = 2h + h^2 \sim 2h\), soit \(x^2 - 1 \sim 2(x - 1)\) quand \(x \to 1\). Le programme demande de se ramener ainsi en 0. En \(\pm\infty\), on pose de même \(t = 1/x \to 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : écrire \(f \sim 0\). Par définition, il faudrait \(f/0\)… La seule fonction équivalente à 0 serait nulle au voisinage de \(a\) : on n'écrit <strong>jamais</strong> \(f \sim 0\), on écrit \(f \to 0\) ou \(f = o(1)\). Et le signe « \(=\) » de \(f = o(g)\) n'est pas une vraie égalité : il se lit « \(f\) est une fonction négligeable devant \(g\) », de gauche à droite seulement.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CROISSANCES COMPARÉES</div>
  <h2>Logarithme, puissances, exponentielle : qui l'emporte ?</h2>
  <div class="intro">Les fonctions usuelles qui tendent vers l'infini se rangent en une échelle : le logarithme est négligeable devant toute puissance, toute puissance est négligeable devant toute exponentielle. Ce classement règle la plupart des formes \(\infty/\infty\) et \(0 \times \infty\).</div>
  <div class="prop-box">
    <strong>Croissances comparées.</strong> Pour tous réels \(\alpha \gt 0\), \(\beta \gt 0\), \(\gamma \gt 0\) :
    <div class="formula" data-nom="Croissances comparées">$$\begin{aligned} &\text{en } +\infty : & (\ln x)^\beta &= o(x^\alpha), & x^\alpha &= o\big(e^{\gamma x}\big) ;\\ &\text{en } 0^+ : & |\ln x|^\beta &= o\big(x^{-\alpha}\big), & &\text{c'est-à-dire } x^\alpha\,|\ln x|^\beta \to 0 . \end{aligned}$$</div>
    En \(-\infty\) : \(|x|^\alpha e^{\gamma x} \to 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout se ramène à \(\frac{\ln x}{x} \to 0\) en \(+\infty\).</span>
    <div class="content"><p>On part de \(\dfrac{\ln x}{x} \to 0\) en \(+\infty\) (chapitre « Fonctions réelles — généralités »). Avec \(u = x^{\alpha/\beta} \to +\infty\), donc \(\ln x = \frac\beta\alpha\ln u\) :</p>
    <div class="formula">$$\frac{(\ln x)^\beta}{x^\alpha} = \left(\frac{\ln x}{x^{\alpha/\beta}}\right)^\beta = \left(\frac\beta\alpha\,\frac{\ln u}{u}\right)^\beta \xrightarrow[x \to +\infty]{} 0 .$$</div>
    <p>Pour l'exponentielle, on pose \(y = e^{\gamma x}\), donc \(x = \frac{\ln y}{\gamma}\) : \(\dfrac{x^\alpha}{e^{\gamma x}} = \dfrac{(\ln y)^\alpha}{\gamma^\alpha\,y} \to 0\) par ce qui précède. En \(0^+\), on pose \(x = 1/u\) avec \(u \to +\infty\) : \(x^\alpha|\ln x|^\beta = \dfrac{(\ln u)^\beta}{u^\alpha} \to 0\).</p></div>
  </div>

<figcaption>Le rapport (ln x)³/x commence par croître : pour x ≤ e³ ≈ 20, le cube du logarithme l'emporte. Il passe par un maximum 27/e³ ≈ 1,34, puis décroît vers 0 (0,33 pour x = 1000, 0,003 pour x = 10⁶). Les croissances comparées, (ln x)³ = o(x) en +∞, décrivent ce qui se passe à la fin, pas au début : avec une puissance 10 du logarithme, (ln x)¹⁰ ne passe sous x qu'au-delà de 3 × 10¹⁵.</figcaption>

    <strong>Exemple — trois formes indéterminées réglées par les croissances comparées</strong>
    <ol>
      <li>\(\lim_{x \to +\infty}\dfrac{x^3 + \ln x}{e^{x/2}} = 0\) : \(\ln x = o(x^3)\) donc le numérateur est équivalent à \(x^3\), et \(x^3 = o(e^{x/2})\).</li>
      <li>\(\lim_{x \to 0^+}\sqrt x\,\ln x = 0\) (forme \(0 \times \infty\)) : c'est \(x^{1/2}|\ln x|^1 \to 0\), au signe près.</li>
      <li>\(\lim_{x \to -\infty} x^4e^x = 0\) : en posant \(y = -x \to +\infty\), \(x^4e^x = y^4e^{-y} \to 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Une information asymptotique, pas une inégalité.</strong> « \((\ln x)^{10} = o(x)\) » ne dit pas que \((\ln x)^{10} \lt x\) pour les valeurs que l'on rencontre : il faut aller au-delà de \(x \approx 3 \times 10^{15}\) pour que \(x\) l'emporte. Comme sur la figure, le rapport peut d'abord croître beaucoup avant de tendre vers 0.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CALCULER AVEC \(o\) ET \(O\)</div>
  <h2>Des règles d'écriture plutôt que des théorèmes</h2>
  <div class="intro">Dans un calcul asymptotique, on transporte des « restes » \(o(\cdot)\) sans les connaître exactement. Quelques règles permettent de les additionner, de les multiplier et de les simplifier ; elles se démontrent toutes en revenant aux quotients.</div>
  <div class="prop-box">
    <strong>Règles de calcul</strong> (au voisinage d'un même point \(a\), \(\lambda\) constante non nulle) :
    <ul>
      <li>\(o(g) + o(g) = o(g)\) et \(\lambda\,o(g) = o(g)\) ; idem avec \(O\) ;</li>
      <li>\(h \cdot o(g) = o(hg)\) et \(o(f)\cdot o(g) = o(fg)\) ;</li>
      <li><strong>transitivité</strong> : si \(f = o(g)\) et \(g = o(h)\), alors \(f = o(h)\) ; si \(f = o(g)\) et \(g = O(h)\), ou \(f = O(g)\) et \(g = o(h)\), alors \(f = o(h)\) ;</li>
      <li>si \(f = o(g)\) et \(g \sim h\), alors \(f = o(h)\) : on peut remplacer \(g\) par un équivalent dans un \(o(g)\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Puissances de \(x\).</strong> En 0, pour \(0 \le p \lt q\) : \(x^q = o(x^p)\), \(x^p\,o(x^q) = o(x^{p+q})\), \(o(x^p) + o(x^q) = o(x^p)\) (le plus petit exposant l'emporte). En \(+\infty\), c'est l'inverse : \(x^p = o(x^q)\) et \(o(x^p) + o(x^q) = o(x^q)\).
  </div>
  <div class="method-box">
    <strong>Exemple — simplifier une expression asymptotique en 0</strong>
    <ol>
      <li>\((x + o(x))(2 + 3x + o(x)) = 2x + 3x^2 + x\,o(x) + 2\,o(x) + \ldots\) : tous les termes après \(2x\) sont des \(o(x)\) (\(3x^2 = o(x)\), \(x\,o(x) = o(x^2) = o(x)\)), d'où \(2x + o(x)\).</li>
      <li>Comme \(\sin x = x + o(x)\) en 0 : \(\sin^2 x = x^2 + 2x\,o(x) + o(x)^2 = x^2 + o(x^2)\), soit \(\sin^2 x \sim x^2\).</li>
      <li>En \(+\infty\) : \(\dfrac{1}{x} + O\!\left(\dfrac{1}{x^2}\right) = \dfrac1x + o\!\left(\dfrac1x\right)\), car \(\frac{1}{x^2} = o\big(\frac1x\big)\) en \(+\infty\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : simplifier \(o(x) - o(x) = 0\). Les deux \(o(x)\) désignent des fonctions <strong>différentes</strong>, inconnues : leur différence est encore un \(o(x)\), pas 0. Et l'on ne divise pas par un reste : \(\frac{o(x^2)}{o(x)}\) n'a aucun sens.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CALCULER AVEC DES ÉQUIVALENTS</div>
  <h2>Produits, quotients, puissances, et les équivalents usuels</h2>
  <div class="intro">Un équivalent remplace une fonction compliquée par une fonction simple sans changer la limite d'un produit ou d'un quotient. C'est l'outil le plus rapide pour une limite de forme \(\frac00\) ou \(\frac\infty\infty\), à condition de rester dans les opérations permises.</div>
  <div class="prop-box">
    <strong>Opérations permises.</strong> L'équivalence est réflexive, symétrique et transitive. Si \(f_1 \sim g_1\) et \(f_2 \sim g_2\) en \(a\) :
    <ul>
      <li><strong>produit</strong> : \(f_1f_2 \sim g_1g_2\) ; <strong>quotient</strong> : \(\dfrac{f_1}{f_2} \sim \dfrac{g_1}{g_2}\) ;</li>
      <li><strong>puissance fixe</strong> : \(f_1^{\,\alpha} \sim g_1^{\,\alpha}\) pour tout réel \(\alpha\) <strong>constant</strong> (fonctions strictement positives si \(\alpha\) n'est pas entier) ;</li>
      <li><strong>changement de variable</strong> : si \(f \sim g\) en \(b\) et si \(\varphi(x) \to b\) quand \(x \to a\), alors \(f(\varphi(x)) \sim g(\varphi(x))\) en \(a\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Équivalents usuels en 0.</strong> Si \(f(0) = 0\) et \(f'(0) \ne 0\), le taux d'accroissement donne \(\frac{f(x)}{x} \to f'(0)\), donc \(f(x) \sim f'(0)\,x\). D'où, en 0 :
    <div class="formula" data-nom="Équivalents usuels en 0">$$\begin{gathered} \sin x \sim x, \quad \tan x \sim x, \quad \arcsin x \sim x, \quad \arctan x \sim x, \quad \operatorname{sh} x \sim x,\\ \ln(1 + x) \sim x, \quad e^x - 1 \sim x, \quad (1 + x)^\alpha - 1 \sim \alpha x \ (\alpha \ne 0), \quad 1 - \cos x \sim \frac{x^2}{2}, \quad \operatorname{ch} x - 1 \sim \frac{x^2}{2}. \end{gathered}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le cas de \(1 - \cos x\), où \(f'(0) = 0\).</span>
    <div class="content"><p>\(1 - \cos x = 2\sin^2\frac x2\). Par changement de variable, \(\sin\frac x2 \sim \frac x2\) ; par produit, \(2\sin^2\frac x2 \sim 2\cdot\frac{x^2}{4} = \frac{x^2}{2}\). De même \(\operatorname{ch} x - 1 = 2\operatorname{sh}^2\frac x2 \sim \frac{x^2}{2}\). Les autres équivalents viennent de la dérivée en 0 : \(\sin'(0) = 1\), \(\ln'(1) = 1\), \(\big((1 + x)^\alpha\big)'(0) = \alpha\)…</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — une limite \(\frac00\) par produit et quotient d'équivalents</strong>
    <ol>
      <li>\(\lim_{x \to 0}\dfrac{(e^{2x} - 1)\sin x}{1 - \cos x}\). Par changement de variable \(u = 2x \to 0\), \(e^{2x} - 1 \sim 2x\) ; \(\sin x \sim x\) ; \(1 - \cos x \sim \frac{x^2}{2}\).</li>
      <li>Produit et quotient : \(\dfrac{(e^{2x} - 1)\sin x}{1 - \cos x} \sim \dfrac{2x \cdot x}{x^2/2} = 4\). La limite vaut 4 (pour \(x = 0{,}01\), le quotient vaut \(4{,}04\)).</li>
      <li>Par changement de variable encore : \(\sin\frac1x \sim \frac1x\) en \(+\infty\) (car \(\frac1x \to 0\)), et \(\ln\!\big(1 + \frac1n\big) \sim \frac1n\) quand \(n \to +\infty\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · SOMMES ET COMPOSÉES : LES PIÈGES</div>
  <h2>Ce que l'on n'a pas le droit de faire, et comment s'en sortir</h2>
  <div class="intro">Les équivalents ne se comportent bien qu'avec les produits et les quotients. Une somme, une exponentielle, un logarithme ou une puissance variable peuvent les détruire. Chaque interdit a un contournement.</div>
  <div class="notice"><strong>Interdit n° 1 : ajouter des équivalents.</strong> En 0, \(x + x^2 \sim x\) et \(-x \sim -x\), mais la somme \(x^2\) n'est pas « équivalente à 0 ». On ne somme jamais des équivalents : on revient à la forme \(f = g + o(g)\), ou l'on factorise par le terme prépondérant, ou l'on utilise un développement limité.</div>
  <div class="method-box">
    <strong>Exemple — deux sommes traitées correctement</strong>
    <ol>
      <li>\(x^3 + 2x - \sin x\) en 0. On écrit \(\sin x = x + o(x)\) : \(2x - \sin x = x + o(x)\), et \(x^3 = o(x)\) ; donc \(x^3 + 2x - \sin x = x + o(x) \sim x\). Ici aucune compensation ne se produit.</li>
      <li>\(\tan x - \sin x\) en 0 : les termes en \(x\) se compensent, et \(\tan x - \sin x \sim x - x\) n'a pas de sens. On <strong>factorise</strong> : \(\tan x - \sin x = \tan x\,(1 - \cos x) \sim x\cdot\frac{x^2}{2} = \frac{x^3}{2}\). Contrôle : pour \(x = 0{,}1\), \(\tan x - \sin x \approx 0{,}000\,501\) et \(x^3/2 = 0{,}000\,5\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Interdit n° 2 : composer à gauche par une fonction.</strong> En \(+\infty\), \(x + 1 \sim x\), mais \(e^{x+1} = e\cdot e^x\) n'est pas équivalent à \(e^x\) (rapport \(e\)). De même, \(1 + \frac1x \sim 1\) mais \(\left(1 + \frac1x\right)^x \to e\), pas 1 : un exposant <strong>variable</strong> interdit de remplacer la base par un équivalent.</div>
  <div class="prop-box">
    <strong>Deux cas sûrs.</strong>
    <ul>
      <li><strong>Exponentielle</strong> : \(e^{f} \sim e^{g}\) si et seulement si \(f - g \to 0\) (car \(e^f/e^g = e^{f-g}\)). Ce n'est pas la même chose que \(f \sim g\).</li>
      <li><strong>Logarithme</strong> : si \(f \sim g\), avec \(f, g \gt 0\), et si \(g\) a une limite \(\ell \in [0, +\infty]\) <strong>différente de 1</strong>, alors \(\ln f \sim \ln g\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi la limite 1 est exclue pour le logarithme.</span>
    <div class="content"><p>\(\ln f = \ln g + \ln\frac fg\), et \(\ln\frac fg \to \ln 1 = 0\). Si \(\ell \ne 1\), \(\ln g\) tend vers \(\ln \ell \ne 0\) ou vers \(\pm\infty\) : une quantité qui tend vers 0 est alors négligeable devant \(\ln g\), et \(\ln f = \ln g + o(\ln g)\). Si \(\ell = 1\), \(\ln g \to 0\) et l'argument tombe : en 0, \(1 + x \sim 1 + 2x\), mais \(\ln(1 + x) \sim x\) et \(\ln(1 + 2x) \sim 2x\) ne sont pas équivalents.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — logarithme d'un polynôme en \(+\infty\)</strong>
    <p>\(x^2 + x \sim x^2\), qui tend vers \(+\infty \ne 1\) : donc \(\ln(x^2 + x) \sim \ln(x^2) = 2\ln x\). Directement : \(\ln(x^2 + x) = 2\ln x + \ln\!\big(1 + \frac1x\big)\), et le second terme tend vers 0, donc est négligeable devant \(2\ln x\).</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · PROPRIÉTÉS CONSERVÉES, ÉQUIVALENT PAR ENCADREMENT</div>
  <h2>Ce qu'un équivalent garde de la fonction</h2>
  <div class="intro">Deux fonctions équivalentes ont le même signe près du point et la même limite : c'est pour cela qu'on les remplace l'une par l'autre dans une limite. Quand aucun calcul direct ne marche, on obtient parfois un équivalent en encadrant.</div>
  <div class="prop-box">
    <strong>Propriétés conservées.</strong> Si \(f \sim g\) en \(a\) :
    <ul>
      <li>\(f\) et \(g\) ont le <strong>même signe</strong> au voisinage de \(a\) ;</li>
      <li>si \(g\) a une limite \(\ell\) (finie ou infinie) en \(a\), alors \(f\) a la même limite.</li>
    </ul>
    Pour \(\ell\) réel <strong>non nul</strong>, \(f \sim \ell\) équivaut à \(f \to \ell\). Pour \(\ell = 0\), non : \(f \to 0\) ne donne aucun équivalent.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">On écrit \(f = g \cdot \frac fg\).</span>
    <div class="content"><p>Comme \(\frac fg \to 1\), on a \(\frac fg \gt 0\) au voisinage de \(a\) (prendre \(\varepsilon = \frac12\) dans la définition de la limite) : \(f\) et \(g\) ont le même signe. Et \(f = g \times \frac fg\) a la limite de \(g\) multipliée par 1. Si \(\ell \ne 0\) est réel, \(\frac{f}{\ell} \to 1\) équivaut à \(f \to \ell\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Équivalent par encadrement.</strong> Si \(f \le g \le h\) au voisinage de \(a\) et si \(f \sim h\) en \(a\), alors \(g \sim f\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Diviser l'encadrement par \(f\).</span>
    <div class="content"><p>\(f\) ne s'annule pas près de \(a\) (\(f \sim h\)). Là où \(f \gt 0\) : \(1 \le \frac gf \le \frac hf\) ; là où \(f \lt 0\) : \(\frac hf \le \frac gf \le 1\). Dans les deux cas \(\frac gf\) est compris entre 1 et \(\frac hf\), qui tend vers 1 : par encadrement, \(\frac gf \to 1\).</p></div>

    <strong>Exemple — trois équivalents par encadrement</strong>
    <ol>
      <li>Partie entière : en \(+\infty\), \(x - 1 \lt \lfloor x \rfloor \le x\) et \(x - 1 \sim x\), donc \(\lfloor x \rfloor \sim x\).</li>
      <li>\(x + \sin x\) en \(+\infty\) : \(x - 1 \le x + \sin x \le x + 1\) et \(x - 1 \sim x + 1\) (rapport \(\to 1\)), donc \(x + \sin x \sim x\) (figure).</li>
      <li>\(S_n = \displaystyle\sum_{k=1}^{n}\frac{1}{n^2 + k}\) : chacun des \(n\) termes est entre \(\frac{1}{n^2 + n}\) et \(\frac{1}{n^2 + 1}\), donc \(\frac{n}{n^2 + n} \le S_n \le \frac{n}{n^2 + 1}\). Les deux bornes sont équivalentes à \(\frac1n\) : \(S_n \sim \frac1n\). Pour \(n = 100\), \(S_n \approx 0{,}009\,950\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure d'un encadrement \(f \le g \le h\) avec \(f \to 0\) et \(h \to 0\) que \(g\) a un équivalent. Il faut \(f \sim h\), ce qui est bien plus fort : \(0 \le x^2 \le x\) en \(0^+\) ne dit rien d'un équivalent de \(x^2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LEVER UNE FORME INDÉTERMINÉE</div>
  <h2>Une démarche en trois temps</h2>
  <div class="intro">Face à une limite indéterminée, on commence par les équivalents (produits et quotients), on passe par l'exponentielle pour les puissances variables, et l'on bascule vers les développements limités dès qu'une somme se compense.</div>
  <div class="method-box">
    <strong>Méthode — choisir l'outil</strong>
    <ol>
      <li><span class="step">Étape 1.</span> <strong>Produit ou quotient</strong> de facteurs simples : remplacer chaque facteur par un équivalent (§4), en vérifiant que l'on ne touche à aucune somme.</li>
      <li><span class="step">Étape 2.</span> <strong>Puissance variable</strong> \(u(x)^{v(x)}\) (formes \(1^\infty\), \(0^0\), \(\infty^0\)) : écrire \(u^v = \exp\big(v\ln u\big)\), chercher la limite de \(v\ln u\) (avec \(\ln u \sim u - 1\) si \(u \to 1\)), puis conclure par continuité de \(\exp\).</li>
      <li><span class="step">Étape 3.</span> <strong>Somme avec compensation</strong> (les termes principaux s'annulent) : factoriser si possible ; sinon, développement limité à l'ordre où apparaît le premier terme non nul (chapitre des développements limités).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — formes \(1^\infty\) et \(0^0\)</strong>
    <ol>
      <li>\(\lim_{x \to +\infty}\left(1 + \dfrac3x\right)^x\). On écrit \(\exp\!\big(x\ln(1 + \frac3x)\big)\). Comme \(\frac3x \to 0\), \(\ln(1 + \frac3x) \sim \frac3x\), donc \(x\ln(1 + \frac3x) \sim 3\) : l'exposant tend vers 3 et la limite vaut \(e^3 \approx 20{,}09\). Pour \(x = 1000\), on trouve déjà \(19{,}996\).</li>
      <li>\(\lim_{x \to 0^+} x^x = \lim e^{x\ln x} = e^0 = 1\), par croissances comparées (\(x\ln x \to 0\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Quand les équivalents ne suffisent pas.</strong> \(\lim_{x \to 0}\dfrac{x - \sin x}{x^3}\) : le numérateur est une différence de deux fonctions équivalentes à \(x\), et « \(x - x = 0\) » ne donne rien. Il faut savoir que \(\sin x = x - \frac{x^3}{6} + o(x^3)\) : le numérateur vaut \(\frac{x^3}{6} + o(x^3)\) et la limite \(\frac16\). C'est l'objet du chapitre des développements limités, qui donne la seconde forme \(f = g + o(g)\) avec autant de termes qu'il le faut.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · LE CAS DES SUITES</div>
  <h2>Les mêmes relations quand \(n \to +\infty\)</h2>
  <div class="intro">Une suite est une fonction de \(n\) qui tend vers \(+\infty\) : tout ce qui précède s'adapte sans changement. Les relations de comparaison des suites décident de la nature des séries (chapitre « Séries numériques ») et mesurent la vitesse de convergence d'une méthode numérique.</div>
  <div class="def-box">
    Soit \((u_n)\) et \((v_n)\), \(v_n\) non nul à partir d'un certain rang : \(u_n = o(v_n)\) si \(\frac{u_n}{v_n} \to 0\) ; \(u_n = O(v_n)\) si \(\big(\frac{u_n}{v_n}\big)\) est bornée ; \(u_n \sim v_n\) si \(\frac{u_n}{v_n} \to 1\). Règles de calcul, propriétés conservées et encadrement sont les mêmes que pour les fonctions.
  </div>
  <div class="prop-box">
    <strong>Croissances comparées des suites.</strong> Pour \(\alpha \gt 0\), \(\beta \gt 0\) et \(q \gt 1\) :
    <div class="formula" data-nom="Croissances comparées (suites)">$$(\ln n)^\beta = o(n^\alpha), \qquad n^\alpha = o(q^n), \qquad q^n = o(n!), \qquad n! = o(n^n).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Les deux dernières, par un quotient de termes consécutifs.</span>
    <div class="content"><p>Les deux premières viennent du §2 avec \(x = n\). Pour \(w_n = \frac{q^n}{n!}\) : \(\frac{w_{n+1}}{w_n} = \frac{q}{n + 1} \le \frac12\) dès que \(n + 1 \ge 2q\), donc \(w_n\) est majorée par une suite géométrique de raison \(\frac12\) et tend vers 0. Pour \(\frac{n!}{n^n} = \frac{1}{n}\cdot\frac{2}{n}\cdots\frac{n}{n}\), chaque facteur est au plus 1 et le premier vaut \(\frac1n\) : \(0 \lt \frac{n!}{n^n} \le \frac1n \to 0\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — quatre suites</strong>
    <ol>
      <li>\(\dfrac{n^3 + 2^n}{n! + 3^n} \sim \dfrac{2^n}{n!}\) (on garde le terme prépondérant en haut et en bas), donc la suite tend vers 0.</li>
      <li>Par changement de variable (\(\frac1n \to 0\)) : \(n\sin\frac1n \to 1\) et \(n\big(e^{1/n} - 1\big) \to 1\).</li>
      <li>Avec la quantité conjuguée : \(\sqrt{n + 1} - \sqrt n = \dfrac{1}{\sqrt{n + 1} + \sqrt n} \sim \dfrac{1}{2\sqrt n}\).</li>
      <li>\(\left(1 + \dfrac an\right)^n = \exp\!\big(n\ln(1 + \frac an)\big) \to e^a\), car \(n\ln(1 + \frac an) \sim n\cdot\frac an = a\) (\(a \ne 0\)).</li>
    </ol>
  </div>
  <h3>Vitesse de convergence</h3>
  <p>Deux suites peuvent avoir la même limite \(\ell\) en s'en approchant très différemment. On compare l'erreur \(|u_n - \ell|\) à des suites de référence : convergence <strong>lente</strong> si l'erreur est de l'ordre de \(\frac{1}{n^p}\), <strong>géométrique</strong> si elle est un \(O(k^n)\) avec \(0 \lt k \lt 1\) (dichotomie, suites récurrentes contractantes du chapitre « Continuité et dérivabilité »), <strong>quadratique</strong> si l'erreur au rang \(n + 1\) est de l'ordre du carré de l'erreur au rang \(n\) (méthode de Newton).</p>

  <div class="method-box">
    <strong>Exemple — combien d'itérations pour \(10^{-6}\) ?</strong>
    <ol>
      <li>Erreur en \(\frac1n\) : il faut \(n \ge 10^6\) termes.</li>
      <li>Erreur en \(2^{-n}\) (dichotomie sur un intervalle de longueur 1) : \(n \ge 20\), car \(2^{20} \approx 10^6\).</li>
      <li>Newton pour \(\sqrt2\), \(u_{n+1} = \frac12\big(u_n + \frac2{u_n}\big)\), \(u_0 = 1\) : erreurs \(0{,}41\) ; \(0{,}086\) ; \(0{,}002\,5\) ; \(2{,}1 \times 10^{-6}\) ; \(1{,}6 \times 10^{-12}\) : quatre itérations donnent douze décimales.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une suite équivalente à une autre en a la vitesse de convergence. \(u_n \sim v_n\) avec \(u_n, v_n \to \ell \ne 0\) ne dit <strong>rien</strong> de \(u_n - \ell\) : \(1 + \frac1n \sim 1 + \frac{1}{n^2}\). Pour comparer des vitesses, on cherche un équivalent de l'<strong>erreur</strong> \(u_n - \ell\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Stirling, échelles et sommation</h2>
  <div class="intro">Ces résultats ne sont pas exigibles en PTSI. Un énoncé de concours qui s'en sert les rappelle.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Formule de Stirling</span>
    <span class="prompt">Un équivalent de \(n!\).</span>
    <div class="content"><p>\(n! \sim \sqrt{2\pi n}\,\left(\dfrac ne\right)^n\) quand \(n \to +\infty\). Pour \(n = 10\) : \(10! = 3\,628\,800\) et la formule donne \(3\,598\,696\), soit un rapport \(1{,}008\). Elle donne par exemple \(\binom{2n}{n} \sim \dfrac{4^n}{\sqrt{\pi n}}\).</p></div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Développements asymptotiques</span>
    <span class="prompt">Plusieurs termes de tailles décroissantes.</span>
    <div class="content"><p>Un équivalent ne donne que le terme principal. Un <strong>développement asymptotique</strong> en donne plusieurs, de tailles décroissantes, pris dans une échelle de comparaison (par exemple les \(x^a(\ln x)^b\)) : ainsi la somme harmonique vérifie \(\sum_{k=1}^n \frac1k = \ln n + \gamma + \frac{1}{2n} + o\big(\frac1n\big)\), où \(\gamma \approx 0{,}577\). Les développements limités en sont le cas particulier où l'échelle est celle des puissances \(x^k\).</p></div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Sommation des relations de comparaison</span>
    <span class="prompt">Du terme général aux sommes partielles.</span>
    <div class="content"><p>Pour des séries à termes positifs, si \(u_n \sim v_n\) et si \(\sum v_n\) diverge, alors les sommes partielles sont équivalentes : \(\sum_{k \le n} u_k \sim \sum_{k \le n} v_k\). Ce résultat n'est au programme ni de PTSI ni de PT : en pratique, on obtient de tels équivalents par la comparaison série-intégrale (chapitre « Séries numériques »).</p></div>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="asy-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ANALYSE ASYMPTOTIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Choisir la bonne relation, se ramener en 0, utiliser les croissances comparées, trouver un équivalent d'un produit, d'une somme ou d'une puissance, lever une forme indéterminée, encadrer, étudier une suite : chaque méthode donne l'ordre des questions à se poser et un exemple éclair vérifié. Les notations sont celles du cours (§1 à §8) ; pour les sommes qui se compensent, voir le chapitre des développements limités.</div>

  <div class="method-box">
    <strong>Méthode 1 — Se ramener en 0 et écrire la bonne relation</strong>
    <ol>
      <li><span class="step">Étape 1.</span> En un point \(a \ne 0\), poser \(x = a + h\), \(h \to 0\) ; en \(\pm\infty\), poser \(t = 1/x \to 0\) (ou garder \(x\) et comparer à des puissances de \(x\)).</li>
      <li><span class="step">Étape 2.</span> Choisir la relation : \(o\) pour « négligeable », \(O\) pour « au plus de l'ordre de », \(\sim\) pour « même terme principal ».</li>
      <li><span class="step">Étape 3.</span> Dans les calculs, écrire l'équivalence sous la forme \(f = g + o(g)\), qui se manipule comme une égalité.</li>
    </ol>
    <p><em>Exemple éclair :</em> en 1, \(\ln x = \ln(1 + h) \sim h\), soit \(\ln x \sim x - 1\) quand \(x \to 1\) ; en \(\frac\pi2\), \(\cos\big(\frac\pi2 + h\big) = -\sin h \sim -h\), soit \(\cos x \sim \frac\pi2 - x\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Utiliser les croissances comparées</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Mettre l'expression sous la forme d'un produit \(x^\alpha(\ln x)^\beta e^{\gamma x}\) (ou d'un quotient de tels produits).</li>
      <li><span class="step">Étape 2.</span> Le facteur le plus « fort » décide : en \(+\infty\), l'exponentielle l'emporte sur les puissances, qui l'emportent sur les logarithmes ; en \(0^+\), la puissance de \(x\) l'emporte sur le logarithme.</li>
      <li><span class="step">Étape 3.</span> En \(-\infty\) ou pour un exposant compliqué, faire un changement de variable (\(y = -x\), \(u = \sqrt x\)…) ou passer au logarithme.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x^{100}e^{-x/10} \to 0\) en \(+\infty\) (l'exponentielle gagne, même lentement) ; \(x(\ln x)^2 \to 0\) en \(0^+\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Trouver un équivalent d'un produit ou d'un quotient</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Repérer chaque facteur et le point de travail ; vérifier que chaque argument tend vers le point où l'équivalent usuel est valable (\(u \to 0\) pour \(\sin u \sim u\)).</li>
      <li><span class="step">Étape 2.</span> Remplacer chaque facteur par un équivalent simple (équivalents usuels, terme prépondérant d'un polynôme).</li>
      <li><span class="step">Étape 3.</span> Multiplier, diviser, simplifier ; la limite de l'équivalent est celle de la fonction.</li>
    </ol>
    <p><em>Exemple éclair :</em> en 0, \(\dfrac{\sin(2x)\,(e^{3x} - 1)}{x\ln(1 + x)} \sim \dfrac{2x \cdot 3x}{x \cdot x} = 6\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Trouver un équivalent d'une somme</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Comparer les termes deux à deux : si l'un domine tous les autres (les autres sont des \(o\) de lui), la somme lui est équivalente.</li>
      <li><span class="step">Étape 2.</span> Si les termes principaux se <strong>compensent</strong>, ne jamais « soustraire les équivalents » : factoriser (\(\tan x - \sin x = \tan x(1 - \cos x)\)), multiplier par la quantité conjuguée, ou faire un développement limité.</li>
      <li><span class="step">Étape 3.</span> Contrôler sur une valeur numérique.</li>
    </ol>
    <p><em>Exemple éclair :</em> en \(+\infty\), \(\sqrt{x^2 + 1} - x = \dfrac{1}{\sqrt{x^2 + 1} + x} \sim \dfrac{1}{2x}\) (pour \(x = 100\) : \(0{,}004\,999\,9\) contre \(0{,}005\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Traiter une puissance variable, un logarithme, une exponentielle</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire \(u^v = \exp(v\ln u)\) et chercher la limite (ou un équivalent) de \(v\ln u\).</li>
      <li><span class="step">Étape 2.</span> Si \(u \to 1\) : \(\ln u \sim u - 1\). Si \(u\) tend vers une limite \(\ne 1\) : \(\ln u \sim \ln(\text{équivalent de } u)\).</li>
      <li><span class="step">Étape 3.</span> Conclure par continuité de \(\exp\) pour une limite ; pour un équivalent de \(e^f\), il faut \(f - g \to 0\), pas seulement \(f \sim g\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\left(1 - \frac2n\right)^n = \exp\!\big(n\ln(1 - \frac2n)\big)\) et \(n\ln(1 - \frac2n) \sim n\cdot\big(-\frac2n\big) = -2\) : la limite vaut \(e^{-2}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Calculer une limite avec des équivalents</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Identifier la forme indéterminée.</li>
      <li><span class="step">Étape 2.</span> Écrire l'expression comme produit ou quotient de facteurs simples ; remplacer chacun par son équivalent (méthode 3).</li>
      <li><span class="step">Étape 3.</span> Si une somme bloque (compensation), passer au développement limité à l'ordre du premier terme non nul.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\lim_{x \to 0}\dfrac{1 - \cos 3x}{x\sin 2x}\) : \(1 - \cos 3x \sim \frac{9x^2}{2}\) et \(x\sin 2x \sim 2x^2\), donc la limite vaut \(\frac94\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Obtenir un équivalent par encadrement</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Quand la fonction (ou la somme) ne se calcule pas, l'encadrer par deux expressions simples : partie entière à 1 près, \(\sin\) et \(\cos\) entre \(-1\) et 1, terme général d'une somme entre son plus petit et son plus grand terme.</li>
      <li><span class="step">Étape 2.</span> Vérifier que les deux bornes sont <strong>équivalentes entre elles</strong> ; si oui, la fonction leur est équivalente.</li>
      <li><span class="step">Étape 3.</span> Si les bornes ne sont pas équivalentes, l'encadrement donne seulement un ordre de grandeur (un \(O\)) : chercher une autre méthode (somme de Riemann, comparaison série-intégrale).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sqrt n - 1 \lt \lfloor\sqrt n\rfloor \le \sqrt n\), et \(\sqrt n - 1 \sim \sqrt n\) : donc \(\lfloor\sqrt n\rfloor \sim \sqrt n\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Étudier une suite : équivalent, limite, vitesse</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Dans un quotient de sommes, garder en haut et en bas le terme prépondérant (croissances comparées des suites : \((\ln n)^\beta \ll n^\alpha \ll q^n \ll n! \ll n^n\)).</li>
      <li><span class="step">Étape 2.</span> Pour une expression en \(\frac1n\), utiliser les équivalents usuels en 0 par changement de variable.</li>
      <li><span class="step">Étape 3.</span> Pour la vitesse de convergence, chercher un équivalent (ou une majoration) de l'<strong>erreur</strong> \(u_n - \ell\), puis le rang à partir duquel elle passe sous la précision voulue.</li>
    </ol>
    <p><em>Exemple éclair :</em> une erreur égale à \(\frac{n}{2^n}\) passe sous \(10^{-6}\) à partir de \(n = 25\) (\(\frac{24}{2^{24}} \approx 1{,}4 \times 10^{-6}\), \(\frac{25}{2^{25}} \approx 7{,}5 \times 10^{-7}\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Trouver l'équivalent d'un polynôme ou d'une fraction rationnelle</strong>
    <ol>
      <li><span class="step">Étape 1.</span> En 0 : terme de plus <strong>bas</strong> degré ; en \(\pm\infty\) : terme de plus <strong>haut</strong> degré.</li>
      <li><span class="step">Étape 2.</span> Pour une fraction rationnelle, faire le quotient des équivalents du numérateur et du dénominateur.</li>
      <li><span class="step">Étape 3.</span> En un point \(a \ne 0\) racine du polynôme : poser \(x = a + h\) et développer (le terme de plus bas degré en \(h\) donne l'équivalent).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x^3 - 8 = (2 + h)^3 - 8 = 12h + 6h^2 + h^3\), donc \(x^3 - 8 \sim 12(x - 2)\) quand \(x \to 2\) ; et \(\dfrac{x^2 - 3x}{2x^3 + 1} \sim \dfrac{1}{2x}\) en \(+\infty\), \(\sim -3x\) en 0.</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong>
    <ul>
      <li>On n'additionne pas des équivalents, et l'on n'écrit jamais \(f \sim 0\).</li>
      <li>Un équivalent est attaché à un point : \(3x^2 + x \sim x\) en 0, mais \(\sim 3x^2\) en \(+\infty\).</li>
      <li>\(f \sim g\) n'entraîne ni \(e^f \sim e^g\), ni \(f - g \to 0\) ; ni \(\ln f \sim \ln g\) quand \(g \to 1\).</li>
      <li>Un exposant qui varie interdit de remplacer la base : \(\left(1 + \frac1n\right)^n \to e\), pas 1.</li>
      <li>\(o(x) - o(x)\) n'est pas nul, et le « \(=\) » de \(f = o(g)\) ne se lit que de gauche à droite.</li>
      <li>Les croissances comparées sont asymptotiques : \((\ln x)^{10}\) reste plus grand que \(x\) jusqu'à \(x \approx 3 \times 10^{15}\).</li>
    </ul>
  </div>
</div>
</template>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Équivalents et limites simples</h3>
  <div class="statement">Utiliser les équivalents usuels en 0 et le changement de variable (§4).</div>
  <div class="q"><strong>Q1.</strong> Trouver un équivalent simple de \(\sin(3x)\) quand \(x \to 0\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\lim_{x\to0}\dfrac{\ln(1+x^2)}{1-\cos x}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la limite de \(n\sin(1/n)\) quand \(n\to+\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\sin u \sim u\) en 0, et \(u = 3x \to 0\) : \(\sin(3x) \sim 3x\) quand \(x\to0\).</p>
    <p><strong>Q2.</strong> \(\ln(1+u) \sim u\) avec \(u = x^2 \to 0\), donc \(\ln(1+x^2) \sim x^2\) ; et \(1-\cos x \sim \frac{x^2}{2}\). Le quotient d'équivalents est permis : \(\dfrac{\ln(1+x^2)}{1-\cos x} \sim \dfrac{x^2}{x^2/2} = 2\). La limite vaut 2.</p>
    <p><strong>Q3.</strong> Posons \(h = 1/n \to 0\). Alors \(\sin h \sim h\), donc \(n\sin\frac1n = \dfrac{\sin h}{h} \to 1\). (On peut dire aussi \(n\sin\frac1n \sim n\cdot\frac1n = 1\).)</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Croissances comparées</h3>
  <div class="statement">Les quatre premières questions se règlent par le §2 ; la dernière passe par l'exponentielle.</div>
  <div class="q"><strong>Q1.</strong> \(\lim_{x \to +\infty}\dfrac{(\ln x)^5}{\sqrt x}\).</div>
  <div class="q"><strong>Q2.</strong> \(\lim_{x \to 0^+} x^2(\ln x)^3\).</div>
  <div class="q"><strong>Q3.</strong> \(\lim_{n \to +\infty}\dfrac{n^{10}}{1{,}01^n}\).</div>
  <div class="q"><strong>Q4.</strong> Ranger en \(+\infty\), de la plus petite à la plus grande au sens de \(o\) : \(e^x\), \(x^{100}\), \((\ln x)^{100}\), \(e^{\sqrt x}\), \(x^{0{,}01}\).</div>
  <div class="q"><strong>Q5.</strong> \(\lim_{x \to +\infty} x^{1/x}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \((\ln x)^5 = o(x^{1/2})\) en \(+\infty\) (\(\beta = 5\), \(\alpha = \frac12\)) : la limite vaut 0.</p>
    <p><strong>Q2.</strong> En \(0^+\), \(x^2|\ln x|^3 \to 0\) : la limite vaut 0 (le signe moins de \((\ln x)^3\) ne change rien).</p>
    <p><strong>Q3.</strong> \(1{,}01^n = e^{n\ln 1{,}01}\) avec \(\ln 1{,}01 \gt 0\) : c'est une suite géométrique de raison \(q = 1{,}01 \gt 1\), et \(n^{10} = o(q^n)\). La limite vaut 0, même si la décroissance ne commence qu'au-delà de \(n \approx 1000\).</p>
    <p><strong>Q4.</strong> On compare les logarithmes : \(100\ln\ln x\), \(0{,}01\ln x\), \(100\ln x\), \(\sqrt x\), \(x\). Chacun est négligeable devant le suivant, et la différence de deux logarithmes consécutifs tend vers \(-\infty\), donc le quotient des fonctions tend vers 0 :</p>
    <div class="formula">$$(\ln x)^{100} = o\big(x^{0{,}01}\big), \quad x^{0{,}01} = o\big(x^{100}\big), \quad x^{100} = o\big(e^{\sqrt x}\big), \quad e^{\sqrt x} = o(e^x).$$</div>
    <p>Par exemple, \(\dfrac{x^{100}}{e^{\sqrt x}} = \exp\big(100\ln x - \sqrt x\big)\) et \(100\ln x = o(\sqrt x)\), donc l'exposant tend vers \(-\infty\).</p>
    <p><strong>Q5.</strong> \(x^{1/x} = \exp\!\left(\dfrac{\ln x}{x}\right)\) et \(\dfrac{\ln x}{x} \to 0\) : par continuité de \(\exp\), la limite vaut \(e^0 = 1\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Vrai ou faux : manipuler \(o\), \(O\) et \(\sim\)</h3>
  <div class="statement">Dire si chaque affirmation est vraie ou fausse, en justifiant (preuve courte ou contre-exemple). Le point est précisé.</div>
  <div class="q"><strong>Q1.</strong> En 0 : \(o(x^2) + o(x^3) = o(x^2)\). Et en \(+\infty\) ?</div>
  <div class="q"><strong>Q2.</strong> En 0 : \(x \cdot o(x^2) = o(x^3)\).</div>
  <div class="q"><strong>Q3.</strong> En 0 : \(o(x) - o(x) = 0\).</div>
  <div class="q"><strong>Q4.</strong> En \(+\infty\) : si \(f = O\big(\frac1x\big)\), alors \(f = o(1)\).</div>
  <div class="q"><strong>Q5.</strong> Si \(f \sim g\) en \(a\), alors \(f - g \to 0\).</div>
  <div class="q"><strong>Q6.</strong> Si \(f \sim g\) en \(a\) et si \(g \to 0\), alors \(f - g = o(g)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Vrai en 0 : \(x^3 = o(x^2)\), donc un \(o(x^3)\) est aussi un \(o(x^2)\) (transitivité), et la somme de deux \(o(x^2)\) en est un. En \(+\infty\), c'est l'inverse : \(x^2 = o(x^3)\), et \(o(x^2) + o(x^3) = o(x^3)\).</p>
    <p><strong>Q2.</strong> Vrai : \(\dfrac{x \cdot o(x^2)}{x^3} = \dfrac{o(x^2)}{x^2} \to 0\).</p>
    <p><strong>Q3.</strong> Faux : les deux restes sont des fonctions différentes. Avec \(x^2 = o(x)\) et \(x^3 = o(x)\) en 0, la différence \(x^2 - x^3\) n'est pas nulle. Ce qui est vrai : \(o(x) - o(x) = o(x)\).</p>
    <p><strong>Q4.</strong> Vrai : \(|f| \le \frac Cx\) au voisinage de \(+\infty\), et \(\frac Cx \to 0\), donc \(f \to 0\) par encadrement.</p>
    <p><strong>Q5.</strong> Faux : en \(+\infty\), \(x^2 + x \sim x^2\) mais la différence \(x\) tend vers \(+\infty\). L'équivalence contrôle l'écart <strong>relatif</strong>, pas l'écart absolu (figure du §6 : \(x + \sin x \sim x\) avec un écart sans limite).</p>
    <p><strong>Q6.</strong> Vrai, et même sans l'hypothèse \(g \to 0\) : c'est la seconde forme de l'équivalence, \(f \sim g \iff f - g = o(g)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Limites par équivalents</h3>
  <div class="statement">Calculer les limites suivantes à l'aide d'équivalents (§4, §5, §7).</div>
  <div class="q"><strong>Q1.</strong> \(\lim_{x \to 0}\dfrac{\sin(3x)\ln(1 + 2x)}{x\tan x}\).</div>
  <div class="q"><strong>Q2.</strong> \(\lim_{x \to 0}\dfrac{\ln(\cos x)}{x^2}\).</div>
  <div class="q"><strong>Q3.</strong> \(\lim_{x \to 0}\dfrac{e^{x^2} - 1}{1 - \cos(2x)}\).</div>
  <div class="q"><strong>Q4.</strong> \(\lim_{x \to +\infty} x\left(e^{1/x} - 1\right)\).</div>
  <div class="q"><strong>Q5.</strong> \(\lim_{x \to 0^+}(1 + \sin x)^{1/x}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\sin 3x \sim 3x\), \(\ln(1 + 2x) \sim 2x\), \(\tan x \sim x\) : le quotient est équivalent à \(\dfrac{3x \cdot 2x}{x \cdot x} = 6\). Limite : 6.</p>
    <p><strong>Q2.</strong> On écrit \(\cos x = 1 + u\) avec \(u = \cos x - 1 \to 0\). Alors \(\ln(1 + u) \sim u\), soit \(\ln(\cos x) \sim \cos x - 1 \sim -\frac{x^2}{2}\). Limite : \(-\frac12\). (On ne peut pas dire « \(\cos x \sim 1\) donc \(\ln\cos x \sim \ln 1 = 0\) » : la limite 1 est justement exclue pour le logarithme, §5.)</p>
    <p><strong>Q3.</strong> \(e^{x^2} - 1 \sim x^2\) (changement de variable \(u = x^2\)) et \(1 - \cos 2x \sim \frac{(2x)^2}{2} = 2x^2\) : limite \(\frac12\).</p>
    <p><strong>Q4.</strong> Avec \(u = \frac1x \to 0\), \(e^{u} - 1 \sim u\) : \(x\left(e^{1/x} - 1\right) \sim x \cdot \frac1x = 1\). Limite : 1.</p>
    <p><strong>Q5.</strong> Forme \(1^\infty\). \((1 + \sin x)^{1/x} = \exp\!\left(\dfrac{\ln(1 + \sin x)}{x}\right)\). Comme \(\sin x \to 0\), \(\ln(1 + \sin x) \sim \sin x \sim x\), donc l'exposant tend vers 1 et la limite vaut \(e\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Équivalents de sommes : terme prépondérant ou compensation ?</h3>
  <div class="statement">Pour chaque somme, repérer d'abord si un terme domine ou si les termes principaux se compensent (§5).</div>
  <div class="q"><strong>Q1.</strong> \(\sqrt{x + 1} - \sqrt x\) en \(+\infty\).</div>
  <div class="q"><strong>Q2.</strong> \(3x^2 - \sin(2x) + x^3\) en 0.</div>
  <div class="q"><strong>Q3.</strong> \(\ln(x + 1) - \ln x\) en \(+\infty\).</div>
  <div class="q"><strong>Q4.</strong> \(\tan x - x\) en 0 : pourquoi les équivalents usuels ne suffisent-ils pas ? Conclure avec \(\tan x = x + \frac{x^3}{3} + o(x^3)\) (chapitre des développements limités).</div>
  <div class="q"><strong>Q5.</strong> \(\dfrac{1}{x - 1} - \dfrac1x\) en \(+\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Compensation (les deux racines sont équivalentes à \(\sqrt x\)) : quantité conjuguée, \(\sqrt{x + 1} - \sqrt x = \dfrac{1}{\sqrt{x + 1} + \sqrt x}\). Le dénominateur est équivalent à \(2\sqrt x\) (somme de deux termes positifs équivalents à \(\sqrt x\) : ici on peut, car \(\sqrt{x + 1} + \sqrt x = 2\sqrt x\,(1 + o(1))\)). Donc la différence est équivalente à \(\dfrac{1}{2\sqrt x}\).</p>
    <p><strong>Q2.</strong> Pas de compensation : \(\sin 2x = 2x + o(x)\), \(3x^2 = o(x)\), \(x^3 = o(x)\). La somme vaut \(-2x + o(x)\), donc elle est équivalente à \(-2x\).</p>
    <p><strong>Q3.</strong> Compensation : on regroupe, \(\ln(x + 1) - \ln x = \ln\!\left(1 + \dfrac1x\right) \sim \dfrac1x\).</p>
    <p><strong>Q4.</strong> \(\tan x \sim x\) et \(x \sim x\) : les termes principaux se compensent et « \(x - x\) » ne donne rien (on n'ajoute pas des équivalents). Le développement limité donne le terme suivant : \(\tan x - x = \frac{x^3}{3} + o(x^3) \sim \frac{x^3}{3}\).</p>
    <p><strong>Q5.</strong> Réduction au même dénominateur : \(\dfrac{1}{x - 1} - \dfrac1x = \dfrac{1}{x(x - 1)} \sim \dfrac{1}{x^2}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Équivalents par encadrement, et une limite de la méthode</h3>
  <div class="statement">On utilise l'équivalent par encadrement (§6).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(x + 3\sin x \sim x\) en \(+\infty\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(S_n = \displaystyle\sum_{k=1}^{n}\sqrt{n^2 + k} \sim n^2\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(T_n = \displaystyle\sum_{k=1}^{n}\frac{n}{n^2 + k^2}\). Montrer que \(\frac12 \le T_n \le 1\). Peut-on en déduire un équivalent de \(T_n\) ? Calculer la limite de \(T_n\) en reconnaissant une somme de Riemann.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(x \gt 0\), \(x - 3 \le x + 3\sin x \le x + 3\), et \(\dfrac{x + 3}{x - 3} \to 1\) : les bornes sont équivalentes, donc \(x + 3\sin x \sim x - 3 \sim x\).</p>
    <p><strong>Q2.</strong> Chaque terme vérifie \(n \le \sqrt{n^2 + k} \le \sqrt{n^2 + n}\) ; en sommant les \(n\) termes : \(n^2 \le S_n \le n\sqrt{n^2 + n}\). Or \(n\sqrt{n^2 + n} = n^2\sqrt{1 + \frac1n} \sim n^2\). Les bornes sont équivalentes : \(S_n \sim n^2\).</p>
    <p><strong>Q3.</strong> Pour \(1 \le k \le n\), \(n^2 + 1 \le n^2 + k^2 \le 2n^2\), donc \(\dfrac{n}{2n^2} \le \dfrac{n}{n^2 + k^2} \le \dfrac{n}{n^2 + 1}\) ; en sommant, \(\dfrac12 \le T_n \le \dfrac{n^2}{n^2 + 1} \le 1\). Les bornes \(\frac12\) et \(\frac{n^2}{n^2 + 1} \to 1\) ne sont <strong>pas</strong> équivalentes : on obtient seulement \(T_n = O(1)\), et l'on ne peut rien conclure de plus. Or \(T_n = \dfrac1n\displaystyle\sum_{k=1}^n\frac{1}{1 + (k/n)^2}\) est une somme de Riemann de \(t \mapsto \frac{1}{1 + t^2}\) sur \([0, 1]\) (chapitre « Intégrales ») : \(T_n \to \displaystyle\int_0^1\frac{\mathrm{d}t}{1 + t^2} = \frac\pi4\), donc \(T_n \sim \frac\pi4\). Numériquement \(T_{10} \approx 0{,}760\), \(T_{100} \approx 0{,}783\), \(\frac\pi4 \approx 0{,}785\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Équivalent d'une suite et séries télescopiques</h3>
  <div class="statement">Deux suites qui tendent vers 0 et les séries associées.</div>
  <div class="q"><strong>Q1.</strong> Trouver un équivalent de \(u_n = \sqrt{n+1} - \sqrt{n}\) quand \(n\to+\infty\).</div>
  <div class="q"><strong>Q2.</strong> En déduire la nature de la série \(\sum_{n \ge 1}(\sqrt{n+1}-\sqrt{n})\) et calculer ses sommes partielles.</div>
  <div class="q"><strong>Q3.</strong> Trouver un équivalent de \(v_n = \ln(n+1) - \ln(n)\). Même question pour \(\sum v_n\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Quantité conjuguée : \(u_n = \dfrac{1}{\sqrt{n+1}+\sqrt{n}} \sim \dfrac{1}{2\sqrt{n}}\).</p>
    <p><strong>Q2.</strong> La série est télescopique : \(\sum_{k=1}^n u_k = \sqrt{n+1}-1 \to +\infty\). Elle diverge. L'équivalent \(u_n \sim \frac{1}{2\sqrt{n}}\) le confirme : c'est le terme d'une série de Riemann d'exposant \(\frac12 \le 1\), divergente (chapitre « Séries numériques »). Un terme général qui tend vers 0 ne suffit donc pas à la convergence.</p>
    <p><strong>Q3.</strong> \(v_n = \ln\!\left(1+\frac1n\right) \sim \frac1n\). Série télescopique : \(\sum_{k=1}^n v_k = \ln(n+1)\to+\infty\), elle diverge, comme la série harmonique \(\sum\frac1n\) à laquelle elle est comparable.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Logarithmes et exponentielles d'équivalents</h3>
  <div class="statement">On applique les règles sûres du §5 et la méthode 5.</div>
  <div class="q"><strong>Q1.</strong> Trouver un équivalent de \(\ln(x^2 + x + 1)\) en \(+\infty\), puis en 0.</div>
  <div class="q"><strong>Q2.</strong> Calculer les limites de \(\left(1 + \frac2n\right)^n\) et de \(\left(1 - \frac1n\right)^{n^2}\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(n^{1/n} \to 1\), puis que \(n^{1/n} - 1 \sim \dfrac{\ln n}{n}\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que \((x + 1)^x \sim e\,x^x\) en \(+\infty\). A-t-on \((x + 1)^x \sim x^x\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En \(+\infty\) : \(x^2 + x + 1 \sim x^2 \to +\infty \ne 1\), donc \(\ln(x^2 + x + 1) \sim \ln(x^2) = 2\ln x\). En 0 : la limite de \(x^2 + x + 1\) est 1, cas exclu ; on écrit \(\ln(1 + u)\) avec \(u = x + x^2 \to 0\) : \(\ln(1 + u) \sim u \sim x\).</p>
    <p><strong>Q2.</strong> \(\left(1 + \frac2n\right)^n = \exp\!\big(n\ln(1 + \frac2n)\big)\) et \(n\ln(1 + \frac2n) \sim n\cdot\frac2n = 2\) : limite \(e^2\). Et \(\left(1 - \frac1n\right)^{n^2} = \exp\!\big(n^2\ln(1 - \frac1n)\big)\) avec \(n^2\ln(1 - \frac1n) \sim -n \to -\infty\) : limite 0. L'exposant \(n^2\) l'emporte sur la base proche de 1.</p>
    <p><strong>Q3.</strong> \(n^{1/n} = \exp\!\left(\frac{\ln n}{n}\right)\) et \(\frac{\ln n}{n} \to 0\) : \(n^{1/n} \to 1\). Puis, avec \(u = \frac{\ln n}{n} \to 0\), \(e^u - 1 \sim u\) : \(n^{1/n} - 1 \sim \dfrac{\ln n}{n}\). Ainsi \(n^{1/n}\) tend vers 1 lentement : pour \(n = 1000\), \(n^{1/n} \approx 1{,}006\,9\).</p>
    <p><strong>Q4.</strong> Comme \(x\ln(1 + \frac1x) \sim 1\) :</p>
    <div class="formula">$$\frac{(x + 1)^x}{x^x} = \left(1 + \frac1x\right)^x = \exp\!\Big(x\ln\Big(1 + \frac1x\Big)\Big) \xrightarrow[x \to +\infty]{} e .$$</div>
    <p> Donc \((x + 1)^x \sim e\,x^x\), et \((x + 1)^x \sim x^x\) est <strong>faux</strong> (le rapport tend vers \(e \ne 1\)), bien que \(x + 1 \sim x\) : on ne remplace pas la base par un équivalent quand l'exposant varie.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Une suite d'intégrales : équivalent par encadrement</h3>
  <div class="statement">On étudie \(I_n = \displaystyle\int_0^1 \frac{x^n}{1+x}\,\mathrm{d}x\) pour \(n \in \mathbb N\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(I_n + I_{n+1} = \dfrac{1}{n+1}\) et que \((I_n)\) est décroissante.</div>
  <div class="q"><strong>Q2.</strong> En déduire que \(\dfrac{1}{2(n + 1)} \le I_n \le \dfrac{1}{2n}\) pour \(n \ge 1\), puis un équivalent de \(I_n\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(J_n = \displaystyle\sum_{k=0}^n\frac{(-1)^k}{k+1}\). Montrer que \(J_n = \ln 2 + (-1)^n I_{n+1}\). En déduire la limite de \(J_n\) et un équivalent de \(J_n - \ln 2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Par linéarité,</p>
    <div class="formula">$$I_n + I_{n+1} = \int_0^1\frac{x^n(1+x)}{1+x}\,\mathrm{d}x = \int_0^1 x^n\,\mathrm{d}x = \frac{1}{n+1}.$$</div>
    <p> Pour \(x \in [0, 1]\), \(x^{n+1} \le x^n\), donc \(\frac{x^{n+1}}{1 + x} \le \frac{x^n}{1 + x}\) et, par croissance de l'intégrale, \(I_{n+1} \le I_n\) : la suite est décroissante (et positive).</p>
    <p><strong>Q2.</strong> Par décroissance, \(2I_n \ge I_n + I_{n+1} = \frac{1}{n+1}\) et, pour \(n \ge 1\), \(2I_n \le I_n + I_{n-1} = \frac1n\). D'où \(\frac{1}{2(n + 1)} \le I_n \le \frac{1}{2n}\). Les deux bornes sont équivalentes à \(\frac{1}{2n}\) : par encadrement, \(I_n \sim \dfrac{1}{2n}\). Contrôle : \(I_{10} \approx 0{,}047\,5\), entre \(\frac1{22} \approx 0{,}045\,5\) et \(\frac{1}{20} = 0{,}05\).</p>
    <p><strong>Q3.</strong> On intègre la somme géométrique : \(\displaystyle\sum_{k=0}^n(-x)^k = \frac{1 - (-x)^{n+1}}{1 + x}\), et \(\displaystyle\int_0^1 (-x)^k\,\mathrm{d}x = \frac{(-1)^k}{k + 1}\). Donc</p>
    <div class="formula">$$J_n = \int_0^1\frac{\mathrm{d}x}{1 + x} - (-1)^{n+1}\int_0^1\frac{x^{n+1}}{1 + x}\,\mathrm{d}x = \ln 2 + (-1)^n I_{n+1}.$$</div>
    <p>Comme \(I_{n+1} \to 0\), \(J_n \to \ln 2\) ; et \(J_n - \ln 2 = (-1)^n I_{n+1} \sim \dfrac{(-1)^n}{2n}\) (le facteur \((-1)^n\), produit, est permis). L'erreur décroît comme \(\frac{1}{2n}\) : convergence lente, il faut environ \(5 \times 10^5\) termes pour \(10^{-6}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ☆ ☆</span>
  <h3>Polynômes, fractions rationnelles, points \(a \ne 0\)</h3>
  <div class="statement">Donner un équivalent simple au point indiqué (méthodes 1 et 9).</div>
  <div class="q"><strong>Q1.</strong> \(P(x) = 3x^4 - x^2 + 5x\) en 0, puis en \(+\infty\).</div>
  <div class="q"><strong>Q2.</strong> \(F(x) = \dfrac{2x^3 - x}{x^2 + 4x}\) en 0, puis en \(\pm\infty\).</div>
  <div class="q"><strong>Q3.</strong> \(\sqrt{1 + x} - \sqrt{1 - x}\) en 0.</div>
  <div class="q"><strong>Q4.</strong> \(\sin x\) quand \(x \to \pi\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En 0, terme de plus bas degré : \(P(x) \sim 5x\). En \(+\infty\), de plus haut degré : \(P(x) \sim 3x^4\).</p>
    <p><strong>Q2.</strong> Pour \(x \ne 0\), \(F(x) = \dfrac{2x^2 - 1}{x + 4}\). En 0, \(F(x) \to -\frac14\) : \(F \sim -\frac14\) (une constante non nulle). En \(\pm\infty\), \(F(x) \sim \frac{2x^2}{x} = 2x\).</p>
    <p><strong>Q3.</strong> Compensation des termes en 1 : quantité conjuguée, \(\sqrt{1 + x} - \sqrt{1 - x} = \dfrac{2x}{\sqrt{1 + x} + \sqrt{1 - x}}\), et le dénominateur tend vers 2 : l'expression est équivalente à \(x\).</p>
    <p><strong>Q4.</strong> On pose \(x = \pi + h\) : \(\sin(\pi + h) = -\sin h \sim -h\). Donc \(\sin x \sim \pi - x\) quand \(x \to \pi\).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Une suite définie implicitement : \(x^n + x = 1\)</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de mathématiques PT (thème : analyse asymptotique, suites définies implicitement). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">Pour \(n \ge 1\), on pose \(f_n(x) = x^n + x - 1\) sur \([0, 1]\).</div>
  <p class="exo-part">Partie A — Existence</p>
  <div class="q"><strong>A1.</strong> Montrer que l'équation \(f_n(x) = 0\) a une unique solution \(x_n\) dans \([0, 1]\), et que \(x_n \in\, ]0, 1[\).</div>
  <div class="q"><strong>A2.</strong> Calculer \(x_1\) et \(x_2\).</div>
  <p class="exo-part">Partie B — Monotonie et limite</p>
  <div class="q"><strong>B1.</strong> Calculer \(f_{n+1}(x_n)\) et en déduire que \((x_n)\) est strictement croissante.</div>
  <div class="q"><strong>B2.</strong> Montrer que \((x_n)\) converge vers une limite \(\ell \le 1\), puis que \(\ell = 1\). (Raisonner par l'absurde en supposant \(\ell \lt 1\).)</div>
  <p class="exo-part">Partie C — Un équivalent de \(1 - x_n\)</p>
  <div class="q"><strong>C1.</strong> On pose \(\varepsilon_n = 1 - x_n\). Montrer que \(\varepsilon_n = (1 - \varepsilon_n)^n\), puis que \(\ln\varepsilon_n \sim -n\,\varepsilon_n\).</div>
  <div class="q"><strong>C2.</strong> En déduire que \(n\,\varepsilon_n \to +\infty\).</div>
  <div class="q"><strong>C3.</strong> On pose \(L_n = -\ln\varepsilon_n\). Montrer que \(\ln L_n = \ln n - L_n + o(1)\), puis que \(L_n \sim \ln n\).</div>
  <div class="q"><strong>C4.</strong> Conclure : \(1 - x_n \sim \dfrac{\ln n}{n}\).</div>
  <p class="exo-part">Partie D — Contrôle numérique</p>
  <div class="q"><strong>D1.</strong> On donne \(1 - x_n \approx 3{,}34 \times 10^{-2}\) pour \(n = 100\) et \(1{,}14 \times 10^{-5}\) pour \(n = 10^6\). Comparer à \(\frac{\ln n}{n}\). Comment expliquer la lenteur de l'approche du rapport vers 1 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(f_n\) est continue et \(f_n'(x) = nx^{n-1} + 1 \gt 0\) : elle est strictement croissante sur \([0, 1]\). Comme \(f_n(0) = -1 \lt 0\) et \(f_n(1) = 1 \gt 0\), elle s'annule en un unique \(x_n\), qui n'est ni 0 ni 1.</p>
    <p><strong>A2.</strong> \(x_1\) : \(2x - 1 = 0\), \(x_1 = \frac12\). \(x_2\) : \(x^2 + x - 1 = 0\), racine positive \(x_2 = \frac{\sqrt5 - 1}{2} \approx 0{,}618\).</p>
    <p><strong>B1.</strong> Comme \(x_n - 1 = -x_n^n\) :</p>
    <div class="formula">$$f_{n+1}(x_n) = x_n^{n+1} + x_n - 1 = x_n^{n+1} - x_n^n = x_n^n(x_n - 1) \lt 0,$$</div>
    <p>car \(x_n^n \gt 0\) et \(x_n \lt 1\). Comme \(f_{n+1}\) est strictement croissante et s'annule en \(x_{n+1}\), \(f_{n+1}(x_n) \lt 0 = f_{n+1}(x_{n+1})\) donne \(x_n \lt x_{n+1}\).</p>
    <p><strong>B2.</strong> \((x_n)\) est croissante et majorée par 1 : elle converge vers \(\ell \le 1\) (limite monotone). Si \(\ell \lt 1\) : pour tout \(n\), \(0 \lt x_n \le \ell\), donc \(0 \lt x_n^n \le \ell^n \to 0\), et \(x_n = 1 - x_n^n \to 1\), ce qui contredit \(\ell \lt 1\). Donc \(\ell = 1\).</p>
    <p><strong>C1.</strong> L'équation s'écrit \(x_n^n = 1 - x_n\), soit \((1 - \varepsilon_n)^n = \varepsilon_n\). En passant au logarithme (\(\varepsilon_n \in\, ]0, 1[\)) : \(\ln\varepsilon_n = n\ln(1 - \varepsilon_n)\). Comme \(\varepsilon_n \to 0\), \(\ln(1 - \varepsilon_n) \sim -\varepsilon_n\), d'où \(\ln\varepsilon_n \sim -n\varepsilon_n\) (produit par \(n\)).</p>
    <p><strong>C2.</strong> \(\varepsilon_n \to 0^+\), donc \(\ln\varepsilon_n \to -\infty\) ; deux suites équivalentes ont la même limite : \(-n\varepsilon_n \to -\infty\), soit \(n\varepsilon_n \to +\infty\).</p>
    <p><strong>C3.</strong> C1 s'écrit \(L_n = n\varepsilon_n(1 + o(1))\), avec \(L_n \to +\infty\) et \(n\varepsilon_n \to +\infty\). Les deux suites sont strictement positives et tendent vers \(+\infty\) (limite \(\ne 1\)) : on peut passer au logarithme :</p>
    <div class="formula">$$\ln L_n = \ln n + \ln\varepsilon_n + \ln\big(1 + o(1)\big) = \ln n - L_n + o(1).$$</div>
    <p>Ainsi \(L_n + \ln L_n = \ln n + o(1)\). Comme \(\ln L_n = o(L_n)\) (croissances comparées), le membre de gauche est équivalent à \(L_n\), et celui de droite à \(\ln n\) : \(L_n \sim \ln n\).</p>
    <p><strong>C4.</strong> Par C1, \(n\varepsilon_n \sim -\ln\varepsilon_n = L_n \sim \ln n\), donc \(\varepsilon_n \sim \dfrac{\ln n}{n}\), c'est-à-dire \(x_n = 1 - \dfrac{\ln n}{n}\big(1 + o(1)\big)\).</p>
    <p><strong>D1.</strong> \(\frac{\ln 100}{100} \approx 4{,}61 \times 10^{-2}\) (rapport \(0{,}73\)) et \(\frac{\ln 10^6}{10^6} \approx 1{,}38 \times 10^{-5}\) (rapport \(0{,}82\)). Le rapport tend vers 1, mais très lentement : C3 donne \(L_n = \ln n - \ln L_n + o(1) \approx \ln n - \ln\ln n\), et le terme \(\ln\ln n\), négligeable devant \(\ln n\), n'est pas petit pour les \(n\) usuels (\(\ln\ln 10^6 \approx 2{,}6\) contre \(\ln 10^6 \approx 13{,}8\)). L'approximation \(\varepsilon_n \approx \frac{\ln n - \ln\ln n}{n} \approx 1{,}12 \times 10^{-5}\) est déjà bien meilleure : un équivalent ne dit rien de la vitesse à laquelle le rapport tend vers 1.</p>
  </div>
</div>
