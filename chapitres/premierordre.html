<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 1.3 « Circuit linéaire du premier ordre » du programme de PTSI, et la fin de la partie 1.2 consacrée au condensateur et à la bobine. Il s'appuie sur le chapitre « Lois de l'électrocinétique — régime continu » (ARQS, conventions, lois de Kirchhoff, Thévenin, résistances d'entrée et de sortie) et prépare le chapitre « Circuit RLC série », qui réutilise tels quels les dipôles, les continuités et les énergies établis ici. La capacité numérique (méthode d'Euler) est partagée avec le chapitre d'informatique « Méthodes numériques ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Condensateur, bobine</strong> (partie 1.2) : utiliser les relations entre l'intensité et la tension ; citer des ordres de grandeur des composants \(L\) et \(C\) ; exprimer l'énergie stockée dans un condensateur ou une bobine (§1, §2).</li>
        <li><strong>Continuité</strong> : interpréter et utiliser la continuité de la tension aux bornes d'un condensateur ou de l'intensité du courant traversant une bobine (§1, §2, §6).</li>
        <li><strong>Équation différentielle</strong> : établir l'équation différentielle du premier ordre vérifiée par une grandeur électrique dans un circuit comportant une ou deux mailles (§3, §4, §5, §7).</li>
        <li><strong>Réponse temporelle</strong> : la déterminer dans le cas d'un régime libre ou d'un échelon de tension (§3, §4, §5, §7).</li>
        <li><strong>Durée du régime transitoire</strong> : en déterminer un ordre de grandeur ; distinguer, sur un relevé expérimental, régime transitoire et régime permanent ; réaliser l'acquisition d'un régime transitoire et confronter le résultat aux expressions théoriques (§6).</li>
        <li><strong>Stockage et dissipation d'énergie</strong> : réaliser un bilan énergétique (§8).</li>
        <li><strong>Capacité numérique</strong> : mettre en œuvre la méthode d'Euler à l'aide d'un langage de programmation pour simuler la réponse d'un système linéaire du premier ordre à une excitation de forme quelconque (§9).</li>
      </ul>
      <p>Tout le chapitre est au programme de PTSI. Le régime sinusoïdal forcé (impédances complexes) est l'objet des chapitres « Circuit RLC série » et « Filtres » ; la figure du §9 n'en donne qu'un aperçu.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LE CONDENSATEUR</div>
  <h2>Un réservoir de charge</h2>
  <div class="intro">Deux conducteurs (les armatures) séparés par un isolant : quand un courant arrive sur une armature, la charge s'y accumule, et la même charge de signe opposé apparaît sur l'autre. Le condensateur stocke de la charge et de l'énergie ; il lisse les tensions, mémorise une information, fournit des impulsions brèves et intenses.</div>

<figcaption>Les trois dipôles en convention récepteur (flèche de tension opposée au courant). Le condensateur porte les charges \(+q\) et \(-q\) sur ses armatures ; \(i = \mathrm{d}q/\mathrm{d}t\) est le courant qui arrive sur l'armature \(+q\). Une bobine réelle se modélise par une inductance \(L\) en série avec la résistance \(r\) de son fil.</figcaption>
</figure>
  <div class="def-box">
    <strong>Condensateur idéal.</strong> Les armatures portent les charges \(+q\) et \(-q\), proportionnelles à la tension : \(q = C\,u_C\), où \(C\) est la <strong>capacité</strong>, en farads (F). En convention récepteur, \(i = \mathrm{d}q/\mathrm{d}t\) est le courant qui arrive sur l'armature \(+q\), d'où
    <div class="formula" data-nom="Condensateur">$$i = C\,\frac{\mathrm{d}u_C}{\mathrm{d}t}$$</div>
  </div>
  <div class="prop-box">
    <strong>Énergie stockée.</strong> Un condensateur sous la tension \(u_C\) stocke l'énergie
    <div class="formula" data-nom="Énergie d'un condensateur">$$\mathcal{E}_C = \frac12\,C\,u_C^2$$</div>
    <strong>Continuité.</strong> La tension aux bornes d'un condensateur est une fonction continue du temps : \(u_C(0^+) = u_C(0^-)\) lors de la fermeture ou de l'ouverture d'un interrupteur.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Énergie stockée et continuité de \(u_C\)</span><div class="content">
    <p>En convention récepteur, le condensateur reçoit la puissance \(P = u_C\,i = C\,u_C\,\dfrac{\mathrm{d}u_C}{\mathrm{d}t} = \dfrac{\mathrm{d}}{\mathrm{d}t}\left(\tfrac12 C u_C^2\right)\). L'énergie reçue entre un état déchargé et la tension \(u_C\) vaut donc \(\tfrac12 C u_C^2\), indépendamment de la façon dont on l'a chargé : c'est une énergie stockée, récupérable.</p>
    <p>Si \(u_C\) sautait d'une valeur à une autre, \(\mathcal{E}_C\) varierait d'une quantité finie en un temps nul : il faudrait une puissance infinie, donc un courant infini. Aucune source réelle ne le permet ; \(u_C\) est continue. Le courant \(i\), lui, peut être discontinu.</p>
  </div></div>
  <p><strong>En régime continu permanent</strong>, \(u_C\) est constante, donc \(i = 0\) : le condensateur se comporte comme un <strong>interrupteur ouvert</strong>.</p>
  <h3>Ordres de grandeur</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Condensateur</th><th style="text-align:left">Capacité</th></tr>
    <tr><td>capacité parasite d'un câble, d'une entrée d'oscilloscope</td><td>quelques pF à 100 pF (un câble coaxial : environ 100 pF par mètre)</td></tr>
    <tr><td>condensateurs céramiques, films (électronique)</td><td>du nF au µF</td></tr>
    <tr><td>condensateurs électrochimiques (filtrage d'alimentation)</td><td>du µF à quelques dizaines de mF</td></tr>
    <tr><td>supercondensateurs (bus, secours électrique)</td><td>de 1 F à quelques milliers de F, sous 2,7 V par élément</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — charge, courant, énergie</strong>
    <ol>
      <li>Un condensateur de \(470\ \mu\text{F}\) chargé sous \(12\ \text{V}\) porte \(q = Cu_C = 5{,}6\ \text{mC}\) et stocke \(\tfrac12 C u_C^2 = 34\ \text{mJ}\).</li>
      <li>Si la tension aux bornes d'un condensateur de \(1{,}0\ \mu\text{F}\) monte linéairement de 0 à \(10\ \text{V}\) en \(1{,}0\ \text{ms}\), le courant est constant : \(i = C\,\Delta u/\Delta t = 10^{-6}\times10/10^{-3} = 10\ \text{mA}\).</li>
      <li>Un supercondensateur de \(3\,000\ \text{F}\) sous \(2{,}7\ \text{V}\) stocke \(\tfrac12\times3\,000\times2{,}7^2 \approx 11\ \text{kJ}\), environ 3 Wh : autant qu'une petite pile, mais qu'il peut restituer en quelques secondes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(i = C\,\mathrm{d}u_C/\mathrm{d}t\) avec \(u_C\) et \(i\) orientés en convention générateur. La relation change alors de signe : \(i = -C\,\mathrm{d}u_C/\mathrm{d}t\). On vérifie toujours la convention sur le schéma avant d'écrire la loi du dipôle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LA BOBINE</div>
  <h2>Un dipôle qui s'oppose aux variations du courant</h2>
  <div class="intro">Une bobine est un enroulement de fil conducteur, souvent autour d'un noyau de fer. Le chapitre « Induction électromagnétique » explique l'origine de sa tension (auto-induction) ; ici, on l'utilise comme dipôle. Elle lisse les courants, stocke de l'énergie magnétique, et produit des surtensions quand on coupe brutalement son courant.</div>
  <div class="def-box">
    <strong>Bobine idéale.</strong> En convention récepteur, la tension à ses bornes est proportionnelle à la dérivée du courant qui la traverse :
    <div class="formula" data-nom="Bobine">$$u_L = L\,\frac{\mathrm{d}i_L}{\mathrm{d}t}$$</div>
    \(L\) est l'<strong>inductance</strong>, en henrys (H). Une bobine réelle, faite d'un long fil, a aussi une résistance \(r\) : on la modélise par \(L\) en série avec \(r\), soit \(u = L\,\mathrm{d}i/\mathrm{d}t + r\,i\).
  </div>
  <div class="prop-box">
    <strong>Énergie stockée.</strong> Une bobine parcourue par le courant \(i_L\) stocke l'énergie magnétique
    <div class="formula" data-nom="Énergie d'une bobine">$$\mathcal{E}_L = \frac12\,L\,i_L^2$$</div>
    <strong>Continuité.</strong> L'intensité du courant qui traverse une bobine est une fonction continue du temps : \(i_L(0^+) = i_L(0^-)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Même raisonnement que pour le condensateur</span><div class="content">
    <p>La puissance reçue vaut \(u_L\,i_L = L\,i_L\,\dfrac{\mathrm{d}i_L}{\mathrm{d}t} = \dfrac{\mathrm{d}}{\mathrm{d}t}\left(\tfrac12 L i_L^2\right)\) : l'énergie stockée est \(\tfrac12 L i_L^2\). Une discontinuité de \(i_L\) demanderait une puissance infinie, donc une tension infinie. La tension \(u_L\), elle, peut sauter.</p>
  </div></div>
  <p><strong>En régime continu permanent</strong>, \(i_L\) est constant, donc \(u_L = 0\) : une bobine idéale se comporte comme un <strong>fil</strong> (une bobine réelle, comme sa résistance \(r\)).</p>
  <h3>Ordres de grandeur</h3>
  <p>Inductances CMS et bobines de filtrage d'alimentations à découpage : du µH au mH ; bobines de TP (quelques centaines à un millier de spires) : de 10 mH à 1 H environ, avec \(r\) de l'ordre de 1 à 10 Ω, davantage avec un noyau de fer qui multiplie \(L\) ; bobines de relais, d'électroaimants : de l'ordre de 0,1 à 1 H.</p>
  <div class="method-box">
    <strong>Exemple — pourquoi une étincelle à l'ouverture</strong>
    <ol>
      <li>Une bobine de \(0{,}10\ \text{H}\) voit son courant croître linéairement de 0 à \(0{,}20\ \text{A}\) en \(1{,}0\ \text{ms}\) : \(u_L = L\,\Delta i/\Delta t = 0{,}10\times0{,}20/10^{-3} = 20\ \text{V}\). Elle stocke alors \(\tfrac12 L i^2 = 2{,}0\ \text{mJ}\).</li>
      <li>On ouvre brutalement l'interrupteur : le courant voudrait tomber à zéro en une microseconde environ, ce qui demanderait \(|u_L| \approx 0{,}10\times0{,}20/10^{-6} = 2\times10^{4}\ \text{V}\).</li>
      <li>Bien avant, l'air entre les contacts de l'interrupteur devient conducteur : une étincelle se forme, par laquelle le courant continue de passer et l'énergie stockée se dissipe. C'est le principe de l'allumage des moteurs à essence, et la raison pour laquelle on protège les bobines de relais (§5).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que les continuités s'appliquent à toutes les grandeurs. Seules \(u_C\) et \(i_L\) sont continues. Le courant dans un condensateur, la tension aux bornes d'une bobine, et les courants et tensions des résistances peuvent sauter à la fermeture d'un interrupteur ; on les calcule à \(t = 0^+\) à partir de \(u_C(0^+)\) et \(i_L(0^+)\).</div>
</div>

<figcaption>On ferme K à \(t = 0\), le condensateur étant déchargé. La tension \(u_C = E\left(1 - e^{-t/\tau}\right)\) (rouge) est continue ; le courant \(i = (E/R)\,e^{-t/\tau}\) (bleu) saute de 0 à \(E/R\). La tangente à l'origine coupe l'asymptote en \(t = \tau = RC\), où \(u_C\) a fait 63 % du chemin ; à \(3\tau\), 95 % : au-delà (zone grisée), on considère le régime permanent atteint à 5 % près.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Équation différentielle.</strong> Pour \(t \gt 0\), la loi des mailles \(E = Ri + u_C\) et \(i = C\,\mathrm{d}u_C/\mathrm{d}t\) donnent
    <div class="formula" data-nom="Circuit RC : équation">$$\tau\,\frac{\mathrm{d}u_C}{\mathrm{d}t} + u_C = E \qquad\text{avec}\qquad \tau = RC$$</div>
    \(\tau\) est la <strong>constante de temps</strong> (\(RC\) est bien homogène à un temps : \(\Omega\times\text{F} = \text{V·A}^{-1}\times\text{A·s·V}^{-1} = \text{s}\)).
  </div>
  <div class="prop-box">
    <strong>Réponse à l'échelon</strong> (condensateur initialement déchargé) :
    <div class="formula" data-nom="Charge d'un condensateur">$$u_C(t) = E\left(1 - e^{-t/\tau}\right), \qquad i(t) = \frac{E}{R}\,e^{-t/\tau}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Résolution de l'équation</span><div class="content">
    <p>Les solutions de l'équation homogène \(\tau\,\mathrm{d}u/\mathrm{d}t + u = 0\) sont \(A\,e^{-t/\tau}\). Le second membre étant constant, on cherche une solution particulière constante : \(u = E\). Solution générale : \(u_C = E + A\,e^{-t/\tau}\). La continuité impose \(u_C(0^+) = u_C(0^-) = 0\), donc \(A = -E\). Enfin \(i = C\,\mathrm{d}u_C/\mathrm{d}t = \dfrac{CE}{\tau}\,e^{-t/\tau} = \dfrac{E}{R}\,e^{-t/\tau}\).</p>
  </div></div>
  <ul>
    <li>À \(t = 0^+\), \(u_C = 0\) : le condensateur se comporte un instant comme un fil, et le courant saute de 0 à \(E/R\).</li>
    <li>Quand \(t \to \infty\), \(u_C \to E\) et \(i \to 0\) : on retrouve l'interrupteur ouvert du régime permanent.</li>
    <li>La tangente à l'origine de \(u_C(t)\) a pour pente \(E/\tau\) : elle atteint l'asymptote \(E\) à \(t = \tau\). À cet instant, \(u_C = E(1 - e^{-1}) \approx 0{,}63\,E\).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — combien de temps pour atteindre 4 V ?</strong>
    <p>\(E = 5{,}0\ \text{V}\), \(R = 10\ \text{k}\Omega\), \(C = 100\ \mu\text{F}\), condensateur déchargé.</p>
    <ol>
      <li>\(\tau = RC = 10^{4}\times10^{-4} = 1{,}0\ \text{s}\) ; courant initial \(E/R = 0{,}50\ \text{mA}\).</li>
      <li>\(u_C(t_1) = 4{,}0\ \text{V}\) donne \(e^{-t_1/\tau} = 1 - 4/5 = 0{,}2\), soit \(t_1 = \tau\ln 5 \approx 1{,}6\ \text{s}\).</li>
      <li>Contrôle : \(t_1\) est un peu plus grand que \(\tau\), où \(u_C\) ne vaut que \(3{,}2\ \text{V}\) ; cohérent.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la continuité au courant. À la fermeture, \(i\) passe de 0 à \(E/R\) instantanément : c'est \(u_C\), pas \(i\), qui est continue dans un circuit RC.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · RÉGIME LIBRE DU CIRCUIT RC</div>
  <h2>La décharge d'un condensateur</h2>
  <div class="intro">Un condensateur chargé sous \(U_0\) est relié à \(t = 0\) à une résistance \(R\), sans source : le circuit évolue seul, en dépensant l'énergie stockée. C'est le <strong>régime libre</strong>.</div>
  <div class="prop-box">
    <strong>Décharge.</strong> La loi des mailles \(Ri + u_C = 0\) (même orientation qu'au §3) donne \(\tau\,\mathrm{d}u_C/\mathrm{d}t + u_C = 0\), avec \(\tau = RC\), et la continuité \(u_C(0^+) = U_0\) :
    <div class="formula" data-nom="Décharge d'un condensateur">$$u_C(t) = U_0\,e^{-t/\tau}, \qquad i(t) = -\frac{U_0}{R}\,e^{-t/\tau}$$</div>
    Le courant est négatif : il circule en sens inverse de la charge. La tension est divisée par deux en \(\tau\ln 2 \approx 0{,}69\,\tau\), et ce, quel que soit l'instant de départ.
  </div>

<div class="course-section">
  <div class="sec-num">§5 · CIRCUIT RL : ÉTABLISSEMENT ET RUPTURE DU COURANT</div>
  <h2>La bobine retarde le courant</h2>
  <div class="intro">Le circuit RL est le symétrique du circuit RC : la grandeur continue est le courant \(i_L\), et c'est lui qui s'établit progressivement. Son étude explique le fonctionnement des relais, des électroaimants et la nécessité de les protéger.</div>
  <div class="prop-box">
    <strong>Échelon de tension.</strong> Une source \(E\) alimente à \(t = 0\) une bobine en série avec une résistance totale \(R\) (résistance de la bobine comprise), courant initialement nul. Pour \(t \gt 0\) : \(E = Ri + L\,\mathrm{d}i/\mathrm{d}t\), soit
    <div class="formula" data-nom="Circuit RL : équation">$$\tau\,\frac{\mathrm{d}i}{\mathrm{d}t} + i = \frac{E}{R} \qquad\text{avec}\qquad \tau = \frac{L}{R}$$</div>
    et, avec \(i(0^+) = i(0^-) = 0\) :
    <div class="formula" data-nom="Établissement du courant (RL)">$$i(t) = \frac{E}{R}\left(1 - e^{-t/\tau}\right), \qquad u_L(t) = E\,e^{-t/\tau}$$</div>
    <strong>Régime libre.</strong> Si un courant \(I_0\) circule dans la bobine à \(t = 0\) et que la maille ne contient plus de source (résistance totale \(R\)), \(i(t) = I_0\,e^{-t/\tau}\) avec \(\tau = L/R\).
  </div>
  <figure class="schema">
<svg viewBox="0 0 530 200" role="img" aria-label="Circuit RL : établissement du courant, puis extinction dans une résistance de protection à l'ouverture">

<figcaption>Bobine réelle \((L, r)\) alimentée par \(E\) ; une résistance \(R'\) est branchée en parallèle. À la fermeture, \(i_L\) s'établit avec \(\tau = L/r\) (la source impose la tension aux bornes de la bobine, \(R'\) n'intervient pas). À l'ouverture de K (ici à \(5\tau\)), \(i_L\) reste continu et se referme par \(R'\) : il décroît avec \(\tau' = L/(r + R')\), beaucoup plus court, et la tension aux bornes de \(R'\) vaut \(-R'i_L\).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — protéger la bobine d'un relais</strong>
    <p>La bobine d'un relais (\(L = 0{,}20\ \text{H}\), \(r = 50\ \Omega\)) est alimentée sous \(E = 12\ \text{V}\) ; une résistance \(R' = 450\ \Omega\) est branchée en parallèle sur elle (figure ci-dessus).</p>
    <ol>
      <li>Fermeture : la source impose \(E\) aux bornes de la bobine, \(R'\) n'intervient pas sur \(i_L\) : \(\tau = L/r = 4{,}0\ \text{ms}\), \(I = E/r = 0{,}24\ \text{A}\), atteint à 5 % près en \(3\tau = 12\ \text{ms}\).</li>
      <li>Ouverture de K : \(i_L\) est continu et vaut \(0{,}24\ \text{A}\) ; il ne peut plus passer que par \(R'\). La tension aux bornes de \(R'\) saute à \(-R'I = -108\ \text{V}\) (au lieu de plusieurs kilovolts sans protection).</li>
      <li>Le courant décroît dans la maille \((L, r, R')\) avec \(\tau' = L/(r + R') = 0{,}40\ \text{ms}\) ; l'énergie \(\tfrac12 LI^2 = 5{,}8\ \text{mJ}\) est dissipée dans \(r\) et \(R'\).</li>
      <li>Compromis : plus \(R'\) est grande, plus la surtension est forte mais plus le relais retombe vite. Une diode (dite de roue libre) à la place de \(R'\) limite la surtension à moins d'un volt, au prix d'une décroissance plus lente (\(\tau \approx L/r\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(\tau = L/R\) avec la mauvaise résistance. \(R\) est la résistance totale de la maille dans laquelle circule le courant de la bobine, à l'instant considéré : elle change quand un interrupteur change l'état du circuit (\(r\) à la fermeture, \(r + R'\) à l'ouverture dans l'exemple).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MÉTHODE GÉNÉRALE ET DURÉE DU RÉGIME TRANSITOIRE</div>
  <h2>Une seule forme de solution pour tous les circuits du premier ordre</h2>
  <div class="intro">Tous les circuits linéaires ne comportant qu'un condensateur ou qu'une bobine, alimentés par des sources constantes, obéissent à la même équation. On peut écrire leur réponse sans résoudre l'équation, à partir de trois nombres : la valeur initiale, la valeur finale, la constante de temps.</div>
  <div class="prop-box">
    <strong>Forme canonique et solution.</strong> Toute grandeur \(x\) (tension, courant) d'un tel circuit vérifie, entre deux manœuvres d'interrupteur,
    <div class="formula" data-nom="Premier ordre : forme canonique">$$\tau\,\frac{\mathrm{d}x}{\mathrm{d}t} + x = x_\infty \qquad\Longrightarrow\qquad x(t) = x_\infty + \left(x(0^+) - x_\infty\right)e^{-t/\tau}$$</div>
    <ul>
      <li>\(x(0^+)\) se déduit des continuités de \(u_C\) ou de \(i_L\), puis des lois de Kirchhoff à \(t = 0^+\) ;</li>
      <li>\(x_\infty\) est la valeur en régime permanent : condensateur remplacé par un interrupteur ouvert, bobine par un fil ;</li>
      <li>\(\tau = R_{\text{th}}C\) ou \(\tau = L/R_{\text{th}}\), où \(R_{\text{th}}\) est la résistance vue des bornes du condensateur ou de la bobine, sources éteintes (§7).</li>
    </ul>
    La constante \(\tau\) doit être positive : un circuit de résistances et de sources ne peut que tendre vers son régime permanent.
  </div>
  <div class="prop-box">
    <strong>Durée du régime transitoire.</strong> L'écart à la valeur finale est divisé par \(e\) à chaque durée \(\tau\). Il reste
    <div class="formula" data-nom="Temps de réponse à 5 %">$$\frac{|x(t) - x_\infty|}{|x(0^+) - x_\infty|} = e^{-t/\tau} \leq 5\,\% \quad\Longleftrightarrow\quad t \geq t_{5\,\%} = \tau\ln 20 \approx 3\,\tau$$</div>
    On retient : régime permanent atteint à 5 % près au bout de \(3\tau\), à 1 % près au bout de \(4{,}6\,\tau\), à moins de 1 % au bout de \(5\tau\). Le <strong>régime transitoire</strong> dure quelques \(\tau\) ; le <strong>régime permanent</strong> est celui qui reste ensuite.
  </div>
  <h3>Mesurer \(\tau\) sur un relevé expérimental</h3>
  <ul>
    <li><strong>Méthode des 63 %</strong> : \(\tau\) est l'instant où la grandeur a effectué 63 % de sa variation totale (il reste 37 %).</li>
    <li><strong>Tangente à l'origine</strong> : elle coupe l'asymptote à \(t = \tau\) ; méthode moins précise (tracé à la main d'une tangente).</li>
    <li><strong>Échelle logarithmique</strong> : \(\ln|x - x_\infty|\) est une fonction affine de \(t\), de pente \(-1/\tau\) ; une régression linéaire sur tous les points donne \(\tau\) avec son incertitude (voir le chapitre « Mesures et incertitudes »).</li>
  </ul>
  <p><strong>Acquisition en TP.</strong> On remplace l'interrupteur par un GBF délivrant des créneaux entre 0 et \(E\), de demi-période grande devant \(\tau\) (au moins \(5\tau\)) : chaque front est un échelon, et le régime transitoire se répète à chaque demi-période, visible à l'oscilloscope ou sur une carte d'acquisition. Le GBF ajoute sa résistance de sortie (\(50\ \Omega\)) à celle du circuit ; l'oscilloscope (\(1\ \text{M}\Omega\)) branché aux bornes de \(C\) forme une seconde maille, négligeable si \(R \ll 1\ \text{M}\Omega\).</p>
  <div class="method-box">
    <strong>Exemple — remonter à la capacité</strong>
    <p>Un circuit RC avec \(R = 1{,}00\ \text{k}\Omega\) est alimenté par un GBF en créneaux de 0 à \(5{,}0\ \text{V}\). À l'oscilloscope, \(u_C\) atteint \(0{,}63\times5{,}0 = 3{,}2\ \text{V}\) au bout de \(2{,}2\ \text{ms}\).</p>
    <ol>
      <li>\(\tau = 2{,}2\ \text{ms}\), et la résistance de la maille est \(R + R_s = 1{,}05\ \text{k}\Omega\) (GBF compris).</li>
      <li>\(C = \tau/(R + R_s) = 2{,}2\times10^{-3}/1\,050 \approx 2{,}1\ \mu\text{F}\). Oublier les \(50\ \Omega\) du GBF donnerait \(2{,}2\ \mu\text{F}\) : une erreur de 5 %.</li>
      <li>Contrôle du réglage : demi-période d'au moins \(5\tau = 11\ \text{ms}\), soit un créneau de fréquence inférieure à \(45\ \text{Hz}\) environ.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : lire \(\tau\) à 63 % de la valeur finale alors que la grandeur ne part pas de zéro. C'est 63 % de la <em>variation</em> \(x_\infty - x(0^+)\) qu'il faut compter à partir de \(x(0^+)\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CIRCUITS À DEUX MAILLES</div>
  <h2>Un seul élément réactif, plusieurs résistances</h2>
  <div class="intro">Dès qu'une résistance est branchée en dérivation (un capteur, un appareil de mesure, une résistance de protection), le circuit compte deux mailles. Il reste du premier ordre tant qu'il ne contient qu'un condensateur ou qu'une bobine ; seuls changent la valeur finale et la constante de temps.</div>

</svg>
<figcaption>Avec \(E = 12\ \text{V}\), \(R_1 = 2{,}0\ \text{k}\Omega\), \(R_2 = 6{,}0\ \text{k}\Omega\), \(C = 10\ \mu\text{F}\) (rouge) : \(u\) tend vers \(E R_2/(R_1+R_2) = 9{,}0\ \text{V}\) avec \(\tau = (R_1 \parallel R_2)\,C = 15\ \text{ms}\). Sans \(R_2\) (bleu), on retrouve la charge simple vers \(12\ \text{V}\) avec \(R_1C = 20\ \text{ms}\). La résistance en dérivation abaisse la valeur finale et accélère la réponse.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — établir l'équation par la loi des nœuds</strong>
    <p>Dans le circuit ci-dessus, \(E = 12\ \text{V}\), \(R_1 = 2{,}0\ \text{k}\Omega\), \(R_2 = 6{,}0\ \text{k}\Omega\), \(C = 10\ \mu\text{F}\), condensateur déchargé ; on ferme K à \(t = 0\).</p>
    <ol>
      <li>Loi des nœuds en A : \(i_1 = i_C + i_2\), avec \(i_1 = (E - u)/R_1\), \(i_C = C\,\mathrm{d}u/\mathrm{d}t\) et \(i_2 = u/R_2\).</li>
      <li>D'où \(\dfrac{E - u}{R_1} = C\,\dfrac{\mathrm{d}u}{\mathrm{d}t} + \dfrac{u}{R_2}\). En multipliant par \(R_1R_2/(R_1 + R_2)\) :</li>
    </ol>
    <div class="formula">$$\frac{R_1R_2}{R_1 + R_2}\,C\,\frac{\mathrm{d}u}{\mathrm{d}t} + u = \frac{R_2}{R_1 + R_2}\,E$$</div>
    <ol start="3">
      <li>Forme canonique : \(\tau = (R_1 \parallel R_2)\,C = 1{,}5\ \text{k}\Omega\times10\ \mu\text{F} = 15\ \text{ms}\) et \(u_\infty = ER_2/(R_1 + R_2) = 9{,}0\ \text{V}\).</li>
      <li>Avec \(u(0^+) = 0\) : \(u(t) = 9{,}0\,\left(1 - e^{-t/15\ \text{ms}}\right)\) V. À \(t = 0^+\), \(i_2 = 0\) et tout le courant \(i_1 = E/R_1 = 6{,}0\ \text{mA}\) charge le condensateur.</li>
      <li>Si l'on rouvre K une fois le régime permanent atteint, le condensateur se décharge dans \(R_2\) seule : nouvelle constante de temps \(R_2C = 60\ \text{ms}\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Raccourci de Thévenin.</strong> Vu des bornes du condensateur, le reste du circuit est un générateur de Thévenin \((E_{\text{th}}, R_{\text{th}})\) : \(E_{\text{th}} = ER_2/(R_1 + R_2)\) est la tension à vide, \(R_{\text{th}} = R_1 \parallel R_2\) la résistance vue sources éteintes. Le circuit est alors un simple RC : \(\tau = R_{\text{th}}C\) et \(u_\infty = E_{\text{th}}\). Pour une bobine : \(\tau = L/R_{\text{th}}\) et \(i_{L,\infty} = E_{\text{th}}/R_{\text{th}}\).
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(\tau = R_1C\) ou \((R_1 + R_2)\,C\). La résistance à associer au condensateur est celle qu'il « voit » quand on éteint les sources : ici \(R_1\) et \(R_2\) en parallèle, car toutes deux relient ses bornes une fois la source remplacée par un fil.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · BILANS D'ÉNERGIE</div>
  <h2>Où passe l'énergie fournie par la source ?</h2>
  <div class="intro">Multiplier la loi des mailles par le courant transforme une équation de tensions en équation de puissances. On voit alors à chaque instant quelle part de la puissance fournie est stockée et quelle part est dissipée.</div>
  <div class="prop-box">
    <strong>Bilan de puissance du circuit RC.</strong> En multipliant \(E = Ri + u_C\) par \(i = C\,\mathrm{d}u_C/\mathrm{d}t\) :
    <div class="formula" data-nom="Bilan de puissance (RC)">$$E\,i = R\,i^2 + \frac{\mathrm{d}}{\mathrm{d}t}\left(\frac12 C u_C^2\right)$$</div>
    puissance fournie par la source = puissance dissipée par effet Joule + puissance stockée. Pour le circuit RL : \(E\,i = R\,i^2 + \dfrac{\mathrm{d}}{\mathrm{d}t}\left(\tfrac12 L i^2\right)\).
  </div>

<figcaption>Charge sous \(E\) d'un condensateur initialement déchargé. À chaque instant, l'énergie fournie par la source (courbe du haut) est la somme de l'énergie stockée \(\tfrac12 C u_C^2\) (rouge) et de l'énergie dissipée dans \(R\) (bleu). Au début, presque tout est dissipé ; à la fin, la source a fourni \(CE^2\), dont la moitié seulement est stockée, quelle que soit la valeur de \(R\).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — la moitié perdue de la charge d'un condensateur</strong>
    <p>\(C = 100\ \mu\text{F}\), initialement déchargé, est chargé sous \(E = 12\ \text{V}\) à travers \(R\).</p>
    <ol>
      <li>Énergie fournie par la source : \(W_E = \displaystyle\int_0^\infty E\,i\,\mathrm{d}t = E\,q_{\text{finale}} = CE^2 = 14{,}4\ \text{mJ}\) (la source débite la charge \(CE\) sous la tension constante \(E\)).</li>
      <li>Énergie stockée : \(\tfrac12 CE^2 = 7{,}2\ \text{mJ}\). Par différence, \(7{,}2\ \text{mJ}\) ont été dissipés dans \(R\), la moitié de ce qu'a fourni la source.</li>
      <li>Ce partage ne dépend pas de \(R\) : une résistance plus faible charge plus vite, sous un courant plus fort, mais dissipe la même énergie. À la décharge, les \(7{,}2\ \text{mJ}\) stockés sont à leur tour dissipés dans la résistance.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le circuit RL n'a pas de « moitié »</strong>
    <p>Une source \(E = 12\ \text{V}\) alimente une bobine de \(0{,}20\ \text{H}\) dans une maille de résistance totale \(50\ \Omega\) : \(\tau = 4{,}0\ \text{ms}\), \(I_\infty = 0{,}24\ \text{A}\).</p>
    <ol>
      <li>En régime permanent, le courant ne s'annule pas : la source fournit et la résistance dissipe \(RI_\infty^2 = 2{,}9\ \text{W}\) en continu. L'énergie fournie croît sans limite ; la comparer à l'énergie stockée n'a pas de sens.</li>
      <li>Au bout de \(5\tau = 20\ \text{ms}\) : la source a fourni \(W_E = EI_\infty\left[t - \tau(1 - e^{-t/\tau})\right] \approx 46\ \text{mJ}\), la bobine stocke \(\tfrac12 Li^2 \approx 5{,}7\ \text{mJ}\), et \(40\ \text{mJ}\) ont été dissipés.</li>
      <li>Ce qu'on peut dire : sur la durée de l'établissement, la source fournit \(\tfrac12 LI_\infty^2\) de plus que ce que dissipe la résistance ; c'est l'énergie que la bobine rendra à l'ouverture du circuit.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : transposer au circuit RL le résultat « la moitié de l'énergie est dissipée ». Il ne vaut que pour la charge complète d'un condensateur par une source de tension constante.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SIMULATION NUMÉRIQUE : MÉTHODE D'EULER</div>
  <h2>Quand l'excitation n'est pas un échelon</h2>
  <div class="intro">Pour une tension d'entrée \(e(t)\) quelconque (rampe, signal mesuré, sinusoïde), l'équation \(\tau\,\mathrm{d}u/\mathrm{d}t + u = e(t)\) n'a pas toujours de solution simple à écrire. On la résout pas à pas : connaissant \(u\) à l'instant \(t_k\), l'équation donne la pente \(\mathrm{d}u/\mathrm{d}t\), et l'on avance d'un petit pas \(h\) en suivant cette pente. C'est la méthode d'Euler explicite, étudiée pour elle-même dans le chapitre d'informatique « Méthodes numériques » (§6 : principe, ordre, stabilité, coût ; exercice 09 : réponse à des créneaux).</div>
  <div class="prop-box">
    <strong>Schéma d'Euler pour un circuit du premier ordre.</strong> L'équation s'écrit \(\dfrac{\mathrm{d}u}{\mathrm{d}t} = F(t, u) = \dfrac{e(t) - u}{\tau}\). Avec les instants \(t_k = kh\) et \(u_k \approx u(t_k)\) :
    <div class="formula" data-nom="Méthode d'Euler (premier ordre)">$$u_{k+1} = u_k + h\,\frac{e(t_k) - u_k}{\tau}$$</div>
    Le pas doit être petit devant \(\tau\) : l'erreur est proportionnelle à \(h\), et le calcul diverge si \(h \gt 2\tau\).
  </div>
  <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> euler(F, t0, y0, h, n):
    <span class="str">"""Méthode d'Euler pour y' = F(t, y), y(t0) = y0 : renvoie les listes</span>
<span class="str">    des instants t_k = t0 + k*h et des approximations y_k de y(t_k), k = 0, …, n."""</span>
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)      <span class="cmt"># pente au point (t_k, y_k)</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys

tau = 1e-3                          <span class="cmt"># constante de temps RC (s)</span>
E = 5.0                             <span class="cmt"># tension (V)</span>
w = 1 / tau                         <span class="cmt"># pulsation choisie telle que w * tau = 1</span>

<span class="kw">def</span> e(t):
    <span class="kw">return</span> E * math.sin(w * t)      <span class="cmt"># excitation : n'importe quelle fonction de t</span>

<span class="kw">def</span> F(t, u):
    <span class="kw">return</span> (e(t) - u) / tau         <span class="cmt"># tau du/dt + u = e(t)</span>

ts, us = euler(F, 0, 0.0, tau / 50, 600)   <span class="cmt"># 600 pas de tau/50 : 12 tau</span></pre>
  <p>Le même programme traite n'importe quelle excitation : il suffit de changer la fonction <span class="code-inline">e</span>. Par exemple <span class="code-inline">return E</span> pour un échelon, <span class="code-inline">return E * t / tau</span> pour une rampe, ou une interpolation de valeurs mesurées.</p>
  <div class="method-box">
    <strong>Exemple — valider le programme sur l'échelon</strong>
    <p>Avec <span class="code-inline">e(t) = E</span>, la solution exacte est connue : \(u(\tau) = E(1 - e^{-1}) \approx 3{,}161\ \text{V}\).</p>
    <ol>
      <li>Avec \(h = \tau/10\) (10 pas), la récurrence \(u_{k+1} - E = (1 - h/\tau)(u_k - E)\) donne \(u_{10} = E\left(1 - 0{,}9^{10}\right) \approx 3{,}257\ \text{V}\) : 3 % d'écart.</li>
      <li>Avec \(h = \tau/100\) (100 pas) : \(E\left(1 - 0{,}99^{100}\right) \approx 3{,}170\ \text{V}\), soit 0,3 % : diviser le pas par 10 divise l'erreur par 10 (méthode d'ordre 1).</li>
      <li>En régime libre (\(e = 0\)), \(u_{k+1} = (1 - h/\tau)\,u_k\) : avec \(h = 2{,}5\,\tau\), le facteur vaut \(-1{,}5\), la solution numérique change de signe et explose (\(1\), \(-1{,}5\), \(2{,}25\), \(-3{,}4\)…) alors que la vraie tension décroît. D'où la condition \(h \lt 2\tau\), et en pratique \(h \leq \tau/20\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — réponse à une tension sinusoïdale</strong>
    <p>Le programme ci-dessus calcule la réponse à \(e(t) = E\sin(\omega t)\) avec \(\omega\tau = 1\).</p>
    <ol>
      <li>Après un régime transitoire de quelques \(\tau\), \(u\) oscille à la même pulsation que \(e\). Sur la dernière période (\(2\pi\tau\), soit 315 pas), le programme donne une amplitude de \(3{,}55\ \text{V}\).</li>
      <li>La théorie du régime sinusoïdal forcé (chapitre « Filtres ») prévoit \(E/\sqrt{1 + (\omega\tau)^2} = E/\sqrt2 \approx 3{,}54\ \text{V}\) et un retard de phase de \(\pi/4\) : l'écart de 0,5 % est l'erreur de la méthode avec \(h = \tau/50\).</li>
      <li>Le maximum de \(u\) suit celui de \(e\) de \(0{,}79\ \text{ms}\), soit un huitième de période : c'est bien un déphasage de \(\pi/4\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · 1er ORDRE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire de la partie 1.3 du programme : écrire les lois du condensateur et de la bobine, trouver les valeurs initiales et finales, établir et résoudre l'équation d'un circuit à une ou deux mailles, lire la constante de temps sur un relevé, faire un bilan d'énergie et simuler la réponse par la méthode d'Euler. Les méthodes 2 à 5 suffisent à traiter la plupart des circuits du premier ordre sans résoudre d'équation différentielle.</div>

  <div class="method-box"><strong>Méthode 1 — Écrire les lois du condensateur et de la bobine dans la bonne convention</strong>
    <ol>
      <li><span class="step">Repérer la convention</span> sur le schéma : récepteur si les flèches de \(u\) et de \(i\) sont opposées, générateur si elles sont de même sens.</li>
      <li><span class="step">En convention récepteur</span> : \(i = C\,\mathrm{d}u_C/\mathrm{d}t\) et \(u_L = L\,\mathrm{d}i_L/\mathrm{d}t\) (plus \(ri\) pour une bobine réelle). En convention générateur, changer le signe.</li>
      <li><span class="step">Énergies</span> : \(\tfrac12 Cu_C^2\) et \(\tfrac12 Li_L^2\), indépendantes de la convention (ce sont des carrés).</li>
    </ol>
    <p><em>Exemple éclair :</em> un condensateur de \(2{,}2\ \mu\text{F}\) est fléché en convention générateur, et sa tension baisse de \(1\,000\ \text{V·s}^{-1}\). Alors \(i = -C\,\mathrm{d}u/\mathrm{d}t = +2{,}2\ \text{mA}\) : il débite du courant dans le circuit, il se décharge.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Déterminer les valeurs juste après une manœuvre d'interrupteur</strong>
    <ol>
      <li><span class="step">Avant la manœuvre</span> (\(t = 0^-\)), le circuit est en général en régime permanent : calculer \(u_C(0^-)\) et \(i_L(0^-)\) avec le condensateur ouvert et la bobine en fil.</li>
      <li><span class="step">Continuités</span> : \(u_C(0^+) = u_C(0^-)\), \(i_L(0^+) = i_L(0^-)\).</li>
      <li><span class="step">Juste après</span> (\(t = 0^+\)), dans le nouveau circuit : le condensateur est une source de tension \(u_C(0^+)\), la bobine une source de courant \(i_L(0^+)\) ; les lois de Kirchhoff donnent toutes les autres grandeurs, qui peuvent avoir sauté.</li>
    </ol>
    <p><em>Exemple éclair :</em> une bobine est depuis longtemps alimentée par \(E = 6{,}0\ \text{V}\) à travers \(30\ \Omega\) : \(i_L(0^-) = 0{,}20\ \text{A}\). À \(t = 0\), on la débranche de la source et elle se retrouve en série avec \(R' = 120\ \Omega\). À \(0^+\), \(i_L = 0{,}20\ \text{A}\) traverse \(R'\) : la tension à ses bornes passe instantanément de 0 à \(R'i_L = 24\ \text{V}\) en valeur absolue, quatre fois la tension d'alimentation.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : poser \(i(0^+) = 0\) dans un circuit RC parce que « le courant était nul avant ». Le courant dans un condensateur n'est pas continu : à la fermeture sur un condensateur déchargé, il saute à \(E/R\).</div>

  <div class="method-box"><strong>Méthode 3 — Déterminer le régime permanent</strong>
    <ol>
      <li><span class="step">Remplacer</span> chaque condensateur par un interrupteur ouvert (\(i = 0\)) et chaque bobine idéale par un fil (\(u = 0\)) ; une bobine réelle, par sa résistance \(r\).</li>
      <li><span class="step">Résoudre le circuit résistif</span> obtenu (diviseurs, associations, lois de Kirchhoff).</li>
      <li><span class="step">Contrôler</span> : ce sont les valeurs vers lesquelles tend la solution, \(x_\infty\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E = 12\ \text{V}\), \(R_1 = 1{,}0\ \text{k}\Omega\) en série, puis \(C\) en parallèle avec \(R_2 = 2{,}0\ \text{k}\Omega\). En régime permanent, aucun courant dans \(C\) : diviseur de tension, \(u_{C,\infty} = 12\times2/3 = 8{,}0\ \text{V}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Établir l'équation différentielle et l'écrire sous forme canonique</strong>
    <ol>
      <li><span class="step">Choisir l'inconnue</span> : de préférence la grandeur continue (\(u_C\) ou \(i_L\)), qui donne directement la condition initiale.</li>
      <li><span class="step">Écrire la loi des mailles</span> (une maille) ou la loi des nœuds (deux mailles, méthode 6) avec les lois des dipôles.</li>
      <li><span class="step">Mettre sous la forme</span> \(\tau\,\mathrm{d}x/\mathrm{d}t + x = x_\infty\) : diviser par le coefficient de \(x\). Le coefficient de la dérivée est \(\tau\) ; vérifier qu'il est positif et homogène à un temps.</li>
    </ol>
    <p><em>Exemple éclair :</em> une bobine réelle (\(L = 50\ \text{mH}\), \(r = 10\ \Omega\)) en série avec \(R = 90\ \Omega\) sous \(E\) : \(E = (R + r)\,i + L\,\mathrm{d}i/\mathrm{d}t\), soit \(\dfrac{L}{R + r}\,\dfrac{\mathrm{d}i}{\mathrm{d}t} + i = \dfrac{E}{R + r}\) : \(\tau = 0{,}50\ \text{ms}\), et \(r\) compte dans \(\tau\) comme dans \(I_\infty\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Écrire la solution sans résoudre l'équation</strong>
    <ol>
      <li><span class="step">Trois nombres</span> : \(x(0^+)\) (méthode 2), \(x_\infty\) (méthode 3), \(\tau\) (méthode 4 ou 6).</li>
      <li><span class="step">Écrire</span> \(x(t) = x_\infty + \left(x(0^+) - x_\infty\right)e^{-t/\tau}\) pour \(t \gt 0\).</li>
      <li><span class="step">Exploiter</span> : instant où \(x\) atteint une valeur \(x_1\), \(t_1 = \tau\ln\dfrac{x(0^+) - x_\infty}{x_1 - x_\infty}\) ; durée du transitoire \(3\tau\) (à 5 %).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_C\) passe de \(2{,}0\ \text{V}\) à une valeur finale de \(10\ \text{V}\) avec \(\tau = 3{,}0\ \text{ms}\) : \(u_C(t) = 10 - 8{,}0\,e^{-t/\tau}\) (en volts). Elle atteint \(9{,}0\ \text{V}\) au bout de \(\tau\ln 8 \approx 6{,}2\ \text{ms}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer la formule à travers une manœuvre d'interrupteur. Elle ne vaut qu'entre deux manœuvres ; à chaque changement d'état du circuit, on recommence avec de nouvelles valeurs initiales, finales et une nouvelle constante de temps, en partant de l'instant de la manœuvre.</div>

  <div class="method-box"><strong>Méthode 6 — Traiter un circuit à deux mailles</strong>
    <ol>
      <li><span class="step">Par la loi des nœuds</span> au nœud où arrive le condensateur (ou la bobine) : exprimer chaque courant avec l'inconnue, puis regrouper sous forme canonique.</li>
      <li><span class="step">Ou par Thévenin</span> : vu des bornes du condensateur (de la bobine), remplacer le reste par \((E_{\text{th}}, R_{\text{th}})\) : \(E_{\text{th}}\) = tension à vide, \(R_{\text{th}}\) = résistance vue sources éteintes. Alors \(\tau = R_{\text{th}}C\) (ou \(L/R_{\text{th}}\)) et \(u_{C,\infty} = E_{\text{th}}\) (ou \(i_{L,\infty} = E_{\text{th}}/R_{\text{th}}\)).</li>
      <li><span class="step">Vérifier</span> les deux limites : \(R_2 \to \infty\) doit redonner le circuit simple.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E\) alimente le nœud N à travers \(R_1 = 3{,}0\ \text{k}\Omega\) ; \(R_2 = 6{,}0\ \text{k}\Omega\) relie N à la masse ; \(R_3 = 1{,}0\ \text{k}\Omega\) en série avec \(C = 1{,}0\ \mu\text{F}\) relient aussi N à la masse. Vue de \(C\), sources éteintes : \(R_{\text{th}} = R_3 + R_1 \parallel R_2 = 1 + 2 = 3{,}0\ \text{k}\Omega\), donc \(\tau = 3{,}0\ \text{ms}\) ; et \(u_{C,\infty} = ER_2/(R_1 + R_2) = 2E/3\) (aucun courant dans \(R_3\) en régime permanent).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Lire \(\tau\) et les régimes sur un relevé expérimental</strong>
    <ol>
      <li><span class="step">Repérer</span> la valeur initiale et la valeur finale (palier du régime permanent).</li>
      <li><span class="step">63 %</span> : \(\tau\) est l'instant où la grandeur a parcouru 63 % de sa variation (il en reste 37 %). Contrôle : à \(3\tau\), il reste 5 % ; à \(5\tau\), moins de 1 %.</li>
      <li><span class="step">Régression</span> : tracer \(\ln|x - x_\infty|\) en fonction de \(t\) ; c'est une droite de pente \(-1/\tau\) si le système est bien du premier ordre.</li>
      <li><span class="step">Remonter aux composants</span> : \(C = \tau/R\), \(L = R\tau\), avec la résistance totale de la maille (GBF et résistance de la bobine compris).</li>
    </ol>
    <p><em>Exemple éclair :</em> une décharge part de \(8{,}0\ \text{V}\) ; à \(t = 4{,}0\ \text{ms}\), on lit \(2{,}94\ \text{V}\), soit 37 % de la valeur initiale : \(\tau = 4{,}0\ \text{ms}\). Avec \(R = 2{,}0\ \text{k}\Omega\), \(C = 2{,}0\ \mu\text{F}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Faire un bilan énergétique</strong>
    <ol>
      <li><span class="step">Multiplier</span> la loi des mailles par le courant : chaque terme devient une puissance (\(Ei\) fournie, \(Ri^2\) dissipée, \(\mathrm{d}/\mathrm{d}t\) de \(\tfrac12 Cu_C^2\) ou \(\tfrac12 Li^2\) stockée).</li>
      <li><span class="step">Intégrer</span> entre deux instants : énergie fournie = énergie dissipée + variation de l'énergie stockée.</li>
      <li><span class="step">Calculer le plus simple</span> des trois termes (souvent l'énergie stockée, ou l'énergie fournie \(E\times\) charge débitée) et en déduire le troisième par différence.</li>
    </ol>
    <p><em>Exemple éclair :</em> un condensateur de \(47\ \mu\text{F}\) chargé sous \(20\ \text{V}\) se décharge entièrement dans une résistance : elle dissipe \(\tfrac12 CU_0^2 = 9{,}4\ \text{mJ}\), quelle que soit sa valeur (seule la durée de la décharge en dépend).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « la moitié de l'énergie fournie est dissipée » ne vaut que pour la charge complète d'un condensateur initialement déchargé sous une tension constante. Dans un circuit RL en régime permanent, la résistance dissipe en continu.</div>

  <div class="method-box"><strong>Méthode 9 — Simuler la réponse par la méthode d'Euler</strong>
    <ol>
      <li><span class="step">Mettre l'équation sous la forme</span> \(\mathrm{d}x/\mathrm{d}t = F(t, x)\) : pour un circuit RC, \(F(t, u) = (e(t) - u)/\tau\) ; pour un circuit RL, \(F(t, i) = (e(t) - Ri)/L\).</li>
      <li><span class="step">Choisir</span> la condition initiale (continuité) et un pas \(h\) petit devant \(\tau\).</li>
      <li><span class="step">Itérer</span> \(x_{k+1} = x_k + h\,F(t_k, x_k)\) avec \(t_k = kh\) : la fonction <span class="code-inline">euler(F, t0, y0, h, n)</span> du cours (§9) le fait pour n'importe quelle excitation \(e(t)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> circuit RL, \(E = 10\ \text{V}\), \(R = 100\ \Omega\), \(L = 0{,}10\ \text{H}\) (\(\tau = 1{,}0\ \text{ms}\)), \(h = 0{,}10\ \text{ms}\), \(i_0 = 0\). Premier pas : \(i_1 = 0 + h\,E/L = 0{,}010\ \text{A}\). Deuxième : \(i_2 = 0{,}010 + 10^{-4}\times(10 - 1{,}0)/0{,}10 = 0{,}019\ \text{A}\), pour une valeur exacte \(0{,}10\,(1 - e^{-0{,}2}) \approx 0{,}018\ \text{A}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Choisir le pas et valider une simulation</strong>
    <ol>
      <li><span class="step">Stabilité</span> : pour \(\mathrm{d}x/\mathrm{d}t = -x/\tau + \ldots\), il faut \(h \lt 2\tau\), sinon la solution numérique oscille et diverge.</li>
      <li><span class="step">Précision</span> : l'erreur est proportionnelle à \(h\) ; en pratique \(h \leq \tau/20\) (et petit devant la durée des variations de l'excitation).</li>
      <li><span class="step">Valider</span> : comparer à une solution exacte connue (échelon), puis refaire le calcul avec \(h/2\) : si le résultat change à peine, le pas convient.</li>
    </ol>
    <p><em>Exemple éclair :</em> charge d'un condensateur, \(u(\tau)\) exact \(= 0{,}632\,E\). Euler donne \(0{,}651\,E\) avec \(h = \tau/10\) et \(0{,}634\,E\) avec \(h = \tau/100\) : l'erreur (3 % puis 0,3 %) est bien divisée par 10 quand le pas l'est.</p>
  </div>
</div>
</template>

<div class="exo">

  <h3>Condensateur et bobine : courant, tension, énergie</h3>
  <div class="statement">Les dipôles sont orientés en convention récepteur.</div>
  <div class="q"><strong>Q1.</strong> La tension aux bornes d'un condensateur de \(10\ \mu\text{F}\) croît linéairement de 0 à \(5{,}0\ \text{V}\) en \(2{,}0\ \text{ms}\), puis reste constante. Tracer l'allure du courant. Quelle énergie le condensateur stocke-t-il à la fin ?</div>
  <div class="q"><strong>Q2.</strong> Le courant dans une bobine idéale de \(20\ \text{mH}\) croît linéairement de 0 à \(0{,}50\ \text{A}\) en \(1{,}0\ \text{ms}\), puis décroît linéairement jusqu'à 0 en \(4{,}0\ \text{ms}\). Calculer la tension à ses bornes dans chaque phase et l'énergie maximale stockée.</div>
  <div class="q"><strong>Q3.</strong> Un supercondensateur de \(350\ \text{F}\) est chargé sous \(2{,}7\ \text{V}\). Quelle énergie stocke-t-il ? Quelle puissance moyenne fournit-il s'il la restitue en 10 s ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(i = C\,\mathrm{d}u_C/\mathrm{d}t\) : pendant la rampe, \(\mathrm{d}u_C/\mathrm{d}t = 5{,}0\ \text{V}/2{,}0\ \text{ms}\), soit \(2{,}5\times10^{3}\ \text{V·s}^{-1}\), donc \(i = 25\ \text{mA}\) (constant) ; ensuite \(i = 0\). Le courant est un créneau : il saute de 25 mA à 0 à \(t = 2\ \text{ms}\), alors que la tension est continue. Énergie : \(\tfrac12\times10^{-5}\times5{,}0^2 = 125\ \mu\text{J}\).</p>
    <p><strong>Q2.</strong> Montée : \(u_L = L\,\Delta i/\Delta t = 0{,}020\times0{,}50/10^{-3} = 10\ \text{V}\). Descente : \(\Delta i = -0{,}50\ \text{A}\) en \(\Delta t = 4{,}0\ \text{ms}\), d'où \(u_L = -2{,}5\ \text{V}\). La tension est discontinue, le courant continu. Énergie maximale (à \(i = 0{,}50\ \text{A}\)) : \(\tfrac12\times0{,}020\times0{,}50^2 = 2{,}5\ \text{mJ}\) ; elle est reçue pendant la montée (\(u_Li \gt 0\)) et restituée pendant la descente (\(u_Li \lt 0\)).</p>
    <p><strong>Q3.</strong> \(\tfrac12\times350\times2{,}7^2 \approx 1{,}3\ \text{kJ}\) ; en 10 s, une puissance moyenne d'environ \(130\ \text{W}\). Un supercondensateur stocke peu d'énergie (une batterie de téléphone en contient trente fois plus), mais peut la restituer très vite.</p>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Quelle grandeur faut-il tracer en fonction de \(t\) pour obtenir une droite ? La régression linéaire sur les sept points donne une pente de \(-2{,}129\ \text{s}^{-1}\). En déduire \(\tau\), puis \(C\).</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u(t) = U_0\,e^{-t/\tau}\) avec \(\tau = RC\). Il reste 37 % de \(9{,}00\ \text{V}\), soit \(3{,}33\ \text{V}\), entre 0,40 s et 0,60 s ; une interpolation linéaire donne \(\tau \approx 0{,}48\ \text{s}\) (la courbe n'étant pas une droite, l'interpolation surestime un peu). Demi-vie : \(u = 4{,}50\ \text{V}\) entre 0,20 et 0,40 s, vers 0,33 s, cohérent avec \(\tau\ln 2\).</p>
    <p><strong>Q2.</strong> \(\ln u = \ln U_0 - t/\tau\) : on trace \(\ln u\) en fonction de \(t\), droite de pente \(-1/\tau\). Ici \(\tau = 1/2{,}129 \approx 0{,}470\ \text{s}\) et \(C = \tau/R = 0{,}470/10^{4} \approx 47\ \mu\text{F}\). La régression utilise tous les points : elle est plus précise que la lecture d'un seul point, et l'alignement des points vérifie que le système est bien du premier ordre.</p>

<div class="exo">

  <h3>Établissement du courant dans un circuit RL</h3>
  <div class="statement">

  </div>
  <p class="exo-part">Partie A — Régime transitoire</p>
  <div class="q"><strong>A1.</strong> Établir l'équation différentielle vérifiée par \(i(t)\), puis donner la constante de temps \(\tau\) et l'expression de \(i(t)\).</div>
  <div class="q"><strong>A2.</strong> Donner l'expression de la tension \(u_L(t)\) aux bornes de la bobine. Que valent \(i\) et \(u_L\) à \(t=0^+\) et en régime permanent ?</div>
  <p class="exo-part">Partie B — Énergie et régime établi</p>
  <div class="q"><strong>B1.</strong> Calculer \(\tau\) et l'intensité \(I_\infty\) en régime permanent.</div>
  <div class="q"><strong>B2.</strong> Calculer l'énergie magnétique stockée dans la bobine en régime permanent, et la puissance dissipée par \(R\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Loi des mailles : \(E = Ri + L\dfrac{\mathrm di}{\mathrm dt}\), soit \(\dfrac{\mathrm di}{\mathrm dt} + \dfrac{R}{L}\,i = \dfrac{E}{L}\). Constante de temps \(\tau = L/R\). Solution (avec \(i(0)=0\)) : \(i(t) = \dfrac{E}{R}\bigl(1 - e^{-t/\tau}\bigr)\).</p>
    <p><strong>A2.</strong> \(u_L = L\dfrac{\mathrm di}{\mathrm dt} = E\,e^{-t/\tau}\). À \(t=0^+\) : \(i = 0\) (continuité du courant dans une bobine) et \(u_L = E\) (la bobine se comporte un instant comme un interrupteur ouvert). En régime permanent : \(i = E/R\) et \(u_L = 0\) (la bobine est équivalente à un fil).</p>
    <p><strong>B1.</strong> \(\tau = L/R = 0{,}10/100\), soit \(1{,}0\ \text{ms}\). \(I_\infty = E/R = 10/100 = 0{,}10\ \text{A}\).</p>
    <p><strong>B2.</strong> Énergie stockée : \(\mathcal E_L = \tfrac12 L I_\infty^2\), soit \(\tfrac12\times0{,}10\times0{,}10^2 = 5{,}0\times10^{-4}\ \text{J}\). Puissance dissipée en régime permanent : \(P_R = R I_\infty^2 = 100\times(0{,}10)^2 = 1{,}0\ \text{W}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Couper le courant d'un contacteur</h3>
  <div class="statement">La bobine d'un contacteur industriel (\(L = 0{,}50\ \text{H}\), résistance \(r = 20\ \Omega\)) est alimentée sous \(E = 24\ \text{V}\) par un interrupteur K. Une résistance de protection \(R' = 100\ \Omega\) est branchée en permanence en parallèle sur la bobine (montage du §5 du cours).</div>
  <div class="q"><strong>Q1.</strong> On ferme K, la bobine étant au repos. Justifier que \(R'\) n'intervient pas dans l'évolution de \(i_L\). Donner \(i_L(t)\), la constante de temps et la durée d'établissement à 5 % près.</div>
  <div class="q"><strong>Q2.</strong> Sans \(R'\), que se passerait-il à l'ouverture de K ?</div>
  <div class="q"><strong>Q3.</strong> Avec \(R'\), on ouvre K en régime permanent. Établir l'équation vérifiée par \(i_L\) et la résoudre. Que vaut la tension aux bornes de \(R'\) juste après l'ouverture ? Quelle énergie est dissipée ?</div>
  <div class="q"><strong>Q4.</strong> Les contacts tolèrent au plus 60 V aux bornes de la bobine. Quelle valeur maximale de \(R'\) faut-il choisir ? Quelle est alors la durée de l'extinction ? Commenter le compromis.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> K fermé, la source idéale impose \(E\) aux bornes de l'ensemble bobine \(\parallel R'\) : la maille source–bobine donne \(E = ri_L + L\,\mathrm{d}i_L/\mathrm{d}t\), sans \(R'\) (qui est simplement parcourue par \(E/R' = 0{,}24\ \text{A}\)). Donc \(i_L(t) = \dfrac{E}{r}\left(1 - e^{-t/\tau}\right)\) avec \(E/r = 1{,}2\ \text{A}\) et \(\tau = L/r = 25\ \text{ms}\) ; établi à 5 % près en \(3\tau = 75\ \text{ms}\).</p>
    <p><strong>Q2.</strong> Le courant de la bobine devrait passer de 1,2 A à 0 instantanément, ce qui est impossible (\(i_L\) continu) : la tension aux bornes de la bobine devient très grande, jusqu'à ce qu'un arc électrique se forme entre les contacts de K, qui s'usent.</p>
    <p><strong>Q3.</strong> Après l'ouverture, la bobine et \(R'\) forment une maille sans source : \(0 = (r + R')\,i_L + L\,\mathrm{d}i_L/\mathrm{d}t\), d'où \(i_L(t) = I\,e^{-t/\tau'}\) avec \(I = 1{,}2\ \text{A}\) (continuité) et \(\tau' = L/(r + R') \approx 4{,}2\ \text{ms}\). Le courant \(I\) traverse \(R'\) dans le sens inverse de celui qu'y imposait la source : la tension à ses bornes passe de \(+24\ \text{V}\) à \(-R'I = -120\ \text{V}\). Toute l'énergie stockée, \(\tfrac12 LI^2 = 0{,}36\ \text{J}\), est dissipée dans \(r\) et \(R'\).</p>
    <p><strong>Q4.</strong> Il faut \(R'I \leq 60\ \text{V}\), soit \(R' \leq 50\ \Omega\). Alors \(\tau' = 0{,}50/70 \approx 7{,}1\ \text{ms}\) : l'extinction est plus lente (le contacteur retombe moins vite). Plus \(R'\) est petite, plus la surtension est faible, mais plus l'extinction est lente et plus \(R'\) consomme pendant le fonctionnement (\(E^2/R'\) : 5,8 W pour 100 Ω, 11,5 W pour 50 Ω). D'où l'usage d'une diode en parallèle, qui ne conduit qu'à l'ouverture.</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Par la loi des nœuds, établir l'équation différentielle vérifiée par \(u\). L'écrire sous forme canonique et identifier \(\tau\) et \(u_\infty\).</div>
  <div class="q"><strong>Q2.</strong> Retrouver ces deux valeurs par le modèle de Thévenin vu des bornes du condensateur.</div>
  <div class="q"><strong>Q3.</strong> Donner \(u(t)\) et le courant débité par la source à \(t = 0^+\). Au bout de combien de temps \(u\) atteint-elle \(5{,}0\ \text{V}\) ?</div>
  <div class="q"><strong>Q4.</strong> Le régime permanent étant atteint, on rouvre K (nouvelle origine des temps). Quelle est la nouvelle constante de temps ? Au bout de combien de temps \(u\) passe-t-elle sous \(1{,}0\ \text{V}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Au nœud supérieur : courant arrivant par \(R_1\), \((E - u)/R_1\), égal à la somme des courants partant dans \(C\) et \(R_2\), \(C\,\mathrm{d}u/\mathrm{d}t + u/R_2\). En multipliant par \(R_1R_2/(R_1 + R_2)\) :</p>
    <div class="formula">$$\frac{R_1R_2}{R_1 + R_2}\,C\,\frac{\mathrm{d}u}{\mathrm{d}t} + u = \frac{R_2}{R_1 + R_2}\,E$$</div>
    <p>d'où \(\tau = \dfrac{R_1R_2}{R_1 + R_2}\,C = 667\ \Omega\times4{,}7\ \mu\text{F} \approx 3{,}1\ \text{ms}\) et \(u_\infty = 9{,}0\times2/3 = 6{,}0\ \text{V}\).</p>
    <p><strong>Q2.</strong> Condensateur retiré, la tension à vide est celle du diviseur \(R_1\), \(R_2\) : \(E_{\text{th}} = 6{,}0\ \text{V}\). Source éteinte (remplacée par un fil), le condensateur voit \(R_1\) et \(R_2\) en parallèle : \(R_{\text{th}} \approx 667\ \Omega\). Le circuit équivaut à un RC simple, d'où \(\tau = R_{\text{th}}C\) et \(u_\infty = E_{\text{th}}\).</p>
    <p><strong>Q3.</strong> \(u(t) = 6{,}0\left(1 - e^{-t/\tau}\right)\) V. À \(0^+\), \(u = 0\) : le courant débité vaut \(E/R_1 = 9{,}0\ \text{mA}\), entièrement absorbé par le condensateur (\(R_2\) n'est soumise à aucune tension). \(u = 5{,}0\ \text{V}\) quand \(e^{-t/\tau} = 1/6\), soit \(t = \tau\ln 6 \approx 5{,}6\ \text{ms}\).</p>
    <p><strong>Q4.</strong> K ouvert, \(R_1\) n'est plus parcourue : le condensateur se décharge dans \(R_2\) seule, \(\tau' = R_2C = 9{,}4\ \text{ms}\), trois fois plus long. \(u = 6{,}0\,e^{-t/\tau'}\) passe sous \(1{,}0\ \text{V}\) au bout de \(\tau'\ln 6 \approx 17\ \text{ms}\).</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Déterminer \(i_L\), \(i_2\) et la tension aux bornes de la bobine à \(t = 0^+\), puis en régime permanent.</div>
  <div class="q"><strong>Q2.</strong> Établir l'équation différentielle vérifiée par \(i_L\) et donner \(i_L(t)\).</div>
  <div class="q"><strong>Q3.</strong> Le régime permanent étant atteint, on ouvre K. Que deviennent \(i_L\) et la tension aux bornes de \(R_2\) juste après ? Donner la nouvelle constante de temps et l'énergie dissipée dans \(R_2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À \(0^+\) : \(i_L = 0\) (continuité), donc tout le courant passe par \(R_1\) et \(R_2\) en série : \(i_2 = E/(R_1 + R_2) = 40\ \text{mA}\), et la bobine, en parallèle sur \(R_2\), a la tension \(R_2 i_2 = 8{,}0\ \text{V}\). En régime permanent, la bobine est un fil qui court-circuite \(R_2\) : \(i_2 = 0\), tension nulle, \(i_L = E/R_1 = 0{,}12\ \text{A}\).</p>
    <p><strong>Q2.</strong> Notons \(u\) la tension commune à la bobine et à \(R_2\), \(u = L\,\mathrm{d}i_L/\mathrm{d}t\). Loi des nœuds : \((E - u)/R_1 = i_L + u/R_2\), soit \(E/R_1 - i_L = u\left(\dfrac{1}{R_1} + \dfrac{1}{R_2}\right)\). Ainsi</p>
    <div class="formula">$$\frac{L}{R_1 \parallel R_2}\,\frac{\mathrm{d}i_L}{\mathrm{d}t} + i_L = \frac{E}{R_1}$$</div>
    <p>avec \(R_1 \parallel R_2 \approx 66{,}7\ \Omega\) : \(\tau = 4{,}5\ \text{ms}\), et \(i_L(t) = 0{,}12\left(1 - e^{-t/\tau}\right)\) A. Par Thévenin vu de la bobine : \(E_{\text{th}} = 8{,}0\ \text{V}\), \(R_{\text{th}} = 66{,}7\ \Omega\), \(i_{L,\infty} = E_{\text{th}}/R_{\text{th}} = 0{,}12\ \text{A}\) : même résultat.</p>
    <p><strong>Q3.</strong> \(i_L\) reste égal à \(0{,}12\ \text{A}\) et se referme par \(R_2\), qu'il traverse de bas en haut : la tension de \(R_2\) (orientée comme \(u\)) saute de 0 à \(-R_2\times0{,}12 = -24\ \text{V}\), deux fois la f.é.m. en valeur absolue. Nouvelle constante de temps \(L/R_2 = 1{,}5\ \text{ms}\) ; \(R_2\) dissipe toute l'énergie stockée, \(\tfrac12\times0{,}30\times0{,}12^2 \approx 2{,}2\ \text{mJ}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Bilan d'énergie du circuit RL</h3>
  <div class="statement">Une source \(E = 12\ \text{V}\) alimente à \(t = 0\) une bobine de \(0{,}20\ \text{H}\) dans une maille de résistance totale \(R = 50\ \Omega\), le courant étant initialement nul. Un étudiant affirme : « comme pour le condensateur, la moitié de l'énergie fournie par la source est stockée dans la bobine ».</div>
  <div class="q"><strong>Q1.</strong> Donner \(i(t)\), \(\tau\) et \(I_\infty\).</div>
  <div class="q"><strong>Q2.</strong> Écrire le bilan de puissance à chaque instant. En déduire, entre 0 et \(T\), une relation entre l'énergie fournie \(W_E(T)\), l'énergie dissipée \(W_J(T)\) et l'énergie stockée.</div>
  <div class="q"><strong>Q3.</strong> Calculer ces trois énergies pour \(T = 5\tau\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que, pour \(T \gg \tau\), \(W_E(T) \approx RI_\infty^2\,(T - \tau)\). Que vaut \(W_E - W_J\) dans cette limite ? Conclure sur l'affirmation.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(i(t) = I_\infty\left(1 - e^{-t/\tau}\right)\), \(\tau = L/R = 4{,}0\ \text{ms}\), \(I_\infty = E/R = 0{,}24\ \text{A}\).</p>
    <p><strong>Q2.</strong> En multipliant \(E = Ri + L\,\mathrm{d}i/\mathrm{d}t\) par \(i\) : \(Ei = Ri^2 + \dfrac{\mathrm{d}}{\mathrm{d}t}\left(\tfrac12 Li^2\right)\). En intégrant de 0 à \(T\) (\(i(0) = 0\)) : \(W_E(T) = W_J(T) + \tfrac12 L\,i(T)^2\).</p>
    <p><strong>Q3.</strong> Énergie fournie :</p><div class="formula">$$W_E(T) = \int_0^T EI_\infty\left(1 - e^{-t/\tau}\right)\mathrm{d}t = EI_\infty\left[T - \tau\left(1 - e^{-T/\tau}\right)\right]$$</div><p>Pour \(T = 20\ \text{ms}\) : \(W_E \approx 46\ \text{mJ}\) ; énergie stockée \(\tfrac12 L\,i(T)^2 \approx 5{,}7\ \text{mJ}\) ; \(W_J = W_E - \tfrac12 Li^2 \approx 40\ \text{mJ}\). La bobine ne stocke que 12 % de l'énergie fournie.</p>
    <p><strong>Q4.</strong> Pour \(T \gg \tau\), \(e^{-T/\tau} \to 0\) et \(W_E \approx EI_\infty(T - \tau) = RI_\infty^2\,(T - \tau)\) puisque \(E = RI_\infty\). Alors \(W_E - W_J \to \tfrac12 LI_\infty^2 = 5{,}8\ \text{mJ}\), une constante, alors que \(W_E\) croît sans limite (la résistance dissipe \(RI_\infty^2 = 2{,}9\ \text{W}\) en permanence). L'affirmation est fausse : le résultat « moitié-moitié » est propre à la charge d'un condensateur, où le courant finit par s'annuler. Ce qui est vrai : sur l'ensemble de l'établissement, la source fournit \(\tfrac12 LI_\infty^2\) de plus que ce que dissipe la résistance, et la bobine le rendra à l'ouverture.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Réponse à une rampe par la méthode d'Euler</h3>
  <div class="statement">Un circuit RC (\(\tau = RC = 1{,}0\ \text{ms}\)), initialement déchargé, est alimenté à partir de \(t = 0\) par une tension en rampe \(e(t) = at\), avec \(a = 1{,}0\ \text{V·ms}^{-1} = 1{,}0\times10^{3}\ \text{V·s}^{-1}\). On dispose de la fonction <span class="code-inline">euler(F, t0, y0, h, n)</span> du cours (§9), qui renvoie les listes des instants et des valeurs approchées.</div>
  <div class="q"><strong>Q1.</strong> Écrire l'équation différentielle vérifiée par \(u = u_C\) et la relation de récurrence de la méthode d'Euler de pas \(h\).</div>
  <div class="q"><strong>Q2.</strong> Écrire en Python la fonction <span class="code-inline">F</span> et l'appel qui calcule \(u\) jusqu'à \(5\ \text{ms}\) avec \(h = 0{,}1\ \text{ms}\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier que \(u(t) = a(t - \tau) + a\tau\,e^{-t/\tau}\) est la solution exacte. Le programme donne \(u(5\ \text{ms}) = 4{,}0052\ \text{V}\) avec \(h = 0{,}1\ \text{ms}\), et \(4{,}0066\ \text{V}\) avec \(h = 0{,}01\ \text{ms}\). Commenter.</div>
  <div class="q"><strong>Q4.</strong> Interpréter l'écart \(e(t) - u(t)\) pour \(t \gg \tau\). Que se passerait-il avec un pas \(h = 3\ \text{ms}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\tau\,\mathrm{d}u/\mathrm{d}t + u = at\), soit \(\mathrm{d}u/\mathrm{d}t = F(t, u) = (at - u)/\tau\), et \(u_{k+1} = u_k + h\,\dfrac{at_k - u_k}{\tau}\) avec \(t_k = kh\), \(u_0 = 0\).</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock">tau, a = 1e-3, 1000.0            <span class="cmt"># constante de temps (s), pente de la rampe (V/s)</span>

<span class="kw">def</span> F(t, u):
    <span class="kw">return</span> (a * t - u) / tau     <span class="cmt"># tau du/dt + u = e(t) = a t</span>

ts, us = euler(F, 0, 0.0, 1e-4, 50)     <span class="cmt"># 50 pas de 0,1 ms : jusqu'à 5 ms</span></pre>
    <p><strong>Q3.</strong> On calcule :</p><div class="formula">$$\tau u' + u = \tau a\left(1 - e^{-t/\tau}\right) + a(t - \tau) + a\tau e^{-t/\tau} = at$$</div><p>et \(u(0) = -a\tau + a\tau = 0\) : c'est la solution. Elle vaut \(u(5\ \text{ms}) = 4 + e^{-5} \approx 4{,}0067\ \text{V}\). Écarts : \(-1{,}6\ \text{mV}\) avec \(h = 0{,}1\ \text{ms}\), \(-0{,}17\ \text{mV}\) avec \(h = 0{,}01\ \text{ms}\) : diviser le pas par 10 divise l'erreur par 10, comme attendu pour la méthode d'Euler. (L'erreur est plus grande pendant le transitoire : à 1 ms, \(0{,}349\ \text{V}\) au lieu de \(0{,}368\ \text{V}\) avec le grand pas.)</p>
    <p><strong>Q4.</strong> Pour \(t \gg \tau\), \(u \approx a(t - \tau)\) : la tension du condensateur suit la rampe avec un retard \(\tau\), et \(e - u \to a\tau = 1{,}0\ \text{V}\) ; le courant \(C\,\mathrm{d}u/\mathrm{d}t \to Ca\) devient constant. Avec \(h = 3\ \text{ms} \gt 2\tau\), le facteur \(1 - h/\tau = -2\) amplifie l'écart à chaque pas : la solution numérique oscille et diverge.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Cycle charge–décharge d'un condensateur — bilan énergétique</h3>
  <div class="statement">
    Un condensateur \(C = 10\ \mu\text{F}\), initialement déchargé, est relié à un commutateur. <strong>Position 1</strong> : il se charge sous \(E = 12\ \text{V}\) à travers \(R_1 = 3{,}0\ \text{k}\Omega\). Une fois la charge terminée, on bascule en <strong>position 2</strong> : il se décharge à travers \(R_2 = 1{,}0\ \text{k}\Omega\).
  </div>
  <p class="exo-part">Partie A — Charge</p>
  <div class="q"><strong>A1.</strong> Donner la constante de temps \(\tau_1\) et l'expression de \(u_C(t)\). Au bout de combien de temps la charge est-elle pratiquement terminée ?</div>
  <div class="q"><strong>A2.</strong> Calculer l'énergie \(\mathcal E_C\) finalement stockée, l'énergie \(W_{R_1}\) dissipée par effet Joule dans \(R_1\) pendant toute la charge, et l'énergie \(W_{\text{src}}\) fournie par la source. Montrer que \(W_{R_1} = \tfrac12 C E^2\) <strong>indépendamment de \(R_1\)</strong>.</div>
  <p class="exo-part">Partie B — Décharge et bilan</p>
  <div class="q"><strong>B1.</strong> Donner \(\tau_2\), l'expression de \(u_C(t)\) et du courant \(i(t)\) pendant la décharge. Quelle est l'intensité maximale ?</div>
  <div class="q"><strong>B2.</strong> Calculer l'énergie dissipée dans \(R_2\) sur toute la décharge, puis dresser le bilan énergétique du cycle complet.</div>
  <div class="q"><strong>B3.</strong> Un étudiant affirme : « pour limiter l'échauffement de \(R_1\), il suffit de prendre \(R_1\) plus petit ». Que penser de cette affirmation au vu de A2 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(\tau_1 = R_1 C = 3{,}0\times10^3 \times 10\times10^{-6} = 30\ \text{ms}\). \(u_C(t) = E\bigl(1 - e^{-t/\tau_1}\bigr)\). Charge terminée à 5 % près à \(3\tau_1 = 90\ \text{ms}\), à plus de 99 % à \(5\tau_1 = 150\ \text{ms}\).</p>
    <p><strong>A2.</strong> Énergie stockée : \(\mathcal E_C = \tfrac12 C E^2\), soit \(\tfrac12\times10^{-5}\times12^2 = 720\ \mu\text{J}\). Énergie dissipée, avec \(i = \dfrac{E}{R_1}e^{-t/\tau_1}\) :</p>
    <div class="formula">$$W_{R_1} = \int_0^\infty R_1 i^2\,\mathrm dt = R_1\frac{E^2}{R_1^2}\,\frac{\tau_1}{2} = \frac{E^2\tau_1}{2R_1} = \frac12 C E^2 = 720\ \mu\text{J}$$</div>
    <p>indépendante de \(R_1\). Énergie fournie par la source :</p><div class="formula">$$W_{\text{src}} = \int_0^\infty E\,i\,\mathrm dt = E\,\frac{E}{R_1}\,\tau_1 = C E^2 = 1440\ \mu\text{J}$$</div><p>soit \(\mathcal E_C + W_{R_1}\) (conservation de l'énergie).</p>
    <p><strong>B1.</strong> En comptant le temps à partir du basculement et en orientant \(i\) dans le sens de la décharge : \(\tau_2 = R_2 C = 1{,}0\times10^3\times10^{-5} = 10\ \text{ms}\), \(u_C(t) = E\,e^{-t/\tau_2}\), \(i(t) = \dfrac{E}{R_2}e^{-t/\tau_2}\). Intensité maximale à \(t=0^+\) : \(I_{\max} = E/R_2 = 12\ \text{mA}\).</p>
    <p><strong>B2.</strong> Toute l'énergie stockée est dissipée dans \(R_2\) : \(W_{R_2} = \tfrac12 C E^2 = 720\ \mu\text{J}\). Bilan du cycle : la source a fourni \(1440\ \mu\text{J}\), intégralement convertis en chaleur (\(720\ \mu\text{J}\) dans \(R_1\) à la charge, \(720\ \mu\text{J}\) dans \(R_2\) à la décharge) ; le condensateur revient à son état initial.</p>
    <p><strong>B3.</strong> Affirmation <strong>fausse</strong> : \(W_{R_1} = \tfrac12 C E^2\) ne dépend ni de \(R_1\) ni de \(R_2\), mais seulement de \(C\) et \(E\). Diminuer \(R_1\) accélère la charge (\(\tau_1\) plus petit) et augmente le courant, mais l'énergie totale dissipée reste \(\tfrac12 C E^2\). Pour réduire les pertes à la charge, il faut une charge à courant maîtrisé (par exemple par un générateur de courant ou une alimentation à découpage), pas une simple résistance.</p>
  </div>
</div>

<figcaption>Commutateur en position 1 : la source haute tension \(E\) charge \(C\) à travers \(R_1\) ; \(R_2\) est une résistance de sécurité, toujours en parallèle sur \(C\). En position 2 : \(C\) se décharge dans le thorax du patient, modélisé par \(R_T\).</figcaption>
</figure>
  <p class="exo-part">Partie A — Charge (commutateur en position 1)</p>
  <div class="q"><strong>A1.</strong> Le condensateur étant déchargé, on place le commutateur en position 1 à \(t = 0\). Établir l'équation différentielle vérifiée par \(u\) et l'écrire sous forme canonique.</div>
  <div class="q"><strong>A2.</strong> Calculer la constante de temps \(\tau\) et la tension finale \(u_\infty\). Au bout de combien de temps le défibrillateur est-il chargé à 95 % ? Quelle énergie stocke-t-il alors ?</div>
  <p class="exo-part">Partie B — Rôle de la résistance de sécurité</p>
  <div class="q"><strong>B1.</strong> En régime permanent de charge, quelle puissance la source doit-elle fournir ? Où est-elle dissipée ?</div>
  <div class="q"><strong>B2.</strong> L'appareil est éteint alors qu'il est chargé (la source est déconnectée, le commutateur reste en position 1). Que devient le condensateur ? Au bout de combien de temps sa tension passe-t-elle sous \(50\ \text{V}\) ? Justifier la présence de \(R_2\).</div>
  <p class="exo-part">Partie C — Le choc (commutateur en position 2)</p>
  <div class="q"><strong>C1.</strong> Le condensateur étant chargé sous \(u_\infty\), on bascule en position 2 à \(t = 0\). Donner la constante de temps de la décharge (justifier qu'on peut négliger \(R_2\)) et l'intensité maximale du courant dans le thorax.</div>
  <div class="q"><strong>C2.</strong> L'appareil interrompt le choc au bout de \(t_1 = 6{,}0\ \text{ms}\) (onde « exponentielle tronquée »). Quelle énergie a reçu le patient ? Quelle tension reste-t-il aux bornes du condensateur ?</div>
  <p class="exo-part">Partie D — Simulation d'une charge progressive</p>
  <p>Pour ménager l'électronique, la tension de la source monte linéairement de 0 à \(E\) en \(T_m = 2{,}0\ \text{s}\), puis reste égale à \(E\). On simule la charge par la méthode d'Euler, avec la fonction <span class="code-inline">euler(F, t0, y0, h, n)</span> du cours.</p>
  <div class="q"><strong>D1.</strong> Montrer qu'il suffit de remplacer, dans l'équation de A1, \(u_\infty\) par \(u_\infty\min(t/T_m, 1)\). Écrire le programme qui calcule \(u\) sur 12 s avec un pas de 1 ms et détermine l'instant où \(u\) atteint 95 % de \(u_\infty\).</div>
  <div class="q"><strong>D2.</strong> Le programme renvoie 5,56 s. Vérifier ce résultat par le calcul exact, sachant qu'à la fin de la rampe \(u(T_m) = \dfrac{u_\infty}{T_m}\left(T_m - \tau + \tau\,e^{-T_m/\tau}\right)\). Combien de temps la montée progressive coûte-t-elle ? Le pas de 1 ms est-il adapté ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Loi des nœuds au point commun à \(R_1\), \(C\) et \(R_2\) : \(\dfrac{E - u}{R_1} = C\,\dfrac{\mathrm{d}u}{\mathrm{d}t} + \dfrac{u}{R_2}\). En multipliant par \(R_1R_2/(R_1 + R_2)\) : \(\tau\,\dfrac{\mathrm{d}u}{\mathrm{d}t} + u = u_\infty\), avec \(\tau = \dfrac{R_1R_2}{R_1 + R_2}\,C\) et \(u_\infty = \dfrac{R_2}{R_1 + R_2}\,E\) (générateur de Thévenin vu par \(C\)).</p>
    <p><strong>A2.</strong> \(R_1 \parallel R_2 \approx 9{,}90\ \text{k}\Omega\), donc \(\tau \approx 1{,}49\ \text{s}\), et \(u_\infty = 2\,000/1{,}01 \approx 1{,}98\ \text{kV}\). Avec \(u(0^+) = 0\) : \(u = u_\infty\left(1 - e^{-t/\tau}\right)\), à 95 % au bout de \(\tau\ln 20 \approx 4{,}4\ \text{s}\). Énergie stockée (à \(u_\infty\)) : \(\tfrac12\times150\times10^{-6}\times1\,980^2 \approx 294\ \text{J}\), l'ordre de grandeur des chocs délivrés par ces appareils (150 à 360 J).</p>
    <p><strong>B1.</strong> En régime permanent, aucun courant dans \(C\) : le courant \(E/(R_1 + R_2) \approx 1{,}98\ \text{mA}\) traverse \(R_1\) et \(R_2\). La source fournit \(E\times1{,}98\ \text{mA} \approx 4{,}0\ \text{W}\), dissipés presque entièrement dans \(R_2\) (\(u_\infty^2/R_2 \approx 3{,}9\ \text{W}\)) et très peu dans \(R_1\) (\(0{,}04\ \text{W}\)).</p>
    <p><strong>B2.</strong> Le condensateur se décharge dans \(R_2\) seule (\(R_1\) n'est plus reliée à rien) : \(\tau' = R_2C = 150\ \text{s}\). \(u = 1\,980\,e^{-t/\tau'}\) passe sous 50 V au bout de \(\tau'\ln(1\,980/50) \approx 550\ \text{s}\), un peu plus de 9 minutes. Sans \(R_2\), un condensateur idéal garderait indéfiniment près de 300 J sous 2 kV : un danger mortel pour qui ouvrirait l'appareil. \(R_2\) est grande pour ne pas gêner la charge ni le choc, mais garantit la décharge en quelques minutes.</p>
    <p><strong>C1.</strong> En position 2, le condensateur se décharge dans \(R_T \parallel R_2 \approx R_T\) (\(R_2 = 2\times10^{4}\,R_T\) : elle reçoit 0,005 % du courant). \(\tau_d = R_TC = 7{,}5\ \text{ms}\). Le courant est maximal à \(t = 0^+\) (continuité de \(u\)) : \(I_{\max} = u_\infty/R_T \approx 40\ \text{A}\).</p>
    <p><strong>C2.</strong> \(u = u_\infty\,e^{-t/\tau_d}\) ; l'énergie stockée décroît comme \(e^{-2t/\tau_d}\). Le patient reçoit</p><div class="formula">$$\tfrac12 Cu_\infty^2\left(1 - e^{-2t_1/\tau_d}\right) = 294\times\left(1 - e^{-1{,}6}\right) \approx 235\ \text{J}$$</div><p>soit 80 % de l'énergie stockée. Il reste \(u(t_1) = 1\,980\,e^{-0{,}8} \approx 890\ \text{V}\), soit environ 59 J, dissipés ensuite dans une résistance interne de l'appareil.</p>
    <p><strong>D1.</strong> L'équation de A1 vient de la loi des nœuds, valable à chaque instant (ARQS) : avec \(E\) remplacée par \(e(t) = E\min(t/T_m, 1)\), le second membre \(e(t)\,R_2/(R_1 + R_2)\) devient \(u_\infty\min(t/T_m, 1)\), et \(\tau\) est inchangée.</p>
    <pre class="codeblock">C, E, R1, R2, Tm = 150e-6, 2000.0, 10e3, 1e6, 2.0
Rth = R1 * R2 / (R1 + R2)            <span class="cmt"># résistance vue par C (ohms)</span>
tau = Rth * C                        <span class="cmt"># constante de temps (s)</span>
uinf = E * R2 / (R1 + R2)            <span class="cmt"># tension finale (V)</span>

<span class="kw">def</span> F(t, u):
    eth = uinf * min(t / Tm, 1.0)    <span class="cmt"># f.é.m. de Thévenin : rampe puis palier</span>
    <span class="kw">return</span> (eth - u) / tau

ts, us = euler(F, 0, 0.0, 1e-3, 12000)   <span class="cmt"># 12 000 pas de 1 ms : 12 s</span>
k = 0
<span class="kw">while</span> us[k] &lt; 0.95 * uinf:
    k = k + 1
print(ts[k])                         <span class="cmt"># 5.559</span></pre>
    <p><strong>D2.</strong> À la fin de la rampe :</p><div class="formula">$$u(T_m) = \frac{1\,980}{2{,}0}\left(2{,}0 - 1{,}485 + 1{,}485\,e^{-1{,}347}\right) \approx 892\ \text{V}$$</div><p>Ensuite, la source est constante : \(u = u_\infty + \left(u(T_m) - u_\infty\right)e^{-(t - T_m)/\tau}\), qui atteint \(0{,}95\,u_\infty\) à l'instant</p><div class="formula">$$t = T_m + \tau\ln\frac{u_\infty - u(T_m)}{0{,}05\,u_\infty} \approx 2{,}0 + 1{,}485\times2{,}40 \approx 5{,}56\ \text{s}$$</div><p>en accord avec la simulation. La montée progressive retarde la fin de la charge d'environ 1,1 s (4,45 s sans rampe). Le pas de 1 ms vaut \(\tau/1\,500\) : très petit devant \(\tau\) (stabilité et précision assurées, la simulation donne \(u(T_m) = 892{,}05\ \text{V}\) contre \(892{,}23\ \text{V}\)), pour un coût de 12 000 pas, négligeable.</p>
  </div>
