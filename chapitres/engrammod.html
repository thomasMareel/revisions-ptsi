      <div class="sec-num">§1 · LES AUXILIAIRES MODAUX</div>
      <h2>Les modaux (modal verbs)</h2>
      <div class="intro">Les modaux (can, must, should, may…) expriment une <strong>attitude</strong> : capacité, obligation, conseil, probabilité. Invariables, suivis de la base verbale sans « to ».</div>
      <div class="prop-box"><strong>Capacité / permission</strong> : can, could (passé / politesse), be able to.</div>
      <div class="prop-box"><strong>Obligation</strong> : must (forte, interne) · have to (externe) · mustn't = interdiction · don't have to = pas obligé.</div>
      <div class="prop-box"><strong>Conseil</strong> : should, ought to, had better (mise en garde).</div>
      <div class="prop-box"><strong>Probabilité</strong> : may / might (possible) · must (quasi-certain : he must be tired) · can't (impossible).</div>
      <div class="notice">Reproche sur le passé : <em>should have</em> + participe passé (« you should have told me » = tu aurais dû me le dire).</div>
    </div>
