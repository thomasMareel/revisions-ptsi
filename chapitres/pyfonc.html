<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Des fonctions en argument</h3>
  <div class="statement">On dispose de <span class="code-inline">est_premier(n)</span> (cours, §2) et des fonctions <span class="code-inline">suivant(n)</span>, qui renvoie <span class="code-inline">n + 1</span>, et <span class="code-inline">carre(x)</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">appliquer(f, t)</span>, qui renvoie la liste des images par <span class="code-inline">f</span> des éléments de <span class="code-inline">t</span>. Que vaut <span class="code-inline">appliquer(est_premier, [1, 2, 9])</span> ?</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">tous(t, critere)</span>, qui renvoie <span class="code-inline">True</span> si <span class="code-inline">critere(x)</span> est vrai pour tous les éléments <span class="code-inline">x</span> de <span class="code-inline">t</span>. Que doit valoir <span class="code-inline">tous([], critere)</span> ?</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">compose(f, g, x)</span>, qui renvoie \(f(g(x))\). Calculer <span class="code-inline">compose(carre, suivant, 3)</span> et <span class="code-inline">compose(suivant, carre, 3)</span>.</div>
  <div class="q"><strong>Q4.</strong> Quel est le coût de <span class="code-inline">tous(t, est_premier)</span> pour une liste de \(n\) entiers tous inférieurs ou égaux à \(M\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> appliquer(f, t):
    <span class="str">"""Nouvelle liste des images f(x) des éléments x de t."""</span>
    <span class="kw">return</span> [f(x) <span class="kw">for</span> x <span class="kw">in</span> t]

<span class="kw">def</span> tous(t, critere):
    <span class="str">"""True si critere(x) est vrai pour tous les éléments x de t."""</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> <span class="kw">not</span> critere(x):
            <span class="kw">return</span> <span class="kw">False</span>
    <span class="kw">return</span> <span class="kw">True</span>

<span class="kw">def</span> compose(f, g, x):
    <span class="str">"""Valeur de f(g(x))."""</span>
    <span class="kw">return</span> f(g(x))

<span class="kw">def</span> suivant(n):
    <span class="kw">return</span> n + 1

<span class="kw">def</span> carre(x):
    <span class="kw">return</span> x * x</pre>
    <p><strong>Q1.</strong> <span class="code-inline">appliquer(est_premier, [1, 2, 9])</span> vaut <span class="code-inline">[False, True, False]</span>.</p>
    <p><strong>Q2.</strong> Un seul contre-exemple suffit à répondre <span class="code-inline">False</span> (sortie anticipée) ; on ne répond <span class="code-inline">True</span> qu'après la boucle. Pour une liste vide, la boucle ne s'exécute pas : <span class="code-inline">True</span>, ce qui est la convention logique (« tout élément de l'ensemble vide vérifie le critère »).</p>
    <p><strong>Q3.</strong> <span class="code-inline">compose(carre, suivant, 3)</span> vaut \((3 + 1)^2 = 16\) ; <span class="code-inline">compose(suivant, carre, 3)</span> vaut \(3^2 + 1 = 10\) : l'ordre compte.</p>
    <p><strong>Q4.</strong> Au plus \(n\) appels de <span class="code-inline">est_premier</span>, chacun de coût \(O(\sqrt M)\) : coût \(O(n\sqrt M)\) dans le pire cas (tous les éléments premiers, la boucle va jusqu'au bout).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>PGCD, PPCM et fraction irréductible</h3>
  <div class="statement">On construit une petite boîte à outils arithmétique en réutilisant les fonctions les unes dans les autres.</div>
  <p class="exo-part">Partie A — Algorithme d'Euclide</p>
  <div class="q"><strong>A1.</strong> Écrire <span class="code-inline">pgcd(a, b)</span> (entiers \(a, b \ge 0\) non tous deux nuls) par l'algorithme d'Euclide, avec une boucle <span class="code-inline">while</span>.</div>
  <div class="q"><strong>A2.</strong> Dérouler <span class="code-inline">pgcd(48, 36)</span> en donnant les valeurs successives du couple <span class="code-inline">(a, b)</span>.</div>
  <p class="exo-part">Partie B — Réutilisation</p>
  <div class="q"><strong>B1.</strong> Écrire <span class="code-inline">ppcm(a, b)</span> (\(a, b \gt 0\)) en appelant <span class="code-inline">pgcd</span>. Justifier que la division entière <span class="code-inline">a * b // pgcd(a, b)</span> est exacte.</div>
  <div class="q"><strong>B2.</strong> Écrire <span class="code-inline">reduire(p, q)</span> (\(p \ge 0\), \(q \gt 0\)), qui renvoie la fraction \(p/q\) sous forme irréductible, comme couple (numérateur, dénominateur). Tester sur <span class="code-inline">reduire(18, 24)</span>.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> pgcd(a, b):
    <span class="str">"""a, b entiers &gt;= 0 non tous deux nuls : leur pgcd (algorithme d'Euclide)."""</span>
    <span class="kw">while</span> b != 0:
        a, b = b, a % b
    <span class="kw">return</span> a

<span class="kw">def</span> ppcm(a, b):
    <span class="str">"""a, b entiers &gt; 0 : leur ppcm."""</span>
    <span class="kw">return</span> a * b // pgcd(a, b)

<span class="kw">def</span> reduire(p, q):
    <span class="str">"""p entier &gt;= 0, q entier &gt; 0 : fraction p/q irréductible, couple (num, dén)."""</span>
    g = pgcd(p, q)
    <span class="kw">return</span> p // g, q // g

reduire(18, 24)              <span class="cmt"># (3, 4) car pgcd(18, 24) = 6</span></pre>
    <p><strong>A1.</strong> L'affectation simultanée <span class="code-inline">a, b = b, a % b</span> calcule les deux valeurs avant de les ranger. La boucle termine : <span class="code-inline">b</span> est un entier positif ou nul qui diminue strictement à chaque tour (\(a \bmod b \lt b\)), c'est un variant (<em>Spécification, correction et complexité</em>, §3).</p>
    <p><strong>A2.</strong> \((48, 36) \to (36, 12) \to (12, 0)\) : \(b = 0\), la fonction renvoie 12.</p>
    <p><strong>B1.</strong> Le pgcd \(g\) divise \(a\), donc divise \(a\,b\) : la division tombe juste. On utilise l'identité \(a\,b = \operatorname{pgcd}(a, b) \times \operatorname{ppcm}(a, b)\). (Calculer <span class="code-inline">a // pgcd(a, b) * b</span> donnerait le même résultat avec des nombres intermédiaires plus petits.)</p>
    <p><strong>B2.</strong> \(\operatorname{pgcd}(18, 24) = 6\) : <span class="code-inline">reduire(18, 24)</span> renvoie <span class="code-inline">(3, 4)</span>. Pour \(p = 0\), \(\operatorname{pgcd}(0, q) = q\) et l'on obtient <span class="code-inline">(0, 1)</span>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Nombres parfaits et amicaux : décomposer et estimer le coût</h3>
  <div class="statement">Les <strong>diviseurs propres</strong> d'un entier \(n \ge 1\) sont ses diviseurs \(d\) tels que \(1 \le d \lt n\). Un entier \(n \ge 2\) est <strong>parfait</strong> s'il est égal à la somme de ses diviseurs propres : \(6 = 1 + 2 + 3\). Deux entiers distincts \(a\) et \(b\) sont <strong>amicaux</strong> si chacun est la somme des diviseurs propres de l'autre.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">somme_diviseurs_propres(n)</span>, puis <span class="code-inline">est_parfait(n)</span> et <span class="code-inline">parfaits_jusqua(N)</span>, qui renvoie la liste des nombres parfaits de 1 à \(N\).</div>
  <div class="q"><strong>Q2.</strong> Évaluer le coût de <span class="code-inline">parfaits_jusqua(N)</span> en nombre de divisions.</div>
  <div class="q"><strong>Q3.</strong> Les diviseurs de \(n\) vont par paires \((d, n /\!/ d)\), avec \(d \le \sqrt n\). Réécrire <span class="code-inline">somme_diviseurs_propres</span> avec un coût \(O(\sqrt n)\), en prenant garde aux carrés parfaits. Quel est le nouveau coût de <span class="code-inline">parfaits_jusqua(N)</span> ?</div>
  <div class="q"><strong>Q4.</strong> Écrire <span class="code-inline">amicaux_jusqua(N)</span>, qui renvoie la liste des couples \((a, b)\) d'entiers amicaux avec \(a \lt b \le N\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> somme_diviseurs_propres(n):
    <span class="str">"""Somme des diviseurs d de n tels que 1 &lt;= d &lt; n (n entier &gt;= 1)."""</span>
    s = 0
    <span class="kw">for</span> d <span class="kw">in</span> range(1, n):
        <span class="kw">if</span> n % d == 0:
            s = s + d
    <span class="kw">return</span> s

<span class="kw">def</span> est_parfait(n):
    <span class="kw">return</span> n &gt;= 2 <span class="kw">and</span> somme_diviseurs_propres(n) == n

<span class="kw">def</span> parfaits_jusqua(N):
    <span class="str">"""Liste croissante des nombres parfaits compris entre 1 et N."""</span>
    res = []
    <span class="kw">for</span> n <span class="kw">in</span> range(1, N + 1):
        <span class="kw">if</span> est_parfait(n):
            res.append(n)
    <span class="kw">return</span> res</pre>
    <p><strong>Q1.</strong> <span class="code-inline">parfaits_jusqua(10000)</span> renvoie <span class="code-inline">[6, 28, 496, 8128]</span>. Dans <span class="code-inline">est_parfait</span>, l'opérateur <span class="code-inline">and</span> est paresseux : pour \(n = 1\), la somme n'est même pas calculée.</p>
    <p><strong>Q2.</strong> <span class="code-inline">somme_diviseurs_propres(n)</span> fait \(n - 1\) divisions (une par tour). <span class="code-inline">parfaits_jusqua(N)</span> l'appelle pour \(n = 1, \dots, N\) :</p>
    <div class="formula">$$\sum_{n=1}^{N} (n - 1) = \frac{N(N - 1)}{2},$$</div>
    <p>soit un coût quadratique \(O(N^2)\) : environ 50 millions de divisions pour \(N = 10^4\).</p>
    <p><strong>Q3.</strong> Pour \(n \ge 2\), on compte 1 d'office, puis chaque \(d\) de 2 à \(\sqrt n\) qui divise \(n\) avec son associé \(n /\!/ d\) (qui vaut au moins \(d\), et au plus \(n/2\), donc est bien un diviseur propre) ; si \(d = n /\!/ d\), c'est-à-dire \(n = d^2\), on ne l'ajoute qu'une fois.</p>
    <pre class="codeblock"><span class="kw">def</span> somme_diviseurs_propres(n):
    <span class="str">"""Même spécification, en O(√n) : les diviseurs vont par paires (d, n // d)."""</span>
    <span class="kw">if</span> n == 1:
        <span class="kw">return</span> 0
    s = 1                    <span class="cmt"># le diviseur 1 (n &gt;= 2)</span>
    d = 2
    <span class="kw">while</span> d * d &lt;= n:
        <span class="kw">if</span> n % d == 0:
            s = s + d
            <span class="kw">if</span> d != n // d:  <span class="cmt"># ne pas compter deux fois la racine d'un carré</span>
                s = s + n // d
        d = d + 1
    <span class="kw">return</span> s</pre>
    <p>Chaque appel coûte \(O(\sqrt n)\), d'où un total majoré par \(\sum_{n \le N} \sqrt n \le N\sqrt N\) : coût \(O(N\sqrt N)\), soit un million d'opérations au plus pour \(N = 10^4\), au lieu de 50 millions.</p>
    <p><strong>Q4.</strong> Pour chaque \(a\), on calcule \(b\) = somme des diviseurs propres de \(a\), puis on vérifie que la somme pour \(b\) redonne \(a\). La condition \(a \lt b\) écarte les nombres parfaits (\(b = a\)) et ne compte chaque couple qu'une fois.</p>
    <pre class="codeblock"><span class="kw">def</span> amicaux_jusqua(N):
    <span class="str">"""Liste des couples (a, b) avec a &lt; b &lt;= N, chacun égal à la somme</span>
<span class="str">    des diviseurs propres de l'autre."""</span>
    res = []
    <span class="kw">for</span> a <span class="kw">in</span> range(2, N + 1):
        b = somme_diviseurs_propres(a)
        <span class="kw">if</span> a &lt; b <span class="kw">and</span> b &lt;= N <span class="kw">and</span> somme_diviseurs_propres(b) == a:
            res.append((a, b))
    <span class="kw">return</span> res</pre>
    <p><span class="code-inline">amicaux_jusqua(10000)</span> renvoie <span class="code-inline">[(220, 284), (1184, 1210), (2620, 2924), (5020, 5564), (6232, 6368)]</span>. Au plus deux appels par valeur de \(a\) : coût \(O(N\sqrt N)\) avec la version de Q3 (la valeur \(b\) peut dépasser \(N\), mais \(b \le N\) est testé avant le second appel grâce à la paresse de <span class="code-inline">and</span>).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Horaires d'une ligne de car</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique de PT (thème : horaires de transport ; fonctions, tuples, appel par valeur, effets de bord, coût).</div>

  <pre class="codeblock">ligne_7 = [(<span class="str">"Gare"</span>, (7, 50)), (<span class="str">"Lycée"</span>, (8, 2)), (<span class="str">"Hôpital"</span>, (8, 9)),
           (<span class="str">"Zone Nord"</span>, (8, 31)), (<span class="str">"Aéroport"</span>, (8, 40))]</pre>
  Seuls les éléments de l'annexe Python du programme sont autorisés. Une question peut utiliser les fonctions des questions précédentes, même si elles n'ont pas été écrites.</div>

  <p class="exo-part">Partie A — Horaires</p>
  <div class="q"><strong>A1.</strong> Écrire <span class="code-inline">minutes(h: int, m: int) -&gt; int</span>, qui renvoie le nombre de minutes écoulées depuis minuit à l'horaire <span class="code-inline">(h, m)</span>.</div>
  <div class="q"><strong>A2.</strong> Écrire <span class="code-inline">horaire(n: int) -&gt; tuple</span>, qui renvoie l'horaire atteint \(n \ge 0\) minutes après minuit, en revenant à 0 h après 23 h 59. Que renvoie <span class="code-inline">horaire(1500)</span> ?</div>
  <div class="q"><strong>A3.</strong> Écrire <span class="code-inline">duree(dep: tuple, arr: tuple) -&gt; int</span>, qui renvoie la durée en minutes d'un trajet parti à l'horaire <span class="code-inline">dep</span> et arrivé à l'horaire <span class="code-inline">arr</span>, sachant qu'il dure moins de 24 heures et peut se terminer le lendemain : <span class="code-inline">duree((23, 40), (0, 15))</span> vaut 35. On n'utilisera l'opérateur <span class="code-inline">%</span> qu'avec des opérandes positifs.</div>

  <p class="exo-part">Partie B — Exploiter un passage</p>
  <div class="q"><strong>B1.</strong> Écrire <span class="code-inline">temps_parcours(ligne: list, i: int, j: int) -&gt; int</span> (\(i \le j\)), durée entre les passages aux arrêts d'indices <span class="code-inline">i</span> et <span class="code-inline">j</span>. Que vaut <span class="code-inline">temps_parcours(ligne_7, 0, 4)</span> ?</div>
  <div class="q"><strong>B2.</strong> Écrire <span class="code-inline">indice_arret(ligne: list, nom: str) -&gt; int</span>, indice de l'arrêt <span class="code-inline">nom</span>, ou -1 s'il n'est pas desservi.</div>
  <div class="q"><strong>B3.</strong> Écrire <span class="code-inline">plus_long_troncon(ligne: list) -&gt; int</span>, qui renvoie l'indice \(k\) du premier tronçon (de l'arrêt \(k\) à l'arrêt \(k + 1\)) de durée maximale. Que renvoie-t-elle pour <span class="code-inline">ligne_7</span> ? Combien d'appels de <span class="code-inline">duree</span> fait-elle pour une ligne de \(n\) arrêts ?</div>

  <p class="exo-part">Partie C — Attendre le car</p>
  <div class="statement">Les départs d'un arrêt sont donnés par une liste <strong>croissante</strong> d'horaires d'une même journée, par exemple <span class="code-inline">departs = [(6, 45), (7, 15), (7, 50), (8, 20)]</span>.</div>
  <div class="q"><strong>C1.</strong> Écrire <span class="code-inline">premier_depart(departs: list, t: tuple) -&gt; int</span>, indice du premier départ à l'horaire <span class="code-inline">t</span> ou après, -1 s'il n'y en a plus.</div>
  <div class="q"><strong>C2.</strong> Écrire <span class="code-inline">attente(departs: list, t: tuple) -&gt; int</span>, attente en minutes d'un voyageur arrivé à l'horaire <span class="code-inline">t</span> (-1 s'il n'y a plus de départ). Que valent <span class="code-inline">attente(departs, (7, 31))</span> et <span class="code-inline">attente(departs, (8, 21))</span> ?</div>
  <div class="q"><strong>C3.</strong> Quel est le coût de <span class="code-inline">premier_depart</span> dans le pire cas, en fonction du nombre \(n\) de départs ? Quelle propriété de la liste permettrait de faire mieux, et avec quel algorithme ?</div>

  <p class="exo-part">Partie D — Fonctions en argument, effets de bord</p>
  <div class="q"><strong>D1.</strong> Écrire <span class="code-inline">troncons_tels_que(ligne: list, critere) -&gt; list</span>, liste des indices \(k\) des tronçons dont la durée <span class="code-inline">d</span> vérifie <span class="code-inline">critere(d)</span>. L'utiliser pour obtenir les tronçons d'au moins 15 minutes de <span class="code-inline">ligne_7</span>.</div>
  <div class="q"><strong>D2.</strong> Pour décaler tous les horaires d'un passage de <span class="code-inline">r</span> minutes (retard), un candidat propose :
  <pre class="codeblock"><span class="kw">def</span> retarder(ligne, r):
    <span class="kw">for</span> k <span class="kw">in</span> range(len(ligne)):
        arret, t = ligne[k]
        h, m = t
        t = horaire(minutes(h, m) + r)</pre>
  Quel est l'effet de <span class="code-inline">retarder(ligne_7, 5)</span> ? Expliquer. Écrire une fonction <span class="code-inline">retarder_en_place(ligne, r)</span> qui modifie la liste reçue, puis une fonction <span class="code-inline">retardee(ligne, r)</span> qui renvoie un nouveau passage sans modifier <span class="code-inline">ligne</span>.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Partie A.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> minutes(h, m):
    <span class="str">"""Horaire h:m (0 &lt;= h &lt; 24, 0 &lt;= m &lt; 60) converti en minutes depuis minuit."""</span>
    <span class="kw">return</span> 60 * h + m

<span class="kw">def</span> horaire(n):
    <span class="str">"""Entier n &gt;= 0 de minutes converti en couple (h, m), modulo 24 heures."""</span>
    n = n % (24 * 60)
    <span class="kw">return</span> n // 60, n % 60

<span class="kw">def</span> duree(dep, arr):
    <span class="str">"""Durée en minutes d'un trajet de l'horaire dep = (h, m) à l'horaire arr = (h, m),</span>
<span class="str">    l'arrivée ayant lieu moins de 24 h après le départ (éventuellement le lendemain)."""</span>
    hd, md = dep
    ha, ma = arr
    <span class="kw">return</span> (minutes(ha, ma) - minutes(hd, md) + 24 * 60) % (24 * 60)</pre>
    <p><strong>A2.</strong> On se ramène à une durée de moins d'un jour par <span class="code-inline">n % (24 * 60)</span>, puis quotient et reste par 60. 1 500 minutes font 25 h, soit 1 h le lendemain : <span class="code-inline">horaire(1500)</span> renvoie <span class="code-inline">(1, 0)</span>.</p>
    <p><strong>A3.</strong> La différence \(\delta\) des deux horaires en minutes est comprise entre \(-1439\) et \(1439\) ; si l'arrivée a lieu le lendemain, elle est négative et la vraie durée vaut \(\delta + 1440\). Ajouter 1 440 avant de prendre le reste modulo 1 440 traite les deux cas d'un coup, avec un opérande positif : pour \((23, 40) \to (0, 15)\), \(\delta = 15 - 1420 = -1405\) et \((-1405 + 1440) \bmod 1440 = 35\).</p>
    <p><strong>Partie B.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> temps_parcours(ligne, i, j):
    <span class="str">"""ligne : liste de couples (arrêt, horaire) dans l'ordre de passage ; i &lt;= j.</span>
<span class="str">    Durée en minutes entre le passage à l'arrêt i et le passage à l'arrêt j."""</span>
    <span class="kw">return</span> duree(ligne[i][1], ligne[j][1])

<span class="kw">def</span> indice_arret(ligne, nom):
    <span class="str">"""Indice de l'arrêt nom dans la ligne, -1 s'il n'est pas desservi."""</span>
    <span class="kw">for</span> k <span class="kw">in</span> range(len(ligne)):
        <span class="kw">if</span> ligne[k][0] == nom:
            <span class="kw">return</span> k
    <span class="kw">return</span> -1

<span class="kw">def</span> plus_long_troncon(ligne):
    <span class="str">"""Indice k du premier tronçon (arrêt k -&gt; arrêt k + 1) de durée maximale.</span>
<span class="str">    Précondition : la ligne a au moins 2 arrêts."""</span>
    kmax, dmax = 0, temps_parcours(ligne, 0, 1)
    <span class="kw">for</span> k <span class="kw">in</span> range(1, len(ligne) - 1):
        d = temps_parcours(ligne, k, k + 1)   <span class="cmt"># un seul calcul par tronçon</span>
        <span class="kw">if</span> d &gt; dmax:
            kmax, dmax = k, d
    <span class="kw">return</span> kmax</pre>
    <p><strong>B1.</strong> <span class="code-inline">ligne[i][1]</span> est l'horaire du passage à l'arrêt d'indice <span class="code-inline">i</span>. De 7 h 50 à 8 h 40 : <span class="code-inline">temps_parcours(ligne_7, 0, 4)</span> vaut 50. Passer par <span class="code-inline">duree</span> traite aussi un passage qui franchit minuit.</p>
    <p><strong>B2.</strong> Recherche séquentielle avec sortie anticipée ; le <span class="code-inline">return -1</span> est après la boucle. Coût \(O(n)\).</p>
    <p><strong>B3.</strong> Les tronçons de <span class="code-inline">ligne_7</span> durent 12, 7, 22 et 9 minutes : la fonction renvoie 2 (Hôpital → Zone Nord). La durée maximale courante est rangée dans <span class="code-inline">dmax</span> : chaque tronçon n'est calculé qu'une fois, soit \(n - 1\) appels de <span class="code-inline">temps_parcours</span>, donc de <span class="code-inline">duree</span>, et un coût \(O(n)\). Recalculer la durée du meilleur tronçon à chaque comparaison doublerait presque ce nombre.</p>
    <p><strong>Partie C.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> premier_depart(departs, t):
    <span class="str">"""departs : liste croissante d'horaires (h, m) d'une même journée ; t = (h, m).</span>
<span class="str">    Indice du premier départ à l'horaire t ou après, -1 s'il n'y en a plus."""</span>
    ht, mt = t
    <span class="kw">for</span> k <span class="kw">in</span> range(len(departs)):
        hd, md = departs[k]
        <span class="kw">if</span> minutes(hd, md) &gt;= minutes(ht, mt):
            <span class="kw">return</span> k
    <span class="kw">return</span> -1

<span class="kw">def</span> attente(departs, t):
    <span class="str">"""Attente en minutes d'un voyageur arrivé à l'horaire t ; -1 s'il n'y a plus de départ."""</span>
    k = premier_depart(departs, t)
    <span class="kw">if</span> k == -1:
        <span class="kw">return</span> -1
    <span class="kw">return</span> duree(t, departs[k])</pre>
    <p><strong>C2.</strong> Arrivé à 7 h 31, le voyageur prend le départ de 7 h 50 : 19 minutes. À 8 h 21, il n'y a plus de départ : -1.</p>
    <p><strong>C3.</strong> Au pire (aucun départ ne convient), <span class="code-inline">premier_depart</span> examine les \(n\) départs : coût \(O(n)\). La liste étant triée, une recherche dichotomique trouverait le premier départ convenable en \(O(\log n)\) (chapitre <em>Recherche séquentielle, dictionnaires et dichotomie</em>).</p>
    <p><strong>Partie D.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> troncons_tels_que(ligne, critere):
    <span class="str">"""Liste des indices k des tronçons dont la durée (en minutes) vérifie critere."""</span>
    res = []
    <span class="kw">for</span> k <span class="kw">in</span> range(len(ligne) - 1):
        <span class="kw">if</span> critere(temps_parcours(ligne, k, k + 1)):
            res.append(k)
    <span class="kw">return</span> res

<span class="kw">def</span> long(d):
    <span class="kw">return</span> d &gt;= 15</pre>
    <p><strong>D1.</strong> <span class="code-inline">troncons_tels_que(ligne_7, long)</span> renvoie <span class="code-inline">[2]</span> : seul le tronçon Hôpital → Zone Nord (22 minutes) dure au moins 15 minutes. On passe la fonction <span class="code-inline">long</span>, sans parenthèses.</p>
    <p><strong>D2.</strong> <span class="code-inline">retarder(ligne_7, 5)</span> ne change rien : <span class="code-inline">t = horaire(…)</span> réaffecte la variable locale <span class="code-inline">t</span>, sans toucher à la liste ; d'ailleurs les couples sont des tuples, non modifiables. Il faut remplacer la case <span class="code-inline">ligne[k]</span> elle-même par un nouveau couple (effet de bord voulu), ou construire une nouvelle liste :</p>
    <pre class="codeblock"><span class="kw">def</span> retarder_en_place(ligne, r):
    <span class="str">"""Décale de r minutes (r &gt;= 0) tous les horaires de ligne : modifie ligne."""</span>
    <span class="kw">for</span> k <span class="kw">in</span> range(len(ligne)):
        arret, t = ligne[k]
        h, m = t
        ligne[k] = (arret, horaire(minutes(h, m) + r))

<span class="kw">def</span> retardee(ligne, r):
    <span class="str">"""Nouvelle ligne : horaires de ligne décalés de r minutes ; ligne intacte."""</span>
    res = []
    <span class="kw">for</span> passage <span class="kw">in</span> ligne:
        arret, t = passage
        h, m = t
        res.append((arret, horaire(minutes(h, m) + r)))
    <span class="kw">return</span> res</pre>
    <p>Les deux versions coûtent \(O(n)\) ; la première ne renvoie rien (on l'appelle seule sur une ligne), la seconde s'affecte : <span class="code-inline">ligne_8 = retardee(ligne_7, 25)</span>.</p>
  </div>
