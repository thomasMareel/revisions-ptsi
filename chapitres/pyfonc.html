<div class="course-section">
  <div class="sec-num">AU PROGRAMME · INFORMATIQUE</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Les fonctions sont l'outil de base de tout programme Python : on les définit et on les appelle dès le premier semestre, et tous les autres chapitres s'en servent. Ce chapitre suit l'annexe « Langage Python » du programme d'informatique commune, qui fixe limitativement ce qui est exigible : définition par <span class="code-inline">def</span>, <span class="code-inline">return</span>, appel par valeur, portée lexicale, typage dynamique. La façon de spécifier une fonction, de la tester et de prouver qu'elle est correcte est développée dans le chapitre <em>Spécification, correction et complexité</em> ; on s'y réfère sans le refaire.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Définition d'une fonction</strong> <span class="code-inline">def f(p1, …, pn):</span>, <span class="code-inline">return</span> (annexe Python, structures de contrôle) : §1, §2.</li>
        <li><strong><span class="code-inline">return</span> dans un corps de boucle</strong> (annexe) ; renvoyer plusieurs valeurs par <strong>dépaquetage de tuples</strong> (annexe) : §2.</li>
        <li><strong>Appel de fonction par valeur</strong> : l'exécution de <span class="code-inline">f(x)</span> évalue d'abord <span class="code-inline">x</span>, puis exécute <span class="code-inline">f</span> avec la valeur calculée (annexe, traits généraux) : §3.</li>
        <li><strong>Typage dynamique</strong> : l'interpréteur détermine les types à la volée, pendant l'exécution (annexe) ; signature des fonctions toujours précisée (2ᵉ semestre, partie 2.1) : §3.</li>
        <li><strong>Portée lexicale</strong> : dans une fonction, un nom est cherché parmi les variables de la fonction, puis à défaut dans l'espace global du module (annexe) : §4.</li>
        <li><strong>Pile d'appels</strong>, utile pour comprendre les appels imbriqués, les messages d'erreur et le dépassement de la taille de la pile vu avec les fonctions récursives (1ᵉʳ semestre) : §5.</li>
        <li><strong>Effet de bord</strong> (2ᵉ semestre, partie 2.1) : ce qu'une fonction peut modifier chez l'appelant (§6) ; le détail et la spécification des effets de bord sont dans <em>Spécification, correction et complexité</em>, §1 et §2.</li>
        <li><strong>Discipline de programmation</strong> (1ᵉʳ semestre) : découper un problème en fonctions spécifiées et testées, évaluer le coût d'une fonction qui en appelle d'autres : §7, §8.</li>
      </ul>
      <p>Hors de l'annexe (donc non exigible, et documenté par un sujet qui s'en sert) : valeurs par défaut des paramètres, arguments nommés, mot-clé <span class="code-inline">global</span>, fonctions anonymes <span class="code-inline">lambda</span>, exceptions (dernière section). Les fonctions récursives ont leur propre chapitre, <em>Récursivité</em>.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · DÉFINIR ET APPELER UNE FONCTION</div>
  <h2>Nommer un calcul pour le réutiliser</h2>
  <div class="intro">Une fonction regroupe sous un nom une suite d'instructions qui calcule un résultat à partir de données. On l'écrit une fois et on l'appelle autant de fois qu'on veut, avec des données différentes : le programme est plus court, plus lisible, et chaque morceau se vérifie séparément.</div>
  <div class="def-box">Une <strong>définition de fonction</strong> commence par l'en-tête <span class="code-inline">def nom(p1, …, pn):</span>, suivi d'un <strong>corps</strong> indenté. Les noms <span class="code-inline">p1</span>, …, <span class="code-inline">pn</span> sont les <strong>paramètres</strong> (il peut n'y en avoir aucun). L'instruction <span class="code-inline">return e</span> termine la fonction et fournit la valeur de l'expression <span class="code-inline">e</span> comme <strong>résultat</strong>.<br>
  Un <strong>appel</strong> <span class="code-inline">nom(e1, …, en)</span> exécute le corps, chaque paramètre recevant la valeur de l'<strong>argument</strong> correspondant. Un appel est une <strong>expression</strong> : sa valeur est le résultat renvoyé, qu'on peut affecter, afficher ou utiliser dans un calcul.</div>
  <pre class="codeblock"><span class="kw">def</span> aire_triangle(base, hauteur):
    <span class="str">"""Aire d'un triangle de base et de hauteur données."""</span>
    a = base * hauteur / 2
    <span class="kw">return</span> a

s = aire_triangle(6, 5)      <span class="cmt"># appel : s vaut 15.0</span>
print(2 * s)                 <span class="cmt"># affiche 30.0</span></pre>
  <p>La ligne <span class="code-inline">def</span> ne calcule rien : elle crée la fonction et lui donne un nom. Le corps n'est exécuté qu'au moment d'un appel, et à chaque appel. Le corps s'arrête là où l'indentation s'arrête. Une fonction peut n'avoir aucun paramètre ; on écrit quand même les parenthèses, à la définition comme à l'appel :</p>
  <pre class="codeblock"><span class="kw">def</span> saluer():
    print(<span class="str">"Bonjour"</span>)

saluer()                     <span class="cmt"># affiche Bonjour</span>
saluer()                     <span class="cmt"># le corps est exécuté à chaque appel</span></pre>

  <div class="method-box"><strong>Exemple — suivre l'exécution d'un programme</strong>
    <p>Qu'affiche ce programme ?</p>
    <pre class="codeblock"><span class="kw">def</span> carre(x):
    y = x * x
    <span class="kw">return</span> y

a = 3
b = carre(a + 1)
c = carre(b) - carre(a)
print(b, c)</pre>
    <ol>
      <li>Les lignes 1 à 3 définissent <span class="code-inline">carre</span> : aucun calcul n'est fait.</li>
      <li><span class="code-inline">a = 3</span>.</li>
      <li><span class="code-inline">carre(a + 1)</span> : l'argument vaut 4. Pendant l'appel, <span class="code-inline">x = 4</span>, <span class="code-inline">y = 16</span>, et <span class="code-inline">return y</span> renvoie 16 : <span class="code-inline">b = 16</span>.</li>
      <li><span class="code-inline">carre(b) - carre(a)</span> fait deux appels indépendants : <span class="code-inline">carre(16)</span> renvoie 256 (avec <span class="code-inline">x = 16</span>), puis <span class="code-inline">carre(3)</span> renvoie 9 (avec <span class="code-inline">x = 3</span>). Donc <span class="code-inline">c = 247</span>.</li>
      <li>Le programme affiche <span class="code-inline">16 247</span>. Les variables <span class="code-inline">x</span> et <span class="code-inline">y</span> n'existent que pendant chaque appel (§4) : après l'exécution, seules <span class="code-inline">carre</span>, <span class="code-inline">a</span>, <span class="code-inline">b</span> et <span class="code-inline">c</span> sont définies.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : oublier les parenthèses. Le nom <span class="code-inline">carre</span> seul désigne la fonction elle-même (une valeur, voir §7) ; c'est <span class="code-inline">carre(3)</span> qui l'appelle. Dans une console :
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">def</span> carre(x):
...     <span class="kw">return</span> x * x
...
&gt;&gt;&gt; carre
&lt;function carre at 0x...&gt;
&gt;&gt;&gt; carre(3)
9</pre>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appeler une fonction avant que sa définition ait été exécutée. Python lit et exécute le fichier de haut en bas : au moment de l'appel, le nom doit déjà exister.
  <pre class="codeblock">&gt;&gt;&gt; cube(2)
Traceback (most recent call last):
  ...
NameError: name <span class="str">'cube'</span> <span class="kw">is</span> <span class="kw">not</span> defined</pre>
  On place donc les définitions en tête du fichier, et les instructions qui les utilisent ensuite. En revanche, le <em>corps</em> d'une fonction peut mentionner une fonction définie plus bas : il ne sera exécuté qu'à l'appel (§5).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RENVOYER UN RÉSULTAT</div>
  <h2><span class="code-inline">return</span>, la sortie de la fonction</h2>
  <div class="intro"><span class="code-inline">return</span> fait deux choses à la fois : il fournit le résultat et il arrête l'exécution de la fonction. Bien placé, il permet de quitter une boucle dès que la réponse est connue ; mal placé, il fait sortir trop tôt.</div>
  <div class="prop-box"><strong>Effet de <span class="code-inline">return</span>.</strong> Quand <span class="code-inline">return e</span> s'exécute, l'expression <span class="code-inline">e</span> est évaluée, l'exécution de la fonction s'arrête aussitôt (même au milieu d'une boucle) et l'appel prend la valeur de <span class="code-inline">e</span>. Les instructions suivantes ne sont pas exécutées pour cet appel. Si l'exécution atteint la fin du corps sans rencontrer de <span class="code-inline">return</span>, ou rencontre <span class="code-inline">return</span> seul, la fonction renvoie la valeur spéciale <span class="code-inline">None</span> (« rien »).</div>
  <pre class="codeblock"><span class="kw">def</span> est_premier(n):
    <span class="str">"""n entier &gt;= 0 : True si n est premier, False sinon."""</span>
    <span class="kw">if</span> n &lt; 2:
        <span class="kw">return</span> <span class="kw">False</span>
    d = 2
    <span class="kw">while</span> d * d &lt;= n:
        <span class="kw">if</span> n % d == 0:
            <span class="kw">return</span> <span class="kw">False</span>     <span class="cmt"># un diviseur : la réponse est connue, on sort</span>
        d = d + 1
    <span class="kw">return</span> <span class="kw">True</span>              <span class="cmt"># aucun diviseur d tel que d * d &lt;= n</span></pre>
  <div class="method-box"><strong>Exemple — une sortie anticipée</strong>
    <p>Pour <span class="code-inline">est_premier(91)</span>, la boucle essaie les diviseurs <span class="code-inline">d</span> = 2, 3, … tant que <span class="code-inline">d * d &lt;= 91</span> :</p>
    <div><table>
<tr><th>tour</th><th><span class="code-inline">d</span></th><th><span class="code-inline">d * d</span></th><th><span class="code-inline">91 % d</span></th><th>décision</th></tr>
<tr><td>1</td><td>2</td><td>4</td><td>1</td><td>on continue</td></tr>
<tr><td>2</td><td>3</td><td>9</td><td>1</td><td>on continue</td></tr>
<tr><td>3</td><td>4</td><td>16</td><td>3</td><td>on continue</td></tr>
<tr><td>4</td><td>5</td><td>25</td><td>1</td><td>on continue</td></tr>
<tr><td>5</td><td>6</td><td>36</td><td>1</td><td>on continue</td></tr>
<tr><td>6</td><td>7</td><td>49</td><td>0</td><td>diviseur : <span class="code-inline">return False</span></td></tr>
</table></div>
    <ol>
      <li>Au 6ᵉ tour, 7 divise 91 (\(91 = 7 \times 13\)) : <span class="code-inline">return False</span> est exécuté au milieu de la boucle, qui s'arrête là ; la fonction renvoie <span class="code-inline">False</span>.</li>
      <li>Pour <span class="code-inline">est_premier(97)</span>, aucun des <span class="code-inline">d</span> de 2 à 9 ne divise 97, et \(10 \times 10 \gt 97\) : la boucle se termine normalement après 8 tours et c'est le <span class="code-inline">return True</span> final qui s'exécute.</li>
      <li>Pourquoi s'arrêter à \(d^2 \le n\) ? Si \(n = d \times e\) avec \(2 \le d \le e\), alors \(d^2 \le d\,e = n\) : un entier non premier a toujours un diviseur \(d\) tel que \(d^2 \le n\). La boucle fait donc au plus \(\sqrt n\) tours, chacun de coût constant : coût \(O(\sqrt n)\) dans le pire cas (quand \(n\) est premier).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : un <span class="code-inline">return</span> dans les deux branches d'un test placé dans la boucle. La fonction sort alors au premier tour, quoi qu'il arrive :
  <pre class="codeblock"><span class="kw">def</span> contient(t, x):
    <span class="kw">for</span> e <span class="kw">in</span> t:
        <span class="kw">if</span> e == x:
            <span class="kw">return</span> <span class="kw">True</span>
        <span class="kw">else</span>:
            <span class="kw">return</span> <span class="kw">False</span>     <span class="cmt"># ERREUR : on sort dès le premier tour</span></pre>
  Ici <span class="code-inline">contient([4, 7], 7)</span> renvoie <span class="code-inline">False</span> : on compare 4 à 7, on sort. On ne peut conclure « absent » qu'après avoir tout parcouru : le <span class="code-inline">return False</span> se place <strong>après</strong> la boucle, au niveau d'indentation du <span class="code-inline">for</span>.
  <pre class="codeblock"><span class="kw">def</span> contient(t, x):
    <span class="kw">for</span> e <span class="kw">in</span> t:
        <span class="kw">if</span> e == x:
            <span class="kw">return</span> <span class="kw">True</span>      <span class="cmt"># trouvé : inutile de continuer</span>
    <span class="kw">return</span> <span class="kw">False</span>             <span class="cmt"># après la boucle : x n'est nulle part</span></pre>
  </div>

  <h3>Afficher n'est pas renvoyer</h3>
  <p><span class="code-inline">print</span> écrit à l'écran : c'est un effet visible, pas un résultat. Une fonction qui affiche sans renvoyer rend <span class="code-inline">None</span> :</p>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">def</span> affiche_carre(x):
...     print(x * x)
...
&gt;&gt;&gt; r = affiche_carre(4)
16
&gt;&gt;&gt; print(r)
<span class="kw">None</span></pre>
  <p>L'appel <span class="code-inline">2 * affiche_carre(4)</span> affiche 16, puis provoque une erreur <span class="code-inline">TypeError</span> : on ne multiplie pas <span class="code-inline">None</span>. Règle de conduite : une fonction qui calcule <strong>renvoie</strong> son résultat ; c'est l'appelant qui décide de l'afficher, par <span class="code-inline">print(carre(4))</span>.</p>

  <h3>Renvoyer plusieurs valeurs</h3>
  <pre class="codeblock"><span class="kw">def</span> division(a, b):
    <span class="str">"""a, b entiers, a &gt;= 0, b &gt; 0 : quotient et reste de a par b."""</span>
    <span class="kw">return</span> a // b, a % b     <span class="cmt"># un couple (tuple)</span>

q, r = division(47, 6)       <span class="cmt"># dépaquetage : q = 7, r = 5</span></pre>
  <p><span class="code-inline">return a // b, a % b</span> renvoie un seul objet, le couple <span class="code-inline">(7, 5)</span> (un <em>tuple</em>, voir le chapitre <em>Types construits</em>) ; l'affectation <span class="code-inline">q, r = …</span> le <strong>dépaquète</strong> en deux variables. On vérifie que \(47 = 6 \times 7 + 5\) avec \(0 \le 5 \lt 6\).</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · L'APPEL PAR VALEUR</div>
  <h2>Ce qui se passe lors d'un appel</h2>
  <div class="intro">Que reçoit exactement une fonction quand on l'appelle ? Python suit une règle simple, que le programme impose de connaître : l'appel par valeur. Elle dit dans quel ordre les calculs ont lieu, et ce qu'un appel peut ou ne peut pas modifier.</div>
  <div class="def-box"><strong>Appel par valeur.</strong> L'exécution de <span class="code-inline">f(e1, …, en)</span> se déroule ainsi :
    <ol>
      <li>les arguments <span class="code-inline">e1</span>, …, <span class="code-inline">en</span> sont <strong>évalués</strong>, de gauche à droite ;</li>
      <li>un nouvel espace de variables locales est créé pour cet appel : chaque paramètre reçoit la <strong>valeur</strong> de l'argument correspondant, comme par une affectation <span class="code-inline">p1 = valeur1</span> ;</li>
      <li>le corps est exécuté, jusqu'à un <span class="code-inline">return</span> ou jusqu'à sa fin ;</li>
      <li>l'espace local disparaît, et l'appel est remplacé par la valeur renvoyée.</li>
    </ol>
  </div>
  <pre class="codeblock"><span class="kw">def</span> incremente(n):
    n = n + 1                <span class="cmt"># modifie le paramètre n, variable locale</span>
    <span class="kw">return</span> n

x = 5
y = incremente(x)
print(x, y)                  <span class="cmt"># affiche 5 6</span></pre>
  <p>La fonction a reçu la <em>valeur</em> 5, pas la variable <span class="code-inline">x</span> : <span class="code-inline">n = n + 1</span> change la variable locale <span class="code-inline">n</span>, et <span class="code-inline">x</span> vaut toujours 5. Pour récupérer le nouveau nombre, on utilise la valeur renvoyée : <span class="code-inline">y = incremente(x)</span>, ou <span class="code-inline">x = incremente(x)</span> si l'on veut vraiment changer <span class="code-inline">x</span>.</p>

  <div class="method-box"><strong>Exemple — l'ordre des calculs</strong>
    <p>Les fonctions <span class="code-inline">g</span> et <span class="code-inline">h</span> affichent ce qu'elles reçoivent. Qu'affiche ce programme ?</p>
    <pre class="codeblock"><span class="kw">def</span> g(u):
    print(<span class="str">"g reçoit"</span>, u)
    <span class="kw">return</span> u + 1

<span class="kw">def</span> h(a, b):
    print(<span class="str">"h reçoit"</span>, a, b)
    <span class="kw">return</span> a * b

x = 2
print(h(g(x), g(10 * x)))</pre>
    <ol>
      <li>Pour appeler <span class="code-inline">h</span>, il faut d'abord la valeur de ses deux arguments, de gauche à droite. Premier argument : <span class="code-inline">g(x)</span> ; son propre argument vaut 2, <span class="code-inline">g</span> affiche <span class="code-inline">g reçoit 2</span> et renvoie 3.</li>
      <li>Second argument : <span class="code-inline">10 * x</span> vaut 20 ; <span class="code-inline">g</span> affiche <span class="code-inline">g reçoit 20</span> et renvoie 21.</li>
      <li><span class="code-inline">h</span> est appelée avec les valeurs 3 et 21 : elle affiche <span class="code-inline">h reçoit 3 21</span> et renvoie 63, que <span class="code-inline">print</span> affiche.</li>
    </ol>
    <p>Affichage :</p>
<pre class="codeblock">g reçoit 2
g reçoit 20
h reçoit 3 21
63</pre>
  </div>

  <h3>Typage dynamique</h3>
  <p>Python ne vérifie pas le type des arguments avant l'exécution : l'interpréteur découvre les types au moment où chaque opération s'exécute. Une même fonction accepte donc tous les arguments pour lesquels son corps a un sens, et une erreur de type n'apparaît qu'à l'exécution de l'opération impossible :</p>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">def</span> double(x):
...     <span class="kw">return</span> x + x
...
&gt;&gt;&gt; double(4), double(2.5), double(<span class="str">"ab"</span>), double([1, 2])
(8, 5.0, <span class="str">'abab'</span>, [1, 2, 1, 2])
&gt;&gt;&gt; double(<span class="kw">None</span>)
Traceback (most recent call last):
  ...
TypeError: unsupported operand type(s) <span class="kw">for</span> +: <span class="str">'NoneType'</span> <span class="kw">and</span> <span class="str">'NoneType'</span></pre>
  <p>C'est souple, mais aucune vérification n'est faite à l'avance : seuls des tests (et la lecture attentive de la spécification) protègent d'un appel avec des données inadaptées.</p>

  <h3>Écrire la signature</h3>
  <p>Les sujets précisent toujours la <strong>signature</strong> d'une fonction : le type de chaque paramètre et celui du résultat. On peut l'écrire dans l'en-tête sous forme d'annotations, que Python ne vérifie pas (elles documentent), et préciser dans la chaîne de documentation les conditions que doivent remplir les arguments :</p>
  <pre class="codeblock"><span class="kw">def</span> vitesse_moyenne(d: float, t: float) -&gt; float:
    <span class="str">"""Vitesse moyenne (m/s) sur une distance d (m) parcourue en t secondes.</span>
<span class="str">    Précondition : t &gt; 0."""</span>
    <span class="kw">assert</span> t &gt; 0
    <span class="kw">return</span> d / t</pre>
  <p>Spécification, préconditions, postconditions et assertions sont étudiées dans le chapitre <em>Spécification, correction et complexité</em>, §2.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une fonction peut changer un nombre de l'appelant en modifiant son paramètre, comme <span class="code-inline">incremente</span> ci-dessus. Le paramètre est une variable locale qui a reçu une copie de la valeur ; le seul moyen de transmettre un nouveau nombre est de le renvoyer et de l'affecter.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PORTÉE DES VARIABLES</div>
  <h2>Variables locales, variables globales</h2>
  <div class="intro">Une fonction manipule ses paramètres, ses propres variables, et parfois des variables définies hors d'elle. La <strong>portée</strong> d'un nom, c'est la partie du programme où il est visible. En Python, elle se lit sur le texte du programme : on parle de portée lexicale.</div>
  <div class="def-box">Les <strong>variables locales</strong> d'une fonction sont ses paramètres et les variables <strong>affectées</strong> quelque part dans son corps. Elles n'existent que pendant un appel, et chaque appel a les siennes. Les <strong>variables globales</strong> sont celles affectées au niveau du module, hors de toute fonction.</div>
  <div class="prop-box"><strong>Portée lexicale.</strong> Quand une expression utilise un nom à l'intérieur d'une fonction, Python cherche d'abord parmi les variables locales de l'appel en cours, puis, à défaut, dans l'espace global du module. Si le nom n'existe nulle part, l'exécution s'arrête sur une erreur <span class="code-inline">NameError</span>.</div>
  <pre class="codeblock">G = 9.81                     <span class="cmt"># variable globale (constante physique)</span>

<span class="kw">def</span> poids(m):
    p = m * G                <span class="cmt"># m et p : locales ; G : globale, lue</span>
    <span class="kw">return</span> p

print(poids(2.0))            <span class="cmt"># affiche 19.62</span></pre>
  <p><span class="code-inline">m</span> et <span class="code-inline">p</span> sont locales ; <span class="code-inline">G</span> est globale, la fonction ne fait que la lire. Une constante globale lue par plusieurs fonctions est un usage raisonnable (une constante physique, une taille fixée une fois pour toutes) ; on l'écrit souvent en majuscules. La valeur lue est celle de la globale <strong>au moment de l'appel</strong>, pas au moment de la définition :</p>
  <pre class="codeblock">frais = 5                    <span class="cmt"># frais de port : variable globale</span>

<span class="kw">def</span> prix_total(prix):
    <span class="kw">return</span> prix + frais      <span class="cmt"># frais est lue au moment de l'appel</span>

a = prix_total(40)           <span class="cmt"># 45</span>
frais = 0                    <span class="cmt"># promotion : port gratuit</span>
b = prix_total(40)           <span class="cmt"># 40</span></pre>

  <h3>Une affectation crée une variable locale</h3>
  <pre class="codeblock">x = 10

<span class="kw">def</span> f():
    x = 3                    <span class="cmt"># nouvelle variable LOCALE x</span>
    <span class="kw">return</span> 2 * x

print(f(), x)                <span class="cmt"># affiche 6 10</span></pre>
  <p><span class="code-inline">x = 3</span>, dans <span class="code-inline">f</span>, crée une variable locale <span class="code-inline">x</span>, qui <strong>masque</strong> la globale pendant l'appel ; la globale n'est pas touchée.</p>
  <div class="prop-box"><strong>Locale dans tout le corps.</strong> Un nom affecté <em>n'importe où</em> dans le corps d'une fonction est local dans <em>tout</em> le corps : Python le décide en lisant la définition, avant toute exécution. Lire ce nom avant de l'avoir affecté provoque une erreur <span class="code-inline">UnboundLocalError</span>, même si une globale porte ce nom.</div>
  <pre class="codeblock">&gt;&gt;&gt; compteur = 0
&gt;&gt;&gt; <span class="kw">def</span> compter():
...     compteur = compteur + 1
...
&gt;&gt;&gt; compter()
Traceback (most recent call last):
  ...
UnboundLocalError: cannot access local variable <span class="str">'compteur'</span> where it <span class="kw">is</span> <span class="kw">not</span> associated <span class="kw">with</span> a value</pre>
  <p>Ici <span class="code-inline">compteur</span> est affecté dans <span class="code-inline">compter</span>, donc local ; l'expression <span class="code-inline">compteur + 1</span> lit cette locale, qui n'a pas encore de valeur. (Le message exact varie selon la version de Python.) La solution conforme au programme : faire entrer la valeur par un paramètre et la faire sortir par <span class="code-inline">return</span>.</p>
  <pre class="codeblock"><span class="kw">def</span> compter(c):
    <span class="kw">return</span> c + 1

compteur = 0
compteur = compter(compteur)     <span class="cmt"># compteur vaut 1</span>
compteur = compter(compteur)     <span class="cmt"># compteur vaut 2</span></pre>

  <div class="method-box"><strong>Exemple — prédire un affichage</strong>
    <pre class="codeblock">a = 1
b = 2

<span class="kw">def</span> f(a):
    b = a + 10
    c = a + b
    <span class="kw">return</span> c

<span class="kw">def</span> g():
    <span class="kw">return</span> a + b

print(f(5), g())
a = 7
print(g())</pre>
    <ol>
      <li><span class="code-inline">f(5)</span> : le paramètre <span class="code-inline">a</span> vaut 5 ; <span class="code-inline">b</span> est affectée dans <span class="code-inline">f</span>, donc locale : <span class="code-inline">b = 15</span>, puis <span class="code-inline">c = 20</span>. L'appel renvoie 20. Les globales <span class="code-inline">a</span> et <span class="code-inline">b</span> sont masquées, pas modifiées.</li>
      <li><span class="code-inline">g()</span> n'a aucune variable locale : <span class="code-inline">a</span> et <span class="code-inline">b</span> sont lues dans l'espace global, elle renvoie \(1 + 2 = 3\). Première ligne affichée : <span class="code-inline">20 3</span>.</li>
      <li><span class="code-inline">a = 7</span> modifie la globale. Le nouvel appel <span class="code-inline">g()</span> lit cette valeur et renvoie 9 : seconde ligne <span class="code-inline">9</span>.</li>
      <li>Enfin, <span class="code-inline">c</span> n'existe que pendant les appels de <span class="code-inline">f</span> : un <span class="code-inline">print(c)</span> ajouté à la fin provoquerait <span class="code-inline">NameError</span>.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§5 · LA PILE D'APPELS</div>
  <h2>Des fonctions qui en appellent d'autres</h2>
  <div class="intro">Une fonction peut en appeler une autre, qui en appelle une troisième… Python garde la trace de tous les appels commencés et pas encore terminés : c'est la pile d'appels. Elle explique comment chaque appel retrouve ses variables, comment se lit un message d'erreur, et pourquoi la profondeur des appels est limitée.</div>
  <pre class="codeblock"><span class="kw">from</span> math <span class="kw">import</span> sqrt

<span class="kw">def</span> carre(x):
    <span class="kw">return</span> x * x

<span class="kw">def</span> longueur(u, v):
    <span class="str">"""Longueur du vecteur de coordonnées (u, v)."""</span>
    <span class="kw">return</span> sqrt(carre(u) + carre(v))

<span class="kw">def</span> distance(p, q):
    <span class="str">"""Distance entre les points p = (xp, yp) et q = (xq, yq)."""</span>
    xp, yp = p
    xq, yq = q
    <span class="kw">return</span> longueur(xq - xp, yq - yp)

d = distance((1, 2), (4, 6))     <span class="cmt"># 5.0</span></pre>
  <p>(La fonction <span class="code-inline">sqrt</span> du module <span class="code-inline">math</span> calcule une racine carrée ; l'importation de modules est présentée dans le chapitre <em>Modules, fichiers et statistiques</em>.)</p>
  <div class="def-box">La <strong>pile d'appels</strong> contient un <strong>cadre</strong> par appel en cours : les variables locales de cet appel et l'endroit où il devra reprendre. Un appel <strong>empile</strong> un nouveau cadre ; seul le cadre du sommet s'exécute ; quand il se termine, il est <strong>dépilé</strong> et l'appel du dessous reprend, avec la valeur renvoyée.</div>
  <div class="method-box"><strong>Exemple — l'état de la pile pendant un calcul</strong>
    <ol>
      <li><span class="code-inline">d = distance((1, 2), (4, 6))</span> : le module attend. Le cadre de <span class="code-inline">distance</span> reçoit <span class="code-inline">p</span> et <span class="code-inline">q</span>, puis crée <span class="code-inline">xp</span>, <span class="code-inline">yp</span>, <span class="code-inline">xq</span>, <span class="code-inline">yq</span> par dépaquetage.</li>
      <li><span class="code-inline">distance</span> appelle <span class="code-inline">longueur</span> avec les valeurs \(4 - 1 = 3\) et \(6 - 2 = 4\) : nouveau cadre, <span class="code-inline">u = 3</span>, <span class="code-inline">v = 4</span>.</li>
      <li><span class="code-inline">longueur</span> évalue <span class="code-inline">carre(u) + carre(v)</span> : <span class="code-inline">carre(3)</span> est empilé, renvoie 9, est dépilé ; puis <span class="code-inline">carre(4)</span> est empilé (figure) et renvoie 16.</li>
      <li><span class="code-inline">sqrt(25)</span> renvoie 5.0 ; <span class="code-inline">longueur</span>, puis <span class="code-inline">distance</span>, se terminent à leur tour : <span class="code-inline">d</span> vaut 5.0. La pile n'a jamais compté plus de quatre cadres (sans compter celui de <span class="code-inline">sqrt</span>).</li>
    </ol>
  </div>

</figure>
  <p>Deux appels de la même fonction, comme <span class="code-inline">carre(3)</span> et <span class="code-inline">carre(4)</span>, ont chacun leur cadre : leurs variables <span class="code-inline">x</span> ne se mélangent pas. C'est ce qui rend possibles les fonctions <strong>récursives</strong>, qui s'appellent elles-mêmes : chaque appel empile un cadre, et comme la pile a une taille limitée, une récursion trop profonde arrête le programme (chapitre <em>Récursivité</em>).</p>

  <h3>Lire un message d'erreur</h3>
  <p>Quand une erreur arrête le programme, Python affiche l'état de la pile à cet instant. Le fichier <span class="code-inline">notes.py</span> suivant :</p>
  <pre class="codeblock"><span class="kw">def</span> moyenne(t):
    <span class="kw">return</span> somme(t) / len(t)

<span class="kw">def</span> somme(t):
    s = 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        s = s + x
    <span class="kw">return</span> s

notes = []
print(moyenne(notes))</pre>
  <p>s'arrête sur ce message (les repères <span class="code-inline">^^^</span> que les versions récentes ajoutent sous l'expression fautive sont omis) :</p>
  <pre class="codeblock">Traceback (most recent call last):
  File "notes.py", line 11, in &lt;module&gt;
    print(moyenne(notes))
  File "notes.py", line 2, in moyenne
    return somme(t) / len(t)
ZeroDivisionError: division by zero</pre>
  <ol>
    <li>La dernière ligne donne la nature de l'erreur : une division par zéro.</li>
    <li>Juste au-dessus, le cadre du sommet : l'erreur s'est produite ligne 2, dans <span class="code-inline">moyenne</span>.</li>
    <li>Plus haut, l'appel en attente : <span class="code-inline">moyenne</span> a été appelée ligne 11, depuis le module (<span class="code-inline">&lt;module&gt;</span>). « Most recent call last » : l'appel le plus récent est en bas.</li>
  </ol>
  <p>La cause est une liste vide, qui ne respecte pas la précondition implicite de <span class="code-inline">moyenne</span> ; une assertion <span class="code-inline">assert len(t) &gt; 0</span> en tête de la fonction l'aurait signalé plus clairement. Remarquez aussi que <span class="code-inline">moyenne</span> appelle <span class="code-inline">somme</span>, définie plus bas : c'est permis, car le corps de <span class="code-inline">moyenne</span> ne s'exécute qu'à l'appel de la ligne 11, quand <span class="code-inline">somme</span> existe déjà. Enfin, le cadre de <span class="code-inline">somme</span> n'apparaît pas dans la trace : <span class="code-inline">somme(t)</span> a bien été calculée (elle vaut 0) et son cadre a été dépilé ; c'est ensuite la division par <span class="code-inline">len(t)</span>, nulle, qui a échoué dans <span class="code-inline">moyenne</span>.</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LISTES EN ARGUMENT, EFFETS DE BORD</div>
  <h2>Ce qu'une fonction peut modifier chez l'appelant</h2>
  <div class="intro">L'appel par valeur protège les entiers, flottants, chaînes et tuples de l'appelant. Une liste (ou un dictionnaire), elle, peut être modifiée par la fonction qui la reçoit : c'est un <strong>effet de bord</strong>, voulu ou non. Le chapitre <em>Spécification, correction et complexité</em> (§1 et §2) traite en détail les effets de bord et la façon de les annoncer ; on en retient ici le mécanisme.</div>
  <p>La valeur d'une variable de type liste est la liste elle-même, un objet unique en mémoire. Quand le paramètre <span class="code-inline">t</span> reçoit cette valeur, <span class="code-inline">t</span> et la variable de l'appelant désignent le <strong>même objet</strong> :</p>
  <pre class="codeblock"><span class="kw">def</span> echanger(t, i, j):
    <span class="str">"""Échange t[i] et t[j] : modifie t (effet de bord), ne renvoie rien."""</span>
    t[i], t[j] = t[j], t[i]

<span class="kw">def</span> remise_a_zero(t):
    t = [0] * len(t)         <span class="cmt"># ne change que le nom local t</span>

a = [5, 8, 1]
echanger(a, 0, 2)            <span class="cmt"># a vaut [1, 8, 5]</span>
remise_a_zero(a)             <span class="cmt"># a vaut toujours [1, 8, 5]</span></pre>
  <figure class="schema" style="max-width:380px">
<svg viewBox="0 0 380 214" role="img" aria-label="En haut, a et t désignent la même liste 1, 8, 5. En bas, après t = [0] * len(t), t désigne une nouvelle liste 0, 0, 0 et a désigne toujours la liste 1, 8, 5">
<text x="10" y="14" class="lab-muted">à l’entrée de remise_a_zero(a)</text>

<figcaption>Le paramètre <span class="code-inline">t</span> reçoit la valeur de <span class="code-inline">a</span> : la même liste. Modifier cette liste (<span class="code-inline">t[i] = …</span>, <span class="code-inline">t.append(…)</span>) se voit de l'extérieur ; réaffecter le nom <span class="code-inline">t</span> le fait désigner un autre objet, sans effet sur l'appelant.</figcaption>
</figure>
  <div class="prop-box"><strong>Modifier l'objet ou réaffecter le nom.</strong> Dans une fonction, <strong>modifier</strong> la liste reçue (<span class="code-inline">t[i] = …</span>, <span class="code-inline">t.append(…)</span>, <span class="code-inline">t.pop()</span>) se voit chez l'appelant. <strong>Réaffecter</strong> le paramètre (<span class="code-inline">t = …</span>) ne change que le nom local. Une fonction ne peut donc jamais modifier un entier, un flottant, une chaîne ou un tuple de l'appelant : ces objets sont immuables, on ne peut que fabriquer de nouvelles valeurs, et les renvoyer.</div>
  <pre class="codeblock"><span class="kw">def</span> ajoute_point(s):
    s = s + <span class="str">"."</span>              <span class="cmt"># nouvelle chaîne, donnée au nom local s</span>
    <span class="kw">return</span> s

mot = <span class="str">"fin"</span>
ajoute_point(mot)            <span class="cmt"># le résultat est perdu : mot vaut toujours "fin"</span>
mot = ajoute_point(mot)      <span class="cmt"># mot vaut "fin."</span></pre>

  <div class="method-box"><strong>Exemple — deux versions d'une même tâche</strong>
    <p>On veut des zéros à la place des valeurs d'une liste. Deux contrats sont possibles, et la spécification doit dire lequel est choisi :</p>
    <pre class="codeblock"><span class="kw">def</span> remettre_a_zero(t):
    <span class="str">"""Met à 0 toutes les cases de t (effet de bord), ne renvoie rien."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        t[i] = 0

<span class="kw">def</span> zeros_comme(t):
    <span class="str">"""Nouvelle liste de zéros de même longueur que t ; t n'est pas modifiée."""</span>
    <span class="kw">return</span> [0] * len(t)</pre>
    <ol>
      <li><span class="code-inline">remettre_a_zero(t)</span> modifie la liste reçue, case par case : effet de bord, rien n'est renvoyé (donc <span class="code-inline">None</span>). On l'appelle seule sur une ligne : <span class="code-inline">remettre_a_zero(a)</span>.</li>
      <li><span class="code-inline">zeros_comme(t)</span> ne touche pas à <span class="code-inline">t</span> et renvoie une nouvelle liste, qu'on affecte : <span class="code-inline">b = zeros_comme(a)</span>.</li>
      <li>Les deux coûtent \(O(n)\) en temps pour une liste de longueur \(n\) ; la première n'utilise qu'une place constante en plus, la seconde fabrique \(n\) cases nouvelles (complexité en espace, <em>Spécification, correction et complexité</em> §8).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : affecter le résultat d'une fonction qui modifie en place, <span class="code-inline">a = echanger(a, 0, 2)</span>. La liste est bien modifiée, mais <span class="code-inline">echanger</span> renvoie <span class="code-inline">None</span>, et c'est désormais ce que désigne <span class="code-inline">a</span>. Erreur symétrique : attendre une modification de <span class="code-inline">remise_a_zero(a)</span>, qui ne fait que réaffecter son paramètre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LES FONCTIONS SONT DES VALEURS</div>
  <h2>Passer une fonction en argument</h2>
  <div class="intro">Le nom d'une fonction désigne une valeur comme une autre : on peut la donner en argument à une autre fonction, qui l'appellera. Les sujets de concours s'en servent sans cesse : tabuler une fonction pour la tracer, chercher le zéro d'une fonction, calculer une intégrale (chapitre <em>Méthodes numériques</em>).</div>
  <pre class="codeblock"><span class="kw">def</span> tabuler(f, a, b, n):
    <span class="str">"""Liste des valeurs f(a + k*h) pour k = 0, …, n, où h = (b - a) / n (n &gt;= 1)."""</span>
    h = (b - a) / n
    <span class="kw">return</span> [f(a + k * h) <span class="kw">for</span> k <span class="kw">in</span> range(n + 1)]

<span class="kw">def</span> carre(x):
    <span class="kw">return</span> x * x

valeurs = tabuler(carre, 0, 1, 4)    <span class="cmt"># [0.0, 0.0625, 0.25, 0.5625, 1.0]</span></pre>
  <p><span class="code-inline">f</span> est un paramètre comme un autre ; <span class="code-inline">f(a + k * h)</span> appelle la fonction reçue. On passe <span class="code-inline">carre</span>, la fonction, et non <span class="code-inline">carre(…)</span>, un nombre. (La liste est construite par compréhension : chapitre <em>Types construits</em>.)</p>
  <pre class="codeblock"><span class="kw">def</span> compter_si(t, critere):
    <span class="str">"""Nombre d'éléments x de t pour lesquels critere(x) vaut True."""</span>
    n = 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> critere(x):
            n = n + 1
    <span class="kw">return</span> n

<span class="kw">def</span> est_pair(k):
    <span class="kw">return</span> k % 2 == 0

compter_si([3, 8, 10, 7, 4], est_pair)     <span class="cmt"># 3</span>
compter_si(range(50), est_premier)         <span class="cmt"># 15</span></pre>
  <div class="method-box"><strong>Exemple — dérouler <span class="code-inline">compter_si([3, 8, 10, 7, 4], est_pair)</span></strong>
    <ol>
      <li>Pendant l'appel, le paramètre <span class="code-inline">critere</span> désigne la fonction <span class="code-inline">est_pair</span>.</li>
      <li><span class="code-inline">critere(3)</span> vaut <span class="code-inline">False</span> ; <span class="code-inline">critere(8)</span> et <span class="code-inline">critere(10)</span> valent <span class="code-inline">True</span> (<span class="code-inline">n</span> passe à 1 puis 2) ; <span class="code-inline">critere(7)</span> vaut <span class="code-inline">False</span> ; <span class="code-inline">critere(4)</span> vaut <span class="code-inline">True</span> (<span class="code-inline">n = 3</span>).</li>
      <li>La fonction renvoie 3. Elle a fait 5 appels de <span class="code-inline">critere</span> : pour une liste de longueur \(n\) et un critère de coût \(O(c)\), le coût est \(O(n\,c)\). Avec <span class="code-inline">est_premier</span> sur <span class="code-inline">range(50)</span>, elle compte les 15 nombres premiers inférieurs à 50.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : passer le résultat d'un appel au lieu de la fonction. <span class="code-inline">est_pair(4)</span> vaut <span class="code-inline">True</span>, et <span class="code-inline">critere(x)</span> devient alors <span class="code-inline">True(x)</span> :
  <pre class="codeblock">&gt;&gt;&gt; compter_si([3, 8, 10], est_pair(4))
Traceback (most recent call last):
  ...
TypeError: <span class="str">'bool'</span> object <span class="kw">is</span> <span class="kw">not</span> callable</pre>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CONCEVOIR UN PROGRAMME AVEC DES FONCTIONS</div>
  <h2>Découper, spécifier, tester, évaluer le coût</h2>
  <div class="intro">Un problème un peu long se découpe en fonctions courtes, chacune avec une tâche précise, une spécification et ses tests. On les écrit des plus simples aux plus composées, en vérifiant chacune avant de s'en servir.</div>
  <div class="method-box"><strong>Exemple — le rang d'un jour dans l'année</strong>
    <p>On veut le rang d'une date dans son année : 1 pour le 1ᵉʳ janvier, 365 ou 366 pour le 31 décembre. Trois tâches se dégagent : savoir si une année est bissextile, connaître le nombre de jours d'un mois, cumuler les mois écoulés.</p>
    <pre class="codeblock"><span class="kw">def</span> bissextile(a):
    <span class="str">"""a entier &gt; 0 : True si l'année a est bissextile (calendrier grégorien)."""</span>
    <span class="kw">return</span> (a % 4 == 0 <span class="kw">and</span> a % 100 != 0) <span class="kw">or</span> a % 400 == 0

<span class="kw">def</span> jours_du_mois(m, a):
    <span class="str">"""Nombre de jours du mois m (de 1 à 12) de l'année a."""</span>
    <span class="kw">if</span> m == 2:
        <span class="kw">if</span> bissextile(a):
            <span class="kw">return</span> 29
        <span class="kw">return</span> 28
    <span class="kw">if</span> m == 4 <span class="kw">or</span> m == 6 <span class="kw">or</span> m == 9 <span class="kw">or</span> m == 11:
        <span class="kw">return</span> 30
    <span class="kw">return</span> 31

<span class="kw">def</span> rang_dans_annee(j, m, a):
    <span class="str">"""Rang de la date j/m/a dans son année (1 pour le 1er janvier).</span>
<span class="str">    Précondition : la date existe."""</span>
    r = j
    <span class="kw">for</span> k <span class="kw">in</span> range(1, m):    <span class="cmt"># on ajoute les mois entiers déjà écoulés</span>
        r = r + jours_du_mois(k, a)
    <span class="kw">return</span> r</pre>
    <ol>
      <li><span class="code-inline">bissextile</span> traduit la règle du calendrier grégorien (divisible par 4 mais pas par 100, ou divisible par 400). La condition est une expression booléenne : on renvoie directement sa valeur, sans <span class="code-inline">if</span>.</li>
      <li><span class="code-inline">jours_du_mois</span> s'appuie sur <span class="code-inline">bissextile</span> pour février ; les <span class="code-inline">return</span> successifs évitent les <span class="code-inline">else</span> : quand un test est vrai, on est déjà sorti.</li>
      <li><span class="code-inline">rang_dans_annee</span> ajoute au jour <span class="code-inline">j</span> la longueur des mois 1 à \(m - 1\). Pour le 1ᵉʳ mars 2024 : \(1 + 31 + 29 = 61\).</li>
    </ol>
    <p>Chaque fonction se teste à part ; pour la dernière, un jeu de tests couvre les cas courants et les limites (premier et dernier jour, février des années bissextiles ou non, années séculaires) :</p>
    <pre class="codeblock"><span class="kw">def</span> tester_dates():
    <span class="kw">assert</span> rang_dans_annee(1, 1, 2025) == 1        <span class="cmt"># premier jour</span>
    <span class="kw">assert</span> rang_dans_annee(31, 12, 2025) == 365    <span class="cmt"># dernier jour, année ordinaire</span>
    <span class="kw">assert</span> rang_dans_annee(31, 12, 2024) == 366    <span class="cmt"># année bissextile</span>
    <span class="kw">assert</span> rang_dans_annee(1, 3, 2024) == 61       <span class="cmt"># après un 29 février</span>
    <span class="kw">assert</span> rang_dans_annee(1, 3, 2100) == 60       <span class="cmt"># 2100 n'est pas bissextile</span>
    <span class="kw">assert</span> rang_dans_annee(1, 3, 2000) == 61       <span class="cmt"># 2000 l'est (divisible par 400)</span>

tester_dates()               <span class="cmt"># silencieux si tous les tests passent</span></pre>
    <p>La méthode (cas typiques, limites, sorties attendues calculées à la main) est détaillée dans <em>Spécification, correction et complexité</em>, §5.</p>
  </div>

  <h3>Le coût d'une fonction qui en appelle d'autres</h3>
  <div class="prop-box"><strong>Coût d'un appel.</strong> Un appel ne compte pas pour une opération élémentaire : il coûte l'exécution du corps de la fonction appelée, avec ces arguments (plus un coût constant pour créer et détruire son cadre). Une boucle de \(n\) tours qui appelle à chaque tour une fonction de coût \(O(c)\) coûte \(O(n\,c)\).</div>
  <div class="method-box"><strong>Exemple — compter les nombres premiers jusqu'à \(N\)</strong>
    <pre class="codeblock"><span class="kw">def</span> nb_premiers(N):
    <span class="str">"""Nombre d'entiers premiers compris entre 2 et N."""</span>
    c = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(2, N + 1):
        <span class="kw">if</span> est_premier(k):
            c = c + 1
    <span class="kw">return</span> c

nb_premiers(100)             <span class="cmt"># 25</span></pre>
    <ol>
      <li>La boucle fait \(N - 1\) tours ; au tour \(k\), l'appel <span class="code-inline">est_premier(k)</span> fait au plus \(\sqrt k\) tours de coût constant (§2).</li>
      <li>Le nombre total de tours est donc majoré par
        <div class="formula">$$\sum_{k=2}^{N} \sqrt{k} \;\le\; (N - 1)\sqrt{N} \;\le\; N\sqrt{N}.$$</div>
        Le coût de <span class="code-inline">nb_premiers(N)</span> est \(O(N\sqrt N)\), alors que le corps de <span class="code-inline">nb_premiers</span>, lu sans regarder <span class="code-inline">est_premier</span>, ressemble à une simple boucle linéaire.</li>
      <li>Par comparaison, <span class="code-inline">rang_dans_annee</span> fait au plus 11 appels de <span class="code-inline">jours_du_mois</span>, chacun de coût constant : coût constant.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : recalculer plusieurs fois le même appel coûteux, par exemple <span class="code-inline">if somme(t) &gt; 0: return somme(t) / len(t)</span>, qui parcourt deux fois la liste. On range le résultat dans une variable : <span class="code-inline">s = somme(t)</span>, puis on utilise <span class="code-inline">s</span>. Dans une boucle, l'oubli coûte un facteur \(n\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS DE L'ANNEXE</div>
  <h2>Ce que Python permet, que le programme n'exige pas</h2>
  <div class="intro">L'annexe du programme liste limitativement les éléments de Python exigibles. Les écritures suivantes existent et se rencontrent dans des corrigés ou des bibliothèques ; un sujet qui en utilise une en rappelle la documentation.</div>
  <h3>Valeurs par défaut et arguments nommés</h3>
  <p>Un paramètre peut recevoir une valeur par défaut, utilisée quand l'argument est omis ; un argument peut être désigné par le nom du paramètre :</p>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">def</span> puissance(x, n=2):
...     <span class="kw">return</span> x ** n
...
&gt;&gt;&gt; puissance(5), puissance(5, 3), puissance(2, n=10)
(25, 125, 1024)</pre>
  <div class="notice"><strong>Erreur classique</strong> : une liste comme valeur par défaut.
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">def</span> noter(note, carnet=[]):
...     carnet.append(note)
...     <span class="kw">return</span> carnet
...
&gt;&gt;&gt; noter(12)
[12]
&gt;&gt;&gt; noter(15)
[12, 15]</pre>
  La valeur par défaut est calculée une seule fois, quand la ligne <span class="code-inline">def</span> s'exécute : tous les appels qui l'utilisent partagent la <em>même</em> liste, qui grossit d'appel en appel. Remède : ne jamais donner de valeur par défaut modifiable ; passer la liste en argument.
  <pre class="codeblock"><span class="kw">def</span> noter(note, carnet):
    <span class="str">"""Ajoute note à la liste carnet (effet de bord) et renvoie carnet."""</span>
    carnet.append(note)
    <span class="kw">return</span> carnet

c1 = noter(12, [])           <span class="cmt"># [12]</span>
c2 = noter(15, [])           <span class="cmt"># [15] : une nouvelle liste à chaque appel</span></pre>
  </div>
  <h3>Écrire une variable globale : <span class="code-inline">global</span></h3>
  <pre class="codeblock">compteur = 0

<span class="kw">def</span> compter():
    <span class="kw">global</span> compteur          <span class="cmt"># hors annexe : autorise l'écriture de la globale</span>
    compteur = compteur + 1

compter()
compter()                    <span class="cmt"># compteur vaut 2</span></pre>
  <p>À éviter : la fonction dépend alors d'un état extérieur, ses résultats dépendent de l'histoire du programme et elle devient difficile à tester. La version avec paramètre et <span class="code-inline">return</span> (§4) est préférable.</p>
  <h3>Fonctions anonymes : <span class="code-inline">lambda</span></h3>
  <pre class="codeblock">cubes = tabuler(<span class="kw">lambda</span> x: x ** 3, 0, 2, 2)     <span class="cmt"># [0.0, 1.0, 8.0]</span></pre>
  <p><span class="code-inline">lambda x: x ** 3</span> est une fonction sans nom, réduite à une expression : pratique pour passer une petite fonction en argument (§7). On peut toujours la remplacer par une fonction définie par <span class="code-inline">def</span>.</p>
  <h3>Et encore</h3>
  <p>Fonctions définies à l'intérieur d'une autre fonction, nombre variable d'arguments (<span class="code-inline">*args</span>), définition et rattrapage d'erreurs (<span class="code-inline">try</span>, <span class="code-inline">except</span>, <span class="code-inline">raise</span>) : rien de cela n'est au programme, qui ne retient que <span class="code-inline">assert</span> pour arrêter un programme dont une condition est fausse.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · FONCTIONS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Écrire une fonction juste du premier coup, prévoir ce que fait un appel, savoir où une variable est visible et ce qu'une fonction modifie : ces réflexes servent à chaque question de programmation, en TP comme à l'écrit.</div>

  <div class="method-box"><strong>Méthode 1 — Écrire une fonction à partir d'un énoncé</strong>
    <ol>
      <li>Lire la <strong>signature</strong> demandée : nom, paramètres et leur type, type du résultat. Recopier l'en-tête exactement (<span class="code-inline">def nom(p1, …, pn):</span>), sans oublier les deux-points.</li>
      <li>Noter en chaîne de documentation ce que la fonction renvoie et les <strong>préconditions</strong> sur les arguments (liste non vide, entier positif…) ; une assertion peut vérifier une précondition peu coûteuse.</li>
      <li>Écrire le corps : initialisations, boucle, résultat. Toutes les variables utilisées sont des paramètres ou sont initialisées <em>dans</em> la fonction.</li>
      <li>Terminer par <span class="code-inline">return</span> : chaque chemin d'exécution doit en rencontrer un (sinon <span class="code-inline">None</span>).</li>
      <li>Tester sur un cas simple calculé à la main et sur un cas limite (§8 du cours).</li>
    </ol>
    <p><em>Exemple éclair :</em> une moyenne pondérée. Avec les notes 10 et 16 de coefficients 1 et 2 : \((10 + 32)/3 = 14\).</p>
    <pre class="codeblock"><span class="kw">def</span> moyenne_ponderee(notes, coefs):
    <span class="str">"""notes, coefs : listes de même longueur n &gt;= 1, coefficients &gt; 0.</span>
<span class="str">    Renvoie la moyenne des notes pondérée par les coefficients."""</span>
    <span class="kw">assert</span> len(notes) == len(coefs) <span class="kw">and</span> len(notes) &gt; 0
    s, total = 0, 0
    <span class="kw">for</span> i <span class="kw">in</span> range(len(notes)):
        s = s + notes[i] * coefs[i]
        total = total + coefs[i]
    <span class="kw">return</span> s / total

<span class="kw">assert</span> moyenne_ponderee([12], [3]) == 12
<span class="kw">assert</span> moyenne_ponderee([10, 16], [1, 2]) == 14</pre>
  </div>

  <div class="method-box"><strong>Méthode 2 — Choisir entre afficher et renvoyer</strong>
    <ol>
      <li>Le résultat sert-il à un calcul, à un test, à un autre appel ? Alors la fonction le <strong>renvoie</strong> par <span class="code-inline">return</span>.</li>
      <li>Un message destiné à l'utilisateur relève de <span class="code-inline">print</span>, qu'on place de préférence hors des fonctions de calcul (dans le programme principal).</li>
      <li>Une fonction qui affiche et calcule doit quand même renvoyer ce qu'elle calcule ; une fonction sans <span class="code-inline">return</span> renvoie <span class="code-inline">None</span>, inutilisable dans un calcul.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">resume([10, 13])</span> affiche <span class="code-inline">moyenne : 11.5</span> <strong>et</strong> renvoie 11,5, réutilisable ensuite.</p>
    <pre class="codeblock"><span class="kw">def</span> resume(notes):
    m = moyenne_ponderee(notes, [1] * len(notes))
    print(<span class="str">"moyenne :"</span>, m)    <span class="cmt"># affichage pour l'utilisateur</span>
    <span class="kw">return</span> m                 <span class="cmt"># valeur pour la suite du calcul</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 3 — Sortir d'une boucle au bon moment avec <span class="code-inline">return</span></strong>
    <ol>
      <li>Placer un <span class="code-inline">return</span> <strong>dans</strong> la boucle là où la réponse devient certaine : élément trouvé, contre-exemple rencontré.</li>
      <li>Placer le <span class="code-inline">return</span> de la réponse « par défaut » (rien trouvé, aucun contre-exemple) <strong>après</strong> la boucle, au niveau d'indentation du <span class="code-inline">for</span> ou du <span class="code-inline">while</span>.</li>
      <li>Vérifier sur trois cas : réponse au premier élément, au dernier, et absente (liste vide comprise).</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">premier_multiple([5, 11, 21, 6], 7)</span> renvoie 2 (21 est le premier multiple de 7) ; avec <span class="code-inline">[1, 2]</span> et 5, on sort de la boucle sans rien trouver : -1.</p>
    <pre class="codeblock"><span class="kw">def</span> premier_multiple(t, k):
    <span class="str">"""Indice du premier multiple de k (k &gt; 0) dans la liste t d'entiers, -1 s'il n'y en a pas."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="kw">if</span> t[i] % k == 0:
            <span class="kw">return</span> i
    <span class="kw">return</span> -1</pre>
  </div>
  <div class="notice"><strong>Piège</strong> : <span class="code-inline">if … : return True</span> suivi de <span class="code-inline">else: return False</span> à l'intérieur de la boucle. La fonction décide dès le premier tour (cours, §2).</div>

  <div class="method-box"><strong>Méthode 4 — Prédire l'effet d'un appel</strong>
    <ol>
      <li>Évaluer les arguments, de gauche à droite ; un appel placé dans un argument est calculé en premier.</li>
      <li>Créer un cadre pour l'appel : chaque paramètre reçoit la <strong>valeur</strong> de son argument.</li>
      <li>Dérouler le corps avec ces valeurs, en lisant les noms non locaux dans l'espace global (méthode 5).</li>
      <li>Remplacer l'appel par la valeur renvoyée ; effacer le cadre.</li>
      <li>Côté appelant, seules les listes et dictionnaires <em>modifiés</em> par la fonction ont changé ; les nombres, chaînes et tuples sont intacts.</li>
    </ol>
    <p><em>Exemple éclair :</em> l'argument vaut 4, la locale <span class="code-inline">x</span> passe à 8, l'appel renvoie 9 ; la globale <span class="code-inline">x</span> vaut toujours 3.</p>
    <pre class="codeblock">x = 3

<span class="kw">def</span> f(x):
    x = 2 * x
    <span class="kw">return</span> x + 1

y = f(x + 1)                 <span class="cmt"># y vaut 9 ; x vaut toujours 3</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 5 — Savoir si une variable est locale ou globale</strong>
    <ol>
      <li>Chercher dans le corps toutes les façons d'affecter le nom : <span class="code-inline">nom = …</span>, paramètre, variable de boucle <span class="code-inline">for nom in …</span>, dépaquetage <span class="code-inline">a, nom = …</span>.</li>
      <li>S'il y en a une, le nom est <strong>local dans tout le corps</strong> ; il doit recevoir une valeur avant d'être lu, sinon <span class="code-inline">UnboundLocalError</span>.</li>
      <li>Sinon, il est lu dans l'espace global, avec la valeur qu'il a <strong>au moment de l'appel</strong> ; s'il n'y existe pas, <span class="code-inline">NameError</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> l'accumulateur <span class="code-inline">total</span> est affecté dans la boucle, donc local ; sa lecture dans <span class="code-inline">total + x</span> échoue, la globale du même nom n'y change rien.</p>
    <pre class="codeblock">total = 0

<span class="kw">def</span> somme(t):
    <span class="kw">for</span> x <span class="kw">in</span> t:
        total = total + x    <span class="cmt"># total est affectée ici, donc locale</span>
    <span class="kw">return</span> total</pre>
    <p>Correction : initialiser l'accumulateur dans la fonction.</p>
    <pre class="codeblock"><span class="kw">def</span> somme(t):
    total = 0                <span class="cmt"># initialisée DANS la fonction</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:
        total = total + x
    <span class="kw">return</span> total</pre>
  </div>

  <div class="method-box"><strong>Méthode 6 — Dessiner la pile d'appels, lire une trace d'erreur</strong>
    <ol>
      <li>Un cadre par appel commencé et non terminé, du plus ancien (en bas, le programme principal) au plus récent (au sommet).</li>
      <li>Dans chaque cadre : les variables locales et leur valeur, et ce que l'appel attend (le résultat de l'appel situé au-dessus).</li>
      <li>Au <span class="code-inline">return</span> du sommet, effacer son cadre et reporter la valeur renvoyée dans le cadre du dessous.</li>
      <li>Pour une trace d'erreur : lire la dernière ligne (nature de l'erreur), puis remonter : la fonction où l'erreur s'est produite, puis celles qui l'ont appelée.</li>
    </ol>
    <p><em>Exemple éclair :</em> pendant <span class="code-inline">carre(3)</span>, dans le calcul de <span class="code-inline">distance((1, 2), (4, 6))</span> du cours (§5), la pile contient, de bas en haut : le module, <span class="code-inline">distance</span>, <span class="code-inline">longueur</span> (<span class="code-inline">u = 3</span>, <span class="code-inline">v = 4</span>), <span class="code-inline">carre</span> (<span class="code-inline">x = 3</span>).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Modifier en place ou renvoyer une nouvelle liste</strong>
    <ol>
      <li>Lire la spécification : modifie-t-elle l'argument (effet de bord), ou renvoie-t-elle un nouvel objet ?</li>
      <li><strong>En place</strong> : modifier les cases (<span class="code-inline">t[i] = …</span>), ne rien renvoyer ; à l'appel, ne pas affecter le résultat.</li>
      <li><strong>Nouvelle liste</strong> : la construire (compréhension, <span class="code-inline">append</span> sur une liste vide, copie), la renvoyer ; à l'appel, l'affecter.</li>
      <li>Ne jamais réaffecter le paramètre (<span class="code-inline">t = …</span>) en espérant changer la liste de l'appelant.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec <span class="code-inline">t = [3, -2, 0, -5]</span>, <span class="code-inline">sans_negatifs(t)</span> renvoie <span class="code-inline">[3, 0, 0, 0]</span> et laisse <span class="code-inline">t</span> intacte ; <span class="code-inline">annuler_negatifs(t)</span> change <span class="code-inline">t</span> en <span class="code-inline">[3, 0, 0, 0]</span> et renvoie <span class="code-inline">None</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> sans_negatifs(t):
    <span class="str">"""Nouvelle liste : les éléments de t, les négatifs remplacés par 0. t intacte."""</span>
    <span class="kw">return</span> [max_0(x) <span class="kw">for</span> x <span class="kw">in</span> t]

<span class="kw">def</span> max_0(x):
    <span class="kw">if</span> x &lt; 0:
        <span class="kw">return</span> 0
    <span class="kw">return</span> x

<span class="kw">def</span> annuler_negatifs(t):
    <span class="str">"""Remplace dans t les négatifs par 0 (effet de bord). Ne renvoie rien."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="kw">if</span> t[i] &lt; 0:
            t[i] = 0</pre>
  </div>

  <div class="method-box"><strong>Méthode 8 — Passer une fonction en argument</strong>
    <ol>
      <li>Prévoir un paramètre ordinaire (<span class="code-inline">f</span>, <span class="code-inline">critere</span>…) et l'appeler dans le corps : <span class="code-inline">f(x)</span>.</li>
      <li>À l'appel, donner le <strong>nom</strong> de la fonction, sans parenthèses : <span class="code-inline">indice_premier(t, est_premier)</span>.</li>
      <li>Coût : nombre d'appels de la fonction reçue multiplié par le coût d'un appel.</li>
    </ol>
    <p><em>Exemple éclair :</em> le premier nombre premier de <span class="code-inline">[9, 15, 21, 23, 25]</span> est 23, d'indice 3.</p>
    <pre class="codeblock"><span class="kw">def</span> indice_premier(t, critere):
    <span class="str">"""Indice du premier élément x de t tel que critere(x) vaut True, -1 s'il n'y en a pas."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="kw">if</span> critere(t[i]):
            <span class="kw">return</span> i
    <span class="kw">return</span> -1

indice_premier([9, 15, 21, 23, 25], est_premier)    <span class="cmt"># 3</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 9 — Évaluer le coût d'une fonction qui en appelle d'autres</strong>
    <ol>
      <li>Établir d'abord le coût de chaque fonction appelée, en fonction de <em>ses</em> arguments.</li>
      <li>Compter les appels : une boucle de \(n\) tours qui appelle une fonction de coût \(O(c)\) coûte \(O(n\,c)\).</li>
      <li>Si le coût de l'appel dépend du tour, sommer : \(\sum_k c_k\), puis majorer.</li>
      <li>Ne garder que l'ordre de grandeur dans le pire cas (<em>Spécification, correction et complexité</em>, §6 et §7).</li>
    </ol>
    <p><em>Exemple éclair :</em> une boucle sur les \(n\) éléments d'une liste <span class="code-inline">u</span> qui appelle à chaque tour <span class="code-inline">contient(t, x)</span> (cours, §2) sur une liste <span class="code-inline">t</span> de longueur \(m\) coûte \(O(n\,m)\) : chaque appel peut parcourir toute la liste <span class="code-inline">t</span>.</p>
  </div>

  <div class="notice"><strong>Piège</strong> : <span class="code-inline">f</span> et <span class="code-inline">f()</span> ne sont pas la même chose. Le premier est la fonction (à passer en argument), le second est le résultat d'un appel (à utiliser dans un calcul). Oublier les parenthèses n'appelle pas la fonction ; en mettre en trop passe un résultat à la place d'une fonction.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Maximum et minimum</h3>
  <div class="statement">On n'utilise pas les fonctions <span class="code-inline">max</span> et <span class="code-inline">min</span> de Python, absentes de l'annexe du programme.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">maxi(a, b)</span>, qui renvoie le plus grand des deux nombres, et <span class="code-inline">mini(a, b)</span>, qui renvoie le plus petit.</div>
  <div class="q"><strong>Q2.</strong> En réutilisant <span class="code-inline">maxi</span> et <span class="code-inline">mini</span>, écrire <span class="code-inline">min_max(a, b, c)</span>, qui renvoie le couple (plus petit, plus grand) des trois nombres. Que valent <span class="code-inline">p</span> et <span class="code-inline">g</span> après <span class="code-inline">p, g = min_max(5, 2, 8)</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> maxi(a, b):
    <span class="kw">if</span> a &gt;= b:
        <span class="kw">return</span> a
    <span class="kw">return</span> b

<span class="kw">def</span> mini(a, b):
    <span class="kw">if</span> a &lt;= b:
        <span class="kw">return</span> a
    <span class="kw">return</span> b

<span class="kw">def</span> min_max(a, b, c):
    <span class="str">"""Couple (plus petit, plus grand) des trois nombres a, b, c."""</span>
    <span class="kw">return</span> mini(mini(a, b), c), maxi(maxi(a, b), c)

p, g = min_max(5, 2, 8)      <span class="cmt"># p = 2, g = 8</span></pre>
    <p><strong>Q1.</strong> Si <span class="code-inline">a &gt;= b</span>, le <span class="code-inline">return a</span> termine la fonction ; sinon on atteint <span class="code-inline">return b</span>. Le <span class="code-inline">else</span> est inutile, puisqu'on est déjà sorti quand le test est vrai.</p>
    <p><strong>Q2.</strong> Dans <span class="code-inline">mini(mini(a, b), c)</span>, l'argument intérieur est évalué d'abord (appel par valeur) : <span class="code-inline">mini(5, 2)</span> vaut 2, puis <span class="code-inline">mini(2, 8)</span> vaut 2. De même, le maximum vaut 8. La fonction renvoie le couple <span class="code-inline">(2, 8)</span>, que l'affectation dépaquète : <span class="code-inline">p = 2</span>, <span class="code-inline">g = 8</span>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Conversions de température</h3>
  <div class="statement">Une température \(C\) en degrés Celsius vaut \(F = \tfrac{9}{5}\,C + 32\) en degrés Fahrenheit.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">celsius_vers_fahrenheit(c)</span>. Que renvoie-t-elle pour 100 ?</div>
  <div class="q"><strong>Q2.</strong> Écrire la conversion réciproque <span class="code-inline">fahrenheit_vers_celsius(f)</span>.</div>
  <div class="q"><strong>Q3.</strong> Pour tester ces fonctions, on vérifie que convertir puis reconvertir redonne la température de départ. Avec 37, Python affiche <span class="code-inline">37.00000000000001</span>. Expliquer, puis écrire une fonction de test sans assertion fausse, qui teste aussi un cas remarquable.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="kw">def</span> celsius_vers_fahrenheit(c):
    <span class="kw">return</span> 9 / 5 * c + 32

<span class="kw">def</span> fahrenheit_vers_celsius(f):
    <span class="kw">return</span> (f - 32) * 5 / 9</pre>
    <p><strong>Q1, Q2.</strong> <span class="code-inline">celsius_vers_fahrenheit(100)</span> vaut \(180 + 32 = 212\), affiché <span class="code-inline">212.0</span> : la division <span class="code-inline">/</span> donne toujours un flottant.</p>
    <pre class="codeblock">&gt;&gt;&gt; celsius_vers_fahrenheit(100)
212.0
&gt;&gt;&gt; fahrenheit_vers_celsius(celsius_vers_fahrenheit(21.5))
21.5
&gt;&gt;&gt; fahrenheit_vers_celsius(celsius_vers_fahrenheit(37))
37.00000000000001</pre>
    <p><strong>Q3.</strong> Les flottants sont des valeurs approchées (9/5 n'est pas exactement 1,8 en machine, voir le chapitre <em>Représentation des nombres</em>) : les deux conversions accumulent des erreurs d'arrondi, minuscules mais non nulles. On ne compare donc pas deux flottants calculés par <span class="code-inline">==</span>, mais à une tolérance près (<span class="code-inline">abs</span> est la valeur absolue, fonction prédéfinie de Python) :</p>
    <pre class="codeblock"><span class="kw">def</span> proches(x, y):
    <span class="kw">return</span> abs(x - y) &lt;= 1e-9 * (1 + abs(x))

<span class="kw">def</span> tester_conversions():
    <span class="kw">assert</span> celsius_vers_fahrenheit(0) == 32
    <span class="kw">assert</span> celsius_vers_fahrenheit(100) == 212
    <span class="kw">assert</span> celsius_vers_fahrenheit(-40) == -40     <span class="cmt"># les deux échelles se croisent</span>
    <span class="kw">for</span> c <span class="kw">in</span> [-273.15, -40, 0, 0.1, 21.5, 100, 1000]:
        <span class="kw">assert</span> proches(fahrenheit_vers_celsius(celsius_vers_fahrenheit(c)), c)

tester_conversions()</pre>
    <p>Les tests exacts restent permis quand le résultat est exactement représentable (0, 100) ; le cas remarquable \(-40\) est la seule température qui a la même valeur dans les deux échelles (\(\tfrac{9}{5}C + 32 = C \iff C = -40\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Trouver l'erreur : un <span class="code-inline">return</span> mal placé</h3>
  <div class="statement">La fonction suivante doit renvoyer <span class="code-inline">True</span> si la liste <span class="code-inline">t</span> est croissante au sens large, <span class="code-inline">False</span> sinon.
  <pre class="codeblock"><span class="kw">def</span> est_croissante(t):
    <span class="str">"""True si la liste t est croissante au sens large."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t) - 1):
        <span class="kw">if</span> t[i] &gt; t[i + 1]:
            <span class="kw">return</span> <span class="kw">False</span>
        <span class="kw">return</span> <span class="kw">True</span></pre></div>
  <div class="q"><strong>Q1.</strong> Que renvoient <span class="code-inline">est_croissante([1, 5, 2])</span> et <span class="code-inline">est_croissante([3])</span> ?</div>
  <div class="q"><strong>Q2.</strong> Corriger la fonction et donner son coût.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le <span class="code-inline">return True</span> est dans la boucle, au même niveau que le <span class="code-inline">if</span> : au premier tour (<span class="code-inline">i = 0</span>), \(1 \gt 5\) est faux, on exécute <span class="code-inline">return True</span>. La fonction renvoie <span class="code-inline">True</span> pour <span class="code-inline">[1, 5, 2]</span>, qui n'est pas croissante : seul le premier couple a été examiné. Pour <span class="code-inline">[3]</span>, <span class="code-inline">range(0)</span> est vide : la boucle ne s'exécute pas, aucun <span class="code-inline">return</span> n'est rencontré et la fonction renvoie <span class="code-inline">None</span>.</p>
    <p><strong>Q2.</strong> On ne peut conclure « croissante » qu'après avoir examiné tous les couples voisins : le <span class="code-inline">return True</span> sort de la boucle.</p>
    <pre class="codeblock"><span class="kw">def</span> est_croissante(t):
    <span class="str">"""True si la liste t est croissante au sens large."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t) - 1):
        <span class="kw">if</span> t[i] &gt; t[i + 1]:
            <span class="kw">return</span> <span class="kw">False</span>     <span class="cmt"># un contre-exemple suffit</span>
    <span class="kw">return</span> <span class="kw">True</span>              <span class="cmt"># aucune descente trouvée (vrai aussi si len(t) &lt;= 1)</span></pre>
    <p>Une liste de longueur 0 ou 1 est bien déclarée croissante. Au pire (liste croissante), la boucle fait \(n - 1\) tours de coût constant : coût \(O(n)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Prédire un affichage : portée et appel par valeur</h3>
  <div class="statement"><pre class="codeblock">x = 4
y = 10

<span class="kw">def</span> f(y):
    x = y + 1
    <span class="kw">return</span> x * y

<span class="kw">def</span> g(x):
    <span class="kw">return</span> x + y

print(f(2))
print(g(f(x)))
print(x, y)</pre></div>
  <div class="q"><strong>Q1.</strong> Qu'affiche ce programme ? Pour chaque appel, préciser quelles variables sont locales.</div>
  <div class="q"><strong>Q2.</strong> On ajoute la fonction suivante, puis l'instruction <span class="code-inline">h()</span>. Que se passe-t-il ?
  <pre class="codeblock"><span class="kw">def</span> h():
    print(x)
    x = 0</pre></div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong></p>
    <ul>
      <li><span class="code-inline">f(2)</span> : le paramètre <span class="code-inline">y</span> vaut 2 ; <span class="code-inline">x</span> est affectée dans <span class="code-inline">f</span>, donc locale : <span class="code-inline">x = 3</span>. L'appel renvoie 6. Première ligne : <span class="code-inline">6</span>.</li>
      <li><span class="code-inline">g(f(x))</span> : on évalue d'abord l'argument <span class="code-inline">f(x)</span>, avec la globale <span class="code-inline">x = 4</span> : dans <span class="code-inline">f</span>, <span class="code-inline">y = 4</span> et <span class="code-inline">x = 5</span>, l'appel renvoie 20. Puis <span class="code-inline">g(20)</span> : le paramètre <span class="code-inline">x</span> vaut 20 ; <span class="code-inline">y</span> n'est pas affectée dans <span class="code-inline">g</span>, elle est lue dans l'espace global : 10. Deuxième ligne : <span class="code-inline">30</span>.</li>
      <li>Les globales <span class="code-inline">x</span> et <span class="code-inline">y</span> n'ont jamais été modifiées (les fonctions n'ont touché que leurs locales) : troisième ligne <span class="code-inline">4 10</span>.</li>
    </ul>

  </div>

m = moyenne_triples([2, 5])</pre></div>
  <div class="q"><strong>Q1.</strong> Décrire la pile d'appels au moment où s'exécute <span class="code-inline">triple(5)</span>, pendant le calcul de <span class="code-inline">m</span> : un cadre par appel en cours, avec ses variables locales.</div>
  <div class="q"><strong>Q2.</strong> Que vaut <span class="code-inline">m</span> ? Combien d'appels de fonctions le calcul de <span class="code-inline">moyenne_triples(t)</span> déclenche-t-il pour une liste de longueur \(n \ge 1\) ? En déduire son coût.</div>
  <div class="q"><strong>Q3.</strong> Que se passe-t-il pour <span class="code-inline">moyenne_triples([])</span> ? Quels cadres la trace d'erreur affiche-t-elle ? Comment rendre l'erreur plus explicite ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> De bas en haut :</p>
    <ol>
      <li>le module, qui attend le résultat de <span class="code-inline">moyenne_triples([2, 5])</span> pour définir <span class="code-inline">m</span> ;</li>
      <li><span class="code-inline">moyenne_triples</span> : <span class="code-inline">t = [2, 5]</span> ; attend <span class="code-inline">somme_triples(t)</span> ;</li>
      <li><span class="code-inline">somme_triples</span> : <span class="code-inline">t = [2, 5]</span>, <span class="code-inline">s = 6</span> (le tour de 2 est fini), <span class="code-inline">x = 5</span> ; attend <span class="code-inline">triple(x)</span> ;</li>
      <li>au sommet, <span class="code-inline">triple</span> : <span class="code-inline">x = 5</span>. Son <span class="code-inline">x</span> et celui de <span class="code-inline">somme_triples</span> sont deux variables distinctes, qui valent toutes deux 5.</li>
    </ol>
    <p><strong>Q2.</strong> \(m = (6 + 15) / 2 = 10{,}5\). Il y a un appel de <span class="code-inline">moyenne_triples</span>, un de <span class="code-inline">somme_triples</span> et \(n\) de <span class="code-inline">triple</span> : \(n + 2\) appels, chacun de coût constant hors appels internes. Coût \(O(n)\).</p>
    <p><strong>Q3.</strong> <span class="code-inline">somme_triples([])</span> renvoie 0 sans appeler <span class="code-inline">triple</span>, puis <span class="code-inline">0 / 0</span> lève <span class="code-inline">ZeroDivisionError</span> dans <span class="code-inline">moyenne_triples</span>. La trace montre deux cadres : le module (ligne <span class="code-inline">m = moyenne_triples(…)</span>), puis <span class="code-inline">moyenne_triples</span> (ligne du <span class="code-inline">return</span>) ; <span class="code-inline">somme_triples</span>, terminée, n'y figure pas. Pour une erreur explicite, on vérifie la précondition au début : <span class="code-inline">assert len(t) &gt; 0</span> dans <span class="code-inline">moyenne_triples</span>.</p>
