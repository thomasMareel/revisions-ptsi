  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre rassemble les capacités de résolution numérique du programme de SI de PT : le bloc C3 « Mettre en œuvre une démarche de résolution numérique » (semestres S3 et S4) et le volet ingénierie numérique de C1 (S3). Il s'appuie sur l'informatique commune (⇆ I : Python, représentation des flottants) et sur des modèles établis ailleurs : loi entrée-sortie (« Cinématique »), principe fondamental de la statique (« Statique »), équations du moteur à courant continu (« Modélisation multiphysique »). Deux systèmes servent de fil conducteur : un essuie-glace et une barrière levante.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Réécrire les équations d'un problème</strong> : forme exploitable par une bibliothèque, forme matricielle d'un problème de Cauchy et d'un système linéaire (C3, S3) (§2).</li>

<div class="course-section">
  <div class="sec-num">§1 · DÉMARCHE DE RÉSOLUTION NUMÉRIQUE</div>
  <h2>Décomposer un problème d'ingénierie en sous-problèmes</h2>
  <div class="intro">Un problème réel (vérifier qu'un moteur convient, prévoir une durée de cycle, dimensionner un ressort) mêle géométrie, efforts, mouvement et énergie, avec des lois non linéaires qu'on ne sait pas résoudre à la main. On ne le confie pas tel quel à l'ordinateur : on le découpe en sous-problèmes dont chacun relève d'un type d'équation connu et d'une méthode numérique éprouvée.</div>
  <div class="def-box">
    <strong>Résolution numérique.</strong> Calcul d'une valeur approchée de la solution d'un problème mathématique par une suite finie d'opérations sur des nombres flottants. Le résultat dépend du modèle (hypothèses, valeurs des paramètres), de la méthode et de ses réglages (pas, tolérance, point de départ) : il doit toujours être validé (§9).
  </div>
  <h3>Quatre types de sous-problèmes</h3>
  <table>
    <tr><th>Sous-problème</th><th>Forme</th><th>Méthode au programme</th><th>Exemples en SI</th></tr>
    <tr><td>Équation non linéaire à une inconnue</td><td>\(f(x) = 0\)</td><td>dichotomie, Newton (§3, §4)</td><td>loi entrée-sortie géométrique, position d'équilibre, valeur d'un paramètre qui satisfait une exigence</td></tr>
    <tr><td>Système d'équations linéaires</td><td>\(A\,X = B\)</td><td>bibliothèque (§5)</td><td>actions mécaniques dans un mécanisme, accélérations de solides couplés, courants d'un réseau</td></tr>
    <tr><td>Équations différentielles</td><td>\(\dot X = F(t, X)\)</td><td>Euler explicite (§6)</td><td>mouvement d'un mécanisme, moteur, asservissement</td></tr>
    <tr><td>Signal échantillonné</td><td>suite \(y_k\)</td><td>différences avant et arrière, rectangles, trapèzes (§8)</td><td>vitesse tirée d'un codeur, énergie tirée d'une puissance mesurée</td></tr>
  </table>
  <div class="method-box">
    <strong>Exemple — vérifier la motorisation d'un essuie-glace.</strong> Le cahier des charges demande si le motoréducteur choisi fournit le couple nécessaire sur tout le cycle et quelle énergie il consomme par balayage. Le mécanisme est un quadrilatère articulé (figure du §3) : la manivelle 1, entraînée en rotation continue, fait osciller par la bielle 2 le balancier 3 qui porte le balai.
    <ol style="margin-top:.4rem">
      <li><span class="step">Géométrie.</span> Pour chaque angle \(\theta\) de la manivelle, trouver l'angle \(\varphi\) du balancier : une équation \(f(\varphi) = 0\) par position (§3, §4).</li>
      <li><span class="step">Cinématique.</span> Rapport de transmission \(\mathrm{d}\varphi/\mathrm{d}\theta\), par dérivation numérique de la loi obtenue (§8).</li>
      <li><span class="step">Efforts.</span> Pour chaque position, le PFS appliqué aux trois solides donne neuf équations linéaires ; inconnues : actions dans les liaisons et couple moteur (§5).</li>
      <li><span class="step">Mouvement</span>, si l'inertie n'est pas négligeable : équation différentielle intégrée par Euler (§6).</li>
      <li><span class="step">Synthèse.</span> Couple maximal sur un tour, énergie par cycle (intégration numérique, §8), comparaison à l'exigence et validation (§9).</li>
    </ol>
    Chaque sous-problème est programmé et testé séparément, sur un cas dont on connaît la réponse, avant d'être enchaîné aux autres.
  </div>
  <h3>Choisir l'outil</h3>
  <p>Par ordre de préférence : une <strong>solution analytique</strong> si elle existe et reste lisible (elle montre d'un coup d'œil l'influence des paramètres) ; une <strong>fonction de bibliothèque</strong> éprouvée (numpy, scipy), avec sa documentation ; un <strong>algorithme écrit soi-même</strong> quand il faut en maîtriser chaque étape (critère d'arrêt, programme embarqué, temps réel) ou quand le sujet le demande. Les épreuves de SI font souvent compléter un algorithme court et interpréter des courbes issues d'un logiciel de simulation.</p>
  <div class="notice">
    <strong>Rappel d'informatique (⇆ I)</strong> : un flottant n'est qu'une approximation d'un réel ; 0,1 n'a pas d'écriture binaire finie. Deux flottants ne se comparent donc jamais avec <code>==</code> mais à une tolérance près, et une boucle <code>while x != cible</code> peut ne jamais s'arrêter. Les modules (numpy, scipy) ne sont pas exigibles : un énoncé rappelle les fonctions qu'il utilise.
  </div>
<pre class="codeblock"><code>print(0.1 + 0.2 == 0.3)               <span class="cmt"># False</span>
print(abs(0.1 + 0.2 - 0.3) &lt; 1e-12)   <span class="cmt"># True</span></code></pre>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RÉÉCRIRE LES ÉQUATIONS</div>
  <h2>Mettre un modèle sous la forme attendue par une méthode</h2>
  <div class="intro">Les équations issues de la physique (fermeture géométrique, PFS, PFD, lois électriques) sont rarement sous la forme qu'exige une méthode numérique ou une fonction de bibliothèque. Les réécrire est un travail de modélisation : choisir les inconnues, les ordonner, isoler les dérivées.</div>
  <div class="def-box">
    <strong>Trois formes exploitables par une bibliothèque.</strong>
    <ul>
      <li><strong>Équation scalaire</strong> \(f(x) = 0\) : \(f\) est une fonction que l'on sait évaluer (expression, ou résultat d'un autre calcul).</li>
      <li><strong>Système linéaire</strong> \(A\,X = B\) : \(X\) est le vecteur des \(n\) inconnues, \(A\) une matrice \(n\times n\) indépendante de \(X\), \(B\) le second membre, formé des données.</li>
      <li><strong>Problème de Cauchy</strong> : \(\dfrac{\mathrm{d}X}{\mathrm{d}t} = F(t, X)\) avec \(X(t_0) = X_0\) ; \(X(t)\) est le vecteur d'état, \(F\) une fonction que l'on sait évaluer.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Vecteur d'état.</strong> C'est le plus petit ensemble de grandeurs dont la valeur à un instant, avec la connaissance des entrées, détermine toute la suite de l'évolution. On y trouve les grandeurs qui stockent de l'énergie : positions (énergie potentielle) et vitesses (énergie cinétique) des solides, courants dans les inductances, tensions aux bornes des condensateurs. Une équation différentielle d'ordre \(n\) en fournit \(n\) composantes : l'inconnue et ses \(n-1\) premières dérivées.
  </div>
  <div class="method-box">
    <strong>Exemple — mise sous forme de Cauchy du mouvement d'une barrière levante.</strong> La lisse d'une barrière de parking tourne autour d'un axe horizontal (angle \(\theta\) : 0 lisse fermée, \(\pi/2\) ouverte). Données ramenées à l'axe de la lisse : inertie \(J = 15\ \text{kg·m}^2\) ; couple de déséquilibre \(C_0\cos\theta\), avec \(C_0 = 30\ \text{N·m}\) (le contrepoids ne compense qu'une partie du poids) ; motoréducteur de caractéristique \(C_m = C_d\,(1 - \omega/\omega_0)\), avec \(C_d = 80\ \text{N·m}\) (couple de démarrage) et \(\omega_0 = 1{,}2\ \text{rad/s}\) (vitesse à vide).
    <ol style="margin-top:.4rem">
      <li><span class="step">Équation du mouvement</span> (théorème du moment dynamique sur l'axe de rotation), du second ordre et non linéaire à cause de \(\cos\theta\) :
        <div class="formula" data-nom="Mouvement de la lisse">$$J\,\ddot\theta = C_d\left(1-\frac{\dot\theta}{\omega_0}\right) - C_0\cos\theta$$</div></li>
      <li><span class="step">État.</span> \(X = (\theta, \omega)\), avec \(\omega = \dot\theta\) : deux composantes pour une équation d'ordre 2.</li>
      <li><span class="step">Forme de Cauchy.</span>
        <div class="formula" data-nom="Forme de Cauchy">$$\frac{\mathrm{d}}{\mathrm{d}t}\begin{pmatrix}\theta\\ \omega\end{pmatrix} = \begin{pmatrix}\omega\\ \dfrac{1}{J}\left[C_d\left(1-\dfrac{\omega}{\omega_0}\right) - C_0\cos\theta\right]\end{pmatrix}\qquad X(0) = \begin{pmatrix}0\\ 0\end{pmatrix}$$</div></li>
      <li><span class="step">Programme.</span> Une fonction qui reçoit \(t\) et \(X\) et renvoie \(\mathrm{d}X/\mathrm{d}t\). Le paramètre \(C_0\) est passé en argument pour pouvoir le faire varier (§7).</li>
    </ol>
  </div>
<pre class="codeblock"><code><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">from</span> math <span class="kw">import</span> cos, sin, pi

J, Cd, w0 = 15.0, 80.0, 1.2   <span class="cmt"># kg·m², N·m, rad/s</span>

<span class="kw">def</span> F(t, X, C0):
    <span class="str">"""Dérivée de l'état X = [theta, omega]."""</span>
    theta, omega = X
    Cm = Cd*(1 - omega/w0)    <span class="cmt"># couple du motoréducteur</span>
    <span class="kw">return</span> np.array([omega, (Cm - C0*cos(theta))/J])

X0 = np.array([0.0, 0.0])     <span class="cmt"># lisse fermée, au repos</span></code></pre>
  <h3>Forme matricielle d'un modèle linéaire</h3>
  <p>Quand les équations sont linéaires à coefficients constants, \(F(t, X) = A\,X + B\,u(t)\) : c'est la <strong>représentation d'état</strong>. Pour un moteur à courant continu à vide (notations de « Modélisation multiphysique » §6), les équations électrique et mécanique</p>
  <div class="formula">$$u = R\,i + L\,\frac{\mathrm{d}i}{\mathrm{d}t} + K\omega\qquad J\,\frac{\mathrm{d}\omega}{\mathrm{d}t} = K\,i - f_v\,\omega$$</div>
  <p>donnent, avec \(X = (i, \omega)\) :</p>
  <div class="formula" data-nom="Représentation d'état du moteur à courant continu">$$\frac{\mathrm{d}}{\mathrm{d}t}\begin{pmatrix} i\\ \omega\end{pmatrix} = \underbrace{\begin{pmatrix} -R/L & -K/L\\ K/J & -f_v/J\end{pmatrix}}_{A}\begin{pmatrix} i\\ \omega\end{pmatrix} + \underbrace{\begin{pmatrix}1/L\\ 0\end{pmatrix}}_{B}\,u(t)$$</div>
  <p>Un couple résistant ajouterait une seconde entrée (une colonne de plus dans \(B\)) ; avec un réducteur et une charge, \(J\) devient l'inertie équivalente ramenée à l'arbre moteur. En Python, numpy calcule le produit matriciel avec l'opérateur <code>@</code> :</p>
<pre class="codeblock"><code>R, Lm, K, Jm, fv = 1.0, 1e-3, 0.05, 1e-4, 1e-5   <span class="cmt"># SI</span>
A = np.array([[-R/Lm, -K/Lm],
              [ K/Jm, -fv/Jm]])
B = np.array([1/Lm, 0.0])

<span class="kw">def</span> F_mcc(t, X, U):
    <span class="str">"""Moteur à courant continu, X = [i, omega]."""</span>
    <span class="kw">return</span> A @ X + B*U        <span class="cmt"># @ : produit matriciel</span></code></pre>
  <div class="notice">
    <strong>Erreur classique</strong> : laisser une dérivée dans le second membre. \(F(t, X)\) ne doit utiliser que \(t\), les composantes de \(X\) et des entrées connues. Si les équations de deux solides couplés font apparaître leurs deux accélérations à la fois, on résout d'abord, à chaque appel de \(F\), le petit système linéaire en accélérations (§5).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ÉQUATION f(x) = 0 : DICHOTOMIE</div>
  <h2>Encadrer la solution et réduire l'intervalle de moitié</h2>
  <div class="intro">Position d'un mécanisme pour une entrée donnée, position d'équilibre, valeur d'un paramètre qui satisfait une exigence : ces problèmes ont la forme \(f(x) = 0\) avec une seule inconnue réelle. La dichotomie est la méthode la plus sûre.</div>

  <p>Repère d'origine O, axe \(\vec x\) selon OD. Les points \(A(r_1\cos\theta,\ r_1\sin\theta)\) et \(B(d + r_3\cos\varphi,\ r_3\sin\varphi)\) dépendent de l'entrée \(\theta\) et de la sortie \(\varphi\). La fermeture géométrique de la chaîne O-A-B-D-O contient aussi l'angle de la bielle ; on l'élimine en écrivant que la longueur AB vaut L :</p>
  <div class="formula" data-nom="Fermeture géométrique de l'essuie-glace">$$f(\varphi) = \left(d + r_3\cos\varphi - r_1\cos\theta\right)^2 + \left(r_3\sin\varphi - r_1\sin\theta\right)^2 - L^2 = 0$$</div>
  <p>Pour \(\theta\) donné, c'est une équation en \(\varphi\), qui a en général deux solutions : les deux façons de monter le mécanisme (modes d'assemblage).</p>
  <h3>Principe et algorithme</h3>
  <div class="prop-box">
    <strong>Dichotomie.</strong> Si \(f\) est continue sur \([a, b]\) et si \(f(a)\) et \(f(b)\) sont de signes contraires, \(f\) s'annule sur \(]a, b[\) (théorème des valeurs intermédiaires). On évalue \(f\) au milieu \(m\), on garde la moitié aux bornes de laquelle \(f\) change de signe, et on recommence. Pour obtenir un intervalle de largeur inférieure à \(\varepsilon\), il faut
    <div class="formula" data-nom="Nombre d'itérations de la dichotomie">$$n \geq \log_2\frac{b-a}{\varepsilon}\ \text{ itérations}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi ce nombre d'itérations ?</span>
    <div class="content"><p>Chaque itération divise la largeur de l'intervalle par 2 ; après \(n\) itérations, elle vaut \((b-a)/2^n\). La condition \((b-a)/2^n \leq \varepsilon\) équivaut à \(2^n \geq (b-a)/\varepsilon\), soit \(n \geq \log_2\big((b-a)/\varepsilon\big)\). Le milieu du dernier intervalle est alors à moins de \(\varepsilon/2\) d'un zéro de \(f\). Ce nombre ne dépend pas de \(f\) : la durée du calcul est connue d'avance, propriété précieuse dans un programme embarqué.</p></div>
  </div>
<pre class="codeblock"><code><span class="kw">def</span> dichotomie(f, a, b, eps, p):
    <span class="str">"""Zéro de x -&gt; f(x, p) dans [a, b] : f(a, p) et</span>
<span class="str">    f(b, p) doivent être de signes contraires."""</span>
    fa = f(a, p)
    <span class="kw">while</span> b - a &gt; eps:
        m = (a + b)/2
        fm = f(m, p)
        <span class="kw">if</span> fa*fm &lt;= 0:        <span class="cmt"># changement de signe</span>
            b = m             <span class="cmt"># dans [a, m]</span>
        <span class="kw">else</span>:
            a, fa = m, fm     <span class="cmt"># sinon dans [m, b]</span>
    <span class="kw">return</span> (a + b)/2</code></pre>
  <p>La valeur \(f(a)\) est gardée en mémoire plutôt que recalculée : quand \(f\) est coûteuse (une simulation complète, §7), on n'évalue \(f\) qu'une fois par itération. Le paramètre <code>p</code> est transmis à \(f\) sans modification (ici l'angle \(\theta\)).</p>
  <h3>Critères d'arrêt</h3>
  <ul>
    <li><strong>Sur l'inconnue</strong> : largeur de l'intervalle (dichotomie) ou correction \(|x_{n+1} - x_n|\) (Newton) inférieure à \(\varepsilon\). Même unité que \(x\), et choisie d'après la précision utile : 0,01° pour un angle de mécanisme, 1 µm pour une cote. Si l'ordre de grandeur de \(x\) est inconnu, on emploie un critère relatif, \(|x_{n+1} - x_n| \leq \varepsilon\,|x_{n+1}|\).</li>
    <li><strong>Sur le résidu</strong> : \(|f(x_n)| \lt \varepsilon_f\). Ce critère dépend de l'écriture de l'équation (\(f\) et \(1000\,f\) ont les mêmes zéros) et de ses unités (ici des mm²) : il faut savoir ce que représente \(f\) pour le régler.</li>
    <li><strong>Nombre maximal d'itérations</strong> : garde-fou indispensable quand la convergence n'est pas garantie (Newton). Atteindre cette limite doit être signalé comme un échec, jamais rendu comme un résultat.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — angle du balancier pour θ = 90°.</strong> Avec \(r_1 = 25\ \text{mm}\), \(L = 120\ \text{mm}\), \(r_3 = 50\ \text{mm}\), \(d = 110\ \text{mm}\) :
    <ol style="margin-top:.4rem">
      <li><span class="step">Encadrement.</span> \(f(0) = 11\,825\ \text{mm}^2 \gt 0\) et \(f(\pi) = -10\,175\ \text{mm}^2 \lt 0\) : une solution dans \(]0, \pi[\). La seconde solution (vers −107°) est hors de l'intervalle : choisir \([0, \pi]\), c'est choisir le mode d'assemblage.</li>
      <li><span class="step">Premières itérations.</span> \(f(\pi/2) = -1\,675 \lt 0\), on garde \([0, \pi/2]\) ; \(f(\pi/4) \approx 6\,840 \gt 0\), on garde \([\pi/4, \pi/2]\) ; puis \([3\pi/8, \pi/2]\)…</li>
      <li><span class="step">Coût.</span> Pour \(\varepsilon = 10^{-6}\ \text{rad}\) : \(\log_2(\pi/10^{-6}) \approx 21{,}6\), donc 22 itérations ; résultat \(\varphi = 1{,}420\,52\ \text{rad} = 81{,}390°\).</li>
    </ol>
  </div>
  <p>La dichotomie ne demande que le <strong>signe</strong> de \(f\) : elle convient à une fonction connue seulement par ses valeurs (résultat d'une simulation, tableau de mesures), même bruitée ou non dérivable. En contrepartie, elle est lente (un chiffre décimal exact gagné toutes les 3,3 itérations) et suppose qu'on connaisse un intervalle qui ne contient que la solution voulue.</p>
</div>

<div class="course-section">
  <div class="sec-num">§4 · MÉTHODE DE NEWTON</div>
  <h2>Suivre la tangente pour converger très vite</h2>
  <div class="prop-box">
    <strong>Méthode de Newton.</strong> À partir d'une valeur \(x_n\), on remplace la courbe de \(f\) par sa tangente en \(x_n\) et on prend le point où cette tangente coupe l'axe :
    <div class="formula" data-nom="Itération de Newton">$$x_{n+1} = x_n - \frac{f(x_n)}{f'(x_n)}$$</div>
    Il faut une valeur de départ \(x_0\) proche de la solution et \(f'(x_n) \neq 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">D'où vient la formule ?</span>
    <div class="content"><p>La tangente à la courbe de \(f\) au point d'abscisse \(x_n\) a pour équation \(y = f(x_n) + f'(x_n)\,(x - x_n)\). Elle coupe l'axe des abscisses (\(y = 0\)) en \(x = x_n - f(x_n)/f'(x_n)\), à condition que \(f'(x_n) \neq 0\). Près de la solution, la courbe et sa tangente se confondent : l'erreur commise à chaque pas est petite devant l'erreur précédente.</p></div>
  </div>
<pre class="codeblock"><code><span class="kw">def</span> newton(f, df, x0, p, eps=1e-9, nmax=50):
    <span class="str">"""Zéro de x -&gt; f(x, p) par Newton, départ x0."""</span>
    x, n = x0, 0
    dx = 2*eps                <span class="cmt"># pour entrer dans la boucle</span>
    <span class="kw">while</span> abs(dx) &gt; eps <span class="kw">and</span> n &lt; nmax:
        dx = f(x, p)/df(x, p)
        x = x - dx
        n = n + 1
    <span class="kw">assert</span> abs(dx) &lt;= eps     <span class="cmt"># sinon : pas de convergence</span>
    <span class="kw">return</span> x</code></pre>
  <h3>Dérivée exacte ou approchée</h3>
  <p>Pour l'essuie-glace, la dérivée se calcule sans peine :</p>
  <div class="formula" data-nom="Dérivée de la fermeture géométrique">$$f'(\varphi) = -2r_3\sin\varphi\,\left(d + r_3\cos\varphi - r_1\cos\theta\right) + 2r_3\cos\varphi\,\left(r_3\sin\varphi - r_1\sin\theta\right)$$</div>
  <p>Quand \(f\) est compliquée ou seulement calculable, on remplace \(f'(x_n)\) par le taux d'accroissement \(\big(f(x_n + \delta) - f(x_n)\big)/\delta\), avec \(\delta\) petit devant l'échelle de variation de \(f\) mais pas au point que les arrondis dominent (\(\delta \approx 10^{-6}\,|x|\) est un bon début). La convergence reste rapide.</p>
  <div class="method-box">
    <strong>Exemple — le même angle par Newton, en partant de φ₀ = π/2.</strong> On a \(f(\pi/2) = -1\,675\ \text{mm}^2\) et \(f'(\pi/2) = -11\,000\ \text{mm}^2/\text{rad}\), donc \(\varphi_1 = \pi/2 - 0{,}152\,3 = 1{,}418\,5\ \text{rad}\).
    <table>
      <tr><th>\(n\)</th><th>\(\varphi_n\) (°)</th><th>\(f(\varphi_n)\) (mm²)</th><th>erreur (rad)</th></tr>
      <tr><td>0</td><td>90,000 000</td><td>−1 675</td><td>1,5 × 10⁻¹</td></tr>
      <tr><td>1</td><td>81,275 415</td><td>22,5</td><td>2,0 × 10⁻³</td></tr>
      <tr><td>2</td><td>81,389 795</td><td>1,6 × 10⁻³</td><td>1,4 × 10⁻⁷</td></tr>
      <tr><td>3</td><td>81,389 803</td><td>≈ 10⁻¹¹</td><td>≈ 10⁻¹⁵</td></tr>
    </table>
    Trois itérations suffisent pour atteindre la précision de la machine, contre 22 pour une précision de \(10^{-6}\) par dichotomie : le nombre de chiffres exacts double à chaque itération.
  </div>

  <h3>Point de départ et pièges</h3>
  <ul>
    <li><strong>La valeur de départ choisit la solution.</strong> Partie de \(\varphi_0 = 0\), la méthode converge vers 253°, soit −107° : l'autre mode d'assemblage. Le résultat est juste mathématiquement, mais faux pour le mécanisme réel.</li>
    <li><strong>Tangente presque horizontale.</strong> Si \(f'(x_n) \approx 0\), la correction est énorme et l'itéré part n'importe où. Ici \(f'(\varphi) = 0\) quand la bielle et le balancier sont alignés : une position que le mécanisme doit justement éviter (§5).</li>
    <li><strong>Divergence ou oscillation</strong> si le départ est loin : d'où le nombre maximal d'itérations. Les fonctions de bibliothèque combinent souvent les deux méthodes : quelques pas de dichotomie pour s'approcher, puis des pas de type Newton.</li>
  </ul>
  <h3>Tracer une loi entrée-sortie complète</h3>
  <p>Pour obtenir \(\varphi(\theta)\) sur un tour, on résout une équation par position, en partant chaque fois de la <strong>solution trouvée pour la position précédente</strong> : comme \(\theta\) varie peu d'un pas à l'autre, deux ou trois itérations suffisent et le calcul reste sur le même mode d'assemblage.</p>
<pre class="codeblock"><code>r1, L, r3, d = 25.0, 120.0, 50.0, 110.0   <span class="cmt"># mm</span>

<span class="kw">def</span> f(phi, theta):
    <span class="str">"""Fermeture : nulle quand AB = L (mm²)."""</span>
    xAB = d + r3*cos(phi) - r1*cos(theta)
    yAB = r3*sin(phi) - r1*sin(theta)
    <span class="kw">return</span> xAB**2 + yAB**2 - L**2

<span class="kw">def</span> df(phi, theta):
    <span class="str">"""Dérivée de f par rapport à phi."""</span>
    xAB = d + r3*cos(phi) - r1*cos(theta)
    yAB = r3*sin(phi) - r1*sin(theta)
    <span class="kw">return</span> -2*r3*sin(phi)*xAB + 2*r3*cos(phi)*yAB

thetas = [k*pi/180 <span class="kw">for</span> k <span class="kw">in</span> range(361)]   <span class="cmt"># pas de 1°</span>
phis = []
phi = pi/2                    <span class="cmt"># mode d'assemblage n° 1</span>
<span class="kw">for</span> theta <span class="kw">in</span> thetas:
    <span class="cmt"># départ = solution de la position précédente</span>
    phi = newton(f, df, phi, theta)
    phis.append(phi)</code></pre>

<div class="course-section">
  <div class="sec-num">§5 · SYSTÈME LINÉAIRE A·X = B</div>
  <h2>Statique d'un mécanisme plan par le calcul matriciel</h2>
  <div class="intro">Isoler chaque solide d'un mécanisme plan et lui appliquer le PFS donne trois équations scalaires par solide, linéaires par rapport aux actions inconnues dès que la position est fixée. Plutôt que de chercher un ordre de résolution astucieux, on peut écrire toutes les équations et confier la résolution à une bibliothèque : la méthode est la même pour 3 ou pour 30 inconnues.</div>
  <div class="prop-box">
    <strong>Mise sous forme A·X = B.</strong>
    <ol>
      <li>Lister les inconnues et fixer leur ordre dans le vecteur \(X\).</li>
      <li>Écrire chaque équation avec les inconnues à gauche et les données (efforts connus, poids) à droite.</li>
      <li>La ligne \(i\) de \(A\) contient les coefficients de l'équation \(i\) (colonne \(j\) : coefficient de l'inconnue \(j\), souvent nul) ; \(B_i\) est son second membre.</li>
    </ol>
    Pour un mécanisme plan isostatique de \(n\) solides mobiles (bâti exclu) : \(3n\) équations, \(3n\) inconnues, et \(A\) est inversible.
  </div>
  <div class="method-box">
    <strong>Exemple — couple moteur de l'essuie-glace à θ = 90°.</strong> D'après le §4, \(\varphi = 81{,}39°\), d'où (en m) \(A(0\,;\,0{,}025)\), \(B(0{,}117\,49\,;\,0{,}049\,44)\), \(D(0{,}110\,;\,0)\). Le frottement du balai sur le pare-brise exerce sur le balancier un couple résistant \(C_r = 8\ \text{N·m}\). Hypothèses : mouvement lent (inertie négligée), poids négligés, liaisons pivots parfaites.
    <ol style="margin-top:.4rem">
      <li><span class="step">Inconnues.</span> L'action du solide \(i\) sur le solide \(j\) dans leur pivot est notée \(X_{ij}\,\vec x + Y_{ij}\,\vec y\). Neuf inconnues, rangées dans cet ordre :
        <div class="formula">$$X = (X_{01}, Y_{01}, X_{21}, Y_{21}, X_{32}, Y_{32}, X_{03}, Y_{03}, C_m)$$</div></li>
      <li><span class="step">Équations</span> (moment d'une force \((F_x, F_y)\) appliquée en \(P\), calculé en \(Q\) : \((x_P - x_Q)F_y - (y_P - y_Q)F_x\)) :
        manivelle 1 (moment en O), bielle 2 (moment en A), balancier 3 (moment en D) :
        <div class="formula">$$\left\{\begin{array}{l} X_{01} + X_{21} = 0\\ Y_{01} + Y_{21} = 0\\ C_m + x_A\,Y_{21} - y_A\,X_{21} = 0\end{array}\right.$$</div>
        <div class="formula">$$\left\{\begin{array}{l} -X_{21} + X_{32} = 0\\ -Y_{21} + Y_{32} = 0\\ (x_B - x_A)\,Y_{32} - (y_B - y_A)\,X_{32} = 0\end{array}\right.$$</div>
        <div class="formula">$$\left\{\begin{array}{l} X_{03} - X_{32} = 0\\ Y_{03} - Y_{32} = 0\\ (y_B - y_D)\,X_{32} - (x_B - x_D)\,Y_{32} = C_r\end{array}\right.$$</div></li>
      <li><span class="step">Résolution</span> par <code>numpy.linalg.solve(A, B)</code>, qui renvoie le vecteur \(X\) tel que \(A\,X = B\).</li>
      <li><span class="step">Résultats.</span> \(C_m \approx 4{,}18\ \text{N·m}\) ; effort dans la bielle \(X_{32} \approx 167\ \text{N}\), \(Y_{32} \approx 35\ \text{N}\), soit 171 N dirigés selon AB (inclinée de 11,7°) : la bielle, soumise à deux forces, transmet bien un effort selon son axe.</li>
    </ol>
  </div>
<pre class="codeblock"><code><span class="kw">def</span> statique(xA, yA, xB, yB, xD, yD, Cr):
    <span class="str">"""Inconnues (unités SI), dans l'ordre :</span>
<span class="str">    X = [X01, Y01, X21, Y21, X32, Y32, X03, Y03, Cm]"""</span>
    A = np.zeros((9, 9))
    B = np.zeros(9)
    <span class="cmt"># solide 1 : résultante (x, y), moment en O</span>
    A[0, 0], A[0, 2] = 1, 1
    A[1, 1], A[1, 3] = 1, 1
    A[2, 2], A[2, 3], A[2, 8] = -yA, xA, 1
    <span class="cmt"># solide 2 : résultante (x, y), moment en A</span>
    A[3, 2], A[3, 4] = -1, 1
    A[4, 3], A[4, 5] = -1, 1
    A[5, 4], A[5, 5] = -(yB - yA), xB - xA
    <span class="cmt"># solide 3 : résultante (x, y), moment en D</span>
    A[6, 4], A[6, 6] = -1, 1
    A[7, 5], A[7, 7] = -1, 1
    A[8, 4], A[8, 5] = yB - yD, -(xB - xD)
    B[8] = Cr
    <span class="kw">return</span> np.linalg.solve(A, B)

X = statique(0, 0.025, 0.11749, 0.04944, 0.11, 0, 8)
print(X[8])                   <span class="cmt"># Cm = 4,18 N·m environ</span></code></pre>
  <p>En répétant ce calcul pour chaque position de la loi entrée-sortie (§4), avec un couple résistant toujours opposé au mouvement du balancier, on obtient le couple moteur sur tout le tour : il culmine à 5,3 N·m vers θ = 320°, pendant la course de retour du balai (φ décroissant). C'est cette valeur qui sert à choisir le motoréducteur.</p>
  <div class="notice">
    <strong>Matrice singulière</strong> : <code>numpy.linalg.solve</code> s'arrête sur l'erreur <code>LinAlgError: Singular matrix</code> quand les équations ne déterminent pas les inconnues. Causes possibles : mécanisme hyperstatique (certaines inconnues ne sont pas calculables, voir « Chaînes de solides »), mécanisme mobile dont on a oublié l'inconnue motrice (équilibre impossible), ou position singulière (bielle et balancier alignés) où l'effort nécessaire devient infini. Près d'une telle position, les résultats deviennent très grands et très sensibles aux données : le calcul reflète un défaut réel de conception.
  </div>
  <p>Inutile de calculer l'inverse de \(A\) : la bibliothèque résout le système par une variante de la méthode du pivot de Gauss, plus rapide et plus précise que le produit \(A^{-1}B\). Pour garder des coefficients d'ordres de grandeur comparables, on écrit toutes les données en unités SI (mètres et non millimètres, pour des moments en N·m).</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · ÉQUATIONS DIFFÉRENTIELLES : EULER EXPLICITE</div>
  <h2>Avancer pas à pas dans le temps</h2>
  <div class="intro">Pour un problème de Cauchy, on calcule des valeurs approchées \(X_k \approx X(t_k)\) aux instants \(t_k = t_0 + k\,h\), où \(h\) est le pas de discrétisation. Le schéma d'Euler explicite est le plus simple : chaque état se déduit directement du précédent.</div>
  <div class="prop-box">
    <strong>Schéma d'Euler explicite.</strong> Sur l'intervalle \([t_k, t_k + h]\), la dérivée est remplacée par sa valeur au début du pas :
    <div class="formula" data-nom="Schéma d'Euler explicite">$$X_{k+1} = X_k + h\,F(t_k, X_k)$$</div>
    <div class="formula">$$t_{k+1} = t_k + h$$</div>
    Toutes les composantes de \(X\) avancent ensemble, avec les valeurs de l'instant \(t_k\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Deux lectures du même schéma</span>
    <div class="content"><p><strong>Dérivée.</strong> On approche \(\dot X(t_k)\) par la différence avant \((X_{k+1} - X_k)/h\) et on écrit \(\dot X(t_k) = F(t_k, X_k)\).</p><p><strong>Intégrale.</strong> Exactement, \(X(t_{k+1}) = X(t_k) + \int_{t_k}^{t_{k+1}} F\big(t, X(t)\big)\,\mathrm{d}t\) ; Euler explicite remplace l'intégrale par l'aire du rectangle à gauche, \(h\,F(t_k, X_k)\).</p><p>« Explicite » : \(X_{k+1}\) s'obtient directement à partir de grandeurs connues, sans équation à résoudre à chaque pas (contrairement aux schémas implicites, hors programme).</p></div>
  </div>
<pre class="codeblock"><code><span class="kw">def</span> euler(F, X0, h, n, p):
    <span class="str">"""n pas d'Euler explicite de durée h, depuis t = 0."""</span>
    T = np.zeros(n + 1)
    X = np.zeros((n + 1, len(X0)))   <span class="cmt"># ligne k : état X_k</span>
    X[0] = X0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        X[k+1] = X[k] + h*F(T[k], X[k], p)
        T[k+1] = T[k] + h
    <span class="kw">return</span> T, X

T, X = euler(F, X0, 0.05, 40, 30.0)  <span class="cmt"># 2 s simulées</span></code></pre>
  <div class="method-box">
    <strong>Exemple — premiers pas pour la barrière, avec un pas de 0,05 s.</strong>
    <ol style="margin-top:.4rem">
      <li>En \(X_0 = (0\,;\,0)\) : \(\dot\theta = 0\) et \(\dot\omega = (80 - 30)/15 = 3{,}333\ \text{rad/s}^2\), donc \(X_1 = (0\,;\,0{,}166\,7)\).</li>
      <li>En \(X_1\) : \(\dot\theta = 0{,}166\,7\ \text{rad/s}\) et \(\dot\omega = [80 \times 0{,}861\,1 - 30]/15 = 2{,}593\ \text{rad/s}^2\), donc \(X_2 = (0{,}008\,3\,;\,0{,}296\,3)\).</li>
      <li>Après 40 pas (\(t = 2\ \text{s}\)) : \(\theta = 1{,}491\ \text{rad}\) et \(\omega = 1{,}069\ \text{rad/s}\), contre 1,503 rad et 1,074 rad/s pour une solution de référence calculée avec un pas mille fois plus petit.</li>
    </ol>
  </div>
  <p>Pour un modèle linéaire (§2), le pas s'écrit \(X_{k+1} = X_k + h\,(A\,X_k + B\,u_k)\), soit en Python <code>X[k+1] = X[k] + h*(A @ X[k] + B*u[k])</code>.</p>

<div class="course-section">
  <div class="sec-num">§7 · MENER UNE SIMULATION</div>
  <h2>Grandeurs observées, réglages du solveur, influence des paramètres</h2>
  <div class="intro">Simuler, c'est répondre à une question du cahier des charges à l'aide d'un modèle. Avant de lancer le calcul, on décide de ce qu'on observe, sur quelle durée et avec quel pas ; après, on étudie comment les performances dépendent des paramètres.</div>
  <div class="method-box">
    <strong>Méthode — préparer une simulation.</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Grandeurs observées.</span> Celles qui portent les critères du cahier des charges (temps de réponse, dépassement, écart, couple ou courant maximal, énergie consommée), plus les grandeurs internes utiles au diagnostic (courant pour repérer une saturation, puissances pour un bilan).</li>
      <li><span class="step">Scénario.</span> Conditions initiales et entrées de l'essai à reproduire : échelon de consigne, charge appliquée à un instant donné, cycle complet.</li>
      <li><span class="step">Durée.</span> Elle doit couvrir tout le phénomène : jusqu'à l'événement attendu (fin de course), ou plusieurs fois la plus grande constante de temps (5τ pour qu'un premier ordre soit à 1 % de sa valeur finale), plusieurs cycles pour un mouvement périodique. Trop courte, elle manque le régime établi ; trop longue, elle gaspille du calcul.</li>
      <li><span class="step">Solveur.</span> À pas fixe : \(h \leq \tau_{\min}/10\), vérifié en divisant par 2. À pas variable (logiciels de simulation) : régler la tolérance et le pas maximal, sans quoi un événement bref peut passer inaperçu.</li>
      <li><span class="step">Événements.</span> Un seuil franchi entre deux pas se date par interpolation linéaire entre les deux derniers états.</li>
    </ol>
  </div>
  <h3>Influence d'un paramètre</h3>
  <p>On fait varier un paramètre, les autres restant fixés, et on trace la performance en fonction de ce paramètre : c'est un <strong>balayage</strong>. Pour comparer les paramètres entre eux, on calcule la variation relative de la performance pour une même variation relative de chacun. Pour la barrière, une hausse de 10 % de l'inertie \(J\) allonge l'ouverture de 1,4 %, une hausse de 10 % du déséquilibre \(C_0\) de 3,8 %, et une hausse de 10 % du couple de démarrage \(C_d\) la raccourcit de 4,4 % : le réglage du contrepoids et le choix du moteur comptent bien plus que l'inertie.</p>

  <div class="method-box">
    <strong>Exemple — déséquilibre maximal admissible.</strong> Exigence : ouverture en 2,5 s au plus.
    <ol style="margin-top:.4rem">
      <li><span class="step">Fonction.</span> \(g(C_0) = t_o(C_0) - 2{,}5\), où chaque valeur de \(t_o\) demande une simulation complète.</li>
      <li><span class="step">Encadrement.</span> \(g(30) \lt 0\) et \(g(70) \gt 0\), et \(g\) est croissante d'après le balayage.</li>
      <li><span class="step">Dichotomie</span> : 9 itérations pour une précision de 0,1 N·m (\(\log_2(40/0{,}1) \approx 8{,}6\)), soit 10 simulations en comptant le calcul initial de \(g(30)\) ; résultat \(C_0 \leq 43{,}7\ \text{N·m}\). La dichotomie ne demande que le signe de \(g\) ; Newton exigerait une dérivée, elle-même estimée par deux simulations voisines.</li>
    </ol>
  </div>
<pre class="codeblock"><code><span class="kw">def</span> duree_ouverture(C0, h, tmax=20.0):
    <span class="str">"""Instant où theta atteint pi/2 (None si jamais)."""</span>
    t, X = 0.0, X0
    <span class="kw">while</span> t &lt; tmax:
        Xs = X + h*F(t, X, C0)        <span class="cmt"># un pas d'Euler</span>
        <span class="kw">if</span> Xs[0] &gt;= pi/2:             <span class="cmt"># seuil franchi :</span>
            r = (pi/2 - X[0])/(Xs[0] - X[0])
            <span class="kw">return</span> t + r*h            <span class="cmt"># interpolation</span>
        t, X = t + h, Xs
    <span class="kw">return</span> <span class="kw">None</span>

C0s = [2.5*k <span class="kw">for</span> k <span class="kw">in</span> range(29)]      <span class="cmt"># 0 à 70 N·m</span>
durees = [duree_ouverture(C0, 0.001) <span class="kw">for</span> C0 <span class="kw">in</span> C0s]

<span class="kw">def</span> ecart(C0, tmax):
    <span class="kw">return</span> duree_ouverture(C0, 0.001) - tmax

C0_max = dichotomie(ecart, 30.0, 70.0, 0.1, 2.5)</code></pre>
</div>

<div class="course-section">
  <div class="sec-num">§8 · INTÉGRER ET DÉRIVER DES MESURES</div>
  <h2>Exploiter un signal échantillonné</h2>
  <div class="intro">Une mesure se présente comme une suite de valeurs \(y_k = y(t_k)\), le plus souvent à pas constant \(h\). En <strong>post-traitement</strong>, après l'essai, tout le fichier est connu ; en <strong>temps réel</strong>, seules les valeurs passées le sont (version récursive dans « Systèmes numériques » §6 et §7).</div>
  <div class="prop-box">
    <strong>Dérivation numérique.</strong>
    <div class="formula" data-nom="Dérivée par différence arrière">$$y'(t_k) \approx \frac{y_k - y_{k-1}}{h}$$</div>
    <div class="formula" data-nom="Dérivée par différence avant">$$y'(t_k) \approx \frac{y_{k+1} - y_k}{h}$$</div>
    La différence arrière n'utilise que le passé : elle seule est utilisable en temps réel. Chacune est en fait une bonne estimation de la dérivée au milieu de son intervalle, en \(t_k - h/2\) ou en \(t_k + h/2\) ; leur moyenne, la différence centrée \((y_{k+1} - y_{k-1})/(2h)\), est plus précise en \(t_k\) (post-traitement seulement).
  </div>
  <div class="prop-box">
    <strong>Intégration numérique</strong> de \(I = \int_{t_0}^{t_n} y(t)\,\mathrm{d}t\), avec \(t_n = t_0 + n\,h\) :
    <div class="formula" data-nom="Méthode des rectangles à gauche">$$I \approx h\sum_{k=0}^{n-1} y_k$$</div>
    <div class="formula" data-nom="Méthode des rectangles à droite">$$I \approx h\sum_{k=1}^{n} y_k$$</div>
    <div class="formula" data-nom="Méthode des trapèzes">$$I \approx h\left(\frac{y_0 + y_n}{2} + \sum_{k=1}^{n-1} y_k\right)$$</div>
    Les rectangles à gauche reviennent à intégrer \(\dot I = y\) par Euler explicite (schéma avant), les rectangles à droite par le schéma arrière ; les trapèzes, moyenne des deux, sont plus précis.
  </div>
  <div class="method-box">
    <strong>Exemple — énergie consommée par un vélo à assistance électrique.</strong> Pendant une minute de montée, la puissance fournie par la batterie est relevée toutes les 10 s :
    <table>
      <tr><th>\(t\) (s)</th><td>0</td><td>10</td><td>20</td><td>30</td><td>40</td><td>50</td><td>60</td></tr>
      <tr><th>\(P\) (W)</th><td>120</td><td>210</td><td>250</td><td>245</td><td>260</td><td>235</td><td>140</td></tr>
    </table>
    Trapèzes (la somme des valeurs intermédiaires vaut 1 200 W) :
    <div class="formula">$$E \approx 10 \times \left(\frac{120 + 140}{2} + 1\,200\right) = 13\,300\ \text{J} \approx 3{,}7\ \text{W·h}$$</div>
    Rectangles à gauche : 13 200 J ; à droite : 13 400 J. Avec une batterie de 500 W·h, cette minute de côte consomme 0,7 % de la capacité : de quoi estimer une autonomie sur un parcours.
  </div>
  <div class="method-box">
    <strong>Exemple — vitesse de la lisse tirée d'un codeur.</strong> Un codeur de 4 096 points par tour, monté sur l'axe de la lisse, est lu toutes les 50 ms. On relève \(N = 362\), 387 et 413 points à \(t = 0{,}95\ \text{s}\), 1,00 s et 1,05 s (\(\theta = 2\pi N/4\,096\)).
    <ol style="margin-top:.4rem">
      <li><span class="step">Arrière</span> (\(387 - 362 = 25\) points) :
        <div class="formula">$$\omega(1{,}00) \approx \frac{25 \times 2\pi/4\,096}{0{,}05} = 0{,}767\ \text{rad/s}$$</div></li>
      <li><span class="step">Avant</span> (\(413 - 387 = 26\) points) : \(\omega(1{,}00) \approx 0{,}798\ \text{rad/s}\), pour une valeur exacte (simulée) de 0,787 rad/s.</li>
      <li><span class="step">Résolution.</span> La vitesse estimée varie par paliers de \((2\pi/4\,096)/0{,}05 = 0{,}031\ \text{rad/s}\) ; lue toutes les millisecondes, elle varierait par paliers de 1,5 rad/s, deux fois la vitesse elle-même : la dérivée serait inutilisable.</li>
    </ol>
  </div>
  <div class="notice">
    <strong>Dériver amplifie le bruit, intégrer accumule les erreurs lentes</strong> : un bruit d'amplitude \(\delta\) sur chaque mesure peut fausser une dérivée de \(2\delta/h\), d'autant plus que le pas est petit (remèdes : filtrer d'abord, par exemple par une moyenne glissante, ou dériver sur plusieurs pas). À l'inverse, un petit décalage de zéro \(b\) sur la grandeur intégrée produit une dérive \(b\,(t - t_0)\) : la vitesse obtenue en intégrant un accéléromètre dérive avec le temps.
  </div>
  <p>Un fichier de mesures se lit avec les fonctions de fichiers de l'informatique commune (<code>open</code>, <code>readlines</code>, <code>split</code>) ; les fonctions ci-dessous admettent un pas non constant.</p>
<pre class="codeblock"><code><span class="kw">def</span> lire_mesures(nom):
    <span class="str">"""Fichier texte « t;y », une ligne d'en-tête."""</span>
    fichier = open(nom, <span class="str">'r'</span>)
    lignes = fichier.readlines()
    fichier.close()
    t, y = [], []
    <span class="kw">for</span> ligne <span class="kw">in</span> lignes[1:]:          <span class="cmt"># sans l'en-tête</span>
        champs = ligne.split(<span class="str">';'</span>)
        t.append(float(champs[0]))
        y.append(float(champs[1]))
    <span class="kw">return</span> t, y

<span class="kw">def</span> trapezes(t, y):
    <span class="str">"""Intégrale de y(t) par la méthode des trapèzes."""</span>
    S = 0.0
    <span class="kw">for</span> k <span class="kw">in</span> range(1, len(t)):
        S = S + (t[k] - t[k-1])*(y[k] + y[k-1])/2
    <span class="kw">return</span> S

<span class="kw">def</span> derivee_arriere(t, y):
    <span class="str">"""Estimations de y' aux instants t[1], t[2]…"""</span>
    n = len(t)
    <span class="kw">return</span> [(y[k] - y[k-1])/(t[k] - t[k-1])
            <span class="kw">for</span> k <span class="kw">in</span> range(1, n)]</code></pre>
</div>

<div class="course-section">
  <div class="sec-num">§9 · VALIDER LES RÉSULTATS</div>
  <h2>Un résultat numérique se vérifie toujours</h2>
  <div class="intro">Un programme renvoie des nombres même quand le modèle est faux, que les unités sont mélangées ou que le pas est trop grand. Avant d'exploiter un résultat, on le confronte à des ordres de grandeur, à des cas connus, à des lois indépendantes et, quand c'est possible, à l'expérience.</div>
  <div class="method-box">
    <strong>Méthode — valider un résultat numérique.</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Homogénéité et ordre de grandeur.</span> Unités cohérentes (mm et m mélangés dans un PFS faussent les moments d'un facteur 1 000), signes plausibles, estimation à la main. Barrière : vitesse moyenne d'environ 0,8 rad/s, donc \(t_o \approx (\pi/2)/0{,}8 \approx 2\ \text{s}\).</li>
      <li><span class="step">Cas limite à solution connue.</span> Sans déséquilibre (\(C_0 = 0\)), l'équation de la lisse est linéaire : \(\omega = \omega_0\big(1 - e^{-t/\tau}\big)\) et \(\theta = \omega_0\big[t - \tau\big(1 - e^{-t/\tau}\big)\big]\), d'où \(t_o \approx \pi/(2\omega_0) + \tau = 1{,}534\ \text{s}\) ; la simulation (\(h = 1\ \text{ms}\)) donne 1,533 8 s.</li>
      <li><span class="step">Relation indépendante.</span> Pour un mécanisme parfait en équilibre, la puissance motrice égale la puissance résistante : \(C_m = C_r\,\mathrm{d}\varphi/\mathrm{d}\theta = 8 \times 0{,}522 = 4{,}18\ \text{N·m}\), ce que donne bien le système linéaire du §5. La loi entrée-sortie de l'essuie-glace admet aussi une expression analytique (de la forme \(a\cos\varphi + b\sin\varphi = c\)) : elle confirme le résultat de Newton à \(10^{-15}\) près.</li>
      <li><span class="step">Convergence numérique.</span> Le résultat ne doit plus bouger quand on divise le pas ou la tolérance par 2 (§6).</li>
      <li><span class="step">Expérience.</span> Simuler exactement l'essai réalisé (mêmes entrées, même charge) et chiffrer l'écart relatif sur les critères du cahier des charges.</li>
    </ol>
  </div>
  <div class="formula" data-nom="Écart relatif simulation-mesure">$$\varepsilon_r = \frac{x_{\text{sim}} - x_{\text{mes}}}{x_{\text{mes}}}$$</div>
  <div class="method-box">
    <strong>Exemple — écart entre simulation et essai.</strong> Sur la barrière installée, on mesure \(t_o = 2{,}30\ \text{s}\), contre 2,06 s simulées : \(\varepsilon_r \approx -10\ \%\).
    <ol style="margin-top:.4rem">
      <li><span class="step">Erreur numérique ?</span> Non : avec \(h = 0{,}01\ \text{s}\), elle est inférieure à 0,2 %.</li>
      <li><span class="step">Causes de modèle possibles.</span> Frottement sec dans l'articulation, couple moteur plus faible que prévu (tension d'alimentation, échauffement), contrepoids mal réglé, rampe de démarrage imposée par le variateur.</li>
      <li><span class="step">Recalage.</span> D'après le balayage du §7, \(t_o = 2{,}30\ \text{s}\) correspond à \(C_0 \approx 38\ \text{N·m}\) : on vérifie le contrepoids, puis on valide le modèle recalé sur un autre essai (fermeture, autre charge) que celui qui a servi au recalage.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Erreur numérique et erreur de modèle.</strong> L'écart entre simulation et mesure cumule l'erreur de la méthode (pas, tolérance, arrondis), que l'on rend négligeable en premier par l'essai de convergence, et l'erreur de modèle (hypothèses, valeurs des paramètres). Seule la seconde justifie d'enrichir le modèle ou de recaler ses paramètres (« Modélisation multiphysique » §7).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Stabilité, convergence et conditionnement</h2>
  <div class="intro">Le programme précise que les aspects théoriques des méthodes numériques ne sont pas exigibles. Ils expliquent pourtant les observations du chapitre ; en voici l'essentiel, à titre de culture.</div>
  <ul>
    <li><strong>Stabilité d'Euler explicite.</strong> Pour \(\dot x = -x/\tau\), le schéma donne \(x_{k+1} = (1 - h/\tau)\,x_k\) : une suite géométrique qui tend vers 0 si et seulement si \(|1 - h/\tau| \lt 1\), soit \(h \lt 2\tau\), et qui change de signe à chaque pas dès que \(h \gt \tau\). Pour la barrière (\(\tau = 0{,}225\ \text{s}\)) : oscillation à \(h = 0{,}4\ \text{s}\) (raison −0,78), divergence à 0,5 s (raison −1,22). Pour \(\dot X = A\,X\), la condition porte sur chaque valeur propre \(\lambda\) de \(A\) : \(|1 + h\lambda| \lt 1\). Moteur du §2 : \(\lambda \approx -26\ \text{s}^{-1}\) et \(-974\ \text{s}^{-1}\), d'où \(h \lt 2{,}05\ \text{ms}\). Un oscillateur sans amortissement n'est jamais stable par Euler explicite : son amplitude grandit à chaque pas. Le schéma d'Euler implicite, \(X_{k+1} = X_k + h\,F(t_{k+1}, X_{k+1})\), reste stable pour tout pas sur ces exemples, au prix d'une équation à résoudre à chaque pas.</li>
    <li><strong>Ordre d'une méthode.</strong> L'erreur d'Euler à instant fixé est proportionnelle à \(h\) (ordre 1), celle des trapèzes à \(h^2\), celle de la méthode de Runge-Kutta d'ordre 4 à \(h^4\). Les solveurs des bibliothèques (par exemple <code>scipy.integrate.solve_ivp</code>) utilisent des méthodes d'ordre élevé à pas variable, réglé par une tolérance.</li>
    <li><strong>Vitesse de convergence.</strong> La dichotomie divise l'erreur par 2 à chaque itération (convergence linéaire). Près d'une solution simple, Newton vérifie \(e_{n+1} \approx \dfrac{f''}{2f'}\,e_n^2\) (convergence quadratique), d'où le doublement du nombre de chiffres exacts ; elle n'est que linéaire pour une solution double.</li>
    <li><strong>Conditionnement.</strong> Le nombre \(\mathrm{cond}(A) = \|A\|\,\|A^{-1}\|\) mesure l'amplification des erreurs relatives des données dans la solution de \(A\,X = B\). Pour l'essuie-glace à θ = 90°, il vaut environ 80 (système bien conditionné) ; il tend vers l'infini quand la bielle et le balancier s'alignent, en même temps que les efforts. La difficulté numérique traduit alors une réalité physique : un angle de transmission trop faible.</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="rnum-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · RÉSOLUTION NUMÉRIQUE</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Décomposer un problème d'ingénierie numérique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Question.</span> Repérer la performance demandée par le cahier des charges (couple maximal, durée, énergie, effort) et la grandeur qui la porte.</li>
      <li><span class="step">Relations.</span> Lister les inconnues intermédiaires et les lois qui les relient : géométrie (fermeture), efforts (PFS), mouvement (PFD, TEC), énergie.</li>
      <li><span class="step">Classer.</span> Chaque relation est une équation \(f(x) = 0\), un système \(A\,X = B\), un problème de Cauchy ou un traitement de signal échantillonné : en déduire la méthode (dichotomie ou Newton, bibliothèque, Euler, différences et trapèzes).</li>
      <li><span class="step">Enchaîner</span> du géométrique au dynamique, en testant chaque brique sur un cas dont on connaît la réponse.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Mettre un modèle sous forme de Cauchy</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Ordres.</span> Relever l'ordre de chaque équation différentielle ; le vecteur d'état contient chaque inconnue et ses dérivées jusqu'à l'ordre moins un (positions et vitesses, courants dans les inductances).</li>
      <li><span class="step">Isoler</span> les dérivées les plus hautes ; si plusieurs apparaissent dans une même équation, résoudre ce petit système linéaire.</li>
      <li><span class="step">Écrire</span> \(F(t, X)\) et \(X_0\) ; vérifier que \(F\) n'utilise que \(t\), \(X\) et des entrées connues, et que chaque composante a l'unité de la dérivée correspondante.</li>
      <li><span class="step">Cas linéaire</span> : identifier \(A\) et \(B\) dans \(\dot X = A\,X + B\,u\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Résoudre une équation f(x) = 0</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Écrire</span> \(f\) avec une seule inconnue et des unités claires (elles fixent le sens d'un critère sur le résidu).</li>
      <li><span class="step">Localiser</span> la solution voulue (tableau de valeurs, tracé, sens physique : mode d'assemblage, branche de mouvement) dans un intervalle où \(f\) change de signe.</li>
      <li><span class="step">Choisir.</span> Dichotomie si \(f\) n'est connue que par ses valeurs ou si un temps de calcul garanti est exigé ; Newton si \(f'\) est disponible (ou approchée) et le départ proche ; pour suivre une solution qui varie, partir de la précédente.</li>
      <li><span class="step">Arrêter</span> sur la précision utile de \(x\), avec un nombre maximal d'itérations qui signale l'échec ; contrôler le résidu \(f(x)\) à la fin.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Résoudre un problème de statique sous la forme A·X = B</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Inconnues.</span> Graphe des liaisons, isolements ; ranger les composantes inconnues (et l'effort moteur) dans \(X\), dans un ordre fixé.</li>
      <li><span class="step">Équations.</span> Trois par solide dans un problème plan ; inconnues à gauche, données à droite ; unités SI partout.</li>
      <li><span class="step">Remplir</span> \(A\) ligne par ligne (une ligne par équation, une colonne par inconnue) et \(B\) ; résoudre avec <code>numpy.linalg.solve</code>.</li>
      <li><span class="step">Contrôler</span> : une matrice singulière signale un hyperstatisme, une inconnue motrice oubliée ou une position singulière ; vérifier le résultat par une relation indépendante (bilan de puissance, solide soumis à deux forces).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Écrire et régler une simulation par Euler explicite</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Pas.</span> Estimer les constantes de temps (au besoin en linéarisant) et prendre \(h \leq \tau_{\min}/10\).</li>
      <li><span class="step">Durée.</span> Jusqu'à l'événement attendu (avec une durée maximale de sécurité), ou plusieurs fois \(\tau_{\max}\).</li>
      <li><span class="step">Boucle</span> sur un nombre entier de pas : \(X_{k+1} = X_k + h\,F(t_k, X_k)\), toutes les composantes calculées avec les valeurs de l'instant \(t_k\) ; jamais de test d'égalité sur le temps.</li>
      <li><span class="step">Convergence.</span> Recommencer avec \(h/2\) : les grandeurs observées ne doivent plus changer à la précision voulue.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Étudier l'influence d'un paramètre</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Choisir</span> la performance (critère du cahier des charges) et une plage réaliste du paramètre, les autres restant fixés.</li>
      <li><span class="step">Balayer</span> : une simulation par valeur, tracer la performance ; repérer la zone admissible.</li>
      <li><span class="step">Comparer</span> les paramètres par leur sensibilité relative (variation relative de la performance pour +10 % sur le paramètre).</li>
      <li><span class="step">Dimensionner</span> : la valeur limite s'obtient par dichotomie sur la fonction « performance simulée moins exigence ».</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Dériver et intégrer une mesure échantillonnée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Dériver</span> par différence arrière en temps réel, avant ou centrée en post-traitement ; une différence estime la dérivée au milieu de son intervalle.</li>
      <li><span class="step">Bruit.</span> Une erreur \(\delta\) sur chaque mesure donne jusqu'à \(2\delta/h\) sur la dérivée : ne pas prendre \(h\) trop petit, filtrer ou dériver sur plusieurs pas.</li>
      <li><span class="step">Intégrer</span> par la méthode des trapèzes (rectangles : plus grossier) ; soigner les unités (1 W·h = 3 600 J).</li>
      <li><span class="step">Vérifier</span> les ordres de grandeur et, si possible, un bilan (énergie potentielle gagnée, distance parcourue).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Valider un résultat numérique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Homogénéité</span> et ordre de grandeur estimé à la main.</li>
      <li><span class="step">Cas limite</span> à solution analytique, retrouvé par le programme.</li>
      <li><span class="step">Relation indépendante</span> : bilan de puissance ou d'énergie, autre méthode de calcul.</li>
      <li><span class="step">Convergence</span> (pas, tolérance), puis <span class="step">comparaison à l'expérience</span> : écart relatif, causes de modèle, recalage validé sur un autre essai.</li>
    </ol>
  </div>
</div>
