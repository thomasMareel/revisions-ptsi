<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 4.1.2 du programme de PTSI, « Évolution temporelle d'un système chimique », et les capacités expérimentales associées (suivi cinétique, simplification de la loi de vitesse, énergie d'activation). Il prolonge <a href="#equilchim/cours">« Équilibres chimiques »</a>, qui dit <em>jusqu'où</em> évolue un système (avancement \(\xi\), état final) : la cinétique dit <em>à quelle vitesse</em>. Les mesures s'exploitent avec les outils de <a href="#incertitudes/cours">« Mesures et incertitudes »</a> (régression, validation d'un modèle) et de <a href="#pynum/cours">« Méthodes numériques »</a> (dérivée approchée). En 2ᵉ année, la loi d'Arrhenius sert dans <a href="#thermochimie/cours">« Thermodynamique de la transformation chimique »</a> (réacteur adiabatique, §6) et la vitesse de réaction devient un courant dans <a href="#electrochimie/cours">« Électrochimie »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Vitesses</strong> : vitesses de consommation d'un réactif et de formation d'un produit ; vitesse de réaction pour une transformation modélisée par une réaction unique sans accumulation d'intermédiaires, en réacteur fermé de composition uniforme ; relier ces vitesses (§1).</li>
        <li><strong>Vitesse à une date</strong> : déterminer la vitesse de réaction à différentes dates par une méthode graphique ou numérique (§2, §12).</li>
        <li><strong>Facteurs cinétiques</strong> : mettre en évidence l'influence de la concentration et de la température (§3).</li>
        <li><strong>Lois de vitesse</strong> : réactions sans ordre, réactions avec ordre simple (0, 1, 2), ordre global, ordre apparent ; exprimer la loi de vitesse et déterminer la constante cinétique à une température donnée (§4, §5, §6).</li>
        <li><strong>Temps de demi-vie d'un réactif, temps de demi-réaction</strong> ; déterminer un ordre à l'aide des temps de demi-réaction (§7).</li>
        <li><strong>Simplifier la loi de vitesse</strong> : dégénérescence de l'ordre, conditions initiales stœchiométriques ; proposer des conditions expérimentales qui la permettent (§6, §8).</li>
        <li><strong>Suivi cinétique</strong> : établir une loi de vitesse à partir du suivi temporel d'une grandeur physique (absorbance, pression, conductivité) (§9).</li>
        <li><strong>Déterminer un ordre</strong> par la méthode différentielle ; le confirmer par la méthode intégrale, en se limitant à une décomposition d'ordre 0, 1 ou 2 d'un unique réactif, ou à un cas qui s'y ramène (§10).</li>
        <li><strong>Loi d'Arrhenius</strong> ; déterminer une énergie d'activation à partir de valeurs de la constante cinétique à différentes températures (§11).</li>
        <li><strong>Exploiter des mesures par un programme</strong> : vitesses par dérivée approchée, régressions linéaires, validation du modèle (§12).</li>
      </ul>
      <p>Hors programme en PTSI (et en PT) : les mécanismes réactionnels (actes élémentaires, molécularité, étape cinétiquement déterminante, approximation des états quasi stationnaires), l'étude de la catalyse au-delà de la notion vue au lycée, l'intégration d'une loi d'ordre quelconque. Ces notions sont regroupées en fin de chapitre.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · VITESSES EN RÉACTEUR FERMÉ</div>
  <h2>Vitesse de consommation, de formation, et vitesse de réaction</h2>
  <div class="intro">Une réaction peut être possible et pourtant imperceptible (le diamant devrait se transformer en graphite, la combustion du sucre dans l'air ne démarre pas seule) ou au contraire explosive. Pour comparer les transformations, prévoir la durée d'une synthèse ou dimensionner un réacteur, il faut une grandeur qui mesure la rapidité de l'évolution : la vitesse. On se place dans le cadre du programme : un <strong>réacteur fermé</strong> (pas d'échange de matière), <strong>parfaitement agité</strong> (composition uniforme), de <strong>volume constant</strong>.</div>
  <div class="def-box">
    <strong>Vitesses de consommation et de formation.</strong> Dans un réacteur de volume \(V\) constant, la <strong>vitesse volumique de consommation</strong> d'un réactif A et la <strong>vitesse volumique de formation</strong> d'un produit P sont
    <div class="formula" data-nom="Vitesses de consommation et de formation">$$v_{\text{cons}}(\mathrm A) = -\frac{\mathrm d[\mathrm A]}{\mathrm dt} \qquad v_{\text{form}}(\mathrm P) = \frac{\mathrm d[\mathrm P]}{\mathrm dt}$$</div>
    Elles s'expriment en mol·L⁻¹·s⁻¹ (ou par minute, par heure) et sont positives quand A disparaît et que P apparaît.
  </div>
  <p>Ces vitesses dépendent de l'espèce choisie : quand la réaction 2 N₂O₅(g) = 4 NO₂(g) + O₂(g) avance, il apparaît deux fois plus de NO₂ qu'il ne disparaît de N₂O₅. Pour une grandeur propre à la réaction, on utilise l'avancement. Comme dans <a href="#equilchim/cours">« Équilibres chimiques »</a> (§4), on écrit l'équation \(0 = \sum_i \nu_i \mathrm A_i\) avec des coefficients stœchiométriques algébriques \(\nu_i\) (négatifs pour les réactifs) : \(n_i = n_{i,0} + \nu_i\,\xi\). À volume constant, on divise par \(V\) : \([\mathrm A_i] = [\mathrm A_i]_0 + \nu_i\,x\), où \(x = \xi/V\) est l'<strong>avancement volumique</strong>.</p>
  <div class="def-box">
    <strong>Vitesse de réaction.</strong> Pour une transformation modélisée par une <strong>réaction unique</strong>, sans accumulation d'intermédiaires, la vitesse (volumique) de réaction est
    <div class="formula" data-nom="Vitesse de réaction">$$v = \frac{1}{V}\frac{\mathrm d\xi}{\mathrm dt} = \frac{\mathrm dx}{\mathrm dt} = \frac{1}{\nu_i}\frac{\mathrm d[\mathrm A_i]}{\mathrm dt}$$</div>
    Elle est la même quelle que soit l'espèce \(\mathrm A_i\) utilisée : \(v = v_{\text{cons}}(\mathrm A)/|\nu_{\mathrm A}| = v_{\text{form}}(\mathrm P)/\nu_{\mathrm P}\). Elle est positive quand la réaction avance dans le sens direct, et s'exprime en mol·L⁻¹·s⁻¹.
  </div>
  <p>Les deux hypothèses de la définition comptent. Si la transformation fait intervenir <strong>plusieurs réactions</strong>, un seul avancement ne suffit plus. Si des <strong>intermédiaires s'accumulent</strong> (une espèce formée puis consommée en quantité notable), les variations des concentrations ne sont plus proportionnelles entre elles : la vitesse « de réaction » n'est plus définie, seules le sont les vitesses de consommation et de formation de chaque espèce.</p>
  <div class="method-box"><strong>Exemple — la décomposition du pentaoxyde de diazote</strong>
    <p>Dans un réacteur de 2,00 L, à une date donnée, la concentration de N₂O₅ diminue de \(3{,}0\times10^{-5}\ \text{mol·L}^{-1}\) par seconde. Équation : 2 N₂O₅(g) = 4 NO₂(g) + O₂(g).</p>
    <ol>
      <li>Vitesse de consommation : \(v_{\text{cons}}(\mathrm{N_2O_5}) = 3{,}0\times10^{-5}\ \text{mol·L}^{-1}\text{·s}^{-1}\).</li>
      <li>Vitesse de réaction : \(\nu = -2\), donc \(v = 3{,}0\times10^{-5}/2 = 1{,}5\times10^{-5}\ \text{mol·L}^{-1}\text{·s}^{-1}\).</li>
      <li>Vitesses de formation : \(v_{\text{form}}(\mathrm{NO_2}) = 4v = 6{,}0\times10^{-5}\) et \(v_{\text{form}}(\mathrm{O_2}) = v = 1{,}5\times10^{-5}\ \text{mol·L}^{-1}\text{·s}^{-1}\).</li>
      <li>L'avancement croît de \(\mathrm d\xi/\mathrm dt = vV = 3{,}0\times10^{-5}\ \text{mol·s}^{-1}\).</li>
      <li>Avec l'équation N₂O₅(g) = 2 NO₂(g) + ½ O₂(g), on trouverait \(v' = 3{,}0\times10^{-5}\ \text{mol·L}^{-1}\text{·s}^{-1} = 2v\) : la vitesse de réaction dépend de l'écriture de l'équation, les vitesses de consommation et de formation non.</li>
    </ol>
  </div>
  <p>La vitesse \(\mathrm d\xi/\mathrm dt\), en mol·s⁻¹, sans division par le volume, est celle qu'on utilise pour une réaction à la surface d'une électrode : elle y est proportionnelle à l'intensité du courant (2ᵉ année, <a href="#electrochimie/cours">« Électrochimie »</a>, §1).</p>
  <div class="notice"><strong>Erreur classique</strong> : oublier le coefficient stœchiométrique, ou son signe. La vitesse de réaction n'est égale à \(-\mathrm d[\mathrm A]/\mathrm dt\) que si A a pour coefficient 1 dans l'équation écrite. Toujours écrire l'équation avant de parler de « la » vitesse, et préciser de quelle vitesse il s'agit.</div>
  <p>Dans la suite du chapitre, les réactions étudiées sont <strong>totales</strong> (ou suivies loin de leur équilibre), ce qu'on souligne souvent en écrivant l'équation avec une flèche : A → produits.</p>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DÉTERMINER UNE VITESSE À UNE DATE</div>
  <h2>Tangente ou différences finies</h2>
  <div class="intro">Une vitesse est une dérivée ; une expérience ne donne que des valeurs mesurées à des dates successives. Le programme demande de savoir passer des unes à l'autre « par une méthode graphique ou numérique ». On le fait ici sur le fil rouge du chapitre : la décoloration du cristal violet, suivie au spectrophotomètre.</div>
  <div class="method-box"><strong>Fil rouge — la décoloration du cristal violet</strong>
    <p>Le cristal violet est un colorant cationique, noté CV⁺. En milieu basique, il réagit avec les ions hydroxyde : CV⁺ + HO⁻ → CVOH, et le produit est incolore. On mélange une solution de CV⁺ (\([\mathrm{CV^+}]_0 = 1{,}00\times10^{-5}\ \text{mol·L}^{-1}\)) et de soude (\([\mathrm{HO^-}]_0 = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\)), et l'on mesure l'absorbance \(A\) à 590 nm, dans une cuve de 1,00 cm. D'après la loi de Beer-Lambert, \(A = \varepsilon\ell\,[\mathrm{CV^+}]\) avec \(\varepsilon\ell = 8{,}70\times10^4\ \text{L·mol}^{-1}\) (seul CV⁺ absorbe à cette longueur d'onde).</p>
    <table>
      <tr><th>\(t\) (min)</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
      <tr><th>\(A\)</th><td>0,870</td><td>0,773</td><td>0,684</td><td>0,604</td><td>0,537</td><td>0,474</td></tr>
      <tr><th>\(t\) (min)</th><td>6</td><td>8</td><td>10</td><td>12</td><td>15</td><td>20</td></tr>
      <tr><th>\(A\)</th><td>0,424</td><td>0,337</td><td>0,261</td><td>0,204</td><td>0,145</td><td>0,080</td></tr>
    </table>
    <p>Incertitude-type sur chaque absorbance : \(u(A) = 0{,}003\). Ces mesures reviennent aux §8, §9, §10 et §12.</p>
  </div>
  <div class="prop-box">
    <strong>Méthode graphique.</strong> La vitesse de consommation de A à la date \(t_1\) est l'<strong>opposé de la pente de la tangente</strong> à la courbe \([\mathrm A](t)\) au point d'abscisse \(t_1\). On trace la tangente, on lit deux points éloignés de cette droite, et l'on calcule la pente. La vitesse de réaction s'en déduit en divisant par \(|\nu_{\mathrm A}|\).
  </div>

  <div class="prop-box">
    <strong>Méthode numérique.</strong> Avec des mesures \(c_k\) aux dates \(t_k\), on approche la dérivée par un taux d'accroissement. La <strong>différence centrée</strong>, qui utilise les deux mesures qui encadrent \(t_k\), est bien plus précise que la différence « avant » :
    <div class="formula" data-nom="Vitesse par différence centrée">$$v_{\text{cons}}(t_k) \approx -\frac{c_{k+1} - c_{k-1}}{t_{k+1} - t_{k-1}}$$</div>
    Elle ne donne rien aux deux extrémités de la série (il manque un voisin). Voir <a href="#pynum/cours">« Méthodes numériques »</a>, §5, pour l'erreur commise et le choix du pas.
  </div>
  <div class="method-box"><strong>Exemple — vitesse de décoloration à t = 0 et à t = 5 min</strong>
    <ol>
      <li>Concentrations : \(c = A/(\varepsilon\ell)\), soit \(10{,}00\times10^{-6}\ \text{mol·L}^{-1}\) à \(t = 0\), \(6{,}172\times10^{-6}\) à 4 min, \(5{,}448\times10^{-6}\) à 5 min, \(4{,}874\times10^{-6}\) à 6 min.</li>
      <li>Graphiquement (figure), la tangente en \(t = 0\) a pour pente \(-1{,}20\times10^{-6}\ \text{mol·L}^{-1}\text{·min}^{-1}\) : \(v(0) = 1{,}20\times10^{-6}\ \text{mol·L}^{-1}\text{·min}^{-1}\), soit \(2{,}0\times10^{-8}\ \text{mol·L}^{-1}\text{·s}^{-1}\) (CV⁺ a pour coefficient 1, donc \(v = v_{\text{cons}}\)).</li>
      <li>Numériquement à \(t = 5\ \text{min}\) : \( v \approx -(4{,}874 - 6{,}172)\times10^{-6}/2 \) \( = 6{,}49\times10^{-7}\ \text{mol·L}^{-1}\text{·min}^{-1} \).</li>
      <li>La différence avant \(-(c_6 - c_5)/1\) donnerait \(5{,}75\times10^{-7}\), soit 13 % de moins que la valeur du modèle (\(6{,}59\times10^{-7}\)), contre 1,4 % pour la différence centrée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dériver des mesures trop rapprochées. Chaque mesure porte une incertitude ; sur un petit intervalle, la variation de concentration devient comparable à cette incertitude, et le taux d'accroissement n'est plus que du bruit. Une vitesse issue de mesures est toujours moins précise que les mesures elles-mêmes : c'est pourquoi on confirme un ordre par la méthode intégrale (§10), qui ne dérive rien.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FACTEURS CINÉTIQUES</div>
  <h2>Concentration et température</h2>
  <div class="intro">Une même réaction peut être lente ou rapide selon les conditions. Le programme demande de dégager expérimentalement deux facteurs cinétiques, les concentrations des réactifs et la température ; ce sont aussi les deux leviers du chimiste pour accélérer une synthèse ou, au contraire, figer un mélange.</div>
  <div class="prop-box">
    <strong>Facteurs cinétiques.</strong>
    <ul>
      <li><strong>Concentrations</strong> : en général, la vitesse augmente avec les concentrations des réactifs (les entités se rencontrent plus souvent). La loi de vitesse (§4) traduit quantitativement cette dépendance.</li>
      <li><strong>Température</strong> : la vitesse augmente presque toujours avec la température, et fortement : souvent d'un facteur 2 à 4 pour 10 °C près de la température ambiante. La loi d'Arrhenius (§11) le quantifie.</li>
    </ul>
    D'autres facteurs, vus au lycée, jouent aussi : la présence d'un <strong>catalyseur</strong> (espèce qui accélère la réaction sans être consommée), l'étendue de la surface de contact pour un solide, le solvant, la lumière.
  </div>

  <div class="method-box"><strong>Exemple — la trempe d'un prélèvement</strong>
    <p>Pour doser un réactif au cours d'une synthèse menée à 60 °C, on prélève 10,0 mL du milieu et on les verse dans 90,0 mL d'eau glacée (0 °C). La loi de vitesse est \(v = k[\mathrm A][\mathrm B]\) et l'énergie d'activation vaut \(E_a = 60{,}0\ \text{kJ·mol}^{-1}\).</p>
    <ol>
      <li>Dilution : chaque concentration est divisée par 10, donc la vitesse par \(10\times10 = 100\).</li>
      <li>Refroidissement : d'après la loi d'Arrhenius (§11),
      <div class="formula">$$\frac{k(0\,°\mathrm C)}{k(60\,°\mathrm C)} = \exp\!\left[-\frac{E_a}{R}\left(\frac{1}{273{,}15} - \frac{1}{333{,}15}\right)\right] = 8{,}6\times10^{-3}$$</div></li>
      <li>Au total, la vitesse est divisée par \(100/(8{,}6\times10^{-3}) \approx 1{,}2\times10^4\) : la réaction est pratiquement arrêtée pendant le dosage. C'est le principe de la <strong>trempe</strong>.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — pourquoi le réfrigérateur conserve les aliments</strong>
    <p>Les dégradations des aliments ont des énergies d'activation de l'ordre de 50 kJ·mol⁻¹. Entre 4 °C et 20 °C :</p>
    <div class="formula">$$\frac{k(20\,°\mathrm C)}{k(4\,°\mathrm C)} = \exp\!\left[\frac{50\,000}{8{,}314}\left(\frac{1}{277{,}15} - \frac{1}{293{,}15}\right)\right] = 3{,}3$$</div>
    <p>Un aliment se conserve environ trois fois plus longtemps au réfrigérateur (pour les réactions chimiques ; la croissance des micro-organismes suit d'autres lois).</p>
  </div>
  <div class="notice"><strong>À ne pas confondre</strong> : un facteur cinétique change la <strong>vitesse</strong> d'évolution, pas l'<strong>état final</strong>. Diluer ou refroidir un mélange qui tend vers un équilibre peut aussi déplacer cet équilibre (c'est une question thermodynamique, traitée dans <a href="#equilchim/cours">« Équilibres chimiques »</a>), mais un catalyseur, lui, ne change pas \(K^\circ\) : il fait seulement atteindre plus vite le même état final.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LOI DE VITESSE ET ORDRE</div>
  <h2>Comment la vitesse dépend des concentrations</h2>
  <div class="intro">Une loi de vitesse est une relation, établie par l'expérience, entre la vitesse de réaction et les concentrations, à température fixée. Quand elle prend une forme simple, en produit de puissances, la réaction admet un ordre : c'est le cas le plus fréquent dans les exercices, mais pas une règle.</div>
  <div class="def-box">
    <strong>Réaction admettant un ordre.</strong> Une réaction entre les réactifs A et B admet un ordre si, à température fixée, sa vitesse s'écrit
    <div class="formula" data-nom="Loi de vitesse avec ordre">$$v = k\,[\mathrm A]^{\alpha}\,[\mathrm B]^{\beta}$$</div>
    \(\alpha\) et \(\beta\) sont les <strong>ordres partiels</strong> par rapport à A et à B, \(n = \alpha + \beta\) l'<strong>ordre global</strong>, et \(k \gt 0\) la <strong>constante de vitesse</strong> (ou constante cinétique), qui ne dépend que de la température (et du solvant). Les ordres sont des nombres réels, le plus souvent entiers ou demi-entiers, positifs ou parfois négatifs ; ils se déterminent <strong>expérimentalement</strong>.
  </div>
  <p>L'unité de \(k\) dépend de l'ordre global : \(v\) s'exprime en mol·L⁻¹·s⁻¹ et les concentrations en mol·L⁻¹, donc \(k\) s'exprime en \((\text{mol·L}^{-1})^{1-n}\text{·s}^{-1}\).</p>
  <table>
    <tr><th>ordre global \(n\)</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
    <tr><th>unité de \(k\)</th><td>mol·L⁻¹·s⁻¹</td><td>s⁻¹</td><td>L·mol⁻¹·s⁻¹</td><td>L²·mol⁻²·s⁻¹</td></tr>
  </table>
  <div class="def-box">
    <strong>Réaction sans ordre.</strong> Une réaction dont la loi de vitesse ne se met pas sous la forme d'un produit de puissances des concentrations n'admet pas d'ordre. Exemple historique (Bodenstein, 1906) : la synthèse du bromure d'hydrogène H₂ + Br₂ = 2 HBr suit
    <div class="formula">$$v = \frac{k\,[\mathrm{H_2}]\,[\mathrm{Br_2}]^{1/2}}{1 + k'\,[\mathrm{HBr}]/[\mathrm{Br_2}]}$$</div>
    Au tout début (\([\mathrm{HBr}] = 0\)), la loi se réduit à \(v = k[\mathrm{H_2}][\mathrm{Br_2}]^{1/2}\) : on dit que la réaction admet un <strong>ordre initial</strong>, 3/2, mais pas d'ordre au cours du temps.
  </div>
  <p>La réaction voisine H₂ + I₂ = 2 HI, de même stœchiométrie, admet au contraire l'ordre 1 par rapport à chaque réactif. La forme de l'équation ne dit donc rien de la loi de vitesse : celle-ci reflète le détail du chemin suivi à l'échelle moléculaire (le mécanisme, hors programme, voir la fin du chapitre).</p>
  <div class="method-box"><strong>Exemple — l'oxydation du monoxyde d'azote</strong>
    <p>La réaction 2 NO(g) + O₂(g) = 2 NO₂(g) suit la loi \(v = k[\mathrm{NO}]^2[\mathrm{O_2}]\).</p>
    <ol>
      <li>Ordres partiels : 2 par rapport à NO, 1 par rapport à O₂ ; ordre global 3 ; \(k\) s'exprime en L²·mol⁻²·s⁻¹.</li>
      <li>Doubler \([\mathrm{NO}]\) seul multiplie \(v\) par \(2^2 = 4\) ; doubler \([\mathrm{O_2}]\) seul la multiplie par 2.</li>
      <li>Diluer le mélange dix fois (toutes les concentrations divisées par 10) divise \(v\) par \(10^3\). C'est pourquoi le monoxyde d'azote rejeté dilué dans l'air (quelques dizaines de µg·m⁻³) ne s'oxyde que lentement par O₂, alors que la même réaction est rapide dans un réacteur industriel concentré.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : lire les ordres sur les coefficients de l'équation. Pour 2 NO + O₂, les ordres coïncident avec les coefficients, mais c'est un constat expérimental, pas une règle : H₂ + Br₂ n'a pas d'ordre, et la décomposition 2 N₂O₅ = 4 NO₂ + O₂ est d'ordre 1, pas 2.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RÉACTIONS D'ORDRE 0 ET D'ORDRE 1</div>
  <h2>Intégrer la loi de vitesse</h2>
  <div class="intro">Connaître la loi de vitesse, c'est connaître une équation différentielle vérifiée par la concentration ; l'intégrer donne la concentration à chaque instant, donc la durée nécessaire pour atteindre un taux de conversion. Dans ce paragraphe et les deux suivants, on étudie la décomposition d'un <strong>unique réactif</strong> A, d'équation A → produits (coefficient 1), de loi \(v = k[\mathrm A]^n\) : alors \(\mathrm d[\mathrm A]/\mathrm dt = -v = -k[\mathrm A]^n\).</div>
  <div class="prop-box">
    <strong>Ordre 0.</strong> \(v = k\) : la vitesse ne dépend pas de la concentration, et \([\mathrm A]\) décroît linéairement jusqu'à l'épuisement du réactif, à la date \([\mathrm A]_0/k\).
    <div class="formula" data-nom="Ordre 0">$$[\mathrm A](t) = [\mathrm A]_0 - k\,t \qquad \text{tant que } t \le [\mathrm A]_0/k$$</div>
  </div>
  <div class="prop-box">
    <strong>Ordre 1.</strong> \(v = k[\mathrm A]\) : la concentration décroît exponentiellement, avec la constante de temps \(1/k\) ; \(\ln[\mathrm A]\) est une fonction affine du temps, de pente \(-k\).
    <div class="formula" data-nom="Ordre 1">$$[\mathrm A](t) = [\mathrm A]_0\,e^{-kt} \qquad \ln\frac{[\mathrm A]}{[\mathrm A]_0} = -k\,t$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Intégrer les lois d'ordre 0 et d'ordre 1</span><div class="content">
    <p><strong>Ordre 0.</strong> \(\mathrm d[\mathrm A]/\mathrm dt = -k\), constante : on intègre entre 0 et \(t\), \([\mathrm A](t) - [\mathrm A]_0 = -kt\). La loi cesse de valoir quand A est épuisé : la concentration ne devient pas négative, la réaction s'arrête.</p>
    <p><strong>Ordre 1.</strong> \(\mathrm d[\mathrm A]/\mathrm dt = -k[\mathrm A]\) est une équation linéaire du premier ordre, de solution \([\mathrm A]_0e^{-kt}\). On peut aussi séparer les variables : \(\mathrm d[\mathrm A]/[\mathrm A] = -k\,\mathrm dt\), puis intégrer entre 0 et \(t\) : \(\ln[\mathrm A] - \ln[\mathrm A]_0 = -kt\).</p>
  </div></div>
  <p>L'ordre 0 apparaît quand la vitesse est limitée par autre chose que la concentration du réactif : une surface de catalyseur saturée, une enzyme qui travaille à plein régime, un réactif apporté à débit constant. L'ordre 1 est celui de toutes les décroissances « sans mémoire », où une fraction fixe du réactif disparaît par unité de temps, comme la désintégration radioactive.</p>
  <div class="method-box"><strong>Exemple — l'élimination de l'alcool, une cinétique d'ordre 0</strong>
    <p>Une fois l'alcool absorbé, le foie l'élimine à vitesse à peu près constante, de l'ordre de 0,15 g·L⁻¹·h⁻¹ (l'enzyme qui l'oxyde est saturée). Un conducteur a une alcoolémie de 0,80 g·L⁻¹.</p>
    <ol>
      <li>En quantité de matière : \(k = 0{,}15/46{,}07 = 3{,}3\times10^{-3}\ \text{mol·L}^{-1}\text{·h}^{-1}\) (\(M = 46{,}07\ \text{g·mol}^{-1}\) pour l'éthanol). On peut raisonner directement en g·L⁻¹.</li>
      <li>Temps pour redescendre à 0,50 g·L⁻¹ (limite légale en France) : \(t = (0{,}80 - 0{,}50)/0{,}15 = 2{,}0\ \text{h}\).</li>
      <li>Élimination complète : \(0{,}80/0{,}15 = 5{,}3\ \text{h}\). Boire de l'eau ou du café ne change pas \(k\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — la décomposition de N₂O₅, une cinétique d'ordre 1</strong>
    <p>N₂O₅(g) = 2 NO₂(g) + ½ O₂(g) est d'ordre 1, avec \(k = 4{,}98\times10^{-4}\ \text{s}^{-1}\) à 45 °C (l'équation est écrite avec le coefficient 1 pour N₂O₅, donc \(v = -\mathrm d[\mathrm{N_2O_5}]/\mathrm dt = k[\mathrm{N_2O_5}]\)).</p>
    <ol>
      <li>Fraction restante au bout d'une heure : \(e^{-4{,}98\times10^{-4}\times3600} = e^{-1{,}79} = 0{,}17\).</li>
      <li>Date à laquelle il ne reste que 1 % : \(t = \ln(100)/k = 9{,}2\times10^3\ \text{s}\), soit 2,6 h.</li>
      <li>Cette durée ne dépend pas de la concentration initiale : à l'ordre 1, seule compte la fraction transformée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prolonger la droite de l'ordre 0 au-delà de l'épuisement, ou écrire \([\mathrm A] = [\mathrm A]_0e^{-kt}\) avec \(k\) en min⁻¹ et \(t\) en secondes. Le produit \(kt\) doit être sans dimension : convertir avant de calculer.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉACTIONS D'ORDRE 2</div>
  <h2>Un réactif, ou deux en proportions stœchiométriques</h2>
  <div class="intro">L'ordre 2 est fréquent pour les réactions en solution entre deux espèces. Le programme limite son intégration à deux situations : la décomposition d'un unique réactif, et la réaction de deux réactifs introduits dans les proportions stœchiométriques, qui s'y ramène.</div>
  <div class="prop-box">
    <strong>Ordre 2 (un réactif).</strong> \(v = k[\mathrm A]^2\) et \(\mathrm d[\mathrm A]/\mathrm dt = -k[\mathrm A]^2\) : c'est l'inverse de la concentration qui est affine du temps, de pente \(+k\).
    <div class="formula" data-nom="Ordre 2">$$\frac{1}{[\mathrm A](t)} = \frac{1}{[\mathrm A]_0} + k\,t \qquad [\mathrm A](t) = \frac{[\mathrm A]_0}{1 + k[\mathrm A]_0\,t}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Séparer les variables</span><div class="content">
    <p>\(\mathrm d[\mathrm A]/[\mathrm A]^2 = -k\,\mathrm dt\). Une primitive de \(1/c^2\) est \(-1/c\), donc \(-1/[\mathrm A] + 1/[\mathrm A]_0 = -kt\), soit \(1/[\mathrm A] = 1/[\mathrm A]_0 + kt\). La concentration tend vers 0 sans jamais s'annuler, et de plus en plus lentement.</p>
  </div></div>
  <div class="prop-box">
    <strong>Deux réactifs en proportions stœchiométriques.</strong> Pour A + B → produits de loi \(v = k[\mathrm A][\mathrm B]\), si \([\mathrm A]_0 = [\mathrm B]_0\), les deux concentrations restent égales (elles diminuent de \(x\) chacune) : \(v = k[\mathrm A]^2\), et la loi intégrée est celle de l'ordre 2 ci-dessus. Plus généralement, pour \(a\,\mathrm A + b\,\mathrm B\), des conditions initiales stœchiométriques \([\mathrm A]_0/a = [\mathrm B]_0/b\) donnent \([\mathrm B] = (b/a)[\mathrm A]\) à chaque instant, et la loi ne dépend plus que de \([\mathrm A]\).
  </div>
  <div class="method-box"><strong>Exemple — la saponification de l'éthanoate d'éthyle</strong>
    <p>CH₃COOC₂H₅ + HO⁻ → CH₃COO⁻ + C₂H₅OH est d'ordre 1 par rapport à chaque réactif, avec \(k = 0{,}11\ \text{L·mol}^{-1}\text{·s}^{-1}\) à 25 °C. On mélange ester et soude à \(1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) chacun.</p>
    <ol>
      <li>Proportions stœchiométriques : \(v = k[\mathrm{HO^-}]^2\) et \(1/[\mathrm{HO^-}] = 1/c_0 + kt\).</li>
      <li>Moitié de la soude consommée : \(1/[\mathrm{HO^-}] = 2/c_0\), soit \(t = 1/(kc_0) = 1/(0{,}11\times1{,}0\times10^{-2}) = 9{,}1\times10^2\ \text{s}\), un quart d'heure.</li>
      <li>90 % consommés : \(1/[\mathrm{HO^-}] = 10/c_0\), donc \(t = 9/(kc_0) = 8{,}2\times10^3\ \text{s}\), soit 2,3 h : neuf fois plus que pour la moitié.</li>
    </ol>
  </div>
  <table>
    <tr><th>ordre</th><th>0</th><th>1</th><th>2</th></tr>
    <tr><th>durée pour 90 % / durée pour 50 %</th><td>1,8</td><td>3,3</td><td>9</td></tr>
  </table>
  <p>Plus l'ordre est élevé, plus la fin de la réaction traîne : la vitesse chute avec la concentration, d'autant plus vite que l'ordre est grand.</p>
  <div class="notice"><strong>Erreur classique : le coefficient 2.</strong> Pour une réaction d'équation 2 A → produits de loi \(v = k[\mathrm A]^2\), la vitesse de consommation de A vaut \(2v\) (§1) : \(\mathrm d[\mathrm A]/\mathrm dt = -2k[\mathrm A]^2\), d'où \(1/[\mathrm A] = 1/[\mathrm A]_0 + 2kt\). Avec \(k = 0{,}050\ \text{L·mol}^{-1}\text{·s}^{-1}\) et \([\mathrm A]_0 = 0{,}20\ \text{mol·L}^{-1}\), la moitié de A disparaît en \(1/(2k[\mathrm A]_0) = 50\ \text{s}\), et non 100 s. Même remarque à l'ordre 0 et à l'ordre 1 : remplacer \(k\) par \(|\nu_{\mathrm A}|\,k\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · TEMPS DE DEMI-RÉACTION</div>
  <h2>Une durée caractéristique qui trahit l'ordre</h2>
  <div class="intro">Une seule durée résume la rapidité d'une réaction : celle qu'il faut pour faire la moitié du chemin. Sa dépendance vis-à-vis de la concentration initiale distingue les ordres, ce qui fait du temps de demi-réaction un outil simple pour déterminer un ordre.</div>
  <div class="def-box">
    <strong>Temps de demi-réaction, temps de demi-vie.</strong> Le <strong>temps de demi-réaction</strong> \(t_{1/2}\) est la durée au bout de laquelle l'avancement atteint la moitié de sa valeur finale : \(\xi(t_{1/2}) = \xi_f/2\) (\(\xi_{\max}/2\) pour une réaction totale). Le <strong>temps de demi-vie</strong> d'un réactif est la durée au bout de laquelle sa concentration a diminué de moitié. Pour le réactif limitant d'une réaction totale, les deux coïncident.
  </div>
  <div class="method-box"><strong>Exemple — demi-réaction et demi-vies ne coïncident pas toujours</strong>
    <p>Réaction totale A + 2 B → P avec \([\mathrm A]_0 = [\mathrm B]_0 = 0{,}10\ \text{mol·L}^{-1}\).</p>
    <ol>
      <li>B est limitant : \(x_{\max} = 0{,}10/2 = 0{,}050\ \text{mol·L}^{-1}\). À la demi-réaction, \(x = 0{,}025\) : \([\mathrm B] = 0{,}050\) (B a perdu la moitié : c'est sa demi-vie) mais \([\mathrm A] = 0{,}075\).</li>
      <li>La concentration de A ne descend jamais sous \(0{,}050\ \text{mol·L}^{-1}\) : A n'a pas de temps de demi-vie.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Temps de demi-réaction pour A → produits.</strong> On pose \([\mathrm A] = [\mathrm A]_0/2\) dans les lois intégrées :
    <div class="formula" data-nom="Temps de demi-réaction">$$\text{ordre 0 : } t_{1/2} = \frac{[\mathrm A]_0}{2k} \qquad \text{ordre 1 : } t_{1/2} = \frac{\ln 2}{k} \qquad \text{ordre 2 : } t_{1/2} = \frac{1}{k[\mathrm A]_0}$$</div>
    Le temps de demi-réaction est proportionnel à \([\mathrm A]_0\) à l'ordre 0, <strong>indépendant de \([\mathrm A]_0\) à l'ordre 1</strong>, inversement proportionnel à \([\mathrm A]_0\) à l'ordre 2. Plus généralement, pour un ordre \(n\), \(t_{1/2}\) est proportionnel à \([\mathrm A]_0^{\,1-n}\).
  </div>

<figcaption>Les trois lois intégrées partent de la même vitesse initiale \(v_0\) (temps en unités de \(\tau = [\mathrm A]_0/v_0\)). Points : dates où la concentration est divisée par 2, 4, 8. À l'ordre 1 (bleu), ces dates sont équidistantes : chaque demi-réaction dure \(\ln 2\,\tau\). À l'ordre 0 (rouge), chaque demi-réaction dure deux fois moins que la précédente et le réactif s'épuise en \(\tau\) ; à l'ordre 2 (vert), deux fois plus (\(\tau\), puis \(2\tau\), puis \(4\tau\)) : la fin traîne.</figcaption>
</figure>
  <p>Le même résultat se lit sur une seule expérience : en partant d'une concentration \(c\), le temps pour arriver à \(c/2\) est un « temps de demi-réaction » avec la concentration initiale \(c\). À l'ordre 1, les demi-réactions successives (de \(c_0\) à \(c_0/2\), puis à \(c_0/4\)…) ont toutes la même durée ; à l'ordre 2, chacune dure deux fois plus que la précédente ; à l'ordre 0, deux fois moins.</p>
  <div class="method-box"><strong>Exemple — trouver l'ordre par deux expériences</strong>
    <p>Pour la décomposition d'un réactif A, on mesure \(t_{1/2} = 400\ \text{s}\) quand \([\mathrm A]_0 = 0{,}10\ \text{mol·L}^{-1}\) et \(t_{1/2} = 800\ \text{s}\) quand \([\mathrm A]_0 = 0{,}050\ \text{mol·L}^{-1}\).</p>
    <ol>
      <li>Diviser \([\mathrm A]_0\) par 2 double \(t_{1/2}\) : \(t_{1/2} \propto [\mathrm A]_0^{-1}\), donc \(1 - n = -1\) et \(n = 2\).</li>
      <li>Formule générale : \( n = 1 - \dfrac{\ln(800/400)}{\ln(0{,}050/0{,}10)} = 2 \).</li>
      <li>Constante : \(k = 1/(t_{1/2}[\mathrm A]_0) = 1/(400\times0{,}10) = 2{,}5\times10^{-2}\ \text{L·mol}^{-1}\text{·s}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : parler de « la » demi-vie d'une réaction d'ordre 2 comme d'une constante. Seul l'ordre 1 a un temps de demi-réaction indépendant de la concentration ; pour les autres ordres, il faut toujours préciser la concentration initiale.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DÉGÉNÉRESCENCE DE L'ORDRE</div>
  <h2>Simplifier la loi de vitesse en choisissant les conditions initiales</h2>
  <div class="intro">Avec deux réactifs, la loi \(v = k[\mathrm A]^\alpha[\mathrm B]^\beta\) fait varier deux concentrations à la fois et ne s'intègre pas simplement. L'expérimentateur choisit alors ses conditions initiales pour que la loi ne dépende plus que d'une concentration : proportions stœchiométriques (§6), ou large excès de tous les réactifs sauf un.</div>
  <div class="prop-box">
    <strong>Dégénérescence de l'ordre.</strong> Si B est introduit en <strong>large excès</strong> devant A (\([\mathrm B]_0 \gg [\mathrm A]_0\)), sa concentration reste pratiquement égale à \([\mathrm B]_0\) pendant toute la réaction, et
    <div class="formula" data-nom="Dégénérescence de l'ordre">$$v = k_{\text{app}}\,[\mathrm A]^{\alpha} \qquad \text{avec} \qquad k_{\text{app}} = k\,[\mathrm B]_0^{\,\beta}$$</div>
    La réaction se comporte comme une décomposition de A d'ordre \(\alpha\), appelé <strong>ordre apparent</strong> (ou pseudo-ordre) ; \(k_{\text{app}}\) est la constante apparente. On mesure \(\alpha\) ; en recommençant avec plusieurs excès \([\mathrm B]_0\), on mesure \(\beta\) par la variation de \(k_{\text{app}}\).
  </div>

<figcaption>Réaction A + B → produits de loi \(v = k[\mathrm A][\mathrm B]\), calcul exact (courbes de couleur) et approximation de pseudo-ordre 1 \([\mathrm A] = [\mathrm A]_0\,e^{-k[\mathrm B]_0 t}\) (trait noir épais). Avec dix fois plus de B que de A (tirets bleus), les deux sont presque confondues (écart de 2 % à la demi-réaction) ; à proportions égales, la loi est celle de l'ordre 2 et l'approximation ne vaut plus rien.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — l'ordre partiel du cristal violet et celui des ions hydroxyde</strong>
    <p>Dans le fil rouge, \([\mathrm{HO^-}]_0 = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) et \([\mathrm{CV^+}]_0 = 1{,}00\times10^{-5}\ \text{mol·L}^{-1}\).</p>
    <ol>
      <li>Les ions hydroxyde sont mille fois plus abondants : leur concentration varie au plus de 0,1 %. La loi \(v = k[\mathrm{CV^+}]^\alpha[\mathrm{HO^-}]^\beta\) dégénère en \(v = k_{\text{app}}[\mathrm{CV^+}]^\alpha\).</li>
      <li>Les mesures donnent \(\alpha = 1\) et \(k_{\text{app}} = 0{,}119\ \text{min}^{-1}\) (§10). Une seconde expérience, avec \([\mathrm{HO^-}]_0 = 2{,}0\times10^{-2}\ \text{mol·L}^{-1}\), donne \(k_{\text{app}} = 0{,}238\ \text{min}^{-1}\).</li>
      <li>Doubler \([\mathrm{HO^-}]_0\) double \(k_{\text{app}}\) : \(\beta = \ln(0{,}238/0{,}119)/\ln 2 = 1{,}00\). D'où \(k = k_{\text{app}}/[\mathrm{HO^-}]_0\) \( = 11{,}9\ \text{L·mol}^{-1}\text{·min}^{-1} = 0{,}20\ \text{L·mol}^{-1}\text{·s}^{-1} \) : la réaction est d'ordre global 2.</li>
    </ol>
  </div>
  <div class="notice"><strong>Quel excès choisir ?</strong> Avec \([\mathrm B]_0 = 10[\mathrm A]_0\), la concentration de B baisse au plus de 10 %, et la courbe exacte s'écarte de l'exponentielle de 2 % à la demi-réaction (figure) : c'est le minimum. Un excès d'un facteur 100 ou plus rend l'approximation indiscernable de la mesure. Le solvant, toujours en très large excès, n'apparaît jamais dans une loi de vitesse mesurée : son ordre partiel est inaccessible.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SUIVRE UNE GRANDEUR PHYSIQUE</div>
  <h2>De la mesure à la concentration</h2>
  <div class="intro">On ne mesure presque jamais une concentration directement : on suit une grandeur physique (absorbance, pression, conductivité, volume de gaz), en continu et sans perturber le milieu. Il faut alors relier cette grandeur à l'avancement : c'est l'objet de la capacité « établir une loi de vitesse à partir du suivi temporel d'une grandeur physique ».</div>
  <div class="prop-box">
    <strong>Grandeur affine en l'avancement.</strong> L'absorbance (loi de Beer-Lambert, \(A = \sum_i \varepsilon_i\ell\,c_i\)), la conductivité (loi de Kohlrausch, \(\sigma = \sum_i \lambda_i c_i\)) et la pression d'un mélange gazeux à \(V\) et \(T\) fixés (\(P = n_{\text{gaz}}RT/V\)) sont des combinaisons linéaires des quantités des espèces, donc des fonctions affines de l'avancement : \(G = G_0 + \gamma\,x\). Pour une réaction totale dont A est le réactif limitant, \(G_\infty\) est atteinte pour \(x = x_{\max}\), et
    <div class="formula" data-nom="Suivi par une grandeur physique">$$\frac{[\mathrm A]}{[\mathrm A]_0} = 1 - \frac{x}{x_{\max}} = \frac{G_\infty - G}{G_\infty - G_0}$$</div>
    On applique ensuite les méthodes du §10 au rapport ainsi obtenu.
  </div>
  <div class="method-box"><strong>Exemple — l'absorbance (fil rouge)</strong>
    <p>Seul CV⁺ absorbe et le produit est incolore : \(G_\infty = 0\) et \([\mathrm{CV^+}]/[\mathrm{CV^+}]_0 = A/A_0\). L'absorbance est directement proportionnelle à la concentration suivie : on peut travailler sur \(A\) sans convertir.</p>
  </div>
  <div class="method-box"><strong>Exemple — la pression d'un gaz qui se décompose</strong>
    <p>Dans un récipient fermé de volume et de température fixés, SO₂Cl₂(g) → SO₂(g) + Cl₂(g). Au départ, SO₂Cl₂ seul, sous \(P_0 = 0{,}500\ \text{bar}\) ; au bout de 60 min, \(P = 0{,}640\ \text{bar}\).</p>
    <ol>
      <li>Quantité totale de gaz : \(n_0 - \xi + \xi + \xi = n_0 + \xi\), donc \(P = P_0(1 + \xi/n_0)\) et \(P_\infty = 2P_0 = 1{,}000\ \text{bar}\).</li>
      <li>\( \dfrac{[\mathrm{SO_2Cl_2}]}{[\mathrm{SO_2Cl_2}]_0} = \dfrac{P_\infty - P}{P_\infty - P_0} = \dfrac{1{,}000 - 0{,}640}{0{,}500} = 0{,}72 \).</li>
      <li>Si la réaction est d'ordre 1 : \(k = -\ln(0{,}72)/60 = 5{,}5\times10^{-3}\ \text{min}^{-1}\). D'autres mesures sont nécessaires pour vérifier l'ordre.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — la conductivité pendant une saponification</strong>
    <p>Ester et soude à \(c_0 = 1{,}0\times10^{-2}\ \text{mol·L}^{-1} = 10\ \text{mol·m}^{-3}\) (exemple du §6). Conductivités molaires ioniques (mS·m²·mol⁻¹) : Na⁺ 5,01 ; HO⁻ 19,8 ; CH₃COO⁻ 4,09.</p>
    <ol>
      <li>Les ions Na⁺ restent ; chaque HO⁻ consommé est remplacé par un CH₃COO⁻, bien moins conducteur :
      <div class="formula">$$\sigma = \lambda_{\mathrm{Na^+}}\,c_0 + \lambda_{\mathrm{HO^-}}\,[\mathrm{HO^-}] + \lambda_{\mathrm{CH_3COO^-}}\,(c_0 - [\mathrm{HO^-}])$$</div>
      fonction affine de \([\mathrm{HO^-}]\).</li>
      <li>\(\sigma_0 = (5{,}01 + 19{,}8)\times10 = 248\ \text{mS·m}^{-1}\) ; \(\sigma_\infty = (5{,}01 + 4{,}09)\times10 = 91\ \text{mS·m}^{-1}\).</li>
      <li>Si l'on mesure \(\sigma = 170\ \text{mS·m}^{-1}\) : \([\mathrm{HO^-}]/c_0 = (170 - 91)/(248 - 91) = 0{,}50\). On est à la demi-réaction, ce qui arrive vers 15 min d'après le §6.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre la grandeur mesurée pour la concentration elle-même. La conductivité ne s'annule pas en fin de réaction et la pression augmente : seul le rapport \((G_\infty - G)/(G_\infty - G_0)\) est égal à \([\mathrm A]/[\mathrm A]_0\). Il faut donc connaître \(G_\infty\), par le calcul ou par une mesure après un temps très long.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · DÉTERMINER UN ORDRE : MÉTHODES DIFFÉRENTIELLE ET INTÉGRALE</div>
  <h2>Deux façons de confronter les mesures à une loi</h2>
  <div class="intro">Les mesures donnent une concentration à différentes dates ; on cherche l'ordre et la constante. La méthode différentielle travaille sur les vitesses et donne l'ordre directement, mais elle dérive des mesures ; la méthode intégrale teste un ordre supposé sur les concentrations elles-mêmes. Le programme demande d'utiliser la première pour déterminer un ordre, la seconde pour le confirmer.</div>
  <div class="prop-box">
    <strong>Méthode différentielle.</strong> Si \(v = k[\mathrm A]^n\), alors \(\ln v = \ln k + n\ln[\mathrm A]\). On calcule les vitesses à plusieurs dates (§2), on trace \(\ln v\) en fonction de \(\ln[\mathrm A]\) : si les points s'alignent, la réaction admet un ordre, égal à la <strong>pente</strong>. Variante, la <strong>méthode des vitesses initiales</strong> : on mesure la vitesse au tout début de plusieurs expériences qui ne diffèrent que par \([\mathrm A]_0\) ; le rapport des vitesses donne l'ordre, \(n = \ln(v_{0,2}/v_{0,1})/\ln([\mathrm A]_{0,2}/[\mathrm A]_{0,1})\). Elle évite les complications dues aux produits formés.
  </div>
  <div class="prop-box">
    <strong>Méthode intégrale.</strong> On suppose un ordre, et l'on trace la grandeur que la loi intégrée rend affine du temps : \([\mathrm A]\) pour l'ordre 0, \(\ln[\mathrm A]\) pour l'ordre 1, \(1/[\mathrm A]\) pour l'ordre 2. Si les points s'alignent (aux incertitudes près), l'ordre est confirmé et la pente donne \(k\) (\(-k\), \(-k\), \(+k\) respectivement) ; sinon, on essaie un autre ordre. Elle se limite aux lois qui s'intègrent simplement : décomposition d'un unique réactif d'ordre 0, 1 ou 2, ou cas qui s'y ramène par dégénérescence ou proportions stœchiométriques.
  </div>

    <ol>
      <li><strong>Méthode différentielle.</strong> Les vitesses par différences centrées vont de \(1{,}07\times10^{-6}\ \text{mol·L}^{-1}\text{·min}^{-1}\) (à 1 min) à \(1{,}8\times10^{-7}\) (à 15 min). Le tracé de \(\ln v\) en fonction de \(\ln[\mathrm{CV^+}]\) est à peu près rectiligne, de pente 1,05 (régression, §12) : l'ordre partiel par rapport à CV⁺ est vraisemblablement 1.</li>
      <li><strong>Méthode intégrale.</strong> Seul \(\ln A\) s'aligne avec \(t\) (figure) ; la droite des moindres carrés a pour pente \(-0{,}1195\ \text{min}^{-1}\) : \(k_{\text{app}} = 0{,}119\ \text{min}^{-1}\). Les écarts normalisés des points à la droite restent compris entre −1,1 et 1,2, de signes mêlés : le modèle d'ordre 1 est validé (critères de <a href="#incertitudes/cours">« Mesures et incertitudes »</a>, §9).</li>
      <li><strong>Contrôle par le temps de demi-réaction.</strong> \(t_{1/2} = \ln 2/k_{\text{app}} = 5{,}8\ \text{min}\) ; on lit bien \(A = A_0/2 = 0{,}435\) entre 5 et 6 min dans le tableau.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — méthode des vitesses initiales</strong>
    <p>Deux expériences ne diffèrent que par la concentration initiale du réactif A : \(v_0 = 2{,}4\times10^{-6}\ \text{mol·L}^{-1}\text{·s}^{-1}\) pour \([\mathrm A]_0 = 0{,}010\ \text{mol·L}^{-1}\) et \(9{,}5\times10^{-6}\) pour \(0{,}020\ \text{mol·L}^{-1}\).</p>
    <p>\(n = \ln(9{,}5/2{,}4)/\ln 2 = 1{,}99\) : ordre 2 par rapport à A, et \(k = v_0/[\mathrm A]_0^2 = 2{,}4\times10^{-2}\ \text{L·mol}^{-1}\text{·s}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure à l'aide du seul coefficient \(R^2\). Pour les mesures du fil rouge, la droite de \(A\) en fonction de \(t\) a un \(R^2\) de 0,90 et celle de \(1/A\) de 0,89, des nombres qui semblent corrects ; pourtant leurs écarts normalisés atteignent 46 et plus de 300, avec des résidus en arche. On valide un ordre par les résidus confrontés aux incertitudes, et l'on fait porter la comparaison sur une durée suffisante (au moins deux ou trois temps de demi-réaction : au tout début, toutes les courbes se ressemblent).</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · LOI D'ARRHENIUS</div>
  <h2>L'influence de la température sur la constante de vitesse</h2>
  <div class="intro">Une constante de vitesse est « constante » à température fixée seulement. Arrhenius a proposé en 1889 une loi empirique qui décrit très bien sa variation avec la température pour la plupart des réactions : elle permet de prévoir une vitesse à une autre température, et de mesurer la « barrière » que la réaction doit franchir.</div>
  <div class="prop-box">
    <strong>Loi d'Arrhenius.</strong> La constante de vitesse varie avec la température absolue \(T\) selon
    <div class="formula" data-nom="Loi d'Arrhenius">$$k(T) = A\,\exp\!\left(-\frac{E_a}{RT}\right) \qquad \ln k = \ln A - \frac{E_a}{R}\,\frac{1}{T}$$</div>
    \(E_a \gt 0\) est l'<strong>énergie d'activation</strong> (en J·mol⁻¹, souvent donnée en kJ·mol⁻¹), \(A\) le <strong>facteur préexponentiel</strong>, de même unité que \(k\), \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\). On les suppose indépendants de \(T\) sur le domaine étudié.
  </div>
  <p>L'énergie d'activation s'interprète comme la hauteur de la barrière d'énergie que les réactifs doivent franchir pour se transformer ; le facteur \(\exp(-E_a/RT)\) mesure la fraction des rencontres assez énergétiques pour y parvenir. Plus \(E_a\) est grande, plus la réaction est lente et sensible à la température. Ordres de grandeur : la plupart des réactions usuelles ont des énergies d'activation de 40 à 200 kJ·mol⁻¹. Près de la température ambiante, \(k\) double en 10 °C pour \(E_a \approx 53\ \text{kJ·mol}^{-1}\) (figure du §3).</p>
  <div class="prop-box">
    <strong>Déterminer \(E_a\).</strong> Avec deux températures, on fait le rapport des deux constantes :
    <div class="formula" data-nom="Arrhenius à deux températures">$$\ln\frac{k(T_2)}{k(T_1)} = \frac{E_a}{R}\left(\frac{1}{T_1} - \frac{1}{T_2}\right)$$</div>
    Avec plusieurs températures, on trace \(\ln k\) en fonction de \(1/T\) : la pente de la droite de régression vaut \(-E_a/R\) et l'ordonnée à l'origine \(\ln A\).
  </div>

      <li>Avec les cinq points (régression de \(\ln k\) en fonction de \(1/T\)) : pente \(-1{,}24\times10^4\ \text{K}\), donc \(E_a = 1{,}24\times10^4\times8{,}314 = 103\ \text{kJ·mol}^{-1}\) ; ordonnée à l'origine 31,4, soit \(A = 4{,}2\times10^{13}\ \text{s}^{-1}\).</li>

    </ol>

<div class="course-section">
  <div class="sec-num">§12 · CAPACITÉ NUMÉRIQUE : EXPLOITER DES MESURES EN PYTHON</div>
  <h2>Vitesses, régressions et validation d'un ordre</h2>
  <div class="intro">Le programme prévoit que les déterminations d'ordre se fassent « à l'aide de logiciels dédiés ou de programmes élaborés en langage de programmation ». Trois courts programmes suffisent pour tout le chapitre : ils reprennent la dérivée approchée de <a href="#pynum/cours">« Méthodes numériques »</a> (§5) et la régression linéaire <code>np.polyfit</code> de <a href="#incertitudes/cours">« Mesures et incertitudes »</a> (§9).</div>
  <p><strong>Premier programme : vitesses et méthode différentielle.</strong> Les vitesses sont calculées par différences centrées aux dates intérieures ; la pente de \(\ln v\) en fonction de \(\ln c\) estime l'ordre.</p>
  <pre class="codeblock"><span class="kw">import</span> numpy as np

<span class="cmt"># Décoloration du cristal violet : absorbance A à 590 nm (cuve 1,00 cm)</span>
t = np.array([0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20])         <span class="cmt"># min</span>
A = np.array([0.870, 0.773, 0.684, 0.604, 0.537, 0.474,
              0.424, 0.337, 0.261, 0.204, 0.145, 0.080])
c = A / 8.70e4                     <span class="cmt"># Beer-Lambert : c = A/(eps*l), mol/L</span>

<span class="cmt"># vitesse de consommation aux dates intérieures (différences centrées)</span>
tm = t[1:-1]
v = -(c[2:] - c[:-2]) / (t[2:] - t[:-2])      <span class="cmt"># mol/L/min</span>
print(np.round(v[:3] * 1e7, 2))    <span class="cmt"># [10.69  9.71  8.45] (unité 1e-7)</span>

<span class="cmt"># méthode différentielle : ln v = ln k + n ln c</span>
n, b = np.polyfit(np.log(c[1:-1]), np.log(v), 1)
print(round(n, 2))                 <span class="cmt"># 1.05 : ordre 1</span></pre>
  <p><strong>Second programme : méthode intégrale et validation.</strong> Pour chaque ordre supposé, on ajuste une droite et l'on calcule les écarts normalisés des points, avec l'incertitude propagée sur la grandeur tracée : \(u(\ln A) = u(A)/A\), \(u(1/A) = u(A)/A^2\) (incertitudes composées, <a href="#incertitudes/cours">« Mesures et incertitudes »</a>, §5).</p>
  <pre class="codeblock"><span class="kw">import</span> numpy as np

t = np.array([0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20])         <span class="cmt"># min</span>
A = np.array([0.870, 0.773, 0.684, 0.604, 0.537, 0.474,
              0.424, 0.337, 0.261, 0.204, 0.145, 0.080])
uA = 0.003                         <span class="cmt"># incertitude-type sur A</span>

<span class="cmt"># méthode intégrale : la grandeur testée doit être affine en t</span>
tests = {0: (A, uA * np.ones(len(A))),       <span class="cmt"># ordre 0 : A</span>
         1: (np.log(A), uA / A),               <span class="cmt"># ordre 1 : ln A</span>
         2: (1 / A, uA / A**2)}                <span class="cmt"># ordre 2 : 1/A</span>
<span class="kw">for</span> ordre, (y, uy) <span class="kw">in</span> tests.items():
    a, b = np.polyfit(t, y, 1)
    z = (y - (a * t + b)) / uy     <span class="cmt"># écarts normalisés</span>
    print(ordre, round(a, 4), round(np.max(np.abs(z)), 1))
<span class="cmt"># 0 -0.0395 45.9</span>
<span class="cmt"># 1 -0.1195 1.2</span>
<span class="cmt"># 2 0.5092 306.8</span></pre>
  <div class="method-box"><strong>Exemple — interpréter les sorties</strong>
    <ol>
      <li>Programme 1 : l'ordre estimé vaut 1,05, compatible avec 1. L'ordonnée à l'origine de cette régression n'est pas exploitée : avec une pente de 1,05 au lieu de 1, elle n'a plus l'unité d'une constante de vitesse.</li>
      <li>Programme 2 : pour l'ordre 1, le plus grand écart normalisé vaut 1,2 (tous sous 2) ; pour les ordres 0 et 2, il dépasse 40 : seul l'ordre 1 est compatible avec les mesures, et \(k_{\text{app}} = 0{,}1195\ \text{min}^{-1}\).</li>
      <li>Incertitude sur \(k_{\text{app}}\) : en simulant des milliers de jeux d'absorbances tirés avec \(u(A) = 0{,}003\) (méthode de Monte-Carlo, <a href="#incertitudes/cours">« Mesures et incertitudes »</a>, §10), on trouve \(u(k_{\text{app}}) = 0{,}001\ \text{min}^{-1}\) : \(k_{\text{app}} = 0{,}119 \pm 0{,}001\ \text{min}^{-1}\).</li>
    </ol>
  </div>
  <p><strong>Troisième programme : énergie d'activation.</strong> La même régression, sur \(\ln k\) en fonction de \(1/T\), donne \(E_a\) et \(A\) (exemple du §11).</p>
  <pre class="codeblock"><span class="kw">import</span> numpy as np

R = 8.314                                          <span class="cmt"># J/(K.mol)</span>
T = np.array([25, 35, 45, 55, 65]) + 273.15        <span class="cmt"># K</span>
k = np.array([3.46e-5, 1.35e-4, 4.98e-4, 1.50e-3, 4.87e-3])   <span class="cmt"># s^-1</span>

<span class="cmt"># loi d'Arrhenius linéarisée : ln k = ln A - (Ea/R) (1/T)</span>
pente, ordo = np.polyfit(1 / T, np.log(k), 1)
Ea = -pente * R
print(round(Ea / 1000, 1), <span class="str">'%.1e'</span> % np.exp(ordo))   <span class="cmt"># 103.2 4.2e+13</span></pre>
  <div class="notice"><strong>Pièges numériques</strong> : (1) convertir les températures en kelvins avant de calculer \(1/T\) ; (2) <code>np.polyfit(x, y, 1)</code> renvoie la pente <em>puis</em> l'ordonnée à l'origine ; (3) ne pas dériver des mesures trop rapprochées ni trop bruitées (le bruit est amplifié, §2) ; (4) un logarithme exige une grandeur positive : retirer les points où la concentration est devenue nulle aux incertitudes près.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · MÉCANISMES RÉACTIONNELS ET CATALYSE</div>
  <h2>Hors programme en PTSI et en PT : d'où viennent les lois de vitesse</h2>
  <div class="notice"><strong>Hors programme en PTSI (pour aller plus loin)</strong> : ni les mécanismes réactionnels ni l'étude de la catalyse ne figurent aux programmes de PTSI et de PT. Cette section éclaire pourtant les résultats admis plus haut : pourquoi les ordres ne se lisent pas sur l'équation, pourquoi la loi d'Arrhenius, pourquoi un catalyseur accélère sans changer l'état final.</div>
  <h3>Actes élémentaires et mécanisme</h3>
  <p>Une équation de réaction est un bilan. À l'échelle moléculaire, la transformation se fait le plus souvent en plusieurs <strong>actes élémentaires</strong>, qui se produisent réellement en une seule rencontre ; leur succession est le <strong>mécanisme</strong>. Le nombre d'entités qui se rencontrent dans un acte élémentaire est sa <strong>molécularité</strong> (1, 2, très rarement 3). Pour un acte élémentaire, et pour lui seul, l'ordre par rapport à chaque réactif est égal à son nombre stœchiométrique (loi de Van 't Hoff) : A + B → C a pour vitesse \(k[\mathrm A][\mathrm B]\). Les espèces formées puis consommées au cours du mécanisme sont des <strong>intermédiaires réactionnels</strong>.</p>
  <h3>Étape cinétiquement déterminante</h3>
  <p>Si un acte est beaucoup plus lent que tous les autres, il impose sa vitesse à l'ensemble : c'est l'<strong>étape cinétiquement déterminante</strong>. Lorsqu'elle est précédée d'un équilibre rapide, la concentration de l'intermédiaire s'exprime par la constante de cet équilibre. Exemple : pour 2 NO + O₂ → 2 NO₂, un mécanisme proposé, NO + O₂ ⇄ NO₃ (rapide, constante \(K\)) puis NO₃ + NO → 2 NO₂ (lent, \(k_2\)) donne \(v = k_2[\mathrm{NO_3}][\mathrm{NO}] = k_2K[\mathrm{NO}]^2[\mathrm{O_2}]\) : l'ordre 3 observé au §4 sans aucune rencontre de trois molécules. Quand les intermédiaires sont très réactifs, on leur applique l'<strong>approximation des états quasi stationnaires</strong> (leur concentration reste faible et quasi constante), ce qui conduit à des lois sans ordre comme celle de H₂ + Br₂.</p>
  <h3>Catalyse et profil énergétique</h3>

<figcaption>Profil énergétique (allure, hors programme) : pour réagir, le système doit franchir une barrière, l'état de transition. Un catalyseur ouvre un autre chemin, en plusieurs étapes passant par des intermédiaires, dont les barrières sont plus basses : la réaction est plus rapide. Réactifs et produits sont les mêmes : l'état d'équilibre, donc \(K^\circ\), n'est pas modifié.</figcaption>
</figure>
  <p>Un catalyseur participe au mécanisme mais est régénéré à la fin : il remplace l'étape difficile par un chemin d'énergie d'activation plus faible. Il accélère la réaction dans les deux sens et fait atteindre plus vite le même état final : il ne modifie pas \(K^\circ\). Exemples : le platine des pots catalytiques, le fer du procédé Haber-Bosch, les enzymes. Dans un réacteur industriel, on choisit la température par un compromis entre la thermodynamique (rendement) et la cinétique (vitesse), puis on accélère avec un catalyseur (2ᵉ année, <a href="#thermochimie/cours">« Thermodynamique de la transformation chimique »</a>, §8).</p>
  <h3>Ordre quelconque</h3>
  <p>Pour \(v = k[\mathrm A]^n\) avec \(n \ne 1\), la séparation des variables donne \([\mathrm A]^{1-n} = [\mathrm A]_0^{1-n} + (n - 1)kt\) et \(t_{1/2} = \dfrac{2^{n-1} - 1}{(n - 1)k[\mathrm A]_0^{\,n-1}}\), qui redonne les cas \(n = 0\) et \(n = 2\). Une loi qui ne s'intègre pas (deux réactifs hors des cas du §8, réaction qui tend vers un équilibre) se résout numériquement, par la méthode d'Euler de <a href="#pynum/cours">« Méthodes numériques »</a> (§6).</p>

<div class="course-section">
  <div class="sec-num">MÉTHODES · CINÉTIQUE CHIMIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur l'évolution temporelle d'un système chimique : relier les vitesses, mesurer une vitesse sur des données, intégrer une loi de vitesse, exploiter un temps de demi-réaction, déterminer et confirmer un ordre, simplifier une loi de vitesse, traduire un suivi physique en concentrations, mesurer une énergie d'activation, et faire tout cela avec un programme. La dernière méthode, sur les mécanismes, est hors programme.</div>

  <div class="method-box"><strong>Méthode 1 — Relier vitesses de consommation, de formation et de réaction</strong>
    <ol>
      <li><span class="step">Écrire l'équation.</span> La vitesse de réaction dépend des coefficients choisis : on l'écrit d'abord, avec ses coefficients algébriques \(\nu_i\) (négatifs pour les réactifs).</li>
      <li><span class="step">Diviser par le coefficient.</span> \(v = \dfrac{1}{\nu_i}\dfrac{\mathrm d[\mathrm A_i]}{\mathrm dt} = \dfrac{v_{\text{cons}}(\mathrm A)}{|\nu_{\mathrm A}|} = \dfrac{v_{\text{form}}(\mathrm P)}{\nu_{\mathrm P}}\).</li>
      <li><span class="step">Vérifier les hypothèses.</span> Réacteur fermé, volume constant, réaction unique sans accumulation d'intermédiaires ; sinon, ne parler que des vitesses de consommation et de formation.</li>
    </ol>
    <p><em>Exemple éclair :</em> 4 NH₃ + 5 O₂ = 4 NO + 6 H₂O avec \(v_{\text{form}}(\mathrm{NO}) = 2{,}0\times10^{-4}\ \text{mol·L}^{-1}\text{·s}^{-1}\) : \(v = 5{,}0\times10^{-5}\), \(v_{\text{cons}}(\mathrm{O_2}) = 2{,}5\times10^{-4}\), \(v_{\text{form}}(\mathrm{H_2O}) = 3{,}0\times10^{-4}\ \text{mol·L}^{-1}\text{·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Déterminer une vitesse à une date à partir de mesures</strong>
    <ol>
      <li><span class="step">Graphiquement.</span> Tracer la tangente à \([\mathrm A](t)\) à la date voulue ; lire deux points éloignés de la tangente ; \(v_{\text{cons}} = -\)pente.</li>
      <li><span class="step">Numériquement.</span> Différence centrée : \(v_{\text{cons}}(t_k) \approx -(c_{k+1} - c_{k-1})/(t_{k+1} - t_{k-1})\), plus précise que la différence avant ; aucune valeur aux deux extrémités.</li>
      <li><span class="step">Passer à \(v\).</span> Diviser par \(|\nu_{\mathrm A}|\) ; donner l'unité (mol·L⁻¹·s⁻¹ ou par minute).</li>
    </ol>
    <p><em>Exemple éclair :</em> \([\mathrm A] = 0{,}0412\ \text{mol·L}^{-1}\) à 10 min et \(0{,}0318\) à 20 min : à 15 min, \(v_{\text{cons}} \approx (0{,}0412 - 0{,}0318)/10 = 9{,}4\times10^{-4}\ \text{mol·L}^{-1}\text{·min}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Écrire et intégrer une loi de vitesse</strong>
    <ol>
      <li><span class="step">Équation différentielle.</span> Pour \(a\,\mathrm A \to\) produits de loi \(v = k[\mathrm A]^n\) : \(\mathrm d[\mathrm A]/\mathrm dt = -a\,k[\mathrm A]^n\) (souvent \(a = 1\)).</li>
      <li><span class="step">Séparer et intégrer</span> entre 0 et \(t\) : ordre 0, \([\mathrm A] = [\mathrm A]_0 - akt\) ; ordre 1, \(\ln([\mathrm A]/[\mathrm A]_0) = -akt\) ; ordre 2, \(1/[\mathrm A] = 1/[\mathrm A]_0 + akt\).</li>
      <li><span class="step">Contrôler.</span> Unités de \(k\) : \((\text{mol·L}^{-1})^{1-n}\text{·s}^{-1}\) ; \(kt\) sans dimension à l'ordre 1 ; l'ordre 0 s'arrête à l'épuisement.</li>
    </ol>
    <p><em>Exemple éclair :</em> ordre 1, \(k = 2{,}0\times10^{-3}\ \text{s}^{-1}\) : 75 % de A transformé quand \([\mathrm A]/[\mathrm A]_0 = 1/4\), soit \(t = \ln 4/k = 693\ \text{s}\) (deux temps de demi-réaction).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Exploiter un temps de demi-réaction</strong>
    <ol>
      <li><span class="step">Calculer.</span> \(t_{1/2} = [\mathrm A]_0/(2k)\) (ordre 0), \(\ln 2/k\) (ordre 1), \(1/(k[\mathrm A]_0)\) (ordre 2), pour A → produits.</li>
      <li><span class="step">Plusieurs expériences.</span> \(t_{1/2} \propto [\mathrm A]_0^{\,1-n}\) : \(n = 1 - \dfrac{\ln(t_{1/2,2}/t_{1/2,1})}{\ln([\mathrm A]_{0,2}/[\mathrm A]_{0,1})}\).</li>
      <li><span class="step">Une seule expérience.</span> Lire les durées successives pour passer de \(c_0\) à \(c_0/2\), puis à \(c_0/4\)… : constantes (ordre 1), qui doublent (ordre 2), qui se divisent par 2 (ordre 0).</li>
    </ol>
    <p><em>Exemple éclair :</em> la concentration est divisée par 2 toutes les 12 min, quelle que soit la date de départ : ordre 1 et \(k = \ln 2/12 = 5{,}8\times10^{-2}\ \text{min}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Déterminer un ordre par la méthode différentielle</strong>
    <ol>
      <li><span class="step">Vitesses.</span> Calculer \(v\) à plusieurs dates (méthode 2), ou mesurer des vitesses initiales pour plusieurs \([\mathrm A]_0\).</li>
      <li><span class="step">Tracer \(\ln v\) en fonction de \(\ln[\mathrm A]\).</span> Points alignés : la réaction admet un ordre, égal à la pente (régression linéaire).</li>
      <li><span class="step">Arrondir avec discernement.</span> La pente est entachée du bruit des dérivées : 1,05 se lit « ordre 1 », qu'on confirme ensuite (méthode 6).</li>
    </ol>
    <p><em>Exemple éclair :</em> doubler \([\mathrm A]_0\) multiplie la vitesse initiale par 1,41 : \(n = \ln 1{,}41/\ln 2 = 0{,}50\), un ordre partiel ½.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Confirmer un ordre par la méthode intégrale</strong>
    <ol>
      <li><span class="step">Choisir la grandeur.</span> \([\mathrm A]\) (ordre 0), \(\ln[\mathrm A]\) (ordre 1), \(1/[\mathrm A]\) (ordre 2), tracée en fonction de \(t\) ; on peut remplacer \([\mathrm A]\) par une grandeur proportionnelle (absorbance, méthode 8).</li>
      <li><span class="step">Ajuster une droite</span> et examiner les écarts : points dans les barres d'incertitude, écarts normalisés sous 2, résidus de signes mêlés et sans arche. Le \(R^2\) ne suffit pas.</li>
      <li><span class="step">Lire \(k\).</span> Pente \(-k\), \(-k\), \(+k\) selon l'ordre (multipliée par \(a\) si le coefficient de A vaut \(a\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(1/[\mathrm A]\) passe de 5,0 à 11,0 L·mol⁻¹ en 12 min, en ligne droite : ordre 2, \(k = 6{,}0/12 = 0{,}50\ \text{L·mol}^{-1}\text{·min}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Simplifier une loi de vitesse par le choix des conditions initiales</strong>
    <ol>
      <li><span class="step">Dégénérescence.</span> Mettre tous les réactifs sauf A en large excès (au moins 10 fois, mieux 100) : \(v = k_{\text{app}}[\mathrm A]^\alpha\) avec \(k_{\text{app}} = k[\mathrm B]_0^\beta\) ; vérifier que \([\mathrm B]\) varie peu (\(|\nu_{\mathrm B}|\,x_{\max}/[\mathrm B]_0\) petit).</li>
      <li><span class="step">Ordre par rapport à B.</span> Refaire l'expérience avec un autre excès : \(\beta = \ln(k_{\text{app},2}/k_{\text{app},1})/\ln([\mathrm B]_{0,2}/[\mathrm B]_{0,1})\), puis \(k = k_{\text{app}}/[\mathrm B]_0^\beta\).</li>
      <li><span class="step">Proportions stœchiométriques.</span> Avec \([\mathrm A]_0/a = [\mathrm B]_0/b\), on a \([\mathrm B] = (b/a)[\mathrm A]\) à chaque instant : la loi ne dépend plus que de \([\mathrm A]\), d'ordre global \(\alpha + \beta\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(v = k[\mathrm A][\mathrm B]^2\) pour A + B, avec \([\mathrm B]_0 = 0{,}50\) et \([\mathrm A]_0 = 0{,}010\ \text{mol·L}^{-1}\) : \([\mathrm B]\) varie au plus de 2 %, ordre apparent 1, \(k_{\text{app}} = 0{,}25\,k\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Traduire un suivi physique en concentrations</strong>
    <ol>
      <li><span class="step">Écrire la grandeur</span> en fonction des quantités : \(A = \sum\varepsilon_i\ell c_i\), \(\sigma = \sum\lambda_i c_i\), \(P = n_{\text{gaz}}RT/V\). Elle est affine en l'avancement.</li>
      <li><span class="step">Valeurs extrêmes.</span> Calculer (ou mesurer) \(G_0\) et \(G_\infty\) (fin de la réaction totale, A limitant).</li>
      <li><span class="step">Conclure.</span> \([\mathrm A]/[\mathrm A]_0 = (G_\infty - G)/(G_\infty - G_0)\), puis appliquer les méthodes 5 et 6.</li>
    </ol>
    <p><em>Exemple éclair :</em> (CH₃)₃COOC(CH₃)₃(g) → 2 (CH₃)₂CO(g) + C₂H₆(g) à \(V\) et \(T\) fixés : \(P_\infty = 3P_0\). Avec \(P_0 = 0{,}200\ \text{bar}\) et \(P = 0{,}300\ \text{bar}\) : \([\mathrm A]/[\mathrm A]_0 = (0{,}600 - 0{,}300)/0{,}400 = 0{,}75\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Déterminer une énergie d'activation</strong>
    <ol>
      <li><span class="step">Convertir</span> les températures en kelvins ; obtenir \(k\) à chaque température (ou une grandeur proportionnelle : \(1/t_{1/2}\) à l'ordre 1, vitesse initiale à concentrations égales).</li>
      <li><span class="step">Deux températures :</span> \(E_a = R\,\dfrac{\ln(k_2/k_1)}{1/T_1 - 1/T_2}\).</li>
      <li><span class="step">Plusieurs températures :</span> régression de \(\ln k\) en fonction de \(1/T\) ; \(E_a = -R\times\)pente, \(A = e^{\text{ordonnée}}\) ; vérifier l'alignement.</li>
    </ol>
    <p><em>Exemple éclair :</em> ordre 1, \(t_{1/2} = 40\ \text{min}\) à 20 °C et 10 min à 40 °C : \(k_2/k_1 = 4\), \(E_a = 8{,}314\ln 4/(1/293{,}15 - 1/313{,}15) = 53\ \text{kJ·mol}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Exploiter des mesures avec un programme Python</strong>
    <ol>
      <li><span class="step">Données</span> dans des tableaux <code>numpy</code> ; convertir en concentrations (ou en grandeur proportionnelle).</li>
      <li><span class="step">Vitesses :</span> <code>v = -(c[2:] - c[:-2]) / (t[2:] - t[:-2])</code> (différences centrées, dates <code>t[1:-1]</code>).</li>
      <li><span class="step">Régressions :</span> <code>n, b = np.polyfit(np.log(c[1:-1]), np.log(v), 1)</code> (méthode différentielle) ; <code>a, b = np.polyfit(t, np.log(c), 1)</code> puis \(k = -a\) (ordre 1) ; <code>np.polyfit(1 / T, np.log(k), 1)</code> (Arrhenius).</li>
      <li><span class="step">Valider :</span> écarts normalisés <code>(y - (a * t + b)) / uy</code>, avec l'incertitude propagée sur la grandeur tracée.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur les mesures du cristal violet, la pente de \(\ln A\) vaut \(-0{,}1195\ \text{min}^{-1}\) et tous les écarts normalisés sont sous 1,2 : \(k_{\text{app}} = 0{,}119\ \text{min}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 11 — Établir une loi de vitesse à partir d'un mécanisme (hors programme, pour aller plus loin)</strong>
    <ol>
      <li><span class="step">Repérer l'étape lente</span> (cinétiquement déterminante) ; c'est un acte élémentaire : son ordre se lit sur ses coefficients.</li>
      <li><span class="step">Écrire sa vitesse.</span> Si elle fait intervenir un intermédiaire, exprimer sa concentration grâce à l'équilibre rapide qui précède (\(K\)).</li>
      <li><span class="step">Substituer</span> pour n'avoir que des réactifs (et produits) de la réaction globale ; comparer à la loi mesurée.</li>
    </ol>
    <p><em>Exemple éclair :</em> A ⇄ I (rapide, \(K\)) puis I + B → P (lent, \(k_2\)) : \(v = k_2[\mathrm I][\mathrm B] = k_2K[\mathrm A][\mathrm B]\), ordre 1 par rapport à chaque réactif.</p>
  </div>

  <div class="notice"><strong>Piège</strong> : lire l'ordre sur les coefficients stœchiométriques. Il se mesure ; il ne coïncide avec les coefficients que pour un acte élémentaire.</div>
  <div class="notice"><strong>Piège</strong> : oublier le coefficient de A. Pour 2 A → produits et \(v = k[\mathrm A]^n\), \(\mathrm d[\mathrm A]/\mathrm dt = -2k[\mathrm A]^n\) : toutes les formules intégrées et les \(t_{1/2}\) s'écrivent avec \(2k\).</div>
  <div class="notice"><strong>Piège</strong> : appeler « demi-vie » une constante pour tout ordre. Seul l'ordre 1 a un temps de demi-réaction indépendant de \([\mathrm A]_0\).</div>
  <div class="notice"><strong>Piège</strong> : degrés Celsius dans la loi d'Arrhenius, ou \(E_a\) en kJ·mol⁻¹ avec \(R\) en J·K⁻¹·mol⁻¹. Toujours en kelvins et en joules.</div>
  <div class="notice"><strong>Piège</strong> : confondre vitesse initiale et vitesse à une date, ou valider un ordre sur le début seulement de la réaction : au début, toutes les lois se ressemblent ; suivre la réaction sur deux ou trois temps de demi-réaction.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Vitesses de consommation, de formation et de réaction</h3>
  <div class="statement">L'oxydation de l'ammoniac, première étape de la fabrication de l'acide nitrique, a pour équation 4 NH₃(g) + 5 O₂(g) = 4 NO(g) + 6 H₂O(g). Dans un réacteur fermé de volume \(V = 5{,}0\ \text{L}\) constant, on mesure à une date donnée une vitesse de consommation de l'ammoniac \(v_{\text{cons}}(\mathrm{NH_3}) = 4{,}0\times10^{-4}\ \text{mol·L}^{-1}\text{·s}^{-1}\). On admet que la transformation est modélisée par cette seule réaction, sans accumulation d'intermédiaires. \(M(\mathrm{H_2O}) = 18{,}0\ \text{g·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse de réaction \(v\).</div>
  <div class="q"><strong>Q2.</strong> En déduire la vitesse de consommation du dioxygène et les vitesses de formation de NO et de H₂O.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\mathrm d\xi/\mathrm dt\), puis la masse d'eau formée par seconde à cette date.</div>
  <div class="q"><strong>Q4.</strong> On écrit maintenant l'équation 2 NH₃ + 5/2 O₂ = 2 NO + 3 H₂O. Quelles grandeurs des questions précédentes changent ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( v \) \( = \dfrac{1}{\nu_{\mathrm{NH_3}}}\dfrac{\mathrm d[\mathrm{NH_3}]}{\mathrm dt} \) \( = \dfrac{v_{\text{cons}}(\mathrm{NH_3})}{4} \) \( = 1{,}0\times10^{-4}\ \text{mol·L}^{-1}\text{·s}^{-1} \).</p>
    <p><strong>Q2.</strong> On multiplie \(v\) par la valeur absolue du coefficient : \(v_{\text{cons}}(\mathrm{O_2}) = 5v = 5{,}0\times10^{-4}\), \(v_{\text{form}}(\mathrm{NO}) = 4v = 4{,}0\times10^{-4}\), \(v_{\text{form}}(\mathrm{H_2O}) = 6v = 6{,}0\times10^{-4}\ \text{mol·L}^{-1}\text{·s}^{-1}\). Contrôle : il se forme autant de NO qu'il disparaît de NH₃ (mêmes coefficients).</p>
    <p><strong>Q3.</strong> \( \mathrm d\xi/\mathrm dt \) \( = vV \) \( = 1{,}0\times10^{-4}\times5{,}0 \) \( = 5{,}0\times10^{-4}\ \text{mol·s}^{-1} \). Eau : \(6\times5{,}0\times10^{-4} = 3{,}0\times10^{-3}\ \text{mol·s}^{-1}\), soit \(3{,}0\times10^{-3}\times18{,}0 = 0{,}054\ \text{g·s}^{-1}\).</p>
    <p><strong>Q4.</strong> Avec des coefficients divisés par 2, \( v' \) \( = v_{\text{cons}}(\mathrm{NH_3})/2 \) \( = 2v \) \( = 2{,}0\times10^{-4}\ \text{mol·L}^{-1}\text{·s}^{-1} \) et \(\mathrm d\xi'/\mathrm dt = 1{,}0\times10^{-3}\ \text{mol·s}^{-1}\). Les vitesses de consommation et de formation, et la masse d'eau formée par seconde, ne changent pas : ce sont des grandeurs mesurables, indépendantes de l'écriture.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Réaction d'ordre 1 : temps de demi-réaction</h3>
  <div class="statement">La décomposition d'un réactif A (A → produits) suit une loi d'ordre 1 avec \(k = 0{,}05\ \text{min}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le temps de demi-réaction \(t_{1/2}\).</div>
  <div class="q"><strong>Q2.</strong> Quelle fraction de A reste-t-il après \(t = 30\ \text{min}\) ?</div>
  <div class="q"><strong>Q3.</strong> Au bout de combien de temps ne reste-t-il plus que 1 % de A ? Exprimer cette durée en temps de demi-réaction.</div>
  <div class="q"><strong>Q4.</strong> Que deviennent ces résultats si l'on double la concentration initiale ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Loi intégrée : \([\mathrm A] = [\mathrm A]_0e^{-kt}\) ; \([\mathrm A] = [\mathrm A]_0/2\) pour \(t_{1/2} = \ln 2/k = 0{,}693/0{,}05 = 13{,}9\ \text{min}\).</p>
    <p><strong>Q2.</strong> \([\mathrm A](30)/[\mathrm A]_0 = e^{-0{,}05\times30} = e^{-1{,}5} = 0{,}223\) : il reste 22,3 % de A.</p>
    <p><strong>Q3.</strong> \(e^{-kt} = 0{,}01\), donc \(t = \ln(100)/k = 4{,}605/0{,}05 = 92{,}1\ \text{min}\), soit \(92{,}1/13{,}9 = 6{,}64\) temps de demi-réaction (\(2^{-6{,}64} = 0{,}01\)). Retenir : il faut environ 7 temps de demi-réaction pour atteindre 99 %.</p>
    <p><strong>Q4.</strong> Rien ne change : à l'ordre 1, les durées ne dépendent que de la fraction transformée, pas de la concentration initiale. C'est la signature de l'ordre 1.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Méthode intégrale graphique : une réaction d'ordre 2</h3>
  <div class="statement">Données expérimentales pour la réaction A → produits :
    <table>

      <tr><th>\([\mathrm A]\) (mol·L⁻¹)</th><td>1,000</td><td>0,500</td><td>0,333</td><td>0,250</td><td>0,200</td></tr>

  <div class="q"><strong>Q1.</strong> Calculer \(1/[\mathrm A]\) pour chaque date. Quel ordre la linéarité suggère-t-elle ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la constante de vitesse \(k\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le temps de demi-réaction et vérifier qu'il dépend de \([\mathrm A]_0\) : que vaut-il pour \([\mathrm A]_0 = 0{,}500\ \text{mol·L}^{-1}\) ? Le retrouver directement sur le tableau.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(1/[\mathrm A]\) : 1, 2, 3, 4, 5 L·mol⁻¹, en augmentation de 1 L·mol⁻¹ toutes les 10 s : fonction affine du temps, ce qui est la signature de l'ordre 2 (\(1/[\mathrm A] = 1/[\mathrm A]_0 + kt\)). On pourrait vérifier que \(\ln[\mathrm A]\) (0 ; −0,69 ; −1,10 ; −1,39 ; −1,61) n'est pas affine : ses accroissements diminuent.</p>
    <p><strong>Q2.</strong> Pente de \(1/[\mathrm A](t)\) : \(k = (2 - 1)/(10 - 0) = 0{,}10\ \text{L·mol}^{-1}\text{·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(t_{1/2} = 1/(k[\mathrm A]_0) = 1/(0{,}10\times1{,}0) = 10\ \text{s}\). Pour \([\mathrm A]_0 = 0{,}500\ \text{mol·L}^{-1}\) : \(t_{1/2} = 20\ \text{s}\), double. Sur le tableau, la concentration passe de 1,000 à 0,500 en 10 s, puis de 0,500 à 0,250 en 20 s (de \(t = 10\) à \(t = 30\ \text{s}\)) : les demi-réactions successives doublent, ce qui confirme l'ordre 2.</p>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Une réaction d'ordre 0 : l'ammoniac sur un filament de tungstène</h3>
  <div class="statement">Au contact d'un fil de tungstène chauffé, l'ammoniac gazeux se décompose : 2 NH₃(g) → N₂(g) + 3 H₂(g). Dans une enceinte de volume constant à 1 100 K, contenant initialement de l'ammoniac seul, on mesure la pression partielle de NH₃ :
    <table>
      <tr><th>\(t\) (s)</th><td>0</td><td>200</td><td>400</td><td>600</td><td>800</td></tr>
      <tr><th>\(P_{\mathrm{NH_3}}\) (kPa)</th><td>20,0</td><td>17,6</td><td>15,2</td><td>12,8</td><td>10,4</td></tr>
    </table>
    Les gaz sont parfaits ; \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la réaction est d'ordre 0 par rapport à NH₃.</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse de consommation de NH₃ en mol·L⁻¹·s⁻¹, puis la constante de vitesse \(k\) (préciser son unité).</div>
  <div class="q"><strong>Q3.</strong> Calculer le temps de demi-réaction et la date à laquelle l'ammoniac est entièrement décomposé.</div>
  <div class="q"><strong>Q4.</strong> Exprimer la pression totale en fonction de \(P_{\mathrm{NH_3}}\) et de \(P_0\). Que vaut-elle à 400 s et en fin de réaction ?</div>
  <div class="q"><strong>Q5.</strong> Proposer une interprétation de l'ordre 0.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(P_{\mathrm{NH_3}}\) diminue de 2,4 kPa toutes les 200 s : décroissance linéaire, donc vitesse constante, indépendante de la concentration (\(c = P/RT\)) : ordre 0.</p>
    <p><strong>Q2.</strong> Pente : \(-1{,}2\times10^{-2}\ \text{kPa·s}^{-1} = -12\ \text{Pa·s}^{-1}\). Comme \([\mathrm{NH_3}] = P_{\mathrm{NH_3}}/(RT)\) : \( v_{\text{cons}}(\mathrm{NH_3}) = 12/(8{,}314\times1100) \) \( = 1{,}31\times10^{-3}\ \text{mol·m}^{-3}\text{·s}^{-1} \) \( = 1{,}31\times10^{-6}\ \text{mol·L}^{-1}\text{·s}^{-1} \). Le coefficient de NH₃ vaut 2 : \(v = v_{\text{cons}}/2 = 6{,}6\times10^{-7}\ \text{mol·L}^{-1}\text{·s}^{-1}\), et à l'ordre 0, \(v = k\) : \(k = 6{,}6\times10^{-7}\ \text{mol·L}^{-1}\text{·s}^{-1}\).</p>
    <p><strong>Q3.</strong> La moitié de NH₃ a disparu quand \(P_{\mathrm{NH_3}} = 10{,}0\ \text{kPa}\) : \(t_{1/2} = 10{,}0/1{,}2\times10^{-2} = 8{,}3\times10^2\ \text{s}\). Épuisement : \(20{,}0/1{,}2\times10^{-2} = 1{,}7\times10^3\ \text{s}\), exactement \(2t_{1/2}\) (propre à l'ordre 0).</p>
    <p><strong>Q4.</strong> Quantités : NH₃ \(n_0 - 2\xi\), N₂ \(\xi\), H₂ \(3\xi\), total \(n_0 + 2\xi\). À \(V\) et \(T\) fixés, les pressions sont proportionnelles aux quantités : \(P_{\mathrm{NH_3}} = P_0 - 2p\) et \(P = P_0 + 2p\), avec \(p = \xi RT/V\). D'où \(P = 2P_0 - P_{\mathrm{NH_3}}\) : 24,8 kPa à 400 s, et \(2P_0 = 40{,}0\ \text{kPa}\) à la fin.</p>
    <p><strong>Q5.</strong> La réaction a lieu à la surface du métal. Quand la pression est suffisante, la surface est entièrement couverte de molécules adsorbées : la vitesse est limitée par le nombre de sites, pas par la concentration du gaz. À très basse pression, la surface n'est plus saturée et l'ordre 0 disparaît.</p>
  </div>
</div>

<div class="exo">

  <div class="statement">On suit la concentration d'un réactif A, seul réactif de la réaction A → produits :
