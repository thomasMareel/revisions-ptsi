    </table>
  </div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse de réaction aux dates 2, 6 et 10 min par la méthode des différences centrées.</div>
  <div class="q"><strong>Q2.</strong> En utilisant les dates 2 et 10 min, déterminer l'ordre par la méthode différentielle.</div>
  <div class="q"><strong>Q3.</strong> Confirmer l'ordre par la méthode intégrale et déterminer \(k\).</div>
  <div class="q"><strong>Q4.</strong> Comparer les valeurs de \(v/[\mathrm A]^2\) obtenues à la question 1 à la valeur de \(k\). D'où vient l'écart ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v(2) \approx (0{,}2000 - 0{,}1429)/4 = 1{,}43\times10^{-2}\) ; \(v(6) \approx (0{,}1429 - 0{,}1111)/4 = 7{,}95\times10^{-3}\) ; \( v(10) \) \( \approx (0{,}1111 - 0{,}0909)/4 \) \( = 5{,}05\times10^{-3}\ \text{mol·L}^{-1}\text{·min}^{-1} \).</p>
    <p><strong>Q2.</strong> Pente entre deux points du tracé de \(\ln v\) en fonction de \(\ln[\mathrm A]\) :</p>
    <div class="formula">$$n = \frac{\ln\big(v(2)/v(10)\big)}{\ln\big([\mathrm A](2)/[\mathrm A](10)\big)} = \frac{\ln(1{,}43\times10^{-2}/5{,}05\times10^{-3})}{\ln(0{,}1667/0{,}1000)} = 2{,}03$$</div>
    <p>La réaction est d'ordre 2.</p>
    <p><strong>Q3.</strong> \(1/[\mathrm A]\) vaut 5,00 ; 6,00 ; 7,00 ; 8,00 ; 9,00 ; 10,00 ; 11,00 L·mol⁻¹ : une droite de pente \(k = 0{,}50\ \text{L·mol}^{-1}\text{·min}^{-1}\). L'ordre 2 est confirmé.</p>
    <p><strong>Q4.</strong> \(v/[\mathrm A]^2\) vaut 0,514 ; 0,509 ; 0,505 L·mol⁻¹·min⁻¹, un peu plus que \(k = 0{,}500\). La différence centrée sur un pas de 4 min n'est qu'une approximation de la dérivée (erreur proportionnelle au carré du pas, <a href="#pynum/cours">« Méthodes numériques »</a>, §5) : ici elle surestime la vitesse de 3 % à 2 min, de 1 % à 10 min, là où la courbe s'est aplatie. La méthode intégrale, qui ne dérive pas, donne \(k\) sans cette erreur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Demi-réactions successives</h3>
  <div class="statement">Pour la décomposition d'un réactif A (A → produits), partant de \([\mathrm A]_0 = 0{,}050\ \text{mol·L}^{-1}\), on lit sur la courbe \([\mathrm A](t)\) les dates où la concentration vaut \([\mathrm A]_0/2\), \([\mathrm A]_0/4\) et \([\mathrm A]_0/8\) : 6,0 min, 18,0 min et 42,0 min.</div>
  <div class="q"><strong>Q1.</strong> Calculer les durées des trois demi-réactions successives. En déduire l'ordre de la réaction.</div>
  <div class="q"><strong>Q2.</strong> Calculer la constante de vitesse.</div>
  <div class="q"><strong>Q3.</strong> Quel serait le temps de demi-réaction en partant de \([\mathrm A]_0 = 0{,}020\ \text{mol·L}^{-1}\) ?</div>
  <div class="q"><strong>Q4.</strong> Qu'aurait-on observé pour une réaction d'ordre 1 ? d'ordre 0 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Durées : 6,0 ; \(18{,}0 - 6{,}0 = 12{,}0\) ; \(42{,}0 - 18{,}0 = 24{,}0\ \text{min}\). Chaque demi-réaction commence à une concentration deux fois plus faible et dure deux fois plus : \(t_{1/2} \propto 1/c\), ordre 2.</p>
    <p><strong>Q2.</strong> \(t_{1/2} = 1/(k[\mathrm A]_0)\), donc \(k = 1/(6{,}0\times0{,}050) = 3{,}3\ \text{L·mol}^{-1}\text{·min}^{-1}\). Contrôle : \(1/[\mathrm A] = 1/[\mathrm A]_0 + kt\) donne \([\mathrm A] = [\mathrm A]_0/8\) pour \(t = 7/(k[\mathrm A]_0) = 42\ \text{min}\).</p>
    <p><strong>Q3.</strong> \(t_{1/2} = 1/(3{,}33\times0{,}020) = 15\ \text{min}\).</p>
    <p><strong>Q4.</strong> Ordre 1 : trois durées égales (\(\ln 2/k\)). Ordre 0 : des durées divisées par 2 à chaque fois (\(t_{1/2}\), \(t_{1/2}/2\), \(t_{1/2}/4\)), car la vitesse reste constante pendant qu'il reste de moins en moins de réactif.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Suivi par la pression : décomposition d'un peroxyde</h3>
  <div class="statement">Le peroxyde de di-tert-butyle se décompose en phase gazeuse : (CH₃)₃COOC(CH₃)₃(g) → 2 (CH₃)₂CO(g) + C₂H₆(g). Une enceinte de volume et de température constants contient initialement le peroxyde seul, sous \(P_0 = 8{,}00\ \text{kPa}\). On mesure la pression totale :
    <table>
      <tr><th>\(t\) (min)</th><td>0</td><td>10</td><td>20</td><td>30</td><td>40</td><td>60</td></tr>
      <tr><th>\(P\) (kPa)</th><td>8,00</td><td>10,77</td><td>13,06</td><td>14,95</td><td>16,52</td><td>18,88</td></tr>
    </table>
  </div>
  <div class="q"><strong>Q1.</strong> Exprimer la pression totale en fonction de \(P_0\) et de l'avancement. Que vaut \(P_\infty\) si la réaction est totale ?</div>
  <div class="q"><strong>Q2.</strong> En déduire le rapport \(f = [\mathrm{peroxyde}]/[\mathrm{peroxyde}]_0\) en fonction de \(P\) et \(P_0\), et le calculer à chaque date.</div>
  <div class="q"><strong>Q3.</strong> Montrer que la réaction est d'ordre 1 et déterminer \(k\) et \(t_{1/2}\).</div>
  <div class="q"><strong>Q4.</strong> Quelle pression mesure-t-on à la date \(t_{1/2}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Quantités : peroxyde \(n_0 - \xi\), propanone \(2\xi\), éthane \(\xi\) ; total \(n_0 + 2\xi\). À \(V\) et \(T\) fixés : \(P = P_0(1 + 2\xi/n_0)\). Réaction totale (\(\xi = n_0\)) : \(P_\infty = 3P_0 = 24{,}0\ \text{kPa}\).</p>
    <p><strong>Q2.</strong> \(f = 1 - \xi/n_0 = \dfrac{P_\infty - P}{P_\infty - P_0} = \dfrac{3P_0 - P}{2P_0}\). Valeurs : 1 ; 0,827 ; 0,684 ; 0,566 ; 0,468 ; 0,320.</p>
    <p><strong>Q3.</strong> \(\ln f\) : 0 ; −0,190 ; −0,380 ; −0,570 ; −0,760 ; −1,139. Ces valeurs diminuent de 0,190 toutes les 10 min : \(\ln f\) est affine en \(t\), ordre 1, avec \(k = 1{,}90\times10^{-2}\ \text{min}^{-1}\) et \(t_{1/2} = \ln 2/k = 36\ \text{min}\).</p>
    <p><strong>Q4.</strong> À la demi-réaction, \(\xi = n_0/2\) : \(P = 2P_0 = 16{,}0\ \text{kPa}\), et non \(P_\infty/2\). Le tableau donne 16,52 kPa à 40 min, un peu après \(t_{1/2}\), ce qui est cohérent.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Dégénérescence de l'ordre : l'oxydation des ions iodure</h3>
  <div class="statement">Les ions peroxodisulfate oxydent les ions iodure : S₂O₈²⁻ + 2 I⁻ → 2 SO₄²⁻ + I₂. On cherche la loi \(v = k[\mathrm{S_2O_8^{2-}}]^\alpha[\mathrm{I^-}]^\beta\). Le diiode formé (sous forme I₃⁻) est la seule espèce colorée ; on suit l'absorbance \(A\), proportionnelle à \([\mathrm{I_2}]\). Expérience 1 : \([\mathrm{S_2O_8^{2-}}]_0 = 5{,}0\times10^{-3}\ \text{mol·L}^{-1}\), \([\mathrm{I^-}]_0 = 0{,}50\ \text{mol·L}^{-1}\) ; en fin de réaction, \(A_\infty = 0{,}800\).
    <table>
      <tr><th>\(t\) (s)</th><td>0</td><td>60</td><td>120</td><td>180</td><td>300</td></tr>
      <tr><th>\(A\)</th><td>0</td><td>0,225</td><td>0,387</td><td>0,503</td><td>0,646</td></tr>
    </table>
  </div>
  <div class="q"><strong>Q1.</strong> Pourquoi ces conditions initiales ? Estimer la variation relative de \([\mathrm{I^-}]\) au cours de la réaction et écrire la loi de vitesse simplifiée.</div>
  <div class="q"><strong>Q2.</strong> Exprimer \([\mathrm{S_2O_8^{2-}}]/[\mathrm{S_2O_8^{2-}}]_0\) en fonction de \(A\) et \(A_\infty\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\alpha = 1\) et calculer la constante apparente \(k_{\text{app}}\).</div>
  <div class="q"><strong>Q4.</strong> Expérience 2, identique mais avec \([\mathrm{I^-}]_0 = 0{,}25\ \text{mol·L}^{-1}\) : \(k_{\text{app}} = 2{,}75\times10^{-3}\ \text{s}^{-1}\). En déduire \(\beta\) et \(k\).</div>
  <div class="q"><strong>Q5.</strong> On mélange maintenant les réactifs dans les proportions stœchiométriques, \([\mathrm{I^-}]_0 = 2[\mathrm{S_2O_8^{2-}}]_0 = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\). Établir la loi intégrée et calculer le temps de demi-réaction. Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les ions iodure sont en large excès : au plus \(2\times5{,}0\times10^{-3} = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) est consommé, soit 2 % de \([\mathrm{I^-}]_0\). Leur concentration reste quasi constante : \(v = k_{\text{app}}[\mathrm{S_2O_8^{2-}}]^\alpha\) avec \(k_{\text{app}} = k[\mathrm{I^-}]_0^\beta\) (dégénérescence de l'ordre). On isole ainsi l'ordre par rapport au peroxodisulfate.</p>
    <p><strong>Q2.</strong> \([\mathrm{I_2}] = x\) et \(A\) est proportionnelle à \(x\) ; le peroxodisulfate est limitant, \(x_{\max} = [\mathrm{S_2O_8^{2-}}]_0\) correspond à \(A_\infty\) : \( [\mathrm{S_2O_8^{2-}}]/[\mathrm{S_2O_8^{2-}}]_0 \) \( = 1 - x/x_{\max} \) \( = (A_\infty - A)/A_\infty \).</p>
    <p><strong>Q3.</strong> \(f = (A_\infty - A)/A_\infty\) : 1 ; 0,719 ; 0,516 ; 0,371 ; 0,193 ; \(\ln f\) : 0 ; −0,330 ; −0,661 ; −0,991 ; −1,648. Le rapport \(-\ln f/t\) vaut \(5{,}50\times10^{-3}\ \text{s}^{-1}\) à chaque date : \(\ln f\) est proportionnel à \(t\), donc \(\alpha = 1\) et \(k_{\text{app}} = 5{,}5\times10^{-3}\ \text{s}^{-1}\) (\(t_{1/2} = 126\ \text{s}\)).</p>
    <p><strong>Q4.</strong> Diviser \([\mathrm{I^-}]_0\) par 2 divise \(k_{\text{app}}\) par 2 : \(\beta = \ln(5{,}5/2{,}75)/\ln 2 = 1\). Puis \( k \) \( = k_{\text{app}}/[\mathrm{I^-}]_0 \) \( = 5{,}5\times10^{-3}/0{,}50 \) \( = 1{,}1\times10^{-2}\ \text{L·mol}^{-1}\text{·s}^{-1} \). Loi : \(v = k[\mathrm{S_2O_8^{2-}}][\mathrm{I^-}]\), ordre global 2.</p>
    <p><strong>Q5.</strong> En proportions stœchiométriques, \([\mathrm{I^-}] = 2[\mathrm{S_2O_8^{2-}}]\) à chaque instant (on consomme 2 I⁻ par S₂O₈²⁻). Avec \(c = [\mathrm{S_2O_8^{2-}}]\) : \(\mathrm dc/\mathrm dt = -v = -2kc^2\), d'où \(1/c = 1/c_0 + 2kt\). Demi-réaction : \(t_{1/2} = 1/(2kc_0)\) \( = 1/(2\times1{,}1\times10^{-2}\times5{,}0\times10^{-3}) \) \( = 9{,}1\times10^3\ \text{s} \), soit 2,5 h, contre 2 min en présence du large excès d'iodure : la dégénérescence a aussi l'avantage d'accélérer la réaction.</p>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Loi d'Arrhenius : énergie d'activation</h3>
  <div class="statement">Une réaction a pour constante de vitesse \(k = 2{,}0\times10^{-3}\ \text{L·mol}^{-1}\text{·s}^{-1}\) à 25 °C et \(k = 8{,}0\times10^{-3}\ \text{L·mol}^{-1}\text{·s}^{-1}\) à 45 °C. \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'énergie d'activation \(E_a\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(k\) à 60 °C.</div>
  <div class="q"><strong>Q3.</strong> Calculer le facteur préexponentiel \(A\) et commenter sa valeur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(T_1 = 298{,}15\ \text{K}\), \(T_2 = 318{,}15\ \text{K}\) ; \(1/T_1 - 1/T_2 = 2{,}108\times10^{-4}\ \text{K}^{-1}\). </p>
    <div class="formula">$$E_a = R\,\frac{\ln(k_2/k_1)}{1/T_1 - 1/T_2} = \frac{8{,}314\times\ln 4}{2{,}108\times10^{-4}} = 5{,}47\times10^4\ \text{J·mol}^{-1}$$</div>
    <p>soit 54,7 kJ·mol⁻¹.</p>
    <p><strong>Q2.</strong> \(T_3 = 333{,}15\ \text{K}\) : \( k_3 = k_1\exp\!\big[\tfrac{E_a}{R}\big(\tfrac{1}{T_1} - \tfrac{1}{T_3}\big)\big] \) \( = 2{,}0\times10^{-3}\times e^{2{,}317} \) \( = 2{,}0\times10^{-2}\ \text{L·mol}^{-1}\text{·s}^{-1} \). Dix fois plus vite qu'à 25 °C pour 35 °C de plus.</p>
    <p><strong>Q3.</strong> \(A = k_1\,e^{E_a/(RT_1)}\) \( = 2{,}0\times10^{-3}\times e^{22{,}05} \) \( = 7{,}6\times10^6\ \text{L·mol}^{-1}\text{·s}^{-1} \), même unité que \(k\). \(A\) est la valeur que prendrait \(k\) sans barrière d'énergie ; il est des milliards de fois plus grand que \(k\) à 25 °C : seule une infime fraction des rencontres entre réactifs (\(e^{-22} \approx 3\times10^{-10}\)) a assez d'énergie pour aboutir.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Ordre 1 et loi d'Arrhenius</h3>
  <div class="statement">Une décomposition A → produits suit une cinétique d'ordre 1 : \(v = k[\mathrm A]\). À 300 K, le temps de demi-réaction vaut \(t_{1/2} = 10\ \text{min}\). \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Établir \([\mathrm A](t)\) et la relation entre \(t_{1/2}\) et \(k\). Calculer \(k\).</div>
  <div class="q"><strong>Q2.</strong> Au bout de combien de temps 90 % de A a-t-il réagi ?</div>
  <div class="q"><strong>Q3.</strong> En passant de 300 K à 310 K, la constante \(k\) double. En déduire l'énergie d'activation.</div>
  <div class="q"><strong>Q4.</strong> Prévoir le temps de demi-réaction à 320 K.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\mathrm d[\mathrm A]/\mathrm dt = -k[\mathrm A]\), donc \([\mathrm A](t) = [\mathrm A]_0e^{-kt}\). À la demi-réaction, \(e^{-kt_{1/2}} = 1/2\) : \(t_{1/2} = \ln 2/k\), indépendant de \([\mathrm A]_0\). \(k = 0{,}693/10 = 6{,}9\times10^{-2}\ \text{min}^{-1}\).</p>
    <p><strong>Q2.</strong> 90 % ont réagi quand \([\mathrm A]/[\mathrm A]_0 = 0{,}10\) : \(t = \ln 10/k = 2{,}303/0{,}0693 = 33\ \text{min}\) (3,3 temps de demi-réaction).</p>
    <p><strong>Q3.</strong></p>
    <div class="formula">$$E_a = \frac{R\ln 2}{1/300 - 1/310} = \frac{8{,}314\times0{,}693}{1{,}075\times10^{-4}} = 5{,}4\times10^4\ \text{J·mol}^{-1}$$</div>
    <p>soit 54 kJ·mol⁻¹ (c'est la valeur typique de la « règle » : la vitesse double pour 10 K).</p>
    <p><strong>Q4.</strong> \( \dfrac{k(320)}{k(300)} = \exp\!\Big[\dfrac{E_a}{R}\Big(\dfrac{1}{300} - \dfrac{1}{320}\Big)\Big] \) \( = 3{,}8 \), donc \(t_{1/2} = 10/3{,}8 = 2{,}6\ \text{min}\) : pas tout à fait 4 fois moins, car le facteur pour 10 K diminue quand la température augmente.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Capacité numérique : hydrolyse d'un chloroalcane suivie par conductimétrie</h3>
  <div class="statement">Dans un mélange eau-propanone, le 2-chloro-2-méthylpropane (noté RCl) s'hydrolyse : RCl + 2 H₂O → ROH + H₃O⁺ + Cl⁻, réaction totale. On introduit RCl à \(c_0 = 0{,}050\ \text{mol·L}^{-1}\) et l'on mesure la conductivité \(\sigma\) du mélange (µS·cm⁻¹) ; elle vaut 820 µS·cm⁻¹ en fin de réaction. Incertitude-type sur chaque mesure : 4 µS·cm⁻¹.
    <table>
      <tr><th>\(t\) (min)</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
      <tr><th>\(\sigma\)</th><td>0</td><td>83</td><td>159</td><td>223</td><td>276</td><td>339</td></tr>
      <tr><th>\(t\) (min)</th><td>6</td><td>8</td><td>10</td><td>12</td><td>15</td><td>20</td></tr>
      <tr><th>\(\sigma\)</th><td>385</td><td>464</td><td>535</td><td>589</td><td>651</td><td>720</td></tr>
    </table>
  </div>
  <div class="q"><strong>Q1.</strong> L'eau est le solvant : quelle conséquence sur la loi de vitesse ? Montrer que \([\mathrm{RCl}]/c_0 = (\sigma_\infty - \sigma)/\sigma_\infty\) (on admet la loi de Kohlrausch, et les ions formés seuls conducteurs).</div>
  <div class="q"><strong>Q2.</strong> Écrire un programme Python qui teste l'ordre 1 par la méthode intégrale : régression de \(\ln\big((\sigma_\infty - \sigma)/\sigma_\infty\big)\) en fonction de \(t\), écarts normalisés, constante de vitesse et temps de demi-réaction.</div>
  <div class="q"><strong>Q3.</strong> Compléter le programme pour calculer la vitesse de réaction à \(t = 5\ \text{min}\) par différence centrée, et la comparer à \(k[\mathrm{RCl}](5\ \text{min})\).</div>
  <div class="q"><strong>Q4.</strong> Pourquoi l'incertitude sur \(\ln\big((\sigma_\infty - \sigma)/\sigma_\infty\big)\) augmente-t-elle en fin de réaction ? Quelle précaution en tirer ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'eau, en très large excès, a une concentration constante : sa puissance éventuelle dans la loi de vitesse est absorbée dans une constante apparente (dégénérescence de l'ordre), et l'on mesure l'ordre par rapport à RCl seul. Au départ, aucun ion ; à l'avancement volumique \(x\), \([\mathrm{H_3O^+}] = [\mathrm{Cl^-}] = x\), donc \(\sigma = (\lambda_{\mathrm{H_3O^+}} + \lambda_{\mathrm{Cl^-}})\,x\) et \(\sigma_\infty = (\lambda_{\mathrm{H_3O^+}} + \lambda_{\mathrm{Cl^-}})\,c_0\). D'où \([\mathrm{RCl}]/c_0 = 1 - x/c_0 = (\sigma_\infty - \sigma)/\sigma_\infty\).</p>
    <p><strong>Q2 et Q3.</strong> L'incertitude se propage : \(u(\ln f) = u(\sigma)/(\sigma_\infty - \sigma)\).</p>
    <pre class="codeblock"><span class="kw">import</span> numpy as np

t = np.array([0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20])            <span class="cmt"># min</span>
sigma = np.array([0, 83, 159, 223, 276, 339,
                  385, 464, 535, 589, 651, 720])                    <span class="cmt"># µS/cm</span>
s_inf, u_s = 820, 4             <span class="cmt"># valeur finale ; incertitude-type</span>

f = (s_inf - sigma) / s_inf     <span class="cmt"># [RCl]/[RCl]0</span>
y = np.log(f)                   <span class="cmt"># ordre 1 : y affine en t</span>
uy = u_s / (s_inf - sigma)      <span class="cmt"># u(ln f) = u(sigma)/(s_inf - sigma)</span>
a, b = np.polyfit(t, y, 1)
z = (y - (a * t + b)) / uy      <span class="cmt"># écarts normalisés</span>
print(round(-a, 4), round(np.max(np.abs(z)), 2))   <span class="cmt"># 0.1052 1.54</span>
print(round(np.log(2) / -a, 2))                     <span class="cmt"># 6.59 (min)</span>

<span class="cmt"># vitesse à t = 5 min (différence centrée), c0 = 0,050 mol/L</span>
c = 0.050 * f
v5 = -(c[6] - c[4]) / (t[6] - t[4])
print(<span class="str">'%.2e'</span> % v5)              <span class="cmt"># 3.32e-03 (mol/L/min)</span></pre>
    <p>Les écarts normalisés restent tous sous 1,6, de signes mêlés : l'ordre 1 est validé, avec \(k = 0{,}105\ \text{min}^{-1}\) et \(t_{1/2} = 6{,}6\ \text{min}\). (Les mêmes régressions sur \(f\) ou \(1/f\), ordres 0 et 2, donnent des écarts normalisés de plusieurs dizaines.)</p>
    <p><strong>Q3.</strong> \(v(5) \approx 3{,}3\times10^{-3}\ \text{mol·L}^{-1}\text{·min}^{-1}\), alors que \( k[\mathrm{RCl}](5) \) \( = 0{,}1052\times0{,}050\times(820 - 339)/820 \) \( = 3{,}1\times10^{-3} \) : l'écart de 7 % vient du bruit des deux mesures utilisées, amplifié par la dérivation (\(u(v) \approx \sqrt2\times4/820\times0{,}050/2 = 1{,}7\times10^{-4}\), soit 5 %). La vitesse tirée de la loi ajustée sur toutes les mesures est plus fiable.</p>
    <p><strong>Q4.</strong> Quand \(\sigma\) approche \(\sigma_\infty\), la différence \(\sigma_\infty - \sigma\) devient petite et une même erreur de 4 µS·cm⁻¹ pèse de plus en plus (\(u(\ln f) = 0{,}04\) à 20 min contre 0,005 au début). Il faut connaître \(\sigma_\infty\) avec précision (une erreur sur \(\sigma_\infty\) courbe le tracé aux temps longs) et ne pas accorder trop de poids aux derniers points ; on arrête en général l'exploitation vers 3 ou 4 temps de demi-réaction.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Date de péremption d'un médicament : le vieillissement accéléré</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>loi de vitesse, méthode intégrale, dégénérescence, loi d'Arrhenius, capacité numérique</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">Un principe actif P, présent dans un sirop aqueux tamponné, se dégrade lentement par hydrolyse : P + H₂O → produits inactifs. Un médicament est considéré comme périmé quand il a perdu 10 % de son principe actif. Attendre des années pour mesurer cette durée à 25 °C est impossible : on fait des essais de « vieillissement accéléré » à plus haute température, puis on extrapole. \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <p class="exo-part">Partie A — Ordre de la réaction à 60 °C</p>
  <div class="q"><strong>A1.</strong> Le sirop est une solution aqueuse. Pourquoi ne peut-on pas mesurer l'ordre de la réaction par rapport à l'eau ? Quelle loi de vitesse cherche-t-on ?</div>
  <div class="q"><strong>A2.</strong> À 60 °C, un dosage par chromatographie donne la teneur en P, en pourcentage de la teneur initiale (incertitude-type 0,3 %) :
    <table>
      <tr><th>\(t\) (jours)</th><td>0</td><td>5</td><td>10</td><td>20</td><td>30</td><td>45</td><td>60</td></tr>
      <tr><th>teneur \(p\) (%)</th><td>100,0</td><td>92,9</td><td>85,9</td><td>74,2</td><td>63,7</td><td>50,8</td><td>40,7</td></tr>
    </table>
    Montrer que la réaction est d'ordre 1 par rapport à P en comparant les durées de demi-réactions successives, puis par la méthode intégrale. Déterminer \(k\) à 60 °C.</div>
  <div class="q"><strong>A3.</strong> Établir l'expression de la durée \(t_{90}\) au bout de laquelle 10 % de P a disparu, en fonction de \(k\). La calculer à 60 °C.</div>
  <p class="exo-part">Partie B — Loi d'Arrhenius</p>
  <div class="q"><strong>B1.</strong> Les mêmes essais à d'autres températures donnent :
    <table>
      <tr><th>\(\theta\) (°C)</th><td>50</td><td>60</td><td>70</td><td>80</td></tr>
      <tr><th>\(k\) (jour⁻¹)</th><td>\(5{,}80\times10^{-3}\)</td><td>\(1{,}50\times10^{-2}\)</td><td>\(3{,}67\times10^{-2}\)</td><td>\(8{,}53\times10^{-2}\)</td></tr>
    </table>
    Calculer l'énergie d'activation à partir des seules valeurs à 60 et 70 °C.</div>

  <p class="exo-part">Partie C — Date de péremption</p>
  <div class="q"><strong>C1.</strong> Avec \(E_a = 85{,}0\ \text{kJ·mol}^{-1}\), calculer \(k\) et \(t_{90}\) à 25 °C. Le fabricant peut-il afficher une durée de conservation de deux ans à température ambiante ?</div>
  <div class="q"><strong>C2.</strong> Même calcul pour un stockage au réfrigérateur (5 °C). Conclure.</div>
  <div class="q"><strong>C3.</strong> Une erreur de 5 kJ·mol⁻¹ sur \(E_a\) modifie-t-elle beaucoup \(t_{90}\) à 25 °C ? Pourquoi l'extrapolation est-elle délicate ?</div>
  <p class="exo-part">Partie D — Programme</p>
  <div class="q"><strong>D1.</strong> Écrire un programme Python qui détermine \(E_a\) par régression linéaire sur les quatre valeurs de la partie B, puis une fonction <code>t90(theta_c)</code> qui renvoie la durée de conservation à la température \(\theta_c\) (en °C).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> L'eau est le solvant : sa concentration (≈ 55 mol·L⁻¹) ne varie pas mesurablement, puisque P est très dilué. La loi \(v = k'[\mathrm P]^\alpha[\mathrm{H_2O}]^\beta\) dégénère en \(v = k[\mathrm P]^\alpha\) avec \(k = k'[\mathrm{H_2O}]^\beta\) : on ne peut pas faire varier \([\mathrm{H_2O}]\) pour mesurer \(\beta\), et l'on cherche l'ordre apparent \(\alpha\) et la constante apparente \(k\). (Le tampon fixe aussi le pH, qui pourrait intervenir dans la loi.)</p>
    <p><strong>A2.</strong> Demi-réactions : la teneur passe de 100 % à 50 % en un peu plus de 45 jours (50,8 % à 45 jours). Partant de 85,9 % (10 jours), on atteint la moitié, 43 %, vers 57 jours (interpolation entre 45 et 60 jours), soit encore environ 46 jours : deux demi-réactions de même durée pour des concentrations de départ différentes, signe de l'ordre 1 (à l'ordre 2, la seconde durerait plus longtemps). Méthode intégrale : \(\ln p\) vaut 4,605 ; 4,531 ; 4,453 ; 4,307 ; 4,154 ; 3,928 ; 3,706. La régression linéaire donne une pente de \(-0{,}0150\ \text{jour}^{-1}\), et les écarts normalisés (avec \(u(\ln p) = 0{,}3/p\)) restent sous 0,6 en valeur absolue, de signes mêlés : ordre 1 validé. Pour comparaison, les régressions de \(p\) et de \(1/p\) donnent des écarts normalisés de 12 et de 23 (en arche) : ordres 0 et 2 rejetés. Donc \(k(60\,°\mathrm C) = 1{,}50\times10^{-2}\ \text{jour}^{-1}\) (\(t_{1/2} = 46\) jours).</p>
    <p><strong>A3.</strong> \([\mathrm P]/[\mathrm P]_0 = e^{-kt} = 0{,}90\) pour \(t_{90} = \ln(1/0{,}90)/k = 0{,}1054/k\). À 60 °C : \(t_{90} = 0{,}1054/0{,}0150 = 7{,}0\) jours.</p>
    <p><strong>B1.</strong></p>
    <div class="formula">$$E_a = \frac{R\ln(k_{70}/k_{60})}{1/333{,}15 - 1/343{,}15} = \frac{8{,}314\times\ln(2{,}447)}{8{,}75\times10^{-5}} = 85\ \text{kJ·mol}^{-1}$$</div>
    <p><strong>B2.</strong> On trace \(\ln k\) en fonction de \(1/T\) (\(T\) en kelvins) : si les quatre points s'alignent, la loi d'Arrhenius est vérifiée sur ce domaine, et la pente vaut \(-E_a/R\). La régression donne \(E_a = 85{,}0\ \text{kJ·mol}^{-1}\) et \(A = 3{,}2\times10^{11}\ \text{jour}^{-1}\).</p>
    <p><strong>C1.</strong></p>
    <div class="formula">$$k(25\,°\mathrm C) = k(60\,°\mathrm C)\,\exp\!\left[-\frac{E_a}{R}\left(\frac{1}{298{,}15} - \frac{1}{333{,}15}\right)\right] = 0{,}0150\times e^{-3{,}60} = 4{,}1\times10^{-4}\ \text{jour}^{-1}$$</div>
    <p>D'où \(t_{90} = 0{,}1054/4{,}1\times10^{-4} = 258\) jours, environ 8,5 mois. Une durée de deux ans n'est pas possible à température ambiante.</p>
    <p><strong>C2.</strong> À 5 °C (278,15 K) : \(k = 3{,}5\times10^{-5}\ \text{jour}^{-1}\) et \(t_{90} = 3{,}0\times10^3\) jours, soit 8,3 ans : la mention « à conserver au réfrigérateur » permet d'afficher deux ans avec une large marge.</p>
    <p><strong>C3.</strong> Avec 80 ou 90 kJ·mol⁻¹, \(t_{90}(25\,°\mathrm C)\) vaut 208 ou 319 jours : ±20 % environ. L'extrapolation se fait loin du domaine mesuré (de 50-80 °C à 25 °C), où une petite erreur sur la pente se répercute exponentiellement ; de plus, rien ne garantit que le mécanisme de dégradation soit le même à basse température. Les durées affichées sont donc confirmées par des essais en temps réel.</p>
    <p><strong>D1.</strong></p>
    <pre class="codeblock"><span class="kw">import</span> numpy as np

R = 8.314
theta = np.array([50, 60, 70, 80])                    <span class="cmt"># °C</span>
k = np.array([5.80e-3, 1.50e-2, 3.67e-2, 8.53e-2])   <span class="cmt"># jour^-1</span>
T = theta + 273.15                                   <span class="cmt"># K</span>

pente, ordo = np.polyfit(1 / T, np.log(k), 1)
Ea = -pente * R
print(round(Ea / 1000, 1))                  <span class="cmt"># 85.0 (kJ/mol)</span>

<span class="kw">def</span> t90(theta_c):
<span class="str">    """Durée (jours) pour perdre 10 % du principe actif à theta_c (°C)."""</span>
    kT = np.exp(ordo + pente / (theta_c + 273.15))
    <span class="kw">return</span> np.log(1 / 0.9) / kT

print(round(t90(25)), round(t90(5) / 365.25, 1))   <span class="cmt"># 258 8.3</span></pre>
    <p>Le programme redonne \(E_a = 85{,}0\ \text{kJ·mol}^{-1}\), \(t_{90} = 258\) jours à 25 °C et 8,3 ans à 5 °C.</p>
  </div>

<div class="exo">
  <span class="num">EXO 12</span><span class="diff">★ ★ ☆</span>
  <h3>Mécanisme à deux étapes (hors programme en PTSI, pour aller plus loin)</h3>
  <div class="statement">Mécanisme proposé pour A + B → C :
    <br>Étape 1 (lente) : \(\mathrm A \xrightarrow{k_1} \mathrm I\)
    <br>Étape 2 (rapide) : \(\mathrm I + \mathrm B \xrightarrow{k_2} \mathrm C\)</div>
  <div class="q"><strong>Q1.</strong> Quelle est l'étape cinétiquement déterminante ?</div>
  <div class="q"><strong>Q2.</strong> Écrire la loi de vitesse de formation de C.</div>
  <div class="q"><strong>Q3.</strong> Quel est l'ordre partiel par rapport à A ? à B ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'étape 1 est lente : c'est l'étape cinétiquement déterminante.</p>
    <p><strong>Q2.</strong> La vitesse de la réaction globale est imposée par l'étape lente : \(v = k_1[\mathrm A]\). L'intermédiaire I est consommé dès qu'il se forme (l'étape 2 est rapide), il ne s'accumule pas ; la vitesse de formation de C est donc aussi \(k_1[\mathrm A]\).</p>
    <p><strong>Q3.</strong> Ordre 1 par rapport à A, ordre 0 par rapport à B : ordre global 1, bien que B soit un réactif du bilan. B n'intervient qu'après l'étape lente et n'influence pas la vitesse globale. Exemple typique d'une loi de vitesse qui ne reflète pas la stœchiométrie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 13</span><span class="diff">★ ★ ★</span>
  <h3>Mécanisme avec pré-équilibre (hors programme en PTSI, pour aller plus loin)</h3>
  <div class="statement">Réaction 2 NO + Cl₂ → 2 NOCl. Mécanisme proposé :
    <br>Étape 1 (rapide, équilibrée) : NO + Cl₂ ⇄ NOCl₂, constante \(K\)
    <br>Étape 2 (lente) : \(\mathrm{NOCl_2} + \mathrm{NO} \xrightarrow{k_2} 2\,\mathrm{NOCl}\)</div>
  <div class="q"><strong>Q1.</strong> Écrire la vitesse de l'étape cinétiquement déterminante en fonction de \([\mathrm{NOCl_2}]\) et \([\mathrm{NO}]\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer \([\mathrm{NOCl_2}]\) grâce à l'équilibre rapide (étape 1).</div>
  <div class="q"><strong>Q3.</strong> En déduire la loi de vitesse en fonction des réactifs. Quel est l'ordre global ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'étape 2 est lente ; c'est un acte élémentaire bimoléculaire : \(v = k_2[\mathrm{NOCl_2}][\mathrm{NO}]\).</p>
    <p><strong>Q2.</strong> L'étape 1, rapide, reste à l'équilibre : \(K = \dfrac{[\mathrm{NOCl_2}]\,c^\circ}{[\mathrm{NO}][\mathrm{Cl_2}]}\), donc \([\mathrm{NOCl_2}] = K[\mathrm{NO}][\mathrm{Cl_2}]/c^\circ\).</p>
    <p><strong>Q3.</strong> \(v = (k_2K/c^\circ)\,[\mathrm{NO}]^2[\mathrm{Cl_2}]\) : constante de vitesse \(k = k_2K/c^\circ\), ordre 2 par rapport à NO, 1 par rapport à Cl₂, ordre global 3. Cette loi a longtemps fait croire à une rencontre directe de trois molécules ; le pré-équilibre l'explique par deux étapes bimoléculaires successives.</p>
  </div>
</div>
