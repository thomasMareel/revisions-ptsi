<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Batterie d'une trottinette électrique</h3>
  <div class="statement">La batterie d'une trottinette est un assemblage 10s3p de cellules lithium-ion 3,6 V – 3,0 A·h – 46 g, chacune admettant 10 A en continu. En ville, la consommation mesurée est de 14 W·h/km. Le moteur absorbe 350 W à 25 km/h sur le plat et 700 W en côte. Le chargeur fournit 2 A. Le constructeur annonce 500 cycles complets avant que la capacité tombe à 80 %.</div>
  <div class="q"><strong>Q1.</strong> Tension nominale, capacité et énergie de la batterie ; énergie massique des cellules.</div>
  <div class="q"><strong>Q2.</strong> Autonomie en ville si l'on n'utilise que 90 % de l'énergie.</div>
  <div class="q"><strong>Q3.</strong> Courant dans la batterie et dans chaque cellule, sur le plat et en côte. Conclure.</div>
  <div class="q"><strong>Q4.</strong> Durée approximative d'une charge complète ; distance parcourue avant que la capacité tombe à 80 %.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(U_n = 10\times3{,}6 = 36\ \text{V}\) ; \(Q = 3\times3{,}0 = 9\ \text{A·h}\) ; \(W = 36\times9 = 324\ \text{W·h}\). Les 30 cellules pèsent 1,38 kg : \(324/1{,}38 \approx 235\ \text{W·h/kg}\).</p>
    <p><strong>Q2.</strong> \(d = 0{,}9\times324/14 \approx 21\ \text{km}\).</p>
    <p><strong>Q3.</strong> Plat : \(I = 350/36 \approx 9{,}7\ \text{A}\), soit 3,2 A par branche (environ 1C). Côte : \(I \approx 19{,}4\ \text{A}\), 6,5 A par cellule : inférieur aux 10 A admissibles, la batterie convient. Une architecture 10s2p (6 A·h) donnerait 9,7 A par cellule en côte : à la limite.</p>
    <p><strong>Q4.</strong> \(9/2 = 4{,}5\ \text{h}\), un peu plus en pratique (courant réduit en fin de charge). Distance sur la durée de vie : environ \(500\times21 \approx 10\,000\ \text{km}\), si chaque cycle correspond à une décharge complète.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Éjecteur pneumatique : lire le schéma, dimensionner</h3>
  <div class="statement">Un vérin double effet (alésage 32 mm, tige 12 mm, course 100 mm) est piloté par un distributeur 5/2 monostable à commande électrique et rappel par ressort, comme sur le schéma du cours (§5). Au repos, le distributeur relie 1 à 2 et 4 à 5 ; bobine excitée, il relie 1 à 4 et 2 à 3. L'orifice 4 alimente la chambre côté fond, l'orifice 2 la chambre côté tige. Réseau à 6 bar (relatifs). Deux limiteurs de débit unidirectionnels laissent entrer l'air librement dans le vérin et freinent sa sortie.</div>
  <div class="q"><strong>Q1.</strong> Position de la tige bobine non excitée, puis bobine excitée. Que se passe-t-il en cas de coupure de courant ?</div>
  <div class="q"><strong>Q2.</strong> Efforts théoriques en sortie et en rentrée de tige.</div>
  <div class="q"><strong>Q3.</strong> Pousser un colis demande 250 N. Calculer le taux de charge et conclure.</div>
  <div class="q"><strong>Q4.</strong> Consommation d'air en litres normaux par minute, à 40 cycles par minute (\(p_{atm} = 1\ \text{bar}\)).</div>
  <div class="q"><strong>Q5.</strong> Pourquoi place-t-on les limiteurs de débit sur l'échappement plutôt qu'à l'admission ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Repos : 1 → 2 alimente la chambre côté tige, la chambre côté fond s'échappe par 4 → 5 : tige rentrée. Bobine excitée : 1 → 4 alimente le fond, 2 → 3 vide la chambre côté tige : la tige sort. En cas de coupure, le ressort ramène le distributeur au repos : la tige rentre, ce qui libère le passage (position de sécurité).</p>
    <p><strong>Q2.</strong> \(S = \pi\times0{,}016^2 \approx 8{,}04\ \text{cm}^2\), \(F_s = 6\times10^{5}\times8{,}04\times10^{-4} \approx 483\ \text{N}\). \(S_a = \pi(0{,}016^2-0{,}006^2) \approx 6{,}91\ \text{cm}^2\), \(F_r \approx 415\ \text{N}\).</p>
    <p><strong>Q3.</strong> \(250/483 \approx 0{,}52\) : dans la plage 0,5–0,7, le vérin convient avec une réserve d'effort pour accélérer le colis.</p>
    <p><strong>Q4.</strong> Volume des chambres : \((8{,}04+6{,}91)\times10 \approx 150\ \text{cm}^3\) ; à 7 bar absolus, \(\approx 1{,}05\ \text{NL}\) par cycle, soit environ 42 NL/min.</p>
    <p><strong>Q5.</strong> La chambre motrice reçoit l'air à pleine pression, tandis que l'air qui s'échappe lentement de l'autre chambre maintient une contre-pression : le piston est « tenu » des deux côtés, le mouvement est régulier, sans à-coups dus à la compressibilité. Chaque limiteur règle la vitesse dans un sens indépendamment de l'autre.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Table élévatrice : vis trapézoïdale ou vis à billes ?</h3>
  <div class="statement">Le plateau d'une table élévatrice est levé par une vis trapézoïdale Tr 24×5 (pas 5 mm, diamètre moyen 21,5 mm) entraînée par un motoréducteur. Écrou en bronze graissé : \(f = 0{,}12\) en mouvement, \(f = 0{,}15\) à l'arrêt. Charge axiale 3 000 N, vitesse de levage 25 mm/s.</div>
  <div class="q"><strong>Q1.</strong> Calculer l'angle d'hélice. La vis est-elle irréversible à l'arrêt ? en mouvement ?</div>
  <div class="q"><strong>Q2.</strong> Rendement direct en mouvement, couple sur la vis, vitesse de rotation de la vis, puissance absorbée par la vis.</div>
  <div class="q"><strong>Q3.</strong> Énergie utile et énergie absorbée pour lever la charge de 0,5 m.</div>
  <div class="q"><strong>Q4.</strong> On envisage une vis à billes de même pas (\(\eta = 0{,}9\) dans les deux sens). Couple de levage ; couple que le moteur doit exercer pour retenir la charge à la descente. Quel composant faut-il ajouter ? Bilan.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\tan\alpha = 5/(\pi\times21{,}5)\), \(\alpha \approx 4{,}2°\). Angles de frottement : \(\arctan0{,}15 \approx 8{,}5°\) à l'arrêt, \(\arctan0{,}12 \approx 6{,}8°\) en mouvement. Dans les deux cas \(\alpha \lt \varphi\) : la vis est irréversible, même en mouvement.</p>
    <p><strong>Q2.</strong> \(\eta_d = \tan4{,}2°/\tan11{,}1° \approx 0{,}38\). Couple : \(C = Fp/(2\pi\eta_d) \approx 6{,}3\ \text{N·m}\). Vitesse : \(0{,}025/0{,}005 = 5\ \text{tr/s}\) (300 tr/min, 31,4 rad/s). Puissance : \(6{,}3\times31{,}4 \approx 200\ \text{W}\), pour 75 W utiles.</p>
    <p><strong>Q3.</strong> Énergie utile \(F h = 1\,500\ \text{J}\) ; absorbée \(1\,500/0{,}38 \approx 4\,000\ \text{J}\) : 2,5 kJ partent en chaleur dans l'écrou.</p>
    <p><strong>Q4.</strong> Levage : \(C = 3\,000\times0{,}005/(2\pi\times0{,}9) \approx 2{,}65\ \text{N·m}\). Descente : la charge entraîne la vis, le moteur doit retenir \(Fp\eta/(2\pi) \approx 2{,}15\ \text{N·m}\). La vis à billes est réversible : il faut un <strong>frein</strong> (à manque de courant) pour tenir le plateau moteur arrêté ou en cas de coupure. Bilan : moteur 2,4 fois moins sollicité, énergie de levage 1,67 kJ au lieu de 4 kJ, moins d'échauffement et d'usure ; mais vis plus chère, frein supplémentaire, sensibilité aux chocs et aux poussières.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Pesage de sacs : choisir la cellule et l'acquisition</h3>
  <div class="statement">Une ensacheuse remplit des sacs de 25 kg à \(\pm50\ \text{g}\) près. Deux cellules de charge de même gamme sont proposées : A (étendue 0–200 kg) et B (étendue 0–50 kg) ; pour chacune, non-linéarité \(\pm0{,}02\) % de l'étendue, hystérésis \(\pm0{,}02\) % de l'étendue, sensibilité 2 mV/V sous une alimentation de 5 V. La carte d'acquisition a une entrée 0–3,3 V précédée d'un amplificateur réglable.</div>
  <div class="q"><strong>Q1.</strong> Tension de sortie de la cellule à pleine échelle ; gain qui exploite toute la plage d'entrée.</div>
  <div class="q"><strong>Q2.</strong> Erreur maximale due à la cellule (non-linéarité et hystérésis) pour A et pour B. Laquelle retenir ?</div>
  <div class="q"><strong>Q3.</strong> On vise une résolution de 10 g avec la cellule B. Nombre minimal de bits du convertisseur ; format retenu.</div>
  <div class="q"><strong>Q4.</strong> Pour l'étalonnage, on pèse cinq fois une masse étalon de 25,000 kg : 25,012 ; 25,018 ; 25,009 ; 25,015 ; 25,016 kg. Commenter la justesse et la fidélité. Que faire ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(2\ \text{mV/V}\times5\ \text{V} = 10\ \text{mV}\) à pleine échelle ; gain \(3{,}3/0{,}010 = 330\).</p>
    <p><strong>Q2.</strong> A : \(0{,}04\ \%\times200\ \text{kg} = 80\ \text{g}\), supérieur à la tolérance de 50 g : refusée. B : \(0{,}04\ \%\times50\ \text{kg} = 20\ \text{g}\) : retenue, à condition que sac et support restent sous 50 kg. Une étendue surdimensionnée dégrade la précision.</p>
    <p><strong>Q3.</strong> \(2^N \ge 50/0{,}010 = 5\,000\), \(N \ge \log_2 5\,000 \approx 12{,}3\) : 13 bits au moins, un convertisseur de 16 bits en pratique (12 bits ne suffisent pas).</p>
    <p><strong>Q4.</strong> Moyenne 25,014 kg : biais de +14 g, défaut de <strong>justesse</strong> (erreur systématique), corrigé en réglant le gain ou en retranchant le biais. Écart-type \(\approx 3{,}5\ \text{g}\) (étendue 9 g) : bonne <strong>fidélité</strong>, dispersion petite devant 50 g. Après correction, l'erreur restante (dispersion, non-linéarité, hystérésis, quantification) reste sous 50 g.</p>

  <h3>Portes d'un tramway : matrice de décision, interfaces et énergie</h3>
  <div class="statement">On choisit l'actionneur des portes louvoyantes-coulissantes d'un tramway. Quatre solutions sont proposées : A, vérin pneumatique alimenté par un compresseur embarqué ; B, moteur électrique 24 V et vis à billes ; C, moteur électrique 24 V et courroie crantée ; D, vérin hydraulique. Le cahier des charges interdit tout fluide susceptible de fuir dans le compartiment des voyageurs (huile glissante et inflammable). Les critères de comparaison, leurs poids et les notes (de 1 à 5) attribuées par le bureau d'études sont :
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
      <tr><th>Critère</th><th>Poids</th><th>A</th><th>B</th><th>C</th></tr>
      <tr><td>Coût d'achat et d'intégration</td><td>3</td><td>4</td><td>2</td><td>3</td></tr>
      <tr><td>Masse embarquée</td><td>2</td><td>2</td><td>3</td><td>4</td></tr>
      <tr><td>Énergie consommée</td><td>3</td><td>1</td><td>5</td><td>5</td></tr>
      <tr><td>Maintenance</td><td>4</td><td>2</td><td>4</td><td>3</td></tr>
      <tr><td>Bruit</td><td>2</td><td>2</td><td>4</td><td>4</td></tr>
      <tr><td>Réglage fin de l'effort de fermeture</td><td>4</td><td>2</td><td>5</td><td>4</td></tr>
    </table></div>
    Pour l'énergie : chaque cycle d'une porte (ouverture et fermeture) demande un travail utile de 60 J ; le rendement global vaut 0,10 pour la solution pneumatique (compresseur compris) et 0,6 pour les solutions électriques. La rame a 8 portes, s'arrête 400 fois par jour, 360 jours par an, pendant 30 ans ; sa traction consomme environ 200 000 kW·h par an.</div>
  <div class="q"><strong>Q1.</strong> Quel critère écarte la solution D ? Pourquoi le traite-t-on avant toute notation ?</div>
  <div class="q"><strong>Q2.</strong> Calculer les scores de A, B et C, en points et en pourcentage du score maximal. Conclure.</div>
  <div class="q"><strong>Q3.</strong> Analyse de sensibilité : le poids du coût passe de 3 à 5 ; puis, partant des poids d'origine, celui de la maintenance passe de 4 à 2. Que conclure de l'écart entre B et C ?</div>
  <div class="q"><strong>Q4.</strong> Dans le diagramme de blocs internes, le bloc « porte » (moteur 24 V, sa carte de commande et ses capteurs) doit être relié au reste de la rame, dont la ligne aérienne fournit 750 V continu. Quels flux et quelles interfaces faut-il vérifier ? À quels blocs allouer l'exigence « la rame ne démarre pas tant qu'une porte est ouverte » ?</div>
  <div class="q"><strong>Q5.</strong> Calculer l'énergie consommée par les portes en un an et sur 30 ans pour la solution pneumatique et pour une solution électrique. Comparer à la traction et conclure sur l'écoconception de la porte.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'interdiction de tout fluide susceptible de fuir dans le compartiment des voyageurs est un critère éliminatoire : il écarte le vérin hydraulique. On le traite avant la notation, car une exigence impérative ne doit pas pouvoir être « compensée » par de bonnes notes sur d'autres critères.</p>
    <p><strong>Q2.</strong> Somme des poids : 18, score maximal \(5 \times 18 = 90\). Pour A :</p>
    <div class="formula">$$S_A = 3\times4 + 2\times2 + 3\times1 + 4\times2 + 2\times2 + 4\times2 = 39$$</div>
    <p>soit 43 % ; de même, B : \(6 + 6 + 15 + 16 + 8 + 20 = 71\) (79 %) ; C : \(9 + 8 + 15 + 12 + 8 + 16 = 68\) (76 %). Les solutions électriques l'emportent nettement sur le pneumatique (énergie, maintenance, réglage de l'effort, qui conditionne la sécurité des voyageurs pincés par une porte).</p>
    <p><strong>Q3.</strong> Coût à 5 : A 47, B 75, C 74 (sur 100). Maintenance à 2 : A 35, B 63, C 62 (sur 80). B reste devant, mais d'un seul point : l'écart initial (71 contre 68, soit 3 % du maximum) est du même ordre que la précision des notes. La matrice élimine le pneumatique mais ne départage pas B et C : il faut affiner (prix réels, essai d'un prototype, durée de vie de la courroie et de la vis), et écrire dans le dossier la raison du choix final.</p>
    <p><strong>Q4.</strong> Énergie : le moteur 24 V ne peut pas être branché sur le 750 V ; il faut un convertisseur continu-continu (en pratique le réseau auxiliaire 24 V de la rame, avec sa batterie de secours) : niveaux de tension et de courant (crête au démarrage du moteur), protection. Information : ordres d'ouverture et de fermeture venant du calculateur de la rame (bus de communication : format, protocole, débit), boutons des voyageurs (tout ou rien), comptes rendus « porte fermée et verrouillée » et détection d'obstacle (capteur de fin de course, mesure du courant moteur ou bourrelet sensible). L'exigence est allouée aux capteurs de fermeture et de verrouillage de chaque porte, à la carte de commande de porte, au bus, et au calculateur de rame qui interdit la traction : une exigence de sécurité répartie sur plusieurs blocs, comme le montre le tableau d'allocation.</p>
    <p><strong>Q5.</strong> Cycles par an : \(8 \times 400 \times 360 = 1\,152\,000\). Pneumatique : \(60/0{,}10 = 600\) J par cycle, soit \(600 \times 1{,}152\cdot10^{6} \approx 6{,}9\cdot10^{8}\) J ≈ 192 kW·h par an et 5 760 kW·h sur 30 ans. Électrique : 100 J par cycle, 32 kW·h par an, 960 kW·h sur 30 ans : six fois moins. Mais même pour le pneumatique, c'est moins de 0,1 % de la traction (200 000 kW·h par an) : à l'échelle de la rame, l'énergie des portes pèse peu. L'écoconception de la porte se joue plutôt sur sa masse (qui coûte de la traction pendant 30 ans), sa durée de vie et sa maintenance (fuites d'air, usure), et sa fin de vie (électronique, aimants, démontage). Le poids 3 donné à l'énergie consommée mérite donc d'être discuté ; et l'on n'ajoute pas un critère « impact environnemental » qui recompterait la même énergie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Fendeuse de bûches hydraulique : lire le schéma, dimensionner</h3>
  <div class="statement">Une fendeuse de bûches comporte une pompe à engrenages de cylindrée 6 cm³/tr entraînée à 1 450 tr/min (rendement volumétrique 0,92, rendement global 0,80), un limiteur de pression réglé à 160 bar, un distributeur 4/3 à commande manuelle avec rappel par ressorts en position centrale, et un vérin double effet d'alésage 80 mm, de tige 40 mm et de course 500 mm. En position centrale, le distributeur relie P à T et obture A et B ; levier poussé, il relie P à A (chambre côté fond) et B à T ; levier tiré, P à B et A à T.</div>
  <div class="q"><strong>Q1.</strong> Que fait le vérin dans chaque position du distributeur ? Quel est l'intérêt de cette position centrale, pour la pompe et pour la bûche ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le débit réel de la pompe.</div>
  <div class="q"><strong>Q3.</strong> Effort maximal de fendage ; vitesses de sortie et de rentrée de la tige ; durée d'un aller-retour. Pourquoi la rentrée est-elle plus rapide ?</div>
  <div class="q"><strong>Q4.</strong> Puissance hydraulique maximale, puissance absorbée par la pompe et couple sur son arbre. Choisir le moteur électrique parmi 2,2, 3 et 4 kW.</div>
  <div class="q"><strong>Q5.</strong> En fin de course de sortie, l'opérateur garde le levier poussé pendant 5 s. Où passe l'huile ? Que devient la puissance de la pompe ? Que conseiller ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Levier poussé : la pompe alimente la chambre côté fond, la chambre côté tige se vide à la bâche : la tige sort et fend la bûche. Levier tiré : l'inverse, la tige rentre. Au centre, A et B sont obturés : l'huile est enfermée dans les deux chambres, le vérin est bloqué dans sa position (la bûche reste serrée si l'on relâche le levier). P étant relié à T, la pompe débite à la bâche sous une pression très faible : elle ne consomme presque rien et l'huile ne chauffe pas entre deux bûches.</p>
    <p><strong>Q2.</strong> Débit réel :</p>
    <div class="formula">$$Q_v = \eta_v\,V_{cyl}\,N = 0{,}92 \times 6 \times 1\,450 \approx 8\,000\ \text{cm}^3/\text{min}$$</div>
    <p>soit 8,0 L/min ou \(1{,}33\cdot10^{-4}\ \text{m}^3/\text{s}\).</p>
    <p><strong>Q3.</strong> Section côté fond \(S = \pi \times 0{,}04^2 \approx 5{,}03\cdot10^{-3}\ \text{m}^2\) : \(F_{max} = 160\cdot10^{5} \times 5{,}03\cdot10^{-3} \approx 80\) kN (environ 8 tonnes-force), atteint quand la bûche résiste et que la pression monte jusqu'au réglage du limiteur. Sortie : \(v = Q_v/S \approx 26{,}5\) mm/s, soit 18,8 s pour 500 mm. Rentrée : section annulaire \(S_a = \pi(0{,}04^2 - 0{,}02^2) \approx 3{,}77\cdot10^{-3}\ \text{m}^2\), \(v \approx 35{,}4\) mm/s, soit 14,1 s. Aller-retour : environ 33 s. La rentrée est plus rapide car le même débit remplit une chambre de section plus petite (la tige y occupe de la place) ; l'effort disponible y est plus faible (60 kN), ce qui suffit pour ramener la tige.</p>
    <p><strong>Q4.</strong> Puissance hydraulique sous 160 bar : \(p\,Q_v = 160\cdot10^{5} \times 1{,}334\cdot10^{-4} \approx 2{,}13\) kW. Puissance absorbée : \(2{,}13/0{,}80 \approx 2{,}67\) kW ; couple sur l'arbre : \(2\,670/151{,}8 \approx 17{,}6\) N·m (avec \(\omega = 1\,450 \times 2\pi/60\)). On retient le moteur de 3 kW (2,2 kW serait dépassé dès que la pression atteint le réglage du limiteur).</p>
    <p><strong>Q5.</strong> La tige en butée ne peut plus avancer : tout le débit passe par le limiteur de pression, sous 160 bar. Les 2,13 kW hydrauliques sont entièrement transformés en chaleur dans l'huile, soit environ 10,7 kJ en 5 s ; la pompe et son moteur restent à pleine charge. Il faut relâcher le levier dès la bûche fendue (retour au centre, pompe déchargée) ; sur une machine à cadence élevée, on ajoute un retour automatique en fin de course ou un échangeur pour refroidir l'huile.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Axe vertical d'un robot de palettisation</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>chaîne de puissance : transmetteur réversible, motorisation sur un cycle, énergie renvoyée, codeur</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">L'axe vertical d'un robot de palettisation déplace une masse \(M = 25\ \text{kg}\) (chariot, préhenseur et colis) par une vis à billes verticale de pas \(p = 20\ \text{mm}\), de rendement \(\eta = 0{,}9\) dans les deux sens et d'inertie \(J_v = 3{,}0\times10^{-4}\ \text{kg·m}^2\), accouplée directement au moteur. Cycle de période \(T = 2\ \text{s}\) : montée de 0,6 m (accélération 0,15 s, palier 0,45 s, décélération 0,15 s), arrêt 0,25 s, descente symétrique, arrêt 0,25 s. Pendant les arrêts, un frein à manque de courant immobilise la vis et le moteur ne fournit aucun couple. On néglige les frottements de guidage ; \(g = 9{,}81\ \text{m/s}^2\). Couple moteur : \(C = Fp/(2\pi\eta)\) en marche motrice, \(C = Fp\eta/(2\pi)\) quand la charge entraîne, auquel s'ajoute \((J_m + J_v)\,\dot\omega_m\).
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
      <tr><th>Moteur</th><th>\(C_n\) (N·m)</th><th>\(C_{max}\) (N·m)</th><th>\(n_{max}\) (tr/min)</th><th>\(J_m\) (kg·m²)</th></tr>
      <tr><td>M1</td><td>0,8</td><td>2,4</td><td>6 000</td><td>\(1{,}0\times10^{-4}\)</td></tr>
      <tr><td>M2</td><td>1,3</td><td>3,9</td><td>5 000</td><td>\(2{,}0\times10^{-4}\)</td></tr>
      <tr><td>M3</td><td>2,4</td><td>7,2</td><td>4 000</td><td>\(4{,}5\times10^{-4}\)</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>Q1.</strong> La vis à billes est-elle réversible ? Justifier la présence du frein à manque de courant.</div>
  <div class="q"><strong>Q2.</strong> Vitesse maximale et accélération du chariot ; vitesse (en tr/min) et accélération angulaire du moteur.</div>
  <div class="q"><strong>Q3.</strong> Effort vertical exercé par l'écrou sur le chariot dans chacune des six phases de mouvement. Dans quelles phases la charge est-elle entraînante ?</div>
  <div class="q"><strong>Q4.</strong> Calculer le couple moteur dans chaque phase en supposant \(J_m = 2{,}0\times10^{-4}\ \text{kg·m}^2\).</div>
  <div class="q"><strong>Q5.</strong> Couple efficace et couple maximal. Choisir le moteur dans le catalogue et vérifier l'hypothèse sur \(J_m\). Pourquoi M1 ne convient-il pas ?</div>
  <div class="q"><strong>Q6.</strong> Énergie renvoyée vers le moteur à chaque descente. Que devient-elle si le variateur est alimenté par un redresseur à diodes ? Proposer une amélioration.</div>
  <div class="q"><strong>Q7.</strong> On veut positionner le préhenseur à \(\pm0{,}05\ \text{mm}\), avec une résolution de 0,01 mm. Nombre de points du codeur incrémental (lu en quadrature) ; fréquence de comptage à vitesse maximale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Une vis à billes a un frottement de roulement très faible (\(\varphi\) de quelques dixièmes de degré) devant un angle d'hélice de plusieurs degrés : elle est réversible (\(\eta_i \approx 0{,}9\)). Sans couple moteur, la charge descendrait seule : le frein, serré par ressort quand il n'est plus alimenté, tient la charge à l'arrêt et en cas de coupure.</p>
    <p><strong>Q2.</strong> \(v_{max} = 0{,}6/(0{,}15+0{,}45) = 1{,}0\ \text{m/s}\), \(a = 1{,}0/0{,}15 \approx 6{,}67\ \text{m/s}^2\). Moteur : \(\omega_m = 2\pi v/p \approx 314\ \text{rad/s}\) (3 000 tr/min), \(\dot\omega_m = 2\pi a/p \approx 2\,094\ \text{rad/s}^2\).</p>
    <p><strong>Q3.</strong> Théorème de la résultante dynamique sur le chariot, effort \(F\) compté vers le haut : \(F = M(g + a_z)\). Montée : accélération \(F = M(g+a) \approx 412\ \text{N}\), palier \(Mg \approx 245\ \text{N}\), décélération \(M(g-a) \approx 78{,}6\ \text{N}\). Descente : accélération vers le bas \(78{,}6\ \text{N}\), palier 245 N, décélération 412 N. L'effort est toujours dirigé vers le haut ; il est moteur à la montée (même pendant la décélération, car \(F \gt 0\)) et résistant à la descente : la charge est entraînante pendant les trois phases de descente.</p>
    <p><strong>Q4.</strong> Couple d'inertie :</p>
    <div class="formula">$$(J_m+J_v)\,\dot\omega_m = 5\times10^{-4}\times2\,094 \approx 1{,}05\ \text{N·m}$$</div>
    <p>Couples (positifs dans le sens de la montée) :</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
      <tr><th>Phase</th><th>Charge</th><th>Inertie</th><th>\(C_m\) (N·m)</th></tr>
      <tr><td>Montée, accélération</td><td>\(412\times0{,}02/(2\pi\times0{,}9) = 1{,}46\)</td><td>+1,05</td><td>2,50</td></tr>
      <tr><td>Montée, palier</td><td>0,87</td><td>0</td><td>0,87</td></tr>

    <p><strong>Q5.</strong></p>
    <div class="formula">$$C_{eff} = \sqrt{\frac{0{,}15\,(2{,}50^2+0{,}77^2+0{,}82^2+2{,}23^2) + 0{,}45\,(0{,}87^2+0{,}70^2)}{2}} \approx 1{,}10\ \text{N·m}$$</div>
    <p>\(C_{max} = 2{,}50\ \text{N·m}\), 3 000 tr/min. M2 convient : \(1{,}10 \le 1{,}3\), \(2{,}50 \le 3{,}9\), \(3\,000 \le 5\,000\), et son inertie est celle supposée. M1 a un couple crête suffisant (avec sa propre inertie, \(C_{max} \approx 2{,}30\ \text{N·m} \le 2{,}4\)) mais il chaufferait : \(C_{eff} \approx 1{,}02\ \text{N·m} \gt 0{,}8\). M3 conviendrait aussi, mais il est surdimensionné et son inertie plus grande porte \(C_{eff}\) à 1,34 N·m.</p>
    <p><strong>Q6.</strong> La pesanteur fournit \(Mgh = 25\times9{,}81\times0{,}6 \approx 147\ \text{J}\) par descente (les énergies cinétiques initiale et finale sont nulles) ; le moteur en reçoit environ \(0{,}9\times147 \approx 132\ \text{J}\), moins ses pertes. Avec un redresseur à diodes, cette énergie ne peut pas remonter au réseau : elle charge le condensateur du bus continu, dont la tension monte, et un hacheur de freinage la dissipe dans une résistance (environ 66 W en moyenne). Améliorations : bus continu commun avec d'autres axes qui consomment au même moment, redresseur réversible, ou stockage par supercondensateurs.</p>
    <p><strong>Q7.</strong> Par tour : \(20/0{,}01 = 2\,000\) incréments, soit \(N = 500\) points en quadrature. À 50 tr/s : \(2\,000\times50 = 100\,000\) incréments par seconde, donc un compteur matériel d'au moins 100 kHz. Le codeur, monté sur le moteur, ne voit ni l'erreur de pas de la vis ni la déformation de l'accouplement : la précision réelle est à vérifier sur le préhenseur.</p>
