  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre rassemble les capacités de 2ᵉ année sur le <strong>choix</strong> et le <strong>dimensionnement</strong> des constituants des chaînes fonctionnelles (A3 S3 et S4, F1, F2 et F3 S4, D2 S3, E1 S4). Il part du découpage en chaîne d'information et chaîne de puissance de 1ʳᵉ année (« Ingénierie système : besoin, exigences, architecture ») et renvoie aux chapitres qui détaillent chaque constituant. Le travail se fait <strong>à partir d'une documentation technique fournie</strong> : savoir quoi lire dans un catalogue, quoi calculer, quoi vérifier.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Justifier le choix des constituants</strong> dédiés aux fonctions d'un système : diagrammes de définition de blocs et de blocs internes, chaînes d'information et de puissance (A3, S4) ; <strong>proposer une architecture fonctionnelle et organique</strong> en allouant des composants aux exigences (F1, S4) (§1).</li>
        <li><strong>Proposer et hiérarchiser des critères de choix</strong> : autonomie énergétique, coût, durée de vie, encombrement, impact environnemental, précision et rapidité, rendement, réversibilité, résistance et déplacement (F2, S4) (§2).</li>
        <li><strong>Caractériser un constituant de la chaîne de puissance</strong> : alimentation d'énergie ; association de préactionneurs et d'actionneurs, transmetteurs de puissance (caractéristiques, réversibilité, domaines d'application) (A3, S3) (§3 à §6).</li>
        <li><strong>Choisir les composants de la chaîne de puissance</strong> : dispositifs de stockage d'énergie, modulateur, convertisseur, transmetteur (F2, S4) (§3 à §7).</li>
        <li><strong>Lire et décoder</strong> un schéma hydraulique ou pneumatique, les normes de représentation étant fournies (E1, S4) (§5).</li>
        <li><strong>Dimensionner un composant de la chaîne de puissance</strong> à partir d'une documentation technique : durée de vie, capacité et consommation électrique, couple thermique équivalent, puissance, rapport de transmission (F3, S4) (§3, §6, §7).</li>
        <li><strong>Choisir les composants de la chaîne d'information</strong> : technologie de capteur, carte de commande (F2, S4) ; <strong>justifier le choix d'un capteur</strong> vis-à-vis de la grandeur à mesurer (D2, S3) (§8, §9).</li>
        <li><strong>Dimensionner un composant de la chaîne d'information</strong> : capteur (étendue de mesure, précision, justesse, fidélité, sensibilité), carte de commande (résolution, mémoire), débit de communication (F3, S4) (§8, §9).</li>
        <li><strong>Intégrer les contraintes d'écoconception</strong> dans les architectures proposées : cycle de vie, nouveau concept, matériaux, réduction de matière, production, logistique, durée de vie, fin de vie (F1, S4) (§10).</li>
      </ul>
      <p>Rappels de 1ʳᵉ année : fonctions des deux chaînes (S1) ; capteurs, carte programmable, transmetteurs et réseaux (S2). La modification d'un programme et le choix d'un correcteur (F2, S4) relèvent des chapitres d'automatique. Hors programme, en fin de chapitre : modèles fins de batteries, hydraulique proportionnelle, incertitudes composées, analyse de cycle de vie normalisée.</p>

<div class="course-section">
  <div class="sec-num">§1 · DE L'EXIGENCE AU COMPOSANT</div>
  <h2>Architecture fonctionnelle et architecture organique</h2>
  <div class="intro">Un cahier des charges dit <em>ce que</em> le système doit faire, pas <em>avec quoi</em>. On décrit d'abord les fonctions à assurer, puis on attribue chacune à un ou plusieurs constituants, en gardant la trace de ce choix pour pouvoir le justifier et le vérifier.</div>

  <div class="def-box">
    <strong>Architecture fonctionnelle</strong> : organisation des fonctions que le système doit remplir et des flux (matière, énergie, information) qu'elles échangent, sans référence à une technologie. <strong>Architecture organique</strong> (ou structurelle) : ensemble des constituants physiques retenus et de leurs liaisons. Le passage de l'une à l'autre s'appelle l'<strong>allocation</strong> : chaque exigence est « satisfaite » par un ou plusieurs blocs.
  </div>

  <p>Rappel : la <strong>chaîne d'information</strong> acquiert, traite et communique ; la <strong>chaîne de puissance</strong> alimente, module, convertit, transmet et agit. Le chapitre suit cet ordre : chaîne de puissance aux §3 à §7, chaîne d'information aux §8 et §9.</p>

  <h3>Les diagrammes SysML de structure</h3>
  <ul>
    <li><strong>Diagramme de définition de blocs</strong> (bdd) : l'arborescence des constituants (composition, multiplicités : 2 roues, 40 cellules) et leurs propriétés (masse, tension, capacité…).</li>
    <li><strong>Diagramme de blocs internes</strong> (ibd) : les blocs reliés par leurs <strong>ports</strong>, chaque connecteur portant la nature du flux (36 V continu, couple et vitesse, air comprimé, signal 0–5 V, trame) : on y lit les <strong>interfaces</strong>.</li>
    <li><strong>Diagramme des exigences</strong> (req) : la relation « satisfy » relie une exigence au bloc qui la satisfait.</li>
  </ul>

  <div class="prop-box">
    <strong>Interfaces compatibles.</strong> Deux blocs reliés dans l'ibd doivent être compatibles sur ce qui passe par leur port commun : <em>nature</em> du flux (tension continue ou alternative, fluide, mouvement de rotation ou de translation), <em>niveaux</em> (tension, courant, pression, couple, vitesse maximaux) et, pour l'information, <em>format</em> (signal tout ou rien, analogique 0–10 V ou 4–20 mA, numérique, protocole). Beaucoup d'erreurs de choix viennent d'une interface oubliée : capteur 0–10 V sur une entrée 0–3,3 V, moteur 48 V sur une batterie 36 V.
  </div>

  <div class="method-box">
    <strong>Exemple — Allouer les exigences d'un vélo à assistance électrique (VAE)</strong>
    <p>Extrait du cahier des charges : (E1) assister le cycliste jusqu'à 25 km/h ; (E2) autonomie d'au moins 50 km en assistance moyenne ; (E3) assistance proportionnelle à l'effort de pédalage ; (E4) informer le cycliste du niveau de charge ; (E5) masse du kit inférieure à 6 kg.</p>
    <ol>
      <li><span class="step">Fonctions.</span> E1 : mesurer la vitesse, couper la consigne au-delà de 25 km/h. E2 : stocker l'énergie. E3 : mesurer le couple de pédalage et produire un couple d'assistance. E4 : estimer et afficher la charge.</li>
      <li><span class="step">Allocation.</span> E1 → capteur de vitesse de roue + calculateur ; E2 → batterie (et rendement de toute la chaîne de puissance) ; E3 → capteur de couple au pédalier, calculateur, onduleur, moteur, réducteur ; E4 → mesure de la tension et du courant de batterie, calculateur, afficheur ; E5 → partagée entre tous les blocs (bilan de masse).</li>
      <li><span class="step">Lecture.</span> Une exigence peut être allouée à plusieurs blocs (E3, E5), un bloc en satisfaire plusieurs (le calculateur) : un tableau d'allocation (exigences en lignes, blocs en colonnes) montre qu'aucune exigence n'est orpheline.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : choisir un composant avant d'avoir écrit l'architecture fonctionnelle, et oublier une fonction (la coupure à 25 km/h, imposée par la réglementation) ou un flux (le courant de batterie, sans lequel l'état de charge est mal estimé).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CRITÈRES DE CHOIX ET MATRICE DE DÉCISION</div>
  <h2>Comparer des solutions de façon argumentée</h2>
  <div class="intro">Une même fonction admet presque toujours plusieurs solutions : vérin pneumatique, électrique ou hydraulique, batterie ou supercondensateur. On fixe des critères tirés du cahier des charges, on les hiérarchise, puis on note chaque solution.</div>

  <h3>Les critères usuels</h3>
  <p>Le programme cite, sans exhaustivité : l'<strong>autonomie énergétique</strong>, le <strong>coût</strong> (achat, intégration, énergie, maintenance), la <strong>durée de vie</strong>, l'<strong>encombrement</strong> et la masse, l'<strong>impact environnemental</strong>, la <strong>précision</strong> et la <strong>rapidité</strong>, le <strong>rendement</strong>, la <strong>réversibilité</strong> (§4, §6), la <strong>résistance</strong> et le <strong>déplacement</strong> (tenue mécanique et déformations, chapitre « Résistance des matériaux »). À chaque critère sont associés un <strong>niveau</strong> (valeur visée) et une <strong>flexibilité</strong> (tolérance), comme dans le cahier des charges.</p>

  <div class="def-box">
    <strong>Critère éliminatoire</strong> : condition que toute solution doit remplir (effort minimal, tension disponible, norme de sécurité, absence d'huile en agroalimentaire). Une solution qui ne la remplit pas est écartée <em>avant</em> toute notation. <strong>Critère de comparaison</strong> : grandeur que l'on cherche à améliorer, affectée d'un <strong>poids</strong> \(p_j\) qui traduit son importance relative.
  </div>

  <div class="prop-box">
    <strong>Matrice de décision.</strong> Chaque solution \(i\) reçoit une note \(n_{ij}\) (par exemple de 1 à 5) sur chaque critère \(j\). Son score est la somme pondérée, souvent rapportée au score maximal :
    <div class="formula" data-nom="Score d'une matrice de décision">$$S_i = \sum_j p_j\,n_{ij} \qquad\qquad \frac{S_i}{n_{max}\sum_j p_j}\ \text{(en \%)}$$</div>
    On retient la solution de meilleur score, <strong>après</strong> avoir vérifié que le classement ne bascule pas pour une variation raisonnable des poids (analyse de sensibilité).
  </div>
  <p>Les poids viennent du cahier des charges ou d'une comparaison des critères deux à deux (un point au plus important de chaque paire ; poids = points + 1).</p>

  <div class="method-box">
    <strong>Exemple — Éjecteur d'un poste de tri</strong>
    <p>Il faut pousser des colis d'un convoyeur à l'autre : course 150 mm, effort 400 N, 30 cycles par minute, deux positions seulement. L'usine dispose d'un réseau d'air comprimé ; l'atelier est agroalimentaire (huile interdite) : critère éliminatoire qui écarte le vérin hydraulique. Restent un vérin pneumatique et un vérin électrique (moteur et vis à billes).</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
      <tr><th style="text-align:left">Critère</th><th>Poids</th><th>Pneumatique</th><th>Électrique</th></tr>
      <tr><td style="text-align:left">Coût d'achat et d'intégration</td><td>4</td><td>5</td><td>2</td></tr>
      <tr><td style="text-align:left">Rapidité (cadence)</td><td>4</td><td>5</td><td>3</td></tr>
      <tr><td style="text-align:left">Consommation d'énergie</td><td>3</td><td>1</td><td>5</td></tr>
      <tr><td style="text-align:left">Positions intermédiaires</td><td>1</td><td>1</td><td>5</td></tr>
      <tr><td style="text-align:left">Maintenance, durée de vie</td><td>3</td><td>4</td><td>4</td></tr>
      <tr><td style="text-align:left">Encombrement</td><td>2</td><td>4</td><td>3</td></tr>
      <tr><td style="text-align:left"><strong>Score sur 85</strong></td><td>17</td><td><strong>64</strong> (75 %)</td><td><strong>58</strong> (68 %)</td></tr>
    </table></div>
    <ol>
      <li><span class="step">Calcul.</span> Pneumatique : \(4\times5+4\times5+3\times1+1\times1+3\times4+2\times4 = 64\) ; électrique : \(8+12+15+5+12+6 = 58\). Le vérin pneumatique l'emporte : deux positions sur butées, cadence élevée, air déjà disponible.</li>
      <li><span class="step">Sensibilité.</span> Si l'entreprise porte le poids de la consommation d'énergie de 3 à 5 (politique de réduction des consommations), les scores deviennent 66 et 68 : le classement s'inverse. La décision dépend donc d'un poids qu'il faut justifier ; on l'écrit dans le dossier de conception.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : laisser une note très basse sur un critère essentiel être « compensée » par de bonnes notes ailleurs. Une exigence impérative s'écrit en critère éliminatoire, pas en critère pondéré. Autre piège : des notes trop proches (3 et 3,5) donnent une précision illusoire ; un écart de quelques pour cent entre deux scores ne départage rien.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ALIMENTER ET STOCKER L'ÉNERGIE</div>
  <h2>Sources, batteries et autres réservoirs d'énergie</h2>
  <div class="intro">Un système fixe est raccordé à un réseau ; un système mobile emporte son énergie, et l'autonomie devient un critère de premier rang. Des dispositifs de stockage lissent aussi les pointes de puissance ou récupèrent l'énergie de freinage.</div>
  <p><strong>Réseaux</strong> : électrique, monophasé 230 V pour quelques kW, triphasé 400 V au-delà (« Régimes alternatifs, redresseurs et onduleurs »), avec une alimentation 24 V continue pour l'automatisme ; pneumatique, à 6–7 bar relatifs, par un compresseur et son réservoir ; hydraulique, à 100–350 bar, par une centrale (bâche, pompe, limiteur de pression, filtre, §5).</p>

  <h3>Batteries électrochimiques</h3>
  <div class="def-box">
    Une batterie est une association de <strong>cellules</strong> (ou éléments). Ses caractéristiques de catalogue :
    <ul style="margin:.4rem 0">
      <li><strong>tension nominale</strong> \(U_n\) : 3,6 V par cellule lithium-ion, 2 V au plomb, 1,2 V en nickel-hydrure métallique ;</li>
      <li><strong>capacité</strong> \(Q\) : charge débitable, en <strong>ampère-heure</strong> (1 A·h = 3 600 C) ;</li>
      <li><strong>énergie</strong> \(W = U_n\,Q\), en <strong>watt-heure</strong> (1 W·h = 3 600 J), et énergie massique (W·h/kg) ;</li>
      <li><strong>courant maximal</strong>, souvent en multiple de la capacité : « 2C » vaut 6,8 A pour une cellule de 3,4 A·h ;</li>
      <li><strong>durée de vie</strong> : nombre de cycles, à profondeur de décharge donnée, avant que la capacité tombe à 80 %.</li>
    </ul>
  </div>

  <div class="prop-box">
    <strong>Association de cellules.</strong> \(n_s\) cellules en série additionnent leurs tensions ; \(n_p\) branches en parallèle additionnent leurs capacités. Une batterie « \(n_s\,\text{s}\,n_p\,\text{p}\) » de cellules \((U_c, Q_c)\) a pour caractéristiques
    <div class="formula" data-nom="Batterie de cellules en série et en parallèle">$$U_n = n_s\,U_c \qquad Q = n_p\,Q_c \qquad W = U_n\,Q = n_s\,n_p\,U_c\,Q_c$$</div>
    L'énergie ne dépend que du nombre total de cellules ; la répartition série-parallèle fixe le couple (tension, courant) vu par le convertisseur.
  </div>

  <div class="prop-box">
    <strong>Autonomie.</strong> Si la chaîne de puissance absorbe une puissance moyenne \(P_{moy}\) côté batterie, et si l'on ne s'autorise qu'une fraction \(\delta\) de l'énergie (profondeur de décharge, réserve de sécurité) :
    <div class="formula" data-nom="Autonomie d'un système sur batterie">$$\Delta t = \frac{\delta\,W}{P_{moy}} \qquad\qquad P_{moy} = \frac{P_{utile}}{\eta_{chaîne}}$$</div>
    Pour un véhicule, avec une consommation \(c\) en W·h/km, la distance vaut \(d = \delta W/c\). La charge dure un peu plus de \(Q/I_{charge}\) (courant réduit en fin de charge).
  </div>

  <div class="method-box">
    <strong>Exemple — Batterie et autonomie du VAE</strong>
    <p>Batterie 10s4p de cellules lithium-ion 3,6 V – 3,4 A·h – 48 g. En assistance moyenne, le moteur fournit 120 W à la roue à 20 km/h ; le rendement de l'ensemble onduleur-moteur-réducteur vaut 0,80 ; on s'autorise 90 % de l'énergie.</p>
    <ol>
      <li><span class="step">Batterie.</span> \(U_n = 10\times3{,}6 = 36\ \text{V}\), \(Q = 4\times3{,}4 = 13{,}6\ \text{A·h}\), \(W = 36\times13{,}6 \approx 490\ \text{W·h}\) ; cellules : \(40\times48\ \text{g} = 1{,}92\ \text{kg}\) (255 W·h/kg, environ 175 avec boîtier et électronique).</li>
      <li><span class="step">Consommation.</span> \(P_{moy} = 120/0{,}80 = 150\ \text{W}\) côté batterie, soit \(c = 150/20 = 7{,}5\ \text{W·h/km}\).</li>
      <li><span class="step">Autonomie.</span> \(\Delta t = 0{,}9\times490/150 \approx 2{,}9\ \text{h}\), soit environ 59 km : l'exigence E2 (50 km) est satisfaite avec une marge de 18 %.</li>
      <li><span class="step">Courant.</span> \(I = 150/36 \approx 4{,}2\ \text{A}\), soit 0,31 C : large marge, même en côte. Charge sous 4 A : un peu plus de \(13{,}6/4 \approx 3{,}4\ \text{h}\).</li>
    </ol>
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un drone de 1,6 kg absorbe 220 W en vol stationnaire. Batterie 4s de 5 000 mA·h (3,7 V par cellule). Durée de vol si l'on garde 20 % de réserve ? Courant demandé ?</span>
    <div class="content">
      <p>\(U_n = 4\times3{,}7 = 14{,}8\ \text{V}\), \(W = 14{,}8\times5 = 74\ \text{W·h}\). Énergie utilisable \(0{,}8\times74 = 59{,}2\ \text{W·h}\), d'où \(\Delta t = 59{,}2/220 \approx 0{,}27\ \text{h}\), soit environ 16 min.</p>
      <p>Courant : \(I = 220/14{,}8 \approx 15\ \text{A}\), soit 3C ; les manœuvres demandent bien plus. Les cellules de drone admettent 20C à 50C : ici, c'est la puissance, et non l'énergie, qui oriente le choix.</p>
    </div>
  </div>

  <h3>Autres dispositifs de stockage</h3>
  <div class="prop-box">
    <strong>Énergie stockée.</strong> Chaque dispositif stocke une énergie « potentielle » ou « cinétique » de son domaine (voir le tableau des analogies de « Modélisation multiphysique ») :
    <div class="formula" data-nom="Supercondensateur et volant d'inertie">$$W_{sc} = \frac12\,C\,U^2 \qquad\qquad W_{vol} = \frac12\,J\,\omega^2$$</div>
    On ne les vide pas complètement (le convertisseur cesse de fonctionner à tension ou vitesse trop basse) : entre \(U_{max}\) et \(U_{max}/2\) (ou \(\omega_{max}\) et \(\omega_{max}/2\)), on récupère
    <div class="formula" data-nom="Énergie utile entre la valeur maximale et sa moitié">$$W_{utile} = \frac12\,C\left(U_{max}^2 - \frac{U_{max}^2}{4}\right) = \frac34\,W_{max}$$</div>
  </div>

  <div class="def-box">
    <strong>Accumulateur hydraulique</strong> : réservoir où une membrane sépare l'huile d'un volume d'azote gonflé à \(p_0\) (volume \(V_0\)) ; le gaz comprimé repousse l'huile quand la pression du circuit baisse. Cycles lents : gaz isotherme, \(p\,V = p_0\,V_0\), en pressions absolues (à plusieurs dizaines de bar, l'écart avec les pressions relatives des catalogues reste de l'ordre du pourcent).
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Volume d'huile restitué et énergie d'un accumulateur entre deux pressions</span>
    <div class="content">
      <p>Entre la pression haute \(p_2\) et la pression basse \(p_1\), le gaz passe de \(V_2 = p_0V_0/p_2\) à \(V_1 = p_0V_0/p_1\), d'où le volume restitué</p>
      <div class="formula" data-nom="Volume restitué par un accumulateur hydraulique">$$\Delta V = V_1 - V_2 = p_0\,V_0\left(\frac{1}{p_1}-\frac{1}{p_2}\right)$$</div>
      <p>et l'énergie, travail du gaz qui se détend :</p>
      <div class="formula">$$W = \int_{V_2}^{V_1} \frac{p_0V_0}{V}\,\mathrm{d}V = p_0\,V_0\,\ln\frac{V_1}{V_2} = p_0\,V_0\,\ln\frac{p_2}{p_1}$$</div>
      <p>Exemple : \(V_0 = 4\ \text{L}\) gonflé à 90 bar, utilisé entre 200 et 120 bar : \(V_2 = 1{,}8\ \text{L}\), \(V_1 = 3{,}0\ \text{L}\), \(\Delta V = 1{,}2\ \text{L}\) ; \(W = 9\times10^{6}\times4\times10^{-3}\times\ln(5/3) \approx 18\ \text{kJ}\).</p>
    </div>
  </div>

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th>Dispositif</th><th>Énergie massique</th><th>Cycles</th><th>Usages</th></tr>
    <tr><td>Batterie lithium-ion</td><td>150 à 250 W·h/kg</td><td>500 à quelques milliers</td><td>véhicules, robots mobiles, drones</td></tr>
    <tr><td>Batterie au plomb</td><td>30 à 40 W·h/kg</td><td>quelques centaines</td><td>démarrage, secours</td></tr>
    <tr><td>Supercondensateur</td><td>3 à 8 W·h/kg</td><td>de l'ordre du million</td><td>freinage récupératif, pointes</td></tr>
    <tr><td>Volant d'inertie</td><td>5 à 50 W·h/kg</td><td>très grand</td><td>alimentation sans coupure</td></tr>
    <tr><td>Accumulateur hydraulique</td><td>de l'ordre de 1 W·h/kg</td><td>très grand</td><td>pointes de débit, maintien en pression</td></tr>
  </table></div>
  <p>Ordres de grandeur : les batteries stockent beaucoup d'énergie mais acceptent mal les fortes puissances et les cycles très nombreux ; supercondensateurs, volants et accumulateurs font l'inverse.</p>

  <div class="method-box">
    <strong>Exemple — Supercondensateurs ou volant pour des pointes répétées</strong>
    <ol>
      <li><span class="step">Supercondensateur.</span> Module 48 V – 165 F : \(\tfrac12\times165\times48^2 \approx 190\ \text{kJ}\) (53 W·h), dont 143 kJ utiles entre 48 et 24 V. Dix fois moins que la batterie du VAE, pour une masse plusieurs fois supérieure, mais des centaines d'ampères et un million de cycles.</li>
      <li><span class="step">Volant.</span> Disque d'acier de 50 kg, rayon 0,25 m (\(J = \tfrac12 mR^2 \approx 1{,}56\ \text{kg·m}^2\)), à 3 000 tr/min : \(\tfrac12\times1{,}56\times314^2 \approx 77\ \text{kJ}\), dont 58 kJ utiles jusqu'à 1 500 tr/min, avec un moteur-générateur et un convertisseur réversibles.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : confondre capacité et énergie. 10 A·h sous 12 V font 120 W·h, sous 48 V, 480 W·h : le « mA·h » des documentations est une charge, pas une énergie.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · MODULER ET CONVERTIR</div>
  <h2>Associer un préactionneur et un actionneur</h2>
  <div class="intro">L'actionneur convertit l'énergie en énergie mécanique ; le préactionneur dose cette énergie selon les ordres reçus. On les choisit ensemble : caractéristiques et réversibilité compatibles.</div>

  <div class="def-box">
    <strong>Préactionneur (modulateur, distributeur)</strong> : constituant qui distribue l'énergie à l'actionneur. Il fonctionne <strong>en tout ou rien</strong> (contacteur, relais, distributeur à deux positions) ou de façon <strong>continue</strong> (hacheur, onduleur, variateur de vitesse, distributeur proportionnel). <strong>Actionneur (convertisseur)</strong> : constituant qui transforme l'énergie reçue en énergie mécanique (moteur électrique, vérin, moteur hydraulique) ou thermique (résistance chauffante).
  </div>

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th>Actionneur</th><th>Préactionneur usuel</th><th>Fonctionnement</th></tr>
    <tr><td>Machine à courant continu</td><td>hacheur (pont en H)</td><td>4 quadrants</td></tr>
    <tr><td>Machine asynchrone</td><td>contacteur ou variateur</td><td>vitesse fixe ; 4 quadrants avec variateur</td></tr>
    <tr><td>Machine synchrone à aimants</td><td>onduleur autopiloté</td><td>4 quadrants</td></tr>
    <tr><td>Moteur pas à pas</td><td>commande séquentielle des phases</td><td>positionnement en boucle ouverte</td></tr>
    <tr><td>Vérin pneumatique</td><td>distributeur</td><td>tout ou rien entre butées</td></tr>
    <tr><td>Vérin, moteur hydraulique</td><td>distributeur, proportionnel ou non</td><td>efforts très élevés</td></tr>
  </table></div>
  <p>Modèles et commande : « Convertisseurs statiques », « Les hacheurs », « Machine à courant continu », « Régimes alternatifs, redresseurs et onduleurs », « Machines synchrone et asynchrone » (§9 : comparaison des moteurs).</p>

  <h3>Réversibilité de la chaîne de puissance</h3>
  <div class="prop-box">
    <strong>Chaîne réversible.</strong> Quand la charge est <strong>entraînante</strong> (masse qui descend, inertie qu'on freine), l'énergie remonte vers la source. Elle n'y parvient que si <strong>chaque maillon</strong> est réversible : transmetteur (§6), actionneur (la machine électrique devient génératrice), préactionneur réversible en courant (pont en H, onduleur), source capable de recevoir (batterie oui ; redresseur à diodes, pile, réseau d'air non). Sinon, il faut dissiper l'énergie (résistance de freinage, frein, limiteur de pression).
  </div>
  <div class="method-box">
    <strong>Exemple — Récupérer l'énergie en descente</strong>
    <p>Un VAE à moteur-roue sans réducteur peut recharger sa batterie en freinant. Avec réducteur, le moteur-roue comporte en général une <strong>roue libre</strong> (le cycliste n'entraîne pas le moteur) : la chaîne n'est plus réversible. Sur un pont roulant à variateur muni d'un redresseur à diodes, l'énergie de descente fait monter la tension du bus continu : un hacheur de freinage la dissipe dans une résistance.</p>
  </div>

  <h3>Domaines d'application des trois technologies</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th></th><th>Électrique</th><th>Pneumatique</th><th>Hydraulique</th></tr>
    <tr><td>Pression</td><td>—</td><td>4 à 8 bar</td><td>100 à 350 bar</td></tr>
    <tr><td>Efforts</td><td>jusqu'à des dizaines de kN</td><td>jusqu'à 30 kN environ</td><td>jusqu'à plusieurs MN</td></tr>
    <tr><td>Positionnement</td><td>précis, programmable</td><td>sur butées</td><td>bon (proportionnel)</td></tr>
    <tr><td>Rendement global</td><td>0,7 à 0,9</td><td>souvent sous 0,2</td><td>0,5 à 0,8</td></tr>
    <tr><td>Points faibles</td><td>effort massique, frein à l'arrêt</td><td>bruit, fuites, énergie chère</td><td>fuites d'huile, centrale</td></tr>
  </table></div>
  <div class="notice"><strong>Ordre de grandeur</strong> : un vérin de 63 mm d'alésage développe 1,9 kN sous 6 bar, 62 kN sous 200 bar. Cette puissance massique réserve l'hydraulique aux engins, aux presses et à l'aéronautique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PNEUMATIQUE ET HYDRAULIQUE</div>
  <h2>Lire un schéma, dimensionner un vérin et sa source</h2>
  <div class="intro">Les circuits à fluide sont décrits par des schémas normalisés, où chaque symbole montre une fonction et non une forme. On doit les lire (norme fournie), puis en tirer efforts, vitesses, débits et puissances.</div>
  <ul>
    <li><strong>Vérin simple effet</strong> (retour par ressort ou par la charge) ou <strong>double effet</strong> (deux chambres ; côté tige, section annulaire).</li>
    <li><strong>Distributeur</strong> (préactionneur) : désigné par ses orifices et positions (un 5/2 a cinq orifices, deux positions), ses commandes (bobine, manuelle, pneumatique) et son rappel. <strong>Monostable</strong> : revient seul au repos ; <strong>bistable</strong> : garde sa dernière position (mémoire en cas de coupure).</li>
    <li><strong>Limiteur de débit unidirectionnel</strong> : étranglement réglable en parallèle avec un clapet anti-retour ; il règle la vitesse d'un vérin dans un seul sens.</li>
    <li><strong>Limiteur de pression</strong> : renvoie l'huile à la bâche au-delà de son réglage et protège le circuit. <strong>Pompe</strong> et <strong>moteur</strong> hydrauliques, <strong>compresseur</strong>.</li>
  </ul>

  <div class="def-box">
    <strong>Lire un distributeur.</strong> Une case par position ; flèches = passages, « T » = orifice obturé. Les conduites sont raccordées à la case de <strong>repos</strong> (celle du ressort pour un monostable) ; pour l'effet d'une commande, on fait glisser la case voisine de cette commande en face des raccordements. Orifices : en pneumatique 1 alimentation, 2 et 4 utilisations, 3 et 5 échappements ; en hydraulique P, T (retour à la bâche), A et B.
  </div>

  <h3>Effort et vitesse d'un vérin</h3>
  <div class="prop-box">
    <strong>Vérin idéal.</strong> Pour un vérin d'alésage \(D\) et de diamètre de tige \(d\), alimenté sous la pression relative \(p\) (l'autre chambre à l'échappement) par un débit volumique \(Q_v\) :
    <div class="formula" data-nom="Effort et vitesse d'un vérin">$$F_{sortie} = p\,\frac{\pi D^2}{4} \qquad F_{rentrée} = p\,\frac{\pi\,(D^2-d^2)}{4} \qquad v = \frac{Q_v}{S}$$</div>
    où \(S\) est la section alimentée ; le vérin idéal transmet toute la puissance \(p\,Q_v = F\,v\).
  </div>
  <p>Frottements des joints et contre-pression réduisent l'effort réel : pour un vérin pneumatique en mouvement, on vise un <strong>taux de charge</strong> \(F_{charge}/F_{théorique}\) de 0,5 à 0,7.</p>

  <div class="prop-box">
    <strong>Consommation d'air.</strong> Les chambres se remplissent à la pression absolue \(p + p_{atm}\) ; ramené à la pression atmosphérique (litres normaux, NL), l'air consommé par aller-retour de course \(c\) vaut
    <div class="formula" data-nom="Consommation d'air d'un vérin double effet">$$V_{N} = \left(S + S_a\right)c\;\frac{p + p_{atm}}{p_{atm}}$$</div>
    avec \(S_a = \pi(D^2-d^2)/4\). Sous 6 bar relatifs, chaque litre de chambre consomme environ 7 NL.
  </div>

  <div class="method-box">
    <strong>Exemple — Vérin pneumatique d'éjection</strong>
    <p>Vérin double effet \(D = 50\ \text{mm}\), \(d = 20\ \text{mm}\), course 200 mm, réseau à 6 bar, 10 cycles par minute ; charge à pousser 600 N.</p>
    <ol>
      <li><span class="step">Efforts.</span> \(S = \pi\times0{,}025^2 \approx 19{,}6\ \text{cm}^2\) : \(F_{sortie} = 6\times10^{5}\times19{,}6\times10^{-4} \approx 1\,180\ \text{N}\). \(S_a \approx 16{,}5\ \text{cm}^2\) : \(F_{rentrée} \approx 990\ \text{N}\).</li>
      <li><span class="step">Taux de charge.</span> \(600/1\,180 \approx 0{,}51\) : convenable.</li>
      <li><span class="step">Consommation.</span> \((19{,}6+16{,}5)\times20\ \text{cm}^3 \approx 0{,}72\ \text{L}\), soit environ 5,0 NL par cycle et 50 NL/min à fournir par le réseau.</li>
    </ol>
  </div>

  <h3>Pompes et moteurs hydrauliques</h3>
  <div class="prop-box">
    <strong>Cylindrée.</strong> Une pompe ou un moteur volumétrique déplace la cylindrée \(V_{cyl}\) (cm³/tr) à chaque tour. À \(N\) tr/s, sous la différence de pression \(\Delta p\) :
    <div class="formula" data-nom="Pompe et moteur hydrauliques">$$Q_v = V_{cyl}\,N \qquad\qquad C = \frac{\Delta p\,V_{cyl}}{2\pi}$$</div>
    Ces relations sont idéales : avec un rendement volumétrique \(\eta_v\) et un rendement global \(\eta\), une pompe débite réellement \(Q_v = \eta_v V_{cyl} N\) et absorbe \(P_{méca} = \Delta p\,Q_v/\eta\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Couple d'un moteur hydraulique idéal</span>
    <div class="content">
      <p>Sans pertes, \(\Delta p\,Q_v = C\,\omega\) avec \(Q_v = V_{cyl}\,\omega/(2\pi)\), d'où \(C = \Delta p\,V_{cyl}/(2\pi)\). Autrement dit, sur un tour, le travail \(\Delta p\,V_{cyl}\) du fluide vaut \(2\pi\,C\).</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — Presse hydraulique d'atelier</strong>
    <p>Vérin d'alésage 100 mm, pression maximale 200 bar (réglage du limiteur de pression), pompe de 12 L/min.</p>
    <ol>
      <li><span class="step">Effort maximal.</span> \(S = \pi\times0{,}05^2 \approx 7{,}85\times10^{-3}\ \text{m}^2\), \(F = 2\times10^{7}\times7{,}85\times10^{-3} \approx 157\ \text{kN}\) (environ 16 tonnes-force).</li>
      <li><span class="step">Vitesse.</span> \(Q_v = 12\ \text{L/min} = 2\times10^{-4}\ \text{m}^3/\text{s}\), \(v = Q_v/S \approx 25\ \text{mm/s}\) : une course de 300 mm prend environ 12 s.</li>
      <li><span class="step">Moteur de la pompe.</span> \(p\,Q_v = 2\times10^{7}\times2\times10^{-4} = 4\ \text{kW}\) ; rendement de pompe 0,85 : 4,7 kW, d'où un moteur asynchrone normalisé de 5,5 kW.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre la pression absolue dans \(F = pS\). L'effort vient de la <strong>différence</strong> de pression entre les faces du piston (pression relative des catalogues) ; seule la consommation d'air se calcule en pression absolue.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TRANSMETTRE : CARACTÉRISTIQUES ET RÉVERSIBILITÉ</div>
  <h2>Choisir un transmetteur de puissance</h2>
  <div class="intro">Le transmetteur adapte vitesse et couple au besoin de l'effecteur, transforme parfois une rotation en translation, et transmet la puissance avec un rendement. Trois caractéristiques guident son choix : rapport, rendement, réversibilité.</div>

  <div class="def-box">
    <strong>Rapport de transmission</strong> : \(k = \omega_s/\omega_e\) pour une transmission de rotation (noté \(k\) comme dans « Machines synchrone et asynchrone » ; \(k \lt 1\) pour un réducteur). Pour une transformation de mouvement, on définit de même \(v = \lambda\,\omega_e\) : \(\lambda = p/(2\pi)\) pour une vis de pas \(p\), \(\lambda = R\) pour un pignon de rayon primitif \(R\) sur une crémaillère ou une poulie de rayon \(R\) entraînant une courroie. <strong>Rendement</strong> en marche motrice : \(\eta = P_s/P_e\).
  </div>
  <div class="prop-box">
    <strong>Couple et effort transmis.</strong> En régime permanent et en marche motrice (l'actionneur entraîne la charge) :
    <div class="formula" data-nom="Couple et effort transmis par un réducteur ou une vis">$$C_s = \frac{\eta}{k}\,C_e \qquad\qquad F = \frac{\eta}{\lambda}\,C_e = \frac{2\pi\,\eta}{p}\,C_e$$</div>
    Charge entraînante : la puissance va de la sortie vers l'entrée, \(P_e = \eta'\,P_s\) avec \(\eta'\) le rendement inverse (« Énergétique des systèmes de solides »).
  </div>

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th>Transmetteur</th><th>Rapport</th><th>Rendement</th><th>Réversible</th><th>Domaines</th></tr>
    <tr><td>Engrenages parallèles</td><td>1 à 1/6 par étage</td><td>0,95 à 0,98</td><td>oui</td><td>réducteurs, boîtes de vitesses</td></tr>
    <tr><td>Train épicycloïdal</td><td>1/3 à 1/10 par étage</td><td>0,95 à 0,97</td><td>oui</td><td>réducteurs compacts, robotique</td></tr>
    <tr><td>Roue et vis sans fin</td><td>1/5 à 1/100</td><td>0,4 à 0,9</td><td>selon l'hélice</td><td>grands rapports, renvoi d'angle</td></tr>
    <tr><td>Courroie crantée</td><td>1 à 1/5</td><td>0,95 à 0,98</td><td>oui</td><td>grands entraxes, axes linéaires</td></tr>
    <tr><td>Pignon-crémaillère</td><td>\(v = R\,\omega\)</td><td>0,9 à 0,97</td><td>oui</td><td>grandes courses</td></tr>
    <tr><td>Vis à billes</td><td>\(v = p\,\omega/2\pi\)</td><td>0,85 à 0,95</td><td>oui</td><td>axes précis, vérins électriques</td></tr>
    <tr><td>Vis trapézoïdale</td><td>\(v = p\,\omega/2\pi\)</td><td>0,2 à 0,5</td><td>souvent non</td><td>réglage, levage lent</td></tr>
  </table></div>
  <p>Engrenages, trains et courroies : « Transmission de puissance ». On détaille ici la réversibilité des transmetteurs à glissement.</p>

  <h3>Réversibilité d'une vis-écrou</h3>
  <div class="def-box">
    Une transmission est <strong>réversible</strong> si un effort sur la sortie peut mettre l'entrée en mouvement (la charge qui descend fait tourner la vis), <strong>irréversible</strong> sinon : elle maintient alors seule la charge à l'arrêt.
  </div>
  <div class="prop-box">
    <strong>Rendements d'une vis.</strong> Soit une vis de pas \(p\) et de diamètre moyen \(d_m\) : son angle d'hélice \(\alpha\) vérifie \(\tan\alpha = p/(\pi d_m)\). Avec un frottement de Coulomb de coefficient \(f = \tan\varphi\) entre les filets :
    <div class="formula" data-nom="Rendements direct et inverse d'une vis">$$\eta_d = \frac{\tan\alpha}{\tan(\alpha+\varphi)} \qquad\qquad \eta_i = \frac{\tan(\alpha-\varphi)}{\tan\alpha}$$</div>
    \(\eta_d\) : la vis entraîne l'écrou chargé ; \(\eta_i\) : la charge entraîne la vis. La vis est <strong>irréversible si et seulement si \(\alpha \le \varphi\)</strong> ; son rendement direct vaut alors au plus \(\tan\varphi/\tan 2\varphi = (1-\tan^2\varphi)/2\), donc <strong>moins de 50 %</strong>. Les mêmes formules valent pour une roue et vis sans fin menée par la vis, avec l'angle d'hélice de la vis.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le modèle du plan incliné</span>
    <div class="content">
      <p>Déroulé sur le diamètre moyen, le filet est un plan incliné d'angle \(\alpha\). L'écrou, chargé axialement par \(F\), est un patin poussé par la force tangentielle \(T = 2C/d_m\) ; la réaction du filet fait l'angle \(\varphi\) avec la normale, à l'opposé du glissement.</p>
      <p><strong>Montée</strong> : la réaction est inclinée de \(\alpha + \varphi\) sur l'axe, d'où \(T = F\tan(\alpha+\varphi)\) (sans frottement, \(F\tan\alpha\)). Avec \(v = v_t\tan\alpha\) :</p>
      <div class="formula">$$\eta_d = \frac{F\,v}{T\,v_t} = \frac{F\tan\alpha}{T} = \frac{\tan\alpha}{\tan(\alpha+\varphi)}$$</div>
      <p><strong>Descente</strong> : le glissement s'inverse, la force de retenue vaut \(T' = F\tan(\alpha-\varphi)\). Si \(\alpha \gt \varphi\), il faut retenir la vis et \(\eta_i = T'/(F\tan\alpha)\) ; si \(\alpha \le \varphi\), il faudrait la <em>pousser</em> : irréversible. Comme \(\eta_d\) croît avec \(\alpha\) sur cette plage, son maximum est \(\tan\varphi/\tan2\varphi = (1-\tan^2\varphi)/2 \lt 1/2\).</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — Vis trapézoïdale ou vis à billes pour un vérin électrique</strong>
    <ol>
      <li><span class="step">Vis trapézoïdale Tr 20×4</span> (diamètre moyen 18 mm, \(f = 0{,}15\)) : \(\tan\alpha = 4/(\pi\times18)\), \(\alpha \approx 4{,}0° \lt \varphi \approx 8{,}5°\) : irréversible, la charge tient sans frein. \(\eta_d = \tan4{,}0°/\tan12{,}6° \approx 0{,}32\) ; pour soulever 2 000 N, \(C = Fp/(2\pi\eta_d) \approx 4{,}0\ \text{N·m}\).</li>
      <li><span class="step">Vis à billes 20×5</span> (\(f \approx 0{,}005\), \(\varphi \approx 0{,}3°\)) : \(\alpha \approx 4{,}5° \gt \varphi\), donc réversible ; \(\eta_d \approx 0{,}94\) et \(\eta_i \approx 0{,}94\). Le même effort ne demande que \(C = 2\,000\times0{,}005/(2\pi\times0{,}94) \approx 1{,}7\ \text{N·m}\), malgré un pas plus long, mais la charge redescend dès que le moteur n'est plus alimenté : il faut un <strong>frein</strong> (souvent intégré au moteur, serré par ressort en l'absence de courant).</li>
    </ol>
  </div>

  <div class="notice"><strong>Irréversibilité et sécurité.</strong> Le frottement baisse en glissement et sous vibrations : une roue et vis sans fin d'hélice 5,7° est irréversible à l'arrêt (\(f = 0{,}12\), \(\varphi \approx 6{,}8°\)) mais réversible en mouvement si \(f\) tombe à 0,05 (\(\eta_i \approx 0{,}5\)). La sécurité d'une charge suspendue exige un frein ; et l'irréversibilité se paie d'un rendement faible.</div>

<div class="course-section">
  <div class="sec-num">§7 · RAPPORT DE TRANSMISSION ET MOTORISATION SUR UN CYCLE</div>
  <h2>Choisir le rapport, puis vérifier le moteur</h2>
  <div class="intro">Moteur et transmetteur se choisissent ensemble. Le rapport doit permettre la vitesse de la charge sans dépasser celle du moteur, et il fixe le couple d'accélération. Le couple calculé sur tout le cycle est ensuite comparé au couple crête et au couple nominal du moteur.</div>

  <h3>Le modèle ramené à l'arbre moteur</h3>
  <p>Inertie équivalente : « Cinétique et dynamique du solide (3D) », §7 ; équation du mouvement par le théorème de l'énergie cinétique : « Énergétique des systèmes de solides ». Moteur \(J_m\), transmetteur \(k\) et \(\eta\), charge \(J_c\) et couple résistant \(C_r\), en marche motrice :</p>
  <div class="formula" data-nom="Équation du mouvement ramenée à l'arbre moteur">$$\left(J_m + \frac{k^2 J_c}{\eta}\right)\frac{\mathrm{d}\omega_m}{\mathrm{d}t} = C_m - \frac{k\,C_r}{\eta}$$</div>
  <p>Pour une masse \(m\) en translation : \(m\lambda^2\) au lieu de \(k^2J_c\), \(\lambda F_r\) au lieu de \(k\,C_r\).</p>

  <div class="prop-box">
    <strong>Adaptation d'inertie.</strong> Pour une charge purement inertielle (\(C_r = 0\), \(\eta = 1\)) qui doit suivre une accélération \(\dot\omega_c\) imposée, le couple moteur nécessaire vaut
    <div class="formula" data-nom="Couple d'accélération et rapport optimal">$$C_m = \left(\frac{J_m}{k} + k\,J_c\right)\dot\omega_c \qquad\text{minimal pour}\qquad k_{opt} = \sqrt{\frac{J_m}{J_c}}$$</div>
    c'est-à-dire quand l'inertie de la charge ramenée sur l'arbre moteur, \(k^2J_c\), est <strong>égale</strong> à celle du rotor. Le couple minimal vaut alors \(2\sqrt{J_mJ_c}\,\dot\omega_c\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi un optimum ?</span>
    <div class="content">
      <p>Avec \(\omega_m = \omega_c/k\) : \(C_m = (J_m + k^2J_c)\,\dot\omega_c/k\). Un petit rapport fait tourner le moteur très vite (le couple sert à accélérer le rotor, terme \(J_m/k\)) ; un grand rapport lui renvoie l'inertie de la charge (terme \(kJ_c\)). La dérivée \((J_c - J_m/k^2)\,\dot\omega_c\) s'annule pour \(k^2 = J_m/J_c\) et change de signe : minimum.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — Table tournante d'un poste d'assemblage</strong>
    <p>Une table d'inertie \(J_c = 0{,}8\ \text{kg·m}^2\) doit tourner d'un quart de tour en 0,5 s (profil triangulaire : accélération constante puis décélération). Moteur : \(J_m = 2\times10^{-4}\ \text{kg·m}^2\), vitesse maximale 3 000 tr/min.</p>
    <ol>
      <li><span class="step">Mouvement de la table.</span> \(\theta = \tfrac14\dot\omega_c t^2\) sur un profil triangulaire de durée \(t\), d'où \(\dot\omega_c = 4\theta/t^2 = 4\times(\pi/2)/0{,}25 \approx 25{,}1\ \text{rad/s}^2\) et une vitesse maximale \(\omega_c = \dot\omega_c\,t/2 \approx 6{,}28\ \text{rad/s}\) (60 tr/min).</li>
      <li><span class="step">Optimum d'inertie.</span> \(k_{opt} = \sqrt{2\times10^{-4}/0{,}8} \approx 1/63\) : le moteur tournerait à 3 800 tr/min, trop vite.</li>
      <li><span class="step">Contrainte de vitesse.</span> \(k \ge 60/3\,000 = 1/50\). Avec \(k = 1/50\) : \(C_m = (2\times10^{-4}\times50 + 0{,}8/50)\times25{,}1 \approx 0{,}65\ \text{N·m}\), à peine plus que l'optimum (0,64 N·m). Avec \(k = 1/20\), il faudrait 1,1 N·m.</li>
    </ol>
    <p>Le minimum est plat : la vitesse maximale du moteur et les rapports du catalogue tranchent. Pour un servomoteur, on évite aussi une inertie ramenée de plus de quelques fois celle du rotor (asservissement moins précis).</p>
  </div>

  <h3>Dimensionner le moteur sur un cycle</h3>
  <div class="prop-box">
    <strong>Trois vérifications</strong> (détaillées dans « Machines synchrone et asynchrone », §9). Sur un cycle de période \(T\), le moteur doit fournir :
    <ul style="margin:.4rem 0">
      <li>la <strong>vitesse maximale</strong> : \(\omega_{m,max} \le\) vitesse maximale admissible ;</li>
      <li>le <strong>couple crête</strong> : \(\max|C_m(t)| \le C_{max}\), couple maximal admissible pendant un temps bref ;</li>
      <li>le <strong>couple thermique équivalent</strong> (couple efficace), qui fixe l'échauffement : il doit rester inférieur au couple nominal \(C_n\).</li>
    </ul>
    <div class="formula" data-nom="Couple thermique équivalent">$$C_{eff} = \sqrt{\frac{1}{T}\int_0^T C_m^2(t)\,\mathrm{d}t} = \sqrt{\frac{\sum_i C_i^2\,t_i}{T}} \ \le\ C_n$$</div>
    (couple \(C_i\) constant sur chaque phase de durée \(t_i\)). Les pertes Joule variant comme le carré du couple, \(C_{eff}\) est le couple constant qui échaufferait autant le moteur.
  </div>

  <div class="method-box">
    <strong>Exemple — Axe linéaire d'un robot de manutention</strong>
    <p>Un chariot de 60 kg (frottement de guidage 30 N) est déplacé horizontalement de 0,5 m par une vis à billes de pas 10 mm (\(\eta = 0{,}9\) dans les deux sens, inertie \(J_v = 1{,}2\times10^{-4}\ \text{kg·m}^2\)), accouplée directement au moteur (\(J_m = 1{,}5\times10^{-4}\ \text{kg·m}^2\)). Cycle : accélération 0,2 s, palier 0,6 s, décélération 0,2 s, arrêt 0,5 s, puis retour identique : \(T = 3\ \text{s}\).</p>
    <ol>
      <li><span class="step">Cinématique.</span> \(v_{max} = 0{,}5/0{,}8 = 0{,}625\ \text{m/s}\), \(a = 3{,}125\ \text{m/s}^2\). Moteur : \(\omega_m = 2\pi v/p \approx 393\ \text{rad/s}\) (3 750 tr/min), \(\dot\omega_m = 2\pi a/p \approx 1\,963\ \text{rad/s}^2\).</li>
      <li><span class="step">Accélération.</span> L'écrou pousse \(F = ma + F_f = 217{,}5\ \text{N}\) (marche motrice) ; couple d'inertie du rotor et de la vis : \((J_m+J_v)\dot\omega_m \approx 0{,}53\ \text{N·m}\). \(C_a = \dfrac{217{,}5\times0{,}01}{2\pi\times0{,}9} + 0{,}53 \approx 0{,}91\ \text{N·m}\).</li>
      <li><span class="step">Palier.</span> \(C_p = 30\times0{,}01/(2\pi\times0{,}9) \approx 0{,}053\ \text{N·m}\).</li>
      <li><span class="step">Décélération.</span> \(F = -ma + F_f = -157{,}5\ \text{N}\) : la charge entraîne la vis, le rendement passe au numérateur. \(C_d = \dfrac{-157{,}5\times0{,}01\times0{,}9}{2\pi} - 0{,}53 \approx -0{,}76\ \text{N·m}\).</li>
      <li><span class="step">Bilan.</span> Le retour donne les mêmes couples au signe près :</li>
    </ol>
    <div class="formula">$$C_{eff} = \sqrt{\frac{2\left(0{,}91^2\times0{,}2 + 0{,}053^2\times0{,}6 + 0{,}76^2\times0{,}2\right)}{3}} \approx 0{,}43\ \text{N·m}$$</div>
    <p>Il faut donc \(C_n \ge 0{,}43\ \text{N·m}\), \(C_{max} \ge 0{,}91\ \text{N·m}\) et 3 750 tr/min ; puissance crête \(C_a\,\omega_m \approx 360\ \text{W}\).</p>
  </div>

<div class="course-section">
  <div class="sec-num">§8 · CHAÎNE D'INFORMATION : CHOISIR UN CAPTEUR</div>
  <h2>Technologie, caractéristiques métrologiques, dimensionnement</h2>
  <div class="intro">Un capteur se choisit par la grandeur à mesurer et l'usage de la mesure, puis par ses caractéristiques métrologiques, comparées au cahier des charges. Principes physiques : « Capteurs et chaîne de mesure » (1ʳᵉ année).</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th>Grandeur mesurée</th><th>Technologies courantes</th><th>Signal de sortie</th></tr>
    <tr><td>Présence</td><td>contact, détecteur inductif, capacitif, photoélectrique</td><td>tout ou rien</td></tr>
    <tr><td>Position, angle</td><td>potentiomètre, codeur incrémental ou absolu, règle optique, effet Hall</td><td>analogique, impulsions, mot</td></tr>
    <tr><td>Distance</td><td>ultrasons, laser à temps de vol</td><td>analogique, numérique</td></tr>
    <tr><td>Vitesse</td><td>génératrice tachymétrique, codeur</td><td>analogique, impulsions</td></tr>
    <tr><td>Accélération, rotation</td><td>accéléromètre, gyromètre MEMS</td><td>numérique</td></tr>
    <tr><td>Effort, couple, pression</td><td>jauges de déformation</td><td>quelques mV, à amplifier</td></tr>
    <tr><td>Température</td><td>thermocouple, sonde platine, thermistance</td><td>analogique</td></tr>
  </table></div>
  <p>Signal <strong>tout ou rien</strong>, <strong>analogique</strong> (0–10 V, ou 4–20 mA, insensible à la résistance des câbles et révélant une coupure, puisque 0 mA est impossible) ou <strong>numérique</strong> (impulsions, liaison série, bus) ; support : fil, fibre optique, radio.</p>

  <h3>Caractéristiques métrologiques</h3>
  <div class="def-box">
    <ul style="margin:.2rem 0">
      <li><strong>Étendue de mesure</strong> (EM) : plage du mesurande où les caractéristiques sont garanties.</li>
      <li><strong>Sensibilité</strong> : \(S = \Delta s/\Delta m\), pente de la caractéristique (V/mm, mV/N…).</li>
      <li><strong>Résolution</strong> : plus petite variation du mesurande qui modifie la sortie de façon perceptible.</li>
      <li><strong>Linéarité</strong> : écart maximal à la meilleure droite, en % de l'EM.</li>
      <li><strong>Justesse</strong> : la <em>moyenne</em> de mesures répétées est proche de la valeur vraie ; le biais est une erreur <strong>systématique</strong>, corrigée par étalonnage.</li>
      <li><strong>Fidélité</strong> : les mesures répétées sont proches entre elles ; la dispersion (écart-type) est une erreur <strong>aléatoire</strong>.</li>
      <li><strong>Précision</strong> (exactitude) : juste <em>et</em> fidèle ; donnée en \(\pm\) % de l'EM ou de la valeur lue.</li>
      <li><strong>Rapidité</strong> : temps de réponse ou bande passante.</li>
    </ul>
  </div>

  <div class="prop-box">
    <strong>Dimensionner la chaîne de mesure.</strong>
    <ol style="margin:.4rem 0">
      <li>EM couvrant les valeurs extrêmes, sans excès (les erreurs en % de l'EM grandissent avec elle).</li>
      <li>Résolution 4 à 10 fois plus fine que la tolérance.</li>
      <li>Erreur majorée par la somme des contributions de la documentation (linéarité, hystérésis, dérive, quantification), inférieure à la tolérance.</li>
      <li>Rapidité suffisante, sortie compatible avec la carte (§9).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — Capteur d'effort d'une presse d'emmanchement</strong>
    <p>On veut mesurer un effort de 0 à 400 N à \(\pm2\ \text{N}\). Cellule de charge retenue : EM 0–500 N, sensibilité 2 mV/V (sous une alimentation de 10 V, 20 mV à pleine échelle), non-linéarité \(\pm0{,}03\) % EM, hystérésis \(\pm0{,}02\) % EM. Entrée analogique de la carte : 0–3,3 V, 12 bits.</p>
    <ol>
      <li><span class="step">Conditionnement.</span> Un amplificateur de gain \(3{,}3/0{,}020 = 165\) étale les 20 mV sur toute la plage du convertisseur.</li>
      <li><span class="step">Résolution.</span> \(q = 3{,}3/2^{12} \approx 0{,}81\ \text{mV}\), soit \(500/4\,096 \approx 0{,}12\ \text{N}\) : seize fois plus fin que la tolérance.</li>
      <li><span class="step">Erreur maximale.</span> Linéarité 0,15 N, hystérésis 0,10 N, quantification 0,12 N : 0,37 N, bien sous 2 N. Zéro et gain sont corrigés par étalonnage (tarage, masse connue).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — Codeur d'un axe à vis à billes</strong>
    <p>L'axe du §7 (pas 10 mm, 3 750 tr/min) doit se positionner à \(\pm0{,}02\ \text{mm}\) : on vise 0,005 mm. Un codeur incrémental de \(N\) points, lu sur les fronts de ses deux voies en quadrature, donne \(4N\) incréments par tour.</p>
    <ol>
      <li><span class="step">Nombre de points.</span> \(p/(4N) \le 0{,}005\ \text{mm}\) impose \(N \ge 10/(4\times0{,}005) = 500\) points par tour.</li>
      <li><span class="step">Comptage.</span> \(2\,000\times62{,}5 = 125\,000\) incréments par seconde : il faut un compteur matériel d'au moins 125 kHz sur la carte.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : confondre résolution et précision. Le codeur du moteur résout 5 µm mais ne voit ni les erreurs de pas de la vis, ni sa dilatation : mesure indirecte, défaut de justesse. Pour quelques micromètres, on mesure le chariot avec une règle optique.</div>
  <p><strong>Justifier un choix de capteur</strong> : grandeur et usage (tout ou rien ou mesure ; position absolue, ou incrémentale avec prise d'origine), étendue, précision, résolution, rapidité, contact ou non, environnement (température, poussières, eau, perturbations électromagnétiques), sortie compatible, encombrement, coût.</p>
</div>

<div class="course-section">
  <div class="sec-num">§9 · CARTE DE COMMANDE ET COMMUNICATION</div>
  <h2>Entrées-sorties, résolution, mémoire, débit</h2>
  <div class="intro">La carte de commande lit les capteurs, exécute la loi de commande et pilote les préactionneurs ; la communication fait circuler l'information. Leur dimensionnement repose sur des comptes simples : entrées-sorties, bits, octets, bits par seconde.</div>
  <ul>
    <li><strong>Familles</strong> : carte à microcontrôleur (embarqué), nano-ordinateur (images, réseau), automate programmable industriel (24 V, robustesse), cartes spécialisées (variateur, contrôleur de vol).</li>
    <li><strong>Entrées-sorties</strong> : tout ou rien (3,3, 5 ou 24 V), analogiques (plage, nombre de bits), sorties à modulation de largeur d'impulsion, compteurs rapides, interruptions.</li>
    <li><strong>Calcul</strong> : tout doit tenir dans la période d'échantillonnage (« Systèmes numériques — acquisition, filtrage et commande ») ; puis <strong>mémoire</strong>, <strong>communication</strong>, alimentation, environnement, coût.</li>
  </ul>

  <div class="prop-box">
    <strong>Résolution d'une entrée analogique</strong> (« Systèmes numériques », §3) : \(q = \Delta s/2^N\) pour \(N\) bits sur la plage \(\Delta s\), soit \(q/S\) sur la grandeur mesurée (\(S\) : sensibilité du capteur et du conditionnement). Le conditionnement étale le signal utile sur toute la plage (gain, décalage, pont diviseur pour un 0–10 V sur une entrée 0–3,3 V).
  </div>

  <h3>Mémoire</h3>
  <div class="def-box">
    <strong>Mémoire de programme</strong> (flash, non volatile) : code. <strong>Mémoire vive</strong> (RAM, volatile) : variables, tampons. <strong>Stockage</strong> (EEPROM, carte SD) : réglages, enregistrements. 1 octet = 8 bits ; 1 ko = 1 000 octets, 1 kio = 1 024 octets (souvent noté « ko » dans les documentations).
  </div>
  <div class="prop-box">
    <strong>Taille d'un enregistrement.</strong> \(n_v\) voies échantillonnées à \(f_e\), chaque échantillon codé sur \(n_o\) octets, pendant \(\Delta t\) :
    <div class="formula" data-nom="Taille d'un enregistrement de mesures">$$M = n_v\,n_o\,f_e\,\Delta t$$</div>
    Un échantillon de 10 à 16 bits occupe 2 octets.
  </div>
  <div class="method-box">
    <strong>Exemple — Enregistrer un essai sur un axe</strong>
    <p>On veut enregistrer 4 grandeurs (position, vitesse, courant, effort) codées sur 16 bits à 2 kHz pendant 30 s, sur une carte qui dispose de 256 kio de RAM.</p>
    <ol>
      <li><span class="step">Volume.</span> \(M = 4\times2\times2\,000\times30 = 480\,000\) octets, soit 480 ko.</li>
      <li><span class="step">Comparaison.</span> 256 kio = 262 144 octets : l'essai ne tient pas en mémoire vive, même sans compter les autres variables du programme.</li>
      <li><span class="step">Solutions.</span> Écrire au fil de l'eau sur une carte SD (la RAM sert de tampon), ou réduire durée, fréquence (Shannon) ou nombre de voies.</li>
    </ol>
  </div>

  <h3>Débit de communication</h3>
  <div class="def-box">
    <strong>Débit binaire</strong> \(D\) : bits transmis par seconde. Une <strong>trame</strong> ajoute aux données des champs de service (début, adresse, longueur, contrôle d'erreur, fin) ; son <strong>efficacité</strong> est le rapport des bits utiles aux bits transmis, d'où le <strong>débit utile</strong>.
  </div>
  <div class="prop-box">
    <strong>Condition de débit.</strong> Une trame de \(n_t\) bits dure \(t_t = n_t/D\). Envoyer \(f\) trames par seconde sur une liaison n'est possible que si
    <div class="formula" data-nom="Condition de débit d'une liaison">$$n_t\,f \le D \qquad\Longleftrightarrow\qquad f\,t_t \le 1$$</div>
    \(f\,t_t\) est le taux d'occupation ; sur un bus partagé (multiplexage temporel), on additionne les besoins et l'on garde une marge (50 à 70 % au plus). La transmission ajoute aussi un retard dans la boucle.
  </div>
  <div class="method-box">
    <strong>Exemple — Centrale inertielle d'un drone</strong>
    <p>6 mesures sur 16 bits, en trames de 2 octets d'en-tête, 12 de données et 2 de contrôle, sur une liaison série à 115 200 bit/s où chaque octet occupe 10 bits (bits de début et de fin).</p>
    <ol>
      <li><span class="step">Trame.</span> 16 octets, soit \(n_t = 160\) bits, durée \(160/115\,200 \approx 1{,}39\ \text{ms}\) : au plus 720 trames par seconde.</li>
      <li><span class="step">À 500 Hz.</span> \(160\times500 = 80\,000\ \text{bit/s}\) : taux d'occupation 69 %, acceptable sur une liaison dédiée. Débit utile \(12\times8\times500 = 48\,000\ \text{bit/s}\), efficacité \(96/160 = 60\) %.</li>
      <li><span class="step">À 1 kHz.</span> 160 000 bit/s : impossible ; il faut 230 400 bit/s ou plus.</li>
    </ol>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th>Liaison</th><th>Débit (ordre de grandeur)</th><th>Usage</th></tr>
    <tr><td>Série asynchrone</td><td>9 600 bit/s à 1 Mbit/s</td><td>GPS, capteurs simples</td></tr>
    <tr><td>I²C, SPI</td><td>0,1 à quelques dizaines de Mbit/s</td><td>composants d'une même carte</td></tr>
    <tr><td>Bus CAN</td><td>125 kbit/s à 1 Mbit/s</td><td>automobile, VAE, robots</td></tr>
    <tr><td>Ethernet industriel</td><td>100 Mbit/s à 1 Gbit/s</td><td>automates, vision</td></tr>
    <tr><td>Bluetooth, Wi-Fi</td><td>1 à plusieurs dizaines de Mbit/s</td><td>téléphone, supervision</td></tr>
  </table></div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · ÉCOCONCEPTION D'UNE ARCHITECTURE</div>
  <h2>Réduire l'impact environnemental dès le choix des constituants</h2>
  <div class="intro">L'essentiel de l'impact environnemental d'un produit est décidé à la conception : architecture, source d'énergie et dimensionnement engagent toute sa vie. Aucune méthode normalisée n'est exigée ; matériaux et procédés : « Triptyque produit–procédé–matériau ».</div>

  <div class="def-box">
    <strong>Cycle de vie</strong> : extraction et élaboration des matériaux, fabrication, distribution (logistique), utilisation, fin de vie (réemploi, recyclage, valorisation, décharge). L'analyse de cycle de vie évalue les impacts (énergie, gaz à effet de serre, ressources) de chaque étape.
  </div>
  <div class="prop-box">
    <strong>Où se trouve l'impact ?</strong> Pour un système qui consomme longtemps (moteur, compresseur, véhicule), l'<strong>utilisation</strong> domine souvent : le rendement devient un critère environnemental majeur. Pour un produit qui consomme peu, ce sont les <strong>matériaux</strong> et la <strong>fabrication</strong>. On identifie d'abord la phase dominante.
  </div>

  <h3>Les leviers de l'écoconception</h3>
  <ul>
    <li><strong>Nouveau concept</strong> : entraînement direct sans réducteur, vélos partagés, récupération d'énergie au freinage.</li>
    <li><strong>Matériaux à moindre impact</strong> : faible énergie grise, matière recyclée (Ashby avec l'énergie grise en axe).</li>
    <li><strong>Moins de matière</strong> : dimensionner au juste besoin ; un moteur surdimensionné est plus lourd et travaille loin de son meilleur rendement.</li>
    <li><strong>Production</strong> : procédés sobres, peu de chutes, bruts proches de la forme finale.</li>
    <li><strong>Logistique</strong> : masse et volume transportés, emballages, proximité des fournisseurs.</li>
    <li><strong>Durée de vie</strong> : robustesse, réparabilité (composants standard, batterie remplaçable), mises à jour logicielles.</li>
    <li><strong>Fin de vie</strong> : démontage facile (vis plutôt que colle), matériaux séparables, collecte des batteries et de l'électronique, réemploi.</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — Énergie d'un vérin pneumatique et d'un vérin électrique</strong>
    <p>Le vérin du §5 (5,0 NL par cycle, 600 N sur 200 mm) fait 10 cycles par minute, 16 h par jour, 220 jours par an : 2,1 millions de cycles. Un mètre cube normal d'air à 7 bar coûte environ 0,1 kW·h au compresseur.</p>
    <ol>
      <li><span class="step">Pneumatique.</span> \(0{,}005\times0{,}1 = 5\times10^{-4}\ \text{kW·h}\) par cycle (1,8 kJ), pour un travail utile de \(600\times0{,}2 = 120\ \text{J}\) : rendement global de 7 % environ. Sur un an : environ 1 100 kW·h, sans compter les fuites du réseau.</li>
      <li><span class="step">Électrique.</span> Avec un rendement global de 0,5 (moteur, variateur, vis), 240 J par cycle, soit environ 140 kW·h par an.</li>
      <li><span class="step">Conclusion.</span> Sept à huit fois moins d'énergie à l'usage pour l'électrique, mais plus de matériaux (moteur, électronique, aimants) et un coût d'achat supérieur : c'est la question du §2, posée sur tout le cycle de vie.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : déplacer l'impact au lieu de le réduire. Une batterie surdimensionnée « par sécurité » alourdit le véhicule et coûte à fabriquer : celle du VAE (490 W·h, 59 km) passerait à 10s3p (370 W·h, 44 km) si l'exigence d'autonomie était revue selon l'usage réel. Un matériau léger mais énergivore à produire n'est un gain que si la masse économisée réduit assez la consommation.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Compléments non exigibles</h2>
  <div class="intro">Ces compléments éclairent des résultats du chapitre ; ils ne sont pas au programme.</div>
  <ul>
    <li><strong>Modèle d'une batterie</strong> : force électromotrice fonction de l'état de charge et résistance interne ; capacité réduite aux forts courants et au froid ; carte de gestion qui équilibre les cellules.</li>
    <li><strong>Accumulateur en régime rapide</strong> : gaz plutôt adiabatique (\(pV^{\gamma} = \text{cte}\), \(\gamma \approx 1{,}4\)), volume restitué plus faible qu'en isotherme.</li>
    <li><strong>Hydraulique proportionnelle</strong> : servovalves pour asservir un vérin en position ou en effort.</li>
    <li><strong>Incertitudes composées</strong> : pour des erreurs indépendantes, la combinaison quadratique \(u = \sqrt{u_1^2 + u_2^2 + \dots}\) est plus réaliste que la somme du §8.</li>
    <li><strong>Protocoles</strong> : arbitrage, bits de bourrage, contrôle d'erreur (CRC), qui fixent la longueur exacte des trames.</li>
    <li><strong>Analyse de cycle de vie normalisée</strong> (ISO 14040 et 14044).</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="chf-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CHAÎNES FONCTIONNELLES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>
  <div class="intro">Ces méthodes suivent le chapitre : allouer et choisir (§1, §2), dimensionner la chaîne de puissance (§3 à §7), puis la chaîne d'information (§8, §9), et intégrer l'écoconception (§10), toujours à partir d'une documentation technique.</div>

  <div class="method-box">
    <strong>Méthode 1 — Allouer des composants et justifier un choix (§1, §2)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Fonctions.</span> Traduire chaque exigence du cahier des charges en fonctions (acquérir, traiter, communiquer ; alimenter, moduler, convertir, transmettre, agir) et en flux échangés.</li>
      <li><span class="step">Allocation.</span> Attribuer chaque fonction à un ou plusieurs blocs ; dresser le tableau exigences × blocs et vérifier qu'aucune exigence n'est orpheline ; contrôler les interfaces sur l'ibd (nature, niveaux, format des flux).</li>
      <li><span class="step">Critères.</span> Écarter d'abord les solutions qui violent un critère éliminatoire ; pondérer les autres critères, noter chaque solution, calculer \(S_i = \sum_j p_j\,n_{ij}\).</li>
      <li><span class="step">Robustesse.</span> Faire varier les poids discutables : si le classement bascule, justifier le poids retenu par le cahier des charges.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Dimensionner une batterie (§3)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Besoin.</span> Puissance utile sur chaque phase d'usage, rendement de la chaîne de puissance, d'où \(P_{moy}\) côté batterie (ou une consommation en W·h/km) et la puissance maximale.</li>
      <li><span class="step">Énergie.</span> \(W \ge P_{moy}\,\Delta t/\delta\), avec \(\delta\) la fraction utilisable (profondeur de décharge, réserve).</li>
      <li><span class="step">Tension et capacité.</span> \(n_s\) fixé par la tension du convertisseur, \(n_p\) par la capacité \(Q = W/U_n\) ; arrondir aux entiers supérieurs.</li>
      <li><span class="step">Vérifications.</span> Courant par cellule au pic de puissance (\(I/n_p\) inférieur au courant admissible), masse, durée de charge, nombre de cycles sur la durée de vie visée.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Choisir un dispositif de stockage d'énergie (§3)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Besoin par cycle.</span> Énergie à stocker ou à restituer (\(mgh\), \(\tfrac12 m v^2\), travail d'un vérin…, multipliée par le rendement de la chaîne dans le sens du transfert), puissance crête, nombre de cycles sur la durée de vie.</li>
      <li><span class="step">Premier tri.</span> Beaucoup d'énergie, peu de cycles : batterie. Pointes de puissance répétées (freinage, levage, centaines de milliers de cycles) : supercondensateurs, volant d'inertie ou accumulateur hydraulique.</li>
      <li><span class="step">Énergie utile.</span> Batterie : \(\delta\,W\) ; supercondensateur ou volant exploité jusqu'à la moitié de \(U_{max}\) ou de \(\omega_{max}\) : \(\tfrac34\,W_{max}\) ; accumulateur : \(p_0V_0\ln(p_2/p_1)\), en pressions absolues.</li>
      <li><span class="step">Dimensionner.</span> Nombre de cellules en série (tension, énergie), inertie ou volume de gaz ; puis masse, encombrement, durée de vie en cycles.</li>
      <li><span class="step">Comparer.</span> Énergie et puissance massiques, cycles, sécurité (rotor rapide, pression), maintenance, coût, convertisseur réversible nécessaire.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Exemple éclair :</em> un chariot de 400 kg freiné depuis 2 m/s libère \(\tfrac12 \times 400 \times 2^2 = 800\) J, dont 640 J récupérables avec un rendement de 0,8. Une cellule de supercondensateur 2,7 V – 100 F fournit \(\tfrac34 \times \tfrac12 \times 100 \times 2{,}7^2 \approx 273\) J entre 2,7 V et 1,35 V : il en faut 3 en série (820 J utiles).</p>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> confondre A·h et W·h ; vider entièrement un supercondensateur dans le calcul (oublier le facteur 3/4) ; écrire \(pV = p_0V_0\) en pressions relatives.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Lire un schéma pneumatique ou hydraulique (§5)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Repérer</span> la source (compresseur, centrale : pompe, limiteur de pression), les préactionneurs (distributeurs), les actionneurs (vérins, moteurs) et les accessoires (limiteurs de débit, clapets).</li>
      <li><span class="step">Distributeur.</span> Nombre d'orifices / nombre de positions, commandes et rappel ; les conduites sont reliées à la case de repos.</li>
      <li><span class="step">Commande.</span> Pour chaque commande, amener la case voisine en face des raccordements et suivre le fluide : chambre alimentée, chambre à l'échappement, sens du mouvement.</li>
      <li><span class="step">Coupure d'énergie.</span> Monostable : retour à la position de repos ; bistable : dernière position conservée. En déduire le comportement en sécurité.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Dimensionner un vérin et sa source (§5)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Effort.</span> Section minimale \(S \ge F/(\tau\,p)\) avec un taux de charge \(\tau\) de 0,5 à 0,7 en pneumatique ; choisir l'alésage normalisé supérieur ; vérifier l'effort en rentrée avec la section annulaire.</li>
      <li><span class="step">Vitesse.</span> Débit \(Q_v = S\,v\) ; en hydraulique, puissance \(p\,Q_v\) et moteur de pompe \(p\,Q_v/\eta\).</li>
      <li><span class="step">Air.</span> Consommation \((S+S_a)\,c\,(p+p_{atm})/p_{atm}\) par cycle, multipliée par la cadence, à comparer au débit du compresseur.</li>
      <li><span class="step">Pressions.</span> Relatives pour les efforts, absolues pour la consommation d'air.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Étudier la réversibilité d'une transmission (§6)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Angle d'hélice</span> : \(\tan\alpha = p/(\pi d_m)\) pour une vis ; angle de frottement \(\varphi = \arctan f\).</li>
      <li><span class="step">Test.</span> Irréversible si \(\alpha \le \varphi\) ; tester avec le frottement le plus faible possible (en mouvement, sous vibrations).</li>
      <li><span class="step">Rendements.</span> \(\eta_d = \tan\alpha/\tan(\alpha+\varphi)\) ; si réversible, \(\eta_i = \tan(\alpha-\varphi)/\tan\alpha\).</li>
      <li><span class="step">Conséquences.</span> Irréversible : maintien sans frein mais rendement inférieur à 50 %. Réversible : frein nécessaire pour tenir une charge, énergie récupérable si toute la chaîne est réversible.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Choisir le rapport et vérifier un moteur sur un cycle (§7)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cinématique.</span> Profil de vitesse de la charge (trapèze ou triangle), vitesses et accélérations maximales ; rapport minimal \(k \ge \omega_{c,max}/\omega_{m,max}\) ; comparer avec \(k_{opt} = \sqrt{J_m/J_c}\).</li>
      <li><span class="step">Couples par phase.</span> Effort ou couple de charge sur chaque phase ; marche motrice : \(C = \lambda F/\eta\), charge entraînante : \(C = \lambda F\eta\) ; ajouter \((J_m + J_{\text{arbres}})\,\dot\omega_m\).</li>
      <li><span class="step">Vérifications.</span> Vitesse maximale, couple crête \(\max|C|\le C_{max}\), couple efficace \(\sqrt{\sum C_i^2t_i/T}\le C_n\).</li>
      <li><span class="step">Boucle.</span> Refaire le calcul avec l'inertie du moteur choisi.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Choisir et dimensionner un capteur et son acquisition (§8)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Technologie.</span> Grandeur, usage (tout ou rien ou mesure), absolu ou incrémental, contact, environnement, signal de sortie.</li>
      <li><span class="step">Étendue</span> juste suffisante ; erreur majorée (linéarité, hystérésis, dérive, quantification) inférieure à la tolérance.</li>
      <li><span class="step">Résolution</span> 4 à 10 fois plus fine que la tolérance ; codeur : \(p/(4N)\) en quadrature ; convertisseur : \(N \ge \log_2(\Delta s/\delta)\), après conditionnement qui étale le signal sur la plage.</li>
      <li><span class="step">Justesse et fidélité.</span> Biais = moyenne − valeur vraie (corrigé par étalonnage) ; dispersion = écart-type des mesures répétées.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Vérifier une mémoire et un débit de communication (§9)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Mémoire.</span> \(M = n_v\,n_o\,f_e\,\Delta t\) (plus l'horodatage) ; comparer à la RAM, à la flash ou au stockage externe, en distinguant ko et kio.</li>
      <li><span class="step">Trame.</span> Compter tous les octets (en-tête, données, contrôle) et les bits réellement transmis par octet (bits de début et de fin).</li>
      <li><span class="step">Débit.</span> \(n_t\,f \le D\) ; taux d'occupation \(n_t f/D\), avec une marge si le bus est partagé ; efficacité = bits utiles / bits transmis.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Intégrer l'écoconception dans une architecture (§10)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Phase dominante.</span> Système qui consomme longtemps (moteur, compresseur, véhicule) : l'utilisation domine et le rendement devient un critère environnemental ; produit qui consomme peu : matériaux et fabrication.</li>
      <li><span class="step">Énergie à l'usage.</span> Énergie par cycle (travail utile divisé par le rendement global), multipliée par le nombre de cycles ou d'heures de fonctionnement sur la durée de vie.</li>
      <li><span class="step">Leviers.</span> Passer en revue nouveau concept, matériaux à moindre impact, réduction de matière (dimensionner au juste besoin), production, logistique, durée de vie (réparabilité, composants standard), fin de vie (démontage, collecte des batteries et de l'électronique).</li>
      <li><span class="step">Décider.</span> Faire entrer l'impact dans la matrice de décision (§2) sans le compter deux fois (s'il y a déjà un critère « consommation d'énergie ») et vérifier qu'il ne fait pas basculer le choix sans justification.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Exemple éclair :</em> un moteur fournit 1,5 kW pendant 4 000 h par an. Avec un rendement de 0,85, il absorbe 1,76 kW ; avec 0,90, 1,67 kW : l'écart de 0,098 kW représente environ 390 kW·h par an, sur toute la durée de vie du moteur.</p>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> déplacer l'impact au lieu de le réduire (batterie surdimensionnée « par sécurité ») ; oublier l'énergie de fabrication d'une solution plus économe en service ; présenter une analyse de cycle de vie normalisée comme exigée.</p>
  </div>

</div>
</template>
