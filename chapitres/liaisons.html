<template class="pan-tpl" data-panneau="lia-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · LIAISONS ET SCHÉMA CINÉMATIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : reconnaître et écrire une liaison (§2 à §6), construire le modèle d'un mécanisme (§7, §8), le simplifier et le juger (§9 à §12). Chacune se termine par un exemple court, chiffré et vérifié.</div>

  <div class="method-box">
    <strong>Méthode 1 — Identifier une liaison à partir des surfaces de contact</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Surfaces.</span> Repérer, sur le plan ou la maquette, les surfaces par lesquelles les deux pièces se touchent : plan, cylindre, sphère, filet, et leur nombre.</li>
      <li><span class="step">Nature du contact.</span> Ponctuel, linéique (rectiligne ou circulaire) ou surfacique ; sur un contact cylindrique ou plan, comparer la longueur de contact au diamètre (\(L/D \gt 1{,}5\) : long ; \(L/D \lt 0{,}8\) : court) et, au besoin, calculer l'angle de basculement \(\alpha \approx j/L\).</li>
      <li><span class="step">Arrêts.</span> Chercher ce qui bloque les translations le long d'un axe (épaulements, circlips, faces d'appui) et les rotations autour (méplat, clavette, doigt).</li>
      <li><span class="step">Conclure.</span> Lister les mouvements relatifs permis, en déduire le nom de la liaison, son nombre de degrés de liberté \(n_c\) et ses caractéristiques géométriques (centre, axe, direction, normale).</li>
    </ol>
    <p><em>Exemple éclair :</em> un arbre de 25 mm de diamètre tourne dans une bague de 12 mm de long, avec un jeu diamétral de 0,05 mm ; un épaulement d'un côté et un circlip de l'autre l'arrêtent axialement. \(L/D = 0{,}48\) : contact court, \(\alpha \approx 0{,}05/12 \approx 4\cdot10^{-3}\ \text{rad}\) (0,24°) ; rotations libres, translations bloquées : liaison <strong>sphérique</strong> de centre le milieu de la bague.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Écrire le torseur cinématique d'une liaison, avec son domaine de validité</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Base locale.</span> \(\vec x\) selon l'axe, la direction ou la ligne de contact, \(\vec z\) selon la normale ; nommer le point caractéristique \(A\).</li>
      <li><span class="step">Composantes.</span> Une composante par mouvement permis (\(p, q, r\) pour les rotations autour de \(\vec x, \vec y, \vec z\) ; \(u, v, w\) pour les translations), zéro ailleurs ; pour l'hélicoïdale, \(u = \frac{p_h}{2\pi}\,p\).</li>
      <li><span class="step">Point.</span> Indiquer où la forme est valable : en tout point, sur l'axe, dans un plan, sur la normale, ou au centre seulement.</li>
      <li><span class="step">Ailleurs.</span> Pour l'écrire en un autre point \(Q\), transporter : \(\vec V(Q, 2/1) = \vec V(A, 2/1) + \overrightarrow{QA}\wedge\vec\Omega(2/1)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> sphère-cylindre de centre \(A\) et de direction \(\vec x\), écrite en \(B\) avec \(\overrightarrow{AB} = 0{,}1\,\vec x\ \text{m}\) (sur l'axe). Comme \(\overrightarrow{BA}\wedge(p\,\vec x + q\,\vec y + r\,\vec z) = 0{,}1\,r\,\vec y - 0{,}1\,q\,\vec z\), on obtient \(\vec V(B) = u\,\vec x + 0{,}1\,r\,\vec y - 0{,}1\,q\,\vec z\) : la forme simple n'est valable qu'au centre, même sur l'axe.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Écrire le torseur des actions transmissibles d'une liaison parfaite</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Mouvements permis.</span> Les lister dans la base locale (méthode 2).</li>
      <li><span class="step">Dualité.</span> Annuler la force selon chaque translation permise et le moment selon chaque rotation permise ; les autres composantes sont les inconnues de liaison, au nombre de \(n_s = 6 - n_c\). Hélicoïdale à droite : \(L = -\frac{p_h}{2\pi}X\).</li>
      <li><span class="step">Point.</span> Même domaine de validité que le torseur cinématique ; transporter le moment par \(\vec M(Q) = \vec M(A) + \overrightarrow{QA}\wedge\vec R\).</li>
      <li><span class="step">Contrôle.</span> Le produit « force × vitesse + moment × rotation » doit être nul composante par composante (aucune composante non nulle face à une composante non nulle).</li>
    </ol>
    <p><em>Exemple éclair :</em> cylindre-plan de ligne de contact \((A, \vec y)\) et de normale \(\vec z\) (attention, la ligne n'est pas selon \(\vec x\)). Mouvements permis : Tx, Ty, Ry, Rz ; interdits : Tz et Rx. Donc \(\{\mathcal T(1\to2)\} = \{Z\,\vec z \;;\; L\,\vec x\}_A\), deux inconnues, forme valable dans le plan \((A, \vec y, \vec z)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Construire les classes d'équivalence et le graphe des liaisons</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Colorier.</span> Partir d'une pièce, colorier toutes celles qui lui sont liées sans mouvement (vissées, goupillées, soudées, emmanchées serrées) ; recommencer avec une autre couleur. Écarter ressorts, joints, billes de roulements.</li>
      <li><span class="step">Phase.</span> Préciser la phase étudiée : un réglage bloqué réunit deux classes.</li>
      <li><span class="step">Liaisons.</span> Pour chaque paire de classes en contact, identifier la liaison (méthode 1) ; deux contacts distincts entre les mêmes classes donnent deux liaisons.</li>
      <li><span class="step">Graphe.</span> Un sommet par classe (0 pour le bâti), un arc par liaison, légendé (nom, centre ou axe). Compter \(n\), \(n_L\), puis \(\gamma = n_L - n + 1\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un étau d'établi. Semelle et mors fixe vissés : classe 0 ; mors mobile et écrou vissé dessous : classe 1 ; vis de manœuvre et manivelle goupillée : classe 2. Liaisons : 1/0 glissière, 2/0 pivot, 2/1 hélicoïdale. \(n = 3\), \(n_L = 3\), \(\gamma = 1\) : chaîne fermée.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Tracer et paramétrer un schéma cinématique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Géométrie.</span> Placer centres, axes et normales des liaisons à leur position réelle ; choisir une vue plane si tous les axes de rotation sont perpendiculaires à un même plan, la perspective sinon.</li>
      <li><span class="step">Symboles.</span> Dessiner chaque symbole orienté, relier ceux d'une même classe (une couleur par classe), hachurer le bâti, numéroter.</li>
      <li><span class="step">Repères.</span> Un repère par classe, un vecteur porté par l'axe d'une liaison ; une figure de changement de base par rotation, angle orienté dessiné petit et positif.</li>
      <li><span class="step">Paramètres.</span> Un paramètre par degré de liberté de chaque liaison (angle ou longueur) ; repérer ceux d'entrée et de sortie.</li>
    </ol>
    <p><em>Exemple éclair :</em> bras plan à deux pivots d'axes \(\vec z_0\), \(\overrightarrow{OA} = L_1\,\vec x_1\), \(\overrightarrow{AB} = L_2\,\vec x_2\), \(\theta_1 = (\vec x_0, \vec x_1)\), \(\theta_2 = (\vec x_1, \vec x_2)\). Avec \(L_1 = 0{,}4\ \text{m}\), \(L_2 = 0{,}3\ \text{m}\), \(\theta_1 = 30^\circ\), \(\theta_2 = 60^\circ\) : \(x_B = L_1\cos\theta_1 + L_2\cos(\theta_1 + \theta_2) \approx 0{,}346\ \text{m}\) et \(y_B = L_1\sin\theta_1 + L_2\sin(\theta_1 + \theta_2) = 0{,}5\ \text{m}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Établir une loi entrée-sortie par fermeture géométrique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cycle.</span> Choisir un cycle du graphe passant par l'entrée et la sortie ; écrire la chaîne de vecteurs entre points caractéristiques (somme nulle).</li>
      <li><span class="step">Projeter.</span> Dans la base où les vecteurs ont le moins de composantes (souvent celle du bâti) : deux équations en plan.</li>
      <li><span class="step">Éliminer.</span> Les paramètres sans intérêt : isoler \(\ell\cos\beta\) et \(\ell\sin\beta\) puis sommer les carrés, ou prendre le carré scalaire d'une relation vectorielle.</li>
      <li><span class="step">Contrôler.</span> Vérifier sur une position simple et choisir la bonne racine ; dériver pour la loi en vitesse.</li>
    </ol>
    <p><em>Exemple éclair :</em> un vérin relie \(C\) (\(\overrightarrow{OC} = a\,\vec x_0\)) au point \(D\) d'un bras (\(\overrightarrow{OD} = b\,\vec x_1\)), articulé en \(O\). Le carré scalaire de \(\overrightarrow{CD} = b\,\vec x_1 - a\,\vec x_0\) donne \(\lambda^2 = a^2 + b^2 - 2ab\cos\theta\). Avec \(a = 0{,}5\ \text{m}\), \(b = 0{,}3\ \text{m}\), \(\theta = 60^\circ\) : \(\lambda = \sqrt{0{,}19} \approx 0{,}436\ \text{m}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Analyser un contact ponctuel : glissement, roulement, pivotement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Géométrie.</span> Point de contact \(I\), normale \(\vec n\), plan tangent.</li>
      <li><span class="step">Vitesses.</span> Calculer \(\vec V(I, 2/0)\) et \(\vec V(I, 1/0)\) par transport depuis des points connus de chaque solide (centre, point d'un axe fixe), puis \(\vec V_g = \vec V(I, 2/0) - \vec V(I, 1/0)\) ; contrôler \(\vec V_g\cdot\vec n = 0\).</li>
      <li><span class="step">Rotations.</span> \(\vec\Omega(2/1) = \vec\Omega(2/0) - \vec\Omega(1/0)\) ; composante selon \(\vec n\) : pivotement ; composante dans le plan tangent : roulement.</li>
      <li><span class="step">Conclure.</span> Roulement sans glissement si \(\vec V_g = \vec 0\) : c'est souvent la relation cherchée entre deux vitesses de rotation.</li>
    </ol>
    <p><em>Exemple éclair :</em> un carton avance à 0,5 m/s sur un rouleau de convoyeur de rayon 0,04 m qui tourne à 10 rad/s dans le même sens. La surface du rouleau va à \(0{,}04\times10 = 0{,}4\ \text{m/s}\) : le carton glisse sur le rouleau à \(V_g = 0{,}5 - 0{,}4 = 0{,}1\ \text{m/s}\). Sans glissement, il faudrait \(\omega = 0{,}5/0{,}04 = 12{,}5\ \text{rad/s}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Déterminer une liaison équivalente</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Série ?</span> Écrire les torseurs cinématiques au même point, les additionner ; le nombre de paramètres indépendants du résultat est \(n_c\) de la liaison équivalente, l'excédent sur \(I_c\) compte les mobilités internes.</li>
      <li><span class="step">Parallèle ?</span> Écrire les torseurs d'actions transmissibles au même point, les additionner ; le nombre de composantes indépendantes est \(r_s\), d'où \(n_c = 6 - r_s\) et \(h = I_s - r_s\).</li>
      <li><span class="step">Identifier.</span> Comparer la forme obtenue (composantes nulles, point et base) aux onze liaisons ; le résultat peut ne pas être une liaison normalisée.</li>
      <li><span class="step">Vérifier la géométrie.</span> Centres sur l'axe ou non, axes concourants ou non : le résultat en dépend.</li>
    </ol>
    <p><em>Exemple éclair :</em> deux contacts sphère-plan de normale \(\vec z\), en \(A\) et \(B\) avec \(\overrightarrow{AB} = d\,\vec x\). Somme en \(A\) : \(\{(Z_A + Z_B)\,\vec z \;;\; -d\,Z_B\,\vec y\}_A\), deux composantes indépendantes : \(r_s = 2 = I_s\), \(h = 0\), et la liaison équivalente a 4 degrés de liberté : <strong>cylindre-plan</strong> de ligne \((A, \vec x)\) et de normale \(\vec z\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Calculer la mobilité et le degré d'hyperstatisme</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Recenser.</span> Tableau des liaisons avec \(n_c\) et \(n_s\) ; en déduire \(n\), \(n_L\), \(\gamma\), \(I_c\), \(I_s\).</li>
      <li><span class="step">Observer \(m\).</span> \(m_u\) : combien de mouvements indépendants faut-il piloter ? \(m_i\) : entrée et sortie bloquées, quelles pièces peuvent encore bouger (rotation propre d'une biellette à deux rotules, d'un patin, d'un vérin) ?</li>
      <li><span class="step">Calculer \(h\).</span> \(h = m - I_c + 6\gamma\) ou \(h = m + I_s - 6(n-1)\) ; en plan, 3 au lieu de 6. En cas de doute, écrire la fermeture cinématique et calculer son rang.</li>
      <li><span class="step">Contrôler.</span> \(h \geq 0\) toujours ; un modèle plan ne dit rien des conditions hors du plan.</li>
    </ol>
    <p><em>Exemple éclair :</em> une potence murale (bras en pivot sur le mur, tirant articulé sur le mur et sur le bras, trois pivots d'axes parallèles) est immobile : \(m = 0\), \(I_c = 3\), \(\gamma = 1\), d'où \(h = 0 - 3 + 6 = 3\) dans l'espace et \(h_{\text{plan}} = 0 - 3 + 3 = 0\). Avec un tirant à deux rotules : \(I_c = 7\), le tirant peut tourner sur son axe (\(m = m_i = 1\)), \(h = 1 - 7 + 6 = 0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Trouver les conditions géométriques et rendre un modèle isostatique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Localiser.</span> Écrire la fermeture cinématique (ou sommer les torseurs d'un guidage en parallèle) ; repérer les lignes « 0 = 0 » ou les inconnues qui n'apparaissent qu'en somme.</li>
      <li><span class="step">Interpréter.</span> Rotation : condition angulaire (parallélisme, perpendicularité) ; translation : condition de position. Dire quelles surfaces de quelles pièces sont concernées : elles recevront une tolérance.</li>
      <li><span class="step">Libérer.</span> Modifier une liaison intermédiaire (pivot → sphérique, pivot → pivot glissant, appui plan → sphère-plan…) ou ajouter une pièce (biellette, patin, accouplement), pour libérer exactement les mouvements correspondants.</li>
      <li><span class="step">Recompter.</span> \(I_c\), \(m\), \(h\) ; vérifier que \(m_u\) est inchangé et qu'aucune mobilité parasite ne découple l'entrée de la sortie.</li>
    </ol>
    <p><em>Exemple éclair :</em> une vis (pivot d'axe \((O, \vec x)\) dans le corps) entraîne un écrou guidé par une glissière de direction \(\vec x\). Fermeture en \(O\) : \(p_{10} + p_{21} = 0\), \(\frac{p_h}{2\pi}p_{21} - u_{20} = 0\) et quatre lignes « 0 = 0 » (\(R_y, R_z, T_y, T_z\)) : \(r_c = 2\), \(m = 3 - 2 = 1\), \(h = 6 - 2 = 4\). L'axe de la vis doit être parallèle au guidage (deux conditions angulaires) et confondu avec l'axe de l'écrou guidé (deux conditions de position).</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> :
    <ul>
      <li>additionner des torseurs écrits en des points différents, ou utiliser la forme simple d'une sphérique hors de son centre ;</li>
      <li>oublier le bâti dans \(n\), ou faire une classe des billes d'un roulement ;</li>
      <li>prendre \(6(n-1) - I_s\) (ou sa version plane) pour la mobilité : c'est \(m - h\) ;</li>
      <li>oublier une mobilité interne : on trouve alors \(h\) trop petit, voire négatif ;</li>
      <li>conclure à l'isostatisme d'un mécanisme réel à partir d'un modèle plan ;</li>
      <li>croire qu'une chaîne ouverte peut être hyperstatique : sans boucle, \(h = 0\).</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Reconnaître une liaison à ses surfaces de contact</h3>
  <div class="statement">Pour chacune des situations suivantes, on cherche le modèle de liaison parfaite entre les deux pièces citées.
    <ul>
      <li>(a) Une roue de brouette tourne sur un axe de 20 mm de diamètre par un moyeu de 60 mm de long, maintenu entre deux rondelles.</li>
      <li>(b) La tige d'un vérin pneumatique (diamètre 16 mm) coulisse dans un palier lisse de 40 mm de long ; rien ne l'empêche de tourner.</li>
      <li>(c) La bille d'un stylo dans son logement sphérique, de même diamètre.</li>
      <li>(d) La même bille sur la feuille.</li>
      <li>(e) Un rouleau à pâtisserie posé sur la table.</li>
      <li>(f) Un arbre de 30 mm de diamètre dans une bague de bronze de 10 mm de long, avec un jeu diamétral de 0,06 mm, sans arrêt axial.</li>
      <li>(g) Le pied plat et large d'une machine posé sur le sol de l'atelier.</li>
      <li>(h) Une vis de réglage M8 (un filet, pas 1,25 mm) dans un trou taraudé.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Nommer chaque liaison, donner ses caractéristiques géométriques, son nombre de degrés de liberté et les mouvements permis.</div>
  <div class="q"><strong>Q2.</strong> Justifier le modèle de (f) par un calcul d'ordre de grandeur.</div>
  <div class="q"><strong>Q3.</strong> Combien de tours faut-il donner à la vis (h) pour qu'elle avance de 5 mm ?</div>
  <div class="q"><strong>Q4.</strong> Quels contacts sont unilatéraux ? Qu'est-ce qui les maintient ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On note \(\vec x\) l'axe ou la ligne de contact et \(\vec z\) la normale.</p>
    <ul>
      <li>(a) Contact cylindrique long (\(L/D = 3\)) et arrêts axiaux : <strong>pivot</strong> d'axe celui de l'axe de roue ; \(n_c = 1\) (Rx).</li>
      <li>(b) Contact cylindrique long (\(L/D = 2{,}5\)), ni arrêt axial ni arrêt en rotation : <strong>pivot glissant</strong> d'axe celui de la tige ; \(n_c = 2\) (Rx, Tx).</li>
      <li>(c) Sphère dans une sphère de même rayon : <strong>sphérique</strong> de centre le centre de la bille ; \(n_c = 3\) (trois rotations).</li>
      <li>(d) Sphère sur un plan : <strong>sphère-plan</strong>, de point le point de contact et de normale celle de la feuille ; \(n_c = 5\) (trois rotations, deux translations dans le plan de la feuille).</li>
      <li>(e) Cylindre sur un plan : <strong>cylindre-plan</strong>, de ligne de contact la génératrice en contact et de normale celle de la table ; \(n_c = 4\) (rotations autour de la ligne et de la normale, deux translations dans le plan).</li>
      <li>(f) Contact cylindrique court sans arrêt axial : <strong>sphère-cylindre</strong> de centre le milieu de la bague et de direction l'axe ; \(n_c = 4\) (trois rotations, translation selon l'axe).</li>
      <li>(g) Plan sur plan, appui large : <strong>appui plan</strong> de normale verticale ; \(n_c = 3\) (rotation autour de la verticale, deux translations horizontales).</li>
      <li>(h) Filets en prise : <strong>hélicoïdale</strong> d'axe celui de la vis, de pas 1,25 mm ; \(n_c = 1\) (rotation et translation liées).</li>
    </ul>
    <p><strong>Q2.</strong> \(L/D = 10/30 \approx 0{,}33 \lt 0{,}8\) : contact court. L'arbre peut basculer de \(\alpha \approx j/L = 0{,}06/10 = 6\cdot10^{-3}\ \text{rad}\), soit environ \(0{,}34^\circ\), bien plus que les défauts d'alignement usuels : les rotations perpendiculaires à l'axe ne sont pas bloquées.</p>
    <p><strong>Q3.</strong> Un tour fait avancer la vis d'un pas : \(5/1{,}25 = 4\) tours.</p>
    <p><strong>Q4.</strong> (d), (e) et (g) : ces contacts ne tiennent que parce qu'un effort plaque une pièce sur l'autre (la main qui écrit, le poids du rouleau, celui de la machine). Le modèle de liaison les suppose maintenus ; il faut vérifier en statique que l'effort normal calculé « pousse » bien.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Torseurs d'une liaison écrits hors de leur point privilégié</h3>
  <div class="statement">La base \((\vec x, \vec y, \vec z)\) est orthonormée directe ; les longueurs sont en mètres.</div>
  <div class="q"><strong>Q1.</strong> Une liaison pivot d'axe \((A, \vec z)\) entre 1 et 2 tourne à \(\vec\Omega(2/1) = 5\,\vec z\ \text{rad/s}\). Écrire \(\{\mathcal V(2/1)\}\) en \(A\), en \(B\) tel que \(\overrightarrow{AB} = 0{,}1\,\vec x + 0{,}3\,\vec z\), puis en \(C\) tel que \(\overrightarrow{AC} = 0{,}4\,\vec z\). Conclure.</div>
  <div class="q"><strong>Q2.</strong> Une bille 2 de centre \(C\) et de rayon \(R\) touche un plan 1 en \(I\), avec \(\overrightarrow{IC} = R\,\vec z\). Écrire la forme du torseur cinématique de la liaison en \(I\), puis en \(C\). La forme est-elle conservée ? Pourquoi ?</div>
  <div class="q"><strong>Q3.</strong> Écrire le torseur des actions transmissibles d'une liaison cylindre-plan parfaite de ligne de contact \((A, \vec y)\) et de normale \(\vec z\). Où cette forme est-elle valable ?</div>
  <div class="q"><strong>Q4.</strong> Une pivot glissant parfaite d'axe \((A, \vec x)\) transmet \(\{\mathcal T(1\to2)\} = \{200\,\vec z \;;\; \vec 0\}_A\) (N, N·m). Calculer son moment en \(B\) tel que \(\overrightarrow{AB} = 0{,}05\,\vec y\). Le torseur a-t-il en \(B\) la forme d'une pivot glissant d'axe \((B, \vec x)\) ?</div>
  <div class="q"><strong>Q5.</strong> Une liaison hélicoïdale parfaite d'axe \((A, \vec x)\), à droite, de pas 2 mm, transmet une force axiale \(X = 600\ \text{N}\). Que vaut la composante \(L\) de son moment ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En \(A\) : \(\{5\,\vec z \;;\; \vec 0\}_A\). En \(B\), par transport :</p>
    <div class="formula">$$\vec V(B, 2/1) = \overrightarrow{BA}\wedge\vec\Omega = (-0{,}1\,\vec x - 0{,}3\,\vec z)\wedge 5\,\vec z = 0{,}5\,\vec y\ \text{m/s}$$</div>
    <p>soit \(\{5\,\vec z \;;\; 0{,}5\,\vec y\}_B\) : moment non nul, \(B\) n'est pas sur l'axe. En \(C\) : \(\overrightarrow{CA}\wedge 5\,\vec z = -0{,}4\,\vec z\wedge 5\,\vec z = \vec 0\), forme simple : \(C\) est sur l'axe. La forme d'une pivot n'est valable qu'en tout point de son axe ; sa composante selon l'axe (ici \(0{,}3\,\vec z\) dans \(\overrightarrow{AB}\)) n'intervient pas.</p>
    <p><strong>Q2.</strong> En \(I\) : \(\{p\,\vec x + q\,\vec y + r\,\vec z \;;\; u\,\vec x + v\,\vec y\}_I\). En \(C\) :</p>
    <div class="formula">$$\vec V(C, 2/1) = u\,\vec x + v\,\vec y + (-R\,\vec z)\wedge(p\,\vec x + q\,\vec y + r\,\vec z) = (u + R\,q)\,\vec x + (v - R\,p)\,\vec y$$</div>
    <p>Pas de composante selon \(\vec z\) : la forme est conservée, parce que \(C\) est sur la normale \((I, \vec z)\), domaine de validité de la sphère-plan. Remarque : en \(C\), les deux composantes de vitesse mélangent glissement et roulement ; seule l'écriture en \(I\) donne directement la vitesse de glissement.</p>
    <p><strong>Q3.</strong> Ici la ligne de contact est selon \(\vec y\) : mouvements permis Ty, Tx (dans le plan), Ry (autour de la ligne), Rz (autour de la normale) ; interdits : Tz et Rx. Donc \(\{\mathcal T(1\to2)\} = \{Z\,\vec z \;;\; L\,\vec x\}_A\), deux inconnues, forme valable en tout point du plan \((A, \vec y, \vec z)\) qui contient la ligne et la normale.</p>
    <p><strong>Q4.</strong> Par transport :</p>
    <div class="formula">$$\vec M(B) = \overrightarrow{BA}\wedge\vec R = (-0{,}05\,\vec y)\wedge 200\,\vec z = -10\,\vec x\ \text{N·m}$$</div>
    <p>Un moment selon l'axe \(\vec x\) apparaît, alors qu'une pivot glissant d'axe \((B, \vec x)\) n'en transmet pas : \(B\) n'est pas sur l'axe de la liaison, la forme simple n'y est pas valable. Ce n'est pas une contradiction : la liaison est toujours celle d'axe \((A, \vec x)\).</p>
    <p><strong>Q5.</strong> Relation de l'hélicoïdale parfaite à droite :</p>
    <div class="formula">$$L = -\frac{p_h}{2\pi}\,X = -\frac{0{,}002}{2\pi}\times600 \approx -0{,}19\ \text{N·m}$$</div>
    <p>Un très petit couple équilibre une force axiale importante.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Classes d'équivalence et graphe d'une sauterelle de bridage</h3>
  <div class="statement">Une sauterelle de bridage plaque une pièce sur la table d'une machine quand on abaisse sa poignée. Nomenclature :
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
      <tr><th>Rep.</th><th style="text-align:left">Désignation</th><th>Rep.</th><th style="text-align:left">Désignation</th></tr>
      <tr><td>1</td><td>Socle, vissé sur la table</td><td>8</td><td>Poignée</td></tr>
      <tr><td>2</td><td>Axe du bras, serré dans le socle</td><td>9</td><td>Gaine en mousse, collée sur 8</td></tr>
      <tr><td>3</td><td>Bras de serrage</td><td>10</td><td>Biellette (deux flasques)</td></tr>
      <tr><td>4</td><td>Vis-patin, vissée dans le bras</td><td>11</td><td>Rivets assemblant les flasques de 10</td></tr>
      <tr><td>5</td><td>Contre-écrou bloquant 4</td><td>12</td><td>Axe biellette-poignée, serré dans 8</td></tr>
      <tr><td>6</td><td>Embout en caoutchouc emmanché sur 4</td><td>13</td><td>Axe biellette-bras, libre dans 3 et dans 10</td></tr>
      <tr><td>7</td><td>Axe de la poignée, serré dans le socle</td><td>14</td><td>Circlips arrêtant 13</td></tr>
    </table></div>
    Le bras tourne autour de l'axe 2, la poignée autour de l'axe 7 ; la biellette relie la poignée (axe 12) au bras (axe 13). Tous ces axes sont parallèles. On étudie la manœuvre de serrage, la vis-patin étant réglée et bloquée.</div>
  <div class="q"><strong>Q1.</strong> Constituer les classes d'équivalence. Que faire de l'embout 6, de la gaine 9 et de l'axe 13 ?</div>
  <div class="q"><strong>Q2.</strong> Identifier les liaisons et tracer le graphe des liaisons. Calculer \(\gamma\) ; nature de la chaîne ?</div>
  <div class="q"><strong>Q3.</strong> Proposer un schéma cinématique plan.</div>
  <div class="q"><strong>Q4.</strong> Déterminer la mobilité, puis le degré d'hyperstatisme du modèle spatial et du modèle plan.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Socle 0 = {1, 2, 7} ; bras 1 = {3, 4, 5, 14} (la vis-patin est bloquée pendant la manœuvre ; les circlips suivent l'axe 13 ou le bras, sans importance) ; poignée 2 = {8, 9, 12} (la gaine collée ne bouge pas par rapport à la poignée ; souple, elle ne joue aucun rôle mécanique et peut aussi être écartée) ; biellette 3 = {10, 11}. L'embout 6, déformable, est écarté (il sert à ne pas marquer la pièce). L'axe 13, libre dans les deux pièces, formerait une classe à lui seul, reliée au bras et à la biellette par deux pivots coaxiales en série : leur liaison équivalente est une pivot, avec une mobilité interne (la rotation propre de l'axe), sans effet sur le mécanisme. On le rattache donc à l'une des deux pièces, par exemple la biellette.</p>
    <p><strong>Q2.</strong> Quatre pivots d'axes parallèles (notés \(\vec z\)) : 1/0 d'axe \((A, \vec z)\) (axe 2), 2/0 d'axe \((B, \vec z)\) (axe 7), 3/2 d'axe \((C, \vec z)\) (axe 12), 3/1 d'axe \((D, \vec z)\) (axe 13). \(n = 4\), \(n_L = 4\), \(\gamma = 1\) : chaîne fermée, un quadrilatère articulé.</p>
    <figure class="schema">
<svg viewBox="0 0 340 200" role="img" aria-label="Graphe des liaisons de la sauterelle de bridage : socle, bras, biellette et poignée en une boucle de quatre pivots" stroke-linejoin="round" stroke-linecap="round">

  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Presse d'établi à vis</h3>
  <div class="statement">Une presse d'établi comporte un bâti 0 en col de cygne, une vis 1 et un plateau presseur 2. La vis (filet trapézoïdal à un filet, pas 4 mm, hélice à droite) est en liaison hélicoïdale d'axe \((O, \vec z)\) avec un écrou fixé dans le bâti ; elle porte un volant de rayon \(R_v = 0{,}15\ \text{m}\). Son extrémité inférieure, une rotule de centre \(C\) sur l'axe, est emprisonnée dans le plateau : liaison sphérique. Le plateau est guidé dans le bâti par une glissière de direction \(\vec z\). Liaisons supposées parfaites.</div>
  <div class="q"><strong>Q1.</strong> Tracer le graphe des liaisons. Calculer \(\gamma\).</div>
  <div class="q"><strong>Q2.</strong> Combien de tours de volant pour descendre le plateau de 30 mm ? À quelle vitesse descend-il si l'on tourne le volant à un demi-tour par seconde ?</div>
  <div class="q"><strong>Q3.</strong> L'opérateur exerce sur la poignée du volant une force tangentielle de 100 N. Quel effort le plateau exerce-t-il sur la pièce (liaisons parfaites) ? Et avec un rendement de 0,3 pour la vis trapézoïdale ?</div>
  <div class="q"><strong>Q4.</strong> Calculer \(m\) et \(h\). Interpréter les conditions géométriques.</div>
  <div class="q"><strong>Q5.</strong> On remplace la rotule emprisonnée par une extrémité bombée qui appuie simplement sur le fond plat du plateau (sphère-plan de normale \(\vec z\)). Nouveaux \(m\) et \(h\) ? Quel inconvénient ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Trois classes, trois liaisons : 1/0 hélicoïdale d'axe \((O, \vec z)\), 2/1 sphérique de centre \(C\), 2/0 glissière de direction \(\vec z\). \(\gamma = 3 - 3 + 1 = 1\) : une boucle.</p>
    <p><strong>Q2.</strong> Un tour fait descendre la vis, donc le plateau, d'un pas : \(30/4 = 7{,}5\) tours. À \(0{,}5\ \text{tr/s}\) : \(v = 0{,}5\times4 = 2\ \text{mm/s}\).</p>
    <p><strong>Q3.</strong> Couple sur la vis : \(C = 100\times0{,}15 = 15\ \text{N·m}\). Liaison parfaite, la puissance se conserve (\(F\,v = C\,\omega\), avec \(v/\omega = p_h/2\pi\)), ou, ce qui revient au même, \(|L| = \frac{p_h}{2\pi}|X|\) :</p>
    <div class="formula">$$F = \frac{2\pi\,C}{p_h} = \frac{2\pi\times15}{0{,}004} \approx 23{,}6\ \text{kN}$$</div>
    <p>Avec un rendement de 0,3 : \(F \approx 7{,}1\ \text{kN}\). Le frottement des filets trapézoïdaux en absorbe l'essentiel, mais il rend aussi la vis irréversible : la presse ne remonte pas toute seule sous la charge.</p>
    <p><strong>Q4.</strong> \(I_c = 1 + 3 + 1 = 5\). Plateau bloqué, la vis ne peut ni descendre ni donc tourner (hélicoïdale) : \(m = m_u = 1\). D'où \(h = 1 - 5 + 6 = 2\). La fermeture cinématique (écrite en \(C\)) laisse deux lignes « 0 = 0 », les translations perpendiculaires à \(\vec z\) : deux conditions de position. L'axe de la vis, fixé par l'écrou du bâti, doit passer exactement par le centre du logement de la rotule tel que la glissière place le plateau, et rester parallèle à la direction de la glissière sur toute la course. Les rotations, elles, sont absorbées par la rotule.</p>
    <p><strong>Q5.</strong> La sphère-plan laisse en plus les deux translations perpendiculaires à \(\vec z\) : \(I_c = 1 + 5 + 1 = 7\), \(m = 1\) (aucune mobilité interne : le plateau ne peut ni tourner ni se déplacer latéralement, à cause de la glissière), \(h = 1 - 7 + 6 = 0\) : plus aucune exigence de position. Mais le contact devient unilatéral : la vis pousse le plateau sans pouvoir le remonter ; il faut un ressort de rappel, ou remonter le plateau à la main.</p>
  </div>
</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le plateau tourne autour de l'axe fixe passant par \(O\), le galet autour de l'axe fixe passant par \(C\) ; on transporte depuis ces points de vitesse nulle :</p>
    <div class="formula">$$\vec V(I, 1/0) = \overrightarrow{IO}\wedge\omega_1\vec z = -\rho\,\vec x\wedge\omega_1\vec z = \rho\,\omega_1\,\vec y$$</div>
    <div class="formula">$$\vec V(I, 2/0) = \overrightarrow{IC}\wedge\omega_2\vec x = r\,\vec z\wedge\omega_2\vec x = r\,\omega_2\,\vec y$$</div>
    <p><strong>Q2.</strong> \(\vec V_g = \vec V(I, 2/1) = (r\,\omega_2 - \rho\,\omega_1)\,\vec y\), bien dans le plan tangent \((\vec x, \vec y)\). Roulement sans glissement :</p>
    <div class="formula">$$\omega_2 = \frac{\rho}{r}\,\omega_1 \qquad\Longrightarrow\qquad N_2 = \frac{\rho}{r}\,N_1$$</div>
    <p>Pour \(\rho\) de 10 à 60 mm : \(N_2\) de 750 à 4 500 tr/min, réglable en continu.</p>
    <p><strong>Q3.</strong> Par composition des rotations :</p>
    <div class="formula">$$\vec\Omega(2/1) = \vec\Omega(2/0) - \vec\Omega(1/0) = \omega_2\,\vec x - \omega_1\,\vec z$$</div>
    <p>La normale au contact est \(\vec z\) : roulement \(\omega_2\,\vec x\), pivotement \(-\omega_1\,\vec z\). Le pivotement vaut \(\omega_1 = 157\ \text{rad/s}\) quel que soit le réglage : c'est une propriété de cette architecture (le plateau tourne autour de la normale au contact), source de pertes et d'usure, qu'on ne peut pas supprimer.</p>
    <p><strong>Q4.</strong> Pour un point \(P\) du segment, \(\overrightarrow{OP} = (\rho + s)\,\vec x\) : \(\vec V(P, 1/0) = (\rho + s)\,\omega_1\,\vec y\), et \(\vec V(P, 2/0) = r\,\omega_2\,\vec y\) car \(P\) est à la distance \(r\) de l'axe du galet. Avec \(r\,\omega_2 = \rho\,\omega_1\) : \(\vec V_g(P) = -s\,\omega_1\,\vec y\). Aux extrémités, \(|s| = 3\ \text{mm}\) : \(V_g = 157\times0{,}003 \approx 0{,}47\ \text{m/s}\). Le contact linéique est une liaison cylindre-plan, de ligne \((I, \vec x)\) ; elle impose un glissement sur presque toute la ligne, d'où usure et échauffement. On bombe le galet (profil torique) pour que le contact devienne ponctuel (sphère-plan) : le glissement n'existe alors qu'à cause du pivotement, dans la petite aire de contact.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Tourelle de caméra : deux pivots en série</h3>
  <div class="statement">Une tourelle de vidéosurveillance oriente une caméra 2 en azimut et en site. Un support 1 tourne par rapport au mât 0 autour de l'axe vertical \((O, \vec z)\) (pivot) ; la caméra tourne par rapport au support autour d'un axe horizontal \((O', \vec x_1)\) (pivot), \(\vec x_1\) étant lié au support. On note \((\vec x_1, \vec y_1, \vec z)\) la base du support.</div>
  <div class="q"><strong>Q1.</strong> Cas où \(O' = O\) (axes concourants). Déterminer la liaison équivalente entre 2 et 0, ainsi que \(m\) et \(h\).</div>
  <div class="q"><strong>Q2.</strong> Cas où \(\overrightarrow{OO'} = e\,\vec z\) (axe de site au-dessus du point \(O\), sur l'axe vertical). Même question.</div>
  <div class="q"><strong>Q3.</strong> Cas où \(\overrightarrow{OO'} = e\,\vec y_1\), avec \(e = 30\ \text{mm}\). Écrire le torseur équivalent en \(O\) ; est-ce une liaison normalisée ?</div>
  <div class="q"><strong>Q4.</strong> Dans le cas de Q1, écrire le torseur des actions transmissibles de la liaison équivalente, en supposant le support de masse négligeable et sans moteur.</div>
  <div class="q"><strong>Q5.</strong> En réalité, chaque pivot est motorisée. La caméra (1,2 kg) a son centre de gravité à 5 cm en avant de l'axe de site, horizontal. Quel couple le moteur de site doit-il exercer pour la maintenir immobile ? Et le moteur d'azimut ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Liaisons en série, torseurs en \(O\) (valables : \(O\) est sur les deux axes) :</p>
    <div class="formula">$$\{\mathcal V(2/0)\} = \{\mathcal V(2/1)\} + \{\mathcal V(1/0)\} = \{p_{21}\,\vec x_1 + r_{10}\,\vec z \;;\; \vec 0\}_O$$</div>
    <p>Deux rotations, autour de \(\vec x_1\) et de \(\vec z\), aucune translation, et pas de rotation autour de \(\vec y_1\) : liaison <strong>sphérique à doigt</strong> de centre \(O\), rotation interdite autour de \(\vec y_1\). Chaîne ouverte : \(m = I_c = 2\) (deux mobilités utiles, deux moteurs), \(h = 0\).</p>
    <p><strong>Q2.</strong> \(O'\) est sur l'axe vertical : les deux axes sont concourants en \(O'\). En \(O'\), \(\vec V(O', 2/1) = \vec 0\) et \(\vec V(O', 1/0) = \overrightarrow{O'O}\wedge r_{10}\vec z\), nul car \(\overrightarrow{O'O} = -e\,\vec z\) est parallèle à \(\vec z\) : même résultat, sphérique à doigt de centre \(O'\).</p>
    <p><strong>Q3.</strong> Par transport depuis \(O'\), où la vitesse de 2 par rapport à 1 est nulle :</p>
    <div class="formula">$$\vec V(O, 2/1) = \overrightarrow{OO'}\wedge p_{21}\,\vec x_1 = e\,\vec y_1\wedge p_{21}\,\vec x_1 = -e\,p_{21}\,\vec z$$</div>
    <p>d'où</p>
    <div class="formula">$$\{\mathcal V(2/0)\} = \{p_{21}\,\vec x_1 + r_{10}\,\vec z \;;\; -e\,p_{21}\,\vec z\}_O$$</div>
    <p>Pour retrouver une forme sans vitesse, il faudrait un point situé à la fois sur l'axe vertical (pour annuler l'effet de \(r_{10}\)) et sur l'axe de site (pour celui de \(p_{21}\)) : les axes ne se coupent pas, ce point n'existe pas. Deux rotations autour d'axes non concourants : ce n'est aucune des onze liaisons normalisées. La caméra se déplace en plus sur un cercle de 30 mm de rayon quand on la fait pivoter : décalage de visée de quelques centimètres, sans importance pour une caméra de surveillance.</p>
    <p><strong>Q4.</strong> Mouvements permis : Rx₁ et Rz ; la seule rotation interdite est autour de \(\vec y_1\). Support de masse négligeable : les deux pivots transmettent le même torseur, qui est celui de la liaison équivalente :</p>
    <div class="formula">$$\{\mathcal T(0\to2)\} = \{X\,\vec x_1 + Y\,\vec y_1 + Z\,\vec z \;;\; M\,\vec y_1\}_O$$</div>
    <p>Quatre inconnues (\(n_s = 6 - 2\)), forme valable au centre \(O\) seulement.</p>
    <p><strong>Q5.</strong> Caméra isolée, immobile : moment en \(O'\) projeté sur \(\vec x_1\). Le poids \(mg = 1{,}2\times9{,}81 \approx 11{,}8\ \text{N}\) a un bras de levier de 0,05 m : \(C_{\text{site}} = 11{,}8\times0{,}05 \approx 0{,}59\ \text{N·m}\). Pour l'azimut, on isole {support + caméra} et l'on projette sur \(\vec z\) : le poids est parallèle à \(\vec z\), son moment selon \(\vec z\) est nul ; le moteur d'azimut ne fournit aucun couple à l'arrêt (il ne sert qu'à vaincre l'inertie et les frottements).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Plateau de presse guidé par deux colonnes</h3>
  <div class="statement">Le plateau mobile 1 d'une presse se déplace verticalement (direction \(\vec z\)) le long de deux colonnes du bâti 0, d'axes \((A, \vec z)\) et \((B, \vec z)\), avec \(\overrightarrow{AB} = d\,\vec x\) et \(d = 0{,}40\ \text{m}\). Trois guidages sont envisagés :
    <ul>
      <li>S1 : deux bagues longues (pivots glissants d'axes \((A, \vec z)\) et \((B, \vec z)\)) ;</li>
      <li>S2 : une bague longue en \(A\), une bague courte en \(B\) (sphère-cylindre de centre \(B\), direction \(\vec z\)) ;</li>
      <li>S3 : une bague longue en \(A\) ; en \(B\), une fourchette courte qui embrasse la colonne et ne la touche que selon \(\vec y\) (sphère-plan de normale \((B, \vec y)\), contact maintenu des deux côtés).</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Pour chaque solution, sommer les torseurs des actions transmissibles en \(A\), identifier la liaison équivalente et calculer \(h\).</div>
  <div class="q"><strong>Q2.</strong> Pour S1 et S2, quelles inconnues restent indéterminées ? À quelles conditions géométriques correspondent-elles ?</div>
  <div class="q"><strong>Q3.</strong> Solution S3. Un vérin pousse le plateau en \(V\) (\(\overrightarrow{AV} = 0{,}2\,\vec x\)) avec une force \(F_v\,\vec z\) ; l'outil reçoit de la pièce une force \(-F\,\vec z\), \(F = 8\ \text{kN}\), en \(T\) (\(\overrightarrow{AT} = 0{,}2\,\vec x + 0{,}1\,\vec y\)). Poids négligé, liaisons parfaites. Déterminer toutes les actions de guidage.</div>
  <div class="q"><strong>Q4.</strong> Quel rôle joue la colonne \(B\) ? Conséquence pour son dimensionnement ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Transport de \(B\) vers \(A\) : \(\overrightarrow{AB}\wedge(X_B\vec x + Y_B\vec y) = d\,Y_B\,\vec z\) ; une force selon \(\vec z\) en \(B\) donnerait \(-d\,Z_B\,\vec y\), mais aucune de ces liaisons n'en transmet.</p>
    <ul>
      <li>S1 : \(\{\mathcal T_A\} = \{X_A\vec x + Y_A\vec y \;;\; L_A\vec x + M_A\vec y\}_A\), idem en \(B\). Somme en \(A\) :
      <div class="formula">$$\begin{Bmatrix} X_A + X_B & L_A + L_B \\ Y_A + Y_B & M_A + M_B \\ 0 & d\,Y_B \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)}$$</div>
      Cinq composantes indépendantes : glissière de direction \(\vec z\) ; \(I_s = 8\), \(r_s = 5\), \(h = 3\).</li>
      <li>S2 : en \(B\), seulement \(X_B, Y_B\). Somme en \(A\) :
      <div class="formula">$$\begin{Bmatrix} X_A + X_B & L_A \\ Y_A + Y_B & M_A \\ 0 & d\,Y_B \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)}$$</div>
      Glissière, \(I_s = 6\), \(r_s = 5\), \(h = 1\).</li>
      <li>S3 : en \(B\), seulement \(Y_B\). Somme en \(A\) :
      <div class="formula">$$\begin{Bmatrix} X_A & L_A \\ Y_A + Y_B & M_A \\ 0 & d\,Y_B \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)}$$</div>
      Glissière, \(I_s = 5 = r_s\), \(h = 0\).</li>
    </ul>
    <p><strong>Q2.</strong> S1 : seules les sommes \(X_A + X_B\), \(L_A + L_B\), \(M_A + M_B\) sont connues ; une inconnue de type force (selon \(\vec x\)) : condition de position, l'entraxe des bagues sur le plateau doit être égal à celui des colonnes ; deux de type moment : conditions angulaires, les colonnes doivent être parallèles entre elles (autour de \(\vec x\) et de \(\vec y\)), et les alésages des bagues aussi. S2 : seule \(X_A + X_B\) est connue : il ne reste que la condition d'entraxe. S3 : aucune condition.</p>
    <p><strong>Q3.</strong> Inconnues : \(X_A, Y_A, L_A, M_A, Y_B\) et \(F_v\). Résultante : \(X_A = 0\), \(Y_A + Y_B = 0\), \(F_v - F = 0\), donc \(F_v = 8\ \text{kN}\). Moment en \(A\) des forces verticales :</p>
    <div class="formula">$$\overrightarrow{AV}\wedge F_v\vec z = -0{,}2\,F_v\,\vec y \qquad \overrightarrow{AT}\wedge(-F\vec z) = 0{,}2\,F\,\vec y - 0{,}1\,F\,\vec x$$</div>
    <p>Équation selon \(\vec x\) : \(L_A - 0{,}1\,F = 0\), soit \(L_A = 800\ \text{N·m}\) ; selon \(\vec y\) : \(M_A = 0{,}2\,F_v - 0{,}2\,F = 0\) ; selon \(\vec z\) : \(d\,Y_B = 0\), donc \(Y_B = Y_A = 0\).</p>
    <p><strong>Q4.</strong> La colonne \(A\) reprend tout le moment dû au décalage de l'outil ; la fourchette \(B\) n'empêche que la rotation du plateau autour de \(\vec z\) (anti-rotation) et ne reçoit d'effort que si une action extérieure tend à faire tourner le plateau autour de \(\vec z\). Elle peut être beaucoup plus légère. C'est l'architecture des perceuses à colonne et de nombreux guidages de machines.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Compter avant de calculer : trois mécanismes</h3>
  <div class="statement">Toutes les pivots ont des axes parallèles à \(\vec z\).
    <ul>
      <li>(a) Barrière de parking : lisse 1 en pivot d'axe \((O, \vec z)\) avec le bâti 0 ; manivelle 2 en pivot d'axe \((C, \vec z)\) avec le bâti, entraînée par un motoréducteur ; bielle 3 en pivot d'axe \((A, \vec z)\) avec la manivelle et d'axe \((B, \vec z)\) avec la lisse.</li>
      <li>(b) La même barrière, la bielle étant montée sur deux rotules de centres \(A\) et \(B\).</li>
      <li>(c) Potence murale : bras 1 en pivot d'axe \((A, \vec z)\) avec le mur 0 ; tirant 2 en pivot d'axe \((B, \vec z)\) avec le mur et d'axe \((C, \vec z)\) avec le bras.</li>
      <li>(d) La même potence, le tirant étant monté sur deux rotules.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Pour chacun : \(n\), \(n_L\), \(\gamma\), \(I_c\), \(I_s\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(m\) (en précisant \(m_u\) et \(m_i\)) et \(h\) dans l'espace, par les deux formules.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(h\) pour un modèle plan de (a) et (c). Conclure.</div>
  <div class="q"><strong>Q4.</strong> Pour (a), quelles conditions géométriques doit-on respecter ? Pourquoi le constructeur préfère-t-il (b) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) et (b) : \(n = 4\), \(n_L = 4\), \(\gamma = 1\). (a) : \(I_c = 4\), \(I_s = 20\). (b) : \(I_c = 1 + 1 + 3 + 3 = 8\), \(I_s = 5 + 5 + 3 + 3 = 16\). (c) et (d) : \(n = 3\), \(n_L = 3\), \(\gamma = 1\). (c) : \(I_c = 3\), \(I_s = 15\). (d) : \(I_c = 7\), \(I_s = 11\).</p>
    <p><strong>Q2.</strong></p>
    <ul>
      <li>(a) Manivelle bloquée, tout est immobile : \(m = m_u = 1\). \(h = 1 - 4 + 6 = 3\) ; \(h = 1 + 20 - 18 = 3\).</li>
      <li>(b) Manivelle bloquée, la lisse est immobile mais la bielle tourne autour de \(AB\) : \(m_u = 1\), \(m_i = 1\), \(m = 2\). \(h = 2 - 8 + 6 = 0\) ; \(h = 2 + 16 - 18 = 0\).</li>
      <li>(c) Structure immobile : \(m = 0\). \(h = 0 - 3 + 6 = 3\) ; \(h = 0 + 15 - 12 = 3\).</li>
      <li>(d) Le tirant peut tourner sur lui-même : \(m = m_i = 1\). \(h = 1 - 7 + 6 = 0\) ; \(h = 1 + 11 - 12 = 0\).</li>
    </ul>
    <p><strong>Q3.</strong> (a) : \(h_{\text{plan}} = 1 - 4 + 3 = 0\) ; (c) : \(h_{\text{plan}} = 0 - 3 + 3 = 0\). Les deux modèles plans sont isostatiques : les trois conditions de (a) et de (c) sont hors du plan, invisibles dans ce modèle.</p>
    <p><strong>Q4.</strong> Pour (a), comme pour tout quadrilatère à quatre pivots : axes parallèles autour de \(\vec x\) et de \(\vec y\) (deux conditions angulaires) et plans médians à des cotes compatibles selon \(\vec z\) (une condition de position). Sur une lisse de plusieurs mètres, exposée au vent et à la dilatation, elles sont coûteuses à garantir et à conserver. Avec une bielle à rotules (b), aucune condition : montage sans réglage, et la bielle (masse négligée) ne travaille qu'en traction-compression selon \(AB\). Sa rotation propre (\(m_i = 1\)) est sans inconvénient.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Vérin électrique : fermeture cinématique et conditions géométriques</h3>
  <div class="statement">Un vérin électrique comprend un corps 0, une vis 1 et une tige 2 qui porte l'écrou. La vis est guidée dans le corps par deux roulements, modélisés globalement par une pivot d'axe \((O, \vec x)\). L'écrou et la vis forment une hélicoïdale d'axe \((O, \vec x)\), de pas \(p_h = 5\ \text{mm}\), à droite ; on note \(k = p_h/2\pi\). La tige est guidée dans le corps par une glissière de direction \(\vec x\) (tube à méplats). Le moteur, dont le stator est fixé au corps, entraîne directement la vis à 3 000 tr/min.</div>
  <div class="q"><strong>Q1.</strong> Graphe des liaisons, \(\gamma\), \(I_c\).</div>
  <div class="q"><strong>Q2.</strong> Écrire la fermeture cinématique en \(O\), dans la base \((\vec x, \vec y, \vec z)\), avec les inconnues \(p_{10}\), \(p_{21}\), \(u_{20}\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(r_c\), \(m\), \(h\), et la vitesse de la tige.</div>
  <div class="q"><strong>Q4.</strong> Interpréter les lignes « 0 = 0 » en conditions géométriques. Quelles surfaces sont concernées ?</div>
  <div class="q"><strong>Q5.</strong> On ne garde qu'un roulement, côté moteur, modélisé par une sphérique de centre \(A\) (\(\overrightarrow{OA} = -0{,}2\,\vec x\ \text{m}\)) : la vis est alors tenue à l'autre bout par l'écrou. Calculer \(I_c\), \(m\), \(h\). Quelles conditions restent ?</div>
  <div class="q"><strong>Q6.</strong> Proposer deux façons de traiter ces dernières conditions, l'une qui les supprime, l'autre qui les rend faciles à respecter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Trois classes, trois liaisons (1/0 pivot, 2/1 hélicoïdale, 2/0 glissière) : \(\gamma = 1\), \(I_c = 1 + 1 + 1 = 3\).</p>
    <p><strong>Q2.</strong> Les trois formes sont valables en \(O\) (sur les axes ; la glissière, partout) : \(\{\mathcal V(1/0)\} = \{p_{10}\,\vec x \;;\; \vec 0\}_O\), \(\{\mathcal V(2/1)\} = \{p_{21}\,\vec x \;;\; k\,p_{21}\,\vec x\}_O\), \(\{\mathcal V(0/2)\} = \{\vec 0 \;;\; -u_{20}\,\vec x\}_O\). Leur somme est nulle :</p>
    <div class="formula">$$\begin{cases} R_x : & p_{10} + p_{21} = 0 \\ R_y : & 0 = 0 \\ R_z : & 0 = 0 \\ T_x : & k\,p_{21} - u_{20} = 0 \\ T_y : & 0 = 0 \\ T_z : & 0 = 0 \end{cases}$$</div>
    <p><strong>Q3.</strong> Deux équations indépendantes : \(r_c = 2\), \(m = 3 - 2 = 1\) (le moteur), \(h = 6 - 2 = 4\). Vitesse : \(u_{20} = k\,p_{21} = -k\,p_{10}\), de norme \(p_h N/60 = 0{,}005\times50 = 0{,}25\ \text{m/s}\) ; le signe dit seulement que la tige recule quand la vis tourne dans le sens positif autour de \(\vec x\).</p>
    <p><strong>Q4.</strong> \(R_y\) et \(R_z\) : aucune liaison ne laisse la tige s'incliner par rapport au corps ; l'axe de la vis (fixé par les roulements dans le corps) doit être exactement parallèle à la direction du guidage de la tige (deux conditions angulaires). \(T_y\) et \(T_z\) : l'axe de la vis doit passer exactement par l'axe de l'écrou tel que le guidage le place (deux conditions de position). Surfaces concernées : les logements des roulements et le tube de guidage du corps, l'alésage de l'écrou et les surfaces de guidage de la tige.</p>
    <p><strong>Q5.</strong> \(I_c = 3 + 1 + 1 = 5\). Moteur bloqué, rien ne bouge (la vis ne peut pas s'incliner : l'écrou la tient coaxiale à la tige) : \(m = 1\), \(h = 1 - 5 + 6 = 2\). La rotule absorbe les défauts angulaires : il ne reste que deux conditions de position, le centre \(A\) du roulement doit être sur l'axe de l'écrou guidé.</p>
    <p><strong>Q6.</strong> Les supprimer : ajouter une pièce entre l'écrou et la tige qui permette de petits déplacements selon \(\vec y\) et \(\vec z\) sans laisser l'écrou tourner (accouplement de type Oldham : deux glissières perpendiculaires en série). Avec la vis sur une rotule, le modèle devient isostatique (\(I_c = 7\), \(\gamma = 1\), \(m = 1\), \(h = 0\)). Les rendre faciles : réaliser le logement du roulement et le tube de guidage dans la même prise de pièce, sur la même machine ; la coaxialité est alors garantie par la machine, sans tolérance sévère sur chaque surface. C'est la solution la plus courante sur les petits vérins.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Arbre de transmission sur trois paliers</h3>
  <div class="statement">Un arbre 1 de 1,20 m tourne par rapport au bâti 0 autour de l'axe \((A, \vec x)\). Il porte une poulie en \(P\) (\(\overrightarrow{AP} = 0{,}30\,\vec x\)) qui reçoit une force radiale \(-1\,200\,\vec y\) (N) et un pignon en \(Q\) (\(\overrightarrow{AQ} = 0{,}90\,\vec x\)) qui reçoit \(-900\,\vec y\). Trois paliers à roulements sont envisagés, en \(A\), \(B\) (\(\overrightarrow{AB} = 0{,}60\,\vec x\)) et \(C\) (\(\overrightarrow{AC} = 1{,}20\,\vec x\)). Poids et couples négligés ici, liaisons parfaites.</div>
  <div class="q"><strong>Q1.</strong> Modèle « trois pivots » : calculer \(h\).</div>
  <div class="q"><strong>Q2.</strong> Modèle réaliste : sphérique de centre \(A\) (roulement arrêté axialement), sphère-cylindre de direction \(\vec x\) en \(B\) et en \(C\). Calculer \(h\) et interpréter.</div>
  <div class="q"><strong>Q3.</strong> On supprime le palier \(B\). Calculer \(h\) et les efforts des paliers \(A\) et \(C\).</div>
  <div class="q"><strong>Q4.</strong> Avec les trois paliers de Q2, exprimer \(Y_A\) et \(Y_C\) en fonction de \(Y_B\). Que se passe-t-il si le palier \(B\) est monté un peu trop bas, ou un peu trop haut ?</div>
  <div class="q"><strong>Q5.</strong> Pourquoi les longues lignes d'arbres (navires, laminoirs) ont-elles pourtant de nombreux paliers ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(n = 2\), \(m = 1\) (rotation de l'arbre), \(I_s = 3\times5 = 15\) : \(h = 1 + 15 - 6 = 10\).</p>
    <p><strong>Q2.</strong> \(I_s = 3 + 2 + 2 = 7\) : \(h = 1 + 7 - 6 = 2\). La somme des trois torseurs en \(A\) n'a que cinq composantes indépendantes (une pivot d'axe \((A, \vec x)\)) ; les deux inconnues de trop sont des forces radiales : deux conditions de position, le centre de \(B\) doit être sur la droite qui joint les centres de \(A\) et de \(C\) (alignement selon \(\vec y\) et selon \(\vec z\)).</p>
    <p><strong>Q3.</strong> \(I_s = 5\), \(h = 0\). Dans le plan \((\vec x, \vec y)\), moment en \(A\) selon \(\vec z\) : \(1{,}2\,Y_C - 0{,}30\times1\,200 - 0{,}90\times900 = 0\), d'où</p>
    <div class="formula">$$Y_C = \frac{360 + 810}{1{,}2} = 975\ \text{N} \qquad Y_A = 2\,100 - 975 = 1\,125\ \text{N}$$</div>
    <p>Pas de force selon \(\vec z\) ni selon \(\vec x\) : \(Z_A = Z_C = X_A = 0\).</p>
    <p><strong>Q4.</strong> Deux équations dans ce plan (résultante selon \(\vec y\), moment selon \(\vec z\)) pour trois inconnues : \(Y_A + Y_B + Y_C = 2\,100\) et \(0{,}6\,Y_B + 1{,}2\,Y_C = 1\,170\), d'où \(Y_C = 975 - 0{,}5\,Y_B\) et \(Y_A = 1\,125 - 0{,}5\,Y_B\). La statique ne fixe pas \(Y_B\) : il dépend de la position réelle du palier et de la flexion de l'arbre. Trop bas, \(B\) ne touche plus l'arbre (\(Y_B = 0\), on retrouve Q3). Trop haut, il soulage \(A\) et \(C\) et peut prendre l'essentiel de la charge : \(Y_C\) s'annule dès que \(Y_B\) atteint 1 950 N, et au-delà le palier \(C\) devrait tirer l'arbre vers le bas. Le calcul de \(Y_B\) demande un modèle déformable de l'arbre (hors programme).</p>
    <p><strong>Q5.</strong> Un arbre long sur deux paliers fléchirait beaucoup (et vibrerait) ; multiplier les paliers le rend raide. On accepte alors l'hyperstatisme, en alignant soigneusement les paliers au montage (alignement optique ou laser) et en les choisissant capables d'accepter un petit désalignement.</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Graphe des liaisons, \(\gamma\), nature de la chaîne.</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(m\) et \(h\). Combien de moteurs faut-il ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer la liaison équivalente entre l'outil 4 et le bâti 0. Est-ce une liaison normalisée ?</div>
  <div class="q"><strong>Q4.</strong> Quelle zone horizontale le point \(B\) peut-il atteindre ?</div>
  <div class="q"><strong>Q5.</strong> Pour \(\theta_1 = 30^\circ\), \(\theta_2 = 60^\circ\), \(\dot\theta_1 = 1\ \text{rad/s}\) et \(\dot\theta_2 = 2\ \text{rad/s}\), calculer la vitesse horizontale de \(B\) par rapport au bâti.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Cinq classes reliées en file par quatre liaisons : \(\gamma = 4 - 5 + 1 = 0\), chaîne ouverte.</p>
    <p><strong>Q2.</strong> Sans boucle, aucune équation de fermeture : tous les paramètres sont libres, \(m = I_c = 1 + 1 + 1 + 1 = 4\), toutes utiles (position horizontale de \(B\) : deux ; hauteur : une ; orientation de l'outil : une), et \(h = 4 - 4 + 0 = 0\). Il faut quatre moteurs.</p>
    <p><strong>Q3.</strong> En série, en \(B\) : \(\vec\Omega(4/0) = (\dot\theta_1 + \dot\theta_2 + \dot\theta_4)\,\vec z_0\), et \(\vec V(B, 4/0)\) a deux composantes horizontales (dues aux rotations des bras) et une verticale (le coulisseau). Mouvements possibles : trois translations et une rotation autour de \(\vec z_0\), soit 4 degrés de liberté indépendants. Aucune des onze liaisons ne permet exactement ces mouvements : la liaison équivalente n'est pas normalisée (c'est précisément ce que l'on attend d'un robot de prise et dépose : déplacer une pièce sans l'incliner).</p>
    <p><strong>Q4.</strong> \(OB\) varie de \(L_1 - L_2 = 0{,}10\ \text{m}\) (bras repliés) à \(L_1 + L_2 = 0{,}60\ \text{m}\) (bras alignés) : une couronne centrée sur l'axe du bâti, limitée en pratique par les butées angulaires.</p>
    <p><strong>Q5.</strong> \(A\) appartient aux bras 1 et 2 ; \(\vec\Omega(2/0) = (\dot\theta_1 + \dot\theta_2)\,\vec z_0\) :</p>
    <div class="formula">$$\vec V(A, 1/0) = \dot\theta_1\,\vec z_0\wedge L_1\vec x_1 = L_1\dot\theta_1\,\vec y_1$$</div>
    <div class="formula">$$\vec V(B, 2/0) = \vec V(A, 1/0) + (\dot\theta_1 + \dot\theta_2)\,\vec z_0\wedge L_2\,\vec x_2$$</div>
    <p>Avec \(\vec x_2\) à \(90^\circ\) de \(\vec x_0\) :</p>
    <div class="formula">$$\vec V(B) = 0{,}35\,(-\sin30^\circ\,\vec x_0 + \cos30^\circ\,\vec y_0) + 3\times0{,}25\,(-\vec x_0) \approx -0{,}925\,\vec x_0 + 0{,}303\,\vec y_0\ \text{m/s}$$</div>
    <p>soit une vitesse de 0,97 m/s environ.</p>
  </div>
</div>

  <h3>Ouvre-trappe de désenfumage à vérin électrique</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : modélisation d'un mécanisme, liaisons équivalentes, mobilité et hyperstatisme, loi entrée-sortie).</div>
  <div class="statement">En cas d'incendie, un exutoire de désenfumage ouvre une trappe dans la toiture pour évacuer les fumées. La trappe 1 (masse 30 kg, centre de gravité à 0,45 m de son axe de rotation) est articulée sur le cadre fixe 0 par deux charnières courtes, de centres \(A_1\) et \(A_2\) sur l'axe \((O, \vec z_0)\), distantes de 1,0 m. Elle est manœuvrée par un vérin électrique :
    <ul>
      <li>le corps 2 est articulé sur le cadre en \(C\) par une chape : pivot d'axe \((C, \vec z_0)\) ;</li>
      <li>dans le corps, un motoréducteur entraîne la vis 3 : pivot d'axe \((C, \vec x_2)\) entre 3 et 2 (on ne modélise pas l'intérieur du motoréducteur) ;</li>
      <li>la tige 4 porte l'écrou : hélicoïdale d'axe \((C, \vec x_2)\) entre 4 et 3, de pas \(p_h = 4\ \text{mm}\), à droite ;</li>
      <li>la tige est guidée dans le tube du corps par une bague longue : pivot glissant d'axe \((C, \vec x_2)\) entre 4 et 2 ;</li>
      <li>la tige est articulée sur la trappe en \(D\) par une chape : pivot d'axe \((D, \vec z_0)\).</li>
    </ul>
    Géométrie : \(\overrightarrow{OC} = c\,\vec x_0 - h\,\vec y_0\), \(\overrightarrow{OD} = b\,\vec x_1\), \(\overrightarrow{CD} = \lambda\,\vec x_2\), \(\theta = (\vec x_0, \vec x_1)\) variant de 0 (trappe fermée) à 90°, avec \(b = c = 0{,}25\ \text{m}\) et \(h = 0{,}30\ \text{m}\). La tige sort à 10 mm/s.

  </div>
  <div class="exo-part">Partie A — Modéliser</div>
  <div class="q"><strong>Q1.</strong> Chaque charnière est un axe court dans un alésage court ; seule celle de centre \(A_1\) porte un épaulement qui reprend le poids selon \(\vec z_0\). Proposer un modèle pour chacune, puis montrer qu'ensemble elles équivalent à une pivot d'axe \((O, \vec z_0)\). Degré d'hyperstatisme de cet ensemble ?</div>
  <div class="q"><strong>Q2.</strong> Les charnières étant remplacées par leur liaison équivalente, tracer le graphe des liaisons et calculer \(\gamma\). Nature de la chaîne ? Citer des cycles indépendants.</div>
  <div class="q"><strong>Q3.</strong> On bloque le moteur (vis immobile par rapport au corps). Montrer que la tige peut encore se déplacer par rapport au corps, si on la libère de la trappe, et décrire ce mouvement. Qu'est-ce qui l'en empêche dans le montage proposé ?</div>
  <div class="exo-part">Partie B — Loi entrée-sortie</div>
  <div class="q"><strong>Q4.</strong> Par une fermeture géométrique, exprimer \(\lambda^2\) en fonction de \(\theta\). Calculer la course du vérin.</div>
  <div class="q"><strong>Q5.</strong> Fréquence de rotation de la vis par rapport au corps, durée d'ouverture, et vitesse angulaire de la trappe au début de l'ouverture.</div>
  <div class="exo-part">Partie C — Mobilité et hyperstatisme</div>
  <div class="q"><strong>Q6.</strong> Calculer \(I_c\), \(m\) et \(h\) pour le modèle spatial. Montrer que \(h\) se partage entre l'intérieur du vérin et son montage sur la trappe, et interpréter chaque part.</div>
  <div class="q"><strong>Q7.</strong> Proposer un modèle plan (que devient l'ensemble vis-écrou ?) et calculer \(h_{\text{plan}}\). Conclure.</div>
  <div class="exo-part">Partie D — Évolution du montage</div>
  <div class="q"><strong>Q8.</strong> Pour éviter de régler les chapes, on monte la tige sur un embout à rotule en \(D\) (sphérique). Calculer \(m\) et \(h\). Quel est le défaut de ce montage ?</div>
  <div class="q"><strong>Q9.</strong> Le constructeur retient finalement : rotules en \(C\) et en \(D\), et un guidage de la tige à méplats (glissière de direction \(\vec x_2\) entre 4 et 2). Calculer \(m\) (préciser \(m_u\) et \(m_i\)) et \(h\). Conclure.</div>
  <div class="exo-part">Partie E — Efforts</div>
  <div class="q"><strong>Q10.</strong> Montage de Q9, trappe fermée au début de l'ouverture (manœuvre lente, masse du vérin négligée). Justifier que l'action du vérin sur la trappe est portée par \((CD)\), puis calculer son intensité \(F\).</div>
  <div class="q"><strong>Q11.</strong> En déduire le couple à exercer sur la vis, pour une hélicoïdale parfaite, puis avec un rendement de 0,35.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Charnières courtes : rotations libres. Celle de \(A_1\), arrêtée axialement par son épaulement : sphérique de centre \(A_1\) (3 inconnues) ; celle de \(A_2\) : sphère-cylindre de centre \(A_2\), de direction \(\vec z_0\) (2 inconnues). En parallèle, comme pour la porte du cours (§9) : la somme en \(A_1\) a cinq composantes indépendantes, moment nul selon \(\vec z_0\), c'est une pivot d'axe \((A_1, \vec z_0) = (O, \vec z_0)\) ; \(I_s = 5 = r_s\), donc \(h = 0\).</p>
    <p><strong>Q2.</strong> Cinq classes (0, 1, 2, 3, 4) et six liaisons : 1/0 pivot \((O, \vec z_0)\), 2/0 pivot \((C, \vec z_0)\), 3/2 pivot \((C, \vec x_2)\), 4/3 hélicoïdale \((C, \vec x_2)\), 4/2 pivot glissant \((C, \vec x_2)\), 4/1 pivot \((D, \vec z_0)\). \(\gamma = 6 - 5 + 1 = 2\) : chaîne complexe. Cycles indépendants : \(0\to1\to4\to2\to0\) et \(2\to3\to4\to2\).</p>
    <p><strong>Q3.</strong> Vis bloquée, la tige est liée au corps par l'hélicoïdale (à travers la vis) et par le pivot glissant, en parallèle et de même axe. Le pivot glissant permet rotation et translation selon \(\vec x_2\) ; l'hélicoïdale impose qu'elles soient liées : il reste un mouvement hélicoïdal, la tige peut se visser et se dévisser dans le corps en tournant sur elle-même. C'est la pivot \((D, \vec z_0)\) avec la trappe, perpendiculaire à \(\vec x_2\), qui empêche la tige de tourner autour de son axe : elle assure l'anti-rotation.</p>
    <p><strong>Q4.</strong> Fermeture du cycle \(O\to D\to C\to O\) :</p>
    <div class="formula">$$\overrightarrow{CD} = \overrightarrow{CO} + \overrightarrow{OD} = (b\cos\theta - c)\,\vec x_0 + (b\sin\theta + h)\,\vec y_0$$</div>
    <p>Son carré scalaire élimine l'angle du vérin :</p>
    <div class="formula">$$\lambda^2 = b^2 + c^2 + h^2 - 2bc\cos\theta + 2bh\sin\theta = 0{,}215 - 0{,}125\cos\theta + 0{,}15\sin\theta$$</div>
    <p>\(\lambda(0) = \sqrt{0{,}09} = 0{,}300\ \text{m}\) (vérin vertical) et \(\lambda(90^\circ) = \sqrt{0{,}365} \approx 0{,}604\ \text{m}\) : course \(\approx 304\ \text{mm}\).</p>
    <p><strong>Q5.</strong> La tige avance d'un pas par tour de vis relatif : \(N = 10/4 = 2{,}5\ \text{tr/s} = 150\ \text{tr/min}\) (la tige ne tourne pas par rapport au corps). Durée d'ouverture : \(304/10 \approx 30\ \text{s}\). En dérivant : \(2\lambda\dot\lambda = (2bc\sin\theta + 2bh\cos\theta)\,\dot\theta\) ; en \(\theta = 0\), \(\dot\lambda = \dfrac{bh}{\lambda}\dot\theta = 0{,}25\,\dot\theta\), d'où \(\dot\theta = 0{,}01/0{,}25 = 0{,}04\ \text{rad/s}\), environ 2,3°/s.</p>
    <p><strong>Q6.</strong> \(I_c = 1 + 1 + 1 + 1 + 2 + 1 = 7\). Moteur bloqué, la trappe ne bouge pas, et la tige ne peut pas tourner (Q3) : \(m = m_u = 1\). D'où \(h = m - I_c + 6\gamma = 1 - 7 + 12 = 6\) (le calcul du rang des 12 équations de fermeture le confirme). Partage :</p>
    <ul>
      <li>cycle intérieur \(2\to3\to4\to2\) : la vis (pivot puis hélicoïdale, en série) et la bague (pivot glissant) relient en parallèle la tige au corps. Comme à l'exercice 09, l'axe de la vis doit être parallèle et confondu avec celui du guidage : 4 conditions (2 angulaires, 2 de position), affaire du fabricant du vérin ;</li>
      <li>montage du vérin : avec l'intérieur du vérin remplacé par son équivalent (un pivot glissant d'axe \((C, \vec x_2)\)), le cycle extérieur compte trois pivots d'axe \(\vec z_0\) et ce pivot glissant, exactement comme la pompe du cours : \(I_c = 5\), \(m = 1\), \(h = 1 - 5 + 6 = 2\). Une condition angulaire (axes des chapes en \(C\) et \(D\) et axe des charnières parallèles, autour de la direction perpendiculaire à \(\vec x_2\) dans le plan) et une de position (cotes des chapes selon \(\vec z_0\)), affaire de l'installateur. Total : \(4 + 2 = 6\).</li>
    </ul>
    <p><strong>Q7.</strong> Dans le plan, la rotation de la vis autour de \(\vec x_2\) n'existe pas : l'ensemble {vis, écrou} est vu comme une glissière pilotée entre le corps et la tige. Quatre classes (0, 1, 2, 4), trois pivots d'axe \(\vec z_0\) et une glissière : \(I_c = 4\), \(\gamma = 1\), \(m = 1\), \(h_{\text{plan}} = 1 - 4 + 3 = 0\). Le modèle plan, isostatique, suffit pour la loi entrée-sortie et les efforts dans le plan, mais ne voit aucune des six conditions, toutes hors du plan ou internes au vérin.</p>
    <p><strong>Q8.</strong> \(I_c = 7 - 1 + 3 = 9\). Le calcul du rang (ou l'observation) donne \(m = 2\), d'où \(h = 2 - 9 + 12 = 5\). La nouvelle mobilité n'est pas interne : trappe immobile, la tige peut maintenant tourner sur son axe (la rotule en \(D\) le permet, Q3), et le moteur peut faire tourner la vis… en entraînant la tige avec elle, sans la faire sortir. L'entrée ne commande plus la sortie (seul le frottement s'y oppose) : c'est une mobilité parasite, le vérin ne fonctionne plus. Il manque une anti-rotation de la tige dans le corps.</p>
    <p><strong>Q9.</strong> \(I_c = 1 + 3 + 1 + 1 + 1 + 3 = 10\). La glissière empêche la tige de tourner par rapport au corps : moteur bloqué, la trappe est immobile, mais l'ensemble du vérin {2, 3, 4} peut tourner autour de la droite \((CD)\) passant par les centres des rotules, sans rien changer : \(m_u = 1\), \(m_i = 1\), \(m = 2\). Alors \(h = 2 - 10 + 12 = 4\) : il ne reste que l'hyperstatisme intérieur au vérin (coaxialité de la vis et du guidage, garantie par le fabricant) ; le montage du vérin sur la trappe est isostatique, il ne demande aucun réglage. Avec les charnières détaillées (sphérique et sphère-cylindre), on trouve le même \(h\).</p>
    <p><strong>Q10.</strong> Le vérin isolé {2, 3, 4} (masse négligée) ne reçoit que deux actions extérieures, celles des rotules en \(C\) et en \(D\) : deux glisseurs passant par \(C\) et \(D\). Le couple du moteur est intérieur à cet ensemble. À l'équilibre, ils sont opposés et portés par \((CD)\). En \(\theta = 0\), \(D\) est en \((b, 0)\) et \(C\) en \((c, -h)\) avec \(b = c\) : \((CD)\) est verticale, à la distance \(b = 0{,}25\ \text{m}\) de \(O\). Trappe isolée, moment en \(O\) selon \(\vec z_0\) (il élimine les actions des charnières) :</p>
    <div class="formula">$$F\times0{,}25 = 30\times9{,}81\times0{,}45 \qquad\Longrightarrow\qquad F \approx 530\ \text{N}$$</div>
    <p>La tige pousse la trappe : elle est comprimée. Un calcul pour les autres positions montre que c'est l'effort maximal sur l'ouverture (465 N à 45°, puis 0 à 90°, où le poids passe par l'axe).</p>
    <p><strong>Q11.</strong> Hélicoïdale parfaite : \(C = \dfrac{p_h}{2\pi}F = \dfrac{0{,}004}{2\pi}\times530 \approx 0{,}34\ \text{N·m}\). Avec un rendement de 0,35 : \(C \approx 0{,}34/0{,}35 \approx 0{,}96\ \text{N·m}\), que le motoréducteur doit fournir sur la vis à 150 tr/min.</p>
  </div>
