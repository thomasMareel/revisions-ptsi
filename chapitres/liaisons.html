  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la modélisation des mécanismes des semestres S1 et S2 du programme de sciences industrielles (compétence B2 « Modéliser », complétée par C1) : passer d'un système réel, d'un plan d'ensemble ou d'une maquette numérique à un <strong>modèle cinématique</strong> (classes d'équivalence, liaisons normalisées, graphe, schéma, paramètres), puis juger ce modèle (liaisons équivalentes, mobilité, hyperstatisme, modèle plan). <strong>Tout y est exigible en 1ʳᵉ année</strong>, sauf la dernière section. Il s'appuie sur <a href="#cine/cours">« Cinématique »</a> (torseur cinématique, composition des mouvements) et prépare <a href="#statique/cours">« Statique »</a> et <a href="#transm/cours">« Transmission de puissance »</a>. Ces notions sont reprises en 2ᵉ année dans <a href="#chaines/cours">« Chaînes de solides — mobilité et hyperstatisme »</a>, qui les met au service de la recherche d'efforts et de lois de mouvement.</div>

        <li><strong>Proposer un modèle cinématique paramétré</strong> à partir d'un système réel, d'une maquette numérique ou d'un plan d'ensemble (B2, S1) : graphe de liaisons, schéma cinématique, paramètres géométriques linéaires et angulaires (§7, §8).</li>

<div class="course-section">
  <div class="sec-num">§1 · MODÉLISER UN MÉCANISME</div>
  <h2>Du mécanisme réel au modèle cinématique</h2>
  <div class="intro">Un mécanisme réel compte des dizaines de pièces, avec des jeux, des déformations et du frottement. Pour prévoir ses mouvements et les efforts qu'il transmet, on le remplace par un <strong>modèle</strong> : quelques solides indéformables reliés par des liaisons idéales. Tout le chapitre apprend à construire ce modèle, puis à juger s'il est adapté à la question posée.</div>
  <div class="def-box">
    <strong>Solide indéformable.</strong> Ensemble de points dont les distances mutuelles restent constantes. Par rapport à un autre solide, un solide <strong>libre</strong> possède <strong>six degrés de liberté</strong> : trois translations (Tx, Ty, Tz) et trois rotations (Rx, Ry, Rz), repérées dans une base liée au solide de référence. Il faut six paramètres indépendants pour connaître sa position.
  </div>

<figcaption>Un solide libre possède six degrés de liberté par rapport à un autre : trois translations (Tx, Ty, Tz) et trois rotations (Rx, Ry, Rz), repérées dans une base liée au solide de référence. Une liaison en supprime certains.</figcaption>
</figure>
  <div class="def-box">
    <strong>Liaison.</strong> Relation de contact entre deux solides, qui supprime certains de leurs mouvements relatifs. Son <strong>nombre de degrés de liberté</strong> \(n_c\) (de 0 à 6) est le nombre de mouvements relatifs indépendants qu'elle laisse ; chacun est décrit par un <strong>paramètre</strong>, linéaire (en mm) pour une translation ou angulaire (en rad ou en degrés) pour une rotation.
  </div>
  <div class="def-box">
    <strong>Liaison parfaite.</strong> Modèle idéal dans lequel : les surfaces de contact sont géométriquement parfaites (plan, cylindre, sphère exacts) ; le contact est <strong>permanent et sans jeu</strong> ; il n'y a <strong>ni frottement ni adhérence</strong>. Une liaison parfaite ne s'oppose donc qu'aux mouvements qu'elle interdit (§6) et ne dissipe aucune énergie.
  </div>
  <p><strong>Ce que le modèle laisse de côté.</strong> Les jeux (quelques centièmes de millimètre dans un guidage usuel, devant des courses de plusieurs centimètres), les déformations des pièces (quelques micromètres sous charge) et le frottement (traité dans « Statique »). Ces écarts deviennent essentiels dans d'autres questions : précision d'une machine-outil, usure, rendement. Un modèle n'est pas « vrai » ou « faux » : il est adapté ou non à ce que l'on cherche.</p>
  <div class="method-box">
    <strong>Exemple — compter les degrés de liberté d'une portière</strong>
    <ol>
      <li>Portière par rapport à la caisse : une seule rotation, autour de l'axe des charnières ; 1 degré de liberté, paramètre angulaire \(\theta\), de 0 à 70° environ (butée d'ouverture).</li>
      <li>Vitre par rapport à la portière : une seule translation, dans ses coulisses ; 1 degré de liberté, paramètre linéaire \(\lambda\), de 0 à 450 mm (course de la vitre).</li>
      <li>Vitre par rapport à la caisse : il faut les deux paramètres \(\theta\) et \(\lambda\), indépendants l'un de l'autre. Ce mouvement relatif à 2 degrés de liberté n'est pas réalisé par une liaison unique, mais par deux liaisons successives (liaisons en série, §9).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre les degrés de liberté d'une <em>liaison</em> (\(n_c\), propriété d'un contact entre deux pièces) et la <em>mobilité</em> d'un mécanisme (\(m\), nombre de mouvements indépendants de l'ensemble, §10). Une pompe à quatre liaisons peut n'avoir qu'une mobilité.</div>
  <div class="notice"><strong>Contact unilatéral.</strong> Une casserole posée sur une table ne reste en contact que tant que son poids l'y plaque : le contact est <em>unilatéral</em>. Le modèle de liaison suppose le contact maintenu ; il faudra vérifier ensuite que l'effort normal calculé a le bon signe (« Statique »).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · GÉOMÉTRIE DES CONTACTS</div>
  <h2>Des surfaces en contact à la liaison</h2>
  <div class="intro">La nature d'une liaison se lit sur les surfaces par lesquelles les deux pièces se touchent. Trois surfaces élémentaires, le plan, le cylindre et la sphère, suffisent à décrire la plupart des contacts ; leur association et leurs proportions font le reste.</div>
  <div class="def-box">
    <strong>Nature d'un contact.</strong> Selon la forme de la zone de contact, il est <strong>ponctuel</strong> (un point), <strong>linéique</strong> (un segment de droite ou un cercle) ou <strong>surfacique</strong> (une portion de plan, de cylindre ou de sphère). Chaque contact possède un <strong>élément géométrique caractéristique</strong> : point de contact, droite, axe, centre, normale.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Surfaces en contact</th><th style="text-align:left">Plan</th><th style="text-align:left">Cylindre</th><th style="text-align:left">Sphère</th></tr>
    <tr><td><strong>Plan</strong></td><td>surfacique plan : appui plan</td><td>linéique rectiligne : cylindre-plan</td><td>ponctuel : sphère-plan</td></tr>
    <tr><td><strong>Cylindre</strong></td><td>—</td><td>surfacique cylindrique (même rayon, axes confondus) : pivot glissant</td><td>linéique circulaire (sphère dans un cylindre de même rayon) : sphère-cylindre</td></tr>
    <tr><td><strong>Sphère</strong></td><td>—</td><td>—</td><td>surfacique sphérique (même rayon) : sphérique</td></tr>
  </table></div>
  <p>Les autres liaisons associent plusieurs surfaces : la <strong>pivot</strong> est un contact cylindrique complété par deux arrêts axiaux (épaulements, circlips, faces planes) ; la <strong>glissière</strong> combine des surfaces qui interdisent toute rotation (deux plans non parallèles, une queue d'aronde, une rainure et une clavette, deux colonnes parallèles) ; l'<strong>hélicoïdale</strong> met en contact des filets (surfaces hélicoïdales) ; l'<strong>encastrement</strong> résulte d'un assemblage (vis, goupilles, soudure, emmanchement serré).</p>
  <h3>Contact long ou court</h3>
  <p>Un arbre dans un alésage n'a pas toujours le même modèle : tout dépend de la <strong>longueur de contact</strong> \(L\) devant le diamètre \(D\). Avec un jeu radial, même petit, un contact court laisse l'arbre basculer : les rotations perpendiculaires à l'axe ne sont plus interdites.</p>

  <div class="prop-box">
    <strong>Angle de basculement d'un centrage.</strong> Un arbre engagé sur une longueur \(L\) dans un alésage, avec un jeu diamétral \(j\) (différence des diamètres), peut s'incliner d'un angle
    <div class="formula" data-nom="Basculement d'un centrage">$$\alpha \approx \frac{j}{L}$$</div>
    Règle d'usage : <strong>centrage long</strong> si \(L/D \gt 1{,}5\) (rotations perpendiculaires bloquées : pivot glissant, ou pivot avec arrêts axiaux), <strong>centrage court</strong> si \(L/D \lt 0{,}8\) (rotations libres : sphère-cylindre, ou sphérique avec un arrêt axial). Entre les deux, on tranche avec le jeu et l'angle admissible par la fonction. Même raisonnement pour un appui plan : un appui large bloque les basculements, un appui étroit se comporte comme une ligne de contact (cylindre-plan).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">D'où vient \(\alpha \approx j/L\) ?</span>
    <div class="content">
      <p>Soit \(d\) le diamètre de l'arbre et \(d + j\) celui de l'alésage. À l'inclinaison maximale, l'arbre touche l'alésage en deux points diagonalement opposés, aux deux extrémités du contact. La projection de l'arbre sur un diamètre de l'alésage vaut alors \(L\sin\alpha + d\cos\alpha = d + j\). Pour un petit angle, \(\sin\alpha \approx \alpha\) et \(\cos\alpha \approx 1\) : \(L\,\alpha \approx j\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — bague longue ou bague courte ?</strong>
    <p>Un arbre de diamètre \(D = 20\ \text{mm}\) tourne dans une bague de bronze, avec un jeu diamétral \(j = 0{,}04\ \text{mm}\).</p>
    <ol>
      <li>Bague de longueur \(L = 30\ \text{mm}\) : \(L/D = 1{,}5\) et \(\alpha \approx 0{,}04/30 \approx 1{,}3\cdot10^{-3}\ \text{rad}\), soit \(0{,}08^\circ\). Les basculements sont négligeables : modèle <strong>pivot glissant</strong> (ou pivot si l'arbre est arrêté axialement).</li>
      <li>Bague de longueur \(L = 5\ \text{mm}\) : \(L/D = 0{,}25\) et \(\alpha \approx 0{,}04/5 = 8\cdot10^{-3}\ \text{rad}\), soit \(0{,}46^\circ\). C'est plus que le défaut d'alignement que l'on peut garantir à l'usinage entre deux paliers éloignés : la bague laisse l'arbre basculer, modèle <strong>sphère-cylindre</strong>.</li>
      <li>Un roulement rigide à billes accepte quelques milliradians de désalignement : on le modélise de même par une liaison qui laisse les trois rotations, sphère-cylindre s'il est libre en translation, sphérique s'il est arrêté axialement.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : modéliser chaque palier par une pivot parce que « l'arbre tourne ». Deux pivots sur le même arbre imposent une coaxialité parfaite des deux alésages (§11) ; deux paliers courts, modélisés par une sphérique et une sphère-cylindre, forment ensemble une pivot sans cette exigence (§9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LES ONZE LIAISONS NORMALISÉES</div>
  <h2>Noms, géométrie, degrés de liberté et symboles</h2>
  <div class="intro">La norme NF EN ISO 3952 (symboles graphiques des schémas cinématiques) et l'usage en France fixent onze liaisons usuelles, chacune avec un nom, des caractéristiques géométriques et un symbole. Les connaître par cœur, c'est pouvoir lire et dessiner tout schéma cinématique, et écrire sans hésiter ses torseurs (§4, §6).</div>
  <p><strong>Base locale.</strong> Pour chaque liaison, on utilise une base \((\vec x, \vec y, \vec z)\) adaptée : \(\vec x\) porté par l'axe, la direction ou la ligne de contact, \(\vec z\) par la normale au plan de contact. Dans le tableau, R désigne une rotation et T une translation selon le vecteur indiqué.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Liaison (ancien nom)</th><th style="text-align:left">Caractéristiques géométriques</th><th style="text-align:left">Mouvements permis</th><th>\(n_c\)</th><th style="text-align:left">Exemples</th></tr>
    <tr><td>Encastrement (liaison fixe)</td><td>aucune</td><td>aucun</td><td>0</td><td>pièces vissées, soudées, emmanchées serrées</td></tr>
    <tr><td>Pivot</td><td>axe \((A, \vec x)\)</td><td>Rx</td><td>1</td><td>roue sur son axe, charnière</td></tr>
    <tr><td>Glissière</td><td>direction \(\vec x\)</td><td>Tx</td><td>1</td><td>tiroir, chariot de machine-outil</td></tr>
    <tr><td>Hélicoïdale</td><td>axe \((A, \vec x)\), pas \(p_h\)</td><td>Rx et Tx liées</td><td>1</td><td>vis et écrou, vis à billes</td></tr>
    <tr><td>Pivot glissant</td><td>axe \((A, \vec x)\)</td><td>Rx, Tx</td><td>2</td><td>tige de vérin dans son corps</td></tr>
    <tr><td>Sphérique à doigt</td><td>centre \(A\), rotation autour de \(\vec z\) interdite</td><td>Rx, Ry</td><td>2</td><td>levier de vitesses, manette de jeu</td></tr>
    <tr><td>Appui plan</td><td>normale \(\vec z\)</td><td>Rz, Tx, Ty</td><td>3</td><td>patin sur une table, semelle de fer à repasser</td></tr>
    <tr><td>Sphérique (rotule)</td><td>centre \(A\)</td><td>Rx, Ry, Rz</td><td>3</td><td>rotule de direction, boule d'attelage</td></tr>
    <tr><td>Sphère-cylindre (linéaire annulaire)</td><td>centre \(A\), direction \(\vec x\)</td><td>Rx, Ry, Rz, Tx</td><td>4</td><td>bague courte, roulement libre axialement</td></tr>
    <tr><td>Cylindre-plan (linéaire rectiligne)</td><td>ligne de contact \((A, \vec x)\), normale \(\vec z\)</td><td>Rx, Rz, Tx, Ty</td><td>4</td><td>rouleau sur un plan, galet cylindrique</td></tr>
    <tr><td>Sphère-plan (ponctuelle)</td><td>point \(A\), normale \((A, \vec z)\)</td><td>Rx, Ry, Rz, Tx, Ty</td><td>5</td><td>bille sur un plan, palpeur, pied bombé</td></tr>
  </table></div>
  <p>Les symboles ci-dessous sont ceux de la norme, sous la forme habituelle des cours de SI ; leurs détails de tracé varient un peu d'un document à l'autre, mais les éléments distinctifs (épaulements de la pivot, carré de la glissière, sphère dans sa coupelle…) sont toujours présents. Sur un schéma, le symbole est <strong>orienté</strong> comme l'élément géométrique qu'il représente.</p>

  <div class="prop-box">
    <strong>Liaison hélicoïdale.</strong> La rotation et la translation sont liées par le pas de l'hélice \(p_h\) (avance par tour ; pour une vis à \(k\) filets de pas \(p\), \(p_h = k\,p\)). Pour une hélice <strong>à droite</strong> (cas courant), une rotation \(\theta\) autour de \(\vec x\) produit une translation dans le sens de \(\vec x\) :
    <div class="formula" data-nom="Liaison hélicoïdale">$$\lambda = \frac{p_h}{2\pi}\,\theta \qquad u = \frac{p_h}{2\pi}\,p$$</div>
    (\(\theta\) en rad, \(p\) vitesse de rotation en rad/s, \(u\) vitesse de translation) ; signe moins pour une hélice à gauche. C'est la liaison à un degré de liberté qui transforme une rotation en translation (« Transmission de puissance »).
  </div>
  <div class="method-box">
    <strong>Exemple — reconnaître les liaisons d'une chaise de bureau</strong>
    <ol>
      <li>Assise et pied : le vérin à gaz laisse l'assise tourner autour de la colonne et monter ou descendre. Deux mouvements indépendants, rotation et translation de même axe : <strong>pivot glissant</strong>, \(n_c = 2\).</li>
      <li>Chape de roulette et pied : rotation autour d'un axe vertical, sans translation : <strong>pivot</strong>, \(n_c = 1\).</li>
      <li>Roue et chape : <strong>pivot</strong> d'axe horizontal.</li>
      <li>Roue et sol : une roue cylindrique touche le sol selon un segment, <strong>cylindre-plan</strong> (\(n_c = 4\)) ; une roue bombée le touche en un point, <strong>sphère-plan</strong> (\(n_c = 5\)). Contact unilatéral, maintenu par le poids.</li>
      <li>Réglage de hauteur : la manette libère ou bloque le vérin. Pendant l'utilisation, assise et colonne ne coulissent plus : on peut alors les réunir en une seule classe (§7) ; le modèle dépend de la phase étudiée.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — avance d'une vis</strong>
    <p>Une vis M10 a un filet de pas 1,5 mm : 8 tours la font avancer de \(8\times1{,}5 = 12\ \text{mm}\) dans son écrou. Une vis trapézoïdale à deux filets de pas 4 mm a un pas d'hélice \(p_h = 8\ \text{mm}\) : elle avance de 8 mm par tour, deux fois plus vite pour la même vitesse de rotation, mais demande deux fois plus de couple pour le même effort.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre <em>pivot</em> et <em>pivot glissant</em> (seuls les arrêts axiaux les distinguent), ou <em>sphérique à doigt</em> (2 rotations) et <em>sphérique</em> (3 rotations). Et la « glissière-rotule » n'existe pas : une vis dans un écrou forme une liaison hélicoïdale.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · TORSEUR CINÉMATIQUE D'UNE LIAISON</div>
  <h2>Les mouvements permis, écrits dans la base locale</h2>
  <div class="intro">Le torseur cinématique décrit d'une seule écriture tous les mouvements relatifs qu'une liaison permet. Sa forme se lit directement sur la liste des mouvements autorisés, mais elle n'est valable qu'en certains points : oublier ce domaine de validité est l'erreur la plus fréquente sur les liaisons.</div>
  <div class="def-box">
    <strong>Torseur cinématique d'une liaison.</strong> Le mouvement de la pièce 2 par rapport à la pièce 1 est décrit, au point \(P\), par
    <div class="formula" data-nom="Torseur cinématique d'une liaison">$$\{\mathcal V(2/1)\} = \begin{Bmatrix} \vec\Omega(2/1) \\ \vec V(P, 2/1) \end{Bmatrix}_P = \begin{Bmatrix} p & u \\ q & v \\ r & w \end{Bmatrix}_{P,\,(\vec x,\vec y,\vec z)}$$</div>
    \(\vec\Omega(2/1) = p\,\vec x + q\,\vec y + r\,\vec z\) est le vecteur rotation (en rad/s), le même en tout point ; \(\vec V(P, 2/1) = u\,\vec x + v\,\vec y + w\,\vec z\) est la vitesse du point \(P\) considéré comme appartenant à 2, dans son mouvement par rapport à 1 (notée \(\vec v(P\in 2/1)\) dans « Cinématique »).
  </div>
  <div class="prop-box">
    <strong>Changement de point.</strong> La résultante \(\vec\Omega\) ne dépend pas du point ; le moment se transporte par la relation de « BABAR » :
    <div class="formula" data-nom="Transport du torseur cinématique">$$\vec V(Q, 2/1) = \vec V(P, 2/1) + \overrightarrow{QP}\wedge\vec\Omega(2/1)$$</div>
  </div>
  <p><strong>Forme d'une liaison.</strong> Dans la base locale, on garde une composante par mouvement permis et l'on annule les autres. Pivot d'axe \((A, \vec x)\), sphère-plan de normale \((A, \vec z)\) et hélicoïdale d'axe \((A, \vec x)\) :</p>
  <div class="formula">$$\{\mathcal V(2/1)\}_{\text{pivot}} = \begin{Bmatrix} p & 0 \\ 0 & 0 \\ 0 & 0 \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)} \qquad \{\mathcal V(2/1)\}_{\text{sphère-plan}} = \begin{Bmatrix} p & u \\ q & v \\ r & 0 \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)}$$</div>
  <div class="formula">$$\{\mathcal V(2/1)\}_{\text{hélicoïdale}} = \begin{Bmatrix} p & \dfrac{p_h}{2\pi}\,p \\ 0 & 0 \\ 0 & 0 \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)}$$</div>
  <p>La base et le point où la forme est la plus simple forment le <strong>repère d'expression privilégié</strong> de la liaison. Les onze formes sont réunies dans le tableau du §6.</p>
  <div class="prop-box">
    <strong>Domaine de validité de la forme simple.</strong>
    <ul>
      <li><strong>En tout point</strong> : encastrement, glissière, appui plan (leur rotation, nulle ou normale au plan de translation, ne crée par transport aucune composante interdite).</li>
      <li><strong>En tout point de l'axe</strong> \((A, \vec x)\) : pivot, pivot glissant, hélicoïdale.</li>
      <li><strong>En tout point du plan</strong> \((A, \vec x, \vec z)\) (contenant la ligne de contact et la normale) : cylindre-plan.</li>
      <li><strong>En tout point de la normale</strong> \((A, \vec z)\) : sphère-plan.</li>
      <li><strong>Au centre \(A\) seulement</strong> : sphérique, sphérique à doigt, sphère-cylindre.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Trois domaines de validité par la relation de transport</span>
    <div class="content">
      <p>On note \(\overrightarrow{QA} = \alpha\,\vec x + \beta\,\vec y + \gamma\,\vec z\) et l'on cherche les points \(Q\) où la forme reste la même, <em>quelles que soient</em> les valeurs des composantes permises.</p>
      <p><strong>Pivot.</strong> \(\vec V(Q) = \overrightarrow{QA}\wedge p\,\vec x = p\,(\gamma\,\vec y - \beta\,\vec z)\) : nul pour tout \(p\) si et seulement si \(\beta = \gamma = 0\), c'est-à-dire \(Q\) sur l'axe \((A, \vec x)\).</p>
      <p><strong>Sphère-plan.</strong> La composante de \(\vec V(Q)\) selon \(\vec z\) vaut \((\overrightarrow{QA}\wedge\vec\Omega)\cdot\vec z = \alpha\,q - \beta\,p\) : nulle pour tous \(p, q\) si et seulement si \(\alpha = \beta = 0\), c'est-à-dire \(Q\) sur la normale \((A, \vec z)\).</p>
      <p><strong>Cylindre-plan</strong> (\(\vec\Omega = p\,\vec x + r\,\vec z\)). La composante selon \(\vec z\) vaut \(-\beta\,p\) : nulle pour tout \(p\) si et seulement si \(\beta = 0\), c'est-à-dire \(Q\) dans le plan \((A, \vec x, \vec z)\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — le torseur d'une pivot ailleurs que sur son axe</strong>
    <p>Un bras 2 tourne autour de l'axe \((A, \vec z)\) d'un support 1 à \(\vec\Omega(2/1) = 10\,\vec z\ \text{rad/s}\). Un point \(B\) du bras est tel que \(\overrightarrow{AB} = 0{,}2\,\vec x\ \text{m}\).</p>
    <ol>
      <li>En \(A\), sur l'axe : \(\{\mathcal V(2/1)\} = \{10\,\vec z \;;\; \vec 0\}_A\), forme simple.</li>
      <li>En \(B\), car \(\vec x\wedge\vec z = -\vec y\) :
        <div class="formula">$$\vec V(B, 2/1) = \overrightarrow{BA}\wedge\vec\Omega = (-0{,}2\,\vec x)\wedge 10\,\vec z = 2\,\vec y\ \text{m/s}$$</div></li>
      <li>\(\{\mathcal V(2/1)\} = \{10\,\vec z \;;\; 2\,\vec y\}_B\) : le moment n'est plus nul. Ce n'est pas une autre liaison, c'est la même écrite en un point hors de son axe.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — vis à billes d'un axe de machine</strong>
    <p>Une vis à billes de pas \(p_h = 5\ \text{mm}\) tourne à \(N = 3\,000\ \text{tr/min}\) par rapport à son écrou, empêché de tourner.</p>
    <ol>
      <li>\(p = 2\pi N/60 \approx 314\ \text{rad/s}\) et \(u = \dfrac{p_h}{2\pi}\,p = p_h N/60 = 0{,}005\times50 = 0{,}25\ \text{m/s}\).</li>
      <li>\(\{\mathcal V(\text{vis}/\text{écrou})\} = \{314\,\vec x \;;\; 0{,}25\,\vec x\}_P\) en tout point \(P\) de l'axe : un seul paramètre, deux composantes liées.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner des torseurs écrits en des points différents, ou écrire la forme simple d'une sphérique ailleurs qu'en son centre. Avant toute somme (fermeture, liaisons en série), transporter tous les torseurs au même point.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CONTACT PONCTUEL : GLISSEMENT, ROULEMENT, PIVOTEMENT</div>
  <h2>Ce qui se passe au point de contact</h2>
  <div class="intro">Roues, galets, billes de roulement, cames, engrenages : beaucoup de transmissions reposent sur un contact ponctuel entre deux solides en mouvement. Écrit au point de contact, le torseur cinématique de la sphère-plan se lit physiquement : sa translation est un <strong>glissement</strong>, sa rotation se partage entre <strong>roulement</strong> et <strong>pivotement</strong>.</div>
  <div class="def-box">
    <strong>Vitesse de glissement.</strong> Deux solides 1 et 2 se touchent au point \(I\), de plan tangent commun \(\Pi\) et de normale \(\vec n\). La vitesse de glissement de 2 par rapport à 1 est
    <div class="formula" data-nom="Vitesse de glissement">$$\vec V_g = \vec V(I, 2/1) = \vec V(I, 2/0) - \vec V(I, 1/0)$$</div>
    pour tout repère 0. Tant que le contact est maintenu, elle est contenue dans le plan tangent : \(\vec V_g\cdot\vec n = 0\).
  </div>
  <div class="def-box">
    <strong>Roulement et pivotement.</strong> Le vecteur rotation \(\vec\Omega(2/1)\) se décompose en une composante normale \(\vec\Omega_n = (\vec\Omega\cdot\vec n)\,\vec n\), le <strong>pivotement</strong>, et une composante dans le plan tangent \(\vec\Omega_t = \vec\Omega - \vec\Omega_n\), le <strong>roulement</strong>.
  </div>

  <div class="prop-box">
    <strong>Roulement sans glissement.</strong> Il y a roulement sans glissement en \(I\) si \(\vec V_g = \vec 0\), c'est-à-dire \(\vec V(I, 2/0) = \vec V(I, 1/0)\) : le point de contact est alors le centre instantané de rotation de 2 par rapport à 1 (« Cinématique », §6). Il y a <strong>roulement sans glissement ni pivotement</strong> si, de plus, \(\vec\Omega_n = \vec 0\).
  </div>
  <div class="method-box">
    <strong>Exemple — une roue motrice qui patine</strong>
    <p>Une voiture avance à \(\vec V(C) = v\,\vec x\) avec \(v = 10\ \text{m/s}\) ; une roue motrice de rayon \(R = 0{,}30\ \text{m}\), de centre \(C\), tourne à \(\vec\Omega(\text{roue}/\text{sol}) = \omega\,\vec y\) (\(\vec y\) horizontal, vers la gauche du véhicule ; \(\vec z\) vertical ascendant), avec \(\omega = 50\ \text{rad/s}\).</p>
    <ol>
      <li>Point de contact : \(\overrightarrow{CI} = -R\,\vec z\), et
        <div class="formula">$$\vec V(I, \text{roue}/\text{sol}) = \vec V(C) + \overrightarrow{IC}\wedge\vec\Omega = v\,\vec x + R\,\vec z\wedge\omega\,\vec y = (v - R\,\omega)\,\vec x$$</div></li>
      <li>\(\vec V_g = (10 - 0{,}30\times50)\,\vec x = -5\,\vec x\ \text{m/s}\) : la roue tourne trop vite, sa bande de roulement glisse vers l'arrière sur la route, elle <strong>patine</strong>.</li>
      <li>Roulement sans glissement : \(v = R\,\omega\), soit \(\omega = 33{,}3\ \text{rad/s}\). Roue bloquée au freinage (\(\omega = 0\)) : \(\vec V_g = v\,\vec x\), le pneu glisse vers l'avant.</li>
      <li>En virage, la roue tourne aussi autour de la verticale : \(\vec\Omega\) a une composante selon \(\vec n = \vec z\), il y a pivotement. Braquer à l'arrêt, c'est un pivotement pur : la gomme se tord dans l'aire de contact, d'où l'effort au volant.</li>
    </ol>
  </div>
  <h3>Côté efforts : le contact réel</h3>
  <p>Une sphère-plan parfaite ne transmet qu'un effort normal (§6). Un contact réel transmet aussi une composante tangentielle, limitée par les lois de Coulomb et opposée à \(\vec V_g\) en cas de glissement (« Statique »). Et parce que le contact n'est jamais tout à fait ponctuel (les solides se déforment), il oppose aux rotations des moments résistants.</p>
  <div class="prop-box">
    <strong>Résistance au roulement et au pivotement.</strong> Sous l'effort normal \(N\), le contact s'oppose au roulement par un moment de norme au plus \(\delta\,N\) et au pivotement par un moment de norme au plus \(\delta_p\,N\), où \(\delta\) et \(\delta_p\) sont des longueurs caractéristiques du couple de matériaux. Pour une roue de rayon \(R\) qui roule, cela revient à une force résistante \(\delta N/R\). Ordres de grandeur de \(\delta/R\) : pneu sur route \(\approx 0{,}01\), roue de train en acier sur rail \(\approx 0{,}001\) à \(0{,}002\) ; à comparer à un coefficient de frottement de glissement de 0,1 à 0,6.
  </div>
  <div class="method-box">
    <strong>Exemple — pourquoi des roulettes ?</strong>
    <p>Un chariot d'atelier de 400 kg repose sur quatre roulettes de rayon \(R = 0{,}10\ \text{m}\), avec \(\delta = 1\ \text{mm}\).</p>
    <ol>
      <li>Effort normal total : \(N = 400\times9{,}81 \approx 3\,920\ \text{N}\).</li>
      <li>Force pour le faire rouler à vitesse constante : \(\delta N/R = 0{,}001\times3\,920/0{,}10 \approx 39\ \text{N}\).</li>
      <li>Pour le faire glisser sur ses patins (\(f = 0{,}3\)) : \(f N \approx 1\,180\ \text{N}\), trente fois plus. C'est l'intérêt du roulement sans glissement : la force de contact ne travaille pas, seule reste la petite résistance au roulement.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que le point de contact d'une roue qui roule sans glisser est un point fixe de la roue. Il est immobile <em>à l'instant considéré</em> (vitesse nulle), mais c'est à chaque instant un autre point de la bande de roulement ; son accélération n'est pas nulle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TORSEUR DES ACTIONS MÉCANIQUES TRANSMISSIBLES</div>
  <h2>Ce qu'une liaison parfaite peut transmettre</h2>
  <div class="intro">Une liaison interdit des mouvements en exerçant des efforts. Pour une liaison parfaite, la règle est simple : à chaque mouvement interdit correspond une composante d'effort possible, à chaque mouvement permis une composante nulle. Ce torseur fournit les inconnues de toute étude de statique.</div>
  <div class="def-box">
    <strong>Torseur des actions transmissibles.</strong> L'action de la pièce 1 sur la pièce 2 à travers la liaison se réduit, au point \(P\), à
    <div class="formula" data-nom="Torseur des actions transmissibles">$$\{\mathcal T(1\to2)\} = \begin{Bmatrix} \vec R(1\to2) \\ \vec M(P, 1\to2) \end{Bmatrix}_P = \begin{Bmatrix} X & L \\ Y & M \\ Z & N \end{Bmatrix}_{P,\,(\vec x,\vec y,\vec z)}$$</div>
    \(\vec R\) en N, moment \(\vec M(P, 1\to2)\) en N·m (noté \(\vec M_P\) dans « Statique »), transporté par \(\vec M(Q, 1\to2) = \vec M(P, 1\to2) + \overrightarrow{QP}\wedge\vec R(1\to2)\).
  </div>
  <div class="prop-box">
    <strong>Dualité (liaison parfaite).</strong> Une liaison parfaite à \(n_c\) degrés de liberté transmet \(n_s = 6 - n_c\) composantes indépendantes : la composante d'effort associée à chaque mouvement permis est nulle (force selon une translation permise, moment selon une rotation permise). Ses composantes non nulles sont les <strong>inconnues de liaison</strong> de la statique. La forme simple est valable aux mêmes points que celle du torseur cinématique (§4).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pourquoi</span>
    <span class="prompt">La raison énergétique de la dualité (notion de 2ᵉ année)</span>
    <div class="content">
      <p>Une liaison parfaite ne dissipe aucune puissance, quel que soit le mouvement permis. Or la puissance des actions mutuelles dans la liaison s'écrit (comoment des deux torseurs, vu en 2ᵉ année dans « Énergétique des systèmes de solides ») :</p>
      <div class="formula">$$\mathcal P = \vec R(1\to2)\cdot\vec V(P, 2/1) + \vec M(P, 1\to2)\cdot\vec\Omega(2/1) = X u + Y v + Z w + L p + M q + N r$$</div>
      <p>Elle doit être nulle pour toutes les valeurs des composantes permises : chacune d'elles doit avoir un coefficient nul. Pour l'hélicoïdale, \(u = \frac{p_h}{2\pi}\,p\) donne \(\left(\frac{p_h}{2\pi}X + L\right)p = 0\), d'où le lien entre la force et le moment axiaux.</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Hélicoïdale parfaite (hélice à droite).</strong> Elle transmet cinq composantes indépendantes ; le moment autour de l'axe est lié à la force axiale :
    <div class="formula" data-nom="Hélicoïdale : moment et force axiaux">$$L = -\frac{p_h}{2\pi}\,X$$</div>
  </div>
  <div class="def-box">
    <strong>Glisseur et couple.</strong> Un <strong>glisseur</strong> est un torseur de résultante non nulle dont le moment est nul en au moins un point ; il est alors nul sur toute la droite passant par ce point et parallèle à la résultante (l'axe du glisseur) : c'est le modèle d'une force. Un <strong>couple</strong> est un torseur de résultante nulle ; son moment est le même en tout point. Une sphère-plan parfaite transmet un glisseur d'axe sa normale (une force normale pure) ; une sphérique, un glisseur passant par son centre ; une glissière peut transmettre un couple pur. Côté cinématique, une rotation pure autour d'un axe fixe est un glisseur, une translation un couple.
  </div>
  <div class="method-box">
    <strong>Exemple — moment d'une force de contact</strong>
    <p>Un palpeur appuie en \(A\) sur une pièce par un contact sphère-plan de normale \((A, \vec z)\), avec un effort de 200 N. On veut le moment en \(B\), tel que \(\overrightarrow{AB} = 0{,}05\,\vec x\ \text{m}\).</p>
    <ol>
      <li>\(\{\mathcal T(\text{palpeur}\to\text{pièce})\} = \{-200\,\vec z \;;\; \vec 0\}_A\) : glisseur d'axe \((A, \vec z)\), le palpeur pousse la pièce vers le bas.</li>
      <li>Transport en \(B\) :
        <div class="formula">$$\vec M(B) = \overrightarrow{BA}\wedge\vec R = (-0{,}05\,\vec x)\wedge(-200\,\vec z) = -10\,\vec y\ \text{N·m}$$</div></li>
      <li>Le moment est nul sur la normale \((A, \vec z)\), non nul ailleurs : c'est bien un glisseur, pas un couple.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la vis qui porte une charge</strong>
    <p>Un écrou exerce sur une vis à billes (\(p_h = 5\ \text{mm}\)) une force axiale \(X = -2\,000\ \text{N}\). Liaison supposée parfaite : \(L = -\dfrac{p_h}{2\pi}X = \dfrac{0{,}005}{2\pi}\times2\,000 \approx 1{,}59\ \text{N·m}\). Il suffit de 1,6 N·m sur la vis pour équilibrer 2 kN : c'est l'effet multiplicateur d'effort de la vis (« Transmission de puissance », où s'ajoute le rendement).</p>
  </div>
  <h3>Tableau récapitulatif des onze liaisons</h3>
  <p>Base locale du §3 (\(\vec x\) : axe, direction ou ligne de contact ; \(\vec z\) : normale) ; \(k = p_h/2\pi\) pour l'hélicoïdale. Le tableau défile au téléphone.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">

    <tr><td>Encastrement</td><td>0</td><td>\(\{0\}\)</td><td>\(\begin{Bmatrix} X & L \\ Y & M \\ Z & N \end{Bmatrix}\)</td><td>en tout point</td></tr>
    <tr><td>Pivot \((A, \vec x)\)</td><td>1</td><td>\(\begin{Bmatrix} p & 0 \\ 0 & 0 \\ 0 & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} X & 0 \\ Y & M \\ Z & N \end{Bmatrix}\)</td><td>tout point de l'axe \((A, \vec x)\)</td></tr>
    <tr><td>Glissière \(\vec x\)</td><td>1</td><td>\(\begin{Bmatrix} 0 & u \\ 0 & 0 \\ 0 & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} 0 & L \\ Y & M \\ Z & N \end{Bmatrix}\)</td><td>en tout point</td></tr>
    <tr><td>Hélicoïdale \((A, \vec x)\)</td><td>1</td><td>\(\begin{Bmatrix} p & k\,p \\ 0 & 0 \\ 0 & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} X & -k\,X \\ Y & M \\ Z & N \end{Bmatrix}\)</td><td>tout point de l'axe \((A, \vec x)\)</td></tr>
    <tr><td>Pivot glissant \((A, \vec x)\)</td><td>2</td><td>\(\begin{Bmatrix} p & u \\ 0 & 0 \\ 0 & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} 0 & 0 \\ Y & M \\ Z & N \end{Bmatrix}\)</td><td>tout point de l'axe \((A, \vec x)\)</td></tr>
    <tr><td>Sphérique à doigt (centre \(A\), Rz interdite)</td><td>2</td><td>\(\begin{Bmatrix} p & 0 \\ q & 0 \\ 0 & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} X & 0 \\ Y & 0 \\ Z & N \end{Bmatrix}\)</td><td>au centre \(A\)</td></tr>
    <tr><td>Appui plan (normale \(\vec z\))</td><td>3</td><td>\(\begin{Bmatrix} 0 & u \\ 0 & v \\ r & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} 0 & L \\ 0 & M \\ Z & 0 \end{Bmatrix}\)</td><td>en tout point</td></tr>
    <tr><td>Sphérique (centre \(A\))</td><td>3</td><td>\(\begin{Bmatrix} p & 0 \\ q & 0 \\ r & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} X & 0 \\ Y & 0 \\ Z & 0 \end{Bmatrix}\)</td><td>au centre \(A\)</td></tr>
    <tr><td>Sphère-cylindre (centre \(A\), direction \(\vec x\))</td><td>4</td><td>\(\begin{Bmatrix} p & u \\ q & 0 \\ r & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} 0 & 0 \\ Y & 0 \\ Z & 0 \end{Bmatrix}\)</td><td>au centre \(A\)</td></tr>
    <tr><td>Cylindre-plan (ligne \((A, \vec x)\), normale \(\vec z\))</td><td>4</td><td>\(\begin{Bmatrix} p & u \\ 0 & v \\ r & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} 0 & 0 \\ 0 & M \\ Z & 0 \end{Bmatrix}\)</td><td>tout point du plan \((A, \vec x, \vec z)\)</td></tr>
    <tr><td>Sphère-plan (normale \((A, \vec z)\))</td><td>5</td><td>\(\begin{Bmatrix} p & u \\ q & v \\ r & 0 \end{Bmatrix}\)</td><td>\(\begin{Bmatrix} 0 & 0 \\ 0 & 0 \\ Z & 0 \end{Bmatrix}\)</td><td>tout point de la normale \((A, \vec z)\)</td></tr>
  </table></div>
  <div class="notice"><strong>Erreur classique</strong> : écrire un moment autour de l'axe d'une pivot parfaite (\(L \neq 0\)), ou une force selon la direction d'une glissière (\(X \neq 0\)) : c'est précisément la composante que le mouvement permis interdit. Avec frottement, ces composantes existent, mais la liaison n'est plus parfaite et leur valeur est donnée par une loi de comportement (Coulomb, frottement visqueux).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CLASSES D'ÉQUIVALENCE ET GRAPHE DES LIAISONS</div>
  <h2>Regrouper les pièces, puis relier les groupes</h2>
  <div class="intro">Avant de choisir des liaisons, il faut savoir entre quels « solides » les écrire. Sur un plan d'ensemble ou une maquette numérique, on regroupe les pièces qui bougent ensemble ; le graphe des liaisons résume ensuite l'architecture du mécanisme d'un coup d'œil.</div>
  <div class="def-box">
    <strong>Classe d'équivalence cinématique.</strong> Ensemble de pièces qui n'ont aucun mouvement relatif entre elles pendant la phase de fonctionnement étudiée. Elle est modélisée par un seul solide, numéroté (0 pour le bâti ou la pièce de référence).
  </div>
  <ul>
    <li>Les éléments d'assemblage (vis, goupilles, clavettes, pièces emmanchées serrées, soudées ou collées) rejoignent la classe des pièces qu'ils immobilisent.</li>
    <li>On écarte les pièces déformables (ressorts, joints, soufflets), les éléments roulants des roulements (billes, rouleaux : un roulement devient une liaison entre la classe de sa bague intérieure et celle de sa bague extérieure) et les pièces dont le mouvement n'intéresse pas l'étude.</li>
    <li>Le découpage dépend de la phase étudiée : un réglage bloqué pendant le fonctionnement réunit deux classes, qui se séparent pendant le réglage.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — classes d'équivalence d'une pompe à levier</strong>
    <p>Une pompe à main de puits est décrite par sa nomenclature :</p>

      <tr><th>Rep.</th><th style="text-align:left">Désignation</th><th>Rep.</th><th style="text-align:left">Désignation</th></tr>
      <tr><td>1</td><td>Corps (cylindre)</td><td>8</td><td>Biellette</td></tr>
      <tr><td>2</td><td>Couvercle, vissé sur 1</td><td>9</td><td>Axe, serré dans la tige 10</td></tr>
      <tr><td>3</td><td>Vis de fixation de 2 (non dessinées)</td><td>10</td><td>Tige</td></tr>
      <tr><td>4</td><td>Potence, soudée sur 2</td><td>11</td><td>Piston, vissé sur 10</td></tr>
      <tr><td>5</td><td>Axe du levier, goupillé dans 4</td><td>12</td><td>Joint de piston (élastomère)</td></tr>
      <tr><td>6</td><td>Levier</td><td>13</td><td>Clapet souple (non dessiné)</td></tr>
      <tr><td>7</td><td>Axe, serré dans le levier 6</td><td>14</td><td>Bague de guidage, emmanchée dans 2</td></tr>
    </table></div>
    <ol>
      <li>Bâti 0 = {1, 2, 3, 4, 5, 14} : tout ce qui est vissé, soudé, goupillé ou emmanché sur le corps.</li>
      <li>Levier 1 = {6, 7} ; biellette 2 = {8} ; piston 3 = {9, 10, 11}.</li>
      <li>Le joint 12 et le clapet 13, déformables, n'appartiennent à aucune classe.</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Nombre cyclomatique.</strong> Avec \(n\) classes (bâti compris) et \(n_L\) liaisons, le nombre de cycles indépendants du graphe vaut
    <div class="formula" data-nom="Nombre cyclomatique">$$\gamma = n_L - n + 1$$</div>
    Chaîne <strong>ouverte</strong> : \(\gamma = 0\) (aucune boucle, bras de robot) ; chaîne <strong>fermée</strong> : \(\gamma = 1\) ; chaîne <strong>complexe</strong> : \(\gamma \geq 2\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi \(\gamma = n_L - n + 1\) ?</span>
    <div class="content">
      <p>Relier \(n\) sommets sans former de boucle demande exactement \(n - 1\) arcs : on part d'un sommet et chaque arc ajoute un sommet nouveau (graphe en « arbre »). Toute liaison supplémentaire relie deux sommets déjà reliés : elle ferme un cycle nouveau, qui la contient, indépendant des précédents. Il y a donc \(n_L - (n - 1)\) cycles indépendants.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — trois architectures</strong>
    <ol>
      <li>Robot à six axes : sept classes (bâti et six segments) reliées en file par six pivots ; \(\gamma = 6 - 7 + 1 = 0\), chaîne ouverte.</li>
      <li>Pompe à levier : \(n = 4\), \(n_L = 4\), \(\gamma = 1\), chaîne fermée : il suffira d'une fermeture pour obtenir la loi entrée-sortie.</li>
      <li>Trappe manœuvrée par un vérin électrique (exercice « Concours PT ») : cinq classes (cadre, trappe, corps, vis, tige) et six liaisons ; \(\gamma = 6 - 5 + 1 = 2\), chaîne complexe.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le bâti dans \(n\) ; faire une classe des billes d'un roulement ; ou réunir en un seul arc deux liaisons distinctes entre les mêmes classes (deux roulements sur un arbre font deux arcs : liaisons en parallèle, §9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SCHÉMA CINÉMATIQUE ET PARAMÉTRAGE</div>
  <h2>Dessiner le modèle et le mettre en équations</h2>
  <div class="intro">Le schéma cinématique est le dessin du modèle : chaque liaison y est représentée par son symbole, placée et orientée selon sa géométrie. Muni de ses repères et de ses paramètres, il conduit directement aux lois entrée-sortie.</div>
  <div class="method-box">
    <strong>Méthode — tracer un schéma cinématique</strong>
    <ol>
      <li>Placer les éléments géométriques des liaisons (centres, axes, directions, normales) à leur position réelle, si possible à l'échelle du plan d'ensemble.</li>
      <li>Dessiner chaque symbole, orienté selon son élément géométrique.</li>
      <li>Relier les symboles d'une même classe par des traits simples, une couleur par classe ; repérer le bâti par des hachures.</li>
      <li>Numéroter les classes, nommer les points caractéristiques, placer les repères et les paramètres.</li>
      <li>Choisir la vue : <strong>plan</strong> si tous les axes de rotation sont perpendiculaires à un même plan et toutes les translations parallèles à ce plan ; <strong>perspective</strong> sinon, ou pour montrer ce que la vue plane cache.</li>
    </ol>
  </div>

<figcaption>Le même schéma en perspective : les pivots d'axe z₀ apparaissent avec leur moyeu et leur axe, le pivot glissant du piston avec son guidage vertical. C'est cette vue qui montre les conditions hors du plan : axes des pivots parallèles, positions selon z₀.</figcaption>
</figure>
  <p>Le schéma où chaque contact réel apparaît (chaque roulement, chaque portée) est le schéma <strong>d'architecture</strong> ; celui où chaque groupe de liaisons entre deux classes est remplacé par sa liaison équivalente (§9) est le schéma <strong>minimal</strong>. Le premier sert à l'étude des efforts dans chaque contact et de l'hyperstatisme, le second aux lois de mouvement.</p>
  <div class="def-box">
    <strong>Paramétrage.</strong> On associe à chaque classe \(i\) un repère \(\mathcal R_i = (O_i, \vec x_i, \vec y_i, \vec z_i)\), dont un vecteur est porté de préférence par l'axe ou la direction d'une liaison qu'elle porte. Chaque degré de liberté reçoit un <strong>paramètre</strong> : un angle entre deux bases, autour de leur axe commun, ou une longueur. Pour chaque rotation, on trace la <strong>figure de changement de base</strong> correspondante.
  </div>

  <div class="prop-box">
    <strong>Fermeture géométrique.</strong> Sur un cycle du graphe \(0 \to 1 \to \dots \to k \to 0\), la somme des vecteurs qui joignent les points caractéristiques successifs est nulle (et la composition des rotations ramène à l'orientation de départ). Projetée dans une base, elle fournit des équations scalaires entre paramètres : on élimine les paramètres sans intérêt pour obtenir la <strong>loi entrée-sortie géométrique</strong>.
  </div>
  <div class="method-box">
    <strong>Exemple — loi entrée-sortie de la pompe</strong>
    <p>On pose \(\overrightarrow{OA} = a\,\vec x_1\), \(\overrightarrow{AB} = \ell\,\vec x_2\) et \(\overrightarrow{OB} = c\,\vec x_0 + \lambda\,\vec y_0\), avec \(a = 120\ \text{mm}\), \(\ell = 100\ \text{mm}\), \(c = 140\ \text{mm}\) ; \(\theta = (\vec x_0, \vec x_1)\) est l'angle du levier, \(\beta = (\vec x_0, \vec x_2)\) celui de la biellette.</p>
    <ol>
      <li>Fermeture : \(\overrightarrow{OA} + \overrightarrow{AB} + \overrightarrow{BO} = \vec 0\), projetée sur \(\vec x_0\) et \(\vec y_0\) :
        <div class="formula">$$\begin{cases} a\cos\theta + \ell\cos\beta = c \\ a\sin\theta + \ell\sin\beta = \lambda \end{cases}$$</div></li>
      <li>On élimine \(\beta\), sans intérêt : \(\ell\cos\beta = c - a\cos\theta\) et \(\ell\sin\beta = \lambda - a\sin\theta\), puis on somme les carrés. B étant sous A, on garde la racine négative :
        <div class="formula" data-nom="Loi entrée-sortie de la pompe">$$\lambda = a\sin\theta - \sqrt{\ell^2 - (c - a\cos\theta)^2}$$</div></li>
      <li>Contrôle en \(\theta = 0\) : \(\lambda = -\sqrt{100^2 - 20^2} \approx -98{,}0\ \text{mm}\), cohérent avec une biellette presque verticale.</li>
      <li>Course pour \(\theta\) de \(-20^\circ\) à \(+20^\circ\) : \(\lambda\) passe de \(-137{,}3\) à \(-55{,}2\ \text{mm}\), soit 82,1 mm. Avec un piston de 70 mm de diamètre, chaque coup de levier déplace \(\pi\times35^2\times82{,}1 \approx 316\ \text{cm}^3\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Piège</strong> : une racine carrée cache un choix de configuration (biellette au-dessus ou au-dessous, coude d'un côté ou de l'autre). Vérifier le signe sur une position simple, et ne pas éliminer trop tôt un paramètre dont on aura besoin. La loi en vitesse s'obtient en dérivant : en \(\theta = 0\), \(\dot\lambda = a\,\dot\theta\) (« Cinématique », méthode 4).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · LIAISONS ÉQUIVALENTES : SÉRIE ET PARALLÈLE</div>
  <h2>Remplacer plusieurs liaisons par une seule</h2>
  <div class="intro">Entre deux classes, plusieurs liaisons peuvent se succéder, à travers des pièces intermédiaires (liaisons <strong>en série</strong>), ou agir ensemble (liaisons <strong>en parallèle</strong>). Les remplacer par une liaison équivalente simplifie le schéma et révèle les qualités ou les défauts d'un guidage.</div>
  <div class="def-box">
    <strong>Liaison équivalente.</strong> Liaison qui, placée seule entre les deux classes considérées, autoriserait les mêmes mouvements relatifs et transmettrait les mêmes actions mécaniques que l'ensemble des liaisons qu'elle remplace.

  <h3>Liaisons en série</h3>
  <div class="prop-box">
    <strong>Série.</strong> Les classes \(0, 1, \dots, k\) sont reliées en chaîne ouverte par \(L_1, \dots, L_k\). Les mouvements s'ajoutent (composition des mouvements), tous les torseurs étant écrits au même point :
    <div class="formula" data-nom="Liaisons en série">$$\{\mathcal V_{\text{éq}}(k/0)\} = \{\mathcal V(1/0)\} + \{\mathcal V(2/1)\} + \dots + \{\mathcal V(k/k-1)\}$$</div>
    Le nombre de paramètres indépendants du torseur obtenu est le nombre de degrés de liberté de la liaison équivalente ; s'il est inférieur au total \(I_c = \sum n_c\), la différence compte les <strong>mobilités internes</strong> (mouvements des pièces intermédiaires sans mouvement de \(k\) par rapport à 0). Côté efforts, si les pièces intermédiaires sont de masse négligeable et ne reçoivent aucune autre action, toutes les liaisons transmettent le même torseur : \(\{\mathcal T_{\text{éq}}(0\to k)\} = \{\mathcal T(0\to1)\} = \dots = \{\mathcal T(k-1\to k)\}\).
  </div>
  <div class="method-box">
    <strong>Exemple — patin à rotule</strong>
    <p>Une vis de bridage 2 appuie sur une pièce 0 par l'intermédiaire d'un patin 1 : rotule de centre \(A\) entre la vis et le patin, appui plan de normale \(\vec z\) entre le patin et la pièce.</p>
    <ol>
      <li>\(\{\mathcal V(1/0)\} = \{r_{10}\,\vec z \;;\; u_{10}\,\vec x + v_{10}\,\vec y\}\), forme valable en tout point, donc en \(A\) ; \(\{\mathcal V(2/1)\} = \{p_{21}\,\vec x + q_{21}\,\vec y + r_{21}\,\vec z \;;\; \vec 0\}_A\).</li>
      <li>Somme en \(A\) :
        <div class="formula">$$\{\mathcal V_{\text{éq}}(2/0)\} = \begin{Bmatrix} p_{21} & u_{10} \\ q_{21} & v_{10} \\ r_{10} + r_{21} & 0 \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)}$$</div></li>
      <li>Trois rotations et deux translations dans le plan : liaison équivalente <strong>sphère-plan</strong> de normale \((A, \vec z)\), 5 degrés de liberté pour \(I_c = 3 + 3 = 6\) paramètres : une mobilité interne, la rotation du patin autour de \(\vec z\) quand la vis tourne en sens inverse (\(r_{21} = -r_{10}\)). Le patin s'oriente seul sur la pièce, sans la marquer quand on serre.</li>
    </ol>
  </div>
  <h3>Liaisons en parallèle</h3>
  <div class="prop-box">
    <strong>Parallèle.</strong> Les liaisons \(L_1, \dots, L_k\) relient toutes les deux mêmes classes 0 et 1. Chacune impose le même mouvement : la liaison équivalente ne permet que les mouvements permis par toutes. Les actions s'ajoutent (équilibre de 1, torseurs au même point) :
    <div class="formula" data-nom="Liaisons en parallèle">$$\{\mathcal T_{\text{éq}}(0\to1)\} = \{\mathcal T_1(0\to1)\} + \dots + \{\mathcal T_k(0\to1)\}$$</div>
    Avec \(I_s = \sum n_s\) inconnues et \(r_s\) le nombre de composantes indépendantes du torseur somme (au plus 6), la liaison équivalente a \(6 - r_s\) degrés de liberté et le degré d'hyperstatisme du groupe vaut \(h = I_s - r_s\) (§10).
  </div>
  <div class="method-box">
    <strong>Exemple — porte sur deux gonds</strong>
    <p>Une porte 1 de masse 30 kg, de centre de gravité à \(d = 0{,}40\ \text{m}\) de l'axe vertical \((A, \vec z)\), est tenue par deux gonds courts : sphérique de centre \(A\) en bas (le gond porte le poids), sphère-cylindre de centre \(B\) et de direction \(\vec z\) en haut, avec \(\overrightarrow{AB} = H\,\vec z\), \(H = 1{,}60\ \text{m}\). Le plan de la porte est \((A, \vec x, \vec z)\).</p>
    <ol>
      <li>\(\{\mathcal T_A\} = \{X_A\vec x + Y_A\vec y + Z_A\vec z \;;\; \vec 0\}_A\) et \(\{\mathcal T_B\} = \{X_B\vec x + Y_B\vec y \;;\; \vec 0\}_B\). Transport en \(A\) : \(\overrightarrow{AB}\wedge(X_B\vec x + Y_B\vec y) = H X_B\,\vec y - H Y_B\,\vec x\).</li>
      <li>Somme en \(A\) :
        <div class="formula">$$\{\mathcal T_{\text{éq}}(0\to1)\} = \begin{Bmatrix} X_A + X_B & -H\,Y_B \\ Y_A + Y_B & H\,X_B \\ Z_A & 0 \end{Bmatrix}_{A,\,(\vec x,\vec y,\vec z)}$$</div></li>
      <li>Cinq composantes indépendantes, moment nul selon \(\vec z\) : liaison équivalente <strong>pivot</strong> d'axe \((A, \vec z)\). \(I_s = 3 + 2 = 5 = r_s\), donc \(h = 0\) : toutes les actions se calculent.</li>
      <li>Équilibre de la porte (poids \(-mg\,\vec z\) en \(G\), \(\overrightarrow{AG} = d\,\vec x + z_G\,\vec z\)) : le moment du poids en \(A\) vaut \(d\,mg\,\vec y\), donc \(H X_B + d\,mg = 0\) : \(X_B = -\dfrac{0{,}40\times30\times9{,}81}{1{,}60} \approx -73{,}6\ \text{N}\), puis \(X_A \approx +73{,}6\ \text{N}\), \(Y_A = Y_B = 0\), \(Z_A = mg \approx 294\ \text{N}\). Le gond haut tire la porte vers l'axe, le gond bas la repousse.</li>
      <li>Avec deux gonds longs modélisés par deux pivots coaxiales : \(I_s = 10\) pour le même rang 5, \(h = 5\). La répartition des efforts devient indéterminée et les deux alésages devront être parfaitement coaxiaux.</li>
    </ol>
  </div>
  <div class="notice"><strong>Choisir l'approche.</strong> En série, les mouvements se cumulent : on additionne des torseurs cinématiques. En parallèle, les efforts se partagent : on additionne des torseurs d'actions transmissibles. Dans les deux cas, le résultat dépend de la géométrie (axes concourants ou non, centre sur l'axe ou non) : ne jamais conclure sans avoir transporté les torseurs au même point. Le résultat n'est pas toujours une liaison normalisée : deux glissières perpendiculaires en série laissent deux translations, mouvement qu'aucune des onze liaisons ne décrit.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · MOBILITÉ ET HYPERSTATISME</div>
  <h2>Compter les mouvements et les contraintes en trop</h2>
  <div class="intro">Deux nombres jugent un modèle de mécanisme : sa <strong>mobilité</strong> (combien de mouvements indépendants il permet) et son <strong>degré d'hyperstatisme</strong> (combien de contraintes il impose en trop). Le premier dit combien d'actionneurs il faut ; le second, quelles exigences de fabrication le modèle suppose.</div>
  <div class="def-box">
    <strong>Mobilité.</strong> Le degré de mobilité \(m\) est le nombre de paramètres cinématiques indépendants qu'il faut se donner pour connaître tous les mouvements du mécanisme. On distingue \(m = m_u + m_i\) :
    <ul>
      <li>\(m_u\), mobilités <strong>utiles</strong> : celles qui intéressent la fonction (relation entre entrée et sortie) ; elles fixent le nombre d'actionneurs à prévoir ;</li>
      <li>\(m_i\), mobilités <strong>internes</strong> : mouvements de pièces qui laissent l'entrée et la sortie immobiles (rotation propre d'une biellette à deux rotules, d'un patin, d'un vérin autour de son axe).</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Hyperstatisme.</strong> Le degré d'hyperstatisme \(h\) est le nombre d'inconnues de liaison que les équations de la statique (ou de la dynamique) ne permettent pas de déterminer. C'est aussi le nombre de <strong>conditions géométriques</strong> à respecter pour assembler le mécanisme sans forcer. \(h = 0\) : modèle <strong>isostatique</strong> ; \(h \gt 0\) : modèle <strong>hyperstatique</strong>.
  </div>
  <h3>Approche cinématique</h3>
  <p>On écrit les \(\gamma\) fermetures cinématiques indépendantes : sur chaque cycle, la somme des torseurs cinématiques (au même point) est nulle. Les inconnues sont les \(I_c = \sum n_c\) composantes des torseurs des liaisons ; chaque cycle fournit 6 équations scalaires, soit \(E_c = 6\gamma\), dont \(r_c\) indépendantes (le rang du système). On trouve aussi \(N_c\) et \(N_s\) pour \(I_c\) et \(I_s\).</p>
  <div class="prop-box">
    <strong>Mobilité et hyperstatisme (approche cinématique).</strong> Les inconnues non déterminées par le système sont les paramètres libres ; les équations surabondantes, des conditions sur la géométrie :
    <div class="formula" data-nom="Mobilité et hyperstatisme (cinématique)">$$m = I_c - r_c \qquad h = 6\gamma - r_c \qquad\Longrightarrow\qquad h = m - I_c + 6\gamma$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — fermeture cinématique de la pompe</strong>
    <p>Cycle \(0\to1\to2\to3\to0\), torseurs écrits en \(B\) dans la base 0, avec \(\overrightarrow{OB} = c\,\vec x_0 + \lambda\,\vec y_0\) et \(\overrightarrow{OA} = a\,\vec x_1\). Inconnues : \(r_{10}\), \(r_{21}\), \(r_{32}\) (pivots d'axe \(\vec z_0\)), \(q_{30}\) et \(v_{30}\) (pivot glissant d'axe \((B, \vec y_0)\)) : \(I_c = 5\).</p>
    <ol>
      <li>Transport en \(B\), avec \(\overrightarrow{BO} = -c\,\vec x_0 - \lambda\,\vec y_0\) et \(\overrightarrow{BA} = (a\cos\theta - c)\,\vec x_0 + (a\sin\theta - \lambda)\,\vec y_0\) :
        <div class="formula">$$\begin{aligned} \vec V(B, 1/0) &= \overrightarrow{BO}\wedge r_{10}\,\vec z_0 = r_{10}\,(-\lambda\,\vec x_0 + c\,\vec y_0) \\ \vec V(B, 2/1) &= \overrightarrow{BA}\wedge r_{21}\,\vec z_0 = r_{21}\,\big((a\sin\theta - \lambda)\,\vec x_0 + (c - a\cos\theta)\,\vec y_0\big) \end{aligned}$$</div>
        et \(\vec V(B, 3/2) = \vec 0\) (B est sur l'axe), \(\{\mathcal V(0/3)\} = \{-q_{30}\,\vec y_0 \;;\; -v_{30}\,\vec y_0\}_B\).</li>
      <li>La somme nulle donne, en rotation puis en translation :
        <div class="formula">$$\begin{cases} R_x : & 0 = 0 \\ R_y : & q_{30} = 0 \\ R_z : & r_{10} + r_{21} + r_{32} = 0 \\ T_x : & -\lambda\,r_{10} + (a\sin\theta - \lambda)\,r_{21} = 0 \\ T_y : & c\,r_{10} + (c - a\cos\theta)\,r_{21} - v_{30} = 0 \\ T_z : & 0 = 0 \end{cases}$$</div></li>
      <li>Quatre équations indépendantes : \(r_c = 4\), donc \(m = 5 - 4 = 1\) (un seul actionneur : la main sur le levier) et \(h = 6 - 4 = 2\). Les deux lignes « 0 = 0 » sont les deux conditions géométriques (§11).</li>
      <li>En \(\theta = 0\) (où \(\lambda = -98\ \text{mm}\)), \(T_x\) donne \(r_{21} = -r_{10}\), puis \(T_y\) : \(v_{30} = a\,r_{10}\), soit \(0{,}12\ \text{m/s}\) pour un levier manœuvré à 1 rad/s ; c'est la dérivée de la loi géométrique du §8.</li>
    </ol>
  </div>
  <h3>Approche statique</h3>
  <p>On isole successivement les \(n - 1\) classes mobiles : \(E_s = 6(n-1)\) équations pour les \(I_s = \sum n_s\) inconnues de liaison, de rang \(r_s\). Les inconnues non déterminées sont hyperstatiques ; les équations « en trop » ne portent que sur les actions extérieures (couple moteur et couple résistant, par exemple) : il y en a une par mobilité.</p>
  <div class="prop-box">
    <strong>Mobilité et hyperstatisme (approche statique).</strong>
    <div class="formula" data-nom="Mobilité et hyperstatisme (statique)">$$h = I_s - r_s \qquad m = 6(n-1) - r_s \qquad\Longrightarrow\qquad h = m + I_s - 6(n-1)$$</div>
    Les deux approches donnent le même \(h\), qui est toujours positif ou nul : un calcul qui donne \(h \lt 0\) signale une mobilité oubliée.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Cohérence des deux formules, et \(h \geq 0\)</span>
    <div class="content">
      <p>Chaque liaison vérifie \(n_c + n_s = 6\), donc \(I_c + I_s = 6\,n_L\). Alors</p>
      <div class="formula">$$m + I_s - 6(n-1) = m - I_c + 6(n_L - n + 1) = m - I_c + 6\gamma$$</div>
      <p>Et comme le rang \(r_c\) d'un système de \(6\gamma\) équations ne peut dépasser \(6\gamma\), \(h = 6\gamma - r_c \geq 0\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — la pompe par l'approche statique</strong>
    <p>Trois pivots (5 inconnues chacune) et un pivot glissant (4) : \(I_s = 19\) ; \(n = 4\), donc \(6(n-1) = 18\). Avec \(m = 1\) observé : \(h = 1 + 19 - 18 = 2\), comme par l'approche cinématique. En pratique, on obtient \(m\) en observant le mécanisme (bloquer l'entrée, puis chercher ce qui bouge encore) et l'on calcule \(h\) par la formule la plus commode, sans calculer de rang.</p>
  </div>
  <div class="method-box">
    <strong>Exemple — une mobilité interne</strong>
    <p>Barrière de parking : lisse 1 en pivot avec le bâti 0, manivelle 2 entraînée par le moteur, bielle 3 entre manivelle et lisse ; quatre pivots d'axes parallèles, \(\gamma = 1\).</p>
    <ol>
      <li>Avec quatre pivots : \(I_c = 4\), manivelle bloquée tout est immobile, \(m = 1\) : \(h = 1 - 4 + 6 = 3\).</li>
      <li>Bielle montée sur deux rotules : \(I_c = 1 + 1 + 3 + 3 = 8\). Manivelle bloquée, la lisse est immobile, mais la bielle peut encore tourner autour de la droite qui joint les centres des rotules : \(m_i = 1\), \(m = 2\), d'où \(h = 2 - 8 + 6 = 0\).</li>
      <li>Oublier \(m_i\) aurait donné \(h = 1 - 8 + 6 = -1\), résultat impossible qui signale l'oubli.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour la mobilité le résultat de \(6(n-1) - \sum n_s\) (ou de sa version plane). Ce décompte vaut \(m - h\), et non \(m\) : il ne donne la mobilité que si le mécanisme est isostatique. On obtient \(m\) par l'observation ou par le rang, jamais par cette seule soustraction.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · CONDITIONS GÉOMÉTRIQUES ET MODÈLE ISOSTATIQUE</div>
  <h2>Ce que l'hyperstatisme exige, et comment s'en libérer</h2>
  <div class="intro">Un modèle hyperstatique n'est pas faux : il dit que le mécanisme ne s'assemble et ne fonctionne sans efforts parasites que si certaines dimensions ou orientations sont réalisées exactement. Le concepteur choisit en connaissance de cause : payer cette précision, ou libérer des degrés de liberté.</div>
  <div class="prop-box">
    <strong>Lire les conditions géométriques.</strong> Dans une fermeture cinématique, une équation qui se réduit à « 0 = 0 » correspond à un mouvement qu'aucune liaison du cycle n'autorise : le défaut correspondant doit être nul à la fabrication. Une équation de <strong>rotation</strong> donne une condition <strong>angulaire</strong> (parallélisme, perpendicularité) ; une équation de <strong>translation</strong>, une condition de <strong>position</strong> (distance, alignement). Côté statique, une inconnue hyperstatique de type moment correspond à une condition angulaire, une inconnue de type force à une condition de position.
  </div>
  <div class="method-box">
    <strong>Exemple — les deux conditions de la pompe</strong>
    <ol>
      <li>\(R_x : 0 = 0\) : aucune liaison ne permet de rotation autour de \(\vec x_0\). Les axes des trois pivots doivent avoir exactement la même orientation autour de \(\vec x_0\) : condition angulaire de parallélisme, qui porte sur l'alésage de la potence, les deux alésages du levier, ceux de la biellette et l'axe de la tige.</li>
      <li>\(T_z : 0 = 0\) : aucune translation selon \(\vec z_0\). Les plans médians des pivots doivent tomber à des cotes compatibles : condition de position.</li>
      <li>Aucune condition autour de \(\vec y_0\) : le pivot glissant laisse le piston tourner sur son axe et absorbe ce défaut. La cotation transforme ces exigences en tolérances de parallélisme et de localisation (<a href="#cotation/cours">« Cotation &amp; tolérances »</a>).</li>
    </ol>
  </div>
  <h3>Conséquences pratiques</h3>
  <ul>
    <li><strong>Ce que l'hyperstatisme coûte</strong> : tolérances serrées, donc usinage et contrôle plus chers ; montage délicat (alésage en ligne, appairage, réglage) ; si les conditions ne sont pas tenues, efforts internes de montage, usure, échauffement, grippage ; sensibilité aux dilatations et aux déformations du bâti ; inconnues incalculables par la seule statique.</li>
    <li><strong>Ce qu'il apporte</strong> : rigidité, meilleure répartition des charges (pressions de contact plus faibles), guidage plus précis, sécurité en cas de défaillance d'un appui. Glissières de machines-outils et longues lignes d'arbres sont volontairement hyperstatiques.</li>
  </ul>
  <div class="method-box">
    <strong>Ordres de grandeur</strong>
    <ol>
      <li>Dilatation : un arbre en acier (\(\alpha \approx 12\cdot10^{-6}\ \text{K}^{-1}\)) de 400 mm qui s'échauffe de 50 K s'allonge de \(12\cdot10^{-6}\times400\times50 = 0{,}24\ \text{mm}\). Si deux paliers l'arrêtaient axialement, cette dilatation empêchée chargerait fortement les roulements : un seul palier arrête l'arbre axialement.</li>
      <li>Défaut d'orientation : une tolérance de parallélisme de 0,02 mm sur 100 mm correspond à \(2\cdot10^{-4}\ \text{rad}\). Un roulement rigide à billes accepte environ \(10^{-3}\ \text{rad}\) de désalignement, un roulement à rotule 2 à 3° : c'est pourquoi on les modélise par des liaisons qui laissent les rotations.</li>
    </ol>
  </div>
  <h3>Rendre un modèle isostatique</h3>
  <div class="method-box">
    <strong>Méthode — libérer les bons degrés de liberté</strong>
    <ol>
      <li>Localiser l'hyperstatisme : lignes « 0 = 0 » de la fermeture cinématique, inconnues indéterminées de l'approche statique, ou raisonnement local sur un guidage en parallèle.</li>
      <li>Choisir la liaison à modifier, de préférence parmi les liaisons intermédiaires : assouplir la liaison de l'actionneur ou de l'organe de sortie dégraderait le guidage que le mécanisme doit garantir.</li>
      <li>Libérer exactement les mouvements correspondants, par <strong>substitution</strong> d'une liaison (pivot → sphérique : deux rotations ; pivot → pivot glissant : une translation ; glissière → pivot glissant : une rotation ; appui plan → sphère-plan…) ou par <strong>ajout d'un solide</strong> intermédiaire, qui crée des liaisons en série (biellette, accouplement, patin à rotule).</li>
      <li>Recompter \(I_c\), \(m\), \(h\) et vérifier que \(m_u\) n'a pas changé.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une pompe isostatique</strong>
    <ol>
      <li>Il faut libérer la rotation autour de \(\vec x_0\) et la translation selon \(\vec z_0\). On remplace la pivot d'axe \((A, \vec z_0)\) entre levier et biellette par une <strong>sphérique</strong> de centre \(A\) (embout à rotule) : \(I_c = 1 + 3 + 1 + 2 = 7\).</li>
      <li>Levier bloqué, rien ne bouge : la biellette, tenue en \(B\) par sa pivot d'axe \(\vec z_0\), ne peut pas tourner autour de \(AB\). Donc \(m = 1\) et \(h = 1 - 7 + 6 = 0\).</li>
      <li>Interprétation : la rotule absorbe le défaut d'orientation autour de \(\vec x_0\) ; un décalage selon \(\vec z_0\) est rattrapé par une petite rotation de l'ensemble biellette et piston autour de l'axe du piston, que le pivot glissant permet.</li>
      <li>Autre solution : pivot glissant en \(A\) et rotule en \(B\). Alors \(I_c = 8\), le piston peut tourner sur lui-même sans rien entraîner (\(m_i = 1\), sans inconvénient), \(m = 2\) et \(h = 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Piège</strong> : un mécanisme peut devenir isostatique… et inutilisable. Si une liberté ajoutée permet à la sortie de bouger entrée bloquée, ou à l'entrée de tourner sans entraîner la sortie, on a créé une mobilité parasite (exercice « Concours PT » : une tige de vérin qui tourne avec sa vis au lieu d'avancer). Recompter \(m_u\) après chaque modification. Autres moyens, sans changer de liaison : usinage des alésages en une seule prise de pièce, cales de réglage, pièces souples (silentblocs, accouplements élastiques), jeu fonctionnel.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · MODÉLISATION PLANE</div>
  <h2>Quand peut-on raisonner dans un plan ?</h2>
  <div class="intro">Beaucoup de mécanismes se déplacent dans des plans parallèles. Les étudier dans un plan divise par deux le nombre d'équations ; encore faut-il en connaître les conditions, et savoir ce que ce modèle ne voit pas.</div>
  <div class="prop-box">
    <strong>Conditions de la modélisation plane.</strong> On peut étudier le mécanisme dans le plan \((\vec x, \vec y)\) si :
    <ul>
      <li>les <strong>mouvements</strong> sont plans : axes de toutes les rotations perpendiculaires au plan, translations parallèles au plan ;</li>
      <li>les <strong>actions mécaniques</strong> sont contenues dans le plan, ou symétriques par rapport à lui (plan de symétrie de la géométrie et du chargement).</li>
    </ul>
    Chaque solide n'a plus que 3 degrés de liberté (Tx, Ty, Rz) et chaque isolement donne 3 équations (deux résultantes, un moment autour de \(\vec z\)).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Liaison dans le plan \((\vec x, \vec y)\)</th><th>Mouvements</th><th>Inconnues</th><th style="text-align:left">Liaisons 3D qui s'y ramènent</th></tr>
    <tr><td>Pivot d'axe \(\vec z\)</td><td>Rz</td><td>\(X, Y\)</td><td>pivot, pivot glissant ou sphère-cylindre d'axe \(\vec z\), sphérique</td></tr>
    <tr><td>Glissière de direction \(\vec x\)</td><td>Tx</td><td>\(Y, N\)</td><td>glissière, pivot glissant d'axe \(\vec x\), appui plan de normale \(\vec y\)</td></tr>
    <tr><td>Contact ponctuel de normale \(\vec y\)</td><td>Tx, Rz</td><td>\(Y\)</td><td>sphère-plan, cylindre-plan de ligne parallèle à \(\vec z\)</td></tr>
    <tr><td>Encastrement</td><td>aucun</td><td>\(X, Y, N\)</td><td>encastrement</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Hyperstatisme plan.</strong> Chaque cycle donne 3 équations et chaque liaison plane vérifie \(n_c + n_s = 3\) :
    <div class="formula" data-nom="Hyperstatisme plan">$$h_{\text{plan}} = m - I_c + 3\gamma = m + I_s - 3(n-1)$$</div>
    Le modèle plan ignore toutes les contraintes hors du plan (parallélisme des axes, positions selon \(\vec z\)) : \(h_{\text{plan}} \leq h\). Un mécanisme isostatique en plan est souvent hyperstatique dans l'espace.
  </div>
  <div class="method-box">
    <strong>Exemple — la pompe en plan</strong>
    <ol>
      <li>Les trois pivots d'axe \(\vec z_0\) restent des pivots (1 mouvement, 2 inconnues) ; le pivot glissant d'axe \(\vec y_0\) devient une glissière (1 mouvement, 2 inconnues).</li>
      <li>\(I_c = 4\), \(\gamma = 1\), \(m = 1\) : \(h_{\text{plan}} = 1 - 4 + 3 = 0\). Par la statique : \(I_s = 8\), \(n = 4\), \(h = 1 + 8 - 9 = 0\).</li>
      <li>Dans l'espace, \(h = 2\) : les deux conditions (\(R_x\) et \(T_z\)) sont hors du plan et le modèle plan ne pouvait pas les voir. Il reste parfaitement valable pour calculer, dans le plan, l'effort sur le piston en fonction de l'effort sur le levier.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure qu'un mécanisme est isostatique parce que \(h_{\text{plan}} = 0\). Le modèle plan dit seulement que les efforts <em>dans le plan</em> se calculent ; quand deux liaisons symétriques par rapport au plan (deux roulements, deux charnières) y sont représentées par une seule, il donne la somme de leurs efforts, pas la part de chacune.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · 2ᵉ ANNÉE</div>
  <h2>Ce qui vient ensuite</h2>
  <div class="intro">Le programme de 2ᵉ année réutilise ce chapitre dans presque chaque étude de mécanisme. Rien de ce qui suit n'est exigible en PTSI.</div>
  <ul>
    <li><strong>Graphe de structure et choix des isolements</strong> (S3) : le graphe des liaisons complété par les actions extérieures sert à choisir quel solide isoler et quelle équation écrire pour atteindre une action inconnue (effort d'un vérin, couple d'un moteur) sans calculer les autres : <a href="#chaines/cours">« Chaînes de solides — mobilité et hyperstatisme »</a>, §3, qui reprend aussi les fermetures, les liaisons équivalentes et l'hyperstatisme sur d'autres exemples.</li>
    <li><strong>Torseur des petits déplacements</strong> (S3) : même structure que le torseur cinématique, pour des déplacements et rotations petits ; il sert en cotation et en résistance des matériaux.</li>
    <li><strong>Conception des guidages</strong> : choix et montage des roulements, modèles des paliers, arrêts axiaux : <a href="#conception/cours">« Conception des liaisons — assemblages et guidages »</a>.</li>
    <li><strong>Calcul des inconnues hyperstatiques</strong> : il faut un modèle déformable (élasticité des pièces et des contacts) ; c'est hors programme des deux années, qui demandent seulement de dénombrer ces inconnues et d'interpréter les conditions géométriques.</li>
  </ul>
</div>
