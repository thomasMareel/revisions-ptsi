<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Nature de séries simples</h3>
  <div class="statement">Étudier la nature des séries suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(\sum_{n \geq 0} (2/3)^n\)</div>
  <div class="q"><strong>Q2.</strong> \(\sum_{n \geq 1} 1/n^3\)</div>
  <div class="q"><strong>Q3.</strong> \(\sum_{n \geq 0} \dfrac{n}{n+1}\)</div>
  <div class="q"><strong>Q4.</strong> \(\sum_{n \geq 1} \dfrac{1}{\sqrt{n}}\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Série géométrique de raison \(q = 2/3\), \(|q| < 1\) : <strong>converge</strong>. Somme \(= 1/(1-2/3) = 3\).</p>
    <p><strong>Q2.</strong> Série de Riemann avec \(\alpha = 3 > 1\) : <strong>converge</strong>.</p>
    <p><strong>Q3.</strong> \(u_n = n/(n+1) \to 1 \neq 0\). Divergence grossière : <strong>diverge</strong>.</p>
    <p><strong>Q4.</strong> Série de Riemann avec \(\alpha = 1/2 \leq 1\) : <strong>diverge</strong>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Critère d'équivalence</h3>
  <div class="statement">Étudier la nature des séries suivantes en utilisant un équivalent.</div>
  <div class="q"><strong>Q1.</strong> \(\sum_{n \geq 1} \dfrac{\ln n}{n^3}\)</div>
  <div class="q"><strong>Q2.</strong> \(\sum_{n \geq 1} \sin\!\left(\dfrac{1}{n^2}\right)\)</div>
  <div class="q"><strong>Q3.</strong> \(\sum_{n \geq 1} \dfrac{n^2 + 3n + 1}{n^4 + 2}\)</div>
  <div class="q"><strong>Q4.</strong> \(\sum_{n \geq 2} \dfrac{1}{n\ln n}\) (penser à la comparaison série-intégrale)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u_n = \ln n/n^3\). Par croissance comparée, \(u_n = o(1/n^2)\). Or \(\sum 1/n^2\) converge (Riemann), donc par comparaison \(\sum u_n\) <strong>converge</strong>. (Alternative : on peut aussi dire que \(\ln n \leq n^{1/2}\) pour \(n\) assez grand, donc \(u_n \leq 1/n^{5/2}\) — encore Riemann convergente.)</p>
    <p><strong>Q2.</strong> </p><div class="formula">$$\sin(1/n^2) \underset{n\to\infty}{\sim} 1/n^2 > 0.$$</div><p> Par équivalence, même nature que \(\sum 1/n^2\) : <strong>converge</strong>.</p>
    <p><strong>Q3.</strong> Terme général positif. Au numérateur dominant : \(n^2\). Au dénominateur dominant : \(n^4\). Donc \(u_n \sim n^2/n^4 = 1/n^2\). Riemann convergente → <strong>converge</strong>.</p>
    <p><strong>Q4.</strong> Pas d'équivalent simple qui permette de conclure : \(\dfrac{1}{n\ln n}\) est négligeable devant \(\dfrac{1}{n}\), ce qui ne dit rien. On utilise la <strong>comparaison série-intégrale</strong> (au programme de PTSI). La fonction \(f(t) = \dfrac{1}{t\ln t}\) est continue, positive et décroissante sur \([2, +\infty[\) (car \(t \mapsto t\ln t\) y est positive et croissante), de primitive \(\ln(\ln t)\). Pour \(k \geq 2\), \(f(k) \geq \int_k^{k+1} f(t)\,\mathrm{d}t\), d'où, en sommant :</p>
    <div class="formula">$$\sum_{k=2}^{N} \frac{1}{k\ln k} \;\geq\; \int_2^{N+1} \frac{\mathrm{d}t}{t\ln t} = \ln\bigl(\ln(N+1)\bigr) - \ln(\ln 2) \xrightarrow[N \to +\infty]{} +\infty$$</div>
    <p>La série <strong>diverge</strong> (très lentement).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Factorielles et puissances : conclure avec les outils de PTSI</h3>
  <div class="statement">Étudier la nature des séries suivantes par comparaison, croissances comparées ou série de référence (la règle de d'Alembert, vue en 2ᵉ année, n'est pas nécessaire).</div>
  <div class="q"><strong>Q1.</strong> \(\sum_{n \geq 1} \dfrac{n!}{n^n}\). Indication : écrire \(\frac{n!}{n^n}\) comme un produit de \(n\) fractions.</div>
  <div class="q"><strong>Q2.</strong> \(\sum_{n \geq 0} \dfrac{2^n}{n!}\) ; donner sa somme.</div>
  <div class="q"><strong>Q3.</strong> \(\sum_{n \geq 0} \dfrac{n^{10}}{2^n}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{n!}{n^n} = \dfrac1n\times\dfrac2n\times\dfrac3n\times\cdots\times\dfrac nn\). Pour \(n \ge 2\), chacun des facteurs \(\frac kn\) avec \(k \ge 3\) est au plus 1, donc</p>
    <div class="formula">$$0 \le \frac{n!}{n^n} \le \frac1n\times\frac2n = \frac{2}{n^2} .$$</div>
    <p>La série de Riemann \(\sum\frac{1}{n^2}\) converge : par comparaison, \(\sum\frac{n!}{n^n}\) <strong>converge</strong>.</p>
    <p><strong>Q2.</strong> C'est la série exponentielle en \(z = 2\) : elle <strong>converge</strong> et \(\displaystyle\sum_{n=0}^{+\infty}\frac{2^n}{n!} = \mathrm e^2 \approx 7{,}389\).</p>
    <p><strong>Q3.</strong> Termes positifs, et \(n^2\times\dfrac{n^{10}}{2^n} = \dfrac{n^{12}}{2^n} \to 0\) par croissances comparées : \(\dfrac{n^{10}}{2^n} = o\!\left(\dfrac{1}{n^2}\right)\), donc la série <strong>converge</strong> (règle \(n^\alpha u_n\)).</p>
    <p><em>Remarque (2ᵉ année).</em> La règle de d'Alembert conclut aussi : les rapports \(\frac{u_{n+1}}{u_n}\) tendent respectivement vers \(\frac1{\mathrm e}\), \(0\) et \(\frac12\), tous strictement inférieurs à 1.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Série télescopique</h3>
  <div class="statement">On considère la série \(\sum_{n \geq 1} \dfrac{1}{n(n+1)(n+2)}\).</div>
  <div class="q"><strong>Q1.</strong> Décomposer en éléments simples \(\dfrac{1}{n(n+1)(n+2)}\).</div>
  <div class="q"><strong>Q2.</strong> En déduire la somme \(\displaystyle\sum_{n=1}^{+\infty} \dfrac{1}{n(n+1)(n+2)}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Recherche de \(a, b, c\) tels que \(\dfrac{1}{n(n+1)(n+2)} = \dfrac{a}{n} + \dfrac{b}{n+1} + \dfrac{c}{n+2}\).<br>
    En multipliant par \(n\) puis évaluant en \(n=0\) : \(a = 1/2\). En multipliant par \(n+1\) et évaluant en \(n=-1\) : \(b = -1\). En multipliant par \(n+2\) et évaluant en \(n=-2\) : \(c = 1/2\).<br>
    Donc </p><div class="formula">$$\dfrac{1}{n(n+1)(n+2)} = \dfrac{1}{2}\left(\dfrac{1}{n} - \dfrac{2}{n+1} + \dfrac{1}{n+2}\right) = \dfrac{1}{2}\left[\left(\dfrac{1}{n} - \dfrac{1}{n+1}\right) - \left(\dfrac{1}{n+1} - \dfrac{1}{n+2}\right)\right].$$</div>
    <p><strong>Q2.</strong> En posant \(v_n = \dfrac{1}{n} - \dfrac{1}{n+1}\), on a \(u_n = \dfrac{1}{2}(v_n - v_{n+1})\). Donc :</p><div class="formula">$$S_N = \sum_{n=1}^N u_n = \dfrac{1}{2}(v_1 - v_{N+1}) \to \dfrac{1}{2} v_1 = \dfrac{1}{2}\left(1 - \dfrac{1}{2}\right) = \dfrac{1}{4}.$$</div><p><br>
    Donc \(\displaystyle\sum_{n=1}^{+\infty} \dfrac{1}{n(n+1)(n+2)} = \dfrac{1}{4}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Séries alternées traitées par les suites adjacentes</h3>
  <div class="statement">Le théorème des séries alternées est au programme de 2ᵉ année ; on le remplace ici par un raisonnement de 1ʳᵉ année, avec les suites adjacentes. On note \(S_n = \displaystyle\sum_{k=1}^{n}\frac{(-1)^k}{k}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que les suites \((S_{2n})\) et \((S_{2n+1})\) sont adjacentes. En déduire que la série \(\sum_{n \geq 1}\dfrac{(-1)^n}{n}\) converge.</div>
  <div class="q"><strong>Q2.</strong> La série \(\sum_{n \geq 1}\dfrac{(-1)^n}{n^2}\) converge-t-elle ? Et \(\sum_{n \geq 1}\dfrac{(-1)^n}{n}\) est-elle absolument convergente ?</div>
  <div class="q"><strong>Q3.</strong> Même question qu'en Q1 pour \(\sum_{n \geq 1}\dfrac{\cos(n\pi)}{\sqrt{n}}\).</div>
  <div class="q"><strong>Q4.</strong> Pour la série de Q1, de somme \(S\), montrer que \(|S - S_n| \le \frac{1}{n+1}\). Combien de termes faut-il sommer pour approcher \(S\) à \(10^{-3}\) près ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On calcule les différences :</p>
    <div class="formula">$$S_{2n+2} - S_{2n} = -\frac{1}{2n+1} + \frac{1}{2n+2} \lt 0, \qquad S_{2n+1} - S_{2n-1} = \frac{1}{2n} - \frac{1}{2n+1} \gt 0 .$$</div>
    <p>Donc \((S_{2n})\) décroît, \((S_{2n+1})\) croît, et \(S_{2n+1} - S_{2n} = -\frac{1}{2n+1} \to 0\) : les suites sont adjacentes et ont une limite commune \(S\). Les deux suites extraites de rangs pairs et impairs tendent vers \(S\), donc \(S_n \to S\) : la série <strong>converge</strong>. (Sa somme vaut \(-\ln 2\) : chapitre « Intégrales », §10.)</p>
    <p><strong>Q2.</strong> \(\left|\frac{(-1)^n}{n^2}\right| = \frac{1}{n^2}\) : la série \(\sum\frac{(-1)^n}{n^2}\) est absolument convergente, donc convergente (sa somme est \(-\frac{\pi^2}{12}\)). En revanche \(\sum\left|\frac{(-1)^n}{n}\right| = \sum\frac1n\) diverge : la série de Q1 converge sans converger absolument (on dit qu'elle est <em>semi-convergente</em>, notion de 2ᵉ année).</p>
    <p><strong>Q3.</strong> \(\cos(n\pi) = (-1)^n\). Le raisonnement de Q1 n'a utilisé que deux faits sur \(a_n = \frac1n\) : la suite décroît et tend vers 0. C'est encore le cas de \(a_n = \frac{1}{\sqrt n}\) : avec \(T_n = \sum_{k=1}^{n}\frac{(-1)^k}{\sqrt k}\), \(T_{2n+2} - T_{2n} = a_{2n+2} - a_{2n+1} \le 0\), \(T_{2n+1} - T_{2n-1} = a_{2n} - a_{2n+1} \ge 0\) et \(T_{2n} - T_{2n+1} = a_{2n+1} \to 0\) : la série <strong>converge</strong>. Elle n'est pas absolument convergente (\(\sum\frac{1}{\sqrt n}\) diverge). Ce raisonnement général est le théorème des séries alternées de 2ᵉ année.</p>
    <p><strong>Q4.</strong> \(S\) est comprise entre deux sommes partielles consécutives : \(S_{2n+1} \le S \le S_{2n}\), et de même entre \(S_{2n+1}\) et \(S_{2n+2}\). Donc \(|S - S_n| \le |S_{n+1} - S_n| = \frac{1}{n+1}\). Pour une erreur au plus \(10^{-3}\), il suffit que \(n + 1 \ge 1000\) : <strong>999 termes</strong> (erreur réelle de \(S_{999}\) : \(5{,}0 \times 10^{-4}\)). La convergence est très lente, ce qui est typique d'une série qui ne converge pas absolument.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Synthèse : convergence absolue selon un paramètre</h3>
  <div class="statement">Pour \(\alpha \in \mathbb{R}\), on considère la série \(\sum_{n \geq 1} \dfrac{(-1)^n \ln n}{n^\alpha}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la série est absolument convergente si \(\alpha \gt 1\).</div>
  <div class="q"><strong>Q2.</strong> Montrer qu'elle diverge grossièrement si \(\alpha \le 0\).</div>
  <div class="q"><strong>Q3.</strong> Montrer qu'elle n'est pas absolument convergente si \(0 \lt \alpha \le 1\).</div>
  <div class="q"><strong>Q4.</strong> (Pour aller plus loin, 2ᵉ année.) Que dire de sa convergence pour \(0 \lt \alpha \le 1\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(|u_n| = \frac{\ln n}{n^\alpha}\). On choisit \(\beta\) avec \(1 \lt \beta \lt \alpha\) (par exemple \(\beta = \frac{1 + \alpha}{2}\)) : \(n^\beta|u_n| = \frac{\ln n}{n^{\alpha - \beta}} \to 0\) par croissances comparées, donc \(|u_n| = o\!\left(\frac{1}{n^\beta}\right)\) et \(\sum|u_n|\) converge : la série est <strong>absolument convergente</strong>, donc convergente.</p>
    <p><strong>Q2.</strong> Si \(\alpha \le 0\), \(|u_n| = n^{-\alpha}\ln n \ge \ln n\) pour \(n \ge 1\), qui tend vers \(+\infty\) : \(u_n\) ne tend pas vers 0, <strong>divergence grossière</strong>.</p>
    <p><strong>Q3.</strong> Si \(0 \lt \alpha \le 1\), pour \(n \ge 3\), \(\ln n \ge 1\) et \(n^\alpha \le n\), donc \(|u_n| \ge \frac{1}{n}\) : par comparaison avec la série harmonique, \(\sum|u_n|\) diverge. La série n'est <strong>pas absolument convergente</strong> ; les outils de PTSI ne suffisent pas à conclure sur sa convergence.</p>
    <p><strong>Q4.</strong> La fonction \(f(x) = \frac{\ln x}{x^\alpha}\) a pour dérivée \(\frac{1 - \alpha\ln x}{x^{\alpha+1}}\), négative pour \(x \gt \mathrm e^{1/\alpha}\) : \(a_n = \frac{\ln n}{n^\alpha}\) décroît à partir d'un certain rang et tend vers 0. Le raisonnement par suites adjacentes de l'exercice 5 (théorème des séries alternées en 2ᵉ année), appliqué à partir de ce rang, montre que la série <strong>converge</strong>. Bilan : convergence absolue si \(\alpha \gt 1\), convergence sans convergence absolue si \(0 \lt \alpha \le 1\), divergence grossière si \(\alpha \le 0\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Sommes de séries géométriques et exponentielles</h3>
  <div class="statement">Justifier la convergence et calculer la somme.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\sum_{n=1}^{+\infty}\left(-\frac13\right)^n\).</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\sum_{n=0}^{+\infty}\left(\frac{1}{2^n} + \frac{(-1)^n}{n!}\right)\).</div>
  <div class="q"><strong>Q3.</strong> \(\displaystyle\sum_{n=0}^{+\infty}\frac{n + 1}{n!}\).</div>
  <div class="q"><strong>Q4.</strong> Écrire le nombre \(1{,}2454545\ldots\) (le motif 45 se répète indéfiniment) sous forme de fraction irréductible.</div>
  <div class="q"><strong>Q5.</strong> \(\displaystyle\sum_{n=0}^{+\infty}\left(\frac{i}{2}\right)^n\), et en déduire \(\displaystyle\sum_{k=0}^{+\infty}\frac{(-1)^k}{4^k}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Série géométrique de raison \(q = -\frac13\), \(|q| \lt 1\), qui commence à \(n = 1\) : premier terme sur \(1 - q\), soit \(\dfrac{-1/3}{1 + 1/3} = -\dfrac14\).</p>
    <p><strong>Q2.</strong> Les deux séries convergent (géométrique de raison \(\frac12\), exponentielle en \(z = -1\)) ; par linéarité, la somme vaut \(2 + \mathrm e^{-1} \approx 2{,}368\).</p>
    <p><strong>Q3.</strong> Pour \(n \ge 1\), \(\frac{n}{n!} = \frac{1}{(n-1)!}\). Les séries \(\sum\frac{n}{n!}\) et \(\sum\frac{1}{n!}\) convergent, et</p>
    <div class="formula">$$\sum_{n=0}^{+\infty}\frac{n+1}{n!} = \sum_{n=1}^{+\infty}\frac{1}{(n-1)!} + \sum_{n=0}^{+\infty}\frac{1}{n!} = \mathrm e + \mathrm e = 2\mathrm e \approx 5{,}437 .$$</div>
    <p><strong>Q4.</strong> On isole la partie qui se répète :</p>
    <div class="formula">$$1{,}2454545\ldots = 1{,}2 + \frac{45}{1000}\left(1 + \frac{1}{100} + \frac{1}{100^2} + \cdots\right) = \frac65 + \frac{45}{1000}\times\frac{100}{99} = \frac{6}{5} + \frac{1}{22} = \frac{137}{110} .$$</div>
    <p>Contrôle : \(137 \div 110 = 1{,}24545\ldots\)</p>
    <p><strong>Q5.</strong> \(\left|\frac i2\right| = \frac12 \lt 1\) : la série converge et vaut \(\dfrac{1}{1 - i/2} = \dfrac{2}{2 - i} = \dfrac{2(2 + i)}{5} = \dfrac{4 + 2i}{5}\). Les termes de rang pair sont \(\left(\frac i2\right)^{2k} = \left(-\frac14\right)^k\), réels ; ceux de rang impair sont imaginaires purs. La partie réelle de la somme est donc \(\sum_{k=0}^{+\infty}\frac{(-1)^k}{4^k} = \frac45\), ce que confirme la formule géométrique : \(\frac{1}{1 + 1/4} = \frac45\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Méthode des rectangles avec une fonction croissante : \(\ln(n!)\)</h3>
  <div class="statement">On veut un équivalent de \(\ln(n!) = \displaystyle\sum_{k=1}^{n}\ln k\), sans formule de Stirling.</div>
  <div class="q"><strong>Q1.</strong> En utilisant la croissance de \(\ln\), montrer que pour \(n \ge 1\) :
  <div class="formula">$$\int_1^n \ln t\,\mathrm{d}t \le \ln(n!) \le \int_1^{n+1}\ln t\,\mathrm{d}t .$$</div></div>
  <div class="q"><strong>Q2.</strong> Calculer ces intégrales et en déduire que \(\ln(n!) \sim n\ln n\).</div>
  <div class="q"><strong>Q3.</strong> Donner l'encadrement pour \(n = 100\) et commenter.</div>
  <div class="q"><strong>Q4.</strong> En déduire la nature de \(\sum_{n \geq 2}\dfrac{1}{\ln(n!)}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\ln\) est croissante : pour \(k \ge 2\), sur \([k - 1, k]\), \(\ln t \le \ln k\), donc \(\int_{k-1}^{k}\ln t\,\mathrm{d}t \le \ln k\) ; et sur \([k, k + 1]\), \(\ln t \ge \ln k\), donc \(\ln k \le \int_k^{k+1}\ln t\,\mathrm{d}t\) (vrai aussi pour \(k = 1\), où \(\ln 1 = 0\)). On somme la première pour \(k = 2, \ldots, n\) et la seconde pour \(k = 1, \ldots, n\) (Chasles), en se souvenant que \(\ln 1 = 0\) : on obtient l'encadrement. Attention au sens, inversé par rapport au cas d'une fonction décroissante.</p>
    <p><strong>Q2.</strong> Une primitive de \(\ln\) est \(t\ln t - t\) (intégration par parties). D'où</p>
    <div class="formula">$$n\ln n - n + 1 \le \ln(n!) \le (n+1)\ln(n+1) - n .$$</div>
    <p>En divisant par \(n\ln n\) : la borne de gauche tend vers 1 ; à droite, \((n+1)\ln(n+1) \sim n\ln n\) (car \(\ln(n+1) = \ln n + \ln(1 + \frac1n)\)) et \(n = o(n\ln n)\), donc la borne de droite est aussi équivalente à \(n\ln n\). Par encadrement, \(\ln(n!) \sim n\ln n\).</p>
    <p><strong>Q3.</strong> \(361{,}5 \le \ln(100!) \approx 363{,}7 \le 366{,}1\) : l'encadrement est précis (à 1 % près), alors que \(n\ln n \approx 460{,}5\) est loin : l'équivalent ne s'approche que lentement (rapport \(0{,}79\)), à cause du terme \(-n\) qui n'est négligeable que « logarithmiquement ».</p>
    <p><strong>Q4.</strong> Termes positifs, et \(\frac{1}{\ln(n!)} \sim \frac{1}{n\ln n}\) : même nature que \(\sum\frac{1}{n\ln n}\), qui <strong>diverge</strong> (exercice 2, Q4). Donc \(\sum\frac{1}{\ln(n!)}\) diverge.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>La constante d'Euler</h3>
  <div class="statement">On note \(H_n = \displaystyle\sum_{k=1}^{n}\frac1k\), \(u_n = H_n - \ln n\) et \(v_n = H_n - \ln(n + 1)\) pour \(n \ge 1\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \((u_n)\) est décroissante et \((v_n)\) croissante, en comparant \(\frac{1}{n+1}\) à des intégrales de \(t \mapsto \frac1t\).</div>
  <div class="q"><strong>Q2.</strong> En déduire que \((u_n)\) et \((v_n)\) convergent vers une même limite \(\gamma\) (la constante d'Euler), et que \(H_n = \ln n + \gamma + o(1)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(u_{10}\) et \(v_{10}\), et donner un encadrement de \(\gamma\).</div>
  <div class="q"><strong>Q4.</strong> Retrouver la limite de \(\displaystyle\sum_{k=n+1}^{2n}\frac1k\) quand \(n \to +\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(t \mapsto \frac1t\) décroît : sur \([n, n + 1]\), \(\frac1t \ge \frac{1}{n+1}\), et sur \([n + 1, n + 2]\), \(\frac1t \le \frac{1}{n+1}\). En intégrant :</p>
    <div class="formula">$$u_{n+1} - u_n = \frac{1}{n+1} - \int_n^{n+1}\frac{\mathrm{d}t}{t} \le 0, \qquad v_{n+1} - v_n = \frac{1}{n+1} - \int_{n+1}^{n+2}\frac{\mathrm{d}t}{t} \ge 0 .$$</div>
    <p>(On a utilisé \(\ln(n + 1) - \ln n = \int_n^{n+1}\frac{\mathrm{d}t}{t}\) et de même pour \(v\).)</p>
    <p><strong>Q2.</strong> La différence \(u_n - v_n = \ln\!\left(1 + \frac1n\right)\) est positive et tend vers 0. Les suites sont adjacentes : elles convergent vers une limite commune \(\gamma\), avec \(v_n \le \gamma \le u_n\) pour tout \(n\). Comme \(u_n \to \gamma\), \(H_n - \ln n = \gamma + o(1)\). (Autre preuve : \(\sum\left(\frac1k - \ln(1 + \frac1k)\right)\) est une série à termes positifs de terme \(\sim \frac{1}{2k^2}\), donc convergente, et ses sommes partielles valent \(v_n\) : exercice 10, Q4.)</p>
    <p><strong>Q3.</strong> \(H_{10} \approx 2{,}928\,97\), \(u_{10} \approx 0{,}6264\) et \(v_{10} \approx 0{,}5311\) : \(0{,}531 \le \gamma \le 0{,}627\). Avec \(n = 1000\) : \(0{,}5767 \le \gamma \le 0{,}5778\) ; la valeur est \(\gamma \approx 0{,}5772\). On en tire par exemple \(H_{1000} \approx \ln 1000 + \gamma \approx 7{,}485\) (valeur exacte \(7{,}4855\)).</p>
    <p><strong>Q4.</strong> D'après Q2 :</p>
    <div class="formula">$$\sum_{k=n+1}^{2n}\frac1k = H_{2n} - H_n = \big(\ln(2n) + \gamma + o(1)\big) - \big(\ln n + \gamma + o(1)\big) = \ln 2 + o(1) .$$</div>
    <p>La limite vaut \(\ln 2\), comme le donnait aussi une somme de Riemann (chapitre « Intégrales », §5).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Développements limités du terme général</h3>
  <div class="statement">Déterminer la nature des séries de terme général suivant (\(n \ge 1\)), en commençant par un équivalent.</div>
  <div class="q"><strong>Q1.</strong> \(u_n = \mathrm e^{1/n} - 1 - \frac1n\).</div>
  <div class="q"><strong>Q2.</strong> \(u_n = n^{1/n} - 1\).</div>
  <div class="q"><strong>Q3.</strong> \(u_n = \ln\!\left(\cos\frac1n\right)\).</div>
  <div class="q"><strong>Q4.</strong> \(u_n = \frac1n - \ln\!\left(1 + \frac1n\right)\) ; en déduire à nouveau que \(H_n - \ln(n + 1)\) converge (notations de l'exercice 9).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\mathrm e^x = 1 + x + \frac{x^2}{2} + o(x^2)\) avec \(x = \frac1n\) : \(u_n \sim \frac{1}{2n^2}\), positif : <strong>convergence</strong> (Riemann, \(\alpha = 2\)).</p>
    <p><strong>Q2.</strong> \(n^{1/n} = \exp\!\left(\frac{\ln n}{n}\right)\) et \(\frac{\ln n}{n} \to 0\), donc \(u_n \sim \frac{\ln n}{n}\), positif. Pour \(n \ge 3\), \(\frac{\ln n}{n} \ge \frac1n\) : comparaison avec la série harmonique, <strong>divergence</strong>.</p>
    <p><strong>Q3.</strong> \(\cos\frac1n = 1 - \frac{1}{2n^2} + o\!\left(\frac{1}{n^2}\right)\) et \(\ln(1 + x) \sim x\) : \(u_n \sim -\frac{1}{2n^2}\). Le terme est négatif (\(0 \lt \cos\frac1n \lt 1\)), de signe constant : \(-u_n \sim \frac{1}{2n^2}\), <strong>convergence</strong>.</p>
    <p><strong>Q4.</strong> \(\ln(1 + x) = x - \frac{x^2}{2} + o(x^2)\) : \(u_n \sim \frac{1}{2n^2}\), et \(u_n \ge 0\) car \(\ln(1 + x) \le x\) : <strong>convergence</strong>. Ses sommes partielles se calculent par télescopage :</p>
    <div class="formula">$$\sum_{k=1}^{n}\frac1k - \sum_{k=1}^{n}\big(\ln(k+1) - \ln k\big) = H_n - \ln(n + 1) ,$$</div>
    <p>et cette suite converge donc, vers \(\gamma\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Convergence absolue et séries complexes</h3>
  <div class="statement">Les questions sont indépendantes.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\sum_{n \geq 1}\dfrac{\mathrm e^{in}}{n^2}\) et \(\sum_{n \geq 0}\dfrac{n\sin n}{n^3 + 1}\) convergent.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\displaystyle\sum_{n=0}^{+\infty}\left(\frac{1 + i}{3}\right)^n\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que pour tout \(z \in \mathbb C\), \(|\mathrm e^z| \le \mathrm e^{|z|}\), à l'aide de la série exponentielle.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\left|\frac{\mathrm e^{in}}{n^2}\right| = \frac{1}{n^2}\), terme d'une série de Riemann convergente : convergence absolue. Pour la seconde, \(\left|\frac{n\sin n}{n^3 + 1}\right| \le \frac{n}{n^3 + 1} \le \frac{n}{n^3} = \frac{1}{n^2}\) (pour \(n \ge 1\)) : convergence absolue, donc convergence, bien que le signe de \(\sin n\) varie de façon irrégulière.</p>
    <p><strong>Q2.</strong> \(\left|\frac{1+i}{3}\right| = \frac{\sqrt2}{3} \lt 1\) : série géométrique convergente, de somme \(\dfrac{1}{1 - \frac{1+i}{3}} = \dfrac{3}{2 - i} = \dfrac{3(2 + i)}{5} = \dfrac{6 + 3i}{5}\).</p>
    <p><strong>Q3.</strong> La série \(\sum\frac{z^n}{n!}\) est absolument convergente (\(\sum\frac{|z|^n}{n!}\) est la série exponentielle en \(|z|\)). L'inégalité du cours donne \(|\mathrm e^z| = \left|\sum_{n=0}^{+\infty}\frac{z^n}{n!}\right| \le \sum_{n=0}^{+\infty}\frac{|z|^n}{n!} = \mathrm e^{|z|}\). (Directement : \(|\mathrm e^z| = \mathrm e^{\operatorname{Re} z} \le \mathrm e^{|z|}\).)</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Sommes partielles et restes par la méthode des rectangles</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de mathématiques PT (thème : séries numériques, comparaison série-intégrale). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">Pour \(\alpha \gt 0\) et \(n \ge 1\), on pose \(S_n(\alpha) = \displaystyle\sum_{k=1}^{n}\frac{1}{k^\alpha}\). On rappelle \(\displaystyle\sum_{k=1}^{+\infty}\frac{1}{k^2} = \frac{\pi^2}{6} \approx 1{,}644\,934\).</div>

  <p class="exo-part">Partie A — Un encadrement général</p>
  <div class="q"><strong>A1.</strong> Soit \(f\) continue, positive et décroissante sur \([1, +\infty[\). Montrer que pour tous entiers \(1 \le n \lt N\) :
  <div class="formula">$$\int_{n+1}^{N+1} f(t)\,\mathrm{d}t \le \sum_{k=n+1}^{N} f(k) \le \int_n^N f(t)\,\mathrm{d}t .$$</div></div>
  <div class="q"><strong>A2.</strong> On suppose \(\alpha \gt 1\). Montrer que \(\sum\frac{1}{k^\alpha}\) converge et que son reste \(R_n(\alpha) = \sum_{k=n+1}^{+\infty}\frac{1}{k^\alpha}\) vérifie
  <div class="formula">$$\frac{1}{(\alpha - 1)(n + 1)^{\alpha - 1}} \le R_n(\alpha) \le \frac{1}{(\alpha - 1)\,n^{\alpha - 1}} .$$</div>
  En déduire un équivalent de \(R_n(\alpha)\).</div>

  <p class="exo-part">Partie B — Calculer \(\pi^2/6\) plus vite</p>
  <div class="q"><strong>B1.</strong> Pour \(\alpha = 2\), combien de termes faut-il sommer pour que \(S_n(2)\) approche \(\frac{\pi^2}{6}\) à \(10^{-3}\) près ? Montrer qu'on ne peut pas faire beaucoup mieux avec la seule somme partielle.</div>
  <div class="q"><strong>B2.</strong> On pose \(M_n = S_n(2) + \frac12\left(\frac1n + \frac{1}{n+1}\right)\). Montrer que \(\left|\frac{\pi^2}{6} - M_n\right| \le \frac{1}{2n(n+1)}\), et déterminer \(n\) pour une erreur au plus \(10^{-3}\).</div>

  <p class="exo-part">Partie C — Sommes partielles d'une série divergente</p>
  <div class="q"><strong>C1.</strong> On suppose \(0 \lt \alpha \lt 1\). Montrer que \(S_n(\alpha) \sim \dfrac{n^{1-\alpha}}{1 - \alpha}\). Application numérique pour \(\alpha = \frac12\).</div>
  <div class="q"><strong>C2.</strong> Pour \(\alpha = 1\), on note \(H_n = S_n(1)\). Encadrer \(H_n\) et en déduire un encadrement du plus petit entier \(n\) tel que \(H_n \ge 10\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Pour \(k \ge 2\), \(f\) décroît sur \([k - 1, k + 1]\) : \(f(t) \ge f(k)\) sur \([k - 1, k]\) et \(f(t) \le f(k)\) sur \([k, k + 1]\). En intégrant sur ces segments de longueur 1 :</p>
    <div class="formula">$$\int_k^{k+1} f(t)\,\mathrm{d}t \le f(k) \le \int_{k-1}^{k} f(t)\,\mathrm{d}t .$$</div>
    <p>On somme pour \(k = n + 1, \ldots, N\) (on a bien \(k \ge 2\)) et l'on regroupe les intégrales par la relation de Chasles.</p>
    <p><strong>A2.</strong> Avec \(f(t) = t^{-\alpha}\) (continue, positive, décroissante) et \(\int_a^b t^{-\alpha}\,\mathrm{d}t = \frac{a^{1-\alpha} - b^{1-\alpha}}{\alpha - 1}\), la majoration pour \(n = 1\) donne \(S_N(\alpha) \le 1 + \frac{1}{\alpha - 1}\) : sommes partielles majorées d'une série à termes positifs, donc convergence. Ensuite, A1 donne</p>
    <div class="formula">$$\frac{(n+1)^{1-\alpha} - (N+1)^{1-\alpha}}{\alpha - 1} \le \sum_{k=n+1}^{N}\frac{1}{k^\alpha} \le \frac{n^{1-\alpha} - N^{1-\alpha}}{\alpha - 1} ;$$</div>
    <p>comme \(1 - \alpha \lt 0\), \(N^{1-\alpha} \to 0\), et le passage à la limite \(N \to +\infty\) dans ces inégalités larges donne l'encadrement de \(R_n(\alpha)\). Les deux bornes sont équivalentes (car \((n+1)^{\alpha - 1} \sim n^{\alpha - 1}\)), donc \(R_n(\alpha) \sim \dfrac{1}{(\alpha - 1)\,n^{\alpha - 1}}\). Exemple : pour \(\alpha = 3\) et \(n = 10\), \(0{,}00413 \le R_{10}(3) \approx 0{,}00452 \le 0{,}005\).</p>
    <p><strong>B1.</strong> Pour \(\alpha = 2\) : \(\frac{1}{n+1} \le R_n(2) \le \frac1n\). La majoration garantit \(10^{-3}\) dès \(n = 1000\). Et l'on ne peut pas descendre en dessous de \(n = 999\) : si \(n \le 998\), \(R_n(2) \ge \frac{1}{n+1} \ge \frac{1}{999} \gt 10^{-3}\). Il faut donc environ mille termes.</p>
    <p><strong>B2.</strong> D'après B1, \(\frac{\pi^2}{6} = S_n(2) + R_n(2)\) est dans l'intervalle \(\left[S_n(2) + \frac{1}{n+1},\ S_n(2) + \frac1n\right]\), dont \(M_n\) est le milieu. Donc \(\left|\frac{\pi^2}{6} - M_n\right|\) est au plus la demi-longueur \(\frac12\left(\frac1n - \frac{1}{n+1}\right) = \frac{1}{2n(n+1)}\). Pour \(10^{-3}\), il suffit que \(2n(n + 1) \ge 1000\) : \(n = 21\) donne \(924\), \(n = 22\) donne \(1012\), donc <strong>\(n = 22\)</strong> (au lieu de mille termes). Numériquement, \(M_{22} \approx 1{,}644\,963\), erreur \(2{,}9 \times 10^{-5}\).</p>
    <p><strong>C1.</strong> A1 (avec \(n = 1\)) et le terme \(k = 1\) mis à part donnent, comme au cours :</p>
    <div class="formula">$$\frac{(N+1)^{1-\alpha} - 1}{1 - \alpha} \le S_N(\alpha) \le 1 + \frac{N^{1-\alpha} - 1}{1 - \alpha} .$$</div>
    <p>Comme \(1 - \alpha \gt 0\), \(N^{1-\alpha} \to +\infty\) et les deux bornes sont équivalentes à \(\frac{N^{1-\alpha}}{1-\alpha}\) : d'où l'équivalent. Pour \(\alpha = \frac12\), \(S_n\left(\frac12\right) \sim 2\sqrt n\) : \(S_{100} \approx 18{,}59\) contre \(2\sqrt{100} = 20\) (rapport \(0{,}93\)), \(S_{10\,000} \approx 198{,}54\) contre \(200\) (rapport \(0{,}993\)).</p>
    <p><strong>C2.</strong> Avec \(f(t) = \frac1t\) : \(\ln(n + 1) \le H_n \le 1 + \ln n\). Si \(1 + \ln n \lt 10\), c'est-à-dire \(n \lt \mathrm e^9 \approx 8\,103{,}1\), alors \(H_n \lt 10\) ; si \(\ln(n + 1) \ge 10\), c'est-à-dire \(n \ge \mathrm e^{10} - 1 \approx 22\,025{,}5\), alors \(H_n \ge 10\). Le plus petit entier cherché est donc compris entre \(8\,104\) et \(22\,026\). (Le calcul donne \(12\,367\) : il faut plus de douze mille termes de la série harmonique pour dépasser 10.)</p>
  </div>
</div>
