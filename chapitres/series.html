  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la section « Séries numériques » du programme de PTSI (second semestre). Il prolonge l'étude des suites (une série est la suite de ses sommes partielles) et réinvestit l'analyse asymptotique (équivalents, développements limités) et l'intégration (méthode des rectangles). La 2ᵉ année reprend et complète ce chapitre dans <a href="#series2a/cours">« Séries numériques (approfondissements) »</a> : séries alternées, règle de d'Alembert, produit de Cauchy, puis séries entières.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Convergence et divergence</strong> : sommes partielles d'une série numérique \(\sum u_n\), convergence, divergence, somme \(\sum_{n=0}^{+\infty} u_n\), linéarité de la somme (§1).</li>
        <li><strong>Divergence grossière</strong> : le terme général d'une série convergente tend vers 0 ; <strong>reste</strong> d'une série convergente (§2).</li>
        <li><strong>Lien suite-série</strong> : la suite \((u_n)\) et la série télescopique \(\sum (u_{n+1} - u_n)\) sont de même nature (§3).</li>
        <li><strong>Séries géométriques</strong> : condition nécessaire et suffisante de convergence, somme (§4).</li>
        <li><strong>Série exponentielle</strong> : \(\mathrm e^z = \sum_{n=0}^{+\infty}\frac{z^n}{n!}\) pour \(z \in \mathbb C\) (§5).</li>
        <li><strong>Séries à termes positifs</strong> : convergence si et seulement si les sommes partielles sont majorées ; comparaison par inégalité ; séries de termes positifs équivalents (§6).</li>
        <li><strong>Méthode des rectangles</strong> : pour \(f\) monotone, encadrement des sommes partielles de \(\sum f(n)\), application à l'étude de sommes partielles (§7).</li>
        <li><strong>Séries de Riemann</strong> (§8).</li>
        <li><strong>Séries absolument convergentes</strong> à termes réels ou complexes (suites sommables, notation \(\sum_{n=0}^{+\infty}|u_n| \lt +\infty\)) : une série absolument convergente converge ; si \(u_n = O(v_n)\) avec \(v_n \ge 0\) et \(\sum v_n\) convergente, \(\sum u_n\) est absolument convergente (§9). Ce bloc, marqué d'une étoile au programme, est repris en entier en PT.</li>
      </ul>
      <p>Le §10 rassemble la stratégie d'étude. Hors programme en PTSI : le critère de Cauchy et la notion de semi-convergence ; la règle de d'Alembert et le théorème des séries alternées sont au programme de PT (fin de chapitre, « Pour aller plus loin »).</p>

<div class="course-section">
  <div class="sec-num">§1 · SÉRIES, SOMMES PARTIELLES, SOMME</div>
  <h2>Additionner une infinité de nombres</h2>
  <div class="intro">Une somme infinie n'a pas de sens a priori : on additionne les termes un par un et l'on regarde si les sommes obtenues se stabilisent. Étudier une série, c'est donc étudier une <strong>suite</strong>, celle de ses sommes partielles ; tout le chapitre cherche à décider si elle converge sans savoir la calculer.</div>

  <div class="def-box">
    Soit \((u_n)_{n \ge n_0}\) une suite de nombres réels ou complexes. Sa <strong>somme partielle</strong> d'indice \(n\) est
    <div class="formula" data-nom="Somme partielle">$$S_n = \sum_{k=n_0}^{n} u_k = u_{n_0} + u_{n_0+1} + \cdots + u_n .$$</div>
    La <strong>série</strong> de terme général \(u_n\), notée \(\sum u_n\) (ou \(\sum_{n \ge n_0} u_n\)), est la suite \((S_n)\). Elle <strong>converge</strong> si \((S_n)\) a une limite finie \(S\), appelée <strong>somme</strong> de la série et notée \(\sum_{n=n_0}^{+\infty} u_n\) ; sinon elle <strong>diverge</strong>.
  </div>
  <p>Attention aux deux notations : \(\sum u_n\) désigne la série (un objet qui converge ou non), \(\sum_{n=n_0}^{+\infty} u_n\) désigne un nombre, qu'on n'écrit que si la série converge. Modifier un nombre fini de termes ne change pas la <strong>nature</strong> (convergence ou divergence) d'une série, mais change en général sa somme.</p>

  <div class="prop-box">
    <strong>Linéarité.</strong> Si \(\sum u_n\) et \(\sum v_n\) convergent et si \(\lambda, \mu\) sont des scalaires, \(\sum(\lambda u_n + \mu v_n)\) converge et
    <div class="formula">$$\sum_{n=0}^{+\infty}(\lambda u_n + \mu v_n) = \lambda\sum_{n=0}^{+\infty} u_n + \mu\sum_{n=0}^{+\infty} v_n .$$</div>
    La somme d'une série convergente et d'une série divergente diverge ; deux séries divergentes peuvent avoir une somme convergente (\(u_n = 1\), \(v_n = -1\)).
  </div>
  <p>Une série \(\sum u_n\) à termes complexes converge si et seulement si les deux séries réelles \(\sum\operatorname{Re} u_n\) et \(\sum\operatorname{Im} u_n\) convergent, puisqu'une suite complexe converge si et seulement si ses parties réelle et imaginaire convergent.</p>

  <div class="method-box">
    <strong>Exemple — trois comportements de sommes partielles</strong>
    <ol>
      <li>\(u_n = \frac{1}{2^n}\) (\(n \ge 0\)) : \(S_n = 1 + \frac12 + \cdots + \frac{1}{2^n} = 2 - \frac{1}{2^n}\) (§4), donc la série converge et \(\sum_{n=0}^{+\infty}\frac{1}{2^n} = 2\). Pour \(n = 5\), \(S_5 = 1{,}968\,75\).</li>
      <li>\(u_n = (-1)^n\) : \(S_n\) vaut \(1, 0, 1, 0, \ldots\) ; la suite \((S_n)\) n'a pas de limite, la série diverge.</li>
      <li>\(u_n = 1\) : \(S_n = n + 1 \to +\infty\), la série diverge.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : manipuler \(\sum_{n=0}^{+\infty} u_n\) comme un nombre avant d'avoir montré la convergence, ou réordonner, regrouper et soustraire des sommes infinies comme des sommes finies. Exemple de catastrophe : en regroupant \((1 - 1) + (1 - 1) + \cdots\) on « trouve » 0, en regroupant \(1 + (-1 + 1) + \cdots\) on « trouve » 1, alors que \(\sum (-1)^n\) diverge.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DIVERGENCE GROSSIÈRE ET RESTE</div>
  <h2>Le premier test, et l'erreur commise en tronquant</h2>
  <div class="intro">Si la somme converge, les termes ajoutés doivent devenir négligeables : c'est le premier test à faire, qui élimine les cas les plus simples. La réciproque est fausse, et c'est ce qui rend les séries intéressantes. Le reste, lui, mesure ce qu'on oublie quand on remplace la somme par une somme partielle.</div>

  <div class="prop-box">
    <strong>Condition nécessaire de convergence.</strong> Si \(\sum u_n\) converge, alors \(u_n \xrightarrow[n\to+\infty]{} 0\). Par contraposée, si \((u_n)\) ne tend pas vers 0, la série <strong>diverge grossièrement</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un terme est la différence de deux sommes partielles consécutives.</span>
    <div class="content"><p>Pour \(n \gt n_0\), \(u_n = S_n - S_{n-1}\). Si \(S_n \to S\), alors \(S_{n-1} \to S\) aussi, donc \(u_n \to S - S = 0\).</p></div>
  </div>

  <div class="def-box">
    Si \(\sum u_n\) converge, de somme \(S\), son <strong>reste</strong> d'indice \(n\) est
    <div class="formula" data-nom="Reste d'une série convergente">$$R_n = S - S_n = \sum_{k=n+1}^{+\infty} u_k ,$$</div>
    somme d'une série convergente (la même, privée de ses premiers termes). On a \(S = S_n + R_n\) et \(R_n \xrightarrow[n\to+\infty]{} 0\).
  </div>

  <div class="method-box">
    <strong>Exemple — deux divergences grossières</strong>
    <ol>
      <li>\(u_n = \left(1 + \frac1n\right)^n = \mathrm e^{n\ln(1 + 1/n)} \to \mathrm e \neq 0\) (car \(n\ln(1 + \frac1n) \to 1\)) : \(\sum u_n\) diverge grossièrement. Valeurs : \(u_{10} \approx 2{,}594\), \(u_{1000} \approx 2{,}717\).</li>
      <li>\(u_n = \cos n\) ne tend pas vers 0 : sinon, \(\cos(2n) = 2\cos^2 n - 1\) tendrait vers \(-1\), alors que \((\cos 2n)\) est une suite extraite de \((\cos n)\) et devrait tendre vers 0. La série \(\sum\cos n\) diverge grossièrement.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : « \(u_n \to 0\), donc \(\sum u_n\) converge ». C'est faux : la série harmonique \(\sum\frac1n\) diverge (§6 et §7) bien que \(\frac1n \to 0\). La condition \(u_n \to 0\) ne sert qu'à prouver une divergence.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SÉRIES TÉLESCOPIQUES ET LIEN SUITE-SÉRIE</div>
  <h2>Quand la somme se replie</h2>
  <div class="intro">Si chaque terme est la différence de deux termes consécutifs d'une suite, la somme partielle se simplifie et se calcule exactement. Réciproquement, toute suite est la somme partielle de la série de ses différences : étudier une suite ou une série, c'est le même problème.</div>

  <div class="prop-box">
    <strong>Lien suite-série.</strong> Soit \((a_n)_{n \ge 0}\) une suite. Pour tout \(N\), \(\displaystyle\sum_{n=0}^{N}(a_{n+1} - a_n) = a_{N+1} - a_0\). Donc la série télescopique \(\sum (a_{n+1} - a_n)\) et la suite \((a_n)\) sont <strong>de même nature</strong>, et en cas de convergence
    <div class="formula" data-nom="Série télescopique">$$\sum_{n=0}^{+\infty}(a_{n+1} - a_n) = \lim_{n\to+\infty} a_n - a_0 .$$</div>
  </div>

  <div class="method-box">
    <strong>Exemple — trois télescopages</strong>
    <ol>
      <li>\(\frac{1}{n(n+1)} = \frac1n - \frac{1}{n+1}\) : \(\displaystyle\sum_{n=1}^{N}\frac{1}{n(n+1)} = 1 - \frac{1}{N+1} \to 1\). La série converge, de somme 1, et son reste vaut exactement \(R_N = \frac{1}{N+1}\).</li>
      <li>\(\frac{1}{4n^2 - 1} = \frac12\left(\frac{1}{2n-1} - \frac{1}{2n+1}\right)\) (décomposition en éléments simples) : \(\displaystyle\sum_{n=1}^{N}\frac{1}{4n^2 - 1} = \frac12\left(1 - \frac{1}{2N+1}\right) = \frac{N}{2N+1} \to \frac12\).</li>
      <li>\(\ln\!\left(1 + \frac1n\right) = \ln(n+1) - \ln n\) : \(\displaystyle\sum_{n=1}^{N}\ln\!\left(1 + \frac1n\right) = \ln(N + 1) \to +\infty\). La série diverge, bien que son terme général tende vers 0.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : télescoper des termes non consécutifs sans précaution. Pour \(\frac{1}{n} - \frac{1}{n+2}\), il reste <em>deux</em> termes au début et deux à la fin : \(\sum_{n=1}^{N}\left(\frac1n - \frac{1}{n+2}\right) = 1 + \frac12 - \frac{1}{N+1} - \frac{1}{N+2}\). Écrire les premiers et les derniers termes avant de simplifier.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SÉRIES GÉOMÉTRIQUES</div>
  <h2>La série de référence : \(\sum q^n\)</h2>
  <div class="intro">C'est la seule famille de séries (avec les télescopiques) dont on sait calculer toutes les sommes partielles. Elle sert d'étalon : beaucoup de séries convergent parce qu'elles sont dominées par une série géométrique, et elle modélise tous les phénomènes où une grandeur est multipliée à chaque étape par un même facteur.</div>

  <div class="prop-box">
    <strong>Séries géométriques.</strong> Soit \(q \in \mathbb C\). La série \(\sum q^n\) converge si et seulement si \(|q| \lt 1\), et alors
    <div class="formula" data-nom="Série géométrique">$$\sum_{n=0}^{+\infty} q^n = \frac{1}{1 - q}, \qquad \sum_{n=n_0}^{+\infty} q^n = \frac{q^{n_0}}{1 - q}, \qquad R_n = \sum_{k=n+1}^{+\infty} q^k = \frac{q^{n+1}}{1 - q} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La somme partielle se calcule ; il reste à étudier \(q^{n+1}\).</span>
    <div class="content"><p>Pour \(q \neq 1\), les termes intermédiaires se simplifient :</p>
    <div class="formula">$$(1 - q)S_n = (1 + q + \cdots + q^n) - (q + \cdots + q^{n+1}) = 1 - q^{n+1},$$</div>
    <p>donc \(S_n = \dfrac{1 - q^{n+1}}{1 - q}\). Si \(|q| \lt 1\), \(|q^{n+1}| = |q|^{n+1} \to 0\) et \(S_n \to \frac{1}{1-q}\). Si \(|q| \ge 1\), \(|q^n| \ge 1\) : le terme général ne tend pas vers 0, divergence grossière (pour \(q = 1\), \(S_n = n + 1\)).</p></div>
  </div>

</figure>

  <div class="method-box">
    <strong>Exemple — un nombre décimal périodique</strong>
    <div class="formula">$$0{,}272727\ldots = \frac{27}{100} + \frac{27}{100^2} + \cdots = \frac{27}{100}\sum_{n=0}^{+\infty}\frac{1}{100^n} = \frac{27}{100}\times\frac{1}{1 - \frac{1}{100}} = \frac{27}{99} = \frac{3}{11} .$$</div>
    <p>Tout développement décimal périodique représente ainsi un nombre rationnel.</p>
  </div>
  <div class="method-box">
    <strong>Exemple — la balle qui rebondit une infinité de fois</strong>
    <p>Une balle lâchée de \(h_0 = 1\ \text{m}\) remonte à chaque rebond à \(0{,}8\) fois sa hauteur précédente (\(g = 9{,}81\ \text{m·s}^{-2}\), frottements de l'air négligés).</p>
    <ol>
      <li><strong>Distance parcourue</strong> : la chute initiale, puis une montée et une descente de \(0{,}8^k\ \text{m}\) pour le \(k\)-ième rebond :
        <div class="formula">$$D = 1 + 2\sum_{k=1}^{+\infty} 0{,}8^k = 1 + 2\times\frac{0{,}8}{1 - 0{,}8} = 9\ \text{m}.$$</div></li>
      <li><strong>Durée</strong> : une chute de hauteur \(h\) dure \(\sqrt{2h/g}\) ; avec \(t_0 = \sqrt{2/g} \approx 0{,}452\ \text{s}\), le \(k\)-ième rebond dure \(2t_0\left(\sqrt{0{,}8}\right)^k\), série géométrique de raison \(\sqrt{0{,}8} \approx 0{,}894\) :
        <div class="formula">$$T = t_0\left(1 + 2\sum_{k=1}^{+\infty}\sqrt{0{,}8}^{\,k}\right) = t_0\left(1 + \frac{2\sqrt{0{,}8}}{1 - \sqrt{0{,}8}}\right) \approx 8{,}1\ \text{s}.$$</div></li>
      <li>Une infinité de rebonds tiennent dans un temps fini : la balle s'immobilise au bout de 8,1 s environ.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une raison complexe</strong>
    <p>Pour \(\theta\) réel, \(q = \frac{\mathrm e^{i\theta}}{2}\) vérifie \(|q| = \frac12 \lt 1\) : \(\sum_{n=0}^{+\infty}\frac{\mathrm e^{in\theta}}{2^n} = \frac{1}{1 - \mathrm e^{i\theta}/2}\). En multipliant par le conjugué du dénominateur, dont le module au carré vaut \(\frac54 - \cos\theta\), puis en prenant la partie réelle :</p>
    <div class="formula">$$\sum_{n=0}^{+\infty}\frac{\cos(n\theta)}{2^n} = \frac{1 - \frac12\cos\theta}{\frac54 - \cos\theta} = \frac{4 - 2\cos\theta}{5 - 4\cos\theta} .$$</div>
    <p>Contrôles : \(\theta = 0\) donne \(2 = \sum\frac{1}{2^n}\) ; \(\theta = \frac\pi3\) donne \(1\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le premier terme, \(\sum_{n=1}^{+\infty} q^n = \frac{q}{1 - q}\) et non \(\frac{1}{1-q}\) ; ou appliquer la formule pour \(|q| \ge 1\) (« \(1 + 2 + 4 + \cdots = -1\) » est absurde : la série diverge).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · SÉRIE EXPONENTIELLE</div>
  <h2>\(\mathrm e^z\) comme somme d'une série</h2>
  <div class="intro">L'exponentielle est la somme de la série \(\sum\frac{z^n}{n!}\), pour tout nombre complexe \(z\). La preuve est une application directe de l'inégalité de Taylor-Lagrange (chapitre « Intégrales », §10 et §11), et le résultat fournit une méthode de calcul de \(\mathrm e^z\), \(\cos x\), \(\sin x\) à toute précision voulue.</div>

  <div class="prop-box">
    <strong>Série exponentielle.</strong> Pour tout \(z \in \mathbb C\), la série \(\sum\frac{z^n}{n!}\) converge et
    <div class="formula" data-nom="Série exponentielle">$$\mathrm e^z = \sum_{n=0}^{+\infty}\frac{z^n}{n!}, \qquad \left|\mathrm e^z - \sum_{k=0}^{n}\frac{z^k}{k!}\right| \le \frac{|z|^{n+1}}{(n+1)!}\,\mathrm e^{|z|} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Taylor-Lagrange pour \(t \mapsto \mathrm e^{tz}\) entre 0 et 1, puis \(\frac{|z|^n}{n!} \to 0\).</span>
    <div class="content"><p>Soit \(f(t) = \mathrm e^{tz}\) pour \(t \in [0, 1]\), à valeurs complexes. Ses dérivées sont \(f^{(k)}(t) = z^k\mathrm e^{tz}\), donc \(f^{(k)}(0) = z^k\) et \(|f^{(n+1)}(t)| = |z|^{n+1}\mathrm e^{t\operatorname{Re} z} \le |z|^{n+1}\mathrm e^{|z|}\). L'inégalité de Taylor-Lagrange entre 0 et 1 donne la majoration annoncée.</p>
    <p>Reste à voir que \(a_n = \frac{|z|^n}{n!} \to 0\). Pour \(n \ge 2|z|\), \(a_{n+1} = a_n\,\frac{|z|}{n+1} \le \frac{a_n}{2}\) ; donc, à partir d'un rang \(N\), \(0 \le a_n \le \frac{a_N}{2^{n-N}}\), qui tend vers 0. Les sommes partielles tendent vers \(\mathrm e^z\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — \(\cos 1\) à \(10^{-6}\) près</strong>
    <ol>
      <li>Avec \(z = i\) : \(\operatorname{Re} z = 0\), donc \(|f^{(n+1)}(t)| = 1\) et l'erreur est au plus \(\frac{1}{(n+1)!}\) (meilleur que la majoration générale).</li>
      <li>Les puissances \(i^k\) valent \(1, i, -1, -i, \ldots\) : la partie réelle de \(\sum_{k=0}^{9}\frac{i^k}{k!}\) est \(1 - \frac12 + \frac1{24} - \frac{1}{720} + \frac{1}{40\,320}\).</li>
      <li>\(\frac{1}{10!} \approx 2{,}8 \times 10^{-7}\), et une partie réelle est majorée par le module : \(\cos 1 \approx 0{,}540\,302\,6\) à \(3 \times 10^{-7}\) près (valeur : \(0{,}540\,302\,3\)).</li>
    </ol>
    <p>Plus généralement, les parties réelle et imaginaire de \(\mathrm e^{ix} = \sum\frac{(ix)^n}{n!}\) donnent, pour tout réel \(x\), \(\cos x = \sum_{k=0}^{+\infty}\frac{(-1)^k x^{2k}}{(2k)!}\) et \(\sin x = \sum_{k=0}^{+\infty}\frac{(-1)^k x^{2k+1}}{(2k+1)!}\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que les termes \(\frac{z^n}{n!}\) décroissent dès le début. Pour \(z = 10\), ils croissent jusqu'à \(n = 9\) et \(n = 10\) (\(\frac{10^9}{9!} = \frac{10^{10}}{10!} \approx 2\,756\)) avant de s'effondrer : il faut aller assez loin avant que la somme partielle soit proche de \(\mathrm e^{10}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SÉRIES À TERMES POSITIFS : COMPARAISON</div>
  <h2>Comparer à une série dont on connaît la nature</h2>
  <div class="intro">Quand les termes sont positifs, les sommes partielles croissent : la série converge, ou ses sommes partielles tendent vers \(+\infty\), sans autre possibilité. Tout se ramène alors à majorer ou minorer, en comparant le terme général à celui d'une série de référence (géométrique, Riemann, télescopique).</div>

  <div class="prop-box">
    <strong>Théorème fondamental.</strong> Si \(u_n \ge 0\) pour tout \(n\), \((S_n)\) est croissante : \(\sum u_n\) converge si et seulement si \((S_n)\) est <strong>majorée</strong> ; sinon \(S_n \to +\infty\).<br>
    <strong>Comparaison.</strong> Si \(0 \le u_n \le v_n\) (au moins à partir d'un certain rang) : si \(\sum v_n\) converge, \(\sum u_n\) converge ; si \(\sum u_n\) diverge, \(\sum v_n\) diverge.<br>
    <strong>Domination.</strong> Si \(u_n, v_n \ge 0\) et \(u_n = O(v_n)\) (en particulier si \(u_n = o(v_n)\)) : si \(\sum v_n\) converge, \(\sum u_n\) converge.<br>
    <strong>Équivalents.</strong> Si \(u_n, v_n \ge 0\) et \(u_n \sim v_n\), les séries \(\sum u_n\) et \(\sum v_n\) sont de <strong>même nature</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout repose sur le théorème de la limite monotone.</span>
    <div class="content"><p><strong>Fondamental.</strong> \(S_{n+1} - S_n = u_{n+1} \ge 0\) : une suite croissante converge si et seulement si elle est majorée, et tend vers \(+\infty\) sinon.</p>
    <p><strong>Comparaison.</strong> Supposons \(0 \le u_n \le v_n\) pour \(n \ge N\). Pour \(n \ge N\), \(\sum_{k=N}^{n} u_k \le \sum_{k=N}^{n} v_k \le \sum_{k=N}^{+\infty} v_k\) : les sommes partielles de \(\sum u_n\) sont majorées (les termes d'indice inférieur à \(N\) n'ajoutent qu'une constante). La seconde affirmation est la contraposée.</p>
    <p><strong>Domination.</strong> \(u_n \le M v_n\) à partir d'un rang, et \(\sum M v_n\) converge. <strong>Équivalents.</strong> \(\frac{u_n}{v_n} \to 1\), donc \(\frac12 v_n \le u_n \le 2v_n\) à partir d'un rang ; on applique deux fois la comparaison.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — la série harmonique diverge</strong>
    <p>L'inégalité \(\ln(1 + x) \le x\) (pour \(x \gt -1\)) donne \(\frac1n \ge \ln\!\left(1 + \frac1n\right) \ge 0\). La série télescopique \(\sum\ln\!\left(1 + \frac1n\right)\) diverge (ses sommes partielles valent \(\ln(N + 1)\), §3) ; par comparaison, la série harmonique \(\sum\frac1n\) diverge, et même \(\sum_{n=1}^{N}\frac1n \ge \ln(N + 1)\).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — quatre natures en une ligne chacune</strong>
    <ol>
      <li>\(0 \le \frac{1}{n^2 + n + 1} \le \frac{1}{n^2}\) et \(\sum\frac1{n^2}\) converge (§8) : convergence.</li>
      <li>\(0 \le \frac{2 + \sin n}{n^3} \le \frac{3}{n^3}\) : convergence, alors que \(\sin n\) n'a pas de limite.</li>
      <li>\(\frac{1}{\sqrt{n^2 + 1}} \sim \frac1n\), termes positifs : même nature que la série harmonique, divergence.</li>
      <li>\(\frac{n + 3}{2^n} = O\!\left(\left(\frac23\right)^n\right)\) (car \(\frac{n+3}{2^n}\times\left(\frac32\right)^n = \frac{n + 3}{(4/3)^n} \to 0\)) : convergence par domination par une série géométrique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le critère des équivalents à des termes de <strong>signe variable</strong>. Il est faux dans ce cas : on montre en 2ᵉ année que \(\sum\frac{(-1)^n}{\sqrt n}\) converge, alors que \(\frac{(-1)^n}{\sqrt n} + \frac1n\), qui lui est équivalent, est le terme d'une série divergente. Pour des termes de signe quelconque, on étudie la convergence absolue (§9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · COMPARAISON SÉRIE-INTÉGRALE</div>
  <h2>La méthode des rectangles</h2>
  <div class="intro">Quand \(u_k = f(k)\) avec \(f\) monotone, chaque terme est l'aire d'un rectangle de largeur 1 que l'on compare à l'aire sous la courbe de \(f\). Les sommes partielles se retrouvent encadrées par deux intégrales, qu'on calcule avec une primitive : on en déduit la nature de la série et, souvent, un équivalent de ses sommes partielles. C'est la version « discrète » des sommes de Riemann du chapitre « Intégrales ».</div>

  <div class="prop-box">
    <strong>Encadrement (fonction décroissante).</strong> Soit \(f\) continue, positive et <strong>décroissante</strong> sur \([n_0, +\infty[\). Pour tout entier \(k \ge n_0 + 1\), \(f(k) \le f(t) \le f(k-1)\) sur \([k - 1, k]\), et en intégrant :
    <div class="formula" data-nom="Méthode des rectangles (série-intégrale)">$$\int_k^{k+1} f(t)\,\mathrm{d}t \;\le\; f(k) \;\le\; \int_{k-1}^{k} f(t)\,\mathrm{d}t .$$</div>
    En sommant (relation de Chasles), pour \(N \ge n_0\) :
    <div class="formula" data-nom="Encadrement des sommes partielles">$$\int_{n_0}^{N+1} f(t)\,\mathrm{d}t \;\le\; \sum_{k=n_0}^{N} f(k) \;\le\; f(n_0) + \int_{n_0}^{N} f(t)\,\mathrm{d}t .$$</div>
    Pour \(f\) <strong>croissante</strong>, les inégalités s'inversent : \(\int_{k-1}^{k} f \le f(k) \le \int_k^{k+1} f\).
  </div>
  <div class="prop-box">
    <strong>Conséquences.</strong> Pour \(f\) continue, positive et décroissante sur \([n_0, +\infty[\) :
    <ul>
      <li>si \(N \mapsto \int_{n_0}^{N} f\) est majorée, la série \(\sum f(n)\) converge (sommes partielles majorées) ;</li>
      <li>si \(\int_{n_0}^{N} f \to +\infty\), la série diverge (minoration) ;</li>
      <li>si les deux bornes de l'encadrement sont équivalentes, elles donnent un <strong>équivalent</strong> des sommes partielles.</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Exemple — la série harmonique, quantitativement</strong>
    <ol>
      <li>\(f(t) = \frac1t\) est continue, positive, décroissante sur \([1, +\infty[\), de primitive \(\ln t\). L'encadrement donne, pour \(H_N = \sum_{k=1}^{N}\frac1k\) :
        <div class="formula">$$\ln(N + 1) \le H_N \le 1 + \ln N .$$</div></li>
      <li>Les deux bornes sont équivalentes à \(\ln N\), donc \(H_N \sim \ln N\) : la série diverge, à la vitesse du logarithme. Pour \(N = 100\) : \(4{,}615 \le H_{100} \approx 5{,}187 \le 5{,}605\).</li>
      <li>Il faut plus de \(\mathrm e^{9} \approx 8\,100\) termes pour que \(H_N\) dépasse 10 (car \(H_N \le 1 + \ln N\)) : une divergence très lente.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — une fonction croissante : \(\sum_{k=1}^{n}\sqrt k\)</strong>
    <p>\(f(t) = \sqrt t\) est croissante sur \([0, +\infty[\) : \(\int_{k-1}^{k}\sqrt t\,\mathrm{d}t \le \sqrt k \le \int_k^{k+1}\sqrt t\,\mathrm{d}t\). En sommant pour \(k = 1, \ldots, n\) :</p>
    <div class="formula">$$\frac23 n^{3/2} = \int_0^n \sqrt t\,\mathrm{d}t \le \sum_{k=1}^{n}\sqrt k \le \int_1^{n+1}\sqrt t\,\mathrm{d}t = \frac23\left((n+1)^{3/2} - 1\right) .$$</div>
    <p>Les deux bornes sont équivalentes à \(\frac23 n^{3/2}\), d'où \(\sum_{k=1}^{n}\sqrt k \sim \frac23 n^{3/2}\). Pour \(n = 100\) : \(666{,}7 \le 671{,}5 \le 676{,}0\).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — estimer le reste de \(\sum\frac{1}{k^2}\)</strong>
    <p>Pour \(n \lt N\), on somme l'encadrement de \(k = n + 1\) à \(N\) avec \(f(t) = \frac{1}{t^2}\) :</p>
    <div class="formula">$$\frac{1}{n+1} - \frac{1}{N+1} = \int_{n+1}^{N+1}\frac{\mathrm{d}t}{t^2} \le \sum_{k=n+1}^{N}\frac{1}{k^2} \le \int_{n}^{N}\frac{\mathrm{d}t}{t^2} = \frac1n - \frac1N .$$</div>
    <p>La série converge (§8) ; on fait tendre \(N\) vers \(+\infty\) dans ces inégalités larges : \(\frac{1}{n+1} \le R_n \le \frac1n\), donc \(R_n \sim \frac1n\). Pour \(n = 10\) : \(0{,}0909 \le R_{10} \approx 0{,}0952 \le 0{,}1\). Pour garantir trois décimales exactes par une somme partielle, il faut un millier de termes : la convergence est lente.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier de vérifier la <strong>monotonie</strong>. La fonction \(f(t) = 1 - \cos(2\pi t)\) est continue et positive, \(f(n) = 0\) pour tout entier \(n\), donc \(\sum f(n)\) converge ; pourtant \(\int_0^N f = N \to +\infty\). Sans monotonie, l'aire sous la courbe ne dit rien des valeurs aux entiers. Autre piège : sommer l'inégalité de droite à partir de \(k = n_0\), où \(\int_{n_0 - 1}^{n_0} f\) n'a peut-être pas de sens.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SÉRIES DE RIEMANN</div>
  <h2>La gamme de référence \(\sum \frac{1}{n^\alpha}\)</h2>
  <div class="intro">Les séries de Riemann sont l'étalon des séries à termes positifs dont le terme général décroît comme une puissance de \(n\). Avec le critère des équivalents (§6), elles règlent presque toutes les séries dont le terme général est une fraction rationnelle en \(n\), ou un développement limité.</div>

  <div class="prop-box">
    <strong>Séries de Riemann.</strong> Pour \(\alpha \in \mathbb R\),
    <div class="formula" data-nom="Séries de Riemann">$$\sum_{n \ge 1}\frac{1}{n^\alpha}\ \text{converge} \iff \alpha \gt 1 .$$</div>
    En particulier \(\sum\frac1n\) (série harmonique) et \(\sum\frac{1}{\sqrt n}\) divergent, \(\sum\frac{1}{n^2}\) et \(\sum\frac{1}{n\sqrt n}\) convergent.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Par la méthode des rectangles (§7), avec \(f(t) = t^{-\alpha}\).</span>
    <div class="content"><p>Si \(\alpha \le 0\), \(\frac{1}{n^\alpha} = n^{-\alpha} \ge 1\) ne tend pas vers 0 : divergence grossière. Si \(\alpha \gt 0\), \(f(t) = t^{-\alpha}\) est continue, positive, décroissante sur \([1, +\infty[\). Le cas \(\alpha = 1\) est celui de la série harmonique (§7). Pour \(\alpha \neq 1\), \(\int_1^N t^{-\alpha}\,\mathrm{d}t = \frac{N^{1-\alpha} - 1}{1 - \alpha}\).</p>
    <ul>
      <li>Si \(\alpha \gt 1\), \(N^{1-\alpha} \to 0\) et \(S_N \le 1 + \frac{1 - N^{1-\alpha}}{\alpha - 1} \le 1 + \frac{1}{\alpha - 1} = \frac{\alpha}{\alpha - 1}\) : sommes partielles majorées, convergence.</li>
      <li>Si \(0 \lt \alpha \lt 1\), \(S_N \ge \int_1^{N+1} t^{-\alpha}\,\mathrm{d}t = \frac{(N+1)^{1-\alpha} - 1}{1 - \alpha} \to +\infty\) : divergence.</li>
    </ul></div>
  </div>
  <p>La somme \(\sum_{n=1}^{+\infty}\frac{1}{n^2} = \frac{\pi^2}{6} \approx 1{,}645\) (résultat d'Euler, admis) est cohérente avec le majorant \(\frac{\alpha}{\alpha - 1} = 2\). Pour \(0 \lt \alpha \lt 1\), la même méthode donne l'équivalent \(\sum_{k=1}^{n}\frac{1}{k^\alpha} \sim \frac{n^{1-\alpha}}{1 - \alpha}\) (exercice).</p>

  <div class="method-box">
    <strong>Méthode — la règle « \(n^\alpha u_n\) » (termes positifs)</strong>
    <ol>
      <li>Si \(n^\alpha u_n \to 0\) pour un \(\alpha \gt 1\), alors \(u_n = o\!\left(\frac{1}{n^\alpha}\right)\) : la série converge (domination, §6).</li>
      <li>Si \(n\,u_n \to +\infty\), alors \(u_n \ge \frac1n\) à partir d'un certain rang : la série diverge (comparaison à la série harmonique).</li>
      <li>On choisit \(\alpha\) entre 1 et l'exposant « apparent » : \(\alpha = \frac32\) pour \(\frac{\ln n}{n^2}\), \(\alpha = 2\) pour une exponentielle.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — trois séries réglées par la règle \(n^\alpha u_n\)</strong>
    <ol>
      <li>\(u_n = \frac{\ln n}{n^2}\) : \(n^{3/2}u_n = \frac{\ln n}{\sqrt n} \to 0\) (croissances comparées) : convergence.</li>
      <li>\(u_n = \frac{1}{\sqrt n\,\ln n}\) (\(n \ge 2\)) : \(n\,u_n = \frac{\sqrt n}{\ln n} \to +\infty\) : divergence.</li>
      <li>\(u_n = \mathrm e^{-\sqrt n}\) : \(n^2 u_n = \exp(2\ln n - \sqrt n) \to 0\) : convergence.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure trop vite quand un logarithme s'ajoute à \(\frac1n\). \(\frac{1}{n\ln n}\) est négligeable devant \(\frac1n\), ce qui ne dit rien ; sa série diverge pourtant (exercice 2, par la méthode des rectangles), alors que \(\sum\frac{1}{n(\ln n)^2}\) converge.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · CONVERGENCE ABSOLUE</div>
  <h2>Termes de signe quelconque ou complexes : contrôler le module</h2>
  <div class="intro">Pour une série dont les termes changent de signe, ou sont complexes, on étudie d'abord la série des modules, à termes positifs, avec tous les outils précédents. Si elle converge, la série de départ converge aussi : c'est la convergence absolue, notion centrale de la 2ᵉ année (séries entières, probabilités).</div>

  <div class="def-box">
    La série \(\sum u_n\) (réelle ou complexe) est <strong>absolument convergente</strong> si la série \(\sum|u_n|\) converge ; on dit aussi que la suite \((u_n)\) est <strong>sommable</strong>, et l'on note \(\sum_{n=0}^{+\infty}|u_n| \lt +\infty\).
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> Une série absolument convergente est convergente, et
    <div class="formula" data-nom="Convergence absolue">$$\left|\sum_{n=0}^{+\infty} u_n\right| \le \sum_{n=0}^{+\infty}|u_n| .$$</div>
    <strong>Comparaison.</strong> Si \((u_n)\) est complexe, \((v_n)\) positive, \(u_n = O(v_n)\) et \(\sum v_n\) convergente, alors \(\sum u_n\) est absolument convergente, donc convergente.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Séparer partie positive et partie négative, puis parties réelle et imaginaire.</span>
    <div class="content"><p><strong>Cas réel.</strong> On pose \(u_n^+ = \max(u_n, 0)\) et \(u_n^- = \max(-u_n, 0)\) : ce sont des réels positifs, majorés par \(|u_n|\), donc \(\sum u_n^+\) et \(\sum u_n^-\) convergent par comparaison. Comme \(u_n = u_n^+ - u_n^-\), \(\sum u_n\) converge par linéarité.</p>
    <p><strong>Cas complexe.</strong> \(|\operatorname{Re} u_n| \le |u_n|\) et \(|\operatorname{Im} u_n| \le |u_n|\) : les séries réelles \(\sum\operatorname{Re} u_n\) et \(\sum\operatorname{Im} u_n\) sont absolument convergentes, donc convergentes, et \(\sum u_n\) converge.</p>
    <p><strong>Inégalité.</strong> \(\left|\sum_{k=0}^{n} u_k\right| \le \sum_{k=0}^{n}|u_k|\) (inégalité triangulaire), puis passage à la limite. <strong>Comparaison.</strong> \(|u_n| \le M v_n\) à partir d'un rang : \(\sum|u_n|\) converge par le §6.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — des séries de signe variable ou complexes</strong>
    <ol>
      <li>\(\sum\frac{\sin n}{n^2}\) : \(\left|\frac{\sin n}{n^2}\right| \le \frac{1}{n^2}\), absolument convergente, bien que le signe de \(\sin n\) varie sans régularité.</li>
      <li>\(\sum\frac{\mathrm e^{in\theta}}{n^{3/2}}\) (\(\theta\) réel) : module \(\frac{1}{n^{3/2}}\), Riemann avec \(\alpha = \frac32 \gt 1\) : absolument convergente.</li>
      <li>\(\sum\left(\frac{1 + i}{2}\right)^n\) : \(\left|\frac{1+i}{2}\right| = \frac{\sqrt2}{2} \lt 1\), série géométrique absolument convergente, de somme \(\frac{1}{1 - \frac{1+i}{2}} = \frac{2}{1 - i} = 1 + i\).</li>
      <li>\(\sum\frac{(-1)^n n}{n^3 + 1}\) : \(\left|u_n\right| \sim \frac{1}{n^2}\), absolument convergente.</li>
    </ol>
  </div>
  <div class="notice"><strong>La réciproque est fausse.</strong> \(\sum_{k \ge 1}\frac{(-1)^{k-1}}{k}\) converge : ses sommes partielles tendent vers \(\ln 2\) (inégalité de Taylor-Lagrange, chapitre « Intégrales », §10). Mais \(\sum\frac1k\) diverge : la série n'est pas absolument convergente. Une telle série est dite semi-convergente ; cette notion est <strong>hors programme en PTSI</strong> et étudiée en 2ᵉ année dans le seul cas des séries alternées (fin de chapitre).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · STRATÉGIE D'ÉTUDE</div>
  <h2>Déterminer la nature d'une série, et parfois sa somme</h2>
  <div class="intro">Les critères précédents s'organisent en un ordre de questions presque systématique. Le développement limité du terme général (chapitre « Analyse asymptotique ») débloque la plupart des cas où aucune série de référence n'apparaît directement.</div>

  <div class="method-box">
    <strong>Méthode — l'ordre des questions</strong>
    <ol>
      <li><strong>Le terme général tend-il vers 0 ?</strong> Sinon, divergence grossière, et c'est fini.</li>
      <li><strong>Série de référence ?</strong> Géométrique, exponentielle, télescopique, Riemann.</li>
      <li><strong>Termes de signe constant</strong> (à partir d'un rang) : chercher un équivalent simple (développement limité) et comparer à une série de Riemann ou géométrique ; règle \(n^\alpha u_n\) ; méthode des rectangles si \(u_n = f(n)\) avec \(f\) monotone (logarithmes).</li>
      <li><strong>Signe variable ou termes complexes</strong> : étudier la convergence absolue avec les mêmes outils sur \(|u_n|\).</li>
      <li><strong>Somme demandée</strong> : télescopage, série géométrique ou exponentielle, ou une intégrale (comme pour \(\ln 2\)).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — quatre termes généraux à développer</strong>
    <ol>
      <li>\(u_n = 1 - \cos\frac1n \sim \frac{1}{2n^2}\), positif : convergence.</li>
      <li>\(u_n = \sqrt{n + 1} - \sqrt n = \frac{1}{\sqrt{n+1} + \sqrt n} \sim \frac{1}{2\sqrt n}\), positif : divergence (c'est aussi une série télescopique, de sommes partielles \(\sqrt{N + 1} - 1\)).</li>
      <li>\(u_n = n\sin\frac1n - 1 = n\left(\frac1n - \frac{1}{6n^3} + o\!\left(\frac{1}{n^3}\right)\right) - 1 \sim -\frac{1}{6n^2}\) : signe constant (négatif) ; \(-u_n \sim \frac{1}{6n^2}\), convergence.</li>
      <li>\(u_n = \left(1 + \frac1n\right)^n - \mathrm e\) : \(n\ln\!\left(1 + \frac1n\right) = 1 - \frac{1}{2n} + O\!\left(\frac{1}{n^2}\right)\), donc \(u_n = \mathrm e\left(\mathrm e^{-\frac{1}{2n} + O(1/n^2)} - 1\right) \sim -\frac{\mathrm e}{2n}\) : divergence.</li>
    </ol>
  </div>
  <div class="notice"><strong>Pièges classiques</strong> : confondre la suite et la série (\(u_n \to 0\) ne suffit jamais) ; appliquer le critère des équivalents sans vérifier le signe ; oublier les premiers termes dans une somme géométrique ; écrire \(\sum_{n=0}^{+\infty} u_n\) avant d'avoir prouvé la convergence ; utiliser la méthode des rectangles avec une fonction non monotone.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · 2ᵉ ANNÉE ET HORS PROGRAMME</div>
  <h2>Ce que la 2ᵉ année ajoute</h2>
  <div class="intro">Ces résultats ne sont pas exigibles en PTSI. Ils sont au programme de PT et traités en détail dans <a href="#series2a/cours">« Séries numériques (approfondissements) »</a> ; on les cite pour comprendre les énoncés qui les utilisent.</div>
  <ul>
    <li><strong>Règle de d'Alembert</strong> (PT). Si \(u_n \neq 0\) et \(\left|\frac{u_{n+1}}{u_n}\right| \to \ell\) : convergence absolue si \(\ell \lt 1\), divergence grossière si \(\ell \gt 1\), aucune conclusion si \(\ell = 1\) (c'est le cas de toutes les séries de Riemann). Exemple : pour \(u_n = \frac{n!}{n^n}\), \(\frac{u_{n+1}}{u_n} = \left(\frac{n}{n+1}\right)^n \to \frac1{\mathrm e} \lt 1\). En PTSI, on conclut sans elle : \(\frac{n!}{n^n} \le \frac{2}{n^2}\) (exercice 3).</li>
    <li><strong>Séries alternées</strong> (PT). Si \((a_n)\) décroît et tend vers 0, \(\sum (-1)^n a_n\) converge, et le reste vérifie \(|R_n| \le a_{n+1}\), avec le signe du premier terme négligé. La démonstration se fait avec les suites adjacentes \((S_{2n})\) et \((S_{2n+1})\), outil de 1ʳᵉ année (exercice 5).</li>
    <li><strong>Semi-convergence</strong> (hors programme en PTSI). Une série convergente mais non absolument convergente, comme \(\sum\frac{(-1)^n}{n+1}\) (somme \(\ln 2\)). Ses termes ne peuvent pas être réordonnés librement : dans l'ordre « un positif, deux négatifs », \(1 - \frac12 - \frac14 + \frac13 - \frac16 - \frac18 + \cdots\) tend vers \(\frac12\ln 2\).</li>
    <li><strong>Critère de Cauchy</strong> (hors programme en PTSI comme en PT) : une série converge si et seulement si ses « tranches » \(\sum_{k=n}^{m} u_k\) deviennent arbitrairement petites, uniformément en \(m \ge n\).</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="ser-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · SÉRIES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Étudier une série, c'est d'abord éliminer les cas simples (divergence grossière, séries de référence), puis comparer le terme général à celui d'une série connue, par un équivalent, une domination ou une intégrale. Chaque méthode donne les étapes, un exemple éclair vérifié et, au besoin, le piège associé. Notations du cours : \(S_n\) somme partielle, \(R_n\) reste.</div>

  <div class="method-box">
    <strong>Méthode 1 — Commencer par le terme général</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Calculer la limite de \(u_n\) (ou montrer qu'elle n'existe pas).</li>
      <li><span class="step">Étape 2.</span> Si \(u_n\) ne tend pas vers 0 : la série <strong>diverge grossièrement</strong>, l'étude est finie.</li>
      <li><span class="step">Étape 3.</span> Si \(u_n \to 0\) : on ne peut <strong>rien</strong> conclure, passer aux méthodes suivantes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\frac{n^2}{n^2 + 1} \to 1\) et \(n\sin\frac1n \to 1\) : les deux séries divergent grossièrement. En revanche \(\frac1n \to 0\) et la série harmonique diverge quand même.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Reconnaître une série géométrique ou exponentielle et calculer sa somme</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Mettre le terme général sous la forme \(a\,q^n\) ou \(a\,\frac{z^n}{n!}\) (sortir les constantes, regrouper les puissances).</li>
      <li><span class="step">Étape 2.</span> Géométrique : vérifier \(|q| \lt 1\), puis \(\sum_{n=n_0}^{+\infty} q^n = \frac{q^{n_0}}{1 - q}\) (premier terme sur \(1 - q\)). Exponentielle : \(\sum_{n=0}^{+\infty}\frac{z^n}{n!} = \mathrm e^z\) pour tout \(z\) complexe.</li>
      <li><span class="step">Étape 3.</span> Pour \(\cos(n\theta)\) ou \(\sin(n\theta)\), passer par \(\mathrm e^{in\theta}\) et prendre partie réelle ou imaginaire.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\displaystyle\sum_{n=2}^{+\infty}\frac{3}{4^n} = 3\times\frac{(1/4)^2}{1 - 1/4} = \frac14\) ; \(\displaystyle\sum_{n=0}^{+\infty}\frac{(-2)^n}{n!} = \mathrm e^{-2} \approx 0{,}135\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Calculer la somme d'une série télescopique</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Décomposer le terme général en éléments simples si c'est une fraction rationnelle ; repérer \(\ln\frac{n+1}{n}\), \(\sqrt{n+1} - \sqrt n\)…</li>
      <li><span class="step">Étape 2.</span> L'écrire \(u_n = a_{n+1} - a_n\) (ou une combinaison de telles différences).</li>
      <li><span class="step">Étape 3.</span> Écrire la somme partielle en entier : les termes intermédiaires se simplifient ; garder ceux du début et de la fin.</li>
      <li><span class="step">Étape 4.</span> Passer à la limite : la série converge si et seulement si \((a_n)\) converge.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\frac{1}{n(n+2)} = \frac12\left(\frac1n - \frac{1}{n+2}\right)\), donc \(\displaystyle\sum_{n=1}^{N}\frac{1}{n(n+2)} = \frac12\left(1 + \frac12 - \frac{1}{N+1} - \frac{1}{N+2}\right) \to \frac34\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Comparer à une série de référence (termes positifs)</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Vérifier que \(u_n \ge 0\) (au moins à partir d'un rang).</li>
      <li><span class="step">Étape 2.</span> Pour prouver une <strong>convergence</strong>, majorer \(u_n\) par le terme d'une série convergente (en majorant le numérateur, en minorant le dénominateur).</li>
      <li><span class="step">Étape 3.</span> Pour prouver une <strong>divergence</strong>, minorer \(u_n\) par le terme d'une série divergente (souvent \(\frac{c}{n}\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(0 \le \frac{1}{2^n + n} \le \frac{1}{2^n}\) : convergence ; \(\frac{1}{n + \sqrt n} \ge \frac{1}{2n}\) : divergence (série harmonique).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une majoration par le terme d'une série <em>divergente</em>, ou une minoration par celui d'une série <em>convergente</em>, ne prouve rien.</div>

  <div class="method-box">
    <strong>Méthode 5 — Trouver un équivalent du terme général</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Fraction rationnelle en \(n\) : quotient des termes de plus haut degré. Expression en \(\frac1n\) : développement limité usuel (\(\sin u \sim u\), \(\ln(1+u) \sim u\), \(\mathrm e^u - 1 \sim u\), \(1 - \cos u \sim \frac{u^2}{2}\)).</li>
      <li><span class="step">Étape 2.</span> Si le premier terme du développement s'annule, pousser le développement d'un ordre.</li>
      <li><span class="step">Étape 3.</span> Vérifier que le terme général est de <strong>signe constant</strong> à partir d'un rang.</li>
      <li><span class="step">Étape 4.</span> Conclure : \(\sum u_n\) a la nature de la série de l'équivalent (Riemann, géométrique).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\ln\!\left(1 + \frac{1}{n^2}\right) \sim \frac{1}{n^2}\) : convergence ; \(\mathrm e^{1/n} - 1 \sim \frac1n\) : divergence ; \(\frac{n^2 + 1}{n^4 - n + 3} \sim \frac{1}{n^2}\) : convergence.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Appliquer la règle « \(n^\alpha u_n\) »</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Utile quand le terme général mêle puissances, logarithmes et exponentielles, sans équivalent simple de Riemann.</li>
      <li><span class="step">Étape 2.</span> Choisir \(\alpha \gt 1\) et montrer \(n^\alpha u_n \to 0\) (croissances comparées) : alors \(u_n = o\!\left(\frac{1}{n^\alpha}\right)\), convergence.</li>
      <li><span class="step">Étape 3.</span> Pour une divergence : montrer \(n\,u_n \to +\infty\), donc \(u_n \ge \frac1n\) à partir d'un rang.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_n = n^3\mathrm e^{-n}\) : \(n^2u_n = n^5\mathrm e^{-n} \to 0\), convergence. \(u_n = \frac{(\ln n)^{10}}{n^{1{,}01}}\) : avec \(\alpha = 1{,}005\), \(n^\alpha u_n = \frac{(\ln n)^{10}}{n^{0{,}005}} \to 0\), convergence (très lente).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Comparer une série à une intégrale (méthode des rectangles)</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire \(u_k = f(k)\) avec \(f\) continue, positive et <strong>monotone</strong> sur \([n_0, +\infty[\) ; justifier la monotonie (signe de \(f'\)).</li>
      <li><span class="step">Étape 2.</span> Faire le dessin des rectangles et écrire, pour \(f\) décroissante, \(\int_k^{k+1} f \le f(k) \le \int_{k-1}^{k} f\) (sens inverse si \(f\) croît).</li>
      <li><span class="step">Étape 3.</span> Sommer (Chasles) en surveillant les bornes, puis calculer les intégrales avec une primitive.</li>
      <li><span class="step">Étape 4.</span> Conclure : majorant borné, convergence ; minorant qui tend vers \(+\infty\), divergence ; bornes équivalentes, équivalent des sommes partielles.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(t) = t^{-1/3}\) décroît, de primitive \(\frac32 t^{2/3}\) : \(\frac32\left((n+1)^{2/3} - 1\right) \le \sum_{k=1}^{n} k^{-1/3} \le 1 + \frac32\left(n^{2/3} - 1\right)\), donc \(\sum_{k=1}^{n} k^{-1/3} \sim \frac32 n^{2/3}\). Pour \(n = 1000\) : \(148{,}6 \le 149{,}1 \le 149{,}5\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer la méthode à une fonction non monotone, ou sommer l'inégalité de droite dès \(k = n_0\) (elle demande \(f\) définie sur \([k - 1, k]\)) : on traite le premier terme à part.</div>

  <div class="method-box">
    <strong>Méthode 8 — Majorer un reste pour une précision donnée</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Série géométrique : \(R_n = \frac{q^{n+1}}{1 - q}\) exactement. Série exponentielle : l'inégalité de Taylor-Lagrange donne \(|R_n| \le \frac{|z|^{n+1}}{(n+1)!}\mathrm e^{|z|}\).</li>
      <li><span class="step">Étape 2.</span> Terme général \(f(k)\), \(f\) décroissante : sommer l'encadrement de \(k = n + 1\) à \(N\), puis faire tendre \(N\) vers \(+\infty\) dans les inégalités larges.</li>
      <li><span class="step">Étape 3.</span> Résoudre « majorant \(\le \varepsilon\) » et prendre le plus petit entier qui convient.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\sum\frac{1}{k^3}\), \(\frac{1}{2(n+1)^2} \le R_n \le \frac{1}{2n^2}\) ; pour une erreur au plus \(10^{-6}\), il suffit que \(2n^2 \ge 10^6\), soit \(n \ge 708\) (et \(R_{708} \approx 9{,}96 \times 10^{-7}\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Étudier une série de signe variable ou à termes complexes</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Calculer ou majorer le module \(|u_n|\) (\(|\mathrm e^{i\theta}| = 1\), \(|\cos| \le 1\), \(|(-1)^n| = 1\)).</li>
      <li><span class="step">Étape 2.</span> Étudier la série à termes positifs \(\sum|u_n|\) avec les méthodes 4 à 7.</li>
      <li><span class="step">Étape 3.</span> Si elle converge, \(\sum u_n\) converge (absolument), et \(\left|\sum u_n\right| \le \sum|u_n|\).</li>
      <li><span class="step">Étape 4.</span> Si \(\sum|u_n|\) diverge, on ne peut pas conclure avec les outils de PTSI, sauf par un argument direct (télescopage, intégrale, suites adjacentes).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\left|\frac{\cos(n\theta)}{n^2 + 1}\right| \le \frac{1}{n^2}\) : convergence absolue ; \(\sum\frac{(2i)^n}{n!}\) converge absolument, de somme \(\mathrm e^{2i} = \cos 2 + i\sin 2\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Discuter la nature d'une série selon un paramètre</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Repérer les valeurs du paramètre qui changent le comportement de \(u_n\) (limite nulle ou non, terme dominant).</li>
      <li><span class="step">Étape 2.</span> Traiter chaque cas avec la méthode adaptée, en commençant par les divergences grossières.</li>
      <li><span class="step">Étape 3.</span> Ne pas oublier les cas frontières (raison de module 1, exposant de Riemann égal à 1).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\sum n^a q^n\) avec \(q \gt 0\) et \(a\) réel. Si \(q \lt 1\), \(n^2\cdot n^a q^n \to 0\) : convergence pour tout \(a\). Si \(q \gt 1\), \(n^a q^n \to +\infty\) : divergence grossière. Si \(q = 1\), série de Riemann : convergence si et seulement si \(a \lt -1\).</p>
  </div>

  <div class="method-box">
    <strong>Pour aller plus loin — règle de d'Alembert et séries alternées (2ᵉ année)</strong>
    <p>Ces deux outils ne sont pas exigibles en PTSI (chapitre <a href="#series2a/cours">« Séries numériques (approfondissements) »</a>) ; les énoncés de 1ʳᵉ année qui en auraient besoin guident vers une comparaison.</p>
    <ul>
      <li><strong>D'Alembert</strong> : pour des factorielles ou des puissances \(n\)-ièmes, calculer \(\left|\frac{u_{n+1}}{u_n}\right|\) et sa limite \(\ell\) ; \(\ell \lt 1\) : convergence absolue, \(\ell \gt 1\) : divergence grossière, \(\ell = 1\) : on ne peut pas conclure (c'est toujours le cas pour une série de Riemann). En PTSI, on remplace souvent la règle par une domination géométrique ou la règle \(n^\alpha u_n\).</li>
      <li><strong>Séries alternées</strong> : si \(u_n = (-1)^n a_n\) avec \((a_n)\) décroissante de limite nulle, la série converge et \(|R_n| \le a_{n+1}\). En PTSI, on le démontre sur chaque exemple avec les suites adjacentes \((S_{2n})\) et \((S_{2n+1})\) (exercice 5).</li>
    </ul>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> :
    <ul>
      <li>conclure que \(\sum u_n\) converge parce que \(u_n \to 0\) (contre-exemple : la série harmonique) ;</li>
      <li>appliquer le critère des équivalents à des termes de signe non constant ;</li>
      <li>oublier le premier terme dans la somme d'une série géométrique qui ne commence pas à \(n = 0\) ;</li>
      <li>écrire \(\sum_{n=0}^{+\infty} u_n\) (un nombre) avant d'avoir prouvé la convergence ;</li>
      <li>croire que la somme de deux séries divergentes diverge toujours (\(u_n = 1\), \(v_n = -1\)).</li>
    </ul>
  </div>
</div>
