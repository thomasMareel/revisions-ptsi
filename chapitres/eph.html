  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la fin de la partie 4.4.2 du programme de PTSI (« Diagrammes potentiel-pH »). Il s'appuie sur <a href="#oxred/cours">« Oxydoréduction »</a> (formule de Nernst, règle du γ, dismutation), <a href="#acidobase/cours">« Réactions acido-basiques »</a> et <a href="#precipitation/cours">« Réactions de dissolution et de précipitation »</a> (domaines de prédominance et d'existence, produit de solubilité). En 2ᵉ année, les diagrammes potentiel-pH servent à nouveau pour la corrosion, avec les courbes courant-potentiel (<a href="#electrochimie/cours">« Électrochimie »</a>).</div>

<div class="course-section">
  <div class="sec-num">§1 · POURQUOI CE CHAPITRE ?</div>
  <h2>Une carte des espèces d'un élément</h2>
  <div class="intro">Une espèce en solution aqueuse peut subir à la fois des réactions acido-basiques, de précipitation et d'oxydoréduction. Plutôt que d'enchaîner les calculs, on résume tout sur une carte : le diagramme potentiel-pH (ou diagramme de Pourbaix, du nom du chimiste belge Marcel Pourbaix) indique, pour un élément donné, l'espèce majoritaire ou présente en fonction du pH et du potentiel de la solution.</div>
  <div class="def-box">
    <strong>Diagramme potentiel-pH.</strong> Pour un élément (fer, cuivre, chlore…), c'est un plan où le pH est en abscisse et le potentiel \(E\) de la solution en ordonnée, découpé par des frontières en <strong>domaines</strong>. Chaque domaine est attaché à une espèce de l'élément : domaine de <strong>prédominance</strong> pour une espèce dissoute (elle y est majoritaire), domaine d'<strong>existence</strong> pour un solide (il n'existe que là). Le tracé suppose des <strong>conventions</strong> (concentration de tracé, pression des gaz, température : 25 °C), toujours précisées.
  </div>

<div class="course-section">
  <div class="sec-num">§2 · ORIENTATION DU DIAGRAMME</div>
  <h2>Où sont les espèces ?</h2>
  <div class="intro">Avant tout calcul, deux règles placent les espèces d'un diagramme : le nombre d'oxydation croît vers le haut, le caractère basique vers la droite. Elles suffisent pour attribuer les domaines d'un diagramme fourni sans légende.</div>
  <div class="prop-box">
    <strong>Verticalement : le nombre d'oxydation.</strong> À pH fixé, le n.o. de l'élément augmente quand \(E\) augmente : un potentiel élevé correspond à un milieu oxydant. Les espèces les plus oxydées sont en haut, les plus réduites (le métal) en bas.
  </div>
  <div class="prop-box">
    <strong>Horizontalement : le caractère acido-basique.</strong> À n.o. fixé, les espèces les plus acides (cations libres, acides) sont à gauche ; quand le pH augmente, les ions HO⁻ s'y associent : hydroxydes ou oxydes solides, puis éventuellement anions (hydroxocomplexes). Pour un même n.o., on passe d'une espèce à l'autre par une frontière verticale (§3).
  </div>
  <div class="method-box"><strong>Méthode — attribuer les domaines d'un diagramme fourni</strong>
    <ol>
      <li>Calculer le n.o. de l'élément dans chaque espèce ; les ranger par n.o. croissant, de bas en haut.</li>
      <li>À n.o. égal, ranger les espèces de la plus acide (gauche) à la plus basique (droite) : cation, puis hydroxyde ou oxyde, puis anion.</li>
      <li>Distinguer solides (domaines d'existence) et espèces dissoutes (domaines de prédominance) ; un métal occupe toujours le bas du diagramme.</li>
      <li>Contrôler avec le type des frontières : verticale entre espèces de même n.o., horizontale ou oblique entre n.o. différents.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — les espèces du chlore</strong>
    <p>Placer Cl⁻, Cl₂, HClO et ClO⁻ (pK<sub>a</sub>(HClO/ClO⁻) = 7,5) sur un diagramme potentiel-pH.</p>
    <ol>
      <li>N.o. : Cl⁻ (−I), Cl₂ (0), HClO et ClO⁻ (+I). De bas en haut : Cl⁻, Cl₂, puis HClO et ClO⁻.</li>
      <li>HClO et ClO⁻ ont le même n.o. : HClO (acide) à gauche, ClO⁻ (base) à droite, séparés par une frontière verticale à pH = pK<sub>a</sub> = 7,5 (concentrations égales).</li>
      <li>Le diagramme calculé (§8) confirme cette disposition et montre en plus que Cl₂ n'a de domaine qu'en milieu très acide.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : mettre les hydroxydes à gauche, ou ranger les espèces selon leur charge et non selon le n.o. de l'élément (Fe(OH)₃, neutre, est au-dessus de Fe²⁺, chargé).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LES TROIS TYPES DE FRONTIÈRES</div>
  <h2>Ce que dit l'orientation d'une frontière</h2>
  <div class="intro">Chaque frontière sépare deux espèces liées par une réaction ; son équation se déduit de la loi d'action des masses ou de la formule de Nernst. Sa direction se lit directement sur la demi-équation, sans calcul.</div>
  <div class="prop-box">
    <strong>Frontière verticale</strong> : les deux espèces ont le <strong>même n.o.</strong> ; elles sont liées par une réaction acido-basique ou de précipitation (sans électron). Sa position ne dépend que du pH (§4).
  </div>
  <div class="prop-box">
    <strong>Frontière horizontale ou oblique</strong> : les deux espèces ont des n.o. différents : c'est une frontière d'oxydoréduction. Pour la demi-équation \(\alpha\,\mathrm{Ox} + p\,\mathrm{H^+} + n\,e^- = \beta\,\mathrm{Red} + q\,\mathrm{H_2O}\), la formule de Nernst donne
    <div class="formula" data-nom="Pente d'une frontière potentiel-pH">$$E = \text{constante} - \frac{0{,}06\,p}{n}\,\text{pH}$$</div>
    La frontière est <strong>horizontale</strong> si aucun H⁺ (ni HO⁻) n'intervient (\(p = 0\)), <strong>oblique</strong> de pente \(-0{,}06\,p/n\) volt par unité de pH sinon. Si les H⁺ sont du côté du réducteur (\(p \lt 0\) dans l'écriture ci-dessus), la pente est positive.
  </div>
  <div class="method-box"><strong>Exemple — pentes des frontières du fer</strong>
    <ol>
      <li>Fe³⁺/Fe²⁺ : Fe³⁺ + e⁻ = Fe²⁺, \(p = 0\) : horizontale (0,77 V).</li>
      <li>Fe(OH)₃/Fe²⁺ : Fe(OH)₃ + 3 H⁺ + e⁻ = Fe²⁺ + 3 H₂O, \(p = 3\), \(n = 1\) : pente \(-0{,}18\ \text{V}\) par unité de pH.</li>
      <li>Fe(OH)₃/Fe(OH)₂ : Fe(OH)₃ + H⁺ + e⁻ = Fe(OH)₂ + H₂O : pente \(-0{,}06\ \text{V}\). Fe(OH)₂/Fe : Fe(OH)₂ + 2 H⁺ + 2 e⁻ = Fe + 2 H₂O : pente \(-0{,}06\ \text{V}\) aussi.</li>
      <li>Cuivre, frontière Cu²⁺/Cu₂O : 2 Cu²⁺ + H₂O + 2 e⁻ = Cu₂O + 2 H⁺, les H⁺ sont du côté du réducteur : pente \(+0{,}06\ \text{V}\) par unité de pH.</li>
    </ol>
  </div>
  <p><strong>Ordre de grandeur</strong> : pour MnO₄⁻/Mn²⁺ (\(p = 8\), \(n = 5\)), la pente est \(-0{,}096\ \text{V}\) par unité de pH : de pH 0 à pH 7, le potentiel baisse de 0,67 V, plus que l'écart entre les couples Fe³⁺/Fe²⁺ et Cu²⁺/Cu (0,43 V) : le pH peut inverser le classement de deux couples.</p>
  <div class="notice"><strong>Erreur classique</strong> : prendre une frontière verticale pour une frontière d'oxydoréduction, ou oublier le facteur \(1/n\) dans la pente (Fe(OH)₂/Fe : −0,06 et non −0,12 V par unité de pH). La pente ne dépend pas des conventions de tracé ; l'ordonnée à l'origine, si.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PRÉDOMINANCE, EXISTENCE ET CONVENTIONS DE TRACÉ</div>
  <h2>Où placer une frontière</h2>
  <div class="intro">Une frontière est une convention : on choisit la composition à laquelle on « passe » d'une espèce à l'autre. Les conventions fixent la position des frontières (pas leur pente) ; elles doivent figurer avec tout diagramme.</div>
  <div class="def-box">
    <strong>Conventions usuelles.</strong> On fixe une <strong>concentration de tracé</strong> \(c_{\text{tr}}\) (souvent \(10^{-2}\) ou \(10^{-6}\ \text{mol·L}^{-1}\)) :
    <ul>
      <li>entre deux espèces <strong>dissoutes</strong> : frontière de <strong>prédominance</strong>, où les deux concentrations sont égales (chacune prise égale à \(c_{\text{tr}}\)) ; de part et d'autre, l'autre espèce existe encore, minoritaire ;</li>
      <li>entre une espèce dissoute et un <strong>solide</strong> : frontière d'<strong>existence</strong>, où le solide apparaît quand l'espèce dissoute est à \(c_{\text{tr}}\) ; de l'autre côté, le solide est totalement absent ;</li>
      <li>un gaz est pris sous une pression de tracé, en général 1 bar.</li>
    </ul>
  </div>
  <div class="method-box"><strong>Exemple — justifier la position d'une frontière verticale</strong>
    <p>Positions des frontières Fe³⁺/Fe(OH)₃ et Fe²⁺/Fe(OH)₂ pour \(c_{\text{tr}} = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) (pK<sub>s</sub> : Fe(OH)₃ 38 ; Fe(OH)₂ 15,1 ; pK<sub>e</sub> = 14) ; puis pour \(c_{\text{tr}} = 1{,}0\times10^{-6}\ \text{mol·L}^{-1}\).</p>
    <ol>
      <li>Le solide Fe(OH)₃ apparaît quand \([\mathrm{Fe^{3+}}][\mathrm{HO^-}]^3 = K_s\) avec \([\mathrm{Fe^{3+}}] = c_{\text{tr}}\) : \([\mathrm{HO^-}]^3 = 10^{-38}/10^{-2} = 10^{-36}\), pOH = 12, <strong>pH = 2,0</strong>.</li>
      <li>Fe(OH)₂ : \([\mathrm{HO^-}]^2 = 10^{-15{,}1}/10^{-2}\), pOH = 6,55, <strong>pH = 7,45</strong>.</li>
      <li>Avec \(c_{\text{tr}} = 10^{-6}\) : pH = 14 − 32/3 = 3,3 et pH = 14 − 9,1/2 = 9,45. Plus la concentration de tracé est faible, plus il faut de HO⁻ pour atteindre le produit de solubilité : les frontières d'existence se décalent vers la droite.</li>
    </ol>
  </div>
  <p>Ces frontières d'existence sont exactement celles du chapitre <a href="#precipitation/cours">« Réactions de dissolution et de précipitation »</a> (§5), et les frontières de prédominance acide-base sont en pH = pK<sub>a</sub> comme dans <a href="#acidobase/cours">« Réactions acido-basiques »</a> (§4). La valeur \(c_{\text{tr}} = 10^{-6}\ \text{mol·L}^{-1}\) est celle des diagrammes de corrosion : un métal est considéré comme attaqué dès que la solution contient \(10^{-6}\ \text{mol·L}^{-1}\) de ses ions.</p>
  <div class="notice"><strong>Erreur classique</strong> : confondre prédominance et existence. Hors de son domaine, une espèce dissoute est minoritaire mais présente ; un solide hors de son domaine est totalement absent. Autre piège : comparer deux diagrammes tracés avec des conventions différentes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DIAGRAMME E-pH DE L'EAU</div>
  <h2>Le domaine où vit toute la chimie en solution aqueuse</h2>
  <div class="intro">L'eau est un oxydant (couple H⁺/H₂, ou H₂O/H₂) et un réducteur (couple O₂/H₂O). Son diagramme délimite la zone où elle n'est ni oxydée ni réduite ; on le superpose à tous les autres pour savoir quelles espèces sont stables dans l'eau.</div>
  <div class="prop-box">
    <strong>Frontières de l'eau</strong> (gaz sous 1 bar, 25 °C).
    <ul>
      <li>2 H⁺ + 2 e⁻ = H₂ : \(E = 0 + 0{,}03\log\dfrac{[\mathrm{H^+}]^2}{P_{\mathrm{H_2}}}\), soit
      <div class="formula" data-nom="Frontière H⁺/H₂">$$E = -0{,}06\,\text{pH}$$</div></li>
      <li>O₂ + 4 H⁺ + 4 e⁻ = 2 H₂O : \(E = 1{,}23 + 0{,}015\log\left(P_{\mathrm{O_2}}[\mathrm{H^+}]^4\right)\), soit
      <div class="formula" data-nom="Frontière O₂/H₂O">$$E = 1{,}23 - 0{,}06\,\text{pH}$$</div></li>
    </ul>
    Deux droites parallèles, distantes de 1,23 V. Entre elles, l'eau est thermodynamiquement stable ; au-dessus, elle est oxydée en O₂ ; au-dessous, réduite en H₂.
  </div>

<figcaption>Diagramme potentiel-pH de l'eau à 25 °C (pressions de tracé : 1 bar). Les deux frontières, O₂/H₂O (E = 1,23 − 0,06 pH) et H⁺/H₂ (E = −0,06 pH), sont parallèles et distantes de 1,23 V. Entre elles (en vert), l'eau est stable ; au-dessus, le milieu est assez oxydant pour oxyder l'eau en O₂ ; au-dessous, assez réducteur pour la réduire en H₂.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Stabilité d'une espèce dans l'eau.</strong> Une espèce dont le domaine est <strong>entièrement au-dessus</strong> de la frontière O₂/H₂O est un oxydant assez fort pour oxyder l'eau (dégagement de O₂). Une espèce dont le domaine est <strong>entièrement au-dessous</strong> de la frontière H⁺/H₂ réduit l'eau (dégagement de H₂). Une espèce dont le domaine recoupe la bande de l'eau y est stable, dans la partie commune.
  </div>
  <div class="method-box"><strong>Exemple — trois espèces face à l'eau</strong>
    <p>Données : \(E^\circ\) (V) MnO₄⁻/Mn²⁺ 1,51 ; Na⁺/Na −2,71 ; Cu²⁺/Cu 0,34. Que deviennent le permanganate à pH 0, le sodium, le cuivre dans une eau désaérée ?</p>
    <ol>
      <li>MnO₄⁻/Mn²⁺ à pH 0 : 1,51 V > 1,23 V. Le permanganate devrait oxyder l'eau : 4 MnO₄⁻ + 12 H⁺ = 4 Mn²⁺ + 5 O₂ + 6 H₂O, \(\log K^\circ = 20\times(1{,}51 - 1{,}23)/0{,}06 = 93\). Cette réaction est pourtant très lente : on conserve des solutions de permanganate des semaines (à l'abri de la lumière). Prévision thermodynamique et observation diffèrent pour une raison cinétique (§9).</li>
      <li>Na : son domaine est à −2,7 V, très au-dessous de \(-0{,}06\,\text{pH}\) : il réduit l'eau violemment, 2 Na + 2 H₂O = 2 Na⁺ + 2 HO⁻ + H₂.</li>
      <li>Cu : la frontière Cu²⁺/Cu est à 0,28 V pour \(c_{\text{tr}} = 10^{-2}\), au-dessus de la frontière H⁺/H₂ à tout pH : le domaine du cuivre recoupe celui de l'eau, le cuivre ne réduit pas l'eau ni les ions H⁺ (il ne s'attaque pas dans l'acide chlorhydrique désaéré). Il est en revanche oxydé par le dioxygène (§6).</li>
    </ol>
  </div>
  <p><strong>Lire le potentiel d'un milieu</strong> : une solution aérée a un potentiel proche de la frontière O₂/H₂O (le dioxygène dissous impose son potentiel, 0,80 V à pH 7 sous 0,21 bar) ; une solution désaérée en contact avec un métal réducteur a un potentiel bas. C'est ce qui permet de placer un milieu réel sur le diagramme.</p>
  <div class="notice"><strong>Erreur classique</strong> : lire « au-dessous de la droite H⁺/H₂, H⁺ oxyde tout ». C'est l'inverse : au-dessous de cette droite, c'est H₂ qui est stable ; une espèce réductrice dont le domaine est là réduit H⁺ ou H₂O en H₂.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · UTILISATIONS : SUPERPOSER DES DIAGRAMMES</div>
  <h2>Prévoir une réaction entre deux éléments</h2>
  <div class="intro">Superposer deux diagrammes, c'est appliquer la règle des domaines disjoints de <a href="#oxred/cours">« Oxydoréduction »</a> (§7) à tous les pH à la fois. On en déduit si une transformation est thermodynamiquement favorisée, et à quel pH.</div>
  <div class="prop-box">
    <strong>Superposition.</strong> On trace les deux diagrammes (avec les mêmes conventions) sur le même graphique. Deux espèces dont les domaines ont une partie commune sont <strong>compatibles</strong> à ce pH ; deux espèces dont les domaines sont <strong>disjoints</strong> (à pH donné, séparés verticalement) réagissent : la réaction est thermodynamiquement favorisée, et elle produit des espèces dont les domaines ont une partie commune. L'écart vertical entre les deux domaines donne la constante (\(\log K^\circ = n\,\Delta E/0{,}06\)).
  </div>
  <div class="method-box"><strong>Exemple — le fer, l'eau et le dioxygène</strong>
    <p>Avec le diagramme du fer (§1) et celui de l'eau, prévoir : (a) le fer dans un acide désaéré à pH 1 ; (b) le fer dans une eau aérée à pH 7 ; (c) une solution de Fe²⁺ à pH 1 laissée à l'air.</p>
    <ol>
      <li>(a) Le domaine de Fe est au-dessous de la frontière H⁺/H₂ à tout pH : Fe et H⁺ sont incompatibles. Fe + 2 H⁺ = Fe²⁺ + H₂ ; à pH 1, Fe²⁺ (domaine entre −0,50 et 0,77 V) recoupe la bande de l'eau : c'est le produit.</li>
      <li>(b) À pH 7, l'eau aérée est au potentiel de la frontière O₂/H₂O (≈ 0,8 V), dans le domaine de Fe(OH)₃ : le fer est oxydé jusqu'au fer(III), 4 Fe + 3 O₂ + 6 H₂O = 4 Fe(OH)₃, la rouille (simplifiée).</li>
      <li>(c) À pH 1, la frontière O₂/H₂O est à 1,17 V, au-dessus de celle de Fe³⁺/Fe²⁺ (0,77 V) : Fe²⁺ et O₂ sont incompatibles, 4 Fe²⁺ + O₂ + 4 H⁺ = 4 Fe³⁺ + 2 H₂O, \(\log K^\circ = 4\times0{,}46/0{,}06 = 30{,}7\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Dismutation et médiamutation sur un diagramme.</strong> Une espèce de n.o. intermédiaire qui n'a <strong>pas de domaine</strong> dans un intervalle de pH (les frontières des espèces voisines se croisent à sa place) s'y dismute. Inversement, une espèce de n.o. intermédiaire dont le domaine sépare ceux de ses deux voisines est obtenue par <strong>médiamutation</strong> de celles-ci : Fe et Fe³⁺, séparés par le domaine de Fe²⁺, réagissent en Fe²⁺ (Fe + 2 Fe³⁺ = 3 Fe²⁺). Ces situations peuvent changer avec le pH (§8).
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure d'une superposition qu'une réaction est rapide. Le diagramme ne donne que le sens thermodynamique ; une réaction favorisée peut être bloquée (§9). Autre piège : superposer des diagrammes tracés avec des concentrations de tracé différentes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CONSTRUIRE UN DIAGRAMME : LE FER</div>
  <h2>Le principe de construction, pas à pas</h2>
  <div class="intro">Le programme demande le principe de construction : savoir d'où vient chaque frontière et calculer pentes et positions. On reconstruit ici le diagramme du fer du §1 (espèces Fe, Fe²⁺, Fe³⁺, Fe(OH)₂, Fe(OH)₃ ; \(c_{\text{tr}} = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\)).</div>
  <div class="method-box"><strong>Méthode — construire un diagramme potentiel-pH</strong>
    <ol>
      <li>Lister les espèces, calculer leur n.o. et les classer (§2) ; préciser les conventions (§4).</li>
      <li>Diagramme de situation : pour chaque n.o., les frontières verticales (pK<sub>a</sub>, conditions de précipitation).</li>
      <li>Pour chaque paire d'espèces de n.o. voisins, dans chaque intervalle de pH : écrire la demi-équation, appliquer la formule de Nernst avec les conventions, obtenir \(E = a - b\,\text{pH}\).</li>
      <li>Assembler en partant des pH faibles ; les frontières se rejoignent aux points où trois espèces coexistent (continuité). Si une espèce se trouve sans domaine (frontières qui se croisent dans le mauvais ordre), elle se dismute : on la retire et on écrit la frontière entre ses voisines (§8).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — les frontières du fer</strong>
    <p>Données : \(E^\circ(\mathrm{Fe^{3+}/Fe^{2+}}) = 0{,}77\ \text{V}\), \(E^\circ(\mathrm{Fe^{2+}/Fe}) = -0{,}44\ \text{V}\) ; frontières verticales du §4 : pH 2,0 (fer(III)) et pH 7,45 (fer(II)).</p>
    <ol>
      <li>Fe³⁺/Fe²⁺ (pH \(\lt\) 2) : \(E = 0{,}77 + 0{,}06\log\dfrac{c_{\text{tr}}}{c_{\text{tr}}} = 0{,}77\ \text{V}\).</li>
      <li>Fe(OH)₃/Fe²⁺ (2 \(\lt\) pH \(\lt\) 7,45) : Fe(OH)₃ + 3 H⁺ + e⁻ = Fe²⁺ + 3 H₂O. Par continuité au point (pH 2,0 ; 0,77 V) et avec la pente −0,18 V : \(E = 0{,}77 - 0{,}18\,(\text{pH} - 2) = 1{,}13 - 0{,}18\,\text{pH}\). (Calcul direct : \([\mathrm{Fe^{3+}}] = K_s/[\mathrm{HO^-}]^3\) dans la formule de Nernst de Fe³⁺/Fe²⁺.)</li>
      <li>Fe(OH)₃/Fe(OH)₂ (pH \(\gt\) 7,45) : pente −0,06 V, continuité en pH 7,45 où \(E = 1{,}13 - 0{,}18\times7{,}45 = -0{,}21\ \text{V}\) : \(E = 0{,}24 - 0{,}06\,\text{pH}\).</li>
      <li>Fe²⁺/Fe (pH \(\lt\) 7,45) : \(E = -0{,}44 + 0{,}03\log c_{\text{tr}} = -0{,}50\ \text{V}\) ; Fe(OH)₂/Fe (pH \(\gt\) 7,45) : pente −0,06 V depuis (7,45 ; −0,50) : \(E = -0{,}05 - 0{,}06\,\text{pH}\).</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Vérification</span>
    <span class="prompt">Retrouver la frontière Fe(OH)₃/Fe²⁺ par le calcul direct</span>
    <div class="content">
      <p>En présence de Fe(OH)₃, \([\mathrm{Fe^{3+}}] = \dfrac{K_s}{[\mathrm{HO^-}]^3} = K_s\,\dfrac{[\mathrm{H^+}]^3}{K_e^3}\) (concentrations en mol·L⁻¹). La formule de Nernst du couple Fe³⁺/Fe²⁺ avec \([\mathrm{Fe^{2+}}] = c_{\text{tr}}\) donne</p>
      <div class="formula">$$E = 0{,}77 + 0{,}06\log\frac{K_s}{K_e^3\,c_{\text{tr}}} - 0{,}18\,\text{pH} = 0{,}77 + 0{,}06\,(-38 + 42 + 2) - 0{,}18\,\text{pH}$$</div>
      <p>soit \(E = 1{,}13 - 0{,}18\,\text{pH}\), le même résultat que par continuité.</p>
    </div>
  </div>
  <p>Contrôle de cohérence : le domaine de Fe est entièrement au-dessous de la frontière H⁺/H₂ (de 0,05 V seulement en milieu basique), et la frontière O₂/H₂O traverse le domaine de Fe(OH)₃ dès pH 2 : en eau aérée, le fer finit en fer(III).</p>
  <div class="notice"><strong>Erreur classique</strong> : écrire une frontière d'oxydoréduction entre deux espèces qui n'ont pas de domaine voisin dans l'intervalle de pH considéré (Fe³⁺/Fe à pH 1, alors que Fe²⁺ les sépare), ou oublier de vérifier la continuité aux points triples.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DISMUTATION ET MÉDIAMUTATION SELON LE pH : LE CHLORE</div>
  <h2>Quand le pH décide de la stabilité d'une espèce</h2>
  <div class="intro">Les frontières d'oxydoréduction n'ont pas toutes la même pente : en changeant le pH, deux frontières peuvent se croiser, et une espèce de n.o. intermédiaire perd (ou gagne) son domaine. C'est le cas du dichlore, dont la dismutation en milieu basique sert à fabriquer l'eau de Javel.</div>

  <div class="method-box"><strong>Exemple — le seuil de dismutation du dichlore</strong>
    <p>Conventions de la figure : HClO, ClO⁻ et Cl⁻ à \(c_{\text{tr}} = 0{,}10\ \text{mol·L}^{-1}\), Cl₂ sous 1 bar ; \(E^\circ\) (V) HClO/Cl₂ 1,63, Cl₂/Cl⁻ 1,36.</p>
    <ol>
      <li>Cl₂ + 2 e⁻ = 2 Cl⁻ : \(E = 1{,}36 + 0{,}03\log\dfrac{P_{\mathrm{Cl_2}}}{[\mathrm{Cl^-}]^2} = 1{,}36 + 0{,}06 = 1{,}42\ \text{V}\), indépendant du pH.</li>
      <li>2 HClO + 2 H⁺ + 2 e⁻ = Cl₂ + 2 H₂O : \(E = 1{,}63 + 0{,}03\log\left([\mathrm{HClO}]^2[\mathrm{H^+}]^2\right) = 1{,}57 - 0{,}06\,\text{pH}\).</li>
      <li>Cl₂ a un domaine tant que la frontière où il est oxydant (1,42 V) est au-dessous de celle où il est réducteur : \(1{,}42 \lt 1{,}57 - 0{,}06\,\text{pH}\), soit <strong>pH \(\lt\) 2,5</strong>. Au-delà, il se dismute : Cl₂ + H₂O = HClO + Cl⁻ + H⁺ (pH 2,5 à 7,5), Cl₂ + 2 HO⁻ = ClO⁻ + Cl⁻ + H₂O (milieu basique).</li>
      <li>Inversement, en milieu acide (pH \(\lt\) 2,5), HClO et Cl⁻ ont des domaines séparés par celui de Cl₂ : ils se médiamutent en dichlore. D'où le danger de mélanger eau de Javel (ClO⁻ + Cl⁻) et détartrant acide.</li>
    </ol>
  </div>
  <p>Le seuil dépend des conventions (pH 4,5 avec des concentrations de 1 mol·L⁻¹, voir le problème « Concours PT » d'« Oxydoréduction »), mais la conclusion ne change pas : le dichlore n'est stable qu'en milieu acide. Autre exemple classique : l'ion cuivre(I) Cu⁺ se dismute à tout pH, mais le cuivre(I) existe sous forme d'oxyde Cu₂O solide au-delà de pH 3 environ (problème « Concours PT » de ce chapitre).</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les \(E^\circ\) (valables à pH 0) pour conclure qu'une dismutation est impossible, alors qu'une des frontières dépend du pH. Méthode sûre : écrire les deux frontières de l'espèce de n.o. intermédiaire en fonction du pH et chercher où elles se croisent.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · THERMODYNAMIQUE ET CINÉTIQUE : CONFRONTER AUX OBSERVATIONS</div>
  <h2>Ce que le diagramme ne dit pas</h2>
  <div class="intro">Un diagramme potentiel-pH dit ce qui est thermodynamiquement favorisé, pas à quelle vitesse cela se produit. Le programme demande de confronter les prévisions à l'expérience et d'interpréter les écarts en termes cinétiques.</div>
  <div class="prop-box">
    <strong>Blocage cinétique.</strong> Une transformation favorisée (domaines disjoints) peut être si lente qu'on ne l'observe pas à l'échelle de l'expérience : l'espèce est alors <strong>métastable</strong>. Inversement, une transformation observée est toujours thermodynamiquement favorisée : le diagramme interdit, la cinétique seulement retarde.
  </div>
  <div class="method-box"><strong>Exemple — quatre observations à interpréter</strong>
    <ol>
      <li><strong>Permanganate et eau de Javel se conservent</strong> alors que leurs domaines sont au-dessus de la frontière O₂/H₂O (§5, §8) : l'oxydation de l'eau en O₂ est très lente. Elles se décomposent quand même peu à peu (lumière, chaleur, catalyseurs) : on les stocke au frais et à l'abri de la lumière.</li>
      <li><strong>Une solution de Fe²⁺ jaunit en quelques jours à pH 1</strong> (oxydation en Fe³⁺ par l'air), alors qu'un précipité blanc de Fe(OH)₂ verdit puis rouille <strong>en quelques minutes</strong> en milieu basique. L'écart entre O₂/H₂O et le couple du fer est de 0,40 V à pH 1 (1,17 − 0,77) mais de 1,0 V en milieu basique (\(1{,}23 - 0{,}24\), les deux frontières ayant la même pente) : la réaction est plus favorisée, et surtout beaucoup plus rapide.</li>
      <li><strong>Le zinc dans l'acide sulfurique</strong> : favorisée (\(\log K^\circ = 2\times0{,}76/0{,}06 = 25\)), la réaction Zn + 2 H⁺ = Zn²⁺ + H₂ est lente avec du zinc pur, et s'accélère nettement au contact d'un fil de cuivre ou de platine. L'explication (surtension) relève des courbes courant-potentiel de 2ᵉ année.</li>
      <li><strong>L'aluminium</strong>, dont le domaine (\(E^\circ = -1{,}66\ \text{V}\)) est très au-dessous de celui de l'eau, ne réagit pas avec elle : une fine couche d'alumine Al₂O₃ le protège (passivation, vue en 2ᵉ année).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure d'une absence de réaction observée que le diagramme est faux, ou d'une réaction favorisée qu'elle est immédiate. Les deux informations, thermodynamique et cinétique, sont indépendantes et nécessaires.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · MISE EN ŒUVRE : DOSER LE DIOXYGÈNE DISSOUS</div>
  <h2>La méthode de Winkler, lue sur les diagrammes</h2>
  <div class="intro">La teneur en dioxygène dissous est un indicateur essentiel de la qualité d'une eau (une rivière en bon état en contient 7 à 10 mg·L⁻¹). La méthode de Winkler la mesure par une suite de réactions d'oxydoréduction dont chaque étape se justifie sur un diagramme potentiel-pH : c'est l'exemple type de la capacité « mettre en œuvre des réactions d'oxydo-réduction en s'appuyant sur des diagrammes potentiel-pH ».</div>

<figcaption>Méthode de Winkler. Diagramme simplifié du manganèse (n.o. +II et +III seulement, c<sub>tr</sub> = 1,0·10⁻² mol·L⁻¹, pK<sub>s</sub> : Mn(OH)₂ 12,7, Mn(OH)₃ 36 ; E°(Mn³⁺/Mn²⁺) = 1,51 V), frontière I₂/I⁻ (0,60 V, même convention) et frontières de l'eau en pointillés. ① En milieu basique, le domaine de Mn(OH)₂ est au-dessous de la frontière O₂/H₂O : le dioxygène dissous oxyde Mn(OH)₂ en Mn(OH)₃. ② Après acidification (pH < 2,7), Mn(OH)₃ se dissout en Mn³⁺, dont le domaine est disjoint de celui de I⁻ : les ions iodure sont oxydés en diiode, que l'on titre.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Protocole et réactions.</strong>
    <ol>
      <li>On remplit à ras bord un flacon de l'eau à analyser, on ajoute du chlorure de manganèse(II) et de la soude, on bouche sans bulle d'air : Mn(OH)₂ précipite. En milieu basique, O₂ et Mn(OH)₂ ont des domaines disjoints (étape ①) : 4 Mn(OH)₂ + O₂ + 2 H₂O = 4 Mn(OH)₃, rapide, qui « fixe » tout le dioxygène.</li>
      <li>On acidifie (acide sulfurique, pH \(\lt\) 2,7) et on ajoute un excès d'iodure : Mn(OH)₃ se dissout en Mn³⁺, dont le domaine (au-dessus de 1,51 V) est disjoint de celui de I⁻ (étape ②) : 2 Mn³⁺ + 2 I⁻ = 2 Mn²⁺ + I₂, \(\log K^\circ = 2\times(1{,}51 - 0{,}54)/0{,}06 = 32\).</li>
      <li>On titre le diiode par le thiosulfate (iodométrie, voir « Oxydoréduction », §10) : I₂ + 2 S₂O₃²⁻ = 2 I⁻ + S₄O₆²⁻.</li>
    </ol>
    Bilan : 1 O₂ → 4 Mn(III) → 2 I₂ → 4 S₂O₃²⁻, donc
    <div class="formula" data-nom="Méthode de Winkler">$$n(\mathrm{O_2}) = \frac{n(\mathrm{S_2O_3^{2-}})_{\text{éq}}}{4}$$</div>
  </div>
  <div class="method-box"><strong>Exemple — teneur en O₂ d'une eau de rivière</strong>
    <p>Pour \(V_0 = 100{,}0\ \text{mL}\) d'eau, le diiode formé est titré par le thiosulfate à \(1{,}00\times10^{-2}\ \text{mol·L}^{-1}\) : \(V_E = 9{,}6\ \text{mL}\). Teneur en O₂ en mg·L⁻¹ (\(M(\mathrm{O_2}) = 32{,}0\ \text{g·mol}^{-1}\)) ? Pourquoi opérer en deux temps ?</p>
    <ol>
      <li>\(n(\mathrm{S_2O_3^{2-}}) = 1{,}00\times10^{-2}\times9{,}6 = 0{,}096\ \text{mmol}\), \(n(\mathrm{O_2}) = 0{,}024\ \text{mmol}\) dans 100 mL : \(2{,}4\times10^{-4}\ \text{mol·L}^{-1}\), soit \(7{,}7\ \text{mg·L}^{-1}\).</li>
      <li>En milieu acide, O₂ ne peut pas oxyder Mn²⁺ : à pH 1, la frontière O₂/H₂O (1,17 V) est au-dessous de Mn³⁺/Mn²⁺ (1,51 V). Il faut donc le milieu basique, où Mn(II) est sous forme Mn(OH)₂, bien plus facile à oxyder (frontière Mn(OH)₃/Mn(OH)₂ : \(E = 0{,}95 - 0{,}06\,\text{pH}\)).</li>
      <li>En milieu basique, en revanche, Mn(III) n'oxyde pas l'iodure de façon utilisable (Mn(OH)₃ solide) : on acidifie pour former Mn³⁺, oxydant fort. Le dioxygène dissous oxyderait aussi l'iodure en milieu acide, mais lentement, et il a déjà été entièrement fixé.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(n(\mathrm{O_2}) = n(\mathrm{S_2O_3^{2-}})/2\) en oubliant que chaque O₂ fournit quatre électrons, ou laisser une bulle d'air dans le flacon (dioxygène en trop, résultat par excès).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · CORROSION, IMMUNITÉ, PASSIVATION (2ᵉ ANNÉE)</div>
  <h2>Les diagrammes de corrosion</h2>
  <div class="intro">Hors programme en PTSI (vu en 2ᵉ année, avec les courbes courant-potentiel : <a href="#electrochimie/cours">« Électrochimie »</a>, §7 à §9).</div>
  <ul>
    <li>Avec \(c_{\text{tr}} = 10^{-6}\ \text{mol·L}^{-1}\), on lit sur le diagramme d'un métal trois zones : <strong>immunité</strong> (domaine du métal : il n'est pas attaqué), <strong>corrosion</strong> (domaines des ions : le métal se dissout), <strong>passivation</strong> (domaines d'un oxyde ou d'un hydroxyde solide qui peut le protéger, s'il est compact et adhérent).</li>
    <li>Le fer est corrodé en milieu acide ; en milieu neutre aéré, la rouille formée (hydroxydes et oxydes de fer(III)) est poreuse et ne le protège pas. L'aluminium et le chrome se passivent : leur oxyde est compact (acier inoxydable : au moins 10,5 % de chrome). L'or est immun dans l'eau : son domaine recoupe la bande de l'eau à tout pH.</li>
    <li>La vitesse de corrosion, les anodes sacrificielles et la protection par courant imposé s'interprètent avec les courbes courant-potentiel.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="eph-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · DIAGRAMMES E-pH</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Le programme demande de lire un diagramme fourni, d'en justifier les frontières (pentes, frontières verticales), de connaître le principe de sa construction et de s'en servir pour prévoir. Notations du cours : \(c_{\text{tr}}\) concentration de tracé, gaz sous 1 bar, \(\dfrac{RT}{F}\ln 10 \approx 0{,}06\ \text{V}\) à 298 K.</div>

  <div class="method-box"><strong>Méthode 1 — Attribuer les domaines d'un diagramme fourni</strong>
    <ol>
      <li>Calculer le n.o. de l'élément dans chaque espèce ; n.o. croissant de bas en haut.</li>
      <li>À n.o. égal : de gauche à droite, cation (ou acide), hydroxyde ou oxyde, anion.</li>
      <li>Repérer les solides (domaines d'existence) et les espèces dissoutes (domaines de prédominance) ; le métal est en bas.</li>
      <li>Contrôler : frontière verticale entre espèces de même n.o. seulement.</li>
    </ol>
    <p><em>Exemple éclair :</em> manganèse, espèces Mn, Mn²⁺, Mn(OH)₂, Mn(OH)₃, MnO₂, MnO₄⁻ : n.o. 0 ; +II ; +II ; +III ; +IV ; +VII. De bas en haut : Mn ; Mn²⁺ (à gauche) et Mn(OH)₂ (à droite) ; Mn(OH)₃ ; MnO₂ ; MnO₄⁻ en haut.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Déterminer la pente d'une frontière</strong>
    <ol>
      <li>Même n.o. des deux côtés : frontière verticale.</li>
      <li>Sinon, écrire la demi-équation \(\alpha\,\mathrm{Ox} + p\,\mathrm{H^+} + n\,e^- = \beta\,\mathrm{Red} + q\,\mathrm{H_2O}\).</li>
      <li>Pente \(-0{,}06\,p/n\) volt par unité de pH : nulle sans H⁺, positive si les H⁺ sont du côté du réducteur.</li>
    </ol>
    <p><em>Exemple éclair :</em> MnO₂/Mn²⁺ : MnO₂ + 4 H⁺ + 2 e⁻ = Mn²⁺ + 2 H₂O, pente \(-0{,}06\times4/2 = -0{,}12\ \text{V}\) par unité de pH.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Justifier la position d'une frontière verticale</strong>
    <ol>
      <li>Acide/base dissous (concentrations égales) : pH = pK<sub>a</sub>.</li>
      <li>Ion/hydroxyde \(\mathrm{M^{n+}}\)/M(OH)ₙ : le solide apparaît quand \([\mathrm{M^{n+}}] = c_{\text{tr}}\) et \(c_{\text{tr}}[\mathrm{HO^-}]^n = K_s\) : \(\text{pOH} = (\text{p}K_s + \log c_{\text{tr}})/n\), pH = 14 − pOH.</li>
      <li>Vérifier le sens : le solide est à droite (pH plus grand).</li>
    </ol>
    <p><em>Exemple éclair :</em> Zn²⁺/Zn(OH)₂, pK<sub>s</sub> = 16,4, \(c_{\text{tr}} = 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) : pOH = (16,4 − 2)/2 = 7,2, frontière à pH 6,8.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Écrire l'équation d'une frontière d'oxydoréduction</strong>
    <ol>
      <li>Identifier les deux espèces voisines dans l'intervalle de pH considéré ; écrire la demi-équation.</li>
      <li>Appliquer la formule de Nernst avec les conventions : espèces dissoutes à \(c_{\text{tr}}\), solides à activité 1, gaz à 1 bar.</li>
      <li>Ou bien : partir d'un point connu (point triple) et utiliser la pente (méthode 2), par continuité.</li>
    </ol>
    <p><em>Exemple éclair :</em> MnO₂/Mn²⁺, \(E^\circ = 1{,}23\ \text{V}\), \([\mathrm{Mn^{2+}}] = 1{,}0\times10^{-2}\) : \(E = 1{,}23 + 0{,}03\log\dfrac{[\mathrm{H^+}]^4}{[\mathrm{Mn^{2+}}]} = 1{,}29 - 0{,}12\,\text{pH}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire une frontière entre deux espèces qui ne sont pas voisines dans cet intervalle de pH (une troisième s'intercale), ou mélanger des conventions différentes.</div>

  <div class="method-box"><strong>Méthode 5 — Lire l'espèce présente dans un milieu donné</strong>
    <ol>
      <li>Placer le point (pH, \(E\)) ; calculer au besoin les frontières voisines à ce pH.</li>
      <li>Sans valeur de \(E\) : un milieu aéré est près de la frontière O₂/H₂O ; un milieu désaéré au contact d'un réducteur, bien plus bas.</li>
      <li>Lire l'espèce : majoritaire (dissoute) ou présente (solide).</li>
    </ol>
    <p><em>Exemple éclair :</em> fer, pH 3 et 0,5 V : la frontière Fe(OH)₃/Fe²⁺ est à \(1{,}13 - 0{,}54 = 0{,}59\ \text{V}\), donc Fe²⁺. Eau aérée à pH 7 (≈ 0,8 V) : Fe(OH)₃.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Prévoir la stabilité d'une espèce dans l'eau</strong>
    <ol>
      <li>Superposer les droites \(E = 1{,}23 - 0{,}06\,\text{pH}\) et \(E = -0{,}06\,\text{pH}\).</li>
      <li>Domaine au-dessus de O₂/H₂O : l'espèce oxyde l'eau (O₂ dégagé) ; au-dessous de H⁺/H₂ : elle la réduit (H₂ dégagé) ; recoupant la bande : stable dans la partie commune.</li>
      <li>Écrire la réaction prévue et nuancer par la cinétique (méthode 9).</li>
    </ol>
    <p><em>Exemple éclair :</em> zinc, frontière Zn²⁺/Zn à \(-0{,}76 + 0{,}03\log 10^{-2} = -0{,}82\ \text{V}\), alors que la frontière H⁺/H₂ va de 0 à −0,41 V entre pH 0 et pH 6,8 (domaine de Zn²⁺) : domaines disjoints, le zinc réduit les ions H⁺, Zn + 2 H⁺ = Zn²⁺ + H₂.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Prévoir une réaction par superposition de diagrammes</strong>
    <ol>
      <li>Superposer les deux diagrammes (mêmes conventions) ; au pH du milieu, repérer les domaines des deux espèces.</li>
      <li>Domaines disjoints : réaction thermodynamiquement favorisée ; domaines communs : compatibles.</li>
      <li>Écrire l'équation au pH considéré (avec les espèces de ce pH : Fe³⁺ ou Fe(OH)₃…) ; \(\log K^\circ = n\,\Delta E/0{,}06\) d'après l'écart entre les frontières.</li>
    </ol>
    <p><em>Exemple éclair :</em> à pH 1, Cu (au-dessous de 0,28 V) et Fe³⁺ (au-dessus de 0,77 V) sont disjoints : Cu + 2 Fe³⁺ = Cu²⁺ + 2 Fe²⁺, \(\log K^\circ = 2\times0{,}43/0{,}06 = 14{,}3\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Prévoir une dismutation ou une médiamutation selon le pH</strong>
    <ol>
      <li>Écrire, en fonction du pH, les deux frontières de l'espèce X de n.o. intermédiaire : X/Red (X oxydant) et Ox/X (X réducteur).</li>
      <li>X a un domaine tant que \(E(\mathrm{X/Red}) \lt E(\mathrm{Ox/X})\) ; là où l'inégalité s'inverse, X se dismute.</li>
      <li>Dans la zone où X a un domaine, Ox et Red, séparés par lui, se médiamutent en X.</li>
    </ol>
    <p><em>Exemple éclair :</em> dichlore avec [HClO] = [Cl⁻] = 1 mol·L⁻¹ et \(P(\mathrm{Cl_2}) = 1\ \text{bar}\) : \(E(\mathrm{Cl_2/Cl^-}) = 1{,}36\ \text{V}\), \(E(\mathrm{HClO/Cl_2}) = 1{,}63 - 0{,}06\,\text{pH}\) ; Cl₂ se dismute au-delà de \(\text{pH} = 0{,}27/0{,}06 = 4{,}5\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Confronter la prévision à l'expérience ; choisir le pH d'un protocole</strong>
    <ol>
      <li>Une réaction favorisée mais non observée est cinétiquement bloquée (permanganate et eau, aluminium passivé) ; une réaction observée est toujours favorisée.</li>
      <li>Pour un protocole (Winkler, dosage, traitement d'une eau), justifier chaque étape par les domaines au pH choisi : où l'oxydant et le réducteur visés sont-ils disjoints ?</li>
      <li>Faire le bilan électronique de la chaîne de réactions pour relier l'espèce dosée au réactif titrant.</li>
    </ol>
    <p><em>Exemple éclair :</em> Winkler sur 50,0 mL d'eau, thiosulfate à \(1{,}00\times10^{-2}\ \text{mol·L}^{-1}\), \(V_E = 6{,}0\ \text{mL}\) : \(n(\mathrm{O_2}) = 0{,}060/4 = 0{,}015\ \text{mmol}\), soit \(3{,}0\times10^{-4}\ \text{mol·L}^{-1}\) et 9,6 mg·L⁻¹.</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : confondre prédominance (espèce dissoute, minoritaire hors de son domaine) et existence (solide, absent hors de son domaine) ; oublier les conventions de tracé ; oublier \(1/n\) dans la pente ; lire « au-dessous de H⁺/H₂, H⁺ oxyde » au lieu de « l'espèce réduit l'eau » ; conclure qu'une réaction favorisée est rapide ; superposer deux diagrammes tracés avec des conventions différentes.</div>

  <h3>Déferriser une eau souterraine</h3>
  <div class="statement">Une eau souterraine, désaérée, de pH 6,5, contient 5,0 mg·L⁻¹ de fer sous forme Fe²⁺ (\(M(\mathrm{Fe}) = 55{,}85\ \text{g·mol}^{-1}\)). Pour l'en débarrasser, on l'aère, puis on la filtre. On utilise le diagramme du fer du cours (\(c_{\text{tr}}\) \(= 1{,}0\times10^{-2}\ \text{mol·L}^{-1}\) ; frontière Fe(OH)₃/Fe²⁺ : \(E = 1{,}13 - 0{,}18\,\text{pH}\)) ; pression partielle de O₂ dans l'air : 0,21 bar ; \(\text{p}K_s(\mathrm{Fe(OH)_3}) = 38\).</div>
  <div class="q"><strong>Q1.</strong> Dans l'eau désaérée, le fer(II) est-il bien dans son domaine ? Donner la frontière Fe(OH)₃/Fe²⁺ à pH 6,5.</div>
  <div class="q"><strong>Q2.</strong> Quel potentiel le dioxygène impose-t-il à pH 6,5 ? Que devient le fer ? Écrire l'équation de la réaction.</div>
  <div class="q"><strong>Q3.</strong> Quelle masse minimale de dioxygène faut-il dissoudre par litre ? Pourquoi le pH baisse-t-il légèrement pendant le traitement ?</div>
  <div class="q"><strong>Q4.</strong> Quelle concentration en Fe³⁺ reste dissoute après filtration, si le pH final est 7,0 ? Pourquoi ce procédé ne marcherait-il pas sur une eau à pH 2 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À pH 6,5 : \(E\) \(= 1{,}13 - 0{,}18\times6{,}5\) \(= -0{,}04\ \text{V}\). Une eau désaérée a un potentiel bas : Fe²⁺ y est stable (son domaine s'étend de −0,50 V à −0,04 V à ce pH). (Avec la concentration réelle, \(9\times10^{-5}\ \text{mol·L}^{-1}\), la frontière serait un peu plus haute, la conclusion ne change pas.)</p>
    <p><strong>Q2.</strong> \(E(\mathrm{O_2/H_2O})\) \(= 1{,}23 + 0{,}015\log 0{,}21 - 0{,}06\times6{,}5\) \(= 0{,}83\ \text{V}\), très au-dessus de −0,04 V : Fe²⁺ et O₂ ont des domaines disjoints, le fer est oxydé et précipite : 4 Fe²⁺ + O₂ + 10 H₂O = 4 Fe(OH)₃ + 8 H⁺.</p>
    <p><strong>Q3.</strong> \([\mathrm{Fe^{2+}}]\) \(= 5{,}0\times10^{-3}/55{,}85\) \(= 9{,}0\times10^{-5}\ \text{mol·L}^{-1}\) ; il faut \(n(\mathrm{O_2}) = n(\mathrm{Fe^{2+}})/4\), soit \(2{,}2\times10^{-5}\ \text{mol}\), 0,72 mg de O₂ par litre (une eau aérée en dissout environ 9 mg·L⁻¹ : l'aération suffit largement). La réaction libère deux H⁺ par Fe²⁺ : le pH diminue un peu.</p>
    <p><strong>Q4.</strong> \([\mathrm{Fe^{3+}}]\) \(= K_s/[\mathrm{HO^-}]^3\) \(= 10^{-38}/(10^{-7})^3\) \(= 10^{-17}\ \text{mol·L}^{-1}\) : rien ne reste dissous, tout le fer est retenu par le filtre. À pH 2, en revanche, on serait dans le domaine de Fe³⁺ dissous (frontière d'existence de Fe(OH)₃ à pH 2,0) : le fer serait oxydé (lentement) mais resterait en solution, et la filtration n'enlèverait rien.</p>
  </div>
</div>

  <div class="exo-part">Partie A — Lecture du diagramme</div>
  <div class="q"><strong>A1.</strong> Attribuer les domaines A, B, C et D aux quatre espèces, en justifiant.</div>
  <div class="q"><strong>A2.</strong> Identifier les droites a et b et donner leurs équations (gaz sous 1 bar).</div>
  <div class="exo-part">Partie B — Frontières</div>
  <div class="q"><strong>B1.</strong> Justifier la position de la frontière verticale B/D.</div>
  <div class="q"><strong>B2.</strong> Calculer la frontière A/B. En déduire les coordonnées du point commun aux domaines A, B et C.</div>
  <div class="q"><strong>B3.</strong> Déterminer les pentes des frontières B/C et C/D ; en déduire leurs équations par continuité.</div>
  <div class="exo-part">Partie C — Le cuivre(I)</div>
  <div class="q"><strong>C1.</strong> Montrer que l'ion Cu⁺ se dismute en solution ; calculer la constante de la réaction. Est-ce cohérent avec le diagramme ?</div>
  <div class="q"><strong>C2.</strong> À partir de quel pH le cuivre(I) a-t-il un domaine ? Sous quelle forme ? À pH 4, que donne un mélange de poudre de cuivre et d'ions Cu²⁺ ? Nommer cette réaction et écrire son équation.</div>
  <div class="exo-part">Partie D — Le cuivre face à l'eau, au dioxygène et au fer</div>
  <div class="q"><strong>D1.</strong> Le cuivre est-il attaqué par une solution acide désaérée ? par une eau aérée à pH 7 ? (Lire les espèces formées.)</div>
  <div class="q"><strong>D2.</strong> Cémentation : on récupère le cuivre d'une solution acide (pH 1) de Cu²⁺ à 0,050 mol·L⁻¹ en y plongeant des déchets de fer. Écrire la réaction, calculer sa constante, puis la masse minimale de fer à introduire pour traiter 1,0 m³ de solution et la masse de cuivre récupérée. Expliquer pourquoi la consommation réelle de fer est plus grande.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> N.o. : Cu (0), Cu₂O (+I), Cu²⁺ et Cu(OH)₂ (+II). Le domaine le plus bas, A, est celui du métal Cu. C, intermédiaire et seulement présent en milieu peu acide, est Cu₂O. En haut, deux espèces de n.o. +II séparées par une frontière verticale : B (à gauche, milieu acide) est Cu²⁺, D (à droite) est Cu(OH)₂.</p>
    <p><strong>A2.</strong> Ce sont les frontières de l'eau, parallèles et distantes de 1,23 V : a, O₂/H₂O, \(E = 1{,}23 - 0{,}06\,\text{pH}\) ; b, H⁺/H₂, \(E = -0{,}06\,\text{pH}\).</p>
    <p><strong>B1.</strong> Cu(OH)₂ apparaît quand \(c_{\text{tr}}[\mathrm{HO^-}]^2 = K_s\) : \([\mathrm{HO^-}]^2\) \(= 10^{-19{,}7}/10^{-2}\) \(= 10^{-17{,}7}\), pOH = 8,85, frontière à pH 5,15.</p>
    <p><strong>B2.</strong> Cu²⁺ + 2 e⁻ = Cu : \(E\) \(= 0{,}34 + 0{,}03\log 10^{-2}\) \(= 0{,}28\ \text{V}\). Elle coupe la frontière Cu₂O/Cu quand \(0{,}48 - 0{,}06\,\text{pH} = 0{,}28\), soit au point (pH 3,3 ; 0,28 V).</p>
    <p><strong>B3.</strong> B/C : 2 Cu²⁺ + H₂O + 2 e⁻ = Cu₂O + 2 H⁺, les H⁺ sont du côté du réducteur : pente \(+0{,}06\ \text{V}\) par unité de pH ; par le point (3,3 ; 0,28) : \(E = 0{,}08 + 0{,}06\,\text{pH}\), qui vaut 0,39 V à pH 5,15. C/D : 2 Cu(OH)₂ + 2 H⁺ + 2 e⁻ = Cu₂O + 3 H₂O, pente \(-0{,}06\) ; par (5,15 ; 0,39) : \(E = 0{,}70 - 0{,}06\,\text{pH}\).</p>
    <p><strong>C1.</strong> Cu⁺ est l'oxydant du couple Cu⁺/Cu (0,52 V) et le réducteur de Cu²⁺/Cu⁺ (0,16 V) ; \(0{,}52 \gt 0{,}16\) : 2 Cu⁺ = Cu²⁺ + Cu, \(\log K^\circ = (0{,}52 - 0{,}16)/0{,}06 = 6\). Cohérent : Cu⁺ n'a aucun domaine sur le diagramme, à aucun pH.</p>
    <p><strong>C2.</strong> Le cuivre(I) n'a de domaine, sous forme de Cu₂O solide, que pour pH \(\gt\) 3,3. À pH 4, Cu (au-dessous de \(0{,}48 - 0{,}24 = 0{,}24\ \text{V}\)) et Cu²⁺ (au-dessus de \(0{,}08 + 0{,}24 = 0{,}32\ \text{V}\)) ont des domaines séparés par celui de Cu₂O : médiamutation Cu + Cu²⁺ + H₂O = Cu₂O + 2 H⁺. En milieu plus acide (pH \(\lt\) 3,3), c'est au contraire Cu₂O qui se dismute en Cu et Cu²⁺.</p>
    <p><strong>D1.</strong> Acide désaéré : le domaine de Cu est au-dessus de la droite b, il recoupe la bande de l'eau : le cuivre n'est pas attaqué par H⁺. Eau aérée à pH 7 : la droite a (0,81 V) est au-dessus des frontières Cu₂O/Cu (0,06 V) et Cu(OH)₂/Cu₂O (0,28 V) : le cuivre est oxydé jusqu'au cuivre(II) solide (Cu(OH)₂ ; à l'air, la patine verte est en fait un hydroxycarbonate), lentement.</p>
    <p><strong>D2.</strong> Cu²⁺ + Fe = Cu + Fe²⁺, \(\log K^\circ\) \(= 2\times(0{,}34 + 0{,}44)/0{,}06\) \(= 26\) : totale. 1,0 m³ contient 50 mol de Cu²⁺ : il faut au moins 50 mol de fer, soit \(50\times55{,}85 = 2{,}8\ \text{kg}\), et l'on récupère \(50\times63{,}55 = 3{,}2\ \text{kg}\) de cuivre. À pH 1, le fer réduit aussi les ions H⁺ (Fe + 2 H⁺ = Fe²⁺ + H₂, \(\log K^\circ = 14{,}7\)) : cette réaction parasite, plus lente mais non négligeable, consomme du fer supplémentaire ; le fer et le dioxygène dissous réagissent aussi.</p>
  </div>
