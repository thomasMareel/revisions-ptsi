</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Rayon de courbure d'une parabole</h3>
  <div class="statement">On rappelle (cours de mathématiques) que le rayon de courbure d'une courbe d'équation \(y=f(x)\) vaut \(\rho=(1+f'^2)^{3/2}/|f''|\). Un point suit la trajectoire \(y=x^2/(2R_0)\), avec \(R_0=3{,}0\ \text{m}\). Il passe par l'origine avec la vitesse \(v=3{,}0\ \text{m·s}^{-1}\) et une accélération tangentielle \(\mathrm{d}v/\mathrm{d}t=1{,}0\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le rayon de courbure à l'origine.</div>
  <div class="q"><strong>Q2.</strong> Calculer les composantes de l'accélération dans le repère de Frenet en ce point, puis sa norme. Où pointe \(\vec N\) ?</div>
  <div class="q"><strong>Q3.</strong> Un projectile lancé sans frottement passe à son sommet \(S\) avec la vitesse horizontale \(v_x\). Montrer qu'au voisinage de \(S\), sa trajectoire est une parabole du type précédent, et en déduire le rayon de courbure en \(S\). Vérifier ce résultat directement avec le repère de Frenet.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f'(x)=x/R_0\), \(f''=1/R_0\). À l'origine \(f'=0\), donc \(\rho=R_0=3{,}0\ \text{m}\).</p>
    <p><strong>Q2.</strong> \(a_T=1{,}0\ \text{m·s}^{-2}\) et \(a_N=v^2/\rho=9{,}0/3{,}0=3{,}0\ \text{m·s}^{-2}\) ; \(\|\vec a\|=\sqrt{1+9}\approx3{,}2\ \text{m·s}^{-2}\). \(\vec N\) pointe vers la concavité, c'est-à-dire vers les \(y\) positifs (la parabole est tournée vers le haut).</p>
    <p><strong>Q3.</strong> Avec l'origine au sommet, \(x=v_xt\) et \(y=-\tfrac12gt^2\), donc \(y=-gx^2/(2v_x^2)\) : c'est la parabole précédente retournée, avec \(R_0=v_x^2/g\). D'où \(\rho_S=v_x^2/g\). Directement : en \(S\), \(\vec v\) est horizontale et \(\vec a=\vec g\) lui est perpendiculaire, donc \(a_T=0\), \(a_N=g=v_x^2/\rho_S\). Pour le lancer de poids du cours (\(v_x\approx9{,}96\ \text{m·s}^{-1}\)), \(\rho_S\approx10{,}1\ \text{m}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>La valve d'une roue de vélo : un mouvement, deux trajectoires</h3>
  <div class="statement">Un vélo roule en ligne droite à vitesse constante \(V=25\ \text{km/h}\) ; ses roues, de rayon \(R=0{,}34\ \text{m}\), roulent sans glisser, ce qui impose \(V=R\omega\), \(\omega\) étant la vitesse angulaire des roues. On suit la valve \(P\), fixée sur la jante, qui touche le sol à \(t=0\) en \(O\). Dans le référentiel terrestre : axe \(Ox\) horizontal dans le sens du mouvement, axe \(Oy\) vertical ascendant. On admet que \(x_P=Vt-R\sin\omega t\) et \(y_P=R-R\cos\omega t\).</div>
  <div class="q"><strong>Q1.</strong> Dans le référentiel du cadre du vélo, quelle est la trajectoire de la valve ? Sa vitesse ? Son accélération ?</div>
  <div class="q"><strong>Q2.</strong> Dans le référentiel terrestre, calculer \(\vec v_P\) et montrer que \(v_P=2V|\sin(\omega t/2)|\). Où la valve est-elle immobile ? Où va-t-elle le plus vite ?</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\vec a_P\) dans le référentiel terrestre. Montrer que sa norme est la même que dans le référentiel du vélo et qu'elle est dirigée vers le moyeu. Pourquoi les deux accélérations sont-elles égales ?</div>
  <div class="q"><strong>Q4.</strong> Combien le système {vélo + roues} a-t-il de degrés de liberté dans ce mouvement ?</div>
  <div class="q"><strong>Q5.</strong> Calculer le rayon de courbure de la trajectoire terrestre au point le plus haut. Comparer à \(R\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le cadre voit la roue tourner autour du moyeu : la valve décrit un cercle de rayon \(R\) à la vitesse \(R\omega=V\approx6{,}94\ \text{m·s}^{-1}\), mouvement circulaire uniforme. Son accélération est centripète, vers le moyeu, de norme \(R\omega^2=V^2/R\approx142\ \text{m·s}^{-2}\) (\(14\,g\)).</p>
    <p><strong>Q2.</strong> \(\dot x_P=V-R\omega\cos\omega t=V(1-\cos\omega t)\) et \(\dot y_P=R\omega\sin\omega t=V\sin\omega t\). Donc</p>
    <div class="formula">$$v_P^2=V^2\left[(1-\cos\omega t)^2+\sin^2\omega t\right]=2V^2(1-\cos\omega t)=4V^2\sin^2\frac{\omega t}{2}$$</div>
    <p> La valve est immobile quand elle touche le sol (\(\omega t=0\), \(2\pi\)…) : c'est le roulement sans glissement. Elle va le plus vite en haut (\(\omega t=\pi\)) : \(2V\approx13{,}9\ \text{m·s}^{-1}\). La trajectoire, une cycloïde, n'a rien à voir avec le cercle de Q1 : le mouvement est relatif.</p>
    <p><strong>Q3.</strong> \(\ddot x_P=R\omega^2\sin\omega t\), \(\ddot y_P=R\omega^2\cos\omega t\) : norme \(R\omega^2=V^2/R\), la même qu'en Q1. Le vecteur qui va de \(P\) au moyeu \((Vt,R)\) vaut \((R\sin\omega t,R\cos\omega t)\) : il est parallèle à \(\vec a_P\) et de même sens. Les deux référentiels sont en translation rectiligne uniforme l'un par rapport à l'autre (le vélo roule à vitesse constante) : les vitesses diffèrent de \(V\,\vec e_x\), constant, donc les accélérations sont égales.</p>
    <p><strong>Q4.</strong> La position du vélo \(x\) et l'angle de rotation des roues sont liés par le roulement sans glissement : un seul degré de liberté, la position \(x\) du vélo.</p>
    <p><strong>Q5.</strong> En haut, \(\vec v_P=2V\,\vec e_x\) et \(\vec a_P=-R\omega^2\,\vec e_y\), perpendiculaire à la vitesse : \(a_N=V^2/R\) et \(\rho=v_P^2/a_N=4V^2R/V^2=4R\approx1{,}36\ \text{m}\). La cycloïde est quatre fois moins courbée que la roue à son sommet.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le lancer du marteau</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>cinématique du point : mouvement circulaire non uniforme, accélération constante, repère de Frenet, exploitation d'une vidéo</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Le marteau d'athlétisme est une boule d'acier reliée à une poignée par un câble. L'athlète le fait tourner en pivotant sur lui-même, puis le lâche. On assimile la boule à un point \(M\) et l'on étudie son mouvement dans le référentiel terrestre, supposé galiléen. \(g=9{,}81\ \text{m·s}^{-2}\) ; frottements de l'air négligés.
  </div>
  <p class="exo-part">Partie A — Le dernier tour</p>
  <div class="statement">On modélise le dernier tour par un mouvement circulaire de rayon \(R=1{,}80\ \text{m}\), dans un plan horizontal, de centre fixe \(C\). Pendant ce tour, la vitesse passe de \(v_1=23{,}0\ \text{m·s}^{-1}\) à \(v_2=28{,}0\ \text{m·s}^{-1}\), avec une accélération angulaire \(\ddot\theta\) constante.</div>
  <div class="q"><strong>A1.</strong> Combien de degrés de liberté la boule a-t-elle dans ce modèle ? Quelles coordonnées choisir ? Écrire \(\vec v\) et \(\vec a\).</div>
  <div class="q"><strong>A2.</strong> Montrer que \(\dot\theta_2^2-\dot\theta_1^2=2\ddot\theta\,\Delta\theta\) et calculer \(\ddot\theta\), puis la durée du dernier tour.</div>
  <div class="q"><strong>A3.</strong> Calculer les composantes de l'accélération juste avant le lâcher. Quel angle fait-elle avec la vitesse ? Exprimer sa norme en multiples de \(g\).</div>
  <p class="exo-part">Partie B — Le vol</p>
  <div class="statement">La boule est lâchée à \(h=1{,}60\ \text{m}\) du sol, avec la vitesse \(v_0=28{,}0\ \text{m·s}^{-1}\) inclinée de \(\alpha=40^\circ\) au-dessus de l'horizontale. Origine au sol, à la verticale du point de lâcher.</div>
  <div class="q"><strong>B1.</strong> Juste après le lâcher, quelle est l'accélération de la boule ? Écrire les équations horaires et l'équation de la trajectoire.</div>
  <div class="q"><strong>B2.</strong> Calculer la durée du vol et la portée. Pourquoi la formule \(v_0^2\sin2\alpha/g\) n'est-elle pas applicable ? Quel écart introduirait-elle ?</div>
  <div class="q"><strong>B3.</strong> Calculer la hauteur maximale atteinte.</div>
  <div class="q"><strong>B4.</strong> Avec la même vitesse et la même hauteur de lâcher, un tableau de valeurs donne \(D=79{,}5\ \text{m}\) à 38°, \(81{,}2\ \text{m}\) à 42°, \(81{,}5\ \text{m}\) à 44° et 45°, \(81{,}4\ \text{m}\) à 46°. Commenter : l'athlète a-t-il intérêt à viser exactement 45° ?</div>
  <p class="exo-part">Partie C — Courbure de la trajectoire</p>
  <div class="q"><strong>C1.</strong> Calculer le rayon de courbure de la trajectoire juste après le lâcher et au sommet. Comparer au rayon de la trajectoire juste avant le lâcher. Que devient l'accélération au moment du lâcher ?</div>
  <p class="exo-part">Partie D — Analyse d'une vidéo du dernier tour</p>
  <div class="statement">Une caméra placée au-dessus du cercle filme le dernier tour à 100 images par seconde (\(\Delta t=0{,}010\ \text{s}\)). Le pointage donne l'angle \(\theta_k\) de la boule sur chaque image, arrondi au demi-degré. Sur les images 19, 20 et 21 : \(\theta_{19}=145{,}5^\circ\), \(\theta_{20}=153{,}5^\circ\), \(\theta_{21}=161{,}5^\circ\).</div>
  <div class="q"><strong>D1.</strong> Estimer \(\dot\theta\) et la vitesse de la boule à l'image 20.</div>
  <div class="q"><strong>D2.</strong> Que donne la différence seconde pour \(\ddot\theta\) à l'image 20 ? Sur l'ensemble des images, elle varie entre \(-87\) et \(+87\ \text{rad·s}^{-2}\). Expliquer, par un ordre de grandeur, pourquoi elle est inexploitable.</div>
  <div class="q"><strong>D3.</strong> Les angles (en radians) sont rangés dans un tableau numpy <span class="code-inline">theta</span>. Écrire une fonction Python qui renvoie le tableau des vitesses angulaires estimées par différence centrée, puis les lignes qui estiment \(\ddot\theta\) par un ajustement de \(\theta(t)\) (fonction <span class="code-inline">np.polyfit</span>). Sur l'enregistrement complet (41 images), cet ajustement donne \(\ddot\theta\approx6{,}31\ \text{rad·s}^{-2}\) : conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Sur un cercle fixe, un seul degré de liberté : l'angle \(\theta\). Coordonnées polaires de centre \(C\), \(r=R\) : \(\vec v=R\dot\theta\,\vec e_\theta\) et \(\vec a=-R\dot\theta^2\,\vec e_r+R\ddot\theta\,\vec e_\theta\).</p>
    <p><strong>A2.</strong> \(\ddot\theta\) constant : \(\dot\theta=\dot\theta_1+\ddot\theta\,t\) et \(\theta-\theta_1=\dot\theta_1t+\tfrac12\ddot\theta\,t^2\) ; en éliminant \(t\) (comme pour la relation sans le temps), \(\dot\theta_2^2-\dot\theta_1^2=2\ddot\theta\,\Delta\theta\). Avec \(\dot\theta_1=v_1/R\approx12{,}8\ \text{rad·s}^{-1}\), \(\dot\theta_2=v_2/R\approx15{,}6\ \text{rad·s}^{-1}\) et \(\Delta\theta=2\pi\) : \(\ddot\theta=(15{,}6^2-12{,}8^2)/(4\pi)\approx6{,}26\ \text{rad·s}^{-2}\). Durée : \((\dot\theta_2-\dot\theta_1)/\ddot\theta\approx0{,}44\ \text{s}\).</p>
    <p><strong>A3.</strong> Composante radiale (vers \(C\)) : \(R\dot\theta_2^2=v_2^2/R\approx436\ \text{m·s}^{-2}\) ; composante orthoradiale : \(R\ddot\theta\approx11{,}3\ \text{m·s}^{-2}\). L'angle avec la vitesse vérifie \(\tan\varphi=436/11{,}3\), soit \(\varphi\approx88{,}5^\circ\) : l'accélération est presque centripète. Sa norme vaut environ \(44\,g\) : le câble doit tirer très fort sur la boule (chapitre suivant).</p>
    <p><strong>B1.</strong> Libérée du câble et sans frottement, la boule n'est plus soumise qu'à la pesanteur : \(\vec a=\vec g\). Avec \(v_0\cos\alpha\approx21{,}4\ \text{m·s}^{-1}\) et \(v_0\sin\alpha\approx18{,}0\ \text{m·s}^{-1}\) : \(x=21{,}4\,t\), \(y=1{,}60+18{,}0\,t-4{,}905\,t^2\), et la trajectoire est \(y=1{,}60+x\tan\alpha-\dfrac{gx^2}{2v_0^2\cos^2\alpha}\).</p>
    <p><strong>B2.</strong> \(y=0\) : \(4{,}905\,t^2-18{,}0\,t-1{,}60=0\), racine positive \(T\approx3{,}76\ \text{s}\) ; portée \(21{,}4\times3{,}76\approx80{,}6\ \text{m}\). La formule \(v_0^2\sin2\alpha/g\approx78{,}7\ \text{m}\) suppose une arrivée à l'altitude du départ ; ici la boule descend 1,60 m de plus, ce qui ajoute près de 2 m, l'écart d'un podium.</p>
    <p><strong>B3.</strong> Sommet à \(t_S=v_0\sin\alpha/g\approx1{,}83\ \text{s}\), hauteur \(1{,}60+18{,}0^2/(2\times9{,}81)\approx18{,}1\ \text{m}\).</p>
    <p><strong>B4.</strong> La portée est maximale vers 44° (et non 45°, à cause de la hauteur de lâcher), mais elle varie très peu autour de son maximum : 81,5 m entre 44° et 45°, et encore 80,6 m à 40°. Une erreur de quelques degrés coûte moins d'un mètre, alors que 1 \(\text{m·s}^{-1}\) de vitesse en plus apporte environ 6 m (la portée varie comme \(v_0^2\)) : l'athlète cherche d'abord la vitesse.</p>
    <p><strong>C1.</strong> Après le lâcher, \(\vec a=\vec g\). Au départ, \(a_N=g\cos\alpha\) et \(\rho=v_0^2/(g\cos\alpha)\approx104\ \text{m}\) ; au sommet, \(\rho=(v_0\cos\alpha)^2/g\approx47\ \text{m}\). Juste avant le lâcher, la trajectoire était un cercle de rayon 1,80 m : la courbure chute brutalement, parce que l'accélération passe en un instant de \(436\ \text{m·s}^{-2}\) (vers le centre) à \(g\) (vers le bas), alors que la vitesse, elle, est continue (même vecteur juste avant et juste après).</p>
    <p><strong>D1.</strong> Différence centrée : \(\dot\theta_{20}\approx\dfrac{161{,}5^\circ-145{,}5^\circ}{2\times0{,}010\ \text{s}}=800^\circ\text{/s}\), soit \(14{,}0\ \text{rad·s}^{-1}\), et \(v=R\dot\theta\approx25{,}1\ \text{m·s}^{-1}\), cohérent avec une vitesse qui passe de 23 à 28 \(\text{m·s}^{-1}\) pendant le tour.</p>
    <p><strong>D2.</strong> Le numérateur vaut \(161{,}5^\circ-2\times153{,}5^\circ+145{,}5^\circ=0\) : la différence seconde est nulle ici, alors que \(\ddot\theta\approx6{,}3\ \text{rad·s}^{-2}\). L'arrondi au demi-degré introduit une erreur de \(\pm0{,}25^\circ\approx4\times10^{-3}\ \text{rad}\) sur chaque angle ; la différence seconde la divise par \(\Delta t^2=10^{-4}\ \text{s}^2\) et la multiplie jusqu'à 4 : environ \(170\ \text{rad·s}^{-2}\) d'erreur possible, trente fois la valeur cherchée. Sur \(\Delta t\), l'angle varie de \(\tfrac12\ddot\theta\,\Delta t^2\approx3\times10^{-4}\ \text{rad}\) seulement du fait de l'accélération angulaire, bien moins que l'arrondi.</p>
    <p><strong>D3.</strong></p>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="kw">def</span> vitesses_angulaires(theta, dt):
    <span class="str">"""Vitesse angulaire aux images 1 à n - 2 par différence centrée (theta en radians)."""</span>
    <span class="kw">return</span> (theta[2:] - theta[:-2]) / (2 * dt)

t = dt * np.arange(len(theta))
omega = vitesses_angulaires(theta, dt)
c2, c1, c0 = np.polyfit(t, theta, 2)      <span class="cmt"># theta ≈ c2 t² + c1 t + c0</span>
theta_pp = 2 * c2                           <span class="cmt"># accélération angulaire estimée</span></pre>
    <p>L'ajustement utilise les 41 images à la fois : les erreurs d'arrondi se compensent, et l'on obtient \(6{,}31\ \text{rad·s}^{-2}\), à 1 % de la valeur du modèle (6,26), ce qui valide l'hypothèse d'une accélération angulaire constante. Le coefficient \(c_1\approx12{,}8\ \text{rad·s}^{-1}\) redonne la vitesse angulaire au début du tour.</p>
  </div>
