<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 2.1 du programme de PTSI, « Description et paramétrage du mouvement d'un point » (premier semestre). Il fournit les outils de toute la mécanique : vecteurs position, vitesse et accélération, et les trois systèmes de coordonnées. Le chapitre suivant, « Principes de la dynamique », relie l'accélération aux forces ; les chapitres « Énergie mécanique », « Moment cinétique » et « Mouvement dans un champ central » réutilisent les coordonnées polaires. En sciences industrielles, le chapitre « Cinématique » étend ces notions au solide et aux mécanismes.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Espace et temps classiques</strong> : notion de référentiel, caractère relatif du mouvement, caractère absolu des distances et des intervalles de temps ; citer une situation où la description classique de l'espace ou du temps est prise en défaut (§1).</li>
        <li><strong>Vecteurs position, vitesse et accélération</strong> ; coordonnées cartésiennes : déplacement élémentaire et composantes (§2).</li>
        <li><strong>Coordonnées cylindriques</strong> (polaires dans le plan) : exprimer à partir d'un schéma le déplacement élémentaire, construire le trièdre local et en déduire géométriquement les composantes de la vitesse ; établir les composantes des vecteurs position, déplacement élémentaire, vitesse et accélération (§3).</li>
        <li><strong>Coordonnées sphériques</strong> : exprimer à partir d'un schéma le déplacement élémentaire et construire le trièdre local (les composantes de la vitesse et de l'accélération ne sont pas exigibles dans ce système) (§4).</li>
        <li><strong>Degrés de liberté</strong> : les identifier pour un mouvement ; choisir un système de coordonnées adapté au problème (§5).</li>
        <li><strong>Mouvement à vecteur accélération constant</strong> : exprimer la vitesse et la position en fonction du temps ; établir l'équation de la trajectoire en coordonnées cartésiennes (§6).</li>
        <li><strong>Mouvement circulaire uniforme et non uniforme</strong> : composantes de la position, de la vitesse et de l'accélération en coordonnées polaires planes (§7).</li>
        <li><strong>Trajectoire connue</strong> : situer qualitativement la direction de la vitesse et de l'accélération pour une trajectoire plane ; dans le repère de Frenet, exploiter les liens entre les composantes de l'accélération, la courbure de la trajectoire, la norme de la vitesse et sa variation temporelle (§8).</li>
        <li><strong>Enregistrement vidéo d'un mouvement</strong> : le réaliser et l'exploiter quantitativement (évolution temporelle des vecteurs vitesse et accélération) ; estimer une dérivée par un schéma numérique (§9).</li>
      </ul>
      <p>Hors programme de physique-chimie (regroupé en fin de chapitre) : la loi de composition des vitesses, étudiée en sciences industrielles, et l'expression de l'accélération en coordonnées sphériques.</p>

<div class="course-section">
  <div class="sec-num">§1 · ESPACE, TEMPS ET RÉFÉRENTIEL</div>
  <h2>Décrire un mouvement, c'est d'abord choisir un observateur</h2>
  <div class="intro">La cinématique décrit le mouvement sans s'occuper de ses causes. Avant tout calcul, il faut dire par rapport à quoi on décrit ce mouvement : une même balle est immobile pour le joueur qui la tient dans un train, et file à 300 km/h pour la vache qui regarde passer le train.</div>
  <div class="def-box">
    <strong>Référentiel.</strong> Un référentiel \(\mathcal R\) est un solide de référence (un ensemble de points dont les distances mutuelles restent fixes : le sol, un wagon, la Terre entière) muni d'une horloge. Pour calculer, on lui attache un <strong>repère</strong> : une origine \(O\) fixe dans \(\mathcal R\) et une base orthonormée directe dont les vecteurs sont fixes dans \(\mathcal R\). Un même référentiel admet une infinité de repères ; changer de repère ne change pas le mouvement, seulement son écriture.
  </div>
  <p>Le mouvement est <strong>relatif</strong> : la trajectoire (ensemble des positions successives) et la vitesse d'un point dépendent du référentiel. Dire « la balle est immobile » n'a de sens qu'en précisant « dans le référentiel du wagon ».</p>
  <div class="prop-box"><strong>Espace et temps de la mécanique classique.</strong> La distance entre deux points pris au même instant et la durée qui sépare deux événements sont les mêmes dans tous les référentiels : elles sont <strong>absolues</strong>. Le temps s'écoule de la même façon pour tous les observateurs ; une seule variable \(t\) suffit.</div>
  <div class="method-box">
    <strong>Exemple — une bille lâchée dans un TGV</strong>
    <p>Un passager lâche une bille d'une hauteur de 1,0 m dans un TGV qui roule en ligne droite à 300 km/h, à vitesse constante.</p>
    <ol>
      <li>Dans le référentiel du train, la bille tombe à la verticale ; la chute dure \(\sqrt{2h/g}=\sqrt{2\times1{,}0/9{,}81}\approx0{,}45\ \text{s}\).</li>
      <li>Dans le référentiel terrestre, la bille garde la vitesse horizontale du train, \(300/3{,}6\approx83\ \text{m·s}^{-1}\) : sa trajectoire est un arc de parabole, et elle avance de \(83\times0{,}45\approx38\ \text{m}\) pendant sa chute.</li>
      <li>Les deux observateurs mesurent la même durée de chute (0,45 s) et la même hauteur (1,0 m) : durées et distances sont absolues ; seules la trajectoire et la vitesse changent.</li>
    </ol>
  </div>
  <h3>Quand la description classique est prise en défaut</h3>
  <p>Ce cadre est une approximation, excellente tant que les vitesses restent petites devant la vitesse de la lumière \(c=3{,}00\times10^{8}\ \text{m·s}^{-1}\) : un TGV roule à \(3\times10^{-7}\,c\), la Terre tourne autour du Soleil à \(10^{-4}\,c\). Il cesse d'être valable pour des particules rapides, où la théorie de la relativité d'Einstein (hors programme) montre que les durées et les distances dépendent du référentiel.</p>
  <div class="method-box">
    <strong>Exemple — les muons qui ne devraient pas atteindre le sol</strong>
    <p>Les rayons cosmiques créent des muons vers 15 km d'altitude. Au repos, un muon vit en moyenne \(\tau_0=2{,}2\ \mu\text{s}\) ; ceux-ci descendent à \(v=0{,}998\,c\).</p>
    <ol>
      <li>Distance parcourue pendant \(\tau_0\) : \(v\tau_0=0{,}998\times3{,}00\times10^{8}\times2{,}2\times10^{-6}\approx660\ \text{m}\).</li>
      <li>Pour descendre de 15 km, il faut \(15\times10^{3}/v\approx50\ \mu\text{s}\), soit environ \(23\,\tau_0\) : en mécanique classique, une fraction \(e^{-23}\approx10^{-10}\) seulement survivrait.</li>
      <li>Or on détecte au sol environ un muon par centimètre carré et par minute. La relativité explique ce résultat : dans le référentiel terrestre, la durée de vie du muon est multipliée par \(1/\sqrt{1-v^2/c^2}\approx16\), soit environ \(35\ \mu\text{s}\) et 10 km parcourus. La durée de vie n'est pas la même dans le référentiel du muon et dans celui de la Terre : le temps n'est pas absolu.</li>
    </ol>
  </div>
  <p>Autre exemple : les horloges atomiques des satellites GPS avancent d'environ 38 μs par jour par rapport à celles du sol (effets de la vitesse et de la gravitation). Sans correction, l'erreur de positionnement grandirait d'environ \(c\times38\ \mu\text{s}\approx11\ \text{km}\) par jour.</p>
  <div class="notice"><strong>Erreur classique</strong> : confondre référentiel et repère. Le référentiel est l'observateur (le sol, le train) ; le repère est l'outil de calcul (une origine et trois axes fixes dans ce référentiel). Changer de repère ne change ni la trajectoire, ni la vitesse ; changer de référentiel les change.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · VECTEURS POSITION, VITESSE ET ACCÉLÉRATION</div>
  <h2>Coordonnées cartésiennes : une base fixe</h2>
  <div class="intro">Une fois le repère choisi, le mouvement d'un point est décrit par trois fonctions du temps. La vitesse et l'accélération s'obtiennent en dérivant, et les coordonnées cartésiennes rendent ce calcul immédiat, parce que leur base ne bouge pas.</div>
  <div class="def-box">
    <strong>Position, vitesse, accélération.</strong> Dans le repère \((O,\vec e_x,\vec e_y,\vec e_z)\) fixe dans \(\mathcal R\), le point \(M\) est repéré par son <strong>vecteur position</strong> \(\overrightarrow{OM}(t)=x(t)\,\vec e_x+y(t)\,\vec e_y+z(t)\,\vec e_z\) ; les fonctions \(x(t)\), \(y(t)\), \(z(t)\) sont les <strong>équations horaires</strong>. La <strong>vitesse</strong> et l'<strong>accélération</strong> de \(M\) dans \(\mathcal R\) sont
    <div class="formula" data-nom="Vitesse et accélération (définition)">$$\vec v(M/\mathcal R)=\left.\frac{\mathrm{d}\overrightarrow{OM}}{\mathrm{d}t}\right|_{\mathcal R}\qquad\vec a(M/\mathcal R)=\left.\frac{\mathrm{d}\vec v}{\mathrm{d}t}\right|_{\mathcal R}$$</div>
    La dérivée est prise <strong>dans \(\mathcal R\)</strong> : les vecteurs fixes dans \(\mathcal R\) ont une dérivée nulle. Unités : m, \(\text{m·s}^{-1}\), \(\text{m·s}^{-2}\).
  </div>
  <p>Les vecteurs \(\vec e_x\), \(\vec e_y\), \(\vec e_z\) étant fixes, on dérive simplement les composantes :</p>
  <div class="formula" data-nom="Vitesse et accélération en cartésiennes">$$\vec v=\dot x\,\vec e_x+\dot y\,\vec e_y+\dot z\,\vec e_z\qquad\vec a=\ddot x\,\vec e_x+\ddot y\,\vec e_y+\ddot z\,\vec e_z$$</div>
  <p>Le point indique la dérivée par rapport au temps : \(\dot x=\mathrm{d}x/\mathrm{d}t\), \(\ddot x=\mathrm{d}^2x/\mathrm{d}t^2\). Les composantes sont <strong>algébriques</strong> : \(\dot x\lt0\) signifie que \(M\) se déplace vers les \(x\) décroissants. Il faut donc toujours orienter les axes sur un schéma avant d'écrire un signe.</p>
  <h3>Déplacement élémentaire</h3>
  <p>Entre les instants \(t\) et \(t+\mathrm{d}t\), le point passe de \(M\) à un point \(M'\) infiniment voisin. Son <strong>déplacement élémentaire</strong> est</p>
  <div class="formula" data-nom="Déplacement élémentaire en cartésiennes">$$\mathrm{d}\overrightarrow{OM}=\overrightarrow{MM'}=\mathrm{d}x\,\vec e_x+\mathrm{d}y\,\vec e_y+\mathrm{d}z\,\vec e_z$$</div>
  <p>et la vitesse est \(\vec v=\mathrm{d}\overrightarrow{OM}/\mathrm{d}t\). Comme \(\overrightarrow{MM'}\) est porté par la corde, qui tend vers la tangente, <strong>la vitesse est tangente à la trajectoire</strong>. Sa norme est \(v=|\mathrm{d}s/\mathrm{d}t|\), où \(s\) est l'<strong>abscisse curviligne</strong>, la longueur parcourue le long de la trajectoire depuis une origine choisie.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Vitesses</th><th style="text-align:left">Accélérations</th></tr>
    <tr><td>marche : 1,4 \(\text{m·s}^{-1}\) (5 km/h)</td><td>démarrage d'une voiture (0 à 100 km/h en 10 s) : 2,8 \(\text{m·s}^{-2}\)</td></tr>
    <tr><td>voiture sur autoroute : 36 \(\text{m·s}^{-1}\) (130 km/h)</td><td>pesanteur : \(g=9{,}81\ \text{m·s}^{-2}\)</td></tr>
    <tr><td>son dans l'air : 340 \(\text{m·s}^{-1}\)</td><td>freinage d'urgence sur route sèche : 8 à 10 \(\text{m·s}^{-2}\)</td></tr>
    <tr><td>Terre autour du Soleil : 30 \(\text{km·s}^{-1}\)</td><td>pilote de chasse en virage serré : 8 à \(9\,g\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — un drone qui décolle</strong>
    <p>Un drone suit, en unités SI, \(x(t)=4{,}0\,t\), \(y(t)=0\), \(z(t)=0{,}50\,t^2\) (axe \(Oz\) vertical ascendant).</p>
    <ol>
      <li>Vitesse : \(\vec v=4{,}0\,\vec e_x+1{,}0\,t\,\vec e_z\). À \(t=3{,}0\ \text{s}\) : \(\vec v=4{,}0\,\vec e_x+3{,}0\,\vec e_z\), de norme \(\sqrt{4{,}0^2+3{,}0^2}=5{,}0\ \text{m·s}^{-1}\), inclinée de \(\arctan(3/4)\approx37^\circ\) au-dessus de l'horizontale.</li>
      <li>Accélération : \(\vec a=1{,}0\,\vec e_z\ \text{m·s}^{-2}\), constante et verticale, bien que la vitesse ne soit pas verticale.</li>
      <li>Trajectoire : on élimine le temps, \(t=x/4{,}0\), d'où \(z=x^2/32\) : un arc de parabole dans le plan \((Oxz)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que l'accélération est dirigée comme la vitesse. Elle mesure la <strong>variation</strong> de la vitesse : ici, la vitesse est oblique et l'accélération verticale. Autre piège : oublier de convertir les km/h en \(\text{m·s}^{-1}\) (diviser par 3,6) avant de calculer.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · COORDONNÉES CYLINDRIQUES ET POLAIRES</div>
  <h2>Une base locale qui tourne avec le point</h2>
  <div class="intro">Pour une rotation autour d'un axe (manège, rampe en spirale, satellite), les coordonnées cartésiennes mêlent sinus et cosinus. Les coordonnées cylindriques suivent la géométrie du mouvement ; en contrepartie, leur base dépend de la position du point, et il faut en tenir compte en dérivant.</div>
  <div class="def-box">
    <strong>Coordonnées cylindriques \((r,\theta,z)\).</strong> Soit \(H\) le projeté de \(M\) sur le plan \((Oxy)\). On pose \(r=OH\geq0\) (distance de \(M\) à l'axe \(Oz\)), \(\theta\) l'angle orienté de \(Ox\) vers \(OH\), et \(z\) la cote : \(x=r\cos\theta\), \(y=r\sin\theta\). Le <strong>trièdre local</strong> \((\vec e_r,\vec e_\theta,\vec e_z)\) est orthonormé direct :
    <div class="formula">$$\vec e_r=\cos\theta\,\vec e_x+\sin\theta\,\vec e_y\qquad\vec e_\theta=-\sin\theta\,\vec e_x+\cos\theta\,\vec e_y$$</div>
    \(\vec e_r\) est dirigé de l'axe vers \(M\), \(\vec e_\theta\) s'en déduit par une rotation de \(+90^\circ\) autour de \(\vec e_z\). Le vecteur position s'écrit
    <div class="formula" data-nom="Vecteur position en cylindriques">$$\overrightarrow{OM}=r\,\vec e_r+z\,\vec e_z$$</div>
    Dans le plan (\(z=0\)), ce sont les <strong>coordonnées polaires</strong> \((r,\theta)\), avec \(\overrightarrow{OM}=r\,\vec e_r\) et \(r=OM\).
  </div>

  <h3>Déplacement élémentaire, lu sur un schéma</h3>
  <p>On fait varier une seule coordonnée à la fois et l'on regarde où va le point. Si seul \(r\) varie de \(\mathrm{d}r\), \(M\) avance de \(\mathrm{d}r\) selon \(\vec e_r\). Si seul \(\theta\) varie de \(\mathrm{d}\theta\), \(M\) décrit un arc du cercle de rayon \(r\) d'axe \(Oz\) : il parcourt la longueur \(r\,\mathrm{d}\theta\) selon \(\vec e_\theta\). Si seul \(z\) varie, il monte de \(\mathrm{d}z\) selon \(\vec e_z\). Ces trois déplacements sont orthogonaux ; ils s'ajoutent :</p>
  <div class="formula" data-nom="Déplacement élémentaire en cylindriques">$$\mathrm{d}\overrightarrow{OM}=\mathrm{d}r\,\vec e_r+r\,\mathrm{d}\theta\,\vec e_\theta+\mathrm{d}z\,\vec e_z$$</div>

<figcaption>À gauche, la base polaire \((\vec e_r, \vec e_\theta)\) en deux points \(M_1\) et \(M_2\) : \(\vec e_r\) pointe de \(O\) vers le point, \(\vec e_\theta\) est tourné de 90° dans le sens des \(\theta\) croissants. Ces vecteurs dépendent de \(\theta\) : ils tournent quand le point se déplace. À droite, quand \(r\) varie de \(\mathrm{d}r\) et \(\theta\) de \(\mathrm{d}\theta\) (exagérés ici), le point se déplace de \(\mathrm{d}r\) selon \(\vec e_r\) et de \(r\,\mathrm{d}\theta\) (longueur de l'arc) selon \(\vec e_\theta\).</figcaption>
</figure>
  <p>En divisant par \(\mathrm{d}t\), on obtient la vitesse sans aucun calcul de dérivée :</p>
  <div class="formula" data-nom="Vitesse en cylindriques">$$\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+\dot z\,\vec e_z$$</div>
  <p>La composante \(\dot r\) est la vitesse <strong>radiale</strong> (le point s'éloigne de l'axe ou s'en rapproche), \(r\dot\theta\) la vitesse <strong>orthoradiale</strong> (il tourne autour de l'axe). \(\dot\theta\), en \(\text{rad·s}^{-1}\), est la vitesse angulaire.</p>
  <h3>Dériver une base mobile</h3>
  <div class="prop-box"><strong>Dérivées des vecteurs de base.</strong> \(\vec e_r\) et \(\vec e_\theta\) ne dépendent que de \(\theta\), et \(\vec e_z\) est fixe :
    <div class="formula" data-nom="Dérivées de la base polaire">$$\frac{\mathrm{d}\vec e_r}{\mathrm{d}t}=\dot\theta\,\vec e_\theta\qquad\frac{\mathrm{d}\vec e_\theta}{\mathrm{d}t}=-\dot\theta\,\vec e_r$$</div>
    Dériver un vecteur unitaire qui tourne revient à le tourner de \(+90^\circ\) et à le multiplier par la vitesse angulaire \(\dot\theta\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Dérivée de la base, puis accélération</span><div class="content">
    <p>Par composantes : \(\mathrm{d}\vec e_r/\mathrm{d}\theta=-\sin\theta\,\vec e_x+\cos\theta\,\vec e_y=\vec e_\theta\) et \(\mathrm{d}\vec e_\theta/\mathrm{d}\theta=-\cos\theta\,\vec e_x-\sin\theta\,\vec e_y=-\vec e_r\). La dérivée par rapport au temps s'obtient par dérivation composée : \(\mathrm{d}\vec e_r/\mathrm{d}t=\dot\theta\,\mathrm{d}\vec e_r/\mathrm{d}\theta=\dot\theta\,\vec e_\theta\), de même pour \(\vec e_\theta\).</p>
    <p>On retrouve la vitesse en dérivant \(\overrightarrow{OM}=r\,\vec e_r+z\,\vec e_z\) : \(\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+\dot z\,\vec e_z\). On dérive encore, produit par produit :</p>
    <div class="formula">$$\vec a=\ddot r\,\vec e_r+\dot r\dot\theta\,\vec e_\theta+\left(\dot r\dot\theta+r\ddot\theta\right)\vec e_\theta-r\dot\theta^2\,\vec e_r+\ddot z\,\vec e_z$$</div>
    <p>Le terme \(\dot r\dot\theta\,\vec e_\theta\) apparaît deux fois : une fois en dérivant \(\vec e_r\) dans \(\dot r\,\vec e_r\), une fois en dérivant \(r\) dans \(r\dot\theta\,\vec e_\theta\). En regroupant, on obtient la formule ci-dessous.</p>
  </div></div>
  <div class="formula" data-nom="Accélération en cylindriques">$$\vec a=\left(\ddot r-r\dot\theta^2\right)\vec e_r+\left(r\ddot\theta+2\dot r\dot\theta\right)\vec e_\theta+\ddot z\,\vec e_z$$</div>
  <p>Le terme \(-r\dot\theta^2\) est dirigé vers l'axe : c'est la contribution centripète de la rotation, présente même si \(r\) est constant. La composante orthoradiale s'écrit aussi \(\dfrac1r\dfrac{\mathrm{d}}{\mathrm{d}t}\left(r^2\dot\theta\right)\) : elle est nulle quand \(r^2\dot\theta\) se conserve, propriété centrale du chapitre « Mouvement dans un champ central ».</p>
  <div class="method-box">
    <strong>Exemple — descendre une rampe de parking en spirale</strong>
    <p>Une voiture descend à 18 km/h (\(5{,}0\ \text{m·s}^{-1}\)) une rampe hélicoïdale de rayon \(R=8{,}0\ \text{m}\), qui perd 3,0 m de hauteur par tour. En cylindriques d'axe celui de la rampe : \(r=R\), \(\theta=\omega t\) et \(z=z_0-\dfrac{3{,}0}{2\pi}\,\theta\).</p>
    <ol>
      <li>Vitesse : \(\dot r=0\), donc \(\vec v=R\omega\,\vec e_\theta-\dfrac{3{,}0\,\omega}{2\pi}\,\vec e_z\). Sa norme vaut \(\omega\sqrt{R^2+(3{,}0/2\pi)^2}=5{,}0\ \text{m·s}^{-1}\), d'où \(\omega\approx0{,}624\ \text{rad·s}^{-1}\) : un tour en \(2\pi/\omega\approx10\ \text{s}\).</li>
      <li>Composantes : \(R\omega\approx4{,}99\ \text{m·s}^{-1}\) et \(\dot z\approx-0{,}30\ \text{m·s}^{-1}\) ; la vitesse est inclinée de \(\arctan(0{,}30/4{,}99)\approx3{,}4^\circ\) sous l'horizontale (pente de 6 %).</li>
      <li>Accélération : \(\ddot r=0\), \(\ddot\theta=0\), \(\ddot z=0\), il reste \(\vec a=-R\omega^2\,\vec e_r\approx-3{,}1\ \text{m·s}^{-2}\,\vec e_r\). Elle est horizontale, dirigée vers l'axe de la rampe : c'est elle que les pneus doivent fournir.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\overrightarrow{OM}=r\,\vec e_r+\theta\,\vec e_\theta\). L'angle n'est pas une longueur, et le vecteur position n'a <strong>pas</strong> de composante sur \(\vec e_\theta\) : c'est \(\vec e_r\) lui-même qui contient l'information sur \(\theta\). Autre erreur : dériver \(r\,\vec e_r\) en \(\dot r\,\vec e_r\) en oubliant que \(\vec e_r\) tourne.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · COORDONNÉES SPHÉRIQUES</div>
  <h2>Repérer un point autour d'un centre</h2>
  <div class="intro">Autour d'un point privilégié (centre d'une planète, source ponctuelle, point de suspension d'un pendule qui tourne dans toutes les directions), les coordonnées sphériques sont naturelles. Le programme demande d'en connaître le trièdre local et le déplacement élémentaire ; on les retrouvera en 2ᵉ année en électromagnétisme.</div>
  <div class="def-box">
    <strong>Coordonnées sphériques \((r,\theta,\varphi)\).</strong> \(r=OM\geq0\) ; \(\theta\in[0,\pi]\) est l'angle entre \(Oz\) et \(OM\) (la <strong>colatitude</strong>) ; \(\varphi\in[0,2\pi[\) est l'angle orienté entre \(Ox\) et \(OH\), \(H\) étant le projeté de \(M\) sur le plan \((Oxy)\) (l'<strong>azimut</strong>). Alors \(OH=r\sin\theta\) et
    <div class="formula" data-nom="Coordonnées sphériques">$$x=r\sin\theta\cos\varphi\qquad y=r\sin\theta\sin\varphi\qquad z=r\cos\theta$$</div>
    Le trièdre local \((\vec e_r,\vec e_\theta,\vec e_\varphi)\) est orthonormé direct : \(\vec e_r\) dirigé selon \(\overrightarrow{OM}\), \(\vec e_\theta\) tangent au méridien (vers les \(\theta\) croissants), \(\vec e_\varphi\) tangent au parallèle (vers les \(\varphi\) croissants). Le vecteur position est simplement \(\overrightarrow{OM}=r\,\vec e_r\).
  </div>

<figcaption>Coordonnées sphériques : \(r = OM\), \(\theta\) (colatitude) est l'angle entre \(Oz\) et \(OM\), \(\varphi\) (azimut, ou longitude) l'angle entre \(Ox\) et \(OH\). Le trièdre local \((\vec e_r, \vec e_\theta, \vec e_\varphi)\) est orthonormé direct : \(\vec e_r\) selon \(\overrightarrow{OM}\), \(\vec e_\theta\) tangent au méridien (cercle tireté de centre \(O\)) vers les \(\theta\) croissants, \(\vec e_\varphi\) tangent au parallèle (cercle tireté horizontal, de rayon \(r\sin\theta\)).</figcaption>
</figure>
  <h3>Déplacement élémentaire</h3>
  <p>Même raisonnement qu'en cylindriques. Seul \(r\) varie : \(M\) avance de \(\mathrm{d}r\) selon \(\vec e_r\). Seul \(\theta\) varie : \(M\) parcourt le méridien, cercle de centre \(O\) et de rayon \(r\), sur la longueur \(r\,\mathrm{d}\theta\). Seul \(\varphi\) varie : \(M\) parcourt le parallèle, cercle d'axe \(Oz\) dont le rayon est la distance \(OH=r\sin\theta\) de \(M\) à l'axe, sur la longueur \(r\sin\theta\,\mathrm{d}\varphi\) :</p>
  <div class="formula" data-nom="Déplacement élémentaire en sphériques">$$\mathrm{d}\overrightarrow{OM}=\mathrm{d}r\,\vec e_r+r\,\mathrm{d}\theta\,\vec e_\theta+r\sin\theta\,\mathrm{d}\varphi\,\vec e_\varphi$$</div>
  <p>On en déduit, comme en cylindriques,</p>
  <div class="formula">$$\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+r\sin\theta\,\dot\varphi\,\vec e_\varphi$$</div>
  <p>Ce résultat n'est pas exigible, mais il se retrouve en dix secondes à partir du déplacement élémentaire. Le volume élémentaire \(\mathrm{d}\tau=r^2\sin\theta\,\mathrm{d}r\,\mathrm{d}\theta\,\mathrm{d}\varphi\), produit des trois côtés, servira en 2ᵉ année.</p>
  <p><strong>Sur la Terre</strong> (sphère de rayon \(R_T=6\,371\ \text{km}\), axe \(Oz\) vers le pôle Nord) : la longitude est \(\varphi\), et la latitude \(\lambda\) vaut \(90^\circ-\theta\). Un parallèle de latitude \(\lambda\) a pour rayon \(R_T\cos\lambda\).</p>
  <div class="method-box">
    <strong>Exemple — voler vers l'est ou vers le nord</strong>
    <ol>
      <li>Un avion vole le long du parallèle 45° N (\(\theta=45^\circ\)) sur 10° de longitude : il parcourt \(R_T\sin\theta\,\Delta\varphi=6\,371\times0{,}707\times0{,}1745\approx786\ \text{km}\).</li>
      <li>Le long d'un méridien, 10° de latitude valent \(R_T\,\Delta\theta=6\,371\times0{,}1745\approx1\,112\ \text{km}\) quelle que soit la latitude : un degré de méridien mesure 111 km.</li>
      <li>La Terre tourne sur elle-même en 23 h 56 min, soit \(\dot\varphi=\Omega=2\pi/86\,164\approx7{,}29\times10^{-5}\ \text{rad·s}^{-1}\) dans le référentiel géocentrique. Un point du sol à Paris (\(\lambda=48{,}85^\circ\), donc \(\theta=41{,}15^\circ\)) a la vitesse \(R_T\sin\theta\,\Omega\approx306\ \text{m·s}^{-1}\) selon \(\vec e_\varphi\), vers l'est ; à l'équateur, 465 \(\text{m·s}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(r\,\mathrm{d}\varphi\) pour la longueur parcourue quand \(\varphi\) varie. Le parallèle n'a pas pour rayon \(r\), mais \(r\sin\theta\) : près du pôle, un tour complet en \(\varphi\) ne fait que quelques mètres. Ne pas confondre non plus latitude (comptée depuis l'équateur) et colatitude \(\theta\) (comptée depuis le pôle).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DEGRÉS DE LIBERTÉ ET CHOIX DES COORDONNÉES</div>
  <h2>Combien de paramètres pour décrire le mouvement ?</h2>
  <div class="intro">Avant de mettre un problème en équations, on compte les paramètres qui suffisent à connaître la position. Ce nombre fixe le nombre d'équations du mouvement à trouver, et il guide le choix des coordonnées.</div>
  <div class="def-box">
    <strong>Degrés de liberté.</strong> Le nombre de degrés de liberté d'un point est le nombre de paramètres <strong>indépendants</strong> qu'il faut connaître à chaque instant pour connaître sa position. Un point libre dans l'espace en a trois. Chaque <strong>liaison</strong> (contrainte géométrique : rester sur un plan, sur un fil tendu, sur un rail) relie les coordonnées entre elles et retire un degré de liberté.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Situation</th><th style="text-align:left">Degrés de liberté</th><th style="text-align:left">Coordonnées adaptées</th></tr>
    <tr><td>ballon en vol, drone</td><td>3</td><td>cartésiennes</td></tr>
    <tr><td>palet glissant sur la glace</td><td>2</td><td>cartésiennes du plan \((x,y)\)</td></tr>
    <tr><td>wagonnet sur un rail rectiligne</td><td>1</td><td>abscisse \(x\)</td></tr>
    <tr><td>pendule simple (fil tendu, mouvement plan), nacelle d'une grande roue</td><td>1</td><td>polaires, \(r=\ell\) fixé : \(\theta\)</td></tr>
    <tr><td>voiture sur la rampe en spirale du §3</td><td>1</td><td>cylindriques, \(r=R\) et \(z\) lié à \(\theta\)</td></tr>
    <tr><td>planète autour du Soleil (mouvement plan)</td><td>2</td><td>polaires \((r,\theta)\)</td></tr>
    <tr><td>pendule sphérique, avion à altitude constante</td><td>2</td><td>sphériques, \(r\) fixé : \((\theta,\varphi)\)</td></tr>
  </table></div>
  <div class="prop-box"><strong>Choisir les coordonnées.</strong> On choisit le système dans lequel les liaisons s'écrivent « une coordonnée est constante » (\(r=R\) sur un cercle ou une sphère, \(z=0\) sur un plan) et qui épouse la symétrie du problème : un axe privilégié appelle les cylindriques, un centre les sphériques ; pour un mouvement rectiligne, ou à accélération constante, les cartésiennes, dont la base est fixe, sont les plus simples.</div>
  <div class="method-box">
    <strong>Exemple — une perle sur un cerceau tournant</strong>
    <p>Une perle glisse sur un cerceau de rayon \(R=0{,}20\ \text{m}\), qu'un moteur fait tourner autour de son diamètre vertical à \(\Omega=3{,}0\ \text{rad·s}^{-1}\).</p>
    <ol>
      <li>Sphériques de centre \(O\) (centre du cerceau), axe \(Oz\) vertical : la perle reste à \(r=R\), et \(\varphi=\Omega t\) est imposé par le moteur. Il reste <strong>un</strong> degré de liberté : l'angle \(\theta\) de la perle sur le cerceau.</li>
      <li>Déplacement élémentaire avec \(\mathrm{d}r=0\) et \(\mathrm{d}\varphi=\Omega\,\mathrm{d}t\) : \(\vec v=R\dot\theta\,\vec e_\theta+R\Omega\sin\theta\,\vec e_\varphi\).</li>
      <li>Si la perle reste immobile sur le cerceau en \(\theta=60^\circ\) : \(v=R\Omega\sin\theta=0{,}20\times3{,}0\times0{,}866\approx0{,}52\ \text{m·s}^{-1}\). Si au même endroit elle glisse avec \(\dot\theta=2{,}0\ \text{rad·s}^{-1}\) : \(v=R\sqrt{\dot\theta^2+\Omega^2\sin^2\theta}\approx0{,}66\ \text{m·s}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : compter les coordonnées au lieu des paramètres indépendants. Sur la rampe en spirale, \(r\), \(\theta\) et \(z\) varient, mais \(r\) est fixé et \(z\) se déduit de \(\theta\) : un seul degré de liberté. De même, une rotation imposée par un moteur (\(\varphi=\Omega t\)) n'ajoute pas de degré de liberté. En sciences industrielles, la même notion sert à caractériser les liaisons entre solides (chapitre « Liaisons, graphe et schéma cinématique »), un solide libre en ayant six.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MOUVEMENT À VECTEUR ACCÉLÉRATION CONSTANT</div>
  <h2>Intégrer deux fois : vitesse affine, trajectoire parabolique</h2>
  <div class="intro">C'est le mouvement d'un objet lancé dans le champ de pesanteur quand les frottements sont négligeables, d'une voiture qui freine régulièrement, ou d'une particule chargée dans un champ électrique uniforme (chapitre « Particules chargées »). La cinématique suffit pour tout en déduire.</div>
  <div class="prop-box">
    <strong>Mouvement à vecteur accélération constant \(\vec a_0\).</strong> Avec la vitesse \(\vec v_0\) et la position \(M_0\) à \(t=0\), deux intégrations donnent
    <div class="formula" data-nom="Mouvement à accélération constante">$$\vec v(t)=\vec a_0\,t+\vec v_0\qquad\overrightarrow{OM}(t)=\tfrac12\,\vec a_0\,t^2+\vec v_0\,t+\overrightarrow{OM_0}$$</div>
    Le mouvement a lieu dans le plan passant par \(M_0\) et contenant \(\vec v_0\) et \(\vec a_0\). Il est <strong>rectiligne</strong> si \(\vec v_0\) est nul ou parallèle à \(\vec a_0\), <strong>parabolique</strong> sinon.
  </div>
  <p>Une relation sans le temps est souvent utile. Comme \(\mathrm{d}(v^2)/\mathrm{d}t=2\,\vec v\cdot\vec a_0\), en intégrant :</p>
  <div class="formula" data-nom="Relation indépendante du temps">$$v^2-v_0^2=2\,\vec a_0\cdot\left(\overrightarrow{OM}-\overrightarrow{OM_0}\right)$$</div>
  <div class="method-box">
    <strong>Exemple — distance de freinage</strong>
    <p>Une voiture roule à 90 km/h (\(25\ \text{m·s}^{-1}\)) et freine avec une décélération constante de \(8{,}0\ \text{m·s}^{-2}\). Mouvement rectiligne, axe \(Ox\) dans le sens du mouvement, \(a=-8{,}0\ \text{m·s}^{-2}\).</p>
    <ol>
      <li>Distance d'arrêt (\(v=0\)) : \(0-v_0^2=2a\,\Delta x\), soit \(\Delta x=v_0^2/(2\times8{,}0)=625/16\approx39\ \text{m}\).</li>
      <li>Durée du freinage : \(0=v_0+at\), soit \(t=25/8{,}0\approx3{,}1\ \text{s}\).</li>
      <li>À 130 km/h (\(36\ \text{m·s}^{-1}\)), la distance passe à 81 m : elle varie comme le <strong>carré</strong> de la vitesse.</li>
    </ol>
  </div>
  <h3>Tir dans le champ de pesanteur</h3>
  <p>Axe \(Ox\) horizontal, axe \(Oy\) vertical <strong>ascendant</strong>, origine au point de lancement, \(\vec a_0=\vec g=-g\,\vec e_y\), vitesse initiale \(v_0\) faisant l'angle \(\alpha\) avec l'horizontale. En projection :</p>
  <div class="formula">$$x(t)=v_0\cos\alpha\;t\qquad y(t)=v_0\sin\alpha\;t-\tfrac12\,g\,t^2$$</div>
  <p>Le mouvement horizontal est uniforme, le mouvement vertical uniformément accéléré. En éliminant \(t=x/(v_0\cos\alpha)\), on obtient la <strong>trajectoire</strong> :</p>
  <div class="formula" data-nom="Trajectoire parabolique">$$y=x\tan\alpha-\frac{g\,x^2}{2v_0^2\cos^2\alpha}$$</div>
  <p>Le sommet est atteint quand la vitesse verticale s'annule, à \(t_S=v_0\sin\alpha/g\) : la <strong>flèche</strong> vaut \(H=\dfrac{v_0^2\sin^2\alpha}{2g}\). Le point revient à l'altitude de départ (\(y=0\)) à \(2t_S\) ; la <strong>portée</strong> est alors</p>
  <div class="formula" data-nom="Portée (même altitude)">$$D=\frac{v_0^2\sin2\alpha}{g}$$</div>
  <p>maximale pour \(\alpha=45^\circ\) ; deux angles complémentaires donnent la même portée, puisque \(\sin2\alpha=\sin(180^\circ-2\alpha)\).</p>

  <div class="method-box">
    <strong>Exemple — un lancer de poids</strong>
    <p>Le poids quitte la main à \(h=2{,}1\ \text{m}\) du sol, à \(v_0=13{,}0\ \text{m·s}^{-1}\), sous \(\alpha=40^\circ\) ; \(g=9{,}81\ \text{m·s}^{-2}\), frottements négligés. Origine au sol, à l'aplomb du point de lancement.</p>
    <ol>
      <li>Composantes initiales : \(v_0\cos\alpha\approx9{,}96\ \text{m·s}^{-1}\), \(v_0\sin\alpha\approx8{,}36\ \text{m·s}^{-1}\). Équations : \(x=9{,}96\,t\), \(y=2{,}1+8{,}36\,t-4{,}905\,t^2\).</li>
      <li>Arrivée au sol : \(4{,}905\,t^2-8{,}36\,t-2{,}1=0\), dont la racine positive est \(t\approx1{,}93\ \text{s}\) ; la portée vaut \(9{,}96\times1{,}93\approx19{,}2\ \text{m}\). La formule \(D=v_0^2\sin2\alpha/g\) donnerait 17,0 m : elle ne s'applique pas, puisque le poids atterrit 2,1 m plus bas qu'il n'est parti.</li>
      <li>Sommet à \(t_S\approx0{,}85\ \text{s}\), à \(2{,}1+8{,}36^2/(2\times9{,}81)\approx5{,}7\ \text{m}\) du sol.</li>
      <li>Vitesse à l'arrivée par la relation sans le temps : \(v^2=v_0^2+2gh\), d'où \(v\approx14{,}5\ \text{m·s}^{-1}\), inclinée de 47° sous l'horizontale.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : utiliser \(D=v_0^2\sin2\alpha/g\) quand l'arrivée n'est pas à l'altitude du départ, ou appliquer ces résultats à un objet freiné par l'air (un ballon, un volant de badminton) : ils ne valent que sans frottement. Autre piège : le signe de \(g\) dépend de l'orientation de l'axe vertical ; toujours le dessiner.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · MOUVEMENT CIRCULAIRE</div>
  <h2>Uniforme ou non, l'accélération pointe vers l'intérieur</h2>
  <div class="intro">Nacelle de manège, point d'une roue, satellite en orbite circulaire, électron dans un champ magnétique : le mouvement circulaire est partout. Les coordonnées polaires centrées sur le cercle le décrivent avec une seule variable, l'angle \(\theta\).</div>
  <div class="prop-box">
    <strong>Mouvement circulaire de rayon \(R\).</strong> En polaires de centre le centre du cercle, \(r=R\) est constant (\(\dot r=\ddot r=0\)) :
    <div class="formula" data-nom="Mouvement circulaire">$$\overrightarrow{OM}=R\,\vec e_r\qquad\vec v=R\dot\theta\,\vec e_\theta\qquad\vec a=-R\dot\theta^2\,\vec e_r+R\ddot\theta\,\vec e_\theta$$</div>
    La vitesse est orthoradiale, de norme \(v=R|\dot\theta|\). L'accélération a une composante radiale \(-R\dot\theta^2=-v^2/R\), toujours dirigée vers le centre, et une composante orthoradiale \(R\ddot\theta\), non nulle seulement si la rotation accélère ou ralentit.
  </div>
  <p><strong>Uniforme</strong> : \(\dot\theta=\omega\) constant, l'accélération est purement <strong>centripète</strong>, \(\vec a=-R\omega^2\,\vec e_r\), de norme \(R\omega^2=v^2/R\). La période vaut \(T=2\pi/\omega=2\pi R/v\) et la fréquence \(f=1/T\). Une vitesse de rotation donnée en tours par minute se convertit par \(\omega=2\pi N/60\).</p>
  <p><strong>Non uniforme</strong> : la composante orthoradiale \(R\ddot\theta\) est la dérivée de \(R\dot\theta\) ; quand \(\dot\theta\gt0\), c'est \(\mathrm{d}v/\mathrm{d}t\). L'accélération penche vers l'avant quand le point accélère, vers l'arrière quand il ralentit, mais reste toujours tournée vers l'intérieur du cercle.</p>

  <div class="method-box">
    <strong>Exemple — une centrifugeuse de laboratoire</strong>
    <p>Les tubes sont à \(r=8{,}0\ \text{cm}\) de l'axe ; la vitesse de régime est de 12 000 tr/min, atteinte en 20 s avec une accélération angulaire constante.</p>
    <ol>
      <li>En régime : \(\omega=2\pi\times12\,000/60\approx1\,257\ \text{rad·s}^{-1}\), \(v=r\omega\approx101\ \text{m·s}^{-1}\) et \(a=r\omega^2\approx1{,}26\times10^{5}\ \text{m·s}^{-2}\), soit environ \(12\,900\,g\).</li>
      <li>Au démarrage : \(\ddot\theta=1\,257/20\approx62{,}8\ \text{rad·s}^{-2}\), d'où une composante orthoradiale \(r\ddot\theta\approx5{,}0\ \text{m·s}^{-2}\).</li>
      <li>À \(t=1\ \text{s}\) déjà, \(\dot\theta=62{,}8\ \text{rad·s}^{-1}\) et la composante centripète vaut \(r\dot\theta^2\approx316\ \text{m·s}^{-2}\) : l'accélération est presque radiale (89° avec la vitesse). Le rotor a fait \(\tfrac12\ddot\theta\,t^2/(2\pi)=2\,000\) tours pendant le démarrage.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : parler d'accélération « centrifuge ». Dans le référentiel du sol, l'accélération d'un point en mouvement circulaire est dirigée vers le <strong>centre</strong> ; l'impression d'être poussé vers l'extérieur, dans une voiture qui tourne, est celle d'un passager dont le corps tend à continuer tout droit. Autre piège : un mouvement circulaire <strong>uniforme</strong> est accéléré (\(\vec a\neq\vec 0\)), car la direction de la vitesse change.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · REPÈRE DE FRENET</div>
  <h2>Lire l'accélération sur la forme de la trajectoire</h2>
  <div class="intro">Quand la trajectoire est connue (une route, un rail, une piste de bobsleigh), on la décrit point par point avec une base attachée à la courbe. Le repère de Frenet sépare ce qui change la norme de la vitesse et ce qui change sa direction ; le programme se limite aux trajectoires planes.</div>
  <div class="def-box">
    <strong>Repère de Frenet.</strong> En un point \(M\) d'une trajectoire plane orientée, \(\vec T\) est le vecteur unitaire tangent, dans le sens d'orientation, et \(\vec N\) le vecteur unitaire normal, dirigé vers la concavité de la courbe. Le <strong>cercle osculateur</strong> est le cercle qui épouse au mieux la courbe en \(M\) : son centre \(C\) est sur la normale, du côté de \(\vec N\), son rayon \(\rho\) est le <strong>rayon de courbure</strong> et \(1/\rho\) la <strong>courbure</strong>. Une droite a une courbure nulle ; un cercle de rayon \(R\) a \(\rho=R\) partout.
  </div>
  <div class="prop-box">
    <strong>Vitesse et accélération dans le repère de Frenet.</strong> Avec \(v=\mathrm{d}s/\mathrm{d}t\) (vitesse algébrique le long de la courbe) :
    <div class="formula" data-nom="Vitesse et accélération dans le repère de Frenet">$$\vec v=v\,\vec T\qquad\vec a=\frac{\mathrm{d}v}{\mathrm{d}t}\,\vec T+\frac{v^2}{\rho}\,\vec N$$</div>
    La composante <strong>tangentielle</strong> \(\mathrm{d}v/\mathrm{d}t\) fait varier la norme de la vitesse ; la composante <strong>normale</strong> \(v^2/\rho\geq0\) en fait tourner la direction.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">D'où vient le terme v²/ρ ?</span><span class="prompt">Dériver un vecteur tangent qui tourne</span><div class="content">
    <p>Notons \(\psi\) l'angle entre une direction fixe et \(\vec T\). Comme pour la base polaire, \(\mathrm{d}\vec T/\mathrm{d}t=\dot\psi\,\vec N'\), où \(\vec N'\) est \(\vec T\) tourné de \(+90^\circ\). Sur un petit arc, la courbe se confond avec son cercle osculateur : parcourir \(\mathrm{d}s\) fait tourner la tangente de \(\mathrm{d}\psi=\mathrm{d}s/\rho\), du côté de la concavité. Donc \(\mathrm{d}\vec T/\mathrm{d}t=(v/\rho)\,\vec N\), et en dérivant \(\vec v=v\,\vec T\) : \(\vec a=\dot v\,\vec T+v\,\mathrm{d}\vec T/\mathrm{d}t=\dot v\,\vec T+(v^2/\rho)\,\vec N\). Pour un cercle (\(\rho=R\)), on retrouve les composantes du §7.</p>
  </div></div>

<figcaption>Repère de Frenet \((\vec T, \vec N)\) le long d'une trajectoire plane parcourue de gauche à droite : \(\vec T\) tangent dans le sens du mouvement, \(\vec N\) vers la concavité. En \(P_1\), le cercle osculateur (centre \(C_1\), rayon de courbure \(\rho\)) épouse la courbe ; le point accélère, \(\vec a\) penche vers l'avant. En \(P_2\) (inflexion), la courbure est nulle : \(\vec a\) est tangent. En \(P_3\), le point freine : \(\vec a\) penche vers l'arrière. L'accélération pointe toujours du côté de la concavité (ou est tangente).</figcaption>
</figure>
  <div class="prop-box"><strong>Lecture qualitative, trajectoire plane.</strong> La vitesse est tangente à la trajectoire. L'accélération pointe toujours du côté de la concavité (sa composante normale \(v^2/\rho\) est positive), sauf en un point d'inflexion ou sur une portion rectiligne, où elle est tangente. Elle penche vers l'avant (\(\vec a\cdot\vec v\gt0\)) quand le point accélère, vers l'arrière (\(\vec a\cdot\vec v\lt0\)) quand il ralentit, et elle est perpendiculaire à la vitesse si la norme de celle-ci est constante.</div>
  <p>Inversement, la courbure se lit sur la vitesse et l'accélération : la composante normale vaut \(\|\vec v\wedge\vec a\|/v\), d'où \(\rho=v^3/\|\vec v\wedge\vec a\|\).</p>
  <div class="method-box">
    <strong>Exemple — freiner dans un virage</strong>
    <ol>
      <li>Une voiture aborde à 90 km/h (\(25\ \text{m·s}^{-1}\)) un virage de rayon de courbure \(\rho=200\ \text{m}\), en freinant à \(2{,}0\ \text{m·s}^{-2}\). Composantes : \(a_T=\mathrm{d}v/\mathrm{d}t=-2{,}0\ \text{m·s}^{-2}\), \(a_N=v^2/\rho=625/200\approx3{,}1\ \text{m·s}^{-2}\).</li>
      <li>Norme : \(\sqrt{2{,}0^2+3{,}1^2}\approx3{,}7\ \text{m·s}^{-2}\). L'accélération fait avec la vitesse un angle de \(180^\circ-\arctan(3{,}1/2{,}0)\approx123^\circ\) : elle pointe vers l'intérieur du virage et vers l'arrière. Les pneus doivent la fournir, ce qui explique qu'on ne freine pas fort en virage.</li>
      <li>Au sommet de la trajectoire du lancer de poids du §6, la vitesse est horizontale (\(9{,}96\ \text{m·s}^{-1}\)) et l'accélération \(\vec g\) lui est perpendiculaire : \(a_N=g\), donc \(\rho=v^2/g\approx10{,}1\ \text{m}\). Au lancer, \(a_N=g\cos\alpha\) et \(\rho=v_0^2/(g\cos\alpha)\approx22\ \text{m}\) : la parabole est plus courbée au sommet.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(\mathrm{d}v/\mathrm{d}t\), dérivée de la <strong>norme</strong> de la vitesse, et \(\|\mathrm{d}\vec v/\mathrm{d}t\|\), norme de l'accélération. En virage à vitesse constante, la première est nulle, la seconde vaut \(v^2/\rho\). Autre erreur : prendre \(\vec N\) vers l'extérieur du virage ; il pointe vers le centre de courbure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · MESURER VITESSE ET ACCÉLÉRATION</div>
  <h2>De l'enregistrement vidéo au calcul numérique</h2>
  <div class="intro">Au laboratoire, on filme le mouvement, puis un logiciel de pointage fournit les positions \((x_k,y_k)\) aux instants \(t_k=k\,\Delta t\) (\(\Delta t\) : durée entre deux images). Vitesse et accélération ne sont pas mesurées : on les estime en dérivant numériquement. Le chapitre d'informatique « Méthodes numériques » (§5) étudie ces schémas pour eux-mêmes.</div>
  <div class="prop-box">
    <strong>Dérivées centrées.</strong> On estime la vitesse et l'accélération à l'instant \(t_k\) par
    <div class="formula" data-nom="Dérivées numériques centrées">$$v_x(t_k)\approx\frac{x_{k+1}-x_{k-1}}{2\,\Delta t}\qquad a_x(t_k)\approx\frac{x_{k+1}-2x_k+x_{k-1}}{\Delta t^2}$$</div>
    et de même pour \(y\). Géométriquement, \(\vec v_k\) est parallèle à la corde \(M_{k-1}M_{k+1}\). La différence centrée est plus précise que la différence avant \((x_{k+1}-x_k)/\Delta t\), qui estime en réalité la vitesse à l'instant \(t_k+\Delta t/2\).
  </div>
  <p>Programme Python (bibliothèque numpy), pour une balle lancée filmée à 25 images par seconde :</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

dt = 0.04                                   <span class="cmt"># durée entre deux images (s)</span>
x = np.array([0.0, 0.079, 0.162, 0.239, 0.320, 0.401, 0.478, 0.561, 0.640])   <span class="cmt"># m</span>
y = np.array([0.0, 0.113, 0.207, 0.290, 0.354, 0.403, 0.439, 0.454, 0.458])   <span class="cmt"># m</span>

<span class="cmt"># vitesse à l'image k (k = 1 à 7) : différence centrée entre les images k - 1 et k + 1</span>
vx = (x[2:] - x[:-2]) / (2 * dt)
vy = (y[2:] - y[:-2]) / (2 * dt)
<span class="cmt"># accélération à l'image k : différence seconde</span>
ay = (y[2:] - 2 * y[1:-1] + y[:-2]) / dt**2

<span class="cmt"># ajustement de y(t) par un polynôme de degré 2 : y ≈ c2 t² + c1 t + c0</span>
t = dt * np.arange(len(y))
c2, c1, c0 = np.polyfit(t, y, 2)
print(2 * c2)                               <span class="cmt"># accélération verticale estimée</span></pre>
  <p>Les tranches <span class="code-inline">x[2:]</span> et <span class="code-inline">x[:-2]</span> décalent le tableau de deux images : la soustraction calcule d'un coup toutes les différences centrées.</p>

  <div class="method-box">
    <strong>Exemple — ce que donne le programme</strong>
    <ol>
      <li>\(v_x\) vaut \(2{,}00\pm0{,}03\ \text{m·s}^{-1}\) à toutes les images : le mouvement horizontal est uniforme. \(v_y\) décroît régulièrement de \(2{,}59\) à \(0{,}24\ \text{m·s}^{-1}\) ; les valeurs ne s'écartent que de \(0{,}03\ \text{m·s}^{-1}\) au plus de celles du mouvement réel.</li>
      <li>L'accélération image par image varie de \(-6{,}9\) à \(-13{,}1\ \text{m·s}^{-2}\) ! Une erreur de pointage \(\delta y=1\ \text{mm}\) fausse \(v_y\) d'environ \(\delta y/\Delta t=0{,}025\ \text{m·s}^{-1}\), mais \(a_y\) d'environ \(4\,\delta y/\Delta t^2=2{,}5\ \text{m·s}^{-2}\).</li>
      <li>L'ajustement parabolique, qui utilise toutes les images à la fois, donne \(2c_2\approx-9{,}79\ \text{m·s}^{-2}\) : on retrouve \(-g\) à 0,2 % près. C'est une régression (chapitre « Mesures et incertitudes », §9), ici par un polynôme de degré 2.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : filmer plus vite pour « gagner en précision ». À 100 images par seconde, la même erreur de 1 mm donnerait \(4\,\delta y/\Delta t^2=40\ \text{m·s}^{-2}\) d'erreur sur l'accélération : diviser \(\Delta t\) par 4 multiplie par 16 l'effet du bruit. On choisit \(\Delta t\) petit devant la durée du mouvement, mais pas davantage, et l'on préfère ajuster un modèle sur de nombreux points. Côté protocole : caméra perpendiculaire au plan du mouvement, étalon de longueur placé dans ce plan, temps de pose court.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Changer de référentiel ; accélération en sphériques</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en physique-chimie. Le premier est au programme de sciences industrielles.</div>
  <h3>Composition des vitesses (vue en sciences industrielles)</h3>
  <p>Si le référentiel \(\mathcal R_1\) est en mouvement par rapport à \(\mathcal R_0\), la vitesse d'un point \(M\) dans \(\mathcal R_0\) est la somme de sa vitesse dans \(\mathcal R_1\) (vitesse relative) et de la vitesse d'entraînement, vitesse par rapport à \(\mathcal R_0\) du point fixe de \(\mathcal R_1\) qui coïncide avec \(M\) à cet instant :</p>
  <div class="formula">$$\vec v(M/\mathcal R_0)=\vec v(M/\mathcal R_1)+\vec v(O_1/\mathcal R_0)+\vec\Omega(\mathcal R_1/\mathcal R_0)\wedge\overrightarrow{O_1M}$$</div>
  <p>Si \(\mathcal R_1\) est en translation (\(\vec\Omega=\vec 0\)), la vitesse d'entraînement est la même partout : c'est le cas de la bille du TGV au §1, dont la vitesse au sol est sa vitesse dans le train plus celle du train. Le chapitre de SI « Cinématique » (§5) traite le cas général, avec les torseurs cinématiques. En physique, le programme de PTSI se limite au mouvement relatif de deux référentiels galiléens, en translation rectiligne uniforme l'un par rapport à l'autre (chapitre « Principes de la dynamique », §2).</p>
  <h3>Accélération en coordonnées sphériques</h3>
  <p>La vitesse en sphériques se déduit du déplacement élémentaire (§4). L'accélération s'obtient en dérivant encore, avec les dérivées des trois vecteurs du trièdre ; son expression comporte neuf termes et n'est pas à connaître. Les problèmes à symétrie sphérique de PTSI (champ central, chapitre « Mouvement dans un champ central ») ont un mouvement plan, que l'on traite en coordonnées polaires.</p>
</div>

<template class="pan-tpl" data-panneau="cpt-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CINÉMATIQUE DU POINT</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 2.1 du programme : poser le cadre (référentiel, repère, degrés de liberté), écrire un déplacement élémentaire à partir d'un schéma, calculer vitesse et accélération en cartésiennes et en cylindriques, traiter les mouvements à accélération constante et circulaires, exploiter le repère de Frenet, lire qualitativement une trajectoire et dériver un relevé vidéo.</div>

  <div class="method-box"><strong>Méthode 1 — Poser le cadre : référentiel, repère, degrés de liberté</strong>
    <ol>
      <li><span class="step">Référentiel.</span> Nommer l'observateur : « dans le référentiel terrestre », « dans le référentiel géocentrique », « dans le référentiel du wagon ». Sans lui, ni la trajectoire ni la vitesse n'ont de sens.</li>
      <li><span class="step">Degrés de liberté.</span> Compter les paramètres indépendants qui fixent la position : 3 pour un point libre, moins un par liaison (rester sur un plan, sur un cercle, sur un fil tendu).</li>
      <li><span class="step">Coordonnées.</span> Choisir le système où les liaisons s'écrivent « une coordonnée est constante » : cercle ou cylindre → polaires ou cylindriques (\(r=R\)) ; sphère → sphériques ; droite, plan ou accélération constante → cartésiennes.</li>
      <li><span class="step">Schéma.</span> Dessiner le repère, orienter les axes et placer les angles avec leur sens positif avant d'écrire le moindre signe.</li>
    </ol>
    <p><em>Exemple éclair :</em> station spatiale en orbite circulaire à 400 km d'altitude (\(R=6\,771\ \text{km}\) du centre de la Terre), période 92,4 min, dans le référentiel géocentrique. Mouvement plan, \(r=R\) fixé : un seul degré de liberté, l'angle \(\theta\), en coordonnées polaires centrées sur la Terre. \(v=2\pi R/T\approx7{,}67\ \text{km·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Écrire un déplacement élémentaire à partir d'un schéma</strong>
    <ol>
      <li><span class="step">Une coordonnée à la fois.</span> Faire varier une seule coordonnée et suivre le point sur le schéma : une longueur qui varie donne un déplacement de même valeur (\(\mathrm{d}x\), \(\mathrm{d}r\), \(\mathrm{d}z\)) ; un angle qui varie fait décrire au point un arc de cercle.</li>
      <li><span class="step">Rayon de l'arc.</span> La longueur d'un arc est (rayon) × (angle) : \(r\,\mathrm{d}\theta\) en cylindriques ; en sphériques, \(r\,\mathrm{d}\theta\) le long du méridien (rayon \(r\)) et \(r\sin\theta\,\mathrm{d}\varphi\) le long du parallèle (rayon \(r\sin\theta\), distance à l'axe).</li>
      <li><span class="step">Direction.</span> Chaque déplacement est porté par le vecteur du trièdre local correspondant ; les trois sont orthogonaux et s'ajoutent.</li>
      <li><span class="step">Vitesse.</span> Diviser par \(\mathrm{d}t\) donne la vitesse : \(\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+\dot z\,\vec e_z\) en cylindriques.</li>
    </ol>
    <p><em>Exemple éclair :</em> un point passe, en polaires, de \((r,\theta)=(2{,}0\ \text{m},30^\circ)\) à \((2{,}1\ \text{m},32^\circ)\). \(\mathrm{d}r=0{,}10\ \text{m}\) et \(r\,\mathrm{d}\theta=2{,}0\times0{,}0349\approx0{,}070\ \text{m}\), d'où \(\mathrm{d}\overrightarrow{OM}\approx0{,}10\,\vec e_r+0{,}070\,\vec e_\theta\), de longueur 0,122 m ; le calcul exact en cartésiennes donne 0,123 m.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un angle seul n'est pas une longueur. Écrire \(\mathrm{d}\theta\,\vec e_\theta\) (sans le rayon) ou \(r\,\mathrm{d}\varphi\,\vec e_\varphi\) (rayon du parallèle oublié) donne un résultat non homogène ou faux : vérifier que chaque terme est en mètres.</div>

  <div class="method-box"><strong>Méthode 3 — Calculer vitesse et accélération en coordonnées cylindriques</strong>
    <ol>
      <li><span class="step">Équations horaires.</span> Écrire \(r(t)\), \(\theta(t)\), \(z(t)\) et leurs dérivées première et seconde.</li>
      <li><span class="step">Vitesse.</span> \(\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+\dot z\,\vec e_z\).</li>
      <li><span class="step">Accélération.</span> <div class="formula">$$\vec a=(\ddot r-r\dot\theta^2)\,\vec e_r+(r\ddot\theta+2\dot r\dot\theta)\,\vec e_\theta+\ddot z\,\vec e_z$$</div> En cas de doute, la retrouver en dérivant \(\vec v\) avec \(\dot{\vec e}_r=\dot\theta\,\vec e_\theta\) et \(\dot{\vec e}_\theta=-\dot\theta\,\vec e_r\).</li>
      <li><span class="step">Contrôle.</span> Si \(r\) est constant, on doit retrouver le mouvement circulaire ; si \(\theta\) est constant, un mouvement rectiligne selon \(\vec e_r\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(r=0{,}50+0{,}20\,t\) (m), \(\theta=2{,}0\,t\) (rad). À \(t=1{,}0\ \text{s}\) : \(r=0{,}70\ \text{m}\), \(\vec v=0{,}20\,\vec e_r+1{,}40\,\vec e_\theta\ \text{m·s}^{-1}\) et, avec \(\ddot r=\ddot\theta=0\), \(a_r=-r\dot\theta^2=-0{,}70\times2{,}0^2=-2{,}80\ \text{m·s}^{-2}\) et \(a_\theta=2\dot r\dot\theta=2\times0{,}20\times2{,}0=0{,}80\ \text{m·s}^{-2}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier que \(\vec e_r\) et \(\vec e_\theta\) dépendent du temps, donc écrire \(\vec a=\ddot r\,\vec e_r+r\ddot\theta\,\vec e_\theta\). Les termes \(-r\dot\theta^2\) et \(2\dot r\dot\theta\) viennent précisément de la rotation de la base.</div>

  <div class="method-box"><strong>Méthode 4 — Étudier un mouvement à vecteur accélération constant</strong>
    <ol>
      <li><span class="step">Axes.</span> Prendre un axe parallèle à \(\vec a_0\) (vertical pour la pesanteur) ; l'origine au point de départ simplifie les constantes.</li>
      <li><span class="step">Intégrer.</span> Composante par composante : \(v_x=a_{0x}t+v_{0x}\), \(x=\tfrac12a_{0x}t^2+v_{0x}t+x_0\), et de même sur les autres axes, avec les conditions initiales.</li>
      <li><span class="step">Questions sans le temps.</span> Pour relier vitesse et position (distance de freinage, vitesse d'impact), utiliser \(v^2-v_0^2=2\,\vec a_0\cdot\Delta\overrightarrow{OM}\).</li>
      <li><span class="step">Contrôle.</span> Signes cohérents avec l'orientation des axes ; homogénéité ; cas limite \(\vec a_0=\vec 0\) (mouvement rectiligne uniforme).</li>
    </ol>
    <p><em>Exemple éclair :</em> un TGV à 300 km/h (\(83{,}3\ \text{m·s}^{-1}\)) freine à \(0{,}90\ \text{m·s}^{-2}\) : il s'arrête en \(83{,}3/0{,}90\approx93\ \text{s}\), après \(83{,}3^2/(2\times0{,}90)\approx3{,}9\ \text{km}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Exploiter un tir dans le champ de pesanteur</strong>
    <ol>
      <li><span class="step">Équations.</span> \(x=v_0\cos\alpha\,t\), \(y=v_0\sin\alpha\,t-\tfrac12gt^2\) (axe \(Oy\) ascendant, origine au point de tir).</li>
      <li><span class="step">Sommet.</span> \(v_y=0\) donne \(t_S=v_0\sin\alpha/g\) et la flèche \(v_0^2\sin^2\alpha/(2g)\).</li>
      <li><span class="step">Atteindre un point \((x_c,y_c)\).</span> Écrire l'équation de la trajectoire \(y=x\tan\alpha-gx^2/(2v_0^2\cos^2\alpha)\) en ce point et la résoudre pour l'inconnue (\(v_0\) ou \(\alpha\)).</li>
      <li><span class="step">Portée.</span> \(D=v_0^2\sin2\alpha/g\) seulement si l'arrivée est à l'altitude du départ ; sinon, résoudre \(y(t)=y_c\) et garder la racine positive.</li>
    </ol>
    <p><em>Exemple éclair :</em> lancer franc, ballon lâché 1,05 m sous le cercle du panier et 4,2 m avant lui (horizontalement), sous \(\alpha=52^\circ\). \(1{,}05=4{,}2\tan52^\circ-\dfrac{9{,}81\times4{,}2^2}{2v_0^2\cos^252^\circ}\) donne \(v_0\approx7{,}3\ \text{m·s}^{-1}\), pour un vol de 0,94 s.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'équation du second degré en \(t\) a deux racines ; la racine négative correspond à un instant avant le lancer et doit être écartée (pas d'arrondi intermédiaire trop brutal non plus : garder trois chiffres significatifs).</div>

  <div class="method-box"><strong>Méthode 6 — Étudier un mouvement circulaire</strong>
    <ol>
      <li><span class="step">Polaires centrées sur le cercle.</span> \(r=R\), seule \(\theta(t)\) varie.</li>
      <li><span class="step">Formules.</span> \(\vec v=R\dot\theta\,\vec e_\theta\) et \(\vec a=-R\dot\theta^2\,\vec e_r+R\ddot\theta\,\vec e_\theta\).</li>
      <li><span class="step">Uniforme ?</span> Si \(\dot\theta=\omega\) est constant : \(a=R\omega^2=v^2/R\) vers le centre, \(T=2\pi/\omega\). Convertir les tours par minute : \(\omega=2\pi N/60\).</li>
      <li><span class="step">Non uniforme.</span> Garder \(R\ddot\theta\) ; la norme de l'accélération est \(R\sqrt{\dot\theta^4+\ddot\theta^2}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> vélo à 25 km/h (\(6{,}94\ \text{m·s}^{-1}\)), roues de rayon 0,34 m. Dans le référentiel du vélo, la valve tourne à \(\omega=v/R\approx20{,}4\ \text{rad·s}^{-1}\) (195 tr/min) et son accélération vaut \(R\omega^2\approx142\ \text{m·s}^{-2}\), environ \(14\,g\), vers le moyeu.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Utiliser le repère de Frenet</strong>
    <ol>
      <li><span class="step">Repère.</span> \(\vec T\) tangent dans le sens du mouvement, \(\vec N\) vers le centre de courbure (côté concave).</li>
      <li><span class="step">Composantes.</span> \(a_T=\mathrm{d}v/\mathrm{d}t\) (variation de la norme), \(a_N=v^2/\rho\) (changement de direction), \(\|\vec a\|=\sqrt{a_T^2+a_N^2}\).</li>
      <li><span class="step">Inverser.</span> Connaissant \(\vec v\) et \(\vec a\), la courbure s'en déduit : \(a_N=\|\vec v\wedge\vec a\|/v\), \(\rho=v^2/a_N\).</li>
    </ol>
    <p><em>Exemple éclair :</em> wagon de montagnes russes au bas d'une courbe de rayon de courbure 12 m, à \(20\ \text{m·s}^{-1}\), qui ralentit de \(3{,}0\ \text{m·s}^{-2}\) : \(a_N=400/12\approx33\ \text{m·s}^{-2}\) (\(3{,}4\,g\), vers le haut), \(a_T=-3{,}0\ \text{m·s}^{-2}\), \(\|\vec a\|\approx33\ \text{m·s}^{-2}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\mathrm{d}v/\mathrm{d}t=0\) (vitesse de norme constante) n'entraîne pas \(\vec a=\vec 0\) ; et \(a_N\) n'est jamais négatif : si le calcul donne un signe moins, c'est que \(\vec N\) a été orienté vers l'extérieur.</div>

  <div class="method-box"><strong>Méthode 8 — Situer qualitativement vitesse et accélération sur une trajectoire plane</strong>
    <ol>
      <li><span class="step">Vitesse.</span> Tangente à la trajectoire, dans le sens du mouvement.</li>
      <li><span class="step">Côté de l'accélération.</span> Toujours vers la concavité ; tangente seulement en un point d'inflexion ou sur une portion rectiligne.</li>
      <li><span class="step">Avant ou arrière.</span> \(\vec a\cdot\vec v\gt0\) : le point accélère, \(\vec a\) penche vers l'avant ; \(\lt0\) : il ralentit ; \(=0\) : norme de la vitesse momentanément constante.</li>
      <li><span class="step">Chronophotographie.</span> Points de plus en plus espacés : le point accélère ; régulièrement espacés : \(\mathrm{d}v/\mathrm{d}t=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> ballon lancé à 40° au-dessus de l'horizontale, sans frottement. Au départ, \(\vec a=\vec g\) fait avec \(\vec v\) un angle de \(90^\circ+40^\circ=130^\circ\) : le ballon ralentit ; au sommet, l'angle vaut 90° ; à la descente, il devient aigu et le ballon accélère.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Exploiter un enregistrement vidéo</strong>
    <ol>
      <li><span class="step">Mesure.</span> Caméra perpendiculaire au plan du mouvement, étalon de longueur dans ce plan ; pointer les positions \((x_k,y_k)\) aux instants \(t_k=k\,\Delta t\).</li>
      <li><span class="step">Vitesse.</span> Différence centrée \(v_{x,k}\approx(x_{k+1}-x_{k-1})/(2\Delta t)\), parallèle à la corde \(M_{k-1}M_{k+1}\).</li>
      <li><span class="step">Accélération.</span> Différence seconde \((x_{k+1}-2x_k+x_{k-1})/\Delta t^2\) : très sensible au bruit de pointage (erreur \(\approx4\,\delta x/\Delta t^2\)).</li>
      <li><span class="step">Modèle.</span> Pour une accélération fiable, ajuster un modèle sur tous les points (droite pour \(v(t)\), parabole pour \(y(t)\) avec <span class="code-inline">np.polyfit</span>) et comparer à la valeur attendue.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y_{k-1}=0{,}207\ \text{m}\), \(y_k=0{,}290\ \text{m}\), \(y_{k+1}=0{,}354\ \text{m}\), \(\Delta t=0{,}04\ \text{s}\) : \(v_y\approx(0{,}354-0{,}207)/0{,}08\approx1{,}84\ \text{m·s}^{-1}\) (valeur vraie 1,82) ; \(a_y\approx(0{,}354-0{,}580+0{,}207)/0{,}0016\approx-11{,}9\ \text{m·s}^{-2}\), loin de \(-9{,}81\) à cause d'une erreur de pointage de 2 mm.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : attribuer la différence avant \((x_{k+1}-x_k)/\Delta t\) à l'instant \(t_k\) : elle estime la vitesse au milieu de l'intervalle, à \(t_k+\Delta t/2\), et décale toute la courbe \(v(t)\) d'une demi-image.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Chute libre et lancer horizontal</h3>
  <div class="statement">Une balle est lâchée sans vitesse initiale d'une hauteur \(h=20\ \text{m}\). On néglige les frottements de l'air ; \(g=9{,}81\ \text{m·s}^{-2}\). Axe \(Oy\) vertical ascendant, origine au sol.</div>
  <div class="q"><strong>Q1.</strong> Écrire \(y(t)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la durée de chute et la vitesse à l'impact.</div>
  <div class="q"><strong>Q3.</strong> La même balle est lancée horizontalement à \(v_0=5{,}0\ \text{m·s}^{-1}\) depuis la même hauteur. Calculer la durée de chute, la distance horizontale parcourue et la vitesse à l'impact.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Mouvement à vecteur accélération constant \(\vec g=-g\,\vec e_y\), avec \(y(0)=h\) et \(\dot y(0)=0\) : \(y(t)=h-\tfrac12gt^2=20-4{,}905\,t^2\) (SI).</p>
    <p><strong>Q2.</strong> \(y(T)=0\) donne \(T=\sqrt{2h/g}=\sqrt{40/9{,}81}\approx2{,}02\ \text{s}\). Vitesse : \(v=gT\approx19{,}8\ \text{m·s}^{-1}\), ce que confirme la relation sans le temps \(v^2=2gh\).</p>
    <p><strong>Q3.</strong> Le mouvement vertical est le même (même accélération, même vitesse verticale initiale nulle) : la durée de chute vaut encore 2,02 s. Horizontalement, le mouvement est uniforme : \(x=v_0T\approx10{,}1\ \text{m}\). À l'impact, \(\vec v=5{,}0\,\vec e_x-19{,}8\,\vec e_y\), de norme \(20{,}4\ \text{m·s}^{-1}\), inclinée de \(\arctan(19{,}8/5{,}0)\approx76^\circ\) sous l'horizontale.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Distance d'arrêt d'une voiture</h3>
  <div class="statement">Un conducteur voit un obstacle. Pendant son temps de réaction \(t_r=1{,}0\ \text{s}\), la voiture garde sa vitesse ; elle freine ensuite avec une décélération constante de \(7{,}5\ \text{m·s}^{-2}\) (route sèche).</div>
  <div class="q"><strong>Q1.</strong> Calculer la distance d'arrêt (réaction comprise) à 90 km/h, puis à 50 km/h.</div>
  <div class="q"><strong>Q2.</strong> À 90 km/h, l'obstacle est à 40 m au moment où le conducteur le voit. À quelle vitesse la voiture le heurte-t-elle ?</div>
  <div class="q"><strong>Q3.</strong> Quelle vitesse initiale maximale permet de s'arrêter en 40 m ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Distance de réaction \(v_0t_r\) (mouvement uniforme), puis distance de freinage tirée de la relation sans le temps : \(0-v_0^2=2(-7{,}5)\,d_f\), soit \(d_f=v_0^2/15\). À 90 km/h (\(25\ \text{m·s}^{-1}\)) : \(25+41{,}7\approx67\ \text{m}\). À 50 km/h (\(13{,}9\ \text{m·s}^{-1}\)) : \(13{,}9+12{,}9\approx27\ \text{m}\). Réduire la vitesse de 45 % divise la distance d'arrêt par 2,5.</p>
    <p><strong>Q2.</strong> Après la réaction, il reste \(40-25=15\ \text{m}\) de freinage : \(v^2=25^2-2\times7{,}5\times15=400\), donc \(v=20\ \text{m·s}^{-1}=72\ \text{km/h}\). Le freinage n'a presque pas réduit la vitesse : l'essentiel de la vitesse se perd sur les derniers mètres.</p>
    <p><strong>Q3.</strong> Il faut \(v_0t_r+v_0^2/15=40\), équation du second degré \(v_0^2+15v_0-600=0\), dont la racine positive est \(v_0\approx18{,}1\ \text{m·s}^{-1}\), soit 65 km/h.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Un virage à vitesse constante</h3>
  <div class="statement">Une voiture parcourt un virage circulaire de rayon \(R=50\ \text{m}\) à vitesse constante \(v=72\ \text{km/h}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse en \(\text{m·s}^{-1}\), la vitesse angulaire et l'accélération.</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(\vec a\) dans le repère de Frenet ; où pointe-t-elle ?</div>
  <div class="q"><strong>Q3.</strong> On admet (chapitre « Principes de la dynamique ») qu'un passager de 70 kg doit recevoir la force \(m\vec a\). Comparer cette force à son poids.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v=72/3{,}6=20\ \text{m·s}^{-1}\), \(\omega=v/R=0{,}40\ \text{rad·s}^{-1}\), \(a=v^2/R=400/50=8{,}0\ \text{m·s}^{-2}\).</p>
    <p><strong>Q2.</strong> Vitesse constante : \(\mathrm{d}v/\mathrm{d}t=0\), donc \(\vec a=(v^2/R)\,\vec N=8{,}0\,\vec N\ \text{m·s}^{-2}\) : l'accélération est dirigée vers le centre du virage. Bien que la vitesse ait une norme constante, le mouvement est accéléré.</p>
    <p><strong>Q3.</strong> \(F=ma=70\times8{,}0=560\ \text{N}\), dirigée vers l'intérieur du virage (fournie par le siège et la ceinture). Rapportée au poids : \(560/(70\times9{,}81)\approx0{,}82\) : le passager ressent une poussée latérale égale à 82 % de son poids.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Portée et angle de tir</h3>
  <div class="statement">Un projectile est lancé du sol, sur un terrain horizontal, à \(v_0=100\ \text{m·s}^{-1}\) sous l'angle \(\alpha\) ; \(g=10\ \text{m·s}^{-2}\) ; frottements négligés.</div>
  <div class="q"><strong>Q1.</strong> Établir la portée \(D\) en fonction de \(\alpha\).</div>
  <div class="q"><strong>Q2.</strong> Quel angle maximise la portée ? Calculer la portée maximale.</div>
  <div class="q"><strong>Q3.</strong> Pour quels angles la portée vaut-elle 500 m ?</div>
  <div class="q"><strong>Q4.</strong> Comparer les durées de vol et les flèches des deux tirs de la question Q3. Lequel choisir pour atteindre la cible au plus vite ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(x=v_0\cos\alpha\,t\), \(y=v_0\sin\alpha\,t-\tfrac12gt^2\). Retour au sol (\(y=0\), \(t\neq0\)) à \(T=2v_0\sin\alpha/g\), donc \(D=v_0\cos\alpha\,T=v_0^2\sin2\alpha/g\).</p>
    <p><strong>Q2.</strong> Maximale pour \(\sin2\alpha=1\), soit \(\alpha=45^\circ\) : \(D_{\max}=v_0^2/g=1\,000\ \text{m}\).</p>
    <p><strong>Q3.</strong> \(\sin2\alpha=Dg/v_0^2=0{,}5\), d'où \(2\alpha=30^\circ\) ou \(150^\circ\) : \(\alpha=15^\circ\) ou \(75^\circ\), angles complémentaires.</p>
    <p><strong>Q4.</strong> \(T=2v_0\sin\alpha/g\) : 5,2 s à 15°, 19,3 s à 75°. Flèche \(H=v_0^2\sin^2\alpha/(2g)\) : 33 m à 15°, 467 m à 75°. Le tir tendu (15°) atteint la cible presque quatre fois plus vite ; le tir en cloche passe au-dessus des obstacles.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une bille quitte un plan incliné</h3>
  <div class="statement">Une bille part du repos et glisse sans frottement sur un plan incliné de \(30^\circ\) ; elle descend d'une hauteur \(h=2{,}0\ \text{m}\) avant d'atteindre le bord du plan, situé à \(H=5{,}0\ \text{m}\) au-dessus d'un sol horizontal. On admet (chapitre « Principes de la dynamique ») que, sur le plan, son accélération est dirigée selon la ligne de plus grande pente, de norme \(g\sin30^\circ\). Au bord, elle quitte le plan avec une vitesse dirigée selon la pente. \(g=9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la distance parcourue sur le plan, la vitesse au bord et la durée de la descente.</div>
  <div class="q"><strong>Q2.</strong> Après le bord, écrire les équations horaires (origine au sol, à la verticale du bord ; \(Ox\) horizontal dans le sens du mouvement, \(Oy\) vertical ascendant).</div>
  <div class="q"><strong>Q3.</strong> Calculer la durée de la chute et la distance horizontale entre la verticale du bord et le point d'impact.</div>
  <div class="q"><strong>Q4.</strong> Calculer la vitesse à l'impact et l'angle qu'elle fait avec le sol.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Longueur du plan : \(L=h/\sin30^\circ=4{,}0\ \text{m}\). Mouvement rectiligne uniformément accéléré, \(a=g\sin30^\circ\approx4{,}91\ \text{m·s}^{-2}\) : \(v^2=2aL=2gh\), donc \(v=\sqrt{2\times9{,}81\times2{,}0}\approx6{,}26\ \text{m·s}^{-1}\) ; durée \(v/a\approx1{,}28\ \text{s}\).</p>
    <p><strong>Q2.</strong> Vitesse au bord : \(v_x=v\cos30^\circ\approx5{,}42\ \text{m·s}^{-1}\), \(v_y=-v\sin30^\circ\approx-3{,}13\ \text{m·s}^{-1}\). Ensuite \(\vec a=\vec g\) : \(x=5{,}42\,t\) et \(y=5{,}0-3{,}13\,t-4{,}905\,t^2\) (SI).</p>
    <p><strong>Q3.</strong> \(y=0\) : \(4{,}905\,t^2+3{,}13\,t-5{,}0=0\). Discriminant \(3{,}13^2+4\times4{,}905\times5{,}0\approx107{,}9\), racine positive \(t=(-3{,}13+\sqrt{107{,}9})/9{,}81\approx0{,}740\ \text{s}\). Distance horizontale : \(5{,}42\times0{,}740\approx4{,}0\ \text{m}\). Attention au signe : la racine \((3{,}13+\sqrt{107{,}9})/9{,}81\approx1{,}38\ \text{s}\) résout l'équation où \(v_y\) aurait le mauvais signe (bille lancée vers le haut).</p>
    <p><strong>Q4.</strong> Relation sans le temps entre le bord et le sol : \(v_i^2=v^2+2gH=39{,}2+98{,}1\), d'où \(v_i\approx11{,}7\ \text{m·s}^{-1}\). Composante verticale \(-3{,}13-9{,}81\times0{,}740\approx-10{,}4\ \text{m·s}^{-1}\) : angle \(\arctan(10{,}4/5{,}42)\approx62^\circ\) sous l'horizontale.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Une spirale en coordonnées polaires</h3>
  <div class="statement">Un point décrit une spirale : \(r=at\), \(\theta=\omega t\), avec \(a=0{,}10\ \text{m·s}^{-1}\) et \(\omega=1{,}0\ \text{rad·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\vec v\) dans la base polaire, puis la norme \(v(t)\) ; la calculer à \(t=2{,}0\ \text{s}\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(\vec a\) ; calculer sa norme à \(t=2{,}0\ \text{s}\).</div>
  <div class="q"><strong>Q3.</strong> Établir l'équation polaire \(r(\theta)\) de la trajectoire. De combien \(r\) augmente-t-il à chaque tour ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dot r=a\), \(\dot\theta=\omega\) : \(\vec v=a\,\vec e_r+a\omega t\,\vec e_\theta\), de norme \(v=a\sqrt{1+\omega^2t^2}\). À \(t=2{,}0\ \text{s}\) : \(v=0{,}10\sqrt5\approx0{,}22\ \text{m·s}^{-1}\).</p>
    <p><strong>Q2.</strong> \(\ddot r=0\), \(\ddot\theta=0\) : \(a_r=-r\dot\theta^2=-a\omega^2t\) et \(a_\theta=2\dot r\dot\theta=2a\omega\). À \(t=2{,}0\ \text{s}\) : \(a_r=-0{,}20\ \text{m·s}^{-2}\), \(a_\theta=0{,}20\ \text{m·s}^{-2}\), norme \(0{,}20\sqrt2\approx0{,}28\ \text{m·s}^{-2}\). La composante orthoradiale vient uniquement du terme \(2\dot r\dot\theta\) : elle serait oubliée si l'on dérivait la base comme une base fixe.</p>
    <p><strong>Q3.</strong> On élimine le temps : \(t=\theta/\omega\), donc \(r=(a/\omega)\,\theta\), une spirale d'Archimède. À chaque tour, \(\theta\) augmente de \(2\pi\) et \(r\) de \(2\pi a/\omega\approx0{,}63\ \text{m}\) : les spires sont équidistantes.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Le crochet d'une grue à tour</h3>
  <div class="statement">La flèche horizontale d'une grue tourne autour du mât vertical à \(\Omega=0{,}20\ \text{rad·s}^{-1}\). Le chariot s'éloigne du mât à \(0{,}50\ \text{m·s}^{-1}\) depuis la distance de 10 m, et le crochet, suspendu sous le chariot, descend à \(0{,}40\ \text{m·s}^{-1}\). On assimile le crochet à un point \(M\) et l'on néglige ses balancements. Référentiel terrestre, coordonnées cylindriques d'axe \(Oz\) (axe du mât, vertical ascendant), \(t=0\) au départ.</div>
  <div class="q"><strong>Q1.</strong> Combien le crochet a-t-il de degrés de liberté ? Écrire \(r(t)\), \(\theta(t)\) et \(z(t)\) (avec \(z(0)=z_0\)).</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(\vec v\) et calculer sa norme à \(t=4{,}0\ \text{s}\).</div>
  <div class="q"><strong>Q3.</strong> Exprimer \(\vec a\) et la calculer à \(t=4{,}0\ \text{s}\). D'où vient sa composante orthoradiale ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Trois moteurs indépendants (orientation, chariot, treuil) : \(r\), \(\theta\) et \(z\) sont indépendants, le crochet a trois degrés de liberté. Ici \(r=10+0{,}50\,t\), \(\theta=0{,}20\,t\), \(z=z_0-0{,}40\,t\) (SI).</p>
    <p><strong>Q2.</strong> \(\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+\dot z\,\vec e_z\), soit \(\vec v=0{,}50\,\vec e_r+0{,}20\,r\,\vec e_\theta-0{,}40\,\vec e_z\). À \(t=4{,}0\ \text{s}\), \(r=12\ \text{m}\) : \(\vec v=0{,}50\,\vec e_r+2{,}4\,\vec e_\theta-0{,}40\,\vec e_z\), de norme \(\sqrt{0{,}25+5{,}76+0{,}16}\approx2{,}5\ \text{m·s}^{-1}\). La rotation domine.</p>
    <p><strong>Q3.</strong> \(\ddot r=\ddot\theta=\ddot z=0\) : \(\vec a=-r\Omega^2\,\vec e_r+2\dot r\Omega\,\vec e_\theta\). À 4,0 s : \(a_r=-12\times0{,}04=-0{,}48\ \text{m·s}^{-2}\), \(a_\theta=2\times0{,}50\times0{,}20=0{,}20\ \text{m·s}^{-2}\), norme \(0{,}52\ \text{m·s}^{-2}\). La composante orthoradiale vient du chariot qui s'éloigne pendant que la flèche tourne : la vitesse orthoradiale \(r\Omega\) augmente parce que \(r\) augmente (un terme \(\dot r\Omega\)), et la vitesse radiale tourne avec la base (un second terme \(\dot r\Omega\)). C'est l'accélération que doivent fournir les câbles, et qui fait pencher le crochet si l'on accélère trop.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Coordonnées sphériques : se déplacer sur la Terre</h3>
  <div class="statement">La Terre est une sphère de rayon \(R_T=6\,371\ \text{km}\), de centre \(O\), qui tourne autour de l'axe des pôles \(Oz\) à \(\Omega=7{,}29\times10^{-5}\ \text{rad·s}^{-1}\) dans le référentiel géocentrique. Un point de la surface est repéré par ses coordonnées sphériques \((R_T,\theta,\varphi)\) ; sa latitude est \(\lambda=90^\circ-\theta\). Paris est à \(\lambda=48{,}85^\circ\).</div>
  <div class="q"><strong>Q1.</strong> À partir d'un schéma, exprimer le déplacement élémentaire d'un point de la surface quand \(\theta\) et \(\varphi\) varient. Combien un point de la surface a-t-il de degrés de liberté ?</div>
  <div class="q"><strong>Q2.</strong> Quelle distance correspond à 1° de longitude à la latitude de Paris ? À 1° de latitude ?</div>
  <div class="q"><strong>Q3.</strong> Dans le référentiel géocentrique, un point du sol à Paris a \(\theta\) constant et \(\dot\varphi=\Omega\). Calculer sa vitesse et son accélération (direction et norme) ; comparer celle-ci à \(g\).</div>
  <div class="q"><strong>Q4.</strong> Un avion vole vers l'est à 900 km/h par rapport au sol, le long du parallèle de Paris, à 10 km d'altitude. Combien de temps lui faudrait-il pour faire le tour de la Terre ? Quel est son \(\dot\varphi\) par rapport au sol ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(r=R_T\) est fixé :</p>
    <div class="formula">$$\mathrm{d}\overrightarrow{OM}=R_T\,\mathrm{d}\theta\,\vec e_\theta+R_T\sin\theta\,\mathrm{d}\varphi\,\vec e_\varphi$$</div>
    <p>(arc de méridien de rayon \(R_T\), arc de parallèle de rayon \(R_T\sin\theta\)). Deux degrés de liberté, \(\theta\) et \(\varphi\) (latitude et longitude).</p>
    <p><strong>Q2.</strong> À Paris, \(\theta=41{,}15^\circ\) : 1° de longitude vaut \(R_T\sin\theta\times\pi/180\approx73\ \text{km}\) ; 1° de latitude vaut \(R_T\times\pi/180\approx111\ \text{km}\) partout.</p>
    <p><strong>Q3.</strong> Le point décrit uniformément le parallèle, cercle de rayon \(R_T\sin\theta=R_T\cos\lambda\approx4\,192\ \text{km}\) : \(\vec v=R_T\sin\theta\,\Omega\,\vec e_\varphi\), de norme \(306\ \text{m·s}^{-1}\), vers l'est. Mouvement circulaire uniforme : l'accélération est centripète, dirigée vers l'axe des pôles (et non vers le centre de la Terre), de norme \(R_T\cos\lambda\,\Omega^2\approx2{,}2\times10^{-2}\ \text{m·s}^{-2}\), soit 0,2 % de \(g\) : c'est pourquoi le référentiel terrestre est presque galiléen pour une expérience de courte durée.</p>
    <p><strong>Q4.</strong> Le parallèle à 10 km d'altitude a pour rayon \((R_T+10\ \text{km})\sin\theta\approx4\,199\ \text{km}\) et pour longueur \(2\pi\times4\,199\approx26\,400\ \text{km}\) : à \(250\ \text{m·s}^{-1}\), il faut 29,3 h. \(\dot\varphi=v/(R\sin\theta)\approx5{,}95\times10^{-5}\ \text{rad·s}^{-1}\), du même ordre que \(\Omega\) : dans le référentiel géocentrique, l'avion va vers l'est à environ \(250+306\approx556\ \text{m·s}^{-1}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Rotation uniformément accélérée</h3>
  <div class="statement">Un point \(M\) décrit un cercle de rayon \(R=0{,}50\ \text{m}\). Sa position angulaire suit \(\theta(t)=\tfrac12\beta t^2\), avec \(\beta=4{,}0\ \text{rad·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Donner \(\omega(t)=\dot\theta\) et la vitesse \(v\) ; les calculer à \(t=2{,}0\ \text{s}\). Combien de tours le point a-t-il faits ?</div>
  <div class="q"><strong>Q2.</strong> Donner les composantes tangentielle et normale de l'accélération à \(t=2{,}0\ \text{s}\), puis sa norme.</div>
  <div class="q"><strong>Q3.</strong> Quel angle l'accélération fait-elle avec la vitesse ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega=\beta t\) : à 2,0 s, \(\omega=8{,}0\ \text{rad·s}^{-1}\) et \(v=R\omega=4{,}0\ \text{m·s}^{-1}\). \(\theta=\tfrac12\times4{,}0\times2{,}0^2=8{,}0\ \text{rad}\), soit \(8{,}0/(2\pi)\approx1{,}3\) tour.</p>
    <p><strong>Q2.</strong> Sur le cercle : \(a_T=R\ddot\theta=R\beta=2{,}0\ \text{m·s}^{-2}\) et \(a_N=R\omega^2=0{,}50\times64=32\ \text{m·s}^{-2}\) ; \(\|\vec a\|=\sqrt{4+1\,024}\approx32\ \text{m·s}^{-2}\).</p>
    <p><strong>Q3.</strong> \(\tan\varphi=a_N/a_T=16\), soit \(\varphi\approx86^\circ\) : l'accélération penche à peine vers l'avant. La composante normale croît comme \(t^2\) quand la composante tangentielle reste constante : au bout de quelques tours, l'accélération est presque centripète.</p>
