<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre le point b) « Sous-espaces stables » de la partie « Compléments d'algèbre linéaire » du programme de PT, ainsi que la trace d'un endomorphisme (point c), dont la partie matricielle est traitée dans le chapitre Calcul matriciel (approfondissements), §3. Les sous-espaces stables sont la porte d'entrée de la réduction : chercher une base dans laquelle la matrice d'un endomorphisme est simple, c'est chercher des sous-espaces qu'il laisse stables. Les rappels de première année (noyau, image, rang) occupent les trois premières sections.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Acquis de première année</strong> : applications linéaires, noyau, image, rang, théorème du rang et sa forme géométrique, isomorphismes, détermination d'une application linéaire par l'image d'une base ou par ses restrictions à des sous-espaces supplémentaires (§1, §2).</li>
        <li><strong>Formes linéaires et hyperplans</strong> : rappel, en lien avec le chapitre Espaces vectoriels (approfondissements) (§3).</li>
        <li><strong>Sous-espace stable</strong> par un endomorphisme ; <strong>endomorphisme induit</strong> (§4).</li>
        <li><strong>Matrice dans une base adaptée</strong> : interpréter une forme matricielle par blocs en termes de stabilité d'un sous-espace et, inversement, traduire une stabilité sous forme matricielle (§5).</li>
        <li><strong>Endomorphismes qui commutent</strong> : le noyau et l'image de l'un sont stables par l'autre (§6).</li>
        <li><strong>Droites stables</strong> par un endomorphisme, premier contact avec les vecteurs propres (§7).</li>
        <li><strong>Trace d'un endomorphisme</strong> en dimension finie ; trace d'un projecteur (§8).</li>
      </ul>
      <p>Hors programme : l'espace dual et la base duale ; les polynômes d'endomorphismes (« tout développement sur les polynômes d'endomorphisme est hors programme »). Quelques mots à leur sujet figurent en fin de chapitre.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · RAPPELS : NOYAU, IMAGE, RANG</div>
  <h2>Ce que l'on sait déjà des applications linéaires</h2>
  <div class="intro">Les résultats de première année sont rappelés brièvement (voir le chapitre Applications linéaires), avec une démonstration du théorème du rang sous sa forme géométrique, qui resservira. \(\mathbb{K}\) désigne \(\mathbb{R}\) ou \(\mathbb{C}\), et \(E\), \(F\) des \(\mathbb{K}\)-espaces vectoriels.</div>

  <div class="def-box">
    \(f : E \to F\) est <strong>linéaire</strong> si \(f(\lambda x + \mu y) = \lambda f(x) + \mu f(y)\) pour tous vecteurs \(x, y\) et scalaires \(\lambda, \mu\). On note \(\mathcal{L}(E, F)\) l'espace vectoriel de ces applications et \(\mathcal{L}(E) = \mathcal{L}(E, E)\) celui des <strong>endomorphismes</strong>. Le <strong>noyau</strong> \(\ker f = \{x \in E,\ f(x) = 0\}\) est un sous-espace de \(E\) ; l'<strong>image</strong> \(\operatorname{Im} f = f(E)\) est un sous-espace de \(F\) ; le <strong>rang</strong> est \(\operatorname{rg} f = \dim \operatorname{Im} f\) lorsqu'il est fini.
  </div>
  <div class="prop-box">
    <strong>Les réflexes de base.</strong>
    <ul>
      <li>\(f\) est injective si et seulement si \(\ker f = \{0\}\).</li>
      <li>Si \((e_1, \ldots, e_n)\) engendre \(E\), alors \(\operatorname{Im} f = \operatorname{Vect}\big(f(e_1), \ldots, f(e_n)\big)\) : en dimension finie, l'image est engendrée par les colonnes de la matrice.</li>
      <li>\(\operatorname{rg}(g \circ f) \leq \min(\operatorname{rg} f, \operatorname{rg} g)\), et composer par un isomorphisme (à gauche ou à droite) ne change pas le rang.</li>
      <li>L'équation \(f(x) = b\) n'a aucune solution, ou bien ses solutions sont les \(x_0 + k\), \(k \in \ker f\), où \(x_0\) est une solution particulière.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Théorème du rang.</strong> Soit \(f \in \mathcal{L}(E, F)\). <em>Forme géométrique</em> : si \(S\) est un supplémentaire de \(\ker f\) dans \(E\), alors \(f\) induit un isomorphisme de \(S\) sur \(\operatorname{Im} f\). <em>Forme numérique</em> : si \(E\) est de dimension finie,
    <div class="formula" data-nom="Théorème du rang">$$\dim E = \dim \ker f + \operatorname{rg} f.$$</div>
    En particulier, si \(\dim E = \dim F\) est finie : \(f\) injective \(\iff\) \(f\) surjective \(\iff\) \(f\) bijective.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La restriction de \(f\) à un supplémentaire du noyau est un isomorphisme sur l'image.</span>
    <div class="content">
      <p>Notons \(g : S \to \operatorname{Im} f\), \(x \mapsto f(x)\). <em>Injectivité</em> : si \(x \in S\) et \(f(x) = 0\), alors \(x \in S \cap \ker f = \{0\}\). <em>Surjectivité</em> : tout \(y \in \operatorname{Im} f\) s'écrit \(y = f(x)\) ; on décompose \(x = s + k\) avec \(s \in S\) et \(k \in \ker f\), et \(y = f(s) + f(k) = g(s)\).</p>
      <p>En dimension finie, \(\ker f\) possède un supplémentaire \(S\), de dimension \(\dim E - \dim \ker f\) ; l'isomorphisme \(g\) donne \(\dim S = \dim \operatorname{Im} f\), d'où la formule.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — l'opérateur de différence</strong>
    <p>Sur \(\mathbb{R}_3[X]\), soit \(\Delta(P) = P(X + 1) - P(X)\). C'est un endomorphisme (substituer \(X + 1\) à \(X\) est linéaire).</p>
    <ol>
      <li><em>Noyau.</em> Si \(P(X + 1) = P(X)\), le polynôme \(Q = P - P(0)\) vérifie \(Q(0) = 0\), puis \(Q(1) = Q(0) = 0\), \(Q(2) = Q(1) = 0\), etc. : il a une infinité de racines, donc il est nul. Ainsi \(\ker \Delta = \mathbb{R}_0[X]\), les constantes, de dimension 1.</li>
      <li><em>Image.</em> \(\Delta(1) = 0\), \(\Delta(X) = 1\), \(\Delta(X^2) = 2X + 1\), \(\Delta(X^3) = 3X^2 + 3X + 1\) : l'image est contenue dans \(\mathbb{R}_2[X]\). Le théorème du rang donne \(\operatorname{rg} \Delta = 4 - 1 = 3 = \dim \mathbb{R}_2[X]\), donc \(\operatorname{Im} \Delta = \mathbb{R}_2[X]\).</li>
      <li><em>Application.</em> Il existe donc \(P\) tel que \(\Delta(P) = X^2\) ; on vérifie que \(P = \tfrac{1}{6}X(X - 1)(2X - 1)\) convient. En sommant \(P(k + 1) - P(k) = k^2\) pour \(k\) de \(0\) à \(n - 1\), les termes se télescopent :
      <div class="formula">$$\begin{aligned} \sum_{k=0}^{n-1} k^2 &= P(n) - P(0) \\ &= \frac{(n - 1)\,n\,(2n - 1)}{6}. \end{aligned}$$</div></li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : déduire du théorème du rang que \(E = \ker f \oplus \operatorname{Im} f\) pour un endomorphisme. Les dimensions s'additionnent bien, mais les deux sous-espaces peuvent se rencontrer : pour \(f(x, y) = (y, 0)\) sur \(\mathbb{R}^2\), \(\ker f = \operatorname{Im} f = \operatorname{Vect}\big((1, 0)\big)\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ISOMORPHISMES ET CONSTRUCTION D'APPLICATIONS LINÉAIRES</div>
  <h2>Définir une application linéaire par morceaux</h2>
  <div class="intro">Une application linéaire est entièrement déterminée par peu d'informations : les images des vecteurs d'une base, ou ses restrictions à des sous-espaces dont l'espace est somme directe. C'est ainsi que l'on définit les projecteurs, les symétries et, plus tard, les endomorphismes diagonalisables.</div>

  <div class="prop-box">
    <strong>Détermination par une base.</strong> Si \((e_1, \ldots, e_n)\) est une base de \(E\) et \((y_1, \ldots, y_n)\) une famille quelconque de \(F\), il existe une unique \(f \in \mathcal{L}(E, F)\) telle que \(f(e_i) = y_i\) pour tout \(i\). Elle est injective (resp. surjective, bijective) si et seulement si \((y_1, \ldots, y_n)\) est libre (resp. génératrice de \(F\), base de \(F\)). Deux espaces de dimension finie sont isomorphes si et seulement s'ils ont la même dimension.
  </div>
  <div class="prop-box">
    <strong>Recollement.</strong> Si \(E = E_1 \oplus \cdots \oplus E_p\) et si \(u_i \in \mathcal{L}(E_i, F)\) pour chaque \(i\), il existe une unique \(u \in \mathcal{L}(E, F)\) qui coïncide avec \(u_i\) sur \(E_i\) pour tout \(i\) : pour \(x = x_1 + \cdots + x_p\) décomposé selon la somme directe,
    <div class="formula" data-nom="Recollement d'applications linéaires">$$u(x) = u_1(x_1) + \cdots + u_p(x_p).$$</div>
    L'unicité de la décomposition rend cette définition cohérente et \(u\) linéaire ; toute application linéaire coïncidant avec les \(u_i\) est forcément donnée par cette formule.
  </div>

  <div class="method-box">
    <strong>Exemple — l'isomorphisme d'interpolation</strong>
    <p>Soit \(\Phi : \mathbb{R}_2[X] \to \mathbb{R}^3\), \(P \mapsto \big(P(-1), P(0), P(1)\big)\), linéaire.</p>
    <ol>
      <li>Si \(\Phi(P) = 0\), le polynôme \(P\), de degré au plus 2, a trois racines distinctes : il est nul. \(\Phi\) est injective.</li>
      <li>Les deux espaces sont de dimension 3, donc \(\Phi\) est un isomorphisme : pour toutes valeurs imposées en \(-1\), \(0\), \(1\), il existe un unique polynôme de degré au plus 2 qui les prend.</li>
      <li>Par exemple, les valeurs \((1, 0, 3)\) : avec \(P = aX^2 + bX + c\), on trouve \(c = 0\), \(a - b = 1\), \(a + b = 3\), donc \(P = 2X^2 + X\). Contrôle : \(P(-1) = 2 - 1 = 1\) et \(P(1) = 3\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — définir un endomorphisme par ses restrictions</strong>
    <p>Dans \(\mathbb{R}^3\), soit le plan \(P : x + y + z = 0\) et la droite \(D = \operatorname{Vect}\big((1, 1, 1)\big)\), supplémentaires (le vecteur \((1, 1, 1)\) ne vérifie pas l'équation de \(P\)). On définit \(u\) par recollement : \(u = \mathrm{id}\) sur \(P\) et \(u = -\mathrm{id}\) sur \(D\).</p>
    <ol>
      <li>Décomposons \(e_1 = (1, 0, 0)\) : \(e_1 = w + \tfrac{1}{3}(1, 1, 1)\) avec \(w = \big(\tfrac{2}{3}, -\tfrac{1}{3}, -\tfrac{1}{3}\big)\), qui est dans \(P\) (somme des coordonnées nulle).</li>
      <li>On garde la composante dans \(P\) et l'on change le signe de l'autre : \(u(e_1) = w - \tfrac{1}{3}(1, 1, 1)\), soit
      <div class="formula">$$u(e_1) = \Big(\frac{1}{3}, -\frac{2}{3}, -\frac{2}{3}\Big),$$</div>
      première colonne de la matrice de \(u\).</li>
      <li>Cet endomorphisme est la symétrie par rapport à \(P\) parallèlement à \(D\) ; comme \(D\) est orthogonale à \(P\), c'est même une réflexion (chapitre Projecteurs et symétries).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FORMES LINÉAIRES ET HYPERPLANS</div>
  <h2>Les applications linéaires à valeurs scalaires</h2>
  <div class="intro">Une forme linéaire est une application linéaire à valeurs dans \(\mathbb{K}\). Son noyau est un hyperplan, et réciproquement. Ce lien est développé dans le chapitre Espaces vectoriels (approfondissements), §6 et §7 ; on en retient ici l'essentiel, qui servira à étudier la stabilité d'un hyperplan.</div>

  <div class="def-box">
    Une <strong>forme linéaire</strong> sur \(E\) est un élément de \(\mathcal{L}(E, \mathbb{K})\). Sur \(\mathbb{K}^n\), ce sont les applications \(X \mapsto LX\) où \(L\) est une matrice ligne ; dans une base, \(\varphi(x) = a_1x_1 + \cdots + a_nx_n\). Exemples : une coordonnée, l'évaluation \(P \mapsto P(a)\), l'intégrale \(f \mapsto \int_a^b f\), la trace \(M \mapsto \operatorname{tr} M\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> Soit \(\varphi\) une forme linéaire non nulle sur \(E\) de dimension \(n\).
    <ul>
      <li>\(\varphi\) est surjective (son image est un sous-espace non nul de \(\mathbb{K}\)), donc \(\ker \varphi\) est un <strong>hyperplan</strong>, de dimension \(n - 1\).</li>
      <li>Pour tout \(a\) tel que \(\varphi(a) \neq 0\), \(E = \ker \varphi \oplus \mathbb{K}a\).</li>
      <li>Une forme linéaire \(\psi\) qui s'annule sur \(\ker \varphi\) est proportionnelle à \(\varphi\) : \(\psi = \lambda\varphi\) avec \(\lambda = \psi(a)/\varphi(a)\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — évaluation en un point</strong>
    <p>Sur \(\mathbb{R}_3[X]\), soit \(\varphi(P) = P(2)\).</p>
    <ol>
      <li>\(\ker \varphi\) est formé des polynômes divisibles par \(X - 2\) : \(\ker \varphi = \{(X - 2)Q,\ Q \in \mathbb{R}_2[X]\}\), de dimension 3, ce qui confirme \(4 - 1 = 3\).</li>
      <li>\(\varphi(1) = 1 \neq 0\), donc \(\mathbb{R}_3[X] = \ker \varphi \oplus \mathbb{R}_0[X]\), et la décomposition s'écrit \(P = \big(P - P(2)\big) + P(2)\).</li>
      <li>La forme \(P \mapsto P(2) + P'(2)\) ne s'annule pas sur tout \(\ker \varphi\) (elle vaut 1 en \(X - 2\)) : elle n'est pas proportionnelle à \(\varphi\), et son noyau est un autre hyperplan.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SOUS-ESPACES STABLES, ENDOMORPHISME INDUIT</div>
  <h2>Les sous-espaces dont un endomorphisme ne fait pas sortir</h2>
  <div class="intro">Un sous-espace stable par \(u\) est un sous-espace que \(u\) envoie dans lui-même. On peut alors restreindre \(u\) à ce sous-espace et obtenir un endomorphisme plus petit, plus facile à étudier. Dans cette section, \(u \in \mathcal{L}(E)\).</div>

  <div class="def-box">
    Un sous-espace \(F\) de \(E\) est <strong>stable</strong> par \(u\) si \(u(F) \subset F\), c'est-à-dire si \(u(x) \in F\) pour tout \(x \in F\). L'application \(u_F : F \to F\), \(x \mapsto u(x)\), est alors un endomorphisme de \(F\), appelé <strong>endomorphisme induit</strong> par \(u\) sur \(F\).
  </div>
  <div class="prop-box">
    <strong>Test sur une famille génératrice.</strong> Si \(F = \operatorname{Vect}(x_1, \ldots, x_k)\), alors \(F\) est stable par \(u\) si et seulement si \(u(x_i) \in F\) pour tout \(i\). En effet, l'image d'une combinaison linéaire des \(x_i\) est la même combinaison linéaire des \(u(x_i)\).
  </div>
  <div class="prop-box">
    <strong>Sous-espaces toujours stables.</strong> \(\{0\}\), \(E\), \(\ker u\) et \(\operatorname{Im} u\) sont stables par \(u\), ainsi que \(\ker(u - \lambda\,\mathrm{id})\) pour tout scalaire \(\lambda\). Tout sous-espace est stable par une homothétie. Pour l'endomorphisme induit : \(\ker u_F = \ker u \cap F\) et \(\operatorname{Im} u_F = u(F)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi le noyau, l'image et les \(\ker(u - \lambda\,\mathrm{id})\) sont-ils stables ?</span>
    <div class="content">
      <p>Si \(x \in \ker u\), alors \(u(x) = 0\), qui appartient à \(\ker u\). Si \(y \in \operatorname{Im} u\), alors \(u(y)\) est l'image d'un vecteur, donc appartient à \(\operatorname{Im} u\). Si \(u(x) = \lambda x\), alors \(u\big(u(x)\big) = u(\lambda x) = \lambda\,u(x)\) : le vecteur \(u(x)\) vérifie la même équation, donc \(u(x) \in \ker(u - \lambda\,\mathrm{id})\).</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — un plan stable de \(\mathbb{R}^3\)</strong>
    <p>Soit \(u\) l'endomorphisme de \(\mathbb{R}^3\) de matrice \(A = \begin{pmatrix} 2 & 1 & 0 \\ 0 & 1 & 1 \\ 1 & 1 & 2 \end{pmatrix}\) dans la base canonique, et le plan \(P : x + y + z = 0\).</p>
    <ol>
      <li>\(P = \operatorname{Vect}(v_1, v_2)\) avec \(v_1 = (1, -1, 0)\) et \(v_2 = (0, 1, -1)\).</li>
      <li>\(u(v_1) = A v_1 = (1, -1, 0) = v_1\) et \(u(v_2) = (1, 0, -1) = v_1 + v_2\) : ces deux images sont dans \(P\), qui est donc stable par \(u\).</li>
      <li>La matrice de l'endomorphisme induit \(u_P\) dans la base \((v_1, v_2)\) se lit sur ces images : \(\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}\).</li>
    </ol>
    <p>On remarque que chaque colonne de \(A\) a pour somme 3 ; c'est l'explication de la stabilité de \(P\) donnée par la propriété qui suit.</p>
  </div>
  <div class="prop-box">
    <strong>Stabilité d'un hyperplan.</strong> Soit \(\varphi\) une forme linéaire non nulle. L'hyperplan \(\ker \varphi\) est stable par \(u\) si et seulement si \(\varphi \circ u\) est proportionnelle à \(\varphi\) : il existe \(\lambda\) tel que \(\varphi \circ u = \lambda \varphi\). Matriciellement, sur \(\mathbb{K}^n\) avec \(\varphi(X) = LX\) : \(LA = \lambda L\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Utiliser la proportionnalité des formes de même noyau (§3).</span>
    <div class="content"><p>Si \(\varphi \circ u = \lambda\varphi\) et \(x \in \ker \varphi\), alors \(\varphi\big(u(x)\big) = \lambda\varphi(x) = 0\) : \(u(x) \in \ker \varphi\). Réciproquement, si \(\ker \varphi\) est stable, la forme \(\psi = \varphi \circ u\) s'annule sur \(\ker \varphi\), donc elle est proportionnelle à \(\varphi\) (§3). Dans l'exemple, \(L = (1\ \ 1\ \ 1)\) et \(LA = (3\ \ 3\ \ 3) = 3L\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — sous-espaces stables par la dérivation</strong>
    <p>Soit \(D : f \mapsto f'\) sur l'espace des fonctions de classe \(\mathcal{C}^\infty\) de \(\mathbb{R}\) dans \(\mathbb{R}\).</p>
    <ol>
      <li>Les fonctions polynomiales de degré au plus \(n\) forment un sous-espace stable : dériver fait baisser le degré.</li>
      <li>\(\operatorname{Vect}(\cos, \sin)\) est stable : \(D(\cos) = -\sin\) et \(D(\sin) = \cos\). Dans la base \((\cos, \sin)\), l'endomorphisme induit a pour matrice \(\begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}\), celle d'une rotation d'angle \(-\pi/2\).</li>
      <li>\(\operatorname{Vect}(t \mapsto \mathrm{e}^{t}, t \mapsto t\mathrm{e}^{t})\) est stable, car la dérivée de \(t\mathrm{e}^t\) est \(\mathrm{e}^t + t\mathrm{e}^t\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre « \(F\) est stable par \(u\) » (\(u(F) \subset F\), une simple inclusion), « \(u(F) = F\) » (plus fort) et « \(u\) fixe chaque vecteur de \(F\) » (\(u(x) = x\), beaucoup plus fort). Autre piège : un sous-espace stable n'a pas forcément de supplémentaire stable (voir §7, matrice \(\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · TRADUCTION MATRICIELLE : BASES ADAPTÉES ET BLOCS</div>
  <h2>Lire la stabilité sur une matrice, et inversement</h2>
  <div class="intro">C'est la capacité centrale du chapitre : une matrice triangulaire ou diagonale <strong>par blocs</strong> traduit la stabilité de certains sous-espaces, et une stabilité connue permet de choisir une base où la matrice comporte des blocs nuls. Dans cette section, \(E\) est de dimension finie \(n\) et \(u \in \mathcal{L}(E)\).</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(F\) un sous-espace de dimension \(p\), et \(\mathcal{B} = (e_1, \ldots, e_n)\) une base de \(E\) <strong>adaptée</strong> à \(F\) : \((e_1, \ldots, e_p)\) est une base de \(F\), et \((e_{p+1}, \ldots, e_n)\) engendre un supplémentaire \(G\). Alors \(F\) est stable par \(u\) si et seulement si la matrice de \(u\) dans \(\mathcal{B}\) est <strong>triangulaire par blocs</strong> :
    <div class="formula" data-nom="Stabilité et matrice par blocs">$$\operatorname{Mat}_{\mathcal{B}}(u) = \begin{pmatrix} A & B \\ 0 & C \end{pmatrix},$$</div>
    avec \(A \in \mathcal{M}_p(\mathbb{K})\) et \(C \in \mathcal{M}_{n-p}(\mathbb{K})\). Dans ce cas, \(A\) est la matrice de l'endomorphisme induit \(u_F\) dans la base \((e_1, \ldots, e_p)\).
  </div>

<figcaption>Matrice de u dans une base adaptée à E = F ⊕ G : chaque colonne contient les coordonnées de l'image d'un vecteur de base. Les p premières colonnes sont les coordonnées de u(e₁), …, u(eₚ) : si F est stable, ces vecteurs restent dans F, leurs coordonnées sur la base de G sont nulles (bloc 0), et A est la matrice de l'endomorphisme induit sur F. Si G est stable aussi, B est nul à son tour.</figcaption>
</figure>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout se lit colonne par colonne.</span>
    <div class="content"><p>La \(j\)-ième colonne de \(\operatorname{Mat}_{\mathcal{B}}(u)\) contient les coordonnées de \(u(e_j)\). Pour \(j \leq p\), dire que \(u(e_j) \in F\), c'est dire que ses coordonnées sur \(e_{p+1}, \ldots, e_n\) sont nulles. Le bloc en bas à gauche est donc nul si et seulement si \(u(e_1), \ldots, u(e_p)\) sont dans \(F\), c'est-à-dire (test sur une famille génératrice) si et seulement si \(F\) est stable. Le bloc \(A\) contient alors les coordonnées de \(u(e_j) = u_F(e_j)\) dans \((e_1, \ldots, e_p)\) : c'est la matrice de \(u_F\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Somme directe de sous-espaces stables.</strong> Si \(E = F_1 \oplus \cdots \oplus F_k\) et si \(\mathcal{B}\) est adaptée à cette décomposition, les \(F_i\) sont <strong>tous</strong> stables par \(u\) si et seulement si la matrice de \(u\) dans \(\mathcal{B}\) est <strong>diagonale par blocs</strong> :
    <div class="formula" data-nom="Matrice diagonale par blocs">$$\operatorname{Mat}_{\mathcal{B}}(u) = \begin{pmatrix} A_1 & & 0 \\ & \ddots & \\ 0 & & A_k \end{pmatrix},$$</div>
    où \(A_i\) est la matrice de l'endomorphisme induit \(u_{F_i}\). On en déduit \(\operatorname{rg} u = \sum \operatorname{rg} A_i\), \(\operatorname{tr} u = \sum \operatorname{tr} A_i\), \(\det u = \prod \det A_i\) (chapitre Déterminants) et \(\operatorname{Mat}_{\mathcal{B}}(u^m) = \operatorname{diag}(A_1^m, \ldots, A_k^m)\).
  </div>
  <div class="prop-box">
    <strong>Lectures utiles.</strong>
    <ul>
      <li>Si la matrice est <strong>triangulaire supérieure</strong>, chacun des sous-espaces \(\operatorname{Vect}(e_1, \ldots, e_k)\), pour \(k = 1, \ldots, n\), est stable : c'est l'idée de la trigonalisation (chapitre Réduction).</li>
      <li>Une forme \(\begin{pmatrix} A & 0 \\ C & D \end{pmatrix}\) (bloc nul en haut à droite) signifie que \(\operatorname{Vect}(e_{p+1}, \ldots, e_n)\) est stable.</li>
      <li>Une matrice diagonale signifie que chaque droite \(\mathbb{K}e_i\) est stable (§7).</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Exemple — compléter une base d'un sous-espace stable</strong>
    <p>On reprend l'endomorphisme \(u\) du §4 et son plan stable \(P = \operatorname{Vect}(v_1, v_2)\). On complète par \(e_3 = (0, 0, 1)\), qui n'est pas dans \(P\) : \(\mathcal{B}' = (v_1, v_2, e_3)\) est une base de \(\mathbb{R}^3\) adaptée à \(P\).</p>
    <ol>
      <li>\(u(e_3) = (0, 1, 2)\). On cherche \(\alpha v_1 + \beta v_2 + \gamma e_3 = (0, 1, 2)\), soit \(\alpha = 0\), \(-\alpha + \beta = 1\), \(-\beta + \gamma = 2\) : \(\alpha = 0\), \(\beta = 1\), \(\gamma = 3\).</li>
      <li>Avec \(u(v_1) = v_1\) et \(u(v_2) = v_1 + v_2\) :
      <div class="formula">$$\operatorname{Mat}_{\mathcal{B}'}(u) = \begin{pmatrix} 1 & 1 & 0 \\ 0 & 1 & 1 \\ 0 & 0 & 3 \end{pmatrix}.$$</div>
      Le bloc en bas à gauche est nul, comme prévu ; la matrice est même triangulaire, si bien que \(\operatorname{Vect}(v_1)\) est stable aussi.</li>
      <li>Contrôle : la trace vaut \(1 + 1 + 3 = 5\), comme celle de \(A\) (\(2 + 1 + 2\)) ; deux matrices semblables ont même trace (§8).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — lire des sous-espaces stables sur une matrice</strong>
    <p>Soit \(u\) l'endomorphisme de \(\mathbb{R}^4\) de matrice \(M = \begin{pmatrix} 1 & 0 & 2 & 0 \\ 0 & 3 & 0 & 1 \\ 4 & 0 & 5 & 0 \\ 0 & 6 & 0 & 7 \end{pmatrix}\) dans la base canonique \((e_1, e_2, e_3, e_4)\).</p>
    <ol>
      <li>Colonnes 1 et 3 : \(u(e_1) = e_1 + 4e_3\) et \(u(e_3) = 2e_1 + 5e_3\) sont dans \(F_1 = \operatorname{Vect}(e_1, e_3)\), qui est donc stable. De même, \(u(e_2) = 3e_2 + 6e_4\) et \(u(e_4) = e_2 + 7e_4\) : \(F_2 = \operatorname{Vect}(e_2, e_4)\) est stable.</li>
      <li>Dans la base réordonnée \((e_1, e_3, e_2, e_4)\), adaptée à \(\mathbb{R}^4 = F_1 \oplus F_2\), la matrice devient diagonale par blocs :
      <div class="formula">$$\begin{pmatrix} 1 & 2 & 0 & 0 \\ 4 & 5 & 0 & 0 \\ 0 & 0 & 3 & 1 \\ 0 & 0 & 6 & 7 \end{pmatrix}.$$</div></li>
      <li>Sans calcul de taille 4 : \(\det M = (5 - 8)(21 - 6) = -45\) et \(\operatorname{tr} M = 6 + 10 = 16\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : lire la forme \(\begin{pmatrix} A & B \\ 0 & C \end{pmatrix}\) comme la stabilité de \(G = \operatorname{Vect}(e_{p+1}, \ldots, e_n)\). C'est \(F = \operatorname{Vect}(e_1, \ldots, e_p)\) qui est stable ; \(G\) ne l'est que si \(B = 0\) aussi. Le bloc \(C\) n'est donc pas, en général, la matrice d'un endomorphisme induit : il représente seulement « la composante sur \(G\) » de \(u\) restreint à \(G\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · ENDOMORPHISMES QUI COMMUTENT</div>
  <h2>Quand deux endomorphismes commutent, chacun respecte les sous-espaces de l'autre</h2>
  <div class="intro">Deux endomorphismes qui commutent partagent beaucoup de sous-espaces stables. Ce principe simple est l'un des plus utilisés en réduction : il permet d'étudier \(v\) sur les sous-espaces naturels de \(u\).</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(u, v \in \mathcal{L}(E)\) tels que \(u \circ v = v \circ u\). Alors \(\ker u\) et \(\operatorname{Im} u\) sont stables par \(v\). Plus généralement, pour tout scalaire \(\lambda\), \(\ker(u - \lambda\,\mathrm{id})\) et \(\operatorname{Im}(u - \lambda\,\mathrm{id})\) sont stables par \(v\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux lignes de calcul.</span>
    <div class="content">
      <p>Si \(x \in \ker u\) : \(u\big(v(x)\big) = v\big(u(x)\big) = v(0) = 0\), donc \(v(x) \in \ker u\).</p>
      <p>Si \(y = u(x) \in \operatorname{Im} u\) : \(v(y) = v\big(u(x)\big) = u\big(v(x)\big) \in \operatorname{Im} u\).</p>
      <p>Enfin \(u - \lambda\,\mathrm{id}\) commute encore avec \(v\) (l'identité commute avec tout), et l'on applique ce qui précède.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — les matrices qui commutent avec une matrice diagonale</strong>
    <p>Soit \(\Delta = \operatorname{diag}(1, 2, 3)\) et \(B \in \mathcal{M}_3(\mathbb{R})\) telle que \(B\Delta = \Delta B\).</p>
    <ol>
      <li>\(\ker(\Delta - I_3) = \operatorname{Vect}(e_1)\), \(\ker(\Delta - 2I_3) = \operatorname{Vect}(e_2)\) et \(\ker(\Delta - 3I_3) = \operatorname{Vect}(e_3)\) sont stables par \(B\) d'après le théorème.</li>
      <li>Donc \(Be_i\) est colinéaire à \(e_i\) pour chaque \(i\) : la matrice \(B\) est diagonale.</li>
      <li>Réciproquement, deux matrices diagonales commutent. Les matrices qui commutent avec \(\Delta\) sont exactement les matrices diagonales. Vérification directe : le coefficient \((i, j)\) de \(\Delta B - B\Delta\) vaut \((d_i - d_j)\,b_{ij}\), nul si et seulement si \(b_{ij} = 0\) pour \(i \neq j\), car les \(d_i\) sont distincts.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — commuter avec un projecteur</strong>
    <p>Soit \(p\) un projecteur de \(E\) (\(p \circ p = p\)), de sorte que \(E = \operatorname{Im} p \oplus \ker p\) (chapitre Projecteurs et symétries). Alors \(v\) commute avec \(p\) si et seulement si \(\operatorname{Im} p\) et \(\ker p\) sont stables par \(v\).</p>
    <ol>
      <li>Sens direct : c'est le théorème.</li>
      <li>Réciproque : écrivons \(x = a + b\) avec \(a \in \operatorname{Im} p\) et \(b \in \ker p\). Alors \(p(x) = a\), donc \(v\big(p(x)\big) = v(a)\). D'autre part \(v(x) = v(a) + v(b)\) avec \(v(a) \in \operatorname{Im} p\) et \(v(b) \in \ker p\) par stabilité, donc \(p\big(v(x)\big) = v(a)\).</li>
      <li>Matriciellement, dans une base adaptée à \(E = \operatorname{Im} p \oplus \ker p\), les endomorphismes qui commutent avec \(p\) sont ceux dont la matrice est diagonale par blocs.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire la réciproque vraie en général. Que \(\ker u\) et \(\operatorname{Im} u\) soient stables par \(v\) n'entraîne pas que \(u\) et \(v\) commutent : pour \(u = \operatorname{diag}(1, 2)\), on a \(\ker u = \{0\}\) et \(\operatorname{Im} u = \mathbb{R}^2\), stables par tout endomorphisme, alors que seules les matrices diagonales commutent avec \(u\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DROITES STABLES ET VECTEURS PROPRES</div>
  <h2>Le premier pas vers la réduction</h2>
  <div class="intro">Les plus petits sous-espaces stables non nuls sont les droites. Une droite stable est dirigée par un vecteur que \(u\) se contente de multiplier par un scalaire : c'est la notion de vecteur propre, étudiée en détail dans le chapitre Éléments propres.</div>

  <div class="prop-box">
    <strong>Droite stable.</strong> Soit \(x \neq 0\). La droite \(D = \mathbb{K}x\) est stable par \(u\) si et seulement s'il existe un scalaire \(\lambda\) tel que \(u(x) = \lambda x\). L'endomorphisme induit sur \(D\) est alors l'homothétie de rapport \(\lambda\). On dit que \(x\) est un <strong>vecteur propre</strong> de \(u\), associé à la <strong>valeur propre</strong> \(\lambda\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le test sur une famille génératrice, avec un seul vecteur.</span>
    <div class="content"><p>\(D = \operatorname{Vect}(x)\) est stable si et seulement si \(u(x) \in D = \{\lambda x,\ \lambda \in \mathbb{K}\}\). Alors, pour tout \(y = \mu x\) de \(D\), \(u(y) = \mu\lambda x = \lambda y\) : \(u_D = \lambda\,\mathrm{id}_D\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — tous les sous-espaces stables d'un endomorphisme du plan</strong>
    <p>Soit \(u\) l'endomorphisme de \(\mathbb{R}^2\) de matrice \(\begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}\).</p>
    <ol>
      <li>En dimension 2, un sous-espace stable est \(\{0\}\), \(\mathbb{R}^2\) ou une droite stable. Cherchons les \(x = (a, b) \neq 0\) tels que \(u(x) = \lambda x\) : \((2 - \lambda)a + b = 0\) et \(a + (2 - \lambda)b = 0\).</li>
      <li>Ce système homogène a une solution non nulle si et seulement si son déterminant \((2 - \lambda)^2 - 1\) est nul, soit \(\lambda = 1\) ou \(\lambda = 3\). Pour \(\lambda = 3\) : \(b = a\) ; pour \(\lambda = 1\) : \(b = -a\).</li>
      <li>Les sous-espaces stables sont \(\{0\}\), \(\operatorname{Vect}\big((1, 1)\big)\), \(\operatorname{Vect}\big((1, -1)\big)\) et \(\mathbb{R}^2\). Dans la base \(\big((1, 1), (1, -1)\big)\), adaptée à la somme directe des deux droites stables, la matrice de \(u\) est \(\operatorname{diag}(3, 1)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une rotation n'a pas de droite stable réelle</strong>
    <p>Soit \(r\) la rotation de \(\mathbb{R}^2\) d'angle \(\theta \notin \pi\mathbb{Z}\), de matrice</p>
    <div class="formula">$$R = \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}.$$</div>
    <ol>
      <li>Géométriquement, \(r\) tourne tout vecteur non nul d'un angle qui n'est ni nul ni plat : aucune direction n'est conservée.</li>
      <li>Par le calcul : \(Rx = \lambda x\) avec \(x \neq 0\) exige \(\lambda^2 - 2\lambda\cos\theta + 1 = 0\), de discriminant \(4(\cos^2\theta - 1) \lt 0\) : aucune solution réelle.</li>
      <li>Sur \(\mathbb{C}\), en revanche, \(\lambda = \mathrm{e}^{\pm i\theta}\) convient, et l'on vérifie que \(R\begin{pmatrix} 1 \\ -i \end{pmatrix} = \mathrm{e}^{i\theta}\begin{pmatrix} 1 \\ -i \end{pmatrix}\) : l'existence de droites stables dépend du corps \(\mathbb{K}\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Vers la diagonalisation.</strong> S'il existe une base \((e_1, \ldots, e_n)\) formée de vecteurs propres, \(E\) est somme directe des droites stables \(\mathbb{K}e_i\), et la matrice de \(u\) dans cette base est diagonale (§5) : on dit que \(u\) est <strong>diagonalisable</strong>. Ce n'est pas toujours possible : l'endomorphisme de matrice \(\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}\) n'a qu'une droite stable, \(\mathbb{K}e_1\). Voir les chapitres Éléments propres et Réduction des endomorphismes.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · TRACE D'UN ENDOMORPHISME</div>
  <h2>Un nombre qui ne dépend pas de la base</h2>
  <div class="intro">La trace d'une matrice carrée (somme des coefficients diagonaux) est étudiée dans le chapitre Calcul matriciel (approfondissements), §3 : linéarité, \(\operatorname{tr}(AB) = \operatorname{tr}(BA)\), invariance par similitude. Ces propriétés permettent de définir la trace d'un endomorphisme. Ici, \(E\) est de dimension finie \(n\).</div>

  <div class="def-box">
    La <strong>trace</strong> de \(u \in \mathcal{L}(E)\) est la trace de sa matrice dans une base quelconque de \(E\) : \(\operatorname{tr} u = \operatorname{tr}\big(\operatorname{Mat}_{\mathcal{B}}(u)\big)\). Elle ne dépend pas de la base choisie, car si \(A' = P^{-1}AP\), alors
    <div class="formula">$$\begin{aligned} \operatorname{tr}(A') &= \operatorname{tr}\big(P^{-1}(AP)\big) \\ &= \operatorname{tr}\big((AP)P^{-1}\big) = \operatorname{tr}(A). \end{aligned}$$</div>
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong>
    <ul>
      <li>Linéarité : \(\operatorname{tr}(\alpha u + \beta v) = \alpha \operatorname{tr} u + \beta \operatorname{tr} v\) ; et \(\operatorname{tr}(\mathrm{id}_E) = n\).</li>
      <li>\(\operatorname{tr}(u \circ v) = \operatorname{tr}(v \circ u)\), traduction de \(\operatorname{tr}(AB) = \operatorname{tr}(BA)\).</li>
      <li>Si \(F\) est stable et si la matrice dans une base adaptée est \(\begin{pmatrix} A & B \\ 0 & C \end{pmatrix}\), alors \(\operatorname{tr} u = \operatorname{tr} A + \operatorname{tr} C\) ; si \(E = \bigoplus F_i\) avec des \(F_i\) stables, \(\operatorname{tr} u = \sum \operatorname{tr}(u_{F_i})\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Trace d'un projecteur.</strong> Si \(p \in \mathcal{L}(E)\) vérifie \(p \circ p = p\), alors
    <div class="formula" data-nom="Trace d'un projecteur">$$\operatorname{tr} p = \operatorname{rg} p.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une base adaptée à \(E = \operatorname{Im} p \oplus \ker p\).</span>
    <div class="content"><p>Un projecteur vérifie \(E = \operatorname{Im} p \oplus \ker p\), avec \(p(x) = x\) sur \(\operatorname{Im} p\) et \(p(x) = 0\) sur \(\ker p\) (démonstration dans le chapitre Projecteurs et symétries). Dans une base adaptée, sa matrice est \(\operatorname{diag}(1, \ldots, 1, 0, \ldots, 0)\), avec autant de 1 que \(\dim \operatorname{Im} p = \operatorname{rg} p\). Sa trace est donc \(\operatorname{rg} p\), dans cette base et donc dans toutes.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — trace d'un endomorphisme d'un espace de matrices</strong>
    <p>Soit \(A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}\) et \(L_A : M \mapsto AM\), endomorphisme de \(\mathcal{M}_2(\mathbb{K})\).</p>
    <ol>
      <li>Multiplier \(M\) à gauche par \(A\) agit sur chaque colonne séparément : les matrices dont la seconde colonne est nulle forment un sous-espace stable \(F_1 = \operatorname{Vect}(E_{11}, E_{21})\), et de même \(F_2 = \operatorname{Vect}(E_{12}, E_{22})\) pour la première colonne nulle.</li>
      <li>Calcul : \(AE_{11} = aE_{11} + cE_{21}\) et \(AE_{21} = bE_{11} + dE_{21}\), et de même sur \(F_2\). Dans la base \((E_{11}, E_{21}, E_{12}, E_{22})\), adaptée à \(\mathcal{M}_2(\mathbb{K}) = F_1 \oplus F_2\), la matrice de \(L_A\) est \(\operatorname{diag}(A, A)\).</li>
      <li>D'où \(\operatorname{tr} L_A = 2\operatorname{tr} A = 2(a + d)\), et aussi \(\det L_A = (\det A)^2\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — trace de la transposition</strong>
    <p>Soit \(T : M \mapsto M^\top\) sur \(\mathcal{M}_2(\mathbb{K})\). Dans la base \((E_{11}, E_{12}, E_{21}, E_{22})\) : \(T(E_{11}) = E_{11}\), \(T(E_{12}) = E_{21}\), \(T(E_{21}) = E_{12}\), \(T(E_{22}) = E_{22}\). Les coefficients diagonaux de sa matrice sont \(1, 0, 0, 1\), donc \(\operatorname{tr} T = 2\). Dans \(\mathcal{M}_n(\mathbb{K})\), on trouve \(\operatorname{tr} T = n\), ce que la décomposition en matrices symétriques et antisymétriques explique (chapitre Projecteurs et symétries).</p>
  </div>
  <div class="method-box">
    <strong>Application — l'équation \(u \circ v - v \circ u = \mathrm{id}\) n'a pas de solution</strong>
    <p>En dimension finie \(n \geq 1\), la trace du membre de gauche vaut \(\operatorname{tr}(u \circ v) - \operatorname{tr}(v \circ u) = 0\), celle du membre de droite vaut \(n\). Aucun couple d'endomorphismes ne vérifie donc cette égalité.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\operatorname{tr}(u \circ v) = \operatorname{tr} u \cdot \operatorname{tr} v\) (faux : pour \(u = v = \mathrm{id}_{\mathbb{R}^2}\), on obtient 2 d'un côté et 4 de l'autre), ou déduire \(u = 0\) de \(\operatorname{tr} u = 0\). Et la relation \(\operatorname{tr} = \operatorname{rg}\) est propre aux projecteurs : \(\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}\) est de trace 0 et de rang 1.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Dualité et polynômes d'endomorphismes</h2>
  <div class="intro">Deux notions qui prolongent naturellement le chapitre, mais que le programme de PT écarte explicitement. Elles ne sont pas exigibles.</div>
  <ul>
    <li><strong>Dual et base duale.</strong> L'espace \(E^* = \mathcal{L}(E, \mathbb{K})\) des formes linéaires a la même dimension que \(E\). À une base \((e_1, \ldots, e_n)\) correspond la base duale \((e_1^*, \ldots, e_n^*)\), où \(e_i^*\) associe à un vecteur sa \(i\)-ième coordonnée. La stabilité d'un hyperplan (§4) s'exprime alors ainsi : \(\ker \varphi\) est stable par \(u\) si et seulement si \(\varphi\) est « vecteur propre » de l'application \(\psi \mapsto \psi \circ u\), qui correspond à la transposée de la matrice.</li>
    <li><strong>Polynômes d'endomorphismes.</strong> Pour \(Q = \sum a_k X^k\), on pose \(Q(u) = \sum a_k u^k\) (avec \(u^0 = \mathrm{id}\)). Tous ces endomorphismes commutent avec \(u\), donc \(\ker Q(u)\) et \(\operatorname{Im} Q(u)\) sont stables par \(u\) (§6). Un polynôme \(Q\) tel que \(Q(u) = 0\) est dit annulateur : par exemple \(X^2 - X\) pour un projecteur. Le « lemme des noyaux » et la caractérisation des endomorphismes diagonalisables par un polynôme annulateur scindé à racines simples relèvent de ce cadre. En PT, on manipule directement \(u^2\), \(u^3\) et leurs combinaisons, sans développer cette théorie.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="al2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · APPLICATIONS LINÉAIRES 2A</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à exploiter le théorème du rang, à définir une application linéaire par morceaux, puis surtout à repérer les sous-espaces stables d'un endomorphisme, à les lire sur une matrice par blocs et à calculer une trace.</div>

  <div class="method-box"><strong>Méthode 1 — Exploiter le théorème du rang</strong>
    <ol>
      <li>Déterminer \(\ker f\) en résolvant \(f(x) = 0\), ou \(\operatorname{Im} f\) comme \(\operatorname{Vect}\big(f(e_1), \ldots, f(e_n)\big)\) pour une base \((e_i)\) de \(E\).</li>
      <li>En déduire l'autre dimension : \(\operatorname{rg} f = \dim E - \dim \ker f\).</li>
      <li>Conclure : \(f\) est surjective si \(\operatorname{rg} f = \dim F\), injective si \(\ker f = \{0\}\) ; lorsque \(\dim E = \dim F\), l'un entraîne l'autre.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f : \mathbb{R}_3[X] \to \mathbb{R}^2\), \(P \mapsto \big(P(0), P(1)\big)\). Comme \(f(1) = (1, 1)\) et \(f(X) = (0, 1)\) engendrent \(\mathbb{R}^2\), \(f\) est surjective et \(\dim \ker f = 4 - 2 = 2\) : \(\ker f = \{X(X - 1)Q,\ Q \in \mathbb{R}_1[X]\}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « injective \(\iff\) surjective » exige \(\dim E = \dim F\), finie. Et le théorème du rang ne dit pas que \(E = \ker f \oplus \operatorname{Im} f\) pour un endomorphisme : les dimensions s'additionnent, mais les deux sous-espaces peuvent se rencontrer.</div>

  <div class="method-box"><strong>Méthode 2 — Définir une application linéaire par l'image d'une base ou par recollement</strong>
    <ol>
      <li>Choisir une base \((e_1, \ldots, e_n)\) adaptée au problème (souvent formée de vecteurs dont on connaît l'image), ou une décomposition \(E = E_1 \oplus \cdots \oplus E_p\) sur laquelle on connaît \(u\) morceau par morceau.</li>
      <li>L'application linéaire existe et est unique ; pour calculer \(u(x)\), décomposer \(x\) dans cette base (ou selon la somme directe) et appliquer la linéarité.</li>
      <li>Pour obtenir la matrice dans la base canonique, calculer ainsi l'image de chaque vecteur de la base canonique.</li>
    </ol>
    <p><em>Exemple éclair :</em> l'endomorphisme \(u\) de \(\mathbb{R}^2\) tel que \(u(1, 1) = (2, 0)\) et \(u(1, -1) = (0, 4)\) vérifie \(u(e_1) = \tfrac{1}{2}\big(u(1, 1) + u(1, -1)\big) = (1, 2)\) et \(u(e_2) = \tfrac{1}{2}\big(u(1, 1) - u(1, -1)\big) = (1, -2)\) : sa matrice est \(\begin{pmatrix} 1 & 1 \\ 2 & -2 \end{pmatrix}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Montrer qu'un sous-espace est stable</strong>
    <ol>
      <li>Si \(F = \operatorname{Vect}(x_1, \ldots, x_k)\) : vérifier que chaque \(u(x_i)\) est dans \(F\) (il suffit de tester une famille génératrice).</li>
      <li>Si \(F\) est un hyperplan d'équation \(\varphi = 0\) : vérifier que \(\varphi \circ u = \lambda\varphi\) ; matriciellement, avec \(\varphi(X) = LX\), que \(LA = \lambda L\).</li>
      <li>Penser aux sous-espaces stables « gratuits » : \(\ker u\), \(\operatorname{Im} u\), \(\ker(u - \lambda\,\mathrm{id})\), et les noyaux et images de tout endomorphisme qui commute avec \(u\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(A = \begin{pmatrix} 1 & 1 & 0 \\ 1 & 2 & 1 \\ 0 & 1 & 1 \end{pmatrix}\) et le plan \(P : x - y + z = 0\), on a \(L = (1\ \ {-1}\ \ 1)\) et \(LA = (0\ \ 0\ \ 0) = 0 \cdot L\) : le plan \(P\) est stable (c'est même l'image de \(A\)).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « \(F\) stable par \(u\) » signifie \(u(F) \subset F\), pas \(u(F) = F\), et encore moins \(u(x) = x\) pour tout \(x\) de \(F\).</div>

  <div class="method-box"><strong>Méthode 4 — Écrire la matrice dans une base adaptée à un sous-espace stable</strong>
    <ol>
      <li>Prendre une base \((e_1, \ldots, e_p)\) de \(F\) stable, et exprimer chaque \(u(e_j)\) dans cette base : on obtient la matrice \(A\) de l'endomorphisme induit \(u_F\).</li>
      <li>Compléter en une base \((e_1, \ldots, e_n)\) de \(E\), exprimer les \(u(e_j)\), \(j \gt p\), dans la base complète : ce sont les blocs \(B\) et \(C\).</li>
      <li>Vérifier la forme \(\begin{pmatrix} A & B \\ 0 & C \end{pmatrix}\) et contrôler la trace (elle ne dépend pas de la base).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = \begin{pmatrix} 3 & 1 \\ -1 & 1 \end{pmatrix}\) laisse stable la droite dirigée par \(v_1 = (1, -1)\), car \(Av_1 = 2v_1\). Avec \(e_2 = (0, 1)\) : \(Ae_2 = (1, 1) = v_1 + 2e_2\), d'où la matrice \(\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}\) dans la base \((v_1, e_2)\), de trace \(4 = 3 + 1\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Lire des sous-espaces stables sur une matrice par blocs</strong>
    <ol>
      <li>Colonne \(j\) = coordonnées de \(u(e_j)\) : chercher des paquets de colonnes dont les coefficients sont nuls hors des lignes du même paquet.</li>
      <li>Un bloc nul en bas à gauche signale que \(\operatorname{Vect}(e_1, \ldots, e_p)\) est stable ; deux blocs nuls hors de la diagonale, que les deux sous-espaces le sont.</li>
      <li>Au besoin, réordonner la base pour regrouper les vecteurs d'un même sous-espace stable, puis calculer rang, trace, déterminant ou puissances bloc par bloc.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(M = \begin{pmatrix} 1 & 0 & 3 \\ 0 & 2 & 0 \\ 4 & 0 & 5 \end{pmatrix}\), \(\operatorname{Vect}(e_2)\) et \(\operatorname{Vect}(e_1, e_3)\) sont stables. Dans la base \((e_1, e_3, e_2)\), la matrice est diagonale par blocs, avec les blocs \(\begin{pmatrix} 1 & 3 \\ 4 & 5 \end{pmatrix}\) et \((2)\) : \(\det M = (5 - 12) \times 2 = -14\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la forme \(\begin{pmatrix} A & B \\ 0 & C \end{pmatrix}\) dit que les <strong>premiers</strong> vecteurs de base engendrent un sous-espace stable ; les derniers n'en engendrent un que si \(B = 0\).</div>

  <div class="method-box"><strong>Méthode 6 — Exploiter la commutation de deux endomorphismes</strong>
    <ol>
      <li>Vérifier \(u \circ v = v \circ u\) (ou \(AB = BA\)).</li>
      <li>En déduire que \(\ker u\), \(\operatorname{Im} u\) et chaque \(\ker(u - \lambda\,\mathrm{id})\) sont stables par \(v\).</li>
      <li>Si l'un de ces sous-espaces est une droite \(\mathbb{K}a\), alors \(v(a) \in \mathbb{K}a\) : \(a\) est un vecteur propre de \(v\). Dans une base adaptée à une somme directe de tels sous-espaces, la matrice de \(v\) est diagonale par blocs.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = \begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}\) et \(B = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}\) commutent (\(AB = BA = \begin{pmatrix} 3 & 3 \\ 3 & 3 \end{pmatrix}\)). Le noyau de \(A\), la droite dirigée par \((1, -1)\), est donc stable par \(B\) : en effet \(B(1, -1) = (1, -1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la réciproque est fausse en général : \(\ker u\) et \(\operatorname{Im} u\) peuvent être stables par \(v\) sans que \(u\) et \(v\) commutent.</div>

  <div class="method-box"><strong>Méthode 7 — Chercher les droites stables d'un endomorphisme</strong>
    <ol>
      <li>Une droite \(\mathbb{K}x\) (\(x \neq 0\)) est stable si et seulement si \(u(x) = \lambda x\) pour un scalaire \(\lambda\) : résoudre \((A - \lambda I_n)X = 0\) avec \(X \neq 0\).</li>
      <li>En dimension 2, ce système a une solution non nulle si et seulement si \(\det(A - \lambda I_2) = 0\) : on trouve les \(\lambda\) possibles, puis une base de chaque noyau.</li>
      <li>En dimension 2, les sous-espaces stables sont \(\{0\}\), le plan et les droites trouvées.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(A = \begin{pmatrix} 4 & -2 \\ 1 & 1 \end{pmatrix}\), \(\det(A - \lambda I_2) = \lambda^2 - 5\lambda + 6 = (\lambda - 2)(\lambda - 3)\). Les droites stables sont dirigées par \((1, 1)\) (\(\lambda = 2\)) et \((2, 1)\) (\(\lambda = 3\)) : \(A(1, 1) = (2, 2)\), \(A(2, 1) = (6, 3)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'existence de droites stables dépend du corps : une rotation du plan d'angle \(\theta \notin \pi\mathbb{Z}\) n'en a aucune sur \(\mathbb{R}\), mais en a deux sur \(\mathbb{C}\).</div>

  <div class="method-box"><strong>Méthode 8 — Calculer la trace d'un endomorphisme</strong>
    <ol>
      <li>Choisir la base où la matrice est la plus simple : base canonique, base adaptée à des sous-espaces stables, base de vecteurs propres.</li>
      <li>Seuls les coefficients diagonaux comptent : pour chaque vecteur \(e_j\) de la base, lire la coordonnée de \(u(e_j)\) <strong>sur \(e_j\)</strong> ; une matrice triangulaire suffit.</li>
      <li>Avec des sous-espaces stables \(E = \bigoplus F_i\) : \(\operatorname{tr} u = \sum \operatorname{tr}(u_{F_i})\) ; pour un projecteur : \(\operatorname{tr} p = \operatorname{rg} p\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(u : P \mapsto P(2X)\) sur \(\mathbb{R}_2[X]\), \(u(X^k) = 2^kX^k\) : la matrice est \(\operatorname{diag}(1, 2, 4)\) et \(\operatorname{tr} u = 7\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Conclure grâce à la trace</strong>
    <ol>
      <li>Pour une égalité entre endomorphismes (ou matrices), prendre la trace des deux membres : on obtient une condition nécessaire.</li>
      <li>Utiliser \(\operatorname{tr}(u \circ v) = \operatorname{tr}(v \circ u)\), \(\operatorname{tr}(\mathrm{id}_E) = \dim E\) et l'invariance par changement de base.</li>
      <li>Pour un endomorphisme tel que \(u \circ u = u\), la trace donne le rang sans calcul.</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(A \in \mathcal{M}_3(\mathbb{R})\) vérifie \(A^2 = A\) et \(\operatorname{tr} A = 2\), alors \(\operatorname{rg} A = 2\) et \(\dim \ker A = 1\). Et \(AB - BA = I_3\) est impossible : la trace du membre de gauche est nulle, celle de droite vaut 3.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\operatorname{tr}(u \circ v) \neq \operatorname{tr} u \times \operatorname{tr} v\) en général, une trace nulle n'implique pas \(u = 0\), et l'égalité \(\operatorname{tr} = \operatorname{rg}\) est propre aux projecteurs.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="al2-exos">
<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Rang et noyau</h3>
  <div class="statement">Soit \(f : \mathbb{R}^3 \to \mathbb{R}^2\), \(f(x, y, z) = (x + y, y + z)\). Déterminer \(\ker f\), \(\operatorname{rg} f\), et conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>\(f(x, y, z) = 0\) équivaut à \(x = -y\) et \(z = -y\), donc \(\ker f = \operatorname{Vect}\big((-1, 1, -1)\big)\), de dimension \(1\).</p>
  <p>Le théorème du rang donne \(\operatorname{rg} f = 3 - 1 = 2 = \dim \mathbb{R}^2\) : \(f\) est <strong>surjective</strong>, mais pas injective (son noyau n'est pas nul).</p></div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Formes coordonnées dans une base</h3>
  <div class="statement">Dans \(\mathbb{R}^2\), on considère la base \(\mathcal{B} = (v_1, v_2)\) avec \(v_1 = (1, 1)\) et \(v_2 = (1, -1)\). Pour \(x \in \mathbb{R}^2\), on note \(\varphi_1(x)\) et \(\varphi_2(x)\) ses coordonnées dans \(\mathcal{B}\) : \(x = \varphi_1(x)v_1 + \varphi_2(x)v_2\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\varphi_1(x, y)\) et \(\varphi_2(x, y)\), vérifier que ce sont des formes linéaires et calculer les coordonnées de \((3, 5)\) dans \(\mathcal{B}\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(\ker \varphi_1\) et \(\ker \varphi_2\).</div>
  <div class="q"><strong>Q3.</strong> Que deviennent ces formes pour la base canonique \((e_1, e_2)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> On résout \(\alpha(1, 1) + \beta(1, -1) = (x, y)\), soit \(\alpha + \beta = x\) et \(\alpha - \beta = y\) : \(\varphi_1(x, y) = \tfrac{x + y}{2}\) et \(\varphi_2(x, y) = \tfrac{x - y}{2}\). Ce sont des formes linéaires (de la forme \(a x + b y\)). Pour \((3, 5)\) : \(\varphi_1 = 4\), \(\varphi_2 = -1\), et l'on vérifie que \(4(1, 1) - (1, -1) = (3, 5)\).</p>
  <p><strong>Q2.</strong> \(\ker \varphi_1\) est la droite d'équation \(x + y = 0\), c'est-à-dire \(\operatorname{Vect}(v_2)\) ; de même \(\ker \varphi_2 = \operatorname{Vect}(v_1)\). Ce sont deux hyperplans de \(\mathbb{R}^2\) (des droites) : la \(i\)-ième forme coordonnée s'annule sur les autres vecteurs de la base.</p>
  <p><strong>Q3.</strong> Dans la base canonique, les formes coordonnées sont \((x, y) \mapsto x\) et \((x, y) \mapsto y\) ; la première vaut \(3\) en \((3, 5)\). La famille des formes coordonnées d'une base s'appelle sa « base duale » : ce vocabulaire est hors programme, mais les formes coordonnées elles-mêmes servent à écrire des équations (chapitre Espaces vectoriels, approfondissements, §7).</p></div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Une seule droite stable</h3>
  <div class="statement">Soit \(u\) l'endomorphisme de \(\mathbb{R}^2\) de matrice \(\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}\). Montrer que \(D = \operatorname{Vect}\big((1, 0)\big)\) est stable par \(u\), et qu'aucune autre droite ne l'est.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>\(u(1, 0) = (2, 0) \in D\) : \(D\) est stable. Une droite stable est dirigée par un vecteur \(x = (a, b) \neq 0\) tel que \(u(x) = \lambda x\), soit \(2a + b = \lambda a\) et \(2b = \lambda b\). Si \(b \neq 0\), la seconde équation donne \(\lambda = 2\), puis la première \(b = 0\) : contradiction. Donc \(b = 0\) et \(x \in D\).</p>
  <p>\(D\) est la <strong>seule</strong> droite stable : elle n'a donc pas de supplémentaire stable, et il n'existe pas de base de \(\mathbb{R}^2\) formée de vecteurs propres de \(u\) (\(u\) n'est pas diagonalisable).</p></div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Un endomorphisme égal à son carré</h3>
  <div class="statement">Soit \(E\) de dimension finie \(n\) et \(u \in \mathcal{L}(E)\) tel que \(u \circ u = u\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\operatorname{Im} u\) et \(\ker u\) sont stables par \(u\), et déterminer les endomorphismes induits.</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(E = \operatorname{Im} u \oplus \ker u\).</div>
  <div class="q"><strong>Q3.</strong> En déduire la matrice de \(u\) dans une base adaptée, puis que \(\operatorname{tr} u = \operatorname{rg} u\).</div>
  <div class="q"><strong>Q4.</strong> Application : vérifier que \(A = \begin{pmatrix} 2 & -2 \\ 1 & -1 \end{pmatrix}\) vérifie \(A^2 = A\), et en déduire son rang sans calcul.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Le noyau et l'image d'un endomorphisme sont toujours stables par lui. Si \(y = u(z) \in \operatorname{Im} u\), alors \(u(y) = u^2(z) = u(z) = y\) : l'endomorphisme induit sur \(\operatorname{Im} u\) est l'identité. Sur \(\ker u\), l'endomorphisme induit est nul.</p>
  <p><strong>Q2.</strong> Pour tout \(x\), \(x = u(x) + \big(x - u(x)\big)\), avec \(u(x) \in \operatorname{Im} u\) et \(u\big(x - u(x)\big) = u(x) - u^2(x) = 0\). Si \(y \in \operatorname{Im} u \cap \ker u\), alors \(y = u(y) = 0\) d'après Q1. D'où la somme directe.</p>
  <p><strong>Q3.</strong> Dans une base obtenue en concaténant une base de \(\operatorname{Im} u\) (de \(r = \operatorname{rg} u\) vecteurs) et une base de \(\ker u\), la matrice est diagonale par blocs, de blocs \(I_r\) et \(0\) (matrices des endomorphismes induits). Sa trace vaut \(r\) : \(\operatorname{tr} u = \operatorname{rg} u\), dans cette base et donc dans toutes.</p>
  <p><strong>Q4.</strong> \(A^2 = \begin{pmatrix} 4 - 2 & -4 + 2 \\ 2 - 1 & -2 + 1 \end{pmatrix} = A\), donc \(\operatorname{rg} A = \operatorname{tr} A = 2 - 1 = 1\) (ses colonnes sont d'ailleurs proportionnelles). On n'a utilisé ici que \(u^2\) : la théorie des polynômes d'endomorphismes est hors programme.</p></div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ☆ ☆</span>
  <h3>Un plan stable et sa base adaptée</h3>
  <div class="statement">Soit \(u\) l'endomorphisme de \(\mathbb{R}^3\) de matrice \(A = \begin{pmatrix} 1 & 2 & 1 \\ 0 & 3 & 1 \\ -1 & 2 & 3 \end{pmatrix}\) dans la base canonique, et le plan \(P : x - z = 0\), de base \(w_1 = (1, 0, 1)\), \(w_2 = (0, 1, 0)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(P\) est stable par \(u\) de deux façons : par les images de \(w_1, w_2\), puis par le critère \(LA = \lambda L\).</div>
  <div class="q"><strong>Q2.</strong> Donner la matrice de l'endomorphisme induit \(u_P\) dans la base \((w_1, w_2)\).</div>
  <div class="q"><strong>Q3.</strong> Écrire la matrice de \(u\) dans la base \(\mathcal{B}' = (w_1, w_2, e_1)\) et contrôler sa trace. La droite \(\operatorname{Vect}(e_1)\) est-elle stable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(Aw_1 = (2, 1, 2) = 2w_1 + w_2\) et \(Aw_2 = (2, 3, 2) = 2w_1 + 3w_2\) sont dans \(P\) : le plan est stable (test sur une base). Autrement : \(P\) a pour équation \(LX = 0\) avec \(L = (1\ \ 0\ \ {-1})\), et \(LA\) (première ligne moins troisième ligne de \(A\)) vaut \((2\ \ 0\ \ {-2}) = 2L\).</p>
  <p><strong>Q2.</strong> Les coordonnées de \(u(w_1)\) et \(u(w_2)\) dans \((w_1, w_2)\) donnent les colonnes : \(\operatorname{Mat}(u_P) = \begin{pmatrix} 2 & 2 \\ 1 & 3 \end{pmatrix}\).</p>
  <p><strong>Q3.</strong> \(e_1 \notin P\), donc \(\mathcal{B}'\) est une base adaptée. \(Ae_1 = (1, 0, -1)\) ; on cherche \(\alpha w_1 + \beta w_2 + \gamma e_1 = (1, 0, -1)\), soit \((\alpha + \gamma, \beta, \alpha) = (1, 0, -1)\) : \(\alpha = -1\), \(\beta = 0\), \(\gamma = 2\). D'où</p>
  <div class="formula">$$\operatorname{Mat}_{\mathcal{B}'}(u) = \begin{pmatrix} 2 & 2 & -1 \\ 1 & 3 & 0 \\ 0 & 0 & 2 \end{pmatrix},$$</div>
  <p>triangulaire par blocs comme prévu, de trace \(7 = 1 + 3 + 3 = \operatorname{tr} A\). Le coefficient en bas à droite est le \(\lambda = 2\) du critère. Enfin \(Ae_1 = (1, 0, -1)\) n'est pas colinéaire à \(e_1\) : \(\operatorname{Vect}(e_1)\) n'est pas stable (le bloc \(B = \begin{pmatrix} -1 \\ 0 \end{pmatrix}\) n'est pas nul).</p></div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Les matrices qui commutent avec \(\operatorname{diag}(1, 1, 2)\)</h3>
  <div class="statement">Soit \(D = \operatorname{diag}(1, 1, 2) \in \mathcal{M}_3(\mathbb{R})\), et \(\mathcal{C}\) l'ensemble des matrices \(B\) telles que \(BD = DB\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer \(\ker(D - I_3)\) et \(\ker(D - 2I_3)\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que toute \(B \in \mathcal{C}\) est de la forme \(\begin{pmatrix} K & 0 \\ 0 & c \end{pmatrix}\) avec \(K \in \mathcal{M}_2(\mathbb{R})\) et \(c \in \mathbb{R}\).</div>
  <div class="q"><strong>Q3.</strong> Montrer la réciproque, et en déduire que \(\mathcal{C}\) est un sous-espace de \(\mathcal{M}_3(\mathbb{R})\), dont on donnera la dimension.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(D - I_3 = \operatorname{diag}(0, 0, 1)\) : \(\ker(D - I_3) = \operatorname{Vect}(e_1, e_2)\). \(D - 2I_3 = \operatorname{diag}(-1, -1, 0)\) : \(\ker(D - 2I_3) = \operatorname{Vect}(e_3)\).</p>
  <p><strong>Q2.</strong> Si \(B\) commute avec \(D\), elle commute avec \(D - I_3\) et \(D - 2I_3\) ; les noyaux de ces matrices sont donc stables par \(B\). Ainsi \(Be_1, Be_2 \in \operatorname{Vect}(e_1, e_2)\) : les deux premières colonnes de \(B\) ont une troisième coordonnée nulle. Et \(Be_3 \in \operatorname{Vect}(e_3)\) : la troisième colonne est de la forme \((0, 0, c)\). D'où la forme diagonale par blocs annoncée.</p>
  <p><strong>Q3.</strong> Par produit par blocs, avec \(D = \begin{pmatrix} I_2 & 0 \\ 0 & 2 \end{pmatrix}\) :</p>
  <div class="formula">$$\begin{pmatrix} K & 0 \\ 0 & c \end{pmatrix}\begin{pmatrix} I_2 & 0 \\ 0 & 2 \end{pmatrix} = \begin{pmatrix} K & 0 \\ 0 & 2c \end{pmatrix} = \begin{pmatrix} I_2 & 0 \\ 0 & 2 \end{pmatrix}\begin{pmatrix} K & 0 \\ 0 & c \end{pmatrix}.$$</div>
  <p>Donc \(\mathcal{C}\) est exactement l'ensemble de ces matrices : c'est \(\operatorname{Vect}(E_{11}, E_{12}, E_{21}, E_{22}, E_{33})\), un sous-espace de dimension 5. Comparer avec \(\operatorname{diag}(1, 2, 3)\) (cours, §6), dont le commutant, formé des matrices diagonales, est de dimension 3 : plus les sous-espaces \(\ker(D - \lambda I_3)\) sont gros, plus le commutant l'est.</p></div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Tous les sous-espaces stables d'un endomorphisme de \(\mathbb{R}^3\)</h3>
  <div class="statement">Soit \(u\) l'endomorphisme de \(\mathbb{R}^3\) de matrice \(A = \begin{pmatrix} 2 & 1 & 0 \\ 0 & 2 & 0 \\ 0 & 0 & 3 \end{pmatrix}\) dans la base canonique \((e_1, e_2, e_3)\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer les droites stables par \(u\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les plans stables par \(u\) (on cherchera leurs équations \(LX = 0\) à l'aide du critère \(LA = \lambda L\)).</div>
  <div class="q"><strong>Q3.</strong> Faire la liste de tous les sous-espaces stables. Lesquels possèdent un supplémentaire stable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> On cherche \(X = (x, y, z) \neq 0\) avec \(AX = \lambda X\) : \(2x + y = \lambda x\), \(2y = \lambda y\), \(3z = \lambda z\). Si \(z \neq 0\), alors \(\lambda = 3\), d'où \(y = 0\) (deuxième équation) puis \(x = 0\) (première) : \(X \in \operatorname{Vect}(e_3)\). Si \(z = 0\) et \(y \neq 0\), alors \(\lambda = 2\) et la première équation donne \(y = 0\) : impossible. Reste \(y = z = 0\) : \(X \in \operatorname{Vect}(e_1)\). Les droites stables sont \(\operatorname{Vect}(e_1)\) et \(\operatorname{Vect}(e_3)\).</p>
  <p><strong>Q2.</strong> Un plan est le noyau d'une ligne \(L = (a\ \ b\ \ c)\) non nulle, et il est stable si et seulement si \(LA = \lambda L\), soit \((2a,\ a + 2b,\ 3c) = (\lambda a, \lambda b, \lambda c)\). Si \(c \neq 0\) : \(\lambda = 3\), puis \(a = 0\) et \(b = 0\) ; \(L = (0\ \ 0\ \ 1)\), plan \(z = 0\). Si \(c = 0\) et \(a \neq 0\) : \(\lambda = 2\), puis \(a = 0\), contradiction. Si \(c = a = 0\) : \(b \neq 0\), \(\lambda = 2\) convient ; \(L = (0\ \ 1\ \ 0)\), plan \(y = 0\). Les plans stables sont \(\operatorname{Vect}(e_1, e_2)\) et \(\operatorname{Vect}(e_1, e_3)\).</p>
  <p><strong>Q3.</strong> Les sous-espaces stables sont \(\{0\}\), \(\operatorname{Vect}(e_1)\), \(\operatorname{Vect}(e_3)\), \(\operatorname{Vect}(e_1, e_2)\), \(\operatorname{Vect}(e_1, e_3)\) et \(\mathbb{R}^3\). Un supplémentaire stable d'une droite stable doit être un plan stable qui ne la contient pas, et inversement :</p>
  <ul>
    <li>\(\operatorname{Vect}(e_3)\) et \(\operatorname{Vect}(e_1, e_2)\) sont supplémentaires et tous deux stables ;</li>
    <li>\(\operatorname{Vect}(e_1)\) est contenue dans les deux plans stables : elle n'a pas de supplémentaire stable ;</li>
    <li>\(\operatorname{Vect}(e_1, e_3)\) contient les deux droites stables : il n'a pas de supplémentaire stable.</li>
  </ul>
  <p>Ce sont les traces du bloc \(\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}\), qui n'a qu'une droite stable (exercice 3).</p></div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Les sous-espaces stables par la dérivation</h3>
  <div class="statement">Soit \(n \geq 1\) et \(D : P \mapsto P'\), endomorphisme de \(\mathbb{R}_n[X]\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathbb{R}_k[X]\) est stable par \(D\) pour tout \(k \in \{0, \ldots, n\}\), et lire ce résultat sur la matrice de \(D\) dans la base canonique.</div>
  <div class="q"><strong>Q2.</strong> Soit \(F \neq \{0\}\) un sous-espace stable par \(D\), et \(P \in F\) de degré \(k\) maximal parmi les éléments de \(F\). Montrer que \(F = \mathbb{R}_k[X]\).</div>
  <div class="q"><strong>Q3.</strong> En déduire tous les sous-espaces stables par \(D\), et les droites stables.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> La dérivée d'un polynôme de degré au plus \(k\) est de degré au plus \(k - 1\) : \(D(\mathbb{R}_k[X]) \subset \mathbb{R}_k[X]\). Dans la base \((1, X, \ldots, X^n)\), \(D(X^j) = jX^{j-1}\) : la matrice est triangulaire supérieure (et même à diagonale nulle), ce qui traduit la stabilité de chaque \(\operatorname{Vect}(1, \ldots, X^k) = \mathbb{R}_k[X]\).</p>
  <p><strong>Q2.</strong> Par maximalité, tout élément de \(F\) est de degré au plus \(k\) : \(F \subset \mathbb{R}_k[X]\). Comme \(F\) est stable, \(P, P', \ldots, P^{(k)}\) sont dans \(F\). Ces \(k + 1\) polynômes ont des degrés \(k, k - 1, \ldots, 0\) deux à deux distincts (la dérivée \(j\)-ième de \(P\) est de degré \(k - j\)) : ils forment une famille libre de \(\mathbb{R}_k[X]\), qui est de dimension \(k + 1\), donc une base. Ainsi \(\mathbb{R}_k[X] \subset F\), et \(F = \mathbb{R}_k[X]\).</p>
  <p><strong>Q3.</strong> Les sous-espaces stables sont \(\{0\}, \mathbb{R}_0[X], \mathbb{R}_1[X], \ldots, \mathbb{R}_n[X]\) : il y en a \(n + 2\), emboîtés. La seule droite stable est \(\mathbb{R}_0[X]\), celle des constantes (vecteurs propres de \(D\), pour la valeur propre 0). Aucun \(\mathbb{R}_k[X]\) avec \(0 \leq k \lt n\) n'a de supplémentaire stable, puisque les sous-espaces stables sont emboîtés.</p></div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Traces d'endomorphismes de polynômes et de matrices</h3>
  <div class="q"><strong>Q1.</strong> Calculer la trace de \(u : P \mapsto (X + 1)P'\), endomorphisme de \(\mathbb{R}_3[X]\).</div>
  <div class="q"><strong>Q2.</strong> Sur \(\mathcal{M}_n(\mathbb{R})\), soit \(\psi(M) = \operatorname{tr}(M)\,I_n\) et \(\varphi(M) = M + \operatorname{tr}(M)\,I_n\). Montrer que \(\psi \circ \psi = n\,\psi\), en déduire \(\operatorname{tr}\psi\), puis \(\operatorname{tr}\varphi\).</div>
  <div class="q"><strong>Q3.</strong> Montrer qu'il n'existe pas d'endomorphismes \(f, g\) de \(\mathbb{R}_3[X]\) tels que \(f \circ g - g \circ f = u\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(u(X^k) = (X + 1)kX^{k-1} = kX^k + kX^{k-1}\) : la matrice dans la base canonique est triangulaire supérieure, de diagonale \((0, 1, 2, 3)\). Donc \(\operatorname{tr} u = 6\).</p>
  <p><strong>Q2.</strong> Comme \(\operatorname{tr}(I_n) = n\) :</p>
  <div class="formula">$$\psi\big(\psi(M)\big) = \operatorname{tr}\big(\operatorname{tr}(M)I_n\big)I_n = n\operatorname{tr}(M)I_n = n\,\psi(M).$$</div>
  <p>Ainsi \(\tfrac{1}{n}\psi\) vérifie \(\big(\tfrac{1}{n}\psi\big)^2 = \tfrac{1}{n}\psi\) : c'est un projecteur, d'image la droite \(\mathbb{R}I_n\), donc de rang 1, et \(\operatorname{tr}\big(\tfrac{1}{n}\psi\big) = 1\). D'où \(\operatorname{tr}\psi = n\), et par linéarité de la trace \(\operatorname{tr}\varphi = \operatorname{tr}(\mathrm{id}) + \operatorname{tr}\psi = n^2 + n\).</p>
  <p>Contrôle direct : dans la base \((E_{ij})\), la coordonnée de \(\psi(E_{ij}) = \delta_{ij}I_n\) sur \(E_{ij}\) vaut 1 si \(i = j\), 0 sinon ; la somme vaut bien \(n\).</p>
  <p><strong>Q3.</strong> On aurait \(\operatorname{tr} u = \operatorname{tr}(f \circ g) - \operatorname{tr}(g \circ f) = 0\), alors que \(\operatorname{tr} u = 6\).</p></div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Sous-espaces stables, commutant et traces d'un endomorphisme de \(\mathbb{R}_3[X]\)</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : sous-espaces stables, matrices par blocs, endomorphismes qui commutent, trace).</div>
  <div class="statement">On note \(E = \mathbb{R}_3[X]\), \(\mathcal{B} = (1, X, X^2, X^3)\) sa base canonique et, pour \(P \in E\), \(u(P) = (X - 1)P'\). On note enfin \(H = \{P \in E,\ P(1) = 0\}\).</div>

  <p class="exo-part">Partie A — Étude de \(u\)</p>
  <div class="q"><strong>A1.</strong> Montrer que \(u\) est un endomorphisme de \(E\) et écrire sa matrice \(U\) dans \(\mathcal{B}\). Quels sous-espaces stables cette matrice fait-elle apparaître ?</div>
  <div class="q"><strong>A2.</strong> Déterminer \(\ker u\) et \(\operatorname{Im} u\). Montrer que \(E = \ker u \oplus \operatorname{Im} u\).</div>
  <div class="q"><strong>A3.</strong> Montrer que l'hyperplan \(H\) est stable par \(u\) à l'aide de la forme linéaire \(\varphi : P \mapsto P(1)\).</div>

  <p class="exo-part">Partie B — Une base adaptée à des droites stables</p>
  <div class="q"><strong>B1.</strong> Pour \(k \in \{0, 1, 2, 3\}\), calculer \(u\big((X - 1)^k\big)\). En déduire que \(\mathcal{B}' = \big(1, X - 1, (X - 1)^2, (X - 1)^3\big)\) est une base de \(E\) dans laquelle la matrice de \(u\) est diagonale.</div>
  <div class="q"><strong>B2.</strong> Montrer que \(\ker(u - k\,\mathrm{id}) = \operatorname{Vect}\big((X - 1)^k\big)\) pour chaque \(k\), puis que les droites stables par \(u\) sont exactement ces quatre droites.</div>

  <p class="exo-part">Partie C — Les endomorphismes qui commutent avec \(u\)</p>
  <div class="q"><strong>C1.</strong> Soit \(v \in \mathcal{L}(E)\) tel que \(u \circ v = v \circ u\). Montrer que la matrice de \(v\) dans \(\mathcal{B}'\) est diagonale.</div>
  <div class="q"><strong>C2.</strong> Montrer la réciproque. En déduire que l'ensemble des endomorphismes qui commutent avec \(u\) est un sous-espace de \(\mathcal{L}(E)\) de dimension 4.</div>
  <div class="q"><strong>C3.</strong> Soit \(w : P \mapsto P(2X - 1)\). Montrer que \(w\) commute avec \(u\). La dérivation \(D : P \mapsto P'\) commute-t-elle avec \(u\) ?</div>

  <p class="exo-part">Partie D — Traces</p>
  <div class="q"><strong>D1.</strong> Calculer \(\operatorname{tr} u\) de deux façons, puis \(\operatorname{tr} w\) de deux façons.</div>
  <div class="q"><strong>D2.</strong> Soit \(\pi : P \mapsto P - P(1)\). Montrer que \(\pi\) est la projection sur \(H\) parallèlement à \(\ker u\), qu'elle commute avec \(u\), et vérifier que \(\operatorname{tr}\pi = \operatorname{rg}\pi\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>A1.</strong> \(u\) est linéaire (la dérivation l'est, et multiplier par \(X - 1\) aussi) ; si \(\deg P \leq 3\), \(\deg\big((X - 1)P'\big) \leq 3\) : \(u \in \mathcal{L}(E)\). Comme \(u(X^k) = kX^k - kX^{k-1}\) :</p>
  <div class="formula">$$U = \begin{pmatrix} 0 & -1 & 0 & 0 \\ 0 & 1 & -2 & 0 \\ 0 & 0 & 2 & -3 \\ 0 & 0 & 0 & 3 \end{pmatrix}.$$</div>
  <p>\(U\) est triangulaire supérieure : chacun des sous-espaces \(\operatorname{Vect}(1, \ldots, X^k) = \mathbb{R}_k[X]\) est stable par \(u\).</p>
  <p><strong>A2.</strong> \(u(P) = 0\) équivaut à \(P' = 0\) (un polynôme multiplié par \(X - 1\) n'est nul que s'il est nul) : \(\ker u = \mathbb{R}_0[X]\). Tout \(u(P)\) s'annule en 1, donc \(\operatorname{Im} u \subset H\) ; comme \(\operatorname{rg} u = 4 - 1 = 3 = \dim H\) (hyperplan, noyau de \(\varphi \neq 0\)), \(\operatorname{Im} u = H\). Enfin \(1 \notin H\), donc la droite \(\mathbb{R}_0[X]\) est un supplémentaire de \(H\) : \(E = \ker u \oplus \operatorname{Im} u\).</p>
  <p><strong>A3.</strong> \(\varphi\big(u(P)\big) = (1 - 1)P'(1) = 0\) pour tout \(P\) : \(\varphi \circ u = 0 = 0 \cdot \varphi\), et le critère de stabilité d'un hyperplan s'applique avec \(\lambda = 0\). (On le savait aussi : \(H = \operatorname{Im} u\).)</p>
  <p><strong>B1.</strong> \(u\big((X - 1)^k\big) = (X - 1) \cdot k(X - 1)^{k-1}\), soit \(k(X - 1)^k\). Les quatre polynômes de \(\mathcal{B}'\) sont de degrés \(0, 1, 2, 3\) distincts : ils forment une famille libre de 4 vecteurs, donc une base de \(E\), et \(\operatorname{Mat}_{\mathcal{B}'}(u) = \operatorname{diag}(0, 1, 2, 3)\).</p>
  <p><strong>B2.</strong> Dans \(\mathcal{B}'\), la matrice de \(u - k\,\mathrm{id}\) est \(\operatorname{diag}(-k, 1 - k, 2 - k, 3 - k)\), dont seul le \(k\)-ième coefficient (en numérotant de 0) est nul : son noyau est la droite \(\operatorname{Vect}\big((X - 1)^k\big)\). Une droite stable est dirigée par un \(P \neq 0\) tel que \(u(P) = \lambda P\) ; en écrivant \(P = \sum_j c_j(X - 1)^j\), cela donne \((j - \lambda)c_j = 0\) pour tout \(j\). Deux coefficients \(c_j\) non nuls imposeraient deux valeurs de \(\lambda\) : un seul est non nul, et \(P\) dirige l'une des quatre droites.</p>
  <p><strong>C1.</strong> \(v\) commute avec \(u - k\,\mathrm{id}\), donc laisse stable son noyau \(\operatorname{Vect}\big((X - 1)^k\big)\) : \(v\big((X - 1)^k\big)\) est colinéaire à \((X - 1)^k\), pour chaque \(k\). La matrice de \(v\) dans \(\mathcal{B}'\) est donc diagonale.</p>
  <p><strong>C2.</strong> Deux matrices diagonales commutent : si \(\operatorname{Mat}_{\mathcal{B}'}(v)\) est diagonale, \(v \circ u = u \circ v\). Le commutant de \(u\) est donc formé des endomorphismes dont la matrice dans \(\mathcal{B}'\) est diagonale : il correspond aux matrices diagonales de \(\mathcal{M}_4(\mathbb{R})\), un sous-espace de dimension 4.</p>
  <p><strong>C3.</strong> \(w\) est linéaire et conserve le degré, donc \(w \in \mathcal{L}(E)\) ; de plus \((2X - 1) - 1 = 2(X - 1)\), d'où \(w\big((X - 1)^k\big) = 2^k(X - 1)^k\). La matrice de \(w\) dans \(\mathcal{B}'\) est \(\operatorname{diag}(1, 2, 4, 8)\) : \(w\) commute avec \(u\). En revanche \(D\big((X - 1)^2\big) = 2(X - 1)\) n'est pas colinéaire à \((X - 1)^2\) : \(D\) ne commute pas avec \(u\).</p>
  <p><strong>D1.</strong> \(\operatorname{tr} u = 0 + 1 + 2 + 3 = 6\), sur la diagonale de \(U\) comme sur celle de \(\operatorname{diag}(0, 1, 2, 3)\). De même \(\operatorname{tr} w = 1 + 2 + 4 + 8 = 15\) ; dans la base \(\mathcal{B}\), \(w(X^k) = (2X - 1)^k\) a pour coefficient dominant \(2^k\), la matrice est triangulaire supérieure de diagonale \((1, 2, 4, 8)\) : même trace.</p>
  <p><strong>D2.</strong> \(P = \big(P - P(1)\big) + P(1)\) est la décomposition de \(P\) selon \(E = H \oplus \mathbb{R}_0[X]\), et \(\ker u = \mathbb{R}_0[X]\) : \(\pi\) est la projection sur \(H\) parallèlement à \(\ker u\). Dans \(\mathcal{B}'\), \(\pi(1) = 0\) et \(\pi\big((X - 1)^k\big) = (X - 1)^k\) pour \(k \geq 1\) : sa matrice est \(\operatorname{diag}(0, 1, 1, 1)\), diagonale, donc \(\pi\) commute avec \(u\) (C2). Enfin \(\operatorname{tr}\pi = 3 = \dim H = \operatorname{rg}\pi\).</p></div>
</div>
