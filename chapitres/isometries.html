<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Matrice orthogonale ?</h3>
  <div class="statement">Soit \(A = \dfrac{1}{\sqrt2}\begin{pmatrix} 1 & -1 \\ 1 & 1 \end{pmatrix}\), dans \(\mathbb{R}^2\) muni de sa structure euclidienne canonique et orienté par sa base canonique.</div>
  <div class="q"><strong>Q1.</strong> \(A\) est-elle orthogonale ?</div>
  <div class="q"><strong>Q2.</strong> Est-elle directe ou indirecte ? Quelle est sa nature géométrique ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les colonnes \(\frac{1}{\sqrt2}(1, 1)\) et \(\frac{1}{\sqrt2}(-1, 1)\) sont unitaires (\(\frac{1 + 1}{2} = 1\)) et orthogonales (\(-1 + 1 = 0\)) : \(A^\top A = I_2\), \(A\) est orthogonale.</p>
    <p><strong>Q2.</strong> \(\det A = \frac12(1 + 1) = 1\) : \(A\) est directe, donc de la forme \(R(\theta)\) avec \(\cos\theta = \frac{1}{\sqrt2}\) et \(\sin\theta = \frac{1}{\sqrt2}\). C'est la <strong>rotation</strong> d'angle \(\theta = \frac\pi4\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Axe et angle d'une rotation de l'espace</h3>
  <div class="statement">Une matrice \(A \in SO(3)\) vérifie \(\operatorname{tr}(A) = 0\) (\(\mathbb{R}^3\) est orienté par sa base canonique).</div>
  <div class="q"><strong>Q1.</strong> Que peut-on dire de l'angle de la rotation ?</div>
  <div class="q"><strong>Q2.</strong> Comment trouver l'axe, puis le signe de l'angle ?</div>
  <div class="q"><strong>Q3.</strong> Application : \(A = \begin{pmatrix} 0 & 0 & 1 \\ -1 & 0 & 0 \\ 0 & -1 & 0\end{pmatrix}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\operatorname{tr}(A) = 1 + 2\cos\theta = 0\) donne \(\cos\theta = -\frac12\), donc \(\theta = \frac{2\pi}{3}\) ou \(\theta = -\frac{2\pi}{3}\) (à \(2\pi\) près). La trace ne fixe pas le signe : il dépend de l'orientation choisie sur l'axe.</p>
    <p><strong>Q2.</strong> Comme \(A \neq I_3\) (sa trace n'est pas 3), l'axe est la droite \(\operatorname{Ker}(A - I_3)\) des vecteurs invariants (sous-espace propre de la valeur propre 1). On l'oriente par un vecteur unitaire \(k\), puis on choisit \(x\) hors de l'axe : \(\sin\theta\) a le signe de \(\det(x, Ax, k)\).</p>
    <p><strong>Q3.</strong> Les colonnes \((0, -1, 0)\), \((0, 0, -1)\), \((1, 0, 0)\) sont orthonormées et \(\det A = 1\) (développer selon la première ligne) : \(A \in SO(3)\), de trace nulle. Le système \((A - I_3)X = 0\) s'écrit \(-x + z = 0\), \(-x - y = 0\), \(-y - z = 0\) : l'axe est dirigé par \((1, -1, 1)\), et l'on prend \(k = \frac{1}{\sqrt3}(1, -1, 1)\). Avec \(x = e_1\), \(Ae_1 = (0, -1, 0)\) et</p>
    <div class="formula">$$\det(e_1, Ae_1, k) = \frac{1}{\sqrt3}\begin{vmatrix} 1 & 0 & 1 \\ 0 & -1 & -1 \\ 0 & 0 & 1\end{vmatrix} = -\frac{1}{\sqrt3} \lt 0 .$$</div>
    <p>Donc \(\sin\theta \lt 0\) : \(A\) est la rotation d'angle \(-\frac{2\pi}{3}\) autour de l'axe orienté par \((1, -1, 1)\), ou, ce qui revient au même, d'angle \(\frac{2\pi}{3}\) autour de l'axe orienté par \((-1, 1, -1)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Matrice d'une réflexion de l'espace</h3>
  <div class="statement">Dans \(\mathbb{R}^3\) muni du produit scalaire canonique, on note \(s\) la réflexion par rapport au plan \(P\) d'équation \(2x - 2y + z = 0\).</div>
  <div class="q"><strong>Q1.</strong> Écrire la matrice \(S\) de \(s\) dans la base canonique.</div>
  <div class="q"><strong>Q2.</strong> Vérifier que \(S\) est symétrique et orthogonale ; calculer sa trace et son déterminant.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(s(e_1)\), puis le projeté orthogonal de \(e_1\) sur \(P\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Le vecteur \(w = (2, -2, 1)\) est normal à \(P\), avec \(W^\top W = 9\). Donc</p>
    <div class="formula">$$S = I_3 - \frac29\,WW^\top = I_3 - \frac29\begin{pmatrix} 4 & -4 & 2 \\ -4 & 4 & -2 \\ 2 & -2 & 1\end{pmatrix} = \frac19\begin{pmatrix} 1 & 8 & -4 \\ 8 & 1 & 4 \\ -4 & 4 & 7\end{pmatrix}.$$</div>
    <p><strong>Q2.</strong> \(S\) est symétrique. Ses colonnes ont pour carrés de normes \(\frac{1 + 64 + 16}{81} = 1\), \(\frac{64 + 1 + 16}{81} = 1\), \(\frac{16 + 16 + 49}{81} = 1\), et leurs produits scalaires valent \(\frac{8 + 8 - 16}{81} = 0\), \(\frac{-4 + 32 - 28}{81} = 0\), \(\frac{-32 + 4 + 28}{81} = 0\) : \(S\) est orthogonale. Sa trace vaut \(\frac{1 + 1 + 7}{9} = 1 = \dim P - \dim P^\perp\) et son déterminant \(-1\), comme pour toute réflexion de l'espace (dans une base adaptée, \(\operatorname{diag}(1, 1, -1)\)).</p>
    <p><strong>Q3.</strong> \(s(e_1)\) est la première colonne : \(\frac19(1, 8, -4)\), de norme 1 comme \(e_1\). Le projeté est le milieu de \(e_1\) et de son symétrique, puisque \(s = 2p_P - \mathrm{id}\) :</p>
    <div class="formula">$$p_P(e_1) = \tfrac12\big(e_1 + s(e_1)\big) = \tfrac19(5, 4, -2),$$</div>
    <p>qui vérifie bien \(2 \times 5 - 2 \times 4 - 2 = 0\). On retrouve ce résultat par la formule de projection sur un plan :</p>
    <div class="formula">$$p_P(e_1) = e_1 - \frac{\langle e_1, w\rangle}{\|w\|^2}\,w = (1, 0, 0) - \frac29(2, -2, 1).$$</div>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Composer des isométries du plan</h3>
  <div class="statement">Dans \(\mathbb{R}^2\) euclidien orienté par sa base canonique, on pose
  <div class="formula">$$A = \frac12\begin{pmatrix} 1 & -\sqrt3 \\ \sqrt3 & 1\end{pmatrix}, \qquad B = \begin{pmatrix} 1 & 0 \\ 0 & -1\end{pmatrix}.$$</div></div>
  <div class="q"><strong>Q1.</strong> Donner la nature géométrique de \(A\) et de \(B\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer la nature de \(AB\) et de \(BA\) et leurs éléments caractéristiques. Les deux isométries commutent-elles ?</div>
  <div class="q"><strong>Q3.</strong> Calculer \(BAB\) et interpréter le résultat.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(A = R\big(\frac\pi3\big)\) (\(\cos\frac\pi3 = \frac12\), \(\sin\frac\pi3 = \frac{\sqrt3}{2}\)) : rotation d'angle \(\frac\pi3\). \(B = S(0)\), de déterminant \(-1\) : réflexion par rapport à l'axe \(\operatorname{Vect}(e_1)\).</p>
    <p><strong>Q2.</strong> Avec \(R(\theta)S(\varphi) = S(\theta + \varphi)\) et \(S(\varphi)R(\theta) = S(\varphi - \theta)\) :</p>
    <div class="formula">$$AB = S\big(\tfrac\pi3\big) = \frac12\begin{pmatrix} 1 & \sqrt3 \\ \sqrt3 & -1\end{pmatrix}, \qquad BA = S\big(-\tfrac\pi3\big) = \frac12\begin{pmatrix} 1 & -\sqrt3 \\ -\sqrt3 & -1\end{pmatrix}.$$</div>
    <p>Ce sont deux réflexions (déterminant \(-1\)). L'axe de \(S(\theta)\) fait l'angle \(\frac\theta2\) avec \(e_1\) : \(AB\) est la réflexion d'axe dirigé par \(\big(\cos\frac\pi6, \sin\frac\pi6\big)\), soit par \((\sqrt3, 1)\), et \(BA\) celle d'axe dirigé par \((\sqrt3, -1)\). Contrôle : \(AB(\sqrt3, 1) = \frac12(\sqrt3 + \sqrt3,\ 3 - 1) = (\sqrt3, 1)\). Comme \(AB \neq BA\), les deux isométries ne commutent pas.</p>
    <p><strong>Q3.</strong> \(BAB = S(0)\,S\big(\frac\pi3\big) = R\big(0 - \frac\pi3\big) = R\big(-\frac\pi3\big)\), avec \(S(\alpha)S(\beta) = R(\alpha - \beta)\). Comme \(B^{-1} = B\), cela s'écrit \(BAB^{-1} = A^{-1}\) : la rotation « vue dans un miroir » tourne en sens inverse. Une réflexion change l'orientation, donc le signe des angles.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Construire la matrice d'une rotation</h3>
  <div class="statement">\(\mathbb{R}^3\) est orienté par sa base canonique. On cherche la matrice \(A\), dans la base canonique, de la rotation \(\rho\) d'angle \(\frac\pi2\) autour de l'axe orienté par \(w = (2, 1, 2)\).</div>
  <div class="q"><strong>Q1.</strong> Construire une base orthonormée directe \((u, v, k)\) adaptée, avec \(u = \frac{1}{\sqrt2}(1, 0, -1)\).</div>
  <div class="q"><strong>Q2.</strong> Justifier que \(A = vu^\top - uv^\top + kk^\top\) (vecteurs écrits en colonnes), puis calculer \(A\).</div>
  <div class="q"><strong>Q3.</strong> Contrôler le résultat de trois façons.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\|w\| = 3\), donc \(k = \frac13(2, 1, 2)\). Le vecteur \(u\) est unitaire et orthogonal à \(k\) (\(2 - 2 = 0\)). On pose</p>
    <div class="formula">$$v = k \wedge u = \frac{1}{3\sqrt2}\,(2, 1, 2) \wedge (1, 0, -1) = \frac{1}{3\sqrt2}\,(-1, 4, -1),$$</div>
    <p>unitaire (\(\frac{1 + 16 + 1}{18} = 1\)) ; la base \((u, v, k)\) est orthonormée directe.</p>
    <p><strong>Q2.</strong> La rotation d'angle \(\frac\pi2\) envoie \(u \mapsto v\), \(v \mapsto -u\), \(k \mapsto k\). Avec \(P = (u \mid v \mid k)\), orthogonale, \(A = P\,R\,P^\top\), où \(R\) est la matrice de \(\rho\) dans \((u, v, k)\). En développant ce produit colonne par ligne,</p>
    <div class="formula">$$A = \rho(u)u^\top + \rho(v)v^\top + \rho(k)k^\top = vu^\top - uv^\top + kk^\top .$$</div>
    <p>Le calcul donne</p>
    <div class="formula">$$\begin{aligned} vu^\top - uv^\top &= \frac13\begin{pmatrix} 0 & -2 & 1 \\ 2 & 0 & -2 \\ -1 & 2 & 0\end{pmatrix}, \qquad kk^\top = \frac19\begin{pmatrix} 4 & 2 & 4 \\ 2 & 1 & 2 \\ 4 & 2 & 4\end{pmatrix}, \\ A &= \frac19\begin{pmatrix} 4 & -4 & 7 \\ 8 & 1 & -4 \\ 1 & 8 & 4\end{pmatrix}. \end{aligned}$$</div>
    <p><strong>Q3.</strong> (i) \(Aw = \frac19(18, 9, 18) = w\) : l'axe est fixe. (ii) \(\operatorname{tr} A = \frac{4 + 1 + 4}{9} = 1 = 1 + 2\cos\frac\pi2\). (iii) \(A(1, 0, -1) = \frac19(-3, 12, -3) = \frac13(-1, 4, -1)\), soit \(Au = v\) : le quart de tour se fait dans le bon sens. On peut aussi vérifier que les colonnes, de carrés de normes \(\frac{16 + 64 + 1}{81} = 1\), sont orthonormées.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Axe et angle d'une rotation, angle non remarquable</h3>
  <div class="statement">\(\mathbb{R}^3\) est orienté par sa base canonique. Soit
  <div class="formula">$$A = \frac13\begin{pmatrix} 1 & 2 & 2 \\ 2 & 1 & -2 \\ -2 & 2 & -1\end{pmatrix}.$$</div></div>
  <div class="q"><strong>Q1.</strong> Montrer que \(A \in SO(3)\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer l'axe de la rotation.</div>
  <div class="q"><strong>Q3.</strong> Déterminer son angle (on en donnera une valeur approchée).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les colonnes \(C_1 = \frac13(1, 2, -2)\), \(C_2 = \frac13(2, 1, 2)\), \(C_3 = \frac13(2, -2, -1)\) sont unitaires (\(1 + 4 + 4 = 9\)) et deux à deux orthogonales (\(2 + 2 - 4 = 0\), \(2 - 4 + 2 = 0\), \(4 - 2 - 2 = 0\)). De plus \(C_1 \wedge C_2 = \frac19(6, -6, -3) = C_3\), donc \(\det A = \det(C_1, C_2, C_1 \wedge C_2)\), qui vaut \(\|C_1 \wedge C_2\|^2 = 1\).</p>
    <p><strong>Q2.</strong> Les lignes de \(3(A - I_3)\) donnent les équations \(-2x + 2y + 2z = 0\) (la deuxième ligne lui est opposée) et \(-2x + 2y - 4z = 0\). Par différence, \(z = 0\), puis \(y = x\) : l'axe est dirigé par \((1, 1, 0)\), que l'on oriente par \(k = \frac{1}{\sqrt2}(1, 1, 0)\).</p>
    <p><strong>Q3.</strong> \(\operatorname{tr} A = \frac13\), donc \(\cos\theta = \frac{1/3 - 1}{2} = -\frac13\). Avec \(x = e_1\) (hors de l'axe), \(Ae_1 = C_1\) et</p>
    <div class="formula">$$\det(e_1, Ae_1, k) = \begin{vmatrix} 1 & \frac13 & \frac{1}{\sqrt2} \\ 0 & \frac23 & \frac{1}{\sqrt2} \\ 0 & -\frac23 & 0\end{vmatrix} = \frac{2}{3\sqrt2} \gt 0 .$$</div>
    <p>Donc \(\sin\theta \gt 0\) et \(\theta = \arccos\big(-\frac13\big) \approx 1{,}911\) rad \(\approx 109{,}5^\circ\) : \(A\) est la rotation de cet angle autour de l'axe orienté par \((1, 1, 0)\). La méthode ne demande pas un angle remarquable : \(\cos\theta\) et le signe de \(\sin\theta\) suffisent à le déterminer.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Une matrice orthogonale et symétrique</h3>
  <div class="statement">Soit \(A = \dfrac13\begin{pmatrix} 1 & 2 & 2 \\ 2 & 1 & -2 \\ 2 & -2 & 1\end{pmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(A\) est orthogonale et symétrique, et en déduire \(A^2\).</div>
  <div class="q"><strong>Q2.</strong> Identifier l'isométrie de \(\mathbb{R}^3\) canoniquement associée à \(A\) et ses éléments caractéristiques.</div>
  <div class="q"><strong>Q3.</strong> Même question pour \(-A\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(A^\top = A\). Les colonnes sont unitaires (\(1 + 4 + 4 = 9\)) et orthogonales (\(2 + 2 - 4 = 0\), \(2 - 4 + 2 = 0\), \(4 - 2 - 2 = 0\)) : \(A^\top A = I_3\). Donc \(A^2 = A^\top A = I_3\) : \(A\) est la matrice d'une symétrie.</p>
    <p><strong>Q2.</strong> Une matrice orthogonale et symétrique représente une symétrie orthogonale, par rapport à \(F = \operatorname{Ker}(A - I_3)\). Ici \(\operatorname{tr} A = 1\), donc \(2\dim F - 3 = 1\) et \(\dim F = 2\) : c'est une <strong>réflexion</strong> (d'ailleurs \(\det A = -1\)). Le système \((A - I_3)X = 0\) se réduit à \(-x + y + z = 0\) : \(A\) est la réflexion par rapport au plan d'équation \(x - y - z = 0\), de vecteur normal \(w = (1, -1, -1)\). Contrôle : \(Aw = \frac13(-3, 3, 3) = -w\).</p>
    <p><strong>Q3.</strong> \(-A\) est encore orthogonale et symétrique, de trace \(-1\) et de déterminant \((-1)^3\det A = 1\). C'est une symétrie orthogonale par rapport à \(\operatorname{Ker}(-A - I_3) = \operatorname{Ker}(A + I_3) = \operatorname{Vect}(w)\), droite : \(-A\) est le <strong>retournement</strong> d'axe dirigé par \((1, -1, -1)\), rotation d'angle \(\pi\) (\(1 + 2\cos\pi = -1\)). En général, \(-s_F = s_{F^\perp}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Théorème spectral avec une valeur propre double</h3>
  <div class="statement">Soit \(M = \begin{pmatrix} 3 & 2 & 2 \\ 2 & 6 & 4 \\ 2 & 4 & 6\end{pmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le rang de \(M - 2I_3\) et en déduire les valeurs propres de \(M\) et ses sous-espaces propres.</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(P \in SO(3)\) et \(D\) diagonale telles que \(M = PDP^\top\).</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(2\|X\|^2 \leq X^\top MX \leq 11\|X\|^2\) pour tout \(X \in \mathbb{R}^3\), et préciser les cas d'égalité.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(M - 2I_3 = \begin{pmatrix} 1 & 2 & 2 \\ 2 & 4 & 4 \\ 2 & 4 & 4\end{pmatrix} = VV^\top\) avec \(V = (1, 2, 2)\) en colonne : ses lignes sont proportionnelles, il est de rang 1. Donc 2 est valeur propre et \(E_2 = \operatorname{Ker}(M - 2I_3)\) est le plan d'équation \(x + 2y + 2z = 0\). La matrice est symétrique réelle, donc diagonalisable : la troisième valeur propre \(\lambda\) vérifie \(2 + 2 + \lambda = \operatorname{tr} M = 15\), soit \(\lambda = 11\). En effet \(MV = 2V + V(V^\top V) = 11V\) : \(E_{11} = \operatorname{Vect}(1, 2, 2)\), orthogonale au plan \(E_2\) comme prévu.</p>
    <p><strong>Q2.</strong> On norme \(k = \frac13(1, 2, 2)\). Dans le plan \(E_2\), on prend \(u_1 = \frac{1}{\sqrt2}(0, 1, -1)\), puis \(u_2 = k \wedge u_1 = \frac{1}{3\sqrt2}(-4, 1, 1)\), qui est dans \(E_2\) (orthogonal à \(k\)) et orthogonal à \(u_1\). La base \((u_1, u_2, k)\) est orthonormée directe (comme \((u, k \wedge u, k)\) en général), donc</p>
    <div class="formula">$$P = \begin{pmatrix} 0 & -\frac{4}{3\sqrt2} & \frac13 \\ \frac{1}{\sqrt2} & \frac{1}{3\sqrt2} & \frac23 \\ -\frac{1}{\sqrt2} & \frac{1}{3\sqrt2} & \frac23\end{pmatrix} \in SO(3), \qquad D = \operatorname{diag}(2, 2, 11).$$</div>
    <p><strong>Q3.</strong> Posons \(Y = P^\top X = (y_1, y_2, y_3)\). Comme \(P\) est orthogonale, \(\|Y\| = \|X\|\), et</p>
    <div class="formula">$$X^\top MX = X^\top PDP^\top X = Y^\top DY = 2y_1^2 + 2y_2^2 + 11y_3^2 .$$</div>
    <p>Cette quantité est comprise entre \(2(y_1^2 + y_2^2 + y_3^2)\) et \(11(y_1^2 + y_2^2 + y_3^2)\), d'où l'encadrement. Égalité à gauche si et seulement si \(y_3 = 0\), c'est-à-dire \(X \in E_2\) ; à droite si et seulement si \(y_1 = y_2 = 0\), c'est-à-dire \(X \in E_{11}\). Les applications de ce type d'encadrement (formes quadratiques, coniques) sont développées dans le chapitre « Réduction des coniques et matrices symétriques ».</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Matrices orthogonales particulières</h3>
  <div class="statement">Les questions sont indépendantes ; \(\mathbb{R}^n\) est muni du produit scalaire canonique.</div>
  <div class="q"><strong>Q1.</strong> Montrer qu'une matrice orthogonale triangulaire supérieure est diagonale, de coefficients diagonaux égaux à \(\pm 1\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que les matrices orthogonales à coefficients entiers sont les matrices dont chaque ligne et chaque colonne contient un seul coefficient non nul, égal à \(\pm 1\). Combien y en a-t-il dans \(O(3)\) ? dans \(SO(3)\) ?</div>
  <div class="q"><strong>Q3.</strong> Montrer que l'ensemble des matrices de \(O(3)\) à coefficients entiers est stable par produit et par passage à l'inverse.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Soit \(A\) orthogonale triangulaire supérieure, de colonnes \(C_1, \ldots, C_n\). La colonne \(C_1 = (a_{11}, 0, \ldots, 0)\) est unitaire : \(a_{11} = \pm1\). La colonne \(C_2 = (a_{12}, a_{22}, 0, \ldots, 0)\) est orthogonale à \(C_1\), donc \(a_{11}a_{12} = 0\) et \(a_{12} = 0\) ; unitaire, elle donne \(a_{22} = \pm 1\). Par récurrence, si \(C_1, \ldots, C_{j-1}\) sont \(\pm e_1, \ldots, \pm e_{j-1}\), l'orthogonalité de \(C_j\) à ces colonnes annule \(a_{1j}, \ldots, a_{j-1,j}\), et \(C_j = a_{jj}e_j\) unitaire impose \(a_{jj} = \pm1\). La matrice est diagonale à coefficients \(\pm 1\).</p>
    <p><strong>Q2.</strong> Chaque colonne est unitaire : la somme des carrés de ses coefficients entiers vaut 1, donc un seul est non nul, égal à \(\pm 1\). Deux colonnes distinctes sont orthogonales : leurs coefficients non nuls ne peuvent pas être sur la même ligne (leur produit scalaire vaudrait \(\pm 1\)). Les \(n\) coefficients non nuls sont donc sur \(n\) lignes distinctes : chaque ligne en contient exactement un. Réciproquement, une telle matrice a pour colonnes \(\pm e_{\sigma(1)}, \ldots, \pm e_{\sigma(n)}\) avec des indices distincts : ses colonnes forment une base orthonormée. Pour \(n = 3\) : on choisit la position du coefficient non nul de chaque colonne (une permutation de 3 lignes, \(3! = 6\) choix) et son signe (\(2^3 = 8\) choix), soit <strong>48</strong> matrices. Changer le signe d'une colonne change le signe du déterminant : pour chaque permutation, la moitié des choix de signes donne \(\det = 1\), soit <strong>24</strong> matrices dans \(SO(3)\) (ce sont les rotations qui laissent le cube \([-1, 1]^3\) globalement invariant).</p>
    <p><strong>Q3.</strong> Si \(A\) et \(B\) sont dans \(O(3)\) à coefficients entiers, \(AB\) est orthogonale (produit de matrices orthogonales) et à coefficients entiers ; \(A^{-1} = A^\top\) est orthogonale et à coefficients entiers. L'ensemble est stable par produit et par inverse.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Rotations de l'espace et produit vectoriel</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : rotations de l'espace, matrices orthogonales, axe et angle).</div>
  <div class="statement">\(\mathbb{R}^3\) est muni de sa structure euclidienne canonique et orienté par sa base canonique \((e_1, e_2, e_3)\). Soit \(k = (a, b, c)\) un vecteur unitaire, que l'on identifie à la colonne de ses coordonnées, et \(K\) la matrice dans la base canonique de l'endomorphisme \(x \mapsto k \wedge x\). On admet la formule du double produit vectoriel : \(k \wedge (k \wedge x) = \langle k, x\rangle k - \|k\|^2x\).</div>
  <p class="exo-part">Partie A — L'endomorphisme \(x \mapsto k \wedge x\)</p>
  <div class="q"><strong>A1.</strong> Écrire \(K\) et vérifier que \(K^\top = -K\).</div>
  <div class="q"><strong>A2.</strong> Montrer que \(K^2 = kk^\top - I_3\), puis que \(K^3 = -K\).</div>
  <p class="exo-part">Partie B — Une formule pour les rotations</p>
  <p>Pour \(\theta \in \mathbb{R}\), on pose \(R_\theta = I_3 + \sin\theta\,K + (1 - \cos\theta)\,K^2\).</p>
  <div class="q"><strong>B1.</strong> Calculer \(R_\theta k\).</div>
  <div class="q"><strong>B2.</strong> Soit \(u\) unitaire orthogonal à \(k\) et \(v = k \wedge u\). Calculer \(Ku\), \(Kv\), \(K^2u\), \(K^2v\), puis \(R_\theta u\) et \(R_\theta v\).</div>
  <div class="q"><strong>B3.</strong> En déduire que \(R_\theta\) est la matrice de la rotation d'angle \(\theta\) autour de l'axe orienté par \(k\).</div>
  <p class="exo-part">Partie C — Composer deux quarts de tour</p>
  <p>On note \(A_1\) et \(A_3\) les matrices des rotations d'angle \(\frac\pi2\) autour des axes orientés par \(e_1\) et par \(e_3\).</p>
  <div class="q"><strong>C1.</strong> Écrire \(A_1\) et \(A_3\).</div>
  <div class="q"><strong>C2.</strong> Déterminer l'axe et l'angle de la rotation de matrice \(A_3A_1\).</div>
  <div class="q"><strong>C3.</strong> Même question pour \(A_1A_3\). La composition des rotations est-elle commutative ?</div>
  <p class="exo-part">Partie D — Lire l'axe sur la partie antisymétrique</p>
  <div class="q"><strong>D1.</strong> Montrer que \(\operatorname{tr} R_\theta = 1 + 2\cos\theta\) et que \(R_\theta - R_\theta^\top = 2\sin\theta\,K\).</div>
  <div class="q"><strong>D2.</strong> Soit \(A \in SO(3)\), rotation d'angle \(\theta\) avec \(\sin\theta \neq 0\). Expliquer comment obtenir un vecteur directeur de l'axe à partir de \(A - A^\top\), et l'appliquer à \(A_3A_1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> Les colonnes de \(K\) sont \(k \wedge e_1 = (0, c, -b)\), \(k \wedge e_2 = (-c, 0, a)\) et \(k \wedge e_3 = (b, -a, 0)\) :</p>
    <div class="formula">$$K = \begin{pmatrix} 0 & -c & b \\ c & 0 & -a \\ -b & a & 0\end{pmatrix}, \qquad K^\top = -K .$$</div>
    <p><strong>A2.</strong> Pour tout \(x\), comme \(\|k\| = 1\) et \(\langle k, x\rangle k = k(k^\top x)\),</p>
    <div class="formula">$$K^2x = k \wedge (k \wedge x) = \langle k, x\rangle k - x = (kk^\top - I_3)x .$$</div>
    <p>Donc \(K^2 = kk^\top - I_3\). Puis \(K^3 = K(kk^\top - I_3) = (Kk)k^\top - K = -K\), puisque \(Kk = k \wedge k = 0\).</p>
    <p><strong>B1.</strong> \(Kk = 0\) et \(K^2k = 0\), donc \(R_\theta k = k\).</p>
    <p><strong>B2.</strong> \(Ku = k \wedge u = v\) ; \(Kv = k \wedge (k \wedge u) = \langle k, u\rangle k - u = -u\) ; \(K^2u = Kv = -u\) ; \(K^2v = K(-u) = -v\). Donc</p>
    <div class="formula">$$\begin{aligned} R_\theta u &= u + \sin\theta\,v - (1 - \cos\theta)\,u = \cos\theta\,u + \sin\theta\,v, \\ R_\theta v &= v - \sin\theta\,u - (1 - \cos\theta)\,v = -\sin\theta\,u + \cos\theta\,v. \end{aligned}$$</div>
    <p><strong>B3.</strong> La famille \((k, u, k \wedge u)\) est une base orthonormée directe (\(k\) et \(u\) sont orthonormés), et \((u, v, k)\) s'en déduit par permutation circulaire : elle est aussi orthonormée directe. D'après B1 et B2, la matrice de \(x \mapsto R_\theta x\) dans cette base est</p>
    <div class="formula">$$\begin{pmatrix} \cos\theta & -\sin\theta & 0 \\ \sin\theta & \cos\theta & 0 \\ 0 & 0 & 1\end{pmatrix} :$$</div>
    <p>c'est la rotation d'angle \(\theta\) autour de l'axe orienté par \(k\). En particulier \(R_\theta \in SO(3)\). (C'est la formule de Rodrigues, citée dans le cours en complément.)</p>
    <p><strong>C1.</strong> Autour de \(e_1\), dans la base orthonormée directe \((e_2, e_3, e_1)\), le quart de tour envoie \(e_2 \mapsto e_3\) et \(e_3 \mapsto -e_2\) ; autour de \(e_3\), il envoie \(e_1 \mapsto e_2\) et \(e_2 \mapsto -e_1\) :</p>
    <div class="formula">$$A_1 = \begin{pmatrix} 1 & 0 & 0 \\ 0 & 0 & -1 \\ 0 & 1 & 0\end{pmatrix}, \qquad A_3 = \begin{pmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 1\end{pmatrix}.$$</div>
    <p><strong>C2.</strong> Le produit, dans \(SO(3)\), vaut</p>
    <div class="formula">$$A_3A_1 = \begin{pmatrix} 0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0\end{pmatrix}.$$</div>
    <p>Axe : \((A_3A_1 - I_3)X = 0\) donne \(x = y = z\), d'où \(k = \frac{1}{\sqrt3}(1, 1, 1)\). Trace nulle : \(\cos\theta = -\frac12\). Avec \(x = e_1\), \(A_3A_1e_1 = e_2\) et \(\det(e_1, e_2, k) = \frac{1}{\sqrt3} \gt 0\) : c'est la rotation d'angle \(\frac{2\pi}{3}\) autour de l'axe orienté par \((1, 1, 1)\), la permutation circulaire des coordonnées étudiée dans le cours.</p>
    <p><strong>C3.</strong> On trouve</p>
    <div class="formula">$$A_1A_3 = \begin{pmatrix} 0 & -1 & 0 \\ 0 & 0 & -1 \\ 1 & 0 & 0\end{pmatrix}.$$</div>
    <p>Axe : \(-x - y = 0\), \(-y - z = 0\), \(x - z = 0\), d'où la direction \((1, -1, 1)\) et \(k' = \frac{1}{\sqrt3}(1, -1, 1)\). Trace nulle : \(\cos\theta = -\frac12\). Avec \(x = e_1\), \(A_1A_3e_1 = e_3\) et \(\det(e_1, e_3, k') = \frac{1}{\sqrt3} \gt 0\) : rotation d'angle \(\frac{2\pi}{3}\) autour de l'axe orienté par \((1, -1, 1)\). Les axes diffèrent : \(A_1A_3 \neq A_3A_1\), la composition des rotations de l'espace n'est pas commutative (contrairement au plan).</p>
    <p><strong>D1.</strong> \(\operatorname{tr} K = 0\) et \(\operatorname{tr} K^2 = \operatorname{tr}(kk^\top) - 3 = \|k\|^2 - 3 = -2\), donc \(\operatorname{tr} R_\theta = 3 - 2(1 - \cos\theta) = 1 + 2\cos\theta\). Comme \(K^\top = -K\) et \((K^2)^\top = K^2\), \(R_\theta^\top = I_3 - \sin\theta\,K + (1 - \cos\theta)K^2\), d'où \(R_\theta - R_\theta^\top = 2\sin\theta\,K\).</p>
    <p><strong>D2.</strong> D'après B3, toute rotation d'axe orienté par \(k\) et d'angle \(\theta\) a pour matrice \(R_\theta\). Donc \(\frac12(A - A^\top) = \sin\theta\,K\), dont les coefficients d'indices \((3, 2)\), \((1, 3)\), \((2, 1)\) forment le vecteur \(\sin\theta\,k\) : si \(\sin\theta \neq 0\), il dirige l'axe, et l'orienter par ce vecteur rend \(\sin\theta\) positif. Pour \(A_3A_1\) :</p>
    <div class="formula">$$\tfrac12\big(A_3A_1 - (A_3A_1)^\top\big) = \frac12\begin{pmatrix} 0 & -1 & 1 \\ 1 & 0 & -1 \\ -1 & 1 & 0\end{pmatrix},$$</div>
    <p>d'où \(\sin\theta\,k = \frac12(1, 1, 1)\). Avec \(k = \frac{1}{\sqrt3}(1, 1, 1)\), \(\sin\theta = \frac{\sqrt3}{2}\), et la trace donne \(\cos\theta = -\frac12\) : \(\theta = \frac{2\pi}{3}\), comme en C2.</p>
  </div>
</div>
