<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties 1.2 « Expression différentielle des principes de la thermodynamique » et 1.3 « Diagrammes d'état des fluides réels purs » du programme de PT. Il prolonge la thermodynamique de PTSI et sert de base à la thermodynamique industrielle (systèmes ouverts, cycles) et à la thermochimie.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Échelle mésoscopique, transformation infinitésimale</strong> : découper un système en sous-systèmes, une transformation finie en transformations infinitésimales ; appliquer les deux principes pour obtenir une équation différentielle (§1).</li>
        <li><strong>Identités thermodynamiques</strong> (système fermé, de composition constante puis variable) : citer les différentielles de \(U\), \(H\), \(G\) ; définir température et pression thermodynamiques, potentiel chimique ; caractère intensif ou extensif ; écriture par unité de masse ; \(G = \sum n_i\mu_i\) (§2, §3).</li>
        <li><strong>Enthalpie libre</strong> : justifier que \(G\) est le potentiel thermodynamique des transformations isothermes, isobares et spontanées (§4).</li>
        <li><strong>Changement d'état d'un corps pur</strong> : phases ; conditions d'évolution et d'équilibre en termes de potentiel chimique ; caractère isobare d'un changement d'état isotherme ; enthalpie et entropie de changement d'état (ordre de grandeur pour l'eau) ; énergie récupérable lors d'une liquéfaction (§5).</li>
        <li><strong>Titre massique</strong> et règle des moments (§6).</li>
        <li><strong>Diagrammes</strong> de Clapeyron \((p, v)\), entropique \((T, s)\), de Mollier \((h, s)\) et des frigoristes \((\log p, h)\) : allure des isothermes, isobares, isentropes et isenthalpes ; équations dans les limites du gaz parfait et du liquide incompressible indilatable ; lecture de valeurs (§7).</li>
        <li><strong>Tables thermodynamiques</strong> : calculs dans le domaine diphasique, prévision de l'état physique d'un fluide (§8).</li>
      </ul>
      <p>Les identités servent à comprendre l'allure des courbes ; les expressions des fonctions d'état (gaz parfait, phase condensée) sont toujours fournies. L'étude générale des potentiels thermodynamiques est hors programme.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LES PRINCIPES SOUS FORME DIFFÉRENTIELLE</div>
  <h2>Découper le système, découper la transformation</h2>
  <div class="intro">En PTSI, on appliquait les principes entre un état initial et un état final. Beaucoup de situations demandent de suivre une transformation pas à pas (la pression varie en cours de route, le système n'est pas uniforme) : on écrit alors les principes pour une transformation infinitésimale, ou pour un petit morceau du système, puis on intègre.</div>
  <div class="def-box">
    <strong>Échelle mésoscopique.</strong> Un sous-système mésoscopique est petit devant le système (les grandeurs intensives y sont uniformes) mais grand devant les distances moléculaires (il contient assez de molécules pour que ces grandeurs aient un sens). C'est l'échelle de l'élément de fluide, de la tranche de mur en conduction, de la particule de fluide en écoulement.<br>
    <strong>Transformation infinitésimale.</strong> Les variables d'état varient de quantités infinitésimales \(\mathrm{d}T\), \(\mathrm{d}V\)… ; les échanges sont notés \(\delta W\) et \(\delta Q\) : ce ne sont pas des différentielles de fonctions d'état, leur somme sur une transformation dépend du chemin suivi.
  </div>
  <div class="prop-box">
    <strong>Premier principe</strong> pour une transformation infinitésimale d'un système fermé :
    <div class="formula" data-nom="Premier principe (forme infinitésimale)">$$\mathrm{d}U+\mathrm{d}E_c=\delta W+\delta Q$$</div>
    <strong>Deuxième principe</strong> : l'entropie, fonction d'état extensive, varie de
    <div class="formula" data-nom="Deuxième principe (forme infinitésimale)">$$\mathrm{d}S=\delta S_e+\delta S_c\qquad\delta S_e=\frac{\delta Q}{T_{\text{front}}}\qquad\delta S_c\ge0$$</div>
    où \(T_{\text{front}}\) est la température de la frontière à travers laquelle s'effectue le transfert thermique, et \(\delta S_c = 0\) pour une transformation réversible.
  </div>
  <div class="method-box">
    <strong>Exemple — retrouver la loi de Laplace par la voie différentielle</strong>
    <p>Gaz parfait (\(C_V\) constante, \(\gamma = C_p/C_V\)) subissant une compression adiabatique et réversible.</p>
    <ol>
      <li>Transformation infinitésimale réversible : \(\delta W = -p\,\mathrm{d}V\) (pression extérieure égale à celle du gaz), \(\delta Q = 0\).</li>
      <li>Premier principe : \(nC_{V,m}\,\mathrm{d}T = -p\,\mathrm{d}V = -\dfrac{nRT}{V}\,\mathrm{d}V\), d'où \(\dfrac{\mathrm{d}T}{T} = -\dfrac{R}{C_{V,m}}\dfrac{\mathrm{d}V}{V} = -(\gamma - 1)\dfrac{\mathrm{d}V}{V}\).</li>
      <li>Intégration : \(TV^{\gamma-1} = \text{cste}\), soit \(pV^\gamma = \text{cste}\) avec \(pV = nRT\).</li>
    </ol>
    <p>C'est exactement la démarche demandée : une équation différentielle tirée d'un principe appliqué à une étape infinitésimale, puis intégrée.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · IDENTITÉS THERMODYNAMIQUES</div>
  <h2>Les différentielles de U, H et G</h2>
  <div class="intro">Pour un système fermé de composition fixée, l'état d'équilibre est décrit par deux variables. Les différentielles des fonctions d'état s'expriment alors simplement, et contiennent les définitions thermodynamiques de la température et de la pression.</div>
  <div class="prop-box">
    <strong>Identités thermodynamiques</strong> (système fermé, composition constante, seul travail celui des forces de pression) :
    <div class="formula" data-nom="Identité thermodynamique pour U">$$\mathrm{d}U=T\,\mathrm{d}S-p\,\mathrm{d}V$$</div>
    <div class="formula" data-nom="Identités pour H et G">$$\mathrm{d}H=T\,\mathrm{d}S+V\,\mathrm{d}p\qquad\mathrm{d}G=-S\,\mathrm{d}T+V\,\mathrm{d}p$$</div>
    avec \(H = U + pV\) et \(G = H - TS\) (enthalpie libre).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">D'où vient \(\mathrm{d}U = T\,\mathrm{d}S - p\,\mathrm{d}V\), et pourquoi vaut-elle pour toute transformation ?</span>
    <div class="content">
      <p>Pour une transformation infinitésimale <strong>réversible</strong> entre deux états d'équilibre voisins : \(\delta W = -p\,\mathrm{d}V\) et \(\delta Q = T\,\mathrm{d}S\) (deuxième principe avec \(\delta S_c = 0\)), donc \(\mathrm{d}U = T\,\mathrm{d}S - p\,\mathrm{d}V\). Mais \(\mathrm{d}U\), \(\mathrm{d}S\), \(\mathrm{d}V\) ne dépendent que des deux états : la relation, établie sur un chemin réversible, vaut donc pour <strong>tout</strong> chemin entre ces états — même si, sur un chemin irréversible, \(T\,\mathrm{d}S\) n'est plus le transfert thermique. On en déduit les deux autres en différentiant \(H = U + pV\) et \(G = H - TS\).</p>
    </div>
  </div>
  <div class="def-box">
    <strong>Température et pression thermodynamiques.</strong> \(U\) étant une fonction de \(S\) et \(V\), l'identité donne
    <div class="formula">$$T=\left(\frac{\partial U}{\partial S}\right)_V\qquad p=-\left(\frac{\partial U}{\partial V}\right)_S$$</div>
    Ces définitions coïncident avec la température du thermomètre à gaz et avec la pression mécanique. \(T\) et \(p\) sont <strong>intensives</strong> ; \(U\), \(S\), \(V\), \(H\), \(G\) sont <strong>extensives</strong> : dans chaque identité, on multiplie toujours une grandeur intensive par la différentielle d'une extensive.
  </div>
  <div class="prop-box">
    <strong>Écriture par unité de masse</strong> (grandeurs massiques en minuscules, \(v = 1/\mu\) volume massique) :
    <div class="formula" data-nom="Identités massiques">$$\mathrm{d}u=T\,\mathrm{d}s-p\,\mathrm{d}v\qquad\mathrm{d}h=T\,\mathrm{d}s+v\,\mathrm{d}p$$</div>
    Ce sont les formes utilisées pour les fluides en écoulement et les diagrammes.
  </div>
  <div class="method-box">
    <strong>Exemple — entropie massique d'un gaz parfait et d'un liquide</strong>
    <ol>
      <li>Gaz parfait : \(\mathrm{d}u = c_v\,\mathrm{d}T\) et \(p/T = r/v\) (\(r = R/M\)). L'identité donne \(\mathrm{d}s = c_v\dfrac{\mathrm{d}T}{T} + r\dfrac{\mathrm{d}v}{v}\), d'où \(s = c_v\ln T + r\ln v + \text{cste}\). Avec \(\mathrm{d}h = c_p\,\mathrm{d}T\) : \(\mathrm{d}s = c_p\dfrac{\mathrm{d}T}{T} - r\dfrac{\mathrm{d}p}{p}\).</li>
      <li>Liquide incompressible et indilatable (\(\mathrm{d}v = 0\), \(\mathrm{d}u = c\,\mathrm{d}T\)) : \(\mathrm{d}s = c\,\dfrac{\mathrm{d}T}{T}\), soit \(s = c\ln T + \text{cste}\) : l'entropie ne dépend que de la température.</li>
    </ol>
    <p>Ces expressions (fournies dans les sujets) fixent l'allure des courbes dans les diagrammes (§7).</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · COMPOSITION VARIABLE ET POTENTIEL CHIMIQUE</div>
  <h2>Quand la quantité de matière change</h2>
  <div class="intro">Lors d'un changement d'état ou d'une réaction chimique, les quantités de matière des constituants (ou des phases) varient. Les identités s'enrichissent d'un terme par constituant : le potentiel chimique mesure ce que coûte, en énergie, l'ajout d'une mole de chaque espèce.</div>
  <div class="prop-box">
    <strong>Identités pour un système fermé de composition variable</strong> (constituants \(i\), quantités \(n_i\)) :
    <div class="formula" data-nom="Identités, composition variable">$$\mathrm{d}U=T\,\mathrm{d}S-p\,\mathrm{d}V+\sum_i\mu_i\,\mathrm{d}n_i\qquad\mathrm{d}G=-S\,\mathrm{d}T+V\,\mathrm{d}p+\sum_i\mu_i\,\mathrm{d}n_i$$</div>
  </div>
  <div class="def-box">
    <strong>Potentiel chimique</strong> du constituant \(i\) (en J·mol⁻¹, grandeur intensive) :
    <div class="formula" data-nom="Potentiel chimique">$$\mu_i=\left(\frac{\partial G}{\partial n_i}\right)_{T,\,p,\,n_{j\neq i}}$$</div>
    et l'enthalpie libre du système s'écrit \(G = \sum_i n_i\,\mu_i\) (admis). Pour un corps pur dans une seule phase, \(\mu = G/n = G_m\) : c'est l'enthalpie libre molaire.
  </div>
  <p>Le même formalisme sert en thermochimie, avec \(\mu_i = \mu_i^\circ + RT\ln a_i\) (chapitre « Thermodynamique de la transformation chimique »). Ici, il sert à décrire l'équilibre entre deux phases d'un même corps pur.</p>
</div>

<div class="course-section">
  <div class="sec-num">§4 · G, POTENTIEL THERMODYNAMIQUE</div>
  <h2>À température et pression fixées, G ne peut que diminuer</h2>
  <div class="intro">Un système qui évolue spontanément au contact de l'atmosphère (température et pression extérieures fixées) va vers un état d'équilibre. Une fonction d'état joue alors le rôle d'une énergie potentielle : elle diminue pendant l'évolution et est minimale à l'équilibre.</div>
  <div class="method-box">
    <strong>Établir que G décroît</strong> (système fermé, en contact avec un thermostat \(T_0\) et une atmosphère \(p_0\), avec \(T = T_0\) et \(p = p_0\) dans l'état initial et l'état final, seul travail celui de la pression)
    <ol>
      <li>Premier principe : \(\Delta U = W + Q = -p_0\Delta V + Q\).</li>
      <li>Deuxième principe : \(\Delta S = \dfrac{Q}{T_0} + S_c\), soit \(Q = T_0\Delta S - T_0S_c\).</li>
      <li>D'où \(\Delta U + p_0\Delta V - T_0\Delta S = -T_0S_c\). Comme \(T\) et \(p\) valent \(T_0\) et \(p_0\) au début et à la fin, le premier membre est \(\Delta(U + pV - TS) = \Delta G\).</li>
    </ol>
    <div class="formula" data-nom="G potentiel thermodynamique">$$\Delta G=-T_0\,S_c\le0$$</div>
  </div>
  <p>À \(T\) et \(p\) fixées, une transformation n'est spontanée que si elle fait diminuer \(G\) ; l'équilibre correspond au minimum de \(G\). La création d'entropie, positive, se lit directement sur la diminution de \(G\) : \(S_c = -\Delta G/T_0\). C'est pourquoi \(G\) est le <strong>potentiel thermodynamique</strong> adapté aux transformations isothermes et isobares, celles de la chimie et des changements d'état à l'air libre.</p>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CORPS PUR SOUS DEUX PHASES</div>
  <h2>Équilibre et évolution par le potentiel chimique</h2>
  <div class="def-box">
    <strong>Phase</strong> : partie d'un système dans laquelle les grandeurs intensives varient continûment (sans discontinuité). Un mélange d'eau liquide et de vapeur d'eau compte deux phases ; de l'eau avec plusieurs glaçons, deux phases aussi (solide et liquide), quel que soit le nombre de glaçons ; un mélange de gaz, une seule phase.
  </div>
  <div class="method-box">
    <strong>Établir les conditions d'évolution et d'équilibre</strong>
    <ol>
      <li>Corps pur réparti entre une phase 1 (\(n_1\) mol, potentiel \(\mu_1\)) et une phase 2 (\(n_2\), \(\mu_2\)), à \(T\) et \(p\) fixées : \(\mathrm{d}G = \mu_1\,\mathrm{d}n_1 + \mu_2\,\mathrm{d}n_2\).</li>
      <li>Conservation de la matière : \(\mathrm{d}n_1 = -\mathrm{d}n_2\), donc \(\mathrm{d}G = (\mu_2 - \mu_1)\,\mathrm{d}n_2\).</li>
      <li>Évolution spontanée : \(\mathrm{d}G \lt 0\). Si \(\mu_1 \gt \mu_2\), alors \(\mathrm{d}n_2 \gt 0\) : <strong>la matière passe de la phase de plus haut potentiel chimique vers celle de plus bas potentiel</strong>.</li>
      <li>Équilibre (\(\mathrm{d}G = 0\) pour tout \(\mathrm{d}n_2\)) : \(\mu_1(T, p) = \mu_2(T, p)\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Un changement d'état isotherme est isobare.</strong> L'égalité \(\mu_1(T, p) = \mu_2(T, p)\) est une relation entre \(T\) et \(p\) : à température donnée, les deux phases ne coexistent que sous une pression bien déterminée, la <strong>pression d'équilibre</strong> (pression de vapeur saturante pour l'équilibre liquide-vapeur), \(p = p_{\text{sat}}(T)\). Tant que les deux phases sont présentes à \(T\) fixée, la pression reste donc constante : c'est le palier des diagrammes.
  </div>
  <h3>Enthalpie et entropie de changement d'état</h3>
  <div class="def-box">
    L'<strong>enthalpie massique de changement d'état</strong> \(\Delta_{1\to2}h = h_2 - h_1\) (ou chaleur latente \(L\)) est le transfert thermique reçu par l'unité de masse qui passe de la phase 1 à la phase 2, à \(T\) et \(p_{\text{sat}}(T)\) fixées. L'<strong>entropie de changement d'état</strong> s'en déduit : la transformation étant réversible à \(T\) constante,
    <div class="formula" data-nom="Entropie de changement d'état">$$\Delta_{1\to2}s=\frac{\Delta_{1\to2}h}{T}$$</div>
  </div>
  <p><strong>Ordre de grandeur à connaître</strong> : pour l'eau, \(\Delta_{\text{vap}}h \approx 2{,}26\ \text{MJ·kg}^{-1}\) à 100 °C (2,5 MJ·kg⁻¹ vers 0 °C), contre \(\Delta_{\text{fus}}h \approx 0{,}33\ \text{MJ·kg}^{-1}\). Vaporiser de l'eau coûte cinq fois plus que la chauffer de 0 à 100 °C (0,42 MJ·kg⁻¹).</p>
  <div class="method-box">
    <strong>Exemple — énergie récupérée par liquéfaction</strong>
    <ol>
      <li>Dans le condenseur d'une centrale, 1 kg de vapeur saturante à 100 °C se liquéfie de façon isobare : il cède \(\Delta_{\text{vap}}h = 2\,257\ \text{kJ}\) au circuit de refroidissement.</li>
      <li>Son entropie diminue de \(\dfrac{2\,257}{373{,}15} \approx 6{,}05\ \text{kJ·K}^{-1}\) ; les tables donnent \(s_V - s_L = 7{,}354 - 1{,}307 = 6{,}047\ \text{kJ·K}^{-1}\cdot\text{kg}^{-1}\) : cohérent.</li>
      <li>Pour évacuer cette énergie, il faut chauffer de 10 °C environ \(2\,257/(4{,}18\times10) \approx 54\ \text{kg}\) d'eau de rivière : d'où les débits considérables des circuits de refroidissement.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TITRE ET RÈGLE DES MOMENTS</div>
  <h2>Composition d'un mélange liquide-vapeur</h2>
  <div class="def-box">
    Le <strong>titre massique en vapeur</strong> d'un mélange liquide-vapeur de masse \(m\) est \(x = m_V/m\) (et \(1 - x\) le titre en liquide). Toute grandeur massique \(a\) (\(v\), \(h\), \(s\), \(u\)) du mélange est la moyenne pondérée des grandeurs des phases saturées :
    <div class="formula" data-nom="Grandeur massique d'un mélange diphasé">$$a=x\,a_V+(1-x)\,a_L$$</div>
  </div>
  <div class="prop-box">
    <strong>Règle des moments.</strong> Le titre se lit sur un palier de n'importe quel diagramme dont l'abscisse est massique :
    <div class="formula" data-nom="Règle des moments">$$x=\frac{a-a_L}{a_V-a_L}=\frac{LM}{LV}$$</div>
    où \(L\), \(V\), \(M\) sont les points représentant le liquide saturant, la vapeur saturante et le mélange sur le palier : le point \(M\) est d'autant plus près de \(V\) que le mélange contient de vapeur.
  </div>
  <div class="method-box">
    <strong>Exemple — eau dans un récipient rigide</strong>
    <p>1,0 kg d'eau dans un récipient de 0,50 m³ à 100 °C. Tables : \(v_L = 1{,}04\times10^{-3}\ \text{m}^3\text{·kg}^{-1}\), \(v_V = 1{,}672\ \text{m}^3\text{·kg}^{-1}\).</p>
    <ol>
      <li>\(v = 0{,}50\ \text{m}^3\text{·kg}^{-1}\) est compris entre \(v_L\) et \(v_V\) : le système est diphasé, sous \(p_{\text{sat}}(100\ °\text{C}) = 1{,}01\ \text{bar}\).</li>
      <li>\(x = \dfrac{0{,}50 - 0{,}00104}{1{,}672 - 0{,}00104} \approx 0{,}30\) : 300 g de vapeur, 700 g de liquide.</li>
      <li>Mais en volume, la vapeur occupe \(0{,}30\times1{,}672 \approx 0{,}50\ \text{m}^3\) et le liquide 0,7 L seulement : le titre massique ne dit rien des volumes.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DIAGRAMMES D'ÉTAT</div>
  <h2>Clapeyron, entropique, Mollier, frigoristes</h2>
  <div class="intro">Les diagrammes d'état représentent les propriétés d'un fluide réel dans deux variables bien choisies ; chaque type de diagramme rend une transformation particulière très lisible. Savoir tracer l'allure des isothermes, isobares, isentropes et isenthalpes, et justifier leur forme dans les limites du gaz parfait et du liquide incompressible, fait partie du programme.</div>
  <div class="prop-box">
    <strong>Éléments communs.</strong> La <strong>courbe de saturation</strong> (en cloche) sépare le domaine diphasique (dessous) du liquide (à gauche) et de la vapeur (à droite) ; elle se compose de la courbe d'ébullition (liquide saturant) et de la courbe de rosée (vapeur saturante), qui se rejoignent au <strong>point critique</strong> C (eau : 374 °C, 221 bar). Dans le domaine diphasique, isothermes et isobares sont <strong>confondues</strong> (\(p = p_{\text{sat}}(T)\)).
  </div>

<figcaption>Diagramme de Clapeyron (p, v) de l'eau, calculé, en échelles logarithmiques. En noir, courbe de saturation (branche liquide à gauche, vapeur à droite) et point critique C (374 °C, 221 bar). Les isothermes (rouge) sont presque verticales dans le liquide (peu compressible), horizontales dans le domaine diphasique (palier de changement d'état) et proches d'hyperboles p ∝ 1/v dans la vapeur peu dense (gaz parfait).</figcaption>
</figure>
  <ul>
    <li><strong>Liquide incompressible</strong> : \(v\) ne dépend presque pas de \(p\) : isothermes quasi verticales.</li>
    <li><strong>Domaine diphasique</strong> : isotherme horizontale (palier à \(p_{\text{sat}}(T)\)).</li>
    <li><strong>Gaz parfait</strong> : \(pv = rT\), isothermes hyperboliques, droites de pente −1 en échelles logarithmiques ; isentropes \(pv^\gamma = \text{cste}\), plus pentues que les isothermes.</li>
    <li>L'aire sous une courbe représente un travail massique : c'est le diagramme des cycles moteurs à gaz.</li>
  </ul>

<figcaption>Diagramme entropique (T, s) de l'eau, calculé. Courbe de saturation en noir, isobares en bleu (confondues avec la branche liquide à gauche, horizontales dans le domaine diphasique, puis montant de façon exponentielle dans la vapeur), courbes d'égal titre en tirets, une isenthalpe en vert (presque horizontale dans la vapeur peu dense, où le gaz est presque parfait).</figcaption>
</figure>
  <ul>
    <li><strong>Gaz parfait</strong> : à \(p\) fixée, \(\mathrm{d}s = c_p\,\mathrm{d}T/T\), donc \(T = T_0\exp\big((s - s_0)/c_p\big)\) : isobares exponentielles, se déduisant les unes des autres par translation horizontale ; les isochores, avec \(c_v \lt c_p\), sont plus pentues. Les isenthalpes sont des isothermes (\(h\) ne dépend que de \(T\)) : horizontales.</li>
    <li><strong>Liquide incompressible</strong> : \(s = c\ln T + \text{cste}\) ne dépend pas de \(p\) : toutes les isobares se confondent avec la courbe d'ébullition.</li>
    <li><strong>Isentropes</strong> : verticales. Une compression ou une détente adiabatique réversible est un segment vertical.</li>
    <li>L'aire sous une courbe représente un transfert thermique massique réversible \(\int T\,\mathrm{d}s\) : l'aire d'un cycle parcouru dans le sens horaire est le travail fourni.</li>
  </ul>

  <ul>

    <li>Dans le domaine diphasique, les isobares sont des droites de pente \(T_{\text{sat}}\) (\(\mathrm{d}h = T\,\mathrm{d}s\) à \(T\) fixée).</li>
  </ul>

  <h2>Lire les tables pour calculer et prévoir</h2>
  <div class="intro">Les diagrammes donnent une lecture rapide ; les tables donnent les valeurs précises. Une table de saturation donne, pour chaque température (ou pression), la pression de saturation et les grandeurs massiques du liquide et de la vapeur saturants ; une table de vapeur surchauffée donne \(v\), \(h\), \(s\) en fonction de \(T\) et \(p\).</div>

  <p class="intro" style="margin-top:0">Extrait d'une table de saturation de l'eau (valeurs calculées ; référence \(h = s = 0\) pour le liquide au point triple).</p>
  <div class="method-box">
    <strong>Méthode — prévoir l'état physique d'un fluide</strong>
    <ol>
      <li>Repérer la température de saturation \(T_{\text{sat}}(p)\) à la pression donnée (ou \(p_{\text{sat}}(T)\)).</li>
      <li>\(T \lt T_{\text{sat}}(p)\) : liquide (dit sous-refroidi) ; \(T \gt T_{\text{sat}}(p)\) : vapeur sèche (surchauffée) ; \(T = T_{\text{sat}}\) : diphasé, il faut une autre donnée (\(v\), \(h\), \(s\)) pour calculer le titre.</li>
      <li>Exemples : eau sous 10 bar à 150 °C : \(T_{\text{sat}}(10\ \text{bar}) \approx 180\ °\text{C}\), c'est du liquide. Eau sous 1 bar à 150 °C : vapeur sèche (\(T \gt 100\ °\text{C}\)).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — détente isentropique de vapeur d'eau dans une turbine</strong>
    <p>De la vapeur saturante sous 10 bar (\(h_1 = 2\,777\ \text{kJ·kg}^{-1}\), \(s_1 = 6{,}585\ \text{kJ·K}^{-1}\text{·kg}^{-1}\)) se détend de façon adiabatique et réversible jusqu'à 1 bar. Sous 1 bar : \(s_L = 1{,}303\), \(s_V = 7{,}359\ \text{kJ·K}^{-1}\text{·kg}^{-1}\) ; \(h_L = 417{,}5\), \(h_V = 2\,675\ \text{kJ·kg}^{-1}\).</p>
    <ol>
      <li>Détente isentropique : \(s_2 = s_1 = 6{,}585\), compris entre \(s_L\) et \(s_V\) à 1 bar : l'état final est diphasé.</li>
      <li>Règle des moments sur \(s\) : \(x_2 = \dfrac{6{,}585 - 1{,}303}{7{,}359 - 1{,}303} \approx 0{,}872\).</li>
      <li>\(h_2 = 417{,}5 + 0{,}872\times(2\,675 - 417{,}5) \approx 2\,386\ \text{kJ·kg}^{-1}\).</li>
      <li>Travail massique récupérable dans la turbine (système ouvert, chapitre « Systèmes ouverts ») : \(h_1 - h_2 \approx 391\ \text{kJ·kg}^{-1}\). La vapeur sort humide (13 % de gouttelettes), ce qui use les aubes : d'où l'intérêt de la surchauffe.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · FLUIDES RÉELS ET DIAGRAMMES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Écrire les principes pour une étape infinitésimale</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Système et étape.</span> Définir le système (éventuellement un sous-système mésoscopique) et l'étape \(t \to t + \mathrm{d}t\) ou \(\mathrm{d}V\).</li>
      <li><span class="step">Échanges.</span> \(\delta W = -p_{\text{ext}}\,\mathrm{d}V\) ; \(\delta Q\) donné par la situation (loi de Newton, flux thermique…) ou nul (adiabatique).</li>
      <li><span class="step">Principes.</span> \(\mathrm{d}U = \delta W + \delta Q\) ; si nécessaire \(\mathrm{d}S = \delta Q/T_{\text{front}} + \delta S_c\).</li>
      <li><span class="step">Équation différentielle</span> en une variable, puis intégration avec la condition initiale.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Utiliser les identités thermodynamiques</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Choix.</span> Variables \((S, V)\) → \(\mathrm{d}U\) ; \((S, p)\) → \(\mathrm{d}H\) ; \((T, p)\) → \(\mathrm{d}G\). Par unité de masse : \(\mathrm{d}h = T\,\mathrm{d}s + v\,\mathrm{d}p\).</li>
      <li><span class="step">Calcul de \(\Delta s\).</span> Remplacer \(\mathrm{d}u\) ou \(\mathrm{d}h\) par leur expression fournie (\(c_v\,\mathrm{d}T\), \(c_p\,\mathrm{d}T\), \(c\,\mathrm{d}T\)) et intégrer le long d'un chemin <strong>commode</strong>, réversible ou non : \(s\) est une fonction d'état.</li>
      <li><span class="step">Allure d'une courbe</span> dans un diagramme : écrire l'identité à la grandeur fixée (\(\mathrm{d}p = 0\), \(\mathrm{d}T = 0\)…) et en déduire la pente.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Exploiter un diagramme d'état</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Placer les points</span> connus par deux coordonnées (ou une coordonnée et une courbe : isobare, isotherme, saturation).</li>
      <li><span class="step">Suivre la transformation</span> : isentrope verticale en \((T, s)\) et \((h, s)\), isenthalpe verticale en \((\log p, h)\), isobare horizontale en \((\log p, h)\).</li>
      <li><span class="step">Lire</span> \(h\), \(s\), \(T\), le titre (courbes d'égal titre ou règle des moments) ; en déduire travaux et transferts massiques.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Calculer avec les tables dans le domaine diphasique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">État.</span> Comparer \(T\) à \(T_{\text{sat}}(p)\), ou \(v\), \(h\), \(s\) aux valeurs saturées : liquide, mélange ou vapeur.</li>
      <li><span class="step">Titre.</span> \(x = (a - a_L)/(a_V - a_L)\) avec la grandeur connue (\(v\) pour un récipient rigide, \(s\) pour une isentropique, \(h\) pour une isenthalpe).</li>
      <li><span class="step">Autres grandeurs.</span> \(b = b_L + x\,(b_V - b_L)\) ; interpoler linéairement entre deux lignes de la table si besoin.</li>
    </ol>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Entropie créée lors d'un contact thermique</h3>
  <div class="statement">Un bloc de cuivre de masse \(m = 1{,}0\ \text{kg}\) (\(c = 385\ \text{J·K}^{-1}\text{·kg}^{-1}\)), initialement à \(T_1 = 373\ \text{K}\), est plongé dans un lac à \(T_0 = 283\ \text{K}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la variation d'entropie du bloc par l'identité thermodynamique.</div>
  <div class="q"><strong>Q2.</strong> En déduire l'entropie échangée et l'entropie créée. Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Phase condensée : \(\mathrm{d}s = c\,\mathrm{d}T/T\), d'où \(\Delta S = mc\ln(T_0/T_1) = 385\ln(283/373) \approx -106\ \text{J·K}^{-1}\).</p>
    <p><strong>Q2.</strong> \(Q = mc(T_0 - T_1) = -34{,}7\ \text{kJ}\), reçu à la température du lac : \(S_e = Q/T_0 \approx -122{,}4\ \text{J·K}^{-1}\). \(S_c = \Delta S - S_e \approx +16\ \text{J·K}^{-1} \gt 0\) : transformation irréversible (transfert thermique sous un écart de température fini).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Allure des isobares d'un gaz parfait dans le diagramme (T, s)</h3>
  <div class="statement">Gaz parfait de capacités thermiques massiques \(c_p\) et \(c_v\) constantes.</div>
  <div class="q"><strong>Q1.</strong> À partir de \(\mathrm{d}h = T\,\mathrm{d}s + v\,\mathrm{d}p\), établir l'équation d'une isobare dans le diagramme \((T, s)\). Même question pour une isochore.</div>
  <div class="q"><strong>Q2.</strong> Montrer que deux isobares se déduisent l'une de l'autre par translation horizontale, et calculer le décalage entre les isobares 1 bar et 10 bar pour l'air (\(r = 287\ \text{J·K}^{-1}\text{·kg}^{-1}\)).</div>
  <div class="q"><strong>Q3.</strong> Comparer les pentes, en un même point, d'une isobare et d'une isochore.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À \(p\) fixée, \(c_p\,\mathrm{d}T = T\,\mathrm{d}s\), donc \(T = T_0\exp\big((s - s_0)/c_p\big)\). À \(v\) fixé, \(\mathrm{d}u = c_v\,\mathrm{d}T = T\,\mathrm{d}s\) : \(T = T_0\exp\big((s - s_0)/c_v\big)\).</p>
    <p><strong>Q2.</strong> \(s(T, p) = c_p\ln T - r\ln p + \text{cste}\) : à \(T\) fixée, passer de \(p_1\) à \(p_2\) décale \(s\) de \(-r\ln(p_2/p_1)\), le même pour toute \(T\). Pour l'air, \(287\ln10 \approx 0{,}66\ \text{kJ·K}^{-1}\text{·kg}^{-1}\) : l'isobare 10 bar est à gauche de l'isobare 1 bar.</p>
    <p><strong>Q3.</strong> Pentes \(\mathrm{d}T/\mathrm{d}s = T/c_p\) (isobare) et \(T/c_v\) (isochore) : l'isochore est plus pentue, d'un facteur \(\gamma\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Vaporisation dans une enceinte rigide</h3>
  <div class="statement">Une enceinte rigide de 10 L contient initialement 50 g d'eau à 60 °C, en équilibre liquide-vapeur. On la chauffe jusqu'à 150 °C. Utiliser la table de saturation du cours.</div>
  <div class="q"><strong>Q1.</strong> Calculer le titre initial et la pression initiale.</div>
  <div class="q"><strong>Q2.</strong> À 150 °C, l'eau est-elle encore diphasée ? Calculer le titre final et la pression.</div>
  <div class="q"><strong>Q3.</strong> Calculer le transfert thermique reçu (on rappelle \(u = h - pv\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v = 0{,}010/0{,}050 = 0{,}20\ \text{m}^3\text{·kg}^{-1}\) ; à 60 °C, \(x_1 = \dfrac{0{,}20 - 0{,}00102}{7{,}667 - 0{,}00102} \approx 0{,}026\) ; \(p_1 = 0{,}20\ \text{bar}\).</p>
    <p><strong>Q2.</strong> Le volume massique reste \(0{,}20\) (enceinte rigide). À 150 °C, \(v_V = 0{,}3925 \gt 0{,}20\) : encore diphasé, \(x_2 = \dfrac{0{,}20 - 0{,}00109}{0{,}3925 - 0{,}00109} \approx 0{,}508\), \(p_2 = 4{,}76\ \text{bar}\).</p>
    <p><strong>Q3.</strong> \(W = 0\) : \(Q = m(u_2 - u_1)\). \(h_1 = 251{,}2 + 0{,}026\times(2\,609 - 251{,}2) \approx 312\ \text{kJ·kg}^{-1}\), \(u_1 = h_1 - p_1v \approx 312 - 4 = 308\ \text{kJ·kg}^{-1}\). \(h_2 = 632{,}2 + 0{,}508\times(2\,746 - 632{,}2) \approx 1\,706\ \text{kJ·kg}^{-1}\), \(u_2 \approx 1\,706 - 95 = 1\,611\ \text{kJ·kg}^{-1}\). \(Q \approx 0{,}050\times1\,303 \approx 65\ \text{kJ}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Surfusion et potentiel chimique</h3>
  <div class="statement">De l'eau liquide peut rester liquide en dessous de 0 °C (surfusion), puis se solidifier brusquement. On donne \(\Delta_{\text{fus}}h = 333\ \text{kJ·kg}^{-1}\) à 0 °C et les capacités \(c_L = 4{,}18\), \(c_S = 2{,}1\ \text{kJ·K}^{-1}\text{·kg}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> À \(-10\ °\text{C}\) sous 1 bar, quelle phase a le plus petit potentiel chimique ? Justifier à partir de l'évolution observée.</div>
  <div class="q"><strong>Q2.</strong> On met en contact 1 kg d'eau surfondue à \(-10\ °\text{C}\) avec un germe de glace, dans un récipient adiabatique et sous pression constante. Quelle masse de glace se forme ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La matière passe spontanément du liquide au solide, donc de la phase de plus haut potentiel vers celle de plus bas : \(\mu_S \lt \mu_L\) à −10 °C. Le liquide est métastable.</p>
    <p><strong>Q2.</strong> Transformation adiabatique et isobare : \(\Delta H = 0\). Chemin fictif : réchauffer le liquide à 0 °C (\(4{,}18\times10 = 41{,}8\ \text{kJ}\)), puis en solidifier une masse \(m_S\) à 0 °C (\(-333\,m_S\)), l'état final étant à 0 °C (il reste du liquide). \(41{,}8 - 333\,m_S = 0\) : \(m_S \approx 0{,}13\ \text{kg}\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Concours PT — Lecture du diagramme des frigoristes</h3>
  <div class="statement">Un réfrigérateur utilise du R134a. À la sortie de l'évaporateur, le fluide est en vapeur saturante à −20 °C (\(p = 1{,}33\ \text{bar}\), \(h_1 = 386\ \text{kJ·kg}^{-1}\), \(s_1 = 1{,}74\ \text{kJ·K}^{-1}\text{·kg}^{-1}\)). Il est comprimé de façon isentropique jusqu'à 10 bar (\(h_2 \approx 429\ \text{kJ·kg}^{-1}\)), se liquéfie dans le condenseur jusqu'à l'état de liquide saturant à 10 bar (\(h_3 = 256\ \text{kJ·kg}^{-1}\)), puis se détend dans un détendeur calorifugé jusqu'à 1,33 bar.</div>
  <div class="q"><strong>Q1.</strong> Placer les quatre points sur le diagramme \((\log p, h)\) du cours et tracer le cycle. Dans quel sens est-il parcouru ?</div>
  <div class="q"><strong>Q2.</strong> Que vaut \(h_4\) ? Calculer le titre en sortie du détendeur, avec \(h_L = 174\) et \(h_V = 386\ \text{kJ·kg}^{-1}\) à −20 °C.</div>
  <div class="q"><strong>Q3.</strong> Calculer le transfert thermique massique reçu à l'évaporateur, le travail massique de compression et l'efficacité. Comparer à l'efficacité de Carnot entre −20 °C et 40 °C (température de condensation sous 10 bar).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> 1 sur la courbe de rosée à 1,33 bar ; 2 dans la vapeur à 10 bar, sur l'isentrope de 1 ; 3 sur la courbe d'ébullition à 10 bar ; 4 dans le domaine diphasique à 1,33 bar, à la verticale de 3. Le cycle est parcouru dans le sens trigonométrique en \((\log p, h)\) : il reçoit du travail (récepteur).</p>
    <p><strong>Q2.</strong> Détente isenthalpe : \(h_4 = h_3 = 256\ \text{kJ·kg}^{-1}\) ; \(x_4 = \dfrac{256 - 174}{386 - 174} \approx 0{,}39\).</p>
    <p><strong>Q3.</strong> \(q_F = h_1 - h_4 = 130\ \text{kJ·kg}^{-1}\) ; \(w = h_2 - h_1 = 43\ \text{kJ·kg}^{-1}\) ; efficacité \(e = q_F/w \approx 3{,}0\). Carnot : \(\dfrac{253}{313 - 253} \approx 4{,}2\). Les irréversibilités (détente, écarts de température aux échangeurs) font perdre environ 30 %.</p>
  </div>
</div>
