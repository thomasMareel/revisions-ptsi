      <div class="sec-num">§1 · VERBES À PARTICULE</div>
      <h2>Phrasal verbs</h2>
      <div class="intro">Un <strong>phrasal verb</strong> = verbe + particule (up, out, into…) dont le sens n'est pas toujours déductible. Très fréquents à l'oral et dans la presse : à apprendre par cœur.</div>
      <div class="prop-box"><strong>Idée / action</strong> : to carry out (effectuer) · to come up with (proposer) · to point out (souligner) · to set up (créer).</div>
      <div class="prop-box"><strong>Relations</strong> : to rely on (compter sur) · to put up with (supporter) · to deal with (traiter) · to take over (reprendre).</div>
      <div class="prop-box"><strong>Résultat</strong> : to turn out (s'avérer) · to bring about (provoquer) · to get rid of (se débarrasser de) · to run out of (être à court de).</div>
      <div class="notice">Beaucoup ont un synonyme « soutenu » d'origine latine (carry out ≈ implement, point out ≈ highlight) : utile pour varier le registre.</div>
