  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 2.1 du programme d'informatique commune, « Méthodes de programmation et analyse des algorithmes », étudiée au 2ᵉ semestre de 1ʳᵉ année. Elle formalise la discipline commencée au 1ᵉʳ semestre : spécifier ses fonctions, les tester, prouver qu'un algorithme s'arrête et donne le bon résultat, estimer son coût. C'est le chapitre de référence de ces notions : les chapitres sur les tris, la dichotomie, les algorithmes gloutons ou les graphes les appliquent.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

    <span class="prompt">Les notions exigibles, dans l'ordre du chapitre (toutes du 2ᵉ semestre)</span>

<div class="course-section">
  <div class="sec-num">§1 · INSTRUCTIONS, EXPRESSIONS, EFFETS DE BORD</div>
  <h2>Ce qu'un programme calcule et ce qu'il modifie</h2>
  <div class="intro">Avant de raisonner sur un programme, il faut savoir distinguer ce qui <em>produit une valeur</em> de ce qui <em>agit</em>, et repérer ce qu'une fonction modifie en dehors d'elle-même. Beaucoup d'erreurs viennent d'une liste modifiée sans qu'on s'en aperçoive.</div>

  <div class="def-box">
    Une <strong>expression</strong> est un morceau de code qui a une <strong>valeur</strong> : <span class="code-inline">3 * x + 1</span>, <span class="code-inline">len(t) &gt; 0</span>, <span class="code-inline">t[i]</span>, <span class="code-inline">f(2)</span>. On peut l'écrire partout où une valeur est attendue (à droite d'un <span class="code-inline">=</span>, dans un test, en argument).<br>
    Une <strong>instruction</strong> est un ordre exécuté pour son action : affectation <span class="code-inline">x = 3</span>, <span class="code-inline">if</span>, <span class="code-inline">while</span>, <span class="code-inline">for</span>, <span class="code-inline">def</span>, <span class="code-inline">return</span>, <span class="code-inline">assert</span>, <span class="code-inline">import</span>. Une instruction n'a pas de valeur.
  </div>

  <div class="prop-box"><strong>L'affectation est une instruction.</strong> En Python, <span class="code-inline">x = 3</span> n'a pas de valeur : on ne peut l'écrire ni dans un calcul ni dans la condition d'un <span class="code-inline">if</span> ou d'un <span class="code-inline">while</span>. C'est un choix des concepteurs du langage. Il protège de la confusion entre <span class="code-inline">=</span> (affecter) et <span class="code-inline">==</span> (comparer), source d'erreurs célèbres dans les langages où l'affectation est une expression ; en contrepartie, une affectation occupe toujours sa propre ligne, avant le test qui l'utilise.</div>
  <pre class="codeblock"><span class="kw">if</span> x = 3:
    print(<span class="str">"trois"</span>)</pre>
  <p>Ce programme est refusé avant même d'être exécuté (erreur de syntaxe) : il fallait écrire <span class="code-inline">if x == 3:</span>.</p>

  <h3>Effet de bord</h3>
  <div class="def-box">Une fonction a un <strong>effet de bord</strong> quand son exécution modifie un état extérieur au calcul de son résultat : elle affiche (<span class="code-inline">print</span>), écrit dans un fichier, modifie une variable globale ou <strong>modifie un objet modifiable reçu en argument</strong> (liste, dictionnaire). Une fonction sans effet de bord, dont le résultat ne dépend que de ses arguments, se comporte comme une fonction mathématique : on peut l'appeler deux fois et obtenir deux fois la même chose.</div>
  <pre class="codeblock"><span class="kw">def</span> doubler_en_place(t):
    <span class="str">"""Double chaque élément de t : modifie t, ne renvoie rien."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        t[i] = 2 * t[i]

<span class="kw">def</span> doubles(t):
    <span class="str">"""Renvoie une NOUVELLE liste : les éléments de t doublés."""</span>
    <span class="kw">return</span> [2 * x <span class="kw">for</span> x <span class="kw">in</span> t]</pre>
  <pre class="codeblock">&gt;&gt;&gt; a = [1, 5, 7]
&gt;&gt;&gt; b = doubles(a)
&gt;&gt;&gt; a, b
([1, 5, 7], [2, 10, 14])
&gt;&gt;&gt; doubler_en_place(a)
&gt;&gt;&gt; a
[2, 10, 14]</pre>
  <p>Pourquoi <span class="code-inline">doubler_en_place(a)</span> modifie-t-elle <span class="code-inline">a</span> alors que Python appelle les fonctions <strong>par valeur</strong> ? Parce que la valeur d'une variable de type liste est la liste elle-même, partagée : le paramètre <span class="code-inline">t</span> reçoit cette valeur et désigne donc <em>le même objet</em> que <span class="code-inline">a</span>. Une affectation <span class="code-inline">t = …</span> dans la fonction, en revanche, donne simplement un autre sens au nom local <span class="code-inline">t</span>, sans toucher à <span class="code-inline">a</span>.</p>

  <p>Le même partage existe hors des fonctions : après <span class="code-inline">u = t</span>, les deux noms désignent une seule liste. Pour obtenir une liste indépendante, on la <strong>copie</strong> (<span class="code-inline">t.copy()</span> ou la tranche <span class="code-inline">t[:]</span>). Cette copie est <strong>superficielle</strong> : pour une liste de listes, les listes intérieures restent partagées (voir le chapitre « Types construits »).</p>
  <pre class="codeblock">&gt;&gt;&gt; t = [4, 8]
&gt;&gt;&gt; u = t            <span class="cmt"># u et t désignent la même liste</span>
&gt;&gt;&gt; v = t.copy()     <span class="cmt"># v est une autre liste, de même contenu</span>
&gt;&gt;&gt; u.append(15)
&gt;&gt;&gt; t, v
([4, 8, 15], [4, 8])</pre>

  <div class="method-box"><strong>Exemple — prédire un affichage</strong>
    <p>Qu'affiche ce programme ?</p>
    <pre class="codeblock"><span class="kw">def</span> ajoute1(t, x):
    t.append(x)          <span class="cmt"># modifie la liste reçue</span>

<span class="kw">def</span> ajoute2(t, x):
    t = t + [x]          <span class="cmt"># nouvelle liste, nommée t localement</span>

a = [1, 2]
ajoute1(a, 3)
ajoute2(a, 4)
print(a)</pre>
    <ol>
      <li><span class="code-inline">ajoute1(a, 3)</span> : <span class="code-inline">t</span> désigne la liste de <span class="code-inline">a</span> ; <span class="code-inline">t.append(3)</span> la modifie. <span class="code-inline">a</span> vaut <span class="code-inline">[1, 2, 3]</span>.</li>
      <li><span class="code-inline">ajoute2(a, 4)</span> : l'expression <span class="code-inline">t + [x]</span> fabrique une <em>nouvelle</em> liste <span class="code-inline">[1, 2, 3, 4]</span>, que l'affectation donne au nom local <span class="code-inline">t</span>. La liste de <span class="code-inline">a</span> n'est pas touchée, et la nouvelle liste est perdue à la fin de l'appel.</li>
      <li>Le programme affiche <span class="code-inline">[1, 2, 3]</span>.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : écrire <span class="code-inline">a = doubler_en_place(a)</span>. La fonction ne renvoie rien, donc <span class="code-inline">None</span> : la liste a bien été doublée, mais le nom <span class="code-inline">a</span> désigne maintenant <span class="code-inline">None</span>. Règle de conduite : une fonction <strong>ou bien</strong> modifie son argument (et ne renvoie rien), <strong>ou bien</strong> renvoie un nouvel objet ; la spécification dit lequel.</div>
  <p>Remarque : un appel de méthode comme <span class="code-inline">t.append(4)</span> est une <em>expression</em> (de valeur <span class="code-inline">None</span>) qu'on écrit seule sur une ligne pour son effet de bord.</p>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SPÉCIFIER UNE FONCTION</div>
  <h2>Dire ce qu'une fonction attend et ce qu'elle garantit</h2>
  <div class="intro">Une spécification est un contrat entre celui qui écrit la fonction et celui qui l'utilise. Elle dit <em>quoi</em>, jamais <em>comment</em> : on doit pouvoir changer l'algorithme sans changer la spécification. C'est aussi le point de départ des tests (§5) et des preuves (§3 et §4).</div>

  <div class="def-box">La <strong>spécification</strong> d'une fonction comprend :
    <ul>
      <li>sa <strong>signature</strong> : nom, paramètres avec leur type, type du résultat ;</li>
      <li>ses <strong>préconditions</strong> : les propriétés que doivent vérifier les arguments (liste non vide, entier positif, liste triée…) ;</li>
      <li>sa <strong>postcondition</strong> : la propriété que vérifie le résultat en fonction des arguments, et les <strong>effets de bord</strong> éventuels.</li>
    </ul>
    Si un appel ne respecte pas les préconditions, la fonction ne promet rien.
  </div>
  <p>On écrit la spécification dans la <strong>chaîne de documentation</strong> (la chaîne entre triples guillemets placée juste après la ligne <span class="code-inline">def</span>). Python accepte aussi d'écrire la signature dans l'en-tête : <span class="code-inline">def position_min(t: list) -&gt; int:</span>. Ces annotations de type ne sont pas vérifiées à l'exécution (Python est typé dynamiquement) : elles documentent, comme dans les sujets de concours.</p>
  <pre class="codeblock"><span class="kw">def</span> position_min(t: list) -&gt; int:
    <span class="str">"""Indice de la première occurrence du minimum de t.</span>
<span class="str">    Précondition : t est une liste non vide de nombres.</span>
<span class="str">    Postcondition : renvoie i tel que t[i] &lt;= t[j] pour tout j</span>
<span class="str">    et t[j] &gt; t[i] pour tout j &lt; i ; t n'est pas modifiée."""</span>
    <span class="kw">assert</span> len(t) &gt; 0
    i_min = 0
    <span class="kw">for</span> j <span class="kw">in</span> range(1, len(t)):
        <span class="cmt"># invariant : t[i_min] est la 1re occurrence</span>
        <span class="cmt">#             du minimum de t[0:j]</span>
        <span class="kw">if</span> t[j] &lt; t[i_min]:
            i_min = j
    <span class="kw">return</span> i_min</pre>
  <p>Le commentaire placé dans la boucle est une <strong>propriété invariante</strong> (§4) : vraie à chaque tour, elle explique pourquoi le résultat est juste. Le programme demande d'annoter ainsi, par des commentaires, préconditions, postconditions et invariants.</p>

  <h3>Assertions</h3>
  <div class="def-box">L'instruction <span class="code-inline">assert condition</span> évalue la condition : si elle est vraie, rien ne se passe ; si elle est fausse, le programme <strong>s'arrête</strong> sur une erreur <span class="code-inline">AssertionError</span> qui indique la ligne fautive.</div>
  <pre class="codeblock">&gt;&gt;&gt; position_min([])
Traceback (most recent call last):
  ...
AssertionError</pre>
  <p>On s'en sert pour <strong>valider les entrées</strong> (une précondition fausse est détectée tout de suite, au lieu de produire plus loin un résultat absurde) et pour écrire des <strong>tests</strong> (§5). Au programme, l'assertion s'écrit sans message ; définir ou rattraper des erreurs (exceptions) n'est pas au programme.</p>

  <div class="method-box"><strong>Exemple — spécifier une fonction à effet de bord</strong>
    <p>On veut insérer un nombre dans une liste triée, sans fabriquer de nouvelle liste.</p>
    <pre class="codeblock"><span class="kw">def</span> inserer(t: list, x: float) -&gt; <span class="kw">None</span>:
    <span class="str">"""Insère x dans t en gardant t triée.</span>
<span class="str">    Précondition : t est triée dans l'ordre croissant.</span>
<span class="str">    Postcondition : t contient en plus x, et reste triée.</span>
<span class="str">    Effet de bord : t est modifiée ; aucune valeur renvoyée."""</span>
    t.append(x)
    i = len(t) - 1
    <span class="kw">while</span> i &gt; 0 <span class="kw">and</span> t[i - 1] &gt; x:
        <span class="cmt"># invariant : t[i] == x, t[i+1:] &gt; x,</span>
        <span class="cmt">#             et t privée de t[i] est triée</span>
        t[i - 1], t[i] = t[i], t[i - 1]
        i = i - 1</pre>
    <ol>
      <li><strong>Signature</strong> : <span class="code-inline">inserer(t: list, x: float) -&gt; None</span> ; le type de retour <span class="code-inline">None</span> annonce qu'il n'y a pas de résultat.</li>
      <li><strong>Précondition</strong> : <span class="code-inline">t</span> triée. Sans elle, la fonction ne place pas <span class="code-inline">x</span> au bon endroit. On ne la vérifie pas par une assertion : cela coûterait un parcours complet de la liste, plus cher que l'insertion elle-même dans le meilleur cas.</li>
      <li><strong>Postcondition et effet de bord</strong> : <span class="code-inline">t</span> est modifiée, contient un élément de plus et reste triée. Pour <span class="code-inline">t = [2, 5, 9]</span> et <span class="code-inline">x = 4</span> : après <span class="code-inline">append</span>, <span class="code-inline">[2, 5, 9, 4]</span> ; deux échanges donnent <span class="code-inline">[2, 5, 4, 9]</span> puis <span class="code-inline">[2, 4, 5, 9]</span> ; on s'arrête car <span class="code-inline">2 &gt; 4</span> est faux.</li>
    </ol>
  </div>

  <h3>Commenter et justifier ses choix</h3>
  <p>Un bon commentaire dit <em>pourquoi</em>, pas <em>quoi</em> : <span class="code-inline">i = i + 1  # on ajoute 1 à i</span> paraphrase le code et n'apprend rien ; <span class="code-inline"># invariant : t[0:i] ne contient que des négatifs</span> éclaire la partie délicate. On justifie aussi le <strong>choix des collections</strong> : une liste pour des données rangées par position et parcourues dans l'ordre ; un dictionnaire pour retrouver une valeur à partir d'une clé (un nom, un mot) ou tester rapidement la présence d'un élément (§7).</p>

  <div class="notice"><strong>Erreur classique</strong> : écrire <span class="code-inline">assert (x &gt; 0, "x doit être positif")</span>. Les parenthèses et la virgule fabriquent un <em>couple</em>, qui est toujours considéré comme vrai : l'assertion ne vérifie plus rien. Au programme, on écrit simplement <span class="code-inline">assert x &gt; 0</span>.</div>
  <div class="notice"><strong>Erreur classique</strong> : vérifier par une assertion une précondition qui coûte plus cher que la fonction. Tester qu'une liste est triée avant une recherche dichotomique fait passer la recherche d'un coût logarithmique à un coût linéaire (§7) : on écrit alors la précondition en commentaire seulement.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TERMINAISON : LE VARIANT</div>
  <h2>Prouver qu'une boucle s'arrête</h2>
  <div class="intro">Une boucle <span class="code-inline">for</span> sur <span class="code-inline">range(a, b)</span> fait un nombre de tours fixé dès le départ : elle termine toujours. Une boucle <span class="code-inline">while</span>, elle, peut tourner indéfiniment ; pour prouver qu'elle s'arrête, on exhibe une quantité entière qui ne peut pas diminuer indéfiniment.</div>

  <div class="def-box">Un <strong>variant</strong> d'une boucle <span class="code-inline">while</span> est une expression construite sur les variables du programme qui
    <ul>
      <li>prend des valeurs <strong>entières positives ou nulles</strong> à chaque test de la condition ;</li>
      <li><strong>diminue strictement</strong> à chaque tour de boucle.</li>
    </ul>
  </div>
  <div class="prop-box"><strong>Terminaison par un variant.</strong> Une boucle qui admet un variant termine : une suite d'entiers positifs ou nuls strictement décroissante ne peut avoir qu'un nombre fini de termes. Plus précisément, si le variant vaut \(v_0\) au premier test, la boucle fait au plus \(v_0\) tours : c'est aussi une première majoration du coût (§6).</div>

  <pre class="codeblock"><span class="kw">def</span> pgcd(a: int, b: int) -&gt; int:
    <span class="str">"""Précondition : a, b entiers &gt;= 0, non tous deux nuls.</span>
<span class="str">    Postcondition : renvoie le pgcd de a et b."""</span>
    <span class="kw">while</span> b &gt; 0:
        a, b = b, a % b      <span class="cmt"># variant : b (entier &gt;= 0)</span>
    <span class="kw">return</span> a</pre>
  <div class="method-box"><strong>Exemple — terminaison de l'algorithme d'Euclide</strong>
    <ol>
      <li><strong>Variant</strong> : \(b\). C'est un entier positif ou nul : au départ par la précondition, puis comme reste d'une division euclidienne.</li>
      <li><strong>Décroissance</strong> : à chaque tour, la nouvelle valeur de \(b\) est \(a \bmod b\), reste de la division par \(b\), donc strictement inférieure à \(b\).</li>
      <li><strong>Conclusion</strong> : la boucle termine, en au plus \(b_0\) tours. Le déroulé de <span class="code-inline">pgcd(252, 198)</span> le confirme :</li>
    </ol>
    <div><table>
<tr><th>moment</th><th><span class="code-inline">a</span></th><th><span class="code-inline">b</span></th><th>test <span class="code-inline">b &gt; 0</span></th></tr>
<tr><td>avant le 1er tour</td><td>252</td><td>198</td><td>198 &gt; 0 : on continue</td></tr>
<tr><td>après le tour 1</td><td>198</td><td>54</td><td>54 &gt; 0 : on continue</td></tr>
<tr><td>après le tour 2</td><td>54</td><td>36</td><td>36 &gt; 0 : on continue</td></tr>
<tr><td>après le tour 3</td><td>36</td><td>18</td><td>18 &gt; 0 : on continue</td></tr>
<tr><td>après le tour 4</td><td>18</td><td>0</td><td>0 : arrêt</td></tr>
</table></div>
    <p>La fonction renvoie 18 (et \(252 = 18\times 14\), \(198 = 18\times 11\)). La correction du résultat, elle, repose sur l'invariant « \(\operatorname{pgcd}(a, b)\) ne change pas », qui découle de \(\operatorname{pgcd}(a, b) = \operatorname{pgcd}(b, a \bmod b)\).</p>
  </div>

  <h3>Choisir le variant</h3>
  <p>Le variant est souvent la variable qui pilote la boucle (\(n\) dans une boucle qui divise \(n\) par 10), mais pas toujours. Dans une boucle à deux indices qui se rapprochent, c'est la <strong>taille de la zone qui reste à examiner</strong> :</p>
  <pre class="codeblock"><span class="kw">def</span> est_palindrome(s: str) -&gt; bool:
    <span class="str">"""Indique si s se lit de la même façon dans les deux sens."""</span>
    i, j = 0, len(s) - 1
    <span class="kw">while</span> i &lt; j:             <span class="cmt"># variant : j - i + 1</span>
        <span class="kw">if</span> s[i] != s[j]:
            <span class="kw">return</span> <span class="kw">False</span>
        i, j = i + 1, j - 1
    <span class="kw">return</span> <span class="kw">True</span></pre>
  <p>Variant : \(j - i + 1\). Tant que la boucle tourne, \(i \lt j\) ; un tour augmente \(i\) de 1 et diminue \(j\) de 1, donc le variant baisse de 2 et reste positif ou nul (il vaut au moins \(-1 + 1 = 0\) après le dernier tour). La sortie anticipée par <span class="code-inline">return False</span> ne gêne pas : elle ne peut qu'arrêter la boucle plus tôt.</p>

  <h3>Une boucle dont on ne sait pas prouver la terminaison</h3>
  <pre class="codeblock"><span class="kw">def</span> temps_de_vol(n: int) -&gt; int:
    <span class="str">"""Nombre d'étapes pour atteindre 1 (n entier &gt;= 1)."""</span>
    k = 0
    <span class="kw">while</span> n != 1:
        <span class="kw">if</span> n % 2 == 0:
            n = n // 2
        <span class="kw">else</span>:
            n = 3 * n + 1
        k = k + 1
    <span class="kw">return</span> k</pre>
  <p>Partant de 27, la suite monte jusqu'à 9 232 avant de redescendre ; <span class="code-inline">temps_de_vol(27)</span> vaut 111. Personne ne sait démontrer que cette boucle termine pour tout \(n \ge 1\) (c'est la conjecture de Syracuse) : aucun variant n'est connu. Cela montre qu'une preuve de terminaison n'a rien d'automatique.</p>

  <h3>Fonctions récursives</h3>
  <p>Pour une fonction récursive, le variant est une quantité entière positive ou nulle qui diminue strictement d'un appel au suivant (souvent l'argument lui-même, ou la longueur d'une liste) ; atteindre le cas de base arrête les appels. Ainsi <span class="code-inline">binaire(n)</span> (§4) appelle <span class="code-inline">binaire(n // 2)</span> avec \(1 \le n /\!/ 2 \lt n\) dès que \(n \ge 2\) : la suite des arguments décroît strictement et finit par valoir 1 (voir le chapitre « Récursivité »).</p>

  <div class="notice"><strong>Erreur classique</strong> : un « variant » flottant. Le programme ci-dessous ne s'arrête pas : à cause des arrondis, \(x\) passe de \(1{,}4\times10^{-16}\) environ à une valeur négative sans jamais valoir exactement 0. Un variant est <strong>entier</strong> ; avec des flottants, on teste <span class="code-inline">x &gt; 0</span>, jamais <span class="code-inline">x != 0</span> (voir le chapitre « Représentation des nombres »).</div>
  <pre class="codeblock">x = 1.0
<span class="kw">while</span> x != 0:        <span class="cmt"># jamais exactement 0 : boucle infinie</span>
    x = x - 0.1</pre>
  <div class="notice"><strong>Erreur classique</strong> : modifier la liste parcourue par une boucle <span class="code-inline">for</span>. Le parcours d'une liste avance case par case jusqu'à sa longueur <em>actuelle</em> : en ajoutant un élément à chaque tour, on ne l'atteint jamais.</div>
  <pre class="codeblock">t = [1, 2]
<span class="kw">for</span> x <span class="kw">in</span> t:          <span class="cmt"># parcourt aussi les éléments ajoutés…</span>
    t.append(x)      <span class="cmt"># … donc ne s'arrête jamais</span></pre>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CORRECTION : L'INVARIANT DE BOUCLE</div>
  <h2>Prouver qu'une boucle calcule ce qu'on veut</h2>
  <div class="intro">Savoir que l'algorithme s'arrête ne suffit pas : il faut aussi que son résultat vérifie la postcondition. L'outil est l'invariant de boucle, une propriété qui décrit ce que les variables contiennent « en cours de route ».</div>

  <div class="def-box">Un algorithme est <strong>partiellement correct</strong> si, pour toute entrée vérifiant la précondition, <em>lorsqu'il s'arrête</em>, son résultat vérifie la postcondition. Il est <strong>totalement correct</strong> s'il est partiellement correct <strong>et</strong> s'il termine pour toute entrée vérifiant la précondition.</div>
  <div class="def-box">Un <strong>invariant de boucle</strong> est une propriété \(I\) des variables qui est :
    <ul>
      <li><strong>vraie avant le premier tour</strong> (initialisation) ;</li>
      <li><strong>conservée</strong> par chaque tour : si \(I\) est vraie au début d'un tour (et la condition de boucle aussi), elle est vraie à la fin de ce tour.</li>
    </ul>
    \(I\) est alors vraie à la sortie de la boucle. Combinée à la négation de la condition de boucle, elle doit donner la postcondition.
  </div>
  <figure class="schema" style="max-width:345px">
<svg viewBox="0 0 345 205" role="img" aria-label="Schéma de preuve par invariant : initialisation, conservation par chaque tour, conclusion à la sortie">

  <pre class="codeblock"><span class="kw">def</span> div_eucl(a: int, b: int) -&gt; tuple:
    <span class="str">"""Précondition : a &gt;= 0 et b &gt; 0 entiers.</span>
<span class="str">    Postcondition : renvoie (q, r) tel que a == b * q + r</span>
<span class="str">    et 0 &lt;= r &lt; b."""</span>
    <span class="kw">assert</span> a &gt;= 0 <span class="kw">and</span> b &gt; 0
    q, r = 0, a
    <span class="kw">while</span> r &gt;= b:
        <span class="cmt"># invariant : a == b * q + r et r &gt;= 0</span>
        q, r = q + 1, r - b
    <span class="kw">return</span> q, r</pre>
  <div class="method-box"><strong>Exemple — correction totale de la division par soustractions</strong>
    <p>Invariant \(I\) : \(a = bq + r\) et \(r \ge 0\).</p>
    <ol>
      <li><strong>Initialisation</strong> : avec \(q = 0\) et \(r = a\), \(bq + r = a\) et \(r = a \ge 0\) par la précondition.</li>
      <li><strong>Conservation</strong> : si \(a = bq + r\), \(r \ge 0\) et la condition \(r \ge b\) est vraie, les nouvelles valeurs \(q' = q + 1\) et \(r' = r - b\) vérifient \(bq' + r' = bq + b + r - b = a\) et \(r' = r - b \ge 0\), <em>grâce à la condition</em> \(r \ge b\).</li>
      <li><strong>Sortie</strong> : la condition est fausse, donc \(r \lt b\) ; avec \(I\), \(a = bq + r\) et \(0 \le r \lt b\) : c'est la postcondition (correction partielle).</li>
      <li><strong>Terminaison</strong> : \(r\) est un variant (entier, positif ou nul par \(I\), et diminue de \(b \ge 1\) à chaque tour). La fonction est totalement correcte.</li>
    </ol>
    <p>Déroulé de <span class="code-inline">div_eucl(23, 5)</span> : la colonne \(5q + r\) vaut 23 à chaque ligne, c'est l'invariant qu'on voit.</p>
    <div><table>
<tr><th>moment</th><th><span class="code-inline">q</span></th><th><span class="code-inline">r</span></th><th><span class="code-inline">5*q + r</span></th><th><span class="code-inline">r &gt;= 5</span> ?</th></tr>
<tr><td>avant le 1er tour</td><td>0</td><td>23</td><td>23</td><td>oui</td></tr>
<tr><td>après le tour 1</td><td>1</td><td>18</td><td>23</td><td>oui</td></tr>
<tr><td>après le tour 2</td><td>2</td><td>13</td><td>23</td><td>oui</td></tr>
<tr><td>après le tour 3</td><td>3</td><td>8</td><td>23</td><td>oui</td></tr>
<tr><td>après le tour 4</td><td>4</td><td>3</td><td>23</td><td>non : sortie</td></tr>
</table></div>
  </div>

  <h3>Une boucle qui peut s'interrompre</h3>
  <pre class="codeblock"><span class="kw">def</span> premier_negatif(t: list) -&gt; int:
    <span class="str">"""Plus petit i tel que t[i] &lt; 0, ou -1 s'il n'y en a pas."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="cmt"># invariant : aucun élément de t[0:i] n'est négatif</span>
        <span class="kw">if</span> t[i] &lt; 0:
            <span class="kw">return</span> i
    <span class="kw">return</span> -1</pre>
  <p>On énonce l'invariant au début du tour d'indice \(i\) ; « après le dernier tour » correspond à \(i = n\) (avec \(n\) = <span class="code-inline">len(t)</span>). Il y a deux façons de sortir :</p>
  <ul>
    <li>par <span class="code-inline">return i</span> : \(t[i] \lt 0\) et, par l'invariant, aucun indice plus petit ne convient, donc \(i\) est bien le plus petit ;</li>
    <li>par <span class="code-inline">return -1</span> après le dernier tour : l'invariant pour \(i = n\) dit qu'aucun élément de \(t\) n'est négatif.</li>
  </ul>
  <p>L'initialisation est évidente (\(t[0:0]\) est vide) ; la conservation aussi : si le tour \(i\) ne s'est pas interrompu, c'est que \(t[i] \ge 0\).</p>

  <h3>Correction d'une fonction récursive : la récurrence</h3>
  <p>Pour une fonction récursive, l'invariant est remplacé par une <strong>récurrence</strong> : on suppose les appels sur des arguments plus petits corrects, et on en déduit l'appel courant.</p>
  <pre class="codeblock"><span class="kw">def</span> binaire(n: int) -&gt; str:
    <span class="str">"""Écriture en base 2 de n (entier &gt;= 1), en chaîne."""</span>
    <span class="kw">if</span> n == 1:
        <span class="kw">return</span> <span class="str">"1"</span>
    <span class="kw">return</span> binaire(n // 2) + str(n % 2)</pre>
  <p>Montrons par récurrence forte sur \(n \ge 1\) que <span class="code-inline">binaire(n)</span> est l'écriture binaire de \(n\). Pour \(n = 1\), c'est <span class="code-inline">"1"</span>. Pour \(n \ge 2\), \(n = 2\,(n /\!/ 2) + (n \bmod 2)\) avec \(1 \le n /\!/ 2 \lt n\) : par hypothèse de récurrence, <span class="code-inline">binaire(n // 2)</span> écrit \(n /\!/ 2\) ; lui ajouter le chiffre \(n \bmod 2\) à droite revient à multiplier par 2 et à ajouter ce chiffre, ce qui écrit \(n\). Ainsi <span class="code-inline">binaire(13)</span> = <span class="code-inline">binaire(6) + "1"</span> = <span class="code-inline">binaire(3) + "0" + "1"</span> = <span class="code-inline">"1" + "1" + "0" + "1"</span> = <span class="code-inline">"1101"</span>.</p>

  <div class="prop-box"><strong>Trouver un invariant.</strong> Dérouler la boucle sur un petit exemple, écrire dans un tableau les valeurs des variables à chaque tour, puis se demander : « que représente cette variable vis-à-vis de la partie déjà traitée ? ». L'invariant décrit le plus souvent le <em>résultat partiel</em> : le minimum, la somme, le nombre d'occurrences <strong>de la partie déjà parcourue</strong>.</div>
  <div class="notice"><strong>Erreur classique</strong> : proposer un invariant vrai mais inutile, comme « \(i \ge 0\) ». Un bon invariant doit, à la sortie, <strong>entraîner la postcondition</strong> ; c'est ce dernier point qu'on vérifie en premier.</div>
  <div class="notice"><strong>Erreur classique</strong> : oublier d'utiliser la condition de boucle dans la conservation. Dans la division, \(r' \ge 0\) n'est vrai que parce que \(r \ge b\) : sans la condition, la preuve ne passe pas.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · TESTER UN PROGRAMME</div>
  <h2>Écrire un jeu de tests</h2>
  <div class="intro">Une preuve garantit la correction d'un algorithme ; des tests vérifient qu'un programme réel, avec ses fautes de frappe et ses indices décalés, se comporte comme prévu. Les tests ne prouvent rien (un test réussi ne dit rien des entrées non essayées), mais ils trouvent vite les erreurs, à condition d'être bien choisis.</div>

  <div class="def-box">Un <strong>jeu de tests</strong> est une liste d'entrées accompagnées des <strong>sorties attendues</strong>, calculées à la main ou par un autre moyen que le programme testé. En Python, on l'écrit sous la forme d'une fonction d'assertions : elle reste silencieuse si tout va bien et s'arrête sur le premier test qui échoue.</div>
  <pre class="codeblock"><span class="kw">def</span> test_div_eucl():
    <span class="kw">assert</span> div_eucl(23, 5) == (4, 3)     <span class="cmt"># cas général</span>
    <span class="kw">assert</span> div_eucl(0, 7) == (0, 0)      <span class="cmt"># a nul</span>
    <span class="kw">assert</span> div_eucl(5, 6) == (0, 5)      <span class="cmt"># a &lt; b : aucun tour</span>
    <span class="kw">assert</span> div_eucl(6, 6) == (1, 0)      <span class="cmt"># a == b : limite</span>
    <span class="kw">assert</span> div_eucl(17, 1) == (17, 0)    <span class="cmt"># b == 1</span>
    <span class="kw">assert</span> div_eucl(60, 12) == (5, 0)    <span class="cmt"># reste nul</span>

test_div_eucl()          <span class="cmt"># silencieux si tout va bien</span></pre>

  <div class="prop-box"><strong>Partitionner le domaine d'entrée, tester les limites.</strong>
    <ul>
      <li>On découpe les entrées possibles en <strong>classes</strong> sur lesquelles le programme devrait se comporter de la même façon (une branche du <span class="code-inline">if</span>, une position du résultat…) et on teste <strong>au moins une entrée par classe</strong>.</li>
      <li>On teste les <strong>limites</strong> : frontières entre classes (là où <span class="code-inline">&lt;</span> et <span class="code-inline">&lt;=</span> diffèrent), et cas extrêmes : liste vide, un seul élément, résultat en première ou en dernière position, valeurs égales, zéro, boucle qui fait 0 ou 1 tour.</li>
    </ul>
  </div>

  <div class="method-box"><strong>Exemple — trouver l'erreur par les limites</strong>
    <p>La fonction suivante doit donner la mention d'une note : insuffisant sous 10, passable de 10 à 12 (exclu), assez bien de 12 à 14, bien de 14 à 16, très bien à partir de 16.</p>
    <pre class="codeblock"><span class="kw">def</span> mention(note: float) -&gt; str:
    <span class="str">"""Mention pour une note de 0 à 20 (version FAUSSE)."""</span>
    <span class="kw">if</span> note &lt; 10:
        <span class="kw">return</span> <span class="str">"insuffisant"</span>
    <span class="kw">elif</span> note &lt; 12:
        <span class="kw">return</span> <span class="str">"passable"</span>
    <span class="kw">elif</span> note &lt; 14:
        <span class="kw">return</span> <span class="str">"assez bien"</span>
    <span class="kw">elif</span> note &gt; 16:
        <span class="kw">return</span> <span class="str">"très bien"</span>
    <span class="kw">else</span>:
        <span class="kw">return</span> <span class="str">"bien"</span></pre>

    <span class="kw">assert</span> mention(18) == <span class="str">"très bien"</span>
    <span class="kw">assert</span> mention(0) == <span class="str">"insuffisant"</span>    <span class="cmt"># … puis les limites</span>
    <span class="kw">assert</span> mention(10) == <span class="str">"passable"</span>

    <span class="kw">assert</span> mention(14) == <span class="str">"bien"</span>
    <span class="kw">assert</span> mention(16) == <span class="str">"très bien"</span>     <span class="cmt"># échoue ici</span>

      <li>Les cinq premiers tests, un par classe, passent tous : la version fausse donne bien « très bien » pour 18.</li>
      <li>Le test à la limite 16 échoue : <span class="code-inline">mention(16)</span> renvoie « bien », car la condition <span class="code-inline">note &gt; 16</span> exclut 16. Il fallait <span class="code-inline">note &gt;= 16</span>.</li>
      <li>Leçon : les erreurs se cachent aux frontières, que seuls les tests de limites atteignent.</li>

  </div>

  <p>Pour <span class="code-inline">position_min</span> (§2), un jeu de tests raisonnable couvre : le minimum en première, au milieu, en dernière position ; un minimum présent deux fois (c'est la <em>première</em> occurrence qui est attendue) ; une liste à un seul élément ; des valeurs négatives ; tous les éléments égaux (réponse 0). On vérifie aussi que la liste n'a pas été modifiée, puisque la spécification le promet.</p>

  <div class="notice"><strong>Erreur classique</strong> : tester des flottants avec <span class="code-inline">==</span>. Le résultat d'un calcul en flottants est approché : on vérifie qu'il est proche de la valeur attendue, par exemple <span class="code-inline">assert abs(x - 0.3) &lt; 1e-9</span> (<span class="code-inline">abs</span> : valeur absolue), et non <span class="code-inline">assert x == 0.3</span>.</div>
  <div class="notice"><strong>Erreur classique</strong> : calculer la sortie « attendue » avec le programme testé lui-même. Le test devient une tautologie : il passera toujours, même si le programme est faux.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · COMPLEXITÉ TEMPORELLE</div>
  <h2>Estimer le temps de calcul avant d'exécuter</h2>
  <div class="intro">Deux programmes justes peuvent mettre l'un une seconde, l'autre une journée sur les mêmes données. La complexité estime, avant toute exécution, comment le temps de calcul grandit avec la taille des données : c'est elle qui décide si un algorithme est utilisable sur un million de valeurs.</div>

  <div class="def-box">
    <ul>
      <li>La <strong>taille</strong> de l'entrée est un entier \(n\) qui mesure les données : longueur d'une liste ou d'une chaîne, nombre de chiffres d'un entier, nombre de sommets d'un graphe…</li>
      <li>Une <strong>opération élémentaire</strong> est une opération dont le coût ne dépend pas de \(n\) : affectation, opération arithmétique ou comparaison sur des nombres de taille bornée, accès <span class="code-inline">t[i]</span>, <span class="code-inline">len(t)</span>, <span class="code-inline">t.append(x)</span>, <span class="code-inline">t.pop()</span>.</li>
      <li>La <strong>complexité dans le pire cas</strong> \(C(n)\) est le plus grand nombre d'opérations élémentaires effectuées sur une entrée de taille \(n\).</li>
    </ul>
  </div>
  <div class="def-box">On note \(C(n) = O(f(n))\) s'il existe une constante \(K\) et un rang \(n_0\) tels que \(C(n) \le K f(n)\) pour tout \(n \ge n_0\). On ne s'intéresse qu'à l'<strong>ordre de grandeur</strong> : on garde le terme qui domine et on oublie les constantes. Par exemple \(3n^2 + 5n + 7 = O(n^2)\).</div>
  <p>Deux résultats servent sans cesse : la somme des premiers entiers (boucles imbriquées) et le nombre de divisions par 2 qui mènent un entier \(n \ge 1\) à 0 (boucles qui divisent) :</p>
  <div class="formula" data-nom="Somme des premiers entiers">$$\sum_{i=0}^{n-1} i = \frac{n(n-1)}{2} = O(n^2)$$</div>
  <div class="formula" data-nom="Nombre de chiffres binaires">$$\text{nombre de chiffres binaires de } n = \lfloor \log_2 n \rfloor + 1 = O(\log n)$$</div>

<tr><td>\(O(2^n)\)</td><td>exponentielle</td><td>toutes les sous-listes</td><td>plus que l’âge de l’Univers</td><td>plus que l’âge de l’Univers</td></tr>
</table></div>
  <p>Un algorithme quadratique reste confortable pour mille valeurs mais prend plus d'une journée pour un million : améliorer l'<em>algorithme</em> (passer de \(O(n^2)\) à \(O(n \log n)\)) fait gagner bien plus qu'un ordinateur dix fois plus rapide.</p>

  <h3>Coût des opérations de Python</h3>
  <p>Certaines écritures courtes cachent une boucle. Avec \(n\) = <span class="code-inline">len(t)</span> et \(k\) la longueur d'une tranche :</p>
  <div><table>
    <tr><th>opération</th><th>coût</th><th>commentaire</th></tr>
    <tr><td><span class="code-inline">t[i]</span>, <span class="code-inline">t[i] = x</span>, <span class="code-inline">len(t)</span></td><td>\(O(1)\)</td><td>accès direct à une case</td></tr>
    <tr><td><span class="code-inline">t.append(x)</span>, <span class="code-inline">t.pop()</span></td><td>\(O(1)\)</td><td>à la fin de la liste</td></tr>
    <tr><td><span class="code-inline">t.pop(0)</span></td><td>\(O(n)\)</td><td>tous les éléments sont décalés (chapitre « Graphes »)</td></tr>
    <tr><td><span class="code-inline">x in t</span></td><td>\(O(n)\)</td><td>parcours de la liste</td></tr>
    <tr><td><span class="code-inline">t.copy()</span>, <span class="code-inline">[0] * n</span></td><td>\(O(n)\)</td><td>fabrique une nouvelle liste</td></tr>
    <tr><td><span class="code-inline">t + u</span></td><td>\(O(n + m)\), \(m\) = <span class="code-inline">len(u)</span></td><td>nouvelle liste : copie de <span class="code-inline">t</span> puis de <span class="code-inline">u</span></td></tr>
    <tr><td><span class="code-inline">t[a:b]</span></td><td>\(O(k)\), \(k = b - a\)</td><td>la tranche est une copie</td></tr>
    <tr><td><span class="code-inline">d[c]</span>, <span class="code-inline">d[c] = v</span>, <span class="code-inline">c in d</span></td><td>\(O(1)\) en moyenne</td><td>dictionnaire (principe étudié en 2ᵉ année)</td></tr>
  </table></div>

  <div class="prop-box"><strong>Règles de calcul.</strong>
    <ul>
      <li><strong>Séquence</strong> : les coûts s'ajoutent ; seul le plus grand compte en ordre de grandeur.</li>
      <li><strong>Test</strong> <span class="code-inline">if</span> : dans le pire cas, on retient la branche la plus coûteuse (plus le coût du test).</li>
      <li><strong>Boucle</strong> : on additionne les coûts de tous les tours ; si chaque tour coûte \(O(1)\), c'est le nombre de tours.</li>
      <li><strong>Appel de fonction</strong> : on compte le coût de la fonction appelée, pas un seul « pas ».</li>
    </ul>
  </div>

  <div class="method-box"><strong>Exemple — meilleur cas et pire cas d'une recherche</strong>
    <pre class="codeblock"><span class="kw">def</span> indice(t: list, x) -&gt; int:
    <span class="str">"""Indice de la première occurrence de x dans t, ou -1."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="kw">if</span> t[i] == x:
            <span class="kw">return</span> i         <span class="cmt"># meilleur cas : 1 tour</span>
    <span class="kw">return</span> -1                <span class="cmt"># pire cas : x absent, n tours</span></pre>
    <ol>
      <li>Taille : \(n\) = <span class="code-inline">len(t)</span>. Chaque tour coûte \(O(1)\) (un accès, une comparaison).</li>
      <li>Meilleur cas : <span class="code-inline">x</span> est en tête, un seul tour. Pire cas : <span class="code-inline">x</span> est absent, \(n\) tours.</li>
      <li>Complexité dans le pire cas : \(O(n)\), linéaire. C'est elle qu'on donne quand on parle de « la » complexité : elle garantit un temps maximal quelle que soit l'entrée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : compter une opération comme élémentaire alors qu'elle ne l'est pas. Une tranche, un test <span class="code-inline">in</span> sur une liste, une concaténation <span class="code-inline">+</span> coûtent autant que la longueur concernée. De même, les entiers de Python n'ont pas de taille maximale : une opération sur des entiers de plusieurs milliers de chiffres coûte d'autant plus cher que les nombres sont longs, ce qui rend la complexité de tels calculs difficile à évaluer (chapitre « Représentation des nombres »).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CALCULER UNE COMPLEXITÉ</div>
  <h2>Boucles imbriquées, boucles qui divisent, appels récursifs</h2>
  <div class="intro">Quelques formes de programmes reviennent sans cesse. Savoir les reconnaître donne la complexité presque au premier coup d'œil ; savoir la justifier par un calcul de somme est ce qu'on attend à l'écrit.</div>

  <div class="method-box"><strong>Exemple — deux boucles imbriquées dépendantes</strong>
    <pre class="codeblock"><span class="kw">def</span> nb_inversions(t: list) -&gt; int:
    <span class="str">"""Nombre de couples (i, j) avec i &lt; j et t[i] &gt; t[j]."""</span>
    n = len(t)
    c = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):   <span class="cmt"># n - 1 - i tours</span>
            <span class="kw">if</span> t[i] &gt; t[j]:
                c = c + 1
    <span class="kw">return</span> c</pre>
    <ol>
      <li>Pour \(i\) fixé, la boucle intérieure fait \(n - 1 - i\) tours, chacun en \(O(1)\).</li>
      <li>Nombre total de tours : \(\displaystyle\sum_{i=0}^{n-1} (n - 1 - i) = \sum_{k=0}^{n-1} k = \frac{n(n-1)}{2}\).</li>
      <li>Complexité \(O(n^2)\), quadratique. Pour <span class="code-inline">[3, 1, 4, 1, 5]</span>, la fonction examine 10 couples et en trouve 3 inversés : (3, 1), (3, 1) et (4, 1).</li>
    </ol>
  </div>

  <div class="method-box"><strong>Exemple — une boucle qui divise par deux</strong>
    <pre class="codeblock"><span class="kw">def</span> nb_bits(n: int) -&gt; int:
    <span class="str">"""Nombre de chiffres binaires de n (entier &gt;= 1)."""</span>
    k = 0
    <span class="kw">while</span> n &gt; 0:
        n = n // 2           <span class="cmt"># n divisé par 2 à chaque tour</span>
        k = k + 1
    <span class="kw">return</span> k</pre>
    <ol>
      <li>Après \(k\) tours, \(n\) a été divisé \(k\) fois par 2 (division entière) : il vaut au plus \(n_0 / 2^k\).</li>
      <li>La boucle s'arrête quand \(n\) vaut 0 ; c'est le cas dès que \(2^k \gt n_0\), soit après \(\lfloor \log_2 n_0 \rfloor + 1\) tours exactement (le nombre de chiffres binaires de \(n_0\)).</li>
      <li>Complexité \(O(\log n)\), logarithmique : 20 tours pour un million, 40 pour mille milliards. C'est le principe de la dichotomie (chapitre « Recherche séquentielle, dictionnaires et dichotomie »).</li>
    </ol>
  </div>

  <div class="method-box"><strong>Exemple — un coût caché et le bon choix de collection</strong>
    <pre class="codeblock"><span class="kw">def</span> sans_doublons(t: list) -&gt; list:
    <span class="str">"""Éléments de t sans répétition, dans l'ordre d'arrivée."""</span>
    res = []
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x <span class="kw">not</span> <span class="kw">in</span> res:     <span class="cmt"># parcours de res : coût len(res)</span>
            res.append(x)
    <span class="kw">return</span> res</pre>
    <ol>
      <li>Le test <span class="code-inline">x not in res</span> parcourt la liste <span class="code-inline">res</span> : jusqu'à \(k\) comparaisons quand <span class="code-inline">res</span> contient \(k\) éléments.</li>
      <li>Pire cas : tous les éléments sont distincts ; <span class="code-inline">res</span> grandit d'un élément par tour et le coût total est \(0 + 1 + \dots + (n-1) = \dfrac{n(n-1)}{2}\), soit \(O(n^2)\).</li>
      <li>Avec un dictionnaire pour mémoriser les éléments déjà vus, le test de présence coûte \(O(1)\) en moyenne et la fonction devient linéaire :</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> sans_doublons2(t: list) -&gt; list:
    <span class="str">"""Même spécification (éléments utilisables comme clés)."""</span>
    vus = {}             <span class="cmt"># test de présence en temps constant</span>
    res = []
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x <span class="kw">not</span> <span class="kw">in</span> vus:
            vus[x] = <span class="kw">True</span>
            res.append(x)
    <span class="kw">return</span> res</pre>
  </div>

  <h3>Fonctions récursives : une relation de récurrence</h3>
  <p>Le coût \(C(n)\) d'une fonction récursive s'exprime en fonction du coût des appels qu'elle fait. Quelques relations à reconnaître (\(c\) désigne une constante) :</p>
  <div class="formula" data-nom="Relations de récurrence usuelles">$$\begin{aligned}
  C(n) &= C(n-1) + c &&\Longrightarrow\ C(n) = O(n) \\
  C(n) &= C(n /\!/ 2) + c &&\Longrightarrow\ C(n) = O(\log n) \\
  C(n) &= 2\,C(n/2) + c\,n &&\Longrightarrow\ C(n) = O(n \log n) \\
  C(n) &= 2\,C(n-1) + c &&\Longrightarrow\ C(n) = O(2^n)
  \end{aligned}$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Les deux premières relations, par télescopage</span><div class="content">
    <p>Si \(C(n) = C(n-1) + c\), alors \(C(n) = C(0) + nc\) en additionnant les \(n\) égalités \(C(k) - C(k-1) = c\) : c'est \(O(n)\).</p>
    <p>Si \(C(n) = C(n /\!/ 2) + c\), la suite des arguments \(n, n /\!/ 2, n /\!/ 4, \dots\) atteint 1 après \(\lfloor \log_2 n \rfloor\) étapes (même calcul que pour <span class="code-inline">nb_bits</span>) ; on ajoute \(c\) à chaque étape : \(C(n) = C(1) + c\lfloor \log_2 n\rfloor = O(\log n)\).</p>
    <p>La troisième (tri fusion) et la quatrième (deux appels sur \(n-1\), comme l'énumération des sous-listes) se traitent en dessinant l'arbre des appels : \(\log_2 n\) niveaux de coût \(cn\) chacun pour l'une, \(2^k\) appels au niveau \(k\) pour l'autre.</p>
  </div></div>

  <h3>Vérifier par l'expérience</h3>
  <p>On peut confronter le calcul à une mesure : si le temps double quand \(n\) double, l'algorithme est linéaire ; s'il est multiplié par 4, quadratique. Le module <span class="code-inline">time</span> fournit <span class="code-inline">time.perf_counter()</span>, une horloge précise qui renvoie un nombre de secondes ; la différence de deux lectures donne une durée.</p>
  <pre class="codeblock"><span class="kw">import</span> time       <span class="cmt"># time.perf_counter() : horloge, en secondes</span>

<span class="kw">def</span> duree(f, t):
    <span class="str">"""Durée (en s) de l'appel f(t)."""</span>
    debut = time.perf_counter()
    f(t)
    <span class="kw">return</span> time.perf_counter() - debut

<span class="kw">for</span> n <span class="kw">in</span> [1000, 2000, 4000]:
    t = [k <span class="kw">for</span> k <span class="kw">in</span> range(n)]          <span class="cmt"># pire cas : aucun doublon</span>
    print(n, duree(sans_doublons, t))  <span class="cmt"># × 4 quand n double</span></pre>
  <p>Sur un ordinateur ordinaire, les durées affichées sont de quelques millisecondes et le rapport de deux durées successives est voisin de 4, comme le prévoit le calcul du pire cas de <span class="code-inline">sans_doublons</span>.</p>
</div>

<div class="course-section">
  <div class="sec-num">§8 · COMPLEXITÉ EN ESPACE</div>
  <h2>Mesurer la mémoire utilisée</h2>
  <div class="intro">Le temps n'est pas la seule ressource : une liste d'un milliard d'entiers ne tient pas dans la mémoire d'un ordinateur portable. On estime donc aussi la mémoire qu'un algorithme utilise en plus de ses données.</div>

  <div class="def-box">La <strong>complexité en espace</strong> d'un algorithme est l'ordre de grandeur de la mémoire <strong>supplémentaire</strong> qu'il utilise dans le pire cas, comptée en nombre de cases (nombres, éléments de listes), en plus de la place occupée par les données d'entrée. Un algorithme en espace \(O(1)\) travaille <strong>en place</strong>.</div>
  <pre class="codeblock"><span class="kw">def</span> renverse(t: list) -&gt; list:
    <span class="str">"""Nouvelle liste : t dans l'ordre inverse (t intacte)."""</span>
    n = len(t)
    <span class="kw">return</span> [t[n - 1 - i] <span class="kw">for</span> i <span class="kw">in</span> range(n)]      <span class="cmt"># espace O(n)</span>

<span class="kw">def</span> renverse_en_place(t: list) -&gt; <span class="kw">None</span>:
    <span class="str">"""Retourne t sur place (effet de bord) ; espace O(1)."""</span>
    i, j = 0, len(t) - 1
    <span class="kw">while</span> i &lt; j:
        t[i], t[j] = t[j], t[i]
        i, j = i + 1, j - 1</pre>
  <p>Les deux fonctions ont un coût en temps \(O(n)\). La première fabrique une nouvelle liste de \(n\) éléments : espace \(O(n)\), mais la liste de départ est préservée. La seconde n'utilise que deux indices : espace \(O(1)\), au prix d'un effet de bord. La spécification dit lequel des deux comportements on attend.</p>

  <h3>La mémoire des appels récursifs</h3>
  <p>Chaque appel récursif en attente occupe une place dans la <strong>pile d'appels</strong> (ses paramètres, ses variables locales) : une récursion de profondeur \(p\) utilise un espace \(O(p)\) au moins. Python limite par défaut cette profondeur à environ mille appels, au-delà de quoi il s'arrête sur une erreur (<span class="code-inline">RecursionError</span>).</p>
  <div class="method-box"><strong>Exemple — le coût caché des tranches</strong>
    <pre class="codeblock"><span class="kw">def</span> somme_rec(t: list) -&gt; float:
    <span class="str">"""Somme des éléments de t (version coûteuse)."""</span>
    <span class="kw">if</span> len(t) == 0:
        <span class="kw">return</span> 0
    <span class="kw">return</span> t[0] + somme_rec(t[1:])  <span class="cmt"># t[1:] : copie de n-1 cases</span></pre>
    <ol>
      <li>L'appel sur une liste de longueur \(k\) fabrique la tranche <span class="code-inline">t[1:]</span> de longueur \(k - 1\) : \(O(k)\) opérations.</li>
      <li>Temps total : \((n-1) + (n-2) + \dots + 1 + 0 = \dfrac{n(n-1)}{2}\), donc \(O(n^2)\) pour une simple somme.</li>
      <li>Espace : au moment du cas de base, les \(n\) appels sont en attente et chacun garde sa tranche ; elles totalisent \(O(n^2)\) cases.</li>
      <li>En passant un indice au lieu d'une tranche, on retrouve un temps \(O(n)\) et un espace \(O(n)\), celui de la pile :</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> somme_rec2(t: list, i: int) -&gt; float:
    <span class="str">"""Somme de t[i:], sans copie (appel : somme_rec2(t, 0))."""</span>
    <span class="kw">if</span> i == len(t):
        <span class="kw">return</span> 0
    <span class="kw">return</span> t[i] + somme_rec2(t, i + 1)</pre>
  </div>

  <h3>Échanger de la mémoire contre du temps</h3>
  <pre class="codeblock"><span class="kw">def</span> sommes_prefixes(t: list) -&gt; list:
    <span class="str">"""s[k] = t[0] + … + t[k-1] pour 0 &lt;= k &lt;= len(t)."""</span>
    s = [0] * (len(t) + 1)
    <span class="kw">for</span> k <span class="kw">in</span> range(len(t)):
        s[k + 1] = s[k] + t[k]
    <span class="kw">return</span> s

<span class="kw">def</span> somme_tranche(s: list, a: int, b: int) -&gt; float:
    <span class="str">"""Somme de t[a:b] (0 &lt;= a &lt;= b &lt;= len(t)) ;</span>
<span class="str">    s est la liste sommes_prefixes(t)."""</span>
    <span class="kw">return</span> s[b] - s[a]</pre>
  <p>Pour répondre à \(q\) questions « somme de <span class="code-inline">t[a:b]</span> ? », recalculer chaque somme coûte jusqu'à \(O(n)\) par question, soit \(O(qn)\). En stockant d'abord les sommes partielles (temps \(O(n)\), espace \(O(n)\)), chaque question coûte \(O(1)\) par différence : \(O(n + q)\) en tout. Pour <span class="code-inline">t = [4, -2, 7, 1]</span>, <span class="code-inline">s = [0, 4, 2, 9, 10]</span> et la somme de <span class="code-inline">t[1:3]</span> vaut <span class="code-inline">s[3] - s[1]</span> = 5. Ce compromis annonce la programmation dynamique de 2ᵉ année.</p>
  <div class="notice"><strong>Erreur classique</strong> : oublier la pile d'appels dans l'espace d'une fonction récursive, ou les tranches créées à chaque appel. Une fonction récursive sans liste ni tableau peut tout de même utiliser un espace \(O(n)\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ÉTUDE COMPLÈTE D'UN ALGORITHME</div>
  <h2>Séparer les négatifs des positifs, du contrat aux tests</h2>
  <div class="intro">On reprend tous les outils du chapitre sur un même problème : réordonner une liste de nombres, sur place, pour mettre d'abord tous les nombres strictement négatifs. L'ordre entre les négatifs, et entre les autres, est sans importance.</div>
  <pre class="codeblock"><span class="kw">def</span> separer(t: list) -&gt; int:
    <span class="str">"""Réordonne t sur place : les éléments &lt; 0, puis les autres.</span>
<span class="str">    Précondition : t est une liste de nombres.</span>
<span class="str">    Postcondition : renvoie k tel que t[0:k] ne contient que</span>
<span class="str">    des nombres &lt; 0 et t[k:] que des nombres &gt;= 0 ;</span>
<span class="str">    t contient les mêmes éléments qu'au départ."""</span>
    i, j = 0, len(t) - 1
    <span class="kw">while</span> i &lt;= j:
        <span class="cmt"># invariant : t[0:i] &lt; 0, t[j+1:] &gt;= 0,</span>
        <span class="cmt">#             mêmes éléments qu'au départ</span>
        <span class="kw">if</span> t[i] &lt; 0:
            i = i + 1
        <span class="kw">else</span>:
            t[i], t[j] = t[j], t[i]
            j = j - 1
    <span class="kw">return</span> i</pre>
