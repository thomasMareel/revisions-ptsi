  <div class="method-box"><strong>Exemple — la preuve et le déroulé</strong>
    <ol>
      <li><strong>Invariant</strong> : <span class="code-inline">t[0:i]</span> ne contient que des négatifs, <span class="code-inline">t[j+1:]</span> que des nombres positifs ou nuls, et la liste contient les mêmes éléments qu'au départ. Initialisation : \(i = 0\) et \(j = n - 1\), les deux zones sont vides. Conservation : si \(t[i] \lt 0\), la zone des négatifs s'agrandit d'un négatif ; sinon \(t[i] \ge 0\) part en position \(j\), dans la zone des positifs qui s'agrandit, et un échange ne change pas les éléments présents.</li>
      <li><strong>Variant</strong> : \(j - i + 1\), la taille de la zone à examiner ; il diminue de 1 à chaque tour et vaut 0 à la sortie, car la boucle s'arrête exactement quand \(i = j + 1\).</li>
      <li><strong>Sortie</strong> : avec \(i = j + 1\), l'invariant dit que <span class="code-inline">t[0:i]</span> est négatif et <span class="code-inline">t[i:]</span> positif ou nul : la fonction renvoie \(k = i\), postcondition vérifiée. Correction totale.</li>
      <li><strong>Déroulé</strong> sur <span class="code-inline">[3, -1, 4, -5, 0, -2]</span> :</li>
    </ol>
    <div><table>
<tr><th><span class="code-inline">i</span></th><th><span class="code-inline">j</span></th><th>liste au test</th><th>action</th></tr>
<tr><td>0</td><td>5</td><td><span class="code-inline">[3, -1, 4, -5, 0, -2]</span></td><td><span class="code-inline">t[0]</span> ≥ 0 : échange avec <span class="code-inline">t[5]</span>, j recule</td></tr>
<tr><td>0</td><td>4</td><td><span class="code-inline">[-2, -1, 4, -5, 0, 3]</span></td><td><span class="code-inline">t[0]</span> &lt; 0 : i avance</td></tr>
<tr><td>1</td><td>4</td><td><span class="code-inline">[-2, -1, 4, -5, 0, 3]</span></td><td><span class="code-inline">t[1]</span> &lt; 0 : i avance</td></tr>
<tr><td>2</td><td>4</td><td><span class="code-inline">[-2, -1, 4, -5, 0, 3]</span></td><td><span class="code-inline">t[2]</span> ≥ 0 : échange avec <span class="code-inline">t[4]</span>, j recule</td></tr>
<tr><td>2</td><td>3</td><td><span class="code-inline">[-2, -1, 0, -5, 4, 3]</span></td><td><span class="code-inline">t[2]</span> ≥ 0 : échange avec <span class="code-inline">t[3]</span>, j recule</td></tr>
<tr><td>2</td><td>2</td><td><span class="code-inline">[-2, -1, -5, 0, 4, 3]</span></td><td><span class="code-inline">t[2]</span> &lt; 0 : i avance</td></tr>
<tr><td>3</td><td>2</td><td><span class="code-inline">[-2, -1, -5, 0, 4, 3]</span></td><td>i &gt; j : sortie, renvoie k = 3</td></tr>
</table></div>
  </div>
  <p><strong>Complexité.</strong> Le variant vaut \(n\) au départ et baisse de 1 à chaque tour : exactement \(n\) tours en \(O(1)\), donc un temps \(O(n)\) ; deux indices seulement, donc un espace \(O(1)\) (algorithme en place).</p>
  <p><strong>Tests.</strong> Classes à couvrir : liste vide, un seul élément (négatif, positif, nul), que des négatifs, que des positifs, mélange quelconque, zéro (qui doit aller avec les positifs). Comme plusieurs réponses sont justes (l'ordre interne des zones est libre), le test vérifie la <em>propriété</em> annoncée plutôt qu'une liste précise :</p>
  <pre class="codeblock"><span class="kw">def</span> verifie(t):
    u = t.copy()           <span class="cmt"># on garde l'entrée pour comparer</span>
    k = separer(u)
    <span class="kw">for</span> x <span class="kw">in</span> u[0:k]:
        <span class="kw">assert</span> x &lt; 0
    <span class="kw">for</span> x <span class="kw">in</span> u[k:]:
        <span class="kw">assert</span> x &gt;= 0
    <span class="kw">assert</span> sorted(u) == sorted(t)    <span class="cmt"># mêmes éléments</span>

<span class="kw">for</span> t <span class="kw">in</span> [[], [3], [-3], [0], [-1, -2], [4, 5],
          [3, -1, 4, -5, 0, -2], [-1, 2, -3, 4]]:
    verifie(t)</pre>
  <p>Ici <span class="code-inline">sorted(u)</span> (copie triée de <span class="code-inline">u</span>, fonction de Python hors annexe, utilisée seulement pour le test) permet de vérifier que les éléments n'ont pas changé.</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Au-delà du programme</h2>
  <ul>
    <li><strong>Notations \(\Theta\) et \(\Omega\)</strong> : \(C(n) = \Theta(f(n))\) signifie que \(C(n)\) est encadré par deux multiples de \(f(n)\) (ordre de grandeur exact), \(\Omega\) donne une minoration. Les sujets de concours les définissent quand ils les emploient.</li>
    <li><strong>Complexité en moyenne et coût amorti</strong> : moyenne du coût sur toutes les entrées d'une taille donnée (tri rapide en \(O(n \log n)\) en moyenne, mais \(O(n^2)\) au pire) ; coût moyen d'une opération sur une longue suite d'opérations (<span class="code-inline">append</span> est en \(O(1)\) amorti).</li>
    <li><strong>Assertions avec message et exceptions</strong> : <span class="code-inline">assert x &gt; 0, "message"</span>, <span class="code-inline">raise</span>, <span class="code-inline">try … except</span> pour rattraper une erreur.</li>
    <li><strong>Preuve formelle</strong> : la logique de Hoare écrit \(\{P\}\ \text{code}\ \{Q\}\) pour « si \(P\) est vraie avant, \(Q\) l'est après », et des logiciels vérifient de telles preuves. Il n'existe en revanche aucun programme capable de décider, pour tout programme, s'il termine (indécidabilité du problème de l'arrêt, démontrée par Turing en 1936).</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="anal-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CORRECTION ET COMPLEXITÉ</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Neuf savoir-faire pour spécifier, prouver, tester et évaluer un programme, tels qu'on les attend dans une épreuve d'informatique : chaque méthode renvoie aux sections du cours.</div>

  <div class="method-box"><strong>Méthode 1 — Écrire la spécification d'une fonction</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Signature.</span> Nom, paramètres avec leur type, type du résultat (<span class="code-inline">None</span> si la fonction ne renvoie rien) : <span class="code-inline">moyenne(t: list) -&gt; float</span>.</li>
      <li><span class="step">Préconditions.</span> Tout ce que le code suppose sur les arguments : liste non vide, triée, entier positif, indices valides.</li>
      <li><span class="step">Postcondition.</span> La relation entre le résultat et les arguments, sans décrire l'algorithme ; puis les effets de bord : « <span class="code-inline">t</span> est modifiée » ou « <span class="code-inline">t</span> n'est pas modifiée ».</li>
      <li><span class="step">Assertions.</span> Vérifier par <span class="code-inline">assert</span> les préconditions peu coûteuses, en tête de fonction (§2).</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">moyenne(t: list) -&gt; float</span>, « précondition : <span class="code-inline">t</span> est une liste non vide de nombres ; renvoie la moyenne arithmétique des éléments de <span class="code-inline">t</span>, qui n'est pas modifiée ». La précondition se vérifie par <span class="code-inline">assert len(t) &gt; 0</span> : sans elle, la division par <span class="code-inline">len(t)</span> échouerait.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Prouver la terminaison d'une boucle while</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Observer.</span> Repérer les variables qui changent à chaque tour et ce qui finira par rendre la condition fausse.</li>
      <li><span class="step">Proposer un variant.</span> Une expression <strong>entière</strong>, <strong>positive ou nulle</strong> à chaque test (la condition de boucle aide souvent à le montrer) et qui <strong>diminue strictement</strong> à chaque tour.</li>
      <li><span class="step">Conclure.</span> La boucle termine, et fait au plus autant de tours que la valeur initiale du variant (§3).</li>
      <li><span class="step">Boucle for.</span> Sur <span class="code-inline">range(a, b)</span>, la terminaison est immédiate ; sur une liste, vérifier que le corps ne l'allonge pas.</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> racine_entiere(n: int) -&gt; int:
    <span class="str">"""Plus grand entier r tel que r * r &lt;= n (n entier &gt;= 0)."""</span>
    r = 0
    <span class="kw">while</span> (r + 1) * (r + 1) &lt;= n:     <span class="cmt"># variant : n - r * r</span>
        r = r + 1
    <span class="kw">return</span> r</pre>
    <p><em>Exemple éclair :</em> variant \(n - r^2\). C'est un entier ; il vaut \(n \ge 0\) au premier test, et un tour n'a lieu que si \((r+1)^2 \le n\), donc après le tour \(r^2 \le n\) : il reste positif ou nul. Comme \(r\) augmente, il diminue strictement.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un variant flottant, ou qui peut devenir négatif sans que la boucle s'arrête. <span class="code-inline">while x != 0: x = x - 0.1</span> ne termine pas ; <span class="code-inline">while i != n: i = i + 2</span> ne termine pas si \(n\) est impair.</div>

  <div class="method-box"><strong>Méthode 3 — Trouver un invariant de boucle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Dérouler.</span> Sur un petit exemple, noter dans un tableau les valeurs des variables au début de chaque tour.</li>
      <li><span class="step">Généraliser.</span> Exprimer chaque variable en fonction du numéro du tour et des données : « <span class="code-inline">p</span> vaut \(x^i\) », « <span class="code-inline">m</span> est le maximum de <span class="code-inline">t[0:i]</span> ».</li>
      <li><span class="step">Tester la sortie.</span> Remplacer l'indice par sa valeur finale : on doit retrouver la postcondition. Sinon, renforcer l'invariant.</li>
      <li><span class="step">Prouver.</span> Initialisation, puis conservation (méthode 4).</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> puissance(x: float, n: int) -&gt; float:
    <span class="str">"""x ** n par multiplications successives (n entier &gt;= 0)."""</span>
    p = 1
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="cmt"># invariant : p == x ** i au début du tour i</span>
        p = p * x
    <span class="kw">return</span> p</pre>
    <p><em>Exemple éclair :</em> pour \(x = 3\), <span class="code-inline">p</span> vaut 1, 3, 9, 27 au début des tours 0, 1, 2, 3 : invariant \(p = x^i\). Après le dernier tour, \(i\) vaut \(n\) et \(p = x^n\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Rédiger une preuve de correction totale</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Contrat.</span> Rappeler la précondition et la postcondition.</li>
      <li><span class="step">Invariant.</span> L'énoncer précisément, en disant à quel moment il est vrai (au début du tour d'indice \(i\), à chaque test de la condition).</li>
      <li><span class="step">Initialisation.</span> Le vérifier avec les valeurs d'avant la boucle.</li>
      <li><span class="step">Conservation.</span> Le supposer vrai au début d'un tour <strong>et la condition vraie</strong>, et le montrer à la fin du tour.</li>
      <li><span class="step">Sortie.</span> Invariant + négation de la condition (ou cas d'un <span class="code-inline">return</span> dans la boucle) ⟹ postcondition : correction partielle.</li>
      <li><span class="step">Terminaison.</span> Un variant (méthode 2) : correction totale. Pour une fonction récursive, remplacer les étapes 2 à 5 par une récurrence sur la taille de l'argument (§4).</li>
    </ol>
    <p><em>Exemple éclair :</em> maximum de <span class="code-inline">t</span> non vide par <span class="code-inline">m = t[0]</span> puis <span class="code-inline">for i in range(1, len(t)): if t[i] &gt; m: m = t[i]</span>. Invariant au début du tour \(i\) : \(m = \max t[0:i]\). Initialisation : \(\max t[0:1] = t[0]\). Conservation : après le tour, \(m = \max(\max t[0:i], t[i]) = \max t[0:i+1]\). Sortie (\(i = n\)) : \(m = \max t\). Terminaison : boucle <span class="code-inline">for</span>.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Construire un jeu de tests</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Partitionner.</span> Découper les entrées en classes de même comportement attendu (une par branche, par position du résultat, par signe…).</li>
      <li><span class="step">Une entrée par classe</span>, avec la sortie attendue calculée à la main.</li>
      <li><span class="step">Les limites.</span> Frontières des conditions (<span class="code-inline">&lt;</span> contre <span class="code-inline">&lt;=</span>), liste vide, un seul élément, résultat en première ou dernière position, valeurs égales, zéro.</li>
      <li><span class="step">Écrire</span> une fonction de test faite d'assertions ; comparer les flottants avec une tolérance ; si plusieurs réponses sont justes, tester la propriété attendue (§5).</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> est_bissextile(a: int) -&gt; bool:
    <span class="str">"""Année bissextile (calendrier grégorien, a &gt;= 1583)."""</span>
    <span class="kw">return</span> (a % 4 == 0 <span class="kw">and</span> a % 100 != 0) <span class="kw">or</span> a % 400 == 0

<span class="kw">def</span> test_bissextile():
    <span class="kw">assert</span> <span class="kw">not</span> est_bissextile(2023)    <span class="cmt"># non multiple de 4</span>
    <span class="kw">assert</span> est_bissextile(2024)        <span class="cmt"># de 4, pas de 100</span>
    <span class="kw">assert</span> <span class="kw">not</span> est_bissextile(1900)    <span class="cmt"># de 100, pas de 400</span>
    <span class="kw">assert</span> est_bissextile(2000)        <span class="cmt"># multiple de 400</span>

test_bissextile()</pre>
    <p><em>Exemple éclair :</em> quatre classes (non multiple de 4 ; multiple de 4 mais pas de 100 ; multiple de 100 mais pas de 400 ; multiple de 400), un test chacune. Une version qui oublierait la règle des siècles serait prise en défaut par 1900.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : des tests tous « au milieu » des classes. La plupart des erreurs (indice décalé de un, inégalité stricte au lieu de large) ne se voient qu'aux limites.</div>

  <div class="method-box"><strong>Méthode 6 — Calculer une complexité dans le pire cas</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Taille.</span> Choisir le paramètre \(n\) (longueur, nombre de chiffres, nombre de sommets…).</li>
      <li><span class="step">Coûts cachés.</span> Repérer ce qui n'est pas élémentaire : <span class="code-inline">in</span> sur une liste, tranches, concaténations, <span class="code-inline">pop(0)</span>, appels de fonctions (§6).</li>
      <li><span class="step">Compter.</span> De la boucle la plus intérieure vers l'extérieure ; si la boucle intérieure dépend de l'indice de l'extérieure, écrire la somme et la calculer.</li>
      <li><span class="step">Conclure.</span> Garder le terme dominant, sans constante : \(O(\dots)\) ; dire quelle entrée réalise le pire cas.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">for i in range(n):</span> puis <span class="code-inline">for j in range(i, n):</span> avec un corps en \(O(1)\) : \(\sum_{i=0}^{n-1}(n - i) = \dfrac{n(n+1)}{2}\) tours, donc \(O(n^2)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Reconnaître une complexité sur la forme du code</strong>
    <ol style="margin-top:.4rem">
      <li>Une boucle de \(n\) tours en \(O(1)\) : \(O(n)\).</li>
      <li>Deux boucles imbriquées de \(n\) tours au plus chacune, même dépendantes (<span class="code-inline">j</span> de <span class="code-inline">i</span> à <span class="code-inline">n</span>) : \(O(n^2)\).</li>
      <li>Une variable multipliée ou divisée par une constante à chaque tour (2, 3, 10…) : \(O(\log n)\), quelle que soit la base.</li>
      <li>Une boucle de \(n\) tours qui contient une boucle « qui divise » : \(O(n \log n)\).</li>
      <li>Récursion : un appel sur \(n - 1\) donne \(O(n)\) ; un appel sur \(n /\!/ 2\), \(O(\log n)\) ; deux appels sur \(n - 1\), \(O(2^n)\) (§7).</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">while i &gt; 0: i = i // 3</span> fait \(\lfloor \log_3 n \rfloor + 1\) tours : \(O(\log n)\), car \(\log_3 n = \log_2 n / \log_2 3\) ne diffère de \(\log_2 n\) que par une constante.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : conclure « deux boucles, donc \(O(n^2)\) » sans regarder leurs bornes. Deux boucles <em>successives</em> de \(n\) tours coûtent \(O(n)\) ; une boucle intérieure qui divise par 2 donne \(O(n \log n)\).</div>

  <div class="method-box"><strong>Méthode 8 — Évaluer une complexité en espace</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Structures créées.</span> Lister les listes, dictionnaires, copies et tranches fabriqués, avec leur taille maximale <em>simultanée</em>.</li>
      <li><span class="step">Pile d'appels.</span> Pour une fonction récursive, ajouter la profondeur maximale des appels en attente, multipliée par la mémoire de chacun (§8).</li>
      <li><span class="step">Ne pas compter</span> les données d'entrée ; conclure par \(O(\dots)\) ; \(O(1)\) signifie « en place ».</li>
    </ol>
    <p><em>Exemple éclair :</em> une fonction récursive qui teste si une chaîne est un palindrome en s'appelant sur <span class="code-inline">s[1:len(s)-1]</span> fait environ \(n/2\) appels en attente, chacun avec une tranche de longueur \(n - 2, n - 4, \dots\) : espace \(O(n^2)\). La version à deux indices (§3) est en espace \(O(1)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Repérer un effet de bord ou un partage indésirable</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Modifications.</span> Chercher les instructions qui modifient un objet : <span class="code-inline">t[i] = …</span>, <span class="code-inline">append</span>, <span class="code-inline">pop</span>, <span class="code-inline">d[c] = …</span>.</li>
      <li><span class="step">Noms partagés.</span> Pour chaque objet modifié, lister les noms qui le désignent : argument et paramètre, <span class="code-inline">u = t</span>, lignes d'une liste construite par <span class="code-inline">[ligne] * n</span>.</li>
      <li><span class="step">Copier si besoin.</span> Si la spécification promet de ne pas modifier l'argument, travailler sur <span class="code-inline">t.copy()</span> (copie superficielle : les listes intérieures restent partagées).</li>
      <li><span class="step">Choisir</span> : modifier en place sans rien renvoyer, ou renvoyer un nouvel objet ; ne pas mélanger les deux (§1).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec <span class="code-inline">def ajoute_zero(t): t.append(0); return t</span>, l'instruction <span class="code-inline">u = ajoute_zero(v)</span> modifie <span class="code-inline">v</span>, et <span class="code-inline">u</span> et <span class="code-inline">v</span> désignent ensuite la même liste : toute modification de l'une se voit dans l'autre.</p>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="anal-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Expressions, instructions et listes partagées</h3>
  <div class="statement">On considère le programme suivant.
    <pre class="codeblock"><span class="kw">def</span> f(t):
    t[0] = 10
    t = [7, 7]
    t[1] = 20
    <span class="kw">return</span> t

a = [1, 2, 3]
b = a
c = f(b)
print(a, b, c)</pre>
  </div>
  <div class="q"><strong>Q1.</strong> Classer en expressions et instructions : <span class="code-inline">x == 3</span>, <span class="code-inline">x = 3</span>, <span class="code-inline">len(t) - 1</span>, <span class="code-inline">t.append(4)</span>, <span class="code-inline">return t</span>, <span class="code-inline">f(b)</span>.</div>
  <div class="q"><strong>Q2.</strong> Qu'affiche le programme ? Justifier ligne par ligne.</div>
  <div class="q"><strong>Q3.</strong> Que vaut <span class="code-inline">m</span> après <span class="code-inline">m = [[0] * 2] * 2</span> puis <span class="code-inline">m[0][0] = 1</span> ? Comment construire une matrice 2 × 2 de zéros dont les lignes sont indépendantes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Expressions (elles ont une valeur) : <span class="code-inline">x == 3</span> (un booléen), <span class="code-inline">len(t) - 1</span> (un entier), <span class="code-inline">f(b)</span> (la valeur renvoyée), et aussi <span class="code-inline">t.append(4)</span>, expression de valeur <span class="code-inline">None</span> qu'on écrit seule pour son effet de bord. Instructions : <span class="code-inline">x = 3</span> (affectation) et <span class="code-inline">return t</span>.</p>
    <p><strong>Q2.</strong> <span class="code-inline">b = a</span> : <span class="code-inline">a</span> et <span class="code-inline">b</span> désignent la même liste. Dans <span class="code-inline">f(b)</span>, le paramètre <span class="code-inline">t</span> la désigne aussi : <span class="code-inline">t[0] = 10</span> la modifie, elle devient <span class="code-inline">[10, 2, 3]</span>. Ensuite <span class="code-inline">t = [7, 7]</span> donne au nom local <span class="code-inline">t</span> une nouvelle liste ; <span class="code-inline">t[1] = 20</span> ne modifie que celle-ci, qui est renvoyée. Affichage : <span class="code-inline">[10, 2, 3] [10, 2, 3] [7, 20]</span>.</p>
    <p><strong>Q3.</strong> <span class="code-inline">[[0] * 2] * 2</span> répète deux fois <em>la même</em> ligne : modifier l'une modifie « l'autre ». Une compréhension construit une nouvelle ligne à chaque tour :</p>
    <pre class="codeblock">&gt;&gt;&gt; m = [[0] * 2] * 2
&gt;&gt;&gt; m[0][0] = 1
&gt;&gt;&gt; m
[[1, 0], [1, 0]]
&gt;&gt;&gt; p = [[0] * 2 <span class="kw">for</span> i <span class="kw">in</span> range(2)]
&gt;&gt;&gt; p[0][0] = 1
&gt;&gt;&gt; p
[[1, 0], [0, 0]]</pre>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Spécifier, écrire et tester une fonction</h3>
  <div class="statement">On veut une fonction <span class="code-inline">est_trie</span> qui indique si une liste de nombres est triée dans l'ordre croissant (au sens large).</div>
  <div class="q"><strong>Q1.</strong> Donner sa signature et sa spécification. Y a-t-il une précondition ?</div>
  <div class="q"><strong>Q2.</strong> L'écrire, avec un commentaire d'invariant.</div>
  <div class="q"><strong>Q3.</strong> Écrire un jeu de tests d'au moins six cas, en justifiant le choix des cas.</div>
  <div class="q"><strong>Q4.</strong> Donner la complexité dans le pire et dans le meilleur cas.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> <span class="code-inline">est_trie(t: list) -&gt; bool</span> : renvoie <span class="code-inline">True</span> si et seulement si <span class="code-inline">t[i] &lt;= t[i+1]</span> pour tout indice <span class="code-inline">i</span> de 0 à <span class="code-inline">len(t) - 2</span> ; <span class="code-inline">t</span> n'est pas modifiée. Pas de précondition sur la longueur : une liste vide ou à un élément est triée.</p>
    <p><strong>Q2 et Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> est_trie(t: list) -&gt; bool:
    <span class="str">"""Indique si t est triée (ordre croissant au sens large)."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t) - 1):
        <span class="cmt"># invariant : t[0:i+1] est triée</span>
        <span class="kw">if</span> t[i] &gt; t[i + 1]:
            <span class="kw">return</span> <span class="kw">False</span>
    <span class="kw">return</span> <span class="kw">True</span>

<span class="kw">def</span> test_est_trie():
    <span class="kw">assert</span> est_trie([])                  <span class="cmt"># liste vide : triée</span>
    <span class="kw">assert</span> est_trie([7])                 <span class="cmt"># un seul élément</span>
    <span class="kw">assert</span> est_trie([1, 3, 3, 8])        <span class="cmt"># égalités permises</span>
    <span class="kw">assert</span> <span class="kw">not</span> est_trie([2, 1, 5, 6])    <span class="cmt"># défaut au début</span>
    <span class="kw">assert</span> <span class="kw">not</span> est_trie([1, 2, 6, 5])    <span class="cmt"># défaut à la fin</span>
    <span class="kw">assert</span> <span class="kw">not</span> est_trie([5, 4, 3])       <span class="cmt"># décroissante</span>

test_est_trie()</pre>
    <p>Les cas couvrent : les limites de longueur (0 et 1 élément, la boucle fait 0 tour), une liste triée avec des égalités (pour vérifier qu'on a bien écrit <span class="code-inline">&gt;</span> et non <span class="code-inline">&gt;=</span>), un défaut au début et un défaut à la fin (premier et dernier tour de la boucle), une liste décroissante.</p>
    <p><strong>Q4.</strong> Pire cas : la liste est triée, la boucle fait \(n - 1\) tours en \(O(1)\) : \(O(n)\). Meilleur cas : <span class="code-inline">t[0] &gt; t[1]</span>, un seul tour : \(O(1)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Variant ou boucle infinie ?</h3>
  <div class="statement">Pour chacune des quatre fonctions suivantes, dire si elle termine pour toutes les entrées indiquées. Si oui, donner un variant (ou un autre argument) ; sinon, donner une entrée pour laquelle elle ne termine pas.
    <p>(a) pour \(a, b\) entiers au moins égaux à 1 :</p>
    <pre class="codeblock"><span class="kw">def</span> pgcd_sous(a: int, b: int) -&gt; int:
    <span class="str">"""a, b entiers &gt;= 1."""</span>
    <span class="kw">while</span> a != b:
        <span class="kw">if</span> a &gt; b:
            a = a - b
        <span class="kw">else</span>:
            b = b - a
    <span class="kw">return</span> a</pre>
    <p>(b) pour \(n\) entier quelconque :</p>
    <pre class="codeblock"><span class="kw">def</span> boucle_b(n):
    i = 0
    <span class="kw">while</span> i != n:
        i = i + 2
    <span class="kw">return</span> i</pre>
    <p>(c) pour \(n\) entier positif ou nul :</p>
    <pre class="codeblock"><span class="kw">def</span> boucle_c(n):
    i, j = n, n
    tours = 0
    <span class="kw">while</span> i &gt; 0:
        <span class="kw">if</span> j &gt; 0:
            j = j - 1
        <span class="kw">else</span>:
            i, j = i - 1, n
        tours = tours + 1
    <span class="kw">return</span> tours</pre>
    <p>(d) pour <span class="code-inline">t</span> liste de nombres :</p>
    <pre class="codeblock"><span class="kw">def</span> boucle_d(t):
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &lt; 0:
            t.append(-x)
    <span class="kw">return</span> t</pre>
  </div>
  <div class="q"><strong>Q1.</strong> Étudier (a) et (b).</div>
  <div class="q"><strong>Q2.</strong> Étudier (c) et donner le nombre exact de tours.</div>
  <div class="q"><strong>Q3.</strong> Étudier (d) et donner le résultat pour <span class="code-inline">[3, -1, 4, -5]</span>.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) Variant \(a + b\). Il est entier ; \(a\) et \(b\) restent au moins égaux à 1, car on ne retranche que le plus petit au plus grand quand ils sont différents (si \(a \gt b\), \(a - b \ge 1\)) ; et à chaque tour l'un des deux diminue d'au moins 1. La fonction termine (et renvoie le pgcd : par exemple \((21, 15) \to (6, 15) \to (6, 9) \to (6, 3) \to (3, 3)\), résultat 3).</p>
    <p>(b) \(i\) prend les valeurs 0, 2, 4, … Si \(n\) est pair et positif ou nul, \(n - i\) est un variant (pair, positif ou nul, diminue de 2) : la boucle termine. Si \(n\) est impair (ou négatif), \(i\) ne vaut jamais \(n\) : boucle infinie, par exemple pour \(n = 3\). Écrire <span class="code-inline">while i &lt; n:</span> règle le problème.</p>
    <p><strong>Q2.</strong> (c) Variant \(v = i\,(n+1) + j\), entier positif ou nul (\(0 \le j \le n\) et \(i \ge 0\)). Un tour avec \(j \gt 0\) diminue \(j\) de 1, donc \(v\) de 1 ; un tour avec \(j = 0\) donne</p>
    <div class="formula">$$v' = (i - 1)(n + 1) + n = i\,(n+1) - 1 = v - 1.$$</div>
    <p>La boucle termine. Au départ \(v = n(n+1) + n\) ; à la sortie \(i = 0\) et \(j = n\) (le dernier tour vient de remettre \(j\) à \(n\)), donc \(v = n\) : il y a exactement \(n(n+1) + n - n = n(n+1)\) tours. (Pour \(n = 0\), aucun tour.)</p>
    <p><strong>Q3.</strong> (d) La boucle <span class="code-inline">for</span> parcourt aussi les éléments ajoutés. Mais un élément ajouté vaut \(-x \gt 0\) : il n'en ajoute aucun autre. Il y a donc au plus un ajout par élément négatif de départ, et la boucle fait \(n + (\text{nombre de négatifs}) \le 2n\) tours : elle termine. Résultat : <span class="code-inline">[3, -1, 4, -5, 1, 5]</span>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Prouver l'algorithme de Horner</h3>
  <div class="statement">Un polynôme \(P(x) = p_0 + p_1 x + \dots + p_n x^n\) est représenté par la liste <span class="code-inline">p = [p0, p1, …, pn]</span>, avec \(n\) = <span class="code-inline">len(p) - 1</span>.
    <pre class="codeblock"><span class="kw">def</span> horner(p: list, x: float) -&gt; float:
    <span class="str">"""p non vide, n = len(p) - 1 ;</span>
<span class="str">    renvoie p[0] + p[1]*x + … + p[n]*x**n."""</span>
    k = len(p) - 1
    s = p[k]
    <span class="kw">while</span> k &gt; 0:
        k = k - 1
        s = s * x + p[k]
    <span class="kw">return</span> s</pre>
  </div>
  <div class="q"><strong>Q1.</strong> Dérouler <span class="code-inline">horner([5, -3, 0, 2], 2)</span> (valeurs de <span class="code-inline">k</span> et <span class="code-inline">s</span> à chaque test).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(s = \sum_{j=k}^{n} p_j\, x^{j-k}\) est un invariant (vrai à chaque test de la condition). En déduire la correction.</div>
  <div class="q"><strong>Q3.</strong> Justifier la terminaison. Combien de multiplications sont faites ? Comparer avec le calcul direct de \(\sum p_j x^j\) où chaque \(x^j\) est obtenu par \(j - 1\) multiplications.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Au départ \(k = 3\), \(s = 2\) ; puis \(k = 2\), \(s = 2\times2 + 0 = 4\) ; \(k = 1\), \(s = 4\times2 - 3 = 5\) ; \(k = 0\), \(s = 5\times2 + 5 = 15\) ; arrêt. Et en effet \(P(2) = 5 - 6 + 16 = 15\).</p>
    <p><strong>Q2.</strong> <em>Initialisation</em> : \(k = n\) et \(s = p_n = \sum_{j=n}^{n} p_j x^{j-n}\). <em>Conservation</em> : si l'invariant est vrai et \(k \gt 0\), les nouvelles valeurs sont \(k' = k - 1\) et</p>
    <div class="formula">$$s' = s\,x + p_{k-1} = \sum_{j=k}^{n} p_j\, x^{j-k+1} + p_{k-1} = \sum_{j=k-1}^{n} p_j\, x^{j-k'}$$</div>
    <p>donc l'invariant est vrai pour \(k'\). <em>Sortie</em> : \(k = 0\) (la condition est fausse et \(k\) ne descend jamais sous 0), et \(s = \sum_{j=0}^{n} p_j x^j = P(x)\).</p>
    <p><strong>Q3.</strong> \(k\) est un variant : entier, positif ou nul, diminue de 1. La boucle fait \(n\) tours, chacun avec une multiplication et une addition : \(n\) multiplications, soit \(O(n)\). Le calcul direct demande \(\sum_{j=2}^{n} (j - 1) = \dfrac{n(n-1)}{2}\) multiplications pour les puissances, plus \(n\) pour les produits par les coefficients : \(O(n^2)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Multiplier en doublant et en divisant</h3>
  <div class="statement">La fonction suivante calcule un produit d'entiers en n'utilisant que des doublements, des divisions par 2 et des additions (méthode dite « du paysan russe »). On note \(a_0\) et \(b_0\) les valeurs initiales des paramètres.
    <pre class="codeblock"><span class="kw">def</span> produit(a: int, b: int) -&gt; int:
    <span class="str">"""a, b entiers &gt;= 0 ; renvoie a * b."""</span>
    p = 0
    <span class="kw">while</span> b &gt; 0:
        <span class="kw">if</span> b % 2 == 1:
            p = p + a
        a = 2 * a
        b = b // 2
    <span class="kw">return</span> p</pre>
  </div>
  <div class="q"><strong>Q1.</strong> Dérouler <span class="code-inline">produit(13, 11)</span> dans un tableau (\(p\), \(a\), \(b\) à chaque test).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(p + a\,b = a_0 b_0\) est un invariant.</div>
  <div class="q"><strong>Q3.</strong> Prouver la terminaison et conclure à la correction totale.</div>
  <div class="q"><strong>Q4.</strong> Combien de tours fait la boucle ? En déduire la complexité en fonction de \(b_0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \((p, a, b)\) vaut successivement \((0, 13, 11)\), \((13, 26, 5)\), \((39, 52, 2)\), \((39, 104, 1)\), \((143, 208, 0)\) : résultat 143 = 13 × 11. À chaque ligne, \(p + ab = 143\).</p>
    <p><strong>Q2.</strong> Initialisation : \(p = 0\), donc \(p + ab = a_0 b_0\). Conservation, si \(b \gt 0\) : si \(b\) est pair, \(p' = p\), \(a' = 2a\), \(b' = b/2\) et \(p' + a'b' = p + ab\) ; si \(b\) est impair, \(p' = p + a\), \(a' = 2a\), \(b' = (b - 1)/2\) et \(p' + a'b' = p + a + a(b - 1) = p + ab\).</p>
    <p><strong>Q3.</strong> \(b\) est un variant : entier positif ou nul, et \(b /\!/ 2 \lt b\) dès que \(b \ge 1\). À la sortie, \(b = 0\) et l'invariant donne \(p = a_0 b_0\) : correction totale.</p>
    <p><strong>Q4.</strong> \(b\) est divisé par 2 à chaque tour jusqu'à valoir 0 : \(\lfloor \log_2 b_0 \rfloor + 1\) tours (le nombre de chiffres binaires de \(b_0\) ; 4 pour \(b_0 = 11 = 1011_2\)). Chaque tour fait un nombre borné d'opérations : complexité \(O(\log b_0)\), si l'on compte les opérations sur les entiers comme élémentaires.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Complexités de fragments de code</h3>
  <div class="statement">Donner, en fonction de \(n\) (et de \(m\) pour (d)), le nombre de tours effectués puis la complexité de chaque fragment.
    <pre class="codeblock"><span class="kw">def</span> bloc_a(n):
    c = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i):
            c = c + 1
    <span class="kw">return</span> c

<span class="kw">def</span> bloc_b(n):
    c, i = 0, 1
    <span class="kw">while</span> i &lt; n:
        i = 2 * i
        c = c + 1
    <span class="kw">return</span> c

<span class="kw">def</span> bloc_c(n):
    c = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        j = n
        <span class="kw">while</span> j &gt; 1:
            j = j // 2
            c = c + 1
    <span class="kw">return</span> c

<span class="kw">def</span> bloc_e(n):
    t = []
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        t = t + [k]          <span class="cmt"># concaténation : copie de t</span>
    <span class="kw">return</span> t</pre>
    <p>(d) Pour <span class="code-inline">t</span> de longueur \(n\) et <span class="code-inline">u</span> de longueur \(m\) : <span class="code-inline">for i in range(n):</span> puis <span class="code-inline">if t[i] in u: c = c + 1</span>.</p>
  </div>
  <div class="q"><strong>Q1.</strong> Traiter <span class="code-inline">bloc_a</span>, <span class="code-inline">bloc_b</span> et <span class="code-inline">bloc_c</span>.</div>
  <div class="q"><strong>Q2.</strong> Traiter (d). Comment faire mieux ?</div>
  <div class="q"><strong>Q3.</strong> Traiter <span class="code-inline">bloc_e</span>. Que change l'écriture <span class="code-inline">t.append(k)</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> <span class="code-inline">bloc_a</span> : \(\sum_{i=0}^{n-1} i = \dfrac{n(n-1)}{2}\) tours de la boucle intérieure : \(O(n^2)\). <span class="code-inline">bloc_b</span> : après \(k\) tours, \(i = 2^k\) ; la boucle s'arrête dès que \(2^k \ge n\), soit \(\lceil \log_2 n \rceil\) tours : \(O(\log n)\). <span class="code-inline">bloc_c</span> : pour chaque \(i\), la boucle intérieure fait \(\lfloor \log_2 n \rfloor\) tours ; en tout \(n \lfloor \log_2 n \rfloor\) : \(O(n \log n)\).</p>
    <p><strong>Q2.</strong> Chaque test <span class="code-inline">t[i] in u</span> parcourt <span class="code-inline">u</span> : jusqu'à \(m\) comparaisons, et le pire cas (aucun élément commun) donne \(O(nm)\). En rangeant d'abord les éléments de <span class="code-inline">u</span> comme clés d'un dictionnaire (\(O(m)\)), chaque test coûte \(O(1)\) en moyenne : \(O(n + m)\).</p>
    <p><strong>Q3.</strong> <span class="code-inline">t + [k]</span> fabrique une nouvelle liste en copiant les \(k\) éléments de <span class="code-inline">t</span> : coût total \(\sum_{k=0}^{n-1} (k + 1) = \dfrac{n(n+1)}{2}\), soit \(O(n^2)\) pour construire une liste de \(n\) éléments. Avec <span class="code-inline">t.append(k)</span> (coût constant, la liste est modifiée en place), on passe à \(O(n)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Démasquer une erreur par un jeu de tests</h3>
  <div class="statement">Une élève a écrit une fonction censée renvoyer la valeur du milieu de trois nombres (la médiane).

    <span class="str">"""Valeur du milieu parmi a, b et c (version à tester)."""</span>
    <span class="kw">if</span> a &lt;= b <span class="kw">and</span> b &lt;= c:

    <span class="kw">if</span> b &lt;= a <span class="kw">and</span> a &lt;= c:

    <span class="kw">return</span> c</pre>

  <div class="q"><strong>Q1.</strong> Proposer une partition des entrées en classes, d'après l'ordre relatif de \(a\), \(b\) et \(c\).</div>

    <h4>Correction</h4>

    <p><strong>Q2.</strong> Avec les valeurs 1, 2, 3 dans les six ordres, la réponse attendue est toujours 2 ; on ajoute <span class="code-inline">(2, 2, 1)</span>, <span class="code-inline">(1, 2, 2)</span>, <span class="code-inline">(2, 1, 1)</span>, <span class="code-inline">(5, 5, 5)</span>, de médianes 2, 2, 1 et 5. Échouent : <span class="code-inline">mediane3(2, 3, 1)</span> et <span class="code-inline">mediane3(3, 2, 1)</span>, qui renvoient 1, et <span class="code-inline">mediane3(2, 2, 1)</span>, qui renvoie 1 au lieu de 2. Les quatre autres ordres passent : on vérifie (par exemple sur toutes les valeurs de 0 à 3) que la fonction se trompe exactement quand \(c\) est strictement plus petit que \(a\) et que \(b\), cas que ses deux tests ignorent.</p>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Temps et mémoire : sommes récursives et sommes partielles</h3>
  <div class="statement">On reprend les fonctions <span class="code-inline">somme_rec</span> et <span class="code-inline">somme_rec2</span> du cours (§8), pour une liste de longueur \(n\).
    <pre class="codeblock"><span class="kw">def</span> somme_rec(t: list) -&gt; float:
    <span class="str">"""Somme des éléments de t (version coûteuse)."""</span>
    <span class="kw">if</span> len(t) == 0:
        <span class="kw">return</span> 0
    <span class="kw">return</span> t[0] + somme_rec(t[1:])  <span class="cmt"># t[1:] : copie de n-1 cases</span></pre>
    <pre class="codeblock"><span class="kw">def</span> somme_rec2(t: list, i: int) -&gt; float:
    <span class="str">"""Somme de t[i:], sans copie (appel : somme_rec2(t, 0))."""</span>
    <span class="kw">if</span> i == len(t):
        <span class="kw">return</span> 0
    <span class="kw">return</span> t[i] + somme_rec2(t, i + 1)</pre>
  </div>
  <div class="q"><strong>Q1.</strong> Combien d'éléments sont copiés au total par <span class="code-inline">somme_rec</span> ? En déduire sa complexité en temps, puis en espace.</div>
  <div class="q"><strong>Q2.</strong> Mêmes questions pour <span class="code-inline">somme_rec2</span>. Que se passe-t-il pour \(n = 10^5\) ? Proposer une version qui utilise un espace \(O(1)\).</div>
  <div class="q"><strong>Q3.</strong> On doit répondre à \(q\) questions « somme de <span class="code-inline">t[a:b]</span> ? ». Comparer, pour \(n = q = 10^5\) et \(10^7\) opérations par seconde, le calcul direct de chaque somme et l'utilisation des sommes partielles (<span class="code-inline">sommes_prefixes</span>, §8).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'appel sur une liste de longueur \(k \ge 1\) copie \(k - 1\) éléments ; au total \((n - 1) + (n - 2) + \dots + 0 = \dfrac{n(n-1)}{2}\) : temps \(O(n^2)\). Quand le cas de base est atteint, \(n + 1\) appels sont en attente et chacun garde sa tranche : \((n - 1) + (n - 2) + \dots + 0 = \dfrac{n(n-1)}{2}\) cases en plus de la liste de départ, espace \(O(n^2)\).</p>
    <p><strong>Q2.</strong> Aucune copie : \(n + 1\) appels en \(O(1)\), temps \(O(n)\) ; la pile contient jusqu'à \(n + 1\) appels, espace \(O(n)\). Pour \(n = 10^5\), la profondeur dépasse la limite de Python (environ 1 000 appels) : le programme s'arrête sur une <span class="code-inline">RecursionError</span>. Une boucle n'a pas ce défaut :</p>
    <pre class="codeblock"><span class="kw">def</span> somme_iter(t: list) -&gt; float:
    <span class="str">"""Somme des éléments de t ; temps O(n), espace O(1)."""</span>
    s = 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        s = s + x
    <span class="kw">return</span> s</pre>
    <p><strong>Q3.</strong> Calcul direct : jusqu'à \(n\) additions par question, soit \(qn = 10^{10}\) opérations, environ 1 000 s (17 minutes). Sommes partielles : \(n\) opérations pour construire <span class="code-inline">s</span>, puis une soustraction par question, environ \(2\times10^5\) opérations, soit 0,02 s, au prix de \(n + 1\) cases de mémoire.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Étude complète : le plus long palier</h3>
  <div class="statement">Un <strong>palier</strong> d'une liste est un bloc d'éléments consécutifs égaux. Dans <span class="code-inline">[5, 5, 5, 1, 5]</span>, le plus long palier a pour longueur 3. On veut calculer en un seul parcours la longueur du plus long palier.</div>
  <div class="q"><strong>Q1.</strong> Écrire la signature et la spécification de <span class="code-inline">plus_long_palier(t)</span> (convention : 0 pour une liste vide).</div>
  <div class="q"><strong>Q2.</strong> Écrire la fonction, avec deux variables <span class="code-inline">courant</span> et <span class="code-inline">meilleur</span> dont on donnera le rôle sous forme d'invariant.</div>
  <div class="q"><strong>Q3.</strong> Prouver l'invariant et conclure.</div>
  <div class="q"><strong>Q4.</strong> Proposer un jeu de tests. Quel cas une version qui ne mettrait <span class="code-inline">meilleur</span> à jour que lorsque le palier se termine (dans la branche <span class="code-inline">else</span>) oublierait-elle ?</div>
  <div class="q"><strong>Q5.</strong> Complexités en temps et en espace.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> <span class="code-inline">plus_long_palier(t: list) -&gt; int</span> ; pas de précondition ; renvoie le plus grand entier \(\ell\) tel qu'il existe \(i\) avec <span class="code-inline">t[i] == t[i+1] == … == t[i+ℓ-1]</span>, et 0 si <span class="code-inline">t</span> est vide ; <span class="code-inline">t</span> n'est pas modifiée.</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> plus_long_palier(t: list) -&gt; int:
    <span class="str">"""Longueur du plus long palier de t (0 si t est vide)."""</span>
    <span class="kw">if</span> len(t) == 0:
        <span class="kw">return</span> 0
    meilleur, courant = 1, 1
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(t)):
        <span class="cmt"># invariant : courant = longueur du palier qui finit</span>
        <span class="cmt">#             en t[i-1], meilleur = longueur du plus</span>
        <span class="cmt">#             long palier de t[0:i]</span>
        <span class="kw">if</span> t[i] == t[i - 1]:
            courant = courant + 1
        <span class="kw">else</span>:
            courant = 1
        <span class="kw">if</span> courant &gt; meilleur:
            meilleur = courant
    <span class="kw">return</span> meilleur</pre>
    <p><strong>Q3.</strong> Au début du tour \(i\) : <span class="code-inline">courant</span> est la longueur du palier qui finit en \(t[i-1]\), <span class="code-inline">meilleur</span> le plus long palier de <span class="code-inline">t[0:i]</span>. Initialisation (\(i = 1\)) : <span class="code-inline">t[0:1]</span> a un seul palier, de longueur 1. Conservation : si \(t[i] = t[i-1]\), le palier qui finit en \(t[i]\) prolonge celui qui finit en \(t[i-1]\) (longueur <span class="code-inline">courant + 1</span>) ; sinon il commence en \(t[i]\) (longueur 1). Un palier de <span class="code-inline">t[0:i+1]</span> finit avant \(i\) (longueur au plus <span class="code-inline">meilleur</span>) ou en \(i\) (longueur <span class="code-inline">courant</span>) : la mise à jour donne bien le maximum. Sortie : \(i = n\), <span class="code-inline">meilleur</span> est le plus long palier de <span class="code-inline">t</span>. La boucle <span class="code-inline">for</span> termine : correction totale.</p>
    <pre class="codeblock"><span class="kw">def</span> test_palier():
    <span class="kw">assert</span> plus_long_palier([]) == 0
    <span class="kw">assert</span> plus_long_palier([4]) == 1
    <span class="kw">assert</span> plus_long_palier([1, 2, 3]) == 1
    <span class="kw">assert</span> plus_long_palier([6, 6, 6]) == 3
    <span class="kw">assert</span> plus_long_palier([5, 5, 5, 1, 5]) == 3    <span class="cmt"># au début</span>
    <span class="kw">assert</span> plus_long_palier([1, 2, 2, 3]) == 2       <span class="cmt"># au milieu</span>
    <span class="kw">assert</span> plus_long_palier([2, 2, 1, 1, 1]) == 3    <span class="cmt"># à la fin</span>

test_palier()</pre>
    <p><strong>Q4.</strong> Les tests couvrent : liste vide, un élément, aucun palier de longueur 2, une liste constante, le plus long palier au début, au milieu, à la fin. La version proposée oublierait le palier <strong>qui finit la liste</strong> (aucun <span class="code-inline">else</span> n'est exécuté après lui) : <span class="code-inline">[2, 2, 1, 1, 1]</span> donnerait 2, et <span class="code-inline">[6, 6, 6]</span> donnerait 1.</p>
    <p><strong>Q5.</strong> \(n - 1\) tours en \(O(1)\) : temps \(O(n)\). Trois variables entières : espace \(O(1)\).</p>
  </div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Analyse d'un relevé d'altitudes</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique des concours (thème : spécification, preuve et complexité d'un traitement de données).</div>
  <div class="statement">Une montre de randonnée relève l'altitude (en mètres, nombre entier) à intervalles réguliers. Un relevé est une liste non vide <span class="code-inline">alt</span> de \(n\) entiers. Pour \(0 \le i \le j \le n - 1\), la <strong>montée</strong> du tronçon de \(i\) à \(j\) est <span class="code-inline">alt[j] - alt[i]</span> (elle peut être négative). La <strong>montée maximale</strong> du relevé est le maximum de ces montées ; elle est positive ou nulle (prendre \(i = j\)). Exemple : <span class="code-inline">alt = [300, 340, 310, 420, 380, 260, 330]</span>. Les fonctions sont à écrire en Python, sans utiliser <span class="code-inline">max</span> ni <span class="code-inline">min</span>.</div>
  <p class="exo-part">Partie A — Spécification et tests</p>
  <div class="q"><strong>A1.</strong> Donner la signature et la spécification d'une fonction <span class="code-inline">montee_max</span> qui renvoie la montée maximale d'un relevé.</div>
  <div class="q"><strong>A2.</strong> Que vaut la montée maximale de l'exemple ? Proposer un jeu de tests de cinq cas au moins, en indiquant la classe d'entrées que chacun représente.</div>
  <p class="exo-part">Partie B — Un premier algorithme</p>
  <div class="q"><strong>B1.</strong> Écrire <span class="code-inline">montee_max_naif(alt)</span>, qui examine tous les tronçons.</div>
  <div class="q"><strong>B2.</strong> Combien de différences calcule-t-elle exactement ? En déduire sa complexité.</div>
  <div class="q"><strong>B3.</strong> La montre enregistre une altitude par seconde pendant une randonnée de 10 h. Estimer la durée du calcul à raison de \(10^7\) opérations par seconde.</div>
  <p class="exo-part">Partie C — Un algorithme en un seul parcours</p>
  <div class="q"><strong>C1.</strong> On propose la fonction ci-dessous. Démontrer l'invariant annoncé en commentaire (au début du tour d'indice \(j\)), et en déduire la correction.
    <pre class="codeblock"><span class="kw">def</span> montee_max(alt: list) -&gt; int:
    mini = alt[0]
    meilleur = 0
    <span class="kw">for</span> j <span class="kw">in</span> range(1, len(alt)):
        <span class="cmt"># invariant : mini = min de alt[0:j],</span>
        <span class="cmt">#             meilleur = montée maximale dans alt[0:j]</span>
        <span class="kw">if</span> alt[j] - mini &gt; meilleur:
            meilleur = alt[j] - mini
        <span class="kw">if</span> alt[j] &lt; mini:
            mini = alt[j]
    <span class="kw">return</span> meilleur</pre>
  </div>
  <div class="q"><strong>C2.</strong> Justifier la terminaison ; donner les complexités en temps et en espace.</div>
  <div class="q"><strong>C3.</strong> Dérouler la fonction sur l'exemple.</div>
  <div class="q"><strong>C4.</strong> Modifier la fonction pour qu'elle renvoie aussi un tronçon \((i, j)\) qui réalise la montée maximale.</div>
  <p class="exo-part">Partie D — Dénivelé positif</p>
  <div class="q"><strong>D1.</strong> Le dénivelé positif d'un relevé est la somme des montées entre points consécutifs (on ne compte que les différences positives). Écrire <span class="code-inline">denivele_positif(alt)</span> et donner sa valeur sur l'exemple.</div>
  <div class="q"><strong>D2.</strong> Montrer que la montée maximale est toujours inférieure ou égale au dénivelé positif.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> <span class="code-inline">montee_max(alt: list) -&gt; int</span>. Précondition : <span class="code-inline">alt</span> est une liste non vide d'entiers. Postcondition : renvoie le maximum de <span class="code-inline">alt[j] - alt[i]</span> pour \(0 \le i \le j \le n - 1\) ; <span class="code-inline">alt</span> n'est pas modifiée.</p>
    <p><strong>A2.</strong> 120 (de 300 à 420, tronçon \((0, 3)\)). Tests : un seul point <span class="code-inline">[700]</span> → 0 (limite) ; relevé croissant <span class="code-inline">[200, 250, 300]</span> → 100 (du premier au dernier point) ; relevé décroissant <span class="code-inline">[500, 480, 450]</span> → 0 ; relevé constant <span class="code-inline">[400, 400, 400]</span> → 0 ; minimum global <em>après</em> le maximum global, <span class="code-inline">[600, 650, 200, 280]</span> → 80 (piège : la différence « maximum moins minimum » vaudrait 450) ; l'exemple → 120.</p>
    <p><strong>B1.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> montee_max_naif(alt: list) -&gt; int:
    n = len(alt)
    meilleur = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i, n):
            <span class="kw">if</span> alt[j] - alt[i] &gt; meilleur:
                meilleur = alt[j] - alt[i]
    <span class="kw">return</span> meilleur</pre>
    <p><strong>B2.</strong> Pour chaque \(i\), \(n - i\) valeurs de \(j\) : \(\sum_{i=0}^{n-1} (n - i) = \dfrac{n(n+1)}{2}\) différences, d'où \(O(n^2)\).</p>
    <p><strong>B3.</strong> \(n = 36\,000\) points ; \(\dfrac{n(n+1)}{2} \approx 6{,}5\times10^{8}\) opérations, soit environ 65 s : c'est long pour un calcul affiché sur une montre.</p>
    <p><strong>C1.</strong> Invariant au début du tour \(j\) : <span class="code-inline">mini</span> \(= \min\) <span class="code-inline">alt[0:j]</span> et <span class="code-inline">meilleur</span> est la montée maximale de <span class="code-inline">alt[0:j]</span>. <em>Initialisation</em> (\(j = 1\)) : <span class="code-inline">mini = alt[0]</span> et la seule montée de <span class="code-inline">alt[0:1]</span> est 0. <em>Conservation</em> : les tronçons de <span class="code-inline">alt[0:j+1]</span> sont ceux de <span class="code-inline">alt[0:j]</span> et ceux qui finissent en \(j\). Parmi ces derniers, la plus grande montée est <span class="code-inline">alt[j] - mini</span> (on retranche la plus petite altitude précédente), ou 0 pour \(i = j\), déjà inférieur ou égal à <span class="code-inline">meilleur</span>. Le premier <span class="code-inline">if</span> donne donc la montée maximale de <span class="code-inline">alt[0:j+1]</span>, et le second met <span class="code-inline">mini</span> à jour en \(\min\) <span class="code-inline">alt[0:j+1]</span>. <em>Sortie</em> : après le dernier tour (\(j = n\)), <span class="code-inline">meilleur</span> est la montée maximale de tout le relevé.</p>
    <p><strong>C2.</strong> Boucle <span class="code-inline">for</span> de \(n - 1\) tours : elle termine. Chaque tour coûte \(O(1)\) : temps \(O(n)\) (36 000 tours, quelques millisecondes pour la question B3). Deux variables : espace \(O(1)\).</p>
    <p><strong>C3.</strong></p>
    <div><table>
<tr><th><span class="code-inline">j</span></th><th><span class="code-inline">alt[j]</span></th><th><span class="code-inline">mini</span> après le tour</th><th><span class="code-inline">meilleur</span> après le tour</th></tr>
<tr><td>1</td><td>340</td><td>300</td><td>40</td></tr>
<tr><td>2</td><td>310</td><td>300</td><td>40</td></tr>
<tr><td>3</td><td>420</td><td>300</td><td>120</td></tr>
<tr><td>4</td><td>380</td><td>300</td><td>120</td></tr>
<tr><td>5</td><td>260</td><td>260</td><td>120</td></tr>
<tr><td>6</td><td>330</td><td>260</td><td>120</td></tr>
</table></div>
    <p>Le résultat est 120.</p>
    <p><strong>C4.</strong> On mémorise l'indice du minimum plutôt que sa valeur, et le tronçon réalisant le meilleur :</p>
    <pre class="codeblock"><span class="kw">def</span> montee_max_indices(alt: list) -&gt; tuple:
    <span class="str">"""Renvoie (meilleur, i, j) avec i &lt;= j et</span>
<span class="str">    alt[j] - alt[i] == meilleur."""</span>
    i_mini = 0
    meilleur, i_best, j_best = 0, 0, 0
    <span class="kw">for</span> j <span class="kw">in</span> range(1, len(alt)):
        <span class="kw">if</span> alt[j] - alt[i_mini] &gt; meilleur:
            meilleur = alt[j] - alt[i_mini]
            i_best, j_best = i_mini, j
        <span class="kw">if</span> alt[j] &lt; alt[i_mini]:
            i_mini = j
    <span class="kw">return</span> meilleur, i_best, j_best</pre>
    <p>Sur l'exemple : <span class="code-inline">(120, 0, 3)</span>.</p>
    <p><strong>D1.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> denivele_positif(alt: list) -&gt; int:
    <span class="str">"""Somme des montées entre points consécutifs."""</span>
    d = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(len(alt) - 1):
        <span class="kw">if</span> alt[i + 1] &gt; alt[i]:
            d = d + alt[i + 1] - alt[i]
    <span class="kw">return</span> d</pre>
    <p>Sur l'exemple : \(40 + 110 + 70 = 220\) m.</p>
    <p><strong>D2.</strong> Pour \(i \le j\), <span class="code-inline">alt[j] - alt[i]</span> \(= \sum_{k=i}^{j-1} (\text{alt}[k+1] - \text{alt}[k])\) (somme télescopique). Chaque terme est inférieur ou égal à sa partie positive, et la somme des parties positives sur \([i, j]\) est au plus le dénivelé positif total \(D\). Donc toute montée est au plus \(D\), et la montée maximale aussi (120 ≤ 220 sur l'exemple).</p>
