  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Parties « Algèbre linéaire, C · a) Éléments propres d'un endomorphisme, d'une matrice carrée » et « b) Polynôme caractéristique » du programme de PT. Le chapitre s'appuie sur les sous-espaces stables (chapitre Applications linéaires) et sur le déterminant (chapitre Déterminants) ; il prépare directement le chapitre Réduction des endomorphismes (diagonalisation, trigonalisation), puis le théorème spectral (chapitres Isométries vectorielles et Réduction des coniques).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Droite stable</strong> par un endomorphisme ; <strong>valeur propre, vecteur propre</strong> (non nul), <strong>sous-espace propre</strong> d'un endomorphisme en dimension quelconque ; équation aux éléments propres \(f(x) = \lambda x\) (§1, exemples au §2).</li>
        <li><strong>Spectre</strong> d'un endomorphisme en dimension finie, notation \(\operatorname{Sp}(f)\) (§1).</li>
        <li>La somme d'une famille finie de sous-espaces propres est <strong>directe</strong> ; toute famille de vecteurs propres associés à des valeurs propres distinctes est <strong>libre</strong> (§3).</li>
        <li>Valeur propre, vecteur propre, sous-espace propre et spectre d'une <strong>matrice carrée</strong> ; équation \(AX = \lambda X\), notation \(\operatorname{Sp}(A)\) (§4).</li>
        <li><strong>Polynôme caractéristique</strong> : \(x \mapsto \det(xI_n - A)\) est polynomiale, unitaire, de degré \(n\) (démonstration non exigible pour \(n \geq 4\)) ; notations \(\chi_A\), \(\chi_f\) ; les valeurs propres sont ses racines ; deux matrices semblables ont le même polynôme caractéristique (§5).</li>
        <li><strong>Multiplicité</strong> d'une valeur propre ; majoration de la dimension d'un sous-espace propre par la multiplicité (§6).</li>
        <li>Méthodes de calcul en taille 2 et 3, contrôles par la trace et le déterminant (§7).</li>
      </ul>
      <p>Hors programme : tout développement sur les polynômes d'endomorphisme (polynômes annulateurs, polynôme minimal, théorème de Cayley-Hamilton), évoqués en fin de chapitre.</p>

<div class="course-section">
  <div class="sec-num">§1 · DROITES STABLES, VALEURS ET VECTEURS PROPRES</div>
  <h2>Les directions qu'un endomorphisme ne fait pas tourner</h2>
  <div class="intro">Un endomorphisme déforme l'espace ; certaines directions sont pourtant conservées : un vecteur de ces directions est seulement multiplié par un nombre. Repérer ces directions, c'est comprendre l'endomorphisme. Dans tout le chapitre, \(\mathbb{K} = \mathbb{R}\) ou \(\mathbb{C}\), \(E\) est un \(\mathbb{K}\)-espace vectoriel et \(f \in \mathcal{L}(E)\).</div>

  <div class="def-box">
    Soit \(x \in E\) non nul. La droite \(D = \operatorname{Vect}(x)\) est <strong>stable</strong> par \(f\) si \(f(D) \subset D\).
  </div>
  <div class="prop-box">
    <strong>Droite stable.</strong> Pour \(x \neq 0\), la droite \(\operatorname{Vect}(x)\) est stable par \(f\) si et seulement s'il existe \(\lambda \in \mathbb{K}\) tel que \(f(x) = \lambda x\). L'endomorphisme induit sur cette droite est alors l'homothétie de rapport \(\lambda\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une ligne dans chaque sens.</span>
    <div class="content"><p>Si \(\operatorname{Vect}(x)\) est stable, \(f(x)\) appartient à \(\operatorname{Vect}(x)\) : il s'écrit \(\lambda x\). Réciproquement, si \(f(x) = \lambda x\), tout vecteur \(\mu x\) de la droite a pour image \(\mu f(x) = \lambda(\mu x)\), qui est encore sur la droite.</p></div>
  </div>

  <div class="def-box">
    <ul>
      <li>Un scalaire \(\lambda \in \mathbb{K}\) est une <strong>valeur propre</strong> de \(f\) s'il existe un vecteur \(x \neq 0\) tel que \(f(x) = \lambda x\).</li>
      <li>Un tel vecteur \(x\), <strong>non nul</strong>, est un <strong>vecteur propre</strong> de \(f\) associé à \(\lambda\) ; la valeur propre associée à un vecteur propre est unique.</li>
      <li>Si \(\lambda\) est valeur propre, le <strong>sous-espace propre</strong> associé est \(E_\lambda(f) = \operatorname{Ker}(f - \lambda\,\mathrm{id}_E)\) : il est formé des vecteurs propres associés à \(\lambda\) et du vecteur nul.</li>
      <li>Si \(E\) est de dimension finie, l'ensemble des valeurs propres de \(f\) est le <strong>spectre</strong> de \(f\), noté \(\operatorname{Sp}(f)\).</li>
    </ul>
  </div>
  <div class="formula" data-nom="Équation aux éléments propres">$$\begin{aligned} &f(x) = \lambda x, \quad x \neq 0, \\ &E_\lambda(f) = \operatorname{Ker}(f - \lambda\,\mathrm{id}_E). \end{aligned}$$</div>

  <div class="prop-box">
    <strong>Premières propriétés.</strong>
    <ul>
      <li>\(\lambda\) est valeur propre de \(f\) si et seulement si \(f - \lambda\,\mathrm{id}_E\) n'est <strong>pas injectif</strong>. En particulier, \(0\) est valeur propre si et seulement si \(f\) n'est pas injectif, et alors \(E_0(f) = \operatorname{Ker} f\).</li>
      <li>Un sous-espace propre est un sous-espace vectoriel <strong>stable</strong> par \(f\), sur lequel \(f\) induit l'homothétie de rapport \(\lambda\).</li>
      <li>En dimension finie, \(\lambda \in \operatorname{Sp}(f)\) si et seulement si \(f - \lambda\,\mathrm{id}_E\) n'est pas bijectif, si et seulement si \(\det(f - \lambda\,\mathrm{id}_E) = 0\) (chapitre Déterminants, §8).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Valeur propre, injectivité et stabilité.</span>
    <div class="content"><p>\(f(x) = \lambda x\) équivaut à \((f - \lambda\,\mathrm{id}_E)(x) = 0\) : il existe un tel \(x\) non nul exactement quand le noyau de \(f - \lambda\,\mathrm{id}_E\) n'est pas réduit à \(\{0\}\). Ce noyau est un sous-espace vectoriel ; si \(x \in E_\lambda(f)\), alors \(f(x) = \lambda x \in E_\lambda(f)\) : il est stable. En dimension finie, un endomorphisme est injectif si et seulement s'il est bijectif, si et seulement si son déterminant est non nul. Enfin, si \(\lambda x = \mu x\) avec \(x \neq 0\), alors \((\lambda - \mu)x = 0\) impose \(\lambda = \mu\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — vérifier des vecteurs propres</strong>
    <p>Soit \(f\) l'endomorphisme de \(\mathbb{R}^2\) défini par \(f(x, y) = (x + y, 2x)\) (c'est celui de la figure).</p>
    <ol>
      <li>\(f(1, 1) = (2, 2) = 2(1, 1)\) : \(u = (1, 1)\) est vecteur propre associé à la valeur propre \(2\).</li>
      <li>\(f(-1, 2) = (1, -2) = -(-1, 2)\) : \(w = (-1, 2)\) est vecteur propre associé à \(-1\).</li>
      <li>\(f(1, 0) = (1, 2)\) n'est pas colinéaire à \((1, 0)\) : ce n'est pas un vecteur propre.</li>
      <li>Les sous-espaces propres sont les solutions de systèmes linéaires : \(f(x, y) = 2(x, y)\) équivaut à \(x = y\), donc \(E_2(f) = \operatorname{Vect}(u)\) ; de même \(E_{-1}(f) = \operatorname{Vect}(w)\). Le §5 montrera qu'il n'y a pas d'autre valeur propre : \(\operatorname{Sp}(f) = \{-1, 2\}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier qu'un vecteur propre est <strong>non nul</strong> (sinon tout scalaire serait valeur propre, puisque \(f(0) = \lambda\cdot 0\)). En revanche, une valeur propre peut très bien être nulle : \(0 \in \operatorname{Sp}(f)\) signifie seulement que \(f\) n'est pas injectif. Et \(E_\lambda(f)\) contient le vecteur nul, qui n'est pas un vecteur propre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · EXEMPLES EN DIMENSION QUELCONQUE</div>
  <h2>Équations différentielles, polynômes, suites</h2>
  <div class="intro">Les définitions du §1 ne supposent pas la dimension finie. Dans les espaces de fonctions, de polynômes ou de suites, chercher les éléments propres revient à résoudre une équation (différentielle, polynomiale, de récurrence) en discutant selon \(\lambda\). Le spectre peut alors être vide, fini ou infini.</div>

  <div class="method-box">
    <strong>Méthode — éléments propres d'un endomorphisme d'un espace de fonctions</strong>
    <ol>
      <li>Écrire l'équation \(f(x) = \lambda x\) avec l'inconnue \(x\) (une fonction, un polynôme, une suite) et le paramètre \(\lambda\).</li>
      <li>Résoudre cette équation en discutant selon les valeurs de \(\lambda\).</li>
      <li>Garder les \(\lambda\) pour lesquels il existe une solution <strong>non nulle</strong> : ce sont les valeurs propres ; l'ensemble des solutions est \(E_\lambda(f)\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — la dérivation sur \(\mathcal{C}^\infty(\mathbb{R}, \mathbb{R})\)</strong>
    <p>Soit \(D : y \mapsto y'\), endomorphisme de \(\mathcal{C}^\infty(\mathbb{R}, \mathbb{R})\).</p>
    <ol>
      <li>L'équation \(D(y) = \lambda y\) est l'équation différentielle \(y' = \lambda y\), dont les solutions sont les fonctions \(t \mapsto Ce^{\lambda t}\), \(C \in \mathbb{R}\) (première année).</li>
      <li>Pour tout réel \(\lambda\), il existe une solution non nulle : <strong>tout réel est valeur propre</strong> de \(D\).</li>
      <li>\(E_\lambda(D) = \operatorname{Vect}(t \mapsto e^{\lambda t})\) est une droite : les exponentielles sont les vecteurs propres de la dérivation (c'est pour cela qu'elles résolvent les équations différentielles linéaires à coefficients constants).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — la dérivation sur \(\mathbb{R}[X]\), et l'endomorphisme \(P \mapsto XP'\)</strong>
    <ol>
      <li>Sur \(\mathbb{R}[X]\), si \(\lambda \neq 0\) et \(P \neq 0\), le polynôme \(\lambda P\) est de degré \(\deg P\), alors que \(P'\) est nul ou de degré \(\deg P - 1\) : l'égalité \(P' = \lambda P\) est impossible. Pour \(\lambda = 0\), \(P' = 0\) donne les constantes. La seule valeur propre est \(0\), et \(E_0 = \mathbb{R}_0[X]\).</li>
      <li>Soit \(g(P) = XP'\) sur \(\mathbb{R}[X]\). Pour \(P = \sum_k a_kX^k\), on a \(g(P) = \sum_k k\,a_kX^k\), donc \(g(P) = \lambda P\) équivaut à \(a_k(k - \lambda) = 0\) pour tout \(k\).</li>
      <li>Si \(\lambda\) n'est pas un entier naturel, tous les \(a_k\) sont nuls. Si \(\lambda = m \in \mathbb{N}\), seul \(a_m\) peut être non nul : les valeurs propres de \(g\) sont les entiers naturels, et \(E_m(g) = \operatorname{Vect}(X^m)\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — un endomorphisme sans valeur propre</strong>
    <p>Soit \(\varphi\) l'endomorphisme de \(\mathcal{C}^0(\mathbb{R}, \mathbb{R})\) qui à \(h\) associe la fonction \(x \mapsto x\,h(x)\).</p>
    <ol>
      <li>Si \(\varphi(h) = \lambda h\), alors \((x - \lambda)h(x) = 0\) pour tout réel \(x\), donc \(h(x) = 0\) pour tout \(x \neq \lambda\).</li>
      <li>Par continuité en \(\lambda\), \(h(\lambda) = 0\) aussi : \(h\) est la fonction nulle.</li>
      <li>Aucun \(\lambda\) ne convient : \(\varphi\) n'a <strong>aucune valeur propre</strong>.</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Autres exemples à connaître.</strong>
    <ul>
      <li><strong>Décalage des suites</strong> : sur l'espace des suites réelles, \(S : (u_n) \mapsto (u_{n+1})\). L'équation \(S(u) = \lambda u\) s'écrit \(u_{n+1} = \lambda u_n\) : tout réel est valeur propre, et \(E_\lambda(S)\) est la droite des suites géométriques de raison \(\lambda\).</li>
      <li><strong>Projecteur</strong> \(p\) (\(p \circ p = p\)) : si \(p(x) = \lambda x\), alors \(\lambda^2 x = \lambda x\), donc \(\lambda \in \{0, 1\}\) ; \(E_1 = \operatorname{Im} p\) et \(E_0 = \operatorname{Ker} p\). <strong>Symétrie</strong> \(s\) (\(s \circ s = \mathrm{id}_E\)) : \(\lambda^2 = 1\), donc \(\lambda \in \{-1, 1\}\) (chapitre Projecteurs et symétries).</li>
      <li><strong>Rotation du plan</strong> d'angle \(\theta \notin \pi\mathbb{Z}\) : aucune droite n'est stable, donc aucune valeur propre réelle.</li>
    </ul>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : parler du « spectre » ou du polynôme caractéristique en dimension infinie. Le programme ne définit \(\operatorname{Sp}(f)\) qu'en dimension finie ; dans un espace de fonctions, on dit simplement « les valeurs propres de \(f\) », et l'on ne dispose ni de déterminant ni de polynôme caractéristique : on résout l'équation \(f(x) = \lambda x\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · INDÉPENDANCE DES VECTEURS PROPRES</div>
  <h2>Des valeurs propres distinctes donnent des directions indépendantes</h2>
  <div class="intro">Le résultat central de ce paragraphe dit que les sous-espaces propres ne se « chevauchent » jamais : ils sont en somme directe. C'est lui qui permettra, au chapitre suivant, de construire une base de vecteurs propres en recollant des bases des sous-espaces propres.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Toute famille finie de vecteurs propres de \(f\) associés à des valeurs propres <strong>deux à deux distinctes</strong> est libre.
    <br><strong>Corollaire.</strong> Si \(\lambda_1, \ldots, \lambda_p\) sont des valeurs propres deux à deux distinctes de \(f\), la somme \(E_{\lambda_1}(f) + \cdots + E_{\lambda_p}(f)\) est <strong>directe</strong>. En dimension finie \(n\), \(f\) a donc au plus \(n\) valeurs propres distinctes.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Récurrence sur le nombre de vecteurs, en appliquant \(f - \lambda_p\,\mathrm{id}_E\).</span>
    <div class="content"><p>Soit \(x_1, \ldots, x_p\) des vecteurs propres associés à \(\lambda_1, \ldots, \lambda_p\) deux à deux distinctes. Pour \(p = 1\), \((x_1)\) est libre car \(x_1 \neq 0\). Supposons le résultat vrai pour \(p - 1\) vecteurs et soit \(\alpha_1x_1 + \cdots + \alpha_px_p = 0\). Appliquons \(f - \lambda_p\,\mathrm{id}_E\), qui envoie \(x_k\) sur \((\lambda_k - \lambda_p)x_k\) :</p>
    <div class="formula">$$\sum_{k=1}^{p-1} \alpha_k(\lambda_k - \lambda_p)\,x_k = 0.$$</div>
    <p>Par hypothèse de récurrence, chaque \(\alpha_k(\lambda_k - \lambda_p)\) est nul, et comme \(\lambda_k \neq \lambda_p\), \(\alpha_k = 0\) pour \(k \leq p - 1\). Il reste \(\alpha_px_p = 0\), donc \(\alpha_p = 0\).</p>
    <p>Pour le corollaire, si \(y_1 + \cdots + y_p = 0\) avec \(y_k \in E_{\lambda_k}(f)\), les \(y_k\) non nuls seraient des vecteurs propres associés à des valeurs propres distinctes formant une famille liée : ils sont donc tous nuls. La décomposition du vecteur nul étant unique, la somme est directe. En dimension \(n\), une famille libre a au plus \(n\) vecteurs.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — liberté de familles de fonctions, sans calcul</strong>
    <ol>
      <li>Pour des réels \(a_1, \ldots, a_p\) deux à deux distincts, les fonctions \(t \mapsto e^{a_kt}\) sont des vecteurs propres de la dérivation \(D\) associés aux valeurs propres distinctes \(a_k\) (§2) : la famille \((t \mapsto e^{a_kt})_{1 \leq k \leq p}\) est <strong>libre</strong>.</li>
      <li>Les fonctions \(c_k : t \mapsto \cos(kt)\), \(k \in \mathbb{N}\), vérifient \(c_k'' = -k^2c_k\) : ce sont des vecteurs propres de \(D^2 = D \circ D\) associés aux valeurs propres \(-k^2\), deux à deux distinctes. Toute famille finie de ces fonctions est donc libre.</li>
      <li>Une famille de vecteurs propres de \(g : P \mapsto XP'\) associés à des valeurs propres distinctes est libre : on retrouve la liberté de \((1, X, X^2, \ldots)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure que la somme des sous-espaces propres est l'espace tout entier. Elle est directe, mais elle peut être strictement plus petite que \(E\) (pour une rotation du plan, elle est réduite à \(\{0\}\)). Savoir quand elle vaut \(E\) est précisément la question de la diagonalisabilité (chapitre Réduction des endomorphismes).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉLÉMENTS PROPRES D'UNE MATRICE CARRÉE</div>
  <h2>Le même vocabulaire, en colonnes</h2>
  <div class="intro">Une matrice carrée \(A\) agit sur les colonnes par \(X \mapsto AX\) : on lui transporte tout le vocabulaire des endomorphismes. Les calculs se ramènent à des systèmes linéaires et à des déterminants.</div>

  <div class="def-box">
    Soit \(A \in \mathcal{M}_n(\mathbb{K})\). Un scalaire \(\lambda \in \mathbb{K}\) est <strong>valeur propre</strong> de \(A\) s'il existe une colonne \(X \in \mathcal{M}_{n,1}(\mathbb{K})\) <strong>non nulle</strong> telle que \(AX = \lambda X\) ; \(X\) est alors un <strong>vecteur propre</strong> de \(A\). Le sous-espace propre associé est \(E_\lambda(A) = \operatorname{Ker}(A - \lambda I_n)\), et le <strong>spectre</strong> \(\operatorname{Sp}(A)\) est l'ensemble des valeurs propres de \(A\).
  </div>
  <div class="prop-box">
    <strong>Caractérisations.</strong> Pour \(\lambda \in \mathbb{K}\), les propriétés suivantes sont équivalentes : \(\lambda \in \operatorname{Sp}(A)\) ; \(A - \lambda I_n\) n'est pas inversible ; \(\det(\lambda I_n - A) = 0\) ; \(\operatorname{rg}(A - \lambda I_n) \lt n\). Le théorème du rang donne alors :
    <div class="formula" data-nom="Dimension d'un sous-espace propre">$$\dim E_\lambda(A) = n - \operatorname{rg}(A - \lambda I_n).$$</div>
  </div>
  <div class="prop-box">
    <strong>Lien avec les endomorphismes.</strong> Si \(A = \operatorname{Mat}_{\mathcal{B}}(f)\) et si \(X\) est la colonne des coordonnées de \(x\) dans \(\mathcal{B}\), alors \(f(x) = \lambda x\) équivaut à \(AX = \lambda X\). Ainsi \(\operatorname{Sp}(f) = \operatorname{Sp}(A)\), les sous-espaces propres se correspondent et ont la même dimension. En particulier, \(\operatorname{Sp}(A)\) est le spectre de l'endomorphisme de \(\mathbb{K}^n\) canoniquement associé à \(A\).
  </div>

  <div class="method-box">
    <strong>Exemple — une valeur propre lue sur les sommes de lignes</strong>
    <p>Soit \(A = \begin{pmatrix} 2 & 1 & 1 \\ 0 & 3 & 1 \\ 1 & 1 & 2 \end{pmatrix}\). Chaque ligne a pour somme \(4\).</p>
    <ol>
      <li>Avec \(U = (1, 1, 1)^\top\), le produit \(AU\) contient les sommes des lignes : \(AU = 4U\). Donc \(4 \in \operatorname{Sp}(A)\) et \(U\) est un vecteur propre associé.</li>
      <li>Pour \(\lambda = 2\), on résout \((A - 2I_3)X = 0\) : \(y + z = 0\), \(y + z = 0\) et \(x + y = 0\), d'où \(X = (1, -1, 1)^\top\) à un facteur près. Donc \(2 \in \operatorname{Sp}(A)\) et \(\dim E_2(A) = 1\).</li>
      <li>On vérifiera au §7 que le spectre complet est \(\{1, 2, 4\}\).</li>
    </ol>
  </div>

  <h3>Matrices réelles, valeurs propres complexes</h3>
  <p>Une matrice \(A \in \mathcal{M}_n(\mathbb{R})\) est aussi un élément de \(\mathcal{M}_n(\mathbb{C})\). Son spectre réel est formé des valeurs propres complexes qui sont réelles : \(\operatorname{Sp}_{\mathbb{R}}(A) = \operatorname{Sp}_{\mathbb{C}}(A) \cap \mathbb{R}\). Quand il y a une ambiguïté, on précise le corps.</p>
  <div class="method-box">
    <strong>Exemple — le quart de tour</strong>
    <p>Soit \(R = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}\), matrice de la rotation d'angle \(\pi/2\).</p>
    <ol>
      <li>Dans \(\mathbb{R}^2\), aucune droite n'est stable par un quart de tour : \(\operatorname{Sp}_{\mathbb{R}}(R) = \varnothing\).</li>
      <li>Dans \(\mathbb{C}^2\) :
      <div class="formula">$$\begin{aligned} R\begin{pmatrix} 1 \\ -i \end{pmatrix} &= \begin{pmatrix} i \\ 1 \end{pmatrix} = i\begin{pmatrix} 1 \\ -i \end{pmatrix}, \\ R\begin{pmatrix} 1 \\ i \end{pmatrix} &= -i\begin{pmatrix} 1 \\ i \end{pmatrix}. \end{aligned}$$</div></li>
      <li>Donc \(\operatorname{Sp}_{\mathbb{C}}(R) = \{i, -i\}\) : deux valeurs propres conjuguées, avec des vecteurs propres conjugués.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre lignes et colonnes. Des sommes de <strong>lignes</strong> constantes égales à \(s\) donnent le vecteur propre \((1, \ldots, 1)^\top\) associé à \(s\). Des sommes de <strong>colonnes</strong> constantes donnent ce vecteur propre pour \(A^\top\) : \(s\) est encore valeur propre de \(A\) (\(A\) et \(A^\top\) ont le même polynôme caractéristique, défini au §5, puisque \(\det(M^\top) = \det M\) pour toute matrice carrée \(M\)), mais \((1, \ldots, 1)^\top\) n'est en général pas vecteur propre de \(A\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LE POLYNÔME CARACTÉRISTIQUE</div>
  <h2>Toutes les valeurs propres dans une seule équation</h2>
  <div class="intro">En dimension finie, \(\lambda\) est valeur propre exactement quand \(\det(\lambda I_n - A) = 0\). Vue comme fonction de \(\lambda\), cette quantité est un polynôme : trouver les valeurs propres, c'est trouver ses racines.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Pour \(A \in \mathcal{M}_n(\mathbb{K})\), la fonction \(x \mapsto \det(xI_n - A)\) est polynomiale, <strong>unitaire</strong> et de <strong>degré \(n\)</strong>. Le polynôme correspondant est le <strong>polynôme caractéristique</strong> de \(A\) :
    <div class="formula" data-nom="Polynôme caractéristique">$$\begin{aligned} \chi_A(X) &= \det(XI_n - A) \\ &= X^n - \operatorname{tr}(A)\,X^{n-1} \\ &\quad + \cdots + (-1)^n\det A. \end{aligned}$$</div>
    En particulier, en taille 2 :
    <div class="formula" data-nom="Polynôme caractéristique en taille 2">$$\chi_A(X) = X^2 - \operatorname{tr}(A)\,X + \det A.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tailles 2 et 3, et le coefficient constant en toute taille (non exigible pour \(n \geq 4\)).</span>
    <div class="content"><p>En taille 2, avec \(A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}\) :</p>
    <div class="formula">$$\begin{aligned} &\begin{vmatrix} x - a & -b \\ -c & x - d \end{vmatrix} \\ &= (x - a)(x - d) - bc \\ &= x^2 - (a + d)x + (ad - bc). \end{aligned}$$</div>
    <p>En taille 3, la règle de Sarrus écrit \(\det(xI_3 - A)\) comme somme de six produits de trois coefficients, chacun de degré au plus 1 en \(x\). Seul le produit des termes diagonaux \((x - a_{11})(x - a_{22})(x - a_{33})\) est de degré 3, de coefficient dominant \(1\), et les autres produits contiennent au plus un facteur diagonal, donc sont de degré au plus 1 : le coefficient de \(x^2\) vient du seul produit diagonal et vaut \(-(a_{11} + a_{22} + a_{33}) = -\operatorname{tr} A\). En toute taille, le terme constant vaut \(\chi_A(0) = \det(-A) = (-1)^n\det A\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Valeurs propres et racines.</strong> \(\lambda \in \operatorname{Sp}(A)\) si et seulement si \(\chi_A(\lambda) = 0\). Par conséquent :
    <ul>
      <li>\(A\) a au plus \(n\) valeurs propres ;</li>
      <li>si \(\mathbb{K} = \mathbb{C}\), \(A\) a au moins une valeur propre (théorème de d'Alembert-Gauss) ;</li>
      <li>si \(A \in \mathcal{M}_n(\mathbb{R})\) avec \(n\) impair, \(A\) a au moins une valeur propre réelle (un polynôme réel de degré impair s'annule, par le théorème des valeurs intermédiaires).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Invariance.</strong> Deux matrices semblables ont le même polynôme caractéristique, donc les mêmes valeurs propres, avec les mêmes multiplicités (§6). On définit ainsi le polynôme caractéristique \(\chi_f\) d'un endomorphisme \(f\) d'un espace de dimension finie comme celui de sa matrice dans n'importe quelle base : \(\chi_f(X) = \det(X\,\mathrm{id}_E - f)\), et \(\operatorname{Sp}(f)\) est l'ensemble de ses racines.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi \(\chi_{P^{-1}AP} = \chi_A\).</span>
    <div class="content"><p>Pour tout scalaire \(x\), \(xI_n - P^{-1}AP = P^{-1}(xI_n - A)P\), car \(P^{-1}(xI_n)P = xI_n\). Les deux matrices sont semblables et ont le même déterminant : \(\chi_{P^{-1}AP}(x) = \chi_A(x)\) pour tout \(x\), donc les deux polynômes sont égaux.</p></div>
  </div>
  <div class="prop-box">
    <strong>Matrices triangulaires.</strong> Si \(T\) est triangulaire de coefficients diagonaux \(t_{11}, \ldots, t_{nn}\), alors \(\chi_T = \prod_{k=1}^n (X - t_{kk})\) : <strong>les valeurs propres d'une matrice triangulaire sont ses coefficients diagonaux</strong>. Pour une matrice triangulaire par blocs \(\begin{pmatrix} A_1 & B \\ 0 & A_2 \end{pmatrix}\), on a \(\chi = \chi_{A_1}\,\chi_{A_2}\) (chapitre Déterminants, §6).
  </div>

  <div class="method-box">
    <strong>Exemple — une matrice \(2\times 2\) complètement traitée</strong>
    <p>Soit \(A = \begin{pmatrix} 4 & -2 \\ 1 & 1 \end{pmatrix}\).</p>
    <ol>
      <li>\(\operatorname{tr} A = 5\) et \(\det A = 4 + 2 = 6\), donc \(\chi_A = X^2 - 5X + 6\), soit \(\chi_A = (X - 2)(X - 3)\), et \(\operatorname{Sp}(A) = \{2, 3\}\).</li>
      <li>\(A - 2I_2 = \begin{pmatrix} 2 & -2 \\ 1 & -1 \end{pmatrix}\) : la relation \(x - y = 0\) donne \(E_2(A) = \operatorname{Vect}\big((1, 1)^\top\big)\).</li>
      <li>\(A - 3I_2 = \begin{pmatrix} 1 & -2 \\ 1 & -2 \end{pmatrix}\) : \(x = 2y\), donc \(E_3(A) = \operatorname{Vect}\big((2, 1)^\top\big)\).</li>
      <li>Contrôle : \(A(2, 1)^\top = (6, 3)^\top = 3(2, 1)^\top\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Convention</strong> : certains ouvrages calculent \(\det(A - \lambda I_n)\) ; les méthodes et exercices de ce site utilisent \(\chi_A\). Comme \(\det(A - \lambda I_n) = (-1)^n\chi_A(\lambda)\), les racines sont les mêmes ; seul \(\chi_A = \det(XI_n - A)\) est <strong>unitaire</strong>, et c'est la définition du programme. <strong>Erreur classique</strong> : croire que les valeurs propres de \(A + B\) ou de \(AB\) se déduisent de celles de \(A\) et de \(B\). Il n'y a pas de règle générale ; un cas utile : les valeurs propres de \(A + \mu I_n\) sont les \(\lambda + \mu\), avec les mêmes vecteurs propres.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MULTIPLICITÉ ET DIMENSION DES SOUS-ESPACES PROPRES</div>
  <h2>Compter une valeur propre de deux façons</h2>
  <div class="intro">Une valeur propre a deux « tailles » : sa multiplicité comme racine du polynôme caractéristique, et la dimension de son sous-espace propre. La seconde ne dépasse jamais la première, et l'écart entre les deux est exactement ce qui empêchera certaines matrices d'être diagonalisables.</div>

  <div class="def-box">
    La <strong>multiplicité</strong> \(m(\lambda)\) d'une valeur propre \(\lambda\) de \(A\) (ou de \(f\)) est sa multiplicité en tant que racine de \(\chi_A\) : le plus grand entier \(m\) tel que \((X - \lambda)^m\) divise \(\chi_A\). On parle de valeur propre <strong>simple</strong> si \(m(\lambda) = 1\), <strong>double</strong> si \(m(\lambda) = 2\).
  </div>
  <div class="prop-box">
    <strong>Polynôme scindé.</strong> Si \(\chi_A\) est scindé sur \(\mathbb{K}\) (toujours le cas si \(\mathbb{K} = \mathbb{C}\)), de racines distinctes \(\lambda_1, \ldots, \lambda_p\), alors \(\chi_A = \prod_{k=1}^p (X - \lambda_k)^{m(\lambda_k)}\) et \(\sum_k m(\lambda_k) = n\). En comparant les coefficients avec le §5 :
    <div class="formula" data-nom="Trace et déterminant par les valeurs propres">$$\begin{aligned} \operatorname{tr} A &= \sum_{k=1}^{p} m(\lambda_k)\,\lambda_k, \\ \det A &= \prod_{k=1}^{p} \lambda_k^{\,m(\lambda_k)}. \end{aligned}$$</div>
    La trace est la somme des valeurs propres comptées avec multiplicité, le déterminant leur produit (voir aussi le chapitre Réduction des endomorphismes, §7).
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> Pour toute valeur propre \(\lambda\) :
    <div class="formula" data-nom="Dimension et multiplicité">$$1 \leq \dim E_\lambda \leq m(\lambda).$$</div>
    En particulier, le sous-espace propre associé à une valeur propre <strong>simple</strong> est une droite.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une base adaptée au sous-espace propre et un déterminant par blocs.</span>
    <div class="content"><p>Soit \(f\) l'endomorphisme associé, \(d = \dim E_\lambda(f) \geq 1\) (une valeur propre a au moins un vecteur propre), et \((e_1, \ldots, e_d)\) une base de \(E_\lambda(f)\), complétée en une base \(\mathcal{B}\) de \(E\). Comme \(f(e_k) = \lambda e_k\) pour \(k \leq d\), la matrice de \(f\) dans \(\mathcal{B}\) est triangulaire par blocs :</p>
    <div class="formula">$$\begin{aligned} \operatorname{Mat}_{\mathcal{B}}(f) &= \begin{pmatrix} \lambda I_d & B \\ 0 & C \end{pmatrix}, \\ \chi_f &= (X - \lambda)^d\,\chi_C. \end{aligned}$$</div>
    <p>Ainsi \((X - \lambda)^d\) divise \(\chi_f\), ce qui signifie \(d \leq m(\lambda)\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — même polynôme caractéristique, sous-espaces propres différents</strong>
    <p>Soit \(A = \begin{pmatrix} 1 & 3 & 2 \\ 1 & -1 & -2 \\ 0 & 2 & 3 \end{pmatrix}\) et \(B = \begin{pmatrix} 0 & 0 & -1 \\ 2 & 2 & 1 \\ -2 & 0 & 1 \end{pmatrix}\).</p>
    <ol>
      <li>Calcul de \(\chi_A\) en créant un facteur : dans \(XI_3 - A\), l'opération \(L_1 \leftarrow L_1 + L_2\) donne la première ligne \((X - 2, X - 2, 0)\), dont on sort \(X - 2\) ; puis \(C_2 \leftarrow C_2 - C_1\). On obtient \(\chi_A = (X - 2)\,D\), avec
      <div class="formula">$$\begin{aligned} D &= \begin{vmatrix} 1 & 0 & 0 \\ -1 & X + 2 & 2 \\ 0 & -2 & X - 3 \end{vmatrix} \\ &= X^2 - X - 2. \end{aligned}$$</div></li>
      <li>Comme \(D = X^2 - X - 2\) se factorise en \((X - 2)(X + 1)\), on obtient \(\chi_A = (X - 2)^2(X + 1)\) : \(2\) est double et \(-1\) simple. Contrôle : \(2 + 2 - 1 = 3 = \operatorname{tr} A\) et \(2 \times 2 \times (-1) = -4 = \det A\).</li>
      <li>\(A - 2I_3 = \begin{pmatrix} -1 & 3 & 2 \\ 1 & -3 & -2 \\ 0 & 2 & 1 \end{pmatrix}\) est de rang 2 (deux premières lignes opposées, la troisième non proportionnelle) : \(\dim E_2(A) = 1 \lt 2 = m(2)\), et \(E_2(A) = \operatorname{Vect}\big((1, -1, 2)^\top\big)\). De même \(E_{-1}(A) = \operatorname{Vect}\big((2, -2, 1)^\top\big)\).</li>
      <li>Pour \(B\), on trouve aussi \(\chi_B = (X - 2)^2(X + 1)\) (développer suivant la deuxième colonne de \(XI_3 - B\), qui ne contient que \(X - 2\)). Mais \(B - 2I_3 = \begin{pmatrix} -2 & 0 & -1 \\ 2 & 0 & 1 \\ -2 & 0 & -1 \end{pmatrix}\) est de rang 1 : \(\dim E_2(B) = 2 = m(2)\), avec la base \((0, 1, 0)^\top\), \((1, 0, -2)^\top\).</li>
      <li>Conclusion : \(A\) et \(B\) ont le même polynôme caractéristique mais <strong>ne sont pas semblables</strong>, car des matrices semblables ont des sous-espaces propres de même dimension (\(\operatorname{rg}(P^{-1}AP - 2I_3) = \operatorname{rg}(A - 2I_3)\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que \(\dim E_\lambda = m(\lambda)\) toujours, ou que la multiplicité se lit sur le sous-espace propre. Seules les inégalités \(1 \leq \dim E_\lambda \leq m(\lambda)\) sont garanties ; le chapitre suivant montre que l'égalité pour toutes les valeurs propres caractérise, avec un \(\chi\) scindé, les matrices diagonalisables.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · MÉTHODES DE CALCUL</div>
  <h2>Trouver vite et sans erreur</h2>
  <div class="intro">Le programme limite les calculs à la main aux tailles 2 et 3. L'essentiel est de factoriser le polynôme caractéristique au lieu de le développer, de repérer les valeurs propres « évidentes », et de tout contrôler par la trace et le déterminant.</div>

  <div class="method-box">
    <strong>Méthode — éléments propres d'une matrice \(2\times 2\)</strong>
    <ol>
      <li>\(\chi_A = X^2 - \operatorname{tr}(A)X + \det A\) : on résout une équation du second degré (racines réelles, double ou complexes conjuguées).</li>
      <li>Pour chaque valeur propre \(\lambda\) (avec \(A \neq \lambda I_2\)), \(A - \lambda I_2\) est de rang 1 : si l'une de ses lignes est \((\alpha, \beta) \neq (0, 0)\), le vecteur \((-\beta, \alpha)^\top\) dirige \(E_\lambda(A)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode — polynôme caractéristique d'une matrice \(3\times 3\)</strong>
    <ol>
      <li>Ne pas développer brutalement \(\det(XI_3 - A)\) : chercher une opération sur les lignes ou les colonnes qui fait apparaître un facteur commun \(X - \lambda\) (deux lignes dont la somme ou la différence se factorise, sommes de lignes constantes…).</li>
      <li>Sortir ce facteur, créer des zéros, développer : il reste un trinôme du second degré.</li>
      <li>Si l'on a développé, chercher des racines entières parmi les diviseurs du terme constant \(-\det A\) (pour une matrice à coefficients entiers), puis factoriser.</li>
      <li>Rappel utile, où \(c\) est la somme des trois déterminants \(2\times 2\) obtenus en supprimant une ligne et la colonne de même numéro :
      <div class="formula">$$\begin{aligned} \chi_A &= X^3 - \operatorname{tr}(A)\,X^2 \\ &\quad + c\,X - \det A. \end{aligned}$$</div></li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode — valeurs propres évidentes et contrôles</strong>
    <ol>
      <li>\(A\) non inversible (colonnes liées, \(\det A = 0\)) : \(0\) est valeur propre.</li>
      <li>Sommes des lignes toutes égales à \(s\) : \(s\) est valeur propre, de vecteur propre \((1, \ldots, 1)^\top\).</li>
      <li>\(A - \lambda I_n\) de petit rang \(r\) : \(\lambda\) est valeur propre avec \(\dim E_\lambda = n - r\), donc \(m(\lambda) \geq n - r\).</li>
      <li>Compléter avec la trace (somme des valeurs propres avec multiplicité) et le déterminant (leur produit).</li>
      <li>Contrôler chaque valeur propre trouvée : \(A - \lambda I_n\) doit être de rang \(\lt n\). Un système \((A - \lambda I_n)X = 0\) qui n'a que la solution nulle signale une erreur de calcul.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — trois valeurs propres sans développer \(\chi\)</strong>
    <p>Reprenons \(A = \begin{pmatrix} 2 & 1 & 1 \\ 0 & 3 & 1 \\ 1 & 1 & 2 \end{pmatrix}\) du §4.</p>
    <ol>
      <li>Sommes des lignes : \(4 \in \operatorname{Sp}(A)\), de vecteur propre \((1, 1, 1)^\top\).</li>
      <li>Les deux autres valeurs propres \(\lambda, \mu\) (dans \(\mathbb{C}\)) vérifient \(4 + \lambda + \mu = \operatorname{tr} A = 7\) et \(4\lambda\mu = \det A = 8\), donc \(\lambda + \mu = 3\) et \(\lambda\mu = 2\) : ce sont \(1\) et \(2\).</li>
      <li>\(\chi_A = (X - 1)(X - 2)(X - 4)\) : trois valeurs propres simples, donc trois droites propres. \(E_2(A)\) a été trouvé au §4 ; pour \(1\), \((A - I_3)X = 0\) donne \(E_1(A) = \operatorname{Vect}\big((1, 1, -2)^\top\big)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un rang qui fait tout le travail</strong>
    <p>Soit \(M = \begin{pmatrix} 3 & 1 & 1 \\ 1 & 3 & 1 \\ 1 & 1 & 3 \end{pmatrix}\).</p>
    <ol>
      <li>\(M - 2I_3\) est la matrice dont tous les coefficients valent \(1\) : elle est de rang 1. Donc \(2 \in \operatorname{Sp}(M)\), \(\dim E_2(M) = 2\) et \(m(2) \geq 2\) : \(E_2(M)\) est le plan \(x + y + z = 0\).</li>
      <li>La troisième valeur propre \(\nu\) vérifie \(2 + 2 + \nu = \operatorname{tr} M = 9\), donc \(\nu = 5\) ; les sommes de lignes donnent \(E_5(M) = \operatorname{Vect}\big((1, 1, 1)^\top\big)\).</li>
      <li>\(\chi_M = (X - 2)^2(X - 5)\), sans avoir calculé un seul déterminant \(3\times 3\). Contrôle : \(\det M = 2 \times 2 \times 5 = 20\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — endomorphismes d'espaces de polynômes et de matrices</strong>
    <ol>
      <li><strong>\(\tau : P \mapsto P(X + 1)\) sur \(\mathbb{R}_n[X]\)</strong> : \(\tau(X^k) = (X + 1)^k\) est égal à \(X^k\) plus des termes de degré \(\lt k\), donc la matrice dans \((1, X, \ldots, X^n)\) est triangulaire avec des \(1\) sur la diagonale et \(\chi_\tau = (X - 1)^{n+1}\). Mais \(P(X + 1) = P\) impose \(P\) constant (un polynôme non constant ne peut pas être périodique) : \(\dim E_1(\tau) = 1\), alors que \(m(1) = n + 1\).</li>
      <li><strong>Transposition \(T : M \mapsto M^\top\) sur \(\mathcal{M}_n(\mathbb{R})\)</strong> : \(T \circ T = \mathrm{id}\), donc \(\operatorname{Sp}(T) \subset \{-1, 1\}\) (§2). \(E_1(T)\) est l'espace \(\mathcal{S}_n\) des matrices symétriques, \(E_{-1}(T)\) celui \(\mathcal{A}_n\) des matrices antisymétriques ; comme \(\mathcal{M}_n = \mathcal{S}_n \oplus \mathcal{A}_n\), les dimensions \(\tfrac{n(n+1)}{2}\) et \(\tfrac{n(n-1)}{2}\) ont pour somme \(n^2 = \deg\chi_T\) : avec \(\dim E_\lambda \leq m(\lambda)\), ce sont aussi les multiplicités.</li>
    </ol>
  </div>

  <h3>Vérifier à l'ordinateur</h3>
  <p>Le calcul formel donne les éléments propres exacts (valeur propre, multiplicité, base du sous-espace propre) ; le calcul numérique donne des valeurs approchées, utiles pour les grandes matrices.</p>
  <pre class="codeblock">from sympy import Matrix
A = Matrix([[1, 3, 2], [1, -1, -2], [0, 2, 3]])
A.charpoly().as_expr()   <span class="cmt"># lambda**3 - 3*lambda**2 + 4</span>
A.eigenvects()           <span class="cmt"># [(-1, 1, [(2, -2, 1)]), (2, 2, [(1/2, -1/2, 1)])]</span>
                         <span class="cmt"># (valeur propre, multiplicité, base de E_λ)</span></pre>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Polynômes d'endomorphisme et valeurs propres</h2>
  <div class="intro">Le programme exclut tout développement sur les polynômes d'endomorphisme. Les énoncés suivants apparaissent pourtant souvent dans les sujets, toujours guidés : ils se démontrent en quelques lignes avec les outils du chapitre.</div>
  <ul>
    <li><strong>Valeurs propres d'un polynôme en \(f\).</strong> Si \(f(x) = \lambda x\), alors \(f^k(x) = \lambda^kx\) pour tout \(k\), et donc \(P(f)(x) = P(\lambda)\,x\) pour tout polynôme \(P\). Si \(P(f) = 0\) (\(P\) est <strong>annulateur</strong>), toute valeur propre de \(f\) est racine de \(P\) : c'est l'argument utilisé au §2 pour les projecteurs (\(X^2 - X\)) et les symétries (\(X^2 - 1\)).</li>
    <li><strong>Théorème de Cayley-Hamilton.</strong> Le polynôme caractéristique est annulateur : \(\chi_A(A) = 0\). En taille 2, c'est l'identité \(A^2 - \operatorname{tr}(A)A + \det(A)I_2 = 0\) du chapitre Calcul matriciel (approfondissements), §6.</li>
    <li><strong>Polynôme minimal.</strong> Le polynôme unitaire annulateur de plus petit degré ; ses racines sont exactement les valeurs propres.</li>
    <li><strong>Dimension infinie.</strong> On y distingue « \(f - \lambda\,\mathrm{id}\) non injectif » (valeur propre) et « non bijectif » : la dérivation sur \(\mathbb{R}[X]\) est surjective mais pas injective, l'endomorphisme \(P \mapsto XP\) est injectif mais pas surjectif. Le spectre au sens large (les \(\lambda\) pour lesquels \(f - \lambda\,\mathrm{id}\) n'est pas bijectif) relève de l'analyse fonctionnelle.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="elp-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉLÉMENTS PROPRES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Trouver les valeurs propres et les sous-espaces propres d'un endomorphisme ou d'une matrice, vite et sans erreur, et s'en servir pour raisonner. Le polynôme caractéristique est celui du programme : \(\chi_A(X) = \det(XI_n - A)\), unitaire de degré \(n\). Les renvois « § » sont ceux du cours.</div>

  <div class="method-box"><strong>Méthode 1 — Vérifier qu'un vecteur est propre, qu'un scalaire est valeur propre</strong>
    <ol>
      <li>Pour un vecteur \(X \neq 0\) : calculer \(AX\) et regarder s'il est colinéaire à \(X\) ; le coefficient est la valeur propre associée.</li>
      <li>Pour un scalaire \(\lambda\) : \(\lambda \in \operatorname{Sp}(A)\) si et seulement si \(A - \lambda I_n\) n'est pas inversible, c'est-à-dire \(\operatorname{rg}(A - \lambda I_n) \lt n\), ou \(\chi_A(\lambda) = 0\) (§4).</li>
      <li>Un rang se voit souvent à l'œil (lignes proportionnelles) : c'est plus rapide qu'un déterminant.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(A = \begin{pmatrix} 1 & 2 \\ 3 & 2 \end{pmatrix}\), \(A(2, 3)^\top = (8, 12)^\top = 4(2, 3)^\top\) : \((2, 3)^\top\) est propre pour \(4\). Et \(A + I_2 = \begin{pmatrix} 2 & 2 \\ 3 & 3 \end{pmatrix}\) est de rang 1 : \(-1\) est valeur propre.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un vecteur propre est <strong>non nul</strong> (sinon tout scalaire serait valeur propre). En revanche, \(0\) peut être valeur propre : cela signifie que \(A\) n'est pas inversible.</div>

  <div class="method-box"><strong>Méthode 2 — Chercher les éléments propres en dimension quelconque</strong>
    <ol>
      <li>Écrire l'équation \(f(x) = \lambda x\), d'inconnue \(x\) (fonction, polynôme, suite) et de paramètre \(\lambda\).</li>
      <li>La résoudre en discutant selon \(\lambda\) : équation différentielle, identification de coefficients, comparaison de degrés, récurrence (§2).</li>
      <li>Garder les \(\lambda\) pour lesquels il existe une solution <strong>non nulle</strong> : ce sont les valeurs propres, et l'ensemble des solutions est \(E_\lambda(f)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \(\mathcal{C}^\infty(\mathbb{R}, \mathbb{R})\), \(f : y \mapsto y''\). Pour \(\lambda = \omega^2 \gt 0\), \(y'' = \lambda y\) a pour solutions \(\operatorname{Vect}(e^{\omega t}, e^{-\omega t})\) ; pour \(\lambda = 0\), les fonctions affines ; pour \(\lambda = -\omega^2 \lt 0\), \(\operatorname{Vect}(\cos\omega t, \sin\omega t)\). Tout réel est valeur propre, et chaque sous-espace propre est un plan.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : en dimension infinie, ni déterminant ni polynôme caractéristique, et pas de « spectre » au sens du programme : on résout l'équation \(f(x) = \lambda x\).</div>

  <div class="method-box"><strong>Méthode 3 — Éléments propres d'une matrice \(2 \times 2\)</strong>
    <ol>
      <li>\(\chi_A = X^2 - \operatorname{tr}(A)X + \det A\) : résoudre l'équation du second degré (deux racines réelles, une racine double, ou deux racines complexes conjuguées).</li>
      <li>Pour chaque valeur propre \(\lambda\) (avec \(A \neq \lambda I_2\)), \(A - \lambda I_2\) est de rang 1 : si l'une de ses lignes non nulles est \((\alpha, \beta)\), le vecteur \((-\beta, \alpha)^\top\) dirige \(E_\lambda(A)\) (§7).</li>
      <li>Contrôler en calculant \(AX\) pour chaque vecteur trouvé.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = \begin{pmatrix} 5 & -2 \\ 4 & -1 \end{pmatrix}\) : \(\operatorname{tr} A = 4\), \(\det A = 3\), \(\chi_A = (X - 1)(X - 3)\). La ligne \((4, -2)\) de \(A - I_2\) donne \(E_1(A) = \operatorname{Vect}\big((1, 2)^\top\big)\) ; la ligne \((2, -2)\) de \(A - 3I_2\) donne \(E_3(A) = \operatorname{Vect}\big((1, 1)^\top\big)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Polynôme caractéristique d'une matrice \(3 \times 3\) : factoriser au lieu de développer</strong>
    <ol>
      <li>Écrire \(XI_3 - A\) et chercher une opération sur les lignes ou les colonnes qui fait apparaître un facteur commun \(X - \lambda\) : différence ou somme de deux lignes, somme de toutes les colonnes si les sommes de lignes de \(A\) sont égales.</li>
      <li>Sortir ce facteur, créer un zéro de plus, développer : il reste un trinôme à factoriser.</li>
      <li>Si l'on a tout de même développé, chercher des racines entières parmi les diviseurs du terme constant \(-\det A\) (matrice à coefficients entiers).</li>
      <li>Contrôler : somme des racines \(= \operatorname{tr} A\), produit \(= \det A\) (§6).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(A = \begin{pmatrix} 4 & 1 & -1 \\ 2 & 3 & -1 \\ 1 & 2 & 1 \end{pmatrix}\), \(L_1 \leftarrow L_1 - L_2\) donne dans \(XI_3 - A\) la première ligne \((X - 2, -(X - 2), 0)\). On sort \(X - 2\), puis \(C_2 \leftarrow C_2 + C_1\), et l'on développe suivant la première ligne :</p>
    <div class="formula">$$\begin{aligned} \chi_A &= (X - 2)\begin{vmatrix} X - 5 & 1 \\ -3 & X - 1 \end{vmatrix} \\ &= (X - 2)(X^2 - 6X + 8) = (X - 2)^2(X - 4). \end{aligned}$$</div>
    <p>Contrôle : \(2 + 2 + 4 = 8 = \operatorname{tr} A\) et \(2 \times 2 \times 4 = 16 = \det A\).</p>
  </div>
  <div class="notice"><strong>Convention</strong> : certains ouvrages calculent \(\det(A - \lambda I_n)\). Comme \(\det(A - \lambda I_n) = (-1)^n\chi_A(\lambda)\), on obtient les mêmes valeurs propres, mais seul \(\chi_A = \det(XI_n - A)\) est unitaire et a pour coefficients \(-\operatorname{tr} A\) (en \(X^{n-1}\)) et \((-1)^n\det A\) (constant). C'est la définition du programme, utilisée dans tout le site.</div>

  <div class="method-box"><strong>Méthode 5 — Trouver le spectre sans calculer \(\chi_A\)</strong>
    <ol>
      <li>Repérer les valeurs propres évidentes : \(A\) non inversible donne \(0\) ; sommes de lignes toutes égales à \(s\) donnent \(s\), de vecteur propre \((1, \ldots, 1)^\top\) ; matrice triangulaire : coefficients diagonaux.</li>
      <li>Si \(A - \lambda I_n\) est de petit rang \(r\), alors \(\lambda\) est valeur propre, \(\dim E_\lambda = n - r\) et \(m(\lambda) \geq n - r\).</li>
      <li>Compléter par la trace (somme des valeurs propres comptées avec multiplicité) et le déterminant (leur produit), dans \(\mathbb{C}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = \begin{pmatrix} 1 & 2 & 3 \\ 1 & 2 & 3 \\ 1 & 2 & 3 \end{pmatrix}\) est de rang 1 : \(0\) est valeur propre, \(\dim E_0 = 2\), donc \(m(0) \geq 2\). La dernière valeur propre vaut \(\operatorname{tr} A - 0 - 0 = 6\) (ce sont aussi les sommes de lignes) : \(\chi_A = X^2(X - 6)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Déterminer un sous-espace propre et comparer sa dimension à la multiplicité</strong>
    <ol>
      <li>Résoudre le système \((A - \lambda I_n)X = 0\) par la méthode du pivot ; donner une base de \(E_\lambda(A)\).</li>
      <li>Contrôler par le théorème du rang : \(\dim E_\lambda(A) = n - \operatorname{rg}(A - \lambda I_n)\).</li>
      <li>Comparer à la multiplicité : toujours \(1 \leq \dim E_\lambda \leq m(\lambda)\) (§6). Une valeur propre simple a pour sous-espace propre une droite : un seul vecteur suffit.</li>
      <li>Si le système n'a que la solution nulle, \(\lambda\) n'est pas valeur propre : il y a une erreur dans \(\chi_A\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = \begin{pmatrix} 2 & 0 & 0 \\ 1 & 2 & 0 \\ 0 & 0 & 3 \end{pmatrix}\) est triangulaire : \(\chi_A = (X - 2)^2(X - 3)\). Le système \((A - 2I_3)X = 0\) se réduit à \(x = 0\), \(z = 0\) : \(E_2(A) = \operatorname{Vect}\big((0, 1, 0)^\top\big)\), de dimension \(1 \lt 2 = m(2)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la multiplicité ne se lit pas sur le sous-espace propre, ni l'inverse. Une valeur propre double peut avoir un sous-espace propre de dimension 1 ou 2 : seul le calcul du rang tranche.</div>

  <div class="method-box"><strong>Méthode 7 — Prouver qu'une famille est libre grâce aux vecteurs propres</strong>
    <ol>
      <li>Trouver un endomorphisme dont les vecteurs de la famille sont des vecteurs propres (dérivation, \(f \mapsto xf'\), décalage des suites…).</li>
      <li>Vérifier que les valeurs propres associées sont deux à deux distinctes.</li>
      <li>Conclure par le théorème du §3 : une famille de vecteurs propres associés à des valeurs propres distinctes est libre.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \(]0, +\infty[\), \(\varphi : f \mapsto (x \mapsto xf'(x))\) vérifie \(\varphi(x \mapsto x^a) = (x \mapsto a\,x^a)\). Pour des réels \(a_1, \ldots, a_p\) deux à deux distincts, les fonctions \(x \mapsto x^{a_k}\) forment donc une famille libre.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Utiliser l'invariance du polynôme caractéristique</strong>
    <ol>
      <li>Deux matrices semblables ont le même \(\chi\), donc les mêmes valeurs propres avec les mêmes multiplicités, la même trace, le même déterminant, et des sous-espaces propres de mêmes dimensions (§5, §6).</li>
      <li>Pour prouver que deux matrices ne sont <strong>pas</strong> semblables, exhiber un de ces invariants qui diffère (souvent \(\operatorname{rg}(A - \lambda I_n)\)).</li>
      <li>\(A\) et \(A^\top\) ont le même polynôme caractéristique (car \(\det M^\top = \det M\)), mais pas les mêmes vecteurs propres en général.</li>
      <li>Pour un endomorphisme, \(\chi_f\) se calcule dans n'importe quelle base : choisir celle où la matrice est la plus simple.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}\) et \(2I_2\) ont le même polynôme caractéristique \((X - 2)^2\), mais pas des sous-espaces propres de même dimension (\(1\) et \(2\)) : elles ne sont pas semblables.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Matrice réelle : valeurs propres réelles et complexes</strong>
    <ol>
      <li>Factoriser \(\chi_A\) sur \(\mathbb{C}\) ; ses racines non réelles vont par paires conjuguées, avec des vecteurs propres conjugués (si \(AX = \lambda X\), alors \(A\overline{X} = \overline{\lambda}\,\overline{X}\)).</li>
      <li>Préciser le corps : \(\operatorname{Sp}_{\mathbb{R}}(A) = \operatorname{Sp}_{\mathbb{C}}(A) \cap \mathbb{R}\).</li>
      <li>En taille impaire, une matrice réelle a toujours au moins une valeur propre réelle (§5).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = \begin{pmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 2 \end{pmatrix}\) est triangulaire par blocs : \(\chi_A = (X^2 + 1)(X - 2)\). Donc \(\operatorname{Sp}_{\mathbb{R}}(A) = \{2\}\) et \(\operatorname{Sp}_{\mathbb{C}}(A) = \{2, i, -i\}\), avec \(E_i(A) = \operatorname{Vect}\big((i, 1, 0)^\top\big)\) et, par conjugaison, \(E_{-i}(A) = \operatorname{Vect}\big((-i, 1, 0)^\top\big)\).</p>
  </div>
</div>
</template>

<div class="exo-wrapper">

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Reconnaître des vecteurs propres, puis en déduire le spectre</h3>
  <div class="statement">Soit \(A = \begin{pmatrix} 1 & 2 & -2 \\ 2 & 1 & -2 \\ 2 & 2 & -3 \end{pmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Parmi \(U_1 = (1, 1, 1)^\top\), \(U_2 = (1, -1, 0)^\top\), \(U_3 = (1, 0, 1)^\top\), \(U_4 = (1, 0, 0)^\top\), lesquels sont des vecteurs propres de \(A\) ? Pour quelles valeurs propres ?</div>
  <div class="q"><strong>Q2.</strong> Sans calculer \(\chi_A\), déterminer le spectre de \(A\), les multiplicités et \(\chi_A\). Contrôler avec \(\det A\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(E_{-1}(A)\) et \(E_1(A)\). Le réel \(3\) est-il valeur propre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(AU_1 = (1, 1, 1)^\top = U_1\) : propre pour \(1\). \(AU_2 = (-1, 1, 0)^\top = -U_2\) et \(AU_3 = (-1, 0, -1)^\top = -U_3\) : propres pour \(-1\). \(AU_4 = (1, 2, 2)^\top\) n'est pas colinéaire à \(U_4\) : ce n'est pas un vecteur propre.</p>
    <p><strong>Q2.</strong> \(U_2\) et \(U_3\) ne sont pas colinéaires : \(\dim E_{-1}(A) \geq 2\), donc \(m(-1) \geq 2\). Avec la valeur propre \(1\), la somme des multiplicités atteint déjà \(3\) : \(\operatorname{Sp}(A) = \{-1, 1\}\), \(m(-1) = 2\), \(m(1) = 1\), et \(\chi_A = (X + 1)^2(X - 1)\). Contrôles : \(\operatorname{tr} A = -1 = (-1) + (-1) + 1\), et \(\det A = (-1)^2 \times 1 = 1\) (un calcul direct le confirme).</p>
    <p><strong>Q3.</strong> \(A + I_3 = \begin{pmatrix} 2 & 2 & -2 \\ 2 & 2 & -2 \\ 2 & 2 & -2 \end{pmatrix}\) est de rang 1 : \(E_{-1}(A)\) est le plan d'équation \(x + y - z = 0\), de base \((U_2, U_3)\). La valeur propre \(1\) est simple : \(E_1(A) = \operatorname{Vect}(U_1)\). Enfin \(\chi_A(3) = 16 \times 2 \neq 0\) : \(3\) n'est pas valeur propre (et \(A - 3I_3\) est inversible).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Éléments propres d'une matrice \(2 \times 2\)</h3>
  <div class="statement">Soit \(A = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\chi_A\) et les valeurs propres de \(A\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les sous-espaces propres.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On calcule</p>
    <div class="formula">$$\chi_A(X) = \det(XI_2 - A) = (X - 2)^2 - 1 = (X - 1)(X - 3).$$</div>
    <p>Valeurs propres : \(1\) et \(3\). Contrôle : somme \(4 = \operatorname{tr} A\), produit \(3 = \det A\).</p>
    <p><strong>Q2.</strong> \(A - I_2 = \begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}\) : \(E_1(A) = \operatorname{Ker}(A - I_2) = \operatorname{Vect}\big((1, -1)^\top\big)\). \(A - 3I_2 = \begin{pmatrix} -1 & 1 \\ 1 & -1 \end{pmatrix}\) : \(E_3(A) = \operatorname{Vect}\big((1, 1)^\top\big)\). Les deux valeurs propres sont simples : ce sont des droites.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Lecture sur une matrice triangulaire</h3>
  <div class="statement">Soit \(A = \begin{pmatrix} 3 & 5 \\ 0 & 3 \end{pmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Valeur(s) propre(s) de \(A\) et multiplicité.</div>
  <div class="q"><strong>Q2.</strong> Dimension de \(E_3(A)\) ? Comparer à la multiplicité.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(A\) est triangulaire : \(\chi_A = (X - 3)^2\). Seule valeur propre : \(3\), de multiplicité \(2\).</p>
    <p><strong>Q2.</strong> \(A - 3I_2 = \begin{pmatrix} 0 & 5 \\ 0 & 0 \end{pmatrix}\) est de rang 1 : \(E_3(A) = \operatorname{Vect}\big((1, 0)^\top\big)\), de dimension \(1 \lt 2 = m(3)\). Il n'existe donc pas de base de \(\mathbb{R}^2\) formée de vecteurs propres de \(A\) : le chapitre Réduction des endomorphismes dira que \(A\) n'est pas diagonalisable.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Deux matrices voisines</h3>
  <div class="statement">Soit \(A = \begin{pmatrix} 0 & 1 & -2 \\ 1 & 0 & -2 \\ -1 & 1 & 1 \end{pmatrix}\) et \(B = \begin{pmatrix} 0 & 1 & -2 \\ 1 & 0 & -2 \\ -1 & -1 & 1 \end{pmatrix}\) (seule la dernière ligne diffère).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\chi_A\) et \(\chi_B\) en faisant apparaître un facteur commun par une opération sur les lignes.</div>
  <div class="q"><strong>Q2.</strong> Déterminer les sous-espaces propres de \(A\), puis ceux de \(B\), et comparer leurs dimensions aux multiplicités.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Dans \(XI_3 - A\), les deux premières lignes sont \((X, -1, 2)\) et \((-1, X, 2)\) ; \(L_1 \leftarrow L_1 - L_2\) donne \((X + 1, -(X + 1), 0)\), dont on sort \(X + 1\). Puis \(C_2 \leftarrow C_2 + C_1\) vide la première ligne, qui devient \((1, 0, 0)\), et l'on développe suivant cette ligne :</p>
    <div class="formula">$$\chi_A = (X + 1)\begin{vmatrix} X - 1 & 2 \\ 0 & X - 1 \end{vmatrix} = (X + 1)(X - 1)^2.$$</div>
    <p>Pour \(B\), les mêmes opérations portent sur la dernière ligne \((1, 1, X - 1)\), qui devient \((1, 2, X - 1)\) :</p>
    <div class="formula">$$\chi_B = (X + 1)\begin{vmatrix} X - 1 & 2 \\ 2 & X - 1 \end{vmatrix} = (X + 1)^2(X - 3).$$</div>
    <p>Contrôles : \(\operatorname{tr} A = 1 = -1 + 1 + 1\) et \(\operatorname{tr} B = 1 = -1 - 1 + 3\).</p>
    <p><strong>Q2.</strong> Pour \(A\) : \(A - I_3 = \begin{pmatrix} -1 & 1 & -2 \\ 1 & -1 & -2 \\ -1 & 1 & 0 \end{pmatrix}\). En ajoutant les deux premières lignes, \(-4z = 0\) ; il reste \(x = y\). Donc \(E_1(A) = \operatorname{Vect}\big((1, 1, 0)^\top\big)\), de dimension \(1 \lt 2 = m(1)\). La valeur propre \(-1\) est simple ; \((A + I_3)X = 0\) donne \(E_{-1}(A) = \operatorname{Vect}\big((2, 0, 1)^\top\big)\).</p>
    <p>Pour \(B\) : \(B + I_3 = \begin{pmatrix} 1 & 1 & -2 \\ 1 & 1 & -2 \\ -1 & -1 & 2 \end{pmatrix}\) est de rang 1. \(E_{-1}(B)\) est le plan \(x + y - 2z = 0\), de base \((1, -1, 0)^\top\), \((2, 0, 1)^\top\) : \(\dim E_{-1}(B) = 2 = m(-1)\). La valeur propre \(3\) est simple : \(E_3(B) = \operatorname{Vect}\big((1, 1, -1)^\top\big)\) (contrôle : \(B(1, 1, -1)^\top = (3, 3, -3)^\top\)).</p>
    <p>Une petite différence de coefficients suffit à changer la dimension d'un sous-espace propre : pour \(B\), les sous-espaces propres fournissent \(3\) vecteurs propres indépendants, pour \(A\) seulement \(2\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une matrice réelle aux valeurs propres complexes</h3>
  <div class="statement">Soit \(C = \begin{pmatrix} 0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0 \end{pmatrix}\), qui permute circulairement les coordonnées : \(C(x, y, z)^\top = (z, x, y)^\top\). On note \(j = e^{2i\pi/3}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\chi_C\). Déterminer \(\operatorname{Sp}_{\mathbb{R}}(C)\) et \(\operatorname{Sp}_{\mathbb{C}}(C)\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(\lambda \in \operatorname{Sp}_{\mathbb{C}}(C)\), résoudre \(CX = \lambda X\) et donner \(E_\lambda(C)\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier les relations entre trace, déterminant et valeurs propres.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En développant \(\det(XI_3 - C)\) suivant la première ligne \((X, 0, -1)\) :</p>
    <div class="formula">$$\chi_C = X\begin{vmatrix} X & 0 \\ -1 & X \end{vmatrix} - \begin{vmatrix} -1 & X \\ 0 & -1 \end{vmatrix} = X^3 - 1.$$</div>
    <p>\(X^3 - 1 = (X - 1)(X^2 + X + 1)\), et le second facteur a pour racines \(j\) et \(j^2 = \overline{j}\). Donc \(\operatorname{Sp}_{\mathbb{R}}(C) = \{1\}\) et \(\operatorname{Sp}_{\mathbb{C}}(C) = \{1, j, j^2\}\) : trois valeurs propres simples. (En taille impaire, il fallait au moins une valeur propre réelle.)</p>
    <p><strong>Q2.</strong> \(CX = \lambda X\) s'écrit \(z = \lambda x\), \(x = \lambda y\), \(y = \lambda z\). Avec \(x = 1\) : \(z = \lambda\), puis \(y = \lambda z = \lambda^2\), et la deuxième équation \(1 = \lambda^3\) est vérifiée. Donc \(E_\lambda(C) = \operatorname{Vect}\big((1, \lambda^2, \lambda)^\top\big)\) : \(E_1 = \operatorname{Vect}\big((1, 1, 1)^\top\big)\), \(E_j = \operatorname{Vect}\big((1, j^2, j)^\top\big)\) et \(E_{j^2} = \operatorname{Vect}\big((1, j, j^2)^\top\big)\), conjugués l'un de l'autre.</p>
    <p><strong>Q3.</strong> \(1 + j + j^2 = 0 = \operatorname{tr} C\) et \(1 \times j \times j^2 = j^3 = 1 = \det C\). Géométriquement, \(C\) est un tiers de tour : la rotation d'angle \(\tfrac{2\pi}{3}\) autour de la droite \(E_1\) (pour une orientation convenable de cet axe) ; c'est la seule droite réelle stable.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Trois endomorphismes en dimension infinie</h3>
  <div class="q"><strong>Q1.</strong> Sur \(E = \mathcal{C}^0(\mathbb{R}, \mathbb{R})\), soit \(\Psi(f)\) la fonction \(x \mapsto \int_0^x f(t)\,\mathrm{d}t\). Vérifier que \(\Psi\) est un endomorphisme de \(E\) et montrer qu'il n'a aucune valeur propre.</div>
  <div class="q"><strong>Q2.</strong> Sur \(E\), soit \(T(f)\) la fonction \(x \mapsto f(-x)\). Calculer \(T \circ T\), puis déterminer les valeurs propres et les sous-espaces propres de \(T\).</div>
  <div class="q"><strong>Q3.</strong> Sur l'espace des suites réelles, soit \(\Delta\) qui à \((u_n)\) associe \((u_{n+1} - u_n)\). Déterminer ses valeurs propres et ses sous-espaces propres.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(f\) continue, \(\Psi(f)\) est la primitive de \(f\) nulle en \(0\) : elle est continue (et même \(\mathcal{C}^1\)), et \(\Psi\) est linéaire par linéarité de l'intégrale. Supposons \(\Psi(f) = \lambda f\).</p>
    <p>Si \(\lambda = 0\), \(\int_0^x f = 0\) pour tout \(x\), et en dérivant, \(f = 0\). Si \(\lambda \neq 0\), \(f = \tfrac{1}{\lambda}\Psi(f)\) est \(\mathcal{C}^1\) et vérifie \(f' = \tfrac{1}{\lambda}f\) avec \(f(0) = \tfrac{1}{\lambda}\Psi(f)(0) = 0\) : \(f = Ce^{x/\lambda}\) avec \(C = f(0) = 0\). Dans tous les cas \(f = 0\) : aucun scalaire n'est valeur propre.</p>
    <p><strong>Q2.</strong> \(T \circ T(f) = f\) : \(T\) est une symétrie, donc si \(T(f) = \lambda f\) avec \(f \neq 0\), alors \(\lambda^2 f = f\) et \(\lambda \in \{-1, 1\}\). \(E_1(T)\) est l'ensemble des fonctions paires, \(E_{-1}(T)\) celui des fonctions impaires ; tous deux sont non réduits à \(\{0\}\) (\(x \mapsto 1\) et \(x \mapsto x\)), donc les valeurs propres sont exactement \(1\) et \(-1\). Leur somme est directe (cours, §3), ce qui redonne qu'une fonction à la fois paire et impaire est nulle.</p>
    <p><strong>Q3.</strong> \(\Delta(u) = \lambda u\) s'écrit \(u_{n+1} = (1 + \lambda)u_n\) pour tout \(n\) : c'est une suite géométrique de raison \(1 + \lambda\), non nulle dès que \(u_0 \neq 0\). Tout réel \(\lambda\) est donc valeur propre, et \(E_\lambda(\Delta)\) est la droite des suites géométriques de raison \(1 + \lambda\), engendrée par \(\big((1 + \lambda)^n\big)_{n}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Des familles libres sans calcul</h3>
  <div class="q"><strong>Q1.</strong> Soit \(a_1, \ldots, a_p\) des réels deux à deux distincts. Montrer que les fonctions \(x \mapsto x^{a_k}\), définies sur \(]0, +\infty[\), forment une famille libre (on pourra utiliser \(\varphi : f \mapsto (x \mapsto xf'(x))\)).</div>
  <div class="q"><strong>Q2.</strong> Soit \(q_1, \ldots, q_p\) des réels deux à deux distincts. Montrer que les suites géométriques \((q_k^{\,n})_{n \in \mathbb{N}}\) forment une famille libre.</div>
  <div class="q"><strong>Q3.</strong> Sur \(\mathbb{R}_n[X]\), soit \(g(P) = (X - 1)P'\). Calculer \(g\big((X - 1)^k\big)\) et en déduire que \(\big(1, X - 1, \ldots, (X - 1)^n\big)\) est une base de \(\mathbb{R}_n[X]\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\varphi\) est un endomorphisme de \(\mathcal{C}^\infty(]0, +\infty[, \mathbb{R})\), et \(\varphi(x \mapsto x^{a}) = (x \mapsto x \cdot a x^{a-1}) = (x \mapsto a\,x^{a})\). Les fonctions \(x \mapsto x^{a_k}\), non nulles, sont des vecteurs propres de \(\varphi\) associés aux valeurs propres \(a_k\), deux à deux distinctes : elles forment une famille libre (cours, §3).</p>
    <p><strong>Q2.</strong> Le décalage \(S : (u_n) \mapsto (u_{n+1})\) envoie \((q_k^{\,n})_n\) sur \((q_k^{\,n+1})_n = q_k\,(q_k^{\,n})_n\). Ces suites, de premier terme \(1\), sont non nulles : ce sont des vecteurs propres de \(S\) associés aux valeurs propres distinctes \(q_k\). La famille est libre.</p>
    <p><strong>Q3.</strong> \(g\) est un endomorphisme de \(\mathbb{R}_n[X]\) (le degré ne monte pas), et \(g\big((X - 1)^k\big)\), qui vaut \((X - 1) \cdot k(X - 1)^{k-1}\), est égal à \(k\,(X - 1)^k\). Les \(n + 1\) polynômes \((X - 1)^k\), \(0 \leq k \leq n\), sont propres pour les valeurs propres distinctes \(0, 1, \ldots, n\) : ils forment une famille libre de \(n + 1\) vecteurs dans un espace de dimension \(n + 1\), donc une base.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Matrices compagnons</h3>
  <div class="statement">Pour \(a, b, c\) réels, on pose \(C = \begin{pmatrix} 0 & 0 & -c \\ 1 & 0 & -b \\ 0 & 1 & -a \end{pmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\chi_C = X^3 + aX^2 + bX + c\). Tout polynôme unitaire de degré 3 est donc un polynôme caractéristique.</div>
  <div class="q"><strong>Q2.</strong> Soit \(\lambda\) une valeur propre (réelle) de \(C\). Montrer que \(\operatorname{rg}(C - \lambda I_3) = 2\) et que \(E_\lambda(C)\) est dirigé par \((\lambda^2 + a\lambda + b,\ \lambda + a,\ 1)^\top\).</div>
  <div class="q"><strong>Q3.</strong> Écrire la matrice compagnon de \(X^3 - 2X^2 - X + 2\) et donner ses éléments propres.</div>
  <div class="q"><strong>Q4.</strong> Que dire de \(\dim E_\lambda(C)\) quand \(\lambda\) est une racine multiple de \(\chi_C\) ? Donner un exemple.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On développe \(\det(XI_3 - C)\) suivant la première ligne \((X, 0, c)\) :</p>
    <div class="formula">$$\begin{aligned} \chi_C &= X\begin{vmatrix} X & b \\ -1 & X + a \end{vmatrix} + c\begin{vmatrix} -1 & X \\ 0 & -1 \end{vmatrix} \\ &= X(X^2 + aX + b) + c. \end{aligned}$$</div>
    <p><strong>Q2.</strong> Dans \(C - \lambda I_3\), le mineur formé des lignes 2 et 3 et des colonnes 1 et 2 vaut \(\begin{vmatrix} 1 & -\lambda \\ 0 & 1 \end{vmatrix} = 1 \neq 0\) : le rang vaut au moins \(2\), et au plus \(2\) puisque \(\lambda\) est valeur propre. Donc \(\dim E_\lambda(C) = 1\). Pour \(X = (x, y, 1)^\top\), le système \((C - \lambda I_3)X = 0\) s'écrit \(-\lambda x - c = 0\), \(x - \lambda y - b = 0\), \(y - \lambda - a = 0\). Les deux dernières équations donnent \(y = \lambda + a\) et \(x = \lambda^2 + a\lambda + b\) ; la première s'écrit alors \(-\chi_C(\lambda) = 0\), vraie.</p>
    <p><strong>Q3.</strong> Ici \(a = -2\), \(b = -1\), \(c = 2\) : \(C = \begin{pmatrix} 0 & 0 & -2 \\ 1 & 0 & 1 \\ 0 & 1 & 2 \end{pmatrix}\), et \(\chi_C = (X - 1)(X + 1)(X - 2)\). La formule de Q2 donne \(E_1 = \operatorname{Vect}\big((-2, -1, 1)^\top\big)\), \(E_{-1} = \operatorname{Vect}\big((2, -3, 1)^\top\big)\), \(E_2 = \operatorname{Vect}\big((-1, 0, 1)^\top\big)\). Contrôle : \(C(-1, 0, 1)^\top = (-2, 0, 2)^\top\).</p>
    <p><strong>Q4.</strong> D'après Q2, \(\dim E_\lambda(C) = 1\) pour <strong>toute</strong> valeur propre. Si \(\lambda\) est racine multiple, \(\dim E_\lambda(C) = 1 \lt m(\lambda)\). Exemple : \(\chi = (X - 1)^3 = X^3 - 3X^2 + 3X - 1\), de matrice compagnon de coefficients \(a = -3\), \(b = 3\), \(c = -1\) : valeur propre triple \(1\), mais sous-espace propre de dimension \(1\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Éléments propres d'une matrice de rang 1</h3>
  <div class="statement">Soit \(u, v \in \mathcal{M}_{n,1}(\mathbb{R})\) deux colonnes non nulles (\(n \geq 2\)) et \(M = u\,v^\top \in \mathcal{M}_n(\mathbb{R})\).</div>
  <p class="exo-part">Partie A — Étude générale</p>
  <div class="q"><strong>A1.</strong> Montrer que \(MX = (v^\top X)\,u\) pour toute colonne \(X\). En déduire que \(\operatorname{Im} M = \operatorname{Vect}(u)\), que \(\operatorname{rg} M = 1\), et que \(\operatorname{Ker} M = \{X : v^\top X = 0\}\) est de dimension \(n - 1\).</div>
  <div class="q"><strong>A2.</strong> En déduire que \(0\) est valeur propre de multiplicité au moins \(n - 1\). Calculer \(Mu\), montrer que \(\operatorname{tr} M = v^\top u\), puis que \(\chi_M = X^{n-1}(X - \operatorname{tr} M)\).</div>
  <div class="q"><strong>A3.</strong> On suppose \(v^\top u \neq 0\). Montrer qu'il existe une base de \(\mathbb{R}^n\) formée de vecteurs propres de \(M\). Que se passe-t-il si \(v^\top u = 0\) ?</div>
  <p class="exo-part">Partie B — Application</p>
  <div class="q"><strong>B1.</strong> Soit \(J_n\) la matrice dont tous les coefficients valent \(1\), et \(A = aI_n + bJ_n\) (\(a, b\) réels, \(b \neq 0\)). En remarquant que \(J_n = e\,e^\top\) avec \(e = (1, \ldots, 1)^\top\), donner les valeurs propres et les sous-espaces propres de \(A\). Application : \(n = 3\), \(a = 2\), \(b = 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(MX = u\,(v^\top X) = (v^\top X)\,u\), car \(v^\top X\) est un nombre. Donc \(\operatorname{Im} M \subset \operatorname{Vect}(u)\) ; comme \(v \neq 0\), il existe \(X\) avec \(v^\top X \neq 0\) (par exemple \(X = v\)), d'où \(\operatorname{Im} M = \operatorname{Vect}(u)\) et \(\operatorname{rg} M = 1\). Comme \(u \neq 0\), \(MX = 0\) équivaut à \(v^\top X = 0\), et le théorème du rang donne \(\dim\operatorname{Ker} M = n - 1\).</p>
    <p><strong>A2.</strong> \(E_0(M) = \operatorname{Ker} M\) est de dimension \(n - 1 \geq 1\) : \(0\) est valeur propre, et \(m(0) \geq \dim E_0(M) = n - 1\) (cours, §6). Ensuite \(Mu = (v^\top u)\,u\), et \(\operatorname{tr}(uv^\top) = \sum_i u_iv_i = v^\top u\). Comme \(X^{n-1}\) divise \(\chi_M\), unitaire de degré \(n\), on a \(\chi_M = X^{n-1}(X - \mu)\) ; le coefficient de \(X^{n-1}\), égal à \(-\mu\), vaut aussi \(-\operatorname{tr} M\). Donc \(\chi_M = X^{n-1}(X - v^\top u)\) et \(\operatorname{Sp}(M) = \{0, v^\top u\}\).</p>
    <p><strong>A3.</strong> Si \(v^\top u \neq 0\), \(u\) est vecteur propre pour \(v^\top u \neq 0\), et \(u \notin \operatorname{Ker} M\). La somme \(E_0(M) \oplus \operatorname{Vect}(u)\) est directe (sous-espaces propres pour des valeurs propres distinctes) et de dimension \((n - 1) + 1 = n\) : en recollant une base de \(\operatorname{Ker} M\) et \(u\), on obtient une base de vecteurs propres (au chapitre suivant : \(M\) est diagonalisable). Si \(v^\top u = 0\), \(\chi_M = X^n\) : \(0\) est la seule valeur propre, et \(E_0(M)\), de dimension \(n - 1 \lt n\), ne contient pas de base. D'ailleurs \(M^2 = u\,(v^\top u)\,v^\top = 0\).</p>
    <p><strong>B1.</strong> \(J_n = e\,e^\top\) avec \(e^\top e = n \neq 0\) : d'après la partie A, \(\operatorname{Sp}(J_n) = \{0, n\}\), avec \(E_n(J_n) = \operatorname{Vect}(e)\) et \(E_0(J_n)\) l'hyperplan \(x_1 + \cdots + x_n = 0\). Si \(J_nX = \mu X\), alors \(AX = (a + b\mu)X\) : \(A\) a les mêmes vecteurs propres, et ses valeurs propres sont \(a + bn\) (droite \(\operatorname{Vect}(e)\)) et \(a\) (hyperplan \(x_1 + \cdots + x_n = 0\), multiplicité \(n - 1\)). Pour \(n = 3\), \(a = 2\), \(b = 1\) : valeurs propres \(5\), de vecteur propre \((1, 1, 1)^\top\), et \(2\), double, de sous-espace propre le plan \(x + y + z = 0\).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un endomorphisme d'espace de polynômes et ses polynômes propres</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : éléments propres, polynôme caractéristique, dimension finie et infinie).</div>
  <div class="statement">Pour \(P \in \mathbb{R}[X]\), on pose \(\varphi(P) = X(X - 1)P'' + (2X - 1)P'\). On fixe \(n \geq 1\).</div>
  <p class="exo-part">Partie A — Spectre de \(\varphi\) sur \(\mathbb{R}_n[X]\)</p>
  <div class="q"><strong>A1.</strong> Montrer que \(\varphi\) induit un endomorphisme de \(\mathbb{R}_n[X]\), encore noté \(\varphi\).</div>
  <div class="q"><strong>A2.</strong> Calculer \(\varphi(X^k)\) pour \(0 \leq k \leq n\). En déduire que la matrice de \(\varphi\) dans la base \((1, X, \ldots, X^n)\) est triangulaire supérieure, puis \(\chi_\varphi\).</div>
  <div class="q"><strong>A3.</strong> Montrer que \(\varphi\) a \(n + 1\) valeurs propres distinctes \(\lambda_k = k(k + 1)\), \(0 \leq k \leq n\), et que chaque sous-espace propre est une droite.</div>
  <div class="q"><strong>A4.</strong> Soit \(P_k\) un vecteur propre associé à \(\lambda_k\). Montrer que \(\deg P_k = k\) (comparer les termes de plus haut degré de \(\varphi(P_k)\) et de \(\lambda_kP_k\)).</div>
  <p class="exo-part">Partie B — Le cas \(n = 2\)</p>
  <div class="q"><strong>B1.</strong> Déterminer les polynômes propres unitaires \(P_0\), \(P_1\), \(P_2\).</div>
  <div class="q"><strong>B2.</strong> Justifier sans calcul que \((P_0, P_1, P_2)\) est une base de \(\mathbb{R}_2[X]\) et donner la matrice de \(\varphi\) dans cette base.</div>
  <div class="q"><strong>B3.</strong> Déterminer tous les \(P \in \mathbb{R}_2[X]\) tels que \(\varphi(P) = P_2\).</div>
  <p class="exo-part">Partie C — Sur \(\mathbb{R}[X]\) tout entier</p>
  <div class="q"><strong>C1.</strong> Montrer que les valeurs propres de \(\varphi\), vu comme endomorphisme de \(\mathbb{R}[X]\), sont exactement les entiers \(k(k + 1)\), \(k \in \mathbb{N}\), et que chaque sous-espace propre est une droite engendrée par un polynôme de degré \(k\).</div>
  <div class="q"><strong>C2.</strong> Vérifier que \(\varphi(P) = \big(X(X - 1)P'\big)'\). En déduire que, sur \(\mathbb{R}_n[X]\), l'image de \(\varphi\) est l'hyperplan \(H = \big\{Q \in \mathbb{R}_n[X] : \int_0^1 Q(t)\,\mathrm{d}t = 0\big\}\), puis que \(\int_0^1 P_k(t)\,\mathrm{d}t = 0\) pour \(k \geq 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(\varphi\) est linéaire (dérivation et multiplication par un polynôme le sont). Si \(\deg P \leq n\), \(X(X - 1)P''\) et \((2X - 1)P'\) sont de degré au plus \(n\) : \(\varphi(\mathbb{R}_n[X]) \subset \mathbb{R}_n[X]\).</p>
    <p><strong>A2.</strong> Pour \(k \geq 0\) (les termes en \(k(k-1)\) ou \(k\) étant nuls quand \(k\) vaut \(0\) ou \(1\)) :</p>
    <div class="formula">$$\begin{aligned} \varphi(X^k) &= k(k - 1)(X^k - X^{k-1}) + k(2X^k - X^{k-1}) \\ &= k(k + 1)X^k - k^2X^{k-1}. \end{aligned}$$</div>
    <p>La colonne de \(X^k\) n'a de coefficients que sur les lignes de \(X^k\) et \(X^{k-1}\) : la matrice est triangulaire supérieure (et même bidiagonale), de diagonale \(\lambda_k = k(k + 1)\). Donc \(\chi_\varphi = \prod_{k=0}^{n}\big(X - k(k + 1)\big)\).</p>
    <p><strong>A3.</strong> Les valeurs propres sont les racines de \(\chi_\varphi\), soit les \(\lambda_k\) ; la suite \(k(k + 1)\) est strictement croissante, donc elles sont deux à deux distinctes. Chacune est simple, et \(1 \leq \dim E_{\lambda_k} \leq m(\lambda_k) = 1\) : chaque sous-espace propre est une droite.</p>
    <p><strong>A4.</strong> Soit \(d = \deg P_k\) et \(c \neq 0\) son coefficient dominant. D'après A2, \(\varphi(P_k)\) a pour terme de plus haut degré \(d(d + 1)c\,X^d\), les autres étant de degré \(\lt d\). L'égalité \(\varphi(P_k) = \lambda_kP_k\) donne, en \(X^d\), \(d(d + 1)c = k(k + 1)c\), donc \(d(d + 1) = k(k + 1)\) et \(d = k\) (stricte croissance).</p>
    <p><strong>B1.</strong> \(P_0 = 1\) (\(\varphi(1) = 0\)). Pour \(P_1 = X + \alpha\) : \(\varphi(P_1) = 2X - 1\) doit valoir \(2X + 2\alpha\), d'où \(\alpha = -\tfrac{1}{2}\) et \(P_1 = X - \tfrac{1}{2}\). Pour \(P_2 = X^2 + \beta X + \gamma\) : \(\varphi(P_2) = 6X^2 - 4X + \beta(2X - 1)\) doit valoir \(6X^2 + 6\beta X + 6\gamma\), d'où \(2\beta - 4 = 6\beta\), soit \(\beta = -1\), puis \(-\beta = 6\gamma\), soit \(\gamma = \tfrac{1}{6}\) : \(P_2 = X^2 - X + \tfrac{1}{6}\).</p>
    <p><strong>B2.</strong> Ce sont trois vecteurs propres associés aux valeurs propres distinctes \(0, 2, 6\) : la famille est libre (cours, §3), et elle a \(3 = \dim\mathbb{R}_2[X]\) vecteurs. Dans cette base, la matrice de \(\varphi\) est \(\operatorname{diag}(0, 2, 6)\).</p>
    <p><strong>B3.</strong> Écrivons \(P = \alpha P_0 + \beta P_1 + \gamma P_2\). Alors \(\varphi(P) = 2\beta P_1 + 6\gamma P_2\), qui vaut \(P_2\) si et seulement si \(\beta = 0\) et \(\gamma = \tfrac{1}{6}\). Les solutions sont les \(P = \tfrac{1}{6}P_2 + \alpha\), \(\alpha \in \mathbb{R}\) : une solution particulière plus le noyau, formé des constantes.</p>
    <p><strong>C1.</strong> Chaque \(P_k\) (construit dans \(\mathbb{R}_k[X]\)) vérifie \(\varphi(P_k) = \lambda_kP_k\) avec \(P_k \neq 0\) : les \(\lambda_k\) sont valeurs propres de \(\varphi\) sur \(\mathbb{R}[X]\). Réciproquement, si \(\varphi(P) = \lambda P\) avec \(P \neq 0\) de degré \(d\), l'argument de A4 donne \(\lambda = d(d + 1)\). Enfin, si \(\varphi(P) = \lambda_kP\) avec \(P \neq 0\), alors \(\deg P = k\), donc \(P\) appartient au sous-espace propre de \(\varphi\) restreint à \(\mathbb{R}_k[X]\), qui est la droite \(\operatorname{Vect}(P_k)\) (A3) : \(E_{\lambda_k}(\varphi) = \operatorname{Vect}(P_k)\).</p>
    <p><strong>C2.</strong> En dérivant le produit, \(\big(X(X - 1)P'\big)'\) vaut \((2X - 1)P' + X(X - 1)P''\) : c'est \(\varphi(P)\). Donc</p>
    <div class="formula">$$\int_0^1 \varphi(P)(t)\,\mathrm{d}t = \Big[t(t - 1)P'(t)\Big]_0^1 = 0,$$</div>
    <p>et \(\operatorname{Im}\varphi \subset H\). Or \(\operatorname{Ker}\varphi = E_0 = \operatorname{Vect}(1)\) est une droite : par le théorème du rang, \(\operatorname{rg}\varphi = n\). D'autre part \(H\) est le noyau de la forme linéaire non nulle \(Q \mapsto \int_0^1 Q\) (elle vaut \(1\) en \(Q = 1\)), donc un hyperplan, de dimension \(n\). D'où \(\operatorname{Im}\varphi = H\). Pour \(k \geq 1\), \(P_k = \varphi\big(\tfrac{1}{\lambda_k}P_k\big)\) est dans l'image : \(\int_0^1 P_k = 0\). Contrôle : \(\int_0^1 (t - \tfrac{1}{2})\,\mathrm{d}t = 0\) et \(\tfrac{1}{3} - \tfrac{1}{2} + \tfrac{1}{6} = 0\).</p>
