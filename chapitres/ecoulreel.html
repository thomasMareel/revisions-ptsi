  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Pompe d'alimentation d'une citerne d'altitude</h3>
  <div class="statement">Un refuge de montagne s'alimente en pompant l'eau d'un lac vers une citerne. Les deux surfaces libres sont à la pression atmosphérique ; la surface de la citerne est \(H = 42\ \text{m}\) plus haut que celle du lac (on néglige leurs variations). La conduite en acier a pour diamètre \(D = 50\ \text{mm}\), pour longueur totale \(L = 380\ \text{m}\) et pour rugosité \(\varepsilon = 0{,}05\ \text{mm}\). Singularités : crépine et clapet à l'aspiration (\(K = 2{,}0\)), six coudes (\(K = 0{,}40\) chacun), une vanne ouverte (\(K = 0{,}20\)), débouché dans la citerne (\(K = 1{,}0\)). Débit souhaité : \(D_v = 3{,}0\ \text{L/s}\). Eau froide : \(\rho = 1{,}0\times10^{3}\ \text{kg/m}^3\), \(\nu = 1{,}3\times10^{-6}\ \text{m}^2/\text{s}\). Rendement global du groupe motopompe : 65 %. Valeurs de \(\lambda\) (calculées par la formule de Colebrook) :
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0;text-align:center">
      <tr style="background:var(--paper-dark)"><th style="padding:.3rem;border:1px solid var(--grid)">\(\varepsilon/D\) ↓ · Re →</th><th style="padding:.3rem;border:1px solid var(--grid)">2·10⁴</th><th style="padding:.3rem;border:1px solid var(--grid)">4·10⁴</th><th style="padding:.3rem;border:1px solid var(--grid)">6·10⁴</th><th style="padding:.3rem;border:1px solid var(--grid)">10⁵</th></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">0 (lisse)</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0259</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0220</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0201</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0180</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">8·10⁻⁴</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0276</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0243</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0229</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0215</td></tr>
      <tr><td style="padding:.3rem;border:1px solid var(--grid)">1·10⁻³</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0279</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0248</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0235</td><td style="padding:.3rem;border:1px solid var(--grid)">0,0222</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse débitante, le nombre de Reynolds et la rugosité relative. Quel est le régime ?</div>
  <div class="q"><strong>Q2.</strong> En déduire \(\lambda\). Comparer à la valeur pour une conduite lisse.</div>
  <div class="q"><strong>Q3.</strong> Calculer les pertes de charge régulières et singulières (en mètres d'eau). Commenter leurs poids respectifs.</div>
  <div class="q"><strong>Q4.</strong> Par le théorème de Bernoulli généralisé entre les deux surfaces libres, déterminer la hauteur manométrique \(h_p\) de la pompe.</div>
  <div class="q"><strong>Q5.</strong> Calculer la puissance hydraulique et la puissance électrique absorbée. Quelle énergie faut-il pour remplir une citerne de 10 m³ ?</div>
  <div class="q"><strong>Q6.</strong> On envisage une conduite de diamètre \(63\ \text{mm}\) (même rugosité). Reprendre les calculs et conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v = \dfrac{4D_v}{\pi D^2} \approx 1{,}53\ \text{m/s}\). \(\mathrm{Re} = vD/\nu \approx 5{,}9\times10^{4}\) : turbulent. \(\varepsilon/D = 0{,}05/50 = 1{,}0\times10^{-3}\).</p>
    <p><strong>Q2.</strong> Ligne \(\varepsilon/D = 10^{-3}\), colonne \(\mathrm{Re}\approx6\times10^{4}\) : \(\lambda \approx 0{,}0235\). Conduite lisse : \(\lambda \approx 0{,}020\). La rugosité augmente les pertes régulières d'environ 17 %.</p>
    <p><strong>Q3.</strong> \(v^2/(2g) = 1{,}53^2/19{,}6 \approx 0{,}119\ \text{m}\) ; \(L/D = 7600\). Pertes régulières : \(\Delta h_{\text{reg}} = 0{,}0235\times7600\times0{,}119 \approx 21{,}3\ \text{m}\). Singulières : \(\sum K = 2{,}0 + 6\times0{,}40 + 0{,}20 + 1{,}0 = 5{,}6\), \(\Delta h_{\text{sing}} = 5{,}6\times0{,}119 \approx 0{,}67\ \text{m}\). Pour une conduite aussi longue (7600 diamètres), les pertes régulières dominent largement (97 % des pertes).</p>
    <p><strong>Q4.</strong> Surfaces libres : même pression, vitesses nulles, d'où \(0 + h_p = H + \Delta h_{\text{reg}} + \Delta h_{\text{sing}}\) (le débouché \(K = 1\) rend compte de l'énergie cinétique perdue dans la citerne). \(h_p = 42 + 21{,}3 + 0{,}67 \approx 64\ \text{m}\).</p>
    <p><strong>Q5.</strong> \(\mathcal{P}_h = \rho g D_v h_p \approx 1{,}9\ \text{kW}\) ; \(\mathcal{P}_{\text{élec}} = 1{,}88/0{,}65 \approx 2{,}9\ \text{kW}\). Remplissage : \(10/3{,}0\times10^{-3} \approx 3{,}3\times10^{3}\ \text{s}\) (56 min), énergie \(\approx 2{,}9\ \text{kW}\times0{,}93\ \text{h} \approx 2{,}7\ \text{kWh}\).</p>
    <p><strong>Q6.</strong> \(D = 63\ \text{mm}\) : \(v \approx 0{,}96\ \text{m/s}\), \(\mathrm{Re} \approx 4{,}7\times10^{4}\), \(\varepsilon/D \approx 8\times10^{-4}\) ; interpolation dans la table : \(\lambda \approx 0{,}0238\). \(v^2/(2g) \approx 0{,}047\ \text{m}\), \(L/D \approx 6030\) : \(\Delta h_{\text{reg}} \approx 6{,}8\ \text{m}\), \(\Delta h_{\text{sing}} \approx 0{,}26\ \text{m}\), \(h_p \approx 49\ \text{m}\), \(\mathcal{P}_{\text{élec}} \approx 2{,}2\ \text{kW}\). Les pertes régulières sont divisées par 3, conformément à \(\Delta h_{\text{reg}} \propto \lambda/D^5\) (\((63/50)^5 \approx 3{,}2\)), et la consommation baisse de 23 %. Le surcoût de la conduite est vite amorti si la pompe fonctionne souvent : c'est le compromis classique du dimensionnement.</p>
  </div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Transport de pétrole brut par oléoduc</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>écoulements visqueux, pertes de charge et bilans</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un oléoduc en acier, de diamètre intérieur \(D = 0{,}50\ \text{m}\) et de longueur \(L = 640\ \text{km}\), transporte un pétrole brut lourd avec un débit massique \(D_m = 250\ \text{kg/s}\). Le terminal d'arrivée est \(150\ \text{m}\) plus haut que le point de départ. Données : \(\rho = 860\ \text{kg/m}^3\) ; viscosité dynamique \(\eta = 0{,}40\ \text{Pa·s}\) à 15 °C et \(\eta' = 0{,}040\ \text{Pa·s}\) à 60 °C ; capacité thermique massique \(c = 2{,}0\ \text{kJ·kg}^{-1}\text{·K}^{-1}\) ; \(g = 9{,}81\ \text{m/s}^2\). Des stations de pompage (rendement 0,80) réparties le long du tracé portent la pression à 70 bar au plus ; en entrée de chaque station, elle ne doit pas descendre sous 5 bar. En régime turbulent, on admet la conduite hydrauliquement lisse et la formule de Blasius \(\lambda = 0{,}316\,\mathrm{Re}^{-1/4}\). Sauf mention contraire, on néglige les variations de température le long du tracé.
  </div>

  <p class="exo-part">Partie A — Régime d'écoulement</p>
  <div class="q"><strong>A1.</strong> Calculer le débit volumique, la vitesse débitante et le nombre de Reynolds à 15 °C. Quel est le régime ?</div>
  <div class="q"><strong>A2.</strong> Rappeler le profil de vitesse correspondant et la vitesse sur l'axe. Combien de temps le brut met-il pour parcourir l'oléoduc ?</div>

  <p class="exo-part">Partie B — Pertes de charge et stations de pompage</p>
  <div class="q"><strong>B1.</strong> À partir de la loi de Poiseuille, exprimer la chute de pression par unité de longueur et la calculer. Retrouver la valeur \(\lambda = 64/\mathrm{Re}\) du coefficient de perte de charge.</div>
  <div class="q"><strong>B2.</strong> Calculer la perte de charge totale. En raisonnant comme si le tracé était horizontal, déterminer l'espacement maximal entre deux stations et le nombre minimal de stations.</div>

  <p class="exo-part">Partie C — Bilan d'énergie mécanique</p>
  <div class="q"><strong>C1.</strong> Écrire le bilan d'énergie mécanique de l'écoulement entre la surface du bac de départ et celle du bac d'arrivée (pression atmosphérique, vitesses négligeables). En déduire la puissance indiquée totale des pompes, puis la puissance électrique.</div>
  <div class="q"><strong>C2.</strong> Que devient la puissance dissipée par viscosité ? Évaluer l'échauffement du brut si aucun transfert thermique ne se produisait avec le sol. Commenter l'hypothèse de température constante.</div>

  <p class="exo-part">Partie D — Faut-il réchauffer le brut ?</p>
  <div class="q"><strong>D1.</strong> Le brut est réchauffé à 60 °C au départ (et l'on suppose qu'il le reste). Calculer le nouveau nombre de Reynolds.</div>
  <div class="q"><strong>D2.</strong> Calculer le nouveau coefficient \(\lambda\) et le rapport des pertes de charge. Pourquoi le gain est-il bien inférieur au facteur 10 sur la viscosité ? Combien de stations faut-il désormais ?</div>
  <div class="q"><strong>D3.</strong> Comparer l'économie de puissance électrique de pompage à la puissance thermique nécessaire pour chauffer le brut de 15 °C à 60 °C. Conclure.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(D_v = D_m/\rho \approx 0{,}291\ \text{m}^3/\text{s}\) (environ 25 000 m³ par jour). Section \(S = \pi D^2/4 \approx 0{,}196\ \text{m}^2\), \(v_d = D_v/S \approx 1{,}48\ \text{m/s}\). \(\mathrm{Re} = \rho v_d D/\eta \approx 1{,}6\times10^{3}\) : laminaire, mais assez proche du seuil (une hausse de débit de 25 % suffirait à atteindre la transition).</p>
    <p><strong>A2.</strong> Profil de Poiseuille parabolique, \(v(r) = v_{\max}(1 - r^2/R^2)\) avec \(v_{\max} = 2v_d \approx 3{,}0\ \text{m/s}\). Durée du trajet à la vitesse débitante : \(640\times10^{3}/1{,}48 \approx 4{,}3\times10^{5}\ \text{s}\), soit 5 jours environ.</p>
    <p><strong>B1.</strong> Poiseuille : \(\Delta P = \dfrac{8\eta L}{\pi R^4}D_v = \dfrac{128\,\eta L}{\pi D^4}D_v\), d'où \(\dfrac{\Delta P}{L} = \dfrac{128\times0{,}40\times0{,}291}{\pi\times0{,}50^4} \approx 76\ \text{Pa/m}\), soit 0,76 bar/km. En identifiant à \(\lambda\,\dfrac{1}{D}\,\dfrac{\rho v_d^2}{2}\) avec \(D_v = \pi D^2 v_d/4\) : \(\lambda = \dfrac{64\,\eta}{\rho v_d D} = \dfrac{64}{\mathrm{Re}} \approx 0{,}040\) (et l'on vérifie \(0{,}040\times\dfrac{860\times1{,}48^2}{2\times0{,}50} \approx 76\ \text{Pa/m}\)).</p>
    <p><strong>B2.</strong> \(\Delta P_{\text{tot}} = 76\times640\times10^{3} \approx 4{,}9\times10^{7}\ \text{Pa}\), près de 490 bar. Chaque tronçon dispose de \(70 - 5 = 65\ \text{bar}\) : longueur maximale \(65\times10^{5}/76 \approx 86\ \text{km}\). \(640/86 \approx 7{,}5\) : il faut <strong>8 stations</strong> (y compris celle du départ). (La dénivellation ajoute \(\rho g\Delta z \approx 13\ \text{bar}\) au total, ce qui ne change pas ce résultat.)</p>
    <p><strong>C1.</strong> Entre les deux surfaces libres : \(\mathcal{P}_i + \mathcal{P}_v = D_m\,g\,\Delta z\), avec \(\mathcal{P}_v = -D_v\,\Delta P_{\text{tot}}\) (pertes régulières seules). D'où</p>
    <div class="formula">$$\mathcal{P}_i = D_m g\,\Delta z + D_v\,\Delta P_{\text{tot}} \approx 0{,}37 + 14{,}1 \approx 14{,}5\ \text{MW}$$</div>
    <p>Puissance électrique : \(14{,}5/0{,}80 \approx 18\ \text{MW}\). L'essentiel sert à vaincre la viscosité, très peu à élever le brut.</p>
    <p><strong>C2.</strong> Les 14,1 MW dissipés deviennent de l'énergie interne du brut. Par kilogramme : \(\Delta P_{\text{tot}}/\rho \approx 56\ \text{kJ/kg}\) ; sans pertes thermiques, \(\Delta T = 56\times10^{3}/(2{,}0\times10^{3}) \approx 28\ \text{K}\). En réalité la chaleur s'évacue vers le sol, mais cet échauffement visqueux n'est pas négligeable : il abaisse la viscosité le long du tracé, et l'hypothèse « 15 °C partout » surestime un peu les pertes.</p>
    <p><strong>D1.</strong> \(\mathrm{Re}' = \mathrm{Re}\times\eta/\eta' \approx 1{,}6\times10^{4}\) : l'écoulement devient turbulent.</p>
    <p><strong>D2.</strong> Blasius : \(\lambda' = 0{,}316\times(1{,}6\times10^{4})^{-1/4} \approx 0{,}028\). À débit égal, les pertes sont proportionnelles à \(\lambda\) : rapport \(0{,}028/0{,}040 \approx 0{,}70\). Si l'écoulement était resté laminaire, les pertes auraient été divisées par 10 (\(\lambda = 64/\mathrm{Re} \propto \eta\)) ; mais la turbulence dissipe beaucoup plus d'énergie, et \(\lambda\) ne décroît que comme \(\mathrm{Re}^{-1/4}\). Nouvelle chute : \(53\ \text{Pa/m}\), \(\Delta P'_{\text{tot}} \approx 340\ \text{bar}\) ; tronçons de \(65\times10^{5}/53 \approx 123\ \text{km}\), donc \(640/123 \approx 5{,}2\) : <strong>6 stations</strong>.</p>
    <p><strong>D3.</strong> Puissance de pompage dissipée : \(D_v\,\Delta P'_{\text{tot}} \approx 9{,}9\ \text{MW}\) au lieu de 14,1 MW, soit une économie de 4,2 MW hydrauliques, ou \(4{,}2/0{,}80 \approx 5{,}3\ \text{MW}\) électriques. Chauffage : \(D_m c\,\Delta T \approx 22{,}5\ \text{MW}\) (avec \(\Delta T = 45\ \text{K}\)), quatre fois plus. Et il faudrait de plus compenser les pertes thermiques vers le sol tout au long du tracé. Le réchauffage n'est pas rentable ici ; il ne se justifie que pour des bruts beaucoup plus visqueux (ou qui figeraient à température ambiante), avec une conduite calorifugée et une chaleur bon marché.</p>
  </div>
</div>
