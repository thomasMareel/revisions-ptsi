  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Partie 1.5 « Énergétique des fluides en écoulement dans une conduite » du programme de PT, côté mécanique : viscosité, relation de Bernoulli et pertes de charge. Les principes de la thermodynamique pour un écoulement (travail indiqué, plusieurs entrées et sorties) sont traités dans « Systèmes ouverts et thermodynamique industrielle ». Les équations d'Euler et de Navier-Stokes sont hors programme.</div>

<div class="course-section">
  <div class="sec-num">§1 · VISCOSITÉ</div>
  <h2>Forces de viscosité dans un écoulement de cisaillement</h2>
  <div class="intro">Dans un fluide réel, deux couches voisines qui glissent l'une sur l'autre échangent une force tangentielle : la plus rapide entraîne la plus lente, la plus lente freine la plus rapide. Cette friction interne, la viscosité, explique qu'il faille « pousser » un fluide pour le faire circuler dans un tuyau, et que son énergie mécanique se dégrade peu à peu en chaleur.</div>

  <h3>Écoulement de cisaillement simple</h3>
  <div class="def-box">
    <strong>Cisaillement simple.</strong> Un écoulement est de cisaillement simple lorsque son champ de vitesse s'écrit \(\vec v = v_x(y,t)\,\vec e_x\) : le fluide est formé de couches planes \(y = \text{cte}\) qui glissent parallèlement à \(\vec e_x\), chacune avec sa propre vitesse. La dérivée \(\partial v_x/\partial y\) (en s⁻¹) est le <strong>taux de cisaillement</strong>.
  </div>
  <div class="prop-box">
    <strong>Loi de Newton (fluide newtonien).</strong> À travers un élément de surface \(\mathrm{d}S\) du plan \(y = \text{cte}\), le fluide situé du côté des \(y\) croissants exerce sur le fluide situé du côté des \(y\) décroissants la force tangentielle
    $$\mathrm{d}\vec F = \eta\,\frac{\partial v_x}{\partial y}\,\mathrm{d}S\;\vec e_x$$
    Par la loi des actions réciproques, le fluide du dessous exerce \(-\mathrm{d}\vec F\) sur celui du dessus. La <strong>contrainte tangentielle</strong> (force surfacique, en Pa) vaut \(\tau = \eta\,\partial v_x/\partial y\).
  </div>
  <p>Contrôle du signe : si \(\partial v_x/\partial y \gt 0\), la couche du dessus est plus rapide ; elle doit tirer la couche du dessous vers les \(x\) croissants, ce que donne bien la formule.</p>

  <h3>Viscosités dynamique et cinématique</h3>
  <div class="def-box">
    \(\eta\) est la <strong>viscosité dynamique</strong>, en Pa·s (unité parfois appelée poiseuille, Pl). La <strong>viscosité cinématique</strong> est
    $$\nu = \frac{\eta}{\rho}\qquad(\text{en m}^2\cdot\text{s}^{-1})$$
    C'est \(\nu\), plus que \(\eta\), qui gouverne la dynamique d'un écoulement (voir le nombre de Reynolds).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid);text-align:left">Fluide (≈ 20 °C)</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">\(\eta\) (Pa·s)</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">\(\nu\) (m²/s)</th></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Air</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">1,8·10⁻⁵</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">1,5·10⁻⁵</td></tr>

    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Sang (37 °C)</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">≈ 3 à 4·10⁻³</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">≈ 3·10⁻⁶</td></tr>

    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Miel</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">≈ 10</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">≈ 7·10⁻³</td></tr>
  </table></div>
  <div class="notice">
    <strong>Comparer ce qui est comparable.</strong> L'air est environ 50 fois moins visqueux que l'eau en \(\eta\), mais 15 fois <em>plus</em> en \(\nu\) : à taille et vitesse égales, un écoulement d'air est plus « visqueux » qu'un écoulement d'eau. La viscosité d'un liquide <strong>diminue</strong> fortement quand la température augmente (huile froide pâteuse) ; celle d'un gaz <strong>augmente</strong> avec \(T\).
  </div>

  <h3>Condition d'adhérence</h3>
  <div class="prop-box">
    <strong>Non-glissement.</strong> Au contact d'une paroi solide, un fluide visqueux possède la vitesse de la paroi : la vitesse relative fluide/paroi est nulle, composante normale <em>et</em> composante tangentielle.
  </div>

  <h3>Sens physique : diffusion de la quantité de mouvement</h3>
  <p>La viscosité transporte la quantité de mouvement \(p_x\) des couches rapides vers les couches lentes, <strong>perpendiculairement</strong> à l'écoulement, de même que la conduction transporte l'énergie des zones chaudes vers les zones froides. Le théorème de la résultante cinétique appliqué à la tranche de fluide comprise entre \(y\) et \(y+\mathrm{d}y\) (aire \(S\), pas de gradient de pression selon \(x\)) donne :</p>
  <div class="formula">$$\rho\,S\,\mathrm{d}y\,\frac{\partial v_x}{\partial t} = \eta S\left[\frac{\partial v_x}{\partial y}(y+\mathrm{d}y)-\frac{\partial v_x}{\partial y}(y)\right]$$</div>
  <div class="formula">$$\text{soit}\qquad \frac{\partial v_x}{\partial t} = \nu\,\frac{\partial^2 v_x}{\partial y^2}$$</div>
  <p>C'est une équation de diffusion : \(\nu\) est le <strong>coefficient de diffusion de la quantité de mouvement</strong>, et la viscosité « transmet » un mouvement sur une distance \(L\) en une durée \(\tau_\nu \sim L^2/\nu\).</p>
  <div class="prop-box">
    <strong>Équivalent volumique.</strong> En cisaillement simple, les forces de viscosité subies par une particule de fluide de volume \(\mathrm{d}V\) se ramènent à
    $$\mathrm{d}\vec F_{\text{visc}} = \eta\,\frac{\partial^2 v_x}{\partial y^2}\,\mathrm{d}V\;\vec e_x$$
    Pour un écoulement incompressible quelconque, on admet la généralisation \(\vec f_{\text{visc}} = \eta\,\Delta\vec v\) (force par unité de volume).
  </div>
  <p><strong>Dissipation.</strong> Les forces de viscosité sont des forces intérieures de puissance totale négative : elles convertissent irréversiblement de l'énergie mécanique en énergie interne (création d'entropie). En cisaillement simple, la puissance dissipée par unité de volume vaut \(\eta\,(\partial v_x/\partial y)^2\).</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">On remue une tasse de thé (rayon ≈ 4 cm). En ne comptant que la diffusion visqueuse, en combien de temps la rotation s'amortit-elle ?</span>
    <div class="content"><div class="formula">$$\tau_\nu \sim \frac{L^2}{\nu} = \frac{(4\times10^{-2})^2}{10^{-6}} \approx 1{,}6\times10^{3}\ \text{s}$$</div><p>Soit près d'une demi-heure. En pratique la rotation cesse en une minute environ : la couche limite au fond de la tasse engendre des mouvements secondaires qui accélèrent fortement l'échange de quantité de mouvement. La diffusion seule est un mécanisme lent à l'échelle humaine.</p></div>
  </div>
  <div class="notice">
    <strong>Fluides non newtoniens.</strong> La loi de Newton suppose \(\tau\) proportionnelle au taux de cisaillement. Le sang, les peintures, le ketchup ou une pâte de fécule ne la suivent pas : leur viscosité apparente dépend du cisaillement. Hors programme, mais à savoir reconnaître.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · NOMBRE DE REYNOLDS</div>
  <h2>Nombre de Reynolds : inertie contre viscosité</h2>
  <div class="intro">Un même fluide peut s'écouler en filets réguliers ou en tourbillons désordonnés. Un seul nombre sans dimension permet de prévoir ce comportement : il compare le transport de quantité de mouvement par le mouvement d'ensemble à son transport par la viscosité.</div>

  <div class="def-box">
    <strong>Nombre de Reynolds.</strong> Pour un écoulement de vitesse caractéristique \(V\) et de longueur caractéristique \(L\) :
    $$\mathrm{Re} = \frac{\rho\,V L}{\eta} = \frac{V L}{\nu}\qquad\text{(sans dimension)}$$
  </div>

  <h3>Deux lectures équivalentes</h3>
  <ul>
    <li><strong>Rapport de forces.</strong> La force d'inertie volumique (terme convectif \(\rho(\vec v\cdot\overrightarrow{\mathrm{grad}})\vec v\)) est de l'ordre de \(\rho V^2/L\) ; la force de viscosité volumique \(\eta\Delta\vec v\) est de l'ordre de \(\eta V/L^2\). Leur rapport vaut \(\mathrm{Re}\).</li>
    <li><strong>Rapport de durées.</strong> Durée de diffusion visqueuse sur \(L\) : \(\tau_\nu \sim L^2/\nu\) ; durée de transport par l'écoulement sur \(L\) : \(\tau_c \sim L/V\). Ainsi \(\mathrm{Re} = \tau_\nu/\tau_c\) : à grand Reynolds, la quantité de mouvement est emportée par le courant bien avant d'avoir diffusé.</li>
  </ul>

  <h3>Choix de la longueur caractéristique</h3>
  <p>\(L\) est l'échelle de longueur sur laquelle la vitesse <strong>change notablement</strong> ; c'est la géométrie qui la fixe :</p>
  <ul>
    <li>conduite : le diamètre \(D\), associé à la vitesse débitante \(v_d\) ;</li>
    <li>obstacle (sphère, cylindre, véhicule) : sa dimension transverse au courant, associée à la vitesse du fluide loin de l'obstacle ;</li>
    <li>aile ou plaque : la longueur dans le sens du courant (corde), pour étudier la couche limite.</li>
  </ul>
  <p>Le Reynolds est un ordre de grandeur : un facteur 2 sur \(L\) ne change pas la conclusion, mais les seuils numériques dépendent de la convention adoptée ; il faut toujours préciser laquelle.</p>

  <h3>Similitude</h3>
  <div class="prop-box">
    <strong>Similitude dynamique.</strong> Deux écoulements géométriquement semblables et de même nombre de Reynolds sont semblables : les champs de vitesse adimensionnés (\(\vec v/V\) en fonction de \(\vec r/L\)) coïncident, ainsi que les coefficients de force (\(C_x\)…). Une maquette à l'échelle \(1/k\) doit donc être essayée à la vitesse
    $$V_m = k\,V\,\frac{\nu_m}{\nu}$$
  </div>
  <p>À l'échelle 1/10 dans le même fluide, il faudrait une vitesse dix fois plus grande : on recourt à un fluide de viscosité cinématique plus faible (tunnel hydrodynamique, \(\nu_{\text{eau}}\approx\nu_{\text{air}}/15\)), ou à de l'air comprimé et refroidi.</p>

  <h3>Régimes laminaire et turbulent</h3>
  <p>Expérience de Reynolds (1883) : un filet de colorant injecté dans une conduite reste rectiligne à faible débit, puis ondule et se disperse brutalement dans toute la section lorsque le débit augmente.</p>
  <ul>
    <li><strong>Écoulement laminaire</strong> : lignes de courant régulières, couches qui glissent les unes sur les autres sans se mélanger ; le transport transverse ne se fait que par diffusion.</li>
    <li><strong>Écoulement turbulent</strong> : vitesse fluctuant de façon aléatoire dans l'espace et dans le temps (tourbillons de toutes tailles), mélange intense ; on décrit le champ de vitesse <em>moyenné dans le temps</em>. La dissipation d'énergie est bien plus forte.</li>
  </ul>
  <div class="prop-box">
    <strong>Critère en conduite circulaire</strong> (Re construit sur \(D\) et \(v_d\)) :
    <ul style="margin:.4rem 0">
      <li>\(\mathrm{Re} \lesssim 2000\) : écoulement laminaire ;</li>
      <li>\(\mathrm{Re} \gtrsim 3000\) à \(4000\) : écoulement turbulent ;</li>
      <li>entre les deux : régime de transition intermittent (bouffées turbulentes).</li>
    </ul>
    Le seuil dépend de la géométrie et du niveau de perturbation à l'entrée.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Reynolds</th><th style="padding:.35rem .5rem;border:1px solid var(--grid);text-align:left">Comportement</th><th style="padding:.35rem .5rem;border:1px solid var(--grid);text-align:left">Exemples</th></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">\(\mathrm{Re}\ll 1\)</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Écoulement rampant : viscosité dominante, traînée proportionnelle à \(V\)</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">micro-organismes, sédimentation de fines particules, lubrification</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">1 à 10³</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Laminaire, sillages organisés</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">petits tuyaux à faible débit, gouttes</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">\(\mathrm{Re}\gg 1\)</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Inertie dominante hors des couches limites, turbulence au-delà d'un seuil</td><td style="padding:.3rem .5rem;border:1px solid var(--grid)">réseaux d'eau, véhicules, atmosphère</td></tr>
  </table></div>
  <div class="notice">
    <strong>Laminaire ≠ stationnaire.</strong> « Laminaire » ou « turbulent » décrit la <em>structure</em> de l'écoulement ; « stationnaire » décrit sa dépendance en \(t\) en un point fixe. Un sillage où des tourbillons se détachent périodiquement est laminaire mais instationnaire ; une conduite turbulente alimentée à débit constant est stationnaire <em>en moyenne</em>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Régime de l'eau dans un tuyau domestique (D = 16 mm, v = 1 m/s) ? Et pour une bactérie de 2 µm nageant à 20 µm/s ?</span>
    <div class="content"><p>Tuyau : \(\mathrm{Re} = vD/\nu = 1\times0{,}016/10^{-6} \approx 1{,}6\times10^{4}\) : turbulent, le mélange transverse y est intense. Bactérie : \(\mathrm{Re} = \dfrac{20\times10^{-6}\times2\times10^{-6}}{10^{-6}}\), soit \(\mathrm{Re} \approx 4\times10^{-5}\) : aucune inertie, elle s'arrête quasi instantanément (sur moins d'un dixième de nanomètre) dès qu'elle cesse de nager.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ÉCOULEMENT EN CONDUITE</div>
  <h2>Conduite cylindrique : écoulement de Poiseuille et modèle unidimensionnel</h2>
  <div class="intro">Dans une conduite, il n'y a pas d'« extérieur » à la couche limite : les effets visqueux finissent par occuper toute la section. En régime laminaire, le profil de vitesse se calcule exactement ; en régime turbulent, on raisonne sur des grandeurs moyennes.</div>

  <h3>Débits et vitesse débitante</h3>
  <div class="def-box">
    Le <strong>débit volumique</strong> à travers une section \(S\) est \(D_v = \iint_S \vec v\cdot\vec n\,\mathrm{d}S\) (m³/s) et le <strong>débit massique</strong> \(D_m = \iint_S \rho\,\vec v\cdot\vec n\,\mathrm{d}S\) (kg/s). La <strong>vitesse débitante</strong> est la vitesse moyenne sur la section :
    $$v_d = \frac{D_v}{S}\qquad\text{soit}\qquad D_m = \rho\,v_d\,S \ \ \text{(fluide homogène)}$$
  </div>
  <p>Pour une conduite de diamètre \(D\) : \(\mathrm{Re} = \dfrac{\rho\,v_d D}{\eta} = \dfrac{4D_m}{\pi\eta D}\).</p>

  <h3>Écoulement de Poiseuille</h3>
  <p>Hypothèses : conduite horizontale de rayon \(R\) et de longueur \(L\), écoulement laminaire, stationnaire, incompressible et établi (loin de l'entrée). Par symétrie et incompressibilité, \(\vec v = v(r)\,\vec e_z\) ; la pression ne dépend que de \(z\) (on néglige sa variation hydrostatique sur le diamètre, qui ne contribue pas à la force motrice). On note \(\Delta P = P_e - P_s \gt 0\) la chute de pression entre l'entrée et la sortie.</p>
  <div class="prop-box">
    <strong>Démonstration résumée.</strong> Système : cylindre de fluide coaxial, de rayon \(r\) et de longueur \(L\). En régime établi sa quantité de mouvement est constante, donc la somme des forces qu'il subit est nulle :
    <ul style="margin:.4rem 0">
      <li>forces de pression sur les deux disques : \((P_e - P_s)\,\pi r^2\,\vec e_z\) ;</li>
      <li>force de viscosité exercée par le fluide extérieur (côté des \(r\) croissants) sur la surface latérale : \(\eta\,\dfrac{\mathrm{d}v}{\mathrm{d}r}\,2\pi r L\,\vec e_z\).</li>
    </ul>
    D'où \(\dfrac{\mathrm{d}v}{\mathrm{d}r} = -\dfrac{\Delta P}{2\eta L}\,r\), puis, avec l'adhérence \(v(R) = 0\) :
    $$v(r) = \frac{\Delta P}{4\eta L}\left(R^2 - r^2\right)$$
  </div>
  <div class="prop-box">
    <strong>Loi de Hagen-Poiseuille.</strong> En intégrant \(D_v = \int_0^R v(r)\,2\pi r\,\mathrm{d}r\) :
    $$D_v = \frac{\pi R^4}{8\eta L}\,\Delta P \qquad v_d = \frac{v_{\max}}{2} = \frac{\Delta P\,R^2}{8\eta L}$$
  </div>
  <div class="def-box">
    <strong>Résistance hydraulique.</strong> En régime laminaire, \(\Delta P = R_h\,D_v\) avec
    $$R_h = \frac{8\eta L}{\pi R^4}$$
    Analogie électrique : \(\Delta P \leftrightarrow U\), \(D_v \leftrightarrow I\). Les résistances hydrauliques s'associent en série (même débit, pressions qui s'ajoutent) et en parallèle (même \(\Delta P\), débits qui s'ajoutent). La puissance dissipée vaut \(\Delta P\,D_v = R_h D_v^2\), analogue de l'effet Joule.
  </div>
  <p>Conséquence spectaculaire : \(R_h \propto R^{-4}\). Diviser le rayon par deux multiplie la résistance par 16 ; c'est le tube le plus fin d'un circuit qui impose le débit.</p>

  </figure>

  <h3>Régime turbulent et modèle unidimensionnel</h3>
  <p>En régime turbulent, on ne considère que la vitesse moyennée dans le temps. Le brassage uniformise la vitesse dans le cœur de l'écoulement : le profil moyen est très aplati, avec une variation brutale dans une fine zone près de la paroi (\(v_d \approx 0{,}8\,v_{\max}\), ordre de grandeur). La chute de pression n'est plus proportionnelle au débit mais croît à peu près comme \(D_v^{1{,}75}\) à \(D_v^{2}\).</p>
  <div class="def-box">
    <strong>Modèle unidimensionnel.</strong> On remplace le profil réel par une vitesse uniforme égale à \(v_d\) sur chaque section droite ; pression, vitesse et altitude sont alors considérées comme uniformes sur une section (pour une conduite de petit diamètre devant les dénivellations).
  </div>
  <div class="notice">
    <strong>Limite du modèle 1D.</strong> Il est excellent en turbulent (profil plat). En laminaire, il sous-estime le flux d'énergie cinétique : pour Poiseuille, la moyenne de \(v^3\) sur la section vaut \(2\,v_d^3\). On l'utilise quand même, l'erreur portant sur un terme souvent petit devant les autres.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Que vaut la contrainte exercée par le fluide sur la paroi dans un écoulement de Poiseuille ? Vérifier l'équilibre de la colonne de fluide.</span>
    <div class="content"><p>\(\tau_p = \eta\left|\dfrac{\mathrm{d}v}{\mathrm{d}r}\right|_{r=R} = \dfrac{\Delta P\,R}{2L}\), dirigée dans le sens de l'écoulement (le fluide entraîne la paroi). Force totale sur la paroi : \(\tau_p\,2\pi R L = \Delta P\,\pi R^2\) : la poussée nette des forces de pression est intégralement transmise à la paroi par viscosité.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SYSTÈMES OUVERTS</div>
  <h2>Système ouvert, système fermé associé et bilan de masse</h2>
  <div class="intro">Pour une pompe, une turbine ou un tronçon de conduite, il est naturel de raisonner sur un volume fixe que le fluide traverse. Mais les lois de la mécanique et de la thermodynamique s'appliquent à des systèmes fermés : on construit donc un système fermé « qui suit le fluide » pendant une durée dt.</div>

  <div class="def-box">
    <strong>Système ouvert.</strong> On choisit une <strong>surface de contrôle</strong> \(\Sigma\), fixe dans le référentiel d'étude, traversée par le fluide (ici par une entrée \(e\) et une sortie \(s\)). Le contenu de \(\Sigma\) est un système ouvert : il échange de la matière avec l'extérieur.
  </div>
  <div class="def-box">
    <strong>Système fermé associé \(\Sigma^*\).</strong> Entre \(t\) et \(t+\mathrm{d}t\), on définit \(\Sigma^*\) comme :
    <ul style="margin:.4rem 0">
      <li>à l'instant \(t\) : le contenu de \(\Sigma\) <em>plus</em> la masse \(\delta m_e\) qui va entrer pendant \(\mathrm{d}t\) ;</li>
      <li>à l'instant \(t+\mathrm{d}t\) : le contenu de \(\Sigma\) <em>plus</em> la masse \(\delta m_s\) qui vient de sortir pendant \(\mathrm{d}t\).</li>
    </ul>
    \(\Sigma^*\) contient toujours les mêmes particules : c'est un système fermé.
  </div>

  </figure>

  <h3>Bilan de masse</h3>
  <p>La masse de \(\Sigma^*\) est constante : \(m_\Sigma(t) + \delta m_e = m_\Sigma(t+\mathrm{d}t) + \delta m_s\). En introduisant les débits massiques \(D_{m,e} = \delta m_e/\mathrm{d}t\) et \(D_{m,s} = \delta m_s/\mathrm{d}t\) :</p>
  <div class="formula">$$\frac{\mathrm{d}m_\Sigma}{\mathrm{d}t} = D_{m,e} - D_{m,s}$$</div>
  <div class="prop-box">
    <strong>Régime permanent.</strong> Toutes les grandeurs relatives au contenu de \(\Sigma\) sont indépendantes du temps, donc \(D_{m,e} = D_{m,s} = D_m\) : <strong>le débit massique se conserve</strong> (\(\delta m_e = \delta m_s = \delta m\)). S'il y a plusieurs entrées et sorties, la somme des débits entrants égale celle des débits sortants (analogue de la loi des nœuds).
  </div>
  <div class="prop-box">
    <strong>Fluide incompressible.</strong> \(\rho\) étant constante, c'est aussi le débit volumique qui se conserve. Dans le modèle 1D, entre deux sections d'une même conduite :
    $$S_1\,v_1 = S_2\,v_2$$
    Un rétrécissement accélère le fluide, un élargissement le ralentit.
  </div>
  <div class="prop-box">
    <strong>Bilan d'une grandeur extensive.</strong> Pour une grandeur \(X\) de grandeur massique \(x\), en régime permanent, \(X_\Sigma\) ne varie pas et
    $$\frac{\mathrm{d}X^*}{\mathrm{d}t} = D_m\,(x_s - x_e)$$
    La variation de \(X\) pour le système fermé se réduit à ce qui sort moins ce qui entre. C'est l'outil de tous les bilans qui suivent (énergie mécanique ici ; énergie interne et enthalpie en thermodynamique industrielle).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BILAN D'ÉNERGIE MÉCANIQUE</div>
  <h2>Bilan d'énergie mécanique et théorème de Bernoulli</h2>
  <div class="intro">En appliquant le théorème de l'énergie cinétique au système fermé associé, on obtient une relation entre les grandeurs d'entrée et de sortie, la puissance apportée par les machines et la puissance dissipée par viscosité. Sans machine ni viscosité, c'est le théorème de Bernoulli.</div>

  <div class="def-box">
    <strong>Hypothèses.</strong> Référentiel galiléen, régime permanent, fluide incompressible et homogène (masse volumique \(\rho\)), modèle unidimensionnel (\(P\), \(v\), \(z\) uniformes sur les sections d'entrée et de sortie), pesanteur uniforme (axe \(Oz\) vers le haut). Entre l'entrée et la sortie peut se trouver une machine à parties mobiles (pompe, turbine, hélice).
  </div>

  <h3>Démonstration (théorème de l'énergie cinétique appliqué à Σ*)</h3>
  <ul>
    <li><strong>Variation d'énergie cinétique.</strong> En régime permanent, l'énergie cinétique du contenu de \(\Sigma\) ne change pas : \(\mathrm{d}E_c^* = \delta m\left(\tfrac12 v_s^2 - \tfrac12 v_e^2\right)\).</li>
    <li><strong>Forces de pression en entrée et en sortie</strong> (exercées par le fluide amont et aval) : le fluide amont fait avancer la face d'entrée en balayant le volume \(\delta m/\rho\) (travail \(+P_e\,\delta m/\rho\)), tandis que la face de sortie avance contre le fluide aval (travail \(-P_s\,\delta m/\rho\)) : \(\delta W_p = (P_e - P_s)\,\delta m/\rho\). Pour un fluide incompressible, la puissance des forces de pression intérieures est nulle.</li>
    <li><strong>Poids</strong> : l'énergie potentielle du contenu de \(\Sigma\) ne change pas ; seule diffère la position des deux tranches (\(\delta m\) à l'altitude \(z_e\) au départ, \(\delta m\) à l'altitude \(z_s\) à l'arrivée) : \(\delta W_g = -\delta m\,g\,(z_s - z_e)\).</li>
    <li><strong>Travail indiqué</strong> \(\delta W_i = \mathcal{P}_i\,\mathrm{d}t\), reçu des parties mobiles de la machine.</li>
    <li><strong>Forces intérieures de viscosité</strong> : \(\delta W_v = \mathcal{P}_v\,\mathrm{d}t\), avec \(\mathcal{P}_v \le 0\).</li>
  </ul>
  <p>On écrit \(\mathrm{d}E_c^* = \delta W_p + \delta W_g + \delta W_i + \delta W_v\) et l'on divise par \(\mathrm{d}t\), avec \(D_m = \delta m/\mathrm{d}t\) :</p>
  <div class="prop-box">
    <strong>Bilan d'énergie mécanique en écoulement permanent.</strong>
    $$\mathcal{P}_i + \mathcal{P}_v = D_m\left[\left(\frac{P_s}{\rho} + \frac{v_s^2}{2} + g z_s\right) - \left(\frac{P_e}{\rho} + \frac{v_e^2}{2} + g z_e\right)\right]$$
    Forme massique : \(w_i + w_v = \Delta\!\left(\dfrac{P}{\rho} + \dfrac{v^2}{2} + g z\right)\), avec \(w_i = \mathcal{P}_i/D_m\) (travail indiqué massique) et \(\Delta = \) sortie − entrée.
  </div>
  <ul>
    <li>\(\mathcal{P}_i \gt 0\) : <strong>pompe</strong>, ventilateur (le fluide reçoit de l'énergie) ; \(\mathcal{P}_i \lt 0\) : <strong>turbine</strong>, éolienne (le fluide cède de l'énergie).</li>
    <li>\(\mathcal{P}_i\) est la puissance reçue <em>par le fluide</em>. La puissance électrique absorbée par une pompe est plus grande : \(\mathcal{P}_{\text{élec}} = \mathcal{P}_i/r\), où \(r \lt 1\) est le rendement du groupe motopompe (on évite la lettre \(\eta\), déjà prise par la viscosité).</li>
    <li>\(\mathcal{P}_v \le 0\) : l'énergie mécanique dissipée devient de l'énergie interne (échauffement du fluide) ; le lien est fait par le premier principe pour un système ouvert (chapitre de thermodynamique industrielle).</li>
  </ul>

  <h3>Théorème de Bernoulli</h3>
  <div class="prop-box">
    <strong>Théorème de Bernoulli.</strong> Pour un écoulement <strong>parfait</strong> (\(\mathcal{P}_v = 0\)), <strong>permanent</strong>, <strong>incompressible</strong> et <strong>homogène</strong>, sans échange de travail avec des parties mobiles (\(\mathcal{P}_i = 0\)), la quantité suivante se conserve le long d'une ligne de courant (ou entre deux sections dans le modèle 1D) :
    $$P + \frac12\rho v^2 + \rho g z = \text{cte}$$
    C'est la conservation de l'énergie mécanique volumique : le travail des forces de pression convertit énergie de pression, énergie cinétique et énergie potentielle les unes dans les autres. Pour \(v = 0\), on retrouve la loi de la statique des fluides.
  </div>
  <div class="def-box">
    <strong>Charge.</strong> On appelle charge (exprimée en hauteur de fluide, en mètres)
    $$H = \frac{P}{\rho g} + \frac{v^2}{2g} + z$$
    somme de la hauteur piézométrique \(P/(\rho g) + z\) et de la hauteur dynamique \(v^2/(2g)\). Bernoulli exprime la conservation de la charge.
  </div>

  <h3>Applications classiques</h3>
  <ul>
    <li><strong>Formule de Torricelli.</strong> Réservoir à surface libre (pression \(P_0\)), petit orifice à la profondeur \(h\) débouchant à l'air libre (le jet est à la pression \(P_0\)). Si la section du réservoir est grande devant celle de l'orifice, la surface libre descend lentement (\(v \approx 0\), régime quasi permanent) et \(v_{\text{jet}} = \sqrt{2gh}\) : la vitesse d'une chute libre de hauteur \(h\). En pratique, pour un orifice à bord vif, le jet se contracte juste après la sortie (section réduite à environ 60 % de celle de l'orifice) : le débit réel est inférieur d'environ 40 % à \(s\sqrt{2gh}\).</li>
    <li><strong>Effet Venturi.</strong> Dans un rétrécissement horizontal, \(S_1 v_1 = S_2 v_2\) impose \(v_2 \gt v_1\), donc \(P_2 \lt P_1\). En mesurant \(P_1 - P_2\) :
    $$D_v = S_2\sqrt{\frac{2\,(P_1 - P_2)}{\rho\left(1 - S_2^2/S_1^2\right)}}$$
    (débitmètre de Venturi, trompe à eau, carburateur). Si \(P_2\) descend sous la pression de vapeur saturante du liquide, des bulles de vapeur apparaissent : c'est la <strong>cavitation</strong>.</li>
    <li><strong>Tube de Pitot.</strong> Au point d'arrêt \(A\), à l'avant du tube, la vitesse est nulle et la pression vaut \(P_A = P + \tfrac12\rho v^2\) (pression d'arrêt) ; des prises latérales mesurent la pression statique \(P\) de l'écoulement. D'où \(v = \sqrt{2(P_A - P)/\rho}\) : c'est l'anémomètre des avions. Pour un gaz, valable tant que l'écoulement reste incompressible (vitesse inférieure au tiers de celle du son environ).</li>
  </ul>

    <strong>Bernoulli ne traverse ni une pompe, ni une zone dissipative.</strong> On ne l'applique pas entre deux points séparés par une machine, une longue conduite, un élargissement brusque ou un coude : il faut alors le bilan complet (§6). Et dans un jet libre à l'air, la pression vaut la pression ambiante.
  </div>

    <div class="formula">$$\mathcal{P}_i = D_m\,\frac{P_s - P_e}{\rho} = D_v\,(P_s - P_e)$$</div>
    <div class="formula">$$\mathcal{P}_i = 5{,}0\times10^{-2}\times(-4{,}0\times10^{5}) = -2{,}0\times10^{4}\ \text{W}$$</div><p> L'eau cède au plus 20 kW à la roue, alors que le détendeur dissipait cette puissance en pure perte (échauffement de l'eau). Le rendement de la turbine et de l'alternateur réduit la puissance électrique effectivement produite.</p></div>

<div class="course-section">
  <div class="sec-num">§6 · PERTES DE CHARGE</div>
  <h2>Pertes de charge et dimensionnement d'une pompe</h2>
  <div class="intro">Dans une installation réelle, la viscosité dégrade l'énergie mécanique du fluide tout au long des conduites et, plus brutalement, dans chaque accident de parcours (coude, vanne, changement de section). Les quantifier permet de choisir le diamètre des tuyaux et la pompe.</div>

  <h3>Théorème de Bernoulli généralisé</h3>
  <div class="def-box">
    <strong>Perte de charge.</strong> Divisons le bilan d'énergie mécanique par \(D_m\,g\). On pose
    $$\Delta h = -\frac{\mathcal{P}_v}{D_m\,g} \ge 0 \ \ \text{(en m)} \qquad \Delta P_c = \rho g\,\Delta h = -\frac{\mathcal{P}_v}{D_v} \ \ \text{(en Pa)}$$
    et \(h_p = \dfrac{\mathcal{P}_i}{D_m\,g} = \dfrac{w_i}{g}\), <strong>hauteur manométrique</strong> de la pompe.
  </div>
  <div class="prop-box">
    <strong>Bernoulli généralisé</strong> entre une section 1 (amont) et une section 2 (aval) :
    $$H_1 + h_p = H_2 + \Delta h_{1\to2}$$
    Sans pompe, la charge <strong>diminue</strong> dans le sens de l'écoulement. En pression, sans machine :
    $$P_1 + \tfrac12\rho v_1^2 + \rho g z_1 = P_2 + \tfrac12\rho v_2^2 + \rho g z_2 + \Delta P_c$$
  </div>
  <p>Exemple : dans une conduite horizontale de section constante, \(v\) et \(z\) ne changent pas ; la perte de charge se lit directement comme une <strong>chute de pression</strong>.</p>

  <h3>Pertes de charge régulières</h3>
  <div class="prop-box">
    <strong>Formule de Darcy-Weisbach.</strong> Pour une longueur \(L\) de conduite de diamètre \(D\) parcourue à la vitesse débitante \(v\) :
    $$\Delta P_{\text{reg}} = \lambda\,\frac{L}{D}\,\frac{\rho v^2}{2} \qquad \Delta h_{\text{reg}} = \lambda\,\frac{L}{D}\,\frac{v^2}{2g}$$
    \(\lambda\) est le <strong>coefficient de perte de charge régulière</strong> (sans dimension). Il dépend de \(\mathrm{Re}\) et de la <strong>rugosité relative</strong> \(\varepsilon/D\) (\(\varepsilon\) : hauteur moyenne des aspérités de la paroi).
  </div>
  <ul>
    <li><strong>Laminaire</strong> (\(\mathrm{Re} \lesssim 2000\)) : \(\lambda = 64/\mathrm{Re}\), indépendant de la rugosité. <em>Preuve</em> : Poiseuille donne \(\Delta P = 32\eta L v/D^2\) ; on l'identifie à \(\lambda (L/D)\rho v^2/2\).</li>
    <li><strong>Turbulent, paroi lisse</strong> : formule de Blasius \(\lambda \approx 0{,}316\,\mathrm{Re}^{-1/4}\) (pour \(4\times10^3 \lesssim \mathrm{Re} \lesssim 10^5\)).</li>
    <li><strong>Turbulent, paroi rugueuse</strong> : \(\lambda\) croît avec \(\varepsilon/D\) ; à très grand Reynolds il ne dépend plus que de \(\varepsilon/D\). La formule empirique de Colebrook (implicite, toujours fournie par l'énoncé) relie \(\lambda\), Re et \(\varepsilon/D\).</li>
  </ul>
  <div class="def-box">
    <strong>Diagramme de Moody.</strong> Réseau de courbes donnant \(\lambda\) (ordonnée, échelle log) en fonction de Re (abscisse, échelle log), une courbe par valeur de \(\varepsilon/D\). À gauche, la droite laminaire \(\lambda = 64/\mathrm{Re}\) ; à droite, des courbes qui s'aplatissent en plateaux (régime rugueux). <em>Lecture</em> : calculer Re et \(\varepsilon/D\), placer Re en abscisse, suivre la courbe de rugosité correspondante (interpoler entre deux courbes), lire \(\lambda\).
  </div>


  <figure class="schema">
<svg viewBox="0 0 640 300" role="img" aria-label="Abaque de Moody : coefficient de perte de charge régulière en fonction du nombre de Reynolds">
<line x1="70" y1="270" x2="562" y2="270" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>

</figure>
  <div class="method-box">
    <strong>Exemple — lire l'abaque de Moody</strong>
    <p>De l'eau (\(\nu = 1{,}0\times10^{-6}\ \text{m}^2\text{·s}^{-1}\)) circule à \(v = 2{,}0\ \text{m·s}^{-1}\) dans une conduite d'acier de diamètre \(D = 5{,}0\ \text{cm}\) et de rugosité \(\varepsilon = 0{,}10\ \text{mm}\), sur \(L = 100\ \text{m}\).</p>
    <ol>
      <li>\(\mathrm{Re} = vD/\nu = 1{,}0\times10^{5}\) : turbulent ; \(\varepsilon/D = 2\times10^{-3}\).</li>
      <li>Sur l'abaque, à \(\mathrm{Re} = 10^5\), entre les courbes \(10^{-3}\) et \(10^{-2}\), plus près de la première : \(\lambda \approx 0{,}025\).</li>
      <li>Perte de charge régulière, soit 1 bar, ou une hauteur de 10 m d'eau :
        <div class="formula">$$\Delta P_{\text{reg}} = \lambda\frac{L}{D}\frac{\rho v^2}{2} = 0{,}025\times2\,000\times2\,000 \approx 1{,}0\times10^{5}\ \text{Pa}$$</div></li>
      <li>Pour un tuyau lisse au même Reynolds, \(\lambda \approx 0{,}018\) : la rugosité coûte ici 40 % de perte de charge supplémentaire.</li>
    </ol>
  </div>

  <h3>Pertes de charge singulières</h3>
  <div class="prop-box">
    Chaque singularité (coude, vanne, raccord, changement de section, entrée ou sortie de conduite) provoque une perte localisée
    $$\Delta P_{\text{sing}} = K\,\frac{\rho v^2}{2} \qquad \Delta h_{\text{sing}} = K\,\frac{v^2}{2g}$$
    où \(K\) est le coefficient de perte de charge singulière (sans dimension, quasi indépendant de Re en turbulent) et \(v\) une vitesse de référence précisée (en général la vitesse dans la conduite).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid);text-align:left">Singularité</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">\(K\) (ordre de grandeur)</th></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Coude à 90° à grand rayon de courbure</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">0,2 à 0,4</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Coude à 90° vif (angle droit)</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">≈ 1 à 1,5</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Vanne grande ouverte</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">≈ 0,1 à 0,3</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Entrée de conduite à angle vif (depuis un réservoir)</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">≈ 0,5</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Débouché dans un grand réservoir</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">1</td></tr>
    <tr><td style="padding:.3rem .5rem;border:1px solid var(--grid)">Élargissement brusque \(S_1 \to S_2\) (rapporté à \(v_1\))</td><td style="padding:.3rem .5rem;border:1px solid var(--grid);text-align:center">\((1 - S_1/S_2)^2\)</td></tr>
  </table></div>
  <p>Rugosités typiques : verre, PVC, cuivre \(\varepsilon \approx 1\) à \(2\ \mu\text{m}\) (paroi quasi lisse) ; acier du commerce \(\approx 0{,}05\ \text{mm}\) ; fonte \(\approx 0{,}25\ \text{mm}\) ; béton \(0{,}3\) à \(3\ \text{mm}\).</p>
  <div class="notice">
    <strong>Ne pas compter deux fois l'énergie cinétique de sortie.</strong> Si l'on écrit Bernoulli généralisé entre deux surfaces libres (vitesses nulles), la perte « débouché dans le réservoir » (\(K = 1\)) doit figurer dans \(\Delta h\). Si l'on s'arrête dans le jet de sortie, on garde au contraire le terme \(v^2/(2g)\) dans la charge et pas de \(K = 1\).
  </div>

  <h3>Dimensionnement d'une pompe</h3>
  <div class="prop-box">
    Pour élever un débit \(D_v\) d'un point 1 à un point 2, la pompe doit fournir la <strong>hauteur manométrique totale</strong>
    $$h_p = (z_2 - z_1) + \frac{P_2 - P_1}{\rho g} + \frac{v_2^2 - v_1^2}{2g} + \sum \Delta h_{\text{reg}} + \sum \Delta h_{\text{sing}}$$
    La puissance reçue par le fluide (puissance hydraulique) vaut \(\mathcal{P}_h = \rho g\,D_v\,h_p = D_m\,w_i\), et la puissance absorbée \(\mathcal{P}_h/r\) (\(r\) : rendement).
  </div>
  <p>Les pertes de charge croissant comme \(D_v^2\) en turbulent, l'installation présente une <strong>caractéristique de réseau</strong> \(h_r(D_v) \approx h_{\text{géo}} + k\,D_v^2\). La pompe, elle, possède une caractéristique \(h_p(D_v)\) décroissante, fournie par le constructeur. Le <strong>point de fonctionnement</strong> est leur intersection. À débit fixé, \(\Delta h_{\text{reg}} \propto \lambda/D^5\) : un diamètre un peu plus grand réduit fortement les pertes (mais coûte plus cher à l'achat).</p>

  <h2>Couche limite et modèle de l'écoulement parfait</h2>
  <div class="intro">À grand nombre de Reynolds, on serait tenté d'oublier la viscosité. C'est légitime presque partout… sauf au voisinage des parois, où la condition d'adhérence oblige la vitesse à chuter jusqu'à zéro sur une faible épaisseur.</div>

  <div class="def-box">
    <strong>Couche limite.</strong> Zone de fluide voisine d'une paroi, dans laquelle la vitesse passe de la valeur imposée par la paroi à celle de l'écoulement extérieur, et où les effets de viscosité ne sont pas négligeables.
  </div>
  <div class="prop-box">
    <strong>Épaisseur.</strong> Pour un obstacle de longueur \(L\) placé dans un écoulement de vitesse \(V\) :
    $$\delta \sim \sqrt{\frac{\nu L}{V}} = \frac{L}{\sqrt{\mathrm{Re}}}$$
    <em>Justification.</em> Une particule longe la paroi pendant la durée \(\tau_c \sim L/V\) ; pendant ce temps, l'influence de la paroi diffuse transversalement sur une distance \(\delta \sim \sqrt{\nu\,\tau_c}\). Le long d'une plaque, \(\delta(x) \sim \sqrt{\nu x/V}\) croît comme \(\sqrt{x}\).
  </div>

  <h3>Le modèle de l'écoulement parfait</h3>
  <div class="def-box">
    <strong>Écoulement parfait.</strong> Modèle dans lequel on néglige tous les phénomènes diffusifs (viscosité, conduction thermique) : les particules de fluide évoluent de façon adiabatique et réversible et ne subissent que les forces de pression et les forces volumiques (pesanteur). À une paroi immobile, seule la composante normale de la vitesse s'annule, \(\vec v\cdot\vec n = 0\) : le fluide peut glisser le long de la paroi.
  </div>
  <div class="prop-box">
    <strong>Domaine de validité.</strong> À grand nombre de Reynolds, l'écoulement réel est bien décrit par le modèle parfait <strong>en dehors des couches limites et du sillage</strong> ; à l'intérieur de ces zones minces, la viscosité est essentielle.
  </div>
  <div class="notice">
    <strong>Ce que le modèle parfait ne sait pas faire.</strong> Il ne prévoit ni la traînée (paradoxe de d'Alembert : un obstacle dans un écoulement parfait, stationnaire et sans tourbillon ne subit aucune force de traînée) ni les pertes de charge. Ces effets naissent précisément dans les couches limites et le sillage.
  </div>

  <h3>Transition et décollement</h3>
  <p>Le long d'une plaque, la couche limite est d'abord laminaire, puis devient turbulente lorsque \(\mathrm{Re}_x = Vx/\nu\) atteint quelques \(10^5\) ; elle s'épaissit alors plus vite et devient fortement brassée. Lorsque l'écoulement extérieur ralentit (pression croissante vers l'aval, à l'arrière d'un obstacle arrondi), le fluide lent de la couche limite s'arrête puis reflue : la couche limite <strong>décolle</strong> de la paroi, ce qui crée une zone de recirculation puis un <strong>sillage</strong>. Une couche limite turbulente, mieux réalimentée en quantité de mouvement par le brassage, résiste mieux au décollement.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Épaisseur de la couche limite sur une plaque de 50 cm placée dans un courant d'air de 10 m/s ?</span>
    <div class="content"><p>\(\mathrm{Re} = VL/\nu \approx 3{,}3\times10^{5}\), d'où \(\delta \sim L/\sqrt{\mathrm{Re}} \approx 0{,}5/580 \approx 0{,}9\ \text{mm}\). (Le calcul exact en régime laminaire ajoute un facteur voisin de 5 : quelques millimètres.) La couche limite reste très mince devant \(L\) : au-dessus, le modèle parfait s'applique.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · ÉCOULEMENT AUTOUR D'UN OBSTACLE (HORS PROGRAMME)</div>
  <h2>Traînée, décollement et sillage</h2>
  <div class="intro">Un solide immobile dans un courant (ou, ce qui revient au même, un solide en mouvement dans un fluide au repos) subit une force. Sa composante dans la direction de l'écoulement incident, la traînée, s'oppose au mouvement relatif : c'est elle qui fixe la consommation d'un véhicule ou la vitesse de chute d'une goutte.</div>

  <div class="def-box">
    <strong>Coefficient de traînée.</strong> Dans le référentiel de l'obstacle, le fluide arrive loin en amont à la vitesse \(V\). La traînée s'écrit
    $$F_x = \frac12\,\rho\,S\,V^2\,C_x$$
    où \(S\) est le <strong>maître-couple</strong> (aire de la projection de l'obstacle sur un plan perpendiculaire à \(\vec V\)) et \(C_x\) un coefficient sans dimension. La composante perpendiculaire à \(\vec V\) est la <strong>portance</strong>, de coefficient \(C_z\) défini de même.
  </div>
  <p><strong>Pourquoi \(C_x\) ne dépend que de Re.</strong> Pour une forme donnée, \(F_x\) ne dépend que de \(\rho\), \(\eta\), \(V\) et \(L\). Ces cinq grandeurs ne font intervenir que trois dimensions (M, L, T) : on ne peut former que deux nombres sans dimension indépendants, par exemple \(F_x/(\rho V^2 L^2)\) et \(\mathrm{Re}\). Donc \(F_x/(\rho V^2L^2) = \varphi(\mathrm{Re})\), c'est-à-dire \(C_x = C_x(\mathrm{Re})\) (et de la rugosité si elle n'est pas négligeable).</p>

  <h3>Évolution avec le nombre de Reynolds (sphère, cylindre)</h3>
  <ul>
    <li><strong>\(\mathrm{Re} \ll 1\) — régime de Stokes.</strong> Écoulement laminaire, attaché, quasi symétrique entre l'amont et l'aval. Pour une sphère de rayon \(R\) : \(F = 6\pi\eta R V\), proportionnelle à \(V\), soit \(C_x = 24/\mathrm{Re}\) (Re construit sur le diamètre).</li>
    <li><strong>De quelques unités à ≈ 50 (cylindre), d'une vingtaine à ≈ 200 (sphère).</strong> L'écoulement se détache de la face arrière : une bulle de recirculation immobile reste accrochée derrière l'obstacle (deux tourbillons de sens opposés dans une coupe ; pour la sphère, un anneau tourbillonnaire, qui perd sa symétrie de révolution entre ≈ 200 et ≈ 300 tout en restant stationnaire).</li>
    <li><strong>Au-delà (≈ 50 pour le cylindre, ≈ 300 pour la sphère) et jusqu'à \(10^5\) environ.</strong> La bulle devient instable et des tourbillons sont lâchés périodiquement. Derrière un cylindre, ils partent tour à tour en haut et en bas et forment en aval une double rangée alternée, l'<strong>allée de von Kármán</strong>, de fréquence \(fD/V \approx 0{,}2\) (nombre de Strouhal) : c'est elle qui fait « chanter » les câbles tendus dans le vent et vibrer les cheminées. Derrière une sphère, les tourbillons lâchés forment des boucles en épingle. Le sillage devient progressivement turbulent.</li>
    <li><strong>\(10^3 \lesssim \mathrm{Re} \lesssim 2\times10^5\) — régime quadratique.</strong> \(C_x\) est à peu près constant (≈ 0,4 à 0,5 pour une sphère, ≈ 1 pour un cylindre long) : \(F \propto V^2\). La traînée est surtout due à la dépression qui règne dans le large sillage décollé (traînée de forme).</li>
    <li><strong>Crise de traînée (Re ≈ 3·10⁵).</strong> La couche limite devient turbulente avant de décoller ; elle reste attachée plus loin, le sillage se rétrécit et \(C_x\) chute brutalement (≈ 0,1 à 0,2). Les alvéoles d'une balle de golf déclenchent cette transition à plus faible vitesse et réduisent la traînée aux vitesses de jeu.</li>
  </ul>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉCOULEMENTS VISQUEUX ET BILANS</div>
  <h2>Stratégies pour les exercices</h2>

  <div class="method-box">
    <strong>Méthode 1 — Écrire une force de viscosité sans erreur de signe</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Repérer.</span> Identifier la direction de l'écoulement (\(\vec e_x\) ou \(\vec e_z\)) et la variable transverse dont dépend la vitesse (\(y\) ou \(r\)).</li>
      <li><span class="step">Situer l'extérieur.</span> Sur la face du système située du côté des \(y\) (ou \(r\)) croissants, le fluide extérieur exerce \(+\eta\,\dfrac{\partial v}{\partial y}\,\mathrm{d}S\) selon l'écoulement ; sur la face située du côté des \(y\) décroissants, il exerce \(-\eta\,\dfrac{\partial v}{\partial y}\,\mathrm{d}S\).</li>
      <li><span class="step">Contrôler physiquement.</span> Le fluide rapide entraîne le fluide lent ; une paroi immobile freine le fluide ; le fluide entraîne la paroi dans son sens.</li>
      <li><span class="step">Géométrie cylindrique.</span> Sur un cylindre de rayon \(r\) et de longueur \(L\), le fluide extérieur exerce \(\eta\,\dfrac{\mathrm{d}v}{\mathrm{d}r}\,2\pi r L\,\vec e_z\) (négatif si la vitesse décroît vers la paroi : freinage).</li>
    </ol>
    <p style="margin-top:.4rem"><em>Pièges</em> : utiliser \(|\partial v/\partial y|\) sans réfléchir au sens ; oublier le signe moins sur la face inférieure ; confondre force surfacique (Pa) et force (N).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Évaluer le nombre de Reynolds et choisir le modèle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Vitesse.</span> Vitesse débitante en conduite, vitesse relative loin de l'obstacle pour un corps immergé.</li>
      <li><span class="step">Longueur.</span> Diamètre de la conduite, dimension transverse de l'obstacle, corde d'une aile.</li>
      <li><span class="step">Viscosité cinématique.</span> Air \(1{,}5\times10^{-5}\ \text{m}^2/\text{s}\), eau \(10^{-6}\ \text{m}^2/\text{s}\) ; convertir les unités (mm, km/h, L/min).</li>
      <li><span class="step">Conclure.</span> \(\mathrm{Re}\ll1\) : Stokes, lubrification ; conduite avec \(\mathrm{Re}\lesssim2000\) : Poiseuille, \(\lambda = 64/\mathrm{Re}\) ; \(\mathrm{Re}\gg1\) : écoulement parfait hors couche limite (\(\delta\sim L/\sqrt{\mathrm{Re}}\)), turbulence possible, modèle 1D et coefficients empiriques (\(\lambda\), \(K\), \(C_x\)).</li>
      <li><span class="step">Vérifier a posteriori.</span> Si la vitesse est une inconnue, supposer un régime, calculer la vitesse, puis contrôler la cohérence du Reynolds obtenu ; sinon changer de régime.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Établir un profil de vitesse (Couette, Poiseuille, film)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Symétries.</span> Écrire la forme du champ : \(v_x(y)\,\vec e_x\) ou \(v(r)\,\vec e_z\) ; l'incompressibilité interdit la dépendance en \(x\) (ou \(z\)) pour une section constante.</li>
      <li><span class="step">Système.</span> Choisir une tranche (entre \(y\) et \(y+\mathrm{d}y\), ou de la paroi jusqu'à \(y\)) ou un cylindre de rayon \(r\).</li>
      <li><span class="step">Bilan des forces.</span> En régime établi, la quantité de mouvement du système ne varie pas : somme des forces de pression, de viscosité (méthode 1) et du poids projeté = 0.</li>
      <li><span class="step">Intégrer.</span> Obtenir \(\mathrm{d}v/\mathrm{d}y\) ou \(\mathrm{d}^2v/\mathrm{d}y^2\), puis \(v\).</li>
      <li><span class="step">Conditions aux limites.</span> Adhérence aux parois (\(v = v_{\text{paroi}}\)) ; vitesse finie sur l'axe ; contrainte nulle à une surface libre (\(\mathrm{d}v/\mathrm{d}y = 0\)).</li>
      <li><span class="step">Exploiter.</span> Débit \(D_v = \iint v\,\mathrm{d}S\), vitesse débitante, contrainte pariétale, puissance dissipée.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Appliquer le théorème de Bernoulli</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Vérifier les hypothèses.</span> Écoulement parfait (grand Reynolds, trajet court, sans singularité dissipative), permanent ou quasi permanent (vidange lente), incompressible (liquide ; gaz à moins de 100 m/s environ), homogène, aucune machine entre les points.</li>
      <li><span class="step">Choisir deux points</span> d'une même ligne de courant (ou deux sections en 1D) où l'on connaît le plus de choses : surface libre (\(P = P_0\), \(v\approx0\) si la section est grande), jet libre (\(P = P_0\) dans le jet), point d'arrêt (\(v = 0\)).</li>
      <li><span class="step">Compléter</span> par la conservation du débit (\(S_1v_1 = S_2v_2\)) et par la statique des fluides dans les zones au repos (tubes manométriques, prises de pression).</li>
      <li><span class="step">Contrôler</span> les ordres de grandeur, puis discuter les écarts au modèle (contraction du jet, pertes, compressibilité, cavitation).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Bilan d'énergie mécanique sur un système ouvert</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Définir</span> la surface de contrôle \(\Sigma\) fixe, ses entrées et sorties, puis le système fermé \(\Sigma^*\) entre \(t\) et \(t+\mathrm{d}t\).</li>
      <li><span class="step">Bilan de masse</span> : en régime permanent, \(\delta m_e = \delta m_s = D_m\,\mathrm{d}t\).</li>
      <li><span class="step">Théorème de l'énergie cinétique</span> appliqué à \(\Sigma^*\) : recenser les travaux (pression amont et aval, poids, travail indiqué, viscosité).</li>
      <li><span class="step">Diviser par dt</span> : \(\mathcal{P}_i + \mathcal{P}_v = D_m\,\Delta\!\left(P/\rho + v^2/2 + gz\right)\).</li>
      <li><span class="step">Signes</span> : \(\mathcal{P}_i \gt 0\) pour une pompe, \(\lt 0\) pour une turbine ; \(\mathcal{P}_v \le 0\). Passer à la puissance électrique ou mécanique sur l'arbre avec le rendement.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Piège</em> : le même schéma de démonstration sert pour un bilan de quantité de mouvement ou d'énergie interne ; seul l'inventaire des termes change. Toujours écrire la grandeur pour \(\Sigma^*\) aux deux instants.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Calculer des pertes de charge et dimensionner une pompe</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Vitesse débitante</span> : \(v = 4D_v/(\pi D^2)\) dans chaque tronçon (attention aux L/min et aux m³/h).</li>
      <li><span class="step">Reynolds</span> : \(\mathrm{Re} = vD/\nu\) ; rugosité relative \(\varepsilon/D\).</li>
      <li><span class="step">Coefficient \(\lambda\)</span> : \(64/\mathrm{Re}\) en laminaire ; Blasius en turbulent lisse ; diagramme de Moody (ou table, Colebrook) en rugueux.</li>
      <li><span class="step">Pertes régulières</span> : \(\Delta h = \lambda\,(L/D)\,v^2/(2g)\), tronçon par tronçon.</li>
      <li><span class="step">Pertes singulières</span> : \(\sum K\,v^2/(2g)\), sans compter deux fois l'énergie cinétique de sortie.</li>
      <li><span class="step">Bernoulli généralisé</span> entre deux points bien choisis (surfaces libres de préférence) : en déduire \(h_p\).</li>
      <li><span class="step">Puissances</span> : \(\mathcal{P}_h = \rho g D_v h_p\), puis \(\mathcal{P}_{\text{élec}} = \mathcal{P}_h/r\) (\(r\) : rendement) ; énergie = puissance × durée.</li>
    </ol>
    <p style="margin-top:.4rem"><em>Pièges</em> : exprimer \(\Delta h\) en mètres <em>du fluide pompé</em> ; ne pas oublier la dénivellation géométrique ; vérifier que la pression ne descend nulle part sous la pression de vapeur saturante (cavitation à l'aspiration).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Traînée et vitesse limite d'un corps</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Supposer un régime</span> : linéaire (Stokes, \(F = 6\pi\eta R v\)) si le corps est petit, lent ou le fluide très visqueux ; quadratique (\(F = \tfrac12\rho_f S C_x v^2\)) sinon.</li>
      <li><span class="step">PFD</span> : \(m\,\dfrac{\mathrm{d}v}{\mathrm{d}t} = mg - \rho_f V g - F\) (poids, poussée d'Archimède, traînée).</li>
      <li><span class="step">Vitesse limite</span> (\(\mathrm{d}v/\mathrm{d}t = 0\)) : Stokes, \(v_\ell = \dfrac{2(\rho_s - \rho_f)\,g R^2}{9\eta}\) ; quadratique, \(v_\ell = \sqrt{\dfrac{2(m - \rho_f V)\,g}{\rho_f S C_x}}\).</li>
      <li><span class="step">Vérifier</span> le Reynolds à la vitesse limite ; s'il contredit l'hypothèse, changer de régime.</li>
      <li><span class="step">Dynamique</span> : en régime de Stokes, \(v\) tend vers \(v_\ell\) exponentiellement, avec \(\tau = m/(6\pi\eta R)\).</li>
    </ol>
    <p style="margin-top:.4rem"><em>Pièges</em> : négliger la poussée d'Archimède dans un liquide ; construire Re sur le rayon au lieu du diamètre ; prendre l'aire latérale au lieu du maître-couple.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Du microcanal à l'avion de ligne : ordres de grandeur</h3>
  <div class="statement">Données : eau \(\nu = 1{,}0\times10^{-6}\ \text{m}^2/\text{s}\) ; huile moteur \(\nu_f = 4{,}0\times10^{-4}\ \text{m}^2/\text{s}\) au démarrage à froid et \(\nu_c = 1{,}2\times10^{-5}\ \text{m}^2/\text{s}\) moteur chaud (100 °C) ; air au sol \(\nu = 1{,}5\times10^{-5}\ \text{m}^2/\text{s}\) ; air à l'altitude de croisière \(\nu = 4{,}0\times10^{-5}\ \text{m}^2/\text{s}\).</div>
  <div class="q"><strong>Q1.</strong> Une puce microfluidique fait circuler de l'eau à \(2\ \text{mm/s}\) dans un canal de largeur \(100\ \mu\text{m}\). Calculer Re et qualifier l'écoulement.</div>
  <div class="q"><strong>Q2.</strong> Dans une canalisation de graissage de diamètre \(8\ \text{mm}\), l'huile circule à \(2{,}5\ \text{m/s}\). Calculer Re à froid et à chaud. À débit égal, dans quel rapport la chute de pression le long de la canalisation change-t-elle entre les deux situations ?</div>
  <div class="q"><strong>Q3.</strong> Une aile d'avion de ligne de corde \(5\ \text{m}\) se déplace à \(250\ \text{m/s}\) en altitude. Calculer Re et estimer l'épaisseur de la couche limite. Le modèle d'écoulement parfait est-il pertinent autour de l'aile ?</div>
  <div class="q"><strong>Q4.</strong> On veut essayer une maquette au 1/20 de cette aile dans une soufflerie à air ambiant. Quelle vitesse faudrait-il pour respecter la similitude de Reynolds ? Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\mathrm{Re} = \dfrac{VL}{\nu} = \dfrac{2\times10^{-3}\times1\times10^{-4}}{1{,}0\times10^{-6}} = 0{,}2\). Écoulement laminaire, quasi rampant : l'inertie est négligeable, il n'y a pas de turbulence pour mélanger, et deux liquides injectés côte à côte ne se mélangent que par diffusion moléculaire (lentement). C'est une difficulté classique de la microfluidique.</p>
    <p><strong>Q2.</strong> À froid : \(\mathrm{Re} = 2{,}5\times8\times10^{-3}/4{,}0\times10^{-4} = 50\) ; à chaud : \(\mathrm{Re} \approx 1{,}7\times10^{3}\). L'écoulement est laminaire dans les deux cas (à chaud, assez près du seuil). En laminaire, la loi de Poiseuille donne \(\Delta P \propto \eta\,D_v\) : à débit égal, la chute de pression est dans le rapport des viscosités, soit environ \(\nu_f/\nu_c \approx 33\) (la masse volumique varie peu). Au démarrage à froid, la pompe à huile ne peut pas fournir une telle pression (un clapet de décharge la limite) : le débit de graissage chute, d'où l'usure accrue des premières minutes.</p>
    <p><strong>Q3.</strong> \(\mathrm{Re} = 250\times5/4{,}0\times10^{-5} \approx 3{,}1\times10^{7}\). \(\delta \sim L/\sqrt{\mathrm{Re}} \approx 5/5{,}6\times10^{3} \approx 0{,}9\ \text{mm}\). À ce Reynolds la couche limite devient turbulente peu après le bord d'attaque et atteint en réalité quelques centimètres au bord de fuite, mais elle reste très mince devant la corde : hors de cette couche et du sillage, le modèle parfait décrit bien l'écoulement (c'est lui qui permet de calculer la portance).</p>
    <p><strong>Q4.</strong> Même Re : \(V_m\,L_m/\nu_m = V L/\nu\), donc</p>
    <div class="formula">$$V_m = V\,\frac{L}{L_m}\,\frac{\nu_m}{\nu} = 250\times20\times\frac{1{,}5}{4{,}0} \approx 1{,}9\times10^{3}\ \text{m/s}$$</div>
    <p>C'est plus de cinq fois la vitesse du son : irréalisable, et la compressibilité changerait tout. On utilise des souffleries pressurisées et cryogéniques (\(\nu\) diminue quand la pression augmente ou quand la température baisse), ou l'on extrapole des essais menés à Reynolds plus faible.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Palier lisse : film d'huile cisaillé</h3>
  <div class="statement">Un arbre de rayon \(R = 25\ \text{mm}\) tourne à \(N = 3000\ \text{tr/min}\) dans un coussinet de longueur \(\ell = 40\ \text{mm}\). Le jeu radial \(e = 40\ \mu\text{m}\) est rempli d'huile (\(\eta = 3{,}0\times10^{-2}\ \text{Pa·s}\), \(\rho = 870\ \text{kg/m}^3\)). Comme \(e \ll R\), on modélise localement le film comme une couche d'huile comprise entre un plan fixe (\(y = 0\), coussinet) et un plan mobile de vitesse \(U\,\vec e_x\) (\(y = e\), surface de l'arbre). L'écoulement est stationnaire, de la forme \(\vec v = v_x(y)\,\vec e_x\), sans gradient de pression selon \(x\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(U\) puis le nombre de Reynolds construit sur \(e\). Conclure.</div>
  <div class="q"><strong>Q2.</strong> Par un bilan des forces sur une tranche de fluide comprise entre \(y\) et \(y+\mathrm{d}y\), montrer que le profil de vitesse est linéaire. L'exprimer.</div>
  <div class="q"><strong>Q3.</strong> En déduire la force exercée par l'huile sur l'arbre, le couple résistant et la puissance perdue.</div>
  <div class="q"><strong>Q4.</strong> Retrouver cette puissance à partir de la puissance dissipée par unité de volume. Que devient-elle ? Comment varie-t-elle si l'on double la vitesse de rotation ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega = 2\pi N/60 = 314\ \text{rad/s}\), \(U = R\omega = 7{,}85\ \text{m/s}\). \(\mathrm{Re} = \rho U e/\eta \approx 9\) (avec \(e = 4{,}0\times10^{-5}\ \text{m}\)) : écoulement laminaire (régime de lubrification).</p>
    <p><strong>Q2.</strong> Tranche d'aire \(S\) : le fluide du dessus exerce \(+\eta S\,v_x'(y+\mathrm{d}y)\,\vec e_x\), celui du dessous \(-\eta S\,v_x'(y)\,\vec e_x\) ; les forces de pression se compensent et le poids n'a pas de composante selon \(x\). En régime stationnaire, la quantité de mouvement de la tranche est constante : \(\eta S\,v_x''(y)\,\mathrm{d}y = 0\), donc \(v_x\) est affine. Avec l'adhérence \(v_x(0) = 0\) et \(v_x(e) = U\) : \(v_x(y) = U\,y/e\) (écoulement de Couette plan).</p>
    <p><strong>Q3.</strong> L'arbre est du côté des \(y\) croissants ; l'huile (en dessous) exerce sur lui la contrainte \(-\eta\,U/e\) selon \(\vec e_x\), opposée au mouvement. \(\tau = \eta U/e \approx 5{,}9\times10^{3}\ \text{Pa}\). Force sur la surface \(2\pi R\ell\) : \(F = \tau\,2\pi R\ell \approx 37\ \text{N}\). Couple résistant : \(\Gamma = FR \approx 0{,}93\ \text{N·m}\). Puissance perdue : \(\mathcal{P} = \Gamma\omega \approx 2{,}9\times10^{2}\ \text{W}\).</p>
    <p><strong>Q4.</strong> Puissance volumique dissipée : \(\eta\,(U/e)^2\), uniforme dans le film ; volume du film \(2\pi R\ell e\). Produit : \(\eta U^2\,2\pi R\ell/e = F U \approx 2{,}9\times10^{2}\ \text{W}\) : on retrouve exactement la puissance du couple résistant. Elle est convertie en énergie interne de l'huile, qui s'échauffe ; il faut la faire circuler et la refroidir. \(\mathcal{P} = \eta\,(R\omega)^2\,2\pi R\ell/e \propto \omega^2\) : doubler la vitesse multiplie la puissance perdue par 4 (et l'échauffement, en baissant \(\eta\), atténue partiellement l'effet).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Perfusion par gravité : résistances hydrauliques en série</h3>
  <div class="statement">Une poche souple de soluté (\(\rho = 1{,}0\times10^{3}\ \text{kg/m}^3\), \(\eta = 1{,}0\times10^{-3}\ \text{Pa·s}\)) est suspendue de sorte que la surface du liquide se trouve à \(H = 0{,}90\ \text{m}\) au-dessus du point d'injection ; la pression y vaut la pression atmosphérique \(P_0\) (poche souple). Le liquide traverse une tubulure (longueur \(L_1 = 1{,}5\ \text{m}\), diamètre intérieur \(d_1 = 3{,}0\ \text{mm}\)) puis un cathéter (\(L_2 = 40\ \text{mm}\), \(d_2 = 0{,}40\ \text{mm}\)) et débouche dans une veine où règne la pression \(P_0 + p_v\), avec \(p_v = 1{,}0\ \text{kPa}\). On néglige d'abord les termes d'énergie cinétique et les pertes singulières.</div>
  <div class="q"><strong>Q1.</strong> Rappeler l'expression de la résistance hydraulique d'un tube en régime laminaire. Calculer \(R_1\) (tubulure) et \(R_2\) (cathéter). Commenter.</div>
  <div class="q"><strong>Q2.</strong> À l'aide du théorème de Bernoulli généralisé entre la surface du liquide et la sortie du cathéter, montrer que \(\rho g H - p_v = (R_1 + R_2)\,D_v\). Calculer le débit en mL/h et la durée d'écoulement d'une poche de 500 mL.</div>
  <div class="q"><strong>Q3.</strong> Vérifier que les écoulements sont laminaires dans les deux tubes. Évaluer le terme d'énergie cinétique négligé en sortie du cathéter et conclure.</div>
  <div class="q"><strong>Q4.</strong> À quelle hauteur faut-il placer la poche pour diviser le débit par deux ? Que se passerait-il avec un cathéter de diamètre \(0{,}60\ \text{mm}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(R_h = \dfrac{8\eta L}{\pi r^4} = \dfrac{128\,\eta L}{\pi d^4}\). A.N. (en Pa·s·m⁻³) :</p>
    <div class="formula">$$R_1 = \frac{128\times10^{-3}\times1{,}5}{\pi\,(3{,}0\times10^{-3})^4} \approx 7{,}5\times10^{8}$$</div>
    <div class="formula">$$R_2 = \frac{128\times10^{-3}\times0{,}040}{\pi\,(4{,}0\times10^{-4})^4} \approx 6{,}4\times10^{10}$$</div>
    <p>Le cathéter, pourtant 37 fois plus court, est 7,5 fois plus fin : \(R_2/R_1 = (L_2/L_1)(d_1/d_2)^4 \approx 84\). C'est lui qui fixe le débit ; la tubulure ne compte que pour 1 %.</p>
    <p><strong>Q2.</strong> Entre la surface (1 : \(P_0\), \(v\approx0\), \(z = H\)) et la sortie (2 : \(P_0 + p_v\), \(z = 0\), énergie cinétique négligée) : \(\dfrac{P_0}{\rho g} + H = \dfrac{P_0 + p_v}{\rho g} + \Delta h\), soit \(\rho g\,\Delta h = \rho g H - p_v\). Les pertes sont celles de deux tubes en série, parcourus par le même débit : \(\rho g\,\Delta h = (R_1 + R_2)D_v\). A.N. : \(\rho g H - p_v = 8{,}83 - 1{,}0 \approx 7{,}8\ \text{kPa}\) ; \(D_v = \dfrac{7{,}83\times10^{3}}{6{,}44\times10^{10}}\) \(\approx 1{,}2\times10^{-7}\ \text{m}^3/\text{s}\), soit \(0{,}12\ \text{mL/s} \approx 4{,}4\times10^{2}\ \text{mL/h}\). Une poche de 500 mL s'écoule en 1,1 h environ (1 h 09 min), en négligeant la baisse du niveau dans la poche.</p>
    <p><strong>Q3.</strong> Cathéter : \(v_2 = D_v/(\pi d_2^2/4) \approx 0{,}97\ \text{m/s}\), \(\mathrm{Re}_2 = v_2 d_2/\nu \approx 3{,}9\times10^{2}\). Tubulure : \(v_1 \approx 1{,}7\ \text{cm/s}\), \(\mathrm{Re}_1 \approx 52\). Les deux écoulements sont laminaires : Poiseuille s'applique. Énergie cinétique volumique du jet en sortie : \(\tfrac12\rho v_2^2 \approx 4{,}7\times10^{2}\ \text{Pa}\), soit 6 % de la pression motrice ; la prendre en compte (modèle 1D) réduirait le débit d'environ 5 %. Le profil étant parabolique en sortie, le flux d'énergie cinétique réel est deux fois plus grand (voir la limite du modèle 1D, §4) : la correction approche alors 10 %. L'approximation reste acceptable pour un ordre de grandeur.</p>
    <p><strong>Q4.</strong> Il faut diviser par deux la pression motrice : \(\rho g H' - p_v = 3{,}9\ \text{kPa}\), d'où \(\rho g H' = 4{,}9\ \text{kPa}\) et \(H' \approx 0{,}50\ \text{m}\). (On peut aussi ajouter, avec la molette de la tubulure, une résistance égale à \(R_1 + R_2\).) Avec \(d_2 = 0{,}60\ \text{mm}\), \(R_2\) est divisée par \((1{,}5)^4 \approx 5\) et le débit serait multiplié par près de 5 selon ce modèle ; mais la vitesse en sortie dépasserait alors 2 m/s et l'énergie cinétique (près de 30 % de la pression motrice) ne serait plus négligeable : le modèle devrait être affiné.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Une bille, deux régimes de traînée</h3>
  <div class="statement"><em>Partie A.</em> Dans un viscosimètre, une bille d'acier (rayon \(R = 1{,}00\ \text{mm}\), \(\rho_s = 7{,}80\times10^{3}\ \text{kg/m}^3\)) tombe dans une éprouvette remplie d'un liquide visqueux (\(\rho_f = 1{,}26\times10^{3}\ \text{kg/m}^3\)). En régime établi, elle parcourt \(10{,}0\ \text{cm}\) en \(6{,}50\ \text{s}\). <em>Partie B.</em> La même bille est lâchée sans vitesse initiale dans l'air (\(\rho_a = 1{,}2\ \text{kg/m}^3\), \(\eta_a = 1{,}8\times10^{-5}\ \text{Pa·s}\)), depuis le toit d'un immeuble. On prend \(g = 9{,}81\ \text{m/s}^2\).</div>
  <div class="q"><strong>Q1.</strong> En supposant la traînée donnée par la loi de Stokes, établir l'expression de la vitesse limite de la bille. En déduire la viscosité \(\eta\) du liquide.</div>
  <div class="q"><strong>Q2.</strong> Vérifier a posteriori l'hypothèse faite.</div>
  <div class="q"><strong>Q3.</strong> Déterminer le temps caractéristique d'établissement de la vitesse limite. La mesure effectuée est-elle bien une mesure de vitesse limite ?</div>
  <div class="q"><strong>Q4.</strong> Montrer que la loi de Stokes conduit à une vitesse limite absurde dans l'air.</div>
  <div class="q"><strong>Q5.</strong> On adopte une traînée quadratique avec \(C_x = 0{,}45\). Calculer la vitesse limite \(v_\ell\) de la bille dans l'air et vérifier la cohérence du régime.</div>
  <div class="q"><strong>Q6.</strong> On note \(z\) la hauteur de chute. En écrivant le principe fondamental sous la forme \(m\,v\,\dfrac{\mathrm{d}v}{\mathrm{d}z} = \ldots\), établir \(v^2(z)\). Quelle hauteur faut-il pour atteindre 95 % de \(v_\ell\) ? Comparer à la partie A.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Bille de volume \(V = \tfrac43\pi R^3\) : poids \(\rho_s V g\), poussée d'Archimède \(\rho_f V g\), traînée \(6\pi\eta R v\). En régime établi : \((\rho_s - \rho_f)\tfrac43\pi R^3 g = 6\pi\eta R\,v_\ell\), d'où</p>
    <div class="formula">$$v_\ell = \frac{2(\rho_s - \rho_f)\,g R^2}{9\eta} \qquad \eta = \frac{2(\rho_s - \rho_f)\,g R^2}{9\,v_\ell}$$</div>
    <p>\(v_\ell = 0{,}100/6{,}50 = 1{,}54\times10^{-2}\ \text{m/s}\), donc, avec \(\rho_s - \rho_f = 6{,}54\times10^{3}\ \text{kg/m}^3\) : \(\eta \approx 0{,}93\ \text{Pa·s}\) (ordre de grandeur de la glycérine tiède).</p>
    <p><strong>Q2.</strong> \(\mathrm{Re} = \rho_f v_\ell\,(2R)/\eta \approx 4\times10^{-2}\), bien inférieur à 1 : la loi de Stokes est justifiée.</p>
    <p><strong>Q3.</strong> PFD : \(m\dot v = (m - \rho_f V)g - 6\pi\eta R v\), équation du premier ordre de temps caractéristique \(\tau = m/(6\pi\eta R)\). Avec \(m = \rho_s\tfrac43\pi R^3 = 3{,}3\times10^{-5}\ \text{kg}\) : \(\tau \approx 1{,}9\ \text{ms}\). La vitesse limite est atteinte en quelques millisecondes, sur moins d'un dixième de millimètre : la mesure sur 10 cm concerne bien le régime établi (il faut seulement que la bille reste loin des parois de l'éprouvette).</p>
    <p><strong>Q4.</strong> Stokes (poussée d'Archimède négligeable : \(\rho_a/\rho_s \approx 1{,}5\times10^{-4}\)) : \(v = \dfrac{2\rho_s g R^2}{9\eta_a} \approx 9{,}4\times10^{2}\ \text{m/s}\), près de trois fois la vitesse du son ! Le Reynolds correspondant, \(\rho_a v\,(2R)/\eta_a \approx 1{,}3\times10^{5}\), contredit totalement l'hypothèse \(\mathrm{Re}\ll1\).</p>
    <p><strong>Q5.</strong> \(mg = \tfrac12\rho_a\,\pi R^2\,C_x\,v_\ell^2\) avec \(m = \rho_s\tfrac43\pi R^3\) : \(v_\ell = \sqrt{\dfrac{8\rho_s g R}{3\rho_a C_x}} \approx 19\ \text{m/s}\) (70 km/h). Reynolds : \(\rho_a v_\ell (2R)/\eta_a \approx 2{,}6\times10^{3}\), dans le domaine \(10^3\)–\(2\times10^5\) où \(C_x\) est à peu près constant : cohérent.</p>
    <p><strong>Q6.</strong> Traînée \(k v^2\) avec \(k = mg/v_\ell^2\) : \(m\,v\,\dfrac{\mathrm{d}v}{\mathrm{d}z} = mg\left(1 - \dfrac{v^2}{v_\ell^2}\right)\). Avec \(u = v^2\) : \(\dfrac{\mathrm{d}u}{\mathrm{d}z} + \dfrac{2g}{v_\ell^2}\,u = 2g\) et \(u(0) = 0\), d'où</p>
    <div class="formula">$$v^2(z) = v_\ell^2\left[1 - \exp\left(-\frac{z}{\ell}\right)\right]\qquad \ell = \frac{v_\ell^2}{2g} \approx 19\ \text{m}$$</div>
    <p>\(v = 0{,}95\,v_\ell\) pour \(\exp(-z/\ell) = 1 - 0{,}95^2\), soit \(z = \ell\,\ln(10{,}3) \approx 45\ \text{m}\) : une quinzaine d'étages. Dans le liquide visqueux (partie A), le régime limite s'établissait sur quelques centièmes de millimètre (\(v_\ell\,\tau \approx 3\times10^{-5}\ \text{m}\)). La traînée quadratique dans l'air, fluide peu dense et peu visqueux, n'équilibre le poids qu'à grande vitesse, après une longue chute.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Venturi et Pitot sur une conduite d'eau</h3>
  <div class="statement">Une conduite horizontale de diamètre \(D = 80\ \text{mm}\) transporte de l'eau (\(\rho = 1{,}00\times10^{3}\ \text{kg/m}^3\), \(\nu = 1{,}0\times10^{-6}\ \text{m}^2/\text{s}\)). Elle comporte un tube de Venturi : convergent jusqu'à un col de diamètre \(d = 40\ \text{mm}\), puis divergent progressif. Un capteur différentiel mesure \(\Delta p_V = P_1 - P_2 = 9{,}0\ \text{kPa}\) entre la section amont (1) et le col (2). Plus loin, un tube de Pitot placé sur l'axe de la conduite indique \(\Delta p_P = 0{,}88\ \text{kPa}\) (pression d'arrêt moins pression statique).</div>
  <div class="q"><strong>Q1.</strong> Établir l'expression du débit volumique en fonction de \(\Delta p_V\) en précisant les hypothèses. Calculer \(D_v\) et la vitesse débitante \(v_d\) dans la conduite.</div>
  <div class="q"><strong>Q2.</strong> Calculer le nombre de Reynolds dans la conduite. Pourquoi le théorème de Bernoulli reste-t-il acceptable dans le convergent ?</div>
  <div class="q"><strong>Q3.</strong> Déduire de la mesure du Pitot la vitesse sur l'axe. Comparer à \(v_d\) et commenter.</div>
  <div class="q"><strong>Q4.</strong> Le modèle parfait prévoit qu'en aval du divergent la pression redevient égale à \(P_1\). Pourquoi le divergent doit-il être progressif ? Estimer la perte de charge si l'on remplaçait le divergent par un élargissement brusque.</div>
  <div class="q"><strong>Q5.</strong> La pression absolue en amont vaut \(P_1 = 1{,}20\times10^{5}\ \text{Pa}\). Vérifier l'absence de cavitation au col (\(P_{\text{sat}} = 2{,}3\ \text{kPa}\) à 20 °C). Quel débit maximal le Venturi peut-il mesurer sans cavitation ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Hypothèses : écoulement parfait, permanent, incompressible, homogène, modèle 1D, conduite horizontale. Débit : \(S_1 v_1 = S_2 v_2\). Bernoulli : \(P_1 - P_2 = \tfrac12\rho(v_2^2 - v_1^2)\), soit \(P_1 - P_2 = \tfrac12\rho v_2^2\left(1 - S_2^2/S_1^2\right)\). D'où \(D_v = S_2\sqrt{\dfrac{2\Delta p_V}{\rho(1 - S_2^2/S_1^2)}}\). Ici \(S_2/S_1 = (d/D)^2 = 1/4\) : \(v_2 = \sqrt{\dfrac{2\times9{,}0\times10^{3}}{10^{3}\times0{,}9375}}\) \(\approx 4{,}38\ \text{m/s}\), \(D_v = \pi(0{,}020)^2\times4{,}38 \approx 5{,}5\times10^{-3}\ \text{m}^3/\text{s}\) (5,5 L/s, environ 20 m³/h). \(v_d = v_2/4 \approx 1{,}10\ \text{m/s}\).</p>
    <p><strong>Q2.</strong> \(\mathrm{Re} = v_d D/\nu \approx 8{,}8\times10^{4}\) : turbulent. Dans un convergent court, l'écoulement est accéléré : les couches limites restent minces et ne décollent pas, la dissipation est faible (le débit réel est inférieur de 1 à 2 % à la valeur calculée, ce que l'on corrige par un coefficient de décharge voisin de 0,98). Le profil turbulent étant plat, le modèle 1D est bon.</p>
    <p><strong>Q3.</strong> Bernoulli le long de la ligne de courant de l'axe, jusqu'au point d'arrêt : \(v_{\text{axe}} = \sqrt{2\Delta p_P/\rho} \approx 1{,}33\ \text{m/s}\). Rapport \(v_d/v_{\text{axe}} \approx 0{,}83\) : profil très aplati, caractéristique d'un écoulement turbulent (Poiseuille donnerait 0,5). Un Pitot placé sur l'axe surestime donc la vitesse moyenne d'environ 20 %.</p>
    <p><strong>Q4.</strong> Dans le divergent, le fluide ralentit et la pression augmente vers l'aval : c'est la situation qui provoque le décollement de la couche limite. Un angle d'ouverture faible (quelques degrés) évite le décollement et permet de récupérer l'essentiel de la pression (perte de l'ordre de 10 à 20 % de \(\Delta p_V\)). Élargissement brusque : \(K = (1 - S_2/S_1)^2 = 0{,}5625\) rapporté à \(v_2\) : \(\Delta P = K\,\tfrac12\rho v_2^2\) \(\approx 0{,}56\times9{,}6\ \text{kPa} \approx 5{,}4\ \text{kPa}\), soit 60 % de \(\Delta p_V\) perdus définitivement.</p>
    <p><strong>Q5.</strong> \(P_2 = P_1 - \Delta p_V = 1{,}11\times10^{5}\ \text{Pa} \gg P_{\text{sat}}\) : pas de cavitation. Limite : \(P_2 = P_{\text{sat}}\), soit \(\Delta p_{\max} = P_1 - P_{\text{sat}} \approx 1{,}18\times10^{5}\ \text{Pa}\). Comme \(D_v \propto \sqrt{\Delta p}\) : \(D_{v,\max} = 5{,}5\times\sqrt{118/9{,}0}\) \(\approx 20\ \text{L/s}\), environ 3,6 fois le débit nominal.</p>
  </div>
</div>
