  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre le corps pur diphasé de la partie 3.1 du programme de PTSI, les enthalpies de changement d'état de la partie 3.3 et la relation \(\Delta h_{12} = T\,\Delta s_{12}\) de la partie 3.4 : <strong>tout y est exigible en 1ʳᵉ année</strong>, sauf les deux dernières sections. Il s'appuie sur <a href="#thermo1/cours">« Introduction thermodynamique »</a> (variables d'état, phases condensées), <a href="#thermo2/cours">« 1er principe »</a> (enthalpie, bilans monobares) et <a href="#thermo3/cours">« 2e principe »</a> (bilans d'entropie). Il est la base de la thermodynamique industrielle de 2ᵉ année : <a href="#thermodiff/cours">« Thermodynamique différentielle et fluides réels »</a>, <a href="#thermoouv/cours">« Systèmes ouverts et thermodynamique industrielle »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Corps pur diphasé en équilibre</strong> : changements d'état, palier de température sous pression constante (§1).</li>
        <li><strong>Diagramme de phases (P, T)</strong> : analyser un diagramme de phase expérimental ; y positionner les phases ; point triple, point critique (§2).</li>
        <li><strong>Variables d'état</strong> : proposer un jeu de variables suffisant pour caractériser l'état d'équilibre d'un corps pur diphasé soumis aux seules forces de pression (§3).</li>
        <li><strong>Diagramme de Clapeyron (P, v)</strong> de l'équilibre liquide-vapeur : y positionner les phases ; allure des isothermes (§4).</li>
        <li><strong>Titre en vapeur</strong> : déterminer la composition d'un mélange diphasé en un point d'un diagramme (P, v) (§5, §6).</li>

      </ul>

<div class="course-section">
  <div class="sec-num">§1 · PHASES ET CHANGEMENTS D'ÉTAT</div>
  <h2>Un corps pur, plusieurs phases</h2>
  <div class="intro">L'eau existe sous forme de glace, de liquide et de vapeur. Les machines thermiques (centrales électriques, réfrigérateurs, pompes à chaleur) utilisent les changements d'état d'un fluide parce qu'ils échangent beaucoup d'énergie sans que la température varie. Cette section fixe le vocabulaire et le fait expérimental central : sous pression fixée, un corps pur change d'état à température fixée.</div>
  <div class="def-box">
    <strong>Phase.</strong> Une <strong>phase</strong> est une partie d'un système dans laquelle les grandeurs intensives (masse volumique, indice optique…) varient de façon continue. Un verre d'eau avec trois glaçons contient deux phases (solide et liquide), quel que soit le nombre de glaçons. Un <strong>corps pur</strong> est constitué d'une seule espèce chimique (H₂O, CO₂…). Il est <strong>diphasé</strong> quand deux de ses phases coexistent.
  </div>

  <p>Les six <strong>changements d'état</strong> se répartissent en trois couples de transformations inverses : <strong>fusion</strong> (solide → liquide) et <strong>solidification</strong> ; <strong>vaporisation</strong> (liquide → gaz) et <strong>liquéfaction</strong> ; <strong>sublimation</strong> (solide → gaz) et <strong>condensation</strong> (gaz → solide). Dans le langage courant, on dit souvent « condensation » pour la liquéfaction de la vapeur (buée sur une vitre).</p>
  <div class="prop-box">
    <strong>Palier de changement d'état.</strong> Sous une pression \(P\) fixée, un corps pur change d'état à une température fixée, la température d'équilibre \(T_{12}(P)\). Tant que les deux phases coexistent, l'énergie reçue sert à faire passer de la matière d'une phase à l'autre, et la température ne varie pas : la courbe \(T(t)\) d'un chauffage à puissance constante présente un <strong>palier</strong>.
  </div>

  <div class="method-box">
    <strong>Exemple — combien de temps pour chaque étape ?</strong>
    <p>On chauffe 1,0 kg de glace à −20 °C sous la pression atmosphérique, avec une puissance \(\mathcal P = 1{,}0\ \text{kW}\) entièrement reçue par l'eau. Données : \(c_{\text{glace}} = 2{,}1\ \text{kJ·K}^{-1}\text{·kg}^{-1}\), \(c_{\text{eau}} = 4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\), enthalpies de fusion \(334\ \text{kJ·kg}^{-1}\) et de vaporisation \(2\,257\ \text{kJ·kg}^{-1}\) (§7).</p>
    <ol>
      <li>Glace de −20 à 0 °C : \(Q_1 = 1{,}0\times2{,}1\times20 = 42\ \text{kJ}\), soit \(t_1 = Q_1/\mathcal P = 42\ \text{s}\).</li>
      <li>Fusion à 0 °C : \(334\ \text{kJ}\), soit 5 min 34 s de palier.</li>
      <li>Eau liquide de 0 à 100 °C : \(1{,}0\times4{,}18\times100 = 418\ \text{kJ}\), soit 7 min.</li>
      <li>Vaporisation à 100 °C : \(2\,257\ \text{kJ}\), soit 37,6 min de palier.</li>
    </ol>
    <p>Il faut près de 51 minutes pour tout vaporiser, dont les trois quarts sur le palier d'ébullition : vaporiser l'eau coûte cinq fois plus que la porter de 0 à 100 °C.</p>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · LE DIAGRAMME DE PHASES (P, T)</div>
  <h2>La carte des domaines d'existence</h2>
  <div class="intro">Le diagramme (P, T) indique, pour chaque couple (pression, température), la phase stable du corps pur. On y lit d'un coup d'œil les températures de fusion et d'ébullition sous n'importe quelle pression, et l'on y suit une transformation.</div>
  <div class="def-box">
    <strong>Diagramme de phases (P, T).</strong> Trois <strong>courbes d'équilibre</strong> séparent les domaines du solide, du liquide et du gaz : courbe de <strong>fusion</strong> (solide-liquide), de <strong>vaporisation</strong> (liquide-vapeur), de <strong>sublimation</strong> (solide-vapeur). Sur une courbe, les deux phases coexistent en équilibre : \(P\) et \(T\) y sont liées, \(P = P_{12}(T)\).
    <ul>
      <li>Le <strong>point triple</strong> T, où les trois courbes se rejoignent, est le seul état où les trois phases coexistent.</li>
      <li>La courbe de vaporisation s'arrête au <strong>point critique</strong> C \((T_c, P_c)\). Au-delà (\(T \gt T_c\) et \(P \gt P_c\)), on ne distingue plus liquide et gaz : c'est le domaine du <strong>fluide supercritique</strong>. On peut passer continûment du liquide au gaz en contournant C, sans jamais observer de palier.</li>
    </ul>
  </div>

  <div class="prop-box">
    <strong>Lecture d'un diagramme (P, T).</strong>
    <ul>
      <li>Haute pression et basse température : solide ; haute température et basse pression : gaz ; le liquide occupe le domaine intermédiaire, au-dessus du point triple.</li>
      <li>Une transformation isobare est une droite horizontale : chaque courbe traversée est un changement d'état, à la température lue à l'intersection.</li>
      <li>La pente de la courbe de fusion est positive pour presque tous les corps purs (le solide est plus dense que le liquide). L'eau fait exception : la glace (\(917\ \text{kg·m}^{-3}\)) flotte sur l'eau liquide, et sa courbe de fusion penche vers la gauche.</li>
      <li>Si \(P_{\text{triple}}\) est supérieure à la pression atmosphérique (cas de CO₂), le corps pur ne peut pas être liquide à l'air libre.</li>
    </ul>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Corps pur</th><th style="text-align:left">Point triple</th><th style="text-align:left">Point critique</th></tr>
    <tr><td>Eau</td><td>0,01 °C ; 611 Pa</td><td>374 °C ; 221 bar</td></tr>
    <tr><td>Dioxyde de carbone</td><td>−56,6 °C ; 5,18 bar</td><td>31,0 °C ; 73,8 bar</td></tr>
    <tr><td>Diazote</td><td>−210 °C ; 0,125 bar</td><td>−147 °C ; 34,0 bar</td></tr>
    <tr><td>Ammoniac</td><td>−77,7 °C ; 0,061 bar</td><td>132 °C ; 114 bar</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — le patineur fait-il fondre la glace ?</strong>
    <p>Un patineur de 70 kg se tient sur une lame dont la surface de contact vaut \(2\ \text{mm}\times20\ \text{cm} = 4{,}0\times10^{-4}\ \text{m}^2\). Près de 0 °C, la courbe de fusion de l'eau a une pente \(\mathrm dT/\mathrm dP \approx -7{,}4\times10^{-3}\ \text{K·bar}^{-1}\).</p>
    <ol>
      <li>Surpression sous la lame : \(\dfrac{mg}{S} = \dfrac{70\times9{,}81}{4{,}0\times10^{-4}} \approx 1{,}7\times10^{6}\ \text{Pa}\), soit 17 bar.</li>
      <li>Abaissement de la température de fusion : \(17\times7{,}4\times10^{-3} \approx 0{,}13\ \text{K}\).</li>
      <li>Sur une patinoire à −5 °C, la glace sous la lame reste donc solide : la pression n'explique pas la glisse. Le frottement, qui échauffe la surface, et la mince couche quasi liquide présente à la surface de la glace en sont responsables.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — lyophilisation et glace carbonique</strong>
    <ol>
      <li>La courbe de sublimation de l'eau donne \(P_{\text{sub}}(-20\ °\text{C}) = 103\ \text{Pa}\). Dans une enceinte à −20 °C où l'on pompe la vapeur sous une pression plus faible (10 à 50 Pa), la glace d'un aliment congelé se sublime sans fondre : c'est la lyophilisation (café soluble, aliments des astronautes).</li>
      <li>Pour CO₂, la droite \(P = 1\ \text{atm}\) ne coupe que la courbe de sublimation, à −78,5 °C : la « glace carbonique » se sublime sans fondre. Pour obtenir du CO₂ liquide, il faut une pression supérieure à 5,18 bar (bouteilles d'extincteurs, sous 57 bar à 20 °C).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · L'ÉQUILIBRE LIQUIDE-VAPEUR</div>
  <h2>Pression de vapeur saturante et variables d'état</h2>
  <div class="intro">L'équilibre liquide-vapeur est celui des chaudières, des condenseurs et des cocottes-minute. Sa loi tient en une phrase : à une température donnée, liquide et vapeur ne coexistent que sous une seule pression. Il en découle le choix des variables qui décrivent un mélange diphasé.</div>
  <div class="def-box">
    <strong>Pression de vapeur saturante.</strong> La pression d'équilibre liquide-vapeur à la température \(T\) est la <strong>pression de vapeur saturante</strong> \(P_{\text{sat}}(T)\), fonction croissante de \(T\) définie entre le point triple et le point critique. Inversement, sous la pression \(P\), le liquide bout à la <strong>température d'ébullition</strong> \(T_{\text{sat}}(P)\). Le liquide en équilibre avec sa vapeur est dit <strong>saturant</strong>, la vapeur en équilibre avec le liquide, <strong>saturante</strong>. Une vapeur à \(T \gt T_{\text{sat}}(P)\) est <strong>sèche</strong> (ou surchauffée).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">θ (°C)</th><td>0,01</td><td>20</td><td>50</td><td>80</td><td>100</td><td>120</td><td>150</td><td>200</td><td>300</td><td>374</td></tr>
    <tr><th style="text-align:left">\(P_{\text{sat}}\) (bar)</th><td>0,0061</td><td>0,023</td><td>0,124</td><td>0,474</td><td>1,014</td><td>1,99</td><td>4,76</td><td>15,5</td><td>85,9</td><td>221</td></tr>
  </table></div>
  <p style="font-size:.9em">Pression de vapeur saturante de l'eau (valeurs calculées avec l'équation d'état de référence IAPWS-95).</p>
  <div class="method-box">
    <strong>Exemple — cuisson en montagne et autocuiseur</strong>
    <ol>
      <li>Au sommet du mont Blanc, la pression atmosphérique vaut environ \(0{,}55\ \text{bar}\). D'après la courbe \(P_{\text{sat}}(T)\), l'eau y bout vers 84 °C : les pâtes cuisent mal.</li>
      <li>Un autocuiseur dont la soupape s'ouvre à 0,9 bar au-dessus de la pression atmosphérique maintient l'eau sous 1,9 bar environ (si l'air en a été chassé par la vapeur) : elle bout alors vers 119 °C, et la cuisson est deux à trois fois plus rapide.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Variables d'état d'un corps pur diphasé.</strong> Pour un corps pur <strong>monophasé</strong> de masse \(m\), deux variables intensives indépendantes, par exemple \((P, T)\), fixent l'état. Pour un corps pur <strong>diphasé</strong> en équilibre, \(P\) et \(T\) ne sont plus indépendantes (\(P = P_{\text{sat}}(T)\)) : il faut <strong>une variable de température ou de pression et une variable de composition</strong>, par exemple \((T, x)\) avec le titre en vapeur \(x\) (§5), ou \((T, v)\) avec le volume massique \(v\).
  </div>
  <div class="method-box">
    <strong>Exemple — même \((P, T)\), états différents</strong>
    <p>Deux récipients contiennent chacun 1 kg d'eau à 100 °C sous 1,014 bar. Le premier contient 10 g de vapeur, le second 900 g. Avec \(v_L = 1{,}04\times10^{-3}\ \text{m}^3\text{·kg}^{-1}\) et \(v_V = 1{,}67\ \text{m}^3\text{·kg}^{-1}\) (§4), leurs volumes valent \(0{,}01\times1{,}67 + 0{,}99\times0{,}001\,04 \approx 0{,}018\ \text{m}^3\) et \(0{,}90\times1{,}67 + 0{,}10\times0{,}001\,04 \approx 1{,}50\ \text{m}^3\) : un même couple \((P, T)\), deux états très différents. Le titre (ou le volume massique) les distingue.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : vouloir mesurer la quantité de gaz d'une bouteille de butane avec un manomètre. Tant qu'il reste du liquide, la pression vaut \(P_{\text{sat}}(T)\), qu'elle soit pleine ou presque vide ; on pèse la bouteille.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LE DIAGRAMME DE CLAPEYRON (P, v)</div>
  <h2>Isothermes et courbe de saturation</h2>
  <div class="intro">Le diagramme (P, T) écrase tout le domaine diphasique sur une courbe. Le diagramme de Clapeyron, qui porte la pression en fonction du volume massique, l'étale en une surface : on y lit les volumes des phases, la composition d'un mélange (§5) et le travail des forces de pression (§7). C'est le premier des diagrammes industriels.</div>
  <div class="def-box">
    <strong>Diagramme de Clapeyron.</strong> On porte la pression \(P\) en ordonnée et le volume massique \(v = V/m\) en abscisse ; on y trace des <strong>isothermes</strong>. La <strong>courbe de saturation</strong>, en forme de cloche, réunit la <strong>courbe d'ébullition</strong> (liquide saturant, volume \(v_L(T)\), à gauche) et la <strong>courbe de rosée</strong> (vapeur saturante, \(v_V(T)\), à droite), qui se rejoignent au point critique C, au sommet. Sous la cloche : le domaine du mélange liquide + vapeur ; à gauche : le liquide ; à droite : la vapeur sèche ; au-dessus de l'isotherme critique : le fluide supercritique.
  </div>

  <div class="prop-box">
    <strong>Allure des isothermes.</strong>
    <ul>
      <li>\(T \lt T_c\) : branche <strong>liquide</strong> presque verticale (le liquide est très peu compressible : une forte hausse de pression change à peine \(v\)) ; <strong>palier horizontal</strong> sous la pression \(P_{\text{sat}}(T)\), de \(v_L(T)\) à \(v_V(T)\), pendant le changement d'état ; branche <strong>vapeur</strong> décroissante, proche de l'hyperbole \(P = rT/v\) du gaz parfait loin de la saturation (\(r = R/M\)).</li>
      <li>\(T = T_c\) : l'isotherme critique a, en C, une tangente horizontale et un point d'inflexion ; le palier s'est réduit à un point.</li>
      <li>\(T \gt T_c\) : plus de palier ; à haute température, les isothermes tendent vers les hyperboles du gaz parfait.</li>
    </ul>
    Quand \(T\) augmente, le palier monte (\(P_{\text{sat}}\) croît) et raccourcit : \(v_L\) augmente (le liquide se dilate) et \(v_V\) diminue (la vapeur, plus comprimée, devient plus dense).
  </div>

  <div class="method-box">
    <strong>Exemple — la vapeur saturante est-elle un gaz parfait ?</strong>
    <p>Le modèle du gaz parfait donne pour la vapeur d'eau \(v = rT/P\), avec \(r = R/M = 8{,}314/0{,}018\,02 \approx 461{,}5\ \text{J·K}^{-1}\text{·kg}^{-1}\).</p>
    <ol>
      <li>À 100 °C, sous 1,014 bar : \(v = \dfrac{461{,}5\times373{,}15}{1{,}014\times10^5} \approx 1{,}70\ \text{m}^3\text{·kg}^{-1}\), contre \(1{,}67\) mesuré : écart de 1,6 %.</li>
      <li>À 200 °C, sous 15,5 bar : \(v \approx 0{,}140\ \text{m}^3\text{·kg}^{-1}\), contre \(0{,}127\) : écart de 10 %.</li>
      <li>Conclusion : près de la saturation et sous forte pression, la vapeur s'écarte nettement du gaz parfait ; on utilise alors des tables ou des diagrammes (voir <a href="#thermo1/cours">« Introduction thermodynamique »</a>, gaz réels).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre les deux diagrammes. Dans le diagramme (P, T), le domaine diphasique est une <strong>courbe</strong> (une pression par température) ; dans le diagramme (P, v), c'est une <strong>surface</strong> (le dessous de la cloche), car le volume massique dépend de la proportion de vapeur.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · TITRE EN VAPEUR ET RÈGLE DES MOMENTS</div>
  <h2>Composition d'un mélange liquide-vapeur</h2>
  <div class="intro">Sous la cloche, un point du diagramme représente un mélange de liquide saturant et de vapeur saturante. Sa position sur le palier donne directement la proportion de vapeur : c'est la règle des moments, outil de base de toute la thermodynamique des fluides réels.</div>
  <div class="def-box">
    <strong>Titre massique en vapeur.</strong> Pour un mélange de masse \(m = m_L + m_V\), le <strong>titre en vapeur</strong> est
    <div class="formula" data-nom="Titre en vapeur">$$x = \frac{m_V}{m}\qquad(0 \le x \le 1)$$</div>
    \(x = 0\) : liquide saturant seul (point L de la courbe d'ébullition) ; \(x = 1\) : vapeur saturante seule (point V de la courbe de rosée). Le titre en liquide vaut \(1 - x\).
  </div>
  <div class="prop-box">
    <strong>Grandeurs massiques d'un mélange.</strong> Le volume, l'énergie interne, l'enthalpie et l'entropie sont extensifs : \(V = m_L v_L + m_V v_V\). En divisant par \(m\),
    <div class="formula" data-nom="Volume massique d'un mélange diphasé">$$v = x\,v_V + (1 - x)\,v_L$$</div>
    et de même \(u = x\,u_V + (1-x)\,u_L\), \(h = x\,h_V + (1-x)\,h_L\), \(s = x\,s_V + (1-x)\,s_L\), les grandeurs des phases saturantes étant prises à la température du mélange.
  </div>
  <div class="prop-box">
    <strong>Règle des moments.</strong> Sur le palier de l'isotherme \(T\), le point M du mélange est entre L et V, et
    <div class="formula" data-nom="Règle des moments">$$x = \frac{v - v_L}{v_V - v_L} = \frac{\mathrm{LM}}{\mathrm{LV}}\qquad 1 - x = \frac{\mathrm{MV}}{\mathrm{LV}}$$</div>
    Le point M est d'autant plus près de V que le mélange contient de vapeur. Le nom vient de l'équilibre d'un levier : \(m_L\cdot\mathrm{LM} = m_V\cdot\mathrm{MV}\), comme deux masses \(m_L\) en L et \(m_V\) en V équilibrées autour de M.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">De l'extensivité du volume à la règle des moments</span><div class="content">
    <p>De \(v = x\,v_V + (1-x)\,v_L\), on tire \(v - v_L = x\,(v_V - v_L)\), d'où \(x = (v - v_L)/(v_V - v_L)\). En échelle linéaire, les abscisses de L, M, V sont \(v_L\), \(v\), \(v_V\) : \(\mathrm{LM} = v - v_L\) et \(\mathrm{LV} = v_V - v_L\). De même \(1 - x = (v_V - v)/(v_V - v_L) = \mathrm{MV}/\mathrm{LV}\). Enfin \(m_L\,\mathrm{LM} = m(1-x)\,x\,\mathrm{LV} = m_V\,\mathrm{MV}\).</p>
  </div></div>

    <strong>Exemple — 1 kg d'eau dans un récipient de 10 L à 300 °C</strong>
    <p>Un récipient rigide de \(V = 10{,}0\ \text{L}\) contient \(m = 1{,}00\ \text{kg}\) d'eau à 300 °C. Table : \(P_{\text{sat}} = 85{,}9\ \text{bar}\), \(v_L = 1{,}404\ \text{L·kg}^{-1}\), \(v_V = 21{,}66\ \text{L·kg}^{-1}\).</p>
    <ol>
      <li>Volume massique : \(v = V/m = 10{,}0\ \text{L·kg}^{-1}\), compris entre \(v_L\) et \(v_V\) : l'eau est diphasée, sous \(85{,}9\ \text{bar}\).</li>
      <li>Règle des moments : \(x = \dfrac{10{,}0 - 1{,}404}{21{,}66 - 1{,}404} \approx 0{,}424\) : 424 g de vapeur et 576 g de liquide.</li>
      <li>Volumes : la vapeur occupe \(0{,}424\times21{,}66 \approx 9{,}19\ \text{L}\), le liquide \(0{,}576\times1{,}404 \approx 0{,}81\ \text{L}\) (total 10,0 L, contrôle). Avec 42 % de la masse, la vapeur occupe 92 % du volume.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Hors du palier.</strong> À la température \(T\) : si \(v \lt v_L(T)\), le corps pur est liquide ; si \(v \gt v_V(T)\), c'est de la vapeur sèche. De même, sous la pression \(P\) : liquide si \(T \lt T_{\text{sat}}(P)\), vapeur sèche si \(T \gt T_{\text{sat}}(P)\), diphasé seulement si \(T = T_{\text{sat}}(P)\), et il faut alors une donnée de plus (\(v\), \(h\)…) pour obtenir \(x\).
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la règle des longueurs sur un diagramme à abscisse <strong>logarithmique</strong> (comme la figure du §4) : les longueurs n'y sont plus proportionnelles aux différences de volume. On calcule alors \(x\) avec les valeurs de \(v\). Autre piège : prendre le titre massique pour une fraction de volume ; l'exemple ci-dessus montre qu'elles diffèrent du tout au tout.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TRANSFORMATIONS DANS LE DIAGRAMME (P, v)</div>
  <h2>Compression, chauffage en récipient fermé</h2>
  <div class="intro">Suivre une transformation dans le diagramme de Clapeyron permet de prévoir l'apparition ou la disparition d'une phase et de calculer la composition à chaque étape. Deux transformations sont à connaître : la compression isotherme d'une vapeur, qui la liquéfie, et le chauffage à volume constant, celui de tout récipient fermé.</div>
  <h3>Compression isotherme d'une vapeur</h3>
  <p>On comprime lentement une vapeur sèche, au contact d'un thermostat. Dans le diagramme, le point suit l'isotherme de droite à gauche : la pression monte jusqu'à la courbe de rosée, où apparaît la <strong>première goutte</strong> ; sur le palier, la pression reste égale à \(P_{\text{sat}}(T)\) et le titre diminue ; à la courbe d'ébullition disparaît la <strong>dernière bulle</strong> ; ensuite, la pression monte très vite car le liquide est presque incompressible.</p>
  <div class="method-box">
    <strong>Exemple — liquéfier 1 kg de vapeur à 200 °C</strong>
    <p>À 200 °C : \(P_{\text{sat}} = 15{,}5\ \text{bar}\), \(v_L = 1{,}157\ \text{L·kg}^{-1}\), \(v_V = 127{,}2\ \text{L·kg}^{-1}\). On part de 1,00 kg de vapeur sèche dans un cylindre de 200 L.</p>
    <ol>
      <li>Première goutte : quand \(V = m\,v_V = 127\ \text{L}\).</li>
      <li>Pour \(V = 50\ \text{L}\) (\(v = 50\ \text{L·kg}^{-1}\)) : \(x = \dfrac{50 - 1{,}157}{127{,}2 - 1{,}157} \approx 0{,}39\) ; la pression vaut toujours 15,5 bar.</li>
      <li>Dernière bulle : \(V = m\,v_L \approx 1{,}16\ \text{L}\). Le volume a été divisé par 110 à pression constante.</li>
    </ol>
  </div>
  <h3>Chauffage à volume constant (récipient fermé)</h3>
  <p>Dans un récipient rigide et fermé, \(m\) et \(V\) sont fixés, donc \(v\) aussi : le point monte <strong>verticalement</strong> dans le diagramme. Si \(v\) est sous la cloche, le mélange reste diphasé jusqu'à ce que la verticale rencontre la courbe de saturation, et la sortie dépend de la position de \(v\) par rapport au volume critique \(v_c\) :</p>
  <ul>
    <li>\(v \lt v_c\) : la verticale sort par la courbe d'<strong>ébullition</strong> ; le liquide, qui se dilate, finit par <strong>remplir</strong> le récipient (le ménisque monte) ;</li>
    <li>\(v \gt v_c\) : elle sort par la courbe de <strong>rosée</strong> ; le liquide s'<strong>évapore</strong> entièrement (le ménisque descend) ;</li>
    <li>\(v = v_c\) : le ménisque reste vers le milieu et disparaît au point critique, où le fluide devient trouble (opalescence critique).</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — deux tubes scellés</strong>
    <p>Deux tubes de verre épais contiennent de l'eau avec \(v = 2{,}0\ \text{L·kg}^{-1}\) et \(v = 5{,}0\ \text{L·kg}^{-1}\) (et \(v_c = 3{,}1\ \text{L·kg}^{-1}\)). À 200 °C, la règle des moments donne pour le premier \(x = \dfrac{2{,}0 - 1{,}157}{127{,}2 - 1{,}157} \approx 0{,}007\) : le liquide occupe \((1 - x)\,v_L/v \approx 57\ \%\) du volume.</p>
    <ol>
      <li>Premier tube (\(v \lt v_c\)) : il est plein de liquide quand \(v_L(T) = 2{,}0\ \text{L·kg}^{-1}\), vers 364 °C.</li>
      <li>Second tube (\(v \gt v_c\)) : la dernière goutte disparaît quand \(v_V(T) = 5{,}0\ \text{L·kg}^{-1}\), vers 370 °C.</li>
      <li>Au-delà, le premier tube contient un liquide presque incompressible qu'on continue de chauffer : sa pression croît très vite. C'est pourquoi on ne remplit jamais complètement une bouteille de gaz liquéfié (exercice « Concours PT »).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'en chauffant un récipient fermé contenant de l'eau et de la vapeur, l'eau finit toujours par s'évaporer. C'est faux si le récipient est assez rempli (\(v \lt v_c\)) : c'est le liquide qui envahit tout.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ENTHALPIE DE CHANGEMENT D'ÉTAT</div>
  <h2>L'énergie d'un changement d'état</h2>
  <div class="intro">Un changement d'état se fait à pression constante (celle de l'équilibre) : d'après le premier principe sous forme de bilan d'enthalpie (<a href="#thermo2/cours">« 1er principe »</a>), le transfert thermique reçu est égal à la variation d'enthalpie. L'enthalpie de changement d'état est donc la grandeur qui chiffre ces échanges.</div>
  <div class="def-box">
    <strong>Enthalpie massique de changement d'état.</strong> Pour la transition de la phase 1 à la phase 2 à la température \(T\) (et sous la pression d'équilibre \(P_{12}(T)\)),
    <div class="formula" data-nom="Enthalpie de changement d'état">$$\Delta h_{12}(T) = h_2(T) - h_1(T)$$</div>
    en \(\text{J·kg}^{-1}\) : enthalpie de fusion \(\Delta h_{\text{fus}}\), de vaporisation \(\Delta h_{\text{vap}}\), de sublimation \(\Delta h_{\text{sub}}\). Une masse \(m\) qui change entièrement d'état, de façon monobare, reçoit le transfert thermique
    <div class="formula" data-nom="Transfert thermique d'un changement d'état">$$Q = \Delta H = m\,\Delta h_{12}$$</div>
    Les anciens ouvrages parlent de « chaleur latente » \(L\).
  </div>
  <div class="prop-box">
    <strong>Signes et relations.</strong> Fusion, vaporisation et sublimation consomment de l'énergie : \(\Delta h_{\text{fus}}\), \(\Delta h_{\text{vap}}\), \(\Delta h_{\text{sub}}\) sont positives. Les transformations inverses en libèrent : \(\Delta h_{21} = -\Delta h_{12}\) (la liquéfaction de 1 kg de vapeur d'eau à 100 °C cède 2 257 kJ). Comme \(h\) est une fonction d'état, au point triple : \(\Delta h_{\text{sub}} = \Delta h_{\text{fus}} + \Delta h_{\text{vap}}\).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Transition</th><th style="text-align:left">\(\Delta h_{12}\) (kJ·kg⁻¹)</th></tr>
    <tr><td>Fusion de la glace à 0 °C</td><td>334</td></tr>
    <tr><td>Vaporisation de l'eau à 0,01 °C ; 25 °C ; 100 °C</td><td>2 501 ; 2 442 ; <strong>2 257</strong></td></tr>
    <tr><td>Vaporisation de l'eau à 200 °C ; 300 °C ; 374 °C (C)</td><td>1 940 ; 1 405 ; 0</td></tr>
    <tr><td>Sublimation de la glace au point triple</td><td>2 835</td></tr>
    <tr><td>Vaporisation sous 1 atm : éthanol (78 °C), ammoniac (−33 °C), propane (−42 °C), diazote (−196 °C)</td><td>850 ; 1 370 ; 426 ; 199</td></tr>
    <tr><td>Fusion : aluminium (660 °C), fer (1 538 °C)</td><td>397 ; 247</td></tr>
  </table></div>
  <p style="font-size:.9em">Valeurs calculées (IAPWS-95 pour l'eau, équations de référence pour les autres fluides) et ordres de grandeur tabulés pour les métaux.</p>
  <ul>
    <li><strong>Ordre de grandeur à connaître</strong> : pour l'eau, \(\Delta h_{\text{vap}} \approx 2{,}3\ \text{MJ·kg}^{-1}\) à 100 °C et \(\Delta h_{\text{fus}} \approx 0{,}33\ \text{MJ·kg}^{-1}\).</li>
    <li>\(\Delta h_{\text{vap}}\) diminue quand \(T\) augmente et s'annule au point critique, où liquide et vapeur deviennent identiques.</li>
    <li>Interprétation microscopique : fondre ne rompt qu'une partie des liaisons entre molécules, vaporiser les rompt presque toutes ; d'où \(\Delta h_{\text{vap}} \gg \Delta h_{\text{fus}}\). Pour l'eau, \(\Delta h_{\text{vap}} = 40{,}7\ \text{kJ·mol}^{-1}\), de l'ordre de deux liaisons hydrogène par molécule.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — la bouilloire oubliée</strong>
    <p>Une bouilloire de 2,0 kW contient 1,0 L d'eau à 20 °C.</p>
    <ol>
      <li>Porter l'eau à 100 °C : \(Q_1 = 1{,}0\times4{,}18\times80 \approx 334\ \text{kJ}\), soit \(t_1 = 334\times10^3/2{,}0\times10^3 \approx 2\ \text{min}\ 47\ \text{s}\).</li>
      <li>Vaporiser toute l'eau : \(Q_2 = 1{,}0\times2\,257 = 2\,257\ \text{kJ}\), soit \(t_2 \approx 1\,128\ \text{s} \approx 19\ \text{min}\). Sans arrêt automatique, la bouilloire serait à sec au bout de 22 minutes environ.</li>
    </ol>
  </div>
  <h3>Travail reçu pendant une vaporisation</h3>
  <p>Une vaporisation sous la pression constante \(P_{\text{sat}}\) fait passer le volume massique de \(v_L\) à \(v_V\) : le fluide reçoit le travail massique \(w = -P_{\text{sat}}\,(v_V - v_L)\), négatif. Dans le diagramme de Clapeyron, \(|w|\) est l'<strong>aire du rectangle</strong> sous le palier. Le premier principe donne alors la variation d'énergie interne : \(\Delta u_{\text{vap}} = \Delta h_{\text{vap}} - P_{\text{sat}}\,(v_V - v_L)\).</p>
  <div class="method-box">
    <strong>Exemple — l'eau à 100 °C</strong>
    <ol>
      <li>\(w = -1{,}014\times10^5\times(1{,}672 - 0{,}001) \approx -169\ \text{kJ·kg}^{-1}\) : la vapeur repousse l'atmosphère.</li>
      <li>\(\Delta u_{\text{vap}} = 2\,257 - 169 \approx 2\,087\ \text{kJ·kg}^{-1}\) : 93 % de l'énergie reçue sert à séparer les molécules, 7 % au travail de refoulement.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier que \(\Delta h_{12}\) dépend de la température. La valeur 2 257 kJ·kg⁻¹ est celle de la vaporisation à 100 °C ; à 200 °C (dans une chaudière sous 15,5 bar), il ne faut plus que 1 940 kJ·kg⁻¹. Ne pas confondre non plus la notation \(L\) des anciens ouvrages avec une inductance ou un moment cinétique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · BILANS D'ENTHALPIE AVEC CHANGEMENT D'ÉTAT</div>
  <h2>Calorimétrie et chemins fictifs</h2>
  <div class="intro">L'enthalpie est une fonction d'état : sa variation entre deux états ne dépend pas du chemin suivi. On la calcule donc sur un chemin commode, fait d'échauffements à phase fixée et de changements d'état complets. Les bilans de calorimétrie (mélanges eau-glace, vapeur injectée dans un liquide) reposent sur ce principe et sur \(\Delta H = Q\) en monobare.</div>
  <div class="prop-box">
    <strong>Variation d'enthalpie sur un chemin fictif.</strong> Pour une masse \(m\) qui passe de la phase 1 à \(T_1\) à la phase 2 à \(T_2\), sous pression constante, en changeant d'état à \(T_{12}\) :
    <div class="formula" data-nom="Variation d'enthalpie avec changement d'état">$$\Delta H = m\,c_1\,(T_{12} - T_1) + m\,\Delta h_{12}(T_{12}) + m\,c_2\,(T_2 - T_{12})$$</div>
    avec les capacités thermiques massiques \(c_1\), \(c_2\) des phases (supposées constantes ; pour la vapeur, \(c_p\)). Si la transformation est monobare et adiabatique, avec équilibre mécanique au début et à la fin : \(\Delta H = 0\) pour l'ensemble du système.
  </div>
  <div class="method-box">
    <strong>Exemple — de l'eau à 20 °C à la vapeur à 120 °C</strong>
    <p>1,0 kg d'eau sous 1 bar ; \(c_{\text{vap}} \approx 2{,}0\ \text{kJ·K}^{-1}\text{·kg}^{-1}\).</p>
    <ol>
      <li>Chemin : liquide de 20 à 100 °C, vaporisation à 100 °C, vapeur de 100 à 120 °C.</li>
      <li>\(\Delta H = 4{,}18\times80 + 2\,257 + 2{,}0\times20 \approx 334 + 2\,257 + 40 \approx 2\,631\ \text{kJ}\).</li>
      <li>Les tables donnent \(h(120\ °\text{C}, 1\ \text{bar}) - h(20\ °\text{C}, 1\ \text{bar}) = 2\,633\ \text{kJ·kg}^{-1}\) : accord à 0,1 % près.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la glace fond-elle entièrement ?</strong>
    <p>Dans un calorimètre de capacité négligeable, on mélange 1,0 kg d'eau à 15 °C et 0,50 kg de glace à −10 °C, sous la pression atmosphérique.</p>
    <ol>
      <li>Énergie que peut céder l'eau en refroidissant jusqu'à 0 °C : \(1{,}0\times4{,}18\times15 \approx 62{,}7\ \text{kJ}\).</li>
      <li>Énergie pour porter la glace à 0 °C : \(0{,}50\times2{,}1\times10 = 10{,}5\ \text{kJ}\) ; pour la fondre ensuite : \(0{,}50\times334 = 167\ \text{kJ}\).</li>
      <li>\(62{,}7 \lt 10{,}5 + 167\) : toute la glace ne peut pas fondre, et \(62{,}7 \gt 10{,}5\) : l'eau ne gèle pas non plus entièrement. L'état final est diphasé, donc à <strong>0 °C</strong>.</li>
      <li>\(\Delta H = 0\) : \(m_{\text{f}}\times334 = 62{,}7 - 10{,}5\), d'où \(m_{\text{f}} \approx 0{,}156\ \text{kg}\) de glace fondue ; il reste 344 g de glace dans 1,156 kg d'eau.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — chauffer de l'eau par injection de vapeur</strong>
    <p>On veut porter 1,0 kg d'eau de 20 °C à 60 °C en y injectant de la vapeur saturante à 100 °C, qui se condense.</p>
    <ol>
      <li>Système {eau + vapeur injectée}, adiabatique et monobare : \(\Delta H = 0\).</li>
      <li>La vapeur se liquéfie (\(-\Delta h_{\text{vap}}\)) puis l'eau formée refroidit de 100 à 60 °C : \(m_v\,(-2\,257 - 4{,}18\times40) + 1{,}0\times4{,}18\times40 = 0\).</li>
      <li>\(m_v = \dfrac{167{,}2}{2\,257 + 167{,}2} \approx 69\ \text{g}\). Avec de l'eau liquide à 100 °C, il en faudrait 1,0 kg : la vapeur apporte près de quinze fois plus d'énergie par kilogramme, d'où son usage pour le chauffage industriel.</li>
    </ol>
  </div>
  <h3>Mesurer une enthalpie de fusion</h3>
  <p>Méthode des mélanges : on verse une masse \(m_g\) de glace à 0 °C (essuyée, à l'équilibre avec de l'eau de fusion) dans une masse \(m_e\) d'eau à \(T_e\), contenue dans un calorimètre de valeur en eau \(\mu\) (masse d'eau de même capacité thermique, à mesurer d'abord). On relève la température finale \(T_f\), après fusion complète. Le bilan \(\Delta H = 0\) donne \(m_g\,\Delta h_{\text{fus}} + m_g\,c\,(T_f - 0) + (m_e + \mu)\,c\,(T_f - T_e) = 0\).</p>
  <div class="method-box">
    <strong>Exemple — exploitation d'une mesure</strong>
    <p>\(\mu = 20\ \text{g}\), \(m_e = 300\ \text{g}\) à \(30{,}0\ °\text{C}\), \(m_g = 40\ \text{g}\) de glace ; on lit \(T_f = 17{,}8\ °\text{C}\).</p>
    <ol>
      <li>Le bilan donne
      <div class="formula">$$\Delta h_{\text{fus}} = \frac{(m_e + \mu)\,c\,(T_e - T_f)}{m_g} - c\,T_f = \frac{0{,}320\times4{,}18\times12{,}2}{0{,}040} - 4{,}18\times17{,}8 \approx 334\ \text{kJ·kg}^{-1}$$</div></li>
      <li>Sensibilité : une erreur de 0,1 °C sur \(T_f\) change le résultat de \(0{,}1\times\dfrac{(m_e + \mu + m_g)\,c}{m_g} \approx 3{,}8\ \text{kJ·kg}^{-1}\) (1 %). Les pertes thermiques et l'eau de fusion entraînée avec la glace sont les erreurs principales.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire le bilan en supposant que toute la glace fond, trouver une température finale négative, et la garder. Il faut toujours <strong>faire une hypothèse sur l'état final, puis la vérifier</strong> ; si elle est contredite, l'état final est diphasé, à la température du changement d'état, et l'inconnue devient la masse qui a changé d'état.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ENTROPIE DE CHANGEMENT D'ÉTAT</div>
  <h2>Entropie et enthalpie de changement d'état</h2>
  <div class="intro">Un changement d'état modifie aussi l'entropie, et beaucoup : la vapeur est bien plus désordonnée que le liquide. Une relation très simple relie l'entropie de changement d'état à son enthalpie ; elle est au programme de PTSI et sert dans tous les bilans d'entropie avec changement d'état.</div>
  <div class="prop-box">
    <strong>Entropie massique de changement d'état.</strong> Pour la transition 1 → 2 à la température d'équilibre \(T\) (en kelvins), \(\Delta s_{12}(T) = s_2(T) - s_1(T)\) vérifie
    <div class="formula" data-nom="Entropie de changement d'état">$$\Delta h_{12}(T) = T\,\Delta s_{12}(T)\qquad\text{soit}\qquad\Delta s_{12} = \frac{\Delta h_{12}}{T}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Justification</span><span class="prompt">Un changement d'état à l'équilibre est réversible</span><div class="content">
    <p>Faisons changer d'état la masse \(m\) au contact d'un thermostat à la température d'équilibre \(T\), sous la pression \(P_{12}(T)\). À chaque instant, les deux phases sont en équilibre entre elles et avec le thermostat : la transformation est <strong>réversible</strong>, \(S_{\text{créée}} = 0\). Le système reçoit \(Q = m\,\Delta h_{12}\), à la température \(T\) : \(S_{\text{éch}} = Q/T\). Le second principe donne \(\Delta S = S_{\text{éch}} + S_{\text{créée}} = m\,\Delta h_{12}/T\), soit \(m\,\Delta s_{12} = m\,\Delta h_{12}/T\). Comme \(S\) est une fonction d'état, ce résultat vaut pour tout chemin entre les deux mêmes états.</p>
  </div></div>
  <ul>
    <li>Eau à 100 °C : \(\Delta s_{\text{vap}} = \dfrac{2\,257}{373{,}15} \approx 6{,}05\ \text{kJ·K}^{-1}\text{·kg}^{-1}\) (soit \(109\ \text{J·K}^{-1}\text{·mol}^{-1}\)).</li>
    <li>Glace à 0 °C : \(\Delta s_{\text{fus}} = \dfrac{334}{273{,}15} \approx 1{,}22\ \text{kJ·K}^{-1}\text{·kg}^{-1}\).</li>
    <li>\(\Delta s_{\text{vap}}\), \(\Delta s_{\text{fus}}\), \(\Delta s_{\text{sub}}\) sont positives : \(s_{\text{vapeur}} \gt s_{\text{liquide}} \gt s_{\text{solide}}\). Avec la formule de Boltzmann (<a href="#thermo3/cours">« 2e principe »</a>), c'est la traduction du désordre croissant : les molécules d'un gaz ont beaucoup plus de positions accessibles que celles d'un liquide, elles-mêmes plus libres que dans un cristal.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — contrôle sur une table</strong>
    <p>À 200 °C, la table de l'eau donne \(h_V - h_L = 1\,939{,}7\ \text{kJ·kg}^{-1}\) et \(s_V - s_L = 4{,}100\ \text{kJ·K}^{-1}\text{·kg}^{-1}\).</p>
    <ol>
      <li>\(\Delta h_{\text{vap}}/T = 1\,939{,}7/473{,}15 \approx 4{,}100\ \text{kJ·K}^{-1}\text{·kg}^{-1}\) : la relation est vérifiée.</li>
      <li>De 100 à 200 °C, \(\Delta s_{\text{vap}}\) passe de 6,05 à 4,10 kJ·K⁻¹·kg⁻¹ : sous forte pression, la vapeur est plus dense, donc moins « désordonnée » par rapport au liquide.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : diviser par la température en degrés Celsius (2 257/100 donne un résultat quatre fois trop grand), ou appliquer \(\Delta h_{12}/T\) à une transition qui n'a pas lieu à la température d'équilibre (eau en surfusion qui gèle à −10 °C) : on passe alors par un chemin fictif réversible (§10).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · BILANS D'ENTROPIE AVEC CHANGEMENT D'ÉTAT</div>
  <h2>Entropie créée lors d'un changement d'état</h2>
  <div class="intro">Fondre un glaçon dans une pièce, mélanger glace et eau tiède, condenser de la vapeur dans de l'eau froide : ces transformations sont irréversibles. Le bilan d'entropie le prouve et chiffre l'irréversibilité, en combinant \(\Delta s_{12} = \Delta h_{12}/T\) et l'expression (fournie) de l'entropie d'une phase condensée.</div>
  <div class="prop-box">
    <strong>Méthode du bilan.</strong> Pour un système fermé :
    <ol>
      <li>\(\Delta S\) se calcule sur un chemin fictif <strong>réversible</strong> entre les mêmes états : pour une phase condensée de capacité \(m c\), \(\Delta S = m c \ln(T_2/T_1)\) (expression fournie, voir <a href="#thermo3/cours">« 2e principe »</a>) ; pour un changement d'état complet à \(T_{12}\), \(m\,\Delta h_{12}/T_{12}\) ; pour une vapeur assimilée à un gaz parfait chauffé sous pression constante, \(m c_p \ln(T_2/T_1)\).</li>
      <li>\(S_{\text{éch}} = \sum Q_i/T_i\), avec la température \(T_i\) de chaque source (0 pour un système isolé).</li>
      <li>\(S_{\text{créée}} = \Delta S - S_{\text{éch}} \ge 0\) ; elle est nulle seulement si la transformation est réversible.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un glaçon fond dans une pièce</strong>
    <p>Un glaçon de 20 g à 0 °C est posé dans une pièce à 20 °C (thermostat) ; il finit en eau liquide à 20 °C, sous pression constante.</p>
    <ol>
      <li>Chemin fictif réversible : fusion à 0 °C, puis échauffement de l'eau de 0 à 20 °C. \(\Delta S = m\left[\dfrac{\Delta h_{\text{fus}}}{273{,}15} + c\ln\dfrac{293{,}15}{273{,}15}\right]\), soit \(\Delta S = 0{,}020\times(1\,223 + 295) \approx 30{,}4\ \text{J·K}^{-1}\).</li>
      <li>Transfert thermique reçu de la pièce : \(Q = m\,(\Delta h_{\text{fus}} + c\times20) \approx 8\,352\ \text{J}\), d'où \(S_{\text{éch}} = Q/293{,}15 \approx 28{,}5\ \text{J·K}^{-1}\).</li>
      <li>\(S_{\text{créée}} \approx 30{,}4 - 28{,}5 = 1{,}9\ \text{J·K}^{-1} \gt 0\) : transformation irréversible, à cause de l'écart de température entre la pièce et le glaçon.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le mélange eau-glace du §8</strong>
    <p>1,0 kg d'eau de 15 °C à 0 °C ; 0,50 kg de glace de −10 °C à 0 °C, dont 0,156 kg fond. Le calorimètre étant isolé, \(S_{\text{éch}} = 0\).</p>
    <ol>
      <li>Eau : \(1{,}0\times4\,180\times\ln\dfrac{273{,}15}{288{,}15} \approx -223{,}5\ \text{J·K}^{-1}\).</li>
      <li>Glace : échauffement \(0{,}50\times2\,100\times\ln\dfrac{273{,}15}{263{,}15} \approx 39{,}2\ \text{J·K}^{-1}\), puis fusion de 0,156 kg : \(\dfrac{0{,}156\times334\times10^3}{273{,}15} \approx 191{,}1\ \text{J·K}^{-1}\) ; total \(230{,}3\ \text{J·K}^{-1}\).</li>
      <li>\(S_{\text{créée}} = \Delta S \approx 6{,}8\ \text{J·K}^{-1} \gt 0\) : mettre en contact des corps à températures différentes est irréversible.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la vapeur injectée du §8</strong>
    <p>69 g de vapeur à 100 °C se liquéfient et refroidissent jusqu'à 60 °C ; 1,0 kg d'eau passe de 20 à 60 °C.</p>
    <ol>
      <li>Vapeur : \(0{,}069\left[-\dfrac{2\,257\times10^3}{373{,}15} + 4\,180\ln\dfrac{333{,}15}{373{,}15}\right] \approx -450\ \text{J·K}^{-1}\).</li>
      <li>Eau : \(1{,}0\times4\,180\ln\dfrac{333{,}15}{293{,}15} \approx +535\ \text{J·K}^{-1}\).</li>
      <li>\(S_{\text{créée}} \approx 85\ \text{J·K}^{-1}\), bien plus que pour le mélange eau-glace : l'écart de température entre la vapeur (100 °C) et l'eau froide est grand.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : calculer \(S_{\text{éch}}\) avec la température du système au lieu de celle de la source (ici la pièce à 20 °C), ou trouver \(S_{\text{créée}} \lt 0\) sans s'en inquiéter : c'est toujours le signe d'une erreur de signe ou de température.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · VERS LA THERMODYNAMIQUE INDUSTRIELLE (2ᵉ ANNÉE)</div>
  <h2>Tables et diagrammes des fluides réels</h2>
  <div class="intro">Ce qui suit est vu en 2ᵉ année, dans <a href="#thermodiff/cours">« Thermodynamique différentielle et fluides réels »</a> et <a href="#thermoouv/cours">« Systèmes ouverts et thermodynamique industrielle »</a>. Les outils de ce chapitre (titre, règle des moments, \(\Delta s_{12} = \Delta h_{12}/T\)) y servent tels quels.</div>
  <ul>
    <li><strong>Tables thermodynamiques</strong> : pour chaque température (ou pression) de saturation, elles donnent \(P_{\text{sat}}\), \(v_L\), \(v_V\), \(h_L\), \(h_V\), \(s_L\), \(s_V\) (les tableaux du §3 et du §4 en sont des extraits) ; d'autres tables donnent la vapeur sèche en fonction de \(T\) et \(P\). On y applique la règle des moments à \(h\) et \(s\) : \(h = h_L + x\,(h_V - h_L)\).</li>
    <li><strong>Diagrammes industriels</strong> : entropique (T, s), où les isentropiques sont verticales et l'aire sous une courbe est un transfert thermique ; de Mollier (h, s), pour les turbines ; des frigoristes (log P, h), pour les réfrigérateurs et les pompes à chaleur. On y lit le titre d'un mélange comme sur le diagramme de Clapeyron.</li>
    <li><strong>Potentiel chimique</strong> : l'équilibre entre deux phases s'écrit \(\mu_1(T, P) = \mu_2(T, P)\), ce qui justifie qu'un changement d'état isotherme soit isobare.</li>
    <li><strong>Applications</strong> : dans une centrale, l'eau est vaporisée dans la chaudière, se détend dans la turbine (sa vapeur sort humide, avec un titre de l'ordre de 0,9), puis est liquéfiée dans le condenseur ; dans un réfrigérateur, le fluide se vaporise dans l'évaporateur, à basse pression, en prélevant de l'énergie aux aliments (voir aussi <a href="#machines/cours">« Machines thermiques »</a>).</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Clausius-Clapeyron, variance, retards au changement d'état</h2>
  <div class="intro">Ces compléments ne sont exigibles dans aucune des deux années. Ils éclairent cependant des résultats du chapitre.</div>
  <h3>Relation de Clapeyron</h3>
  <p>La pente d'une courbe d'équilibre est reliée à l'enthalpie de changement d'état : \(\dfrac{\mathrm dP_{12}}{\mathrm dT} = \dfrac{\Delta h_{12}}{T\,(v_2 - v_1)}\). Pour la fusion de l'eau, \(v_{\text{liquide}} \lt v_{\text{glace}}\) donne une pente négative (§2). Pour la vaporisation loin du point critique, en traitant la vapeur en gaz parfait (\(v_V \approx rT/P \gg v_L\)), on obtient la <strong>relation de Clausius-Clapeyron</strong> : \(\ln P_{\text{sat}} \approx -\dfrac{\Delta h_{\text{vap}}}{rT} + \text{cste}\) ; tracer \(\ln P_{\text{sat}}\) en fonction de \(1/T\) donne une droite de pente \(-\Delta h_{\text{vap}}/r\), ce qui permet de mesurer \(\Delta h_{\text{vap}}\).</p>
  <h3>Règle des phases</h3>
  <p>La <strong>variance</strong> (nombre de variables intensives que l'on peut fixer librement) d'un système de \(C\) constituants sous \(\varphi\) phases vaut \(C + 2 - \varphi\) : 2 pour un corps pur monophasé (\(P\) et \(T\)), 1 pour un corps pur diphasé (\(T\) fixe \(P\)), 0 au point triple. C'est la forme générale du résultat du §3.</p>
  <h3>Retards aux changements d'état</h3>
  <p>De l'eau très pure, refroidie sans secousse, peut rester liquide sous 0 °C : c'est la <strong>surfusion</strong>, un état <strong>métastable</strong>. L'introduction d'un germe (cristal, poussière) déclenche une cristallisation brutale ; l'énergie libérée réchauffe le mélange jusqu'à 0 °C, où une partie seulement de l'eau a gelé (exercice 6). De même, un liquide peut être <strong>surchauffé</strong> au-delà de sa température d'ébullition (eau chauffée au four à micro-ondes dans un récipient lisse), avec un risque d'ébullition violente.</p>
  <h3>Règle de Trouton</h3>
  <p>Pour beaucoup de liquides non associés, l'entropie molaire de vaporisation à la température d'ébullition sous 1 atm est voisine de 85 à 88 J·K⁻¹·mol⁻¹. L'eau (\(109\ \text{J·K}^{-1}\text{·mol}^{-1}\)) s'en écarte : les liaisons hydrogène ordonnent le liquide.</p>
</div>

<template class="pan-tpl" data-panneau="ce-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CHANGEMENTS D'ÉTAT</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur le corps pur diphasé : lire les diagrammes (P, T) et (P, v), reconnaître l'état d'un fluide, calculer un titre par la règle des moments, suivre une transformation, faire des bilans d'enthalpie et d'entropie avec changement d'état, et mesurer une enthalpie de changement d'état.</div>

  <div class="method-box"><strong>Méthode 1 — Lire un diagramme (P, T) et prévoir les changements d'état</strong>
    <ol>
      <li><span class="step">Repères.</span> Placer le point triple T et le point critique C ; nommer les domaines : solide à basse température et haute pression, gaz à haute température et basse pression, liquide entre les deux, au-dessus de \(P_{\text{triple}}\).</li>
      <li><span class="step">Chemin.</span> Tracer la transformation : horizontale pour une isobare, verticale pour une isotherme.</li>
      <li><span class="step">Intersections.</span> Chaque courbe traversée est un changement d'état, qui se fait à la température (ou à la pression) lue à l'intersection.</li>
      <li><span class="step">Cas particuliers.</span> Sous \(P_{\text{triple}}\), pas de liquide : le solide se sublime. Au-dessus de \(T_c\), une compression ne liquéfie plus le gaz : le fluide devient supercritique sans palier.</li>
    </ol>
    <p><em>Exemple éclair :</em> on comprime à 20 °C du CO₂ gazeux de 1 bar à 80 bar. La verticale \(T = 20\ °\text{C}\) coupe la courbe de vaporisation à \(P_{\text{sat}} = 57{,}3\ \text{bar}\) : le gaz s'y liquéfie à pression constante, puis le liquide se comprime jusqu'à 80 bar. À 40 °C (au-dessus de \(T_c = 31\ °\text{C}\)), la même compression ne fait apparaître aucun liquide.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre point triple (seul point où trois phases coexistent, en bas des courbes) et point critique (fin de la seule courbe de vaporisation). Et ne pas croire que la courbe de fusion penche à gauche pour tous les corps : c'est une particularité de l'eau.</div>

  <div class="method-box"><strong>Méthode 2 — Déterminer l'état physique d'un corps pur</strong>
    <ol>
      <li><span class="step">Avec \((T, P)\).</span> Comparer \(P\) à \(P_{\text{sat}}(T)\) : \(P \gt P_{\text{sat}}(T)\), liquide ; \(P \lt P_{\text{sat}}(T)\), vapeur sèche ; \(P = P_{\text{sat}}(T)\), état diphasé possible, il manque une donnée.</li>
      <li><span class="step">Avec \((T, v)\).</span> Calculer \(v = V/m\) et le comparer à \(v_L(T)\) et \(v_V(T)\) : \(v \lt v_L\), liquide ; \(v \gt v_V\), vapeur sèche ; entre les deux, mélange, de pression \(P_{\text{sat}}(T)\).</li>
      <li><span class="step">Au-dessus de \(T_c\).</span> Fluide supercritique (ou gaz si la pression est faible).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(P_{\text{sat}}(150\ °\text{C}) = 4{,}76\ \text{bar}\). Eau à 150 °C sous 10 bar : liquide ; sous 2 bar : vapeur sèche. 2,0 kg d'eau dans 0,60 m³ à 120 °C : \(v = 0{,}30\ \text{m}^3\text{·kg}^{-1}\), compris entre \(v_L = 1{,}06\times10^{-3}\) et \(v_V = 0{,}891\ \text{m}^3\text{·kg}^{-1}\) : mélange, sous 1,99 bar.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Tracer l'allure des isothermes dans le diagramme de Clapeyron</strong>
    <ol>
      <li><span class="step">Cloche.</span> Tracer la courbe de saturation, point critique C au sommet : courbe d'ébullition à gauche (liquide saturant), courbe de rosée à droite (vapeur saturante).</li>
      <li><span class="step">\(T \lt T_c\).</span> Branche liquide presque verticale, palier horizontal à \(P_{\text{sat}}(T)\) entre les deux branches, branche vapeur décroissante, voisine d'une hyperbole loin de la cloche.</li>
      <li><span class="step">\(T = T_c\) et au-delà.</span> Isotherme critique à tangente horizontale en C ; au-dessus, courbes décroissantes sans palier.</li>
      <li><span class="step">Contrôle.</span> Les isothermes ne se coupent pas ; plus \(T\) est élevée, plus l'isotherme est haute et plus son palier est court.</li>
    </ol>
    <p><em>Exemple éclair :</em> à 100 °C, palier sous 1,01 bar de 1,04 à 1 672 L·kg⁻¹ ; à 200 °C, palier sous 15,5 bar de 1,16 à 127 L·kg⁻¹ : plus haut et beaucoup plus court.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dessiner un palier incliné, ou une branche liquide aussi inclinée que la branche vapeur. Le liquide est presque incompressible : sa branche est quasi verticale.</div>

  <div class="method-box"><strong>Méthode 4 — Calculer un titre en vapeur par la règle des moments</strong>
    <ol>
      <li><span class="step">Palier.</span> Identifier la température (ou la pression) du mélange et lire \(v_L\), \(v_V\) dans la table ou le diagramme.</li>
      <li><span class="step">Volume massique.</span> Calculer \(v = V/m\) et vérifier \(v_L \lt v \lt v_V\) (sinon le fluide n'est pas diphasé : méthode 2).</li>
      <li><span class="step">Titre.</span> \(x = \dfrac{v - v_L}{v_V - v_L}\), ou \(x = \mathrm{LM}/\mathrm{LV}\) mesuré sur un diagramme en échelle linéaire.</li>
      <li><span class="step">Exploitation.</span> \(m_V = x\,m\), \(m_L = (1 - x)\,m\), volumes \(V_V = m_V v_V\), \(V_L = m_L v_L\) (contrôle : \(V_L + V_V = V\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> à 150 °C, \(v_L = 1{,}09\ \text{L·kg}^{-1}\) et \(v_V = 392\ \text{L·kg}^{-1}\). 0,50 kg d'eau dans 0,10 m³ : \(v = 200\ \text{L·kg}^{-1}\), \(x = \dfrac{200 - 1{,}09}{392 - 1{,}09} \approx 0{,}51\). Dans 0,20 m³ : \(v = 400\ \text{L·kg}^{-1} \gt v_V\), c'est de la vapeur sèche, et la règle des moments ne s'applique pas.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer \(x = \mathrm{LM}/\mathrm{LV}\) sur un diagramme à abscisse logarithmique, ou confondre titre massique et fraction de volume (la vapeur occupe presque tout le volume même quand \(x\) est petit).</div>

  <div class="method-box"><strong>Méthode 5 — Suivre une transformation dans le diagramme de Clapeyron</strong>
    <ol>
      <li><span class="step">Contrainte.</span> Repérer ce qui est fixé : \(T\) (thermostat, transformation lente) : on suit l'isotherme ; \(V\) et \(m\) (récipient rigide fermé) : \(v\) est fixé, verticale ; \(P\) : horizontale.</li>
      <li><span class="step">Entrées et sorties de la cloche.</span> Sur la courbe de rosée apparaît la première goutte (ou disparaît la dernière) ; sur la courbe d'ébullition, la dernière bulle.</li>
      <li><span class="step">Récipient fermé chauffé.</span> Comparer \(v\) à \(v_c\) : \(v \lt v_c\), le liquide finit par tout remplir ; \(v \gt v_c\), il finit par s'évaporer.</li>
      <li><span class="step">Calculs.</span> Titre en chaque point par la méthode 4 ; température de sortie par \(v_L(T) = v\) ou \(v_V(T) = v\).</li>
    </ol>
    <p><em>Exemple éclair :</em> 1,0 kg d'eau dans un autoclave rigide de 1,5 L (\(v = 1{,}5\ \text{L·kg}^{-1} \lt v_c = 3{,}1\ \text{L·kg}^{-1}\)). La table donne \(v_L = 1{,}45\ \text{L·kg}^{-1}\) à 310 °C et \(1{,}50\ \text{L·kg}^{-1}\) à 320 °C : vers 320 °C, l'autoclave est plein de liquide, sous 113 bar ; au-delà, la pression s'emballe.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer une variation d'enthalpie avec changement d'état</strong>
    <ol>
      <li><span class="step">Chemin fictif.</span> Remplacer la transformation réelle par une suite d'étapes simples entre les mêmes états : échauffements (ou refroidissements) à phase fixée et changements d'état complets à leur température d'équilibre.</li>
      <li><span class="step">Étapes.</span> \(m\,c\,\Delta T\) pour une phase condensée (ou \(m\,c_p\,\Delta T\) pour une vapeur assimilée à un gaz parfait, sous pression constante) ; \(\pm m\,\Delta h_{12}\) pour un changement d'état, positif dans le sens fusion, vaporisation, sublimation.</li>
      <li><span class="step">Somme.</span> \(\Delta H\) est la somme des étapes, puisque \(H\) est une fonction d'état.</li>
    </ol>
    <p><em>Exemple éclair :</em> 2,0 kg de vapeur à 100 °C deviennent de la glace à −10 °C sous 1 atm : \(\Delta H = 2{,}0\times(-2\,257 - 4{,}18\times100 - 334 - 2{,}1\times10) \approx -6{,}06\ \text{MJ}\), énergie à évacuer.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier l'échauffement de la phase finale, ou affecter le mauvais signe à une liquéfaction ou une solidification (qui libèrent de l'énergie : \(-m\,\Delta h_{12}\)).</div>

  <div class="method-box"><strong>Méthode 7 — Faire un bilan calorimétrique avec changement d'état</strong>
    <ol>
      <li><span class="step">Système.</span> Choisir l'ensemble des corps (et le calorimètre, par sa valeur en eau) ; transformation adiabatique et monobare, avec équilibre mécanique au début et à la fin : \(\Delta H = 0\).</li>
      <li><span class="step">Hypothèse.</span> Comparer l'énergie que peut céder le corps chaud en descendant jusqu'à la température de changement d'état et celle qu'exige le changement d'état complet du corps froid.</li>
      <li><span class="step">Calcul.</span> Si le changement d'état est complet, l'inconnue est \(T_f\) ; sinon, \(T_f\) est la température de changement d'état et l'inconnue est la masse qui a changé d'état.</li>
      <li><span class="step">Vérification.</span> \(T_f\) doit être compatible avec l'état supposé ; la masse calculée, comprise entre 0 et la masse disponible.</li>
    </ol>
    <p><em>Exemple éclair :</em> 50 g de glace à 0 °C dans 200 g d'eau à 10 °C. L'eau peut céder \(0{,}200\times4{,}18\times10 = 8{,}4\ \text{kJ}\) avant 0 °C ; fondre toute la glace demande \(0{,}050\times334 = 16{,}7\ \text{kJ}\). La fusion est partielle : \(T_f = 0\ °\text{C}\) et \(8{,}36/334 \approx 25\ \text{g}\) de glace fondent.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Calculer une variation d'entropie avec changement d'état</strong>
    <ol>
      <li><span class="step">Chemin réversible.</span> Même découpage qu'à la méthode 6, chaque étape étant réversible.</li>
      <li><span class="step">Changement d'état.</span> \(\Delta S = m\,\Delta s_{12} = m\,\dfrac{\Delta h_{12}}{T_{12}}\), avec \(T_{12}\) en kelvins.</li>
      <li><span class="step">Échauffements.</span> Expressions fournies : \(m\,c\ln(T_2/T_1)\) pour une phase condensée, \(m\,c_p\ln(T_2/T_1)\) pour un gaz parfait sous pression constante.</li>
    </ol>
    <p><em>Exemple éclair :</em> 1,0 kg d'eau liquide à 20 °C devient vapeur à 100 °C sous 1 atm : \(\Delta S = 4\,180\ln\dfrac{373{,}15}{293{,}15} + \dfrac{2\,257\times10^3}{373{,}15}\), soit \(\Delta S \approx 1\,009 + 6\,049 \approx 7{,}06\ \text{kJ·K}^{-1}\). La vaporisation compte pour 86 %.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : utiliser \(\Delta h_{12}/T\) à une autre température que celle de l'équilibre (eau en surfusion) ; on revient alors à la température d'équilibre par un chemin fictif.</div>

  <div class="method-box"><strong>Méthode 9 — Faire un bilan d'entropie avec changement d'état</strong>
    <ol>
      <li><span class="step">Variation.</span> \(\Delta S\) du système par la méthode 8.</li>
      <li><span class="step">Échange.</span> \(S_{\text{éch}} = \sum_i Q_i/T_i\), avec la température \(T_i\) de chaque source (thermostat, atmosphère) et le transfert thermique \(Q_i\) qu'elle fournit au système ; \(S_{\text{éch}} = 0\) pour un système isolé.</li>
      <li><span class="step">Création.</span> \(S_{\text{créée}} = \Delta S - S_{\text{éch}}\) ; vérifier \(S_{\text{créée}} \ge 0\) et relier sa valeur à une cause d'irréversibilité (écart de température, mélange, métastabilité).</li>
    </ol>
    <p><em>Exemple éclair :</em> 1,0 kg d'eau à 100 °C est vaporisé sous 1 atm par une plaque à 400 °C. \(\Delta S = 2\,257\times10^3/373{,}15 \approx 6\,049\ \text{J·K}^{-1}\), \(S_{\text{éch}} = 2\,257\times10^3/673{,}15 \approx 3\,353\ \text{J·K}^{-1}\), donc \(S_{\text{créée}} \approx 2\,700\ \text{J·K}^{-1}\). Avec une source à 100 °C, elle serait nulle.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Mesurer une enthalpie de changement d'état</strong>
    <ol>
      <li><span class="step">Fusion, méthode des mélanges.</span> Mesurer la valeur en eau \(\mu\) du calorimètre ; introduire une masse connue de glace à 0 °C (essuyée) dans de l'eau tiède ; relever \(T_f\) après fusion complète ; exploiter \(\Delta H = 0\) (méthode 7).</li>
      <li><span class="step">Vaporisation, méthode électrique.</span> Faire bouillir de l'eau avec une résistance de puissance \(\mathcal P\) ; mesurer le débit massique vaporisé \(q\) (balance) en régime permanent : \(\mathcal P - \mathcal P_{\text{pertes}} = q\,\Delta h_{\text{vap}}\).</li>
      <li><span class="step">Éliminer les pertes.</span> Refaire la mesure avec une autre puissance ; les pertes, liées à la température (100 °C), sont les mêmes : \(\Delta h_{\text{vap}} = \dfrac{\mathcal P_2 - \mathcal P_1}{q_2 - q_1}\).</li>
      <li><span class="step">Incertitude.</span> Repérer la mesure la moins précise (souvent une différence de températures ou de débits) et évaluer son effet sur le résultat.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec 50 W puis 100 W, on mesure 1,10 puis 2,43 g·min⁻¹ : \(\Delta h_{\text{vap}} = \dfrac{50}{(2{,}43 - 1{,}10)/60} \approx 2\,256\ \text{J·g}^{-1}\), et les pertes valent \(50 - \dfrac{1{,}10}{60}\times2\,256 \approx 9\ \text{W}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : calculer \(\Delta h_{\text{vap}} = \mathcal P/q\) avec une seule mesure : les pertes thermiques sont alors comptées comme énergie de vaporisation, et le résultat est trop grand (ici \(50/0{,}018\,3 \approx 2\,730\ \text{J·g}^{-1}\), 21 % de trop).</div>
</div>

<template class="pan-tpl" data-panneau="ce-exos">
<div class="exo-wrapper">
<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Lire les diagrammes (P, T) de l'eau et du dioxyde de carbone</h3>
  <div class="statement">On s'aide des diagrammes du cours (§2) et des données suivantes. Eau : point triple (0,01 °C ; 611 Pa), point critique (374 °C ; 221 bar), pression de sublimation de la glace 260 Pa à −10 °C et 103 Pa à −20 °C. Dioxyde de carbone : point triple (−56,6 °C ; 5,18 bar), point critique (31,0 °C ; 73,8 bar), \(P_{\text{sat}}(20\ °\text{C}) = 57{,}3\ \text{bar}\), sublimation sous 1 atm à −78,5 °C.</div>
  <div class="q"><strong>Q1.</strong> Donner l'état de : (a) l'eau à 25 °C sous 1 bar ; (b) l'eau à −10 °C sous 100 Pa ; (c) CO₂ à 20 °C sous 1 bar ; (d) CO₂ à 20 °C sous 60 bar ; (e) CO₂ à 40 °C sous 100 bar.</div>
  <div class="q"><strong>Q2.</strong> On chauffe sous 1 atm un bloc de glace carbonique pris à −100 °C. Décrire son évolution. Peut-on obtenir du CO₂ liquide dans un verre ouvert ? Sous quelle pression minimale le CO₂ liquide peut-il exister ?</div>
  <div class="q"><strong>Q3.</strong> Lyophilisation : un aliment congelé est maintenu à −20 °C dans une enceinte où l'on pompe la vapeur d'eau. À quelle condition sur la pression sa glace disparaît-elle ? Pourquoi ne fond-elle pas ?</div>
  <div class="q"><strong>Q4.</strong> Un extincteur contient du CO₂ en partie liquide à 20 °C. Quelle pression (absolue) règne à l'intérieur ? Que contient-il s'il est porté à 35 °C ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) À 25 °C, la pression de vapeur saturante de l'eau ne vaut que 0,03 bar : sous 1 bar, au-dessus de la courbe de vaporisation et à droite de la courbe de fusion, l'eau est <strong>liquide</strong>. (b) À −10 °C (sous le point triple), la seule courbe concernée est celle de sublimation : \(100\ \text{Pa} \lt 260\ \text{Pa}\), on est sous la courbe, l'eau est <strong>vapeur</strong>. (c) \(1\ \text{bar} \lt 57{,}3\ \text{bar}\) : CO₂ <strong>gazeux</strong>. (d) \(60\ \text{bar} \gt 57{,}3\ \text{bar}\) à 20 °C (sous \(T_c\)) : CO₂ <strong>liquide</strong>. (e) \(T \gt T_c\) et \(P \gt P_c\) : <strong>fluide supercritique</strong>.</p>
    <p><strong>Q2.</strong> L'isobare 1 atm est sous le point triple du CO₂ (5,18 bar) : elle ne coupe que la courbe de sublimation, à −78,5 °C. Le bloc s'échauffe jusqu'à −78,5 °C, puis se <strong>sublime</strong> à température constante (palier), puis le gaz s'échauffe. Pas de liquide dans un verre ouvert : il faut \(P \ge 5{,}18\ \text{bar}\) (et une température comprise entre −56,6 °C et 31,0 °C).</p>
    <p><strong>Q3.</strong> La verticale \(\theta = -20\ °\text{C}\) est à gauche du point triple : aux pressions usuelles, elle ne traverse que la courbe de sublimation, à 103 Pa. Si la pression de la vapeur dans l'enceinte est maintenue <strong>sous 103 Pa</strong>, la vapeur est la phase stable : la glace se sublime. Le liquide n'est stable qu'au-dessus de 0,01 °C (à ces pressions) : la glace ne peut pas fondre, ce qui préserve la structure de l'aliment.</p>
    <p><strong>Q4.</strong> Liquide et vapeur coexistent : la pression est la pression de vapeur saturante, \(57{,}3\ \text{bar}\), quelle que soit la quantité de CO₂ restante. À 35 °C, au-dessus de \(T_c = 31{,}0\ °\text{C}\), il n'y a plus de liquide : l'extincteur contient un fluide supercritique, dont la pression dépend alors du remplissage (elle n'est plus fixée par la seule température).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Enthalpie de fusion — fonte de glace</h3>
  <div class="statement">Dans un calorimètre de capacité négligeable, sous la pression atmosphérique, on mélange \(m_g = 100\ \text{g}\) de glace à \(-10\ °\text{C}\) avec \(m_e = 200\ \text{g}\) d'eau à \(50\ °\text{C}\). \(c_{\text{glace}} = 2{,}1\ \text{kJ·K}^{-1}\text{·kg}^{-1}\), \(c_{\text{eau}} = 4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\), \(\Delta h_{\text{fus}} = 334\ \text{kJ·kg}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le transfert thermique nécessaire pour amener la glace à 0 °C puis la fondre entièrement.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'énergie que cède l'eau en refroidissant jusqu'à 0 °C.</div>
  <div class="q"><strong>Q3.</strong> Déterminer l'état final et la température d'équilibre.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Échauffement de la glace : \(Q_1 = 0{,}1\times2{,}1\times10 = 2{,}1\ \text{kJ}\). Fusion : \(Q_2 = 0{,}1\times334 = 33{,}4\ \text{kJ}\). Total pour fondre toute la glace : 35,5 kJ.</p>
    <p><strong>Q2.</strong> \(Q_e = 0{,}2\times4{,}18\times50 = 41{,}8\ \text{kJ}\).</p>

  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Clausius-Clapeyron : pression de vapeur saturante (hors programme, pour aller plus loin)</h3>
  <div class="statement">La pression de vapeur saturante de l'eau vaut \(P_1 = 1{,}013\ \text{bar}\) à \(T_1 = 373\ \text{K}\) et \(P_2 = 2{,}026\ \text{bar}\) à \(T_2 = 393\ \text{K}\). On admet la relation de Clausius-Clapeyron intégrée : \(\ln\dfrac{P_2}{P_1} = -\dfrac{M\,\Delta h_{\text{vap}}}{R}\left(\dfrac{1}{T_2} - \dfrac{1}{T_1}\right)\), avec \(M\) la masse molaire.</div>
  <div class="q"><strong>Q1.</strong> Calculer l'enthalpie molaire de vaporisation \(M\,\Delta h_{\text{vap}}\).</div>
  <div class="q"><strong>Q2.</strong> Estimer la pression de vapeur saturante à 80 °C (353 K).</div>
  <div class="q"><strong>Q3.</strong> À quelle température l'eau bout-elle au sommet du mont Blanc (\(P \approx 0{,}55\ \text{bar}\)) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{1}{T_1} - \dfrac{1}{T_2} = \dfrac{20}{373\times393} \approx 1{,}364\times10^{-4}\ \text{K}^{-1}\), donc \(M\,\Delta h_{\text{vap}} = \dfrac{R\ln 2}{1{,}364\times10^{-4}}\), soit \(M\,\Delta h_{\text{vap}} \approx 42{,}2\ \text{kJ·mol}^{-1}\). Massique : \(42\,240/18 \approx 2\,350\ \text{J·g}^{-1}\), proche de la valeur de 2 257 J·g⁻¹ à 100 °C (\(\Delta h_{\text{vap}}\) varie un peu avec \(T\), et la vapeur n'est pas exactement un gaz parfait).</p>
    <p><strong>Q2.</strong> \(\dfrac{1}{353} - \dfrac{1}{373} \approx 1{,}519\times10^{-4}\ \text{K}^{-1}\) ; \(\ln\dfrac{P}{1{,}013} = -\dfrac{42\,240}{8{,}314}\times1{,}519\times10^{-4}\), soit environ \(-0{,}772\), d'où \(P \approx 1{,}013\times0{,}462 \approx 0{,}468\ \text{bar}\) (la table donne 0,474 bar).</p>
    <p><strong>Q3.</strong> \(\ln\dfrac{0{,}55}{1{,}013} \approx -0{,}611\) ; \(\dfrac{1}{T} = \dfrac{1}{373} + \dfrac{0{,}611\times8{,}314}{42\,240}\), soit \(\dfrac{1}{T} \approx 2{,}801\times10^{-3}\ \text{K}^{-1}\), \(T \approx 357\ \text{K}\), soit 84 °C : la cuisson y est plus lente.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ☆ ☆</span>
  <h3>Règle des phases — variance (hors programme, pour aller plus loin)</h3>
  <div class="statement">La règle des phases de Gibbs donne la variance \(\mathcal V\) d'un système (nombre de variables intensives que l'on peut fixer librement) : \(\mathcal V = C + 2 - \varphi\), où \(C\) est le nombre de constituants et \(\varphi\) le nombre de phases.</div>
  <div class="q"><strong>Q1.</strong> Pour de l'eau pure (\(C = 1\)) en équilibre liquide-vapeur (\(\varphi = 2\)) : calculer \(\mathcal V\).</div>
  <div class="q"><strong>Q2.</strong> Au point triple (\(\varphi = 3\)) : calculer \(\mathcal V\). Que signifie \(\mathcal V = 0\) ?</div>
  <div class="q"><strong>Q3.</strong> Pour un mélange eau-éthanol (\(C = 2\)) en équilibre liquide-vapeur (\(\varphi = 2\)) : calculer \(\mathcal V\). Que peut-on fixer librement ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\mathcal V = 1 + 2 - 2 = 1\). On peut fixer librement \(T\) ou \(P\), mais pas les deux : la pression de vapeur saturante est entièrement déterminée par \(T\) (c'est le résultat du §3 du cours).</p>
    <p><strong>Q2.</strong> \(\mathcal V = 1 + 2 - 3 = 0\) : le point triple est un point unique du diagramme (P, T). On ne peut rien modifier sans faire disparaître une phase.</p>
    <p><strong>Q3.</strong> \(\mathcal V = 2 + 2 - 2 = 2\) : on peut fixer \(T\) et la composition du liquide, ou \(T\) et \(P\) indépendamment. C'est pourquoi la distillation eau-éthanol peut se faire sous différentes pressions et températures.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Bouteille de propane : pression, remplissage et soutirage</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>corps pur diphasé : diagrammes (P, T) et (P, v), titre, chauffage isochore, enthalpie et entropie de vaporisation</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une bouteille d'acier rigide, de volume intérieur \(V = 30{,}0\ \text{L}\) et de masse 14 kg, contient \(m = 12{,}5\ \text{kg}\) de propane, assimilé à un corps pur, réparti entre liquide et vapeur. Point critique du propane : 96,7 °C ; 42,5 bar ; \(v_c = 4{,}54\ \text{L·kg}^{-1}\). Capacités thermiques massiques : propane liquide \(c_L = 2{,}6\ \text{kJ·K}^{-1}\text{·kg}^{-1}\), acier \(0{,}46\ \text{kJ·K}^{-1}\text{·kg}^{-1}\). Propane saturé (valeurs calculées) :
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
      <tr><th style="text-align:left">θ (°C)</th><td>15</td><td>40</td><td>50</td><td>60</td><td>65</td><td>70</td></tr>
      <tr><th style="text-align:left">\(P_{\text{sat}}\) (bar)</th><td>7,32</td><td>13,7</td><td>17,1</td><td>21,2</td><td>23,4</td><td>25,9</td></tr>
      <tr><th style="text-align:left">\(v_L\) (L·kg⁻¹)</th><td>1,970</td><td>2,139</td><td>2,228</td><td>2,337</td><td>2,402</td><td>2,478</td></tr>
      <tr><th style="text-align:left">\(v_V\) (L·kg⁻¹)</th><td>63,2</td><td>33,2</td><td>25,9</td><td>20,2</td><td>17,8</td><td>15,6</td></tr>
      <tr><th style="text-align:left">\(\Delta h_{\text{vap}}\) (kJ·kg⁻¹)</th><td>352</td><td>307</td><td>285</td><td>259</td><td>245</td><td>229</td></tr>
    </table></div>
  </div>
  <p class="exo-part">Partie A — Pression dans la bouteille</p>
  <div class="q"><strong>A1.</strong> Justifier que, tant que la bouteille contient du liquide, la pression ne dépend que de la température. La donner à 15 °C et à 40 °C.</div>
  <div class="q"><strong>A2.</strong> Peut-on savoir avec un manomètre s'il reste beaucoup de propane ? Que proposer ?</div>
  <div class="q"><strong>A3.</strong> Peut-on avoir du propane liquide à 100 °C, sous une pression quelconque ?</div>
  <p class="exo-part">Partie B — Composition à 15 °C</p>
  <div class="q"><strong>B1.</strong> Calculer le volume massique moyen \(v\) du propane et montrer qu'il est diphasé à 15 °C.</div>
  <div class="q"><strong>B2.</strong> Calculer le titre en vapeur, la masse de vapeur, le volume occupé par le liquide et la fraction du volume intérieur qu'il remplit.</div>
  <div class="q"><strong>B3.</strong> Placer le point représentatif dans un diagramme de Clapeyron schématique et interpréter la petitesse du titre par la règle des moments.</div>
  <p class="exo-part">Partie C — Bouteille oubliée au soleil</p>
  <div class="q"><strong>C1.</strong> La bouteille fermée s'échauffe. Comment se déplace son point représentatif dans le diagramme de Clapeyron ? En comparant \(v\) à \(v_c\), prévoir l'évolution du niveau du liquide.</div>
  <div class="q"><strong>C2.</strong> Estimer à l'aide du tableau la température \(T_1\) à laquelle le liquide remplit la bouteille, et la pression correspondante.</div>
  <div class="q"><strong>C3.</strong> Au-delà de \(T_1\), la pression du liquide comprimé croît d'environ 3 bar par kelvin, contre 0,47 bar par kelvin le long de la courbe de saturation vers 65 °C. Expliquer cette différence. La bouteille a été éprouvée à 30 bar : vers quelle température cette pression est-elle atteinte ?</div>
  <div class="q"><strong>C4.</strong> Quelle masse maximale de propane peut-on introduire pour que la bouteille ne soit jamais pleine de liquide en dessous de 70 °C ?</div>
  <p class="exo-part">Partie D — Soutirage du gaz</p>
  <div class="q"><strong>D1.</strong> Un barbecue consomme 0,30 kg de propane par heure, prélevé sous forme de vapeur ; une masse égale de liquide se vaporise dans la bouteille, à 15 °C. Calculer l'énergie nécessaire à cette vaporisation en une heure.</div>
  <div class="q"><strong>D2.</strong> On suppose la bouteille isolée : cette énergie est prise au liquide restant (environ 12,2 kg) et à l'acier. De combien la température baisse-t-elle en une heure ? Quelle conséquence sur la pression ?</div>
  <div class="q"><strong>D3.</strong> Avec un brûleur qui consomme 2,0 kg par heure, qu'observe-t-on sur la bouteille ?</div>
  <div class="q"><strong>D4.</strong> Calculer la variation d'entropie des 0,30 kg de propane vaporisés à 15 °C.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Liquide et vapeur d'un corps pur en équilibre : \(P\) et \(T\) sont liées, \(P = P_{\text{sat}}(T)\), quelle que soit la répartition entre les phases. \(P = 7{,}32\ \text{bar}\) à 15 °C, \(13{,}7\ \text{bar}\) à 40 °C.</p>
    <p><strong>A2.</strong> Non : la pression reste \(P_{\text{sat}}(T)\) tant qu'il reste une goutte de liquide, et ne chute qu'à la toute fin. On pèse la bouteille (tare connue).</p>
    <p><strong>A3.</strong> Non : 100 °C est au-dessus de la température critique (96,7 °C). Il n'existe plus de liquide distinct de la vapeur ; sous forte pression, on a un fluide supercritique.</p>
    <p><strong>B1.</strong> \(v = V/m = 30{,}0/12{,}5 = 2{,}40\ \text{L·kg}^{-1}\), compris entre \(v_L = 1{,}970\) et \(v_V = 63{,}2\ \text{L·kg}^{-1}\) à 15 °C : mélange diphasé.</p>
    <p><strong>B2.</strong> \(x = \dfrac{2{,}40 - 1{,}970}{63{,}2 - 1{,}970} \approx 7{,}0\times10^{-3}\) ; \(m_V \approx 88\ \text{g}\) ; \(m_L \approx 12{,}41\ \text{kg}\), qui occupent \(12{,}41\times1{,}970 \approx 24{,}5\ \text{L}\), soit 82 % du volume intérieur ; les 88 g de vapeur occupent les 5,5 L restants.</p>
    <p><strong>B3.</strong> Sur le palier à 7,32 bar, le point M (\(2{,}40\ \text{L·kg}^{-1}\)) est tout près de L (\(1{,}97\)) et très loin de V (\(63{,}2\)) : \(x = \mathrm{LM}/\mathrm{LV}\) est petit. La vapeur, 32 fois moins dense que le liquide, occupe 18 % du volume avec moins de 1 % de la masse.</p>
    <p><strong>C1.</strong> \(m\) et \(V\) sont fixés : \(v\) est constant, le point monte verticalement. Comme \(v = 2{,}40\ \text{L·kg}^{-1} \lt v_c = 4{,}54\ \text{L·kg}^{-1}\), la verticale sort de la cloche par la courbe d'<strong>ébullition</strong> : le liquide se dilate (\(v_L\) augmente avec \(T\)), le niveau monte et le liquide finit par remplir la bouteille.</p>
    <p><strong>C2.</strong> Il faut \(v_L(T_1) = 2{,}40\ \text{L·kg}^{-1}\) : le tableau donne 2,402 à 65 °C, donc \(T_1 \approx 65\ °\text{C}\), sous \(P_{\text{sat}} \approx 23{,}4\ \text{bar}\). Une bouteille au soleil, dans une voiture fermée, peut atteindre cette température.</p>
    <p><strong>C3.</strong> Sur la courbe de saturation, chauffer vaporise un peu de liquide et la pression suit \(P_{\text{sat}}(T)\). Une fois la bouteille pleine de liquide, le liquide, presque incompressible, ne peut plus se dilater : la pression doit croître énormément pour empêcher la dilatation (branche liquide quasi verticale des isothermes). 30 bar sont atteints pour \(T \approx 65 + \dfrac{30 - 23{,}4}{3} \approx 67\ °\text{C}\) : quelques degrés suffisent à dépasser la pression d'épreuve, d'où le risque d'éclatement.</p>
    <p><strong>C4.</strong> Il faut \(m\,v_L(70\ °\text{C}) \le V\), soit \(m \le \dfrac{30{,}0}{2{,}478} \approx 12{,}1\ \text{kg}\) : la bouteille de l'énoncé est légèrement trop remplie pour cette exigence. C'est l'origine des taux de remplissage réglementaires des gaz liquéfiés.</p>
    <p><strong>D1.</strong> \(Q = m\,\Delta h_{\text{vap}}(15\ °\text{C}) = 0{,}30\times352 \approx 106\ \text{kJ}\) en une heure, soit une puissance moyenne d'environ 29 W.</p>
    <p><strong>D2.</strong> Capacité thermique : \(12{,}2\times2{,}6 + 14\times0{,}46 \approx 38{,}2\ \text{kJ·K}^{-1}\). Baisse de température : \(106/38{,}2 \approx 2{,}8\ \text{K}\) en une heure. La pression suit \(P_{\text{sat}}(T)\) et diminue (6,8 bar à 12,2 °C d'après les tables). En pratique, l'air ambiant réchauffe la bouteille et limite cette baisse.</p>
    <p><strong>D3.</strong> L'énergie à fournir est près de sept fois plus grande : la bouteille isolée perdrait \(2{,}0\times352/38{,}2 \approx 18\ \text{K}\) par heure. La bouteille se refroidit nettement, la vapeur d'eau de l'air se condense puis givre sur sa paroi au niveau du liquide, et la pression baisse au point de réduire le débit. On utilise alors plusieurs bouteilles en parallèle.</p>
    <p><strong>D4.</strong> Vaporisation à \(T = 288{,}15\ \text{K}\) : \(\Delta S = \dfrac{m\,\Delta h_{\text{vap}}}{T} = \dfrac{0{,}30\times352\times10^3}{288{,}15}\), soit environ \(367\ \text{J·K}^{-1}\).</p>
  </div>
</div>
