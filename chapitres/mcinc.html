  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 2.5 du programme de PTSI, « Moment cinétique » (second semestre). Il s'appuie sur la cinématique (chapitre « Cinématique du point », coordonnées polaires et cylindriques) et sur les lois de Newton (chapitre « Principes de la dynamique »). Il fournit les outils des deux chapitres suivants : « Mouvement dans un champ central » (conservation du moment cinétique, loi des aires, lois de Kepler) et « Mouvement d'un solide » (moment d'inertie, couple, liaison pivot, pendule pesant). Ici, on étudie le point matériel et les systèmes de quelques points.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>

      <ul>

        <li><strong>Moment cinétique d'un système discret de points par rapport à un axe orienté</strong> : utiliser le caractère algébrique du moment cinétique scalaire (§2, §3).</li>
        <li><strong>Moment d'une force par rapport à un point ou un axe orienté</strong> : exprimer le moment d'une force par rapport à un axe orienté en utilisant le bras de levier (§4, §5).</li>
        <li><strong>Théorème du moment cinétique en un point fixe dans un référentiel galiléen</strong> (§6).</li>
        <li><strong>Conservation du moment cinétique</strong> : identifier les cas de conservation du moment cinétique (§7, §8).</li>
      </ul>
      <p>Hors programme (regroupé en fin de chapitre) : le théorème du moment cinétique en un point mobile, la précession gyroscopique, le moment cinétique d'un solide quelconque (vecteur non colinéaire à l'axe de rotation). Le moment d'inertie d'un solide et le théorème scalaire du moment cinétique pour un solide sont traités dans « Mouvement d'un solide » ; les forces centrales et les lois de Kepler dans « Mouvement dans un champ central ».</p>

<div class="course-section">
  <div class="sec-num">§1 · LE MOMENT CINÉTIQUE D'UN POINT</div>
  <h2>Une grandeur adaptée aux rotations</h2>
  <div class="intro">Pour un point en mouvement circulaire uniforme, la quantité de mouvement \(\vec p=m\vec v\) change sans cesse de direction : elle ne dit pas simplement « ça tourne, toujours de la même façon ». Le moment cinétique, lui, reste constant. Il mesure la quantité de rotation d'un point autour d'un point fixe, et devient la grandeur naturelle dès que les forces ont un centre (gravitation, fil, pivot).</div>
  <div class="def-box">
    <strong>Moment cinétique par rapport à un point.</strong> Dans un référentiel \(\mathcal R\), le moment cinétique du point matériel \(M\), de masse \(m\) et de vitesse \(\vec v\), par rapport au point \(O\) est
    <div class="formula" data-nom="Moment cinétique d'un point">$$\vec L_O=\overrightarrow{OM}\wedge m\,\vec v=\overrightarrow{OM}\wedge\vec p$$</div>
    Il s'exprime en \(\text{kg·m}^2\text{·s}^{-1}\) (soit des \(\text{J·s}\)). Il dépend du point \(O\) choisi et du référentiel.
  </div>
  <div class="prop-box">
    <strong>Direction, sens et norme.</strong> D'après les propriétés du produit vectoriel :
    <ul>
      <li><strong>direction</strong> : \(\vec L_O\) est perpendiculaire au plan qui contient \(O\), \(M\) et \(\vec v\) ; pour un mouvement plan contenant \(O\), il est perpendiculaire au plan du mouvement ;</li>
      <li><strong>sens</strong> : règle de la main droite. Les doigts de la main droite suivent le mouvement de \(M\) autour de \(O\), le pouce indique \(\vec L_O\) ;</li>
      <li><strong>norme</strong> : \(\|\vec L_O\|=m\,v\,OM\,|\sin\alpha|=m\,v\,d\), où \(\alpha\) est l'angle entre \(\overrightarrow{OM}\) et \(\vec v\), et \(d\) la distance de \(O\) à la droite qui porte \(\vec v\) (le <strong>bras de levier</strong> de la quantité de mouvement).</li>
    </ul>
  </div>

  <div class="method-box"><strong>Exemple — balle en rotation au bout d'une ficelle</strong>
    <p>Une balle de 0,20 kg tourne à 2,0 tours par seconde sur un cercle horizontal de rayon 0,80 m, dans le sens direct vu d'au-dessus.</p>
    <ol>
      <li>\(\omega=2\pi\times2{,}0\approx12{,}6\ \text{rad·s}^{-1}\) et \(v=R\omega\approx10{,}1\ \text{m·s}^{-1}\).</li>
      <li>\(\overrightarrow{OM}\) et \(\vec v\) sont perpendiculaires : \(\|\vec L_O\|=mRv=mR^2\omega\approx1{,}61\ \text{kg·m}^2\text{·s}^{-1}\).</li>
      <li>Direction : l'axe vertical du cercle ; sens : vers le haut (rotation dans le sens direct vu d'au-dessus). \(\vec L_O\) est le même à chaque instant, alors que \(\vec p\) tourne.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — palet en mouvement rectiligne uniforme</strong>
    <p>Un palet de hockey (0,16 kg) glisse en ligne droite à \(20\ \text{m·s}^{-1}\) et passe à 3,0 m d'un point \(O\) de la patinoire.</p>
    <ol>
      <li>Le bras de levier est \(d=3{,}0\ \text{m}\) à chaque instant (figure ci-dessous) : \(\|\vec L_O\|=mvd=9{,}6\ \text{kg·m}^2\text{·s}^{-1}\), constant.</li>
      <li>Par rapport à un point \(O'\) de la trajectoire, \(d=0\) et \(\vec L_{O'}=\vec 0\) : un point qui ne tourne pas autour de \(O'\) n'a pas de moment cinétique par rapport à lui.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · MOMENT CINÉTIQUE PAR RAPPORT À UN AXE ORIENTÉ</div>
  <h2>Une grandeur scalaire, avec un signe</h2>
  <div class="intro">Beaucoup de rotations ont lieu autour d'un axe fixe : porte, roue, manège, pendule. On n'a alors besoin que d'un nombre : la projection du moment cinétique sur l'axe. Son signe dit dans quel sens le point tourne autour de l'axe.</div>
  <div class="def-box">
    <strong>Moment cinétique scalaire.</strong> Soit \(\Delta\) un axe orienté par le vecteur unitaire \(\vec u_\Delta\), et \(O\) un point de \(\Delta\). Le moment cinétique de \(M\) par rapport à \(\Delta\) est le nombre
    <div class="formula" data-nom="Moment cinétique par rapport à un axe">$$L_\Delta=\vec L_O\cdot\vec u_\Delta$$</div>
    Il ne dépend pas du point \(O\) choisi sur l'axe.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Le choix du point sur l'axe est indifférent</span><div class="content">
    <p>Soit \(O'\) un autre point de \(\Delta\) : \(\overrightarrow{O'M}=\overrightarrow{O'O}+\overrightarrow{OM}\) avec \(\overrightarrow{O'O}=\lambda\,\vec u_\Delta\). Alors \(\vec L_{O'}=\vec L_O+\lambda\,\vec u_\Delta\wedge m\vec v\). Le vecteur \(\vec u_\Delta\wedge m\vec v\) est orthogonal à \(\vec u_\Delta\) : sa projection sur l'axe est nulle, et \(\vec L_{O'}\cdot\vec u_\Delta=\vec L_O\cdot\vec u_\Delta\).</p>
  </div></div>
  <div class="prop-box">
    <strong>En coordonnées cylindriques d'axe \(Oz=\Delta\).</strong> Avec \(\overrightarrow{OM}=r\,\vec e_r+z\,\vec e_z\) et \(\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+\dot z\,\vec e_z\) (chapitre « Cinématique du point », §3), seule la composante orthoradiale de la vitesse contribue :
    <div class="formula" data-nom="Moment cinétique scalaire en cylindriques">$$L_z=m\,r\,v_\theta=m\,r^2\dot\theta$$</div>
    <strong>Caractère algébrique</strong> : \(L_z\gt0\) si \(M\) tourne dans le sens direct autour de \(\vec e_z\) (\(\dot\theta\gt0\)), \(L_z\lt0\) dans le sens indirect, \(L_z=0\) si \(M\) se rapproche ou s'éloigne de l'axe sans tourner autour.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Calcul de \(L_z\)</span><div class="content">
    <p>Avec la base directe \((\vec e_r,\vec e_\theta,\vec e_z)\) : \(\vec e_r\wedge\vec e_\theta=\vec e_z\), \(\vec e_r\wedge\vec e_z=-\vec e_\theta\), \(\vec e_z\wedge\vec e_r=\vec e_\theta\), \(\vec e_z\wedge\vec e_\theta=-\vec e_r\). En développant le produit</p>
    <div class="formula">$$(r\,\vec e_r+z\,\vec e_z)\wedge(\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta+\dot z\,\vec e_z),$$</div>
    <p>le seul terme selon \(\vec e_z\) est \(r\cdot r\dot\theta\,\vec e_r\wedge\vec e_\theta=r^2\dot\theta\,\vec e_z\). Les autres termes (\(-r\dot z\,\vec e_\theta\), \(z\dot r\,\vec e_\theta\), \(-zr\dot\theta\,\vec e_r\)) sont orthogonaux à l'axe.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — voitures dans un rond-point</strong>
    <p>Une voiture de 1 200 kg roule à \(36\ \text{km·h}^{-1}\) sur un rond-point de rayon 15 m. En France, on y tourne dans le sens direct vu d'au-dessus. On oriente l'axe vertical \(\Delta\) du rond-point vers le haut.</p>
    <ol>
      <li>\(v=10\ \text{m·s}^{-1}\), \(\dot\theta=v/r\approx0{,}67\ \text{rad·s}^{-1}\) : \(L_\Delta=mr^2\dot\theta=mrv=1{,}8\times10^5\ \text{kg·m}^2\text{·s}^{-1}\), positif.</li>
      <li>Avec l'axe orienté vers le bas, on trouverait \(-1{,}8\times10^5\) : le signe n'a de sens qu'avec l'orientation de l'axe.</li>
      <li>Une voiture qui roule à contresens aurait \(L_\Delta\lt0\) ; une voiture qui quitte le rond-point en ligne droite garde \(L_\Delta=mvd\), où \(d\) est la distance de l'axe à sa trajectoire.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(L_\Delta\) (un nombre, positif ou négatif) et la norme \(\|\vec L_O\|\) (toujours positive). Pour le pendule conique (§7), \(\vec L_O\) n'est même pas porté par l'axe vertical : \(L_z\) n'en est que la projection.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SYSTÈME DISCRET DE POINTS</div>
  <h2>Sommer des moments cinétiques algébriques</h2>
  <div class="intro">Une haltère qui tourne, deux enfants sur un manège, les pales d'un ventilateur : un système de plusieurs points tourne autour d'un axe. Son moment cinétique est la somme de ceux de ses points, chacun avec son signe.</div>
  <div class="def-box">
    <strong>Système discret.</strong> Le moment cinétique d'un système de points \(M_i\) (masses \(m_i\), vitesses \(\vec v_i\)) par rapport à un point \(O\), puis à un axe orienté \(\Delta\) passant par \(O\), est
    <div class="formula" data-nom="Moment cinétique d'un système de points">$$\vec L_O=\sum_i\overrightarrow{OM_i}\wedge m_i\,\vec v_i\qquad L_\Delta=\sum_i L_{\Delta,i}=\sum_i m_i\,r_i^2\,\dot\theta_i$$</div>
    où \(r_i\) est la distance de \(M_i\) à l'axe. Les termes s'ajoutent <strong>algébriquement</strong> : deux points qui tournent en sens contraires ont des contributions de signes opposés.
  </div>
  <div class="prop-box">
    <strong>Points tournant ensemble.</strong> Si tous les points tournent autour de \(\Delta\) avec la même vitesse angulaire \(\omega=\dot\theta\) (système rigide), \(L_\Delta=\left(\sum_i m_ir_i^2\right)\omega\). La somme \(J_\Delta=\sum m_ir_i^2\) est le <strong>moment d'inertie</strong> du système par rapport à l'axe : c'est le point de départ du chapitre « Mouvement d'un solide » (§3).
  </div>
  <div class="method-box"><strong>Exemple — haltère en rotation</strong>
    <p>Deux masses de 0,50 kg, fixées aux extrémités d'une tige légère de 60 cm, tournent à \(\omega=5{,}0\ \text{rad·s}^{-1}\) autour d'un axe perpendiculaire passant par le milieu de la tige.</p>
    <ol>
      <li>Chaque masse est à \(r=0{,}30\ \text{m}\) de l'axe : \(J_\Delta=2\times0{,}50\times0{,}30^2=0{,}090\ \text{kg·m}^2\).</li>
      <li>\(L_\Delta=J_\Delta\,\omega=0{,}45\ \text{kg·m}^2\text{·s}^{-1}\) : les deux contributions, de même signe, s'ajoutent.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — deux palets qui tournent en sens contraires</strong>
    <p>Sur une table, deux palets de 0,20 kg tournent autour du même axe vertical : l'un à 0,50 m de l'axe avec \(\dot\theta_1=+2{,}0\ \text{rad·s}^{-1}\), l'autre à 0,25 m avec \(\dot\theta_2=-8{,}0\ \text{rad·s}^{-1}\).</p>
    <ol>
      <li>\(L_1=0{,}20\times0{,}50^2\times2{,}0=+0{,}10\ \text{kg·m}^2\text{·s}^{-1}\) et \(L_2=0{,}20\times0{,}25^2\times(-8{,}0)=-0{,}10\ \text{kg·m}^2\text{·s}^{-1}\).</li>
      <li>\(L_\Delta=0\) : le système a un moment cinétique nul alors que chacun de ses points tourne. C'est le principe des hélicoptères à deux rotors contrarotatifs, qui n'ont pas besoin de rotor de queue.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : ajouter les normes des moments cinétiques. On additionne des vecteurs, ou des projections algébriques sur un même axe orienté, jamais des normes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · MOMENT D'UNE FORCE PAR RAPPORT À UN POINT</div>
  <h2>La capacité d'une force à faire tourner</h2>
  <div class="intro">Pour ouvrir une porte, on pousse loin des gonds et perpendiculairement à la porte ; pousser vers les gonds ne sert à rien. Ce qui compte n'est pas seulement l'intensité de la force, mais aussi sa position et sa direction : c'est ce que mesure son moment.</div>
  <div class="def-box">
    <strong>Moment d'une force par rapport à un point.</strong> Le moment de la force \(\vec F\), appliquée au point \(M\), par rapport au point \(O\) est
    <div class="formula" data-nom="Moment d'une force par rapport à un point">$$\vec{\mathcal M}_O(\vec F)=\overrightarrow{OM}\wedge\vec F$$</div>
    Il s'exprime en \(\text{N·m}\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong>
    <ul>
      <li>\(\|\vec{\mathcal M}_O(\vec F)\|=F\,d\), où \(d\) est la distance de \(O\) à la <strong>droite d'action</strong> de \(\vec F\) (la droite qui passe par \(M\) et porte \(\vec F\)) : c'est le <strong>bras de levier</strong> ;</li>
      <li>le moment ne change pas si l'on fait glisser le point d'application le long de la droite d'action ;</li>
      <li>le moment est <strong>nul</strong> si la droite d'action passe par \(O\) : c'est le cas d'une force centrale de centre \(O\), de la tension d'un fil attaché en \(O\), ou de la réaction d'une glissière circulaire de centre \(O\) sans frottement ;</li>
      <li>pour plusieurs forces appliquées au même point, le moment de la somme est la somme des moments.</li>
    </ul>
  </div>
  <div class="method-box"><strong>Exemple — moment du poids d'un pendule</strong>
    <p>Une masse de 0,50 kg est au bout d'un fil de 1,2 m attaché en \(O\), écarté de \(\theta=30^\circ\) de la verticale. On prend \(\vec e_x\) horizontal, \(\vec e_y\) vertical ascendant, \(\vec e_z=\vec e_x\wedge\vec e_y\), et \(\theta\) compté dans le sens direct autour de \(\vec e_z\).</p>
    <ol>
      <li>\(\overrightarrow{OM}=\ell(\sin\theta\,\vec e_x-\cos\theta\,\vec e_y)\) et \(\vec P=-mg\,\vec e_y\).</li>
      <li>Le terme en \(\vec e_y\wedge\vec e_y\) est nul et \(\vec e_x\wedge\vec e_y=\vec e_z\) : \(\vec{\mathcal M}_O(\vec P)=-mg\ell\sin\theta\,\vec e_z\).</li>
      <li>Norme : \(mg\ell\sin\theta=0{,}50\times9{,}81\times1{,}2\times0{,}5\approx2{,}9\ \text{N·m}\). Bras de levier : \(\ell\sin\theta=0{,}60\ \text{m}\), distance de \(O\) à la verticale qui passe par \(M\). Le signe \(-\) traduit un moment qui ramène le pendule vers la verticale.</li>
      <li>La tension du fil, portée par \(\overrightarrow{MO}\), a un moment nul par rapport à \(O\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre comme bras de levier la distance de \(O\) au <strong>point d'application</strong>. C'est la distance de \(O\) à la <strong>droite d'action</strong> qui compte ; les deux ne coïncident que si la force est perpendiculaire à \(\overrightarrow{OM}\). Autre piège : écrire le moment en joules. Le \(\text{N·m}\) d'un moment n'est pas une énergie.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MOMENT PAR RAPPORT À UN AXE ORIENTÉ ET BRAS DE LEVIER</div>
  <h2>Le calcul qu'on fait vraiment</h2>
  <div class="intro">Pour un objet qui tourne autour d'un axe fixe, seul compte le moment des forces par rapport à cet axe. Le bras de levier permet de l'écrire sans produit vectoriel, à condition de bien choisir son signe.</div>
  <div class="def-box">
    <strong>Moment par rapport à un axe.</strong> Pour un axe \(\Delta\) orienté par \(\vec u_\Delta\) et passant par \(O\) : \(\mathcal M_\Delta(\vec F)=\vec{\mathcal M}_O(\vec F)\cdot\vec u_\Delta\). C'est un nombre algébrique, indépendant du point \(O\) choisi sur l'axe (même démonstration qu'au §2). En cylindriques d'axe \(Oz\), avec \(\vec F=F_r\,\vec e_r+F_\theta\,\vec e_\theta+F_z\,\vec e_z\) appliquée à la distance \(r\) de l'axe : \(\mathcal M_z(\vec F)=r\,F_\theta\).
  </div>
  <div class="prop-box">
    <strong>Bras de levier.</strong> Pour une force contenue dans un plan perpendiculaire à l'axe (cas usuel),
    <div class="formula" data-nom="Moment par rapport à un axe (bras de levier)">$$\mathcal M_\Delta(\vec F)=\pm F\,d$$</div>
    où \(d\) est la distance entre l'axe et la droite d'action de \(\vec F\). Le signe est \(+\) si la force tend à faire tourner dans le sens positif autour de \(\vec u_\Delta\) (règle de la main droite), \(-\) sinon. Une force <strong>parallèle à l'axe</strong> ou dont la droite d'action <strong>rencontre l'axe</strong> a un moment nul par rapport à cet axe.
  </div>

    <ol>
      <li>On tire à 40 N au bout d'une clé de 25 cm, perpendiculairement au manche : \(d=0{,}25\ \text{m}\), moment \(10\ \text{N·m}\). Si la force fait 60° avec le manche, \(d=0{,}25\sin60^\circ\approx0{,}22\ \text{m}\) et le moment tombe à \(8{,}7\ \text{N·m}\).</li>

    </ol>

  <div class="def-box">
    <strong>Couple.</strong> Un <strong>couple</strong> est un ensemble de forces de résultante nulle mais de moment non nul. Le plus simple : deux forces opposées \(\vec F\) et \(-\vec F\), de droites d'action parallèles distantes de \(d\) (mains sur un volant, tournevis). Son moment vaut \(\pm F\,d\) par rapport à tout axe perpendiculaire à leur plan : il ne dépend pas de l'axe. On le note souvent \(\Gamma\) (couple moteur, couple de frottement) : chapitre « Mouvement d'un solide », §4.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Le moment d'un couple ne dépend pas du point</span><div class="content">
    <p>Si \(\vec F\) est appliquée en \(A\) et \(-\vec F\) en \(B\), alors pour tout point \(O\) :</p>
    <div class="formula">$$\overrightarrow{OA}\wedge\vec F+\overrightarrow{OB}\wedge(-\vec F)=(\overrightarrow{OA}-\overrightarrow{OB})\wedge\vec F=\overrightarrow{BA}\wedge\vec F,$$</div>
    <p>qui ne dépend pas de \(O\). Sa norme est \(F\,d\), où \(d\) est la distance entre les deux droites d'action.</p>
  </div></div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le signe, ou le choisir d'après le sens de la force plutôt que d'après le sens dans lequel elle ferait tourner. Fixer d'abord l'orientation de l'axe, puis, pour chaque force, se demander : « seule, ferait-elle tourner dans le sens \(+\) ou \(-\) ? ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LE THÉORÈME DU MOMENT CINÉTIQUE</div>
  <h2>Les forces font varier le moment cinétique par leur moment</h2>
  <div class="intro">Le principe fondamental relie la variation de \(\vec p\) à la somme des forces. Son équivalent pour les rotations relie la variation de \(\vec L_O\) à la somme des moments. Ce n'est pas une loi nouvelle : il se déduit du principe fondamental. Son intérêt est pratique : les forces dont la droite d'action passe par \(O\) disparaissent de l'équation.</div>
  <div class="prop-box">
    <strong>Théorème du moment cinétique (point matériel).</strong> Dans un référentiel galiléen, pour un point \(O\) <strong>fixe</strong> :
    <div class="formula" data-nom="Théorème du moment cinétique">$$\frac{\mathrm d\vec L_O}{\mathrm dt}=\sum\vec{\mathcal M}_O(\vec F)$$</div>
    En projection sur un axe fixe \(\Delta\) orienté, passant par \(O\) : \(\dfrac{\mathrm dL_\Delta}{\mathrm dt}=\sum\mathcal M_\Delta(\vec F)\) (forme scalaire).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">À partir du principe fondamental</span><div class="content">
    <p>\(O\) étant fixe, \(\dfrac{\mathrm d\overrightarrow{OM}}{\mathrm dt}=\vec v\). En dérivant le produit : \(\dfrac{\mathrm d\vec L_O}{\mathrm dt}=\vec v\wedge m\vec v+\overrightarrow{OM}\wedge m\dfrac{\mathrm d\vec v}{\mathrm dt}\). Le premier terme est nul (vecteurs colinéaires) ; le principe fondamental, \(m\,\mathrm d\vec v/\mathrm dt=\sum\vec F\), donne le second : \(\overrightarrow{OM}\wedge\sum\vec F=\sum\overrightarrow{OM}\wedge\vec F\). Si \(O\) bougeait, le terme \(\dfrac{\mathrm d\overrightarrow{OM}}{\mathrm dt}\ne\vec v\) ne s'annulerait plus.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — vérification sur une chute libre</strong>
    <p>Une bille de 0,10 kg est lâchée sans vitesse en un point situé à \(d=0{,}50\ \text{m}\) à droite de \(O\). Axe \(Oz\) vers le lecteur, \(\vec e_x\) vers la droite, \(\vec e_y\) vers le haut.</p>
    <ol>
      <li>\(\overrightarrow{OM}=d\,\vec e_x+y\,\vec e_y\), \(\vec v=-gt\,\vec e_y\) : \(L_z=m(x\,v_y-y\,v_x)=-mgd\,t\). Le moment cinétique croît en valeur absolue alors que \(O\) n'est pas sur la trajectoire.</li>
      <li>Moment du poids : bras de levier \(d\), la bille tend à tourner dans le sens indirect autour de \(Oz\) : \(\mathcal M_z=-mgd=-0{,}49\ \text{N·m}\).</li>
      <li>On a bien \(\mathrm dL_z/\mathrm dt=-mgd=\mathcal M_z\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — le pendule simple en une ligne</strong>
    <p>Masse \(m\) au bout d'un fil idéal de longueur \(\ell\), attaché en \(O\) fixe ; mouvement dans un plan vertical, angle \(\theta\) compté dans le sens direct autour de l'axe \(Oz\) perpendiculaire au plan.</p>
    <ol>
      <li>Moment cinétique : \(r=\ell\) constant, donc \(L_z=m\ell^2\dot\theta\) (§2).</li>
      <li>Moments : la tension passe par \(O\) (moment nul) ; le poids a pour moment \(-mg\ell\sin\theta\) (§4).</li>
      <li>Théorème : \(m\ell^2\ddot\theta=-mg\ell\sin\theta\), soit \(\ddot\theta+\dfrac g\ell\sin\theta=0\). La tension, inconnue, n'est jamais apparue : le principe fondamental donnait la même équation par projection sur \(\vec e_\theta\) (chapitre « Principes de la dynamique », §11), mais il faut savoir quelle projection faire.</li>
      <li>Pour \(\ell=1{,}0\ \text{m}\) et de petites oscillations : \(\omega_0=\sqrt{g/\ell}\approx3{,}13\ \text{rad·s}^{-1}\), \(T_0\approx2{,}01\ \text{s}\) (chapitre « Oscillateurs harmoniques »).</li>
    </ol>
  </div>
  <h3>Système de points : seules les forces extérieures comptent</h3>
  <div class="prop-box">
    <strong>Théorème du moment cinétique pour un système.</strong> Pour un système de points, dans un référentiel galiléen et par rapport à un point fixe \(O\) (ou à un axe fixe \(\Delta\)) : \(\dfrac{\mathrm d\vec L_O}{\mathrm dt}=\sum\vec{\mathcal M}_O(\vec F_{\text{ext}})\). Les moments des forces intérieures se compensent deux à deux.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Système de deux points</span><div class="content">
    <p>On écrit le théorème pour chaque point et l'on ajoute. Les forces intérieures \(\vec F_{2\to1}\) (en \(M_1\)) et \(\vec F_{1\to2}=-\vec F_{2\to1}\) (en \(M_2\)) apportent</p>
    <div class="formula">$$\overrightarrow{OM_1}\wedge\vec F_{2\to1}+\overrightarrow{OM_2}\wedge\vec F_{1\to2}=\overrightarrow{M_2M_1}\wedge\vec F_{2\to1}.$$</div>
    <p>D'après la troisième loi de Newton, ces deux forces ont la même droite d'action, la droite \((M_1M_2)\) : le produit vectoriel est nul.</p>
  </div></div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le théorème en un point qui bouge (la masse elle-même, le centre d'une roue qui roule…). En PTSI, on l'applique uniquement en un point fixe, ou par rapport à un axe fixe, d'un référentiel galiléen.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CONSERVATION DU MOMENT CINÉTIQUE</div>
  <h2>Repérer les situations où il reste constant</h2>
  <div class="intro">Le principal intérêt du moment cinétique est d'être conservé dans des situations fréquentes, que le théorème permet de repérer d'un coup d'œil. Une grandeur conservée remplace une équation différentielle par une relation entre l'état initial et l'état final.</div>
  <div class="prop-box">
    <strong>Les cas de conservation.</strong> Dans un référentiel galiléen :
    <ul>
      <li><strong>point isolé ou pseudo-isolé</strong> (\(\sum\vec F=\vec 0\)) : \(\vec L_O\) est constant pour tout point fixe \(O\) ; c'est le mouvement rectiligne uniforme (§1) ;</li>
      <li><strong>force(s) dont la droite d'action passe par un point fixe \(O\)</strong> (force centrale, fil attaché en \(O\)) : \(\vec L_O\) est constant ; le mouvement est plan et suit la loi des aires (chapitre « Mouvement dans un champ central », §1-2) ;</li>
      <li><strong>forces parallèles à un axe fixe \(\Delta\) ou qui le rencontrent</strong> : seul \(L_\Delta\) est constant, pas forcément le vecteur \(\vec L_O\) ;</li>
      <li><strong>système de points</strong> soumis à des forces extérieures de moment total nul par rapport à \(\Delta\) : \(L_\Delta\) du système est constant, même si le système se déforme (tabouret d'inertie, patineuse : chapitre « Mouvement d'un solide », §10).</li>
    </ul>
  </div>
  <div class="method-box"><strong>Exemple — palet retenu par un fil qui passe par un trou</strong>
    <p>Un palet de 0,20 kg glisse sans frottement sur une table horizontale ; un fil, qui passe par un trou \(O\) de la table, le retient. Il tourne d'abord sur un cercle de rayon \(r_1=0{,}50\ \text{m}\) à \(v_1=1{,}5\ \text{m·s}^{-1}\). On tire le fil par-dessous jusqu'à \(r_2=0{,}20\ \text{m}\).</p>
    <ol>
      <li>Forces : poids et réaction de la table, verticales (parallèles à l'axe vertical passant par \(O\)) ; tension du fil, dont la droite d'action passe par \(O\). Toutes ont un moment nul par rapport à l'axe : \(L_z=mr^2\dot\theta\) est conservé.</li>
      <li>Sur le cercle final, \(mr_2v_2=mr_1v_1\), d'où \(v_2=v_1r_1/r_2=3{,}75\ \text{m·s}^{-1}\).</li>
      <li>L'énergie cinétique passe de 0,23 J à 1,41 J : \(+1{,}18\ \text{J}\). Ce n'est pas une contradiction : la tension est centrale, mais elle travaille, puisque le palet se rapproche de \(O\). Le fil étant tiré lentement, le travail de l'opérateur vaut \(\int_{r_2}^{r_1}\dfrac{mC^2}{r^3}\,\mathrm dr=1{,}18\ \text{J}\) avec \(C=r_1v_1\) (la tension nécessaire croît comme \(1/r^3\) : de 0,9 N à 14 N).</li>
    </ol>
  </div>

  <div class="method-box"><strong>Exemple — pendule conique : \(L_z\) conservé, \(\vec L_O\) non</strong>
    <p>Une masse au bout d'un fil de longueur \(\ell=0{,}50\ \text{m}\) attaché en \(O\) décrit un cercle horizontal, le fil faisant l'angle constant \(\alpha=30^\circ\) avec la verticale \(Oz\).</p>
    <ol>
      <li>Le poids est parallèle à \(Oz\) et la tension passe par \(O\), sur l'axe : \(L_z=mr^2\dot\theta\) est conservé ; comme \(r=\ell\sin\alpha\) est constant, \(\dot\theta\) l'est aussi : le mouvement est uniforme.</li>
      <li>Le poids a un moment non nul par rapport à \(O\) (horizontal, de norme \(mg\ell\sin\alpha\)) : \(\vec L_O\) n'est pas constant. Sa composante horizontale tourne avec la masse ; le théorème vectoriel, projeté, donne \(\omega=\sqrt{g/(\ell\cos\alpha)}\approx4{,}8\ \text{rad·s}^{-1}\) (période 1,3 s ; exercice 06).</li>

<div class="course-section">
  <div class="sec-num">§8 · ANALOGIES, CHOIX DE LA MÉTHODE ET ORDRES DE GRANDEUR</div>
  <h2>Translation et rotation : un dictionnaire</h2>
  <div class="intro">Les grandeurs de rotation se correspondent avec celles de translation. Ce dictionnaire aide à retenir les formules et à choisir l'outil d'un problème.</div>
  <table>
    <tr><th>Translation</th><th>Rotation autour d'un axe fixe \(\Delta\)</th></tr>
    <tr><td>quantité de mouvement \(\vec p=m\vec v\)</td><td>moment cinétique \(\vec L_O=\overrightarrow{OM}\wedge m\vec v\), \(L_\Delta\)</td></tr>
    <tr><td>force \(\vec F\)</td><td>moment \(\vec{\mathcal M}_O(\vec F)\), \(\mathcal M_\Delta=\pm Fd\)</td></tr>
    <tr><td>principe fondamental \(\mathrm d\vec p/\mathrm dt=\sum\vec F\)</td><td>théorème du moment cinétique \(\mathrm d\vec L_O/\mathrm dt=\sum\vec{\mathcal M}_O\)</td></tr>
    <tr><td>masse \(m\)</td><td>moment d'inertie \(J_\Delta=\sum m_ir_i^2\) (\(L_\Delta=J_\Delta\omega\))</td></tr>
    <tr><td>\(\vec p\) conservé si \(\sum\vec F=\vec 0\)</td><td>\(L_\Delta\) conservé si \(\sum\mathcal M_\Delta=0\)</td></tr>
  </table>
  <div class="prop-box">
    <strong>Quel outil choisir ?</strong>
    <ul>
      <li><strong>Théorème du moment cinétique</strong> : quand un point ou un axe fixe est imposé (fil, pivot, centre de force) et que des forces inconnues y passent.</li>
      <li><strong>Principe fondamental</strong> : pour obtenir une force inconnue (tension, réaction), ou pour un mouvement sans centre privilégié.</li>
      <li><strong>Énergie</strong> (chapitre « Énergie mécanique ») : pour une vitesse en fonction de la position, quand les forces qui travaillent sont connues.</li>
      <li>Les grandeurs conservées se combinent : moment cinétique et énergie ensemble donnent les vitesses extrêmes d'une planète (chapitre « Mouvement dans un champ central »).</li>
    </ul>
  </div>
  <table>
    <tr><th>Système</th><th>Moment cinétique (\(\text{kg·m}^2\text{·s}^{-1}\))</th></tr>
    <tr><td>électron de l'atome d'hydrogène</td><td>\(\approx\hbar=1{,}05\times10^{-34}\)</td></tr>
    <tr><td>toupie (\(J\approx10^{-5}\ \text{kg·m}^2\), 300 rad/s)</td><td>\(\approx3\times10^{-3}\)</td></tr>
    <tr><td>roue de vélo à 25 km/h</td><td>\(\approx2{,}7\)</td></tr>
    <tr><td>voiture dans un rond-point (§2)</td><td>\(1{,}8\times10^{5}\)</td></tr>
    <tr><td>Terre, rotation propre</td><td>\(5{,}8\times10^{33}\)</td></tr>
    <tr><td>Terre, mouvement autour du Soleil</td><td>\(2{,}7\times10^{40}\)</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — pourquoi une étoile effondrée tourne si vite</strong>
    <p>Une étoile de la taille du Soleil (rayon \(7\times10^5\ \text{km}\)) tourne sur elle-même en 25 jours. Son cœur s'effondre en une étoile à neutrons de 10 km de rayon. On suppose le moment cinétique conservé (pas de couple extérieur) et une forme inchangée, donc \(J\propto mR^2\).</p>
    <ol>
      <li>\(J\omega\) constant et masse inchangée : \(R^2\omega=\text{cste}\), donc la période varie comme \(R^2\).</li>
      <li>\(T'=T\left(\dfrac{R'}{R}\right)^2=25\times86\,400\times\left(\dfrac{10}{7\times10^5}\right)^2\approx4\times10^{-4}\ \text{s}\).</li>
      <li>Une fraction de milliseconde : les pulsars observés tournent effectivement en quelques millisecondes à quelques secondes (ils perdent de la masse et du moment cinétique en s'effondrant).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce qui dépasse la PTSI</h2>
  <div class="notice"><strong>Hors programme en PTSI (pour aller plus loin).</strong> Ces compléments ne sont pas exigibles. Ils éclairent la forme vectorielle du théorème et préparent la mécanique du solide de sciences industrielles (2ᵉ année).</div>
  <h3>Précession d'un gyroscope</h3>
  <p>Une toupie ou une roue de vélo tourne vite autour de son axe : son moment cinétique \(\vec L\), de norme \(J\omega\), est porté par cet axe. Si elle repose sur une pointe, le poids exerce un moment \(\vec\Gamma\) horizontal, perpendiculaire à \(\vec L\). D'après \(\mathrm d\vec L/\mathrm dt=\vec\Gamma\), \(\vec L\) tourne autour de la verticale sans changer de norme : l'axe décrit un cône au lieu de tomber. C'est la <strong>précession</strong>, de vitesse angulaire \(\Omega_p=\Gamma/L=\Gamma/(J\omega)\) (pour une rotation propre rapide). Gyrocompas, stabilisation des satellites et des vélos en mouvement reposent sur cet effet.</p>
  <h3>Théorème du moment cinétique en un point mobile</h3>
  <p>En un point \(A\) mobile, la dérivée de \(\vec L_A\) fait apparaître le terme supplémentaire \(-\vec v(A)\wedge m\vec v(G)\), pour un système de masse \(m\) et de centre de masse \(G\). Il est nul si \(A=G\) : le théorème s'applique aussi au centre de masse. Ces résultats, utiles pour les solides qui roulent, relèvent de la mécanique du solide de 2ᵉ année (sciences industrielles).</p>
  <h3>Moment cinétique d'un solide quelconque</h3>
  <p>Pour un solide qui tourne autour d'un axe qui n'est pas un axe de symétrie, \(\vec L_O\) n'est pas colinéaire à l'axe de rotation (opérateur d'inertie, 2ᵉ année de sciences industrielles) : c'est l'origine du « balourd » des roues mal équilibrées. Le programme de physique se limite à \(L_\Delta=J_\Delta\omega\), avec \(J_\Delta\) fourni.</p>
</div>

  <div class="sec-num">MÉTHODES · MOMENT CINÉTIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 2.5 du programme : calculer un moment cinétique (vecteur ou scalaire, avec son signe), sommer ceux d'un système de points, calculer le moment d'une force avec le bras de levier, appliquer le théorème du moment cinétique et repérer les situations de conservation. Pour le solide en rotation (moment d'inertie, couple, pendule pesant), voir le chapitre « Mouvement d'un solide » ; pour les forces centrales, « Mouvement dans un champ central ».</div>

  <div class="method-box"><strong>Méthode 1 — Calculer le moment cinétique d'un point par rapport à un point</strong>
    <ol>
      <li><span class="step">Point de référence.</span> Préciser le point \(O\) (fixe dans le référentiel d'étude) : le résultat en dépend.</li>
      <li><span class="step">Cas simple.</span> Si \(\vec v\) est perpendiculaire à \(\overrightarrow{OM}\) (mouvement circulaire de centre \(O\)) : \(\|\vec L_O\|=m\,r\,v\). Sinon, \(\|\vec L_O\|=m\,v\,d\), avec \(d\) la distance de \(O\) à la droite qui porte \(\vec v\).</li>
      <li><span class="step">Direction et sens.</span> Perpendiculaire au plan \((O,M,\vec v)\), sens donné par la main droite (les doigts suivent le mouvement autour de \(O\)).</li>
      <li><span class="step">Par les composantes.</span> En cas de doute, calculer \(\overrightarrow{OM}\wedge m\vec v\) en coordonnées cartésiennes ; vérifier l'unité \(\text{kg·m}^2\text{·s}^{-1}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(m=0{,}50\ \text{kg}\), \(\overrightarrow{OM}=2{,}0\,\vec e_x+1{,}0\,\vec e_y\) (m), \(\vec v=3{,}0\,\vec e_y\) (m/s). Alors \(\vec L_O=m(xv_y-yv_x)\,\vec e_z=3{,}0\,\vec e_z\ \text{kg·m}^2\text{·s}^{-1}\). Contrôle par le bras de levier : la droite qui porte \(\vec v\) est \(x=2{,}0\ \text{m}\), à \(d=2{,}0\ \text{m}\) de \(O\), et \(mvd=3{,}0\) ; le point tourne dans le sens direct autour de \(Oz\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Calculer un moment cinétique scalaire par rapport à un axe orienté</strong>
    <ol>
      <li><span class="step">Orienter l'axe.</span> Choisir \(\vec u_\Delta\) et l'écrire sur le schéma : sans orientation, le signe n'a pas de sens.</li>
      <li><span class="step">Coordonnées adaptées.</span> En cylindriques d'axe \(\Delta\) : \(L_\Delta=m\,r^2\dot\theta=m\,r\,v_\theta\), où \(r\) est la distance à l'axe.</li>
      <li><span class="step">Signe.</span> \(L_\Delta\gt0\) si le point tourne dans le sens direct autour de \(\vec u_\Delta\), \(L_\Delta\lt0\) sinon ; pour une trajectoire rectiligne, \(L_\Delta=\pm m\,v\,d\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un enfant de 25 kg, à 2,0 m de l'axe d'un manège qui fait un tour en 8,0 s dans le sens des aiguilles d'une montre vu d'au-dessus ; axe orienté vers le haut. \(\dot\theta=-2\pi/8{,}0\approx-0{,}785\ \text{rad·s}^{-1}\), \(L_\Delta=25\times2{,}0^2\times(-0{,}785)\approx-79\ \text{kg·m}^2\text{·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Sommer les moments cinétiques d'un système de points</strong>
    <ol>
      <li><span class="step">Un seul axe.</span> Projeter tous les moments cinétiques sur le même axe orienté.</li>
      <li><span class="step">Point par point.</span> Calculer chaque \(L_{\Delta,i}=m_ir_i^2\dot\theta_i\) avec son signe.</li>
      <li><span class="step">Somme algébrique.</span> \(L_\Delta=\sum L_{\Delta,i}\) ; si tous les points tournent à la même vitesse angulaire \(\omega\), mettre \(\omega\) en facteur : \(L_\Delta=\left(\sum m_ir_i^2\right)\omega\).</li>
    </ol>
    <p><em>Exemple éclair :</em> sur le manège précédent (sens direct cette fois, \(\omega=0{,}785\ \text{rad·s}^{-1}\)), deux enfants : 25 kg à 2,0 m et 30 kg à 1,0 m. \(\sum m_ir_i^2=100+30=130\ \text{kg·m}^2\), \(L_\Delta\approx102\ \text{kg·m}^2\text{·s}^{-1}\). L'enfant le plus lourd contribue le moins : seule compte la masse pondérée par le carré de la distance à l'axe.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : additionner les normes. Deux points qui tournent en sens contraires peuvent donner un moment cinétique total nul.</div>

  <div class="method-box"><strong>Méthode 4 — Calculer le moment d'une force par rapport à un point</strong>
    <ol>
      <li><span class="step">Droite d'action.</span> Repérer le point d'application et la direction de la force : si la droite d'action passe par \(O\), le moment est nul, sans calcul.</li>
      <li><span class="step">Norme.</span> \(\|\vec{\mathcal M}_O\|=F\,d\), avec \(d\) la distance de \(O\) à la droite d'action.</li>
      <li><span class="step">Direction et sens.</span> Perpendiculaire au plan qui contient \(O\) et la droite d'action ; sens donné par la main droite (sens dans lequel la force ferait tourner autour de \(O\)).</li>
      <li><span class="step">Contrôle.</span> En composantes, \(\overrightarrow{OM}\wedge\vec F\) ; unité \(\text{N·m}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec F=-10\,\vec e_y\) (N) appliquée en \(M\) tel que \(\overrightarrow{OM}=0{,}30\,\vec e_x+0{,}40\,\vec e_y\) (m). \(\vec{\mathcal M}_O=0{,}30\times(-10)\,\vec e_x\wedge\vec e_y=-3{,}0\,\vec e_z\ \text{N·m}\). Bras de levier : la droite d'action est la verticale \(x=0{,}30\ \text{m}\), et \(Fd=10\times0{,}30=3{,}0\) ; la composante \(0{,}40\,\vec e_y\) de \(\overrightarrow{OM}\), parallèle à la force, ne compte pas.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Utiliser le bras de levier pour un moment par rapport à un axe</strong>
    <ol>
      <li><span class="step">Orienter l'axe</span> et dessiner la vue dans un plan perpendiculaire à l'axe (l'axe y est un point).</li>
      <li><span class="step">Forces sans moment.</span> Éliminer les forces parallèles à l'axe et celles dont la droite d'action rencontre l'axe (pivot, tension d'un fil attaché sur l'axe).</li>
      <li><span class="step">Bras de levier.</span> Pour chaque autre force, tracer la droite d'action et mesurer sa distance \(d\) à l'axe (perpendiculaire commune), souvent \(d=r\sin\alpha\).</li>
      <li><span class="step">Signe.</span> \(+Fd\) si la force, seule, ferait tourner dans le sens positif ; \(-Fd\) sinon.</li>
    </ol>
    <p><em>Exemple éclair :</em> un cycliste appuie verticalement de 300 N sur une pédale ; la manivelle de 17 cm est inclinée de 30° au-dessus de l'horizontale, vers l'avant. La droite d'action verticale passe à \(d=0{,}17\cos30^\circ\approx0{,}147\ \text{m}\) de l'axe du pédalier : moment de \(44\ \text{N·m}\), dans le sens de l'avancée. Manivelle verticale (point mort haut) : \(d=0\), aucun moment, quelle que soit la force.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : multiplier la force par la distance au point d'application (ici 17 cm) au lieu de la distance à la droite d'action. Les deux ne coïncident que si la force est perpendiculaire au rayon.</div>

  <div class="method-box"><strong>Méthode 6 — Mettre en équation un point avec le théorème du moment cinétique</strong>
    <ol>
      <li><span class="step">Référentiel et point fixe.</span> Référentiel galiléen ; choisir le point fixe \(O\) (ou l'axe fixe) par lequel passent les forces inconnues : centre de la trajectoire, point d'attache du fil, centre d'un guide circulaire.</li>
      <li><span class="step">Moment cinétique.</span> L'écrire en fonction du paramètre de position : \(L_z=mr^2\dot\theta\), avec \(r\) constant pour un mouvement circulaire.</li>
      <li><span class="step">Moments.</span> Moment de chaque force connue (bras de levier, signe) ; les forces qui passent par l'axe disparaissent.</li>
      <li><span class="step">Équation.</span> \(\mathrm dL_z/\mathrm dt=\sum\mathcal M_z\), puis contrôle : homogénéité, cas limite, comparaison avec le principe fondamental projeté sur \(\vec e_\theta\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une bille glisse sans frottement dans une gouttière circulaire verticale de rayon \(R=0{,}40\ \text{m}\) et de centre \(O\). La réaction de la gouttière, normale, passe par \(O\) : \(mR^2\ddot\theta=-mgR\sin\theta\), soit \(\ddot\theta+(g/R)\sin\theta=0\) ; petites oscillations de période \(2\pi\sqrt{R/g}\approx1{,}27\ \text{s}\), comme un pendule de 40 cm.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer le théorème en un point mobile, ou dans un référentiel non galiléen. En PTSI : point (ou axe) fixe d'un référentiel galiléen, toujours.</div>

  <div class="method-box"><strong>Méthode 7 — Choisir entre principe fondamental, moment cinétique et énergie</strong>
    <ol>
      <li><span class="step">Ce qu'on cherche.</span> Une force inconnue (tension, réaction) : principe fondamental, projeté sur la bonne direction. Une vitesse en fonction de la position : énergie. Une équation du mouvement en rotation, sans les forces qui passent par un point ou un axe fixe : moment cinétique.</li>
      <li><span class="step">Grandeurs conservées.</span> Repérer d'abord ce qui se conserve (moment cinétique, énergie mécanique) : chaque conservation donne une relation sans dérivée.</li>
      <li><span class="step">Combiner.</span> Deux grandeurs conservées fixent souvent deux inconnues (rayon et vitesse, par exemple).</li>
    </ol>
    <p><em>Exemple éclair :</em> palet retenu par un fil passant par un trou (cours, §7). Vitesse finale : moment cinétique conservé, \(v_2=v_1r_1/r_2\). Tension finale : principe fondamental radial sur le cercle, \(T_2=mv_2^2/r_2\). Travail de l'opérateur : théorème de l'énergie cinétique, \(W=\Delta E_c\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Identifier une conservation du moment cinétique</strong>
    <ol>
      <li><span class="step">Cadre.</span> Référentiel galiléen ; point \(O\) ou axe \(\Delta\) fixe.</li>
      <li><span class="step">Force par force.</span> Pour chaque force extérieure : sa droite d'action passe-t-elle par \(O\) ? Est-elle parallèle à \(\Delta\), ou rencontre-t-elle \(\Delta\) ? Les forces intérieures d'un système ne comptent pas.</li>
      <li><span class="step">Conclure précisément.</span> Toutes les forces passent par \(O\) : \(\vec L_O\) est conservé (vecteur). Toutes ont un moment nul par rapport à \(\Delta\) seulement : seul \(L_\Delta\) est conservé.</li>
      <li><span class="step">Ne pas confondre.</span> Le moment cinétique peut être conservé sans que l'énergie le soit, et inversement : justifier chacune séparément.</li>
    </ol>
    <p><em>Exemple éclair :</em> une bille glisse sans frottement à l'intérieur d'un bol hémisphérique de centre \(O\). Le poids est vertical, parallèle à l'axe vertical \(Oz\) ; la réaction, normale à la sphère, passe par \(O\), qui est sur l'axe. Donc \(L_z=mr^2\dot\theta\) est conservé (mais pas \(\vec L_O\) : le poids a un moment par rapport à \(O\)). Lancée tangentiellement, la bille ne peut pas atteindre le fond (\(r=0\)) : \(\dot\theta\) y deviendrait infini.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Exploiter une conservation entre deux états</strong>
    <ol>
      <li><span class="step">Deux états.</span> Décrire l'état initial et l'état final (rayon, vitesse orthoradiale, vitesse angulaire).</li>
      <li><span class="step">Égalité.</span> Écrire \(L_\Delta(\text{initial})=L_\Delta(\text{final})\), par exemple \(mr_1v_{\theta,1}=mr_2v_{\theta,2}\) ou \(J_1\omega_1=J_2\omega_2\).</li>
      <li><span class="step">Bilan d'énergie.</span> Comparer les énergies cinétiques ; un écart est le travail d'une force (opérateur, forces intérieures, frottements) qu'il faut identifier.</li>
    </ol>
    <p><em>Exemple éclair :</em> un palet de 0,10 kg tourne à 2,0 m/s sur un cercle de 0,30 m, retenu par un fil qui passe par un trou ; on laisse filer le fil lentement jusqu'à 0,60 m. \(v_2=2{,}0\times0{,}30/0{,}60=1{,}0\ \text{m·s}^{-1}\) ; \(E_c\) passe de 0,20 J à 0,050 J : le fil a reçu 0,15 J du palet (travail de la tension négatif).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer \(r_1v_1=r_2v_2\) avec les normes des vitesses quand la vitesse n'est pas orthoradiale. La conservation porte sur \(r\,v_\theta\), c'est-à-dire sur \(m\,v\,d\) avec le bras de levier \(d\).</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Moment cinétique d'un point en mouvement circulaire</h3>
  <div class="statement">Un point \(M\) de masse \(m=2{,}0\ \text{kg}\) décrit, dans un plan horizontal, un cercle de centre \(O\) et de rayon \(R=0{,}50\ \text{m}\) à la vitesse angulaire constante \(\omega=4{,}0\ \text{rad·s}^{-1}\), dans le sens direct autour de l'axe vertical ascendant \(Oz\).</div>
  <div class="q"><strong>Q1.</strong> Donner la direction, le sens et la norme de \(\vec L_O\).</div>
  <div class="q"><strong>Q2.</strong> Le mouvement est uniforme. Quelle est la force résultante qui s'exerce sur \(M\) ?</div>
  <div class="q"><strong>Q3.</strong> Vérifier le théorème du moment cinétique en \(O\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v=R\omega=2{,}0\ \text{m·s}^{-1}\), perpendiculaire à \(\overrightarrow{OM}\). \(\vec L_O\) est perpendiculaire au plan du mouvement, donc porté par \(Oz\), vers le haut (rotation dans le sens direct, règle de la main droite). Norme : \(mRv=mR^2\omega=2{,}0\ \text{kg·m}^2\text{·s}^{-1}\). On a donc \(\vec L_O=mR^2\omega\,\vec e_z\), constant.</p>
    <p><strong>Q2.</strong> En mouvement circulaire uniforme, l'accélération est centripète, \(\vec a=-R\omega^2\,\vec e_r\) (chapitre « Cinématique du point »). La force résultante vaut \(m\vec a\) : dirigée vers \(O\), de norme \(mR\omega^2=16\ \text{N}\). Elle n'a pas de composante orthoradiale.</p>
    <p><strong>Q3.</strong> La résultante est portée par \(\overrightarrow{MO}\) : son moment en \(O\) est nul, \(\overrightarrow{OM}\wedge(-F\,\vec e_r)=R\,\vec e_r\wedge(-F\,\vec e_r)=\vec 0\). Le théorème donne \(\mathrm d\vec L_O/\mathrm dt=\vec 0\) : c'est bien le cas, \(\vec L_O\) est constant.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Trois mobiles autour d'un même axe : le signe</h3>
  <div class="statement">L'axe \(\Delta\) est la verticale ascendante passant par le centre \(O\) d'un stade. Un coureur de 70 kg court à \(6{,}0\ \text{m·s}^{-1}\) sur la piste, un cercle de rayon 40 m centré en \(O\), dans le sens des aiguilles d'une montre vu d'au-dessus. Une voiture de 1 000 kg roule en ligne droite à \(20\ \text{m·s}^{-1}\) sur une route qui passe à 60 m de \(O\), dans un sens qui la fait tourner dans le sens direct autour de \(O\). Un pigeon vole horizontalement droit vers \(O\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le moment cinétique scalaire \(L_\Delta\) du coureur.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(L_\Delta\) pour la voiture. Varie-t-il quand la voiture avance ?</div>
  <div class="q"><strong>Q3.</strong> Que vaut \(L_\Delta\) pour le pigeon ? Qu'est-ce qui changerait si l'axe était orienté vers le bas ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Vitesse orthoradiale, à 40 m de l'axe ; rotation dans le sens indirect autour de l'axe ascendant : \(L_\Delta=-mrv\), soit \(-70\times40\times6{,}0\), c'est-à-dire \(-1{,}68\times10^4\ \text{kg·m}^2\text{·s}^{-1}\).</p>
    <p><strong>Q2.</strong> Trajectoire rectiligne : \(L_\Delta=+mvd\) avec \(d=60\ \text{m}\), distance de l'axe à la route, soit \(+1{,}2\times10^6\ \text{kg·m}^2\text{·s}^{-1}\). Il ne varie pas : \(v\) et \(d\) sont constants. (En cylindriques, \(r\) et \(\dot\theta\) varient, mais \(r^2\dot\theta\) reste constant : la voiture balaie des aires égales en des temps égaux.)</p>
    <p><strong>Q3.</strong> Le pigeon se rapproche de l'axe sans tourner autour : \(v_\theta=0\), donc \(L_\Delta=0\) (sa vitesse passe par l'axe, bras de levier nul). Axe orienté vers le bas : les deux premiers résultats changent de signe (\(+1{,}68\times10^4\) et \(-1{,}2\times10^6\)) ; le moment cinétique scalaire n'a de signe qu'avec une orientation.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Clé, porte et produit vectoriel : le bras de levier</h3>
  <div class="statement">On serre un écrou à \(25\ \text{N·m}\) avec une clé de 30 cm (distance de l'axe de l'écrou à la main). On pousse ensuite une porte : la poignée est à 0,80 m de l'axe des gonds, et la force horizontale de 15 N fait un angle de 60° avec le plan de la porte.</div>
  <div class="q"><strong>Q1.</strong> Quelle force faut-il exercer sur la clé, perpendiculairement au manche ? Et si la force fait 45° avec le manche ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le moment de la force sur la porte par rapport à l'axe des gonds, avec le bras de levier.</div>
  <div class="q"><strong>Q3.</strong> Retrouver ce résultat par le produit vectoriel, avec l'axe \(Oz\) des gonds orienté vers le haut, \(\vec e_x\) dans le plan de la porte vers la poignée et la force \(\vec F=F(\cos60^\circ\,\vec e_x+\sin60^\circ\,\vec e_y)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Force perpendiculaire : \(d=0{,}30\ \text{m}\), \(F=25/0{,}30\approx83\ \text{N}\). À 45°, la droite d'action passe à \(d=0{,}30\sin45^\circ\approx0{,}21\ \text{m}\) de l'axe : il faut \(F=25/0{,}21\approx118\ \text{N}\), 41 % de plus.</p>
    <p><strong>Q2.</strong> Bras de levier : \(d=0{,}80\sin60^\circ\approx0{,}69\ \text{m}\). Moment : \(15\times0{,}69\approx10{,}4\ \text{N·m}\), positif si la porte s'ouvre dans le sens direct autour de l'axe orienté.</p>
    <p><strong>Q3.</strong> Avec \(\overrightarrow{OP}=0{,}80\,\vec e_x\) :</p>
    <div class="formula">$$\begin{aligned}\vec{\mathcal M}_O&=0{,}80\,\vec e_x\wedge F(\cos60^\circ\,\vec e_x+\sin60^\circ\,\vec e_y)\\&=0{,}80\,F\sin60^\circ\,\vec e_z\approx10{,}4\,\vec e_z\ \text{N·m}\end{aligned}$$</div>
    <p>La composante \(F\cos60^\circ\), dans le plan de la porte, rencontre l'axe et ne compte pas ; seule \(F_\theta=F\sin60^\circ\) fait tourner.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Deux patineurs et une perche</h3>
  <div class="statement">Deux patineurs, de masses \(m_1=60\ \text{kg}\) et \(m_2=40\ \text{kg}\), tiennent les extrémités d'une perche légère de 3,0 m et tournent sur la glace (frottements négligés) autour d'un axe vertical fixe, à \(\omega_1=1{,}0\ \text{rad·s}^{-1}\). On assimile chaque patineur à un point. Leur centre de masse \(G\) est immobile.</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(G\) reste immobile et que l'axe de rotation passe par \(G\). Calculer les distances \(r_1\) et \(r_2\) des patineurs à l'axe.</div>
  <div class="q"><strong>Q2.</strong> Calculer le moment cinétique \(L_\Delta\) du système par rapport à l'axe.</div>
  <div class="q"><strong>Q3.</strong> En tirant sur la perche (main sur main), ils réduisent leur distance à 2,0 m. Justifier la conservation de \(L_\Delta\) et calculer la nouvelle vitesse angulaire.</div>
  <div class="q"><strong>Q4.</strong> Comparer les énergies cinétiques. Qui a fourni l'énergie ? Quelle force chacun doit-il exercer à la fin ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Forces extérieures : poids et réactions de la glace, verticales et opposées (pas de frottement). Le système est pseudo-isolé : \(\vec p=(m_1+m_2)\vec v(G)\) est constant (chapitre « Principes de la dynamique », §1), nul si \(G\) part du repos. Chaque patineur tourne autour du point fixe \(G\). Avec \(m_1r_1=m_2r_2\) et \(r_1+r_2=3{,}0\ \text{m}\) : \(r_1=1{,}2\ \text{m}\), \(r_2=1{,}8\ \text{m}\).</p>
    <p><strong>Q2.</strong> Les deux tournent dans le même sens à la même vitesse angulaire : \(L_\Delta=(m_1r_1^2+m_2r_2^2)\,\omega_1\), soit \((86{,}4+129{,}6)\times1{,}0=216\ \text{kg·m}^2\text{·s}^{-1}\).</p>
    <p><strong>Q3.</strong> Les forces extérieures sont verticales, parallèles à l'axe : moment nul. Les forces intérieures (de la perche et des bras) ne changent pas le moment cinétique du système. \(L_\Delta\) est conservé. Nouvelles distances : 0,80 m et 1,20 m ; \(\sum m_ir_i^2=96\ \text{kg·m}^2\), d'où \(\omega_2=216/96=2{,}25\ \text{rad·s}^{-1}\).</p>
    <p><strong>Q4.</strong> \(E_c=\tfrac12\left(\sum m_ir_i^2\right)\omega^2\) passe de 108 J à 243 J. Les 135 J viennent du travail musculaire des patineurs (forces intérieures, qui travaillent puisque le système se déforme : chapitre « Mouvement d'un solide », §10). À la fin, chacun doit fournir la force centripète de l'autre : \(m_2r_2\omega_2^2=40\times1{,}2\times2{,}25^2\approx243\ \text{N}\) (contre 72 N au départ), la même pour les deux (troisième loi).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Pendule simple : équation par le moment cinétique, tension par le principe fondamental</h3>
  <div class="statement">Un pendule simple est formé d'une masse \(m=0{,}20\ \text{kg}\), assimilée à un point, au bout d'un fil idéal de longueur \(\ell=1{,}0\ \text{m}\) attaché en \(O\). Il oscille dans un plan vertical ; \(\theta\) est l'angle du fil avec la verticale descendante, compté dans le sens direct autour de l'axe \(Oz\) perpendiculaire au plan. Référentiel terrestre, galiléen.</div>
  <div class="q"><strong>Q1.</strong> Exprimer le moment cinétique \(L_z\) et les moments par rapport à \(Oz\) du poids et de la tension.</div>
  <div class="q"><strong>Q2.</strong> En déduire l'équation du mouvement, puis la période des petites oscillations.</div>
  <div class="q"><strong>Q3.</strong> Lâché sans vitesse de \(\theta_0=60^\circ\), le pendule passe à la verticale. Calculer sa vitesse et la tension du fil à cet instant.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Mouvement circulaire de rayon \(\ell\) : \(L_z=m\ell^2\dot\theta\). La tension est portée par \(\overrightarrow{MO}\) : moment nul. Le poids est vertical, à la distance \(\ell\sin\theta\) de \(O\) ; il ramène vers la verticale : \(\mathcal M_z=-mg\ell\sin\theta\).</p>
    <p><strong>Q2.</strong> \(m\ell^2\ddot\theta=-mg\ell\sin\theta\), soit \(\ddot\theta+\dfrac g\ell\sin\theta=0\). Petites oscillations : \(\sin\theta\approx\theta\), oscillateur harmonique de pulsation \(\omega_0=\sqrt{g/\ell}\), période \(T_0=2\pi\sqrt{\ell/g}\approx2{,}01\ \text{s}\).</p>
    <p><strong>Q3.</strong> La tension ne travaille pas (perpendiculaire à la vitesse) : l'énergie mécanique se conserve, \(v^2=2g\ell(1-\cos\theta_0)=g\ell\), soit \(v\approx3{,}1\ \text{m·s}^{-1}\). La tension a disparu du théorème du moment cinétique ; pour l'obtenir, on projette le principe fondamental sur \(\vec e_r\) (accélération centripète \(v^2/\ell\)) : \(T-mg=mv^2/\ell\), d'où \(T=mg+mg=2mg\approx3{,}9\ \text{N}\), le double du poids.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Pendule conique : un vecteur moment cinétique qui tourne</h3>
  <div class="statement">Une masse \(m=0{,}20\ \text{kg}\), au bout d'un fil de longueur \(\ell=0{,}50\ \text{m}\) attaché en \(O\), décrit un cercle horizontal ; le fil fait l'angle constant \(\alpha\) avec la verticale. On utilise les coordonnées cylindriques d'axe \(Oz\) vertical ascendant : \(\overrightarrow{OM}=\ell(\sin\alpha\,\vec e_r-\cos\alpha\,\vec e_z)\), et la masse tourne à la vitesse angulaire constante \(\omega\) dans le sens direct.</div>
  <div class="q"><strong>Q1.</strong> Par le principe fondamental, établir \(\omega^2=\dfrac{g}{\ell\cos\alpha}\). Calculer \(\omega\) et la période pour \(\alpha=30^\circ\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\vec L_O\) dans la base \((\vec e_r,\vec e_\theta,\vec e_z)\). \(L_z\) est-il constant ? Et \(\vec L_O\) ?</div>
  <div class="q"><strong>Q3.</strong> Retrouver la relation de Q1 par le théorème du moment cinétique vectoriel en \(O\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(L_z/\|\vec L_O\|\) pour \(\alpha=10^\circ\), \(30^\circ\), \(60^\circ\). Commenter la direction de \(\vec L_O\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Forces : poids \(-mg\,\vec e_z\) et tension \(\vec T\) dirigée de \(M\) vers \(O\). Accélération du mouvement circulaire uniforme de rayon \(r=\ell\sin\alpha\) : \(-r\omega^2\,\vec e_r\). Selon \(\vec e_z\) : \(T\cos\alpha=mg\) ; selon \(\vec e_r\) : \(-T\sin\alpha=-m\ell\sin\alpha\,\omega^2\), donc \(T=m\ell\omega^2\). En divisant : \(\cos\alpha=g/(\ell\omega^2)\). Pour \(\alpha=30^\circ\) : \(\omega\approx4{,}76\ \text{rad·s}^{-1}\), période \(2\pi/\omega\approx1{,}32\ \text{s}\).</p>
    <p><strong>Q2.</strong> \(\vec v=\ell\sin\alpha\,\omega\,\vec e_\theta\). Avec \(\vec e_r\wedge\vec e_\theta=\vec e_z\) et \(\vec e_z\wedge\vec e_\theta=-\vec e_r\) :</p>
    <div class="formula">$$\vec L_O=m\ell^2\omega\sin\alpha\,(\sin\alpha\,\vec e_z+\cos\alpha\,\vec e_r)$$</div>
    <p>\(L_z=m\ell^2\omega\sin^2\alpha=mr^2\omega\), soit \(0{,}060\ \text{kg·m}^2\text{·s}^{-1}\), est constant : le poids est parallèle à \(Oz\), la tension passe par \(O\). Mais la composante horizontale, \(m\ell^2\omega\sin\alpha\cos\alpha\,\vec e_r\approx0{,}103\,\vec e_r\), tourne avec \(\vec e_r\) : \(\vec L_O\) n'est pas constant.</p>
    <p><strong>Q3.</strong> Seule \(\vec e_r\) varie, avec \(\mathrm d\vec e_r/\mathrm dt=\omega\,\vec e_\theta\) :</p>
    <div class="formula">$$\frac{\mathrm d\vec L_O}{\mathrm dt}=m\ell^2\omega^2\sin\alpha\cos\alpha\,\vec e_\theta$$</div>
    <p>Moment du poids, avec \(\vec e_r\wedge\vec e_z=-\vec e_\theta\) :</p>
    <div class="formula">$$\ell(\sin\alpha\,\vec e_r-\cos\alpha\,\vec e_z)\wedge(-mg\,\vec e_z)=mg\ell\sin\alpha\,\vec e_\theta$$</div>
    <p>Moment de la tension : nul. En égalant : \(\ell\omega^2\cos\alpha=g\), la relation de Q1 (0,49 N·m des deux côtés pour 30°).</p>
    <p><strong>Q4.</strong> \(L_z/\|\vec L_O\|=\sin\alpha\) : 0,17, 0,50 et 0,87. Pour un petit angle, \(\vec L_O\) est presque horizontal, perpendiculaire au fil (il est orthogonal à \(\overrightarrow{OM}\)) : le moment cinétique par rapport au point d'attache n'est pas porté par l'axe de rotation. Il ne s'en rapproche qu'aux grands angles, quand la masse tourne presque dans le plan horizontal de \(O\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Le proton tourne dans un champ magnétique</h3>
  <div class="statement">Un proton (\(m=1{,}67\times10^{-27}\ \text{kg}\), \(q=e=1{,}60\times10^{-19}\ \text{C}\)) entre avec la vitesse \(v=2{,}0\times10^6\ \text{m·s}^{-1}\), perpendiculaire au champ, dans un champ magnétique uniforme \(\vec B=B\,\vec e_z\), \(B=0{,}50\ \text{T}\). On admet (chapitre « Particules chargées ») que sa trajectoire est un cercle de rayon \(R=mv/(eB)\), parcouru à vitesse constante. Le poids est négligeable.</div>
  <div class="q"><strong>Q1.</strong> Montrer que le moment cinétique \(\vec L_C\) par rapport au centre \(C\) du cercle est constant. Calculer \(R\) et \(\|\vec L_C\|\).</div>
  <div class="q"><strong>Q2.</strong> Le proton passe en un point où sa vitesse vaut \(v\,\vec e_x\). Déterminer le sens de la force de Lorentz \(e\,\vec v\wedge\vec B\), puis le sens de rotation et le signe de \(L_z\). \(\vec L_C\) est-il dans le sens de \(\vec B\) ?</div>
  <div class="q"><strong>Q3.</strong> Exprimer \(L_z\) en fonction de l'énergie cinétique. Que devient-il si l'énergie cinétique double ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La force de Lorentz est perpendiculaire à la vitesse ; sur un cercle parcouru à vitesse constante, elle est centripète, donc portée par \(\overrightarrow{MC}\) : son moment en \(C\) (fixe) est nul, et \(\vec L_C\) est constant. \(R=mv/(eB)\approx4{,}2\ \text{cm}\) ; \(\|\vec L_C\|=mRv\approx1{,}4\times10^{-22}\ \text{kg·m}^2\text{·s}^{-1}\).</p>
    <p><strong>Q2.</strong> \(\vec F=evB\,\vec e_x\wedge\vec e_z=-evB\,\vec e_y\) : le centre est du côté \(-\vec e_y\). Allant selon \(+\vec e_x\) avec le centre « à droite » (vu de \(+z\)), le proton tourne dans le sens des aiguilles d'une montre : sens indirect autour de \(\vec e_z\), donc \(L_z=-mRv\lt0\). \(\vec L_C\) est opposé à \(\vec B\) pour une charge positive (pour un électron, il serait dans le sens de \(\vec B\)).</p>
    <p><strong>Q3.</strong> \(|L_z|=mRv=\dfrac{m^2v^2}{eB}=\dfrac{2m\,E_c}{eB}\). Il est proportionnel à l'énergie cinétique : il double avec elle (le rayon est multiplié par \(\sqrt2\), la vitesse aussi).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Le lancer du marteau</h3>
  <div class="statement">Au lancer du marteau, la boule (7,26 kg) est reliée aux mains par un câble ; l'athlète tourne sur lui-même et la boule décrit à peu près un cercle horizontal de rayon \(r=2{,}0\ \text{m}\) autour d'un axe vertical fixe. Au lâcher, sa vitesse est de \(29\ \text{m·s}^{-1}\). On assimile la boule à un point et on néglige le poids devant la tension pour les questions Q1 à Q3.</div>
  <div class="q"><strong>Q1.</strong> Calculer le moment cinétique \(L_\Delta\) de la boule par rapport à l'axe juste avant le lâcher, et sa vitesse angulaire.</div>
  <div class="q"><strong>Q2.</strong> Pendant le dernier tour, à vitesse constante, quelle est la tension du câble ? La comparer au poids de la boule. Quel est son moment par rapport à l'axe ?</div>
  <div class="q"><strong>Q3.</strong> Pendant la phase d'accélération, \(L_\Delta\) passe de 0 à sa valeur finale en 1,5 s environ. Quel moment moyen faut-il exercer ? Avec une tension moyenne de 2 000 N, à quelle distance de l'axe passe la droite d'action du câble ? Conclure sur la direction du câble.</div>
  <div class="q"><strong>Q4.</strong> Après le lâcher, que devient le moment cinétique de la boule par rapport à l'axe (on tient compte maintenant du poids) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Vitesse orthoradiale : \(L_\Delta=mrv\), soit \(7{,}26\times2{,}0\times29\approx421\ \text{kg·m}^2\text{·s}^{-1}\) ; \(\omega=v/r=14{,}5\ \text{rad·s}^{-1}\), plus de deux tours par seconde.</p>
    <p><strong>Q2.</strong> Mouvement circulaire uniforme : la tension est centripète, \(T=mv^2/r\approx3{,}1\times10^3\ \text{N}\), environ 43 fois le poids de la boule : l'athlète doit retenir l'équivalent de 300 kg. Elle passe par l'axe : moment nul, \(L_\Delta\) constant pendant ce tour.</p>
    <p><strong>Q3.</strong> Théorème du moment cinétique : moment moyen \(421/1{,}5\approx280\ \text{N·m}\). Avec \(T=2\,000\ \text{N}\), le bras de levier vaut \(280/2\,000\approx0{,}14\ \text{m}\) : pendant l'accélération, le câble ne passe pas par l'axe, l'athlète « tire en avant » ; il est en retard sur la boule. Une force exactement radiale ne pourrait pas augmenter le moment cinétique.</p>
    <p><strong>Q4.</strong> Après le lâcher, seul le poids agit : vertical, donc parallèle à l'axe, de moment nul. \(L_\Delta\) reste égal à 421 : la projection horizontale du mouvement est une droite parcourue à vitesse constante, tangente au cercle, et \(L_\Delta=mv_{\text{hor}}d\) avec \(d=r\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Un fil qui s'enroule sur un poteau</h3>
  <div class="statement">Une rondelle de masse \(m=0{,}20\ \text{kg}\) glisse sans frottement sur une glace horizontale. Elle est attachée à un fil inextensible enroulé sur un poteau vertical fixe de rayon \(R=5{,}0\ \text{cm}\) et d'axe \(\Delta\). À \(t=0\), la longueur libre du fil (entre le point \(A\) où il quitte le poteau et la rondelle) vaut \(\ell_0=1{,}0\ \text{m}\), et la rondelle a une vitesse \(v_0=2{,}0\ \text{m·s}^{-1}\) perpendiculaire au fil, dans le sens qui enroule le fil (figure du cours, §7).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la vitesse de la rondelle reste égale à \(v_0\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que le moment cinétique par rapport à l'axe du poteau vaut \(L_\Delta=mv_0\ell\), où \(\ell\) est la longueur libre. Est-il conservé ?</div>
  <div class="q"><strong>Q3.</strong> La rondelle tourne à chaque instant autour de \(A\) sur un cercle de rayon \(\ell\) : \(T=mv_0^2/\ell\). Écrire le théorème du moment cinétique par rapport à \(\Delta\) et en déduire \(\ell(t)\), puis la durée d'enroulement complet.</div>
  <div class="q"><strong>Q4.</strong> Le fil casse sous 6 N. À quelle longueur libre et à quel instant ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Forces : poids et réaction de la glace, verticales et opposées ; tension, portée par le fil, perpendiculaire à la vitesse. Aucune ne travaille : l'énergie cinétique, donc la vitesse, est constante.</p>
    <p><strong>Q2.</strong> \(\overrightarrow{OM}=\overrightarrow{OA}+\overrightarrow{AM}\), avec \(\overrightarrow{OA}\) (rayon) perpendiculaire au fil et \(\vec v\) perpendiculaire au fil, donc parallèle à \(\overrightarrow{OA}\). Le bras de levier de \(m\vec v\) par rapport à l'axe est la projection de \(\overrightarrow{OM}\) sur le fil : \(\ell\). D'où \(L_\Delta=mv_0\ell\), qui diminue quand le fil s'enroule : <strong>pas</strong> de conservation. La tension ne passe pas par l'axe (sa droite d'action, tangente au poteau, en est à la distance \(R\)).</p>
    <p><strong>Q3.</strong> Moment de la tension : \(-RT\) (elle freine la rotation). Théorème : \(mv_0\dfrac{\mathrm d\ell}{\mathrm dt}=-R\dfrac{mv_0^2}{\ell}\), soit \(\ell\,\mathrm d\ell=-Rv_0\,\mathrm dt\) et</p>
    <div class="formula">$$\ell(t)=\sqrt{\ell_0^2-2Rv_0t}$$</div>
    <p>Le fil est entièrement enroulé (\(\ell=0\)) à \(t=\ell_0^2/(2Rv_0)=5{,}0\ \text{s}\). (Une intégration numérique de la trajectoire donne le même résultat.)</p>
    <p><strong>Q4.</strong> \(T=mv_0^2/\ell=6\ \text{N}\) pour \(\ell=0{,}80/6\approx0{,}13\ \text{m}\), atteint à \(t=(\ell_0^2-\ell^2)/(2Rv_0)\approx4{,}9\ \text{s}\). La tension, 0,8 N au départ, croît comme \(1/\ell\) : le fil casse peu avant la fin.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Une bille dans un bol</h3>
  <div class="statement">Une bille, assimilée à un point de masse \(m\), glisse sans frottement à l'intérieur d'un bol hémisphérique de centre \(O\) et de rayon \(R=0{,}20\ \text{m}\). On la repère par l'angle \(\varphi\) entre \(\overrightarrow{OM}\) et la verticale descendante, et par l'angle \(\theta\) autour de l'axe vertical ascendant \(Oz\) : distance à l'axe \(r=R\sin\varphi\), altitude \(z=-R\cos\varphi\). Elle est lancée en \(\varphi_0=60^\circ\) avec une vitesse horizontale \(v_0\), orthoradiale.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(L_z=mr^2\dot\theta\) est conservé, mais pas \(\vec L_O\).</div>
  <div class="q"><strong>Q2.</strong> Pour quelle valeur de \(v_0\) la bille décrit-elle un cercle horizontal ? (Comparer au pendule conique.)</div>
  <div class="q"><strong>Q3.</strong> On lance la bille avec \(v_0=1{,}0\ \text{m·s}^{-1}\). Aux altitudes extrêmes, la vitesse est horizontale et orthoradiale. Écrire les deux lois de conservation entre le lancement et le point le plus bas, et montrer que \(\varphi_1\) vérifie une équation que l'on résoudra numériquement.</div>
  <div class="q"><strong>Q4.</strong> La bille peut-elle passer par le fond du bol ? Et si on la lâchait sans vitesse ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le poids est vertical, parallèle à \(Oz\) ; la réaction, normale à la sphère, passe par \(O\), qui est sur l'axe. Les deux ont un moment nul par rapport à \(Oz\) : \(L_z\) est conservé. Par rapport au point \(O\), le poids a un moment non nul (sauf au fond) : \(\vec L_O\) ne l'est pas.</p>
    <p><strong>Q2.</strong> La situation est celle du pendule conique (exercice 06) avec \(\ell=R\) et \(\alpha=\varphi_0\), la réaction jouant le rôle de la tension : \(\omega^2=g/(R\cos\varphi_0)\), \(v_0=\omega R\sin\varphi_0\approx1{,}72\ \text{m·s}^{-1}\).</p>
    <p><strong>Q3.</strong> Avec \(v_0\lt1{,}72\ \text{m·s}^{-1}\), la bille descend. Conservation de \(L_z\) : \(R\sin\varphi_1\,v_1=R\sin\varphi_0\,v_0\). Conservation de l'énergie (la réaction ne travaille pas) : \(\tfrac12v_1^2-gR\cos\varphi_1=\tfrac12v_0^2-gR\cos\varphi_0\). En éliminant \(v_1\) :</p>
    <div class="formula">$$\frac{v_0^2\sin^2\varphi_0}{2\sin^2\varphi_1}-gR\cos\varphi_1=\frac{v_0^2}{2}-gR\cos\varphi_0$$</div>
    <p>dont \(\varphi_0=60^\circ\) est solution ; une recherche numérique (dichotomie) donne l'autre, \(\varphi_1\approx35{,}4^\circ\), et \(v_1\approx1{,}50\ \text{m·s}^{-1}\). La bille oscille entre ces deux altitudes (6,3 cm d'écart) en tournant autour de l'axe.</p>
    <p><strong>Q4.</strong> Au fond, \(r=0\) : la conservation de \(r\,v_\theta\ne0\) imposerait une vitesse infinie. Une bille lancée avec une vitesse orthoradiale ne passe jamais par le fond. Lâchée sans vitesse, \(L_z=0\) : elle oscille dans un plan vertical en passant par le fond, comme un pendule simple.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le palet, le trou et la masse suspendue</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>moment cinétique, conservation, énergie, mouvement radial</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un palet de masse \(m=0{,}10\ \text{kg}\), assimilé à un point \(M\), glisse sans frottement sur une table horizontale. Il est attaché à un fil idéal (inextensible, sans masse) qui passe par un petit trou \(O\) de la table. On repère \(M\) par ses coordonnées polaires \((r,\theta)\) de centre \(O\) ; l'axe \(Oz\) est vertical ascendant. Référentiel terrestre, galiléen ; \(g=9{,}81\ \text{m·s}^{-2}\).
  </div>
  <p class="exo-part">Partie A — Conservation du moment cinétique</p>
  <div class="q"><strong>A1.</strong> Faire le bilan des forces sur le palet. Montrer que \(L_z=mr^2\dot\theta\) est conservé ; on pose \(C=r^2\dot\theta\).</div>
  <div class="q"><strong>A2.</strong> Le palet tourne d'abord sur un cercle de rayon \(r_1=0{,}40\ \text{m}\) à \(v_1=2{,}0\ \text{m·s}^{-1}\). Un opérateur tire lentement le fil jusqu'à \(r_2=0{,}20\ \text{m}\). Calculer \(C\) et la vitesse finale \(v_2\).</div>
  <p class="exo-part">Partie B — Bilan d'énergie</p>
  <div class="q"><strong>B1.</strong> Calculer la variation d'énergie cinétique du palet.</div>
  <div class="q"><strong>B2.</strong> Le fil étant tiré lentement, le mouvement reste presque circulaire. Montrer que la tension vaut \(T=mC^2/r^3\), puis calculer le travail de l'opérateur. Conclure.</div>
  <p class="exo-part">Partie C — Une masse suspendue au fil</p>
  <div class="q"><strong>C1.</strong> L'opérateur est remplacé par une masse \(M=0{,}30\ \text{kg}\), suspendue à l'autre extrémité du fil sous la table, qui ne peut se déplacer que verticalement. Le moment cinétique du palet est-il toujours conservé ?</div>
  <div class="q"><strong>C2.</strong> Pour le système {palet + masse + fil}, montrer que l'énergie mécanique s'écrit, à une constante près,
    <div class="formula">$$E=\frac12(m+M)\,\dot r^2+\frac{mC^2}{2r^2}+Mg\,r$$</div>
    et qu'elle est conservée. Quel est le rôle du terme \(mC^2/(2r^2)\) ?</div>
  <div class="q"><strong>C3.</strong> Avec \(C=0{,}80\ \text{m}^2\text{·s}^{-1}\), déterminer le rayon \(r_0\) de l'orbite circulaire. Est-elle stable ?</div>
  <div class="q"><strong>C4.</strong> Établir l'équation du mouvement radial en dérivant \(E\), puis la période des petites oscillations de \(r\) autour de \(r_0\). La comparer à la période de rotation sur l'orbite circulaire.</div>
  <p class="exo-part">Partie D — Grandes oscillations</p>
  <div class="q"><strong>D1.</strong> Le palet est lancé en \(r_1=0{,}40\ \text{m}\) avec \(v_1=2{,}0\ \text{m·s}^{-1}\) orthoradiale, la masse \(M\) étant lâchée sans vitesse. Montrer que \(r\) oscille entre 0,40 m et une valeur \(r_{\min}\) solution d'une équation du troisième degré ; la résoudre numériquement. Calculer la vitesse du palet en \(r_{\min}\).</div>
  <div class="q"><strong>D2.</strong> Une simulation (équation de C4 résolue par <span class="code-inline">odeint</span>) donne \(r_{\min}=0{,}2023\ \text{m}\) atteint à \(t=0{,}370\ \text{s}\). Commenter, en comparant à C4.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Poids et réaction de la table, verticaux et opposés (pas de frottement) ; tension du fil, dirigée de \(M\) vers \(O\). Les forces verticales sont parallèles à \(Oz\), la tension rencontre l'axe en \(O\) : moments nuls par rapport à \(Oz\), donc \(L_z\) est constant (c'est même \(\vec L_O\) qui l'est).</p>
    <p><strong>A2.</strong> Sur le cercle initial, la vitesse est orthoradiale : \(C=r_1v_1=0{,}80\ \text{m}^2\text{·s}^{-1}\). Sur le cercle final, \(v_2=C/r_2=4{,}0\ \text{m·s}^{-1}\) : la vitesse double quand le rayon est divisé par deux.</p>
    <p><strong>B1.</strong> \(\Delta E_c=\tfrac12m(v_2^2-v_1^2)\), soit \(\tfrac12\times0{,}10\times(16-4)=0{,}60\ \text{J}\).</p>
    <p><strong>B2.</strong> Principe fondamental radial : \(m(\ddot r-r\dot\theta^2)=-T\). Tiré lentement, \(\ddot r\approx0\), d'où \(T=mr\dot\theta^2=mC^2/r^3\). Le déplacement élémentaire du palet vers \(O\) est \(\mathrm dr\lt0\) ; le travail de la tension (dirigée vers \(O\)) vaut \(-T\,\mathrm dr\gt0\) :</p>
    <div class="formula">$$W=\int_{r_2}^{r_1}\frac{mC^2}{r^3}\,\mathrm dr=\frac{mC^2}{2}\left(\frac1{r_2^2}-\frac1{r_1^2}\right)=0{,}60\ \text{J}$$</div>
    <p>C'est exactement \(\Delta E_c\) : le moment cinétique est conservé, l'énergie cinétique ne l'est pas, et l'écart est le travail fourni par l'opérateur. Une force centrale peut travailler.</p>
    <p><strong>C1.</strong> Oui : la tension reste dirigée vers \(O\), seule sa norme change. \(C=r^2\dot\theta\) reste constant.</p>
    <p><strong>C2.</strong> Le fil étant inextensible, la masse descend quand le palet s'éloigne : sa cote vaut \(-(\text{longueur}-r)\), sa vitesse \(\dot r\) en valeur absolue. Énergie cinétique : \(\tfrac12m(\dot r^2+r^2\dot\theta^2)+\tfrac12M\dot r^2\), avec \(r^2\dot\theta^2=C^2/r^2\) ; énergie potentielle de \(M\) : \(Mgr\) à une constante près. Les forces qui travaillent sont les poids (conservatifs) ; les tensions d'un fil idéal ont une puissance totale nulle ; la réaction de la table ne travaille pas. \(E\) est donc conservée. Le terme \(mC^2/(2r^2)\), énergie cinétique orthoradiale exprimée avec \(C\), joue le rôle d'une énergie potentielle répulsive qui empêche le palet d'atteindre \(O\) (énergie potentielle effective, chapitre « Mouvement dans un champ central », §4).</p>
    <p><strong>C3.</strong> Orbite circulaire : minimum de \(E_{\text{p}}(r)=\dfrac{mC^2}{2r^2}+Mgr\), \(-\dfrac{mC^2}{r^3}+Mg=0\), soit</p>
    <div class="formula">$$r_0=\left(\frac{mC^2}{Mg}\right)^{1/3}\approx0{,}279\ \text{m}$$</div>
    <p>La dérivée seconde, \(3mC^2/r^4\gt0\), assure un minimum : l'orbite est stable (la tension \(Mg\) équilibre exactement la force centripète \(mC^2/r_0^3\)).</p>
    <p><strong>C4.</strong> En dérivant \(E\) par rapport au temps et en simplifiant par \(\dot r\) : \((m+M)\ddot r=\dfrac{mC^2}{r^3}-Mg\). En posant \(r=r_0+\varepsilon\) et en linéarisant (\(1/r^3\approx(1-3\varepsilon/r_0)/r_0^3\)) : \((m+M)\ddot\varepsilon=-\dfrac{3mC^2}{r_0^4}\varepsilon=-\dfrac{3Mg}{r_0}\varepsilon\). Période radiale :</p>
    <div class="formula">$$T_r=2\pi\sqrt{\frac{(m+M)\,r_0}{3Mg}}\approx0{,}71\ \text{s}$$</div>
    <p>Période de rotation : \(T_{\text{rot}}=2\pi r_0^2/C\approx0{,}61\ \text{s}\). Le rapport \(T_r/T_{\text{rot}}=\sqrt{(m+M)/(3m)}\approx1{,}15\) n'est pas un nombre rationnel simple : la trajectoire légèrement perturbée n'est pas fermée, elle forme une rosette.</p>
    <p><strong>D1.</strong> Aux extrémités du mouvement radial, \(\dot r=0\) ; la conservation de \(E\) donne \(\dfrac{mC^2}{2r^2}+Mgr=\dfrac{mC^2}{2r_1^2}+Mgr_1=1{,}377\ \text{J}\) (constante choisie nulle). En multipliant par \(r^2\) : \(Mg\,r^3-1{,}377\,r^2+\tfrac12mC^2=0\), une équation du troisième degré dont \(r_1=0{,}40\ \text{m}\) est racine. L'autre racine positive, entre 0 et \(r_0\), se trouve par dichotomie : \(r_{\min}\approx0{,}202\ \text{m}\). Vitesse : \(v=C/r_{\min}\approx3{,}95\ \text{m·s}^{-1}\) (orthoradiale, puisque \(\dot r=0\)).</p>
    <p><strong>D2.</strong> La simulation confirme \(r_{\min}\) (les deux méthodes sont indépendantes : conservation d'une part, intégration de l'équation du mouvement d'autre part). L'aller-retour radial dure \(2\times0{,}370\approx0{,}74\ \text{s}\), un peu plus que \(T_r=0{,}71\ \text{s}\) : l'oscillation, d'amplitude comparable à \(r_0\), n'est plus harmonique (le puits n'est pas symétrique : plus raide du côté des petits \(r\)).</p>
