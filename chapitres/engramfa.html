      <div class="sec-num">§1 · LES PIÈGES CLASSIQUES</div>
      <h2>Faux-amis (false friends)</h2>
      <div class="intro">Ces mots <strong>ressemblent</strong> à un mot français mais ont un sens <strong>différent</strong> : sources d'erreurs fréquentes en thème comme en version. À surapprendre.</div>
      <div class="prop-box"><strong>Verbes</strong> : to attend = assister à · to demand = exiger · to support = soutenir · to achieve = réaliser · to deceive = tromper · to pass an exam = réussir.</div>
      <div class="prop-box"><strong>Noms</strong> : a library = bibliothèque · a journey = voyage · a deception = tromperie · an issue = problème · a location = emplacement.</div>
      <div class="prop-box"><strong>Adjectifs / adverbes</strong> : sensible = sensé · actually = en fait · eventually = finalement · currently = actuellement · comprehensive = complet.</div>
      <div class="notice">Astuce : à chaque faux-ami, mémorise aussi la <em>vraie</em> traduction du mot français piège (ex. « éventuellement » = <em>possibly</em>).</div>
    </div>
