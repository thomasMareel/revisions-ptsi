  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la section « Polynômes » du programme de PTSI (second semestre) : l'ensemble \(\mathbb K[X]\) (\(\mathbb K = \mathbb R\) ou \(\mathbb C\)), la division euclidienne, les racines et leur multiplicité, la dérivation, la factorisation dans \(\mathbb C[X]\) et \(\mathbb R[X]\), et la décomposition en éléments simples des fractions rationnelles à pôles simples. Les polynômes servent à résoudre des équations algébriques (chapitre <a href="#complexes/cours">« Nombres complexes »</a>), à approcher des fonctions (formule de Taylor, chapitre <a href="#dl/cours">« Développements limités »</a>), à calculer des primitives, et ils fournissent les exemples types d'espaces vectoriels (\(\mathbb K_n[X]\), chapitres <a href="#ev/cours">« Espaces vectoriels »</a> et <a href="#applin/cours">« Applications linéaires »</a>).</div>

<div class="course-section">
  <div class="sec-num">§1 · L'ENSEMBLE \(\mathbb K[X]\)</div>
  <h2>Polynômes, opérations, composition</h2>
  <div class="intro">Un polynôme est une « expression » \(a_0 + a_1X + \cdots + a_nX^n\), où \(X\) n'est pas un nombre mais une lettre, l'indéterminée. On calcule avec ces expressions exactement comme avec des fonctions polynomiales (somme, produit, composition), mais l'objet lui-même est la liste de ses coefficients : c'est ce qui permet d'identifier deux polynômes coefficient par coefficient.</div>

  <div class="def-box">
    Un <strong>polynôme</strong> à coefficients dans \(\mathbb K\) est une expression \(P = \sum_{k=0}^{n} a_k X^k = a_0 + a_1 X + \cdots + a_n X^n\) avec \(a_0, \ldots, a_n \in \mathbb K\), ses <strong>coefficients</strong> (on considère comme nuls les coefficients d'indice plus grand que \(n\)). L'ensemble des polynômes est noté \(\mathbb K[X]\). Deux polynômes sont <strong>égaux</strong> si et seulement si leurs coefficients sont égaux un à un : c'est le principe d'<strong>identification</strong>. Le <strong>polynôme nul</strong> a tous ses coefficients nuls ; les polynômes <strong>constants</strong> sont les \(a_0\).
  </div>

  <div class="prop-box">
    <strong>Opérations.</strong> On ajoute et l'on multiplie par un scalaire coefficient par coefficient. Le produit de \(P = \sum a_i X^i\) et \(Q = \sum b_j X^j\) s'obtient en développant avec \(X^iX^j = X^{i+j}\) :
    <div class="formula" data-nom="Coefficients d'un produit">$$PQ = \sum_{k} c_k X^k, \qquad c_k = \sum_{i + j = k} a_i b_j = a_0 b_k + a_1 b_{k-1} + \cdots + a_k b_0 .$$</div>
    Ces opérations ont les règles de calcul habituelles (commutativité, associativité, distributivité) ; en particulier la <strong>formule du binôme</strong> vaut dans \(\mathbb K[X]\) (chapitre <a href="#calculs/cours">« Calculs algébriques »</a>, §5) : \((X + a)^n = \sum_{k=0}^{n} \binom nk a^{n-k} X^k\). La <strong>composée</strong> de \(P = \sum a_k X^k\) par \(Q\) est \(P \circ Q = P(Q) = \sum a_k Q^k\).
  </div>

  <div class="method-box">
    <strong>Exemple — produit, binôme, composée, identification</strong>
    <ol>
      <li>\(P = X^2 + 2X - 1\), \(Q = 3X - 2\) : \(PQ = 3X^3 + 4X^2 - 7X + 2\). Contrôle du coefficient de \(X^2\) par la formule : \(c_2 = a_0b_2 + a_1b_1 + a_2b_0 = (-1)\times 0 + 2 \times 3 + 1 \times (-2) = 4\).</li>
      <li>\((X + 2)^4 = X^4 + 8X^3 + 24X^2 + 32X + 16\) : le coefficient de \(X^2\) vaut \(\binom42 2^2 = 24\).</li>
      <li>Avec \(P = X^2 + 1\) et \(Q = X - 1\) : \(P \circ Q = (X - 1)^2 + 1 = X^2 - 2X + 2\), mais \(Q \circ P = X^2\). La composition n'est pas commutative.</li>
      <li>Trouvons \(a, b, c\) tels que \(X^3 - 2X^2 + 2X - 1 = (X - 1)(aX^2 + bX + c)\). Le second membre vaut \(aX^3 + (b - a)X^2 + (c - b)X - c\) ; par identification, \(a = 1\), \(b - a = -2\), \(c - b = 2\), \(-c = -1\) : \(a = 1\), \(b = -1\), \(c = 1\). Les quatre équations sont compatibles : \(X^3 - 2X^2 + 2X - 1 = (X - 1)(X^2 - X + 1)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : traiter \(X\) comme un nombre inconnu à « trouver ». \(X^2 - 1 = 0\) n'est pas une équation : c'est faux, puisque le polynôme \(X^2 - 1\) n'est pas le polynôme nul. L'équation est \(x^2 - 1 = 0\), d'inconnue \(x \in \mathbb K\) (§4). De même, \(P(X)\) désigne \(P\) lui-même, et \(P(X + 1)\) la composée \(P \circ (X + 1)\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DEGRÉ</div>
  <h2>Degré, coefficient dominant, \(\mathbb K_n[X]\)</h2>
  <div class="intro">Le degré mesure la « taille » d'un polynôme. Il se comporte simplement vis-à-vis du produit, ce qui fournit l'argument le plus utilisé du chapitre : comparer les degrés des deux membres d'une égalité suffit souvent à déterminer un polynôme inconnu ou à montrer qu'il n'existe pas.</div>

  <div class="def-box">
    Si \(P = \sum_{k=0}^{n} a_k X^k\) avec \(a_n \neq 0\), l'entier \(n\) est le <strong>degré</strong> de \(P\), noté \(\deg P\) ; \(a_n\) est son <strong>coefficient dominant</strong>, et \(P\) est <strong>unitaire</strong> si \(a_n = 1\). Par convention, \(\deg 0 = -\infty\) (avec \(-\infty + n = -\infty\) et \(-\infty \lt n\) pour tout entier \(n\)). Pour \(n \in \mathbb N\), \(\mathbb K_n[X]\) est l'ensemble des polynômes de degré au plus \(n\) ; il contient le polynôme nul.
  </div>

  <div class="prop-box">
    <strong>Degré et opérations.</strong> Pour \(P, Q \in \mathbb K[X]\) et \(\lambda \in \mathbb K\) non nul :
    <div class="formula" data-nom="Degré d'une somme, d'un produit">$$\deg(P + Q) \le \max(\deg P, \deg Q), \qquad \deg(\lambda P) = \deg P, \qquad \deg(PQ) = \deg P + \deg Q .$$</div>
    Si \(\deg P \neq \deg Q\), on a même \(\deg(P + Q) = \max(\deg P, \deg Q)\). Le coefficient dominant d'un produit est le produit des coefficients dominants. Conséquences : <strong>le produit de deux polynômes non nuls est non nul</strong>, et si \(PR = QR\) avec \(R \neq 0\), alors \(P = Q\). Enfin, si \(\deg Q \ge 1\), \(\deg(P \circ Q) = \deg P \times \deg Q\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le terme de plus haut degré d'un produit.</span>
    <div class="content"><p>Si \(P\) ou \(Q\) est nul, les deux membres valent \(-\infty\). Sinon, soient \(a_n X^n\) et \(b_m X^m\) leurs termes de plus haut degré. Dans \(PQ\), les produits \(a_iX^i \cdot b_jX^j\) sont de degré \(i + j \le n + m\), et le seul de degré \(n + m\) est \(a_nb_mX^{n+m}\), dont le coefficient est non nul (produit de deux nombres non nuls). Donc \(\deg(PQ) = n + m\), et \(PQ \neq 0\). Pour la simplification : \(PR = QR\) donne \((P - Q)R = 0\), donc \(P - Q = 0\) puisque \(R \neq 0\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — trois arguments de degré</strong>
    <ol>
      <li>\((X^2 + 1)^3 - X^6 = 3X^4 + 3X^2 + 1\) : de degré 4, et non 6, car les termes \(X^6\) se compensent. Le degré d'une somme peut chuter.</li>
      <li>Il n'existe pas de polynôme \(P\) tel que \(P^2 = X^3 + X\) : on aurait \(2\deg P = 3\), impossible pour un entier.</li>
      <li>Si \(\deg P = n \ge 1\), alors \(P(X + 1) - P(X)\) est de degré \(n - 1\) : les termes en \(X^n\) se compensent, et le coefficient de \(X^{n-1}\) vaut \(n a_n \neq 0\). Pour \(P = X^3\) : \((X + 1)^3 - X^3 = 3X^2 + 3X + 1\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\deg(P + Q) = \max(\deg P, \deg Q)\) sans vérifier que les coefficients dominants ne se compensent pas : \((X^2 + X) + (-X^2 + 1) = X + 1\). Autre piège : oublier le polynôme nul, de degré \(-\infty\), dans « \(\deg P \le n\) » ; c'est grâce à lui que \(\mathbb K_n[X]\) est un espace vectoriel (de dimension \(n + 1\), de base \((1, X, \ldots, X^n)\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · DIVISIBILITÉ ET DIVISION EUCLIDIENNE</div>
  <h2>Diviser un polynôme par un autre</h2>
  <div class="intro">Comme les entiers (chapitre <a href="#calculs/cours">« Calculs algébriques »</a>, §8), les polynômes se divisent avec reste ; le degré y joue le rôle de la taille. La division par \(X - a\) relie la divisibilité aux racines (§4), et la division par un polynôme de degré 2 donne le reste d'une puissance \(X^n\) sans tout développer.</div>

  <div class="def-box">
    \(B\) <strong>divise</strong> \(A\) (on note \(B \mid A\)) s'il existe \(Q \in \mathbb K[X]\) tel que \(A = BQ\) ; \(B\) est un <strong>diviseur</strong> de \(A\), \(A\) un <strong>multiple</strong> de \(B\). Si \(A \neq 0\) et \(B \mid A\), alors \(\deg B \le \deg A\) (§2). Les diviseurs de degré 0 de tout polynôme sont les constantes non nulles.
  </div>
  <div class="prop-box">
    <strong>Théorème de la division euclidienne.</strong> Soient \(A, B \in \mathbb K[X]\) avec \(B \neq 0\). Il existe un unique couple \((Q, R)\) de polynômes tel que
    <div class="formula" data-nom="Division euclidienne">$$A = BQ + R \qquad \text{et} \qquad \deg R \lt \deg B .$$</div>
    \(Q\) est le <strong>quotient</strong> et \(R\) le <strong>reste</strong> ; \(B\) divise \(A\) si et seulement si \(R = 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Unicité par les degrés ; existence par l'algorithme.</span>
    <div class="content"><p><em>Unicité.</em> Si \(BQ + R = BQ' + R'\) avec \(\deg R, \deg R' \lt \deg B\), alors \(B(Q - Q') = R' - R\). Le second membre est de degré \(\lt \deg B\) ; si \(Q \neq Q'\), le premier est de degré \(\ge \deg B\). Donc \(Q = Q'\), puis \(R = R'\).</p>
    <p><em>Existence.</em> Récurrence forte sur le degré de \(A\). Si \(\deg A \lt \deg B\), on prend \(Q = 0\), \(R = A\). Sinon, soient \(a X^n\) et \(b X^m\) les termes dominants de \(A\) et \(B\) (\(n \ge m\)) : \(A_1 = A - \frac ab X^{n-m} B\) a un degré \(\lt n\) (les termes en \(X^n\) se compensent). Par hypothèse de récurrence, \(A_1 = BQ_1 + R_1\), d'où \(A = B\big(\frac ab X^{n-m} + Q_1\big) + R_1\). C'est exactement l'algorithme ci-dessous.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — l'algorithme, étape par étape</strong>
    <ol>
      <li>Divisons \(A = 2X^4 - 3X^3 + X - 5\) par \(B = X^2 - X + 1\). À chaque étape, on divise le terme dominant du reste courant par \(X^2\), on retranche le produit par \(B\), et l'on s'arrête quand le reste est de degré \(\lt 2\) :
      $$\begin{aligned} A - 2X^2 B &= -X^3 - 2X^2 + X - 5, \\ (-X^3 - 2X^2 + X - 5) + X B &= -3X^2 + 2X - 5, \\ (-3X^2 + 2X - 5) + 3B &= -X - 2 . \end{aligned}$$</li>
      <li>Quotient \(Q = 2X^2 - X - 3\), reste \(R = -X - 2\) : \(A = (X^2 - X + 1)(2X^2 - X - 3) - X - 2\). Contrôle en \(X = 1\) : \(A(1) = -5\) et \(1 \times (-2) - 3 = -5\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le reste de \(X^n\) dans la division par \(X^2 - 3X + 2\)</strong>
    <ol>
      <li>Le reste est de degré \(\le 1\) : \(X^n = (X^2 - 3X + 2)Q + \alpha X + \beta\). Comme \(X^2 - 3X + 2 = (X - 1)(X - 2)\), on évalue en 1 et en 2 (fonctions polynomiales, §4) : \(1 = \alpha + \beta\) et \(2^n = 2\alpha + \beta\).</li>
      <li>D'où \(\alpha = 2^n - 1\), \(\beta = 2 - 2^n\) : le reste est \((2^n - 1)X + 2 - 2^n\). Contrôle \(n = 2\) : \(X^2 = (X^2 - 3X + 2) + 3X - 2\). Pour \(n = 10\) : \(1\,023X - 1\,022\), sans poser une division de huit étapes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : s'arrêter trop tôt ou trop tard ; la condition est \(\deg R \lt \deg B\) (strictement), et le reste peut être une constante ou le polynôme nul. Dans la potence, une puissance absente de \(A\) (ici \(X^2\)) doit être réservée avec un coefficient nul, sinon on aligne mal les termes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · FONCTION POLYNOMIALE, RACINES, HORNER</div>
  <h2>Évaluer un polynôme, chercher ses racines</h2>
  <div class="intro">Remplacer \(X\) par un nombre \(x\) donne la fonction polynomiale, et les racines sont les \(x\) qui l'annulent. Le lien central du chapitre est qu'une racine \(a\) se traduit par un facteur \(X - a\) : chercher des racines, c'est factoriser. La méthode de Horner évalue rapidement un polynôme et fournit en même temps ce facteur.</div>

  <div class="def-box">
    À \(P = \sum a_k X^k\) on associe la <strong>fonction polynomiale</strong> \(\widetilde P : \mathbb K \to \mathbb K\), \(x \mapsto \sum a_k x^k\) ; on note simplement \(P(x)\) sa valeur en \(x\). Pour tous \(P\), \(Q\) et tout \(x\) : \((P + Q)(x) = P(x) + Q(x)\), \((PQ)(x) = P(x)Q(x)\), \((P \circ Q)(x) = P\big(Q(x)\big)\). Un élément \(a \in \mathbb K\) est une <strong>racine</strong> (ou un zéro) de \(P\) si \(P(a) = 0\).
  </div>
  <div class="prop-box">
    <strong>Racines et divisibilité.</strong> Le reste de la division de \(P\) par \(X - a\) est la constante \(P(a)\). Donc :
    <div class="formula" data-nom="Racine et divisibilité">$$a \text{ est racine de } P \iff (X - a) \mid P .$$</div>
    Plus généralement, si \(a_1, \ldots, a_p\) sont des racines <strong>deux à deux distinctes</strong> de \(P\), alors \((X - a_1)\cdots(X - a_p)\) divise \(P\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Diviser par \(X - a\), puis récurrence sur le nombre de racines.</span>
    <div class="content"><p>La division par \(X - a\) (de degré 1) donne \(P = (X - a)Q + R\) avec \(R\) constant ; en évaluant en \(a\), \(R = P(a)\). Donc \(P(a) = 0 \iff R = 0 \iff (X - a) \mid P\). Pour plusieurs racines, par récurrence sur \(p\) : si \(P = (X - a_1)\cdots(X - a_{p-1})\,Q\), alors en évaluant en \(a_p\), \(0 = (a_p - a_1)\cdots(a_p - a_{p-1})\,Q(a_p)\) ; les facteurs \(a_p - a_i\) ne sont pas nuls (racines distinctes), donc \(Q(a_p) = 0\) et \(X - a_p\) divise \(Q\).</p></div>
  </div>

  <h3>La méthode de Horner</h3>
  <p>Pour \(P = a_nX^n + \cdots + a_1X + a_0\), on écrit \(P(a) = \big(\cdots\big((a_n a + a_{n-1})a + a_{n-2}\big)a + \cdots\big)a + a_0\). On calcule donc \(b_{n-1} = a_n\), puis \(b_{k-1} = b_k a + a_k\) pour \(k = n - 1, \ldots, 1\), et enfin \(P(a) = b_0 a + a_0\) : \(n\) multiplications et \(n\) additions, au lieu d'environ \(\frac{n^2}{2}\) multiplications si l'on calcule chaque puissance \(a^k\) séparément. Les nombres intermédiaires sont les coefficients du quotient : \(P = (X - a)(b_{n-1}X^{n-1} + \cdots + b_0) + P(a)\).</p>
  <div class="method-box">
    <strong>Exemple — Horner sur \(P = 2X^3 - 5X^2 + 4X - 3\) en \(a = 2\)</strong>
    <ol>
      <li>On descend les coefficients de \(P\) ; chaque case de la seconde ligne vaut (case précédente) \(\times\, 2\) + (coefficient au-dessus) :</li>
    </ol>
    <table>
      <tr><th>coefficients de \(P\)</th><td>2</td><td>−5</td><td>4</td><td>−3</td></tr>
      <tr><th>Horner en \(a = 2\)</th><td>2</td><td>2 × 2 − 5 = −1</td><td>−1 × 2 + 4 = 2</td><td>2 × 2 − 3 = <strong>1</strong></td></tr>
    </table>
    <ol start="2">
      <li>Donc \(P(2) = 1\) (contrôle : \(16 - 20 + 8 - 3 = 1\)) et \(P = (X - 2)(2X^2 - X + 2) + 1\) : 2 n'est pas racine.</li>
      <li>En Python, avec la liste des coefficients par degrés décroissants :</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> horner(coeffs, a):
    s = 0
    <span class="kw">for</span> c <span class="kw">in</span> coeffs:      <span class="cmt"># de a_n à a_0</span>
        s = s * a + c
    <span class="kw">return</span> s</pre>
    <p>Ici <span class="code-inline">horner([2, -5, 4, -3], 2)</span> renvoie 1. Invariant de boucle : après avoir lu les \(j\) premiers coefficients, \(s\) est la valeur en \(a\) du polynôme formé par ces coefficients.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier un coefficient nul dans la liste (pour \(X^3 - 2\), la liste est \([1, 0, 0, -2]\)), ou confondre racine et facteur : \(a\) racine donne le facteur \(X - a\), pas \(X + a\). Pour chercher une racine « évidente » d'un polynôme à coefficients entiers, on essaie \(0\), \(\pm 1\), \(\pm 2\) : une racine entière non nulle divise le coefficient constant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · NOMBRE DE RACINES ; POLYNÔME ET FONCTION</div>
  <h2>Au plus \(n\) racines : un outil d'unicité</h2>
  <div class="intro">Un polynôme non nul de degré \(n\) ne peut pas s'annuler plus de \(n\) fois. Ce résultat simple est un outil très efficace : pour montrer que deux polynômes sont égaux, il suffit de vérifier qu'ils prennent les mêmes valeurs en assez de points. Il justifie aussi qu'on identifie, sur \(\mathbb R\) ou \(\mathbb C\), un polynôme et sa fonction polynomiale.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Un polynôme non nul de degré \(n\) a au plus \(n\) racines distinctes. En conséquence :
    <ul>
      <li>un polynôme de degré au plus \(n\) qui a au moins \(n + 1\) racines distinctes est nul ;</li>
      <li>un polynôme qui a une infinité de racines est nul ;</li>
      <li>si \(P(x) = Q(x)\) pour une infinité de valeurs de \(x\) (par exemple pour tout \(x\) d'un intervalle), alors \(P = Q\). En particulier, un polynôme est déterminé par sa fonction polynomiale : on peut identifier les coefficients de deux fonctions polynomiales égales.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un produit de \(p\) facteurs de degré 1 divise \(P\).</span>
    <div class="content"><p>Si \(a_1, \ldots, a_p\) sont des racines distinctes de \(P \neq 0\), le polynôme \((X - a_1)\cdots(X - a_p)\), de degré \(p\), divise \(P\) (§4), donc \(p \le \deg P\). Les conséquences en découlent : un polynôme non nul de degré \(\le n\) a au plus \(n\) racines, et pour la dernière, on applique le résultat à \(P - Q\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — deux raisonnements par les racines</strong>
    <ol>
      <li>Soit \(P \in \mathbb R[X]\) tel que \(P(x + 1) = P(x)\) pour tout réel \(x\). Alors \(P(n) = P(0)\) pour tout \(n \in \mathbb N\) (récurrence) : le polynôme \(P - P(0)\) a une infinité de racines \(0, 1, 2, \ldots\), il est nul. \(P\) est constant.</li>
      <li>Il existe un unique \(P \in \mathbb R_2[X]\) tel que \(P(0) = 1\), \(P(1) = 2\), \(P(2) = 5\). <em>Unicité</em> : la différence de deux tels polynômes est de degré \(\le 2\) avec trois racines 0, 1, 2 : elle est nulle. <em>Existence</em> : avec \(P = aX^2 + bX + c\), on obtient \(c = 1\), \(a + b = 1\), \(4a + 2b = 4\), d'où \(a = 1\), \(b = 0\) : \(P = X^2 + 1\). (La formule générale, dite d'interpolation de Lagrange, est hors programme : voir la fin du chapitre.)</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : « un polynôme de degré \(n\) a \(n\) racines ». C'est « au plus \(n\) » : \(X^2 + 1\) n'en a aucune dans \(\mathbb R\), et \((X - 1)^2\) n'en a qu'une (double). Dans \(\mathbb C\), on en a exactement \(n\) si on les compte avec leur multiplicité (§6 et §9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MULTIPLICITÉ, POLYNÔMES SCINDÉS, SOMME ET PRODUIT DES RACINES</div>
  <h2>Compter les racines avec leur multiplicité</h2>
  <div class="intro">Une racine peut « compter plusieurs fois » : \(1\) est racine de \((X - 1)^3\) avec la multiplicité 3. En comptant ainsi, un polynôme scindé de degré \(n\) a exactement \(n\) racines, et leur somme et leur produit se lisent sur deux coefficients, sans calculer les racines.</div>

  <div class="def-box">
    Soit \(P \neq 0\) et \(a \in \mathbb K\). La <strong>multiplicité</strong> de \(a\) est le plus grand entier \(m\) tel que \((X - a)^m\) divise \(P\) ; de façon équivalente, \(P = (X - a)^m Q\) avec \(Q(a) \neq 0\). Si \(m \ge 1\), \(a\) est une racine <strong>simple</strong> (\(m = 1\)), <strong>double</strong> (\(m = 2\)), etc. ; \(m = 0\) signifie que \(a\) n'est pas racine. Un polynôme non constant est <strong>scindé</strong> sur \(\mathbb K\) s'il est produit de polynômes de degré 1 de \(\mathbb K[X]\) :
    <div class="formula" data-nom="Polynôme scindé">$$P = \lambda\,(X - a_1)^{m_1}\cdots(X - a_p)^{m_p}, \qquad a_1, \ldots, a_p \text{ distincts}, \quad m_1 + \cdots + m_p = \deg P .$$</div>
  </div>
  <p>Comme au §5, la somme des multiplicités des racines d'un polynôme non nul est au plus son degré, avec égalité si et seulement s'il est scindé. On écrit souvent les racines d'un polynôme scindé de degré \(n\) « répétées selon leur multiplicité » : \(x_1, \ldots, x_n\), et alors \(P = a_n(X - x_1)\cdots(X - x_n)\).</p>

<figcaption>Le comportement près de la racine 1 dépend de sa multiplicité m. Simple : la courbe traverse l'axe en le coupant. Double : elle le touche (tangente horizontale) sans changer de signe. Triple : tangente horizontale et changement de signe. En général, P(x) ≈ c(x − 1)ᵐ près de 1 : le signe change si et seulement si m est impair. La racine −1, simple dans les trois cas, est toujours traversée.</figcaption>

  <div class="prop-box">
    <strong>Somme et produit des racines.</strong> Si \(P = a_nX^n + a_{n-1}X^{n-1} + \cdots + a_1X + a_0\) (\(n \ge 1\), \(a_n \neq 0\)) est scindé, de racines \(x_1, \ldots, x_n\) répétées selon leur multiplicité :
    <div class="formula" data-nom="Somme et produit des racines">$$x_1 + x_2 + \cdots + x_n = -\frac{a_{n-1}}{a_n}, \qquad x_1x_2\cdots x_n = (-1)^n\,\frac{a_0}{a_n} .$$</div>
    Pour \(aX^2 + bX + c\) : \(x_1 + x_2 = -\frac ba\) et \(x_1x_2 = \frac ca\) (chapitre <a href="#complexes/cours">« Nombres complexes »</a>, §7).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Développer \(a_n(X - x_1)\cdots(X - x_n)\) et identifier.</span>
    <div class="content"><p>Dans le produit \((X - x_1)\cdots(X - x_n)\), on obtient un terme en \(X^{n-1}\) en choisissant \(X\) dans tous les facteurs sauf un, où l'on prend \(-x_i\) : le coefficient de \(X^{n-1}\) est \(-(x_1 + \cdots + x_n)\). Le terme constant s'obtient en prenant \(-x_i\) partout : \((-1)^n x_1\cdots x_n\). On multiplie par \(a_n\) et l'on identifie avec \(a_{n-1}\) et \(a_0\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — racine évidente, factorisation, contrôle</strong>
    <ol>
      <li>\(P = 2X^3 - 5X^2 - X + 6\) : \(P(2) = 16 - 20 - 2 + 6 = 0\). Horner en 2 sur \(2, -5, -1, 6\) donne \(2, -1, -3\) et le reste 0 : \(P = (X - 2)(2X^2 - X - 3) = (X - 2)(X + 1)(2X - 3)\).</li>
      <li>Racines \(2, -1, \frac32\) : somme \(\frac52 = -\frac{-5}{2}\), produit \(-3 = (-1)^3 \times \frac62\). Les deux formules sont vérifiées.</li>
      <li>\(X^3 - 3X + 2 = (X - 1)^2(X + 2)\) : 1 est racine double, \(-2\) simple. Comptées avec multiplicité : somme \(1 + 1 - 2 = 0\) (pas de terme en \(X^2\)), produit \(1 \times 1 \times (-2) = -2 = (-1)^3 \times 2\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer ces formules à un polynôme non scindé sur \(\mathbb R\) en ne comptant que ses racines réelles (\(X^3 - 1\) a une seule racine réelle, 1, mais la somme de ses trois racines complexes vaut 0), ou oublier la multiplicité et le signe \((-1)^n\). Les autres combinaisons des racines (les « fonctions symétriques élémentaires » comme \(\sum_{i \lt j} x_ix_j\)) sont hors programme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DÉRIVATION ET FORMULE DE LEIBNIZ</div>
  <h2>Dériver un polynôme sans passer par les fonctions</h2>
  <div class="intro">La dérivée d'un polynôme se définit directement sur les coefficients, sans limite ni taux d'accroissement. Elle a les mêmes règles de calcul que la dérivée des fonctions, et coïncide avec elle pour \(\mathbb K = \mathbb R\). Son intérêt principal ici : détecter la multiplicité d'une racine (§8).</div>

  <div class="def-box">
    La <strong>dérivée</strong> de \(P = \sum_{k=0}^{n} a_k X^k\) est \(P' = \sum_{k=1}^{n} k\,a_k X^{k-1}\) ; on définit les dérivées successives par \(P^{(0)} = P\) et \(P^{(k+1)} = \big(P^{(k)}\big)'\). Si \(\deg P = n \ge 1\), alors \(\deg P' = n - 1\) ; \(P' = 0\) si et seulement si \(P\) est constant ; \(P^{(k)} = 0\) dès que \(k \gt \deg P\). Pour \(\mathbb K = \mathbb R\), la fonction polynomiale de \(P'\) est la dérivée de celle de \(P\).
  </div>
  <div class="prop-box">
    <strong>Règles de calcul.</strong> \((\lambda P + \mu Q)' = \lambda P' + \mu Q'\), \((PQ)' = P'Q + PQ'\), et la <strong>formule de Leibniz</strong> :
    <div class="formula" data-nom="Formule de Leibniz (polynômes)">$$(PQ)^{(n)} = \sum_{k=0}^{n} \binom nk P^{(k)}\,Q^{(n-k)} .$$</div>
    Pour \(a \in \mathbb K\) et \(p \in \mathbb N\) : \(\big((X - a)^p\big)^{(k)} = \frac{p!}{(p - k)!}(X - a)^{p-k}\) si \(k \le p\), et \(0\) si \(k \gt p\). En particulier \(\big((X - a)^p\big)^{(k)}(a) = 0\) si \(k \neq p\), et \(p!\) si \(k = p\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Produit, puis récurrence comme pour le binôme.</span>
    <div class="content"><p>Par linéarité des deux membres en \(P\) et en \(Q\), il suffit de vérifier \((PQ)' = P'Q + PQ'\) pour \(P = X^i\) et \(Q = X^j\) : $$(X^{i+j})' = (i + j)X^{i+j-1} = iX^{i-1}X^j + X^i\,jX^{j-1} .$$ La formule de Leibniz s'en déduit par récurrence sur \(n\), en dérivant chaque terme \(P^{(k)}Q^{(n-k)}\) et en regroupant avec la formule de Pascal, exactement comme on démontre le binôme (même démonstration pour les fonctions : chapitre <a href="#contderiv/cours">« Continuité et dérivabilité »</a>, §11).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — une dérivée quatrième par Leibniz</strong>
    <ol>
      <li>Soit \(P = (X^2 + X)(X - 2)^4\). Calculons \(P^{(k)}(2)\) pour \(k = 0, \ldots, 4\) sans développer.</li>
      <li>Par Leibniz, \(P^{(k)} = \sum_{j=0}^{k} \binom kj (X^2 + X)^{(k-j)}\big((X - 2)^4\big)^{(j)}\). En 2, tous les termes avec \(j \lt 4\) sont nuls ; pour \(k \le 3\), il ne reste rien : \(P(2) = P'(2) = P''(2) = P'''(2) = 0\).</li>
      <li>Pour \(k = 4\), seul le terme \(j = 4\) subsiste : \(P^{(4)}(2) = \binom44 (2^2 + 2) \times 4! = 6 \times 24 = 144\). On verra au §8 que cela fait de 2 une racine de multiplicité exactement 4.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\deg P' = \deg P - 1\) pour un polynôme constant (sa dérivée est nulle, de degré \(-\infty\)). Dans la formule de Leibniz, ne pas oublier les coefficients binomiaux, et remarquer qu'un facteur polynomial de degré \(d\) arrête la somme : ses dérivées d'ordre \(\gt d\) sont nulles.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · FORMULE DE TAYLOR ET MULTIPLICITÉ</div>
  <h2>Développer autour d'un point, lire la multiplicité</h2>
  <div class="intro">Écrire un polynôme en puissances de \(X - a\) plutôt que de \(X\) revient à le regarder « depuis le point \(a\) ». Les coefficients de cette écriture sont les dérivées en \(a\) : c'est la formule de Taylor, exacte pour les polynômes, modèle de tous les développements limités. On en déduit la caractérisation de la multiplicité par les dérivées.</div>

  <div class="prop-box">
    <strong>Formule de Taylor polynomiale.</strong> Pour tout polynôme \(P\) de degré au plus \(n\) et tout \(a \in \mathbb K\) :
    <div class="formula" data-nom="Formule de Taylor polynomiale">$$P = \sum_{k=0}^{n} \frac{P^{(k)}(a)}{k!}\,(X - a)^k = P(a) + P'(a)(X - a) + \cdots + \frac{P^{(n)}(a)}{n!}(X - a)^n .$$</div>
    Ce sont les coordonnées de \(P\) dans la base \(\big(1, X - a, \ldots, (X - a)^n\big)\) de \(\mathbb K_n[X]\) (chapitre <a href="#ev/cours">« Espaces vectoriels »</a>, §5) ; pour les fonctions, voir le chapitre <a href="#dl/cours">« Développements limités »</a>, §1.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Linéarité, puis le cas \(P = (X - a)^j\).</span>
    <div class="content"><p>Les deux membres dépendent linéairement de \(P\). Or tout polynôme de degré \(\le n\) est combinaison linéaire des \((X - a)^j\), \(0 \le j \le n\) (développer \(P(X) = P\big((X - a) + a\big)\) par le binôme). Il suffit donc de vérifier la formule pour \(P = (X - a)^j\) : d'après le §7, \(P^{(k)}(a)\) vaut \(j!\) si \(k = j\) et 0 sinon, et le second membre se réduit à \(\frac{j!}{j!}(X - a)^j = P\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Multiplicité et dérivées.</strong> \(a\) est racine de multiplicité \(m \ge 1\) de \(P\) si et seulement si
    <div class="formula" data-nom="Multiplicité par les dérivées">$$P(a) = P'(a) = \cdots = P^{(m-1)}(a) = 0 \qquad \text{et} \qquad P^{(m)}(a) \neq 0 .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La formule de Taylor en \(a\) met \((X - a)^m\) en facteur.</span>
    <div class="content"><p>Si les \(m\) premières dérivées s'annulent en \(a\) et \(P^{(m)}(a) \neq 0\), Taylor donne \(P = (X - a)^m Q\) avec \(Q = \sum_{k \ge m} \frac{P^{(k)}(a)}{k!}(X - a)^{k-m}\) et \(Q(a) = \frac{P^{(m)}(a)}{m!} \neq 0\) : la multiplicité est \(m\). Réciproquement, si \(P = (X - a)^m Q\) avec \(Q(a) \neq 0\), on développe \(Q\) par Taylor en \(a\) : \(P = \sum_j c_j (X - a)^{m+j}\) avec \(c_0 = Q(a) \neq 0\) ; par unicité des coordonnées, \(\frac{P^{(k)}(a)}{k!} = 0\) pour \(k \lt m\) et \(\frac{P^{(m)}(a)}{m!} = Q(a) \neq 0\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — une racine triple</strong>
    <ol>
      <li>\(P = X^4 - 5X^3 + 6X^2 + 4X - 8\). En 2 : \(P(2) = 16 - 40 + 24 + 8 - 8 = 0\) ; \(P' = 4X^3 - 15X^2 + 12X + 4\), \(P'(2) = 0\) ; \(P'' = 12X^2 - 30X + 12\), \(P''(2) = 0\) ; \(P''' = 24X - 30\), \(P'''(2) = 18 \neq 0\). Donc 2 est racine <strong>triple</strong>.</li>
      <li>Taylor en 2, avec \(P^{(4)} = 24\) : \(P = \frac{18}{6}(X - 2)^3 + \frac{24}{24}(X - 2)^4 = (X - 2)^3\big(3 + (X - 2)\big) = (X - 2)^3(X + 1)\).</li>
      <li>Autre exemple : \(X^3 = \big((X - 1) + 1\big)^3 = 1 + 3(X - 1) + 3(X - 1)^2 + (X - 1)^3\), et l'on retrouve bien \(P(1) = 1\), \(P'(1) = 3\), \(\frac{P''(1)}{2} = 3\), \(\frac{P'''(1)}{6} = 1\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure « racine double » de \(P(a) = P'(a) = 0\) seulement ; cela donne une multiplicité <em>au moins</em> 2, et il faut \(P''(a) \neq 0\) pour qu'elle vaille exactement 2. Autre piège : la formule de Taylor demande \(\deg P \le n\) ; avec \(n\) trop petit, on oublie des termes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · FACTORISATION DANS \(\mathbb C[X]\)</div>
  <h2>D'Alembert-Gauss : tout polynôme complexe est scindé</h2>
  <div class="intro">Dans \(\mathbb R\), \(X^2 + 1\) n'a pas de racine ; les nombres complexes ont été inventés pour cela, et le théorème de d'Alembert-Gauss affirme qu'ils suffisent pour tous les polynômes. Conséquence : tout polynôme complexe se factorise entièrement en facteurs de degré 1, et un polynôme de degré \(n\) a exactement \(n\) racines complexes comptées avec multiplicité.</div>

  <div class="def-box">
    Un polynôme \(P \in \mathbb K[X]\) est <strong>irréductible</strong> dans \(\mathbb K[X]\) s'il n'est pas constant et ne s'écrit pas comme produit de deux polynômes non constants de \(\mathbb K[X]\). Tout polynôme de degré 1 est irréductible.
  </div>
  <div class="prop-box">
    <strong>Théorème de d'Alembert-Gauss</strong> (démonstration hors programme). Tout polynôme non constant de \(\mathbb C[X]\) admet au moins une racine dans \(\mathbb C\).
    <p><strong>Conséquences.</strong> Les irréductibles de \(\mathbb C[X]\) sont les polynômes de degré 1. Tout polynôme non constant de \(\mathbb C[X]\) est scindé : \(P = \lambda (X - z_1)^{m_1}\cdots(X - z_p)^{m_p}\), décomposition unique à l'ordre près, où \(\lambda\) est le coefficient dominant et les \(z_k\) les racines distinctes, de multiplicités \(m_k\) de somme \(\deg P\).</p>
    <p><strong>Factorisation de \(X^n - 1\).</strong> Pour \(n \ge 1\), avec \(\omega = e^{2i\pi/n}\) :</p>
    <div class="formula" data-nom="Factorisation de Xⁿ − 1">$$X^n - 1 = \prod_{k=0}^{n-1} \big(X - \omega^k\big) = \prod_{k=0}^{n-1}\big(X - e^{2ik\pi/n}\big) .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Factoriser une racine, puis récurrence ; pour \(X^n - 1\), compter les racines.</span>
    <div class="content"><p>Par récurrence sur le degré : si \(\deg P \ge 1\), d'Alembert-Gauss fournit une racine \(z\), d'où \(P = (X - z)Q\) avec \(\deg Q = \deg P - 1\), et l'on recommence avec \(Q\) (s'il n'est pas constant). Un polynôme de degré \(\ge 2\) a donc un facteur de degré 1 et n'est pas irréductible. Pour \(X^n - 1\) : ses racines sont les \(n\) racines \(n\)-ièmes de l'unité \(\omega^k\), deux à deux distinctes (chapitre <a href="#complexes/cours">« Nombres complexes »</a>, §8). Le produit \(\prod (X - \omega^k)\) divise \(X^n - 1\) (§4) ; ils ont même degré \(n\) et sont tous deux unitaires : ils sont égaux.</p></div>
  </div>

    <strong>Exemple — lire la somme et le produit des racines de l'unité</strong>
    <ol>
      <li>Pour \(n \ge 2\), \(X^n - 1\) n'a pas de terme en \(X^{n-1}\) : la somme de ses racines est nulle, \(\sum_{k=0}^{n-1}\omega^k = 0\). Leur produit vaut \((-1)^n \times (-1) = (-1)^{n+1}\). Contrôle \(n = 4\) : \(1 + i - 1 - i = 0\) et \(1 \times i \times (-1) \times (-i) = -1 = (-1)^5\).</li>
      <li>Avec \(j = e^{2i\pi/3}\) : \(X^3 - 1 = (X - 1)(X - j)(X - j^2)\), donc \(X^2 + X + 1 = (X - j)(X - j^2)\) (quotient de \(X^3 - 1\) par \(X - 1\)). De même \(X^3 + 1 = (X + 1)(X - e^{i\pi/3})(X - e^{-i\pi/3})\).</li>

<div class="course-section">
  <div class="sec-num">§10 · FACTORISATION DANS \(\mathbb R[X]\)</div>
  <h2>Facteurs de degré 1 et facteurs de degré 2 sans racine réelle</h2>
  <div class="intro">Un polynôme à coefficients réels se factorise dans \(\mathbb C[X]\) ; pour revenir à des facteurs réels, on regroupe ses racines non réelles avec leurs conjuguées. On obtient des facteurs de degré 2 à discriminant strictement négatif : ce sont, avec les facteurs de degré 1, les seuls irréductibles de \(\mathbb R[X]\). C'est cette factorisation que demande la décomposition en éléments simples sur \(\mathbb R\) (§11).</div>

  <div class="prop-box">
    <strong>Racines conjuguées.</strong> Si \(P \in \mathbb R[X]\) et si \(z \in \mathbb C\) est racine de \(P\) de multiplicité \(m\), alors \(\overline z\) est aussi racine de \(P\), avec la même multiplicité. Pour \(z \notin \mathbb R\),
    <div class="formula" data-nom="Facteur réel de deux racines conjuguées">$$(X - z)(X - \overline z) = X^2 - 2\operatorname{Re}(z)\,X + |z|^2 ,$$</div>
    polynôme réel de discriminant \(-4\big(\operatorname{Im} z\big)^2 \lt 0\).
    <p><strong>Irréductibles de \(\mathbb R[X]\) et décomposition.</strong> Les irréductibles de \(\mathbb R[X]\) sont les polynômes de degré 1 et ceux de degré 2 à discriminant strictement négatif. Tout polynôme non constant de \(\mathbb R[X]\) s'écrit, de façon unique à l'ordre près,</p>
    <div class="formula" data-nom="Décomposition dans R[X]">$$P = \lambda \prod_{i} (X - a_i)^{m_i} \prod_{j} \big(X^2 + p_jX + q_j\big)^{n_j}, \qquad p_j^2 - 4q_j \lt 0 .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Conjuguer les dérivées successives, puis regrouper les paires.</span>
    <div class="content"><p>Les coefficients de \(P\) et de ses dérivées sont réels, donc \(\overline{P^{(k)}(z)} = P^{(k)}(\overline z)\) pour tout \(k\). Les conditions « \(P^{(k)}(z) = 0\) pour \(k \lt m\) et \(P^{(m)}(z) \neq 0\) » (§8) sont donc les mêmes en \(z\) et en \(\overline z\). On factorise ensuite \(P\) dans \(\mathbb C[X]\) (§9) et l'on regroupe chaque facteur \((X - z)^m\), \(z \notin \mathbb R\), avec \((X - \overline z)^m\) : leur produit \(\big(X^2 - 2\operatorname{Re}(z)X + |z|^2\big)^m\) est réel. Enfin, un polynôme réel de degré 2 sans racine réelle est irréductible (un facteur de degré 1 donnerait une racine), et un polynôme réel de degré \(\ge 3\) a un facteur réel de degré 1 ou 2, d'après ce qui précède.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — trois factorisations réelles</strong>
    <ol>
      <li>\(X^6 - 1\) : ses racines sont \(\pm 1\) et les paires \(\big(e^{\pm i\pi/3}\big)\), \(\big(e^{\pm 2i\pi/3}\big)\) (figure du §9). Avec \(2\cos\frac\pi3 = 1\) et \(2\cos\frac{2\pi}{3} = -1\) :
      $$X^6 - 1 = (X - 1)(X + 1)(X^2 - X + 1)(X^2 + X + 1) .$$</li>
      <li>\(X^4 + 1 = (X^2 + 1)^2 - 2X^2 = (X^2 - \sqrt2\,X + 1)(X^2 + \sqrt2\,X + 1)\) : deux facteurs de discriminant \(2 - 4 = -2 \lt 0\), irréductibles. \(X^4 + 1\) n'a aucune racine réelle, et pourtant il n'est pas irréductible dans \(\mathbb R[X]\).</li>
      <li>Un polynôme réel de degré impair a au moins une racine réelle : ses racines non réelles vont par paires, et leur nombre (avec multiplicité) est pair. Ainsi \(X^5 - X - 1\) a une racine réelle, que l'on peut approcher par dichotomie (\(\approx 1{,}167\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : « \(P\) n'a pas de racine réelle, donc \(P\) est irréductible dans \(\mathbb R[X]\) » ; ce n'est vrai qu'en degré 2 (et 3). Autre piège : laisser des facteurs complexes dans une factorisation demandée dans \(\mathbb R[X]\), ou regrouper une racine avec une autre qui n'est pas sa conjuguée.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · DÉCOMPOSITION EN ÉLÉMENTS SIMPLES</div>
  <h2>Fractions rationnelles à pôles simples</h2>
  <div class="intro">Une fraction rationnelle \(\frac{P}{Q}\) est difficile à intégrer ou à dériver \(n\) fois telle quelle. La décomposer en une somme de termes \(\frac{\lambda}{X - a}\) très simples rend ces calculs immédiats : primitives en logarithmes, dérivées \(n\)-ièmes explicites, sommes télescopiques. Le programme se limite aux pôles simples ; dans les autres cas, l'énoncé donne la forme à chercher.</div>

  <div class="def-box">
    Une <strong>fraction rationnelle</strong> est un quotient \(F = \frac PQ\) de deux polynômes, \(Q \neq 0\), que l'on écrit sous forme irréductible (\(P\) et \(Q\) sans racine complexe commune). Ses <strong>pôles</strong> sont les racines de \(Q\) ; un pôle est <strong>simple</strong> s'il est racine simple de \(Q\). La <strong>partie entière</strong> de \(F\) est le quotient \(E\) de la division euclidienne de \(P\) par \(Q\) : \(F = E + \frac RQ\) avec \(\deg R \lt \deg Q\) ; elle est nulle si \(\deg P \lt \deg Q\).
  </div>
  <div class="prop-box">
    <strong>Décomposition à pôles simples</strong> (démonstration hors programme). Si \(Q = c\,(X - a_1)\cdots(X - a_p)\) avec \(a_1, \ldots, a_p\) <strong>distincts</strong> (dans \(\mathbb C\), ou dans \(\mathbb R\) si \(Q\) y est scindé), il existe des scalaires uniques \(\lambda_1, \ldots, \lambda_p\) tels que
    <div class="formula" data-nom="Éléments simples (pôles simples)">$$\frac PQ = E + \sum_{k=1}^{p} \frac{\lambda_k}{X - a_k}, \qquad \lambda_k = \frac{P(a_k)}{Q'(a_k)} .$$</div>
    En pratique, \(\lambda_k\) est la valeur en \(a_k\) de \((X - a_k)F\) après simplification (« méthode du cache » : on cache le facteur \(X - a_k\) de \(Q\) et l'on évalue le reste en \(a_k\)). Sur \(\mathbb R\), quand \(Q\) a un facteur irréductible de degré 2 ou une racine multiple, la forme de la décomposition est fournie par l'énoncé, avec un numérateur \(bX + c\) au-dessus de chaque facteur \(X^2 + pX + q\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Pourquoi \(\lambda_k = P(a_k)/Q'(a_k)\), une fois la forme admise.</span>
    <div class="content"><p>Écrivons \(Q = (X - a_k)Q_k\) ; alors \(Q_k(a_k) \neq 0\) (pôle simple) et \(Q' = Q_k + (X - a_k)Q_k'\), donc \(Q'(a_k) = Q_k(a_k)\). En multipliant la décomposition par \(X - a_k\) : \(\frac{P}{Q_k} = (X - a_k)E + \lambda_k + \sum_{j \neq k} \lambda_j \frac{X - a_k}{X - a_j}\). En évaluant en \(a_k\) (qui n'annule aucun \(X - a_j\), \(j \neq k\)), il reste \(\frac{P(a_k)}{Q_k(a_k)} = \lambda_k\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — partie entière, coefficients, contrôle</strong>
    <ol>
      <li>\(F = \dfrac{X^3 + 1}{X^2 - 3X + 2}\), avec \(Q = (X - 1)(X - 2)\) et \(Q' = 2X - 3\). Division : \(X^3 + 1 = (X^2 - 3X + 2)(X + 3) + 7X - 5\), donc \(E = X + 3\).</li>
      <li>\(\lambda_1 = \frac{P(1)}{Q'(1)} = \frac{2}{-1} = -2\) et \(\lambda_2 = \frac{P(2)}{Q'(2)} = \frac{9}{1} = 9\) :
      $$F = X + 3 - \frac{2}{X - 1} + \frac{9}{X - 2} .$$</li>
      <li>Contrôle : \(-2(X - 2) + 9(X - 1) = 7X - 5\), le reste trouvé. Sur la figure, la partie entière donne l'asymptote oblique \(y = x + 3\).</li>
    </ol>
  </div>

<figcaption>F = (X³ + 1)/((X − 1)(X − 2)) = X + 3 − 2/(X − 1) + 9/(X − 2). La partie entière X + 3 donne l'asymptote oblique (en vert) : F(x) − (x + 3) tend vers 0 en ±∞. Les pôles simples 1 et 2 donnent les asymptotes verticales ; le signe du coefficient de chaque élément simple dit de quel côté part la courbe (−2 en 1 : vers +∞ à gauche de 1). La courbe coupe l'axe en −1, racine du numérateur.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — sur \(\mathbb C\), et sur \(\mathbb R\) avec la forme fournie</strong>
    <ol>
      <li>Sur \(\mathbb C\) : \(\frac{1}{X^2 + 1} = \frac{1}{(X - i)(X + i)}\) a deux pôles simples, de coefficients \(\frac{1}{2i} = -\frac i2\) et \(\frac{1}{-2i} = \frac i2\) : \(\frac{1}{X^2 + 1} = \frac{-i/2}{X - i} + \frac{i/2}{X + i}\).</li>
      <li>Sur \(\mathbb R\), avec la forme donnée \(\frac{1}{X^3 - 1} = \frac{a}{X - 1} + \frac{bX + c}{X^2 + X + 1}\) : le cache donne \(a = \frac{1}{1 + 1 + 1} = \frac13\). Puis \(1 = a(X^2 + X + 1) + (bX + c)(X - 1)\) ; le coefficient de \(X^2\) donne \(a + b = 0\), le terme constant \(a - c = 1\) : \(b = -\frac13\), \(c = -\frac23\). Contrôle du coefficient de \(X\) : \(a - b + c = \frac13 + \frac13 - \frac23 = 0\).</li>
    </ol>
  </div>

  <h3>Applications : primitives, dérivées \(k\)-ièmes, sommes</h3>
  <div class="prop-box">
    <strong>Les éléments simples se calculent sans effort.</strong> Sur un intervalle où \(x \neq a\) (\(a\) réel), une primitive de \(x \mapsto \frac{1}{x - a}\) est \(x \mapsto \ln|x - a|\), et
    <div class="formula" data-nom="Dérivée n-ième d'un élément simple">$$\left(\frac{1}{x - a}\right)^{(n)} = \frac{(-1)^n\, n!}{(x - a)^{n+1}} .$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — trois usages de la décomposition</strong>
    <ol>
      <li><em>Primitive.</em> Sur \(]2, +\infty[\), une primitive de \(x \mapsto \frac{x^3 + 1}{x^2 - 3x + 2}\) est \(x \mapsto \frac{x^2}{2} + 3x - 2\ln(x - 1) + 9\ln(x - 2)\).</li>
      <li><em>Dérivée \(n\)-ième.</em> \(f(x) = \frac{1}{x^2 - 1} = \frac12\left(\frac{1}{x - 1} - \frac{1}{x + 1}\right)\) sur \(]1, +\infty[\), donc
      $$f^{(n)}(x) = \frac{(-1)^n\, n!}{2}\left(\frac{1}{(x - 1)^{n+1}} - \frac{1}{(x + 1)^{n+1}}\right) .$$ Pour \(n = 1\) : \(f'(x) = -\frac12 \cdot \frac{(x + 1)^2 - (x - 1)^2}{(x^2 - 1)^2} = \frac{-2x}{(x^2 - 1)^2}\), ce que donne aussi la dérivation directe.</li>
      <li><em>Somme télescopique</em> (chapitre <a href="#calculs/cours">« Calculs algébriques »</a>, §2). Pour \(n \ge 2\) :
      $$\sum_{k=2}^{n} \frac{1}{k^2 - 1} = \frac12 \sum_{k=2}^{n}\left(\frac{1}{k - 1} - \frac{1}{k + 1}\right) = \frac12\left(1 + \frac12 - \frac1n - \frac{1}{n + 1}\right),$$ qui tend vers \(\frac34\). Contrôle \(n = 3\) : \(\frac13 + \frac18 = \frac{11}{24}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier la partie entière quand \(\deg P \ge \deg Q\) ; appliquer le cache à un pôle double (il ne donne que le coefficient de \(\frac{1}{(X - a)^2}\)) ; écrire un numérateur constant au-dessus d'un facteur irréductible de degré 2 (il faut \(bX + c\)). Toujours contrôler en réduisant au même dénominateur, ou en comparant les valeurs en un point.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Fonctions symétriques, PGCD, interpolation de Lagrange</h2>
  <div class="intro">Les résultats suivants sont classiques et apparaissent parfois dans des énoncés, qui les redémontrent alors ; ils ne sont pas exigibles en PTSI ni en PT.</div>
  <ul>
    <li><strong>Fonctions symétriques élémentaires.</strong> Pour \(P = a_n\prod_{i=1}^{n} (X - x_i)\), on pose \(\sigma_1 = \sum_i x_i\), \(\sigma_2 = \sum_{i \lt j} x_ix_j\), …, \(\sigma_n = x_1\cdots x_n\) ; alors \(a_{n-k} = (-1)^k a_n \sigma_k\) (relations de Viète, dont la somme et le produit du §6 sont les cas \(k = 1\) et \(k = n\)). Exemple : \(\sum x_i^2 = \sigma_1^2 - 2\sigma_2\) ; pour \(X^3 - 6X^2 + 11X - 6\), de racines 1, 2, 3, on trouve \(36 - 22 = 14 = 1 + 4 + 9\).</li>
    <li><strong>PGCD, Bézout, Gauss dans \(\mathbb K[X]\).</strong> Comme pour les entiers (chapitre <a href="#calculs/cours">« Calculs algébriques »</a>, fin), l'algorithme d'Euclide fournit un PGCD unitaire \(D\) de \(A\) et \(B\), et des polynômes \(U\), \(V\) tels que \(AU + BV = D\) ; si \(A \mid BC\) et \(\operatorname{pgcd}(A, B) = 1\), alors \(A \mid C\). Dans \(\mathbb C[X]\), \(A\) et \(B\) sont premiers entre eux si et seulement s'ils n'ont pas de racine commune.</li>
    <li><strong>Interpolation de Lagrange.</strong> Pour \(x_0, \ldots, x_n\) distincts et \(y_0, \ldots, y_n\) quelconques, il existe un unique \(P \in \mathbb K_n[X]\) tel que \(P(x_i) = y_i\) pour tout \(i\) : \(P = \sum_i y_i L_i\) avec \(L_i = \prod_{j \neq i} \frac{X - x_j}{x_i - x_j}\). L'exemple du §5 (\(0 \mapsto 1\), \(1 \mapsto 2\), \(2 \mapsto 5\)) redonne \(\frac{(X - 1)(X - 2)}{2} - 2X(X - 2) + \frac{5X(X - 1)}{2} = X^2 + 1\).</li>
    <li><strong>Décomposition générale.</strong> Avec des pôles multiples, chaque facteur \((X - a)^m\) du dénominateur donne \(m\) termes \(\frac{\lambda_1}{X - a} + \cdots + \frac{\lambda_m}{(X - a)^m}\), et chaque facteur \((X^2 + pX + q)^m\) irréductible, \(m\) termes \(\frac{b_kX + c_k}{(X^2 + pX + q)^k}\).</li>
    <li><strong>Polynômes d'endomorphisme</strong> (\(P(u) = \sum a_k u^k\)) : hors programme en PTSI comme en PT. En 2ᵉ année, on utilise seulement le polynôme caractéristique d'une matrice (chapitre <a href="#reduction/cours">« Réduction »</a>).</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · POLYNÔMES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix gestes qui reviennent dans tous les exercices sur les polynômes : calculer des coefficients, raisonner sur le degré, diviser, trouver un reste sans diviser, évaluer par Horner, lire une multiplicité, compter les racines, factoriser dans \(\mathbb C[X]\) et \(\mathbb R[X]\), utiliser la somme et le produit des racines, décomposer une fraction rationnelle.</div>

  <div class="method-box"><strong>Méthode 1 — Calculer un coefficient, identifier des coefficients</strong>
    <ol>
      <li>Coefficient de \(X^k\) dans un produit : ne pas tout développer ; sommer les produits \(a_ib_j\) avec \(i + j = k\).</li>
      <li>Coefficient de \(X^k\) dans \((X + a)^n\) : \(\binom nk a^{n-k}\) (binôme).</li>
      <li>Pour trouver des coefficients inconnus, développer les deux membres et identifier coefficient par coefficient ; il y a autant d'équations que de puissances de \(X\) (vérifier qu'elles sont toutes compatibles).</li>
    </ol>
    <p><em>Exemple éclair :</em> coefficient de \(X^3\) dans \((1 + X)^4(1 - X)^2\). Avec \((1 + X)^4 = 1 + 4X + 6X^2 + 4X^3 + X^4\) et \((1 - X)^2 = 1 - 2X + X^2\) : \(4 \times 1 + 6 \times (-2) + 4 \times 1 = -4\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Raisonner sur le degré</strong>
    <ol>
      <li>Comparer les degrés des deux membres d'une égalité : on obtient le degré du polynôme cherché (ou une impossibilité).</li>
      <li>Comparer ensuite les coefficients dominants, puis écrire le polynôme avec des coefficients inconnus et identifier.</li>
      <li>Ne pas oublier le cas du polynôme nul (degré \(-\infty\)) et des constantes, que l'argument de degré peut exclure à tort.</li>
    </ol>
    <p><em>Exemple éclair :</em> trouver les \(P \in \mathbb R[X]\) tels que \(P(X + 1) - P(X) = 2X + 1\). Si \(\deg P = n \ge 1\), le membre de gauche est de degré \(n - 1\), donc \(n = 2\) ; un polynôme constant donnerait 0. Avec \(P = aX^2 + bX + c\) : \(2aX + a + b = 2X + 1\), d'où \(a = 1\), \(b = 0\). Solutions : \(P = X^2 + c\), \(c \in \mathbb R\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Poser une division euclidienne</strong>
    <ol>
      <li>Écrire \(A\) et \(B\) par puissances décroissantes, en réservant un coefficient nul aux puissances absentes.</li>
      <li>Diviser le terme dominant du reste courant par celui de \(B\) : c'est le terme suivant du quotient ; retrancher son produit par \(B\).</li>
      <li>S'arrêter dès que le reste est de degré strictement inférieur à \(\deg B\) ; contrôler en évaluant \(A = BQ + R\) en un point.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(X^4 + 1\) divisé par \(X^2 + X + 1\) : \(X^4 + 1 = (X^2 + X + 1)(X^2 - X) + X + 1\). Contrôle en \(X = 1\) : \(2 = 3 \times 0 + 2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le quotient et le reste sont uniques ; si une « vérification » donne \(A = BQ + R\) avec \(\deg R \ge \deg B\), la division n'est pas finie.</div>

  <div class="method-box"><strong>Méthode 4 — Trouver un reste sans poser la division</strong>
    <ol>
      <li>Écrire \(A = BQ + R\) avec \(R\) de degré \(\lt \deg B\) à coefficients inconnus (\(R = \alpha X + \beta\) si \(\deg B = 2\)).</li>
      <li>Évaluer en chaque racine \(a\) de \(B\) : \(A(a) = R(a)\), puisque \(B(a) = 0\).</li>
      <li>Racine double \(a\) de \(B\) : dériver la relation, \(A' = B'Q + BQ' + R'\), et évaluer en \(a\) : \(A'(a) = R'(a)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> reste de \(X^n\) dans la division par \((X - 1)^2\) : \(R = \alpha X + \beta\) avec \(R(1) = 1\) et \(R'(1) = n\), donc \(R = nX + 1 - n\). Contrôle \(n = 3\) : \(X^3 = (X - 1)^2(X + 2) + 3X - 2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Évaluer par Horner et factoriser par une racine connue</strong>
    <ol>
      <li>Écrire les coefficients par puissances décroissantes (zéros compris).</li>
      <li>Abaisser le premier ; puis, de proche en proche, multiplier par \(a\) et ajouter le coefficient suivant.</li>
      <li>Le dernier nombre est \(P(a)\) ; s'il est nul, les précédents sont les coefficients du quotient \(Q\) tel que \(P = (X - a)Q\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(P = X^3 - 4X^2 + X + 6\) en \(a = 2\) : \(1\), \(1 \times 2 - 4 = -2\), \(-2 \times 2 + 1 = -3\), \(-3 \times 2 + 6 = 0\). Donc \(P = (X - 2)(X^2 - 2X - 3) = (X - 2)(X - 3)(X + 1)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Déterminer la multiplicité d'une racine</strong>
    <ol>
      <li>Calculer \(P(a), P'(a), P''(a), \ldots\) jusqu'à la première valeur non nulle, \(P^{(m)}(a)\) : la multiplicité est \(m\).</li>
      <li>Ou bien factoriser : \(P = (X - a)^m Q\) avec \(Q(a) \neq 0\).</li>
      <li>Pour imposer une racine double (ou d'ordre \(m\)) à un polynôme à paramètres, écrire les \(m\) équations \(P^{(k)}(a) = 0\), \(k \lt m\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(P = X^5 - X^4 - X + 1\) en 1 : \(P(1) = 0\), \(P' = 5X^4 - 4X^3 - 1\) donne \(P'(1) = 0\), \(P'' = 20X^3 - 12X^2\) donne \(P''(1) = 8 \neq 0\) : racine double. En effet \(P = (X - 1)(X^4 - 1) = (X - 1)^2(X + 1)(X^2 + 1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « \(P(a) = P'(a) = 0\) » donne une multiplicité au moins 2, pas exactement 2.</div>

  <div class="method-box"><strong>Méthode 7 — Montrer qu'un polynôme est nul, constant, ou déterminé</strong>
    <ol>
      <li>Compter ses racines : plus de racines distinctes que son degré, ou une infinité, impose \(P = 0\).</li>
      <li>Appliquer ce principe à une différence \(P - Q\), ou à \(P - c\) pour une constante \(c\).</li>
      <li>Une égalité de fonctions polynomiales sur un intervalle donne une égalité de polynômes : on peut alors identifier les coefficients.</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(P(x) = P(-x)\) pour tout réel \(x\), alors \(P(X) - P(-X)\) a une infinité de racines, donc est nul : en identifiant, les coefficients des puissances impaires de \(P\) sont nuls (\(P\) est « pair »).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Factoriser dans \(\mathbb C[X]\) puis dans \(\mathbb R[X]\)</strong>
    <ol>
      <li>Chercher les racines : racines évidentes, racines \(n\)-ièmes (\(X^n - a\)), équation bicarrée (\(Y = X^2\)), identité remarquable (\(A^2 - B^2\)).</li>
      <li>Écrire la factorisation dans \(\mathbb C[X]\) avec le coefficient dominant et les multiplicités.</li>
      <li>Dans \(\mathbb R[X]\), regrouper chaque racine non réelle \(z\) avec \(\overline z\) : \((X - z)(X - \overline z) = X^2 - 2\operatorname{Re}(z)X + |z|^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(X^4 + X^2 + 1 = (X^2 + 1)^2 - X^2 = (X^2 - X + 1)(X^2 + X + 1)\), deux facteurs de discriminant \(-3\) ; dans \(\mathbb C[X]\), \(X^2 + X + 1 = (X - j)(X - j^2)\) et \(X^2 - X + 1 = (X + j)(X + j^2)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Utiliser la somme et le produit des racines</strong>
    <ol>
      <li>Vérifier que le polynôme est scindé (toujours vrai dans \(\mathbb C\)) et lire \(a_n\), \(a_{n-1}\), \(a_0\).</li>
      <li>Somme \(= -\frac{a_{n-1}}{a_n}\), produit \(= (-1)^n \frac{a_0}{a_n}\) ; en degré 2, deux nombres de somme \(s\) et de produit \(p\) sont les racines de \(X^2 - sX + p\).</li>
      <li>Une racine connue donne les autres : connaissant \(x_1\), le produit (ou la somme) donne ce qui reste.</li>
    </ol>
    <p><em>Exemple éclair :</em> un polynôme unitaire de degré 2 de racines \(1 \pm \sqrt3\) : somme 2, produit \(1 - 3 = -2\), donc \(X^2 - 2X - 2\). Et \(3X^2 - 7X + 2\) a la racine 2 ; le produit \(\frac23\) donne l'autre racine \(\frac13\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Décomposer en éléments simples et s'en servir</strong>
    <ol>
      <li>Si \(\deg P \ge \deg Q\), diviser pour obtenir la partie entière.</li>
      <li>Factoriser \(Q\) ; pour chaque pôle simple \(a\), \(\lambda = \frac{P(a)}{Q'(a)}\), ou la valeur en \(a\) de \((X - a)F\) simplifiée (cache).</li>
      <li>Si la forme est fournie (pôle double, facteur de degré 2) : cache pour les pôles simples, puis valeurs particulières (\(x = 0\)…), limite de \(xF(x)\) en \(+\infty\), ou identification.</li>
      <li>Contrôler en réduisant au même dénominateur ou en un point ; puis intégrer (\(\ln|x - a|\)), dériver \(n\) fois, ou télescoper.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\frac{2X + 1}{X^2 - X - 2} = \frac{2X + 1}{(X - 2)(X + 1)} = \frac{5/3}{X - 2} + \frac{1/3}{X + 1}\) (\(\frac{5}{3}\) et \(\frac{-1}{-3}\) par le cache). Sur \(]2, +\infty[\), une primitive est \(\frac53\ln(x - 2) + \frac13\ln(x + 1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le cache ne vaut que pour un pôle simple ; pour un pôle double \(a\), il ne donne que le coefficient de \(\frac{1}{(X - a)^2}\). Quant à la limite de \(xF(x)\) en \(+\infty\), elle n'est finie que si la partie entière est nulle ; elle vaut alors la somme des coefficients \(\lambda\) des termes \(\frac{\lambda}{X - a}\) et des coefficients \(b\) des termes \(\frac{bX + c}{X^2 + pX + q}\).</div>
</div>
</template>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Division euclidienne et racines</h3>
  <div class="statement">Soit \(P = X^3 - 6X^2 + 11X - 6\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(1, 2, 3\) sont racines. En déduire la factorisation complète de \(P\).</div>
  <div class="q"><strong>Q2.</strong> Retrouver la somme et le produit des racines à partir des coefficients.</div>
  <div class="q"><strong>Q3.</strong> Sans calculer les racines \(x_1\), \(x_2\) de \(X^2 - 4X + 1\), calculer \(x_1^2 + x_2^2\) et \(\frac{1}{x_1} + \frac{1}{x_2}\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer le réel \(a\) pour que 1 soit racine de \(X^3 - 7X^2 + aX - 8\), puis factoriser ce polynôme. Que remarque-t-on sur ses racines ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(P(1) = 1-6+11-6=0\), \(P(2)=8-24+22-6=0\), \(P(3)=27-54+33-6=0\). Les trois racines sont distinctes, donc \((X-1)(X-2)(X-3)\) divise \(P\) (cours, §4) ; les deux polynômes sont unitaires de degré 3 : \(P = (X-1)(X-2)(X-3)\). Vérification : \((X-1)(X-2) = X^2-3X+2\), puis $$(X^2-3X+2)(X-3) = X^3-6X^2+11X-6 .$$</p>
    <p><strong>Q2.</strong> Somme : \(1 + 2 + 3 = 6 = -\frac{-6}{1}\). Produit : \(6 = (-1)^3 \times \frac{-6}{1}\). (Pour aller plus loin, hors programme : la somme des produits deux à deux, \(2 + 3 + 6 = 11\), est le coefficient de \(X\).)</p>
    <p><strong>Q3.</strong> \(x_1 + x_2 = 4\) et \(x_1x_2 = 1\). Donc $$x_1^2 + x_2^2 = (x_1 + x_2)^2 - 2x_1x_2 = 16 - 2 = 14 ,$$ et \(\frac{1}{x_1} + \frac{1}{x_2} = \frac{x_1 + x_2}{x_1x_2} = 4\). Contrôle avec les racines \(2 \pm \sqrt3\) : \((2 + \sqrt3)^2 + (2 - \sqrt3)^2 = 2(4 + 3) = 14\).</p>
    <p><strong>Q4.</strong> \(1 - 7 + a - 8 = 0\) donne \(a = 14\). Horner en 1 sur \(1, -7, 14, -8\) : \(1, -6, 8\) et le reste 0, d'où $$X^3 - 7X^2 + 14X - 8 = (X - 1)(X^2 - 6X + 8) = (X - 1)(X - 2)(X - 4) .$$ Les racines 1, 2, 4 sont en progression géométrique de raison 2 ; contrôle : somme \(7\), produit \(8 = (-1)^3 \times (-8)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Multiplicité et factorisation</h3>
  <div class="statement">Soit \(P = X^4 - 4X^3 + 6X^2 - 4X + 1\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(1\) est racine de \(P\). Calculer \(P'(1)\), \(P''(1)\), \(P'''(1)\).</div>
  <div class="q"><strong>Q2.</strong> En déduire la multiplicité de \(1\) et la factorisation de \(P\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(P(1) = 1-4+6-4+1 = 0\). \(P' = 4X^3-12X^2+12X-4\), \(P'(1) = 0\). \(P'' = 12X^2-24X+12\), \(P''(1) = 0\). \(P''' = 24X-24\), \(P'''(1) = 0\). Enfin \(P^{(4)} = 24 \neq 0\).</p>
    <p><strong>Q2.</strong> La première dérivée non nulle en 1 est la quatrième : 1 est racine de multiplicité 4 (cours, §8). Comme \(\deg P = 4\) et \(P\) est unitaire, \(P = (X-1)^4\), ce que confirme la formule du binôme.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Décomposition en éléments simples</h3>
  <div class="statement">Décomposer en éléments simples sur \(\mathbb{R}\) :</div>
  <div class="q"><strong>Q1.</strong> \(F_1 = \dfrac{1}{X^2 - 1}\)</div>
  <div class="q"><strong>Q2.</strong> \(F_2 = \dfrac{X}{(X-1)(X+2)}\)</div>
  <div class="q"><strong>Q3.</strong> En déduire \(\displaystyle\int_2^3 \dfrac{x}{(x-1)(x+2)}\,\mathrm{d}x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Deux pôles simples : \(F_1 = \dfrac{A}{X-1}+\dfrac{B}{X+1}\). Par le cache, \(A\) est la valeur en 1 de \((X - 1)F_1 = \frac{1}{X + 1}\), soit \(\frac12\), et \(B\) la valeur en \(-1\) de \((X + 1)F_1 = \frac{1}{X - 1}\), soit \(-\frac12\). Donc \(F_1 = \dfrac{1/2}{X-1} - \dfrac{1/2}{X+1}\).</p>
    <p><strong>Q2.</strong> \(F_2 = \dfrac{A}{X-1}+\dfrac{B}{X+2}\) avec \(A = \frac{1}{1+2} = \frac{1}{3}\) et \(B = \frac{-2}{-2-1} = \frac{2}{3}\) : \(F_2 = \dfrac{1/3}{X-1} + \dfrac{2/3}{X+2}\). Vérification : $$\dfrac{(X+2)+2(X-1)}{3(X-1)(X+2)} = \dfrac{3X}{3(X-1)(X+2)} = F_2 .$$</p>
    <p><strong>Q3.</strong> Sur \([2, 3]\), on intègre la décomposition obtenue en Q2 :</p>
    <div class="formula">$$\int_2^3 F_2(x)\,\mathrm{d}x = \left[\frac{1}{3}\ln|x-1| + \frac{2}{3}\ln|x+2|\right]_2^3 = \frac{1}{3}\ln 2 + \frac{2}{3}\ln 5 - \frac{1}{3}\ln 1 - \frac{2}{3}\ln 4$$</div>
    <div class="formula">$$= \frac{\ln 2}{3} + \frac{2\ln 5}{3} - \frac{4\ln 2}{3} = \frac{2\ln 5 - 3\ln 2}{3} = \frac{1}{3}\ln\frac{25}{8} \approx 0{,}380 .$$</div>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Factorisation dans \(\mathbb{C}[X]\) et \(\mathbb{R}[X]\)</h3>
  <div class="statement">Factoriser \(P = X^4 + 4\) sur \(\mathbb{C}\) puis sur \(\mathbb{R}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p>Racines : \(z^4 = -4 = 4e^{i\pi}\). Les racines quatrièmes sont \(z_k = \sqrt{2}\,e^{i(\pi+2k\pi)/4}\) pour \(k=0,1,2,3\) :</p>
    <p>\(z_0 = \sqrt{2}e^{i\pi/4} = 1+i\), \(z_1 = \sqrt{2}e^{3i\pi/4} = -1+i\), \(z_2 = -1-i\), \(z_3 = 1-i\).</p>
    <p><strong>Sur \(\mathbb{C}\) :</strong> $$P = \big(X-(1+i)\big)\big(X-(-1+i)\big)\big(X-(-1-i)\big)\big(X-(1-i)\big).$$</p>
    <p><strong>Sur \(\mathbb{R}\) :</strong> on regroupe les paires conjuguées : $$\begin{aligned} \big(X-(1+i)\big)\big(X-(1-i)\big) &= X^2 - 2X + 2, \\ \big(X-(-1+i)\big)\big(X-(-1-i)\big) &= X^2 + 2X + 2. \end{aligned}$$ Donc \(P = (X^2-2X+2)(X^2+2X+2)\), deux facteurs de discriminant \(-4\), irréductibles. Vérification : \((X^2+2)^2-(2X)^2 = X^4+4\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Décomposition avec un pôle double (forme donnée) et intégrale</h3>
  <div class="statement">Soit \(F = \dfrac{X+2}{(X-1)^2(X+1)}\). On admet qu'il existe des réels \(A\), \(B\), \(C\) tels que \(F = \dfrac{A}{X-1} + \dfrac{B}{(X-1)^2} + \dfrac{C}{X+1}\) (forme fournie, comme le veut le programme pour un pôle double).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(A\), \(B\), \(C\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(T \gt 2\), calculer \(I(T) = \displaystyle\int_2^{T} F(x)\,\mathrm{d}x\), puis la limite de \(I(T)\) quand \(T \to +\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(B\) est la valeur en 1 de \((X-1)^2 F = \frac{X + 2}{X + 1}\) : \(B = \frac{3}{2}\). \(C\) est la valeur en \(-1\) de \((X+1)F = \frac{X + 2}{(X - 1)^2}\) : \(C = \frac{1}{4}\). Pour \(A\), on évalue en \(X = 0\) : \(F(0) = 2 = -A + B + C\), donc \(A = \frac32 + \frac14 - 2 = -\frac14\). (Contrôle par la limite de \(xF(x)\) en \(+\infty\), qui vaut 0 : \(A + C = 0\).)</p>
    <p>\(F = \dfrac{-1/4}{X-1} + \dfrac{3/2}{(X-1)^2} + \dfrac{1/4}{X+1}\).</p>
    <p><strong>Q2.</strong> Sur \(]1, +\infty[\), une primitive de \(F\) est $$G(x) = -\frac{1}{4}\ln(x-1) - \frac{3}{2(x-1)} + \frac{1}{4}\ln(x+1) = \frac14 \ln\frac{x+1}{x-1} - \frac{3}{2(x-1)} .$$ Donc $$I(T) = G(T) - G(2) = \frac14 \ln\frac{T+1}{T-1} - \frac{3}{2(T-1)} + \frac32 - \frac{\ln 3}{4} .$$ Quand \(T \to +\infty\), \(\frac{T+1}{T-1} \to 1\) et \(\frac{3}{2(T-1)} \to 0\), donc \(I(T) \to \frac{3}{2} - \frac{\ln3}{4} \approx 1{,}225\). (En 2ᵉ année, cette limite sera notée \(\int_2^{+\infty} F(x)\,\mathrm dx\) : intégrale généralisée.)</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Arguments de degré et identification</h3>
  <div class="statement">Dans chaque question, on cherche tous les polynômes réels qui conviennent : raisonner d'abord sur le degré (sans oublier le polynôme nul), puis identifier.</div>
  <div class="q"><strong>Q1.</strong> Déterminer les \(P \in \mathbb R[X]\) tels que \(P(X^2) = (X^2 + 1)\,P(X)\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les \(P \in \mathbb R[X]\) tels que \((P')^2 = 4P\).</div>
  <div class="q"><strong>Q3.</strong> Existe-t-il un polynôme \(P\) tel que \(P \circ P = X^2 + 1\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> <em>Analyse.</em> \(P = 0\) convient. Si \(P \neq 0\) est de degré \(n\), le membre de gauche est de degré \(2n\) et celui de droite de degré \(n + 2\) : \(n = 2\). Écrivons \(P = aX^2 + bX + c\) ; alors \(P(X^2) = aX^4 + bX^2 + c\) et $$(X^2 + 1)P = aX^4 + bX^3 + (a + c)X^2 + bX + c .$$ Par identification : \(b = 0\) (coefficients de \(X^3\) et de \(X\)) et \(b = a + c\) (coefficient de \(X^2\)), donc \(c = -a\) : \(P = a(X^2 - 1)\). <em>Synthèse.</em> \(a(X^4 - 1) = (X^2 + 1)\,a(X^2 - 1)\). Les solutions sont les \(a(X^2 - 1)\), \(a \in \mathbb R\) (le polynôme nul compris, pour \(a = 0\)).</p>
    <p><strong>Q2.</strong> Le polynôme nul convient ; une constante \(c \neq 0\) non (\(0 = 4c\)). Si \(\deg P = n \ge 1\), alors \(2(n - 1) = n\), donc \(n = 2\). Avec \(P = aX^2 + bX + c\), \(a \neq 0\) : \((2aX + b)^2 = 4a^2X^2 + 4abX + b^2\) doit valoir \(4aX^2 + 4bX + 4c\) ; d'où \(a^2 = a\), soit \(a = 1\), puis \(4b = 4b\) et \(c = \frac{b^2}{4}\). Donc \(P = X^2 + bX + \frac{b^2}{4} = \left(X + \frac b2\right)^2\). Réciproquement, \(P = (X + \alpha)^2\) donne \((P')^2 = 4(X + \alpha)^2 = 4P\). Solutions : \(0\) et les \((X + \alpha)^2\), \(\alpha \in \mathbb R\).</p>
    <p><strong>Q3.</strong> Non. \(P\) ne peut pas être constant (\(P \circ P\) le serait), donc \(\deg P = n \ge 1\) et \(\deg(P \circ P) = n^2\) (cours, §2). Or \(n^2 = 2\) n'a pas de solution entière.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Restes de divisions et divisibilité</h3>
  <div class="statement">On cherche des restes sans poser les divisions (méthode 4), en évaluant aux racines du diviseur, réelles ou complexes.</div>
  <div class="q"><strong>Q1.</strong> Pour \(n \in \mathbb N\), déterminer le reste de la division de \(X^n + X + 1\) par \(X^2 - 1\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(n \ge 1\), montrer que \((X - 1)^2\) divise \(P_n = nX^{n+1} - (n + 1)X^n + 1\). Donner le quotient pour \(n = 2\).</div>
  <div class="q"><strong>Q3.</strong> Pour quels réels \(a\) le polynôme \(X^2 + X + 1\) divise-t-il \(X^4 + aX^2 + 1\) ?</div>
  <div class="q"><strong>Q4.</strong> Pour \(n \in \mathbb N\), déterminer le reste de la division de \((X + 1)^n\) par \(X^2 + 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(X^n + X + 1 = (X^2 - 1)Q + \alpha X + \beta\). En 1 : \(3 = \alpha + \beta\) ; en \(-1\) : \((-1)^n = -\alpha + \beta\). Si \(n\) est pair, \(\beta = 2\), \(\alpha = 1\) : reste \(X + 2\). Si \(n\) est impair, \(\beta = 1\), \(\alpha = 2\) : reste \(2X + 1\). Contrôle \(n = 2\) : \(X^2 + X + 1 = (X^2 - 1) + X + 2\).</p>
    <p><strong>Q2.</strong> \(P_n(1) = n - (n + 1) + 1 = 0\) et \(P_n' = n(n + 1)X^n - n(n + 1)X^{n-1}\), donc \(P_n'(1) = 0\) : 1 est racine au moins double, et \((X - 1)^2 \mid P_n\). Pour \(n = 2\) : \(2X^3 - 3X^2 + 1 = (X - 1)^2(2X + 1)\) (le coefficient dominant 2 et le terme constant 1 fixent le quotient \(2X + 1\)).</p>
    <p><strong>Q3.</strong> \(X^2 + X + 1 = (X - j)(X - j^2)\) avec \(j = e^{2i\pi/3}\) : il divise \(A = X^4 + aX^2 + 1\) si et seulement si \(j\) et \(j^2\) sont racines de \(A\) (racines distinctes, cours §4). Comme \(A\) est réel et \(j^2 = \overline j\), il suffit que \(j\) le soit. Avec \(j^3 = 1\) et \(1 + j + j^2 = 0\) : \(A(j) = j + aj^2 + 1 = -j^2 + aj^2 = (a - 1)j^2\), nul si et seulement si \(a = 1\). Alors \(X^4 + X^2 + 1 = (X^2 + X + 1)(X^2 - X + 1)\).</p>
    <p><strong>Q4.</strong> \((X + 1)^n = (X^2 + 1)Q + \alpha X + \beta\) avec \(\alpha, \beta\) réels. En \(i\) : \(\alpha i + \beta = (1 + i)^n = 2^{n/2}e^{in\pi/4}\). En identifiant parties réelle et imaginaire (\(\alpha\), \(\beta\) réels), le reste est $$R = 2^{n/2}\sin\frac{n\pi}{4}\,X + 2^{n/2}\cos\frac{n\pi}{4} .$$ Contrôle \(n = 2\) : \((X + 1)^2 = (X^2 + 1) + 2X\), et la formule donne \(2X + 0\). Pour \(n = 4\) : \(R = -4\), et en effet \((1 + i)^4 = (2i)^2 = -4\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ☆ ☆</span>
  <h3>Méthode de Horner et programmation</h3>
  <div class="statement">Soit \(P = 3X^4 - 2X^3 + X - 5\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(P(2)\) et \(P(-1)\) par la méthode de Horner. Combien de multiplications sont nécessaires ? Combien en faut-il en calculant chaque puissance séparément ?</div>
  <div class="q"><strong>Q2.</strong> En déduire le quotient et le reste de la division de \(P\) par \(X - 2\).</div>
  <div class="q"><strong>Q3.</strong> Écrire une fonction Python <span class="code-inline">horner_quotient(c, a)</span> qui reçoit la liste \(c\) des coefficients de \(P\) par degrés décroissants et renvoie le couple (liste des coefficients du quotient par \(X - a\), valeur \(P(a)\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Coefficients : \(3, -2, 0, 1, -5\) (ne pas oublier le 0 de \(X^2\)). En 2 : \(3\) ; \(3 \times 2 - 2 = 4\) ; \(4 \times 2 + 0 = 8\) ; \(8 \times 2 + 1 = 17\) ; \(17 \times 2 - 5 = 29\). Donc \(P(2) = 29\) (contrôle : \(48 - 16 + 2 - 5 = 29\)). En \(-1\) : \(3, -5, 5, -4, -1\), donc \(P(-1) = -1\) (contrôle : \(3 + 2 - 1 - 5 = -1\)). Horner fait 4 multiplications (le degré) ; en calculant \(x, x^2, x^3, x^4\) séparément puis en multipliant par les coefficients, il en faut \(0 + 1 + 2 + 3\) pour les puissances et 4 pour les coefficients, soit 10. Pour un degré \(n\) : \(n\) contre environ \(\frac{n^2}{2}\).</p>
    <p><strong>Q2.</strong> Les nombres intermédiaires sont les coefficients du quotient : \(P = (X - 2)(3X^3 + 4X^2 + 8X + 17) + 29\).</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> horner_quotient(c, a):
    q = [c[0]]
    <span class="kw">for</span> x <span class="kw">in</span> c[1:]:
        q.append(q[-1] * a + x)
    <span class="kw">return</span> q[:-1], q[-1]</pre>
    <p><span class="code-inline">horner_quotient([3, -2, 0, 1, -5], 2)</span> renvoie <span class="code-inline">([3, 4, 8, 17], 29)</span>. La liste <span class="code-inline">q</span> contient les nombres de la seconde ligne du tableau de Horner ; le dernier est la valeur, les autres le quotient.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Racines de l'unité : un produit de sinus et \(\cos\frac{2\pi}{5}\)</h3>
  <div class="statement">Soit \(n \ge 2\) et \(\omega = e^{2i\pi/n}\). On rappelle que \(X^n - 1 = \prod_{k=0}^{n-1}(X - \omega^k)\) (cours, §9).</div>
  <div class="q"><strong>Q1.</strong> Factoriser \(X^5 - 1\) dans \(\mathbb R[X]\), à l'aide de \(\cos\frac{2\pi}{5}\) et \(\cos\frac{4\pi}{5}\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\prod_{k=1}^{n-1}(X - \omega^k) = 1 + X + \cdots + X^{n-1}\), puis que \(\prod_{k=1}^{n-1}(1 - \omega^k) = n\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(|1 - e^{i\theta}| = 2\left|\sin\frac\theta2\right|\) pour tout réel \(\theta\). En déduire \(\prod_{k=1}^{n-1}\sin\frac{k\pi}{n} = \frac{n}{2^{n-1}}\), et le vérifier pour \(n = 4\).</div>
  <div class="q"><strong>Q4.</strong> On pose \(z = e^{2i\pi/5}\) et \(y = z + \frac1z\). Montrer que \(y^2 + y - 1 = 0\), et en déduire \(\cos\frac{2\pi}{5}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les racines sont 1 et les paires conjuguées \((\omega, \omega^4)\), \((\omega^2, \omega^3)\) avec \(\omega = e^{2i\pi/5}\). Chaque paire donne \(X^2 - 2\operatorname{Re}(\omega^k)X + 1\) :
    $$X^5 - 1 = (X - 1)\left(X^2 - 2\cos\frac{2\pi}{5}\,X + 1\right)\left(X^2 - 2\cos\frac{4\pi}{5}\,X + 1\right).$$</p>
    <p><strong>Q2.</strong> \(X^n - 1 = (X - 1)(1 + X + \cdots + X^{n-1})\) (factorisation de \(a^n - b^n\)), et aussi \(X^n - 1 = (X - 1)\prod_{k=1}^{n-1}(X - \omega^k)\). On simplifie par \(X - 1 \neq 0\) (cours, §2) : les deux produits sont égaux. En évaluant en 1 : \(\prod_{k=1}^{n-1}(1 - \omega^k) = 1 + 1 + \cdots + 1 = n\).</p>
    <p><strong>Q3.</strong> $$1 - e^{i\theta} = e^{i\theta/2}\big(e^{-i\theta/2} - e^{i\theta/2}\big) = -2i\sin\frac\theta2\,e^{i\theta/2} ,$$ de module \(2\left|\sin\frac\theta2\right|\). Avec \(\theta = \frac{2k\pi}{n}\), \(1 \le k \le n - 1\), on a \(\frac{k\pi}{n} \in\, ]0, \pi[\), donc \(|1 - \omega^k| = 2\sin\frac{k\pi}{n}\). En prenant le module dans Q2 : \(\prod_{k=1}^{n-1} 2\sin\frac{k\pi}{n} = n\), soit \(\prod_{k=1}^{n-1}\sin\frac{k\pi}{n} = \frac{n}{2^{n-1}}\). Pour \(n = 4\) : \(\frac{\sqrt2}{2} \times 1 \times \frac{\sqrt2}{2} = \frac12 = \frac{4}{8}\).</p>
    <p><strong>Q4.</strong> \(z \neq 1\) et \(z^5 = 1\), donc \(1 + z + z^2 + z^3 + z^4 = 0\) (Q2). En divisant par \(z^2\) : \(z^2 + z + 1 + \frac1z + \frac{1}{z^2} = 0\). Or \(y^2 = z^2 + 2 + \frac{1}{z^2}\), donc \(y^2 + y - 1 = 0\). Comme \(\frac1z = \overline z\), \(y = 2\operatorname{Re}(z) = 2\cos\frac{2\pi}{5} \gt 0\) ; c'est la racine positive \(\frac{-1 + \sqrt5}{2}\). Donc $$\cos\frac{2\pi}{5} = \frac{\sqrt5 - 1}{4} \approx 0{,}309 .$$</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Éléments simples : somme télescopique, dérivées \(n\)-ièmes, intégrales</h3>
  <div class="statement">Soit \(F = \dfrac{1}{X(X + 1)(X + 2)}\) et \(f\) la fonction \(x \mapsto F(x)\) sur \(]0, +\infty[\).</div>
  <div class="q"><strong>Q1.</strong> Décomposer \(F\) en éléments simples.</div>
  <div class="q"><strong>Q2.</strong> Pour \(n \ge 1\), calculer \(S_n = \sum_{k=1}^{n} \frac{1}{k(k + 1)(k + 2)}\) et sa limite.</div>
  <div class="q"><strong>Q3.</strong> Donner \(f^{(n)}(x)\) pour \(n \in \mathbb N\) et \(x \gt 0\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(\displaystyle\int_1^2 f(x)\,\mathrm dx\).</div>
  <div class="q"><strong>Q5.</strong> On admet qu'il existe des réels \(a\), \(b\), \(c\) tels que \(\dfrac{X}{(X + 1)(X^2 + 1)} = \dfrac{a}{X + 1} + \dfrac{bX + c}{X^2 + 1}\). Les calculer, puis calculer \(\displaystyle\int_0^1 \frac{x}{(x + 1)(x^2 + 1)}\,\mathrm dx\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Trois pôles simples \(0\), \(-1\), \(-2\). Par le cache : en 0, \(\frac{1}{(0 + 1)(0 + 2)} = \frac12\) ; en \(-1\), \(\frac{1}{(-1)(1)} = -1\) ; en \(-2\), \(\frac{1}{(-2)(-1)} = \frac12\). Donc $$F = \frac{1/2}{X} - \frac{1}{X + 1} + \frac{1/2}{X + 2} .$$ Contrôle en \(X = 1\) : \(\frac12 - \frac12 + \frac16 = \frac16 = \frac{1}{1 \times 2 \times 3}\).</p>
    <p><strong>Q2.</strong> Écrivons le terme général \(\frac12\left(\frac1k - \frac{1}{k + 1}\right) - \frac12\left(\frac{1}{k + 1} - \frac{1}{k + 2}\right)\) : deux sommes télescopiques. $$S_n = \frac12\left(1 - \frac{1}{n + 1}\right) - \frac12\left(\frac12 - \frac{1}{n + 2}\right) = \frac14 - \frac{1}{2(n + 1)(n + 2)} ,$$ qui tend vers \(\frac14\). Contrôle \(n = 2\) : \(\frac16 + \frac{1}{24} = \frac{5}{24}\) et \(\frac14 - \frac{1}{24} = \frac{5}{24}\).</p>
    <p><strong>Q3.</strong> Avec \(\left(\frac{1}{x - a}\right)^{(n)} = \frac{(-1)^n n!}{(x - a)^{n+1}}\) : $$f^{(n)}(x) = (-1)^n\, n!\left(\frac{1}{2x^{n+1}} - \frac{1}{(x + 1)^{n+1}} + \frac{1}{2(x + 2)^{n+1}}\right) .$$</p>
    <p><strong>Q4.</strong> Une primitive sur \(]0, +\infty[\) est \(\frac12\ln x - \ln(x + 1) + \frac12\ln(x + 2)\). Entre 1 et 2 : $$\frac12\ln 2 - \ln\frac32 + \frac12\ln\frac43 = \frac52\ln 2 - \frac32\ln 3 = \frac12\ln\frac{32}{27} \approx 0{,}0849 .$$</p>
    <p><strong>Q5.</strong> Le cache en \(-1\) donne \(a = \frac{-1}{(-1)^2 + 1} = -\frac12\). Puis \(X = a(X^2 + 1) + (bX + c)(X + 1)\) : le coefficient de \(X^2\) donne \(a + b = 0\), le terme constant \(a + c = 0\), d'où \(b = c = \frac12\) ; contrôle sur le coefficient de \(X\) : \(b + c = 1\). Ainsi \(\frac{x}{(x + 1)(x^2 + 1)} = -\frac{1}{2(x + 1)} + \frac{x}{2(x^2 + 1)} + \frac{1}{2(x^2 + 1)}\), et une primitive est \(-\frac12\ln(x + 1) + \frac14\ln(x^2 + 1) + \frac12\arctan x\). Entre 0 et 1 : $$-\frac12\ln 2 + \frac14\ln 2 + \frac\pi8 = \frac\pi8 - \frac{\ln 2}{4} \approx 0{,}2194 .$$</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Relations coefficients-racines — symétrie (hors programme, pour aller plus loin)</h3>
  <div class="statement">Les fonctions symétriques élémentaires des racines (au-delà de leur somme et de leur produit) sont hors programme : cet exercice illustre la fin du chapitre. Soit \(P = X^3 + pX + q\) (\(p, q \in \mathbb{R}\)), scindé dans \(\mathbb C\) de racines \(r_1, r_2, r_3\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(r_1+r_2+r_3\), \(r_1r_2+r_1r_3+r_2r_3\) et \(r_1r_2r_3\) en fonction de \(p\) et \(q\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(r_1^2+r_2^2+r_3^2\) en fonction de \(p\).</div>
  <div class="q"><strong>Q3.</strong> Si \(p = -3\) et \(q = 2\), factoriser \(P\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En développant \((X - r_1)(X - r_2)(X - r_3)\) et en identifiant avec \(X^3 + 0\cdot X^2 + pX + q\) : \(r_1+r_2+r_3 = 0\), \(r_1r_2+r_1r_3+r_2r_3 = p\), \(r_1r_2r_3 = -q\).</p>
    <p><strong>Q2.</strong> $$r_1^2+r_2^2+r_3^2 = (r_1+r_2+r_3)^2 - 2(r_1r_2+r_1r_3+r_2r_3) = 0 - 2p = -2p .$$ Si \(p \gt 0\), cette somme de carrés est négative : les racines ne sont pas toutes réelles.</p>
    <p><strong>Q3.</strong> \(P = X^3 - 3X + 2\), \(P(1) = 0\). Division : $$P = (X-1)(X^2+X-2) = (X-1)^2(X+2) .$$ Contrôle : \(1+1-2 = 0\), \(1 - 2 - 2 = -3 = p\), \(1 \times 1 \times (-2) = -2 = -q\).</p>
  </div>
</div>
