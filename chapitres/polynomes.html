<figcaption>Sur [−1, 1], Tₙ(cos θ) = cos(nθ) oscille entre −1 et 1 (pointillés) et atteint ces valeurs n + 1 fois. Les points rouges sont les cinq racines de T₅, cos((2k + 1)π/10) pour k = 0, …, 4 : plus serrées près de ±1.</figcaption>
</figure>
  <p class="exo-part">Partie A — Premières propriétés</p>
  <div class="q"><strong>A1.</strong> Calculer \(T_2\), \(T_3\), \(T_4\).</div>
  <div class="q"><strong>A2.</strong> Montrer que, pour tout \(n \ge 1\), \(T_n\) est de degré \(n\) et de coefficient dominant \(2^{n-1}\).</div>
  <div class="q"><strong>A3.</strong> Montrer que \(T_n(-X) = (-1)^n\,T_n(X)\) pour tout \(n\). Que vaut \(T_n(1)\) ?</div>
  <p class="exo-part">Partie B — Lien avec le cosinus</p>
  <div class="q"><strong>B1.</strong> Montrer que \(T_n(\cos\theta) = \cos(n\theta)\) pour tout réel \(\theta\) et tout \(n \in \mathbb N\).</div>
  <div class="q"><strong>B2.</strong> Montrer que \(T_n\) est l'unique polynôme \(P\) tel que \(P(\cos\theta) = \cos(n\theta)\) pour tout réel \(\theta\). En déduire que \(|T_n(x)| \le 1\) pour \(x \in [-1, 1]\), et que \(T_n \circ T_m = T_{nm}\).</div>
  <p class="exo-part">Partie C — Racines et factorisation</p>
  <div class="q"><strong>C1.</strong> Soit \(n \ge 1\). Montrer que les réels \(x_k = \cos\frac{(2k + 1)\pi}{2n}\), \(0 \le k \le n - 1\), sont \(n\) racines distinctes de \(T_n\).</div>
  <div class="q"><strong>C2.</strong> En déduire que \(T_n = 2^{n-1}\prod_{k=0}^{n-1}(X - x_k)\) et que \(T_n\) est scindé à racines simples dans \(\mathbb R[X]\).</div>
  <div class="q"><strong>C3.</strong> Calculer \(\sum_{k=0}^{n-1} x_k\) puis, pour \(n\) pair, \(\prod_{k=0}^{n-1}\cos\frac{(2k + 1)\pi}{2n}\). Vérifier pour \(n = 2\) et \(n = 4\).</div>
  <div class="q"><strong>C4.</strong> En dérivant la relation de B1, montrer que \(T_n'(1) = n^2\).</div>
  <p class="exo-part">Partie D — Calcul des coefficients</p>
  <div class="q"><strong>D1.</strong> Écrire une fonction Python <span class="code-inline">tchebychev(n)</span> qui renvoie la liste des coefficients de \(T_n\) par puissances croissantes, à l'aide de la relation de récurrence. Que renvoie <span class="code-inline">tchebychev(5)</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> $$\begin{aligned} T_2 &= 2X^2 - 1, \\ T_3 &= 2X(2X^2 - 1) - X = 4X^3 - 3X, \\ T_4 &= 2X(4X^3 - 3X) - (2X^2 - 1) = 8X^4 - 8X^2 + 1 . \end{aligned}$$</p>
    <p><strong>A2.</strong> Récurrence double sur \(n \ge 1\). \(T_1 = X\) et \(T_2 = 2X^2 - 1\) conviennent. Si \(T_n\) et \(T_{n+1}\) ont les degrés \(n\) et \(n + 1\) et les coefficients dominants \(2^{n-1}\) et \(2^n\), alors \(2X\,T_{n+1}\) est de degré \(n + 2\), de coefficient dominant \(2^{n+1}\), et \(T_n\) est de degré \(n \lt n + 2\) : il ne modifie pas le terme dominant (cours, §2). Donc \(T_{n+2}\) est de degré \(n + 2\) et de coefficient dominant \(2^{n+1}\).</p>
    <p><strong>A3.</strong> Récurrence double : \(T_0(-X) = 1\), \(T_1(-X) = -X\) ; si la propriété vaut aux rangs \(n\) et \(n + 1\), $$T_{n+2}(-X) = -2X\,(-1)^{n+1}T_{n+1}(X) - (-1)^nT_n(X) = (-1)^{n+2}\big(2X\,T_{n+1} - T_n\big) .$$ Ensuite \(T_n(1) = 1\) pour tout \(n\) (récurrence : \(2 \times 1 - 1 = 1\)), donc \(T_n(-1) = (-1)^n\).</p>
    <p><strong>B1.</strong> Récurrence double. Vrai pour \(n = 0\) et \(n = 1\). En ajoutant \(\cos\big((n + 2)\theta\big) = \cos\big((n + 1)\theta + \theta\big)\) et \(\cos(n\theta) = \cos\big((n + 1)\theta - \theta\big)\), on obtient la formule $$\cos\big((n + 2)\theta\big) + \cos(n\theta) = 2\cos\theta\cos\big((n + 1)\theta\big) .$$ Donc, si la propriété vaut aux rangs \(n\) et \(n + 1\) : $$T_{n+2}(\cos\theta) = 2\cos\theta\cos\big((n + 1)\theta\big) - \cos(n\theta) = \cos\big((n + 2)\theta\big) .$$</p>
    <p><strong>B2.</strong> Si \(P\) convient, \(P - T_n\) s'annule en tout \(\cos\theta\), c'est-à-dire en tout point de \([-1, 1]\) : une infinité de racines, donc \(P = T_n\) (cours, §5). Pour \(x \in [-1, 1]\), \(x = \cos\theta\) avec \(\theta = \arccos x\), donc \(|T_n(x)| = |\cos(n\theta)| \le 1\). Enfin \(T_n\big(T_m(\cos\theta)\big) = T_n\big(\cos(m\theta)\big) = \cos(nm\theta)\) : le polynôme \(T_n \circ T_m\) vérifie la propriété qui caractérise \(T_{nm}\), donc \(T_n \circ T_m = T_{nm}\) (et l'on retrouve \(\deg(T_n \circ T_m) = nm\)).</p>
    <p><strong>C1.</strong> \(T_n(x_k) = \cos\frac{(2k + 1)\pi}{2}= 0\). Les angles \(\frac{(2k + 1)\pi}{2n}\), \(0 \le k \le n - 1\), sont distincts et dans \(]0, \pi[\), où le cosinus est strictement décroissant, donc injectif : les \(x_k\) sont distincts.</p>
    <p><strong>C2.</strong> \(T_n\) a \(n\) racines distinctes et est de degré \(n\) : le produit \(\prod (X - x_k)\), unitaire de degré \(n\), divise \(T_n\), et le quotient est une constante, égale au coefficient dominant \(2^{n-1}\) (A2). Toutes les racines sont réelles et simples (leur nombre égale le degré).</p>
    <p><strong>C3.</strong> Par A3, \(T_n\) n'a que des puissances de la parité de \(n\) : le coefficient de \(X^{n-1}\) est nul, donc \(\sum x_k = 0\). Pour \(n\) pair, le produit des racines vaut \((-1)^n\frac{T_n(0)}{2^{n-1}} = \frac{T_n(0)}{2^{n-1}}\), et \(T_n(0) = T_n\big(\cos\frac\pi2\big) = \cos\frac{n\pi}{2} = (-1)^{n/2}\). Donc $$\prod_{k=0}^{n-1}\cos\frac{(2k + 1)\pi}{2n} = \frac{(-1)^{n/2}}{2^{n-1}} .$$ Pour \(n = 2\) : \(\cos\frac\pi4\cos\frac{3\pi}{4} = -\frac12\). Pour \(n = 4\) : \(\frac{1}{8}\), et en effet \(\cos\frac\pi8\cos\frac{3\pi}{8} = \cos\frac\pi8\sin\frac\pi8 = \frac{\sqrt2}{4}\), tandis que \(\cos\frac{5\pi}{8}\cos\frac{7\pi}{8} = \cos\frac{3\pi}{8}\cos\frac\pi8\) : le produit vaut \(\frac{2}{16} = \frac18\).</p>
    <p><strong>C4.</strong> En dérivant \(T_n(\cos\theta) = \cos(n\theta)\) par rapport à \(\theta\) : \(-\sin\theta\,T_n'(\cos\theta) = -n\sin(n\theta)\), donc \(T_n'(\cos\theta) = \frac{n\sin(n\theta)}{\sin\theta}\) pour \(\theta \in\, ]0, \pi[\). Quand \(\theta \to 0\), \(\cos\theta \to 1\) et \(T_n'\) est continue, donc \(T_n'(1) = \lim_{\theta \to 0} \frac{n\sin(n\theta)}{\sin\theta} = n^2\) (car \(\sin u \sim u\)). Contrôle : \(T_3' = 12X^2 - 3\) donne \(9\).</p>
    <p><strong>D1.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> tchebychev(n):
    a, b = [1], [0, 1]               <span class="cmt"># T_0, T_1</span>
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> a
    <span class="kw">for</span> _ <span class="kw">in</span> range(n - 1):
        c = [0] + [2 * x <span class="kw">for</span> x <span class="kw">in</span> b]  <span class="cmt"># 2X T_(k+1)</span>
        <span class="kw">for</span> k <span class="kw">in</span> range(len(a)):
            c[k] -= a[k]             <span class="cmt"># − T_k</span>
        a, b = b, c
    <span class="kw">return</span> b</pre>
    <p>Multiplier par \(X\) décale les coefficients d'un rang (le <span class="code-inline">[0] +</span>). <span class="code-inline">tchebychev(5)</span> renvoie <span class="code-inline">[0, 5, 0, -20, 0, 16]</span>, soit \(T_5 = 16X^5 - 20X^3 + 5X\) : degré 5, coefficient dominant \(2^4\), puissances impaires seulement, \(T_5(1) = 16 - 20 + 5 = 1\) et \(T_5'(1) = 80 - 60 + 5 = 25\).</p>
  </div>
