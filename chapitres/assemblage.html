<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Un mécanisme est fait de pièces qu'il faut <strong>réunir</strong> : par une continuité de matière (soudage), par une forme déformée (rivet, sertissage), par une colle, ou par des éléments démontables (vis, boulons, goupilles). Le programme de sciences industrielles cite l'<strong>assemblage par soudage</strong> dans la compétence G2 « Industrialiser un produit », au semestre <strong>S3</strong> (début de 2ᵉ année), parmi les procédés qui permettent de réaliser une pièce métallique (phénomènes physiques, domaines d'application, <strong>règles de conception</strong>) ; les autres assemblages relèvent de la compétence F3 « concevoir et dimensionner une liaison mécanique » (exigence technique « assemblage »), au semestre <strong>S4</strong>. Le chapitre de 2ᵉ année <a href="#conception/cours">« Conception des liaisons — assemblages et guidages »</a> traite en détail les assemblages démontables (§3, §4) ; celui-ci se concentre sur le soudage et les assemblages permanents.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités du programme, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Familles d'assemblages</strong> : démontable ou permanent, transmission des efforts par obstacle, par adhérence ou par continuité de matière (F3, S4) (§1).</li>
        <li><strong>Assemblage par soudage</strong> : principe, phénomènes physiques (fusion locale, apport de chaleur, zone affectée thermiquement, retrait), procédés et domaines d'application (G2, S3) (§2 à §5).</li>
        <li><strong>Influence du procédé sur la géométrie</strong> et <strong>règles de conception</strong> d'un ensemble soudé : joints et préparations, déformations, accessibilité (G2, S3) (§5, §6, §8).</li>
        <li><strong>Dimensionner un assemblage</strong> soudé, riveté, collé ou vissé à partir d'une contrainte moyenne dans la section la plus sollicitée (F3, S4 ; résistance des matériaux, S3) (§7, §9, §10, §11).</li>
        <li><strong>Assemblages permanents</strong> par déformation (rivetage, sertissage, clinchage) et par <strong>collage</strong> : principes, domaines, règles de conception (F3, S4) (§9, §10).</li>
        <li><strong>Critères de choix</strong> d'un mode d'assemblage : démontabilité, matériaux, efforts, étanchéité, série, coût, impact environnemental (G2, S3 ; F3, S4) (§12).</li>
      </ul>
      <p>Le programme limite l'analyse des procédés à une <strong>approche qualitative</strong> : l'énergie de soudage, la largeur de la zone affectée thermiquement, les contraintes d'origine thermique et les sections de métal déposé sont des <strong>ordres de grandeur</strong> qui justifient les règles. Les calculs de résistance des cordons, des rivets, des joints collés et des vis utilisent une contrainte moyenne ; la valeur admissible est toujours fournie. Notions de 1ʳᵉ année utilisées : le frottement de Coulomb (chapitre <a href="#statique/cours">« Statique »</a>) pour les assemblages par adhérence, la nature des ajustements (chapitre <a href="#cotation/cours">« Cotation &amp; tolérances »</a>) pour le frettage. Hors programme, en fin de chapitre : relation d'Adams, modèle de Volkersen, carbone équivalent, procédés particuliers.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · ASSEMBLER : FONCTIONS ET FAMILLES</div>
  <h2>Réunir des pièces, et faire passer les efforts</h2>
  <div class="intro">Assembler deux pièces, c'est réaliser entre elles une <strong>liaison encastrement</strong> : les positionner l'une par rapport à l'autre, les maintenir dans cette position et faire passer les efforts de l'une à l'autre. Le premier critère de choix est la <strong>démontabilité</strong> ; le second, la façon dont les efforts passent.</div>
  <div class="def-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Assemblage démontable</strong> : on peut le défaire et le refaire sans détériorer les pièces (vis, boulons, goupilles, clavettes, anneaux élastiques). Indispensable pour la maintenance, le réglage, le transport, le recyclage.</li>
      <li><strong>Assemblage permanent</strong> : on ne peut le défaire qu'en détruisant au moins un élément (soudage, brasage, rivetage, sertissage, collage, frettage). Souvent plus léger, plus rigide, plus étanche et moins cher en série.</li>
    </ul>
  </div>
  <table>
    <tr><th>Les efforts passent…</th><th>Principe</th><th>Exemples</th></tr>
    <tr><td>par <strong>obstacle</strong></td><td>une forme s'oppose au mouvement relatif</td><td>rivet, goupille, clavette, vis cisaillée (à éviter), clinchage</td></tr>
    <tr><td>par <strong>adhérence</strong></td><td>des surfaces pressées l'une contre l'autre ne peuvent pas glisser (frottement de Coulomb)</td><td>boulonnage précontraint, frettage, cône serré</td></tr>
    <tr><td>par <strong>continuité de matière</strong></td><td>la matière des deux pièces est réunie par fusion</td><td>soudage</td></tr>
    <tr><td>par <strong>adhésion</strong></td><td>un matériau d'apport lie les surfaces sans les fondre</td><td>collage, brasage</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — boulonner ou souder les nœuds d'un treillis</strong>
    <p>Une poutre en treillis de 24 nœuds peut être boulonnée (4 boulons M16 par nœud) ou soudée (2 cordons de 150 mm par nœud).</p>
    <ol>
      <li>Boulonnée : 96 boulons et 192 trous à percer avec précision (les trous des deux pièces doivent coïncider), mais montage sur chantier sans poste de soudage, et démontage possible.</li>
      <li>Soudée : \(24 \times 2 \times 0{,}15 = 7{,}2\) m de cordon ; à 0,25 m/min de vitesse de soudage, environ 29 minutes d'arc, sans perçage ni boulon, avec une poutre plus légère et plus rigide ; mais il faut un soudeur qualifié, un gabarit contre les déformations, et la poutre ne se démonte plus.</li>
      <li>D'où la pratique des charpentes : soudage en atelier (sous-ensembles transportables), boulonnage sur chantier.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'un assemblage permanent est toujours plus résistant. Une soudure mal placée (ZAT, défauts) ou un joint collé travaillant au pelage cède avant un bon boulonnage. La résistance dépend du mode de transmission des efforts et de la conception du joint, pas de la démontabilité.</div>
</div>

  <div class="sec-num">§2 · LE SOUDAGE : PRINCIPE ET ÉNERGIE</div>
  <h2>Créer une continuité de matière par fusion locale</h2>
  <div class="intro">Souder, c'est fondre localement les bords de deux pièces, avec ou sans métal d'apport, pour qu'après solidification elles ne forment plus qu'une seule pièce. C'est l'assemblage permanent des structures métalliques : charpentes, châssis, réservoirs, navires, canalisations, bâtis de machines (mécanosoudure).</div>

  <div class="def-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Métal de base</strong> : celui des pièces à assembler. <strong>Métal d'apport</strong> : fil, baguette ou électrode fondus pour remplir le joint, de composition voisine (soudage <strong>homogène</strong>).</li>
      <li><strong>Bain de fusion</strong> : zone liquide sous la source de chaleur ; en se solidifiant, il forme le <strong>cordon</strong> (ou zone fondue).</li>
      <li><strong>Zone affectée thermiquement</strong> (ZAT) : métal de base qui n'a pas fondu mais dont la structure, donc les propriétés, ont été modifiées par la chaleur (§4).</li>
      <li><strong>Protection du bain</strong> : un métal liquide à l'air s'oxyde et absorbe azote et hydrogène (porosités, fragilité) ; on le protège par un gaz (argon, CO₂, mélanges) ou par un laitier issu de l'enrobage d'une électrode.</li>
      <li><strong>Soudabilité</strong> : aptitude d'un métal à donner un joint sain et aux propriétés suffisantes. Bonne pour les aciers pauvres en carbone et les inox austénitiques ; délicate pour les aciers riches en carbone ou alliés (ZAT trempée, fissures), les alliages d'aluminium à durcissement structural (ZAT adoucie), les fontes.</li>
    </ul>
  </div>
  <p>Le <strong>brasage</strong> n'est pas un soudage : le métal d'apport (étain, laiton, alliage d'argent) fond à une température inférieure à celle du métal de base, qui ne fond pas ; il mouille les surfaces et s'infiltre par capillarité dans un jeu étroit. Il permet d'assembler des métaux différents, avec peu de chaleur (électronique, plomberie, échangeurs), mais résiste moins.</p>
  <h3>L'énergie apportée</h3>
  <p>La source de chaleur se déplace le long du joint à la vitesse \(v\). Ce qui compte pour la pièce est l'énergie apportée par unité de longueur de cordon, l'<strong>énergie de soudage</strong> (ou énergie linéique). Pour un arc de tension \(U\) et d'intensité \(I\), avec un rendement thermique \(\eta\) (part de la puissance électrique qui entre dans la pièce : environ 0,8 en MAG, 0,6 en TIG) :</p>
  <div class="formula" data-nom="Énergie de soudage">$$E = \frac{\eta\,U\,I}{v} \quad (\text{J/mm})$$</div>
  <div class="method-box"><strong>Exemple — comparer trois procédés</strong>
    <ol>
      <li>MAG sur un acier de 6 mm : \(U = 24\) V, \(I = 200\) A, \(v = 5\) mm/s, \(\eta = 0{,}8\) : \(E = 0{,}8 \times 24 \times 200/5 \approx 770\) J/mm (puissance utile 3,8 kW).</li>
      <li>TIG sur un inox de 1,5 mm : \(U = 12\) V, \(I = 80\) A, \(v = 2\) mm/s, \(\eta = 0{,}6\) : \(E \approx 290\) J/mm.</li>
      <li>Laser de 4 kW à 50 mm/s, dont 60 % absorbés : \(E = 0{,}6 \times 4\,000/50 = 48\) J/mm, seize fois moins qu'en MAG : la chaleur est concentrée sur un joint étroit et profond, la ZAT et les déformations sont minimes.</li>
      <li>Ordre de grandeur de la zone fondue : fondre de l'acier demande environ 9,7 J/mm³ (échauffement jusqu'à 1 500 °C puis fusion). Si 30 à 40 % de l'énergie MAG sert à fondre, la section fondue vaut \(0{,}35 \times 770/9{,}7 \approx 28\ \text{mm}^2\) environ : le reste chauffe la pièce.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre puissance et énergie de soudage. Doubler la vitesse à puissance égale divise l'énergie par deux : moins de pénétration, une ZAT plus étroite, des déformations plus faibles, mais un risque de manque de fusion. Le réglage d'un poste de soudage est un compromis entre ces effets.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LES PROCÉDÉS DE SOUDAGE</div>
  <h2>Arc, résistance, faisceau, friction</h2>
  <div class="intro">Les procédés se distinguent par leur source de chaleur. Plus la chaleur est concentrée, plus le soudage est rapide, profond et peu déformant, mais plus l'équipement est coûteux et la préparation des bords exigeante.</div>
  <table>
    <tr><th>Procédé</th><th>Source de chaleur et protection</th><th>Domaine d'emploi</th></tr>
    <tr><td>arc à l'électrode enrobée</td><td>arc entre une électrode fusible enrobée et la pièce ; l'enrobage fond en laitier protecteur</td><td>chantier, réparation, tous aciers ; matériel simple, lent</td></tr>
    <tr><td>MIG / MAG</td><td>arc sur un fil fusible dévidé en continu, sous gaz inerte (MIG : argon, pour l'aluminium) ou actif (MAG : argon + CO₂, pour l'acier)</td><td>atelier, robots, épaisseurs moyennes ; le procédé le plus répandu</td></tr>
    <tr><td>TIG</td><td>arc sur une électrode de tungstène non fusible, sous argon ; apport séparé (baguette) ou nul</td><td>tôles minces, inox, aluminium, titane ; soudures très propres, lent</td></tr>
    <tr><td>par résistance (par points, à la molette)</td><td>courant intense à travers les tôles serrées entre deux électrodes : effet Joule au contact</td><td>tôles minces superposées, carrosserie automobile (plusieurs milliers de points par caisse)</td></tr>
    <tr><td>laser, faisceau d'électrons</td><td>faisceau très concentré qui crée un trou de vapeur et une fusion étroite et profonde</td><td>grande série automatisée, pièces de précision, faible ZAT ; investissement élevé</td></tr>
    <tr><td>par friction (rotative, malaxage)</td><td>échauffement par frottement et malaxage à l'état pâteux, <strong>sans fusion</strong></td><td>arbres et tubes (friction rotative), alliages d'aluminium difficiles à souder (friction-malaxage)</td></tr>
    <tr><td>oxyacétylénique</td><td>flamme d'acétylène et d'oxygène</td><td>tôles minces, réparation, brasage ; aujourd'hui peu employé en production</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — un point de soudure par résistance</strong>
    <p>Deux tôles d'acier de 0,8 mm sont serrées entre deux électrodes ; on fait passer \(I = 8\) kA pendant \(t = 0{,}2\) s ; la résistance électrique de l'empilement vaut environ \(R = 100\ \mu\Omega\).</p>
    <ol>
      <li>Énergie dissipée par effet Joule : \(Q = R\,I^2 t = 10^{-4} \times 8\,000^2 \times 0{,}2 = 1\,280\) J.</li>
      <li>Le noyau fondu, de Ø 6 mm sur 1,6 mm d'épaisseur, a un volume de \(\frac{\pi}{4} \times 6^2 \times 1{,}6 \approx 45\ \text{mm}^3\) ; le fondre demande environ \(45 \times 9{,}7 \approx 440\) J, soit 34 % de l'énergie : le reste part dans les électrodes refroidies et dans la tôle.</li>
      <li>La chaleur naît là où la résistance est la plus grande : au contact entre les deux tôles. Le noyau se forme donc au milieu, sans marquer les faces extérieures, ce qui convient aux pièces d'aspect.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que le soudage par points crée un cordon continu. Il crée des <strong>points</strong> espacés (de l'ordre de 30 à 50 mm) : l'assemblage n'est pas étanche, et chaque point travaille en cisaillement comme un rivet. Pour l'étanchéité, on soude à la molette (points qui se recouvrent) ou on ajoute un mastic.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CE QUE LA CHALEUR FAIT AU MÉTAL</div>
  <h2>Zone fondue, zone affectée thermiquement, métal de base</h2>
  <div class="intro">Autour du cordon, le métal a été chauffé puis refroidi plus ou moins vite : il a subi un véritable traitement thermique local, non maîtrisé. C'est souvent là, et non dans le cordon, que se trouve le point faible d'un assemblage soudé.</div>
  <ul>
    <li><strong>Zone fondue</strong> (cordon) : métal d'apport mêlé au métal de base fondu, à structure de solidification. Défauts possibles : porosités, inclusions de laitier, manque de fusion ou de pénétration, fissures de solidification.</li>
    <li><strong>Zone affectée thermiquement</strong> : portée au-delà de la température de transformation de l'acier (environ 727 °C) sans fondre. Selon la vitesse de refroidissement et la teneur en carbone, elle peut être <strong>trempée</strong> (dure, fragile, sujette à la fissuration à froid, aggravée par l'hydrogène), ou au contraire adoucie (aluminium à durcissement structural, acier écroui ou traité qui perd son traitement).</li>
    <li><strong>Métal de base</strong> : resté sous la température de transformation, inchangé.</li>
  </ul>

<figcaption>Température maximale atteinte dans une tôle d'acier de 6 mm, en fonction de la distance \(y\) à la limite de la zone fondue (relation d'Adams pour une tôle mince, hors programme). La ZAT s'étend jusqu'au point où le métal a dépassé 727 °C (début de la transformation de l'acier) : environ 4,5 mm pour 768 J/mm, 2,2 mm pour une énergie moitié, 6,0 mm si la tôle est préchauffée à 150 °C (zone plus large, mais refroidie plus lentement, donc moins dure).</figcaption>
</figure>
  <p>Les tendances à retenir, en lien avec <a href="#trtherm/cours">« Traitements thermiques »</a> : la ZAT est d'autant plus <strong>large</strong> que l'énergie de soudage est grande ; elle refroidit d'autant plus <strong>vite</strong> (et durcit d'autant plus) que l'énergie est faible, la pièce épaisse et froide. Pour un acier sensible à la trempe, on <strong>préchauffe</strong> la pièce (100 à 250 °C) : la ZAT est un peu plus large, mais elle refroidit lentement et ne trempe pas. Après soudage, un <strong>recuit de détente</strong> (vers 550 à 650 °C pour un acier) réduit les contraintes résiduelles et adoucit la ZAT.</p>
  <div class="method-box"><strong>Exemple — largeur de ZAT d'une tôle de 6 mm</strong>
    <ol>
      <li>Avec l'énergie MAG du §2 (770 J/mm), le métal dépasse 727 °C jusqu'à environ 4,5 mm de la limite de fusion, de chaque côté du cordon (figure).</li>
      <li>À énergie moitié (vitesse doublée), la ZAT ne fait plus que 2,2 mm : elle est proportionnelle à l'énergie pour une tôle mince.</li>
      <li>Avec un préchauffage à 150 °C, elle passe à 6,0 mm, mais sa vitesse de refroidissement diminue nettement : c'est le but recherché pour un acier à 0,45 % de carbone, qui tremperait sinon dans la ZAT.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : chercher la rupture d'une pièce soudée dans le cordon. Le cordon, souvent légèrement plus résistant que le métal de base, tient ; la rupture en service (surtout en fatigue) part fréquemment du <strong>raccordement</strong> entre le cordon et la pièce, dans la ZAT, où se cumulent concentration de contrainte, structure modifiée et contraintes résiduelles de traction.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DÉFORMATIONS ET CONTRAINTES RÉSIDUELLES</div>
  <h2>Le retrait du cordon déforme la pièce</h2>
  <div class="intro">Une pièce soudée ne sort jamais exactement à la forme de ses éléments : elle se tord, se raccourcit, se voile. Comprendre l'origine de ces déformations permet de les limiter par la conception et par la méthode de soudage.</div>
  <p>Le métal chauffé près du cordon veut se dilater, mais le métal froid qui l'entoure l'en empêche : il est comprimé, et comme il est chaud donc peu résistant, il se déforme plastiquement en compression. En refroidissant, il veut se contracter davantage qu'il ne s'est dilaté librement : le métal froid l'en empêche encore, et il reste <strong>tendu</strong>. Résultat : des <strong>contraintes résiduelles</strong> de traction de l'ordre de la limite d'élasticité le long du cordon, équilibrées par de la compression plus loin, et des <strong>déformations</strong> de la pièce.</p>
  <div class="formula" data-nom="Contrainte d'origine thermique (dilatation empêchée)">$$\sigma = E\,\alpha\,\Delta T$$</div>
  <div class="method-box"><strong>Exemple — pourquoi le métal plastifie toujours</strong>
    <ol>
      <li>Acier : \(E = 210\) GPa, \(\alpha = 12\cdot10^{-6}\ \text{K}^{-1}\). Un écart de température de 100 K entre une zone et son entourage, s'il ne peut se dilater, crée \(\sigma = 210\,000 \times 12\cdot10^{-6} \times 100 \approx 250\) MPa : déjà la limite d'élasticité d'un acier courant. Près d'un cordon, les écarts se comptent en centaines de kelvins : la plastification est certaine.</li>
      <li>Une bande d'acier qui refroidirait librement de 600 °C (où l'acier redevient rigide) à 20 °C se raccourcirait de \(12\cdot10^{-6} \times 580 \approx 0{,}7\,\%\), soit 7 mm par mètre. Retenue par la pièce, elle la raccourcit un peu et la courbe.</li>
    </ol>
  </div>
  <h3>Les formes de déformation</h3>
  <ul>
    <li><strong>Retrait longitudinal</strong> (le long du cordon) : raccourcissement et cintrage des poutres soudées d'un seul côté.</li>
    <li><strong>Retrait transversal</strong> (en travers) : les deux tôles se rapprochent de quelques dixièmes à quelques millimètres.</li>
    <li><strong>Déformation angulaire</strong> : un chanfrein en V a plus de métal fondu en haut qu'en bas ; le retrait, plus fort en haut, referme le V et les tôles se relèvent.</li>
    <li><strong>Voilement</strong> des tôles minces, comprimées loin du cordon.</li>
  </ul>
  <h3>Les remèdes</h3>
  <ul>
    <li>Réduire le volume de métal fondu et l'énergie : préparation en X plutôt qu'en V (§6), cordons d'angle pas plus gros que nécessaire, procédés concentrés (laser).</li>
    <li>Équilibrer : souder symétriquement par rapport à l'axe neutre, alterner les côtés d'un X.</li>
    <li>Fixer la géométrie avant de souder : <strong>pointage</strong> (petits points qui tiennent les pièces), <strong>bridage</strong> sur un gabarit, <strong>prédéformation</strong> (on écarte les pièces de l'angle que le retrait va refermer).</li>
    <li>Séquence : souder du centre vers les bords, par passes courtes alternées (pas de pèlerin).</li>
    <li>Après soudage : recuit de détente, redressage, et usinage des surfaces précises <strong>après</strong> soudage.</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : usiner les portées d'un bâti avant de le souder. Le retrait déplace les surfaces de plusieurs dixièmes de millimètre : les alésages ne sont plus coaxiaux. On soude, on détensionne, puis on usine.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · JOINTS ET PRÉPARATION DES BORDS</div>
  <h2>Disposer les pièces pour que le métal pénètre</h2>
  <div class="intro">La fusion ne pénètre que de quelques millimètres sous un arc : pour souder une tôle épaisse sur toute son épaisseur, il faut ouvrir le joint par un <strong>chanfrein</strong>. Le choix du type de joint et de sa préparation fixe le volume de métal à déposer, donc le temps, le coût et les déformations.</div>
  <h3>Les types de joints</h3>
  <ul>
    <li><strong>Bout à bout</strong> : les pièces dans le prolongement l'une de l'autre ; transmission directe des efforts, le meilleur en fatigue s'il est à pleine pénétration.</li>
    <li><strong>En angle</strong> (en T, en L, d'angle extérieur) : une pièce contre la face de l'autre, réunies par un ou deux <strong>cordons d'angle</strong> de section triangulaire, sans préparation.</li>
    <li><strong>À clin</strong> (à recouvrement) : les pièces superposées, réunies par des cordons d'angle ou des points ; simple, mais l'effort est décalé (flexion parasite).</li>
  </ul>

  </ul>
  <div class="method-box"><strong>Exemple — V ou X sur une tôle de 20 mm ?</strong>
    <p>Chanfrein à 60° (demi-angle 30°), talon 2 mm, jeu 2 mm ; taux de dépôt du fil MAG : 3 kg/h.</p>
    <ol>
      <li>En V : la partie chanfreinée haute de 18 mm a une section \(18^2 \tan 30° \approx 187\ \text{mm}^2\), plus le jeu \(2 \times 20 = 40\ \text{mm}^2\) : 227 mm², soit \(227\cdot10^{-6} \times 7\,850 \approx 1{,}78\) kg de métal par mètre et 36 minutes de dépôt par mètre.</li>
      <li>En X : deux chanfreins de 9 mm, \(2 \times 9^2 \tan 30° \approx 94\ \text{mm}^2\), plus 40 mm² : 134 mm², 1,05 kg/m, 21 min/m.</li>
      <li>Le X économise 41 % de métal et de temps, et, rempli alternativement des deux côtés, il équilibre le retrait : presque pas de déformation angulaire. Il exige seulement l'accès aux deux faces et un retournement de la pièce.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prévoir un cordon d'angle ou un V sur une face inaccessible. La torche doit pouvoir arriver au joint avec une inclinaison d'environ 45° et le soudeur (ou le robot) doit voir le bain. Un joint qu'on ne peut pas souder correctement est un joint défectueux.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DIMENSIONNER UN CORDON</div>
  <h2>La gorge, section par laquelle passe l'effort</h2>
  <div class="intro">Au niveau de 1ʳᵉ année, on vérifie un cordon comme on vérifie une barre ou un axe en résistance des matériaux : on calcule une <strong>contrainte moyenne</strong> dans la plus petite section par laquelle l'effort doit passer, et on la compare à une valeur admissible fournie.</div>
  <h3>Joint bout à bout à pleine pénétration</h3>
  <p>Le cordon a la même section que la tôle (épaisseur \(e\), longueur \(\ell\)). Avec un métal d'apport au moins aussi résistant que le métal de base, il se calcule comme la tôle elle-même : \(\sigma = F/(e\,\ell) \le R_{pe}\), avec \(R_{pe} = R_e/s\) (\(s\) : coefficient de sécurité). Le joint n'est pas le maillon faible en statique ; il l'est souvent en fatigue (défauts, ZAT).</p>

<figcaption>(a) Un cordon d'angle se dimensionne par sa <strong>gorge</strong> \(a\), hauteur du triangle inscrit dans le cordon (\(a = z/\sqrt 2 \approx 0{,}7\,z\) pour un cordon isocèle de côté \(z\)) : c'est la plus petite section par laquelle l'effort passe. (b) Plat tiré par \(F\), soudé sur un gousset par deux cordons latéraux de longueur \(\ell\) : l'effort traverse deux sections de gorge \(a\,\ell\), sollicitées en cisaillement.</figcaption>
</figure>
  <p>La section résistante d'un cordon d'angle de longueur \(\ell\) est sa <strong>section de gorge</strong> \(a\,\ell\). Dans la méthode simplifiée, on admet qu'elle travaille en cisaillement uniforme, quelle que soit la direction de l'effort, et on vérifie :</p>
  <div class="formula" data-nom="Cordons d'angle (méthode simplifiée)">$$\tau_{moy} = \frac{F}{\sum a\,\ell} \le \tau_{adm}$$</div>
  <p>\(\tau_{adm}\), fourni, est de l'ordre de 150 à 200 MPa pour les aciers de construction courants. Règles usuelles : \(a \ge 3\) mm ; \(a\) au plus 0,7 fois l'épaisseur de la plus mince des pièces ; chaque extrémité de cordon (cratère) est moins bonne : on ne compte pas une longueur d'environ \(a\) à chaque bout, ou on prolonge le cordon.</p>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Pourquoi la gorge vaut-elle z/√2 ?</span><span class="prompt">La hauteur d'un triangle rectangle isocèle</span><div class="content">
    <p>Un cordon d'angle à 90° de côtés égaux \(z\) a une section en triangle rectangle isocèle. La plus petite distance entre l'angle de la pièce (le pied commun) et la surface du cordon est la hauteur issue de l'angle droit, qui coupe l'hypoténuse \(z\sqrt 2\) en son milieu : \(a = z\sqrt 2/2 = z/\sqrt 2 \approx 0{,}71\,z\). C'est par ce plan que la rupture se produit, d'où le nom de « gorge ».</p>
  </div></div>
  <div class="method-box"><strong>Exemple — souder un plat tendu sur un gousset</strong>
    <p>Un plat de 80 × 10 mm en acier S235 (\(R_e = 235\) MPa, \(s = 1{,}5\)) transmet \(F = 120\) kN à un gousset par deux cordons d'angle latéraux de gorge \(a = 4\) mm ; \(\tau_{adm} = 180\) MPa.</p>
    <ol>
      <li>Le plat lui-même : \(\sigma = 120\,000/(80 \times 10) = 150\) MPa \(\le R_{pe} = 235/1{,}5 \approx 157\) MPa : il convient, de justesse.</li>
      <li>Gorge admissible : \(3 \le a \le 0{,}7 \times 10 = 7\) mm : \(a = 4\) mm convient (côté du cordon \(z = 4\sqrt 2 \approx 5{,}7\) mm).</li>
      <li>Longueur de chaque cordon : \(\ell \ge F/(2\,a\,\tau_{adm}) = 120\,000/(2 \times 4 \times 180) \approx 83\) mm, plus \(2a = 8\) mm pour les extrémités : on retient deux cordons de 95 mm.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre le côté \(z\) au lieu de la gorge \(a\), ce qui surestime la section de 41 %. Autre piège : surdimensionner les cordons « par sécurité ». Un cordon deux fois trop gros apporte deux fois plus de chaleur, de déformations et de contraintes résiduelles, et coûte deux fois plus.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CONCEVOIR UN ENSEMBLE SOUDÉ</div>
  <h2>Les règles de tracé de la mécanosoudure</h2>
  <div class="intro">Un bâti, un châssis ou un support mécanosoudé est fait de tôles, de profilés et de tubes découpés, éventuellement pliés, puis soudés. Bien conçu, il est léger, rigide et économique en petite série ; mal conçu, il se déforme, fissure et coûte cher à redresser.</div>
  <ul>
    <li><strong>Accessibilité</strong> de chaque joint (torche à environ 45°, visibilité du bain) ; ordre de soudage possible.</li>
    <li><strong>Peu de cordons</strong>, aussi courts que possible : remplacer deux plats soudés par une tôle pliée, un assemblage de plats par un profilé du commerce.</li>
    <li><strong>Placer les cordons hors des zones les plus sollicitées</strong> : loin des changements de section, des encastrements et des zones fléchies au maximum, surtout sous charges répétées ; éviter de croiser ou d'accumuler les cordons (dégagements en quart de cercle aux angles des goussets).</li>
    <li><strong>Épaisseurs voisines</strong> des pièces à assembler (une tôle mince sur une pièce massive : la mince brûle, la massive ne fond pas).</li>
    <li><strong>Symétrie</strong> des cordons par rapport aux axes de la pièce, pour équilibrer les retraits.</li>
    <li><strong>Matériaux soudables</strong> : aciers de construction peu chargés en carbone, inox austénitiques ; précautions (préchauffage, procédé adapté) ailleurs ; pas de soudage de matériaux très différents.</li>
    <li><strong>Surépaisseurs</strong> sur les surfaces fonctionnelles, usinées après soudage et détensionnement.</li>
    <li>Prévoir des <strong>surfaces de pointage et de bridage</strong>, et la possibilité de <strong>contrôler</strong> les cordons importants.</li>
  </ul>
  <div class="method-box"><strong>Exemple — plier au lieu de souder</strong>
    <p>Un support en U de 300 mm de long est fait de trois plats de 6 mm assemblés par deux cordons d'angle de 300 mm.</p>
    <ol>
      <li>Soudé : 0,6 m de cordon, soit environ 2,4 minutes d'arc à 4 min/m, plus le pointage, le brossage, le redressage de l'U refermé par le retrait.</li>
      <li>Plié dans une seule tôle : deux plis, quelques secondes sur une plieuse, aucune ZAT ni déformation de soudage, et des angles arrondis qui concentrent moins les contraintes.</li>
      <li>Limite : l'épaisseur pliable (une plieuse d'atelier plie couramment jusqu'à une dizaine de millimètres sur de faibles longueurs) et le rayon intérieur imposé (chapitre <a href="#deform/cours">« Mise en forme par déformation et découpage »</a>).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : terminer un cordon d'angle juste au bout d'un gousset tendu, ou souder transversalement une semelle de poutre fléchie à l'endroit du moment maximal. Ces détails, banals en statique, sont les premiers sites de fissure de fatigue.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · RIVETAGE ET ASSEMBLAGES PAR DÉFORMATION</div>
  <h2>Un obstacle formé à froid</h2>
  <div class="intro">Le rivetage assemble sans chaleur sur les pièces : un rivet est mis en place dans des trous alignés, puis son extrémité est écrasée pour former une seconde tête. Il réunit des métaux non soudables (alliages d'aluminium aéronautiques), des matériaux différents, des tôles revêtues, et ne déforme pas l'ensemble par la chaleur.</div>

</figure>
  <ul>
    <li><strong>Rivet plein</strong>, posé à froid (aluminium, acier doux) ou à chaud (gros rivets d'acier des anciennes charpentes) : accès aux deux faces nécessaire.</li>
    <li><strong>Rivet aveugle</strong> (« pop ») : posé d'un seul côté, par traction sur une tige qui gonfle le corps et casse ; carrosserie, tôlerie légère.</li>
    <li><strong>Sertissage</strong> : rabattre une partie d'une pièce sur l'autre (bords de portière, boîtes de conserve, connecteurs).</li>
    <li><strong>Clinchage</strong> : un poinçon emboutit localement les deux tôles l'une dans l'autre, formant un bouton serti sans élément ajouté ; tôles revêtues, électroménager.</li>
  </ul>
  <p>Un rivet chargé transversalement transmet l'effort par <strong>obstacle</strong>. On vérifie le <strong>cisaillement</strong> de sa tige dans chaque plan de joint et le <strong>matage</strong> (pression de contact) sur la paroi des trous. Pour \(n\) rivets de diamètre \(d\), \(m\) plans de cisaillement par rivet, dans une tôle d'épaisseur \(e\) :</p>
  <div class="formula" data-nom="Rivets : cisaillement et matage">$$\tau = \frac{F}{n\,m\,\pi d^2/4} \le \tau_{adm} \qquad p = \frac{F}{n\,d\,e} \le p_{adm}$$</div>
  <div class="method-box"><strong>Exemple — quatre rivets dans deux tôles d'aluminium</strong>
    <p>Deux tôles de 2 mm à clin (un plan de cisaillement) transmettent 3 kN par 4 rivets de Ø 4 mm ; \(\tau_{adm} = 100\) MPa pour les rivets, \(p_{adm} = 150\) MPa pour les tôles.</p>
    <ol>
      <li>Cisaillement : \(\tau = 3\,000/(4 \times \pi \times 4^2/4) \approx 60\) MPa \(\le 100\) MPa.</li>
      <li>Matage : \(p = 3\,000/(4 \times 4 \times 2) \approx 94\) MPa \(\le 150\) MPa.</li>
      <li>Placement : pince d'au moins 6 à 8 mm, pas d'au moins 12 mm. Avec un couvre-joint de chaque côté (deux plans de cisaillement), la contrainte dans les rivets serait divisée par deux.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le matage, ou compter deux plans de cisaillement dans un assemblage à clin qui n'en a qu'un. Autre piège : percer trop près du bord (pince insuffisante) : la tôle se déchire entre le trou et le bord avant que le rivet ne cède.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · LE COLLAGE</div>
  <h2>Assembler par adhésion, sur toute une surface</h2>
  <div class="intro">Une colle structurale réunit deux surfaces par une fine couche de polymère qui adhère à chacune. Le collage répartit les efforts sur toute la surface collée, assemble des matériaux différents (métal, composite, verre, polymère), étanche le joint, ne perce ni ne chauffe les pièces : il progresse dans l'automobile, l'aéronautique et le sport.</div>
  <ul>
    <li><strong>Familles d'adhésifs</strong> : époxydes (structuraux, rigides, durcissent à chaud ou à froid avec un durcisseur), polyuréthanes (souples, vitrages collés), acryliques, cyanoacrylates (prise en secondes, petites surfaces), anaérobies (durcissent sans air entre surfaces métalliques : freins-filets, emmanchements collés), silicones (étanchéité).</li>
    <li><strong>Préparation des surfaces</strong> : dégraissage, abrasion ou traitement chimique ; c'est d'elle que dépend la tenue de l'adhésion dans le temps.</li>
    <li><strong>Limites</strong> : tenue en température (souvent 80 à 150 °C), vieillissement à l'humidité, temps de polymérisation, contrôle difficile, démontage difficile.</li>
  </ul>
  <h3>Faire travailler la colle en cisaillement</h3>
  <p>Une colle résiste bien en <strong>cisaillement</strong> et en compression, très mal au <strong>pelage</strong> (on décolle un ruban adhésif en tirant sur un bord) et au <strong>clivage</strong> (effort qui ouvre le joint par une extrémité). On conçoit donc des joints à recouvrement, à double recouvrement, en biseau, des emmanchements collés, et non des joints bout à bout ou des bords libres sollicités en arrachement.</p>
  <p>Pour un recouvrement de largeur \(b\) et de longueur \(\ell\), on vérifie la contrainte moyenne :</p>
  <div class="formula" data-nom="Joint collé à recouvrement">$$\tau_{moy} = \frac{F}{b\,\ell} \le \tau_{adm}$$</div>

<figcaption>Cisaillement dans la colle d'un joint à recouvrement de deux tôles d'aluminium de 2 mm (colle époxyde de 0,2 mm), rapporté à sa valeur moyenne \(\tau_{moy} = F/(b\,\ell)\) (modèle de Volkersen, hors programme). Les tôles s'étirent : l'effort passe surtout près des <strong>extrémités</strong> du recouvrement. Le pic vaut 1,8 fois la moyenne pour 12,5 mm, 3,3 fois pour 25 mm, 6,7 fois pour 50 mm : au-delà d'une certaine longueur, allonger le recouvrement n'augmente presque plus l'effort supportable.</figcaption>
</figure>
  <p>La contrainte réelle n'est pas uniforme : les tôles s'allongent sous l'effort, et le cisaillement se concentre aux <strong>extrémités</strong> du recouvrement. C'est pourquoi \(\tau_{adm}\) (valeur de calcul fournie, de quelques mégapascals à une vingtaine) est bien inférieure à la résistance de la colle, et pourquoi on adoucit les extrémités (biseaux, bourrelet de colle).</p>
  <div class="method-box"><strong>Exemple — deux applications</strong>
    <ol>
      <li>Joint à recouvrement de deux tôles d'aluminium de 30 mm de large transmettant 6 kN, \(\tau_{adm} = 8\) MPa : \(\ell \ge 6\,000/(30 \times 8) = 25\) mm.</li>
      <li>Emmanchement collé d'un moyeu sur un arbre de Ø 20 mm, longueur collée 25 mm, colle anaérobie, \(\tau_{adm} = 10\) MPa : l'effort tangentiel transmissible vaut \(\tau_{adm}\,\pi d\,\ell\), au rayon \(d/2\) ; couple \(C = \tau_{adm}\,\pi d^2 \ell/2 = 10 \times \pi \times 20^2 \times 25/2 \approx 157\ \text{N·m}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : allonger indéfiniment un recouvrement pour gagner en résistance. Au-delà d'une longueur de l'ordre de quelques épaisseurs de tôle, l'effort supportable n'augmente presque plus (figure) : mieux vaut élargir le joint, l'amincir aux extrémités ou doubler le recouvrement.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · ASSEMBLAGES DÉMONTABLES ET PAR ADHÉRENCE</div>
  <h2>Visser, boulonner, fretter</h2>
  <div class="intro">Les assemblages démontables sont étudiés en détail en 2ᵉ année dans <a href="#conception/cours">« Conception des liaisons »</a> (§2 mise en position, §3 maintien en position, §4 transmission des efforts). On en retient ici le principe, qui repose sur l'adhérence (frottement de Coulomb, chapitre « Statique »), et les règles de conception les plus courantes.</div>
  <h3>Assemblage vissé ou boulonné</h3>
  <ul>
    <li>Une vis serrée est un ressort tendu : elle <strong>presse</strong> les pièces l'une contre l'autre avec une précharge \(F_0\). Elle travaille en <strong>traction</strong> ; elle ne met pas en position (le trou de passage est plus grand qu'elle).</li>
    <li>Les efforts parallèles au plan de joint passent par <strong>adhérence</strong> entre les surfaces serrées : avec \(n\) vis, \(n_f\) plans de frottement et un coefficient d'adhérence \(f\), \(T_{max} = f\,n_f\,n\,F_0\). Au-delà, les pièces glissent : on ajoute des pions ou une butée, plutôt que de faire travailler les vis en cisaillement.</li>
    <li>Vérification de la vis : \(\sigma = F_v/A_s \le R_e/s\) (\(A_s\) : section résistante tabulée, environ 0,75 fois la section nominale).</li>
    <li>Règles de conception : longueur de filet en prise d'au moins \(d\) dans l'acier, 1,5 à 2 \(d\) dans une fonte ou un alliage léger (sinon goujon) ; place pour la clé ; surfaces d'appui planes et perpendiculaires à l'axe (lamage) ; rondelles sur les matériaux tendres ; freinage contre le desserrage sous vibrations.</li>
  </ul>
  <div class="method-box"><strong>Exemple — une console tenue par deux vis</strong>
    <p>Deux vis M8 de classe 8.8 (\(R_e = 640\) MPa, \(A_s = 36{,}6\ \text{mm}^2\)) sont serrées à 70 % de leur limite d'élasticité ; un plan de joint, \(f = 0{,}15\).</p>
    <ol>
      <li>Précharge : \(F_0 = 0{,}7 \times 640 \times 36{,}6 \approx 16{,}4\) kN par vis.</li>
      <li>Effort transversal transmissible sans glissement : \(T_{max} = 0{,}15 \times 1 \times 2 \times 16{,}4 \approx 4{,}9\) kN.</li>
      <li>Une charge de 6 kN ferait glisser la console : il faut des vis plus grosses, une troisième vis ou une butée.</li>
    </ol>
  </div>
  <h3>Frettage</h3>
  <p>Le frettage est un assemblage <strong>serré</strong> : l'alésage du moyeu est un peu plus petit que l'arbre (ajustement serré). Une fois monté, la pression de contact transmet par adhérence le couple et l'effort axial sur toute la surface. Pour monter sans effort, on chauffe le moyeu (ou on refroidit l'arbre) : son diamètre \(D\) augmente de \(\Delta D = \alpha\,D\,\Delta T\). Il faut ouvrir l'alésage du serrage \(\delta\) plus un jeu de montage \(j\) :</p>
  <div class="formula" data-nom="Échauffement de frettage">$$\Delta T = \frac{\delta + j}{\alpha\,D}$$</div>
  <p>Exemple : arbre de Ø 60 mm, serrage 60 µm, jeu de montage 40 µm, acier (\(\alpha = 12\cdot10^{-6}\ \text{K}^{-1}\)) : \(\Delta T = 0{,}10/(12\cdot10^{-6} \times 60) \approx 140\) K. Le couple transmissible se calcule avec la pression de contact (chapitre « Conception des liaisons », §4). Le frettage est considéré comme permanent : le démontage abîme les portées.</p>
  <div class="notice"><strong>Erreur classique</strong> : calculer une vis d'assemblage en cisaillement. Dans un assemblage bien conçu, la vis est tendue et ce sont les surfaces serrées qui transmettent l'effort transversal ; si elle travaille en cisaillement, c'est que l'assemblage a glissé, et le desserrage n'est pas loin.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · CHOISIR UN MODE D'ASSEMBLAGE</div>
  <h2>Critères techniques, économiques et environnementaux</h2>
  <div class="intro">Le choix d'un assemblage se fait dès la conception, en même temps que celui des matériaux et des procédés d'obtention des pièces : il conditionne la forme des bords, l'accessibilité, les traitements et le recyclage.</div>
  <table>
    <tr><th>Critère</th><th>Soudage</th><th>Rivetage</th><th>Collage</th><th>Vissage</th></tr>
    <tr><td>démontable</td><td>non</td><td>non (perçage)</td><td>non</td><td>oui</td></tr>
    <tr><td>matériaux différents</td><td>non (en général)</td><td>oui</td><td>oui</td><td>oui</td></tr>
    <tr><td>étanchéité</td><td>oui</td><td>non (sauf mastic)</td><td>oui</td><td>non (joint à ajouter)</td></tr>
    <tr><td>effet sur les pièces</td><td>ZAT, déformations, contraintes résiduelles</td><td>trous (concentration de contraintes)</td><td>aucun, mais préparation de surface</td><td>trous, taraudages</td></tr>
    <tr><td>tenue en température</td><td>celle du métal</td><td>celle du métal</td><td>limitée (≈ 80 à 150 °C)</td><td>celle du métal (desserrage possible)</td></tr>
    <tr><td>série, automatisation</td><td>robots en grande série ; manuel en petite série</td><td>bonne</td><td>bonne, mais temps de prise</td><td>bonne</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — assembler deux tôles d'acier de 1 mm sur 1 m</strong>
    <ol>
      <li>Points de soudure au pas de 40 mm : 25 points, environ 2 s chacun au robot, soit 50 s ; pas de consommable ; non étanche.</li>
      <li>Rivets aveugles au même pas : 25 rivets à 0,10 € et environ 8 s de pose chacun, soit 2,50 € et 200 s ; possible sur des tôles revêtues ou avec une tôle d'aluminium.</li>
      <li>Collage : un cordon de colle d'un mètre déposé en quelques dizaines de secondes, étanche, qui répartit les efforts et amortit les vibrations ; mais la colle doit polymériser (en carrosserie, pendant la cuisson de la peinture).</li>
      <li>En carrosserie automobile, on combine souvent points et colle (soudo-collage) : la colle apporte rigidité, étanchéité et tenue en fatigue, les points tiennent les pièces pendant la polymérisation.</li>
    </ol>
  </div>
  <h3>Environnement et fin de vie</h3>
  <ul>
    <li>Un assemblage <strong>démontable</strong> facilite la maintenance (durée de vie prolongée) et le tri des matériaux en fin de vie.</li>
    <li>Souder des pièces <strong>de même matériau</strong> ne gêne pas le recyclage ; coller ou riveter des matériaux différents (aluminium et composite, acier et polymère) le complique.</li>
    <li>Le soudage consomme de l'énergie électrique et des gaz, émet des fumées ; le collage, des solvants pour certaines colles ; le vissage presque rien, mais il ajoute de la masse (vis, brides, surépaisseurs).</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : choisir l'assemblage après avoir dessiné les pièces. Une pièce prévue pour être soudée n'a pas les mêmes bords, épaisseurs et accès qu'une pièce collée ou boulonnée ; changer de mode d'assemblage oblige souvent à redessiner.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Modèles et compléments</h2>
  <div class="intro">Pour la culture et les travaux pratiques ; rien de ce qui suit n'est exigible.</div>
  <h3>Température maximale près d'un cordon (relation d'Adams)</h3>
  <p>Pour une tôle mince d'épaisseur \(t\), soudée en une passe à pleine pénétration avec une énergie nette \(E\) (J/m), la température maximale atteinte à la distance \(y\) de la limite de fusion vérifie \(\dfrac{1}{T_{max} - T_0} = \dfrac{\sqrt{2\pi\mathrm{e}}\,\rho\,c\,t\,y}{E} + \dfrac{1}{T_f - T_0}\) (\(T_0\) : température initiale, \(T_f\) : température de fusion, \(\rho c\) : capacité thermique volumique). C'est la relation qui a servi à tracer la figure du §4 ; elle montre que la largeur de la ZAT est proportionnelle à \(E/t\).</p>
  <h3>Carbone équivalent et soudabilité des aciers</h3>
  <p>L'aptitude d'un acier à tremper dans la ZAT s'estime par un carbone équivalent, par exemple \(CE = \text{C} + \dfrac{\text{Mn}}{6} + \dfrac{\text{Cr} + \text{Mo} + \text{V}}{5} + \dfrac{\text{Ni} + \text{Cu}}{15}\) (teneurs en %). En dessous d'environ 0,40, l'acier se soude sans précaution particulière ; au-dessus, on préchauffe et on utilise des produits d'apport à bas hydrogène.</p>
  <h3>Cisaillement dans un joint collé (modèle de Volkersen)</h3>
  <p>Pour un recouvrement de deux tôles identiques (module \(E\), épaisseur \(e\)) collées par une couche d'épaisseur \(t_a\) et de module de cisaillement \(G_a\), le rapport du cisaillement maximal à la moyenne vaut \(\dfrac{\omega\ell/2}{\tanh(\omega\ell/2)}\), avec \(\omega^2 = \dfrac{2\,G_a}{t_a\,E\,e}\). L'effort supportable tend vers une limite quand \(\ell\) augmente : c'est la figure du §10.</p>
  <h3>Procédés particuliers</h3>
  <ul>
    <li><strong>Soudage par friction-malaxage</strong> : un outil tournant à épaulement et pion malaxe les deux bords à l'état pâteux ; joints sans fusion d'alliages d'aluminium réputés insoudables (panneaux de trains, fuselages, réservoirs).</li>
    <li><strong>Soudage hybride laser-arc</strong>, <strong>soudage par ultrasons</strong> (polymères, fils électriques), <strong>soudage par diffusion</strong> (titane, sans fusion, sous pression et à chaud).</li>
    <li><strong>Méthode directionnelle</strong> des règles de calcul des charpentes métalliques : décomposition de la contrainte dans le plan de gorge en composantes normale et tangentielles, plus précise que la méthode simplifiée du §7.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ASSEMBLAGE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à choisir et justifier un mode d'assemblage, à préparer un joint soudé, à anticiper ses effets sur la pièce et à vérifier un cordon, un rivetage, un collage ou un assemblage par adhérence par une contrainte moyenne. Tout le chapitre relève de la 2ᵉ année (S3 et S4), vu ici en avance ; les valeurs admissibles sont toujours fournies.</div>

  <div class="method-box"><strong>Méthode 1 — Choisir un mode d'assemblage</strong>
    <ol>
      <li><strong>Démontable ?</strong> Oui (maintenance, réglage, transport, fin de vie) : vis, boulons, goupilles, clavettes. Non : soudage, rivetage, collage, frettage.</li>
      <li><strong>Matériaux</strong> : mêmes métaux soudables → soudage possible ; matériaux différents, revêtus ou non soudables → rivetage, collage, vissage.</li>
      <li><strong>Efforts</strong> : intensité, direction, charges répétées (fatigue) ; une colle doit travailler en cisaillement, une vis en traction.</li>
      <li><strong>Autres exigences</strong> : étanchéité (soudage, collage), température (pas de colle au-delà de 100 à 150 °C environ), aspect, accessibilité d'une ou des deux faces.</li>
      <li><strong>Série et coût</strong>, puis <strong>environnement</strong> (énergie, tri des matériaux en fin de vie).</li>
    </ol>
    <p><em>Exemple éclair :</em> un réservoir en acier sous pression : soudage (étanche, même matériau) ; un carénage composite sur un cadre en aluminium : collage ou rivets aveugles ; un couvercle de carter à ouvrir en maintenance : vis avec joint d'étanchéité.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Calculer une énergie de soudage et l'interpréter</strong>
    <ol>
      <li>Relever tension \(U\), intensité \(I\), vitesse d'avance \(v\) et rendement \(\eta\) (environ 0,8 en MAG et à l'électrode enrobée, 0,6 en TIG).</li>
      <li>Calculer \(E = \eta\,U\,I/v\), en J/mm.</li>
      <li>Interpréter : plus \(E\) est grande, plus la pénétration, la ZAT et les déformations sont grandes, et plus le refroidissement est lent ; plus elle est faible, plus la ZAT est étroite mais trempe facilement.</li>
    </ol>
    <p><em>Exemple éclair :</em> MAG à 26 V, 240 A, 6 mm/s : \(E = 0{,}8 \times 26 \times 240/6 \approx 830\) J/mm. En passant à 9 mm/s, \(E \approx 550\) J/mm : la ZAT rétrécit d'un tiers environ, mais on risque un manque de pénétration.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Choisir le joint et la préparation des bords</strong>
    <ol>
      <li>Repérer la disposition des pièces : prolongement (bout à bout), une contre l'autre (angle, en T), superposées (à clin).</li>
      <li>Pour un bout à bout, choisir la préparation selon l'épaisseur : bords droits jusqu'à 3 à 4 mm, V de 4 à 20 mm, X au-delà d'environ 15 mm si les deux faces sont accessibles, U pour les très fortes épaisseurs.</li>
      <li>Vérifier l'accès de la torche (environ 45°) et le nombre de faces accessibles.</li>
      <li>Préférer la préparation qui minimise le métal déposé et équilibre le retrait.</li>
    </ol>
    <p><em>Exemple éclair :</em> tôle de 3 mm : bords droits avec un jeu ; tôle de 12 mm soudable d'un seul côté (fond de réservoir) : V à 60° ; tôle de 25 mm retournable : X, deux fois moins de métal qu'en V et peu de déformation angulaire.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Estimer le métal déposé et le temps de soudage</strong>
    <ol>
      <li>Calculer la section du joint : géométrie du chanfrein (\(h^2 \tan(\theta/2)\) par V de hauteur \(h\) et d'angle \(\theta\), plus jeu × épaisseur), ou \(a^2\) pour un cordon d'angle isocèle de gorge \(a\) (son côté vaut \(a\sqrt 2\) et son aire \(z^2/2 = a^2\)).</li>
      <li>Majorer d'environ 10 % pour la surépaisseur du cordon.</li>
      <li>Multiplier par la masse volumique et la longueur, puis diviser par le taux de dépôt du procédé (environ 2 à 5 kg/h en MAG).</li>
    </ol>
    <p><em>Exemple éclair :</em> un cordon d'angle de gorge 5 mm a une section de 25 mm², 27,5 mm² avec la surépaisseur : 0,22 kg de métal par mètre, soit environ 4,3 minutes de dépôt par mètre à 3 kg/h.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Dimensionner des cordons d'angle</strong>
    <ol>
      <li>Identifier l'effort \(F\) transmis et les cordons qui le reprennent.</li>
      <li>Choisir la gorge : \(a \ge 3\) mm et \(a\) au plus 0,7 fois l'épaisseur de la pièce la plus mince.</li>
      <li>Écrire \(F/(\sum a\,\ell) \le \tau_{adm}\) et en tirer la longueur utile \(\ell\).</li>
      <li>Ajouter environ \(a\) à chaque extrémité (cratères), arrondir ; vérifier aussi les pièces elles-mêmes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(F = 60\) kN, deux cordons de gorge 3 mm, \(\tau_{adm} = 160\) MPa : \(\ell \ge 60\,000/(2 \times 3 \times 160) = 62{,}5\) mm, plus 6 mm : deux cordons de 70 mm.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre la gorge \(a\) et le côté \(z = a\sqrt 2\) du cordon. Sur un dessin de définition, la cote d'un cordon d'angle est en général sa gorge, précédée de la lettre « a ».</div>

  <div class="method-box"><strong>Méthode 6 — Limiter les déformations d'un ensemble soudé</strong>
    <ol>
      <li>Réduire la chaleur et le métal fondu : préparation en X, cordons justes suffisants, procédé concentré.</li>
      <li>Équilibrer : cordons symétriques par rapport aux axes de la pièce, passes alternées des deux côtés d'un X ou d'une âme.</li>
      <li>Fixer avant de souder : pointage, gabarit de bridage, prédéformation inverse.</li>
      <li>Choisir la séquence : du centre vers les extrémités, passes courtes alternées.</li>
      <li>Après soudage : recuit de détente si besoin, puis usinage des surfaces précises.</li>
    </ol>
    <p><em>Exemple éclair :</em> une poutre en I reconstituée (âme et deux semelles soudées) se cintre si l'on soude d'abord les deux cordons de la semelle supérieure : on soude les quatre cordons en alternant haut et bas, dans le même sens, chacun en plusieurs tronçons.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Critiquer le dessin d'un ensemble soudé</strong>
    <ol>
      <li>Chaque cordon est-il <strong>accessible</strong> et nécessaire ? Une tôle pliée ou un profilé du commerce le supprimerait-il ?</li>
      <li>Les cordons sont-ils <strong>hors des zones les plus sollicitées</strong> (encastrements, changements de section, moment maximal), sans croisement ni accumulation ?</li>
      <li>Les épaisseurs assemblées sont-elles <strong>voisines</strong> ? Les matériaux soudables ?</li>
      <li>Les cordons sont-ils <strong>symétriques</strong> ? Les surfaces précises seront-elles usinées <strong>après</strong> soudage ?</li>
    </ol>
    <p><em>Exemple éclair :</em> une patte de 4 mm soudée sur un moyeu de 40 mm, au ras d'un alésage déjà usiné, par un seul cordon : épaisseurs trop différentes, alésage déformé, cordon dissymétrique. Mieux : un moyeu à collerette usiné après soudage, une patte plus épaisse, deux cordons opposés.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Vérifier un assemblage riveté</strong>
    <ol>
      <li>Compter les rivets \(n\) et les plans de cisaillement \(m\) par rivet (1 à clin, 2 avec deux couvre-joints).</li>
      <li>Cisaillement : \(\tau = F/(n\,m\,\pi d^2/4) \le \tau_{adm}\).</li>
      <li>Matage dans la tôle la plus mince (ou la plus chargée) : \(p = F/(n\,d\,e) \le p_{adm}\).</li>
      <li>Placer les rivets : pince d'au moins 1,5 à 2 \(d\), pas d'au moins 3 \(d\).</li>
    </ol>
    <p><em>Exemple éclair :</em> 8 kN par deux couvre-joints, rivets de Ø 5 mm (\(\tau_{adm} = 90\) MPa), tôle centrale de 3 mm (\(p_{adm} = 150\) MPa). Le cisaillement demande au moins 2,3 rivets, mais avec 3 rivets le matage atteint \(8\,000/(3 \times 5 \times 3) \approx 178\) MPa : il en faut 4 (133 MPa).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Concevoir et vérifier un joint collé</strong>
    <ol>
      <li>Disposer le joint pour que la colle travaille en <strong>cisaillement</strong> (recouvrement, emmanchement), jamais au pelage ni au clivage.</li>
      <li>Calculer la surface collée \(S\) et vérifier \(F/S \le \tau_{adm}\) (valeur de calcul fournie).</li>
      <li>Préférer élargir le joint plutôt que l'allonger beaucoup ; adoucir les extrémités.</li>
      <li>Prévoir la préparation des surfaces, le temps de polymérisation et la température de service.</li>
    </ol>
    <p><em>Exemple éclair :</em> un tube de Ø 25 mm collé dans un manchon doit tenir 5 kN en traction, \(\tau_{adm} = 6\) MPa : \(\ell \ge 5\,000/(\pi \times 25 \times 6) \approx 10{,}6\) mm ; on retient 15 à 20 mm.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Dimensionner un assemblage par adhérence</strong>
    <ol>
      <li>Vissage : calculer la précharge \(F_0\) d'une vis (par exemple 70 % de \(R_e A_s\)), puis le nombre de vis tel que \(f\,n_f\,n\,F_0 \ge T\) (effort transversal à transmettre).</li>
      <li>Vérifier la vis en traction : \(F_v/A_s \le R_e/s\).</li>
      <li>Frettage : calculer l'échauffement de montage \(\Delta T = (\delta + j)/(\alpha D)\) ; vérifier qu'il reste modéré (pas d'altération d'un traitement thermique, en pratique moins de 200 °C environ pour une pièce trempée et revenue).</li>
    </ol>
    <p><em>Exemple éclair :</em> vis M10 de classe 8.8 (\(A_s = 58\ \text{mm}^2\)) : \(F_0 = 0{,}7 \times 640 \times 58 \approx 26\) kN ; pour transmettre 10 kN avec \(f = 0{,}15\), il faut \(n \ge 10/(0{,}15 \times 26) \approx 2{,}6\), soit 3 vis. Un moyeu de Ø 40 mm fretté avec 45 µm de serrage et 30 µm de jeu de montage se chauffe de \(0{,}075/(12\cdot10^{-6} \times 40) \approx 156\) K.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Démontable ou permanent ?</h3>
  <div class="statement">Classer chaque liaison en démontable ou permanente, et dire par quel principe passent les efforts (obstacle, adhérence, continuité de matière, adhésion).</div>
  <div class="q"><strong>Q1.</strong> Assemblage boulonné d'une bride.</div>
  <div class="q"><strong>Q2.</strong> Cordon de soudure entre deux tôles.</div>
  <div class="q"><strong>Q3.</strong> Moyeu fretté sur un arbre.</div>

  <h3>Potence de palan d'atelier : soudée ou en kit ?</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème : conception et industrialisation d'un ensemble mécanosoudé). Pour t'entraîner sur les sujets réels :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une potence d'atelier porte un palan. Sa <strong>colonne</strong> est un tube carré de 120 × 120 mm et d'épaisseur 6 mm, en acier S235 ; elle est soudée sur une <strong>platine</strong> de 300 × 300 × 20 mm, fixée au sol. Le palan, de capacité \(F = 5\) kN, est suspendu au bout d'un bras, à 1,5 m de l'axe de la colonne : au pied de la colonne, la liaison avec la platine doit transmettre un moment \(M = F \times 1{,}5\) m (l'effort vertical est négligeable devant lui).
    <br>Données : soudage MAG à 25 V, 220 A, 6 mm/s, rendement 0,8 ; cordons d'angle tout autour du tube ; on admet que la contrainte maximale dans la gorge des cordons vaut \(M/W_g\) avec \(W_g = \frac{4}{3}\,a\,b^2\) (\(b = 120\) mm : côté du tube, \(a\) : gorge) ; \(\tau_{adm} = 180\) MPa ; règles : \(3 \le a \le 0{,}7\,e_{\min}\) ; taux de dépôt 3 kg/h, surépaisseur 10 %.
  </div>

  <p class="exo-part">Partie A — Réaliser la soudure colonne–platine</p>
  <div class="q"><strong>A1.</strong> Calculer l'énergie de soudage. Les deux pièces ont des épaisseurs de 6 et 20 mm : quelle difficulté cela pose-t-il ? Faut-il préchauffer cet acier ?</div>
  <div class="q"><strong>A2.</strong> Avec des cordons de gorge 4 mm sur tout le périmètre du tube, calculer la masse de métal déposé et le temps de dépôt.</div>

  <p class="exo-part">Partie B — Vérifier les cordons</p>
  <div class="q"><strong>B1.</strong> Vérifier la tenue des cordons de gorge 4 mm sous la charge nominale.</div>
  <div class="q"><strong>B2.</strong> Le client veut un palan de 10 kN. Les cordons tiennent-ils ? Peut-on simplement augmenter la gorge ? Proposer deux solutions.</div>

  <p class="exo-part">Partie C — Déformations et finition</p>
  <div class="q"><strong>C1.</strong> Quelle déformation de la platine faut-il craindre après soudage ? Quelles conséquences pour la pose au sol et la verticalité de la colonne ?</div>
  <div class="q"><strong>C2.</strong> Proposer une méthode de fabrication qui limite ces défauts.</div>

  <p class="exo-part">Partie D — Version en kit</p>
  <div class="q"><strong>D1.</strong> Pour livrer la potence en kit, on soude une seconde platine au pied de la colonne et on la boulonne sur la platine de sol par 4 vis M16 de classe 8.8 (\(A_s = 157\ \text{mm}^2\), \(R_e = 640\) MPa), disposées en deux rangées distantes de 200 mm. On admet que le moment est repris par la traction des deux vis d'une rangée, avec un bras de levier de 200 mm. Vérifier ces vis avec un coefficient de sécurité de 2 (charge de 5 kN).</div>
  <div class="q"><strong>D2.</strong> Comparer les deux versions (soudée d'une pièce, en kit) selon trois critères, dont un environnemental.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(E = 0{,}8 \times 25 \times 220/6 \approx 730\) J/mm. La platine de 20 mm, massive, absorbe la chaleur : elle fond moins facilement que le tube de 6 mm, qui risque d'être percé ou « brûlé » ; il faut orienter l'arc vers la platine et choisir l'énergie en conséquence. La ZAT de la platine refroidit vite ; pour un acier S235, pauvre en carbone, ce n'est pas gênant (pas de trempe) : pas de préchauffage nécessaire, sauf temps très froid. Un acier riche en carbone, lui, devrait être préchauffé.</p>
    <p><strong>A2.</strong> Section d'un cordon d'angle de gorge 4 : \(a^2 = 16\ \text{mm}^2\), 17,6 mm² avec la surépaisseur ; longueur 480 mm ; volume \(\approx 8\,450\ \text{mm}^3\), soit environ 66 g ; à 3 kg/h, environ 1,3 minute d'arc (sans compter le pointage et le nettoyage).</p>
    <p><strong>B1.</strong> \(M = 5\,000 \times 1\,500 = 7{,}5\cdot10^6\) N·mm ; \(W_g = \frac{4}{3} \times 4 \times 120^2 = 76\,800\ \text{mm}^3\) ; contrainte \(\approx 98\) MPa \(\le 180\) MPa : les cordons tiennent avec une bonne marge.</p>
    <p><strong>B2.</strong> Sous 10 kN, \(M\) double : \(\approx 195\) MPa \(\gt 180\) MPa. Il faudrait \(a = 5\) mm (156 MPa), mais la gorge est limitée à \(0{,}7 \times 6 = 4{,}2\) mm par le tube (et même avec 4,2 mm : 186 MPa). Solutions : souder quatre <strong>goussets</strong> verticaux entre la colonne et la platine, qui éloignent la matière des cordons de l'axe neutre ; ou prendre un tube plus grand et plus épais (par exemple 140 × 140 × 8 mm : avec \(a = 5\) mm, environ 115 MPa).</p>
    <p><strong>C1.</strong> Les cordons, tous sur la face supérieure, se rétractent en refroidissant : la platine se cintre en cuvette (ses bords se relèvent) et la colonne peut s'incliner si les cordons ne sont pas équilibrés. La platine ne porte plus à plat sur le sol (appui sur quelques points, scellement difficile) et le bras n'est plus horizontal.</p>
    <p><strong>C2.</strong> Pointer la colonne aux quatre coins en vérifiant sa perpendicularité ; brider la platine sur un marbre ; souder les quatre côtés en alternant les côtés opposés, par passes courtes ; éventuellement prédéformer la platine ; dresser enfin la face d'appui (ou prévoir des cales et un scellement à la résine).</p>
    <p><strong>D1.</strong> Traction dans une vis : \(F_v = \dfrac{M}{0{,}2 \times 2} = \dfrac{7\,500}{0{,}4} \approx 18{,}8\) kN ; \(\sigma = 18\,750/157 \approx 119\) MPa \(\le R_e/2 = 320\) MPa : les vis conviennent largement (en pratique, la précharge, de l'ordre de 70 kN par vis, et la flexion des platines modifient ce calcul simplifié).</p>
    <p><strong>D2.</strong> Transport et montage : le kit se transporte et s'installe plus facilement, la version soudée demande une manutention d'une pièce encombrante. Coût et rigidité : la version soudée d'une pièce est moins chère (une platine et quatre vis en moins) et sans risque de desserrage ; le kit ajoute une platine, des perçages et un contrôle du serrage. Environnement et fin de vie : le kit se démonte, se répare, se déplace dans un autre atelier ; les deux versions, tout acier, se recyclent bien, mais le kit consomme plus de matière (seconde platine).</p>
  </div>
