  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la première ligne de la partie 1.5 « Filtrage linéaire » du programme de PTSI (signaux périodiques) et les capacités expérimentales qui s'y rattachent (mesures de temps et de fréquences, déphasage, nature d'une mesure électrique, analyse spectrale). Il prépare le chapitre « Régime sinusoïdal forcé et filtrage linéaire », qui expose le régime sinusoïdal forcé, les impédances complexes et l'action d'un filtre sur un signal périodique : on n'y refait pas ici la notation complexe. Le programme insiste : la décomposition d'un signal en sinusoïdes est <strong>fournie</strong> ; on l'exploite, on ne la calcule pas.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Décalage temporel et déphasage</strong> : reconnaître une avance ou un retard de phase ; passer d'un décalage temporel à un déphasage et inversement ; repérer précisément le passage par un déphasage nul, en mode XY (§2).</li>
        <li><strong>Valeur moyenne et valeur efficace</strong> : les définir ; établir par le calcul la valeur efficace d'un signal sinusoïdal (§3, §4).</li>

<div class="course-section">
  <div class="sec-num">§1 · SIGNAUX PÉRIODIQUES ET SINUSOÏDAUX</div>
  <h2>Période, fréquence, pulsation, amplitude, phase</h2>
  <div class="intro">Tension du secteur, son d'un instrument, battement du cœur, horloge d'un microprocesseur : beaucoup de signaux se répètent identiques à eux-mêmes. Le plus simple d'entre eux, le signal sinusoïdal, sert de brique à tous les autres (§6) et c'est lui que les filtres savent traiter simplement.</div>
  <div class="def-box">
    Un signal \(s(t)\) est <strong>périodique</strong> s'il existe une durée \(T \gt 0\) telle que \(s(t + T) = s(t)\) pour tout \(t\) ; la plus petite de ces durées est la <strong>période</strong> \(T\) (en s). On lui associe la <strong>fréquence</strong> \(f = 1/T\) (en hertz, Hz, nombre de périodes par seconde) et la <strong>pulsation</strong> \(\omega = 2\pi f = 2\pi/T\) (en \(\text{rad·s}^{-1}\)).
  </div>

<figcaption>Un signal périodique se reproduit identique à lui-même après chaque période \(T\), mesurée entre deux points homologues (ici deux maximums successifs). Sa valeur moyenne \(\langle s\rangle\) (tirets) est la hauteur du rectangle de même aire sur une période ; l'écart \(s_{\max} - s_{\min}\) est la valeur crête à crête.</figcaption>

  <div class="def-box">
    Un signal <strong>sinusoïdal</strong> s'écrit
    <div class="formula" data-nom="Signal sinusoïdal">$$s(t) = S_m\cos(\omega t + \varphi)$$</div>
    avec \(S_m \gt 0\) l'<strong>amplitude</strong>, \(\omega t + \varphi\) la <strong>phase</strong> (en radians) et \(\varphi\) la <strong>phase à l'origine</strong>, définie à \(2\pi\) près (on la choisit en général dans \(]-\pi, \pi]\)). Le signal oscille entre \(-S_m\) et \(+S_m\) : sa valeur crête à crête vaut \(2S_m\).
  </div>
  <p>Un sinus est un cosinus déphasé : \(\sin x = \cos(x - \pi/2)\). On peut donc toujours se ramener à la forme en cosinus, ce que fait la notation complexe du chapitre « Filtres ».</p>
  <h3>Ordres de grandeur</h3>
  <div class="table-wrap"><table>
    <tr><th>Signal</th><th>Fréquence</th></tr>
    <tr><td>Battement du cœur au repos</td><td>≈ 1 Hz</td></tr>
    <tr><td>Réseau électrique européen</td><td>50 Hz (230 V efficaces)</td></tr>
    <tr><td>Sons audibles par l'oreille humaine</td><td>20 Hz à 20 kHz (le « la » du diapason : 440 Hz)</td></tr>
    <tr><td>Ultrasons de l'échographie médicale</td><td>1 à 15 MHz</td></tr>
    <tr><td>Radio FM</td><td>88 à 108 MHz</td></tr>
    <tr><td>Wifi, four à micro-ondes</td><td>2,4 GHz</td></tr>
    <tr><td>Lumière visible</td><td>4 à 7,5 \(\times10^{14}\) Hz</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — lire un oscillogramme</strong>
    <p>Sur l'écran d'un oscilloscope réglé à 0,25 ms par division horizontalement et 0,5 V par division verticalement, cinq périodes d'une tension sinusoïdale occupent 8,0 divisions et l'écart entre le maximum et le minimum vaut 5,6 divisions.</p>
    <ol>
      <li>Période : \(T = \dfrac{8{,}0 \times 0{,}25\ \text{ms}}{5} = 0{,}40\ \text{ms}\) (mesurer plusieurs périodes réduit l'erreur de lecture relative).</li>
      <li>Fréquence et pulsation : \(f = 1/T = 2{,}5\ \text{kHz}\) ; \(\omega = 2\pi f \approx 1{,}6\times10^4\ \text{rad·s}^{-1}\).</li>
      <li>Valeur crête à crête : \(5{,}6 \times 0{,}5 = 2{,}8\ \text{V}\) ; amplitude \(S_m = 1{,}4\ \text{V}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre fréquence et pulsation. \(\omega = 2\pi f\) : un signal à 50 Hz a pour pulsation \(314\ \text{rad·s}^{-1}\), pas 50. Autre confusion fréquente : l'amplitude \(S_m\) est la moitié de la valeur crête à crête lue sur l'écran.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · DÉPHASAGE ET DÉCALAGE TEMPOREL</div>
  <h2>Qui est en avance sur qui ?</h2>
  <div class="intro">Un filtre, une bobine, un condensateur ne modifient pas seulement l'amplitude d'un signal sinusoïdal : ils le décalent dans le temps. Ce décalage se traduit par un déphasage, que l'on mesure à l'oscilloscope et que la fonction de transfert prévoit (chapitre « Filtres », §4).</div>
  <div class="def-box">
    Soit deux signaux de même pulsation \(s_1 = S_1\cos(\omega t + \varphi_1)\) et \(s_2 = S_2\cos(\omega t + \varphi_2)\). Le <strong>déphasage de \(s_2\) par rapport à \(s_1\)</strong> est \(\varphi = \varphi_2 - \varphi_1\), ramené dans \(]-\pi, \pi]\).
    <ul>
      <li>\(\varphi \gt 0\) : \(s_2\) est <strong>en avance</strong> sur \(s_1\) (il passe par son maximum avant lui) ;</li>
      <li>\(\varphi \lt 0\) : \(s_2\) est <strong>en retard</strong> sur \(s_1\) ;</li>
      <li>\(\varphi = 0\) : en phase ; \(\varphi = \pm\pi/2\) : en quadrature (avance ou retard) ; \(\varphi = \pi\) : en opposition de phase.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Décalage temporel et déphasage.</strong> Si le maximum de \(s_2\) arrive \(\Delta t\) avant celui de \(s_1\) (\(\Delta t \gt 0\) pour une avance, \(\Delta t \lt 0\) pour un retard, avec \(|\Delta t| \leq T/2\)), alors
    <div class="formula" data-nom="Déphasage et décalage temporel">$$\varphi = \omega\,\Delta t = 2\pi\,\frac{\Delta t}{T}$$</div>
    En degrés : \(\varphi = 360^\circ \times \Delta t/T\). En effet \(s_2(t) = S_2\cos\big(\omega(t + \Delta t) + \varphi_1\big)\) reproduit la forme de \(s_1\) avec \(\Delta t\) d'avance.
  </div>

  <div class="method-box">
    <strong>Exemple — avance ou retard ?</strong>
    <p>Deux tensions de fréquence 2,0 kHz ; le maximum de \(u_2\) suit celui de \(u_1\) de 0,10 ms.</p>
    <ol>
      <li>\(T = 0{,}50\ \text{ms}\) ; \(|\Delta t| = 0{,}10\ \text{ms} \leq T/2\) : c'est bien le décalage le plus court.</li>
      <li>\(u_2\) arrive après : il est en retard, \(\Delta t = -0{,}10\ \text{ms}\).</li>
      <li>\(\varphi = 2\pi \times (-0{,}10)/0{,}50 = -0{,}40\,\pi \approx -1{,}26\ \text{rad}\), soit \(-72^\circ\).</li>
    </ol>
  </div>
  <h3>Le mode XY de l'oscilloscope</h3>
  <p>En mode XY, l'oscilloscope trace \(s_2\) (verticalement) en fonction de \(s_1\) (horizontalement). Pour deux signaux sinusoïdaux de même fréquence, on obtient une ellipse. Elle dégénère en un <strong>segment</strong> quand les signaux sont en phase (pente positive) ou en opposition (pente négative). Un segment est très facile à repérer à l'œil, beaucoup plus qu'un décalage temporel nul entre deux courbes : c'est la méthode précise pour trouver la fréquence où un déphasage s'annule (résonance d'un passe-bande, par exemple).</p>

<figcaption>En mode XY, l'oscilloscope trace \(s_2\) en fonction de \(s_1\) (ici de même amplitude \(Y\)). On obtient une ellipse, qui s'aplatit en segment pour \(\varphi = 0\) (pente positive) ou \(\varphi = \pi\) (pente négative) : c'est la façon la plus précise de repérer le passage par un déphasage nul. L'ellipse coupe l'axe vertical en \(\pm y_0\) avec \(|\sin\varphi| = y_0/Y\) ; le signe de \(\varphi\) ne se lit pas sur l'ellipse.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — déphasage lu sur une ellipse</strong>
    <p>Avec \(s_1 = X\cos\omega t\) et \(s_2 = Y\cos(\omega t + \varphi)\), l'ellipse coupe l'axe vertical (\(s_1 = 0\), donc \(\omega t = \pm\pi/2\)) en \(s_2 = \mp Y\sin\varphi\). Sur l'écran, l'ellipse s'étend verticalement de \(-2{,}0\) à \(+2{,}0\) divisions et coupe l'axe vertical en \(\pm1{,}2\) division.</p>
    <ol>
      <li>\(|\sin\varphi| = 1{,}2/2{,}0 = 0{,}60\), donc \(|\varphi| = 37^\circ\) ou \(143^\circ\).</li>
      <li>Le grand axe de l'ellipse monte vers la droite : \(\cos\varphi \gt 0\), donc \(|\varphi| = 37^\circ\).</li>
      <li>Le signe de \(\varphi\) (avance ou retard) ne se lit pas sur l'ellipse figée : on revient au mode temporel.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : se tromper de signe. Le signal dont le maximum arrive <strong>en premier</strong> est en avance. Et le décalage se mesure entre points homologues : deux maximums, ou deux passages par zéro dans le même sens (montant pour les deux), en prenant le plus court des décalages possibles.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · VALEUR MOYENNE</div>
  <h2>La composante continue d'un signal</h2>
  <div class="intro">Une tension issue d'un redresseur, d'un hacheur ou d'un capteur oscille autour d'une valeur centrale. Cette valeur moyenne est ce qu'indique un voltmètre en position continue (DC), et c'est elle que garde un filtre moyenneur (chapitre « Filtres », §9).</div>
  <div class="def-box">
    La <strong>valeur moyenne</strong> d'un signal périodique de période \(T\) est
    <div class="formula" data-nom="Valeur moyenne">$$\langle s\rangle = \frac{1}{T}\int_{t_0}^{t_0+T} s(t)\,\mathrm{d}t$$</div>
    quel que soit \(t_0\). Géométriquement, c'est l'aire algébrique sous la courbe sur une période (aires au-dessus de l'axe comptées positivement, au-dessous négativement), divisée par \(T\). On écrit \(s = \langle s\rangle + s_\sim\) : composante continue plus <strong>composante alternative</strong> \(s_\sim\), de moyenne nulle.
  </div>
  <ul>
    <li>La moyenne est linéaire : \(\langle a s_1 + b s_2\rangle = a\langle s_1\rangle + b\langle s_2\rangle\).</li>
    <li>Une sinusoïde a une moyenne nulle : sur une période, les aires positive et négative se compensent.</li>
    <li>Créneau valant \(E\) pendant \(\alpha T\) et 0 pendant le reste de la période (\(\alpha\) : <strong>rapport cyclique</strong>) : \(\langle s\rangle = \alpha E\). C'est le principe du hacheur, qui règle une tension moyenne par \(\alpha\) (chapitre de SI « Les hacheurs »).</li>
    <li>Sinus redressé double alternance \(|S_m\cos\omega t|\) : \(\langle s\rangle = 2S_m/\pi \approx 0{,}64\,S_m\) ; simple alternance (on ne garde que les alternances positives) : \(S_m/\pi\).</li>
  </ul>
  <div class="prop-box">
    <strong>Moyenne d'une dérivée.</strong> Si \(s\) est périodique, \(\left\langle \dfrac{\mathrm{d}s}{\mathrm{d}t}\right\rangle = \dfrac{s(t_0+T) - s(t_0)}{T} = 0\). Conséquences en régime périodique établi : la tension moyenne aux bornes d'une bobine idéale est nulle (\(u_L = L\,\mathrm{d}i/\mathrm{d}t\)), et le courant moyen dans un condensateur aussi (\(i = C\,\mathrm{d}u/\mathrm{d}t\)).
  </div>
  <div class="method-box">
    <strong>Exemple — tension redressée du secteur</strong>
    <p>Un pont de diodes idéal redresse la tension du secteur, de valeur efficace 230 V, en double alternance.</p>
    <ol>
      <li>Amplitude : \(S_m = 230\sqrt2 \approx 325\ \text{V}\) (§4).</li>
      <li>Le signal a pour période \(T/2\) ; on intègre sur l'arche de \(-T/4\) à \(T/4\) :
      <div class="formula">$$\langle s\rangle = \frac{2}{T}\int_{-T/4}^{T/4} S_m\cos\omega t\,\mathrm{d}t = \frac{2S_m}{\omega T}\Big[\sin\omega t\Big]_{-T/4}^{T/4} = \frac{2S_m}{\pi}$$</div></li>
      <li>\(\langle s\rangle \approx 207\ \text{V}\) : c'est la tension continue que l'on obtiendrait en ne gardant que la composante continue (par un filtre passe-bas). En simple alternance, on n'aurait que 104 V.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que la moyenne d'un signal vaut la moitié de la somme de son maximum et de son minimum. C'est vrai pour un signal symétrique (sinusoïde, triangle, carré), faux en général : un créneau 0 / 10 V de rapport cyclique 0,2 a une moyenne de 2 V, pas 5 V.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · VALEUR EFFICACE</div>
  <h2>La valeur qui chauffe</h2>
  <div class="intro">Une tension alternative de moyenne nulle chauffe pourtant une résistance. La valeur efficace mesure cet effet : c'est la tension continue qui dissiperait la même puissance moyenne. C'est la grandeur affichée par les appareils « RMS » et celle qu'indiquent les plaques signalétiques (230 V pour le secteur).</div>
  <div class="def-box">
    La <strong>valeur efficace</strong> (en anglais <em>root mean square</em>, RMS : racine de la moyenne du carré) d'un signal périodique est
    <div class="formula" data-nom="Valeur efficace">$$S_{\text{eff}} = \sqrt{\langle s^2\rangle} = \sqrt{\frac{1}{T}\int_{t_0}^{t_0+T} s^2(t)\,\mathrm{d}t}$$</div>
  </div>
  <p><strong>Sens physique.</strong> Une tension \(u(t)\) aux bornes d'une résistance \(R\) y dissipe la puissance \(u^2/R\), de moyenne \(\langle u^2\rangle/R = U_{\text{eff}}^2/R\). Une tension continue \(U_{\text{eff}}\) dissiperait exactement la même puissance : même échauffement, même énergie consommée sur une période.</p>
  <div class="prop-box">
    <strong>Valeur efficace d'une sinusoïde.</strong> Pour \(s = S_m\cos(\omega t + \varphi)\) :
    <div class="formula" data-nom="Valeur efficace d'une sinusoïde">$$S_{\text{eff}} = \frac{S_m}{\sqrt2} \approx 0{,}707\,S_m$$</div>
    quels que soient la fréquence et la phase à l'origine.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir \(S_{\text{eff}} = S_m/\sqrt2\)</span>
    <div class="content">
      <div class="formula">$$s^2 = S_m^2\cos^2(\omega t + \varphi) = \frac{S_m^2}{2}\big(1 + \cos(2\omega t + 2\varphi)\big)$$</div>
      <p>Sur une période \(T\), le terme \(\cos(2\omega t + 2\varphi)\) parcourt deux périodes complètes : sa moyenne est nulle. Donc \(\langle s^2\rangle = S_m^2/2\) et \(S_{\text{eff}} = S_m/\sqrt2\).</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Composante continue et composante alternative.</strong> Pour \(s = \langle s\rangle + s_\sim\) :
    <div class="formula" data-nom="Valeur efficace avec composante continue">$$S_{\text{eff}}^2 = \langle s\rangle^2 + S_{\sim\text{eff}}^2$$</div>
    En effet, en développant \((\langle s\rangle + s_\sim)^2\) et en prenant la moyenne, le terme croisé \(2\langle s\rangle\langle s_\sim\rangle\) est nul car \(\langle s_\sim\rangle = 0\). Conséquence : \(S_{\text{eff}} \geq |\langle s\rangle|\), avec égalité seulement pour un signal constant.
  </div>
  <p>Le <strong>facteur de crête</strong> \(k_c = s_{\max}/S_{\text{eff}}\) dit si le signal présente des pointes : \(\sqrt2\) pour une sinusoïde, 1 pour un carré, \(\sqrt3\) pour un triangle. Un appareil de mesure doit pouvoir encaisser ces pointes sans saturer.</p>
  <div class="method-box">
    <strong>Exemple — puissance dans un radiateur commandé par créneaux</strong>
    <p>Une résistance chauffante \(R = 10\ \Omega\) reçoit une tension en créneaux : 12 V pendant un quart de période, 0 V ensuite (\(\alpha = 0{,}25\)).</p>
    <ol>
      <li>\(\langle u\rangle = \alpha E = 3{,}0\ \text{V}\) ; \(U_{\text{eff}} = E\sqrt\alpha = 12 \times 0{,}5 = 6{,}0\ \text{V}\).</li>
      <li>Puissance moyenne : \(\langle P\rangle = U_{\text{eff}}^2/R = 3{,}6\ \text{W}\) (c'est aussi \(\alpha E^2/R\) : 14,4 W pendant un quart du temps).</li>
      <li>Le calcul faux \(\langle u\rangle^2/R = 0{,}9\ \text{W}\) sous-estime la puissance d'un facteur 4.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : \(\langle s^2\rangle \neq \langle s\rangle^2\). La puissance se calcule avec la valeur efficace, jamais avec la valeur moyenne. Et les valeurs efficaces ne s'ajoutent pas : deux tensions sinusoïdales de 1 V efficace et de fréquences différentes donnent une somme de \(\sqrt2\ \text{V}\) efficaces, pas 2 V (§7).</div>
  <p><strong>Ordre de grandeur.</strong> Le secteur délivre 230 V efficaces : l'amplitude vaut \(230\sqrt2 \approx 325\ \text{V}\) et la tension crête à crête 650 V. C'est cette valeur crête que doivent supporter les isolants et les condensateurs branchés sur le secteur.</p>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MESURER : CE QU'AFFICHE UN APPAREIL</div>
  <h2>Nature d'une mesure</h2>
  <div class="intro">Un même signal donne des nombres différents selon l'appareil et sa position. Savoir ce qu'il mesure (moyenne, efficace, amplitude, crête à crête) est la première question d'un compte rendu de TP.</div>
  <h3>L'oscilloscope</h3>
  <ul>
    <li>Il montre le signal lui-même : on y lit des durées (période, décalage) et des tensions (amplitude, crête à crête). Ses mesures automatiques calculent en plus la moyenne (<em>mean</em>), la valeur efficace (<em>RMS</em>), la fréquence.</li>
    <li><strong>Couplage DC</strong> : le signal entier est affiché. <strong>Couplage AC</strong> : un condensateur d'entrée supprime la composante continue (c'est un filtre passe-haut de fréquence de coupure de l'ordre de 10 Hz) ; on ne voit que \(s_\sim\), ce qui permet d'agrandir une petite ondulation posée sur une grande composante continue.</li>
  </ul>
  <h3>Le multimètre</h3>
  <ul>
    <li>Position <strong>DC</strong> (continu, symbole ⎓) : valeur moyenne \(\langle s\rangle\).</li>
    <li>Position <strong>AC</strong> (alternatif, ∿) : valeur efficace de la composante alternative \(S_{\sim\text{eff}}\).</li>
    <li>Position <strong>AC+DC</strong> : valeur efficace totale \(S_{\text{eff}} = \sqrt{\langle s\rangle^2 + S_{\sim\text{eff}}^2}\) ; on peut aussi la recalculer à partir des deux mesures précédentes.</li>
    <li>Ces valeurs efficaces ne sont justes que sur un appareil <strong>« RMS vrai »</strong> (TRMS), qui calcule réellement \(\sqrt{\langle s^2\rangle}\). Un appareil plus simple mesure la moyenne de \(|s_\sim|\) et la multiplie par \(\pi/(2\sqrt2) \approx 1{,}11\), rapport qui ne vaut que pour une sinusoïde.</li>
    <li>Le multimètre a une bande passante limitée (souvent quelques kHz à quelques dizaines de kHz) : au-delà, sa mesure en AC est fausse. L'oscilloscope monte à plusieurs dizaines de MHz.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — un créneau mesuré de quatre façons</strong>
    <p>Un créneau 0 / 5,0 V de rapport cyclique 0,5 et de fréquence 1 kHz : \(s_\sim\) est un carré \(\pm2{,}5\ \text{V}\).</p>
    <ol>
      <li>DC : \(\langle s\rangle = 2{,}50\ \text{V}\).</li>
      <li>AC, appareil TRMS : \(S_{\sim\text{eff}} = 2{,}50\ \text{V}\) (carré symétrique).</li>
      <li>AC+DC : \(\sqrt{2{,}5^2 + 2{,}5^2} = 3{,}54\ \text{V}\), qui est bien \(E\sqrt\alpha = 5/\sqrt2\).</li>
      <li>AC, appareil non TRMS : \(\langle|s_\sim|\rangle = 2{,}5\ \text{V}\), affiché \(2{,}5 \times 1{,}11 = 2{,}78\ \text{V}\) : 11 % trop haut. Sur un triangle, l'erreur serait d'environ \(-4\) %.</li>
    </ol>
  </div>
  <div class="notice"><strong>À retenir pour le TP</strong> : l'appareil perturbe aussi le circuit. Un oscilloscope ou un multimètre se comporte comme une résistance d'entrée de l'ordre de 1 à 10 MΩ en parallèle sur ce qu'il mesure, et un générateur basse fréquence (GBF) a une résistance de sortie de 50 Ω (chapitre « Lois de l'électrocinétique — régime continu », §10).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DÉCOMPOSITION SPECTRALE D'UN SIGNAL PÉRIODIQUE</div>
  <h2>Tout signal périodique est une somme de sinusoïdes</h2>
  <div class="intro">Un son de violon et un son de flûte de même note n'ont pas la même forme, mais la même période. Leur différence se lit dans leur spectre : la liste des sinusoïdes qui les composent. C'est aussi la clé du filtrage : un filtre linéaire traite chaque sinusoïde séparément (chapitre « Filtres », §8).</div>
  <div class="prop-box">
    <strong>Décomposition en série de Fourier (admise).</strong> Un signal périodique \(s(t)\) de fréquence \(f = 1/T\) et de pulsation \(\omega = 2\pi f\) s'écrit comme la somme d'une constante et de sinusoïdes de fréquences multiples de \(f\) :
    <div class="formula" data-nom="Décomposition spectrale">$$s(t) = S_0 + \sum_{n=1}^{+\infty} S_n\cos(n\omega t + \varphi_n)$$</div>
    <ul>
      <li>\(S_0 = \langle s\rangle\) est la <strong>composante continue</strong> ;</li>
      <li>le terme \(n = 1\), de même fréquence \(f\) que le signal, est le <strong>fondamental</strong> ;</li>
      <li>le terme de rang \(n \geq 2\), de fréquence \(nf\), est l'<strong>harmonique de rang \(n\)</strong> ; \(S_n \geq 0\) est son amplitude et \(\varphi_n\) sa phase à l'origine.</li>
    </ul>
  </div>
  <p>En PTSI, les amplitudes \(S_n\) et les phases \(\varphi_n\) sont <strong>fournies</strong> par l'énoncé, par un tableau ou par un analyseur de spectre ; leur calcul par des intégrales est hors programme (voir « Pour aller plus loin »). Le <strong>spectre en amplitude</strong> représente les \(S_n\) par des raies verticales placées aux fréquences \(0, f, 2f, 3f\)… : un signal périodique a un spectre de raies. Une sinusoïde pure a une seule raie.</p>
  <h3>Trois décompositions à savoir lire</h3>
  <ul>
    <li>Carré symétrique \(\pm E\) : \(s(t) = \dfrac{4E}{\pi}\left[\sin\omega t + \dfrac{\sin 3\omega t}{3} + \dfrac{\sin 5\omega t}{5} + \cdots\right]\) ;</li>
    <li>triangle symétrique \(\pm E\) : \(s(t) = \dfrac{8E}{\pi^2}\left[\cos\omega t + \dfrac{\cos 3\omega t}{9} + \dfrac{\cos 5\omega t}{25} + \cdots\right]\) ;</li>
    <li>dent de scie \(\pm E\) (montée régulière puis chute brutale) : \(s(t) = \dfrac{2E}{\pi}\left[\sin\omega t - \dfrac{\sin 2\omega t}{2} + \dfrac{\sin 3\omega t}{3} - \cdots\right]\).</li>
  </ul>

  <p><strong>Ce que dit un spectre.</strong> Plus un signal varie brutalement, plus ses harmoniques décroissent lentement : en \(1/n\) pour un signal discontinu (carré, dent de scie), en \(1/n^2\) pour un signal continu à pente discontinue (triangle). Transmettre fidèlement des fronts raides exige donc une large bande de fréquences. Un signal qui ne contient que des rangs impairs reprend la même forme, inversée, une demi-période plus tard (\(s(t + T/2) = -s(t)\)) : c'est le cas du carré et du triangle, pas de la dent de scie.</p>
  <p><strong>En acoustique</strong>, la fréquence du fondamental fixe la hauteur de la note, et la répartition des harmoniques le <strong>timbre</strong> de l'instrument. L'oreille perçoit la hauteur \(f\) même quand la raie du fondamental est faible ou absente : elle reconstitue la période commune des harmoniques.</p>
  <div class="method-box">
    <strong>Exemple — exploiter un spectre fourni</strong>
    <p>Un analyseur affiche pour une tension les raies suivantes : 1,0 V à 0 Hz ; 3,0 V à 500 Hz ; 1,0 V à 1 500 Hz ; 0,60 V à 2 500 Hz ; rien d'autre de mesurable. Les phases sont nulles (en cosinus).</p>
    <ol>
      <li>Les fréquences présentes sont des multiples de 500 Hz : \(f = 500\ \text{Hz}\), \(T = 2{,}0\ \text{ms}\). Le signal contient le fondamental et les rangs 3 et 5.</li>
      <li>\(u(t) = 1{,}0 + 3{,}0\cos(\omega t) + 1{,}0\cos(3\omega t) + 0{,}60\cos(5\omega t)\) (en volts), avec \(\omega = 2\pi\times500 \approx 3{,}14\times10^3\ \text{rad·s}^{-1}\).</li>
      <li>Valeur moyenne : la raie à 0 Hz, \(\langle u\rangle = 1{,}0\ \text{V}\). La valeur efficace se calcule au §7.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre la raie la plus haute, ou la première raie, pour le fondamental. La fréquence du signal est le plus grand diviseur commun des fréquences présentes : des raies à 300, 500 et 700 Hz appartiennent à un signal de fréquence 100 Hz, dont le fondamental est absent. Autre remarque : la somme de deux sinusoïdes n'est périodique que si le rapport de leurs fréquences est rationnel ; un signal non périodique a un spectre continu, et non plus de raies.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · VALEUR EFFICACE ET SPECTRE</div>
  <h2>Les puissances des harmoniques s'ajoutent</h2>
  <div class="intro">La valeur efficace se calcule soit à partir de la forme du signal (§4), soit à partir de son spectre. Le second calcul dit en plus comment la puissance se répartit entre les fréquences : c'est ce qui permet de prévoir ce qu'un filtre va laisser passer.</div>
  <div class="prop-box">
    <strong>Valeur efficace et harmoniques.</strong> Pour \(s(t) = S_0 + \sum_{n\geq1} S_n\cos(n\omega t + \varphi_n)\) :
    <div class="formula" data-nom="Valeur efficace et spectre">$$S_{\text{eff}}^2 = S_0^2 + \sum_{n=1}^{+\infty} S_{n,\text{eff}}^2 = S_0^2 + \sum_{n=1}^{+\infty}\frac{S_n^2}{2}$$</div>
    Le carré de la valeur efficace est la somme des carrés des valeurs efficaces de la composante continue et de chaque harmonique. Interprétation : dans une résistance, la puissance moyenne dissipée est la somme des puissances qu'y dissiperait chaque composante seule.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Pourquoi les termes croisés disparaissent</span>
    <div class="content">
      <p>En développant \(s^2\), on obtient les carrés de chaque terme et des termes croisés \(2S_nS_m\cos(n\omega t + \varphi_n)\cos(m\omega t + \varphi_m)\) avec \(n \neq m\). Ce produit est la somme de \(S_nS_m\cos\big((n+m)\omega t + \ldots\big)\) et de \(S_nS_m\cos\big((n-m)\omega t + \ldots\big)\) : deux sinusoïdes de pulsations non nulles, multiples de \(\omega\), dont la moyenne sur \(T\) est nulle. De même \(2S_0S_n\cos(n\omega t + \varphi_n)\) est de moyenne nulle. Il ne reste que \(S_0^2\) et les \(\langle S_n^2\cos^2(\ldots)\rangle = S_n^2/2\). On admet que le calcul reste valable pour une infinité de termes.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — valeur efficace à partir du spectre</strong>
    <p>\(s(t) = 2{,}0 + 3{,}0\cos(\omega t) + 1{,}0\cos(3\omega t + \pi/4)\) (en volts).</p>
    <ol>
      <li>\(S_{\text{eff}}^2 = 2{,}0^2 + \dfrac{3{,}0^2}{2} + \dfrac{1{,}0^2}{2} = 4{,}0 + 4{,}5 + 0{,}5 = 9{,}0\ \text{V}^2\), donc \(S_{\text{eff}} = 3{,}0\ \text{V}\) : la phase \(\pi/4\) ne joue aucun rôle.</li>
      <li>Un multimètre TRMS afficherait 2,0 V en DC, \(\sqrt{5{,}0} \approx 2{,}2\ \text{V}\) en AC et 3,0 V en AC+DC.</li>
      <li>Pour le spectre de l'exemple du §6 : \(1{,}0^2 + (3{,}0^2 + 1{,}0^2 + 0{,}60^2)/2 = 6{,}18\ \text{V}^2\), soit \(U_{\text{eff}} \approx 2{,}5\ \text{V}\).</li>
    </ol>
  </div>
  <h3>Où est la puissance d'un carré ?</h3>
  <p>Pour le carré \(\pm E\), \(S_{\text{eff}}^2 = E^2\) et le fondamental a pour amplitude \(4E/\pi\) : il porte la fraction \(\dfrac{(4E/\pi)^2/2}{E^2} = \dfrac{8}{\pi^2} \approx 81\ \%\) de \(S_{\text{eff}}^2\). Avec les rangs 3 et 5, on atteint 90 % puis 93 % ; les 7 % restants sont répartis sur une infinité d'harmoniques, qui fabriquent les fronts raides. Pour le triangle, le fondamental porte déjà \(96/\pi^4 \approx 98{,}6\ \%\) de \(S_{\text{eff}}^2\). En sommant toutes les raies du carré, on retrouve d'ailleurs \(E^2\) : \(\dfrac{8E^2}{\pi^2}\left(1 + \dfrac19 + \dfrac1{25} + \cdots\right) = E^2\), car la somme des \(1/n^2\) sur les \(n\) impairs vaut \(\pi^2/8\).</p>
  <div class="notice"><strong>Erreur classique</strong> : oublier le facteur \(1/2\) (on somme les carrés des <strong>valeurs efficaces</strong> \(S_n/\sqrt2\), pas des amplitudes), oublier la composante continue, ou ajouter les valeurs efficaces elles-mêmes. Ce sont les carrés qui s'ajoutent, parce que ce sont les puissances.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SYSTÈMES LINÉAIRES ET NON LINÉAIRES</div>
  <h2>Repérer une non-linéarité par son spectre</h2>
  <div class="intro">Un circuit composé de résistances, condensateurs et bobines idéaux est linéaire : il ne crée aucune fréquence nouvelle. Un amplificateur qui sature, une diode, un haut-parleur poussé trop fort ne le sont plus. L'analyse spectrale permet de le voir d'un coup d'œil.</div>
  <div class="def-box">
    Un système est <strong>linéaire</strong> si sa sortie \(y(t)\) est reliée à son entrée \(x(t)\) par une équation différentielle linéaire à coefficients constants, du type \(a_0y + a_1\dfrac{\mathrm{d}y}{\mathrm{d}t} + \cdots = b_0x + b_1\dfrac{\mathrm{d}x}{\mathrm{d}t} + \cdots\). Il vérifie alors le principe de <strong>superposition</strong> : la réponse à \(x_1 + x_2\) est la somme des réponses à \(x_1\) et à \(x_2\).
  </div>
  <div class="prop-box">
    <strong>Conséquences.</strong> En régime permanent, un système linéaire soumis à une entrée sinusoïdale de fréquence \(f\) donne une sortie sinusoïdale de même fréquence \(f\) (seules l'amplitude et la phase changent). Soumis à un signal périodique, il traite chaque harmonique séparément et ne fait apparaître <strong>aucune fréquence absente de l'entrée</strong>. Réciproquement, l'apparition dans la sortie de fréquences absentes de l'entrée prouve que le système n'est pas linéaire.
  </div>
  <p><strong>Exemples de non-linéarités.</strong></p>
  <ul>
    <li>Terme quadratique \(y = ax + bx^2\) (diode, transistor aux faibles signaux) : avec \(x = X\cos\omega t\), \(x^2 = \dfrac{X^2}{2}(1 + \cos 2\omega t)\), d'où une composante continue et un harmonique de rang 2.</li>
    <li>Écrêtage symétrique (saturation d'un amplificateur, chapitre de 2ᵉ année « Amplificateur linéaire intégré et rétroaction ») : harmoniques de rangs impairs 3, 5, 7…</li>
    <li>Redressement : composante continue et harmoniques de rangs pairs.</li>
    <li>Pendule aux grandes amplitudes : son mouvement contient un harmonique de rang 3 (chapitre « Oscillateurs harmoniques », §11).</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — distorsion quadratique</strong>
    <p>Un capteur répond selon \(y = a x + b x^2\) avec \(a = 10\) et \(b = 2{,}0\ \text{V}^{-1}\). On lui applique \(x = 1{,}0\cos(\omega t)\) (en volts).</p>
    <ol>
      <li>\(y = 10\cos\omega t + 2{,}0\cos^2\omega t = 1{,}0 + 10\cos\omega t + 1{,}0\cos 2\omega t\) (en volts).</li>
      <li>Le spectre de sortie contient une raie à 0 Hz (1,0 V) et une raie à \(2f\) (1,0 V, soit 10 % du fondamental) qui n'existaient pas à l'entrée : le système n'est pas linéaire.</li>
      <li>Avec une entrée deux fois plus faible (0,50 V), le fondamental est divisé par 2 mais l'harmonique 2 par 4 : la distorsion relative diminue. Une non-linéarité se révèle surtout aux grandes amplitudes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure à une non-linéarité parce que la sortie a une autre <strong>forme</strong> que l'entrée. Un filtre linéaire déforme un signal carré (il change les amplitudes et les phases de ses harmoniques) sans créer de fréquence. Le test de linéarité se fait avec une entrée sinusoïdale pure : la sortie doit l'être aussi.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ANALYSE SPECTRALE EN PRATIQUE ET EN PYTHON</div>
  <h2>De l'acquisition au spectre</h2>
  <div class="intro">Un oscilloscope numérique (fonction FFT) ou une carte d'acquisition reliée à un ordinateur enregistrent \(N\) valeurs du signal, à intervalles réguliers, puis calculent son spectre. Deux réglages décident de la qualité du résultat : la fréquence d'échantillonnage et la durée d'acquisition.</div>
  <div class="prop-box">
    <strong>Règles d'acquisition.</strong> On enregistre \(N\) échantillons à la fréquence d'échantillonnage \(f_e\) (un point toutes les \(T_e = 1/f_e\)), pendant la durée \(T_a = N/f_e\).
    <ul>
      <li><strong>Fréquence d'échantillonnage</strong> : le spectre calculé ne va que jusqu'à \(f_e/2\) ; il faut \(f_e \gt 2f_{\max}\), où \(f_{\max}\) est la plus haute fréquence présente dans le signal (sinon, ses raies se replient à de fausses fréquences : critère de Nyquist-Shannon, étudié en 2ᵉ année). En pratique, on prend une marge : \(f_e\) de 5 à 10 fois \(f_{\max}\).</li>
      <li><strong>Durée d'acquisition</strong> : les points du spectre sont espacés de
      <div class="formula" data-nom="Résolution spectrale">$$\Delta f = \frac{1}{T_a}$$</div>
      Pour séparer les raies d'un signal de fréquence \(f\), il faut \(\Delta f\) petit devant \(f\), donc enregistrer <strong>beaucoup de périodes</strong> (une dizaine au moins), et de préférence un nombre entier de périodes.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — régler une acquisition</strong>
    <p>On veut le spectre d'un carré de fréquence 1,0 kHz jusqu'à l'harmonique de rang 15, avec une résolution de 50 Hz.</p>
    <ol>
      <li>\(f_{\max} = 15\ \text{kHz}\) : il faut \(f_e \gt 30\ \text{kHz}\) ; on choisit \(f_e = 100\ \text{kHz}\) (les harmoniques plus élevés, faibles, se replieraient sans trop gêner).</li>
      <li>\(\Delta f = 50\ \text{Hz}\) impose \(T_a = 1/\Delta f = 20\ \text{ms}\), soit 20 périodes entières.</li>
      <li>Nombre de points : \(N = f_eT_a = 2\,000\), sans difficulté pour une carte d'acquisition.</li>
    </ol>
  </div>
  <h3>Simuler et analyser en Python</h3>
  <p>Le programme suivant fabrique un signal à partir de son spectre fourni (ici le carré \(\pm E\), tronqué au rang 39), vérifie sur la forme temporelle la relation du §7, puis recalcule le spectre à partir d'échantillons, comme le ferait une carte d'acquisition. Il a été exécuté tel quel ; les résultats sont indiqués en commentaire.</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

f = 1000.0                                <span class="cmt"># fréquence du signal (Hz)</span>
E = 5.0                                   <span class="cmt"># carré ±E (V)</span>
rangs = np.arange(1, 40, 2)               <span class="cmt"># rangs impairs 1, 3, …, 39</span>
amplitudes = 4 * E / (np.pi * rangs)      <span class="cmt"># spectre fourni : S_n = 4E/(n*pi)</span>
phases = -np.pi / 2 * np.ones(len(rangs)) <span class="cmt"># sin(x) = cos(x - pi/2)</span>

<span class="kw">def</span> synthese(t, S0, rangs, amplitudes, phases):
    <span class="str">"""Signal S0 + somme des S_n cos(2 pi n f t + phi_n) aux instants t (tableau)."""</span>
    s = S0 * np.ones(len(t))
    <span class="kw">for</span> n, A, phi <span class="kw">in</span> zip(rangs, amplitudes, phases):
        s = s + A * np.cos(2 * np.pi * n * f * t + phi)
    <span class="kw">return</span> s

<span class="cmt"># 1) valeur moyenne et valeur efficace sur une période, comparées au spectre</span>
t = np.linspace(0, 1 / f, 4000, endpoint=False)
s = synthese(t, 0, rangs, amplitudes, phases)
print(np.mean(s))                          <span class="cmt"># ≈ 0 (pas de composante continue)</span>
print(np.sqrt(np.mean(s**2)))              <span class="cmt"># 4.9746 (V)</span>
print(np.sqrt(np.sum(amplitudes**2 / 2)))  <span class="cmt"># 4.9746 (V) : même valeur, comme prévu au §7</span>

<span class="cmt"># 2) acquisition simulée : fe = 100 kHz pendant Ta = 20 ms, puis spectre</span>
fe, Ta = 100e3, 20e-3
N = int(fe * Ta)                           <span class="cmt"># 2000 échantillons</span>
tk = np.arange(N) / fe                     <span class="cmt"># instants d'échantillonnage</span>
sk = synthese(tk, 0, rangs, amplitudes, phases)
S = np.fft.rfft(sk)                        <span class="cmt"># transformée de Fourier rapide</span>
freqs = np.fft.rfftfreq(N, 1 / fe)         <span class="cmt"># fréquences 0, 50, 100, … Hz</span>
A = 2 * np.abs(S) / N                      <span class="cmt"># amplitudes des raies</span>
A[0] = A[0] / 2                            <span class="cmt"># la composante continue n'a pas de facteur 2</span>
print(freqs[20], A[20])                    <span class="cmt"># 1000.0  6.366 : fondamental, 4E/pi</span>
print(freqs[60], A[60])                    <span class="cmt"># 3000.0  2.122 : rang 3, 4E/(3 pi)</span></pre>
  <p>La valeur efficace obtenue, 4,97 V, est un peu inférieure à \(E = 5\ \text{V}\) : les rangs au-delà de 39, qui portent 1 % de \(S_{\text{eff}}^2\), ont été omis. La normalisation de <span class="code-inline">rfft</span> (facteur \(2/N\)) et la transformée de Fourier discrète sont détaillées en 2ᵉ année (chapitre « Échantillonnage et traitement numérique du signal », §7). La figure ci-dessous montre ce que donne le même calcul avec une durée d'acquisition mal choisie.</p>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Calcul des coefficients de Fourier et compléments</h2>
  <div class="intro">Rien dans cette section n'est exigible en PTSI : le programme demande d'exploiter une décomposition fournie. Ces outils servent en mathématiques (séries de Fourier, hors programme de PT également) et en sciences industrielles.</div>
  <div class="notice"><strong>Hors programme en PTSI (pour aller plus loin)</strong> : le calcul des coefficients de Fourier, le phénomène de Gibbs, le taux de distorsion harmonique, la puissance active \(UI\cos\varphi\).</div>
  <h3>Coefficients de Fourier</h3>
  <p>Avec la forme \(s(t) = a_0 + \sum_{n\geq1}\big[a_n\cos(n\omega t) + b_n\sin(n\omega t)\big]\), on a \(S_0 = a_0\) et \(S_n = \sqrt{a_n^2 + b_n^2}\), et :</p>
  <div class="formula">$$a_0 = \frac1T\int_0^T s\,\mathrm{d}t,\qquad a_n = \frac2T\int_0^T s(t)\cos(n\omega t)\,\mathrm{d}t,\qquad b_n = \frac2T\int_0^T s(t)\sin(n\omega t)\,\mathrm{d}t$$</div>
  <p>Les symétries simplifient le calcul : un signal pair (\(s(-t) = s(t)\)) n'a que des cosinus (\(b_n = 0\)) ; un signal impair n'a que des sinus (\(a_0 = a_n = 0\)) ; un signal vérifiant \(s(t + T/2) = -s(t)\) n'a que des rangs impairs. Pour le carré impair \(\pm E\), \(b_n = \dfrac{4}{T}\displaystyle\int_0^{T/2} E\sin(n\omega t)\,\mathrm{d}t = \dfrac{2E}{n\pi}\big(1 - \cos n\pi\big)\), soit \(\dfrac{4E}{n\pi}\) pour \(n\) impair et 0 pour \(n\) pair : on retrouve la décomposition du §6.</p>
  <h3>Phénomène de Gibbs</h3>
  <p>Au voisinage d'une discontinuité, la somme des premiers harmoniques dépasse le signal d'environ 9 % de la hauteur du saut (pour le carré \(\pm E\), le saut vaut \(2E\) et le maximum de la somme partielle tend vers \(1{,}179\,E\)). Ajouter des harmoniques resserre ce dépassement contre la discontinuité sans réduire sa hauteur (figure du §6).</p>
  <h3>Taux de distorsion harmonique</h3>
  <p>Pour juger de la pureté d'un signal presque sinusoïdal (sortie d'un amplificateur, tension du réseau), on compare la valeur efficace de ses harmoniques à celle de son fondamental : \(\text{THD} = \dfrac{\sqrt{\sum_{n\geq2} S_n^2}}{S_1}\). Ce rapport de valeurs efficaces est la racine carrée du rapport des puissances. Un bon amplificateur audio a un THD inférieur à 0,1 % ; le carré a un THD de 48 %.</p>
  <h3>Puissance en régime sinusoïdal</h3>
  <p>Pour un dipôle traversé par \(i = I_m\cos(\omega t)\) sous \(u = U_m\cos(\omega t + \varphi)\), la puissance moyenne reçue vaut \(\langle ui\rangle = U_{\text{eff}}I_{\text{eff}}\cos\varphi\) (puissance active, étudiée en sciences industrielles, chapitre « Régimes alternatifs, redresseurs et onduleurs ») : nulle pour une bobine ou un condensateur idéaux (\(\varphi = \pm\pi/2\)), égale à \(RI_{\text{eff}}^2\) pour une résistance.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="sig-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · SIGNAUX PÉRIODIQUES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles sur les signaux périodiques (partie 1.5 du programme de PTSI et capacités expérimentales associées) : lire un oscillogramme, mesurer un déphasage, calculer une valeur moyenne ou efficace, exploiter un spectre fourni, choisir une mesure, détecter une non-linéarité, régler une acquisition. Notations : période \(T\), fréquence \(f\), pulsation \(\omega\), valeur moyenne \(\langle s\rangle\), valeur efficace \(S_{\text{eff}}\), amplitudes \(S_n\) des harmoniques. La notation complexe et les filtres sont au chapitre « Régime sinusoïdal forcé et filtrage linéaire ».</div>

  <div class="method-box"><strong>Méthode 1 — Lire période, fréquence et amplitude sur un oscillogramme</strong>
    <ol>
      <li><span class="step">Période.</span> Mesurer la durée de plusieurs périodes entre deux points homologues (maximums, ou passages par zéro dans le même sens), en divisions, multiplier par la base de temps, diviser par le nombre de périodes.</li>
      <li><span class="step">Fréquence et pulsation.</span> \(f = 1/T\), \(\omega = 2\pi f\).</li>
      <li><span class="step">Amplitude.</span> Lire la valeur crête à crête et la diviser par 2 ; en couplage DC, le milieu entre maximum et minimum donne la valeur moyenne d'un signal symétrique.</li>
    </ol>
    <p><em>Exemple éclair :</em> trois périodes occupent 7,5 divisions à 2 ms par division : \(T = 7{,}5\times2/3 = 5{,}0\ \text{ms}\), \(f = 200\ \text{Hz}\), \(\omega = 1{,}26\times10^3\ \text{rad·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Passer d'un décalage temporel à un déphasage</strong>
    <ol>
      <li><span class="step">Décalage.</span> Mesurer le décalage \(|\Delta t|\) entre deux points homologues des deux signaux, en choisissant le plus court (\(|\Delta t| \leq T/2\)).</li>
      <li><span class="step">Signe.</span> Le signal qui passe le premier par son maximum est en avance : \(\varphi \gt 0\) pour lui par rapport à l'autre.</li>
      <li><span class="step">Conversion.</span> \(|\varphi| = 2\pi\,|\Delta t|/T\), ou \(360^\circ\times|\Delta t|/T\). Inversement \(\Delta t = \varphi/\omega\).</li>
    </ol>
    <p><em>Exemple éclair :</em> à 50 Hz, le maximum de \(u_2\) suit celui de \(u_1\) de 2,5 ms : \(u_2\) est en retard de \(360^\circ\times2{,}5/20 = 45^\circ\), \(\varphi = -\pi/4\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un décalage de \(3T/4\) « en retard » est un décalage de \(T/4\) en avance : on ramène toujours \(\varphi\) dans \(]-\pi, \pi]\).</div>

  <div class="method-box"><strong>Méthode 3 — Repérer un déphasage nul en mode XY</strong>
    <ol>
      <li><span class="step">Montage.</span> Envoyer \(s_1\) sur la voie X, \(s_2\) sur la voie Y, passer en mode XY.</li>
      <li><span class="step">Réglage.</span> Faire varier le paramètre (la fréquence, en général) jusqu'à ce que l'ellipse se referme en un segment : pente positive pour \(\varphi = 0\), négative pour \(\varphi = \pi\).</li>
      <li><span class="step">Valeur de \(|\varphi|\)</span>, si besoin : \(|\sin\varphi| = y_0/Y\), où \(\pm y_0\) sont les intersections de l'ellipse avec l'axe vertical et \(Y\) son extension verticale maximale ; le sens du grand axe tranche entre \(|\varphi|\) et \(\pi - |\varphi|\).</li>
    </ol>
    <p><em>Exemple éclair :</em> ellipse d'extension verticale \(\pm 2{,}5\) divisions, coupant l'axe vertical en \(\pm 2{,}5\) divisions et d'axes parallèles aux axes de l'écran : \(|\sin\varphi| = 1\), les signaux sont en quadrature.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Calculer une valeur moyenne</strong>
    <ol>
      <li><span class="step">Une période.</span> Choisir l'intervalle d'intégration le plus commode (le résultat ne dépend pas de son début).</li>
      <li><span class="step">Aire algébrique.</span> Découper en morceaux simples (rectangles, triangles, arches de sinusoïde), compter positivement ce qui est au-dessus de l'axe et négativement ce qui est au-dessous.</li>
      <li><span class="step">Diviser par \(T\).</span> Contrôler : la moyenne est comprise entre le minimum et le maximum du signal ; elle est nulle pour un signal qui reprend la même forme inversée une demi-période plus tard.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u = 6\ \text{V}\) pendant 2 ms puis \(-2\ \text{V}\) pendant 3 ms : \(\langle u\rangle = (6\times2 - 2\times3)/5 = 1{,}2\ \text{V}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Calculer une valeur efficace à partir de la forme du signal</strong>
    <ol>
      <li><span class="step">Élever au carré</span> le signal sur une période (pour un signal par morceaux, chaque morceau).</li>
      <li><span class="step">Moyenner</span> \(s^2\) comme à la méthode 4 (toutes les aires sont positives).</li>
      <li><span class="step">Prendre la racine.</span> Contrôle : \(S_{\text{eff}} \geq |\langle s\rangle|\) ; sinusoïde : \(S_m/\sqrt2\) (à savoir établir : \(\langle\cos^2\rangle = 1/2\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> même signal qu'à la méthode 4 : \(U_{\text{eff}}^2 = (36\times2 + 4\times3)/5 = 16{,}8\ \text{V}^2\), \(U_{\text{eff}} = 4{,}1\ \text{V}\), bien supérieur à 1,2 V.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : calculer \(\langle s\rangle^2\) au lieu de \(\langle s^2\rangle\). Pour un signal de moyenne nulle, le premier vaut 0 alors que le signal chauffe une résistance.</div>

  <div class="method-box"><strong>Méthode 6 — Exploiter une décomposition spectrale fournie</strong>
    <ol>
      <li><span class="step">Fréquence du signal.</span> Le plus grand diviseur commun des fréquences présentes (souvent la plus basse raie non nulle, mais le fondamental peut manquer).</li>
      <li><span class="step">Rangs.</span> Diviser chaque fréquence par \(f\) : rangs présents (impairs seulement, pairs, tous ?).</li>
      <li><span class="step">Écrire le signal</span> \(s = S_0 + \sum S_n\cos(n\omega t + \varphi_n)\) ; la raie à 0 Hz est la valeur moyenne.</li>
      <li><span class="step">Interpréter</span> : décroissance des \(S_n\) (rapide : signal « doux », proche d'une sinusoïde ; lente en \(1/n\) : signal à discontinuités).</li>
    </ol>
    <p><em>Exemple éclair :</em> raies à 0 Hz (1,5 V), 400 Hz (2,0 V), 800 Hz (0,8 V) : \(f = 400\ \text{Hz}\), \(\langle s\rangle = 1{,}5\ \text{V}\), fondamental et harmonique 2.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Calculer une valeur efficace à partir du spectre</strong>
    <ol>
      <li><span class="step">Lister</span> la composante continue \(S_0\) et les amplitudes \(S_n\).</li>
      <li><span class="step">Sommer les carrés des valeurs efficaces</span> : \(S_{\text{eff}}^2 = S_0^2 + \sum S_n^2/2\). Les phases n'interviennent pas.</li>
      <li><span class="step">Répartition</span> : le terme de chaque raie divisé par \(S_{\text{eff}}^2\) donne la part de la puissance qu'elle porte.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour le spectre de la méthode 6, \(S_{\text{eff}}^2 = 1{,}5^2 + 2{,}0^2/2 + 0{,}8^2/2 = 4{,}57\ \text{V}^2\), \(S_{\text{eff}} = 2{,}1\ \text{V}\) ; la composante continue porte la moitié de la puissance.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : sommer les valeurs efficaces des raies au lieu de leurs carrés, ou oublier le facteur \(1/2\) des amplitudes (il ne s'applique pas à \(S_0\)).</div>

  <div class="method-box"><strong>Méthode 8 — Choisir et interpréter une mesure électrique</strong>
    <ol>
      <li><span class="step">Grandeur voulue.</span> Moyenne : multimètre en DC (ou mesure « mean » de l'oscilloscope). Efficace de la partie variable : AC. Efficace totale : AC+DC, ou \(\sqrt{DC^2 + AC^2}\).</li>
      <li><span class="step">Appareil.</span> Pour un signal non sinusoïdal, n'utiliser qu'un appareil « RMS vrai » (TRMS) ; vérifier que la fréquence est dans sa bande passante.</li>
      <li><span class="step">Amplitude, crête à crête, durées</span> : à l'oscilloscope ; couplage AC pour agrandir une petite ondulation posée sur une grande composante continue.</li>
      <li><span class="step">Perturbation.</span> Vérifier que la résistance d'entrée de l'appareil (1 à 10 MΩ) est grande devant celle du circuit étudié.</li>
    </ol>
    <p><em>Exemple éclair :</em> un multimètre TRMS indique 3,0 V en DC et 4,0 V en AC : la valeur efficace totale vaut \(\sqrt{3^2 + 4^2} = 5{,}0\ \text{V}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Détecter une non-linéarité sur un spectre</strong>
    <ol>
      <li><span class="step">Entrée sinusoïdale pure</span> de fréquence \(f\) (contrôler son spectre : une seule raie).</li>
      <li><span class="step">Spectre de sortie.</span> Raies à \(2f\), \(3f\)… ou composante continue nouvelle : le système n'est pas linéaire. Seules l'amplitude et la phase de la raie à \(f\) changent : il peut être linéaire.</li>
      <li><span class="step">Amplitude.</span> Recommencer avec une entrée plus forte : une non-linéarité se renforce aux grandes amplitudes (raie de rang 2 en \(X^2\), de rang 3 en \(X^3\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(y = 10x + x^2\) et \(x = 0{,}20\cos\omega t\) (en volts), \(y = 0{,}02 + 2{,}0\cos\omega t + 0{,}02\cos2\omega t\) : raies nouvelles à 0 et \(2f\), à 1 % du fondamental.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : tester la linéarité avec un signal carré. Un filtre linéaire change la forme d'un carré sans créer de fréquence, et les harmoniques du carré masquent celles que créerait la non-linéarité.</div>

  <div class="method-box"><strong>Méthode 10 — Régler une acquisition pour une analyse spectrale</strong>
    <ol>
      <li><span class="step">Fréquence maximale utile</span> \(f_{\max}\) : rang du dernier harmonique à observer multiplié par \(f\).</li>
      <li><span class="step">Fréquence d'échantillonnage</span> : \(f_e \gt 2f_{\max}\), avec une marge.</li>
      <li><span class="step">Durée</span> : \(T_a = 1/\Delta f\) pour la résolution \(\Delta f\) voulue (au moins une dizaine de périodes, de préférence un nombre entier).</li>
      <li><span class="step">Nombre de points</span> : \(N = f_eT_a\), à comparer à la capacité de la carte ; s'il est limité, c'est \(f_e\) qu'on réduit, pas \(T_a\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une note à 440 Hz analysée jusqu'au rang 10 (4,4 kHz) avec une résolution de 10 Hz : \(f_e = 44{,}1\ \text{kHz}\) convient, \(T_a = 0{,}10\ \text{s}\), \(N = 4\,410\) points.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Valeur moyenne et valeur efficace d'un créneau</h3>
  <div class="statement">Un signal créneau vaut \(+5\ \text{V}\) pendant \(3T/4\) et \(-1\ \text{V}\) pendant \(T/4\) par période.</div>
  <div class="q"><strong>Q1.</strong> Calculer la valeur moyenne \(\langle s\rangle\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la valeur efficace \(S_{\text{eff}}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le facteur de crête \(k_c = s_{\max}/S_{\text{eff}}\).</div>
  <div class="q"><strong>Q4.</strong> Qu'indique un multimètre « RMS vrai » en position AC ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Aire algébrique sur une période divisée par \(T\) :</p>
    <div class="formula">$$\langle s\rangle = \frac1T\left(5\times\frac{3T}{4} + (-1)\times\frac T4\right) = \frac{15 - 1}{4} = 3{,}5\ \text{V}$$</div>
    <p><strong>Q2.</strong></p>
    <div class="formula">$$S_{\text{eff}}^2 = \frac1T\left(25\times\frac{3T}{4} + 1\times\frac T4\right) = \frac{75 + 1}{4} = 19\ \text{V}^2$$</div>
    <p>donc \(S_{\text{eff}} = \sqrt{19} \approx 4{,}36\ \text{V}\). Contrôle : \(S_{\text{eff}} \geq |\langle s\rangle|\).</p>
    <p><strong>Q3.</strong> \(s_{\max} = 5\ \text{V}\) : \(k_c = 5/\sqrt{19} \approx 1{,}15\).</p>
    <p><strong>Q4.</strong> La valeur efficace de la composante alternative : \(S_{\sim\text{eff}} = \sqrt{S_{\text{eff}}^2 - \langle s\rangle^2}\), soit \(\sqrt{19 - 12{,}25} = \sqrt{6{,}75} \approx 2{,}60\ \text{V}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Le secteur et un radiateur</h3>
  <div class="statement">Le réseau électrique délivre une tension sinusoïdale de valeur efficace 230 V et de fréquence 50 Hz. Un radiateur, assimilé à une résistance \(R\), y consomme une puissance moyenne de 2,0 kW.</div>
  <div class="q"><strong>Q1.</strong> Établir par le calcul la valeur efficace d'une tension \(u = U_m\cos(\omega t)\). En déduire l'amplitude de la tension du secteur et écrire \(u(t)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(R\), la valeur efficace et l'amplitude du courant.</div>
  <div class="q"><strong>Q3.</strong> Montrer que la puissance instantanée reçue par le radiateur oscille entre 0 et une valeur maximale que l'on calculera. À quelle fréquence oscille-t-elle ?</div>
  <div class="q"><strong>Q4.</strong> Quelle tension continue faudrait-il appliquer pour que le radiateur chauffe autant ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(u^2 = U_m^2\cos^2\omega t = \dfrac{U_m^2}{2}(1 + \cos2\omega t)\) ; le cosinus de pulsation \(2\omega\) a une moyenne nulle sur \(T\), donc \(\langle u^2\rangle = U_m^2/2\) et \(U_{\text{eff}} = U_m/\sqrt2\). Pour le secteur, \(U_m = 230\sqrt2 \approx 325\ \text{V}\) et \(u(t) = 325\cos(100\pi t)\) (en volts, origine des temps à un maximum).</p>
    <p><strong>Q2.</strong> \(P = U_{\text{eff}}^2/R\), donc \(R = 230^2/2\,000 = 26{,}5\ \Omega\). \(I_{\text{eff}} = U_{\text{eff}}/R = 8{,}7\ \text{A}\) et \(I_m = I_{\text{eff}}\sqrt2 = 12{,}3\ \text{A}\).</p>
    <p><strong>Q3.</strong></p>
    <div class="formula">$$p(t) = \frac{u^2}{R} = \frac{U_m^2}{R}\cos^2\omega t = \frac{U_m^2}{2R}(1 + \cos 2\omega t)$$</div>
    <p>Elle oscille entre 0 et \(U_m^2/R = 2P = 4{,}0\ \text{kW}\), autour de sa moyenne 2,0 kW, à la fréquence 100 Hz (deux fois par période, la tension passe par zéro).</p>
    <p><strong>Q4.</strong> Par définition de la valeur efficace : une tension continue de 230 V dissipe la même puissance moyenne, 2,0 kW.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Tensions redressées</h3>
  <div class="statement">Un transformateur délivre \(u = U_m\cos(\omega t)\) avec \(U_m = 12\ \text{V}\). Un redresseur simple alternance ne laisse passer que les alternances positives (la tension vaut 0 pendant les alternances négatives) ; un redresseur double alternance donne \(|u|\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la valeur moyenne et la valeur efficace de la tension redressée simple alternance.</div>
  <div class="q"><strong>Q2.</strong> Même question en double alternance. Comparer la valeur efficace à celle de \(u\) et expliquer.</div>
  <div class="q"><strong>Q3.</strong> Pour chaque redresseur, calculer la valeur efficace de la composante alternative, puis son rapport à la valeur moyenne. Lequel fournit la tension la plus facile à lisser en une tension continue ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Sur une période, seule l'arche \(-T/4 \lt t \lt T/4\) est non nulle. Avec \(\theta = \omega t\) :</p>
    <div class="formula">$$\langle s\rangle = \frac{1}{2\pi}\int_{-\pi/2}^{\pi/2}U_m\cos\theta\,\mathrm{d}\theta = \frac{U_m}{\pi},\qquad \langle s^2\rangle = \frac{1}{2\pi}\int_{-\pi/2}^{\pi/2}U_m^2\cos^2\theta\,\mathrm{d}\theta = \frac{U_m^2}{4}$$</div>
    <p>soit \(\langle s\rangle = 3{,}8\ \text{V}\) et \(S_{\text{eff}} = U_m/2 = 6{,}0\ \text{V}\).</p>
    <p><strong>Q2.</strong> Deux arches par période : la moyenne double, \(2U_m/\pi = 7{,}6\ \text{V}\). Le carré \(|u|^2 = u^2\) est le même que sans redressement : \(S_{\text{eff}} = U_m/\sqrt2 = 8{,}5\ \text{V}\), comme pour \(u\). Le redressement ne change pas l'échauffement d'une résistance.</p>
    <p><strong>Q3.</strong> \(S_{\sim\text{eff}} = \sqrt{S_{\text{eff}}^2 - \langle s\rangle^2}\). Simple alternance : \(\sqrt{36 - 14{,}6} = 4{,}6\ \text{V}\), rapport \(1{,}21\). Double alternance : \(\sqrt{72 - 58{,}4} = 3{,}7\ \text{V}\), rapport \(0{,}48\). Le double alternance donne une tension dont l'ondulation est relativement plus faible et de fréquence double (100 Hz au lieu de 50 Hz), donc plus facile à éliminer par un filtre passe-bas (chapitre « Filtres », §9).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Ce qu'affiche un multimètre</h3>
  <div class="statement">Un GBF délivre une tension triangulaire qui varie linéairement entre 0 et 10 V (et revient de même), de fréquence 200 Hz. On la mesure avec un multimètre « RMS vrai » (TRMS) et avec un multimètre ordinaire, qui en position AC mesure la moyenne de \(|u_\sim|\) et la multiplie par \(\pi/(2\sqrt2) \approx 1{,}11\). On rappelle que la valeur efficace d'un triangle \(\pm A\) vaut \(A/\sqrt3\).</div>
  <div class="q"><strong>Q1.</strong> Qu'indique chaque multimètre en position DC ?</div>
  <div class="q"><strong>Q2.</strong> Qu'indique le multimètre TRMS en position AC, puis AC+DC ?</div>
  <div class="q"><strong>Q3.</strong> Qu'indique le multimètre ordinaire en position AC ? Quelle est son erreur relative ? Pour quel type de signal ce multimètre est-il juste ?</div>
  <div class="q"><strong>Q4.</strong> Que voit-on à l'oscilloscope en couplage DC, puis AC ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> La valeur moyenne, la même pour les deux appareils : le triangle est symétrique autour de 5 V, \(\langle u\rangle = 5{,}0\ \text{V}\).</p>
    <p><strong>Q2.</strong> La composante alternative est un triangle \(\pm5\ \text{V}\) : en AC, \(5/\sqrt3 = 2{,}89\ \text{V}\). En AC+DC : \(\sqrt{5^2 + 2{,}89^2} = \sqrt{25 + 8{,}33} = 5{,}77\ \text{V}\).</p>
    <p><strong>Q3.</strong> \(|u_\sim|\) varie linéairement entre 0 et 5 V : sa moyenne vaut 2,5 V. Affichage : \(2{,}5\times1{,}11 = 2{,}78\ \text{V}\), au lieu de 2,89 V : erreur de \(-3{,}8\ \%\). Le facteur 1,11 est le rapport \(S_{\text{eff}}/\langle|s|\rangle\) d'une sinusoïde : l'appareil n'est juste que pour un signal sinusoïdal.</p>
    <p><strong>Q4.</strong> En DC : le triangle entre 0 et 10 V. En AC : le même triangle centré sur 0, entre \(-5\) et \(+5\ \text{V}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Déphasage : mode temporel et mode XY</h3>
  <div class="statement">À la fréquence \(f = 500\ \text{Hz}\), deux tensions s'écrivent \(u_1 = 4{,}0\cos(\omega t)\) et \(u_2 = 3{,}0\cos(\omega t - \pi/3)\) (en volts).</div>
  <div class="q"><strong>Q1.</strong> Laquelle est en avance ? De quelle durée le maximum de \(u_2\) est-il décalé par rapport à celui de \(u_1\) ?</div>
  <div class="q"><strong>Q2.</strong> On passe en mode XY (\(u_1\) en X, \(u_2\) en Y). Déterminer les points où la courbe coupe l'axe vertical, puis l'axe horizontal. Vérifier la relation \(|\sin\varphi| = y_0/Y\).</div>
  <div class="q"><strong>Q3.</strong> \(u_2\) est en fait la sortie d'un filtre dont le déphasage varie avec la fréquence. Comment repérer précisément, en mode XY, la fréquence où il s'annule ? Pourquoi est-ce plus précis qu'en mode temporel ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\varphi = -\pi/3\) : \(u_2\) est en retard. Son maximum arrive \(\Delta t = |\varphi|/\omega = \dfrac{1}{6}\,T = \dfrac{1}{6\times500} = 0{,}33\ \text{ms}\) après celui de \(u_1\).</p>
    <p><strong>Q2.</strong> Axe vertical : \(u_1 = 0\), soit \(\omega t = \pm\pi/2\), d'où \(u_2 = 3{,}0\cos(\pm\pi/2 - \pi/3)\), soit \(u_2 = \pm3{,}0\sin(\pi/3) = \pm2{,}6\ \text{V}\). Axe horizontal : \(u_2 = 0\), soit \(\omega t = \pi/3 \pm\pi/2\), d'où \(u_1 = 4{,}0\cos(\pi/3 \pm \pi/2) = \mp3{,}5\ \text{V}\). Avec \(Y = 3{,}0\ \text{V}\) : \(y_0/Y = 2{,}6/3{,}0 = 0{,}87 = \sin(\pi/3)\) ; de même \(3{,}5/4{,}0 = 0{,}87\).</p>
    <p><strong>Q3.</strong> On fait varier la fréquence jusqu'à ce que l'ellipse se referme en un segment de pente positive. L'œil repère très bien un segment, alors que l'ellipse est déjà très aplatie pour un petit déphasage : en mode temporel, il faudrait au contraire mesurer un décalage tendant vers zéro entre deux courbes presque superposées, ce qui est imprécis.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>

  <div class="q"><strong>Q1.</strong> Calculer la fréquence du fondamental. Quels harmoniques sont présents ? Calculer l'amplitude du fondamental et celle de l'harmonique 3.</div>

  <div class="q"><strong>Q3.</strong> Donner la valeur efficace directement à partir de la forme du signal, puis la retrouver à partir des amplitudes des harmoniques. On donne \(\displaystyle\sum_{n\ \text{impair}}\frac{1}{n^2} = \frac{\pi^2}{8}\).</div>
  <div class="q"><strong>Q4.</strong> Quelle fraction de \(S_{\text{eff}}^2\) le fondamental porte-t-il ? et les rangs 1, 3 et 5 ensemble ?</div>

  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f = 1/T = 1{,}0\ \text{kHz}\). Seuls les harmoniques de rangs impairs (1, 3, 5…) sont présents. \(S_1 = 4E/\pi = 6{,}4\ \text{V}\) et \(S_3 = S_1/3 = 2{,}1\ \text{V}\).</p>
    <p><strong>Q2.</strong> \(\langle s\rangle = 0\) : le signal passe autant de temps à \(+E\) qu'à \(-E\), et la décomposition ne comporte aucun terme constant.</p>
    <p><strong>Q3.</strong> \(s^2 = E^2\) à chaque instant, donc \(S_{\text{eff}} = E = 5{,}0\ \text{V}\). Par le spectre :</p>
    <div class="formula">$$S_{\text{eff}}^2 = \sum_{n\ \text{impair}}\frac12\left(\frac{4E}{n\pi}\right)^2 = \frac{8E^2}{\pi^2}\sum_{n\ \text{impair}}\frac1{n^2} = E^2$$</div>
    <p>Les deux calculs concordent.</p>
    <p><strong>Q4.</strong> Fondamental : \(\dfrac{S_1^2/2}{E^2} = \dfrac{8}{\pi^2} = 81\ \%\). Rangs 1, 3, 5 : \(\dfrac{8}{\pi^2}\left(1 + \dfrac19 + \dfrac1{25}\right) = 93\ \%\).</p>
    <p><strong>Q5.</strong> Une raie apparaît à 0 Hz, de hauteur 2,0 V ; les autres sont inchangées. \(S_{\text{eff}} = \sqrt{2{,}0^2 + 5{,}0^2} = 5{,}4\ \text{V}\) (composante continue et composante alternative s'ajoutent en carrés).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Puissance d'une tension déformée</h3>
  <div class="statement">Une tension périodique est composée d'un fondamental de fréquence 50 Hz et d'amplitude 100 V, d'un harmonique 3 d'amplitude 20 V et d'un harmonique 5 d'amplitude 10 V. Elle alimente une résistance \(R = 50\ \Omega\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la valeur efficace de la tension à partir de son spectre.</div>
  <div class="q"><strong>Q2.</strong> Calculer la puissance dissipée dans \(R\). Quelle part est due aux harmoniques ?</div>
  <div class="q"><strong>Q3.</strong> Un filtre passe-bas idéal de fréquence de coupure 100 Hz ne garde que le fondamental. Calculer la valeur efficace et la puissance en sortie.</div>
  <div class="q"><strong>Q4.</strong> Un élève additionne les valeurs efficaces des trois composantes. Quelle valeur trouve-t-il, et quelle erreur commet-il sur la puissance ?</div>

  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(U_{\text{eff}}^2 = \dfrac{100^2 + 20^2 + 10^2}{2} = 5\,250\ \text{V}^2\), \(U_{\text{eff}} = 72{,}5\ \text{V}\).</p>
    <p><strong>Q2.</strong> \(P = U_{\text{eff}}^2/R = 105\ \text{W}\). Les harmoniques y contribuent pour \((20^2 + 10^2)/2/R = 5{,}0\ \text{W}\), soit 4,8 %.</p>
    <p><strong>Q3.</strong> Fondamental seul : \(U_{\text{eff}} = 100/\sqrt2 = 70{,}7\ \text{V}\), \(P = 5\,000/50 = 100\ \text{W}\). La sortie est sinusoïdale ; le filtre n'a retiré que 5 W, car les harmoniques transportaient peu de puissance.</p>
    <p><strong>Q4.</strong> \(70{,}7 + 14{,}1 + 7{,}1 = 91{,}9\ \text{V}\), d'où une puissance calculée de \(91{,}9^2/50 = 169\ \text{W}\) : 61 % de trop. Les termes croisés n'ont pas lieu d'être : ils ont une moyenne nulle, seules les puissances s'ajoutent.</p>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Repérer une non-linéarité</h3>
  <div class="statement">Un amplificateur légèrement non linéaire répond selon \(y = ax + cx^3\), avec \(a = 10\) et \(c = -0{,}50\ \text{V}^{-2}\). On lui applique \(x = X\cos(\omega t)\). On rappelle \(\cos^3\theta = \dfrac{3\cos\theta + \cos3\theta}{4}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer le spectre de \(y\). Quelles fréquences nouvelles apparaissent ? Pourquoi n'y a-t-il ni composante continue ni harmonique 2 ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le rapport de l'amplitude de l'harmonique 3 à celle du fondamental pour \(X = 0{,}50\ \text{V}\), 1,0 V et 2,0 V. Commenter.</div>
  <div class="q"><strong>Q3.</strong> Proposer un protocole expérimental pour vérifier qu'un système est linéaire. Pourquoi ne pas utiliser un signal carré ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Avec la formule rappelée :</p>
    <div class="formula">$$y = aX\cos\omega t + cX^3\,\frac{3\cos\omega t + \cos3\omega t}{4} = \left(aX + \frac{3cX^3}{4}\right)\cos\omega t + \frac{cX^3}{4}\cos3\omega t$$</div>
    <p>Une seule fréquence nouvelle : \(3f\). La caractéristique est impaire (\(y(-x) = -y(x)\)) : le signal de sortie reprend la même forme inversée une demi-période plus tard, il n'a que des rangs impairs.</p>
    <p><strong>Q2.</strong> Fondamental \(aX + 0{,}75\,cX^3\), harmonique 3 \(|c|X^3/4\). Pour \(X = 0{,}50\ \text{V}\) : 4,95 V et 0,016 V, rapport 0,3 %. Pour \(X = 1{,}0\ \text{V}\) : 9,63 V et 0,125 V, rapport 1,3 %. Pour \(X = 2{,}0\ \text{V}\) : 17,0 V et 1,0 V, rapport 5,9 %. Le rapport croît comme \(X^2\) : la non-linéarité se révèle aux grandes amplitudes (et le gain réel, \(17/2 = 8{,}5\) au lieu de 10, diminue : l'amplificateur « compresse »).</p>
    <p><strong>Q3.</strong> Appliquer une sinusoïde pure (vérifier son spectre), relever le spectre de sortie pour plusieurs amplitudes : l'absence de raies à \(2f\), \(3f\)… et la proportionnalité de la raie à \(f\) avec l'amplitude d'entrée traduisent la linéarité. Un carré contient déjà tous les rangs impairs : on ne distinguerait pas ceux qu'il apporte de ceux que créerait le système.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Régler une acquisition</h3>
  <div class="statement">Un accéléromètre fixé sur une machine tournante délivre un signal périodique de fréquence 25 Hz, dont les harmoniques sont significatifs jusqu'au rang 40. On le numérise avec une carte d'acquisition qui enregistre au plus 4 096 points, puis on calcule son spectre.</div>
  <div class="q"><strong>Q1.</strong> Quelle condition la fréquence d'échantillonnage doit-elle vérifier ?</div>
  <div class="q"><strong>Q2.</strong> On soupçonne un défaut qui ajouterait une raie à 27 Hz. Quelle durée d'acquisition faut-il au minimum pour la distinguer du fondamental ?</div>
  <div class="q"><strong>Q3.</strong> Proposer un réglage compatible avec la carte. Que vaut la fréquence maximale analysable ?</div>
  <div class="q"><strong>Q4.</strong> Un camarade choisit \(f_e = 40\ \text{kHz}\) « pour avoir plus de précision ». Que vaut alors la résolution ? Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> La plus haute fréquence utile vaut \(f_{\max} = 40\times25 = 1\,000\ \text{Hz}\) : il faut \(f_e \gt 2\,000\ \text{Hz}\).</p>
    <p><strong>Q2.</strong> Les raies à 25 et 27 Hz sont distantes de 2 Hz : il faut une résolution \(\Delta f\) nettement plus fine, par exemple 1 Hz, donc \(T_a = 1/\Delta f \geq 1\ \text{s}\) (25 périodes entières).</p>
    <p><strong>Q3.</strong> \(T_a = 1{,}0\ \text{s}\) et \(N = 4\,096\) donnent \(f_e = 4\,096\ \text{Hz}\) : la condition de Q1 est remplie, et le spectre s'étend jusqu'à \(f_e/2 = 2\,048\ \text{Hz}\), au-delà du rang 40.</p>
    <p><strong>Q4.</strong> Avec 4 096 points à 40 kHz, \(T_a = 0{,}10\ \text{s}\) et \(\Delta f = 10\ \text{Hz}\) : les raies à 25 et 27 Hz se confondent. Augmenter \(f_e\) à nombre de points fixé dégrade la résolution ; c'est la durée qui fait la finesse du spectre.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Coefficients de Fourier du carré et du triangle (hors programme, pour aller plus loin)</h3>
  <div class="statement">Le calcul des coefficients de Fourier n'est pas exigible en PTSI. On admet que \(s(t) = a_0 + \sum_{n\geq1}\big[a_n\cos(n\omega t) + b_n\sin(n\omega t)\big]\) avec \(a_n = \dfrac2T\displaystyle\int_0^T s(t)\cos(n\omega t)\,\mathrm{d}t\) et \(b_n = \dfrac2T\displaystyle\int_0^T s(t)\sin(n\omega t)\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Carré impair : \(s = +E\) sur \(]0, T/2[\) et \(-E\) sur \(]T/2, T[\). Justifier sans calcul que \(a_0 = 0\) et \(a_n = 0\), puis calculer \(b_n\).</div>
  <div class="q"><strong>Q2.</strong> Triangle pair : \(s(t) = E(1 - 4|t|/T)\) sur \([-T/2, T/2]\). Quels coefficients sont nuls ? Calculer \(a_n\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier la relation entre valeur efficace et spectre pour le triangle, sachant que \(\sum_{n\ \text{impair}} 1/n^4 = \pi^4/96\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(a_0 = \langle s\rangle = 0\). Le signal est impair et \(\cos(n\omega t)\) est pair : le produit est impair et son intégrale sur une période (centrée en 0) est nulle, donc \(a_n = 0\). Puis</p>
    <div class="formula">$$b_n = \frac2T\left[\int_0^{T/2}E\sin(n\omega t)\,\mathrm{d}t - \int_{T/2}^{T}E\sin(n\omega t)\,\mathrm{d}t\right]$$</div>
    <p>Avec \(\omega T = 2\pi\), chaque intégrale vaut \(\dfrac{E}{n\omega}(1 - \cos n\pi)\) au signe près, d'où \(b_n = \dfrac{2E}{n\pi}(1 - \cos n\pi)\) : \(b_n = \dfrac{4E}{n\pi}\) pour \(n\) impair, 0 pour \(n\) pair.</p>
    <p><strong>Q2.</strong> Signal pair : \(b_n = 0\). De moyenne nulle : \(a_0 = 0\). Il vérifie \(s(t + T/2) = -s(t)\) : les rangs pairs sont nuls. Par parité, \(a_n = \dfrac4T\displaystyle\int_0^{T/2}E\left(1 - \dfrac{4t}{T}\right)\cos(n\omega t)\,\mathrm{d}t\) ; une intégration par parties donne \(a_n = \dfrac{4E}{n^2\pi^2}(1 - \cos n\pi)\), soit \(\dfrac{8E}{n^2\pi^2}\) pour \(n\) impair. Les harmoniques décroissent en \(1/n^2\), plus vite que ceux du carré.</p>
    <p><strong>Q3.</strong> Directement : \(S_{\text{eff}}^2 = \dfrac{2}{T}\displaystyle\int_0^{T/2}E^2\left(1 - \dfrac{4t}T\right)^2\mathrm{d}t = \dfrac{E^2}{3}\). Par le spectre : \(\displaystyle\sum_{n\ \text{impair}}\frac12\left(\frac{8E}{n^2\pi^2}\right)^2 = \frac{32E^2}{\pi^4}\times\frac{\pi^4}{96} = \frac{E^2}{3}\). Les deux résultats concordent.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le son d'une guitare électrique</h3>
  <div class="exo-source">

  <p class="exo-part">Partie A — Lecture du spectre</p>
  <div class="q"><strong>A1.</strong> Déterminer la fréquence et la période du signal. Justifier que les raies sont équidistantes.</div>
  <div class="q"><strong>A2.</strong> Qu'est-ce qui, dans ce spectre, fixe la hauteur de la note ? et son timbre ? Où seraient les raies si l'on jouait la même note une octave plus haut ?</div>
  <p class="exo-part">Partie B — Valeur efficace</p>
  <div class="q"><strong>B1.</strong> Calculer la valeur efficace de \(u\). Les phases des harmoniques, non fournies, sont-elles nécessaires ?</div>
  <div class="q"><strong>B2.</strong> Quelle part de \(U_{\text{eff}}^2\) le fondamental porte-t-il ? Un préamplificateur de gain 20 dB, supposé linéaire, amplifie \(u\) : que vaut la valeur efficace en sortie ?</div>
  <p class="exo-part">Partie C — La pédale de distorsion</p>
  <div class="q"><strong>C1.</strong> Pour tester une pédale de distorsion, on lui applique une sinusoïde de fréquence 110 Hz et d'amplitude \(A = 0{,}50\ \text{V}\). Sa sortie est écrêtée symétriquement à \(\pm L\), avec \(L = 0{,}30\ \text{V}\). Un calcul de spectre donne pour la sortie : 0,358 V à 110 Hz, 0,065 V à 330 Hz, 0,002 V à 550 Hz, 0,010 V à 770 Hz, et aucune raie aux rangs pairs. Le système est-il linéaire ? Justifier l'absence de rangs pairs.</div>
  <div class="q"><strong>C2.</strong> Calculer la valeur efficace de la sortie à partir de ces raies, puis directement à partir de la forme du signal : en posant \(\theta_0 = \arccos(L/A)\), on admet que
  <div class="formula">$$\langle s^2\rangle = \frac{2}{\pi}\left[L^2\theta_0 + A^2\left(\frac{\pi/2 - \theta_0}{2} - \frac{\sin2\theta_0}{4}\right)\right]$$</div>Comparer.</div>
  <div class="q"><strong>C3.</strong> On modélise plus simplement la pédale par \(y = ax + cx^3\), et le guitariste joue deux notes à la fois, de fréquences \(f_1 = 110\ \text{Hz}\) et \(f_2 = 165\ \text{Hz}\). En développant \(x^3\) pour \(x = X_1\cos\omega_1t + X_2\cos\omega_2t\), dresser la liste des fréquences présentes en sortie. Commenter.</div>
  <p class="exo-part">Partie D — Analyse spectrale</p>
  <div class="q"><strong>D1.</strong> On veut analyser le son de la guitare jusqu'au rang 20 de la note la plus grave, avec une résolution de 1 Hz. Proposer une fréquence d'échantillonnage, une durée et un nombre de points.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> Les raies sont aux multiples de 110 Hz : \(f = 110\ \text{Hz}\) (le « la » grave), \(T = 9{,}1\ \text{ms}\). Un signal périodique ne contient que des fréquences multiples de sa fréquence : les raies sont espacées de \(f\).</p>
    <p><strong>A2.</strong> La hauteur est fixée par la fréquence du fondamental (110 Hz), le timbre par les amplitudes relatives des harmoniques. Une octave plus haut, la fréquence double : raies à 220, 440, 660 Hz…</p>
    <p><strong>B1.</strong></p>
    <div class="formula">$$U_{\text{eff}}^2 = \frac{80^2 + 60^2 + 30^2 + 20^2 + 8^2 + 5^2}{2} = \frac{11\,389}{2} = 5\,694\ \text{mV}^2$$</div>
    <p>soit \(U_{\text{eff}} = 75\ \text{mV}\). Les phases sont inutiles : les termes croisés ont une moyenne nulle quelles que soient les phases.</p>
    <p><strong>B2.</strong> Fondamental : \(\dfrac{80^2/2}{5\,694} = 56\ \%\). Un gain de 20 dB multiplie toutes les amplitudes par 10 sans changer leurs proportions (système linéaire) : \(U_{\text{eff}} = 0{,}75\ \text{V}\).</p>
    <p><strong>C1.</strong> Non : l'entrée ne contient que 110 Hz, la sortie contient en plus 330, 550 et 770 Hz, fréquences nouvelles. L'écrêtage est symétrique (\(s\) reprend la même forme inversée une demi-période plus tard) : seuls des rangs impairs apparaissent.</p>
    <p><strong>C2.</strong> Par les raies :</p>
    <div class="formula">$$S_{\text{eff}}^2 = \frac{0{,}358^2 + 0{,}065^2 + 0{,}002^2 + 0{,}010^2}{2} = 0{,}0662\ \text{V}^2$$</div>
    <p>soit \(0{,}257\ \text{V}\). Directement : \(\theta_0 = \arccos 0{,}60 = 0{,}927\ \text{rad}\), \(\sin2\theta_0 = 0{,}96\), et</p>
    <div class="formula">$$\langle s^2\rangle = \frac2\pi\left[0{,}09\times0{,}927 + 0{,}25\left(\frac{0{,}644}{2} - 0{,}24\right)\right] = 0{,}0661\ \text{V}^2$$</div>
    <p>soit \(0{,}257\ \text{V}\). Les deux calculs concordent (les raies négligées sont minuscules). La valeur efficace est inférieure à celle de la sinusoïde non écrêtée, \(0{,}50/\sqrt2 = 0{,}354\ \text{V}\).</p>
    <p><strong>C3.</strong> \(x^3\) contient \(X_1^3\cos^3\omega_1t\) et \(X_2^3\cos^3\omega_2t\) (fréquences \(f_1\), \(3f_1\), \(f_2\), \(3f_2\)) et les termes \(3X_1^2X_2\cos^2\omega_1t\cos\omega_2t\) et \(3X_1X_2^2\cos\omega_1t\cos^2\omega_2t\), qui font apparaître \(f_2\), \(2f_1 \pm f_2\), \(f_1\), \(2f_2 \pm f_1\). Sortie : 55, 110, 165, 220, 330, 385, 440 et 495 Hz. Les fréquences \(|2f_1 - f_2| = 55\ \text{Hz}\) ou \(2f_1 + f_2 = 385\ \text{Hz}\) ne sont pas des harmoniques des notes jouées (fréquences d'intermodulation) : c'est ce qui rend « sale » un accord joué avec une forte distorsion.</p>
    <p><strong>D1.</strong> \(f_{\max} = 20\times110 = 2\,200\ \text{Hz}\) : \(f_e \gt 4\,400\ \text{Hz}\), par exemple \(f_e = 10\ \text{kHz}\). Résolution 1 Hz : \(T_a = 1{,}0\ \text{s}\). D'où \(N = f_eT_a = 10\,000\) points.</p>
  </div>
