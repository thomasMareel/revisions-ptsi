<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 2.6 du programme de PTSI, « Mouvements dans un champ de force centrale conservatif » (second semestre). Il applique les outils du chapitre « Moment cinétique » (théorème du moment cinétique, conservation) et du chapitre « Énergie mécanique » (énergie potentielle, mouvement à une dimension) à la gravitation : planètes, comètes, satellites. Les coordonnées polaires viennent du chapitre « Cinématique du point » (§3). Le programme affirme le caractère elliptique des trajectoires liées sans étude géométrique des ellipses ; il ne poursuit l'étude détaillée que pour la trajectoire circulaire. L'onglet « Simulateur » permet de lancer un corps et de voir sa trajectoire.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Point matériel soumis à un champ de force centrale</strong> : établir la conservation du moment cinétique à partir du théorème du moment cinétique ; établir les conséquences de cette conservation : mouvement plan, loi des aires (§1, §2).</li>
        <li><strong>Champ de force centrale conservatif, énergie mécanique</strong> : exprimer l'énergie mécanique d'un système conservatif ponctuel à partir de l'équation du mouvement ; exprimer la conservation de l'énergie mécanique et construire une énergie potentielle effective (§3, §4).</li>
        <li><strong>État lié, état de diffusion</strong> : décrire qualitativement le mouvement radial à l'aide de l'énergie potentielle effective ; relier le caractère borné du mouvement radial à la valeur de l'énergie mécanique (§4, §5).</li>
        <li><strong>Capacité numérique</strong> : obtenir des trajectoires d'un point matériel soumis à un champ de force centrale conservatif à l'aide d'un langage de programmation (§10).</li>
        <li><strong>Lois de Kepler</strong> : les énoncer pour les planètes et les transposer au cas des satellites terrestres (§6).</li>
        <li><strong>Mouvement circulaire</strong> : établir que le mouvement est uniforme et déterminer sa période ; établir la troisième loi de Kepler dans ce cas et exploiter sans démonstration sa généralisation à une trajectoire elliptique ; exprimer l'énergie mécanique (§7, §8).</li>
        <li><strong>Mouvement elliptique</strong> : exprimer l'énergie mécanique en fonction du demi-grand axe (§8).</li>
        <li><strong>Satellites terrestres</strong> : différencier les orbites en fonction des missions (géostationnaire, localisation et navigation, météorologie) ; déterminer l'altitude d'un satellite géostationnaire et justifier sa localisation dans le plan équatorial (§9).</li>
      </ul>
      <p>Hors programme (regroupé en fin de chapitre) : l'équation de la trajectoire (formule de Binet), l'étude géométrique des coniques (excentricité, paramètre), la démonstration de la troisième loi pour une ellipse.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · FORCE CENTRALE ET CONSERVATION DU MOMENT CINÉTIQUE</div>
  <h2>Une force toujours dirigée vers le même point</h2>
  <div class="intro">La Terre attire la Lune vers son centre, le Soleil attire les planètes vers le sien, un noyau repousse une particule alpha le long de la droite qui les joint. Dans tous ces cas, la force passe par un point fixe : son moment par rapport à ce point est nul, et le moment cinétique se conserve. C'est la clé de tout le chapitre.</div>
  <div class="def-box">
    <strong>Force centrale.</strong> Une force est <strong>centrale</strong>, de centre \(O\) fixe, si sa droite d'action passe toujours par \(O\) : \(\vec F=F\,\vec e_r\), avec \(\vec e_r=\overrightarrow{OM}/OM\). Un <strong>champ de force centrale</strong> associe une telle force à chaque position ; il est <strong>conservatif</strong> s'il dérive d'une énergie potentielle \(E_p(r)\) qui ne dépend que de \(r=OM\) (§3). Exemples : gravitation d'un astre à symétrie sphérique, force électrique d'une charge fixe, ressort attaché en \(O\) ; la tension d'un fil qui passe par un trou en \(O\) est centrale sans être conservative (chapitre « Moment cinétique », §7).
  </div>
  <div class="prop-box">
    <strong>Conservation du moment cinétique.</strong> Pour un point soumis à la seule force centrale (référentiel galiléen dans lequel \(O\) est fixe), \(\vec{\mathcal M}_O(\vec F)=\overrightarrow{OM}\wedge F\,\vec e_r=\vec0\). Le théorème du moment cinétique en \(O\) donne
    <div class="formula" data-nom="Conservation du moment cinétique (force centrale)">$$\frac{\mathrm d\vec L_O}{\mathrm dt}=\vec 0\qquad\vec L_O=\overrightarrow{OM}\wedge m\vec v=\overrightarrow{\text{constante}}$$</div>
  </div>
  <div class="prop-box">
    <strong>Mouvement plan.</strong> Si \(\vec L_O\ne\vec0\), le vecteur \(\overrightarrow{OM}\) est à tout instant orthogonal au vecteur fixe \(\vec L_O\) : \(M\) reste dans le plan qui passe par \(O\) et qui est perpendiculaire à \(\vec L_O\). Ce plan est fixé par la position et la vitesse initiales. Si \(\vec L_O=\vec0\), \(\overrightarrow{OM}\) et \(\vec v\) sont colinéaires : le mouvement est rectiligne, sur une droite passant par \(O\) (chute radiale).
  </div>
  <p>On repère donc \(M\) par ses coordonnées polaires \((r,\theta)\) dans ce plan, d'axe \(Oz\) dirigé selon \(\vec L_O\) : \(\vec v=\dot r\,\vec e_r+r\dot\theta\,\vec e_\theta\) et \(\vec L_O=mr^2\dot\theta\,\vec e_z\) (chapitre « Moment cinétique », §2). Le problème à trois dimensions devient un problème à deux degrés de liberté, \(r\) et \(\theta\).</p>
  <div class="method-box"><strong>Exemple — moment cinétique et plan d'un satellite</strong>
    <p>Un satellite de 1 000 kg passe à \(r=8\,000\ \text{km}\) du centre de la Terre avec une vitesse de \(7{,}3\ \text{km·s}^{-1}\), qui fait un angle de 80° avec \(\overrightarrow{OM}\).</p>
    <ol>
      <li>\(\|\vec L_O\|=m\,r\,v\sin80^\circ\approx5{,}75\times10^{13}\ \text{kg·m}^2\text{·s}^{-1}\) ; il est perpendiculaire au plan qui contient le centre de la Terre, le satellite et sa vitesse.</li>
      <li>Le satellite restera dans ce plan, quelle que soit la suite du mouvement, tant que la Terre est assimilée à une sphère et que les autres forces (Lune, frottement) sont négligées.</li>
      <li>Composantes de la vitesse : radiale \(v\cos80^\circ\approx1{,}3\ \text{km·s}^{-1}\) (le satellite s'éloigne), orthoradiale \(v\sin80^\circ\approx7{,}2\ \text{km·s}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la conservation de \(\vec L_O\) par rapport à un point qui n'est pas le centre de force, ou quand une autre force agit (frottement atmosphérique, poussée d'un moteur). Seul le moment par rapport au centre est nul.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LA LOI DES AIRES</div>
  <h2>La constante des aires et la vitesse aréolaire</h2>
  <div class="intro">La conservation du moment cinétique a une traduction géométrique, découverte par Kepler sur les observations de Mars bien avant Newton : le rayon vecteur balaie des aires égales pendant des durées égales.</div>
  <div class="def-box">
    <strong>Constante des aires.</strong> La composante \(L_z=mr^2\dot\theta\) étant constante, on définit la <strong>constante des aires</strong> (en \(\text{m}^2\text{·s}^{-1}\)), moment cinétique par unité de masse :
    <div class="formula" data-nom="Constante des aires">$$C=r^2\dot\theta=\frac{L_z}{m}\qquad\text{soit}\qquad L_z=mC$$</div>
  </div>
  <div class="prop-box">
    <strong>Loi des aires.</strong> Pendant \(\mathrm dt\), le rayon vecteur balaie le petit triangle d'aire \(\mathrm d\mathcal A=\tfrac12r\cdot r\,\mathrm d\theta\). La <strong>vitesse aréolaire</strong> est constante :
    <div class="formula" data-nom="Loi des aires">$$\frac{\mathrm d\mathcal A}{\mathrm dt}=\frac12r^2\dot\theta=\frac C2$$</div>
    Conséquences : \(\dot\theta\) garde un signe constant (le point tourne toujours dans le même sens) ; la vitesse orthoradiale \(v_\theta=C/r\) est d'autant plus grande que le point est proche du centre ; aux <strong>apsides</strong> (\(r\) minimal ou maximal, \(\dot r=0\)), la vitesse est orthoradiale et \(v=|C|/r\).
  </div>

  <div class="method-box"><strong>Exemple — la Terre au périhélie et à l'aphélie</strong>
    <p>La Terre passe au plus près du Soleil (périhélie, \(r_p=1{,}471\times10^{11}\ \text{m}\), début janvier) à \(v_p=30{,}29\ \text{km·s}^{-1}\) ; au plus loin (aphélie, début juillet), \(r_a=1{,}521\times10^{11}\ \text{m}\).</p>
    <ol>
      <li>Aux apsides, \(r_pv_p=r_av_a=C\) : \(v_a=v_pr_p/r_a\approx29{,}29\ \text{km·s}^{-1}\). La Terre va 3,4 % plus vite en janvier qu'en juillet : l'hiver de l'hémisphère nord est un peu plus court que l'été.</li>
      <li>\(C=r_pv_p\approx4{,}46\times10^{15}\ \text{m}^2\text{·s}^{-1}\) ; la vitesse aréolaire \(C/2\approx2{,}23\times10^{15}\ \text{m}^2\text{·s}^{-1}\) est bien l'aire de l'orbite, \(\pi ab\), divisée par la durée d'une année.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(C\) et le moment cinétique (il manque la masse : \(L_z=mC\)), ou écrire \(v=C/r\) en tout point. En dehors des apsides, la vitesse a une composante radiale : seule \(v_\theta\) vaut \(C/r\), et \(v^2=\dot r^2+C^2/r^2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FORCE CENTRALE CONSERVATIVE : ÉNERGIE MÉCANIQUE</div>
  <h2>Une deuxième constante du mouvement</h2>
  <div class="intro">Une force centrale dont l'intensité ne dépend que de la distance au centre dérive d'une énergie potentielle. Avec le moment cinétique, on dispose alors de deux grandeurs conservées : c'est assez pour tout savoir du mouvement radial, sans résoudre d'équation différentielle.</div>
  <div class="prop-box">
    <strong>Énergie potentielle.</strong> Une force centrale \(\vec F=f(r)\,\vec e_r\) dérive de l'énergie potentielle \(E_p(r)\) telle que \(f(r)=-\dfrac{\mathrm dE_p}{\mathrm dr}\) :
    <table>
      <tr><th>Interaction</th><th>\(f(r)\)</th><th>\(E_p(r)\) (origine)</th></tr>
      <tr><td>gravitation (masse \(M\) en \(O\))</td><td>\(-GMm/r^2\)</td><td>\(-GMm/r\) (nulle à l'infini)</td></tr>
      <tr><td>électrostatique (charge \(Q\) en \(O\))</td><td>\(qQ/(4\pi\varepsilon_0r^2)\)</td><td>\(qQ/(4\pi\varepsilon_0r)\) (nulle à l'infini)</td></tr>
      <tr><td>ressort attaché en \(O\)</td><td>\(-k(r-\ell_0)\)</td><td>\(\tfrac12k(r-\ell_0)^2\)</td></tr>
    </table>
  </div>
  <div class="prop-box">
    <strong>Conservation de l'énergie mécanique.</strong> Pour un point soumis à la seule force centrale conservative, dans un référentiel galiléen :
    <div class="formula" data-nom="Énergie mécanique dans un champ central">$$E_m=\frac12m\left(\dot r^2+r^2\dot\theta^2\right)+E_p(r)=\text{constante}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">À partir de l'équation du mouvement</span><div class="content">
    <p>On multiplie scalairement le principe fondamental, \(m\,\dfrac{\mathrm d\vec v}{\mathrm dt}=f(r)\,\vec e_r\), par \(\vec v\). À gauche, \(m\vec v\cdot\dfrac{\mathrm d\vec v}{\mathrm dt}=\dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12mv^2\right)\). À droite, \(\vec e_r\cdot\vec v=\dot r\), donc \(f(r)\,\dot r=-\dfrac{\mathrm dE_p}{\mathrm dr}\,\dot r=-\dfrac{\mathrm dE_p}{\mathrm dt}\). Ainsi \(\dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12mv^2+E_p(r)\right)=0\), avec \(v^2=\dot r^2+r^2\dot\theta^2\) en polaires.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — le satellite du §1 est-il lié à la Terre ?</strong>
    <p>\(GM_T=3{,}986\times10^{14}\ \text{m}^3\text{·s}^{-2}\) ; \(r=8\,000\ \text{km}\), \(v=7{,}3\ \text{km·s}^{-1}\).</p>
    <ol>
      <li>Énergie massique :
      <div class="formula">$$\frac{E_m}m=\frac{v^2}2-\frac{GM_T}r\approx2{,}66\times10^7-4{,}98\times10^7\approx-2{,}32\times10^7\ \text{J·kg}^{-1}$$</div></li>
      <li>Elle est négative : le satellite ne peut pas s'éloigner à l'infini (là, \(E_p=0\) et \(E_c\ge0\)). Il est lié à la Terre (§5).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · L'ÉNERGIE POTENTIELLE EFFECTIVE</div>
  <h2>Ramener le mouvement radial à une dimension</h2>
  <div class="intro">En éliminant \(\dot\theta\) grâce à la loi des aires, l'énergie mécanique ne dépend plus que de \(r\) et de \(\dot r\). Le mouvement radial se lit alors comme celui d'un point sur un axe, dans un profil d'énergie potentielle modifié (chapitre « Énergie mécanique », §3).</div>
  <div class="prop-box">
    <strong>Énergie potentielle effective.</strong> Avec \(r^2\dot\theta^2=C^2/r^2\) :
    <div class="formula" data-nom="Énergie potentielle effective">$$E_m=\frac12m\dot r^2+E_{p,\text{eff}}(r)\qquad E_{p,\text{eff}}(r)=\frac{mC^2}{2r^2}+E_p(r)=\frac{L_z^2}{2mr^2}+E_p(r)$$</div>
    Le terme \(\dfrac{mC^2}{2r^2}\), énergie cinétique orthoradiale, joue le rôle d'une énergie potentielle <strong>répulsive</strong> (« barrière centrifuge ») : dès que \(C\ne0\), le point ne peut pas atteindre \(O\).
  </div>
  <div class="prop-box">
    <strong>Lecture du graphe.</strong> Comme \(\tfrac12m\dot r^2=E_m-E_{p,\text{eff}}(r)\ge0\), le mouvement radial n'est possible que là où \(E_{p,\text{eff}}(r)\le E_m\). Les <strong>bornes</strong> du mouvement radial sont les solutions de \(E_{p,\text{eff}}(r)=E_m\) : ce sont les apsides (\(\dot r=0\)). Entre deux bornes, \(r\) oscille ; au minimum de \(E_{p,\text{eff}}\), \(r\) reste constant : trajectoire circulaire.
  </div>

<figcaption>Énergie potentielle effective \(E_{p,\text{eff}}(r)=\dfrac{mC^2}{2r^2}-\dfrac{GMm}{r}\) (trait plein), somme du terme centrifuge et de l'énergie potentielle (tirets), en unités de \(GMm/r_0\) avec \(r_0=C^2/(GM)\). Le mouvement radial n'est possible que là où \(E_m\ge E_{p,\text{eff}}(r)\). Au minimum (\(E_m=-\tfrac12\)), \(r=r_0\) reste constant : orbite circulaire. Pour \(-\tfrac12\lt E_m\lt0\), \(r\) oscille entre \(r_{\min}\) et \(r_{\max}\) : état lié. Pour \(E_m\ge0\), une seule borne : le point repart à l'infini, état de diffusion.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — bornes du mouvement du satellite du §1</strong>
    <ol>
      <li>\(C=rv\sin80^\circ\approx5{,}75\times10^{10}\ \text{m}^2\text{·s}^{-1}\) et \(E_m/m\approx-2{,}32\times10^7\ \text{J·kg}^{-1}\).</li>
      <li>Bornes : \(\dfrac{C^2}{2r^2}-\dfrac{GM_T}r=\dfrac{E_m}m\), soit, en multipliant par \(r^2\), \(\dfrac{E_m}m\,r^2+GM_T\,r-\dfrac{C^2}2=0\).</li>
      <li>Les deux racines, \(r_{\min}\approx6\,990\ \text{km}\) et \(r_{\max}\approx10\,200\ \text{km}\), encadrent les 8 000 km de départ : le satellite passe à 620 km d'altitude au périgée et à 3 830 km à l'apogée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(E_{p,\text{eff}}\) pour l'énergie potentielle « vraie ». C'est un outil pour le seul mouvement radial ; il dépend de \(C\), donc des conditions initiales, et le terme centrifuge n'est pas une force qui s'exerce sur le point (dans le référentiel galiléen, il n'y a que la force centrale).</div>

<div class="course-section">
  <div class="sec-num">§5 · ÉTAT LIÉ ET ÉTAT DE DIFFUSION</div>
  <h2>Le signe de l'énergie décide</h2>
  <div class="intro">Le graphe de l'énergie potentielle effective sépare deux comportements : le point reste à distance bornée du centre (planète, satellite), ou il vient de l'infini et y repart (comète non périodique, sonde qui quitte la Terre, particule diffusée par un noyau).</div>
  <div class="def-box">
    <strong>État lié, état de diffusion.</strong> Le mouvement est un <strong>état lié</strong> si \(r\) reste borné (deux bornes \(r_{\min}\) et \(r_{\max}\)) ; c'est un <strong>état de diffusion</strong> si \(r\) peut devenir infini (une seule borne \(r_{\min}\)).
  </div>
  <div class="prop-box">
    <strong>Champ newtonien attractif</strong> (\(E_p=-GMm/r\), \(C\ne0\)). \(E_{p,\text{eff}}\) tend vers \(+\infty\) en 0, vers 0 à l'infini, et passe par un minimum \(-\dfrac{GMm}{2r_0}\) en \(r_0=\dfrac{C^2}{GM}\). Donc :
    <ul>
      <li>\(E_m=E_{p,\text{eff}}(r_0)\) : \(r=r_0\), trajectoire circulaire ;</li>
      <li>\(E_{p,\text{eff}}(r_0)\lt E_m\lt0\) : état lié, \(r\) oscille entre \(r_{\min}\) et \(r_{\max}\) (trajectoire elliptique, §6) ;</li>
      <li>\(E_m\ge0\) : état de diffusion (trajectoire parabolique si \(E_m=0\), hyperbolique si \(E_m\gt0\), hors programme).</li>
    </ul>
    Le caractère borné du mouvement radial est donc fixé par le <strong>signe de l'énergie mécanique</strong>, l'origine de \(E_p\) étant prise à l'infini.
  </div>

    <ol>
      <li>La force est centrale, conservative et répulsive : \(E_p=\dfrac{2\times79\,e^2}{4\pi\varepsilon_0\,r}\). Tir de face : \(C=0\), pas de terme centrifuge.</li>
      <li>Énergie initiale (à l'infini) : \(E_m=5{,}0\ \text{MeV}\gt0\). État de diffusion : la particule s'arrête en \(r_{\min}\) puis repart.</li>

    </ol>

<div class="course-section">
  <div class="sec-num">§6 · CHAMP NEWTONIEN : LES LOIS DE KEPLER</div>
  <h2>Trois lois empiriques, expliquées par Newton</h2>
  <div class="intro">Entre 1609 et 1619, Kepler tire des observations de Tycho Brahé trois lois du mouvement des planètes. Newton les déduit en 1687 de la loi de la gravitation : elles sont le premier grand succès de la mécanique.</div>
  <div class="prop-box">
    <strong>Lois de Kepler</strong> (référentiel héliocentrique, attraction des autres planètes négligée).
    <ol>
      <li><strong>Première loi</strong> : chaque planète décrit une <strong>ellipse</strong> dont le Soleil occupe un foyer (résultat admis en PTSI).</li>
      <li><strong>Deuxième loi</strong> : le segment Soleil-planète balaie des <strong>aires égales en des durées égales</strong> (loi des aires, §2).</li>
      <li><strong>Troisième loi</strong> : le carré de la période est proportionnel au cube du demi-grand axe \(a\), avec la même constante pour toutes les planètes :</li>
    </ol>
    <div class="formula" data-nom="Troisième loi de Kepler">$$\frac{T^2}{a^3}=\frac{4\pi^2}{GM}$$</div>
    <strong>Satellites terrestres</strong> : les mêmes lois valent dans le référentiel géocentrique, la Terre (masse \(M_T\)) occupant le foyer ; le point le plus proche est le <strong>périgée</strong>, le plus éloigné l'<strong>apogée</strong>, et la constante devient \(4\pi^2/(GM_T)\), la même pour tous les satellites de la Terre (Lune comprise).
  </div>
  <table>
    <tr><th>Planète</th><td>Mercure</td><td>Vénus</td><td>Terre</td><td>Mars</td><td>Jupiter</td><td>Saturne</td></tr>
    <tr><th>\(a\) (UA)</th><td>0,387</td><td>0,723</td><td>1,000</td><td>1,524</td><td>5,203</td><td>9,537</td></tr>
    <tr><th>\(T\) (années)</th><td>0,241</td><td>0,615</td><td>1,000</td><td>1,881</td><td>11,86</td><td>29,46</td></tr>
    <tr><th>\(T^2/a^3\)</th><td>1,002</td><td>1,001</td><td>1,000</td><td>1,000</td><td>0,999</td><td>1,001</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — peser le Soleil</strong>
    <ol>
      <li>La Terre : \(a=1{,}496\times10^{11}\ \text{m}\), \(T=365{,}26\ \text{jours}\). La troisième loi donne \(GM_\odot=\dfrac{4\pi^2a^3}{T^2}\approx1{,}33\times10^{20}\ \text{m}^3\text{·s}^{-2}\).</li>
      <li>Avec \(G=6{,}67\times10^{-11}\ \text{SI}\) : \(M_\odot\approx2{,}0\times10^{30}\ \text{kg}\), 330 000 fois la masse de la Terre. La période et la taille d'une orbite suffisent à mesurer la masse de l'astre central.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : comparer \(T^2/a^3\) pour deux corps qui ne tournent pas autour du même astre. La constante \(4\pi^2/(GM)\) dépend de la masse de l'astre central : celle du système solaire n'est pas celle des satellites de la Terre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LE MOUVEMENT CIRCULAIRE</div>
  <h2>Vitesse, période et énergie d'une orbite circulaire</h2>
  <div class="intro">Le cas circulaire est le seul que le programme demande d'étudier en détail. Il donne directement la troisième loi de Kepler et les énergies d'un satellite.</div>
  <div class="prop-box">
    <strong>Le mouvement circulaire est uniforme.</strong> Si \(r=R\) est constant, la loi des aires \(R^2\dot\theta=C\) impose \(\dot\theta\) constant : \(v=R|\dot\theta|\) est constante.
  </div>
  <div class="prop-box">
    <strong>Vitesse et période.</strong> Projection du principe fondamental sur \(\vec e_r\) (accélération centripète \(v^2/R\)) : \(m\dfrac{v^2}R=\dfrac{GMm}{R^2}\), d'où
    <div class="formula" data-nom="Vitesse sur une orbite circulaire">$$v=\sqrt{\frac{GM}R}\qquad T=\frac{2\pi R}v=2\pi\sqrt{\frac{R^3}{GM}}\qquad\text{soit}\qquad\frac{T^2}{R^3}=\frac{4\pi^2}{GM}$$</div>
    C'est la troisième loi de Kepler dans le cas circulaire. La vitesse ne dépend ni de la masse du satellite, ni de rien d'autre que le rayon : plus l'orbite est haute, plus le satellite est lent.
  </div>
  <div class="prop-box">
    <strong>Énergies.</strong> \(E_c=\tfrac12mv^2=\dfrac{GMm}{2R}\), \(E_p=-\dfrac{GMm}R\), donc
    <div class="formula" data-nom="Énergie mécanique d'une orbite circulaire">$$E_m=-\frac{GMm}{2R}=-E_c=\frac{E_p}2$$</div>
  </div>
  <div class="method-box"><strong>Exemple — la Station spatiale internationale et la Lune</strong>
    <ol>
      <li>ISS à 420 km d'altitude : \(R=6\,791\ \text{km}\), \(v=\sqrt{GM_T/R}\approx7{,}66\ \text{km·s}^{-1}\), \(T\approx92{,}8\ \text{min}\) : environ seize tours par jour.</li>
      <li>Lune, \(R=384\,400\ \text{km}\) : \(T=2\pi\sqrt{R^3/(GM_T)}\approx27{,}4\ \text{jours}\), proche de la période observée (27,3 jours, la masse de la Lune n'étant pas tout à fait négligeable devant celle de la Terre).</li>
      <li>Paradoxe du freinage : le frottement de la haute atmosphère diminue \(E_m=-GMm/(2R)\), donc \(R\) diminue, et la vitesse \(\sqrt{GM/R}\) <strong>augmente</strong>. L'ISS doit être remontée régulièrement par ses moteurs.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : ajouter une « force centrifuge » qui équilibrerait la gravitation. Dans le référentiel géocentrique, galiléen, le satellite n'est soumis qu'à son poids : il n'est pas en équilibre, il tombe en permanence vers la Terre, et cette chute courbe sa trajectoire en cercle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · LE MOUVEMENT ELLIPTIQUE : ÉNERGIE ET DEMI-GRAND AXE</div>
  <h2>L'énergie ne dépend que de la taille de l'orbite</h2>
  <div class="intro">Le programme admet le caractère elliptique des trajectoires liées, mais demande d'exprimer leur énergie à l'aide des constantes du mouvement. Le résultat est d'une grande simplicité et sert à tous les calculs de changement d'orbite.</div>
  <div class="prop-box">
    <strong>Énergie d'une orbite elliptique.</strong> Pour une ellipse de demi-grand axe \(a=\tfrac12(r_{\min}+r_{\max})\) :
    <div class="formula" data-nom="Énergie d'une orbite elliptique">$$E_m=-\frac{GMm}{2a}$$</div>
    Elle ne dépend que de \(a\), pas de la forme de l'ellipse. La troisième loi de Kepler, \(T^2/a^3=4\pi^2/(GM)\), s'applique avec ce même \(a\) (admis).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Avec les deux constantes du mouvement</span><div class="content">
    <p>Aux apsides, \(\dot r=0\) : \(E_m=\dfrac{mC^2}{2r^2}-\dfrac{GMm}r\). En multipliant par \(r^2\), les deux distances \(r_{\min}\) et \(r_{\max}\) sont les racines de l'équation du second degré</p>
    <div class="formula">$$E_m\,r^2+GMm\,r-\frac{mC^2}2=0$$</div>
    <p>La somme des racines vaut \(-\dfrac{GMm}{E_m}\) ; or elle vaut \(r_{\min}+r_{\max}=2a\). D'où \(E_m=-\dfrac{GMm}{2a}\). Pour un cercle, \(a=R\) et l'on retrouve le §7. (Le produit des racines donne de même \(C^2=\dfrac{2GM\,r_{\min}r_{\max}}{r_{\min}+r_{\max}}\).)</p>
  </div></div>
  <div class="prop-box">
    <strong>Vitesse en un point de l'orbite.</strong> En égalant \(E_m=\tfrac12mv^2-\dfrac{GMm}r\) et \(-\dfrac{GMm}{2a}\) : \(v^2=GM\left(\dfrac2r-\dfrac1a\right)\). Plus le point est près du centre, plus il va vite.
  </div>
  <div class="method-box"><strong>Exemple — la comète de Halley</strong>
    <p>Elle passe au périhélie à \(r_p=0{,}586\ \text{UA}\) et revient tous les 75,3 ans. \(GM_\odot=1{,}327\times10^{20}\ \text{m}^3\text{·s}^{-2}\), 1 UA \(=1{,}496\times10^{11}\ \text{m}\).</p>
    <ol>
      <li>Troisième loi en unités terrestres (\(T\) en années, \(a\) en UA, même constante que la Terre) : \(a=T^{2/3}\approx17{,}8\ \text{UA}\), puis \(r_a=2a-r_p\approx35{,}1\ \text{UA}\), au-delà de Neptune.</li>
      <li>Au périhélie : \(v_p=\sqrt{GM_\odot\left(\dfrac2{r_p}-\dfrac1a\right)}\approx54{,}6\ \text{km·s}^{-1}\) ; à l'aphélie, par la loi des aires, \(v_a=v_pr_p/r_a\approx0{,}91\ \text{km·s}^{-1}\) : soixante fois moins vite.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — freiner pour descendre</strong>
    <p>L'ISS (orbite circulaire à 420 km, \(7{,}661\ \text{km·s}^{-1}\)) freine brièvement de \(10\ \text{m·s}^{-1}\).</p>
    <ol>
      <li>Juste après, au même endroit, \(E_m/m=\tfrac12(7\,651)^2-GM_T/R\) : l'énergie a diminué, donc \(a=-GM_Tm/(2E_m)\approx6\,773\ \text{km}\), au lieu de 6 791 km.</li>
      <li>Le point de freinage, où la vitesse est orthoradiale, devient l'apogée ; le périgée est à \(2a-R\approx6\,756\ \text{km}\) du centre, soit 385 km d'altitude : 35 km plus bas, de l'autre côté de la Terre.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : utiliser \(E_m=-GMm/(2a)\) avec \(a=r_{\max}\), ou \(v=\sqrt{GM/r}\) sur une ellipse. La première formule demande le demi-grand axe, la moyenne des distances extrêmes ; la seconde n'est valable que sur un cercle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SATELLITES TERRESTRES</div>
  <h2>Une orbite pour chaque mission</h2>
  <div class="intro">Plusieurs milliers de satellites tournent autour de la Terre. Leur orbite est choisie selon leur mission : rester au-dessus d'un même point, couvrir toute la Terre, voir les détails du sol, être visibles de partout pour la navigation.</div>
  <div class="prop-box">
    <strong>Satellite géostationnaire.</strong> Il reste fixe pour un observateur terrestre. Il faut donc :
    <ul>
      <li>une période égale à celle de la rotation de la Terre dans le référentiel géocentrique, le <strong>jour sidéral</strong> \(T=86\,164\ \text{s}\) (23 h 56 min), et le même sens de rotation ;</li>
      <li>une orbite <strong>circulaire</strong> (vitesse angulaire constante, d'après la loi des aires) ;</li>
      <li>une orbite dans le <strong>plan équatorial</strong> : pour rester à la verticale d'un même point, le satellite doit décrire le cercle parallèle à l'équateur centré sur l'axe des pôles ; or le plan de sa trajectoire passe par le centre de la Terre (§1) ; le seul parallèle dont le plan contient le centre est l'équateur.</li>
    </ul>
    Troisième loi : \(R=\left(\dfrac{GM_TT^2}{4\pi^2}\right)^{1/3}\approx42\,164\ \text{km}\), soit une altitude d'environ \(35\,800\ \text{km}\).
  </div>

  <div class="prop-box">
    <strong>Vitesse de libération.</strong> Pour échapper définitivement à la Terre depuis son sol (sans frottement), il faut \(E_m\ge0\), soit \(v\ge v_{\text{lib}}=\sqrt{\dfrac{2GM_T}{R_T}}\approx11{,}2\ \text{km·s}^{-1}\). C'est \(\sqrt2\) fois la vitesse de l'orbite circulaire rasante, \(\sqrt{GM_T/R_T}\approx7{,}9\ \text{km·s}^{-1}\).
  </div>
  <div class="method-box"><strong>Exemple — pourquoi lancer vers l'est, depuis l'équateur</strong>
    <ol>
      <li>Au sol, à l'équateur, la rotation de la Terre donne déjà \(2\pi R_T/T\approx465\ \text{m·s}^{-1}\) vers l'est dans le référentiel géocentrique.</li>
      <li>Un lanceur tiré vers l'est en profite : il gagne environ 6 % des 7,9 km/s nécessaires pour une orbite basse. Kourou (5° de latitude) est bien placé pour cela, et pour atteindre le plan équatorial des satellites géostationnaires.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§10 · SIMULATION NUMÉRIQUE DES TRAJECTOIRES</div>
  <h2>Obtenir les trajectoires avec Python</h2>
  <div class="intro">Le programme demande d'obtenir des trajectoires par le calcul. On résout le principe fondamental en coordonnées cartésiennes dans le plan du mouvement, avec <span class="code-inline">odeint</span>, puis on valide le résultat en vérifiant qu'il conserve les deux constantes du mouvement.</div>
  <p>Dans le plan du mouvement, l'état est \(Y=(x,y,v_x,v_y)\) et le principe fondamental s'écrit \(\dot v_x=-GMx/r^3\), \(\dot v_y=-GMy/r^3\), avec \(r=\sqrt{x^2+y^2}\). On lance le point en \((r_0,0)\) avec une vitesse orthoradiale \(\alpha\,v_c\), où \(v_c=\sqrt{GM/r_0}\) est la vitesse circulaire :</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">from</span> scipy.integrate <span class="kw">import</span> odeint

GM = 3.986e14                     <span class="cmt"># m^3/s^2 (Terre)</span>

<span class="kw">def</span> F(Y, t):                      <span class="cmt"># Y = (x, y, vx, vy) ; ordre (Y, t) imposé par odeint</span>
    x, y, vx, vy = Y
    r3 = (x**2 + y**2)**1.5
    <span class="kw">return</span> [vx, vy, -GM * x / r3, -GM * y / r3]

r0 = 1.0e7                        <span class="cmt"># départ à 10 000 km du centre de la Terre</span>
vc = np.sqrt(GM / r0)             <span class="cmt"># vitesse du mouvement circulaire (6,3 km/s)</span>
t = np.linspace(0, 3e4, 30001)    <span class="cmt"># 30 000 s, pas d'affichage de 1 s</span>

<span class="kw">for</span> alpha <span class="kw">in</span> [0.9, 1.0, 1.2]:     <span class="cmt"># vitesse de lancement orthoradiale alpha * vc</span>
    x, y, vx, vy = odeint(F, [r0, 0, 0, alpha * vc], t, rtol=1e-10, atol=1e-6).T
    r = np.sqrt(x**2 + y**2)
    Em = 0.5 * (vx**2 + vy**2) - GM / r       <span class="cmt"># énergie mécanique massique (J/kg)</span>
    C = x * vy - y * vx                       <span class="cmt"># constante des aires (m^2/s)</span>
    print(alpha, round(r.min() / 1e3), round(r.max() / 1e3),          <span class="cmt"># km</span>
          abs(Em.max() - Em.min()) / abs(Em[0]), (C.max() - C.min()) / C[0])</pre>

  <div class="method-box"><strong>Exemple — lecture et validation des résultats</strong>
    <ol>
      <li>Le programme affiche \(r\) entre 6 807 et 10 000 km pour \(\alpha=0{,}9\), 10 000 km constant pour \(\alpha=1\), entre 10 000 et 25 714 km pour \(\alpha=1{,}2\). Le calcul du §8 donne pour l'autre apside \(r_0\alpha^2/(2-\alpha^2)\) : 6 807 et 25 714 km, exactement.</li>
      <li>Les variations relatives de \(E_m\) et de \(C\) sont de l'ordre de \(10^{-8}\) : les deux constantes du mouvement sont bien conservées. C'est le contrôle à faire sur toute simulation d'orbite.</li>
      <li>Avec \(\alpha\ge\sqrt2\) (\(E_m\ge0\)), la trajectoire n'est plus fermée : le point part à l'infini (figure).</li>
    </ol>
  </div>
  <p>La méthode d'Euler (chapitre « Méthodes numériques », §6), appliquée au même vecteur d'état, est ici un mauvais choix : elle fait gagner de l'énergie au satellite à chaque pas.</p>
  <pre class="codeblock"><span class="kw">def</span> euler(F, t0, y0, h, n):          <span class="cmt"># fonction du chapitre « Méthodes numériques »</span>
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys

<span class="kw">def</span> Fe(t, Y):                         <span class="cmt"># même champ, ordre (t, Y) et tableaux numpy</span>
    x, y, vx, vy = Y
    r3 = (x**2 + y**2)**1.5
    <span class="kw">return</span> np.array([vx, vy, -GM * x / r3, -GM * y / r3])

T = 2 * np.pi * np.sqrt(r0**3 / GM)  <span class="cmt"># période du cercle : 9 952 s</span>
<span class="kw">for</span> h <span class="kw">in</span> [100.0, 10.0]:
    ts, Ys = euler(Fe, 0, np.array([r0, 0, 0, vc]), h, round(5 * T / h))
    x, y = Ys[-1][0], Ys[-1][1]
    print(h, round(np.hypot(x, y) / 1e3))    <span class="cmt"># rayon (km) après 5 tours</span></pre>
  <div class="method-box"><strong>Exemple — la dérive de la méthode d'Euler</strong>
    <ol>
      <li>Pour l'orbite circulaire de 10 000 km, après cinq tours, Euler donne un rayon de 20 662 km avec un pas de 100 s (cent pas par tour) et encore 12 955 km avec 10 s : la trajectoire calculée est une spirale qui s'éloigne.</li>
      <li>L'erreur ne se compense pas d'un tour à l'autre : elle s'accumule. Pour un mouvement périodique sur de longues durées, on préfère <span class="code-inline">odeint</span> (pas adaptatif, méthode d'ordre élevé), et l'on surveille toujours \(E_m\) et \(C\).</li>
    </ol>
  </div>

<figcaption>Même lancement (vitesse orthoradiale, 75 % de la vitesse circulaire), même durée de simulation, deux lois de force attractive. À gauche, force en \(1/r^2\) : la trajectoire se referme, c'est toujours la même ellipse. À droite, force en \(1/r^{2{,}3}\) : le mouvement radial oscille toujours entre deux bornes (état lié), mais la trajectoire ne se referme pas et dessine une rosette. Les orbites fermées sont une particularité du champ newtonien (et du ressort).</figcaption>
</figure>
  <div class="prop-box">
    <strong>Ce que montrent les simulations.</strong> Pour tout champ central conservatif, \(\vec L_O\) et \(E_m\) sont conservés, le mouvement est plan et suit la loi des aires, et un état lié a un mouvement radial périodique entre deux bornes. Mais la trajectoire ne se <strong>referme</strong> en général pas : elle dessine une rosette. Les orbites liées sont fermées pour toutes les conditions initiales seulement pour la force newtonienne et pour la force élastique d'un ressort de longueur à vide nulle (théorème de Bertrand, hors programme).
  </div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>L'équation de la trajectoire et les coniques</h2>
  <div class="notice"><strong>Hors programme en PTSI (pour aller plus loin).</strong> L'établissement de l'équation de la trajectoire et l'étude géométrique des coniques ne sont pas exigibles : le programme se limite au cas circulaire et admet le caractère elliptique des états liés.</div>
  <h3>Formule de Binet</h3>
  <p>En posant \(u=1/r\) et en utilisant \(C=r^2\dot\theta\), on obtient \(\dot r=-C\dfrac{\mathrm du}{\mathrm d\theta}\), puis \(\ddot r=-C^2u^2\dfrac{\mathrm d^2u}{\mathrm d\theta^2}\). La projection radiale du principe fondamental, \(m(\ddot r-r\dot\theta^2)=f(r)\), devient une équation en \(u(\theta)\). Pour la gravitation :</p>
  <div class="formula">$$\frac{\mathrm d^2u}{\mathrm d\theta^2}+u=\frac{GM}{C^2}$$</div>
  <h3>Trajectoires coniques</h3>
  <p>La solution, \(u=\dfrac{GM}{C^2}\left(1+e\cos(\theta-\theta_0)\right)\), donne l'équation polaire d'une conique de foyer \(O\) :</p>
  <div class="formula">$$r=\frac{p}{1+e\cos(\theta-\theta_0)}\qquad p=\frac{C^2}{GM}$$</div>
  <p>Le <strong>paramètre</strong> \(p\) fixe la taille ; l'<strong>excentricité</strong> \(e\) fixe la forme et dépend de l'énergie : \(e=0\) cercle, \(0\lt e\lt1\) ellipse (\(E_m\lt0\)), \(e=1\) parabole (\(E_m=0\)), \(e\gt1\) hyperbole (\(E_m\gt0\)). Pour une ellipse, \(r_{\min}=p/(1+e)\), \(r_{\max}=p/(1-e)\), \(a=p/(1-e^2)\) et \(e=\dfrac{r_{\max}-r_{\min}}{r_{\max}+r_{\min}}\). Courbes et coniques sont étudiées en mathématiques (chapitre « Courbes du plan et coniques »).</p>

  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 2.6 du programme : établir la conservation du moment cinétique et ses conséquences, utiliser la loi des aires, construire et lire l'énergie potentielle effective, étudier une orbite circulaire, exploiter les lois de Kepler et l'énergie d'une orbite elliptique, choisir une orbite de satellite et simuler une trajectoire. Données utiles : \(GM_T=3{,}986\times10^{14}\ \text{m}^3\text{·s}^{-2}\), \(R_T=6\,371\ \text{km}\).</div>

  <div class="method-box"><strong>Méthode 1 — Établir la conservation du moment cinétique et le mouvement plan</strong>
    <ol>
      <li><span class="step">Bilan.</span> Référentiel galiléen où le centre \(O\) est fixe ; vérifier que la seule force (ou la somme des forces) passe par \(O\).</li>
      <li><span class="step">Théorème.</span> Moment nul en \(O\), donc \(\mathrm d\vec L_O/\mathrm dt=\vec0\) : \(\vec L_O\) est un vecteur constant.</li>
      <li><span class="step">Plan.</span> \(\overrightarrow{OM}\perp\vec L_O\) : le mouvement est dans le plan passant par \(O\) et perpendiculaire à \(\vec L_O\), fixé par la position et la vitesse initiales (rectiligne radial si \(\vec L_O=\vec0\)).</li>
      <li><span class="step">Polaires.</span> Écrire \(L_z=mr^2\dot\theta=mC\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une comète dans le référentiel héliocentrique, attirée par le Soleil seul : force portée par la droite Soleil-comète, \(\vec L_O\) constant, trajectoire plane. L'attraction des planètes, qui ne passe pas par le Soleil, fait lentement tourner ce plan.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Utiliser la loi des aires</strong>
    <ol>
      <li><span class="step">Constante.</span> Calculer \(C=r^2\dot\theta=r\,v_\theta\) en un point où l'on connaît tout ; aux apsides, \(C=rv\).</li>
      <li><span class="step">Transporter.</span> En tout autre point, \(v_\theta=C/r\) ; à l'autre apside, \(v=C/r\).</li>
      <li><span class="step">Vérifier.</span> La conservation de l'énergie doit donner le même résultat : les deux lois sont indépendantes, et des données incohérentes se repèrent ainsi.</li>
    </ol>
    <p><em>Exemple éclair :</em> un satellite a son périgée à 7 000 km du centre de la Terre, avec \(v_p=8{,}48\ \text{km·s}^{-1}\), et son apogée à 12 000 km. Loi des aires : \(v_a=v_pr_p/r_a\approx4{,}95\ \text{km·s}^{-1}\). Contrôle par l'énergie : \(v_a^2=v_p^2-2GM_T(1/r_p-1/r_a)\) donne aussi \(4{,}95\ \text{km·s}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(r_1v_1=r_2v_2\) avec des vitesses qui ne sont pas orthoradiales. La loi des aires porte sur \(r\,v_\theta\), pas sur \(r\,v\).</div>

  <div class="method-box"><strong>Méthode 3 — Écrire l'énergie mécanique et construire l'énergie potentielle effective</strong>
    <ol>
      <li><span class="step">Énergie potentielle.</span> \(E_p(r)\) telle que \(f(r)=-\mathrm dE_p/\mathrm dr\), avec l'origine adaptée (à l'infini pour la gravitation).</li>
      <li><span class="step">Énergie mécanique.</span> \(E_m=\tfrac12m(\dot r^2+r^2\dot\theta^2)+E_p(r)\), constante (la démontrer en multipliant le principe fondamental par \(\vec v\) si l'énoncé le demande).</li>
      <li><span class="step">Éliminer \(\dot\theta\).</span> \(r^2\dot\theta^2=C^2/r^2\) : \(E_m=\tfrac12m\dot r^2+E_{p,\text{eff}}(r)\) avec \(E_{p,\text{eff}}=\dfrac{mC^2}{2r^2}+E_p(r)\).</li>
      <li><span class="step">Orbite circulaire.</span> Minimum de \(E_{p,\text{eff}}\) : \(E_{p,\text{eff}}'(r_0)=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> palet de 0,50 kg relié à un point fixe \(O\) d'une table horizontale par un ressort de raideur \(20\ \text{N·m}^{-1}\) et de longueur à vide nulle, avec \(C=0{,}40\ \text{m}^2\text{·s}^{-1}\). \(E_{p,\text{eff}}=\dfrac{mC^2}{2r^2}+\tfrac12kr^2\), minimale pour \(r_0^4=mC^2/k\) : \(r_0\approx0{,}25\ \text{m}\), parcouru à \(\dot\theta=C/r_0^2\approx6{,}3\ \text{rad·s}^{-1}=\sqrt{k/m}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Discuter la nature du mouvement sur le graphe de l'énergie potentielle effective</strong>
    <ol>
      <li><span class="step">Tracer</span> \(E_{p,\text{eff}}(r)\) : limites en 0 et à l'infini, extremums.</li>
      <li><span class="step">Placer</span> la droite horizontale \(E=E_m\) ; les zones permises sont celles où \(E_{p,\text{eff}}\le E_m\).</li>
      <li><span class="step">Conclure.</span> Deux bornes : état lié, \(r\) oscille ; une seule : état de diffusion ; \(E_m\) égale au minimum : cercle. Pour la gravitation, le signe de \(E_m\) suffit.</li>
    </ol>
    <p><em>Exemple éclair :</em> un satellite passe à 8 000 km du centre de la Terre. Avec \(9{,}5\ \text{km·s}^{-1}\), \(E_m/m\approx-4{,}7\times10^6\ \text{J·kg}^{-1}\lt0\) : lié. Avec \(10{,}0\ \text{km·s}^{-1}\), \(E_m/m\approx+1{,}8\times10^5\ \text{J·kg}^{-1}\gt0\) : il s'échappe. La frontière est la vitesse de libération à cette distance, \(\sqrt{2GM_T/r}\approx9{,}98\ \text{km·s}^{-1}\), quelle que soit la direction de la vitesse.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Étudier une orbite circulaire</strong>
    <ol>
      <li><span class="step">Uniforme.</span> \(r\) constant et \(r^2\dot\theta=C\) : \(\dot\theta\) constant.</li>
      <li><span class="step">Vitesse.</span> Principe fondamental sur \(\vec e_r\) : \(mv^2/r=GMm/r^2\), \(v=\sqrt{GM/r}\).</li>
      <li><span class="step">Période.</span> \(T=2\pi r/v\), d'où \(T^2/r^3=4\pi^2/(GM)\).</li>
      <li><span class="step">Énergies.</span> \(E_c=GMm/(2r)\), \(E_p=-GMm/r\), \(E_m=-GMm/(2r)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> satellite de 500 kg à 700 km d'altitude : \(r=7\,071\ \text{km}\), \(v\approx7{,}51\ \text{km·s}^{-1}\), \(T\approx98{,}6\ \text{min}\), \(E_m\approx-1{,}41\times10^{10}\ \text{J}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : prendre l'altitude au lieu de la distance au centre. Dans toutes les formules, \(r=R_T+h\).</div>

  <div class="method-box"><strong>Méthode 6 — Exploiter la troisième loi de Kepler</strong>
    <ol>
      <li><span class="step">Même astre central.</span> Pour deux corps autour du même astre, \(T_1^2/a_1^3=T_2^2/a_2^3\) : on travaille en unités commodes (années et UA autour du Soleil).</li>
      <li><span class="step">Mesurer une masse.</span> \(GM=4\pi^2a^3/T^2\), à partir d'un seul satellite naturel ou artificiel.</li>
      <li><span class="step">Ellipse.</span> Utiliser le demi-grand axe \(a=(r_{\min}+r_{\max})/2\) (généralisation admise).</li>
    </ol>
    <p><em>Exemple éclair :</em> Io tourne autour de Jupiter en 1,769 jour à 421 700 km : \(M_J=\dfrac{4\pi^2a^3}{GT^2}\approx1{,}9\times10^{27}\ \text{kg}\), environ 320 fois la masse de la Terre.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Calculer l'énergie et la vitesse sur une orbite elliptique</strong>
    <ol>
      <li><span class="step">Demi-grand axe.</span> \(a=(r_{\min}+r_{\max})/2\), avec les distances au <strong>centre</strong> de l'astre.</li>
      <li><span class="step">Énergie.</span> \(E_m=-GMm/(2a)\).</li>
      <li><span class="step">Vitesse.</span> \(v^2=GM\left(\dfrac2r-\dfrac1a\right)\) en tout point ; aux apsides, contrôler par \(r_pv_p=r_av_a\).</li>
    </ol>
    <p><em>Exemple éclair :</em> orbite de transfert de périgée 6 700 km et d'apogée 42 164 km (distances au centre) : \(a=24\,432\ \text{km}\), \(v_p\approx10{,}13\ \text{km·s}^{-1}\), \(v_a\approx1{,}61\ \text{km·s}^{-1}\) ; contrôle : \(v_pr_p/r_a\approx1{,}61\ \text{km·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Faire un changement d'orbite (transfert de Hohmann)</strong>
    <ol>
      <li><span class="step">Orbite de transfert.</span> Ellipse tangente aux deux cercles : périgée sur l'orbite basse \(r_1\), apogée sur l'orbite haute \(r_2\), \(a=(r_1+r_2)/2\).</li>
      <li><span class="step">Première impulsion.</span> Au périgée, passer de \(v_1=\sqrt{GM/r_1}\) à \(v_p\) (méthode 7) : \(\Delta v_1=v_p-v_1\).</li>
      <li><span class="step">Seconde impulsion.</span> Une demi-période plus tard, à l'apogée, passer de \(v_a\) à \(v_2=\sqrt{GM/r_2}\) : \(\Delta v_2=v_2-v_a\).</li>
      <li><span class="step">Durée.</span> Demi-période de l'ellipse : \(\pi\sqrt{a^3/(GM)}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> de 6 700 km à l'orbite géostationnaire : \(\Delta v_1\approx10{,}13-7{,}71=2{,}42\ \text{km·s}^{-1}\), \(\Delta v_2\approx3{,}07-1{,}61=1{,}46\ \text{km·s}^{-1}\), transfert en 5 h 17 min.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Déterminer une orbite synchrone et choisir une orbite</strong>
    <ol>
      <li><span class="step">Période imposée.</span> Géostationnaire : jour sidéral \(T=86\,164\ \text{s}\) ; GPS : la moitié.</li>
      <li><span class="step">Rayon.</span> \(R=\left(GM\,T^2/(4\pi^2)\right)^{1/3}\), puis l'altitude \(h=R-R_{\text{astre}}\).</li>
      <li><span class="step">Plan.</span> Pour rester au-dessus d'un même point : plan équatorial (le plan de l'orbite contient le centre), orbite circulaire, même sens de rotation que l'astre.</li>
      <li><span class="step">Mission.</span> Basse pour voir les détails et la station habitée ; héliosynchrone polaire pour l'imagerie et la météo de toute la Terre ; moyenne pour la navigation ; géostationnaire pour les télécommunications et la météo continue d'un hémisphère.</li>
    </ol>
    <p><em>Exemple éclair :</em> orbite « aréostationnaire » autour de Mars (\(GM=4{,}283\times10^{13}\ \text{m}^3\text{·s}^{-2}\), jour sidéral 88 643 s, rayon 3 390 km) : \(R\approx20\,430\ \text{km}\), altitude 17 040 km.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Simuler une trajectoire et valider la simulation</strong>
    <ol>
      <li><span class="step">Vecteur d'état.</span> \(Y=(x,y,v_x,v_y)\) dans le plan du mouvement ; dérivée \((v_x,v_y,f(r)\,x/(mr),f(r)\,y/(mr))\).</li>
      <li><span class="step">Résoudre.</span> <span class="code-inline">odeint(F, Y0, t)</span> avec la fonction écrite dans l'ordre \((Y,t)\), sur plusieurs périodes, tolérances serrées.</li>
      <li><span class="step">Valider.</span> \(E_m\) et \(C=xv_y-yv_x\) doivent rester constants (écart relatif de l'ordre de la tolérance) ; comparer à un cas connu (cercle pour \(v_0=v_c\), apside calculée par l'énergie).</li>
      <li><span class="step">Méfiance.</span> La méthode d'Euler fait dériver l'énergie : la trajectoire spirale vers l'extérieur.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour un lancement orthoradial à 10 000 km avec \(1{,}2\,v_c\), le programme du cours donne une apogée à 25 714 km, exactement \(r_0\alpha^2/(2-\alpha^2)\), et des variations relatives de \(E_m\) et de \(C\) d'environ \(10^{-8}\).</p>
  </div>
</div>
</template>

    <p><strong>Q3.</strong> \(E_m=-\dfrac{GM_Tm}{2R}\approx-1{,}47\times10^{10}\ \text{J}\). Négative : état lié, le satellite ne peut pas s'échapper sans recevoir au moins \(1{,}47\times10^{10}\ \text{J}\).</p>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(T^2/a^3\) a la même valeur pour tous les corps qui tournent autour du Soleil, et vaut 1 pour la Terre dans ces unités. Mars : \(T=1{,}524^{3/2}\approx1{,}88\ \text{an}\).</p>
    <p><strong>Q2.</strong> \(a=8{,}0^{2/3}=4{,}0\ \text{UA}\) : dans la ceinture d'astéroïdes, entre Mars et Jupiter.</p>
    <p><strong>Q3.</strong> \(T=27\,540\ \text{s}\) ; \(GM_{\text{Mars}}=4\pi^2a^3/T^2\approx4{,}29\times10^{13}\ \text{m}^3\text{·s}^{-2}\), \(M\approx6{,}4\times10^{23}\ \text{kg}\), environ un dixième de la masse de la Terre. Phobos tourne autour de Mars, pas du Soleil : la constante de la troisième loi est \(4\pi^2/(GM_{\text{Mars}})\).</p>

  <div class="q"><strong>Q2.</strong> Calculer le demi-grand axe et la période.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'énergie mécanique massique au périhélie et vérifier qu'elle vaut \(-GM_\odot/(2a)\).</div>

    <p><strong>Q1.</strong> Aux apsides, la vitesse est orthoradiale : \(r_pv_p=r_av_a\), \(v_a=58{,}13\times0{,}50/10\approx2{,}91\ \text{km·s}^{-1}\), vingt fois moins qu'au périhélie.</p>

  <div class="q"><strong>Q3.</strong> Même question pour la Terre, avec du diazote et du dihydrogène à 290 K.</div>

  <div class="q"><strong>Q1.</strong> Écrire l'énergie potentielle effective massique \(e(r)=\dfrac{C^2}{2r^2}-\dfrac{GM}r\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le rayon \(r_0\) de l'orbite circulaire, la valeur de \(e(r_0)\) et la vitesse sur cette orbite.</div>
  <div class="q"><strong>Q3.</strong> Son énergie mécanique massique vaut \(-2{,}0\times10^7\ \text{J·kg}^{-1}\). Déterminer les distances extrêmes. Le satellite risque-t-il de toucher la planète ? Retrouver le demi-grand axe par \(E_m=-GMm/(2a)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{E_m}m=\tfrac12\dot r^2+e(r)\) avec \(e(r)=\dfrac{C^2}{2r^2}-\dfrac{GM}r\) : barrière centrifuge en \(1/r^2\), puits gravitationnel en \(-1/r\).</p>
    <p><strong>Q2.</strong> \(e'(r)=-\dfrac{C^2}{r^3}+\dfrac{GM}{r^2}=0\) pour \(r_0=C^2/(GM)=9{,}0\times10^6\ \text{m}\). \(e(r_0)=-\dfrac{GM}{2r_0}\approx-2{,}22\times10^7\ \text{J·kg}^{-1}\) ; \(v=C/r_0\approx6{,}67\ \text{km·s}^{-1}\) (égale à \(\sqrt{GM/r_0}\)).</p>
    <p><strong>Q3.</strong> \(-2{,}0\times10^7\) est au-dessus du minimum et négative : état lié. Bornes : \(e(r)=E_m/m\), soit \(\dfrac{E_m}m\,r^2+GM\,r-\dfrac{C^2}2=0\), d'où \(r_{\min}\approx6\,840\ \text{km}\) et \(r_{\max}\approx13\,160\ \text{km}\). Le périgée est à 440 km de la surface : pas de collision (mais du frottement atmosphérique si la planète a une atmosphère). \(a=GM/(2\times2{,}0\times10^7)=1{,}0\times10^7\ \text{m}\), bien égal à \((r_{\min}+r_{\max})/2\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Un palet relié à un ressort : une force centrale qui n'est pas newtonienne</h3>
  <div class="statement">Un palet de masse \(m=0{,}20\ \text{kg}\) glisse sans frottement sur une table horizontale. Il est relié à un point fixe \(O\) de la table par un ressort de raideur \(k=8{,}0\ \text{N·m}^{-1}\) et de longueur à vide \(\ell_0=0{,}10\ \text{m}\). On le lance à \(r_1=0{,}30\ \text{m}\) de \(O\) avec une vitesse orthoradiale \(v_1=1{,}2\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que le moment cinétique par rapport à \(O\) et l'énergie mécanique sont conservés. Calculer \(C\).</div>
  <div class="q"><strong>Q2.</strong> Écrire l'énergie potentielle effective. Montrer que tout mouvement est borné.</div>
  <div class="q"><strong>Q3.</strong> Le palet décrit-il un cercle ? Sinon, \(r\) augmente-t-il ou diminue-t-il au départ ?</div>
  <div class="q"><strong>Q4.</strong> Déterminer numériquement l'autre borne du mouvement radial, et la vitesse en ce point.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Poids et réaction de la table se compensent ; la force du ressort est portée par \(\overrightarrow{MO}\) : centrale, de moment nul en \(O\). Elle dérive de \(E_p=\tfrac12k(r-\ell_0)^2\) ; la réaction (sans frottement) ne travaille pas. Donc \(\vec L_O\) et \(E_m\) sont conservés. \(C=r_1v_1=0{,}36\ \text{m}^2\text{·s}^{-1}\).</p>
    <p><strong>Q2.</strong> \(E_{p,\text{eff}}(r)=\dfrac{mC^2}{2r^2}+\tfrac12k(r-\ell_0)^2\) tend vers \(+\infty\) en 0 (barrière centrifuge) et à l'infini (ressort) : toute valeur de \(E_m\) donne deux bornes, l'état est toujours lié.</p>
    <p><strong>Q3.</strong> Un cercle de rayon \(r_1\) demanderait une force centripète \(mv_1^2/r_1=0{,}96\ \text{N}\) ; le ressort exerce \(k(r_1-\ell_0)=1{,}6\ \text{N}\), plus : le palet commence par se rapprocher de \(O\). \(r_1\) est donc la borne supérieure. (L'orbite circulaire pour ce \(C\) est en \(r_0\approx0{,}268\ \text{m}\), où \(mC^2/r^3=k(r-\ell_0)\).)</p>
    <p><strong>Q4.</strong> \(E_m=E_{p,\text{eff}}(r_1)=0{,}304\ \text{J}\). L'équation \(E_{p,\text{eff}}(r)=0{,}304\ \text{J}\), résolue par dichotomie entre 0,05 et 0,29 m, donne \(r_{\min}\approx0{,}239\ \text{m}\). Vitesse (orthoradiale, puisque \(\dot r=0\)) : \(C/r_{\min}\approx1{,}50\ \text{m·s}^{-1}\). Le palet oscille entre 0,239 et 0,300 m de \(O\) ; sa trajectoire n'est en général pas fermée (rosette, cours §10).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Le satellite géostationnaire</h3>
  <div class="statement">Un satellite géostationnaire reste à la verticale d'un même point de la Terre. \(GM_T=3{,}986\times10^{14}\ \text{m}^3\text{·s}^{-2}\), \(R_T=6\,371\ \text{km}\), jour sidéral \(T=86\,164\ \text{s}\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que son orbite est circulaire, dans le plan équatorial, parcourue dans le sens de rotation de la Terre, avec la période \(T\). Pourquoi le jour sidéral et non 24 h ?</div>
  <div class="q"><strong>Q2.</strong> Établir la troisième loi de Kepler pour une orbite circulaire, puis calculer le rayon et l'altitude de l'orbite.</div>
  <div class="q"><strong>Q3.</strong> Calculer sa vitesse. Comparer à la vitesse d'un point de l'équateur dans le référentiel géocentrique.</div>
  <div class="q"><strong>Q4.</strong> Un satellite peut-il être géostationnaire au-dessus de Paris ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Il doit tourner à la vitesse angulaire de la Terre, constante : par la loi des aires, \(r^2\dot\theta\) constant et \(\dot\theta\) constant imposent \(r\) constant, orbite circulaire. Pour rester au-dessus d'un même point, il doit décrire un cercle centré sur l'axe des pôles ; le plan de son orbite passe par le centre de la Terre (force centrale) : seul l'équateur convient. La Terre fait un tour sur elle-même, dans le référentiel géocentrique, en un jour sidéral ; les 24 h du jour solaire tiennent compte en plus du mouvement de la Terre autour du Soleil.</p>
    <p><strong>Q2.</strong> \(mv^2/R=GM_Tm/R^2\) et \(v=2\pi R/T\) donnent \(T^2/R^3=4\pi^2/(GM_T)\). \(R=\left(GM_TT^2/(4\pi^2)\right)^{1/3}\approx4{,}216\times10^7\ \text{m}\), altitude \(\approx35\,800\ \text{km}\).</p>
    <p><strong>Q3.</strong> \(v=2\pi R/T\approx3{,}07\ \text{km·s}^{-1}\), six fois et demie la vitesse d'un point de l'équateur (\(465\ \text{m·s}^{-1}\)) : même vitesse angulaire, rayon 6,6 fois plus grand.</p>
    <p><strong>Q4.</strong> Non : au-dessus de Paris, il devrait décrire un parallèle de latitude 49°, dont le plan ne contient pas le centre de la Terre. Vus de Paris, les satellites géostationnaires sont tous au-dessus de l'horizon sud, à environ 34° de hauteur au maximum.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Transfert de Hohmann</h3>
  <div class="statement">On transfère un satellite d'une orbite circulaire de rayon \(r_1=7\,000\ \text{km}\) à l'orbite géostationnaire \(r_2=42\,164\ \text{km}\), par une demi-ellipse tangente aux deux cercles (périgée sur le premier, apogée sur le second). \(GM_T=3{,}986\times10^{14}\ \text{m}^3\text{·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les vitesses \(v_1\) et \(v_2\) sur les deux orbites circulaires.</div>
  <div class="q"><strong>Q2.</strong> Calculer le demi-grand axe de l'ellipse de transfert, puis la vitesse au périgée \(v_p\) par la conservation de l'énergie (\(E_m=-GM_Tm/(2a)\)), et à l'apogée \(v_a\) par la loi des aires.</div>
  <div class="q"><strong>Q3.</strong> Calculer les deux variations de vitesse nécessaires et la durée du transfert.</div>
  <div class="q"><strong>Q4.</strong> Comparer les énergies mécaniques massiques des trois orbites. Le satellite final est plus lent que le satellite initial : pourquoi a-t-il fallu lui fournir de l'énergie ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v_1=\sqrt{GM_T/r_1}\approx7{,}55\ \text{km·s}^{-1}\) ; \(v_2\approx3{,}07\ \text{km·s}^{-1}\).</p>
    <p><strong>Q2.</strong> \(a=(r_1+r_2)/2=24\,582\ \text{km}\). Au périgée : \(\tfrac12v_p^2-GM_T/r_1=-GM_T/(2a)\), soit \(v_p=\sqrt{GM_T(2/r_1-1/a)}\approx9{,}88\ \text{km·s}^{-1}\). À l'apogée : \(v_a=v_pr_1/r_2\approx1{,}64\ \text{km·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(\Delta v_1=v_p-v_1\approx2{,}34\ \text{km·s}^{-1}\) (accélérer au périgée) ; \(\Delta v_2=v_2-v_a\approx1{,}43\ \text{km·s}^{-1}\) (accélérer à l'apogée pour circulariser) ; au total \(3{,}77\ \text{km·s}^{-1}\). Durée : une demi-période de l'ellipse, \(\pi\sqrt{a^3/(GM_T)}\approx5\ \text{h}\,20\ \text{min}\).</p>
    <p><strong>Q4.</strong> \(-GM_T/(2r)\) : \(-2{,}85\times10^7\) (orbite basse), \(-8{,}11\times10^6\) (transfert), \(-4{,}73\times10^6\ \text{J·kg}^{-1}\) (géostationnaire). L'énergie mécanique augmente : l'énergie cinétique diminue, mais l'énergie potentielle augmente deux fois plus (\(E_p=2E_m\) sur un cercle). Les deux poussées, dans le sens du mouvement, fournissent cette énergie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Diffusion d'une particule alpha par un noyau</h3>
  <div class="statement">Une particule alpha (masse \(m\), charge \(2e\)) arrive de très loin avec l'énergie cinétique \(E=5{,}0\ \text{MeV}\) vers un noyau d'or (charge \(79e\)) supposé fixe en \(O\). Sa trajectoire initiale est une droite qui passe à la distance \(b\) de \(O\) (paramètre d'impact). On donne \(e^2/(4\pi\varepsilon_0)=1{,}44\ \text{MeV·fm}\) et l'on pose \(K=\dfrac{2\times79\,e^2}{4\pi\varepsilon_0}\).</div>
  <div class="q"><strong>Q1.</strong> Justifier la conservation du moment cinétique et de l'énergie. Exprimer \(C\) en fonction de \(b\) et de la vitesse initiale \(v_\infty\).</div>
  <div class="q"><strong>Q2.</strong> Écrire l'énergie potentielle effective et montrer que le mouvement est toujours un état de diffusion.</div>
  <div class="q"><strong>Q3.</strong> Montrer que la distance minimale d'approche vérifie \(E\,r^2-K\,r-E\,b^2=0\), et la calculer pour \(b=0\), 20 fm et 50 fm.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Force électrique portée par la droite \(OM\) : centrale, de moment nul en \(O\) ; elle dérive de \(E_p=K/r\). Loin du noyau, le mouvement est rectiligne uniforme à \(v_\infty\), à la distance \(b\) de \(O\) : \(|C|=v_\infty b\) (bras de levier \(b\)).</p>
    <p><strong>Q2.</strong> \(E_{p,\text{eff}}=\dfrac{mC^2}{2r^2}+\dfrac Kr\), avec \(\dfrac{mC^2}2=\tfrac12mv_\infty^2\,b^2=E\,b^2\). Les deux termes sont positifs et décroissants : \(E_{p,\text{eff}}\) décroît de \(+\infty\) à 0. Comme \(E\gt0\), l'équation \(E_{p,\text{eff}}(r)=E\) a une seule solution : une seule borne, état de diffusion (cours, §5).</p>
    <p><strong>Q3.</strong> En \(r_{\min}\), \(\dot r=0\) : \(\dfrac{Eb^2}{r^2}+\dfrac Kr=E\), soit \(Er^2-Kr-Eb^2=0\), dont la racine positive est \(r_{\min}=\dfrac{K+\sqrt{K^2+4E^2b^2}}{2E}\). \(K=158\times1{,}44\approx228\ \text{MeV·fm}\). \(b=0\) : 46 fm ; \(b=20\ \text{fm}\) : 53 fm ; \(b=50\ \text{fm}\) : 78 fm. Plus le tir est décalé, plus la barrière centrifuge tient la particule loin du noyau.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Simuler une orbite et la confronter à la théorie</h3>
  <div class="statement">On reprend le programme du cours (§10) : fonction <span class="code-inline">F(Y, t)</span>, \(GM_T\), lancement orthoradial en \((r_0,0)\) avec \(r_0=1{,}0\times10^7\ \text{m}\) et la vitesse \(\alpha\,v_c\), \(v_c=\sqrt{GM_T/r_0}\). On prend \(\alpha=1{,}3\).</div>
  <div class="q"><strong>Q1.</strong> Montrer par l'énergie et la loi des aires que l'autre apside est à \(r_0\,\alpha^2/(2-\alpha^2)\), puis calculer l'apogée, le demi-grand axe et la période attendus.</div>
  <div class="q"><strong>Q2.</strong> Écrire les lignes qui calculent la trajectoire sur \(10^5\ \text{s}\), affichent l'apogée et mesurent la période comme la date du premier retour sur le demi-axe \(Ox\) positif.</div>
  <div class="q"><strong>Q3.</strong> Le programme affiche 54 516 km et 16,02 h. Conclure. Quels autres contrôles faire ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Aux deux apsides, la vitesse est orthoradiale : \(r_0\alpha v_c=r\,v\) et \(\tfrac12\alpha^2v_c^2-\dfrac{GM}{r_0}=\tfrac12v^2-\dfrac{GM}r\). Avec \(v_c^2=GM/r_0\) et \(v=r_0\alpha v_c/r\), en posant \(x=r_0/r\) : \(\alpha^2x^2-2x+(2-\alpha^2)=0\), de racines \(x=1\) (le point de départ) et \(x=(2-\alpha^2)/\alpha^2\). Donc \(r=r_0\alpha^2/(2-\alpha^2)\approx54\,516\ \text{km}\) ; \(a=r_0/(2-\alpha^2)\approx32\,258\ \text{km}\) ; \(T=2\pi\sqrt{a^3/(GM_T)}\approx16{,}0\ \text{h}\).</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock">alpha = 1.3
t = np.linspace(0, 1e5, 100001)
x, y, vx, vy = odeint(F, [r0, 0, 0, alpha * vc], t, rtol=1e-10, atol=1e-6).T
r = np.sqrt(x**2 + y**2)
print(round(r.max() / 1e3))                    <span class="cmt"># apogée (km)</span>
k = np.argmax((y[:-1] &lt; 0) &amp; (y[1:] &gt;= 0))     <span class="cmt"># premier retour sur Ox, x &gt; 0</span>
print(round(t[k] / 3600, 2))                   <span class="cmt"># période (h)</span></pre>
    <p><strong>Q3.</strong> Accord avec la théorie à la précision de l'affichage : la simulation confirme la troisième loi généralisée à l'ellipse, que le cours admet. Contrôles : constance de \(E_m\) et de \(C=xv_y-yv_x\) (comme dans le cours), résultat inchangé avec des tolérances plus serrées ou un pas d'affichage plus fin (la date de retour est connue à 1 s près).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ☆ ☆</span>
  <h3>Satellites de navigation : GPS et Galileo</h3>
  <div class="statement">Les satellites GPS font exactement deux tours pendant que la Terre fait un tour sur elle-même (jour sidéral 86 164 s). Les satellites Galileo sont à 23 222 km d'altitude. \(GM_T=3{,}986\times10^{14}\ \text{m}^3\text{·s}^{-2}\), \(R_T=6\,371\ \text{km}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'altitude et la vitesse des satellites GPS.</div>
  <div class="q"><strong>Q2.</strong> Calculer la période et la vitesse des satellites Galileo.</div>
  <div class="q"><strong>Q3.</strong> Pourquoi ces constellations utilisent-elles des orbites moyennes plutôt que basses ou géostationnaires ?</div>

  <div class="solution">
    <h4>Correction</h4>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>De l'orbite d'attente à l'orbite géostationnaire</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>champ central, lois de Kepler, énergie des orbites, satellites, simulation</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un satellite de télécommunications de masse \(m=3\,000\ \text{kg}\) est placé par un lanceur parti de Kourou (latitude 5,2° N) sur une orbite d'attente circulaire, dans le plan équatorial, à 250 km d'altitude. Il doit rejoindre l'orbite géostationnaire. On travaille dans le référentiel géocentrique, supposé galiléen ; seule la gravitation de la Terre agit, hors des poussées très brèves de son moteur. \(GM_T=3{,}986\times10^{14}\ \text{m}^3\text{·s}^{-2}\), \(R_T=6\,371\ \text{km}\), jour sidéral \(T_s=86\,164\ \text{s}\).
  </div>
  <p class="exo-part">Partie A — Orbite d'attente</p>
  <div class="q"><strong>A1.</strong> Montrer que le mouvement est plan et que, sur une orbite circulaire, il est uniforme.</div>
  <div class="q"><strong>A2.</strong> Calculer la vitesse \(v_1\) et la période \(T_1\) sur l'orbite d'attente.</div>
  <div class="q"><strong>A3.</strong> Quelle vitesse le lanceur gagne-t-il en partant vers l'est depuis Kourou ? Quelle fraction de \(v_1\) cela représente-t-il ?</div>
  <p class="exo-part">Partie B — Orbite de transfert</p>
  <div class="q"><strong>B1.</strong> Calculer le rayon \(r_2\) de l'orbite géostationnaire.</div>
  <div class="q"><strong>B2.</strong> Le transfert se fait sur une ellipse de périgée \(r_1\) et d'apogée \(r_2\). Donner son demi-grand axe ; calculer \(v_p\) et \(v_a\), puis les deux impulsions \(\Delta v_1\) et \(\Delta v_2\), et la durée du transfert.</div>
  <p class="exo-part">Partie C — Bilan d'énergie</p>
  <div class="q"><strong>C1.</strong> Calculer l'énergie mécanique du satellite sur les trois orbites, puis l'énergie que les deux poussées doivent lui fournir.</div>
  <div class="q"><strong>C2.</strong> Comparer l'énergie cinétique du satellite sur l'orbite d'attente et sur l'orbite finale. Commenter.</div>
  <p class="exo-part">Partie D — Vérification numérique</p>
  <div class="q"><strong>D1.</strong> On simule l'orbite de transfert avec le programme du cours (§10), à partir du périgée \((r_1,0)\) avec la vitesse orthoradiale \(v_p\). La simulation donne une distance maximale de 42 164 km, atteinte au bout de 5,266 h, avec une vitesse de \(1{,}602\ \text{km·s}^{-1}\). Confronter ces trois nombres aux résultats de la partie B. Quel contrôle supplémentaire ferait-on ?</div>
  <div class="q"><strong>D2.</strong> Si la seconde impulsion n'était pas donnée, que ferait le satellite ? Et si elle était donnée avec un retard d'une demi-heure, l'orbite finale serait-elle circulaire ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Le poids, dirigé vers le centre \(O\) de la Terre, est une force centrale : son moment en \(O\) est nul, \(\vec L_O\) est constant (théorème du moment cinétique), le mouvement est dans le plan perpendiculaire à \(\vec L_O\) passant par \(O\). Sur un cercle, \(r^2\dot\theta=C\) avec \(r\) constant impose \(\dot\theta\) constant : mouvement uniforme.</p>
    <p><strong>A2.</strong> \(r_1=6\,621\ \text{km}\) ; \(v_1=\sqrt{GM_T/r_1}\approx7{,}76\ \text{km·s}^{-1}\) ; \(T_1=2\pi r_1/v_1\approx89\ \text{min}\).</p>
    <p><strong>A3.</strong> Un point de Kourou décrit, dans le référentiel géocentrique, un cercle de rayon \(R_T\cos5{,}2^\circ\) en \(T_s\) : \(v\approx463\ \text{m·s}^{-1}\) vers l'est, 6 % de \(v_1\), gagnés « gratuitement » ; d'où les lancements vers l'est, depuis une base proche de l'équateur.</p>
    <p><strong>B1.</strong> Troisième loi : \(r_2=\left(GM_TT_s^2/(4\pi^2)\right)^{1/3}\approx42\,164\ \text{km}\).</p>
    <p><strong>B2.</strong> \(a=(r_1+r_2)/2\approx24\,393\ \text{km}\). Énergie : \(v^2=GM_T(2/r-1/a)\), d'où \(v_p\approx10{,}20\ \text{km·s}^{-1}\) au périgée ; loi des aires : \(v_a=v_pr_1/r_2\approx1{,}60\ \text{km·s}^{-1}\) à l'apogée. Vitesse géostationnaire : \(v_2=\sqrt{GM_T/r_2}\approx3{,}07\ \text{km·s}^{-1}\). Impulsions : \(\Delta v_1\approx2{,}44\ \text{km·s}^{-1}\), \(\Delta v_2\approx1{,}47\ \text{km·s}^{-1}\). Durée : \(\pi\sqrt{a^3/(GM_T)}\approx5{,}27\ \text{h}\).</p>
    <p><strong>C1.</strong> \(E_m=-GM_Tm/(2\times\text{demi-grand axe})\) : \(-9{,}03\times10^{10}\ \text{J}\) (attente), \(-2{,}45\times10^{10}\ \text{J}\) (transfert), \(-1{,}42\times10^{10}\ \text{J}\) (géostationnaire). Énergie à fournir : \(6{,}58\times10^{10}\ \text{J}\) au périgée, \(1{,}03\times10^{10}\ \text{J}\) à l'apogée, \(7{,}6\times10^{10}\ \text{J}\) au total.</p>
    <p><strong>C2.</strong> Sur un cercle, \(E_c=-E_m\) : \(9{,}0\times10^{10}\ \text{J}\) au départ, \(1{,}4\times10^{10}\ \text{J}\) à l'arrivée. Le satellite a reçu de l'énergie et va six fois moins vite en énergie cinétique (2,5 fois moins vite en vitesse) : toute l'énergie fournie, et plus, est passée en énergie potentielle.</p>
    <p><strong>D1.</strong> Distance maximale : \(r_2\), à moins d'un mètre près ; date : la demi-période \(\pi\sqrt{a^3/(GM_T)}=5{,}266\ \text{h}\) ; vitesse : \(v_a\). La simulation confirme à la fois la loi des aires, l'énergie \(-GM_Tm/(2a)\) et la troisième loi pour l'ellipse. Contrôle supplémentaire : constance de \(E_m\) et de \(C\) au cours du calcul, et insensibilité du résultat aux tolérances.</p>
    <p><strong>D2.</strong> Sans seconde impulsion, il resterait sur l'ellipse de transfert et repasserait au périgée 5,27 h plus tard (période 10,5 h). Avec une impulsion de même valeur donnée hors de l'apogée, la vitesse ne serait plus orthoradiale ni égale à \(\sqrt{GM_T/r}\) : l'orbite obtenue serait une ellipse, et le satellite ne resterait pas fixe dans le ciel. Les manœuvres se font à l'apogée, où la vitesse est orthoradiale.</p>
