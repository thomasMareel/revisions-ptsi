<div class="course-section">
  <div class="sec-num">§1 · PRINCIPE &amp; OBJECTIFS</div>
  <h2>Agir sur la peau, pas sur la masse</h2>
  <div class="notice"><strong>Hors programme en PTSI</strong> (pour aller plus loin) : les revêtements, dépôts et traitements mécaniques de surface ne figurent au programme de SI de 2021 dans aucune des deux années ; ce chapitre est de la culture technologique. Sont au programme, en 2ᵉ année : les traitements thermiques surfaciques des aciers (trempe superficielle, cémentation, nitruration : voir le chapitre Traitements thermiques) et, en physique-chimie, la protection contre la corrosion par revêtement ou par anode sacrificielle (chapitre Électrochimie).</div>
  <div class="intro">Un <strong>traitement de surface</strong> modifie les propriétés de la <strong>surface</strong> d'une pièce sans toucher au cœur, pour améliorer la résistance à la <strong>corrosion</strong>, à l'<strong>usure</strong>, à la <strong>fatigue</strong>, l'<strong>aspect</strong> ou l'adhérence. La masse, elle, garde les propriétés issues du matériau et des traitements thermiques.</div>
  <div class="notice">À distinguer des traitements thermiques : ceux-ci visent les propriétés <em>à cœur</em> (trempe, recuit) ou un durcissement par diffusion (cémentation) ; les traitements de surface <em>ajoutent</em> une couche ou modifient l'extrême surface.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · REVÊTEMENTS &amp; DÉPÔTS</div>
  <h2>Ajouter une couche protectrice</h2>
  <div class="prop-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Dépôts électrolytiques</strong> (galvanoplastie) : chromage (dur ou décoratif), nickelage, zingage électrolytique — dépôt d'un métal par électrolyse.</li>
      <li><strong>Galvanisation à chaud</strong> : immersion de l'acier dans un bain de <strong>zinc</strong> fondu → couche protectrice (très courante en construction).</li>
      <li><strong>Anodisation</strong> (aluminium) : croissance par voie électrolytique d'une couche d'<strong>oxyde</strong> (alumine) dure et protectrice, éventuellement colorée.</li>
      <li><strong>Dépôts sous vide PVD / CVD</strong> : couches minces très dures (ex. nitrure de titane TiN doré sur outils coupants).</li>
      <li><strong>Peinture / poudre / vernis</strong> : protection barrière + aspect.</li>
    </ul>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PROTECTION CONTRE LA CORROSION</div>
  <h2>Barrière ou protection sacrificielle</h2>

  <figure class="schema" style="max-width:330px">
  <svg viewBox="0 0 330 150" role="img" aria-label="Protection sacrificielle : revêtement de zinc sur acier ; même rayé, le zinc se corrode à la place de l'acier">
    <!-- acier -->
    <rect x="50" y="74" width="230" height="48" class="fl-soft sk-ink"/>
    <text x="165" y="102" class="lab-muted" text-anchor="middle" style="font-size:9px">acier</text>
    <!-- couche de zinc -->
    <rect x="50" y="60" width="230" height="14" class="fl-accent2-soft sk-accent2"/>
    <text x="60" y="52" class="lab-accent2" style="font-size:8.5px">zinc (anode sacrificielle)</text>
    <!-- rayure exposant l'acier -->
    <path d="M160,60 l8,14 l8,-14" class="fl-paper sk-ink"/>
    <line x1="200" y1="40" x2="170" y2="62" class="sk-axis"/>
    <text x="202" y="38" class="lab-muted" style="font-size:8px">rayure</text>
  </svg>
  <figcaption>Protection <strong>sacrificielle</strong> : le zinc, moins noble que l'acier, se corrode <strong>à sa place</strong> (protection cathodique) — la protection subsiste même si le revêtement est rayé.</figcaption>
  </figure>

  <div class="def-box">
    <strong>Protection barrière</strong> : la couche isole le métal de l'environnement (peinture, chromage…). <em>Faiblesse</em> : si elle est rayée, la corrosion peut démarrer au défaut.<br>
    <strong>Protection sacrificielle (cathodique)</strong> : on revêt d'un métal <strong>moins noble</strong> (zinc sur acier). Ce métal se corrode <strong>en premier</strong>, protégeant le substrat <strong>même en cas de rayure</strong>.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · TRAITEMENTS MÉCANIQUES DE SURFACE</div>
  <h2>Le grenaillage de précontrainte</h2>

  <figure class="schema" style="max-width:330px">
  <svg viewBox="0 0 330 160" role="img" aria-label="Grenaillage : des billes bombardent la surface et y créent une couche en compression qui améliore la tenue en fatigue">
    <!-- billes incidentes -->
    <circle cx="90" cy="34" r="6" class="fl-accent2"/><circle cx="150" cy="24" r="6" class="fl-accent2"/><circle cx="210" cy="38" r="6" class="fl-accent2"/>
    <line x1="93" y1="40" x2="110" y2="70" class="sk-accent2"/>
    <line x1="152" y1="30" x2="160" y2="70" class="sk-accent2"/>
    <line x1="210" y1="44" x2="200" y2="70" class="sk-accent2"/>
    <text x="250" y="30" class="lab-accent2" style="font-size:8.5px">billes (grenaille)</text>
    <!-- pièce -->
    <rect x="50" y="74" width="240" height="64" class="fl-soft sk-ink"/>
    <!-- couche en compression -->
    <rect x="50" y="74" width="240" height="16" class="fl-accent-soft sk-accent"/>
    <line x1="120" y1="82" x2="150" y2="82" class="sk-accent" marker-end="url(#sk-arrow-accent)"/>
    <line x1="220" y1="82" x2="190" y2="82" class="sk-accent" marker-end="url(#sk-arrow-accent)"/>
    <text x="170" y="110" class="lab-muted" text-anchor="middle" style="font-size:8.5px">couche en compression</text>
  </svg>
  <figcaption>Grenaillage de précontrainte : les billes mettent la couche superficielle en <strong>compression</strong> ; ces contraintes résiduelles freinent l'amorçage des fissures → <strong>meilleure tenue en fatigue</strong>.</figcaption>
  </figure>

  <div class="prop-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Grenaillage de précontrainte</strong> (shot peening) : bombardement de billes → couche superficielle en <strong>compression</strong> → la tenue en <strong>fatigue</strong> est fortement améliorée (les fissures s'amorcent mal en compression). Utilisé sur ressorts, arbres, dentures.</li>
      <li><strong>Polissage, rodage, galetage</strong> : amélioration de l'état de surface (et léger écrouissage superficiel).</li>
    </ul>
  </div>
  <div class="notice">Le grenaillage agit par les <strong>contraintes résiduelles de compression</strong> : une fissure de fatigue s'amorce et se propage sous contrainte de <em>traction</em> ; précontraindre la surface en compression retarde donc l'amorçage.</div>
</div>

<template class="pan-tpl" data-panneau="tsu-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · TRAITEMENTS DE SURFACE</div>

  <div class="method-box">
    <strong>Méthode 1 — Choisir selon l'objectif</strong>
    <ol style="margin-top:.4rem">
      <li><strong>Corrosion</strong> → galvanisation (zinc), peinture, anodisation (alu).</li>
      <li><strong>Usure</strong> → chromage dur, dépôts PVD/CVD (TiN), (ou nitruration côté thermochimique).</li>
      <li><strong>Fatigue</strong> → grenaillage de précontrainte.</li>
      <li><strong>Aspect / décoration</strong> → chromage décoratif, anodisation colorée, peinture.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Barrière ou sacrificiel ?</strong>
    <ol style="margin-top:.4rem">
      <li>Revêtement <strong>plus noble</strong> ou isolant (peinture, chrome) → protection <strong>barrière</strong> (vulnérable aux rayures).</li>
      <li>Revêtement <strong>moins noble</strong> que le substrat (zinc sur acier) → protection <strong>sacrificielle</strong> (efficace même rayé).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Confondre traitement de <strong>surface</strong> (la peau) et traitement <strong>thermique</strong> (la masse / la diffusion).</li>
      <li>Croire qu'une peinture rayée protège encore (barrière ≠ sacrificiel).</li>
      <li>Oublier que le grenaillage agit par <strong>compression</strong> (anti-fatigue), pas par ajout de matière.</li>
    </ul>
  </div>
</div>
</template>

  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Barrière vs sacrificiel</h3>
  <div class="statement">Deux pièces en acier : l'une peinte, l'autre galvanisée (zinc). Toutes deux subissent une rayure profonde.</div>
  <div class="q"><strong>Q1.</strong> Laquelle reste protégée au niveau de la rayure ? Pourquoi ?</div>
  <div class="q"><strong>Q2.</strong> Comment qualifie-t-on chacune des deux protections ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La pièce <strong>galvanisée</strong> : le zinc, moins noble que l'acier, se corrode à sa place (protection cathodique) même au fond de la rayure. La peinture, elle, ne protège plus là où elle est entamée.</p>
    <p><strong>Q2.</strong> Peinture → protection <strong>barrière</strong> ; zinc → protection <strong>sacrificielle (cathodique)</strong>.</p>
  </div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Protection &amp; tenue d'un essieu</h3>
  <div class="exo-source">
    Exercice <strong>original</strong>, calibré sur le format des épreuves PT (matériaux / traitements de surface). Pour t'entraîner sur les sujets réels :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un <strong>essieu</strong> en acier, exposé aux intempéries et soumis à des efforts alternés (fatigue), doit être protégé de la corrosion <strong>et</strong> voir sa durée de vie en fatigue améliorée. On envisage deux traitements de surface complémentaires.
  </div>

  <p class="exo-part">Partie A — Corrosion</p>
  <div class="q"><strong>A1.</strong> Proposer un traitement anticorrosion adapté et préciser s'il est barrière ou sacrificiel.</div>
  <div class="q"><strong>A2.</strong> Pourquoi cette protection résiste-t-elle mieux qu'une simple peinture en cas de choc/rayure ?</div>

  <p class="exo-part">Partie B — Fatigue</p>
  <div class="q"><strong>B1.</strong> Proposer un traitement améliorant la tenue en fatigue et expliquer son principe.</div>
  <div class="q"><strong>B2.</strong> Sur quelles zones de l'essieu l'appliquer en priorité ?</div>

  <p class="exo-part">Partie C — Cohérence avec la fabrication</p>
  <div class="q"><strong>C1.</strong> Ces traitements de surface modifient-ils les propriétés à cœur de l'essieu ? Les situer par rapport à un éventuel traitement thermique d'amélioration.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Une <strong>galvanisation</strong> (revêtement de zinc) : protection <strong>sacrificielle (cathodique)</strong>, le zinc étant moins noble que l'acier.</p>
    <p><strong>A2.</strong> Parce que le zinc protège <strong>même rayé</strong> : il se corrode à la place de l'acier mis à nu (protection cathodique), alors qu'une peinture (barrière) laisse la corrosion démarrer au défaut.</p>
    <p><strong>B1.</strong> Le <strong>grenaillage de précontrainte</strong> : il met la couche superficielle en compression ; comme les fissures de fatigue s'amorcent sous traction, cette précontrainte de compression retarde l'amorçage → durée de vie accrue.</p>
    <p><strong>B2.</strong> Sur les zones les plus sollicitées en fatigue : <strong>congés</strong>, changements de section, portées — là où se concentrent les contraintes et où les fissures s'amorcent.</p>
    <p><strong>C1.</strong> Non : ce sont des traitements de <strong>surface</strong> (la peau). Les propriétés à cœur (résistance, ténacité) viennent du matériau et d'un éventuel <strong>traitement thermique d'amélioration</strong> (trempe + revenu) réalisé <em>avant</em> ; les traitements de surface viennent ensuite parfaire corrosion et fatigue.</p>
  </div>
</div>
