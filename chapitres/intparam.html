<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie e) de la section « Intégration sur un intervalle quelconque » du programme de PT : régularité d'une fonction définie par une intégrale dépendant d'un paramètre. Il s'appuie sur le chapitre Intégrales généralisées (intégrabilité, comparaison, fonctions de référence) et sur le chapitre Intégration sur un segment (intégrale fonction de sa borne). Le programme précise que, dans les applications, on vérifie les hypothèses de régularité par rapport au paramètre \(x\) et l'hypothèse de domination, sans insister sur la continuité par rapport à la variable d'intégration \(t\).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Fonction définie par une intégrale à paramètre</strong>, ensemble de définition (§1).</li>
        <li><strong>Théorème de continuité</strong> : continuité en \(x\), continuité en \(t\), domination par une fonction intégrable indépendante de \(x\) ; démonstration hors programme (§2).</li>
        <li><strong>Domination locale</strong> : le passage éventuel par une domination sur des sous-intervalles doit faire l'objet d'une question intermédiaire (§3).</li>
        <li><strong>Théorème de dérivation</strong> : fonction de classe \(\mathcal{C}^1\) et formule \(g'(x) = \int_I \frac{\partial f}{\partial x}(x, t)\,\mathrm{d}t\) ; démonstration hors programme ; extension à la classe \(\mathcal{C}^k\), en remarque (le programme ne l'énonce pas ; elle sert pour Γ) (§4).</li>
        <li><strong>Méthode</strong> : rédiger une étude, obtenir limites et équivalents, calculer une intégrale en dérivant par rapport à un paramètre (§5).</li>
        <li>Exemples incontournables : <strong>fonction Γ</strong> (§6), <strong>intégrale de Gauss</strong> et \(\int_0^{+\infty} \mathrm{e}^{-t^2}\cos(xt)\,\mathrm{d}t\) (§7), <strong>transformée de Laplace</strong>, en lien avec les sciences industrielles (§8).</li>
      </ul>
      <p>Hors programme : le théorème de convergence dominée, le théorème de Fubini, la dérivation d'une intégrale dont les bornes et l'intégrande dépendent tous deux du paramètre (en fin de chapitre).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · FONCTIONS DÉFINIES PAR UNE INTÉGRALE</div>
  <h2>Quand le paramètre est dans l'intégrande</h2>
  <div class="intro">Beaucoup de fonctions importantes n'ont pas d'expression avec les fonctions usuelles, mais s'écrivent comme une intégrale dont l'intégrande dépend d'une variable \(x\) : la fonction Γ, les transformées de Laplace et de Fourier, les intégrales elliptiques… On veut étudier ces fonctions (continuité, dérivée, limites) sans pouvoir calculer l'intégrale.</div>

  <div class="def-box">
    Soit \(A\) et \(I\) deux intervalles de \(\mathbb{R}\) et \(f : A \times I \to \mathbb{K}\). Pour tout \(x \in A\) tel que \(t \mapsto f(x, t)\) est intégrable sur \(I\), on pose
    <div class="formula" data-nom="Intégrale à paramètre">$$g(x) = \int_I f(x, t)\,\mathrm{d}t.$$</div>
    \(x\) est le <strong>paramètre</strong> ; \(t\), la variable d'intégration, est <strong>muette</strong> : \(g\) ne dépend que de \(x\). L'<strong>ensemble de définition</strong> de \(g\) est l'ensemble des \(x\) pour lesquels l'intégrale converge.
  </div>
  <p>Ne pas confondre avec une intégrale dont la <strong>borne</strong> dépend de \(x\), comme \(\int_a^x f(t)\,\mathrm{d}t\), que l'on dérive par le théorème fondamental (chapitre Intégration sur un segment). Ici, \(x\) figure dans l'intégrande et les bornes sont fixes.</p>

  <div class="method-box">
    <strong>Exemple — deux ensembles de définition</strong>
    <ol>
      <li>\(F(x) = \displaystyle\int_0^{+\infty} \frac{\mathrm{e}^{-xt}}{1 + t^2}\,\mathrm{d}t\). Pour \(x \ge 0\), \(0 \le \frac{\mathrm{e}^{-xt}}{1+t^2} \le \frac{1}{1+t^2}\), intégrable sur \([0, +\infty[\) : \(F(x)\) existe. Pour \(x \lt 0\), l'intégrande tend vers \(+\infty\) quand \(t \to +\infty\) (l'exponentielle l'emporte) : l'intégrale diverge. \(F\) est définie sur \([0, +\infty[\), et \(F(0) = \frac{\pi}{2}\). Cette fonction sert de fil rouge aux §2 à §5.</li>
      <li>\(G(x) = \displaystyle\int_0^{+\infty} \frac{\mathrm{d}t}{(1+t^2)^x}\). L'intégrande est continu et positif ; en \(+\infty\), il est équivalent à \(\frac{1}{t^{2x}}\), intégrable si et seulement si \(2x \gt 1\). \(G\) est définie sur \(\left]\frac12, +\infty\right[\) ; par exemple \(G(1) = \frac{\pi}{2}\) et \(G(2) = \frac{\pi}{4}\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · THÉORÈME DE CONTINUITÉ</div>
  <h2>Passer à la limite sous le signe intégrale</h2>
  <div class="intro">Si \(x \mapsto f(x, t)\) est continue pour chaque \(t\), on voudrait que \(g\) le soit aussi, c'est-à-dire pouvoir échanger la limite en \(x\) et l'intégrale en \(t\). C'est faux en général ; il faut empêcher l'aire de « s'échapper », grâce à une <strong>domination</strong>.</div>

  <div class="prop-box">
    <strong>Théorème de continuité.</strong> Soit \(A\) et \(I\) deux intervalles et \(f : A \times I \to \mathbb{K}\) telle que :
    <ul>
      <li>pour tout \(t \in I\), \(x \mapsto f(x, t)\) est <strong>continue</strong> sur \(A\) ;</li>
      <li>pour tout \(x \in A\), \(t \mapsto f(x, t)\) est continue sur \(I\) ;</li>
      <li>(<strong>hypothèse de domination</strong>) il existe \(\varphi\) <strong>intégrable sur \(I\)</strong> telle que, pour tout \((x, t) \in A \times I\), \(|f(x, t)| \le \varphi(t)\).</li>
    </ul>
    Alors \(g : x \mapsto \int_I f(x, t)\,\mathrm{d}t\) est définie et continue sur \(A\). La démonstration est hors programme.
  </div>
  <p>La fonction \(\varphi\) ne dépend <strong>pas</strong> de \(x\) : c'est tout l'enjeu. La domination entraîne au passage que chaque \(t \mapsto f(x, t)\) est intégrable, donc que \(g\) est définie sur \(A\). Dans une copie, on vérifie la continuité en \(x\) et la domination ; la continuité en \(t\) peut être simplement mentionnée.</p>

    <span class="label">Contre-exemple</span>
    <span class="prompt">Sans domination, une limite d'intégrales n'est pas l'intégrale de la limite.</span>
    <div class="content"><p>Sur \(A = [0, +\infty[\) et \(I = [0, +\infty[\), soit \(f(x, t) = x\,\mathrm{e}^{-xt}\). Pour chaque \(t\), \(x \mapsto f(x, t)\) est continue. Pour \(x \gt 0\), \(g(x) = \int_0^{+\infty} x\,\mathrm{e}^{-xt}\,\mathrm{d}t = 1\), alors que \(g(0) = 0\) : \(g\) n'est pas continue en 0. La domination échoue : à \(t \gt 0\) fixé, \(\sup_{x \gt 0} x\,\mathrm{e}^{-xt} = \frac{1}{\mathrm{e}\,t}\) (atteint en \(x = 1/t\)), qui n'est pas intégrable en \(+\infty\). Sur la figure, l'aire unité s'étale de plus en plus loin quand \(x \to 0^+\).</p>
    <p>Idée de la preuve du théorème (hors programme) : \(|g(x) - g(x_0)| \le \int_I |f(x, t) - f(x_0, t)|\,\mathrm{d}t\). Sur un segment de \(I\), l'intégrande est petit par continuité ; hors de ce segment, il est majoré par \(2\varphi\), dont l'intégrale sur les « queues » de \(I\) est aussi petite qu'on veut puisque \(\varphi\) est intégrable. Le cadre général est le théorème de convergence dominée.</p></div>
  </div>
  <div class="prop-box">
    <strong>Cas d'un segment.</strong> Si \(I = [a, b]\) est un segment et si \(f\) est continue sur \(A \times [a, b]\) (comme fonction de deux variables), alors \(g\) est continue sur \(A\). En effet, sur \([\alpha, \beta] \times [a, b]\) avec \([\alpha, \beta] \subset A\), \(|f|\) est bornée par une constante \(M\) (fonction continue sur un fermé borné), et une constante est intégrable sur un segment : c'est une domination locale (§3).
  </div>
  <div class="method-box">
    <strong>Exemple — continuité de \(F\) sur \([0, +\infty[\)</strong>
    <ol>
      <li>Régularité en \(x\) : pour tout \(t \ge 0\), \(x \mapsto \frac{\mathrm{e}^{-xt}}{1+t^2}\) est continue sur \([0, +\infty[\) (et l'intégrande est continu en \(t\)).</li>
      <li>Domination : pour tous \(x \ge 0\) et \(t \ge 0\), \(\left|\frac{\mathrm{e}^{-xt}}{1+t^2}\right| \le \frac{1}{1+t^2} = \varphi(t)\), intégrable sur \([0, +\infty[\) et indépendante de \(x\).</li>
      <li>Conclusion : \(F\) est continue sur \([0, +\infty[\) ; en particulier \(F(x) \to F(0) = \frac{\pi}{2}\) quand \(x \to 0^+\).</li>
      <li>Limite en \(+\infty\), sans théorème : \(0 \le F(x) \le \int_0^{+\infty} \mathrm{e}^{-xt}\,\mathrm{d}t = \frac1x\) pour \(x \gt 0\), donc \(F(x) \to 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : une « domination » qui dépend de \(x\). Écrire \(\left|\frac{\mathrm{e}^{-xt}}{1+t^2}\right| \le \mathrm{e}^{-xt}\) ne domine rien : le majorant doit être une fonction de \(t\) seul. Autre piège : majorer par une fonction non intégrable sur \(I\), par exemple par la constante 1 sur \([0, +\infty[\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · DOMINATION LOCALE</div>
  <h2>Quand aucune domination globale n'existe</h2>
  <div class="intro">La continuité et la dérivabilité sont des propriétés <strong>locales</strong> : pour les établir sur \(A\), il suffit de les établir sur chaque segment \([a, b]\) inclus dans \(A\) (ou sur chaque intervalle \([a, +\infty[\) inclus dans \(A\)). On cherche donc une domination valable seulement pour \(x\) dans ces sous-intervalles ; le programme demande que ce passage fasse l'objet d'une question intermédiaire.</div>

  <div class="prop-box">
    <strong>Principe de la domination locale.</strong> Si, pour tout segment \([a, b] \subset A\), il existe \(\varphi_{a,b}\) intégrable sur \(I\) telle que \(|f(x, t)| \le \varphi_{a,b}(t)\) pour tous \(x \in [a, b]\) et \(t \in I\) (les autres hypothèses étant inchangées), alors \(g\) est continue sur \(A\). En effet, le théorème appliqué sur \([a, b]\) donne la continuité sur \([a, b]\), et tout point de \(A\) est dans un tel segment, avec un voisinage dans \(A\).
  </div>

  <div class="method-box">
    <strong>Exemple — \(\Phi(x) = \int_0^{+\infty} \mathrm{e}^{-xt^2}\,\mathrm{d}t\) sur \(]0, +\infty[\)</strong>
    <ol>
      <li>Pas de domination globale : \(\sup_{x \gt 0} \mathrm{e}^{-xt^2} = 1\), qui n'est pas intégrable sur \([0, +\infty[\). Une domination globale est d'ailleurs impossible : elle donnerait \(\Phi(x) \le \int \varphi\) pour tout \(x\), alors que \(\Phi(x) \to +\infty\) quand \(x \to 0^+\) (voir le point 4).</li>
      <li>Domination sur \([a, +\infty[\), avec \(a \gt 0\) fixé : pour \(x \ge a\) et \(t \ge 0\), \(0 \lt \mathrm{e}^{-xt^2} \le \mathrm{e}^{-at^2} = \varphi_a(t)\), intégrable (\(t^2\varphi_a(t) \to 0\) en \(+\infty\)).</li>
      <li>Le théorème de continuité donne \(\Phi\) continue sur \([a, +\infty[\), pour tout \(a \gt 0\) : \(\Phi\) est continue sur \(]0, +\infty[\).</li>
      <li>Contrôle : le changement de variable \(u = \sqrt{x}\,t\) et l'intégrale de Gauss (§7) donnent \(\Phi(x) = \frac{1}{2}\sqrt{\frac{\pi}{x}}\), bien continue sur \(]0, +\infty[\) et de limite \(+\infty\) en \(0^+\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode — rédiger une domination locale</strong>
    <ol>
      <li>« Soit \([a, b] \subset A\) (ou \(a \gt 0\)). Pour tout \(x \in [a, b]\) et tout \(t \in I\), \(|f(x, t)| \le \varphi(t)\) », où \(\varphi\) dépend de \(a\) et \(b\) mais <strong>pas</strong> de \(x\).</li>
      <li>Pour trouver \(\varphi\) : remplacer \(x\) par la borne du segment qui rend \(|f(x, t)|\) le plus grand ; si cela dépend de \(t\) (comme pour \(t^{x-1}\), plus grand pour \(x = a\) si \(t \lt 1\), pour \(x = b\) si \(t \gt 1\)), sommer les deux majorants.</li>
      <li>Justifier l'intégrabilité de \(\varphi\) sur \(I\) (fonctions de référence, comparaison).</li>
      <li>Conclure sur \([a, b]\), puis sur \(A\) « car \([a, b]\) est quelconque ».</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · THÉORÈME DE DÉRIVATION</div>
  <h2>Dériver sous le signe intégrale</h2>
  <div class="intro">Si l'on peut dériver l'intégrande par rapport au paramètre, on aimerait dériver \(g\) en dérivant « sous l'intégrale », la variable \(t\) restant fixée. C'est la formule de Leibniz ; elle est vraie sous une hypothèse de domination portant cette fois sur la <strong>dérivée partielle</strong>.</div>

  <div class="prop-box">
    <strong>Théorème de dérivation.</strong> Soit \(A\) et \(I\) deux intervalles et \(f : A \times I \to \mathbb{K}\) telle que :
    <ul>
      <li>pour tout \(t \in I\), \(x \mapsto f(x, t)\) est de <strong>classe \(\mathcal{C}^1\)</strong> sur \(A\) ;</li>
      <li>pour tout \(x \in A\), \(t \mapsto f(x, t)\) est <strong>intégrable</strong> sur \(I\) ;</li>
      <li>pour tout \(x \in A\), \(t \mapsto \frac{\partial f}{\partial x}(x, t)\) est continue sur \(I\) ;</li>
      <li>(<strong>domination</strong>) il existe \(\varphi\) intégrable sur \(I\) telle que \(\left|\frac{\partial f}{\partial x}(x, t)\right| \le \varphi(t)\) pour tout \((x, t) \in A \times I\).</li>
    </ul>
    Alors \(g : x \mapsto \int_I f(x, t)\,\mathrm{d}t\) est de classe \(\mathcal{C}^1\) sur \(A\) et
    <div class="formula" data-nom="Dérivation sous le signe intégrale">$$\forall x \in A, \quad g'(x) = \int_I \frac{\partial f}{\partial x}(x, t)\,\mathrm{d}t.$$</div>
    La démonstration est hors programme. Comme pour la continuité, une domination sur chaque segment \([a, b] \subset A\) suffit.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de la démonstration</span>
    <span class="prompt">Pourquoi c'est la dérivée partielle qu'on domine (hors programme).</span>
    <div class="content"><p>Le taux d'accroissement de \(g\) est l'intégrale des taux d'accroissement de l'intégrande :</p>
    <div class="formula">$$\begin{aligned} &\frac{g(x+h) - g(x)}{h} \\ &\qquad = \int_I \frac{f(x+h, t) - f(x, t)}{h}\,\mathrm{d}t. \end{aligned}$$</div>
    <p>À \(t\) fixé, ce quotient tend vers \(\frac{\partial f}{\partial x}(x, t)\), et l'inégalité des accroissements finis le majore par \(\sup |\partial f/\partial x| \le \varphi(t)\), indépendamment de \(h\). La domination de la dérivée partielle est donc exactement une domination des taux d'accroissement, qui permet de passer à la limite \(h \to 0\) sous l'intégrale (convergence dominée). La continuité de \(g'\) découle ensuite du théorème de continuité appliqué à \(\frac{\partial f}{\partial x}\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Extension à la classe \(\mathcal{C}^k\).</strong> Si, pour tout \(t\), \(x \mapsto f(x, t)\) est de classe \(\mathcal{C}^k\) et si, pour tout \(j \in \{0, \ldots, k\}\), \(\frac{\partial^j f}{\partial x^j}\) est (localement) dominée par une fonction intégrable, alors \(g\) est de classe \(\mathcal{C}^k\) et \(g^{(j)}(x) = \int_I \frac{\partial^j f}{\partial x^j}(x, t)\,\mathrm{d}t\) pour \(j \le k\). On l'obtient en appliquant \(k\) fois le théorème. Si c'est vrai pour tout \(k\), \(g\) est de classe \(\mathcal{C}^\infty\).
  </div>
  <div class="method-box">
    <strong>Exemple — \(F\) est de classe \(\mathcal{C}^2\) sur \(]0, +\infty[\) et \(F'' + F = \frac{1}{x}\)</strong>
    <ol>
      <li>Pour \(f(x, t) = \frac{\mathrm{e}^{-xt}}{1+t^2}\), \(x \mapsto f(x, t)\) est de classe \(\mathcal{C}^\infty\), avec \(\frac{\partial f}{\partial x} = -\frac{t\,\mathrm{e}^{-xt}}{1+t^2}\) et \(\frac{\partial^2 f}{\partial x^2} = \frac{t^2\,\mathrm{e}^{-xt}}{1+t^2}\).</li>
      <li>Domination locale : soit \(a \gt 0\). Pour \(x \ge a\) et \(t \ge 0\),
      <div class="formula">$$\begin{aligned} |f(x, t)| &\le \frac{1}{1+t^2}, \\ \left|\frac{\partial f}{\partial x}(x, t)\right| &\le t\,\mathrm{e}^{-at}, \\ \left|\frac{\partial^2 f}{\partial x^2}(x, t)\right| &\le \mathrm{e}^{-at}, \end{aligned}$$</div>
      trois fonctions intégrables sur \([0, +\infty[\), indépendantes de \(x\) (on a utilisé \(\frac{t^2}{1+t^2} \le 1\) et \(\frac{t}{1+t^2} \le t\)).</li>
      <li>\(F\) est donc de classe \(\mathcal{C}^2\) sur \([a, +\infty[\) pour tout \(a \gt 0\), donc sur \(]0, +\infty[\), et
      <div class="formula">$$F''(x) = \int_0^{+\infty} \frac{t^2\,\mathrm{e}^{-xt}}{1+t^2}\,\mathrm{d}t.$$</div></li>
      <li>En additionnant, le dénominateur se simplifie :
      <div class="formula">$$\begin{aligned} F''(x) + F(x) &= \int_0^{+\infty} \frac{(t^2 + 1)\,\mathrm{e}^{-xt}}{1+t^2}\,\mathrm{d}t \\ &= \int_0^{+\infty} \mathrm{e}^{-xt}\,\mathrm{d}t = \frac{1}{x}. \end{aligned}$$</div>
      Contrôle numérique en \(x = 1\) : \(F(1) \approx 0{,}6214\) et \(F''(1) \approx 0{,}3786\), de somme 1.</li>
      <li>En \(x = 0\), la domination de \(\frac{\partial f}{\partial x}\) échoue (\(\frac{t}{1+t^2}\) n'est pas intégrable) : de fait, \(F'(x) \to -\infty\) quand \(x \to 0^+\), et \(F\) n'est pas dérivable en 0.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : dominer \(f\) au lieu de \(\frac{\partial f}{\partial x}\) (pour la dérivation, c'est la dérivée partielle qu'il faut dominer, et l'intégrabilité de \(t \mapsto f(x, t)\) qu'il faut vérifier) ; dériver par rapport à \(t\) au lieu de \(x\) ; dominer par \(t\,\mathrm{e}^{-xt}\), qui dépend encore de \(x\) : il faut d'abord fixer \(x \ge a\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MÉTHODE ET COMPORTEMENT AUX BORNES</div>
  <h2>Rédiger une étude complète, calculer en dérivant</h2>
  <div class="intro">Les deux théorèmes donnent la régularité ; il reste souvent à obtenir des limites, des équivalents, ou la valeur exacte de l'intégrale. Pour les limites, une majoration directe suffit souvent ; pour la valeur, on dérive par rapport au paramètre, on calcule \(g'\), puis on remonte à \(g\).</div>

  <div class="method-box">
    <strong>Méthode — étudier \(g(x) = \int_I f(x, t)\,\mathrm{d}t\)</strong>
    <ol>
      <li><strong>Définition</strong> : pour quels \(x\) la fonction \(t \mapsto f(x, t)\) est-elle intégrable sur \(I\) ? (bornes problématiques, équivalents, fonctions de référence).</li>
      <li><strong>Continuité</strong> : continuité de \(x \mapsto f(x, t)\) et domination, globale si possible, sinon sur les segments de \(A\) (question intermédiaire).</li>
      <li><strong>Dérivabilité</strong> : \(x \mapsto f(x, t)\) de classe \(\mathcal{C}^1\), intégrabilité de \(t \mapsto f(x, t)\), domination de \(\frac{\partial f}{\partial x}\) ; écrire \(g'(x)\). Le signe de \(\frac{\partial f}{\partial x}\) donne souvent la monotonie de \(g\).</li>
      <li><strong>Limites et équivalents</strong> aux bornes de l'ensemble de définition : majoration directe, changement de variable \(u = xt\), intégration par parties, ou continuité sur un intervalle plus grand.</li>
      <li><strong>Exploitation</strong> : équation différentielle vérifiée par \(g\), ou calcul de \(g'\) puis intégration en \(x\), la constante étant fixée par une valeur connue ou une limite.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — équivalent de \(F\) en \(+\infty\)</strong>
    <ol>
      <li>On compare \(F(x)\) à \(\int_0^{+\infty} \mathrm{e}^{-xt}\,\mathrm{d}t = \frac1x\) :
      <div class="formula">$$\begin{aligned} 0 \le \frac1x - F(x) &= \int_0^{+\infty} \mathrm{e}^{-xt}\,\frac{t^2}{1+t^2}\,\mathrm{d}t \\ &\le \int_0^{+\infty} t^2\,\mathrm{e}^{-xt}\,\mathrm{d}t = \frac{2}{x^3}. \end{aligned}$$</div></li>
      <li>La dernière intégrale vaut \(\frac{\Gamma(3)}{x^3}\) (changement de variable \(u = xt\)). Donc \(F(x) = \frac{1}{x} + O\left(\frac{1}{x^3}\right)\), et \(F(x) \sim \frac1x\) en \(+\infty\).</li>
      <li>Contrôle : pour \(x = 10\), \(F(10) \approx 0{,}098\,19\), et \(\frac1x - F(x) \approx 0{,}0018 \le 0{,}002\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — calculer une intégrale en dérivant par rapport au paramètre</strong>
    <p>Pour \(x \gt 0\), on pose \(h(x) = \displaystyle\int_0^{+\infty} \frac{\mathrm{e}^{-t} - \mathrm{e}^{-xt}}{t}\,\mathrm{d}t\). Aucune primitive explicite de l'intégrande n'est connue.</p>
    <ol>
      <li>Définition : l'intégrande est continu sur \(]0, +\infty[\), tend vers \(x - 1\) en \(0^+\) (développement limité de l'exponentielle) et, pour \(t \ge 1\), est majoré en valeur absolue par \(\mathrm{e}^{-t} + \mathrm{e}^{-xt}\), intégrable. \(h\) est définie sur \(]0, +\infty[\).</li>
      <li>Dérivée partielle : \(\frac{\partial}{\partial x}\left(\frac{\mathrm{e}^{-t} - \mathrm{e}^{-xt}}{t}\right) = \mathrm{e}^{-xt}\) — le \(t\) du dénominateur disparaît, c'est l'intérêt du procédé.</li>
      <li>Domination locale : pour \(x \ge a \gt 0\), \(0 \lt \mathrm{e}^{-xt} \le \mathrm{e}^{-at}\), intégrable. Donc \(h\) est de classe \(\mathcal{C}^1\) sur \(]0, +\infty[\) et \(h'(x) = \int_0^{+\infty} \mathrm{e}^{-xt}\,\mathrm{d}t = \frac1x\).</li>
      <li>Constante : \(h(1) = 0\). Donc \(h(x) = \ln x\) pour tout \(x \gt 0\) ; par exemple \(\int_0^{+\infty} \frac{\mathrm{e}^{-t} - \mathrm{e}^{-2t}}{t}\,\mathrm{d}t = \ln 2\) (confirmé numériquement).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LA FONCTION Γ</div>
  <h2>Continuité, classe \(\mathcal{C}^\infty\), convexité</h2>
  <div class="intro">Le chapitre Intégrales généralisées a établi que \(\Gamma(x) = \int_0^{+\infty} t^{x-1}\mathrm{e}^{-t}\,\mathrm{d}t\) est définie sur \(]0, +\infty[\), que \(\Gamma(x+1) = x\,\Gamma(x)\) et que \(\Gamma(n+1) = n!\). Les théorèmes de ce chapitre donnent sa régularité, avec une domination locale typique.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> \(\Gamma\) est de classe \(\mathcal{C}^\infty\) sur \(]0, +\infty[\) et, pour tout \(k \in \mathbb{N}\),
    <div class="formula" data-nom="Dérivées de Gamma">$$\Gamma^{(k)}(x) = \int_0^{+\infty} (\ln t)^k\,t^{x-1}\,\mathrm{e}^{-t}\,\mathrm{d}t.$$</div>
    En particulier \(\Gamma'' \gt 0\) : \(\Gamma\) est <strong>convexe</strong>.
  </div>
  <div class="method-box">
    <strong>Exemple — la démonstration rédigée</strong>
    <ol>
      <li>Régularité en \(x\) : \(f(x, t) = t^{x-1}\mathrm{e}^{-t} = \mathrm{e}^{(x-1)\ln t}\,\mathrm{e}^{-t}\) est de classe \(\mathcal{C}^\infty\) en \(x\), et \(\frac{\partial^k f}{\partial x^k}(x, t) = (\ln t)^k\,t^{x-1}\,\mathrm{e}^{-t}\).</li>
      <li>Domination locale : soit \([a, b] \subset \,]0, +\infty[\) et \(x \in [a, b]\). Si \(0 \lt t \le 1\), \(t^{x-1} \le t^{a-1}\) ; si \(t \ge 1\), \(t^{x-1} \le t^{b-1}\). Dans tous les cas :
      <div class="formula">$$\begin{aligned} \left|\frac{\partial^k f}{\partial x^k}(x, t)\right| &\le |\ln t|^k\,\big(t^{a-1} + t^{b-1}\big)\,\mathrm{e}^{-t} \\ &= \varphi_k(t). \end{aligned}$$</div></li>
      <li>Intégrabilité de \(\varphi_k\) : en \(+\infty\), \(t^2\varphi_k(t) \to 0\). En \(0^+\), où \(t^{b-1} \le t^{a-1}\), on a \(t^{1 - a/2}\,\varphi_k(t) \le 2\,|\ln t|^k\,t^{a/2} \to 0\), donc \(\varphi_k = O\big(1/t^{1-a/2}\big)\) avec \(1 - \frac{a}{2} \lt 1\).</li>
      <li>Le théorème de dérivation, appliqué \(k\) fois sur \([a, b]\) (toutes les dérivées \(\frac{\partial^j f}{\partial x^j}\) sont dominées), montre que \(\Gamma\) est de classe \(\mathcal{C}^k\) sur \([a, b]\), pour tous \(k\), \(a\) et \(b\) : \(\Gamma\) est \(\mathcal{C}^\infty\) sur \(]0, +\infty[\).</li>
      <li>Convexité : \(\Gamma''(x) = \int_0^{+\infty} (\ln t)^2\,t^{x-1}\mathrm{e}^{-t}\,\mathrm{d}t \gt 0\), intégrale d'une fonction continue, positive et non identiquement nulle.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · L'INTÉGRALE DE GAUSS</div>
  <h2>Calculer \(\int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t\) grâce à un paramètre</h2>
  <div class="intro">L'intégrale de Gauss converge (chapitre Intégrales généralisées) mais \(t \mapsto \mathrm{e}^{-t^2}\) n'a pas de primitive explicite. L'astuce consiste à introduire un paramètre bien choisi : une fonction dont la dérivée se calcule, et dont la limite donne l'intégrale cherchée.</div>

  <div class="method-box">
    <strong>Exemple — démonstration de \(\int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t = \frac{\sqrt\pi}{2}\)</strong>
    <p>Pour \(x \ge 0\), on pose
    </p>
    <div class="formula">$$\begin{aligned} u(x) &= \left(\int_0^x \mathrm{e}^{-t^2}\,\mathrm{d}t\right)^2, \\ v(x) &= \int_0^1 \frac{\mathrm{e}^{-x^2(1+t^2)}}{1+t^2}\,\mathrm{d}t. \end{aligned}$$</div>
    <ol>
      <li>Dérivée de \(u\) (théorème fondamental et dérivée d'un carré) : \(u'(x) = 2\,\mathrm{e}^{-x^2}\displaystyle\int_0^x \mathrm{e}^{-t^2}\,\mathrm{d}t\).</li>
      <li>Dérivée de \(v\). L'intégrande \(k(x, t) = \frac{\mathrm{e}^{-x^2(1+t^2)}}{1+t^2}\) est de classe \(\mathcal{C}^1\) en \(x\), avec \(\frac{\partial k}{\partial x} = -2x\,\mathrm{e}^{-x^2(1+t^2)}\). Sur \([0, c] \times [0, 1]\), \(\left|\frac{\partial k}{\partial x}\right| \le 2c\), constante intégrable sur le segment \([0, 1]\). Donc \(v\) est de classe \(\mathcal{C}^1\) et
      <div class="formula">$$\begin{aligned} v'(x) &= -2x\,\mathrm{e}^{-x^2}\int_0^1 \mathrm{e}^{-x^2t^2}\,\mathrm{d}t \\ &= -2\,\mathrm{e}^{-x^2}\int_0^x \mathrm{e}^{-s^2}\,\mathrm{d}s, \end{aligned}$$</div>
      grâce au changement de variable \(s = xt\) (pour \(x \gt 0\) ; l'égalité est immédiate en \(x = 0\)).</li>
      <li>Ainsi \(u' + v' = 0\) : \(u + v\) est constante sur \([0, +\infty[\), égale à \(u(0) + v(0) = 0 + \int_0^1 \frac{\mathrm{d}t}{1+t^2} = \frac{\pi}{4}\).</li>
      <li>Limite : comme \(\mathrm{e}^{-x^2(1+t^2)} \le \mathrm{e}^{-x^2}\),
      <div class="formula">$$\begin{aligned} 0 \le v(x) &\le \mathrm{e}^{-x^2}\int_0^1 \frac{\mathrm{d}t}{1+t^2} \\ &= \frac{\pi}{4}\,\mathrm{e}^{-x^2} \xrightarrow[x \to +\infty]{} 0. \end{aligned}$$</div>
      Donc \(u(x) \to \frac{\pi}{4}\), c'est-à-dire \(\left(\int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t\right)^2 = \frac{\pi}{4}\).</li>
      <li>L'intégrale étant positive, \(\int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t = \frac{\sqrt{\pi}}{2} \approx 0{,}8862\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — \(H(x) = \int_0^{+\infty} \mathrm{e}^{-t^2}\cos(xt)\,\mathrm{d}t\) par une équation différentielle</strong>
    <ol>
      <li>Définition et continuité : \(|\mathrm{e}^{-t^2}\cos(xt)| \le \mathrm{e}^{-t^2}\), intégrable et indépendante de \(x\) : \(H\) est définie et continue sur \(\mathbb{R}\), et \(H(0) = \frac{\sqrt\pi}{2}\).</li>
      <li>Dérivation : \(\frac{\partial}{\partial x}\big(\mathrm{e}^{-t^2}\cos(xt)\big) = -t\,\mathrm{e}^{-t^2}\sin(xt)\), dominée par \(t\,\mathrm{e}^{-t^2}\), intégrable sur \([0, +\infty[\) (domination globale). \(H\) est de classe \(\mathcal{C}^1\) sur \(\mathbb{R}\) et \(H'(x) = -\int_0^{+\infty} t\,\mathrm{e}^{-t^2}\sin(xt)\,\mathrm{d}t\).</li>
      <li>Intégration par parties, en primitivant \(t\,\mathrm{e}^{-t^2}\) en \(-\frac12\mathrm{e}^{-t^2}\) et en dérivant \(\sin(xt)\) ; le crochet \(-\frac12\mathrm{e}^{-t^2}\sin(xt)\) est nul en 0 et tend vers 0 en \(+\infty\) :
      <div class="formula">$$\begin{aligned} &\int_0^{+\infty} t\,\mathrm{e}^{-t^2}\sin(xt)\,\mathrm{d}t \\ &\qquad = \frac{x}{2}\int_0^{+\infty} \mathrm{e}^{-t^2}\cos(xt)\,\mathrm{d}t \\ &\qquad = \frac{x}{2}\,H(x). \end{aligned}$$</div></li>
      <li>Donc \(H'(x) = -\frac{x}{2}\,H(x)\) : équation différentielle linéaire du premier ordre, de solution \(H(x) = H(0)\,\mathrm{e}^{-x^2/4}\).</li>
      <li>Conclusion, contrôlée numériquement (\(H(1) \approx 0{,}6902\), \(H(2) \approx 0{,}3260\)) :
      <div class="formula" data-nom="Intégrale de Gauss avec cosinus">$$\int_0^{+\infty} \mathrm{e}^{-t^2}\cos(xt)\,\mathrm{d}t = \frac{\sqrt\pi}{2}\,\mathrm{e}^{-x^2/4}.$$</div></li>
    </ol>
  </div>
  <p>Ce résultat dit que la transformée de Fourier d'une gaussienne est encore une gaussienne, propriété centrale en optique et en traitement du signal.</p>
</div>

<div class="course-section">
  <div class="sec-num">§8 · TRANSFORMÉE DE LAPLACE</div>
  <h2>Le lien avec les sciences industrielles</h2>
  <div class="intro">En automatique (chapitre SLCI des sciences industrielles), un signal \(f(t)\), nul pour \(t \lt 0\), est remplacé par sa transformée de Laplace \(F(p)\) : les équations différentielles deviennent des équations algébriques. Pour \(p\) réel, c'est une intégrale à paramètre ; les sciences industrielles utilisent \(p\) complexe, avec la même théorie.</div>

  <div class="def-box">
    Soit \(f\) continue sur \([0, +\infty[\) à <strong>croissance au plus exponentielle</strong> : il existe \(M\) et \(\alpha\) réels tels que \(|f(t)| \le M\,\mathrm{e}^{\alpha t}\). Sa <strong>transformée de Laplace</strong> est
    <div class="formula" data-nom="Transformée de Laplace">$$\mathcal{L}f(p) = \int_0^{+\infty} f(t)\,\mathrm{e}^{-pt}\,\mathrm{d}t, \qquad p \gt \alpha.$$</div>
    L'intégrale converge absolument, car \(|f(t)\,\mathrm{e}^{-pt}| \le M\,\mathrm{e}^{-(p-\alpha)t}\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> Sur \(]\alpha, +\infty[\) :
    <ul>
      <li>\(\mathcal{L}f\) est de classe \(\mathcal{C}^\infty\) et \((\mathcal{L}f)^{(k)}(p) = (-1)^k\,\mathcal{L}\big(t^k f\big)(p)\) ;</li>
      <li>\(\mathcal{L}f(p) \to 0\) quand \(p \to +\infty\) ;</li>
      <li>si \(f\) est de classe \(\mathcal{C}^1\) et \(f'\) à croissance au plus exponentielle (avec le même \(\alpha\)), \(\mathcal{L}(f')(p) = p\,\mathcal{L}f(p) - f(0)\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une domination locale, une majoration, une intégration par parties.</span>
    <div class="content"><ul>
      <li>Régularité. \(\frac{\partial^k}{\partial p^k}\big(f(t)\,\mathrm{e}^{-pt}\big) = (-t)^k f(t)\,\mathrm{e}^{-pt}\). Pour \(p \ge a \gt \alpha\) : \(|t^k f(t)\,\mathrm{e}^{-pt}| \le M\,t^k\,\mathrm{e}^{-(a-\alpha)t}\), intégrable et indépendante de \(p\). Le théorème de dérivation, appliqué \(k\) fois sur \([a, +\infty[\), donne la classe \(\mathcal{C}^k\) pour tout \(k\).</li>
      <li>Limite :
      <div class="formula">$$\begin{aligned} |\mathcal{L}f(p)| &\le \int_0^{+\infty} M\,\mathrm{e}^{-(p-\alpha)t}\,\mathrm{d}t \\ &= \frac{M}{p - \alpha} \xrightarrow[p \to +\infty]{} 0. \end{aligned}$$</div></li>
      <li>Dérivée. Intégration par parties (on dérive \(\mathrm{e}^{-pt}\)) :
      <div class="formula">$$\begin{aligned} \int_0^{+\infty} f'(t)\,\mathrm{e}^{-pt}\,\mathrm{d}t &= \Big[f(t)\,\mathrm{e}^{-pt}\Big]_0^{+\infty} \\ &\quad + p\int_0^{+\infty} f(t)\,\mathrm{e}^{-pt}\,\mathrm{d}t, \end{aligned}$$</div>
      et le crochet vaut \(-f(0)\) car \(|f(t)\,\mathrm{e}^{-pt}| \le M\,\mathrm{e}^{-(p-\alpha)t} \to 0\).</li>
    </ul></div>
  </div>
  <div class="method-box">
    <strong>Exemple — une table de transformées</strong>
    <ol>
      <li>\(\mathcal{L}(1)(p) = \int_0^{+\infty} \mathrm{e}^{-pt}\,\mathrm{d}t = \frac{1}{p}\) (\(p \gt 0\)) ; \(\mathcal{L}(\mathrm{e}^{at})(p) = \frac{1}{p - a}\) (\(p \gt a\)).</li>
      <li>Puissances, par dérivation sous l'intégrale : \(\mathcal{L}(t^n)(p) = (-1)^n\,\frac{\mathrm{d}^n}{\mathrm{d}p^n}\left(\frac1p\right) = \frac{n!}{p^{n+1}}\). Par exemple \(\mathcal{L}(t^3)(p) = \frac{6}{p^4}\).</li>
      <li>De même, à partir de \(\mathcal{L}(\mathrm{e}^{-at})(p) = \frac{1}{p+a}\) :
      <div class="formula">$$\begin{aligned} \mathcal{L}\big(t\,\mathrm{e}^{-at}\big)(p) &= -\frac{\mathrm{d}}{\mathrm{d}p}\left(\frac{1}{p+a}\right) \\ &= \frac{1}{(p+a)^2}. \end{aligned}$$</div></li>
      <li>Sinus et cosinus, en passant par l'exponentielle complexe : \(\int_0^{+\infty} \mathrm{e}^{i\omega t}\,\mathrm{e}^{-pt}\,\mathrm{d}t = \frac{1}{p - i\omega} = \frac{p + i\omega}{p^2 + \omega^2}\) pour \(p \gt 0\), d'où
      <div class="formula">$$\begin{aligned} \mathcal{L}(\cos \omega t)(p) &= \frac{p}{p^2 + \omega^2}, \\ \mathcal{L}(\sin \omega t)(p) &= \frac{\omega}{p^2 + \omega^2}. \end{aligned}$$</div></li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la réponse indicielle d'un premier ordre</strong>
    <p>On cherche \(y\) telle que \(y' + y = 1\) sur \([0, +\infty[\), avec \(y(0) = 0\) (système du premier ordre de constante de temps 1, soumis à un échelon unité).</p>
    <ol>
      <li>Transformée de l'équation, avec \(Y = \mathcal{L}y\) : \(pY(p) - 0 + Y(p) = \frac1p\), donc \(Y(p) = \frac{1}{p(p+1)}\).</li>
      <li>Décomposition en éléments simples, puis lecture de la table :
      <div class="formula">$$\begin{aligned} Y(p) &= \frac1p - \frac{1}{p+1} \\ &= \mathcal{L}(1)(p) - \mathcal{L}(\mathrm{e}^{-t})(p). \end{aligned}$$</div></li>
      <li>On en déduit \(y(t) = 1 - \mathrm{e}^{-t}\), ce que l'on vérifie directement dans l'équation. L'étape « deux fonctions continues de même transformée sont égales » (injectivité de \(\mathcal{L}\)) est admise : c'est elle que les sciences industrielles utilisent avec les tables.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Prolongements, à titre culturel</h2>
  <ul>
    <li><strong>Convergence dominée.</strong> Si des fonctions continues \(f_n\) convergent en tout point de \(I\) vers une fonction continue \(f\) et si \(|f_n| \le \varphi\) avec \(\varphi\) intégrable, alors \(\int_I f_n \to \int_I f\). Appliqué à \(f_n(t) = f(x_n, t)\) pour une suite \(x_n \to x_0\), il démontre le théorème de continuité ; appliqué aux taux d'accroissement, celui de dérivation.</li>
    <li><strong>Théorème de Fubini.</strong> Sous des hypothèses d'intégrabilité, on peut échanger l'ordre des intégrations :
    <div class="formula">$$\int_A\left(\int_I f(x, t)\,\mathrm{d}t\right)\mathrm{d}x = \int_I\left(\int_A f(x, t)\,\mathrm{d}x\right)\mathrm{d}t.$$</div>
    Il donne une autre preuve de l'intégrale de Gauss, en calculant \(\iint_{\mathbb{R}^2} \mathrm{e}^{-(x^2+y^2)}\,\mathrm{d}x\,\mathrm{d}y = \pi\) en coordonnées polaires.</li>
    <li><strong>Bornes et intégrande variables</strong> : sous des hypothèses de régularité convenables,
    <div class="formula">$$\begin{aligned} &\frac{\mathrm{d}}{\mathrm{d}x}\int_{u(x)}^{v(x)} f(x, t)\,\mathrm{d}t \\ &\qquad = f\big(x, v(x)\big)\,v'(x) - f\big(x, u(x)\big)\,u'(x) \\ &\qquad\quad + \int_{u(x)}^{v(x)} \frac{\partial f}{\partial x}(x, t)\,\mathrm{d}t. \end{aligned}$$</div></li>
    <li><strong>Formule de Stirling pour Γ</strong> : \(\Gamma(x+1) \sim \sqrt{2\pi x}\left(\frac{x}{\mathrm{e}}\right)^x\) en \(+\infty\), qui étend celle de \(n!\).</li>
    <li><strong>Intégrale de Dirichlet.</strong> La fonction \(F\) du §1 vérifie \(F'' + F = \frac1x\) ; on montre qu'elle coïncide avec \(x \mapsto \int_0^{+\infty} \frac{\sin t}{t + x}\,\mathrm{d}t\), et en faisant tendre \(x\) vers 0, on obtient \(\int_0^{+\infty} \frac{\sin t}{t}\,\mathrm{d}t = \frac{\pi}{2}\).</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="ipa-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · INTÉGRALES À PARAMÈTRE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Étudier une fonction \(g(x) = \int_I f(x, t)\,\mathrm{d}t\) (\(x\) dans un intervalle \(A\), \(t\) dans l'intervalle d'intégration \(I\)) : ensemble de définition, continuité et dérivabilité par domination, limites, puis calcul de \(g\) par dérivation ou par une équation différentielle.</div>

  <div class="method-box"><strong>Méthode 1 — Déterminer l'ensemble de définition</strong>
    <ol style="margin-top:.4rem">
      <li>Fixer \(x\) : c'est une question d'intégrale généralisée en \(t\) seulement.</li>
      <li>Lister les bornes problématiques de \(I\) et, en chacune, chercher un équivalent ou une majoration de \(|f(x, t)|\) qui dépend de \(x\).</li>
      <li>Comparer aux fonctions de référence : chaque borne donne une condition sur \(x\) ; l'ensemble de définition est l'intersection.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(g(x) = \int_0^{+\infty} \frac{t^x}{1 + t^3}\,\mathrm{d}t\). En \(0^+\), l'intégrande est équivalent à \(t^x = \frac{1}{t^{-x}}\), intégrable si et seulement si \(-x \lt 1\) ; en \(+\infty\), à \(\frac{1}{t^{3-x}}\), intégrable si et seulement si \(3 - x \gt 1\). L'intégrande étant positif, \(g\) est définie exactement sur \(]-1, 2[\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Prouver la continuité par une domination globale</strong>
    <ol style="margin-top:.4rem">
      <li>Vérifier que, pour tout \(t \in I\), \(x \mapsto f(x, t)\) est continue sur \(A\) (et mentionner la continuité en \(t\), sans s'y attarder).</li>
      <li>Majorer \(|f(x, t)|\) par une fonction \(\varphi(t)\) <strong>indépendante de \(x\)</strong>, valable pour tous \(x \in A\) et \(t \in I\) : majorer les facteurs bornés (\(|\cos| \le 1\)), remplacer \(x\) par la valeur qui rend \(|f|\) le plus grand.</li>
      <li>Justifier l'intégrabilité de \(\varphi\) sur \(I\), puis conclure : \(g\) est définie et continue sur \(A\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(|\cos(xt)\,\mathrm{e}^{-t}| \le \mathrm{e}^{-t}\), intégrable sur \([0, +\infty[\) : \(x \mapsto \int_0^{+\infty}\cos(xt)\,\mathrm{e}^{-t}\,\mathrm{d}t\) est continue sur \(\mathbb{R}\) (elle vaut d'ailleurs \(\frac{1}{1+x^2}\)).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire « \(|f(x, t)| \le \mathrm{e}^{-xt}\) » n'est pas une domination, puisque le majorant dépend encore de \(x\). Un majorant non intégrable (la constante 1 sur \([0, +\infty[\)) ne vaut rien non plus.</div>

  <div class="method-box"><strong>Méthode 3 — Passer par une domination locale</strong>
    <ol style="margin-top:.4rem">
      <li>Constater qu'aucune domination globale n'existe : le majorant optimal \(\sup_{x \in A}|f(x, t)|\) n'est pas intégrable (souvent à cause d'une borne ouverte de \(A\)).</li>
      <li>En question intermédiaire, fixer un segment \([a, b] \subset A\) (ou \([a, +\infty[\)) et dominer pour \(x\) dans ce segment seulement : la fonction \(\varphi_{a,b}\) peut dépendre de \(a\) et \(b\), pas de \(x\).</li>
      <li>Appliquer le théorème sur \([a, b]\), puis conclure sur \(A\), « tout point de \(A\) étant intérieur à un tel segment » (ou appartenant à un tel segment s'il est une extrémité de \(A\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(g(x) = \int_0^{+\infty}\frac{\mathrm{e}^{-xt}}{1+t}\,\mathrm{d}t\) sur \(]0, +\infty[\). Le sup en \(x \gt 0\) vaut \(\frac{1}{1+t}\), non intégrable. Pour \(x \ge a \gt 0\) : \(0 \lt \frac{\mathrm{e}^{-xt}}{1+t} \le \mathrm{e}^{-at}\), intégrable. Donc \(g\) est continue sur \([a, +\infty[\) pour tout \(a \gt 0\), donc sur \(]0, +\infty[\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Traiter le cas d'un segment d'intégration</strong>
    <ol style="margin-top:.4rem">
      <li>Si \(I = [a, b]\) est un segment et \(f\) continue sur \(A \times [a, b]\), \(g\) est continue sur \(A\) : sur \([\alpha, \beta] \times [a, b]\), avec \([\alpha, \beta] \subset A\), \(|f|\) est majorée par une constante, intégrable sur le segment.</li>
      <li>Pour la dérivabilité, même argument sur \(\frac{\partial f}{\partial x}\), supposée continue sur \(A \times [a, b]\).</li>
      <li>Rédiger tout de même la domination par une constante : c'est elle que le théorème demande.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(g(x) = \int_0^1 \mathrm{e}^{x t^2}\,\mathrm{d}t\). Pour \(|x| \le c\), \(\left|\frac{\partial}{\partial x}\mathrm{e}^{xt^2}\right| = t^2\mathrm{e}^{xt^2} \le \mathrm{e}^{c}\) sur \([0, 1]\) : \(g\) est de classe \(\mathcal{C}^1\) sur \(\mathbb{R}\), et \(g'(x) = \int_0^1 t^2\mathrm{e}^{xt^2}\,\mathrm{d}t \gt 0\) : \(g\) est strictement croissante.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Dériver sous le signe intégrale</strong>
    <ol style="margin-top:.4rem">
      <li>Pour tout \(t\), \(x \mapsto f(x, t)\) est de classe \(\mathcal{C}^1\) : calculer \(\frac{\partial f}{\partial x}\), \(t\) étant fixé.</li>
      <li>Pour tout \(x\), \(t \mapsto f(x, t)\) est intégrable sur \(I\) (c'est l'ensemble de définition).</li>
      <li>Dominer \(\left|\frac{\partial f}{\partial x}(x, t)\right| \le \varphi(t)\), \(\varphi\) intégrable, globalement ou sur chaque segment de \(A\).</li>
      <li>Conclure : \(g\) est de classe \(\mathcal{C}^1\) et \(g'(x) = \int_I \frac{\partial f}{\partial x}(x, t)\,\mathrm{d}t\). Pour \(\mathcal{C}^k\), dominer de même chaque dérivée partielle successive.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(F(x) = \int_0^{+\infty} \mathrm{e}^{-t}\frac{\sin(xt)}{t}\,\mathrm{d}t\) est définie sur \(\mathbb{R}\) car \(\left|\frac{\sin(xt)}{t}\right| \le |x|\). La dérivée partielle \(\mathrm{e}^{-t}\cos(xt)\) est dominée par \(\mathrm{e}^{-t}\) : \(F'(x) = \int_0^{+\infty}\mathrm{e}^{-t}\cos(xt)\,\mathrm{d}t = \frac{1}{1+x^2}\), et \(F(0) = 0\), donc \(F(x) = \arctan x\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : pour dériver, c'est \(\frac{\partial f}{\partial x}\) qu'on domine, pas \(f\) ; et l'intégrabilité de \(t \mapsto f(x, t)\) doit être vérifiée à part. À une borne de \(A\) où la domination échoue, la dérivabilité peut vraiment tomber : \(x \mapsto \int_0^{+\infty}\frac{\mathrm{e}^{-xt}}{1+t^2}\,\mathrm{d}t\) est continue en 0 mais pas dérivable en 0 (voir le cours, §4).</div>

  <div class="method-box"><strong>Méthode 6 — Obtenir une limite ou un équivalent aux bornes</strong>
    <ol style="margin-top:.4rem">
      <li>Majorer directement \(|g(x)|\), ou l'écart \(|g(x) - h(x)|\) à une fonction simple, par une intégrale calculable.</li>
      <li>Changer de variable (\(u = xt\)) pour faire sortir la dépendance en \(x\).</li>
      <li>Utiliser une relation (fonctionnelle, intégration par parties) et la monotonie de \(g\) pour encadrer.</li>
      <li>Si \(g\) se prolonge par continuité à une borne (domination sur un intervalle plus grand), la limite est la valeur de l'intégrale en cette borne.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(g(x) = \int_0^{+\infty}\frac{\mathrm{e}^{-xt}}{1+t}\,\mathrm{d}t\), \(0 \le \frac1x - g(x) = \int_0^{+\infty}\mathrm{e}^{-xt}\frac{t}{1+t}\,\mathrm{d}t \le \int_0^{+\infty}t\,\mathrm{e}^{-xt}\,\mathrm{d}t = \frac{1}{x^2}\), donc \(g(x) \sim \frac1x\) en \(+\infty\) (pour \(x = 10\) : \(g(10) \approx 0{,}0916\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Calculer une intégrale en dérivant par rapport au paramètre</strong>
    <ol style="margin-top:.4rem">
      <li>Introduire (ou repérer) un paramètre tel que \(\frac{\partial f}{\partial x}\) soit plus simple que \(f\) : il fait souvent disparaître un dénominateur en \(t\) ou un logarithme.</li>
      <li>Justifier la dérivation (méthode 5) et calculer \(g'(x)\) explicitement.</li>
      <li>Intégrer en \(x\), puis fixer la constante par une valeur connue (\(g(0)\), \(g(1)\)) ou une limite.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(g(x) = \int_0^{+\infty}(1 - \cos(xt))\frac{\mathrm{e}^{-t}}{t}\,\mathrm{d}t\). La dérivée partielle \(\sin(xt)\,\mathrm{e}^{-t}\) est dominée par \(\mathrm{e}^{-t}\), d'où \(g'(x) = \int_0^{+\infty}\sin(xt)\,\mathrm{e}^{-t}\,\mathrm{d}t = \frac{x}{1+x^2}\) ; avec \(g(0) = 0\), \(g(x) = \frac12\ln(1+x^2)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Faire apparaître une équation différentielle</strong>
    <ol style="margin-top:.4rem">
      <li>Dériver sous l'intégrale (une ou deux fois) après avoir justifié la domination.</li>
      <li>Transformer \(g'(x)\) par une intégration par parties en \(t\) (ou combiner \(g\), \(g'\), \(g''\)) pour faire réapparaître \(g\).</li>
      <li>Résoudre l'équation différentielle obtenue et fixer les constantes par des valeurs ou des limites connues.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(g(x) = \int_0^{+\infty}\mathrm{e}^{-t^2}\operatorname{ch}(xt)\,\mathrm{d}t\). Pour \(|x| \le c\), \(|t\,\mathrm{e}^{-t^2}\operatorname{sh}(xt)| \le t\,\mathrm{e}^{-t^2 + ct}\), intégrable (domination locale). Une intégration par parties donne \(g'(x) = \frac{x}{2}\,g(x)\), d'où \(g(x) = \frac{\sqrt\pi}{2}\,\mathrm{e}^{x^2/4}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Utiliser la transformée de Laplace</strong>
    <ol style="margin-top:.4rem">
      <li>Vérifier que \(f\) est continue et à croissance au plus exponentielle (\(|f(t)| \le M\mathrm{e}^{\alpha t}\)) : \(\mathcal{L}f(p)\) existe pour \(p \gt \alpha\).</li>
      <li>Utiliser les règles : \((\mathcal{L}f)^{(k)}(p) = (-1)^k\mathcal{L}(t^k f)(p)\) (dérivation sous l'intégrale), \(\mathcal{L}(f')(p) = p\,\mathcal{L}f(p) - f(0)\) (intégration par parties).</li>
      <li>Transformer une équation différentielle en équation algébrique, la résoudre, décomposer en éléments simples, puis lire la table (l'injectivité de \(\mathcal{L}\) est admise).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\mathcal{L}(t\cos t)(p) = -\frac{\mathrm{d}}{\mathrm{d}p}\left(\frac{p}{p^2+1}\right) = \frac{p^2 - 1}{(p^2+1)^2}\) pour \(p \gt 0\).</p>
  </div>
</div>
</template>

<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Une intégrale à paramètre sur un segment</h3>
  <div class="statement">Soit \(g(x) = \displaystyle\int_0^1 \frac{\cos(xt)}{1+t^2}\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(g\) est définie et continue sur \(\mathbb{R}\), paire, et calculer \(g(0)\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(g\) est de classe \(\mathcal{C}^1\) sur \(\mathbb{R}\) et exprimer \(g'(x)\) par une intégrale.</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(|g'(x)| \le \frac{\ln 2}{2}\), puis que \(\left|g(x) - \frac{\pi}{4}\right| \le \frac{\ln 2}{2}\,|x|\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f(x, t) = \frac{\cos(xt)}{1+t^2}\) est continue sur \(\mathbb{R}\times[0, 1]\), et \([0, 1]\) est un segment ; mieux, \(|f(x, t)| \le \frac{1}{1+t^2}\), majorant indépendant de \(x\) et intégrable sur \([0, 1]\) : le théorème de continuité donne \(g\) continue sur \(\mathbb{R}\). Comme \(\cos\) est paire, \(g(-x) = g(x)\). Enfin \(g(0) = \int_0^1 \frac{\mathrm{d}t}{1+t^2} = \frac{\pi}{4}\).</p>
    <p><strong>Q2.</strong> Pour tout \(t\), \(x \mapsto f(x, t)\) est de classe \(\mathcal{C}^1\) et \(\frac{\partial f}{\partial x}(x, t) = -\frac{t\sin(xt)}{1+t^2}\). Pour tout \(x\), \(t \mapsto f(x, t)\) est continue, donc intégrable, sur le segment \([0, 1]\). Domination : \(\left|\frac{\partial f}{\partial x}(x, t)\right| \le \frac{t}{1+t^2}\), indépendant de \(x\) et intégrable sur \([0, 1]\). Donc \(g\) est de classe \(\mathcal{C}^1\) et \(g'(x) = -\int_0^1 \frac{t\sin(xt)}{1+t^2}\,\mathrm{d}t\).</p>
    <p><strong>Q3.</strong> Par l'inégalité triangulaire et la domination, \(|g'(x)| \le \int_0^1 \frac{t}{1+t^2}\,\mathrm{d}t = \frac{\ln 2}{2}\). L'inégalité des accroissements finis entre 0 et \(x\) donne alors \(|g(x) - g(0)| \le \frac{\ln 2}{2}|x|\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Ensemble de définition, continuité, limites</h3>
  <div class="statement">On pose \(g(x) = \displaystyle\int_0^{+\infty}\frac{\mathrm{d}t}{1 + t^x}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(g\) est définie exactement sur \(]1, +\infty[\). Calculer \(g(2)\).</div>
  <div class="q"><strong>Q2.</strong> Expliquer pourquoi il n'existe pas de domination valable pour tous les \(x \gt 1\). Pour \(a \gt 1\), trouver une domination valable pour \(x \ge a\) et en déduire que \(g\) est continue sur \(]1, +\infty[\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(g(x) \to 1\) quand \(x \to +\infty\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(g(x) \to +\infty\) quand \(x \to 1^+\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu et positif sur \(]0, +\infty[\). Si \(x \le 0\), \(t^x \le 1\) pour \(t \ge 1\), donc l'intégrande est au moins \(\frac12\) sur \([1, +\infty[\) : divergence. Si \(x \gt 0\), l'intégrande tend vers 1 en \(0^+\) (pas de problème en 0) et est équivalent à \(\frac{1}{t^x}\) en \(+\infty\), intégrable si et seulement si \(x \gt 1\). Donc \(g\) est définie sur \(]1, +\infty[\), et \(g(2) = \int_0^{+\infty}\frac{\mathrm{d}t}{1+t^2} = \frac{\pi}{2}\).</p>
    <p><strong>Q2.</strong> Pour \(t \gt 1\), \(x \mapsto \frac{1}{1+t^x}\) décroît, et son sup sur \(]1, +\infty[\) vaut \(\frac{1}{1+t}\), qui n'est pas intégrable en \(+\infty\) : toute domination \(\varphi\) valable pour tous les \(x \gt 1\) serait au moins égale à \(\frac{1}{1+t}\), donc non intégrable. Soit \(a \gt 1\) et \(x \ge a\). Pour \(t \in \,]0, 1]\), l'intégrande est au plus 1 ; pour \(t \ge 1\), \(t^x \ge t^a\), donc il est au plus \(\frac{1}{t^a}\). Ainsi \(0 \le \frac{1}{1+t^x} \le \varphi_a(t) = \min\big(1, t^{-a}\big)\), fonction continue, indépendante de \(x\) et intégrable sur \(]0, +\infty[\) (\(a \gt 1\)). Pour tout \(t\), \(x \mapsto \frac{1}{1+t^x} = \frac{1}{1 + \mathrm{e}^{x\ln t}}\) est continue. Le théorème donne \(g\) continue sur \([a, +\infty[\), pour tout \(a \gt 1\), donc sur \(]1, +\infty[\).</p>
    <p><strong>Q3.</strong> On coupe en 1. D'une part, \(0 \le \int_1^{+\infty}\frac{\mathrm{d}t}{1+t^x} \le \int_1^{+\infty} t^{-x}\,\mathrm{d}t = \frac{1}{x-1} \to 0\). D'autre part, \(1 - u \le \frac{1}{1+u} \le 1\) pour \(u \ge 0\) donne, avec \(u = t^x\), \(1 - \frac{1}{x+1} \le \int_0^1 \frac{\mathrm{d}t}{1+t^x} \le 1\). Donc \(g(x) \to 1\) (contrôle : \(g(50) \approx 1{,}0007\)).</p>
    <p><strong>Q4.</strong> Pour \(t \ge 1\) et \(x \gt 1\), \(1 + t^x \le 2t^x\), donc \(g(x) \ge \int_1^{+\infty}\frac{\mathrm{d}t}{2t^x} = \frac{1}{2(x-1)} \to +\infty\) quand \(x \to 1^+\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Domination locale : une intégrale qui n'existe pas en 0</h3>
  <div class="statement">On pose \(\Phi(x) = \displaystyle\int_0^{+\infty}\mathrm{e}^{-xt}\sin t\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\Phi(x)\) est définie pour \(x \gt 0\), mais pas pour \(x = 0\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\Phi(x)\) à l'aide de l'exponentielle complexe.</div>
  <div class="q"><strong>Q3.</strong> Montrer, sans utiliser Q2, que \(\Phi\) est continue sur \(]0, +\infty[\). Une domination globale sur \(]0, +\infty[\) est-elle possible ?</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(\Phi\) est de classe \(\mathcal{C}^1\) sur \(]0, +\infty[\), exprimer \(\Phi'(x)\) et en déduire \(\int_0^{+\infty} t\,\mathrm{e}^{-t}\sin t\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(x \gt 0\), \(|\mathrm{e}^{-xt}\sin t| \le \mathrm{e}^{-xt}\), intégrable sur \([0, +\infty[\) : l'intégrale converge absolument. Pour \(x = 0\), \(\int_0^X \sin t\,\mathrm{d}t = 1 - \cos X\) n'a pas de limite quand \(X \to +\infty\) : divergence.</p>
    <p><strong>Q2.</strong> \(\mathrm{e}^{-xt}\sin t = \operatorname{Im}\big(\mathrm{e}^{(-x + i)t}\big)\), et \(\int_0^{+\infty}\mathrm{e}^{(-x+i)t}\,\mathrm{d}t = \frac{1}{x - i} = \frac{x + i}{x^2 + 1}\) (le module \(\mathrm{e}^{-xt}\) tend vers 0). En prenant la partie imaginaire : \(\Phi(x) = \frac{1}{1 + x^2}\).</p>
    <p><strong>Q3.</strong> Le sup de \(|\mathrm{e}^{-xt}\sin t|\) pour \(x \gt 0\) vaut \(|\sin t|\), qui n'est pas intégrable sur \([0, +\infty[\) (son intégrale sur chaque \([k\pi, (k+1)\pi]\) vaut 2) : pas de domination globale. Soit \(a \gt 0\) : pour \(x \ge a\), \(|\mathrm{e}^{-xt}\sin t| \le \mathrm{e}^{-at}\), intégrable et indépendant de \(x\). Avec la continuité de \(x \mapsto \mathrm{e}^{-xt}\sin t\), \(\Phi\) est continue sur \([a, +\infty[\) pour tout \(a \gt 0\), donc sur \(]0, +\infty[\). Remarque : \(\Phi(x) \to 1\) quand \(x \to 0^+\), alors que l'intégrale diverge en \(x = 0\).</p>
    <p><strong>Q4.</strong> \(\frac{\partial}{\partial x}\big(\mathrm{e}^{-xt}\sin t\big) = -t\,\mathrm{e}^{-xt}\sin t\), et pour \(x \ge a \gt 0\), \(|t\,\mathrm{e}^{-xt}\sin t| \le t\,\mathrm{e}^{-at}\), intégrable. Le théorème de dérivation (domination locale) donne \(\Phi\) de classe \(\mathcal{C}^1\) sur \(]0, +\infty[\) et \(\Phi'(x) = -\int_0^{+\infty}t\,\mathrm{e}^{-xt}\sin t\,\mathrm{d}t\). Or \(\Phi'(x) = -\frac{2x}{(1+x^2)^2}\), donc \(\int_0^{+\infty}t\,\mathrm{e}^{-t}\sin t\,\mathrm{d}t = -\Phi'(1) = \frac12\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Dériver pour calculer</h3>
  <div class="statement">Pour \(x \gt -1\), on pose \(g(x) = \displaystyle\int_0^1 \frac{t^x - 1}{\ln t}\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(g\) est bien définie sur \(]-1, +\infty[\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(g\) est de classe \(\mathcal{C}^1\) sur \(]-1, +\infty[\) et calculer \(g'(x)\).</div>
  <div class="q"><strong>Q3.</strong> En déduire \(g(x)\), puis les valeurs de \(\int_0^1 \frac{t - 1}{\ln t}\,\mathrm{d}t\) et \(\int_0^1 \frac{t^2 - 1}{\ln t}\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu sur \(]0, 1[\). En \(1^-\), \(t^x - 1 = \mathrm{e}^{x\ln t} - 1 \sim x\ln t\), donc il tend vers \(x\) : prolongement par continuité. En \(0^+\) : si \(x \ge 0\), \(t^x - 1\) est borné et \(\frac{1}{\ln t} \to 0\), donc l'intégrande tend vers 0 ; si \(-1 \lt x \lt 0\), pour \(t \le \frac1{\mathrm{e}}\) on a \(|\ln t| \ge 1\), donc \(\left|\frac{t^x - 1}{\ln t}\right| \le t^x + 1\), intégrable en \(0^+\) car \(-x \lt 1\). Dans tous les cas, l'intégrale converge.</p>
    <p><strong>Q2.</strong> Pour \(t \in \,]0, 1[\), \(x \mapsto \frac{\mathrm{e}^{x\ln t} - 1}{\ln t}\) est de classe \(\mathcal{C}^1\), de dérivée \(\frac{\ln t\,\mathrm{e}^{x\ln t}}{\ln t} = t^x\) : le logarithme disparaît. Domination locale : soit \(a \gt -1\) ; pour \(x \ge a\) et \(t \in \,]0, 1[\), \(0 \lt t^x \le t^a\) (car \(\ln t \lt 0\)), intégrable sur \(]0, 1[\) puisque \(a \gt -1\). Donc \(g\) est de classe \(\mathcal{C}^1\) sur \([a, +\infty[\) pour tout \(a \gt -1\), donc sur \(]-1, +\infty[\), et \(g'(x) = \int_0^1 t^x\,\mathrm{d}t = \frac{1}{x+1}\).</p>
    <p><strong>Q3.</strong> \(g(x) = \ln(1+x) + C\), et \(g(0) = \int_0^1 0\,\mathrm{d}t = 0\) donne \(C = 0\) : \(g(x) = \ln(1 + x)\). En particulier \(g(1) = \ln 2\) et \(g(2) = \ln 3\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Dérivées de la fonction Γ</h3>
  <div class="statement">On admet les résultats du cours : \(\Gamma\) est de classe \(\mathcal{C}^\infty\) sur \(]0, +\infty[\), \(\Gamma^{(k)}(x) = \int_0^{+\infty}(\ln t)^k t^{x-1}\mathrm{e}^{-t}\,\mathrm{d}t\) et \(\Gamma(x+1) = x\,\Gamma(x)\). On note \(\gamma = -\Gamma'(1) \approx 0{,}5772\) et \(H_n = \sum_{k=1}^n \frac1k\) (avec \(H_0 = 0\)).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\Gamma'(x+1) = \Gamma(x) + x\,\Gamma'(x)\) pour \(x \gt 0\).</div>
  <div class="q"><strong>Q2.</strong> En déduire que \(\Gamma'(n+1) = n!\,(H_n - \gamma)\) pour tout \(n \in \mathbb{N}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\displaystyle\int_0^{+\infty} t^2\ln t\;\mathrm{e}^{-t}\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On dérive la relation \(\Gamma(x+1) = x\,\Gamma(x)\), valable sur \(]0, +\infty[\), membre à membre : \(\Gamma'(x+1) = \Gamma(x) + x\,\Gamma'(x)\).</p>
    <p><strong>Q2.</strong> Récurrence. Pour \(n = 0\) : \(\Gamma'(1) = -\gamma = 0!\,(H_0 - \gamma)\). Si la formule est vraie au rang \(n - 1\) (\(n \ge 1\)), Q1 avec \(x = n\) donne</p>
    <div class="formula">$$\Gamma'(n+1) = (n-1)! + n\,(n-1)!\,(H_{n-1} - \gamma) = n!\left(\frac1n + H_{n-1} - \gamma\right) = n!\,(H_n - \gamma).$$</div>
    <p><strong>Q3.</strong> C'est \(\Gamma'(3)\) (\(k = 1\), \(x = 3\)) : \(\Gamma'(3) = 2!\,\big(1 + \frac12 - \gamma\big) = 3 - 2\gamma \approx 1{,}846\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Une intégrale avec arctangente</h3>
  <div class="statement">Pour \(x \ge 0\), on pose \(g(x) = \displaystyle\int_0^{+\infty}\frac{\arctan(xt)}{t\,(1+t^2)}\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(g\) est définie sur \([0, +\infty[\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(g\) est de classe \(\mathcal{C}^1\) sur \([0, +\infty[\) et que \(g'(x) = \displaystyle\int_0^{+\infty}\frac{\mathrm{d}t}{(1 + x^2t^2)(1 + t^2)}\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(x \ge 0\), \(x \neq 1\), décomposer l'intégrande de \(g'(x)\) et montrer que \(g'(x) = \dfrac{\pi}{2(1+x)}\). Que vaut \(g'(1)\) ?</div>
  <div class="q"><strong>Q4.</strong> En déduire \(g(x)\), puis \(\displaystyle\int_0^{+\infty}\frac{\arctan t}{t\,(1+t^2)}\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu sur \(]0, +\infty[\). En \(0^+\), \(\arctan(xt) \sim xt\) (ou vaut 0 si \(x = 0\)), donc l'intégrande tend vers \(x\) : prolongement par continuité. En \(+\infty\), il est majoré par \(\frac{\pi/2}{t(1+t^2)} \le \frac{\pi}{2t^3}\), intégrable. Donc \(g(x)\) existe, et \(g(0) = 0\).</p>
    <p><strong>Q2.</strong> Pour tout \(t \gt 0\), \(x \mapsto \frac{\arctan(xt)}{t(1+t^2)}\) est de classe \(\mathcal{C}^1\) et</p>
    <div class="formula">$$\frac{\partial}{\partial x}\left(\frac{\arctan(xt)}{t(1+t^2)}\right) = \frac{1}{t(1+t^2)}\cdot\frac{t}{1 + x^2t^2} = \frac{1}{(1 + x^2t^2)(1+t^2)}.$$</div>
    <p>Elle est positive et majorée par \(\frac{1}{1+t^2}\), intégrable sur \(]0, +\infty[\) et indépendante de \(x\) (domination globale). L'intégrabilité à \(x\) fixé est Q1. Le théorème de dérivation donne le résultat.</p>
    <p><strong>Q3.</strong> Pour \(x \neq 1\), on vérifie en réduisant au même dénominateur que</p>
    <div class="formula">$$\frac{1}{(1 + x^2t^2)(1+t^2)} = \frac{1}{1 - x^2}\left(\frac{1}{1+t^2} - \frac{x^2}{1 + x^2t^2}\right).$$</div>
    <p>Les deux morceaux sont intégrables, et \(\int_0^{+\infty}\frac{x^2\,\mathrm{d}t}{1 + x^2t^2} = x\,\big[\arctan(xt)\big]_0^{+\infty} = \frac{\pi x}{2}\) (nul si \(x = 0\)). Donc \(g'(x) = \frac{1}{1-x^2}\cdot\frac{\pi}{2}(1 - x) = \frac{\pi}{2(1+x)}\). En \(x = 1\), \(g'\) étant continue (Q2), \(g'(1) = \lim_{x\to1} \frac{\pi}{2(1+x)} = \frac{\pi}{4}\) ; on le retrouve directement : \(\int_0^{+\infty}\frac{\mathrm{d}t}{(1+t^2)^2} = \frac{\pi}{4}\).</p>
    <p><strong>Q4.</strong> \(g(x) = \frac{\pi}{2}\ln(1 + x) + C\) sur \([0, +\infty[\), et \(g(0) = 0\) donne \(C = 0\). Pour \(x = 1\) : \(\int_0^{+\infty}\frac{\arctan t}{t(1+t^2)}\,\mathrm{d}t = \frac{\pi\ln 2}{2} \approx 1{,}089\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Relation fonctionnelle et équivalents</h3>
  <div class="statement">On pose \(h(x) = \displaystyle\int_0^1 \frac{t^{x-1}}{1+t}\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer l'ensemble de définition de \(h\) et montrer que \(h\) est décroissante.</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(h\) est continue sur son ensemble de définition (domination locale).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(h(x) + h(x+1) = \dfrac1x\). Calculer \(h(1)\) et \(h\big(\frac12\big)\).</div>
  <div class="q"><strong>Q4.</strong> En déduire un équivalent de \(h\) en \(0^+\).</div>
  <div class="q"><strong>Q5.</strong> Montrer que \(\dfrac{1}{2x} \le h(x) \le \dfrac{1}{2(x-1)}\) pour \(x \gt 1\), et en déduire un équivalent de \(h\) en \(+\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu et positif sur \(]0, 1]\). En \(0^+\), il est équivalent à \(t^{x-1} = \frac{1}{t^{1-x}}\), intégrable si et seulement si \(1 - x \lt 1\), soit \(x \gt 0\). Donc \(h\) est définie sur \(]0, +\infty[\). Pour \(t \in \,]0, 1[\), \(x \mapsto t^{x-1} = \mathrm{e}^{(x-1)\ln t}\) est décroissante (\(\ln t \lt 0\)) : si \(x \le y\), l'intégrande de \(h(y)\) est inférieur à celui de \(h(x)\), et par croissance de l'intégrale \(h(y) \le h(x)\).</p>
    <p><strong>Q2.</strong> Soit \(a \gt 0\). Pour \(x \ge a\) et \(t \in \,]0, 1]\), \(0 \lt \frac{t^{x-1}}{1+t} \le t^{a-1}\), intégrable sur \(]0, 1]\) car \(a \gt 0\), et indépendant de \(x\). Pour tout \(t\), \(x \mapsto \frac{t^{x-1}}{1+t}\) est continue. Donc \(h\) est continue sur \([a, +\infty[\) pour tout \(a \gt 0\), donc sur \(]0, +\infty[\).</p>
    <p><strong>Q3.</strong> Par linéarité,</p>
    <div class="formula">$$h(x) + h(x+1) = \int_0^1 \frac{t^{x-1}(1 + t)}{1+t}\,\mathrm{d}t = \int_0^1 t^{x-1}\,\mathrm{d}t = \frac1x.$$</div>
    <p>Puis \(h(1) = \int_0^1\frac{\mathrm{d}t}{1+t} = \ln 2\), et, avec \(t = u^2\), \(h\big(\frac12\big) = \int_0^1 \frac{t^{-1/2}}{1+t}\,\mathrm{d}t = \int_0^1\frac{2\,\mathrm{d}u}{1+u^2} = \frac{\pi}{2}\).</p>
    <p><strong>Q4.</strong> \(h(x) = \frac1x - h(x+1)\), et \(h(x+1) \to h(1) = \ln 2\) quand \(x \to 0^+\) par continuité de \(h\) en 1. Le terme \(\frac1x\) l'emporte : \(h(x) \sim \frac1x\) en \(0^+\).</p>
    <p><strong>Q5.</strong> Par décroissance, \(h(x+1) \le h(x) \le h(x-1)\) pour \(x \gt 1\). Donc \(\frac1x = h(x) + h(x+1) \le 2h(x)\) et \(2h(x) \le h(x-1) + h(x) = \frac{1}{x-1}\). L'encadrement donne \(h(x) \sim \frac{1}{2x}\) en \(+\infty\) (contrôle : \(2x\,h(x) \approx 1{,}005\) pour \(x = 100\)).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Une gaussienne à paramètre et une équation différentielle</h3>
  <div class="statement">Pour \(x \ge 0\), on pose \(I(x) = \displaystyle\int_0^{+\infty}\exp\!\left(-t^2 - \frac{x^2}{t^2}\right)\mathrm{d}t\). On rappelle que \(\int_0^{+\infty}\mathrm{e}^{-t^2}\,\mathrm{d}t = \frac{\sqrt\pi}{2}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(I\) est définie et continue sur \([0, +\infty[\), et donner \(I(0)\).</div>
  <div class="q"><strong>Q2.</strong> Soit \(0 \lt a \lt b\). Montrer que, pour \(x \in [a, b]\) et \(t \gt 0\), la dérivée partielle en \(x\) de l'intégrande est majorée en valeur absolue par \(\varphi(t) = \dfrac{2b}{t^2}\,\mathrm{e}^{-a^2/t^2}\), et que \(\varphi\) est intégrable sur \(]0, +\infty[\). En déduire que \(I\) est de classe \(\mathcal{C}^1\) sur \(]0, +\infty[\).</div>
  <div class="q"><strong>Q3.</strong> À l'aide du changement de variable \(u = x/t\), montrer que \(I'(x) = -2\,I(x)\) pour \(x \gt 0\).</div>
  <div class="q"><strong>Q4.</strong> En déduire \(I(x)\) pour \(x \ge 0\), puis la valeur de \(\displaystyle\int_0^{+\infty}\mathrm{e}^{-(t - 1/t)^2}\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(x \ge 0\) et \(t \gt 0\), \(0 \lt \exp\!\big(-t^2 - \frac{x^2}{t^2}\big) \le \mathrm{e}^{-t^2}\), intégrable sur \(]0, +\infty[\) et indépendant de \(x\) ; pour tout \(t \gt 0\), l'intégrande est continu en \(x\). Le théorème de continuité donne \(I\) définie et continue sur \([0, +\infty[\), et \(I(0) = \frac{\sqrt\pi}{2}\).</p>
    <p><strong>Q2.</strong> La dérivée partielle vaut \(-\frac{2x}{t^2}\exp\!\big(-t^2 - \frac{x^2}{t^2}\big)\). Pour \(x \in [a, b]\) : \(2x \le 2b\), \(\mathrm{e}^{-x^2/t^2} \le \mathrm{e}^{-a^2/t^2}\) et \(\mathrm{e}^{-t^2} \le 1\), d'où la majoration par \(\varphi(t)\). Intégrabilité : en \(0^+\), avec \(s = 1/t\), \(\varphi(t) = 2b\,s^2\mathrm{e}^{-a^2s^2} \to 0\) (croissances comparées), donc \(\varphi\) se prolonge par continuité en 0 ; en \(+\infty\), \(\varphi(t) \le \frac{2b}{t^2}\), intégrable. L'intégrande est de classe \(\mathcal{C}^1\) en \(x\) et intégrable en \(t\) (Q1) : \(I\) est de classe \(\mathcal{C}^1\) sur \([a, b]\) pour tous \(0 \lt a \lt b\), donc sur \(]0, +\infty[\), avec</p>
    <div class="formula">$$I'(x) = -2x\int_0^{+\infty}\frac{1}{t^2}\exp\!\left(-t^2 - \frac{x^2}{t^2}\right)\mathrm{d}t.$$</div>
    <p><strong>Q3.</strong> Pour \(x \gt 0\), \(t = x/u\) est une bijection décroissante de classe \(\mathcal{C}^1\) de \(]0, +\infty[\) sur lui-même, \(\mathrm{d}t = -\frac{x}{u^2}\,\mathrm{d}u\), \(\frac{1}{t^2} = \frac{u^2}{x^2}\), et \(t^2 + \frac{x^2}{t^2} = \frac{x^2}{u^2} + u^2\). Les bornes s'échangent :</p>
    <div class="formula">$$\int_0^{+\infty}\frac{1}{t^2}\,\mathrm{e}^{-t^2 - x^2/t^2}\,\mathrm{d}t = \int_0^{+\infty}\frac{u^2}{x^2}\cdot\frac{x}{u^2}\,\mathrm{e}^{-u^2 - x^2/u^2}\,\mathrm{d}u = \frac{I(x)}{x}.$$</div>
    <p>Donc \(I'(x) = -2x \cdot \frac{I(x)}{x} = -2I(x)\).</p>
    <p><strong>Q4.</strong> Sur \(]0, +\infty[\), \(I(x) = C\,\mathrm{e}^{-2x}\). Par continuité de \(I\) en 0 (Q1), \(C = I(0) = \frac{\sqrt\pi}{2}\) : \(I(x) = \frac{\sqrt\pi}{2}\,\mathrm{e}^{-2x}\) pour tout \(x \ge 0\). Enfin \((t - \frac1t)^2 = t^2 - 2 + \frac{1}{t^2}\), donc \(\int_0^{+\infty}\mathrm{e}^{-(t - 1/t)^2}\,\mathrm{d}t = \mathrm{e}^2\,I(1) = \frac{\sqrt\pi}{2}\).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Transformée de Laplace, valeur initiale et valeur finale</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : intégrales à paramètre ; application à l'automatique des sciences industrielles).</div>
  <div class="statement">On note \(\mathcal{B}\) l'ensemble des fonctions \(f\) continues et bornées sur \([0, +\infty[\) ; pour \(f \in \mathcal{B}\), on fixe \(M \ge 0\) tel que \(|f(t)| \le M\) pour tout \(t \ge 0\). Pour \(p \gt 0\), on pose \(\mathcal{L}f(p) = \displaystyle\int_0^{+\infty} f(t)\,\mathrm{e}^{-pt}\,\mathrm{d}t\).</div>
  <p class="exo-part">Partie A — Régularité de la transformée</p>
  <div class="q"><strong>A1.</strong> Soit \(f \in \mathcal{B}\). Montrer que \(\mathcal{L}f(p)\) existe pour tout \(p \gt 0\) et que \(|\mathcal{L}f(p)| \le \frac{M}{p}\).</div>
  <div class="q"><strong>A2.</strong> Montrer que \(\mathcal{L}f\) est de classe \(\mathcal{C}^1\) sur \(]0, +\infty[\) et exprimer \((\mathcal{L}f)'(p)\).</div>
  <p class="exo-part">Partie B — Transformée des dérivées</p>
  <div class="q"><strong>B1.</strong> Soit \(f\) de classe \(\mathcal{C}^1\) sur \([0, +\infty[\), avec \(f\) et \(f'\) dans \(\mathcal{B}\). Montrer que \(\mathcal{L}(f')(p) = p\,\mathcal{L}f(p) - f(0)\).</div>
  <div class="q"><strong>B2.</strong> En déduire, si \(f\) est de classe \(\mathcal{C}^2\) avec \(f\), \(f'\), \(f''\) dans \(\mathcal{B}\) : \(\mathcal{L}(f'')(p) = p^2\,\mathcal{L}f(p) - p\,f(0) - f'(0)\).</div>
  <p class="exo-part">Partie C — Réponse indicielle d'un système du second ordre</p>
  <div class="q"><strong>C1.</strong> Soit \(\omega_0 \gt 0\). On admet qu'il existe une unique fonction \(y\) de classe \(\mathcal{C}^2\) sur \([0, +\infty[\) telle que \(y'' + 2\omega_0 y' + \omega_0^2 y = \omega_0^2\), \(y(0) = y'(0) = 0\) (système de gain 1, d'amortissement \(\xi = 1\), soumis à un échelon unité), et que \(y\), \(y'\), \(y''\) sont bornées. Montrer que \(Y = \mathcal{L}y\) vérifie \(Y(p) = \dfrac{\omega_0^2}{p\,(p + \omega_0)^2}\).</div>
  <div class="q"><strong>C2.</strong> Décomposer \(Y(p)\) en éléments simples. En utilisant \(\mathcal{L}(\mathrm{e}^{-\omega_0 t})(p) = \frac{1}{p + \omega_0}\) et \(\mathcal{L}(t\,\mathrm{e}^{-\omega_0 t})(p) = \frac{1}{(p+\omega_0)^2}\), et en admettant l'injectivité de \(\mathcal{L}\), en déduire \(y(t)\). Vérifier le résultat sur l'équation.</div>
  <div class="q"><strong>C3.</strong> Montrer que le temps de réponse à 5 %, \(t_5\), vérifie \((1 + \omega_0 t_5)\,\mathrm{e}^{-\omega_0 t_5} = 0{,}05\), et donner \(\omega_0 t_5\) à \(10^{-2}\) près (calcul numérique).</div>
  <p class="exo-part">Partie D — Théorèmes de la valeur finale et de la valeur initiale</p>
  <div class="q"><strong>D1.</strong> Soit \(f \in \mathcal{B}\). Montrer que, pour \(p \gt 0\), \(p\,\mathcal{L}f(p) = \displaystyle\int_0^{+\infty}\mathrm{e}^{-u} f\!\left(\frac up\right)\mathrm{d}u\).</div>
  <div class="q"><strong>D2.</strong> On suppose de plus que \(f(t) \to \ell\) quand \(t \to +\infty\). Pour \(p \in [0, 1]\) et \(u \gt 0\), on pose \(k(p, u) = \mathrm{e}^{-u} f(u/p)\) si \(p \gt 0\), et \(k(0, u) = \ell\,\mathrm{e}^{-u}\). À l'aide du théorème de continuité, montrer que \(p\,\mathcal{L}f(p) \to \ell\) quand \(p \to 0^+\).</div>
  <div class="q"><strong>D3.</strong> Montrer de même que \(p\,\mathcal{L}f(p) \to f(0)\) quand \(p \to +\infty\) (on pourra poser \(q = 1/p\)).</div>
  <div class="q"><strong>D4.</strong> Vérifier ces deux théorèmes sur la fonction \(y\) de la partie C.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(|f(t)\,\mathrm{e}^{-pt}| \le M\,\mathrm{e}^{-pt}\), intégrable sur \([0, +\infty[\) pour \(p \gt 0\) : l'intégrale converge absolument, et \(|\mathcal{L}f(p)| \le M\int_0^{+\infty}\mathrm{e}^{-pt}\,\mathrm{d}t = \frac{M}{p}\).</p>
    <p><strong>A2.</strong> Pour tout \(t\), \(p \mapsto f(t)\,\mathrm{e}^{-pt}\) est de classe \(\mathcal{C}^1\), de dérivée \(-t\,f(t)\,\mathrm{e}^{-pt}\) ; l'intégrabilité à \(p\) fixé est A1. Domination locale : soit \(a \gt 0\) ; pour \(p \ge a\), \(|t\,f(t)\,\mathrm{e}^{-pt}| \le M\,t\,\mathrm{e}^{-at}\), intégrable et indépendant de \(p\). Donc \(\mathcal{L}f\) est de classe \(\mathcal{C}^1\) sur \([a, +\infty[\) pour tout \(a \gt 0\), donc sur \(]0, +\infty[\), et \((\mathcal{L}f)'(p) = -\int_0^{+\infty}t\,f(t)\,\mathrm{e}^{-pt}\,\mathrm{d}t\). (Une domination globale sur \(]0, +\infty[\) est impossible en général : pour \(f = 1\), \((\mathcal{L}f)'(p) = -\frac{1}{p^2}\) n'est pas bornée près de 0.)</p>
    <p><strong>B1.</strong> On intègre par parties en dérivant \(\mathrm{e}^{-pt}\) : le crochet \(f(t)\,\mathrm{e}^{-pt}\) vaut \(f(0)\) en 0 et tend vers 0 en \(+\infty\) (car \(|f(t)\,\mathrm{e}^{-pt}| \le M\mathrm{e}^{-pt}\)), donc les deux intégrales sont de même nature, et</p>
    <div class="formula">$$\int_0^{+\infty}f'(t)\,\mathrm{e}^{-pt}\,\mathrm{d}t = \big[f(t)\,\mathrm{e}^{-pt}\big]_0^{+\infty} + p\int_0^{+\infty}f(t)\,\mathrm{e}^{-pt}\,\mathrm{d}t = p\,\mathcal{L}f(p) - f(0).$$</div>
    <p><strong>B2.</strong> On applique B1 à \(f'\), puis à \(f\) :</p>
    <div class="formula">$$\mathcal{L}(f'') = p\,\mathcal{L}(f') - f'(0) = p\big(p\,\mathcal{L}f - f(0)\big) - f'(0).$$</div>
    <p><strong>C1.</strong> Par linéarité de \(\mathcal{L}\) et B1, B2 avec \(y(0) = y'(0) = 0\) : \(p^2 Y + 2\omega_0\,p\,Y + \omega_0^2 Y = \omega_0^2\,\mathcal{L}(1)(p) = \frac{\omega_0^2}{p}\). Or \(p^2 + 2\omega_0 p + \omega_0^2 = (p + \omega_0)^2\), d'où \(Y(p) = \frac{\omega_0^2}{p\,(p+\omega_0)^2}\).</p>
    <p><strong>C2.</strong> On cherche \(Y(p) = \frac{\alpha}{p} + \frac{\beta}{p + \omega_0} + \frac{\delta}{(p+\omega_0)^2}\) : \(\alpha = 1\) (multiplier par \(p\), faire \(p = 0\)), \(\delta = -\omega_0\) (multiplier par \((p+\omega_0)^2\), faire \(p = -\omega_0\)), et \(\beta = -1\) (comportement en \(+\infty\) de \(pY(p)\) : \(\alpha + \beta = 0\)). Donc</p>
    <div class="formula">$$Y(p) = \frac1p - \frac{1}{p+\omega_0} - \frac{\omega_0}{(p+\omega_0)^2} = \mathcal{L}\Big(1 - \mathrm{e}^{-\omega_0 t} - \omega_0 t\,\mathrm{e}^{-\omega_0 t}\Big)(p),$$</div>
    <p>et l'injectivité donne \(y(t) = 1 - (1 + \omega_0 t)\,\mathrm{e}^{-\omega_0 t}\). Vérification : \(y'(t) = \omega_0^2\,t\,\mathrm{e}^{-\omega_0 t}\), \(y''(t) = \omega_0^2(1 - \omega_0 t)\,\mathrm{e}^{-\omega_0 t}\), et</p>
    <div class="formula">$$\begin{aligned} y'' + 2\omega_0 y' + \omega_0^2 y &= \omega_0^2\big[(1 - \omega_0 t) + 2\omega_0 t - (1 + \omega_0 t)\big]\mathrm{e}^{-\omega_0 t} + \omega_0^2 \\ &= \omega_0^2 \,; \end{aligned}$$</div>
    <p>de plus \(y(0) = y'(0) = 0\).</p>
    <p><strong>C3.</strong> \(y\) croît (\(y' \ge 0\)) vers 1 : \(t_5\) est l'instant à partir duquel \(1 - y(t) \le 0{,}05\), soit \((1 + \omega_0 t_5)\,\mathrm{e}^{-\omega_0 t_5} = 0{,}05\). La fonction \(u \mapsto (1+u)\mathrm{e}^{-u}\) décroît strictement sur \([0, +\infty[\) (dérivée \(-u\,\mathrm{e}^{-u}\)) de 1 à 0 : la solution est unique, et une dichotomie donne \(\omega_0 t_5 \approx 4{,}74\), la valeur lue sur l'abaque du temps de réponse pour \(\xi = 1\).</p>
    <p><strong>D1.</strong> Changement de variable linéaire \(u = pt\), \(\mathrm{d}t = \frac{\mathrm{d}u}{p}\) : \(\mathcal{L}f(p) = \frac1p\int_0^{+\infty}f\big(\frac up\big)\,\mathrm{e}^{-u}\,\mathrm{d}u\).</p>
    <p><strong>D2.</strong> Hypothèses du théorème de continuité sur \(A = [0, 1]\), \(I = \,]0, +\infty[\) : pour \(u \gt 0\) fixé, \(p \mapsto k(p, u)\) est continue sur \(]0, 1]\) (composée de fonctions continues), et en 0 car \(\frac up \to +\infty\) quand \(p \to 0^+\), donc \(k(p, u) = \mathrm{e}^{-u}f(u/p) \to \ell\,\mathrm{e}^{-u} = k(0, u)\) ; pour \(p\) fixé, \(u \mapsto k(p, u)\) est continue ; domination : \(|k(p, u)| \le M\,\mathrm{e}^{-u}\) (on a \(|\ell| \le M\) par passage à la limite), intégrable et indépendant de \(p\). Donc \(K(p) = \int_0^{+\infty}k(p, u)\,\mathrm{d}u\) est continue sur \([0, 1]\), et \(p\,\mathcal{L}f(p) = K(p) \to K(0) = \ell\int_0^{+\infty}\mathrm{e}^{-u}\,\mathrm{d}u = \ell\) quand \(p \to 0^+\).</p>
    <p><strong>D3.</strong> Pour \(q \in [0, 1]\) et \(u \gt 0\), on pose \(m(q, u) = \mathrm{e}^{-u}f(qu)\), continue en \(q\) (y compris en 0, \(f\) étant continue en 0) et dominée par \(M\,\mathrm{e}^{-u}\). La fonction \(q \mapsto \int_0^{+\infty}m(q, u)\,\mathrm{d}u\) est continue sur \([0, 1]\) ; elle vaut \(p\,\mathcal{L}f(p)\) pour \(q = 1/p\) (D1), et \(f(0)\) pour \(q = 0\). Donc \(p\,\mathcal{L}f(p) \to f(0)\) quand \(p \to +\infty\).</p>
    <p><strong>D4.</strong> \(p\,Y(p) = \frac{\omega_0^2}{(p+\omega_0)^2}\) tend vers 1 quand \(p \to 0^+\) : c'est bien \(\lim_{+\infty} y = 1\) (valeur finale, pas d'erreur statique) ; et vers 0 quand \(p \to +\infty\) : c'est \(y(0) = 0\) (valeur initiale). En automatique, ces deux théorèmes permettent de lire le comportement d'un système directement sur sa fonction de transfert.</p>
  </div>
</div>
