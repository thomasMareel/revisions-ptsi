<div class="course-section">
  <div class="sec-num">§1 · DIVISER UNE ONDE POUR LA FAIRE INTERFÉRER</div>
  <h2>Division du front d'onde, division d'amplitude</h2>
  <div class="intro">Deux sources distinctes sont toujours incohérentes : pour observer des interférences lumineuses, on fabrique deux ondes (ou plus) à partir de l'onde émise par <strong>un même point source</strong>, puis on les fait se superposer. Il existe deux grandes manières de « dédoubler » une onde, et elles n'ont pas les mêmes exigences sur la source.</div>

  <p>Les notions de base (éclairement, formule de Fresnel, ordre d'interférence \(p = \delta/\lambda_0\), contraste, trains d'onde) sont établies dans le chapitre « Ondes lumineuses et interférences ». Ici, on les applique aux dispositifs réels. Notations : \(\lambda_0\) longueur d'onde dans le vide, \(n\) indice du milieu (air : \(n \approx 1\)), \(\delta\) différence de marche, \(\mathcal{E}\) éclairement.</p>

  <h3>Les deux familles de diviseurs d'onde</h3>
  <div class="def-box">
    <strong>Division du front d'onde.</strong> On prélève deux portions <strong>distinctes</strong> d'une même surface d'onde (deux trous, deux fentes, \(N\) fentes…) : les ondes qui interfèrent en un point \(M\) suivent deux rayons <strong>différents</strong> issus de la source. Exemples : trous et fentes d'Young, réseau, miroirs de Fresnel.<br><br>
    <strong>Division d'amplitude.</strong> Une surface partiellement réfléchissante partage <strong>chaque rayon</strong> incident en un rayon réfléchi et un rayon transmis, qui se recombinent après des trajets différents : l'énergie du rayon est partagée, pas sa position. Exemples : interféromètre de Michelson, lame mince (bulle de savon, couche antireflet).
  </div>

  <h3>Localisation des franges</h3>
  <div class="def-box">
    Avec une <strong>source ponctuelle</strong>, les franges existent dans toute la zone où les deux ondes se superposent : elles sont <strong>non localisées</strong> (un écran placé n'importe où dans cette zone les montre).<br>
    Avec une <strong>source étendue</strong>, les figures données par les différents points de la source se brouillent presque partout ; il ne subsiste des franges contrastées que sur une surface particulière, dite <strong>surface de localisation</strong> : les franges sont <strong>localisées</strong>. Seule la division d'amplitude permet ce cas : la surface de localisation est le lieu où se recoupent les deux rayons issus d'<strong>un même rayon incident</strong>.
  </div>

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0">
    <tr style="border-bottom:2px solid var(--grid)"><th style="text-align:left;padding:.35rem">Dispositif</th><th style="text-align:left;padding:.35rem">Division</th><th style="text-align:left;padding:.35rem">Source adaptée</th><th style="text-align:left;padding:.35rem">Où regarder les franges</th></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Trous / fentes d'Young</td><td style="padding:.35rem">front d'onde</td><td style="padding:.35rem">ponctuelle (ou fente parallèle aux fentes)</td><td style="padding:.35rem">partout (écran éloigné ou plan focal d'une lentille)</td></tr>

  </table></div>

  <div class="notice"><strong>Rôle de la diffraction.</strong> Un trou de quelques longueurs d'onde de diamètre ne découpe pas un mince pinceau de lumière : il se comporte comme une source secondaire qui arrose tout un cône. Sans cet étalement, les faisceaux issus de deux trous voisins resteraient séparés et ne se croiseraient jamais : la diffraction est la condition même des interférences d'Young.</div>

  <div class="sec-num">§2 · TROUS ET FENTES D'YOUNG</div>
  <h2>Deux sources secondaires cohérentes</h2>
  <div class="intro">Un écran opaque percé de deux petits trous \(S_1\) et \(S_2\), distants de \(a\), est éclairé par une source ponctuelle monochromatique \(S\) placée sur la médiatrice de \(S_1S_2\) (ou par une onde plane en incidence normale). Les deux trous diffractent et se comportent comme deux sources ponctuelles <strong>en phase</strong> et <strong>mutuellement cohérentes</strong>.</div>

  <h3>Différence de marche sur un écran éloigné</h3>
  <p>On prend \(S_1\) en \(x = +a/2\) et \(S_2\) en \(x = -a/2\), l'écran à la distance \(D\) du plan des trous, et \(M(x,y)\) sur l'écran. Alors \(S_2M^2 - S_1M^2 = (x+a/2)^2 - (x-a/2)^2 = 2ax\), donc \(S_2M - S_1M = \dfrac{2ax}{S_1M + S_2M}\). Pour \(D \gg a, |x|, |y|\), le dénominateur vaut \(2D\) au premier ordre :</p>
  <div class="formula">$$\delta(M) = n\,(S_2M - S_1M) \approx \frac{n\,a\,x}{D}$$</div>
  <div class="prop-box">
    <strong>Figure d'Young (deux ondes de même éclairement \(\mathcal{E}_0\)).</strong>
    $$\mathcal{E}(M) = 2\mathcal{E}_0\left[1 + \cos\left(\frac{2\pi\,n\,a\,x}{\lambda_0\,D}\right)\right]$$
    Les franges (\(\delta\) constant, donc \(x\) constant) sont des <strong>droites perpendiculaires à \(S_1S_2\)</strong>, équidistantes, de contraste 1. La frange centrale (\(x = 0\), \(p = 0\)) est brillante. L'<strong>interfrange</strong> correspond à \(\Delta p = 1\) :
    $$i = \frac{\lambda_0\,D}{n\,a} = \frac{\lambda\,D}{a}\qquad(\lambda = \lambda_0/n)$$
  </div>
  <p><strong>Ordre de grandeur :</strong> \(a = 0{,}5\ \text{mm}\), \(D = 1\ \text{m}\), \(\lambda_0 = 600\ \text{nm}\) donnent \(i = 1{,}2\ \text{mm}\). Il faut \(a\) petit (inférieur au millimètre) et \(D\) grand pour que les franges soient visibles à l'œil.</p>

<figcaption>Trous d'Young éclairés en lumière monochromatique : franges rectilignes équidistantes, perpendiculaires à la droite qui joint les trous (en haut, vue de l'écran) ; en bas, éclairement le long de l'écran. Deux franges brillantes consécutives sont séparées de l'interfrange i = λ₀D/a.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — mesurer une longueur d'onde avec des trous d'Young</strong>
    <p>Trous distants de \(a = 0{,}50\ \text{mm}\), écran à \(D = 1{,}00\ \text{m}\), dans l'air. On mesure 12,6 mm pour dix interfranges.</p>
    <ol>
      <li>Mesurer plusieurs interfranges réduit l'incertitude relative : \(i = 1{,}26\ \text{mm}\).</li>
      <li>\(\lambda_0 = \dfrac{a\,i}{D} = \dfrac{0{,}50\times10^{-3}\times1{,}26\times10^{-3}}{1{,}00} = 630\ \text{nm}\) : lumière rouge (laser hélium-néon, 633 nm).</li>
      <li>Ordre au bord d'un écran de 3 cm centré : \(p = \dfrac{a\,x}{\lambda_0 D} = \dfrac{0{,}50\times10^{-3}\times0{,}015}{630\times10^{-9}} \approx 12\) : environ 24 franges brillantes visibles.</li>
    </ol>
  </div>

  <h3>Observation à l'infini dans le plan focal d'une lentille</h3>
  <p>On place une lentille convergente de focale \(f'\) derrière les trous et l'écran dans son plan focal image. Les rayons qui convergent en \(M\) sont ceux qui émergent des trous parallèlement, avec l'inclinaison \(\theta\) sur l'axe. D'après le théorème de Malus (et le retour inverse de la lumière), le plan perpendiculaire à ces rayons passant par \(S_1\) est une surface d'onde de l'onde qui converge en \(M\) : les chemins optiques sont égaux à partir de ce plan, et la différence de marche se lit avant la lentille :</p>
  <div class="formula">$$\delta = n\,a\sin\theta \approx \frac{n\,a\,x}{f'}$$</div>
  <p>car \(x = f'\tan\theta \approx f'\theta\) pour \(\theta\) petit. Les formules de l'écran éloigné restent donc valables en lisant \(f'\) à la place de \(D\) : \(i = \lambda_0 f'/(na)\). C'est le montage le plus commode en TP (figure nette et bien lumineuse à distance raisonnable).</p>

  <h3>Champ d'interférence</h3>
  <p>Un trou de diamètre \(b\) diffracte la lumière dans un cône de demi-angle de l'ordre de \(\lambda/b\). Les franges n'existent que là où les deux cônes se recouvrent, soit une zone de largeur \(L \approx 2\lambda D/b\) sur l'écran (ou \(2\lambda f'/b\) dans le plan focal). Le nombre de franges visibles est donc de l'ordre de</p>
  <div class="formula">$$\frac{L}{i} \approx \frac{2a}{b}$$</div>
  <p>Pour en voir beaucoup, il faut des trous très petits devant leur écartement ; en pratique, on en compte rarement plus de quelques dizaines.</p>

  <h3>Des trous aux fentes</h3>
  <p>La différence de marche \(n a x/D\) ne dépend pas de \(y\). On peut donc remplacer les trous par deux <strong>fentes fines parallèles</strong> (perpendiculaires à \(S_1S_2\)), éclairées par une <strong>fente source parallèle</strong> : chaque tranche de fente donne la même figure, les figures s'ajoutent sans se brouiller (voir §8) et la luminosité est bien meilleure. Les franges sont parallèles aux fentes.</p>

  <h3>Lame à faces parallèles sur un des trajets</h3>
  <div class="prop-box">
    On place devant \(S_1\) une lame d'épaisseur \(e\) et d'indice \(n_\ell\), traversée sous incidence quasi normale (milieu ambiant : air). Le chemin optique \((S_1M)\) augmente de \((n_\ell - 1)\,e\) :
    $$\delta'(M) = \frac{a\,x}{D} - (n_\ell - 1)\,e$$
    Toute la figure est <strong>translatée, sans changement d'interfrange</strong>, vers le côté de la lame. La frange d'ordre 0 passe en \(x_0 = (n_\ell - 1)\,e\,D/a\), soit un décalage de \((n_\ell - 1)\,e/\lambda_0\) interfranges.
  </div>
  <div class="notice">En lumière monochromatique, toutes les franges brillantes se ressemblent : on ne voit que la partie fractionnaire du décalage. Pour repérer la frange d'ordre 0, on éclaire brièvement en <strong>lumière blanche</strong> : elle seule est achromatique (§7). La dispersion de la lame est négligée ici.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Fentes distantes de \(a = 1{,}0\ \text{mm}\), écran à \(D = 1{,}2\ \text{m}\), \(\lambda_0 = 550\ \text{nm}\). Un film d'indice \(1{,}50\) et d'épaisseur \(6{,}0\ \mu\text{m}\) recouvre une fente. Décalage de la figure ?</span>
    <div class="content"><p>\(i = \lambda_0 D/a = 0{,}66\ \text{mm}\). \(x_0 = (n_\ell - 1)eD/a\), soit \(x_0 = 0{,}50\times6{,}0\times10^{-6}\times1{,}2/10^{-3}\) \(= 3{,}6\ \text{mm}\), soit \(x_0/i = (n_\ell-1)e/\lambda_0 \approx 5{,}5\) interfranges, du côté de la fente couverte.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LE RÉSEAU</div>
  <h2>N fentes équidistantes : un disperseur de lumière</h2>
  <div class="intro">Un réseau plan est une suite de \(N\) fentes fines, parallèles et équidistantes (de l'ordre de \(10^3\) à \(10^4\) fentes éclairées). C'est un diviseur du front d'onde à \(N\) ondes : il donne des maxima de lumière très fins dans des directions qui dépendent de la longueur d'onde.</div>

  <div class="def-box">
    <strong>Pas du réseau.</strong> La distance \(a\) entre deux fentes consécutives est le <strong>pas</strong> ; on indique souvent le nombre de traits par millimètre \(n_t = 1/a\) (de 100 à 1200 traits/mm environ, soit \(a\) de \(10\ \mu\text{m}\) à \(0{,}8\ \mu\text{m}\)).
  </div>

  <h3>Formule des réseaux</h3>
  <p>Le réseau, utilisé en transmission, reçoit une onde plane sous l'incidence \(\theta_i\) ; on observe à l'infini dans la direction \(\theta\) (angles orientés par rapport à la normale, dans le même sens). Entre les ondes issues de deux fentes consécutives, la différence de marche cumule un terme à l'arrivée et un terme au départ :</p>
  <div class="formula">$$\delta = n\,a\,(\sin\theta - \sin\theta_i)$$</div>
  <p>Toutes les ondes successives présentent le même déphasage \(\psi = 2\pi\delta/\lambda_0\). L'éclairement de \(N\) ondes (chapitre « Ondes lumineuses et interférences ») présente des pics principaux de hauteur \(N^2\mathcal{E}_0\) et de largeur en \(1/N\) lorsque toutes les ondes sont en phase, et il est quasi nul ailleurs.</p>
  <div class="prop-box">
    <strong>Formule des réseaux</strong> (dans l'air) : la lumière n'est renvoyée que dans les directions \(\theta_p\) telles que
    $$a\,(\sin\theta_p - \sin\theta_i) = p\,\lambda_0,\qquad p\in\mathbb{Z}\ \text{(ordre)}$$
    <ul style="margin:.4rem 0">
      <li><strong>Ordre 0</strong> : \(\theta_0 = \theta_i\) pour toutes les longueurs d'onde (lumière non dispersée, image blanche en lumière blanche).</li>
      <li><strong>Ordres \(p \neq 0\)</strong> : la direction dépend de \(\lambda_0\) ; le réseau étale le spectre. Le <strong>rouge est plus dévié que le bleu</strong> (contrairement au prisme).</li>
      <li><strong>Nombre d'ordres</strong> : \(|\sin\theta_p| \le 1\) limite \(|p|\) ; en incidence normale, \(|p| \le a/\lambda_0\).</li>
    </ul>
  </div>

  <h3>Dispersion et recouvrement des ordres</h3>
  <p>À \(\theta_i\) fixé, en différentiant la formule : \(a\cos\theta\,\mathrm{d}\theta = p\,\mathrm{d}\lambda_0\).</p>
  <div class="formula">$$\frac{\mathrm{d}\theta}{\mathrm{d}\lambda_0} = \frac{p}{a\cos\theta}$$</div>
  <p>La dispersion angulaire augmente avec l'ordre et avec le nombre de traits par millimètre. Mais les spectres d'ordres élevés se chevauchent : en incidence normale, le visible (de 400 à 750 nm) occupe \(\sin\theta \in [400p,\ 750p]\ \text{nm}/a\). Les ordres 1 et 2 sont séparés (\(750 \lt 2\times400\)), alors que les ordres 2 et 3 se recouvrent (\(2\times750 \gt 3\times400\)). C'est pourquoi on travaille souvent dans l'ordre 1 ou 2.</p>

  <h3>Minimum de déviation</h3>
  <p>La déviation est \(D = \theta - \theta_i\) (rien à voir avec la distance \(D\) d'un écran). À \(p\) fixé, quand on fait tourner le réseau, \(D\) passe par un minimum : \(\mathrm{d}D = 0\) impose \(\mathrm{d}\theta = \mathrm{d}\theta_i\), et la formule différentiée \(\cos\theta\,\mathrm{d}\theta = \cos\theta_i\,\mathrm{d}\theta_i\) donne \(\cos\theta = \cos\theta_i\), donc \(\theta = -\theta_i\) (position symétrique).</p>
  <div class="formula">$$2\,a\,\sin\frac{D_m}{2} = p\,\lambda_0$$</div>
  <p>Intérêt expérimental : le minimum se repère facilement (la raie s'arrête puis rebrousse chemin quand on tourne la plate-forme) et la mesure ne dépend pas d'un repérage précis de la normale au réseau.</p>

  <h3>Spectrométrie à réseau</h3>
  <p>Dans un <strong>goniomètre</strong>, un collimateur (fente source au foyer objet d'une lentille) éclaire le réseau en onde plane, et une lunette réglée à l'infini vise la direction \(\theta\). Démarche type : (1) <strong>étalonnage</strong> avec une raie connue (lampe à vapeur de mercure) pour obtenir le pas \(a\), ou une courbe \(\theta(\lambda_0)\) ; (2) <strong>mesure</strong> de l'angle de la raie inconnue et lecture de \(\lambda_0\).</p>
  <div class="notice"><strong>Résolution (complément).</strong> Plus \(N\) est grand, plus les pics sont fins : deux raies voisines sont séparées si l'écart de leurs directions dépasse la demi-largeur d'un pic, ce qui conduit au pouvoir de résolution \(\lambda_0/\Delta\lambda_{min} = |p|\,N\). Ouvrir davantage la fente source rend le spectre plus lumineux mais élargit l'image de chaque raie : il faut choisir.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · L'INTERFÉROMÈTRE DE MICHELSON</div>
  <h2>Un diviseur d'amplitude à deux bras</h2>
  <div class="intro">Le Michelson sépare chaque rayon incident en deux grâce à une lame semi-réfléchissante, envoie les deux rayons sur deux miroirs, puis les recombine. En déplaçant ou en inclinant un miroir, on règle la différence de marche avec une précision bien inférieure au micromètre.</div>

  <h3>Les organes de l'appareil</h3>
  <ul>
    <li><strong>Séparatrice</strong> : lame de verre dont une face porte un dépôt semi-réfléchissant, inclinée à 45° ; elle partage chaque rayon en deux rayons d'éclairements voisins (bon contraste), puis les recombine.</li>
    <li><strong>Compensatrice</strong> : lame identique (même verre, même épaisseur) sans dépôt, parallèle à la séparatrice. Sans elle, un des rayons traverserait trois fois l'épaisseur de verre et l'autre une seule fois : la différence de marche dépendrait de l'incidence et de la longueur d'onde (dispersion du verre). Avec elle, <strong>les deux rayons traversent la même épaisseur de verre</strong> et \(\delta\) ne dépend que des trajets dans l'air. Indispensable en lumière blanche.</li>
    <li><strong>Miroirs \(M_1\) et \(M_2\)</strong> : orientables par des vis (réglages grossier et fin) ; l'un est monté sur un <strong>chariot</strong> translaté par une vis micrométrique (lecture au micromètre, course de l'ordre du centimètre).</li>
  </ul>

  <h3>Montage équivalent</h3>
  <div class="def-box">
    On remplace l'ensemble « séparatrice + miroir \(M_2\) » par <strong>\(M_2'\), image de \(M_2\) par la séparatrice</strong> (supposée infiniment mince). Tout se passe comme si la lumière se réfléchissait sur deux miroirs \(M_1\) et \(M_2'\), placés l'un derrière l'autre : l'interféromètre est équivalent à une <strong>lame d'air</strong> comprise entre \(M_1\) et \(M_2'\), dont les deux faces seraient réfléchissantes.
  </div>
  <div class="prop-box">
    <strong>Trois configurations.</strong>
    <ul style="margin:.4rem 0">
      <li><strong>Contact optique</strong> : \(M_2'\) coïncide avec \(M_1\). Les deux chemins ont la même longueur quelle que soit la direction du rayon, donc \(\delta = 0\) partout : le champ est éclairé uniformément, on parle de <strong>teinte plate</strong>.</li>
      <li><strong>Lame d'air</strong> : \(M_2'\) est parallèle à \(M_1\), décalé de \(e\) ; sur l'appareil réel, cela revient à des miroirs rigoureusement perpendiculaires (§5).</li>
      <li><strong>Coin d'air</strong> : \(M_2'\) est légèrement incliné sur \(M_1\), d'un angle \(\alpha\) (§6).</li>
    </ul>
  </div>
  <p>Dans les calculs, la séparatrice est traitée comme idéale : elle n'ajoute aucun déphasage entre les deux voies (son effet réel sur la frange \(\delta = 0\) est évoqué au §7).</p>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MICHELSON EN LAME D'AIR</div>
  <h2>Anneaux d'égale inclinaison, localisés à l'infini</h2>
  <div class="intro">Les miroirs \(M_1\) et \(M_2'\) sont parallèles et distants de \(e\). Chaque rayon incident, d'inclinaison \(\theta\) sur la normale aux miroirs, donne deux rayons émergents parallèles entre eux : ils interfèrent à l'infini, avec une différence de marche qui ne dépend que de \(\theta\).</div>

  <h3>Différence de marche</h3>
  <p>Méthode des sources images : pour un point source \(S\), les deux ondes émergentes semblent provenir de \(S_1\), image de \(S\) par \(M_1\), et de \(S_2\), image de \(S\) par \(M_2'\). Ces deux images sont alignées sur la normale aux miroirs et distantes de \(S_1S_2 = 2e\). Observées à l'infini dans la direction \(\theta\), elles présentent une différence de marche égale à la projection de \(\overrightarrow{S_2S_1}\) sur cette direction :</p>

  <figure class="schema" style="max-width:360px">

  <div class="formula">$$\delta = 2\,n\,e\cos\theta \approx 2\,e\cos\theta$$</div>
  <p>On retrouve ce résultat par un calcul direct de chemins optiques sur la lame d'air (aller-retour \(2e/\cos\theta\) moins la projection \(2e\tan\theta\sin\theta\)). Le résultat ne dépend <strong>pas</strong> de la position du point \(S\) dans la source : c'est ce qui rend possible l'usage d'une source étendue (§8).</p>

  <h3>Anneaux dans le plan focal d'une lentille</h3>
  <p>Les rayons de même inclinaison \(\theta\) convergent, dans le plan focal image d'une lentille de focale \(f'\) (axe normal aux miroirs), sur un cercle de rayon \(R = f'\tan\theta \approx f'\theta\). Comme \(\delta\) ne dépend que de \(\theta\), les franges sont des <strong>anneaux concentriques</strong>, dits <strong>d'égale inclinaison</strong>, <strong>localisés à l'infini</strong>.</p>
  <div class="prop-box">
    <strong>Ordre d'interférence.</strong> \(p(\theta) = \dfrac{2e\cos\theta}{\lambda_0}\) est <strong>maximal au centre</strong>, où il vaut \(p_0 = \dfrac{2e}{\lambda_0}\), et décroît vers l'extérieur. Pour \(\theta\) petit, \(p \approx p_0\left(1 - \dfrac{\theta^2}{2}\right)\).<br><br>
    <strong>Rayons des anneaux brillants.</strong> On écrit \(p_0 = k_0 + \varepsilon\) (\(k_0\) entier, \(0 \le \varepsilon \lt 1\)). Le \(k\)-ième anneau brillant compté depuis le centre a l'ordre \(k_0 - (k-1)\), d'où
    $$R_k \approx f'\sqrt{\frac{(k - 1 + \varepsilon)\,\lambda_0}{e}}$$
    Si le centre est brillant (\(\varepsilon = 0\), on ne compte pas le centre) : \(R_k = f'\sqrt{k\lambda_0/e}\).
  </div>
  <ul>
    <li><strong>Loin du centre, les anneaux se serrent</strong> : \(R_k^2\) augmente de la même quantité \(f'^2\lambda_0/e\) d'un anneau au suivant, donc l'écart entre deux rayons successifs diminue quand \(k\) croît.</li>
    <li><strong>Lame épaisse, anneaux fins</strong> : à \(k\) donné, \(R_k\) est proportionnel à \(1/\sqrt{e}\) ; le champ en contient d'autant plus que \(e\) est grand.</li>
    <li><strong>Numéro et ordre</strong> : \(k\) compte les anneaux depuis le centre (1, 2, 3…), alors que l'ordre \(p\) vaut plusieurs milliers et perd une unité d'un anneau brillant au suivant, vers l'extérieur.</li>
  </ul>

  <h3>Évolution quand on translate le miroir</h3>
  <div class="prop-box">
    Quand \(e\) diminue, \(p_0\) diminue : chaque anneau (ordre fixé) voit son \(\cos\theta\) augmenter, donc son rayon diminuer. Les anneaux <strong>rentrent vers le centre</strong> et y disparaissent, <strong>un anneau par diminution de \(\lambda_0/2\)</strong> de l'épaisseur ; ils deviennent aussi plus larges et moins nombreux. Au contact optique (\(e = 0\)), le champ est uniforme. Quand \(e\) augmente, les anneaux naissent au centre et s'en éloignent.
  </div>
  <p>Compter les \(N\) anneaux qui disparaissent (ou naissent) au centre pendant une translation \(d\) du miroir donne \(N = 2d/\lambda_0\) : mesure d'une longueur d'onde, ou d'un déplacement à \(\lambda_0/2\) près.</p>
  <p><strong>Ordre de grandeur :</strong> \(e = 1{,}0\ \text{mm}\), \(\lambda_0 = 546\ \text{nm}\) : \(p_0 \approx 3\,660\) ; avec \(f' = 1\ \text{m}\) et un centre brillant, \(R_1 \approx 23\ \text{mm}\).</p>
  <div class="notice">Pour voir beaucoup d'anneaux, il faut éclairer les miroirs sous des incidences variées : on fait <strong>converger</strong> la lumière de la source étendue sur les miroirs (condenseur). L'écran est placé dans le plan focal de la lentille de projection (grande focale, pour de grands anneaux).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MICHELSON EN COIN D'AIR</div>
  <h2>Franges d'égale épaisseur, localisées sur les miroirs</h2>
  <div class="intro">On incline légèrement un miroir : \(M_1\) et \(M_2'\) forment un coin d'air d'angle \(\alpha\) très petit (de l'ordre de \(10^{-4}\ \text{rad}\)). On éclaire sous incidence quasi normale par un faisceau quasi parallèle.</div>

  <figure class="schema" style="max-width:360px">

  <h3>Différence de marche et franges</h3>
  <p>À la distance \(x\) de l'arête, l'épaisseur locale vaut \(e(x) \approx \alpha x\). Les deux rayons issus d'un même rayon incident se recoupent pratiquement sur les miroirs ; sous incidence quasi normale (\(\cos\theta \approx 1\)) :</p>
  <div class="formula">$$\delta(x) \approx 2\,e(x) = 2\,\alpha\,x$$</div>
  <div class="prop-box">
    <strong>Franges d'égale épaisseur.</strong> Chaque frange est le lieu des points d'épaisseur donnée. Pour un coin plan, ce sont des <strong>droites parallèles à l'arête</strong>, équidistantes, d'interfrange (mesuré sur les miroirs)
    $$i = \frac{\lambda_0}{2\alpha}$$
    Elles sont <strong>localisées au voisinage des miroirs</strong>. Passer d'une frange brillante à la suivante, c'est gagner ou perdre \(\lambda_0/2\) d'épaisseur d'air : la figure dessine directement la forme de l'écart entre \(M_1\) et \(M_2'\), avec un pas de \(\lambda_0/2\).
  </div>

  <h3>Observation et exploitation</h3>
  <ul>
    <li>On <strong>projette les miroirs</strong> sur l'écran avec une lentille convergente (écran conjugué des miroirs) : l'interfrange observé vaut \(|\gamma|\,i\), où \(\gamma\) est le grandissement.</li>
    <li>Diminuer \(\alpha\) élargit les franges ; à la limite \(\alpha = 0\) (et \(e = 0\)) on obtient la teinte plate.</li>
    <li>Si un miroir n'est pas plan, les franges se courbent : une flèche d'une fraction \(f\) d'interfrange révèle un relief \(f\,\lambda_0/2\). On détecte ainsi des défauts de quelques dizaines de nanomètres (contrôle de planéité).</li>
    <li>Une figure monochromatique est ambiguë : rien ne distingue une frange brillante de sa voisine, si bien qu'on ignore l'épaisseur absolue et le côté où elle croît. Deux remèdes : éclairer brièvement en lumière blanche (la frange d'épaisseur nulle, seule achromatique, sert d'origine), ou translater légèrement le miroir mobile en observant le sens de défilement des franges.</li>
  </ul>
  <p><strong>Ordre de grandeur :</strong> \(\alpha = 2\times10^{-4}\ \text{rad}\), \(\lambda_0 = 546\ \text{nm}\) : \(i \approx 1{,}4\ \text{mm}\) sur les miroirs, soit une vingtaine de franges sur un miroir de 3 cm de diamètre.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · COHÉRENCE TEMPORELLE</div>
  <h2>Sources non monochromatiques : brouillage, teintes, doublets</h2>
  <div class="intro">Une source réelle émet un spectre de largeur \(\Delta\lambda\) autour de \(\lambda_m\). Deux composantes de fréquences différentes n'interfèrent pas : chacune donne sa propre figure et les éclairements s'ajoutent. Comme l'ordre \(p = \delta/\lambda_0\) dépend de \(\lambda_0\), les figures finissent par se décaler et se brouiller quand \(\delta\) augmente.</div>

  <h3>Critère de visibilité</h3>
  <p>À \(\delta\) fixé, \(|\mathrm{d}p| = |\delta|\,\mathrm{d}\lambda_0/\lambda_0^2\). D'un bord à l'autre du spectre, l'ordre varie de \(\Delta p \approx |\delta|\,\Delta\lambda/\lambda_m^2\). Quand cet écart atteint 1, les composantes du spectre couvrent toutes les positions possibles d'une frange et la figure se moyenne. On retient donc, comme critère d'ordre de grandeur, \(\Delta p \lesssim 1\) d'un bord à l'autre (c'est-à-dire \(1/2\) entre le centre et un bord) :</p>
  <div class="formula">$$|\delta| \lesssim L_c = \frac{\lambda_m^2}{\Delta\lambda}$$</div>
  <p>On retrouve la longueur de cohérence temporelle (longueur des trains d'onde). Dans un Michelson en lame d'air, \(\delta \le 2e\) : les anneaux ne sont visibles que pour \(2e \lesssim L_c\).</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0">
    <tr style="border-bottom:2px solid var(--grid)"><th style="text-align:left;padding:.35rem">Source</th><th style="text-align:left;padding:.35rem">\(L_c\)</th><th style="text-align:left;padding:.35rem">Conséquence au Michelson</th></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Lumière blanche</td><td style="padding:.35rem">\(\approx 1\ \mu\text{m}\)</td><td style="padding:.35rem">franges colorées à moins d'un micromètre du contact optique</td></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Lampe spectrale (raie isolée)</td><td style="padding:.35rem">du mm à quelques cm</td><td style="padding:.35rem">anneaux visibles jusqu'à \(e\) de quelques mm</td></tr>
    <tr><td style="padding:.35rem">Laser He-Ne</td><td style="padding:.35rem">de 20 cm à bien plus</td><td style="padding:.35rem">jamais limitant sur la course du chariot</td></tr>
  </table></div>

  <h3>Lumière blanche : teintes de Newton et blanc d'ordre supérieur</h3>
  <ul>
    <li><strong>\(\delta = 0\)</strong> : toutes les longueurs d'onde sont dans le même état d'interférence : frange <strong>achromatique</strong> (blanche, ou noire si la séparatrice ajoute un déphasage \(\pi\)).</li>
    <li><strong>\(\delta\) de l'ordre de quelques centaines de nm</strong> : une seule longueur d'onde visible, ou deux, est éteinte (\(\delta = (k + \tfrac12)\lambda_0\)) ; l'œil perçoit une couleur vive, voisine de la complémentaire de la couleur éteinte : ce sont les <strong>teintes de Newton</strong>. Elles changent très vite avec \(\delta\).</li>
    <li><strong>\(\delta\) au-delà de quelques \(\mu\text{m}\)</strong> : de nombreuses longueurs d'onde, réparties sur tout le visible, sont éteintes. Privé de bandes étroites régulièrement espacées d'un bout à l'autre du visible, le spectre reste globalement équilibré et la lumière paraît de nouveau blanche : c'est le <strong>blanc d'ordre supérieur</strong>.</li>
  </ul>
  <div class="prop-box">
    <strong>Spectre cannelé.</strong> Analysée au spectroscope, la lumière d'un blanc d'ordre supérieur présente des raies sombres (<strong>cannelures</strong>) aux longueurs d'onde
    $$\lambda_k = \frac{\delta}{k + \frac12},\qquad k\in\mathbb{N}$$
    Entre deux cannelures \(\lambda_a \gt \lambda_b\) séparées de \(N\) intervalles : \(\delta\left(\dfrac{1}{\lambda_b} - \dfrac{1}{\lambda_a}\right) = N\), d'où \(\delta = \dfrac{N\,\lambda_a\lambda_b}{\lambda_a - \lambda_b}\). Le nombre de cannelures dans le visible croît proportionnellement à \(\delta\).
  </div>

  <h3>Source à deux raies : le doublet</h3>
  <p>Deux raies de même intensité, de longueurs d'onde \(\lambda_1\) et \(\lambda_2 = \lambda_1 + \Delta\lambda\) (avec \(\Delta\lambda \ll \lambda_m\)), sont incohérentes entre elles. En notant \(\sigma = 1/\lambda_0\) le nombre d'onde, la somme des deux figures de Fresnel se factorise :</p>
  <div class="formula">$$\mathcal{E} = 4\mathcal{E}_0\big[1 + \cos(\pi\Delta\sigma\,\delta)\cos(2\pi\sigma_m\delta)\big]$$</div>
  <p>avec \(\sigma_m = (\sigma_1 + \sigma_2)/2\) et \(\Delta\sigma = |\sigma_1 - \sigma_2| \approx \Delta\lambda/\lambda_m^2\).</p>
  <div class="prop-box">
    Le terme rapide \(\cos(2\pi\sigma_m\delta)\) donne les franges ; le terme lent fixe le <strong>contraste</strong>
    $$\Gamma(\delta) = \left|\cos\frac{\pi\,\delta\,\Delta\lambda}{\lambda_m^2}\right|$$
    Il s'annule (<strong>anticoïncidences</strong> : les franges brillantes d'une raie tombent sur les franges sombres de l'autre) pour \(\delta = (k + \tfrac12)\,\lambda_m^2/\Delta\lambda\). Au centre d'un Michelson en lame d'air (\(\delta = 2e\)), deux anticoïncidences successives sont séparées d'une translation
    $$\Delta e = \frac{\lambda_m^2}{2\,\Delta\lambda}$$
  </div>
  <p><strong>Ordre de grandeur :</strong> doublet jaune du sodium, \(\lambda_m = 589{,}3\ \text{nm}\), \(\Delta\lambda = 0{,}60\ \text{nm}\) : \(\Delta e \approx 0{,}29\ \text{mm}\). Mesurer \(\Delta e\) au vernier du chariot donne \(\Delta\lambda\).</p>

<line x1="60" y1="180" x2="592" y2="180" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>

    <span class="prompt">Raie de profil rectangulaire : retrouver le critère \(|\delta| \lesssim L_c\) par un calcul exact.</span>
    <div class="content">
      <p>On suppose la densité spectrale uniforme sur \([\sigma_m - \Delta\sigma/2,\ \sigma_m + \Delta\sigma/2]\). Chaque tranche \(\mathrm{d}\sigma\) donne \(\mathrm{d}\mathcal{E} \propto [1 + \cos(2\pi\sigma\delta)]\,\mathrm{d}\sigma\). L'intégration donne :</p>
      <div class="formula">$$\mathcal{E}(\delta) \propto 1 + \operatorname{sinc}(\pi\Delta\sigma\,\delta)\cos(2\pi\sigma_m\delta)$$</div>
      <p>où \(\operatorname{sinc}u = \dfrac{\sin u}{u}\).</p>
      <p>Le contraste \(|\operatorname{sinc}(\pi\Delta\sigma\delta)|\) s'annule pour la première fois en \(\delta = 1/\Delta\sigma = \lambda_m^2/\Delta\lambda = L_c\), c'est-à-dire quand l'ordre varie exactement de 1 d'un bord à l'autre du spectre.</p>

<div class="course-section">
  <div class="sec-num">§8 · SOURCE ÉTENDUE ET COHÉRENCE SPATIALE</div>
  <h2>Pourquoi Young exige une source fine, et pas Michelson</h2>
  <div class="intro">Une source étendue est un ensemble de points sources mutuellement incohérents : chacun produit sa figure, et les éclairements s'ajoutent. Si la différence de marche dépend de la position du point source, les figures se décalent les unes des autres et se brouillent.</div>

  <h3>Trous d'Young éclairés par une source décalée</h3>
  <p>La source ponctuelle est à la distance \(d\) du plan des trous, décalée de \(b\) parallèlement à \(S_1S_2\) (du côté de \(S_1\)). La différence de marche cumule un terme côté source, \((SS_2) - (SS_1) \approx ab/d\) (même calcul que côté écran), et le terme côté écran \((S_2M) - (S_1M) \approx ax/D\) ; dans l'air :</p>
  <div class="formula">$$\delta(M) \approx \frac{a\,b}{d} + \frac{a\,x}{D}$$</div>
  <ul>
    <li>La figure est <strong>translatée sans déformation</strong> : la frange d'ordre 0 passe en \(x = -bD/d\), du côté opposé au déplacement de la source.</li>
    <li>Un déplacement de la source <strong>perpendiculaire à \(S_1S_2\)</strong> ne change pas \(\delta\) : on peut allonger la source dans cette direction (fente source parallèle aux fentes) sans perdre de contraste.</li>
  </ul>

  <h3>Fente source de largeur \(\ell\)</h3>
  <div class="prop-box">
    Les points de la source répartis sur la largeur \(\ell\) (parallèlement à \(S_1S_2\)) donnent des figures décalées. Entre le centre et un bord de la source, l'ordre en \(M\) varie de \(\Delta p = \dfrac{a\,\ell}{2\,\lambda_0\,d}\). Le critère \(\Delta p \lesssim 1/2\) donne la condition de bonne visibilité :
    $$\ell \lesssim \frac{\lambda_0\,d}{a}$$
    Le calcul exact pour une fente uniforme (sommation des éclairements) donne un contraste \(\Gamma = \left|\operatorname{sinc}\dfrac{\pi\,a\,\ell}{\lambda_0\,d}\right|\), nul pour la première fois en \(\ell = \lambda_0 d/a\) ; pour un contraste confortable (\(\Gamma \gt 0{,}9\)), il faut \(\ell \lesssim \lambda_0 d/(4a)\).
  </div>
  <p>Autre lecture : vue des trous, la source sous-tend l'angle \(\alpha_s = \ell/d\) ; il faut \(a\,\alpha_s \lesssim \lambda_0\). Plus les trous sont écartés, plus la source doit paraître petite. <strong>Ordre de grandeur :</strong> \(a = 1\ \text{mm}\), \(d = 25\ \text{cm}\), \(\lambda_0 = 0{,}6\ \mu\text{m}\) : \(\ell \lesssim 0{,}15\ \text{mm}\). Les franges d'Young sont donc peu lumineuses avec une lampe : c'est le prix des franges non localisées.</p>

  <h3>Michelson : une source large ne brouille rien, au bon endroit</h3>
  <p>Au Michelson en lame d'air, \(2e\cos\theta\) ne fait intervenir que la direction commune des deux rayons issus d'un même rayon incident, et non l'endroit de la source d'où ce rayon part. Dans le plan focal de la lentille, chaque point de la source produit donc <strong>exactement les mêmes anneaux</strong>, qui s'additionnent sans se décaler : plus la source est large, plus la figure est lumineuse, sans perte de contraste. Sur un écran mal placé (hors du plan focal), ce n'est plus vrai et le contraste s'effondre ; de même, en coin d'air, il faut faire l'image des miroirs.</p>
  <div class="prop-box">
    <strong>À retenir : étendue de la source et localisation.</strong>
    <ul style="margin:.4rem 0">
      <li>Le brouillage naît de la dépendance de \(\delta\) vis-à-vis du point source. Avec un diviseur du front d'onde, cette dépendance existe partout : il faut une source petite (ou une fente parallèle aux fentes d'Young), et les franges se voient alors dans tout l'espace de recouvrement (<strong>non localisées</strong>).</li>
      <li>Avec un diviseur d'amplitude, il existe une surface où cette dépendance disparaît : celle où se croisent les deux rayons nés d'un même rayon incident (l'infini pour la lame d'air, le voisinage des miroirs pour le coin d'air). On peut y employer une source large ; ailleurs, les franges sont brouillées (<strong>localisées</strong>).</li>
    </ul>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · EXPLOITATION EN TP</div>
  <h2>Mesurer des longueurs, des indices, des écarts spectraux</h2>
  <div class="intro">Les interféromètres transforment des longueurs ou des écarts de longueur d'onde en un nombre de franges : ils permettent des mesures à une fraction de micromètre près, avec un matériel de TP.</div>

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0">
    <tr style="border-bottom:2px solid var(--grid)"><th style="text-align:left;padding:.35rem">Grandeur mesurée</th><th style="text-align:left;padding:.35rem">Montage</th><th style="text-align:left;padding:.35rem">Relation exploitée</th></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Longueur d'onde, déplacement</td><td style="padding:.35rem">Michelson, lame d'air : compter les anneaux qui défilent au centre</td><td style="padding:.35rem">\(N = 2d/\lambda_0\)</td></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Épaisseur de la lame d'air</td><td style="padding:.35rem">rayons des anneaux (tracé de \(R_k^2\) en fonction de \(k\))</td><td style="padding:.35rem">pente \(f'^2\lambda_0/e\)</td></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Écart d'un doublet</td><td style="padding:.35rem">Michelson : translation entre anticoïncidences</td><td style="padding:.35rem">\(\Delta\lambda = \lambda_m^2/(2\Delta e)\)</td></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Indice ou épaisseur d'une lame</td><td style="padding:.35rem">Michelson en lumière blanche : on retrouve les franges colorées en translatant le miroir</td><td style="padding:.35rem">\(\Delta x = (n - 1)\,e\)</td></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Épaisseur optique d'une lame mince</td><td style="padding:.35rem">spectre cannelé</td><td style="padding:.35rem">\(\delta = N\lambda_a\lambda_b/(\lambda_a - \lambda_b)\)</td></tr>
    <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem">Planéité, marche</td><td style="padding:.35rem">coin d'air, franges d'égale épaisseur</td><td style="padding:.35rem">\(\lambda_0/2\) par frange</td></tr>
    <tr><td style="padding:.35rem">Longueur d'onde</td><td style="padding:.35rem">goniomètre à réseau étalonné</td><td style="padding:.35rem">\(a(\sin\theta - \sin\theta_i) = p\lambda_0\)</td></tr>
  </table></div>

  <h3>Lame de verre dans un bras du Michelson</h3>
  <p>Une lame d'épaisseur \(e\) et d'indice \(n\), placée perpendiculairement au faisceau dans le bras 1, est traversée deux fois (aller et retour) : elle remplace une épaisseur \(2e\) d'air et ajoute \(2(n-1)e\) au chemin optique de ce bras. Partant du contact optique en lumière blanche, les franges colorées disparaissent ; on les retrouve en <strong>rallongeant le bras 2</strong> (ou en raccourcissant le bras 1) de</p>
  <div class="formula">$$\Delta x = (n-1)\,e$$</div>
  <div class="notice">En toute rigueur, à cause de la dispersion du verre, la frange achromatique réapparaît pour une translation faisant intervenir l'<strong>indice de groupe</strong> \(n_g = n - \lambda_0\,\dfrac{\mathrm{d}n}{\mathrm{d}\lambda_0}\), un peu supérieur à \(n\) : la mesure en lumière blanche donne en fait \(n_g\).</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Au centre des anneaux, on compte 400 anneaux qui disparaissent pendant que la vis micrométrique avance de \(127\ \mu\text{m}\). Longueur d'onde ?</span>
    <div class="content"><p>\(\lambda_0 = 2d/N = 2\times127/400 = 0{,}635\ \mu\text{m}\), soit \(635\ \text{nm}\) (raie rouge). Une erreur d'un anneau sur 400 et de \(1\ \mu\text{m}\) sur la lecture donne une incertitude relative d'environ \(1\ \%\) : il faut compter beaucoup d'anneaux.</p></div>
  </div>
</div>

<template class="pan-tpl" data-panneau="dif-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · DISPOSITIFS INTERFÉRENTIELS</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Calculer une différence de marche</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Repérer les deux trajets.</span> Partir d'<strong>un</strong> point source et suivre les deux ondes jusqu'au point d'observation \(M\) (ou jusqu'à la direction d'observation à l'infini). Fixer le sens : \(\delta = (SM)_2 - (SM)_1\).</li>
      <li><span class="step">Point à distance finie.</span> Écrire les distances, puis faire un développement limité (\(D \gg a\)) : \(S_2M - S_1M \approx ax/D\). Astuce : \(S_2M^2 - S_1M^2\) se calcule sans racine.</li>
      <li><span class="step">Observation à l'infini.</span> Tracer un plan perpendiculaire aux rayons émergents (surface d'onde, théorème de Malus) : au-delà, plus aucune différence de marche, même à travers une lentille. Lire \(\delta\) comme une projection (\(a\sin\theta\), \(2e\cos\theta\)).</li>
      <li><span class="step">Ajouter les termes oubliés.</span> Lame d'indice \(n\) sur un trajet : \(+(n-1)e\) par traversée ; décalage de la source : \(+ab/d\) ; éventuels déphasages de réflexion (\(\lambda_0/2\)), à signaler même si on les néglige.</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Piège :</strong> écrire \(\delta\) avec la longueur d'onde dans le milieu et oublier l'indice. On travaille avec des chemins optiques et \(\lambda_0\) : \(p = \delta/\lambda_0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Passer de \(\delta\) à la figure observée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Ordre.</span> Écrire \(p(M) = \delta(M)/\lambda_0\).</li>
      <li><span class="step">Forme des franges.</span> Ce sont les courbes \(p = \text{cte}\) : droites si \(\delta\) dépend d'une seule coordonnée cartésienne, cercles si \(\delta\) ne dépend que de l'inclinaison.</li>
      <li><span class="step">Nature.</span> \(p\) entier : frange brillante ; \(p\) demi-entier : frange sombre.</li>
      <li><span class="step">Interfrange.</span> Distance correspondant à \(\Delta p = 1\). Un décalage de la figure se compte en interfranges : \(\Delta p = \Delta\delta/\lambda_0\).</li>
      <li><span class="step">Défilement.</span> Si \(\delta\) varie au cours du temps en un point fixe (miroir translaté, gaz introduit), le nombre de franges qui défilent vaut \(\Delta\delta/\lambda_0\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Anneaux d'égale inclinaison (Michelson en lame d'air)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Ordre au centre.</span> \(p_0 = 2e/\lambda_0\) ; écrire \(p_0 = k_0 + \varepsilon\) avec \(0 \le \varepsilon \lt 1\). Centre brillant si \(\varepsilon = 0\).</li>
      <li><span class="step">Développement.</span> \(p(\theta) \approx p_0(1 - \theta^2/2)\) : l'ordre <strong>décroît</strong> vers l'extérieur.</li>
      <li><span class="step">Anneau numéro \(k\).</span> Ordre \(k_0 - (k-1)\), donc \(\theta_k^2 = 2(k-1+\varepsilon)/p_0\) et \(R_k = f'\theta_k\).</li>
      <li><span class="step">Nombre d'anneaux.</span> Dans un champ de demi-angle \(\theta_{max}\) : environ \(p_0\,\theta_{max}^2/2 = e\,\theta_{max}^2/\lambda_0\).</li>
      <li><span class="step">Évolution.</span> Pour un anneau donné (ordre fixé), \(2e\cos\theta = \text{cte}\) : si \(e\) diminue, \(\theta\) diminue, l'anneau rentre.</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Pièges :</strong> prendre le numéro \(k\) pour l'ordre ; utiliser \(R_k = f'\sqrt{k\lambda_0/e}\) sans avoir vérifié que le centre est brillant ; lire dans \(R_k \propto 1/\sqrt{e}\) qu'en augmentant \(e\) chaque anneau rétrécit. \(R_k\) désigne « le \(k\)-ième anneau en partant du centre », qui n'est plus le même anneau quand \(e\) change : un anneau suivi des yeux (ordre fixé) <em>grandit</em>, pendant que d'autres apparaissent au centre.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Franges d'égale épaisseur (coin d'air, lame non plane)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Épaisseur locale.</span> Exprimer \(e(x, y)\) (coin plan : \(e = \alpha x\)).</li>
      <li><span class="step">Condition.</span> \(2e(x,y) = p\lambda_0\) (incidence quasi normale) : chaque frange est une courbe d'épaisseur constante.</li>
      <li><span class="step">Interfrange.</span> \(i = \lambda_0/(2\alpha)\) sur l'objet ; multiplier par \(|\gamma|\) pour l'image sur l'écran.</li>
      <li><span class="step">Lecture d'un relief.</span> Une déformation ou un décalage de \(f\) interfrange correspond à une variation d'épaisseur de \(f\lambda_0/2\).</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Piège :</strong> une seule figure monochromatique ne donne ni le signe de la pente, ni le nombre entier de franges d'un décalage. Il faut une information de plus : lumière blanche (frange achromatique), sens de défilement quand on translate le miroir, ou ordre de grandeur connu.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Exploiter un réseau</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Orienter les angles.</span> \(\theta_i\) et \(\theta\) mesurés depuis la normale, dans le même sens ; écrire \(a(\sin\theta_p - \sin\theta_i) = p\lambda_0\).</li>
      <li><span class="step">Ordres existants.</span> Imposer \(|\sin\theta_p| \le 1\) ; en incidence normale, \(|p| \le a/\lambda_0\).</li>
      <li><span class="step">Mesure symétrique.</span> En incidence normale, viser les ordres \(+p\) et \(-p\) et mesurer l'angle \(2\theta_p\) entre eux : on s'affranchit du zéro du goniomètre.</li>
      <li><span class="step">Minimum de déviation.</span> \(2a\sin(D_m/2) = p\lambda_0\).</li>
      <li><span class="step">Recouvrements.</span> Une direction peut correspondre à \(p\lambda_0 = p'\lambda_0'\) : vérifier que la raie visée appartient bien à l'ordre supposé (couleur, cohérence avec un autre ordre).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Établir une condition de brouillage (cohérence temporelle ou spatiale)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Paramètre qui varie.</span> Longueur d'onde (spectre de largeur \(\Delta\lambda\)) ou position du point source (source de largeur \(\ell\)).</li>
      <li><span class="step">Ordre.</span> Exprimer \(p\) en \(M\) en fonction de ce paramètre.</li>
      <li><span class="step">Variation.</span> Calculer \(\Delta p\) entre le centre et un bord du spectre ou de la source.</li>
      <li><span class="step">Critère.</span> Imposer \(\Delta p \lesssim 1/2\) : on obtient \(|\delta| \lesssim \lambda_m^2/\Delta\lambda\) ou \(\ell \lesssim \lambda_0 d/a\).</li>
      <li><span class="step">Calcul exact si demandé.</span> Sommer les <strong>éclairements</strong> (jamais les amplitudes) des composantes incohérentes : \(\cos + \cos\) pour un doublet, intégrale donnant un sinus cardinal pour une raie ou une fente uniforme.</li>
    </ol>
    <p style="margin-top:.4rem"><strong>Piège :</strong> le facteur 2 du critère varie selon les énoncés (\(\Delta p \lt 1/2\) sur toute l'étendue, ou du centre au bord) : suivre celui de l'énoncé, ces critères ne donnent qu'un ordre de grandeur. Si la différence de marche ne dépend pas du paramètre (division d'amplitude dans la zone de localisation, source allongée parallèlement aux fentes), il n'y a pas de brouillage.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Lumière blanche : teinte ou spectre cannelé ?</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Longueurs d'onde éteintes.</span> \(\lambda_k = \delta/(k + \tfrac12)\) ; ne garder que celles du visible (de 400 à 750 nm environ).</li>
      <li><span class="step">Diagnostic.</span> Aucune ou une seule extinction : teinte de Newton (couleur complémentaire de la couleur éteinte) ; nombreuses extinctions : blanc d'ordre supérieur, spectre cannelé.</li>
      <li><span class="step">Mesure de \(\delta\).</span> Repérer deux cannelures \(\lambda_a \gt \lambda_b\) et compter les \(N\) intervalles qui les séparent : \(\delta = N\lambda_a\lambda_b/(\lambda_a - \lambda_b)\). Vérifier que \(\delta/\lambda_a\) est proche d'un demi-entier, puis affiner.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Diagnostiquer un Michelson d'après sa figure (TP, oral)</strong>
    <p style="margin:.4rem 0 0">Seuls deux paramètres comptent : l'épaisseur \(e\) de la lame d'air équivalente, que change la translation du miroir mobile, et l'angle \(\alpha\) entre \(M_1\) et \(M_2'\), que changent les vis d'orientation. La figure observée dit lequel retoucher.</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.5rem 0 0">
      <tr style="border-bottom:2px solid var(--grid)"><th style="text-align:left;padding:.35rem">On voit</th><th style="text-align:left;padding:.35rem">On en déduit</th><th style="text-align:left;padding:.35rem">On agit</th></tr>
      <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem;vertical-align:top">Anneaux concentriques, d'autant plus serrés que l'on s'éloigne du centre</td><td style="padding:.35rem;vertical-align:top">\(\alpha \approx 0\) mais \(e\) encore grand (lame d'air épaisse)</td><td style="padding:.35rem;vertical-align:top">Translation du miroir mobile vers \(e = 0\) : les anneaux rentrent un à un dans le centre, où ils disparaissent, et ceux qui restent s'espacent. S'il en sort du centre, le sens est le mauvais.</td></tr>
      <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem;vertical-align:top">Arcs de cercle, centre hors du champ</td><td style="padding:.35rem;vertical-align:top">\(e\) et \(\alpha\) tous deux non nuls</td><td style="padding:.35rem;vertical-align:top">Diminuer d'abord \(e\) par translation ; les arcs se redressent à l'approche du contact optique.</td></tr>
      <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem;vertical-align:top">Franges rectilignes et parallèles</td><td style="padding:.35rem;vertical-align:top">\(e \approx 0\) dans la zone observée, \(\alpha \neq 0\) : coin d'air d'interfrange \(\lambda_0/(2\alpha)\)</td><td style="padding:.35rem;vertical-align:top">Vis d'orientation, dans le sens qui élargit l'interfrange.</td></tr>
      <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem;vertical-align:top">Champ uniforme, dont l'éclairement change d'un bloc quand on touche la translation</td><td style="padding:.35rem;vertical-align:top">\(e \approx 0\) et \(\alpha \approx 0\) : contact optique (teinte plate)</td><td style="padding:.35rem;vertical-align:top">Position de référence : c'est de là que l'on fabrique ensuite la lame d'air ou le coin d'air voulu.</td></tr>
      <tr style="border-bottom:1px solid var(--grid)"><td style="padding:.35rem;vertical-align:top">Franges nettes au laser, absentes avec la lampe ou la lumière blanche</td><td style="padding:.35rem;vertical-align:top">différence de marche supérieure à la longueur de cohérence de la nouvelle source</td><td style="padding:.35rem;vertical-align:top">Se placer plus près du contact optique avant de changer de source (\(\delta \lesssim 1\ \mu\text{m}\) pour la lumière blanche).</td></tr>
      <tr><td style="padding:.35rem;vertical-align:top">Source étendue : franges floues ou peu contrastées</td><td style="padding:.35rem;vertical-align:top">écran hors de la zone de localisation</td><td style="padding:.35rem;vertical-align:top">Lame d'air : observer dans le plan focal d'une lentille. Coin d'air : former sur l'écran l'image des miroirs.</td></tr>
    </table></div>
  </div>
</div>
