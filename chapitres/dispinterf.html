<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Fentes d'Young observées dans le plan focal d'une lentille</h3>
  <div class="statement">Deux fentes fines parallèles \(F_1\) et \(F_2\), de largeur \(b = 40\ \mu\text{m}\), dont les axes sont distants de \(a = 0{,}40\ \text{mm}\), sont éclairées en incidence normale par le faisceau élargi d'une diode laser rouge (\(\lambda_0 = 650\ \text{nm}\)). Une lentille convergente de focale \(f' = 50\ \text{cm}\) est placée juste derrière les fentes, et l'écran dans son plan focal image. On repère un point \(M\) de l'écran par son abscisse \(x\), comptée depuis le foyer image \(F'\) parallèlement à \(F_2F_1\) (\(F_1\) du côté des \(x \gt 0\)). Tout le montage est dans l'air.</div>
  <div class="q"><strong>Q1.</strong> Exprimer la différence de marche \(\delta = (F_2M) - (F_1M)\) en fonction de \(x\), puis l'interfrange \(i\). Application numérique.</div>
  <div class="q"><strong>Q2.</strong> On admet que chaque fente diffracte la lumière dans un demi-angle \(\lambda_0/b\) autour de la direction incidente. Où est centrée la tache de diffraction de chaque fente dans le plan focal ? En déduire la largeur \(L\) de la zone éclairée et le nombre de franges brillantes observables.</div>
  <div class="q"><strong>Q3.</strong> On colle sur \(F_1\) un film plastique d'épaisseur \(e = 5{,}0\ \mu\text{m}\) et d'indice \(n_f = 1{,}52\). Dans quel sens la figure se déplace-t-elle ? De combien (en mm et en interfranges) ?</div>
  <div class="q"><strong>Q4.</strong> Un étudiant qui réalise l'expérience avec le laser affirme que le film « ne change rien » : la figure lui paraît identique avant et après. Expliquer son constat, puis proposer une façon de mettre le déplacement en évidence et de le mesurer.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les rayons qui convergent en \(M\) émergent des fentes parallèlement, avec l'inclinaison \(\theta\) telle que \(\tan\theta = x/f'\). Le plan perpendiculaire à ces rayons passant par \(F_1\) est une surface d'onde de l'onde qui converge en \(M\) (Malus) : \(\delta = a\sin\theta \approx a\theta \approx \dfrac{a\,x}{f'}\). Franges rectilignes parallèles aux fentes, d'interfrange \(i = \dfrac{\lambda_0 f'}{a} = \dfrac{650\times10^{-9}\times0{,}50}{0{,}40\times10^{-3}} = 0{,}81\ \text{mm}\).</p>
    <p><strong>Q2.</strong> La lumière diffractée par une fente dans la direction \(\theta\) converge au point d'abscisse \(f'\theta\), quelle que soit la position de la fente : les deux taches de diffraction sont <strong>centrées sur \(F'\)</strong> et se superposent exactement. Largeur : \(L \approx 2f'\lambda_0/b\) \(= 2\times0{,}50\times650\times10^{-9}/(40\times10^{-6})\) \(= 16\ \text{mm}\). Nombre d'interfranges : \(L/i = 2a/b = 20\). Les franges brillantes ont les ordres \(p\) tels que \(|p| \lt a/b = 10\) (les ordres \(\pm10\) tombent sur les zéros de la diffraction) : \(19\) franges brillantes, de \(p = -9\) à \(p = 9\).</p>
    <p><strong>Q3.</strong> Le film remplace une épaisseur \(e\) d'air sur le trajet passant par \(F_1\) : \((F_1M)\) augmente de \((n_f - 1)e\), d'où \(\delta' = \dfrac{ax}{f'} - (n_f - 1)e\). La frange d'ordre 0 (\(\delta' = 0\)) passe en \(x_0 = \dfrac{(n_f - 1)\,e\,f'}{a}\) \(= \dfrac{0{,}52\times5{,}0\times10^{-6}\times0{,}50}{0{,}40\times10^{-3}}\) \(= 3{,}3\ \text{mm}\), du côté de \(F_1\) (la figure suit la fente couverte). En interfranges : \(x_0/i = (n_f - 1)e/\lambda_0 = 4{,}0\). L'interfrange est inchangé, et la frange d'ordre 0 reste bien à l'intérieur de la zone éclairée (\(3{,}3\ \text{mm} \lt L/2 \approx 8\ \text{mm}\)).</p>
    <p><strong>Q4.</strong> Le décalage vaut un nombre entier d'interfranges (\(4{,}0\)) : chaque frange brillante vient exactement prendre la place d'une autre. Comme toutes les franges brillantes se ressemblent en lumière monochromatique, et que l'enveloppe de diffraction (centrée sur \(F'\)) ne bouge pas, la figure paraît inchangée alors qu'elle a glissé de 4 interfranges. Plus généralement, le laser ne révèle que la partie fractionnaire d'un décalage. Pour mesurer le vrai déplacement, on éclaire brièvement en lumière blanche (source filtrée par une fente parallèle aux fentes d'Young) : seule la frange \(\delta' = 0\) est blanche, les autres sont irisées. On repère sa position avec et sans film, et l'écart donne \(x_0\) (on néglige la dispersion du film).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Goniomètre à réseau : étalonnage et mesures</h3>
  <div class="statement">Un réseau plan par transmission est placé sur la plate-forme d'un goniomètre. Il est éclairé par un collimateur (fente source fine au foyer d'une lentille) ; on vise les faisceaux diffractés avec une lunette réglée à l'infini. Tout se passe dans l'air. Les angles sont mesurés à \(1'\) près (une minute d'arc).</div>
  <div class="q"><strong>Q1.</strong> Le réseau est éclairé en incidence normale par la raie verte du mercure (\(\lambda_0 = 546{,}1\ \text{nm}\)). L'angle entre les directions des ordres \(+1\) et \(-1\) vaut \(38{,}25°\). Rappeler la formule des réseaux, puis calculer le pas \(a\) et le nombre de traits par millimètre.</div>
  <div class="q"><strong>Q2.</strong> Combien de directions de maximum observe-t-on pour cette raie (ordre 0 compris) ?</div>
  <div class="q"><strong>Q3.</strong> On éclaire avec une lampe à sodium dont le doublet jaune comprend les raies \(589{,}0\ \text{nm}\) et \(589{,}6\ \text{nm}\). Dans l'ordre 2 (incidence normale), calculer la direction moyenne puis l'écart angulaire \(\Delta\theta\) entre les deux raies. Le goniomètre peut-il les séparer ?</div>
  <div class="q"><strong>Q4.</strong> Lampe de lumière blanche (de 400 à 750 nm), incidence normale. Les spectres d'ordres 1 et 2 se recouvrent-ils ? Et ceux d'ordres 2 et 3 ? Préciser, le cas échéant, les couleurs superposées.</div>
  <div class="q"><strong>Q5.</strong> On tourne la plate-forme pour amener une raie jaune inconnue, observée dans l'ordre 1, au minimum de déviation ; on mesure \(D_m = 19{,}93°\). Établir la relation entre \(D_m\), \(a\) et \(\lambda_0\), puis calculer \(\lambda_0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(a(\sin\theta_p - \sin\theta_i) = p\lambda_0\). En incidence normale, les ordres \(\pm1\) sont symétriques : \(\theta_1 = 38{,}25°/2 = 19{,}125°\), \(a = \dfrac{\lambda_0}{\sin\theta_1} = \dfrac{546{,}1\ \text{nm}}{0{,}3276} = 1{,}667\ \mu\text{m}\), soit \(1/a = 600\) traits/mm. Mesurer l'angle entre \(+1\) et \(-1\) évite d'avoir à repérer précisément la normale.</p>
    <p><strong>Q2.</strong> \(|\sin\theta_p| = |p|\lambda_0/a \le 1\) impose \(|p| \le a/\lambda_0 = 3{,}05\) : \(p \in \{-3, \dots, 3\}\), soit <strong>7</strong> directions.</p>
    <p><strong>Q3.</strong> \(\sin\theta_2 = 2\times589{,}3\ \text{nm}/1{,}667\ \mu\text{m} = 0{,}707\), \(\theta_2 = 45{,}0°\). En différentiant : \(\Delta\theta = \dfrac{p\,\Delta\lambda}{a\cos\theta_2}\) \(= \dfrac{2\times0{,}6\times10^{-9}}{1{,}667\times10^{-6}\times0{,}707}\) \(= 1{,}0\times10^{-3}\ \text{rad} \approx 3{,}5'\). C'est supérieur à la précision de \(1'\) : les deux raies sont séparées (à condition que la fente source soit fine et que le réseau éclairé compte assez de traits : il faut \(|p|N \gt 589/0{,}6 \approx 1\,000\), largement vérifié avec des milliers de traits).</p>
    <p><strong>Q4.</strong> Ordre \(p\) : \(\sin\theta \in [400p,\ 750p]\ \text{nm}/a\). Ordre 1 : de \(13{,}9°\) à \(26{,}7°\) ; ordre 2 : de \(28{,}7°\) à \(64{,}1°\) : pas de recouvrement (\(750 \lt 800\)). Ordre 3 : il commence à \(46{,}0°\) (400 nm) et n'existe que pour \(\lambda_0 \lt a/3 = 556\ \text{nm}\). Entre \(46{,}0°\) et \(64{,}1°\), l'ordre 2 (de 600 à 750 nm : orange et rouge) se superpose à l'ordre 3 (de 400 à 500 nm : violet et bleu).</p>
    <p><strong>Q5.</strong> Au minimum de déviation, \(\theta = -\theta_i\) et \(D_m = 2\theta\) ; la formule devient \(a(\sin\theta + \sin\theta) = p\lambda_0\), soit \(2a\sin(D_m/2) = p\lambda_0\). Ici \(\lambda_0 = 2\times1{,}667\ \mu\text{m}\times\sin(9{,}965°) = 0{,}577\ \mu\text{m}\) : c'est la raie jaune du mercure à \(577\ \text{nm}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Anneaux d'égale inclinaison et mesure d'une longueur d'onde</h3>
  <div class="statement">Un interféromètre de Michelson est réglé en lame d'air d'épaisseur \(e = 0{,}750\ \text{mm}\). Il est éclairé par une lampe à vapeur de mercure munie d'un filtre qui isole la raie verte (\(\lambda_0 = 546{,}1\ \text{nm}\)), à travers un condenseur. On observe la figure sur un écran placé dans le plan focal image d'une lentille de focale \(f' = 1{,}00\ \text{m}\), dont l'axe est perpendiculaire à \(M_1\). L'indice de l'air est pris égal à 1.</div>
  <div class="q"><strong>Q1.</strong> Montrer, par la méthode de votre choix, que la différence de marche entre les deux rayons issus d'un même rayon incident d'inclinaison \(\theta\) vaut \(2e\cos\theta\). Où les franges sont-elles localisées ? Justifier la présence de la lentille.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'ordre d'interférence \(p_0\) au centre. Le centre est-il brillant ?</div>
  <div class="q"><strong>Q3.</strong> Calculer les rayons des trois premiers anneaux brillants.</div>
  <div class="q"><strong>Q4.</strong> L'écran est un disque de rayon \(6{,}0\ \text{cm}\) centré sur l'axe. Combien d'anneaux brillants y voit-on ?</div>
  <div class="q"><strong>Q5.</strong> On translate le miroir mobile pour amener l'épaisseur à \(e' = 0{,}100\ \text{mm}\). Décrire l'évolution de la figure. Combien d'anneaux ont disparu au centre ? Combien d'anneaux brillants reste-t-il sur l'écran ?</div>
  <div class="q"><strong>Q6.</strong> Sur un autre appareil, un étudiant compte 274 anneaux disparaissant au centre pendant que la lecture de la vis micrométrique varie de \(75{,}0\ \mu\text{m}\). Estimer la longueur d'onde et son incertitude (on prendra une incertitude d'un demi-anneau sur le comptage et de \(0{,}5\ \mu\text{m}\) sur la lecture).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Montage équivalent : lame d'air entre \(M_1\) et \(M_2'\). Les deux ondes semblent issues des images \(S_1\) (par \(M_1\)) et \(S_2\) (par \(M_2'\)) d'un point source \(S\), alignées sur la normale et distantes de \(2e\). Vers l'infini dans la direction \(\theta\), la différence de marche est la projection de \(\overrightarrow{S_2S_1}\) sur la direction des rayons : \(\delta = 2e\cos\theta\). Elle ne dépend pas de la position de \(S\) : avec une source étendue, les franges sont contrastées à l'infini, où se recoupent les deux rayons (parallèles) issus d'un même rayon incident. La lentille ramène l'infini dans son plan focal, à distance finie.</p>
    <p><strong>Q2.</strong> \(p_0 = \dfrac{2e}{\lambda_0} = \dfrac{1{,}500\times10^{-3}}{546{,}1\times10^{-9}} = 2\,746{,}75\). L'ordre n'est pas entier : \(k_0 = 2\,746\), \(\varepsilon = 0{,}75\). Le centre n'est ni brillant ni sombre (\(\cos(2\pi p_0) = 0\) : éclairement moyen).</p>
    <p><strong>Q3.</strong> Le \(k\)-ième anneau brillant a l'ordre \(2\,746 - (k-1)\) : \(R_k \approx f'\sqrt{\dfrac{(k-1+\varepsilon)\lambda_0}{e}}\). Avec \(\lambda_0/e = 7{,}28\times10^{-4}\) : \(R_1 = \sqrt{0{,}75\times7{,}28\times10^{-4}} = 23{,}4\ \text{mm}\), \(R_2 = \sqrt{1{,}75\times7{,}28\times10^{-4}} = 35{,}7\ \text{mm}\), \(R_3 = 44{,}7\ \text{mm}\). Les anneaux se resserrent vers l'extérieur.</p>
    <p><strong>Q4.</strong> Au bord, \(\theta_{max} = 0{,}060\ \text{rad}\) et \(p = p_0\cos\theta_{max}\) \(\approx p_0(1 - \theta_{max}^2/2)\) \(= 2\,746{,}75 - 4{,}94 = 2\,741{,}8\). Les ordres entiers compris entre \(2\,741{,}8\) et \(2\,746{,}75\) sont \(2\,746, 2\,745, 2\,744, 2\,743, 2\,742\) : <strong>5 anneaux</strong> brillants (le cinquième a un rayon de \(58{,}8\ \text{mm}\)).</p>
    <p><strong>Q5.</strong> Quand \(e\) diminue, \(p_0\) diminue : les anneaux rentrent et disparaissent au centre, deviennent plus larges et moins nombreux. Nombre d'anneaux disparus : \(\Delta p_0 = \dfrac{2(e - e')}{\lambda_0}\) \(= \dfrac{2\times0{,}650\times10^{-3}}{546{,}1\times10^{-9}} \approx 2\,380\). Pour \(e' = 0{,}100\ \text{mm}\) : \(p_0' = 366{,}23\), et au bord \(p = 366{,}23 - 0{,}66 = 365{,}57\). Un seul ordre entier (366) est compris dans cet intervalle : <strong>un seul anneau</strong> brillant, de rayon \(f'\sqrt{0{,}23\,\lambda_0/e'} \approx 36\ \text{mm}\).</p>
    <p><strong>Q6.</strong> Un anneau disparaît pour chaque diminution \(\lambda_0/2\) de l'épaisseur : \(\lambda_0 = \dfrac{2d}{N} = \dfrac{2\times75{,}0}{274} = 0{,}547\ \mu\text{m}\). Incertitude relative : \(\sqrt{(0{,}5/274)^2 + (0{,}5/75{,}0)^2} \approx 0{,}7\ \%\), dominée par la lecture : \(\lambda_0 = 547 \pm 4\ \text{nm}\), compatible avec la raie verte du mercure. Pour améliorer la mesure, il faut compter davantage d'anneaux (course plus longue).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Coin d'air : angle des miroirs et hauteur d'une marche</h3>
  <div class="statement">Un Michelson est réglé en coin d'air d'angle \(\alpha\), d'arête parallèle à \(Oy\). Il est éclairé par une lampe à sodium (on prendra \(\lambda_0 = 589{,}3\ \text{nm}\) et on ignorera le doublet) en lumière quasi parallèle, sous incidence quasi normale. Une lentille mince de focale \(f' = 20\ \text{cm}\) forme sur un écran l'image des miroirs avec un grandissement \(\gamma = -4\).</div>
  <div class="q"><strong>Q1.</strong> Où les franges sont-elles localisées ? À quelles distances de la lentille faut-il placer les miroirs (plus précisément \(M_1\) et \(M_2'\)) et l'écran ?</div>
  <div class="q"><strong>Q2.</strong> Sur l'écran, 10 interfranges couvrent \(16{,}4\ \text{mm}\). Calculer l'angle \(\alpha\).</div>
  <div class="q"><strong>Q3.</strong> Pourquoi l'éclairage doit-il être quasi normal ? On estimera l'effet d'une dispersion des incidences jusqu'à \(\theta = 0{,}05\ \text{rad}\) à 1 cm de l'arête.</div>
  <div class="q"><strong>Q4.</strong> Sur une moitié de \(M_1\), on a déposé une couche mince, recouverte du même métal que le reste du miroir ; le bord de la couche est perpendiculaire à l'arête. Dans la zone observée, \(M_2'\) se trouve en avant de \(M_1\) (du côté d'où vient la lumière). Sur la moitié couverte, les franges paraissent décalées de \(0{,}30\) interfrange en s'éloignant de l'arête. Quelle information en tire-t-on sur l'épaisseur \(h\) de la couche ? Comment lever l'ambiguïté qui subsiste ?</div>
  <div class="q"><strong>Q5.</strong> Ailleurs, une frange est courbée avec une flèche d'un quart d'interfrange. Quel relief cela représente-t-il ? Comment savoir s'il s'agit d'une bosse ou d'un creux ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec une source étendue en coin d'air, les franges sont localisées au voisinage des miroirs (là où se recoupent les rayons issus d'un même rayon incident). Il faut donc conjuguer les miroirs et l'écran : avec \(\gamma = \overline{OA'}/\overline{OA} = -4\) et \(\dfrac{1}{\overline{OA'}} - \dfrac{1}{\overline{OA}} = \dfrac{1}{f'}\), on obtient \(\overline{OA'} = f'(1 - \gamma) = 1{,}00\ \text{m}\) et \(\overline{OA} = \overline{OA'}/\gamma = -25\ \text{cm}\). Miroirs à 25 cm avant la lentille, écran à 1,00 m après.</p>
    <p><strong>Q2.</strong> Interfrange sur l'écran \(i' = 1{,}64\ \text{mm}\), sur les miroirs \(i = i'/|\gamma| = 0{,}410\ \text{mm}\). Avec \(i = \lambda_0/(2\alpha)\) : \(\alpha = \dfrac{\lambda_0}{2i}\) \(= \dfrac{589{,}3\times10^{-9}}{2\times0{,}410\times10^{-3}} = 7{,}2\times10^{-4}\ \text{rad}\) (environ \(2{,}5'\)).</p>
    <p><strong>Q3.</strong> La différence de marche vaut en réalité \(2e\cos\theta \approx 2e(1 - \theta^2/2)\). Une dispersion des incidences fait varier \(\delta\) de \(e\theta^2\). À 1 cm de l'arête, \(e = \alpha x = 7{,}2\ \mu\text{m}\) et \(e\theta^2 = 7{,}2\times10^{-6}\times2{,}5\times10^{-3} \approx 18\ \text{nm}\), petit devant \(\lambda_0/2\) : pas de brouillage notable. Mais l'effet croît avec \(e\) : loin de l'arête, ou avec une incidence trop ouverte, les franges se brouillent. D'où l'éclairage quasi parallèle et quasi normal.</p>
    <p><strong>Q4.</strong> Sur la moitié couverte, la surface réfléchissante de \(M_1\) avance de \(h\) vers \(M_2'\) : l'épaisseur d'air y vaut \(\alpha x - h\). Une frange d'ordre \(p\) vérifie \(2(\alpha x - h) = p\lambda_0\), soit \(x = \dfrac{p\lambda_0}{2\alpha} + \dfrac{h}{\alpha}\) : la figure est décalée de \(h/\alpha = (2h/\lambda_0)\,i\) en s'éloignant de l'arête, ce qui est bien le sens observé. Mais en lumière monochromatique on ne voit que la partie fractionnaire du décalage : \(\dfrac{2h}{\lambda_0} = q + 0{,}30\) (\(q\) entier positif ou nul), soit \(h = (q + 0{,}30)\times294{,}7\ \text{nm}\) : \(88\ \text{nm}\) si \(q = 0\), \(383\ \text{nm}\) si \(q = 1\)… (Sans l'indication sur la position de \(M_2'\), un décalage de \(0{,}30\) dans un sens serait même indiscernable d'un décalage de \(0{,}70\) dans l'autre.) Pour lever l'ambiguïté, on passe en lumière blanche près de l'arête : la frange achromatique (épaisseur d'air nulle) apparaît sur les deux moitiés, et son décalage d'une moitié à l'autre se lit directement, partie entière comprise, ce qui donne \(q\).</p>
    <p><strong>Q5.</strong> Une flèche de \(1/4\) d'interfrange correspond à une variation d'épaisseur de \(\lambda_0/8 \approx 74\ \text{nm}\). Une seule figure ne dit pas si l'épaisseur augmente ou diminue à cet endroit. On translate légèrement le miroir mobile en sachant dans quel sens varie \(e\) : le sens de défilement des franges indique de quel côté l'épaisseur croît, donc si la déformation est une bosse ou un creux. (On peut aussi repérer l'arête en lumière blanche.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Lumière blanche : teinte, blanc d'ordre supérieur, spectre cannelé</h3>
  <div class="statement">Un Michelson réglé en lame d'air d'épaisseur \(e\) est éclairé en lumière blanche (de 400 à 750 nm). On observe le centre de la figure (incidence quasi nulle), éventuellement avec un spectroscope dont la fente est placée au centre. On néglige tout déphasage dû à la séparatrice et la dispersion de l'air.</div>
  <div class="q"><strong>Q1.</strong> Pour \(e = 0{,}15\ \mu\text{m}\), quelles longueurs d'onde du visible sont éteintes ? renforcées ? Quelle teinte voit-on au centre ?</div>
  <div class="q"><strong>Q2.</strong> Pour \(e = 6{,}0\ \mu\text{m}\), combien de longueurs d'onde du visible sont éteintes ? Donner la plus grande et la plus petite. Qu'observe l'œil ? et le spectroscope ?</div>
  <div class="q"><strong>Q3.</strong> Pour une épaisseur inconnue, le spectroscope montre deux cannelures à \(650{,}0\ \text{nm}\) et \(502{,}8\ \text{nm}\), séparées par 5 autres cannelures. Déterminer \(\delta\) puis \(e\), en affinant le résultat à l'aide du caractère demi-entier de l'ordre.</div>
  <div class="q"><strong>Q4.</strong> Estimer la longueur de cohérence de la lumière blanche. Les observations précédentes sont-elles cohérentes avec cette valeur ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Au centre, \(\delta = 2e = 0{,}30\ \mu\text{m}\). Extinction pour \(\delta = (k + \tfrac12)\lambda_0\), soit \(\lambda_0 = 0{,}60\ \mu\text{m}\) (\(k = 0\)) ; les suivantes (\(0{,}20\ \mu\text{m}\)…) sont dans l'ultraviolet. Renforcement pour \(\delta = k\lambda_0\) : \(0{,}30\ \mu\text{m}\) et moins, hors du visible. Le spectre perd l'orangé : le centre prend une teinte bleutée (complémentaire de l'orangé), une teinte de Newton.</p>
    <p><strong>Q2.</strong> \(\delta = 12{,}0\ \mu\text{m}\). Extinction si \(400 \le \dfrac{12\,000}{k + 1/2} \le 750\) (en nm), soit \(16 \le k + \tfrac12 \le 30\) : \(k = 16, \dots, 29\), donc <strong>14</strong> longueurs d'onde éteintes, de \(12\,000/16{,}5 = 727\ \text{nm}\) à \(12\,000/29{,}5 = 407\ \text{nm}\). Elles sont réparties sur tout le visible : l'œil voit du blanc (blanc d'ordre supérieur), le spectroscope un spectre cannelé de 14 raies sombres.</p>
    <p><strong>Q3.</strong> Les deux cannelures sont séparées de \(N = 6\) intervalles : \(\dfrac{\delta}{502{,}8} - \dfrac{\delta}{650{,}0} = 6\), d'où \(\delta = \dfrac{6\times650{,}0\times502{,}8}{650{,}0 - 502{,}8} = 13{,}32\ \mu\text{m}\). Contrôle : \(\delta/650{,}0\ \text{nm} = 20{,}49 \approx 20{,}5\). On impose la valeur demi-entière exacte : \(\delta = 20{,}5\times650{,}0\ \text{nm} = 13{,}33\ \mu\text{m}\) (et \(26{,}5\times502{,}8 = 13{,}32\ \mu\text{m}\), cohérent). D'où \(e = \delta/2 = 6{,}66\ \mu\text{m}\).</p>
    <p><strong>Q4.</strong> \(\lambda_m \approx 575\ \text{nm}\), \(\Delta\lambda \approx 350\ \text{nm}\) : \(L_c = \lambda_m^2/\Delta\lambda \approx 0{,}9\ \mu\text{m}\). Pour \(\delta = 0{,}30\ \mu\text{m} \lt L_c\), on voit une couleur (interférences encore « visibles » pour l'œil) ; pour \(\delta = 12\ \mu\text{m} \gg L_c\), l'œil ne voit plus de franges (blanc), même si le spectroscope, qui sépare les longueurs d'onde, révèle encore les interférences de chaque composante.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Fentes d'Young éclairées par une fente source large</h3>
  <div class="statement">Une fente source \(F\), parallèle aux fentes d'Young \(F_1\) et \(F_2\), est placée sur la médiatrice de \(F_1F_2\), à la distance \(d = 40\ \text{cm}\) de leur plan. Les fentes d'Young sont distantes de \(a = 0{,}80\ \text{mm}\) ; l'écran est à \(D = 1{,}50\ \text{m}\). La lumière est filtrée (\(\lambda_0 = 540\ \text{nm}\)) et l'on suppose la cohérence temporelle suffisante. La fente source a une largeur réglable \(\ell\) ; un point \(M\) de l'écran est repéré par son abscisse \(x\) parallèlement à \(F_2F_1\). Milieu : air.</div>
  <div class="q"><strong>Q1.</strong> La source est d'abord ponctuelle, décalée de \(b\) parallèlement à \(F_2F_1\) (du côté de \(F_1\)). Exprimer \(\delta(M)\). Dans quel sens se déplace la frange centrale ?</div>
  <div class="q"><strong>Q2.</strong> Pourquoi peut-on étirer la source dans la direction des fentes sans perdre de contraste ?</div>
  <div class="q"><strong>Q3.</strong> La fente source, uniformément lumineuse, a la largeur \(\ell\). En sommant les éclairements des bandes élémentaires de largeur \(\mathrm{d}b\), montrer que \(\mathcal{E}(x) = 2\mathcal{E}_0\left[1 + \operatorname{sinc}\left(\dfrac{\pi a \ell}{\lambda_0 d}\right)\cos\left(\dfrac{2\pi a x}{\lambda_0 D}\right)\right]\) et en déduire le contraste \(\Gamma(\ell)\).</div>
  <div class="q"><strong>Q4.</strong> Calculer l'interfrange et la largeur \(\ell_1\) pour laquelle les franges disparaissent pour la première fois. Comparer au critère semi-quantitatif \(\Delta p \lesssim 1/2\) entre le centre et le bord de la source.</div>
  <div class="q"><strong>Q5.</strong> Quelle largeur maximale choisir pour garder \(\Gamma \ge 0{,}90\) ? (On donne \(\operatorname{sinc}(\pi/4) \approx 0{,}90\).)</div>
  <div class="q"><strong>Q6.</strong> On élargit la fente au-delà de \(\ell_1\). Que devient la figure ? Un étudiant tourne ensuite la fente source de 90° (sa longueur, 5 mm, devient parallèle à \(F_2F_1\)) : qu'observe-t-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Côté source, le même calcul que côté écran donne \((SF_2) - (SF_1) \approx ab/d\). D'où \(\delta(M) = \dfrac{ab}{d} + \dfrac{ax}{D}\). La frange d'ordre 0 est en \(x = -bD/d\) : elle se déplace du côté <strong>opposé</strong> à la source (sur la droite qui joint la source au milieu des fentes), sans changement d'interfrange.</p>
    <p><strong>Q2.</strong> Un point source déplacé perpendiculairement à \(F_1F_2\) reste à égale distance de \(F_1\) et de \(F_2\) : \(\delta\) ne change pas. Toutes les tranches de la fente donnent la même figure, qui gagne en luminosité sans se brouiller.</p>
    <p><strong>Q3.</strong> La bande d'abscisse \(b\) (\(-\ell/2 \le b \le \ell/2\)) donne seule \(\mathrm{d}\mathcal{E} = \dfrac{2\mathcal{E}_0}{\ell}\left[1 + \cos\left(\beta b + \varphi_x\right)\right]\mathrm{d}b\), avec \(\beta = \dfrac{2\pi a}{\lambda_0 d}\) et \(\varphi_x = \dfrac{2\pi a x}{\lambda_0 D}\). Les bandes étant incohérentes entre elles, on somme les éclairements :</p>
    <div class="formula">$$\int_{-\ell/2}^{\ell/2}\cos(\beta b + \varphi_x)\,\mathrm{d}b = \frac{2}{\beta}\sin\frac{\beta\ell}{2}\cos\varphi_x$$</div>
    <p>soit \(\ell\,\operatorname{sinc}(\beta\ell/2)\,\cos\varphi_x\),</p>
    <p>avec \(\beta\ell/2 = \pi a\ell/(\lambda_0 d)\), d'où le résultat. Les extrema valent \(2\mathcal{E}_0(1 \pm |\operatorname{sinc}|)\), donc \(\Gamma = \left|\operatorname{sinc}\dfrac{\pi a\ell}{\lambda_0 d}\right|\).</p>
    <p><strong>Q4.</strong> \(i = \lambda_0 D/a\) \(= 540\times10^{-9}\times1{,}50/(0{,}80\times10^{-3})\) \(= 1{,}01\ \text{mm}\). Première annulation : \(\pi a\ell_1/(\lambda_0 d) = \pi\), soit \(\ell_1 = \dfrac{\lambda_0 d}{a}\) \(= \dfrac{540\times10^{-9}\times0{,}40}{0{,}80\times10^{-3}} = 0{,}27\ \text{mm}\). Critère semi-quantitatif : du centre au bord (\(b = \ell/2\)), \(\Delta p = \dfrac{a\ell}{2\lambda_0 d} \lesssim \dfrac12\) donne \(\ell \lesssim \lambda_0 d/a\) : même seuil, le critère encadre bien la disparition des franges.</p>
    <p><strong>Q5.</strong> \(\Gamma \ge 0{,}90\) impose \(\pi a\ell/(\lambda_0 d) \le \pi/4\), soit \(\ell \le \ell_1/4 \approx 68\ \mu\text{m}\) : une fente très fine, donc peu de lumière.</p>
    <p><strong>Q6.</strong> Pour \(\ell_1 \lt \ell \lt 2\ell_1\), le sinus cardinal est négatif : les franges réapparaissent, faiblement contrastées (\(\Gamma\) au plus \(0{,}22\), vers \(\ell \approx 1{,}43\,\ell_1\)), et <strong>inversées</strong> (frange sombre en \(x = 0\)). Le contraste repasse par zéro en \(\ell = 2\ell_1\), etc. Fente tournée : sa dimension parallèle à \(F_2F_1\) vaut 5 mm, soit environ \(19\,\ell_1\) : \(\Gamma \lt 0{,}02\), l'écran est uniformément éclairé.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Au Michelson : épaisseur de la lame d'air, doublet du sodium, indice d'une lamelle</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>interféromètre de Michelson, cohérence temporelle</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un interféromètre de Michelson comporte une séparatrice, une compensatrice et deux miroirs \(M_1\) (fixe) et \(M_2\) (monté sur un chariot translaté par une vis micrométrique, lecture au centième de millimètre). L'air a pour indice 1. Les parties A, B et C sont largement indépendantes.
  </div>

  <p class="exo-part">Partie A — Réglage en lame d'air et mesure de l'épaisseur</p>
  <div class="q"><strong>A1.</strong> Préciser le rôle de la compensatrice. Définir le montage équivalent et indiquer la condition sur \(M_1\) et \(M_2\) pour obtenir une lame d'air.</div>
  <div class="q"><strong>A2.</strong> L'appareil, éclairé par une lampe à sodium (on prend ici \(\lambda_m = 589{,}3\ \text{nm}\) et l'on ignore le doublet), donne des anneaux. Comment les projeter sur un écran ? On dispose d'une lentille de focale \(f' = 1{,}000\ \text{m}\).</div>
  <div class="q"><strong>A3.</strong> On mesure les rayons des cinq premiers anneaux brillants à partir du centre :</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.4rem 0">
    <tr style="border-bottom:2px solid var(--grid)"><th style="text-align:left;padding:.35rem">\(k\)</th><td style="padding:.35rem">1</td><td style="padding:.35rem">2</td><td style="padding:.35rem">3</td><td style="padding:.35rem">4</td><td style="padding:.35rem">5</td></tr>
    <tr><th style="text-align:left;padding:.35rem">\(R_k\) (mm)</th><td style="padding:.35rem">17,6</td><td style="padding:.35rem">26,5</td><td style="padding:.35rem">33,1</td><td style="padding:.35rem">38,6</td><td style="padding:.35rem">43,4</td></tr>
  </table></div>
  <div class="q">Montrer que \(R_k^2\) est une fonction affine de \(k\). En déduire l'épaisseur \(e\) de la lame d'air et la partie fractionnaire \(\varepsilon\) de l'ordre au centre.</div>
  <div class="q"><strong>A4.</strong> Dans quel sens faut-il translater \(M_2\) pour s'approcher du contact optique ? Décrire ce qu'on observe pendant ce déplacement et au contact optique.</div>

  <p class="exo-part">Partie B — Le doublet jaune du sodium</p>
  <div class="q"><strong>B1.</strong> La lampe émet en réalité deux raies de même intensité, \(\lambda_1 = 589{,}00\ \text{nm}\) et \(\lambda_2 = 589{,}59\ \text{nm}\). Au centre de la figure (\(\delta = 2e\)), exprimer l'éclairement en fonction de \(e\), puis le contraste \(\Gamma(e)\).</div>
  <div class="q"><strong>B2.</strong> Calculer la translation \(\Delta e\) qui sépare deux anticoïncidences successives. Que vaut le contraste dans la situation de la partie A ? Le traitement monochromatique de A était-il justifié ?</div>
  <div class="q"><strong>B3.</strong> Expérimentalement, on repère la 1ʳᵉ et la 6ᵉ anticoïncidence aux lectures \(0{,}145\ \text{mm}\) et \(1{,}617\ \text{mm}\) de la vis. En déduire \(\Delta\lambda\) et son incertitude, en prenant \(0{,}01\ \text{mm}\) d'incertitude sur chaque lecture.</div>

  <p class="exo-part">Partie C — Indice d'une lamelle de verre en lumière blanche</p>
  <div class="q"><strong>C1.</strong> L'appareil est ramené au contact optique, puis réglé en coin d'air de petit angle, et éclairé en lumière blanche. Décrire la figure au voisinage des miroirs et justifier qu'on ne voie que quelques franges colorées.</div>
  <div class="q"><strong>C2.</strong> On place devant \(M_1\), perpendiculairement au faisceau, une lamelle de verre d'épaisseur \(e_v\) et d'indice \(n\). Montrer que les franges colorées disparaissent. De combien, et dans quel sens, faut-il translater \(M_2\) pour les retrouver ?</div>
  <div class="q"><strong>C3.</strong> La translation nécessaire vaut \(\Delta x = 79{,}5\ \mu\text{m}\) (à \(0{,}5\ \mu\text{m}\) près) et l'épaisseur mesurée au palmer vaut \(e_v = 150\ \mu\text{m}\) (à \(1\ \mu\text{m}\) près). Calculer \(n\) et son incertitude. Quel indice mesure-t-on réellement ?</div>
  <div class="q"><strong>C4.</strong> Pourquoi cette mesure serait-elle impossible avec la seule lampe à sodium ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> La compensatrice, identique à la séparatrice et parallèle à elle, fait traverser aux deux rayons la même épaisseur de verre : la différence de marche ne dépend plus que des trajets dans l'air, quels que soient l'incidence et la longueur d'onde. Montage équivalent : on remplace \(M_2\) par son image \(M_2'\) par la séparatrice ; l'appareil équivaut à une lame d'air entre \(M_1\) et \(M_2'\). Lame d'air : \(M_1 \parallel M_2'\), c'est-à-dire \(M_1 \perp M_2\).</p>
    <p><strong>A2.</strong> Les anneaux sont localisés à l'infini : on place l'écran dans le plan focal image de la lentille, à 1,000 m de celle-ci, la lentille étant placée à la sortie de l'appareil, d'axe perpendiculaire à \(M_1\). On éclaire en lumière convergente (condenseur) pour obtenir de nombreuses incidences.</p>
    <p><strong>A3.</strong> \(p(\theta) \approx p_0(1 - \theta^2/2)\) avec \(p_0 = 2e/\lambda_m = k_0 + \varepsilon\). Le \(k\)-ième anneau a l'ordre \(k_0 - k + 1\), donc \(\theta_k^2 = 2(k - 1 + \varepsilon)/p_0\) et</p>
    <div class="formula">$$R_k^2 = f'^2\theta_k^2 = \frac{f'^2\lambda_m}{e}\,(k - 1 + \varepsilon)$$</div>
    <p>Les carrés valent 310, 702, 1096, 1490, 1884 mm² : différences successives 392, 393, 394, 394 mm², quasi constantes. Pente (régression) \(\approx 393\ \text{mm}^2\), d'où \(e = \dfrac{f'^2\lambda_m}{393\times10^{-6}}\) \(= \dfrac{1{,}000^2\times589{,}3\times10^{-9}}{393\times10^{-6}}\) \(= 1{,}50\ \text{mm}\). Ordonnée : \(R_1^2 = 393\,\varepsilon\), donc \(\varepsilon = 310/393 \approx 0{,}79\).</p>
    <p><strong>A4.</strong> Il faut diminuer \(e\), c'est-à-dire rapprocher \(M_2'\) de \(M_1\) : on translate \(M_2\) dans le sens qui fait <strong>rentrer</strong> les anneaux au centre. Ils disparaissent un à un (un anneau pour \(\lambda_m/2\) de translation), s'élargissent et deviennent moins nombreux. Au contact optique, l'éclairement est uniforme (teinte plate).</p>
    <p><strong>B1.</strong> Les deux raies sont incohérentes : on somme leurs éclairements, \(\mathcal{E} = 2\mathcal{E}_0[1 + \cos(4\pi e/\lambda_1)]\) \(+\ 2\mathcal{E}_0[1 + \cos(4\pi e/\lambda_2)]\). Avec \(\sigma_{1,2} = 1/\lambda_{1,2}\) et \(\cos A + \cos B = 2\cos\frac{A+B}{2}\cos\frac{A-B}{2}\) :</p>
    <div class="formula">$$\mathcal{E} = 4\mathcal{E}_0\big[1 + \cos(2\pi\Delta\sigma\,e)\cos(4\pi\sigma_m e)\big]$$</div>
    <div class="formula">$$\Gamma(e) = \left|\cos\frac{2\pi\,e\,\Delta\lambda}{\lambda_m^2}\right|$$</div>
    <p>avec \(\Delta\sigma = \sigma_1 - \sigma_2 \approx \Delta\lambda/\lambda_m^2\), \(\Delta\lambda = 0{,}59\ \text{nm}\) et \(\lambda_m = 589{,}30\ \text{nm}\).</p>
    <p><strong>B2.</strong> \(\Gamma = 0\) pour \(2e\Delta\lambda/\lambda_m^2 = k + \tfrac12\) : \(\Delta e = \dfrac{\lambda_m^2}{2\Delta\lambda}\) \(= \dfrac{(589{,}3\times10^{-9})^2}{2\times0{,}59\times10^{-9}} = 0{,}294\ \text{mm}\). Pour \(e = 1{,}50\ \text{mm}\) : \(2e\Delta\lambda/\lambda_m^2 = 5{,}10\), \(\Gamma = |\cos(5{,}10\,\pi)| = 0{,}95\). Les anneaux sont très contrastés et les deux systèmes presque confondus (la position d'un anneau varie très peu entre les deux raies) : le traitement monochromatique était justifié.</p>
    <p><strong>B3.</strong> Cinq intervalles : \(5\,\Delta e = 1{,}617 - 0{,}145 = 1{,}472\ \text{mm}\), \(\Delta e = 0{,}2944\ \text{mm}\). \(\Delta\lambda = \dfrac{\lambda_m^2}{2\Delta e}\) \(= \dfrac{(589{,}3\times10^{-9})^2}{2\times0{,}2944\times10^{-3}} = 0{,}590\ \text{nm}\). Incertitude sur la différence de deux lectures : \(0{,}01\sqrt2 \approx 0{,}014\ \text{mm}\) sur \(1{,}472\ \text{mm}\), soit \(1\ \%\) : \(\Delta\lambda = 0{,}590 \pm 0{,}006\ \text{nm}\). Repérer plusieurs anticoïncidences améliore la précision. (La position de la 1ʳᵉ, \(0{,}145\ \text{mm}\approx\Delta e/2\), confirme que la vis est à zéro au contact optique.)</p>
    <p><strong>C1.</strong> Près de l'arête (épaisseur nulle) se trouve une frange achromatique (sombre ou blanche selon le déphasage de la séparatrice), encadrée de quelques franges irisées (teintes de Newton), puis un blanc d'ordre supérieur uniforme. La lumière blanche a une longueur de cohérence \(L_c = \lambda_m^2/\Delta\lambda \approx 1\ \mu\text{m}\) : les couleurs ne sont visibles que pour \(|\delta| \lesssim 1\ \mu\text{m}\), soit deux ou trois franges.</p>
    <p><strong>C2.</strong> La lamelle, traversée à l'aller et au retour, remplace \(2e_v\) d'air par \(2e_v\) de verre : le chemin optique du bras 1 augmente de \(2(n-1)e_v\), environ \(160\ \mu\text{m}\), bien plus que \(L_c\) : le champ devient uniformément blanc. Pour revenir à \(\delta = 0\), il faut allonger le bras 2 du même chemin optique, soit un aller-retour : on <strong>éloigne \(M_2\)</strong> de la séparatrice de \(\Delta x = (n - 1)e_v\).</p>
    <p><strong>C3.</strong> \(n = 1 + \dfrac{\Delta x}{e_v} = 1 + \dfrac{79{,}5}{150} = 1{,}530\). Incertitude relative sur \(n - 1\) : \(\sqrt{(0{,}5/79{,}5)^2 + (1/150)^2} \approx 0{,}9\ \%\), d'où \(u(n) \approx 0{,}005\) : \(n = 1{,}530 \pm 0{,}005\). En lumière blanche, c'est la frange achromatique qu'on recherche : à cause de la dispersion du verre, on mesure en réalité l'<strong>indice de groupe</strong> \(n_g = n - \lambda\,\mathrm{d}n/\mathrm{d}\lambda\), légèrement supérieur à l'indice de phase.</p>
    <p><strong>C4.</strong> Avec la lampe à sodium (\(L_c\) de l'ordre du centimètre), l'insertion de la lamelle décale la figure de \(2(n-1)e_v/\lambda_m \approx 270\) franges, mais la figure obtenue est identique à une fraction de frange près : impossible de savoir combien de franges ont défilé, puisque la lamelle est insérée d'un coup. La lumière blanche fournit un repère absolu, la frange \(\delta = 0\).</p>
  </div>
