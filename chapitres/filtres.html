<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 1.5 « Filtrage linéaire » du programme de PTSI et, de la partie 1.4, la représentation complexe du régime sinusoïdal forcé et les impédances complexes : <strong>c'est l'exposé de référence du site</strong> sur ces outils, que les chapitres « Circuit RLC série » (résonance) et « Oscillateurs harmoniques » (régime forcé mécanique) appliquent. Il s'appuie sur « Signaux périodiques et spectres » (valeurs moyenne et efficace, spectre fourni, linéarité). Le programme le dit lui-même : l'objectif n'est pas la virtuosité dans le calcul des fonctions de transfert, mais l'interprétation de ce que devient un signal en traversant un filtre.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Régime forcé</strong> (partie 1.4) : utiliser la représentation complexe pour étudier le régime sinusoïdal forcé (§1).</li>
        <li><strong>Impédances complexes</strong> (partie 1.4) : établir et citer l'impédance d'une résistance, d'un condensateur, d'une bobine (§2).</li>
        <li><strong>Association de deux impédances</strong> (partie 1.4) : remplacer une association série ou parallèle de deux impédances par une impédance équivalente ; mesurer une impédance sur un diviseur de tension (§3).</li>
        <li><strong>Fonction de transfert harmonique</strong> : gain, gain en décibels, phase ; utiliser une fonction de transfert donnée d'ordre 1 ou 2 pour étudier la réponse à une excitation sinusoïdale (§4, §6, §7).</li>
        <li><strong>Diagramme de Bode</strong> : utiliser les échelles logarithmiques et interpréter les zones rectilignes d'après l'expression de la fonction de transfert (§5) ; tracer le diagramme de Bode (amplitude et phase) d'une fonction de transfert d'ordre 1 (§6).</li>
        <li><strong>Modèles de filtres passifs</strong> : passe-bas et passe-haut d'ordre 1 (§6), passe-bas et passe-bande d'ordre 2 (§7).</li>
        <li><strong>Action d'un filtre</strong> sur une somme finie d'excitations sinusoïdales ou sur un signal périodique ; étudier le filtrage d'un signal non sinusoïdal à partir d'une analyse spectrale (§8).</li>
        <li><strong>Moyenneur, intégrateur, dérivateur</strong> : expliciter les conditions d'utilisation d'un filtre en tant que tel (§9).</li>
        <li><strong>Cahier des charges et mise en cascade</strong> : choisir un modèle de filtre en fonction d'un cahier des charges ; expliquer l'intérêt de réaliser des filtres de faible impédance de sortie et de forte impédance d'entrée (§10).</li>
        <li><strong>Filtrage mécanique</strong> : expliquer la nature du filtrage introduit par un dispositif mécanique (sismomètre, amortisseur, accéléromètre) (§11).</li>
        <li><strong>Capacité numérique</strong> : simuler, à l'aide d'un langage de programmation, l'action d'un filtre sur un signal périodique dont le spectre est fourni ; mettre en évidence l'influence des caractéristiques du filtre sur l'opération de filtrage (§12).</li>
      </ul>
      <p>La détection d'un comportement non linéaire par l'apparition de nouvelles fréquences est traitée dans « Signaux périodiques et spectres », §8. Hors programme en PTSI, regroupés en fin de chapitre : le passe-haut et le coupe-bande d'ordre 2, le calcul de la pulsation de résonance d'un passe-bas d'ordre 2, les filtres d'ordre supérieur. Les filtres actifs à amplificateur linéaire intégré sont étudiés en 2ᵉ année.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · RÉGIME SINUSOÏDAL FORCÉ ET NOTATION COMPLEXE</div>
  <h2>Remplacer les dérivées par des multiplications</h2>
  <div class="intro">Un circuit linéaire alimenté par une source sinusoïdale finit, une fois le régime transitoire éteint, par osciller tout entier à la fréquence de la source. Trouver l'amplitude et la phase de chaque grandeur demande alors de résoudre une équation différentielle pour une solution sinusoïdale : la notation complexe transforme ce calcul en algèbre.</div>
  <div class="def-box">
    Un circuit linéaire (résistances, condensateurs, bobines, sources) soumis à une source sinusoïdale de pulsation \(\omega\) atteint, après un régime transitoire de durée de l'ordre de quelques constantes de temps, le <strong>régime sinusoïdal forcé</strong> : toutes les tensions et toutes les intensités sont sinusoïdales, de même pulsation \(\omega\) que la source. Seules leurs amplitudes et leurs phases restent à trouver.
  </div>
  <div class="def-box">
    À la grandeur réelle \(x(t) = X_m\cos(\omega t + \varphi)\), on associe la <strong>grandeur complexe</strong>
    <div class="formula" data-nom="Grandeur complexe associée">$$\underline x(t) = X_m\,e^{j(\omega t + \varphi)} = \underline X_m\,e^{j\omega t}\qquad\text{avec}\qquad \underline X_m = X_m\,e^{j\varphi}$$</div>
    \(\underline X_m\) est l'<strong>amplitude complexe</strong> : son module est l'amplitude \(X_m\), son argument la phase à l'origine \(\varphi\). On revient au réel par \(x(t) = \mathrm{Re}\big(\underline x(t)\big)\). En électricité, on note \(j\) le nombre complexe tel que \(j^2 = -1\), pour ne pas le confondre avec une intensité \(i\).
  </div>
  <div class="prop-box">
    <strong>Dériver, c'est multiplier par \(j\omega\).</strong> \(\dfrac{\mathrm{d}\underline x}{\mathrm{d}t} = j\omega\,\underline x\), donc l'amplitude complexe de \(\mathrm{d}x/\mathrm{d}t\) est \(j\omega\,\underline X_m\) ; celle de la primitive de moyenne nulle de \(x\) est \(\underline X_m/(j\omega)\). Les lois de Kirchhoff, linéaires, s'écrivent telles quelles avec les amplitudes complexes : une équation différentielle linéaire à coefficients constants devient une équation algébrique.
  </div>
  <p>Multiplier par \(j = e^{j\pi/2}\) revient à avancer la phase de \(\pi/2\) sans changer l'amplitude : la dérivée d'une sinusoïde est en quadrature avance sur elle, et son amplitude est multipliée par \(\omega\). Le rapport de deux amplitudes complexes de même pulsation donne à la fois le rapport des amplitudes (module) et le déphasage (argument), au sens du chapitre « Signaux périodiques et spectres », §2.</p>
  <div class="method-box">
    <strong>Exemple — tension aux bornes du condensateur d'un circuit RC</strong>
    <p>Un générateur \(e(t) = E_m\cos\omega t\) alimente \(R = 1{,}0\ \text{k}\Omega\) en série avec \(C = 1{,}0\ \mu\text{F}\), à \(f = 200\ \text{Hz}\). La loi des mailles donne \(RC\,\dfrac{\mathrm{d}u}{\mathrm{d}t} + u = e\) pour la tension \(u\) aux bornes du condensateur.</p>
    <ol>
      <li>En complexes : \(jRC\omega\,\underline U_m + \underline U_m = E_m\), donc \(\underline U_m = \dfrac{E_m}{1 + jRC\omega}\).</li>
      <li>\(\omega = 2\pi f = 1\,257\ \text{rad·s}^{-1}\) et \(RC\omega = 1{,}26\) : \(U_m = \dfrac{E_m}{\sqrt{1 + 1{,}26^2}} = 0{,}62\,E_m\).</li>
      <li>\(\varphi = -\arctan(1{,}26) = -51^\circ\) : \(u(t) = 0{,}62\,E_m\cos(\omega t - 51^\circ)\), en retard sur \(e\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la notation complexe à un produit. La partie réelle d'un produit n'est pas le produit des parties réelles : une puissance instantanée \(u(t)\,i(t)\) se calcule avec les grandeurs réelles. Autre piège : l'amplitude complexe \(\underline X_m\) ne dépend pas du temps ; écrire \(\underline X_m(t)\) ou mélanger dans une même équation grandeurs réelles et complexes conduit à des erreurs.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · IMPÉDANCES COMPLEXES</div>
  <h2>La loi d'Ohm généralisée</h2>
  <div class="intro">En régime sinusoïdal forcé, la tension aux bornes d'un dipôle linéaire est proportionnelle à l'intensité qui le traverse, à condition d'utiliser les amplitudes complexes. Le coefficient, l'impédance, généralise la résistance : il dit à la fois de combien la tension est plus grande que le courant et de combien elle est décalée.</div>
  <div class="def-box">
    Pour un dipôle linéaire en <strong>convention récepteur</strong>, l'<strong>impédance complexe</strong> est
    <div class="formula" data-nom="Impédance complexe">$$\underline Z = \frac{\underline U_m}{\underline I_m}\qquad\text{(en ohms)}$$</div>
    Son module \(|\underline Z| = U_m/I_m\) est le rapport des amplitudes ; son argument est le déphasage de la tension par rapport au courant. Son inverse \(\underline Y = 1/\underline Z\) est l'<strong>admittance</strong> (en siemens).
  </div>
  <div class="prop-box">
    <strong>Impédances des trois dipôles élémentaires.</strong>
    <div class="formula" data-nom="Impédances de R, L et C">$$\underline Z_R = R\qquad\underline Z_L = jL\omega\qquad\underline Z_C = \frac{1}{jC\omega} = -\frac{j}{C\omega}$$</div>
    <ul>
      <li>Résistance : tension et courant en phase.</li>
      <li>Bobine : \(|\underline Z_L| = L\omega\), la tension est en avance de \(\pi/2\) sur le courant.</li>
      <li>Condensateur : \(|\underline Z_C| = 1/(C\omega)\), la tension est en retard de \(\pi/2\) sur le courant.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir les trois impédances</span>
    <div class="content">
      <p>En convention récepteur : \(u = Ri\) donne \(\underline U_m = R\,\underline I_m\). Pour la bobine, \(u = L\,\mathrm{d}i/\mathrm{d}t\) devient \(\underline U_m = jL\omega\,\underline I_m\). Pour le condensateur, \(i = C\,\mathrm{d}u/\mathrm{d}t\) devient \(\underline I_m = jC\omega\,\underline U_m\), soit \(\underline U_m = \underline I_m/(jC\omega)\).</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Comportements limites</strong> (indispensables pour prévoir la nature d'un filtre) :
    <ul>
      <li>aux <strong>basses fréquences</strong> (\(\omega \to 0\)) : \(\underline Z_L \to 0\), la bobine se comporte comme un <strong>fil</strong> ; \(|\underline Z_C| \to \infty\), le condensateur comme un <strong>interrupteur ouvert</strong> (on retrouve le régime continu permanent) ;</li>
      <li>aux <strong>hautes fréquences</strong> (\(\omega \to \infty\)) : la bobine se comporte comme un interrupteur ouvert, le condensateur comme un fil.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — ordres de grandeur</strong>
    <ol>
      <li>Condensateur de 100 nF : \(|\underline Z_C| = 32\ \text{k}\Omega\) à 50 Hz, \(1{,}6\ \text{k}\Omega\) à 1 kHz, \(1{,}6\ \Omega\) à 1 MHz.</li>
      <li>Bobine de 10 mH : \(3{,}1\ \Omega\) à 50 Hz, \(63\ \Omega\) à 1 kHz, \(63\ \text{k}\Omega\) à 1 MHz.</li>
      <li>Si cette bobine est parcourue par un courant d'amplitude 20 mA à 1 kHz, la tension à ses bornes a pour amplitude \(L\omega I_m = 62{,}8 \times 0{,}020 = 1{,}3\ \text{V}\), en avance de \(\pi/2\) sur le courant.</li>
    </ol>
  </div>
  <p>Une <strong>bobine réelle</strong> a la résistance \(r\) de son fil : \(\underline Z = r + jL\omega\). Aux basses fréquences, c'est \(r\) qui domine ; la bobine devient « inductive » au-delà de \(\omega = r/L\).</p>
  <div class="notice"><strong>Erreur classique</strong> : \(\underline Z_C = jC\omega\) (c'est l'admittance du condensateur, pas son impédance). Contrôle immédiat : en continu (\(\omega = 0\)), un condensateur ne laisse passer aucun courant, son impédance doit donc être infinie.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ASSOCIATIONS, LOIS DES CIRCUITS ET DIVISEURS</div>
  <h2>Tout ce qui valait en continu reste vrai, en complexes</h2>
  <div class="intro">Les lois des nœuds et des mailles s'écrivent avec les amplitudes complexes ; les impédances s'associent donc comme les résistances, et les diviseurs de tension et de courant restent valables. On réutilise ainsi tous les outils du chapitre « Lois de l'électrocinétique — régime continu ».</div>
  <div class="prop-box">
    <strong>Association de deux impédances.</strong>
    <div class="formula" data-nom="Impédances en série et en parallèle">$$\text{série : } \underline Z = \underline Z_1 + \underline Z_2\qquad\text{parallèle : } \frac{1}{\underline Z} = \frac{1}{\underline Z_1} + \frac{1}{\underline Z_2},\ \text{soit}\ \underline Z = \frac{\underline Z_1\underline Z_2}{\underline Z_1 + \underline Z_2}$$</div>
  </div>
  <div class="prop-box">
    <strong>Diviseur de tension.</strong> Deux impédances en série, parcourues par le même courant (rien n'est branché en dérivation sur \(\underline Z_2\)), sous la tension \(\underline U\) :
    <div class="formula" data-nom="Diviseur de tension en complexes">$$\underline U_2 = \frac{\underline Z_2}{\underline Z_1 + \underline Z_2}\,\underline U$$</div>
    De même, un courant \(\underline I\) se partage entre deux impédances en parallèle selon \(\underline I_2 = \dfrac{\underline Z_1}{\underline Z_1 + \underline Z_2}\,\underline I\) (diviseur de courant).
  </div>

</figure>
  <p><strong>Exemples d'associations.</strong> Le RLC série a pour impédance \(\underline Z = R + j\left(L\omega - \dfrac{1}{C\omega}\right)\) : son module est minimal, égal à \(R\), quand \(L\omega = 1/(C\omega)\), c'est-à-dire à \(\omega_0 = 1/\sqrt{LC}\) ; c'est la résonance en intensité (chapitre « Circuit RLC série », §6). Une bobine et un condensateur idéaux en parallèle ont pour impédance \(\dfrac{jL\omega}{1 - LC\omega^2}\), infinie à \(\omega_0\) : ce « circuit bouchon » bloque cette fréquence.</p>
  <div class="method-box">
    <strong>Exemple — résistance et condensateur en parallèle</strong>
    <p>\(R = 1{,}0\ \text{k}\Omega\) en parallèle avec \(C = 100\ \text{nF}\), à 1,0 kHz.</p>
    <ol>
      <li>\(\underline Z = \dfrac{R \times \frac{1}{jC\omega}}{R + \frac{1}{jC\omega}} = \dfrac{R}{1 + jRC\omega}\), avec \(RC\omega = 0{,}63\).</li>
      <li>\(|\underline Z| = \dfrac{1\,000}{\sqrt{1 + 0{,}63^2}} = 847\ \Omega\) : moins que chacune des deux branches (\(1{,}0\ \text{k}\Omega\) et \(1{,}6\ \text{k}\Omega\)), comme pour deux résistances en parallèle.</li>
      <li>\(\arg\underline Z = -\arctan(0{,}63) = -32^\circ\) : la tension est en retard sur le courant total, le dipôle est « capacitif ».</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — mesurer une impédance inconnue en TP</strong>
    <p>On place le dipôle inconnu en série avec une résistance connue \(R_0 = 100\ \Omega\), sous une tension sinusoïdale à 1,0 kHz. L'oscilloscope montre : amplitude de \(u_Z\) 2,0 V, amplitude de \(u_{R_0}\) 0,50 V, \(u_Z\) en avance de \(60^\circ\) sur \(u_{R_0}\).</p>
    <ol>
      <li>\(u_{R_0} = R_0\,i\) est en phase avec le courant : \(\underline I_m = \underline U_{R_0}/R_0\), et \(\underline Z = R_0\,\dfrac{\underline U_Z}{\underline U_{R_0}}\).</li>
      <li>\(|\underline Z| = 100 \times 2{,}0/0{,}50 = 400\ \Omega\), \(\arg\underline Z = +60^\circ\) : \(\underline Z = 200 + 346\,j\ \Omega\).</li>
      <li>Partie réelle positive et partie imaginaire positive : une bobine réelle, \(r = 200\ \Omega\) et \(L = 346/(2\pi \times 1\,000) = 55\ \text{mH}\).</li>
    </ol>
    <p>Attention aux masses : l'oscilloscope mesure deux tensions qui ont un point commun relié à sa masse ; on place ce point entre \(\underline Z\) et \(R_0\) et on inverse une des voies.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : ajouter des modules. Une résistance de \(1\ \text{k}\Omega\) en série avec un condensateur d'impédance \(-j \times 1\ \text{k}\Omega\) forment une impédance de module \(\sqrt2\ \text{k}\Omega \approx 1{,}4\ \text{k}\Omega\), pas \(2\ \text{k}\Omega\). De même, les amplitudes des tensions d'une maille ne s'additionnent pas (figure ci-dessus).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · FONCTION DE TRANSFERT, GAIN ET PHASE</div>
  <h2>Ce que fait un filtre à une sinusoïde</h2>
  <div class="intro">Un filtre est un quadripôle (deux bornes d'entrée, deux bornes de sortie) qui transmet certaines fréquences et en atténue d'autres. En régime sinusoïdal forcé, une seule fonction complexe de la pulsation résume tout son effet : la fonction de transfert.</div>
  <div class="def-box">
    Pour une tension d'entrée \(u_e = U_{em}\cos(\omega t)\) et la tension de sortie \(u_s\) en <strong>sortie ouverte</strong> (aucun courant prélevé en sortie), la <strong>fonction de transfert harmonique</strong> est
    <div class="formula" data-nom="Fonction de transfert harmonique">$$\underline H(j\omega) = \frac{\underline U_{sm}}{\underline U_{em}}$$</div>
    On définit le <strong>gain</strong> \(G(\omega) = |\underline H(j\omega)|\), le <strong>gain en décibels</strong> \(G_{\text{dB}} = 20\log G\) (logarithme décimal) et la <strong>phase</strong> \(\varphi(\omega) = \arg\underline H(j\omega)\), déphasage de la sortie par rapport à l'entrée.
  </div>
  <div class="prop-box">
    <strong>Réponse à une entrée sinusoïdale.</strong> Si \(u_e = U_{em}\cos(\omega t + \psi)\), alors en régime forcé
    <div class="formula" data-nom="Réponse sinusoïdale d'un filtre">$$u_s(t) = G(\omega)\,U_{em}\cos\big(\omega t + \psi + \varphi(\omega)\big)$$</div>
    L'amplitude est multipliée par le gain, la phase décalée de \(\varphi\) : la fréquence ne change pas (filtre linéaire).
  </div>
  <div class="table-wrap"><table>
    <tr><th>Gain \(G\)</th><th>1000</th><th>10</th><th>2</th><th>\(\sqrt2\)</th><th>1</th><th>\(1/\sqrt2\)</th><th>1/2</th><th>0,1</th><th>0,01</th></tr>
    <tr><td>\(G_{\text{dB}}\)</td><td>+60</td><td>+20</td><td>+6</td><td>+3</td><td>0</td><td>−3</td><td>−6</td><td>−20</td><td>−40</td></tr>
  </table></div>
  <p><strong>Pourquoi des décibels ?</strong> Un gain varie sur plusieurs ordres de grandeur : l'échelle logarithmique les rend lisibles. Et quand on enchaîne des étages, les gains se multiplient, donc les gains en décibels s'ajoutent. Le décibel vient des puissances : \(10\log(P_s/P_e)\), et une puissance est proportionnelle au carré d'une tension, d'où le facteur 20. Un gain de \(-3\ \text{dB}\) divise l'amplitude par \(\sqrt2\) et la puissance par 2.</p>
  <p><strong>Fonction de transfert et équation différentielle.</strong> Une fonction de transfert est un quotient de polynômes en \(j\omega\), et chaque facteur \(j\omega\) correspond à une dérivée : \(\underline H = \dfrac{1}{1 + j\omega\tau}\) équivaut à \(\tau\,\dfrac{\mathrm{d}u_s}{\mathrm{d}t} + u_s = u_e\), qui vaut pour une entrée quelconque. L'<strong>ordre</strong> du filtre est le degré du dénominateur ; c'est l'ordre de l'équation différentielle.</p>
  <div class="method-box">
    <strong>Exemple — gain et phase mesurés à l'oscilloscope</strong>
    <p>À 1,0 kHz, l'entrée a pour amplitude 2,0 V, la sortie 1,2 V, et le maximum de la sortie suit celui de l'entrée de 0,10 ms.</p>
    <ol>
      <li>\(G = 1{,}2/2{,}0 = 0{,}60\), soit \(G_{\text{dB}} = 20\log 0{,}60 = -4{,}4\ \text{dB}\).</li>
      <li>La sortie est en retard : \(\varphi = -2\pi\times\dfrac{0{,}10}{1{,}0} = -0{,}63\ \text{rad}\), soit \(-36^\circ\).</li>
      <li>En répétant la mesure à plusieurs fréquences, on construit point par point le diagramme de Bode du filtre.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(G_{\text{dB}} = 10\log G\) pour un rapport de tensions (c'est \(20\log G\)), ou oublier que \(\underline H\) est définie <strong>en sortie ouverte</strong> : si l'on branche une charge en sortie, la fonction de transfert change (§10).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DIAGRAMME DE BODE ET ÉCHELLES LOGARITHMIQUES</div>
  <h2>Des droites là où la fonction de transfert se simplifie</h2>
  <div class="intro">Le diagramme de Bode représente le comportement d'un filtre sur toutes les fréquences à la fois. Grâce aux échelles logarithmiques, il se résume presque à des segments de droite, que l'on prévoit sans calcul à partir de l'expression de \(\underline H\).</div>
  <div class="def-box">
    Le <strong>diagramme de Bode</strong> est formé de deux courbes tracées en fonction de \(\log\omega\) (ou de \(\log f\)) : le gain en décibels \(G_{\text{dB}}(\omega)\) et la phase \(\varphi(\omega)\). Sur l'axe horizontal, une <strong>décade</strong> est un intervalle où la pulsation est multipliée par 10, une <strong>octave</strong> un intervalle où elle est multipliée par 2.
  </div>
  <div class="prop-box">
    <strong>Zones rectilignes.</strong> Si, dans un domaine de pulsations, la fonction de transfert est équivalente à \(K\,(j\omega)^n\) (avec \(K\) réel et \(n\) entier relatif), alors dans ce domaine
    <div class="formula" data-nom="Asymptote d'un diagramme de Bode">$$G_{\text{dB}} \simeq 20\log|K| + 20\,n\log\omega\qquad\text{et}\qquad\varphi \simeq n\,\frac{\pi}{2}\ \ (+\pi\ \text{si}\ K \lt 0)$$</div>
    En échelle logarithmique, le gain est une droite de pente \(20n\ \text{dB}\) par décade (\(6n\ \text{dB}\) par octave), et la phase est constante. Chaque asymptote d'un diagramme de Bode se lit ainsi sur l'équivalent de \(\underline H\) aux basses ou aux hautes fréquences.
  </div>
  <ul>
    <li>Pente nulle : le filtre transmet avec un gain constant ; pente \(-20\ \text{dB}\) par décade : l'amplitude est divisée par 10 quand la fréquence est multipliée par 10 ; \(-40\ \text{dB}\) par décade : divisée par 100.</li>
    <li>Pour un produit \(\underline H = \underline H_1\underline H_2\), les gains en décibels et les phases s'ajoutent : on construit le diagramme d'un filtre complexe en additionnant ceux de ses facteurs.</li>
    <li>La <strong>bande passante à \(-3\ \text{dB}\)</strong> est l'intervalle des pulsations où \(G \geq G_{\max}/\sqrt2\), soit \(G_{\text{dB}} \geq G_{\text{dB},\max} - 3\) ; ses bornes sont les <strong>pulsations de coupure</strong>.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — lire une pente</strong>
    <p>Sur le diagramme de gain d'un filtre, on relève \(-12\ \text{dB}\) à 20 kHz et \(-52\ \text{dB}\) à 200 kHz, sur une partie rectiligne.</p>
    <ol>
      <li>La pente vaut \(-40\ \text{dB}\) par décade : aux hautes fréquences, \(\underline H\) est équivalente à \(K/(j\omega)^2\) ; le filtre est au moins d'ordre 2.</li>
      <li>Une sinusoïde de 200 kHz est transmise avec un gain \(10^{-52/20} = 2{,}5\times10^{-3}\) : une entrée de 1 V donne 2,5 mV en sortie.</li>
      <li>La phase dans cette zone tend vers \(-180^\circ\) (si \(K \gt 0\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : lire une pente « par octave » sur une décade, ou graduer l'axe en \(\omega\) quand l'énoncé donne \(f\). Les asymptotes ne dépendent pas du choix (\(\omega\) ou \(f\)), mais les valeurs des pulsations de coupure, si : \(\omega_c = 2\pi f_c\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · FILTRES DU PREMIER ORDRE</div>
  <h2>Passe-bas et passe-haut</h2>
  <div class="intro">Une résistance et un condensateur suffisent à réaliser les deux filtres les plus utilisés : le passe-bas, qui lisse un signal ou élimine un bruit de haute fréquence, et le passe-haut, qui supprime une composante continue ou une dérive lente. Leur diagramme de Bode est le seul que le programme demande de savoir tracer.</div>
  <div class="def-box">
    <strong>Passe-bas du premier ordre</strong>, de gain statique \(H_0\) et de pulsation de coupure \(\omega_c\), et <strong>passe-haut du premier ordre</strong> :
    <div class="formula" data-nom="Passe-bas et passe-haut du premier ordre">$$\underline H_{\text{PB}} = \frac{H_0}{1 + j\dfrac{\omega}{\omega_c}}\qquad\qquad \underline H_{\text{PH}} = \frac{H_0\,j\dfrac{\omega}{\omega_c}}{1 + j\dfrac{\omega}{\omega_c}}$$</div>
  </div>
  <h3>Réalisation et étude du passe-bas</h3>
  <p>Cellule RC, sortie aux bornes du condensateur : par le diviseur de tension (sortie ouverte), \(\underline H = \dfrac{1/(jC\omega)}{R + 1/(jC\omega)} = \dfrac{1}{1 + jRC\omega}\). C'est un passe-bas avec \(H_0 = 1\) et \(\omega_c = 1/(RC)\). Une résistance \(R\) en sortie d'une bobine \(L\) en série donne de même \(\omega_c = R/L\).</p>

    <strong>Méthode — tracer le diagramme de Bode d'un passe-bas du premier ordre</strong> (avec \(x = \omega/\omega_c\))
    <ol>
      <li>Basses fréquences (\(x \ll 1\)) : \(\underline H \approx H_0\). Asymptote horizontale \(G_{\text{dB}} = 20\log H_0\) ; phase 0.</li>
      <li>Hautes fréquences (\(x \gg 1\)) : \(\underline H \approx \dfrac{H_0}{jx}\). Asymptote de pente \(-20\ \text{dB}\) par décade, qui coupe la précédente en \(x = 1\) ; phase \(-\pi/2\).</li>
      <li>Valeurs exactes : \(G = \dfrac{H_0}{\sqrt{1 + x^2}}\) et \(\varphi = -\arctan x\). En \(x = 1\) : \(G = H_0/\sqrt2\), soit 3 dB sous l'asymptote, et \(\varphi = -\pi/4\). Une décade avant ou après : écart de 0,04 dB et de \(5{,}7^\circ\) seulement.</li>
      <li>Bande passante à \(-3\ \text{dB}\) : \([0, \omega_c]\).</li>
    </ol>
  </div>
  <h3>Réalisation et étude du passe-haut</h3>
  <p>Même cellule, sortie aux bornes de la résistance : \(\underline H = \dfrac{R}{R + 1/(jC\omega)} = \dfrac{jRC\omega}{1 + jRC\omega}\), passe-haut avec \(H_0 = 1\) et \(\omega_c = 1/(RC)\) (et \(\omega_c = R/L\) pour une sortie sur la bobine d'une cellule RL). Aux basses fréquences, \(\underline H \approx jx\) : pente \(+20\ \text{dB}\) par décade, phase \(+\pi/2\) ; aux hautes fréquences, \(\underline H \approx 1\). En \(x = 1\) : \(-3\ \text{dB}\) et \(+\pi/4\). Bande passante : \([\omega_c, +\infty[\).</p>

  <div class="method-box">
    <strong>Exemple — un passe-bas RC</strong>
    <p>\(R = 1{,}0\ \text{k}\Omega\), \(C = 100\ \text{nF}\) ; sortie sur le condensateur.</p>
    <ol>
      <li>\(\omega_c = 1/(RC) = 1{,}0\times10^4\ \text{rad·s}^{-1}\), \(f_c = \omega_c/(2\pi) = 1{,}6\ \text{kHz}\).</li>
      <li>À 100 Hz (\(x = 0{,}063\)) : \(G = 0{,}998\), \(\varphi = -3{,}6^\circ\) : transmis presque sans changement.</li>
      <li>À 10 kHz (\(x = 6{,}3\)) : \(G = 1/\sqrt{1 + 6{,}3^2} = 0{,}16\), soit \(-16\ \text{dB}\), et \(\varphi = -81^\circ\). Une entrée d'amplitude 1,0 V ressort avec 0,16 V.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un gain statique différent de 1</strong>
    <p>Une résistance \(R_1\) en série, puis \(R_2\) en parallèle avec \(C\) en sortie. En notant \(\underline Z_2 = \dfrac{R_2}{1 + jR_2C\omega}\) l'impédance de \(R_2\) parallèle à \(C\), le diviseur de tension donne</p>
    <div class="formula">$$\underline H = \frac{\underline Z_2}{R_1 + \underline Z_2} = \frac{R_2}{R_1 + R_2 + jR_1R_2C\omega} = \frac{H_0}{1 + j\omega/\omega_c},\quad H_0 = \frac{R_2}{R_1 + R_2},\quad \omega_c = \frac{R_1 + R_2}{R_1R_2C}$$</div>
    <ol>
      <li>Avec \(R_1 = R_2 = 10\ \text{k}\Omega\) et \(C = 10\ \text{nF}\) : \(H_0 = 0{,}5\), soit un plateau à \(-6\ \text{dB}\).</li>
      <li>\(\omega_c = 2{,}0\times10^4\ \text{rad·s}^{-1}\) (\(f_c = 3{,}2\ \text{kHz}\)) : le condensateur « voit » \(R_1\) et \(R_2\) en parallèle, \(\omega_c = 1/\big((R_1\parallel R_2)\,C\big)\).</li>
      <li>Contrôle aux limites : en continu le condensateur est ouvert, on retrouve le diviseur résistif \(R_2/(R_1 + R_2)\) ; aux hautes fréquences il court-circuite la sortie.</li>
    </ol>
  </div>
  <p>L'onglet <strong>Simulateur</strong> de ce chapitre trace en direct les diagrammes de Bode des cinq filtres canoniques (passe-bas et passe-haut d'ordres 1 et 2, passe-bande) en fonction de \(H_0\), \(\omega_c\) ou \(\omega_0\) et \(Q\).</p>
  <div class="notice"><strong>Erreur classique</strong> : placer la cassure des asymptotes à \(-3\ \text{dB}\). Les asymptotes se coupent à \(20\log H_0\) en \(\omega_c\), et c'est la courbe réelle qui passe 3 dB plus bas. Autre piège : confondre \(\omega_c = 1/(RC)\) en \(\text{rad·s}^{-1}\) et \(f_c = 1/(2\pi RC)\) en hertz.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · FILTRES DU DEUXIÈME ORDRE</div>
  <h2>Passe-bas et passe-bande, pulsation propre et facteur de qualité</h2>
  <div class="intro">En ajoutant une bobine, on obtient des filtres plus raides (\(\pm40\ \text{dB}\) par décade) et des filtres sélectifs, qui ne laissent passer qu'une bande étroite de fréquences : c'est le principe de l'accord d'un récepteur radio. Leurs paramètres sont ceux de l'oscillateur amorti : pulsation propre \(\omega_0\) et facteur de qualité \(Q\) (chapitre « Oscillateurs harmoniques », §5).</div>
  <div class="def-box">
    Avec la pulsation réduite \(x = \omega/\omega_0\), les filtres du deuxième ordre au programme s'écrivent
    <div class="formula" data-nom="Passe-bas d'ordre 2">$$\underline H_{\text{PB}} = \frac{H_0}{1 + j\dfrac{x}{Q} - x^2}$$</div>
    <div class="formula" data-nom="Passe-bande d'ordre 2">$$\underline H_{\text{PBande}} = \frac{H_0}{1 + jQ\left(x - \dfrac1x\right)} = \frac{H_0\,j\dfrac{x}{Q}}{1 + j\dfrac{x}{Q} - x^2}$$</div>
    Ils ont le même dénominateur \(1 + jx/Q + (jx)^2\), qui traduit une équation différentielle \(\ddot u_s + \dfrac{\omega_0}{Q}\dot u_s + \omega_0^2u_s = \cdots\) : celle de l'oscillateur amorti.
  </div>
  <h3>Le passe-bas d'ordre 2 : RLC série, sortie sur le condensateur</h3>
  <p>Diviseur de tension :</p>
  <div class="formula">$$\underline H = \frac{1/(jC\omega)}{R + jL\omega + 1/(jC\omega)} = \frac{1}{1 + jRC\omega - LC\omega^2}$$</div>
  <p>Par identification, \(\omega_0 = 1/\sqrt{LC}\), \(Q\) tel que \(RC\omega = x/Q\), soit \(Q = \dfrac{1}{RC\omega_0} = \dfrac1R\sqrt{\dfrac LC}\), et \(H_0 = 1\).</p>

  <ul>
    <li>Basses fréquences : \(\underline H \approx H_0\), plateau, phase nulle.</li>
    <li>Hautes fréquences : \(\underline H \approx -H_0/x^2\), pente \(-40\ \text{dB}\) par décade, phase \(-\pi\). Les deux asymptotes se coupent en \(x = 1\).</li>
    <li>En \(\omega = \omega_0\) : \(\underline H = -jQH_0\), donc \(G(\omega_0) = QH_0\) et \(\varphi = -\pi/2\), quel que soit \(Q\). La courbe réelle est \(20\log Q\) au-dessus du point de concours des asymptotes.</li>
    <li><strong>Résonance</strong> : le gain passe par un maximum (supérieur à \(H_0\)) si et seulement si \(Q \gt 1/\sqrt2\), à une pulsation un peu inférieure à \(\omega_0\) ; pour \(Q \gg 1\), ce maximum vaut environ \(QH_0\), en \(\omega \approx \omega_0\) : c'est la surtension aux bornes du condensateur (chapitre « Circuit RLC série », §6). Le calcul exact de cette pulsation n'est pas exigible (voir « Pour aller plus loin »).</li>
    <li>Pour \(Q = 1/\sqrt2\), le gain reste plat le plus longtemps possible puis chute, et \(\omega_0\) est la pulsation de coupure à \(-3\ \text{dB}\) : c'est le réglage habituel d'un passe-bas.</li>
  </ul>
  <h3>Le passe-bande : RLC série, sortie sur la résistance</h3>
  <p>\(\underline H = \dfrac{R}{R + j\left(L\omega - \frac{1}{C\omega}\right)} = \dfrac{1}{1 + jQ\left(x - \frac1x\right)}\), car \(\dfrac{L\omega}{R} = Qx\) et \(\dfrac{1}{RC\omega} = \dfrac{Q}{x}\) (mêmes \(\omega_0\) et \(Q\) que ci-dessus, \(H_0 = 1\)).</p>

<figcaption>Circuit RLC série, sortie aux bornes de la résistance : passe-bande de gain maximal 1 (0 dB) en \(\omega_0\), où la phase s'annule. Aux deux extrémités, pentes de \(+20\) et \(-20\ \text{dB}\) par décade, phases \(+90^\circ\) et \(-90^\circ\). La bande passante à \(-3\ \text{dB}\) (marquée pour \(Q = 5\)) a pour largeur \(\Delta\omega = \omega_0/Q\) : plus \(Q\) est grand, plus le filtre est sélectif.</figcaption>
</figure>
  <ul>
    <li>Le gain est maximal, égal à \(H_0\), en \(\omega = \omega_0\), où la phase est nulle : à la fréquence centrale, la sortie est en phase avec l'entrée.</li>
    <li>Basses fréquences : \(\underline H \approx jH_0x/Q\), pente \(+20\ \text{dB}\) par décade, phase \(+\pi/2\) ; hautes fréquences : \(\underline H \approx H_0/(jQx)\), pente \(-20\ \text{dB}\) par décade, phase \(-\pi/2\). Les asymptotes se coupent en \(\omega_0\), à \(20\log(H_0/Q)\).</li>
  </ul>
  <div class="prop-box">
    <strong>Bande passante du passe-bande.</strong> Les deux pulsations de coupure à \(-3\ \text{dB}\) vérifient \(\omega_1\omega_2 = \omega_0^2\), et
    <div class="formula" data-nom="Bande passante d'un passe-bande">$$\Delta\omega = \omega_2 - \omega_1 = \frac{\omega_0}{Q}$$</div>
    Plus \(Q\) est grand, plus la bande est étroite : le filtre est <strong>sélectif</strong>. C'est le résultat de la résonance en vitesse d'un oscillateur mécanique, démontré au §10 du chapitre « Oscillateurs harmoniques ».
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">\(\Delta\omega = \omega_0/Q\) en deux lignes</span>
    <div class="content">
      <p>\(G = G_{\max}/\sqrt2\) quand \(Q\,|x - 1/x| = 1\), soit \(x^2 \mp x/Q - 1 = 0\). Les racines positives des deux équations sont \(x_{1,2} = \sqrt{1 + \dfrac{1}{4Q^2}} \mp \dfrac{1}{2Q}\) : leur produit vaut 1 et leur différence \(1/Q\), exactement.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — un même circuit RLC, deux filtres</strong>
    <p>\(R = 100\ \Omega\), \(L = 10\ \text{mH}\), \(C = 100\ \text{nF}\).</p>
    <ol>
      <li>\(\omega_0 = 1/\sqrt{LC} = 3{,}16\times10^4\ \text{rad·s}^{-1}\), \(f_0 = 5{,}0\ \text{kHz}\) ; \(Q = \dfrac{1}{100}\sqrt{\dfrac{10^{-2}}{10^{-7}}} = 3{,}2\).</li>
      <li>Sortie sur \(R\) (passe-bande) : bande passante \(\Delta f = f_0/Q = 1{,}6\ \text{kHz}\), centrée géométriquement sur 5,0 kHz.</li>
      <li>Sortie sur \(C\) (passe-bas) : à \(f_0\), \(G = Q = 3{,}2\), soit \(+10\ \text{dB}\) : une entrée de 1 V à 5 kHz donne 3,2 V aux bornes du condensateur.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(\omega_0\) avec une pulsation de coupure. Pour le passe-bas d'ordre 2, \(\omega_0\) n'est la coupure à \(-3\ \text{dB}\) que si \(Q = 1/\sqrt2\) ; pour le passe-bande, \(\omega_0\) est le centre de la bande, pas un de ses bords. Autre piège : un passe-bas d'ordre 2 n'a pas toujours de résonance (il faut \(Q \gt 1/\sqrt2\)), alors qu'un passe-bande atteint toujours son maximum en \(\omega_0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ACTION D'UN FILTRE SUR UN SIGNAL PÉRIODIQUE</div>
  <h2>Harmonique par harmonique</h2>
  <div class="intro">C'est le cœur du programme : prévoir ce que devient un signal non sinusoïdal (carré, triangle, signal d'un capteur bruité) en traversant un filtre. Le filtre étant linéaire, il suffit de connaître le spectre du signal et la fonction de transfert.</div>
  <div class="prop-box">
    <strong>Filtrage d'un signal périodique.</strong> Si l'entrée a pour décomposition \(u_e(t) = U_0 + \sum_{n\geq1} U_n\cos(n\omega t + \psi_n)\), la sortie en régime établi est
    <div class="formula" data-nom="Filtrage d'un signal périodique">$$u_s(t) = H(0)\,U_0 + \sum_{n\geq1} G(n\omega)\,U_n\cos\big(n\omega t + \psi_n + \varphi(n\omega)\big)$$</div>
    Chaque raie du spectre est multipliée par le gain à sa fréquence et déphasée de la phase à sa fréquence ; la composante continue est multipliée par \(H(0)\) (\(H_0\) pour un passe-bas, 0 pour un passe-haut ou un passe-bande). Aucune fréquence nouvelle n'apparaît.
  </div>
  <div class="method-box">
    <strong>Méthode — prévoir la sortie</strong>
    <ol>
      <li>Lire le spectre d'entrée (fourni) : fréquences et amplitudes des raies, composante continue.</li>
      <li>Placer ces fréquences sur le diagramme de Bode du filtre (ou calculer \(G\) et \(\varphi\) en chacune).</li>
      <li>Multiplier chaque amplitude par le gain correspondant : on obtient le spectre de sortie.</li>
      <li>Interpréter : raies conservées, raies éliminées, forme probable de la sortie, valeur moyenne et valeur efficace (chapitre « Signaux périodiques et spectres », §7).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — extraire le fondamental, ou un harmonique, d'un signal carré</strong>
    <p>Un carré \(\pm E\) de fréquence \(f\) traverse un passe-bande de facteur de qualité \(Q = 10\). Ses harmoniques ont pour amplitudes \(4E/(n\pi)\), aux rangs impairs.</p>
    <ol>
      <li>Filtre centré sur \(f\) : \(G(f) = 1\) ; à \(3f\), \(x = 3\), \(G = \dfrac{1}{\sqrt{1 + 100\,(3 - 1/3)^2}} = 0{,}037\). L'harmonique 3, qui valait le tiers du fondamental, n'en vaut plus que \(0{,}037/3 = 1{,}2\ \%\) : la sortie est une sinusoïde presque pure de fréquence \(f\), d'amplitude \(4E/\pi \approx 1{,}27\,E\).</li>
      <li>Filtre centré sur \(3f\) : l'harmonique 3 passe entier (amplitude \(4E/(3\pi)\)), le fondamental (\(x = 1/3\)) est multiplié par 0,037. Le rapport fondamental / harmonique 3 vaut \(3 \times 0{,}037 = 11\ \%\) en sortie : on obtient surtout une sinusoïde de fréquence \(3f\) (multiplicateur de fréquence), encore un peu déformée.</li>
      <li>Moralité : un passe-bande sélectionne une raie d'autant mieux que \(Q\) est grand et que les raies voisines sont faibles.</li>
    </ol>
  </div>

</div>

<div class="course-section">
  <div class="sec-num">§9 · MOYENNEUR, INTÉGRATEUR, DÉRIVATEUR</div>
  <h2>Quand un filtre fait une opération mathématique</h2>
  <div class="intro">Dans ses zones rectilignes, un filtre réalise une opération simple sur tout un signal : il en garde la moyenne, il l'intègre, il le dérive. Ces fonctions servent partout en électronique (alimentations, mesures, commandes) ; encore faut-il connaître leurs conditions d'emploi.</div>
  <div class="prop-box">
    <strong>Moyenneur.</strong> Un passe-bas dont la coupure est très inférieure à la fréquence \(f\) du signal (\(f_c \ll f\)) atténue tous les harmoniques et transmet la composante continue avec le gain \(H_0\) : \(u_s \approx H_0\langle u_e\rangle\), à une petite ondulation près. Un passe-bas d'ordre 1 réduit le fondamental dans le rapport \(f_c/f\) environ ; un ordre 2, dans le rapport \((f_c/f)^2\).
  </div>
  <div class="prop-box">
    <strong>Intégrateur.</strong> Si toutes les composantes significatives de la partie variable de \(u_e\) ont des fréquences très supérieures à \(f_c\), un passe-bas du premier ordre y vérifie \(\underline H \approx H_0\,\dfrac{\omega_c}{j\omega}\), donc
    <div class="formula" data-nom="Passe-bas intégrateur">$$u_{s\sim}(t) \approx H_0\,\omega_c\int u_{e\sim}\,\mathrm{d}t$$</div>
    (primitive de moyenne nulle). La composante continue, elle, ressort multipliée par \(H_0\) : elle n'est pas intégrée.
  </div>
  <div class="prop-box">
    <strong>Dérivateur.</strong> Si toutes les composantes significatives de \(u_e\) ont des fréquences très inférieures à \(f_c\), un passe-haut du premier ordre y vérifie \(\underline H \approx H_0\,\dfrac{j\omega}{\omega_c}\), donc
    <div class="formula" data-nom="Passe-haut dérivateur">$$u_s(t) \approx \frac{H_0}{\omega_c}\,\frac{\mathrm{d}u_e}{\mathrm{d}t}$$</div>
  </div>

</figure>
  <div class="method-box">
    <strong>Exemple — trois usages</strong>
    <ol>
      <li><strong>Moyenneur</strong> : la tension du secteur redressée en double alternance (valeur moyenne 207 V, fondamental à 100 Hz d'amplitude 138 V) traverse un passe-bas RC de coupure 1,0 Hz. Le fondamental est divisé par environ 100 : il reste 207 V continus avec une ondulation d'environ 1,4 V d'amplitude.</li>
      <li><strong>Intégrateur</strong> : un carré \(\pm E\) traverse un passe-bas (\(H_0 = 1\)) de coupure \(f_c = f/20\). Sur une demi-période, la sortie varie de \(\omega_cE\,T/2\) : c'est un triangle d'amplitude \(\omega_cET/4 = \dfrac{\pi}{2}\,\dfrac{f_c}{f}\,E \approx 0{,}078\,E\). L'opération est d'autant plus exacte que le rapport \(f_c/f\) est petit, mais le signal de sortie d'autant plus faible.</li>
      <li><strong>Dérivateur</strong> : un triangle \(\pm E\) de fréquence \(f\) (pente \(\pm4Ef\)) traverse un passe-haut de coupure \(f_c = 20f\). La sortie est presque un carré d'amplitude \(4Ef/\omega_c = E/(10\pi) \approx 0{,}032\,E\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : vérifier la condition sur le fondamental seulement. Un dérivateur doit transmettre correctement tous les harmoniques utiles, qui doivent donc être sous \(f_c\) : un carré, riche en harmoniques, en ressort sous forme de pics brefs aux fronts, pas comme sa « dérivée » idéale (nulle partout sauf aux sauts). Un dérivateur amplifie aussi le bruit de haute fréquence ; un intégrateur l'atténue.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · CHOISIR ET ASSOCIER DES FILTRES</div>
  <h2>Gabarit et mise en cascade</h2>
  <div class="intro">En pratique, on part d'un besoin : garder les fréquences d'un signal utile, éliminer celles d'un bruit. On le traduit par un gabarit, on choisit le type et l'ordre du filtre, et on enchaîne souvent plusieurs étages, ce qui impose une condition sur leurs impédances.</div>
  <div class="def-box">
    Un <strong>gabarit</strong> traduit un cahier des charges en zones interdites du diagramme de gain : par exemple, pour un passe-bas, un gain au moins égal à \(-A_p\) (souvent \(-3\ \text{dB}\)) jusqu'à \(f_p\) (bande à transmettre), et au plus égal à \(-A_a\) au-delà de \(f_a\) (bande à atténuer). Le gain du filtre choisi doit éviter ces zones.
  </div>
  <div class="method-box">
    <strong>Méthode — choisir un filtre selon un cahier des charges</strong>
    <ol>
      <li>Type : passe-bas si le signal utile est aux basses fréquences, passe-haut s'il faut supprimer une composante continue ou lente, passe-bande pour isoler une fréquence.</li>
      <li>Coupure : placée près du bord de la bande à transmettre.</li>
      <li>Ordre : un ordre \(n\) donne au mieux une pente de \(20n\ \text{dB}\) par décade ; il faut descendre de \(A_a\) entre \(f_p\) et \(f_a\).</li>
      <li>Vérifier sur les expressions exactes (la courbe réelle est sous les asymptotes près de la coupure).</li>
    </ol>
  </div>

    <strong>Exemple — suffit-il d'un premier ordre ?</strong>
    <p>Il faut transmettre 0 à 1 kHz à \(-3\ \text{dB}\) près et atténuer d'au moins 40 dB au-delà de 10 kHz.</p>
    <ol>
      <li>Premier ordre, \(f_c = 1\ \text{kHz}\) : à 10 kHz, \(G_{\text{dB}} = -20\ \text{dB}\) seulement. Il faudrait aller jusqu'à 100 kHz pour \(-40\ \text{dB}\).</li>
      <li>Deuxième ordre, \(f_0 = 1\ \text{kHz}\), \(Q = 1/\sqrt2\) : \(-3\ \text{dB}\) à 1 kHz, et à 10 kHz \(G = 1/\sqrt{(1 - 100)^2 + 200} = 0{,}0100\), soit \(-40\ \text{dB}\) : le gabarit est respecté, de justesse.</li>
    </ol>
  </div>
  <h3>Mise en cascade et impédances</h3>
  <p>Vu de sa sortie, un étage se comporte comme un générateur de Thévenin : sa tension à vide \(\underline H_1\underline u_e\) en série avec son <strong>impédance de sortie</strong> \(\underline Z_{s1}\). Vu de son entrée, l'étage suivant se comporte comme une <strong>impédance d'entrée</strong> \(\underline Z_{e2}\) (chapitre « Lois de l'électrocinétique — régime continu », §10, pour les résistances).</p>

</figure>
  <div class="prop-box">
    <strong>Condition de mise en cascade.</strong> La tension transmise à l'étage 2 est réduite par le diviseur \(\dfrac{\underline Z_{e2}}{\underline Z_{e2} + \underline Z_{s1}}\), d'où
    <div class="formula" data-nom="Mise en cascade">$$\underline H = \underline H_1\,\frac{\underline Z_{e2}}{\underline Z_{e2} + \underline Z_{s1}}\,\underline H_2 \approx \underline H_1\underline H_2\quad\text{si}\quad |\underline Z_{s1}| \ll |\underline Z_{e2}|$$</div>
    C'est pourquoi on réalise des filtres de <strong>faible impédance de sortie</strong> et de <strong>forte impédance d'entrée</strong> : on peut alors les enchaîner en multipliant leurs fonctions de transfert, c'est-à-dire en ajoutant leurs diagrammes de Bode. Un suiveur à amplificateur linéaire intégré, de résistance d'entrée quasi infinie et de résistance de sortie quasi nulle, sert d'étage tampon (2ᵉ année).
  </div>
  <div class="method-box">
    <strong>Exemple — deux cellules RC en cascade</strong>
    <p>Deux cellules passe-bas \((R_1, C_1)\) puis \((R_2, C_2)\) branchées directement. Le calcul complet (diviseurs successifs) donne \(\underline H = \dfrac{1}{1 + j\omega(R_1C_1 + R_2C_2 + R_1C_2) - R_1C_1R_2C_2\,\omega^2}\) ; le terme \(R_1C_2\) traduit la charge du premier étage par le second.</p>
    <ol>
      <li>Cellules identiques (\(RC\)), à \(\omega = 1/(RC)\) : \(|\underline H| = 1/|3j| = 0{,}33\), au lieu de \(|\underline H_1\underline H_2| = 1/2\) si les étages étaient indépendants : 33 % d'écart.</li>
      <li>Second étage \((10R, C/10)\), de même pulsation de coupure mais d'impédance dix fois plus grande : \(|\underline H| = 1/2{,}1 = 0{,}48\), à 5 % du produit idéal.</li>
      <li>Avec un suiveur intercalé, l'écart disparaît. En TP, on vérifie l'effet de charge en comparant le gain d'un étage mesuré à vide puis branché sur le suivant.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : multiplier les fonctions de transfert de deux étages sans vérifier \(|\underline Z_{s1}| \ll |\underline Z_{e2}|\). Les appareils sont concernés aussi : un oscilloscope (\(1\ \text{M}\Omega\)) branché en sortie d'un filtre à résistances de quelques mégohms le charge, et un GBF (\(50\ \Omega\)) n'est pas une source idéale pour un filtre d'impédance d'entrée faible.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · FILTRAGE MÉCANIQUE</div>
  <h2>Sismomètre, accéléromètre, suspension</h2>
  <div class="intro">Une masse suspendue par un ressort et freinée par un amortisseur est un filtre du deuxième ordre, exactement comme un circuit RLC. Selon la fréquence des vibrations par rapport à sa fréquence propre, ce dispositif mesure un déplacement, mesure une accélération, ou protège ce qu'il porte.</div>
  <p>Un boîtier solidaire du sol (déplacement vertical \(x_s(t)\)) contient une masse \(m\) suspendue par un ressort \(k\) et un amortisseur \(\alpha\). On mesure la position \(y\) de la masse par rapport au boîtier (à partir de l'équilibre). Dans le référentiel terrestre, supposé galiléen, la masse a pour position \(x_s + y\) et le principe fondamental de la dynamique donne</p>
  <div class="formula" data-nom="Capteur inertiel">$$m(\ddot y + \ddot x_s) = -ky - \alpha\dot y\quad\Longleftrightarrow\quad \ddot y + \frac{\omega_0}{Q}\,\dot y + \omega_0^2\,y = -\ddot x_s$$</div>
  <p>avec \(\omega_0 = \sqrt{k/m}\) et \(Q = \sqrt{km}/\alpha\) (chapitre « Oscillateurs harmoniques », §5). En régime sinusoïdal forcé, \(-\ddot x_s\) a pour amplitude complexe \(\omega^2\underline X_s\), d'où</p>
  <div class="formula">$$\underline H = \frac{\underline Y}{\underline X_s} = \frac{x^2}{1 + j\dfrac xQ - x^2} = -\frac{(jx)^2}{1 + j\dfrac xQ + (jx)^2},\qquad x = \frac{\omega}{\omega_0}$$</div>
  <p>C'est un <strong>passe-haut du deuxième ordre</strong>.</p>

<figcaption>Une masse \(m\) est suspendue dans un boîtier lié au sol par un ressort \(k\) et un amortisseur \(\alpha\) ; on mesure sa position \(y\) par rapport au boîtier quand le sol se déplace de \(x_s(t)\). Le gain \(|\underline Y/\underline X_s|\) est celui d'un passe-haut du deuxième ordre. Aux hautes fréquences, la masse reste immobile et \(y \approx -x_s\) : c'est un sismomètre. Aux basses fréquences (pente de \(+40\ \text{dB}\) par décade, tirets), \(y\) est proportionnel à l'accélération du sol : c'est un accéléromètre. Avec \(Q \approx 0{,}7\), pas de résonance gênante.</figcaption>
</figure>
  <ul>
    <li><strong>Sismomètre</strong> (\(\omega \gg \omega_0\)) : \(\underline H \approx -1\), \(y \approx -x_s\). La masse, trop inerte pour suivre, reste immobile : le boîtier se déplace autour d'elle, et \(y\) reproduit le déplacement du sol. Il faut une fréquence propre basse (ressort souple, masse lourde), de l'ordre de 1 Hz ou moins pour les ondes sismiques.</li>
    <li><strong>Accéléromètre</strong> (\(\omega \ll \omega_0\)) : \(\underline H \approx x^2\), donc \(y \approx -\ddot x_s/\omega_0^2\) : la position relative de la masse est proportionnelle à l'accélération du sol. Il faut une fréquence propre élevée (masse minuscule, ressort raide).</li>
    <li>Dans les deux cas, on choisit \(Q \approx 0{,}7\) : pas de résonance qui fausserait la mesure près de \(\omega_0\).</li>
    <li><strong>Suspension</strong> (voiture, lave-linge) : on s'intéresse cette fois au mouvement de la masse elle-même, \(x_s + y\). Le rapport \(\big|(\underline X_s + \underline Y)/\underline X_s\big|\) est celui d'un passe-bas du deuxième ordre (avec un numérateur \(1 + jx/Q\)) ; il passe sous 1 dès que \(\omega \gt \sqrt2\,\omega_0\), quel que soit \(Q\). Une suspension de fréquence propre basse (de l'ordre du hertz pour une voiture) filtre les vibrations rapides de la route.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — deux capteurs, deux réglages</strong>
    <ol>
      <li>Accéléromètre de téléphone (microsystème) de fréquence propre 5 kHz, soumis à une accélération de \(9{,}8\ \text{m·s}^{-2}\) (1 g) : \(y = a/\omega_0^2 = 9{,}8/(2\pi\times5\,000)^2 \approx 10\ \text{nm}\). Ce déplacement minuscule est mesuré par une variation de capacité.</li>
      <li>Pour des vibrations jusqu'à 1 kHz (\(x \le 0{,}2\)) et \(Q = 0{,}7\), l'écart à la loi \(y = -a/\omega_0^2\) reste inférieur à 0,2 %.</li>
      <li>Sismomètre de fréquence propre 1,0 Hz, \(Q = 0{,}7\), pour des ondes de 5 Hz : \(|\underline H| = \dfrac{25}{\sqrt{(1 - 25)^2 + 25/0{,}49}} = 0{,}998\) : \(y\) reproduit le déplacement du sol à 0,2 % près.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire le principe fondamental avec l'accélération relative \(\ddot y\) seule. Le boîtier accélère : c'est l'accélération \(\ddot x_s + \ddot y\) de la masse dans le référentiel terrestre qui intervient, et c'est elle qui fait apparaître le second membre \(-\ddot x_s\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · SIMULATION NUMÉRIQUE : FILTRER UN SIGNAL DE SPECTRE FOURNI</div>
  <h2>Le filtrage en quelques lignes de Python</h2>
  <div class="intro">Le principe du §8 se programme directement : on représente le signal d'entrée par son spectre (listes des rangs, des amplitudes et des phases), on multiplie chaque raie par la fonction de transfert à sa fréquence, et on resynthétise la sortie. On peut alors étudier l'influence de la coupure ou du facteur de qualité, ce qui serait long à la main.</div>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

f = 1000.0                                  <span class="cmt"># fréquence du signal d'entrée (Hz)</span>
E = 5.0                                     <span class="cmt"># carré ±E (V)</span>
rangs = np.arange(1, 200, 2)                <span class="cmt"># spectre fourni : rangs impairs 1, 3, …, 199</span>
amplitudes = 4 * E / (np.pi * rangs)        <span class="cmt"># S_n = 4E/(n pi)</span>
phases = -np.pi / 2 * np.ones(len(rangs))   <span class="cmt"># sin(x) = cos(x - pi/2)</span>

<span class="kw">def</span> synthese(t, S0, rangs, amplitudes, phases):
    <span class="str">"""Signal S0 + somme des S_n cos(2 pi n f t + phi_n) (chapitre « Signaux », §9)."""</span>
    s = S0 * np.ones(len(t))
    <span class="kw">for</span> n, A, phi <span class="kw">in</span> zip(rangs, amplitudes, phases):
        s = s + A * np.cos(2 * np.pi * n * f * t + phi)
    <span class="kw">return</span> s

<span class="kw">def</span> passe_bas_1(fr, fc, H0=1):
    <span class="str">"""Fonction de transfert d'un passe-bas du premier ordre à la fréquence fr."""</span>
    <span class="kw">return</span> H0 / (1 + 1j * fr / fc)

<span class="kw">def</span> passe_bande(fr, f0, Q, H0=1):
    <span class="str">"""Fonction de transfert d'un passe-bande du deuxième ordre (fr &gt; 0)."""</span>
    <span class="kw">return</span> H0 / (1 + 1j * Q * (fr / f0 - f0 / fr))

<span class="kw">def</span> filtrer(rangs, amplitudes, phases, H):
    <span class="str">"""Spectre de sortie : la raie de rang n est multipliée par H(n f)."""</span>
    Hn = H(rangs * f)                       <span class="cmt"># tableau de nombres complexes</span>
    <span class="kw">return</span> amplitudes * np.abs(Hn), phases + np.angle(Hn)

t = np.linspace(0, 2 / f, 2000, endpoint=False)   <span class="cmt"># deux périodes</span>

<span class="cmt"># 1) passe-bas du premier ordre : influence de la fréquence de coupure</span>
<span class="kw">for</span> fc <span class="kw">in</span> (300, 1000, 10000):
    A_s, phi_s = filtrer(rangs, amplitudes, phases, <span class="kw">lambda</span> fr: passe_bas_1(fr, fc))
    print(fc, round(A_s[0], 2), round(A_s[1] / A_s[0], 3))

<span class="cmt"># 2) passe-bande centré sur f : influence du facteur de qualité</span>
<span class="kw">for</span> Q <span class="kw">in</span> (1, 3, 10):
    A_s, phi_s = filtrer(rangs, amplitudes, phases, <span class="kw">lambda</span> fr: passe_bande(fr, f, Q))
    s = synthese(t, 0, rangs, A_s, phi_s)
    print(Q, round(A_s[0], 3), round(A_s[1] / A_s[0], 4), round(np.sqrt(np.mean(s**2)), 3))</pre>
  <p>Le programme, exécuté tel quel, affiche :</p>
  <pre class="codeblock">300 1.83 0.115
1000 4.5 0.149
10000 6.33 0.321
1 6.366 0.117 4.538
3 6.366 0.0413 4.506
10 6.366 0.0125 4.502</pre>
  <ul>
    <li><strong>Influence de la coupure</strong> (passe-bas) : avec \(f_c = 10\ \text{kHz}\), le fondamental (6,33 V contre 6,37 V) et le rapport harmonique 3 / fondamental (0,32 contre 1/3) sont presque inchangés ; avec \(f_c = 300\ \text{Hz}\), ce rapport tombe à 0,115, proche de 1/9 : chaque harmonique est divisé par son rang, signature d'un intégrateur (§9).</li>
    <li><strong>Influence du facteur de qualité</strong> (passe-bande centré sur 1 kHz) : le fondamental passe toujours entier (6,37 V), et l'harmonique 3 tombe de 12 % à 4 % puis 1,2 % du fondamental quand \(Q\) passe de 1 à 3 puis 10. La valeur efficace de la sortie tend vers celle du fondamental seul, \(6{,}37/\sqrt2 = 4{,}50\ \text{V}\).</li>
    <li>La composante continue (ici nulle) serait à traiter à part : elle est multipliée par \(H(0)\), et la fonction <span class="code-inline">passe_bande</span> ne doit pas être appelée en \(f = 0\).</li>
  </ul>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Autres filtres d'ordre 2, résonance exacte, filtres actifs</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI ; ils se traitent avec les mêmes méthodes (comportement aux limites, forme canonique, asymptotes).</div>
  <div class="notice"><strong>Hors programme en PTSI (pour aller plus loin)</strong> : le programme cite comme modèles le passe-bas et le passe-haut d'ordre 1, le passe-bas et le passe-bande d'ordre 2 ; ce qui suit n'est pas exigible.</div>
  <h3>Passe-haut et coupe-bande d'ordre 2</h3>
  <p>RLC série, sortie sur la bobine : \(\underline H = \dfrac{-x^2}{1 + jx/Q - x^2}\), passe-haut d'ordre 2 (pente \(+40\ \text{dB}\) par décade aux basses fréquences, gain \(Q\) en \(\omega_0\)) ; le capteur inertiel du §11 en est un exemple. Sortie sur l'ensemble bobine et condensateur : \(\underline H = \dfrac{1 - x^2}{1 + jx/Q - x^2}\), nul en \(\omega_0\) : c'est un <strong>coupe-bande</strong> (ou réjecteur), qui élimine une fréquence précise (le 50 Hz du secteur dans un électrocardiographe, par exemple).</p>
  <h3>Pulsation de résonance du passe-bas d'ordre 2</h3>
  <p>\(G^2 = H_0^2/D(x)\) avec \(D = (1 - x^2)^2 + x^2/Q^2\). \(D'(x) = 2x\big(2x^2 - 2 + 1/Q^2\big)\) s'annule pour \(x^2 = 1 - \dfrac{1}{2Q^2}\), possible seulement si \(Q \gt 1/\sqrt2\). Alors \(\omega_r = \omega_0\sqrt{1 - \dfrac{1}{2Q^2}}\) et \(G_{\max} = \dfrac{QH_0}{\sqrt{1 - 1/(4Q^2)}}\) : pour \(Q = 5\), \(\omega_r = 0{,}990\,\omega_0\) et \(G_{\max} = 5{,}03\,H_0\) (\(+14{,}0\ \text{dB}\)).</p>
  <h3>Filtres d'ordre supérieur et filtres actifs</h3>
  <p>En cascadant des étages tamponnés, on obtient des filtres d'ordre \(n\), de pente \(20n\ \text{dB}\) par décade ; certains réglages des facteurs de qualité (filtres de Butterworth, de Tchebychev) optimisent la platitude de la bande passante ou la raideur de la coupure. Les filtres actifs, construits avec des amplificateurs linéaires intégrés, évitent les bobines, ont un gain réglable et une impédance de sortie quasi nulle (chapitre de 2ᵉ année « Amplificateur linéaire intégré et rétroaction », §8). En sciences industrielles, on écrit les fonctions de transfert avec la variable de Laplace \(p\), qui remplace \(j\omega\) (chapitre « Réponse fréquentielle et diagrammes de Bode »).</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · FILTRES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles du régime sinusoïdal forcé (partie 1.4 : notation complexe, impédances) et du filtrage linéaire (partie 1.5) : prévoir la nature d'un filtre, établir et mettre en forme sa fonction de transfert, tracer et lire un diagramme de Bode, prévoir la sortie pour un signal périodique, reconnaître un intégrateur ou un dérivateur, choisir un filtre, l'associer à d'autres. Notations : \(\underline H(j\omega)\), \(G = |\underline H|\), \(G_{\text{dB}} = 20\log G\), \(\varphi = \arg\underline H\), \(H_0\), \(\omega_c\), \(\omega_0\), \(Q\), \(x = \omega/\omega_c\) ou \(\omega/\omega_0\).</div>

  <div class="method-box"><strong>Méthode 1 — Passer en notation complexe et revenir au réel</strong>
    <ol>
      <li><span class="step">Associer</span> à chaque grandeur \(x = X_m\cos(\omega t + \varphi)\) son amplitude complexe \(\underline X_m = X_me^{j\varphi}\) ; remplacer \(\mathrm{d}/\mathrm{d}t\) par \(j\omega\).</li>
      <li><span class="step">Calculer</span> avec les lois des circuits et les impédances (méthode 2) jusqu'à l'amplitude complexe cherchée.</li>
      <li><span class="step">Revenir au réel</span> : amplitude = module, phase à l'origine = argument (attention au quadrant : \(\arg(a + jb) = \arctan(b/a)\) seulement si \(a \gt 0\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(i = 0{,}20\cos(1\,000\,t)\) (en A) traverse \(\underline Z = 30 + 40j\ \Omega\) : \(\underline U_m = 0{,}20\times(30 + 40j) = 6 + 8j\), de module 10 V et d'argument \(\arctan(8/6) = 0{,}93\ \text{rad}\) : \(u = 10\cos(1\,000\,t + 0{,}93)\) (en V).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Calculer une impédance équivalente</strong>
    <ol>
      <li><span class="step">Impédances élémentaires</span> : \(R\), \(jL\omega\), \(1/(jC\omega)\) (contrôle : condensateur infini à \(\omega = 0\)).</li>
      <li><span class="step">Associer</span> deux à deux : série \(\underline Z_1 + \underline Z_2\), parallèle \(\underline Z_1\underline Z_2/(\underline Z_1 + \underline Z_2)\).</li>
      <li><span class="step">Mettre sous la forme</span> \(a + jb\) (multiplier par le conjugué du dénominateur si besoin) ; module et argument donnent le rapport des amplitudes et le déphasage de \(u\) sur \(i\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(R = 50\ \Omega\) en série avec \(L = 20\ \text{mH}\) à \(\omega = 2\,500\ \text{rad·s}^{-1}\) : \(\underline Z = 50 + 50j\), \(|\underline Z| = 71\ \Omega\), la tension est en avance de \(45^\circ\) sur le courant.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : ajouter les modules (\(|\underline Z_1 + \underline Z_2| \leq |\underline Z_1| + |\underline Z_2|\), égalité seulement si les arguments sont égaux), ou écrire \(jC\omega\) pour l'impédance d'un condensateur.</div>

  <div class="method-box"><strong>Méthode 3 — Prévoir la nature d'un filtre sans calcul</strong>
    <ol>
      <li><span class="step">Basses fréquences</span> : remplacer chaque bobine par un fil et chaque condensateur par un interrupteur ouvert ; en déduire \(u_s\) (nul, égal à \(u_e\), ou une fraction de \(u_e\)).</li>
      <li><span class="step">Hautes fréquences</span> : bobine = interrupteur ouvert, condensateur = fil.</li>
      <li><span class="step">Conclure</span> : transmis en BF et bloqué en HF : passe-bas ; l'inverse : passe-haut ; bloqué aux deux extrémités : passe-bande ; transmis aux deux extrémités et bloqué au milieu : coupe-bande. L'ordre vaut au plus le nombre de bobines et condensateurs indépendants.</li>
    </ol>
    <p><em>Exemple éclair :</em> condensateur en série, bobine en dérivation sur la sortie. BF : le condensateur ouvert isole la sortie, \(u_s = 0\). HF : le condensateur est un fil et la bobine un interrupteur ouvert, \(u_s = u_e\). Passe-haut, d'ordre 2.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Établir une fonction de transfert et l'identifier à une forme canonique</strong>
    <ol>
      <li><span class="step">Sortie ouverte</span> : si aucun courant ne sort par la borne de sortie et que \(\underline Z_s\) est en série avec \(\underline Z_1\), diviseur de tension \(\underline H = \underline Z_s/(\underline Z_1 + \underline Z_s)\) ; sinon, loi des nœuds au point de sortie.</li>
      <li><span class="step">Réduire</span> au même dénominateur, sans fraction emboîtée, et faire apparaître 1 comme terme constant du dénominateur.</li>
      <li><span class="step">Identifier</span> : \(\dfrac{H_0}{1 + j\omega/\omega_c}\) (passe-bas 1), \(\dfrac{H_0\,j\omega/\omega_c}{1 + j\omega/\omega_c}\) (passe-haut 1), dénominateur \(1 + j\dfrac{\omega}{Q\omega_0} - \dfrac{\omega^2}{\omega_0^2}\) (ordre 2), puis lire \(H_0\), \(\omega_c\) ou \(\omega_0\) et \(Q\).</li>
      <li><span class="step">Contrôler</span> : dimensions (\(RC\), \(L/R\), \(\sqrt{LC}\) sont des durées) et comportements limites de la méthode 3.</li>
    </ol>
    <p><em>Exemple éclair :</em> bobine \(L\) en série, résistance \(R\) en sortie : \(\underline H = \dfrac{R}{R + jL\omega} = \dfrac{1}{1 + jL\omega/R}\), passe-bas, \(\omega_c = R/L\). Autre : \(\underline H = \dfrac{2}{1 + 5\times10^{-4}\,j\omega - 10^{-6}\omega^2}\) donne \(H_0 = 2\), \(\omega_0 = 1\,000\ \text{rad·s}^{-1}\) et \(1/(Q\omega_0) = 5\times10^{-4}\ \text{s}\), soit \(Q = 2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : identifier sur une forme non canonique (terme constant du dénominateur différent de 1) ; et oublier que \(\underline H\) suppose la sortie ouverte. Une charge en sortie modifie la fonction de transfert (méthode 10).</div>

  <div class="method-box"><strong>Méthode 5 — Tracer le diagramme de Bode d'un filtre du premier ordre</strong>
    <ol>
      <li><span class="step">Forme canonique</span> et pulsation réduite \(x = \omega/\omega_c\) ; échelle logarithmique graduée en décades autour de \(x = 1\).</li>
      <li><span class="step">Asymptotes du gain</span> : équivalents BF et HF (\(H_0\), \(H_0/(jx)\) ou \(H_0\,jx\)) : droites de pente 0 ou \(\pm20\ \text{dB}\) par décade, qui se coupent en \(x = 1\) au niveau \(20\log H_0\).</li>
      <li><span class="step">Asymptotes de la phase</span> : paliers 0 et \(\mp\pi/2\) (ajouter \(\pi\) si \(H_0 \lt 0\)).</li>
      <li><span class="step">Points de la courbe réelle</span> : en \(x = 1\), 3 dB sous les asymptotes et phase moyenne des paliers (\(\mp\pi/4\)) ; en \(x = 0{,}1\) et 10, la courbe touche presque les asymptotes.</li>
    </ol>
    <p><em>Exemple éclair :</em> passe-bas \(H_0 = 10\), \(f_c = 200\ \text{Hz}\) : plateau à \(+20\ \text{dB}\), \(+17\ \text{dB}\) à 200 Hz, asymptote qui passe par 0 dB à 2 kHz (gain réel \(-0{,}04\ \text{dB}\)) ; phase \(-45^\circ\) à 200 Hz.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Lire un diagramme de Bode</strong>
    <ol>
      <li><span class="step">Pentes</span> des parties rectilignes aux extrémités : \(20n\ \text{dB}\) par décade indique un équivalent en \((j\omega)^n\) ; la différence des pentes extrêmes renseigne sur l'ordre.</li>
      <li><span class="step">Nature</span> : pente nulle en BF et négative en HF, passe-bas ; etc. ; la phase aux extrémités (\(n\pi/2\)) confirme.</li>
      <li><span class="step">Paramètres</span> : \(H_0\) sur le plateau ; \(\omega_c\) où le gain a perdu 3 dB (ou à l'intersection des asymptotes pour un ordre 1) ; pour un ordre 2, \(\omega_0\) où la phase vaut \(-90^\circ\) (passe-bas) ou \(0\) (passe-bande), et \(Q\) par \(G(\omega_0) = QH_0\) (passe-bas) ou \(Q = \omega_0/\Delta\omega\) (passe-bande).</li>
    </ol>
    <p><em>Exemple éclair :</em> plateau à 0 dB, pente \(-40\ \text{dB}\) par décade au-delà de 1 kHz, phase de 0 à \(-180^\circ\) passant par \(-90^\circ\) à 1 kHz, où le gain vaut \(+6\ \text{dB}\) : passe-bas d'ordre 2, \(f_0 = 1\ \text{kHz}\), \(Q = 10^{6/20} = 2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : prendre le maximum d'un passe-bas résonant pour \(\omega_0\) (il est un peu en dessous), ou confondre le niveau du maximum et \(G(\omega_0)\). La phase, qui vaut \(-90^\circ\) en \(\omega_0\) quel que soit \(Q\), est la lecture la plus sûre.</div>

  <div class="method-box"><strong>Méthode 7 — Prévoir la sortie pour une somme de sinusoïdes ou un signal périodique</strong>
    <ol>
      <li><span class="step">Spectre d'entrée</span> : composante continue et liste (fréquence, amplitude, phase) des raies.</li>
      <li><span class="step">Gain et phase</span> en chaque fréquence (calcul ou lecture du diagramme de Bode) ; la composante continue est multipliée par \(H(0)\).</li>
      <li><span class="step">Spectre de sortie</span> : amplitudes multipliées par \(G\), phases augmentées de \(\varphi\) ; écrire \(u_s(t)\) ou décrire sa forme.</li>
      <li><span class="step">En Python</span> (cours, §12) : une fonction <span class="code-inline">filtrer</span> applique \(\underline H\) à chaque raie, puis on resynthétise le signal.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_e = 1 + 2\cos(2\pi\cdot100\,t) + 2\cos(2\pi\cdot10^4\,t)\) traverse un passe-bas d'ordre 1, \(f_c = 1\ \text{kHz}\) ; à 100 Hz, \(G = 0{,}995\) et \(\varphi = -6^\circ\) ; à 10 kHz, \(G = 0{,}10\) et \(\varphi = -84^\circ\) :</p>
    <div class="formula">$$u_s \approx 1 + 1{,}99\cos(2\pi\cdot100\,t - 6^\circ) + 0{,}20\cos(2\pi\cdot10^4\,t - 84^\circ)$$</div>
  </div>

  <div class="method-box"><strong>Méthode 8 — Reconnaître un comportement moyenneur, intégrateur ou dérivateur</strong>
    <ol>
      <li><span class="step">Spectre</span> : repérer la fréquence du fondamental \(f\) et le rang au-delà duquel les harmoniques deviennent négligeables.</li>
      <li><span class="step">Moyenneur</span> : passe-bas avec \(f_c \ll f\) ; ondulation résiduelle \(\approx\) amplitude du fondamental \(\times f_c/f\) (ordre 1).</li>
      <li><span class="step">Intégrateur</span> : passe-bas d'ordre 1 avec \(f_c \ll f\) (toutes les raies variables dans la pente \(-20\ \text{dB}\) par décade) : \(u_{s\sim} \approx H_0\omega_c\int u_{e\sim}\,\mathrm{d}t\).</li>
      <li><span class="step">Dérivateur</span> : passe-haut d'ordre 1 avec toutes les raies utiles très en dessous de \(f_c\) : \(u_s \approx (H_0/\omega_c)\,\mathrm{d}u_e/\mathrm{d}t\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un carré \(\pm2\ \text{V}\) à 1 kHz traverse un passe-bas de coupure 50 Hz : triangle d'amplitude \(\dfrac\pi2\times\dfrac{50}{1\,000}\times2 = 0{,}16\ \text{V}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : vérifier la condition sur le seul fondamental. Pour un dérivateur, ce sont les harmoniques élevés qui la violent les premiers ; pour un intégrateur, la composante continue n'est pas intégrée mais transmise avec \(H_0\).</div>

  <div class="method-box"><strong>Méthode 9 — Choisir un filtre selon un cahier des charges</strong>
    <ol>
      <li><span class="step">Gabarit</span> : traduire le besoin en zones interdites (atténuation maximale dans la bande à transmettre, atténuation minimale dans la bande à rejeter).</li>
      <li><span class="step">Type</span> : passe-bas, passe-haut, passe-bande selon la position du signal utile.</li>
      <li><span class="step">Ordre</span> : l'atténuation à gagner entre les deux bandes, divisée par leur écart en décades, donne la pente nécessaire, donc l'ordre (\(20n\ \text{dB}\) par décade).</li>
      <li><span class="step">Vérifier</span> sur l'expression exacte aux deux bords du gabarit.</li>
    </ol>
    <p><em>Exemple éclair :</em> garder 0 à 1 kHz et atténuer de 60 dB à partir de 30 kHz (1,5 décade) : il faut 40 dB par décade, un ordre 2 au moins.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Vérifier qu'on peut mettre deux étages en cascade</strong>
    <ol>
      <li><span class="step">Modéliser</span> la sortie de l'étage 1 par un générateur de Thévenin (\(\underline H_1\underline u_e\), \(\underline Z_{s1}\)) et l'entrée de l'étage 2 par \(\underline Z_{e2}\).</li>
      <li><span class="step">Comparer</span> \(|\underline Z_{s1}|\) et \(|\underline Z_{e2}|\) sur toute la bande de fréquences utile.</li>
      <li><span class="step">Conclure</span> : si \(|\underline Z_{s1}| \ll |\underline Z_{e2}|\), \(\underline H = \underline H_1\underline H_2\) (gains en dB et phases s'ajoutent) ; sinon, recalculer le circuit complet, ou intercaler un suiveur.</li>
    </ol>
    <p><em>Exemple éclair :</em> une cellule RC (\(R = 1\ \text{k}\Omega\)) suivie d'une cellule de résistance \(10\ \text{k}\Omega\) et de capacité dix fois plus faible : à la coupure commune, le gain vaut 0,48 au lieu de 0,50, écart de 5 % seulement.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un filtre mesuré à vide puis branché sur un haut-parleur de 8 Ω ou sur l'entrée d'un étage de faible impédance n'a plus la même fonction de transfert. La même question se pose pour les appareils de mesure (oscilloscope : 1 MΩ).</div>
</div>
</template>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Impédances d'un circuit RLC série</h3>
  <div class="statement">Un circuit série comprend \(R = 100\ \Omega\), \(L = 10\ \text{mH}\) et \(C = 1{,}0\ \mu\text{F}\). Il est alimenté par \(e(t) = 10\cos(\omega t)\) (en volts).</div>
  <div class="q"><strong>Q1.</strong> Pour \(\omega = 1{,}0\times10^4\ \text{rad·s}^{-1}\), calculer les impédances complexes de la bobine et du condensateur, puis l'impédance totale. Que remarque-t-on ?</div>
  <div class="q"><strong>Q2.</strong> En déduire \(i(t)\), puis l'amplitude de la tension \(u_C\) aux bornes du condensateur et son déphasage par rapport à \(e\).</div>
  <div class="q"><strong>Q3.</strong> Reprendre Q1 et Q2 (impédance totale et amplitude du courant) pour \(\omega = 2{,}0\times10^4\ \text{rad·s}^{-1}\). Le circuit est-il inductif ou capacitif ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\underline Z_L = jL\omega = 100\,j\ \Omega\) ; \(\underline Z_C = \dfrac{1}{jC\omega} = -100\,j\ \Omega\). En série : \(\underline Z = 100 + 100\,j - 100\,j = 100\ \Omega\). L'impédance est réelle et minimale : \(\omega = 1/\sqrt{LC}\), c'est la résonance en intensité.</p>
    <p><strong>Q2.</strong> \(\underline I_m = \underline E_m/\underline Z = 10/100 = 0{,}10\ \text{A}\), en phase avec \(e\) : \(i(t) = 0{,}10\cos(\omega t)\) (en A). \(\underline U_{Cm} = \underline Z_C\underline I_m = -10\,j\ \text{V}\) : amplitude 10 V, en retard de \(\pi/2\) sur \(e\). Ici \(Q = \frac1R\sqrt{L/C} = 1\) : la tension aux bornes de \(C\) égale celle du générateur (elle vaut \(Q\) fois celle-ci à la résonance).</p>
    <p><strong>Q3.</strong> \(\underline Z_L = 200\,j\), \(\underline Z_C = -50\,j\), \(\underline Z = 100 + 150\,j\ \Omega\) : \(|\underline Z| = 180\ \Omega\), \(\arg\underline Z = 56^\circ\). \(I_m = 10/180 = 0{,}055\ \text{A}\). L'argument positif (tension en avance sur le courant) signale un circuit inductif : au-dessus de la résonance, la bobine l'emporte.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Cellule RC en passe-bas et en passe-haut</h3>
  <div class="statement">On considère une résistance \(R = 1{,}0\ \text{k}\Omega\) en série avec un condensateur \(C = 100\ \text{nF}\), alimentés par une tension sinusoïdale \(u_e(t)\). Les sorties sont ouvertes.</div>
  <div class="q"><strong>Q1.</strong> Avec la sortie aux bornes du condensateur, établir la fonction de transfert. Quelle est la nature du filtre ? Calculer \(\omega_c\) et \(f_c\).</div>
  <div class="q"><strong>Q2.</strong> Avec la sortie aux bornes de la résistance, quelle est la fonction de transfert ? Sa nature ? \(\omega_c\) change-t-elle ?</div>
  <div class="q"><strong>Q3.</strong> On envoie un signal contenant des composantes à \(f_1 = 100\ \text{Hz}\), \(f_2 = 1{,}6\ \text{kHz}\) et \(f_3 = 100\ \text{kHz}\). Que sort-il de chaque filtre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Diviseur de tension : \(\underline H_{\text{PB}} = \dfrac{1/(jC\omega)}{R + 1/(jC\omega)} = \dfrac{1}{1 + jRC\omega}\). Passe-bas du premier ordre, \(H_0 = 1\), \(\omega_c = 1/(RC) = 1{,}0\times10^4\ \text{rad·s}^{-1}\), \(f_c = \omega_c/(2\pi) = 1{,}6\ \text{kHz}\).</p>
    <p><strong>Q2.</strong> \(\underline H_{\text{PH}} = \dfrac{R}{R + 1/(jC\omega)} = \dfrac{jRC\omega}{1 + jRC\omega}\) : passe-haut du premier ordre, de même pulsation de coupure. C'est logique : \(u_R + u_C = u_e\), donc \(\underline H_{\text{PB}} + \underline H_{\text{PH}} = 1\).</p>
    <p><strong>Q3.</strong> Avec \(x = f/f_c\) : à 100 Hz (\(x = 0{,}063\)), le passe-bas transmet (\(G = 0{,}998\)) et le passe-haut atténue d'un facteur 16 (\(G = 0{,}063\), soit \(-24\ \text{dB}\)). À 1,6 kHz (\(x \approx 1\)), les deux transmettent avec \(G \approx 1/\sqrt2\) (\(-3\ \text{dB}\)), avec des déphasages \(-45^\circ\) et \(+45^\circ\). À 100 kHz (\(x = 63\)), le passe-bas atténue fortement (\(G = 0{,}016\), \(-36\ \text{dB}\)) et le passe-haut transmet.</p>
  </div>
</div>
