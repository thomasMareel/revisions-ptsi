  <div class="q"><strong>Q3.</strong> Calculer le gain en décibels et la phase en \(\omega_c/10\), \(\omega_c\) et \(10\,\omega_c\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Diviseur de tension : \(\underline H = \dfrac{R_2}{R_1 + R_2 + \frac{1}{jC\omega}} = \dfrac{jR_2C\omega}{1 + j(R_1 + R_2)C\omega}\). En posant \(\omega_c = \dfrac{1}{(R_1 + R_2)C}\), \(\underline H = \dfrac{R_2}{R_1 + R_2}\,\dfrac{j\omega/\omega_c}{1 + j\omega/\omega_c}\). Donc \(H_0 = \dfrac{R_2}{R_1 + R_2} = 0{,}80\) et \(\omega_c = 4{,}3\times10^3\ \text{rad·s}^{-1}\) (\(f_c = 680\ \text{Hz}\)).</p>
    <p><strong>Q2.</strong> Gain : asymptote HF horizontale à \(20\log0{,}80 = -1{,}9\ \text{dB}\) ; asymptote BF de pente \(+20\ \text{dB}\) par décade, qui coupe la précédente en \(\omega_c\). Phase : asymptotes \(+90^\circ\) (BF) et 0 (HF). La courbe réelle du gain passe 3 dB sous le point anguleux en \(\omega_c\), la phase y vaut \(+45^\circ\).</p>
    <p><strong>Q3.</strong> Avec \(G_{\text{dB}} = 20\log H_0 + 20\log\dfrac{x}{\sqrt{1 + x^2}}\) et \(\varphi = \dfrac\pi2 - \arctan x\) : en \(x = 0{,}1\), \(-22{,}0\ \text{dB}\) et \(+84^\circ\) ; en \(x = 1\), \(-4{,}9\ \text{dB}\) et \(+45^\circ\) ; en \(x = 10\), \(-2{,}0\ \text{dB}\) et \(+6^\circ\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Filtre passe-bande RLC</h3>
  <div class="statement">Circuit série \(R = 50\ \Omega\), \(L = 10\ \text{mH}\), \(C = 100\ \text{nF}\). La sortie (ouverte) est prise aux bornes de \(R\).</div>
  <div class="q"><strong>Q1.</strong> Établir la fonction de transfert sous forme canonique. Identifier \(\omega_0\) et \(Q\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(f_0\), \(Q\) et la largeur de la bande passante à \(-3\ \text{dB}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le gain (en décibels) et la phase pour \(\omega = 2\omega_0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Diviseur de tension : \(\underline H = \dfrac{R}{R + jL\omega + \frac{1}{jC\omega}} = \dfrac{1}{1 + j\left(\frac{L\omega}{R} - \frac{1}{RC\omega}\right)}\). Avec \(\omega_0 = 1/\sqrt{LC}\) et \(Q = \dfrac1R\sqrt{\dfrac LC}\), on a \(\dfrac{L\omega}{R} = Q\dfrac{\omega}{\omega_0}\) et \(\dfrac{1}{RC\omega} = Q\dfrac{\omega_0}{\omega}\) : \(\underline H = \dfrac{1}{1 + jQ\left(\frac{\omega}{\omega_0} - \frac{\omega_0}{\omega}\right)}\), de gain maximal \(H_0 = 1\).</p>
    <p><strong>Q2.</strong> \(\omega_0 = 1/\sqrt{10^{-9}} = 3{,}16\times10^4\ \text{rad·s}^{-1}\), \(f_0 = 5{,}03\ \text{kHz}\). \(Q = \dfrac{1}{50}\sqrt{10^5} = 6{,}3\). \(\Delta\omega = \omega_0/Q = 5{,}0\times10^3\ \text{rad·s}^{-1}\), soit \(\Delta f = 0{,}80\ \text{kHz}\).</p>
    <p><strong>Q3.</strong> \(\dfrac{\omega}{\omega_0} - \dfrac{\omega_0}{\omega} = 2 - 0{,}5 = 1{,}5\), et \(Q^2 = 40\) : \(G = \dfrac{1}{\sqrt{1 + 40\times2{,}25}} = \dfrac{1}{\sqrt{91}} = 0{,}105\), soit \(-19{,}6\ \text{dB}\) ; \(\varphi = -\arctan(1{,}5\,Q) = -84^\circ\). Une octave au-dessus de la fréquence centrale, le signal est déjà divisé par 10.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Dimensionner un passe-bande</h3>
  <div class="statement">On veut réaliser un passe-bande RLC série (sortie sur \(R\)) centré sur \(f_0 = 5{,}0\ \text{kHz}\), de bande passante \(\Delta f = 200\ \text{Hz}\). On dispose d'une bobine \(L = 10\ \text{mH}\).</div>
  <div class="q"><strong>Q1.</strong> Quel facteur de qualité faut-il ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(C\) puis \(R\).</div>
  <div class="q"><strong>Q3.</strong> Calculer les deux fréquences de coupure.</div>
  <div class="q"><strong>Q4.</strong> La bobine a en réalité une résistance \(r = 8{,}0\ \Omega\). Comment corriger le montage ? Quel effet sur le gain maximal du filtre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta f = f_0/Q\), donc \(Q = 5\,000/200 = 25\).</p>
    <p><strong>Q2.</strong> \(\omega_0 = 2\pi f_0 = 3{,}14\times10^4\ \text{rad·s}^{-1}\) ; \(C = \dfrac{1}{L\omega_0^2} = 101\ \text{nF}\) (on prend 100 nF). \(R = \dfrac1Q\sqrt{\dfrac LC} = \dfrac{316}{25} = 12{,}6\ \Omega\).</p>
    <p><strong>Q3.</strong> Les pulsations de coupure vérifient \(\omega_1\omega_2 = \omega_0^2\) et \(\omega_2 - \omega_1 = \omega_0/Q\), d'où \(f_{1,2} = f_0\left(\sqrt{1 + \dfrac{1}{4Q^2}} \mp \dfrac{1}{2Q}\right)\) : \(f_1 = 4\,901\ \text{Hz}\) et \(f_2 = 5\,101\ \text{Hz}\). Pour \(Q\) grand, la bande est presque symétrique autour de \(f_0\).</p>
    <p><strong>Q4.</strong> C'est la résistance totale du circuit, \(R + r\), qui fixe \(Q\) : il faut \(R + r = 12{,}6\ \Omega\), soit \(R = 4{,}6\ \Omega\). Mais la sortie est prise sur \(R\) seule : à \(f_0\), \(\underline H = \dfrac{R}{R + r} = 0{,}36\). Le gain maximal tombe à \(-8{,}8\ \text{dB}\) ; la sélectivité est conservée.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Résonance d'un passe-bas du deuxième ordre</h3>
  <div class="statement">On étudie le passe-bas \(\underline H = \dfrac{1}{1 + jx/Q - x^2}\), avec \(x = \omega/\omega_0\). Le calcul de la pulsation de résonance n'est pas exigible en PTSI, mais il entraîne au calcul d'un extremum.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(G(\omega_0) = Q\) et que la phase vaut \(-\pi/2\) en \(\omega_0\), quel que soit \(Q\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer la pulsation \(\omega_r\) à laquelle \(G\) est maximal et la condition sur \(Q\) pour qu'elle existe.</div>
  <div class="q"><strong>Q3.</strong> Pour \(Q = 1\) et \(Q = 5\), calculer \(\omega_r/\omega_0\) et \(G_{\max}\), et les comparer à \(G(\omega_0)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En \(x = 1\), \(\underline H = \dfrac{1}{j/Q} = -jQ\) : module \(Q\), argument \(-\pi/2\).</p>
    <p><strong>Q2.</strong> \(G^2 = 1/D\) avec \(D(y) = (1 - y)^2 + y/Q^2\) et \(y = x^2\). \(D'(y) = -2(1 - y) + 1/Q^2\) s'annule pour \(y = 1 - \dfrac{1}{2Q^2}\), qui doit être positif : il y a résonance si et seulement si \(Q \gt 1/\sqrt2\), en \(\omega_r = \omega_0\sqrt{1 - \dfrac{1}{2Q^2}}\). Sinon \(D\) croît, et le gain décroît depuis \(x = 0\).</p>
    <p><strong>Q3.</strong> \(D_{\min} = \dfrac{1}{Q^2} - \dfrac{1}{4Q^4}\), d'où \(G_{\max} = \dfrac{Q}{\sqrt{1 - 1/(4Q^2)}}\). Pour \(Q = 1\) : \(\omega_r = 0{,}71\,\omega_0\), \(G_{\max} = 1{,}15\) (\(+1{,}2\ \text{dB}\)) contre \(G(\omega_0) = 1\). Pour \(Q = 5\) : \(\omega_r = 0{,}990\,\omega_0\), \(G_{\max} = 5{,}03\) (\(+14{,}0\ \text{dB}\)) contre 5. Pour \(Q\) grand, le maximum se confond avec \(G(\omega_0) = Q\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Un carré à travers un passe-bas</h3>
  <div class="statement">Un signal carré de période \(T = 1{,}0\ \text{ms}\), alternant entre \(+1{,}0\) et \(-1{,}0\ \text{V}\), a pour décomposition fournie \(s(t) = \dfrac{4E}{\pi}\displaystyle\sum_{k\geq0}\dfrac{\sin\big((2k+1)\omega_1t\big)}{2k+1}\), avec \(E = 1{,}0\ \text{V}\) et \(\omega_1 = 2\pi/T\). On l'applique à un passe-bas du premier ordre de fréquence de coupure \(f_c = 1{,}5\ \text{kHz}\) et de gain statique 1.</div>
  <div class="q"><strong>Q1.</strong> Donner les fréquences et amplitudes des trois premiers harmoniques non nuls de l'entrée.</div>
  <div class="q"><strong>Q2.</strong> Calculer le gain et la phase du filtre à chacune de ces fréquences.</div>
  <div class="q"><strong>Q3.</strong> Écrire la sortie (trois premiers termes). Comparer le rapport harmonique 3 / fondamental à l'entrée et à la sortie, et décrire la forme du signal de sortie.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Rangs 1, 3, 5 : 1,0 kHz (\(4E/\pi = 1{,}27\ \text{V}\)), 3,0 kHz (0,42 V), 5,0 kHz (0,25 V).</p>
    <p><strong>Q2.</strong> \(G = 1/\sqrt{1 + x^2}\), \(\varphi = -\arctan x\), \(x = f/f_c\). À 1 kHz (\(x = 0{,}67\)) : \(G = 0{,}83\), \(\varphi = -34^\circ\). À 3 kHz (\(x = 2\)) : \(G = 0{,}45\), \(\varphi = -63^\circ\). À 5 kHz (\(x = 3{,}3\)) : \(G = 0{,}29\), \(\varphi = -73^\circ\).</p>
    <p><strong>Q3.</strong> En volts :</p>
    <div class="formula">$$s_s(t) \approx 1{,}06\sin(\omega_1t - 34^\circ) + 0{,}19\sin(3\omega_1t - 63^\circ) + 0{,}073\sin(5\omega_1t - 73^\circ)$$</div>
    <p>Le rapport harmonique 3 / fondamental passe de 0,33 à 0,18 : les harmoniques sont atténués d'autant plus qu'ils sont élevés, les fronts s'arrondissent, la sortie ressemble à des montées et descentes exponentielles (charge et décharge d'un condensateur), encore loin d'une sinusoïde.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Lisser la sortie d'un hacheur</h3>
  <div class="statement">Un hacheur délivre une tension en créneaux qui vaut \(E = 12\ \text{V}\) pendant \(\alpha T\) et 0 le reste de la période, avec \(\alpha = 0{,}40\) et \(f = 1/T = 20\ \text{kHz}\). On veut en extraire la valeur moyenne avec un passe-bas RC (gain statique 1) de fréquence de coupure \(f_c = 200\ \text{Hz}\), en sortie ouverte. On donne l'amplitude du fondamental du créneau : \(\dfrac{2E}{\pi}\sin(\pi\alpha)\).</div>
  <div class="q"><strong>Q1.</strong> Quelle est la valeur moyenne de la tension de sortie ? Pourquoi ce filtre est-il un moyenneur ?</div>
  <div class="q"><strong>Q2.</strong> Calculer l'amplitude du fondamental à l'entrée, puis en sortie.</div>
  <div class="q"><strong>Q3.</strong> Montrer que, pour l'ondulation, le filtre se comporte en intégrateur. En déduire que la sortie ondule en triangle et calculer l'ondulation crête à crête (pendant \(\alpha T\), \(\mathrm{d}u_s/\mathrm{d}t \approx \omega_c(E - \langle u_s\rangle)\)).</div>
  <div class="q"><strong>Q4.</strong> Par quel facteur l'ondulation serait-elle réduite avec un passe-bas du deuxième ordre (\(Q = 1/\sqrt2\)) de même fréquence de coupure ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> La composante continue de l'entrée, \(\alpha E = 4{,}8\ \text{V}\), est transmise avec \(H(0) = 1\) : \(\langle u_s\rangle = 4{,}8\ \text{V}\). Tous les harmoniques (20 kHz et au-delà) sont 100 fois au-dessus de la coupure : fortement atténués, il ne reste que la moyenne.</p>
    <p><strong>Q2.</strong> Entrée : \(\dfrac{24}{\pi}\sin(0{,}4\pi) = 7{,}3\ \text{V}\). Gain à 20 kHz : \(1/\sqrt{1 + 100^2} \approx 0{,}010\). Sortie : 0,073 V.</p>
    <p><strong>Q3.</strong> Toutes les composantes variables sont dans la zone \(-20\ \text{dB}\) par décade, où \(\underline H \approx \omega_c/(j\omega)\) : la partie variable de la sortie est \(\omega_c\) fois une primitive de celle de l'entrée. L'entrée variable étant constante par morceaux (\(E - \alpha E\) puis \(-\alpha E\)), la sortie varie linéairement : triangle. Pendant \(\alpha T\), elle monte de</p>
    <div class="formula">$$\Delta u = \omega_c(E - \alpha E)\,\alpha T = 2\pi\times200\times7{,}2\times0{,}40\times50\times10^{-6} = 0{,}18\ \text{V}$$</div>
    <p>crête à crête. Une simulation complète donne 0,181 V : l'approximation est excellente. L'amplitude de ce triangle (0,09 V) dépasse un peu celle du seul fondamental (0,073 V) : les autres harmoniques comptent aussi.</p>
    <p><strong>Q4.</strong> Au-delà de la coupure, le gain d'un deuxième ordre décroît comme \((f_c/f)^2\) au lieu de \(f_c/f\) : à 20 kHz, \(10^{-4}\) au lieu de \(10^{-2}\). L'ondulation est divisée par 100 environ (fondamental de sortie : 0,7 mV).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Gabarit et mise en cascade</h3>
  <div class="statement">Un signal audio utile occupe 0 à 4,0 kHz ; il est pollué par un bruit à 40 kHz. Cahier des charges : gain supérieur à \(-3\ \text{dB}\) jusqu'à 4,0 kHz, inférieur à \(-30\ \text{dB}\) à 40 kHz.</div>
  <div class="q"><strong>Q1.</strong> Un passe-bas RC de coupure 4,0 kHz convient-il ?</div>
  <div class="q"><strong>Q2.</strong> On met en cascade deux cellules RC identiques séparées par un suiveur (étage tampon), de sorte que \(\underline H = \underline H_1^2\). Quelle fréquence de coupure \(f_c'\) donner à chaque cellule pour respecter exactement \(-3\ \text{dB}\) à 4,0 kHz ? Le gabarit est-il respecté à 40 kHz ?</div>
  <div class="q"><strong>Q3.</strong> On supprime le suiveur et on branche directement deux cellules identiques \((R, C)\) : \(\underline H = \dfrac{1}{1 - x^2 + 3jx}\) avec \(x = RC\omega\). Calculer le gain à 4,0 kHz avec la même valeur de \(RC\). Conclure.</div>
  <div class="q"><strong>Q4.</strong> On garde la cascade directe mais la seconde cellule a une résistance dix fois plus grande et une capacité dix fois plus faible : \(\underline H = \dfrac{1}{1 - x^2 + 2{,}1jx}\). Recalculer le gain à 4,0 kHz. Expliquer l'amélioration.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> À 40 kHz, \(x = 10\) : \(G_{\text{dB}} \approx -20\ \text{dB}\). C'est insuffisant : il faut \(-30\ \text{dB}\), donc une pente plus forte qu'un premier ordre.</p>
    <p><strong>Q2.</strong> \(G = \dfrac{1}{1 + x^2}\) avec \(x = f/f_c'\) ; \(G = 1/\sqrt2\) pour \(1 + x^2 = \sqrt2\), \(x = 0{,}644\) : \(f_c' = 4{,}0/0{,}644 = 6{,}2\ \text{kHz}\). À 40 kHz, \(x = 6{,}4\) : \(G = 1/(1 + 41{,}4) = 0{,}024\), soit \(-32{,}6\ \text{dB}\) : le gabarit est respecté.</p>
    <p><strong>Q3.</strong> À 4,0 kHz, \(x = 0{,}644\) : \(|1 - 0{,}414 + 1{,}93\,j| = 2{,}02\), \(G = 0{,}50\), soit \(-6{,}1\ \text{dB}\) : le gabarit n'est plus respecté. La seconde cellule, d'impédance d'entrée comparable à l'impédance de sortie de la première, la charge : on ne peut plus multiplier les fonctions de transfert.</p>
    <p><strong>Q4.</strong> \(|1 - 0{,}414 + 1{,}35\,j| = 1{,}47\), \(G = 0{,}68\), soit \(-3{,}4\ \text{dB}\) : presque le résultat idéal. L'impédance d'entrée de la seconde cellule est dix fois plus grande que celle de la première : l'effet de charge est réduit (il reste 0,4 dB à rattraper en baissant un peu \(RC\), ou avec un suiveur).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Un accéléromètre</h3>
  <div class="statement">Un accéléromètre est un boîtier fixé sur une machine, contenant une masse \(m\) suspendue par un ressort de raideur \(k\) et freinée par un amortissement de coefficient \(\alpha\) (force \(-\alpha\dot y\)). On note \(x_s(t)\) le déplacement de la machine (et du boîtier) et \(y(t)\) le déplacement de la masse par rapport au boîtier, compté depuis l'équilibre. Fréquence propre \(f_0 = \dfrac{1}{2\pi}\sqrt{k/m} = 2{,}0\ \text{kHz}\), facteur de qualité \(Q = 0{,}70\). Le référentiel terrestre est galiléen.</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle vérifiée par \(y\).</div>
  <div class="q"><strong>Q2.</strong> En régime sinusoïdal forcé, établir \(\underline H = \underline Y/\underline X_s\). Quelle est la nature de ce filtre ?</div>
  <div class="q"><strong>Q3.</strong> Montrer qu'aux basses fréquences \(y\) est proportionnel à l'accélération de la machine. Calculer l'amplitude de \(y\) pour une vibration de 100 Hz d'accélération d'amplitude \(5{,}0\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q4.</strong> Jusqu'à quelle fréquence l'écart à la proportionnalité reste-t-il inférieur à 5 % ? (On cherchera \(x = f/f_0\) tel que \(\big|1 + jx/Q - x^2\big| = 1/0{,}95\).)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> La masse a pour position \(x_s + y\) dans le référentiel terrestre ; le ressort et l'amortisseur dépendent de la position relative : \(m(\ddot x_s + \ddot y) = -ky - \alpha\dot y\), soit \(\ddot y + \dfrac{\omega_0}{Q}\dot y + \omega_0^2y = -\ddot x_s\), avec \(\omega_0 = \sqrt{k/m}\) et \(Q = \sqrt{km}/\alpha\).</p>
    <p><strong>Q2.</strong> \(-\ddot x_s\) a pour amplitude complexe \(\omega^2\underline X_s\), donc</p>
    <div class="formula">$$\left(\omega_0^2 - \omega^2 + j\frac{\omega\omega_0}{Q}\right)\underline Y = \omega^2\underline X_s$$</div>
    <p>d'où \(\underline H = \dfrac{x^2}{1 + jx/Q - x^2}\) avec \(x = \omega/\omega_0\). Gain nul en BF, égal à 1 en HF : passe-haut du deuxième ordre.</p>
    <p><strong>Q3.</strong> Pour \(x \ll 1\), \(\underline H \approx x^2\), donc \(\underline Y \approx \dfrac{\omega^2}{\omega_0^2}\underline X_s\), c'est-à-dire \(\underline Y \approx -\dfrac{\underline A_s}{\omega_0^2}\), où \(\underline A_s = -\omega^2\underline X_s\) est l'accélération : \(y \approx -a_s/\omega_0^2\). À 100 Hz (\(x = 0{,}05\)) : \(Y_m = \dfrac{5{,}0}{(2\pi\times2\,000)^2}\), soit \(Y_m = 3{,}2\times10^{-8}\ \text{m} = 32\ \text{nm}\), avec une erreur relative de \(5\times10^{-5}\).</p>
    <p><strong>Q4.</strong> \(|1 + jx/Q - x^2|^2 = 1 + x^2(1/Q^2 - 2) + x^4\), soit \(1 + 0{,}041\,x^2 + x^4\). On résout \(1 + 0{,}041\,x^2 + x^4 = 1/0{,}95^2 = 1{,}108\) : \(x^2 = 0{,}309\), \(x = 0{,}56\), soit \(f = 1{,}1\ \text{kHz}\). Avec \(Q = 0{,}70\), le terme en \(x^2\) est presque nul : c'est ce qui rend la réponse plate le plus longtemps.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Fabriquer une sinusoïde à partir d'un créneau</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>spectre, fonction de transfert, passe-bas et passe-bande, cahier des charges, mise en cascade, simulation numérique</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un microcontrôleur ne sait produire que des créneaux : sa broche de sortie vaut \(E = 5{,}0\ \text{V}\) pendant une demi-période et 0 pendant l'autre, à la fréquence \(f = 1{,}0\ \text{kHz}\). On veut en tirer une tension sinusoïdale de 1,0 kHz, centrée sur 0, dont l'harmonique 3 soit inférieur à 1 % du fondamental. La décomposition du créneau est fournie : \(u_e(t) = \dfrac E2 + \dfrac{2E}{\pi}\displaystyle\sum_{n\ \text{impair}}\dfrac{\sin(n\omega t)}{n}\).
  </div>
  <p class="exo-part">Partie A — Le signal de départ</p>
  <div class="q"><strong>A1.</strong> Donner la valeur moyenne de \(u_e\), l'amplitude du fondamental et celle de l'harmonique 3.</div>
  <div class="q"><strong>A2.</strong> Calculer la valeur efficace de \(u_e\) à partir de sa forme, puis la part de \(U_{e,\text{eff}}^2\) portée par la composante continue et par le fondamental.</div>
  <p class="exo-part">Partie B — Premier essai : un passe-bas RC</p>
  <div class="q"><strong>B1.</strong> On utilise une cellule RC passe-bas (\(R = 10\ \text{k}\Omega\), \(C = 22\ \text{nF}\)). Calculer \(f_c\).</div>
  <div class="q"><strong>B2.</strong> Calculer le rapport harmonique 3 / fondamental en sortie. Le cahier des charges est-il respecté ? Que devient la composante continue ?</div>
  <p class="exo-part">Partie C — Un passe-bande RLC</p>
  <div class="q"><strong>C1.</strong> On utilise un RLC série, sortie sur \(R\), avec \(L = 100\ \text{mH}\). Quelle capacité choisir pour centrer le filtre sur 1,0 kHz ? Que devient la composante continue ?</div>
  <div class="q"><strong>C2.</strong> Exprimer le rapport harmonique 3 / fondamental en sortie en fonction de \(Q\). En déduire le facteur de qualité minimal, puis la résistance \(R\) maximale.</div>
  <div class="q"><strong>C3.</strong> La bobine a une résistance \(r = 20\ \Omega\). Avec \(Q = 15\), quelle valeur donner à \(R\) ? Montrer que le gain à 1 kHz vaut alors \(R/(R + r)\) et calculer l'amplitude de la sinusoïde obtenue.</div>
  <p class="exo-part">Partie D — Brancher une charge</p>
  <div class="q"><strong>D1.</strong> On branche la sortie (aux bornes de \(R\)) sur un haut-parleur assimilé à une résistance de \(8{,}0\ \Omega\). Que deviennent la résistance du circuit, le facteur de qualité et le gain à 1 kHz ? Proposer un remède.</div>
  <p class="exo-part">Partie E — Simulation numérique</p>
  <div class="q"><strong>E1.</strong> En réutilisant les fonctions <span class="code-inline">filtrer</span> et <span class="code-inline">passe_bande</span> du cours (§12), écrire une boucle Python qui cherche, par pas de 0,1, le plus petit facteur de qualité respectant le cahier des charges. Quel résultat attend-on ? Pourquoi l'harmonique 5 n'est-il alors pas gênant ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(\langle u_e\rangle = E/2 = 2{,}5\ \text{V}\). Fondamental : \(2E/\pi = 3{,}18\ \text{V}\) ; harmonique 3 : \(2E/(3\pi) = 1{,}06\ \text{V}\), le tiers.</p>
    <p><strong>A2.</strong> \(u_e^2\) vaut \(E^2\) la moitié du temps : \(U_{e,\text{eff}} = E/\sqrt2 = 3{,}54\ \text{V}\), \(U_{e,\text{eff}}^2 = 12{,}5\ \text{V}^2\). Composante continue : \(2{,}5^2/12{,}5 = 50\ \%\). Fondamental : \(3{,}18^2/2/12{,}5 = 40{,}5\ \%\) ; les autres harmoniques se partagent les 9,5 % restants.</p>
    <p><strong>B1.</strong> \(f_c = \dfrac{1}{2\pi RC}\), avec \(RC = 10^4\times22\times10^{-9} = 2{,}2\times10^{-4}\ \text{s}\) : \(f_c = 723\ \text{Hz}\).</p>
    <p><strong>B2.</strong> Rapport en sortie :</p>
    <div class="formula">$$\frac13\times\frac{G(3f)}{G(f)} = \frac13\sqrt{\frac{1 + (1/0{,}723)^2}{1 + (3/0{,}723)^2}} = \frac13\times\frac{1{,}71}{4{,}27} = 0{,}13$$</div>
    <p>soit 13 %, très loin de 1 %. Le premier ordre est trop peu sélectif : il n'atténue l'harmonique 3 que 2,5 fois plus que le fondamental. La composante continue passe intégralement (\(H(0) = 1\)) : la sortie n'est pas centrée sur 0.</p>
    <p><strong>C1.</strong> \(C = \dfrac{1}{L\omega_0^2} = \dfrac{1}{0{,}1\times(2\pi\times1\,000)^2} = 253\ \text{nF}\). La composante continue est éliminée (\(H(0) = 0\) : le condensateur bloque le courant continu) : la sortie est centrée sur 0.</p>
    <p><strong>C2.</strong> Le fondamental est au centre (\(G = 1\)) ; à \(3f\), \(G = \dfrac{1}{\sqrt{1 + Q^2(3 - 1/3)^2}}\). Rapport : \(\rho = \dfrac{1}{3\sqrt{1 + \frac{64}{9}Q^2}}\). \(\rho \lt 0{,}01\) impose \(1 + \frac{64}{9}Q^2 \gt 1\,111\), soit \(Q \gt 12{,}5\). Avec \(Q = \dfrac1R\sqrt{\dfrac LC} = \dfrac{629}{R}\) : \(R \lt 50\ \Omega\) (résistance totale du circuit).</p>
    <p><strong>C3.</strong> \(R + r = 629/15 = 42\ \Omega\), donc \(R = 22\ \Omega\). À \(\omega_0\), les impédances de \(L\) et \(C\) se compensent : le courant vaut \(\underline U_e/(R + r)\) et la sortie \(R\,\underline I\) : \(\underline H(\omega_0) = \dfrac{R}{R + r} = 0{,}52\). Amplitude de sortie : \(0{,}52\times3{,}18 = 1{,}7\ \text{V}\), harmonique 3 à 0,8 % (\(Q = 15\)).</p>
    <p><strong>D1.</strong> Le haut-parleur en parallèle sur \(R = 22\ \Omega\) donne \(22 \parallel 8{,}0 = 5{,}9\ \Omega\). La résistance totale devient \(5{,}9 + 20 = 25{,}9\ \Omega\) : \(Q = 629/25{,}9 = 24\) (plus sélectif) mais le gain à 1 kHz tombe à \(5{,}9/25{,}9 = 0{,}23\) : 0,72 V au lieu de 1,7 V. La charge modifie la fonction de transfert, car l'impédance de sortie du filtre n'est pas petite devant 8 Ω. Remède : intercaler un suiveur (impédance d'entrée quasi infinie, impédance de sortie quasi nulle), qui fournira en outre le courant.</p>
    <p><strong>E1.</strong> Par exemple :</p>
    <pre class="codeblock">Q = 1.0
<span class="kw">while</span> <span class="kw">True</span>:
    A_s, phi_s = filtrer(rangs, amplitudes, phases, <span class="kw">lambda</span> fr: passe_bande(fr, f, Q))
    <span class="kw">if</span> A_s[1] / A_s[0] &lt; 0.01:     <span class="cmt"># rang 3 / rang 1</span>
        <span class="kw">break</span>
    Q = Q + 0.1
print(round(Q, 1))                   <span class="cmt"># 12.5</span></pre>
    <p>(avec <span class="code-inline">rangs</span>, <span class="code-inline">amplitudes</span> et <span class="code-inline">phases</span> décrivant les rangs impairs du créneau ; la composante continue, multipliée par \(H(0) = 0\), est omise). On retrouve \(Q \approx 12{,}5\) (C2). L'harmonique 5 est à la fois plus faible à l'entrée (\(1/5\) du fondamental) et plus atténué (\(G(5f) \approx 0{,}016\) pour \(Q = 12{,}5\)) : il ne représente que 0,3 % du fondamental.</p>
  </div>
