<div class="course-section">
  <div class="sec-num">§1 · PRINCIPE D'UN OSCILLATEUR</div>
  <h2>Produire un signal périodique sans signal d'entrée</h2>
  <div class="intro">Un générateur basse fréquence, l'horloge d'un microcontrôleur, l'émetteur d'une radio : tous contiennent un oscillateur. Ce circuit ne reçoit aucun signal à traiter ; il puise l'énergie continue de son alimentation et la restitue sous forme d'un signal alternatif entretenu.</div>

  <div class="def-box">
    <strong>Oscillateur électronique.</strong> Circuit dont la sortie est un signal périodique <strong>entretenu</strong> alors qu'aucune excitation variable n'est appliquée de l'extérieur (on parle d'<strong>auto-oscillation</strong>). On distingue deux familles :
    <ul style="margin:.4rem 0;padding-left:1.2rem">
      <li>les <strong>oscillateurs quasi sinusoïdaux</strong> (ou quasi linéaires) : un amplificateur fonctionnant en régime linéaire est bouclé sur un filtre sélectif ; le signal est presque sinusoïdal ;</li>
      <li>les <strong>oscillateurs de relaxation</strong> : un élément à seuil (comparateur à hystérésis, en régime saturé) bascule périodiquement entre deux états ; les signaux sont des créneaux, des triangles ou des arcs d'exponentielle.</li>
    </ul>
  </div>

  <h3>Les ingrédients d'un oscillateur</h3>
  <ul>
    <li>Une <strong>source d'énergie</strong> : l'alimentation continue (typiquement \(\pm 15\ \text{V}\)) de l'élément actif. Un oscillateur ne crée pas d'énergie, il convertit du continu en alternatif.</li>
    <li>Un <strong>élément actif</strong> (ALI, transistor) qui compense les pertes : sans lui, tout circuit passif finit au repos.</li>
    <li>Un <strong>élément qui fixe la fréquence</strong> : filtre sélectif, circuit \(LC\), quartz, ou constante de temps \(RC\) pour la relaxation.</li>
    <li>Une <strong>non-linéarité</strong> (saturation, diodes…) qui borne l'amplitude.</li>
  </ul>

  <div class="prop-box">
    <strong>Démarrage sur le bruit.</strong> Le repos (toutes les tensions nulles) est toujours une solution des équations du montage, mais l'oscillateur est conçu pour que ce repos soit <strong>instable</strong> : la moindre fluctuation (bruit thermique des résistances, transitoire de mise sous tension) est amplifiée jusqu'à ce que les non-linéarités l'arrêtent. Aucun « lancement » extérieur n'est nécessaire.
  </div>

<div class="course-section">
  <div class="sec-num">§2 · APPROCHE TEMPORELLE</div>
  <h2>Équation différentielle, condition d'oscillation et d'amorçage</h2>
  <div class="intro">Tant que tous les composants restent en régime linéaire, un oscillateur quasi sinusoïdal sans entrée obéit à une équation différentielle linéaire <strong>homogène</strong> (second membre nul). Tout se joue sur le signe du terme d'amortissement.</div>

  <h3>Forme générale à l'ordre 2</h3>
  <p>En combinant les lois de Kirchhoff et le modèle linéaire de l'ALI, on obtient pour une tension \(s(t)\) du montage :</p>
  <div class="formula">$$a_2\,\frac{\mathrm{d}^2 s}{\mathrm{d}t^2} + a_1\,\frac{\mathrm{d}s}{\mathrm{d}t} + a_0\,s = 0$$</div>
  <p>avec \(a_2 \gt 0\) et \(a_0 \gt 0\) dans les cas usuels. On pose \(\omega_0 = \sqrt{a_0/a_2}\) et \(\sigma = -\dfrac{a_1}{2a_2}\) (taux de croissance). L'équation caractéristique \(r^2 - 2\sigma r + \omega_0^2 = 0\) a pour racines, lorsque \(|\sigma| \lt \omega_0\) :</p>
  <div class="formula">$$r = \sigma \pm \mathrm{j}\,\Omega, \qquad \Omega = \sqrt{\omega_0^2 - \sigma^2}$$</div>
  <p>avec \(\Omega \approx \omega_0\) dès que \(|\sigma| \ll \omega_0\).</p>

  <div class="prop-box">
    <strong>Les trois cas selon le signe de \(a_1\).</strong>
    <ul style="margin:.4rem 0;padding-left:1.2rem">
      <li>\(a_1 \gt 0\) (\(\sigma \lt 0\)) : le terme dissipatif domine et toute perturbation s'éteint exponentiellement. Montage <strong>stable</strong> : rien ne démarre.</li>
      <li>\(a_1 = 0\) : \(s(t) = S_m\cos(\omega_0 t + \varphi)\), sinusoïde parfaite dont l'amplitude dépend des conditions initiales. C'est le modèle de l'oscillateur harmonique, qu'<strong>aucun montage ne réalise</strong> : tolérances et dérives thermiques empêchent de maintenir \(a_1\) exactement à zéro.</li>
      <li>\(a_1 \lt 0\) (\(\sigma \gt 0\)) : montage <strong>instable</strong>, \(s(t) = S_0\,e^{\sigma t}\cos(\Omega t + \varphi)\) : oscillation d'amplitude croissante.</li>
    </ul>
  </div>

  <div class="def-box">
    <strong>Conditions temporelles.</strong>
    <ul style="margin:.4rem 0;padding-left:1.2rem">
      <li><strong>Condition d'oscillation</strong> (limite) : \(a_1 = 0\) ; elle se traduit par une relation entre les valeurs des composants.</li>
      <li><strong>Condition d'amorçage</strong> : \(a_1 \lt 0\) ; on vise un taux de croissance faible (\(\sigma \ll \omega_0\)), car tout excès de gain se paie en distorsion (§3).</li>
      <li><strong>Pulsation d'oscillation</strong> : \(\omega_0 = \sqrt{a_0/a_2}\).</li>
    </ul>
  </div>

  <div class="notice">Vérifier aussi le signe de \(a_0\) : si \(a_0\) et \(a_2\) sont de signes opposés, l'équation caractéristique a une racine réelle positive. La tension diverge alors <strong>sans osciller</strong> et la sortie reste bloquée en saturation : le montage est instable, mais ce n'est pas un oscillateur.</div>

  <h3>Durée d'établissement</h3>
  <p>Pendant la phase linéaire, l'enveloppe croît comme \(e^{\sigma t}\). Partant du niveau de bruit \(S_b\), la sortie atteint la saturation au bout de :</p>
  <div class="formula">$$t_{\text{ét}} \approx \frac{1}{\sigma}\,\ln\frac{V_{\text{sat}}}{S_b}$$</div>

  <h3>Lien avec la stabilité des systèmes linéaires</h3>
  <p>Un système d'ordre 2 est stable si et seulement si \(a_0\), \(a_1\), \(a_2\) sont de même signe. Un oscillateur quasi sinusoïdal est donc un système placé <strong>à la limite de stabilité</strong> (pôles \(\pm\mathrm{j}\omega_0\) imaginaires purs) et, en pratique, rendu <strong>légèrement instable</strong> (pôles \(\sigma \pm \mathrm{j}\Omega\) de partie réelle positive petite).</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · RÔLE DES NON-LINÉARITÉS</div>
  <h2>Ce qui fixe l'amplitude</h2>
  <div class="intro">La théorie linéaire prédit soit une croissance sans fin (\(\sigma \gt 0\)), soit une amplitude arbitraire (\(\sigma = 0\)). Dans un oscillateur réel, c'est toujours une non-linéarité qui fixe l'amplitude finale.</div>

  <h3>Limitation par la saturation de l'ALI</h3>
  <p>Quand la sortie de l'ALI atteint \(\pm V_{\text{sat}}\), elle n'est plus proportionnelle à l'entrée : pendant une partie de la période, l'amplificateur « n'amplifie plus ». Sur une période, tout se passe comme si le gain diminuait quand l'amplitude augmente. L'amplitude se stabilise à la valeur pour laquelle l'énergie apportée pendant la phase linéaire compense exactement les pertes : l'amortissement <strong>moyen</strong> est nul.</p>

  <div class="prop-box">
    <strong>Compromis amorçage / pureté.</strong> L'amplitude finale est de l'ordre de \(V_{\text{sat}}\) et la déformation est d'autant plus forte que \(|a_1|\) est grand : un fort excès de gain donne un signal écrêté, presque trapézoïdal, riche en harmoniques. On règle donc \(a_1\) <strong>légèrement négatif</strong> : le démarrage est garanti et le signal reste quasi sinusoïdal.
  </div>

  <h3>Stabilisation d'amplitude</h3>
  <p>Pour obtenir un sinus très pur <strong>sans</strong> saturer l'ALI, on ajoute un élément non linéaire dont l'effet croît doucement avec l'amplitude : diodes tête-bêche en parallèle sur une partie de la résistance de réaction, thermistance, lampe à incandescence (solution historique), transistor à effet de champ utilisé en résistance commandée. Le gain effectif diminue continûment quand l'amplitude augmente : la boucle se règle d'elle-même sur un gain moyen égal au gain critique, bien avant la saturation.</p>

  <div class="notice"><strong>Cycle limite.</strong> Dans le plan de phase \((s, \dot s)\), la trajectoire d'un oscillateur réel part en spirale depuis l'origine puis converge vers une courbe fermée unique, quelles que soient les conditions initiales. Cette amplitude intrinsèque distingue un oscillateur auto-entretenu d'un oscillateur harmonique, dont l'amplitude dépend des conditions initiales.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Question</span>
    <span class="prompt">Pourquoi la fréquence d'un oscillateur quasi sinusoïdal dépend-elle très peu de la non-linéarité qui limite l'amplitude ?</span>
    <div class="content"><p>La fréquence est imposée par l'élément sélectif (condition de phase sur le filtre, ou \(\omega_0 = 1/\sqrt{LC}\)), alors que la non-linéarité agit surtout sur le <strong>module</strong> du gain. Tant que la déformation reste faible, la fréquence reste très proche de \(\omega_0/2\pi\) ; elle ne s'en écarte notablement que si le signal est fortement écrêté (environ \(-13\ \%\) pour un pont de Wien de gain \(A = 4\), d'après la simulation de la méthode 7).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · APPROCHE FRÉQUENTIELLE</div>
  <h2>Chaîne bouclée et condition de Barkhausen</h2>
  <div class="intro">La plupart des oscillateurs quasi sinusoïdaux se découpent en deux blocs : un amplificateur de fonction de transfert \(\underline{A}\) et un filtre sélectif \(\underline{\beta}\) (parfois noté \(\underline{B}\)), montés en boucle fermée sans aucune entrée extérieure.</div>

</figure>

  <h3>Condition de Barkhausen</h3>
  <p>Supposons établi un régime sinusoïdal de pulsation \(\omega\). En notation complexe, \(\underline{s} = \underline{A}\,\underline{e}\) et \(\underline{e} = \underline{\beta}\,\underline{s}\), d'où \((1 - \underline{A}\,\underline{\beta})\,\underline{s} = 0\). Un signal non nul n'est possible que si :</p>
  <div class="prop-box">
    <strong>Condition de Barkhausen</strong> (à la pulsation d'oscillation \(\omega_0\)) :
    $$\underline{A}(\mathrm{j}\omega_0)\,\underline{\beta}(\mathrm{j}\omega_0) = 1$$
    soit deux équations réelles :
    $$|\underline{A}\,\underline{\beta}| = 1 \qquad \text{et} \qquad \arg(\underline{A}\,\underline{\beta}) = 0\ [2\pi]$$
    La <strong>condition de phase</strong> fixe \(\omega_0\) ; la <strong>condition de module</strong> impose une relation entre les composants (le gain critique). Le produit \(\underline{A}\,\underline{\beta}\) est la fonction de transfert en boucle ouverte.
  </div>
  <p><strong>Amorçage.</strong> En pratique, on règle \(|\underline{A}\,\underline{\beta}(\mathrm{j}\omega_0)|\) <strong>légèrement supérieur à 1</strong> : la composante du bruit à \(\omega_0\) est réinjectée en phase et légèrement amplifiée à chaque passage dans l'amplificateur puis le filtre : elle croît exponentiellement, jusqu'à ce que les non-linéarités ramènent le gain moyen de boucle à 1. Si \(|\underline{A}\,\underline{\beta}| \lt 1\), elle s'éteint.</p>

  <div class="notice">La condition de Barkhausen décrit un régime sinusoïdal <strong>supposé établi</strong> : elle donne la fréquence et le gain critique, mais pas l'amplitude, et ne prouve pas à elle seule que les oscillations démarrent. Pour conclure rigoureusement sur l'amorçage, on revient à l'équation différentielle (signe de \(a_1\)).</div>

  <h3>Lien avec l'équation différentielle</h3>
  <p>Écrivons \(\underline{\beta} = N/D\) et remplaçons \(\mathrm{j}\omega\) par \(p\) (ou par \(\mathrm{d}/\mathrm{d}t\)). La relation de boucle donne l'équation caractéristique :</p>
  <div class="formula">$$1 - A\,\beta(p) = 0 \iff D(p) - A\,N(p) = 0$$</div>
  <p>La condition de Barkhausen revient à demander que cette équation ait les racines imaginaires pures \(p = \pm\mathrm{j}\omega_0\) : on retrouve la limite \(a_1 = 0\) de l'approche temporelle.</p>

  <h3>Rôle de la sélectivité du filtre</h3>
  <p>La condition de phase ne doit être satisfaite qu'à une seule pulsation. Plus le filtre est sélectif (facteur de qualité \(Q\) élevé, phase variant vite autour de \(\omega_0\)), plus la fréquence est stable et plus les harmoniques créés par la non-linéarité sont atténués. Un quartz (\(Q\) de \(10^4\) à \(10^6\)) fixe la fréquence à \(10^{-5}\)–\(10^{-6}\) près en valeur relative (bien mieux s'il est thermostaté) ; un filtre \(RC\) est bien moins sélectif.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">L'amplificateur est un non-inverseur (A réel positif). Quel déphasage doit introduire le filtre à \(\omega_0\) ? Et si l'amplificateur est inverseur ?</span>
    <div class="content"><p>Avec \(A \gt 0\), il faut \(\arg\underline{\beta}(\mathrm{j}\omega_0) = 0\) : typiquement un <strong>passe-bande</strong> utilisé à sa pulsation centrale (pont de Wien). Avec \(A \lt 0\) (argument \(\pi\)), il faut \(\arg\underline{\beta}(\mathrm{j}\omega_0) = -\pi\) : par exemple trois cellules \(RC\) en cascade (oscillateur à déphasage).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · OSCILLATEUR À PONT DE WIEN</div>
  <h2>L'oscillateur à pont de Wien</h2>
  <div class="intro">C'est l'oscillateur quasi sinusoïdal du TP : un amplificateur non inverseur bouclé sur un filtre de Wien (une branche \(R\)–\(C\) série suivie d'une branche \(R\)∥\(C\) reliée à la masse). Étudions-le par les deux approches.</div>

</figure>

  <h3>Bloc amplificateur</h3>
  <p>L'ALI idéal est supposé en régime linéaire (rétroaction sur l'entrée \(-\) par \(R_2\)) : \(V^+ = V^-\), avec \(V^+ = e\) et \(V^- = \dfrac{R_1}{R_1+R_2}\,s\) (diviseur de tension, \(i^- = 0\)). D'où le gain réel :</p>
  <div class="formula">$$A = \frac{s}{e} = 1 + \frac{R_2}{R_1}$$</div>

  <h3>Bloc filtre</h3>
  <p>Le courant d'entrée \(i^+\) étant nul, le filtre est un diviseur de tension entre \(\underline{Z}_s = R + \dfrac{1}{\mathrm{j}C\omega}\) et \(\underline{Z}_p\), d'admittance \(\underline{Y}_p = \dfrac{1}{R} + \mathrm{j}C\omega\). Avec \(x = RC\omega\) :</p>
  <div class="formula">$$\underline{\beta} = \frac{\underline{e}}{\underline{s}} = \frac{1}{1 + \underline{Z}_s\,\underline{Y}_p} = \frac{1}{3 + \mathrm{j}\left(x - \dfrac{1}{x}\right)}$$</div>
  <p>C'est un passe-bande d'ordre 2 de forme canonique \(\underline{\beta} = \dfrac{\beta_0}{1 + \mathrm{j}Q\left(\frac{\omega}{\omega_0} - \frac{\omega_0}{\omega}\right)}\), avec \(\beta_0 = \dfrac13\), \(\omega_0 = \dfrac{1}{RC}\) et \(Q = \dfrac13\) : un filtre <strong>peu sélectif</strong>.</p>

  <h3>Condition de Barkhausen</h3>
  <p>\(A\,\underline{\beta} = 1\) s'écrit \(A = 3 + \mathrm{j}\left(x - \dfrac1x\right)\). La partie imaginaire impose \(x = 1\), la partie réelle \(A = 3\).</p>
  <div class="prop-box">
    <strong>Pont de Wien.</strong>
    $$\omega_0 = \frac{1}{RC}, \qquad f_0 = \frac{1}{2\pi RC}$$
    $$A = 3 \iff R_2 = 2R_1$$
    Amorçage : \(R_2\) <strong>légèrement supérieure</strong> à \(2R_1\). À \(\omega_0\), \(\underline{\beta}\) est réel : \(e = s/3\), en phase avec \(s\).
  </div>

  <h3>Approche temporelle</h3>
  <p>En notation opérationnelle (\(\tau = RC\)), \(\beta(p) = \dfrac{\tau p}{1 + 3\tau p + \tau^2 p^2}\), soit \((1 + 3\tau p + \tau^2p^2)\,e = \tau p\,s\). Avec \(s = A\,e\) :</p>
  <div class="formula">$$\frac{\mathrm{d}^2 e}{\mathrm{d}t^2} + (3 - A)\,\omega_0\,\frac{\mathrm{d}e}{\mathrm{d}t} + \omega_0^2\,e = 0$$</div>
  <p>avec \(\omega_0 = 1/(RC)\). Le coefficient d'amortissement change de signe pour \(A = 3\) : amorti si \(A \lt 3\), sinus idéal si \(A = 3\), amorçage si \(A \gt 3\), avec un taux de croissance \(\sigma = \dfrac{(A-3)\,\omega_0}{2}\). Les deux approches concordent.</p>

  <h3>Réglage en TP</h3>
  <ul>
    <li>\(R_2\) est un potentiomètre (ou une résistance fixe complétée d'un potentiomètre). On part de \(R_2 \lt 2R_1\) : rien ne se passe.</li>
    <li>En augmentant lentement \(R_2\), les oscillations apparaissent pour \(R_2\) à peine supérieure à \(2R_1\) : sinus propre, mais établissement lent.</li>
    <li>Si l'on pousse \(R_2\) trop loin, le signal s'écrête à \(\pm V_{\text{sat}}\) et devient presque trapézoïdal ; l'analyse spectrale (FFT de l'oscilloscope) montre des harmoniques impairs croissants.</li>
    <li>Contrôles : \(f_0\) mesurée proche de \(1/(2\pi RC)\) (aux tolérances près) ; en mode XY (\(e\) en abscisse, \(s\) en ordonnée), on observe un segment de pente \(\approx 3\) : les deux signaux sont en phase.</li>
  </ul>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Ordre de grandeur</span>
    <span class="prompt">Avec \(R = 10\ \text{k}\Omega\) et \(C = 10\ \text{nF}\), quelle fréquence ? Que faut-il changer pour la multiplier par 10 ?</span>
    <div class="content"><p>\(f_0 = \dfrac{1}{2\pi\times10^{4}\times10^{-8}} \approx 1{,}6\ \text{kHz}\). Pour \(16\ \text{kHz}\), on divise \(C\) (ou \(R\)) par 10 ; le gain critique, lui, reste égal à 3. En pratique, on modifie simultanément les deux résistances \(R\) (potentiomètre double) pour balayer la fréquence.</p></div>
  </div>
  <div class="notice">Le nom vient du pont de mesure de Max Wien : les quatre branches (\(R_1\), \(R_2\), la branche \(RC\) série et la branche \(RC\) parallèle) forment un pont, équilibré à la pulsation \(\omega_0\) lorsque \(R_2 = 2R_1\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · OSCILLATEUR À RÉSISTANCE NÉGATIVE</div>
  <h2>Compenser les pertes d'un circuit LC</h2>
  <div class="intro">Un circuit \(LC\) oscille spontanément à \(\omega_0 = 1/\sqrt{LC}\), mais ses oscillations s'amortissent à cause des résistances (fils, bobine, isolants). Si on lui associe un dipôle qui <strong>fournit</strong> de la puissance au lieu d'en dissiper — une résistance négative —, on peut annuler l'amortissement.</div>

  <div class="def-box">
    <strong>Résistance négative.</strong> Un dipôle présente, sur un domaine de fonctionnement, la résistance négative \(-R_N\) (\(R_N \gt 0\)) si, en convention récepteur, \(u = -R_N\,i\). La puissance qu'il reçoit, \(u\,i = -R_N\,i^2\), est négative : il <strong>fournit</strong> de la puissance au reste du circuit, ce qui n'est possible qu'avec un composant actif alimenté.
  </div>

  <h3>Réalisation avec un ALI</h3>
  <p>On relie la borne d'entrée du dipôle à l'entrée \(+\) de l'ALI, et cette entrée à la sortie par une résistance \(R_0\) ; un diviseur \(R_b\) (sortie \(\to\) entrée \(-\)) et \(R_a\) (entrée \(-\) \(\to\) masse) complète le montage. Notons \(u\) la tension d'entrée et \(i_e\) le courant entrant. En régime linéaire, \(V^+ = V^- = u\), donc \(s = \left(1 + \dfrac{R_b}{R_a}\right)u\), et tout le courant \(i_e\) traverse \(R_0\) (\(i^+ = 0\)) :</p>
  <div class="formula">$$i_e = \frac{u - s}{R_0} = -\frac{R_b}{R_a R_0}\,u$$</div>
  <p>soit :</p>
  <div class="formula">$$u = -R_N\,i_e, \qquad R_N = \frac{R_0\,R_a}{R_b}$$</div>
  <p>Ce comportement n'est valable que tant que \(|s| \lt V_{\text{sat}}\), c'est-à-dire \(|u| \lt U_m = \dfrac{R_a}{R_a+R_b}\,V_{\text{sat}}\). Au-delà, l'ALI sature : \(i_e = (u \mp V_{\text{sat}})/R_0\), le dipôle redevient une résistance <strong>positive</strong> \(R_0\) en série avec une source : c'est la non-linéarité qui bornera l'amplitude.</p>

  <div class="notice">Ce montage comporte une rétroaction sur chacune des deux entrées : son fonctionnement linéaire n'est stable que si la charge branchée présente, en continu, une résistance <strong>inférieure</strong> à \(R_N\) (la contre-réaction l'emporte alors sur la réaction positive). C'est le cas d'une bobine, qui court-circuite presque le dipôle en continu.</div>

  <h3>Association avec un circuit LC parallèle</h3>
  <p>Branchons le dipôle en parallèle sur \(C\), \(L\) et une résistance \(R\) qui modélise les pertes. La loi des nœuds pour la tension commune \(u\), dérivée une fois, donne :</p>
  <div class="formula">$$C\,\frac{\mathrm{d}^2 u}{\mathrm{d}t^2} + \left(\frac{1}{R} - \frac{1}{R_N}\right)\frac{\mathrm{d}u}{\mathrm{d}t} + \frac{u}{L} = 0$$</div>
  <div class="prop-box">
    <strong>Conditions.</strong> Oscillation : \(R_N = R\) (la conductance négative compense exactement les pertes). Amorçage : \(R_N\) <strong>légèrement inférieure</strong> à \(R\). Pulsation : \(\omega_0 = \dfrac{1}{\sqrt{LC}}\).
  </div>
  <p><strong>Montage série.</strong> Si le dipôle est placé en série avec \(L\), \(C\) et une résistance de pertes \(r\), la loi des mailles donne \(L\,\ddot{i} + (r - R_N)\,\dot{i} + i/C = 0\) : il faut alors \(R_N\) légèrement <strong>supérieure</strong> à \(r\). En série on compare des résistances, en parallèle des conductances. (En continu, le condensateur présente au dipôle une impédance infinie : on utilise alors la version du montage où l'entrée est reliée à la borne \(-\) de l'ALI et le diviseur à la borne \(+\), de même caractéristique linéaire mais stable à vide.)</p>
  <p><strong>Usage.</strong> Les oscillateurs \(LC\) servent surtout aux hautes fréquences (de 100 kHz au GHz), où les ALI sont trop lents : la résistance négative est alors obtenue avec des transistors. Un quartz se modélise par un circuit \(RLC\) de facteur de qualité énorme, d'où sa stabilité.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · RELAXATION : COMPARATEURS À HYSTÉRÉSIS</div>
  <h2>Rappels sur les comparateurs à hystérésis</h2>
  <div class="intro">Un oscillateur de relaxation alterne entre deux états dont aucun n'est durable : la charge d'un condensateur évolue jusqu'à ce qu'un seuil provoque le basculement. Son cœur est un comparateur à hystérésis, c'est-à-dire un ALI à réaction positive fonctionnant en régime saturé.</div>

  <h3>ALI en régime saturé</h3>
  <p>Avec une réaction sur l'entrée \(+\) seule, l'ALI ne peut pas rester en régime linéaire : sa sortie vaut \(+V_{\text{sat}}\) si \(\varepsilon = V^+ - V^- \gt 0\) et \(-V_{\text{sat}}\) si \(\varepsilon \lt 0\) (\(V_{\text{sat}} \approx 13\) à \(14\ \text{V}\) sous \(\pm15\ \text{V}\)). Le basculement se produit quand \(\varepsilon\) change de signe.</p>

  <div style="overflow-x:auto;margin:.4rem 0">
    <table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <tr style="background:var(--paper-dark)">
        <th style="padding:.3rem;border:1px solid var(--grid)"></th>
        <th style="padding:.3rem;border:1px solid var(--grid)">Non inverseur</th>
        <th style="padding:.3rem;border:1px solid var(--grid)">Inverseur</th>
      </tr>
      <tr>
        <td style="padding:.3rem;border:1px solid var(--grid)">Câblage</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(e\) appliquée à \(V^+\) via \(R_1\) ; \(R_2\) de \(V^+\) à la sortie ; \(V^-\) à la masse</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(e\) appliquée à \(V^-\) ; \(V^+\) au point milieu du pont \(R_1\) (masse)–\(R_2\) (sortie)</td>
      </tr>
      <tr>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(V^+\)</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(\dfrac{R_2\,e + R_1\,s}{R_1+R_2}\) (Millman)</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(\alpha\,s\), avec \(\alpha = \dfrac{R_1}{R_1+R_2}\)</td>
      </tr>
      <tr>
        <td style="padding:.3rem;border:1px solid var(--grid)">Seuils</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(\pm V_1 = \pm\dfrac{R_1}{R_2}\,V_{\text{sat}}\)</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(\pm V_0 = \pm\alpha\,V_{\text{sat}}\)</td>
      </tr>
      <tr>
        <td style="padding:.3rem;border:1px solid var(--grid)">Basculements</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(s\) passe à \(-V_{\text{sat}}\) quand \(e\) descend sous \(-V_1\), à \(+V_{\text{sat}}\) quand \(e\) dépasse \(+V_1\)</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">\(s\) passe à \(-V_{\text{sat}}\) quand \(e\) dépasse \(+V_0\), à \(+V_{\text{sat}}\) quand \(e\) descend sous \(-V_0\)</td>
      </tr>
      <tr>
        <td style="padding:.3rem;border:1px solid var(--grid)">Cycle \(s(e)\)</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">parcouru dans le sens trigonométrique</td>
        <td style="padding:.3rem;border:1px solid var(--grid)">parcouru dans le sens horaire</td>
      </tr>
    </table>
  </div>
  <div class="prop-box">
    <strong>Bistabilité.</strong> Pour une entrée comprise entre les deux seuils, les deux états de sortie sont compatibles avec les équations : celui qui est réalisé dépend de l'histoire de l'entrée (hystérésis). Le basculement n'a lieu que lorsque \(e\) atteint le seuil situé du côté opposé à l'état actuel. Pour rendre le montage <strong>astable</strong>, on referme la boucle sur un circuit qui, dans chacun des deux états, ramène l'entrée vers le seuil de basculement.
  </div>
  <p>Pour le non-inverseur, des seuils inférieurs à \(V_{\text{sat}}\) exigent \(R_1 \lt R_2\) ; pour l'inverseur, on a toujours \(\alpha \lt 1\).</p>
</div>

<div class="course-section">
  <div class="sec-num">§8 · MULTIVIBRATEUR ASTABLE</div>
  <h2>Comparateur à hystérésis et intégrateur</h2>
  <div class="intro">Bouclons un comparateur à hystérésis non inverseur sur un intégrateur inverseur. Chaque état saturé du comparateur pousse la sortie de l'intégrateur vers le seuil qui le fera basculer : aucun état n'est stable, le montage oscille et délivre à la fois un créneau et un triangle.</div>

  <h3>Fonctionnement par phases</h3>
  <p>L'intégrateur (ALI linéaire, \(R\) en entrée, \(C\) en réaction) délivre \(e(t) = e(t_k) - \dfrac{1}{RC}\displaystyle\int_{t_k}^{t} s(t')\,\mathrm{d}t'\) ; il attaque l'entrée du comparateur, de seuils \(\pm V_1\).</p>
  <ol>
    <li><strong>Phase 1</strong>, \(s = +V_{\text{sat}}\) : \(e\) décroît linéairement (pente \(-V_{\text{sat}}/RC\)) de \(+V_1\) à \(-V_1\), où le comparateur bascule.</li>
    <li><strong>Phase 2</strong>, \(s = -V_{\text{sat}}\) : \(e\) croît (pente \(+V_{\text{sat}}/RC\)) de \(-V_1\) à \(+V_1\), nouveau basculement, et ainsi de suite.</li>
  </ol>
  <p>Aux instants de basculement, \(s\) est discontinue (saut de \(2V_{\text{sat}}\)), mais \(e\), tension aux bornes du condensateur de l'intégrateur, reste <strong>continue</strong> : c'est elle qui raccorde les phases.</p>

</figure>

  <h3>Période</h3>
  <p>Pendant une demi-période, \(e\) varie de \(2V_1\) à la vitesse \(V_{\text{sat}}/RC\) :</p>
  <div class="formula">$$\frac{T}{2} = \frac{2V_1\,RC}{V_{\text{sat}}}$$</div>
  <p>d'où, avec \(V_1 = \dfrac{R_1}{R_2}V_{\text{sat}}\) :</p>
  <div class="formula">$$T = 4RC\,\frac{V_1}{V_{\text{sat}}} = 4RC\,\frac{R_1}{R_2}$$</div>
  <div class="prop-box">
    <strong>À retenir.</strong> La période ne dépend pas de \(V_{\text{sat}}\) (seuils et pentes lui sont tous deux proportionnels) : elle est fixée par \(RC\) et le rapport \(R_1/R_2\). Le créneau a pour amplitude \(V_{\text{sat}}\), le triangle \(V_1 = \dfrac{R_1}{R_2}V_{\text{sat}}\). On règle la fréquence par \(R\) ou \(C\) sans toucher à l'amplitude du triangle ; modifier \(R_1/R_2\) change à la fois l'amplitude et la fréquence.
  </div>

  <h3>Modifier le signal produit</h3>
  <p>Le même principe se décline selon ce que l'on veut obtenir.</p>
  <ul>
    <li><strong>Un triangle décalé.</strong> Si l'entrée \(-\) du comparateur est portée à une tension continue \(U_0\) au lieu de la masse, les seuils deviennent \(\left(1 + \frac{R_1}{R_2}\right)U_0 \pm \frac{R_1}{R_2}V_{\text{sat}}\) : le triangle garde son amplitude et sa période mais se centre sur \(\left(1 + \frac{R_1}{R_2}\right)U_0\).</li>
    <li><strong>Une dent de scie.</strong> Une résistance d'intégration différente selon le signe de \(s\) (deux branches résistives aiguillées par des diodes) rend la montée et la descente inégales : le rapport cyclique devient réglable.</li>
    <li><strong>Un seul ALI.</strong> Le circuit \(RC\) remplace l'intégrateur (ci-dessous), au prix d'arcs d'exponentielle.</li>
    <li><strong>En électronique numérique.</strong> Une porte logique à seuil (trigger de Schmitt) ou un temporisateur intégré de type 555 joue le rôle du comparateur à hystérésis ; le principe des basculements est identique.</li>
  </ul>

  <h3>Astable à un seul ALI : comparateur inverseur et circuit RC</h3>
  <p>On remplace l'intégrateur par une résistance \(R\) (de la sortie vers l'entrée \(-\)) et un condensateur \(C\) (de l'entrée \(-\) vers la masse) ; le pont \(R_1\)–\(R_2\) fixe les seuils \(\pm\alpha V_{\text{sat}}\). La tension \(u_C\) évolue en exponentielle vers \(s = \pm V_{\text{sat}}\). Pendant une phase où \(s = +V_{\text{sat}}\), partant de \(-\alpha V_{\text{sat}}\) :</p>
  <div class="formula">$$u_C(t) = V_{\text{sat}} - (1+\alpha)\,V_{\text{sat}}\;e^{-t/RC}$$</div>
  <p>Le seuil \(+\alpha V_{\text{sat}}\) est atteint au bout de \(\Delta t = RC\ln\dfrac{1+\alpha}{1-\alpha}\). Par symétrie :</p>
  <div class="formula">$$T = 2RC\,\ln\frac{1+\alpha}{1-\alpha}$$</div>
  <p>soit, en fonction des résistances du pont :</p>
  <div class="formula">$$T = 2RC\,\ln\left(1 + \frac{2R_1}{R_2}\right)$$</div>
  <p>Le circuit \(RC\) est un <strong>pseudo-intégrateur</strong> : il ne se comporte en intégrateur que tant que \(u_C\) reste petite devant \(V_{\text{sat}}\). Le signal \(u_C\) est formé d'arcs d'exponentielle et non de segments.</p>
</div>

<div class="course-section">
  <div class="sec-num">§9 · COMPARAISON SPECTRALE</div>
  <h2>Signal quasi sinusoïdal ou riche en harmoniques</h2>
  <div class="intro">Les deux familles d'oscillateurs donnent des spectres très différents : le choix dépend de l'usage (référence de fréquence pure, horloge, base de temps, générateur de fonctions).</div>

  <h3>Oscillateur quasi sinusoïdal</h3>
  <p>Son spectre présente une raie dominante à \(f_0\) et des harmoniques \(2f_0, 3f_0, \dots\) faibles, d'autant plus faibles que \(a_1\) est proche de 0 et que le filtre est sélectif. On mesure la pureté par le taux de distorsion harmonique \(\text{THD} = \sqrt{\sum_{n\geq2} c_n^2}\,/\,c_1\) : pour un pont de Wien limité par la saturation, une simulation (méthode 7) donne environ 1,4 % sur \(s\) pour \(A = 3{,}02\), 9 % pour \(A = 3{,}2\) et 24 % pour \(A = 4\) ; une stabilisation d'amplitude progressive (thermistance, résistance commandée) permet de descendre bien en dessous de 1 %.</p>

  <h3>Oscillateur de relaxation</h3>
  <p>Un créneau d'amplitude \(V_{\text{sat}}\) et un triangle d'amplitude \(V_1\), symétriques, ne contiennent que des harmoniques de rang \(n\) impair, d'amplitudes :</p>
  <div class="formula">$$\text{créneau : } c_n = \frac{4V_{\text{sat}}}{n\pi}$$</div>
  <div class="formula">$$\text{triangle : } c_n = \frac{8V_1}{n^2\pi^2}$$</div>
  <p>Le créneau est très riche en harmoniques (décroissance en \(1/n\), soit \(-20\ \text{dB}\) par décade) ; le triangle beaucoup moins (\(1/n^2\), soit \(-40\ \text{dB}\) par décade) : son harmonique 3 ne vaut que \(1/9\) du fondamental.</p>

<template class="pan-tpl" data-panneau="ose-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · OSCILLATEURS ÉLECTRONIQUES</div>
  <h2>Stratégies pour les exercices</h2>

  <div class="method-box">
    <strong>Méthode 1 — Établir et exploiter l'équation différentielle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Vérifier le régime.</span> Tant que \(|s| \lt V_{\text{sat}}\), l'ALI idéal vérifie \(V^+ = V^-\) et \(i^+ = i^- = 0\) : c'est précisément la phase d'amorçage que l'on étudie.</li>
      <li><span class="step">Écrire les relations en complexe.</span> Diviseurs de tension, théorème de Millman et impédances donnent vite les liens entre tensions ; on traduit ensuite chaque facteur \(\mathrm{j}\omega\) par une dérivation \(\mathrm{d}/\mathrm{d}t\).</li>
      <li><span class="step">Ne garder qu'une inconnue.</span> Éliminer les tensions intermédiaires. S'il subsiste une primitive (courant d'une bobine exprimé à partir de sa tension), dériver toute l'équation une fois.</li>
      <li><span class="step">Contrôler.</span> Diviser par le coefficient de la dérivée seconde, vérifier l'homogénéité de chaque terme et le signe du terme constant (\(a_0/a_2 \gt 0\), sinon divergence sans oscillation).</li>
      <li><span class="step">Lire.</span> Le terme constant donne \(\omega_0^2\) ; le coefficient de la dérivée première, nul à la limite, doit être négatif pour l'amorçage ; le taux de croissance vaut \(\sigma = -a_1/(2a_2)\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Fréquence et gain critique par la condition de Barkhausen</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Choisir le point de coupure.</span> Suivre le signal depuis la sortie de l'ALI jusqu'à son retour sur une entrée, et couper la boucle sur une entrée qui ne consomme aucun courant (presque toujours l'entrée \(+\)) : le filtre se calcule alors sans charge.</li>
      <li><span class="step">Deux calculs indépendants.</span> Le gain de l'étage actif \(\underline{A} = \underline{s}/\underline{e}\) (avec \(V^+ = V^-\)), puis la transmittance du réseau passif \(\underline{\beta} = \underline{e}/\underline{s}\), souvent un simple diviseur.</li>
      <li><span class="step">Comparer \(\underline{A}\) à \(1/\underline{\beta}\).</span> \(\underline{\beta}\) se présente souvent sous la forme \(1/(\dots)\) : avec \(A\) réel, la partie imaginaire de \(1/\underline{\beta}\) doit s'annuler, ce qui donne \(\omega_0\) ; sa partie réelle en \(\omega_0\) est le gain critique \(A_c\).</li>
      <li><span class="step">Vérifier la vraisemblance.</span> \(\omega_0\) doit être unique et strictement positive ; \(A_c\) doit être réalisable par l'étage choisi (\(A_c \geq 1\) pour un non-inverseur, \(A_c \lt 0\) pour un inverseur). On règle ensuite \(|A|\) un peu au-dessus de \(|A_c|\).</li>
    </ol>
    <p style="margin:.4rem 0 0">Si l'étage actif consomme du courant à son entrée (inverseur, par exemple), couper à cet endroit fausserait \(\underline{\beta}\) : intercaler un suiveur, inclure sa résistance d'entrée dans le filtre, ou revenir à l'équation différentielle.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Trancher le sens de l'inégalité d'amorçage à partir de \(\beta(p)\)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Écrire \(\beta(p) = N(p)/D(p)\) en remplaçant \(\mathrm{j}\omega\) par \(p\) (ou \(\mathrm{d}/\mathrm{d}t\)).</li>
      <li><span class="step">Étape 2.</span> La boucle impose \(D(p)\,e = N(p)\,s\) et \(s = A\,e\), donc \(\big[D(p) - A\,N(p)\big]\,e = 0\) : l'équation différentielle se lit directement, sans repasser par les lois de Kirchhoff.</li>
      <li><span class="step">Étape 3.</span> Discuter le signe du coefficient de \(\dot e\). La condition de Barkhausen ne fournit que l'égalité limite ; ce coefficient indique de quel côté de la limite se placer.</li>
    </ol>
    <p style="margin:.4rem 0 0">Exemple (pont de Wien, \(\tau = RC\)) : \(D - AN = \tau^2p^2 + (3 - A)\,\tau p + 1\), d'où l'amorçage pour \(A \gt 3\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Étudier un oscillateur à résistance négative</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Caractériser le dipôle actif.</span> En régime linéaire, exprimer \(u\) en fonction de \(i_e\) : \(u = -R_N\,i_e\). Donner le domaine de validité \(|u| \lt U_m\) tiré de \(|s| \lt V_{\text{sat}}\).</li>
      <li><span class="step">Écrire l'équation du circuit complet.</span> Loi des nœuds si le dipôle est en parallèle sur le circuit \(LC\), loi des mailles s'il est en série.</li>
      <li><span class="step">Comparer les termes d'amortissement.</span> En parallèle : \(\frac{1}{R} - \frac{1}{R_N}\) (conductances) ; en série : \(r - R_N\) (résistances).</li>
      <li><span class="step">Conclure.</span> \(R_N\) critique, sens de l'inégalité d'amorçage, \(\omega_0\). Vérifier que le terme constant reste positif, sinon le montage diverge sans osciller.</li>
      <li><span class="step">Amplitude.</span> Elle est un peu supérieure à \(U_m\) : au-delà de ce seuil, la caractéristique reprend une pente positive, la puissance fournie croît moins vite que les pertes, et l'équilibre s'établit quand les deux se compensent sur une période.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Obtenir la période d'un astable</strong>
    <p style="margin:.4rem 0 .2rem">Cinq questions à se poser, dans l'ordre :</p>
    <ol style="margin-top:.2rem">
      <li><span class="step">Quel ALI bascule ?</span> Celui dont la sortie ne revient que sur l'entrée \(+\) : sa sortie ne prend que les valeurs \(\pm V_{\text{sat}}\). Ceux qui sont rebouclés sur l'entrée \(-\) (par \(R\) ou \(C\)) restent linéaires.</li>
      <li><span class="step">Où sont les seuils ?</span> Exprimer \(\varepsilon = V^+ - V^-\) et chercher, pour chacune des deux valeurs de sortie, la tension d'entrée qui annule \(\varepsilon\). Dessiner le cycle et son sens de parcours.</li>
      <li><span class="step">Que fait le reste du montage pendant un palier ?</span> À sortie constante, c'est un circuit linéaire alimenté par une tension constante : rampe pour un intégrateur, exponentielle pour un circuit \(RC\). Sa valeur de départ est le seuil qui vient d'être franchi, puisque la tension du condensateur est continue.</li>
      <li><span class="step">Quand le palier s'arrête-t-il ?</span> Quand l'entrée du comparateur atteint l'autre seuil : on en déduit la durée du palier.</li>
      <li><span class="step">Le résultat est-il cohérent ?</span> \(T\) est la somme des deux paliers ; elle ne dépend pas de \(V_{\text{sat}}\) si les saturations sont symétriques. Tracer \(s\) et \(e\) l'un sous l'autre, basculements alignés.</li>
    </ol>
    <p style="margin:.4rem 0 0">Si l'on part d'un condensateur déchargé, le premier palier est plus court que les suivants : la période se calcule en régime établi, d'un seuil à l'autre.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Calculer une durée de charge exponentielle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Solution du premier ordre.</span> \(u(t) = u_\infty + (u_i - u_\infty)\,e^{-t/\tau}\), où \(u_\infty\) est la valeur vers laquelle tend la tension (ici \(\pm V_{\text{sat}}\), pas le seuil).</li>
      <li><span class="step">Durée de \(u_i\) à \(u_f\).</span>
        $$\Delta t = \tau\,\ln\frac{u_\infty - u_i}{u_\infty - u_f}$$</li>
      <li><span class="step">Contrôle.</span> Le logarithme doit porter sur un nombre supérieur à 1 (\(u_f\) compris entre \(u_i\) et \(u_\infty\)). Sinon le seuil n'est jamais atteint et il n'y a pas d'oscillation.</li>
    </ol>
    <p style="margin:.4rem 0 0">Astable \(RC\) : \(u_\infty = V_{\text{sat}}\), \(u_i = -\alpha V_{\text{sat}}\), \(u_f = \alpha V_{\text{sat}}\) donnent \(\Delta t = RC\ln\frac{1+\alpha}{1-\alpha}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Simuler le démarrage d'un oscillateur en Python</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Variables d'état.</span> Prendre les tensions des condensateurs (continues) et écrire un système d'équations du premier ordre.</li>
      <li><span class="step">Non-linéarité.</span> Modéliser l'ALI saturable par \(s = \mathrm{clip}(A\,e, -V_{\text{sat}}, V_{\text{sat}})\) : la simulation montre l'amorçage <strong>et</strong> la limitation d'amplitude, ce que l'équation linéaire ne peut pas faire.</li>
      <li><span class="step">Intégrer.</span> <span class="code-inline">solve_ivp</span> avec un pas maximal petit devant \(RC\) ; partir d'un « bruit » initial de l'ordre du µV.</li>
    </ol>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">from</span> scipy.integrate <span class="kw">import</span> solve_ivp
<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt

R, C = 10e3, 10e-9            <span class="cmt"># filtre de Wien : f0 = 1/(2πRC) ≈ 1,6 kHz</span>
A, Vsat = 3.2, 13.0           <span class="cmt"># gain un peu supérieur à 3, saturation de l'ALI</span>

<span class="kw">def</span> sortie(e):               <span class="cmt"># amplificateur non inverseur saturable</span>
    <span class="kw">return</span> np.clip(A*e, -Vsat, Vsat)

<span class="kw">def</span> f(t, y):
    v1, e = y                 <span class="cmt"># v1 : tension du C série ; e : tension du bloc R//C</span>
    i = (sortie(e) - v1 - e) / R          <span class="cmt"># courant de la branche série</span>
    <span class="kw">return</span> [i/C, (i - e/R)/C]

sol = solve_ivp(f, (0, 0.03), [0.0, 1e-6], max_step=R*C/40)
plt.plot(sol.t*1e3, sortie(sol.y[1]))
plt.xlabel(<span class="str">"t (ms)"</span>); plt.ylabel(<span class="str">"s (V)"</span>); plt.show()</pre>
    <p style="margin:.4rem 0 0">Résultat : rien de visible pendant une dizaine de millisecondes, puis une croissance rapide et une saturation vers \(t \approx 15\ \text{ms}\), en accord avec \(t_{\text{ét}} \approx \frac{1}{\sigma}\ln\frac{V_{\text{sat}}}{S_b}\) et \(\sigma = \frac{(A-3)}{2RC} = 1000\ \text{s}^{-1}\). Essayer \(A = 3{,}02\) puis \(A = 4\) pour voir l'effet du gain sur la durée d'établissement et sur la déformation.</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Condition d'oscillation (égalité, limite) et condition d'amorçage (inégalité, « légèrement ») ne sont pas la même chose.</li>
      <li>Pont de Wien : la condition est \(A = 3\), soit \(R_2 = 2R_1\) ; ce n'est ni \(A = 1\) ni \(A = 1/3\).</li>
      <li>Ni la condition de Barkhausen ni l'équation linéaire ne donnent l'amplitude : elle vient de la non-linéarité.</li>
      <li>Ne pas confondre les seuils du comparateur non inverseur (\(\pm\frac{R_1}{R_2}V_{\text{sat}}\)) et de l'inverseur (\(\pm\frac{R_1}{R_1+R_2}V_{\text{sat}}\)).</li>
      <li>Au basculement, c'est la tension du condensateur qui est continue, pas la sortie du comparateur.</li>
      <li>Dans l'astable \(RC\), l'exponentielle tend vers \(\pm V_{\text{sat}}\), pas vers le seuil.</li>
      <li>\(T = 4RC\,R_1/R_2\) ne dépend pas de \(V_{\text{sat}}\) seulement si les saturations sont symétriques.</li>
      <li>Contrôler l'ordre de grandeur : avec \(R\) de 1 à 100 kΩ et \(C\) de 1 à 100 nF, \(RC\) va de 1 µs à 10 ms, soit des fréquences d'une quinzaine de hertz à plus de 100 kHz.</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Lire l'équation différentielle d'un oscillateur</h3>
  <div class="statement">Quatre montages électroniques, étudiés en régime linéaire, conduisent pour une tension \(s(t)\) aux équations suivantes (unités SI) :
    $$\text{(a)}\ \ \ddot s + 1{,}5\times10^{3}\,\dot s + 9{,}0\times10^{8}\,s = 0$$
    $$\text{(b)}\ \ \ddot s + 9{,}0\times10^{8}\,s = 0$$
    $$\text{(c)}\ \ \ddot s - 6{,}0\times10^{2}\,\dot s + 9{,}0\times10^{8}\,s = 0$$
    $$\text{(d)}\ \ \ddot s - 6{,}0\times10^{2}\,\dot s - 9{,}0\times10^{8}\,s = 0$$
  </div>
  <div class="q"><strong>Q1.</strong> Pour chacun, décrire l'évolution de \(s\) à partir d'une petite perturbation. Lesquels sont des oscillateurs ?</div>
  <div class="q"><strong>Q2.</strong> Pour (c), calculer la fréquence d'oscillation, le taux de croissance \(\sigma\) et le nombre de périodes nécessaires pour que l'amplitude soit multipliée par 10.</div>
  <div class="q"><strong>Q3.</strong> Le bruit initial vaut \(5\ \text{µV}\) et \(V_{\text{sat}} = 13\ \text{V}\). Estimer la durée d'établissement des oscillations de (c).</div>
  <div class="q"><strong>Q4.</strong> Le montage (c) est un oscillateur à pont de Wien, d'équation \(\ddot s + (3 - A)\,\omega_0\,\dot s + \omega_0^2\,s = 0\). En déduire \(A\), puis \(R_2\) si \(R_1 = 10\ \text{k}\Omega\). Commenter la précision nécessaire.</div>
  <div class="q"><strong>Q5.</strong> Pourquoi le montage (b) est-il irréalisable ? Que devient (c) lorsque la sortie atteint \(\pm V_{\text{sat}}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) Coefficients tous positifs : stable. \(\omega_0 = 3{,}0\times10^4\ \text{rad/s}\), \(\sigma = -750\ \text{s}^{-1}\) : pseudo-oscillations amorties (constante de temps \(1{,}3\ \text{ms}\)), pas d'oscillation entretenue.<br>
    (b) \(a_1 = 0\) : sinusoïde de pulsation \(3{,}0\times10^4\ \text{rad/s}\), d'amplitude fixée par les conditions initiales (oscillateur harmonique idéal).<br>
    (c) \(a_1 \lt 0\), \(a_0 \gt 0\) : racines \(\sigma \pm \mathrm{j}\Omega\) avec \(\sigma = 300\ \text{s}^{-1} \ll \omega_0\) : oscillation d'amplitude croissante, c'est un oscillateur en phase d'amorçage.<br>
    (d) \(a_0 \lt 0\) : racines réelles de signes opposés, l'une vaut environ \(+3{,}0\times10^4\ \text{s}^{-1}\). Divergence exponentielle <strong>sans</strong> oscillation : la sortie part en saturation et y reste. Ce n'est pas un oscillateur.<br>
    Seul (c) est un oscillateur réaliste ; (b) est le cas limite idéal.</p>
    <p><strong>Q2.</strong> \(f_0 = \dfrac{3{,}0\times10^4}{2\pi} \approx 4{,}8\ \text{kHz}\) (\(\Omega\) diffère de \(\omega_0\) de \(5\times10^{-5}\) en valeur relative). \(\sigma = \dfrac{600}{2} = 300\ \text{s}^{-1}\). Amplitude multipliée par 10 au bout de \(t = \dfrac{\ln 10}{\sigma} = 7{,}7\ \text{ms}\), soit \(7{,}7\times10^{-3}\times4{,}8\times10^{3} \approx 37\) périodes.</p>
    <p><strong>Q3.</strong> \(t_{\text{ét}} \approx \dfrac{1}{\sigma}\ln\dfrac{V_{\text{sat}}}{S_b}\) \(= \dfrac{\ln(2{,}6\times10^{6})}{300}\) \(\approx 49\ \text{ms}\), environ 235 périodes.</p>
    <p><strong>Q4.</strong> \((3 - A)\,\omega_0 = -600\) donne \(A = 3 + \dfrac{600}{3{,}0\times10^4} = 3{,}02\). Avec \(A = 1 + R_2/R_1\) : \(R_2 = 2{,}02\,R_1 = 20{,}2\ \text{k}\Omega\). Un écart de 1 % sur une résistance suffit à changer le signe de \(a_1\) : d'où l'emploi d'un potentiomètre de réglage plutôt que de valeurs fixes.</p>
    <p><strong>Q5.</strong> (b) exige \(a_1 = 0\) exactement : les tolérances et les dérives thermiques des composants rendent cette égalité impossible à tenir ; les oscillations finiraient par s'éteindre ou croître. Pour (c), dès que \(|s|\) atteint \(V_{\text{sat}}\), l'équation linéaire ne s'applique plus : l'amplitude se stabilise au voisinage de \(V_{\text{sat}}\) et le signal, légèrement écrêté, devient périodique (cycle limite).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Filtre de Wien à composants inégaux</h3>
  <div class="statement">Dans un oscillateur de type Wien, la branche série comporte \(R_s\) et \(C_s\), la branche parallèle (reliée à la masse) \(R_p\) et \(C_p\), sans supposer \(R_s = R_p\) ni \(C_s = C_p\). L'amplificateur non inverseur, idéal et linéaire, a pour gain \(A = 1 + R_2/R_1\). On note \(a = R_s/R_p\) et \(b = C_p/C_s\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\dfrac{1}{\underline{\beta}} = 1 + a + b + \mathrm{j}\left(R_sC_p\,\omega - \dfrac{1}{R_pC_s\,\omega}\right)\).</div>
  <div class="q"><strong>Q2.</strong> Écrire la condition de Barkhausen. En déduire la pulsation d'oscillation \(\omega_0\) et le gain critique \(A_c\).</div>
  <div class="q"><strong>Q3.</strong> Retrouver les résultats du pont de Wien usuel.</div>
  <div class="q"><strong>Q4.</strong> Mettre \(\underline{\beta}\) sous la forme \(\dfrac{\beta_0}{1 + \mathrm{j}Q\left(\frac{\omega}{\omega_0} - \frac{\omega_0}{\omega}\right)}\) et montrer que \(Q = \dfrac{\sqrt{ab}}{1+a+b}\). Établir que \(Q \lt 1/2\) quels que soient les composants. Conséquence ?</div>
  <div class="q"><strong>Q5.</strong> Application : \(C_s = C_p = 22\ \text{nF}\), \(R_s = 3{,}3\ \text{k}\Omega\), \(R_p = 6{,}8\ \text{k}\Omega\), \(R_1 = 10\ \text{k}\Omega\). Calculer \(f_0\), \(A_c\), \(Q\) et la valeur minimale de \(R_2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Diviseur de tension (\(i^+ = 0\)) : \(\underline{\beta} = \dfrac{\underline{Z}_p}{\underline{Z}_p + \underline{Z}_s} = \dfrac{1}{1 + \underline{Z}_s\underline{Y}_p}\). Or
    $$\underline{Z}_s\underline{Y}_p = \left(R_s + \frac{1}{\mathrm{j}C_s\omega}\right)\left(\frac{1}{R_p} + \mathrm{j}C_p\omega\right)$$
    $$\underline{Z}_s\underline{Y}_p = \frac{R_s}{R_p} + \frac{C_p}{C_s} + \mathrm{j}\left(R_sC_p\omega - \frac{1}{R_pC_s\omega}\right)$$
    d'où le résultat.</p>
    <p><strong>Q2.</strong> \(A\) réel et \(A = 1/\underline{\beta}\). Partie imaginaire nulle : \(R_sC_p\,\omega_0 = \dfrac{1}{R_pC_s\,\omega_0}\), soit
    $$\omega_0 = \frac{1}{\sqrt{R_sR_pC_sC_p}}$$
    puis, partie réelle :
    $$A_c = 1 + a + b = 1 + \frac{R_s}{R_p} + \frac{C_p}{C_s}$$
    L'amorçage exige \(A\) légèrement supérieur à \(A_c\).</p>
    <p><strong>Q3.</strong> \(R_s = R_p = R\) et \(C_s = C_p = C\) : \(a = b = 1\), \(\omega_0 = 1/(RC)\) et \(A_c = 3\).</p>
    <p><strong>Q4.</strong> \(R_sC_p\,\omega_0 = \sqrt{\dfrac{R_sC_p}{R_pC_s}} = \sqrt{ab}\) et \(\dfrac{1}{R_pC_s\,\omega_0} = \sqrt{ab}\) également. Donc
    $$\frac{1}{\underline{\beta}} = (1+a+b)\left[1 + \mathrm{j}\,\frac{\sqrt{ab}}{1+a+b}\left(\frac{\omega}{\omega_0} - \frac{\omega_0}{\omega}\right)\right]$$
    soit \(\beta_0 = \dfrac{1}{1+a+b}\) et \(Q = \dfrac{\sqrt{ab}}{1+a+b}\). Comme \(a + b \geq 2\sqrt{ab}\), \(Q \leq \dfrac{\sqrt{ab}}{1 + 2\sqrt{ab}} \lt \dfrac12\). Ce filtre est toujours peu sélectif (bande passante \(\omega_0/Q \gt 2\omega_0\)) : il atténue mal les harmoniques créés par la saturation. La pureté du signal repose donc sur un gain réglé au plus près de \(A_c\).</p>
    <p><strong>Q5.</strong> \(\sqrt{R_sR_p} = \sqrt{3{,}3\times6{,}8}\ \text{k}\Omega \approx 4{,}74\ \text{k}\Omega\), d'où \(\omega_0 = \dfrac{1}{22\times10^{-9}\times4{,}74\times10^{3}}\) \(\approx 9{,}6\times10^{3}\ \text{rad/s}\) et \(f_0 \approx 1{,}53\ \text{kHz}\). \(a = 0{,}485\), \(b = 1\) : \(A_c \approx 2{,}49\), donc \(R_2 \gt 1{,}49\,R_1 \approx 14{,}9\ \text{k}\Omega\) (une résistance de \(15\ \text{k}\Omega\) ou un potentiomètre réglé juste au-dessus). \(Q = \dfrac{\sqrt{0{,}485}}{2{,}485} \approx 0{,}28\), un peu moins que \(1/3\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Résistance négative et circuit bouchon réel</h3>
  <div class="statement">Une bobine réelle (inductance \(L = 10\ \text{mH}\), résistance interne \(r = 20\ \Omega\)) est placée en parallèle avec un condensateur \(C = 100\ \text{nF}\). On branche en parallèle sur cet ensemble le dipôle à résistance négative du cours (ALI idéal, \(V_{\text{sat}} = 13\ \text{V}\), \(R_0 = R_b = 10\ \text{k}\Omega\), \(R_a\) réglable) : en régime linéaire, le courant qui y entre vaut \(i_e = -u/R_N\) avec \(R_N = R_0R_a/R_b\), \(u\) étant la tension commune.</div>
  <div class="q"><strong>Q1.</strong> Sans le dipôle actif, que devient une charge initiale du condensateur ? Calculer \(\omega_0 = 1/\sqrt{LC}\), \(f_0\) et le facteur de qualité de la bobine \(Q_L = L\omega_0/r\).</div>
  <div class="q"><strong>Q2.</strong> Avec le dipôle actif en régime linéaire, établir l'équation différentielle vérifiée par le courant \(i_L\) dans la bobine :
    $$LC\,\ddot{i}_L + \left(rC - \frac{L}{R_N}\right)\dot{i}_L + \left(1 - \frac{r}{R_N}\right)i_L = 0$$</div>
  <div class="q"><strong>Q3.</strong> En déduire l'encadrement de \(R_N\) qui permet le démarrage d'oscillations. Montrer que la valeur critique vaut \(R_{N,c} = \dfrac{L}{rC} = Q_L^2\,r\) et l'interpréter.</div>
  <div class="q"><strong>Q4.</strong> Calculer \(R_{N,c}\), proposer une valeur normalisée de \(R_a\) et calculer le taux de croissance \(\sigma\) correspondant.</div>
  <div class="q"><strong>Q5.</strong> Qu'est-ce qui limite l'amplitude ? En donner un ordre de grandeur. Pourquoi le signal est-il plus pur qu'avec un pont de Wien ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le circuit \(LC\) réel est le siège de pseudo-oscillations amorties par la résistance \(r\) : l'énergie initiale est dissipée par effet Joule. \(\omega_0 = \dfrac{1}{\sqrt{10^{-2}\times10^{-7}}} = 3{,}16\times10^{4}\ \text{rad/s}\), \(f_0 \approx 5{,}0\ \text{kHz}\), \(Q_L = \dfrac{10^{-2}\times3{,}16\times10^{4}}{20} \approx 16\).</p>
    <p><strong>Q2.</strong> Loi des nœuds pour la tension commune \(u\) (courants sortant du nœud) : \(C\dot u + i_L + i_e = 0\), soit \(C\dot u + i_L - \dfrac{u}{R_N} = 0\). Pour la bobine, \(u = r\,i_L + L\,\dot{i}_L\), donc \(\dot u = r\,\dot{i}_L + L\,\ddot{i}_L\). En substituant :
    $$C\left(r\dot{i}_L + L\ddot{i}_L\right) + i_L - \frac{r\,i_L + L\,\dot{i}_L}{R_N} = 0$$
    ce qui, regroupé, donne l'équation annoncée.</p>
    <p><strong>Q3.</strong> Amorçage d'oscillations : coefficient de \(\dot{i}_L\) négatif, \(R_N \lt \dfrac{L}{rC}\), et terme constant positif, \(R_N \gt r\) (sinon divergence sans oscillation). Donc \(r \lt R_N \lt \dfrac{L}{rC}\), avec \(R_N\) juste en dessous de la borne supérieure pour un signal quasi sinusoïdal. Comme \(LC\,\omega_0^2 = 1\) : \(\dfrac{L}{rC} = \dfrac{L^2\omega_0^2}{r} = \left(\dfrac{L\omega_0}{r}\right)^2 r = Q_L^2\,r\). Interprétation : au voisinage de \(\omega_0\), une bobine de résistance série \(r\) équivaut à une bobine idéale en parallèle avec une résistance \(Q_L^2\,r\) ; le dipôle doit compenser cette conductance de pertes.</p>
    <p><strong>Q4.</strong> \(R_{N,c} = \dfrac{10^{-2}}{20\times10^{-7}} = 5{,}0\ \text{k}\Omega\). Ici \(R_N = R_a\) (car \(R_0 = R_b\)) : on prend \(R_a = 4{,}7\ \text{k}\Omega\), qui vérifie bien \(r \lt R_N \lt R_{N,c}\). Taux de croissance :
    $$\sigma = \frac{L/R_N - rC}{2LC}$$
    $$\sigma = \frac{(2{,}13 - 2{,}00)\times10^{-6}}{2\times10^{-9}} \approx 64\ \text{s}^{-1}$$
    La pulsation, \(\sqrt{(1 - r/R_N)/(LC)}\), ne diffère de \(\omega_0\) que de 0,2 % : \(f \approx 5{,}0\ \text{kHz}\).</p>
    <p><strong>Q5.</strong> La saturation de l'ALI : la caractéristique \(u = -R_N i_e\) ne vaut que pour \(|u| \lt U_m = \dfrac{R_a}{R_a+R_b}V_{\text{sat}}\), soit \(U_m = \dfrac{4{,}7}{14{,}7}\times13 \approx 4{,}2\ \text{V}\). Au-delà, l'ALI sature : le dipôle équivaut à une source \(\pm V_{\text{sat}}\) en série avec \(R_0\), de pente positive, et la puissance qu'il fournit croît moins vite que les pertes quand l'amplitude augmente. L'amplitude se fixe quand les deux se compensent sur une période : un peu au-dessus de \(U_m\), de l'ordre de \(4\) à \(5\ \text{V}\) (une simulation donne \(4{,}6\ \text{V}\)). Le circuit bouchon (\(Q_L \approx 16\)) est bien plus sélectif que le filtre de Wien (\(Q = 1/3\)) : il filtre efficacement les harmoniques, d'où un signal très proche d'une sinusoïde.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Générateur de signaux carrés et triangulaires</h3>
  <div class="statement">Un multivibrateur astable associe un comparateur à hystérésis non inverseur (ALI 1, résistance \(R_1\) entre l'entrée \(e\) et \(V^+\), résistance \(R_2\) entre \(V^+\) et la sortie \(s\), \(V^-\) à la masse) et un intégrateur inverseur (ALI 2, résistance \(R\) en entrée, condensateur \(C\) en réaction), dont la sortie est \(e\). Les ALI sont idéaux, \(V_{\text{sat}} = 14\ \text{V}\).</div>
  <div class="q"><strong>Q1.</strong> Préciser le régime de fonctionnement de chaque ALI et établir les seuils du comparateur.</div>
  <div class="q"><strong>Q2.</strong> À \(t = 0\), \(s = +V_{\text{sat}}\) et \(e = +V_1\). Décrire les phases successives, tracer \(e(t)\) et \(s(t)\), et établir \(T = 4RC\,R_1/R_2\).</div>
  <div class="q"><strong>Q3.</strong> On veut un triangle d'amplitude \(5{,}0\ \text{V}\) à \(1{,}0\ \text{kHz}\), avec \(R_1 = 10\ \text{k}\Omega\) et \(C = 10\ \text{nF}\). Calculer \(R_2\) et \(R\).</div>
  <div class="q"><strong>Q4.</strong> Calculer l'amplitude du fondamental et de l'harmonique 3 pour \(s\) et pour \(e\). Lequel des deux signaux choisir pour obtenir un sinus par filtrage ?</div>
  <div class="q"><strong>Q5.</strong> La vitesse de balayage vaut \(0{,}5\ \text{V/µs}\) pour un 741 et \(13\ \text{V/µs}\) pour un TL081. Estimer la durée des fronts de \(s\) dans chaque cas. Si l'on exige des fronts plus courts que 1 % de la période, quelle fréquence maximale peut-on atteindre avec chaque composant ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> ALI 1 n'a de réaction que sur l'entrée \(+\) : il est saturé, \(s = \pm V_{\text{sat}}\). ALI 2 est rebouclé sur l'entrée \(-\) par \(C\) : régime linéaire, \(\dfrac{\mathrm{d}e}{\mathrm{d}t} = -\dfrac{s}{RC}\). Millman en \(V^+\) : \(V^+ = \dfrac{R_2\,e + R_1\,s}{R_1+R_2}\). Le basculement a lieu quand \(V^+\) s'annule, c'est-à-dire pour \(e = -\dfrac{R_1}{R_2}s\) : seuils \(\pm V_1 = \pm\dfrac{R_1}{R_2}V_{\text{sat}}\).</p>
    <p><strong>Q2.</strong> Phase 1 (\(s = +V_{\text{sat}}\)) : \(e\) décroît linéairement, pente \(-V_{\text{sat}}/RC\), de \(+V_1\) à \(-V_1\), en \(\Delta t = \dfrac{2V_1RC}{V_{\text{sat}}}\) ; \(s\) bascule à \(-V_{\text{sat}}\). Phase 2 symétrique : \(e\) remonte de \(-V_1\) à \(+V_1\) en \(\Delta t\). \(e\) est un triangle, \(s\) un créneau, et \(T = 2\Delta t = 4RC\dfrac{V_1}{V_{\text{sat}}} = 4RC\dfrac{R_1}{R_2}\).</p>
    <p><strong>Q3.</strong> \(\dfrac{R_1}{R_2} = \dfrac{V_1}{V_{\text{sat}}} = \dfrac{5{,}0}{14}\), donc \(R_2 = 28\ \text{k}\Omega\). Puis \(RC = \dfrac{T\,R_2}{4R_1} = \dfrac{10^{-3}\times2{,}8}{4} = 0{,}70\ \text{ms}\), d'où \(R = 70\ \text{k}\Omega\) (par exemple \(68\ \text{k}\Omega\) en série avec un potentiomètre de \(5\ \text{k}\Omega\) pour ajuster).</p>
    <p><strong>Q4.</strong> Créneau d'amplitude \(14\ \text{V}\) : \(c_1 = \dfrac{4\times14}{\pi} \approx 17{,}8\ \text{V}\), \(c_3 = c_1/3 \approx 5{,}9\ \text{V}\). Triangle d'amplitude \(5{,}0\ \text{V}\) : \(c_1 = \dfrac{8\times5{,}0}{\pi^2} \approx 4{,}05\ \text{V}\), \(c_3 = c_1/9 \approx 0{,}45\ \text{V}\). L'harmonique 3 vaut 33 % du fondamental pour le créneau, 11 % pour le triangle : on part du triangle, dont il reste moins à éliminer.</p>
    <p><strong>Q5.</strong> Le saut de \(s\) vaut \(2V_{\text{sat}} = 28\ \text{V}\). Avec un TL081 : \(28/13 \approx 2{,}2\ \text{µs}\), soit 0,2 % de la période à 1 kHz : négligeable. Avec un 741 : \(28/0{,}5 = 56\ \text{µs}\), soit 5,6 % : créneau nettement trapézoïdal. Fronts inférieurs à 1 % de \(T\) : \(T \geq 100\times56\ \text{µs} = 5{,}6\ \text{ms}\), soit \(f \lesssim 180\ \text{Hz}\) avec le 741 ; \(T \geq 100\times2{,}15\ \text{µs} \approx 215\ \text{µs}\), soit \(f \lesssim 4{,}6\ \text{kHz}\) avec le TL081.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Oscillateur à déphasage à trois cellules RC</h3>
  <div class="statement">Le filtre est formé de trois cellules identiques en cascade, chacune constituée d'une résistance \(R\) en série suivie d'un condensateur \(C\) relié à la masse. La sortie \(\underline{e}\) est prise aux bornes du dernier condensateur, à vide. L'amplificateur, idéal, a un gain réel \(A\) (impédance d'entrée infinie, impédance de sortie nulle) ; sa sortie \(\underline{s}\) attaque l'entrée du filtre et son entrée reçoit \(\underline{e}\). On pose \(x = RC\omega\).</div>
  <div class="q"><strong>Q1.</strong> Comment varie l'argument de \(\underline{\beta}\) entre les basses et les hautes fréquences ? En déduire le signe que doit avoir \(A\).</div>
  <div class="q"><strong>Q2.</strong> En « remontant » le filtre depuis sa sortie (courant dans le dernier condensateur, puis tension du nœud précédent, etc.), montrer que \(\dfrac{1}{\underline{\beta}} = 1 - 5x^2 + \mathrm{j}\,(6x - x^3)\).</div>
  <div class="q"><strong>Q3.</strong> Appliquer la condition de Barkhausen : pulsation d'oscillation et valeur de \(A\).</div>
  <div class="q"><strong>Q4.</strong> On vise \(f_0 = 1{,}0\ \text{kHz}\) avec \(C = 22\ \text{nF}\). Calculer \(R\). L'amplificateur est un inverseur à ALI (résistance d'entrée \(R_1 = 10\ \text{k}\Omega\), résistance de réaction \(R_2\)) : quel problème pose sa résistance d'entrée et comment le résoudre ? Valeur de \(R_2\) ?</div>
  <div class="q"><strong>Q5.</strong> Pourquoi deux cellules ne suffiraient-elles pas ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque cellule passe-bas déphase de \(0\) (BF) à \(-\pi/2\) (HF) : l'argument de \(\underline{\beta}\) décroît continûment de \(0\) à \(-3\pi/2\). Avec \(A \gt 0\), il faudrait \(\arg\underline{\beta} = 0\), atteint seulement en \(\omega = 0\) (pas d'oscillation). Il faut donc \(A \lt 0\) (argument \(\pi\)) et \(\arg\underline{\beta}(\mathrm{j}\omega_0) = -\pi\), atteint à une seule pulsation finie.</p>
    <p><strong>Q2.</strong> Notons \(v_3 = \underline{e}\), puis \(v_2\), \(v_1\) les tensions des nœuds précédents. Courant dans le dernier condensateur : \(\mathrm{j}C\omega\,v_3\) ; il traverse la dernière résistance : \(v_2 = v_3 + \mathrm{j}x\,v_3 = (1 + \mathrm{j}x)\,v_3\). Courant dans la résistance du milieu : \(\mathrm{j}C\omega(v_3 + v_2) = \mathrm{j}C\omega(2 + \mathrm{j}x)\,v_3\), d'où
    $$v_1 = v_2 + \mathrm{j}x(2 + \mathrm{j}x)\,v_3 = (1 + 3\mathrm{j}x - x^2)\,v_3$$
    Courant dans la première résistance (somme des courants des trois condensateurs) : \(\mathrm{j}C\omega(v_3 + v_2 + v_1)\) \(= \mathrm{j}C\omega(3 + 4\mathrm{j}x - x^2)\,v_3\), d'où
    $$\underline{s} = v_1 + \mathrm{j}x(3 + 4\mathrm{j}x - x^2)\,v_3$$
    $$\underline{s} = \left[1 - 5x^2 + \mathrm{j}(6x - x^3)\right]v_3$$</p>
    <p><strong>Q3.</strong> \(A = 1/\underline{\beta}\) réel : \(6x - x^3 = 0\), soit \(x^2 = 6\), d'où \(\omega_0 = \dfrac{\sqrt6}{RC}\). Alors \(A = 1 - 5\times6 = -29\). L'amorçage exige \(A \lt -29\) (gain inverseur de module légèrement supérieur à 29).</p>
    <p><strong>Q4.</strong> \(R = \dfrac{\sqrt6}{2\pi f_0C}\) \(= \dfrac{2{,}449}{2\pi\times10^{3}\times22\times10^{-9}}\) \(\approx 17{,}7\ \text{k}\Omega\) (une résistance de \(18\ \text{k}\Omega\) donne \(f_0 \approx 0{,}98\ \text{kHz}\)). L'entrée de l'inverseur, à la masse virtuelle à travers \(R_1\), chargerait le dernier condensateur par \(R_1 = 10\ \text{k}\Omega\), du même ordre que \(R\) : le calcul « à vide » serait faux. On intercale un suiveur entre le filtre et l'inverseur (ou l'on prend \(R_1 \gg R\)). Alors \(R_2 \geq 29\,R_1 = 290\ \text{k}\Omega\), réglée légèrement au-dessus.</p>
    <p><strong>Q5.</strong> Le même calcul avec deux cellules donne \(\dfrac{1}{\underline{\beta}} = 1 - x^2 + 3\mathrm{j}x\) : la partie imaginaire ne s'annule qu'en \(x = 0\). L'argument \(-\pi\) n'est atteint qu'en limite haute fréquence, où \(|\underline{\beta}| \to 0\) : il faudrait un gain infini. Trois cellules sont donc le minimum.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Astable à un seul ALI : capacimètre et saturations dissymétriques</h3>
  <div class="statement">Un ALI est câblé en comparateur inverseur : \(R_1\) relie \(V^+\) à la masse, \(R_2\) relie \(V^+\) à la sortie \(s\). Une résistance \(R\) relie la sortie à \(V^-\), et un condensateur \(C\) relie \(V^-\) à la masse ; on note \(u_C\) sa tension et \(\alpha = \dfrac{R_1}{R_1+R_2}\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que l'ALI fonctionne en régime saturé et établir les seuils de basculement en fonction de \(\alpha\) et \(V_{\text{sat}}\).</div>
  <div class="q"><strong>Q2.</strong> Pendant une phase où \(s = +V_{\text{sat}}\), \(u_C\) part de \(-\alpha V_{\text{sat}}\). Établir \(u_C(t)\), la durée de la phase et la période \(T = 2RC\ln\dfrac{1+\alpha}{1-\alpha}\).</div>
  <div class="q"><strong>Q3.</strong> Quel rapport \(R_2/R_1\) donne exactement \(T = 2RC\) ?</div>
  <div class="q"><strong>Q4.</strong> Avec ce réglage et \(R = 100\ \text{k}\Omega\) (incertitude-type relative 1 %), un fréquencemètre affiche \(f = 420\ \text{Hz}\) (incertitude-type 1 Hz) lorsqu'un condensateur inconnu est branché. En déduire \(C\) et son incertitude-type relative (on néglige l'incertitude sur le rapport \(R_2/R_1\)).</div>
  <div class="q"><strong>Q5.</strong> L'ALI réel sature en fait à \(+14\ \text{V}\) et \(-12\ \text{V}\). Avec le réglage de Q3, calculer les seuils, les durées des deux phases, la période et le rapport cyclique. Le capacimètre reste-t-il fiable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La sortie est ramenée sur l'entrée \(+\) par le pont \(R_1\)–\(R_2\) : réaction positive, l'ALI est saturé. \(V^+ = \alpha s\) et \(V^- = u_C\). Avec \(s = +V_{\text{sat}}\), l'ALI bascule quand \(u_C\) atteint \(+\alpha V_{\text{sat}}\) ; avec \(s = -V_{\text{sat}}\), quand \(u_C\) redescend à \(-\alpha V_{\text{sat}}\). Seuils : \(\pm\alpha V_{\text{sat}}\).</p>
    <p><strong>Q2.</strong> \(RC\,\dot u_C + u_C = V_{\text{sat}}\), avec \(u_C(0) = -\alpha V_{\text{sat}}\) (continuité) : \(u_C(t) = V_{\text{sat}} - (1+\alpha)V_{\text{sat}}\,e^{-t/RC}\). Le seuil \(\alpha V_{\text{sat}}\) est atteint quand \(e^{-t_1/RC} = \dfrac{1-\alpha}{1+\alpha}\), soit \(t_1 = RC\ln\dfrac{1+\alpha}{1-\alpha}\). La phase suivante est symétrique : \(T = 2t_1\).</p>
    <p><strong>Q3.</strong> Il faut \(\dfrac{1+\alpha}{1-\alpha} = e\), soit \(\alpha = \dfrac{e-1}{e+1} \approx 0{,}462\). Or \(\dfrac{1+\alpha}{1-\alpha} = 1 + \dfrac{2R_1}{R_2}\) : \(\dfrac{R_2}{R_1} = \dfrac{2}{e-1} \approx 1{,}16\) (par exemple \(R_1 = 10\ \text{k}\Omega\) et \(R_2\) ajustée à \(11{,}6\ \text{k}\Omega\)).</p>
    <p><strong>Q4.</strong> \(T = 2RC = 1/f\), donc \(C = \dfrac{1}{2Rf} = \dfrac{1}{2\times10^{5}\times420} \approx 11{,}9\ \text{nF}\). Incertitudes indépendantes sur un produit ou un quotient :
    $$\frac{u(C)}{C} = \sqrt{\left(\frac{u(R)}{R}\right)^2 + \left(\frac{u(f)}{f}\right)^2}$$
    $$\frac{u(C)}{C} = \sqrt{(0{,}01)^2 + (0{,}0024)^2} \approx 1{,}0\ \%$$
    soit \(u(C) \approx 0{,}12\ \text{nF}\) : \(C = 11{,}9\ \text{nF}\) avec \(u(C) = 0{,}1\ \text{nF}\).</p>
    <p><strong>Q5.</strong> Seuils : \(\alpha\times14 = 6{,}47\ \text{V}\) et \(-\alpha\times12 = -5{,}55\ \text{V}\). Phase haute (\(s = 14\ \text{V}\), de \(-5{,}55\) à \(6{,}47\ \text{V}\)) : \(t_H = RC\ln\dfrac{14 + 5{,}55}{14 - 6{,}47}\) \(= RC\ln 2{,}60 \approx 0{,}954\,RC\). Phase basse (\(s = -12\ \text{V}\), de \(6{,}47\) à \(-5{,}55\ \text{V}\)) : \(t_L = RC\ln\dfrac{12 + 6{,}47}{12 - 5{,}55}\) \(= RC\ln 2{,}86 \approx 1{,}051\,RC\). Période \(T \approx 2{,}005\,RC\) (+0,3 % seulement), rapport cyclique \(t_H/T \approx 0{,}48\). La dissymétrie déforme un peu le créneau, mais les deux écarts se compensent presque sur la période : l'erreur sur \(C\) (0,3 %) reste inférieure à l'incertitude de mesure.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Générateur basse fréquence à pont de Wien stabilisé</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>oscillateurs électroniques</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    On réalise un générateur sinusoïdal autour d'un ALI idéal (\(V_{\text{sat}} = 13\ \text{V}\)). Le filtre de Wien comporte \(R = 10\ \text{k}\Omega\) et \(C = 16\ \text{nF}\) dans chaque branche ; on note \(x = RC\omega\) et \(\tau = RC\). L'amplificateur est un non-inverseur : \(R_1 = 10\ \text{k}\Omega\) entre \(V^-\) et la masse ; entre la sortie \(s\) et \(V^-\), deux résistances en série \(R_{2a} = 15\ \text{k}\Omega\) et \(R_{2b} = 6{,}8\ \text{k}\Omega\), deux diodes tête-bêche étant placées en parallèle sur \(R_{2b}\). Modèle des diodes : bloquées tant que la tension à leurs bornes reste inférieure à \(V_d = 0{,}6\ \text{V}\) en valeur absolue ; au-delà, l'une d'elles conduit et maintient cette tension à \(V_d\). La tension \(e\) est celle de l'entrée \(+\).
  </div>

  <p class="exo-part">Partie A — Approche fréquentielle (diodes bloquées)</p>
  <div class="q"><strong>A1.</strong> Exprimer le gain \(A\) de l'amplificateur et le calculer.</div>
  <div class="q"><strong>A2.</strong> Établir \(\underline{\beta} = \dfrac{1}{3 + \mathrm{j}\left(x - 1/x\right)}\).</div>
  <div class="q"><strong>A3.</strong> Appliquer la condition de Barkhausen ; calculer \(f_0\). Le démarrage est-il assuré ?</div>

  <p class="exo-part">Partie B — Approche temporelle et démarrage</p>
  <div class="q"><strong>B1.</strong> Établir l'équation différentielle vérifiée par \(e(t)\) lorsque \(A\) est constant.</div>
  <div class="q"><strong>B2.</strong> En déduire le taux de croissance \(\sigma\) et comparer la pseudo-pulsation à \(\omega_0 = 1/\tau\).</div>
  <div class="q"><strong>B3.</strong> Le bruit initial sur \(e\) est de l'ordre de \(10\ \text{µV}\). Au bout de combien de temps (et de périodes) \(e\) atteint-elle \(0{,}5\ \text{V}\) (les diodes sont encore bloquées, cf. C2) ?</div>

  <p class="exo-part">Partie C — Stabilisation de l'amplitude</p>
  <div class="q"><strong>C1.</strong> Lorsqu'une diode conduit franchement, on assimile \(R_{2b}\) à un court-circuit. Calculer le gain \(A'\) correspondant. Expliquer qualitativement pourquoi l'amplitude se stabilise.</div>
  <div class="q"><strong>C2.</strong> En régime établi, justifier que les fondamentaux vérifient \(e = s/3\), en phase. Diodes bloquées, exprimer le courant dans \(R_1\), puis la tension \(v_{2b}\) aux bornes de \(R_{2b}\), en fonction de \(e\) puis de \(s\). En déduire l'amplitude \(S_{m0}\) de \(s\) à partir de laquelle les diodes commencent à conduire. L'amplitude réelle \(S_m\) est-elle plus grande ou plus petite ? Comparer à \(V_{\text{sat}}\).</div>
  <div class="q"><strong>C3.</strong> Que se passerait-il sans les diodes ? Quelle serait l'allure de \(s\) ?</div>

  <p class="exo-part">Partie D — Pureté spectrale</p>
  <div class="q"><strong>D1.</strong> Calculer \(|\underline{\beta}(3\omega_0)|/|\underline{\beta}(\omega_0)|\) et commenter l'efficacité du filtre de Wien vis-à-vis de l'harmonique 3.</div>
  <div class="q"><strong>D2.</strong> Une simulation numérique du montage (modèle de diode de l'énoncé) donne, en régime établi, les taux de distorsion harmonique suivants : sans les diodes, \(8{,}0\ \%\) sur \(s\) et \(5{,}7\ \%\) sur \(e\) ; avec les diodes, \(4{,}4\ \%\) sur \(s\) et \(3{,}3\ \%\) sur \(e\). Interpréter ces quatre valeurs. Le cahier des charges impose un taux inférieur à 1 % : est-il respecté ? Que proposer, et où prélever le signal utile ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(i^- = 0\) : \(V^- = \dfrac{R_1}{R_1 + R_{2a} + R_{2b}}\,s\) et \(V^+ = V^- = e\) (régime linéaire). Donc \(A = 1 + \dfrac{R_{2a} + R_{2b}}{R_1} = 1 + \dfrac{21{,}8}{10} = 3{,}18\).</p>
    <p><strong>A2.</strong> Diviseur de tension (\(i^+ = 0\)) entre \(\underline{Z}_s = R + \dfrac{1}{\mathrm{j}C\omega}\) et \(\underline{Z}_p\), d'admittance \(\underline{Y}_p = \dfrac1R + \mathrm{j}C\omega\) :
    $$\underline{\beta} = \frac{1}{1 + \underline{Z}_s\underline{Y}_p} = \frac{1}{3 + \mathrm{j}\left(x - \dfrac1x\right)}$$
    car \(\underline{Z}_s\underline{Y}_p = 1 + \mathrm{j}x + \dfrac{1}{\mathrm{j}x} + 1\) \(= 2 + \mathrm{j}\left(x - \dfrac1x\right)\).</p>
    <p><strong>A3.</strong> \(A = 1/\underline{\beta}\) : \(x = 1\) et \(A = 3\). \(f_0 = \dfrac{1}{2\pi RC}\) \(= \dfrac{1}{2\pi\times10^{4}\times16\times10^{-9}}\) \(\approx 995\ \text{Hz}\). Ici \(A = 3{,}18 \gt 3\) : \(|A\underline{\beta}(\mathrm{j}\omega_0)| = 1{,}06 \gt 1\), le signal à \(\omega_0\) est amplifié à chaque tour de boucle (le signe de l'inégalité est confirmé en B).</p>
    <p><strong>B1.</strong> \(\beta(p) = \dfrac{\tau p}{1 + 3\tau p + \tau^2p^2}\), donc \(\tau^2\ddot e + 3\tau\dot e + e = \tau\dot s\) ; avec \(s = Ae\) :
    $$\ddot e + (3 - A)\,\omega_0\,\dot e + \omega_0^2\,e = 0$$
    avec \(\omega_0 = 1/\tau = 6{,}25\times10^{3}\ \text{rad/s}\).</p>
    <p><strong>B2.</strong> \(\sigma = \dfrac{(A-3)\,\omega_0}{2}\) \(= \dfrac{0{,}18\times6250}{2}\) \(\approx 5{,}6\times10^{2}\ \text{s}^{-1}\). Pseudo-pulsation \(\sqrt{\omega_0^2 - \sigma^2} = \omega_0\sqrt{1 - 0{,}0081} \approx 0{,}996\,\omega_0\) : écart de 0,4 %.</p>
    <p><strong>B3.</strong> \(t = \dfrac{1}{\sigma}\ln\dfrac{0{,}5}{10^{-5}} = \dfrac{10{,}8}{563} \approx 19\ \text{ms}\), soit environ 19 périodes (\(T_0 \approx 1{,}0\ \text{ms}\)).</p>
    <p><strong>C1.</strong> \(A' = 1 + \dfrac{R_{2a}}{R_1} = 2{,}5 \lt 3\). Aux petites amplitudes (diodes bloquées), \(A = 3{,}18\) : l'amplitude croît. Aux grandes amplitudes, les diodes conduisent sur une fraction croissante de la période et le gain moyen tend vers \(2{,}5\) : l'amplitude décroît. Elle se stabilise à la valeur intermédiaire où le gain moyen vaut 3. L'équilibre est stable : si l'amplitude augmente, le gain baisse, et inversement.</p>
    <p><strong>C2.</strong> À \(\omega_0\), \(\underline{\beta} = 1/3\) est réel : les fondamentaux vérifient \(e = s/3\), en phase. L'ALI étant linéaire, \(V^- = e\) : le courant dans \(R_1\) vaut \(i = e/R_1\) et, comme \(i^- = 0\), ce même courant traverse \(R_{2a}\) et \(R_{2b}\) (diodes bloquées). D'où
    $$v_{2b} = \frac{R_{2b}}{R_1}\,e = \frac{R_{2b}}{3R_1}\,s$$
    Les diodes commencent à conduire quand la crête de \(v_{2b}\) atteint \(V_d\) :
    $$S_{m0} = \frac{3R_1}{R_{2b}}\,V_d$$
    soit \(S_{m0} = \dfrac{3\times10}{6{,}8}\times0{,}6 \approx 2{,}6\ \text{V}\) (et \(E_{m0} = S_{m0}/3 \approx 0{,}88\ \text{V}\)).
    À cette amplitude, le gain vaut encore \(3{,}18\) sur toute la période : l'amplitude continue de croître jusqu'à ce que les diodes conduisent sur une fraction suffisante de chaque période pour ramener le gain moyen à 3. \(S_{m0}\) est donc un <strong>minorant</strong> ; une simulation donne \(S_m \approx 4{,}2\ \text{V}\) et \(E_m \approx 1{,}4\ \text{V}\). Dans tous les cas \(S_m \ll V_{\text{sat}} = 13\ \text{V}\) : l'ALI reste en régime linéaire, et c'est la conduction des diodes, non la saturation, qui fixe l'amplitude.</p>
    <p><strong>C3.</strong> Sans diodes, \(A = 3{,}18\) quelle que soit l'amplitude : celle-ci croît jusqu'à la saturation, et \(s\) est écrêtée à \(\pm13\ \text{V}\) (sommets aplatis). L'écrêtage étant symétrique, il crée surtout des harmoniques impairs (3, 5…).</p>
    <p><strong>D1.</strong> \(\dfrac{1}{|\underline{\beta}(x)|} = \sqrt{9 + \left(x - \dfrac1x\right)^2}\) : 3 pour \(x = 1\), \(\sqrt{9 + 64/9} \approx 4{,}0\) pour \(x = 3\). Rapport \(\dfrac{|\underline{\beta}(3\omega_0)|}{|\underline{\beta}(\omega_0)|} \approx \dfrac{3}{4{,}0} \approx 0{,}75\) : l'harmonique 3 n'est atténué que de 25 % de plus que le fondamental. Le filtre de Wien (\(Q = 1/3\)) nettoie très mal le signal.</p>
    <p><strong>D2.</strong> Les diodes divisent la distorsion par deux environ : l'ALI ne sature plus, et la non-linéarité ne porte que sur une partie (\(R_{2b}\)) de la contre-réaction. Sur \(e\), la distorsion est réduite d'un facteur 0,71 à 0,75 par rapport à \(s\) (\(5{,}7/8{,}0\) et \(3{,}3/4{,}4\)) : c'est l'atténuation relative de l'harmonique 3, prépondérant, calculée en D1. Aucune des deux solutions n'atteint 1 % : le filtre de Wien (\(Q = 1/3\)) est trop peu sélectif, et le seuil franc des diodes crée encore des harmoniques. On retient les diodes et l'on prélève \(e\) à travers un suiveur (pour ne pas charger le filtre), éventuellement suivi d'un passe-bande sélectif centré sur \(f_0\). Pour descendre nettement sous 1 %, il faut une stabilisation progressive (thermistance, transistor à effet de champ commandé par l'amplitude moyenne) : le gain est ajusté sur de nombreuses périodes et reste quasi constant au cours d'une période, donc ne déforme presque pas le signal. Des diodes réelles, à caractéristique exponentielle, font d'ailleurs un peu mieux que le modèle à seuil franc.</p>
