<div class="course-section">
  <div class="sec-num">§1 · PRODUIT DE SOLUBILITÉ</div>
  <h2>L'équilibre entre un solide ionique et ses ions</h2>
  <div class="intro">Le sel de cuisine se dissout à raison de plus de 300 g par litre ; le chlorure d'argent, à peine 2 mg. Pour un solide peu soluble, la dissolution s'arrête vite : la solution devient saturée et le solide coexiste avec ses ions dans un état d'équilibre, décrit par une constante, le produit de solubilité.</div>
  <div class="def-box">
    <strong>Produit de solubilité.</strong> Pour la dissolution d'un solide ionique \(\mathrm{C}_m\mathrm{A}_n(s) = m\,\mathrm{C}^{p+} + n\,\mathrm{A}^{q-}\) (avec \(mp = nq\)), la constante d'équilibre est le <strong>produit de solubilité</strong>
    <div class="formula" data-nom="Produit de solubilité">$$K_s = \left(\frac{[\mathrm{C}^{p+}]}{c^\circ}\right)^{m}\left(\frac{[\mathrm{A}^{q-}]}{c^\circ}\right)^{n}\Bigg|_{\text{éq}}, \qquad \text{p}K_s = -\log K_s$$</div>
    Le solide pur a une activité égale à 1 et n'apparaît pas. Exemple : AgCl(s) = Ag⁺ + Cl⁻, \(K_s = [\mathrm{Ag^+}][\mathrm{Cl^-}]/(c^\circ)^2\). Comme toute constante, \(K_s\) est sans dimension et ne dépend que de la température.
  </div>
  <div class="prop-box">
    <strong>Une égalité qui suppose le solide présent.</strong> La relation \(Q = K_s\) n'est vérifiée que si le solide est présent à l'équilibre : la solution est alors <strong>saturée</strong>. Sans solide, le produit des concentrations ioniques peut prendre n'importe quelle valeur inférieure à \(K_s\).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0">
    <tr><th style="text-align:left">Solide (25 °C)</th><td>AgCl</td><td>AgI</td><td>Ag₂CrO₄</td><td>CaCO₃</td><td>CaF₂</td><td>BaSO₄</td><td>PbI₂</td><td>Mg(OH)₂</td><td>Cu(OH)₂</td><td>Fe(OH)₃</td></tr>
    <tr><th style="text-align:left">\(\text{p}K_s\)</th><td>9,75</td><td>16,1</td><td>11,95</td><td>8,5</td><td>10,4</td><td>10,0</td><td>8,0</td><td>11,2</td><td>19,7</td><td>38</td></tr>
  </table></div>
  <p>Ces valeurs varient un peu d'une table à l'autre (jusqu'à une unité pour les hydroxydes, dont la forme cristalline compte). On parle de solide « peu soluble » quand la solubilité est inférieure à environ 10⁻² mol·L⁻¹ ; pour un sel très soluble (NaCl), la notion de produit de solubilité perd son intérêt, les activités n'étant plus égales aux concentrations.</p>
  <div class="method-box"><strong>Exemple — déterminer \(K_s\) à partir d'une solubilité mesurée</strong>
    <p>On mesure qu'il se dissout au plus 0,62 g d'iodure de plomb PbI₂ (\(M = 461\ \text{g·mol}^{-1}\)) par litre d'eau à 25 °C. En déduire \(K_s\).</p>
    <ol>
      <li>Solubilité molaire : \(s = 0{,}62/461 = 1{,}34\times10^{-3}\ \text{mol·L}^{-1}\).</li>
      <li>PbI₂(s) = Pb²⁺ + 2 I⁻ : à saturation dans l'eau pure, \([\mathrm{Pb^{2+}}] = s\) et \([\mathrm{I^-}] = 2s\).</li>
      <li>\(K_s = (s/c^\circ)(2s/c^\circ)^2 = 4(s/c^\circ)^3 = 9{,}7\times10^{-9}\), soit \(\text{p}K_s = 8{,}0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier les coefficients stœchiométriques en exposant (\([\mathrm{I^-}]^2\)) ou écrire le solide dans \(K_s\). Autre piège : écrire \([\mathrm{I^-}] = s\) alors que chaque PbI₂ dissous libère deux ions iodure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SOLUBILITÉ</div>
  <h2>De \(K_s\) à la quantité qui se dissout</h2>
  <div class="intro">La solubilité est la grandeur concrète : combien de solide peut-on dissoudre par litre ? Elle se déduit de \(K_s\), mais la relation dépend de la stœchiométrie, ce qui interdit de comparer les \(K_s\) de solides de types différents.</div>
  <div class="def-box">
    <strong>Solubilité.</strong> La solubilité \(s\) d'un solide dans un solvant est la quantité maximale (en mol·L⁻¹) ou la masse maximale (en g·L⁻¹) de ce solide que l'on peut dissoudre par litre de solution, à une température donnée : c'est la quantité dissoute dans la solution saturée.
  </div>
  <div class="prop-box">
    <strong>Solubilité dans l'eau pure.</strong> Pour \(\mathrm{C}_m\mathrm{A}_n\), si les ions ne réagissent pas avec l'eau, \([\mathrm{C}^{p+}] = ms\) et \([\mathrm{A}^{q-}] = ns\), d'où
    <div class="formula" data-nom="Solubilité dans l'eau pure">$$K_s = m^m n^n \left(\frac{s}{c^\circ}\right)^{m+n} \qquad\text{soit}\qquad s = c^\circ\left(\frac{K_s}{m^m n^n}\right)^{1/(m+n)}$$</div>
    Type AX (AgCl, BaSO₄) : \(s = c^\circ\sqrt{K_s}\) ; type AX₂ ou A₂X (CaF₂, PbI₂, Ag₂CrO₄, Mg(OH)₂) : \(s = c^\circ\,(K_s/4)^{1/3}\).
  </div>
  <div class="method-box"><strong>Exemple — comparer deux solubilités</strong>
    <p>Lequel est le plus soluble dans l'eau : le chlorure d'argent (\(\text{p}K_s = 9{,}75\)) ou le chromate d'argent Ag₂CrO₄ (\(\text{p}K_s = 11{,}95\)) ?</p>
    <ol>
      <li>AgCl, type AX : \(s = \sqrt{10^{-9{,}75}} = 1{,}3\times10^{-5}\ \text{mol·L}^{-1}\), soit \(1{,}9\ \text{mg·L}^{-1}\).</li>
      <li>Ag₂CrO₄ = 2 Ag⁺ + CrO₄²⁻ : \(K_s = (2s)^2 s = 4s^3\), \(s = (1{,}1\times10^{-12}/4)^{1/3} = 6{,}5\times10^{-5}\ \text{mol·L}^{-1}\).</li>
      <li>Le chromate d'argent est 5 fois plus soluble, bien que son \(K_s\) soit 160 fois plus petit : comparer les \(K_s\) n'a de sens qu'entre solides de même stœchiométrie.</li>
    </ol>
  </div>
  <p><strong>Ordres de grandeur</strong> : BaSO₄, \(s = 1{,}0\times10^{-5}\ \text{mol·L}^{-1}\) (2,3 mg·L⁻¹) : c'est pourquoi on peut l'avaler comme produit de contraste radiologique, malgré la toxicité des ions Ba²⁺ ; CaF₂, \(2{,}2\times10^{-4}\ \text{mol·L}^{-1}\) (17 mg·L⁻¹) ; Mg(OH)₂, \(1{,}2\times10^{-4}\ \text{mol·L}^{-1}\), qui fixe le pH de sa solution saturée à 10,4.</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la formule de l'eau pure à un hydroxyde très peu soluble. Pour Fe(OH)₃ (\(\text{p}K_s = 38\)), elle donnerait \([\mathrm{HO^-}] = 3s \approx 4\times10^{-10}\ \text{mol·L}^{-1}\), inférieur à celui de l'eau pure : absurde. Le pH reste voisin de 7, et \(s = K_s/[\mathrm{HO^-}]^3 \approx 10^{-17}\ \text{mol·L}^{-1}\). Dès que les ions réagissent avec l'eau ou entre eux, il faut reprendre le raisonnement (§6, §7).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CONDITION DE PRÉCIPITATION</div>
  <h2>Saturée ou non ? Le critère \(Q\) / \(K_s\)</h2>
  <div class="intro">Quand on mélange deux solutions, un précipité apparaît-il ? Le critère d'évolution du chapitre « Équilibres chimiques » répond, à condition de calculer le quotient de réaction avec les concentrations juste après le mélange.</div>
  <div class="prop-box">
    <strong>Critère de précipitation.</strong> On calcule le quotient \(Q\) de la réaction de dissolution avec les concentrations du système (après mélange et dilution), avec les mêmes exposants que \(K_s\) :
    <ul>
      <li>\(Q \lt K_s\) : solution <strong>non saturée</strong> ; pas de précipité, et un solide introduit se dissout (en totalité si la quantité est faible) ;</li>
      <li>\(Q = K_s\) : solution <strong>saturée</strong>, en équilibre avec le solide ;</li>
      <li>\(Q \gt K_s\) : état impossible à l'équilibre ; le solide <strong>précipite</strong> jusqu'à ce que \(Q\) redescende à \(K_s\).</li>
    </ul>
  </div>

<div class="course-section">
  <div class="sec-num">§4 · ÉTAT FINAL ET COMBINAISONS DE CONSTANTES</div>
  <h2>Équilibre ou dissolution totale ?</h2>
  <div class="intro">Avec un solide, une nouveauté apparaît : l'état final peut ne pas être un état d'équilibre de la réaction de dissolution, si tout le solide a disparu (on parle de rupture d'équilibre). La méthode consiste à faire une hypothèse sur la présence du solide, puis à la vérifier.</div>
  <div class="method-box"><strong>Méthode — état final d'un système avec un solide</strong>
    <ol>
      <li><span class="step">Hypothèse 1 : le solide est présent à l'état final.</span> Écrire \(Q = K_s\) (ou \(Q_r = K^\circ\) pour la réaction considérée) et en déduire l'avancement \(\xi_{\text{éq}}\).</li>
      <li><span class="step">Vérification.</span> La quantité de solide restante doit être positive. Si oui, l'hypothèse est confirmée : équilibre.</li>
      <li><span class="step">Sinon : rupture d'équilibre.</span> Tout le solide est dissous (\(\xi = \xi_{\max}\)) et \(Q \lt K_s\) à l'état final : la transformation est totale.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — un peu ou beaucoup de chlorure d'argent dans un litre d'eau</strong>
    <ol>
      <li>1,0 mg de AgCl (\(M = 143{,}3\ \text{g·mol}^{-1}\)), soit \(7{,}0\times10^{-6}\ \text{mol}\). L'hypothèse « solide présent » donnerait \(\xi = s\,V = 1{,}33\times10^{-5}\ \text{mol}\), plus que la quantité introduite : impossible. Tout se dissout ; \(Q = (7{,}0\times10^{-6})^2 = 4{,}9\times10^{-11} \lt K_s\).</li>
      <li>10 mg, soit \(7{,}0\times10^{-5}\ \text{mol}\) : il en reste \(7{,}0\times10^{-5} - 1{,}33\times10^{-5} = 5{,}6\times10^{-5}\ \text{mol}\) (8,1 mg) au fond du flacon ; la solution est saturée.</li>
    </ol>
  </div>
  <p><strong>Combinaisons de constantes.</strong> Les réactions où intervient un solide se traitent comme au chapitre acide-base : \(K^\circ = \prod_i (K^\circ_i)^{\lambda_i}\). La réaction de précipitation est la dissolution inversée, de constante \(1/K_s\) : Ag⁺ + Cl⁻ = AgCl(s) a pour constante \(10^{9{,}75} = 5{,}6\times10^{9}\), d'où une précipitation quasi totale dès que les ions sont en quantités comparables et nettement au-dessus du seuil.</p>
  <div class="method-box"><strong>Exemple — trois constantes par combinaison</strong>
    <ol>
      <li>Conversion d'un précipité : AgCl(s) + I⁻ = AgI(s) + Cl⁻ est la somme de AgCl(s) = Ag⁺ + Cl⁻ (\(K_s(\mathrm{AgCl})\)) et de Ag⁺ + I⁻ = AgI(s) (\(1/K_s(\mathrm{AgI})\)) : \(K^\circ = 10^{16{,}1 - 9{,}75} = 10^{6{,}35}\). Un précipité blanc de AgCl jaunit dans une solution d'iodure.</li>
      <li>Dissolution d'un hydroxyde par un acide : Mg(OH)₂(s) + 2 H₃O⁺ = Mg²⁺ + 4 H₂O est la somme de la dissolution (\(K_s\)) et de deux fois H₃O⁺ + HO⁻ = 2 H₂O (\(1/K_e\)) : \(K^\circ = K_s/K_e^2 = 10^{-11{,}2 + 28} = 10^{16{,}8}\).</li>
      <li>Calcaire et acide : CaCO₃(s) + 2 H₃O⁺ = Ca²⁺ + CO₂,H₂O + 2 H₂O : \(K^\circ = K_s/(K_{a1}K_{a2}) = 10^{-8{,}5 + 10{,}3 + 6{,}4} = 10^{8{,}2}\) (\(\text{p}K_a\) 6,4 et 10,3 des couples du carbonate).</li>
    </ol>
  </div>
  <p><strong>Capacité numérique.</strong> Le programme de dichotomie du chapitre acide-base (§8) s'applique, à un détail près : avant de chercher l'équilibre, on teste si le solide peut disparaître entièrement.</p>
  <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> dichotomie(f, a, b, eps):
    <span class="kw">while</span> b - a > eps:
        m = (a + b) / 2
        <span class="kw">if</span> f(m) > 0:
            b = m
        <span class="kw">else</span>:
            a = m
    <span class="kw">return</span> (a + b) / 2

<span class="kw">def</span> dissolution_AgCl(n_solide, c_Cl, V, Ks=10**-9.75):
    <span class="str">"""AgCl(s) = Ag+ + Cl- : n_solide mol de solide dans V litres d'une
    solution contenant déjà c_Cl mol/L d'ions chlorure.
    Renvoie (avancement, quantité de solide restante)."""</span>
    Q = <span class="kw">lambda</span> xi: (xi / V) * (c_Cl + xi / V)     <span class="cmt"># c° = 1 mol/L</span>
    <span class="kw">if</span> Q(n_solide) &lt;= Ks:          <span class="cmt"># tout dissous et toujours Q &lt;= Ks :</span>
        <span class="kw">return</span> n_solide, 0.0       <span class="cmt"># pas d'équilibre, plus de solide</span>
    f = <span class="kw">lambda</span> xi: math.log(Q(xi)) - math.log(Ks)
    xi = dichotomie(f, 1e-30, n_solide, 1e-18)
    <span class="kw">return</span> xi, n_solide - xi

print(dissolution_AgCl(1.0e-3, 0.0, 1.0))    <span class="cmt"># (1.33e-05, 0.000987) saturée</span>
print(dissolution_AgCl(1.0e-6, 0.0, 1.0))    <span class="cmt"># (1e-06, 0.0) tout dissous</span>
print(dissolution_AgCl(1.0e-3, 0.10, 1.0))   <span class="cmt"># (1.78e-09, 0.001) ion commun</span></pre>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(Q = K_s\) sans vérifier qu'il reste du solide. Un résultat qui donne une quantité de solide négative signale une rupture d'équilibre, pas une erreur de calcul.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DOMAINE D'EXISTENCE</div>
  <h2>Où le solide existe-t-il ?</h2>
  <div class="intro">Pour une espèce dissoute, on parle de prédominance ; pour un solide, d'existence : il est présent ou absent, sans intermédiaire. Le diagramme d'existence le montre sur un axe de pH (hydroxydes) ou de concentration (pX = −log([X]/c°)).</div>
  <div class="def-box">
    <strong>Domaine d'existence.</strong> Ensemble des conditions (pH, concentration d'un ion) dans lesquelles un solide est présent à l'équilibre. Sa frontière correspond à l'apparition du premier cristal, \(Q = K_s\), calculée pour une <strong>concentration de tracé</strong> choisie par convention (concentration totale de l'élément).
  </div>
  <div class="prop-box">
    <strong>Existence et prédominance.</strong> De part et d'autre d'une frontière de prédominance, les deux formes coexistent ; de part et d'autre d'une frontière d'existence, le solide est présent d'un côté et <strong>totalement absent</strong> de l'autre. La position de la frontière, elle, dépend de la concentration de tracé, comme celle d'un diagramme de prédominance entre deux espèces de stœchiométries différentes.
  </div>
  <p>Pour un hydroxyde M(OH)ₙ et une concentration de tracé \(c\) en ion Mⁿ⁺, le précipité apparaît quand \(c\,[\mathrm{HO^-}]^n = K_s\,(c^\circ)^{n+1}\), soit \(\text{pOH} = (\text{p}K_s + \log(c/c^\circ))/n\) et \(\text{pH} = \text{p}K_e - \text{pOH}\).</p>

<div class="course-section">
  <div class="sec-num">§6 · EFFET D'ION COMMUN</div>
  <h2>Un ion déjà présent réduit la solubilité</h2>
  <div class="intro">Dissoudre AgCl dans de l'eau salée plutôt que dans de l'eau pure : les ions chlorure apportés par le sel limitent la dissolution. C'est un premier « facteur influençant la solubilité », et l'occasion d'exploiter une courbe de solubilité.</div>
  <div class="prop-box">
    <strong>Ion commun.</strong> Dans une solution contenant déjà l'un des ions du solide à la concentration \(c\), la solubilité diminue. Pour AgCl dans NaCl : \(s\,(s + c) = K_s\,(c^\circ)^2\). Si \(c \gg s\), \(s \approx K_s (c^\circ)^2/c\) : la solubilité est inversement proportionnelle à la concentration de l'ion commun.
  </div>

<div class="course-section">
  <div class="sec-num">§7 · INFLUENCE DU pH</div>
  <h2>Courbes de solubilité en fonction du pH</h2>
  <div class="intro">Quand l'un des ions du solide est un acide ou une base, le pH change sa forme en solution et déplace l'équilibre de dissolution. C'est pourquoi le calcaire se dissout dans le vinaigre, les hydroxydes métalliques dans les acides, et pourquoi on règle le pH pour faire précipiter les métaux d'une eau usée.</div>
  <div class="prop-box">
    <strong>Hydroxyde M(OH)ₙ.</strong> Tant que le solide est présent, \(s = [\mathrm{M}^{n+}] = K_s (c^\circ)^{n+1}/[\mathrm{HO^-}]^n\), donc
    <div class="formula" data-nom="Courbe de solubilité d'un hydroxyde">$$\text{pS} = -\log\frac{s}{c^\circ} = \text{p}K_s - n\,\text{p}K_e + n\,\text{pH}$$</div>
    une droite de pente \(n\) : la solubilité est divisée par \(10^n\) par unité de pH.
  </div>
  <div class="prop-box">
    <strong>Anion basique.</strong> Pour CaF₂ (F⁻ base du couple HF/F⁻, \(\text{p}K_a = 3{,}2\)), le fluor dissous est réparti entre F⁻ et HF : \(2s = [\mathrm{F^-}]\,(1 + h/K_a)\) avec \(h = 10^{-\text{pH}}\). En reportant dans \(K_s = s\,[\mathrm{F^-}]^2\) : \(s = c^\circ\left(K_s\,(1 + h/K_a)^2/4\right)^{1/3}\). Constante pour \(\text{pH} \gt \text{p}K_a + 1\), elle croît en milieu acide.
  </div>
  <p>Un hydroxyde <strong>amphotère</strong> comme Al(OH)₃ se dissout aussi en milieu très basique, en formant un ion soluble (ion aluminate Al(OH)₄⁻, données fournies par l'énoncé) : sa courbe de solubilité présente un minimum.</p>

<figcaption>Courbes de solubilité calculées (pS = −log(s/c°) : plus pS est grand, moins le solide est soluble), valables là où le solide est présent. Cu(OH)₂ (pK<sub>s</sub> = 19,7) : droite pS = 2 pH − 8,3, la solubilité est divisée par 100 par unité de pH. Al(OH)₃ (pK<sub>s</sub> = 32), amphotère : il se dissout en milieu acide (Al³⁺) et en milieu basique (ion aluminate Al(OH)₄⁻, constante 10 pour Al(OH)₃ + HO⁻ = Al(OH)₄⁻) ; solubilité minimale vers pH 5,9. CaF₂ (pK<sub>s</sub> = 10,4) : solubilité constante tant que F⁻ prédomine (pH &gt; 4), plus forte en milieu acide où F⁻ est protoné en HF (pK<sub>a</sub> = 3,2).</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — exploiter les courbes de solubilité</strong>
    <ol>
      <li>Rejet d'une eau contenant du cuivre : la norme impose moins de 0,5 mg·L⁻¹, soit \(7{,}9\times10^{-6}\ \text{mol·L}^{-1}\), donc \(\text{pS} \ge 5{,}1\). Avec \(\text{pS} = 2\,\text{pH} - 8{,}3\), il faut \(\text{pH} \ge 6{,}7\).</li>
      <li>CaF₂ à pH 2 : \(h/K_a = 10^{1{,}2} = 15{,}8\), \(s = (10^{-10{,}4}\times16{,}8^2/4)^{1/3} = 1{,}4\times10^{-3}\ \text{mol·L}^{-1}\), 6,6 fois la solubilité en milieu neutre (\(2{,}2\times10^{-4}\)).</li>
      <li>Al(OH)₃ pour une concentration de tracé de 10⁻² mol·L⁻¹ : le solide existe tant que \(\text{pS} \ge 2\), c'est-à-dire de pH 4,0 à pH 11,0 ; la solubilité est minimale (10⁻⁷ mol·L⁻¹) vers pH 5,9.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prolonger une courbe de solubilité là où le solide n'existe plus. Si le calcul donne une solubilité supérieure à la quantité d'élément disponible, tout est dissous et la courbe ne s'applique pas (rupture d'équilibre, §4).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · PRÉCIPITATIONS COMPÉTITIVES</div>
  <h2>Qui précipite en premier ? Séparer des ions</h2>
  <div class="intro">Quand un même réactif peut précipiter plusieurs ions, ils précipitent dans l'ordre des seuils d'apparition. Si les seuils sont assez éloignés, on peut séparer les ions : c'est le principe de nombreux procédés de purification et de la méthode de Mohr.</div>
  <div class="prop-box">
    <strong>Ordre de précipitation.</strong> En ajoutant progressivement un réactif (Ag⁺, HO⁻…), on calcule pour chaque solide la concentration de réactif nécessaire à son apparition : le solide dont le seuil est atteint le premier précipite d'abord. Le second ne commence à précipiter que lorsque son propre seuil est atteint ; on calcule alors ce qui reste du premier ion pour juger la qualité de la séparation.
  </div>

    <p>Une solution contient I⁻ et Cl⁻ à 0,10 mol·L⁻¹ chacun ; on y ajoute progressivement des ions Ag⁺ (volume constant).</p>
    <ol>
      <li>Seuils : AgI apparaît pour \([\mathrm{Ag^+}] = 10^{-16{,}1}/0{,}10 = 10^{-15{,}1}\ \text{mol·L}^{-1}\), AgCl pour \(10^{-8{,}75}\ \text{mol·L}^{-1}\) : AgI précipite d'abord.</li>
      <li>Quand AgCl commence à précipiter, \([\mathrm{I^-}] = 10^{-16{,}1}/10^{-8{,}75} = 10^{-7{,}35} = 4{,}5\times10^{-8}\ \text{mol·L}^{-1}\) : il reste 0,000 045 % des iodures.</li>
      <li>La séparation est excellente parce que les \(K_s\) diffèrent d'un facteur \(10^{6{,}35}\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — éliminer le fer d'une solution de cuivre</strong>
    <p>Une solution de sulfate de cuivre à 0,10 mol·L⁻¹ contient des ions Fe³⁺ indésirables. On l'amène à pH 3,5. Que devient chaque ion ?</p>
    <ol>
      <li>Cu(OH)₂ n'apparaît qu'à pH 4,65 pour 0,10 mol·L⁻¹ (§5) : à pH 3,5, le cuivre reste dissous.</li>
      <li>Fe(OH)₃ : \([\mathrm{HO^-}] = 10^{-10{,}5}\), donc \([\mathrm{Fe^{3+}}] = 10^{-38}/10^{-31{,}5} = 3\times10^{-7}\ \text{mol·L}^{-1}\) au plus : le fer précipite presque entièrement et se filtre.</li>
      <li>C'est le principe de la purification des solutions avant électrolyse en hydrométallurgie du cuivre ou du zinc.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · TITRAGES PAR PRÉCIPITATION</div>
  <h2>Doser les ions chlorure</h2>
  <div class="intro">Une réaction de précipitation rapide et quasi totale peut servir de réaction de titrage : c'est le cas de Ag⁺ + Cl⁻ = AgCl(s), qui permet de doser les chlorures d'une eau, d'un sérum ou d'un aliment. On repère l'équivalence par un indicateur de fin de titrage ou par conductimétrie.</div>
  <div class="prop-box">
    <strong>Méthode de Mohr.</strong> Titrage des ions chlorure par une solution de nitrate d'argent, en présence d'un peu d'ions chromate CrO₄²⁻. AgCl (blanc) précipite d'abord ; le chromate d'argent Ag₂CrO₄ (rouge brique) n'apparaît que lorsque presque tous les chlorures ont été consommés, juste après l'équivalence : son apparition marque la fin du titrage. On travaille en milieu voisin de la neutralité (pH 6,5 à 10 environ) : en milieu acide, CrO₄²⁻ est protoné (couple HCrO₄⁻/CrO₄²⁻, \(\text{p}K_a \approx 6{,}5\)) et l'indicateur ne fonctionne plus ; en milieu basique, l'oxyde d'argent précipite.
  </div>

    <ol>
      <li>Équivalence : \(n(\mathrm{Cl^-}) = n(\mathrm{Ag^+})\), d'où \(C = 1{,}00\times10^{-2}\times15{,}4/10{,}0 = 1{,}54\times10^{-2}\ \text{mol·L}^{-1}\), et \(0{,}154\ \text{mol·L}^{-1}\) dans le sérum, soit \(0{,}154\times58{,}4 = 9{,}0\ \text{g·L}^{-1}\) de NaCl : l'étiquette annonce 0,9 %.</li>
      <li>Justification de l'indicateur : Ag₂CrO₄ apparaît pour \([\mathrm{Ag^+}] = \sqrt{K_s/(5{,}0\times10^{-3})} = 1{,}5\times10^{-5}\ \text{mol·L}^{-1}\) ; à cet instant \([\mathrm{Cl^-}] = K_s/[\mathrm{Ag^+}] = 1{,}2\times10^{-5}\ \text{mol·L}^{-1}\), contre \(1{,}3\times10^{-5}\) à l'équivalence exacte.</li>
      <li>L'excès d'argent versé au virage est d'environ \(3\times10^{-6}\ \text{mol·L}^{-1}\) dans 25 mL, soit 0,008 mL de titrant : l'erreur est négligeable (0,05 %).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§10 · AUTRES FACTEURS, PROCÉDÉS</div>
  <h2>Température, solvant, et précipitation au service de l'industrie</h2>
  <div class="intro">La solubilité dépend aussi de la température et du solvant. La précipitation sélective, elle, sert à traiter les eaux, à recycler des métaux et à séparer des ions : le programme demande d'illustrer de tels procédés.</div>
  <div class="prop-box">
    <strong>Température et solvant.</strong> Comme toute constante d'équilibre, \(K_s\) dépend de la température. La dissolution de la plupart des sels est endothermique : leur solubilité augmente quand on chauffe. Quelques solides font exception, dont le calcaire CaCO₃ et la chaux Ca(OH)₂, moins solubles à chaud. Le solvant compte aussi : un solide ionique se dissout bien dans un solvant polaire et dissociant comme l'eau, très peu dans un solvant apolaire (chapitre <a href="#molecules/cours">« Structure des molécules »</a>).
  </div>
  <div class="method-box"><strong>Exemple — pourquoi le tartre se dépose dans une bouilloire</strong>
    <ol>
      <li>\(\text{p}K_s(\mathrm{CaCO_3})\) passe de 8,48 à 25 °C à 8,99 à 80 °C (données de la littérature) : la solubilité calculée dans l'eau pure, \(\sqrt{K_s}\), passe de \(5{,}8\times10^{-5}\) à \(3{,}2\times10^{-5}\ \text{mol·L}^{-1}\).</li>
      <li>Surtout, le CO₂ dissous s'échappe à chaud : 2 HCO₃⁻ = CO₃²⁻ + CO₂,H₂O se déplace, la concentration en CO₃²⁻ augmente et \(Q\) dépasse \(K_s\) : CaCO₃ précipite sur les parois.</li>
      <li>Le détartrage fait l'inverse : un acide (vinaigre, acide phosphorique) dissout CaCO₃ (\(K^\circ = 10^{8{,}2}\) avec H₃O⁺, §4).</li>
    </ol>
  </div>
  <p><strong>Procédés de retraitement, de recyclage, de séparation.</strong></p>
  <ul>
    <li><strong>Traitement des effluents industriels</strong> : on élève le pH (chaux, soude) pour faire précipiter les hydroxydes des métaux lourds (Cu, Zn, Ni, Cr…), que l'on décante et filtre ; le pH visé se lit sur les courbes de solubilité (§7), en se méfiant des hydroxydes amphotères qui se redissolvent si l'on dépasse.</li>
    <li><strong>Hydrométallurgie</strong> : purification des solutions de cuivre ou de zinc par précipitation sélective de Fe(OH)₃ à pH 3 à 4 (§8).</li>
    <li><strong>Extraction du magnésium de l'eau de mer</strong> : la chaux fait précipiter Mg(OH)₂, redissous par l'acide chlorhydrique avant l'électrolyse du chlorure de magnésium.</li>
    <li><strong>Recyclage de l'argent</strong> des bains photographiques et des déchets de laboratoire, récupéré sous forme de AgCl.</li>
    <li><strong>Déphosphatation des eaux usées</strong> : les phosphates sont précipités par des sels de fer(III) ou de calcium.</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'augmenter le pH précipite toujours mieux un métal. Pour Al(OH)₃ ou Zn(OH)₂, amphotères, un excès de base redissout le précipité : il faut viser le minimum de la courbe de solubilité.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · COMPLEXATION ET ACTIVITÉS</div>
  <h2>Deux effets hors programme</h2>
  <div class="intro">Hors programme en PTSI : les complexes et leurs constantes, et les coefficients d'activité. Ils expliquent deux observations courantes.</div>
  <p><strong>Complexation.</strong> Un ligand qui fixe le cation du solide dans un ion complexe soluble le retire de l'équilibre et augmente la solubilité. Avec l'ammoniac, Ag⁺ + 2 NH₃ = [Ag(NH₃)₂]⁺ (constante \(\beta_2 = 10^{7{,}2}\)) : AgCl(s) + 2 NH₃ = [Ag(NH₃)₂]⁺ + Cl⁻ a pour constante \(K_s\beta_2 = 10^{-2{,}55}\). Dans l'ammoniac à 1 mol·L⁻¹, on trouve \(s = 0{,}048\ \text{mol·L}^{-1}\), 3 600 fois plus que dans l'eau pure : c'est le test qui distingue AgCl (soluble dans l'ammoniac) de AgI (insoluble).</p>
  <p><strong>Activités.</strong> Dans une solution concentrée en ions, l'activité d'un ion n'est plus égale à \([\mathrm{X}]/c^\circ\) : les interactions entre ions la diminuent, et un sel inerte ajouté augmente légèrement la solubilité (« effet de sel »). Le modèle du cours (activité = concentration réduite) suffit tant que la force ionique reste faible, en pratique en dessous de 10⁻² à 10⁻¹ mol·L⁻¹.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="pre-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · PRÉCIPITATION</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur la dissolution et la précipitation : relier solubilité et produit de solubilité, prévoir une précipitation, déterminer un état final (équilibre ou dissolution totale), combiner des constantes, tracer et lire des diagrammes d'existence et des courbes de solubilité, prévoir des précipitations compétitives, exploiter un titrage et choisir les conditions d'un procédé.</div>

  <div class="method-box"><strong>Méthode 1 — Relier solubilité et produit de solubilité</strong>
    <ol>
      <li><span class="step">Équation.</span> Écrire l'équation de dissolution et \(K_s\) avec les bons exposants (le solide n'y figure pas).</li>
      <li><span class="step">Concentrations.</span> Exprimer chaque concentration ionique en fonction de \(s\) (coefficients stœchiométriques, ion commun éventuel).</li>
      <li><span class="step">Résolution.</span> Eau pure : \(s = c^\circ\sqrt{K_s}\) pour AX, \(s = c^\circ(K_s/4)^{1/3}\) pour AX₂ ou A₂X ; vérifier que les ions ne réagissent pas avec l'eau.</li>
    </ol>
    <p><em>Exemple éclair :</em> CaF₂ (\(\text{p}K_s = 10{,}4\)) : \(K_s = s(2s)^2 = 4s^3\), \(s\) \(= (10^{-10{,}4}/4)^{1/3}\) \(= 2{,}2\times10^{-4}\ \text{mol·L}^{-1}\), soit 17 mg·L⁻¹.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : comparer les solubilités par les \(K_s\) pour des solides de stœchiométries différentes (Ag₂CrO₄, de \(K_s\) plus petit, est plus soluble que AgCl).</div>

  <div class="method-box"><strong>Méthode 2 — Prévoir s'il y a précipitation lors d'un mélange</strong>
    <ol>
      <li><span class="step">Dilution.</span> Calculer les concentrations de chaque ion juste après le mélange, comme si rien ne précipitait.</li>
      <li><span class="step">Quotient.</span> Former \(Q\) avec les exposants de \(K_s\).</li>
      <li><span class="step">Comparaison.</span> \(Q \gt K_s\) : précipitation ; \(Q \le K_s\) : pas de précipité.</li>
    </ol>
    <p><em>Exemple éclair :</em> 10 mL de Pb(NO₃)₂ et 10 mL de KI, chacun à \(1{,}0\times10^{-3}\ \text{mol·L}^{-1}\) : \(Q\) \(= 5\times10^{-4}\times(5\times10^{-4})^2\) \(= 1{,}3\times10^{-10} \lt K_s(\mathrm{PbI_2})\) \(= 10^{-8}\), rien ne précipite. À \(2{,}0\times10^{-2}\ \text{mol·L}^{-1}\) chacun : \(Q = 10^{-6} \gt 10^{-8}\), PbI₂ jaune précipite.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Déterminer l'état final : équilibre ou dissolution totale</strong>
    <ol>
      <li><span class="step">Hypothèse « solide présent ».</span> Écrire \(Q = K_s\) (ou \(Q_r = K^\circ\)) et calculer l'avancement.</li>
      <li><span class="step">Test.</span> Comparer la quantité de solide qui devrait se dissoudre à la quantité disponible.</li>
      <li><span class="step">Conclusion.</span> S'il reste du solide : équilibre, solution saturée. Sinon : rupture d'équilibre, tout est dissous et \(Q \lt K_s\).</li>
    </ol>
    <p><em>Exemple éclair :</em> CaF₂ dans 100 mL d'eau (\(s\) \(= 2{,}15\times10^{-4}\ \text{mol·L}^{-1}\), au plus \(2{,}15\times10^{-5}\ \text{mol}\) dissous). Avec 5,0 mg (\(6{,}4\times10^{-5}\ \text{mol}\)) : il reste \(4{,}3\times10^{-5}\ \text{mol}\) (3,3 mg) de solide. Avec 1,0 mg (\(1{,}3\times10^{-5}\ \text{mol}\)) : tout se dissout.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Calculer une constante par combinaison (\(K_s\), \(K_a\), \(K_e\))</strong>
    <ol>
      <li><span class="step">Décomposer</span> la réaction en étapes de constantes connues : dissolution (\(K_s\)), précipitation (\(1/K_s\)), capture d'un proton par une base (\(1/K_a\)), H₃O⁺ + HO⁻ = 2 H₂O (\(1/K_e\)).</li>
      <li><span class="step">Vérifier</span> que la somme redonne exactement l'équation (espèces intermédiaires simplifiées).</li>
      <li><span class="step">Multiplier</span> les constantes (additionner les logarithmes) et interpréter : \(K^\circ\) grand, réaction quasi totale ; petit, peu avancée.</li>
    </ol>
    <p><em>Exemple éclair :</em> CaF₂(s) + 2 H₃O⁺ = Ca²⁺ + 2 HF + 2 H₂O : \(K^\circ\) \(= K_s/K_a^2\) \(= 10^{-10{,}4 + 2\times3{,}2}\) \(= 10^{-4{,}0}\). L'acide ne dissout le fluorure de calcium que partiellement, à la différence du calcaire (\(K^\circ = 10^{8{,}2}\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Tracer un diagramme d'existence</strong>
    <ol>
      <li><span class="step">Convention.</span> Fixer la concentration de tracé \(c\) de l'élément (donnée par l'énoncé).</li>
      <li><span class="step">Frontière.</span> Écrire la condition d'apparition du premier cristal \(Q = K_s\) avec l'ion à la concentration \(c\) ; en déduire la valeur frontière (pH, pX).</li>
      <li><span class="step">Côtés.</span> Placer le solide du côté où le réactif précipitant est abondant (pH élevé pour un hydroxyde, pX petit pour un sel de X) ; de l'autre côté, l'élément est entièrement dissous.</li>
    </ol>
    <p><em>Exemple éclair :</em> Mg(OH)₂ (\(\text{p}K_s = 11{,}2\)) pour \(c = 0{,}050\ \text{mol·L}^{-1}\) : \(\text{pOH}\) \(= (11{,}2 + \log 0{,}050)/2\) \(= 4{,}95\), frontière à pH 9,05 ; Zn(OH)₂ (16,4) pour \(c = 10^{-2}\) : pH 6,8.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un diagramme d'existence sans concentration de tracé n'a pas de sens ; et de part et d'autre de la frontière, le solide n'est pas « minoritaire » : il est présent ou absent.</div>

  <div class="method-box"><strong>Méthode 6 — Calculer une solubilité en présence d'un ion commun</strong>
    <ol>
      <li><span class="step">Bilan.</span> Concentrations à saturation : l'ion commun vaut \(c + \nu s\) (\(c\) apportée, \(\nu s\) issue de la dissolution).</li>
      <li><span class="step">Hypothèse.</span> Si \(c \gg s\), remplacer \(c + \nu s\) par \(c\) et résoudre simplement ; sinon, résoudre l'équation complète (trinôme ou programme).</li>
      <li><span class="step">Vérifier</span> l'hypothèse et comparer à la solubilité dans l'eau pure (elle doit être plus faible).</li>
    </ol>
    <p><em>Exemple éclair :</em> BaSO₄ (\(\text{p}K_s = 10{,}0\)) dans Na₂SO₄ à 0,010 mol·L⁻¹ : \(s\times0{,}010 = 10^{-10}\), \(s\) \(= 1{,}0\times10^{-8}\ \text{mol·L}^{-1}\) (hypothèse vérifiée), mille fois moins que dans l'eau pure.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Exploiter une courbe de solubilité en fonction du pH</strong>
    <ol>
      <li><span class="step">Expression.</span> Exprimer la solubilité en tenant compte des formes de l'ion dans la solution : \(s\) \(= [\mathrm{M}^{n+}]\) \(= K_s(c^\circ)^{n+1}/[\mathrm{HO^-}]^n\) pour un hydroxyde ; \(s\) incluant la forme protonée pour un anion basique.</li>
      <li><span class="step">Lecture.</span> pS = −log(s/c°) : pente \(n\) en fonction du pH pour un hydroxyde ; palier là où l'anion basique prédomine ; minimum pour un hydroxyde amphotère.</li>
      <li><span class="step">Validité.</span> La courbe ne vaut que là où le solide existe : comparer \(s\) à la quantité d'élément disponible.</li>
    </ol>
    <p><em>Exemple éclair :</em> Mg(OH)₂ : pS = 11,2 − 28 + 2 pH = 2 pH − 16,8. À pH 9, \(s\) \(= 6{,}3\times10^{-2}\ \text{mol·L}^{-1}\) ; à pH 11, \(6{,}3\times10^{-6}\ \text{mol·L}^{-1}\) : deux unités de pH divisent la solubilité par 10⁴.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Prévoir des précipitations compétitives et juger une séparation</strong>
    <ol>
      <li><span class="step">Seuils.</span> Pour chaque solide, calculer la concentration (ou le pH) de réactif précipitant à laquelle il apparaît.</li>
      <li><span class="step">Ordre.</span> Le seuil atteint en premier lors de l'ajout désigne le premier précipité.</li>
      <li><span class="step">Séparation.</span> Au seuil du second solide, calculer la concentration restante du premier ion : la séparation est bonne si elle est négligeable (moins de 0,1 % de l'initiale, par exemple).</li>
    </ol>
    <p><em>Exemple éclair :</em> Fe³⁺ et Mg²⁺ à 0,010 mol·L⁻¹, soude ajoutée : seuils à pH 2,0 et 9,4. À pH 9,4, \([\mathrm{Fe^{3+}}]\) \(= 10^{-38}/(10^{-4{,}6})^3\) \(= 10^{-24{,}2}\ \text{mol·L}^{-1}\) : le fer a entièrement précipité avant que le magnésium ne commence.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Exploiter un titrage par précipitation</strong>
    <ol>
      <li><span class="step">Réaction support</span> (ex. Ag⁺ + Cl⁻ = AgCl(s), \(K^\circ = 1/K_s\) grand) et relation d'équivalence avec les coefficients.</li>
      <li><span class="step">Repérage.</span> Indicateur (Mohr : apparition de Ag₂CrO₄ rouge, juste après l'équivalence, en milieu neutre) ou conductimétrie (changement de pente).</li>
      <li><span class="step">Contrôle de l'indicateur.</span> Vérifier que le précipité indicateur apparaît après le précipité titré et calculer l'ion titré restant à cet instant.</li>
    </ol>
    <p><em>Exemple éclair :</em> 20,0 mL d'eau minérale titrés par AgNO₃ à 0,0200 mol·L⁻¹ : virage à 8,5 mL. \([\mathrm{Cl^-}]\) \(= 0{,}0200\times8{,}5/20{,}0\) \(= 8{,}5\times10^{-3}\ \text{mol·L}^{-1}\), soit 0,30 g·L⁻¹ d'ions chlorure.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Choisir le pH d'un traitement par précipitation</strong>
    <ol>
      <li><span class="step">Objectif.</span> Convertir la concentration maximale autorisée (mg·L⁻¹) en mol·L⁻¹, puis en pS.</li>
      <li><span class="step">Courbe.</span> Lire ou calculer le pH à partir duquel la solubilité est inférieure à cet objectif.</li>
      <li><span class="step">Limites.</span> Vérifier qu'un autre métal à conserver ne précipite pas, et qu'un hydroxyde amphotère ne se redissout pas si l'on dépasse le pH.</li>
    </ol>
    <p><em>Exemple éclair :</em> nickel (\(\text{p}K_s(\mathrm{Ni(OH)_2}) = 15{,}2\)), limite 0,5 mg·L⁻¹, soit \(8{,}5\times10^{-6}\ \text{mol·L}^{-1}\) et pS = 5,07. Comme pS = 2 pH − 12,8, il faut pH ≥ 8,9.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : pour Al(OH)₃ ou Zn(OH)₂, « plus de base » ne veut pas dire « mieux » : au-delà du minimum de solubilité, l'hydroxyde se redissout sous forme d'ion aluminate ou zincate.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="pre-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Solubilité du chlorure d'argent</h3>
  <div class="statement">Pour AgCl, \(K_s = 1{,}8\times10^{-10}\) à 25 °C ; \(M(\mathrm{AgCl})\) \(= 143{,}3\ \text{g·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer puis calculer la solubilité \(s\) dans l'eau pure, en mol·L⁻¹ puis en mg·L⁻¹.</div>
  <div class="q"><strong>Q2.</strong> Comment évolue \(s\) si l'on ajoute du chlorure de sodium ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> AgCl(s) = Ag⁺ + Cl⁻ ; dans l'eau pure \([\mathrm{Ag^+}] = [\mathrm{Cl^-}] = s\), donc \(K_s = (s/c^\circ)^2\) et \(s\) \(= c^\circ\sqrt{K_s}\) \(= \sqrt{1{,}8\times10^{-10}}\ \text{mol·L}^{-1}\) \(\approx 1{,}3\times10^{-5}\ \text{mol·L}^{-1}\), soit \(1{,}3\times10^{-5}\times143{,}3\) \(= 1{,}9\times10^{-3}\ \text{g·L}^{-1}\) \(= 1{,}9\ \text{mg·L}^{-1}\).</p>
    <p><strong>Q2.</strong> NaCl apporte des ions Cl⁻ (ion commun) : l'équilibre se déplace vers le solide, la solubilité <strong>diminue</strong>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Précipitation après mélange</h3>
  <div class="statement">On mélange des volumes égaux d'une solution de Ca²⁺ à \(2\times10^{-3}\ \text{mol·L}^{-1}\) et d'une solution de F⁻ à \(2\times10^{-3}\ \text{mol·L}^{-1}\). Pour CaF₂, \(K_s = 4\times10^{-11}\).</div>
  <div class="q"><strong>Q1.</strong> Y a-t-il précipitation de CaF₂ ?</div>
  <div class="q"><strong>Q2.</strong> Dans le mélange, \([\mathrm{Ca^{2+}}]\) \(= 1\times10^{-3}\ \text{mol·L}^{-1}\). À partir de quelle concentration en ions fluorure CaF₂ aurait-il commencé à précipiter ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Après mélange (dilution par 2) : \([\mathrm{Ca^{2+}}]\) \(= [\mathrm{F^-}]\) \(= 1\times10^{-3}\ \text{mol·L}^{-1}\). \(Q\) \(= [\mathrm{Ca^{2+}}][\mathrm{F^-}]^2/(c^\circ)^3\) \(= 10^{-3}\times(10^{-3})^2\) \(= 10^{-9}\). Comme \(Q = 10^{-9} \gt K_s = 4\times10^{-11}\), il y a <strong>précipitation</strong> de CaF₂.</p>
    <p><strong>Q2.</strong> Seuil : \(10^{-3}\times[\mathrm{F^-}]^2\) \(= 4\times10^{-11}\), d'où \([\mathrm{F^-}]\) \(= \sqrt{4\times10^{-8}}\) \(= 2\times10^{-4}\ \text{mol·L}^{-1}\). On était cinq fois au-dessus du seuil.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Solubilité et effet d'ion commun</h3>
  <div class="statement">Le chlorure d'argent AgCl a un produit de solubilité \(K_s = 1{,}8\times10^{-10}\) à 25 °C.</div>
  <p class="exo-part">Partie A — Solubilité dans l'eau pure</p>
  <div class="q"><strong>A1.</strong> Écrire l'équation de dissolution et l'expression de \(K_s\).</div>
  <div class="q"><strong>A2.</strong> Calculer la solubilité \(s\) de AgCl dans l'eau pure.</div>
  <p class="exo-part">Partie B — Effet d'ion commun</p>
  <div class="q"><strong>B1.</strong> Calculer la solubilité \(s'\) dans une solution de NaCl à \(0{,}10\ \text{mol·L}^{-1}\). Commenter.</div>
  <div class="q"><strong>B2.</strong> Même question dans une solution de NaCl à \(1{,}0\times10^{-5}\ \text{mol·L}^{-1}\). Pourquoi la méthode de B1 ne convient-elle plus ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> AgCl(s) = Ag⁺ + Cl⁻, avec \(K_s\) \(= [\mathrm{Ag^+}]\,[\mathrm{Cl^-}]/(c^\circ)^2\) (\(c^\circ = 1\ \text{mol·L}^{-1}\)).</p>
    <p><strong>A2.</strong> Dans l'eau pure, \([\mathrm{Ag^+}] = [\mathrm{Cl^-}] = s\), donc \(K_s = (s/c^\circ)^2\) → \(s = c^\circ\sqrt{K_s}\) \(= \sqrt{1{,}8\times10^{-10}}\ \text{mol·L}^{-1}\) \(\approx 1{,}3\times10^{-5}\ \text{mol·L}^{-1}\).</p>
    <p><strong>B1.</strong> \([\mathrm{Cl^-}]\) \(= 0{,}10 + s' \approx 0{,}10\ \text{mol·L}^{-1}\) : \(s'\) \(= [\mathrm{Ag^+}]\) \(= \dfrac{K_s\,(c^\circ)^2}{[\mathrm{Cl^-}]}\) \(= \dfrac{1{,}8\times10^{-10}}{0{,}10}\) \(= 1{,}8\times10^{-9}\ \text{mol·L}^{-1}\), bien négligeable devant 0,10 (hypothèse vérifiée). La solubilité chute d'un facteur \(7\times10^3\) environ : c'est l'<strong>effet d'ion commun</strong> (l'ajout de Cl⁻ déplace l'équilibre vers le solide).</p>
    <p><strong>B2.</strong> La formule \(s' = K_s/c\) donnerait \(1{,}8\times10^{-5}\ \text{mol·L}^{-1}\), plus que dans l'eau pure : absurde, car \(c = 10^{-5}\) n'est pas grand devant \(s'\). Il faut résoudre \(s'(s' + 10^{-5}) = 1{,}8\times10^{-10}\), soit \(s'^2 + 10^{-5}s' - 1{,}8\times10^{-10}\) \(= 0\) : \(s'\) \(= 9{,}3\times10^{-6}\ \text{mol·L}^{-1}\), un peu moins que \(1{,}3\times10^{-5}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Comparer des solubilités</h3>
  <div class="statement">À 25 °C : \(\text{p}K_s\)(AgCl) = 9,75 ; \(\text{p}K_s\)(Ag₂CrO₄) = 11,95 ; \(\text{p}K_s\)(PbI₂) = 8,0 ; \(\text{p}K_s\)(BaSO₄) = 10,0. Masses molaires (g·mol⁻¹) : AgCl 143,3 ; Ag₂CrO₄ 331,7 ; PbI₂ 461,0 ; BaSO₄ 233,4.</div>
  <div class="q"><strong>Q1.</strong> Classer ces solides par \(K_s\) croissant.</div>
  <div class="q"><strong>Q2.</strong> Calculer leurs solubilités dans l'eau pure (mol·L⁻¹ et mg·L⁻¹) et les classer. Commenter.</div>
  <div class="q"><strong>Q3.</strong> Le sulfate de baryum sert de produit de contraste en radiologie digestive, bien que les ions Ba²⁺ soient toxiques. Pourquoi est-ce possible ? (Le suc gastrique, très acide, ne modifie pas la solubilité : HSO₄⁻/SO₄²⁻ a un \(\text{p}K_a\) de 2,0.)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(K_s\) croissant (\(\text{p}K_s\) décroissant) : Ag₂CrO₄ (\(10^{-11{,}95}\)) &lt; BaSO₄ (\(10^{-10}\)) &lt; AgCl (\(10^{-9{,}75}\)) &lt; PbI₂ (\(10^{-8}\)).</p>
    <p><strong>Q2.</strong> Type AX : \(s = \sqrt{K_s}\) ; type AX₂ ou A₂X : \(s = (K_s/4)^{1/3}\). BaSO₄ : \(1{,}0\times10^{-5}\ \text{mol·L}^{-1}\) (2,3 mg·L⁻¹) ; AgCl : \(1{,}3\times10^{-5}\) (1,9 mg·L⁻¹) ; Ag₂CrO₄ : \(6{,}5\times10^{-5}\) (22 mg·L⁻¹) ; PbI₂ : \(1{,}4\times10^{-3}\) (0,63 g·L⁻¹). En mol·L⁻¹ : BaSO₄ &lt; AgCl &lt; Ag₂CrO₄ &lt; PbI₂. Ag₂CrO₄, qui a le plus petit \(K_s\), n'est pas le moins soluble : la stœchiométrie change la relation entre \(s\) et \(K_s\) (et l'ordre en masse diffère encore, à cause des masses molaires).</p>
    <p><strong>Q3.</strong> La concentration de Ba²⁺ en équilibre avec BaSO₄ ne dépasse pas \(10^{-5}\ \text{mol·L}^{-1}\) (environ 1,4 mg·L⁻¹ de baryum), très en dessous du seuil toxique ; et comme SO₄²⁻ reste majoritaire même à pH 2 (base très faible), l'acidité gastrique n'augmente guère la solubilité.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Équilibre ou dissolution totale : le chlorure de plomb</h3>
  <div class="statement">Le chlorure de plomb PbCl₂ a un \(\text{p}K_s\) de 4,8 à 25 °C ; \(M(\mathrm{PbCl_2})\) \(= 278{,}1\ \text{g·mol}^{-1}\). On travaille avec 100 mL de solution.</div>
  <div class="q"><strong>Q1.</strong> Calculer sa solubilité dans l'eau pure, en mol·L⁻¹ et en g·L⁻¹.</div>
  <div class="q"><strong>Q2.</strong> On introduit 0,20 g puis, dans une autre expérience, 1,0 g de PbCl₂ dans 100 mL d'eau. Décrire l'état final dans chaque cas.</div>
  <div class="q"><strong>Q3.</strong> On remplace l'eau par 100 mL de NaCl à 0,10 mol·L⁻¹. Écrire l'équation vérifiée par la solubilité \(s\), la résoudre numériquement (dichotomie) et comparer à l'approximation \(s \approx K_s/(0{,}10)^2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> PbCl₂(s) = Pb²⁺ + 2 Cl⁻ : \(K_s = 4s^3\), \(s\) \(= (10^{-4{,}8}/4)^{1/3}\) \(= 1{,}58\times10^{-2}\ \text{mol·L}^{-1}\), soit 4,4 g·L⁻¹ : un solide « peu soluble », mais bien plus que AgCl.</p>
    <p><strong>Q2.</strong> 100 mL dissolvent au plus \(1{,}58\times10^{-3}\ \text{mol}\). Avec 0,20 g (\(7{,}2\times10^{-4}\ \text{mol}\)) : tout se dissout, pas d'équilibre de dissolution (\(Q \lt K_s\)), transformation totale. Avec 1,0 g (\(3{,}6\times10^{-3}\ \text{mol}\)) : la solution est saturée et il reste \(2{,}0\times10^{-3}\ \text{mol}\) de solide, soit 0,56 g.</p>
    <p><strong>Q3.</strong> \([\mathrm{Pb^{2+}}] = s\) et \([\mathrm{Cl^-}] = 0{,}10 + 2s\), donc \(s\,(0{,}10 + 2s)^2 = 10^{-4{,}8}\). La fonction \(f(s)\) \(= \ln\left(s(0{,}10 + 2s)^2\right) - \ln K_s\) est croissante et change de signe sur \([10^{-12} ; 0{,}05]\) ; la dichotomie (même fonction que dans le cours, §4) donne \(s\) \(= 1{,}49\times10^{-3}\ \text{mol·L}^{-1}\). L'approximation \(s \approx 10^{-4{,}8}/0{,}010\) \(= 1{,}58\times10^{-3}\) est 6 % trop grande, car \(2s\) n'est pas tout à fait négligeable devant 0,10. Dans les deux cas, la solubilité est divisée par environ 10.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Combinaisons de constantes : convertir et dissoudre des précipités</h3>
  <div class="statement">\(\text{p}K_s\) : AgCl 9,75 ; AgBr 12,3 ; AgI 16,1 ; Mg(OH)₂ 11,2 ; CaCO₃ 8,5. \(\text{p}K_a\) : NH₄⁺/NH₃ 9,2 ; CH₃COOH/CH₃COO⁻ 4,8 ; CO₂,H₂O/HCO₃⁻ 6,4 ; HCO₃⁻/CO₃²⁻ 10,3. \(\text{p}K_e = 14\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les constantes de AgCl(s) + I⁻ = AgI(s) + Cl⁻ et de AgCl(s) + Br⁻ = AgBr(s) + Cl⁻. Qu'observe-t-on si l'on ajoute une solution d'iodure de potassium sur un précipité blanc de AgCl ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la constante de Mg(OH)₂(s) + 2 NH₄⁺ = Mg²⁺ + 2 NH₃ + 2 H₂O. En déduire, par une résolution numérique ou un raisonnement d'ordre de grandeur, la solubilité de Mg(OH)₂ dans une solution de chlorure d'ammonium à 1,0 mol·L⁻¹, et la comparer à celle dans l'eau pure (\(1{,}2\times10^{-4}\ \text{mol·L}^{-1}\)).</div>
  <div class="q"><strong>Q3.</strong> Calculer la constante de CaCO₃(s) + 2 CH₃COOH = Ca²⁺ + 2 CH₃COO⁻ + CO₂,H₂O. Elle est inférieure à 1 ; comment expliquer que le vinaigre dissolve pourtant le calcaire ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Dissolution de AgCl puis précipitation de AgI : \(K^\circ\) \(= K_s(\mathrm{AgCl})/K_s(\mathrm{AgI})\) \(= 10^{16{,}1 - 9{,}75}\) \(= 10^{6{,}35}\) ; de même avec AgBr, \(10^{12{,}3 - 9{,}75} = 10^{2{,}55}\). La première conversion est quasi totale : le précipité blanc jaunit (AgI est jaune). On convertit un précipité en un précipité moins soluble.</p>
    <p><strong>Q2.</strong> Dissolution (\(K_s\)) et deux fois NH₄⁺ + HO⁻ = NH₃ + H₂O (\(K_a/K_e = 10^{4{,}8}\)) : \(K^\circ\) \(= 10^{-11{,}2 + 9{,}6}\) \(= 10^{-1{,}6}\). Avec \(s = [\mathrm{Mg^{2+}}]\), \([\mathrm{NH_3}] = 2s\) et \([\mathrm{NH_4^+}] = 1{,}0 - 2s\) : \(\dfrac{s\,(2s)^2}{(1{,}0 - 2s)^2}\) \(= 10^{-1{,}6}\). La dichotomie donne \(s = 0{,}15\ \text{mol·L}^{-1}\) (en négligeant \(2s\) devant 1, \(4s^3 = 10^{-1{,}6}\) donnerait 0,18). C'est plus de mille fois la solubilité dans l'eau pure : les ions ammonium, acides, consomment les ions hydroxyde libérés.</p>
    <p><strong>Q3.</strong> \(K^\circ\) \(= K_s\,K_a(\mathrm{CH_3COOH})^2/(K_{a1}K_{a2})\) \(= 10^{-8{,}5 - 9{,}6 + 6{,}4 + 10{,}3}\) \(= 10^{-1{,}4}\). Mais le CO₂ formé se dégage (effervescence) : son activité reste faible, \(Q_r\) reste inférieur à \(K^\circ\), et la dissolution se poursuit tant qu'il reste de l'acide. Avec un acide fort (H₃O⁺), la constante est \(10^{8{,}2}\) et l'attaque est bien plus vive.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Séparer des ions métalliques en réglant le pH</h3>
  <div class="statement">Une solution acide contient Fe³⁺, Cu²⁺ et Zn²⁺, chacun à 0,10 mol·L⁻¹. On y ajoute progressivement de la soude concentrée (volume constant). \(\text{p}K_s\) : Fe(OH)₃ 38 ; Cu(OH)₂ 19,7 ; Zn(OH)₂ 16,4 ; \(\text{p}K_e = 14\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le pH d'apparition de chaque hydroxyde et tracer les trois diagrammes d'existence sur un même axe.</div>
  <div class="q"><strong>Q2.</strong> Dans quel intervalle de pH peut-on éliminer le fer sans perdre de cuivre ? Quelle concentration de Fe³⁺ reste-t-il à pH 4,0 ?</div>
  <div class="q"><strong>Q3.</strong> On veut ensuite séparer le cuivre du zinc en se plaçant à pH 6,0. Quelle fraction du cuivre reste en solution ? La séparation est-elle aussi bonne que pour le fer ? Pourquoi ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\text{pOH}\) \(= (\text{p}K_s + \log 0{,}10)/n\) et \(\text{pH} = 14 - \text{pOH}\) : Fe(OH)₃ à pH 1,67 ; Cu(OH)₂ à pH 4,65 ; Zn(OH)₂ à pH 6,3. Sur l'axe des pH, chaque hydroxyde existe à droite de sa frontière, l'ion seul à gauche.</p>
    <p><strong>Q2.</strong> Entre pH 1,67 et 4,65 : le fer précipite, le cuivre reste dissous. À pH 4,0, \([\mathrm{HO^-}] = 10^{-10}\), \([\mathrm{Fe^{3+}}]\) \(= 10^{-38}/(10^{-10})^3\) \(= 1\times10^{-8}\ \text{mol·L}^{-1}\) : il reste 0,000 01 % du fer ; on filtre Fe(OH)₃.</p>
    <p><strong>Q3.</strong> À pH 6,0, \([\mathrm{Cu^{2+}}]\) \(= 10^{-19{,}7}/(10^{-8})^2\) \(= 2{,}0\times10^{-4}\ \text{mol·L}^{-1}\) : 0,2 % du cuivre reste dissous, alors que le zinc ne précipite pas encore (6,0 &lt; 6,3). La séparation est correcte mais bien moins nette que pour le fer, car les deux seuils ne sont séparés que de 1,65 unité de pH (contre 3 pour Fe/Cu) : on ne peut pas monter assez haut pour précipiter tout le cuivre sans commencer à précipiter le zinc.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Exploiter la courbe de solubilité de l'hydroxyde d'aluminium</h3>
  <div class="statement">On utilise la courbe pS = f(pH) de Al(OH)₃ du cours (§7), tracée avec \(\text{p}K_s = 32\) pour Al(OH)₃(s) = Al³⁺ + 3 HO⁻ et la constante \(K = 10\) pour Al(OH)₃(s) + HO⁻ = Al(OH)₄⁻ (ion aluminate) ; \(\text{p}K_e = 14\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la solubilité vaut \(s\) \(= [\mathrm{Al^{3+}}] + [\mathrm{Al(OH)_4^-}]\) \(= \dfrac{K_s}{\omega^3} + K\,\omega\) (en mol·L⁻¹, \(\omega = [\mathrm{HO^-}]\)). Quelles sont les pentes des deux branches de la courbe pS(pH) ?</div>
  <div class="q"><strong>Q2.</strong> Une solution contient \(1{,}0\times10^{-3}\ \text{mol·L}^{-1}\) d'aluminium dissous. Entre quels pH l'hydroxyde existe-t-il ? Vérifier sur la courbe.</div>
  <div class="q"><strong>Q3.</strong> Montrer que la solubilité est minimale pour \(\omega^4 = 3K_s/K\) et calculer le pH correspondant et la solubilité minimale.</div>
  <div class="q"><strong>Q4.</strong> Écrire les réactions de dissolution de Al(OH)₃ par un acide fort et par une base forte. Pourquoi dit-on que Al(OH)₃ est amphotère ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le solide étant présent, \([\mathrm{Al^{3+}}] = K_s/\omega^3\) et \([\mathrm{Al(OH)_4^-}] = K\omega\) ; l'aluminium dissous est la somme. En milieu acide, le premier terme domine : \(\text{pS}\) \(= \text{p}K_s - 3\,\text{p}K_e + 3\,\text{pH}\) \(= 3\,\text{pH} - 10\), pente +3. En milieu basique, le second : \(\text{pS}\) \(= -\log K + \text{pOH}\) \(= 13 - \text{pH}\), pente −1.</p>
    <p><strong>Q2.</strong> Le solide existe tant que \(s \le 1{,}0\times10^{-3}\), soit \(\text{pS} \ge 3\) : \(3\,\text{pH} - 10 \ge 3\) donne \(\text{pH} \ge 4{,}33\), et \(13 - \text{pH} \ge 3\) donne \(\text{pH} \le 10{,}0\). On lit bien la courbe au-dessus de pS = 3 entre ces deux pH.</p>
    <p><strong>Q3.</strong> \(\mathrm{d}s/\mathrm{d}\omega\) \(= -3K_s/\omega^4 + K\) \(= 0\), soit \(\omega^4 = 3K_s/K = 3\times10^{-33}\), \(\omega = 7{,}4\times10^{-9}\), pH = 5,87. Alors \(s\) \(= 9{,}9\times10^{-8}\ \text{mol·L}^{-1}\) (pS ≈ 7,0) : c'est le pH à viser pour éliminer l'aluminium d'une eau (floculation).</p>
    <p><strong>Q4.</strong> Al(OH)₃(s) + 3 H₃O⁺ = Al³⁺ + 6 H₂O (\(K^\circ = K_s/K_e^3 = 10^{10}\)) et Al(OH)₃(s) + HO⁻ = Al(OH)₄⁻ (\(K = 10\)). Il réagit avec les acides comme une base et avec les bases comme un acide : il est amphotère.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Précipitation sélective : séparer Cl⁻ et I⁻</h3>
  <div class="statement">Une solution contient des ions chlorure et iodure, chacun à \(c_0 = 0{,}10\ \text{mol·L}^{-1}\). On y ajoute <strong>progressivement</strong> des ions Ag⁺ (volume supposé constant). Données : \(K_s(\mathrm{AgCl})\) \(= 1{,}8\times10^{-10}\) ; \(K_s(\mathrm{AgI}) = 8{,}5\times10^{-17}\).</div>
  <p class="exo-part">Partie A — Ordre de précipitation</p>
  <div class="q"><strong>A1.</strong> Calculer, pour chaque halogénure, la concentration \([\mathrm{Ag^+}]\) à partir de laquelle il commence à précipiter. Lequel précipite en premier ?</div>
  <div class="q"><strong>A2.</strong> Calculer la concentration résiduelle \([\mathrm{I^-}]\) <strong>au moment où</strong> le second précipité (AgCl) commence à se former.</div>
  <p class="exo-part">Partie B — Qualité de la séparation</p>
  <div class="q"><strong>B1.</strong> Quelle fraction des ions iodure reste-t-il en solution à cet instant ? Conclure sur la possibilité de séparer Cl⁻ et I⁻ par cette méthode.</div>
  <div class="q"><strong>B2.</strong> Quel paramètre rend la séparation d'autant meilleure ? (Indication : comparer les deux \(K_s\).)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Précipitation dès que \(Q = K_s\). Pour I⁻ : \([\mathrm{Ag^+}]_I\) \(= \dfrac{K_s(\mathrm{AgI})}{c_0}\) \(= \dfrac{8{,}5\times10^{-17}}{0{,}10}\) \(= 8{,}5\times10^{-16}\ \text{mol·L}^{-1}\). Pour Cl⁻ : \([\mathrm{Ag^+}]_{Cl}\) \(= \dfrac{K_s(\mathrm{AgCl})}{c_0}\) \(= \dfrac{1{,}8\times10^{-10}}{0{,}10}\) \(= 1{,}8\times10^{-9}\ \text{mol·L}^{-1}\). Comme \([\mathrm{Ag^+}]_I \ll [\mathrm{Ag^+}]_{Cl}\), c'est <strong>AgI qui précipite en premier</strong>.</p>
    <p><strong>A2.</strong> AgCl commence quand \([\mathrm{Ag^+}]\) \(= 1{,}8\times10^{-9}\ \text{mol·L}^{-1}\). À cet instant : \([\mathrm{I^-}]\) \(= \dfrac{K_s(\mathrm{AgI})}{[\mathrm{Ag^+}]}\) \(= \dfrac{8{,}5\times10^{-17}}{1{,}8\times10^{-9}} \approx 4{,}7\times10^{-8}\ \text{mol·L}^{-1}\).</p>
    <p><strong>B1.</strong> Fraction d'iodure restante : \(\dfrac{[\mathrm{I^-}]}{c_0}\) \(= \dfrac{4{,}7\times10^{-8}}{0{,}10} \approx 4{,}7\times10^{-7}\), soit moins de \(10^{-4}\,\%\). Plus de \(99{,}9999\,\%\) des iodures sont précipités <strong>avant</strong> que le moindre chlorure ne précipite : la séparation est <strong>excellente</strong>.</p>
    <p><strong>B2.</strong> C'est l'<strong>écart entre les deux \(K_s\)</strong> (pour des solides de même stœchiométrie et des ions de même concentration) : plus le rapport \(K_s(\mathrm{AgCl})/K_s(\mathrm{AgI}) \approx 2\times10^{6}\) est grand, plus l'écart entre les deux seuils de \([\mathrm{Ag^+}]\) est important, et plus le premier ion est complètement précipité avant le démarrage du second.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Dosage des chlorures d'une saumure par la méthode de Mohr</h3>
  <div class="statement">On dilue 25 fois une saumure de conservation (eau salée), puis on titre \(V_0 = 10{,}0\ \text{mL}\) de la solution diluée par le nitrate d'argent à \(C\) \(= 5{,}00\times10^{-2}\ \text{mol·L}^{-1}\), en présence de quelques gouttes de chromate de potassium (\([\mathrm{CrO_4^{2-}}] \approx 5\times10^{-3}\ \text{mol·L}^{-1}\)). Le précipité rouge brique de Ag₂CrO₄ apparaît pour \(V_E = 12{,}0\ \text{mL}\). Données : \(\text{p}K_s\)(AgCl) = 9,75 ; \(\text{p}K_s\)(Ag₂CrO₄) = 11,95 ; \(M(\mathrm{NaCl})\) \(= 58{,}44\ \text{g·mol}^{-1}\) ; conductivités molaires ioniques (mS·m²·mol⁻¹) : Ag⁺ 6,2 ; NO₃⁻ 7,1 ; Cl⁻ 7,6 ; Na⁺ 5,0.</div>
  <div class="q"><strong>Q1.</strong> Écrire la réaction de titrage, calculer sa constante et en déduire la concentration en chlorure de sodium de la saumure (mol·L⁻¹ et g·L⁻¹).</div>
  <div class="q"><strong>Q2.</strong> Montrer que AgCl précipite avant Ag₂CrO₄, et calculer \([\mathrm{Cl^-}]\) quand Ag₂CrO₄ apparaît. Conclure sur la précision.</div>
  <div class="q"><strong>Q3.</strong> Pourquoi le titrage doit-il être fait en milieu neutre ou faiblement basique ?</div>
  <div class="q"><strong>Q4.</strong> On suit le même titrage par conductimétrie. Prévoir l'allure de la courbe (signe et valeur des pentes).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Ag⁺ + Cl⁻ = AgCl(s), \(K^\circ = 1/K_s = 10^{9{,}75}\) : quasi totale. À l'équivalence \(n(\mathrm{Cl^-}) = n(\mathrm{Ag^+})\) : \([\mathrm{Cl^-}]\) \(= 5{,}00\times10^{-2}\times12{,}0/10{,}0\) \(= 6{,}00\times10^{-2}\ \text{mol·L}^{-1}\) dans la solution diluée, \(1{,}50\ \text{mol·L}^{-1}\) dans la saumure, soit \(1{,}50\times58{,}44\) \(= 88\ \text{g·L}^{-1}\) de NaCl.</p>
    <p><strong>Q2.</strong> Au début, \([\mathrm{Cl^-}] = 6\times10^{-2}\) : AgCl apparaît pour \([\mathrm{Ag^+}]\) \(= 10^{-9{,}75}/0{,}06\) \(= 3\times10^{-9}\ \text{mol·L}^{-1}\), Ag₂CrO₄ seulement pour \([\mathrm{Ag^+}]\) \(= \sqrt{10^{-11{,}95}/(5\times10^{-3})}\) \(= 1{,}5\times10^{-5}\ \text{mol·L}^{-1}\). À ce moment, \([\mathrm{Cl^-}]\) \(= 10^{-9{,}75}/(1{,}5\times10^{-5})\) \(= 1{,}2\times10^{-5}\ \text{mol·L}^{-1}\) : il reste moins de 0,05 % des chlorures, la précision est excellente.</p>
    <p><strong>Q3.</strong> En milieu acide, l'ion chromate est protoné (couple HCrO₄⁻/CrO₄²⁻, \(\text{p}K_a \approx 6{,}5\)) : \([\mathrm{CrO_4^{2-}}]\) chute et Ag₂CrO₄ n'apparaît que bien après l'équivalence. En milieu trop basique, les ions Ag⁺ précipitent avec HO⁻ (oxyde d'argent brun) et sont consommés en dehors de la réaction de titrage.</p>
    <p><strong>Q4.</strong> Avant l'équivalence, chaque Ag⁺ versé fait précipiter un Cl⁻ et apporte un NO₃⁻ : pente \(\lambda(\mathrm{NO_3^-}) - \lambda(\mathrm{Cl^-})\) \(= -0{,}5\ \text{mS·m}^2\text{·mol}^{-1}\), la conductivité (corrigée) baisse à peine. Après, on ajoute Ag⁺ et NO₃⁻ : pente \(+13{,}3\). Le point anguleux donne \(V_E\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Titrage indirect des chlorures (méthode de Charpentier-Volhard)</h3>
  <div class="statement">En milieu acide, la méthode de Mohr est impossible. On ajoute alors à \(V_0 = 20{,}0\ \text{mL}\) de la solution de chlorures \(V_1 = 25{,}0\ \text{mL}\) de nitrate d'argent à \(5{,}00\times10^{-2}\ \text{mol·L}^{-1}\) (en excès), on filtre le précipité, puis on titre les ions Ag⁺ restant dans le filtrat par le thiocyanate de potassium (K⁺ + SCN⁻) à \(4{,}00\times10^{-2}\ \text{mol·L}^{-1}\), en présence d'ions Fe³⁺ : la première goutte de SCN⁻ en excès forme un ion complexe rouge avec Fe³⁺. Le virage a lieu pour \(V_2 = 12{,}5\ \text{mL}\). \(\text{p}K_s\) : AgCl 9,75 ; AgSCN 12,0.</div>
  <div class="q"><strong>Q1.</strong> Écrire les deux réactions de précipitation et calculer leurs constantes.</div>
  <div class="q"><strong>Q2.</strong> Pourquoi ce titrage est-il qualifié d'indirect ? Établir la relation donnant la quantité de chlorure.</div>
  <div class="q"><strong>Q3.</strong> Calculer la concentration en ions chlorure (mol·L⁻¹ et g·L⁻¹, \(M(\mathrm{Cl})\) \(= 35{,}45\ \text{g·mol}^{-1}\)).</div>
  <div class="q"><strong>Q4.</strong> Calculer la constante de AgCl(s) + SCN⁻ = AgSCN(s) + Cl⁻. Pourquoi faut-il filtrer AgCl avant le titrage ? Dans quel sens serait l'erreur sinon ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Ag⁺ + Cl⁻ = AgCl(s), \(K^\circ = 10^{9{,}75}\) ; Ag⁺ + SCN⁻ = AgSCN(s), \(K^\circ = 10^{12{,}0}\). Les deux sont quasi totales.</p>
    <p><strong>Q2.</strong> On ne titre pas les chlorures eux-mêmes mais l'excès d'argent qui n'a pas réagi avec eux (titrage « en retour ») : \(n(\mathrm{Cl^-})\) \(= n_{\text{total}}(\mathrm{Ag^+}) - n_{\text{excès}}(\mathrm{Ag^+})\) \(= C_1V_1 - C_2V_2\).</p>
    <p><strong>Q3.</strong> \(C_1V_1\) \(= 1{,}25\times10^{-3}\ \text{mol}\), \(C_2V_2\) \(= 5{,}00\times10^{-4}\ \text{mol}\), donc \(n(\mathrm{Cl^-})\) \(= 7{,}50\times10^{-4}\ \text{mol}\) et \([\mathrm{Cl^-}]\) \(= 7{,}50\times10^{-4}/0{,}0200\) \(= 3{,}75\times10^{-2}\ \text{mol·L}^{-1}\), soit 1,33 g·L⁻¹.</p>
    <p><strong>Q4.</strong> \(K^\circ\) \(= K_s(\mathrm{AgCl})/K_s(\mathrm{AgSCN})\) \(= 10^{12{,}0 - 9{,}75}\) \(= 10^{2{,}25}\) : AgCl, plus soluble, serait converti en AgSCN par le thiocyanate. Sans filtration, le titrant consommerait aussi de l'argent provenant de AgCl : \(V_2\) serait trop grand, l'excès d'argent surestimé, et la quantité de chlorure <strong>sous-estimée</strong>.</p>
  </div>

  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le magnésium de l'eau de mer</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>dissolution et précipitation : domaines d'existence, précipitation sélective, combinaison de constantes, procédé de séparation, titrage de Mohr, titrage simultané</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une partie du magnésium métallique est produite à partir de l'eau de mer : on fait précipiter l'hydroxyde de magnésium avec de la chaux, on le redissout par l'acide chlorhydrique, puis on électrolyse le chlorure de magnésium obtenu. Eau de mer (on néglige l'effet des autres ions sur les activités) : \([\mathrm{Mg^{2+}}]\) \(= 0{,}053\ \text{mol·L}^{-1}\) ; \([\mathrm{Ca^{2+}}]\) \(= 0{,}010\ \text{mol·L}^{-1}\) ; pH 8,1. Données à 25 °C : \(\text{p}K_s\) : Mg(OH)₂ 11,2 ; Ca(OH)₂ 5,3 ; AgCl 9,75 ; AgBr 12,3 ; Ag₂CrO₄ 11,95 ; \(\text{p}K_e = 14\). Masses molaires (g·mol⁻¹) : Mg 24,3 ; Ca(OH)₂ 74,1 ; Cl 35,45 ; Br 79,9.
  </div>
  <p class="exo-part">Partie A — Faire précipiter l'hydroxyde de magnésium</p>
  <div class="q"><strong>A1.</strong> Vérifier que Mg(OH)₂ ne précipite pas dans l'eau de mer naturelle. À partir de quel pH apparaît-il ?</div>
  <div class="q"><strong>A2.</strong> À quel pH faut-il amener l'eau de mer pour précipiter 99 % du magnésium ?</div>
  <div class="q"><strong>A3.</strong> L'hydroxyde de calcium précipite-t-il à ce pH ? À partir de quel pH le ferait-il ? Conclure sur la séparation du magnésium et du calcium.</div>
  <div class="q"><strong>A4.</strong> On ajoute de la chaux éteinte Ca(OH)₂(s). Calculer le pH d'une solution saturée de chaux, puis la constante de Mg²⁺ + Ca(OH)₂(s) = Mg(OH)₂(s) + Ca²⁺. Pourquoi la chaux convient-elle ? Quelle masse de chaux faut-il par mètre cube d'eau de mer, et quelle masse de magnésium en tire-t-on au mieux ?</div>
  <p class="exo-part">Partie B — Du précipité au chlorure de magnésium</p>
  <div class="q"><strong>B1.</strong> Écrire la réaction de Mg(OH)₂ avec l'acide chlorhydrique, calculer sa constante et la quantité d'acide nécessaire par mètre cube d'eau de mer traitée.</div>
  <div class="q"><strong>B2.</strong> Avant cette étape, le précipité est lavé à l'eau douce. Montrer, en calculant la solubilité de Mg(OH)₂ dans l'eau pure, que la perte de magnésium due à un lavage par 1 m³ d'eau est négligeable.</div>
  <p class="exo-part">Partie C — Dosage des chlorures de l'eau de mer (Mohr)</p>
  <div class="q"><strong>C1.</strong> On dilue l'eau de mer 20 fois et on titre 10,0 mL de la solution diluée par AgNO₃ à \(2{,}00\times10^{-2}\ \text{mol·L}^{-1}\) en présence de chromate ; le virage a lieu pour 13,7 mL. Calculer la concentration en ions chlorure de l'eau de mer (mol·L⁻¹ et g·L⁻¹).</div>
  <div class="q"><strong>C2.</strong> L'eau de mer contient aussi des ions bromure (65 mg·L⁻¹). Dans la solution diluée, lequel de AgCl ou de AgBr commence à précipiter le premier ? Les bromures sont-ils titrés ? Quel est le type de ce titrage, et l'erreur commise en attribuant tout le volume aux chlorures ?</div>
  <div class="q"><strong>C3.</strong> Le pH de l'eau de mer convient-il à la méthode de Mohr ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> À pH 8,1, \([\mathrm{HO^-}] = 10^{-5{,}9}\) : \(Q\) \(= 0{,}053\times10^{-11{,}8}\) \(= 8\times10^{-14} \lt K_s\) \(= 6{,}3\times10^{-12}\), pas de précipité. Apparition : \(\text{pOH}\) \(= (11{,}2 + \log 0{,}053)/2\) \(= 4{,}96\), soit pH 9,04.</p>
    <p><strong>A2.</strong> Il doit rester \(5{,}3\times10^{-4}\ \text{mol·L}^{-1}\) : \(\text{pOH}\) \(= (11{,}2 + \log 5{,}3\times10^{-4})/2\) \(= 3{,}96\), pH 10,04. Gagner deux décades sur \([\mathrm{Mg^{2+}}]\) coûte une unité de pH (exposant 2).</p>
    <p><strong>A3.</strong> À pH 10,04 : \(Q\) \(= 0{,}010\times(10^{-3{,}96})^2\) \(= 1{,}2\times10^{-10}\), très inférieur à \(K_s(\mathrm{Ca(OH)_2}) = 5\times10^{-6}\) : pas de précipité. Ca(OH)₂ n'apparaîtrait qu'à \(\text{pH}\) \(= 14 - (5{,}3 + \log 0{,}010)/2\) \(= 12{,}35\). La séparation est excellente : le calcium reste en solution.</p>
    <p><strong>A4.</strong> Chaux saturée : \(4s^3 = 10^{-5{,}3}\), \(s\) \(= 1{,}08\times10^{-2}\ \text{mol·L}^{-1}\), \([\mathrm{HO^-}] = 2s\), pH 12,3. La réaction est la dissolution de Ca(OH)₂ suivie de la précipitation de Mg(OH)₂ : \(K^\circ\) \(= K_s(\mathrm{Ca(OH)_2})/K_s(\mathrm{Mg(OH)_2})\) \(= 10^{11{,}2 - 5{,}3}\) \(= 10^{5{,}9}\) : quasi totale. La chaux, bien plus soluble que Mg(OH)₂, fournit les ions HO⁻ que Mg²⁺ capte ; elle est aussi bon marché (calcination de coquillages ou de calcaire). Par m³ : 53 mol de Mg²⁺, donc au moins 53 mol de chaux (3,9 kg), pour 53 mol de magnésium (1,29 kg).</p>
    <p><strong>B1.</strong> Mg(OH)₂(s) + 2 H₃O⁺ = Mg²⁺ + 4 H₂O, \(K^\circ = K_s/K_e^2 = 10^{16{,}8}\) : totale. Il faut 2 × 53 = 106 mol de HCl par m³ d'eau de mer traitée.</p>
    <p><strong>B2.</strong> Dans l'eau pure, \(s\) \(= (10^{-11{,}2}/4)^{1/3}\) \(= 1{,}2\times10^{-4}\ \text{mol·L}^{-1}\) : 1 m³ d'eau de lavage dissout au plus 0,12 mol de Mg(OH)₂, soit 0,2 % des 53 mol récupérées. La perte est négligeable.</p>
    <p><strong>C1.</strong> \([\mathrm{Cl^-}]_{\text{dilué}}\) \(= 2{,}00\times10^{-2}\times13{,}7/10{,}0\) \(= 2{,}74\times10^{-2}\ \text{mol·L}^{-1}\), donc \(0{,}548\ \text{mol·L}^{-1}\) dans l'eau de mer, soit 19,4 g·L⁻¹ d'ions chlorure.</p>
    <p><strong>C2.</strong> \([\mathrm{Br^-}]\) \(= 0{,}065/79{,}9\) \(= 8{,}1\times10^{-4}\ \text{mol·L}^{-1}\), \(4{,}1\times10^{-5}\) après dilution. Seuils : AgCl pour \([\mathrm{Ag^+}]\) \(= 10^{-9{,}75}/(2{,}74\times10^{-2})\) \(= 10^{-8{,}19}\), AgBr pour \(10^{-12{,}3}/(4{,}1\times10^{-5})\) \(= 10^{-7{,}91}\) : malgré son \(K_s\) plus petit, AgBr, beaucoup moins concentré, précipite après le début de AgCl ; il précipite ensuite au cours du titrage, bien avant l'équivalence. Les bromures sont donc titrés avec les chlorures : titrage <strong>simultané</strong>, un seul virage donnant \(n(\mathrm{Cl^-}) + n(\mathrm{Br^-})\). Les bromures représentent 0,15 % des halogénures : en attribuant tout aux chlorures, on surestime \([\mathrm{Cl^-}]\) de 0,15 %, bien en dessous de l'incertitude du titrage.</p>
    <p><strong>C3.</strong> Oui : à pH 8,1, le chromate n'est pas protoné (pH &gt; 6,5 + 1) et l'hydroxyde d'argent ne précipite pas encore ; la méthode de Mohr fonctionne entre pH 6,5 et 10 environ.</p>
  </div>
