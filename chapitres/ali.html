<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Parties 2.1 « Stabilité des systèmes linéaires » et 2.2 « Rétroaction » du programme de PT. L'ALI n'est pas une fin en soi : c'est l'outil qui illustre la rétroaction, la stabilité et les non-linéarités (saturation, hystérésis). Les circuits restent simples (lois des mailles et des nœuds, diviseur de tension).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Stabilité</strong> : transposer une fonction de transfert opérationnelle en fonction de transfert harmonique ou en équation différentielle ; étudier la stabilité d'un système d'ordre 1 ou 2 par les signes des coefficients (§2).</li>
        <li><strong>Modèle de l'ALI</strong> : courants de polarisation nuls, résistance de sortie nulle, premier ordre en régime linéaire, saturation ; ordres de grandeur du gain statique et du temps de réponse ; schéma-bloc (§1, §3).</li>
        <li><strong>Stabilité du régime linéaire</strong> et conservation du produit gain-bande passante du non-inverseur (§4, §5).</li>
        <li><strong>Limites</strong> : vitesse de balayage, saturation du courant de sortie ; les détecter (§6).</li>
        <li><strong>ALI idéal en régime linéaire</strong> : rétroaction sur E⁻ ; montages non inverseur, suiveur, inverseur, intégrateur ; impédances d'entrée ; intérêt des filtres de forte impédance d'entrée et faible impédance de sortie (§7, §8).</li>
        <li><strong>Régime saturé</strong> : comparateur simple, génération d'harmoniques ; comparateur à hystérésis, cycle et notion de mémoire (§9).</li>
      </ul>
      <p>Les courants de polarisation et la tension de décalage ne sont pas étudiés.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · L'ALI ET SES DEUX RÉGIMES</div>
  <h2>Présentation de l'amplificateur linéaire intégré</h2>
  <div class="intro">L'ALI (on dit aussi amplificateur opérationnel) est un circuit intégré qui amplifie énormément la différence de potentiel entre ses deux entrées. Utilisé seul, il est presque inexploitable tant son gain est grand ; c'est en le <strong>bouclant</strong> — en renvoyant une partie de la sortie sur une entrée — qu'on obtient des fonctions précises : amplification, filtrage, comparaison.</div>

  <h3>Bornes, alimentation, grandeurs électriques</h3>
  <p>L'ALI possède deux entrées : la borne <strong>non inverseuse</strong> E⁺ (signe +, potentiel \(V^+\)) et la borne <strong>inverseuse</strong> E⁻ (signe −, potentiel \(V^-\)), ainsi qu'une sortie S dont le potentiel \(s\) est repéré par rapport à la masse du montage. Il est alimenté par une source symétrique \(\pm V_{cc}\) (souvent \(\pm 15\ \text{V}\)) dont les bornes, rarement dessinées, fournissent l'énergie délivrée en sortie.</p>

<div class="course-section">
  <div class="sec-num">§2 · STABILITÉ DES SYSTÈMES LINÉAIRES</div>
  <h2>Fonction de transfert, équation différentielle, stabilité</h2>
  <div class="intro">Avant de boucler un amplificateur, il faut savoir reconnaître un système stable. Pour un système linéaire du premier ou du deuxième ordre, la réponse se lit sur les signes des coefficients de son équation différentielle, ou du dénominateur de sa fonction de transfert.</div>
  <div class="def-box">
    <strong>Système linéaire continu et invariant</strong> : sa sortie \(s(t)\) et son entrée \(e(t)\) sont liées par une équation différentielle linéaire à coefficients constants. On lui associe la <strong>fonction de transfert opérationnelle</strong> \(H(p) = N(p)/D(p)\), obtenue en remplaçant chaque dérivation \(\mathrm{d}/\mathrm{d}t\) par une multiplication par \(p\) :
    <div class="formula" data-nom="Transposer une fonction de transfert">$$\frac{\mathrm{d}}{\mathrm{d}t}\ \longleftrightarrow\ p\ \longleftrightarrow\ j\omega$$</div>
    En régime sinusoïdal forcé, \(p = j\omega\) donne la fonction de transfert harmonique \(\underline H(j\omega)\) étudiée en PTSI.
  </div>
  <div class="method-box">
    <strong>Exemple — trois écritures du même filtre RC</strong>
    <ol>
      <li>Équation différentielle (loi des mailles, \(i = C\,\mathrm{d}s/\mathrm{d}t\)) : \(RC\,\dfrac{\mathrm{d}s}{\mathrm{d}t} + s = e\).</li>
      <li>Fonction de transfert opérationnelle : \((RCp + 1)S(p) = E(p)\), soit \(H(p) = \dfrac{1}{1 + RCp}\).</li>
      <li>Fonction de transfert harmonique : \(\underline H(j\omega) = \dfrac{1}{1 + jRC\omega}\) (passe-bas du premier ordre).</li>
    </ol>
    <p>Inversement, \(H(p) = \dfrac{\omega_0^2}{p^2 + (\omega_0/Q)p + \omega_0^2}\) correspond à \(\ddot s + \dfrac{\omega_0}{Q}\dot s + \omega_0^2 s = \omega_0^2 e\).</p>
  </div>
  <div class="def-box">
    <strong>Stabilité.</strong> Un système linéaire est <strong>stable</strong> si son régime libre (solution de l'équation homogène, entrée nulle) tend vers zéro quelles que soient les conditions initiales ; de façon équivalente, toute entrée bornée produit une sortie bornée.
  </div>
  <div class="prop-box">
    <strong>Critère pour les ordres 1 et 2.</strong> Un système d'équation différentielle
    <div class="formula" data-nom="Critère de stabilité (ordres 1 et 2)">$$a_1\dot s+a_0 s=\cdots\qquad\text{ou}\qquad a_2\ddot s+a_1\dot s+a_0 s=\cdots$$</div>
    est stable si et seulement si <strong>tous les coefficients \(a_i\) sont non nuls et de même signe</strong> ; ce sont aussi les coefficients du dénominateur \(D(p)\) de la fonction de transfert. Le numérateur n'intervient pas : la stabilité ne dépend que du régime libre.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi les signes des coefficients suffisent-ils à l'ordre 2 ?</span>
    <div class="content">
      <p>Le régime libre est une combinaison de \(e^{r_1t}\) et \(e^{r_2t}\), où \(r_1\), \(r_2\) sont les racines de \(a_2r^2 + a_1r + a_0 = 0\) (ou de \(t\,e^{rt}\) pour une racine double). Il tend vers 0 si et seulement si les deux racines ont une partie réelle strictement négative. Or \(r_1 + r_2 = -a_1/a_2\) et \(r_1r_2 = a_0/a_2\).</p>
      <p>Racines réelles : toutes deux négatives si et seulement si leur somme est négative et leur produit positif, c'est-à-dire \(a_1/a_2 \gt 0\) et \(a_0/a_2 \gt 0\). Racines complexes conjuguées : partie réelle \(-a_1/(2a_2)\), négative si et seulement si \(a_1/a_2 \gt 0\), et le produit \(|r|^2 = a_0/a_2\) est alors automatiquement positif. Dans les deux cas : coefficients de même signe. À l'ordre 1, la racine unique \(-a_0/a_1\) est négative si et seulement si \(a_0\) et \(a_1\) sont de même signe.</p>
    </div>
  </div>

<figcaption>Régime libre (entrée nulle, condition initiale non nulle) de systèmes du premier ordre (en haut) et du deuxième ordre (en bas). Quand les coefficients de l'équation différentielle sont tous de même signe, le régime libre s'éteint : le système est stable (bleu). Sinon il diverge, de façon monotone ou oscillante (rouge), jusqu'à ce qu'une non-linéarité (saturation) l'arrête.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — un circuit RLC avec une résistance négative</strong>
    <p>Un dipôle actif à base d'ALI se comporte comme une résistance négative \(-R_N\) (\(u = -R_Ni\)). On le place en série avec un circuit RLC.</p>
    <ol>
      <li>Loi des mailles, avec \(i = C\,\mathrm{d}u_C/\mathrm{d}t\) : \(LC\,\ddot u_C + (R - R_N)C\,\dot u_C + u_C = 0\).</li>
      <li>Les coefficients \(LC\) et 1 sont positifs ; le système est stable si \(R \gt R_N\), instable si \(R_N \gt R\) : les oscillations naissent et croissent.</li>
      <li>Pour \(R_N\) légèrement supérieur à \(R\), on obtient un oscillateur quasi sinusoïdal à la pulsation \(1/\sqrt{LC}\), dont l'amplitude est limitée par la saturation de l'ALI (chapitre « Oscillateurs électroniques »).</li>
    </ol>
  </div>
  <div class="notice"><strong>Pourquoi c'est important pour l'ALI</strong> : un ALI réel n'est pas un gain infini instantané mais un système du premier ordre. Selon la borne sur laquelle on réinjecte la sortie, le coefficient de \(s\) dans l'équation du montage change de signe : c'est ce critère qui distingue les montages stables (régime linéaire) des montages instables (saturation, comparateurs), au §4.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MODÈLE LINÉAIRE DU PREMIER ORDRE</div>
  <h2>L'ALI réel en régime linéaire : un passe-bas de très grand gain</h2>
  <div class="intro">Le gain \(\mu_0\) n'est atteint qu'aux très basses fréquences : au-delà de quelques hertz, il décroît. Le modèle du premier ordre rend compte de ce comportement tout en restant simple à manipuler.</div>

  <div class="def-box">
    <strong>Modèle de l'ALI linéaire du premier ordre.</strong>
    <ul style="margin:.4rem 0">
      <li>résistance d'entrée infinie : \(i^+ = i^- = 0\) ;</li>
      <li>résistance de sortie nulle : la sortie se comporte comme une source idéale de tension ;</li>
      <li>en régime linéaire, \(s\) et \(\varepsilon\) sont reliés par une fonction de transfert passe-bas du premier ordre :</li>
    </ul>
    $$\underline{s} = \frac{\mu_0}{1 + j\,\omega/\omega_c}\;\underline{\varepsilon}$$
    soit, en notation de Laplace (\(p \leftrightarrow j\omega\)) :
    $$S(p) = \frac{\mu_0}{1 + \tau p}\,\varepsilon(p), \qquad \tau = \frac{1}{\omega_c}$$
  </div>
  <p>En repassant dans le domaine temporel (\(p \leftrightarrow \mathrm{d}/\mathrm{d}t\)), on obtient l'équation différentielle équivalente, point de départ de toutes les études de stabilité :</p>
  <div class="formula">$$\tau\,\frac{\mathrm{d}s}{\mathrm{d}t} + s = \mu_0\,\varepsilon(t)$$</div>

  <div class="prop-box">
    <strong>Fréquence de transition.</strong> Le module \(\mu_0/\sqrt{1 + (f/f_c)^2}\) vaut 1 pour \(f = f_T\). Comme \(\mu_0 \gg 1\), \(f_T \gg f_c\) et :
    $$f_T \simeq \mu_0\, f_c$$
    C'est le <strong>produit gain × bande passante</strong> de l'ALI seul. Exemple : \(\mu_0 = 2\times10^5\) et \(f_c = 5\ \text{Hz}\) donnent \(f_T = 1\ \text{MHz}\), avec une constante de temps \(\tau = 1/(2\pi f_c) \approx 32\ \text{ms}\).
  </div>
  <div class="notice"><strong>Domaine de validité.</strong> Tout ce qui sort du régime linéaire lui échappe : il ne « sait » pas que la sortie est bornée ni que sa pente est limitée (§6). C'est un modèle « petits signaux », suffisant pour juger de la stabilité et estimer une bande passante ; les imperfections plus fines de l'ALI réel sont hors programme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · RÉTROACTION ET STABILITÉ</div>
  <h2>La borne de rétroaction décide du régime</h2>
  <div class="intro">Boucler l'ALI, c'est réinjecter une fraction de la sortie sur l'une de ses entrées. Selon la borne choisie, la boucle corrige les écarts (rétroaction négative) ou au contraire les amplifie (rétroaction positive).</div>

  <h3>Rétroaction sur la borne inverseuse : montage stable</h3>
  <p>Considérons l'amplificateur non inverseur (schéma au §7) : l'entrée \(e\) est appliquée sur E⁺ et la borne E⁻ est reliée au point milieu d'un pont diviseur \(R_1\) (côté masse), \(R_2\) (côté sortie). Comme \(i^- = 0\), \(V^- = \beta s\) avec \(\beta = R_1/(R_1+R_2)\). Avec le modèle du premier ordre :</p>
  <div class="formula">$$\tau\,\frac{\mathrm{d}s}{\mathrm{d}t} + s = \mu_0\,(e - \beta s)$$
  $$\tau\,\frac{\mathrm{d}s}{\mathrm{d}t} + (1 + \mu_0\beta)\, s = \mu_0\, e$$</div>
  <p>Le régime libre \(s_\ell(t) = A\,e^{-(1+\mu_0\beta)t/\tau}\) tend vers 0 : le montage est <strong>stable</strong>, et le régime forcé est atteint en quelques \(\tau' = \tau/(1+\mu_0\beta)\).</p>

  <h3>Rétroaction sur la borne non inverseuse : divergence</h3>
  <p>Ramenons maintenant la même fraction \(\beta s\) sur E⁺, l'entrée \(e\) attaquant E⁻ (c'est le câblage du comparateur à hystérésis du §9) : \(V^+ = \beta s\), \(V^- = e\), et :</p>
  <div class="formula">$$\tau\,\frac{\mathrm{d}s}{\mathrm{d}t} + (1 - \mu_0\beta)\, s = -\mu_0\, e$$</div>
  <p>Comme \(\mu_0\beta \gg 1\), le coefficient de \(s\) est négatif : le régime libre croît comme \(e^{(\mu_0\beta - 1)t/\tau}\). La moindre fluctuation diverge jusqu'à ce que la sortie atteigne \(+V_{sat}\) ou \(-V_{sat}\) : le montage est <strong>instable</strong> et l'ALI sature.</p>

  <div class="prop-box">
    <strong>Critère de stabilité (rappel).</strong> Un système linéaire de fonction de transfert \(H(p) = N(p)/D(p)\), avec \(D\) de degré 1 ou 2, est stable si et seulement si les coefficients de \(D(p)\) sont tous non nuls et de même signe. Pour un degré supérieur ou égal à 3, cette condition n'est que nécessaire. Version temporelle : toutes les solutions de l'équation homogène tendent vers 0.
  </div>
  <div class="prop-box">
    <strong>Règle pratique.</strong>
    <ul style="margin:.4rem 0">
      <li>aucune rétroaction → <strong>saturation</strong> ;</li>
      <li>rétroaction uniquement sur E⁻ → stable : <strong>régime linéaire</strong> possible (dans les limites du §6) ;</li>
      <li>rétroaction uniquement sur E⁺ → instable : <strong>saturation</strong> ;</li>
      <li>rétroaction sur les deux bornes → pas de conclusion sans calcul : étude avec le modèle du premier ordre.</li>
    </ul>
    Interprétation : si \(s\) augmente accidentellement, une rétroaction sur E⁻ fait croître \(V^-\), donc diminuer \(\varepsilon\) et \(s\) : l'écart est corrigé. Sur E⁺, \(\varepsilon\) augmente avec \(s\) : l'écart s'auto-entretient.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un ALI non bouclé (\(\mu_0 = 2\times10^5\), \(V_{sat} = 13{,}5\ \text{V}\)) reçoit \(V^+ = 1\ \text{mV}\) continu et \(V^- = 0\). Que vaut \(s\) ?</span>
    <div class="content"><p>Le modèle linéaire donnerait \(s = \mu_0\varepsilon = 200\ \text{V}\), impossible : on est hors de la zone linéaire. Comme \(\varepsilon \gt 0\), \(s = +V_{sat} = 13{,}5\ \text{V}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · GAIN, BANDE PASSANTE ET RÉTROACTION</div>
  <h2>Conservation du produit gain × bande passante</h2>
  <div class="intro">La rétroaction négative sacrifie l'énorme gain de l'ALI au profit d'un gain précis, d'une bande passante élargie et d'une réponse plus rapide.</div>

  <h3>Amplificateur non inverseur</h3>
  <p>L'équation du §4 donne la fonction de transfert d'un passe-bas du premier ordre :</p>
  <div class="formula">$$H(p) = \frac{\mu_0}{1 + \mu_0\beta + \tau p} = \frac{H_0}{1 + \tau' p}$$
  $$H_0 = \frac{\mu_0}{1+\mu_0\beta} \simeq \frac{1}{\beta} = 1 + \frac{R_2}{R_1}$$
  $$\omega'_c = \omega_c\,(1 + \mu_0\beta)$$</div>
  <div class="prop-box">
    <strong>Produit gain × bande.</strong> Pour l'amplificateur non inverseur, exactement :
    $$H_0\, f'_c = \mu_0\, f_c = f_T$$
    Ce que l'on gagne en gain, on le perd en bande passante : avec \(f_T = 1\ \text{MHz}\), un gain de 10 laisse passer jusqu'à 100 kHz, un gain de 100 jusqu'à 10 kHz seulement.
  </div>
  <p>Pour l'<strong>inverseur</strong> (§7), le même calcul conduit à \(H_0 = -\mu_0 R_2/(R_1 + R_2 + \mu_0 R_1) \simeq -R_2/R_1\) et \(f'_c = f_c\,[1 + \mu_0 R_1/(R_1+R_2)]\), d'où \(|H_0|\,f'_c = f_T\,R_2/(R_1+R_2)\) : le produit vaut \(f_T\) à un facteur près, très proche de 1 dès que le gain est grand.</p>

  <div class="prop-box">
    <strong>Autres bénéfices de la rétroaction négative.</strong>
    <ul style="margin:.4rem 0">
      <li><strong>Désensibilisation</strong> : \(H_0 \simeq 1/\beta\) ne dépend que des résistances. En différentiant \(H_0 = \mu_0/(1+\mu_0\beta)\) :
      $$\frac{\mathrm{d}H_0}{H_0} = \frac{1}{1+\mu_0\beta}\,\frac{\mathrm{d}\mu_0}{\mu_0}$$
      une dispersion de 50 % sur \(\mu_0\) (courante d'un exemplaire à l'autre) devient négligeable sur \(H_0\).</li>
      <li><strong>Rapidité</strong> : le temps de réponse est divisé par \(1 + \mu_0\beta\) : \(\tau' = \tau/(1 + \mu_0\beta)\).</li>
    </ul>
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Avec des ALI de \(f_T = 3\ \text{MHz}\), faut-il un étage de gain 100 ou deux étages de gain 10 pour amplifier des signaux jusqu'à 100 kHz ?</span>
    <div class="content"><p>Un étage de gain 100 coupe à \(f_T/100 = 30\ \text{kHz}\) : insuffisant. Deux étages de gain 10 coupent chacun à 300 kHz ; en cascade, \(|H| = 100/(1 + f^2/f_1^2)\) vaut \(100/\sqrt2\) pour \(f = f_1\sqrt{\sqrt2 - 1} \approx 0{,}64\,f_1 \approx 190\ \text{kHz}\) : la bande de 100 kHz est respectée.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LIMITES DU FONCTIONNEMENT LINÉAIRE</div>
  <h2>Saturations et vitesse de balayage</h2>
  <div class="intro">Même bouclé sur sa borne inverseuse, l'ALI quitte le régime linéaire dès qu'on lui demande une tension, un courant ou une vitesse de variation qu'il ne peut pas fournir.</div>

  <h3>Saturation en tension</h3>
  <p>La sortie reste bornée : \(|s| \le V_{sat}\). Un amplificateur de gain \(H_0\) écrête donc toute entrée d'amplitude supérieure à \(V_{sat}/|H_0|\) : les sommets du signal de sortie sont aplatis à \(\pm V_{sat}\).</p>

  <h3>Saturation en courant</h3>
  <p>Le courant de sortie est limité : \(|i_s| \le i_{s,max} \approx 20\ \text{mA}\). Ce courant alimente à la fois la charge et le réseau de rétroaction. Si la charge est de trop faible résistance, la sortie est écrêtée à une valeur inférieure à \(V_{sat}\), qui dépend de la charge.</p>

  <h3>Vitesse de balayage (<em>slew rate</em>)</h3>
  <div class="def-box">
    La sortie ne peut pas varier plus vite qu'une valeur limite \(\sigma\), la <strong>vitesse de balayage</strong> :
    $$\left|\frac{\mathrm{d}s}{\mathrm{d}t}\right| \le \sigma$$
  </div>
  <p>Pour une sortie sinusoïdale \(s = S_m\cos(\omega t)\), la pente maximale vaut \(S_m\omega\). Le signal n'est pas déformé si :</p>
  <div class="formula">$$S_m\,\omega \le \sigma \quad\Longleftrightarrow\quad f \le \frac{\sigma}{2\pi S_m}$$</div>
  <p>Au-delà, la sortie devient <strong>triangulaire</strong> (pentes \(\pm\sigma\)) et son amplitude diminue quand \(f\) augmente. Exemple : avec \(\sigma = 0{,}5\ \text{V/}\mu\text{s}\), une sortie de 14 V d'amplitude n'est correcte que jusqu'à \(f \approx 5{,}7\ \text{kHz}\) — bien en dessous de \(f_T\). Pour les signaux de grande amplitude, c'est souvent la limite la plus contraignante.</p>

  <div class="notice"><strong>Signature expérimentale.</strong> En régime linéaire, une entrée sinusoïdale donne une sortie sinusoïdale de même fréquence ; toute autre forme trahit un comportement non linéaire. Écrêtage symétrique à \(\pm V_{sat}\) → saturation en tension ; écrêtage plus bas, qui dépend de la charge → saturation en courant ; sinus devenu triangle → vitesse de balayage.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un ALI de vitesse de balayage \(\sigma = 13\ \text{V/}\mu\text{s}\) doit délivrer un sinus de fréquence 500 kHz. Quelle amplitude de sortie peut-il fournir sans déformation ?</span>
    <div class="content"><p>Il faut \(S_m \le \sigma/(2\pi f)\), avec \(\sigma = 13\times10^6\ \text{V/s}\) et \(f = 5{,}0\times10^5\ \text{Hz}\) : \(S_m \le 4{,}1\ \text{V}\), bien moins que \(V_{sat}\). À haute fréquence, c'est la vitesse de balayage, et non la saturation, qui fixe l'amplitude utile.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ALI IDÉAL EN RÉGIME LINÉAIRE</div>
  <h2>Le modèle de gain infini et les montages de base</h2>
  <div class="intro">Tant que les fréquences restent très inférieures à la bande passante du montage bouclé, on peut faire tendre \(\mu_0\) vers l'infini : le calcul de la relation entrée-sortie devient immédiat.</div>

  <div class="def-box">
    <strong>ALI idéal.</strong> \(i^+ = i^- = 0\), résistance de sortie nulle, \(\mu_0 \to \infty\) (bande passante infinie). En <strong>régime linéaire</strong>, \(s\) restant fini, \(\varepsilon = s/\mu_0 \to 0\) :
    $$V^+ = V^-$$
  </div>
  <div class="notice"><strong>Attention.</strong> \(V^+ = V^-\) suppose acquis le régime linéaire : rétroaction sur E⁻ seule, ou double rétroaction dont la stabilité a été prouvée au premier ordre (§4). Le gain infini efface toute dynamique : ce modèle est muet sur la stabilité comme sur la bande passante. Utilisé sur un montage instable, il calcule sans broncher un point de fonctionnement que la sortie quitte aussitôt pour saturer.</div>

  <h3>Outil : la loi des nœuds en termes de potentiels (Millman)</h3>
  <p>Pour un nœud N relié par des résistances \(R_k\) à des points de potentiels \(V_k\), sans autre courant sortant (c'est le cas d'une entrée d'ALI, puisque \(i^\pm = 0\)) :</p>
  <div class="formula">$$V_N = \frac{\sum_k V_k/R_k}{\sum_k 1/R_k}$$</div>
  <p>Elle se généralise aux impédances complexes (\(1/R_k \to \underline{Y}_k\)). Avec deux branches seulement, on retrouve le pont diviseur de tension.</p>

    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Inverseur</td><td style="padding:.35rem;border:1px solid var(--grid)">\(e\) → \(R_1\) → E⁻ ; \(R_2\) entre E⁻ et S ; E⁺ à la masse</td><td style="padding:.35rem;border:1px solid var(--grid)">\(s = -\dfrac{R_2}{R_1}\,e\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(R_1\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Sommateur inverseur</td><td style="padding:.35rem;border:1px solid var(--grid)">\(e_k\) → \(R_k\) → E⁻ ; \(R\) entre E⁻ et S ; E⁺ à la masse</td><td style="padding:.35rem;border:1px solid var(--grid)">\(s = -R\displaystyle\sum_k \frac{e_k}{R_k}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(R_k\) (entrée \(k\))</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Intégrateur inverseur</td><td style="padding:.35rem;border:1px solid var(--grid)">\(e\) → \(R\) → E⁻ ; \(C\) entre E⁻ et S ; E⁺ à la masse</td><td style="padding:.35rem;border:1px solid var(--grid)">\(RC\,\dfrac{\mathrm{d}s}{\mathrm{d}t} = -e\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(R\)</td></tr>
  </table></div>

  <h3>Démonstrations-clés</h3>
  <ul>
    <li><strong>Non inverseur</strong> : \(V^+ = e\) et \(V^- = R_1 s/(R_1+R_2)\) ; \(V^+ = V^-\) donne \(s = (1 + R_2/R_1)\,e\) : c'est la limite \(\mu_0 \to \infty\) du gain \(H_0 = \mu_0/(1+\mu_0\beta)\) du §5, obtenue ici en une ligne.</li>
    <li><strong>Inverseur</strong> : Millman en E⁻ donne \(V^- = (R_2 e + R_1 s)/(R_1 + R_2)\) ; \(V^- = V^+ = 0\) impose \(s = -(R_2/R_1)\,e\).</li>
    <li><strong>Intégrateur</strong> : le courant \(e/R\) qui arrive en E⁻ (au potentiel nul) charge le condensateur : \(e/R = C\,\mathrm{d}(0 - s)/\mathrm{d}t\).</li>
  </ul>
  <div class="formula">$$\underline{H} = -\frac{1}{jRC\omega}$$
  $$s(t) = s(0) - \frac{1}{RC}\int_0^t e(u)\,\mathrm{d}u$$</div>
  <div class="notice"><strong>Intégrateur réel.</strong> La moindre composante continue parasite (tension de décalage, courant de polarisation) est intégrée elle aussi : la sortie dérive jusqu'à saturer. On place donc une résistance en parallèle sur \(C\) (pseudo-intégrateur, §8). Le dérivateur pur (C en entrée, R en contre-réaction, \(\underline{H} = -jRC\omega\)) amplifie le bruit haute fréquence et tend à osciller : on l'évite en pratique.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Intégrateur \(R = 10\ \text{k}\Omega\), \(C = 100\ \text{nF}\), attaqué par un créneau \(\pm 1\ \text{V}\) de fréquence 1 kHz et de valeur moyenne nulle : forme et amplitude de la sortie ?</span>
    <div class="content"><p>Sur chaque demi-période (0,5 ms), \(e\) est constante : \(s\) varie linéairement de \(\Delta s = (1\ \text{V})(0{,}5\ \text{ms})/RC\) avec \(RC = 1\ \text{ms}\), soit \(\Delta s = 0{,}5\ \text{V}\). La sortie est un <strong>triangle</strong> de 0,5 V crête à crête, décroissant quand \(e \gt 0\) (montage inverseur).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · IMPÉDANCES ET FILTRES ACTIFS</div>
  <h2>Associer des étages sans qu'ils se perturbent</h2>
  <div class="intro">Vu de sa source, un montage se comporte comme une impédance d'entrée ; vu de sa charge, comme un générateur de Thévenin. Ces deux impédances décident si l'on peut enchaîner des étages en multipliant simplement leurs fonctions de transfert.</div>

  <div class="def-box">
    <strong>Impédances d'entrée et de sortie.</strong> L'impédance d'entrée est \(\underline{Z}_e = \underline{e}/\underline{i}_e\), où \(\underline{i}_e\) est le courant absorbé par l'entrée. L'impédance de sortie \(\underline{Z}_s\) est celle du générateur de Thévenin équivalent à la sortie. Pour un montage dont la sortie est celle d'un ALI idéal, \(\underline{Z}_s = 0\) : la tension de sortie ne dépend pas de la charge (tant que \(|i_s| \lt i_{s,max}\)).
  </div>
  <div class="prop-box">
    <strong>Mise en cascade.</strong> Si l'étage 1 (fonction de transfert à vide \(\underline{H}_1\), impédance de sortie \(\underline{Z}_{s1}\)) alimente l'étage 2 (impédance d'entrée \(\underline{Z}_{e2}\)), la tension transmise est réduite par un pont diviseur :
    $$\underline{H} = \underline{H}_1\,\frac{\underline{Z}_{e2}}{\underline{Z}_{e2} + \underline{Z}_{s1}}\,\underline{H}_2$$
    On a \(\underline{H} = \underline{H}_1\underline{H}_2\) si \(|\underline{Z}_{s1}| \ll |\underline{Z}_{e2}|\) — condition automatiquement remplie si l'étage 1 se termine par la sortie d'un ALI.
  </div>

  <h3>Le suiveur, adaptateur d'impédance</h3>
  <p>Gain 1, résistance d'entrée infinie, résistance de sortie nulle : le suiveur ne prélève aucun courant à la source et impose sa tension à la charge. Exemple : deux cellules RC passe-bas identiques (\(x = RC\omega\)) mises directement en cascade, puis séparées par un suiveur :</p>
  <div class="formula">$$\underline{H}_{direct} = \frac{1}{1 - x^2 + 3jx}$$
  $$\underline{H}_{suiveur} = \frac{1}{(1 + jx)^2}$$</div>
  <p>À \(x = 1\), le module vaut \(1/3\) sans suiveur et \(1/2\) avec : la seconde cellule « charge » la première.</p>
  <p>Si l'on ajoute au modèle de l'ALI sa résistance de sortie propre \(R_s\) (quelques dizaines d'ohms), on montre que la rétroaction de l'amplificateur non inverseur la divise par \(1 + \mu_0\beta\) aux basses fréquences : l'hypothèse « sortie idéale » est encore meilleure une fois le montage bouclé.</p>

  <h3>Filtres actifs du premier ordre</h3>
  <p>Le montage inverseur se généralise aux impédances : \(\underline{H} = -\underline{Z}_2/\underline{Z}_1\).</p>
  <ul>
    <li><strong>Passe-bas</strong> (pseudo-intégrateur) : \(R_1\) en entrée, \(R_2\) en parallèle avec \(C\) en contre-réaction ;</li>
    <li><strong>passe-haut</strong> : \(R_1\) en série avec \(C\) en entrée, \(R_2\) en contre-réaction.</li>
  </ul>
  <div class="formula">$$\underline{H}_{PB} = -\frac{R_2}{R_1}\,\frac{1}{1 + jR_2C\omega}$$
  $$\underline{H}_{PH} = -\frac{R_2}{R_1}\,\frac{jR_1C\omega}{1 + jR_1C\omega}$$</div>
  <p>Pulsations de coupure : \(1/(R_2C)\) pour le passe-bas, \(1/(R_1C)\) pour le passe-haut. Le passe-bas se comporte en intégrateur pour \(\omega \gg 1/(R_2C)\) ; le passe-haut en dérivateur pour \(\omega \ll 1/(R_1C)\).</p>
  <div class="prop-box">
    <strong>Atouts des filtres actifs.</strong> Gain réglable (éventuellement supérieur à 1), sortie de faible impédance (cascade sans précaution : la fonction de transfert globale est le produit), pas de bobine encombrante. Limites : alimentation nécessaire, bande passante et vitesse de balayage de l'ALI.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Passe-bas actif avec \(R_1 = 2{,}2\ \text{k}\Omega\), \(R_2 = 22\ \text{k}\Omega\), \(C = 4{,}7\ \text{nF}\) : gain en basse fréquence et fréquence de coupure ?</span>
    <div class="content"><p>Gain BF : \(-R_2/R_1 = -10\), soit 20 dB (déphasage de \(\pi\)). Coupure : \(f_c = 1/(2\pi R_2 C)\), avec \(R_2C = 1{,}03\times10^{-4}\ \text{s}\), soit \(f_c \approx 1{,}5\ \text{kHz}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · RÉGIME SATURÉ : COMPARATEURS</div>
  <h2>Comparateur simple et comparateurs à hystérésis</h2>
  <div class="intro">Sans rétroaction, ou bouclé sur sa borne non inverseuse, l'ALI fonctionne en saturation : sa sortie ne prend que deux valeurs. On exploite ce comportement pour comparer une tension à un ou deux seuils.</div>

  <div class="def-box">
    <strong>ALI idéal en régime saturé.</strong> \(i^+ = i^- = 0\) et
    $$s = +V_{sat} \text{ si } \varepsilon \gt 0, \qquad s = -V_{sat} \text{ si } \varepsilon \lt 0$$
    En général \(V^+ \ne V^-\) : l'égalité des potentiels d'entrée est <strong>fausse</strong> ici.
  </div>

  <h3>Comparateur simple</h3>
  <p>L'ALI non bouclé reçoit le signal \(e\) sur E⁺ et une tension fixe \(E_0\) sur E⁻ : le signe de \(\varepsilon = e - E_0\) suffit à fixer la sortie, \(+V_{sat}\) au-dessus du seuil \(E_0\), \(-V_{sat}\) en dessous. Le montage traduit donc un signal analogique en information binaire (« au-dessus » ou « en dessous »). Un sinus d'amplitude supérieure à \(|E_0|\) devient un signal rectangulaire de même période, d'autant plus longtemps à l'état haut que \(E_0\) est bas. Défaut : si \(e\) est bruitée au voisinage de \(E_0\), la sortie bascule plusieurs fois de suite de manière erratique.</p>

  <h3>Comparateur à hystérésis inverseur</h3>
  <p>L'entrée \(e\) attaque E⁻ ; E⁺ est reliée à la masse par \(R_1\) et à la sortie par \(R_2\), donc \(V^+ = R_1 s/(R_1+R_2)\). La rétroaction sur E⁺ impose la saturation ; on teste les deux états :</p>
  <ul>
    <li>\(s = +V_{sat}\) est possible si \(V^+ \gt V^-\), c'est-à-dire \(e \lt V_0\) ;</li>
    <li>\(s = -V_{sat}\) est possible si \(V^+ \lt V^-\), c'est-à-dire \(e \gt -V_0\) ;</li>
  </ul>
  <div class="formula">$$V_0 = \frac{R_1}{R_1+R_2}\,V_{sat}$$</div>
  <p>Pour \(-V_0 \lt e \lt V_0\), les deux états sont compatibles : la sortie conserve l'état atteint précédemment. C'est l'<strong>effet mémoire</strong>. Le basculement vers \(-V_{sat}\) a lieu quand \(e\) franchit \(+V_0\) en croissant ; le retour vers \(+V_{sat}\), quand \(e\) franchit \(-V_0\) en décroissant.</p>

<figure class="schema" style="max-width:340px">
<svg viewBox="0 0 320 200" role="img" aria-label="Cycle d'hystérésis du comparateur inverseur : la sortie passe de plus V sat à moins V sat en plus V zéro et revient en moins V zéro, parcours dans le sens horaire">
  <line x1="20" y1="100" x2="302" y2="100" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>

  <text x="168" y="16" class="lab-it">s</text>

  <text x="154" y="172" text-anchor="end">−V<tspan dy="3" font-size="9">sat</tspan></text>

<figcaption>Cycle d'hystérésis du comparateur inverseur, parcouru dans le sens horaire : entre −V₀ et +V₀, la sortie dépend du passé.</figcaption>
</figure>

  <h3>Comparateur à hystérésis non inverseur</h3>
  <p>L'entrée \(e\) attaque E⁺ à travers \(R_1\) ; \(R_2\) relie E⁺ à la sortie ; E⁻ est à la masse. Millman en E⁺ : \(V^+ = (R_2 e + R_1 s)/(R_1+R_2)\). Partant de \(s = -V_{sat}\), la sortie bascule à \(+V_{sat}\) quand \(V^+\) devient positif, c'est-à-dire pour \(e = +R_1V_{sat}/R_2\) ; elle revient à \(-V_{sat}\) pour \(e = -R_1V_{sat}/R_2\).</p>
  <div class="formula">$$\text{seuils} : \pm\frac{R_1}{R_2}\,V_{sat}$$</div>
  <p>Le cycle est parcouru dans le sens trigonométrique. Il faut \(R_1 \lt R_2\) pour que les seuils soient inférieurs à \(V_{sat}\). Si E⁻ est portée à une tension de référence \(E_{ref}\) au lieu de la masse, le cycle est décalé : son centre devient \((1 + R_1/R_2)\,E_{ref}\).</p>

  <div class="prop-box">
    <strong>Intérêt de l'hystérésis.</strong> Tant que le bruit crête à crête superposé à \(e\) reste inférieur à l'écart entre les deux seuils, la sortie ne bascule qu'une fois à chaque franchissement : détection robuste, pas de « rebonds ». Le comparateur à hystérésis est aussi la brique de base des oscillateurs de relaxation (voir le chapitre « Oscillateurs électroniques »).
  </div>
  <div class="notice"><strong>Rapidité.</strong> Un basculement fait varier la sortie de \(2V_{sat}\) : il dure au moins \(2V_{sat}/\sigma\), soit environ 2 µs pour \(V_{sat} = 13\ \text{V}\) et \(\sigma = 13\ \text{V/}\mu\text{s}\).</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Comparateur inverseur avec \(R_1 = 10\ \text{k}\Omega\), \(R_2 = 47\ \text{k}\Omega\), \(V_{sat} = 14\ \text{V}\), attaqué par un sinus de 5 V d'amplitude : seuils et allure de \(s(t)\) ?</span>
    <div class="content"><p>\(V_0 = 14\times 10/57 \approx 2{,}5\ \text{V}\). La sortie est un créneau \(\pm 14\ \text{V}\) de même fréquence que \(e\) : elle passe à \(-V_{sat}\) quand \(e\) monte au-delà de 2,5 V, et à \(+V_{sat}\) quand \(e\) redescend sous −2,5 V. Le créneau est donc en retard sur celui que donnerait un comparateur inverseur sans hystérésis (seuil nul) : de \(\arcsin(2{,}5/5) = \pi/6\) environ, soit un douzième de période.</p></div>
  </div>
</div>

</template>
<template class="pan-tpl" data-panneau="ali-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ALI ET RÉTROACTION</div>
  <h2>Stratégies pour les exercices</h2>

  <div class="method-box">
    <strong>Méthode 1 — Choisir le modèle de l'ALI</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Se demander</span> si la grandeur cherchée dépend de la dynamique de l'ALI (de sa « lenteur »).</li>
      <li><span class="step">Non → ALI idéal</span> : relation entrée-sortie à basse fréquence, seuils d'un comparateur. On utilise \(i^\pm = 0\), puis \(V^+ = V^-\) si le régime linéaire est acquis, \(s = \pm V_{sat}\) sinon.</li>
      <li><span class="step">Oui → premier ordre</span> : stabilité d'une double rétroaction, fréquence de coupure, temps de réponse, écart dû au gain fini.</li>
      <li><span class="step">Indice</span> : un énoncé qui fournit \(\mu_0\) et \(f_c\) (ou \(\tau\)) attend en général le premier ordre au moins dans une question.</li>
      <li><span class="step">Contrôle final</span> : fréquence très inférieure à \(f'_c\), aucune limite du §5 atteinte (méthode 6).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Linéaire ou saturé ? Lecture du schéma</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Suivre la sortie S</span> : vers quelle(s) borne(s) d'entrée revient-elle (résistance, condensateur, fil) ?</li>
      <li><span class="step">Retour vers E⁻ seulement</span> → régime linéaire attendu : on écrira \(V^+ = V^-\), sous réserve des limites du §5.</li>
      <li><span class="step">Aucun retour, ou retour vers E⁺ seulement</span> → deux états possibles, \(s = \pm V_{sat}\), départagés par le signe de \(\varepsilon\).</li>
      <li><span class="step">Retours vers les deux bornes</span> → pas de verdict à vue : méthode 3.</li>
    </ol>
    <p style="margin:.4rem 0 0"><strong>Rédaction</strong> : une phrase suffit (« rétroaction sur E⁻ seule : régime linéaire ») ; une démonstration n'est due que si la question porte explicitement sur la stabilité.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Trancher la stabilité au premier ordre</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Écrire l'écart</span> \(\varepsilon\) comme combinaison de \(e\) et \(s\), en utilisant \(i^\pm = 0\) (pont diviseur, Millman) : \(\varepsilon = a\,e - b\,s\). Pour un retour \(\alpha s\) sur E⁺ et \(\beta s\) sur E⁻, \(b = \beta - \alpha\).</li>
      <li><span class="step">Injecter</span> dans \(\tau\,\mathrm{d}s/\mathrm{d}t + s = \mu_0\varepsilon\) : \(\tau\,\mathrm{d}s/\mathrm{d}t + (1 + \mu_0 b)\,s = \mu_0 a\, e\). Si les réseaux contiennent des condensateurs, travailler plutôt avec \(S(p)\) et identifier le dénominateur de \(S/E\).</li>
      <li><span class="step">Lire les signes</span> des coefficients de l'équation homogène (ou du dénominateur) : tous de même signe → stable (ordre 1 ou 2) ; un signe discordant → instable, la sortie sature.</li>
      <li><span class="step">N'approcher qu'à la fin</span> : avec \(\mu_0 \gg 1\), le « 1 » devant \(\mu_0 b\) est négligeable, mais c'est le signe de \(b\) qui décide de tout.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Relation entrée-sortie d'un montage linéaire (ALI idéal)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Préalable</span> : régime linéaire établi (méthode 2 ou 3) ; sans lui, \(V^+ = V^-\) n'a aucun sens.</li>
      <li><span class="step">Traiter les nœuds E⁺ et E⁻</span> : comme \(i^\pm = 0\), aucun courant ne s'en échappe vers l'ALI ; Millman s'y applique directement (pont diviseur s'il n'y a que deux branches).</li>
      <li><span class="step">Raccourci</span> : si l'une des entrées est à la masse, l'autre est une masse virtuelle ; une loi des nœuds en courants sur cette borne (courant arrivant = courant dans la contre-réaction) est souvent la voie la plus rapide.</li>
      <li><span class="step">Égaler les deux potentiels</span> et résoudre pour \(s\) (ou pour \(\underline{H}\) en complexe).</li>
      <li><span class="step">Contrôler</span> : cas limites (résistance nulle ou infinie, \(\omega \to 0\) et \(\omega \to \infty\)), homogénéité, signe.</li>
    </ol>
    <p style="margin:.4rem 0 0"><strong>Pièges</strong> : le pont diviseur n'est valable que si aucun courant n'est prélevé au point milieu (vrai sur une entrée d'ALI) ; ne jamais écrire de loi des nœuds sur l'ALI lui-même.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Filtres actifs et mise en cascade</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Comportement asymptotique sans calcul</span> : condensateur = interrupteur ouvert en BF, fil en HF ; en déduire la nature du filtre.</li>
      <li><span class="step">Fonction de transfert</span> : pour un inverseur généralisé, \(\underline{H} = -\underline{Z}_2/\underline{Z}_1\) ; sinon méthode 4 avec les impédances complexes.</li>
      <li><span class="step">Forme canonique</span> : identifier gain, pulsation(s) de coupure, puis tracer le Bode asymptotique.</li>
      <li><span class="step">Cascade</span> : vérifier que chaque étage se termine par une sortie d'ALI (\(Z_s = 0\)) avant d'écrire \(\underline{H} = \underline{H}_1\underline{H}_2\) ; sinon, intercaler un suiveur ou tenir compte du pont diviseur \(Z_{e2}/(Z_{e2}+Z_{s1})\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Vérifier les limites du régime linéaire</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Tension</span> : amplitude de sortie \(\lt V_{sat}\).</li>
      <li><span class="step">Courant</span> : additionner le courant dans la charge et celui dans le réseau de rétroaction ; total \(\lt i_{s,max}\).</li>
      <li><span class="step">Vitesse de balayage</span> : \(S_m\omega \lt \sigma\) pour un sinus ; pour un créneau, temps de montée \(\approx \Delta s/\sigma\).</li>
      <li><span class="step">Bande passante</span> : \(f \ll f'_c = f_T/|H_0|\) (environ).</li>
      <li><span class="step">Interpréter un oscillogramme</span> : écrêtage symétrique → tension ; écrêtage dépendant de la charge → courant ; triangle → vitesse de balayage.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Seuils et cycle d'un comparateur (ALI idéal saturé)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Exprimer l'écart</span> \(\varepsilon\) en fonction de \(e\) et \(s\) (Millman en E⁺ et en E⁻) : pour chaque valeur de \(s\), c'est une fonction affine de \(e\).</li>
      <li><span class="step">Un seuil par état</span> : la sortie change d'état quand \(\varepsilon\) change de signe ; résoudre \(\varepsilon = 0\) avec \(s = +V_{sat}\), puis avec \(s = -V_{sat}\).</li>
      <li><span class="step">Associer seuil et état</span> : l'état \(+V_{sat}\) dure tant que \(\varepsilon \gt 0\), l'état \(-V_{sat}\) tant que \(\varepsilon \lt 0\) ; en déduire de quel côté de chaque seuil chaque état existe.</li>
      <li><span class="step">Dessiner la caractéristique</span> \(s(e)\) : deux paliers, deux traits verticaux aux seuils, flèches de parcours. Si les deux paliers se recouvrent, il y a hystérésis.</li>
      <li><span class="step">Chronogramme</span> : partir de l'état initial et ne basculer qu'au moment où \(e(t)\) atteint le seuil propre à l'état en cours.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Écrire \(V^+ = V^-\) pour un comparateur : faux en régime saturé.</li>
      <li>Conclure à la stabilité avec le modèle idéal : impossible, il faut le premier ordre.</li>
      <li>Oublier le courant absorbé par le réseau de rétroaction dans le bilan de courant de sortie.</li>
      <li>Confondre la bande passante de l'ALI seul (\(f_c\), de 1 à 100 Hz environ) et celle du montage bouclé (\(f_T/|H_0|\)).</li>
      <li>Mettre deux étages passifs en cascade en multipliant leurs fonctions de transfert à vide.</li>
      <li>Sens de parcours d'un cycle d'hystérésis : horaire pour l'inverseur, trigonométrique pour le non-inverseur.</li>
    </ul>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Préamplificateur pour capteur de température</h3>
  <div class="statement">Un capteur délivre une tension \(e\) proportionnelle à la température : de 0 à 50 mV entre 0 et 100 °C. Il se comporte comme une source de tension \(e\) de résistance interne \(R_g = 5{,}0\ \text{k}\Omega\). On veut transmettre à un convertisseur analogique-numérique (CAN), de résistance d'entrée \(R_c = 10\ \text{k}\Omega\), une tension allant de 0 à 5,0 V. L'ALI disponible a pour caractéristiques \(V_{sat} = 13{,}5\ \text{V}\), \(i_{s,max} = 20\ \text{mA}\), \(f_T = 1{,}0\ \text{MHz}\).</div>
  <div class="q"><strong>Q1.</strong> On relie d'abord le capteur directement au CAN. Quelle tension celui-ci reçoit-il pour \(e = 50\ \text{mV}\) ? Conclure.</div>
  <div class="q"><strong>Q2.</strong> On intercale un amplificateur non inverseur (\(R_1\) entre E⁻ et la masse, \(R_2\) entre E⁻ et la sortie). Justifier le régime linéaire, exprimer le gain et choisir \(R_2\) pour \(R_1 = 1{,}0\ \text{k}\Omega\). Pourquoi \(R_g\) n'intervient-elle plus ?</div>
  <div class="q"><strong>Q3.</strong> Un camarade propose plutôt un inverseur (\(R_1 = 1{,}0\ \text{k}\Omega\), \(R_2 = 100\ \text{k}\Omega\)). Exprimer \(s\) en fonction de \(e\) en tenant compte de \(R_g\). Qu'en penser ?</div>
  <div class="q"><strong>Q4.</strong> Pour le montage de Q2 et \(e = 50\ \text{mV}\), vérifier que l'ALI reste en régime linéaire et estimer la bande passante.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pont diviseur \(R_g\) – \(R_c\) : \(u = e\,R_c/(R_c + R_g) = 50\times 10/15 \approx 33\ \text{mV}\). La mesure est faussée d'un tiers et dépend de \(R_g\), qui peut varier ; de plus, 33 mV ne permet d'utiliser qu'une infime partie de la plage du CAN.</p>
    <p><strong>Q2.</strong> Rétroaction sur E⁻ seulement : régime linéaire, donc \(V^+ = V^-\). Comme \(i^+ = 0\), aucun courant ne traverse \(R_g\) : \(V^+ = e\) exactement. Avec \(V^- = R_1 s/(R_1+R_2)\), on obtient \(s = (1 + R_2/R_1)\,e\). Il faut un gain de 100, d'où \(R_2 = 99\ \text{k}\Omega\). La résistance d'entrée infinie du montage rend le résultat indépendant de \(R_g\).</p>
    <p><strong>Q3.</strong> \(R_g\) se trouve en série avec \(R_1\) : \(s = -\dfrac{R_2}{R_1 + R_g}\,e = -\dfrac{100}{6{,}0}\,e \approx -17\,e\). Le gain est trop faible, de signe négatif, et surtout il dépend de \(R_g\) : la résistance d'entrée de l'inverseur (\(R_1\)) n'est pas assez grande devant celle de la source. Le non-inverseur est le bon choix.</p>
    <p><strong>Q4.</strong> \(s = 5{,}0\ \text{V} \lt V_{sat}\). Courant de sortie : \(i_s = s/R_c + s/(R_1+R_2)\), soit \(0{,}50 + 0{,}050 = 0{,}55\ \text{mA}\), très inférieur à 20 mA. Bande passante : \(f'_c = f_T/H_0 = 10\ \text{kHz}\), très supérieure aux fréquences d'un signal de température (bien inférieures au hertz).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Convertisseur numérique-analogique à résistances pondérées</h3>
  <div class="statement">Un nombre binaire de 3 bits \(b_2b_1b_0\) commande trois interrupteurs : chacun relie une résistance soit à \(E = 5{,}0\ \text{V}\) (bit égal à 1), soit à la masse (bit nul). Les résistances \(R\) (bit \(b_2\)), \(2R\) (bit \(b_1\)) et \(4R\) (bit \(b_0\)) aboutissent toutes à la borne E⁻ d'un ALI idéal ; une résistance \(R_f\) relie E⁻ à la sortie ; E⁺ est à la masse. On prend \(R = 10\ \text{k}\Omega\) et on note \(N = 4b_2 + 2b_1 + b_0\).</div>
  <div class="q"><strong>Q1.</strong> Préciser le régime de fonctionnement et la valeur de \(V^-\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer le courant dans chaque résistance d'entrée, puis \(s\) en fonction de \(N\).</div>
  <div class="q"><strong>Q3.</strong> Choisir \(R_f\) pour que le pas de conversion vaille 0,50 V en valeur absolue. Donner \(s\) pour \(N = 5\) et \(N = 7\).</div>
  <div class="q"><strong>Q4.</strong> Pourquoi les trois entrées n'interagissent-elles pas ? Comment obtenir une tension de sortie positive ?</div>
  <div class="q"><strong>Q5.</strong> Sur le même principe, un convertisseur 8 bits demanderait quel rapport entre la plus grande et la plus petite résistance ? Quel problème cela pose-t-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rétroaction sur E⁻ seulement : régime linéaire, \(V^- = V^+ = 0\) (masse virtuelle).</p>
    <p><strong>Q2.</strong> Chaque résistance a une extrémité à \(b_kE\) et l'autre à 0 V : \(i_2 = b_2E/R\), \(i_1 = b_1E/(2R)\), \(i_0 = b_0E/(4R)\). Comme \(i^- = 0\), la somme traverse \(R_f\) : \(0 - s = R_f\,(i_2 + i_1 + i_0)\), d'où</p>
    <div class="formula">$$s = -\frac{R_f\,E}{4R}\,(4b_2 + 2b_1 + b_0)$$
    $$s = -\frac{R_f\,E}{4R}\,N$$</div>
    <p><strong>Q3.</strong> \(R_fE/(4R) = 0{,}50\ \text{V}\) donne \(R_f = 0{,}40\,R = 4{,}0\ \text{k}\Omega\). Pour \(N = 5\) : \(s = -2{,}5\ \text{V}\) ; pour \(N = 7\) : \(s = -3{,}5\ \text{V}\) (valeur maximale, bien inférieure à \(V_{sat}\)).</p>
    <p><strong>Q4.</strong> La borne E⁻ reste à 0 V quel que soit l'état des bits : chaque courant ne dépend que de son propre bit, les contributions s'ajoutent sans interférer. Pour changer le signe, on fait suivre d'un inverseur de gain −1 (deux résistances égales) : \(s' = +0{,}50\,N\) (en volts).</p>
    <p><strong>Q5.</strong> Les résistances vont de \(R\) à \(2^7R = 128\,R\). La résistance du bit de poids fort doit être précise à mieux qu'un demi-pas, soit environ \(1/2^8 \approx 0{,}4\ \%\), et il faut fabriquer des valeurs très dispersées avec la même précision relative : c'est difficile à intégrer. On lui préfère le réseau R-2R, qui n'utilise que deux valeurs de résistance.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Double rétroaction : gain réglable et stabilité</h3>
  <div class="statement">L'entrée \(e\) est reliée à E⁻ par \(R_1 = 10\ \text{k}\Omega\) ; \(R_2 = 40\ \text{k}\Omega\) relie E⁻ à la sortie. La borne E⁺ est reliée au point milieu d'un pont diviseur placé entre la sortie et la masse, de sorte que \(V^+ = \alpha s\) avec \(0 \le \alpha \lt 1\) réglable. On pose \(\beta = R_1/(R_1+R_2)\) et \(\gamma = R_2/(R_1+R_2)\). L'ALI suit le modèle du premier ordre avec \(\mu_0 = 2{,}0\times10^5\) et \(f_c = 5{,}0\ \text{Hz}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(V^-\) en fonction de \(e\) et \(s\).</div>
  <div class="q"><strong>Q2.</strong> Établir l'équation différentielle reliant \(s\) et \(e\). En déduire la condition de stabilité portant sur \(\alpha\).</div>
  <div class="q"><strong>Q3.</strong> Dans le cas stable, avec \(\mu_0(\beta - \alpha) \gg 1\), exprimer le gain statique \(H_0\) ; le retrouver avec le modèle idéal. Valeurs pour \(\alpha = 0\) et \(\alpha = 0{,}15\).</div>
  <div class="q"><strong>Q4.</strong> Exprimer la fréquence de coupure \(f'_c\) du montage. Montrer que \(|H_0|\,f'_c\) ne dépend pas de \(\alpha\). Calculer \(f'_c\) pour \(\alpha = 0{,}15\).</div>
  <div class="q"><strong>Q5.</strong> Pour \(\alpha = 0{,}15\), la tolérance des résistances rend \(\alpha\) incertain à \(\pm 0{,}0015\) près. Quelle incertitude relative en résulte sur \(H_0\) ? Que se passe-t-il pour \(\alpha = 0{,}25\), et pourquoi le modèle idéal ne le prévoit-il pas ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Millman en E⁻ (\(i^- = 0\)) : \(V^- = \dfrac{R_2 e + R_1 s}{R_1 + R_2} = \gamma e + \beta s\).</p>
    <p><strong>Q2.</strong> \(\varepsilon = V^+ - V^- = (\alpha - \beta)s - \gamma e\). En reportant dans \(\tau\,\mathrm{d}s/\mathrm{d}t + s = \mu_0\varepsilon\) :</p>
    <div class="formula">$$\tau\,\frac{\mathrm{d}s}{\mathrm{d}t} + \left[1 + \mu_0(\beta - \alpha)\right] s = -\mu_0\gamma\, e$$</div>
    <p>Stable si et seulement si \(1 + \mu_0(\beta - \alpha) \gt 0\), soit \(\alpha \lt \beta + 1/\mu_0 \simeq \beta = 0{,}20\) : la rétroaction négative doit l'emporter sur la positive.</p>
    <p><strong>Q3.</strong> En régime permanent : \(H_0 = -\dfrac{\mu_0\gamma}{1 + \mu_0(\beta - \alpha)} \simeq -\dfrac{\gamma}{\beta - \alpha}\). Modèle idéal : \(V^+ = V^-\) donne \(\alpha s = \gamma e + \beta s\), même résultat. Pour \(\alpha = 0\) : \(H_0 = -0{,}8/0{,}2 = -4 = -R_2/R_1\) (inverseur classique). Pour \(\alpha = 0{,}15\) : \(H_0 = -0{,}8/0{,}05 = -16\).</p>
    <p><strong>Q4.</strong> La constante de temps est \(\tau' = \tau/[1 + \mu_0(\beta - \alpha)]\), donc \(f'_c = f_c\,[1 + \mu_0(\beta-\alpha)]\). Le produit vaut exactement \(|H_0|\,f'_c = \mu_0\gamma f_c = 0{,}8\ \text{MHz}\), indépendant de \(\alpha\). Pour \(\alpha = 0{,}15\) : \(f'_c = 5{,}0\times(1 + 2{,}0\times10^5\times0{,}05) \approx 50\ \text{kHz}\) (contre 200 kHz pour \(\alpha = 0\)) : le gain supplémentaire se paie en bande passante.</p>
    <p><strong>Q5.</strong> \(|\Delta H_0/H_0| = \Delta\alpha/(\beta - \alpha) = 0{,}0015/0{,}05 = 3\ \%\) : plus \(\alpha\) approche \(\beta\), plus le gain devient sensible aux tolérances. Pour \(\alpha = 0{,}25 \gt \beta\), le coefficient de \(s\) devient négatif : le montage est instable et la sortie sature à \(\pm V_{sat}\). Le modèle idéal, lui, fournit sans sourciller \(H_0 = -0{,}8/(-0{,}05) = +16\) : en supposant \(\varepsilon = 0\), il postule le régime linéaire au lieu de le vérifier, et décrit un point de fonctionnement que la moindre perturbation fait quitter.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Les trois limites de l'ALI sur un même montage</h3>
  <div class="statement">Un amplificateur non inverseur est réalisé avec \(R_1 = 1{,}0\ \text{k}\Omega\) (entre E⁻ et la masse) et \(R_2 = 3{,}0\ \text{k}\Omega\) (entre E⁻ et la sortie). Données de l'ALI : \(V_{sat} = 13{,}5\ \text{V}\), \(i_{s,max} = 20\ \text{mA}\), \(\sigma = 0{,}50\ \text{V/}\mu\text{s}\), \(f_T = 1{,}0\ \text{MHz}\). On applique \(e(t) = E_m\cos(2\pi f t)\).</div>
  <div class="q"><strong>Q1.</strong> Gain \(H_0\) et bande passante du montage ?</div>
  <div class="q"><strong>Q2.</strong> Jusqu'à quelle amplitude \(E_m\) la sortie échappe-t-elle à la saturation en tension ?</div>
  <div class="q"><strong>Q3.</strong> Désormais \(E_m = 1{,}5\ \text{V}\). Quelle est la fréquence maximale pour laquelle la sortie reste sinusoïdale ? Allure et amplitude de la sortie à \(f = 40\ \text{kHz}\) ? Comparer à la limite imposée par la bande passante.</div>
  <div class="q"><strong>Q4.</strong> À basse fréquence, toujours avec \(E_m = 1{,}5\ \text{V}\), on charge la sortie par une résistance \(R_u\). En dessous de quelle valeur de \(R_u\) l'ALI sature-t-il en courant ? Prévoir le niveau d'écrêtage pour \(R_u = 120\ \Omega\).</div>
  <div class="q"><strong>Q5.</strong> Quelles observations à l'oscilloscope permettent d'attribuer une déformation à l'une de ces trois causes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(H_0 = 1 + R_2/R_1 = 4{,}0\). Conservation du produit gain × bande : \(f'_c = f_T/H_0 = 250\ \text{kHz}\).</p>
    <p><strong>Q2.</strong> Il faut \(H_0E_m \lt V_{sat}\), soit \(E_m \lt 13{,}5/4{,}0 \approx 3{,}4\ \text{V}\).</p>
    <p><strong>Q3.</strong> Amplitude de sortie \(S_m = H_0E_m = 6{,}0\ \text{V}\). La pente maximale \(2\pi f S_m\) ne doit pas dépasser \(\sigma\) : \(f \le 0{,}50\times10^6/(2\pi\times6{,}0) \approx 13\ \text{kHz}\). À 40 kHz, la sortie ne suit plus : elle devient triangulaire, de pentes \(\pm\sigma\). En une demi-période \(T/2\), elle varie de \(\sigma T/2\), d'où une amplitude \(\sigma/(4f) = 0{,}50\times10^6/(1{,}6\times10^5) \approx 3{,}1\ \text{V}\) au lieu de 6,0 V. La vitesse de balayage (13 kHz) est ici bien plus contraignante que la bande passante (250 kHz).</p>
    <p><strong>Q4.</strong> L'ALI alimente à la fois \(R_u\) et le pont \(R_1 + R_2 = 4{,}0\ \text{k}\Omega\) : \(i_s = s/R_u + s/(R_1+R_2)\). Au sommet (\(s = 6{,}0\ \text{V}\)), le pont absorbe 1,5 mA ; il reste 18,5 mA pour la charge, d'où \(R_u \ge 6{,}0/0{,}0185 \approx 0{,}32\ \text{k}\Omega\). Avec \(R_u = 120\ \Omega\), le courant plafonne à 20 mA dans \(R_u /\!/ (R_1+R_2) \approx 117\ \Omega\) : la sortie est écrêtée vers \(\pm 2{,}3\ \text{V}\), très en dessous de \(V_{sat}\).</p>
    <p><strong>Q5.</strong> Saturation en tension : sommets aplatis à \(\pm 13{,}5\ \text{V}\), indépendamment de la charge et de la fréquence. Saturation en courant : écrêtage à un niveau plus bas, qui varie avec \(R_u\). Vitesse de balayage : sortie triangulaire, apparaissant quand la fréquence augmente, d'amplitude décroissante.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Filtre passe-bande de la bande téléphonique</h3>
  <div class="statement">On veut ne garder d'un signal de microphone que la bande 300 Hz – 3,4 kHz environ. On enchaîne deux étages à ALI idéaux :
    <ul style="margin:.4rem 0">
      <li>étage 1 : entrée par \(C_1 = 47\ \text{nF}\) en série avec \(R_1 = 10\ \text{k}\Omega\) vers E⁻ ; \(R_2 = 22\ \text{k}\Omega\) entre E⁻ et la sortie ; E⁺ à la masse ;</li>
      <li>étage 2 : entrée par \(R_3 = 10\ \text{k}\Omega\) vers E⁻ ; \(R_4 = 47\ \text{k}\Omega\) en parallèle avec \(C_2 = 1{,}0\ \text{nF}\) entre E⁻ et la sortie ; E⁺ à la masse.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> En remplaçant chaque condensateur par son équivalent aux fréquences extrêmes, prévoir ce que devient chaque étage pour \(f \to 0\) et pour \(f \to \infty\). Quel type de filtre chacun réalise-t-il ?</div>
  <div class="q"><strong>Q2.</strong> Établir \(\underline{H}_1\) et \(\underline{H}_2\) et calculer les fréquences caractéristiques \(f_1\) et \(f_2\).</div>
  <div class="q"><strong>Q3.</strong> Justifier que la fonction de transfert globale vaut \(\underline{H}_1\underline{H}_2\). Calculer le gain dans la bande passante, en décibels.</div>
  <div class="q"><strong>Q4.</strong> Tracer le diagramme de Bode asymptotique en gain du filtre complet.</div>
  <div class="q"><strong>Q5.</strong> Le microphone a une résistance interne \(R_g = 600\ \Omega\). Quel est son effet ? Comment le supprimer ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Étage 1 : en BF, \(C_1\) est un interrupteur ouvert, aucun courant n'entre, \(s_1 = 0\) ; en HF, \(C_1\) est un fil, on a un inverseur de gain \(-R_2/R_1\) : <strong>passe-haut</strong>. Étage 2 : en BF, \(C_2\) est ouvert, inverseur de gain \(-R_4/R_3\) ; en HF, \(C_2\) court-circuite la contre-réaction, \(s_2 = V^- = 0\) : <strong>passe-bas</strong>.</p>
    <p><strong>Q2.</strong> Avec \(\underline{H} = -\underline{Z}_2/\underline{Z}_1\) :</p>
    <div class="formula">$$\underline{H}_1 = -\frac{R_2}{R_1}\,\frac{j f/f_1}{1 + j f/f_1}$$
    $$\underline{H}_2 = -\frac{R_4}{R_3}\,\frac{1}{1 + j f/f_2}$$</div>
    <p>avec \(f_1 = 1/(2\pi R_1C_1) \approx 339\ \text{Hz}\) et \(f_2 = 1/(2\pi R_4C_2) \approx 3{,}39\ \text{kHz}\).</p>
    <p><strong>Q3.</strong> La sortie de l'étage 1 est celle d'un ALI idéal (impédance de sortie nulle) : l'impédance d'entrée de l'étage 2 (\(R_3\)) ne la modifie pas, donc \(\underline{H} = \underline{H}_1\underline{H}_2\). Pour \(f_1 \ll f \ll f_2\) : \(\underline{H} \simeq (R_2/R_1)(R_4/R_3) = 2{,}2\times4{,}7 \approx 10{,}3\) (positif : deux inversions), soit \(G \approx 20{,}3\ \text{dB}\).</p>
    <p><strong>Q4.</strong> Trois asymptotes : pente +20 dB/décade pour \(f \lt f_1\), palier à 20,3 dB entre \(f_1\) et \(f_2\), pente −20 dB/décade pour \(f \gt f_2\). Comme \(f_2/f_1 = 10\), le gain réel en \(f_1\) et en \(f_2\) est très proche de 20,3 − 3 = 17,3 dB.</p>
    <p><strong>Q5.</strong> L'impédance d'entrée de l'étage 1 est \(R_1 + 1/(jC_1\omega)\), proche de \(R_1\) dans la bande : \(R_g\) s'ajoute à \(R_1\). Le gain de bande devient \(\dfrac{22}{10{,}6}\times 4{,}7 \approx 9{,}8\) (−0,5 dB) et \(f_1\) descend à \(1/[2\pi(R_1+R_g)C_1] \approx 319\ \text{Hz}\). Un suiveur placé entre le microphone et le filtre supprime cette dépendance.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Thermostat à hystérésis</h3>
  <div class="statement">Une chaîne de mesure fournit \(u = k\theta\) avec \(k = 0{,}10\ \text{V/°C}\) (\(\theta\) en °C). On l'applique à E⁺ à travers \(R_1\) ; \(R_2\) relie E⁺ à la sortie ; E⁻ est portée à une tension fixe \(E_{ref}\). ALI idéal, \(V_{sat} = 12\ \text{V}\). Le chauffage est en marche quand \(s = -V_{sat}\) et arrêté quand \(s = +V_{sat}\). On souhaite qu'il démarre quand \(\theta\) descend à 19 °C et s'arrête quand \(\theta\) atteint 21 °C.</div>
  <div class="q"><strong>Q1.</strong> Justifier le régime saturé. Exprimer \(V^+\) en fonction de \(u\) et \(s\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les tensions \(u_H\) (basculement de \(-V_{sat}\) à \(+V_{sat}\)) et \(u_B\) (basculement inverse).</div>
  <div class="q"><strong>Q3.</strong> Tracer le cycle \(s(u)\) en précisant le sens de parcours, sa largeur et son centre.</div>
  <div class="q"><strong>Q4.</strong> Dimensionner \(R_1\), \(R_2\) (avec \(R_2 = 120\ \text{k}\Omega\)) et \(E_{ref}\).</div>
  <div class="q"><strong>Q5.</strong> La mesure est entachée d'un bruit de \(\pm 0{,}02\ \text{V}\). Décrire l'évolution de \(\theta\) et du chauffage au cours du temps. Que se passerait-il avec un comparateur simple réglé sur 20 °C ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Seule rétroaction : sur E⁺ → montage instable, sortie à \(\pm V_{sat}\). Millman en E⁺ : \(V^+ = \dfrac{R_2u + R_1s}{R_1+R_2}\).</p>
    <p><strong>Q2.</strong> Si \(s = -V_{sat}\), cet état dure tant que \(V^+ \lt E_{ref}\) ; il cesse quand \(R_2u - R_1V_{sat} = (R_1+R_2)E_{ref}\). De même pour \(s = +V_{sat}\) :</p>
    <div class="formula">$$u_H = \frac{(R_1+R_2)E_{ref} + R_1V_{sat}}{R_2}$$
    $$u_B = \frac{(R_1+R_2)E_{ref} - R_1V_{sat}}{R_2}$$</div>
    <p><strong>Q3.</strong> Palier bas \(s = -V_{sat}\) pour \(u \lt u_H\), palier haut \(s = +V_{sat}\) pour \(u \gt u_B\) ; montée en \(u_H\), descente en \(u_B\) : cycle parcouru dans le sens trigonométrique. Largeur \(\Delta u = 2R_1V_{sat}/R_2\), centre \(u_c = (1 + R_1/R_2)\,E_{ref}\).</p>
    <p><strong>Q4.</strong> \(u_H = 2{,}1\ \text{V}\) et \(u_B = 1{,}9\ \text{V}\) : \(\Delta u = 0{,}20\ \text{V}\) impose \(R_1/R_2 = 0{,}10/12 = 1/120\), d'où \(R_1 = 1{,}0\ \text{k}\Omega\). Centre \(u_c = 2{,}0\ \text{V}\) : \(E_{ref} = 2{,}0\times 120/121 \approx 1{,}98\ \text{V}\).</p>
    <p><strong>Q5.</strong> Pièce froide : \(s = -V_{sat}\), le chauffage fonctionne, \(\theta\) monte jusqu'à 21 °C ; la sortie bascule, le chauffage s'arrête, \(\theta\) redescend jusqu'à 19 °C, et ainsi de suite : \(\theta\) oscille entre 19 et 21 °C. Le bruit (0,04 V crête à crête) est petit devant la largeur du cycle (0,20 V) : un seul basculement par franchissement. Avec un comparateur simple, chaque passage de \(u\) au voisinage de 2,0 V provoquerait une rafale de basculements au rythme du bruit : le relais claquerait en permanence et s'userait vite.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Chaîne d'un interrupteur crépusculaire</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>ALI, rétroaction, filtrage, comparateurs</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un éclairage extérieur doit s'allumer à la tombée de la nuit et s'éteindre au lever du jour. Le capteur est une photodiode, modélisée par une source idéale de courant \(i_p\) proportionnel à l'éclairement (\(0 \le i_p \le 20\ \mu\text{A}\)). La chaîne comporte trois étages. Tous les ALI sont alimentés en \(\pm 15\ \text{V}\) : \(V_{sat} = 12\ \text{V}\), \(i_{s,max} = 20\ \text{mA}\), \(\sigma = 13\ \text{V/}\mu\text{s}\) ; quand le modèle du premier ordre est demandé, \(\mu_0 = 2{,}0\times10^5\) et \(f_c = 5{,}0\ \text{Hz}\).
  </div>

  <p class="exo-part">Partie A — Convertisseur courant-tension</p>
  <div class="q">La photodiode injecte \(i_p\) dans le nœud relié à E⁻ ; une résistance \(R_T = 100\ \text{k}\Omega\) relie E⁻ à la sortie \(s_1\) ; E⁺ est à la masse.</div>
  <div class="q"><strong>A1.</strong> Avec le modèle idéal, justifier le régime linéaire et exprimer \(s_1\) en fonction de \(i_p\). Plage de \(s_1\) ?</div>
  <div class="q"><strong>A2.</strong> Avec le modèle du premier ordre, établir l'équation différentielle reliant \(s_1\) et \(i_p\). Conclure sur la stabilité, l'erreur statique relative et le temps de réponse.</div>
  <div class="q"><strong>A3.</strong> Quel est l'intérêt de ce montage par rapport à une simple résistance branchée aux bornes de la photodiode ?</div>

  <p class="exo-part">Partie B — Filtrage du scintillement</p>
  <div class="q">Les lampes voisines alimentées par le secteur font fluctuer l'éclairement à 100 Hz : \(i_p(t) = I_0\,[1 + m\cos(2\pi f_s t)]\) avec \(m = 0{,}30\) et \(f_s = 100\ \text{Hz}\). L'étage B est un passe-bas actif inverseur : \(R_3 = 10\ \text{k}\Omega\) en entrée, \(R_4 = 25\ \text{k}\Omega\) en parallèle avec \(C\) en contre-réaction ; sa sortie est \(s_2\).</div>
  <div class="q"><strong>B1.</strong> Donner \(\underline{H}_2 = \underline{s_2}/\underline{s_1}\). Calculer \(C\) pour une fréquence de coupure de 5,0 Hz.</div>
  <div class="q"><strong>B2.</strong> Exprimer la valeur moyenne de \(s_2\) en fonction de \(I_0\). Déterminer le taux de modulation résiduel \(m'\) de \(s_2\) à 100 Hz.</div>
  <div class="q"><strong>B3.</strong> Pourquoi peut-on relier directement l'étage B à la sortie de l'étage A ?</div>

  <p class="exo-part">Partie C — Comparateur à hystérésis</p>
  <div class="q">\(s_2\) est appliquée sur E⁻ du troisième ALI. Sa borne E⁺ est reliée à une référence \(E_{ref} = 2{,}0\ \text{V}\) par \(R_5 = 10\ \text{k}\Omega\) et à sa sortie \(s_3\) par \(R_6 = 390\ \text{k}\Omega\). La lampe est allumée quand \(s_3 = +V_{sat}\).</div>
  <div class="q"><strong>C1.</strong> Quel est le régime de cet ALI ? Exprimer \(V^+\) en fonction de \(E_{ref}\) et \(s_3\).</div>
  <div class="q"><strong>C2.</strong> Calculer les seuils \(V_H\) et \(V_B\) de basculement, puis les courants \(i_p\) correspondants.</div>
  <div class="q"><strong>C3.</strong> Tracer le cycle \(s_3(s_2)\) et décrire le fonctionnement sur une journée.</div>
  <div class="q"><strong>C4.</strong> Montrer que l'hystérésis empêche le scintillement de la lampe au crépuscule. Que se passerait-il sans le condensateur \(C\) de l'étage B ?</div>

  <p class="exo-part">Partie D — Vérifications</p>
  <div class="q"><strong>D1.</strong> Vérifier que l'ALI de l'étage A ne sature pas en courant.</div>
  <div class="q"><strong>D2.</strong> Estimer la durée d'un basculement du comparateur. Est-elle gênante ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Rétroaction sur E⁻ seulement : régime linéaire, \(V^- = V^+ = 0\). Comme \(i^- = 0\), tout \(i_p\) traverse \(R_T\) de E⁻ vers la sortie : \(0 - s_1 = R_Ti_p\), soit \(s_1 = -R_Ti_p\), comprise entre −2,0 V et 0.</p>
    <p><strong>A2.</strong> \(V^- = s_1 + R_Ti_p\) et \(\varepsilon = -V^-\). Dans \(\tau\,\mathrm{d}s_1/\mathrm{d}t + s_1 = \mu_0\varepsilon\) :</p>
    <div class="formula">$$\tau\,\frac{\mathrm{d}s_1}{\mathrm{d}t} + (1 + \mu_0)\,s_1 = -\mu_0R_T\,i_p$$</div>
    <p>Coefficients de même signe : stable. En statique, \(s_1 = -\dfrac{\mu_0}{1+\mu_0}R_Ti_p\) : erreur relative \(1/(1+\mu_0) \approx 5\times10^{-6}\), négligeable. Temps de réponse \(\tau' = \tau/(1+\mu_0)\) avec \(\tau = 1/(2\pi f_c) \approx 32\ \text{ms}\) : \(\tau' \approx 0{,}16\ \mu\text{s}\) (bande passante \(\approx f_T = 1\ \text{MHz}\)).</p>
    <p><strong>A3.</strong> Dans le modèle de la source de courant idéale, une résistance \(R_T\) aux bornes de la photodiode donnerait bien \(u = R_Ti_p\), mais sous une impédance de sortie \(R_T = 100\ \text{k}\Omega\) : l'étage suivant (\(R_3 = 10\ \text{k}\Omega\)) prélèverait du courant et fausserait la mesure. Ici, \(s_1\) est délivrée par la sortie d'un ALI (impédance nulle). De plus, une vraie photodiode ne fournit un courant proportionnel à l'éclairement que si la tension à ses bornes reste faible : le montage la maintient à 0 V (masse virtuelle), alors qu'avec une résistance cette tension atteindrait 2 V.</p>
    <p><strong>B1.</strong> \(\underline{H}_2 = -\dfrac{R_4}{R_3}\,\dfrac{1}{1 + jR_4C\omega}\). Coupure : \(C = 1/(2\pi R_4 f_c)\), soit \(C \approx 1{,}3\ \mu\text{F}\).</p>
    <p><strong>B2.</strong> En continu, \(s_2 = -(R_4/R_3)\,s_1 = 2{,}5\,R_T\,I_0 = (2{,}5\times10^5\ \Omega)\,I_0\) (au plus 5,0 V, pour un éclairement constant donnant \(i_p = 20\ \mu\text{A}\)). L'étage A transmet la composante à 100 Hz sans atténuation ; l'étage B la divise, relativement au continu, par \(\sqrt{1 + (100/5)^2} = \sqrt{401} \approx 20\) : \(m' = 0{,}30/20 \approx 0{,}015\), soit 1,5 %.</p>
    <p><strong>B3.</strong> La sortie de l'étage A est celle d'un ALI idéal (impédance de sortie nulle) : le courant absorbé par \(R_3\) ne modifie pas \(s_1\).</p>
    <p><strong>C1.</strong> Seule rétroaction : sur E⁺ → saturation, \(s_3 = \pm V_{sat}\). Millman : \(V^+ = \dfrac{R_6E_{ref} + R_5s_3}{R_5+R_6}\).</p>
    <p><strong>C2.</strong> \(s_3 = +V_{sat}\) tant que \(s_2 \lt V^+ = V_H\), avec \(V_H = (390\times2{,}0 + 10\times12)/400\), soit \(V_H = 2{,}25\ \text{V}\). \(s_3 = -V_{sat}\) tant que \(s_2 \gt V_B\), avec \(V_B = (780 - 120)/400 = 1{,}65\ \text{V}\). Avec \(s_2 = 2{,}5\times10^5\,i_p\) : \(I_H = 9{,}0\ \mu\text{A}\) et \(I_B = 6{,}6\ \mu\text{A}\).</p>
    <p><strong>C3.</strong> Cycle de comparateur inverseur, parcouru dans le sens horaire : palier haut (lampe allumée) jusqu'à \(s_2 = 2{,}25\ \text{V}\), palier bas (lampe éteinte) jusqu'à \(s_2 = 1{,}65\ \text{V}\). La nuit, \(s_2\) est faible : lampe allumée. Au matin, l'éclairement croît ; la lampe s'éteint quand \(i_p\) atteint 9,0 µA. Le soir, elle ne se rallume que lorsque \(i_p\) redescend sous 6,6 µA.</p>
    <p><strong>C4.</strong> Au voisinage du seuil bas, l'ondulation résiduelle de \(s_2\) a pour amplitude \(m' \times 1{,}65 \approx 0{,}025\ \text{V}\), très faible devant l'écart des seuils (0,60 V) : un seul basculement. Sans \(C\), l'ondulation aurait pour amplitude \(0{,}30\times1{,}65 \approx 0{,}50\ \text{V}\), soit 1,0 V crête à crête, supérieure à 0,60 V : au crépuscule, la sortie basculerait à 100 Hz et la lampe clignoterait.</p>
    <p><strong>D1.</strong> L'ALI A débite au plus \(i_p\) dans \(R_T\) (20 µA) plus \(|s_1|/R_3 = 2{,}0/10^4 = 0{,}20\ \text{mA}\) dans l'étage B, soit environ 0,22 mA, très inférieur à 20 mA.</p>
    <p><strong>D2.</strong> Un basculement fait varier \(s_3\) de \(2V_{sat} = 24\ \text{V}\) : durée \(\approx 24/13 \approx 1{,}8\ \mu\text{s}\), totalement négligeable devant les variations de l'éclairement naturel.</p>
  </div>
