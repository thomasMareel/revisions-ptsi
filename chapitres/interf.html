  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Chemin optique à travers une cuve</h3>
  <div class="statement">Une diode laser verte émet à \(\lambda_0 = 520\ \text{nm}\). Son faisceau, en incidence normale, va du point \(A\) (sortie du laser) au point \(B\) (fond d'une cuve) en traversant successivement \(\ell_1 = 20{,}0\ \text{cm}\) d'air (indice pris égal à 1), la paroi de la cuve en PMMA (épaisseur \(e = 8{,}0\ \text{mm}\), indice \(n_P = 1{,}49\)), puis \(\ell_2 = 15{,}0\ \text{cm}\) d'eau (indice \(n_e = 1{,}33\)). On prend \(c = 3{,}00\times10^{8}\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Un camarade affirme que le faisceau « vire au violet » dans l'eau, puisque sa longueur d'onde y descend sous \(400\ \text{nm}\). Calculer \(\nu\), puis la longueur d'onde dans le PMMA et dans l'eau, et lui répondre.</div>
  <div class="q"><strong>Q2.</strong> Calculer le chemin optique \((AB)\) et la durée du trajet.</div>
  <div class="q"><strong>Q3.</strong> Exprimer le retard de phase \(\varphi(B)-\varphi(A)\). Combien de longueurs d'onde \(\lambda_0\) le chemin optique contient-il ? Pourquoi cette phase n'est-elle jamais mesurée directement ?</div>
  <div class="q"><strong>Q4.</strong> Quelle différence de marche la paroi introduit-elle par rapport au même trajet dans l'air ? Placée sur une seule voie d'un interféromètre réglé au contact optique, ferait-elle disparaître les franges en lumière blanche ? avec ce laser (longueur de cohérence de l'ordre du mètre) ?</div>
  <div class="q"><strong>Q5.</strong> Une partie du faisceau se réfléchit sur la face d'entrée de la paroi (air → PMMA), une autre sur sa face de sortie (PMMA → eau). Quels déphasages supplémentaires accompagnent ces réflexions ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\nu = c/\lambda_0 = 5{,}77\times10^{14}\ \text{Hz}\), la même dans tous les milieux. \(\lambda_P = \lambda_0/n_P = 349\ \text{nm}\) et \(\lambda_e = \lambda_0/n_e = 391\ \text{nm}\). L'argument du camarade confond \(\lambda\) et \(\lambda_0\) : la couleur est fixée par la fréquence (ou par \(\lambda_0\)), inchangée, et le faisceau reste vert dans l'eau. D'ailleurs l'œil, baigné d'humeurs aqueuses, ne « voit » jamais la longueur d'onde dans l'air.</p>
    <p><strong>Q2.</strong> \((AB) = \ell_1 + n_P\,e + n_e\,\ell_2\) ; numériquement \(0{,}200 + 0{,}0119 + 0{,}1995\), soit \((AB) = 0{,}411\ \text{m}\). Durée : \(t_{AB} = (AB)/c = 1{,}37\ \text{ns}\).</p>
    <p><strong>Q3.</strong> \(\varphi(B)-\varphi(A) = 2\pi(AB)/\lambda_0\), avec \((AB)/\lambda_0 \approx 7{,}91\times10^{5}\) longueurs d'onde. La phase d'une onde varie à la pulsation \(\omega \approx 3{,}6\times10^{15}\ \text{rad·s}^{-1}\), qu'aucun détecteur ne suit ; seule une <em>différence</em> de phase entre deux ondes cohérentes est accessible, par interférences.</p>
    <p><strong>Q4.</strong> \(\delta = (n_P-1)\,e = 3{,}9\ \text{mm}\). En lumière blanche (\(L_c \approx 1\ \mu\text{m}\)), \(\delta \gg L_c\) : les franges disparaissent. Avec le laser, \(\delta \ll L_c\) : les franges subsistent, simplement décalées de \(\delta/\lambda_0 \approx 7{,}5\times10^{3}\) ordres.</p>
    <p><strong>Q5.</strong> Réflexion air → PMMA : sur un milieu plus réfringent, déphasage de \(\pi\) (soit \(\lambda_0/2\)). Réflexion PMMA → eau : l'indice diminue (\(1{,}49 \to 1{,}33\)), pas de déphasage supplémentaire.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Trois sources, trois cohérences</h3>
  <div class="statement">On compare trois sources : (a) une DEL rouge, \(\lambda_0 = 625\ \text{nm}\), \(\Delta\lambda_0 = 18\ \text{nm}\) ; (b) une lampe à vapeur de mercure basse pression filtrée sur sa raie verte, \(\lambda_0 = 546{,}1\ \text{nm}\), \(\Delta\lambda_0 = 5{,}0\ \text{pm}\) ; (c) une diode laser monomode stabilisée, \(\lambda_0 = 780\ \text{nm}\), \(\Delta\nu = 2{,}0\ \text{MHz}\). On prend \(c = 3{,}00\times10^{8}\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Pour chaque source, calculer la largeur spectrale manquante (\(\Delta\nu\) ou \(\Delta\lambda_0\)), la durée de cohérence \(\tau_c\) et la longueur de cohérence \(L_c\).</div>
  <div class="q"><strong>Q2.</strong> Combien d'oscillations un train d'onde contient-il en moyenne ? Comparer à \(L_c/\lambda_0\).</div>
  <div class="q"><strong>Q3.</strong> Dans un interféromètre à deux ondes dont on fait varier la différence de marche \(\delta\) à partir de 0, jusqu'à quelle valeur de \(|\delta|\) observe-t-on des franges ? Combien de franges brillantes peut-on espérer compter de part et d'autre de \(\delta = 0\) ?</div>
  <div class="q"><strong>Q4.</strong> Estimer \(L_c\) pour la lumière blanche (de 400 à 750 nm). Que voit-on autour de \(\delta = 0\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On utilise \(L_c = \lambda_0^2/\Delta\lambda_0 = c/\Delta\nu\) et \(\tau_c = 1/\Delta\nu = L_c/c\).</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.4rem 0">
      <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">Source</th><th style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\nu\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\lambda_0\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(\tau_c\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(L_c\)</th></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">(a) DEL</td><td style="padding:.35rem;border:1px solid var(--grid)">\(1{,}4\times10^{13}\ \text{Hz}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(18\ \text{nm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(72\ \text{fs}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(22\ \mu\text{m}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">(b) Hg</td><td style="padding:.35rem;border:1px solid var(--grid)">\(5{,}0\ \text{GHz}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(5{,}0\ \text{pm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(0{,}20\ \text{ns}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(6{,}0\ \text{cm}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">(c) laser</td><td style="padding:.35rem;border:1px solid var(--grid)">\(2{,}0\ \text{MHz}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(4\ \text{fm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(0{,}50\ \mu\text{s}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(150\ \text{m}\)</td></tr>
    </table></div>
    <p>Pour (c) : \(\Delta\lambda_0 = \lambda_0^2\,\Delta\nu/c \approx 4\times10^{-15}\ \text{m}\).</p>
    <p><strong>Q2.</strong> Nombre d'oscillations : \(\tau_c\,\nu = \tau_c\,c/\lambda_0 = L_c/\lambda_0\), soit environ 35 pour la DEL, \(1{,}1\times10^{5}\) pour la lampe et \(1{,}9\times10^{8}\) pour le laser.</p>
    <p><strong>Q3.</strong> Les franges restent visibles tant que \(|\delta| \lesssim L_c\) (leur contraste diminue progressivement à l'approche de cette valeur). On peut donc compter de l'ordre de \(L_c/\lambda_0\) franges de chaque côté : une trentaine avec la DEL, une centaine de milliers avec la lampe ; avec le laser, c'est la taille du montage qui limite, pas la source.</p>
    <p><strong>Q4.</strong> Avec \(\lambda_0 \approx 575\ \text{nm}\) et \(\Delta\lambda_0 \approx 350\ \text{nm}\) : \(L_c \approx 0{,}9\ \mu\text{m}\), de l'ordre du micromètre. On observe une frange centrale blanche (\(\delta = 0\) est brillant pour toutes les longueurs d'onde), encadrée de quelques franges irisées ; au-delà de quelques micromètres, l'éclairement redevient uniforme (« blanc d'ordre supérieur »).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Éclairement et contraste de deux ondes inégales</h3>
  <div class="statement">Une lame séparatrice divise un faisceau laser en deux ondes de même éclairement \(\mathcal{E}_0\), qui se recombinent en un point \(M\) après des trajets présentant la différence de marche \(\delta\) (avec \(|\delta| \ll L_c\)). Sur la voie 2, on place un filtre absorbant (densité neutre) qui transmet la fraction \(T\) de l'éclairement (\(0 \lt T \le 1\)) ; le léger déphasage qu'il introduit est inclus dans \(\delta\). En \(M\) : \(s_1 = a\cos(\omega t-\varphi_1)\) et \(s_2 = b\cos(\omega t-\varphi_2)\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(b\) en fonction de \(a\) et de \(T\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\mathcal{E}(M)\) en notation réelle, en développant le carré puis en moyennant.</div>
  <div class="q"><strong>Q3.</strong> Retrouver ce résultat en notation complexe.</div>
  <div class="q"><strong>Q4.</strong> Montrer que le contraste vaut \(\Gamma = \dfrac{2\sqrt{T}}{1+T}\). Calculer \(\Gamma\) pour \(T = 0{,}50\), \(0{,}10\) et \(0{,}010\).</div>
  <div class="q"><strong>Q5.</strong> Quelle transmission minimale garantit \(\Gamma \ge 0{,}90\) ? Commenter.</div>
  <div class="q"><strong>Q6.</strong> Pour \(T = 0{,}10\), calculer \(\mathcal{E}_{max}/\mathcal{E}_{min}\). Montrer que la moyenne de \(\mathcal{E}\) sur une frange vaut \(\mathcal{E}_1+\mathcal{E}_2\) et interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'éclairement est proportionnel au carré de l'amplitude : \(Kb^2/2 = T\,Ka^2/2\), donc \(b = a\sqrt{T}\).</p>
    <p><strong>Q2.</strong> En développant :</p>
    <div class="formula">$$\begin{aligned}s^2={}&a^2\cos^2(\omega t-\varphi_1)+b^2\cos^2(\omega t-\varphi_2)\\&+2ab\cos(\omega t-\varphi_1)\cos(\omega t-\varphi_2)\end{aligned}$$</div>
    <p>Les deux premiers termes ont pour moyennes \(a^2/2\) et \(b^2/2\). Le dernier s'écrit \(ab\big[\cos(2\omega t-\varphi_1-\varphi_2)+\cos\Delta\varphi\big]\) avec \(\Delta\varphi = \varphi_2-\varphi_1\) ; sa moyenne vaut \(ab\cos\Delta\varphi\). D'où :</p>
    <div class="formula">$$\mathcal{E}=\mathcal{E}_0\big(1+T+2\sqrt{T}\cos\Delta\varphi\big)$$</div>
    <p>avec \(\Delta\varphi = 2\pi\delta/\lambda_0\).</p>
    <p><strong>Q3.</strong> \(\underline{a}_1 = a\,e^{-i\varphi_1}\), \(\underline{a}_2 = a\sqrt{T}\,e^{-i\varphi_2}\) et \(\mathcal{E} = \frac{K}{2}|\underline{a}_1+\underline{a}_2|^2\), soit :</p>
    <div class="formula">$$\mathcal{E}=\frac{K a^2}{2}\big[1+T+2\sqrt{T}\cos(\varphi_2-\varphi_1)\big]$$</div>
    <p>C'est le même résultat.</p>
    <p><strong>Q4.</strong> \(\mathcal{E}_{max} = \mathcal{E}_0(1+\sqrt{T})^2\) et \(\mathcal{E}_{min} = \mathcal{E}_0(1-\sqrt{T})^2\), donc \(\Gamma = \dfrac{4\sqrt{T}}{2(1+T)} = \dfrac{2\sqrt{T}}{1+T}\). Numériquement : \(\Gamma = 0{,}94\) ; \(0{,}57\) ; \(0{,}20\).</p>
    <p><strong>Q5.</strong> Avec \(u = \sqrt{T}\) : \(0{,}9\,u^2-2u+0{,}9 = 0\), dont la racine inférieure à 1 est \(u = (1-\sqrt{0{,}19})/0{,}9 = 0{,}627\), soit \(T \ge 0{,}39\). Même en perdant 60 % de la lumière sur une voie, le contraste reste de 90 % : il est très peu sensible au déséquilibre des voies.</p>
    <p><strong>Q6.</strong> \(\dfrac{\mathcal{E}_{max}}{\mathcal{E}_{min}} = \Big(\dfrac{1+\sqrt{T}}{1-\sqrt{T}}\Big)^2 \approx 3{,}7\). Sur une frange, \(\Delta\varphi\) parcourt \(2\pi\) et \(\langle\cos\Delta\varphi\rangle = 0\) : \(\langle\mathcal{E}\rangle = \mathcal{E}_0(1+T) = \mathcal{E}_1+\mathcal{E}_2\). L'énergie est redistribuée entre franges brillantes et sombres, mais conservée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Franges de deux ondes planes sur un capteur</h3>
  <div class="statement">Deux faisceaux collimatés issus d'une même diode laser violette (\(\lambda_0 = 405\ \text{nm}\), longueur de cohérence de plusieurs mètres) se croisent dans l'air sur un capteur CMOS plan, confondu avec le plan \(z = 0\). Leurs vecteurs d'onde sont dans le plan \((Oxz)\), symétriques par rapport à la normale \(Oz\) au capteur, chacun faisant l'angle \(\theta\) avec \(Oz\). Les deux ondes ont même amplitude et sont en phase en \(O\). Le capteur compte 2048 pixels selon \(Ox\), de pas \(p = 3{,}45\ \mu\text{m}\).</div>
  <div class="q"><strong>Q1.</strong> Écrire les composantes de \(\vec k_1\) et \(\vec k_2\). Exprimer le déphasage \(\Delta\varphi\) entre les deux ondes en un point \(M(x, y, 0)\) du capteur. Quelle est la forme des franges ?</div>
  <div class="q"><strong>Q2.</strong> Montrer que l'interfrange vaut \(i = \lambda_0/(2\sin\theta)\). Pour \(\theta = 1{,}0^\circ\), calculer \(i\), le nombre de pixels par interfrange et le nombre de franges sur la largeur du capteur.</div>
  <div class="q"><strong>Q3.</strong> Pour résoudre les franges, il faut au moins deux pixels par interfrange (critère de Shannon). Quel est l'angle \(\theta\) maximal ?</div>
  <div class="q"><strong>Q4.</strong> L'onde 1 arrive désormais sous l'angle \(\theta_1\) et l'onde 2 sous l'angle \(\theta_2\) (angles algébriques, mesurés depuis \(Oz\) dans le plan \(Oxz\)). Montrer que \(i = \lambda_0/|\sin\theta_2-\sin\theta_1|\) et vérifier le cas symétrique.</div>
  <div class="q"><strong>Q5.</strong> Les deux faisceaux sont en fait produits par une lame séparatrice qui réfléchit 30 % et transmet 70 % de l'éclairement incident (pertes négligées). Calculer le contraste des franges.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(k = 2\pi/\lambda_0\) : \(\vec k_1 = k(\sin\theta\,\vec e_x+\cos\theta\,\vec e_z)\) et \(\vec k_2 = k(-\sin\theta\,\vec e_x+\cos\theta\,\vec e_z)\). Les retards de phase sont \(\varphi_j(M) = \vec k_j\cdot\overrightarrow{OM}\) (nuls en \(O\)). En \(z = 0\) :</p>
    <div class="formula">$$\varphi_1-\varphi_2=(\vec k_1-\vec k_2)\cdot\overrightarrow{OM}=\frac{4\pi}{\lambda_0}\,x\sin\theta$$</div>
    <p>Le déphasage \(\Delta\varphi = \varphi_1-\varphi_2\) ne dépend pas de \(y\) : les franges sont des droites parallèles à \(Oy\), équidistantes.</p>
    <p><strong>Q2.</strong> \(\Delta\varphi\) augmente de \(2\pi\) quand \(x\) augmente de \(i\) : \(i = \dfrac{2\pi\lambda_0}{4\pi\sin\theta} = \dfrac{\lambda_0}{2\sin\theta}\). Pour \(\theta = 1{,}0^\circ\) : \(i = 11{,}6\ \mu\text{m}\), soit \(i/p \approx 3{,}4\) pixels par interfrange. Largeur du capteur : \(2048\times3{,}45\ \mu\text{m} = 7{,}07\ \text{mm}\), soit environ 610 franges.</p>
    <p><strong>Q3.</strong> \(i \ge 2p\) impose \(\sin\theta \le \lambda_0/(4p) = 0{,}0293\), soit \(\theta \le 1{,}7^\circ\) : l'angle total entre les deux faisceaux ne doit pas dépasser \(3{,}4^\circ\) environ, sinon l'échantillonnage par les pixels crée un faux motif de franges larges (repliement de spectre).</p>
    <p><strong>Q4.</strong> En \(z = 0\), seule la composante selon \(x\) des vecteurs d'onde intervient : \(\Delta\varphi = k\,x(\sin\theta_1-\sin\theta_2)\), d'où \(i = \lambda_0/|\sin\theta_2-\sin\theta_1|\). Dans le cas symétrique (\(\theta_1 = \theta\), \(\theta_2 = -\theta\)), on retrouve \(\lambda_0/(2\sin\theta)\). Aux petits angles, \(i \approx \lambda_0/\alpha\) où \(\alpha = |\theta_2-\theta_1|\) : seul compte l'angle entre les faisceaux.</p>
    <p><strong>Q5.</strong> \(\mathcal{E}_1/\mathcal{E}_2 = 7/3\) : \(\Gamma = \dfrac{2\sqrt{0{,}70\times0{,}30}}{0{,}70+0{,}30} = 2\sqrt{0{,}21} \approx 0{,}92\). Une séparatrice déséquilibrée ne dégrade presque pas la visibilité.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Mesurer l'indice d'un gaz en comptant des franges</h3>
  <div class="statement">Un interféromètre à deux ondes est éclairé par un laser (\(\lambda_0 = 532\ \text{nm}\)). L'une des voies traverse une fois une cellule de longueur intérieure \(L = 8{,}00\ \text{cm}\), fermée par deux fenêtres minces ; l'autre voie n'est pas modifiée. La cellule, initialement vide, est lentement remplie de dioxyde de carbone jusqu'à la pression atmosphérique. Une photodiode placée en un point fixe \(M\) du champ d'interférences enregistre l'éclairement : l'analyse du signal montre que \(N = 67{,}6\) franges ont défilé en \(M\) pendant le remplissage.</div>
  <div class="q"><strong>Q1.</strong> Exprimer la variation \(\Delta\delta\) de la différence de marche en \(M\) en fonction de l'indice final \(n\) du gaz et de \(L\).</div>
  <div class="q"><strong>Q2.</strong> Relier \(N\) à \(\Delta\delta\) et en déduire \(n-1\).</div>
  <div class="q"><strong>Q3.</strong> Le nombre de franges est connu à \(\pm0{,}1\) près. Quelle est l'incertitude sur \(n-1\) ?</div>
  <div class="q"><strong>Q4.</strong> Le remplissage dure 30 s et \(n-1\) croît proportionnellement au temps. Quelle est la fréquence du signal enregistré ? Quelle contrainte en résulte sur le temps de réponse de la photodiode ?</div>
  <div class="q"><strong>Q5.</strong> Les deux voies étant initialement de même chemin optique, pourquoi l'expérience échouerait-elle avec une lampe blanche, même munie d'un filtre de largeur \(\Delta\lambda_0 = 10\ \text{nm}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le chemin optique dans la cellule passe de \(L\) (vide) à \(nL\) ; les fenêtres et l'autre voie sont inchangées : \(|\Delta\delta| = (n-1)\,L\).</p>
    <p><strong>Q2.</strong> Une frange défile en \(M\) chaque fois que l'ordre \(p = \delta/\lambda_0\) varie d'une unité : \(N = (n-1)L/\lambda_0\), d'où \(n-1 = N\lambda_0/L\), soit \(n-1 = 4{,}50\times10^{-4}\).</p>
    <p><strong>Q3.</strong> \(u(n-1) = 0{,}1\times\lambda_0/L = 6{,}7\times10^{-7}\), soit une incertitude relative de \(0{,}15\ \%\) : l'interférométrie mesure de très faibles écarts d'indice.</p>
    <p><strong>Q4.</strong> 67,6 franges en 30 s : fréquence \(f \approx 2{,}3\ \text{Hz}\), période \(0{,}44\ \text{s}\). Il faut \(\tau_R \ll 0{,}4\ \text{s}\), ce que réalise largement n'importe quelle photodiode (temps de réponse de l'ordre de la ns). Un remplissage brutal ferait défiler les franges trop vite pour un détecteur lent.</p>
    <p><strong>Q5.</strong> En fin de remplissage, \(|\delta| = (n-1)L = 36\ \mu\text{m}\). Avec le filtre, \(L_c = \lambda_0^2/\Delta\lambda_0 \approx 28\ \mu\text{m}\) : le contraste s'effondre quand \(|\delta|\) atteint cette valeur, vers les trois quarts du remplissage, et les dernières franges ne peuvent plus être comptées. Sans filtre, \(L_c \approx 1\ \mu\text{m}\) : à peine deux franges défileraient de façon visible. Le laser (\(L_c \gg 36\ \mu\text{m}\)) n'a pas cette limite.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>LiDAR à commande de phase : N émetteurs cohérents</h3>
  <div class="statement">Une puce photonique de LiDAR porte \(N = 64\) émetteurs ponctuels identiques, alignés sur l'axe \(Ox\) aux abscisses \(x_k = k\,d\) (\(k = 0, \dots, N-1\)), au pas \(d = 2{,}00\ \mu\text{m}\). Ils sont alimentés par le même laser (\(\lambda_0 = 1550\ \text{nm}\), longueur de cohérence très grande devant la puce) et rayonnent avec la même amplitude. Des déphaseurs imposent à l'émetteur \(k\) la vibration \(a\cos(\omega t - k\alpha)\), où \(\alpha\) est réglable. On observe à grande distance, dans l'air, dans la direction faisant l'angle \(\theta\) avec la normale \(Oz\) à la puce (\(\theta \gt 0\) du côté des \(x\) positifs).</div>
  <div class="q"><strong>Q1.</strong> Montrer que, vers la direction \(\theta\), le chemin optique depuis l'émetteur \(k+1\) est plus court de \(d\sin\theta\) que depuis l'émetteur \(k\). En déduire que le retard de phase entre deux ondes voisines est \(\psi = \alpha - \dfrac{2\pi d\sin\theta}{\lambda_0}\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que l'éclairement dans la direction \(\theta\) s'écrit \(\mathcal{E}(\theta) = \mathcal{E}_0\,\dfrac{\sin^2(N\psi/2)}{\sin^2(\psi/2)}\), où \(\mathcal{E}_0\) est l'éclairement dû à un seul émetteur.</div>
  <div class="q"><strong>Q3.</strong> On prend \(\alpha = 0\). Déterminer les directions des maxima principaux. Combien y en a-t-il ? Quelle est leur valeur ?</div>
  <div class="q"><strong>Q4.</strong> Calculer la demi-largeur angulaire du lobe central (écart au premier zéro). Comparer au rayonnement d'un émetteur seul.</div>
  <div class="q"><strong>Q5.</strong> On veut orienter le lobe d'ordre 0 vers \(\theta_0 = 10{,}0^\circ\). Quelle valeur donner à \(\alpha\) ? Existe-t-il alors d'autres maxima principaux ?</div>
  <div class="q"><strong>Q6.</strong> Montrer que si \(d \lt \lambda_0/2\), un seul maximum principal subsiste quelle que soit l'orientation choisie. Pourquoi est-ce technologiquement délicat ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À grande distance, les rayons issus des émetteurs vers la direction \(\theta\) sont parallèles, de vecteur unitaire \(\vec u = \sin\theta\,\vec e_x+\cos\theta\,\vec e_z\). D'après le théorème de Malus, on compare les chemins jusqu'à un même plan d'onde lointain : le chemin depuis l'émetteur \(k\) vaut \(R - x_k\sin\theta\) (projection de \(\overrightarrow{OS_k}\) sur \(\vec u\)), donc il diminue de \(d\sin\theta\) d'un émetteur au suivant. Le retard de phase total de l'onde \(k\) est \(k\alpha + \frac{2\pi}{\lambda_0}(R - k\,d\sin\theta)\), d'où un retard \(\psi = \alpha - 2\pi d\sin\theta/\lambda_0\) entre ondes voisines.</p>
    <p><strong>Q2.</strong> Amplitudes complexes : \(\underline{a}_k = a'\,e^{-i\varphi_0}\,e^{-ik\psi}\) (\(a'\) amplitude à grande distance, identique pour tous). La somme géométrique (cours, §9) donne \(\big|\sum_k e^{-ik\psi}\big|^2 = \dfrac{\sin^2(N\psi/2)}{\sin^2(\psi/2)}\), d'où le résultat avec \(\mathcal{E}_0 = Ka'^2/2\).</p>
    <p><strong>Q3.</strong> Maxima principaux pour \(\psi = 2\pi m\) : \(\sin\theta_m = -m\lambda_0/d = -0{,}775\,m\). Comme \(|\sin\theta| \le 1\), seuls \(m = 0\) et \(m = \pm1\) conviennent : \(\theta = 0\) et \(\theta = \pm50{,}8^\circ\). Il y a trois maxima principaux, chacun d'éclairement \(N^2\mathcal{E}_0 = 4096\,\mathcal{E}_0\).</p>
    <p><strong>Q4.</strong> Premier zéro du lobe central : \(N\psi/2 = \pm\pi\), soit \(d\sin\theta = \pm\lambda_0/N\), d'où \(\Delta\theta \approx \lambda_0/(Nd)\), soit \(\Delta\theta \approx 1{,}2\times10^{-2}\ \text{rad}\), environ \(0{,}69^\circ\). Un émetteur seul rayonne dans tout le demi-espace ; le réseau concentre la puissance dans un pinceau de moins d'un degré, ce qui fixe la résolution angulaire du LiDAR.</p>
    <p><strong>Q5.</strong> Il faut \(\psi = 0\) pour \(\theta = \theta_0\) : \(\alpha = 2\pi d\sin\theta_0/\lambda_0\), soit \(\alpha = 1{,}41\ \text{rad}\) (environ \(81^\circ\)). Les autres maxima vérifient \(\sin\theta = \sin\theta_0 - m\lambda_0/d\) : \(m = 1\) donne \(\sin\theta = -0{,}601\), soit \(\theta \approx -37^\circ\), et \(m = -1\) donne \(\sin\theta = 0{,}949\), soit \(\theta \approx 72^\circ\). Ces lobes parasites (« lobes de réseau ») rendent la détection ambiguë.</p>
    <p><strong>Q6.</strong> Deux maxima principaux successifs diffèrent de \(\lambda_0/d\) en \(\sin\theta\). Si \(\lambda_0/d \gt 2\), c'est-à-dire \(d \lt \lambda_0/2\), deux valeurs de \(\sin\theta\) distantes de plus de 2 ne peuvent pas tenir dans \([-1\,;1]\) : un seul maximum principal existe, quel que soit \(\alpha\). Ici, il faudrait \(d \lt 775\ \text{nm}\) : des guides d'onde aussi rapprochés se couplent entre eux, d'où un compromis de conception.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Anneaux d'interférences entre une onde plane et une onde sphérique</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>interférences à deux ondes, cohérence</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Sur un banc de métrologie, un faisceau laser (\(\lambda_0 = 532\ \text{nm}\)) est divisé en deux par une lame séparatrice ; tout le montage est dans l'air (indice 1). La <strong>voie 1</strong> fournit une onde plane qui se propage selon \(+Oz\) et arrive en incidence normale sur un capteur plan, situé dans le plan \(z = 0\), de centre \(O\) et de demi-largeur \(R = 10\ \text{mm}\). La <strong>voie 2</strong> est focalisée par un objectif de microscope en un point \(S\) de l'axe, à la distance \(D = SO\) du capteur ; au-delà de \(S\), elle diverge en onde sphérique centrée sur \(S\). Les deux ondes sont mutuellement cohérentes. Un point \(M\) du capteur est repéré par sa distance \(r = OM\). On note \(\delta_0\) la différence de marche en \(O\) (voie 2 moins voie 1), fixée par les longueurs des bras ; elle inclut les déphasages supplémentaires, identiques pour tous les points du capteur (réflexions, passage de la voie 2 par le point de convergence \(S\)).
  </div>

  <figure class="schema" style="max-width:420px">
  <svg viewBox="0 0 380 185" role="img" aria-label="Montage : onde plane de la voie 1 se propageant selon z, onde sphérique de la voie 2 issue du point S situé à la distance D du capteur, point M du capteur à la distance r du centre O">
    <line x1="20" y1="90" x2="345" y2="90" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>
    <text x="350" y="104" class="lab-it">z</text>
    <line x1="30" y1="32" x2="288" y2="32" class="sk-accent2" marker-end="url(#sk-arrow-accent2)"/>
    <line x1="30" y1="150" x2="288" y2="150" class="sk-accent2" marker-end="url(#sk-arrow-accent2)"/>
    <text x="30" y="24" class="lab-accent2">voie 1 : onde plane</text>
    <path d="M 152.4 63.5 A 50 50 0 0 1 152.4 116.5" class="sk-accent"/>
    <path d="M 194.8 37 A 100 100 0 0 1 194.8 143" class="sk-accent"/>
    <path d="M 242.4 19.6 A 150 150 0 0 1 242.4 160.4" class="sk-accent"/>
    <circle cx="110" cy="90" r="3.2" class="fl-accent"/>
    <text x="104" y="82" class="lab-accent" text-anchor="end">S</text>
    <text x="22" y="128" class="lab-accent">voie 2 : onde sphérique</text>
    <line x1="300" y1="15" x2="300" y2="165" class="sk-ink" style="stroke-width:3"/>
    <text x="300" y="180" class="lab-muted" text-anchor="middle">capteur (z = 0)</text>
    <text x="308" y="104" class="lab-it">O</text>
    <line x1="110" y1="90" x2="300" y2="50" class="sk-dash"/>
    <circle cx="300" cy="50" r="2.6" class="fl-ink"/>
    <text x="292" y="45" class="lab-it" text-anchor="end">M</text>
    <line x1="318" y1="87" x2="318" y2="53" class="sk-ink" style="stroke-width:1" marker-start="url(#sk-arrow-ink)" marker-end="url(#sk-arrow-ink)"/>
    <text x="324" y="74" class="lab-it">r</text>
    <line x1="113" y1="106" x2="297" y2="106" class="sk-ink" style="stroke-width:1" marker-start="url(#sk-arrow-ink)" marker-end="url(#sk-arrow-ink)"/>
    <text x="205" y="120" class="lab-it" text-anchor="middle">D</text>
  </svg>
  <figcaption>Onde plane (voie 1) et onde sphérique issue de \(S\) (voie 2) superposées sur le capteur.</figcaption>
  </figure>

  <p class="exo-part">Partie A — Géométrie des franges (\(D = 0{,}800\ \text{m}\))</p>
  <div class="q"><strong>A1.</strong> Décrire les surfaces d'onde de chaque onde au voisinage du capteur. Montrer que \(\delta(M) = \delta_0 + (SM - SO)\), puis que \(\delta(M) \approx \delta_0 + \dfrac{r^2}{2D}\) pour \(r \ll D\).</div>
  <div class="q"><strong>A2.</strong> On règle \(\delta_0 = 0\). Décrire la figure d'interférences. Exprimer le rayon \(r_p\) de l'anneau brillant d'ordre \(p\) (\(p \ge 1\)) et calculer \(r_1\), \(r_4\) et \(r_{25}\).</div>
  <div class="q"><strong>A3.</strong> Montrer que, pour \(r \gg r_1\), l'écart entre anneaux brillants voisins vaut \(\Delta r \approx \lambda_0 D/r\). Les pixels du capteur mesurent \(5{,}0\ \mu\text{m}\) : les anneaux sont-ils résolus sur tout le capteur ?</div>
  <div class="q"><strong>A4.</strong> Évaluer le terme suivant du développement de \(SM\) pour \(r = R\) et justifier l'approximation de A1.</div>

  <p class="exo-part">Partie B — Contraste</p>
  <div class="q"><strong>B1.</strong> L'amplitude de l'onde sphérique décroît en \(1/SM\). Peut-on considérer \(\mathcal{E}_2\) comme uniforme sur le capteur ?</div>
  <div class="q"><strong>B2.</strong> On mesure \(\mathcal{E}_1 = 9\,\mathcal{E}_2\). Calculer le contraste \(\Gamma\) et le rapport \(\mathcal{E}_{max}/\mathcal{E}_{min}\).</div>
  <div class="q"><strong>B3.</strong> Dans quel intervalle choisir la transmission \(T\) d'une densité neutre placée sur la voie 1 pour obtenir \(\Gamma \ge 0{,}95\) ?</div>

  <p class="exo-part">Partie C — Cohérence temporelle</p>
  <div class="q"><strong>C1.</strong> Le laser est remplacé par une DEL verte suivie d'un filtre interférentiel : \(\lambda_0 = 532\ \text{nm}\), \(\Delta\lambda_0 = 4{,}0\ \text{nm}\). Calculer \(L_c\). Avec \(\delta_0 = 0\), jusqu'à quel rayon les anneaux sont-ils visibles ? Combien en voit-on ?</div>
  <div class="q"><strong>C2.</strong> Toujours avec la DEL, les bras sont déréglés : \(\delta_0 = -0{,}25\ \text{mm}\). Montrer qu'aucune frange n'est visible sur le capteur. Pourquoi ce réglage est-il sans importance avec le laser ?</div>

  <p class="exo-part">Partie D — Exploitation d'un enregistrement</p>
  <div class="q">On revient au laser ; la position de \(S\) a changé (\(D\) inconnue) et \(\delta_0\) n'est pas réglé. On note \(p_c = \delta_0/\lambda_0\) l'ordre au centre et \(\varepsilon\) sa partie fractionnaire. Les rayons des cinq premiers anneaux brillants (\(k = 1\) : le plus proche du centre) sont : \(0{,}53\) ; \(1{,}04\) ; \(1{,}37\) ; \(1{,}63\) ; \(1{,}86\ \text{mm}\).</div>
  <div class="q"><strong>D1.</strong> Montrer que \(r_k^2 = 2\lambda_0 D\,(k-\varepsilon)\).</div>
  <div class="q"><strong>D2.</strong> Par une régression linéaire de \(r_k^2\) en fonction de \(k\), déterminer \(D\).</div>
  <div class="q"><strong>D3.</strong> En déduire \(\varepsilon\). Le centre de la figure est-il brillant ou sombre ? Peut-on déterminer \(p_c\) lui-même par cette méthode ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Voie 1 : plans \(z = \text{cte}\), parallèles au capteur. Voie 2 : sphères centrées sur \(S\). Le capteur est une surface d'onde de l'onde plane : le chemin optique de la voie 1 jusqu'à \(M\) ne dépend pas de \(M\). Celui de la voie 2 vaut \((\text{source} \to S) + SM\). Donc \(\delta(M)-\delta(O) = SM - SO\), soit \(\delta(M) = \delta_0 + \sqrt{D^2+r^2} - D\). Pour \(r \ll D\) : \(\sqrt{D^2+r^2} \approx D\big(1+\frac{r^2}{2D^2}\big)\), d'où \(\delta \approx \delta_0 + r^2/(2D)\).</p>
    <p><strong>A2.</strong> \(\delta\) ne dépend que de \(r\) : les franges sont des <strong>anneaux</strong> centrés en \(O\), dont le centre est brillant (\(p = 0\)). Anneau brillant d'ordre \(p\) : \(r_p^2/(2D) = p\lambda_0\), soit \(r_p = \sqrt{2p\lambda_0D}\). Numériquement : \(r_1 = 0{,}92\ \text{mm}\), \(r_4 = 1{,}85\ \text{mm}\), \(r_{25} = 4{,}61\ \text{mm}\). Les rayons croissent comme \(\sqrt{p}\) : les anneaux se resserrent vers le bord.</p>
    <p><strong>A3.</strong> \(r^2 = 2\lambda_0 D\,p\) ; en différenciant, \(2r\,\Delta r = 2\lambda_0D\,\Delta p\) avec \(\Delta p = 1\) : \(\Delta r \approx \lambda_0D/r\). Au bord (\(r = R\)) : \(\Delta r = \lambda_0D/R = 43\ \mu\text{m}\), soit plus de 8 pixels : les anneaux sont résolus partout.</p>
    <p><strong>A4.</strong> Le terme suivant est \(-r^4/(8D^3)\) ; pour \(r = R\), il vaut \((10^{-2})^4/(8\times0{,}512) \approx 2{,}4\ \text{nm}\), soit \(5\times10^{-3}\lambda_0\) : l'approximation parabolique est excellente sur tout le capteur.</p>
    <p><strong>B1.</strong> \(\mathcal{E}_2 \propto 1/SM^2 = 1/(D^2+r^2)\) ; entre le centre et le bord, la variation relative vaut environ \(R^2/D^2 = 1{,}6\times10^{-4}\) : \(\mathcal{E}_2\) est uniforme, le contraste ne dépend pas de \(r\).</p>
    <p><strong>B2.</strong> \(\Gamma = \dfrac{2\sqrt{9}\,\mathcal{E}_2}{10\,\mathcal{E}_2} = 0{,}60\) ; \(\mathcal{E}_{max}/\mathcal{E}_{min} = (3+1)^2/(3-1)^2 = 4\).</p>
    <p><strong>B3.</strong> Avec \(x = \mathcal{E}_1/\mathcal{E}_2 = 9T\), il faut \(\Gamma = 2\sqrt{x}/(1+x) \ge 0{,}95\). Les solutions de l'égalité sont \(\sqrt{x} = (1\pm\sqrt{1-0{,}95^2})/0{,}95\), soit \(x = 0{,}524\) ou \(x = 1{,}91\) ; le contraste dépasse \(0{,}95\) entre ces deux valeurs. D'où \(0{,}058 \le T \le 0{,}21\).</p>
    <p><strong>C1.</strong> \(L_c = \lambda_0^2/\Delta\lambda_0 = 71\ \mu\text{m}\). Anneaux visibles tant que \(r^2/(2D) \lesssim L_c\) : \(r_{max} \approx \sqrt{2DL_c} \approx 11\ \text{mm}\), au-delà du bord du capteur : les anneaux le couvrent entièrement, avec un contraste qui faiblit vers le bord. Comme \(\delta\) ne dépasse pas \(R^2/(2D) = 62\ \mu\text{m}\) sur le capteur, on y compte environ \(R^2/(2\lambda_0 D) \approx 117\) anneaux brillants (la cohérence en autoriserait \(L_c/\lambda_0 \approx 130\)).</p>
    <p><strong>C2.</strong> \(\delta(r) = -0{,}25\ \text{mm} + r^2/(2D)\) : sur le capteur, \(\delta\) va de \(-0{,}25\ \text{mm}\) (centre) à \(-0{,}19\ \text{mm}\) (bord), donc \(|\delta|\) reste supérieur à \(2{,}5\,L_c\). Il faudrait \(|\delta| \lesssim L_c = 0{,}071\ \text{mm}\), soit \(r^2/(2D) \ge 0{,}18\ \text{mm}\), donc \(r \gtrsim 17\ \text{mm}\), supérieur à \(R\). Aucune frange sur le capteur : l'éclairement y est uniforme, égal à \(\mathcal{E}_1+\mathcal{E}_2\). Avec le laser, \(L_c\) (dizaines de cm au moins) est très supérieure à \(0{,}25\ \text{mm}\) : un tel déréglage ne fait que changer l'ordre au centre.</p>
    <p><strong>D1.</strong> \(p(r) = p_c + r^2/(2\lambda_0D)\) croît avec \(r\). Les anneaux brillants correspondent aux ordres entiers supérieurs à \(p_c\) : le \(k\)-ième a l'ordre \(\lfloor p_c\rfloor + k\). Donc \(r_k^2 = 2\lambda_0D\,(\lfloor p_c\rfloor + k - p_c)\), c'est-à-dire \(r_k^2 = 2\lambda_0D\,(k-\varepsilon)\).</p>
    <p><strong>D2.</strong> Les valeurs de \(r_k^2\) (en mm²) sont \(0{,}281\) ; \(1{,}082\) ; \(1{,}877\) ; \(2{,}657\) ; \(3{,}460\), bien alignées. La régression donne une pente \(2\lambda_0D = 0{,}793\ \text{mm}^2\) et une ordonnée à l'origine \(-0{,}509\ \text{mm}^2\). D'où \(D = \dfrac{0{,}793\times10^{-6}}{2\times5{,}32\times10^{-7}} = 0{,}746\ \text{m}\).</p>
    <p><strong>D3.</strong> \(\varepsilon = 0{,}509/0{,}793 = 0{,}64\). Au centre, \(\cos(2\pi p_c) = \cos(2\pi\times0{,}64) \approx -0{,}64\) : le centre est plutôt sombre, sans être un minimum (il le serait pour \(\varepsilon = 0{,}5\)). La partie entière de \(p_c\) reste inaccessible : augmenter \(\delta_0\) d'un nombre entier de longueurs d'onde redonne exactement la même figure.</p>
  </div>
