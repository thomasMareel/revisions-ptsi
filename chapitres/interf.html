  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Parties 3.1 « Modèle scalaire des ondes lumineuses » et 3.2 « Superposition d'ondes lumineuses » du programme de PT. La formule de Fresnel, admise en PTSI, y est démontrée ; les dispositifs (Young, Michelson, réseau) sont étudiés dans le chapitre suivant.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Modèle scalaire</strong> : décrire un signal lumineux par une grandeur scalaire ; fréquence, indice, longueur d'onde (§1).</li>
        <li><strong>Détecteurs et intensité</strong> : relier l'intensité à la moyenne temporelle du carré de la vibration ; ordres de grandeur des temps d'intégration ; capteur photographique (§2).</li>
        <li><strong>Chemin optique</strong> : exprimer un retard de phase en fonction de la durée de propagation ou du chemin optique ; déphasages supplémentaires (§3).</li>
        <li><strong>Surfaces d'onde et théorème de Malus</strong> (admis) ; ondes planes et sphériques ; effet d'une lentille mince ; chemin optique entre points conjugués indépendant du rayon (§4).</li>
        <li><strong>Modèle d'émission</strong> : trains d'onde ; ordres de grandeur du temps de cohérence ; relation \(\Delta f\,\Delta t \approx 1\) (§5, §6).</li>
        <li><strong>Superposition</strong> : additivité des intensités d'ondes incohérentes ; conditions d'interférences ; établir et exploiter la formule de Fresnel ; contraste (§7, §8).</li>
        <li><strong>N ondes cohérentes</strong> : différence de marche entre motifs consécutifs, relation fondamentale des réseaux, nombre de traits et finesse des franges (§9).</li>
      </ul>
      <p>L'étude de N ondes ne doit pas donner lieu à des calculs lourds : seuls la condition d'interférences constructives et l'effet qualitatif de N sont exigibles.</p>

<div class="course-section">
  <div class="sec-num">§1 · MODÈLE SCALAIRE DE LA LUMIÈRE</div>
  <h2>La lumière : une onde décrite par une seule grandeur</h2>
  <div class="intro">La lumière est une onde électromagnétique. Pour étudier les interférences, on n'a pas besoin de tout son appareil vectoriel : une grandeur scalaire, la <strong>vibration lumineuse</strong>, suffit tant que la polarisation ne joue aucun rôle. C'est le cadre de tout le chapitre.</div>

  <h3>Fréquence, indice et longueur d'onde</h3>
  <p>Le domaine visible s'étend sur des fréquences \(\nu\) d'environ \(4\times10^{14}\ \text{Hz}\) (rouge) à \(7{,}5\times10^{14}\ \text{Hz}\) (violet). La fréquence est imposée par la source : elle se conserve quand l'onde passe d'un milieu transparent à un autre, et c'est elle qui détermine la couleur perçue.</p>
  <div class="def-box">
    <strong>Indice et longueurs d'onde.</strong> Dans un milieu transparent homogène, la lumière se propage à la vitesse de phase \(v_\varphi\) ; l'<strong>indice</strong> du milieu est \(n = c/v_\varphi \ge 1\). On note \(\lambda_0\) la longueur d'onde dans le vide et \(\lambda\) celle dans le milieu :
    $$\lambda_0=\frac{c}{\nu},\qquad \lambda=\frac{v_\varphi}{\nu}=\frac{\lambda_0}{n},\qquad k=\frac{2\pi}{\lambda}=\frac{2\pi n}{\lambda_0}$$
    \(k\) est le <strong>nombre d'onde</strong> (norme du vecteur d'onde) dans le milieu.
  </div>
  <p>Repères : \(n = 1\) dans le vide, \(n \approx 1{,}0003\) dans l'air (on prend \(n = 1\), sauf quand c'est justement \(n-1\) qu'on mesure), \(1{,}33\) pour l'eau, de \(1{,}5\) à \(1{,}8\) pour les verres. En longueur d'onde dans le vide, le visible va d'environ \(400\ \text{nm}\) à \(750\ \text{nm}\) ; l'œil est le plus sensible vers \(555\ \text{nm}\) (vert-jaune).</p>
  <div class="notice">
    <strong>Convention.</strong> La « longueur d'onde » d'une raie (par exemple \(546{,}1\ \text{nm}\) pour la raie verte du mercure) désigne toujours \(\lambda_0\), mesurée dans le vide. Toutes les formules de déphasage du chapitre s'écrivent avec \(\lambda_0\) <em>et</em> le chemin optique.
  </div>

  <h3>Vibration lumineuse</h3>
  <div class="def-box">
    <strong>Vibration lumineuse.</strong> On représente l'onde en un point \(M\) par une grandeur scalaire \(s(M,t)\), image d'une composante du champ électrique. Une onde <strong>monochromatique</strong> de pulsation \(\omega = 2\pi\nu\) s'écrit :
    $$s(M,t)=a(M)\cos\big(\omega t-\varphi(M)\big)$$
    où \(a(M) \gt 0\) est l'amplitude et \(\varphi(M)\) le <strong>retard de phase</strong> en \(M\) (convention de ce chapitre : \(\varphi\) augmente le long de la propagation). En notation complexe :
    $$\underline{s}(M,t)=\underline{a}(M)\,e^{i\omega t},\qquad \underline{a}(M)=a(M)\,e^{-i\varphi(M)}$$
    et la vibration réelle est \(s = \operatorname{Re}(\underline{s})\).
  </div>
  <p>Le modèle scalaire est légitime lorsque les ondes qui se superposent ont le même état de polarisation, ce qui est le cas d'ondes issues d'une même source et se propageant dans des directions voisines. Sa limite principale : deux ondes polarisées perpendiculairement <strong>n'interfèrent pas</strong>, ce que le modèle scalaire ne peut pas prévoir.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application — Un faisceau orangé entre dans du verre</span>
    <span class="prompt">Une radiation de longueur d'onde \(\lambda_0 = 600\ \text{nm}\) pénètre dans un verre d'indice \(1{,}50\). Que deviennent sa fréquence, sa longueur d'onde et sa couleur ?</span>
    <div class="content">
      <p>La fréquence ne change pas : \(\nu = c/\lambda_0\), soit \(\nu = 5{,}0\times10^{14}\ \text{Hz}\). Dans le verre, \(\lambda = \lambda_0/n = 400\ \text{nm}\). La couleur, liée à \(\nu\), reste orangée : la valeur \(400\ \text{nm}\) dans le verre ne la rend pas violette. C'est pour éviter cette confusion qu'on repère toujours une radiation par \(\lambda_0\).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ÉCLAIREMENT ET DÉTECTEURS</div>
  <h2>Ce que mesure un détecteur : une moyenne quadratique</h2>
  <div class="intro">Aucun détecteur ne suit les oscillations du champ lumineux : la période optique, de l'ordre de \(2\ \text{fs}\), reste au moins mille fois plus courte que le temps de réponse des capteurs les plus rapides, et environ \(10^{13}\) fois plus courte que celui de l'œil. Seule la moyenne du carré de la vibration est accessible.</div>

  <h3>Temps de réponse</h3>
  <p>Pour \(\lambda_0 = 600\ \text{nm}\), la période vaut \(T = \lambda_0/c = 2\times10^{-15}\ \text{s}\). Comparons-la au temps d'intégration \(\tau_R\) de quelques capteurs : la rétine moyenne la lumière sur un vingtième de seconde environ ; un appareil photo ou une caméra intègre pendant son temps de pose (de la microseconde à la seconde) ; une photodiode en silicium répond en une nanoseconde à une microseconde selon son montage ; les photodiodes ultrarapides des télécommunications descendent à quelques picosecondes. Le rapport \(\tau_R/T\) vaut donc au minimum quelques milliers : on a toujours \(\tau_R \gg T\).</p>
  <div class="def-box">
    <strong>Éclairement.</strong> Un capteur délivre un signal proportionnel à la puissance lumineuse qu'il absorbe, moyennée sur \(\tau_R\) ; cette puissance varie comme le <em>carré</em> du champ électrique : on parle de détecteur <strong>quadratique</strong>. On appelle éclairement (ou intensité) au point \(M\) la grandeur
    $$\mathcal{E}(M)=K\,\big\langle s^2(M,t)\big\rangle_{\tau_R}$$
    où les crochets notent une moyenne temporelle sur \(\tau_R\). Le facteur \(K \gt 0\) dépend des unités et du capteur ; il disparaîtra de tous les résultats, qui porteront sur des rapports d'éclairements.
  </div>
  <div class="prop-box">
    <strong>Onde monochromatique.</strong> Comme \(\langle\cos^2(\omega t-\varphi)\rangle = 1/2\) sur une durée très grande devant \(T\) :
    $$\mathcal{E}=\frac{K\,a^2}{2}=\frac{K}{2}\,\underline{s}\,\underline{s}^{*}=\frac{K}{2}\,|\underline{a}|^2$$
  </div>
  <div class="notice">
    <strong>Piège.</strong> Le carré n'est pas une opération linéaire : \((\operatorname{Re} z)^2 \neq \operatorname{Re}(z^2)\). On ne calcule donc jamais un éclairement en remplaçant \(s\) par \(\underline{s}\) dans \(\langle s^2\rangle\) ; on utilise le produit par le complexe conjugué.
  </div>
  <p>Quand on regarde une figure projetée sur un écran blanc, l'œil reçoit la lumière diffusée par l'écran, d'autant plus vive que l'écran est plus éclairé à cet endroit : ce que l'on voit est l'image de la répartition \(\mathcal{E}(M)\) dans le plan de l'écran.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CHEMIN OPTIQUE ET DÉPHASAGE</div>
  <h2>Chemin optique, retard de phase, différence de marche</h2>
  <div class="intro">Le chemin optique traduit un trajet à travers des milieux d'indices différents en la distance que la lumière aurait parcourue dans le vide pendant la même durée. C'est la grandeur centrale de l'optique ondulatoire : toute phase s'en déduit.</div>

  <div class="def-box">
    <strong>Chemin optique.</strong> Le long d'un rayon allant de \(A\) à \(B\), d'abscisse curviligne \(s\), dans un milieu d'indice \(n\) éventuellement variable :
    $$(AB)=\int_A^B n\,\mathrm{d}s = c\,t_{AB}$$
    où \(t_{AB}\) est la durée du trajet. À travers des milieux homogènes successifs d'indices \(n_i\) et d'épaisseurs \(\ell_i\) : \((AB) = \sum_i n_i\,\ell_i\). Le produit \(n\,e\) est l'<strong>épaisseur optique</strong> d'une lame d'épaisseur \(e\).
  </div>
  <div class="prop-box">
    <strong>Retard de phase.</strong> L'onde en \(B\) reproduit, avec le retard \(t_{AB}\), ce qu'elle faisait en \(A\) : \(\varphi(B) = \varphi(A) + \omega\,t_{AB}\). Comme \(\omega/c = 2\pi/\lambda_0\) :
    $$\varphi(B)-\varphi(A)=\frac{2\pi}{\lambda_0}\,(AB)$$
    d'où, pour une source ponctuelle \(S\) de phase \(\varphi_S\) :
    $$\varphi(M)=\varphi_S+\frac{2\pi}{\lambda_0}\,(SM)$$
  </div>
  <div class="def-box">
    <strong>Différence de marche et déphasage.</strong> Deux ondes issues d'une même source \(S\) atteignent \(M\) par deux trajets (1) et (2). On définit la <strong>différence de marche</strong> \(\delta(M)\) et le <strong>déphasage</strong> \(\Delta\varphi(M)\) :
    $$\delta(M)=(SM)_2-(SM)_1$$
    $$\Delta\varphi(M)=\varphi_2(M)-\varphi_1(M)=\frac{2\pi}{\lambda_0}\,\delta(M)$$
  </div>

  <h3>Déphasages supplémentaires</h3>
  <p>À la phase de propagation s'ajoutent parfois des sauts de phase :</p>
  <ul>
    <li><strong>réflexion sur un milieu plus réfringent</strong> (air → verre, « réflexion vitreuse ») : déphasage de \(\pi\), équivalent à un chemin optique supplémentaire de \(\lambda_0/2\). En revanche, une réflexion vue depuis le milieu le plus réfringent (verre → air) et la traversée d'un dioptre n'ajoutent aucun saut de phase ;</li>
    <li><strong>réflexion sur un métal</strong> (modèle du conducteur parfait) : déphasage de \(\pi\) également ;</li>
    <li><strong>passage par un point de convergence</strong> : déphasage de \(\pi\) (résultat admis, rarement utile car il concerne souvent les deux voies).</li>
  </ul>
  <div class="notice">
    Ces termes n'interviennent dans \(\delta\) que s'ils <strong>diffèrent</strong> entre les deux voies : si chaque onde subit une réflexion métallique, les deux \(\pi\) se compensent.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application — Une lame de verre sur l'une des deux voies</span>
    <span class="prompt">Lame d'indice \(n = 1{,}50\) et d'épaisseur \(e = 0{,}10\ \text{mm}\), traversée en incidence normale. Quelle différence de marche introduit-elle ? Combien de longueurs d'onde pour \(\lambda_0 = 500\ \text{nm}\) ?</span>
    <div class="content">
      <p>La lame remplace une épaisseur \(e\) d'air (\(n \approx 1\)) par du verre : le chemin optique de cette voie augmente de \((n-1)\,e = 0{,}50\times0{,}10\ \text{mm} = 50\ \mu\text{m}\), soit \(50\ \mu\text{m}/0{,}500\ \mu\text{m} = 100\) longueurs d'onde. Une lame banale décale l'ordre d'interférence d'une centaine d'unités.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SURFACES D'ONDE ET THÉORÈME DE MALUS</div>
  <h2>Ondes sphériques, ondes planes et rôle des lentilles</h2>
  <div class="intro">Relier les rayons de l'optique géométrique aux surfaces d'égale phase permet de calculer une différence de marche sans suivre chaque rayon à travers une lentille : c'est tout l'intérêt du théorème de Malus.</div>

  <div class="def-box">
    <strong>Surface d'onde.</strong> Pour une source ponctuelle \(S\), on appelle surface d'onde toute surface sur laquelle le chemin optique \((SM)\) garde une valeur fixée. La lumière émise par \(S\) à un instant donné atteint tous ses points au même moment ; en régime monochromatique, la phase y est donc uniforme (surface <strong>équiphase</strong>).
  </div>
  <div class="prop-box">
    <strong>Théorème de Malus</strong> (admis). Quels que soient les dioptres et miroirs rencontrés, chaque rayon issu d'une source ponctuelle coupe les surfaces d'onde à angle droit. Corollaire : si \(\Sigma_1\) et \(\Sigma_2\) sont deux surfaces d'onde, le chemin optique compté de \(\Sigma_1\) à \(\Sigma_2\) prend la même valeur sur chaque rayon.
  </div>

  <h3>Onde sphérique</h3>
  <p>Plaçons une source ponctuelle \(S\) dans un milieu homogène : la lumière s'en éloigne en ligne droite dans toutes les directions et l'égalité \((SM) = n\,SM = \text{cte}\) définit des sphères centrées sur \(S\). L'énergie se répartit sur des sphères de plus en plus grandes : à puissance conservée, l'éclairement varie en \(1/r^2\), donc l'amplitude en \(1/r\) :</p>
  <div class="formula">$$s(M,t)=\frac{A}{r}\cos\big(\omega t-\varphi_S-k\,r\big)$$</div>
  <p>avec \(r = SM\) et \(k = 2\pi n/\lambda_0\). Le retard \(kr\) croît en s'éloignant de \(S\) : l'onde est <strong>divergente</strong>. Le signe opposé, \(+k\,r'\) avec \(r'\) la distance à un point \(A'\), décrit une onde qui se referme sur \(A'\) (onde <strong>convergente</strong>, typiquement en sortie d'une lentille qui forme l'image \(A'\)). Si le récepteur est petit devant sa distance à \(S\), le facteur \(1/r\) y varie très peu et l'on traite l'amplitude comme constante.</p>

  <h3>Onde plane</h3>
  <p>Loin de la source, une portion de sphère de très grand rayon devient pratiquement plane : c'est l'onde plane, modèle idéal d'extension infinie. On la réalise en pratique en plaçant un point source au foyer objet d'une lentille convergente (collimateur) ; la lumière d'une étoile et, dans une certaine mesure, un faisceau laser en sont de bonnes approximations. Tous les rayons ont la même direction, celle d'un vecteur unitaire \(\vec u\), et les plans normaux à \(\vec u\) sont les surfaces d'onde :</p>
  <div class="formula">$$s(M,t)=a\cos\big(\omega t-\varphi_O-\vec k\cdot\overrightarrow{OM}\big)$$</div>
  <p>avec \(\vec k = k\,\vec u\), \(k = 2\pi n/\lambda_0\), et \(\varphi_O\) le retard de phase au point origine \(O\). L'énergie ne se dilue plus : en l'absence d'absorption, \(a\) est indépendante de \(M\).</p>

  <h3>Lentilles et stigmatisme</h3>
  <div class="prop-box">
    <strong>Chemin optique entre points conjugués.</strong> Si un système est rigoureusement stigmatique pour le couple \((A, A')\), l'onde sphérique centrée sur \(A\) ressort sphérique centrée sur \(A'\) : d'après le théorème de Malus, \((AA')\) a la même valeur pour <strong>tous</strong> les rayons joignant \(A\) à \(A'\). Ainsi, dans les conditions de Gauss :
    <ul style="margin:.4rem 0">
      <li>une source ponctuelle au foyer objet d'une lentille convergente donne une onde plane (figure) ;</li>
      <li>une onde plane converge en un foyer (principal ou secondaire) : le chemin optique d'un plan d'onde incident jusqu'à ce foyer est le même pour tous les rayons ;</li>
      <li>une lentille n'introduit aucune différence de marche entre deux rayons qui se rejoignent au même point image.</li>
    </ul>
  </div>

    <span class="prompt">Deux rayons parallèles, inclinés de \(\theta\) sur l'axe, partent de deux points \(A_1\) et \(A_2\) distants de \(a\) dans un plan orthogonal à l'axe, puis convergent en un foyer secondaire. Quelle est leur différence de marche, dans un milieu d'indice \(n\) ?</span>
    <div class="content">
      <p>Le plan d'onde passant par \(A_2\) est orthogonal aux rayons ; il coupe le rayon issu de \(A_1\) en \(H\). D'après le théorème de Malus et le stigmatisme, les chemins optiques de \(A_2\) et de \(H\) jusqu'au foyer sont égaux. La différence de marche se réduit donc au segment \(A_1H\), projection de \(\overrightarrow{A_1A_2}\) sur la direction des rayons : \(|\delta| = n\,a\sin\theta\). Ce résultat sert pour les trous d'Young observés à l'infini et pour les réseaux.</p>

<div class="course-section">
  <div class="sec-num">§5 · SOURCES RÉELLES : COHÉRENCE TEMPORELLE</div>
  <h2>Trains d'onde et largeur spectrale</h2>
  <div class="intro">La sinusoïde parfaite du modèle monochromatique n'a ni début ni fin. Celle d'une vraie source se « recale » sans cesse : on ne peut prédire sa phase que sur un intervalle de temps limité. C'est la première limite à l'observation des interférences.</div>

  <h3>Modèle des trains d'onde</h3>
  <p>Dans une lampe, chaque atome émet de façon indépendante et son émission est interrompue (désexcitation, chocs). On modélise la vibration émise par un point de la source comme une succession de tronçons sinusoïdaux de même pulsation \(\omega\) : la phase \(\varphi_S\) est constante pendant un tronçon et prend une valeur <strong>aléatoire</strong> au tronçon suivant.</p>
  <div class="def-box">
    <strong>Durée et longueur de cohérence.</strong> On note \(\tau_c\) (<strong>durée de cohérence</strong>) la durée moyenne pendant laquelle la phase de la source reste fixe, et \(L_c = c\,\tau_c\) (<strong>longueur de cohérence</strong>) la distance que la lumière parcourt dans le vide pendant ce temps. Observée sur un intervalle bien plus court que \(\tau_c\), la source paraît monochromatique ; sur un intervalle bien plus long, sa phase est imprévisible.
  </div>
  <div class="prop-box">
    <strong>Largeur spectrale.</strong> Un signal sinusoïdal de durée finie \(\tau_c\) n'est pas monochromatique : son spectre occupe une bande de fréquences de largeur \(\Delta\nu\) telle que
    $$\Delta\nu\approx\frac{1}{\tau_c}\qquad\Longleftrightarrow\qquad L_c=c\,\tau_c\approx\frac{c}{\Delta\nu}\approx\frac{\lambda_0^{2}}{\Delta\lambda_0}$$
    La dernière égalité découle de \(\nu = c/\lambda_0\) : \(|\mathrm{d}\nu| = c\,|\mathrm{d}\lambda_0|/\lambda_0^2\), valable pour \(\Delta\lambda_0 \ll \lambda_0\).
  </div>
  <p>Le modèle des trains d'onde n'est qu'une image commode. Une lampe à incandescence n'émet pas de « trains » identifiables, mais un spectre continu : pour les interférences, seule importe sa largeur \(\Delta\nu\), et la relation ci-dessus lui attribue une longueur de cohérence. Spectre fin et cohérence longue vont toujours ensemble ; le laser idéal correspond à \(\Delta\nu \to 0\).</p>

  <h3>Ordres de grandeur</h3>
  <p>Le tableau donne, pour quelques sources rencontrées en TP ou dans la vie courante, la largeur spectrale typique, la longueur de cohérence qui s'en déduit et le nombre \(L_c/\lambda_0\) de franges que l'on peut espérer voir autour de \(\delta = 0\). Les valeurs sont indicatives (elles dépendent beaucoup du modèle de source).</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Source</th><th style="padding:.35rem;border:1px solid var(--grid)">Largeur</th><th style="padding:.35rem;border:1px solid var(--grid)">\(L_c\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(L_c/\lambda_0\)</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Lampe à incandescence, Soleil (tout le visible)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\lambda_0\approx350\ \text{nm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx0{,}9\ \mu\text{m}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(1\) à \(2\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">DEL rouge (\(630\ \text{nm}\))</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\lambda_0\approx20\ \text{nm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx20\ \mu\text{m}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx30\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Lumière blanche + filtre interférentiel étroit</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\lambda_0\approx5\ \text{nm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx60\ \mu\text{m}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx100\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Lampe spectrale à haute pression (raies élargies)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\lambda_0\approx0{,}5\ \text{nm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx0{,}6\ \text{mm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx10^3\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Raie isolée d'une lampe à basse pression (Hg, Cd…)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\nu\approx2\) à \(5\ \text{GHz}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(6\) à \(15\ \text{cm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx10^5\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Laser He-Ne de TP (deux ou trois modes)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\nu\approx1{,}5\ \text{GHz}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx20\ \text{cm}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\approx3\times10^5\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Laser monofréquence stabilisé</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta\nu\lesssim1\ \text{MHz}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\gtrsim300\ \text{m}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">plus de \(10^8\)</td></tr>
  </table></div>
  <p>La durée de cohérence s'en déduit par \(\tau_c = L_c/c\) : \(1\ \mu\text{m}\) correspond à environ \(3\ \text{fs}\), \(1\ \text{mm}\) à \(3\ \text{ps}\), \(1\ \text{m}\) à \(3\ \text{ns}\).</p>

  <div class="prop-box">
    <strong>Conséquence pour les interférences.</strong> Deux ondes issues d'un même point source et arrivant en \(M\) avec une différence de marche \(\delta\) ont été émises à des instants séparés de \(|\delta|/c\). Elles proviennent du même train, donc ont un déphasage stable, si
    $$|\delta(M)|\lesssim L_c$$
    Au-delà, leur déphasage varie aléatoirement et les franges disparaissent progressivement. Le nombre de franges observables est de l'ordre de \(L_c/\lambda_0 = \lambda_0/\Delta\lambda_0\) : à peine quelques-unes, irisées, en lumière blanche, de l'ordre de \(10^5\) avec une raie de lampe à basse pression.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application — Raie rouge de l'hydrogène</span>
    <span class="prompt">La raie a pour longueur d'onde \(\lambda_0 = 656\ \text{nm}\) et pour largeur \(\Delta\nu = 6\ \text{GHz}\). Calculer \(\tau_c\), \(L_c\) et \(\Delta\lambda_0\).</span>
    <div class="content">
      <p>\(\tau_c = 1/\Delta\nu \approx 1{,}7\times10^{-10}\ \text{s}\) ; \(L_c = c\,\tau_c = c/\Delta\nu = 5\ \text{cm}\) ; \(\Delta\lambda_0 = \lambda_0^2\,\Delta\nu/c\), soit \(\Delta\lambda_0 \approx 8{,}6\ \text{pm}\). On pourra observer des franges tant que \(|\delta|\) reste inférieur à quelques centimètres.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · COHÉRENCE SPATIALE</div>
  <h2>Source étendue : une foule de sources ponctuelles incohérentes</h2>
  <div class="intro">Le point source est une idéalisation : un filament, une décharge ou une fente éclairée ont toujours une certaine taille, et leurs atomes émettent sans se concerter. C'est la seconde limite, après la cohérence temporelle.</div>

  <div class="def-box">
    <strong>Modèle de la source étendue.</strong> On découpe la source en éléments assez petits pour être traités comme ponctuels, \(S_1, S_2, \dots\) ; la phase de chacun évolue au hasard, sans lien avec celle des autres. Deux éléments distincts d'une même source sont donc <strong>incohérents</strong> entre eux, et a fortiori deux sources séparées (deux lampes, deux lasers indépendants).
  </div>
  <div class="prop-box">
    <strong>Additivité des éclairements.</strong> Les ondes issues de deux sources incohérentes n'interfèrent pas : leurs éclairements s'ajoutent. Pour une source étendue, chaque point \(S_j\) produit sa propre figure d'interférences \(\mathcal{E}_j(M)\) (en divisant sa propre onde), et l'on observe la somme :
    $$\mathcal{E}(M)=\sum_j \mathcal{E}_j(M)$$
    (ou une intégrale sur la surface de la source).
  </div>
  <p>Si les figures données par les différents points coïncident, les franges restent bien contrastées et sont simplement plus lumineuses. Si elles sont décalées les unes par rapport aux autres d'une fraction notable d'interfrange, les franges brillantes des unes recouvrent les franges sombres des autres : c'est le <strong>brouillage</strong>, le contraste chute. En ordre de grandeur, il faut que l'ordre d'interférence en \(M\) varie de moins de \(1/2\) environ quand le point source parcourt toute la source.</p>
  <div class="notice">
    <strong>Conséquence pratique.</strong> Pour obtenir des interférences, il faut diviser l'onde issue d'un <em>même</em> point source en deux (ou plusieurs) ondes qui se recombinent ensuite : par <strong>division du front d'onde</strong> (trous ou fentes d'Young, réseau) ou par <strong>division d'amplitude</strong> (lame séparatrice, interféromètre de Michelson, lames minces). L'étude détaillée de ces dispositifs, de la largeur de source tolérable et de la localisation des franges fait l'objet du chapitre « Dispositifs interférentiels ».
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SUPERPOSITION DE DEUX ONDES</div>
  <h2>Les vibrations s'ajoutent, pas les éclairements</h2>
  <div class="intro">Les équations de Maxwell sont linéaires : les vibrations de deux ondes qui se superposent s'ajoutent. Mais le détecteur mesure un carré : l'éclairement de la somme n'est pas, en général, la somme des éclairements. L'écart est le terme d'interférence.</div>

  <div class="prop-box">
    <strong>Superposition.</strong> En un point \(M\) atteint par deux ondes, \(s(M,t) = s_1(M,t) + s_2(M,t)\). En développant le carré :
    $$\mathcal{E}(M)=\mathcal{E}_1(M)+\mathcal{E}_2(M)+2K\,\langle s_1\,s_2\rangle$$
    \(\mathcal{E}_1\) (resp. \(\mathcal{E}_2\)) se mesure en masquant l'onde 2 (resp. 1). Toute la physique des interférences tient dans le terme croisé \(2K\langle s_1 s_2\rangle\) : on parle d'<strong>interférences</strong> quand il ne s'annule pas.
  </div>

  <h3>Calcul du terme d'interférence</h3>
  <p>Avec \(s_1 = a_1\cos(\omega_1 t-\varphi_1)\) et \(s_2 = a_2\cos(\omega_2 t-\varphi_2)\), la relation \(2\cos p\cos q = \cos(p+q)+\cos(p-q)\) donne :</p>
  <div class="formula">$$2\langle s_1s_2\rangle=a_1a_2\big[\langle\cos\theta_+(t)\rangle+\langle\cos\theta_-(t)\rangle\big]$$
  $$\theta_\pm(t)=(\omega_1\pm\omega_2)\,t-(\varphi_1\pm\varphi_2)$$</div>
  <p>Le premier terme, en \(\theta_+\), oscille à la pulsation \(\omega_1+\omega_2\), voisine de \(2\omega\) (quelques \(10^{15}\ \text{rad·s}^{-1}\)) : sa moyenne est nulle. Pour le second, en \(\theta_-\) :</p>
  <ul>
    <li>si \(\omega_1 \neq \omega_2\) avec \(|\omega_1-\omega_2|\,\tau_R \gg 1\) (toujours vrai pour deux sources différentes et un détecteur usuel), sa moyenne est nulle : \(\mathcal{E} = \mathcal{E}_1 + \mathcal{E}_2\) ;</li>
    <li>si \(\omega_1 = \omega_2\) et si \(\varphi_2 - \varphi_1\) reste constant pendant \(\tau_R\), il vaut \(\cos(\varphi_2-\varphi_1)\) ;</li>
    <li>si \(\omega_1 = \omega_2\) mais que \(\varphi_2-\varphi_1\) varie aléatoirement pendant \(\tau_R\) (sources incohérentes), sa moyenne est nulle.</li>
  </ul>
  <div class="prop-box">
    <strong>Formule de Fresnel.</strong> Pour deux ondes de même fréquence et <strong>mutuellement cohérentes</strong> (déphasage indépendant du temps à l'échelle de \(\tau_R\)) :
    $$\mathcal{E}(M)=\mathcal{E}_1+\mathcal{E}_2+2\sqrt{\mathcal{E}_1\mathcal{E}_2}\,\cos\Delta\varphi(M)$$
    avec \(\Delta\varphi(M) = 2\pi\,\delta(M)/\lambda_0\).
  </div>

  <p>En notation complexe, le calcul est immédiat : \(\mathcal{E} = \frac{K}{2}\,|\underline{a}_1+\underline{a}_2|^2\), soit \(\mathcal{E} = \mathcal{E}_1+\mathcal{E}_2+K\operatorname{Re}(\underline{a}_1\underline{a}_2^*)\), avec \(\underline{a}_1\underline{a}_2^* = a_1a_2\,e^{i(\varphi_2-\varphi_1)}\).</p>

  <h3>Conditions d'obtention d'interférences</h3>
  <div class="prop-box">
    Deux ondes donnent en \(M\) une figure d'interférences stable si :
    <ol style="margin:.4rem 0">
      <li>elles ont la <strong>même fréquence</strong> ;</li>
      <li>elles sont <strong>mutuellement cohérentes</strong> : issues d'un même point source par division de son onde, avec \(|\delta| \lesssim L_c\) pour appartenir au même train ;</li>
      <li>leurs polarisations ne sont pas orthogonales (le modèle scalaire les suppose identiques).</li>
    </ol>
    Sinon, les éclairements s'ajoutent : \(\mathcal{E} = \mathcal{E}_1 + \mathcal{E}_2\).
  </div>
  <div class="notice">
    <strong>Battements.</strong> L'absence d'interférences entre deux fréquences différentes est relative au détecteur. Deux lasers dont les fréquences diffèrent de \(\Delta f\) (du MHz au GHz) donnent un terme croisé qui oscille à \(\Delta f\) : une photodiode de temps de réponse \(\tau_R \ll 1/\Delta f\) enregistre ces battements (détection hétérodyne), alors que l'œil ne voit que \(\mathcal{E}_1 + \mathcal{E}_2\).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ORDRE D'INTERFÉRENCE, FRANGES ET CONTRASTE</div>
  <h2>Lire une figure d'interférences</h2>
  <div class="intro">D'après la formule de Fresnel, l'éclairement oscille entre deux valeurs extrêmes quand \(M\) se déplace. L'ordre d'interférence permet de compter les franges ; le contraste mesure leur visibilité.</div>

  <div class="def-box">
    <strong>Ordre d'interférence.</strong> \(p(M) = \dfrac{\Delta\varphi(M)}{2\pi} = \dfrac{\delta(M)}{\lambda_0}\) (déphasages supplémentaires inclus).
    <ul style="margin:.4rem 0">
      <li>interférences <strong>constructives</strong> (frange brillante) : \(p \in \mathbb{Z}\), \(\mathcal{E}_{max} = \big(\sqrt{\mathcal{E}_1}+\sqrt{\mathcal{E}_2}\big)^2\) ;</li>
      <li>interférences <strong>destructives</strong> (frange sombre) : \(p \in \mathbb{Z}+\frac12\), \(\mathcal{E}_{min} = \big(\sqrt{\mathcal{E}_1}-\sqrt{\mathcal{E}_2}\big)^2\).</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Franges et interfrange.</strong> Une <strong>frange</strong> est le lieu des points de même ordre \(p\) (surface dans l'espace, ligne sur un écran). Quand les franges sont périodiques, l'<strong>interfrange</strong> \(i\) est leur période spatiale : le déplacement de \(M\) qui augmente \(p\) d'une unité (et \(\delta\) de \(\lambda_0\)), par exemple du centre d'une frange brillante au centre de la suivante.
  </div>
  <div class="def-box">
    <strong>Contraste</strong> (ou facteur de visibilité) :
    $$\Gamma=\frac{\mathcal{E}_{max}-\mathcal{E}_{min}}{\mathcal{E}_{max}+\mathcal{E}_{min}}\in[0\,;1]$$
  </div>
  <div class="prop-box">
    <strong>Contraste de deux ondes cohérentes.</strong>
    $$\Gamma=\frac{2\sqrt{\mathcal{E}_1\mathcal{E}_2}}{\mathcal{E}_1+\mathcal{E}_2}$$
    $$\mathcal{E}(M)=(\mathcal{E}_1+\mathcal{E}_2)\big[1+\Gamma\cos\Delta\varphi(M)\big]$$
    \(\Gamma = 1\) si et seulement si \(\mathcal{E}_1 = \mathcal{E}_2\) : les franges sombres sont alors parfaitement noires (« lumière + lumière = obscurité »). Le contraste est peu sensible au rapport des éclairements : \(\mathcal{E}_1/\mathcal{E}_2 = 4\) donne encore \(\Gamma = 0{,}8\), et \(\mathcal{E}_1/\mathcal{E}_2 = 9\) donne \(\Gamma = 0{,}6\).
  </div>
  <div class="method-box">
    <strong>Exemple — contraste de deux faisceaux inégaux</strong>
    <p>Un dispositif divise une onde en deux faisceaux cohérents dont les éclairements, mesurés séparément, valent \(\mathcal E_1 = 4\ \text{W·m}^{-2}\) et \(\mathcal E_2 = 1\ \text{W·m}^{-2}\).</p>
    <ol>
      <li>Contraste : \(\Gamma = \dfrac{2\sqrt{4\times1}}{4+1} = 0{,}8\) : les franges restent très bien visibles malgré un rapport 4.</li>
      <li>Extrêmes : \(\mathcal E_{max} = (\sqrt4 + \sqrt1)^2 = 9\ \text{W·m}^{-2}\) et \(\mathcal E_{min} = (2-1)^2 = 1\ \text{W·m}^{-2}\) : on vérifie \(\Gamma = (9-1)/(9+1)\).</li>
      <li>Si les deux faisceaux étaient incohérents, l'écran serait uniformément éclairé à \(5\ \text{W·m}^{-2}\) : les interférences ne créent ni ne détruisent d'énergie, elles la <strong>redistribuent</strong> entre franges brillantes et sombres (la moyenne spatiale reste \(\mathcal E_1 + \mathcal E_2\)).</li>
    </ol>
  </div>

  <p>La moyenne de \(\mathcal{E}\) sur une frange vaut \(\mathcal{E}_1+\mathcal{E}_2\) : les interférences <strong>redistribuent</strong> l'énergie lumineuse dans l'espace, sans en créer ni en détruire.</p>

  <h3>Géométrie des franges : deux ondes planes</h3>
  <p>Deux ondes planes cohérentes de même fréquence, de vecteurs d'onde \(\vec k_1\) et \(\vec k_2\) de même norme \(k = 2\pi n/\lambda_0\) faisant entre eux l'angle \(\alpha\), et en phase en \(O\), présentent en \(M\) le déphasage \(\Delta\varphi(M) = (\vec k_2-\vec k_1)\cdot\overrightarrow{OM}\). Les franges sont des <strong>plans orthogonaux à \(\vec k_2-\vec k_1\)</strong>, donc des droites parallèles et équidistantes sur un écran. Comme \(\|\vec k_2-\vec k_1\| = 2k\sin(\alpha/2)\) :</p>
  <div class="formula">$$i=\frac{2\pi}{\|\vec k_2-\vec k_1\|}=\frac{\lambda_0}{2n\sin(\alpha/2)}$$</div>
  <p>Par exemple, dans l'air avec \(\lambda_0 = 500\ \text{nm}\) et \(\alpha = 1^\circ\) : \(i \approx 29\ \mu\text{m}\). De telles franges se lisent au microscope ou sur un capteur d'images (exercice 4) ; pour une interfrange millimétrique, lisible à l'œil, il faudrait diviser \(\alpha\) par une trentaine.</p>

  <h3>Géométrie des franges : deux sources ponctuelles</h3>
  <p>Deux sources ponctuelles cohérentes \(S_1\) et \(S_2\), en phase, dans un milieu homogène d'indice \(n\), donnent \(\delta(M) = n\,(S_2M - S_1M)\). La condition \(S_2M - S_1M = \text{cte}\) définit une nappe d'<strong>hyperboloïde de révolution</strong> autour de la droite \(S_1S_2\) (les deux sources en sont les foyers) ; la figure dépend donc de l'orientation de l'écran :</p>
  <ul>
    <li>sur un écran éloigné <strong>parallèle</strong> à \(S_1S_2\) (distance \(D \gg a = S_1S_2\)), les traces sont des droites quasi équidistantes, orthogonales à \(S_1S_2\) : \(\delta \approx n\,a\,x/D\) et \(i = \lambda_0 D/(n\,a)\). C'est la situation des trous d'Young, étudiée au chapitre suivant ;</li>
    <li>sur un écran <strong>perpendiculaire</strong> à \(S_1S_2\), on observe des anneaux concentriques centrés sur l'axe.</li>
  </ul>

<div class="course-section">
  <div class="sec-num">§9 · SUPERPOSITION DE N ONDES</div>
  <h2>N ondes déphasées régulièrement : des franges plus fines</h2>
  <div class="intro">Superposer davantage d'ondes cohérentes, avec un déphasage constant de l'une à la suivante, concentre la lumière dans des franges brillantes très étroites. C'est le principe du réseau de diffraction et des antennes à commande de phase.</div>

  <p>On considère \(N\) ondes de même fréquence, mutuellement cohérentes, de même amplitude \(a\) en \(M\), l'onde numéro \(k\) (\(k = 0, \dots, N-1\)) ayant sur la première un retard de phase \(k\,\psi\) : \(\underline{s}_k = a\,e^{i(\omega t - k\psi)}\). La somme est géométrique, de raison \(e^{-i\psi}\) :</p>
  <div class="formula">$$\underline{s}=a\,e^{i\omega t}\sum_{k=0}^{N-1}e^{-ik\psi}=a\,e^{i\omega t}\,\frac{1-e^{-iN\psi}}{1-e^{-i\psi}}$$</div>
  <p>En factorisant \(e^{-iN\psi/2}\) au numérateur et \(e^{-i\psi/2}\) au dénominateur, on obtient \(|1-e^{-iN\psi}| = 2\,|\sin(N\psi/2)|\) et \(|1-e^{-i\psi}| = 2\,|\sin(\psi/2)|\).</p>
  <div class="prop-box">
    <strong>Éclairement de N ondes.</strong> En notant \(\mathcal{E}_0 = K a^2/2\) l'éclairement d'une onde seule :
    $$\mathcal{E}(\psi)=\mathcal{E}_0\,\frac{\sin^2(N\psi/2)}{\sin^2(\psi/2)}$$
    <ul style="margin:.4rem 0">
      <li><strong>maxima principaux</strong> pour \(\psi = 2\pi m\), \(m\in\mathbb{Z}\) (toutes les ondes en phase, ordre \(p = m\)) : \(\mathcal{E} = N^2\,\mathcal{E}_0\) ;</li>
      <li><strong>zéros</strong> pour \(\psi = 2\pi q/N\), \(q\) non multiple de \(N\) : \(N-1\) zéros entre deux maxima principaux, séparés par \(N-2\) maxima secondaires, faibles (le premier vaut environ \(4{,}7\ \%\) du maximum principal quand \(N\) est grand) ;</li>
      <li><strong>demi-largeur</strong> d'un pic principal (écart au premier zéro) : \(\Delta\psi = 2\pi/N\). La finesse des franges (période sur largeur) croît comme \(N\) ;</li>
      <li><strong>valeur moyenne</strong> sur une période : \(N\,\mathcal{E}_0\), comme pour \(N\) ondes incohérentes. L'énergie se concentre dans des pics de hauteur \(N^2\) et de largeur en \(1/N\).</li>
    </ul>
  </div>
  <p>Pour \(N = 2\), on retrouve \(\mathcal{E} = 4\mathcal{E}_0\cos^2(\psi/2) = 2\mathcal{E}_0(1+\cos\psi)\) : la formule de Fresnel avec \(\Gamma = 1\).</p>

  <h3>Illustration numérique</h3>
  <p>On vérifie le profil en sommant directement les amplitudes complexes avec <span class="code-inline">numpy</span>, sans utiliser la formule fermée :</p>
<pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt

N = 8                                         <span class="cmt"># nombre d'ondes</span>
psi = np.linspace(-np.pi, 3*np.pi, 2001)      <span class="cmt"># déphasage entre ondes voisines</span>
k = np.arange(N).reshape(-1, 1)               <span class="cmt"># numéros des ondes (en colonne)</span>
somme = np.exp(-1j*k*psi).sum(axis=0)         <span class="cmt"># somme des amplitudes complexes (a = 1)</span>
E = np.abs(somme)**2                          <span class="cmt"># éclairement, à K/2 près</span>
plt.plot(psi, E/N**2)                         <span class="cmt"># pics principaux ramenés à 1</span>
plt.xlabel("psi (rad)"); plt.ylabel("E / Emax")
plt.show()</pre>
  <div class="notice">
    <strong>Applications.</strong> Le <strong>réseau</strong> (fentes équidistantes de pas \(a\), éclairées sous l'incidence \(\theta_0\)) correspond à \(\psi = 2\pi a(\sin\theta-\sin\theta_0)/\lambda_0\) : ses maxima principaux, très fins, ont une direction qui dépend de \(\lambda_0\), d'où son usage en spectroscopie. Les antennes et les LiDAR à <strong>commande de phase</strong> exploitent le même résultat (exercice 6).

<div class="course-section">
  <div class="sec-num">MÉTHODES · ONDES LUMINEUSES ET INTERFÉRENCES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>

  <div class="method-box">
    <strong>Méthode 1 — Calculer un chemin optique et une différence de marche</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Tracer.</span> Dessiner les deux trajets de la source \(S\) au point \(M\) et repérer la partie commune, qui s'élimine dans la différence.</li>
      <li><span class="step">Découper.</span> Sur chaque trajet, \((SM) = \sum_i n_i\,\ell_i\) pour des milieux homogènes ; \(\int n\,\mathrm{d}s\) si l'indice varie.</li>
      <li><span class="step">Simplifier.</span> Entre deux points d'une même surface d'onde, ou entre deux points conjugués par une lentille, il n'y a rien à calculer (Méthode 2).</li>
      <li><span class="step">Compléter.</span> Ajouter \(\lambda_0/2\) pour chaque réflexion vitreuse ou métallique subie par une seule des deux ondes.</li>
      <li><span class="step">Conclure.</span> \(\delta = (SM)_2-(SM)_1\), puis \(\Delta\varphi = 2\pi\delta/\lambda_0\) et \(p = \delta/\lambda_0\).</li>
    </ol>
    <p style="margin:.4rem 0 0"><em>Piège :</em> on associe \(\lambda_0\) au chemin optique, ou \(\lambda = \lambda_0/n\) à la distance géométrique dans le milieu ; jamais \(\lambda\) avec le chemin optique.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Exploiter le théorème de Malus avec une lentille</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Identifier l'onde.</span> Point source au foyer objet → onde plane ; onde plane inclinée de \(\theta\) → convergence au foyer secondaire correspondant.</li>
      <li><span class="step">Tracer un plan d'onde.</span> Pour deux rayons parallèles, tracer le plan orthogonal aux rayons passant par le point de départ de l'un d'eux.</li>
      <li><span class="step">Lire la différence.</span> Seul compte le segment compris entre ce plan et le point de départ de l'autre rayon : pour deux points distants de \(a\) dans un plan orthogonal à l'axe, \(|\delta| = n\,a\sin\theta\).</li>
      <li><span class="step">Ne rien ajouter pour la lentille.</span> Elle n'introduit aucune différence de marche entre rayons qui se rejoignent au même point image.</li>
    </ol>
    <p style="margin:.4rem 0 0"><em>Piège :</em> ne pas chercher à calculer les épaisseurs de verre traversées dans la lentille : elles varient d'un rayon à l'autre, mais Malus garantit que le total est le même.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Calculer un éclairement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Notation réelle.</span> Écrire \(s = \sum_j s_j\), développer \(s^2\), puis moyenner chaque terme : \(\langle\cos^2(\omega t-\varphi)\rangle = 1/2\), \(\langle\cos(\omega t-\varphi)\rangle = 0\), et un produit de deux cosinus de pulsations différentes a une moyenne nulle.</li>
      <li><span class="step">Notation complexe.</span> Écrire les amplitudes complexes \(\underline{a}_j = a_j\,e^{-i\varphi_j}\), les sommer, puis \(\mathcal{E} = \frac{K}{2}\big|\sum_j\underline{a}_j\big|^2\).</li>
      <li><span class="step">Normaliser.</span> Exprimer le résultat en fonction de l'éclairement d'une onde seule (\(\mathcal{E}_0\), \(\mathcal{E}_1\), \(\mathcal{E}_2\)) : la constante \(K\) disparaît.</li>
      <li><span class="step">Contrôler.</span> \(\mathcal{E} \ge 0\) partout, et sa moyenne spatiale vaut la somme des éclairements séparés.</li>
    </ol>
    <p style="margin:.4rem 0 0"><em>Piège :</em> \(K\langle\underline{s}^2\rangle\) n'a aucun sens ; seul le produit \(\underline{s}\,\underline{s}^*\) donne l'éclairement.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Décider si deux ondes interfèrent</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Origine.</span> Les deux ondes proviennent-elles du même point source, par division du front d'onde ou de l'amplitude ? Sinon : incohérentes, \(\mathcal{E} = \mathcal{E}_1+\mathcal{E}_2\).</li>
      <li><span class="step">Fréquence.</span> Une source polychromatique se traite composante par composante : chaque fréquence n'interfère qu'avec elle-même, et l'on somme les éclairements sur le spectre.</li>
      <li><span class="step">Cohérence temporelle.</span> Comparer la différence de marche maximale du dispositif à \(L_c\) : franges seulement là où \(|\delta| \lesssim L_c\).</li>
      <li><span class="step">Cohérence spatiale.</span> Si la source est étendue, regarder comment l'ordre en \(M\) varie quand le point source se déplace sur la source (brouillage si la variation dépasse \(1/2\) environ).</li>
      <li><span class="step">Polarisation.</span> Deux ondes polarisées perpendiculairement n'interfèrent pas.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Déterminer la géométrie des franges et l'interfrange</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Exprimer δ(M).</span> En fonction des coordonnées de \(M\), avec des développements limités pour un écran éloigné : \(\sqrt{1+\varepsilon} \approx 1+\varepsilon/2\).</li>
      <li><span class="step">Lignes de niveau.</span> Les franges sont les lieux \(\delta(M) = \text{cte}\) : plans ou droites (deux ondes planes), hyperboloïdes vus comme droites ou anneaux (deux sources ponctuelles), cercles \(r^2 = \text{cte}\) (onde plane et onde sphérique coaxiales).</li>
      <li><span class="step">Interfrange.</span> Imposer \(\Delta\delta = \lambda_0\) (soit \(\Delta p = 1\)). Si \(\delta\) est affine en \(x\) : \(i = \lambda_0/|\mathrm{d}\delta/\mathrm{d}x|\). Si \(\delta - \delta_0\) varie comme \(r^2\), le rayon de l'anneau d'ordre \(p\) varie comme \(\sqrt{|p-p_c|}\) (\(p_c\) : ordre au centre) : les anneaux se resserrent en s'éloignant du centre.</li>
      <li><span class="step">Ordre de grandeur.</span> Vérifier que \(i\) est compatible avec l'observation : de \(0{,}1\) à quelques mm à l'œil, au moins deux pixels par interfrange sur un capteur.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Exploiter un contraste ou un profil d'éclairement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Mesurer.</span> Relever \(\mathcal{E}_{max}\) et \(\mathcal{E}_{min}\) sur le profil, en déduire \(\Gamma\).</li>
      <li><span class="step">Inverser.</span> Avec \(x = \mathcal{E}_1/\mathcal{E}_2\) et \(u = \sqrt{x}\), la relation \(\Gamma = 2u/(1+u^2)\) donne \(\Gamma u^2-2u+\Gamma = 0\), équation du second degré en \(u\) dont les racines sont :</li>
    </ol>
    <div class="formula">$$\sqrt{\frac{\mathcal{E}_1}{\mathcal{E}_2}}=\frac{1\pm\sqrt{1-\Gamma^2}}{\Gamma}$$</div>
    <ol start="3" style="margin-top:.4rem">
      <li><span class="step">Diagnostiquer.</span> Un contraste inférieur à 1 peut venir d'amplitudes inégales, d'une cohérence temporelle partielle (\(|\delta|\) voisin de \(L_c\)), d'une source trop étendue, d'un fond lumineux parasite ou de pixels trop larges devant \(i\).</li>
      <li><span class="step">Positions.</span> Les maxima donnent les lieux où \(p\) est entier : leur espacement fournit l'interfrange, donc \(\delta(M)\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Manier les ordres de grandeur de cohérence</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Convertir.</span> \(\Delta\nu = c\,\Delta\lambda_0/\lambda_0^2\), \(\tau_c = 1/\Delta\nu\), \(L_c = c\,\tau_c = \lambda_0^2/\Delta\lambda_0\).</li>
      <li><span class="step">Compter.</span> Nombre de franges visibles \(\approx L_c/\lambda_0 = \lambda_0/\Delta\lambda_0 = \nu/\Delta\nu\).</li>
      <li><span class="step">Comparer.</span> Confronter \(L_c\) à la différence de marche maximale du montage (épaisseur de lame, écart des bras, rayon d'observation).</li>
    </ol>
    <p style="margin:.4rem 0 0"><em>Exemple :</em> une DEL avec \(\Delta\lambda_0 = 30\ \text{nm}\) à \(600\ \text{nm}\) : \(L_c = 12\ \mu\text{m}\), soit une vingtaine de franges seulement.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Sommer N ondes déphasées régulièrement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Identifier ψ.</span> Déphasage entre deux ondes voisines en \(M\), géométrie et déphasages imposés compris (exemple : \(\psi = 2\pi a\sin\theta/\lambda_0 - \alpha\)).</li>
      <li><span class="step">Sommer.</span> Somme géométrique de raison \(e^{-i\psi}\), puis factorisation de l'angle moitié : \(|1-e^{-iN\psi}| = 2|\sin(N\psi/2)|\).</li>
      <li><span class="step">Pics principaux.</span> \(\psi = 2\pi m\) : tous les termes valent 1, la somme vaut \(N\), d'où \(N^2\mathcal{E}_0\).</li>
      <li><span class="step">Largeur.</span> Premiers zéros en \(\psi = 2\pi m \pm 2\pi/N\), à traduire en angle ou en position grâce à l'expression de \(\psi\).</li>
    </ol>
    <p style="margin:.4rem 0 0"><em>Piège :</em> la relation entre \(\psi\) et l'angle n'est pas linéaire ; la largeur angulaire d'un pic dans la direction \(\theta\) contient un facteur \(1/\cos\theta\).</p>
  </div>
</div>
