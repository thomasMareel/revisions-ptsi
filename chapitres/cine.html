<div class="course-section">
  <div class="sec-num">§1 · RÉFÉRENTIELS ET REPÈRES</div>
  <h2>Bases de la description du mouvement</h2>
  <div class="intro">La cinématique décrit les mouvements sans s'intéresser à leurs causes. Tout mouvement n'a de sens que par rapport à un référentiel. Avant de calculer quoi que ce soit, il faut définir clairement dans quel référentiel on travaille et avec quel repère on paramètre.</div>

  <h3>Référentiel</h3>
  <div class="def-box">
    Un <strong>référentiel</strong> \(\mathcal{R}\) est un solide de référence muni d'une horloge. C'est par rapport à ce solide que l'on décrit le mouvement d'un point ou d'un solide. Un référentiel n'est pas un repère : c'est un objet physique (la Terre, un véhicule, un labo…).
  </div>
  <p>Exemples de référentiels utilisés en PTSI :</p>
  <ul>
    <li><strong>Référentiel terrestre \(\mathcal{R}_T\)</strong> : lié à la Terre (supposé galiléen dans la plupart des études de mécanismes).</li>
    <li><strong>Référentiel lié à un solide \(\mathcal{R}_S\)</strong> : se déplace avec le solide S.</li>
  </ul>

  <h3>Repère cartésien</h3>
  <div class="def-box">
    Un <strong>repère cartésien</strong> \(\mathcal{R}(O, \vec{x}, \vec{y}, \vec{z})\) est défini par :
    <ul style="margin-top:0.3rem">
      <li>Une <strong>origine</strong> O</li>
      <li>Trois vecteurs unitaires \(\vec{x}, \vec{y}, \vec{z}\) orthonormés directs : \(\vec{x} \wedge \vec{y} = \vec{z}\)</li>
    </ul>
    La <strong>base</strong> \((\vec{x}, \vec{y}, \vec{z})\) est l'ensemble des trois vecteurs directeurs (sans origine).
  </div>
  <p>La position du point M dans ce repère s'écrit :</p>
  <div class="formula">$$\overrightarrow{OM} = x\,\vec{x} + y\,\vec{y} + z\,\vec{z}$$</div>

  <h3>Repère cylindrique</h3>
  <div class="def-box">
    Le <strong>repère cylindrique</strong> \((O, \vec{e}_r, \vec{e}_\theta, \vec{z})\) est associé aux coordonnées cylindriques \((r, \theta, z)\). Les vecteurs \(\vec{e}_r\) et \(\vec{e}_\theta\) dépendent de \(\theta\) et <strong>varient dans le temps</strong> si \(\theta\) varie.
    $$\vec{e}_r = \cos\theta\,\vec{x} + \sin\theta\,\vec{y} \qquad \vec{e}_\theta = -\sin\theta\,\vec{x} + \cos\theta\,\vec{y}$$
    Relations de dérivation : \(\dot{\vec{e}}_r = \dot{\theta}\,\vec{e}_\theta\) et \(\dot{\vec{e}}_\theta = -\dot{\theta}\,\vec{e}_r\)
  </div>
  <div class="formula">$$\overrightarrow{OM} = r\,\vec{e}_r + z\,\vec{z}$$</div>

  <h3>Repère de Frenet</h3>
  <div class="def-box">
    Le <strong>repère de Frenet</strong> \((\vec{T}, \vec{N}, \vec{B})\) est lié à la trajectoire du point M :
    <ul style="margin-top:0.3rem">
      <li>\(\vec{T}\) : vecteur unitaire <strong>tangent</strong> à la trajectoire, dans le sens du mouvement</li>
      <li>\(\vec{N}\) : vecteur unitaire <strong>normal principal</strong>, centripète (vers le centre de courbure)</li>
      <li>\(\vec{B} = \vec{T} \wedge \vec{N}\) : vecteur <strong>binormal</strong></li>
    </ul>
    R = rayon de courbure de la trajectoire en M.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · VECTEUR POSITION, VITESSE ET ACCÉLÉRATION</div>
  <h2>Cinématique d'un point matériel</h2>
  <div class="intro">Pour décrire le mouvement d'un point M par rapport à un référentiel \(\mathcal{R}\), on calcule successivement son vecteur position, puis sa vitesse (dérivée première), puis son accélération (dérivée seconde). La dérivation doit toujours être effectuée dans le référentiel d'étude.</div>

  <h3>Vecteur position</h3>
  <div class="formula">$$\overrightarrow{OM}(t) = x(t)\,\vec{x} + y(t)\,\vec{y} + z(t)\,\vec{z}$$</div>

  <h3>Vecteur vitesse</h3>
  <div class="def-box">
    Le <strong>vecteur vitesse</strong> de M par rapport à \(\mathcal{R}\) est la dérivée temporelle du vecteur position, calculée en maintenant fixes les vecteurs de base de \(\mathcal{R}\) :
    $$\vec{v}(M/\mathcal{R}) = \left.\frac{d\overrightarrow{OM}}{dt}\right|_{\mathcal{R}}$$
  </div>
  <p>En coordonnées cartésiennes :</p>
  <div class="formula">$$\vec{v} = \dot{x}\,\vec{x} + \dot{y}\,\vec{y} + \dot{z}\,\vec{z}$$</div>
  <p>En coordonnées cylindriques :</p>
  <div class="formula">$$\vec{v} = \dot{r}\,\vec{e}_r + r\dot{\theta}\,\vec{e}_\theta + \dot{z}\,\vec{z}$$</div>
  <p>En repère de Frenet (\(s\) = abscisse curviligne, \(\dot{s} = v\) algébrique) :</p>
  <div class="formula">$$\vec{v} = \dot{s}\,\vec{T} = v\,\vec{T}$$</div>

  <h3>Vecteur accélération</h3>
  <div class="def-box">
    L'<strong>accélération</strong> est la dérivée du vecteur vitesse dans \(\mathcal{R}\) :
    $$\vec{a}(M/\mathcal{R}) = \left.\frac{d\vec{v}}{dt}\right|_{\mathcal{R}}$$
  </div>
  <p>En coordonnées cartésiennes :</p>
  <div class="formula">$$\vec{a} = \ddot{x}\,\vec{x} + \ddot{y}\,\vec{y} + \ddot{z}\,\vec{z}$$</div>
  <p>En coordonnées cylindriques :</p>
  <div class="formula">$$\vec{a} = (\ddot{r} - r\dot{\theta}^2)\,\vec{e}_r + (r\ddot{\theta} + 2\dot{r}\dot{\theta})\,\vec{e}_\theta + \ddot{z}\,\vec{z}$$</div>
  <p>En repère de Frenet :</p>
  <div class="formula">$$\vec{a} = \dot{v}\,\vec{T} + \frac{v^2}{R}\,\vec{N}$$</div>
  <div class="prop-box">
    <strong>Composantes de l'accélération en Frenet :</strong><br>
    — \(a_T = \dot{v}\) : accélération <em>tangentielle</em> (variation de vitesse scalaire)<br>
    — \(a_N = v^2/R\) : accélération <em>normale</em> (centripète, toujours vers le centre de courbure, toujours ≥ 0)
  </div>
  <div class="notice">
    La composante normale \(v^2/R\) est toujours positive et pointe vers le centre de courbure. Elle existe dès que la trajectoire est courbe (R fini), même si la vitesse est constante.
  </div>

  <h3>Cas particuliers importants</h3>
  <p><strong>Mouvement rectiligne uniforme (MRU) :</strong> trajectoire droite + vitesse constante → \(\vec{a} = \vec{0}\).</p>
  <p><strong>Mouvement rectiligne uniformément accéléré (MRUA) :</strong> \(v = v_0 + at\), \(x = x_0 + v_0 t + \tfrac{1}{2}at^2\).</p>
  <p><strong>Mouvement circulaire :</strong> R = cste. \(v = R|\dot{\theta}|\). En uniforme : \(a_T = 0\), \(a_N = R\dot{\theta}^2 = v^2/R\).</p>
  <p><strong>Mouvement parabolique :</strong> accélération constante \(\vec{a} = g\,(-\vec{y})\), trajectoire parabolique.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SOLIDE INDÉFORMABLE — TORSEUR CINÉMATIQUE</div>
  <h2>Mouvement d'un solide indéformable</h2>
  <div class="intro">Un solide indéformable (SI) est tel que la distance entre deux points quelconques reste constante. Connaître la vitesse d'un seul point du solide ne suffit pas : il faut aussi sa rotation. Ces deux données déterminent tout le champ des vitesses, résumé par le torseur cinématique.</div>

  <h3>Vecteur rotation instantanée</h3>
  <div class="def-box">
    À tout instant, le mouvement d'un solide S par rapport à \(\mathcal{R}\) est caractérisé par un <strong>vecteur rotation instantanée</strong> \(\vec{\Omega}(S/\mathcal{R})\), aussi noté \(\vec{\omega}\). Ce vecteur est le même en tout point du solide.
  </div>
  <p>Pour un solide en rotation autour d'un axe fixe \(\Delta\) d'orientation \(\vec{u}\) :</p>
  <div class="formula">$$\vec{\Omega}(S/\mathcal{R}) = \dot{\theta}\,\vec{u}$$</div>
  <p>où \(\theta\) est l'angle de rotation et \(\dot{\theta}\) la vitesse angulaire (en rad/s).</p>

  <h3>Mouvements simples</h3>
  <div class="def-box">
    <strong>Translation et rotation.</strong> Un solide S est en <strong>translation</strong> par rapport à \(\mathcal{R}\) si \(\vec{\Omega}(S/\mathcal{R}) = \vec 0\) à chaque instant : tous ses points ont la même vitesse et leurs trajectoires sont superposables. La translation est rectiligne (chariot sur un rail) ou non : la nacelle d'une grande roue, qui reste horizontale, est en translation circulaire. S est en <strong>rotation autour d'un axe fixe</strong> \(\Delta\) si les points de \(\Delta\) sont immobiles : les autres décrivent des cercles centrés sur l'axe, à la vitesse \(r\,|\dot\theta|\) à la distance \(r\) de l'axe. Un mouvement qui n'est ni l'un ni l'autre se décrit comme un mouvement composé (§5).
  </div>
  <div class="method-box"><strong>Exemple — la grande roue</strong>
    <ol>
      <li>Une grande roue de 20 m de rayon fait un tour en 10 min : \(\dot\theta = 2\pi/600 \approx 0{,}010\,5\ \text{rad/s}\).</li>
      <li>Le point d'accrochage d'une nacelle, sur la jante, va à \(20\times0{,}010\,5 \approx 0{,}21\ \text{m/s}\).</li>
      <li>La nacelle est en translation circulaire (\(\vec\Omega = \vec 0\)) : tous ses points vont à 0,21 m/s, et chaque passager décrit un cercle de 20 m de rayon, de centre différent pour chacun.</li>
    </ol>
  </div>

  <h3>Champ des vitesses d'un solide — formule fondamentale</h3>
  <div class="prop-box">
    Pour deux points A et B appartenant au même solide S (formule de transport du champ des vitesses) :
    $$\boxed{\vec{v}(B \in S/\mathcal{R}) = \vec{v}(A \in S/\mathcal{R}) + \overrightarrow{BA} \wedge \vec{\Omega}(S/\mathcal{R})}$$
    Valable quel que soit le choix de A. Le champ des vitesses d'un solide est un champ <em>équiprojectif</em>. (Le produit vectoriel se note \(\wedge\) — convention française — ou \(\times\) ; on a bien \(\overrightarrow{BA}\wedge\vec{\Omega} = \vec{\Omega}\wedge\overrightarrow{AB}\).)
  </div>
  <div class="notice">
    <strong>Moyen mnémotechnique « BABAR »</strong> — la formule se lit dans l'ordre des lettres :
    $$\vec{v}(\mathbf{B}) = \vec{v}(\mathbf{A}) + \overrightarrow{\mathbf{B}\mathbf{A}} \wedge \underbrace{\vec{\Omega}}_{\textstyle\mathbf{R}}$$
    soit <strong>B – A – B – A – R</strong>, où <strong>R</strong> est la <strong>R</strong>ésultante du torseur cinématique (le vecteur rotation \(\vec{\Omega}\)). C'est la structure générale du transport d'un torseur — on la retrouve telle quelle en statique pour le moment.
  </div>

  <h3>Torseur cinématique</h3>
  <div class="def-box">
    Le <strong>torseur cinématique</strong> de S par rapport à \(\mathcal{R}\), réduit au point A, est :
    $$\{\mathcal{V}(S/\mathcal{R})\}_A = \begin{Bmatrix} \vec{\Omega}(S/\mathcal{R}) \\ \vec{v}(A, S/\mathcal{R}) \end{Bmatrix}_A$$
    La <strong>résultante</strong> est \(\vec{\Omega}\), le <strong>moment</strong> en A est \(\vec{v}(A)\).
  </div>
  <p>Notations : la vitesse du point A considéré comme appartenant à S, \(\vec v(A\in S/\mathcal R)\), se note aussi \(\vec V(A, S/\mathcal R)\) ; pour deux pièces 1 et 2, on écrit \(\{\mathcal V(2/1)\}\) et \(\vec V(A, 2/1)\), comme dans « Liaisons » et en 2ᵉ année.</p>
  <p>Propriété de transport du moment (changement de point de réduction, forme « BABAR ») :</p>
  <div class="formula">$$\vec{v}(B) = \vec{v}(A) + \overrightarrow{BA} \wedge \vec{\Omega}$$</div>

  <h3>Équiprojectivité</h3>
  <div class="prop-box">
    Pour tout couple (A, B) de points d'un même solide S :
    $$\vec{v}(A) \cdot \overrightarrow{AB} = \vec{v}(B) \cdot \overrightarrow{AB}$$
    Les vitesses de deux points d'un solide ont la <strong>même projection sur la droite qui les joint</strong>. Utile pour vérifier un résultat ou déterminer une vitesse inconnue.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LIAISONS ET DEGRÉS DE LIBERTÉ (RAPPEL)</div>
  <h2>Liaisons entre solides : l'essentiel pour la cinématique</h2>
  <div class="intro">Une liaison entre deux solides supprime certains de leurs mouvements relatifs et en laisse d'autres. Le chapitre <a href="#liaisons/cours">« Liaisons, graphe et schéma cinématique »</a> les traite en détail : géométrie des contacts, onze liaisons normalisées et leurs symboles (§2, §3), torseurs cinématiques et domaines de validité (§4), torseurs transmissibles et tableau récapitulatif (§6). On ne garde ici que ce qui sert au calcul des vitesses.</div>
  <div class="def-box">
    <strong>Degrés de liberté d'une liaison.</strong> Le nombre de degrés de liberté \(n_c\) d'une liaison (de 0 à 6) est le nombre de mouvements relatifs indépendants qu'elle permet ; chacun est décrit par un paramètre, linéaire pour une translation, angulaire pour une rotation. Un solide libre en a six (trois translations, trois rotations).
  </div>
  <div class="def-box">
    <strong>Torseur cinématique d'une liaison.</strong> Le mouvement de 2 par rapport à 1 s'écrit \(\{\mathcal V(2/1)\} = \{\vec\Omega(2/1) \;;\; \vec v(P\in2/1)\}_P\), avec une composante par mouvement permis. Cette forme simple n'est valable qu'en certains points :
    <ul style="margin-top:0.3rem">
      <li>pivot d'axe \((A, \vec u)\) (\(n_c = 1\)) : \(\vec\Omega = \dot\theta\,\vec u\) et \(\vec v(P) = \vec 0\) en tout point \(P\) <strong>de l'axe</strong> ;</li>
      <li>glissière de direction \(\vec u\) (\(n_c = 1\)) : \(\vec\Omega = \vec 0\) et \(\vec v(P) = \dot\lambda\,\vec u\) <strong>en tout point</strong> ;</li>
      <li>sphérique (rotule) de centre \(A\) (\(n_c = 3\)) : \(\vec\Omega\) quelconque et \(\vec v(A) = \vec 0\) <strong>au centre seulement</strong> ;</li>
      <li>hélicoïdale d'axe \((A, \vec u)\), de pas \(p_h\), à droite (\(n_c = 1\)) : \(\vec\Omega = \dot\theta\,\vec u\) et \(\vec v(P) = \dfrac{p_h}{2\pi}\,\dot\theta\,\vec u\) en tout point de l'axe.</li>
    </ul>
    Ailleurs, on transporte le moment par la relation de « BABAR » (§3).
  </div>
  <div class="method-box"><strong>Exemple — une vis qui avance</strong>
    <ol>
      <li>Une vis de pas \(p_h = 2\ \text{mm}\) tourne à 600 tr/min dans un écrou fixe : \(\dot\theta = 600\times2\pi/60 \approx 62{,}8\ \text{rad/s}\).</li>
      <li>Vitesse d'avance, en tout point de l'axe : \(\dot\lambda = \dfrac{p_h}{2\pi}\,\dot\theta = 0{,}002\times10 = 0{,}02\ \text{m/s}\), soit 20 mm/s.</li>
      <li>Un point du filet, à 5 mm de l'axe, a en plus une vitesse de rotation \(62{,}8\times0{,}005 \approx 0{,}31\ \text{m/s}\) : la forme simple n'est valable que sur l'axe.</li>
    </ol>
  </div>
  <div class="formula">$$\begin{array}{|l|c|l|}
  \hline
  \textbf{Liaison} & n_c & \textbf{Mouvements permis} \\
  \hline
  \text{Encastrement} & 0 & \text{aucun} \\
  \text{Pivot} & 1 & \text{rotation autour de l'axe} \\
  \text{Glissière} & 1 & \text{translation selon la direction} \\
  \text{Hélicoïdale} & 1 & \text{rotation et translation liées par le pas} \\
  \text{Pivot glissant} & 2 & \text{rotation autour de l'axe et translation selon l'axe} \\
  \text{Sphérique à doigt} & 2 & \text{deux rotations} \\
  \text{Appui plan} & 3 & \text{deux translations dans le plan, rotation autour de la normale} \\
  \text{Sphérique (rotule)} & 3 & \text{trois rotations} \\
  \text{Sphère-cylindre} & 4 & \text{trois rotations, translation selon la direction} \\
  \text{Cylindre-plan} & 4 & \text{deux translations, rotations autour de la ligne et de la normale} \\
  \text{Sphère-plan} & 5 & \text{trois rotations, deux translations dans le plan} \\
  \hline
  \end{array}$$</div>
  <div class="notice"><strong>Erreurs classiques</strong> : écrire la forme simple d'un torseur hors de son domaine de validité (une sphérique ailleurs qu'en son centre, une pivot hors de son axe) ; confondre les degrés de liberté \(n_c\) d'une liaison et la mobilité \(m\) d'un mécanisme (« Liaisons », §10). Symboles normalisés, graphe et schéma cinématique : « Liaisons », §3, §7 et §8.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · COMPOSITION DES MOUVEMENTS</div>
  <h2>Changer de référentiel</h2>
  <div class="intro">Quand un solide est en mouvement dans un référentiel qui est lui-même en mouvement, il faut composer les mouvements. C'est indispensable pour analyser les mécanismes à plusieurs étages de mobilité.</div>

  <h3>Composition des vecteurs rotation</h3>
  <div class="prop-box">
    Si le solide S tourne dans \(\mathcal{R}_1\) qui tourne dans \(\mathcal{R}_0\) :
    $$\vec{\Omega}(S/\mathcal{R}_0) = \vec{\Omega}(S/\mathcal{R}_1) + \vec{\Omega}(\mathcal{R}_1/\mathcal{R}_0)$$
    Les vecteurs rotation s'additionnent vectoriellement.
  </div>

  <h3>Composition des vitesses</h3>
  <div class="def-box">
    Soit \(\mathcal{R}_1\) en mouvement dans \(\mathcal{R}_0\). Pour un point M :
    $$\vec{v}(M/\mathcal{R}_0) = \vec{v}(M/\mathcal{R}_1) + \vec{v}_e(M/\mathcal{R}_0)$$
    où \(\vec{v}_e(M)\) est la <strong>vitesse d'entraînement</strong> : vitesse du point de \(\mathcal{R}_1\) coïncidant avec M à l'instant t.
    $$\vec{v}_e = \vec{v}(O_1/\mathcal{R}_0) + \vec{\Omega}(\mathcal{R}_1/\mathcal{R}_0) \wedge \overrightarrow{O_1 M}$$
  </div>

  <div class="prop-box">
    <strong>Composition des torseurs cinématiques.</strong> Pour trois solides (ou repères) 0, 1 et 2, écrits au même point \(P\) :
    <div class="formula" data-nom="Composition des torseurs cinématiques">$$\{\mathcal V(2/0)\} = \{\mathcal V(2/1)\} + \{\mathcal V(1/0)\} \iff \begin{cases} \vec\Omega(2/0) = \vec\Omega(2/1) + \vec\Omega(1/0) \\ \vec v(P\in2/0) = \vec v(P\in2/1) + \vec v(P\in1/0) \end{cases}$$</div>
    Le terme \(\vec v(P\in1/0)\) est la vitesse d'entraînement. Le long d'une chaîne fermée de solides \(0\to1\to\dots\to0\), la somme des torseurs est nulle : c'est la fermeture cinématique (« Liaisons », §10).
  </div>
  <div class="method-box"><strong>Exemple — le chariot d'une grue à tour</strong>
    <ol>
      <li>La flèche 1 tourne autour de l'axe vertical \((O, \vec z)\) du mât 0 à \(\vec\Omega(1/0) = 0{,}2\,\vec z\ \text{rad/s}\) ; le chariot 2 roule le long de la flèche, \(\vec v(P\in2/1) = 0{,}5\,\vec x_1\ \text{m/s}\), et se trouve en \(P\), \(\overrightarrow{OP} = 10\,\vec x_1\ \text{m}\).</li>
      <li>Entraînement : \(\vec v(P\in1/0) = \vec\Omega(1/0)\wedge\overrightarrow{OP}\), soit \(0{,}2\,\vec z\wedge10\,\vec x_1 = 2\,\vec y_1\ \text{m/s}\).</li>
      <li>\(\vec v(P\in2/0) = 0{,}5\,\vec x_1 + 2\,\vec y_1\ \text{m/s}\), de norme 2,06 m/s : la rotation de la flèche domine.</li>
    </ol>
  </div>

  <h3>Théorème de composition des accélérations (pour aller plus loin)</h3>
  <div class="formula">$$\vec{a}(M/\mathcal{R}_0) = \vec{a}(M/\mathcal{R}_1) + \vec{a}_e(M) + \vec{a}_c(M)$$</div>
  <p>où :</p>
  <ul>
    <li>\(\vec{a}_e\) : accélération d'entraînement</li>
    <li>\(\vec{a}_c = 2\,\vec{\Omega}(\mathcal{R}_1/\mathcal{R}_0) \wedge \vec{v}(M/\mathcal{R}_1)\) : accélération de Coriolis</li>
  </ul>
  <div class="notice">
    <strong>Hors programme (pour aller plus loin)</strong> : la composition des accélérations et l'accélération de Coriolis ne sont pas au programme de SI ; seules la composition des vitesses et celle des vecteurs rotation sont exigibles.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · CINÉMATIQUE DES MÉCANISMES</div>
  <h2>Analyse cinématique d'un mécanisme plan</h2>
  <div class="intro">Un mécanisme est un ensemble de solides liés entre eux par des liaisons. L'analyse cinématique consiste à déterminer les vitesses (et éventuellement les accélérations) de tous les solides en fonction des paramètres d'entrée. Fermeture de chaîne, centre instantané de rotation et condition de roulement sans glissement sont les outils clés ; la construction du modèle (classes d'équivalence, graphe, schéma) est traitée dans « Liaisons ».</div>

  <h3>Graphe des liaisons et schéma cinématique</h3>
  <p>Le <strong>graphe des liaisons</strong> (une classe d'équivalence par sommet, bâti compris, une liaison par arc) et le <strong>schéma cinématique</strong> (dessin du mécanisme avec les symboles normalisés, placés selon la géométrie des liaisons) se construisent comme dans <a href="#liaisons/cours">« Liaisons »</a>, §7 et §8. Ils donnent le nombre de classes \(n\), les liaisons et leurs degrés de liberté \(n_c\), le nombre de cycles indépendants \(\gamma\) ; la mobilité \(m = I_c - r_c\) (\(I_c = \sum n_c\), \(r_c\) rang des fermetures cinématiques) y est étudiée au §10.</p>

  <h3>Méthode vectorielle — fermeture de chaîne</h3>
  <div class="method-box">
    <strong>Principe de la fermeture géométrique :</strong>
    <ol style="margin-top:0.4rem">
      <li>Écrire la relation de fermeture de la chaîne : \(\overrightarrow{AB} + \overrightarrow{BC} + \cdots + \overrightarrow{KA} = \vec{0}\)</li>
      <li>Projeter sur les axes du repère → système d'équations scalaires (loi des cosinus, loi des sinus)</li>
      <li>Dériver par rapport au temps → équations de vitesses</li>
      <li>Résoudre pour les vitesses inconnues en fonction des vitesses connues (entrée)</li>
    </ol>
  </div>
  <p>Exemple traité pas à pas (pompe à levier : schéma paramétré, fermeture géométrique, loi entrée-sortie, dérivation) : « Liaisons », §8 ; fermeture cinématique par la somme des torseurs : « Liaisons », §10.</p>

  <h3>Centre instantané de rotation (CIR)</h3>
  <div class="def-box">
    Le <strong>centre instantané de rotation (CIR)</strong> de S₂ par rapport à S₁ est le point I tel que :
    $$\vec{v}(I, S_2/S_1) = \vec{0}$$
    Sa vitesse dans \(S_1\) est nulle à l'instant considéré. Le CIR n'est pas forcément un point matériel du solide.
  </div>
  <div class="prop-box">
    <strong>Construction du CIR :</strong>
    <ul style="margin-top:0.3rem">
      <li>Le CIR est à l'intersection des perpendiculaires aux vitesses de deux points du solide.</li>
      <li>Pour un mouvement de roulement sans glissement : le CIR est le point de contact.</li>
      <li>Pour une rotation pure autour d'un axe fixe : le CIR est sur cet axe.</li>
      <li>Pour une translation pure : le CIR est à l'infini.</li>
    </ul>
  </div>

  <h3>Roulement sans glissement (RSG)</h3>
  <div class="def-box">
    Il y a <strong>roulement sans glissement</strong> entre S₁ et S₂ au point de contact I quand :
    $$\vec{v}(I, S_2/\mathcal{R}) - \vec{v}(I, S_1/\mathcal{R}) = \vec{0}$$
    Le point de contact instantané a la même vitesse dans les deux solides : la <strong>vitesse de glissement</strong> \(\vec V_g = \vec v(I\in S_2/S_1)\) est nulle, et le CIR de S₂/S₁ est le point de contact. Décomposition de la rotation relative en roulement et pivotement : <a href="#liaisons/cours">« Liaisons »</a>, §5.
  </div>
  <p>Pour une roue de rayon R roulant sans glisser sur un sol fixe de normale \(\vec y\), avec \(\vec\Omega = \dot\theta\,\vec z\) (\(\vec z\) sortant de la figure) et \(\vec v(C) = v_C\,\vec x\) : comme \(\overrightarrow{IC} = R\,\vec y\), \(\vec v(I) = \vec v(C) + \overrightarrow{IC}\wedge\vec\Omega\) vaut \((v_C + R\dot\theta)\,\vec x\) et doit être nul, d'où \(v_C = -R\dot\theta\) (une roue qui avance vers \(+\vec x\) tourne dans le sens horaire). En norme :</p>
  <div class="formula">$$v_C = R\,|\dot{\theta}|$$</div>
  <p>Le point de contact I est instantanément immobile, mais ce n'est pas un point fixe de la roue : c'est à chaque instant un autre point de la bande de roulement.</p>

  <h3>Mobilité et hyperstatisme d'un mécanisme plan</h3>
  <div class="formula">$$m - h = 3(n-1) - I_s \qquad\text{avec}\qquad I_s = \sum_i n_{s,i}, \quad n_{s,i} = 3 - n_{c,i}$$</div>
  <p>où \(n\) est le nombre de classes, bâti compris : en plan, la liaison \(i\) laisse \(n_{c,i}\) mouvements et transmet \(n_{s,i} = 3 - n_{c,i}\) composantes d'effort, et \(I_s\) est le nombre total d'inconnues de liaison (mêmes notations que « Liaisons » et « Statique »). Ce décompte ne donne pas la mobilité seule, mais la différence \(m - h\), où \(h \geq 0\) est le degré d'hyperstatisme : il ne vaut \(m\) que si le mécanisme est isostatique. On obtient donc d'abord \(m\) en observant le mécanisme (bloquer l'entrée, puis chercher ce qui bouge encore), et l'on en déduit \(h\) ; si \(m = 1\), un seul paramètre d'entrée fixe tout le mouvement. Forme équivalente, côté cinématique : \(h_{\text{plan}} = m - I_c + 3\gamma\). Exemples, conditions de la modélisation plane : <a href="#liaisons/cours">« Liaisons »</a>, §10 et §12 ; <a href="#statique/cours">« Statique »</a>, §6 et §8.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · CINÉMATIQUE</div>
  <h2>Démarches systématiques pour l'analyse du mouvement</h2>

  <div class="method-box">
    <strong>Méthode 1 — Calculer vitesse et accélération en cartésien</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Écrire \(\overrightarrow{OM}(t) = x(t)\,\vec{x} + y(t)\,\vec{y} + z(t)\,\vec{z}\).</li>
      <li><span class="step">Étape 2.</span> Dériver : \(\vec{v} = \dot{x}\,\vec{x} + \dot{y}\,\vec{y} + \dot{z}\,\vec{z}\).</li>
      <li><span class="step">Étape 3.</span> Dériver : \(\vec{a} = \ddot{x}\,\vec{x} + \ddot{y}\,\vec{y} + \ddot{z}\,\vec{z}\).</li>
      <li><span class="step">Vérification.</span> Calculer \(\|\vec{v}\|\) et vérifier la cohérence physique (unités, ordres de grandeur).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Calculer vitesse et accélération en cylindrique</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Exprimer \(\overrightarrow{OM} = r\,\vec{e}_r + z\,\vec{z}\).</li>
      <li><span class="step">Étape 2.</span> Vitesse : \(\vec{v} = \dot{r}\,\vec{e}_r + r\dot{\theta}\,\vec{e}_\theta + \dot{z}\,\vec{z}\). Ne pas oublier que \(\dot{\vec{e}}_r = \dot{\theta}\,\vec{e}_\theta\).</li>
      <li><span class="step">Étape 3.</span> Accélération :
        <div class="formula">$$\vec{a} = (\ddot{r} - r\dot{\theta}^2)\,\vec{e}_r + (r\ddot{\theta} + 2\dot{r}\dot{\theta})\,\vec{e}_\theta + \ddot{z}\,\vec{z}$$</div></li>
      <li><span class="step">Piège.</span> Le terme \(-r\dot{\theta}^2\,\vec{e}_r\) est centripète (vers O). Le terme \(2\dot{r}\dot{\theta}\,\vec{e}_\theta\) est de Coriolis (coordonnées).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Vitesse d'un point d'un solide par la formule fondamentale</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Identifier le solide S, son vecteur rotation \(\vec{\Omega}\), et un point A dont on connaît la vitesse.</li>
      <li><span class="step">Étape 2.</span> Appliquer la formule « BABAR » : \(\vec{v}(B) = \vec{v}(A) + \overrightarrow{BA} \wedge \vec{\Omega}\).</li>
      <li><span class="step">Étape 3.</span> Calculer le produit vectoriel \(\vec{\Omega} \wedge \overrightarrow{AB}\) en développant les composantes.</li>
      <li><span class="step">Vérification.</span> Utiliser l'équiprojectivité : \(\vec{v}(A) \cdot \overrightarrow{AB} = \vec{v}(B) \cdot \overrightarrow{AB}\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Analyser un mécanisme par fermeture de chaîne</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Construire le modèle : classes d'équivalence, graphe des liaisons, schéma cinématique paramétré (« Liaisons », méthodes 4 et 5).</li>
      <li><span class="step">Étape 2.</span> Écrire la fermeture géométrique : \(\sum \overrightarrow{\text{vecteurs de la chaîne}} = \vec{0}\).</li>
      <li><span class="step">Étape 3.</span> Projeter sur \(\vec{x}\) et \(\vec{y}\) → 2 équations scalaires.</li>
      <li><span class="step">Étape 4.</span> Dériver par rapport au temps → équations de vitesse.</li>
      <li><span class="step">Étape 5.</span> Résoudre pour les vitesses inconnues.</li>
    </ol>
    <p><em>Exemple traité :</em> la pompe à levier de « Liaisons », §8 (méthode 6 de ce chapitre) ; pour un contact ponctuel, écrire la vitesse de glissement (« Liaisons », méthode 7).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Trouver le CIR d'un solide</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Identifier deux points A et B du solide dont on connaît les vitesses \(\vec{v}(A)\) et \(\vec{v}(B)\).</li>
      <li><span class="step">Étape 2.</span> Tracer les perpendiculaires à \(\vec{v}(A)\) en A et à \(\vec{v}(B)\) en B.</li>
      <li><span class="step">Étape 3.</span> Le CIR I est à l'intersection de ces deux perpendiculaires.</li>
      <li><span class="step">Utilisation.</span> La vitesse d'un point C est perpendiculaire à IC avec \(\|\vec{v}(C)\| = IC \cdot \|\vec{\Omega}\|\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Pièges classiques en cinématique</strong>
    <ul style="margin-top:0.4rem">
      <li>Oublier de dériver \(\vec{e}_r\) et \(\vec{e}_\theta\) en cylindrique : ces vecteurs varient dans le temps ! \(\dot{\vec{e}}_r = \dot{\theta}\,\vec{e}_\theta\).</li>
      <li>Confondre vitesse algébrique \(\dot{s}\) (peut être négative) et vitesse scalaire \(v = |\dot{s}|\) (toujours positive).</li>
      <li>Oublier la composante centripète dans l'accélération en Frenet : même si la vitesse est constante, \(a_N = v^2/R \neq 0\) si la trajectoire est courbe.</li>
      <li>Mal identifier le référentiel de dérivation : toujours préciser dans quel repère on dérive.</li>
      <li>En roulement sans glissement sur un support fixe dans \(\mathcal{R}_0\) : le point de contact du solide roulant a une vitesse nulle dans \(\mathcal{R}_0\), mais ce n'est pas un point fixe du solide roulant.</li>
    </ul>
  </div>
</div>

    <h4>Correction</h4>

  <div class="q"><strong>Q1.</strong> Écrire les équations de fermeture géométrique (projection sur \(\vec{x}\) et \(\vec{y}\)).</div>
  <div class="q"><strong>Q2.</strong> Dériver par rapport au temps pour exprimer \(\dot{x}_B\) et \(\dot{\varphi}\) en fonction de \(\omega, \theta, \varphi\).</div>
  <div class="q"><strong>Q3.</strong> Pour θ = 90° : calculer \(\sin\varphi\), puis \(\dot{\varphi}\) et \(\dot{x}_B\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Fermeture sur \(\vec{x}\) : \(x_B = r\cos\theta + L\cos\varphi\) &nbsp; — &nbsp; sur \(\vec{y}\) : \(r\sin\theta = L\sin\varphi\) → \(\sin\varphi = \dfrac{r}{L}\sin\theta\)</p>
    <p><strong>Q2.</strong> Dérivée sur \(\vec{y}\) : \(r\omega\cos\theta = L\dot{\varphi}\cos\varphi \Rightarrow \dot{\varphi} = \dfrac{r\omega\cos\theta}{L\cos\varphi}\)</p>
    <p>Dérivée sur \(\vec{x}\) : \(\dot{x}_B = -r\omega\sin\theta - L\dot{\varphi}\sin\varphi\)</p>
    <p>En substituant \(\dot\varphi\) : \(\dot{x}_B = -r\omega\!\left(\sin\theta + \dfrac{\cos\theta\sin\varphi}{\cos\varphi}\right)\)</p>
    <p><strong>Q3.</strong> θ = 90° : \(\sin\varphi = r/L = 0{,}1/0{,}3 = 1/3 \Rightarrow \varphi \approx 19{,}5°\), \(\cos\varphi = \sqrt{8}/3\).</p>
    <p>\(\dot\varphi = \dfrac{0{,}1\times10\times0}{0{,}3\times\sqrt{8}/3} = 0\) rad/s (cos 90° = 0).</p>
    <p>\(\dot{x}_B = -0{,}1\times10\times1 - 0 = \mathbf{-1}\) m/s (coulisseau recule).</p>
  </div>
</div>

  <div class="statement">Un train d'engrenages : roue 1 (\(Z_1 = 20\), \(\omega_1\)), roue 2 (\(Z_2 = 60\)), roue 3 (\(Z_3 = 15\)), roue 4 (\(Z_4 = 45\), \(\omega_4\)). Roues 2 et 3 solidaires sur le même axe.</div>
  <div class="q"><strong>Q1.</strong> Calculer le rapport de transmission global \(i = \omega_4/\omega_1\).</div>
  <div class="q"><strong>Q2.</strong> Si \(\omega_1 = 300\ \text{tr/min}\), calculer \(\omega_4\) en tr/min.</div>
  <div class="q"><strong>Q3.</strong> Le moteur fournit un couple \(C_1 = 10\ \text{N·m}\) sur l'arbre 1. En supposant un rendement global \(\eta = 0{,}9\), calculer le couple \(C_4\) disponible sur l'arbre 4.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rapport 1→2 : \(i_{12} = -Z_1/Z_2 = -20/60 = -1/3\) (inversion de sens). Rapport 3→4 : \(i_{34} = -Z_3/Z_4 = -15/45 = -1/3\). Rapport global : \(i = i_{12}\times i_{34} = (-1/3)\times(-1/3) = 1/9\) (sens identique à l'entrée, puisque deux inversions). \(\omega_4 = \omega_1/9\) (réducteur).</p>
    <p><strong>Q2.</strong> \(\omega_4 = 300/9 = 33{,}3\ \text{tr/min}\).</p>
    <p><strong>Q3.</strong> Conservation de puissance (avec pertes) : \(P_4 = \eta P_1\). \(C_4\omega_4 = \eta C_1\omega_1\). \(C_4 = \eta C_1(\omega_1/\omega_4) = 0{,}9\times10\times9 = 81\ \text{N·m}\). Le réducteur amplifie le couple par 9 (×rapport), diminué du rendement. C'est l'intérêt d'un réducteur : transformer une vitesse élevée et un couple faible en une vitesse faible et un couple élevé.</p>
  </div>
</div>

  <div class="q"><strong>A1.</strong> Traduire le roulement sans glissement au point de contact \(I\). En déduire la vitesse de rotation \(\omega\).</div>

  <p class="exo-part">Partie B — Champ des vitesses</p>
  <div class="q"><strong>B1.</strong> À l'aide de la relation du champ des vitesses d'un solide, calculer la vitesse du point le plus haut \(H\) de la roue.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Roulement sans glissement : la vitesse du point de contact \(I\) appartenant à la roue est nulle, \(\vec v_I = \vec 0\). Or \(\vec v_I = \vec v_C + \vec\omega\wedge\vec{CI}\) donne \(v_C = \omega R\), soit \(\omega = v_C/R = 6{,}0/0{,}30 = 20\ \text{rad/s}\).</p>
    <p><strong>B1.</strong> \(\vec v_H = \vec v_C + \vec\omega\wedge\vec{CH}\). Comme \(\|\vec\omega\wedge\vec{CH}\| = \omega R = v_C\), dans le même sens que \(\vec v_C\), on obtient \(v_H = v_C + \omega R = 2v_C = 12\ \text{m/s}\) : le point haut va deux fois plus vite que le centre.</p>
