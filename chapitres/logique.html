<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Tables de vérité et contraposée</h3>
  <div class="statement">Questions de cours sur l'implication et la négation (§1 à §3).</div>
  <div class="q"><strong>Q1.</strong> Construire la table de vérité de \(P\Rightarrow Q\) et de \(\neg Q\Rightarrow\neg P\). Vérifier qu'elles sont identiques.</div>
  <div class="q"><strong>Q2.</strong> Écrire la contraposée de : « Si \(n^2\) est pair alors \(n\) est pair ».</div>
  <div class="q"><strong>Q3.</strong> Soit \(f\) une fonction définie sur un intervalle \(I\) et \(a \in I\). Énoncer la négation de la proposition $$\forall\varepsilon>0,\ \exists\eta>0,\ \forall x \in I,\ |x-a| \lt \eta\Rightarrow|f(x)-\ell| \lt \varepsilon .$$</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \((P, Q) = (\mathrm V, \mathrm V), (\mathrm V, \mathrm F), (\mathrm F, \mathrm V), (\mathrm F, \mathrm F)\), \(P \Rightarrow Q\) prend les valeurs V, F, V, V (elle n'est fausse que si \(P\) est vraie et \(Q\) fausse). Pour \(\neg Q \Rightarrow \neg P\), les couples \((\neg Q, \neg P)\) sont \((\mathrm F, \mathrm F), (\mathrm V, \mathrm F), (\mathrm F, \mathrm V), (\mathrm V, \mathrm V)\), d'où V, F, V, V : les deux tables sont identiques, les deux propositions sont équivalentes.</p>
    <p><strong>Q2.</strong> Contraposée : « Si \(n\) est impair alors \(n^2\) est impair ». Elle est équivalente à la proposition initiale, et c'est elle qu'on démontre (cours, §4).</p>
    <p><strong>Q3.</strong> On échange les quantificateurs et l'on nie l'implication finale (« \(P \Rightarrow Q\) » devient « \(P\) et non \(Q\) ») : $$\exists\varepsilon>0,\ \forall\eta>0,\ \exists x \in I,\ |x-a| \lt \eta \ \text{ et } \ |f(x)-\ell|\geq\varepsilon .$$ C'est exactement la définition de « \(f\) n'a pas pour limite \(\ell\) en \(a\) ». Sans le « \(\forall x \in I\) » de l'énoncé, la proposition n'aurait pas de sens précis : la variable \(x\) doit être quantifiée.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Raisonnement par l'absurde — irrationalité de \(\sqrt{2}\)</h3>
  <div class="statement">On rappelle qu'un rationnel strictement positif s'écrit \(\frac pq\) avec \(p, q \in \mathbb N^*\) sans diviseur commun autre que 1 (fraction irréductible).</div>
  <div class="q"><strong>Q1.</strong> Montrer par l'absurde que \(\sqrt{2}\) est irrationnel.</div>
  <div class="q"><strong>Q2.</strong> Montrer de même que \(\sqrt{3}\) est irrationnel.</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(\sqrt{2}+\sqrt{3}\) est irrationnel (supposer rationnel et aboutir à une contradiction).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Supposons \(\sqrt{2}=\frac pq\) avec \(p, q \in \mathbb N^*\), fraction irréductible. Alors \(2q^2=p^2\), donc \(p^2\) est pair, donc \(p\) est pair (contraposée démontrée au §4 du cours : le carré d'un impair est impair). Écrivons \(p=2k\) : \(2q^2=4k^2\), soit \(q^2=2k^2\), donc \(q\) est pair aussi. Alors 2 divise \(p\) et \(q\) : contradiction avec l'irréductibilité.</p>
    <p><strong>Q2.</strong> Même raisonnement : \(\sqrt{3}=\frac pq\) irréductible donne \(3q^2 = p^2\), donc 3 divise \(p^2\). Par disjonction des cas (cours, §4), le reste de \(p^2\) dans la division par 3 vaut 1 si \(p\) n'est pas multiple de 3 ; donc 3 divise \(p\). Avec \(p=3k\) : \(q^2 = 3k^2\), donc de même 3 divise \(q\). Contradiction.</p>
    <p><strong>Q3.</strong> Supposons \(\sqrt{2}+\sqrt{3}=r\in\mathbb{Q}\) ; alors \(r \gt 0\). On a \(\sqrt{3}=r-\sqrt{2}\), donc \(3=(r-\sqrt{2})^2=r^2-2r\sqrt{2}+2\), d'où \(\sqrt{2}=\frac{r^2-1}{2r}\in\mathbb{Q}\) (on peut diviser : \(r \neq 0\)). C'est contraire à Q1. Donc \(\sqrt{2}+\sqrt{3}\notin\mathbb{Q}\). (Valeur : \(\sqrt 2 + \sqrt 3 \approx 3{,}146\).)</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Récurrence — somme et inégalité</h3>
  <div class="statement">Récurrences simples. (La somme de Q1 se calcule aussi directement, sans récurrence : chapitre <a href="#calculs/cours">« Calculs algébriques »</a>, §3.)</div>
  <div class="q"><strong>Q1.</strong> Montrer par récurrence que \(\sum_{k=1}^n k = \frac{n(n+1)}{2}\) pour tout \(n \ge 1\).</div>
  <div class="q"><strong>Q2.</strong> Montrer par récurrence que \(2^n > n^2\) pour tout \(n\geq5\).</div>
  <div class="q"><strong>Q3.</strong> L'inégalité \(2^n \gt n^2\) est-elle vraie pour \(n = 0, 1, 2, 3, 4\) ? L'hérédité de Q2 est-elle valable à partir de \(n = 3\) ? Qu'en conclure sur le rôle de l'initialisation ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> <em>Initialisation</em> (\(n=1\)) : \(1=\frac{1\cdot2}{2}\). <em>Hérédité</em> : si la formule vaut au rang \(n\), alors $$\sum_{k=1}^{n+1}k = \frac{n(n+1)}{2}+(n+1) = (n+1)\,\frac{n+2}{2},$$ qui est la formule au rang \(n + 1\). Elle vaut donc pour tout \(n \ge 1\).</p>
    <p><strong>Q2.</strong> <em>Initialisation</em> (\(n=5\)) : \(32>25\). <em>Hérédité</em> : soit \(n \ge 5\) tel que \(2^n>n^2\). Alors \(2^{n+1}=2\cdot2^n>2n^2\). Or, pour \(n \ge 5\), $$2n^2-(n+1)^2=n^2-2n-1=(n-1)^2-2 \ge 14 \gt 0 .$$ Donc \(2^{n+1}>2n^2 \gt (n+1)^2\).</p>
    <p><strong>Q3.</strong> \(n = 0\) : \(1 \gt 0\) ; \(n = 1\) : \(2 \gt 1\) (vraies) ; \(n = 2\) : \(4 \gt 4\) ; \(n = 3\) : \(8 \gt 9\) ; \(n = 4\) : \(16 \gt 16\) (fausses). L'hérédité n'utilise que \((n - 1)^2 \gt 2\), vraie dès \(n \ge 3\) : la propriété est héréditaire à partir du rang 3, et pourtant fausse aux rangs 3 et 4. Seule l'initialisation au rang 5 permet de conclure ; une hérédité ne prouve rien sans point de départ.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Applications — injection, surjection, bijection</h3>
  <div class="statement">Méthode : pour \(y\) donné, résoudre \(f(x) = y\) (cours, §11).</div>
  <div class="q"><strong>Q1.</strong> \(f:\mathbb{R}\to\mathbb{R}\), \(f(x)=2x+1\). Montrer que \(f\) est bijective et donner \(f^{-1}\).</div>
  <div class="q"><strong>Q2.</strong> \(g:\mathbb{R}\to\mathbb{R}\), \(g(x)=x^2\). Montrer que \(g\) n'est ni injective ni surjective.</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(h:\mathbb{R}^+\to\mathbb{R}^+\), \(h(x)=x^2\) est bijective. Donner \(h^{-1}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Injective : \(f(x)=f(y)\Rightarrow2x+1=2y+1\Rightarrow x=y\). Surjective : pour tout \(y\in\mathbb{R}\), \(x=\frac{y-1}{2}\in\mathbb{R}\) vérifie \(f(x)=y\). Bijective, et \(f^{-1}(y)=\frac{y-1}{2}\). Contrôle : \(f(3) = 7\), \(f^{-1}(7) = 3\).</p>
    <p><strong>Q2.</strong> Pas injective : \(g(1)=g(-1)=1\) avec \(1\neq-1\). Pas surjective : \(x^2\geq0\) pour tout réel \(x\), donc \(-1\) n'a pas d'antécédent.</p>
    <p><strong>Q3.</strong> Injective sur \(\mathbb{R}^+\) : si \(x^2=y^2\) avec \(x,y\geq0\), alors \((x - y)(x + y) = 0\) ; si \(x + y = 0\), alors \(x = y = 0\) ; sinon \(x = y\). Surjective : pour tout \(y\geq0\), \(x=\sqrt{y}\geq0\) vérifie \(h(x)=y\). Bijective, \(h^{-1}(y)=\sqrt{y}\). La même formule \(x^2\) donne une bijection ou non selon les ensembles de départ et d'arrivée.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Opérations ensemblistes, parties et partitions</h3>
  <div class="statement">Soit \(E=\{1,\ldots,6\}\), \(A=\{1,2,3,4\}\) et \(B=\{3,4,5,6\}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(A\cap B\), \(A\cup B\), \(\overline{A}\), \(A\setminus B\).</div>
  <div class="q"><strong>Q2.</strong> Vérifier \(\overline{A\cup B}=\overline{A}\cap\overline{B}\) sur cet exemple.</div>
  <div class="q"><strong>Q3.</strong> Montrer la loi de De Morgan \(\overline{A\cup B}=\overline{A}\cap\overline{B}\) en général (pour deux parties quelconques d'un ensemble).</div>
  <div class="q"><strong>Q4.</strong> Combien d'éléments de \(\mathcal P(E)\) contiennent \(A \cap B\) ? Combien sont inclus dans \(A \cap B\) ?</div>
  <div class="q"><strong>Q5.</strong> Les familles \((A \setminus B,\ A \cap B,\ B \setminus A)\), \((A, B)\) et \((A, \overline B)\) sont-elles des partitions de \(E\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(A\cap B=\{3,4\}\), \(A\cup B=\{1,2,3,4,5,6\}=E\), \(\overline{A}=\{5,6\}\), \(A\setminus B=\{1,2\}\).</p>
    <p><strong>Q2.</strong> \(\overline{A\cup B}=\overline{E}=\varnothing\) et \(\overline{A}\cap\overline{B}=\{5,6\}\cap\{1,2\}=\varnothing\).</p>
    <p><strong>Q3.</strong> Pour tout \(x \in E\), par De Morgan pour les propositions : $$x\in\overline{A\cup B}\iff x\notin A\cup B\iff \big(x\notin A\text{ et }x\notin B\big) \iff x\in\overline{A}\cap\overline{B} .$$ Les deux ensembles ont les mêmes éléments.</p>
    <p><strong>Q4.</strong> Une partie qui contient \(\{3, 4\}\) s'écrit \(\{3, 4\} \cup C\) avec \(C\) partie quelconque de \(\{1, 2, 5, 6\}\) : il y en a \(2^4 = 16\). Les parties incluses dans \(\{3, 4\}\) sont \(\varnothing\), \(\{3\}\), \(\{4\}\), \(\{3, 4\}\) : il y en a \(2^2 = 4\).</p>
    <p><strong>Q5.</strong> \((\{1, 2\}, \{3, 4\}, \{5, 6\})\) : parties non vides, deux à deux disjointes, de réunion \(E\) : c'est une partition. \((A, B)\) n'en est pas une : \(A \cap B = \{3, 4\} \neq \varnothing\). \((A, \overline B) = (\{1, 2, 3, 4\}, \{1, 2\})\) non plus : 1 et 2 sont dans les deux parties, et 5, 6 dans aucune.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Récurrences double et forte — suite de Fibonacci</h3>
  <div class="statement">La suite de Fibonacci est définie par \(F_0=0\), \(F_1=1\), \(F_{n+2}=F_{n+1}+F_n\). On note \(\varphi=\frac{1+\sqrt5}{2}\approx1{,}618\) (nombre d'or), qui vérifie \(\varphi^2=\varphi+1\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(F_2,\ldots,F_8\).</div>
  <div class="q"><strong>Q2.</strong> Montrer par récurrence que \(F_n\leq\varphi^n\) pour tout \(n \in \mathbb N\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(F_{n+1}F_{n-1}-F_n^2=(-1)^n\) pour tout \(n\geq1\) (identité de Cassini).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(F_2, \ldots, F_8 = 1,2,3,5,8,13,21\).</p>
    <p><strong>Q2.</strong> Récurrence double (chaque terme dépend des deux précédents). <em>Initialisation</em> : \(F_0=0\leq1=\varphi^0\) et \(F_1=1\leq\varphi\). <em>Hérédité</em> : si \(F_n\leq\varphi^n\) et \(F_{n+1}\leq\varphi^{n+1}\), alors $$F_{n+2}=F_{n+1}+F_n\leq\varphi^{n+1}+\varphi^{n}=\varphi^{n}(\varphi+1)=\varphi^{n}\varphi^2=\varphi^{n+2}.$$ La même preuve donne même \(F_n \le \varphi^{n-1}\) pour \(n \ge 1\) (\(F_1 = 1 = \varphi^0\), \(F_2 = 1 \le \varphi\)) : la suite croît au plus comme \(\varphi^n\). (Dans l'énoncé d'origine, l'initialisation affirmait à tort \(F_1 = \varphi^1\) : c'est une inégalité stricte, \(1 \lt 1{,}618\).)</p>
    <p><strong>Q3.</strong> Récurrence simple sur \(n \ge 1\). <em>Initialisation</em> : \(F_2F_0-F_1^2=0-1=-1=(-1)^1\). <em>Hérédité</em> : supposons \(F_{n+1}F_{n-1}-F_n^2=(-1)^n\). Avec \(F_{n+2}=F_{n+1}+F_n\) puis \(F_{n+1}-F_n=F_{n-1}\) : $$F_{n+2}F_n-F_{n+1}^2=F_{n+1}F_n+F_n^2-F_{n+1}^2=F_n^2-F_{n+1}(F_{n+1}-F_n)=F_n^2-F_{n+1}F_{n-1}=-(-1)^n=(-1)^{n+1}.$$ Contrôle \(n = 5\) : \(F_6F_4 - F_5^2 = 8 \times 3 - 25 = -1\). (Le PGCD de deux termes consécutifs, autrefois demandé ici, est traité dans l'exercice « Concours PT » du chapitre <a href="#calculs/exos">« Calculs algébriques »</a> ; on le retrouve aussi avec Cassini : un diviseur commun de \(F_n\) et \(F_{n+1}\) divise \((-1)^n\).)</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Quantificateurs : vrai ou faux ?</h3>
  <div class="statement">Chaque réponse doit être justifiée : un exemple ou une preuve pour une proposition vraie, sa négation démontrée pour une proposition fausse.</div>
  <div class="q"><strong>Q1.</strong> Dire si chaque proposition est vraie ou fausse : (a) \(\forall x \in \mathbb R,\ \exists y \in \mathbb R,\ x + y = 0\) ; (b) \(\exists y \in \mathbb R,\ \forall x \in \mathbb R,\ x + y = 0\) ; (c) \(\forall x \in \mathbb R,\ \exists y \in \mathbb R,\ y^2 = x\) ; (d) \(\exists x \in \mathbb R,\ \forall y \in \mathbb R,\ x \le y^2\) ; (e) \(\forall \varepsilon \gt 0,\ \exists n \in \mathbb N^*,\ \frac1n \lt \varepsilon\).</div>
  <div class="q"><strong>Q2.</strong> Écrire la négation de (c) et de (d).</div>
  <div class="q"><strong>Q3.</strong> Soit \(f : \mathbb R \to \mathbb R\). Écrire avec des quantificateurs : « \(f\) ne s'annule pas » ; « \(f\) n'est pas la fonction nulle » ; « \(f\) est constante ». Les deux premières phrases disent-elles la même chose ?</div>
  <div class="q"><strong>Q4.</strong> Écrire la négation de « \(f\) est strictement croissante sur \(\mathbb R\) » et donner une fonction qui la vérifie.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> (a) Vraie : pour \(x\) donné, \(y = -x\) convient (\(y\) dépend de \(x\)). (b) Fausse : si un tel \(y\) existait, \(x = 0\) donnerait \(y = 0\), puis \(x = 1\) donnerait \(1 + 0 = 0\). (c) Fausse : pour \(x = -1\), aucun réel n'a un carré négatif. (d) Vraie : \(x = 0\) convient, car \(y^2 \ge 0\) pour tout \(y\) (tout \(x \le 0\) convient aussi). (e) Vraie : pour \(\varepsilon \gt 0\), un entier \(n \gt \frac1\varepsilon\) convient, par exemple \(n = \lfloor 1/\varepsilon\rfloor + 1\) ; pour \(\varepsilon = 0{,}03\), \(n = 34\) donne \(\frac{1}{34} \approx 0{,}029 \lt 0{,}03\).</p>
    <p><strong>Q2.</strong> Non (c) : \(\exists x \in \mathbb R,\ \forall y \in \mathbb R,\ y^2 \neq x\) (vraie, avec \(x = -1\)). Non (d) : \(\forall x \in \mathbb R,\ \exists y \in \mathbb R,\ x \gt y^2\) (fausse : pour \(x = 0\), il faudrait \(y^2 \lt 0\)).</p>
    <p><strong>Q3.</strong> « \(f\) ne s'annule pas » : \(\forall x \in \mathbb R,\ f(x) \neq 0\). « \(f\) n'est pas la fonction nulle » : \(\exists x \in \mathbb R,\ f(x) \neq 0\). « \(f\) est constante » : \(\exists c \in \mathbb R,\ \forall x \in \mathbb R,\ f(x) = c\) (ou \(\forall (x, y) \in \mathbb R^2,\ f(x) = f(y)\)). Les deux premières sont différentes : \(f(x) = x\) n'est pas la fonction nulle, mais s'annule en 0.</p>
    <p><strong>Q4.</strong> « \(f\) strictement croissante » : \(\forall (x, y) \in \mathbb R^2,\ x \lt y \Rightarrow f(x) \lt f(y)\). Négation : \(\exists (x, y) \in \mathbb R^2,\ x \lt y \text{ et } f(x) \ge f(y)\). Une fonction constante la vérifie (\(x = 0\), \(y = 1\) : \(f(0) \ge f(1)\)) : elle est croissante, mais pas strictement. Attention, « non strictement croissante » ne veut pas dire « décroissante ».</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Analyse-synthèse : équations fonctionnelles et décomposition</h3>
  <div class="statement">Dans les trois questions, on cherche <em>toutes</em> les solutions : rédiger une analyse, puis une synthèse.</div>
  <div class="q"><strong>Q1.</strong> Déterminer toutes les fonctions \(f : \mathbb R \to \mathbb R\) telles que \(f(x) + 2f(-x) = x^2 + x\) pour tout réel \(x\).</div>
  <div class="q"><strong>Q2.</strong> Écrire \(g : x \mapsto \dfrac{x + 1}{x^2 + 1}\) comme somme d'une fonction paire et d'une fonction impaire (cours, §5).</div>
  <div class="q"><strong>Q3.</strong> Déterminer toutes les fonctions \(f : \mathbb R \to \mathbb R\) telles que \(f(x)f(y) - f(xy) = x + y\) pour tous réels \(x\), \(y\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> <em>Analyse.</em> Soit \(f\) une solution. En remplaçant \(x\) par \(-x\) : \(f(-x) + 2f(x) = x^2 - x\). Multiplions cette égalité par 2 et retranchons la relation de départ : \(4f(x) - f(x) = 2x^2 - 2x - x^2 - x\), soit \(3f(x) = x^2 - 3x\). Donc nécessairement \(f(x) = \frac{x^2}{3} - x\) pour tout \(x\). <em>Synthèse.</em> Pour cette fonction, $$f(x) + 2f(-x) = \frac{x^2}{3} - x + 2\left(\frac{x^2}{3} + x\right) = x^2 + x .$$ Il y a donc une unique solution, \(f : x \mapsto \frac{x^2}{3} - x\).</p>
    <p><strong>Q2.</strong> Par les formules du cours, \(p(x) = \frac{g(x) + g(-x)}{2} = \frac{1}{x^2 + 1}\) (paire) et \(i(x) = \frac{g(x) - g(-x)}{2} = \frac{x}{x^2 + 1}\) (impaire), et \(g = p + i\) ; cette décomposition est la seule. Contrôle en \(x = 1\) : \(g(1) = 1 = \frac12 + \frac12\).</p>
    <p><strong>Q3.</strong> <em>Analyse.</em> Soit \(f\) une solution. Avec \(y = 0\) : \(f(x)f(0) - f(0) = x\), soit \(f(0)\big(f(x) - 1\big) = x\) pour tout \(x\). Si \(f(0) = 0\), on obtiendrait \(0 = x\) pour tout \(x\), ce qui est faux (\(x = 1\)). Donc \(f(0) \neq 0\). Avec \(x = 0\) dans la même relation : \(f(0)\big(f(0) - 1\big) = 0\), donc \(f(0) = 1\). Alors \(f(x) - 1 = x\) : nécessairement \(f(x) = x + 1\). <em>Synthèse.</em> \((x + 1)(y + 1) - (xy + 1) = x + y\) : la fonction \(x \mapsto x + 1\) convient, et c'est la seule.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Images directes et réciproques</h3>
  <div class="statement">Soit \(f : \mathbb R \to \mathbb R\), \(f(x) = x^2 - 4x + 3\).</div>
  <div class="q"><strong>Q1.</strong> Écrire \(f(x)\) sous forme canonique et dresser le tableau de variations de \(f\). Déterminer \(f([0, 3])\) et \(f(\mathbb R)\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(f^{-1}([-1, 0])\), \(f^{-1}(\{3\})\) et \(f^{-1}(]-\infty, -2])\).</div>
  <div class="q"><strong>Q3.</strong> Avec \(A = [0, 1]\), calculer \(f(A)\) puis \(f^{-1}\big(f(A)\big)\). Comparer à \(A\).</div>
  <div class="q"><strong>Q4.</strong> Avec \(B = [-3, 0]\), calculer \(f^{-1}(B)\) puis \(f\big(f^{-1}(B)\big)\). Comparer à \(B\).</div>
  <div class="q"><strong>Q5.</strong> Pour une application quelconque \(g : E \to F\), montrer que \(A \subset g^{-1}\big(g(A)\big)\) pour toute partie \(A\) de \(E\), avec égalité si \(g\) est injective.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f(x) = (x - 2)^2 - 1\) : \(f\) décroît sur \(]-\infty, 2]\), croît sur \([2, +\infty[\), minimum \(f(2) = -1\). Sur \([0, 3]\) : \(f(0) = 3\), \(f(2) = -1\), \(f(3) = 0\) ; la fonction est continue, donc \(f([0, 3]) = [-1, 3]\) (le maximum 3 est atteint en 0, pas en 3). \(f(\mathbb R) = [-1, +\infty[\).</p>
    <p><strong>Q2.</strong> $$f(x) \in [-1, 0] \iff (x - 2)^2 \le 1 \iff |x - 2| \le 1 ,$$ donc \(f^{-1}([-1, 0]) = [1, 3]\). \(f(x) = 3 \iff x(x - 4) = 0\) : \(f^{-1}(\{3\}) = \{0, 4\}\). Comme \(f \ge -1\), \(f^{-1}(]-\infty, -2]) = \varnothing\).</p>
    <p><strong>Q3.</strong> \(f\) décroît sur \([0, 1]\) de \(f(0) = 3\) à \(f(1) = 0\) : \(f(A) = [0, 3]\). Puis $$f(x) \in [0, 3] \iff 1 \le (x - 2)^2 \le 4 \iff 1 \le |x - 2| \le 2 ,$$ donc \(f^{-1}(f(A)) = [0, 1] \cup [3, 4]\), qui contient strictement \(A\). Les points de \([3, 4]\) ont la même image que ceux de \([0, 1]\) (symétrie par rapport à 2) : c'est le défaut d'injectivité.</p>
    <p><strong>Q4.</strong> \(f(x) \in [-3, 0] \iff f(x) \le 0\) (puisque \(f \ge -1\)) \(\iff |x - 2| \le 1\) : \(f^{-1}(B) = [1, 3]\), et \(f([1, 3]) = [-1, 0]\), strictement inclus dans \(B\). Les valeurs de \([-3, -1[\) ne sont pas atteintes : \(f(f^{-1}(B)) = B \cap f(\mathbb R)\), c'est le défaut de surjectivité.</p>
    <p><strong>Q5.</strong> Si \(x \in A\), alors \(g(x) \in g(A)\), donc \(x \in g^{-1}(g(A))\). Supposons \(g\) injective et soit \(x \in g^{-1}(g(A))\) : \(g(x) \in g(A)\), donc il existe \(a \in A\) tel que \(g(x) = g(a)\) ; par injectivité \(x = a \in A\). D'où l'égalité.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Composées, injectivité et surjectivité</h3>
  <div class="statement">Soient \(f : E \to F\) et \(g : F \to G\) deux applications.</div>
  <div class="q"><strong>Q1.</strong> Montrer que si \(g \circ f\) est injective, alors \(f\) est injective ; et que si \(g \circ f\) est surjective, alors \(g\) est surjective.</div>
  <div class="q"><strong>Q2.</strong> On prend \(E = F = G = \mathbb N\), \(f(n) = 2n\) et \(g(n) = \lfloor n/2 \rfloor\) (partie entière). Calculer \(g \circ f\), puis \((f \circ g)(n)\) pour \(n = 0, \ldots, 5\). Étudier l'injectivité et la surjectivité de \(f\) et de \(g\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que si \(g \circ f\) est injective et \(f\) surjective, alors \(g\) est injective.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Si \(f(x) = f(x')\), alors en appliquant \(g\) : \((g \circ f)(x) = (g \circ f)(x')\), donc \(x = x'\) par injectivité de \(g \circ f\). Ensuite, soit \(z \in G\) : il existe \(x \in E\) tel que \(g(f(x)) = z\), donc \(y = f(x) \in F\) est un antécédent de \(z\) par \(g\).</p>
    <p><strong>Q2.</strong> \(g(f(n)) = \lfloor 2n/2 \rfloor = n\) : \(g \circ f = \mathrm{id}_{\mathbb N}\). En revanche, \((f \circ g)(n) = 2\lfloor n/2 \rfloor\) vaut \(0, 0, 2, 2, 4, 4\) pour \(n = 0, \ldots, 5\) : \(f \circ g \neq \mathrm{id}_{\mathbb N}\). Par Q1, \(f\) est injective (\(g \circ f\) l'est) et \(g\) est surjective (\(g \circ f\) l'est). Mais \(f\) n'est pas surjective (1 n'est pas pair) et \(g\) n'est pas injective (\(g(2) = g(3) = 1\)). Ainsi \(g \circ f = \mathrm{id}\) ne suffit pas pour que \(f\) soit bijective : il faut aussi \(f \circ g = \mathrm{id}\) (cours, §11). Sur des ensembles finis de même cardinal, ce phénomène est impossible.</p>
    <p><strong>Q3.</strong> Soient \(y, y' \in F\) tels que \(g(y) = g(y')\). Comme \(f\) est surjective, \(y = f(x)\) et \(y' = f(x')\) pour certains \(x, x' \in E\). Alors \((g \circ f)(x) = (g \circ f)(x')\), donc \(x = x'\) (injectivité de \(g \circ f\)), puis \(y = f(x) = f(x') = y'\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Indicatrices et différence symétrique</h3>
  <div class="statement">Pour deux parties \(A\), \(B\) d'un ensemble \(E\), on définit leur différence symétrique \(A \,\Delta\, B = (A \setminus B) \cup (B \setminus A)\) : les éléments qui sont dans une et une seule des deux parties.</div>
  <div class="q"><strong>Q1.</strong> Dans \(E = \{1, \ldots, 8\}\), avec \(A = \{1, 2, 3, 4\}\), \(B = \{3, 4, 5, 6\}\), \(C = \{2, 4, 6, 8\}\), calculer \(A \,\Delta\, B\), \((A \,\Delta\, B) \,\Delta\, C\) et \(A \,\Delta\, (B \,\Delta\, C)\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que $$\mathbf 1_{A \Delta B} = \mathbf 1_A + \mathbf 1_B - 2\,\mathbf 1_A \mathbf 1_B = (\mathbf 1_A - \mathbf 1_B)^2 .$$</div>
  <div class="q"><strong>Q3.</strong> En déduire que \((A \,\Delta\, B) \,\Delta\, C = A \,\Delta\, (B \,\Delta\, C)\), et décrire cet ensemble à l'aide du nombre de parties parmi \(A\), \(B\), \(C\) qui contiennent un élément donné.</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(A \,\Delta\, B = \varnothing \iff A = B\), puis que \(A \,\Delta\, B = A \,\Delta\, C \Rightarrow B = C\).</div>
  <div class="q"><strong>Q5.</strong> Si \(E\) est fini, montrer que \(|A \,\Delta\, B| = |A| + |B| - 2|A \cap B|\) et le vérifier sur Q1.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(A \setminus B = \{1, 2\}\), \(B \setminus A = \{5, 6\}\), donc \(A \,\Delta\, B = \{1, 2, 5, 6\}\) ; puis \((A \,\Delta\, B) \,\Delta\, C = \{1, 5\} \cup \{4, 8\} = \{1, 4, 5, 8\}\). De même \(B \,\Delta\, C = \{2, 3, 5, 8\}\) et \(A \,\Delta\, (B \,\Delta\, C) = \{1, 4\} \cup \{5, 8\} = \{1, 4, 5, 8\}\) : même résultat.</p>
    <p><strong>Q2.</strong> \(A \setminus B\) et \(B \setminus A\) sont disjointes, donc l'indicatrice de leur réunion est la somme : $$\mathbf 1_A(1 - \mathbf 1_B) + \mathbf 1_B(1 - \mathbf 1_A) = \mathbf 1_A + \mathbf 1_B - 2\,\mathbf 1_A\mathbf 1_B .$$ Enfin, en développant, $$(\mathbf 1_A - \mathbf 1_B)^2 = \mathbf 1_A^2 - 2\,\mathbf 1_A\mathbf 1_B + \mathbf 1_B^2$$ est la même chose, car \(\mathbf 1_A^2 = \mathbf 1_A\) et \(\mathbf 1_B^2 = \mathbf 1_B\).</p>
    <p><strong>Q3.</strong> Notons \(a = \mathbf 1_A\), \(b = \mathbf 1_B\), \(c = \mathbf 1_C\) (fonctions à valeurs dans \(\{0, 1\}\)). Par Q2, avec \(u = a + b - 2ab\) : $$\mathbf 1_{(A \Delta B) \Delta C} = u + c - 2uc = a + b + c - 2(ab + bc + ca) + 4abc .$$ Cette expression est symétrique en \(a\), \(b\), \(c\) : le même calcul pour \(A \,\Delta\, (B \,\Delta\, C)\) donne le même résultat, et les deux parties sont égales. En un point où \(k\) des trois indicatrices valent 1, l'expression vaut \(k - 2\binom k2 + 4\binom k3\), soit \(0, 1, 0, 1\) pour \(k = 0, 1, 2, 3\) : l'ensemble est formé des éléments qui appartiennent à un nombre <em>impair</em> des parties \(A\), \(B\), \(C\). Contrôle sur Q1 : 1, 5, 8 sont dans une seule partie, 4 dans les trois.</p>
    <p><strong>Q4.</strong> $$A \,\Delta\, B = \varnothing \iff (\mathbf 1_A - \mathbf 1_B)^2 = 0 \iff \mathbf 1_A = \mathbf 1_B \iff A = B .$$ Ensuite, par Q3 et \(A \,\Delta\, A = \varnothing\), \(\varnothing \,\Delta\, X = X\) : si \(A \,\Delta\, B = A \,\Delta\, C\), alors $$B = (A \,\Delta\, A) \,\Delta\, B = A \,\Delta\, (A \,\Delta\, B) = A \,\Delta\, (A \,\Delta\, C) = C .$$ La différence symétrique, contrairement à la réunion, se « simplifie ».</p>
    <p><strong>Q5.</strong> On somme la formule de Q2 sur les éléments de \(E\) : \(\sum \mathbf 1_{A \Delta B} = |A| + |B| - 2|A \cap B|\), car \(\mathbf 1_A \mathbf 1_B = \mathbf 1_{A \cap B}\). Sur Q1 : \(4 + 4 - 2 \times 2 = 4 = |\{1, 2, 5, 6\}|\).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Involutions d'un ensemble</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : applications, partitions, raisonnement par disjonction des cas et par récurrence).</div>
  <div class="statement">Soit \(E\) un ensemble. Une application \(f : E \to E\) est une <strong>involution</strong> de \(E\) si \(f \circ f = \mathrm{id}_E\). Un <strong>point fixe</strong> de \(f\) est un élément \(x\) tel que \(f(x) = x\) ; on note \(\operatorname{Fix}(f)\) l'ensemble des points fixes.</div>
  <p class="exo-part">Partie A — Généralités et exemples</p>
  <div class="q"><strong>A1.</strong> Montrer qu'une involution de \(E\) est bijective et égale à sa réciproque.</div>
  <div class="q"><strong>A2.</strong> Vérifier que les applications suivantes sont des involutions : \(x \mapsto -x\) sur \(\mathbb R\) ; \(x \mapsto \frac1x\) sur \(\mathbb R^*\) ; \(z \mapsto \overline z\) sur \(\mathbb C\) ; \(A \mapsto \overline A\) (complémentaire) sur \(\mathcal P(E)\). Préciser leurs points fixes.</div>
  <div class="q"><strong>A3.</strong> Soit \(a \in \mathbb R\) et \(f_a(x) = \dfrac{ax + 1}{x - a}\) pour \(x \in \mathbb R \setminus \{a\}\). Montrer que \(f_a\) est à valeurs dans \(\mathbb R \setminus \{a\}\), que c'est une involution de \(\mathbb R \setminus \{a\}\), et déterminer ses points fixes. Que donne \(a = 1\) ?</div>
  <p class="exo-part">Partie B — Points fixes et partition (\(E\) fini)</p>
  <div class="q"><strong>B1.</strong> Soit \(f\) une involution de \(E\). Pour \(x \in E\), on pose \(O_x = \{x, f(x)\}\). Montrer que pour tous \(x\), \(y\) de \(E\), les parties \(O_x\) et \(O_y\) sont égales ou disjointes.</div>
  <div class="q"><strong>B2.</strong> En déduire que les parties \(O_x\) distinctes forment une partition de \(E\), dont chaque partie a un ou deux éléments, puis que \(|E| - |\operatorname{Fix}(f)|\) est pair.</div>
  <div class="q"><strong>B3.</strong> Montrer que si \(|E|\) est impair, toute involution de \(E\) a un point fixe. Le vérifier sur \(E = \{1, \ldots, 7\}\) et \(f(k) = 8 - k\). Expliquer pourquoi le complémentaire, involution de \(\mathcal P(E)\) sans point fixe si \(E \neq \varnothing\), ne contredit pas ce résultat.</div>
  <p class="exo-part">Partie C — Nombre d'involutions</p>
  <div class="q"><strong>C1.</strong> Pour \(n \ge 1\), on note \(I_n\) le nombre d'involutions de \(\{1, \ldots, n\}\). Donner \(I_1\), \(I_2\), et décrire les involutions de \(\{1, 2, 3\}\).</div>
  <div class="q"><strong>C2.</strong> Montrer que \(I_n = I_{n-1} + (n - 1)\,I_{n-2}\) pour tout \(n \ge 3\) (distinguer selon la valeur de \(f(n)\)). Calculer \(I_4\), \(I_5\), \(I_6\).</div>
  <div class="q"><strong>C3.</strong> Montrer par récurrence double que \(I_n \ge \sqrt{n!}\) pour tout \(n \ge 1\).</div>
  <div class="q"><strong>C4.</strong> Écrire une fonction Python <span class="code-inline">involutions(n)</span> qui renvoie \(I_n\) pour \(n \ge 1\) à l'aide de la relation de C2. Que renvoie <span class="code-inline">involutions(10)</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> L'application \(h = f\) vérifie \(h \circ f = \mathrm{id}_E\) et \(f \circ h = \mathrm{id}_E\) : par la caractérisation du cours (§11), \(f\) est bijective et \(f^{-1} = f\).</p>
    <p><strong>A2.</strong> \(-(-x) = x\) ; \(\frac{1}{1/x} = x\) ; \(\overline{\overline z} = z\) ; \(\overline{\overline A} = A\). Points fixes : \(\{0\}\) ; \(\{-1, 1\}\) ; \(\mathbb R\) (les \(z\) réels) ; aucun si \(E \neq \varnothing\), car \(A = \overline A\) entraînerait \(A = A \cap \overline A = \varnothing\) et \(A = A \cup \overline A = E\).</p>
    <p><strong>A3.</strong> Si \(f_a(x) = a\), alors \(ax + 1 = ax - a^2\), soit \(1 = -a^2\), impossible : \(f_a\) est à valeurs dans \(\mathbb R \setminus \{a\}\). Pour \(x \neq a\), en multipliant numérateur et dénominateur par \(x - a\) :
    $$f_a\big(f_a(x)\big) = \frac{a(ax + 1) + (x - a)}{(ax + 1) - a(x - a)} = \frac{(a^2 + 1)\,x}{a^2 + 1} = x .$$
    Points fixes : $$f_a(x) = x \iff ax + 1 = x^2 - ax \iff x^2 - 2ax - 1 = 0 \iff x = a \pm \sqrt{a^2 + 1} ,$$ deux réels différents de \(a\). Pour \(a = 1\) : \(f_1(x) = \frac{x + 1}{x - 1}\), involution de \(\mathbb R \setminus \{1\}\), de points fixes \(1 \pm \sqrt 2\) ; contrôle : \(f_1(3) = 2\) et \(f_1(2) = 3\).</p>
    <p><strong>B1.</strong> Remarquons que si \(z \in O_x\), alors \(O_z = O_x\) : si \(z = x\), c'est clair ; si \(z = f(x)\), alors \(f(z) = f(f(x)) = x\) et \(O_z = \{f(x), x\} = O_x\). Supposons \(O_x \cap O_y \neq \varnothing\) et prenons \(z\) dans l'intersection : \(O_x = O_z = O_y\). Donc deux parties \(O_x\), \(O_y\) sont égales ou disjointes.</p>
    <p><strong>B2.</strong> Les parties \(O_x\) sont non vides (\(x \in O_x\)), leur réunion est \(E\) (chaque \(x\) est dans \(O_x\)), et deux d'entre elles distinctes sont disjointes (B1) : c'est une partition de \(E\). \(O_x\) a un élément si \(f(x) = x\), deux sinon. Les parties à un élément sont les \(\{x\}\) pour \(x \in \operatorname{Fix}(f)\) ; s'il y a \(p\) parties à deux éléments, \(|E| = |\operatorname{Fix}(f)| + 2p\) (cardinal d'une réunion disjointe), donc \(|E| - |\operatorname{Fix}(f)| = 2p\) est pair.</p>
    <p><strong>B3.</strong> Par l'absurde : si \(\operatorname{Fix}(f) = \varnothing\), alors \(|E| = 2p\) serait pair. Exemple : \(8 - k = k \iff k = 4\), unique point fixe ; la partition est \(\{1, 7\}, \{2, 6\}, \{3, 5\}, \{4\}\). Le complémentaire agit sur \(\mathcal P(E)\), de cardinal \(2^{|E|}\), pair si \(E \neq \varnothing\) : il n'y a pas de contradiction, ses parties \(\{A, \overline A\}\) ont toutes deux éléments.</p>
    <p><strong>C1.</strong> \(I_1 = 1\) (l'identité) ; \(I_2 = 2\) (l'identité et l'échange de 1 et 2). Pour \(\{1, 2, 3\}\) : l'identité, et les trois involutions qui échangent deux éléments et fixent le troisième (\(1 \leftrightarrow 2\), \(1 \leftrightarrow 3\), \(2 \leftrightarrow 3\)). Une involution ne peut pas « faire tourner » les trois éléments (\(1 \to 2 \to 3 \to 1\)), car alors \(f(f(1)) = 3 \neq 1\). Donc \(I_3 = 4\).</p>
    <p><strong>C2.</strong> Soit \(f\) une involution de \(\{1, \ldots, n\}\) ; disjonction des cas selon \(f(n)\). <em>Si \(f(n) = n\)</em> : \(f\) envoie \(\{1, \ldots, n-1\}\) dans lui-même (si \(k \le n - 1\) avait pour image \(n\), on aurait \(k = f(f(k)) = f(n) = n\)), et sa restriction est une involution de \(\{1, \ldots, n-1\}\) ; réciproquement, toute involution de \(\{1, \ldots, n-1\}\), prolongée par \(n \mapsto n\), convient : \(I_{n-1}\) involutions. <em>Si \(f(n) = k \neq n\)</em> : alors \(f(k) = n\), et \(f\) induit une involution des \(n - 2\) éléments restants ; il y a \(n - 1\) choix de \(k\), puis \(I_{n-2}\) involutions de ces \(n - 2\) éléments (on les renumérote de 1 à \(n - 2\)). Les deux cas s'excluent et couvrent tout : \(I_n = I_{n-1} + (n - 1)\,I_{n-2}\). D'où \(I_4 = 4 + 3 \times 2 = 10\), \(I_5 = 10 + 4 \times 4 = 26\), \(I_6 = 26 + 5 \times 10 = 76\).</p>
    <p><strong>C3.</strong> <em>Initialisation</em> : \(I_1 = 1 = \sqrt{1!}\) et \(I_2 = 2 \ge \sqrt 2\). <em>Hérédité</em> : soit \(n \ge 1\) tel que \(I_n \ge \sqrt{n!}\) et \(I_{n+1} \ge \sqrt{(n+1)!}\). Alors $$I_{n+2} = I_{n+1} + (n + 1)\,I_n \ge \sqrt{n!}\,\big(\sqrt{n + 1} + n + 1\big),$$ et il suffit de voir que \(\sqrt{n + 1} + (n + 1) \ge \sqrt{(n + 1)(n + 2)}\), c'est-à-dire, en divisant par \(\sqrt{n + 1} \gt 0\), \(1 + \sqrt{n + 1} \ge \sqrt{n + 2}\). Les deux membres étant positifs, on compare leurs carrés : \(n + 2 + 2\sqrt{n + 1} \ge n + 2\). Donc \(I_{n+2} \ge \sqrt{n!\,(n + 1)(n + 2)} = \sqrt{(n+2)!}\). Contrôle : \(I_6 = 76 \ge \sqrt{720} \approx 26{,}8\).</p>
    <p><strong>C4.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> involutions(n):
    <span class="kw">if</span> n == 1:
        <span class="kw">return</span> 1
    a, b = 1, 2              <span class="cmt"># I_1, I_2</span>
    <span class="kw">for</span> k <span class="kw">in</span> range(3, n + 1):
        a, b = b, b + (k - 1) * a
    <span class="kw">return</span> b</pre>
    <p>Invariant de boucle : après le tour d'indice \(k\), \((a, b) = (I_{k-1}, I_k)\). On obtient successivement \(I_7 = 232\), \(I_8 = 764\), \(I_9 = 2\,620\), et <span class="code-inline">involutions(10)</span> renvoie \(9\,496\). Un dénombrement direct, par énumération des \(10! = 3\,628\,800\) applications bijectives, donnerait le même nombre, bien plus lentement.</p>
  </div>
</div>
