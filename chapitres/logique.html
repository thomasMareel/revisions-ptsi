  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la section « Raisonnement et vocabulaire ensembliste » du programme de PTSI : rudiments de logique, ensembles, applications. Ce sont les outils de rédaction de toutes les démonstrations de l'année ; le programme précise qu'ils s'acquièrent progressivement, au fil du premier semestre, et non d'un seul bloc. Le paragraphe « Ensembles de nombres usuels » de la même section (divisibilité, PGCD, nombres premiers) et les calculs de sommes sont dans le chapitre <a href="#calculs/cours">« Calculs algébriques et arithmétique »</a> ; les cardinaux des ensembles finis dans le chapitre <a href="#denombrmt/cours">« Dénombrement et combinatoire »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

<div class="course-section">
  <div class="sec-num">§1 · PROPOSITIONS ET CONNECTEURS</div>
  <h2>Combiner des énoncés vrais ou faux</h2>
  <div class="intro">Une démonstration enchaîne des énoncés dont chacun est vrai ou faux. Les connecteurs « non », « et », « ou » fabriquent de nouveaux énoncés à partir d'anciens ; leur sens est fixé une fois pour toutes par une table de vérité. C'est ce qui permet, en particulier, de nier correctement une phrase, geste qui revient sans cesse (contre-exemple, raisonnement par l'absurde, contraposée).</div>

  <div class="def-box">
    Une <strong>proposition</strong> (ou assertion) est un énoncé mathématique qui est soit vrai (V), soit faux (F). À partir de deux propositions \(P\) et \(Q\), on forme :
    <ul>
      <li>la <strong>négation</strong> « non \(P\) » (notée aussi \(\neg P\)), vraie exactement quand \(P\) est fausse ;</li>
      <li>la <strong>conjonction</strong> « \(P\) et \(Q\) » (notée \(P \wedge Q\)), vraie exactement quand \(P\) et \(Q\) sont toutes deux vraies ;</li>
      <li>la <strong>disjonction</strong> « \(P\) ou \(Q\) » (notée \(P \vee Q\)), vraie quand au moins l'une des deux est vraie : le « ou » mathématique est <strong>inclusif</strong>.</li>
    </ul>
    Deux propositions sont <strong>équivalentes</strong> si elles ont la même valeur de vérité dans tous les cas.
  </div>

  <table>
    <tr><th>\(P\)</th><th>\(Q\)</th><th>non \(P\)</th><th>\(P\) et \(Q\)</th><th>\(P\) ou \(Q\)</th><th>\(P \Rightarrow Q\)</th><th>\(P \iff Q\)</th></tr>
    <tr><td>V</td><td>V</td><td>F</td><td>V</td><td>V</td><td>V</td><td>V</td></tr>
    <tr><td>V</td><td>F</td><td>F</td><td>F</td><td>V</td><td>F</td><td>F</td></tr>
    <tr><td>F</td><td>V</td><td>V</td><td>F</td><td>V</td><td>V</td><td>F</td></tr>
    <tr><td>F</td><td>F</td><td>V</td><td>F</td><td>F</td><td>V</td><td>V</td></tr>
  </table>
  <p>Les deux dernières colonnes (implication, équivalence) sont commentées au §2. On lit une table ligne par ligne : chaque ligne est une des quatre situations possibles pour le couple \((P, Q)\).</p>

  <div class="prop-box">
    <strong>Règles de calcul.</strong> Pour toutes propositions \(P\), \(Q\), \(R\) : non (non \(P\)) équivaut à \(P\) ; « et » et « ou » sont commutatifs, associatifs, et chacun est distributif sur l'autre ; enfin les <strong>lois de De Morgan</strong> donnent la négation d'une conjonction et d'une disjonction :
    <div class="formula" data-nom="Lois de De Morgan (logique)">$$\begin{aligned} \text{non}\,(P \text{ et } Q) &\iff (\text{non}\,P) \text{ ou } (\text{non}\,Q), \\ \text{non}\,(P \text{ ou } Q) &\iff (\text{non}\,P) \text{ et } (\text{non}\,Q). \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Comparer les tables de vérité.</span>
    <div class="content"><p>« non (\(P\) et \(Q\)) » est fausse seulement sur la ligne où \(P\) et \(Q\) sont vraies ; « (non \(P\)) ou (non \(Q\)) » aussi, puisque c'est la seule ligne où non \(P\) et non \(Q\) sont toutes deux fausses. Les deux propositions ont la même table : elles sont équivalentes. La seconde loi s'obtient en appliquant la première à non \(P\) et non \(Q\), puis en niant les deux membres.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — nier un encadrement, tester un « ou »</strong>
    <ol>
      <li>Pour un réel \(x\), la proposition « \(0 \le x\) et \(x \le 1\) » signifie \(x \in [0, 1]\). Sa négation est, par De Morgan, « \(x \lt 0\) ou \(x \gt 1\) », c'est-à-dire \(x \notin [0, 1]\). Contrôle : \(x = 2\) rend fausse la proposition (car \(2 \gt 1\)) et vraie la négation.</li>
      <li>« \(x \le 1\) ou \(x \ge 0\) » est vraie pour <em>tout</em> réel : si \(x \gt 1\), alors \(x \ge 0\). Pour \(x = \frac12\), les deux sont vraies à la fois, et la disjonction reste vraie : le « ou » est inclusif.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : nier « \(0 \le x\) et \(x \le 1\) » en « \(x \lt 0\) et \(x \gt 1\) » (proposition toujours fausse !) ; la négation d'un « et » est un « ou ». Autre confusion : lire le « ou » comme exclusif (« l'un ou l'autre, mais pas les deux ») ; en mathématiques, il ne l'est jamais sauf mention contraire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · IMPLICATION, CONTRAPOSÉE, ÉQUIVALENCE</div>
  <h2>« Si… alors », condition nécessaire, condition suffisante</h2>
  <div class="intro">Presque tous les théorèmes ont la forme « si \(P\), alors \(Q\) ». Savoir ce qu'affirme exactement une implication, la distinguer de sa réciproque et la remplacer au besoin par sa contraposée, c'est le cœur de la rédaction mathématique. C'est aussi là qu'apparaît le vocabulaire « nécessaire » et « suffisant ».</div>

  <div class="def-box">
    L'<strong>implication</strong> \(P \Rightarrow Q\) (« si \(P\), alors \(Q\) », « \(P\) implique \(Q\) ») est la proposition « (non \(P\)) ou \(Q\) » : elle n'est fausse que lorsque \(P\) est vraie et \(Q\) fausse. Quand elle est vraie, on dit que :
    <ul>
      <li>\(P\) est une <strong>condition suffisante</strong> de \(Q\) : « pour que \(Q\), il suffit que \(P\) » ;</li>
      <li>\(Q\) est une <strong>condition nécessaire</strong> de \(P\) : « pour que \(P\), il faut que \(Q\) ».</li>
    </ul>
    La <strong>réciproque</strong> de \(P \Rightarrow Q\) est \(Q \Rightarrow P\) ; sa <strong>contraposée</strong> est \((\text{non}\,Q) \Rightarrow (\text{non}\,P)\). L'<strong>équivalence</strong> \(P \iff Q\) est « (\(P \Rightarrow Q\)) et (\(Q \Rightarrow P\)) » : \(P\) est une condition nécessaire et suffisante de \(Q\) (« \(P\) si et seulement si \(Q\) »).
  </div>

  <div class="prop-box">
    <strong>Contraposée et négation.</strong> Une implication et sa contraposée sont équivalentes ; la négation d'une implication n'est pas une implication :
    <div class="formula" data-nom="Contraposée, négation d'une implication">$$\begin{aligned} (P \Rightarrow Q) &\iff (\text{non}\,Q \Rightarrow \text{non}\,P), \\ \text{non}\,(P \Rightarrow Q) &\iff \big(P \text{ et non}\,Q\big). \end{aligned}$$</div>
    En revanche, une implication et sa réciproque ne sont pas équivalentes en général. Enfin, si \(P \Rightarrow Q\) et \(Q \Rightarrow R\), alors \(P \Rightarrow R\) (transitivité) : c'est ce qui permet d'enchaîner les étapes d'une preuve.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Écrire tout avec « non », « et », « ou ».</span>
    <div class="content"><p>\(\text{non}\,Q \Rightarrow \text{non}\,P\) est, par définition, « non (non \(Q\)) ou (non \(P\)) », soit « \(Q\) ou non \(P\) », c'est-à-dire « (non \(P\)) ou \(Q\) » : c'est \(P \Rightarrow Q\). Pour la négation, De Morgan donne non((non \(P\)) ou \(Q\)) \(\iff\) (non non \(P\)) et (non \(Q\)) \(\iff\) \(P\) et non \(Q\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — nécessaire ou suffisant ?</strong>
    <ol>
      <li>Pour un réel \(x\) : « \(x = 2 \Rightarrow x^2 = 4\) » est vraie. Sa réciproque « \(x^2 = 4 \Rightarrow x = 2\) » est fausse : \(x = -2\) rend \(x^2 = 4\) vraie et \(x = 2\) fausse. Donc « \(x = 2\) » est suffisant, mais pas nécessaire, pour avoir \(x^2 = 4\) ; la condition nécessaire et suffisante est « \(x = 2\) ou \(x = -2\) ».</li>
      <li>Pour un entier \(n\) : « \(n\) multiple de 6 \(\Rightarrow\) \(n\) pair » est vraie (\(6k = 2 \times 3k\)). « \(n\) pair » est donc une condition nécessaire pour que \(n\) soit multiple de 6, mais pas suffisante : \(n = 4\) est pair sans être multiple de 6.</li>
      <li>Contraposée de la première implication : « \(x^2 \neq 4 \Rightarrow x \neq 2\) ». Négation de la réciproque : « \(x^2 = 4\) et \(x \neq 2\) », vraie pour \(x = -2\) : c'est exactement un contre-exemple.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la réciproque et la contraposée, ou utiliser un théorème « à l'envers » (de \(P \Rightarrow Q\) et \(Q\) vraie, on ne peut rien dire de \(P\)). Autre piège : une implication dont l'hypothèse est fausse est vraie (« si \(1 = 2\), alors… ») ; ce n'est pas un paradoxe, c'est la table de vérité. Enfin, les symboles \(\Rightarrow\) et \(\iff\) relient des propositions : ils ne remplacent pas « donc » dans une phrase, et dans une chaîne de calculs, chaque \(\iff\) doit être justifié (élever au carré, par exemple, ne donne qu'une implication : voir le §5).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · QUANTIFICATEURS</div>
  <h2>« Pour tout », « il existe », et leur négation</h2>
  <div class="intro">Une définition comme « \(f\) est majorée » ou « \((u_n)\) converge vers \(\ell\) » ne se manipule bien qu'une fois écrite avec des quantificateurs : on voit alors exactement ce qu'il faut démontrer, et ce que dit sa négation. Les quantificateurs sont des objets mathématiques précis, pas des abréviations.</div>

  <div class="def-box">
    Soit \(P(x)\) une proposition qui dépend d'un élément \(x\) d'un ensemble \(E\).
    <ul>
      <li>\(\forall x \in E,\ P(x)\) : « pour tout \(x\) de \(E\), \(P(x)\) » ; vraie si \(P(x)\) est vraie pour chaque \(x\) de \(E\) ;</li>
      <li>\(\exists x \in E,\ P(x)\) : « il existe (au moins) un \(x\) de \(E\) tel que \(P(x)\) » ;</li>
      <li>\(\exists!\, x \in E,\ P(x)\) : « il existe un unique \(x\) de \(E\) tel que \(P(x)\) » (existence <em>et</em> unicité).</li>
    </ul>
    La variable \(x\) est <strong>muette</strong> : \(\forall x \in E,\ P(x)\) et \(\forall t \in E,\ P(t)\) disent la même chose.
  </div>

  <div class="prop-box">
    <strong>Négation et ordre.</strong> Nier, c'est échanger \(\forall\) et \(\exists\) puis nier ce qui suit :
    <div class="formula" data-nom="Négation des quantificateurs">$$\begin{aligned} \text{non}\,\big(\forall x \in E,\ P(x)\big) &\iff \exists x \in E,\ \text{non}\,P(x), \\ \text{non}\,\big(\exists x \in E,\ P(x)\big) &\iff \forall x \in E,\ \text{non}\,P(x). \end{aligned}$$</div>
    Deux quantificateurs de même nature peuvent être permutés ; un \(\forall\) et un \(\exists\), en général, non : dans « \(\forall x,\ \exists y,\ \ldots\) », \(y\) peut dépendre de \(x\) ; dans « \(\exists y,\ \forall x,\ \ldots\) », le même \(y\) convient pour tous les \(x\).
  </div>
  <p>Conséquence pratique : pour démontrer une proposition « \(\forall x\) », on fixe un \(x\) quelconque (« soit \(x \in E\) ») et on raisonne sur lui ; pour la <strong>réfuter</strong>, un seul <strong>contre-exemple</strong> suffit. Pour démontrer « \(\exists x\) », il suffit d'exhiber un \(x\) qui convient, ou d'en prouver l'existence par un théorème.</p>

  <div class="method-box">
    <strong>Exemple — traduire, nier, vérifier</strong>
    <ol>
      <li>« \(f : \mathbb R \to \mathbb R\) est majorée » s'écrit \(\exists M \in \mathbb R,\ \forall x \in \mathbb R,\ f(x) \le M\). Négation : \(\forall M \in \mathbb R,\ \exists x \in \mathbb R,\ f(x) \gt M\). Pour \(f(x) = x^2\), la négation est vraie : à \(M\) donné, \(x = |M| + 1\) donne \(x^2 \ge |M| + 1 \gt M\) ; pour \(M = 100\), \(x = 101\) et \(x^2 = 10\,201 \gt 100\).</li>
      <li>« \(f\) est croissante » : \(\forall (x, y) \in \mathbb R^2,\ x \le y \Rightarrow f(x) \le f(y)\). Négation : \(\exists (x, y) \in \mathbb R^2,\ x \le y \text{ et } f(x) \gt f(y)\). Pour \(f = \cos\), le couple \((0, \pi)\) convient : \(\cos 0 = 1 \gt -1 = \cos \pi\).</li>
      <li>Ordre : « \(\forall x \in \mathbb R,\ \exists y \in \mathbb R,\ y \gt x\) » est vraie (prendre \(y = x + 1\), qui dépend de \(x\)) ; « \(\exists y \in \mathbb R,\ \forall x \in \mathbb R,\ y \gt x\) » est fausse (avec \(x = y\), on aurait \(y \gt y\)).</li>
      <li>Contre-exemple célèbre : \(n^2 + n + 41\) est premier pour \(n = 0, 1, \ldots, 39\), mais « \(\forall n \in \mathbb N,\ n^2 + n + 41\) est premier » est fausse : pour \(n = 40\), on obtient \(1\,681 = 41^2\). Quarante vérifications ne prouvent pas un « pour tout ».</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : nier « \(\forall x,\ P(x)\) » en « \(\forall x,\ \text{non}\,P(x)\) » (le contraire de « tous les élèves ont la moyenne » n'est pas « aucun élève n'a la moyenne »). Autres pièges : oublier de nier l'implication qui suit les quantificateurs (« \(x \le y \Rightarrow \ldots\) » devient « \(x \le y\) et \(\ldots\) ») ; écrire \(\forall\) ou \(\exists\) au milieu d'une phrase comme abréviation de « pour tout » ; placer « \(\forall x\) » à la fin (« \(f(x) \ge 0\ \forall x\) »), ce qui rend l'ordre ambigu.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · MODES DE RAISONNEMENT</div>
  <h2>Direct, par contraposition, par l'absurde, par disjonction des cas</h2>
  <div class="intro">Il n'y a pas de recette universelle, mais quelques schémas de preuve reviennent constamment. Reconnaître celui qui s'adapte à l'énoncé fait gagner beaucoup de temps : la forme de la conclusion (implication, non-existence, propriété d'un entier quelconque) oriente souvent le choix.</div>

  <div class="prop-box">
    <strong>Quatre schémas.</strong> Pour démontrer \(P \Rightarrow Q\) ou une proposition \(R\) :
    <ul>
      <li><strong>direct</strong> : on suppose \(P\) et on en déduit \(Q\) par une suite d'implications (exemple : si \(x \ge 1\), alors \(x^2 - x = x(x - 1) \ge 0\), donc \(x^2 \ge x\)) ;</li>
      <li><strong>par contraposition</strong> : on démontre \(\text{non}\,Q \Rightarrow \text{non}\,P\), équivalente (§2), quand la négation de \(Q\) est plus facile à exploiter ;</li>
      <li><strong>par l'absurde</strong> : on suppose \(\text{non}\,R\) et on en déduit une contradiction (une proposition à la fois vraie et fausse) ; donc \(R\) est vraie. Pour \(R = (P \Rightarrow Q)\), on suppose \(P\) et \(\text{non}\,Q\) ;</li>
      <li><strong>par disjonction des cas</strong> : si \(C_1\) ou \(C_2\) ou … ou \(C_k\) est toujours vraie (les cas couvrent toutes les situations), il suffit de démontrer \(R\) dans chaque cas.</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Exemple — trois schémas sur des entiers</strong>
    <ol>
      <li><em>Contraposition.</em> « Si \(n^2\) est pair, alors \(n\) est pair. » La conclusion « \(n\) pair » est difficile à atteindre depuis \(n^2\) ; on démontre la contraposée « si \(n\) est impair, alors \(n^2\) est impair » : si \(n = 2k + 1\), alors \(n^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1\). Contrôle : \(7^2 = 49 = 2 \times 24 + 1\).</li>
      <li><em>Disjonction des cas.</em> « Le reste de \(n^2\) dans la division par 3 vaut 0 ou 1. » Tout entier s'écrit \(3k\), \(3k + 1\) ou \(3k + 2\) : on trouve \(n^2 = 3(3k^2)\), \(3(3k^2 + 2k) + 1\), \(3(3k^2 + 4k + 1) + 1\). Contrôle : \(5^2 = 25 = 3 \times 8 + 1\). Conséquence : si 3 divise \(n^2\), on est dans le premier cas, donc 3 divise \(n\).</li>
      <li><em>Absurde.</em> « \(\frac{\ln 2}{\ln 3}\) est irrationnel. » Supposons \(\frac{\ln 2}{\ln 3} = \frac pq\) avec \(p, q\) entiers naturels non nuls (le quotient est strictement positif). Alors \(q \ln 2 = p \ln 3\), donc \(2^q = 3^p\) : un nombre pair égal à un nombre impair, contradiction. (Valeur : \(\frac{\ln 2}{\ln 3} \approx 0{,}6309\).)</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dans un raisonnement par l'absurde, oublier d'écrire clairement ce que l'on suppose, ou conclure par une contradiction qui ne vient pas de l'hypothèse ajoutée (alors le raisonnement est faux ailleurs). Dans une disjonction des cas, les cas peuvent se chevaucher, mais ils doivent <strong>tout</strong> couvrir : « \(n\) pair, \(n\) multiple de 3 » n'épuise pas les entiers (\(n = 5\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RAISONNEMENT PAR ANALYSE-SYNTHÈSE</div>
  <h2>Trouver tous les objets qui conviennent</h2>
  <div class="intro">Pour résoudre un problème du type « trouver tous les \(x\) tels que… » ou « montrer qu'il existe un unique objet tel que… », on procède en deux temps. L'analyse dit ce que doit être une solution : ce sont des <strong>conditions nécessaires</strong>. La synthèse vérifie que les candidats trouvés conviennent vraiment : la condition est <strong>suffisante</strong>.</div>

  <div class="def-box">
    <strong>Analyse</strong> : on suppose qu'un objet \(x\) est solution et l'on en déduit des propriétés, jusqu'à restreindre \(x\) à une liste de candidats (souvent un seul : c'est l'<strong>unicité</strong>). <strong>Synthèse</strong> : on vérifie que chaque candidat est effectivement solution (c'est l'<strong>existence</strong>), et l'on conclut par l'ensemble exact des solutions.
  </div>

  <div class="method-box">
    <strong>Exemple — l'équation \(\sqrt{x + 2} = x\)</strong>
    <ol>
      <li><em>Analyse.</em> Soit \(x \ge -2\) une solution. Alors \(x \ge 0\) (une racine carrée est positive) et, en élevant au carré, \(x + 2 = x^2\), soit \((x - 2)(x + 1) = 0\) : \(x = 2\) ou \(x = -1\). Comme \(x \ge 0\), nécessairement \(x = 2\).</li>
      <li><em>Synthèse.</em> \(\sqrt{2 + 2} = 2\) : le candidat convient. L'ensemble des solutions est \(\{2\}\).</li>
      <li>Remarque : \(-1\) vérifie \(x + 2 = x^2\) (\(1 = 1\)) mais pas l'équation (\(\sqrt 1 = 1 \neq -1\)). Élever au carré n'est qu'une implication : sans la synthèse, on aurait trouvé une solution de trop.</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Décomposition paire-impaire.</strong> Toute fonction \(f : \mathbb R \to \mathbb R\) s'écrit de façon unique \(f = p + i\) avec \(p\) paire et \(i\) impaire, et
    <div class="formula" data-nom="Partie paire, partie impaire">$$p(x) = \frac{f(x) + f(-x)}{2}, \qquad i(x) = \frac{f(x) - f(-x)}{2}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Analyse : remplacer \(x\) par \(-x\). Synthèse : vérifier.</span>
    <div class="content"><p><em>Analyse.</em> Si \(f = p + i\) avec \(p\) paire et \(i\) impaire, alors pour tout \(x\) : \(f(x) = p(x) + i(x)\) et \(f(-x) = p(x) - i(x)\). En ajoutant et en retranchant ces deux égalités, on trouve les formules ci-dessus : \(p\) et \(i\) sont déterminées par \(f\), d'où l'unicité.</p>
    <p><em>Synthèse.</em> Définissons \(p\) et \(i\) par ces formules. Alors \(p(-x) = \frac{f(-x) + f(x)}{2} = p(x)\), \(i(-x) = \frac{f(-x) - f(x)}{2} = -i(x)\), et \(p(x) + i(x) = f(x)\) : la décomposition existe.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — deux décompositions</strong>
    <ol>
      <li>\(f(x) = (x + 1)^2 = x^2 + 2x + 1\) : \(p(x) = x^2 + 1\) et \(i(x) = 2x\). Contrôle en \(x = 2\) : \(p(2) + i(2) = 5 + 4 = 9 = f(2)\), et \(p(2) - i(2) = 1 = f(-2)\).</li>
      <li>\(f = \exp\) : \(p(x) = \frac{e^x + e^{-x}}{2} = \operatorname{ch} x\) et \(i(x) = \frac{e^x - e^{-x}}{2} = \operatorname{sh} x\), d'où \(e^x = \operatorname{ch} x + \operatorname{sh} x\) (chapitre <a href="#fonctions/cours">« Fonctions réelles »</a>).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : s'arrêter après l'analyse (on n'a que des conditions nécessaires : les candidats ne sont peut-être pas solutions), ou ne faire que la synthèse (on obtient une solution, sans savoir s'il y en a d'autres). Rédiger les deux étapes sous leurs titres « Analyse » et « Synthèse » évite les deux pièges.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RAISONNEMENT PAR RÉCURRENCE</div>
  <h2>Démontrer une propriété pour tous les entiers</h2>
  <div class="intro">Une infinité de vérifications est impossible ; la récurrence la remplace par deux : un point de départ et un mécanisme de propagation d'un rang au suivant. C'est l'outil naturel pour les suites définies par récurrence, les sommes (chapitre <a href="#calculs/cours">« Calculs algébriques »</a>), les inégalités entre puissances, et la preuve des algorithmes (invariants de boucle, en informatique).</div>

  <div class="prop-box">
    <strong>Principe de récurrence.</strong> Soit \(n_0 \in \mathbb N\) et, pour chaque entier \(n \ge n_0\), une proposition \(\mathcal P(n)\).
    <ul>
      <li><strong>Simple</strong> : si \(\mathcal P(n_0)\) est vraie (initialisation) et si, pour tout \(n \ge n_0\), \(\mathcal P(n) \Rightarrow \mathcal P(n + 1)\) (hérédité), alors \(\mathcal P(n)\) est vraie pour tout \(n \ge n_0\).</li>
      <li><strong>Double</strong> : si \(\mathcal P(n_0)\) et \(\mathcal P(n_0 + 1)\) sont vraies et si, pour tout \(n \ge n_0\), « \(\mathcal P(n)\) et \(\mathcal P(n + 1)\) » implique \(\mathcal P(n + 2)\), alors \(\mathcal P(n)\) est vraie pour tout \(n \ge n_0\).</li>
      <li><strong>Forte</strong> : si \(\mathcal P(n_0)\) est vraie et si, pour tout \(n \ge n_0\), « \(\mathcal P(k)\) pour tout \(k \in \{n_0, \ldots, n\}\) » implique \(\mathcal P(n + 1)\), alors \(\mathcal P(n)\) est vraie pour tout \(n \ge n_0\).</li>
    </ul>
    Toute construction ou axiomatique de \(\mathbb N\) est hors programme : ce principe est admis.
  </div>

  <div class="method-box">
    <strong>Exemple — récurrence simple : l'inégalité de Bernoulli</strong>
    <ol>
      <li>Soit \(x \ge -1\). Pour \(n \in \mathbb N\), notons \(\mathcal P(n)\) : « \((1 + x)^n \ge 1 + nx\) ».</li>
      <li><em>Initialisation</em> : \((1 + x)^0 = 1 = 1 + 0 \cdot x\).</li>
      <li><em>Hérédité</em> : soit \(n \in \mathbb N\) tel que \(\mathcal P(n)\). Comme \(1 + x \ge 0\), on peut multiplier l'inégalité par \(1 + x\) :
      $$(1 + x)^{n+1} \ge (1 + nx)(1 + x) = 1 + (n + 1)x + nx^2 \ge 1 + (n + 1)x .$$</li>
      <li><em>Conclusion</em> : \(\mathcal P(n)\) est vraie pour tout \(n\). Contrôle : \(1{,}1^{10} \approx 2{,}594 \ge 1 + 10 \times 0{,}1 = 2\). L'hypothèse \(x \ge -1\) a servi (pour multiplier par \(1 + x \ge 0\)) : sans elle, l'inégalité peut être fausse ; pour \(x = -3\) et \(n = 5\), \((1 + x)^5 = -32\) alors que \(1 + 5x = -14\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — récurrence double et récurrence forte</strong>
    <ol>
      <li><em>Double.</em> \(u_0 = 0\), \(u_1 = 1\) et \(u_{n+2} = 3u_{n+1} - 2u_n\). Les premiers termes \(0, 1, 3, 7, 15\) suggèrent \(u_n = 2^n - 1\). Vrai aux rangs 0 et 1 ; si c'est vrai aux rangs \(n\) et \(n + 1\), alors
      $$u_{n+2} = 3(2^{n+1} - 1) - 2(2^n - 1) = 6 \cdot 2^n - 2 \cdot 2^n - 1 = 2^{n+2} - 1 .$$
      Une récurrence simple ne suffirait pas : \(u_{n+2}\) dépend de <em>deux</em> termes précédents.</li>
      <li><em>Forte.</em> \(v_0 = 1\) et \(v_{n+1} = v_0 + v_1 + \cdots + v_n\). On trouve \(1, 1, 2, 4, 8\) et l'on montre \(v_n = 2^{n-1}\) pour \(n \ge 1\). Vrai pour \(n = 1\). Si \(v_k = 2^{k-1}\) pour tout \(k \in \{1, \ldots, n\}\), alors, par la somme géométrique,
      $$v_{n+1} = 1 + \sum_{k=1}^{n} 2^{k-1} = 1 + (2^n - 1) = 2^n .$$
      Il fallait connaître <em>tous</em> les termes précédents.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : l'hérédité doit être démontrée pour <strong>tout</strong> \(n \ge n_0\). Le faux argument « dans tout ensemble de \(n\) chevaux, tous ont la même couleur » échoue exactement au passage de \(n = 1\) à \(n = 2\). Autres pièges : oublier l'initialisation (« \(n^2 + n + 1\) est pair » est héréditaire, puisque \((n + 1)^2 + (n + 1) + 1 = (n^2 + n + 1) + 2(n + 1)\), mais toujours fausse : \(n^2 + n = n(n + 1)\) est pair) ; écrire « supposons \(\mathcal P(n)\) vraie pour tout \(n\) », ce qui suppose le résultat ; énoncer \(\mathcal P(n)\) avec un « \(\forall n\) » à l'intérieur.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ENSEMBLES, PARTIES, ENSEMBLE DES PARTIES</div>
  <h2>Appartenance, inclusion, \(\mathcal P(E)\)</h2>
  <div class="intro">Le vocabulaire des ensembles sert à décrire les objets étudiés (ensembles de solutions, domaines de définition, événements en probabilités, sous-espaces en algèbre linéaire). Le point de vue du programme est intuitif : un ensemble est une collection d'objets, ses éléments ; on ne fait pas de théorie des ensembles.</div>

  <div class="def-box">
    <ul>
      <li>\(x \in E\) : « \(x\) appartient à \(E\) » ; \(\varnothing\) est l'ensemble vide, qui n'a aucun élément.</li>
      <li>Un ensemble se décrit <strong>en extension</strong> (\(\{1, 2, 3\}\)) ou <strong>en compréhension</strong> (\(\{x \in \mathbb R \mid x^2 \le 2\}\) : les éléments de \(\mathbb R\) qui vérifient une propriété).</li>
      <li>\(A\) est <strong>inclus</strong> dans \(B\) (\(A \subset B\)), ou \(A\) est une <strong>partie</strong> de \(B\), si \(\forall x \in A,\ x \in B\). On a \(A = B\) si et seulement si \(A \subset B\) et \(B \subset A\) (<strong>double inclusion</strong>).</li>
      <li>L'<strong>ensemble des parties</strong> de \(E\), noté \(\mathcal P(E)\), est l'ensemble dont les éléments sont les parties de \(E\) : \(A \in \mathcal P(E) \iff A \subset E\). Il contient toujours \(\varnothing\) et \(E\).</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Exemple — les parties d'un ensemble à trois éléments</strong>
    <ol>
      <li>Pour \(E = \{a, b, c\}\) :
      $$\mathcal P(E) = \big\{\varnothing,\ \{a\},\ \{b\},\ \{c\},\ \{a, b\},\ \{a, c\},\ \{b, c\},\ E\big\} ,$$
      soit \(8 = 2^3\) parties. En général, un ensemble à \(n\) éléments a \(2^n\) parties : pour chaque élément, on choisit s'il est dans la partie ou non (chapitre <a href="#denombrmt/cours">« Dénombrement »</a>, §3).</li>
      <li>On a \(a \in E\), \(\{a\} \subset E\) et \(\{a\} \in \mathcal P(E)\), mais \(a \notin \mathcal P(E)\) : les éléments de \(\mathcal P(E)\) sont des ensembles.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une égalité d'ensembles par double inclusion</strong>
    <ol>
      <li>Montrons \(A = \{x \in \mathbb R \mid \exists t \in \mathbb R,\ x = t^2 + 1\} = [1, +\infty[\).</li>
      <li>\(A \subset [1, +\infty[\) : si \(x = t^2 + 1\), alors \(x \ge 1\) car \(t^2 \ge 0\).</li>
      <li>\([1, +\infty[ \subset A\) : si \(x \ge 1\), le réel \(t = \sqrt{x - 1}\) convient, puisque \(t^2 + 1 = x\). Par exemple \(x = 5\) est obtenu avec \(t = 2\) (ou \(t = -2\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(\in\) (un élément dans un ensemble) et \(\subset\) (un ensemble dans un ensemble). \(\varnothing \subset E\) pour tout \(E\), mais \(\varnothing \in E\) est en général faux ; \(\{\varnothing\}\) n'est pas vide (il a un élément). Pour montrer \(A \subset B\), on part d'un élément <em>quelconque</em> de \(A\), jamais d'un exemple.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · OPÉRATIONS, PRODUIT CARTÉSIEN, PARTITIONS</div>
  <h2>Réunion, intersection, complémentaire ; découper un ensemble</h2>
  <div class="intro">Les opérations sur les parties traduisent les connecteurs logiques : « ou » donne la réunion, « et » l'intersection, « non » le complémentaire. Les lois de De Morgan du §1 deviennent ainsi des égalités d'ensembles. Le produit cartésien fabrique les couples (points du plan, résultats de deux expériences) ; une partition découpe un ensemble en morceaux, comme le fait un système complet d'événements en probabilités.</div>

  <div class="def-box">
    Soient \(A\) et \(B\) deux parties d'un ensemble \(E\).
    <ul>
      <li><strong>Réunion</strong> : \(A \cup B = \{x \in E \mid x \in A \text{ ou } x \in B\}\) ; <strong>intersection</strong> : \(A \cap B = \{x \in E \mid x \in A \text{ et } x \in B\}\) ; \(A\) et \(B\) sont <strong>disjointes</strong> si \(A \cap B = \varnothing\).</li>
      <li><strong>Différence</strong> : \(A \setminus B = \{x \in A \mid x \notin B\}\) ; <strong>complémentaire</strong> de \(A\) dans \(E\) : \(\overline A = E \setminus A\) (noté aussi \(A^c\)).</li>
      <li><strong>Produit cartésien</strong> : \(E \times F = \{(x, y) \mid x \in E,\ y \in F\}\), ensemble des <strong>couples</strong> ; plus généralement \(E_1 \times \cdots \times E_n\) est l'ensemble des \(n\)-uplets \((x_1, \ldots, x_n)\), et \(E^n = E \times \cdots \times E\). Deux couples sont égaux si et seulement si leurs composantes sont égales une à une : \((1, 2) \neq (2, 1)\).</li>
    </ul>
  </div>

  <div class="prop-box">
    <strong>Règles de calcul.</strong> Réunion et intersection sont commutatives, associatives, et chacune est distributive sur l'autre :
    <div class="formula" data-nom="Distributivité">$$\begin{aligned} A \cap (B \cup C) &= (A \cap B) \cup (A \cap C), \\ A \cup (B \cap C) &= (A \cup B) \cap (A \cup C). \end{aligned}$$</div>
    De plus \(\overline{\overline A} = A\), \(A \setminus B = A \cap \overline B\), et les <strong>lois de De Morgan</strong> s'écrivent :
    <div class="formula" data-nom="Lois de De Morgan (ensembles)">$$\overline{A \cup B} = \overline A \cap \overline B, \qquad \overline{A \cap B} = \overline A \cup \overline B .$$</div>
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Raisonner sur un élément : c'est De Morgan pour les propositions.</span>
    <div class="content"><p>Soit \(x \in E\). On a \(x \in \overline{A \cup B}\) si et seulement si non (\(x \in A\) ou \(x \in B\)), c'est-à-dire, par De Morgan (§1), (\(x \notin A\)) et (\(x \notin B\)), soit \(x \in \overline A \cap \overline B\). Les deux ensembles ont les mêmes éléments : ils sont égaux. La seconde loi se démontre de même. Les distributivités se ramènent de la même façon à celles de « et » et « ou ».</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — calculer et contrôler sur un ensemble fini</strong>
    <ol>
      <li>Dans \(E = \{1, \ldots, 10\}\), soient \(A\) les multiples de 2 et \(B\) les multiples de 3 : \(A = \{2, 4, 6, 8, 10\}\), \(B = \{3, 6, 9\}\).</li>
      <li>\(A \cap B = \{6\}\), \(A \cup B = \{2, 3, 4, 6, 8, 9, 10\}\), \(A \setminus B = \{2, 4, 8, 10\}\), \(\overline{A \cup B} = \{1, 5, 7\}\).</li>
      <li>Contrôle de De Morgan : \(\overline A = \{1, 3, 5, 7, 9\}\) et \(\overline B = \{1, 2, 4, 5, 7, 8, 10\}\) ont pour intersection \(\{1, 5, 7\}\). Contrôle du cardinal : \(|A \cup B| = 5 + 3 - 1 = 7\).</li>
      <li>Produit cartésien : \(\{0, 1\} \times \{a, b, c\} = \{(0, a), (0, b), (0, c), (1, a), (1, b), (1, c)\}\) a \(2 \times 3 = 6\) éléments.</li>
    </ol>
  </div>

  <div class="def-box">
    Une famille \((A_1, \ldots, A_p)\) de parties de \(E\) est un <strong>recouvrement disjoint</strong> de \(E\) si ces parties sont deux à deux disjointes et si leur réunion est \(E\) : tout élément de \(E\) appartient à <strong>une et une seule</strong> des parties \(A_i\). C'est une <strong>partition</strong> de \(E\) si, de plus, aucune des parties \(A_i\) n'est vide.
  </div>

  <div class="method-box">
    <strong>Exemple — partitions usuelles</strong>
    <ol>
      <li>\(\mathbb Z\) est partitionné en entiers pairs et entiers impairs ; plus généralement, les restes \(0, 1, \ldots, m - 1\) dans la division par \(m\) donnent une partition de \(\mathbb Z\) en \(m\) parties (figure, avec \(m = 3\) et \(E = \{1, \ldots, 12\}\)).</li>
      <li>Si \(A\) est une partie de \(E\) distincte de \(\varnothing\) et de \(E\), \((A, \overline A)\) est une partition de \(E\). Si \(A = \varnothing\), c'est seulement un recouvrement disjoint.</li>
      <li>\(\mathbb R\) est partitionné en \(]-\infty, 0[\), \(\{0\}\) et \(]0, +\infty[\) ; mais pas en \(]-\infty, 0]\) et \([0, +\infty[\), qui ont \(0\) en commun.</li>
      <li>En probabilités, un système complet d'événements est un recouvrement disjoint de l'univers : c'est l'outil de la formule des probabilités totales (chapitre <a href="#proba/cours">« Probabilités »</a>).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : simplifier comme pour des nombres. \(A \cup B = A \cup C\) n'entraîne pas \(B = C\) (prendre \(B \subset A\) et \(C = \varnothing\)) ; \(A \setminus B\) et \(B \setminus A\) diffèrent en général. Pour une partition, vérifier les <strong>trois</strong> conditions : parties non vides, deux à deux disjointes, réunion égale à \(E\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · APPLICATIONS : GRAPHE, FAMILLES, INDICATRICES, COMPOSITION</div>
  <h2>Associer à chaque élément une image</h2>
  <div class="intro">Fonctions numériques, suites, matrices de pixels, applications linéaires : tout cela est un cas particulier de la notion d'application. Le programme ne distingue pas « fonction » et « application » et en garde un point de vue intuitif : une règle qui à chaque élément de l'ensemble de départ associe un unique élément de l'ensemble d'arrivée.</div>

  <div class="def-box">
    <ul>
      <li>Une <strong>application</strong> \(f : E \to F\) associe à tout \(x \in E\) un unique élément \(f(x) \in F\), son <strong>image</strong> ; \(x\) est un <strong>antécédent</strong> de \(y\) si \(f(x) = y\). \(E\) est l'ensemble de départ, \(F\) l'ensemble d'arrivée. Deux applications sont égales si elles ont mêmes ensembles de départ et d'arrivée et les mêmes images.</li>
      <li>Le <strong>graphe</strong> de \(f\) est la partie \(\Gamma_f = \{(x, f(x)) \mid x \in E\}\) de \(E \times F\) ; pour une fonction de \(\mathbb R\) dans \(\mathbb R\), c'est sa courbe représentative.</li>
      <li>L'ensemble des applications de \(E\) dans \(F\) est noté \(\mathcal F(E, F)\) ou \(F^E\).</li>
      <li>Une <strong>famille</strong> \((x_i)_{i \in I}\) d'éléments de \(E\) indexée par \(I\) est une application \(i \mapsto x_i\) de \(I\) dans \(E\) : une suite \((u_n)_{n \in \mathbb N}\) est une famille indexée par \(\mathbb N\), un \(n\)-uplet une famille indexée par \(\{1, \ldots, n\}\).</li>
      <li>Si \(f : E \to F\) et \(g : F \to G\), la <strong>composée</strong> \(g \circ f : E \to G\) est définie par \((g \circ f)(x) = g\big(f(x)\big)\) ; l'<strong>identité</strong> de \(E\) est \(\mathrm{id}_E : x \mapsto x\).</li>
      <li>Si \(A \subset E\), la <strong>restriction</strong> de \(f\) à \(A\) est \(f_{|A} : A \to F\), \(x \mapsto f(x)\). Si \(E \subset E'\), un <strong>prolongement</strong> de \(f\) à \(E'\) est une application \(g : E' \to F\) telle que \(g_{|E} = f\).</li>
    </ul>
  </div>
  <p>La composition est associative : \(h \circ (g \circ f) = (h \circ g) \circ f\), et \(f \circ \mathrm{id}_E = \mathrm{id}_F \circ f = f\). Elle n'est pas commutative : avec \(f(x) = x + 1\) et \(g(x) = x^2\) sur \(\mathbb R\), \((g \circ f)(x) = (x + 1)^2\) et \((f \circ g)(x) = x^2 + 1\) ; en \(x = 1\), on trouve 4 et 2. Un prolongement n'est pas unique : \(x \mapsto \frac{\sin x}{x}\), définie sur \(\mathbb R^*\), se prolonge à \(\mathbb R\) en choisissant n'importe quelle valeur en 0 ; le choix \(1\) est le seul qui donne un prolongement continu (chapitre <a href="#contderiv/cours">« Continuité et dérivabilité »</a>).</p>

  <div class="def-box">
    La <strong>fonction indicatrice</strong> d'une partie \(A\) de \(E\) est \(\mathbf 1_A : E \to \{0, 1\}\), définie par \(\mathbf 1_A(x) = 1\) si \(x \in A\) et \(\mathbf 1_A(x) = 0\) sinon.
  </div>
  <div class="prop-box">
    <strong>Calcul avec les indicatrices.</strong> Pour \(A, B \subset E\) : \(A \subset B \iff \mathbf 1_A \le \mathbf 1_B\), \(A = B \iff \mathbf 1_A = \mathbf 1_B\), et
    <div class="formula" data-nom="Indicatrices">$$\begin{gathered} \mathbf 1_{A \cap B} = \mathbf 1_A\, \mathbf 1_B, \qquad \mathbf 1_{\overline A} = 1 - \mathbf 1_A, \\ \mathbf 1_{A \cup B} = \mathbf 1_A + \mathbf 1_B - \mathbf 1_A\, \mathbf 1_B . \end{gathered}$$</div>
    Si \(E\) est fini, \(\sum_{x \in E} \mathbf 1_A(x) = |A|\) : en sommant la dernière égalité sur \(E\), on retrouve \(|A \cup B| = |A| + |B| - |A \cap B|\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une indicatrice ne prend que les valeurs 0 et 1 : examiner les cas.</span>
    <div class="content"><p>\(\mathbf 1_A(x)\,\mathbf 1_B(x)\) vaut 1 si et seulement si les deux facteurs valent 1, c'est-à-dire si \(x \in A \cap B\). \(1 - \mathbf 1_A(x)\) vaut 1 exactement quand \(x \notin A\). Enfin, par De Morgan, \(\overline{A \cup B} = \overline A \cap \overline B\), donc $$1 - \mathbf 1_{A \cup B} = (1 - \mathbf 1_A)(1 - \mathbf 1_B) = 1 - \mathbf 1_A - \mathbf 1_B + \mathbf 1_A \mathbf 1_B .$$</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — un tableau d'indicatrices</strong>
    <ol>
      <li>Dans \(E = \{1, \ldots, 6\}\), avec \(A = \{1, 2, 3\}\) et \(B = \{2, 4, 6\}\) :</li>
    </ol>
    <table>
      <tr><th>\(x\)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
      <tr><td>\(\mathbf 1_A(x)\)</td><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td></tr>
      <tr><td>\(\mathbf 1_B(x)\)</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td></tr>
      <tr><td>\(\mathbf 1_A \mathbf 1_B\)</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
      <tr><td>\(\mathbf 1_A + \mathbf 1_B - \mathbf 1_A \mathbf 1_B\)</td><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td><td>1</td></tr>
    </table>
    <p>On lit \(A \cap B = \{2\}\) et \(A \cup B = \{1, 2, 3, 4, 6\}\) ; les sommes des lignes donnent \(3 + 3 - 1 = 5\) éléments. En informatique, une partie d'un ensemble fini se code exactement ainsi, par la liste des valeurs de son indicatrice.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre l'application \(f\) et le nombre \(f(x)\) (« la fonction \(x^2\) » se dit « la fonction \(x \mapsto x^2\) ») ; oublier l'ensemble de départ (\(x \mapsto \frac1x\) n'est pas une application de \(\mathbb R\) dans \(\mathbb R\)) ; composer sans vérifier que les images de \(f\) sont dans l'ensemble de départ de \(g\) (\(\ln \circ \sin\) n'est pas définie sur \(\mathbb R\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · IMAGE DIRECTE, IMAGE RÉCIPROQUE</div>
  <h2>Transporter une partie par une application</h2>
  <div class="intro">Que devient un intervalle quand on lui applique une fonction ? Quels sont les \(x\) dont l'image tombe dans une zone donnée ? Ce sont l'image directe et l'image réciproque. Résoudre une inéquation \(f(x) \le c\), c'est précisément calculer une image réciproque.</div>

  <div class="def-box">
    Soit \(f : E \to F\).
    <ul>
      <li>L'<strong>image directe</strong> d'une partie \(A\) de \(E\) est \(f(A) = \{f(x) \mid x \in A\}\) : \(y \in f(A) \iff \exists x \in A,\ y = f(x)\). L'<strong>image</strong> de \(f\) est \(\operatorname{Im} f = f(E)\).</li>
      <li>L'<strong>image réciproque</strong> d'une partie \(B\) de \(F\) est \(f^{-1}(B) = \{x \in E \mid f(x) \in B\}\) : \(x \in f^{-1}(B) \iff f(x) \in B\).</li>
    </ul>
    La notation \(f^{-1}(B)\) a un sens pour <strong>toute</strong> application \(f\), bijective ou non : elle ne suppose pas l'existence d'une réciproque (§11).
  </div>

<text x="352" y="243.6" class="lab-green lab-b" text-anchor="middle">f⁻¹(B) = [−2, −1] ∪ [1, 2]</text>
<text x="352" y="18" class="lab-b" text-anchor="middle">Image réciproque</text>
</svg>
<figcaption>f : ℝ → ℝ, x ↦ x². Image directe : on part de A sur l'axe des abscisses, on monte jusqu'à la courbe et on lit les valeurs atteintes sur l'axe des ordonnées ; f(A) = [0, 4] (le minimum 0 est atteint en 0 ∈ A, le maximum 4 en 2). Image réciproque : on part de B sur l'axe des ordonnées et l'on cherche tous les x dont l'image tombe dans B ; f⁻¹(B) a deux morceaux, car chaque valeur de ]0, +∞[ a deux antécédents.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — avec \(f : x \mapsto x^2\) de \(\mathbb R\) dans \(\mathbb R\)</strong>
    <ol>
      <li>\(f([-1, 2]) = [0, 4]\) : sur \([-1, 0]\), \(f\) décroît de 1 à 0 ; sur \([0, 2]\), elle croît de 0 à 4. On n'obtient pas \([1, 4]\) (images des bornes) : la valeur 0 est atteinte en \(0 \in [-1, 2]\).</li>
      <li>\(f^{-1}([1, 4]) = \{x \mid 1 \le x^2 \le 4\} = [-2, -1] \cup [1, 2]\) ; \(f^{-1}(\{4\}) = \{-2, 2\}\) (les antécédents de 4) ; \(f^{-1}([-3, -1]) = \varnothing\) ; \(f(\mathbb R) = [0, +\infty[\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> Pour \(A, A' \subset E\) et \(B, B' \subset F\) :
    <div class="formula" data-nom="Image réciproque et opérations">$$\begin{aligned} f^{-1}(B \cup B') &= f^{-1}(B) \cup f^{-1}(B'), \\ f^{-1}(B \cap B') &= f^{-1}(B) \cap f^{-1}(B'), \\ f^{-1}(F \setminus B) &= E \setminus f^{-1}(B) ; \end{aligned}$$</div>
    \(f(A \cup A') = f(A) \cup f(A')\), mais seulement \(f(A \cap A') \subset f(A) \cap f(A')\). Enfin \(A \subset f^{-1}\big(f(A)\big)\) et \(f\big(f^{-1}(B)\big) \subset B\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Raisonner par appartenance.</span>
    <div class="content"><p>Pour tout \(x \in E\), $$\begin{aligned} x \in f^{-1}(B \cap B') &\iff f(x) \in B \cap B' \iff \big(f(x) \in B \text{ et } f(x) \in B'\big) \\ &\iff x \in f^{-1}(B) \cap f^{-1}(B') ; \end{aligned}$$ de même pour la réunion et le complémentaire. Pour l'image directe : si \(y \in f(A \cap A')\), il existe \(x \in A \cap A'\) tel que \(y = f(x)\) ; ce \(x\) est dans \(A\) et dans \(A'\), donc \(y \in f(A) \cap f(A')\). La réciproque échoue car un \(y\) de \(f(A) \cap f(A')\) peut avoir un antécédent dans \(A\) et un <em>autre</em> dans \(A'\).</p></div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire \(f(A \cap A') = f(A) \cap f(A')\). Avec \(f(x) = x^2\), \(A = [-2, -1]\), \(A' = [1, 2]\) : \(f(A \cap A') = f(\varnothing) = \varnothing\), alors que \(f(A) \cap f(A') = [1, 4]\). Autre piège : écrire \(f^{-1}(4)\) pour l'ensemble des antécédents de 4 ; c'est \(f^{-1}(\{4\})\), un ensemble, qui peut être vide ou avoir plusieurs éléments.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · INJECTIONS, SURJECTIONS, BIJECTIONS</div>
  <h2>Compter les antécédents</h2>
  <div class="intro">Résoudre l'équation \(f(x) = y\), d'inconnue \(x\), pour un \(y\) donné : a-t-elle au plus une solution, au moins une, exactement une ? Ces trois questions définissent l'injectivité, la surjectivité et la bijectivité. Une bijection permet de « revenir en arrière » : c'est le cas des fonctions réciproques (\(\ln\) et \(\exp\), \(\arctan\) et \(\tan\)), des changements de variable, des changements de base.</div>

  <div class="def-box">
    Une application \(f : E \to F\) est :
    <ul>
      <li><strong>injective</strong> si \(\forall (x, x') \in E^2,\ f(x) = f(x') \Rightarrow x = x'\) : tout élément de \(F\) a <strong>au plus un</strong> antécédent ;</li>
      <li><strong>surjective</strong> si \(\forall y \in F,\ \exists x \in E,\ y = f(x)\) : tout élément de \(F\) a <strong>au moins un</strong> antécédent, c'est-à-dire \(f(E) = F\) ;</li>
      <li><strong>bijective</strong> si elle est injective et surjective : \(\forall y \in F,\ \exists!\, x \in E,\ y = f(x)\). La <strong>réciproque</strong> \(f^{-1} : F \to E\) associe alors à chaque \(y\) son unique antécédent.</li>
    </ul>
  </div>

<figcaption>Chaque point de E émet exactement une flèche : ce sont des applications. Injective : aucun point de F ne reçoit deux flèches (en bleu, deux flèches arrivent au même point). Surjective : tout point de F reçoit au moins une flèche (en rouge, un point non atteint). Bijective : chaque point de F reçoit exactement une flèche ; on retourne les flèches pour obtenir la réciproque.</figcaption>
</figure>

  <div class="method-box">
    <strong>Exemple — le carré selon les ensembles de départ et d'arrivée</strong>
    <ol>
      <li>\(\mathbb R \to \mathbb R\), \(x \mapsto x^2\) : ni injective (\(f(-2) = f(2) = 4\)) ni surjective (\(-1\) n'a pas d'antécédent).</li>
      <li>\([0, +\infty[ \to \mathbb R\) : injective (si \(x, x' \ge 0\) et \(x^2 = x'^2\), alors \(x = x'\)), non surjective.</li>
      <li>\(\mathbb R \to [0, +\infty[\) : surjective (\(y \ge 0\) a pour antécédent \(\sqrt y\)), non injective.</li>
      <li>\([0, +\infty[ \to [0, +\infty[\) : bijective, de réciproque \(y \mapsto \sqrt y\). Le même « \(x^2\) » est donc injectif ou non selon l'ensemble de départ, surjectif ou non selon l'ensemble d'arrivée.</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Composition et réciproque.</strong> Soient \(f : E \to F\) et \(g : F \to G\).
    <ul>
      <li>Si \(f\) et \(g\) sont injectives (respectivement surjectives, bijectives), \(g \circ f\) l'est aussi.</li>
      <li>\(f\) est bijective si et seulement s'il existe \(h : F \to E\) telle que \(h \circ f = \mathrm{id}_E\) et \(f \circ h = \mathrm{id}_F\) ; alors \(h = f^{-1}\), et \(f^{-1}\) est bijective de réciproque \(f\).</li>
      <li>Si \(f\) et \(g\) sont bijectives :
      <div class="formula" data-nom="Réciproque d'une composée">$$(g \circ f)^{-1} = f^{-1} \circ g^{-1} .$$</div></li>
      <li>Si \(f\) est bijective et \(B \subset F\), l'image réciproque de \(B\) par \(f\) est égale à l'image directe de \(B\) par \(f^{-1}\) : les deux lectures de la notation \(f^{-1}(B)\) donnent le même ensemble.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Composée de deux injections, de deux surjections ; réciproque de la composée.</span>
    <div class="content"><p><em>Injections.</em> Si \(g(f(x)) = g(f(x'))\), l'injectivité de \(g\) donne \(f(x) = f(x')\), puis celle de \(f\) donne \(x = x'\). <em>Surjections.</em> Soit \(z \in G\) : il a un antécédent \(y \in F\) par \(g\), qui a lui-même un antécédent \(x \in E\) par \(f\) ; alors \(g(f(x)) = z\). <em>Réciproque.</em> Par associativité, $$(f^{-1} \circ g^{-1}) \circ (g \circ f) = f^{-1} \circ (g^{-1} \circ g) \circ f = f^{-1} \circ f = \mathrm{id}_E ,$$ et de même dans l'autre ordre ; par le deuxième point, \(f^{-1} \circ g^{-1}\) est la réciproque de \(g \circ f\). On retient l'ordre : pour défaire « mettre ses chaussettes puis ses chaussures », on enlève d'abord les chaussures.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — une bijection homographique</strong>
    <ol>
      <li>Soit \(f : \mathbb R \setminus \{3\} \to \mathbb R \setminus \{2\}\), \(x \mapsto \frac{2x + 1}{x - 3}\). Elle est bien à valeurs dans \(\mathbb R \setminus \{2\}\) : \(\frac{2x + 1}{x - 3} = 2\) donnerait \(2x + 1 = 2x - 6\), impossible.</li>
      <li>Soit \(y \neq 2\). Pour \(x \neq 3\) : \(f(x) = y \iff 2x + 1 = y(x - 3) \iff x(y - 2) = 3y + 1 \iff x = \frac{3y + 1}{y - 2}\). Ce réel est différent de 3 (sinon \(3y + 1 = 3y - 6\)). Chaque \(y\) a donc exactement un antécédent : \(f\) est bijective et \(f^{-1}(y) = \frac{3y + 1}{y - 2}\).</li>
      <li>Contrôle : \(f(4) = \frac{9}{1} = 9\) et \(f^{-1}(9) = \frac{28}{7} = 4\).</li>
    </ol>
  </div>
  <p>Entre deux ensembles finis de même cardinal, une application est injective si et seulement si elle est surjective, si et seulement si elle est bijective (chapitre <a href="#denombrmt/cours">« Dénombrement »</a>, §1). C'est faux pour des ensembles infinis : \(n \mapsto 2n\) est une injection non surjective de \(\mathbb N\) dans \(\mathbb N\).</p>
  <div class="notice"><strong>Erreur classique</strong> : prouver l'injectivité avec \(x = x' \Rightarrow f(x) = f(x')\) (c'est vrai pour toute application : c'est l'implication réciproque qu'il faut). Confondre la réciproque \(f^{-1}\) et l'inverse \(\frac1f\) : pour \(f(x) = 2x\), \(f^{-1}(y) = \frac y2\) mais \(\frac{1}{f(x)} = \frac{1}{2x}\). Enfin, \(f^{-1}\) (réciproque) n'existe que pour une bijection, alors que \(f^{-1}(B)\) (image réciproque) existe toujours.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Relations d'équivalence et relations d'ordre</h2>
  <div class="intro">Le programme de PTSI exclut l'étude générale des relations ; il n'en retient que deux exemples : la relation d'ordre \(\le\) sur \(\mathbb R\) (chapitre <a href="#calculs/cours">« Calculs algébriques »</a>, §6) et la congruence modulo \(2\pi\), notée \(a \equiv b\ [2\pi]\) (chapitre <a href="#fonctions/cours">« Fonctions réelles »</a>). Ce qui suit n'est pas exigible.</div>
  <p>Une <strong>relation</strong> \(\mathcal R\) sur un ensemble \(E\) est une propriété \(x \mathcal R y\) portant sur les couples \((x, y)\) de \(E^2\). Elle est <strong>réflexive</strong> si \(x \mathcal R x\) pour tout \(x\), <strong>symétrique</strong> si \(x \mathcal R y \Rightarrow y \mathcal R x\), <strong>antisymétrique</strong> si (\(x \mathcal R y\) et \(y \mathcal R x\)) \(\Rightarrow x = y\), <strong>transitive</strong> si (\(x \mathcal R y\) et \(y \mathcal R z\)) \(\Rightarrow x \mathcal R z\).</p>
  <ul>
    <li>Une <strong>relation d'équivalence</strong> est réflexive, symétrique et transitive. La <strong>classe</strong> de \(x\) est l'ensemble des \(y\) tels que \(x \mathcal R y\) ; les classes distinctes forment une <strong>partition</strong> de \(E\) (§8). Exemple : sur \(\mathbb Z\), « \(a - b\) est multiple de 3 » ; ses trois classes sont les ensembles d'entiers de reste 0, 1, 2 de la figure du §8. La congruence modulo \(2\pi\) sur \(\mathbb R\) en est une autre : ses classes sont les ensembles \(\{\theta + 2k\pi \mid k \in \mathbb Z\}\), qui correspondent aux points du cercle trigonométrique.</li>
    <li>Une <strong>relation d'ordre</strong> est réflexive, antisymétrique et transitive. Exemples : \(\le\) sur \(\mathbb R\) ; l'inclusion sur \(\mathcal P(E)\) ; la divisibilité sur \(\mathbb N^*\). Les deux derniers ordres sont <strong>partiels</strong> : \(\{1\}\) et \(\{2\}\) ne sont pas comparables pour l'inclusion, ni 2 et 3 pour la divisibilité ; l'ordre de \(\mathbb R\) est <strong>total</strong>.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="log-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · LOGIQUE, ENSEMBLES, APPLICATIONS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix gestes de rédaction qui servent dans toutes les démonstrations de l'année : nier une phrase, choisir un mode de raisonnement (direct, contraposée, absurde, disjonction des cas, analyse-synthèse, récurrence), comparer des ensembles, étudier une application (injective, surjective, bijective, images directe et réciproque).</div>

  <div class="method-box"><strong>Méthode 1 — Nier une proposition</strong>
    <ol>
      <li>Écrire la proposition avec ses quantificateurs, dans l'ordre, sans en oublier (une variable « libre » est souvent un \(\forall\) sous-entendu).</li>
      <li>Remplacer chaque \(\forall\) par \(\exists\) et chaque \(\exists\) par \(\forall\), sans changer leur ordre ni les ensembles.</li>
      <li>Nier la partie finale : « et » devient « ou » et inversement (De Morgan), \(\le\) devient \(\gt\), « \(P \Rightarrow Q\) » devient « \(P\) et non \(Q\) ».</li>
    </ol>
    <p><em>Exemple éclair :</em> « \((u_n)\) est bornée » : \(\exists M \in \mathbb R,\ \forall n \in \mathbb N,\ |u_n| \le M\). Négation : \(\forall M \in \mathbb R,\ \exists n \in \mathbb N,\ |u_n| \gt M\). Pour \(u_n = (-1)^n n\) et \(M = 10\), \(n = 11\) convient : \(|u_{11}| = 11 \gt 10\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la négation de « \(\forall x \in E,\ x \ge 0 \Rightarrow f(x) \ge 0\) » est « \(\exists x \in E,\ x \ge 0 \text{ et } f(x) \lt 0\) » ; l'ensemble \(E\) et la condition \(x \ge 0\) ne sont pas niés.</div>

  <div class="method-box"><strong>Méthode 2 — Démontrer une implication</strong>
    <ol>
      <li>Rédiger « Supposons \(P\). Montrons \(Q\). », puis enchaîner des implications justifiées (direct).</li>
      <li>Si \(Q\) est une négation (« \(n\) n'est pas… », « \(x \neq \ldots\) ») ou si son contraire est plus maniable, démontrer la contraposée : « Supposons non \(Q\). Montrons non \(P\). »</li>
      <li>Pour une proposition « \(\forall x \in E,\ P(x) \Rightarrow Q(x)\) », commencer par « Soit \(x \in E\) tel que \(P(x)\). »</li>
    </ol>
    <p><em>Exemple éclair :</em> « Si \(x \neq 1\), alors \(\frac{x + 1}{x - 1} \neq 1\) » se démontre directement : pour \(x \neq 1\), \(\frac{x + 1}{x - 1} - 1 = \frac{2}{x - 1}\), qui n'est pas nul. Pour « si \(a^2 + b^2 = 0\) (réels), alors \(a = b = 0\) », la contraposée est naturelle : si \(a \neq 0\), alors \(a^2 + b^2 \ge a^2 \gt 0\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Démontrer une équivalence ou une égalité d'ensembles</strong>
    <ol>
      <li>Équivalence \(P \iff Q\) : démontrer \(P \Rightarrow Q\), puis \(Q \Rightarrow P\) (ou sa contraposée), en deux paragraphes séparés.</li>
      <li>Égalité \(A = B\) : double inclusion, « Soit \(x \in A\). … donc \(x \in B\). » puis l'inverse ; ou une chaîne d'équivalences \(x \in A \iff \cdots \iff x \in B\), en vérifiant que <em>chaque</em> étape est une équivalence.</li>
      <li>Contrôler sur un élément particulier avant de rédiger.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\{x \in \mathbb R \mid x^2 - 3x + 2 \le 0\} = [1, 2]\), car \(x^2 - 3x + 2 = (x - 1)(x - 2)\) est négatif ou nul exactement entre les racines (tableau de signes). Contrôle : \(x = 1{,}5\) donne \(-0{,}25 \le 0\) ; \(x = 3\) donne \(2 \gt 0\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dans une chaîne d'équivalences, élever au carré, multiplier par une quantité qui peut s'annuler ou diviser par elle ne sont que des implications. Dès qu'une étape n'est qu'une implication, on n'obtient qu'une inclusion : passer à l'analyse-synthèse (méthode 6).</div>

  <div class="method-box"><strong>Méthode 4 — Raisonner par l'absurde</strong>
    <ol>
      <li>Repérer les énoncés de non-existence, d'impossibilité, d'irrationalité, d'unicité : leur négation donne un objet sur lequel calculer.</li>
      <li>Écrire « Supposons par l'absurde que … » avec la négation exacte de la conclusion (méthode 1).</li>
      <li>Déduire une contradiction (un énoncé et son contraire, ou un énoncé manifestement faux), puis conclure « donc … ».</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\log_{10} 2\) est irrationnel. Sinon \(\log_{10} 2 = \frac pq\) avec \(p, q \in \mathbb N^*\) (il est strictement positif), donc \(10^p = 2^q\) : \(5\) divise \(10^p\), mais pas \(2^q\). Contradiction. (\(\log_{10} 2 \approx 0{,}3010\).)</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Raisonner par disjonction des cas</strong>
    <ol>
      <li>Choisir des cas qui couvrent toutes les situations : signe d'une expression, parité, reste dans une division, position de \(x\) par rapport aux points où une valeur absolue change d'expression.</li>
      <li>Traiter chaque cas jusqu'au bout, puis réunir les conclusions (réunion des ensembles de solutions trouvés dans chaque cas).</li>
    </ol>
    <p><em>Exemple éclair :</em> résoudre \(|x - 1| + |x + 2| = 5\). Si \(x \ge 1\) : \(2x + 1 = 5\), \(x = 2\) (qui convient). Si \(-2 \le x \lt 1\) : \(3 = 5\), aucune solution. Si \(x \lt -2\) : \(-2x - 1 = 5\), \(x = -3\) (qui convient). Solutions : \(\{-3, 2\}\). Contrôle : \(|-4| + |-1| = 5\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dans chaque cas, une solution trouvée doit appartenir au cas étudié (si \(x \ge 1\) avait donné \(x = 0\), on l'aurait rejeté).</div>

  <div class="method-box"><strong>Méthode 6 — Raisonner par analyse-synthèse</strong>
    <ol>
      <li><em>Analyse</em> : « Soit \(x\) une solution. » En déduire des conditions nécessaires jusqu'à obtenir une liste de candidats (souvent un seul : unicité).</li>
      <li><em>Synthèse</em> : vérifier que chaque candidat est solution (existence) ; écarter ceux qui ne conviennent pas.</li>
      <li>Conclure par l'ensemble exact des solutions, ou par « il existe un unique … ».</li>
    </ol>
    <p><em>Exemple éclair :</em> résoudre \(\sqrt{2x + 3} = x\). Analyse : \(x \ge 0\) et \(2x + 3 = x^2\), donc \(x = 3\) ou \(x = -1\) ; avec \(x \ge 0\), \(x = 3\). Synthèse : \(\sqrt 9 = 3\). Ensemble des solutions : \(\{3\}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Rédiger une récurrence</strong>
    <ol>
      <li>Énoncer \(\mathcal P(n)\) pour un \(n\) fixé (sans « \(\forall n\) » à l'intérieur) et le rang de départ \(n_0\).</li>
      <li>Choisir le type : simple si \(\mathcal P(n + 1)\) se déduit de \(\mathcal P(n)\) ; double si l'on a besoin des deux rangs précédents (suites \(u_{n+2} = a u_{n+1} + b u_n\)) ; forte si l'on a besoin de tous les rangs précédents.</li>
      <li>Initialisation (un rang, ou deux pour une récurrence double), hérédité (« Soit \(n \ge n_0\) tel que … Montrons … »), conclusion.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_0 = 2\) et \(u_{n+1} = 2u_n - 1\). Les termes \(2, 3, 5, 9, 17\) suggèrent \(u_n = 2^n + 1\). Initialisation : \(2^0 + 1 = 2\). Hérédité : \(u_{n+1} = 2(2^n + 1) - 1 = 2^{n+1} + 1\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : vérifier que l'hérédité vaut pour le <em>premier</em> rang aussi : une hérédité « de \(n\) à \(n + 1\) » qui utilise \(n \ge 3\) ne permet pas de partir de \(n_0 = 1\).</div>

  <div class="method-box"><strong>Méthode 8 — Étudier l'injectivité, la surjectivité, la bijectivité</strong>
    <ol>
      <li>Fixer \(y\) dans l'ensemble d'arrivée et résoudre \(f(x) = y\), d'inconnue \(x\) dans l'ensemble de départ.</li>
      <li>Au plus une solution pour tout \(y\) : injective ; au moins une : surjective ; exactement une : bijective, et l'expression de la solution donne \(f^{-1}(y)\).</li>
      <li>Pour réfuter : deux points distincts de même image (non injective), ou un \(y\) sans antécédent (non surjective). Pour une fonction réelle, une stricte monotonie donne directement l'injectivité.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f : \mathbb R \setminus \{1\} \to \mathbb R \setminus \{2\}\), \(x \mapsto \frac{2x + 1}{x - 1}\). Pour \(y \neq 2\) : \(f(x) = y \iff x = \frac{y + 1}{y - 2}\), qui est différent de 1. Bijective, \(f^{-1}(y) = \frac{y + 1}{y - 2}\). Contrôle : \(f(4) = 3\) et \(f^{-1}(3) = 4\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : pour l'injectivité, partir de \(f(x) = f(x')\) et aboutir à \(x = x'\), pas l'inverse ; et ne pas oublier de vérifier que la solution trouvée est bien dans l'ensemble de départ.</div>

  <div class="method-box"><strong>Méthode 9 — Déterminer une image directe ou une image réciproque</strong>
    <ol>
      <li>Image réciproque \(f^{-1}(B)\) : écrire la condition \(f(x) \in B\) et la résoudre (inéquations, tableau de signes).</li>
      <li>Image directe \(f(A)\) d'un intervalle par une fonction continue : dresser le tableau de variations sur \(A\) et lire les valeurs extrêmes atteintes ; ne pas se contenter des images des bornes.</li>
      <li>Pour un ensemble fini, lister les images (ou les antécédents) élément par élément.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = x^2 - 2x = (x - 1)^2 - 1\). Sur \([0, 3]\), \(f\) descend à \(f(1) = -1\) puis remonte à \(f(3) = 3\) : \(f([0, 3]) = [-1, 3]\). Et \(f^{-1}([0, 3]) = \{x \mid 0 \le x^2 - 2x \le 3\} = [-1, 0] \cup [2, 3]\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Calculer avec des indicatrices</strong>
    <ol>
      <li>Traduire chaque opération : \(\mathbf 1_{A \cap B} = \mathbf 1_A \mathbf 1_B\), \(\mathbf 1_{\overline A} = 1 - \mathbf 1_A\), \(\mathbf 1_{A \setminus B} = \mathbf 1_A (1 - \mathbf 1_B)\).</li>
      <li>Calculer comme sur des nombres, en utilisant \(\mathbf 1_A^2 = \mathbf 1_A\) (les valeurs sont 0 ou 1).</li>
      <li>Conclure par « deux parties sont égales si et seulement si leurs indicatrices le sont », ou sommer sur \(E\) fini pour obtenir des cardinaux.</li>
    </ol>
    <p><em>Exemple éclair :</em> $$\mathbf 1_{A \setminus (B \cup C)} = \mathbf 1_A(1 - \mathbf 1_B)(1 - \mathbf 1_C) = \mathbf 1_A(1 - \mathbf 1_B) \times \mathbf 1_A(1 - \mathbf 1_C),$$ puisque \(\mathbf 1_A^2 = \mathbf 1_A\) : c'est l'indicatrice de \((A \setminus B) \cap (A \setminus C)\). Les deux parties sont égales.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\mathbf 1_{A \cup B} = \mathbf 1_A + \mathbf 1_B\) n'est vrai que si \(A\) et \(B\) sont disjointes ; sinon, la somme vaut 2 sur \(A \cap B\).</div>
</div>
</template>
