<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Monte-charge à roue et vis sans fin : sens de transfert</h3>
  <div class="statement">Un monte-charge lève une charge \(m = 150\ \text{kg}\) à \(v = 0{,}3\ \text{m/s}\) grâce à un tambour de rayon \(r = 0{,}10\ \text{m}\), entraîné par un moteur à travers un réducteur à roue et vis sans fin de rapport \(k = 1/40\) et de rendement direct \(\eta = 0{,}62\). On étudie le régime permanent (inerties sans effet).</div>
  <div class="q"><strong>Q1.</strong> Vitesse de rotation du moteur ; couple résistant équivalent \(C_{r,eq}\) pour une transmission parfaite.</div>
  <div class="q"><strong>Q2.</strong> Couple et puissance du moteur à la montée ; puissance perdue dans le réducteur.</div>
  <div class="q"><strong>Q3.</strong> Descente à la même vitesse avec un réducteur de rendement inverse \(\eta' = 0{,}15\) : couple et puissance du moteur. Interpréter.</div>
  <div class="q"><strong>Q4.</strong> Même question avec un réducteur à plus petit angle d'hélice, de rendement inverse \(\eta' = -0{,}2\). Lequel des deux réducteurs choisir pour la sécurité, et à quel prix ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_t = v/r = 3\ \text{rad/s}\), \(\omega_m = \omega_t/k = 120\ \text{rad/s}\). La puissance du poids vaut \(-mgv = -mg\,rk\,\omega_m\), d'où</p>
    <div class="formula">$$C_{r,eq} = mg\,rk = \frac{150\times9{,}81\times0{,}10}{40} \approx 3{,}68\ \text{N·m}$$</div>
    <p><strong>Q2.</strong> Charge résistante : \(C_m = C_{r,eq}/\eta \approx 5{,}93\ \text{N·m}\) ; \(\mathcal P_m \approx 712\ \text{W}\) pour \(mgv \approx 441\ \text{W}\) utiles ; le réducteur dissipe 271 W.</p>
    <p><strong>Q3.</strong> À la descente, \(\omega_m = -120\ \text{rad/s}\) et \(\mathcal P_{ch} = -C_{r,eq}\,\omega_m \approx +441\ \text{W}\) : la charge entraîne. \(C_m = \eta'\,C_{r,eq} \approx 0{,}55\ \text{N·m}\), \(\mathcal P_m = C_m\,\omega_m \approx -66\ \text{W}\) : le moteur retient la charge (il freine) et ne reçoit que 15 % de la puissance cédée ; le réducteur dissipe le reste (375 W).</p>
    <p><strong>Q4.</strong> \(C_m = -0{,}2\times3{,}68 \approx -0{,}74\ \text{N·m}\) et \(\mathcal P_m \approx +88\ \text{W}\) : le moteur doit <strong>entraîner</strong> la descente. Le réducteur est irréversible : moteur coupé, la charge reste suspendue sans frein, ce qui est plus sûr. Le prix : un rendement direct plus faible encore en montée (un réducteur irréversible a en général un rendement direct inférieur à 50 %), donc un moteur plus puissant et de l'énergie perdue à chaque cycle, montée et descente comprises.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Pompe doseuse à coulisse : inertie variable et volant</h3>
  <div class="statement">Le piston d'une pompe doseuse est entraîné par un mécanisme à coulisse. Une manivelle 1 (arbre et maneton) tourne autour de l'axe \((O,\vec z_0)\) du bâti 0 : \(\theta = (\vec x_0,\vec x_1)\), moment d'inertie \(J_1\) autour de l'axe. Le maneton, de centre \(A\) avec \(\overrightarrow{OA} = R\,\vec x_1\), est engagé dans une rainure rectiligne de direction \(\vec y_0\) taillée dans le coulisseau-piston 2, de masse \(m_2\), guidé en translation selon \(\vec x_0\) par rapport au bâti. Un moteur exerce sur 1 le couple \(C_m\,\vec z_0\). Liaisons parfaites, axe du piston horizontal ; on étudie la marche à vide (aucune action du fluide).<br>Données : \(R = 25\ \text{mm}\), \(m_2 = 3{,}0\ \text{kg}\), \(J_1 = 0{,}020\ \text{kg·m}^2\), \(N = 600\ \text{tr/min}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer la position \(x\) du coulisseau (abscisse de son axe de rainure) et sa vitesse en fonction de \(\theta\) et \(\dot\theta\).</div>
  <div class="q"><strong>Q2.</strong> Calculer l'énergie cinétique de \(\{1, 2\}\) et en déduire l'inertie équivalente \(J_{eq}(\theta)\) ramenée sur l'arbre. Valeurs extrêmes ?</div>
  <div class="q"><strong>Q3.</strong> Établir l'équation de mouvement par le théorème de l'énergie cinétique.</div>
  <div class="q"><strong>Q4.</strong> La vitesse de rotation est maintenue constante à 600 tr/min. Calculer le couple moteur \(C_m(\theta)\), son amplitude et sa valeur moyenne sur un tour. Retrouver \(C_m\) par un bilan de puissance sur le coulisseau seul, et interpréter.</div>
  <div class="q"><strong>Q5.</strong> Le moteur fournit maintenant un couple constant, égal à la valeur moyenne trouvée en Q4. L'arbre tourne à 600 tr/min quand \(\theta = 0\). Quelle est sa vitesse en \(\theta = 90°\) ? Quelle est la fluctuation relative de vitesse \((\omega_{max} - \omega_{min})/\omega_{max}\) ?</div>
  <div class="q"><strong>Q6.</strong> Quelle inertie \(J_1\) faut-il donner à la manivelle, en lui ajoutant un volant, pour limiter cette fluctuation à 1 % ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La rainure, de direction \(\vec y_0\), passe toujours par \(A\) : l'abscisse du coulisseau est celle de \(A\), \(x = R\cos\theta\), et \(\dot x = -R\,\dot\theta\sin\theta\). Le mécanisme n'a qu'un paramètre \(\theta\) et la loi entrée-sortie est exactement sinusoïdale.</p>
    <p><strong>Q2.</strong> Manivelle en rotation autour d'un axe fixe : \(\frac12 J_1\dot\theta^2\) ; coulisseau en translation : \(\frac12 m_2\dot x^2\). D'où</p>
    <div class="formula">$$E_c = \frac12\left(J_1 + m_2R^2\sin^2\theta\right)\dot\theta^2 \qquad J_{eq}(\theta) = J_1 + m_2R^2\sin^2\theta$$</div>
    <p>Avec \(m_2R^2 = 1{,}875\cdot10^{-3}\ \text{kg·m}^2\) : \(J_{eq}\) varie de \(J_1 = 0{,}0200\ \text{kg·m}^2\) (\(\theta = 0\) ou \(\pi\), piston à l'arrêt en fin de course) à \(0{,}0219\ \text{kg·m}^2\) (\(\theta = \pm 90°\), piston à sa vitesse maximale), deux fois par tour.</p>
    <p><strong>Q3.</strong> On isole \(\{1, 2\}\). Puissances : couple moteur \(C_m\dot\theta\) (stator fixé au bâti) ; liaisons parfaites : 0 ; poids : sans travail (manivelle tournant autour de son axe, piston horizontal). Le TEC, \(\frac{d}{dt}\left(\frac12 J_{eq}\dot\theta^2\right) = C_m\dot\theta\), divisé par \(\dot\theta\), donne \(J_{eq}\ddot\theta + \frac12 J_{eq}'\dot\theta^2 = C_m\) avec \(J_{eq}' = 2m_2R^2\sin\theta\cos\theta\) :</p>
    <div class="formula">$$\left(J_1 + m_2R^2\sin^2\theta\right)\ddot\theta + m_2R^2\sin\theta\cos\theta\;\dot\theta^2 = C_m$$</div>
    <p><strong>Q4.</strong> \(\omega = 600\times\pi/30 \approx 62{,}8\ \text{rad/s}\) et \(\ddot\theta = 0\) :</p>
    <div class="formula">$$C_m(\theta) = \frac12\,m_2R^2\omega^2\sin2\theta \qquad \frac12\,m_2R^2\omega^2 = \frac12\times1{,}875\cdot10^{-3}\times62{,}8^2 \approx 3{,}70\ \text{N·m}$$</div>
    <p>Le couple oscille entre \(-3{,}70\) et \(+3{,}70\ \text{N·m}\), deux fois par tour, et sa moyenne est nulle. Bilan de puissance sur le coulisseau : l'action du maneton est la seule qui travaille, et sa puissance est \(\frac{d}{dt}\left(\frac12 m_2\dot x^2\right) = m_2\dot x\ddot x\) ; avec \(\ddot x = -R\omega^2\cos\theta\), elle vaut \(m_2R^2\omega^3\sin\theta\cos\theta\). Liaisons parfaites et \(J_1\) à vitesse constante : c'est exactement la puissance \(C_m\omega\) du moteur, d'où le même \(C_m\). Interprétation : de \(\theta = 0\) à \(90°\), le piston passe de l'arrêt à sa vitesse maximale \(R\omega\) et le moteur lui fournit de l'énergie cinétique (au plus \(\frac12 m_2R^2\omega^2 \approx 3{,}7\ \text{J}\)) ; de \(90°\) à \(180°\), le piston la lui rend. Sur un tour, aucune énergie n'est consommée à vide.</p>
    <p><strong>Q5.</strong> Le couple moyen étant nul, le moteur ne fournit plus rien : \(E_c = \frac12 J_{eq}(\theta)\,\dot\theta^2\) se conserve. \(\dot\theta\) est maximal là où \(J_{eq}\) est minimal (\(\theta = 0\)) et minimal en \(\theta = 90°\) :</p>
    <div class="formula">$$\omega(90°) = \omega(0)\sqrt{\frac{J_1}{J_1 + m_2R^2}} = 62{,}8\times\sqrt{\frac{0{,}0200}{0{,}021875}} \approx 60{,}1\ \text{rad/s}$$</div>
    <p>soit 574 tr/min : fluctuation relative \(1 - 0{,}956 \approx 4{,}4\ \%\).</p>
    <p><strong>Q6.</strong> Il faut \(\sqrt{J_1/(J_1 + m_2R^2)} \geq 0{,}99\), soit</p>
    <div class="formula">$$J_1 \geq \frac{0{,}99^2}{1 - 0{,}99^2}\,m_2R^2 \approx 49{,}3\,m_2R^2 \approx 0{,}092\ \text{kg·m}^2$$</div>
    <p>Il faut donc un volant d'environ \(0{,}072\ \text{kg·m}^2\) à ajouter, par exemple un disque d'acier de 10 kg et de rayon 0,12 m (\(mR^2/2 = 0{,}072\ \text{kg·m}^2\)). Le volant ne change ni le couple moyen ni l'énergie échangée avec le piston : il stocke cette énergie en ralentissant à peine. C'est le rôle des volants d'inertie de tous les mécanismes à inertie variable (compresseurs, presses, moteurs à pistons).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Barrière levante compensée par un ressort</h3>
  <div class="statement">La lisse d'une barrière de parking est une barre homogène de masse \(m = 6\ \text{kg}\) et de longueur \(L = 4\ \text{m}\), en pivot d'axe horizontal \((O,\vec z)\) à une extrémité. Son angle \(\theta\) par rapport à l'horizontale va de 0 (fermée) à \(\pi/2\) (ouverte). Un ressort de torsion de raideur \(k_t\), d'angle libre \(\theta_0\), exerce sur la lisse le couple \(-k_t(\theta - \theta_0)\,\vec z\). Le motoréducteur exerce sur la lisse un couple \(C\,\vec z\). Liaisons parfaites.</div>
  <div class="q"><strong>Q1.</strong> Écrire l'énergie potentielle totale \(E_p(\theta)\) (pesanteur et ressort).</div>
  <div class="q"><strong>Q2.</strong> On impose que le couple \(C\) nécessaire en mouvement très lent (quasi statique) soit nul dans les deux positions extrêmes. Déterminer \(\theta_0\) et \(k_t\).</div>
  <div class="q"><strong>Q3.</strong> Exprimer ce couple quasi statique \(C(\theta)\) ; trouver sa valeur maximale et la comparer au cas sans ressort.</div>
  <div class="q"><strong>Q4.</strong> Établir l'équation de mouvement de la lisse par le TEC.</div>
  <div class="q"><strong>Q5.</strong> Travail fourni par le moteur pour une ouverture lente, avec et sans ressort.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le centre d'inertie est à l'altitude \(\frac L2\sin\theta\) au-dessus de \(O\) : \(E_p(\theta) = mg\frac L2\sin\theta + \frac12 k_t(\theta - \theta_0)^2\) (à une constante près).</p>
    <p><strong>Q2.</strong> En quasi statique, \(E_c\) reste négligeable et le TEC donne \(C\dot\theta = \dfrac{dE_p}{dt}\), soit \(C(\theta) = \dfrac{dE_p}{d\theta} = mg\frac L2\cos\theta + k_t(\theta - \theta_0)\). En \(\theta = \pi/2\) : \(k_t(\pi/2 - \theta_0) = 0\), donc \(\theta_0 = \pi/2\). En \(\theta = 0\) : \(mg\frac L2 - k_t\frac\pi2 = 0\), donc \(k_t = \dfrac{mgL}{\pi} \approx 74{,}9\ \text{N·m/rad}\).</p>
    <p><strong>Q3.</strong> Avec \(C_0 = mg\frac L2 \approx 117{,}7\ \text{N·m}\) :</p>
    <div class="formula">$$C(\theta) = C_0\left(\cos\theta - 1 + \frac{2\theta}{\pi}\right)$$</div>
    <p>\(C'(\theta) = 0\) pour \(\sin\theta = 2/\pi\), soit \(\theta \approx 39{,}5°\) : \(C_{max} \approx 0{,}21\,C_0 \approx 24{,}8\ \text{N·m}\), contre 117,7 N·m sans ressort (en position fermée). \(C\) reste positif sur tout l'intervalle (la courbe de \(\cos\theta\) est au-dessus de sa corde) : à l'ouverture le moteur entraîne, à la fermeture il retient.</p>
    <p><strong>Q4.</strong> \(E_c = \frac12 J_O\dot\theta^2\) avec \(J_O = \dfrac{mL^2}{3} = 32\ \text{kg·m}^2\). Puissances : \(C\dot\theta\) (moteur) et \(-\dfrac{dE_p}{dt}\) (poids et ressort). Après division par \(\dot\theta\) :</p>
    <div class="formula">$$J_O\,\ddot\theta = C - C_0\left(\cos\theta - 1 + \frac{2\theta}{\pi}\right)$$</div>
    <p><strong>Q5.</strong> En quasi statique, \(W_m = E_p(\pi/2) - E_p(0)\). Sans ressort : \(C_0 \approx 117{,}7\ \text{J}\). Avec ressort : \(C_0 - \frac12 k_t\frac{\pi^2}{4} = C_0\left(1 - \frac\pi4\right) \approx 25{,}3\ \text{J}\). Le ressort, armé à la fermeture, restitue son énergie à l'ouverture : le motoréducteur peut être beaucoup plus petit.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Axe vertical d'un robot de manutention</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>énergétique, modèle équivalent et choix d'une motorisation</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">L'axe vertical d'un robot cartésien porte une pince : chariot et pièce ont une masse totale \(m = 25\ \text{kg}\). Le chariot est guidé par des patins à billes (frottement modélisé par un effort constant \(F_f = 30\ \text{N}\) opposé au mouvement) et entraîné par une vis à billes verticale de pas \(p = 20\ \text{mm}\) (inertie \(J_v = 2\times10^{-4}\ \text{kg·m}^2\), rendements direct et inverse \(\eta = \eta' = 0{,}9\)), accouplée directement à un servomoteur (rotor \(J_m = 1{,}2\times10^{-4}\ \text{kg·m}^2\)). Cycle (\(T = 2\ \text{s}\)) : montée de 0,40 m (accélération de 4 m/s² pendant 0,2 s, palier à 0,8 m/s pendant 0,3 s, freinage symétrique de 0,2 s), pause de 0,3 s, descente selon le même profil, pause de 0,3 s. Pendant les pauses, un frein maintient l'axe et le moteur ne fournit aucun couple. \(g = 9{,}81\ \text{m/s}^2\).</div>
  <p class="exo-part">Partie A — Modèle équivalent</p>
  <div class="q"><strong>Q1.</strong> Relation entre la vitesse \(v\) du chariot et la vitesse \(\omega_m\) du moteur ; vitesse maximale du moteur en tr/min.</div>
  <div class="q"><strong>Q2.</strong> Inertie équivalente ramenée sur l'arbre moteur, puis masse équivalente ramenée sur le chariot. Commenter.</div>
  <div class="q"><strong>Q3.</strong> Transmission supposée parfaite : établir par le TEC l'équation \(J_{eq}\dot\omega_m = C_m - C_{r,eq}\), en donnant \(C_{r,eq}\) à la montée et à la descente.</div>
  <p class="exo-part">Partie B — Rendements et sens de transfert</p>
  <div class="q"><strong>Q4.</strong> On tient compte des rendements. On note \(F\) l'effort de l'écrou sur le chariot (positif vers le haut) et \(\lambda = p/(2\pi)\). Justifier que le couple moteur s'écrit \(C_m = (J_m + J_v)\,\dot\omega_m + C_v\), avec \(C_v = F\lambda/\eta\) si \(Fv \gt 0\) et \(C_v = \eta' F\lambda\) si \(Fv \lt 0\). Calculer \(C_m\) dans les six phases de mouvement.</div>
  <p class="exo-part">Partie C — Choix du moteur et sécurité</p>
  <div class="q"><strong>Q5.</strong> Calculer le couple thermique équivalent et choisir le moteur parmi : A (\(C_n = 0{,}64\ \text{N·m}\), crête 1,9 N·m, 6 000 tr/min, \(J = 0{,}6\times10^{-4}\ \text{kg·m}^2\)) ; B (1,27 N·m, 4,0 N·m, 4 500 tr/min, \(1{,}2\times10^{-4}\)) ; C (2,4 N·m, 7,2 N·m, 3 000 tr/min, \(3{,}3\times10^{-4}\)).</div>
  <div class="q"><strong>Q6.</strong> Pourquoi le frein est-il indispensable ? Un concepteur propose une vis trapézoïdale irréversible (\(\eta = 0{,}35\)) pour s'en passer : discuter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Un tour de vis fait avancer l'écrou d'un pas : \(v = \lambda\,\omega_m\) avec \(\lambda = p/(2\pi) \approx 3{,}18\times10^{-3}\ \text{m/rad}\). À 0,8 m/s : \(\omega_m \approx 251\ \text{rad/s}\), soit 2 400 tr/min. Accélération angulaire : \(\dot\omega_m = 4/\lambda \approx 1\,257\ \text{rad/s}^2\).</p>
    <p><strong>Q2.</strong> \(E_c = \frac12(J_m + J_v)\,\omega_m^2 + \frac12 m v^2\) :</p>
    <div class="formula">$$J_{eq} = J_m + J_v + m\lambda^2 = 3{,}2\times10^{-4} + 2{,}53\times10^{-4} \approx 5{,}73\times10^{-4}\ \text{kg·m}^2$$</div>
    <p>Ramenée sur le chariot, \(M_{eq} = J_{eq}/\lambda^2 \approx 56{,}6\ \text{kg}\) : le rotor et la vis « pèsent » 31,6 kg, plus que la charge elle-même. Sur un axe rapide à vis, les inerties tournantes ne sont pas négligeables.</p>
    <p><strong>Q3.</strong> On isole {rotor + vis, chariot} ; liaisons parfaites, puissance intérieure nulle (accouplement et vis-écrou parfaits). Puissances extérieures : \(C_m\omega_m\) (stator fixé au bâti) ; poids \(-mgv\) ; frottement \(-F_f|v|\). Avec \(v = \lambda\omega_m\), le TEC divisé par \(\omega_m\) donne le modèle, avec \(C_{r,eq} = (mg + F_f)\,\lambda \approx 0{,}876\ \text{N·m}\) à la montée et \((mg - F_f)\,\lambda \approx 0{,}685\ \text{N·m}\) à la descente.</p>
    <p><strong>Q4.</strong> La vis transmet la puissance entre l'arbre (rotor + vis, en amont) et le chariot (en aval). Si \(Fv \gt 0\), la puissance va de la vis vers le chariot : l'arbre fournit \(Fv/\eta\), d'où \(C_v\omega_m = Fv/\eta\) et \(C_v = F\lambda/\eta\). Si \(Fv \lt 0\), le chariot cède \(|Fv|\) et l'arbre n'en reçoit que \(\eta'|Fv|\), d'où \(C_v = \eta'F\lambda\). L'effort \(F\) découle du TRD vertical sur le chariot : \(m\ddot x = F - mg - F_f\,\text{signe}(v)\).</p>
    <div style="overflow-x:auto"><table>
      <tr><th>Phase</th><th>\(F\) (N)</th><th>Sens du flux</th><th>\(C_m\) (N·m)</th></tr>
      <tr><td>Montée, accélération</td><td>375</td><td>vers le chariot</td><td>\(0{,}402 + 1{,}327 \approx 1{,}73\)</td></tr>
      <tr><td>Montée, palier</td><td>275</td><td>vers le chariot</td><td>\(0{,}97\)</td></tr>
      <tr><td>Montée, freinage</td><td>175</td><td>vers le chariot</td><td>\(-0{,}402 + 0{,}620 \approx 0{,}22\)</td></tr>
      <tr><td>Descente, accélération</td><td>115</td><td>vers l'arbre</td><td>\(-0{,}402 + 0{,}330 \approx -0{,}07\)</td></tr>
      <tr><td>Descente, palier</td><td>215</td><td>vers l'arbre</td><td>\(0{,}62\)</td></tr>
      <tr><td>Descente, freinage</td><td>315</td><td>vers l'arbre</td><td>\(0{,}402 + 0{,}903 \approx 1{,}31\)</td></tr>
    </table></div>
    <p>En descente, \(\omega_m \lt 0\) : un couple positif signifie que le moteur freine (palier : \(\mathcal P_m \approx -155\ \text{W}\)). En montée, au palier, il fournit 245 W pour 220 W reçus par le chariot.</p>
    <p><strong>Q5.</strong> Avec les pauses à couple nul :</p>
    <div class="formula">$$C_{th} = \sqrt{\frac{(1{,}73^2 + 0{,}22^2 + 0{,}07^2 + 1{,}31^2)\times0{,}2 + (0{,}97^2 + 0{,}62^2)\times0{,}3}{2}} \approx 0{,}82\ \text{N·m}$$</div>
    <p>Couple crête 1,73 N·m ; vitesse 2 400 tr/min. Le moteur B convient (0,82 &lt; 1,27 ; 1,73 &lt; 4,0 ; 2 400 &lt; 4 500) et c'est celui de l'énoncé. Le moteur A, plus léger (\(J\) plus faible), donne \(C_{th} \approx 0{,}80\ \text{N·m}\) et \(C_{max} \approx 1{,}65\ \text{N·m}\) : couple crête juste admissible, mais couple thermique supérieur à son couple nominal (0,64 N·m), il chaufferait. Le moteur C convient aussi, mais il est surdimensionné et son gros rotor alourdit les accélérations (\(C_{th} \approx 0{,}92\ \text{N·m}\)). On retient B.</p>
    <p><strong>Q6.</strong> La vis à billes est réversible (\(\eta' = 0{,}9 \gt 0\)) : moteur coupé (pause, arrêt d'urgence, coupure de courant), le poids ferait descendre le chariot en entraînant le moteur. Un frein à manque de courant est donc obligatoire pour la sécurité. La vis trapézoïdale irréversible tiendrait la charge seule, mais en montée au palier il faudrait \(F\lambda/0{,}35 \approx 2{,}5\ \text{N·m}\) au lieu de 0,97 N·m : couple thermique multiplié par plus de deux, moteur plus gros, pertes et échauffement de la vis importants en service intensif. Pour un axe rapide et cadencé, on garde la vis à billes et le frein.</p>
  </div>
</div>
