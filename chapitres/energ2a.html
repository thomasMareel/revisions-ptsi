  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite le volet énergétique de la compétence C2 (S3) : puissance des actions mécaniques extérieures et intérieures, théorème de l'énergie cinétique, inertie et masse équivalentes, rendement en régime permanent. Il sert la compétence C1 (S3), qui demande de choisir entre ce théorème et le principe fondamental de la dynamique, et prépare la compétence F3 (S4) : dimensionner une motorisation à partir d'une documentation. Il prolonge « Énergétique des systèmes » (1ʳᵉ année) et s'appuie sur « Cinétique et dynamique du solide (3D) » (torseurs, énergie cinétique, PFD) et sur « Chaînes de solides » (graphe, liaisons parfaites).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

      <ul>
        <li><strong>Puissance d'une action mécanique extérieure</strong> à un solide ou à un ensemble de solides, dans son mouvement par rapport au repère galiléen : comoment, actionneurs, travail (C2, S3 ; §1).</li>
        <li><strong>Puissance intérieure</strong> à un ensemble de solides : liaisons parfaites, frottements, résistance au roulement (C2, S3 ; §2).</li>
        <li><strong>Énergie potentielle</strong> de pesanteur et des ressorts, énergie mécanique (§3).</li>
        <li><strong>Énergie cinétique</strong> d'un solide et d'un ensemble de solides (C2, S3 ; rappel, §4).</li>
        <li><strong>Théorème de l'énergie cinétique</strong> pour un solide et pour un ensemble de solides, forme intégrée (C2, S3 ; §5) ; <strong>choix des équations</strong> : théorème de l'énergie cinétique ou principe fondamental (C1, S3 ; §6).</li>

<div class="course-section">
  <div class="sec-num">§1 · PUISSANCE D'UNE ACTION MÉCANIQUE EXTÉRIEURE</div>
  <h2>La puissance, comoment de deux torseurs</h2>
  <div class="intro">La puissance mesure le débit d'énergie qu'une action mécanique apporte à un système en mouvement. En 1ʳᵉ année, on l'a calculée pour une force (\(P = \vec F\cdot\vec v\)) et pour un couple (\(P = C\omega\)). En 3D, les deux cas se réunissent en une seule opération : le comoment du torseur des actions et du torseur cinématique.</div>
  <div class="def-box">
    <strong>Puissance d'une action extérieure.</strong> Un solide \(S\) est en mouvement par rapport à un repère galiléen \(\mathcal R_g\) et subit une action du milieu extérieur \(\bar S\). On écrit les deux torseurs au même point \(A\) :
    <div class="formula">$$\{\mathcal T(\bar S\to S)\} = \begin{Bmatrix} \vec R(\bar S\to S) \\ \vec M(A,\bar S\to S) \end{Bmatrix}_A$$ $$\{\mathcal V(S/\mathcal R_g)\} = \begin{Bmatrix} \vec\Omega(S/\mathcal R_g) \\ \vec V(A,S/\mathcal R_g) \end{Bmatrix}_A$$</div>
    La puissance de cette action dans le mouvement de \(S\) par rapport à \(\mathcal R_g\) est leur comoment :
    <div class="formula" data-nom="Puissance d'une action extérieure">$$\mathcal P(\bar S\to S/\mathcal R_g) = \{\mathcal T(\bar S\to S)\}\otimes\{\mathcal V(S/\mathcal R_g)\}$$ $$\mathcal P(\bar S\to S/\mathcal R_g) = \vec R(\bar S\to S)\cdot\vec V(A,S/\mathcal R_g) + \vec M(A,\bar S\to S)\cdot\vec\Omega(S/\mathcal R_g)$$</div>
    Unité : le watt (W). Une action est <strong>motrice</strong> si \(\mathcal P \gt 0\), <strong>résistante</strong> si \(\mathcal P \lt 0\). Pour un ensemble de solides \(\Sigma\), on additionne les puissances reçues par chacun de ses solides.
  </div>
  <div class="prop-box">
    <strong>Le point de calcul est libre.</strong> Le comoment ne dépend pas du point \(A\), pourvu que les deux torseurs y soient écrits. On choisit le point qui simplifie : le point d'application d'une force (moment nul), ou un point d'un axe fixe (vitesse nulle).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">D'où vient le comoment, et pourquoi le point est-il indifférent ?</span>
    <div class="content">
      <p>Une action répartie exerce sur chaque élément de \(S\) une force élémentaire \(d\vec F(M)\) ; sa puissance est \(\int d\vec F(M)\cdot\vec V(M)\). Avec le champ des vitesses du solide, \(\vec V(M) = \vec V(A) + \vec\Omega\wedge\overrightarrow{AM}\) :</p>
      <div class="formula">$$\mathcal P = \left(\int d\vec F(M)\right)\cdot\vec V(A) + \int d\vec F(M)\cdot\left(\vec\Omega\wedge\overrightarrow{AM}\right)$$</div>
      <p>La première intégrale est la résultante \(\vec R\). Dans la seconde, la permutation circulaire du produit mixte donne \(\vec\Omega\cdot(\overrightarrow{AM}\wedge d\vec F)\), dont l'intégrale vaut \(\vec\Omega\cdot\vec M(A)\).</p>
      <p>Changement de point : \(\vec V(B) = \vec V(A) + \overrightarrow{BA}\wedge\vec\Omega\) et \(\vec M(B) = \vec M(A) + \overrightarrow{BA}\wedge\vec R\). Les deux termes ajoutés, \(\vec R\cdot(\overrightarrow{BA}\wedge\vec\Omega)\) et \(\vec\Omega\cdot(\overrightarrow{BA}\wedge\vec R)\), sont deux produits mixtes opposés : leur somme est nulle.</p>
    </div>
  </div>

  <h3>Cas usuels</h3>
  <div style="overflow-x:auto"><table>
    <tr><th>Action</th><th>Point commode</th><th>Puissance</th></tr>
    <tr><td>Force \(\vec F\) appliquée en \(P\)</td><td>\(P\) (moment nul)</td><td>\(\vec F\cdot\vec V(P,S/\mathcal R_g)\)</td></tr>
    <tr><td>Couple pur \(\vec C\)</td><td>quelconque</td><td>\(\vec C\cdot\vec\Omega(S/\mathcal R_g)\)</td></tr>
    <tr><td>Pesanteur (\(\vec z\) vertical ascendant)</td><td>\(G\)</td><td>\(-mg\,\vec z\cdot\vec V(G,S/\mathcal R_g) = -mg\,\dot z_G\)</td></tr>
    <tr><td>Solide en rotation autour d'un axe fixe \((O,\vec z)\)</td><td>\(O\), vitesse nulle</td><td>\(\vec M(O)\cdot\vec z\,\omega\) : seul le moment sur l'axe travaille</td></tr>
    <tr><td>Actionneur linéaire (vérin, corps fixe)</td><td>sur la tige</td><td>\(F\,v\) ; vérin hydraulique : \(p\,Q_v\)</td></tr>
    <tr><td>Actionneur rotatif (stator fixe)</td><td>sur l'axe</td><td>\(C_m\,\omega_m\)</td></tr>
  </table></div>

  <div class="method-box">
    <strong>Exemple — puissance du poids d'un bras de robot, calculée en deux points</strong>
    <ol>
      <li>Bras \(1\) en pivot d'axe horizontal \((O,\vec z_0)\) avec le bâti \(0\) ; \(\theta = (\vec x_0,\vec x_1)\) mesuré depuis l'horizontale, \(\vec y_0\) vertical ascendant, \(\overrightarrow{OG} = a\,\vec x_1\). Données : \(m = 12\ \text{kg}\), \(a = 0{,}40\ \text{m}\), \(\theta = 30°\), \(\dot\theta = 1{,}5\ \text{rad/s}\).</li>
      <li>En \(G\) : \(\vec V(G,1/0) = a\dot\theta\,\vec y_1\), d'où \(\mathcal P = -mg\,\vec y_0\cdot a\dot\theta\,\vec y_1 = -mga\dot\theta\cos\theta\).</li>
      <li>En \(O\) (vitesse nulle) : \(\vec M(O) = a\,\vec x_1\wedge(-mg\,\vec y_0) = -mga\cos\theta\,\vec z_0\), et \(\vec\Omega = \dot\theta\,\vec z_0\) : même résultat.</li>
      <li>\(\mathcal P = -12\times9{,}81\times0{,}40\times1{,}5\times\cos30° \approx -61\ \text{W}\). Pour lever le bras à cette vitesse, le moteur de l'axe doit fournir au moins 61 W, plus l'éventuelle variation d'énergie cinétique.</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Ordre de grandeur</span>
    <span class="prompt">Un vérin hydraulique de section \(50\ \text{cm}^2\), alimenté sous 120 bar, sort à 5 cm/s. Effort, puissance, débit ?</span>
    <div class="content">
      <p>\(F = pS = 120\times10^{5}\times50\times10^{-4} = 60\ \text{kN}\) ; \(\mathcal P = Fv = 60\,000\times0{,}05 = 3\ \text{kW}\). Débit : \(Q_v = Sv = 2{,}5\times10^{-4}\ \text{m}^3/\text{s}\), soit 15 L/min, et l'on retrouve bien \(pQ_v = 3\ \text{kW}\) : la puissance hydraulique « effort × flux » se convertit en puissance mécanique.</p>
    </div>
  </div>

  <h3>Travail</h3>
  <div class="def-box">
    <strong>Travail entre deux instants</strong>, en joules :
    <div class="formula" data-nom="Travail d'une action">$$W_{t_1\to t_2}(\bar S\to S/\mathcal R_g) = \int_{t_1}^{t_2}\mathcal P(\bar S\to S/\mathcal R_g)\,dt$$</div> Pour un effort constant le long d'une translation rectiligne, \(W = \vec F\cdot\overrightarrow{\Delta x}\) ; pour un couple constant autour d'un axe fixe, \(W = C\,\Delta\theta\). Le travail du poids ne dépend que des altitudes de départ et d'arrivée : \(W = -mg\,(z_{G2} - z_{G1})\).
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\vec R\cdot\vec V(B) + \vec M(A)\cdot\vec\Omega\) avec \(A \neq B\). Les deux torseurs doivent être réduits au même point. Autre piège : les vitesses de rotation se mettent en rad/s (\(N\) en tr/min donne \(\omega = \pi N/30\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · PUISSANCE DES INTER-EFFORTS</div>
  <h2>Puissance intérieure à un ensemble de solides</h2>
  <div class="intro">Dans un ensemble de solides, chaque liaison transmet des actions mutuelles. Elles disparaissent du principe fondamental appliqué à l'ensemble (actions réciproques), mais pas forcément du bilan d'énergie : un frottement, un ressort, un moteur placé entre deux pièces mobiles consomment ou fournissent de la puissance.</div>
  <div class="def-box">
    <strong>Puissance des actions mutuelles.</strong> Pour deux solides \(S_i\) et \(S_j\) en liaison :
    <div class="formula" data-nom="Puissance des inter-efforts">$$\mathcal P(S_i\leftrightarrow S_j) = \mathcal P(S_i\to S_j/\mathcal R_g) + \mathcal P(S_j\to S_i/\mathcal R_g)$$ $$\mathcal P(S_i\leftrightarrow S_j) = \{\mathcal T(S_i\to S_j)\}\otimes\{\mathcal V(S_j/S_i)\}$$</div>
    La <strong>puissance intérieure</strong> d'un ensemble \(\Sigma = \{S_1,\dots,S_n\}\) est la somme sur toutes les paires : \(\mathcal P_{int}(\Sigma) = \sum_{i\lt j}\mathcal P(S_i\leftrightarrow S_j)\). Elle est nulle pour un solide seul, puisqu'il est indéformable.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi seul le mouvement relatif compte-t-il ?</span>
    <div class="content">
      <p>Actions réciproques : \(\{\mathcal T(S_j\to S_i)\} = -\{\mathcal T(S_i\to S_j)\}\). Par bilinéarité du comoment :</p>
      <div class="formula">$$\mathcal P(S_i\leftrightarrow S_j) = \{\mathcal T(S_i\to S_j)\}\otimes\left(\{\mathcal V(S_j/\mathcal R_g)\} - \{\mathcal V(S_i/\mathcal R_g)\}\right)$$</div>
      <p>et la composition des mouvements donne</p>
      <div class="formula">$$\{\mathcal V(S_j/\mathcal R_g)\} - \{\mathcal V(S_i/\mathcal R_g)\} = \{\mathcal V(S_j/S_i)\}$$</div>
      <p>Conséquence : cette puissance est <strong>la même dans tous les repères</strong>, galiléens ou non.</p>
    </div>
  </div>

  <h3>Liaison parfaite</h3>
  <div class="prop-box">
    <strong>Définition et conséquence.</strong> Une liaison est <strong>parfaite</strong> si la puissance de ses actions mutuelles est nulle pour tout mouvement qu'elle permet. Pour une pivot d'axe \((A,\vec z)\), \(\{\mathcal V(j/i)\} = \{\omega\,\vec z\ ;\ \vec 0\}_A\) et \(\mathcal P = N_{ij}\,\omega\) : elle est nulle quel que soit \(\omega\) si et seulement si le moment sur l'axe \(N_{ij}\) est nul. C'est la règle de « Chaînes de solides » : une liaison parfaite à \(n_c\) mobilités transmet \(6 - n_c\) composantes, chacune « duale » d'un mouvement interdit.
  </div>
  <p>En revanche, un <strong>actionneur</strong> monté entre deux solides de l'ensemble isolé a une puissance intérieure non nulle : moteur dont le stator appartient à \(S_i\) et le rotor à \(S_j\), \(\mathcal P = C_m\,\omega(S_j/S_i)\) ; vérin entre deux bras, \(\mathcal P = F\,v_{\text{tige/corps}}\). Si le stator ou le corps est fixé au bâti, extérieur à l'ensemble, la même puissance est comptée comme extérieure.</p>

  <h3>Liaisons réelles : trois modèles de pertes</h3>
  <ul>
    <li><strong>Frottement sec (Coulomb), avec glissement.</strong> Au point de contact \(I\), la vitesse de glissement est \(\vec V_g = \vec V(I,S_j/S_i) \neq \vec 0\). L'action de \(S_i\) sur \(S_j\) a une composante normale \(N \geq 0\) et une composante tangentielle opposée à \(\vec V_g\), de norme \(fN\) :
      <div class="formula" data-nom="Puissance dissipée par frottement sec">$$\mathcal P(S_i\leftrightarrow S_j) = -f\,N\,\|\vec V_g\|\ \leq 0$$</div>
      Dans une pivot réelle, on modélise souvent un couple de frottement \(C_f\) constant, opposé à la rotation relative : \(\mathcal P = -C_f\,|\omega_{j/i}|\).</li>
    <li><strong>Frottement visqueux</strong> (paliers lubrifiés, amortisseurs) : couple \(-f_v\,\omega_{j/i}\), d'où \(\mathcal P = -f_v\,\omega_{j/i}^2\) ; en translation, \(\mathcal P = -c\,v_{j/i}^2\).</li>
    <li><strong>Roulement sans glissement et résistance au roulement.</strong> Sans glissement, \(\vec V(I,S_j/S_i) = \vec 0\) : la force de contact ne travaille pas. Mais la déformation du contact décale la force normale vers l'avant d'une distance \(\delta\) : il en résulte un couple \(\delta\,N\) opposé à la rotation de roulement, de puissance \(-\delta\,N\,|\omega_r|\), où \(\omega_r\) est la composante de \(\vec\Omega(S_j/S_i)\) dans le plan tangent.</li>
  </ul>
  <figure class="schema">

  <div class="method-box">
    <strong>Exemple — rouler plutôt que glisser</strong>

      <li>Pertes au roulement : \(\mathcal P = -(\delta/R)\,mg\,v\), avec \(\delta/R = 0{,}0125\) et \(mg \approx 785\ \text{N}\) : \(\mathcal P \approx -12\ \text{W}\).</li>

    </ol>
  </div>
  <div class="notice"><strong>Ordres de grandeur</strong> de \(\delta/R\) (coefficient de résistance au roulement) : pneu de voiture sur route \(\approx 0{,}01\) (\(\delta \approx 3\ \text{mm}\) pour \(R = 0{,}3\ \text{m}\)) ; roue de train sur rail \(\approx 0{,}001\) à \(0{,}002\). Coefficients de frottement sec : acier sur acier lubrifié \(f \approx 0{,}1\), à sec \(0{,}2\) ; garniture de frein sur fonte \(\approx 0{,}4\).</div>
  <div class="notice"><strong>Erreur classique</strong> : compter \(-fN v\) pour une roue qui roule sans glisser. Sans glissement, le frottement sec ne dissipe rien (il permet seulement l'adhérence) ; seule la résistance au roulement travaille.</div>

<div class="course-section">
  <div class="sec-num">§3 · ÉNERGIE POTENTIELLE</div>
  <h2>Pesanteur, ressorts et énergie mécanique</h2>
  <div class="intro">Certaines actions ne dissipent pas l'énergie : elles la stockent puis la restituent. Leur puissance est la dérivée, au signe près, d'une fonction de la seule position : l'énergie potentielle. On les traite une fois pour toutes, sans recalculer leur puissance.</div>
  <div class="def-box">
    <strong>Énergie potentielle.</strong> Une action (extérieure, ou mutuelle entre deux solides) dérive d'une énergie potentielle \(E_p\), fonction de la position seule et définie à une constante près, si sa puissance s'écrit \(\mathcal P = -\dfrac{dE_p}{dt}\).
  </div>
  <div style="overflow-x:auto"><table>
    <tr><th>Action</th><th>Énergie potentielle</th><th>Notations</th></tr>
    <tr><td>Pesanteur</td><td>\(E_p = m\,g\,z_G\)</td><td>\(\vec z\) vertical ascendant</td></tr>
    <tr><td>Ressort de traction-compression</td><td>\(E_p = \frac12 k\,(\ell - \ell_0)^2\)</td><td>raideur \(k\) (N/m), longueur libre \(\ell_0\)</td></tr>
    <tr><td>Ressort de torsion</td><td>\(E_p = \frac12 k_t\,(\theta - \theta_0)^2\)</td><td>raideur \(k_t\) (N·m/rad), angle libre \(\theta_0\)</td></tr>
  </table></div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le ressort entre deux pièces mobiles : une puissance intérieure.</span>
    <div class="content">
      <p>Ressort entre \(A\in S_1\) et \(B\in S_2\), de longueur \(\ell = AB\) et de direction \(\vec u = \overrightarrow{AB}/\ell\). Il exerce sur \(S_2\) la force \(-k(\ell-\ell_0)\,\vec u\) en \(B\), et l'opposée sur \(S_1\) en \(A\). Sa puissance intérieure vaut</p>
      <div class="formula">$$\mathcal P = -k(\ell-\ell_0)\,\vec u\cdot\left(\vec V(B) - \vec V(A)\right)$$ $$\mathcal P = -k(\ell-\ell_0)\,\dot\ell = -\frac{d}{dt}\left[\frac12 k(\ell-\ell_0)^2\right]$$</div>
      <p>car \(\ell^2 = \overrightarrow{AB}\cdot\overrightarrow{AB}\) donne \(\ell\dot\ell = \overrightarrow{AB}\cdot(\vec V(B) - \vec V(A))\). Pour le poids : \(\mathcal P = -mg\,\dot z_G = -\frac{d}{dt}(mgz_G)\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Énergie mécanique.</strong> \(E_m = E_c + E_p\). Si toutes les autres actions ont une puissance nulle (liaisons parfaites, ni moteur ni frottement), \(E_m\) se conserve. Sinon, sa variation est égale au travail des actions qui ne dérivent pas d'une énergie potentielle (§5).
  </div>
  <div class="method-box">
    <strong>Exemple — le contrepoids d'un ascenseur</strong>
    <ol>
      <li>Cabine 700 kg, charge nominale 630 kg (8 personnes), contrepoids 1 000 kg, relié à la cabine par un câble passant sur une poulie : quand la cabine monte de \(h\), le contrepoids descend de \(h\).</li>
      <li>Montée de 20 m à pleine charge : \(\Delta E_p = (700 + 630 - 1\,000)\times9{,}81\times20 \approx 65\ \text{kJ}\), contre 261 kJ sans contrepoids. Le moteur n'a plus à fournir que l'écart entre les deux masses.</li>
      <li>Montée de la cabine vide : \(\Delta E_p = (700 - 1\,000)\times9{,}81\times20 \approx -59\ \text{kJ}\). L'énergie potentielle diminue : c'est la charge qui entraîne, et le moteur doit <strong>freiner</strong> (§8).</li>
    </ol>
  </div>
  <p>Même idée pour les bras de robot, barrières levantes et hayons : un ressort de compensation bien réglé rend \(E_p\) presque constante, et le moteur ne fournit plus que l'énergie cinétique et les pertes.</p>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉNERGIE CINÉTIQUE D'UN ENSEMBLE DE SOLIDES</div>
  <h2>Rappel et mise en forme pour l'énergétique</h2>
  <div class="intro">L'énergie cinétique a été établie dans « Cinétique et dynamique du solide (3D) », §7. On rappelle ici les formes utiles et la mise en forme qui sert dans toute la suite : un mécanisme à un paramètre a une énergie cinétique proportionnelle au carré d'une seule vitesse.</div>
  <div class="prop-box">
    <strong>Formules à connaître.</strong> Comoment du torseur cinétique et du torseur cinématique, au même point \(A\) :
    <div class="formula" data-nom="Énergie cinétique (comoment)">$$2E_c(S/\mathcal R_g) = \{\mathcal C(S/\mathcal R_g)\}\otimes\{\mathcal V(S/\mathcal R_g)\}$$</div>
    <ul>
      <li>en \(G\) (König) : \(E_c = \frac12 m\,V(G)^2 + \frac12\,\vec\Omega\cdot\overline{\overline{I}}(G,S)\,\vec\Omega\) ;</li>
      <li>rotation autour d'un axe fixe \(\Delta\) : \(E_c = \frac12 J_\Delta\,\omega^2\) ; translation : \(E_c = \frac12 m V^2\) ;</li>
      <li>ensemble : \(E_c(\Sigma/\mathcal R_g) = \sum_i E_c(S_i/\mathcal R_g)\), chaque terme calculé au point le plus commode.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Mécanisme à un paramètre.</strong> Si toutes les vitesses s'expriment en fonction d'un seul paramètre \(q\) (angle du moteur, position d'un chariot), chacune est proportionnelle à \(\dot q\) et
    <div class="formula" data-nom="Inertie équivalente">$$E_c(\Sigma/\mathcal R_g) = \frac12 J_{eq}(q)\,\dot q^2$$ $$J_{eq} = \sum_i J_i\left(\frac{\omega_i}{\dot q}\right)^2 + \sum_k m_k\left(\frac{V_{G_k}}{\dot q}\right)^2$$</div>
    (formule écrite pour des solides en rotation autour d'axes fixes ou en translation ; sinon, utiliser König). \(J_{eq}\) est constant pour des rapports de transmission constants (engrenages, poulies, vis-écrou) ; il dépend de \(q\) pour une bielle-manivelle ou une came.
  </div>
  <div class="method-box">
    <strong>Exemple — l'énergie cinétique d'un vélo</strong>
    <ol>
      <li>Cycliste et vélo : 100 kg en tout, dont deux roues de rayon \(R = 0{,}35\ \text{m}\) et de moment d'inertie \(J = 0{,}12\ \text{kg·m}^2\) chacune. Roulement sans glissement : \(\omega = v/R\).</li>
      <li>Chaque roue : \(\frac12 m_r v^2 + \frac12 J (v/R)^2\) (König, centre en translation). La masse des roues est déjà comptée dans les 100 kg, d'où \(E_c = \frac12\left(100 + 2J/R^2\right)v^2\).</li>
      <li>\(2J/R^2 = 2\times0{,}12/0{,}35^2 \approx 1{,}96\ \text{kg}\) : masse équivalente 102 kg. La rotation des roues ajoute 2 % ; c'est peu sur un vélo, beaucoup plus pour une voiture équipée d'une transmission (le moteur et la boîte, qui tournent vite, pèsent lourd une fois ramenés : §7).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · THÉORÈME DE L'ÉNERGIE CINÉTIQUE</div>
  <h2>Une équation scalaire tirée du principe fondamental</h2>
  <div class="intro">Le théorème de l'énergie cinétique (TEC) relie la variation de l'énergie cinétique à la puissance de toutes les actions, extérieures et intérieures. Ce n'est pas un principe nouveau : c'est une conséquence du principe fondamental de la dynamique, une combinaison bien choisie de ses équations.</div>
  <div class="prop-box">
    <strong>TEC pour un solide.</strong> Pour un solide \(S\) en mouvement par rapport à un repère galiléen \(\mathcal R_g\) :
    <div class="formula" data-nom="Théorème de l'énergie cinétique (solide)">$$\frac{d}{dt}E_c(S/\mathcal R_g) = \mathcal P(\bar S\to S/\mathcal R_g)$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Faire le comoment des deux membres du PFD avec le torseur cinématique.</span>
    <div class="content">
      <p>Le PFD donne \(\{\mathcal D(S/\mathcal R_g)\} = \{\mathcal T(\bar S\to S)\}\). Le comoment du membre de droite avec \(\{\mathcal V(S/\mathcal R_g)\}\) est \(\mathcal P(\bar S\to S/\mathcal R_g)\). Celui du membre de gauche, calculé comme au §1 avec \(\vec\Gamma(M)\,dm\) à la place de \(d\vec F(M)\), vaut</p>
      <div class="formula">$$\{\mathcal D\}\otimes\{\mathcal V\} = \int_S \vec\Gamma(M/\mathcal R_g)\cdot\vec V(M/\mathcal R_g)\,dm$$ $$\{\mathcal D\}\otimes\{\mathcal V\} = \frac{d}{dt}\left(\frac12\int_S \vec V(M/\mathcal R_g)^2\,dm\right)$$</div>
      <p>la masse étant constante (dérivation sous le signe somme). C'est \(\frac{d}{dt}E_c(S/\mathcal R_g)\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>TEC pour un ensemble de solides</strong> \(\Sigma = \{S_1,\dots,S_n\}\), dans \(\mathcal R_g\) galiléen :
    <div class="formula" data-nom="Théorème de l'énergie cinétique (ensemble)">$$\frac{d}{dt}E_c(\Sigma/\mathcal R_g) = \mathcal P(\bar\Sigma\to\Sigma/\mathcal R_g) + \mathcal P_{int}(\Sigma)$$</div>
    <strong>Forme intégrée</strong>, entre deux instants : \(E_c(t_2) - E_c(t_1) = W_{ext} + W_{int}\). En regroupant les actions qui dérivent d'une énergie potentielle (§3) : \(\Delta(E_c + E_p) = W\) des autres actions (moteurs, frottements…).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Sommer le théorème écrit pour chaque solide.</span>
    <div class="content">
      <p>Pour \(S_i\), le milieu extérieur comprend \(\bar\Sigma\) et les autres solides de \(\Sigma\) :</p>
      <div class="formula">$$\frac{d}{dt}E_c(S_i/\mathcal R_g) = \mathcal P(\bar\Sigma\to S_i/\mathcal R_g) + \sum_{j\neq i}\mathcal P(S_j\to S_i/\mathcal R_g)$$</div>
      <p>En sommant sur \(i\), les premiers termes donnent \(\mathcal P(\bar\Sigma\to\Sigma)\) ; les seconds se regroupent par paires \(\mathcal P(S_j\to S_i) + \mathcal P(S_i\to S_j) = \mathcal P(S_i\leftrightarrow S_j)\), soit \(\mathcal P_{int}(\Sigma)\). Contrairement aux actions réciproques du PFD, les inter-efforts ne s'éliminent pas : leurs puissances ne se compensent que si la liaison est parfaite.</p>
    </div>
  </div>
  <div class="notice"><strong>À retenir sur la portée du TEC.</strong> (1) Il fournit <strong>une seule équation scalaire</strong>, qui n'est pas indépendante de celles du PFD : il ne remplace pas le PFD quand il y a plusieurs inconnues. (2) Les inconnues des liaisons parfaites n'y apparaissent pas : c'est tout son intérêt. (3) Il exige un repère galiléen pour les puissances extérieures ; les puissances intérieures, elles, ne dépendent d'aucun repère.</div>

  <div class="method-box">
    <strong>Exemple — démarrage d'un monte-charge à treuil</strong>
    <ol>
      <li>Un motoréducteur entraîne un tambour de rayon \(r = 0{,}15\ \text{m}\) sur lequel s'enroule un câble qui soulève une charge \(m = 200\ \text{kg}\). Inertie du tambour et du motoréducteur ramenée sur l'axe du tambour : \(J = 1{,}2\ \text{kg·m}^2\). Couple moteur ramené sur l'axe du tambour (caractéristique d'un moteur à courant continu) : \(C = C_0 - b\,\omega\), avec \(C_0 = 400\ \text{N·m}\), \(b = 25\ \text{N·m·s/rad}\). Frottement visqueux dans le palier : \(f_v = 0{,}5\ \text{N·m·s/rad}\).</li>
      <li>On isole \(\Sigma\) = {parties tournantes du motoréducteur, tambour, câble, charge} ; câble inextensible et de masse négligée. Énergie cinétique : \(E_c = \frac12(J + mr^2)\,\omega^2\), avec \(v = r\omega\).</li>
      <li>Puissances extérieures : couple moteur \(C\omega\) (stator fixé au bâti) ; poids \(-mgv = -mgr\,\omega\) ; palier : \(-f_v\omega^2\). Puissance intérieure : la tension du câble ne travaille pas (câble inextensible, sans glissement sur le tambour).</li>
      <li>TEC, puis division par \(\omega\) : \((J + mr^2)\,\dot\omega = C_0 - mgr - (b + f_v)\,\omega\). Premier ordre de constante de temps \(\tau = \dfrac{J + mr^2}{b + f_v} = \dfrac{5{,}7}{25{,}5} \approx 0{,}22\ \text{s}\).</li>
      <li>Accélération initiale : \(\dot\omega(0) = (400 - 294)/5{,}7 \approx 18{,}5\ \text{rad/s}^2\), soit 2,8 m/s² pour la charge. Vitesse finale : \(\omega_\infty = 105{,}7/25{,}5 \approx 4{,}1\ \text{rad/s}\), soit 0,62 m/s.</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Forme intégrée : à la coupure du courant, sur quelle distance s'arrête un convoyeur à bande ?</span>
    <div class="content">
      <p>Bande et colis : 300 kg à \(v_0 = 0{,}8\ \text{m/s}\) ; deux tambours (\(J_t = 0{,}6\ \text{kg·m}^2\), \(R = 0{,}1\ \text{m}\), donc 8 rad/s) ; moteur (\(J_m = 0{,}01\ \text{kg·m}^2\)) relié par un réducteur de rapport \(1/15\), donc à 120 rad/s. Les résistances (roulement de la bande sur ses rouleaux) équivalent à une force constante de 120 N sur la bande.</p>
      <div class="formula">$$E_c = \tfrac12\times300\times0{,}8^2 + 2\times\tfrac12\times0{,}6\times8^2 + \tfrac12\times0{,}01\times120^2$$ $$E_c = 96 + 38{,}4 + 72 \approx 206\ \text{J}$$</div>
      <p>À l'arrêt, \(E_c = 0\) ; le TEC intégré donne \(0 - 206 = -120\,d\), soit \(d \approx 1{,}7\ \text{m}\). Sans rien savoir de la durée du freinage, la forme intégrée donne directement la distance. Remarque : le petit rotor, qui tourne vite, stocke autant d'énergie que les trois quarts de la charge.</p>
    </div>
  </div>

  <h3>Mécanisme à inertie variable</h3>
  <div class="prop-box">
    <strong>Équation de mouvement à un paramètre.</strong> Si \(E_c = \frac12 J_{eq}(q)\,\dot q^2\) et si la puissance totale (extérieure et intérieure) s'écrit \(Q\,\dot q\), alors
    <div class="formula" data-nom="TEC à un paramètre">$$J_{eq}(q)\,\ddot q + \frac12\,\frac{dJ_{eq}}{dq}\,\dot q^2 = Q$$</div>
    \(Q\) est le couple (ou l'effort) <strong>généralisé</strong> associé à \(q\). Pour \(J_{eq}\) constant, on retrouve \(J_{eq}\,\ddot q = Q\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dériver un produit dont un facteur dépend de la position.</span>
    <div class="content">
      <p>\(\dfrac{d}{dt}\left(\frac12 J_{eq}(q)\,\dot q^2\right) = J_{eq}\,\dot q\,\ddot q + \frac12\,\dfrac{dJ_{eq}}{dq}\,\dot q\cdot\dot q^2\), car \(\dfrac{dJ_{eq}}{dt} = \dfrac{dJ_{eq}}{dq}\,\dot q\). Le TEC donne cette quantité égale à \(Q\dot q\) ; on divise par \(\dot q\). L'équation obtenue vaut aussi, par continuité, aux instants où \(\dot q\) s'annule.</p>
      <p>Exemple : compresseur à bielle-manivelle (bielle de masse négligée, piston de masse \(m_3\), position \(x(\theta)\) donnée par la fermeture géométrique). \(J_{eq}(\theta) = J_1 + m_3\,(dx/d\theta)^2\) varie à chaque tour : même à couple moteur constant, la vitesse de rotation ondule. C'est le rôle du volant d'inertie d'augmenter \(J_1\) pour lisser cette ondulation.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · CHOISIR ENTRE TEC ET PFD</div>
  <h2>Quelle équation écrire, sur quel isolement ?</h2>
  <div class="intro">Le TEC et le PFD décrivent la même physique. Le choix est une question d'efficacité : obtenir l'équation cherchée avec le moins d'inconnues parasites possible, après avoir tracé le graphe de structure et repéré les paramètres du mouvement.</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Je cherche…</th><th>Outil conseillé</th><th>Pourquoi</th></tr>
    <tr><td>la loi de mouvement d'un mécanisme à un paramètre, liaisons parfaites</td><td>TEC sur tout le mécanisme</td><td>aucune inconnue de liaison n'apparaît</td></tr>
    <tr><td>le couple ou l'effort moteur pour un mouvement imposé (un paramètre)</td><td>TEC, ou modèle équivalent (§7)</td><td>une équation pour une inconnue</td></tr>
    <tr><td>une vitesse atteinte après un déplacement, une distance d'arrêt</td><td>TEC intégré</td><td>pas besoin du temps</td></tr>
    <tr><td>les actions dans une liaison</td><td>PFD sur l'isolement adapté</td><td>une liaison parfaite ne travaille pas : le TEC ne la « voit » pas</td></tr>
    <tr><td>le mouvement d'un système à plusieurs paramètres</td><td>PFD (une équation par paramètre, projetée sur les mobilités)</td><td>le TEC ne donne qu'une équation</td></tr>
    <tr><td>un mouvement avec frottement sec dans une liaison</td><td>PFD pour l'effort normal, puis TEC</td><td>la puissance dissipée dépend de \(N\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — une caisse hissée sur une rampe</strong>
    <ol>
      <li>Caisse de 200 kg tirée par un câble parallèle à une rampe inclinée de \(\alpha = 15°\) ; frottement sec caisse/rampe \(f = 0{,}3\). Quel effort \(T\) dans le câble pour monter à vitesse constante ?</li>
      <li>Le TEC sur la caisse fait intervenir la puissance dissipée \(-fNv\) : il faut d'abord \(N\). Le TRD selon la normale à la rampe donne \(N = mg\cos\alpha\).</li>
      <li>TEC à vitesse constante (\(dE_c/dt = 0\)) : \(Tv - mgv\sin\alpha - f\,mg\cos\alpha\,v = 0\), d'où \(T = mg(\sin\alpha + f\cos\alpha) = 1\,962\times(0{,}259 + 0{,}290) \approx 1{,}08\ \text{kN}\).</li>
      <li>Ici le TRD selon la rampe donnait la même équation : sur un solide en translation, le TEC n'est que le TRD multiplié par \(v\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier une puissance intérieure. Sur un robot mobile ou un vélo à assistance électrique, le stator du moteur est fixé au châssis, qui bouge : si l'on isole tout le véhicule, le couple moteur est un inter-effort de puissance \(C_m\,\omega(\text{rotor}/\text{châssis})\), et non \(C_m\) multiplié par une vitesse absolue. Autre piège : appliquer le TEC à un système à deux paramètres et espérer en tirer deux inconnues.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · MODÈLE ÉQUIVALENT RAMENÉ SUR L'ACTIONNEUR</div>
  <h2>Inertie équivalente et couple résistant équivalent</h2>
  <div class="intro">Pour choisir un moteur ou régler son asservissement, on veut voir le mécanisme « depuis l'arbre moteur » : une seule inertie, un seul couple résistant. Les deux se définissent par des égalités d'énergie et de puissance, ce qui garantit que le modèle réduit obéit au même TEC que le mécanisme réel.</div>
  <div class="def-box">
    <strong>Modèle équivalent.</strong> Pour un actionneur rotatif de vitesse \(\omega_m\) (resp. linéaire de vitesse \(v\)) qui pilote un mécanisme à un paramètre :
    <div class="formula" data-nom="Modèle équivalent ramené sur l'actionneur">$$J_{eq}\,\frac{d\omega_m}{dt} = C_m - C_{r,eq}$$ $$M_{eq}\,\frac{dv}{dt} = F_m - F_{r,eq}$$</div>
    <ul>
      <li><strong>Inertie (ou masse) équivalente</strong> : \(E_c(\Sigma/\mathcal R_g) = \frac12 J_{eq}\,\omega_m^2\) (ou \(\frac12 M_{eq}\,v^2\)) ;</li>
      <li><strong>couple (ou effort) résistant équivalent</strong> : la somme des puissances de toutes les actions autres que le moteur, extérieures et intérieures, vaut \(-C_{r,eq}\,\omega_m\) (ou \(-F_{r,eq}\,v\)).</li>
    </ul>
    Avec \(J_{eq}\) constant, le TEC \(J_{eq}\,\omega_m\,\dot\omega_m = C_m\omega_m - C_{r,eq}\,\omega_m\) donne exactement le modèle.
  </div>
  <div style="overflow-x:auto"><table>
    <tr><th>Transmission (rapport \(k = \omega_s/\omega_m\))</th><th>Cinématique</th><th>Contribution à \(J_{eq}\)</th><th>Couple ramené</th></tr>
    <tr><td>Réducteur, courroie (sortie en rotation)</td><td>\(\omega_s = k\,\omega_m\)</td><td>\(J_s\,k^2\)</td><td>\(k\,C_s\)</td></tr>
    <tr><td>Tambour, poulie, pignon-crémaillère de rayon \(R\)</td><td>\(v = R\,k\,\omega_m\)</td><td>\(m\,(Rk)^2\)</td><td>\(Rk\,F\)</td></tr>
    <tr><td>Vis-écrou de pas \(p\) (vis à \(k\,\omega_m\))</td><td>\(v = \dfrac{p\,k}{2\pi}\,\omega_m\)</td><td>\(m\left(\dfrac{pk}{2\pi}\right)^2\)</td><td>\(\dfrac{pk}{2\pi}\,F\)</td></tr>
  </table></div>
  <p>Le « couple ramené » est celui qui, sur l'arbre moteur, a la même puissance que l'effort \(F\) ou le couple \(C_s\) côté charge (transmission parfaite ; les pertes sont traitées au §8). Une inertie est multipliée par le <strong>carré</strong> du rapport, un effort par le rapport : un réducteur (\(k \lt 1\)) écrase les inerties de la charge bien plus que ses efforts.</p>

  <figure class="schema">

  <div class="method-box">
    <strong>Exemple — modèle équivalent d'un ascenseur</strong>
    <ol>
      <li>Données : rotor \(J_m = 0{,}05\ \text{kg·m}^2\), réducteur \(k = 1/30\), poulie \(J_p = 2\ \text{kg·m}^2\) de rayon \(R = 0{,}25\ \text{m}\) ; cabine 700 kg, charge 630 kg, contrepoids 1 000 kg ; \(v = 1\ \text{m/s}\), d'où \(\omega_p = 4\ \text{rad/s}\) et \(\omega_m = 120\ \text{rad/s}\) (1 146 tr/min). Transmission supposée parfaite.</li>
      <li>Inertie équivalente : \(Rk = 8{,}33\times10^{-3}\ \text{m}\) et
        <div class="formula">$$J_{eq} = J_m + J_p k^2 + (m_c + m_{ch} + m_{cp})(Rk)^2$$ $$J_{eq} = 0{,}05 + 0{,}0022 + 0{,}162 \approx 0{,}214\ \text{kg·m}^2$$</div>
        Les 2 330 kg en translation dominent ; la poulie, pourtant lourde, ne compte presque pas.</li>
      <li>Couple résistant équivalent : la puissance des poids vaut \(-(m_c + m_{ch} - m_{cp})\,g\,v\), d'où, à pleine charge :
        <div class="formula">$$C_{r,eq} = (m_c + m_{ch} - m_{cp})\,g\,Rk$$ $$C_{r,eq} = 330\times9{,}81\times8{,}33\times10^{-3} \approx 27{,}0\ \text{N·m}$$</div></li>
      <li>Démarrage en montée à \(a = 1\ \text{m/s}^2\) : \(\dot\omega_m = a/(Rk) = 120\ \text{rad/s}^2\), d'où \(J_{eq}\dot\omega_m \approx 25{,}7\ \text{N·m}\) et \(C_m = J_{eq}\dot\omega_m + C_{r,eq} \approx 52{,}7\ \text{N·m}\) : l'accélération double le couple nécessaire.</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Ordre de grandeur</span>
    <span class="prompt">Le rotor d'un servomoteur (\(J_m = 2\times10^{-4}\ \text{kg·m}^2\)) entraîne directement une vis à billes de pas 10 mm. Quelle masse « voit » la table ?</span>
    <div class="content">
      <p>Ramenée sur la translation, l'inertie du rotor devient une masse : \(\frac12 J_m\omega^2 = \frac12 M\,v^2\) avec \(v = \frac{p}{2\pi}\,\omega\), d'où</p>
      <div class="formula">$$M = J_m\left(\frac{2\pi}{p}\right)^2$$ $$M = 2\times10^{-4}\times\left(\frac{2\pi}{0{,}01}\right)^2 \approx 79\ \text{kg}$$</div>
      <p>Un rotor de quelques centaines de grammes pèse autant qu'une lourde table : sur les axes rapides, l'inertie du moteur n'est jamais négligeable.</p>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : diviser au lieu de multiplier. Avec \(k = \omega_s/\omega_m\) (inférieur à 1 pour un réducteur), l'inertie de sortie est multipliée par \(k^2\), donc réduite ; si le rapport est donné sous la forme \(\omega_m/\omega_s\) (« réduction 30 »), on divise par \(30^2\). Toujours vérifier sur un cas simple que l'inertie ramenée de la charge diminue quand la réduction augmente.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · RENDEMENT EN RÉGIME PERMANENT</div>
  <h2>Pertes, sens de transfert et irréversibilité</h2>
  <div class="intro">Aucun constituant réel n'est parfait : engrènements, roulements, joints et contacts glissants dissipent une partie de la puissance qui les traverse. Plutôt que de modéliser chaque frottement, on résume les pertes d'un constituant par son rendement, mesuré en régime permanent et donné par la documentation.</div>
  <div class="def-box">
    <strong>Rendement.</strong> En régime permanent, un constituant reçoit la puissance \(\mathcal P_e \gt 0\), en restitue \(\mathcal P_s\) et dissipe le reste : \(\mathcal P_e = \mathcal P_s + \mathcal P_{pertes}\), avec \(\mathcal P_{pertes} \geq 0\).
    <div class="formula" data-nom="Rendement">$$\eta = \frac{\mathcal P_s}{\mathcal P_e} = 1 - \frac{\mathcal P_{pertes}}{\mathcal P_e}$$ $$\text{sur un cycle : }\ \eta = \frac{W_{\text{utile}}}{W_{\text{absorbée}}}$$</div>
    Pour une chaîne de constituants en série, les rendements se multiplient : \(\eta = \eta_1\,\eta_2\cdots\eta_n\).
  </div>
  <div class="notice"><strong>Pourquoi « en régime permanent » ?</strong> En phase transitoire, une partie de la puissance reçue est stockée (énergie cinétique, énergie potentielle) puis restituée plus tard. Le rapport instantané \(\mathcal P_s/\mathcal P_e\) n'a alors aucun sens comme mesure des pertes : il peut même dépasser 1 pendant un freinage. On raisonne sur un point de fonctionnement établi, ou sur un cycle complet (énergies stockées identiques au début et à la fin).</div>
  <div class="method-box">
    <strong>Exemple — puissance absorbée par un convoyeur</strong>
    <ol>
      <li>La bande doit recevoir 2,2 kW. Chaîne : moteur asynchrone (\(\eta = 0{,}86\)), réducteur (\(0{,}94\)), courroie (\(0{,}96\)).</li>
      <li>\(\eta = 0{,}86\times0{,}94\times0{,}96 \approx 0{,}776\) ; puissance électrique absorbée \(2{,}2/0{,}776 \approx 2{,}83\ \text{kW}\), pertes 0,63 kW.</li>
      <li>Sur une journée de 8 h : 22,7 kWh absorbés pour 17,6 kWh utiles. Gagner un point de rendement sur chaque constituant, c'est économiser environ 0,7 kWh par jour sur ce seul convoyeur.</li>
    </ol>
  </div>

  <h3>Le rendement dépend du sens de transfert de la puissance</h3>
  <figure class="schema">
    <svg viewBox="0 0 360 198" role="img" aria-label="Deux schémas de flux de puissance : en marche motrice la puissance va du moteur vers la charge, avec le rendement direct ; quand la charge est entraînante elle va de la charge vers le moteur, avec le rendement inverse">

      <rect x="138" y="26" width="96" height="34" rx="2" class="sk-ink fl-paper"/>

      <rect x="290" y="26" width="62" height="34" rx="2" class="sk-ink fl-paper"/>

      <line x1="234" y1="43" x2="286" y2="43" class="sk-accent" marker-end="url(#sk-arrow-accent)"/>

    <figcaption>Les pertes se calculent à partir de la puissance qui entre dans la transmission, du côté d'où vient le flux : rendement direct \(\eta\) quand le moteur entraîne, rendement inverse \(\eta'\) quand la charge entraîne.</figcaption>
  </figure>
  <div class="prop-box">
    <strong>Rendement direct, rendement inverse.</strong> Un transmetteur d'inertie négligeable a un rendement \(\eta\) quand la puissance va du moteur vers la charge, et \(\eta'\) quand elle va de la charge vers le moteur (souvent \(\eta' \approx \eta\) pour les engrenages et les courroies). Avec le couple résistant \(C_{r,eq}\) calculé pour une transmission parfaite (§7), on regarde le signe de la puissance de la charge \(\mathcal P_{ch} = -C_{r,eq}\,\omega_m\) ; en régime permanent :
    <div class="formula" data-nom="Couple moteur selon le sens de transfert">$$\mathcal P_{ch} \lt 0 \text{ (charge résistante) : } C_m = \frac{C_{r,eq}}{\eta}$$ $$\mathcal P_{ch} \gt 0 \text{ (charge entraînante) : } C_m = \eta'\,C_{r,eq}$$</div>
    En marche motrice, le moteur doit fournir plus que la charge ne consomme ; quand la charge entraîne, le moteur reçoit moins que ce que la charge cède : il <strong>freine</strong> (\(C_m\,\omega_m \lt 0\), fonctionnement en génératrice).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Bilan de puissance de la transmission, dans chaque sens.</span>
    <div class="content">
      <p>En régime permanent, aucune énergie n'est stockée. Charge résistante : le moteur fournit \(C_m\omega_m \gt 0\), la charge reçoit \(\eta\,C_m\omega_m\), qui doit égaler \(-\mathcal P_{ch} = C_{r,eq}\,\omega_m\) : d'où \(C_m = C_{r,eq}/\eta\). Charge entraînante : la charge fournit \(\mathcal P_{ch} \gt 0\), l'arbre moteur en reçoit \(\eta'\mathcal P_{ch}\), que le moteur absorbe : \(C_m\omega_m = -\eta'\mathcal P_{ch} = \eta'\,C_{r,eq}\,\omega_m\).</p>
      <p>En phase d'accélération, la puissance qui traverse la transmission comprend celle qui accélère les inerties situées en aval ; en marche motrice : \(C_m = J_{amont}\,\dot\omega_m + \left(J_{aval}\,\dot\omega_m + C_{r,eq}\right)/\eta\), où \(J_{aval}\) est l'inertie équivalente des pièces situées après la transmission.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — l'ascenseur dans ses quatre situations</strong>
    <ol>
      <li>Reprise du §7 avec un réducteur de rendement \(\eta = \eta' = 0{,}9\), à 1 m/s en régime permanent (\(\omega_m = \pm120\ \text{rad/s}\)). \(C_{r,eq} = 27{,}0\ \text{N·m}\) à pleine charge, \(-24{,}5\ \text{N·m}\) cabine vide.</li>
      <li><strong>Montée à pleine charge</strong> (charge résistante) : \(C_m = 27{,}0/0{,}9 = 30{,}0\ \text{N·m}\), \(\mathcal P_m \approx +3{,}6\ \text{kW}\) pour 3,24 kW utiles.</li>
      <li><strong>Montée à vide</strong> (le contrepoids entraîne) : \(C_m = 0{,}9\times(-24{,}5) \approx -22{,}1\ \text{N·m}\), \(\mathcal P_m \approx -2{,}65\ \text{kW}\) : le moteur freine et renvoie de l'énergie.</li>
      <li><strong>Descente à pleine charge</strong> (\(\omega_m \lt 0\), la cabine entraîne) : \(C_m = 0{,}9\times27{,}0 \approx 24{,}3\ \text{N·m}\), \(\mathcal P_m \approx -2{,}9\ \text{kW}\) : freinage.</li>
      <li><strong>Descente à vide</strong> (il faut remonter le contrepoids) : \(C_m = -24{,}5/0{,}9 \approx -27{,}3\ \text{N·m}\), \(\mathcal P_m \approx +3{,}3\ \text{kW}\).</li>
      <li>Les quatre quadrants du plan \((C_m, \omega_m)\) sont parcourus : le variateur doit savoir freiner (résistance de freinage ou renvoi au réseau). Au démarrage en montée à pleine charge, avec \(J_{amont} = J_m\) et \(J_{aval} = 0{,}164\ \text{kg·m}^2\) : \(C_m = 0{,}05\times120 + (0{,}164\times120 + 27{,}0)/0{,}9 \approx 57{,}8\ \text{N·m}\), contre 52,7 N·m sans pertes.</li>
    </ol>
  </div>

  <h3>Réversibilité et irréversibilité</h3>
  <div class="prop-box">
    <strong>Transmetteur irréversible.</strong> Un transmetteur est <strong>réversible</strong> si la charge peut entraîner le moteur (\(\eta' \gt 0\)), <strong>irréversible</strong> si \(\eta' \leq 0\) : aucun effort de la charge, si grand soit-il, ne peut le mettre en mouvement. Le frottement interne bloque tout retour : la charge reste en place moteur coupé, sans frein. Le prix à payer est un rendement direct faible (inférieur à 50 % pour une vis-écrou irréversible).
  </div>
  <div style="overflow-x:auto"><table>
    <tr><th>Transmetteur</th><th>Rendement direct</th><th>Réversibilité</th></tr>
    <tr><td>Engrenages, courroie, chaîne</td><td>0,95 à 0,99 par étage</td><td>réversible (\(\eta' \approx \eta\))</td></tr>
    <tr><td>Vis à billes</td><td>0,85 à 0,95</td><td>réversible : frein ou maintien en couple nécessaire</td></tr>
    <tr><td>Vis trapézoïdale (faible angle d'hélice)</td><td>0,3 à 0,45</td><td>irréversible en général</td></tr>
    <tr><td>Roue et vis sans fin</td><td>0,4 à 0,9 selon l'angle d'hélice</td><td>irréversible pour un petit angle d'hélice (grande réduction)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — table élévatrice à vis trapézoïdale</strong>
    <ol>
      <li>Charge \(F = 5\ \text{kN}\), levée à \(v = 10\ \text{mm/s}\) par une vis de pas \(p = 4\ \text{mm}\) entraînée directement par le moteur : \(\omega_m = 2\pi v/p \approx 15{,}7\ \text{rad/s}\) (150 tr/min). Documentation : \(\eta = 0{,}41\), \(\eta' = -0{,}41\).</li>
      <li>Couple parfait : \(C_{r,eq} = Fp/(2\pi) \approx 3{,}18\ \text{N·m}\). Montée : \(C_m = 3{,}18/0{,}41 \approx 7{,}8\ \text{N·m}\), soit 122 W absorbés pour 50 W utiles.</li>
      <li>Descente (\(\omega_m \lt 0\)) : \(C_m = \eta'\,C_{r,eq} \approx -1{,}3\ \text{N·m}\), donc \(C_m\omega_m \approx +20\ \text{W}\) : le moteur doit <strong>entraîner</strong> la descente ; la charge ne descend jamais seule.</li>
      <li>Avec une vis à billes (\(\eta = \eta' = 0{,}9\)) : 3,5 N·m en montée, freinage de 2,9 N·m en descente, mais un frein est indispensable à l'arrêt. Le choix dépend de l'usage : sécurité passive et usage occasionnel (vis trapézoïdale), rendement et service intensif (vis à billes).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : diviser par \(\eta\) quand la charge est entraînante. Le moteur freine alors avec un couple <em>réduit</em> par les pertes (\(\eta'\,C_{r,eq}\)), pas augmenté. Toujours repérer d'abord le sens du flux de puissance. Autre confusion : appliquer le rendement à un couple « en sortie de réducteur » sans tenir compte du rapport ; c'est la puissance qui est multipliée par \(\eta\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · DIMENSIONNER UNE MOTORISATION SUR UN CYCLE</div>
  <h2>Couple crête, couple thermique équivalent, rapport de transmission</h2>
  <div class="intro">Le modèle équivalent donne le couple moteur à chaque instant d'un cycle de fonctionnement. Il reste à le confronter à la documentation du moteur : trois vérifications, liées à trois limites physiques différentes (vitesse, couple de pointe, échauffement).</div>
  <div class="def-box">
    <strong>Couple thermique équivalent.</strong> Les pertes Joule d'un moteur sont proportionnelles au carré du courant, lui-même proportionnel au couple (\(C = KI\) pour un moteur à courant continu ou synchrone autopiloté). Sur un cycle de durée \(T\), l'échauffement est celui d'un couple constant égal à la valeur efficace :
    <div class="formula" data-nom="Couple thermique équivalent">$$C_{th} = \sqrt{\frac1T\int_0^T C_m^2(t)\,dt}$$ $$\text{couple par paliers : }\ C_{th} = \sqrt{\frac{\sum_i C_i^2\,t_i}{T}}$$</div>
  </div>
  <div class="prop-box">
    <strong>Trois vérifications.</strong> (1) Vitesse : \(\omega_{max}\) du cycle inférieure à la vitesse maximale du moteur. (2) Couple de pointe : \(|C_m|_{max}\) inférieur au couple crête admissible (limite du variateur, démagnétisation). (3) Échauffement : \(C_{th}\) inférieur au couple nominal (permanent) \(C_n\). La puissance nominale nécessaire s'en déduit, de l'ordre de \(C_{th}\,\omega_{max}\).
  </div>
  <div class="method-box">
    <strong>Exemple — axe linéaire d'un robot de palettisation</strong>
    <ol>
      <li>Chariot de 40 kg entraîné par courroie crantée (poulie \(R = 30\ \text{mm}\), deux poulies de \(4\times10^{-4}\ \text{kg·m}^2\)), réducteur \(k = 1/5\), rotor \(J_m = 3\times10^{-4}\ \text{kg·m}^2\) ; frottement des guidages \(F_f = 60\ \text{N}\) ; transmission supposée parfaite. Cycle : accélération en 0,25 s jusqu'à 2 m/s, palier de 0,5 s, freinage en 0,25 s, pause de 0,5 s (\(T = 1{,}5\ \text{s}\), course 1,5 m).</li>
      <li>Modèle équivalent :
        <div class="formula">$$J_{eq} = J_m + (2J_p + mR^2)\,k^2$$ $$J_{eq} = 3\times10^{-4} + \frac{0{,}0368}{25} \approx 1{,}77\times10^{-3}\ \text{kg·m}^2$$</div> \(C_{r,eq} = F_f\,Rk = 0{,}36\ \text{N·m}\) ; \(\omega_{max} = v/(Rk) \approx 333\ \text{rad/s}\) (3 183 tr/min) ; \(\dot\omega_m = 8/(Rk) \approx 1\,333\ \text{rad/s}^2\).</li>
      <li>Couples : accélération \(C_1 = J_{eq}\dot\omega_m + C_{r,eq} \approx 2{,}72\ \text{N·m}\) ; palier \(C_2 = 0{,}36\ \text{N·m}\) ; freinage \(C_3 = -2{,}36 + 0{,}36 \approx -2{,}00\ \text{N·m}\) ; pause : 0.</li>
      <li>Couple thermique équivalent :
        <div class="formula">$$C_{th} = \sqrt{\frac{2{,}72^2\times0{,}25 + 0{,}36^2\times0{,}5 + 2{,}00^2\times0{,}25}{1{,}5}} \approx 1{,}40\ \text{N·m}$$</div>
        Il faut un moteur de couple nominal d'au moins 1,4 N·m, de couple crête d'au moins 2,7 N·m et tournant à 3 200 tr/min (pointe de puissance : \(2{,}72\times333 \approx 0{,}9\ \text{kW}\)).</li>
      <li>Le rotor du moteur retenu figure dans \(J_{eq}\) : si son inertie diffère de celle supposée, on refait le calcul (démarche itérative).</li>
    </ol>
  </div>

  <h3>Choisir le rapport de transmission</h3>
  <p>Le rapport \(k\) arbitre entre vitesse et couple : une forte réduction diminue le couple demandé au moteur, mais augmente sa vitesse. Pour une charge essentiellement inertielle (inertie \(J_c\) côté sortie, accélération \(\dot\omega_c\) imposée), le couple d'accélération vaut \(C_m = (J_m + J_c\,k^2)\,\dot\omega_c/k\).</p>
  <div class="prop-box">
    <strong>Adaptation d'inertie.</strong> Ce couple est minimal pour \(J_c\,k^2 = J_m\), c'est-à-dire \(k_{opt} = \sqrt{J_m/J_c}\) : l'inertie de la charge ramenée sur l'arbre moteur égale celle du rotor.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Minimiser \(C_m(k) = (J_m/k + J_c\,k)\,\dot\omega_c\).</span>
    <div class="content">
      <p>\(\dfrac{dC_m}{dk} = \left(-\dfrac{J_m}{k^2} + J_c\right)\dot\omega_c\), qui s'annule pour \(k^2 = J_m/J_c\) et change de signe en ce point : c'est un minimum. Au minimum, \(C_m = 2\sqrt{J_m J_c}\,\dot\omega_c\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — quel rapport pour l'axe du robot ?</strong>
    <ol>
      <li>\(J_c = 2J_p + mR^2 = 0{,}0368\ \text{kg·m}^2\), d'où \(k_{opt} = \sqrt{3\times10^{-4}/0{,}0368} \approx 1/11\).</li>
      <li>Couple d'accélération et vitesse maximale du moteur selon \(k\) : 3,51 N·m et 1 910 tr/min pour \(k = 1/3\) ; 2,36 N·m et 3 183 tr/min pour \(1/5\) ; 1,87 N·m et 5 090 tr/min pour \(1/8\) ; 1,77 N·m et 7 000 tr/min pour \(1/11\).</li>
      <li>L'optimum est plat : passer de \(1/5\) à \(1/11\) ne gagne que 25 % de couple mais fait plus que doubler la vitesse, hors de portée de la plupart des servomoteurs. La vitesse maximale du moteur impose ici \(k\) autour de \(1/5\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Compléments non exigibles</h2>
  <div class="intro">Ces compléments éclairent le chapitre ; ils ne sont pas au programme de PT.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Rendement d'une vis avec frottement</span>
    <span class="prompt">D'où viennent \(\eta\), \(\eta'\) et la condition d'irréversibilité ?</span>
    <div class="content">
      <p>On « déroule » le filet (carré, rayon moyen \(r_m\)) : il devient un plan incliné d'angle \(\alpha\), avec \(\tan\alpha = p/(2\pi r_m)\). L'écrou chargé axialement par \(F\) est poussé tangentiellement par l'effort \(C/r_m\). Avec un frottement de Coulomb d'angle \(\varphi\) (\(\tan\varphi = f\)), l'équilibre du « bloc » sur le plan donne \(C = F r_m\tan(\alpha + \varphi)\) pour monter et \(C = F r_m\tan(\alpha - \varphi)\) pour retenir la descente. D'où</p>
      <div class="formula">$$\eta = \frac{Fp/(2\pi)}{F r_m\tan(\alpha+\varphi)} = \frac{\tan\alpha}{\tan(\alpha+\varphi)}$$ $$\eta' = \frac{\tan(\alpha-\varphi)}{\tan\alpha}$$</div>
      <p>La vis est irréversible si \(\alpha \leq \varphi\) ; alors \(\eta \leq \tan\alpha/\tan 2\alpha = (1 - \tan^2\alpha)/2 \lt 1/2\). Pour la vis de l'exemple du §8 (diamètre moyen 18 mm, pas 4 mm, \(f = 0{,}1\)) : \(\alpha \approx 4{,}0°\), \(\varphi \approx 5{,}7°\), \(\eta \approx 0{,}41\) et \(\eta' \approx -0{,}41\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Équations de Lagrange.</strong> Pour un mécanisme à \(n\) paramètres indépendants \(q_i\) et liaisons parfaites, la mécanique analytique écrit une équation par paramètre, sans aucune inconnue de liaison : \(\dfrac{d}{dt}\dfrac{\partial E_c}{\partial\dot q_i} - \dfrac{\partial E_c}{\partial q_i} = Q_i\), où \(Q_i\) est l'effort généralisé associé à \(q_i\). Avec un seul paramètre, on retrouve l'équation du §5 : \(J_{eq}\ddot q + \frac12 J_{eq}'\dot q^2 = Q\).
  </div>
  <div class="prop-box">
    <strong>TEC dans un repère non galiléen.</strong> Dans un repère \(\mathcal R\) en mouvement par rapport à \(\mathcal R_g\), il faut ajouter la puissance des forces d'inertie d'entraînement ; celle des forces d'inertie de Coriolis est nulle, car elles sont perpendiculaires à la vitesse relative.
  </div>
  <div class="prop-box">
    <strong>Rendement variable.</strong> Le rendement d'un réducteur réel dépend de la charge, de la vitesse et de la température : des pertes à vide (barbotage de l'huile, joints) s'ajoutent aux pertes proportionnelles à la puissance transmise, si bien que le rendement s'effondre à faible charge. Les constructeurs donnent des cartes de rendement ; le modèle à rendement constant de ce chapitre suffit aux écrits.
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="en2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉNERGÉTIQUE DES SYSTÈMES DE SOLIDES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>
  <div class="intro">Dans l'ordre du cours : puissances extérieures et intérieures (§1, §2), énergie potentielle et théorème de l'énergie cinétique (§3 à §5), choix entre ce théorème et le principe fondamental (§6), modèle équivalent (§7), rendements (§8), dimensionnement d'une motorisation et choix du rapport (§9).</div>

  <div class="method-box">
    <strong>Méthode 1 — Calculer la puissance d'une action extérieure</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cadre.</span> Préciser le solide (ou l'ensemble) qui reçoit l'action et le repère galiléen \(\mathcal R_g\) (en général le bâti).</li>
      <li><span class="step">Point commun.</span> Écrire le torseur de l'action et le torseur cinématique au même point, choisi pour simplifier : point d'application d'une force (moment nul), point d'un axe fixe (vitesse nulle).</li>
      <li><span class="step">Comoment.</span> \(\mathcal P = \vec R\cdot\vec V(A) + \vec M(A)\cdot\vec\Omega\) ; signe positif pour une action motrice, négatif pour une action résistante.</li>
      <li><span class="step">Raccourcis.</span> Poids : \(-mg\,\dot z_G\) ; couple pur : \(C\omega\) ; vérin à corps fixe : \(Fv\) ; ressort : \(-dE_p/dt\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Calculer la puissance intérieure d'un ensemble</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Graphe.</span> Sur le graphe de structure, repérer les liaisons dont les deux solides appartiennent à l'ensemble isolé : ce sont les seules qui comptent.</li>
      <li><span class="step">Liaisons parfaites</span> : puissance nulle. <span class="step">Actionneur interne</span> : \(C_m\,\omega_{\text{rotor/stator}}\) ou \(F\,v_{\text{tige/corps}}\). <span class="step">Ressort interne</span> : \(-\frac{d}{dt}\left(\frac12 k(\ell-\ell_0)^2\right)\).</li>
      <li><span class="step">Pertes.</span> Glissement : \(-fN\|\vec V_g\|\) ; pivot à frottement sec : \(-C_f|\omega|\) ; visqueux : \(-f_v\omega^2\) ; roulement : \(-\delta N|\omega_r|\). Si \(N\) est inconnu, l'obtenir d'abord par le PFD.</li>
      <li><span class="step">Contrôle.</span> Les pertes sont toujours négatives ; une puissance intérieure ne dépend d'aucun repère (seul le mouvement relatif compte).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Obtenir une équation de mouvement par le TEC</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Paramètre.</span> Choisir le paramètre \(q\) ; exprimer toutes les vitesses en fonction de \(\dot q\) (fermetures géométrique ou cinématique, rapports de transmission).</li>
      <li><span class="step">Énergie cinétique.</span> \(E_c = \frac12 J_{eq}(q)\,\dot q^2\), solide par solide, chacun au point le plus commode.</li>
      <li><span class="step">Puissances.</span> Extérieures (repère galiléen) et intérieures ; les mettre sous la forme \(Q\,\dot q\).</li>
      <li><span class="step">Dériver et diviser</span> par \(\dot q\) : \(J_{eq}\ddot q + \frac12 J_{eq}'\dot q^2 = Q\) (et \(J_{eq}\ddot q = Q\) si \(J_{eq}\) est constant). Pour une vitesse atteinte ou une distance d'arrêt, ne pas dériver : forme intégrée \(\Delta E_c = W\).</li>
      <li><span class="step">Vérifier</span> : homogénéité, équilibre statique retrouvé pour \(\dot q = \ddot q = 0\), signe des termes de pertes.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Choisir entre TEC et PFD</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Inventaire.</span> Graphe de structure, nombre de paramètres du mouvement, inconnues cherchées.</li>
      <li><span class="step">Loi de mouvement</span> ou couple moteur d'un système à un paramètre, liaisons parfaites : TEC sur tout le système.</li>
      <li><span class="step">Action dans une liaison</span> : PFD sur l'isolement qui la fait apparaître, projeté pour éliminer les autres inconnues.</li>
      <li><span class="step">Frottement sec</span> : PFD pour l'effort normal, puis TEC. <span class="step">Distance d'arrêt, vitesse après un déplacement</span> : TEC intégré.</li>
      <li><span class="step">Plusieurs paramètres</span> : une équation par paramètre (PFD projeté sur chaque mobilité) ; le TEC peut servir de vérification.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Construire le modèle équivalent ramené sur l'actionneur</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cinématique.</span> Chaque vitesse s'écrit (rapport) × \(\omega_m\) : \(k\) pour un réducteur, \(Rk\) pour un tambour ou un pignon-crémaillère, \(pk/(2\pi)\) pour une vis-écrou.</li>
      <li><span class="step">Inertie.</span> \(J_{eq}\) par égalité des énergies cinétiques : chaque inertie ou masse est multipliée par le <strong>carré</strong> de son rapport.</li>
      <li><span class="step">Couple résistant.</span> Puissance de toutes les autres actions \(= -C_{r,eq}\,\omega_m\) : chaque effort est multiplié par son rapport (puissance 1).</li>
      <li><span class="step">Modèle.</span> \(J_{eq}\,\dot\omega_m = C_m - C_{r,eq}\) ; en linéaire, \(M_{eq}\,\dot v = F_m - F_{r,eq}\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Tenir compte des rendements</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Sans pertes</span> d'abord : calculer \(C_{r,eq}\) avec une transmission parfaite.</li>
      <li><span class="step">Sens du flux.</span> Signe de \(\mathcal P_{ch} = -C_{r,eq}\,\omega_m\) : négatif, la charge résiste et \(C_m = C_{r,eq}/\eta\) ; positif, la charge entraîne et \(C_m = \eta'\,C_{r,eq}\) (le moteur freine si \(\eta' \gt 0\)).</li>
      <li><span class="step">Irréversibilité</span> (\(\eta' \leq 0\)) : le moteur doit entraîner même une charge motrice ; maintien à l'arrêt sans frein.</li>
      <li><span class="step">Transitoires.</span> La puissance qui traverse la transmission comprend celle des inerties situées en aval : \(C_m = J_{amont}\dot\omega_m + (J_{aval}\dot\omega_m + C_{r,eq})/\eta\) en marche motrice.</li>
      <li><span class="step">Chaîne</span> : multiplier les rendements ; ne jamais calculer un rendement « instantané » pendant un transitoire.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Dimensionner un moteur sur un cycle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cycle.</span> Découper la loi de mouvement en phases (accélération, palier, freinage, pause) ; relever \(\omega_{max}\) et \(\dot\omega_m\) de chaque phase.</li>
      <li><span class="step">Couples.</span> Modèle équivalent (avec rendements) : un couple \(C_i\) par phase de durée \(t_i\).</li>
      <li><span class="step">Trois critères.</span> \(\omega_{max}\) inférieure à la vitesse maximale du moteur ; \(|C|_{max}\) inférieur au couple crête ; \(C_{th} = \sqrt{\sum C_i^2 t_i/T}\) inférieur au couple nominal.</li>
      <li><span class="step">Itérer.</span> Introduire l'inertie du rotor du moteur choisi et refaire le calcul ; retenir le plus petit moteur qui satisfait les trois critères.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Choisir le rapport de transmission</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Charge inertielle.</span> Inertie \(J_c\) côté sortie et accélération \(\dot\omega_c\) imposée : couple d'accélération au moteur \(C_m(k) = (J_m/k + J_c\,k)\,\dot\omega_c\), avec \(k = \omega_s/\omega_m\).</li>
      <li><span class="step">Optimum.</span> \(C_m\) est minimal pour \(k_{opt} = \sqrt{J_m/J_c}\) (adaptation d'inertie : \(J_c\,k^2 = J_m\)), où il vaut \(2\sqrt{J_mJ_c}\,\dot\omega_c\).</li>
      <li><span class="step">Contrainte de vitesse.</span> Vérifier que \(\omega_{c,max}/k\) reste sous la vitesse maximale du moteur ; l'optimum étant plat, on accepte souvent une réduction plus faible que \(1/k_{opt}\).</li>
      <li><span class="step">Charge résistante dominante</span> (levage, effort constant) : c'est alors la puissance et le couple thermique qui fixent \(k\), pas l'adaptation d'inertie.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> plateau tournant \(J_c = 0{,}8\ \text{kg·m}^2\), servomoteur \(J_m = 2\cdot10^{-4}\ \text{kg·m}^2\) : \(k_{opt} = \sqrt{2{,}5\cdot10^{-4}} \approx 1/63\). Pour un plateau à 3 rad/s au plus, le moteur tournerait à 190 rad/s (1 800 tr/min) : la réduction optimale est accessible.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Faire un bilan d'énergie sur un cycle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Frontière.</span> Délimiter le système ; identifier l'énergie absorbée (réseau, batterie) et l'énergie utile (travail sur la matière d'œuvre).</li>
      <li><span class="step">Énergies stockées.</span> Sur un cycle complet, énergies cinétique et potentielle reviennent à leur valeur initiale : elles ne sont ni utiles ni perdues.</li>
      <li><span class="step">Bilan.</span> \(W_{\text{absorbée}} = W_{\text{utile}} + W_{\text{pertes}}\), avec \(W = \int\mathcal P\,dt\) phase par phase ; rendement de cycle \(W_{\text{utile}}/W_{\text{absorbée}}\).</li>
      <li><span class="step">Phases de freinage.</span> Préciser si l'énergie restituée par la charge est récupérée (renvoi au réseau, batterie) ou dissipée (résistance de freinage).</li>
    </ol>
  </div>
</div>
</template>

  <div class="q"><strong>Q1.</strong> Calculer la puissance perdue par résistance au roulement.</div>
  <div class="q"><strong>Q2.</strong> Le portail avance à vitesse constante. En déduire l'effort sur la crémaillère, le couple et la vitesse de rotation du pignon, et la puissance mécanique fournie par le motoréducteur.</div>
  <div class="q"><strong>Q3.</strong> Le réducteur (roue et vis sans fin) a un rendement de 0,55 et le moteur électrique de 0,70. Quelle puissance électrique est absorbée en régime établi ? Pourquoi les moteurs de portail du commerce sont-ils pourtant bien plus puissants ?</div>

    <p><strong>Q1.</strong> Les deux galets portent tout le poids (\(\sum N = mg = 2\,943\ \text{N}\)) et tournent à \(v/R\) :</p>
    <div class="formula">$$\mathcal P = -\frac{\delta\,mg\,v}{R} = -\frac{0{,}4\times10^{-3}\times2\,943\times0{,}20}{0{,}050} \approx -4{,}7\ \text{W}$$</div>
    <p><strong>Q2.</strong> TEC sur le portail à vitesse constante : \(dE_c/dt = 0\), donc la puissance fournie par le pignon compense exactement les pertes : \(\mathcal P_m = 4{,}7\ \text{W}\). Effort \(F = \mathcal P_m/v \approx 23{,}5\ \text{N}\) (soit \((\delta/R)\,mg\)) ; couple \(C = Fr \approx 0{,}71\ \text{N·m}\) ; \(\omega = v/r \approx 6{,}7\ \text{rad/s}\) (64 tr/min).</p>
    <p><strong>Q3.</strong> \(\mathcal P_{\text{élec}} = 4{,}7/(0{,}55\times0{,}70) \approx 12\ \text{W}\). Les moteurs réels (quelques centaines de watts) doivent vaincre bien davantage : démarrage, rail encrassé ou en pente, vent sur un portail plein (quelques centaines de newtons), gel ; et l'irréversibilité du réducteur, qui verrouille le portail fermé, se paie par un faible rendement.</p>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Convoyeur à bande incliné : modèle équivalent</h3>
  <div class="statement">Un convoyeur incliné de \(\beta = 10°\) monte des colis à \(v = 0{,}8\ \text{m/s}\). Masse des colis présents sur la bande : 250 kg ; masse de la bande : 60 kg (un brin monte, l'autre descend). Deux tambours identiques : \(J_t = 0{,}4\ \text{kg·m}^2\), rayon \(R = 0{,}125\ \text{m}\). Moteur : \(J_m = 0{,}008\ \text{kg·m}^2\), relié au tambour moteur par un réducteur de rapport \(k = 1/20\) et de rendement \(\eta = 0{,}9\) (inertie du réducteur négligée). Les frottements de la bande sur ses rouleaux équivalent à une force résistante de 90 N le long de la bande.</div>
  <div class="q"><strong>Q1.</strong> Vitesses de rotation du tambour et du moteur.</div>
  <div class="q"><strong>Q2.</strong> Inertie équivalente ramenée sur l'arbre moteur. Pourquoi le poids de la bande ne figure-t-il pas dans le couple résistant ?</div>
  <div class="q"><strong>Q3.</strong> Couple résistant équivalent (transmission parfaite), puis couple moteur et puissance en régime permanent.</div>
  <div class="q"><strong>Q4.</strong> Couple moteur au démarrage, pour une accélération de la bande de \(0{,}5\ \text{m/s}^2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_t = v/R = 6{,}4\ \text{rad/s}\) ; \(\omega_m = \omega_t/k = 128\ \text{rad/s}\) (1 222 tr/min).</p>
    <p><strong>Q2.</strong> Toute la bande et tous les colis se déplacent à \(v = Rk\,\omega_m\) :</p>
    <div class="formula">$$J_{eq} = J_m + 2J_t\,k^2 + (250 + 60)(Rk)^2$$ $$J_{eq} = 0{,}008 + 0{,}002 + 0{,}0121 \approx 0{,}0221\ \text{kg·m}^2$$</div>
    <p>La bande est une boucle fermée : à chaque instant, autant de bande monte que de bande descend. Les puissances du poids des deux brins se compensent, et seule la masse des colis gagne de l'altitude.</p>
    <p><strong>Q3.</strong> Puissance des actions résistantes :</p>
    <div class="formula">$$-(m_{\text{colis}}\,g\sin\beta + 90)\,v = -(426 + 90)\times0{,}8 \approx -413\ \text{W}$$</div>
    <p>d'où</p>
    <div class="formula">$$C_{r,eq} = (m_{\text{colis}}\,g\sin\beta + F_r)\,Rk = 516\times6{,}25\times10^{-3} \approx 3{,}22\ \text{N·m}$$</div>
    <p>La charge résiste (marche motrice) : \(C_m = C_{r,eq}/\eta \approx 3{,}58\ \text{N·m}\), et \(\mathcal P_m = C_m\,\omega_m \approx 459\ \text{W}\) pour 413 W utiles.</p>
    <p><strong>Q4.</strong> \(\dot\omega_m = a/(Rk) = 80\ \text{rad/s}^2\). Le rotor est en amont du réducteur, tambours, bande et colis en aval (\(J_{aval} = 0{,}0141\ \text{kg·m}^2\)) :</p>
    <div class="formula">$$C_m = J_m\dot\omega_m + \frac{J_{aval}\dot\omega_m + C_{r,eq}}{\eta} = 0{,}64 + \frac{1{,}13 + 3{,}22}{0{,}9} \approx 5{,}5\ \text{N·m}$$</div>
    <p>Sans pertes, on aurait trouvé \(J_{eq}\dot\omega_m + C_{r,eq} \approx 5{,}0\ \text{N·m}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Arrêt d'une meuleuse : TEC intégré et dérivé</h3>
  <div class="statement">Le rotor d'une meuleuse d'atelier (moteur, arbre et meule : \(J = 0{,}45\ \text{kg·m}^2\)) tourne à 3 000 tr/min. À la coupure, un sabot de frein vient appuyer avec un effort normal \(N = 200\ \text{N}\) sur un tambour de rayon \(r_f = 80\ \text{mm}\) solidaire de l'arbre (frottement sec, \(f = 0{,}35\)). Les paliers opposent un couple de frottement constant \(C_p = 0{,}3\ \text{N·m}\).</div>
  <div class="q"><strong>Q1.</strong> Énergie cinétique initiale du rotor.</div>
  <div class="q"><strong>Q2.</strong> Puissance des actions du sabot et des paliers sur le rotor.</div>
  <div class="q"><strong>Q3.</strong> Nombre de tours effectués avant l'arrêt.</div>
  <div class="q"><strong>Q4.</strong> Durée de l'arrêt. Quelle part de l'énergie le frein dissipe-t-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0 = 3\,000\times\pi/30 \approx 314\ \text{rad/s}\) ; \(E_{c0} = \frac12 J\omega_0^2 \approx 22{,}2\ \text{kJ}\).</p>
    <p><strong>Q2.</strong> Le sabot glisse sur le tambour à la vitesse \(r_f\,\omega\) : son action tangentielle \(fN\) donne \(\mathcal P_f = -fN\,r_f\,\omega = -5{,}6\,\omega\) (en W, \(\omega\) en rad/s). Paliers : \(\mathcal P_p = -C_p\,\omega\). Au total, un couple résistant constant \(C = 5{,}9\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> TEC intégré entre le début et la fin du freinage : \(0 - E_{c0} = -C\,\Delta\theta\), d'où \(\Delta\theta = 22\,207/5{,}9 \approx 3\,764\ \text{rad}\), soit environ 600 tours.</p>
    <p><strong>Q4.</strong> TEC dérivé (ou TMD sur l'axe) : \(J\dot\omega = -C\), décélération constante, durée \(t = J\omega_0/C = 0{,}45\times314/5{,}9 \approx 24\ \text{s}\). Le frein dissipe \(5{,}6\times3\,764 \approx 21\ \text{kJ}\), soit 95 % de l'énergie (le reste dans les paliers), qu'il évacue sous forme de chaleur. La forme intégrée donnait l'angle sans passer par le temps ; la forme dérivée donne la durée.</p>
  </div>
