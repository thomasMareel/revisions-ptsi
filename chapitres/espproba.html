<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les points A c), A d) et A f) de la partie « Variables aléatoires discrètes » du programme de PT. Les formules de première année (réunion, conditionnement, probabilités composées et totales, Bayes, indépendance) restent vraies ; la nouveauté est la <strong>σ-additivité</strong>, qui permet de passer à la limite, de traiter des systèmes complets dénombrables et de distinguer « impossible » de « négligeable ». Prérequis : chapitre « Ensembles dénombrables et tribus », séries à termes positifs. Les lois sont au chapitre suivant.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Probabilité</strong> sur \((\Omega, \mathcal{A})\), <strong>σ-additivité</strong>, espace probabilisé \((\Omega, \mathcal{A}, P)\) (§1).</li>
        <li><strong>Probabilité de la réunion, de la différence</strong> de deux événements, de l'<strong>événement contraire</strong> ; <strong>croissance</strong> (§2).</li>
        <li><strong>Continuité croissante, continuité décroissante</strong> ; application aux limites de \(P\left(\bigcup_{k=0}^{n} A_k\right)\) et \(P\left(\bigcap_{k=0}^{n} A_k\right)\) pour une suite quelconque (§3).</li>
        <li><strong>Sous-additivité</strong> ; événements <strong>presque sûrs</strong>, <strong>négligeables</strong> ; <strong>système quasi-complet</strong> d'événements (§4).</li>
        <li><strong>Probabilité conditionnelle</strong>, \(P_B\) est une probabilité ; formule des <strong>probabilités composées</strong> (§5).</li>
        <li>Formule des <strong>probabilités totales</strong> pour un système complet ou quasi-complet, convention \(P(B \mid A_n)P(A_n) = 0\) si \(P(A_n) = 0\) ; <strong>formule de Bayes</strong> (§6).</li>
        <li><strong>Indépendance</strong> de deux événements, d'une famille finie ; l'indépendance deux à deux n'entraîne pas l'indépendance ; passage aux contraires (§7).</li>
        <li>Exemples de référence : jamais pile, premier pile au rang \(n\), test de dépistage, urne de Pólya (§3, §6, §8).</li>
      </ul>
      <p>Hors programme : la formule du crible, le lemme de Borel-Cantelli, la construction des probabilités sur des univers non dénombrables (fin du chapitre).</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · PROBABILITÉ ET σ-ADDITIVITÉ</div>
  <h2>Additionner une infinité de probabilités</h2>
  <div class="intro">En PTSI, une probabilité était additive pour deux événements incompatibles. Pour calculer la probabilité de « le premier 6 sort à un rang pair », réunion d'une infinité d'événements deux à deux incompatibles, il faut une additivité <strong>dénombrable</strong> : c'est l'axiome de σ-additivité.</div>

  <div class="def-box">
    Soit \(\mathcal{A}\) une tribu sur \(\Omega\). Une <strong>probabilité</strong> sur \((\Omega, \mathcal{A})\) est une application \(P : \mathcal{A} \to [0, 1]\) telle que :
    <ol>
      <li>\(P(\Omega) = 1\) ;</li>
      <li><strong>σ-additivité</strong> : pour toute suite \((A_n)_{n \in \mathbb{N}}\) d'événements deux à deux incompatibles, la série \(\sum P(A_n)\) converge et
        <div class="formula" data-nom="σ-additivité">$$P\Big(\bigcup_{n=0}^{+\infty} A_n\Big) = \sum_{n=0}^{+\infty} P(A_n).$$</div></li>
    </ol>
    Le triplet \((\Omega, \mathcal{A}, P)\) est un <strong>espace probabilisé</strong>.
  </div>
  <p>La série est à termes positifs : sa somme ne dépend pas de l'ordre des \(A_n\), pas plus que leur réunion (résultat admis par le programme).</p>

  <div class="prop-box">
    <strong>Premières conséquences.</strong> \(P(\varnothing) = 0\), et \(P\) est <strong>additive</strong> : si \(A_0, \ldots, A_n\) sont deux à deux incompatibles,
    <div class="formula" data-nom="Additivité finie">$$P(A_0 \cup \cdots \cup A_n) = \sum_{k=0}^{n} P(A_k).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Compléter par des ensembles vides.</span>
    <div class="content"><p>La suite \((\Omega, \varnothing, \varnothing, \ldots)\) est formée d'événements deux à deux incompatibles, de réunion \(\Omega\) : la σ-additivité donne \(1 = 1 + \sum_{n \geq 1} P(\varnothing)\). Une série constante de terme \(P(\varnothing) \geq 0\) ne converge vers 0 que si \(P(\varnothing) = 0\). Pour \(A_0, \ldots, A_n\) incompatibles, on complète par \(A_k = \varnothing\) pour \(k \gt n\) : la σ-additivité donne l'additivité finie.</p></div>
  </div>

  <h3>Probabilité sur un univers dénombrable</h3>
  <div class="prop-box">
    <strong>Distribution de probabilités.</strong> Si \(\Omega\) est au plus dénombrable et \(\mathcal{A} = \mathcal{P}(\Omega)\), une probabilité est déterminée par les \(P(\{\omega\})\), qui sont positifs et de somme 1 :
    <div class="formula" data-nom="Probabilité sur un univers dénombrable">$$P(A) = \sum_{\omega \in A} P(\{\omega\}).$$</div>
    Réciproquement, toute famille \((p_\omega)_{\omega \in \Omega}\) de réels positifs de somme 1 définit ainsi une probabilité (admis).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un événement est la réunion de ses singletons.</span>
    <div class="content"><p>\(A\) est la réunion au plus dénombrable de ses singletons, deux à deux disjoints : la σ-additivité donne la formule, et \(A = \Omega\) donne une somme égale à 1. La réciproque demande de sommer par paquets (admis).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — une probabilité sur \(\mathbb{N}^*\)</strong>
    <p>On pose \(P(\{n\}) = 1/2^n\) pour \(n \geq 1\) (c'est la loi du rang du premier pile avec une pièce équilibrée, §8).</p>
    <ol>
      <li>Série géométrique : \(\sum_{n \geq 1} 2^{-n} = \dfrac{1/2}{1 - 1/2} = 1\), donc on définit bien une probabilité.</li>
      <li>« \(n\) est pair » : \(\sum_{k \geq 1} \dfrac{1}{4^k} = \dfrac{1/4}{1 - 1/4} = \dfrac{1}{3}\).</li>
      <li>« \(n \geq 5\) » : \(\sum_{n \geq 5} \dfrac{1}{2^n} = \dfrac{1/32}{1 - 1/2} = \dfrac{1}{16}\).</li>
      <li>« \(n\) est multiple de 3 » : \(\sum_{k \geq 1} \dfrac{1}{8^k} = \dfrac{1}{7}\) ; de même, « multiple de 6 » a pour probabilité \(\dfrac{1}{63}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : « choisir un entier au hasard, de façon uniforme » n'a pas de sens. Si \(P(\{n\}) = c\) pour tout \(n\), la série \(\sum c\) vaut 0 (si \(c = 0\)) ou diverge (si \(c \gt 0\)) : elle ne vaut jamais 1. Sur un univers dénombrable, la probabilité n'est jamais uniforme ; l'équiprobabilité est réservée aux univers finis.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RÈGLES DE CALCUL</div>
  <h2>Les formules de première année restent vraies</h2>
  <div class="intro">Elles ne demandent que l'additivité finie : leurs énoncés et leurs démonstrations sont ceux de PTSI.</div>

  <div class="prop-box">
    <strong>Contraire, différence, croissance, réunion.</strong> Pour tous événements \(A\) et \(B\) :
    <ul>
      <li>\(P(\overline{A}) = 1 - P(A)\) ;</li>
      <li>\(P(B \setminus A) = P(B) - P(A \cap B)\), et si \(A \subset B\), \(P(B \setminus A) = P(B) - P(A)\) ;</li>
      <li><strong>croissance</strong> : si \(A \subset B\), alors \(P(A) \leq P(B)\) ;</li>
      <li>probabilité d'une réunion :</li>
    </ul>
    <div class="formula" data-nom="Probabilité d'une réunion">$$P(A \cup B) = P(A) + P(B) - P(A \cap B),$$</div>
    et par conséquent \(P(A \cup B) \leq P(A) + P(B)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Découper en morceaux disjoints.</span>
    <div class="content"><p>\(\Omega = A \cup \overline{A}\) (disjoints) donne \(1 = P(A) + P(\overline{A})\). \(B = (B \cap A) \cup (B \setminus A)\) (disjoints) donne \(P(B) = P(A \cap B) + P(B \setminus A)\) ; si \(A \subset B\), \(A \cap B = A\) et \(P(B \setminus A) \geq 0\) donne la croissance. Enfin \(A \cup B = A \cup (B \setminus A)\) (disjoints), d'où \(P(A \cup B) = P(A) + P(B) - P(A \cap B)\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — suite de l'exemple du §1</strong>
    <p>Sur \(\mathbb{N}^*\) muni de \(P(\{n\}) = 1/2^n\), soit \(A\) : « \(n\) pair » et \(B\) : « \(n\) multiple de 3 », de sorte que \(A \cap B\) : « \(n\) multiple de 6 ».</p>
    <ol>
      <li>\(P(A \cup B) = \dfrac{1}{3} + \dfrac{1}{7} - \dfrac{1}{63}\), soit \(\dfrac{21 + 9 - 1}{63} = \dfrac{29}{63}\).</li>
      <li>« \(n\) n'est ni pair ni multiple de 3 » : contraire de \(A \cup B\), de probabilité \(\dfrac{34}{63}\).</li>
      <li>« \(n\) pair mais pas multiple de 3 » : \(P(A \setminus B) = \dfrac{1}{3} - \dfrac{1}{63} = \dfrac{20}{63}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner les probabilités d'événements qui ne sont pas incompatibles. Pour trois événements ou plus, la formule générale (crible) est hors programme : le bon réflexe pour « au moins un » est de passer au contraire, « aucun », qui est une intersection.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CONTINUITÉ MONOTONE</div>
  <h2>Passer à la limite dans une probabilité</h2>
  <div class="intro">C'est la vraie nouveauté de deuxième année. Pour une suite monotone d'événements, la probabilité de la limite est la limite des probabilités. On calcule ainsi la probabilité d'un événement qui met en jeu une infinité d'épreuves comme limite de probabilités d'événements qui n'en mettent en jeu qu'un nombre fini.</div>

  <div class="prop-box">
    <strong>Continuité croissante.</strong> Si \((A_n)\) est une suite croissante d'événements (\(A_n \subset A_{n+1}\) pour tout \(n\)), alors
    <div class="formula" data-nom="Continuité croissante">$$P\Big(\bigcup_{n=0}^{+\infty} A_n\Big) = \lim_{n \to +\infty} P(A_n).$$</div>
    <strong>Continuité décroissante.</strong> Si \((A_n)\) est décroissante (\(A_{n+1} \subset A_n\) pour tout \(n\)), alors
    <div class="formula" data-nom="Continuité décroissante">$$P\Big(\bigcap_{n=0}^{+\infty} A_n\Big) = \lim_{n \to +\infty} P(A_n).$$</div>
  </div>

  <figcaption>Une suite croissante d'événements A₀ ⊂ A₁ ⊂ A₂ ⊂ … se découpe en « couronnes » disjointes Bₖ = Aₖ ∖ Aₖ₋₁. La réunion de tous les Aₙ est la réunion disjointe de A₀ et de toutes les couronnes : la σ-additivité appliquée aux couronnes donne la continuité croissante.</figcaption>
  </figure>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Découper en couronnes, puis passer au complémentaire.</span>
    <div class="content">
      <p><strong>Cas croissant.</strong> On pose \(B_0 = A_0\) et \(B_k = A_k \setminus A_{k-1}\) pour \(k \geq 1\). Ces couronnes sont deux à deux disjointes : pour \(j \lt k\), \(B_j \subset A_j \subset A_{k-1}\) alors que \(B_k\) ne rencontre pas \(A_{k-1}\). De plus \(B_0 \cup \cdots \cup B_n = A_n\), et la réunion de toutes les couronnes est celle de tous les \(A_n\). Par σ-additivité puis additivité finie :</p>
      <div class="formula">$$\begin{aligned} P\Big(\bigcup_{n} A_n\Big) &= \sum_{k=0}^{+\infty} P(B_k) \\ &= \lim_{n \to +\infty} \sum_{k=0}^{n} P(B_k) \\ &= \lim_{n \to +\infty} P(A_n). \end{aligned}$$</div>
      <p><strong>Cas décroissant.</strong> Les \(\overline{A_n}\) forment une suite croissante, de réunion \(\overline{\bigcap A_n}\) (De Morgan). Le cas croissant donne \(1 - P\left(\bigcap A_n\right) = \lim \big(1 - P(A_n)\big)\), d'où le résultat.</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Application à une suite quelconque.</strong> Pour toute suite \((A_k)\) d'événements, monotone ou non :
    <div class="formula" data-nom="Réunion dénombrable : limite des réunions finies">$$P\Big(\bigcup_{k=0}^{+\infty} A_k\Big) = \lim_{n \to +\infty} P\Big(\bigcup_{k=0}^{n} A_k\Big),$$</div>
    <div class="formula" data-nom="Intersection dénombrable : limite des intersections finies">$$P\Big(\bigcap_{k=0}^{+\infty} A_k\Big) = \lim_{n \to +\infty} P\Big(\bigcap_{k=0}^{n} A_k\Big).$$</div>
    En effet, les réunions partielles forment une suite croissante de réunion \(\bigcup_k A_k\), et les intersections partielles une suite décroissante d'intersection \(\bigcap_k A_k\).
  </div>

  <div class="method-box">
    <strong>Méthode — probabilité d'un événement qui porte sur une infinité d'épreuves</strong>
    <ol>
      <li>Écrire l'événement comme une réunion (« il existe ») ou une intersection (« pour tout ») d'événements qui ne portent que sur un nombre fini d'épreuves.</li>
      <li>Former la réunion ou l'intersection jusqu'au rang \(n\) : elle ne dépend que des \(n\) premières épreuves, et l'on sait calculer sa probabilité (contraire, indépendance, probabilités composées).</li>
      <li>Faire tendre \(n\) vers l'infini, en justifiant le passage à la limite par la continuité monotone.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — ne jamais obtenir pile</strong>
    <p>Une pièce donne pile avec la probabilité \(p \in \,]0, 1[\) ; les lancers sont indépendants (§7), donc la probabilité de \(n\) faces lors des \(n\) premiers lancers vaut \((1 - p)^n\). On note \(P_n\) : « pile au \(n\)-ième lancer » et \(F_n = \overline{P_n}\).</p>
    <ol>
      <li>« Jamais pile » s'écrit \(\bigcap_{n \geq 1} F_n\), intersection de la suite décroissante \(E_n = F_1 \cap \cdots \cap F_n\).</li>
      <li>\(P(E_n) = (1 - p)^n\), qui tend vers 0 puisque \(0 \lt 1 - p \lt 1\).</li>
      <li>Par continuité décroissante, \(P(\text{jamais pile}) = 0\), et pile finit par sortir presque sûrement : \(P\left(\bigcup_{n \geq 1} P_n\right) = 1\).</li>
      <li>De même, avec un dé, la probabilité d'au moins un 6 en \(n\) lancers, \(1 - (5/6)^n\), tend vers 1 : la variable \(T\) du chapitre précédent vérifie \(P(T = 0) = 0\).</li>
      <li>« Tous les lancers de rang pair donnent pile » : \(P\left(\bigcap_{k=1}^{n} P_{2k}\right) = p^n \to 0\), donc cet événement a une probabilité nulle.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(P\left(\bigcup A_n\right) = \lim P(A_n)\) pour une suite non monotone. Avec une pièce équilibrée et \(A_n = P_n\), on a \(P(A_n) = 1/2\) pour tout \(n\), alors que \(P\left(\bigcup A_n\right) = 1\) et \(P\left(\bigcap A_n\right) = 0\). Il faut passer par les réunions ou intersections <strong>partielles</strong>, qui sont monotones.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SOUS-ADDITIVITÉ ET ÉVÉNEMENTS NÉGLIGEABLES</div>
  <h2>Majorer, négliger, compléter presque</h2>
  <div class="intro">La sous-additivité majore la probabilité d'une réunion sans aucune hypothèse d'incompatibilité. Elle montre qu'une réunion dénombrable d'événements de probabilité nulle est encore de probabilité nulle, ce qui conduit aux notions d'événement négligeable, presque sûr, et de système quasi-complet.</div>

  <div class="prop-box">
    <strong>Sous-additivité.</strong> Pour toute suite \((A_n)\) d'événements,
    <div class="formula" data-nom="Sous-additivité">$$P\Big(\bigcup_{n=0}^{+\infty} A_n\Big) \leq \sum_{n=0}^{+\infty} P(A_n),$$</div>
    inégalité qui n'apprend rien si la série diverge (sa somme vaut alors \(+\infty\)). Version finie : \(P(A_0 \cup \cdots \cup A_n) \leq \sum_{k=0}^{n} P(A_k)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le cas fini, puis la continuité croissante.</span>
    <div class="content"><p>Le cas fini se démontre par récurrence à partir de \(P(A \cup B) \leq P(A) + P(B)\) (§2). Si la série converge, on a pour tout \(n\) : \(P\left(\bigcup_{k=0}^{n} A_k\right) \leq \sum_{k=0}^{n} P(A_k) \leq \sum_{k=0}^{+\infty} P(A_k)\). Le membre de gauche tend vers \(P\left(\bigcup_k A_k\right)\) par continuité croissante (§3) : on passe à la limite dans l'inégalité.</p></div>
  </div>

  <div class="def-box">
    Un événement \(A\) est <strong>négligeable</strong> si \(P(A) = 0\), <strong>presque sûr</strong> si \(P(A) = 1\). Une propriété vraie sur un événement presque sûr est dite vraie <strong>presque sûrement</strong> (p.s.). \(A\) est presque sûr si et seulement si \(\overline{A}\) est négligeable.
  </div>
  <div class="prop-box">
    <strong>Stabilité.</strong> Une réunion finie ou dénombrable d'événements négligeables est négligeable ; une intersection finie ou dénombrable d'événements presque sûrs est presque sûre. En effet \(0 \leq P\left(\bigcup A_n\right) \leq \sum P(A_n) = 0\), puis on passe aux contraires.
  </div>
  <p>Négligeable ne veut pas dire impossible : « jamais pile » est négligeable (§3) sans être vide, puisque la suite FFF… existe. De même, presque sûr ne veut pas dire certain.</p>

  <div class="method-box">
    <strong>Exemple — une infinité de piles, presque sûrement</strong>
    <p>Mêmes hypothèses qu'au §3 (\(0 \lt p \lt 1\), lancers indépendants).</p>
    <ol>
      <li>« Une infinité de piles » s'écrit \(G = \bigcap_{N \geq 1} \bigcup_{n \geq N} P_n\) ; son contraire est \(\overline{G} = \bigcup_{N \geq 1} H_N\), avec \(H_N = \bigcap_{n \geq N} F_n\) (« que des faces à partir du rang \(N\) »).</li>
      <li>Pour \(N\) fixé, \(P(F_N \cap \cdots \cap F_{N+m})\) vaut \((1 - p)^{m+1}\), qui tend vers 0 quand \(m \to +\infty\) : par continuité décroissante, \(H_N\) est négligeable.</li>
      <li>\(\overline{G}\) est une réunion dénombrable d'événements négligeables : il est négligeable, et \(P(G) = 1\).</li>
      <li>En échangeant les rôles, on obtient aussi une infinité de faces presque sûrement : l'intersection de ces deux événements presque sûrs est presque sûre.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — majorer sans connaître les dépendances</strong>
    <p>Un montage compte 40 composants ; chacun tombe en panne dans l'année avec une probabilité au plus égale à \(0{,}0005\), sans que l'on sache rien des liens entre les pannes.</p>
    <ol>
      <li>Sous-additivité : la probabilité d'au moins une panne est au plus \(40 \times 0{,}0005 = 0{,}02\), quelles que soient les dépendances.</li>
      <li>Pour des pannes indépendantes de probabilité exactement \(0{,}0005\), on trouverait \(1 - 0{,}9995^{40} \approx 0{,}0198\) : la majoration est presque exacte quand les probabilités sont petites.</li>
    </ol>
  </div>

  <h3>Système quasi-complet d'événements</h3>
  <div class="def-box">
    Une famille \((A_n)_{n \in I}\), \(I \subset \mathbb{N}\), d'événements deux à deux incompatibles est un <strong>système quasi-complet</strong> si \(\sum_{n \in I} P(A_n) = 1\), c'est-à-dire si leur réunion est presque sûre (sans être forcément égale à \(\Omega\)). Un système complet est quasi-complet.
  </div>
  <p>Exemple type : si \(T\) est le rang du premier pile, les événements \((T = n)\), \(n \geq 1\), sont deux à deux incompatibles et de probabilités de somme 1 (§8), mais leur réunion manque l'issue FFF… : ils forment un système quasi-complet, non complet. Plus généralement, retirer d'un système complet ses événements négligeables donne un système quasi-complet. On l'utilise exactement comme un système complet dans la formule des probabilités totales (§6).</p>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PROBABILITÉS CONDITIONNELLES</div>
  <h2>Mettre à jour une probabilité avec une information</h2>
  <div class="intro">La définition est celle de première année. Ce qui change : \(P_B\) est une probabilité au sens σ-additif, donc tous les résultats des §1 à §4 (continuité, sous-additivité…) s'appliquent aussi sous une condition.</div>

  <div class="def-box">
    Soit \(B\) un événement tel que \(P(B) \gt 0\). La <strong>probabilité conditionnelle</strong> de \(A\) sachant \(B\) est
    <div class="formula" data-nom="Probabilité conditionnelle">$$P(A \mid B) = P_B(A) = \frac{P(A \cap B)}{P(B)}.$$</div>
  </div>
  <div class="prop-box">
    <strong>\(P_B\) est une probabilité</strong> sur \((\Omega, \mathcal{A})\). En particulier \(P(\overline{A} \mid B) = 1 - P(A \mid B)\), et la continuité monotone vaut pour \(P_B\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Vérifier les deux axiomes.</span>
    <div class="content"><p>Par croissance, \(0 \leq P(A \cap B) \leq P(B)\), donc \(P_B(A) \in [0, 1]\), et \(P_B(\Omega) = P(B)/P(B) = 1\). Si les \(A_n\) sont deux à deux incompatibles, les \(A_n \cap B\) le sont aussi, et \(\left(\bigcup A_n\right) \cap B = \bigcup (A_n \cap B)\) ; la σ-additivité de \(P\), divisée par \(P(B)\), donne \(P_B\left(\bigcup A_n\right) = \sum P_B(A_n)\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Formule des probabilités composées.</strong> Si \(P(A_1 \cap \cdots \cap A_{n-1}) \gt 0\), alors
    <div class="formula" data-nom="Probabilités composées">$$\begin{aligned} &P(A_1 \cap \cdots \cap A_n) \\ &= P(A_1)\,P(A_2 \mid A_1) \times \cdots \\ &\quad \times P(A_n \mid A_1 \cap \cdots \cap A_{n-1}). \end{aligned}$$</div>
    Pour deux événements : \(P(A \cap B) = P(B)\,P(A \mid B)\) si \(P(B) \gt 0\). C'est la règle « on multiplie le long d'un chemin » des arbres pondérés.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un produit télescopique.</span>
    <div class="content"><p>Les événements \(A_1 \cap \cdots \cap A_k\), \(k \leq n - 1\), contiennent \(A_1 \cap \cdots \cap A_{n-1}\), donc ont une probabilité non nulle (croissance) : toutes les probabilités conditionnelles sont définies. En remplaçant chacune par sa définition, le produit se télescope :</p>
      <div class="formula">$$\begin{aligned} &P(A_1) \times \frac{P(A_1 \cap A_2)}{P(A_1)} \times \cdots \\ &\times \frac{P(A_1 \cap \cdots \cap A_n)}{P(A_1 \cap \cdots \cap A_{n-1})} \\ &= P(A_1 \cap \cdots \cap A_n). \end{aligned}$$</div></div>
  </div>

  <div class="method-box">
    <strong>Exemple — le trousseau de clés</strong>
    <p>Une seule des 5 clés d'un trousseau ouvre une porte. On les essaie au hasard, sans réessayer celles qui ont échoué ; \(E_k\) : « le \(k\)-ième essai échoue ».</p>
    <ol>
      <li>« La porte s'ouvre au 3ᵉ essai » est \(E_1 \cap E_2 \cap \overline{E_3}\) ; il reste 5, puis 4, puis 3 clés, d'où la probabilité \(P(E_1)\,P(E_2 \mid E_1)\,P(\overline{E_3} \mid E_1 \cap E_2)\), soit \(\dfrac{4}{5} \times \dfrac{3}{4} \times \dfrac{1}{3} = \dfrac{1}{5}\).</li>
      <li>Le même télescopage donne \(1/5\) pour chaque rang de 1 à 5 : le rang de la bonne clé est uniforme.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — des chances qui s'amenuisent trop vite</strong>
    <p>Un joueur répète une tentative ; sachant que les \(k - 1\) premières ont échoué, la \(k\)-ième réussit avec la probabilité \(1/(k+1)^2\). On note \(E_k\) : « la \(k\)-ième tentative échoue ».</p>
    <ol>
      <li>Probabilités composées : la probabilité \(p_n\) d'échouer aux \(n\) premières tentatives, \(p_n = P(E_1 \cap \cdots \cap E_n)\), vaut
        <div class="formula">$$p_n = \prod_{k=1}^{n} \left(1 - \frac{1}{(k+1)^2}\right).$$</div></li>
      <li>Chaque facteur vaut \(\dfrac{k(k+2)}{(k+1)^2}\) ; le produit se télescope :
        <div class="formula">$$\begin{aligned} p_n &= \prod_{k=1}^{n} \frac{k}{k+1} \times \prod_{k=1}^{n} \frac{k+2}{k+1} \\ &= \frac{1}{n+1} \times \frac{n+2}{2} \\ &= \frac{n+2}{2(n+1)}. \end{aligned}$$</div></li>
      <li>Les \(E_1 \cap \cdots \cap E_n\) décroissent : par continuité décroissante, le joueur n'aboutit jamais avec la probabilité \(\lim p_n = \dfrac{1}{2}\).</li>
      <li>Contraste avec le §3 : avec une probabilité de succès constante \(p \gt 0\), l'échec perpétuel est négligeable ; ici, les chances décroissent si vite qu'il a lieu une fois sur deux.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(P(A \mid B)\) et \(P(B \mid A)\). « 95 % des malades ont un test positif » ne dit pas que 95 % des tests positifs signalent un malade (§6). Autres pièges : écrire \(P(A \mid B)\) quand \(P(B) = 0\), ou confondre \(P(A \mid B)\) avec \(P(A \cap B)\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · PROBABILITÉS TOTALES ET FORMULE DE BAYES</div>
  <h2>Raisonner par cas, remonter aux causes</h2>
  <div class="intro">On découpe l'univers selon un système complet (les « cas ») et l'on additionne : ce sont les probabilités totales. On inverse ensuite le conditionnement : c'est la formule de Bayes. Nouveauté de deuxième année : le système peut être dénombrable, ou seulement quasi-complet.</div>

  <div class="prop-box">
    <strong>Formule des probabilités totales.</strong> Si \((A_n)_{n \in I}\) est un système complet ou quasi-complet d'événements, alors pour tout événement \(B\) :
    <div class="formula" data-nom="Probabilités totales">$$\begin{aligned} P(B) &= \sum_{n \in I} P(B \cap A_n) \\ &= \sum_{n \in I} P(B \mid A_n)\,P(A_n), \end{aligned}$$</div>
    avec la convention \(P(B \mid A_n)\,P(A_n) = 0\) lorsque \(P(A_n) = 0\). Cas d'un système \((A, \overline{A})\) :
    <div class="formula" data-nom="Probabilités totales (deux cas)">$$\begin{aligned} P(B) = {} &P(B \mid A)\,P(A) \\ &+ P(B \mid \overline{A})\,P(\overline{A}). \end{aligned}$$</div>
  </div>

  </figure>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">σ-additivité sur les morceaux de \(B\).</span>
    <div class="content">
      <p><strong>Système complet.</strong> \(B = B \cap \Omega = \bigcup_n (B \cap A_n)\), réunion d'événements deux à deux incompatibles : la σ-additivité donne la première égalité. Si \(P(A_n) \gt 0\), \(P(B \cap A_n) = P(B \mid A_n)P(A_n)\) ; si \(P(A_n) = 0\), \(P(B \cap A_n) \leq P(A_n) = 0\), ce qui justifie la convention.</p>
      <p><strong>Système quasi-complet.</strong> Soit \(C\) le complémentaire de \(\bigcup A_n\) : \(P(C) = 1 - \sum P(A_n) = 0\). Les \(A_n\) et \(C\) forment un système complet, et \(P(B \cap C) \leq P(C) = 0\) : le terme ajouté est nul.</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Formule de Bayes.</strong> Si \(P(A) \gt 0\) et \(P(B) \gt 0\) :
    <div class="formula" data-nom="Formule de Bayes">$$P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}.$$</div>
    Avec un système complet ou quasi-complet \((A_n)\), si \(P(B) \gt 0\), pour tout \(k\) tel que \(P(A_k) \gt 0\) :
    <div class="formula" data-nom="Formule de Bayes (système complet)">$$P(A_k \mid B) = \frac{P(B \mid A_k)\,P(A_k)}{\displaystyle\sum_{n} P(B \mid A_n)\,P(A_n)}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Écrire \(P(A_k \cap B)\) de deux façons.</span>
    <div class="content"><p>Par définition, \(P(A_k \cap B)\) vaut à la fois \(P(A_k \mid B)\,P(B)\) et \(P(B \mid A_k)\,P(A_k)\). On divise par \(P(B) \gt 0\), puis on développe \(P(B)\) par la formule des probabilités totales.</p></div>
  </div>
  <p>Lecture : les \(A_n\) sont des <strong>causes</strong> possibles, de probabilités connues <em>a priori</em> ; \(B\) est une <strong>conséquence observée</strong>, dont on connaît la probabilité sous chaque cause. La formule de Bayes donne la probabilité <em>a posteriori</em> de chaque cause une fois \(B\) observé.</p>

  <div class="method-box">
    <strong>Exemple — un test de dépistage</strong>
    <p>Une maladie touche 1 % d'une population. Un test est positif chez 95 % des malades et chez 2 % des personnes saines. On note \(M\) : « la personne est malade » et \(T\) : « le test est positif ».</p>
    <ol>
      <li>Données : \(P(M) = 0{,}01\), \(P(T \mid M) = 0{,}95\), \(P(T \mid \overline{M}) = 0{,}02\).</li>
      <li>Probabilités totales avec \((M, \overline{M})\) : \(P(T) = 0{,}95 \times 0{,}01\) \(+\ 0{,}02 \times 0{,}99\), soit \(P(T) = 0{,}0095 + 0{,}0198 = 0{,}0293\).</li>
      <li>Bayes : \(P(M \mid T) = \dfrac{0{,}0095}{0{,}0293} \approx 0{,}32\). Un test positif ne signale un malade qu'une fois sur trois environ.</li>
      <li>Explication : la maladie est rare, et les faux positifs (\(0{,}0198\)) sont deux fois plus nombreux que les vrais (\(0{,}0095\)).</li>
      <li>Un test négatif rassure en revanche : \(P(\overline{M} \mid \overline{T}) = \dfrac{0{,}98 \times 0{,}99}{1 - 0{,}0293} \approx 0{,}9995\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — un système complet dénombrable</strong>
    <p>On tire un entier \(N \geq 1\) avec \(P(N = n) = 1/2^n\), puis on lance \(N\) pièces équilibrées. \(B\) : « les \(N\) pièces donnent toutes pile ».</p>
    <ol>
      <li>Les \((N = n)\), \(n \geq 1\), forment un système complet dénombrable (\(N\) prend ses valeurs dans \(\mathbb{N}^*\)), et \(P(B \mid N = n) = 1/2^n\).</li>
      <li>Probabilités totales : \(P(B) = \sum_{n \geq 1} \dfrac{1}{2^n} \times \dfrac{1}{2^n}\), soit \(\sum_{n \geq 1} \dfrac{1}{4^n} = \dfrac{1}{3}\).</li>
      <li>Bayes : \(P(N = n \mid B) = \dfrac{1/4^n}{1/3} = \dfrac{3}{4^n}\) ; en particulier \(P(N = 1 \mid B) = 3/4\).</li>
      <li>Contrôle : \(\sum_{n \geq 1} 3/4^n = 1\), comme il se doit pour la probabilité \(P_B\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les probabilités totales avec des cas qui se chevauchent ou qui oublient une situation de probabilité non nulle (la famille doit être un système complet ou quasi-complet) ; ou confondre \(P(T \mid M)\), la sensibilité du test, avec \(P(M \mid T)\), la probabilité d'être malade quand le test est positif.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · INDÉPENDANCE D'ÉVÉNEMENTS</div>
  <h2>Quand une information n'apprend rien</h2>
  <div class="intro">L'indépendance est ce qui fait apparaître des produits dans les calculs. Elle dépend de la probabilité \(P\), et non des seuls ensembles : c'est ce qui la distingue radicalement de l'incompatibilité.</div>

  <div class="def-box">
    Deux événements \(A\) et \(B\) sont <strong>indépendants</strong> si \(P(A \cap B) = P(A)\,P(B)\). Si \(P(B) \gt 0\), cela équivaut à \(P(A \mid B) = P(A)\) : savoir que \(B\) est réalisé ne change pas la probabilité de \(A\).
  </div>
  <div class="prop-box">
    <strong>Passage aux contraires.</strong> Si \(A\) et \(B\) sont indépendants, alors \(A\) et \(\overline{B}\), \(\overline{A}\) et \(B\), \(\overline{A}\) et \(\overline{B}\) le sont aussi.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une soustraction.</span>
    <div class="content"><p>Comme \(A\) est la réunion disjointe de \(A \cap B\) et \(A \cap \overline{B}\) :</p>
      <div class="formula">$$\begin{aligned} &P(A \cap \overline{B}) = P(A) - P(A)P(B) \\ &= P(A)\big(1 - P(B)\big) = P(A)P(\overline{B}). \end{aligned}$$</div><p>Les autres cas s'en déduisent en échangeant les rôles de \(A\) et \(B\), puis en appliquant deux fois le résultat.</p></div>
  </div>
  <p>Un événement de probabilité 0 ou 1 est indépendant de tout événement ; un événement est indépendant de lui-même si et seulement si sa probabilité vaut 0 ou 1.</p>

  <h3>Incompatibles n'est pas indépendants</h3>
  <p>Si \(A\) et \(B\) sont incompatibles et de probabilités non nulles, \(P(A \cap B) = 0 \neq P(A)P(B)\) : ils ne sont <strong>pas</strong> indépendants, car savoir que \(B\) est réalisé apprend que \(A\) ne l'est pas. Avec un dé équilibré, \(A = \{1, 2\}\) et \(B = \{3, 4\}\) sont incompatibles et dépendants, tandis que \(A\) et \(C = \{2, 4, 6\}\) sont indépendants (\(P(A \cap C) = 1/6 = 1/3 \times 1/2\)) bien qu'ils aient l'issue 2 en commun.</p>

  <h3>Famille finie d'événements</h3>
  <div class="def-box">
    Des événements \(A_1, \ldots, A_n\) sont <strong>indépendants</strong> (on dit aussi mutuellement indépendants) si, pour toute partie \(J\) de \(\{1, \ldots, n\}\) non vide,
    <div class="formula" data-nom="Indépendance mutuelle">$$P\Big(\bigcap_{j \in J} A_j\Big) = \prod_{j \in J} P(A_j).$$</div>
    Ils sont <strong>deux à deux indépendants</strong> si cette égalité n'est demandée que pour les parties \(J\) à deux éléments. Une suite \((A_n)\) est une suite d'événements indépendants si toute sous-famille finie est formée d'événements indépendants (cadre du pile ou face infini).
  </div>
  <div class="prop-box">
    <strong>Passage aux contraires (\(n\) événements).</strong> Si \(A_1, \ldots, A_n\) sont indépendants, on obtient encore des événements indépendants en remplaçant certains \(A_i\) par leur contraire. En particulier :
    <div class="formula" data-nom="Au moins un parmi n événements indépendants">$$\begin{aligned} &P(A_1 \cup \cdots \cup A_n) \\ &= 1 - \prod_{i=1}^{n} \big(1 - P(A_i)\big). \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Remplacer un seul événement, puis itérer.</span>
    <div class="content"><p>Il suffit de remplacer \(A_1\) par \(\overline{A_1}\) (puis de recommencer, quitte à renuméroter). Pour \(J\) ne contenant pas 1, rien ne change. Pour \(J = \{1\} \cup K\) avec \(K \subset \{2, \ldots, n\}\), en notant \(C = \bigcap_{k \in K} A_k\) (\(C = \Omega\) si \(K\) est vide) :</p>
      <div class="formula">$$\begin{aligned} &P(\overline{A_1} \cap C) = P(C) - P(A_1 \cap C) \\ &= \big(1 - P(A_1)\big) \prod_{k \in K} P(A_k). \end{aligned}$$</div>
      <p>Enfin \(A_1 \cup \cdots \cup A_n\) est le contraire de \(\overline{A_1} \cap \cdots \cap \overline{A_n}\), dont la probabilité est \(\prod (1 - P(A_i))\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — deux à deux ne suffit pas</strong>
    <p>On lance deux pièces équilibrées (4 issues équiprobables). \(A\) : « la première donne pile », \(B\) : « la seconde donne pile », \(C\) : « les deux pièces donnent le même côté ».</p>
    <ol>
      <li>\(P(A) = P(B) = 1/2\), et \(C = \{\mathrm{PP}, \mathrm{FF}\}\) donne \(P(C) = 1/2\).</li>
      <li>\(A \cap B\), \(A \cap C\) et \(B \cap C\) valent tous \(\{\mathrm{PP}\}\), de probabilité \(1/4 = 1/2 \times 1/2\) : les trois événements sont deux à deux indépendants.</li>
      <li>Mais \(A \cap B \cap C = \{\mathrm{PP}\}\) a pour probabilité \(1/4 \neq 1/8\) : ils ne sont pas indépendants.</li>
      <li>Lecture : chacun de \(A\) et \(B\) seul ne dit rien sur \(C\), mais les deux ensemble le déterminent complètement.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — fiabilité d'un montage</strong>
    <p>Trois composants fonctionnent indépendamment, chacun avec la probabilité \(0{,}9\). Le composant \(A\) est monté en série avec un bloc formé de \(B\) et \(C\) en parallèle : le montage fonctionne si \(A\) fonctionne et si l'un au moins de \(B\), \(C\) fonctionne.</p>
    <ol>
      <li>Bloc parallèle : \(P(B \cup C) = 1 - P(\overline{B})P(\overline{C})\), soit \(1 - 0{,}1^2 = 0{,}99\).</li>
      <li>Montage : on retire de \(A\) le cas où \(B\) et \(C\) sont en panne,
        <div class="formula">$$\begin{aligned} &P\big(A \cap (B \cup C)\big) \\ &= P(A) - P(A \cap \overline{B} \cap \overline{C}) \\ &= 0{,}9 - 0{,}9 \times 0{,}01 = 0{,}891. \end{aligned}$$</div></li>
      <li>À comparer avec trois composants en série : \(0{,}9^3 = 0{,}729\). La redondance améliore nettement la fiabilité.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) prendre « incompatibles » pour « indépendants » ; (2) conclure à l'indépendance d'une famille à partir de l'indépendance deux à deux ; (3) oublier que l'indépendance dépend de \(P\) ; (4) croire qu'après cinq faces de suite, pile devient « plus probable » : avec des lancers indépendants, il garde la probabilité \(p\), le hasard ne compense rien.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DEUX EXEMPLES DE SYNTHÈSE</div>
  <h2>Le premier pile et l'urne de Pólya</h2>
  <div class="intro">Deux situations classiques qui mobilisent tous les outils du chapitre : indépendance, système quasi-complet, continuité, probabilités composées et totales, Bayes.</div>

  <div class="method-box">
    <strong>Exemple — le rang du premier pile</strong>
    <p>Une pièce donne pile avec la probabilité \(p \in \,]0, 1[\), les lancers sont indépendants, et \(q = 1 - p\). \(T\) est le rang du premier pile (\(T = 0\) s'il ne sort jamais).</p>
    <ol>
      <li>Pour \(n \geq 1\), \((T = n) = F_1 \cap \cdots \cap F_{n-1} \cap P_n\), d'où par indépendance \(P(T = n) = q^{n-1}p\) (loi géométrique, chapitre suivant).</li>
      <li>\(\sum_{n \geq 1} q^{n-1}p = \dfrac{p}{1 - q} = 1\) : les \((T = n)\), \(n \geq 1\), forment un système quasi-complet, et \(P(T = 0) = 0\), comme au §3.</li>
      <li>« Aucun pile lors des \(n\) premiers lancers » a pour probabilité \(q^n\).</li>
      <li>« Le premier pile sort à un rang pair » (réunion d'événements incompatibles) :
        <div class="formula">$$\sum_{k \geq 1} q^{2k-1}p = \frac{pq}{1 - q^2} = \frac{q}{1 + q}.$$</div>
        Pour une pièce équilibrée, cela vaut \(1/3\) : le premier pile sort plus souvent à un rang impair, car le rang 1 pèse lourd.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — l'urne de Pólya</strong>
    <p>Une urne contient une boule blanche et une noire. À chaque tirage, on note la couleur, on remet la boule et on ajoute une boule de la même couleur. \(W_k\) : « le \(k\)-ième tirage donne une blanche ».</p>
    <ol>
      <li>\(P(W_1) = 1/2\) ; probabilités totales avec \((W_1, \overline{W_1})\) : \(P(W_2) = \dfrac{2}{3} \times \dfrac{1}{2} + \dfrac{1}{3} \times \dfrac{1}{2} = \dfrac{1}{2}\).</li>
      <li>\(P(W_1 \cap W_2) = \dfrac{1}{2} \times \dfrac{2}{3} = \dfrac{1}{3} \neq \dfrac{1}{4}\) : \(W_1\) et \(W_2\) ne sont pas indépendants (une blanche rend la suivante plus probable).</li>
      <li>Bayes : \(P(W_1 \mid W_2) = \dfrac{1/3}{1/2} = \dfrac{2}{3}\). Savoir que le 2ᵉ tirage est blanc renseigne sur le 1ᵉʳ : le conditionnement n'a pas de sens chronologique.</li>
      <li>Probabilités composées : \(P(W_1 \cap \cdots \cap W_n)\) vaut \(\dfrac{1}{2} \times \dfrac{2}{3} \times \cdots \times \dfrac{n}{n+1}\), soit \(\dfrac{1}{n+1}\), qui tend vers 0 : par continuité décroissante, ne tirer que des blanches est négligeable.</li>
      <li>Plus généralement, une suite de \(n\) tirages comptant \(k\) blanches a pour probabilité \(\dfrac{k!\,(n-k)!}{(n+1)!}\) (aux numérateurs, \(1, \ldots, k\) pour les blanches et \(1, \ldots, n-k\) pour les noires ; aux dénominateurs, \(2, \ldots, n+1\)). Avec \(\binom{n}{k}\) telles suites, le nombre \(K_n\) de blanches vérifie \(P(K_n = k) = \dfrac{1}{n+1}\) : il est uniforme sur \(\{0, \ldots, n\}\).</li>
      <li>Probabilités totales avec le système complet \((K_n = k)_{0 \leq k \leq n}\), sachant qu'il y a alors \(k + 1\) blanches sur \(n + 2\) boules :
        <div class="formula">$$\begin{aligned} P(W_{n+1}) &= \sum_{k=0}^{n} \frac{1}{n+1} \cdot \frac{k+1}{n+2} \\ &= \frac{1}{2}. \end{aligned}$$</div>
        Chaque tirage donne une blanche avec la probabilité \(1/2\), bien que les tirages soient dépendants.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Quelques prolongements</h2>
  <ul>
    <li><strong>Formule du crible</strong> (Poincaré), ici pour trois événements, et sa généralisation à \(n\) événements (sommes alternées sur les intersections) :
      <div class="formula">$$\begin{aligned} &P(A \cup B \cup C) \\ &= P(A) + P(B) + P(C) \\ &- P(A \cap B) - P(A \cap C) - P(B \cap C) \\ &+ P(A \cap B \cap C). \end{aligned}$$</div></li>
    <li><strong>Lemme de Borel-Cantelli</strong> : si \(\sum P(A_n)\) converge, alors presque sûrement seul un nombre fini de \(A_n\) se réalisent. Preuve : \(P\left(\bigcup_{n \geq N} A_n\right) \leq \sum_{n \geq N} P(A_n)\), reste d'une série convergente, puis continuité décroissante. Si les \(A_n\) sont indépendants et que la série diverge, une infinité d'entre eux se réalisent presque sûrement (cela généralise l'exemple du §4).</li>
    <li><strong>Construction des probabilités</strong> : l'existence d'une probabilité sur la tribu du pile ou face infini, ou d'une probabilité « uniforme » sur \([0, 1]\), relève de la théorie de la mesure ; les variables à densité sont hors programme.</li>
  </ul>
</div>
