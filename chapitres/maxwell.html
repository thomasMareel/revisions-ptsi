<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Pourquoi un conducteur est-il neutre ?</h3>
  <div class="statement">Un milieu ohmique homogène, de conductivité \(\sigma\) réelle, contient à \(t=0\) une charge volumique \(\rho_0(M)\), apportée par exemple par un faisceau d'électrons. Pour simplifier, on attribue au milieu la permittivité du vide \(\varepsilon_0\).</div>
  <div class="q"><strong>Q1.</strong> Combiner la conservation de la charge, la loi d'Ohm locale et l'équation de Maxwell-Gauss pour obtenir l'équation vérifiée par \(\rho(M,t)\).</div>
  <div class="q"><strong>Q2.</strong> La résoudre en faisant apparaître un temps caractéristique \(\tau_r\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\tau_r\) pour le cuivre (\(\sigma=5{,}9\times10^{7}\ \text{S·m}^{-1}\)), l'eau de mer (\(\sigma=4{,}8\ \text{S·m}^{-1}\)) et un verre (\(\sigma\approx1\times10^{-11}\ \text{S·m}^{-1}\)). Conclure.</div>
  <div class="q"><strong>Q4.</strong> Pour le cuivre, comparer \(\tau_r\) au temps de collision \(\tau\approx2{,}5\times10^{-14}\ \text{s}\) du modèle de Drude. Que penser du résultat de Q2 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{\partial\rho}{\partial t}+\operatorname{div}(\sigma\vec E)=0\), et \(\sigma\) est uniforme, donc \(\dfrac{\partial\rho}{\partial t}+\sigma\operatorname{div}\vec E=0\). Avec (MG), \(\operatorname{div}\vec E=\rho/\varepsilon_0\) :</p>
    <div class="formula">$$\frac{\partial\rho}{\partial t}+\frac{\sigma}{\varepsilon_0}\,\rho=0$$</div>
    <p><strong>Q2.</strong> En chaque point, équation du premier ordre : \(\rho(M,t)=\rho_0(M)\,e^{-t/\tau_r}\) avec \(\tau_r=\varepsilon_0/\sigma\). La charge en excès ne se « déplace » pas vers un autre point du volume : elle disparaît partout à la fois, en migrant vers la surface.</p>
    <p><strong>Q3.</strong> Cuivre : \(\tau_r\approx1{,}5\times10^{-19}\ \text{s}\). Eau de mer : \(\approx1{,}8\times10^{-12}\ \text{s}\) (encore \(\approx10^{-10}\ \text{s}\) en tenant compte de sa permittivité relative voisine de 80). Verre : \(\approx0{,}9\ \text{s}\), et quelques secondes avec sa permittivité réelle. Dans un bon conducteur, \(\rho=0\) en volume à toute échelle de temps utile ; un isolant, au contraire, peut garder longtemps une charge (électrisation par frottement).</p>
    <p><strong>Q4.</strong> \(\tau_r\ll\tau\) : or la loi d'Ohm \(\vec j=\sigma\vec E\) suppose des variations lentes devant \(\tau\). Elle ne s'applique donc pas à l'échelle de \(10^{-19}\ \text{s}\), et le résultat de Q2 n'est qu'indicatif. En gardant le terme d'inertie du modèle de Drude, on obtient \(\ddot\rho+\dot\rho/\tau+\omega_p^2\rho=0\) avec \(\omega_p=\sqrt{ne^2/(m\varepsilon_0)}\approx1{,}6\times10^{16}\ \text{rad·s}^{-1}\) : des oscillations amorties en \(2\tau\approx5\times10^{-14}\ \text{s}\). La conclusion physique est inchangée : la neutralité est instantanée à l'échelle de l'électrocinétique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Bilan de charge dans un faisceau d'ions</h3>
  <div class="statement">Dans un accélérateur, un faisceau d'ions positifs se déplace le long de l'axe \(Ox\) d'un tube de section \(S=1{,}0\ \text{cm}^2\). On décrit le faisceau par sa densité volumique de charge \(\rho(x,t)\) et sa densité de courant \(\vec j=j(x,t)\,\vec e_x\), uniformes sur une section.</div>
  <div class="q"><strong>Q1.</strong> Par un bilan de charge sur la tranche comprise entre \(x\) et \(x+\mathrm dx\), pendant \(\mathrm dt\), établir l'équation locale de conservation de la charge.</div>
  <div class="q"><strong>Q2.</strong> Un paquet d'ions se translate sans se déformer à la vitesse \(v\) constante : \(\rho(x,t)=\rho_m\,e^{-(x-vt)^2/a^2}\) et \(j=\rho v\). Vérifier que la charge est conservée.</div>
  <div class="q"><strong>Q3.</strong> En régime stationnaire, le faisceau transporte \(I=2{,}0\ \text{mA}\). Montrer que \(j\) ne dépend pas de \(x\). Les ions ont la vitesse \(v_1=2{,}0\times10^{5}\ \text{m·s}^{-1}\) à l'entrée d'une zone de freinage, et \(v_2=5{,}0\times10^{4}\ \text{m·s}^{-1}\) à sa sortie. Calculer \(\rho\) aux deux endroits et interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Charge de la tranche : \(\rho(x,t)\,S\,\mathrm dx\). Sa variation pendant \(\mathrm dt\) vaut \(\dfrac{\partial\rho}{\partial t}\,S\,\mathrm dx\,\mathrm dt\). Elle est due uniquement aux échanges par les deux faces (la charge ne se crée pas) : il entre \(j(x,t)\,S\,\mathrm dt\) en \(x\) et il sort \(j(x+\mathrm dx,t)\,S\,\mathrm dt\) en \(x+\mathrm dx\), soit un apport net \(-\dfrac{\partial j}{\partial x}\,\mathrm dx\,S\,\mathrm dt\). En égalant et en simplifiant par \(S\,\mathrm dx\,\mathrm dt\) :</p>
    <div class="formula">$$\frac{\partial\rho}{\partial t}+\frac{\partial j}{\partial x}=0$$</div>
    <p><strong>Q2.</strong> Posons \(g(s)=\rho_m e^{-s^2/a^2}\) et \(s=x-vt\). Alors \(\partial_t\rho=-v\,g'(s)\) et \(\partial_x j=v\,\partial_x\rho=v\,g'(s)\) : la somme est nulle. Tout profil qui se translate en bloc avec \(j=\rho v\) conserve la charge : ce qui quitte une tranche arrive dans la suivante.</p>
    <p><strong>Q3.</strong> En régime stationnaire \(\partial_t\rho=0\), donc \(\partial_xj=0\) : \(j=I/S=20\ \text{A·m}^{-2}\) partout (même intensité à travers toutes les sections). Avec \(j=\rho v\) : \(\rho_1=j/v_1=1{,}0\times10^{-4}\ \text{C·m}^{-3}\) et \(\rho_2=j/v_2=4{,}0\times10^{-4}\ \text{C·m}^{-3}\). Là où les ions ralentissent, ils se resserrent (comme les voitures à l'approche d'un bouchon) : à débit de charge fixé, la densité varie comme \(1/v\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>L'ARQS est-elle justifiée ?</h3>
  <div class="statement">On juge l'ARQS acceptable lorsque le déphasage dû à la propagation d'une extrémité à l'autre du dispositif, \(\Delta\varphi=2\pi L/\lambda\), reste inférieur à 0,05 rad (3° environ). Ici \(\lambda=v/f\), où \(f\) est la fréquence la plus élevée du signal et \(v\) sa vitesse de propagation dans le support.</div>
  <div class="q"><strong>Q1.</strong> Conclure dans chacun des cas suivants : (a) montage de TP comportant 1,5 m de fils, alimenté par un générateur à 200 kHz (\(v=c\)) ; (b) enceinte reliée à un amplificateur par 8 m de câble, signal audio jusqu'à 20 kHz (\(v=2c/3\)) ; (c) liaison sous-marine en courant alternatif de 120 km, à 50 Hz (\(v=c/2\)) ; (d) piste de 4 cm sur la carte d'un téléphone, signal à 2,4 GHz (\(v=c/2\)).</div>
  <div class="q"><strong>Q2.</strong> Dans les fils de cuivre du cas (a) (\(\sigma=6\times10^{7}\ \text{S·m}^{-1}\)), comparer le courant de déplacement et le courant de conduction. Quelle forme de l'ARQS s'applique ?</div>
  <div class="q"><strong>Q3.</strong> Un signal numérique a des fronts de durée \(t_m=1{,}0\ \text{ns}\) ; on admet que sa fréquence significative la plus haute est \(f_{max}\approx0{,}35/t_m\). Quelle longueur maximale de piste (\(v=c/2\)) respecte la règle empirique, plus tolérante, des électroniciens : \(L\le\lambda/10\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) \(\lambda=3\times10^8/2\times10^5=1\,500\ \text{m}\), \(\Delta\varphi=2\pi\times10^{-3}\approx6\times10^{-3}\ \text{rad}\) : ARQS valable. (b) \(\lambda=2\times10^8/2\times10^4=10\ \text{km}\), \(\Delta\varphi=2\pi\times8\times10^{-4}\approx5\times10^{-3}\ \text{rad}\) : valable. (c) \(\lambda=1{,}5\times10^8/50=3\,000\ \text{km}\), \(\Delta\varphi=2\pi\times0{,}04\approx0{,}25\ \text{rad}\approx14°\) : seuil nettement dépassé, il faut un modèle de ligne même à 50 Hz. (d) \(\lambda=1{,}5\times10^8/2{,}4\times10^9\approx6{,}3\ \text{cm}\), \(L/\lambda\approx0{,}64\) et \(\Delta\varphi\approx4\ \text{rad}\) : l'ARQS est totalement exclue, la piste doit être conçue comme une ligne de transmission.</p>
    <p><strong>Q2.</strong> \(|\vec j_D|/|\vec j|=\varepsilon_0\omega/\sigma\approx2\times10^{-13}\). Le courant de déplacement est négligeable dans les conducteurs : c'est l'ARQS magnétique.</p>
    <p><strong>Q3.</strong> \(f_{max}=0{,}35/10^{-9}=3{,}5\times10^{8}\ \text{Hz}\), \(\lambda=1{,}5\times10^{8}/3{,}5\times10^{8}\approx0{,}43\ \text{m}\), d'où \(L\le4{,}3\ \text{cm}\). C'est la durée des fronts, et non la fréquence d'horloge, qui fixe la limite.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ☆ ☆</span>
  <h3>Courants surfaciques : solénoïde et câble coaxial</h3>
  <div class="statement">On rappelle les relations de passage, du milieu 1 vers le milieu 2 (normale \(\vec n_{12}\)) : \(\vec E_2-\vec E_1=\dfrac{\sigma}{\varepsilon_0}\,\vec n_{12}\) et \(\vec B_2-\vec B_1=\mu_0\,\vec j_s\wedge\vec n_{12}\), où \(\sigma\) est la charge surfacique et \(\vec j_s\) le courant surfacique. Coordonnées cylindriques d'axe \(Oz\), base \((\vec e_r,\vec e_\theta,\vec e_z)\) directe.<br>
  (a) Un solénoïde long de rayon \(a\), à \(n\) spires par mètre parcourues par \(i\), crée \(\vec B=\mu_0 n i\,\vec e_z\) à l'intérieur et un champ nul à l'extérieur ; ses spires jointives forment une nappe cylindrique de courant surfacique \(\vec j_s=n i\,\vec e_\theta\).<br>
  (b) Un câble coaxial a une âme de rayon \(a\) (charge linéique \(\lambda\), courant \(i\) selon \(\vec e_z\)) et une gaine mince de rayon \(b\) qui porte \(-\lambda\) et le courant de retour. Entre les conducteurs, \(\vec E=\dfrac{\lambda}{2\pi\varepsilon_0r}\,\vec e_r\) et \(\vec B=\dfrac{\mu_0 i}{2\pi r}\,\vec e_\theta\) ; à l'extérieur, les champs sont nuls.</div>
  <div class="q"><strong>Q1.</strong> Vérifier la relation de passage de \(\vec B\) à la traversée de l'enroulement du solénoïde. Application : \(n=2\,000\ \text{m}^{-1}\), \(i=3{,}0\ \text{A}\) ; calculer \(j_s\) et \(B\).</div>
  <div class="q"><strong>Q2.</strong> Exprimer le courant surfacique \(\vec j_s\) de la gaine du câble. Vérifier la relation de passage de \(\vec B\) en \(r=b\).</div>
  <div class="q"><strong>Q3.</strong> À l'aide de la relation de passage de \(\vec E\) en \(r=b\), retrouver la charge surfacique de la gaine. Application : \(\lambda=1{,}0\ \text{nC·m}^{-1}\), \(b=2{,}0\ \text{mm}\) ; calculer \(\sigma\) et le champ électrique juste à l'intérieur de la gaine.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Milieu 1 : l'intérieur, milieu 2 : l'extérieur, donc \(\vec n_{12}=\vec e_r\). D'une part \(\vec B_2-\vec B_1=-\mu_0 n i\,\vec e_z\). D'autre part \(\mu_0\,\vec j_s\wedge\vec e_r=\mu_0 n i\,(\vec e_\theta\wedge\vec e_r)\), soit \(-\mu_0 n i\,\vec e_z\), car \(\vec e_r\wedge\vec e_\theta=\vec e_z\). Les deux membres coïncident : la composante tangentielle de \(\vec B\) saute de \(\mu_0 j_s\). A.N. : \(j_s=ni=6{,}0\times10^{3}\ \text{A·m}^{-1}\) et \(B=\mu_0 j_s\approx7{,}5\ \text{mT}\).</p>
    <p><strong>Q2.</strong> La gaine porte le courant \(-i\) réparti sur son périmètre \(2\pi b\) : \(\vec j_s=-\dfrac{i}{2\pi b}\,\vec e_z\). En \(r=b\), avec \(\vec n_{12}=\vec e_r\) : \(\vec B_2-\vec B_1=\vec 0-\dfrac{\mu_0 i}{2\pi b}\,\vec e_\theta\), et \(\mu_0\,\vec j_s\wedge\vec e_r=-\dfrac{\mu_0 i}{2\pi b}\,(\vec e_z\wedge\vec e_r)\), soit \(-\dfrac{\mu_0 i}{2\pi b}\,\vec e_\theta\) (car \(\vec e_z\wedge\vec e_r=\vec e_\theta\)). La relation est vérifiée.</p>
    <p><strong>Q3.</strong> \(\vec E_2-\vec E_1=-\dfrac{\lambda}{2\pi\varepsilon_0 b}\,\vec e_r\) doit valoir \(\dfrac{\sigma}{\varepsilon_0}\,\vec e_r\), donc \(\sigma=-\dfrac{\lambda}{2\pi b}\) : c'est bien la charge \(-\lambda\) répartie sur le périmètre de la gaine. A.N. : \(\sigma\approx-8{,}0\times10^{-8}\ \text{C·m}^{-2}\) et \(E(b^-)=\dfrac{\lambda}{2\pi\varepsilon_0 b}\approx9{,}0\times10^{3}\ \text{V·m}^{-1}\). La composante normale de \(\vec E\) saute, la composante tangentielle de \(\vec B\) aussi : ce sont les deux discontinuités permises par les relations de passage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Ce champ est-il possible ?</h3>
  <div class="statement">Pour chaque proposition, on se place dans une région où les seules sources éventuelles sont celles que les équations de Maxwell imposent. \(E_0\), \(B_0\), \(a\), \(V_0\), \(d\), \(k\), \(\omega\) sont des constantes positives.</div>
  <div class="q"><strong>Q1.</strong> Dans une région vide de charges et de courants : \(\vec E=E_0\cos(\omega t-kx)\,\vec e_y\) et \(\vec B=B_0\cos(\omega t-kx)\,\vec e_z\). À quelles conditions sur \(B_0\) et \(\omega\) ces champs vérifient-ils les quatre équations de Maxwell ?</div>
  <div class="q"><strong>Q2.</strong> Un champ électrique indépendant du temps, \(\vec E=a\,(y\,\vec e_x-x\,\vec e_y)\), règne dans une région vide de charges et de courants. Est-ce un champ électrostatique ? Montrer qu'il est compatible avec les équations de Maxwell si un champ magnétique uniforme croît linéairement avec le temps ; préciser \(\mathrm dB/\mathrm dt\) pour \(a=5{,}0\ \text{V·m}^{-2}\). Où rencontre-t-on une telle situation ?</div>
  <div class="q"><strong>Q3.</strong> En régime statique, que vaut la densité de charge associée au potentiel \(V_1=V_0\,\dfrac{x^2+y^2-2z^2}{d^2}\) ? au potentiel \(V_2=V_0\,\dfrac{x^2}{d^2}\) ? Application pour \(V_2\) : \(V_0=100\ \text{V}\), \(d=1{,}0\ \text{cm}\).</div>
  <div class="q"><strong>Q4.</strong> En régime statique, \(\vec B=\dfrac{B_0}{a}\,(y\,\vec e_x-x\,\vec e_y)\) (ici \(a\) est une longueur). Quelle densité de courant faut-il ? Application : \(B_0=1{,}0\ \text{mT}\), \(a=1{,}0\ \text{mm}\). Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (MG) et (MΦ) : \(E_y\) ne dépend pas de \(y\) et \(B_z\) ne dépend pas de \(z\), les divergences sont nulles. (MF) : \(\overrightarrow{\operatorname{rot}}\,\vec E=\partial_xE_y\,\vec e_z\), soit \(kE_0\sin(\omega t-kx)\,\vec e_z\), et \(-\partial_t\vec B=\omega B_0\sin(\omega t-kx)\,\vec e_z\), d'où \(B_0=kE_0/\omega\). (MA) : \(\overrightarrow{\operatorname{rot}}\,\vec B=-\partial_xB_z\,\vec e_y\), soit \(-kB_0\sin(\omega t-kx)\,\vec e_y\), et \(\dfrac{1}{c^2}\partial_t\vec E=-\dfrac{\omega E_0}{c^2}\sin(\omega t-kx)\,\vec e_y\), d'où \(kB_0=\omega E_0/c^2\). Les deux conditions donnent \(\omega=kc\) et \(B_0=E_0/c\) : c'est l'onde plane progressive du chapitre suivant. Vérifier d'Alembert ne suffit pas : il faut les quatre équations.</p>
    <p><strong>Q2.</strong> \(\overrightarrow{\operatorname{rot}}\,\vec E=(\partial_xE_y-\partial_yE_x)\,\vec e_z\), soit \((-a-a)\,\vec e_z=-2a\,\vec e_z\neq\vec 0\) : ce n'est pas un champ électrostatique (sa circulation sur un cercle d'axe \(Oz\) n'est pas nulle). (MG) est vérifiée (\(\operatorname{div}\vec E=0\)). (MF) impose \(\partial_t\vec B=2a\,\vec e_z\), soit \(\vec B=\vec B_i+2a\,t\,\vec e_z\) : uniforme, donc (MΦ) vérifiée, et \(\overrightarrow{\operatorname{rot}}\,\vec B=\vec 0=\mu_0\varepsilon_0\,\partial_t\vec E\) puisque \(\vec E\) est constant : (MA) vérifiée. A.N. : \(\mathrm dB/\mathrm dt=2a=10\ \text{T·s}^{-1}\). En coordonnées cylindriques, \(\vec E=-a\,r\,\vec e_\theta=-\dfrac r2\,\dfrac{\mathrm dB}{\mathrm dt}\,\vec e_\theta\) : c'est exactement le champ induit à l'intérieur d'un solénoïde dont le courant croît linéairement (cours, §9).</p>
    <p><strong>Q3.</strong> Poisson : \(\rho=-\varepsilon_0\Delta V\). Pour \(V_1\) : \(\Delta V_1=\dfrac{V_0}{d^2}(2+2-4)=0\), donc \(\rho=0\) : ce potentiel « quadrupolaire » vérifie l'équation de Laplace (c'est celui des pièges à ions). Pour \(V_2\) : \(\Delta V_2=2V_0/d^2\), d'où \(\rho=-\dfrac{2\varepsilon_0V_0}{d^2}\approx-1{,}8\times10^{-5}\ \text{C·m}^{-3}\), uniforme.</p>
    <p><strong>Q4.</strong> \(\overrightarrow{\operatorname{rot}}\,\vec B=\dfrac{B_0}{a}(-1-1)\,\vec e_z=-\dfrac{2B_0}{a}\,\vec e_z=\mu_0\vec j\), donc \(\vec j=-\dfrac{2B_0}{\mu_0a}\,\vec e_z\approx-1{,}6\times10^{6}\ \text{A·m}^{-2}\;\vec e_z\) (et \(\operatorname{div}\vec B=0\) est vérifiée). On a \(\vec B=-\dfrac{B_0r}{a}\,\vec e_\theta\) : c'est le champ, croissant comme \(r\), à l'intérieur d'un fil parcouru par un courant uniforme dirigé selon \(-\vec e_z\) ; le théorème d'Ampère, \(2\pi r\,B_\theta=\mu_0 j_z\pi r^2\), redonne la même valeur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Le bétatron : accélérer avec un champ induit</h3>
  <div class="statement">Un bétatron accélère des électrons (charge \(-e\)) sur une orbite circulaire de rayon \(R\) fixe, d'axe \(Oz\), dans le plan \(z=0\) d'un électroaimant. Dans ce plan, le champ magnétique est axial, \(\vec B=B(r,t)\,\vec e_z\) avec \(B \gt 0\), à symétrie de révolution, et croît avec le temps. On note \(\Phi(t)\) son flux à travers le disque de rayon \(R\) orienté par \(\vec e_z\), et \(\bar B(t)=\Phi(t)/(\pi R^2)\) sa valeur moyenne sur ce disque. À \(t=0\), le champ est nul et les électrons sont injectés avec une quantité de mouvement négligeable. On admet que, dans le plan \(z=0\), le champ électrique induit est orthoradial : \(\vec E=E_\theta(r,t)\,\vec e_\theta\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(E_\theta(R,t)\) en fonction de \(\mathrm d\bar B/\mathrm dt\). Dans quel sens les électrons sont-ils accélérés ? Vérifier que, dans ce sens de rotation, la force magnétique est bien dirigée vers le centre.</div>
  <div class="q"><strong>Q2.</strong> En projetant \(\mathrm d\vec p/\mathrm dt=\vec F\) sur \(\vec e_\theta\) (relation valable aussi en relativité, \(\vec p\) désignant la quantité de mouvement), exprimer \(p(t)\) en fonction de \(\bar B(t)\).</div>
  <div class="q"><strong>Q3.</strong> On admet qu'un mouvement circulaire de rayon \(R\) dans le champ \(B(R,t)\) impose \(p=eR\,B(R,t)\). En déduire la condition que doivent vérifier \(B(R,t)\) et \(\bar B(t)\) pour que le rayon reste constant.</div>
  <div class="q"><strong>Q4.</strong> Application : \(R=0{,}50\ \text{m}\) ; \(\bar B\) croît linéairement de 0 à 0,80 T en 4,0 ms. Calculer \(|E_\theta(R)|\), l'énergie gagnée par tour en eV, la quantité de mouvement finale, puis l'énergie finale en MeV pour des électrons ultra-relativistes (énergie \(\approx pc\)). Estimer le nombre de tours effectués.</div>
  <div class="q"><strong>Q5.</strong> L'ARQS est-elle justifiée pour l'électroaimant, de dimension de l'ordre du mètre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Forme intégrale de (MF) sur le cercle de rayon \(R\) parcouru dans le sens de \(\vec e_\theta\) (normale \(\vec e_z\)) : \(2\pi R\,E_\theta(R,t)=-\dfrac{\mathrm d\Phi}{\mathrm dt}=-\pi R^2\,\dfrac{\mathrm d\bar B}{\mathrm dt}\), d'où</p>
    <div class="formula">$$E_\theta(R,t)=-\frac{R}{2}\,\frac{\mathrm d\bar B}{\mathrm dt}$$</div>
    <p>Comme \(\bar B\) croît, \(E_\theta \lt 0\) et la force \(F_\theta=-eE_\theta=\dfrac{eR}{2}\dfrac{\mathrm d\bar B}{\mathrm dt} \gt 0\) : les électrons sont accélérés dans le sens de \(\vec e_\theta\). Pour une vitesse \(v\,\vec e_\theta\), la force magnétique vaut \(-e\,v\,\vec e_\theta\wedge B\,\vec e_z=-evB\,\vec e_r\) : elle est centripète, le mouvement circulaire est possible.</p>
    <p><strong>Q2.</strong> \(\dfrac{\mathrm dp}{\mathrm dt}=\dfrac{eR}{2}\,\dfrac{\mathrm d\bar B}{\mathrm dt}\), et avec les conditions initiales nulles, \(p(t)=\dfrac{eR}{2}\,\bar B(t)\).</p>
    <p><strong>Q3.</strong> En égalant avec \(p=eR\,B(R,t)\) : \(B(R,t)=\dfrac12\,\bar B(t)\) à chaque instant. Le champ sur l'orbite doit valoir la moitié du champ moyen à l'intérieur : l'électroaimant est profilé pour que le champ soit plus intense près de l'axe.</p>
    <p><strong>Q4.</strong> \(\mathrm d\bar B/\mathrm dt=0{,}80/4{,}0\times10^{-3}=200\ \text{T·s}^{-1}\), donc \(|E_\theta(R)|=0{,}25\times200=50\ \text{V·m}^{-1}\). Gain par tour : \(e\,|E_\theta|\,2\pi R=e\times50\times\pi\approx1{,}6\times10^{2}\ \text{eV}\). Quantité de mouvement finale : \(p=\dfrac{eR}{2}\,\bar B\approx3{,}2\times10^{-20}\ \text{kg·m·s}^{-1}\), d'où \(pc\approx9{,}6\times10^{-12}\ \text{J}\approx60\ \text{MeV}\). Nombre de tours : \(60\times10^{6}/157\approx4\times10^{5}\). Contrôle : à \(v\approx c\), un tour dure \(2\pi R/c\approx1\times10^{-8}\ \text{s}\), soit environ \(4\times10^{5}\) tours en 4 ms : cohérent.</p>
    <p><strong>Q5.</strong> La durée caractéristique des variations, quelques millisecondes, correspond à \(cT\sim10^{6}\ \text{m}\gg1\ \text{m}\) : l'ARQS magnétique est parfaitement justifiée, le champ de l'électroaimant suit ses courants instantanément.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Lentille magnétique : le champ hors de l'axe</h3>
  <div class="statement">Dans un microscope électronique, une bobine courte d'axe \(Oz\) crée un champ magnétique à symétrie de révolution. Sur l'axe, on le modélise par \(B_z(0,z)=\dfrac{B_0}{1+z^2/d^2}\), avec \(B_0=0{,}50\ \text{T}\) et \(d=2{,}0\ \text{mm}\). On étudie le champ en un point \(M(r,\theta,z)\) proche de l'axe (\(r\ll d\)), dans une région vide de courants.</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(\vec B(M)=B_r(r,z)\,\vec e_r+B_z(r,z)\,\vec e_z\).</div>
  <div class="q"><strong>Q2.</strong> En écrivant que le flux de \(\vec B\) est nul à travers un petit cylindre fermé d'axe \(Oz\), de rayon \(r\), compris entre \(z\) et \(z+\mathrm dz\), montrer que \(B_r(r,z)\approx-\dfrac{r}{2}\,\dfrac{\partial B_z(0,z)}{\partial z}\).</div>
  <div class="q"><strong>Q3.</strong> Expliciter \(B_r(r,z)\). Pour \(r=0{,}10\ \text{mm}\), où \(|B_r|\) est-il maximal et que vaut-il ? Décrire l'allure des lignes de champ.</div>
  <div class="q"><strong>Q4.</strong> En utilisant la composante orthoradiale de \(\overrightarrow{\operatorname{rot}}\,\vec B=\vec 0\), soit \(\dfrac{\partial B_r}{\partial z}=\dfrac{\partial B_z}{\partial r}\), montrer que \(B_z(r,z)\approx B_z(0,z)-\dfrac{r^2}{4}\,\dfrac{\partial^2B_z(0,z)}{\partial z^2}\). Commenter l'approximation faite en Q2.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Invariance par rotation autour de \(Oz\) : les composantes ne dépendent pas de \(\theta\). Le plan \((M,Oz)\) est un plan d'antisymétrie pour les courants orthoradiaux de la bobine ; \(\vec B\), vecteur axial, appartient donc à ce plan : \(B_\theta=0\).</p>
    <p><strong>Q2.</strong> Flux sortant : face supérieure \(B_z(0,z+\mathrm dz)\,\pi r^2\), face inférieure \(-B_z(0,z)\,\pi r^2\) (en confondant \(B_z(r,z)\) et \(B_z(0,z)\) au premier ordre), surface latérale \(B_r(r,z)\,2\pi r\,\mathrm dz\). (MΦ) impose une somme nulle :</p>
    <div class="formula">$$\frac{\partial B_z(0,z)}{\partial z}\,\pi r^2\,\mathrm dz+2\pi r\,B_r\,\mathrm dz=0$$
    $$B_r\approx-\frac{r}{2}\,\frac{\partial B_z(0,z)}{\partial z}$$</div>
    <p><strong>Q3.</strong> \(\dfrac{\partial B_z(0,z)}{\partial z}=-\dfrac{2B_0z/d^2}{(1+z^2/d^2)^2}\), donc</p>
    <div class="formula">$$B_r(r,z)=\frac{B_0\,r}{d}\;\frac{z/d}{\big(1+z^2/d^2\big)^2}$$</div>
    <p>La fonction \(u\mapsto u/(1+u^2)^2\) est maximale pour \(1-3u^2=0\), soit \(u=1/\sqrt3\), où elle vaut \(9/(16\sqrt3)\approx0{,}32\). Ainsi \(|B_r|\) est maximal en \(z=\pm d/\sqrt3\approx\pm1{,}2\ \text{mm}\) et vaut \(\dfrac{B_0r}{d}\times0{,}32=0{,}025\times0{,}32\approx8\ \text{mT}\). Pour \(z \lt 0\), \(B_r \lt 0\) : les lignes de champ convergent vers l'axe en approchant du centre ; pour \(z \gt 0\), \(B_r \gt 0\) : elles s'en écartent. C'est cette composante radiale qui, combinée à la vitesse des électrons, les focalise.</p>
    <p><strong>Q4.</strong> \(\dfrac{\partial B_z}{\partial r}=\dfrac{\partial B_r}{\partial z}\), soit \(-\dfrac{r}{2}\,\dfrac{\partial^2B_z(0,z)}{\partial z^2}\) ; en intégrant de 0 à \(r\) : \(B_z(r,z)=B_z(0,z)-\dfrac{r^2}{4}\,\dfrac{\partial^2B_z(0,z)}{\partial z^2}\). L'écart à la valeur sur l'axe est du second ordre en \(r/d\) : confondre \(B_z(r,z)\) et \(B_z(0,z)\) en Q2 ne modifie \(B_r\) qu'à l'ordre 3, l'approximation est cohérente.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Faisceau d'électrons : charge d'espace et force magnétique</h3>
  <div class="statement">Un faisceau cylindrique d'électrons, d'axe \(Oz\) et de rayon \(a=1{,}0\ \text{mm}\), transporte un courant d'intensité \(I=10\ \text{mA}\) ; les électrons (charge \(-e\), masse \(m\)) avancent selon \(+\vec e_z\) à la vitesse \(v=3{,}0\times10^{7}\ \text{m·s}^{-1}\), et leur densité est uniforme dans le faisceau. Régime stationnaire. On donne, pour \(V(r)\) : \(\Delta V=\dfrac1r\dfrac{\mathrm d}{\mathrm dr}\Big(r\dfrac{\mathrm dV}{\mathrm dr}\Big)\). Données : \(e=1{,}60\times10^{-19}\ \text{C}\), \(m=9{,}11\times10^{-31}\ \text{kg}\), \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(c=3{,}00\times10^{8}\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer la charge linéique \(\lambda\) et la densité \(\rho\) du faisceau en fonction de \(I\), \(v\) et \(a\). Applications numériques.</div>
  <div class="q"><strong>Q2.</strong> Établir l'équation vérifiée par le potentiel \(V(r)\) à l'intérieur du faisceau, et la résoudre (\(V\) et son gradient restent finis sur l'axe). En déduire \(\vec E\) et vérifier le résultat par le théorème de Gauss. Calculer \(V(a)-V(0)\) et \(\|\vec E(a)\|\).</div>
  <div class="q"><strong>Q3.</strong> Par le théorème d'Ampère, déterminer \(\vec B\) pour \(r\le a\) (attention au sens du courant).</div>
  <div class="q"><strong>Q4.</strong> Exprimer la force de Lorentz subie par un électron du bord du faisceau. Montrer que le rapport de la force magnétique à la force électrique vaut \(v^2/c^2\). Les électrons sont-ils rapprochés de l'axe ou écartés ?</div>
  <div class="q"><strong>Q5.</strong> Estimer l'écart radial que prend un électron du bord après un trajet de \(10\ \text{cm}\). Conclure sur la nécessité d'une focalisation.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pendant \(\mathrm dt\), la charge qui traverse une section est celle d'une longueur \(v\,\mathrm dt\) de faisceau : \(|\lambda|\,v=I\). Les électrons étant négatifs, \(\lambda=-I/v\approx-3{,}3\times10^{-10}\ \text{C·m}^{-1}\) et \(\rho=\lambda/(\pi a^2)\approx-1{,}1\times10^{-4}\ \text{C·m}^{-3}\).</p>
    <p><strong>Q2.</strong> Statique : \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) et (MG) donnent \(\Delta V=-\rho/\varepsilon_0\), soit \(\dfrac{\mathrm d}{\mathrm dr}\Big(r\dfrac{\mathrm dV}{\mathrm dr}\Big)=-\dfrac{\rho r}{\varepsilon_0}\). En intégrant : \(r\,V'=-\dfrac{\rho r^2}{2\varepsilon_0}+K\), avec \(K=0\) pour que \(V'\) reste fini en \(r=0\). Puis \(V(r)=V(0)-\dfrac{\rho r^2}{4\varepsilon_0}\) et \(\vec E=-V'\,\vec e_r=\dfrac{\rho r}{2\varepsilon_0}\,\vec e_r\). Gauss sur un cylindre de rayon \(r\) et de hauteur \(h\) : \(2\pi rh\,E_r=\rho\pi r^2h/\varepsilon_0\), même résultat. A.N. : \(V(a)-V(0)=-\dfrac{\rho a^2}{4\varepsilon_0}=-\dfrac{\lambda}{4\pi\varepsilon_0}\approx3{,}0\ \text{V}\) et \(\|\vec E(a)\|=\dfrac{|\lambda|}{2\pi\varepsilon_0a}\approx6{,}0\times10^{3}\ \text{V·m}^{-1}\), dirigé vers l'axe (\(\rho\lt0\)).</p>
    <p><strong>Q3.</strong> Le courant est dirigé selon \(-\vec e_z\) (électrons selon \(+\vec e_z\)). Symétries : \(\vec B=B_\theta(r)\,\vec e_\theta\). Ampère sur un cercle de rayon \(r\le a\) orienté par \(\vec e_\theta\) (normale \(\vec e_z\)) : \(2\pi r\,B_\theta=\mu_0\,(-I)\,\dfrac{r^2}{a^2}\), d'où \(\vec B=-\dfrac{\mu_0 I r}{2\pi a^2}\,\vec e_\theta\), soit \(\|\vec B(a)\|=2{,}0\times10^{-6}\ \text{T}\).</p>
    <p><strong>Q4.</strong> En \(r=a\) : force électrique \(-e\vec E(a)=\dfrac{eI}{2\pi\varepsilon_0 v a}\,\vec e_r\), vers l'extérieur (les électrons se repoussent) ; force magnétique \(-e\,v\,\vec e_z\wedge B_\theta\,\vec e_\theta=e\,v\,B_\theta\,\vec e_r\), soit \(-\dfrac{\mu_0 e I v}{2\pi a}\,\vec e_r\), vers l'axe (deux courants parallèles s'attirent). Rapport des normes : \(\dfrac{\mu_0 I v/(2\pi a)}{I/(2\pi\varepsilon_0 v a)}=\mu_0\varepsilon_0v^2\), soit \(\dfrac{v^2}{c^2}=0{,}010\). La force totale vaut \(\dfrac{eI}{2\pi\varepsilon_0va}\Big(1-\dfrac{v^2}{c^2}\Big)\approx9{,}5\times10^{-16}\ \text{N}\), vers l'extérieur : le faisceau tend à s'élargir.</p>
    <p><strong>Q5.</strong> Accélération radiale \(F/m\approx1{,}0\times10^{15}\ \text{m·s}^{-2}\) pendant \(t=0{,}10/v\approx3{,}3\ \text{ns}\) : écart \(\tfrac12(F/m)\,t^2\approx6\ \text{mm}\), six fois le rayon initial (ordre de grandeur : la force diminue en fait à mesure que le faisceau s'élargit). Sans focalisation (lentille magnétique, exercice 7), le faisceau se disperserait ; à l'inverse, pour \(v\to c\), les deux forces se compensent presque.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Charge d'un condensateur : courant de déplacement et bilan d'énergie</h3>
  <div class="statement">Un condensateur plan a deux armatures circulaires d'axe \(Oz\), de rayon \(R=5{,}0\ \text{cm}\), distantes de \(e=1{,}0\ \text{mm}\) ; l'espace entre elles est vide. Il est chargé à courant constant \(I=2{,}0\ \mu\text{A}\) à partir de \(t=0\) (charge nulle). L'armature positive est en \(z=0\), l'autre en \(z=e\). On néglige les effets de bord : entre les armatures, \(\vec E\) est uniforme et axial. Données : \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(q(t)\), \(\vec E(t)\) entre les armatures, la capacité \(C\) et la tension \(u(t)\). Calculer \(C\) et \(u\) à \(t=1{,}0\ \text{ms}\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le courant de déplacement \(\vec j_D\) entre les armatures et son flux. Par le théorème d'Ampère généralisé, déterminer \(\vec B\) entre les armatures, pour \(r\le R\). Valeur en \(r=R\) ?</div>
  <div class="q"><strong>Q3.</strong> Exprimer le vecteur de Poynting en \(r=R\). Montrer que la puissance qui entre par la surface latérale du cylindre inter-armatures est égale à la dérivée de l'énergie électrique stockée. Application à \(t=1{,}0\ \text{ms}\).</div>
  <div class="q"><strong>Q4.</strong> Calculer l'énergie magnétique \(U_m\) stockée entre les armatures et la comparer à l'énergie électrique \(U_e\) à \(t=1{,}0\ \text{ms}\). Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(q=It\). Comme pour un plan chargé (cours, §10), \(\vec E=\dfrac{q}{\varepsilon_0\pi R^2}\,\vec e_z=\dfrac{It}{\varepsilon_0\pi R^2}\,\vec e_z\) ; \(u=Ee\), d'où \(C=\dfrac{\varepsilon_0\pi R^2}{e}\approx70\ \text{pF}\) et \(u=\dfrac{It}{C}\approx29\ \text{V}\) à \(1{,}0\ \text{ms}\).</p>
    <p><strong>Q2.</strong> \(\vec j_D=\varepsilon_0\,\partial_t\vec E=\dfrac{I}{\pi R^2}\,\vec e_z\) : uniforme, de flux \(I\) à travers la section des armatures, il prolonge exactement le courant du fil. Symétries (tout plan contenant l'axe est plan de symétrie des sources \(\vec j_D\)) : \(\vec B=B_\theta(r)\,\vec e_\theta\). Ampère généralisé sur un cercle de rayon \(r\le R\) : \(2\pi r\,B_\theta=\mu_0\,\dfrac{I\,\pi r^2}{\pi R^2}\), d'où \(\vec B=\dfrac{\mu_0 I r}{2\pi R^2}\,\vec e_\theta\), indépendant du temps ici ; \(B(R)=\dfrac{\mu_0 I}{2\pi R}=8{,}0\times10^{-12}\ \text{T}\).</p>
    <p><strong>Q3.</strong> En \(r=R\) : \(\vec\Pi=\dfrac{E\,B}{\mu_0}\,(\vec e_z\wedge\vec e_\theta)=-\dfrac{u}{e}\cdot\dfrac{I}{2\pi R}\,\vec e_r\), dirigé vers l'axe. Puissance entrante sur la surface latérale d'aire \(2\pi Re\) : \(P=\dfrac{uI}{2\pi Re}\times2\pi Re=uI\). Or \(U_e=\dfrac{q^2}{2C}\) donne \(\dfrac{\mathrm dU_e}{\mathrm dt}=\dfrac{q}{C}\,\dfrac{\mathrm dq}{\mathrm dt}=uI\) : l'énergie électrique stockée entre par la périphérie, portée par le champ. A.N. : \(P\approx29\times2{,}0\times10^{-6}\approx5{,}8\times10^{-5}\ \text{W}\). Les bases (armatures) ne contribuent pas : \(\vec\Pi\) leur est tangent.</p>
    <p><strong>Q4.</strong> En intégrant sur des couronnes de volume \(2\pi r\,e\,\mathrm dr\) :</p>
    <div class="formula">$$U_m=\int_0^R\frac{1}{2\mu_0}\Big(\frac{\mu_0Ir}{2\pi R^2}\Big)^2 2\pi r\,e\,\mathrm dr=\frac{\mu_0I^2e}{16\pi}$$</div>
    <p>soit \(U_m\approx1\times10^{-22}\ \text{J}\), à comparer à \(U_e=\dfrac{q^2}{2C}\approx2{,}9\times10^{-8}\ \text{J}\) : un rapport de \(4\times10^{-15}\). Le champ magnétique est bien présent (il assure le transport d'énergie de la question 3) mais son énergie est négligeable : le condensateur se comporte comme une capacité pure, sans effet inductif.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Conductivité de l'aluminium, du continu à l'infrarouge (modèle de Drude, hors programme)</h3>
  <div class="statement">L'aluminium a une conductivité statique \(\sigma_0=3{,}8\times10^{7}\ \text{S·m}^{-1}\) et compte \(n=1{,}8\times10^{29}\) électrons de conduction par m³. On utilise le modèle de Drude : chaque électron (masse \(m=9{,}1\times10^{-31}\ \text{kg}\), charge \(-e\), \(e=1{,}6\times10^{-19}\ \text{C}\)) subit le champ électrique et une force de frottement \(-m\vec v/\tau\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le temps de relaxation \(\tau\).</div>
  <div class="q"><strong>Q2.</strong> En régime sinusoïdal forcé (convention \(e^{i\omega t}\)), établir la conductivité complexe \(\underline\sigma(\omega)\). Donner son module et son argument ; interpréter le signe de l'argument.</div>
  <div class="q"><strong>Q3.</strong> À partir de quelle fréquence \(f_{10}\) le retard de phase de \(\vec j\) sur \(\vec E\) atteint-il 10° ? La conductivité peut-elle être considérée comme réelle pour un four à micro-ondes (2,45 GHz) ? pour un rayonnement infrarouge de fréquence \(3{,}0\times10^{13}\ \text{Hz}\) ?</div>
  <div class="q"><strong>Q4.</strong> Le champ \(\vec E=\vec E_0\cos\omega t\) règne dans le métal. Exprimer la puissance volumique moyenne cédée aux électrons. Que devient-elle, relativement au régime continu, à \(3{,}0\times10^{13}\ \text{Hz}\) ?</div>
  <div class="q"><strong>Q5.</strong> Entre deux collisions, un électron de conduction de l'aluminium se déplace en réalité très vite, à la vitesse de Fermi \(v_F\approx2{,}0\times10^{6}\ \text{m·s}^{-1}\). Estimer la distance \(\ell_c=v_F\,\tau\) qu'il parcourt entre deux collisions et la comparer à la distance entre atomes voisins (0,29 nm). Qu'en conclure sur la nature des « collisions » du modèle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\sigma_0=ne^2\tau/m\) donne \(\tau=\dfrac{m\sigma_0}{ne^2}\approx7{,}5\times10^{-15}\ \text{s}\).</p>
    <p><strong>Q2.</strong> \(i\omega m\,\underline{\vec v}=-e\underline{\vec E}-\dfrac{m}{\tau}\underline{\vec v}\), donc \(\underline{\vec v}=-\dfrac{e\tau/m}{1+i\omega\tau}\,\underline{\vec E}\) et \(\underline{\vec j}=-ne\underline{\vec v}\) :</p>
    <div class="formula">$$\underline\sigma=\frac{\sigma_0}{1+i\omega\tau}$$
    $$|\underline\sigma|=\frac{\sigma_0}{\sqrt{1+\omega^2\tau^2}}$$</div>
    <p>et \(\arg\underline\sigma=-\arctan(\omega\tau)\). L'argument négatif traduit un retard de \(\vec j\) sur \(\vec E\) : l'inertie des électrons les empêche de suivre instantanément le champ.</p>
    <p><strong>Q3.</strong> Le retard vaut \(\arctan(\omega\tau)\) ; il atteint 10° pour \(\omega\tau=\tan10°\approx0{,}176\), soit \(f_{10}=\dfrac{0{,}176}{2\pi\tau}\approx3{,}7\times10^{12}\ \text{Hz}\). À 2,45 GHz, \(\omega\tau\approx1{,}2\times10^{-4}\) : retard inférieur à 0,01°, conductivité réelle à une excellente approximation. À \(3{,}0\times10^{13}\ \text{Hz}\), \(\omega\tau\approx1{,}41\) : \(|\underline\sigma|=\sigma_0/\sqrt3\approx0{,}58\,\sigma_0\) et un retard de 55° ; le modèle ohmique réel ne s'applique plus.</p>
    <p><strong>Q4.</strong> \(\langle p\rangle=\dfrac12\operatorname{Re}(\underline\sigma)\,E_0^2\), soit \(\dfrac{\sigma_0E_0^2}{2(1+\omega^2\tau^2)}\) : fonction décroissante de \(\omega\) (moitié d'une courbe de Lorentz), divisée par 2 pour \(\omega\tau=1\). À \(3{,}0\times10^{13}\ \text{Hz}\), \(\omega^2\tau^2\approx2{,}0\) : un tiers de la valeur en continu.</p>
    <p><strong>Q5.</strong> \(\ell_c=v_F\,\tau\approx1{,}5\times10^{-8}\ \text{m}\), soit 15 nm : une cinquantaine de distances interatomiques. Un électron n'est donc pas dévié par chaque ion qu'il croise : les collisions proviennent des imperfections du cristal (agitation thermique des ions, atomes étrangers). Le temps \(\tau\) du modèle de Drude est un paramètre effectif, ajusté sur la conductivité mesurée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Courants de Foucault dans un noyau cylindrique</h3>
  <div class="statement">Un cylindre plein d'acier inoxydable amagnétique (conductivité \(\sigma=1{,}4\times10^{6}\ \text{S·m}^{-1}\), perméabilité du vide), de rayon \(a=2{,}0\ \text{cm}\) et de longueur \(\ell=10\ \text{cm}\), est placé sur l'axe \(Oz\) d'un long solénoïde qui crée le champ uniforme \(\vec B=B_0\cos(\omega t)\,\vec e_z\), avec \(B_0=0{,}20\ \text{T}\) et \(f=50\ \text{Hz}\). On se place en ARQS magnétique, on néglige les effets d'extrémités et, sauf en Q5, le champ magnétique créé par les courants induits eux-mêmes. On admet que le champ électrique induit est orthoradial : \(\vec E=E(r,t)\,\vec e_\theta\).</div>
  <div class="q"><strong>Q1.</strong> À l'aide de la forme intégrale de (MF), exprimer \(E(r,t)\) pour \(r\le a\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(\vec j\). Décrire les lignes de courant et vérifier qu'elles sont compatibles avec la conservation de la charge et avec la surface latérale du cylindre.</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance moyenne \(\langle P\rangle\) dissipée par effet Joule dans le cylindre. Application numérique.</div>
  <div class="q"><strong>Q4.</strong> On remplace le cylindre par un faisceau de \(N\) fils parallèles à \(Oz\), isolés les uns des autres, de même section totale et de même longueur. Montrer que les pertes sont divisées par \(N\). Application à \(N=100\). Quel est l'intérêt pour un transformateur ?</div>
  <div class="q"><strong>Q5.</strong> Les courants induits créent un champ propre. En découpant le cylindre en coquilles minces de rayon \(r\) et d'épaisseur \(\mathrm dr\), assimilées à des solénoïdes, montrer que l'amplitude de ce champ au centre vaut \(\mu_0\sigma\omega B_0a^2/4\). Conclure numériquement sur l'hypothèse faite, puis sur ce qu'elle deviendrait pour un cylindre de cuivre (\(\sigma=6\times10^{7}\ \text{S·m}^{-1}\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Cercle d'axe \(Oz\), de rayon \(r\), parcouru dans le sens de \(\vec e_\theta\) : le flux \(B_0\cos(\omega t)\,\pi r^2\) donne \(2\pi r\,E=\pi r^2\omega B_0\sin(\omega t)\), d'où</p>
    <div class="formula">$$E(r,t)=\frac{r\,\omega B_0}{2}\,\sin(\omega t)$$</div>
    <p><strong>Q2.</strong> \(\vec j=\sigma\vec E=\dfrac{\sigma\omega B_0\,r}{2}\sin(\omega t)\,\vec e_\theta\) : lignes de courant circulaires d'axe \(Oz\), d'intensité croissante avec \(r\). \(\vec j\) est orthoradial et ne dépend pas de \(\theta\), donc \(\operatorname{div}\vec j=0\) : aucune accumulation de charge. En \(r=a\), \(\vec j\cdot\vec e_r=0\) : le courant ne sort pas du cylindre.</p>
    <p><strong>Q3.</strong> \(p=j^2/\sigma=\dfrac{\sigma\omega^2B_0^2r^2}{4}\sin^2(\omega t)\), de moyenne \(\dfrac{\sigma\omega^2B_0^2r^2}{8}\). En intégrant sur des coquilles de volume \(2\pi r\ell\,\mathrm dr\) :</p>
    <div class="formula">$$\langle P\rangle=\int_0^a\frac{\sigma\omega^2B_0^2r^2}{8}\,2\pi r\ell\,\mathrm dr$$
    $$\langle P\rangle=\frac{\pi\,\sigma\,\omega^2B_0^2\,\ell\,a^4}{16}$$</div>
    <p>A.N. : avec \(\omega=100\pi\ \text{rad·s}^{-1}\), \(B_0^2=0{,}04\ \text{T}^2\) et \(a^4=1{,}6\times10^{-7}\ \text{m}^4\), on trouve \(\langle P\rangle\approx17\ \text{W}\).</p>
    <p><strong>Q4.</strong> Chaque fil a un rayon \(a'=a/\sqrt N\) (même section totale \(N\pi a'^2=\pi a^2\)). Ses pertes valent \(\langle P\rangle\,(a'/a)^4=\langle P\rangle/N^2\), et les \(N\) fils dissipent \(\langle P\rangle/N\). Pour \(N=100\) : environ 0,17 W. Les pertes croissent comme \(a^4\) : la f.é.m. le long d'une ligne de courant croît comme \(r^2\) alors que sa résistance ne croît que comme \(r\). Diviser le noyau en éléments isolés (fils ou tôles feuilletées) limite donc fortement l'échauffement des transformateurs et des machines.</p>
    <p><strong>Q5.</strong> La coquille \([r,r+\mathrm dr]\) porte un courant surfacique orthoradial \(j\,\mathrm dr\) ; comme un solénoïde, elle crée à l'intérieur (donc au centre) le champ axial \(\mu_0\,j\,\mathrm dr\). Au centre, la somme \(\mu_0\int_0^a j\,\mathrm dr\) des contributions donne</p>
    <div class="formula">$$B_{ind}(0,t)=\frac{\mu_0\sigma\omega B_0a^2}{4}\,\sin(\omega t)$$</div>
    <p>Il est en quadrature et s'oppose aux variations de \(\vec B\) (loi de Lenz). Rapport des amplitudes : \(\dfrac{\mu_0\sigma\omega a^2}{4}\approx0{,}055\) : correction de l'ordre de 5 %, hypothèse acceptable. Pour du cuivre, le rapport serait multiplié par \(6\times10^7/1{,}4\times10^6\approx43\), soit \(\approx2{,}4\) : le champ propre n'est plus négligeable, le champ ne pénètre plus uniformément dans le métal (effet de peau, étudié avec les ondes dans les conducteurs). L'ARQS, elle, reste valable : \(\ell\ll\lambda=6\,000\ \text{km}\) et \(\varepsilon_0\omega/\sigma\le2\times10^{-15}\) pour les deux métaux.</p>
  </div>
</div>

  <figcaption>Câble coaxial vu en coupe : l'âme (rayon a) porte +λ et le courant i (vers le lecteur), la gaine (rayon b) porte −λ et le courant de retour.</figcaption>
  </figure>

  <p class="exo-part">Partie A — Validité de l'ARQS</p>
  <div class="q"><strong>A1.</strong> Le signal transmis a une fréquence maximale de 1,0 MHz. On admet l'ARQS si le déphasage dû à la propagation le long du câble, \(2\pi\ell/\lambda_0\) (\(\lambda_0\) : longueur d'onde), reste inférieur à 0,05 rad. Est-ce le cas ? Même question à 100 MHz.</div>
  <div class="q"><strong>A2.</strong> À 1,0 MHz, comparer les courants de déplacement et de conduction dans l'âme. Quelle forme de l'ARQS s'applique dans l'âme ?</div>

  <p class="exo-part">Partie B — Champs et grandeurs linéiques</p>
  <div class="q"><strong>B1.</strong> Par une analyse des symétries et le théorème de Gauss, déterminer \(\vec E\) pour \(a \lt r \lt b\). En déduire \(u\) en fonction de \(\lambda\), puis la capacité linéique \(\Gamma\). Application numérique.</div>
  <div class="q"><strong>B2.</strong> Montrer que \(\vec E\) et \(\vec B\) sont nuls pour \(r \gt b\). Déterminer \(\vec B\) pour \(a \lt r \lt b\).</div>
  <div class="q"><strong>B3.</strong> Calculer l'énergie magnétique par unité de longueur stockée entre les conducteurs. En négligeant l'énergie magnétique dans l'âme, en déduire l'inductance linéique \(\Lambda\). Application numérique.</div>
  <div class="q"><strong>B4.</strong> Calculer le produit \(\Lambda\Gamma\) et commenter.</div>
  <div class="q"><strong>B5.</strong> Le câble alimente \(R_c\), donc \(u=R_c\,i\). Exprimer le rapport des énergies électrique et magnétique stockées dans le câble à l'aide de \(Z_c=\sqrt{\Lambda/\Gamma}\), que l'on calculera. À 1,0 MHz, comparer \(L\omega\) et \(1/(C\omega)\) à \(R_c\), où \(L=\Lambda\ell\) et \(C=\Gamma\ell\). Conclure.</div>

  <p class="exo-part">Partie C — Transport de l'énergie</p>
  <div class="q"><strong>C1.</strong> Exprimer le vecteur de Poynting entre les conducteurs en fonction de \(u\), \(i\) et \(r\). Calculer son flux à travers une section droite de l'isolant et interpréter.</div>
  <div class="q"><strong>C2.</strong> En régime continu (\(i=I=2{,}0\ \text{A}\)), on tient compte de la résistance de l'âme. Exprimer le champ électrique dans l'âme et le vecteur de Poynting à sa surface. Montrer que la puissance qui entre dans l'âme par sa surface latérale, sur la longueur \(\ell\), vaut \(R_aI^2\), où \(R_a\) est la résistance de l'âme. Application numérique.</div>
  <div class="q"><strong>C3.</strong> Quelle fraction de la puissance reçue par la charge est perdue dans l'âme ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> À 1,0 MHz, \(\lambda_0=c/f=300\ \text{m}\) et \(2\pi\ell/\lambda_0\approx0{,}042\ \text{rad}\lt0{,}05\ \text{rad}\) : ARQS applicable, mais de justesse (avec un vrai diélectrique, où \(v\approx2c/3\), on trouverait \(0{,}063\ \text{rad}\), au-delà du seuil). À 100 MHz, \(\lambda_0=3\ \text{m}\) et le déphasage atteint 4,2 rad : la propagation doit être prise en compte (théorie des lignes).</p>
    <p><strong>A2.</strong> \(\varepsilon_0\omega/\sigma\approx9\times10^{-13}\) : \(\vec j_D\) est négligeable, ARQS magnétique dans l'âme.</p>
    <p><strong>B1.</strong> Invariances par rotation autour de l'axe et par translation selon \(Oz\) : les champs ne dépendent que de \(r\). Le plan contenant \(M\) et l'axe, et le plan orthogonal à l'axe passant par \(M\), sont plans de symétrie des charges : \(\vec E=E(r)\,\vec e_r\). Gauss sur un cylindre de rayon \(r\) et de hauteur \(h\) : \(2\pi rh\,E=\lambda h/\varepsilon_0\), d'où</p>
    <div class="formula">$$\vec E=\frac{\lambda}{2\pi\varepsilon_0r}\,\vec e_r$$
    $$u=\int_a^bE\,\mathrm dr=\frac{\lambda}{2\pi\varepsilon_0}\ln\frac ba$$
    $$\Gamma=\frac{\lambda}{u}=\frac{2\pi\varepsilon_0}{\ln(b/a)}$$</div>
    <p>A.N. : \(\Gamma=\dfrac{2\pi\times8{,}85\times10^{-12}}{1{,}25}\approx44\ \text{pF·m}^{-1}\), soit \(C=\Gamma\ell\approx89\ \text{pF}\).</p>
    <p><strong>B2.</strong> Pour \(r \gt b\), un cylindre de Gauss contient la charge totale \(\lambda-\lambda=0\), donc \(E=0\) ; un contour circulaire enlace le courant total \(i-i=0\), donc \(B=0\). Entre les conducteurs, tout plan contenant l'axe est plan de symétrie des courants : \(\vec B=B(r)\,\vec e_\theta\). Ampère (ARQS magnétique) : \(2\pi r\,B=\mu_0 i\), soit \(\vec B=\dfrac{\mu_0 i}{2\pi r}\,\vec e_\theta\).</p>
    <p><strong>B3.</strong> Densité d'énergie : \(u_m=\dfrac{B^2}{2\mu_0}=\dfrac{\mu_0i^2}{8\pi^2r^2}\). Sur des coquilles de volume \(2\pi r\,\mathrm dr\) par unité de longueur :</p>
    <div class="formula">$$\frac{U_m}{\ell}=\int_a^b\frac{\mu_0i^2}{8\pi^2r^2}\,2\pi r\,\mathrm dr=\frac{\mu_0 i^2}{4\pi}\ln\frac ba$$</div>
    <p>En identifiant à \(\frac12\Lambda i^2\) :</p>
    <div class="formula">$$\Lambda=\frac{\mu_0}{2\pi}\ln\frac ba$$</div>
    <p>A.N. : \(\Lambda\approx2\times10^{-7}\times1{,}25=2{,}5\times10^{-7}\ \text{H·m}^{-1}\), soit \(L=\Lambda\ell\approx0{,}50\ \mu\text{H}\).</p>
    <p><strong>B4.</strong> \(\Lambda\Gamma=\mu_0\varepsilon_0=1/c^2\approx1{,}1\times10^{-17}\ \text{s}^2\text{·m}^{-2}\), indépendamment de la géométrie. La grandeur \(1/\sqrt{\Lambda\Gamma}=c\) est la vitesse à laquelle les signaux se propagent le long du câble (à isolant vide), résultat que l'on établit hors ARQS.</p>
    <p><strong>B5.</strong> \(\dfrac{U_e}{U_m}=\dfrac{\frac12\Gamma u^2}{\frac12\Lambda i^2}=\dfrac{\Gamma R_c^2}{\Lambda}=\Big(\dfrac{R_c}{Z_c}\Big)^2\) avec \(Z_c=\sqrt{2{,}5\times10^{-7}/4{,}4\times10^{-11}}\approx75\ \Omega\) ; rapport \(\approx(50/75)^2\approx0{,}44\). Les deux énergies sont du même ordre : dans l'isolant, ni l'ARQS magnétique ni l'ARQS électrique ne s'impose. Mais à 1,0 MHz, \(L\omega\approx0{,}50\times10^{-6}\times6{,}3\times10^{6}\approx3\ \Omega\ll R_c\) et \(1/(C\omega)\approx1{,}8\ \text{k}\Omega\gg R_c\) : l'inductance série et la capacité parallèle du câble perturbent peu le circuit, qui se comporte comme si la charge était branchée directement sur le générateur.</p>
    <p><strong>C1.</strong> Avec \(\lambda=\dfrac{2\pi\varepsilon_0u}{\ln(b/a)}\) et \(\vec e_r\wedge\vec e_\theta=\vec e_z\) :</p>
    <div class="formula">$$\vec\Pi=\frac{\vec E\wedge\vec B}{\mu_0}=\frac{u\,i}{2\pi r^2\ln(b/a)}\,\vec e_z$$
    $$\int_a^b\Pi\,2\pi r\,\mathrm dr=u\,i$$</div>
    <p>La puissance \(ui\) transmise à la charge circule dans l'isolant, là où coexistent \(\vec E\) et \(\vec B\), et non dans le métal.</p>
    <p><strong>C2.</strong> Dans l'âme, \(\vec j=\dfrac{I}{\pi a^2}\,\vec e_z\) et \(\vec E=\dfrac{\vec j}{\sigma}=\dfrac{I}{\sigma\pi a^2}\,\vec e_z\). En \(r=a\), \(\vec B=\dfrac{\mu_0I}{2\pi a}\,\vec e_\theta\), et comme \(\vec e_z\wedge\vec e_\theta=-\vec e_r\) : \(\vec\Pi=-\dfrac{I^2}{2\sigma\pi^2a^3}\,\vec e_r\), dirigé vers l'axe. Puissance entrante sur la longueur \(\ell\) :</p>
    <div class="formula">$$P=\frac{I^2}{2\sigma\pi^2a^3}\times2\pi a\ell=\frac{\ell}{\sigma\pi a^2}\,I^2=R_aI^2$$</div>
    <p>A.N. : \(R_a=\dfrac{\ell}{\sigma\pi a^2}\approx4{,}2\times10^{-2}\ \Omega\) et \(P\approx0{,}17\ \text{W}\). La composante tangentielle de \(\vec E\) étant continue, il existe juste à l'extérieur de l'âme une petite composante axiale \(E_z\approx0{,}04\ \text{V·m}^{-1}\) (à comparer à la composante radiale \(\approx1{,}6\times10^{5}\ \text{V·m}^{-1}\) en \(r=a\) sous \(U=R_cI=100\ \text{V}\)) : c'est elle qui incline légèrement \(\vec\Pi\) vers l'âme.</p>
    <p><strong>C3.</strong> La charge reçoit \(R_cI^2=200\ \text{W}\) ; la fraction perdue vaut \(R_a/R_c\approx8\times10^{-4}\), moins de 0,1 % : le câble est un excellent conducteur d'énergie à basse fréquence.</p>
  </div>
