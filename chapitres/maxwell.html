<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties 4.3 « Équations de Maxwell » et 4.4 « Énergie du champ électromagnétique » du programme de PT. Il réunit en une théorie cohérente l'électrostatique, la magnétostatique et l'induction de PTSI, et prépare les chapitres sur les ondes électromagnétiques.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Conservation de la charge</strong> : établir l'équation locale à une dimension ; citer sa forme générale avec la divergence ; la déduire des équations de Maxwell (§2, §3).</li>
        <li><strong>Équations de Maxwell</strong> : les citer, les utiliser et les interpréter sous forme locale et intégrale ; associer Maxwell-Faraday à la loi de Faraday ; relier le couplage entre \(\vec E\) et \(\vec B\) au phénomène de propagation (§3, §9).</li>
        <li><strong>Équations de propagation</strong> des champs dans une région vide de charges et de courants : les établir (§4).</li>
        <li><strong>Champs statiques</strong> : établir leurs lois locales, puis les équations de Poisson et de Laplace (§5).</li>
        <li><strong>ARQS magnétique</strong> : simplifier les équations de Maxwell et la conservation de la charge (\(\operatorname{div}\vec j=0\)) en négligeant les courants de déplacement ; retrouver la loi de Faraday et l'énergie magnétique \(\frac12Li^2\) (§8, §9).</li>
        <li><strong>Énergie</strong> : densité de force et puissance volumique \(\vec j\cdot\vec E\) cédée aux porteurs ; loi d'Ohm locale et effet Joule ; densité d'énergie et vecteur de Poynting ; bilans local et intégral, interprétation de chaque terme ; puissance rayonnée à travers une surface orientée (§6, §7, §10).</li>
      </ul>
      <p>Les relations de passage sont fournies par les énoncés : il faut savoir les exploiter (§5). Les formules d'analyse vectorielle et les opérateurs en coordonnées cylindriques et sphériques sont rappelés ; seules les expressions cartésiennes sont exigibles. <strong>Hors programme</strong> (signalé sur place) : le modèle microscopique de Drude et la conductivité complexe (§6), l'ARQS électrique (comparaison du §8, §10).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · OUTILS D'ANALYSE VECTORIELLE</div>
  <h2>Divergence, rotationnel et théorèmes intégraux</h2>
  <div class="intro">Une loi de l'électromagnétisme peut se lire à deux échelles : globalement (flux à travers une surface, circulation le long d'un contour) ou localement, en chaque point de l'espace. Deux opérateurs différentiels, la divergence et le rotationnel, assurent la traduction ; les théorèmes d'Ostrogradski et de Stokes permettent de passer d'une écriture à l'autre.</div>

  <h3>Les opérateurs en coordonnées cartésiennes</h3>
  <p>On note \(\vec\nabla\) l'opérateur « nabla », de composantes \((\partial_x,\ \partial_y,\ \partial_z)\) avec \(\partial_x = \partial/\partial x\). Pour un champ scalaire \(f(M)\) et un champ vectoriel \(\vec A(M)\) de composantes \((A_x, A_y, A_z)\) :</p>
  <div class="formula">$$\overrightarrow{\operatorname{grad}}\,f=\vec\nabla f=\frac{\partial f}{\partial x}\,\vec e_x+\frac{\partial f}{\partial y}\,\vec e_y+\frac{\partial f}{\partial z}\,\vec e_z$$</div>
  <div class="formula">$$\operatorname{div}\vec A=\vec\nabla\cdot\vec A=\frac{\partial A_x}{\partial x}+\frac{\partial A_y}{\partial y}+\frac{\partial A_z}{\partial z}$$</div>
  <div class="formula">$$\overrightarrow{\operatorname{rot}}\,\vec A=\vec\nabla\wedge\vec A=\begin{pmatrix}\partial_y A_z-\partial_z A_y\\ \partial_z A_x-\partial_x A_z\\ \partial_x A_y-\partial_y A_x\end{pmatrix}$$</div>
  <p>Le <strong>laplacien</strong> scalaire vaut \(\Delta f = \operatorname{div}\big(\overrightarrow{\operatorname{grad}}\,f\big)\), soit \(\Delta f=\partial_x^2 f+\partial_y^2 f+\partial_z^2 f\). En cartésiennes, le laplacien vectoriel \(\Delta\vec A\) a pour composantes \(\Delta A_x\), \(\Delta A_y\), \(\Delta A_z\). Les expressions en coordonnées cylindriques ou sphériques sont fournies par les énoncés.</p>
  <div class="def-box">
    <strong>Sens physique.</strong> La <strong>divergence</strong> est le flux sortant par unité de volume au voisinage d'un point : \(\operatorname{div}\vec A \gt 0\) indique une « source » d'où les lignes de champ s'écartent, \(\operatorname{div}\vec A \lt 0\) un « puits ». Le <strong>rotationnel</strong> mesure la circulation par unité de surface autour d'un point : il traduit le caractère tourbillonnaire du champ.
  </div>

  <h3>Théorèmes intégraux</h3>
  <p>Convention du chapitre : \(\Sigma\) désigne une surface <strong>fermée</strong> (normale \(\vec n_{ext}\) sortante) délimitant un volume \(V\) ; \(S\) désigne une surface <strong>ouverte</strong> s'appuyant sur un contour fermé \(\Gamma\), orientée à partir du sens de parcours de \(\Gamma\) par la règle de la main droite.</p>
  <div class="prop-box">
    <strong>Théorème d'Ostrogradski</strong> (flux–divergence) :
    $$\iint_{\Sigma}\vec A\cdot\vec n_{ext}\,\mathrm dS=\iiint_V \operatorname{div}\vec A\;\mathrm d\tau$$
    <strong>Théorème de Stokes</strong> (circulation–rotationnel) :
    $$\oint_{\Gamma}\vec A\cdot\mathrm d\vec\ell=\iint_S \overrightarrow{\operatorname{rot}}\,\vec A\cdot\vec n\,\mathrm dS$$
  </div>

  <h3>Identités à connaître</h3>
  <div class="formula">$$\operatorname{div}\big(\overrightarrow{\operatorname{rot}}\,\vec A\big)=0 \qquad \overrightarrow{\operatorname{rot}}\big(\overrightarrow{\operatorname{grad}}\,f\big)=\vec 0$$</div>
  <div class="formula">$$\overrightarrow{\operatorname{rot}}\big(\overrightarrow{\operatorname{rot}}\,\vec A\big)=\overrightarrow{\operatorname{grad}}\big(\operatorname{div}\vec A\big)-\Delta\vec A$$</div>
  <div class="formula">$$\operatorname{div}\big(\vec A\wedge\vec C\big)=\vec C\cdot\overrightarrow{\operatorname{rot}}\,\vec A-\vec A\cdot\overrightarrow{\operatorname{rot}}\,\vec C$$</div>
  <div class="prop-box">
    <strong>Conséquences.</strong> Un champ de divergence nulle est <strong>à flux conservatif</strong> : son flux est nul à travers toute surface fermée, donc identique à travers toutes les surfaces qui s'appuient sur un même contour. Un champ de rotationnel nul (sur un domaine sans « trou ») est <strong>à circulation conservative</strong> : c'est un gradient, et sa circulation entre deux points ne dépend pas du chemin suivi.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Calculer la divergence et le rotationnel de \(\vec A = x\,\vec e_x + y\,\vec e_y\) et de \(\vec C = -y\,\vec e_x + x\,\vec e_y\). Lequel « diverge », lequel « tourne » ?</span>
    <div class="content">
      <p>\(\operatorname{div}\vec A = 1+1 = 2\) et \(\overrightarrow{\operatorname{rot}}\,\vec A = \vec 0\) : champ radial qui s'écarte de l'axe \(Oz\), sans tourbillon (c'est le gradient de \((x^2+y^2)/2\)).</p>
      <p>\(\operatorname{div}\vec C = 0\) et \(\overrightarrow{\operatorname{rot}}\,\vec C = (1-(-1))\,\vec e_z = 2\,\vec e_z\) : lignes de champ circulaires autour de \(Oz\), champ purement tourbillonnaire (c'est le champ des vitesses d'une rotation à vitesse angulaire 1).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CONSERVATION DE LA CHARGE</div>
  <h2>Densités de charge et de courant, équation locale de conservation</h2>
  <div class="intro">La charge électrique ne se crée pas et ne disparaît pas : si la charge contenue dans un volume varie, c'est qu'un courant traverse sa frontière. Traduite localement, cette évidence fournit la première équation aux dérivées partielles du chapitre.</div>

  <h3>Densités volumiques</h3>
  <div class="def-box">
    La <strong>densité volumique de charge</strong> \(\rho(M,t)\) (en C·m⁻³) est telle que la charge d'un volume élémentaire vaut \(\mathrm dq = \rho\,\mathrm d\tau\).<br>
    Si le milieu contient plusieurs types de porteurs mobiles (densité particulaire \(n_k\), charge \(q_k\), vitesse moyenne \(\vec v_k\)), la <strong>densité volumique de courant</strong> (en A·m⁻²) est
    $$\vec j=\sum_k n_k\,q_k\,\vec v_k$$
    L'<strong>intensité</strong> à travers une surface orientée \(S\) est le flux de \(\vec j\) : \(I=\iint_S\vec j\cdot\vec n\,\mathrm dS\).
  </div>
  <div class="notice"><strong>Attention</strong> : un conducteur métallique est localement neutre (\(\rho = 0\) : ions fixes et électrons se compensent) et pourtant parcouru par un courant, car seuls les électrons se déplacent. On n'a donc pas \(\vec j = \rho\,\vec v\) avec la charge totale : seule la charge <em>mobile</em> contribue au courant.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Ordre de grandeur</span>
    <span class="prompt">Vitesse moyenne des électrons dans un fil de cuivre de section 2,5 mm² parcouru par 16 A (\(n \approx 8{,}5\times10^{28}\ \text{m}^{-3}\)) ?</span>
    <div class="content"><p>\(v=\dfrac{I}{n\,e\,S}\approx5\times10^{-4}\ \text{m/s}\), soit un demi-millimètre par seconde. Le signal électrique, lui, se propage à une vitesse proche de \(c\) : ce n'est pas le déplacement des électrons qui transporte l'information.</p></div>
  </div>

  <h3>Bilan de charge à une dimension</h3>
  <p>On suppose \(\vec j = j(x,t)\,\vec e_x\) et \(\rho = \rho(x,t)\). On fait le bilan, entre \(t\) et \(t+\mathrm dt\), pour la tranche de section \(S\) comprise entre \(x\) et \(x+\mathrm dx\) :</p>
  <ul>
    <li>variation de la charge contenue : \(\big[\rho(x,t+\mathrm dt)-\rho(x,t)\big]S\,\mathrm dx = \dfrac{\partial\rho}{\partial t}\,S\,\mathrm dx\,\mathrm dt\) ;</li>
    <li>charge entrée en \(x\) moins charge sortie en \(x+\mathrm dx\) : \(\big[j(x,t)-j(x+\mathrm dx,t)\big]S\,\mathrm dt = -\dfrac{\partial j}{\partial x}\,\mathrm dx\,S\,\mathrm dt\).</li>
  </ul>
  <p>En l'absence de création de charge, ces deux quantités sont égales :</p>
  <div class="formula">$$\frac{\partial\rho}{\partial t}+\frac{\partial j}{\partial x}=0$$</div>

  <h3>Généralisation à trois dimensions</h3>
  <p>Pour un volume \(V\) <em>fixe</em> délimité par \(\Sigma\), la charge intérieure \(Q=\iiint_V\rho\,\mathrm d\tau\) ne diminue que par le courant sortant : \(\dfrac{\mathrm dQ}{\mathrm dt}=-\iint_\Sigma\vec j\cdot\vec n_{ext}\,\mathrm dS\). Avec Ostrogradski, \(\iiint_V\Big(\dfrac{\partial\rho}{\partial t}+\operatorname{div}\vec j\Big)\mathrm d\tau=0\) pour tout volume \(V\), d'où :</p>
  <div class="prop-box">
    <strong>Équation locale de conservation de la charge.</strong>
    $$\frac{\partial\rho}{\partial t}+\operatorname{div}\vec j=0$$
    En régime <strong>stationnaire</strong> (\(\partial\rho/\partial t = 0\)) : \(\operatorname{div}\vec j = 0\). Le vecteur \(\vec j\) est alors à flux conservatif : l'intensité est la même à travers toutes les sections d'un tube de courant, et à un nœud la somme des intensités entrantes égale celle des intensités sortantes (<strong>loi des nœuds</strong>).
  </div>
  <div class="notice"><strong>Un moule à retenir</strong> : « variation locale d'une densité + divergence du vecteur flux associé = 0 (ou terme de production) ». Ce même gabarit décrit tout ce qui se conserve ou s'échange : l'énergie électromagnétique (§7), la chaleur en diffusion thermique, la masse d'un fluide en écoulement, \(\partial\mu/\partial t+\operatorname{div}(\mu\vec v)=0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LES ÉQUATIONS DE MAXWELL</div>
  <h2>Quatre équations locales pour le champ électromagnétique</h2>
  <div class="intro">En régime quelconque, le champ électrique \(\vec E(M,t)\) et le champ magnétique \(\vec B(M,t)\) sont liés entre eux et à leurs sources \((\rho,\vec j)\) par quatre équations aux dérivées partielles. Postulées par Maxwell, elles sont validées par toutes leurs conséquences expérimentales, à commencer par l'existence des ondes électromagnétiques.</div>

  <h3>Énoncé (dans le vide, en présence de sources)</h3>
  <div class="prop-box">
    <strong>Maxwell-Gauss (MG)</strong> et <strong>Maxwell-flux (MΦ)</strong> :
    $$\operatorname{div}\vec E=\frac{\rho}{\varepsilon_0} \qquad\qquad \operatorname{div}\vec B=0$$
    <strong>Maxwell-Faraday (MF)</strong> :
    $$\overrightarrow{\operatorname{rot}}\,\vec E=-\frac{\partial\vec B}{\partial t}$$
    <strong>Maxwell-Ampère (MA)</strong> :
    $$\overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\,\vec j+\mu_0\varepsilon_0\,\frac{\partial\vec E}{\partial t}$$
    Constantes : \(\varepsilon_0\approx8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\) (à très peu près), avec \(\mu_0\,\varepsilon_0\,c^2=1\).
  </div>
  <p>Seules deux équations contiennent les sources : (MG) avec \(\rho\), (MA) avec \(\vec j\). Les deux autres, (MΦ) et (MF), ne portent que sur les champs et s'écrivent de la même façon qu'il y ait ou non des charges.</p>

  <h3>Le courant de déplacement</h3>
  <div class="def-box">
    Le terme \(\vec j_D=\varepsilon_0\,\dfrac{\partial\vec E}{\partial t}\), homogène à une densité de courant (A·m⁻²), est appelé <strong>courant de déplacement</strong>. Il ne correspond à aucun mouvement de charges ; (MA) s'écrit \(\overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\big(\vec j+\vec j_D\big)\).
  </div>
  <div class="prop-box">
    <strong>Compatibilité avec la conservation de la charge.</strong> Prenons la divergence de (MA) : comme \(\operatorname{div}(\overrightarrow{\operatorname{rot}}) = 0\),
    $$0=\mu_0\operatorname{div}\vec j+\mu_0\varepsilon_0\frac{\partial}{\partial t}\big(\operatorname{div}\vec E\big)$$
    soit, grâce à (MG), \(\operatorname{div}\vec j+\partial\rho/\partial t=0\). Sans le terme \(\vec j_D\), on obtiendrait \(\operatorname{div}\vec j=0\) en toutes circonstances, ce qui interdirait par exemple la charge d'un condensateur. La conservation de la charge est donc <strong>contenue</strong> dans les équations de Maxwell.
  </div>

  <h3>Formes intégrales</h3>
  <p>En intégrant chaque équation sur un volume (Ostrogradski) ou sur une surface ouverte (Stokes), contours et surfaces étant fixes :</p>
  <p>On note \(\Phi_B=\iint_S\vec B\cdot\vec n\,\mathrm dS\) et \(\Phi_E=\iint_S\vec E\cdot\vec n\,\mathrm dS\) les flux à travers une surface \(S\) qui s'appuie sur \(\Gamma\).</p>
  <p><strong>(MG)</strong> — théorème de Gauss :</p>
  <div class="formula">$$\iint_\Sigma\vec E\cdot\vec n_{ext}\,\mathrm dS=\frac{Q_{int}}{\varepsilon_0}$$</div>
  <p><strong>(MΦ)</strong> — flux magnétique conservatif :</p>
  <div class="formula">$$\iint_\Sigma\vec B\cdot\vec n_{ext}\,\mathrm dS=0$$</div>
  <p><strong>(MF)</strong> — loi de Faraday :</p>
  <div class="formula">$$\oint_\Gamma\vec E\cdot\mathrm d\vec\ell=-\frac{\mathrm d\Phi_B}{\mathrm dt}$$</div>
  <p><strong>(MA)</strong> — théorème d'Ampère généralisé :</p>
  <div class="formula">$$\oint_\Gamma\vec B\cdot\mathrm d\vec\ell=\mu_0\,I_{\text{enlacé}}+\mu_0\varepsilon_0\,\frac{\mathrm d\Phi_E}{\mathrm dt}$$</div>
  <p>La dernière relation est le <strong>théorème d'Ampère généralisé</strong> : au courant enlacé \(I_{\text{enlacé}}\) s'ajoute le flux du courant de déplacement. La deuxième justifie que l'on parle du « flux magnétique à travers un circuit » sans préciser la surface choisie.</p>

  <h3>Champ électromagnétique et superposition</h3>
  <ul>
    <li><strong>Couplage.</strong> (MF) exprime le rotationnel de \(\vec E\) à l'aide de \(\partial_t\vec B\), (MA) celui de \(\vec B\) à l'aide de \(\partial_t\vec E\) : dès que les champs varient, chacun intervient dans le calcul de l'autre. « L'électrique » et « le magnétique » forment alors un objet unique, le <strong>champ électromagnétique</strong> \((\vec E,\vec B)\). C'est ce jeu croisé qui permet à une onde de se propager dans le vide, loin de toute source.</li>
    <li><strong>Linéarité.</strong> Les quatre équations sont linéaires : le champ créé par la réunion de plusieurs distributions est la somme des champs que chacune créerait seule, et multiplier toutes les sources par un même nombre multiplie les champs par ce nombre (<strong>principe de superposition</strong>).</li>
    <li><strong>Symétries.</strong> Si la distribution des sources admet un plan de symétrie à tout instant, les champs le respectent aussi : en un point de ce plan, \(\vec E\) y est contenu et \(\vec B\) lui est orthogonal (rôles échangés pour un plan d'antisymétrie). Les raisonnements de la statique se transposent donc tels quels.</li>
  </ul>
  <div class="notice"><strong>Fin du potentiel « simple »</strong> : en régime variable, \(\overrightarrow{\operatorname{rot}}\,\vec E\neq\vec 0\), donc la circulation de \(\vec E\) entre deux points dépend du chemin. \(\vec E\) n'est plus le gradient d'un potentiel, et une « tension » mesurée par un voltmètre dépend de la position des fils de mesure dès qu'un flux magnétique variable les traverse.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Le champ \(\vec B = B_0\,\dfrac{x}{a}\,\vec e_x\) (avec \(B_0\) et \(a\) constants) peut-il être un champ magnétique ?</span>
    <div class="content"><p>\(\operatorname{div}\vec B = B_0/a \neq 0\) : (MΦ) est violée, ce champ n'est pas un champ magnétique, quelles que soient les sources envisagées. Il faudrait des « charges magnétiques », qu'on n'a jamais observées.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉQUATIONS DE PROPAGATION</div>
  <h2>Du couplage des champs à l'équation de d'Alembert</h2>
  <div class="intro">Dans une région vide de charges et de courants, les équations de Maxwell n'ont plus de sources, et pourtant elles admettent des solutions non nulles : des champs qui s'entretiennent mutuellement en se déplaçant. C'est la prédiction des ondes électromagnétiques, confirmée par Hertz en 1888.</div>
  <div class="method-box">
    <strong>Établir l'équation de propagation du champ électrique</strong> (\(\rho = 0\), \(\vec j = \vec 0\))
    <ol>
      <li>Les équations deviennent \(\operatorname{div}\vec E = 0\), \(\operatorname{div}\vec B = 0\), \(\overrightarrow{\operatorname{rot}}\,\vec E = -\partial_t\vec B\), \(\overrightarrow{\operatorname{rot}}\,\vec B = \mu_0\varepsilon_0\,\partial_t\vec E\).</li>
      <li>On prend le rotationnel de (MF), en permutant dérivées spatiales et temporelle :
        <div class="formula">$$\overrightarrow{\operatorname{rot}}\big(\overrightarrow{\operatorname{rot}}\,\vec E\big) = -\frac{\partial}{\partial t}\overrightarrow{\operatorname{rot}}\,\vec B = -\mu_0\varepsilon_0\,\frac{\partial^2\vec E}{\partial t^2}$$</div></li>
      <li>Identité du double rotationnel, avec \(\operatorname{div}\vec E = 0\) :
        <div class="formula">$$\overrightarrow{\operatorname{rot}}\big(\overrightarrow{\operatorname{rot}}\,\vec E\big) = \overrightarrow{\operatorname{grad}}\big(\operatorname{div}\vec E\big) - \Delta\vec E=-\Delta\vec E$$</div></li>
      <li>D'où l'équation de d'Alembert, et la même pour \(\vec B\) (rotationnel de (MA) et \(\operatorname{div}\vec B = 0\)) :
        <div class="formula" data-nom="Équation de d'Alembert (vide)">$$\Delta\vec E-\frac{1}{c^2}\frac{\partial^2\vec E}{\partial t^2}=\vec 0\qquad\Delta\vec B-\frac{1}{c^2}\frac{\partial^2\vec B}{\partial t^2}=\vec 0\qquad c=\frac{1}{\sqrt{\mu_0\varepsilon_0}}$$</div></li>
    </ol>
  </div>
  <p>Numériquement, avec \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\) et \(\varepsilon_0=8{,}854\times10^{-12}\ \text{F·m}^{-1}\), \(c\approx2{,}998\times10^{8}\ \text{m·s}^{-1}\) : la vitesse de la lumière, que Maxwell a reconnue comme une onde électromagnétique en comparant cette valeur, tirée de mesures électriques, aux mesures optiques. Chaque composante cartésienne des champs obéit à l'équation de d'Alembert déjà rencontrée pour les ondes mécaniques ; ses solutions (ondes planes progressives, monochromatiques…) et la structure des champs sont étudiées dans le chapitre « Ondes électromagnétiques dans le vide ».</p>
  <div class="notice"><strong>Pourquoi le courant de déplacement est indispensable</strong> : sans le terme \(\mu_0\varepsilon_0\,\partial_t\vec E\) de (MA), le rotationnel de (MF) donnerait \(\Delta\vec E = \vec 0\) : aucune propagation. C'est le couplage croisé — un \(\vec B\) variable crée un \(\vec E\) (MF), un \(\vec E\) variable crée un \(\vec B\) (MA) — qui permet aux champs de se propager loin de toute source.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · RETOUR SUR LA STATIQUE · RELATIONS DE PASSAGE</div>
  <h2>Régime permanent et surfaces chargées</h2>
  <div class="intro">Si rien ne dépend du temps, les équations de Maxwell se découplent en deux blocs indépendants : l'électrostatique d'un côté, la magnétostatique de l'autre. On retrouve ainsi, sous forme locale, les théorèmes de Gauss et d'Ampère.</div>

  <h3>Électrostatique</h3>
  <div class="prop-box">
    \(\overrightarrow{\operatorname{rot}}\,\vec E=\vec 0\) (MF sans \(\partial_t\vec B\)) : il existe un potentiel \(V\) tel que \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\), et la circulation de \(A\) à \(B\) vaut \(V(A)-V(B)\). En reportant dans (MG), avec \(\operatorname{div}\big(\overrightarrow{\operatorname{grad}}\,V\big)=\Delta V\), on obtient l'<strong>équation de Poisson</strong>, qui devient l'<strong>équation de Laplace</strong> dans une région vide de charges :
    <div class="formula" data-nom="Équation de Poisson">$$\Delta V+\frac{\rho}{\varepsilon_0}=0 \qquad\qquad \Delta V=0\ \ \text{si}\ \rho=0$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — potentiel dans un faisceau d'électrons (charge d'espace)</strong>
    <p>Un faisceau cylindrique d'axe \(Oz\), de rayon \(a=1{,}0\ \text{mm}\), transporte \(I=1{,}0\ \text{mA}\) d'électrons de vitesse \(v=1{,}0\times10^{7}\ \text{m·s}^{-1}\) ; sa charge volumique \(\rho\) (négative) est uniforme. On donne, pour \(V(r)\), \(\Delta V=\dfrac1r\dfrac{\mathrm d}{\mathrm dr}\Big(r\dfrac{\mathrm dV}{\mathrm dr}\Big)\).</p>
    <ol>
      <li>Charge par unité de longueur : \(\lambda=-I/v=-1{,}0\times10^{-10}\ \text{C·m}^{-1}\), d'où \(\rho=\lambda/(\pi a^2)\approx-3{,}2\times10^{-5}\ \text{C·m}^{-3}\).</li>
      <li>Poisson : \(\dfrac{\mathrm d}{\mathrm dr}\Big(r\dfrac{\mathrm dV}{\mathrm dr}\Big)=-\dfrac{\rho r}{\varepsilon_0}\), donc \(r\dfrac{\mathrm dV}{\mathrm dr}=-\dfrac{\rho r^2}{2\varepsilon_0}\) (constante nulle : champ fini sur l'axe) et \(V(r)=V(0)-\dfrac{\rho r^2}{4\varepsilon_0}\).</li>
      <li>Contrôle par Gauss : \(E_r=-\dfrac{\mathrm dV}{\mathrm dr}=\dfrac{\rho r}{2\varepsilon_0}\), le champ d'un cylindre uniformément chargé.</li>
      <li>Écart de potentiel entre le bord et l'axe : \(V(a)-V(0)=-\dfrac{\lambda}{4\pi\varepsilon_0}\approx+0{,}90\ \text{V}\) (car \(\rho\pi a^2=\lambda\)) : l'axe est un peu plus négatif que le bord, et les électrons sont repoussés vers l'extérieur (le faisceau s'élargit).</li>
    </ol>
  </div>

  <h3>Magnétostatique</h3>
  <div class="prop-box">
    \(\overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\,\vec j\) (forme locale du théorème d'Ampère \(\oint_\Gamma\vec B\cdot\mathrm d\vec\ell=\mu_0 I_{\text{enlacé}}\)) et \(\operatorname{div}\vec B=0\). En prenant la divergence, on obtient \(\operatorname{div}\vec j=0\) : en régime permanent, les lignes de courant se referment sur elles-mêmes.
  </div>
  <div class="notice"><strong>Pourquoi la statique ne suffit pas</strong> : pendant la charge d'un condensateur, appliquons le théorème d'Ampère « statique » à un cercle entourant le fil d'alimentation. Une surface traversée par le fil donne \(I_{\text{enlacé}}=i\) ; une surface en forme de sac passant entre les armatures donne \(I_{\text{enlacé}}=0\). La contradiction disparaît avec le courant de déplacement : entre les armatures, le flux de \(\vec j_D\) vaut exactement \(i\).</div>

  <h3>Relations de passage</h3>
  <p>À la traversée d'une surface portant une charge surfacique \(\sigma\) (C·m⁻² ; <em>dans ce paragraphe seulement, \(\sigma\) n'est pas la conductivité</em>) et un courant surfacique \(\vec j_s\) (A·m⁻¹), les champs subissent une discontinuité. En notant \(\vec n_{12}\) le vecteur unitaire normal à la surface, dirigé du milieu 1 vers le milieu 2 :</p>
  <div class="formula">$$\vec E_2-\vec E_1=\frac{\sigma}{\varepsilon_0}\,\vec n_{12}$$
  $$\vec B_2-\vec B_1=\mu_0\,\vec j_s\wedge\vec n_{12}$$</div>
  <ul>
    <li>la composante <strong>tangentielle</strong> de \(\vec E\) et la composante <strong>normale</strong> de \(\vec B\) sont continues ;</li>
    <li>la composante normale de \(\vec E\) saute de \(\sigma/\varepsilon_0\) ; la composante tangentielle de \(\vec B\) saute de \(\mu_0 j_s\).</li>
  </ul>
  <p>Ces relations, généralement rappelées par les énoncés (il faut surtout savoir les exploiter), restent valables en régime variable. Elles se déduisent des formes intégrales des quatre équations, appliquées à un cylindre et à un rectangle aplatis de part et d'autre de la surface : sur le cylindre, (MG) donne le saut de \(E_n\) et (MΦ) la continuité de \(B_n\) ; sur le rectangle, (MF) donne la continuité de \(E_t\) (le flux de \(\partial\vec B/\partial t\) à travers un rectangle aplati tend vers 0) et (MA) le saut de \(B_t\). Elles ne concernent que les modèles surfaciques : pour une distribution volumique, les champs sont continus.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Une nappe plane \(z=0\) est parcourue par le courant surfacique uniforme \(\vec j_s=j_s\,\vec e_x\). Sachant que \(\vec B=-\dfrac{\mu_0 j_s}{2}\,\vec e_y\) pour \(z \gt 0\) et \(\vec B=+\dfrac{\mu_0 j_s}{2}\,\vec e_y\) pour \(z \lt 0\), vérifier la relation de passage.</span>
    <div class="content"><p>Milieu 1 : \(z \lt 0\), milieu 2 : \(z \gt 0\), donc \(\vec n_{12}=\vec e_z\). D'une part \(\vec B_2-\vec B_1=-\mu_0 j_s\,\vec e_y\) ; d'autre part \(\mu_0\,j_s\,\vec e_x\wedge\vec e_z=-\mu_0 j_s\,\vec e_y\). Les deux membres coïncident : la composante tangentielle de \(\vec B\) saute de \(\mu_0 j_s\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · FORCE DE LORENTZ ET CONDUCTION</div>
  <h2>Action du champ sur les charges, loi d'Ohm locale</h2>
  <div class="intro">Les équations de Maxwell disent comment les sources créent le champ ; la force de Lorentz dit comment le champ agit en retour sur les charges. Dans un métal, cette action, freinée par les collisions des électrons avec les défauts du réseau, conduit à la loi d'Ohm locale.</div>

  <h3>Force de Lorentz et puissance cédée</h3>
  <div class="def-box">
    Une charge \(q\) animée de la vitesse \(\vec v\) subit la <strong>force de Lorentz</strong>
    $$\vec F=q\big(\vec E+\vec v\wedge\vec B\big)$$
    Pour une distribution de charges et de courants, la force volumique vaut \(\rho\,\vec E+\vec j\wedge\vec B\) ; le terme \(\vec j\wedge\vec B\) est la densité de force de Laplace.
  </div>
  <div class="prop-box">
    La partie magnétique ne travaille pas, car \((\vec v\wedge\vec B)\cdot\vec v=0\) : la puissance reçue par une charge est \(q\,\vec E\cdot\vec v\). En sommant sur les porteurs d'un volume \(\mathrm d\tau\), la <strong>puissance volumique cédée par le champ aux charges</strong> est
    $$p=\vec j\cdot\vec E \quad(\text{W·m}^{-3})$$
  </div>

  <h3>Loi d'Ohm locale et effet Joule</h3>
  <div class="prop-box">
    <strong>Loi d'Ohm locale.</strong> Dans un conducteur ohmique homogène, en régime permanent ou lentement variable, la densité de courant est proportionnelle au champ électrique :
    <div class="formula" data-nom="Loi d'Ohm locale">$$\vec j=\sigma\,\vec E$$</div>
    \(\sigma\) est la <strong>conductivité</strong> (S·m⁻¹), réelle et positive, \(1/\sigma\) la résistivité (Ω·m). Pour un conducteur cylindrique homogène de longueur \(\ell\) et de section \(S\), parcouru par un courant uniforme, \(U=E\ell\) et \(I=jS=\sigma ES\) donnent \(R=\dfrac{U}{I}=\dfrac{\ell}{\sigma S}\).
  </div>
  <p><strong>Ordres de grandeur</strong> de \(\sigma\) : cuivre \(\approx6\times10^{7}\ \text{S·m}^{-1}\) ; aluminium \(\approx4\times10^{7}\ \text{S·m}^{-1}\) ; eau de mer \(\approx5\ \text{S·m}^{-1}\) ; eau pure \(\approx5\times10^{-6}\ \text{S·m}^{-1}\) ; verre \(\approx10^{-11}\ \text{S·m}^{-1}\). La loi d'Ohm locale est valable pour un métal tant que le champ varie lentement à l'échelle de \(10^{-14}\ \text{s}\), c'est-à-dire jusqu'à \(10^{12}\ \text{Hz}\) environ : tout le domaine radio et micro-ondes.</p>
  <p>Avec \(\vec j=\sigma\vec E\), la puissance volumique cédée aux porteurs, \(p=\vec j\cdot\vec E=\sigma E^2=j^2/\sigma\), est toujours positive : elle est dissipée sous forme thermique (<strong>effet Joule</strong>, §7).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Champ électrique dans un fil de cuivre de section \(1{,}5\ \text{mm}^2\) parcouru par 10 A ? Puissance dissipée par mètre ?</span>
    <div class="content"><p>\(j=I/S\approx6{,}7\times10^{6}\ \text{A·m}^{-2}\), donc \(E=j/\sigma\approx0{,}11\ \text{V·m}^{-1}\) : quelques dixièmes de volt suffisent sur un mètre de fil. Puissance par mètre : \(p\,S=j^2S/\sigma=I^2/(\sigma S)\approx1{,}1\ \text{W·m}^{-1}\), soit \(RI^2\) avec \(R\approx11\ \text{m}\Omega\) par mètre.</p></div>
  </div>

  <h3>Modèle de Drude (hors programme, pour aller plus loin)</h3>
  <div class="notice"><strong>Hors programme</strong> : aucun modèle microscopique de la loi d'Ohm n'est exigible. Le modèle de Drude qui suit est souvent proposé, guidé, dans les sujets ; il justifie la loi d'Ohm et son domaine de validité.</div>
  <p>Un électron de conduction (masse \(m\), charge \(-e\)) est soumis au champ \(\vec E\) et à une force de frottement \(-\dfrac{m}{\tau}\,\vec v\) qui modélise en moyenne les collisions ; \(\tau\) est un temps de relaxation. On néglige le poids et la force magnétique. Le principe fondamental de la dynamique donne :</p>
  <div class="formula">$$m\frac{\mathrm d\vec v}{\mathrm dt}=-e\,\vec E-\frac{m}{\tau}\,\vec v$$</div>
  <p>En régime permanent, \(\vec v=-\dfrac{e\tau}{m}\,\vec E\), d'où \(\vec j=-n e\vec v\) proportionnel à \(\vec E\) : on retrouve la loi d'Ohm, avec la conductivité <strong>statique</strong></p>
  <div class="formula">$$\sigma_0=\frac{n\,e^2\,\tau}{m}$$</div>
  <p>(\(\sigma=\sigma_0\) à basse fréquence). Pour le cuivre (\(n\approx8{,}5\times10^{28}\ \text{m}^{-3}\), \(\sigma_0\approx6\times10^{7}\ \text{S·m}^{-1}\)), on en déduit \(\tau=m\sigma_0/(ne^2)\approx2{,}5\times10^{-14}\ \text{s}\).</p>
  <p><strong>Conductivité complexe.</strong> Avec un champ \(\underline{\vec E}=\vec E_0\,e^{i\omega t}\) (on note \(i^2=-1\) ; certains cours écrivent \(j\)), le régime forcé vérifie \(i\omega m\,\underline{\vec v}=-e\underline{\vec E}-\dfrac{m}{\tau}\underline{\vec v}\), d'où :</p>
  <div class="formula">$$\underline{\vec j}=\underline{\sigma}\,\underline{\vec E} \qquad\text{avec}\qquad \underline{\sigma}=\frac{\sigma_0}{1+i\omega\tau}$$</div>
  <ul>
    <li><strong>Basses fréquences</strong>, \(\omega\tau\ll1\) : \(\underline\sigma\approx\sigma_0\), réel ; \(\vec j\) et \(\vec E\) sont en phase. Pour un métal, c'est le cas jusqu'à \(10^{12}\ \text{Hz}\) environ (\(1/(2\pi\tau)\approx6\times10^{12}\ \text{Hz}\) pour le cuivre) : tout le domaine radio, donc toute l'électrocinétique.</li>
    <li><strong>Hautes fréquences</strong>, \(\omega\tau\gg1\) : \(\underline\sigma\approx-i\,\dfrac{\sigma_0}{\omega\tau}=-i\,\dfrac{ne^2}{m\omega}\), imaginaire pur ; \(\vec j\) est en quadrature retard sur \(\vec E\) et la puissance moyenne cédée est nulle : les collisions ne jouent plus, les électrons oscillent librement.</li>
  </ul>
  <div class="prop-box">
    <strong>Puissance moyenne.</strong> Pour \(\vec E=\vec E_0\cos\omega t\) :
    $$\langle\vec j\cdot\vec E\rangle=\frac12\,\operatorname{Re}(\underline\sigma)\,E_0^2=\frac{\sigma_0E_0^2}{2\,(1+\omega^2\tau^2)}$$
  </div>
  <div class="notice"><strong>Neutralité d'un conducteur</strong> : en combinant conservation de la charge, loi d'Ohm et (MG), une charge volumique en excès dans un conducteur disparaît avec la constante de temps \(\varepsilon_0/\sigma\), de l'ordre de \(10^{-19}\ \text{s}\) pour le cuivre (voir l'exercice 1). Dans un conducteur ohmique, on prend donc \(\rho=0\) : les charges éventuelles sont en surface.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉNERGIE ÉLECTROMAGNÉTIQUE</div>
  <h2>Densité d'énergie, vecteur de Poynting, bilan local</h2>
  <div class="intro">Le champ électromagnétique stocke de l'énergie et la transporte. Comme pour la charge, un bilan local relie la variation de l'énergie contenue dans un volume, le flux d'énergie à travers sa frontière et l'énergie échangée avec la matière.</div>

  <div class="def-box">
    La <strong>densité volumique d'énergie électromagnétique</strong> (J·m⁻³) et le <strong>vecteur de Poynting</strong> (W·m⁻²) sont
    $$u_{em}=\frac{\varepsilon_0E^2}{2}+\frac{B^2}{2\mu_0} \qquad\qquad \vec\Pi=\frac{\vec E\wedge\vec B}{\mu_0}$$
    La puissance électromagnétique qui traverse un élément de surface \(\mathrm dS\) dans le sens de \(\vec n\) est \(\mathrm dP=\vec\Pi\cdot\vec n\,\mathrm dS\) (le vecteur de Poynting est noté \(\vec R\) dans certains ouvrages).
  </div>
  <div class="prop-box">
    <strong>Bilan local de Poynting.</strong>
    $$\frac{\partial u_{em}}{\partial t}+\operatorname{div}\vec\Pi=-\vec j\cdot\vec E$$
    Forme intégrale, pour un volume fixe \(V\) de frontière \(\Sigma\) :
    $$-\frac{\mathrm dU_{em}}{\mathrm dt}=\iint_\Sigma\vec\Pi\cdot\vec n_{ext}\,\mathrm dS+\iiint_V\vec j\cdot\vec E\,\mathrm d\tau$$
    L'énergie électromagnétique perdue par le volume sort à travers \(\Sigma\) (puissance rayonnée) ou est cédée aux porteurs de charge.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir le bilan local à partir de (MF) et (MA).</span>
    <div class="content">
      <p>On part de l'identité (§1)</p>
      <div class="formula">$$\operatorname{div}(\vec E\wedge\vec B)=\vec B\cdot\overrightarrow{\operatorname{rot}}\,\vec E-\vec E\cdot\overrightarrow{\operatorname{rot}}\,\vec B$$</div>
      <p>puis on utilise (MF) et (MA) :</p>
      <div class="formula">$$\operatorname{div}(\vec E\wedge\vec B)=-\vec B\cdot\frac{\partial\vec B}{\partial t}-\mu_0\,\vec j\cdot\vec E$$
      $$\qquad\qquad-\,\mu_0\varepsilon_0\,\vec E\cdot\frac{\partial\vec E}{\partial t}$$</div>
      <p>Or \(\vec B\cdot\partial_t\vec B=\partial_t(B^2/2)\) et \(\vec E\cdot\partial_t\vec E=\partial_t(E^2/2)\). En divisant par \(\mu_0\) : \(\operatorname{div}\vec\Pi=-\partial_t u_{em}-\vec j\cdot\vec E\).</p>
    </div>
  </div>
  <div class="notice"><strong>Même structure que la charge</strong> : \(u_{em}\) joue le rôle de \(\rho\), \(\vec\Pi\) celui de \(\vec j\). Mais il y a un terme d'échange, \(-\vec j\cdot\vec E\) : l'énergie électromagnétique seule n'est pas conservée en présence de charges mobiles. Dans une région vide de courants, \(\partial_t u_{em}+\operatorname{div}\vec\Pi=0\).</div>

  <h3>Effet Joule</h3>
  <p>Dans un conducteur ohmique (\(\vec j=\sigma\vec E\), \(\sigma\) réel), la puissance volumique cédée aux porteurs est toujours positive et dissipée sous forme thermique :</p>
  <div class="formula">$$p_J=\vec j\cdot\vec E=\frac{j^2}{\sigma}=\sigma E^2$$</div>
  <p>Pour un fil de longueur \(\ell\) et de section \(S\) parcouru par un courant uniforme \(I\) : \(P_J=\dfrac{(I/S)^2}{\sigma}\,S\ell=RI^2\) avec \(R=\dfrac{\ell}{\sigma S}\).</p>
  <div class="method-box">
    <strong>Exemple — par où entre l'énergie dissipée dans un fil ?</strong>
    <p>Fil cylindrique de rayon \(a\), de longueur \(\ell\), parcouru par un courant continu \(I\) sous la tension \(U\).</p>
    <ol>
      <li>À la surface du fil, \(\vec E=\dfrac{U}{\ell}\,\vec e_z\) (composante tangentielle, continue) et \(\vec B=\dfrac{\mu_0 I}{2\pi a}\,\vec e_\theta\) (théorème d'Ampère).</li>
      <li>Comme \(\vec e_z\wedge\vec e_\theta=-\vec e_r\), le vecteur de Poynting \(\vec\Pi=\dfrac{\vec E\wedge\vec B}{\mu_0}=-\dfrac{UI}{2\pi a\ell}\,\vec e_r\) pointe vers l'axe.</li>
      <li>Puissance entrant par la surface latérale : \(\dfrac{UI}{2\pi a\ell}\times2\pi a\ell=UI=RI^2\), exactement la puissance Joule. Les bases du fil ne contribuent pas (\(\vec\Pi\) leur est tangent).</li>
    </ol>
    <p>L'énergie ne « coule » pas dans le fil avec les électrons : elle est transportée par le champ qui entoure les conducteurs et pénètre latéralement dans le fil, où elle est dissipée.</p>
    <p><em>En chiffres :</em> fil de cuivre de rayon \(a=1{,}0\ \text{mm}\) et de longueur \(\ell=1{,}0\ \text{m}\) (\(R=\ell/(\sigma\pi a^2)\approx5{,}3\ \text{m}\Omega\)) parcouru par \(I=10\ \text{A}\) : \(U=RI\approx53\ \text{mV}\), et \(\|\vec\Pi\|=\dfrac{UI}{2\pi a\ell}\approx84\ \text{W·m}^{-2}\) à la surface ; multiplié par l'aire latérale \(2\pi a\ell\approx6{,}3\times10^{-3}\ \text{m}^2\), ce flux redonne \(RI^2\approx0{,}53\ \text{W}\).</p>
  </div>
  <div class="notice"><strong>Lire le bilan terme à terme</strong> : \(\partial u_{em}/\partial t\) est la puissance stockée par unité de volume dans le champ ; \(\operatorname{div}\vec\Pi\) est la puissance qui <em>sort</em> d'un petit volume, par unité de volume (flux net du vecteur de Poynting) ; \(\vec j\cdot\vec E\) est la puissance cédée aux porteurs (dissipée par effet Joule dans un conducteur ohmique, convertie en énergie cinétique dans un faisceau, ou fournie par les porteurs au champ si \(\vec j\cdot\vec E\lt0\), comme dans un générateur). Pour une puissance <em>rayonnée</em> à travers une surface ouverte, on oriente la surface puis on calcule \(P=\iint_S\vec\Pi\cdot\vec n\,\mathrm dS\) : un résultat négatif signifie que l'énergie traverse dans le sens opposé à \(\vec n\).</div>
  <figure class="schema">

  <h3>Ordres de grandeur</h3>
  <p>Dans un champ \(B=1\ \text{T}\) (IRM), \(B^2/(2\mu_0)\approx4\times10^5\ \text{J·m}^{-3}\). Pour stocker la même densité sous forme électrique, il faudrait \(E=cB=3\times10^8\ \text{V·m}^{-1}\), cent fois plus que le champ de claquage de l'air (\(\approx3\times10^6\ \text{V·m}^{-1}\)). En pratique, les grandes densités d'énergie sont magnétiques. Côté flux, l'éclairement solaire au sol est de l'ordre de \(1\ \text{kW·m}^{-2}\).</p>

<div class="course-section">
  <div class="sec-num">§8 · APPROXIMATION DES RÉGIMES QUASI STATIONNAIRES</div>
  <h2>ARQS : quand peut-on négliger la propagation ?</h2>
  <div class="intro">Les champs se propagent à la vitesse finie \(c\). Dans un dispositif de taille \(L\), une perturbation met un temps \(L/c\) pour le traverser. Si ce délai est négligeable devant la durée caractéristique \(T\) des variations, les champs suivent les sources « instantanément » : c'est l'approximation des régimes quasi stationnaires.</div>

  <div class="def-box">
    <strong>Critère de l'ARQS.</strong> Pour des signaux de période \(T\) (fréquence \(f\)) dans un dispositif de taille \(L\) :
    $$\frac{L}{c}\ll T \quad\Longleftrightarrow\quad L\ll\lambda=\frac{c}{f}$$
    On néglige alors les retards dus à la propagation : à l'instant \(t\), les champs se calculent à partir des sources au même instant \(t\), avec les lois de la statique adaptées.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Situation</th><th style="padding:.35rem;border:1px solid var(--grid)">\(f\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(\lambda=c/f\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(L\)</th><th style="padding:.35rem;border:1px solid var(--grid)">ARQS ?</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Installation domestique</td><td style="padding:.35rem;border:1px solid var(--grid)">50 Hz</td><td style="padding:.35rem;border:1px solid var(--grid)">6 000 km</td><td style="padding:.35rem;border:1px solid var(--grid)">50 m</td><td style="padding:.35rem;border:1px solid var(--grid)">oui</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Ligne THT longue</td><td style="padding:.35rem;border:1px solid var(--grid)">50 Hz</td><td style="padding:.35rem;border:1px solid var(--grid)">6 000 km</td><td style="padding:.35rem;border:1px solid var(--grid)">800 km</td><td style="padding:.35rem;border:1px solid var(--grid)">non (déphasages)</td></tr>

    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Carte Wi-Fi</td><td style="padding:.35rem;border:1px solid var(--grid)">2,4 GHz</td><td style="padding:.35rem;border:1px solid var(--grid)">12,5 cm</td><td style="padding:.35rem;border:1px solid var(--grid)">5 cm</td><td style="padding:.35rem;border:1px solid var(--grid)">non</td></tr>
  </table></div>
  <p>Pour fixer un seuil chiffré, on peut regarder le déphasage introduit par la propagation d'un bout à l'autre du dispositif, \(\Delta\varphi=2\pi L/\lambda\), et exiger qu'il reste de quelques centièmes de radian. Sur une paillasse de TP, la condition est très largement remplie en audio ; elle cesse d'être évidente vers les dizaines de mégahertz (\(\lambda\) de l'ordre de 10 m), où l'on soigne la connectique (câbles coaxiaux, adaptation). Dans un câble, les signaux se propagent moins vite que dans le vide (typiquement \(2c/3\)) : on compare alors \(L\) à \(v/f\).</p>

  <h3>Conséquence pour les courants</h3>
  <div class="prop-box">
    Dans les conducteurs, les accumulations de charge sont négligeables en ARQS (sauf sur les armatures des condensateurs) : on néglige \(\partial\rho/\partial t\) et la conservation de la charge devient \(\operatorname{div}\vec j\approx0\). Le vecteur \(\vec j\) est à flux conservatif : à un instant donné, l'intensité est la même en tout point d'une branche et la <strong>loi des nœuds</strong> reste valable en régime variable. C'est ce qui fonde l'électrocinétique.
  </div>

  <h3>Deux cas limites</h3>
  <p>À critère \(L\ll\lambda\) donné, la nature du dispositif impose ce que l'on peut encore négliger. <strong>Seule l'ARQS magnétique est au programme de PT</strong> ; la colonne de droite est donnée pour comparaison.</p>

    <span class="prompt">Comparer le courant de déplacement et le courant de conduction dans du cuivre, à 1 GHz.</span>
    <div class="content"><p>En régime sinusoïdal, \(|\vec j_D|/|\vec j|=\varepsilon_0\omega/\sigma\), soit environ \(10^{-9}\) à 1 GHz pour \(\sigma=6\times10^{7}\ \text{S·m}^{-1}\). Dans un métal, le courant de déplacement reste négligeable tant que la conductivité peut être prise réelle (\(\omega\tau\ll1\), c'est-à-dire jusqu'à l'infrarouge lointain) : l'ARQS magnétique s'y applique dès que \(L\ll\lambda\). Il redevient du même ordre que le courant de conduction vers la pulsation plasma, dans l'ultraviolet (voir le chapitre sur les ondes dans les conducteurs).</p></div>

<div class="course-section">
  <div class="sec-num">§9 · ARQS MAGNÉTIQUE</div>
  <h2>Induction, inductance et énergie magnétique</h2>
  <div class="intro">L'ARQS magnétique est le cadre des circuits usuels : bobines, transformateurs, machines électriques. On y retrouve la loi de Faraday comme conséquence de (MF) et l'inductance comme une mesure de l'énergie stockée dans le champ magnétique.</div>

  <h3>Équations</h3>
  <div class="formula">$$\operatorname{div}\vec E=\frac{\rho}{\varepsilon_0} \qquad \operatorname{div}\vec B=0$$</div>
  <div class="formula">$$\overrightarrow{\operatorname{rot}}\,\vec E=-\frac{\partial\vec B}{\partial t} \qquad \overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\,\vec j$$</div>
  <p>Le champ \(\vec B(M,t)\) se calcule comme en magnétostatique (théorème d'Ampère, superposition) avec les courants pris au même instant. Exemple : à l'intérieur d'un solénoïde long à \(n\) spires par mètre, \(\vec B=\mu_0\,n\,i(t)\,\vec e_z\). En revanche, (MF) garde son terme de couplage : le champ électrique n'est pas celui de la statique.</p>
  <div class="prop-box">
    <strong>Conservation de la charge en ARQS magnétique.</strong> La divergence de \(\overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\vec j\) est nulle, donc
    $$\operatorname{div}\vec j=0$$
    alors que l'équation exacte est \(\partial\rho/\partial t+\operatorname{div}\vec j=0\) : négliger le courant de déplacement revient à négliger \(\partial\rho/\partial t\), c'est-à-dire les accumulations de charges. Les lignes de courant se referment, l'intensité est la même tout le long d'une branche et la loi des nœuds s'applique à chaque instant (§8).
  </div>

  <h3>De Maxwell-Faraday à la loi de Faraday</h3>
  <div class="prop-box">
    Pour un circuit filiforme <strong>fixe</strong> \(\Gamma\), la force électromotrice induite est la circulation du champ électrique ; par Stokes et (MF) :
    $$e=\oint_\Gamma\vec E\cdot\mathrm d\vec\ell=\iint_S\overrightarrow{\operatorname{rot}}\,\vec E\cdot\vec n\,\mathrm dS=-\frac{\mathrm d\Phi}{\mathrm dt}$$
    C'est l'induction de Neumann (champ variable, circuit fixe). Pour un circuit mobile dans un champ permanent (induction de Lorentz), c'est la force \(q\,\vec v\wedge\vec B\) qui met les charges en mouvement, et l'on retrouve encore \(e=-\mathrm d\Phi/\mathrm dt\).
  </div>
  <div class="notice"><strong>Pourquoi un champ électrostatique ne peut pas entretenir un courant</strong> dans une boucle ohmique fermée : sa circulation sur la boucle est nulle, alors que \(\oint\vec j\cdot\mathrm d\vec\ell/\sigma\) serait strictement positive. Il faut soit un générateur (forces non électrostatiques), soit un champ électrique induit, de rotationnel non nul.</div>

  <div class="method-box">
    <strong>Exemple — champ électrique induit par un solénoïde dont le courant varie</strong>
    <p>Solénoïde infini de rayon \(a\), \(n\) spires par mètre, courant \(i(t)\) : \(\vec B = \mu_0 n i(t)\,\vec e_z\) à l'intérieur, nul à l'extérieur (ARQS magnétique).</p>
    <ol>
      <li>Symétries : tout plan contenant l'axe est plan d'antisymétrie des courants ; le champ électrique, vrai vecteur comme \(\vec j\), lui est donc orthogonal. Avec l'invariance par rotation et par translation : \(\vec E = E_\theta(r,t)\,\vec e_\theta\), lignes de champ circulaires autour de l'axe.</li>
      <li>Forme intégrale de (MF) sur un cercle d'axe \(Oz\) et de rayon \(r\) : \(2\pi r E_\theta = -\dfrac{\mathrm d\Phi_B}{\mathrm dt}\).</li>
      <li>Pour \(r \lt a\) : \(\Phi_B = \pi r^2 B\), d'où \(E_\theta = -\dfrac{r}{2}\dfrac{\mathrm dB}{\mathrm dt}\). Pour \(r \gt a\) : \(\Phi_B = \pi a^2 B\), d'où \(E_\theta = -\dfrac{a^2}{2r}\dfrac{\mathrm dB}{\mathrm dt}\).</li>
      <li>Le champ électrique induit existe <strong>hors</strong> du solénoïde, là où \(\vec B = \vec 0\) : seul compte le flux enlacé. Une spire de fil entourant le solénoïde est le siège d'une f.é.m. \(e = -\pi a^2\,\mathrm dB/\mathrm dt\), quel que soit son rayon : c'est le principe du transformateur.</li>
    </ol>
  </div>

  <h3>Inductance propre et énergie magnétique</h3>
  <p>Solénoïde de longueur \(\ell\), de section \(S\), à \(N=n\ell\) spires, assez long pour négliger les effets de bord (champ nul à l'extérieur) :</p>
  <ul>
    <li>flux propre : \(\Phi=N\,B\,S=\mu_0 n^2\ell S\,i\), d'où l'inductance \(L=\dfrac{\Phi}{i}=\mu_0 n^2\ell S=\dfrac{\mu_0N^2S}{\ell}\) ;</li>
    <li>énergie magnétique : \(U_m=\displaystyle\iiint\frac{B^2}{2\mu_0}\,\mathrm d\tau=\frac{(\mu_0 n i)^2}{2\mu_0}\,S\ell=\frac12\,L\,i^2\).</li>
  </ul>
  <div class="prop-box">
    <strong>Énergie magnétique et inductance.</strong> Pour un circuit parcouru par \(i\), en ARQS magnétique :
    $$U_m=\iiint_{\text{espace}}\frac{B^2}{2\mu_0}\,\mathrm d\tau=\frac12\,L\,i^2$$
    Cette égalité fournit une seconde méthode de calcul de \(L\), utile quand le flux est malcommode à exprimer (câble coaxial, bobine torique).
  </div>
  <p>Ordre de grandeur : \(N=1000\) spires, \(\ell=20\ \text{cm}\), rayon \(2{,}5\ \text{cm}\) donnent \(L=\mu_0N^2\pi a^2/\ell\approx12\ \text{mH}\).</p>

  <h3>Par où l'énergie entre-t-elle dans une bobine ?</h3>
  <p>Quand \(i\) varie, (MF) impose un champ électrique induit dans le solénoïde (de rayon \(a\)). Par symétrie de révolution, il est orthoradial, \(E_\theta(r,t)\,\vec e_\theta\) ; sa circulation sur un cercle d'axe \(Oz\) et de rayon \(r\lt a\) vaut \(2\pi r\,E_\theta=-\pi r^2\,\mathrm dB/\mathrm dt\), d'où :</p>
  <div class="formula">$$E_\theta=-\frac{r}{2}\,\frac{\mathrm dB}{\mathrm dt}=-\frac{\mu_0 n r}{2}\,\frac{\mathrm di}{\mathrm dt}$$</div>
  <p>Associé au champ axial \(\vec B\), ce champ donne un vecteur de Poynting radial, \(\vec\Pi=\dfrac{E_\theta B}{\mu_0}\,\vec e_r\). La puissance qui <em>entre</em> par la surface latérale (rayon \(a\), longueur \(\ell\)) vaut \(-\Pi(a)\times2\pi a\ell=\mu_0n^2\pi a^2\ell\;i\,\dfrac{\mathrm di}{\mathrm dt}=L\,i\,\dfrac{\mathrm di}{\mathrm dt}\). On reconnaît à la fois \(\dfrac{\mathrm d}{\mathrm dt}\Big(\dfrac12Li^2\Big)\) et la puissance électrique \(u\,i\) reçue par une bobine idéale (\(u=L\,\mathrm di/\mathrm dt\)) : l'énergie fournie par le circuit transite par le champ et se stocke sous forme magnétique. L'énergie électrique associée à \(E_\theta\) reste négligeable : son rapport à l'énergie magnétique est d'ordre \((a\omega/c)^2\).</p>
</div>

<div class="course-section">
  <div class="sec-num">§10 · COURANT DE DÉPLACEMENT DANS UN CONDENSATEUR</div>
  <h2>Le condensateur en régime variable</h2>
  <div class="intro">Dans l'espace entre les armatures d'un condensateur, aucun courant de conduction ne circule : ce sont les charges accumulées qui dominent. Le champ électrique y suit, à chaque instant, les lois de l'électrostatique. L'ARQS électrique n'est pas au programme de PT, mais l'exemple du condensateur éclaire le rôle du courant de déplacement, qui l'est.</div>

</figure>

  <p>Condensateur plan, armatures d'aire \(S\) distantes de \(e\) (petit devant leurs dimensions), portant les charges \(\pm q(t)\) ; on néglige les effets de bord.</p>
  <div class="prop-box">
    <strong>Champ et capacité.</strong> À chaque instant, \(\vec E=\dfrac{q(t)}{\varepsilon_0S}\,\vec e_z\) entre les armatures, comme en électrostatique ; la tension vaut \(u=Ee\), d'où
    $$q=C\,u \qquad\text{avec}\qquad C=\frac{\varepsilon_0S}{e}$$
    La capacité garde son sens en régime variable. L'énergie stockée est \(U_e=\displaystyle\iiint\frac{\varepsilon_0E^2}{2}\,\mathrm d\tau=\frac{q^2}{2C}=\frac12\,C\,u^2\).
  </div>
  <div class="prop-box">
    <strong>Continuité du courant.</strong> Le courant \(i=\mathrm dq/\mathrm dt\) arrive sur l'armature positive. Entre les armatures, le courant de déplacement \(\vec j_D=\varepsilon_0\,\partial\vec E/\partial t=\dfrac{1}{S}\,\dfrac{\mathrm dq}{\mathrm dt}\,\vec e_z\) a pour flux \(i\) : il prend le relais du courant de conduction, et \(\vec j+\vec j_D\) est à flux conservatif sur tout le circuit.
  </div>
  <p>Le champ magnétique entre les armatures, créé par \(\vec j_D\), est orthoradial. Pour des armatures circulaires de rayon \(R\), le théorème d'Ampère généralisé sur un cercle de rayon \(r \lt R\) donne \(B_\theta=\dfrac{\mu_0\,r\,i}{2\pi R^2}\). Ce champ reste faible : l'énergie magnétique qu'il porte est négligeable devant l'énergie électrique tant que les armatures sont petites devant la longueur d'onde, \(R\ll c/\omega\).</p>
  <div class="method-box">
    <strong>Exemple — d'où vient l'énergie stockée par un condensateur qui se charge ?</strong>
    <p>Armatures circulaires de rayon \(R=5{,}0\ \text{cm}\), distantes de \(e=1{,}0\ \text{mm}\), chargées par un courant \(i=10\ \text{mA}\) alors que la tension vaut \(u=10\ \text{V}\).</p>
    <ol>
      <li>L'armature positive est en \(z=0\), l'autre en \(z=e\) : entre elles, \(\vec E=\dfrac{u}{e}\,\vec e_z\), soit \(1{,}0\times10^{4}\ \text{V·m}^{-1}\). Au bord (\(r=R\)), Ampère généralisé (flux de \(\vec j_D\) égal à \(i\)) donne \(\vec B=\dfrac{\mu_0 i}{2\pi R}\,\vec e_\theta\), soit \(4{,}0\times10^{-8}\ \text{T}\).</li>
      <li>Comme \(\vec e_z\wedge\vec e_\theta=-\vec e_r\), le vecteur de Poynting \(\vec\Pi=\dfrac{\vec E\wedge\vec B}{\mu_0}=-\dfrac{u\,i}{2\pi Re}\,\vec e_r\) est dirigé vers l'axe pendant la charge ; sa norme vaut \(\approx3{,}2\times10^{2}\ \text{W·m}^{-2}\).</li>
      <li>Puissance entrant par la surface latérale (aire \(2\pi Re\)) : \(\|\vec\Pi\|\,2\pi Re=u\,i=0{,}10\ \text{W}\), exactement \(\dfrac{\mathrm d}{\mathrm dt}\Big(\dfrac{q^2}{2C}\Big)=\dfrac{q}{C}\,\dfrac{\mathrm dq}{\mathrm dt}=u\,i\).</li>
    </ol>
    <p>L'énergie n'arrive pas « par les fils » : elle entre dans l'espace inter-armatures par sa périphérie, portée par le champ.</p>
  </div>
  <div class="notice"><strong>Bilan</strong> : statique et ARQS se ressemblent mais ne se confondent pas. En ARQS magnétique, l'induction subsiste ; en ARQS électrique, le courant de déplacement subsiste. Ce sont précisément ces termes « résiduels » qui font fonctionner bobines et condensateurs en régime variable.</div>
</div>

<template class="pan-tpl" data-panneau="mxw-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · MAXWELL ET ARQS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à passer des lois locales aux lois intégrales, à calculer un champ en régime variable, à établir une équation (conservation, propagation, Poisson), à faire un bilan d'énergie avec le vecteur de Poynting et à décider si l'ARQS magnétique s'applique. Les notations sont celles du cours : (MG), (MΦ), (MF), (MA), \(\Sigma\) surface fermée de normale sortante, \(S\) surface ouverte orientée par son contour \(\Gamma\).</div>

  <div class="method-box">
    <strong>Méthode 1 — Passer d'une équation locale à sa forme intégrale (et retour)</strong>
    <ol>
      <li><span class="step">Repérer l'opérateur.</span> Une divergence appelle un flux à travers une surface fermée (Ostrogradski) ; un rotationnel appelle une circulation sur un contour fermé (Stokes).</li>
      <li><span class="step">Intégrer.</span> Intégrer l'équation locale sur le volume \(V\) (ou la surface ouverte \(S\)) choisi pour coller aux symétries, puis appliquer le théorème. Contour et surface fixes : la dérivée temporelle sort de l'intégrale.</li>
      <li><span class="step">Sens inverse.</span> Écrire la loi intégrale pour un volume (ou une surface) <em>quelconque</em>, la transformer en une intégrale unique, puis conclure que l'intégrande est nulle partout puisque le domaine est arbitraire.</li>
      <li><span class="step">Contrôler.</span> Normale sortante pour une surface fermée ; règle de la main droite entre \(\Gamma\) et \(S\) ; signe des termes sources (\(Q_{int}/\varepsilon_0\), \(\mu_0 I_{\text{enlacé}}\), \(-\mathrm d\Phi_B/\mathrm dt\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> dans une région, \(\vec E=\alpha\,(x\,\vec e_x+y\,\vec e_y+z\,\vec e_z)\) avec \(\alpha=1{,}0\times10^{4}\ \text{V·m}^{-2}\). (MG) donne \(\rho=\varepsilon_0\operatorname{div}\vec E=3\varepsilon_0\alpha\), soit \(\rho\approx2{,}7\times10^{-7}\ \text{C·m}^{-3}\). Contrôle intégral sur une sphère de rayon \(R=10\ \text{cm}\) : \(\vec E\cdot\vec n_{ext}=\alpha R\), flux \(4\pi R^2\cdot\alpha R\approx1{,}3\times10^{2}\ \text{V·m}\), égal à \(\rho\,\frac43\pi R^3/\varepsilon_0=4\pi\alpha R^3\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Établir une équation locale de conservation par un bilan à une dimension</strong>
    <ol>
      <li><span class="step">Système.</span> Tranche fixe de section \(S\) entre \(x\) et \(x+\mathrm dx\), entre \(t\) et \(t+\mathrm dt\) ; densité \(\rho(x,t)\) et densité de courant \(j(x,t)\,\vec e_x\).</li>
      <li><span class="step">Variation du contenu.</span> \(\big[\rho(x,t+\mathrm dt)-\rho(x,t)\big]S\,\mathrm dx=\partial_t\rho\;S\,\mathrm dx\,\mathrm dt\).</li>
      <li><span class="step">Échanges.</span> Entré en \(x\) moins sorti en \(x+\mathrm dx\) : \(\big[j(x)-j(x+\mathrm dx)\big]S\,\mathrm dt=-\partial_xj\;S\,\mathrm dx\,\mathrm dt\). Pas de création de charge.</li>
      <li><span class="step">Conclure</span> : \(\partial_t\rho+\partial_xj=0\), puis généraliser : \(\partial_t\rho+\operatorname{div}\vec j=0\). Même gabarit pour l'énergie (avec un terme d'échange \(-\vec j\cdot\vec E\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> dans une zone \(0\lt x\lt L\) (\(L=1{,}0\ \text{cm}\)), on impose \(j=j_0\,x/L\) avec \(j_0=2{,}0\ \text{A·m}^{-2}\). Alors \(\partial_t\rho=-j_0/L=-2{,}0\times10^{2}\ \text{C·m}^{-3}\text{·s}^{-1}\) : la zone se vide de sa charge positive, puisqu'il en sort davantage en \(x=L\) qu'il n'en entre en \(x=0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Calculer un champ en régime variable avec les formes intégrales</strong>
    <ol>
      <li><span class="step">Symétries et invariances</span> des sources à l'instant \(t\) : \(\vec E\) (vrai vecteur) est contenu dans les plans de symétrie et orthogonal aux plans d'antisymétrie ; \(\vec B\) (pseudo-vecteur) fait l'inverse. En déduire direction et variables.</li>
      <li><span class="step">Choisir l'outil.</span> Surface de Gauss pour \(\vec E\) créé par des charges (MG) ; contour pour \(\vec B\) (Ampère généralisé) ou pour un \(\vec E\) induit (Faraday). La « source » d'un \(\vec E\) induit est \(-\partial_t\vec B\), comme \(\mu_0\vec j\) est celle de \(\vec B\) : mêmes raisonnements de symétrie.</li>
      <li><span class="step">Calculer</span> la circulation, puis le terme source : \(\mu_0\big(I_{\text{enlacé}}+\varepsilon_0\,\mathrm d\Phi_E/\mathrm dt\big)\) ou \(-\mathrm d\Phi_B/\mathrm dt\).</li>
      <li><span class="step">Vérifier</span> : continuité en l'absence de sources surfaciques, champ fini sur l'axe, signe conforme à la loi de Lenz.</li>
    </ol>
    <p><em>Exemple éclair :</em> solénoïde de rayon \(a=2{,}0\ \text{cm}\) où \(\mathrm dB/\mathrm dt=50\ \text{T·s}^{-1}\). Sur un cercle d'axe \(Oz\) : \(E_\theta=-\dfrac r2\dfrac{\mathrm dB}{\mathrm dt}\) pour \(r\lt a\) (soit \(0{,}50\ \text{V·m}^{-1}\) en \(r=a\)) et \(E_\theta=-\dfrac{a^2}{2r}\dfrac{\mathrm dB}{\mathrm dt}\) au-delà (\(0{,}20\ \text{V·m}^{-1}\) en valeur absolue à \(r=5{,}0\ \text{cm}\), là où \(\vec B=\vec 0\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Exploiter Maxwell-flux près d'un axe de révolution</strong>
    <p>Situation type : champ à symétrie de révolution autour de \(Oz\) (spire, bobine courte, lentille magnétique), connu seulement sur l'axe par \(B_z(0,z)\).</p>
    <ol>
      <li><span class="step">Symétries.</span> Pour des courants orthoradiaux, un plan qui contient l'axe est un plan d'antisymétrie ; \(\vec B\) y est contenu. D'où \(B_\theta=0\) et \(\vec B=B_r(r,z)\,\vec e_r+B_z(r,z)\,\vec e_z\).</li>
      <li><span class="step">Petit cylindre fermé</span> d'axe \(Oz\), de rayon \(r\), entre \(z\) et \(z+\mathrm dz\). En confondant \(B_z(r,z)\) et \(B_z(0,z)\) au premier ordre, le flux total nul s'écrit \(\pi r^2\,\partial_zB_z(0,z)\,\mathrm dz+2\pi r\,B_r\,\mathrm dz=0\).</li>
      <li><span class="step">Conclure</span> : \(B_r(r,z)\approx-\dfrac{r}{2}\,\dfrac{\mathrm dB_z(0,z)}{\mathrm dz}\).</li>
      <li><span class="step">Interpréter</span> (avec \(B_z \gt 0\)) : là où \(B_z\) croît le long de l'axe, \(B_r \lt 0\) et les lignes de champ se resserrent ; là où il décroît, elles s'écartent.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur l'axe, \(B_z(0,z)=B_0+Gz\) avec \(G=2{,}0\ \text{T·m}^{-1}\). À \(r=1{,}0\ \text{cm}\) de l'axe, \(B_r\approx-\dfrac r2\,G=-1{,}0\times10^{-2}\ \text{T}\) : les lignes convergent vers la zone de champ fort.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Établir une équation de propagation (ou de diffusion)</strong>
    <ol>
      <li><span class="step">Écrire Maxwell</span> dans la région étudiée en précisant les hypothèses : vide de charges et de courants, ou conducteur ohmique neutre en ARQS (\(\vec j=\sigma\vec E\), \(\vec j_D\) négligé).</li>
      <li><span class="step">Prendre le rotationnel</span> de (MF), permuter \(\overrightarrow{\operatorname{rot}}\) et \(\partial_t\) (variables indépendantes), puis remplacer \(\overrightarrow{\operatorname{rot}}\,\vec B\) par (MA).</li>
      <li><span class="step">Développer</span> le double rotationnel avec \(\operatorname{div}\vec E=0\) :
      <div class="formula">$$\overrightarrow{\operatorname{rot}}\big(\overrightarrow{\operatorname{rot}}\,\vec E\big)=\overrightarrow{\operatorname{grad}}\big(\operatorname{div}\vec E\big)-\Delta\vec E=-\Delta\vec E$$</div></li>
      <li><span class="step">Identifier</span> : dans le vide, \(\Delta\vec E=\dfrac1{c^2}\,\partial_t^2\vec E\) (d'Alembert) ; dans le conducteur, \(\Delta\vec E=\mu_0\sigma\,\partial_t\vec E\) (diffusion). Contrôler l'homogénéité.</li>
    </ol>
    <p><em>Exemple éclair :</em> dans le vide, \(c=1/\sqrt{\mu_0\varepsilon_0}\approx3{,}00\times10^{8}\ \text{m·s}^{-1}\) ; dans le cuivre (\(\sigma=6{,}0\times10^{7}\ \text{S·m}^{-1}\)), le coefficient de diffusion \(1/(\mu_0\sigma)\) vaut \(1{,}3\times10^{-2}\ \text{m}^2\text{·s}^{-1}\) : ordre 1 en temps, le champ ne se propage plus, il diffuse.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : sans le courant de déplacement, le rotationnel de (MF) dans le vide donnerait \(\Delta\vec E=\vec 0\) : aucune onde. C'est le couplage croisé (MF)–(MA) qui crée la propagation.</div>

  <div class="method-box">
    <strong>Méthode 6 — Établir et exploiter les équations de Poisson et de Laplace</strong>
    <ol>
      <li><span class="step">Statique.</span> (MF) sans \(\partial_t\vec B\) : \(\overrightarrow{\operatorname{rot}}\,\vec E=\vec 0\), donc \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\).</li>
      <li><span class="step">Reporter dans (MG)</span> : \(\Delta V+\rho/\varepsilon_0=0\) (Poisson), \(\Delta V=0\) là où \(\rho=0\) (Laplace).</li>
      <li><span class="step">Intégrer</span> en exploitant la symétrie (une seule variable) ; le laplacien en cylindriques ou sphériques est fourni.</li>
      <li><span class="step">Fixer les constantes</span> par les conditions aux limites : potentiels imposés, champ fini sur l'axe, continuité de \(V\) et de \(E\) en l'absence de charge surfacique.</li>
    </ol>
    <p><em>Exemple éclair :</em> charge volumique uniforme \(\rho_0=1{,}0\times10^{-6}\ \text{C·m}^{-3}\) entre deux plans au potentiel nul, \(x=0\) et \(x=d=1{,}0\ \text{cm}\). \(V''=-\rho_0/\varepsilon_0\) donne \(V(x)=\dfrac{\rho_0}{2\varepsilon_0}\,x(d-x)\), maximal au milieu : \(V(d/2)=\dfrac{\rho_0d^2}{8\varepsilon_0}\approx1{,}4\ \text{V}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Faire un bilan d'énergie électromagnétique (local et intégral)</strong>
    <ol>
      <li><span class="step">Volume de contrôle.</span> Choisir \(V\) et sa frontière fermée \(\Sigma\) adaptés aux symétries (souvent un cylindre de rayon \(r\) et de longueur \(\ell\)).</li>
      <li><span class="step">Champs.</span> Exprimer \(\vec E\) et \(\vec B\) dans \(V\) et sur \(\Sigma\), puis \(u_{em}\), \(\vec\Pi\) et \(\vec j\cdot\vec E\).</li>
      <li><span class="step">Trois termes.</span> \(\mathrm dU_{em}/\mathrm dt\) (stockage) ; flux sortant \(\iint_\Sigma\vec\Pi\cdot\vec n_{ext}\,\mathrm dS\) (les faces où \(\vec\Pi\) est tangent ne comptent pas) ; puissance cédée \(\iiint_V\vec j\cdot\vec E\,\mathrm d\tau\).</li>
      <li><span class="step">Vérifier et interpréter</span> : \(-\mathrm dU_{em}/\mathrm dt=\) flux sortant \(+\) puissance cédée. Un flux sortant négatif signifie que l'énergie entre. En régime permanent, le flux entrant compense exactement l'effet Joule.</li>
    </ol>
    <p><em>Exemple éclair :</em> fil de cuivre de rayon 1,0 mm, de longueur 1,0 m, parcouru par 10 A (\(R\approx5{,}3\ \text{m}\Omega\)). À sa surface, \(\|\vec\Pi\|=\dfrac{UI}{2\pi a\ell}\approx84\ \text{W·m}^{-2}\), dirigé vers l'axe ; sur l'aire latérale \(6{,}3\times10^{-3}\ \text{m}^2\), le flux entrant vaut \(0{,}53\ \text{W}=RI^2\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Évaluer une puissance par le flux du vecteur de Poynting</strong>
    <ol>
      <li><span class="step">Orienter</span> la surface \(S\) : le choix de \(\vec n\) fixe le sens compté positivement.</li>
      <li><span class="step">Calculer</span> \(\vec\Pi=\vec E\wedge\vec B/\mu_0\) sur \(S\), en soignant les produits vectoriels de la base (\(\vec e_z\wedge\vec e_\theta=-\vec e_r\), \(\vec e_r\wedge\vec e_\theta=\vec e_z\)).</li>
      <li><span class="step">Intégrer</span> \(P=\iint_S\vec\Pi\cdot\vec n\,\mathrm dS\) ; en régime sinusoïdal, moyenner (facteur \(\tfrac12\), ou \(\tfrac{1}{2\mu_0}\operatorname{Re}(\underline{\vec E}\wedge\underline{\vec B}^{*})\)).</li>
      <li><span class="step">Comparer</span> à une grandeur de circuit (\(ui\), \(RI^2\), \(\frac{\mathrm d}{\mathrm dt}\frac12Cu^2\)…) : c'est le meilleur contrôle.</li>
    </ol>
    <p><em>Exemple éclair :</em> condensateur à armatures circulaires (\(R=5{,}0\ \text{cm}\), \(e=1{,}0\ \text{mm}\)) chargé par \(i=10\ \text{mA}\) sous \(u=10\ \text{V}\) : au bord, \(\|\vec\Pi\|=\dfrac{ui}{2\pi Re}\approx3{,}2\times10^{2}\ \text{W·m}^{-2}\) vers l'axe, et le flux entrant par la surface latérale \(2\pi Re\) vaut \(ui=0{,}10\ \text{W}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Valider l'ARQS magnétique et simplifier les équations</strong>
    <ol>
      <li><span class="step">Échelles.</span> \(L\) = plus grande dimension du dispositif ; \(f\) = plus haute fréquence significative (pour des fronts de durée \(t_m\), \(f_{max}\approx0{,}35/t_m\)).</li>
      <li><span class="step">Critère.</span> \(\lambda=c/f\) (ou \(v/f\) dans un câble) : ARQS si \(L\ll\lambda\). Pour trancher, comparer le déphasage \(2\pi L/\lambda\) au seuil de l'énoncé (quelques centièmes de radian).</li>
      <li><span class="step">Simplifier.</span> Dans les conducteurs, négliger \(\vec j_D\) dans (MA) (rapport \(\varepsilon_0\omega/\sigma\)) : \(\overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\vec j\), d'où \(\operatorname{div}\vec j=0\) et la loi des nœuds ; garder \(-\partial_t\vec B\) dans (MF).</li>
      <li><span class="step">Calculer</span> \(\vec B(t)\) comme en magnétostatique avec les courants au même instant, puis \(\vec E\) induit par (MF).</li>
    </ol>
    <p><em>Exemple éclair :</em> 2,0 m de câble coaxial (\(v=2c/3\)) à 10 MHz : \(\lambda=v/f=20\ \text{m}\) et \(2\pi L/\lambda\approx0{,}63\ \text{rad}\) : l'ARQS ne s'applique pas, il faut un modèle de ligne. À 100 kHz, le déphasage tombe à \(6\times10^{-3}\ \text{rad}\) : ARQS justifiée.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'ARQS magnétique ne supprime pas l'induction. C'est \(\vec j_D\) qu'on néglige dans (MA), jamais \(\partial_t\vec B\) dans (MF).</div>

  <div class="method-box">
    <strong>Méthode 10 — Utiliser les relations de passage</strong>
    <ol>
      <li><span class="step">Orienter</span> la normale \(\vec n_{12}\) du milieu 1 vers le milieu 2 et s'y tenir.</li>
      <li><span class="step">Décomposer</span> chaque champ en partie normale et partie tangentielle à la surface.</li>
      <li><span class="step">Appliquer</span> : \(\vec E_2-\vec E_1=\dfrac{\sigma}{\varepsilon_0}\,\vec n_{12}\) (\(\sigma\) : charge surfacique) et \(\vec B_2-\vec B_1=\mu_0\,\vec j_s\wedge\vec n_{12}\) ; \(\vec E\) tangentiel et \(B_n\) continus.</li>
      <li><span class="step">Exploiter</span> : en déduire les sources surfaciques à partir des champs (surface d'un conducteur où les champs intérieurs sont nuls : \(\sigma=\varepsilon_0\vec E\cdot\vec n\), \(\vec j_s=\vec n\wedge\vec B/\mu_0\), \(\vec n\) sortant du conducteur), ou raccorder les solutions de part et d'autre.</li>
    </ol>
    <p><em>Exemple éclair :</em> juste au-dessus d'une plaque conductrice (normale sortante \(\vec e_z\), champs nuls dans le métal), on mesure \(\vec B=2{,}0\ \text{mT}\;\vec e_x\) et \(\vec E=1{,}0\ \text{kV·m}^{-1}\;\vec e_z\). Alors \(\vec j_s=\dfrac{\vec e_z\wedge\vec B}{\mu_0}\approx1{,}6\times10^{3}\ \text{A·m}^{-1}\;\vec e_y\) et \(\sigma=\varepsilon_0E\approx8{,}9\times10^{-9}\ \text{C·m}^{-2}\).</p>
  </div>

  <div class="notice"><strong>Hors programme, souvent guidé : la conductivité complexe</strong>. Principe fondamental pour un électron avec frottement \(-m\vec v/\tau\) ; en régime sinusoïdal (convention \(e^{i\omega t}\)), \(\mathrm d/\mathrm dt\to i\omega\) ; \(\underline{\vec j}=-ne\underline{\vec v}\) donne \(\underline\sigma=\sigma_0/(1+i\omega\tau)\), réelle si \(\omega\tau\ll1\). Puissance moyenne : \(\frac12\operatorname{Re}(\underline\sigma)E_0^2\), jamais \(\operatorname{Re}(\underline{\vec j}\cdot\underline{\vec E})\) sans conjugué (exercice 10).</div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul>
      <li>Écrire \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) en régime variable : c'est faux dès que \(\partial\vec B/\partial t\neq\vec 0\).</li>
      <li>Oublier le courant de déplacement quand la surface d'Ampère passe entre les armatures d'un condensateur.</li>
      <li>Confondre \(\operatorname{div}\vec j=0\) (régime stationnaire ou ARQS) avec l'équation générale \(\partial\rho/\partial t+\operatorname{div}\vec j=0\).</li>
      <li>Compter un travail de la force magnétique : seule la puissance \(\vec j\cdot\vec E\) est cédée aux charges.</li>
      <li>Superposer des énergies : \(u_{em}\) est quadratique, l'énergie de deux champs superposés contient des termes croisés.</li>
      <li>Unités : \(\vec j\) en A·m⁻², \(\vec j_s\) en A·m⁻¹, \(u_{em}\) en J·m⁻³, \(\vec\Pi\) en W·m⁻².</li>
    </ul>
  </div>
</div>
</template>
