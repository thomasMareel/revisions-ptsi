<div class="course-section">
  <div class="sec-num">§1 · CADRE DE L'ÉTUDE</div>
  <h2>Écoulement permanent dans une installation</h2>
  <div class="intro">Dans un compresseur, une turbine, un échangeur ou une vanne, le fluide n'est pas enfermé : il traverse l'organe en continu. On transpose donc les deux principes, énoncés pour des systèmes fermés, à ces systèmes traversés par de la matière, en raisonnant sur l'unité de masse de fluide qui passe.</div>

  <h3>Système ouvert, régime permanent</h3>
  <div class="def-box">
    Un <strong>système ouvert</strong> est le contenu d'une <strong>surface de contrôle</strong> \(\Sigma\), fixe dans le référentiel de l'installation, que la matière franchit par des sections d'entrée et de sortie.<br>
    Le <strong>régime</strong> est <strong>permanent</strong> (ou stationnaire) si, en tout point fixe, les grandeurs (pression, température, vitesse, masse volumique…) sont indépendantes du temps. La masse, l'énergie et l'entropie contenues dans \(\Sigma\) sont alors constantes.
  </div>
  <p><strong>Modèle unidimensionnel :</strong> sur chaque section d'entrée (indice \(e\)) ou de sortie (indice \(s\)), on attribue au fluide des valeurs uniformes de \(P\), \(T\), \(c\) (vitesse débitante)… On suppose le fluide à l'équilibre thermodynamique local <em>dans ces sections</em>. Ce qui se passe à l'intérieur de l'organe (turbulence, états hors d'équilibre) n'a pas à être décrit : les bilans ne font intervenir que les états d'entrée et de sortie.</p>

  <h3>Débit massique</h3>
  <div class="formula">$$D_m = \rho\,c\,S = \frac{c\,S}{v}\qquad(\text{kg·s}^{-1})$$</div>
  <p>avec \(S\) l'aire de la section, \(c\) la vitesse débitante et \(v = 1/\rho\) le <strong>volume massique</strong>. En régime permanent, pour un organe à une entrée et une sortie, la masse contenue est constante : \(D_{m,e} = D_{m,s} = D_m\).</p>

  <h3>Grandeurs massiques et identités thermodynamiques</h3>
  <p>On note en minuscules les grandeurs rapportées à 1 kg de fluide : énergie interne \(u\), enthalpie \(h = u + Pv\), entropie \(s\), énergie cinétique \(e_c = \tfrac12 c^2\), énergie potentielle de pesanteur \(e_p = gz\) (axe \(z\) ascendant).</p>
  <div class="prop-box">
    <strong>Identités thermodynamiques</strong> (relations entre fonctions d'état, valables entre deux états d'équilibre voisins, quelle que soit la manière dont le fluide passe de l'un à l'autre) :
    $$\mathrm{d}u = T\,\mathrm{d}s - P\,\mathrm{d}v \qquad\qquad \mathrm{d}h = T\,\mathrm{d}s + v\,\mathrm{d}P$$
    Elles permettent de calculer \(\Delta h\) et \(\Delta s\) entre l'entrée et la sortie le long d'un chemin <em>fictif</em> réversible, même si l'évolution réelle est irréversible.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">Modèle</th><th style="padding:.35rem;border:1px solid var(--grid)">Enthalpie massique</th><th style="padding:.35rem;border:1px solid var(--grid)">Entropie massique</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Gaz parfait (\(c_p\) constant)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta h = c_p\,\Delta T\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta s\) \(= c_p\ln\dfrac{T_2}{T_1} - r\ln\dfrac{P_2}{P_1}\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Phase condensée incompressible (capacité thermique massique \(c_\ell\), à ne pas confondre avec la vitesse \(c\))</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta h = c_\ell\,\Delta T + v\,\Delta P\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\Delta s = c_\ell\ln\dfrac{T_2}{T_1}\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Mélange liquide–vapeur (titre \(x\))</td><td style="padding:.35rem;border:1px solid var(--grid)">\(h = (1-x)\,h_L + x\,h_V\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(s = (1-x)\,s_L + x\,s_V\)</td></tr>
  </table></div>
  <p>Pour le gaz parfait, \(r = R/M\) et \(c_p = \dfrac{\gamma r}{\gamma - 1}\). Pour le changement d'état à la température \(T\) : \(h_V - h_L = \ell_v(T)\) et \(s_V - s_L = \ell_v(T)/T\).</p>
  <div class="notice"><strong>Ordres de grandeur.</strong> Air : \(c_p \approx 1{,}0\ \text{kJ·kg}^{-1}\text{·K}^{-1}\), \(r = 287\ \text{J·kg}^{-1}\text{·K}^{-1}\), \(\gamma = 1{,}4\). Eau liquide : \(c_\ell \approx 4{,}18\ \text{kJ·kg}^{-1}\text{·K}^{-1}\), \(v \approx 1{,}0\times10^{-3}\ \text{m}^3\text{·kg}^{-1}\). Vaporisation de l'eau : \(\ell_v \approx 2{,}26\ \text{MJ·kg}^{-1}\) à 100 °C, environ \(2{,}4\ \text{MJ·kg}^{-1}\) vers 40 °C.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Débit d'une conduite de vapeur : \(v = 0{,}30\ \text{m}^3\text{·kg}^{-1}\), \(c = 25\ \text{m·s}^{-1}\), diamètre 20 cm.</span>
    <div class="content"><p>\(S\) \(= \pi\,(0{,}10)^2\) \(\approx 3{,}14\times10^{-2}\ \text{m}^2\), donc \(D_m\) \(= \dfrac{cS}{v}\) \(= \dfrac{25\times3{,}14\times10^{-2}}{0{,}30}\) \(\approx 2{,}6\ \text{kg·s}^{-1}\).</p></div>
  </div>
</div>

  <div class="sec-num">§2 · PREMIER PRINCIPE INDUSTRIEL</div>
  <h2>Bilan d'énergie en régime permanent</h2>
  <div class="intro">Le premier principe a été énoncé pour un système fermé. On suit donc pendant \(\mathrm{d}t\) une masse de fluide bien choisie, puis on exprime son bilan avec les grandeurs d'entrée et de sortie : c'est la démonstration à savoir refaire.</div>

  <h3>Système fermé associé et bilan de masse</h3>
  <p>Entre \(t\) et \(t + \mathrm{d}t\), une masse \(\delta m_e\) entre dans \(\Sigma\) et une masse \(\delta m_s\) en sort. Le système <strong>fermé</strong> \(\Sigma^*\) est formé, à \(t\), du contenu de \(\Sigma\) et de \(\delta m_e\) ; à \(t + \mathrm{d}t\), du contenu de \(\Sigma\) et de \(\delta m_s\). En régime permanent, le contenu de \(\Sigma\) est le même aux deux instants, donc :</p>
  <div class="formula">$$\delta m_e = \delta m_s = \delta m = D_m\,\mathrm{d}t$$</div>

  <h3>Les énergies reçues par \(\Sigma^*\)</h3>
  <ul>
    <li><strong>Travail indiqué</strong> \(\delta W_i = w_i\,\delta m\) : travail reçu des parties mobiles (aubes, pistons, rotor) entraînées par l'arbre ;</li>
    <li><strong>travail de transvasement</strong> des forces de pression en amont et en aval : \(+P_e v_e\,\delta m\) (le fluide amont pousse \(\delta m_e\) dans \(\Sigma\)) et \(-P_s v_s\,\delta m\) (\(\Sigma^*\) refoule le fluide aval) ;</li>
    <li><strong>transfert thermique</strong> \(\delta Q = q\,\delta m\) à travers les parois.</li>
  </ul>
  <p>L'énergie de \(\Sigma^*\) varie de \(\delta m\,[(u + e_c + e_p)_s - (u + e_c + e_p)_e]\), d'où, après division par \(\delta m\) et regroupement \(u + Pv = h\) :</p>
  <div class="prop-box">
    <strong>Premier principe pour un système ouvert en régime permanent</strong> (une entrée, une sortie ; \(\Delta\) = sortie − entrée) :
    $$\Delta\!\left(h + \tfrac12 c^2 + g z\right) = w_i + q$$
    $$D_m\,\Delta\!\left(h + \tfrac12 c^2 + g z\right) = \mathcal{P}_i + \mathcal{P}_{th}$$
    \(\mathcal{P}_i = D_m w_i\) : puissance indiquée reçue par le fluide ; \(\mathcal{P}_{th} = D_m q\) : puissance thermique reçue.
  </div>
  <div class="notice"><strong>Attention aux signes.</strong> Tout est compté <em>reçu par le fluide</em> : \(w_i \gt 0\) pour un compresseur ou une pompe, \(w_i \lt 0\) pour une turbine ; \(q \lt 0\) dans un condenseur. Le travail indiqué n'inclut pas le travail de transvasement : c'est ce dernier qui, regroupé avec \(u\), fait apparaître \(h\).</div>

  <h3>Les termes souvent négligeables</h3>
  <p>Pour \(\Delta z = 10\ \text{m}\), \(g\,\Delta z \approx 0{,}1\ \text{kJ·kg}^{-1}\) ; pour une vitesse passant de 20 à 50 m/s, \(\Delta e_c \approx 1\ \text{kJ·kg}^{-1}\). Or les variations d'enthalpie usuelles valent quelques dizaines à quelques centaines de kJ/kg pour la compression d'un gaz, et environ 2 000 kJ/kg pour la vaporisation de l'eau. Dans la plupart des organes :</p>
  <div class="formula">$$\Delta h = w_i + q \qquad\text{soit}\qquad D_m\,\Delta h = \mathcal{P}_i + \mathcal{P}_{th}$$</div>
  <p>Exceptions : tuyères, diffuseurs et sortie de turboréacteur (vitesses de plusieurs centaines de m/s), installations hydrauliques où \(\Delta h\) est faible (une chute d'eau exploite justement \(g\,\Delta z\)).</p>

  <h3>Travail indiqué d'une évolution réversible</h3>
  <p>Pour une évolution modèle décomposée en étapes infinitésimales, \(\mathrm{d}h + \mathrm{d}(e_c + e_p)\) \(= \delta w_i + \delta q\). Si elle est réversible, \(\delta q = T\,\mathrm{d}s\), et l'identité \(\mathrm{d}h = T\,\mathrm{d}s + v\,\mathrm{d}P\) donne :</p>
  <div class="formula">$$w_{i,\text{rév}} = \int_e^s v\,\mathrm{d}P \;+\; \Delta(e_c + e_p)$$</div>
  <p>C'est \(v\,\mathrm{d}P\) qui intervient en écoulement (et non \(-P\,\mathrm{d}v\) comme pour un système fermé). Conséquence capitale : à rapport de pression donné, comprimer un <strong>liquide</strong> (\(v\) très petit) coûte beaucoup moins que comprimer un <strong>gaz</strong> ; une pompe consomme peu devant un compresseur.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Lien avec la mécanique des fluides</span>
    <span class="prompt">Que devient le bilan pour un liquide incompressible, sans échange thermique ni dissipation ?</span>
    <div class="content"><p>Alors \(u\) est constante et \(\Delta h = \Delta P/\rho\) : on retrouve la relation de Bernoulli généralisée avec machine, \(\Delta\!\left(\dfrac{P}{\rho} + \dfrac{c^2}{2} + gz\right)\) \(= w_i\). La dissipation visqueuse (pertes de charge) est étudiée dans le chapitre « Écoulements visqueux et bilans en conduite ».</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SECOND PRINCIPE POUR UN SYSTÈME OUVERT</div>
  <h2>Bilan d'entropie et sources d'irréversibilité</h2>
  <div class="intro">Le même système fermé associé \(\Sigma^*\) permet d'écrire un bilan d'entropie. Le travail de transvasement n'apporte pas d'entropie : seuls comptent le transfert thermique et la création interne.</div>

  <div class="prop-box">
    <strong>Second principe en régime permanent</strong> (une entrée, une sortie) :
    $$D_m\,\Delta s = \dot S_{\text{éch}} + \dot S_{\text{créée}} \qquad\Longleftrightarrow\qquad \Delta s = s_{\text{éch}} + s_{\text{créée}}$$
    avec \(s_{\text{créée}} \geq 0\), nulle si et seulement si l'évolution est réversible. Si le transfert thermique se fait à travers une paroi à la température uniforme \(T_{\text{ext}}\) : \(s_{\text{éch}} = \dfrac{q}{T_{\text{ext}}}\) ; plus généralement \(s_{\text{éch}}\) \(= \displaystyle\int \frac{\delta q}{T_{\text{ext}}}\).
  </div>

  <h3>Cas particuliers</h3>
  <ul>
    <li><strong>Organe calorifugé</strong> : \(s_{\text{éch}} = 0\), donc \(\Delta s = s_{\text{créée}} \geq 0\) : l'entropie massique du fluide ne peut que croître.</li>
    <li><strong>Calorifugé et réversible</strong> : évolution <strong>isentropique</strong>, \(s_s = s_e\).</li>
    <li><strong>Évolution réversible</strong> : \(\delta q = T\,\mathrm{d}s\), donc \(q = \int T\,\mathrm{d}s\) (aire sous la courbe dans le diagramme \((T,s)\)).</li>
  </ul>

  <h3>Les causes d'irréversibilité</h3>
  <ul>
    <li>frottements internes (viscosité, turbulence) dans les compresseurs, turbines et conduites ;</li>
    <li>transferts thermiques sous un écart de température fini (échangeurs, pertes vers l'ambiance) ;</li>
    <li>détente brutale à travers un étranglement (vanne partiellement ouverte, tube capillaire) ;</li>
    <li>mélange de courants de températures ou de compositions différentes ;</li>
    <li>plus rarement : réaction chimique (combustion), ondes de choc.</li>
  </ul>
  <p><strong>Méthode générale :</strong> on ne calcule jamais \(s_{\text{créée}}\) directement. On écrit \(s_{\text{créée}} = \Delta s - s_{\text{éch}}\), où \(\Delta s\) (fonction d'état) vient des tables, d'un diagramme ou d'une formule de modèle.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Laminage d'un gaz parfait dans une vanne calorifugée, de 8 bar à 2 bar : entropie créée ?</span>
    <div class="content"><p>Pas de partie mobile, pas d'échange thermique, \(\Delta e_c\) négligée : \(h_s = h_e\). Pour un gaz parfait \(h\) ne dépend que de \(T\), donc \(T_s = T_e\). Alors \(\Delta s = -r\ln\dfrac{P_s}{P_e}\) et, l'organe étant calorifugé, \(s_{\text{créée}}\) \(= \Delta s\) \(= r\ln\dfrac{P_e}{P_s}\) \(= 287\ln 4\) \(\approx 0{,}40\ \text{kJ·kg}^{-1}\text{·K}^{-1} \gt 0\) : le laminage est intrinsèquement irréversible.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LES ORGANES D'UNE INSTALLATION</div>
  <h2>Briques élémentaires et hypothèses de modélisation</h2>
  <div class="intro">Tous les organes se traitent avec le même bilan \(\Delta(h + e_c + e_p) = w_i + q\), simplifié par des hypothèses standard qu'il faut savoir énoncer et justifier.</div>

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">Organe</th><th style="padding:.35rem;border:1px solid var(--grid)">Rôle</th><th style="padding:.35rem;border:1px solid var(--grid)">Hypothèses usuelles</th><th style="padding:.35rem;border:1px solid var(--grid)">Bilan simplifié</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Compresseur</td><td style="padding:.35rem;border:1px solid var(--grid)">élève la pression d'un gaz</td><td style="padding:.35rem;border:1px solid var(--grid)">calorifugé ; \(\Delta e_c\), \(\Delta e_p\) négligées</td><td style="padding:.35rem;border:1px solid var(--grid)">\(w_i = h_s - h_e \gt 0\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Pompe</td><td style="padding:.35rem;border:1px solid var(--grid)">élève la pression d'un liquide</td><td style="padding:.35rem;border:1px solid var(--grid)">idem ; liquide incompressible</td><td style="padding:.35rem;border:1px solid var(--grid)">\(w_i \approx v\,(P_s - P_e)\) si réversible</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Turbine</td><td style="padding:.35rem;border:1px solid var(--grid)">fournit du travail à l'arbre</td><td style="padding:.35rem;border:1px solid var(--grid)">calorifugée</td><td style="padding:.35rem;border:1px solid var(--grid)">\(w_i = h_s - h_e \lt 0\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Détendeur (vanne, capillaire)</td><td style="padding:.35rem;border:1px solid var(--grid)">abaisse la pression</td><td style="padding:.35rem;border:1px solid var(--grid)">sans partie mobile, calorifugé</td><td style="padding:.35rem;border:1px solid var(--grid)">\(h_s = h_e\) (isenthalpique, irréversible)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Échangeur (évaporateur, condenseur, chaudière, surchauffeur)</td><td style="padding:.35rem;border:1px solid var(--grid)">transfert thermique</td><td style="padding:.35rem;border:1px solid var(--grid)">sans partie mobile ; isobare si pertes de charge négligées</td><td style="padding:.35rem;border:1px solid var(--grid)">\(q = h_s - h_e\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Mélangeur</td><td style="padding:.35rem;border:1px solid var(--grid)">réunit plusieurs courants</td><td style="padding:.35rem;border:1px solid var(--grid)">calorifugé, sans travail, isobare</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\sum D_{m}h\) (sorties) \(= \sum D_m h\) (entrées)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Séparateur</td><td style="padding:.35rem;border:1px solid var(--grid)">sépare liquide et vapeur saturants</td><td style="padding:.35rem;border:1px solid var(--grid)">calorifugé, isobare</td><td style="padding:.35rem;border:1px solid var(--grid)">vapeur : \(x\,D_m\) ; liquide : \((1-x)\,D_m\)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">Tuyère / diffuseur</td><td style="padding:.35rem;border:1px solid var(--grid)">accélère / ralentit le fluide</td><td style="padding:.35rem;border:1px solid var(--grid)">calorifugé, sans travail, \(\Delta e_p\) négligée</td><td style="padding:.35rem;border:1px solid var(--grid)">\(h_s + \tfrac12 c_s^2 = h_e + \tfrac12 c_e^2\)</td></tr>
  </table></div>

  <h3>Justifier les hypothèses</h3>
  <ul>
    <li><strong>Calorifugé :</strong> le fluide traverse l'organe trop vite pour échanger beaucoup de chaleur, et les pertes thermiques d'une machine sont faibles devant la puissance qu'elle échange avec l'arbre.</li>
    <li><strong>Échangeur à deux fluides calorifugé :</strong> \(D_{m1}(h_{1s} - h_{1e}) + D_{m2}(h_{2s} - h_{2e}) = 0\) : ce que cède le fluide chaud est reçu intégralement par le fluide froid.</li>
    <li><strong>Surchauffeur :</strong> échangeur isobare qui chauffe la vapeur au-delà de la courbe de rosée (vapeur surchauffée). En amont d'une turbine, il retarde l'apparition de gouttes pendant la détente ; dans une machine frigorifique, la surchauffe en fin d'évaporateur garantit que le compresseur n'aspire aucune goutte.</li>
    <li><strong>Détendeur :</strong> pour un gaz parfait, \(T\) est conservée ; pour un liquide saturant, la détente isenthalpique provoque une vaporisation partielle et une chute de température (principe des machines frigorifiques).</li>
  </ul>
  <div class="notice"><strong>Calorifugé ≠ réversible.</strong> Les frottements internes créent de l'entropie même sans échange thermique. Seul l'énoncé (ou un rendement isentropique) autorise à supposer \(s\) constante dans une turbine ou un compresseur.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un condenseur liquéfie complètement 2,0 kg/s de vapeur humide (titre 0,90) à 40 °C (\(\ell_v \approx 2{,}41\ \text{MJ·kg}^{-1}\)). Débit d'eau de refroidissement s'échauffant de 8 K ?</span>
    <div class="content"><p>Puissance cédée par la vapeur : \(D_m\,x\,\ell_v\) \(= 2{,}0\times0{,}90\times2{,}41\times10^6\) \(\approx 4{,}3\ \text{MW}\). Échangeur calorifugé : l'eau la reçoit, \(D_{eau}\) \(= \dfrac{4{,}3\times10^6}{4180\times8}\) \(\approx 1{,}3\times10^2\ \text{kg·s}^{-1}\). Les condenseurs de centrales ont besoin de débits d'eau énormes.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PLUSIEURS ENTRÉES ET SORTIES</div>
  <h2>Bilans généralisés</h2>
  <div class="intro">Mélangeurs, séparateurs, soutirages de turbine, échangeurs à deux fluides : chaque bilan devient une somme pondérée par les débits massiques des différents courants.</div>

  <div class="prop-box">
    <strong>Bilans en régime permanent</strong> (entrées \(j\), sorties \(k\)) :
    $$\sum_{\text{entrées}} D_{m,j} = \sum_{\text{sorties}} D_{m,k}$$
    $$\sum_{\text{sorties}} D_{m,k}\,(h + e_c + e_p)_k \;-\; \sum_{\text{entrées}} D_{m,j}\,(h + e_c + e_p)_j = \mathcal{P}_i + \mathcal{P}_{th}$$
    $$\sum_{\text{sorties}} D_{m,k}\,s_k \;-\; \sum_{\text{entrées}} D_{m,j}\,s_j = \sum_{l} \frac{\mathcal{P}_{th,l}}{T_l} + \dot S_{\text{créée}}$$
    où \(\mathcal{P}_{th,l}\) est la puissance thermique reçue à travers la partie de la frontière à la température \(T_l\).
  </div>

  <h3>Choisir la surface de contrôle</h3>
  <p>\(\Sigma\) peut entourer un seul organe (pour suivre l'évolution du fluide qui le traverse) ou toute l'installation : les débits internes disparaissent alors et seuls subsistent les échanges avec l'extérieur. Bon réflexe : placer \(\Sigma\) de sorte que la grandeur cherchée soit la seule inconnue du bilan. Pour une installation en <strong>circuit fermé</strong> parcourue en régime permanent, la somme sur tous les organes donne \(\sum w_i + \sum q = 0\) : c'est le premier principe appliqué au cycle.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Mélangeur calorifugé isobare : 1,0 kg/s d'air à 400 K et 3,0 kg/s d'air à 300 K. Température de sortie et entropie créée ?</span>
    <div class="content"><p>Bilan enthalpique (gaz parfait, \(c_p\) constant) : \(4{,}0\,T_s = 1{,}0\times400 + 3{,}0\times300\), donc \(T_s = 325\ \text{K}\). Bilan entropique sans échange thermique, à pression constante : \(\dot S_{\text{créée}}\) \(= c_p\left[1{,}0\ln\dfrac{325}{400} + 3{,}0\ln\dfrac{325}{300}\right]\) \(\approx 1000\times(-0{,}208 + 0{,}240)\) \(\approx 32\ \text{W·K}^{-1} \gt 0\). Le mélange de courants à des températures différentes est irréversible.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DIAGRAMMES THERMODYNAMIQUES</div>
  <h2>Lire et tracer une évolution dans (T,s), (h,s) et (ln P, h)</h2>
  <div class="intro">Pour un fluide réel (eau, fluide frigorigène), les tables et diagrammes fournissent directement \(h\), \(s\), \(T\), \(P\), \(x\). Un point représente un état d'équilibre de 1 kg de fluide ; l'évolution dans un organe se représente par un trait joignant l'état d'entrée à l'état de sortie — seule une évolution modèle réversible a un chemin intermédiaire physiquement défini.</div>
  <div class="notice"><strong>Pour approfondir</strong> l'allure des courbes, les équations dans les limites du gaz parfait et du liquide, et la lecture des tables : voir le chapitre « Thermodynamique différentielle et fluides réels », qui contient des diagrammes calculés de l'eau et du R134a.</div>

  <h3>La courbe de saturation</h3>
  <p>Dans les trois diagrammes, une « cloche » sépare le liquide (à gauche), le mélange liquide–vapeur (dessous) et la vapeur (à droite). Sa branche gauche est la <strong>courbe d'ébullition</strong> (\(x = 0\)), sa branche droite la <strong>courbe de rosée</strong> (\(x = 1\)) ; elles se rejoignent au <strong>point critique</strong>. Sous la cloche, une isobare est aussi une isotherme. Le titre se lit par la règle des moments :</p>
  <div class="formula">$$x = \frac{h - h_L}{h_V - h_L} = \frac{s - s_L}{s_V - s_L}$$</div>

  <h3>Diagramme entropique (T,s)</h3>
  <ul>
    <li>Isothermes horizontales, isentropes verticales ; sous la cloche, les isobares sont des paliers horizontaux.</li>
    <li>Dans la vapeur, les isobares montent vers la droite (gaz parfait : \(T\) varie comme \(\exp(s/c_p)\) à \(P\) fixée), d'autant plus à gauche que \(P\) est grande ; dans le liquide, elles se confondent presque avec la courbe d'ébullition.</li>
    <li>Pour un gaz parfait, les isenthalpes sont les isothermes.</li>
    <li>Atout : l'aire sous une évolution réversible vaut \(q = \int T\,\mathrm{d}s\) ; l'aire d'un cycle réversible vaut le travail échangé sur le cycle.</li>
  </ul>

  <h3>Diagramme de Mollier (h,s)</h3>
  <ul>
    <li>L'enthalpie en ordonnée : le travail d'un organe calorifugé (\(w_i = \Delta h\)) se lit comme un segment vertical.</li>
    <li>Pente d'une isobare : \(\left(\dfrac{\partial h}{\partial s}\right)_P = T \gt 0\), croissante avec \(T\) ; sous la cloche, les isobares sont des droites.</li>
    <li>Pour l'eau, le point critique n'est pas au sommet de la cloche mais sur son flanc gauche. Diagramme privilégié pour les turbines à vapeur.</li>
  </ul>

  <h3>Diagramme des frigoristes (ln P, h)</h3>
  <ul>
    <li>Isobares horizontales, isenthalpes verticales : un échangeur isobare est un segment horizontal de longueur \(|q|\), un détendeur un segment vertical.</li>
    <li>Isothermes quasi verticales dans le liquide, horizontales sous la cloche, fortement descendantes dans la vapeur (presque verticales à basse pression, où la vapeur se comporte en gaz parfait) ; isentropes très pentues dans la vapeur.</li>
    <li>Diagramme privilégié pour les machines frigorifiques et pompes à chaleur.</li>
  </ul>

  <h3>Utiliser des tables</h3>
  <p>Tables de saturation (en fonction de \(T\) ou de \(P\) : \(P_{sat}\), \(v_L\), \(v_V\), \(h_L\), \(h_V\), \(s_L\), \(s_V\)) et tables de vapeur surchauffée (en fonction de \((P, T)\)). Entre deux lignes, on interpole linéairement : \(f(T)\) \(\approx f_1 + (f_2 - f_1)\dfrac{T - T_1}{T_2 - T_1}\).</p>
  <div class="notice"><strong>Origine des valeurs.</strong> Les valeurs absolues de \(h\) et \(s\) dépendent d'un état de référence conventionnel : seules leurs différences ont un sens physique. Ne jamais mélanger deux tables ou diagrammes de références différentes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · RENDEMENT ISENTROPIQUE ET COMPRESSION ÉTAGÉE</div>
  <h2>Chiffrer l'écart à la machine idéale</h2>
  <div class="intro">Un compresseur ou une turbine calorifugé idéal serait isentropique. Les frottements internes font croître l'entropie : le rendement isentropique mesure ce défaut, à pressions d'entrée et de sortie imposées.</div>

  <h3>Définitions</h3>
  <p>On compare l'évolution réelle \(e \to s\) à l'évolution isentropique fictive \(e \to s_{is}\) qui part du même état d'entrée et aboutit à la <strong>même pression de sortie</strong>. Comme \(\left(\partial h/\partial s\right)_P = T \gt 0\) et \(s_s \gt s_e\), on a \(h_s \gt h_{s,is}\) : la sortie réelle est plus chaude (ou, si elle est diphasique, de titre plus élevé).</p>
  <div class="prop-box">
    <strong>Rendements isentropiques</strong> (organes calorifugés, \(\Delta e_c\) et \(\Delta e_p\) négligées) :
    $$\eta_{is,C} = \frac{w_{i,is}}{w_i} = \frac{h_{s,is} - h_e}{h_s - h_e} \qquad\qquad \eta_{is,T} = \frac{w_i}{w_{i,is}} = \frac{h_e - h_s}{h_e - h_{s,is}}$$
    Le compresseur réel demande <em>plus</em> de travail que l'idéal, la turbine réelle en fournit <em>moins</em> : dans les deux cas \(\eta_{is} \leq 1\). Valeurs usuelles : 0,75 à 0,90 pour un compresseur, 0,80 à 0,92 pour une turbine.
  </div>
  <p><strong>Gaz parfait</strong> (\(c_p\) constant) : on remplace \(h\) par \(c_p T\), et la loi de Laplace donne la température de sortie isentropique :</p>
  <div class="formula">$$T_{s,is} = T_e\left(\frac{P_s}{P_e}\right)^{\frac{\gamma - 1}{\gamma}}$$</div>

  <div class="notice"><strong>Piège.</strong> Le rendement isentropique compare deux évolutions adiabatiques de <em>même pression de sortie</em>, pas de même température de sortie. Pour une turbine aussi, le fluide sort plus chaud (ou, en vapeur humide, avec un titre plus élevé) que dans le cas isentropique.</div>

  <div class="method-box">
    <strong>Exemple — compresseur réel et tuyère</strong>
    <ol>
      <li><strong>Compresseur</strong> : de l'air (gaz parfait, \(c_p = 1{,}0\ \text{kJ·K}^{-1}\text{·kg}^{-1}\), \(\gamma = 1{,}4\)) est comprimé de 1 bar et 290 K à 6 bar, avec un rendement isentropique \(\eta_s = 0{,}85\). Compression isentropique : \(T_{2s} = 290\times6^{0{,}4/1{,}4} \approx 484\ \text{K}\). Réelle : \(T_2 = T_1 + (T_{2s} - T_1)/\eta_s \approx 518\ \text{K}\). Travail indiqué \(w_i = c_p(T_2 - T_1) \approx 229\ \text{kJ·kg}^{-1}\) : 229 kW pour un débit de 1 kg·s⁻¹.</li>
      <li><strong>Tuyère</strong> calorifugée, sans partie mobile (\(w_i = 0\)), vitesse d'entrée négligeable : \(\tfrac12 v_s^2 = h_e - h_s = c_p(T_e - T_s)\). De 600 K à 400 K : \(v_s = \sqrt{2\times1\,000\times200} \approx 630\ \text{m·s}^{-1}\). La tuyère convertit l'enthalpie en énergie cinétique : c'est la poussée des réacteurs.</li>
    </ol>
  </div>

  <h3>Compression étagée avec refroidissement intermédiaire (complément)</h3>
  <p>Puisque \(w_{i,\text{rév}} = \int v\,\mathrm{d}P\), on comprime à moindre coût un gaz <em>froid</em> (\(v\) plus petit). On réalise donc la compression de \(P_e\) à \(P_s\) en deux étages isentropiques séparés par un échangeur isobare qui ramène le gaz à \(T_e\) sous la pression intermédiaire \(P_m\). Pour un gaz parfait, avec \(\beta = (\gamma - 1)/\gamma\) :</p>
  <div class="formula">$$w_i = c_p T_e\left[\left(\frac{P_m}{P_e}\right)^{\beta} + \left(\frac{P_s}{P_m}\right)^{\beta} - 2\right]$$</div>
  <div class="prop-box">
    <strong>Pression intermédiaire optimale :</strong> \(w_i\) est minimal pour \(P_m = \sqrt{P_e P_s}\) : les deux étages ont alors le même rapport de compression et consomment le même travail. Avec \(N\) étages identiques et \(\tau = P_s/P_e\) :
    $$w_N = N c_p T_e\left(\tau^{\beta/N} - 1\right) \xrightarrow[N\to\infty]{} r\,T_e\ln\tau$$
    la limite est le travail de la compression isotherme réversible, borne inférieure.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstrations</span>
    <span class="prompt">Optimum de \(P_m\) et limite à \(N\) étages</span>
    <div class="content">
      <p><strong>Optimum.</strong> \(\dfrac{\mathrm{d}w_i}{\mathrm{d}P_m}\) \(= c_p T_e\,\beta\left[\dfrac{P_m^{\beta-1}}{P_e^{\beta}} - \dfrac{P_s^{\beta}}{P_m^{\beta+1}}\right]\) \(= 0\) \(\iff P_m^{2\beta}\) \(= (P_e P_s)^{\beta}\) \(\iff P_m\) \(= \sqrt{P_e P_s}\). La dérivée passe du négatif au positif : c'est un minimum.</p>
      <p><strong>Limite.</strong> \(\tau^{\beta/N}\) \(= \exp\!\left(\dfrac{\beta\ln\tau}{N}\right)\) \(= 1 + \dfrac{\beta\ln\tau}{N} + o\!\left(\dfrac1N\right)\), donc \(w_N \to c_p\,\beta\,T_e\ln\tau = r\,T_e\ln\tau\) puisque \(c_p\,\beta = r\).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CYCLES INDUSTRIELS ET PERFORMANCES</div>
  <h2>Machines à compression de vapeur, centrales et turbines à gaz</h2>
  <div class="intro">En reliant les organes en boucle, le fluide décrit un cycle. La performance d'une installation est le rapport de ce qu'elle produit d'utile à ce qu'elle coûte, à comparer à la borne de Carnot.</div>

  <h3>Rendement et efficacité</h3>
  <div class="def-box">
    <strong>Moteur :</strong> \(\eta = \dfrac{-\sum w_i}{q_C}\) (travail net fourni / chaleur reçue de la source chaude), toujours \(\lt 1\).<br>
    <strong>Machine frigorifique :</strong> efficacité (ou COP) \(e_F = \dfrac{q_F}{w_i}\) ; <strong>pompe à chaleur :</strong> \(e_{PAC} = \dfrac{-q_C}{w_i}\). Une efficacité peut dépasser 1.<br>
    <strong>Bornes de Carnot</strong> (sources à \(T_C\) et \(T_F\)) : \(\eta_C = 1 - \dfrac{T_F}{T_C}\), \(e_{F,C} = \dfrac{T_F}{T_C - T_F}\), \(e_{PAC,C} = \dfrac{T_C}{T_C - T_F}\).
  </div>

  <h3>Machine frigorifique et pompe à chaleur à compression de vapeur</h3>
  <ol>
    <li><strong>1 → 2 compression</strong> calorifugée de la vapeur sèche (basse → haute pression) ;</li>
    <li><strong>2 → 3 condenseur</strong> isobare : désurchauffe, condensation totale, parfois léger sous-refroidissement ; le fluide cède \(q_C \lt 0\) au milieu chaud ;</li>
    <li><strong>3 → 4 détendeur</strong> isenthalpique : vaporisation partielle et chute de température ;</li>
    <li><strong>4 → 1 évaporateur</strong> isobare : vaporisation complète (et légère surchauffe) ; le fluide reçoit \(q_F \gt 0\) du milieu à refroidir.</li>
  </ol>
  <div class="formula">$$e_F = \frac{h_1 - h_4}{h_2 - h_1} \qquad\qquad e_{PAC} = \frac{h_2 - h_3}{h_2 - h_1} = 1 + e_F$$</div>
  <p>Choix technologiques : un simple détendeur remplace la turbine (le travail récupérable sur un liquide est faible et la machine serait coûteuse) ; la surchauffe en sortie d'évaporateur protège le compresseur ; l'évaporation se fait <em>plus froid</em> que le milieu à refroidir et la condensation <em>plus chaud</em> que le milieu extérieur, pour que la chaleur circule dans le bon sens — c'est souvent la principale cause d'écart à l'efficacité de Carnot calculée entre les deux milieux.</p>

  <h3>Centrale à vapeur (cycle de Rankine avec surchauffe, ou cycle de Hirn)</h3>
  <ol>
    <li><strong>1 → 2 pompe</strong> : compression du liquide, travail \(w_P = h_2 - h_1\) très faible ;</li>
    <li><strong>2 → 3 générateur de vapeur</strong> isobare : échauffement du liquide, vaporisation, surchauffe ;</li>
    <li><strong>3 → 4 turbine</strong> : détente jusqu'à la pression du condenseur, sortie en vapeur humide ;</li>
    <li><strong>4 → 1 condenseur</strong> : retour au liquide saturant.</li>
  </ol>
  <div class="formula">$$\eta = \frac{(h_3 - h_4) - (h_2 - h_1)}{h_3 - h_2} \approx \frac{h_3 - h_4}{h_3 - h_2}$$</div>
  <p>La surchauffe élève la température moyenne à laquelle la chaleur est reçue et garde un titre élevé en fin de détente (\(x \gtrsim 0{,}85\) à \(0{,}9\)), car les gouttelettes érodent les aubes. La pression du condenseur est très basse (quelques centièmes de bar à un dixième de bar) pour condenser près de la température ambiante.</p>

  <div class="method-box">
    <strong>Exemple — rendement d'une centrale à vapeur</strong>
    <p>Cycle de la figure : condenseur à 0,1 bar, générateur de vapeur à 60 bar, surchauffe à 500 °C, pompe et turbine supposées isentropiques. Valeurs tirées des tables : \(h_1 = 192\), \(h_2 = 198\), \(h_3 = 3\,423\), \(h_4 = 2\,180\ \text{kJ·kg}^{-1}\) (titre 0,83 en sortie de turbine).</p>
    <ol>
      <li>Travail de la turbine : \(h_3 - h_4 = 1\,243\ \text{kJ·kg}^{-1}\) ; de la pompe : \(h_2 - h_1 = 6\ \text{kJ·kg}^{-1}\) (négligeable : comprimer un liquide coûte peu).</li>
      <li>Transfert thermique reçu au générateur : \(h_3 - h_2 = 3\,225\ \text{kJ·kg}^{-1}\).</li>
      <li>Rendement : \(\eta = \dfrac{1\,243 - 6}{3\,225} \approx 0{,}38\), contre \(1 - \dfrac{319}{773} \approx 0{,}59\) pour un cycle de Carnot entre les mêmes températures extrêmes.</li>
      <li>Pour une centrale de 1 GW électriques, il faut un débit de vapeur d'environ \(10^9/1{,}24\times10^6 \approx 800\ \text{kg·s}^{-1}\), et le condenseur évacue plus de 1,5 GW vers la rivière ou les tours de refroidissement.</li>
    </ol>
  </div>

  <h3>Turbine à gaz et turboréacteur</h3>
  <p>Cycle de Joule (ou de Brayton) idéal d'un gaz parfait : compression isentropique 1→2, apport de chaleur isobare dans la chambre de combustion 2→3, détente isentropique dans la turbine 3→4, fermeture isobare fictive 4→1 (rejet à l'atmosphère). Avec \(\tau = P_2/P_1\) :</p>
  <div class="formula">$$\eta = 1 - \frac{T_1}{T_2} = 1 - \tau^{-\frac{\gamma-1}{\gamma}}$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir le rendement du cycle de Joule idéal</span>
    <div class="content"><p>Seuls les échangeurs reçoivent de la chaleur : \(q_{23} = c_p(T_3 - T_2)\), \(q_{41} = c_p(T_1 - T_4)\). Le premier principe sur le cycle donne \(-\sum w_i = q_{23} + q_{41}\), d'où \(\eta = 1 - \dfrac{T_4 - T_1}{T_3 - T_2}\). Laplace sur les deux isentropes : \(\dfrac{T_2}{T_1} = \dfrac{T_3}{T_4} = \tau^{\beta}\), donc \(T_4 - T_1 = (T_3 - T_2)\,\dfrac{T_1}{T_2}\) et \(\eta = 1 - \dfrac{T_1}{T_2}\).</p></div>
  </div>
  <p><strong>Turboréacteur :</strong> la turbine fournit exactement le travail du compresseur (arbre commun : \(w_T + w_C = 0\)). L'enthalpie restante est convertie en énergie cinétique dans la tuyère : \(c_s = \sqrt{c_e^2 + 2(h_e - h_s)}\). L'éjection rapide des gaz produit la poussée.</p>

  <h3>Pourquoi les machines réelles restent loin de Carnot</h3>
  <ul>
    <li><strong>irréversibilités internes</strong> : frottements dans les machines (\(\eta_{is} \lt 1\)), laminage dans le détendeur ;</li>
    <li><strong>irréversibilités externes</strong> : transferts thermiques sous des écarts de température finis dans les échangeurs, désurchauffe à haute température, échauffement du liquide bien en dessous de la température maximale dans la chaudière ;</li>
    <li>pertes thermiques vers l'ambiance, pertes de charge.</li>
  </ul>
  <p>Le rapport \(e/e_{\text{Carnot}}\) (ou \(\eta/\eta_C\)), appelé rendement de second principe, mesure la qualité thermodynamique de l'installation.</p>
  <div class="notice"><strong>Ordres de grandeur.</strong> Réfrigérateur domestique : \(e_F \approx 2\) à 3. Pompe à chaleur air–eau : \(e_{PAC} \approx 3\) à 4. Centrale nucléaire : \(\eta \approx 33\ \%\). Turbine à gaz seule : 35 à 40 %. Cycle combiné gaz–vapeur : environ 60 %.</div>
</div>

  <h2>Stratégies pour les exercices de thermodynamique industrielle</h2>

  <div class="method-box">
    <strong>Méthode 1 — Faire le bilan d'un organe</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Surface de contrôle.</span> Délimiter \(\Sigma\), repérer les entrées et sorties, vérifier le régime permanent.</li>
      <li><span class="step">Hypothèses.</span> Calorifugé ? Parties mobiles ? \(\Delta e_c\) et \(\Delta e_p\) négligeables (comparer à \(\Delta h\)) ? Isobare ?</li>
      <li><span class="step">Bilan.</span> Écrire \(\Delta(h + e_c + e_p) = w_i + q\), puis le simplifier.</li>
      <li><span class="step">Puissances.</span> Multiplier par \(D_m\) : \(\mathcal{P}_i = D_m w_i\), \(\mathcal{P}_{th} = D_m q\).</li>
      <li><span class="step">Contrôle.</span> Vérifier le signe (reçu par le fluide) et l'ordre de grandeur (kJ/kg).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Redémontrer le premier principe industriel</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Système fermé.</span> Définir \(\Sigma^*\) à \(t\) (contenu de \(\Sigma\) + \(\delta m_e\)) et à \(t + \mathrm{d}t\) (contenu de \(\Sigma\) + \(\delta m_s\)).</li>
      <li><span class="step">Régime permanent.</span> En déduire \(\delta m_e = \delta m_s = D_m\,\mathrm{d}t\) et \(\mathrm{d}E^* = \delta m\,\Delta(u + e_c + e_p)\).</li>
      <li><span class="step">Travaux.</span> Lister le travail indiqué et les deux travaux de transvasement \(+P_e v_e\,\delta m\) et \(-P_s v_s\,\delta m\).</li>
      <li><span class="step">Conclure.</span> Appliquer le premier principe à \(\Sigma^*\) et regrouper \(u + Pv = h\). Même démarche pour l'entropie (sans terme de transvasement).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Calculer l'entropie créée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">\(\Delta s\).</span> Fonction d'état : tables, diagramme, ou formule du modèle (gaz parfait, liquide, mélange diphasique).</li>
      <li><span class="step">\(s_{\text{éch}}\).</span> Nul si calorifugé ; \(q/T_{\text{ext}}\) si la paroi est à température uniforme. Prendre la température <em>de la frontière</em>, pas celle du fluide.</li>
      <li><span class="step">Conclure.</span> \(s_{\text{créée}} = \Delta s - s_{\text{éch}}\), puis \(\dot S_{\text{créée}} = D_m\,s_{\text{créée}}\). Un résultat négatif signale une erreur (signe de \(q\), mauvaise température, données incohérentes).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Exploiter un rendement isentropique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">État isentropique.</span> À partir de l'entrée, déterminer \(h_{s,is}\) sur l'isobare de sortie : même \(s\) (tables, verticale du diagramme \((h,s)\)) ou \(T_{s,is} = T_e(P_s/P_e)^{\beta}\) pour un gaz parfait.</li>
      <li><span class="step">Bon sens du rapport.</span> Compresseur : \(h_s = h_e + (h_{s,is} - h_e)/\eta_{is}\). Turbine : \(h_s = h_e - \eta_{is}(h_e - h_{s,is})\).</li>
      <li><span class="step">Exploiter.</span> En déduire \(w_i\), puis l'état réel de sortie (\(T_s\) ou titre) et éventuellement \(s_{\text{créée}}\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Tracer un cycle dans un diagramme</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">États.</span> Placer chaque point par deux grandeurs connues : (\(P\), \(T\)) hors de la cloche, (\(P\) ou \(T\), \(x\)) dessous ; « saturant » = sur la cloche.</li>
      <li><span class="step">Évolutions.</span> Échangeur sans pertes de charge : le long d'une isobare ; détendeur : isenthalpe ; organe calorifugé réversible : isentrope ; organe réel : point de sortie décalé vers les \(s\) croissants.</li>
      <li><span class="step">Lire.</span> Relever \(h\) aux points clés ; les travaux et transferts sont des différences d'enthalpie.</li>
      <li><span class="step">Sens de parcours.</span> Moteur : sens horaire en \((T,s)\) ; récepteur (frigo, PAC) : sens trigonométrique.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Traiter un état diphasique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Saturation.</span> Lire \(h_L\), \(h_V\), \(s_L\), \(s_V\) à la pression (ou température) de l'état.</li>
      <li><span class="step">Titre.</span> Après un détendeur : \(x = (h - h_L)/(h_V - h_L)\). Après une détente isentropique : \(x = (s - s_L)/(s_V - s_L)\).</li>
      <li><span class="step">Vérifier.</span> \(0 \leq x \leq 1\) ; sinon l'état est hors de la cloche (liquide ou vapeur surchauffée) et il faut une autre table.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Analyser une installation complète</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Schéma.</span> Numéroter les points, y reporter débits, pressions, températures, nature du fluide (liquide, vapeur humide, sèche).</li>
      <li><span class="step">Débits.</span> Écrire la conservation de la masse à chaque nœud (mélangeur, séparateur, soutirage).</li>
      <li><span class="step">Organes.</span> Bilan organe par organe (méthode 1), en progressant dans le sens des états connus.</li>
      <li><span class="step">Contrôle global.</span> Vérifier \(\sum w_i + \sum q = 0\) sur un circuit fermé.</li>
      <li><span class="step">Performance.</span> Identifier l'utile et le coûteux, calculer \(\eta\) ou \(e\), comparer à Carnot et nommer les irréversibilités responsables de l'écart.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Confondre \(w_i\) avec le travail total des forces de pression : le transvasement est déjà dans \(h\).</li>
      <li>Utiliser \(-\int P\,\mathrm{d}v\) au lieu de \(\int v\,\mathrm{d}P\) pour un organe traversé par un fluide.</li>
      <li>Négliger \(\Delta e_c\) dans une tuyère : c'est justement le terme recherché.</li>
      <li>Croire un organe calorifugé forcément isentropique.</li>
      <li>Inverser le rapport du rendement isentropique (un rendement supérieur à 1 doit alerter).</li>
      <li>Oublier les unités : enthalpies des tables en kJ/kg, \(c_p\) en J·kg⁻¹·K⁻¹, pressions en Pa dans \(v\,\Delta P\).</li>
      <li>Températures en kelvins dans les logarithmes et les rendements de Carnot.</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Tuyère d'éjection</h3>
  <div class="statement">De l'air, assimilé à un gaz parfait (\(c_p = 1{,}0\ \text{kJ·kg}^{-1}\text{·K}^{-1}\), \(\gamma = 1{,}4\)), traverse en régime permanent une tuyère horizontale calorifugée. Il entre à \(T_e = 600\ \text{K}\) avec la vitesse \(c_e = 40\ \text{m·s}^{-1}\) et sort à \(T_s = 540\ \text{K}\).</div>
  <div class="q"><strong>Q1.</strong> Justifier les hypothèses « calorifugée » et \(w_i = 0\). Écrire le bilan d'énergie.</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse de sortie \(c_s\).</div>
  <div class="q"><strong>Q3.</strong> On suppose l'écoulement isentropique. Calculer \(P_s/P_e\), puis le rapport des sections \(S_s/S_e\). La tuyère est-elle convergente ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Aucune pièce mobile, donc \(w_i = 0\) ; le passage est très rapide, l'échange thermique avec les parois est négligeable. \(\Delta e_p = 0\) (horizontale) mais \(\Delta e_c\) n'est surtout pas négligeable : \(h_s + \tfrac12 c_s^2 = h_e + \tfrac12 c_e^2\).</p>
    <p><strong>Q2.</strong> \(c_s\) \(= \sqrt{c_e^2 + 2c_p(T_e - T_s)}\) \(= \sqrt{1600 + 2\times1000\times60}\) \(= \sqrt{121\,600}\) \(\approx 349\ \text{m·s}^{-1}\).</p>
    <p><strong>Q3.</strong> Laplace : \(\dfrac{P_s}{P_e}\) \(= \left(\dfrac{T_s}{T_e}\right)^{\gamma/(\gamma-1)}\) \(= 0{,}9^{3{,}5}\) \(\approx 0{,}69\). Conservation du débit : \(\dfrac{c_e S_e}{v_e} = \dfrac{c_s S_s}{v_s}\), avec \(v = rT/P\) : \(\dfrac{S_s}{S_e}\) \(= \dfrac{c_e}{c_s}\cdot\dfrac{T_s}{T_e}\cdot\dfrac{P_e}{P_s}\) \(= \dfrac{40}{349}\times\dfrac{0{,}90}{0{,}69}\) \(\approx 0{,}15\). La section diminue : tuyère convergente, qui accélère le gaz en abaissant sa pression et sa température.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Pomper un liquide ou comprimer un gaz ?</h3>
  <div class="statement">Une machine calorifugée doit faire passer un fluide, pris à 300 K, de 1,0 bar à 50 bar ; on néglige \(\Delta e_c\) et \(\Delta e_p\) et on raisonne par kilogramme de fluide.<br>
  Cas A : eau liquide incompressible, \(v = 1{,}0\times10^{-3}\ \text{m}^3\text{·kg}^{-1}\), \(c_\ell = 4{,}18\ \text{kJ·kg}^{-1}\text{·K}^{-1}\).<br>
  Cas B : air, gaz parfait, \(c_p = 1{,}0\ \text{kJ·kg}^{-1}\text{·K}^{-1}\), \(\gamma = 1{,}4\), \(r = 287\ \text{J·kg}^{-1}\text{·K}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer le travail indiqué d'une évolution réversible et calculer \(w_{i,A}\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la température de sortie et le travail \(w_{i,B}\) pour une compression isentropique de l'air. Comparer.</div>
  <div class="q"><strong>Q3.</strong> La pompe réelle a un rendement isentropique de 0,70. Quel est l'échauffement de l'eau ? Commenter.</div>
  <div class="q"><strong>Q4.</strong> Quel serait le travail minimal pour l'air, avec une compression isotherme réversible à 300 K ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Réversible : \(w_i = \int v\,\mathrm{d}P\). Liquide : \(w_{i,A}\) \(= v\,\Delta P\) \(= 1{,}0\times10^{-3}\times49\times10^5\) \(= 4{,}9\ \text{kJ·kg}^{-1}\).</p>
    <p><strong>Q2.</strong> \(T_s = 300\times50^{0{,}286} \approx 917\ \text{K}\) ; \(w_{i,B} = c_p(T_s - T_e) \approx 617\ \text{kJ·kg}^{-1}\), environ 125 fois plus que pour l'eau. C'est pourquoi une centrale à vapeur comprime le fluide à l'état <strong>liquide</strong>, avant de le vaporiser.</p>
    <p><strong>Q3.</strong> Travail réel : \(w_i = 4{,}9/0{,}70 = 7{,}0\ \text{kJ·kg}^{-1}\). Avec \(\Delta h = c_\ell\,\Delta T + v\,\Delta P = w_i\) : \(\Delta T\) \(= \dfrac{w_i - v\Delta P}{c_\ell}\) \(= \dfrac{2{,}1\times10^3}{4180}\) \(\approx 0{,}5\ \text{K}\). Le travail dissipé par frottement réchauffe très peu le liquide ; il est souvent négligé dans le bilan d'une centrale.</p>
    <p><strong>Q4.</strong> Isotherme réversible : \(w_i\) \(= \int v\,\mathrm{d}P\) \(= rT\ln\dfrac{P_s}{P_e}\) \(= 287\times300\times\ln 50\) \(\approx 337\ \text{kJ·kg}^{-1}\), presque deux fois moins que l'isentropique — d'où l'intérêt de refroidir pendant la compression.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Turbine à gaz réelle</h3>

  <div class="q"><strong>Q1.</strong> Calculer la température \(T_{2,is}\) en fin de détente isentropique.</div>
  <div class="q"><strong>Q2.</strong> En déduire la température réelle de sortie \(T_2\) et le travail indiqué \(w_i\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance mécanique récupérée sur l'arbre.</div>
  <div class="q"><strong>Q4.</strong> Calculer l'entropie massique créée. Représenter les deux évolutions dans le diagramme \((T,s)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(T_{2,is}\) \(= T_1\left(\dfrac{P_2}{P_1}\right)^{\beta}\) \(= 1200\times0{,}1^{0{,}286}\) \(\approx 622\ \text{K}\).</p>
    <p><strong>Q2.</strong> \(\eta_{is} = \dfrac{T_1 - T_2}{T_1 - T_{2,is}}\), donc \(T_2 = 1200 - 0{,}88\times578 \approx 691\ \text{K}\) (plus chaud que \(T_{2,is}\)). \(w_i = c_p(T_2 - T_1) \approx -509\ \text{kJ·kg}^{-1}\).</p>
    <p><strong>Q3.</strong> \(\mathcal{P}_i = D_m w_i \approx -2{,}5\ \text{MW}\) : la turbine fournit environ 2,5 MW à l'arbre.</p>
    <p><strong>Q4.</strong> Calorifugée : \(s_{\text{créée}}\) \(= \Delta s\) \(= c_p\ln\dfrac{T_2}{T_1} - r\ln\dfrac{P_2}{P_1}\) \(= 1000\ln\dfrac{691}{1200} + 287\ln 10\) \(\approx -552 + 661\) \(\approx 109\ \text{J·kg}^{-1}\text{·K}^{-1}\). En \((T,s)\) : l'évolution isentropique est un segment vertical de l'isobare 10 bar à l'isobare 1 bar ; l'évolution réelle aboutit sur l'isobare 1 bar plus à droite et plus haut.</p>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Mélanger ou échanger ?</h3>
  <div class="statement">On dispose de deux courants d'eau liquide (\(c_\ell = 4{,}18\ \text{kJ·kg}^{-1}\text{·K}^{-1}\), incompressible) à la même pression : un courant chaud \(D_1 = 0{,}30\ \text{kg·s}^{-1}\) à \(70\ °\text{C}\) et un courant froid \(D_2 = 0{,}90\ \text{kg·s}^{-1}\) à \(10\ °\text{C}\). Les organes sont calorifugés, sans pièce mobile, et les pertes de charge négligées.</div>
  <div class="q"><strong>Q1.</strong> Les deux courants sont réunis dans un mélangeur. Calculer la température de sortie.</div>
  <div class="q"><strong>Q2.</strong> Calculer le taux d'entropie créée dans le mélangeur.</div>
  <div class="q"><strong>Q3.</strong> On utilise plutôt un échangeur à contre-courant : l'eau froide en sort à \(28\ °\text{C}\). Température de sortie de l'eau chaude ? Puissance échangée ? Taux d'entropie créée ?</div>
  <div class="q"><strong>Q4.</strong> Quelle est la température maximale que pourrait atteindre l'eau froide dans un échangeur à contre-courant de surface infinie ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Bilan enthalpique à deux entrées, une sortie (isobare) : \(D_1 c_\ell(T_s - T_1) + D_2 c_\ell(T_s - T_2) = 0\), donc \(T_s\) \(= \dfrac{0{,}30\times70 + 0{,}90\times10}{1{,}20}\) \(= 25\ °\text{C}\).</p>
    <p><strong>Q2.</strong> Sans échange thermique : \(\dot S_{\text{créée}}\) \(= c_\ell\left[D_1\ln\dfrac{T_s}{T_1} + D_2\ln\dfrac{T_s}{T_2}\right]\) \(= 4180\left[0{,}30\ln\dfrac{298}{343} + 0{,}90\ln\dfrac{298}{283}\right]\) \(\approx 18\ \text{W·K}^{-1}\) (températures en kelvins).</p>
    <p><strong>Q3.</strong> \(D_1(T_1 - T_{1s}) = D_2(28 - 10)\), donc \(T_{1s} = 70 - 3\times18 = 16\ °\text{C}\). Puissance : \(D_2\,c_\ell\times18 \approx 68\ \text{kW}\). \(\dot S_{\text{créée}}\) \(= 4180\left[0{,}30\ln\dfrac{289}{343} + 0{,}90\ln\dfrac{301}{283}\right]\) \(\approx 17\ \text{W·K}^{-1} \gt 0\) : le transfert thermique sous écart de température fini reste irréversible, mais les deux eaux ne sont pas mélangées (utile si l'une est sanitaire).</p>
    <p><strong>Q4.</strong> L'eau chaude ne peut pas sortir plus froide que l'eau froide entrante (10 °C) : \(T_{2s} \leq 10 + \dfrac{D_1}{D_2}(70 - 10)\) \(= 30\ °\text{C}\). Le débit chaud, trois fois plus faible, limite l'échange.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Compression étagée d'air</h3>
  <div class="statement">Un compresseur d'atelier porte de l'air (gaz parfait, \(c_p = 1{,}0\ \text{kJ·kg}^{-1}\text{·K}^{-1}\), \(\gamma = 1{,}4\), \(r = 287\ \text{J·kg}^{-1}\text{·K}^{-1}\)) de \(P_e = 1{,}0\ \text{bar}\), \(T_e = 293\ \text{K}\) à \(P_s = 16\ \text{bar}\). Chaque étage est supposé isentropique ; \(\Delta e_c\) et \(\Delta e_p\) sont négligées.</div>
  <div class="q"><strong>Q1.</strong> Compression en un seul étage : température de sortie et travail indiqué \(w_1\).</div>
  <div class="q"><strong>Q2.</strong> Deux étages séparés par un refroidisseur isobare qui ramène l'air à \(T_e\) sous la pression \(P_m\). Exprimer le travail total \(w_2(P_m)\) et montrer qu'il est minimal pour \(P_m = \sqrt{P_e P_s}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(w_2\) à l'optimum, le gain relatif par rapport à Q1 et la chaleur massique évacuée par le refroidisseur.</div>
  <div class="q"><strong>Q4.</strong> Généraliser à \(N\) étages identiques et déterminer la limite \(N \to \infty\). Interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(T_s = 293\times16^{0{,}286} \approx 647\ \text{K}\) ; \(w_1 = c_p(T_s - T_e) \approx 354\ \text{kJ·kg}^{-1}\). Une sortie à près de 375 °C est inacceptable pour les huiles et les joints.</p>
    <p><strong>Q2.</strong> Chaque étage part de \(T_e\) : \(w_2\) \(= c_p T_e\left[(P_m/P_e)^{\beta} - 1\right] + c_p T_e\left[(P_s/P_m)^{\beta} - 1\right]\). En annulant la dérivée par rapport à \(P_m\) : \(P_m^{2\beta} = (P_eP_s)^{\beta}\), soit \(P_m = \sqrt{P_eP_s} = 4{,}0\ \text{bar}\) (minimum, car \(w_2 \to +\infty\) aux bornes \(P_m \to 0\) et \(P_m \to +\infty\)).</p>
    <p><strong>Q3.</strong> Sortie de chaque étage : \(293\times4^{0{,}286} \approx 435\ \text{K}\). \(w_2\) \(= 2\times1{,}0\times(435 - 293)\) \(\approx 285\ \text{kJ·kg}^{-1}\) : gain d'environ 20 %. Refroidisseur : \(q = c_p(293 - 435) \approx -142\ \text{kJ·kg}^{-1}\).</p>
    <p><strong>Q4.</strong> Optimum : rapport \(\tau^{1/N}\) par étage, \(w_N = Nc_pT_e(\tau^{\beta/N} - 1)\). Développement limité : \(w_N \to c_p\beta T_e\ln\tau\) \(= rT_e\ln\tau\) \(= 287\times293\times\ln16\) \(\approx 233\ \text{kJ·kg}^{-1}\). C'est le travail de la compression isotherme réversible : avec une infinité d'étages refroidis, le gaz reste à \(T_e\). En pratique, 2 à 4 étages réalisent l'essentiel du gain (\(w_3 \approx 266\), \(w_4 \approx 257\ \text{kJ·kg}^{-1}\)).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Centrale thermique à vapeur avec surchauffe</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>thermodynamique industrielle</em>, grand classique). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    L'eau d'une centrale décrit en régime permanent le cycle suivant, avec un débit \(D_m\) :
    <ul style="margin:.4rem 0">
      <li>1 → 2 : la pompe, calorifugée et supposée réversible, porte le liquide saturant à 0,10 bar jusqu'à 60 bar ;</li>
      <li>2 → 3 : le générateur de vapeur chauffe, vaporise puis surchauffe l'eau de façon isobare jusqu'à \(500\ °\text{C}\) ;</li>
      <li>3 → 4 : la turbine, calorifugée, détend la vapeur jusqu'à 0,10 bar avec un rendement isentropique \(\eta_{is} = 0{,}85\) ;</li>
      <li>4 → 1 : le condenseur liquéfie complètement le fluide de façon isobare.</li>
    </ul>
    On néglige partout \(\Delta e_c\) et \(\Delta e_p\). Données (valeurs arrondies) : à 0,10 bar, \(T_{sat} = 45{,}8\ °\text{C}\), \(v_L = 1{,}01\times10^{-3}\ \text{m}^3\text{·kg}^{-1}\), \(h_L = 191{,}8\) et \(h_V = 2584\ \text{kJ·kg}^{-1}\), \(s_L = 0{,}649\) et \(s_V = 8{,}149\ \text{kJ·kg}^{-1}\text{·K}^{-1}\). Vapeur surchauffée à 60 bar et \(500\ °\text{C}\) : \(h_3 = 3422\ \text{kJ·kg}^{-1}\), \(s_3 = 6{,}880\ \text{kJ·kg}^{-1}\text{·K}^{-1}\). Vapeur saturante sèche à 60 bar : \(s = 5{,}890\ \text{kJ·kg}^{-1}\text{·K}^{-1}\). Eau liquide : \(c_\ell = 4{,}18\ \text{kJ·kg}^{-1}\text{·K}^{-1}\).
  </div>

  <p class="exo-part">Partie A — Pompe et générateur de vapeur</p>
  <div class="q"><strong>A1.</strong> Établir l'expression du travail indiqué de la pompe et le calculer. En déduire \(h_2\).</div>
  <div class="q"><strong>A2.</strong> Calculer le transfert thermique massique \(q_{23}\) reçu dans le générateur de vapeur.</div>

  <p class="exo-part">Partie B — Détente dans la turbine</p>
  <div class="q"><strong>B1.</strong> Calculer le titre \(x_{4,is}\) et l'enthalpie \(h_{4,is}\) en fin de détente isentropique.</div>
  <div class="q"><strong>B2.</strong> En déduire \(h_4\), le titre réel \(x_4\) et le travail \(w_{34}\). Calculer l'entropie massique créée dans la turbine.</div>
  <div class="q"><strong>B3.</strong> Sans surchauffe (vapeur saturante sèche à 60 bar en entrée de turbine), que vaudrait le titre en fin de détente isentropique ? Pourquoi est-ce gênant ?</div>

  <p class="exo-part">Partie C — Performances</p>
  <div class="q"><strong>C1.</strong> Calculer le rendement \(\eta\) de la centrale. Que vaudrait-il avec une turbine isentropique ?</div>
  <div class="q"><strong>C2.</strong> La centrale fournit une puissance mécanique nette de 300 MW. Calculer \(D_m\), la puissance thermique reçue dans le générateur de vapeur et celle cédée au condenseur.</div>
  <div class="q"><strong>C3.</strong> Le condenseur est refroidi par de l'eau de rivière dont l'échauffement est limité à 6 K. Calculer son débit.</div>

  <p class="exo-part">Partie D — Comparaison avec Carnot</p>
  <div class="q"><strong>D1.</strong> Calculer le rendement de Carnot entre \(500\ °\text{C}\) et \(45{,}8\ °\text{C}\).</div>
  <div class="q"><strong>D2.</strong> On définit la température moyenne de réception de chaleur \(\bar T = q_{23}/(s_3 - s_2)\). Justifier que \(s_2 = s_1\), calculer \(\bar T\), puis montrer que le rendement du cycle à turbine isentropique s'écrit \(1 - T_{sat}/\bar T\). Conclure sur les causes de l'écart à Carnot.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Pompe calorifugée réversible : \(\mathrm{d}h = v\,\mathrm{d}P\), liquide incompressible : \(w_P\) \(= v_L(P_2 - P_1)\) \(= 1{,}01\times10^{-3}\times(60 - 0{,}10)\times10^5\) \(\approx 6{,}0\ \text{kJ·kg}^{-1}\). \(h_2 = h_1 + w_P \approx 197{,}8\ \text{kJ·kg}^{-1}\).</p>
    <p><strong>A2.</strong> Pas de travail : \(q_{23}\) \(= h_3 - h_2\) \(\approx 3422 - 198\) \(= 3224\ \text{kJ·kg}^{-1}\).</p>
    <p><strong>B1.</strong> \(x_{4,is}\) \(= \dfrac{s_3 - s_L}{s_V - s_L}\) \(= \dfrac{6{,}880 - 0{,}649}{8{,}149 - 0{,}649}\) \(\approx 0{,}831\) ; \(h_{4,is}\) \(= h_L + x_{4,is}(h_V - h_L)\) \(\approx 191{,}8 + 0{,}831\times2392\) \(\approx 2179\ \text{kJ·kg}^{-1}\).</p>
    <p><strong>B2.</strong> \(h_4\) \(= h_3 - \eta_{is}(h_3 - h_{4,is})\) \(= 3422 - 0{,}85\times1243\) \(\approx 2366\ \text{kJ·kg}^{-1}\) ; \(x_4 = \dfrac{2366 - 191{,}8}{2392} \approx 0{,}91\) ; \(w_{34} = h_4 - h_3 \approx -1056\ \text{kJ·kg}^{-1}\). Entropie : \(s_4\) \(= s_L + x_4(s_V - s_L)\) \(\approx 7{,}46\ \text{kJ·kg}^{-1}\text{·K}^{-1}\), donc \(s_{\text{créée}}\) \(= s_4 - s_3\) \(\approx 0{,}58\ \text{kJ·kg}^{-1}\text{·K}^{-1}\).</p>
    <p><strong>B3.</strong> \(x = \dfrac{5{,}890 - 0{,}649}{7{,}500} \approx 0{,}70\) : 30 % de gouttelettes en fin de détente, qui érodent les aubes et dégradent le rendement de la turbine. La surchauffe repousse la détente vers la zone sèche.</p>
    <p><strong>C1.</strong> \(\eta\) \(= \dfrac{-(w_{34} + w_P)}{q_{23}}\) \(= \dfrac{1056 - 6}{3224}\) \(\approx 0{,}33\). Turbine isentropique : \(\eta = \dfrac{1243 - 6}{3224} \approx 0{,}38\). Le travail de la pompe représente moins de 1 % de celui de la turbine.</p>
    <p><strong>C2.</strong> \(D_m\) \(= \dfrac{300\times10^6}{1050\times10^3}\) \(\approx 286\ \text{kg·s}^{-1}\). Générateur de vapeur : \(D_m q_{23} \approx 921\ \text{MW}\). Condenseur : \(q_{41} = h_1 - h_4 \approx -2174\ \text{kJ·kg}^{-1}\), soit environ 621 MW cédés (on vérifie \(921 = 300 + 621\)).</p>
    <p><strong>C3.</strong> \(D_{eau}\) \(= \dfrac{621\times10^6}{4180\times6}\) \(\approx 2{,}5\times10^4\ \text{kg·s}^{-1}\), environ \(25\ \text{m}^3\text{·s}^{-1}\) : d'où l'implantation des centrales au bord des fleuves ou de la mer.</p>
    <p><strong>D1.</strong> \(\eta_C = 1 - \dfrac{319}{773} \approx 0{,}59\).</p>
    <p><strong>D2.</strong> La pompe est calorifugée et réversible : \(s_2 = s_1 = s_L\). \(\bar T\) \(= \dfrac{3224}{6{,}880 - 0{,}649}\) \(\approx 517\ \text{K}\) (244 °C). Avec une turbine isentropique, la chaleur est cédée à \(T_{sat}\) constante : \(-q_{41} = T_{sat}(s_3 - s_1)\), et \(\eta\) \(= 1 + \dfrac{q_{41}}{q_{23}}\) \(= 1 - \dfrac{T_{sat}}{\bar T}\) \(\approx 1 - \dfrac{319}{517}\) \(\approx 0{,}38\), ce qui retrouve C1. L'eau reçoit l'essentiel de sa chaleur bien en dessous de 500 °C (échauffement du liquide, vaporisation à 276 °C) : c'est la première cause d'écart à Carnot, à laquelle s'ajoutent les irréversibilités de la turbine (de 0,38 à 0,33) et, dans une vraie chaudière, l'écart de température entre les fumées et l'eau.</p>
  </div>
