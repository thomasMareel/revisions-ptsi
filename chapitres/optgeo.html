<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre ouvre la partie 1.1 « Formation des images » du programme de PTSI : les sources de lumière, le modèle de l'optique géométrique et ses limites, les lois de Snell-Descartes, le stigmatisme, le miroir plan, les conditions de Gauss et la fibre optique à saut d'indice. La suite de la partie (lentilles minces, œil, appareil photographique) est traitée dans « Optique géométrique — Lentilles minces, œil et appareil photographique » ; la nature ondulatoire de la lumière (interférences, trous d'Young) dans « Optique ondulatoire ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Sources lumineuses</strong> : caractériser une source lumineuse par son spectre ; relier la longueur d'onde dans le vide et la couleur ; modèle de la source ponctuelle monochromatique (§1).</li>
        <li><strong>Modèle de l'optique géométrique</strong> : définir le modèle (rayon lumineux, indice d'un milieu transparent) ; indiquer ses limites (§2).</li>
        <li><strong>Réflexion, réfraction</strong> : lois de Snell-Descartes (§3) ; établir la condition de réflexion totale (§4).</li>
        <li><strong>Stigmatisme</strong> : objet, image, stigmatisme rigoureux ou approché (§5) ; <strong>miroir plan</strong> : construire l'image d'un objet (§6).</li>
        <li><strong>Conditions de l'approximation de Gauss</strong> : les énoncer ainsi que leurs conséquences ; relier le stigmatisme approché aux caractéristiques d'un détecteur (§7).</li>
        <li><strong>Fibre optique à saut d'indice</strong> : établir les expressions du cône d'acceptance et de la dispersion intermodale (§8).</li>
        <li><strong>Capacités expérimentales</strong> : étudier un spectre à l'aide d'un spectromètre à fibre optique ; utiliser les sources laser et les diodes électroluminescentes de manière adaptée (§1).</li>
      </ul>
      <p>Hors programme (regroupé en fin de chapitre) : le prisme et sa déviation minimale, les milieux d'indice variable (mirages, fibre à gradient d'indice), le principe de Fermat.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · SOURCES LUMINEUSES ET SPECTRES</div>
  <h2>Ce qu'émet une source de lumière</h2>
  <div class="intro">Avant de suivre la lumière, il faut savoir ce qu'émet la source : quelles longueurs d'onde, et dans quelles proportions. C'est son spectre. Il identifie une lampe comme une empreinte digitale, et il détermine la couleur perçue.</div>
  <div class="def-box">
    <strong>Lumière et longueur d'onde dans le vide.</strong> La lumière est une onde électromagnétique ; dans le vide, elle se propage à la célérité \(c = 2{,}998\times10^{8}\ \text{m·s}^{-1}\approx 3{,}00\times10^{8}\ \text{m·s}^{-1}\). Une radiation <strong>monochromatique</strong> est caractérisée par sa fréquence \(\nu\), fixée par la source, ou par sa <strong>longueur d'onde dans le vide</strong> :
    <div class="formula" data-nom="Longueur d'onde dans le vide">$$\lambda_0 = \frac{c}{\nu}$$</div>
  </div>
  <div class="prop-box">
    <strong>Longueur d'onde et couleur.</strong> L'œil humain est sensible aux longueurs d'onde dans le vide comprises entre \(400\ \text{nm}\) environ (violet) et \(750\ \text{nm}\) environ (rouge). En deçà s'étend l'ultraviolet (UV), au-delà l'infrarouge (IR). Les frontières entre couleurs sont floues et varient d'un observateur à l'autre ; ordres de grandeur : violet 400 à 450 nm, bleu 450 à 490 nm, vert 490 à 570 nm, jaune 570 à 590 nm, orange 590 à 620 nm, rouge 620 à 750 nm.
  </div>
  <h3>Le spectre d'une source</h3>
  <div class="def-box">
    <strong>Spectre.</strong> Le spectre d'une source est la répartition de la puissance lumineuse qu'elle émet en fonction de la longueur d'onde \(\lambda_0\). On le mesure avec un <strong>spectromètre</strong> : en TP, un spectromètre à fibre optique (une fibre amène la lumière sur un réseau qui disperse les longueurs d'onde vers une barrette de capteurs) affiche directement l'intensité en fonction de \(\lambda_0\).
  </div>
  <ul>
    <li><strong>Spectre continu</strong> : émis par un corps chaud (solide, liquide ou gaz dense) ; toutes les longueurs d'onde sont présentes. Plus le corps est chaud, plus son maximum d'émission se déplace vers le bleu : vers 500 nm pour le Soleil (surface à 5 800 K environ), dans l'infrarouge (vers 1 µm) pour le filament d'une lampe à incandescence (2 800 K environ), qui chauffe donc plus qu'il n'éclaire.</li>
    <li><strong>Spectre de raies</strong> : émis par un gaz à basse pression excité par une décharge électrique (lampe spectrale) ; seules quelques longueurs d'onde, caractéristiques de l'élément, sont présentes : doublet jaune du sodium (589,0 et 589,6 nm), raies du mercure (436 nm bleue, 546 nm verte, doublet jaune à 577 et 579 nm), raie rouge de l'hydrogène (656 nm).</li>
    <li><strong>Laser</strong> : une seule raie, extrêmement fine (laser hélium-néon : 632,8 nm, largeur relative de l'ordre de \(10^{-6}\)), et un faisceau très peu divergent.</li>
    <li><strong>Diode électroluminescente (LED)</strong> : une bande d'une vingtaine de nanomètres de large ; une LED « blanche » associe une LED bleue et un luminophore jaune, d'où un spectre large.</li>
  </ul>

  <h3>Le modèle de la source ponctuelle monochromatique</h3>
  <p>Pour raisonner, on idéalise la source : <strong>ponctuelle</strong> (sa taille est négligeable devant les distances en jeu : une étoile, un petit trou éclairé, le point de focalisation d'un laser) et <strong>monochromatique</strong> (une seule longueur d'onde). Le laser en est la meilleure réalisation ; une lampe spectrale suivie d'un filtre qui isole une raie en est une autre. La lumière blanche est au contraire <strong>polychromatique</strong> : chaque longueur d'onde suivra son propre chemin dès que l'indice des milieux traversés dépend de \(\lambda_0\) (§2).</p>
  <div class="method-box">
    <strong>Exemple — Reconnaître une source à son spectre</strong>
    <ol>
      <li>Un spectromètre relève deux raies jaunes très proches, à 589,0 et 589,6 nm, et rien d'autre : c'est un spectre de raies, celui d'une lampe à vapeur de sodium (éclairage public orangé d'autrefois).</li>
      <li>Fréquences : \(\nu = c/\lambda_0 = 5{,}090\times10^{14}\ \text{Hz}\) et \(5{,}085\times10^{14}\ \text{Hz}\) ; elles ne diffèrent que de 0,1 %.</li>
      <li>Aux bords du visible, \(\nu = 7{,}5\times10^{14}\ \text{Hz}\) (400 nm) et \(4{,}0\times10^{14}\ \text{Hz}\) (750 nm) : le visible couvre un rapport de fréquences inférieur à 2.</li>
      <li>Largeurs relatives \(\Delta\lambda/\lambda_0\) : 3 % pour une LED rouge (20 nm à 630 nm), \(1{,}6\times10^{-6}\) pour un laser hélium-néon (0,001 nm) : le laser est de très loin la source la plus monochromatique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Sécurité</strong> : ne jamais regarder un faisceau laser, ni sa réflexion sur une surface brillante (montre, verre, paillasse). Même un laser de 1 mW concentre sa puissance sur une tache minuscule de la rétine. En TP, on travaille faisceau à hauteur de table, jamais à hauteur des yeux ; on évite aussi de fixer une LED de forte puissance.</div>
  <div class="notice"><strong>Erreur classique</strong> : juger de la monochromaticité d'une source à son intensité ou à sa couleur franche. Une LED rouge paraît aussi « pure » qu'un laser rouge, mais sa raie est vingt mille fois plus large. C'est la largeur de la raie qui compte.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LE MODÈLE DE L'OPTIQUE GÉOMÉTRIQUE</div>
  <h2>Le rayon lumineux et l'indice</h2>
  <div class="intro">L'optique géométrique remplace l'onde lumineuse par des rayons, des lignes le long desquelles la lumière transporte son énergie. Ce modèle très simple suffit à comprendre miroirs, lentilles, fibres, œil et appareils photographiques, à condition de rester dans son domaine de validité.</div>
  <div class="def-box">
    <strong>Milieu transparent, indice.</strong> Un milieu est <strong>transparent</strong> s'il laisse passer la lumière sans l'absorber notablement, <strong>homogène</strong> si ses propriétés sont les mêmes en tout point, <strong>isotrope</strong> si elles sont les mêmes dans toutes les directions. La lumière s'y propage à une vitesse \(v\) inférieure à \(c\) ; son <strong>indice</strong> (de réfraction) est le nombre sans dimension
    <div class="formula" data-nom="Indice d'un milieu">$$n = \frac{c}{v}\ \geq 1$$</div>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Milieu (raie jaune, 589 nm)</th><th style="text-align:left">Indice \(n\)</th><th style="text-align:left">Vitesse \(v = c/n\)</th></tr>
    <tr><td>vide</td><td>1 (exactement)</td><td>\(3{,}00\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>air (conditions usuelles)</td><td>1,000 3</td><td>\(3{,}00\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>eau</td><td>1,333</td><td>\(2{,}25\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>plexiglas</td><td>1,49</td><td>\(2{,}01\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>verre crown (verre courant)</td><td>1,52</td><td>\(1{,}97\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>verre flint (au plomb)</td><td>1,62</td><td>\(1{,}85\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>diamant</td><td>2,42</td><td>\(1{,}24\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
  </table></div>
  <p>Un milieu d'indice plus grand est dit plus <strong>réfringent</strong>. L'indice de l'air diffère si peu de 1 qu'on l'assimile au vide dans tous les calculs de ce chapitre.</p>
  <div class="prop-box">
    <strong>Le modèle de l'optique géométrique.</strong> La lumière se propage le long de <strong>rayons lumineux</strong>, qui obéissent à quatre principes :
    <ol>
      <li>dans un milieu transparent, homogène et isotrope, les rayons sont des <strong>droites</strong> (propagation rectiligne) ;</li>
      <li>les rayons sont <strong>indépendants</strong> : deux faisceaux qui se croisent ne se perturbent pas ;</li>
      <li><strong>retour inverse</strong> : le trajet suivi de A vers B est aussi celui que suivrait la lumière de B vers A ;</li>
      <li>à la surface entre deux milieux, les directions des rayons réfléchi et réfracté sont données par les lois de Snell-Descartes (§3).</li>
    </ol>
  </div>
  <h3>Dispersion</h3>
  <p>L'indice d'un milieu transparent dépend de la longueur d'onde : on dit que le milieu est <strong>dispersif</strong>. Pour un verre crown courant, \(n = 1{,}522\) à 486 nm (bleu), \(1{,}517\) à 589 nm (jaune) et \(1{,}514\) à 656 nm (rouge) : l'indice décroît du bleu au rouge, si bien que le bleu est plus dévié que le rouge par une réfraction. C'est l'origine de l'arc-en-ciel, de la décomposition de la lumière blanche par un prisme et des irisations colorées au bord des images données par une lentille simple (aberration chromatique, §7). Dans un milieu d'indice \(n\), la fréquence ne change pas (donc la couleur non plus) mais la longueur d'onde devient \(\lambda = \lambda_0/n\).</p>
  <h3>Les limites du modèle</h3>
  <p>Le rayon lumineux est une idéalisation : on ne peut pas l'isoler. Si l'on fait passer la lumière par une ouverture (ou autour d'un obstacle) de taille \(a\), le faisceau émergent s'étale sur un angle de l'ordre de</p>
  <div class="formula" data-nom="Ouverture angulaire de diffraction">$$\theta \approx \frac{\lambda_0}{a}$$</div>
  <p>C'est la <strong>diffraction</strong>, manifestation de la nature ondulatoire de la lumière. L'optique géométrique n'est valable que si toutes les ouvertures et tous les obstacles sont <strong>très grands devant la longueur d'onde</strong>. Elle ignore aussi les interférences (deux faisceaux qui se superposent peuvent donner de l'obscurité : chapitre « Optique ondulatoire ») et la polarisation.</p>
  <div class="method-box">
    <strong>Exemple — Quand la diffraction compte-t-elle ?</strong>
    <ol>
      <li>Un laser hélium-néon (\(\lambda_0 = 633\ \text{nm}\)) traverse une fente de largeur \(a = 0{,}10\ \text{mm}\) : \(\theta \approx 633\times10^{-9}/10^{-4} = 6{,}3\times10^{-3}\ \text{rad}\). Sur un écran à \(D = 2{,}0\ \text{m}\), la tache s'étend sur environ \(2\theta D = 2{,}5\ \text{cm}\), 250 fois la largeur de la fente : le modèle du rayon est mis en défaut.</li>
      <li>Le même faisceau traverse un trou de 5 mm : \(\theta \approx 1{,}3\times10^{-4}\ \text{rad}\), soit un élargissement de 0,25 mm à 2 m, négligeable devant le diamètre du faisceau : l'optique géométrique s'applique.</li>
      <li>La pupille de l'œil (3 mm) diffracte la lumière verte (550 nm) sur \(\theta \approx 2\times10^{-4}\ \text{rad}\) : c'est l'ordre de grandeur de la plus petite séparation angulaire que l'œil distingue (chapitre suivant). La diffraction fixe la finesse de la vision.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'on obtient un rayon lumineux de plus en plus fin en fermant un diaphragme. En dessous du millimètre, le faisceau s'élargit au contraire, et d'autant plus que le trou est petit.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LES LOIS DE SNELL-DESCARTES</div>
  <h2>Réflexion et réfraction sur un dioptre</h2>
  <div class="intro">Lorsqu'un rayon atteint la surface qui sépare deux milieux transparents, il se partage en un rayon réfléchi et un rayon réfracté. Deux lois, établies au XVIIᵉ siècle, en donnent les directions ; tout le reste du chapitre en découle.</div>
  <div class="def-box">
    <strong>Dioptre, plan d'incidence.</strong> Un <strong>dioptre</strong> est la surface de séparation entre deux milieux transparents d'indices \(n_1\) (milieu d'où vient la lumière) et \(n_2\). En un point d'incidence \(I\), la <strong>normale</strong> est la perpendiculaire au dioptre ; le <strong>plan d'incidence</strong> contient le rayon incident et la normale. Les angles d'incidence \(i_1\), de réflexion \(i_1'\) et de réfraction \(i_2\) sont mesurés <strong>à partir de la normale</strong>, entre 0 et 90°.
  </div>
  <div class="prop-box">
    <strong>Lois de Snell-Descartes.</strong>
    <ol>
      <li>Les rayons réfléchi et réfracté sont dans le plan d'incidence, de l'autre côté de la normale par rapport au rayon incident.</li>
      <li>Réflexion : \(i_1' = i_1\).</li>
      <li>Réfraction :</li>
    </ol>
    <div class="formula" data-nom="Loi de la réfraction (Snell-Descartes)">$$n_1\sin i_1 = n_2\sin i_2$$</div>
  </div>

  <h3>Vers un milieu plus ou moins réfringent</h3>
  <ul>
    <li>Si \(n_2 > n_1\) (de l'air vers le verre), \(\sin i_2 = \frac{n_1}{n_2}\sin i_1 \lt \sin i_1\) : le rayon réfracté <strong>se rapproche de la normale</strong>. Il existe pour toute incidence, mais son angle ne dépasse pas l'<strong>angle de réfraction limite</strong> \(i_\ell\), atteint en incidence rasante (\(i_1 = 90°\)) : \(\sin i_\ell = n_1/n_2\). Tous les rayons réfractés tiennent dans un cône de demi-angle \(i_\ell\).</li>
    <li>Si \(n_2 \lt n_1\) (du verre vers l'air), le rayon réfracté <strong>s'écarte de la normale</strong> ; il n'existe pas toujours (§4).</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — Un rayon traverse une vitre</strong>
    <ol>
      <li>Un rayon arrive de l'air sur une vitre (\(n = 1{,}52\)) sous \(i_1 = 60°\). Il se réfléchit en partie sous 60°, et se réfracte : \(\sin i_2 = \sin 60°/1{,}52 = 0{,}570\), d'où \(i_2 = 34{,}7°\).</li>
      <li>Il atteint la seconde face, parallèle à la première, sous l'incidence \(34{,}7°\) ; il ressort dans l'air sous l'angle \(i_3\) tel que \(1{,}52\sin 34{,}7° = \sin i_3\), soit \(i_3 = 60°\) : le rayon émergent est <strong>parallèle</strong> au rayon incident. Le produit \(n\sin i\) se conserve d'un dioptre plan parallèle à l'autre.</li>
      <li>Il est seulement décalé latéralement, de \(d = e\,\dfrac{\sin(i_1 - i_2)}{\cos i_2}\) pour une vitre d'épaisseur \(e\) (le trajet dans le verre mesure \(e/\cos i_2\) et fait l'angle \(i_1 - i_2\) avec le rayon incident prolongé) : \(d = 4{,}0\ \text{mm}\times\sin 25{,}3°/\cos 34{,}7° = 2{,}1\ \text{mm}\) pour \(e = 4{,}0\ \text{mm}\). C'est pourquoi une vitre ne déforme pas le paysage.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : mesurer les angles à partir de la surface au lieu de la normale, ou calculer avec une calculatrice réglée en radians. Contrôle rapide : vers un milieu plus réfringent, l'angle doit diminuer.</div>

<div class="course-section">
  <div class="sec-num">§4 · LA RÉFLEXION TOTALE</div>
  <h2>Quand la lumière ne peut plus sortir</h2>
  <div class="intro">Du verre vers l'air, le rayon réfracté s'écarte de la normale ; au-delà d'une certaine incidence, il n'existe plus et toute la lumière est réfléchie. Ce phénomène, la réflexion totale, guide la lumière dans les fibres optiques et remplace les miroirs dans les jumelles.</div>
  <div class="prop-box">
    <strong>Condition de réflexion totale.</strong> Lorsque la lumière passe d'un milieu d'indice \(n_1\) à un milieu <strong>moins réfringent</strong> d'indice \(n_2 \lt n_1\), il y a réflexion totale si et seulement si l'angle d'incidence dépasse l'<strong>angle limite</strong> \(i_\ell\) :
    <div class="formula" data-nom="Angle limite de réflexion totale">$$i_1 > i_\ell\qquad\text{avec}\qquad \sin i_\ell = \frac{n_2}{n_1}$$</div>
  </div>
  <p><strong>Établissons-la.</strong> La loi de la réfraction impose \(\sin i_2 = \dfrac{n_1}{n_2}\sin i_1\). Comme \(n_1/n_2 > 1\), le second membre dépasse 1 dès que \(\sin i_1 > n_2/n_1\) : aucun angle \(i_2\) ne convient, il n'y a pas de rayon réfracté. À la limite \(\sin i_1 = n_2/n_1\), le rayon réfracté sort en rasant le dioptre (\(i_2 = 90°\)). Au-delà, toute l'énergie lumineuse repart dans le rayon réfléchi : la réflexion est <strong>totale</strong>, alors qu'en dessous de \(i_\ell\) elle n'est que partielle (de l'ordre de 4 % de la puissance pour une face de verre en incidence normale). Si \(n_2 > n_1\), le second membre ne dépasse jamais 1 : pas de réflexion totale. Par retour inverse, l'angle limite est aussi l'angle de réfraction limite du §3 pour la lumière allant dans l'autre sens.</p>

<figcaption>Source ponctuelle S au fond d'un bassin (tracé exact). Les rayons qui arrivent sur la surface sous une incidence inférieure à l'angle limite \(i_\ell = 48{,}8°\) sortent dans l'air (en rouge) ; les autres subissent la réflexion totale et restent dans l'eau (en bleu). Vue de dessus, la lumière ne sort que par un disque de rayon \(R = h\tan i_\ell\) (trait épais) ; les rayons qui sortent près de son bord partent presque en rasant la surface. On a omis les rayons réfléchis partiellement.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — Une lampe au fond d'une piscine</strong>
    <ol>
      <li>Une lampe ponctuelle est fixée au fond d'une piscine, à \(h = 1{,}50\ \text{m}\) sous la surface (eau : \(n = 1{,}33\)). Angle limite : \(\sin i_\ell = 1/1{,}33\), \(i_\ell = 48{,}8°\).</li>
      <li>Seuls les rayons qui atteignent la surface à moins de \(R = h\tan i_\ell = 1{,}50\times1{,}14 = 1{,}71\ \text{m}\) de la verticale de la lampe sortent : vue d'en haut, la surface n'est éclairée que dans un disque de 3,4 m de diamètre.</li>
      <li>Par retour inverse, un nageur sous l'eau voit tout le ciel et les berges dans un cône de demi-angle 48,8° au-dessus de lui ; au-delà, la surface lui renvoie comme un miroir l'image du fond de la piscine.</li>
    </ol>
  </div>
  <h3>Applications</h3>
  <ul>
    <li><strong>Prismes à réflexion totale</strong> (jumelles, périscopes, appareils reflex) : dans un prisme de verre dont la section est un triangle rectangle isocèle, un rayon entré perpendiculairement à une petite face frappe la grande face sous 45°, plus que l'angle limite verre/air (41,1°) : il est réfléchi intégralement, sans les pertes d'un miroir métallique. Il faut pour cela \(\sin 45° > 1/n\), soit \(n > \sqrt2 \approx 1{,}41\).</li>
    <li><strong>Fibres optiques</strong> : la lumière reste piégée dans le cœur par réflexions totales successives (§8).</li>
    <li><strong>Éclat du diamant</strong> : son angle limite très petit (24,4°) piège la lumière, qui ne ressort que par certaines facettes.</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : chercher une réflexion totale en allant de l'air vers l'eau, ou parler de milieu « plus dense ». Ce qui compte est l'indice : la réflexion totale n'existe qu'en allant vers un milieu <em>moins réfringent</em>, au-delà de l'angle limite.</div>

<div class="course-section">
  <div class="sec-num">§5 · OBJETS, IMAGES ET STIGMATISME</div>
  <h2>Former l'image d'un point</h2>
  <div class="intro">Un système optique (miroir, lentille, œil, objectif) n'est utile que s'il donne d'un point une image ponctuelle : sinon tout est flou. Cette exigence s'appelle le stigmatisme ; elle n'est presque jamais satisfaite exactement, et ce paragraphe dit ce qu'on peut en attendre.</div>
  <div class="def-box">
    <strong>Système optique, objet, image.</strong> Un <strong>système optique</strong> est une succession de milieux transparents séparés par des dioptres, éventuellement des miroirs. Il est <strong>centré</strong> s'il admet un axe de symétrie de révolution, l'<strong>axe optique</strong>.
    <ul>
      <li>Un <strong>objet ponctuel</strong> A est le point d'intersection des rayons qui entrent dans le système. Il est <strong>réel</strong> si ces rayons en sont effectivement issus (avant la face d'entrée), <strong>virtuel</strong> s'ils convergent vers lui sans l'atteindre (il est alors situé après la face d'entrée : un autre système, placé avant, faisait converger la lumière).</li>
      <li>Une <strong>image ponctuelle</strong> A′ est le point d'intersection des rayons qui sortent du système. Elle est <strong>réelle</strong> si ces rayons y passent effectivement (on la recueille sur un écran), <strong>virtuelle</strong> si seuls leurs prolongements s'y coupent (elle est visible à l'œil, pas sur un écran).</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Stigmatisme, aplanétisme.</strong> Un système est <strong>rigoureusement stigmatique</strong> pour le point A si <em>tous</em> les rayons issus de A ressortent en passant par un même point A′ (ou en semblant en venir) : A et A′ sont alors <strong>conjugués</strong>. Il est <strong>approximativement stigmatique</strong> si les rayons émergents passent tous très près de A′ et forment une petite tache. Il est <strong>aplanétique</strong> si, de plus, l'image d'un petit objet plan perpendiculaire à l'axe (dans un <strong>plan de front</strong>) est elle-même dans un plan de front.
  </div>

  <p>Le dioptre plan, la plus simple des surfaces, <strong>n'est pas stigmatique</strong> : un rayon issu d'un point A situé à la profondeur \(h\) sous l'eau, incliné de \(i_1\) sur la verticale, ressort sous \(i_2\) et son prolongement recoupe la verticale de A à la profondeur \(h' = h\tan i_1/\tan i_2\), qui dépend du rayon choisi. En revanche, pour des rayons presque perpendiculaires au dioptre, tous ces points se confondent.</p>
  <div class="prop-box">
    <strong>Dioptre plan dans les conditions de Gauss.</strong> Pour des rayons proches de la normale, le dioptre plan est approximativement stigmatique : l'image A′ d'un point A est sur la normale \(HA\) au dioptre, avec (\(n_1\) : milieu de l'objet, \(n_2\) : milieu d'observation)
    <div class="formula" data-nom="Dioptre plan (Gauss)">$$\overline{HA'} = \frac{n_2}{n_1}\,\overline{HA}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi le rapport des indices ?</span>
    <div class="content">
      <p>Un rayon issu de A frappe le dioptre en I, à la distance \(HI\) de H. Dans le triangle AHI, \(HI = HA\tan i_1\) ; le rayon réfracté, prolongé, coupe la normale en A′ avec \(HI = HA'\tan i_2\). Donc \(HA' = HA\,\tan i_1/\tan i_2\). Pour de petits angles, \(\tan i \approx \sin i \approx i\) et la loi de la réfraction donne \(i_1/i_2 \approx n_2/n_1\) : \(HA' \approx \frac{n_2}{n_1}HA\), indépendamment du rayon. A et A′ sont du même côté du dioptre, d'où l'égalité entre mesures algébriques.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — La profondeur apparente d'une piscine</strong>
    <ol>
      <li>Une pièce repose au fond d'une piscine de \(h = 2{,}00\ \text{m}\) (\(n_1 = 1{,}33\), observateur dans l'air : \(n_2 = 1\)). Vue d'au-dessus, à la verticale : \(h' = h/1{,}33 = 1{,}50\ \text{m}\). La piscine paraît moins profonde d'un quart.</li>
      <li>Vue de biais, sous 45° dans l'air : \(\sin i_1 = \sin 45°/1{,}33\), \(i_1 = 32{,}1°\), et \(h' = 2{,}00\times\tan 32{,}1°/\tan 45° = 1{,}26\ \text{m}\). La position de l'image dépend de la direction d'observation : pas de stigmatisme rigoureux.</li>
      <li>L'œil voit pourtant une image nette : il ne reçoit qu'un mince pinceau de rayons, tous presque parallèles, pour lequel le stigmatisme approché suffit.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une image virtuelle « n'existe pas ». Elle est parfaitement visible (dans un miroir, à travers une loupe) ; elle ne peut simplement pas être recueillie sur un écran. De même, un objet virtuel n'est pas un objet caché : c'est le point vers lequel convergeaient des rayons interceptés en chemin.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LE MIROIR PLAN</div>
  <h2>Un système rigoureusement stigmatique</h2>
  <div class="intro">Le miroir plan est le système optique le plus simple, et le seul usuel qui soit rigoureusement stigmatique pour tous les points de l'espace. Il sert à replier un trajet lumineux, à mesurer de petites rotations, et il fait comprendre ce qu'est une image virtuelle.</div>
  <div class="prop-box">
    <strong>Image par un miroir plan.</strong> L'image A′ d'un point A par un miroir plan est le <strong>symétrique de A</strong> par rapport au plan du miroir. Le miroir plan est rigoureusement stigmatique et aplanétique pour tout point. L'image d'un objet réel est virtuelle (derrière le miroir), celle d'un objet virtuel est réelle. L'image a la même taille que l'objet et la même orientation (elle est droite), mais elle est <strong>inversée en profondeur</strong> : l'image d'une main droite est une main gauche.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tous les rayons réfléchis semblent venir du symétrique de A</span>
    <div class="content">
      <p>Soit H le pied de la perpendiculaire au miroir issue de A, et A′ le symétrique de A. Un rayon issu de A se réfléchit en un point I quelconque du miroir. La réflexion conserve l'angle avec la normale en I : le rayon réfléchi fait avec le miroir le même angle que le rayon incident, de l'autre côté de la normale. Les triangles AHI et A′HI sont symétriques l'un de l'autre, donc la droite A′I fait avec le miroir ce même angle : le rayon réfléchi est porté par la droite A′I. Ceci vaut pour tout point I : tous les rayons réfléchis semblent venir de A′.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — Construire l'image et les rayons vus par l'œil</strong>
    <ol>
      <li>Tracer les symétriques A′ et B′ des extrémités de l'objet par rapport au miroir : l'image est A′B′, de même taille.</li>
      <li>Joindre l'œil à B′ : la droite coupe le miroir en I. Tracer en trait plein B → I puis I → œil, et en tirets le prolongement I → B′ (rayon virtuel).</li>
      <li>L'œil voit B dans le miroir si et seulement si I est sur le miroir : c'est ainsi qu'on détermine le champ de vision. Une personne à 1,20 m d'un miroir voit son image à 2,40 m d'elle : c'est à cette distance que son œil fait la mise au point.</li>
    </ol>
  </div>
  <h3>Rotation d'un miroir</h3>
  <p>Si le miroir tourne d'un angle \(\alpha\) autour d'un axe de son plan, la normale tourne de \(\alpha\) ; l'angle d'incidence varie de \(\alpha\), l'angle de réflexion aussi, et le rayon réfléchi tourne de \(2\alpha\) (le rayon incident restant fixe). Une rotation de 1,0° déplace ainsi la tache réfléchie sur un mur situé à 2,00 m de \(2{,}00\times\tan 2{,}0° = 7{,}0\ \text{cm}\) : on amplifie et on mesure de très petites rotations (galvanomètres à miroir, réglage par autocollimation).</p>
  <div class="notice"><strong>Erreur classique</strong> : placer l'image sur la surface du miroir. Elle est derrière, à la même distance du miroir que l'objet ; pour la voir nette, l'œil accommode sur la distance œil-image, double de la distance œil-miroir quand on se regarde.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · LES CONDITIONS DE L'APPROXIMATION DE GAUSS</div>
  <h2>Stigmatisme approché et qualité d'une image</h2>
  <div class="intro">Hormis le miroir plan, aucun système simple n'est rigoureusement stigmatique. Heureusement, si l'on n'utilise que des rayons voisins de l'axe et peu inclinés, la plupart le deviennent presque : ce sont les conditions de Gauss, cadre de toute l'étude des lentilles du chapitre suivant.</div>
  <div class="def-box">
    <strong>Conditions de Gauss.</strong> Un système centré est utilisé dans les conditions de Gauss lorsque les rayons qui le traversent sont <strong>paraxiaux</strong> :
    <ol>
      <li>ils sont <strong>peu inclinés</strong> sur l'axe optique (une dizaine de degrés au plus) ;</li>
      <li>ils rencontrent les dioptres et les miroirs <strong>au voisinage de l'axe</strong>.</li>
    </ol>
    En pratique : on limite l'ouverture du faisceau par un <strong>diaphragme</strong>, et l'on observe des objets petits, proches de l'axe, vus sous un petit angle.
  </div>
  <div class="prop-box">
    <strong>Conséquences.</strong>
    <ol>
      <li>Tous les angles sont petits : \(\sin\theta \approx \tan\theta \approx \theta\) (en radians) et \(\cos\theta \approx 1\). La loi de la réfraction devient linéaire : \(n_1 i_1 = n_2 i_2\).</li>
      <li>Le système est approximativement <strong>stigmatique</strong> et <strong>aplanétique</strong> : l'image d'un point est une petite tache, et un plan de front a pour image un plan de front.</li>
      <li>Les positions de l'objet et de l'image sont liées par des <strong>relations de conjugaison</strong> simples, et les constructions par rayons deviennent exactes (lentilles minces : chapitre suivant).</li>
    </ol>
  </div>

  <h3>Les aberrations</h3>
  <p>Hors des conditions de Gauss, les rayons issus d'un point ne convergent plus en un même point : ce sont les <strong>aberrations géométriques</strong>. La plus simple, l'<strong>aberration sphérique</strong>, est visible sur la figure : les rayons qui traversent le bord d'une lentille convergent plus près d'elle que les rayons centraux. S'y ajoutent les <strong>aberrations chromatiques</strong> : l'indice dépendant de \(\lambda_0\) (§2), une lentille simple n'a pas le même foyer pour le bleu et pour le rouge, d'où des liserés colorés. Les objectifs photographiques associent de nombreuses lentilles pour les corriger.</p>
  <h3>Stigmatisme approché et détecteur</h3>
  <p>Une image n'est jamais parfaitement ponctuelle : l'image d'un point est une petite tache. Elle paraît nette si le <strong>détecteur</strong> ne peut pas la distinguer d'un point, c'est-à-dire si la tache est plus petite que l'élément sensible du détecteur :</p>
  <ul>
    <li>pixel d'un capteur photographique : de 1 µm environ (téléphone) à 6 µm environ (appareil reflex) ;</li>
    <li>cellule de la rétine (cône de la fovéa) : quelques micromètres ;</li>
    <li>grain d'une pellicule argentique : une dizaine de micromètres.</li>
  </ul>
  <p>Le degré de stigmatisme exigé dépend donc du détecteur : une image nette pour un ancien capteur à gros pixels peut être floue pour un capteur moderne.</p>
  <div class="method-box">
    <strong>Exemple — Faut-il diaphragmer ?</strong>
    <ol>
      <li>La lentille plan-convexe de la figure (distance focale 100 mm) reçoit un faisceau parallèle limité par un diaphragme de diamètre \(D\). Le tracé exact donne la plus petite tache possible : 0,23 mm pour \(D = 20\ \text{mm}\), 29 µm pour \(D = 10\ \text{mm}\), 15 µm pour \(D = 8\ \text{mm}\).</li>
      <li>Avec des pixels de 5 µm, la tache couvre 47 pixels de diamètre à \(D = 20\ \text{mm}\) : l'image est floue. En fermant à 8 mm, on descend à 3 pixels, au prix d'une lumière divisée par \((20/8)^2 \approx 6\).</li>
      <li>Fermer davantage ne sert plus à rien : la diffraction par le diaphragme étale la tache sur un diamètre de l'ordre de \(2\lambda_0 f'/D\) (§2), soit 14 µm à \(D = 8\ \text{mm}\) et 28 µm à \(D = 4\ \text{mm}\) (\(\lambda_0 = 550\ \text{nm}\), \(f' = 100\ \text{mm}\)). Le meilleur compromis est vers \(D = 8\ \text{mm}\) : c'est une limite du modèle de l'optique géométrique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre les conditions de Gauss pour une propriété du système. Ce sont des conditions d'utilisation : la même lentille donne une image nette, diaphragmée et éclairée près de l'axe, et une image floue à pleine ouverture ou pour un objet vu sous un grand angle.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · LA FIBRE OPTIQUE À SAUT D'INDICE</div>
  <h2>Guider la lumière par réflexion totale</h2>
  <div class="intro">Une fibre optique transporte la lumière sur des kilomètres, en épousant les courbures du câble : c'est le support de presque tout le trafic d'Internet à longue distance, mais aussi des endoscopes médicaux et des spectromètres de TP. Son principe tient en deux résultats, à savoir établir.</div>
  <div class="def-box">
    <strong>Fibre à saut d'indice.</strong> Un <strong>cœur</strong> cylindrique d'indice \(n_1\) (diamètre de quelques micromètres à 50 µm, voire plus) est entouré d'une <strong>gaine</strong> d'indice \(n_2\) légèrement plus faible (diamètre usuel 125 µm), le tout protégé par un revêtement. L'indice est uniforme dans chaque partie et « saute » à l'interface cœur-gaine. Écart relatif usuel : \((n_1 - n_2)/n_1 \approx 1\ \%\). La lumière est guidée dans le cœur par <strong>réflexions totales</strong> successives sur la gaine.
  </div>

  <h3>Le cône d'acceptance</h3>
  <p>Un rayon entre dans la fibre depuis l'air (indice \(n_0\)) par la face d'entrée, plane et perpendiculaire à l'axe, en un point du cœur, sous l'angle \(\theta\) avec l'axe. Cherchons à quelle condition il est guidé.</p>
  <ol>
    <li>Réfraction à l'entrée : \(n_0\sin\theta = n_1\sin r\), où \(r\) est l'inclinaison du rayon sur l'axe dans le cœur.</li>
    <li>L'interface cœur-gaine étant parallèle à l'axe, le rayon la frappe sous l'incidence \(i = 90° - r\).</li>
    <li>Il y a réflexion totale si \(i > i_\ell\) avec \(\sin i_\ell = n_2/n_1\), soit \(\cos r > n_2/n_1\), c'est-à-dire \(\sin r \lt \sqrt{1 - n_2^2/n_1^2}\).</li>
    <li>D'où \(n_0\sin\theta = n_1\sin r \lt \sqrt{n_1^2 - n_2^2}\). Comme l'incidence est la même à chaque rebond, un rayon qui satisfait cette condition est guidé sur toute la longueur de la fibre (droite).</li>
  </ol>
  <div class="prop-box">
    <strong>Cône d'acceptance.</strong> Un rayon est guidé s'il entre dans la fibre à l'intérieur d'un cône de demi-angle \(\theta_a\) autour de l'axe, avec
    <div class="formula" data-nom="Ouverture numérique d'une fibre">$$\text{ON} = n_0\sin\theta_a = \sqrt{n_1^2 - n_2^2}$$</div>
    La grandeur ON est l'<strong>ouverture numérique</strong> de la fibre.
  </div>
  <h3>La dispersion intermodale</h3>
  <p>Tous les rayons guidés n'ont pas le même trajet : un rayon incliné zigzague, et parcourt une distance plus longue que le rayon axial. Pour une fibre droite de longueur \(L\) :</p>
  <ol>
    <li>le rayon axial (\(r = 0\)) parcourt \(L\) à la vitesse \(c/n_1\) : durée \(t_{\min} = n_1L/c\) ;</li>
    <li>le rayon guidé le plus incliné frappe la gaine sous \(i_\ell\), donc avec \(\cos r = \sin i_\ell = n_2/n_1\) ; il parcourt \(L/\cos r = n_1L/n_2\) : durée \(t_{\max} = n_1^2L/(n_2c)\) ;</li>
    <li>l'écart entre les deux est la <strong>dispersion intermodale</strong>.</li>
  </ol>
  <div class="prop-box">
    <strong>Dispersion intermodale.</strong> Une impulsion lumineuse très brève injectée dans la fibre en ressort étalée sur la durée
    <div class="formula" data-nom="Dispersion intermodale">$$\delta t = t_{\max} - t_{\min} = \frac{n_1L}{c}\,\frac{n_1 - n_2}{n_2} \approx \frac{L\,(n_1 - n_2)}{c}$$</div>
    Deux impulsions successives doivent être séparées d'au moins \(\delta t\) pour rester distinctes : le débit d'information est limité à environ \(1/\delta t\) bits par seconde.
  </div>
  <div class="method-box">
    <strong>Exemple — Une fibre multimode de télécommunication</strong>
    <ol>
      <li>Cœur \(n_1 = 1{,}500\), gaine \(n_2 = 1{,}485\), entrée dans l'air : \(\text{ON} = \sqrt{1{,}500^2 - 1{,}485^2} = 0{,}212\), d'où \(\theta_a = 12{,}2°\). Pour injecter la lumière, on la focalise sur la face d'entrée avec une lentille dont le faisceau a un demi-angle inférieur à 12°.</li>
      <li>Sur \(L = 1{,}00\ \text{km}\) : \(\delta t = \dfrac{1{,}500\times1{,}00\times10^{3}}{3{,}00\times10^{8}}\times\dfrac{0{,}015}{1{,}485} = 51\ \text{ns}\), pour une durée de trajet de 5,0 µs.</li>
      <li>Débit maximal : \(1/\delta t \approx 20\ \text{Mbit/s}\) sur 1 km, seulement 2 Mbit/s sur 10 km (\(\delta t\) est proportionnel à \(L\)). Pour les longues distances, on emploie des fibres <strong>monomodes</strong> (cœur de 9 µm environ), où un seul mode se propage et la dispersion intermodale disparaît.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre les angles. \(\theta_a\) est mesuré dans l'air, par rapport à l'<em>axe</em> de la fibre ; \(i_\ell\) est mesuré dans le cœur, par rapport à la <em>normale</em> à l'interface. Autre confusion : la dispersion intermodale ne vient pas de la dispersion du verre (indice dépendant de \(\lambda_0\)) ; elle existe même en lumière parfaitement monochromatique, parce que les trajets ont des longueurs différentes.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Prisme, milieux d'indice variable, principe de Fermat</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI ; ils éclairent des expériences de TP et préparent la 2ᵉ année.</div>
  <h3>Le prisme</h3>
  <p>Un prisme d'angle au sommet \(A\) dévie un rayon de l'angle \(D = i_1 + i_2 - A\), avec \(r_1 + r_2 = A\) (notations : \(i_1, r_1\) à l'entrée, \(r_2, i_2\) à la sortie). La déviation passe par un minimum \(D_m\) pour une marche symétrique (\(i_1 = i_2\), \(r_1 = r_2 = A/2\)), d'où
    \(n = \dfrac{\sin\big((A + D_m)/2\big)}{\sin(A/2)}\). Mesurer \(D_m\) au goniomètre donne l'indice : \(A = 60{,}0°\) et \(D_m = 38{,}6°\) donnent \(n = 1{,}516\). Le prisme étant dispersif, chaque longueur d'onde a sa déviation : il décompose la lumière blanche, le violet étant le plus dévié.</p>
  <h3>Milieux d'indice variable</h3>
  <p>Dans un milieu dont l'indice varie continûment, les rayons ne sont plus des droites : ils s'incurvent vers les régions d'indice plus élevé. Au-dessus d'une route surchauffée, l'air chaud, moins réfringent, recourbe vers le haut les rayons venus du ciel : c'est le <strong>mirage</strong>, image du ciel qui ressemble à une flaque. Dans une <strong>fibre à gradient d'indice</strong>, l'indice décroît du centre vers le bord ; les rayons y oscillent autour de l'axe, et ceux qui s'en écartent vont plus vite dans les zones de faible indice, ce qui compense leur détour : la dispersion intermodale est divisée par un facteur de l'ordre de 100.</p>
  <h3>Le principe de Fermat</h3>
  <p>On définit le <strong>chemin optique</strong> d'un trajet comme la somme des produits \(n\,\ell\) (indice × longueur) le long de ce trajet : c'est la distance que la lumière parcourrait dans le vide pendant la même durée. Le principe de Fermat affirme que la lumière suit, entre deux points, un trajet dont le chemin optique est stationnaire (le plus souvent minimal) ; les lois de Snell-Descartes s'en déduisent. Le chemin optique est l'outil central des interférences (« Optique ondulatoire » ; 2ᵉ année).</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · OPTIQUE — LES BASES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire du début de la partie 1.1 du programme : relier longueur d'onde, couleur et indice, juger si l'optique géométrique s'applique, appliquer les lois de Snell-Descartes, reconnaître une réflexion totale, construire une image par un miroir plan, raisonner sur le stigmatisme et les conditions de Gauss, et établir les deux résultats de la fibre à saut d'indice.</div>

  <div class="method-box"><strong>Méthode 1 — Relier longueur d'onde, fréquence, couleur et indice</strong>
    <ol>
      <li><span class="step">Repérer la radiation par sa longueur d'onde dans le vide</span> \(\lambda_0\) : c'est elle qui fixe la couleur (visible de 400 à 750 nm environ).</li>
      <li><span class="step">Calculer la fréquence</span> \(\nu = c/\lambda_0\), qui ne change pas d'un milieu à l'autre.</li>
      <li><span class="step">Dans un milieu d'indice \(n\)</span> : vitesse \(v = c/n\), longueur d'onde \(\lambda = \lambda_0/n\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un pointeur laser vert (\(\lambda_0 = 532\ \text{nm}\)) : \(\nu = 3{,}00\times10^{8}/532\times10^{-9} = 5{,}64\times10^{14}\ \text{Hz}\). Dans l'eau, \(\lambda = 532/1{,}333 = 399\ \text{nm}\), mais le faisceau reste vert : la couleur suit la fréquence.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Vérifier que l'optique géométrique s'applique</strong>
    <ol>
      <li><span class="step">Repérer la plus petite ouverture</span> (ou le plus petit obstacle) de taille \(a\) sur le trajet de la lumière.</li>
      <li><span class="step">Estimer l'étalement par diffraction</span> : \(\theta \approx \lambda_0/a\), soit une tache de largeur \(\approx 2\theta D\) à la distance \(D\).</li>
      <li><span class="step">Comparer</span> à la taille du faisceau ou des détails étudiés : si l'étalement est négligeable, le modèle du rayon convient ; sinon, il faut l'optique ondulatoire.</li>
    </ol>
    <p><em>Exemple éclair :</em> laser rouge (650 nm) à travers une fente de 0,50 mm, écran à 3,0 m : \(\theta \approx 1{,}3\times10^{-3}\ \text{rad}\), tache d'environ 7,8 mm, seize fois la largeur de la fente : l'optique géométrique ne décrit pas cette expérience.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Calculer un angle de réfraction</strong>
    <ol>
      <li><span class="step">Mesurer les angles à partir de la normale</span> au dioptre, pas à partir de la surface.</li>
      <li><span class="step">Identifier</span> le milieu d'incidence (\(n_1\)) et le milieu de réfraction (\(n_2\)).</li>
      <li><span class="step">Appliquer</span> \(n_1\sin i_1 = n_2\sin i_2\) et résoudre ; si \(\frac{n_1}{n_2}\sin i_1 > 1\), il n'y a pas de rayon réfracté (méthode 4).</li>
      <li><span class="step">Contrôler</span> : vers un milieu plus réfringent, le rayon se rapproche de la normale (\(i_2 \lt i_1\)) ; sinon il s'en écarte.</li>
    </ol>
    <p><em>Exemple éclair :</em> de l'air vers l'eau sous 40° : \(\sin i_2 = \sin 40°/1{,}33\), \(i_2 = 28{,}9°\). Du verre (\(n = 1{,}50\)) vers l'air sous 25° : \(\sin i_2 = 1{,}50\sin 25° = 0{,}634\), \(i_2 = 39{,}3°\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Reconnaître une réflexion totale</strong>
    <ol>
      <li><span class="step">Vérifier le sens</span> : la réflexion totale n'est possible que vers un milieu <em>moins réfringent</em> (\(n_1 > n_2\)).</li>
      <li><span class="step">Calculer l'angle limite</span> : \(\sin i_\ell = n_2/n_1\).</li>
      <li><span class="step">Conclure</span> : si \(i_1 > i_\ell\), réflexion totale, toute la lumière est réfléchie ; sinon, un rayon réfracté existe (méthode 3), avec une réflexion partielle.</li>
    </ol>
    <p><em>Exemple éclair :</em> un rayon frappe sous 65° la paroi de verre (\(n = 1{,}52\)) d'un aquarium, du côté de l'eau (\(n = 1{,}33\)) : \(\sin i_\ell = 1{,}33/1{,}52\), \(i_\ell = 61{,}0°\) ; \(65° > 61{,}0°\) : réflexion totale.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : chercher l'angle limite par \(\sin i_\ell = n_1/n_2\) (rapport inversé, supérieur à 1 : la calculatrice affiche une erreur), ou appliquer la réflexion totale de l'air vers l'eau. Le rapport qui définit \(i_\ell\) est toujours le petit indice sur le grand.</div>

  <div class="method-box"><strong>Méthode 5 — Suivre un rayon à travers des dioptres plans parallèles</strong>
    <ol>
      <li><span class="step">Écrire l'invariant</span> : à chaque dioptre, \(n\sin i\) se conserve, et entre deux dioptres parallèles l'angle de sortie de l'un est l'angle d'incidence de l'autre.</li>
      <li><span class="step">En déduire</span> l'angle dans le dernier milieu directement : \(n_{\text{premier}}\sin i_{\text{premier}} = n_{\text{dernier}}\sin i_{\text{dernier}}\) ; les milieux intermédiaires n'interviennent pas (sauf pour décider d'une réflexion totale en chemin).</li>
      <li><span class="step">Si les milieux extrêmes sont identiques</span>, le rayon émergent est parallèle au rayon incident, simplement décalé.</li>
    </ol>
    <p><em>Exemple éclair :</em> un rayon passe de l'air dans la vitre d'un aquarium (\(n = 1{,}52\)) sous 40°, puis dans l'eau : il fait 25,0° dans le verre et 28,9° dans l'eau, exactement comme s'il passait directement de l'air à l'eau.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Construire l'image d'un objet par un miroir plan</strong>
    <ol>
      <li><span class="step">Placer l'image</span> : symétrique de chaque point de l'objet par rapport au plan du miroir ; même taille, droite, virtuelle pour un objet réel.</li>
      <li><span class="step">Tracer les rayons utiles</span> : joindre l'œil (ou le détecteur) à l'image ; le point d'intersection avec le miroir est le point de réflexion. Trait plein de l'objet au miroir puis du miroir à l'œil, tirets du miroir à l'image.</li>
      <li><span class="step">Vérifier la visibilité</span> : le point n'est vu que si son point de réflexion appartient au miroir.</li>
    </ol>
    <p><em>Exemple éclair :</em> une affiche à 2,5 m d'un miroir mural ; un client se tient entre les deux, à 1,0 m du miroir. L'image de l'affiche est 2,5 m derrière le miroir, à 3,5 m du client : c'est sur 3,5 m que son œil fait la mise au point.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Calculer une profondeur apparente (dioptre plan)</strong>
    <ol>
      <li><span class="step">Vérifier les conditions de Gauss</span> : observation presque perpendiculaire au dioptre.</li>
      <li><span class="step">Appliquer</span> \(\overline{HA'} = \dfrac{n_2}{n_1}\,\overline{HA}\), avec \(n_1\) l'indice du milieu de l'objet et \(n_2\) celui de l'observateur.</li>
      <li><span class="step">Contrôler</span> : un objet dans le milieu le plus réfringent paraît plus proche du dioptre ; dans le moins réfringent, plus éloigné. Hors des conditions de Gauss, revenir à \(h' = h\tan i_1/\tan i_2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un poisson à 30 cm derrière la vitre d'un aquarium, vu de face : il paraît à \(30/1{,}33 = 23\ \text{cm}\). Un plongeur voit un oiseau perché à 2,0 m au-dessus de l'eau à \(2{,}0\times1{,}33 = 2{,}7\ \text{m}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Juger de la netteté d'une image (Gauss et détecteur)</strong>
    <ol>
      <li><span class="step">Vérifier les conditions de Gauss</span> : inclinaison des rayons sur l'axe (une dizaine de degrés au plus), rayons proches de l'axe (diaphragme).</li>
      <li><span class="step">Comparer la tache image à l'élément du détecteur</span> : pixel (1 à 6 µm), cône de la rétine (quelques µm), grain de film (≈ 10 µm). Tache plus petite : image nette pour ce détecteur.</li>
      <li><span class="step">Pour améliorer</span> : diaphragmer (moins d'aberrations, moins de lumière), jusqu'à ce que la diffraction (tache de l'ordre de \(2\lambda_0 f'/D\)) prenne le relais.</li>
    </ol>
    <p><em>Exemple éclair :</em> un objet de 20 cm de haut, centré sur l'axe à 1,0 m d'une lentille, est vu sous un demi-angle de \(\arctan(0{,}10) = 5{,}7°\) : conditions de Gauss respectées. Si l'image d'un point est une tache de 12 µm, elle couvre trois pixels de 4 µm (floue à l'échelle du capteur) mais un seul grain de film.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : croire que diaphragmer améliore toujours l'image. Au-delà d'un certain point, la diffraction l'emporte et la tache grossit à nouveau ; et l'image s'assombrit comme le carré du diamètre.</div>

  <div class="method-box"><strong>Méthode 9 — Établir le cône d'acceptance d'une fibre</strong>
    <ol>
      <li><span class="step">Réfraction à l'entrée</span> : \(n_0\sin\theta = n_1\sin r\) (\(r\) : inclinaison sur l'axe dans le cœur).</li>
      <li><span class="step">Angle sur l'interface</span> : \(i = 90° - r\), car l'interface est parallèle à l'axe.</li>
      <li><span class="step">Condition de guidage</span> : \(i > i_\ell\), \(\sin i_\ell = n_2/n_1\), soit \(\cos r > n_2/n_1\).</li>
      <li><span class="step">Conclure</span> : \(n_0\sin\theta \lt n_1\sqrt{1 - n_2^2/n_1^2} = \sqrt{n_1^2 - n_2^2} = \text{ON}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> fibre de silice, \(n_1 = 1{,}46\), \(n_2 = 1{,}44\), entrée dans l'air : \(\text{ON} = \sqrt{1{,}46^2 - 1{,}44^2} = 0{,}241\), \(\theta_a = 13{,}9°\). Dans l'eau (\(n_0 = 1{,}33\)), le cône d'acceptance se resserre : \(\sin\theta_a = 0{,}241/1{,}33\), \(\theta_a = 10{,}4°\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Calculer la dispersion intermodale et le débit</strong>
    <ol>
      <li><span class="step">Durée la plus courte</span> : rayon axial, \(t_{\min} = n_1L/c\).</li>
      <li><span class="step">Durée la plus longue</span> : rayon limite, incliné de \(r\) sur l'axe avec \(\cos r = n_2/n_1\), qui parcourt \(L/\cos r\) : \(t_{\max} = n_1^2L/(n_2c)\).</li>
      <li><span class="step">Écart</span> : \(\delta t = \dfrac{n_1L}{c}\,\dfrac{n_1 - n_2}{n_2}\) ; débit maximal de l'ordre de \(1/\delta t\).</li>
    </ol>
    <p><em>Exemple éclair :</em> la fibre de la méthode 9, longue de 2,0 km : \(\delta t = \dfrac{1{,}46\times2{,}0\times10^{3}}{3{,}00\times10^{8}}\times\dfrac{0{,}02}{1{,}44} = 135\ \text{ns}\), soit un débit limité à environ 7 Mbit/s.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : comparer \(\theta\) (mesuré dans l'air par rapport à l'axe) à \(i_\ell\) (mesuré dans le cœur par rapport à la normale à l'interface) ; ou oublier que \(\delta t\) est proportionnel à la longueur \(L\) de la fibre.</div>
</div>
</template>

    <p><strong>Q3.</strong> Pour de petits angles, \(r \approx i/n\), \(\sin(i - r) \approx i - r = i(1 - 1/n)\) et \(\cos r \approx 1\) : \(d \approx e\,i\,(1 - 1/n)\). À 30° (0,524 rad) : \(d \approx 10{,}0\times0{,}524\times\tfrac13 = 1{,}75\ \text{mm}\), 10 % sous la valeur exacte : 30° est déjà à la limite des conditions de Gauss.</p>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le rayon entre sans déviation (incidence normale). Les petites faces font 45° avec l'hypoténuse : le rayon frappe la première sous l'incidence \(45°\). Angle limite verre/air : \(\sin i_\ell = 1/1{,}52\), \(i_\ell = 41{,}1°\). Comme \(45° > 41{,}1°\), la réflexion est totale. Il faut \(\sin 45° > 1/n\), soit \(n > \sqrt2 = 1{,}41\) : tous les verres courants conviennent.</p>
    <p><strong>Q2.</strong> Réfléchi, le rayon devient parallèle à l'hypoténuse et frappe la seconde petite face, elle aussi sous 45° : seconde réflexion totale. Il repart perpendiculairement à l'hypoténuse, en sens inverse, et ressort sans déviation. Le rayon a été renvoyé dans la direction d'où il venait, décalé latéralement (déviation de 180°). Applications : prismes des jumelles (deux prismes de ce type redressent l'image et replient le trajet), réflecteurs de vélo.</p>
    <p><strong>Q3.</strong> Angle limite verre/eau : \(\sin i_\ell = 1{,}33/1{,}52\), \(i_\ell = 61{,}0°\). L'incidence de 45° est inférieure : plus de réflexion totale, l'essentiel de la lumière sort par les petites faces. Le prisme ne fonctionne plus (il faudrait argenter les faces).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Miroirs : mesurer une petite rotation, renvoyer la lumière</h3>
  <div class="statement">Un faisceau laser fixe se réfléchit sur un petit miroir plan qui peut tourner autour d'un axe vertical contenu dans son plan. La tache réfléchie se forme sur une règle placée à \(D = 1{,}50\ \text{m}\) du miroir, perpendiculairement au faisceau réfléchi initial.</div>
  <div class="q"><strong>Q1.</strong> Montrer que si le miroir tourne de \(\alpha\), le rayon réfléchi tourne de \(2\alpha\).</div>
  <div class="q"><strong>Q2.</strong> La tache se déplace de 4,2 cm. De quel angle le miroir a-t-il tourné ?</div>
  <div class="q"><strong>Q3.</strong> Deux miroirs plans perpendiculaires forment un dièdre droit. Montrer qu'un rayon contenu dans un plan perpendiculaire à leur arête, réfléchi successivement par les deux miroirs, repart parallèlement à lui-même en sens inverse, quelle que soit son incidence.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La normale au miroir tourne de \(\alpha\) avec lui ; l'angle d'incidence passe de \(i\) à \(i + \alpha\) (ou \(i - \alpha\)). Le rayon réfléchi est le symétrique du rayon incident par rapport à la normale : sa direction fait l'angle \(2i\) avec le rayon incident (prolongé en sens inverse), puis \(2(i + \alpha)\). Le rayon incident étant fixe, le réfléchi a tourné de \(2\alpha\).</p>
    <p><strong>Q2.</strong> \(\tan(2\alpha) = 0{,}042/1{,}50\), d'où \(2\alpha = 1{,}60°\) et \(\alpha = 0{,}80°\) (ou \(1{,}4\times10^{-2}\ \text{rad}\)). Le doublement et le grand bras de levier permettent de mesurer des rotations très faibles.</p>
    <p><strong>Q3.</strong> Chaque réflexion change le signe de la composante de la direction du rayon perpendiculaire au miroir et conserve l'autre. Les deux miroirs étant perpendiculaires, la première réflexion inverse, par exemple, la composante horizontale, la seconde la composante verticale : les deux composantes sont inversées, la direction finale est opposée à la direction initiale, quelle que soit l'incidence. Le coin de cube (trois miroirs perpendiculaires) généralise ce résultat dans l'espace : c'est le principe des réflecteurs déposés sur la Lune.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Limites du modèle : diffraction et pixels</h3>
  <div class="statement">On prend \(\lambda_0 = 633\ \text{nm}\) pour le laser et \(\lambda_0 = 550\ \text{nm}\) pour la lumière visible moyenne.</div>
  <div class="q"><strong>Q1.</strong> Un faisceau laser traverse un trou de diamètre \(a = 0{,}20\ \text{mm}\). Estimer l'ouverture angulaire du faisceau diffracté et la taille de la tache sur un mur à 5,0 m. L'optique géométrique permet-elle de prévoir ce résultat ?</div>
  <div class="q"><strong>Q2.</strong> L'objectif d'un téléphone a une distance focale \(f' = 4{,}4\ \text{mm}\) et une ouverture de diamètre \(D = 2{,}4\ \text{mm}\). Même parfaitement stigmatique, il donne d'un point lointain une tache de diamètre de l'ordre de \(2\lambda_0 f'/D\) à cause de la diffraction. La calculer.</div>
  <div class="q"><strong>Q3.</strong> Le capteur a des pixels de 1,0 µm. Les images sont-elles nettes à l'échelle du pixel ? Que penser d'un capteur aux pixels encore plus petits ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\theta \approx \lambda_0/a\), soit \(\theta \approx 3{,}2\times10^{-3}\ \text{rad}\) ; tache de l'ordre de \(2\theta D = 3{,}2\ \text{cm}\) à 5,0 m, cent soixante fois le diamètre du trou. L'optique géométrique prévoirait une tache de 0,2 mm : le modèle est en défaut, l'ouverture n'est pas assez grande devant la longueur d'onde.</p>
    <p><strong>Q2.</strong> Diamètre de la tache de diffraction :</p><div class="formula">$$\frac{2\lambda_0 f'}{D} = \frac{2\times550\times10^{-9}\times4{,}4\times10^{-3}}{2{,}4\times10^{-3}} = 2{,}0\ \mu\text{m}$$</div>
    <p><strong>Q3.</strong> La tache couvre deux pixels de diamètre : à l'échelle du pixel, l'image d'un point n'est pas ponctuelle, et c'est la diffraction (pas les aberrations) qui l'impose. Des pixels plus petits n'apporteraient aucun détail de plus : le stigmatisme exigé d'un système dépend du détecteur, mais la diffraction fixe une limite que le détecteur ne peut pas dépasser.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Prisme : déviation minimale et condition d'émergence (hors programme, pour aller plus loin)</h3>
  <div class="statement">
    Un prisme d'angle au sommet \(A\) et d'indice \(n\), entouré d'air, reçoit un rayon dans un plan de section principale. On note \(i_1, r_1\) les angles sur la première face (entrée) et \(r_2, i_2\) sur la seconde (sortie). La déviation totale est \(D = (i_1 - r_1) + (i_2 - r_2)\).
  </div>
  <p class="exo-part">Partie A — Déviation minimale</p>
  <div class="q"><strong>A1.</strong> Établir les relations \(r_1 + r_2 = A\) et \(D = i_1 + i_2 - A\).</div>
  <div class="q"><strong>A2.</strong> Par un argument de retour inverse de la lumière, montrer que la déviation est minimale pour une marche <strong>symétrique</strong> (\(i_1 = i_2\)), en admettant que ce minimum est unique. En déduire qu'alors \(r_1 = r_2 = A/2\) et la relation \(n = \dfrac{\sin\!\big(\frac{D_m + A}{2}\big)}{\sin\!\big(\frac{A}{2}\big)}\).</div>
  <div class="q"><strong>A3.</strong> Au goniomètre, on mesure \(D_m = 40^\circ\) pour un prisme d'angle \(A = 60^\circ\). En déduire l'indice \(n\) du verre.</div>
  <p class="exo-part">Partie B — Condition d'émergence</p>
  <div class="q"><strong>B1.</strong> Le rayon ne peut émerger de la seconde face que si \(r_2\) reste inférieur à l'angle limite \(i_\ell\) (\(\sin i_\ell = 1/n\)). Sachant que \(r_1 \le i_\ell\) (réfraction d'entrée) et \(r_2 = A - r_1\), montrer qu'un rayon ne peut émerger que si \(A \le 2\,i_\ell\).</div>
  <div class="q"><strong>B2.</strong> Application avec \(n = 1{,}53\) : calculer l'angle au sommet maximal \(A_{\max}\) au-delà duquel aucun rayon ne peut émerger (réflexion totale sur la seconde face).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Les normales aux deux faces font entre elles l'angle \(A\) ; dans le triangle rayon-normales, \(r_1 + r_2 = A\). La déviation est</p><div class="formula">$$D = (i_1 - r_1) + (i_2 - r_2) = i_1 + i_2 - (r_1 + r_2) = i_1 + i_2 - A$$</div>
    <p><strong>A2.</strong> Le trajet étant réversible, un rayon entrant sous \(i_2\) ressort sous \(i_1\) avec la même déviation : la fonction \(D(i_1)\) prend la même valeur en \(i_1\) et en \(i_2\). Si le minimum est unique, il est atteint pour \(i_1 = i_2\). Alors par symétrie \(r_1 = r_2\), et avec \(r_1 + r_2 = A\) : \(r_1 = r_2 = A/2\). La loi de Snell d'entrée donne \(\sin i_1 = n\sin(A/2)\) ; et \(D_m = 2i_1 - A\) donne \(i_1 = \frac{D_m+A}{2}\). D'où \(n = \dfrac{\sin\!\big(\frac{D_m+A}{2}\big)}{\sin\!\big(\frac{A}{2}\big)}\).</p>
    <p><strong>A3.</strong> \(n = \dfrac{\sin\!\big(\frac{40+60}{2}\big)}{\sin 30^\circ} = \dfrac{\sin 50^\circ}{0{,}5} = \dfrac{0{,}766}{0{,}5} \approx 1{,}53\).</p>
    <p><strong>B1.</strong> À l'entrée, \(i_1\) variant de \(0\) à \(90^\circ\) donne \(r_1\) variant de \(0\) à \(i_\ell\) (réfraction air→verre, \(\sin r_1 = \sin i_1/n \le 1/n\)). Émergence : \(r_2 \le i_\ell\), soit \(A - r_1 \le i_\ell\), c'est-à-dire \(r_1 \ge A - i_\ell\). Il faut donc qu'il existe \(r_1\) avec \(A - i_\ell \le r_1 \le i_\ell\), ce qui n'est possible que si \(A - i_\ell \le i_\ell\), soit \(A \le 2\,i_\ell\).</p>
    <p><strong>B2.</strong> \(i_\ell = \arcsin(1/1{,}53) = \arcsin(0{,}654) \approx 40{,}8^\circ\). D'où \(A_{\max} = 2\,i_\ell \approx 81{,}6^\circ\) : au-delà, le rayon subit une réflexion totale sur la seconde face et ne peut sortir.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Fibre optique à saut d'indice : guidage, débit, injection</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>optique géométrique</em>, application à la fibre). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une fibre optique à saut d'indice, rectiligne, a un cœur d'indice \(n_1 = 1{,}50\) entouré d'une gaine d'indice \(n_2 = 1{,}48\). La lumière entre depuis l'air (\(n_0 = 1{,}00\)) par la face d'entrée, plane et perpendiculaire à l'axe. On prend \(c = 3{,}00\times10^{8}\ \text{m·s}^{-1}\).
  </div>

  <p class="exo-part">Partie A — Réflexion totale</p>
  <div class="q"><strong>A1.</strong> Rappeler la loi de Snell-Descartes pour la réfraction. À quelle condition un rayon se propageant dans le cœur subit-il une réflexion totale sur l'interface cœur-gaine ?</div>
  <div class="q"><strong>A2.</strong> Calculer l'angle limite \(i_\ell\) (mesuré par rapport à la normale à l'interface) au-delà duquel il y a réflexion totale.</div>

  <p class="exo-part">Partie B — Cône d'acceptance</p>
  <div class="q"><strong>B1.</strong> Montrer que l'angle d'incidence maximal \(\theta_a\) à l'entrée (depuis l'air) pour lequel le rayon reste guidé vérifie \(n_0\sin\theta_a = \sqrt{n_1^2 - n_2^2}\) (l'<em>ouverture numérique</em> ON).</div>
  <div class="q"><strong>B2.</strong> Calculer l'ON et l'angle d'acceptance \(\theta_a\).</div>

  <p class="exo-part">Partie C — Dispersion intermodale et débit</p>
  <div class="q"><strong>C1.</strong> Exprimer la durée de parcours d'une fibre de longueur \(L\) pour le rayon axial, puis pour le rayon guidé le plus incliné. En déduire la dispersion intermodale \(\delta t\).</div>
  <div class="q"><strong>C2.</strong> Calculer \(\delta t\) pour \(L = 500\ \text{m}\) et en déduire un ordre de grandeur du débit maximal, en bits par seconde, d'une liaison où chaque bit est une impulsion lumineuse brève.</div>
  <div class="q"><strong>C3.</strong> On double la longueur de la liaison. Que deviennent \(\delta t\) et le débit maximal ? Quelle solution technique adopte-t-on pour les longues distances ?</div>

  <p class="exo-part">Partie D — Injection par une lentille</p>
  <p>Un faisceau laser parallèle, de diamètre \(d = 2{,}0\ \text{mm}\), est focalisé sur le centre de la face d'entrée par une lentille convergente de distance focale \(f'\), comme sur la figure. Le faisceau est uniforme sur toute sa section.</p>

  <div class="q"><strong>D1.</strong> Exprimer l'angle \(\theta\) des rayons les plus inclinés en fonction de \(d\) et \(f'\). En déduire la distance focale minimale permettant de guider toute la lumière.</div>
  <div class="q"><strong>D2.</strong> On dispose seulement d'une lentille de focale \(f' = 3{,}0\ \text{mm}\). Quelle fraction de la puissance du faisceau est guidée ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Snell-Descartes : \(n_i\sin i = n_r\sin r\). Pour un rayon allant du cœur (\(n_1\)) vers la gaine (\(n_2 \lt n_1\)), il y a réflexion totale dès que l'angle d'incidence sur l'interface dépasse l'angle limite \(i_\ell\) tel que \(\sin i_\ell = n_2/n_1\) (au-delà, aucun rayon réfracté).</p>
    <p><strong>A2.</strong> \(\sin i_\ell = n_2/n_1 = 1{,}48/1{,}50 = 0{,}987\), donc \(i_\ell \approx 80{,}6^\circ\).</p>
    <p><strong>B1.</strong> À l'entrée : \(n_0\sin\theta = n_1\sin r\). L'angle d'incidence du rayon réfracté sur l'interface cœur-gaine vaut \(90^\circ - r\) ; le guidage impose \(90^\circ - r \ge i_\ell\), soit \(\sin r \le \cos i_\ell = \sqrt{1-(n_2/n_1)^2}\). D'où</p><div class="formula">$$n_0\sin\theta_a = n_1\sin r_{\max} = n_1\sqrt{1-(n_2/n_1)^2} = \sqrt{n_1^2 - n_2^2}$$</div>
    <p><strong>B2.</strong></p><div class="formula">$$\text{ON} = \sqrt{1{,}50^2 - 1{,}48^2} = \sqrt{2{,}25 - 2{,}190} = \sqrt{0{,}0596} \approx 0{,}244$$</div><p>\(\theta_a = \arcsin(0{,}244) \approx 14{,}1^\circ\) : seuls les rayons entrant dans ce cône sont guidés.</p>
    <p><strong>C1.</strong> Le rayon axial parcourt \(L\) à la vitesse \(c/n_1\) : \(t_{\min} = n_1L/c\). Le rayon guidé le plus incliné frappe l'interface sous \(i_\ell\) : son inclinaison \(r\) sur l'axe vérifie \(\cos r = \sin i_\ell = n_2/n_1\) ; sa longueur de trajet est \(L/\cos r = n_1L/n_2\), d'où \(t_{\max} = n_1^2L/(n_2c)\). Dispersion intermodale : \(\delta t = t_{\max} - t_{\min} = \dfrac{n_1L}{c}\,\dfrac{n_1 - n_2}{n_2}\).</p>
    <p><strong>C2.</strong> \(t_{\min} = 1{,}50\times500/3{,}00\times10^{8} = 2{,}50\ \mu\text{s}\) et \(\delta t = t_{\min}\,(n_1 - n_2)/n_2\), soit \(\delta t = 3{,}4\times10^{-8}\ \text{s} = 34\ \text{ns}\). Une impulsion très brève ressort étalée sur 34 ns ; pour que deux impulsions successives ne se chevauchent pas, il faut les espacer d'au moins \(\delta t\) : débit maximal de l'ordre de \(1/\delta t \approx 3\times10^{7}\ \text{bit/s}\), soit 30 Mbit/s.</p>
    <p><strong>C3.</strong> \(\delta t\) est proportionnel à \(L\) : il double (68 ns) et le débit maximal est divisé par deux (15 Mbit/s). Pour les longues distances, on emploie des fibres monomodes (cœur de quelques micromètres, un seul mode, plus de dispersion intermodale) ou, à défaut, des fibres à gradient d'indice.</p>
    <p><strong>D1.</strong> Le faisceau converge au foyer image F′ de la lentille ; un rayon arrivant à la hauteur \(d/2\) passe par F′, d'où \(\tan\theta = \dfrac{d}{2f'}\). Toute la lumière est guidée si \(\theta \le \theta_a\), soit \(f' \ge \dfrac{d}{2\tan\theta_a} = \dfrac{1{,}0\ \text{mm}}{\tan 14{,}1°} = 4{,}0\ \text{mm}\). (Pour des angles de 14°, les conditions de Gauss sont encore à peu près respectées.)</p>
    <p><strong>D2.</strong> Avec \(f' = 3{,}0\ \text{mm}\), les rayons arrivant à une hauteur \(h\) font l'angle \(\arctan(h/f')\) ; ils sont guidés si \(h \le f'\tan\theta_a = 3{,}0\times0{,}252 = 0{,}76\ \text{mm}\). La puissance étant uniforme sur la section, la fraction guidée est le rapport des aires : \((0{,}76/1{,}0)^2 = 0{,}57\). Environ 43 % de la lumière passe dans la gaine et se perd.</p>
  </div>
