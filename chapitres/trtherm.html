  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Les traitements thermiques relèvent de la compétence « Industrialiser un produit » (G2) : <strong>évaluer la capacité d'un procédé à réaliser une pièce métallique</strong>. Le programme les place au semestre S3 (début de 2ᵉ année) et les limite aux <strong>aspects fonctionnels</strong> : ce que chaque traitement change, pour quels aciers, sur quelles pièces, avec quelles règles de conception. L'étude des phénomènes métallurgiques est exclue ; elle est regroupée en fin de chapitre, pour aller plus loin. Synthèse des procédés de fabrication des pièces métalliques : chapitre de 2ᵉ année <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>, §7.</div>

<div class="course-section">
  <div class="sec-num">§1 · PRINCIPE &amp; OBJECTIF</div>
  <h2>Modifier les propriétés sans changer la forme</h2>
  <div class="intro">Un <strong>traitement thermique</strong> est un cycle contrôlé de <strong>chauffage – maintien – refroidissement</strong> qui modifie les <strong>propriétés mécaniques</strong> d'un alliage (dureté, résistance, ténacité, ductilité) <strong>sans changer sa forme</strong>. Il agit en pilotant les <strong>transformations de phase à l'état solide</strong>.</div>

  <div class="def-box"><strong>Les trois réglages d'un cycle.</strong> La <strong>température</strong> atteinte ; la <strong>durée du maintien</strong>, qui laisse la température s'égaliser jusqu'au cœur (ou, dans un traitement thermochimique, le carbone ou l'azote diffuser) ; la <strong>vitesse de refroidissement</strong>, fixée par le milieu : eau (la plus rapide), huile, air, four (la plus lente). Règle fonctionnelle pour un acier assez chargé en carbone : refroidi <strong>vite</strong> depuis une température élevée, il <strong>durcit</strong> ; refroidi <strong>lentement</strong>, il s'<strong>adoucit</strong> ; réchauffé modérément après durcissement, il devient <strong>moins fragile</strong>.</div>

  <div class="prop-box"><strong>Ce que l'on cherche à modifier.</strong>
    <ul style="margin:0.3rem 0">
      <li>la <strong>dureté</strong> (HV, HRC) : tenue à l'usure, au marquage, aux pressions de contact ;</li>
      <li>la <strong>limite élastique</strong> \(R_e\) et la <strong>résistance</strong> \(R_m\) : charges admissibles ;</li>
      <li>la <strong>ténacité</strong> et la <strong>résilience</strong> : tenue aux chocs, insensibilité aux fissures ;</li>
      <li>la <strong>ductilité</strong> (allongement à rupture) : aptitude à se déformer, à être mis en forme ;</li>
      <li>la <strong>tenue en fatigue</strong> : une couche superficielle dure, mise en compression, retarde l'amorçage des fissures ;</li>
      <li>l'<strong>usinabilité</strong> : un acier doux s'usine bien, un acier durci se rectifie.</li>
    </ul>
    Effets secondaires à maîtriser : <strong>contraintes résiduelles</strong> et <strong>déformations</strong>. Les essais de dureté et de résilience qui contrôlent un traitement sont présentés au §2 du chapitre <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>.
  </div>

  <div class="notice"><strong>Volume ou surface.</strong> Les traitements <strong>volumiques</strong> (trempe, revenu, recuit) agissent sur toute la section de la pièce. Les traitements <strong>surfaciques</strong> (trempe superficielle, cémentation, nitruration) ne modifient qu'une couche de quelques dixièmes de millimètre à quelques millimètres : peau dure, cœur tenace.</div>
</div>

  </figure>

  <div class="prop-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Trempe</strong> : chauffage au-delà d'une température de transformation propre à l'acier (de l'ordre de 800 à 900 °C pour les aciers de construction), maintien, puis refroidissement <strong>rapide</strong> (eau, huile, polymère, gaz) → dureté, \(R_e\) et \(R_m\) fortement augmentées. Résultat : <strong>très dur mais fragile</strong>, avec contraintes résiduelles (risque de tapures et déformations).</li>
      <li><strong>Revenu</strong> : après trempe, réchauffage <strong>modéré</strong> (entre 150 et 650 °C environ, toujours en dessous de la température de trempe) → on réduit la fragilité et on restaure de la <strong>ténacité</strong>. <em>Trempe + revenu</em> = traitement d'<strong>amélioration</strong> (bon compromis dureté/ténacité).</li>
      <li><strong>Recuit</strong> : chauffage puis refroidissement <strong>lent</strong> (au four) → <strong>adoucit</strong>, homogénéise, supprime les contraintes et l'écrouissage, améliore l'usinabilité.</li>
    </ul>
  </div>

  <h3>Régler le compromis par la température de revenu</h3>
  <ul>
    <li><strong>Revenu bas</strong> (vers 150 à 250 °C) : la pièce garde presque toute sa dureté, ses contraintes de trempe se relâchent. Pour les outils, les roulements, les pièces cémentées ou trempées en surface.</li>
    <li><strong>Revenu haut</strong> (vers 500 à 650 °C) : la dureté baisse nettement, la ténacité devient élevée ; la résistance reste bien supérieure à celle de l'acier recuit. C'est l'<strong>amélioration</strong> des arbres, bielles, fusées, vis à haute résistance ; un acier ainsi amélioré (autour de 30 HRC) s'usine encore à l'outil coupant.</li>
  </ul>

  <div style="overflow-x:auto"><table>
    <tr><th>Traitement</th><th>Dureté, \(R_e\), \(R_m\)</th><th>Ténacité, ductilité</th><th>Contraintes internes</th><th>Usinabilité</th></tr>
    <tr><td>Recuit</td><td>abaissées</td><td>élevées</td><td>supprimées</td><td>bonne</td></tr>
    <tr><td>Trempe seule</td><td>maximales</td><td>très faibles (fragile)</td><td>fortes</td><td>rectification seulement</td></tr>
    <tr><td>Trempe + revenu bas</td><td>très élevées</td><td>faibles</td><td>réduites</td><td>rectification seulement</td></tr>
    <tr><td>Trempe + revenu haut (amélioration)</td><td>élevées</td><td>bonnes</td><td>faibles</td><td>correcte</td></tr>
  </table></div>

  <div class="def-box"><strong>Trempabilité.</strong> Aptitude d'un acier à durcir en profondeur par la trempe. Au cœur d'une pièce épaisse, le refroidissement est plus lent qu'en surface : un acier non allié ne durcit à cœur que sur de petites sections, alors que les éléments d'alliage (chrome, molybdène, nickel, manganèse) permettent de tremper à cœur des sections bien plus fortes, et avec un milieu plus doux (huile plutôt qu'eau), donc avec moins de déformations et de risques de tapure.</div>

  <div class="notice">Une pièce trempée est rarement utilisée telle quelle : trop fragile et trop contrainte. On enchaîne presque toujours par un <strong>revenu</strong>. Et après traitement (déformations possibles), les surfaces de précision sont souvent <strong>rectifiées</strong>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TRAITEMENTS THERMOCHIMIQUES (DURCISSEMENT SUPERFICIEL)</div>
  <h2>Durcir la peau, garder un cœur tenace</h2>
  <div class="intro">On enrichit la <strong>surface</strong> en un élément (carbone, azote) par <strong>diffusion</strong> à chaud, pour obtenir une peau dure résistant à l'usure tout en conservant un cœur tenace résistant aux chocs.</div>

  <figure class="schema" style="max-width:320px">
  <svg viewBox="0 0 300 170" role="img" aria-label="Durcissement superficiel : coupe d'une pièce avec une peau dure enrichie et un cœur tenace">

    <circle cx="100" cy="85" r="62" class="sk-amber"/>
    <circle cx="100" cy="85" r="44" class="fl-paper sk-ink"/>
    <text x="100" y="90" text-anchor="middle" class="lab-muted" style="font-size:13px">cœur tenace</text>
    <line x1="184" y1="58" x2="150" y2="62" class="sk-axis"/>
    <text x="188" y="56" class="lab-accent" style="font-size:13px">peau dure</text>
    <text x="188" y="73" class="lab-accent" style="font-size:13px">(enrichie</text>
    <text x="188" y="90" class="lab-accent" style="font-size:13px">en C ou N)</text>
  </svg>
  <figcaption>Cémentation / nitruration : la diffusion enrichit la <strong>peau</strong> (dure, résistante à l'usure) ; le <strong>cœur</strong> reste tenace (résistant aux chocs et à la fatigue).</figcaption>
  </figure>

  <div class="def-box">
    <strong>Cémentation</strong> : enrichissement de la surface en <strong>carbone</strong> à chaud, suivi d'une trempe → peau très dure, cœur tenace (engrenages, arbres).<br>
    <strong>Nitruration</strong> : enrichissement en <strong>azote</strong> → surface très dure, à plus basse température (peu de déformations), sans trempe ultérieure.<br>
    <strong>Carbonitruration</strong> : apport simultané de carbone et d'azote.
  </div>

  <h3>Repères fonctionnels</h3>
  <ul>
    <li><strong>Cémentation.</strong> Maintien de plusieurs heures vers 900 à 950 °C dans une atmosphère riche en carbone ; la couche enrichie, de 0,3 à 2 mm environ, est d'autant plus épaisse que le maintien est long. Suivent une trempe et un revenu bas : surface vers 58 à 62 HRC, cœur tenace. Aciers <strong>pauvres en carbone</strong> (vers 0,1 à 0,2 %), le plus souvent faiblement alliés (16MnCr5, 20MnCr5). Les déformations de la trempe imposent une rectification des surfaces précises.</li>
    <li><strong>Nitruration.</strong> Maintien long (une à plusieurs dizaines d'heures) vers 500 à 570 °C, en dessous de la température de trempe : pas de trempe, donc <strong>très peu de déformation</strong> ; on nitrure des pièces déjà finies. Couche mince (0,1 à 0,6 mm environ) mais très dure (de l'ordre de 800 à 1 100 HV) : usure, grippage, fatigue, et un peu de corrosion. Aciers <strong>alliés</strong> contenant des éléments qui forment des nitrures durs (chrome, molybdène, aluminium, vanadium : 32CrMoV13), trempés et revenus au préalable pour un cœur résistant.</li>
    <li><strong>Carbonitruration.</strong> À température plus basse que la cémentation, couches plus minces, moins de déformations : petites pièces de grande série.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§4 · TREMPE SUPERFICIELLE</div>
  <h2>Ne chauffer que la peau</h2>
  <div class="intro">Plutôt que d'enrichir la surface, on chauffe <strong>très vite la seule couche superficielle</strong> au-delà de la température de trempe, puis on la refroidit aussitôt. La peau durcit ; le cœur, resté froid, garde ses propriétés, souvent celles d'un état amélioré obtenu au préalable.</div>

  <div class="def-box"><strong>Trempe superficielle.</strong> Trempe limitée à une couche de quelques dixièmes de millimètre à quelques millimètres, obtenue par un chauffage rapide et localisé suivi d'un refroidissement immédiat, en général suivie d'un revenu bas de détente. Sans apport d'élément, elle suppose un acier <strong>déjà trempable</strong> : acier à 0,35 à 0,55 % de carbone, non allié (C45) ou faiblement allié (42CrMo4), ou fonte à graphite sphéroïdal. La couche est un peu moins dure qu'une couche cémentée (de l'ordre de 50 à 60 HRC).</div>

  <h3>Trois façons de chauffer la peau</h3>
  <ul>
    <li><strong>Par induction.</strong> Un inducteur (bobine de cuivre refroidie à l'eau) parcouru par un courant alternatif de moyenne ou haute fréquence induit dans la pièce des courants de Foucault ; l'effet de peau les concentre près de la surface, qui s'échauffe par effet Joule en quelques secondes. <strong>Plus la fréquence est élevée, plus la couche chauffée est mince</strong> : quelques centaines de kilohertz pour une couche de l'ordre du millimètre, quelques kilohertz pour plusieurs millimètres. Une douche suit l'inducteur. Rapide, reproductible, automatisable : <strong>grande série</strong> de pièces de révolution (portées d'arbres, chemins de roulement, tiges de vérins, cames, dentures).</li>
    <li><strong>Au chalumeau</strong> (à la flamme). Une rampe de flammes oxyacétyléniques balaie la surface, suivie d'une douche. Matériel simple et transportable, adapté aux <strong>grandes pièces</strong> ou aux pièces unitaires (glissières de bâtis de machines, grandes couronnes dentées, galets de pont roulant) ; couche de 1 à quelques millimètres, moins régulière.</li>
    <li><strong>Au laser</strong> (ou au faisceau d'électrons). Un faisceau balaie la zone à durcir ; la chaleur, déposée en surface, est aussitôt évacuée par la masse froide de la pièce, qui se trempe d'elle-même, sans fluide. Couche mince (quelques dixièmes de millimètre à environ 1,5 mm), <strong>déformations minimes</strong>, zones étroites ou peu accessibles (arêtes d'outils de découpe, cames, portées localisées) ; équipement coûteux.</li>
  </ul>

<div class="course-section">
  <div class="sec-num">§5 · CHOISIR UN TRAITEMENT</div>
  <h2>Synthèse fonctionnelle : buts, aciers, pièces</h2>
  <div class="intro">Choisir un traitement, c'est partir de la fonction de la pièce (charges, chocs, usure, précision), en déduire les propriétés à obtenir et où (dans la masse ou en surface), puis vérifier que l'acier s'y prête. Les nuances citées sont des exemples.</div>

  <div style="overflow-x:auto"><table>
    <tr><th>Traitement</th><th>But</th><th>Propriétés modifiées</th><th>Aciers concernés</th><th>Exemples de pièces</th></tr>
    <tr><td>Recuit</td><td>adoucir, relâcher les contraintes, effacer l'écrouissage</td><td>dureté et résistance abaissées, ductilité et usinabilité accrues, contraintes supprimées</td><td>tous les aciers</td><td>brut forgé avant usinage, ensemble soudé, tôle écrouie avant une nouvelle mise en forme</td></tr>
    <tr><td>Trempe + revenu haut (amélioration)</td><td>résistance élevée sans fragilité, dans toute la section</td><td>\(R_e\) et \(R_m\) nettement augmentées, ténacité conservée, fatigue améliorée</td><td>aciers à 0,3 à 0,6 % de carbone : non alliés pour les petites sections (C45), faiblement alliés pour les fortes (42CrMo4, 34CrNiMo6)</td><td>arbres de transmission, bielles, fusées, vis à haute résistance</td></tr>
    <tr><td>Trempe + revenu bas</td><td>dureté maximale dans toute la section</td><td>dureté très élevée (≈ 58 à 65 HRC), ténacité faible</td><td>aciers à outils, aciers à roulements (100Cr6)</td><td>billes et bagues de roulements, poinçons, matrices, outils de coupe</td></tr>
    <tr><td>Trempe superficielle</td><td>peau dure localisée, cœur tenace</td><td>dureté de surface (≈ 50 à 60 HRC) sur 0,3 à 5 mm, tenue à l'usure et à la fatigue</td><td>aciers à 0,35 à 0,55 % de carbone (C45, 42CrMo4), souvent améliorés avant ; fontes à graphite sphéroïdal</td><td>portées de roulements, tiges de vérins, cames, dentures, glissières</td></tr>
    <tr><td>Cémentation + trempe + revenu bas</td><td>peau très dure et épaisse sur un cœur tenace</td><td>surface ≈ 58 à 62 HRC sur 0,3 à 2 mm ; fatigue de contact et de flexion</td><td>aciers pauvres en carbone, faiblement alliés (16MnCr5, 20MnCr5)</td><td>engrenages fortement chargés, arbres cannelés, axes de piston</td></tr>
    <tr><td>Nitruration</td><td>surface très dure sans déformation</td><td>≈ 800 à 1 100 HV sur 0,1 à 0,6 mm ; usure, grippage, fatigue</td><td>aciers alliés de nitruration (32CrMoV13), améliorés avant</td><td>vilebrequins, arbres à cames, moules d'injection, vis d'extrudeuse</td></tr>
  </table></div>

    <ul style="margin:0.3rem 0">
      <li><strong>Profondeur et dureté</strong> : fortes pressions de contact sur une denture très chargée → couche épaisse et très dure (cémentation) ; usure ou grippage sous charge modérée → une couche mince suffit (nitruration).</li>

      <li><strong>Acier</strong> : déjà trempable (0,35 à 0,55 % de carbone) → trempe superficielle ; pauvre en carbone → cémentation ; acier allié de nitruration → nitruration.</li>
      <li><strong>Série</strong> : l'induction s'automatise pièce à pièce ; cémentation et nitruration traitent des charges entières de pièces au four.</li>
    </ul>
  </div>

<div class="course-section">
  <div class="sec-num">§6 · RÈGLES DE CONCEPTION</div>
  <h2>Dessiner une pièce qui supporte son traitement</h2>
  <div class="intro">Un traitement thermique se prépare dès le dessin de définition : la forme de la pièce et l'ordre des opérations décident des déformations, des risques de fissure et des surfaces qu'il faudra reprendre après traitement.</div>

  <div class="prop-box"><strong>Règles de forme.</strong>
    <ul style="margin:0.3rem 0">
      <li><strong>Éviter les variations brusques d'épaisseur</strong> : une partie mince refroidit bien avant une partie massive, et les écarts de retrait déforment ou fissurent la pièce. Rapprocher les épaisseurs, raccorder progressivement, évider au besoin une partie massive.</li>
      <li><strong>Arrondir</strong> : congés aux changements de section, chanfreins ou arrondis sur les arêtes. Un angle vif concentre les contraintes de trempe (amorce de tapure) ; une arête vive surchauffe aussi en trempe superficielle.</li>
      <li>Éloigner trous et rainures des bords et des arêtes, éviter les parois minces entre deux trous ; préférer les trous débouchants (le fluide de trempe y circule).</li>
      <li>Rechercher la <strong>symétrie des masses</strong>, pour que les déformations se compensent ; une pièce longue et mince se trempe suspendue verticalement.</li>
    </ul>
  </div>

  <figure class="schema" style="max-width:520px">

  </figure>

  <div class="def-box"><strong>Épargne.</strong> Zone d'une pièce que l'on veut garder non durcie : filetage (qui deviendrait fragile), zone à usiner, à percer ou à souder après le traitement, zone qui doit pouvoir se déformer. En cémentation, on la protège par un dépôt de cuivre ou une pâte isolante, ou on y laisse une surépaisseur que l'on usine après l'enrichissement et avant la trempe : la couche riche en carbone part avec les copeaux. En nitruration, on la protège par un dépôt ou une pâte. En trempe superficielle, il suffit de ne pas la chauffer.</div>

  <div class="prop-box"><strong>Ordre des opérations.</strong>
    <ol style="margin:0.3rem 0">
      <li>Ébauche, puis éventuellement recuit de détente (après soudage, ou après une ébauche qui a enlevé beaucoup de matière).</li>
      <li>Usinage de finition à l'outil coupant tant que l'acier est doux, en laissant une <strong>surépaisseur de rectification</strong> de quelques dixièmes de millimètre sur les surfaces précises qui seront durcies.</li>
      <li>Traitement thermique (trempe + revenu, trempe superficielle, cémentation + trempe + revenu).</li>
      <li><strong>Rectification</strong> des surfaces précises : la trempe a déformé la pièce, et l'acier durci ne s'usine plus guère à l'outil coupant. Puis contrôle : dureté, profondeur de couche, absence de fissures (chapitre « Contrôle non destructif »).</li>
    </ol>
    Deux exceptions utiles : la <strong>nitruration</strong>, presque sans déformation, se fait sur une pièce déjà finie ; un acier simplement <strong>amélioré</strong> reste usinable, on peut donc l'améliorer avant la finition.
  </div>

  <div class="notice"><strong>Surépaisseur et profondeur de couche.</strong> La rectification enlève une partie de la couche durcie : la surépaisseur doit rester petite devant la profondeur de cémentation ou de trempe, et la profondeur spécifiée s'entend <strong>après</strong> rectification. Sur le dessin, la zone traitée est délimitée par un trait mixte fort ; on y indique le traitement, la dureté visée et la profondeur conventionnelle, par exemple « cémenté, trempé et revenu, 58 à 62 HRC, profondeur 0,8 à 1,2 mm à 550 HV ».</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · MÉTALLURGIE DES ACIERS</div>
  <h2>Ce qui se passe dans l'acier (hors programme)</h2>
  <div class="intro">Le programme exclut l'étude des phénomènes métallurgiques. Ces repères expliquent pourtant les règles fonctionnelles des sections précédentes.</div>

  <div class="def-box">
    Pour les aciers, tout repose sur la phase <strong>austénite</strong> (obtenue par chauffage) et sur la façon dont elle se transforme au refroidissement : <strong>lent</strong> → structures molles (ferrite + perlite) ; <strong>rapide</strong> → <strong>martensite</strong>, très dure mais fragile. C'est la <strong>vitesse de refroidissement</strong> qui décide de la microstructure, donc des propriétés.
  </div>

  <h3>Vitesse de refroidissement → microstructure → dureté</h3>
  <div class="prop-box">
    <ul style="margin:0.3rem 0">
      <li>Refroidissement <strong>lent</strong> (recuit) → ferrite + perlite → <strong>doux, ductile, usinable</strong>.</li>
      <li>Refroidissement à l'<strong>air</strong> (normalisation) → grain fin, propriétés homogènes.</li>
      <li>Refroidissement <strong>rapide</strong> (trempe) → <strong>martensite</strong> → <strong>dur, fragile</strong>.</li>
    </ul>
    La <strong>trempabilité</strong> est l'aptitude d'un acier à former de la martensite à cœur ; elle dépend de la composition (éléments d'alliage) et de la taille de la pièce.
  </div>
  <ul>
    <li><strong>Normalisation</strong> : refroidissement à l'air → affine le grain, structure homogène.</li>
    <li><strong>Revenu</strong> : la martensite, sursaturée en carbone, en rejette une partie sous forme de fins carbures ; d'autant plus que la température de revenu est élevée : la dureté baisse, la ténacité remonte.</li>
    <li><strong>Pourquoi cémenter puis tremper</strong> : la dureté de la martensite croît avec sa teneur en carbone. La peau enrichie donne une martensite très dure, le cœur pauvre en carbone une structure bien moins dure et tenace.</li>
    <li><strong>Pourquoi la nitruration durcit sans trempe</strong> : l'azote forme avec le chrome, l'aluminium, le molybdène ou le vanadium de fins nitrures très durs, sans passer par l'austénite ni par une trempe.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · TRAITEMENTS THERMIQUES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent le cours : choisir un traitement d'après la fonction de la pièce (§2 à §5), le placer dans la gamme et dessiner une pièce qui le supporte (§6). On raisonne sur les effets fonctionnels ; la métallurgie n'est pas demandée.</div>

  <div class="method-box">
    <strong>Méthode 1 — Choisir un traitement selon l'objectif</strong>
    <ol style="margin-top:.4rem">
      <li><strong>Durcir à cœur</strong> (résistance élevée) → trempe + revenu (amélioration).</li>
      <li><strong>Adoucir</strong> / faciliter l'usinage / supprimer l'écrouissage → recuit.</li>
      <li><strong>Durcir la surface</strong> en gardant un cœur tenace → cémentation/nitruration (+ trempe pour la cémentation), ou trempe superficielle si l'acier est déjà trempable.</li>
      <li>Affiner le grain / homogénéiser → normalisation (hors programme).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Pourquoi un revenu après la trempe ?</strong>
    <ol style="margin-top:.4rem">
      <li>La trempe laisse l'acier très dur mais <strong>fragile</strong> et très contraint.</li>
      <li>Le revenu réchauffe modérément → diminue la dureté un peu, mais restaure la <strong>ténacité</strong> et relâche les contraintes.</li>
      <li>Bilan : on choisit la température de revenu pour régler le compromis dureté ↔ ténacité.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> un poinçon de découpe doit rester très dur, il reçoit un revenu bas (vers 200 °C) ; un arbre de transmission doit encaisser des chocs, il reçoit un revenu haut (vers 600 °C) et reste usinable.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Choisir un traitement de surface</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Fonction.</span> Identifier ce que la surface doit supporter (usure, grippage, pressions de contact, fatigue) et ce que le cœur doit garder (ténacité, résistance aux chocs).</li>
      <li><span class="step">Profondeur.</span> Fortes pressions de contact (denture très chargée) → couche épaisse : cémentation ; usure ou grippage sous charge modérée → couche mince : nitruration ; zone localisée de 0,5 à quelques millimètres → trempe superficielle.</li>
      <li><span class="step">Déformations.</span> Pièce finie de précision qu'on ne veut plus reprendre → nitruration ; sinon prévoir une rectification après la trempe.</li>
      <li><span class="step">Acier.</span> Vérifier la cohérence : trempe superficielle sur un acier déjà trempable (0,35 à 0,55 % de carbone), cémentation sur un acier pauvre en carbone, nitruration sur un acier allié de nitruration.</li>
      <li><span class="step">Moyen.</span> Pour une trempe superficielle : induction en série sur des pièces de révolution, chalumeau pour les grandes pièces ou les pièces unitaires, laser pour une zone étroite et des déformations minimes.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> une tige de vérin en C45, longue d'un mètre, doit résister aux rayures et aux chocs sous son chromage. Acier déjà trempable, pièce de révolution, longue (déformations à limiter), fabriquée en série : trempe par induction au défilé sur 1 à 2 mm, revenu de détente, rectification, puis chromage.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Placer le traitement dans la gamme</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Avant.</span> Usiner à l'outil coupant tant que l'acier est doux (ou seulement amélioré), en laissant une surépaisseur de rectification de quelques dixièmes de millimètre sur les surfaces précises qui seront durcies.</li>
      <li><span class="step">Épargnes.</span> Repérer les zones à garder douces (filetages, zones à usiner ou souder ensuite) et choisir leur protection : dépôt ou pâte, surépaisseur enlevée avant la trempe en cémentation, zone simplement non chauffée en trempe superficielle.</li>
      <li><span class="step">Traiter.</span> Trempe + revenu, trempe superficielle + revenu bas, ou cémentation + trempe + revenu bas.</li>
      <li><span class="step">Après.</span> Rectifier les surfaces précises (la trempe déforme, l'acier durci ne se coupe plus guère), en vérifiant que la surépaisseur reste petite devant la profondeur de couche ; contrôler dureté, profondeur et absence de fissures.</li>
      <li><span class="step">Exception.</span> La nitruration, presque sans déformation, se place en fin de gamme sur une pièce finie.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> pignon arbré en 20MnCr5 avec un filetage en bout. Tournage et taillage de la denture à l'état doux (surépaisseur sur les portées), épargne du filetage, cémentation, trempe, revenu bas, rectification des portées de roulement, contrôle. Usiné après la trempe, le filetage serait inaccessible à l'outil coupant ; cémenté avec le reste, il serait fragile.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Vérifier qu'une pièce est dessinée pour son traitement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Épaisseurs.</span> Repérer les variations brusques de section et les parties très minces à côté de parties massives : rapprocher les épaisseurs, raccorder progressivement.</li>
      <li><span class="step">Arêtes.</span> Remplacer les angles vifs par des congés, casser les arêtes (chanfreins, arrondis).</li>
      <li><span class="step">Trous.</span> Éloigner trous et rainures des bords et des zones durcies, éviter les parois minces ; préférer les trous débouchants.</li>
      <li><span class="step">Symétrie.</span> Équilibrer les masses pour que les déformations se compensent.</li>
      <li><span class="step">Dessin.</span> Vérifier que la zone traitée (trait mixte fort), le traitement, la dureté et la profondeur après rectification sont indiqués.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> une came en C45 trempée par induction sur son profil porte un trou de goupille percé à 2 mm de ce profil. La paroi mince entre le trou et le profil surchauffe et se fissure à la trempe : on éloigne le trou du profil, ou on le place dans une zone qui n'est pas trempée.</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Utiliser une pièce <strong>juste trempée</strong> (sans revenu) → casse fragile.</li>
      <li>Confondre traitement <strong>dans la masse</strong> (trempe/recuit) et <strong>de surface par diffusion</strong> (cémentation).</li>
      <li>Oublier les <strong>déformations</strong> de trempe → prévoir une rectification après.</li>
    </ul>
  </div>
  <div class="notice"><strong>Piège</strong> : proposer une trempe superficielle sur un acier pauvre en carbone (S235, 20MnCr5 non cémenté). Elle n'apporte pas de carbone : la peau ne durcirait presque pas. Il faut alors cémenter, ou choisir un acier à 0,35 à 0,55 % de carbone.</div>
  <div class="notice"><strong>Piège</strong> : rectifier trop profondément une pièce cémentée ou nitrurée. La couche dure ne mesure que quelques dixièmes de millimètre à 2 mm : une surépaisseur trop forte, ou une pièce trop déformée qu'on rattrape à la meule, emporte une partie de la couche utile.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Trempe par induction d'une portée</h3>
  <div class="statement">La portée de roulement d'un arbre en C45 (\(\varnothing\) 40 mm) doit être durcie sur une profondeur d'environ 1,5 mm par trempe par induction. L'atelier dispose de deux générateurs, de fréquences 10 kHz et 200 kHz. Dans un conducteur de résistivité \(\rho\) et de perméabilité \(\mu\), les courants induits à la pulsation \(\omega = 2\pi f\) sont concentrés sur une épaisseur de l'ordre de l'épaisseur de peau
    <div class="formula" data-nom="Épaisseur de peau">$$\delta = \sqrt{\frac{2\rho}{\mu\,\omega}}$$</div>
    Au-delà d'environ 770 °C, l'acier n'est plus magnétique : \(\mu \approx \mu_0 = 4\pi\times10^{-7}\) H/m ; on prendra \(\rho \approx 1{,}2\times10^{-6}\ \Omega\cdot\text{m}\) à chaud.</div>
  <div class="q"><strong>Q1.</strong> Expliquer pourquoi seule la couche superficielle s'échauffe.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\delta\) aux deux fréquences. Quel générateur choisir ?</div>
  <div class="q"><strong>Q3.</strong> Pourquoi cet arbre est-il en C45 plutôt qu'en S235 (acier de construction à 0,2 % de carbone au plus) ? Pourquoi fait-on suivre la trempe d'un revenu bas ?</div>
  <div class="q"><strong>Q4.</strong> Donner deux avantages et un inconvénient de cette solution par rapport à une cémentation de la portée.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'inducteur crée un champ magnétique alternatif qui induit des courants de Foucault dans l'arbre. Par effet de peau, ces courants circulent dans une couche superficielle d'épaisseur voisine de \(\delta\) : c'est là que l'effet Joule dégage la chaleur. Le chauffage dure quelques secondes, trop peu pour que la conduction réchauffe le cœur, qui reste froid.</p>
    <p><strong>Q2.</strong> À 10 kHz :</p>
    <div class="formula">$$\delta = \sqrt{\frac{2\times1{,}2\times10^{-6}}{4\pi\times10^{-7}\times2\pi\times10^{4}}} \approx 5{,}5\times10^{-3}\ \text{m}$$</div>
    <p>soit environ 5,5 mm. \(\delta\) varie comme \(1/\sqrt{f}\) : à 200 kHz, \(\delta \approx 5{,}5/\sqrt{20} \approx 1{,}2\) mm. Pour durcir environ 1,5 mm, on choisit le générateur à <strong>200 kHz</strong> (la conduction pendant le chauffage épaissit un peu la couche chauffée). À 10 kHz, on chaufferait plus de 5 mm dans un arbre de 20 mm de rayon : beaucoup plus d'énergie, de déformations, et un cœur qui ne resterait plus tenace.</p>
    <p><strong>Q3.</strong> La trempe superficielle n'apporte pas de carbone : seule une peau assez riche en carbone durcit par trempe. Le C45 (0,45 %) durcit fortement, le S235 presque pas. Le revenu bas (vers 150 à 200 °C) relâche les contraintes de trempe et réduit la fragilité de la couche sans lui faire perdre sa dureté.</p>
    <p><strong>Q4.</strong> Avantages : traitement localisé à la seule portée, très rapide et automatisable pièce à pièce (pas de long cycle au four), moins de déformations, acier courant. Inconvénients possibles : couche un peu moins dure qu'une couche cémentée, et la zone de transition entre partie trempée et partie douce doit être placée loin des zones les plus sollicitées (épaulements, gorges).</p>
  </div>
</div>

<div class="exo">

  <div class="statement">Un axe de pivot en 16MnCr5 doit être cémenté, trempé et revenu sur ses deux portées de \(\varnothing\) 20 mm : dureté 58 à 62 HRC, profondeur de couche 0,6 à 0,9 mm après finition. Le dessin d'un stagiaire présente : un épaulement à angle vif entre la partie centrale \(\varnothing\) 30 mm et les portées ; un filetage M12 en bout d'axe ; un trou de graissage \(\varnothing\) 4 mm qui débouche sur une portée, à 1,5 mm de son bord ; aucune surépaisseur prévue sur les portées ; la seule mention « cémenté ».</div>
  <div class="q"><strong>Q1.</strong> Relever les défauts de ce dessin et proposer une correction pour chacun.</div>
  <div class="q"><strong>Q2.</strong> Comment éviter que le filetage soit durci ? Donner deux solutions.</div>
  <div class="q"><strong>Q3.</strong> Proposer l'ordre des opérations, du brut au contrôle.</div>
  <div class="q"><strong>Q4.</strong> On prévoit une surépaisseur de rectification de 0,3 mm au diamètre sur les portées. Quelle profondeur de cémentation faut-il demander au traitement pour garantir 0,6 à 0,9 mm après rectification ? Quelle précaution prendre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Angle vif à l'épaulement : concentration des contraintes de trempe, amorce de tapure et de rupture en fatigue → <strong>congé de raccordement</strong>. Trou de graissage trop près du bord de la portée : paroi mince qui chauffe et refroidit différemment, risque de fissure → l'<strong>éloigner du bord</strong> et chanfreiner son débouché. Pas de surépaisseur : la trempe déforme l'axe et les portées ne seraient plus à leurs cotes → prévoir une <strong>surépaisseur de rectification</strong>. Mention incomplète : préciser la <strong>zone traitée</strong> (trait mixte fort), la <strong>dureté</strong> et la <strong>profondeur après rectification</strong>, par exemple « cémenté, trempé et revenu, 58 à 62 HRC, profondeur 0,6 à 0,9 mm à 550 HV ».</p>
    <p><strong>Q2.</strong> Un filetage durci serait fragile et ne pourrait plus être repris. (a) <strong>Épargne</strong> par dépôt de cuivre ou pâte isolante sur l'extrémité avant la cémentation. (b) Laisser une <strong>surépaisseur</strong> sur l'extrémité, l'usiner après la cémentation et avant la trempe (la couche enrichie part avec les copeaux), puis fileter cette partie restée pauvre en carbone.</p>

    <p><strong>Q4.</strong> 0,3 mm au diamètre, c'est 0,15 mm au rayon : la rectification enlève 0,15 mm de couche. Il faut donc demander une profondeur de 0,75 à 1,05 mm au traitement, par exemple 0,8 à 1,0 mm. Précaution : la trempe déforme l'axe (faux-rond), et la meule enlève alors davantage d'un côté que de l'autre ; il faut limiter les déformations (pièce symétrique, trempe suspendue) et garder la surépaisseur petite devant la profondeur de couche.</p>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Gamme de traitement d'un pignon</h3>
  <div class="exo-source">
    Exercice <strong>original</strong>, calibré sur le format des épreuves PT (matériaux / traitements). Pour t'entraîner sur les sujets réels :

  <div class="statement">
    Un <strong>pignon</strong> d'une transmission de puissance, en acier, doit présenter une <strong>denture très dure</strong> (usure, pression de contact) mais un <strong>cœur tenace</strong> (chocs, fatigue). On propose la gamme : usinage de la denture → cémentation → trempe → revenu basse température → rectification.

  <p class="exo-part">Partie A — Justification de la gamme</p>
  <div class="q"><strong>A1.</strong> Pourquoi usine-t-on la denture <em>avant</em> les traitements thermiques ?</div>
  <div class="q"><strong>A2.</strong> Quel est le rôle de la cémentation, puis de la trempe ?</div>
  <div class="q"><strong>A3.</strong> Pourquoi un revenu, et pourquoi à <em>basse</em> température ici ?</div>

  <p class="exo-part">Partie B — Conséquences</p>
  <div class="q"><strong>B1.</strong> Pourquoi terminer par une rectification ?</div>
  <div class="q"><strong>B2.</strong> Que se passerait-il si l'on utilisait le pignon juste après la trempe (sans revenu) ?</div>

  <p class="exo-part">Partie C — Propriétés visées</p>
  <div class="q"><strong>C1.</strong> Résumer le profil de propriétés obtenu (surface vs cœur) et son intérêt fonctionnel.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> L'acier est encore <strong>doux</strong> avant durcissement : l'usinage de la denture est facile et économique. Usiner après durcissement serait très difficile (outils, usure) — on ne fait plus que de la rectification.</p>

    <p><strong>A3.</strong> Le <strong>revenu</strong> relâche les contraintes de trempe et réduit la fragilité ; on le fait à <strong>basse température</strong> pour <strong>conserver une dureté élevée</strong> en surface (un revenu trop chaud adoucirait trop la denture).</p>
    <p><strong>B1.</strong> La trempe déforme légèrement la pièce et dégrade l'état de surface ; la <strong>rectification</strong> finale rétablit les cotes précises et le bel état de surface de la denture (Ra faible).</p>
    <p><strong>B2.</strong> Juste trempé, le pignon serait <strong>très fragile</strong> et fortement contraint : risque de rupture brutale et de tapures (fissures de trempe), surtout sous chocs.</p>
    <p><strong>C1.</strong> On obtient une <strong>peau dure</strong> (résistante à l'usure et à la pression de contact) sur un <strong>cœur tenace</strong> (résistant aux chocs et à la fatigue) : exactement le profil recherché pour une denture d'engrenage chargée.</p>
