  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre décrit le maillon <strong>acquérir</strong> de la chaîne d'information : ce que mesure un capteur, sous quelle forme il rend l'information, avec quelle qualité, et comment la carte de commande la numérise. Il fournit les critères pour justifier le choix d'un capteur. La façon dont l'information circule ensuite entre les constituants est l'objet de « Réseaux de communication ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Identifier les erreurs de mesure</strong> : incertitudes, résolution, quantification, échantillonnage, justesse, fidélité, linéarité et sensibilité (D3, S2) (§3, §5, §8).</li>

<div class="course-section">
  <div class="sec-num">§1 · CHAÎNE DE MESURE ET CAPTEURS</div>
  <h2>Rôle, classification, caractéristiques</h2>
  <div class="intro">Les capteurs sont les « organes sensoriels » des systèmes automatisés. Ils convertissent une grandeur physique en un signal exploitable (électrique le plus souvent). Leur connaissance est indispensable en SI pour analyser les systèmes réels.</div>
  <h3>Chaîne de mesure</h3>
  <div class="def-box">
    La <strong>chaîne de mesure</strong> comprend : capteur (transduction) → conditionneur (mise en forme du signal) → convertisseur analogique-numérique → traitement numérique.
    Un <strong>capteur</strong> est caractérisé par : sa <em>sensibilité</em>, sa <em>résolution</em>, son <em>étendue de mesure</em>, sa <em>précision</em> et sa <em>bande passante</em> (§3).
  </div>
  <div class="def-box"><strong>Capteur, mesurande, détecteur.</strong> Un capteur prélève une information sur une grandeur physique, le <strong>mesurande</strong>, et la convertit en un signal exploitable par la partie commande. Il comprend souvent un <strong>corps d'épreuve</strong>, qui transforme le mesurande en une grandeur intermédiaire (une force déforme une poutre, une pression déforme une membrane), et un <strong>transducteur</strong>, qui convertit cette grandeur en grandeur électrique. Un <strong>détecteur</strong> ne rend qu'une information logique : présence ou absence, seuil franchi ou non.</div>
  <p>Dans la chaîne d'information, les capteurs réalisent la fonction <strong>acquérir</strong>, avant traiter et communiquer. Dans un système asservi, le capteur forme la <strong>chaîne de retour</strong> : il mesure la sortie pour la comparer à la consigne ; sa sensibilité y apparaît comme le gain du capteur (« SLCI : modélisation et transformée de Laplace »), et l'asservissement ne peut pas être plus précis que la mesure sur laquelle il s'appuie.</p>
  <h3>Nature des grandeurs d'entrée et de sortie</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th>Grandeur mesurée (entrée)</th><th>Exemple de capteur</th><th>Grandeur de sortie</th></tr>
    <tr><td>présence d'un objet</td><td>détecteur inductif, fin de course</td><td>état logique</td></tr>
    <tr><td>position, déplacement</td><td>potentiomètre</td><td>résistance, puis tension</td></tr>
    <tr><td>angle</td><td>codeur optique</td><td>impulsions ou mot binaire</td></tr>
    <tr><td>vitesse de rotation</td><td>génératrice tachymétrique</td><td>tension</td></tr>
    <tr><td>effort, pression</td><td>jauges de déformation en pont</td><td>tension de quelques mV</td></tr>
    <tr><td>accélération</td><td>accéléromètre piézoélectrique</td><td>charge électrique</td></tr>
    <tr><td>température</td><td>thermocouple, sonde à résistance</td><td>tension (µV), résistance</td></tr>
    <tr><td>distance</td><td>capteur à ultrasons</td><td>durée (temps de vol)</td></tr>
  </table></div>
  <p><strong>Capteur actif ou passif.</strong> Un capteur <strong>actif</strong> produit lui-même un signal électrique à partir de l'énergie prélevée sur le mesurande (thermocouple, génératrice tachymétrique, cristal piézoélectrique). Un capteur <strong>passif</strong> est une impédance (résistance, capacité, inductance) qui varie avec le mesurande : il faut l'alimenter, et un conditionneur traduit la variation en tension (potentiomètre, jauge de déformation, sonde à résistance).</p>
</div>

  <div class="def-box">
    <ul style="margin:.2rem 0">
      <li><strong>Signal logique</strong> (tout ou rien) : deux états seulement, par exemple 0 V et 24 V en milieu industriel, 0 V et 3,3 V sur une carte. Il dit si un seuil est franchi (fin de course atteint, objet présent). Il est lu par une entrée logique.</li>
      <li><strong>Signal analogique</strong> : tension ou courant qui varie continûment, image du mesurande (0–10 V, ±10 V, 4–20 mA). Il est lu par une entrée analogique, donc converti en nombre par un CAN (§8).</li>
      <li><strong>Signal numérique</strong> : la mesure est codée en binaire par l'électronique du capteur, puis transmise sous forme de mots sur une liaison série ou un bus, ou sous forme d'impulsions à compter (codeur incrémental, §5). Il reste exact tant que les deux niveaux électriques restent distincts malgré le bruit.</li>
    </ul>
  </div>
  <p><strong>Support de l'information.</strong> L'information circule le plus souvent sous forme électrique dans un câble (tension, courant) ; elle peut aussi être portée par la lumière dans une fibre optique, insensible aux perturbations électromagnétiques, ou par une onde radio (capteur sans fil). Supports et protocoles sont détaillés dans « Réseaux de communication ».</p>
  <h3>Conditionnement</h3>
  <p>Le <strong>conditionneur</strong> transforme la sortie brute du capteur en un signal adapté à l'entrée de la carte :</p>
  <ul>
    <li>convertir une variation d'impédance en tension : pont diviseur, pont de Wheatstone (§7) ;</li>
    <li>amplifier un signal faible (quelques millivolts) et le décaler pour qu'il couvre toute la plage d'entrée ;</li>
    <li>filtrer le bruit, et les fréquences trop élevées avant l'échantillonnage (§8) ;</li>
    <li>convertir un courant en tension, isoler électriquement, protéger l'entrée.</li>
  </ul>
  <div class="prop-box"><strong>Boucle de courant 4–20 mA.</strong> Le capteur impose un courant qui varie de 4 mA (début de l'étendue de mesure) à 20 mA (fin de l'étendue). Ce courant est le même en tout point de la boucle : la résistance des câbles n'altère pas la mesure, même sur des centaines de mètres. Le zéro décalé à 4 mA permet de détecter une coupure (0 mA est impossible en fonctionnement normal). À l'arrivée, une résistance de mesure \(R\) convertit le courant en tension \(U = R\,I\).
    <div class="formula" data-nom="Capteur 4–20 mA">$$I = 4 + 16\,\frac{m - m_{min}}{m_{max} - m_{min}} \quad (\text{mA})$$</div>
  </div>
  <div class="method-box"><strong>Exemple — Capteur de pression 4–20 mA</strong>
    <p>Un capteur de pression 0–6 bar à sortie 4–20 mA est lu sur une entrée analogique 0–3,3 V.</p>
    <ol>
      <li><span class="step">Loi.</span> \(p = 6\,(I-4)/16\) (en bar, \(I\) en mA) ; pour \(I = 13{,}6\ \text{mA}\), \(p = 3{,}6\ \text{bar}\).</li>
      <li><span class="step">Résistance de mesure.</span> \(R = 3{,}3\ \text{V}/20\ \text{mA} = 165\ \Omega\) : la tension va de 0,66 V (0 bar) à 3,30 V (6 bar).</li>
      <li><span class="step">Défaut.</span> Une tension nettement inférieure à 0,66 V signale un câble coupé ou un capteur hors service, et non une pression nulle.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CARACTÉRISTIQUES MÉTROLOGIQUES</div>
  <h2>Étendue, sensibilité, linéarité, justesse, fidélité, rapidité</h2>
  <div class="intro">Un capteur réel n'est ni parfait ni instantané. Ses caractéristiques, lues dans sa documentation, disent dans quel domaine et avec quelle confiance on peut utiliser sa mesure : ce sont elles que l'on compare au cahier des charges.</div>
  <h3>Caractéristique statique</h3>
  <p>En régime permanent, la sortie \(s\) est reliée au mesurande \(m\) par la <strong>caractéristique statique</strong> \(s = F(m)\), relevée par <strong>étalonnage</strong> : on applique des valeurs connues du mesurande (étalons) et l'on note la sortie.</p>

  <div class="def-box">
    <ul style="margin:.2rem 0">
      <li><strong>Étendue de mesure</strong> (EM) : plage de fonctionnement, c'est-à-dire l'intervalle des valeurs du mesurande où les caractéristiques annoncées sont garanties. Au-delà, la sortie sature, voire le capteur est détruit.</li>
      <li><strong>Sensibilité</strong> \(S = \Delta s/\Delta m\) (variation de sortie / variation de mesurande) : pente de la caractéristique. Unité : V/°C, V/Pa, mV/N, etc. Pour un capteur linéaire, \(S\) est constante et \(s = s_0 + S\,m\).</li>
      <li><strong>Linéarité</strong> : plus grand écart entre la caractéristique réelle et une droite de référence, exprimé en % de l'EM. Un capteur linéaire s'exploite par une simple règle de proportionnalité.</li>
      <li><strong>Résolution</strong> : plus petite variation du mesurande détectable, c'est-à-dire qui modifie la sortie de façon perceptible. Elle dépend du capteur et de la chaîne qui le lit (quantum du CAN, §8 ; nombre de points d'un codeur, §5).</li>
    </ul>
  </div>
  <h3>Justesse, fidélité, précision</h3>
  <p>Répétons plusieurs fois la mesure d'une même grandeur dont la valeur vraie est connue (un étalon). Les résultats se dispersent autour d'une moyenne qui n'est pas forcément la valeur vraie : on distingue deux sortes d'erreurs.</p>
  <div class="def-box">
    <ul style="margin:.2rem 0">
      <li><strong>Justesse</strong> : aptitude à donner une <em>moyenne</em> de mesures répétées proche de la valeur vraie. L'écart entre cette moyenne et la valeur vraie, le <strong>biais</strong>, est une erreur <strong>systématique</strong> (décalage du zéro, sensibilité mal réglée, effet de la température…) : il se corrige par étalonnage.</li>
      <li><strong>Fidélité</strong> (répétabilité) : aptitude à donner des mesures proches les unes des autres quand on répète la mesure dans les mêmes conditions. La dispersion, chiffrée par l'écart-type, est une erreur <strong>aléatoire</strong> (bruit, frottements, jeux) ; on la réduit en moyennant plusieurs mesures.</li>
      <li><strong>Précision</strong> (exactitude) : aptitude à donner un résultat proche de la valeur vraie ; un capteur précis est à la fois juste et fidèle. Les documentations l'annoncent comme une erreur maximale, en ± % de l'EM ou de la valeur lue.</li>
    </ul>
  </div>

  <p><strong>Incertitude.</strong> Une mesure ne vaut qu'accompagnée de son incertitude : on écrit \(m = m_{lu} \pm U\). On l'estime à partir des caractéristiques du capteur (précision annoncée, résolution) et de la dispersion des mesures répétées ; le programme n'en demande pas le calcul détaillé.</p>
  <div class="method-box"><strong>Exemple — Contrôle d'un capteur de déplacement sur une cale étalon</strong>
    <p>Six mesures d'une cale étalon de 20,000 mm donnent : 20,06 ; 20,04 ; 20,07 ; 20,05 ; 20,06 ; 20,04 mm.</p>
    <ol>
      <li><span class="step">Justesse.</span> Moyenne : 20,053 mm, soit un biais de +0,053 mm : tel quel, le capteur n'est pas juste à mieux que 0,05 mm près.</li>
      <li><span class="step">Fidélité.</span> Écart-type : 0,012 mm environ, toutes les mesures tenant dans 0,03 mm : le capteur est fidèle.</li>
      <li><span class="step">Correction.</span> Le biais est systématique : on le retranche (réglage du zéro). Il reste la dispersion, de l'ordre de ±0,02 mm (deux écarts-types).</li>
    </ol>
  </div>
  <h3>Rapidité</h3>
  <p>Le capteur ne suit pas instantanément le mesurande. Sa rapidité se caractérise par :</p>
  <div class="def-box">
    <ul style="margin:.2rem 0">
      <li><strong>Temps de réponse</strong> : délai pour que la sortie atteigne (et reste à ±5 % près) sa valeur finale après un échelon du mesurande ; on parle aussi du temps pour atteindre 90 % ou 95 % de la valeur finale.</li>
      <li><strong>Bande passante</strong> : plage de fréquences du mesurande que le capteur restitue sans trop l'atténuer, jusqu'à sa fréquence de coupure à −3 dB.</li>
    </ul>
  </div>
  <p>Un capteur se modélise souvent par un système du premier ordre de constante de temps \(\tau\) : \(t_{5\%} \approx 3\tau\) et \(f_c = 1/(2\pi\tau)\) (« Systèmes du 1er ordre »). Une sonde de température gainée de \(\tau = 2\ \text{s}\) répond en 6 s environ et ne suit que des variations plus lentes que \(f_c \approx 0{,}08\ \text{Hz}\). Enfin, un bon capteur ne perturbe pas ce qu'il mesure (masse d'un accéléromètre collé sur une pièce légère, chaleur d'une sonde dans un petit volume) : c'est sa <strong>finesse</strong>.</p>
  <div class="notice"><strong>Erreur classique</strong> : confondre résolution et précision. Un afficheur à quatre décimales peut donner une mesure fausse au centième ; inversement, un capteur juste lu par un CAN de 8 bits a une résolution grossière. La résolution dit ce que l'on distingue, la précision ce que l'on peut croire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CAPTEURS DE POSITION ET DÉPLACEMENT</div>
  <h2>Potentiomètres, codeurs, LVDT, ultrasons</h2>
  <div class="def-box">
    <strong>Détecteurs de présence</strong> (tout ou rien) : interrupteur de fin de course (contact mécanique), détecteur inductif (pièce métallique à quelques millimètres, sans contact), capacitif (tout matériau), photoélectrique (faisceau coupé ou renvoyé, portée de plusieurs mètres).
    <strong>Potentiomètre</strong> : résistance variable proportionnelle au déplacement ; monté en diviseur de tension sous \(U_0\), il délivre \(u = U_0\,x/L\) pour une course \(L\). Simple, peu coûteux, mais frottement et usure.
    <strong>Codeur (encodeur) incrémental</strong> : génère des impulsions à chaque incrément angulaire. Résolution : \(360°/N\) pour \(N\) traits par tour, jusqu'à quatre fois mieux en comptant tous les fronts (§5). Avantages : précis, sans contact. Inconvénient : il ne donne qu'un déplacement relatif, à initialiser par une prise d'origine.
    <strong>Codeur (encodeur) absolu</strong> : code binaire (Gray) indiquant la position absolue — conserve la position lors d'une coupure de courant (§5).
    <strong>LVDT</strong> (Linear Variable Differential Transformer) : transformateur différentiel. Mesure de déplacement sans contact, très précis (\(\mu\text{m}\)).
    <strong>Capteur ultrasonique</strong> : mesure de distance par temps de vol \(d=ct/2\) (\(c\approx340\ \text{m/s}\) dans l'air). La célérité varie d'environ 0,17 % par degré : il faut corriger la température.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CODEURS INCRÉMENTAUX ET ABSOLUS</div>
  <h2>Mesurer un angle avec une sortie numérique</h2>
  <div class="intro">Les codeurs optiques ou magnétiques mesurent une position angulaire (ou linéaire, pour les règles) avec une sortie directement numérique. Ils équipent la plupart des axes asservis : moteurs, robots, machines-outils.</div>
  <h3>Codeur incrémental</h3>
  <p>Un disque porte \(N\) fentes régulièrement réparties (\(N\) points, ou traits, par tour) ; une cellule optique délivre une impulsion à chaque fente qui passe. Deux cellules décalées d'un quart de période (le quart de l'intervalle entre deux fentes) fournissent deux voies \(A\) et \(B\) en quadrature ; une troisième voie \(Z\) (top zéro) donne une impulsion par tour.</p>

  <div class="prop-box">
    <ul style="margin:.2rem 0">
      <li><strong>Résolution</strong> : \(\Delta\theta = 360°/N\) en comptant les périodes de \(A\) ; \(\Delta\theta = 360°/4N\) en comptant les fronts montants et descendants de \(A\) et de \(B\).</li>
      <li><strong>Sens de rotation</strong> : selon que \(B\) est en retard ou en avance sur \(A\), le compteur ajoute ou retranche les incréments.</li>
      <li><strong>Mesure relative</strong> : le compteur part de zéro à la mise sous tension. Une prise d'origine (déplacement jusqu'à un capteur de référence, puis jusqu'au top \(Z\)) est nécessaire, et une impulsion perdue décale la mesure jusqu'à la prise d'origine suivante.</li>
    </ul>
  </div>
  <p><strong>Vitesse.</strong> On compte les incréments pendant une durée fixe \(T\) (méthode adaptée aux vitesses élevées), ou l'on mesure la durée entre deux incréments (vitesses faibles). Avec \(N_i\) incréments par tour et \(n\) incréments comptés pendant \(T\) :</p>
  <div class="formula" data-nom="Vitesse mesurée par un codeur incrémental">$$\omega = \frac{2\pi\,n}{N_i\,T}, \qquad \Delta\omega = \frac{2\pi}{N_i\,T}\ \text{(résolution : un incrément de plus ou de moins)}$$</div>
  <div class="method-box"><strong>Exemple — Codeur de 500 points</strong>
    <p>En comptant les quatre fronts, \(N_i = 4\times500 = 2\,000\) incréments par tour : résolution de 0,18°. À 1 200 tr/min (20 tr/s), un comptage de \(T = 5\ \text{ms}\) donne \(n = 2\,000\times20\times0{,}005 = 200\) incréments. Un incrément de plus ou de moins correspond à \(1/(2\,000\times0{,}005) = 0{,}1\ \text{tr/s}\), soit une résolution en vitesse de 6 tr/min.</p>
  </div>
  <h3>Codeur absolu</h3>
  <p>Le disque porte \(n\) pistes concentriques lues en même temps par \(n\) capteurs : chaque position angulaire correspond à un mot de \(n\) bits, unique sur le tour. La position est connue dès la mise sous tension, sans prise d'origine, et une perturbation passagère ne la décale pas durablement.</p>
  <div class="formula" data-nom="Résolution d'un codeur absolu">$$2^n \text{ positions par tour} \qquad \Delta\theta = \frac{360°}{2^n}$$</div>

  <h3>Le code Gray</h3>
  <p>En binaire naturel, passer de 3 (011) à 4 (100) change les trois bits à la fois. Or les capteurs d'un codeur réel ne basculent jamais exactement au même instant : pendant la transition, la tête peut lire un mot intermédiaire quelconque (111 = 7, 000 = 0…), c'est-à-dire une position aberrante. Le <strong>code Gray</strong> (binaire réfléchi) est construit pour qu'entre deux positions voisines, <strong>un seul bit change</strong> : une lecture pendant la transition donne l'une ou l'autre des deux positions voisines, jamais une position éloignée.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
    <tr><th style="text-align:left">Position</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr>
    <tr><td style="text-align:left">Binaire naturel</td><td>000</td><td>001</td><td>010</td><td>011</td><td>100</td><td>101</td><td>110</td><td>111</td></tr>
    <tr><td style="text-align:left">Code Gray</td><td>000</td><td>001</td><td>011</td><td>010</td><td>110</td><td>111</td><td>101</td><td>100</td></tr>
  </table></div>
  <div class="prop-box"><strong>Conversions</strong> (\(\oplus\) : ou exclusif, bits numérotés de \(n-1\), poids fort, à 0). Du binaire au Gray : \(g_{n-1} = b_{n-1}\), puis \(g_i = b_{i+1} \oplus b_i\). Du Gray au binaire, en partant du poids fort : \(b_{n-1} = g_{n-1}\), puis \(b_i = b_{i+1} \oplus g_i\).</div>
  <div class="method-box"><strong>Exemple — Lire un codeur absolu à 4 pistes</strong>
    <p>Le codeur délivre le mot Gray 1101. \(b_3 = 1\) ; \(b_2 = 1 \oplus 1 = 0\) ; \(b_1 = 0 \oplus 0 = 0\) ; \(b_0 = 0 \oplus 1 = 1\) : en binaire 1001, soit la position 9 sur 16. Chaque position couvre \(360°/16 = 22{,}5°\) : l'arbre est entre 202,5° et 225°.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier qu'un codeur monté sur le moteur mesure la position du moteur, pas celle de la charge. Le jeu et l'élasticité de la transmission, les erreurs de pas d'une vis échappent à la mesure ; pour une position de charge précise, on la mesure directement (règle linéaire).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · CAPTEURS DE VITESSE ET ACCÉLÉRATION</div>
  <h2>Tachymètre, accéléromètre</h2>
  <div class="def-box">
    <strong>Dynamo tachymétrique</strong> : génère une tension proportionnelle à la vitesse de rotation : \(u=K_t\omega\) (quelques volts pour 1 000 tr/min). Simple et robuste ; capteur actif.
    <strong>Codeur</strong> : la vitesse s'obtient numériquement à partir de la position, en comptant les incréments pendant une durée fixe ou en mesurant la durée entre deux incréments (§5).
    <strong>Accéléromètre piézoélectrique</strong> : une masse comprime un cristal piézo. \(F=ma\) → charge électrique proportionnelle à l'accélération. Bande passante large (jusqu'à plusieurs kHz), mais il ne mesure pas une accélération constante : la charge produite s'écoule.
    <strong>MEMS</strong> (Micro Electro Mechanical System) : accéléromètres/gyroscopes miniatures (smartphones, drones). Masse sismique suspendue mesurée par capacité variable ; le gyromètre mesure une vitesse angulaire.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CAPTEURS D'EFFORT, DE PRESSION ET DE TEMPÉRATURE</div>
  <h2>Jauges de contrainte, capteurs piézorésistifs, sondes</h2>
  <div class="def-box">
    <strong>Jauge de contrainte</strong> (strain gauge) : résistance \(R\) qui varie avec la déformation \(\varepsilon\) : \(\Delta R/R = G_f\varepsilon\) où \(G_f\approx2\) est le facteur de jauge. Montée en pont de Wheatstone pour amplifier le signal et compenser la température.
    <strong>Pont de Wheatstone</strong> : 4 résistances dont une ou plusieurs sont des jauges. La tension de sortie en déséquilibre (une seule jauge active, quart de pont) : \(U_s\approx(G_f\varepsilon/4)U_{alim}\).
    <strong>Capteur de pression</strong> : membrane déformable + jauge. Pressions de quelques Pa à plusieurs MPa selon les applications.
  </div>
  <p>Le signal du capteur (souvent quelques mV) est amplifié par un <strong>amplificateur d'instrumentation</strong> (gain élevé, très haute impédance d'entrée), qui amplifie la différence des deux tensions du pont et rejette la tension commune.</p>
  <h3>Capteurs de température</h3>
  <div class="def-box">
    <strong>Thermocouple</strong> : jonction de deux métaux différents ; capteur actif qui délivre une tension de quelques dizaines de µV par °C (environ 41 µV/°C pour le type K), fonction de l'écart de température entre la soudure chaude et la soudure froide. Très grande étendue (au-delà de 1 000 °C), faible sensibilité : à amplifier.
    <strong>Sonde à résistance de platine</strong> (Pt100) : \(R = R_0\,(1 + a\,T)\) avec \(R_0 = 100\ \Omega\) à 0 °C et \(a \approx 3{,}85\times10^{-3}\ \text{°C}^{-1}\). Passive, précise et presque linéaire.
    <strong>Thermistance</strong> (CTN) : résistance qui diminue fortement quand la température augmente. Très sensible et peu coûteuse, mais non linéaire.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CONVERSION ANALOGIQUE-NUMÉRIQUE</div>
  <h2>Quantification, échantillonnage, mémoire</h2>
  <div class="intro">Une entrée analogique de carte de commande <strong>échantillonne</strong> la tension (elle la mesure à intervalles réguliers) et la <strong>quantifie</strong> (elle l'arrondit à l'un des \(2^n\) niveaux d'un convertisseur de \(n\) bits). Ces deux opérations fixent la résolution et la fréquence des mesures, et la mémoire nécessaire pour les enregistrer.</div>
  <h3>Quantification</h3>
  <div class="def-box"><strong>Quantum.</strong> Un CAN (convertisseur analogique-numérique) de \(n\) bits, de pleine échelle \(E\) (souvent sa tension de référence \(U_{ref}\)), fournit un code entier \(N\) compris entre 0 et \(2^n - 1\). Le <strong>quantum</strong> \(q\) est la plus petite variation de tension qu'il distingue :
    <div class="formula" data-nom="Quantum d'un CAN">$$q = \frac{E}{2^n}$$</div>
  </div>
  <p>Pour \(n=12\) bits et \(U_{ref}=3{,}3\ \text{V}\) : résolution de 0,8 mV. L'<strong>erreur de quantification</strong>, écart entre la valeur codée \(Nq\) et la tension réelle, ne dépasse pas \(q/2\) en valeur absolue pour un convertisseur qui arrondit (\(q\) pour un convertisseur qui tronque).</p>

  <div class="prop-box"><strong>Résolution ramenée au mesurande.</strong> Si \(S\) est la sensibilité globale du capteur et de son conditionnement (en volts par unité de mesurande), la chaîne distingue
    <div class="formula" data-nom="Résolution d'une chaîne d'acquisition">$$\Delta m = \frac{q}{S} = \frac{E}{2^n\,S}$$</div>
    Pour l'affiner : plus de bits, ou un conditionnement qui étale le signal utile sur toute la pleine échelle du CAN.</div>
  <div class="method-box"><strong>Exemple — Résolution d'une mesure d'effort</strong>
    <p>Un capteur d'effort 0–2 000 N, conditionné en 0–5 V (\(S = 2{,}5\ \text{mV/N}\)), est lu par un CAN 0–5 V. Avec 10 bits, \(q = 5/1\,024 \approx 4{,}9\ \text{mV}\), soit \(\Delta m \approx 2\ \text{N}\) ; avec 12 bits, 0,5 N. Si le conditionnement ne délivrait que 0–1 V, seul un cinquième des codes servirait : résolution cinq fois plus grossière, comme si l'on perdait plus de deux bits.</p>
  </div>
  <h3>Échantillonnage</h3>
  <p>La carte mesure la tension toutes les \(T_e\) (fréquence d'échantillonnage \(f_e = 1/T_e\)). Pour que les échantillons représentent fidèlement un signal dont la plus haute fréquence utile vaut \(f_{max}\), il faut \(f_e \gt 2 f_{max}\) (critère de Shannon) ; en pratique, on prend \(f_e\) de 5 à 10 fois \(f_{max}\). Un filtre passe-bas placé avant le CAN (filtre anti-repliement) élimine les fréquences supérieures à \(f_e/2\), qui se replieraient sinon en fausses basses fréquences. Approfondissement : « Systèmes numériques » (2ᵉ année).</p>
  <h3>Mémoire</h3>
  <div class="prop-box"><strong>Mémoire nécessaire.</strong> Chaque mesure de \(n\) bits occupe en pratique un nombre entier d'octets (2 octets de 9 à 16 bits). Enregistrer \(k\) voies échantillonnées à \(f_e\) pendant une durée \(D\) demande
    <div class="formula" data-nom="Mémoire d'un enregistrement">$$\text{mémoire} = k \times f_e \times D \times (\text{octets par mesure})$$</div>
  </div>
  <p>Quatre voies échantillonnées à 2 kHz pendant 10 s, sur 12 bits rangés dans 2 octets : \(4\times2\,000\times10\times2 = 160\,000\) octets, soit 160 ko. Si la carte n'a pas cette place, on réduit \(f_e\) (dans la limite de Shannon), la durée, ou l'on transmet les mesures au fil de l'eau.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'un CAN de 16 bits rend une mesure précise. Le CAN ne fait que découper finement le signal qu'on lui donne : un capteur peu juste ou bruité le reste. Inversement, quelques bits suffisent pour un mesurande lent et une tolérance large.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · CHOISIR UN CAPTEUR</div>
  <h2>Du cahier des charges à la référence</h2>
  <div class="intro">Choisir un capteur, c'est traduire le cahier des charges en exigences sur la mesure, puis comparer des technologies et des références de catalogue. La démarche suivante évite d'oublier un critère éliminatoire.</div>
  <div class="method-box"><strong>Démarche de choix</strong>
    <ol>
      <li><span class="step">Grandeur et usage.</span> Quelle grandeur (position, vitesse, effort…) et pour quoi faire : détecter un seuil (tout ou rien) ou mesurer ; mesure absolue dès la mise sous tension, ou relative avec prise d'origine ; mesure directe sur la charge ou indirecte (sur le moteur).</li>
      <li><span class="step">Étendue de mesure.</span> Couvrir toute la plage utile avec une marge (surcharges, chocs), sans surdimensionner : la précision est souvent donnée en % de l'EM.</li>
      <li><span class="step">Précision et résolution.</span> Précision annoncée meilleure que la tolérance du cahier des charges ; résolution de la chaîne (capteur et CAN) de 4 à 10 fois plus fine que cette tolérance.</li>
      <li><span class="step">Rapidité.</span> Bande passante de 5 à 10 fois supérieure à la plus haute fréquence du phénomène (ou temps de réponse bien plus court que la durée de ses variations).</li>
      <li><span class="step">Environnement et mise en œuvre.</span> Contact ou non (usure, frottement ajouté), température, poussières, eau, vibrations, perturbations électromagnétiques ; encombrement et fixation.</li>
      <li><span class="step">Interface.</span> Signal compatible avec la carte (logique, analogique 0–10 V ou 4–20 mA, numérique), alimentation, distance de transmission.</li>
      <li><span class="step">Coût.</span> Prix, disponibilité, maintenance.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — Mesurer la position d'un chariot</strong>
    <p>Un chariot parcourt 800 mm et doit être positionné à ±0,5 mm. Sa position doit être connue dès la mise sous tension (une prise d'origine risquerait une collision) ; l'atelier est poussiéreux ; la carte offre une entrée numérique et une entrée analogique 0–10 V de 12 bits.</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
      <tr><th>Candidat</th><th>Absolu</th><th>Précision</th><th>Résolution</th><th>Environnement</th><th>Verdict</th></tr>
      <tr><td>Potentiomètre linéaire de 900 mm, linéarité ±0,1 % EM</td><td>oui</td><td>±0,9 mm : non</td><td>900/4 096 ≈ 0,22 mm</td><td>contact, usure, poussière</td><td>écarté</td></tr>
      <tr><td>Capteur à ultrasons</td><td>oui</td><td>±1 mm, dérive avec la température : non</td><td>≈ 0,2 mm</td><td>sans contact</td><td>écarté</td></tr>
      <tr><td>Codeur incrémental sur le moteur</td><td>non</td><td>dépend de la transmission</td><td>très fine</td><td>sans contact</td><td>écarté</td></tr>
      <tr><td>Règle magnétique absolue</td><td>oui</td><td>±0,02 mm</td><td>0,005 mm</td><td>sans contact, peu sensible aux poussières</td><td>retenue</td></tr>
    </table></div>
    <p>Seule la règle absolue satisfait toutes les exigences ; plus chère, elle mesure directement la position du chariot. Remarque : la résolution du potentiomètre suffisait, c'est sa linéarité, donc sa justesse, qui l'élimine.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : choisir sur la seule résolution, ou sur l'étendue sans marge. Autres oublis fréquents : l'interface (un capteur 0–10 V branché sur une entrée 0–3,3 V sature au tiers de sa course), l'environnement, et la prise d'origine qu'exige un capteur incrémental.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="cap-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CAPTEURS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à choisir un capteur, à exploiter son signal (pont, 4–20 mA, codeur), à chiffrer la résolution d'une chaîne d'acquisition et à juger la qualité d'une série de mesures.</div>
  <div class="method-box"><strong>Méthode 1 — Choisir un capteur adapté</strong>
    <ol>
      <li>Identifier le mesurande (position, vitesse, force, température…) et l'usage : détecter un seuil (tout ou rien) ou mesurer ; mesure absolue ou relative ; sur la charge ou sur le moteur.</li>
      <li>Définir les exigences : étendue avec une marge, précision meilleure que la tolérance, résolution de la chaîne 4 à 10 fois plus fine, bande passante 5 à 10 fois au-dessus de la fréquence utile, environnement.</li>
      <li>Vérifier la compatibilité avec la chaîne de traitement (signal de sortie : logique, tension, courant 4–20 mA, impulsions, liaison numérique ; niveaux).</li>
      <li>Considérer les contraintes pratiques : coût, encombrement, robustesse, maintenance.</li>
    </ol>
    <p><em>Exemple éclair :</em> température d'un four de 20 à 900 °C, à ±5 °C près : un thermocouple de type K (étendue suffisante, robuste), amplifié ; une sonde platine courante plafonne vers 600 °C, une thermistance bien plus bas.</p>
  </div>
  <div class="method-box"><strong>Méthode 2 — Exploiter un pont de Wheatstone en quart de pont</strong>
    <ol>
      <li>Une jauge active : \(R_1=R_0(1+G_f\varepsilon)\), les trois autres résistances valent \(R_0\).</li>
      <li>Tension de sortie, pour \(G_f\varepsilon\) petit : \(U_s=U_{alim}\,G_f\varepsilon/4\).</li>
      <li>Sensibilité en déformation : \(S=U_s/\varepsilon=U_{alim}G_f/4\).</li>
      <li>Choisir le gain de l'amplificateur d'instrumentation pour que la déformation maximale donne la pleine échelle du CAN.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(U_{alim} = 10\ \text{V}\), \(G_f = 2{,}1\), \(\varepsilon = 400\times10^{-6}\) : \(U_s = 10\times2{,}1\times4\times10^{-4}/4 = 2{,}1\ \text{mV}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 3 — Calculer la résolution d'une chaîne d'acquisition</strong>
    <ol>
      <li>Calculer le quantum du CAN : \(q = E/2^n\) (\(E\) : pleine échelle, \(n\) : nombre de bits).</li>
      <li>Calculer la sensibilité globale \(S\) du capteur et du conditionnement (volts par unité de mesurande, gain compris).</li>
      <li>En déduire la résolution sur le mesurande : \(\Delta m = q/S\).</li>
      <li>Comparer à la tolérance (rapport 4 à 10) ; si besoin, choisir \(n\) tel que \(2^n \ge E/(S\,\Delta m_{visée})\), ou mieux étaler le signal sur la pleine échelle.</li>
    </ol>
    <p><em>Exemple éclair :</em> capteur de position 0–200 mm conditionné en 0–10 V (\(S = 50\ \text{mV/mm}\)), CAN 0–10 V de 12 bits : \(q = 10/4\,096 \approx 2{,}44\ \text{mV}\), \(\Delta x \approx 0{,}049\ \text{mm}\), dix fois plus fin qu'une tolérance de ±0,5 mm.</p>
  </div>
  <div class="method-box"><strong>Méthode 4 — Exploiter un capteur à sortie 4–20 mA</strong>
    <ol>
      <li>Écrire la loi affine : \(I = 4 + 16\,(m - m_{min})/(m_{max} - m_{min})\) (en mA).</li>
      <li>L'inverser pour lire le mesurande : \(m = m_{min} + (m_{max} - m_{min})(I - 4)/16\).</li>
      <li>Choisir la résistance de mesure : \(R = U_{max}/20\ \text{mA}\) pour une entrée analogique de pleine échelle \(U_{max}\).</li>
      <li>Interpréter un courant nettement inférieur à 4 mA comme un défaut (câble coupé, capteur hors service).</li>
    </ol>
    <p><em>Exemple éclair :</em> capteur de niveau 0–5 m ; \(I = 9\ \text{mA}\) donne \(h = 5\times(9-4)/16 \approx 1{,}56\ \text{m}\). Sur une entrée 0–5 V, \(R = 5/0{,}020 = 250\ \Omega\).</p>
  </div>
  <div class="method-box"><strong>Méthode 5 — Exploiter un codeur incrémental ou absolu</strong>
    <ol>
      <li>Incrémental : nombre d'incréments par tour \(N_i = N\) (périodes de la voie \(A\)) ou \(4N\) (tous les fronts de \(A\) et \(B\)) ; résolution \(360°/N_i\).</li>
      <li>Ramener à la grandeur utile par la transmission : déplacement \(p_h/N_i\) par incrément sur une vis, \(2\pi R/N_i\) sur un pignon ou une poulie.</li>
      <li>Vitesse par comptage pendant \(T\) : \(\omega = 2\pi n/(N_i T)\), résolution \(2\pi/(N_i T)\).</li>
      <li>Absolu : \(n\) pistes, \(2^n\) positions ; pour une résolution \(\Delta\theta\), \(n \ge \log_2(360°/\Delta\theta)\). Mot Gray : convertir en binaire (\(b_{n-1} = g_{n-1}\), \(b_i = b_{i+1}\oplus g_i\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> codeur de 1 024 points lu sur quatre fronts, sur une vis de pas 5 mm : \(5/4\,096 \approx 1{,}2\ \mu\text{m}\) par incrément. Pour résoudre 0,5° en absolu : \(2^n \ge 720\), donc \(n = 10\) pistes (0,35°).</p>
  </div>
  <div class="method-box"><strong>Méthode 6 — Juger la justesse et la fidélité d'une série de mesures</strong>
    <ol>
      <li>Mesurer plusieurs fois un étalon de valeur connue, dans les mêmes conditions.</li>
      <li>Moyenne : l'écart moyenne − valeur vraie est le biais (justesse, erreur systématique).</li>
      <li>Écart-type des mesures : dispersion (fidélité, erreur aléatoire).</li>
      <li>Conclure : corriger le biais par étalonnage (zéro, gain) ; réduire la dispersion en moyennant ; comparer ce qui reste à la tolérance.</li>
    </ol>
    <p><em>Exemple éclair :</em> une balance pèse un étalon de 500,0 g : 501,2 ; 500,8 ; 501,0 ; 501,1 ; 500,9 g. Moyenne 501,0 g, biais +1,0 g ; écart-type 0,16 g : balance fidèle mais pas juste, à étalonner.</p>
  </div>
  <div class="notice"><strong>Piège</strong> :
    <ul style="margin-top:.4rem">
      <li>Justesse ≠ fidélité. Un capteur peut être juste (mesures centrées en moyenne sur la vraie valeur) mais peu fidèle (dispersées), ou fidèle mais faux ; il n'est précis que s'il est les deux.</li>
      <li>La sensibilité dépend des unités : toujours vérifier la cohérence V/unité physique, gain du conditionneur compris.</li>
      <li>Un codeur incrémental perd sa référence si le courant est coupé (contrairement à l'absolu) : prise d'origine obligatoire.</li>
      <li>La bande passante du capteur doit dépasser la plus haute fréquence utile du mesurande ; le critère de Shannon (\(f_e \gt 2 f_{max}\)) concerne, lui, l'échantillonnage par le CAN.</li>
      <li>Le quantum se calcule sur la pleine échelle du CAN, pas sur la plage utile du signal : un signal qui n'occupe qu'une partie de la pleine échelle perd en résolution.</li>
      <li>En 4–20 mA, 4 mA correspond au début de l'étendue de mesure, pas à « zéro courant ».</li>
    </ul>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="cap-exos">
<div class="exo-wrapper">
<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Caractéristiques d'un capteur de température</h3>
  <div class="statement">Une sonde de température suivie de son conditionneur délivre 5 mV par °C, avec 0 V à 0 °C. Plage : 0 à \(+150\ °\text{C}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la sensibilité en V/°C.</div>
  <div class="q"><strong>Q2.</strong> Quelle est la tension de sortie à 80 °C ?</div>
  <div class="q"><strong>Q3.</strong> Un CAN 12 bits avec \(U_{ref}=1\ \text{V}\) échantillonne ce signal. Quelle est la résolution en température ? Toute la plage est-elle mesurable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S=5\ \text{mV/°C}=5\times10^{-3}\ \text{V/°C}\). Ordre de grandeur : un thermocouple seul ne délivre que quelques dizaines de µV par °C ; une telle sensibilité suppose un conditionneur qui amplifie.</p>
    <p><strong>Q2.</strong> \(U=S\times T=5\times10^{-3}\times80=0{,}4\ \text{V}\).</p>
    <p><strong>Q3.</strong> Résolution du CAN : \(q=1/2^{12}=1/4096\approx244\ \mu\text{V}\). Résolution en température : \(\Delta T=q/S\) \(=244\times10^{-6}/(5\times10^{-3})\approx0{,}05\ °\text{C}\). À 150 °C, la tension vaut 0,75 V, sous la pleine échelle de 1 V : toute la plage est mesurable (un quart des codes reste inutilisé).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Encodeur incrémental — résolution angulaire</h3>
  <div class="statement">Un encodeur a 1000 traits par tour. Il est fixé sur un axe moteur tournant à \(n=3000\ \text{tr/min}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la résolution angulaire en degrés et en radians.</div>
  <div class="q"><strong>Q2.</strong> Calculer la fréquence des impulsions à 3000 tr/min.</div>
  <div class="q"><strong>Q3.</strong> Si on mesure la vitesse en comptant les impulsions pendant \(T_{mes}=10\ \text{ms}\), quelle est la résolution en vitesse (tr/min) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\Delta\theta=360°/1000=0{,}36°\) \(=2\pi/1000\approx6{,}28\ \text{mrad}\).</p>
    <p><strong>Q2.</strong> \(f=1000\times3000/60\) \(=50\,000\ \text{Hz}=50\ \text{kHz}\).</p>
    <p><strong>Q3.</strong> Pendant \(T_{mes}=10\ \text{ms}\), on compte \(N=f\times T_{mes}\) impulsions (500 à 3 000 tr/min). Le comptage est connu à une impulsion près, soit 1/1 000 de tour en 10 ms : \(\Delta n = 0{,}001\ \text{tr}/0{,}01\ \text{s}\) \(= 0{,}1\ \text{tr/s} = 6\ \text{tr/min}\). Résolution = 6 tr/min (améliorer : augmenter \(T_{mes}\) ou le nombre de traits, ou compter les quatre fronts des deux voies).</p>
  </div>
</div>

  <h3>Jauge de contrainte — pont de Wheatstone</h3>
  <div class="statement">Pont de Wheatstone en quart de pont. Jauge : \(R_0=120\ \Omega\), \(G_f=2\). Alimentation \(U_{alim}=5\ \text{V}\). Déformation \(\varepsilon=500\ \mu\varepsilon\) (\(=500\times10^{-6}\)).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\Delta R\) de la jauge.</div>
  <div class="q"><strong>Q2.</strong> Calculer la tension de sortie \(U_s\) du pont.</div>
  <div class="q"><strong>Q3.</strong> Quel gain d'amplification faut-il pour obtenir \(0\) à \(5\ \text{V}\) en sortie pour \(\varepsilon\in[0;\,1000\ \mu\varepsilon]\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">

    <p><strong>Q2.</strong> \(U_s=U_{alim}\times G_f\varepsilon/4\) \(=5\times2\times500\times10^{-6}/4=1{,}25\ \text{mV}\).</p>
    <p><strong>Q3.</strong> Pour \(\varepsilon_{max}=1000\ \mu\varepsilon\) : \(U_{s,max}=5\times2\times10^{-3}/4=2{,}5\ \text{mV}\). Gain nécessaire : \(A=5\ \text{V}/2{,}5\ \text{mV}=2000\). Ampli d'instrumentation de gain 2000.</p>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(c(20°)=331+12=343\ \text{m/s}\). \(d=c\times t/2=343\times2{,}94\times10^{-3}/2\) \(=0{,}504\ \text{m}\approx50\ \text{cm}\).</p>

    <p><strong>Q3.</strong> \(\Delta d=c\times\Delta t/2=343\times10^{-6}/2\) \(=0{,}172\ \text{mm}\approx0{,}2\ \text{mm}\). Excellent pour de nombreuses applications industrielles.</p>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Dynamique d'un capteur — temps de réponse</h3>
  <div class="statement">Un capteur de température modélisé par un système du 1er ordre : \(\tau=5\ \text{s}\). La température ambiante passe brusquement de 20 à 80 °C.</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(T_{mes}(t)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le temps pour atteindre 95% de la valeur finale (temps de réponse à 95%).</div>
  <div class="q"><strong>Q3.</strong> Quelle erreur de mesure commet-on si on lit la valeur à \(t=5\ \text{s}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(T_{mes}(t)=80-60e^{-t/5}\) \(=20+60(1-e^{-t/5})\ °\text{C}\).</p>
    <p><strong>Q2.</strong> \(1-e^{-t_{95}/5}=0{,}95\Rightarrow e^{-t_{95}/5}\) \(=0{,}05\Rightarrow t_{95}=5\ln20\approx15\ \text{s}\). (3τ = 14,9 s ≈ 15 s.)</p>
    <p><strong>Q3.</strong> À \(t=5\ \text{s}=\tau\) : \(T_{mes}=20+60(1-e^{-1})\) \(=20+60\times0{,}632=57{,}9\ °\text{C}\). Erreur : \(80-57{,}9=22{,}1\ °\text{C}\) (37% de l'échelon). Il faut attendre au moins \(3\tau=15\ \text{s}\) pour une lecture exploitable.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Chaîne de mesure complète — asservissement de position</h3>
  <div class="statement">Un axe de robot est asservi en position. Capteur : codeur incrémental donnant 4 096 incréments par tour (fronts des deux voies comptés), monté sur une vis de pas 2 mm (un filet). Les impulsions sont comptées par une interface de comptage dont la fréquence maximale de comptage vaut 1 MHz ; le calculateur lit ce compteur toutes les \(T_e = 1\ \text{ms}\) (\(f_e = 1\ \text{kHz}\)).</div>
  <div class="q"><strong>Q1.</strong> Calculer la résolution linéaire (en mm) de la mesure de position.</div>
  <div class="q"><strong>Q2.</strong> Quelle est la vitesse linéaire maximale que l'interface peut suivre sans perdre d'impulsion ? La fréquence \(f_e\) de lecture du compteur limite-t-elle cette vitesse ?</div>
  <div class="q"><strong>Q3.</strong> Si la vitesse maximale souhaitée est de 500 mm/s, vérifier la compatibilité et proposer une solution si nécessaire.</div>
  <div class="q"><strong>Q4.</strong> La vitesse est estimée par différence de deux lectures successives du compteur. Quelle est la résolution de cette mesure de vitesse ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(1\) tour \(= 2\ \text{mm}\) de translation. \(1\) incrément \(= 2/4096 \approx 0{,}000488\ \text{mm}\) \(= 0{,}49\ \mu\text{m}\). Résolution très fine.</p>
    <p><strong>Q2.</strong> L'interface compte au plus \(10^6\) incréments par seconde, soit \(10^6/4096 \approx 244\ \text{tr/s}\) et \(v_{max} \approx 244\times2 \approx 488\ \text{mm/s}\). La fréquence de lecture \(f_e\) n'intervient pas : le compteur matériel enregistre toutes les impulsions entre deux lectures ; le calculateur lit seulement un total qui a augmenté. Le critère de Shannon ne s'applique pas ici aux impulsions du codeur ; il concerne l'échantillonnage d'un signal (ici, il impose que le mouvement de l'axe ne contienne pas de fréquences au-delà de 500 Hz, ce qui est largement le cas pour un axe mécanique).</p>
    <p><strong>Q3.</strong> À 500 mm/s : \(500/2=250\ \text{tr/s}\), soit \(250\times4096 \approx 1{,}02\ \text{MHz}\), au-dessus de la limite de 1 MHz : incompatible (de peu). Solutions : une interface de comptage plus rapide ; ou un codeur de 2 048 incréments par tour (512 kHz à 500 mm/s), dont la résolution de \(0{,}98\ \mu\text{m}\) reste très suffisante.</p>
    <p><strong>Q4.</strong> Entre deux lectures, la position est connue à un incrément près : \(\Delta v = 0{,}488\ \mu\text{m}/1\ \text{ms} \approx 0{,}49\ \text{mm/s}\). Pour l'affiner, on mesure sur une durée plus longue (au prix d'un retard) ou l'on mesure la durée entre impulsions aux faibles vitesses.</p>
  </div>
</div>


<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Codeur absolu en code Gray — articulation d'un robot</h3>
  <div class="statement">L'angle d'une articulation de robot doit être connu dès la mise sous tension, avec une résolution d'au moins 0,5°. On envisage un codeur absolu monotour codé en Gray.</div>
  <div class="q"><strong>Q1.</strong> Pourquoi un codeur absolu plutôt qu'un codeur incrémental ? Combien de pistes faut-il au minimum ? Quelle est alors la résolution ?</div>
  <div class="q"><strong>Q2.</strong> Le codeur retenu délivre le mot Gray 0110101101. Le convertir en binaire naturel et en déduire l'angle de l'articulation.</div>
  <div class="q"><strong>Q3.</strong> En binaire naturel, que se passerait-il au passage de la position 511 à la position 512 si les capteurs ne basculaient pas tous au même instant ? Comparer avec le code Gray.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Un codeur incrémental ne donne qu'un déplacement depuis la mise sous tension : il faudrait une prise d'origine, donc un mouvement à l'aveugle du robot au démarrage. Le codeur absolu lit directement la position. Il faut \(2^n \ge 360/0{,}5 = 720\), donc \(n = 10\) pistes (\(2^9 = 512\) ne suffit pas). Résolution : \(360°/1\,024 \approx 0{,}35°\).</p>
    <p><strong>Q2.</strong> On part du poids fort, avec \(b_9 = g_9\) puis \(b_i = b_{i+1}\oplus g_i\). Mot Gray : 0 1 1 0 1 0 1 1 0 1 ; bits binaires successifs : 0, 1, 0, 0, 1, 1, 0, 1, 1, 0. Binaire : 0100110110, soit \(256+32+16+4+2 = 310\). Angle : \(310\times360/1\,024 \approx 109{,}0°\) (entre 108,98° et 109,34°).</p>
    <p><strong>Q3.</strong> En binaire, 511 = 0111111111 et 512 = 1000000000 : les dix bits changent. Pendant la transition, la tête peut lire par exemple 1111111111 = 1 023, soit 359,6° au lieu de 179,6° : l'asservissement réagirait à une erreur énorme. En Gray, 511 et 512 s'écrivent 0100000000 et 1100000000 : seul le bit de poids fort change, et une lecture pendant la transition donne 511 ou 512, jamais une position éloignée.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Étalonnage d'un capteur d'effort — sensibilité, linéarité, justesse, fidélité</h3>
  <div class="statement">Un capteur d'effort d'étendue 0–200 N est étalonné à l'aide de masses étalons. Relevé de la tension de sortie \(s\) :
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center">
      <tr><th>\(F\) (N)</th><td>0</td><td>50</td><td>100</td><td>150</td><td>200</td></tr>
      <tr><th>\(s\) (V)</th><td>0,02</td><td>1,03</td><td>2,03</td><td>3,01</td><td>3,98</td></tr>
    </table></div>
    On mesure ensuite cinq fois un effort étalon de 100,0 N, la mesure étant calculée avec la droite de Q1 : 99,2 ; 100,9 ; 100,3 ; 99,6 ; 100,5 N. Le cahier des charges demande une erreur inférieure à ±2 N.</div>
  <div class="q"><strong>Q1.</strong> Calculer la sensibilité et le décalage du zéro à partir de la droite qui passe par les deux points extrêmes.</div>
  <div class="q"><strong>Q2.</strong> Calculer les écarts des points intermédiaires à cette droite. En déduire l'écart de linéarité, en newtons et en % de l'étendue de mesure.</div>
  <div class="q"><strong>Q3.</strong> À partir des cinq mesures à 100 N, juger la justesse et la fidélité du capteur (moyenne, écart-type).</div>
  <div class="q"><strong>Q4.</strong> Le capteur, utilisé tel quel, respecte-t-il le cahier des charges ? Proposer deux améliorations.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S = (3{,}98-0{,}02)/200\) \(= 0{,}0198\ \text{V/N}\), soit 19,8 mV/N ; décalage du zéro : 0,02 V. Droite : \(s = 0{,}02 + 0{,}0198\,F\).</p>
    <p><strong>Q2.</strong> La droite donne 1,01 V à 50 N, 2,00 V à 100 N et 2,99 V à 150 N : écarts de +0,02 ; +0,03 ; +0,02 V. Écart maximal : 0,03 V, soit \(0{,}03/0{,}0198 \approx 1{,}5\ \text{N}\), ou 0,76 % de l'étendue de mesure.</p>
    <p><strong>Q3.</strong> Moyenne : 100,1 N, biais de +0,1 N : à 100 N, le capteur est juste. Écart-type : 0,69 N environ ; les mesures s'étalent sur 1,7 N : fidélité moyenne, due au bruit.</p>
    <p><strong>Q4.</strong> Les erreurs peuvent se cumuler : jusqu'à 1,5 N de non-linéarité (au milieu de l'étendue), plus environ ±1,4 N de dispersion (deux écarts-types), soit près de 3 N : la tolérance de ±2 N n'est pas garantie. Améliorations : corriger la non-linéarité par une table d'étalonnage (ou un polynôme) dans le programme, l'erreur systématique disparaissant alors ; moyenner plusieurs mesures, quatre mesures divisant l'écart-type par deux (±0,7 N). Avec les deux, l'erreur reste nettement sous ±2 N.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ☆</span>
  <h3>Capteur de position et numérisation</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>capteurs et chaîne de mesure</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un capteur de position potentiométrique de course \(L = 10{,}0\ \text{cm}\) délivre une tension proportionnelle au déplacement \(x\) : \(u = U_0\,x/L\) avec \(U_0 = 5{,}00\ \text{V}\). Cette tension est numérisée par un convertisseur analogique-numérique (CAN) de \(n = 10\) bits sur la pleine échelle 0–5,00 V.
  </div>

  <p class="exo-part">Partie A — Sensibilité</p>
  <div class="q"><strong>A1.</strong> Calculer la sensibilité \(s = \mathrm du/\mathrm dx\) du capteur.</div>

  <p class="exo-part">Partie B — Résolution de la chaîne</p>
  <div class="q"><strong>B1.</strong> Calculer le quantum (plus petite variation de tension distinguable) du CAN.</div>
  <div class="q"><strong>B2.</strong> En déduire la résolution en position (plus petit déplacement mesurable).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(s = \dfrac{\mathrm du}{\mathrm dx} = \dfrac{U_0}{L} = \dfrac{5{,}00}{0{,}100} = 50{,}0\ \text{V/m}\) (soit 0,50 V/cm).</p>
    <p><strong>B1.</strong> Quantum : \(q = \dfrac{\text{pleine échelle}}{2^n} = \dfrac{5{,}00}{2^{10}}\) \(= \dfrac{5{,}00}{1024} \approx 4{,}9\ \text{mV}\).</p>
    <p><strong>B2.</strong> Résolution en position : \(\Delta x = q/s = \dfrac{4{,}9\times10^{-3}}{50{,}0}\) \(\approx 9{,}8\times10^{-5}\ \text{m} \approx 0{,}10\ \text{mm}\). Augmenter le nombre de bits \(n\) affine la résolution.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Supervision du niveau d'une cuve de récupération d'eau</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème <em>chaîne d'acquisition : choix du capteur, conditionnement, résolution, mémoire, échantillonnage</em>).</div>
  <div class="statement">Une cuve d'eau de pluie, de hauteur utile 2,4 m, doit être supervisée par une carte de commande placée à 40 m, dans un local technique. Exigences : niveau \(h\) connu à ±1 cm ; une mesure enregistrée toutes les 10 s ; historique de 30 jours. La carte offre une entrée analogique 0–3,3 V de 12 bits et 250 000 octets de mémoire libre. Données : \(\rho = 1\,000\ \text{kg/m}^3\), \(g = 9{,}81\ \text{m/s}^2\).</div>
  <p class="exo-part">Partie A — Choix du principe de mesure</p>
  <div class="q"><strong>A1.</strong> Trois solutions sont envisagées : un flotteur entraînant un potentiomètre, un capteur à ultrasons fixé au couvercle, un capteur de pression immergé au fond de la cuve. Donner un avantage et un inconvénient de chacune.</div>
  <div class="q"><strong>A2.</strong> On retient le capteur de pression à sortie 4–20 mA. Justifier le choix d'une sortie en courant plutôt qu'en tension.</div>
  <p class="exo-part">Partie B — Capteur et conditionnement</p>
  <div class="q"><strong>B1.</strong> Calculer la pression relative au fond de la cuve pleine. Choisir l'étendue de mesure parmi 0–100 mbar, 0–250 mbar et 0–1 bar.</div>
  <div class="q"><strong>B2.</strong> Écrire la relation entre le courant \(I\) (mA) et la hauteur \(h\). Quelle hauteur correspond à \(I = 14{,}2\ \text{mA}\) ?</div>
  <div class="q"><strong>B3.</strong> Le courant traverse une résistance de mesure \(R\) placée à l'entrée de la carte. Choisir \(R\) et vérifier la plage de tension obtenue.</div>
  <p class="exo-part">Partie C — Résolution et précision</p>
  <div class="q"><strong>C1.</strong> Calculer le quantum du CAN, puis la résolution sur la hauteur.</div>
  <div class="q"><strong>C2.</strong> La précision du capteur est de ±0,25 % de l'étendue de mesure. L'exigence de ±1 cm est-elle tenue ?</div>
  <p class="exo-part">Partie D — Mémoire</p>
  <div class="q"><strong>D1.</strong> Chaque mesure est rangée sur 2 octets. La mémoire suffit-elle pour 30 jours ? Sinon, proposer une solution.</div>
  <p class="exo-part">Partie E — Échantillonnage</p>
  <div class="q"><strong>E1.</strong> Par temps de vent, des vagues de période 1 s environ agitent la surface, et la mesure oscille de ±2 cm autour du niveau moyen. Quel risque fait courir un échantillonnage toutes les 10 s ? Proposer deux remèdes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Flotteur et potentiomètre : simple et peu coûteux, mais pièces mobiles dans l'eau (usure, encrassement, blocage). Ultrasons : sans contact, rien dans l'eau, mais écho perturbé par la condensation ou la mousse, et célérité dépendant de la température. Pression immergée : robuste, sans pièce mobile, insensible à l'état de la surface, mais en contact avec l'eau (étanchéité, dépôts) et il mesure en fait la pression, image du niveau seulement si la masse volumique est connue.</p>
    <p><strong>A2.</strong> Sur 40 m de câble, une tension serait altérée par la résistance des fils et par les perturbations. Le courant est le même en tout point de la boucle : la mesure ne dépend pas de la longueur du câble. Le zéro décalé à 4 mA permet en outre de détecter une coupure.</p>
    <p><strong>B1.</strong> \(p = \rho g h = 1\,000\times9{,}81\times2{,}4\) \(\approx 23{,}5\ \text{kPa} = 235\ \text{mbar}\). On retient 0–250 mbar : 0–100 mbar serait saturé, 0–1 bar n'utiliserait qu'un quart de l'étendue (résolution et précision quatre fois moins bonnes).</p>
    <p><strong>B2.</strong> \(I = 4 + 16\,p/p_{max}\), avec \(p = \rho g h\) et \(p_{max} = 25\ \text{kPa}\). Pour 14,2 mA : \(p = 25\times(14{,}2-4)/16\) \(\approx 15{,}9\ \text{kPa}\), d'où \(h = p/(\rho g) \approx 1{,}62\ \text{m}\).</p>
    <p><strong>B3.</strong> \(R = 3{,}3\ \text{V}/20\ \text{mA} = 165\ \Omega\). Cuve vide : \(165\times4\ \text{mA} = 0{,}66\ \text{V}\) ; cuve pleine : \(I = 4 + 16\times23{,}5/25 \approx 19{,}1\ \text{mA}\), soit 3,15 V. La tension reste dans la plage 0–3,3 V ; une tension sous 0,66 V signale un défaut.</p>
    <p><strong>C1.</strong> \(q = 3{,}3/4\,096 \approx 0{,}81\ \text{mV}\), soit \(0{,}81\ \text{mV}/165\ \Omega \approx 4{,}9\ \mu\text{A}\). Comme 16 mA correspondent à 25 kPa, cela fait \(25\,000\times0{,}0049/16 \approx 7{,}6\ \text{Pa}\), et \(\Delta h = 7{,}6/(1\,000\times9{,}81)\) \(\approx 0{,}78\ \text{mm}\) : treize fois plus fin que la tolérance.</p>
    <p><strong>C2.</strong> \(\pm0{,}25\ \%\) de 25 kPa \(= \pm62{,}5\ \text{Pa}\), soit \(\pm6{,}4\ \text{mm}\) d'eau. Avec la résolution (moins de 1 mm), l'erreur reste sous ±1 cm : l'exigence est tenue (si la résistance de mesure est précise et la masse volumique connue).</p>
    <p><strong>D1.</strong> 30 jours à une mesure toutes les 10 s : \(30\times86\,400/10 = 259\,200\) mesures, soit 518 400 octets : plus du double de la mémoire libre. Solutions : n'enregistrer qu'une valeur par minute, moyenne des six mesures (43 200 valeurs, 86 400 octets), ce qui lisse aussi le bruit ; ou transmettre l'historique à un serveur au fil de l'eau.</p>
    <p><strong>E1.</strong> Échantillonner toutes les 10 s (\(f_e = 0{,}1\ \text{Hz}\)) un signal qui contient une oscillation de 1 Hz viole le critère de Shannon (\(f_e \gt 2\ \text{Hz}\) serait nécessaire) : les vagues se replient en fausses variations lentes du niveau, de plusieurs centimètres (repliement de spectre). Remèdes : un filtre passe-bas analogique avant le CAN (constante de temps de quelques dizaines de secondes) qui ne laisse passer que le niveau moyen ; ou échantillonner vite (10 Hz par exemple) et moyenner numériquement sur 10 s avant d'enregistrer.</p>
