<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">La <strong>fabrication additive</strong> construit une pièce couche par couche à partir de son modèle numérique, sans moule ni outil de forme. Le programme de sciences industrielles (compétence G2, « Industrialiser un produit ») la cite au semestre <strong>S2</strong> pour évaluer la capacité d'un procédé à réaliser une <strong>pièce plastique</strong> ou une <strong>pièce composite</strong>, avec ses domaines d'application et ses <strong>règles de conception</strong> ; les procédés additifs <strong>métalliques</strong> sont au semestre S3 (2ᵉ année) et sont présentés ici en avance. Ce chapitre complète <a href="#moulage/cours">« Moulage : fonderie, injection plastique et composites »</a> ; le chapitre de 2ᵉ année <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a> compare ensuite tous les procédés.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Évaluer la capacité d'un procédé additif à réaliser une pièce plastique</strong> (G2, S2) : principe et chaîne numérique (§1), familles de procédés (§2), dépôt de fil fondu (§3), photopolymérisation et fusion de poudre polymère (§4).</li>
        <li><strong>Évaluer la capacité d'un procédé additif à réaliser une pièce composite</strong> (G2, S2) : fibres courtes et fibres continues (§6).</li>
        <li><strong>Règles de conception</strong> des pièces obtenues par fabrication additive (G2, S2) : anisotropie et orientation (§7), porte-à-faux et supports (§8), épaisseurs, trous, jeux et précision (§9), état de surface et finition (§10).</li>
        <li><strong>Domaines d'application</strong> et place de l'additif face au moulage et à l'usinage (G2, S2 ; critères de choix des procédés en S3) (§11).</li>
        <li><strong>Vu en avance (2ᵉ année, S3)</strong> : procédés additifs pour une pièce métallique (§5).</li>
      </ul>
      <p>Comme pour tous les procédés, l'analyse reste <strong>qualitative</strong> : les calculs du chapitre (durée et coût d'impression, angle limite de porte-à-faux, hauteur des marches) sont des ordres de grandeur qui justifient les règles, et un sujet fournirait les relations. Le prototypage rapide sert aussi la compétence G1 (réaliser un prototype, S4). <strong>Hors programme</strong>, en fin de chapitre : le frittage conventionnel des poudres (métallurgie des poudres), qui n'est au programme d'aucune des deux années.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · DU MODÈLE NUMÉRIQUE À LA PIÈCE</div>
  <h2>La chaîne numérique de la fabrication additive</h2>
  <div class="intro">Une machine de fabrication additive ne lit pas un dessin : elle exécute une suite de trajectoires, couche après couche. Entre le modèle de CAO et la pièce, plusieurs étapes numériques ont chacune leur source d'écart. Les connaître explique une partie de la précision obtenue.</div>
  <div class="def-box"><strong>Fabrication additive</strong> : procédé qui fabrique une pièce par <strong>ajout de matière</strong>, en général couche par couche, à partir de son modèle numérique, sans outillage propre à la pièce. C'est l'inverse de l'usinage, procédé <strong>soustractif</strong> qui enlève de la matière à un brut.</div>
  <ol>
    <li><strong>Modèle CAO</strong> (volumique), dessiné pour le procédé (§7 à §10).</li>
    <li><strong>Maillage</strong> : export en fichier de facettes triangulaires (format STL, ou 3MF) ; les surfaces courbes deviennent polyédriques.</li>
    <li><strong>Préparation</strong> : choix de l'orientation, placement sur le plateau, génération des supports, choix des paramètres (épaisseur de couche, remplissage).</li>
    <li><strong>Tranchage</strong> : le logiciel coupe le maillage en couches d'épaisseur \(h\) et calcule les trajectoires de chaque couche (contours, remplissage) ; il en sort un fichier machine (le « G-code » d'une imprimante à fil).</li>
    <li><strong>Fabrication</strong>, de quelques minutes à plusieurs jours.</li>
    <li><strong>Post-traitement</strong> : retrait des supports, nettoyage (poudre, résine), durcissement ou traitement thermique, usinage des surfaces fonctionnelles, finition.</li>
  </ol>

<figcaption>(a) Le fichier STL remplace chaque surface par des facettes triangulaires : un cylindre de rayon \( R \) devient un prisme à \( n \) faces, dont la flèche \( \delta \) mesure l'écart de forme. (b) Le logiciel de tranchage coupe ensuite la pièce en couches d'épaisseur \( h \) : les surfaces inclinées deviennent des marches (ici \( h \) est très exagérée).</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — facettes et couches</strong>
    <p>Un alésage de rayon \(R = 20\) mm et de 30 mm de haut.</p>
    <ol>
      <li>Approché par \(n\) facettes, il présente une flèche \(\delta = R\left(1 - \cos(\pi/n)\right)\). Pour \(\delta \leq 0{,}01\) mm, il faut \(\cos(\pi/n) \geq 0{,}9995\), soit \(n \geq 100\) facettes ; une tolérance d'export de 0,1 mm se contente de 32 facettes, et l'alésage sort visiblement polygonal.</li>
      <li>En couches de 0,2 mm, la pièce compte 150 couches ; en 0,1 mm, 300 couches : la durée double, contre de plus petites marches (§10).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : accuser la machine d'un défaut qui vient du fichier. Un export grossier (facettes visibles) ou un tranchage trop épais se voient sur la pièce, quelle que soit la précision de l'imprimante.</div>

    <p>Combien de couches pour une pièce de 50 mm de haut ?</p>
    <ol>
      <li>Fil fondu en couches de 0,2 mm : 250 couches ; résine en 0,05 mm : 1 000 couches ; métal en 0,03 mm : environ 1 670 couches.</li>
      <li>Chaque couche demande d'étaler ou de déposer la matière puis de la consolider : à surface égale, la fusion laser de métal est la plus longue, et c'est aussi la plus fine.</li>
    </ol>
  </div>
  <p>La projection de liant sert aussi la fonderie : on imprime directement des <strong>moules et des noyaux en sable</strong>, sans modèle, pour des pièces uniques ou des noyaux impossibles à mouler (voir le moulage en sable dans <a href="#moulage/cours">« Moulage »</a>).</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LE DÉPÔT DE FIL FONDU</div>
  <h2>Le procédé additif le plus répandu</h2>
  <div class="intro">Le dépôt de fil fondu (souvent appelé FDM, du nom commercial de son inventeur) est l'imprimante des ateliers, des laboratoires et des salles de TP. Il est bon marché et rapide à mettre en œuvre ; ses limites (anisotropie, marches, précision moyenne) fixent la plupart des règles de conception des §7 à §10.</div>
  <h3>Principe et paramètres</h3>
  <p>Un fil de thermoplastique (diamètre 1,75 mm) est poussé dans une <strong>buse</strong> chauffée (diamètre usuel 0,4 mm) ; la buse, déplacée en \(x\) et \(y\), dépose un <strong>cordon</strong> de largeur \(w\) (un peu plus que le diamètre de buse) et de hauteur \(h\) (la couche), puis le plateau descend d'une couche. Températures de buse : environ 200 à 220 °C pour le PLA, 230 à 250 °C pour le PETG, 240 à 260 °C pour l'ABS ; un plateau chauffé limite le décollement des premières couches.</p>
  <h3>Une pièce imprimée n'est pas pleine</h3>
  <p>Chaque couche comprend des <strong>périmètres</strong> (deux ou trois cordons qui forment les parois), des <strong>peaux</strong> pleines en haut et en bas (quelques couches), et un <strong>remplissage</strong> intérieur partiel (10 à 50 % selon la résistance voulue, en grille, nid d'abeille…). On règle ainsi la masse, la durée et la résistance. La durée dépend du <strong>volume réellement déposé</strong>, au débit volumique de la buse :</p>
  <div class="formula" data-nom="Débit d'une buse de dépôt de fil">$$Q = w\,h\,v$$</div>
  <p>où \(v\) est la vitesse de dépôt (de l'ordre de 40 à 100 mm/s).</p>
  <div class="method-box"><strong>Exemple — masse, durée et coût d'un bloc imprimé</strong>
    <p>Un bloc de 60 × 40 × 20 mm en PLA (\(1{,}24\ \text{g/cm}^3\)) : cordon \(w = 0{,}45\) mm, couche \(h = 0{,}2\) mm, deux périmètres (paroi de 0,9 mm), quatre couches pleines en haut et en bas (0,8 mm), remplissage de 20 %, \(v = 60\) mm/s.</p>
    <ol>
      <li>Parois : \(\left(60 \times 40 - 58{,}2 \times 38{,}2\right) \times 18{,}4 \approx 3\,250\ \text{mm}^3\) ; peaux : \(2 \times 60 \times 40 \times 0{,}8 = 3\,840\ \text{mm}^3\) ; intérieur : \(58{,}2 \times 38{,}2 \times 18{,}4 \times 0{,}2 \approx 8\,180\ \text{mm}^3\).</li>
      <li>Volume déposé : environ 15,3 cm³, soit 32 % du bloc plein (48 cm³) ; masse 19 g au lieu de 60 g.</li>
      <li>Débit \(Q = 0{,}45 \times 0{,}2 \times 60 = 5{,}4\ \text{mm}^3/\text{s}\) : 2 830 s de dépôt, soit environ 1 h avec les déplacements à vide ; 100 couches.</li>
      <li>Coût : 0,47 € de PLA (25 €/kg) et environ 1,50 € de machine et d'énergie : une pièce unique pour 2 €, sans aucun outillage.</li>
    </ol>
  </div>
  <p><strong>Domaines</strong> : prototypes de forme et de montage, gabarits et outillages d'atelier, pièces fonctionnelles en très petite série (supports, carters légers, pièces de rechange), maquettes de TP. <strong>Limites</strong> : forte anisotropie (§7), précision de l'ordre de ±0,2 mm, marches visibles (§10), retrait et décollement des matières techniques (ABS, PA) sans enceinte chauffée.</p>
  <div class="notice"><strong>Erreur classique</strong> : estimer la durée ou la masse d'après le volume extérieur de la pièce. C'est le volume déposé qui compte : périmètres, peaux et taux de remplissage, plus les supports.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PHOTOPOLYMÉRISATION ET FUSION DE POUDRE POLYMÈRE</div>
  <h2>Finesse de la résine, liberté de la poudre</h2>
  <div class="intro">Deux autres familles dominent pour les pièces plastiques. La photopolymérisation donne les détails les plus fins et les plus belles surfaces ; la fusion sur lit de poudre donne des pièces fonctionnelles sans supports, imbriquées par dizaines dans un même volume. Leurs contraintes de conception sont différentes de celles du fil fondu.</div>
  <h3>Photopolymérisation en cuve</h3>
  <p>Une résine liquide photosensible durcit là où elle reçoit de la lumière ultraviolette : un laser balaie la section (SLA) ou un projecteur l'éclaire en entier (DLP, plus rapide). La pièce se construit le plus souvent tête en bas, accrochée sous un plateau qui remonte de la cuve. Couches de 25 à 100 µm, détails de quelques dixièmes de millimètre, surfaces lisses ; mais <strong>supports</strong> indispensables, lavage à l'alcool, post-polymérisation sous ultraviolets, et des résines souvent fragiles, qui vieillissent à la lumière. Emplois : prototypes d'aspect, gouttières et modèles dentaires, bijouterie et modèles calcinables pour la cire perdue (voir <a href="#moulage/cours">« Moulage »</a>, §3), petites pièces précises.</p>
  <h3>Frittage laser de poudre polymère (SLS)</h3>
  <p>Une racle étale une couche de 0,1 mm de poudre de polyamide (PA12, PA11), préchauffée juste sous sa fusion ; un laser fond la section de chaque pièce. La poudre non fondue <strong>soutient</strong> les pièces : aucun support, et l'on peut <strong>empiler</strong> des dizaines de pièces dans tout le volume du bac, ou imprimer des mécanismes déjà assemblés. Pièces résistantes, presque isotropes, surface légèrement granuleuse. En fin de fabrication, le bac refroidit lentement (des heures), puis on extrait les pièces et on récupère la poudre non fondue, réutilisée en mélange avec de la poudre neuve.</p>
  <div class="method-box"><strong>Exemple — en lit de poudre, la durée dépend de la hauteur</strong>
    <p>Couche de 0,1 mm, environ 10 s par couche (étalement et passage du laser), hors préchauffage et refroidissement.</p>
    <ol>
      <li>Une seule pièce de 20 mm de haut : 200 couches, environ 33 min.</li>
      <li>60 pièces de même hauteur imbriquées sur trois étages (75 mm de hauteur utile) : 750 couches, environ 2,1 h, soit à peine plus de 2 min par pièce.</li>
      <li>On remplit donc le bac au maximum, et on oriente les pièces pour limiter la <strong>hauteur</strong> totale plutôt que leur surface.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : transposer les règles du fil fondu à la poudre. En SLS, pas de supports ni d'angle limite ; mais il faut prévoir des <strong>trous d'évacuation</strong> pour vider la poudre des volumes creux, sinon elle y reste prisonnière.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FABRICATION ADDITIVE MÉTALLIQUE</div>
  <h2>Des pièces métalliques sans outillage</h2>
  <div class="intro">La fusion laser de poudre métallique a fait passer la fabrication additive du prototype à la pièce de série en aéronautique, en médical et pour les outillages. Elle permet des pièces impossibles à mouler ou à usiner, au prix d'une fabrication lente, de supports obligatoires et d'un post-traitement lourd.</div>
  <div class="notice"><strong>Au programme de 2ᵉ année (S3), vu ici en avance</strong> : les procédés additifs pour une pièce <strong>métallique</strong> relèvent de la capacité « pièce métallique » ; cette section n'est pas exigible en PTSI. Elle est reprise dans <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>.</div>
  <h3>Fusion laser sur lit de poudre (L-PBF)</h3>
  <p>Même principe que le SLS, avec une poudre métallique fine (grains de quelques dizaines de micromètres), des couches de 20 à 60 µm, un laser de quelques centaines de watts et une atmosphère inerte (argon) pour éviter l'oxydation. Le métal fond et se resolidifie en une fraction de seconde : la pièce est dense, mais chargée de <strong>contraintes résiduelles</strong> qui la déformeraient. D'où des <strong>supports</strong> obligatoires sous les surfaces trop inclinées, qui tiennent la pièce, évacuent la chaleur et limitent les déformations. Après fabrication : traitement de détente sur le plateau, découpe du plateau, retrait des supports, parfois compression isostatique à chaud pour refermer les porosités, puis <strong>usinage des surfaces fonctionnelles</strong> et finition. Alliages usuels : titane (Ti-6Al-4V), aciers inoxydables et aciers à outils, alliages d'aluminium et de nickel.</p>
  <h3>Autres procédés métalliques</h3>
  <ul>
    <li><strong>Dépôt sous énergie concentrée</strong> : un fil ou une poudre est fondu par un laser ou un arc électrique (procédé à l'arc avec fil) ; grandes pièces brutes proches de la forme finale, à usiner ensuite, et rechargement ou réparation de pièces usées.</li>
    <li><strong>Projection de liant puis frittage</strong> : la poudre est collée couche par couche, puis la pièce « verte » est déliantée et frittée au four ; elle se contracte alors de l'ordre de 15 à 20 % en longueur, qu'il faut anticiper (voir le frittage en fin de chapitre).</li>
  </ul>
  <div class="method-box"><strong>Exemple — une ferrure en titane</strong>
    <p>Une ferrure d'avion de 150 cm³ demande 30 cm³ de supports ; la machine construit environ 15 cm³/h ; titane : \(4\,430\ \text{kg/m}^3\), poudre à 300 €/kg, heure machine à 100 €.</p>
    <ol>
      <li>Durée : \(180/15 = 12\) h ; poudre fondue : \(180\cdot10^{-6} \times 4\,430 \approx 0{,}8\) kg, soit environ 240 € ; machine : 1 200 €, avant post-traitement et usinage.</li>
      <li>Rapport « masse du brut / masse de la pièce » : 1,2 environ, contre 8 si la ferrure était usinée dans un bloc de 1 200 cm³. Pour un métal cher et énergivore comme le titane, la matière et l'énergie économisées compensent une partie du coût machine.</li>
    </ol>
  </div>
  <p><strong>Domaines</strong> : aéronautique et spatial (pièces allégées par optimisation topologique et structures en treillis, pièces regroupant plusieurs pièces assemblées : un injecteur de carburant de moteur d'avion, autrefois fait d'une vingtaine de pièces brasées, s'imprime d'un seul tenant), médical (implants à surface poreuse qui favorise la repousse osseuse, prothèses sur mesure), <strong>outillages</strong> : des inserts de moules d'injection parcourus de canaux de refroidissement qui suivent la forme de l'empreinte raccourcissent le temps de refroidissement, donc le cycle (voir l'injection dans <a href="#moulage/cours">« Moulage »</a>, §7).</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · PIÈCES COMPOSITES PAR FABRICATION ADDITIVE</div>
  <h2>Mettre des fibres dans la pièce imprimée</h2>
  <div class="intro">Le programme demande d'évaluer les procédés additifs pour une pièce composite. Deux voies existent en dépôt de fil : charger le thermoplastique de fibres courtes, ou déposer une fibre continue le long de trajectoires choisies. La seconde permet ce qu'aucun drapage ne fait facilement : courber les fibres pour suivre les efforts, par exemple autour d'un trou.</div>
  <h3>Fibres courtes</h3>
  <p>Des filaments de PA, de PETG ou de PLA chargés de 10 à 20 % de fibres de carbone ou de verre coupées (une fraction de millimètre) s'impriment comme un fil ordinaire. Les fibres, alignées par la buse, rendent la pièce deux à quatre fois plus rigide dans le sens des cordons et plus stable (moins de gauchissement) ; elles usent les buses en laiton, qu'on remplace par des buses en acier trempé.</p>
  <h3>Fibres continues</h3>
  <p>Une seconde buse dépose, dans certaines couches, un filament de fibres continues (carbone, verre ou aramide) déjà imprégné de thermoplastique, à une fraction volumique de fibres de l'ordre de 30 à 35 %. Le logiciel choisit les couches renforcées et la trajectoire des fibres. On retrouve les règles des composites (voir <a href="#moulage/cours">« Moulage »</a>, §9 à §11) : les fibres portent l'effort <strong>dans leur direction</strong> et dans le plan de la couche seulement ; entre les couches, la pièce reste aussi faible qu'une pièce imprimée ordinaire.</p>
  <div class="method-box"><strong>Exemple — ce que gagne une couche renforcée</strong>
    <p>Filament de fibres de carbone continues (\(E_f = 230\) GPa) dans du polyamide (\(E_m \approx 1{,}8\) GPa), à \(V_f = 0{,}35\).</p>
    <ol>
      <li>Loi des mélanges dans le sens des fibres : \(E_\parallel \approx 0{,}35 \times 230 + 0{,}65 \times 1{,}8 \approx 82\) GPa, environ 45 fois le polyamide seul.</li>
      <li>C'est un maximum théorique : porosités et fibres imparfaitement alignées le réduisent sensiblement en pratique. L'ordre de grandeur reste celui d'un alliage d'aluminium, pour une masse volumique proche de 1,4 g/cm³.</li>
      <li>En flexion, ce sont les fibres <strong>éloignées du plan moyen</strong> qui servent le plus : on renforce les couches du haut et du bas plutôt que celles du milieu.</li>
    </ol>
  </div>
  <p><strong>Domaines</strong> : outillages légers et rigides (mors, gabarits, préhenseurs de robots), pièces de structure en petite série (drones, prototypes de compétition). Industriellement, la <strong>dépose automatisée de fibres</strong> par robot, bande par bande, construit aussi les grandes pièces aéronautiques de façon additive, avant cuisson.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ANISOTROPIE ET ORIENTATION DES COUCHES</div>
  <h2>Le plan des couches est le plan fort</h2>
  <div class="intro">Une pièce imprimée n'est pas homogène : elle est faite de couches soudées les unes aux autres, et ces soudures sont ses points faibles. Le choix de l'orientation sur le plateau est donc une décision de conception, au même titre que la forme.</div>

</figure>
  <ul>
    <li>En <strong>dépôt de fil</strong>, la résistance dans la direction de construction \(z\) (à travers les couches) vaut souvent la moitié, parfois moins, de celle obtenue dans le plan des couches ; la rupture se fait par décollement d'une couche.</li>
    <li>En <strong>fusion de poudre polymère</strong> et en <strong>photopolymérisation</strong>, l'anisotropie est faible ; en fusion de poudre <strong>métallique</strong>, elle reste sensible avant traitement thermique.</li>
    <li>Règle : orienter la pièce pour que les efforts principaux (traction, flexion) soient dans le <strong>plan des couches</strong> ; éviter qu'une couche soit tirée ou cisaillée par l'effort principal, surtout au raccord d'un détail fin (crochet, languette, fût de vis).</li>
  </ul>
  <div class="method-box"><strong>Exemple — un tirant imprimé</strong>
    <p>Un tirant de section carrée de 8 × 8 mm transmet \(F = 1\,500\) N ; on veut un coefficient de sécurité de 2. PLA en dépôt de fil : résistance d'environ 50 MPa dans le plan des couches, 25 MPa à travers elles (valeurs typiques données).</p>
    <ol>
      <li>Contrainte : \(\sigma = F/S = 1\,500/64 \approx 23{,}4\) MPa ; il faut une résistance d'au moins 46,9 MPa.</li>
      <li>Imprimé couché (effort dans le plan des couches) : 50 MPa, le tirant convient.</li>
      <li>Imprimé debout (effort à travers les couches) : 25 MPa, il casserait. Il faudrait une section de \(\sqrt{2 \times 1\,500/25} \approx 11\) mm de côté : l'orientation vaut ici près de deux fois la section.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · PORTE-À-FAUX, PONTS ET SUPPORTS</div>
  <h2>On ne dépose pas de matière dans le vide</h2>
  <div class="intro">Chaque couche doit reposer sur la précédente. Une surface qui regarde vers le bas (un surplomb) n'a rien en dessous : au-delà d'une certaine inclinaison, il faut des supports, qui coûtent de la matière, du temps et laissent des traces. Bien dessiner, c'est d'abord éviter les supports inutiles.</div>

<figcaption>Porte-à-faux en dépôt de fil (\( h = 0{,}2 \) mm, cordon de largeur \( w = 0{,}45 \) mm, à l'échelle). Chaque couche déborde de \( d = h/\tan\alpha \) sur la précédente ; tant que \( d \leq w/2 \), le cordon repose encore à moitié sur celui du dessous. Au-delà (ici à 30°), il s'affaisse : il faut des <strong>supports</strong>, ou redessiner, comme ce trou horizontal dont le haut est remplacé par un toit à 45°.</figcaption>
</figure>
  <p>Soit \(\alpha\) l'angle d'une surface en surplomb avec le plan des couches (90° pour une paroi verticale). Chaque couche déborde de \(d = h/\tan\alpha\) sur la précédente. En dépôt de fil, un cordon tient tant qu'il repose au moins à moitié sur celui du dessous, c'est-à-dire \(d \leq w/2\) :</p>
  <div class="formula" data-nom="Angle limite de porte-à-faux (dépôt de fil)">$$\tan\alpha \;\geq\; \frac{2h}{w}$$</div>
  <div class="method-box"><strong>Exemple — la règle des 45°</strong>
    <ol>
      <li>Avec \(h = 0{,}2\) mm et \(w = 0{,}45\) mm : \(\tan\alpha \geq 0{,}89\), soit \(\alpha \geq 42°\). C'est l'origine de la règle pratique : <strong>pas de support au-dessus de 45° environ</strong>.</li>
      <li>À 30°, chaque couche déborde de 0,35 mm, plus de la moitié du cordon : il s'affaisse. À 45°, 0,20 mm : il tient.</li>
      <li>Ce modèle purement géométrique ignore le refroidissement du cordon et l'affaissement de la matière chaude ; en pratique on garde 45° comme limite sûre.</li>
    </ol>
  </div>
  <h3>Règles de conception</h3>
  <ul>
    <li>Limiter les surplombs à environ 45° (dépôt de fil, fusion de poudre métallique) ; au-delà, prévoir des <strong>supports</strong> accessibles pour être retirés, ou modifier la forme.</li>
    <li>Sous une arête en surplomb, préférer un <strong>chanfrein à 45°</strong> à un congé (le bas d'un congé est presque horizontal).</li>
    <li><strong>Trous horizontaux</strong> de plus de quelques millimètres : forme « en goutte » à toit à 45°, ou trou réalisé plus petit puis percé.</li>
    <li><strong>Ponts</strong> : en dépôt de fil, une couche peut franchir horizontalement un vide entre deux appuis sur une dizaine de millimètres environ ; au-delà, elle s'affaisse.</li>
    <li>Éviter les supports <strong>inaccessibles</strong> (dans une cavité fermée) : on ne pourrait pas les retirer.</li>
    <li>En fusion de poudre polymère, aucune de ces contraintes : la poudre porte tout. En fusion de métal, les supports servent aussi à évacuer la chaleur et à tenir la pièce contre les contraintes résiduelles.</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : compter seulement la matière de la pièce. Les supports peuvent doubler la durée d'impression, gaspiller de la matière et laisser des surfaces abîmées : choisir l'orientation (§11) et dessiner pour les éviter.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ÉPAISSEURS, TROUS, JEUX ET PRÉCISION</div>
  <h2>Les dimensions qu'un procédé additif sait tenir</h2>
  <div class="intro">Chaque procédé a ses dimensions minimales et sa précision. Les ignorer donne des parois qui ne s'impriment pas, des trous trop petits et des assemblages bloqués. Ces valeurs sont des ordres de grandeur : elles varient avec la machine et la matière.</div>
  <table>
    <tr><th>Procédé</th><th>Paroi minimale</th><th>Précision usuelle</th><th>Jeu entre pièces imprimées</th></tr>
    <tr><td>dépôt de fil</td><td>≈ 2 cordons (0,8 à 1 mm)</td><td>±0,2 mm environ</td><td>0,2 à 0,5 mm</td></tr>
    <tr><td>photopolymérisation</td><td>≈ 0,5 mm</td><td>±0,05 à 0,1 mm</td><td>0,1 à 0,2 mm</td></tr>
    <tr><td>fusion de poudre polymère</td><td>≈ 0,8 à 1 mm</td><td>±0,1 à 0,3 mm</td><td>0,2 à 0,5 mm</td></tr>
    <tr><td>fusion de poudre métallique</td><td>≈ 0,3 à 0,5 mm</td><td>±0,05 à 0,1 mm (brut)</td><td>surfaces fonctionnelles usinées</td></tr>
  </table>
  <ul>
    <li><strong>Épaisseurs</strong> : en dépôt de fil, une paroi est faite d'un nombre entier de cordons ; on choisit une épaisseur multiple de \(w\). Comme pour le moulage, des épaisseurs régulières limitent les déformations au refroidissement.</li>
    <li><strong>Trous</strong> : les trous verticaux sortent un peu trop petits (contraction et facettes) ; un trou précis est imprimé un peu plus petit puis percé ou alésé.</li>
    <li><strong>Assemblages</strong> : prévoir le jeu du tableau entre deux pièces imprimées ; pour un filetage solide, un insert métallique posé à chaud ou un écrou prisonnier plutôt qu'un filet imprimé.</li>
    <li><strong>Pièces creuses</strong> en poudre ou en résine : trous d'évacuation de quelques millimètres.</li>
    <li><strong>Grandes surfaces planes</strong> à plat sur le plateau : risque de décollement et de gauchissement (retrait des couches) ; arrondir les coins, élargir l'adhérence ou alléger la pièce.</li>
  </ul>
  <div class="method-box"><strong>Exemple — une paroi et un alésage en dépôt de fil</strong>
    <p>Cordon \(w = 0{,}45\) mm.</p>
    <ol>
      <li>Une paroi dessinée à 1,2 mm vaut \(1{,}2/0{,}45 \approx 2{,}7\) cordons : le logiciel remplit mal le reste. On la dessine à 0,9 mm (2 cordons) ou 1,35 mm (3 cordons).</li>
      <li>Un axe de ∅8 mm doit tourner dans une pièce imprimée : on dessine l'alésage à ∅8,4 mm (jeu de 0,2 mm par côté), ou on l'imprime à ∅7,8 mm et on l'alèse à la cote.</li>
    </ol>
  </div>
</div>

  <div class="sec-num">§10 · ÉTAT DE SURFACE ET EFFET D'ESCALIER</div>

<figcaption>Effet d'escalier (\( h = 0{,}2 \) mm, \( \alpha = 25° \), à l'échelle). La surface voulue (tirets) est remplacée par des marches ; l'écart maximal vaut \( c = h\cos\alpha \) : nul pour une paroi verticale, maximal pour une surface presque horizontale. Le profil en dents de scie donne \( R_a \approx c/4 \).</figcaption>
</figure>
  <p>Pour une surface inclinée d'un angle \(\alpha\) sur le plan des couches, l'écart maximal entre la surface voulue et les marches vaut \(c = h\cos\alpha\) ; le profil en dents de scie correspond à une rugosité \(R_a \approx c/4\) (modèle géométrique, qui ignore la forme arrondie des cordons) :</p>
  <div class="formula" data-nom="Effet d'escalier">$$c = h\cos\alpha \qquad R_a \approx \frac{c}{4}$$</div>
  <div class="method-box"><strong>Exemple — couche de 0,2 ou de 0,1 mm ?</strong>
    <ol>
      <li>\(h = 0{,}2\) mm : surface à 20° de l'horizontale, \(c \approx 0{,}19\) mm et \(R_a \approx 47\) µm ; à 60°, \(c = 0{,}10\) mm et \(R_a \approx 25\) µm ; une paroi presque verticale (85°) n'a presque plus de marches (\(R_a \approx 4\) µm, en fait limité par la forme des cordons).</li>
      <li>\(h = 0{,}1\) mm : toutes ces valeurs sont divisées par 2, mais la durée d'impression double.</li>
      <li>Les surfaces faiblement inclinées sont les plus marquées : on oriente la pièce pour que les surfaces d'aspect soient verticales ou horizontales.</li>
    </ol>
  </div>
  <h3>Finition</h3>
  <ul>
    <li>Polymères : ponçage, sablage, lissage chimique (vapeur de solvant), apprêt et peinture.</li>
    <li>Métaux : sablage ou microbillage, polissage ; les <strong>surfaces fonctionnelles</strong> (portées, alésages, faces d'appui) sont dessinées avec une surépaisseur (de l'ordre de 0,5 à 1 mm) puis <strong>usinées</strong>, comme un brut de fonderie.</li>
    <li>Ordres de grandeur bruts : de quelques micromètres (résine, faces verticales) à 10 à 50 µm (dépôt de fil et fusion de poudre sur faces inclinées) ; un usinage de finition descend à \(R_a\) 0,8 à 3,2 µm.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§11 · ADDITIF, MOULÉ OU USINÉ ?</div>
  <h2>Domaines d'application et choix du procédé</h2>
  <div class="intro">La fabrication additive ne remplace ni le moulage ni l'usinage : elle occupe les cas où l'outillage serait trop cher pour la série, où la forme est impossible autrement, ou où la pièce doit être personnalisée. Choisir, c'est situer la pièce par rapport à ces trois cas, puis comparer les coûts.</div>
  <h3>Quand l'additif s'impose</h3>
  <ul>
    <li><strong>Prototypage rapide</strong> : on passe du modèle à la pièce en quelques heures, sans outillage ; on vérifie formes, montages et ergonomie avant de payer un moule.</li>
    <li><strong>Formes impossibles autrement</strong> : canaux internes courbes, structures en treillis, formes issues d'une optimisation topologique, mécanismes imprimés assemblés.</li>
    <li><strong>Petites séries et pièces uniques</strong> : outillages, pièces de rechange à la demande, pièces personnalisées (orthèses, prothèses, gouttières dentaires).</li>
    <li><strong>Regroupement de pièces</strong> : une pièce imprimée en remplace plusieurs assemblées (moins de fixations, moins de stocks).</li>
  </ul>
  <h3>Ses limites</h3>
  <p>Cadence faible, volume de fabrication limité (quelques dizaines de centimètres en général), matière première chère (poudres, résines), anisotropie, état de surface et précision qui imposent souvent une reprise d'usinage, contrôle délicat des défauts internes. Additif et usinage sont souvent <strong>complémentaires</strong> : on imprime un brut proche de la forme finale, puis on usine ses surfaces fonctionnelles.</p>
  <p>On compare les coûts comme pour le moulage : un coût fixe \(C_o\) faible pour l'additif (préparation du fichier, réglages), mais un coût variable \(C_v\) élevé (temps machine, matière) :</p>
  <div class="formula">$$C_u(N) = C_v + \frac{C_o}{N}$$</div>

</figure>
  <div class="method-box"><strong>Exemple — imprimer ou injecter un petit boîtier ?</strong>
    <p>Fabrication additive en lit de poudre : \(C_{o1} = 150\) €, \(C_{v1} = 6\) € ; injection : moule \(C_{o2} = 20\,000\) €, \(C_{v2} = 0{,}60\) €.</p>
    <ol>
      <li>\(N^* = \dfrac{20\,000 - 150}{6 - 0{,}60} \approx 3\,700\) boîtiers.</li>
      <li>Pour 100 boîtiers : 7,50 € imprimés contre 200 € injectés ; pour 10 000 : 6 € contre 2,60 €.</li>
      <li>Stratégie courante : premières séries imprimées pendant la fabrication du moule, puis injection quand la demande est confirmée ; le dessin doit alors respecter les règles des deux procédés (dépouilles, épaisseurs régulières).</li>
    </ol>
  </div>
  <p><strong>Impact environnemental</strong> : peu de chutes et un brut proche de la forme finale (rapport brut / pièce voisin de 1), pas d'outillage, production à la demande sans stock ; mais une consommation d'énergie élevée par kilogramme produit, des poudres dont la fabrication est énergivore, et des supports perdus. L'additif est d'autant plus intéressant que le matériau est cher et que la pièce allégée sert longtemps (une pièce d'avion plus légère économise du carburant pendant des décennies). La comparaison avec tous les procédés est faite en 2ᵉ année dans <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a> (§7), et avec le moulage dans <a href="#moulage/cours">« Moulage »</a> (§12).</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · FRITTAGE CONVENTIONNEL</div>
  <h2>La métallurgie des poudres (culture technique, hors programme)</h2>
  <div class="intro">Le frittage conventionnel n'est au programme d'aucune des deux années. Il éclaire pourtant deux procédés additifs (le frittage laser et la projection de liant suivie d'un frittage) et reste un grand procédé de série pour les petites pièces mécaniques.</div>
  <p>On <strong>comprime</strong> une poudre métallique ou céramique dans une matrice entre deux poinçons : on obtient un comprimé « à cru », fragile. On le chauffe ensuite <strong>sous sa température de fusion</strong> : les grains se soudent par diffusion à l'état solide, la pièce se densifie et durcit. Une calibration, une imprégnation ou un léger usinage peuvent suivre.</p>

<figcaption>Métallurgie des poudres : (1) la poudre est comprimée dans une matrice entre deux poinçons (comprimé « à cru », fragile) ; (2) chauffée sous sa température de fusion, elle se densifie : les grains se soudent par diffusion à l'état solide.</figcaption>
</figure>
  <ul>
    <li><strong>Atouts</strong> : pièces à la forme quasi définitive (« near net shape », peu d'usinage), grandes séries (pignons, cames, bagues), matériaux difficiles à fondre ou à usiner (carbures des plaquettes de coupe, métaux réfractaires), mélanges de matériaux, <strong>porosité contrôlée</strong>.</li>
    <li><strong>Limites</strong> : outillage coûteux (rentable en grande série), formes limitées par la compression dans un seul axe (pas de contre-dépouille ni de trou transversal), porosité résiduelle qui abaisse les propriétés mécaniques, pièces de taille modérée.</li>
  </ul>
  <div class="method-box"><strong>Exemple — porosité d'un acier fritté</strong>
    <ol>
      <li>Une bague en acier fritté a une masse volumique de 6,8 g/cm³, contre 7,87 g/cm³ pour l'acier massif : porosité \(1 - 6{,}8/7{,}87 \approx 14\,\%\).</li>
      <li>Un coussinet en bronze fritté poreux à 25 %, de 2 cm³, peut stocker 0,5 cm³ d'huile : c'est le palier <strong>autolubrifiant</strong>, qui restitue son huile en chauffant pendant le fonctionnement.</li>
    </ol>
  </div>

<template class="pan-tpl" data-panneau="fad-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · FABRICATION ADDITIVE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à choisir un procédé additif, à préparer et chiffrer une impression, et surtout à dessiner une pièce qui s'imprime bien : orientation, surplombs, épaisseurs, jeux, état de surface. Elles s'appliquent à toutes les familles, avec les nuances données pour chacune.</div>

  <div class="method-box"><strong>Méthode 1 — Préparer une impression</strong>
    <ol>
      <li>Exporter le modèle en facettes avec une flèche \(\delta = R\left(1 - \cos(\pi/n)\right)\) petite devant la tolérance (quelques centièmes de millimètre).</li>
      <li>Choisir l'<strong>orientation</strong> (méthode 4), puis générer les <strong>supports</strong> nécessaires (méthode 5).</li>
      <li>Choisir l'épaisseur de couche \(h\) : compromis entre durée (proportionnelle au nombre de couches) et marches (méthode 7).</li>
      <li>En dépôt de fil, choisir le nombre de périmètres, de couches pleines et le taux de remplissage d'après la résistance voulue.</li>
      <li>Prévoir le <strong>post-traitement</strong> : retrait des supports, nettoyage, reprise d'usinage des surfaces fonctionnelles.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour un alésage de rayon 10 mm et une flèche d'au plus 0,02 mm, il faut \(\cos(\pi/n) \geq 0{,}998\), soit au moins 50 facettes sur le tour.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Choisir une famille de procédé additif</strong>
    <ol>
      <li><strong>Matériau</strong> : thermoplastique en fil (dépôt de fil), résine (cuve), poudre polymère ou métallique (lit de poudre), sable (projection de liant), métal en fil (dépôt sous énergie concentrée).</li>
      <li><strong>Usage</strong> : aspect et détails fins (résine), pièce fonctionnelle (poudre polymère, fil technique), pièce métallique (lit de poudre métallique).</li>
      <li><strong>Géométrie</strong> : surplombs nombreux ou mécanismes imbriqués (poudre polymère, sans supports), très grande pièce (dépôt de fil de grand format, dépôt sous énergie concentrée).</li>
      <li><strong>Quantité</strong> : une pièce (fil), des dizaines à des centaines (lit de poudre, imbriquées dans le bac).</li>
    </ol>
    <p><em>Exemple éclair :</em> un gabarit de perçage pour l'atelier : dépôt de fil ; 40 clips fonctionnels en PA : frittage de poudre ; une maquette d'aspect à détails fins : résine ; une ferrure en titane : fusion laser de poudre métallique (2ᵉ année).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Estimer masse, durée et coût d'une impression par dépôt de fil</strong>
    <ol>
      <li>Décomposer le volume <strong>déposé</strong> : parois (périmètres × hauteur), peaux pleines (haut et bas), remplissage intérieur × taux, supports.</li>
      <li>Masse : volume déposé × masse volumique de la matière.</li>
      <li>Durée : volume déposé / débit \(Q = w\,h\,v\), majorée d'environ 25 % pour les déplacements à vide.</li>
      <li>Coût : matière (€/kg) + temps machine (€/h) + préparation et post-traitement.</li>
    </ol>
    <p><em>Exemple éclair :</em> 8 cm³ déposés de PETG (\(1{,}27\ \text{g/cm}^3\)) avec \(w = 0{,}5\) mm, \(h = 0{,}25\) mm, \(v = 50\) mm/s : \(Q = 6{,}25\ \text{mm}^3/\text{s}\), soit environ 21 min de dépôt (27 min en tout) pour 10 g de matière.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Choisir l'orientation sur le plateau</strong>
    <ol>
      <li>Mettre les efforts principaux dans le <strong>plan des couches</strong> (anisotropie, surtout en dépôt de fil).</li>
      <li>Placer les surfaces fonctionnelles et d'aspect <strong>verticales ou sur le dessus</strong>, jamais sur des supports.</li>
      <li>Limiter les <strong>surplombs</strong> au-delà de 45° et donc les supports.</li>
      <li>Réduire la <strong>hauteur</strong> (nombre de couches) quand la durée en dépend (lit de poudre, cuve).</li>
      <li>Poser une grande face plane sur le plateau (stabilité, adhérence), en surveillant le gauchissement.</li>
    </ol>
    <p><em>Exemple éclair :</em> une équerre en L dont les deux branches sont fléchies s'imprime à plat, le L dans le plan du plateau : les deux branches travaillent dans le plan des couches. Debout, l'une des branches serait tirée à travers les couches.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : optimiser un seul critère. L'orientation qui minimise la durée met souvent une face fonctionnelle sur des supports ou l'effort à travers les couches ; on classe les critères (résistance, fonction, aspect, supports, durée) avant de choisir.</div>

  <div class="method-box"><strong>Méthode 5 — Repérer les surplombs et décider des supports</strong>
    <ol>
      <li>Repérer les surfaces qui regardent vers le bas et mesurer leur angle \(\alpha\) avec le plan des couches.</li>
      <li>En dépôt de fil, pas de support tant que \(\tan\alpha \geq 2h/w\), soit environ 45° en pratique.</li>
      <li>Sinon, modifier la forme : chanfrein à 45° au lieu d'un congé sous une arête, trou horizontal en goutte, découpe en deux pièces, ou autre orientation.</li>
      <li>Ponts horizontaux : limités à une dizaine de millimètres environ en dépôt de fil.</li>
      <li>Vérifier que tout support reste <strong>accessible</strong> pour être retiré.</li>
    </ol>
    <p><em>Exemple éclair :</em> en couches de 0,3 mm avec des cordons de 0,5 mm, \(\tan\alpha \geq 1{,}2\), soit \(\alpha \geq 50°\) : des couches épaisses supportent moins bien les surplombs.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Dimensionner parois, trous et jeux</strong>
    <ol>
      <li>Respecter la <strong>paroi minimale</strong> du procédé ; en dépôt de fil, prendre un multiple de la largeur de cordon \(w\).</li>
      <li>Imprimer les trous précis un peu plus petits, puis les <strong>percer ou aléser</strong>.</li>
      <li>Prévoir le <strong>jeu</strong> d'assemblage entre pièces imprimées (0,2 à 0,5 mm en dépôt de fil ou en poudre, 0,1 à 0,2 mm en résine).</li>
      <li>Remplacer les filets imprimés par des inserts ou des écrous prisonniers ; prévoir des trous d'évacuation dans les pièces creuses (poudre, résine).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(w = 0{,}5\) mm, une paroi de 1,5 mm (3 cordons) ; un alésage imprimé pour un axe de ∅10 mm se dessine à ∅10,5 mm en dépôt de fil.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Estimer l'effet d'escalier et choisir l'épaisseur de couche</strong>
    <ol>
      <li>Repérer la surface la plus défavorable : la plus faiblement inclinée par rapport au plan des couches (angle \(\alpha\) petit).</li>
      <li>Calculer \(c = h\cos\alpha\) et \(R_a \approx c/4\).</li>
      <li>En déduire l'épaisseur de couche maximale pour la rugosité visée, en sachant que la durée varie comme \(1/h\).</li>
      <li>Si \(h\) devient trop petit, réorienter la pièce ou prévoir une finition (ponçage, usinage).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(R_a \leq 20\) µm sur une face à 30°, il faut \(c \leq 80\) µm, soit \(h \leq 0{,}08/\cos 30° \approx 0{,}09\) mm : des couches de 0,08 mm.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Tenir compte de l'anisotropie dans un dimensionnement</strong>
    <ol>
      <li>Identifier la direction de l'effort par rapport aux couches.</li>
      <li>Prendre la résistance correspondante (dans le plan des couches ou à travers elles, valeurs données).</li>
      <li>Écrire la condition \(\sigma \leq R/s\) (\(s\) : coefficient de sécurité), et en déduire la section ou l'orientation.</li>
    </ol>
    <p><em>Exemple éclair :</em> une languette en PETG tirée par 900 N avec \(s = 2\) ; résistance 45 MPa dans le plan des couches, 20 MPa à travers : section d'au moins 40 mm² imprimée couchée, 90 mm² imprimée debout.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Concevoir une pièce composite imprimée</strong>
    <ol>
      <li>Repérer les trajets d'effort ; placer les <strong>fibres continues</strong> dans le plan des couches, le long de ces trajets et en boucle autour des trous de fixation.</li>
      <li>En flexion, renforcer les couches <strong>éloignées du plan moyen</strong> (haut et bas de la pièce).</li>
      <li>Estimer la rigidité d'une couche renforcée par la loi des mélanges (valeur maximale) ; ne pas compter sur les fibres pour les efforts à travers les couches.</li>
      <li>Garder des rayons de courbure suffisants pour la fibre et des épaisseurs régulières.</li>
    </ol>
    <p><em>Exemple éclair :</em> fibre de verre continue (\(E_f = 72\) GPa) dans du polyamide (\(E_m = 1{,}8\) GPa) à \(V_f = 0{,}35\) : \(E_\parallel \approx 0{,}35 \times 72 + 0{,}65 \times 1{,}8 \approx 26\) GPa au plus, quinze fois le polyamide seul.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Choisir entre additif, moulage et usinage</strong>
    <ol>
      <li>Vérifier les cas où l'additif s'impose : prototype, forme impossible autrement, pièce personnalisée, très petite série.</li>
      <li>Sinon, comparer les coûts : \(C_u = C_v + C_o/N\), seuil \(N^* = \dfrac{C_{o2} - C_{o1}}{C_{v1} - C_{v2}}\), et le confronter à la série totale prévue.</li>
      <li>Intégrer la finition : un brut imprimé dont les surfaces fonctionnelles sont usinées est souvent la meilleure solution.</li>
      <li>Ajouter l'argument environnemental : peu de chutes, pas d'outillage, mais beaucoup d'énergie par kilogramme.</li>
    </ol>
    <p><em>Exemple éclair :</em> frittage de poudre (\(C_o = 100\) €, \(C_v = 9\) €) ou injection (\(C_o = 12\,000\) €, \(C_v = 0{,}40\) €) : \(N^* = 11\,900/8{,}6 \approx 1\,380\) pièces.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : comparer les procédés sur une seule pièce ou sur la série d'une année. Le moule d'injection s'amortit sur toute la vie du produit ; une petite série annuelle peut dépasser le seuil en quelques années.</div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Additif ou soustractif ?</h3>
  <div class="statement">On compare la fabrication additive et l'usinage.</div>
  <div class="q"><strong>Q1.</strong> En quoi sont-ils opposés ?</div>
  <div class="q"><strong>Q2.</strong> Pour une pièce avec des canaux internes complexes, lequel choisir et pourquoi ?</div>
  <div class="q"><strong>Q3.</strong> Citer deux limites de la fabrication additive.</div>
  <div class="q"><strong>Q4.</strong> Ces deux procédés sont-ils concurrents ou complémentaires ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La fabrication additive <strong>ajoute</strong> la matière couche par couche ; l'usinage en <strong>enlève</strong> (soustractif).</p>
    <p><strong>Q2.</strong> La <strong>fabrication additive</strong> : seule capable de réaliser des canaux internes complexes sans outillage ni accès d'outil.</p>
    <p><strong>Q3.</strong> Par exemple : lenteur (couche par couche), état de surface en marches d'escalier et précision moyenne (finition souvent nécessaire), anisotropie (le plan des couches est plus résistant que la direction de construction).</p>
    <p><strong>Q4.</strong> Ils sont souvent <strong>complémentaires</strong> : on imprime un brut proche de la forme finale, puis on usine ses surfaces fonctionnelles (portées, alésages, faces d'appui).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Facettes et couches</h3>
  <div class="statement">Une poignée comporte une portée cylindrique de rayon \(R = 15\) mm et mesure 30 mm de haut. Le modèle est exporté en facettes, puis tranché en couches de 0,15 mm.</div>
  <div class="q"><strong>Q1.</strong> L'export découpe chaque cercle en 36 facettes. Calculer la flèche \(\delta = R\left(1 - \cos(\pi/n)\right)\).</div>
  <div class="q"><strong>Q2.</strong> Combien de facettes faut-il pour une flèche d'au plus 0,02 mm ?</div>

    <p><strong>Q3.</strong> Le débit passe à \(6{,}75\ \text{mm}^3/\text{s}\) (× 1,5) : la durée tombe aux deux tiers (environ 45 min) et le nombre de couches de 150 à 100. On perd en état de surface sur les faces inclinées et arrondies (marches plus hautes), en finesse des détails, et un peu en adhésion entre couches.</p>

  <div class="q"><strong>B1.</strong> L'équerre casse au raccord des deux ailes lors des essais. Proposer deux modifications de forme, en respectant une épaisseur à peu près constante.</div>
  <div class="q"><strong>B2.</strong> Comment réaliser les trous de passage des vis M5 et le trou taraudé de la caméra ?</div>
  <div class="q"><strong>B3.</strong> Pour alléger l'équerre, on la creuse en remplaçant le cœur des ailes par un treillis enfermé dans une peau. Quelle précaution est indispensable en frittage de poudre ?</div>

  <p class="exo-part">Partie C — Coût et délai</p>
  <div class="q"><strong>C1.</strong> On place 40 équerres dans une fabrication de 60 mm de hauteur utile ; couches de 0,1 mm, 9 s par couche, 1 h de préchauffage et 4 h de refroidissement ; l'heure de machine coûte 40 €. La poudre coûte 60 €/kg et l'on compte 25 g de poudre consommée par équerre. Calculer le coût variable par équerre. Pourquoi la poudre consommée dépasse-t-elle la masse de la pièce ?</div>
  <div class="q"><strong>C2.</strong> Avec \(C_o = 100\) € pour l'additif, et pour l'injection un moule \(C_o = 18\,000\) € et \(C_v = 0{,}90\) €, calculer le seuil de rentabilité. Conclure sur les 5 ans de production.</div>
  <div class="q"><strong>C3.</strong> Donner deux arguments, autres que le coût unitaire, en faveur de la solution retenue.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> 300 pièces par an, avec des variantes : un moule d'injection par variante ne serait pas amorti, et la forme changerait au gré des caméras. Le <strong>dépôt de fil</strong> est le moins cher par machine, mais la pièce serait anisotrope (les ailes fléchies travailleraient à travers les couches dans l'une des deux, quelle que soit l'orientation choisie pour l'autre) et de précision moyenne. Le <strong>frittage de poudre</strong> donne des pièces presque isotropes, en PA12 résistant, sans supports, et permet d'imbriquer des dizaines d'équerres (et leurs variantes) dans un même bac.</p>
    <p><strong>A2.</strong> Non : sans supports ni angle limite, et avec une faible anisotropie, le critère prioritaire devient la <strong>hauteur</strong> occupée dans le bac, qui fixe la durée de fabrication : on imbrique les équerres pour remplir le volume avec le moins de couches possible. On veille aussi à ne pas placer les faces d'appui faiblement inclinées (marches).</p>
    <p><strong>B1.</strong> Un <strong>congé intérieur</strong> généreux au raccord (avec un rayon extérieur égal au rayon intérieur plus l'épaisseur, pour garder l'épaisseur constante), qui supprime la concentration de contraintes de l'angle vif ; et un ou deux <strong>goussets</strong> (nervures triangulaires) entre les ailes, de même épaisseur que les parois.</p>
    <p><strong>B2.</strong> Les trous de passage peuvent être imprimés directement (∅5,5 mm, la précision du frittage suffit pour un trou de passage), ou imprimés un peu plus petits et repris au foret pour un positionnement précis. Le trou de fixation de la caméra reçoit un <strong>insert fileté métallique</strong> posé à chaud : un filet en polyamide imprimé s'userait au montage et démontage.</p>
    <p><strong>B3.</strong> Prévoir des <strong>trous d'évacuation</strong> (quelques millimètres) dans la peau : sinon la poudre non fondue reste prisonnière dans le treillis, la pièce n'est pas allégée et le volume ne peut pas être nettoyé.</p>
    <p><strong>C1.</strong> Couches : \(60/0{,}1 = 600\) ; fabrication \(600 \times 9 = 5\,400\) s = 1,5 h ; avec préchauffage et refroidissement, 6,5 h de machine, soit 260 € pour 40 équerres : 6,50 € chacune. Poudre : \(0{,}025 \times 60 = 1{,}50\) €. Coût variable : \(C_v \approx 8\) € par équerre. La poudre non fondue autour des pièces, chauffée longuement, se dégrade : on n'en réutilise qu'une partie, mélangée à de la poudre neuve ; la consommation dépasse donc la masse des pièces (18 g).</p>
    <p><strong>C2.</strong> \(N^* = \dfrac{18\,000 - 100}{8 - 0{,}90} \approx 2\,520\) équerres. Sur 5 ans, \(5 \times 300 = 1\,500\) équerres, en dessous du seuil : la fabrication additive coûte \(100 + 8 \times 1\,500 = 12\,100\) € contre \(18\,000 + 0{,}9 \times 1\,500 = 19\,350\) € pour l'injection (et davantage avec un moule par variante). On retient le frittage de poudre.</p>
    <p><strong>C3.</strong> Aucun outillage : une nouvelle variante coûte seulement un fichier, et les modifications de dessin (B1) sont immédiates. Délai : une fabrication par mois environ suffit, livrée en un jour, au lieu des semaines de fabrication d'un moule ; pas de stock à constituer. On peut ajouter l'allègement par treillis, impossible à mouler.</p>
  </div>
