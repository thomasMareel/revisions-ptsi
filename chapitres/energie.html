  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 2.3 du programme de PTSI, « Approche énergétique du mouvement d'un point matériel ». Il prolonge les lois de Newton (chapitre « Principes de la dynamique ») par une démarche scalaire, fondée sur la conservation de l'énergie mécanique, et prépare les chapitres « Oscillateurs harmoniques » (petits mouvements, oscillateur amorti), « Mouvement dans un champ central » (énergie potentielle effective) et « Mouvement d'un solide » (pendule pesant). L'énergie potentielle électrostatique sert dans « Particules chargées ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Puissance et travail d'une force dans un référentiel</strong> : reconnaître le caractère moteur ou résistant d'une force (§1).</li>
        <li><strong>Théorèmes de l'énergie cinétique et de la puissance cinétique</strong>, dans un référentiel galiléen, pour un point matériel : utiliser le théorème approprié en fonction du contexte (§2).</li>
        <li><strong>Énergie potentielle, lien avec une force conservative, gradient</strong> : déterminer l'expression d'une force à partir de l'énergie potentielle (l'expression du gradient étant fournie) ; déduire qualitativement, en un point du graphe d'une énergie potentielle, le sens et l'intensité de la force associée (§3).</li>
        <li><strong>Énergies potentielles usuelles</strong> : établir et citer celles de pesanteur (champ uniforme), de gravitation (astre ponctuel) et élastique ; l'énergie potentielle électrostatique \(qV\) sert au bilan énergétique d'une particule chargée (partie 2.4) (§4).</li>
        <li><strong>Énergie mécanique, théorème de l'énergie mécanique, mouvement conservatif</strong> : distinguer force conservative et force non conservative ; reconnaître les cas de conservation de l'énergie mécanique ; utiliser les conditions initiales (§5).</li>
        <li><strong>Mouvement conservatif à une dimension</strong> : identifier sur un graphe d'énergie potentielle une barrière et un puits ; en déduire le comportement qualitatif (trajectoire bornée ou non, mouvement périodique, positions de vitesse nulle) (§6).</li>
        <li><strong>Positions d'équilibre et stabilité</strong> : les déduire d'un graphe d'énergie potentielle et analyser leur nature, stable ou instable (§7).</li>
        <li><strong>Petits mouvements au voisinage d'un équilibre stable</strong>, approximation locale par un puits harmonique : établir l'équation différentielle du mouvement (§8).</li>
        <li><strong>Capacité numérique</strong> : à l'aide d'un langage de programmation, résoudre numériquement une équation différentielle du deuxième ordre non linéaire et faire apparaître l'effet des termes non linéaires (§9, §10).</li>
        <li><strong>Prévoir l'évolution d'un système à partir de considérations énergétiques</strong> (partie 1.4) : bilans avec frottement, oscillateur amorti (§11).</li>
      </ul>
      <p>Le portrait de phase (§9) n'est pas cité par le programme : c'est un outil de lecture graphique, très utilisé dans les sujets, qui accompagne la résolution numérique. Hors programme (regroupé en fin de chapitre) : le calcul d'une période par une intégrale, le critère général d'existence d'une énergie potentielle en trois dimensions, l'effet tunnel.</p>

<div class="course-section">
  <div class="sec-num">§1 · PUISSANCE ET TRAVAIL D'UNE FORCE</div>
  <h2>Mesurer ce qu'une force apporte au mouvement</h2>
  <div class="intro">Une force qui pousse un objet dans le sens de son mouvement l'accélère ; une force perpendiculaire au mouvement ne change pas sa vitesse. La puissance et le travail chiffrent cet apport : ce sont des grandeurs scalaires, qui ne retiennent de la force que sa composante le long de la vitesse.</div>
  <div class="def-box">
    <strong>Puissance et travail.</strong> Dans un référentiel \(\mathcal R\), un point \(M\) de vitesse \(\vec v\) subit une force \(\vec F\). La <strong>puissance</strong> de la force (en watts, W) et son <strong>travail élémentaire</strong> pendant \(\mathrm{d}t\) (en joules, J) sont
    <div class="formula" data-nom="Puissance et travail élémentaire">$$\mathcal P=\vec F\cdot\vec v\qquad\delta W=\vec F\cdot\mathrm{d}\overrightarrow{OM}=\mathcal P\,\mathrm{d}t$$</div>
    Le <strong>travail</strong> de la force quand \(M\) va de \(A\) à \(B\) le long de sa trajectoire est la somme des travaux élémentaires :
    <div class="formula" data-nom="Travail d'une force">$$W_{A\to B}(\vec F)=\int_A^B\vec F\cdot\mathrm{d}\overrightarrow{OM}$$</div>
  </div>
  <p>Si \(\alpha\) est l'angle entre \(\vec F\) et \(\vec v\), \(\mathcal P=Fv\cos\alpha\). La force est <strong>motrice</strong> si \(\mathcal P\gt0\) (angle aigu), <strong>résistante</strong> si \(\mathcal P\lt0\) (angle obtus), et <strong>ne travaille pas</strong> si elle est perpendiculaire à la vitesse. Puissance et travail dépendent du référentiel, puisque la vitesse en dépend. On écrit \(\delta W\) et non \(\mathrm{d}W\) : le travail n'est pas, en général, la variation d'une fonction de la position (il dépend du chemin suivi).</p>
  <h3>Deux calculs à connaître</h3>
  <ul>
    <li><strong>Force constante</strong> \(\vec F\) : \(W_{A\to B}=\vec F\cdot\overrightarrow{AB}\), quel que soit le chemin. Pour le poids (axe \(Oz\) vers le haut), \(\delta W=-mg\,\mathrm{d}z\) et \(W_{A\to B}=mg\,(z_A-z_B)\) : positif quand le point descend.</li>
    <li><strong>Frottement de norme constante</strong> \(f\), opposé à la vitesse : \(\delta W=-f\,\mathrm{d}s\) (\(\mathrm{d}s\) : distance parcourue), donc \(W=-f\,L\) où \(L\) est la <strong>longueur</strong> du trajet. Ce travail dépend du chemin : sur un aller-retour, il ne s'annule pas.</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — un cycliste dans une côte</strong>
    <p>Cycliste et vélo : \(m=75\ \text{kg}\), à \(v=18\ \text{km/h}=5{,}0\ \text{m·s}^{-1}\) sur une côte de pente 6 % (\(\tan\alpha=0{,}06\), donc \(\sin\alpha\approx0{,}060\)).</p>
    <ol>
      <li>Le poids fait l'angle \(\pi/2+\alpha\) avec la vitesse : \(\mathcal P=-mgv\sin\alpha\), soit \(-75\times9{,}81\times5{,}0\times0{,}060\approx-220\ \text{W}\). Il est résistant : le cycliste doit fournir au moins 220 W, sans compter l'air et les roulements.</li>
      <li>Sur 2,0 km de côte, la dénivelée vaut \(2\,000\times0{,}060\approx120\ \text{m}\) et le travail du poids \(W=-mg\,\Delta z\approx-88\ \text{kJ}\), indépendant du tracé de la route.</li>
      <li>Ordres de grandeur : un humain fournit de 100 à 300 W en effort soutenu (400 W pour un coureur cycliste professionnel), un moteur de voiture de 50 à 150 kW, une motrice de TGV environ 10 MW.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · THÉORÈMES DE LA PUISSANCE ET DE L'ÉNERGIE CINÉTIQUE</div>
  <h2>Une seule équation scalaire au lieu de trois</h2>
  <div class="intro">Le principe fondamental donne trois équations, dans lesquelles figurent toutes les forces, même celles qu'on ne connaît pas. En le multipliant scalairement par la vitesse, on obtient une équation unique, d'où disparaissent les forces qui ne travaillent pas : c'est souvent le chemin le plus court vers une vitesse ou vers l'équation du mouvement.</div>
  <div class="def-box">
    <strong>Énergie cinétique.</strong> Dans le référentiel \(\mathcal R\), un point matériel de masse \(m\) et de vitesse \(\vec v\) a l'énergie cinétique \(E_c=\tfrac12mv^2\), positive, en joules, qui dépend du référentiel.
  </div>
  <div class="prop-box">
    <strong>Théorèmes de la puissance cinétique et de l'énergie cinétique.</strong> Dans un référentiel <strong>galiléen</strong>, pour un point matériel soumis aux forces \(\vec F_i\) :
    <div class="formula" data-nom="Théorèmes de la puissance et de l'énergie cinétiques">$$\frac{\mathrm{d}E_c}{\mathrm{d}t}=\sum_i\mathcal P(\vec F_i)\qquad\Delta E_c=E_c(B)-E_c(A)=\sum_iW_{A\to B}(\vec F_i)$$</div>
    Toutes les forces comptent, conservatives ou non ; celles qui ne travaillent pas n'apportent rien.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Du principe fondamental au théorème de la puissance cinétique</span><div class="content">
    <p>Dans un référentiel galiléen, \(m\,\dfrac{\mathrm{d}\vec v}{\mathrm{d}t}=\sum\vec F_i\). On multiplie scalairement par \(\vec v\) :</p>
    <div class="formula">$$m\,\vec v\cdot\frac{\mathrm{d}\vec v}{\mathrm{d}t}=\frac{\mathrm{d}}{\mathrm{d}t}\left(\tfrac12m\,\vec v\cdot\vec v\right)=\sum\vec F_i\cdot\vec v$$</div>
    <p>C'est le théorème de la puissance cinétique. En multipliant par \(\mathrm{d}t\) et en sommant de \(A\) à \(B\), on obtient le théorème de l'énergie cinétique. L'information perdue (deux équations sur trois) concerne la direction de la vitesse : le théorème ne dit rien des forces perpendiculaires au mouvement.</p>
  </div></div>
  <h3>Choisir le bon outil</h3>
  <div><table>
    <tr><th>On cherche…</th><th>Outil</th><th>Pourquoi</th></tr>
    <tr><td>une vitesse en un point, connaissant la vitesse en un autre</td><td>théorème de l'énergie cinétique (ou de l'énergie mécanique, §5)</td><td>bilan entre deux états, sans passer par le temps</td></tr>
    <tr><td>l'équation du mouvement d'un système à un seul degré de liberté</td><td>théorème de la puissance cinétique</td><td>une équation scalaire, sans les forces qui ne travaillent pas</td></tr>
    <tr><td>une force inconnue (réaction, tension), ou un mouvement à plusieurs degrés de liberté</td><td>principe fondamental projeté</td><td>seules les projections font apparaître ces forces</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — distance de freinage d'une voiture</strong>
    <p>Sur route sèche, une voiture qui freine à fond subit une force de freinage d'environ \(0{,}8\,mg\), constante et opposée au déplacement. Les autres forces (poids, réaction normale) ne travaillent pas sur route horizontale.</p>
    <ol>
      <li>Théorème de l'énergie cinétique de la vitesse \(v_0\) à l'arrêt, sur la distance \(d\) : \(0-\tfrac12mv_0^2=-0{,}8\,mg\,d\), d'où \(d=\dfrac{v_0^2}{1{,}6\,g}\), indépendante de la masse.</li>
      <li>À 90 km/h (\(25\ \text{m·s}^{-1}\)) : \(d\approx40\ \text{m}\) ; à 130 km/h : \(d\approx83\ \text{m}\) ; à 50 km/h : \(d\approx12\ \text{m}\). La distance varie comme le carré de la vitesse : rouler 1,4 fois plus vite double la distance de freinage.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — bille dans une gouttière circulaire</strong>
    <p>Une bille (point matériel de masse \(m\)) glisse sans frottement au fond d'une gouttière circulaire verticale de rayon \(R\) ; on la repère par l'angle \(\theta\) avec la verticale descendante. On veut l'équation du mouvement sans calculer la réaction.</p>
    <ol>
      <li>Vitesse : \(v=R\dot\theta\), donc \(E_c=\tfrac12mR^2\dot\theta^2\).</li>
      <li>Puissances : la réaction de la gouttière est normale à la vitesse, \(\mathcal P=0\) ; le poids : \(\mathcal P=-mg\,\dot z\) avec \(z=-R\cos\theta\), soit \(\mathcal P=-mgR\sin\theta\,\dot\theta\).</li>
      <li>Théorème de la puissance cinétique : \(mR^2\dot\theta\ddot\theta=-mgR\sin\theta\,\dot\theta\). On simplifie par \(\dot\theta\) (non nul en général) : \(\ddot\theta+\dfrac gR\sin\theta=0\), l'équation du pendule simple (chapitre « Principes de la dynamique », §11). Avec \(R=0{,}50\ \text{m}\), les petites oscillations ont la période \(2\pi\sqrt{R/g}\approx1{,}4\ \text{s}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer ces théorèmes dans un référentiel non galiléen, ou oublier une force qui travaille (frottement, force motrice). À l'inverse, inutile de chercher la réaction d'un support fixe ou la tension d'un fil attaché à un point fixe : elles ne travaillent pas.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FORCES CONSERVATIVES ET ÉNERGIE POTENTIELLE</div>
  <h2>Quand le travail ne dépend que des extrémités</h2>
  <div class="intro">Le travail du poids ne dépend que des altitudes de départ et d'arrivée (figure du §1). Pour les forces qui ont cette propriété, on peut ranger le travail dans une fonction de la position, l'énergie potentielle : la force s'en déduit, et le graphe de cette fonction suffit à prévoir le mouvement.</div>
  <div class="def-box">
    <strong>Force conservative, énergie potentielle.</strong> Une force \(\vec F\), fonction de la seule position, est <strong>conservative</strong> si son travail entre deux points ne dépend pas du chemin suivi. Il existe alors une fonction \(E_p(M)\), l'<strong>énergie potentielle</strong>, définie à une constante additive près, telle que
    <div class="formula" data-nom="Énergie potentielle">$$\delta W(\vec F)=-\mathrm{d}E_p\qquad W_{A\to B}(\vec F)=E_p(A)-E_p(B)=-\Delta E_p$$</div>
  </div>
  <div class="prop-box">
    <strong>La force se déduit de l'énergie potentielle.</strong> À une dimension (mouvement sur un axe \(Ox\)), \(\delta W=F_x\,\mathrm{d}x=-\mathrm{d}E_p\), d'où
    <div class="formula" data-nom="Force dérivant d'une énergie potentielle">$$F_x=-\frac{\mathrm{d}E_p}{\mathrm{d}x}\qquad\vec F=-\overrightarrow{\operatorname{grad}}\,E_p$$</div>
    En trois dimensions, en coordonnées cartésiennes (expression fournie dans les énoncés) :
    <div class="formula">$$\overrightarrow{\operatorname{grad}}\,E_p=\frac{\partial E_p}{\partial x}\vec e_x+\frac{\partial E_p}{\partial y}\vec e_y+\frac{\partial E_p}{\partial z}\vec e_z$$</div>
    Pour une énergie potentielle qui ne dépend que de la distance \(r\) à un centre, \(\vec F=-\dfrac{\mathrm{d}E_p}{\mathrm{d}r}\,\vec e_r\).
  </div>
  <p><strong>Lecture graphique.</strong> Le signe moins dit tout : la force est dirigée vers les énergies potentielles <strong>décroissantes</strong>, et sa norme est la <strong>pente</strong> du graphe. Là où \(E_p\) monte avec \(x\), la force pousse vers les \(x\) décroissants ; plus la pente est raide, plus la force est intense ; là où la tangente est horizontale, la force est nulle.</p>

<figcaption>La force \(F_x=-\mathrm{d}E_p/\mathrm{d}x\) (flèches) est dirigée vers les énergies potentielles décroissantes, et d'autant plus intense que la pente est forte. Au fond du puits et au sommet de la barrière, la pente est nulle : ce sont des positions d'équilibre. Autour du fond, la force ramène le point vers l'équilibre (stable) ; autour du sommet, elle l'en éloigne (instable).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — retrouver des forces connues</strong>
    <ol>
      <li>\(E_p=mgz\) (axe vertical ascendant) : \(\overrightarrow{\operatorname{grad}}\,E_p=mg\,\vec e_z\), donc \(\vec F=-mg\,\vec e_z\) : le poids.</li>
      <li>\(E_p=\tfrac12kx^2\) : \(F_x=-kx\) : la force de rappel d'un ressort (allongement \(x\)).</li>
      <li>\(E_p=-\dfrac{\mathcal GMm}{r}\) : \(\vec F=-\dfrac{\mathcal GMm}{r^2}\vec e_r\), attractive : la gravitation.</li>
      <li>Lecture : sur la figure, au point d'abscisse 2 (flanc droit du puits), \(E_p\) croît avec \(x\) : la force est vers la gauche, et vaut environ 0,9 en unités du graphe ; elle ramène le point vers le fond du puits.</li>
    </ol>
  </div>
  <h3>Forces non conservatives</h3>
  <p>Les frottements (fluide ou solide) ne sont pas conservatifs : ils dépendent de la vitesse, et leur travail, toujours négatif, croît avec la longueur du chemin. Exemple : un palet poussé sur 3,0 m puis ramené à son point de départ, avec un frottement de norme 2,0 N, reçoit \(W=-2{,}0\times6{,}0=-12\ \text{J}\) alors que les points de départ et d'arrivée sont confondus ; aucune fonction de la position ne peut donner ce résultat. Les forces exercées par un moteur, un opérateur, ne sont pas non plus conservatives en général.</p>
  <div class="notice"><strong>Erreur classique</strong> : oublier le signe moins, et écrire \(F_x=+\mathrm{d}E_p/\mathrm{d}x\) ; on obtiendrait une force qui pousse vers le haut des pentes. Vérification immédiate sur le poids : la force doit pointer vers le bas, là où \(mgz\) diminue.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LES ÉNERGIES POTENTIELLES USUELLES</div>
  <h2>Pesanteur, ressort, gravitation, champ électrique</h2>
  <div class="intro">Quatre énergies potentielles reviennent sans cesse. Il faut savoir les établir en calculant un travail élémentaire, et les citer avec leurs conventions : orientation de l'axe, allongement du ressort, origine choisie.</div>
  <div><table>
    <tr><th>Force</th><th>Expression</th><th>Énergie potentielle</th><th>Convention</th></tr>
    <tr><td>poids (champ uniforme)</td><td>\(m\vec g=-mg\,\vec e_z\)</td><td>\(E_p=mgz\)</td><td>axe \(Oz\) vers le haut</td></tr>
    <tr><td>ressort</td><td>\(-k(\ell-\ell_0)\,\vec u\)</td><td>\(E_p=\tfrac12k(\ell-\ell_0)^2\)</td><td>nulle ressort à vide</td></tr>
    <tr><td>gravitation (astre ponctuel)</td><td>\(-\dfrac{\mathcal GMm}{r^2}\vec e_r\)</td><td>\(E_p=-\dfrac{\mathcal GMm}{r}\)</td><td>nulle à l'infini</td></tr>
    <tr><td>électrique</td><td>\(q\vec E\)</td><td>\(E_p=qV\)</td><td>\(V\) : potentiel électrique</td></tr>
  </table></div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Établir les trois énergies potentielles mécaniques</span><div class="content">
    <p><strong>Pesanteur.</strong> Avec \(\mathrm{d}\overrightarrow{OM}=\mathrm{d}x\,\vec e_x+\mathrm{d}y\,\vec e_y+\mathrm{d}z\,\vec e_z\), \(\delta W=-mg\,\vec e_z\cdot\mathrm{d}\overrightarrow{OM}\), soit \(\delta W=-mg\,\mathrm{d}z=-\mathrm{d}(mgz)\).</p>
    <p><strong>Ressort.</strong> Le ressort, fixé en \(O\), a pour longueur \(\ell=OM\) ; \(\vec u\) est le vecteur unitaire de \(O\) vers \(M\), et \(\vec u\cdot\mathrm{d}\overrightarrow{OM}=\mathrm{d}\ell\). Donc \(\delta W=-k(\ell-\ell_0)\,\mathrm{d}\ell=-\mathrm{d}\left[\tfrac12k(\ell-\ell_0)^2\right]\).</p>
    <p><strong>Gravitation.</strong> L'astre, de masse \(M\), est au centre \(O\) ; \(\vec e_r\cdot\mathrm{d}\overrightarrow{OM}=\mathrm{d}r\). Donc \(\delta W=-\dfrac{\mathcal GMm}{r^2}\mathrm{d}r=-\mathrm{d}\left(-\dfrac{\mathcal GMm}{r}\right)\). Le résultat vaut pour un astre à symétrie sphérique, à l'extérieur de celui-ci.</p>
  </div></div>
  <p><strong>Pesanteur et gravitation.</strong> Près du sol, à l'altitude \(z\ll R_T\) : \(-\dfrac{\mathcal GM_Tm}{R_T+z}\approx-\dfrac{\mathcal GM_Tm}{R_T}+\dfrac{\mathcal GM_Tm}{R_T^2}\,z\), soit une constante plus \(mg_0z\) avec \(g_0=\mathcal GM_T/R_T^2\) : \(mgz\) est l'approximation, au premier ordre, de l'énergie potentielle de gravitation.</p>
  <p><strong>Énergie potentielle électrique.</strong> Une charge \(q\) placée en un point où le potentiel électrique vaut \(V\) a l'énergie potentielle \(qV\) ; le travail de la force électrique de \(A\) à \(B\) vaut \(q\,(V_A-V_B)\) (chapitre « Particules chargées », §5). Dans un champ uniforme \(\vec E=E\,\vec e_x\), \(V=-Ex+\text{cste}\). Deux charges ponctuelles \(q_1\) et \(q_2\) distantes de \(r\) ont l'énergie potentielle d'interaction \(\dfrac{q_1q_2}{4\pi\varepsilon_0r}\), positive si elles se repoussent. La relation générale entre champ et potentiel est vue en 2ᵉ année (chapitre « Électrostatique »).</p>
  <div class="method-box">
    <strong>Exemple — vitesse de libération et altitude de l'ISS</strong>
    <p>\(\mathcal GM_T=3{,}99\times10^{14}\ \text{m}^3\text{·s}^{-2}\), \(R_T=6\,371\ \text{km}\).</p>
    <ol>
      <li>Vitesse de libération : un objet lancé du sol échappe à la Terre (frottements négligés) si son énergie mécanique est positive, \(\tfrac12mv^2-\dfrac{\mathcal GM_Tm}{R_T}\geq0\), soit \(v\geq\sqrt{2\mathcal GM_T/R_T}\approx11{,}2\ \text{km·s}^{-1}\).</li>
      <li>Pour monter 1 kg du sol à 400 km d'altitude, la variation exacte d'énergie potentielle vaut \(\mathcal GM_T\left(\dfrac1{R_T}-\dfrac1{R_T+z}\right)\approx3{,}70\ \text{MJ}\), contre \(mg_0z\approx3{,}93\ \text{MJ}\) : à cette altitude, \(mgz\) surestime déjà de 6 %.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une barrière coulombienne</strong>
    <p>Une particule \(\alpha\) (charge \(2e\)) d'énergie cinétique 5,0 MeV est lancée droit vers un noyau d'or (charge \(79e\)), supposé fixe. Avec \(\dfrac{e^2}{4\pi\varepsilon_0}=1{,}44\ \text{MeV·fm}\) :</p>
    <ol>
      <li>Seules les forces électriques travaillent (conservatives) : \(E_c+\dfrac{2\times79\,e^2}{4\pi\varepsilon_0r}\) reste égale à 5,0 MeV.</li>
      <li>La particule s'arrête, puis repart, à la distance où toute l'énergie est potentielle : \(r_{\min}=\dfrac{158\times1{,}44}{5{,}0}\approx46\ \text{fm}\), bien au-delà du rayon du noyau (7 fm) : c'est l'expérience de Rutherford.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\tfrac12kx^2\) avec \(x\) la position de la masse au lieu de l'allongement \(\ell-\ell_0\) ; ou garder \(mgz\) avec un axe orienté vers le bas (il faut alors \(-mgz\)). Choisir une origine des énergies potentielles et ne plus en changer au cours du calcul.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · ÉNERGIE MÉCANIQUE ET CONSERVATION</div>
  <h2>Ce qui se conserve, et ce qui le fait varier</h2>
  <div class="intro">En séparant, dans le théorème de l'énergie cinétique, le travail des forces conservatives (rangé dans l'énergie potentielle) et celui des autres forces, on obtient une grandeur, l'énergie mécanique, qui ne varie qu'à cause des forces non conservatives. Quand elles ne travaillent pas, elle se conserve : c'est une intégrale première du mouvement.</div>
  <div class="def-box">
    <strong>Énergie mécanique.</strong> \(E_m=E_c+E_p\), où \(E_p\) est la somme des énergies potentielles de toutes les forces conservatives qui s'exercent sur le point.
  </div>
  <div class="prop-box">
    <strong>Théorèmes de l'énergie mécanique et de la puissance mécanique.</strong> Dans un référentiel galiléen :
    <div class="formula" data-nom="Théorème de l'énergie mécanique">$$\Delta E_m=W_{A\to B}(\vec F_{\text{nc}})\qquad\frac{\mathrm{d}E_m}{\mathrm{d}t}=\mathcal P(\vec F_{\text{nc}})$$</div>
    où \(\vec F_{\text{nc}}\) désigne la résultante des forces non conservatives. Si les seules forces qui travaillent sont conservatives, le mouvement est <strong>conservatif</strong> et \(E_m\) reste constante.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Du théorème de l'énergie cinétique au théorème de l'énergie mécanique</span><div class="content">
    <p>Théorème de l'énergie cinétique : \(\Delta E_c=W(\vec F_{\text{c}})+W(\vec F_{\text{nc}})\). Pour les forces conservatives, \(W(\vec F_{\text{c}})=-\Delta E_p\). Donc \(\Delta E_c+\Delta E_p=\Delta E_m=W(\vec F_{\text{nc}})\). Même raisonnement avec les puissances.</p>
  </div></div>
  <h3>Trois familles de forces</h3>
  <ul>
    <li><strong>Conservatives</strong> : poids, force de rappel d'un ressort, gravitation, force électrique. Leur travail est rangé dans \(E_p\).</li>
    <li><strong>Qui ne travaillent pas</strong> : réaction normale d'un support <strong>fixe</strong>, tension d'un fil dont l'autre extrémité est <strong>fixe</strong>, force magnétique \(q\vec v\wedge\vec B\). Elles n'apparaissent ni dans \(E_p\), ni dans le second membre.</li>
    <li><strong>Non conservatives qui travaillent</strong> : frottements (fluide, solide), force motrice. Leur travail fait varier \(E_m\) ; celui des frottements est négatif : l'énergie mécanique diminue, convertie en énergie thermique.</li>
  </ul>
  <p><strong>Utiliser les conditions initiales.</strong> En mouvement conservatif, on calcule \(E_m\) une fois pour toutes à l'instant initial, où positions et vitesses sont connues ; l'égalité \(E_m=\text{cste}\) donne ensuite la vitesse en toute position.</p>
  <div class="method-box">
    <strong>Exemple — une luge sur une piste</strong>
    <p>Un enfant et sa luge (\(m=60\ \text{kg}\)) partent arrêtés d'un point situé 12 m au-dessus du bas de la piste.</p>
    <ol>
      <li>Sans frottement, seules la réaction (normale, support fixe : ne travaille pas) et le poids interviennent : \(E_m\) se conserve, \(mgh=\tfrac12mv^2\), d'où \(v=\sqrt{2gh}\approx15{,}3\ \text{m·s}^{-1}\) (55 km/h), quelle que soit la forme de la piste.</li>
      <li>On mesure en réalité \(10\ \text{m·s}^{-1}\) en bas. Le théorème de l'énergie mécanique donne le travail des frottements : \(W_f=\tfrac12mv^2-mgh=3\,000-7\,060\approx-4\,060\ \text{J}\) : 58 % de l'énergie initiale a été dissipée (neige, air).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — compression d'un ressort par un chariot</strong>
    <p>Un chariot de 0,50 kg roule sans frottement à \(2{,}0\ \text{m·s}^{-1}\) vers un ressort horizontal de raideur \(200\ \text{N·m}^{-1}\), initialement à vide. Conservation de \(E_m\) entre l'instant du contact et la compression maximale \(x_m\), où la vitesse s'annule : \(\tfrac12mv_0^2=\tfrac12kx_m^2\), d'où \(x_m=v_0\sqrt{m/k}=0{,}10\ \text{m}\). Le chariot repart ensuite à \(2{,}0\ \text{m·s}^{-1}\) en sens inverse.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : affirmer qu'une réaction ou une tension ne travaille « jamais ». Un tapis roulant entraîne un colis par le frottement ; le plancher d'un ascenseur qui monte travaille sur le passager ; un fil tiré par un treuil travaille. La règle ne vaut que pour un support ou un point d'attache <strong>immobile</strong> dans le référentiel d'étude.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · MOUVEMENT CONSERVATIF À UNE DIMENSION</div>
  <h2>Prévoir le mouvement sur le graphe de l'énergie potentielle</h2>
  <div class="intro">Pour un point qui se déplace sur un axe en mouvement conservatif, l'énergie mécanique s'écrit avec une seule coordonnée. Sans résoudre aucune équation, une droite horizontale tracée sur le graphe de \(E_p\) suffit à dire où le point peut aller, où il s'arrête et s'il reviendra.</div>
  <div class="prop-box">
    <strong>Zone accessible.</strong> Pour un point de masse \(m\) sur l'axe \(Ox\), en mouvement conservatif :
    <div class="formula" data-nom="Mouvement conservatif à une dimension">$$E_m=\tfrac12m\dot x^2+E_p(x)\quad\Longrightarrow\quad\dot x^2=\frac2m\big(E_m-E_p(x)\big)\geq0$$</div>
    Le mouvement n'est possible que là où \(E_p(x)\leq E_m\). Aux points où \(E_p(x)=E_m\), la vitesse s'annule : ce sont les <strong>points de rebroussement</strong> (positions de vitesse nulle).
  </div>
  <div class="def-box">
    <strong>Puits et barrière de potentiel.</strong> Un <strong>puits</strong> est une région où \(E_p\) présente un minimum, entourée de valeurs plus élevées ; une <strong>barrière</strong> est une région où \(E_p\) présente un maximum, qui sépare deux zones plus basses. Un point d'énergie \(E_m\) inférieure au sommet d'une barrière ne peut pas la franchir.
  </div>

<figcaption>Pour chaque valeur de \(E_m\) (pointillés), le mouvement n'est possible que là où \(E_p(x)\leq E_m\) (traits épais) ; les points marqués, où \(E_p=E_m\), sont des points de vitesse nulle. \(E_1\) : le point oscille au fond du puits (état lié, mouvement périodique). \(E_2\) : deux zones séparées par la barrière ; parti du puits, le point y reste (état lié) ; venu de la droite, il rebrousse chemin devant la barrière et repart à l'infini. \(E_3\), au-dessus de la barrière : le point rebondit sur le mur de gauche et part à l'infini (état de diffusion).</figcaption>
</figure>
  <ul>
    <li><strong>Trajectoire bornée</strong> (état lié) : la zone accessible est un segment \([x_1,x_2]\) entre deux points de rebroussement. Le point y fait des allers-retours : le mouvement est <strong>périodique</strong>, puisque chaque passage en un point se fait avec la même vitesse, au signe près.</li>
    <li><strong>Trajectoire non bornée</strong> (état de diffusion) : la zone accessible s'étend jusqu'à l'infini ; après au plus un rebroussement, le point s'éloigne indéfiniment.</li>
    <li>La nature du mouvement dépend de \(E_m\), donc des <strong>conditions initiales</strong> : un même profil donne des états liés et des états de diffusion (figure).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — franchir une bosse</strong>
    <p>Une bille roule sans frottement sur un rail horizontal qui présente une bosse de 20 cm de haut. Son énergie potentielle de pesanteur reproduit le profil du rail : la bosse est une barrière de hauteur \(mgh\).</p>
    <ol>
      <li>Elle franchit la bosse si \(\tfrac12mv_0^2\gt mgh\), soit \(v_0\gt\sqrt{2gh}\approx1{,}98\ \text{m·s}^{-1}\), quelle que soit sa masse.</li>
      <li>À \(v_0=1{,}5\ \text{m·s}^{-1}\), elle remonte jusqu'à l'altitude \(v_0^2/(2g)\approx11\ \text{cm}\), s'arrête (point de rebroussement) et revient.</li>
      <li>Si le rail est une cuvette entre deux bosses de 20 cm, et que la bille y est lancée à \(1{,}5\ \text{m·s}^{-1}\), elle oscille indéfiniment entre deux points de même altitude : état lié, mouvement périodique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre le graphe de \(E_p(x)\) avec la trajectoire. Pour une bille sur un rail, les deux ont la même forme parce que \(E_p=mgz(x)\) ; mais en général (ressort, gravitation, champ électrique), le graphe de \(E_p\) est une représentation de l'énergie, pas un dessin du mouvement. De plus, pour la bille, \(E_c=\tfrac12m(\dot x^2+\dot z^2)\) : l'analyse des zones accessibles et des points de rebroussement reste exacte, mais la loi horaire diffère de celle d'un point sur un axe.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · POSITIONS D'ÉQUILIBRE ET STABILITÉ</div>
  <h2>Fond de puits et sommet de barrière</h2>
  <div class="intro">Un point posé sans vitesse en une position d'équilibre y reste. Mais toutes les positions d'équilibre ne se valent pas : une bille au fond d'un bol y revient après une petite poussée, une bille en équilibre sur une bosse s'en éloigne. Le graphe de \(E_p\) fait la différence d'un coup d'œil.</div>
  <div class="def-box">
    <strong>Équilibre.</strong> La position \(x_e\) est une position d'équilibre si la force y est nulle : \(F_x(x_e)=-\dfrac{\mathrm{d}E_p}{\mathrm{d}x}(x_e)=0\). Les positions d'équilibre sont les points où la tangente au graphe de \(E_p\) est horizontale. L'équilibre est <strong>stable</strong> si, légèrement écarté, le point y revient ; <strong>instable</strong> s'il s'en éloigne.
  </div>
  <div class="prop-box">
    <strong>Critère de stabilité.</strong> Un <strong>minimum</strong> de \(E_p\) est une position d'équilibre stable, un <strong>maximum</strong> une position instable. Condition suffisante :
    <div class="formula" data-nom="Critère de stabilité">$$\frac{\mathrm{d}E_p}{\mathrm{d}x}(x_e)=0\quad\text{et}\quad\frac{\mathrm{d}^2E_p}{\mathrm{d}x^2}(x_e)\gt0\ \text{(stable)}\quad\text{ou}\ \lt0\ \text{(instable)}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Justification</span><span class="prompt">Pourquoi un minimum est stable</span><div class="content">
    <p>Près de \(x_e\), au premier ordre, puisque \(F_x(x_e)=0\) et \(F_x'=-E_p''\) :</p>
    <div class="formula">$$F_x(x)\approx F_x(x_e)+F_x'(x_e)\,(x-x_e)=-E_p''(x_e)\,(x-x_e)$$</div>
    <p>Si \(E_p''(x_e)\gt0\), la force est opposée à l'écart : elle ramène le point vers \(x_e\) (force de rappel). Si \(E_p''(x_e)\lt0\), elle est dans le sens de l'écart et l'amplifie. Si \(E_p''(x_e)=0\), il faut regarder les termes d'ordre supérieur : \(E_p=Cx^4\) avec \(C\gt0\) donne un équilibre stable, \(E_p=Cx^3\) un équilibre instable.</p>
  </div></div>
  <h3>Un exemple qui change de nature : le ressort transverse</h3>
  <p>Une masse \(m\) coulisse sans frottement sur une glissière horizontale. Elle est reliée à un ressort (raideur \(k\), longueur à vide \(\ell_0\)) dont l'autre extrémité est fixée à la distance \(d\) de la glissière, au-dessus du point \(O\). Pour l'abscisse \(x\), la longueur du ressort vaut \(\ell=\sqrt{x^2+d^2}\) ; la réaction de la glissière et le poids, perpendiculaires au mouvement, ne travaillent pas, donc</p>
  <div class="formula" data-nom="Ressort transverse">$$E_p(x)=\tfrac12k\left(\sqrt{x^2+d^2}-\ell_0\right)^2\qquad\frac{\mathrm{d}E_p}{\mathrm{d}x}=k\,x\left(1-\frac{\ell_0}{\sqrt{x^2+d^2}}\right)$$</div>

<figcaption>À gauche : le ressort (raideur \(k=50\ \text{N·m}^{-1}\), longueur à vide \(\ell_0=0{,}25\ \text{m}\)) est fixé à la distance \(d\) de la glissière ; sa longueur vaut \(\ell=\sqrt{x^2+d^2}\). À droite : \(E_p(x)=\tfrac12k(\ell-\ell_0)^2\). Si \(d\gt\ell_0\) (bleu), un seul puits : \(x=0\) est stable. Si \(d\lt\ell_0\) (rouge), le ressort est comprimé en \(x=0\), qui devient le sommet d'une barrière (instable, cerclé) ; deux puits apparaissent en \(x=\pm\sqrt{\ell_0^2-d^2}=\pm0{,}15\ \text{m}\).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — équilibres du ressort transverse</strong>
    <p>\(k=50\ \text{N·m}^{-1}\), \(\ell_0=0{,}25\ \text{m}\).</p>
    <ol>
      <li>La dérivée s'annule pour \(x=0\), et pour \(\sqrt{x^2+d^2}=\ell_0\) si c'est possible, c'est-à-dire si \(d\lt\ell_0\) : \(x=\pm\sqrt{\ell_0^2-d^2}\) (ressort à vide).</li>
      <li>En \(x=0\) : \(E_p''(0)=k\left(1-\dfrac{\ell_0}{d}\right)\). Pour \(d=0{,}30\ \text{m}\), \(E_p''(0)\approx8{,}3\ \text{N·m}^{-1}\gt0\) : seul équilibre, stable. Pour \(d=0{,}20\ \text{m}\), \(E_p''(0)=-12{,}5\ \text{N·m}^{-1}\lt0\) : instable, le ressort comprimé chasse la masse d'un côté ou de l'autre.</li>
      <li>Pour \(d=0{,}20\ \text{m}\), les deux autres équilibres, en \(x=\pm0{,}15\ \text{m}\), sont stables (minimums nuls de \(E_p\)) ; ils sont séparés par une barrière de hauteur \(E_p(0)=\tfrac12k(\ell_0-d)^2\approx0{,}063\ \text{J}\). C'est un système <strong>bistable</strong>, comme un interrupteur à bascule ou une barrette de plastique flambée.</li>
    </ol>
  </div>
  <p><strong>Pendule.</strong> Pour une masse au bout d'une tige rigide de longueur \(\ell\) et de masse négligeable, \(E_p=mg\ell(1-\cos\theta)\) : minimum en \(\theta=0\) (équilibre stable, pendule vers le bas), maximum en \(\theta=\pi\) (équilibre instable, pendule à la verticale au-dessus de l'axe, qui ne s'y maintient pas). Avec un fil souple, la position haute n'est même pas un équilibre possible du modèle, le fil ne pouvant pas pousser.</p>
  <div class="notice"><strong>Erreur classique</strong> : conclure à partir de \(E_p''(x_e)=0\). Ce cas ne permet pas de trancher : il faut le signe de la première dérivée non nulle, ou l'allure du graphe. Autre piège : chercher les équilibres en annulant \(E_p\) au lieu de sa dérivée.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · PETITS MOUVEMENTS AU VOISINAGE D'UN ÉQUILIBRE STABLE</div>
  <h2>Tout puits est harmonique vu de près</h2>
  <div class="intro">Au fond de n'importe quel puits, la courbe de \(E_p\) ressemble à une parabole. Écarté un peu de son équilibre stable, un système oscille donc comme une masse au bout d'un ressort : c'est la raison pour laquelle l'oscillateur harmonique est partout en physique.</div>
  <div class="prop-box">
    <strong>Approximation harmonique.</strong> Près d'une position d'équilibre stable \(x_e\), le développement de Taylor à l'ordre 2 (le terme d'ordre 1 est nul) donne un <strong>puits harmonique</strong>, et l'équation du mouvement devient celle d'un oscillateur harmonique :
    <div class="formula" data-nom="Petits mouvements au voisinage d'un équilibre stable">$$E_p(x)\approx E_p(x_e)+\tfrac12E_p''(x_e)\,(x-x_e)^2\qquad\ddot x+\omega_0^2\,(x-x_e)=0\qquad\omega_0=\sqrt{\frac{E_p''(x_e)}{m}}$$</div>
    \(E_p''(x_e)\) joue le rôle d'une raideur effective.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Équation des petits mouvements par la puissance mécanique</span><div class="content">
    <p>Mouvement conservatif : \(E_m=\tfrac12m\dot x^2+E_p(x)\) est constante. En dérivant : \(m\dot x\ddot x+E_p'(x)\,\dot x=0\), soit, pour \(\dot x\neq0\), \(m\ddot x=-E_p'(x)\) (c'est aussi le principe fondamental projeté). Près de \(x_e\), comme \(E_p'(x_e)=0\) :</p>
    <div class="formula">$$E_p'(x)\approx E_p'(x_e)+E_p''(x_e)\,(x-x_e)=E_p''(x_e)\,(x-x_e)$$</div>
    <p>On obtient \(m\ddot x+E_p''(x_e)\,(x-x_e)=0\).</p>
  </div></div>
  <p><strong>Avec un angle.</strong> Si le système est repéré par un angle, par exemple un point sur un cercle de rayon \(\ell\) avec \(E_c=\tfrac12m\ell^2\dot\theta^2\), le même raisonnement donne \(\omega_0^2=E_p''(\theta_e)/(m\ell^2)\). Pour le pendule, \(E_p''(0)=mg\ell\), d'où \(\omega_0=\sqrt{g/\ell}\). La résolution de l'équation et l'étude complète de l'oscillateur (amplitude, phase, énergie, amortissement) font l'objet du chapitre « Oscillateurs harmoniques ».</p>
  <div class="method-box">
    <strong>Exemple — petites oscillations du ressort transverse</strong>
    <p>Mêmes valeurs qu'au §7, masse \(m=0{,}10\ \text{kg}\).</p>
    <ol>
      <li>\(d=0{,}30\ \text{m}\) : \(\omega_0=\sqrt{E_p''(0)/m}=\sqrt{8{,}33/0{,}10}\approx9{,}1\ \text{rad·s}^{-1}\), période \(0{,}69\ \text{s}\). La raideur effective, \(8{,}3\ \text{N·m}^{-1}\), est six fois plus faible que \(k\) : le ressort travaille de biais.</li>
      <li>\(d=0{,}20\ \text{m}\), autour de \(x_e=0{,}15\ \text{m}\) : le calcul donne \(E_p''(x_e)=k\left(1-\dfrac{d^2}{\ell_0^2}\right)=18\ \text{N·m}^{-1}\), d'où \(\omega_0\approx13{,}4\ \text{rad·s}^{-1}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — vibration d'une molécule</strong>
    <p>Dans la molécule HCl, l'atome d'hydrogène vibre contre l'atome de chlore, 35 fois plus lourd, supposé fixe. Près de l'équilibre, la liaison se comporte comme un ressort de raideur effective \(E_p''\approx516\ \text{N·m}^{-1}\). Avec \(m_H=1{,}67\times10^{-27}\ \text{kg}\) : \(\omega_0\approx5{,}6\times10^{14}\ \text{rad·s}^{-1}\), soit \(f_0\approx8{,}8\times10^{13}\ \text{Hz}\) : la molécule absorbe dans l'infrarouge, vers \(\lambda=c/f_0\approx3{,}4\ \text{µm}\), ce que confirme la spectroscopie.</p>
  </div>
  <p><strong>Validité.</strong> L'approximation suppose l'écart assez petit pour que le terme d'ordre 3 du développement soit négligeable devant celui d'ordre 2. Pour le pendule, \(\sin\theta\approx\theta\) à 1 % près jusqu'à 14°, et la période des oscillations ne dépasse \(T_0\) de 1 % qu'à partir de 23° d'amplitude. Au-delà, les effets non linéaires apparaissent (§10).</p>
  <div class="notice"><strong>Erreur classique</strong> : prendre la raideur \(k\) du ressort pour la raideur effective. Ce n'est vrai que pour un ressort qui travaille dans l'axe du mouvement ; en général, il faut calculer \(E_p''(x_e)\), en \(x_e\) et pas ailleurs.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · PORTRAIT DE PHASE D'UN MOUVEMENT CONSERVATIF</div>
  <h2>Voir tous les mouvements possibles sur une seule figure</h2>
  <div class="intro">L'état d'un point sur un axe est fixé par deux nombres, sa position et sa vitesse : connaissant les deux à un instant, l'équation du mouvement détermine toute la suite. On représente donc l'état par un point du plan (position, vitesse), le plan de phase ; au cours du temps, ce point décrit une trajectoire de phase.</div>
  <div class="def-box">
    <strong>Plan de phase, portrait de phase.</strong> Le plan de phase porte la position \(x\) en abscisse et la vitesse \(\dot x\) en ordonnée. Une <strong>trajectoire de phase</strong> est la courbe décrite par le point \((x,\dot x)\) au cours d'un mouvement ; le <strong>portrait de phase</strong> réunit les trajectoires obtenues pour différentes conditions initiales.
  </div>
  <div class="prop-box">
    <strong>Lecture d'un portrait de phase conservatif.</strong> Chaque trajectoire est une courbe \(\tfrac12m\dot x^2+E_p(x)=E_m\), symétrique par rapport à l'axe des abscisses :
    <ul>
      <li>sens de parcours : vers la droite dans le demi-plan \(\dot x\gt0\), vers la gauche dans le demi-plan \(\dot x\lt0\) (sens des aiguilles d'une montre) ;</li>
      <li>les trajectoires coupent l'axe \(\dot x=0\) aux points de rebroussement, perpendiculairement ;</li>
      <li>un mouvement <strong>périodique</strong> donne une courbe <strong>fermée</strong> ; un équilibre stable est un point entouré de courbes fermées (un centre) ; un équilibre instable est un point où se croisent deux courbes particulières, les séparatrices (un col) ;</li>
      <li>pour l'oscillateur harmonique, les trajectoires sont des ellipses, qui deviennent des cercles en coordonnées \((x,\ \dot x/\omega_0)\).</li>
    </ul>
  </div>

<figcaption>Portrait de phase du pendule à tige (\(\theta\) en abscisse, \(\dot\theta\) en ordonnée, avec \(\omega_0=\sqrt{g/\ell}\)) : chaque courbe est une valeur de \(E_m\), parcourue dans le sens des flèches. En bleu, oscillations autour de \(\theta=0\) (centre, stable) : courbes fermées, presque des cercles pour les petites amplitudes. En rouge, la séparatrice \(E_m=2mg\ell\), qui passe par les positions \(\theta=\pm\pi\) (instables) : c'est le même point physique, pendule à la verticale au-dessus de l'axe. Au-delà (noir), le pendule fait des tours complets sans jamais s'arrêter.</figcaption>
</figure>
  <p>Le pendule (point au bout d'une tige rigide) a pour énergie \(E_m=\tfrac12m\ell^2\dot\theta^2+mg\ell(1-\cos\theta)\). Trois familles de mouvements apparaissent : les <strong>oscillations</strong> (\(E_m\lt2mg\ell\)), les <strong>révolutions</strong> (\(E_m\gt2mg\ell\)), où \(\theta\) croît (ou décroît) sans fin, et la <strong>séparatrice</strong> \(E_m=2mg\ell\), qui sépare les deux et sur laquelle le pendule met un temps infini à atteindre la position haute.</p>
  <div class="method-box">
    <strong>Exemple — lancer le pendule depuis sa position basse</strong>
    <p>Tige de longueur \(\ell=0{,}50\ \text{m}\), masse lancée depuis le bas avec la vitesse \(v_0\).</p>
    <ol>
      <li>Au point bas, \(E_m=\tfrac12mv_0^2\). Révolutions si \(E_m\gt2mg\ell\), soit \(v_0\gt2\sqrt{g\ell}\approx4{,}43\ \text{m·s}^{-1}\).</li>
      <li>Pour \(v_0=3{,}0\ \text{m·s}^{-1}\), le pendule oscille ; amplitude : \(mg\ell(1-\cos\theta_m)=\tfrac12mv_0^2\), \(\cos\theta_m=1-\dfrac{v_0^2}{2g\ell}\approx0{,}083\), \(\theta_m\approx85^\circ\).</li>
      <li>Sur le portrait, ce mouvement est la courbe fermée qui coupe l'axe vertical en \(\dot\theta=\pm v_0/\ell=\pm6{,}0\ \text{rad·s}^{-1}\), soit \(\pm1{,}35\,\omega_0\), et l'axe horizontal en \(\pm\theta_m\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer ce portrait à un pendule à <strong>fil</strong> au-delà de 90°. Un fil ne pousse pas : dès que la tension s'annule, la masse quitte le cercle et le modèle à \(\ell\) constant ne vaut plus. Pour un fil, les révolutions demandent que le fil reste tendu en haut, \(v_{\text{haut}}^2\geq g\ell\), soit \(v_0\geq\sqrt{5g\ell}\approx4{,}95\ \text{m·s}^{-1}\) pour \(\ell=0{,}50\ \text{m}\) (comme pour le looping, chapitre « Principes de la dynamique »).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · RÉSOLUTION NUMÉRIQUE : EFFET DES TERMES NON LINÉAIRES</div>
  <h2>Le pendule aux grandes amplitudes</h2>
  <div class="intro">L'équation exacte du pendule, \(\ddot\theta+\omega_0^2\sin\theta=0\), n'a pas de solution exprimable avec les fonctions usuelles. On la résout numériquement, et l'on compare au modèle linéaire \(\ddot\theta+\omega_0^2\theta=0\) : l'écart entre les deux est l'effet du terme non linéaire. La méthode est celle du chapitre d'informatique « Méthodes numériques » (§7) : une équation d'ordre 2 devient un système d'ordre 1 sur le vecteur d'état \((\theta,\dot\theta)\).</div>
  <div class="prop-box">
    <strong>Système d'ordre 1.</strong> Avec le vecteur d'état \(Y=(\theta,\ \omega)\), où \(\omega=\dot\theta\) est la vitesse angulaire :
    <div class="formula" data-nom="Pendule : système d'ordre 1">$$\frac{\mathrm{d}\theta}{\mathrm{d}t}=\omega\qquad\frac{\mathrm{d}\omega}{\mathrm{d}t}=-\omega_0^2\sin\theta$$</div>
  </div>
  <p>La fonction <span class="code-inline">odeint</span> de la bibliothèque <span class="code-inline">scipy.integrate</span> (spécification fournie dans les sujets) prend la fonction qui renvoie la dérivée du vecteur d'état, l'état initial et la liste des instants ; elle renvoie un tableau dont la ligne \(k\) est l'état à l'instant \(t_k\). Attention à l'ordre des arguments de la fonction dérivée : \((Y,t)\).</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">from</span> scipy.integrate <span class="kw">import</span> odeint

g, L = 9.81, 1.0                       <span class="cmt"># m/s², m</span>
w0 = np.sqrt(g / L)                    <span class="cmt"># pulsation des petites oscillations</span>

<span class="kw">def</span> F(Y, t):                           <span class="cmt"># odeint : arguments dans l'ordre (Y, t)</span>
    theta, omega = Y                   <span class="cmt"># vecteur d'état (angle, vitesse angulaire)</span>
    <span class="kw">return</span> [omega, -w0**2 * np.sin(theta)]

<span class="kw">def</span> F_lin(Y, t):                       <span class="cmt"># modèle linéaire : sin(theta) remplacé par theta</span>
    theta, omega = Y
    <span class="kw">return</span> [omega, -w0**2 * theta]

t = np.linspace(0, 10, 10001)          <span class="cmt"># instants où l'on veut la solution</span>
Y0 = [np.radians(120), 0.0]            <span class="cmt"># lâché sans vitesse à 120°</span>
sol = odeint(F, Y0, t)                 <span class="cmt"># une ligne par instant : [theta, omega]</span>
theta, omega = sol[:, 0], sol[:, 1]
theta_lin = odeint(F_lin, Y0, t)[:, 0]

<span class="kw">def</span> periode(t, x):
    <span class="str">"""Durée entre deux passages successifs de x par 0 en décroissant."""</span>
    tz = [t[k] - x[k] * (t[k+1] - t[k]) / (x[k+1] - x[k])
          <span class="kw">for</span> k <span class="kw">in</span> range(len(t) - 1) <span class="kw">if</span> x[k] &gt; 0 &gt;= x[k+1]]
    <span class="kw">return</span> tz[1] - tz[0]

print(periode(t, theta), periode(t, theta_lin))   <span class="cmt"># périodes (s)</span>
E = 0.5 * omega**2 - w0**2 * np.cos(theta)        <span class="cmt"># énergie par unité de m L²</span>
print(E.max() - E.min())                          <span class="cmt"># dérive de l'énergie</span></pre>

<figcaption>Pendule simple (\(\ell=1\ \text{m}\), tige rigide) lâché sans vitesse depuis \(\theta_0=120^\circ\), simulé avec <span class="code-inline">odeint</span>. Trait plein : équation exacte \(\ddot\theta=-\omega_0^2\sin\theta\), période \(2,75\ \text{s}\). Tirets : modèle linéaire \(\ddot\theta=-\omega_0^2\theta\), sinusoïde de période \(T_0=2,01\ \text{s}\). Le terme non linéaire allonge la période de 37 % et aplatit la courbe aux élongations extrêmes, où le pendule s'attarde.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — ce que montre la simulation</strong>
    <ol>
      <li>Périodes : 2,754 s pour l'équation exacte, 2,006 s pour le modèle linéaire (\(T_0=2\pi\sqrt{\ell/g}\)) : à 120°, le terme non linéaire allonge la période de 37 %. Le rappel \(-\omega_0^2\sin\theta\) est plus faible que \(-\omega_0^2\theta\) (car \(|\sin\theta|\lt|\theta|\)) : le pendule revient moins vite. C'est le <strong>non-isochronisme</strong> : la période dépend de l'amplitude (+0,2 % à 10°, +2 % à 30°, +18 % à 90° ; chapitre « Oscillateurs harmoniques », §11).</li>
      <li>Vitesse angulaire maximale, au passage en bas : \(5{,}42\ \text{rad·s}^{-1}\), égale à la valeur \(2\omega_0\sin(\theta_0/2)\) que donne la conservation de l'énergie ; le modèle linéaire annonce \(\theta_0\omega_0=6{,}56\ \text{rad·s}^{-1}\), 21 % de trop.</li>
      <li>Forme : la courbe exacte n'est plus une sinusoïde ; elle s'aplatit aux élongations extrêmes, où le rappel est faible. Son spectre contient, en plus de la fréquence fondamentale, un harmonique de rang 3 d'amplitude égale à 3 % de celle du fondamental : un système non linéaire crée des fréquences nouvelles.</li>
      <li>Contrôle : l'énergie calculée varie de moins de \(10^{-6}\) en valeur relative sur 10 s. Avec la méthode d'Euler à pas fixe \(h=0{,}01\ \text{s}\), elle doublerait sur la même durée (« Méthodes numériques », §7) : il faut toujours vérifier la conservation de l'énergie d'une simulation conservative.</li>
    </ol>
  </div>
  <p><strong>Portrait de phase numérique.</strong> Tracer <span class="code-inline">omega</span> en fonction de <span class="code-inline">theta</span> donne la trajectoire de phase : une courbe fermée, nettement plus pointue qu'une ellipse aux extrémités pour 120°. En lançant le pendule depuis le bas avec \(\dot\theta(0)=1{,}98\,\omega_0\), il oscille jusqu'à 164° ; avec \(2{,}02\,\omega_0\), il passe par le haut et tourne indéfiniment : la séparatrice correspond à \(\dot\theta(0)=2\omega_0\). Pour un pendule pesant (un solide), la même étude met en évidence le non-isochronisme (chapitre « Mouvement d'un solide »).</p>
  <div class="notice"><strong>Erreur classique</strong> : donner l'angle initial en degrés à <span class="code-inline">np.sin</span> (qui attend des radians) ; inverser l'ordre \((Y,t)\) de la fonction dérivée attendu par <span class="code-inline">odeint</span> (l'ordre \((t,Y)\) est celui de la fonction <span class="code-inline">euler</span> du cours d'informatique) ; choisir des instants trop espacés pour repérer correctement les passages par zéro.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · BILANS EN PRÉSENCE DE FROTTEMENTS</div>
  <h2>L'énergie mécanique diminue : prévoir l'état final</h2>
  <div class="intro">Avec des frottements, l'énergie mécanique n'est plus constante, mais le théorème de l'énergie mécanique dit exactement comment elle varie. Comme elle ne peut que diminuer, il permet aussi de prévoir où le système finira : au fond d'un puits.</div>
  <div class="prop-box">
    <strong>Frottements et énergie mécanique.</strong> Un frottement fluide linéaire \(\vec f=-\alpha\vec v\) (\(\alpha\gt0\)) a la puissance \(\mathcal P=-\alpha v^2\leq0\). Si c'est la seule force non conservative qui travaille :
    <div class="formula" data-nom="Puissance d'un frottement fluide">$$\frac{\mathrm{d}E_m}{\mathrm{d}t}=-\alpha v^2\leq0$$</div>
    \(E_m\) décroît tant que le point bouge ; le mouvement s'achève en une position d'équilibre stable, où \(E_p\) est minimale.
  </div>
  <p><strong>Évolution qualitative.</strong> Sur le graphe de \(E_p\), la droite horizontale \(E_m\) descend au cours du temps ; la zone accessible se resserre autour d'un minimum, jusqu'à s'y réduire. Dans le plan de phase, les trajectoires ne sont plus fermées : elles s'enroulent vers l'équilibre stable. Avec plusieurs puits, le puits final dépend de l'énergie initiale et du détail du mouvement.</p>

<figcaption>Ressort transverse de la figure du §7 (\(d=0{,}20\ \text{m}\)) avec un frottement fluide \(-\alpha\,\vec v\) (\(\alpha=0{,}10\ \text{kg·s}^{-1}\), \(m=0{,}10\ \text{kg}\)), lâché sans vitesse en \(x=0{,}30\ \text{m}\) (trajectoire calculée avec <span class="code-inline">odeint</span>). Tant que \(E_m\) dépasse la hauteur de la barrière (0,0625 J), le point passe d'un puits à l'autre (3 passages par \(x=0\)) ; puis il est piégé et sa trajectoire s'enroule vers un minimum de \(E_p\), l'un des deux équilibres stables (points verts).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — l'oscillateur amorti en un coup d'œil</strong>
    <p>Une masse au bout d'un ressort, freinée par un frottement fluide, a pour pulsation propre \(\omega_0=\sqrt{k/m}\) et pour facteur de qualité \(Q=m\omega_0/\alpha\). Pour \(Q\) grand, l'amplitude décroît en \(e^{-t/\tau}\) avec \(\tau=2Q/\omega_0=2m/\alpha\), et l'énergie, proportionnelle au carré de l'amplitude, en \(e^{-2t/\tau}\). Pour \(Q=20\) et \(f_0=2{,}0\ \text{Hz}\) : \(\tau=40/(4\pi)\approx3{,}2\ \text{s}\) ; au bout de 5 s, il reste \(e^{-10/3{,}2}\approx4\ \%\) de l'énergie initiale. L'étude complète (forme canonique, trois régimes, durée du transitoire, régime forcé) est faite dans le chapitre « Oscillateurs harmoniques », §5 à §10, avec ces notations.</p>
  </div>
  <div class="method-box">
    <strong>Exemple — combien d'énergie dissipe un frottement solide ?</strong>
    <p>Un palet de 0,40 kg lancé à \(3{,}0\ \text{m·s}^{-1}\) glisse sur une table horizontale et s'arrête après 2,3 m. Théorème de l'énergie cinétique : le frottement, de norme \(f\) supposée constante, a fourni \(-\tfrac12mv_0^2=-1{,}8\ \text{J}\), donc \(f=1{,}8/2{,}3\approx0{,}78\ \text{N}\), environ \(0{,}20\,mg\). Ces 1,8 J sont passés en énergie thermique (palet et table).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(E_m=\text{cste}\) en présence de frottements, ou oublier le signe : un frottement fait toujours <strong>diminuer</strong> l'énergie mécanique. Autre piège : pour l'oscillateur amorti, l'enveloppe de l'amplitude décroît en \(e^{-t/\tau}\) avec \(\tau=2Q/\omega_0\) ; c'est l'énergie qui décroît en \(e^{-2t/\tau}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Période d'un mouvement périodique, potentiel en trois dimensions</h2>
  <div class="intro">Trois prolongements, utiles pour comprendre, non exigibles en PTSI.</div>
  <p><strong>Période par une intégrale.</strong> Pour un mouvement borné entre \(x_1\) et \(x_2\), le temps passé entre deux positions s'obtient en séparant les variables dans \(\dot x=\sqrt{2(E_m-E_p)/m}\) :</p>
  <div class="formula">$$T=2\int_{x_1}^{x_2}\frac{\mathrm{d}x}{\sqrt{\dfrac2m\big(E_m-E_p(x)\big)}}$$</div>
  <p>Pour le pendule, on obtient une intégrale elliptique, et, pour les amplitudes modérées, la formule de Borda \(T\approx T_0\left(1+\theta_0^2/16\right)\). Sur la séparatrice, l'intégrale diverge : le pendule met un temps infini à atteindre la position haute.</p>
  <p><strong>Existe-t-il une énergie potentielle ?</strong> En trois dimensions, une force \(\vec F(M)\) dérive d'une énergie potentielle (dans un domaine sans « trou ») si et seulement si son rotationnel est nul ; cet outil d'analyse vectorielle est vu en 2ᵉ année.</p>
  <p><strong>Énergie potentielle effective.</strong> Pour une force centrale conservative, la conservation du moment cinétique ramène le mouvement radial à un mouvement à une dimension dans une énergie potentielle effective : l'analyse des §6 et §7 s'y applique telle quelle (chapitre « Mouvement dans un champ central », au programme de PTSI).</p>
  <p><strong>Effet tunnel.</strong> En mécanique quantique, une particule peut franchir une barrière plus haute que son énergie (désintégration α, microscope à effet tunnel) : la zone « interdite » \(E_p\gt E_m\) ne l'est que pour la mécanique classique.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉNERGIE MÉCANIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 2.3 du programme : calculer une puissance ou un travail, choisir le théorème adapté, exploiter la conservation de l'énergie mécanique ou faire un bilan avec frottement, passer d'une énergie potentielle à une force, lire un graphe d'énergie potentielle, étudier les équilibres et les petits mouvements, lire un portrait de phase et résoudre numériquement une équation non linéaire. Pour l'oscillateur lui-même (régimes, résonance), voir le chapitre « Oscillateurs harmoniques ».</div>

  <div class="method-box"><strong>Méthode 1 — Calculer la puissance ou le travail d'une force</strong>
    <ol>
      <li><span class="step">Référentiel.</span> Le préciser : vitesse, puissance et travail en dépendent.</li>
      <li><span class="step">Puissance.</span> \(\mathcal P=\vec F\cdot\vec v=Fv\cos\alpha\) : motrice si \(\alpha\) est aigu, résistante s'il est obtus, nulle si \(\vec F\perp\vec v\).</li>
      <li><span class="step">Travail.</span> Force constante : \(W=\vec F\cdot\overrightarrow{AB}\) ; poids : \(mg\,(z_A-z_B)\) (axe vers le haut) ; frottement de norme constante \(f\) : \(-f\,L\) avec \(L\) la longueur parcourue ; force conservative : \(E_p(A)-E_p(B)\).</li>
      <li><span class="step">Contrôle.</span> Vérifier le signe : une force qui freine a un travail négatif.</li>
    </ol>
    <p><em>Exemple éclair :</em> on tire une valise sur 50 m à \(1{,}2\ \text{m·s}^{-1}\) constante, par une sangle inclinée de 40° tendue à 30 N. Travail de la tension : \(30\times50\times\cos40^\circ\approx1{,}15\ \text{kJ}\) ; puissance : \(30\times1{,}2\times\cos40^\circ\approx28\ \text{W}\). La vitesse étant constante, \(\Delta E_c=0\) : les frottements ont fourni \(-1{,}15\ \text{kJ}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Choisir entre théorèmes énergétiques et principe fondamental</strong>
    <ol>
      <li><span class="step">Une vitesse entre deux positions.</span> Théorème de l'énergie cinétique (ou de l'énergie mécanique) : pas de temps, pas de forces qui ne travaillent pas.</li>
      <li><span class="step">L'équation du mouvement, un seul degré de liberté.</span> Théorème de la puissance cinétique (ou dérivée de \(E_m\)), puis simplification par la vitesse.</li>
      <li><span class="step">Une force inconnue</span> (réaction, tension) : principe fondamental projeté sur la direction où elle apparaît, souvent après avoir obtenu la vitesse par l'énergie.</li>
    </ol>
    <p><em>Exemple éclair :</em> pendule de longueur 1,2 m et de masse 0,50 kg, lâché à 40°. Énergie : \(v_{\text{bas}}=\sqrt{2g\ell(1-\cos40^\circ)}\approx2{,}35\ \text{m·s}^{-1}\). Principe fondamental projeté sur la direction du fil au point bas : \(T=mg+mv^2/\ell\approx7{,}2\ \text{N}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Obtenir une vitesse par la conservation de l'énergie mécanique</strong>
    <ol>
      <li><span class="step">Bilan des forces.</span> Vérifier que seules des forces conservatives travaillent (méthode 4).</li>
      <li><span class="step">Énergies potentielles.</span> Choisir les origines (et l'orientation des axes), les écrire une fois pour toutes.</li>
      <li><span class="step">Conditions initiales.</span> Calculer \(E_m\) à l'instant où position et vitesse sont connues.</li>
      <li><span class="step">Égalité.</span> \(E_m\) au point cherché \(=E_m\) initiale ; résoudre pour la vitesse.</li>
    </ol>
    <p><em>Exemple éclair :</em> une balle lancée à \(8{,}0\ \text{m·s}^{-1}\) depuis 1,5 m de haut, frottement négligé : au sol, \(v=\sqrt{v_0^2+2gh}\approx9{,}7\ \text{m·s}^{-1}\), quelle que soit la direction du lancer.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Décider si l'énergie mécanique se conserve</strong>
    <ol>
      <li><span class="step">Classer chaque force.</span> Conservative (poids, ressort, gravitation, électrique) ; qui ne travaille pas (réaction d'un support fixe sans frottement, tension d'un fil à point d'attache fixe, force magnétique) ; non conservative qui travaille (frottement, force motrice, support mobile).</li>
      <li><span class="step">Conclure.</span> S'il n'y a pas de force de la troisième famille, \(E_m\) est constante ; sinon, \(\Delta E_m=W(\vec F_{\text{nc}})\) et \(\mathrm{d}E_m/\mathrm{d}t=\mathcal P(\vec F_{\text{nc}})\).</li>
      <li><span class="step">Signe.</span> Des frottements font décroître \(E_m\) ; une force motrice peut l'augmenter.</li>
    </ol>
    <p><em>Exemple éclair :</em> une caisse de 20 kg monte à \(0{,}50\ \text{m·s}^{-1}\) constante sur un tapis roulant incliné de 15°. Son énergie mécanique augmente de \(mgv\sin15^\circ\approx25\ \text{W}\) : le tapis, qui l'entraîne par frottement, est une force non conservative motrice.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : déclarer « la réaction ne travaille pas » sans vérifier que le support est immobile et sans frottement. Sur un tapis roulant, une plate-forme qui monte ou un plan incliné qui recule, elle travaille.</div>

  <div class="method-box"><strong>Méthode 5 — Passer d'une énergie potentielle à une force, et réciproquement</strong>
    <ol>
      <li><span class="step">Établir \(E_p\).</span> Écrire \(\delta W=\vec F\cdot\mathrm{d}\overrightarrow{OM}\), reconnaître une différentielle \(-\mathrm{d}E_p\) (projections : \(\vec e_z\cdot\mathrm{d}\overrightarrow{OM}=\mathrm{d}z\), \(\vec e_r\cdot\mathrm{d}\overrightarrow{OM}=\mathrm{d}r\)).</li>
      <li><span class="step">En déduire la force.</span> À une dimension, \(F_x=-\mathrm{d}E_p/\mathrm{d}x\) ; en trois dimensions, \(\vec F=-\overrightarrow{\operatorname{grad}}\,E_p\) avec l'expression du gradient fournie ; pour \(E_p(r)\), \(\vec F=-E_p'(r)\,\vec e_r\).</li>
      <li><span class="step">Contrôle.</span> La force doit pointer vers les \(E_p\) décroissantes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E_p(x,y)=\tfrac12k\,(x^2+4y^2)\) donne \(\vec F=-kx\,\vec e_x-4ky\,\vec e_y\) : un rappel quatre fois plus raide selon \(y\) que selon \(x\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Lire un graphe d'énergie potentielle</strong>
    <ol>
      <li><span class="step">Énergie.</span> Calculer \(E_m=\tfrac12mv_0^2+E_p(x_0)\) à partir des conditions initiales et tracer la droite horizontale correspondante.</li>
      <li><span class="step">Zone accessible.</span> Les \(x\) où la courbe est sous la droite ; points de rebroussement aux intersections.</li>
      <li><span class="step">Nature.</span> Zone bornée : état lié, mouvement périodique ; zone infinie : état de diffusion. Une barrière plus haute que \(E_m\) n'est pas franchie.</li>
      <li><span class="step">Force.</span> En un point, vers les \(E_p\) décroissantes, d'autant plus forte que la pente est raide.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E_p(x)=E_0\,(x^2-a^2)^2/a^4\) a deux puits (fond nul en \(x=\pm a\)) séparés par une barrière de hauteur \(E_0\) en \(x=0\). Pour \(E_m=0{,}5\,E_0\), le point lancé dans le puits de droite y reste, entre \(0{,}54\,a\) et \(1{,}31\,a\). Pour \(E_m=2E_0\), il franchit la barrière et oscille entre \(-1{,}55\,a\) et \(1{,}55\,a\) : toujours un état lié, puisque \(E_p\) tend vers l'infini des deux côtés.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Trouver les positions d'équilibre et leur stabilité</strong>
    <ol>
      <li><span class="step">Énergie potentielle.</span> L'écrire en fonction de la seule coordonnée du mouvement (abscisse ou angle).</li>
      <li><span class="step">Équilibres.</span> Résoudre \(E_p'(x_e)=0\) (et non \(E_p=0\)).</li>
      <li><span class="step">Stabilité.</span> Signe de \(E_p''(x_e)\) : positif, stable ; négatif, instable ; nul, examiner l'allure ou les dérivées suivantes.</li>
      <li><span class="step">Interprétation.</span> Vérifier sur le graphe ou par un argument physique (sens de la force après un petit écart).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(E_p(x)=E_0\left[(x/a)^3-3\,x/a\right]\) : \(E_p'=\dfrac{3E_0}{a}\left[(x/a)^2-1\right]\) s'annule en \(x=\pm a\) ; \(E_p''=6E_0x/a^3\) : \(x=a\) stable, \(x=-a\) instable.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Établir l'équation des petits mouvements et leur pulsation</strong>
    <ol>
      <li><span class="step">Équilibre stable</span> \(x_e\) (méthode 7).</li>
      <li><span class="step">Équation.</span> Dériver \(E_m\) par rapport au temps (ou projeter le principe fondamental) : \(m\ddot x=-E_p'(x)\).</li>
      <li><span class="step">Linéariser.</span> \(E_p'(x)\approx E_p''(x_e)\,(x-x_e)\), d'où \(\ddot x+\omega_0^2(x-x_e)=0\) avec \(\omega_0=\sqrt{E_p''(x_e)/m}\). Avec un angle et \(E_c=\tfrac12J\dot\theta^2\), \(\omega_0=\sqrt{E_p''(\theta_e)/J}\).</li>
      <li><span class="step">Validité.</span> Préciser que l'écart doit rester petit (terme d'ordre 3 négligeable).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec l'énergie potentielle de la méthode 7, \(E_0=0{,}050\ \text{J}\), \(a=0{,}10\ \text{m}\) et \(m=0{,}20\ \text{kg}\) : \(\omega_0=\sqrt{6E_0/(ma^2)}\approx12\ \text{rad·s}^{-1}\) autour de \(x=a\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : linéariser avant d'avoir trouvé l'équilibre, ou développer autour de \(x=0\) alors que l'équilibre est ailleurs. On développe toujours autour de \(x_e\), en posant \(x=x_e+\varepsilon\).</div>

  <div class="method-box"><strong>Méthode 9 — Lire un portrait de phase</strong>
    <ol>
      <li><span class="step">Axes.</span> Position en abscisse, vitesse en ordonnée ; sens de parcours : vers la droite en haut, vers la gauche en bas.</li>
      <li><span class="step">Formes.</span> Courbe fermée : mouvement périodique ; courbe ouverte : mouvement non borné (ou révolutions pour un angle) ; spirale qui se resserre : frottement, convergence vers un équilibre stable.</li>
      <li><span class="step">Points particuliers.</span> Intersections avec l'axe horizontal : points de rebroussement (amplitude) ; avec l'axe vertical, pour un oscillateur centré en 0 : vitesse maximale. Centre entouré de courbes fermées : équilibre stable ; croisement de séparatrices : équilibre instable.</li>
    </ol>
    <p><em>Exemple éclair :</em> une trajectoire en forme d'ellipse coupe l'axe horizontal en \(\pm3{,}0\ \text{cm}\) et l'axe vertical en \(\pm0{,}60\ \text{m·s}^{-1}\) : oscillation harmonique d'amplitude 3,0 cm et de pulsation \(\omega_0=v_{\max}/X_m=20\ \text{rad·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Résoudre numériquement une équation non linéaire et contrôler le résultat</strong>
    <ol>
      <li><span class="step">Système d'ordre 1.</span> Vecteur d'état \(Y=(x,v)\) : \(\dot x=v\), \(\dot v=\) (somme des forces)\(/m\).</li>
      <li><span class="step">Fonction dérivée.</span> Pour <span class="code-inline">odeint</span>, <span class="code-inline">F(Y, t)</span> renvoie \([v,\ \dot v]\) ; données en unités SI, angles en radians.</li>
      <li><span class="step">Résolution.</span> <span class="code-inline">sol = odeint(F, Y0, t)</span> ; <span class="code-inline">sol[:, 0]</span> est la position, <span class="code-inline">sol[:, 1]</span> la vitesse.</li>
      <li><span class="step">Contrôles.</span> Conservation de \(E_m\) en l'absence de frottement (ou décroissance avec frottement) ; comparaison avec le modèle linéaire aux petites amplitudes ; résultat inchangé si l'on resserre les instants.</li>
    </ol>
    <p><em>Exemple éclair :</em> ressort transverse amorti du cours (§11), lâché à 0,30 m.</p>
    <pre class="codeblock"><span class="kw">def</span> F(Y, t):
    x, v = Y
    ell = np.sqrt(x**2 + d**2)                       <span class="cmt"># longueur du ressort</span>
    <span class="kw">return</span> [v, (-k * (ell - l0) * x / ell - alpha * v) / m]

t = np.linspace(0, 8, 8001)
sol = odeint(F, [0.30, 0.0], t)                      <span class="cmt"># lâché sans vitesse en x = 0,30 m</span>
x, v = sol[:, 0], sol[:, 1]
Em = 0.5 * m * v**2 + 0.5 * k * (np.sqrt(x**2 + d**2) - l0)**2</pre>
    <p>Avec \(m=0{,}10\ \text{kg}\), \(k=50\ \text{N·m}^{-1}\), \(\ell_0=0{,}25\ \text{m}\), \(d=0{,}20\ \text{m}\), \(\alpha=0{,}10\ \text{kg·s}^{-1}\) : la masse finit en \(x\approx-0{,}153\ \text{m}\), dans le puits de gauche, et \(E_m\) est passée de 0,31 J à \(9\times10^{-5}\ \text{J}\), en décroissant sans cesse.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier que <span class="code-inline">odeint</span> attend une fonction d'arguments \((Y,t)\), dans cet ordre, ou lui donner un angle en degrés. Une simulation conservative dont l'énergie dérive nettement est fausse (pas trop grand avec Euler, erreur de signe dans la force).</div>

  <div class="notice"><strong>Pièges classiques du chapitre</strong> : le signe moins de \(F_x=-\mathrm{d}E_p/\mathrm{d}x\) ; \(mgz\) avec un axe vers le bas ; \(\tfrac12kx^2\) avec \(x\) la position au lieu de l'allongement ; la confusion entre « force conservative » (une force qui dérive d'une \(E_p\)) et « mouvement conservatif » (aucune force non conservative ne travaille) ; l'oubli du travail des frottements dans un bilan.</div>
</div>
</template>
