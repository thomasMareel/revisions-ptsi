<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Remonter une piste au téléski</h3>
  <div class="statement">Un skieur de masse \(m=70\ \text{kg}\) est tiré par la perche d'un téléski le long d'une piste rectiligne inclinée de \(\alpha=20^\circ\) sur l'horizontale, à la vitesse constante \(v=2{,}5\ \text{m·s}^{-1}\), sur \(L=400\ \text{m}\). La perche est inclinée de \(\beta=30^\circ\) au-dessus de la piste et exerce une tension \(\vec T\) de norme constante. La neige exerce une réaction normale \(\vec N\) et un frottement de norme constante \(f=40\ \text{N}\) ; l'air est négligé. Référentiel terrestre, galiléen ; \(g=9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Faire le bilan des forces et dire, pour chacune, si elle est motrice, résistante ou si elle ne travaille pas.</div>
  <div class="q"><strong>Q2.</strong> Calculer le travail du poids et celui du frottement sur la montée.</div>
  <div class="q"><strong>Q3.</strong> Appliquer le théorème de l'énergie cinétique pour en déduire le travail de la tension, puis \(T\).</div>
  <div class="q"><strong>Q4.</strong> Quelle puissance la perche fournit-elle au skieur ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Poids : la vitesse monte la pente, le poids a une composante opposée, \(-mg\sin\alpha\) : résistant. Réaction normale : perpendiculaire à la vitesse, elle ne travaille pas. Frottement : opposé à la vitesse, résistant. Tension : angle \(\beta=30^\circ\) aigu avec la vitesse, motrice.</p>
    <p><strong>Q2.</strong> Le skieur s'élève de \(L\sin\alpha\approx137\ \text{m}\) : \(W(\vec P)=-mgL\sin\alpha\approx-9{,}39\times10^{4}\ \text{J}\). Frottement : \(W(\vec f)=-fL=-1{,}60\times10^{4}\ \text{J}\).</p>
    <p><strong>Q3.</strong> La vitesse est constante, donc \(\Delta E_c=0\), et \(0=W(\vec T)+W(\vec P)+W(\vec f)+W(\vec N)\) avec \(W(\vec N)=0\). D'où \(W(\vec T)\approx1{,}10\times10^{5}\ \text{J}\). La tension étant constante et faisant l'angle \(\beta\) avec le déplacement : \(W(\vec T)=TL\cos\beta\), donc \(T=\dfrac{W(\vec T)}{L\cos\beta}\approx317\ \text{N}\).</p>
    <p><strong>Q4.</strong> \(\mathcal P(\vec T)=Tv\cos\beta\approx687\ \text{W}\), de l'ordre de la puissance d'un effort humain intense, fournie ici par le moteur du téléski. On vérifie : \(W(\vec T)/(L/v)=1{,}10\times10^{5}/160\approx687\ \text{W}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Saut à l'élastique</h3>
  <div class="statement">Un sauteur de masse \(m=70\ \text{kg}\) se laisse tomber sans vitesse d'un pont. Il est attaché à un élastique de longueur à vide \(\ell_0=20\ \text{m}\), modélisé, une fois tendu, par un ressort de raideur \(k=200\ \text{N·m}^{-1}\) (détendu, il n'exerce aucune force). Le sauteur est assimilé à un point ; frottements négligés ; \(g=9{,}81\ \text{m·s}^{-2}\). On repère sa position par sa profondeur \(z\) sous le pont (axe vertical descendant).</div>
  <div class="q"><strong>Q1.</strong> Exprimer son énergie potentielle \(E_p(z)\), en distinguant \(z\leq\ell_0\) et \(z\geq\ell_0\) (origine au niveau du pont).</div>
  <div class="q"><strong>Q2.</strong> Quelle est la vitesse quand l'élastique commence à se tendre ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer la profondeur maximale atteinte.</div>
  <div class="q"><strong>Q4.</strong> Où la vitesse est-elle maximale ? La calculer. Quelle est l'accélération au point le plus bas ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'axe est descendant : l'énergie potentielle de pesanteur vaut \(-mgz\). Pour \(z\leq\ell_0\), l'élastique est détendu : \(E_p=-mgz\). Pour \(z\geq\ell_0\), il s'ajoute l'énergie élastique, l'allongement étant \(z-\ell_0\) : \(E_p=-mgz+\tfrac12k(z-\ell_0)^2\).</p>
    <p><strong>Q2.</strong> Seules des forces conservatives travaillent : \(E_m=0\) (départ au repos en \(z=0\)). En \(z=\ell_0\) : \(\tfrac12mv^2=mg\ell_0\), \(v=\sqrt{2g\ell_0}\approx19{,}8\ \text{m·s}^{-1}\).</p>
    <p><strong>Q3.</strong> Au point le plus bas, \(v=0\) : \(E_p(z_{\max})=0\), soit, avec \(x=z_{\max}-\ell_0\), \(\tfrac12kx^2-mgx-mg\ell_0=0\). La racine positive : \(x=\dfrac{mg+\sqrt{(mg)^2+2kmg\ell_0}}{k}\approx15{,}6\ \text{m}\). Profondeur maximale : \(35{,}6\ \text{m}\).</p>
    <p><strong>Q4.</strong> \(E_c=-E_p\) est maximale là où \(E_p\) est minimale, c'est-à-dire là où la force totale s'annule : \(k(z-\ell_0)=mg\), soit \(z=\ell_0+mg/k\approx23{,}4\ \text{m}\). Alors \(\tfrac12mv^2=mgz-\tfrac12k(mg/k)^2\), \(v_{\max}\approx20{,}6\ \text{m·s}^{-1}\) : à peine plus qu'en Q2, car l'élastique freine dès qu'il se tend. Au point bas, la force vaut \(kx-mg\) vers le haut : \(a=(kx-mg)/m\approx34{,}9\ \text{m·s}^{-2}\approx3{,}6\,g\), d'où l'intérêt d'un élastique pas trop raide.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Profil d'énergie potentielle — étude qualitative</h3>
  <div class="statement">Un point matériel de masse \(m\) se déplace sur l'axe \(Ox\) (\(x\gt0\)) avec l'énergie potentielle \(E_p(x)=E_0\left[\left(\dfrac{a}{x}\right)^4-\left(\dfrac{a}{x}\right)^2\right]\), où \(E_0\gt0\) et \(a\gt0\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la position d'équilibre \(x_{\text{éq}}\) et étudier sa stabilité.</div>
  <div class="q"><strong>Q2.</strong> Calculer la pulsation des petites oscillations autour de \(x_{\text{éq}}\).</div>
  <div class="q"><strong>Q3.</strong> À quelle condition sur l'énergie mécanique \(E_m\) le mouvement est-il borné (état lié) ?</div>
  <div class="q"><strong>Q4.</strong> Pour \(E_m=-0{,}20\,E_0\), entre quelles positions le point oscille-t-il ? Ces positions sont-elles symétriques par rapport à \(x_{\text{éq}}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(E_p'(x)=E_0\left[-4a^4/x^5+2a^2/x^3\right]\). Annulation : \(-4a^4+2a^2x^2=0\) (en multipliant par \(x^5/E_0\)), soit \(x^2=2a^2\), donc \(x_{\text{éq}}=a\sqrt2\). Pour \(x\to0^+\), \(E_p\to+\infty\) (le terme \(a^4/x^4\) domine) ; pour \(x\to\infty\), \(E_p\to0^-\). La fonction descend puis remonte vers 0 : elle admet en \(x_{\text{éq}}\) un minimum, l'équilibre est stable. Valeur : \(E_p(x_{\text{éq}})=E_0\left[\tfrac14-\tfrac12\right]=-E_0/4\).</p>
    <p><strong>Q2.</strong> \(E_p''(x)=E_0\left[20a^4/x^6-6a^2/x^4\right]\). En \(x^2=2a^2\) : \(E_p''(x_{\text{éq}})=E_0\left[\dfrac{20}{8a^2}-\dfrac{6}{4a^2}\right]=\dfrac{E_0}{a^2}\gt0\). Pulsation : \(\omega_0=\sqrt{E_p''(x_{\text{éq}})/m}=\dfrac1a\sqrt{\dfrac{E_0}{m}}\).</p>
    <p><strong>Q3.</strong> \(E_p\) tend vers 0 à l'infini : si \(E_m\geq0\), le point peut s'éloigner indéfiniment (état de diffusion). Il faut \(E_m\lt0\), et bien sûr \(E_m\geq\min E_p\) : \(-E_0/4\leq E_m\lt0\) (pour \(E_m=-E_0/4\), le point est au repos à l'équilibre).</p>
    <p><strong>Q4.</strong> Points de rebroussement : \(E_p(x)=E_m\). En posant \(u=(a/x)^2\) : \(u^2-u+0{,}20=0\), \(u=\dfrac{1\pm\sqrt{0{,}20}}{2}\), soit \(u\approx0{,}724\) ou \(0{,}276\), d'où \(x=a/\sqrt u\approx1{,}18\,a\) et \(1{,}90\,a\). Autour de \(x_{\text{éq}}\approx1{,}41\,a\), l'écart vaut \(0{,}24\,a\) d'un côté et \(0{,}49\,a\) de l'autre : le puits n'est pas symétrique (mur raide à gauche, pente douce à droite), l'approximation harmonique ne vaut plus à cette énergie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Glissade sur un plan incliné : bilan avec frottement (lois de Coulomb, vues en SI)</h3>
  <div class="statement">Un solide de masse \(m\), assimilé à un point, est lâché sans vitesse en haut d'un plan incliné d'angle \(\alpha\) sur l'horizontale. Le contact présente un frottement solide de coefficient \(f\) : pendant le glissement, la composante tangentielle de la réaction, opposée au mouvement, a pour norme \(fN\), où \(N\) est la norme de la composante normale (loi de Coulomb, étudiée en sciences industrielles). On note \(L\) la longueur parcourue le long de la pente et \(g\) l'intensité de la pesanteur.</div>
  <div class="q"><strong>Q1.</strong> Par le principe fondamental, établir \(N\) et l'accélération du solide le long de la pente. À quelle condition le solide glisse-t-il (on admet que le coefficient au démarrage est aussi \(f\)) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse \(v\) en bas de la pente par le théorème de l'énergie cinétique.</div>
  <div class="q"><strong>Q3.</strong> Quelle fraction de l'énergie potentielle initiale a été dissipée ? Application : \(\alpha=30^\circ\), \(f=0{,}30\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Axe \(Ox\) le long de la pente vers le bas, \(Oy\) normal à la pente. Poids \(mg(\sin\alpha\,\vec e_x-\cos\alpha\,\vec e_y)\), réaction normale \(N\,\vec e_y\), frottement \(-fN\,\vec e_x\). Selon \(\vec e_y\) (pas de mouvement normal) : \(N=mg\cos\alpha\). Selon \(\vec e_x\) : \(m\ddot x=mg(\sin\alpha-f\cos\alpha)\). Le solide glisse si cette accélération est positive : \(\tan\alpha\gt f\).</p>
    <p><strong>Q2.</strong> Travaux sur la descente : poids \(mgL\sin\alpha\) (moteur), réaction normale 0, frottement \(-fNL=-fmgL\cos\alpha\) (résistant). Théorème de l'énergie cinétique : \(\tfrac12mv^2=mgL(\sin\alpha-f\cos\alpha)\), d'où \(v=\sqrt{2gL(\sin\alpha-f\cos\alpha)}\). C'est l'outil adapté : on cherche une vitesse entre deux positions ; \(N\), en revanche, demandait le principe fondamental.</p>
    <p><strong>Q3.</strong> Énergie dissipée : \(|W_f|=fmgL\cos\alpha\) ; énergie potentielle perdue : \(mgL\sin\alpha\). Fraction : \(f/\tan\alpha=0{,}30/\tan30^\circ\approx0{,}52\) : plus de la moitié de l'énergie part en échauffement du solide et du plan.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une charge entre deux charges : équilibre et stabilité</h3>
  <div class="statement">Deux charges ponctuelles identiques \(Q=1{,}0\ \text{µC}\) sont fixées en \(A(-a,0)\) et \(B(a,0)\), avec \(a=10\ \text{cm}\). Une petite bille de masse \(m=1{,}0\ \text{g}\), de charge \(q=1{,}0\ \text{µC}\), peut glisser sans frottement le long d'une tige rectiligne isolante. On prend \(\dfrac1{4\pi\varepsilon_0}=9{,}0\times10^{9}\ \text{SI}\) et l'on néglige le poids (tige horizontale, réaction verticale).</div>
  <div class="q"><strong>Q1.</strong> La tige est l'axe \(Ox\), et la bille reste entre \(A\) et \(B\). Écrire son énergie potentielle \(E_p(x)\) et montrer que \(x=0\) est une position d'équilibre stable.</div>
  <div class="q"><strong>Q2.</strong> Calculer la pulsation et la fréquence des petites oscillations.</div>
  <div class="q"><strong>Q3.</strong> Quelle vitesse faut-il donner à la bille en \(x=0\) pour qu'elle atteigne \(x=5{,}0\ \text{cm}\) ?</div>
  <div class="q"><strong>Q4.</strong> On place maintenant la tige selon l'axe \(Oy\), perpendiculaire à \(AB\) en son milieu. Écrire \(E_p(y)\). L'équilibre en \(O\) est-il encore stable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La bille est à la distance \(a+x\) de \(A\) et \(a-x\) de \(B\) : \(E_p(x)=\dfrac{qQ}{4\pi\varepsilon_0}\left(\dfrac1{a+x}+\dfrac1{a-x}\right)\). Elle est paire, donc \(E_p'(0)=0\) : équilibre. \(E_p''(x)=\dfrac{qQ}{4\pi\varepsilon_0}\left(\dfrac2{(a+x)^3}+\dfrac2{(a-x)^3}\right)\), qui vaut en 0 \(\dfrac{4qQ}{4\pi\varepsilon_0a^3}\gt0\) : minimum, équilibre stable (chaque charge repousse la bille vers le milieu).</p>
    <p><strong>Q2.</strong> \(E_p''(0)=\dfrac{4\times9{,}0\times10^{9}\times10^{-12}}{0{,}10^3}\), soit \(36\ \text{N·m}^{-1}\). \(\omega_0=\sqrt{36/10^{-3}}\approx190\ \text{rad·s}^{-1}\), \(f_0\approx30\ \text{Hz}\).</p>
    <p><strong>Q3.</strong> \(E_p(0)=2\times9{,}0\times10^{-3}/0{,}10=0{,}180\ \text{J}\) ; \(E_p(0{,}05)=9{,}0\times10^{-3}\left(\dfrac1{0{,}15}+\dfrac1{0{,}05}\right)\), soit \(0{,}240\ \text{J}\). Conservation : \(\tfrac12mv_0^2=0{,}060\ \text{J}\), \(v_0\approx11\ \text{m·s}^{-1}\).</p>
    <p><strong>Q4.</strong> Sur l'axe \(Oy\), la bille est à la distance \(\sqrt{a^2+y^2}\) de chaque charge : \(E_p(y)=\dfrac{2qQ}{4\pi\varepsilon_0\sqrt{a^2+y^2}}\), maximale en \(y=0\) (\(E_p''(0)=-18\ \text{N·m}^{-1}\)) : l'équilibre est instable dans cette direction, les deux répulsions chassant la bille sur le côté. Une position d'équilibre peut être stable selon une direction et instable selon une autre ; en électrostatique, aucune position n'est stable dans toutes les directions (théorème d'Earnshaw, hors programme).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Vibration d'une molécule : le potentiel de Morse</h3>
  <div class="statement">L'énergie potentielle d'interaction des atomes d'une molécule diatomique, en fonction de leur distance \(r\), est bien décrite par le potentiel de Morse \(E_p(r)=D\left(1-e^{-\beta(r-r_e)}\right)^2\). Pour HCl : \(D=4{,}62\ \text{eV}\), \(\beta=1{,}87\times10^{10}\ \text{m}^{-1}\), \(r_e=127\ \text{pm}\). On considère l'atome de chlore fixe et l'atome d'hydrogène (\(m=1{,}67\times10^{-27}\ \text{kg}\)) mobile sur l'axe de la molécule ; \(1\ \text{eV}=1{,}60\times10^{-19}\ \text{J}\).</div>
  <div class="q"><strong>Q1.</strong> Tracer l'allure de \(E_p(r)\). Quelle est la position d'équilibre ? Que représente \(D\) ?</div>
  <div class="q"><strong>Q2.</strong> Établir l'équation des petits mouvements autour de \(r_e\) et calculer la raideur effective, la pulsation et la fréquence de vibration.</div>
  <div class="q"><strong>Q3.</strong> Comparer \(E_p(r_e-\delta)\) et \(E_p(r_e+\delta)\) pour \(\beta\delta=0{,}20\), puis à l'approximation harmonique. Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(E_p\) est nulle en \(r=r_e\) (minimum, car c'est un carré), très grande quand \(r\to0\) (répulsion), et tend vers \(D\) quand \(r\to\infty\). Équilibre stable en \(r_e\) ; \(D\) est la hauteur du puits : l'énergie à fournir pour dissocier la molécule au repos. Une énergie mécanique \(E_m\lt D\) donne un état lié (molécule), \(E_m\geq D\) un état de diffusion (atomes séparés).</p>
    <p><strong>Q2.</strong> En dérivant deux fois : \(E_p''(r_e)=2D\beta^2\). Équation linéarisée : \(m\ddot r+2D\beta^2(r-r_e)=0\). Raideur :</p>
    <div class="formula">$$2D\beta^2=2\times4{,}62\times1{,}60\times10^{-19}\times(1{,}87\times10^{10})^2\approx517\ \text{N·m}^{-1}$$</div>
    <p>d'où \(\omega_0=\sqrt{2D\beta^2/m}\approx5{,}6\times10^{14}\ \text{rad·s}^{-1}\) ; \(f_0\approx8{,}8\times10^{13}\ \text{Hz}\) (infrarouge).</p>
    <p><strong>Q3.</strong> \(E_p(r_e-\delta)=D\,(1-e^{0{,}20})^2\approx0{,}049\,D\), \(E_p(r_e+\delta)=D\,(1-e^{-0{,}20})^2\approx0{,}033\,D\), et l'approximation harmonique donne \(D\beta^2\delta^2=0{,}040\,D\) des deux côtés. Le puits réel est plus raide à courte distance et plus mou à grande distance : à cette amplitude (\(\delta\approx11\ \text{pm}\)), les termes non linéaires (d'ordre 3, \(E_p'''(r_e)=-6D\beta^3\)) modifient l'énergie de 20 %. C'est l'anharmonicité, qui finit par rompre la liaison à forte excitation.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Un ressort qui durcit : portrait de phase et période</h3>
  <div class="statement">Un ressort réel durcit aux grands allongements. On modélise la force qu'il exerce sur une masse \(m=0{,}10\ \text{kg}\) mobile sur un axe horizontal, sans frottement, par \(F_x=-kx-\beta x^3\), avec \(k=40\ \text{N·m}^{-1}\) et \(\beta=1{,}0\times10^{5}\ \text{N·m}^{-3}\) (\(x\) : allongement).</div>
  <div class="q"><strong>Q1.</strong> Montrer que cette force dérive d'une énergie potentielle, que l'on déterminera (nulle en \(x=0\)). Quelles sont les positions d'équilibre, et leur stabilité ?</div>
  <div class="q"><strong>Q2.</strong> Décrire l'allure du portrait de phase. Le mouvement est-il toujours périodique ?</div>
  <div class="q"><strong>Q3.</strong> La masse est lâchée sans vitesse depuis \(x=X\). Exprimer sa vitesse maximale, et la calculer pour \(X=0{,}5\), 2 et 4 cm. Comparer au modèle linéaire (\(\beta=0\)).</div>
  <div class="q"><strong>Q4.</strong> Écrire la fonction <span class="code-inline">F(Y, t)</span> à fournir à <span class="code-inline">odeint</span>. La simulation donne des périodes de 0,307 s, 0,238 s et 0,159 s pour \(X=0{,}5\), 2 et 4 cm. Commenter, en comparant à la période propre du modèle linéaire.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À une dimension, une force qui ne dépend que de \(x\) dérive toujours d'une énergie potentielle : \(E_p(x)=-\int_0^xF_x\,\mathrm{d}x=\tfrac12kx^2+\tfrac14\beta x^4\). \(E_p'(x)=x(k+\beta x^2)\) ne s'annule qu'en \(x=0\), où \(E_p''(0)=k\gt0\) : un seul équilibre, stable.</p>
    <p><strong>Q2.</strong> \(E_p\) croît sans limite des deux côtés : pour toute énergie, la zone accessible est un segment \([-X,X]\) symétrique. Les trajectoires de phase \(\tfrac12m\dot x^2+E_p(x)=E_m\) sont des courbes fermées autour de l'origine, parcourues dans le sens des aiguilles d'une montre : le mouvement est toujours périodique. Près de l'origine, ce sont presque des ellipses ; aux grandes énergies, elles s'aplatissent sur les côtés (le mur de potentiel en \(x^4\) est plus raide qu'une parabole).</p>
    <p><strong>Q3.</strong> Conservation entre l'élongation maximale et le passage en \(x=0\) : \(\tfrac12mv_{\max}^2=\tfrac12kX^2+\tfrac14\beta X^4\). Pour \(X=0{,}5\ \text{cm}\) : \(0{,}102\ \text{m·s}^{-1}\) (linéaire : \(X\sqrt{k/m}=0{,}100\)) ; 2 cm : \(0{,}49\ \text{m·s}^{-1}\) (0,40) ; 4 cm : \(1{,}39\ \text{m·s}^{-1}\) (0,80). Le terme non linéaire compte dès que \(\beta X^2\) n'est plus petit devant \(k\) : \(\beta X^2/k\) vaut 0,06, 1 et 4.</p>
    <p><strong>Q4.</strong> Avec <span class="code-inline">Y = [x, v]</span> :</p>
    <pre class="codeblock"><span class="kw">def</span> F(Y, t):
    x, v = Y
    <span class="kw">return</span> [v, -(k * x + beta * x**3) / m]</pre>
    <p>Le modèle linéaire a une période indépendante de l'amplitude, \(T_0=2\pi\sqrt{m/k}\approx0{,}314\ \text{s}\). Ici, la période diminue quand l'amplitude augmente (−2 % à 0,5 cm, −24 % à 2 cm, −49 % à 4 cm) : le rappel, plus fort que \(-kx\), ramène la masse plus vite. C'est l'inverse du pendule, dont le rappel \(\sin\theta\) est plus faible que \(\theta\) et dont la période augmente avec l'amplitude. Dans les deux cas, la perte d'isochronisme est la signature du terme non linéaire.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Looping : énergie et condition de passage</h3>
  <div class="statement">Un point matériel de masse \(m=0{,}10\ \text{kg}\) est lâché sans vitesse d'une hauteur \(h\) sur une piste, puis aborde une boucle verticale (looping) de rayon \(r=0{,}50\ \text{m}\), par l'intérieur. On prend \(g=9{,}8\ \text{m·s}^{-2}\). Les hauteurs sont mesurées à partir du bas de la boucle.</div>
  <p class="exo-part">Partie A — Piste sans frottement</p>
  <div class="q"><strong>A1.</strong> Exprimer la vitesse \(v_b\) en bas de la boucle en fonction de \(h\).</div>
  <div class="q"><strong>A2.</strong> Relier la vitesse \(v_s\) au sommet de la boucle à \(v_b\), puis à \(h\).</div>
  <div class="q"><strong>A3.</strong> Quelle hauteur minimale \(h_{\min}\) permet de faire le tour sans décoller au sommet ? Calculer \(v_s\) correspondante.</div>
  <p class="exo-part">Partie B — Avec frottements</p>
  <div class="q"><strong>B1.</strong> Les frottements dissipent \(W_f=0{,}20\ \text{J}\) avant le sommet. Quelle hauteur de départ faut-il alors pour faire le tour ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> La réaction de la piste, normale, ne travaille pas : \(E_m\) se conserve, \(\tfrac12mv_b^2=mgh\), \(v_b=\sqrt{2gh}\).</p>
    <p><strong>A2.</strong> Le sommet est à \(2r\) au-dessus du bas : \(\tfrac12mv_b^2=\tfrac12mv_s^2+mg\,(2r)\), donc \(v_s^2=v_b^2-4gr=2gh-4gr\).</p>
    <p><strong>A3.</strong> Au sommet, le principe fondamental projeté sur la normale (vers le centre) donne \(N+mg=mv_s^2/r\). Le contact est maintenu si \(N\geq0\), soit \(v_s^2\geq gr\). Avec A2 : \(2gh-4gr\geq gr\), \(h_{\min}=\dfrac{5r}2=1{,}25\ \text{m}\), et \(v_s=\sqrt{gr}\approx2{,}2\ \text{m·s}^{-1}\). L'énergie seule ne suffit pas : il faut le principe fondamental pour exprimer la condition de contact (méthode 2).</p>
    <p><strong>B1.</strong> Théorème de l'énergie mécanique : \(\tfrac12mv_s^2+mg\,(2r)-mgh=-W_f\), avec \(v_s^2=gr\) : \(h=\dfrac{5r}2+\dfrac{W_f}{mg}\), soit \(h=1{,}25+\dfrac{0{,}20}{0{,}10\times9{,}8}\approx1{,}45\ \text{m}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Un tir vertical très haut : quand mgz ne suffit plus</h3>
  <div class="statement">On lance verticalement, depuis la surface de la Terre, un projectile à la vitesse \(v_0\) ; on néglige l'atmosphère et la rotation de la Terre. \(\mathcal GM_T=3{,}99\times10^{14}\ \text{m}^3\text{·s}^{-2}\), \(R_T=6\,371\ \text{km}\), \(g_0=9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Avec le modèle du champ de pesanteur uniforme, exprimer et calculer l'altitude maximale pour \(v_0=5{,}0\ \text{km·s}^{-1}\).</div>
  <div class="q"><strong>Q2.</strong> Reprendre avec l'énergie potentielle de gravitation \(-\mathcal GM_Tm/r\). Comparer.</div>
  <div class="q"><strong>Q3.</strong> Même comparaison pour \(v_0=8{,}0\ \text{km·s}^{-1}\). Au-delà de quelle vitesse le projectile ne retombe-t-il pas ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\tfrac12mv_0^2=mg_0h\), \(h=v_0^2/(2g_0)\approx1\,270\ \text{km}\).</p>
    <p><strong>Q2.</strong> Conservation : \(\tfrac12mv_0^2-\dfrac{\mathcal GM_Tm}{R_T}=-\dfrac{\mathcal GM_Tm}{r_{\max}}\), d'où \(r_{\max}=\dfrac{R_T}{1-v_0^2R_T/(2\mathcal GM_T)}\approx7\,960\ \text{km}\), soit \(h\approx1\,590\ \text{km}\) : 25 % de plus. Le modèle uniforme surestime l'attraction en altitude (elle décroît en \(1/r^2\)), donc sous-estime l'altitude atteinte.</p>
    <p><strong>Q3.</strong> Pour \(8{,}0\ \text{km·s}^{-1}\) : modèle uniforme 3 260 km, gravitation 6 670 km, deux fois plus. Le projectile s'échappe si \(E_m\geq0\) : \(v_0\geq\sqrt{2\mathcal GM_T/R_T}\approx11{,}2\ \text{km·s}^{-1}\) (vitesse de libération). Avec \(mgz\), qui croît sans limite, on n'aurait jamais trouvé d'état de diffusion.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Pendule lancé depuis le bas : oscillations, tours, fil qui se détend</h3>
  <div class="statement">Une petite masse \(m\) est attachée à un fil inextensible de longueur \(\ell=0{,}80\ \text{m}\) et de masse négligeable, dont l'autre extrémité \(O\) est fixe. Au repos en bas, on lui donne une vitesse horizontale \(v_0\). On repère la masse par l'angle \(\theta\) entre le fil et la verticale descendante ; frottements négligés ; \(g=9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Tant que le fil est tendu, exprimer \(v^2\) en fonction de \(\theta\), puis, par le principe fondamental projeté sur la direction du fil, la tension \(T(\theta)\).</div>
  <div class="q"><strong>Q2.</strong> On pose \(c=v_0^2/(g\ell)\). Montrer que le fil reste tendu pendant tout le mouvement si \(c\leq2\) ou si \(c\geq5\). Décrire les deux cas.</div>
  <div class="q"><strong>Q3.</strong> Pour \(c=3{,}5\), en quel angle le fil se détend-il ? Que fait ensuite la masse ?</div>
  <div class="q"><strong>Q4.</strong> On remplace le fil par une tige rigide de masse négligeable. Quelle est la condition pour que le pendule fasse des tours ? Situer les trois mouvements sur le portrait de phase du cours.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La tension est perpendiculaire à la vitesse : \(E_m\) se conserve. Altitude par rapport au bas : \(\ell(1-\cos\theta)\), donc \(v^2=v_0^2-2g\ell(1-\cos\theta)\). Selon la direction du fil, vers \(O\) : \(T-mg\cos\theta=mv^2/\ell\), soit \(T=m\left(\dfrac{v_0^2}{\ell}-2g+3g\cos\theta\right)\).</p>
    <p><strong>Q2.</strong> \(T=mg\,(c-2+3\cos\theta)\). Si \(c\leq2\), la vitesse s'annule avant l'horizontale : amplitude \(\theta_m\) avec \(\cos\theta_m=1-c/2\geq0\). Alors \(c-2=-2\cos\theta_m\) et \(T=mg\,(3\cos\theta-2\cos\theta_m)\) ; comme \(\cos\theta\geq\cos\theta_m\) pendant le mouvement, \(T\geq mg\cos\theta_m\geq0\) : la masse oscille, fil tendu. Si \(c\geq5\), \(T\geq mg\,(c-5)\geq0\) même en haut (\(\cos\theta=-1\)) : la masse fait des tours complets, fil tendu.</p>
    <p><strong>Q3.</strong> \(T=0\) pour \(\cos\theta=(2-c)/3=-0{,}5\), soit \(\theta=120^\circ\), avant que la vitesse ne s'annule (\(v^2=-g\ell\cos\theta\gt0\), \(v\approx2{,}0\ \text{m·s}^{-1}\)). Le fil se détend : la masse n'est plus soumise qu'à son poids et décrit une parabole à l'intérieur du cercle, jusqu'à ce que le fil se tende à nouveau (avec un choc).</p>
    <p><strong>Q4.</strong> Une tige peut pousser comme tirer : seule compte l'énergie. Tours complets si la masse arrive en haut avec une vitesse non nulle : \(\tfrac12mv_0^2\gt2mg\ell\), soit \(c\gt4\) (\(v_0\gt5{,}6\ \text{m·s}^{-1}\)). Sur le portrait de phase : \(c\lt4\) courbe fermée (oscillations), \(c=4\) séparatrice, \(c\gt4\) révolutions. Pour un fil, seule la partie \(|\theta|\leq90^\circ\) des courbes fermées et les révolutions avec \(c\geq5\) restent valables.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un récupérateur d'énergie bistable</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>énergie potentielle, équilibres et stabilité, petits mouvements, portrait de phase, résolution numérique, bilan avec frottement</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Pour alimenter des capteurs sans pile, on récupère l'énergie des vibrations ambiantes avec un petit oscillateur : une masse mobile dont le mouvement est converti en énergie électrique. Les dispositifs <em>bistables</em> (une lame flambée, ou une masse aimantée entre deux aimants) ont deux positions d'équilibre stables. On modélise la masse mobile (\(m=10\ \text{g}\)) comme un point se déplaçant sur un axe horizontal \(Ox\), dans le référentiel galiléen du support, soumis à une force conservative d'énergie potentielle
    $$E_p(x)=E_b\left[\left(\frac xa\right)^4-2\left(\frac xa\right)^2\right]\qquad a=5{,}0\ \text{mm},\quad E_b=0{,}50\ \text{mJ}$$
    La conversion électromécanique est modélisée, dans les parties C et D, par une force de frottement fluide \(-\alpha\vec v\) : l'énergie qu'elle prélève est l'énergie récupérée.
  </div>
  <p class="exo-part">Partie A — Le profil d'énergie potentielle</p>
  <div class="q"><strong>A1.</strong> Déterminer les positions d'équilibre et leur stabilité. Tracer l'allure de \(E_p(x)\) ; identifier puits et barrière, et la hauteur de la barrière.</div>
  <div class="q"><strong>A2.</strong> Exprimer la force \(F_x(x)\). Dans quel sens agit-elle en \(x=a/2\) ? en \(x=2a\) ?</div>
  <p class="exo-part">Partie B — Petites oscillations dans un puits</p>
  <div class="q"><strong>B1.</strong> Établir l'équation des petits mouvements autour de \(x=a\). Calculer la pulsation et la fréquence propres.</div>
  <div class="q"><strong>B2.</strong> Calculer \(E_p'''(a)\). En comparant les termes d'ordre 2 et 3 du développement de \(E_p\), estimer l'écart \(|x-a|\) en dessous duquel l'approximation harmonique est correcte à 10 % près.</div>
  <p class="exo-part">Partie C — Portrait de phase sans frottement</p>
  <div class="q"><strong>C1.</strong> Décrire les trois familles de trajectoires de phase selon le signe de \(E_m\) et dessiner l'allure du portrait. Quelle est l'équation de la séparatrice ?</div>
  <div class="q"><strong>C2.</strong> La masse est au repos en \(x=a\). Quelle vitesse minimale faut-il lui communiquer pour qu'elle passe dans l'autre puits ?</div>
  <p class="exo-part">Partie D — Simulation avec frottement</p>
  <div class="q"><strong>D1.</strong> Avec \(\alpha=0{,}050\ \text{kg·s}^{-1}\), calculer le facteur de qualité \(Q=m\omega_0/\alpha\) des petites oscillations. Écrire la fonction <span class="code-inline">F(Y, t)</span> et l'appel à <span class="code-inline">odeint</span> pour une masse lâchée sans vitesse en \(x=2a\), sur 2 s.</div>
  <div class="q"><strong>D2.</strong> La simulation montre neuf passages par \(x=0\), le dernier vers \(t=0{,}36\ \text{s}\), puis des oscillations amorties autour de \(x=-a\). Interpréter à l'aide de l'énergie mécanique. Quelle énergie a été récupérée en tout ?</div>
  <div class="q"><strong>D3.</strong> En recommençant avec \(\alpha=0{,}020\), 0,10 et \(0{,}20\ \text{kg·s}^{-1}\), on obtient respectivement 22, 4 et 2 passages, et la masse finit en \(x=+a\) dans les trois cas. Le puits final se prévoit-il facilement ? Quel avantage voit-on à un dispositif bistable pour récupérer de l'énergie ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(E_p'(x)=\dfrac{4E_b}{a^2}\,x\left[\left(\dfrac xa\right)^2-1\right]\), nulle en \(x=0\) et \(x=\pm a\). \(E_p''(x)=\dfrac{4E_b}{a^2}\left[3\left(\dfrac xa\right)^2-1\right]\) : \(-4E_b/a^2\lt0\) en 0 (instable), \(8E_b/a^2\gt0\) en \(\pm a\) (stables). Deux puits de fond \(-E_b\) en \(\pm a\), séparés par une barrière de sommet 0 en \(x=0\) : hauteur \(E_b=0{,}50\ \text{mJ}\) ; \(E_p\to+\infty\) aux deux extrémités.</p>
    <p><strong>A2.</strong> \(F_x=-E_p'(x)=\dfrac{4E_b}{a^2}\,x\left[1-\left(\dfrac xa\right)^2\right]\). En \(x=a/2\) : \(F_x\gt0\), la force pousse vers le fond du puits, en \(a\) ; en \(x=2a\) : \(F_x\lt0\), elle ramène aussi vers \(a\). Les deux sont cohérents avec la lecture du graphe (vers les \(E_p\) décroissantes).</p>
    <p><strong>B1.</strong> \(m\ddot x=-E_p'(x)\approx-E_p''(a)\,(x-a)\), soit \(\ddot x+\omega_0^2(x-a)=0\) avec \(\omega_0=\sqrt{8E_b/(ma^2)}\). Raideur effective \(8\times0{,}50\times10^{-3}/(5{,}0\times10^{-3})^2=160\ \text{N·m}^{-1}\), \(\omega_0\approx126\ \text{rad·s}^{-1}\), \(f_0\approx20\ \text{Hz}\) : l'ordre de grandeur des vibrations d'une machine ou d'un véhicule.</p>
    <p><strong>B2.</strong> \(E_p'''(x)=24E_bx/a^4\), donc \(E_p'''(a)=24E_b/a^3\). Rapport des termes d'ordre 3 et 2 : \(\dfrac{E_p'''(a)\,|x-a|^3/6}{E_p''(a)\,(x-a)^2/2}=\dfrac{|x-a|}{a}\). Il est inférieur à 10 % pour \(|x-a|\lt0{,}1\,a=0{,}5\ \text{mm}\) : le puits n'est harmonique que de très près.</p>
    <p><strong>C1.</strong> \(E_m\lt0\) : courbes fermées dans un seul puits, autour de \((\pm a,0)\) (oscillations intra-puits) ; \(E_m\gt0\) : grandes courbes fermées qui entourent les deux puits (oscillations inter-puits, la masse franchit la barrière à chaque demi-période) ; \(E_m=0\) : la séparatrice, en forme de huit, qui passe par le col \((0,0)\) : \(\tfrac12m\dot x^2=E_b\left[2(x/a)^2-(x/a)^4\right]\). Tous les mouvements sont bornés (périodiques), sauf sur la séparatrice.</p>
    <p><strong>C2.</strong> Il faut \(E_m\gt0\) : \(\tfrac12mv^2-E_b\gt0\), \(v\gt\sqrt{2E_b/m}\approx0{,}32\ \text{m·s}^{-1}\).</p>
    <p><strong>D1.</strong> \(Q=10^{-2}\times126/0{,}050\approx25\). Avec <span class="code-inline">Y = [x, v]</span> :</p>
    <pre class="codeblock"><span class="kw">def</span> F(Y, t):
    x, v = Y
    dEp = Eb * (4 * x**3 / a**4 - 4 * x / a**2)      <span class="cmt"># dérivée de Ep</span>
    <span class="kw">return</span> [v, (-dEp - alpha * v) / m]

t = np.linspace(0, 2, 200001)
sol = odeint(F, [2 * a, 0.0], t)</pre>
    <p><strong>D2.</strong> \(E_m(0)=E_p(2a)=8E_b=4{,}0\ \text{mJ}\gt0\) : la masse commence par des oscillations inter-puits. \(\mathrm{d}E_m/\mathrm{d}t=-\alpha v^2\lt0\) : l'énergie diminue à chaque aller-retour. Tant que \(E_m\gt0\), la masse franchit la barrière ; quand \(E_m\) devient négative (vers 0,36 s), elle reste piégée dans le puits où elle se trouve, ici celui de gauche, et oscille autour de \(-a\) en s'amortissant. À la fin, \(E_m=-E_b\) : l'énergie récupérée vaut \(8E_b-(-E_b)=9E_b=4{,}5\ \text{mJ}\), quel que soit le puits final.</p>
    <p><strong>D3.</strong> Le puits final dépend du détail de la dissipation (de la parité du nombre de passages) : sans simulation, on ne peut pas le prévoir simplement, une petite variation de \(\alpha\) ou de la position de départ le change. En revanche, l'énergie récupérée ne dépend que des états initial et final. Avantage du bistable : une vibration du support assez forte pour faire sauter la barrière entretient de grands mouvements inter-puits, rapides (ici jusqu'à \(0{,}9\ \text{m·s}^{-1}\)), donc une grande puissance prélevée \(\alpha v^2\), sur une large gamme de fréquences, alors qu'un oscillateur linéaire ne répond fortement qu'au voisinage de sa résonance.</p>
