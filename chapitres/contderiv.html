<div class="exo-wrapper">

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Limites : définition, encadrement, absence de limite</h3>
  <div class="statement">Quatre limites, chacune avec un outil différent du cours (§1, §2).</div>
  <div class="q"><strong>Q1.</strong> Montrer à l'aide de la définition que \(\lim_{x \to 3}(2x + 5) = 11\). Quel \(\eta\) convient pour \(\varepsilon = 10^{-2}\) ?</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\lim_{x \to +\infty}\dfrac{3x - \cos x}{x + 2}\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\lim_{x \to 0} x^2\sin\dfrac1x = 0\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que la fonction \(\cos\) n'a pas de limite en \(+\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(|(2x + 5) - 11| = 2|x - 3|\). Pour \(\varepsilon \gt 0\), si \(|x - 3| \le \varepsilon/2\), alors \(|(2x + 5) - 11| \le \varepsilon\) : \(\eta = \varepsilon/2\) convient. Pour \(\varepsilon = 10^{-2}\), \(\eta = 5 \times 10^{-3}\).</p>
    <p><strong>Q2.</strong> Le terme \(\cos x\) n'a pas de limite, mais il est borné : on encadre. Pour \(x \gt -2\), comme \(-1 \le \cos x \le 1\),</p>
    <div class="formula">$$\frac{3x - 1}{x + 2} \le \frac{3x - \cos x}{x + 2} \le \frac{3x + 1}{x + 2},$$</div>
    <p>et les deux bornes tendent vers 3 (quotient des termes de plus haut degré). Par encadrement, la limite vaut <strong>3</strong>.</p>
    <p><strong>Q3.</strong> Pour \(x \ne 0\), \(\left|x^2\sin\frac1x\right| \le x^2\), et \(x^2 \to 0\) : par encadrement (\(-x^2 \le x^2\sin\frac1x \le x^2\)), la limite vaut 0. Le facteur \(\sin(1/x)\), sans limite, est écrasé par \(x^2\).</p>
    <p><strong>Q4.</strong> On raisonne par l'absurde avec l'image d'une suite. Les suites \(u_n = 2n\pi\) et \(v_n = (2n + 1)\pi\) tendent vers \(+\infty\), et \(\cos u_n = 1\), \(\cos v_n = -1\) pour tout \(n\). Si \(\cos\) avait une limite \(\ell\) en \(+\infty\), on aurait \(\cos u_n \to \ell\) et \(\cos v_n \to \ell\), donc \(\ell = 1 = -1\) : absurde.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Continuité d'une fonction définie par morceaux</h3>
  <div class="statement">Soit \(f : \mathbb{R} \to \mathbb{R}\) définie par \(f(x) = \dfrac{\sin(2x)}{x}\) si \(x \neq 0\), et \(f(0) = a\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\lim_{x\to 0} f(x)\).</div>
  <div class="q"><strong>Q2.</strong> Pour quelle valeur de \(a\) la fonction \(f\) est-elle continue en 0 ?</div>
  <div class="q"><strong>Q3.</strong> Avec cette valeur de \(a\), \(f\) est-elle dérivable en 0 ? Calculer \(f'(0)\) si oui. (On pourra utiliser le développement limité \(\sin u = u - \frac{u^3}{6} + o(u^3)\), vu au second semestre.)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{\sin(2x)}{x} = 2 \times \dfrac{\sin(2x) - \sin 0}{2x - 0}\), et le second facteur est le taux d'accroissement de \(\sin\) en 0, évalué en \(2x \to 0\) : il tend vers \(\sin'(0) = 1\). Donc \(\lim_{x \to 0} f(x) = 2\).</p>
    <p><strong>Q2.</strong> \(f\) est continue en 0 si et seulement si \(f(0) = \lim_{x \to 0} f(x)\), soit \(a = 2\). Ailleurs, \(f\) est continue comme quotient de fonctions continues.</p>
    <p><strong>Q3.</strong> Le taux d'accroissement en 0 vaut</p>
    <div class="formula">$$\frac{f(h) - f(0)}{h} = \frac{\sin(2h)/h - 2}{h} = \frac{\sin(2h) - 2h}{h^2}.$$</div>
    <p>Avec \(\sin(2h) = 2h - \frac{(2h)^3}{6} + o(h^3)\), soit \(\sin(2h) = 2h - \frac{4h^3}{3} + o(h^3)\) :</p>
    <div class="formula">$$\frac{\sin(2h) - 2h}{h^2} = -\frac{4h}{3} + o(h) \xrightarrow[h \to 0]{} 0 .$$</div>
    <p>Donc \(f\) est dérivable en 0 et \(f'(0) = 0\), ce qu'annonçait la parité : \(f\) est paire, sa courbe a en 0 une tangente horizontale.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Calculs de dérivées et dérivée d'une réciproque</h3>
  <div class="statement">Calculer la dérivée des fonctions suivantes en précisant où elles sont dérivables (§7).</div>
  <div class="q"><strong>Q1.</strong> \(f(x) = x^2 \ln x\).</div>
  <div class="q"><strong>Q2.</strong> \(g(x) = \dfrac{e^x}{1 + x^2}\).</div>
  <div class="q"><strong>Q3.</strong> \(h(x) = \arctan(\sqrt{x})\), définie sur \([0, +\infty[\). Est-elle dérivable en 0 ?</div>
  <div class="q"><strong>Q4.</strong> \(k(x) = \ln(\cos x)\) sur \(]-\pi/2, \pi/2[\).</div>
  <div class="q"><strong>Q5.</strong> Montrer que \(\varphi(x) = x + e^x\) est une bijection de \(\mathbb R\) sur \(\mathbb R\), puis calculer \((\varphi^{-1})'(1)\) et l'équation de la tangente au graphe de \(\varphi^{-1}\) au point d'abscisse 1.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Dérivable sur \(]0, +\infty[\) (produit) : \(f'(x) = 2x\ln x + x^2 \cdot \dfrac{1}{x} = x(2\ln x + 1)\).</p>
    <p><strong>Q2.</strong> Dérivable sur \(\mathbb{R}\) (quotient, dénominateur jamais nul) :</p>
    <div class="formula">$$g'(x) = \frac{e^x(1 + x^2) - e^x \cdot 2x}{(1 + x^2)^2} = \frac{e^x(x - 1)^2}{(1 + x^2)^2} \ge 0 .$$</div>
    <p><strong>Q3.</strong> Sur \(]0, +\infty[\), par la composée : \(h'(x) = \dfrac{1}{1 + x} \cdot \dfrac{1}{2\sqrt{x}} = \dfrac{1}{2\sqrt{x}\,(1 + x)}\). En 0, \(h\) est continue et \(h'(x) \to +\infty\) quand \(x \to 0^+\) : par l'extension du théorème de la limite de la dérivée (§10), \(h\) n'est <strong>pas dérivable</strong> en 0 et son graphe y a une tangente verticale. On ne peut pas appliquer la formule de la composée en 0, car \(\sqrt{\cdot}\) n'y est pas dérivable.</p>
    <p><strong>Q4.</strong> \(\cos x \gt 0\) sur \(]-\pi/2, \pi/2[\) : \(k'(x) = \dfrac{-\sin x}{\cos x} = -\tan x\).</p>
    <p><strong>Q5.</strong> \(\varphi\) est continue et \(\varphi'(x) = 1 + e^x \gt 0\) : elle est strictement croissante ; ses limites sont \(-\infty\) en \(-\infty\) et \(+\infty\) en \(+\infty\). Par le corollaire du TVI (§4), c'est une bijection de \(\mathbb R\) sur \(\mathbb R\). On a \(\varphi(0) = 1\), donc \(\varphi^{-1}(1) = 0\), et \(\varphi'(0) = 2 \ne 0\) : \((\varphi^{-1})'(1) = \dfrac{1}{\varphi'(0)} = \dfrac12\). La tangente au graphe de \(\varphi^{-1}\) en \((1, 0)\) a pour équation \(y = \dfrac{x - 1}{2}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Théorème des valeurs intermédiaires : point fixe et dichotomie</h3>
  <div class="statement">Soit \(f : [0,1] \to [0,1]\) une fonction continue.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f\) admet au moins un point fixe, c'est-à-dire un \(c \in [0,1]\) tel que \(f(c) = c\). (Poser \(g = f - \mathrm{id}\).)</div>
  <div class="q"><strong>Q2.</strong> Montrer que l'équation \(\cos x = x\) a une unique solution \(c\) dans \([0, \pi/2]\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier que \(c \in [0{,}7 ; 0{,}8]\), puis l'encadrer par dichotomie dans un intervalle de longueur au plus \(10^{-3}\). Combien d'étapes faut-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(g(x) = f(x) - x\) est continue sur \([0,1]\). Comme \(f\) prend ses valeurs dans \([0, 1]\), \(g(0) = f(0) \geq 0\) et \(g(1) = f(1) - 1 \leq 0\). Par le TVI, \(g\) s'annule en un \(c \in [0,1]\) : \(f(c) = c\). Graphiquement, le graphe de \(f\), qui part au-dessus de la diagonale et finit en dessous, la traverse.</p>
    <p><strong>Q2.</strong> \(g(x) = \cos x - x\) est continue sur \([0, \pi/2]\), \(g(0) = 1 \gt 0\) et \(g(\pi/2) = -\pi/2 \lt 0\) : existence par le TVI. \(g'(x) = -\sin x - 1 \le 0\), et \(g'\) ne s'annule qu'en \(\pi/2\) sur cet intervalle : \(g\) est strictement décroissante, donc la solution est unique.</p>
    <p><strong>Q3.</strong> \(g(0{,}7) \approx 0{,}065 \gt 0\) et \(g(0{,}8) \approx -0{,}103 \lt 0\) : \(c \in\, ]0{,}7 ; 0{,}8[\). À chaque étape on évalue \(g\) au milieu \(m\) et l'on garde la moitié où \(g\) change de signe (\(g\) décroît : si \(g(m) \gt 0\), \(c \gt m\)).</p>
    <div class="formula">$$\begin{array}{c|c|c} m & g(m) & \text{nouvel intervalle}\\ \hline 0{,}75 & -0{,}018 & [0{,}7 ; 0{,}75]\\ 0{,}725 & +0{,}023 & [0{,}725 ; 0{,}75]\\ 0{,}737\,5 & +0{,}002\,6 & [0{,}737\,5 ; 0{,}75]\\ 0{,}743\,75 & -0{,}007\,8 & [0{,}737\,5 ; 0{,}743\,75]\\ 0{,}740\,625 & -0{,}002\,6 & [0{,}737\,5 ; 0{,}740\,625]\\ 0{,}739\,062\,5 & +0{,}000\,04 & [0{,}739\,06 ; 0{,}740\,63]\\ 0{,}739\,843\,75 & -0{,}001\,3 & [0{,}739\,06 ; 0{,}739\,84] \end{array}$$</div>
    <p>Partant d'un intervalle de longueur \(0{,}1\), il faut \(0{,}1/2^n \le 10^{-3}\), soit \(2^n \ge 100\) : \(n = 7\) étapes. On obtient \(c \in [0{,}739\,06 ; 0{,}739\,84]\), donc \(c \approx 0{,}739\) (la valeur exacte est \(0{,}739\,085\ldots\)).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Dérivabilité : la fonction \(x|x|\)</h3>
  <div class="statement">Soit \(f(x) = x|x|\) sur \(\mathbb R\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f\) est continue sur \(\mathbb{R}\).</div>
  <div class="q"><strong>Q2.</strong> Étudier la dérivabilité de \(f\) en 0. \(f\) est-elle dérivable sur \(\mathbb{R}\) entier ?</div>
  <div class="q"><strong>Q3.</strong> Exprimer \(f'(x)\) pour tout \(x \in \mathbb{R}\) et tracer l'allure de \(f'\).</div>
  <div class="q"><strong>Q4.</strong> \(f\) est-elle de classe \(\mathcal C^1\) ? Deux fois dérivable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f(x) = x^2\) pour \(x \geq 0\) et \(f(x) = -x^2\) pour \(x \leq 0\). C'est un produit de fonctions continues (\(x\) et \(|x|\)), donc \(f\) est continue sur \(\mathbb R\).</p>
    <p><strong>Q2.</strong> Taux d'accroissement en 0 : \(\dfrac{f(h) - f(0)}{h} = \dfrac{h|h|}{h} = |h| \to 0\). Donc \(f\) est dérivable en 0 et \(f'(0) = 0\). Ailleurs, \(f\) coïncide au voisinage du point avec \(x^2\) ou \(-x^2\) : elle est dérivable sur \(\mathbb R\) entier.</p>
    <p><strong>Q3.</strong> Pour \(x \gt 0\), \(f'(x) = 2x\) ; pour \(x \lt 0\), \(f'(x) = -2x\) ; et \(f'(0) = 0\). Donc \(f'(x) = 2|x|\) pour tout \(x\) : un « V » de sommet l'origine.</p>
    <p><strong>Q4.</strong> \(f' = 2|\cdot|\) est continue : \(f\) est de classe \(\mathcal C^1\) sur \(\mathbb R\). Mais \(f'\) n'est pas dérivable en 0 (ses dérivées à gauche et à droite valent \(-2\) et \(2\)) : \(f\) n'est pas deux fois dérivable en 0. C'est l'exemple type d'une fonction \(\mathcal C^1\) qui n'est pas \(\mathcal C^2\) (§11).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Accroissements finis : inégalités sur \(\sin\) et \(\ln\)</h3>
  <div class="statement">On utilise l'égalité et l'inégalité des accroissements finis (§8, §9).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(|\sin a - \sin b| \le |a - b|\) pour tous réels \(a\), \(b\). En déduire \(|\sin x| \le |x|\).</div>
  <div class="q"><strong>Q2.</strong> Soit \(x \gt 0\). En appliquant l'égalité des accroissements finis à \(\ln\) sur \([1, 1 + x]\), montrer que \(\dfrac{x}{1 + x} \lt \ln(1 + x) \lt x\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(x \in\, ]-1, 0[\). En raisonnant de même sur \([1 + x, 1]\), montrer que \(\ln(1 + x) \lt x\). Conclure que \(\ln(1 + x) \le x\) pour tout \(x \gt -1\).</div>
  <div class="q"><strong>Q4.</strong> Encadrer \(\ln(1{,}1)\) grâce à Q2.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\sin\) est dérivable sur \(\mathbb R\) et \(|\sin'| = |\cos| \le 1\) : l'inégalité des accroissements finis donne \(|\sin a - \sin b| \le |a - b|\). Avec \(b = 0\) : \(|\sin x| \le |x|\) pour tout réel \(x\).</p>
    <p><strong>Q2.</strong> \(\ln\) est continue sur \([1, 1 + x]\), dérivable à l'intérieur : il existe \(c \in\, ]1, 1 + x[\) tel que \(\ln(1 + x) - \ln 1 = \dfrac{1}{c}\,x\). Comme \(1 \lt c \lt 1 + x\) et \(x \gt 0\), \(\dfrac{x}{1 + x} \lt \dfrac{x}{c} \lt x\). D'où \(\dfrac{x}{1 + x} \lt \ln(1 + x) \lt x\).</p>
    <p><strong>Q3.</strong> Pour \(-1 \lt x \lt 0\), l'égalité sur \([1 + x, 1]\) donne \(c \in\, ]1 + x, 1[\) tel que \(\ln 1 - \ln(1 + x) = \dfrac{1}{c}\,(-x)\). Ici \(-x \gt 0\) et \(0 \lt c \lt 1\), donc \(\dfrac{-x}{c} \gt -x\) : \(-\ln(1 + x) \gt -x\), soit \(\ln(1 + x) \lt x\). Avec Q2 et l'égalité en 0, \(\ln(1 + x) \le x\) pour tout \(x \gt -1\), avec égalité seulement en 0 (inégalité du programme).</p>
    <p><strong>Q4.</strong> Avec \(x = 0{,}1\) : \(\dfrac{0{,}1}{1{,}1} \approx 0{,}090\,9 \lt \ln(1{,}1) \lt 0{,}1\). La valeur exacte est \(0{,}095\,3\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Théorème de Rolle : racines des dérivées, fonction auxiliaire</h3>
  <div class="statement">Soit \(P(x) = x(x - 1)(x - 2)(x - 3)\).</div>
  <div class="q"><strong>Q1.</strong> Sans calcul, montrer que \(P'\) a une racine dans chacun des intervalles \(]0, 1[\), \(]1, 2[\), \(]2, 3[\). En déduire que toutes les racines de \(P'\) sont réelles et simples.</div>
  <div class="q"><strong>Q2.</strong> Calculer les racines de \(P'\) et de \(P''\), et vérifier que celles de \(P''\) séparent celles de \(P'\). (On pourra poser \(y = x - \frac32\).)</div>
  <div class="q"><strong>Q3.</strong> Soit \(f\) continue sur \([a, b]\), dérivable sur \(]a, b[\), avec \(f(a) = f(b) = 0\). Montrer qu'il existe \(c \in\, ]a, b[\) tel que \(f'(c) = f(c)\). (Appliquer Rolle à \(x \mapsto e^{-x}f(x)\).)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(P\) s'annule en 0, 1, 2, 3. Rolle sur \([0, 1]\), \([1, 2]\), \([2, 3]\) donne trois racines de \(P'\), une dans chaque intervalle ouvert, donc distinctes. \(P'\) est de degré 3 : il n'a pas d'autre racine, et chacune est simple (un polynôme de degré 3 a au plus 3 racines comptées avec multiplicité).</p>
    <p><strong>Q2.</strong> Avec \(y = x - \frac32\), \(P = \left(y^2 - \frac94\right)\left(y^2 - \frac14\right) = y^4 - \frac52y^2 + \frac{9}{16}\). Donc \(P' = 4y^3 - 5y = y(4y^2 - 5)\) s'annule en \(y = 0\) et \(y = \pm\frac{\sqrt5}{2}\), soit</p>
    <div class="formula">$$x \in \left\{\frac{3 - \sqrt5}{2} \approx 0{,}382,\ \ \frac32,\ \ \frac{3 + \sqrt5}{2} \approx 2{,}618\right\}.$$</div>
    <p>Et \(P'' = 12y^2 - 5\) s'annule en \(y = \pm\sqrt{5/12}\), soit \(x = \frac32 \pm \frac{\sqrt{15}}{6} \approx 0{,}854\) et \(2{,}146\). On a bien \(0{,}382 \lt 0{,}854 \lt 1{,}5 \lt 2{,}146 \lt 2{,}618\) : Rolle appliqué à \(P'\) le garantissait.</p>
    <p><strong>Q3.</strong> \(\varphi(x) = e^{-x}f(x)\) est continue sur \([a, b]\), dérivable sur \(]a, b[\), et \(\varphi(a) = \varphi(b) = 0\). Rolle donne \(c\) avec \(\varphi'(c) = e^{-c}\big(f'(c) - f(c)\big) = 0\). Comme \(e^{-c} \ne 0\), \(f'(c) = f(c)\). Le facteur \(e^{-x}\) a été choisi pour que la dérivée du produit fasse apparaître \(f' - f\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Limite de la dérivée : raccords et prolongements</h3>
  <div class="statement">On utilise le théorème de la limite de la dérivée (§10) et la notion de classe \(\mathcal C^k\) (§11).</div>
  <p class="exo-part">Partie A — Un raccord réglable</p>
  <div class="q"><strong>A1.</strong> Soit \(a, b\) réels et \(f(x) = a(x - 1)^2 + b(x - 1)\) pour \(x \lt 1\), \(f(x) = \ln x\) pour \(x \ge 1\). Montrer que \(f\) est continue sur \(]0, +\infty[\).</div>
  <div class="q"><strong>A2.</strong> Pour quelle valeur de \(b\) est-elle dérivable en 1 ? Montrer qu'elle est alors de classe \(\mathcal C^1\).</div>
  <div class="q"><strong>A3.</strong> Pour quelle valeur de \(a\) est-elle de classe \(\mathcal C^2\) ? Est-elle alors de classe \(\mathcal C^3\) ?</div>
  <p class="exo-part">Partie B — Un prolongement \(\mathcal C^1\) qui n'est pas \(\mathcal C^2\)</p>
  <div class="q"><strong>B1.</strong> Soit \(g(x) = x^2\ln|x|\) pour \(x \ne 0\), \(g(0) = 0\). Montrer que \(g\) est continue et de classe \(\mathcal C^1\) sur \(\mathbb R\), et préciser \(g'(0)\).</div>
  <div class="q"><strong>B2.</strong> Montrer que \(g'\) n'est pas dérivable en 0.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> Sur \(]0, 1[\) et sur \(]1, +\infty[\), \(f\) est un polynôme ou \(\ln\) : continue. En 1, l'expression de gauche tend vers 0 et \(f(1) = \ln 1 = 0\) : continue en 1, quels que soient \(a\) et \(b\).</p>
    <p><strong>A2.</strong> Hors de 1, \(f'(x) = 2a(x - 1) + b\) à gauche, \(f'(x) = 1/x\) à droite. Quand \(x \to 1\), \(f'(x) \to b\) à gauche et \(\to 1\) à droite. Si \(b = 1\), \(f'\) a la limite 1 en 1 et \(f\) est continue : par le théorème de la limite de la dérivée, \(f\) est dérivable en 1, \(f'(1) = 1\), et \(f'\) est continue en 1 ; \(f\) est \(\mathcal C^1\). Si \(b \ne 1\), les dérivées à gauche et à droite (limites des taux, égales ici aux limites de \(f'\)) valent \(b\) et 1 : point anguleux, pas de dérivabilité.</p>
    <p><strong>A3.</strong> Avec \(b = 1\), \(f''(x) = 2a\) à gauche et \(f''(x) = -1/x^2 \to -1\) à droite. On applique le théorème à \(f'\), continue : \(f'\) est dérivable en 1, avec \(f''\) continue, si et seulement si \(2a = -1\), soit \(a = -\frac12\). Alors \(f\) est \(\mathcal C^2\). Mais \(f'''(x) = 0\) à gauche et \(f'''(x) = 2/x^3 \to 2\) à droite : \(f''\) a un point anguleux en 1, \(f\) n'est pas trois fois dérivable, donc pas \(\mathcal C^3\). (À gauche, \(f(x) = (x - 1) - \frac12(x - 1)^2\) : c'est le début de la formule de Taylor de \(\ln\) en 1.)</p>
    <p><strong>B1.</strong> \(g(x) \to 0\) en 0 (croissances comparées : \(x\ln|x| \to 0\), et \(|g(x)| = |x| \cdot |x\ln|x||\)) : \(g\) est continue. Hors de 0, \(g'(x) = 2x\ln|x| + x\) (la dérivée de \(\ln|x|\) est \(1/x\) sur \(\mathbb R^*\)), qui tend vers 0 en 0. Le théorème de la limite de la dérivée donne \(g\) dérivable en 0, \(g'(0) = 0\), et \(g'\) continue : \(g\) est de classe \(\mathcal C^1\) sur \(\mathbb R\).</p>
    <p><strong>B2.</strong> \(g'\) est continue en 0, dérivable ailleurs, et \(g''(x) = 2\ln|x| + 3 \to -\infty\) quand \(x \to 0\). Par l'extension du théorème, le taux d'accroissement de \(g'\) en 0 tend vers \(-\infty\) : \(g'\) n'est pas dérivable en 0. \(g\) est \(\mathcal C^1\) sans être deux fois dérivable.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Formule de Leibniz : trois dérivées \(n\)-ièmes</h3>
  <div class="statement">On utilise la formule de Leibniz (§11).</div>
  <div class="q"><strong>Q1.</strong> Calculer la dérivée \(n\)-ième de \(f(x) = x^2e^{2x}\).</div>
  <div class="q"><strong>Q2.</strong> Soit \(g(x) = x^2\cos x\). Pour \(n \ge 2\), exprimer \(g^{(n)}(0)\) en fonction de \(n\), puis donner \(g^{(4)}(0)\) et \(g^{(6)}(0)\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(y = \arctan\). Vérifier que \((1 + x^2)\,y'(x) = 1\). En dérivant \(n\) fois cette relation (\(n \ge 1\)), montrer que \(y^{(n+1)}(0) = -n(n - 1)\,y^{(n-1)}(0)\), puis calculer \(y^{(n)}(0)\) pour tout \(n\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(u = x^2\) (\(u' = 2x\), \(u'' = 2\), puis 0) et \(v = e^{2x}\) (\(v^{(k)} = 2^ke^{2x}\)), la formule de Leibniz ne garde que trois termes :</p>
    <div class="formula">$$f^{(n)}(x) = x^2\,2^ne^{2x} + n\cdot 2x\cdot 2^{n-1}e^{2x} + \binom n2\cdot 2\cdot 2^{n-2}e^{2x} = 2^{n-2}e^{2x}\big(4x^2 + 4nx + n(n - 1)\big).$$</div>
    <p>Contrôle : pour \(n = 1\), \(\frac12e^{2x}(4x^2 + 4x) = 2x^2e^{2x} + 2xe^{2x}\), la dérivée du produit.</p>
    <p><strong>Q2.</strong> En 0, \(u = x^2\) et \(u' = 2x\) s'annulent, \(u'' = 2\), et les dérivées suivantes sont nulles : seul reste le terme \(k = 2\),</p>
    <div class="formula">$$g^{(n)}(0) = \binom n2 \cdot 2 \cdot \cos^{(n-2)}(0) = n(n - 1)\cos\!\Big(\frac{(n - 2)\pi}{2}\Big).$$</div>
    <p>Elle est nulle pour \(n\) impair (\(g\) est paire). \(g^{(4)}(0) = 12\cos\pi = -12\) et \(g^{(6)}(0) = 30\cos(2\pi) = 30\).</p>
    <p><strong>Q3.</strong> \(y' = \dfrac{1}{1 + x^2}\), d'où \((1 + x^2)\,y' = 1\). On dérive \(n\) fois (\(n \ge 1\)) le produit \((1 + x^2) \cdot y'\) par Leibniz ; les dérivées de \(1 + x^2\) sont \(2x\), \(2\), puis 0, et le second membre a une dérivée nulle :</p>
    <div class="formula">$$(1 + x^2)\,y^{(n+1)} + 2nx\,y^{(n)} + n(n - 1)\,y^{(n-1)} = 0 .$$</div>
    <p>En \(x = 0\) : \(y^{(n+1)}(0) = -n(n - 1)\,y^{(n-1)}(0)\). Comme \(y(0) = 0\), toutes les dérivées d'ordre pair sont nulles en 0 ; comme \(y'(0) = 1\), on obtient \(y'''(0) = -2\), \(y^{(5)}(0) = 24\), et par récurrence \(y^{(2k+1)}(0) = (-1)^k\,(2k)!\). Ainsi \(\frac{y^{(2k+1)}(0)}{(2k + 1)!} = \frac{(-1)^k}{2k + 1}\) : ce sont les coefficients du développement limité de \(\arctan\) en 0.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Équation transcendante et suite récurrente</h3>
  <div class="statement">On cherche les solutions de \(x\,e^x = 1\) dans \(\mathbb{R}^+\).</div>
  <div class="q"><strong>Q1.</strong> Étudier les variations de \(f(x) = xe^x - 1\) sur \([0,+\infty[\). Montrer que l'équation admet une unique solution \(\alpha\).</div>
  <div class="q"><strong>Q2.</strong> Encadrer \(\alpha\) entre deux valeurs consécutives au dixième.</div>
  <div class="q"><strong>Q3.</strong> Montrer que la suite définie par \(u_0 = 1\) et \(u_{n+1} = e^{-u_n}\) converge vers \(\alpha\). (Montrer que \(u_n \in [e^{-1}, 1]\) pour tout \(n\), puis utiliser l'inégalité des accroissements finis.)</div>
  <div class="q"><strong>Q4.</strong> Combien d'itérations la majoration obtenue garantit-elle pour une erreur au plus \(10^{-6}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f'(x) = e^x(1 + x) \gt 0\) sur \([0, +\infty[\) : \(f\) est continue et strictement croissante, de \(f(0) = -1 \lt 0\) à \(\lim_{+\infty} f = +\infty\). Par le corollaire du TVI, elle s'annule en un unique \(\alpha \gt 0\).</p>
    <p><strong>Q2.</strong> \(f(0{,}5) = 0{,}5\,e^{0{,}5} - 1 \approx -0{,}176 \lt 0\) et \(f(0{,}6) = 0{,}6\,e^{0{,}6} - 1 \approx 0{,}093 \gt 0\). Donc \(\alpha \in\, ]0{,}5 ; 0{,}6[\).</p>
    <p><strong>Q3.</strong> L'équation \(\alpha e^\alpha = 1\) équivaut à \(\alpha = g(\alpha)\) avec \(g(x) = e^{-x}\), et \(\alpha \in\, ]0{,}5 ; 0{,}6[ \subset I = [e^{-1}, 1]\). <em>Stabilité de \(I\)</em> : \(g\) est décroissante, donc \(g(I) = [e^{-1}, e^{-1/e}] \approx [0{,}368 ; 0{,}692] \subset I\) ; comme \(u_0 = 1 \in I\), on a par récurrence \(u_n \in I\) pour tout \(n\). <em>Convergence</em> : sur \(I\), \(|g'(x)| = e^{-x} \leq e^{-1/e} = k \approx 0{,}692 \lt 1\). Par l'inégalité des accroissements finis, \(|u_{n+1} - \alpha| = |g(u_n) - g(\alpha)| \leq k\,|u_n - \alpha|\), d'où \(|u_n - \alpha| \leq k^n |u_0 - \alpha| \to 0\). La suite converge vers \(\alpha\).</p>
    <p><strong>Q4.</strong> \(|u_0 - \alpha| = 1 - \alpha \lt 0{,}5\), donc \(|u_n - \alpha| \lt 0{,}5\,k^n\), inférieur à \(10^{-6}\) dès que \(n \ge \dfrac{\ln(2 \times 10^{-6})}{\ln k} \approx 35{,}6\), soit \(n = 36\). En pratique, 23 itérations suffisent (\(\alpha \approx 0{,}567\,143\)) : près de \(\alpha\), le facteur vaut plutôt \(e^{-\alpha} = \alpha \approx 0{,}567\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Fonctions à valeurs complexes</h3>
  <div class="statement">Soit \(f(t) = e^{(1 + i)t}\) pour \(t \in \mathbb R\) (§12).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(f'\). En déduire, sans dériver de produit, les dérivées de \(t \mapsto e^t\cos t\) et \(t \mapsto e^t\sin t\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\big(e^t\cos t\big)^{(n)} = 2^{n/2}e^t\cos\!\big(t + \frac{n\pi}{4}\big)\) pour tout \(n \in \mathbb N\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(g(t) = e^{it}\). Vérifier que \(g(0) = g(2\pi)\) mais que \(g'\) ne s'annule jamais. Quel théorème est en défaut ?</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(|e^{ia} - e^{ib}| \le |a - b|\) pour tous réels \(a\), \(b\), et contrôler le cas \(a = 0\), \(b = \pi\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f'(t) = (1 + i)\,e^{(1 + i)t}\) (dérivée de \(e^{\lambda t}\), \(\lambda \in \mathbb C\)). Or \(f(t) = e^t\cos t + i\,e^t\sin t\) et</p>
    <div class="formula">$$(1 + i)(\cos t + i\sin t) = (\cos t - \sin t) + i(\cos t + \sin t).$$</div>
    <p>En identifiant parties réelle et imaginaire :</p>
    <div class="formula">$$\big(e^t\cos t\big)' = e^t(\cos t - \sin t), \qquad \big(e^t\sin t\big)' = e^t(\cos t + \sin t).$$</div>
    <p><strong>Q2.</strong> Par récurrence, \(f^{(n)}(t) = (1 + i)^n e^{(1 + i)t}\), et \(1 + i = \sqrt2\,e^{i\pi/4}\), donc \((1 + i)^n = 2^{n/2}e^{in\pi/4}\) et \(f^{(n)}(t) = 2^{n/2}e^t\,e^{i(t + n\pi/4)}\). La dérivée \(n\)-ième de \(e^t\cos t = \operatorname{Re} f(t)\) est la partie réelle de \(f^{(n)}\) (la dérivation se fait sur les parties réelle et imaginaire) : \(2^{n/2}e^t\cos(t + \frac{n\pi}{4})\). Contrôle : \(n = 1\) donne \(\sqrt2\,e^t\cos(t + \frac\pi4) = e^t(\cos t - \sin t)\).</p>
    <p><strong>Q3.</strong> \(g(0) = 1 = e^{2i\pi} = g(2\pi)\), et \(g'(t) = i\,e^{it}\) est de module 1 : jamais nul. Le <strong>théorème de Rolle</strong> (et l'égalité des accroissements finis) est faux pour les fonctions à valeurs complexes : sa démonstration utilise un maximum de \(f\), qui n'a pas de sens dans \(\mathbb C\).</p>
    <p><strong>Q4.</strong> \(g\) est de classe \(\mathcal C^1\) et \(|g'| = 1\) : l'inégalité des accroissements finis, qui reste vraie pour une fonction complexe de classe \(\mathcal C^1\), donne \(|e^{ia} - e^{ib}| \le |a - b|\). Pour \(a = 0\), \(b = \pi\) : \(|1 - (-1)| = 2 \le \pi\). La distance entre deux points du cercle unité est inférieure à la longueur de l'arc qui les joint.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Une fonction de classe \(\mathcal C^\infty\) très plate en 0</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de mathématiques PT (thème : continuité, dérivabilité, classe \(\mathcal C^k\)). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">On définit \(f : \mathbb R \to \mathbb R\) par \(f(x) = e^{-1/x}\) si \(x \gt 0\) et \(f(x) = 0\) si \(x \le 0\). On admet le résultat de croissances comparées : pour tout entier \(p\), \(u^p e^{-u} \to 0\) quand \(u \to +\infty\).</div>
  <p class="exo-part">Partie A — Continuité, dérivabilité, allure</p>
  <div class="q"><strong>A1.</strong> Montrer que \(f\) est continue sur \(\mathbb R\).</div>
  <div class="q"><strong>A2.</strong> Calculer \(f'(x)\) pour \(x \ne 0\). Montrer que \(f\) est de classe \(\mathcal C^1\) sur \(\mathbb R\) et que \(f'(0) = 0\).</div>
  <div class="q"><strong>A3.</strong> Étudier les variations de \(f\) sur \(]0, +\infty[\) et sa limite en \(+\infty\). Où \(f''\) s'annule-t-elle ?</div>
  <p class="exo-part">Partie B — Toutes les dérivées</p>
  <div class="q"><strong>B1.</strong> Montrer par récurrence qu'il existe des polynômes \(P_n\) tels que \(f^{(n)}(x) = P_n\!\left(\frac1x\right)e^{-1/x}\) pour \(x \gt 0\), avec \(P_0 = 1\) et \(P_{n+1}(t) = t^2\big(P_n(t) - P_n'(t)\big)\). Calculer \(P_1\), \(P_2\), \(P_3\).</div>
  <div class="q"><strong>B2.</strong> Montrer que, pour tout polynôme \(P\), \(P\!\left(\frac1x\right)e^{-1/x} \to 0\) quand \(x \to 0^+\).</div>
  <div class="q"><strong>B3.</strong> En déduire que \(f\) est de classe \(\mathcal C^\infty\) sur \(\mathbb R\) et que \(f^{(n)}(0) = 0\) pour tout \(n\).</div>
  <p class="exo-part">Partie C — Une fonction « bosse »</p>
  <div class="q"><strong>C1.</strong> Soit \(g(x) = f(x)\,f(1 - x)\). Montrer que \(g\) est de classe \(\mathcal C^\infty\) sur \(\mathbb R\), nulle hors de \(]0, 1[\) et strictement positive sur \(]0, 1[\).</div>
  <div class="q"><strong>C2.</strong> Montrer que \(g(x) = \exp\!\left(-\dfrac{1}{x(1 - x)}\right)\) sur \(]0, 1[\), et en déduire le maximum de \(g\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> Sur \(]-\infty, 0[\), \(f\) est nulle ; sur \(]0, +\infty[\), c'est une composée de fonctions continues. En 0 : à gauche \(f = 0\) ; à droite, \(-1/x \to -\infty\) donc \(e^{-1/x} \to 0 = f(0)\). \(f\) est continue sur \(\mathbb R\).</p>
    <p><strong>A2.</strong> Pour \(x \gt 0\), \(f'(x) = \dfrac{1}{x^2}e^{-1/x}\) ; pour \(x \lt 0\), \(f'(x) = 0\). Avec \(u = 1/x \to +\infty\), \(f'(x) = u^2e^{-u} \to 0\) quand \(x \to 0^+\), et \(f' = 0\) à gauche. \(f\) est continue en 0 et \(f'\) a la limite 0 : par le théorème de la limite de la dérivée, \(f\) est dérivable en 0, \(f'(0) = 0\), et \(f'\) est continue. \(f\) est \(\mathcal C^1\).</p>
    <p><strong>A3.</strong> Sur \(]0, +\infty[\), \(f' \gt 0\) : \(f\) est strictement croissante, de \(0^+\) à \(\lim_{+\infty} e^{-1/x} = e^0 = 1\) (asymptote \(y = 1\)). \(f''(x) = \left(\dfrac{1}{x^4} - \dfrac{2}{x^3}\right)e^{-1/x} = \dfrac{1 - 2x}{x^4}e^{-1/x}\) s'annule en \(x = \frac12\) en changeant de signe : la courbe y change de courbure (elle traverse sa tangente).</p>
    <p><strong>B1.</strong> \(f^{(0)} = e^{-1/x}\) : \(P_0 = 1\). Si \(f^{(n)}(x) = P_n(1/x)e^{-1/x}\) sur \(]0, +\infty[\), on dérive (composée et produit), avec \((1/x)' = -1/x^2\) et \((e^{-1/x})' = \frac{1}{x^2}e^{-1/x}\) :</p>
    <div class="formula">$$f^{(n+1)}(x) = -\frac{1}{x^2}P_n'\!\Big(\frac1x\Big)e^{-1/x} + P_n\!\Big(\frac1x\Big)\frac{1}{x^2}e^{-1/x} = P_{n+1}\!\Big(\frac1x\Big)e^{-1/x},$$</div>
    <p>avec \(P_{n+1}(t) = t^2\big(P_n(t) - P_n'(t)\big)\), polynôme. On trouve \(P_1(t) = t^2\), \(P_2(t) = t^2(t^2 - 2t) = t^4 - 2t^3\) et</p>
    <div class="formula">$$P_3(t) = t^2\big(t^4 - 2t^3 - (4t^3 - 6t^2)\big) = t^6 - 6t^5 + 6t^4 .$$</div>
    <p><strong>B2.</strong> Avec \(u = 1/x \to +\infty\), \(P(1/x)e^{-1/x} = P(u)e^{-u} = \sum_p a_p\,u^pe^{-u}\) : chaque terme tend vers 0 par croissances comparées, donc la somme aussi.</p>
    <p><strong>B3.</strong> Récurrence sur \(n\) : « \(f\) est \(n\) fois dérivable sur \(\mathbb R\), \(f^{(n)}(0) = 0\), \(f^{(n)} = 0\) sur \(]-\infty, 0]\) et \(f^{(n)}(x) = P_n(1/x)e^{-1/x}\) sur \(]0, +\infty[\) ». Vrai pour \(n = 0\). Si c'est vrai au rang \(n\) : \(f^{(n)}\) est continue en 0 (B2), dérivable hors de 0, et sa dérivée \(P_{n+1}(1/x)e^{-1/x}\) (à droite) ou 0 (à gauche) tend vers 0 (B2). Le théorème de la limite de la dérivée appliqué à \(f^{(n)}\) donne \(f^{(n+1)}(0) = 0\) : rang \(n + 1\). Ainsi \(f\) a des dérivées de tout ordre, toutes continues : \(f\) est \(\mathcal C^\infty\), et toutes ses dérivées sont nulles en 0, bien que \(f\) ne soit pas nulle à droite de 0.</p>
    <p><strong>C1.</strong> \(x \mapsto 1 - x\) est \(\mathcal C^\infty\), donc \(x \mapsto f(1 - x)\) aussi (composée), et \(g\) est \(\mathcal C^\infty\) comme produit (formule de Leibniz). Si \(x \le 0\), \(f(x) = 0\) ; si \(x \ge 1\), \(1 - x \le 0\) et \(f(1 - x) = 0\) : \(g\) est nulle hors de \(]0, 1[\). Sur \(]0, 1[\), \(x \gt 0\) et \(1 - x \gt 0\) : \(g(x) = e^{-1/x}e^{-1/(1-x)} \gt 0\).</p>
    <p><strong>C2.</strong> Sur \(]0, 1[\), \(\dfrac1x + \dfrac{1}{1 - x} = \dfrac{1 - x + x}{x(1 - x)} = \dfrac{1}{x(1 - x)}\), d'où \(g(x) = \exp\!\big(-\frac{1}{x(1 - x)}\big)\). Comme \(\exp\) est croissante, \(g\) est maximale là où \(\frac{1}{x(1 - x)}\) est minimal, c'est-à-dire où \(x(1 - x)\) est maximal : en \(x = \frac12\), où \(x(1 - x) = \frac14\). Le maximum vaut \(g(\frac12) = e^{-4} \approx 0{,}018\,3\). Une telle « bosse », régulière et nulle hors d'un segment, sert à lisser des raccords (fonctions de transition en mécanique, en traitement du signal).</p>
  </div>
</div>
