<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la section « Fonctions d'une variable réelle : limites et continuité, dérivabilité » du programme de PTSI (premier semestre). Les calculs pratiques de dérivées (dérivées usuelles, tableaux de variations, fonctions usuelles) sont dans le chapitre « Fonctions réelles — généralités » : on démontre ici les théorèmes qui les justifient. Les limites difficiles attendent les outils du second semestre : relations de comparaison (chapitre « Analyse asymptotique ») puis développements limités (chapitre des développements limités, qui reprend la formule de Taylor). Les fonctions sont définies sur un intervalle \(I\) non vide et non réduit à un point.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Limite en un point</strong> \(a\) fini ou infini, appartenant à \(I\) ou extrémité de \(I\) ; limite finie ou infinie ; définitions avec des inégalités larges ; unicité ; si \(f\) est définie en \(a\) et a une limite en \(a\), cette limite est \(f(a)\) ; une limite finie entraîne que \(f\) est bornée au voisinage de \(a\) ; limites à gauche, à droite ; image d'une suite de limite \(a\) (§1).</li>
        <li><strong>Opérations</strong> sur les limites (combinaison linéaire, produit, quotient, composition) ; passage à la limite d'une inégalité large ; existence d'une limite par encadrement, minoration, majoration ; théorème de la limite monotone (démonstration non exigible) (§2).</li>
        <li><strong>Continuité en un point</strong>, prolongement par continuité, continuité à gauche, à droite ; opérations (§3).</li>
        <li><strong>Théorème des valeurs intermédiaires</strong> et principe de la dichotomie ; image d'un intervalle ; cas d'une fonction continue strictement monotone (§4).</li>

        <li><strong>Opérations</strong> sur les fonctions dérivables : combinaison linéaire, produit, quotient, composition, réciproque ; tangente au graphe d'une fonction réciproque (§7).</li>

<div class="course-section">
  <div class="sec-num">§1 · LIMITE D'UNE FONCTION EN UN POINT</div>
  <h2>Ce que veut dire « \(f(x)\) tend vers \(\ell\) »</h2>
  <div class="intro">Dire que \(f(x)\) tend vers \(\ell\) quand \(x\) tend vers \(a\), c'est dire que l'on peut rendre \(f(x)\) aussi proche de \(\ell\) qu'on le veut, à condition de prendre \(x\) assez proche de \(a\). La définition quantifie cette phrase ; elle sert à démontrer les règles de calcul, puis presque plus jamais directement. Le point \(a\) est un réel de \(I\), une extrémité de \(I\), ou \(\pm\infty\).</div>

  <div class="def-box">
    Une propriété est vraie <strong>au voisinage de \(a\)</strong> si elle est vraie sur l'intersection de \(I\) avec un intervalle \(]a - \eta, a + \eta[\) (\(\eta \gt 0\)) si \(a\) est réel, avec un intervalle \(]A, +\infty[\) si \(a = +\infty\), avec \(]-\infty, A[\) si \(a = -\infty\). Pour \(a\) réel et \(\ell\) réel, \(f\) a pour <strong>limite</strong> \(\ell\) en \(a\) si
    <div class="formula" data-nom="Limite finie en un point">$$\forall \varepsilon \gt 0,\ \exists \eta \gt 0,\ \forall x \in I,\quad |x - a| \le \eta \implies |f(x) - \ell| \le \varepsilon .$$</div>
    Les autres cas s'écrivent de même en remplaçant « \(|x - a| \le \eta\) » par « \(x \ge B\) » (en \(+\infty\)) ou « \(x \le B\) » (en \(-\infty\)), et « \(|f(x) - \ell| \le \varepsilon\) » par « \(f(x) \ge A\) » (limite \(+\infty\)) ou « \(f(x) \le A\) » (limite \(-\infty\)). Par exemple, \(f(x) \to +\infty\) quand \(x \to +\infty\) si : pour tout \(A\), il existe \(B\) tel que \(x \ge B\) entraîne \(f(x) \ge A\). On note \(f(x) \xrightarrow[x \to a]{} \ell\) ou \(\lim_{x \to a} f(x) = \ell\).
  </div>
  <p>Les inégalités sont <strong>larges</strong>, comme le demande le programme ; des inégalités strictes donneraient la même notion. Le réel \(\eta\) dépend de \(\varepsilon\) (et du point \(a\)) : plus la précision demandée est fine, plus il faut s'approcher de \(a\).</p>

  <div class="method-box">
    <strong>Exemple — deux limites démontrées par la définition</strong>
    <ol>
      <li>\(\lim_{x \to 2}(3x - 1) = 5\). Pour \(\varepsilon \gt 0\), \(|(3x - 1) - 5| = 3|x - 2|\) est au plus \(\varepsilon\) dès que \(|x - 2| \le \varepsilon/3\) : \(\eta = \varepsilon/3\) convient. Pour une précision \(\varepsilon = 10^{-3}\), il suffit de prendre \(x\) à moins de \(3{,}3 \times 10^{-4}\) de 2.</li>
      <li>\(\lim_{x \to +\infty}\dfrac{2x + 1}{x + 3} = 2\). Pour \(x \gt -3\), \(\left|\dfrac{2x + 1}{x + 3} - 2\right| = \dfrac{5}{x + 3}\), qui est au plus \(\varepsilon\) dès que \(x \ge \dfrac5\varepsilon - 3\). Pour \(\varepsilon = 10^{-2}\), le seuil vaut \(B = 497\).</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Premières propriétés.</strong>
    <ul>
      <li><strong>Unicité</strong> : si \(f\) a une limite en \(a\), elle est unique.</li>
      <li>Si \(f\) est <strong>définie en \(a\)</strong> et a une limite en \(a\), cette limite est \(f(a)\).</li>
      <li>Si \(f\) a une limite <strong>finie</strong> en \(a\), elle est <strong>bornée au voisinage de \(a\)</strong>.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi la limite vaut \(f(a)\) quand \(a \in I\), et pourquoi \(f\) est bornée près de \(a\).</span>
    <div class="content"><p>Si \(a \in I\) et \(f(x) \to \ell\), on peut prendre \(x = a\) dans la définition : \(|f(a) - \ell| \le \varepsilon\) pour tout \(\varepsilon \gt 0\), donc \(\ell = f(a)\). Pour la seconde propriété, on prend \(\varepsilon = 1\) : il existe \(\eta\) tel que \(|x - a| \le \eta\) entraîne \(|f(x) - \ell| \le 1\), donc \(|f(x)| \le |\ell| + 1\) au voisinage de \(a\). L'unicité se montre comme pour les suites : deux limites \(\ell \ne \ell'\) donneraient, avec \(\varepsilon = |\ell - \ell'|/3\), un \(x\) à la fois à moins de \(\varepsilon\) de \(\ell\) et de \(\ell'\), ce qui est impossible.</p></div>
  </div>

  <h3>Limite à gauche, limite à droite</h3>
  <div class="def-box">
    Pour \(a\) réel, \(f\) a pour <strong>limite à droite</strong> \(\ell\) en \(a\) si la restriction de \(f\) à \(I \cap\, ]a, +\infty[\) a pour limite \(\ell\) en \(a\) ; on note \(\lim_{x \to a^+} f(x) = \ell\) ou \(\lim_{x \to a,\, x \gt a} f(x) = \ell\). Même définition à gauche, avec \(I \cap\, ]-\infty, a[\).
  </div>
  <div class="prop-box">
    <strong>Recollement.</strong> Soit \(a\) intérieur à \(I\).
    <ul>
      <li>Si \(f\) est définie sur \(I\) <strong>sauf en \(a\)</strong> : \(f\) a une limite \(\ell\) en \(a\) si et seulement si elle a une limite à gauche et une limite à droite en \(a\), égales à \(\ell\).</li>
      <li>Si \(f\) est <strong>définie en \(a\)</strong> : \(f\) a une limite en \(a\) si et seulement si ses limites à gauche et à droite existent et sont <strong>égales à \(f(a)\)</strong>.</li>
    </ul>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier \(f(a)\). La fonction valant 0 sur \(\mathbb R^*\) et 1 en 0 a des limites à gauche et à droite égales à 0 en 0, mais elle n'a pas de limite en 0 : dans la définition, \(x\) parcourt tout \(I\), y compris \(a\), et \(|f(0) - 0| = 1\) n'est pas inférieur à \(\varepsilon = 1/2\).</div>

  <h3>Image d'une suite</h3>
  <div class="prop-box">
    <strong>Image d'une suite de limite \(a\).</strong> Si \(f(x) \to \ell\) quand \(x \to a\), et si \((u_n)\) est une suite d'éléments de \(I\) qui tend vers \(a\), alors \(f(u_n) \to \ell\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Composer deux définitions (cas \(a\) et \(\ell\) réels).</span>
    <div class="content"><p>Soit \(\varepsilon \gt 0\) et \(\eta\) associé par la définition de la limite de \(f\). Comme \(u_n \to a\), il existe un rang \(N\) à partir duquel \(|u_n - a| \le \eta\) ; alors \(|f(u_n) - \ell| \le \varepsilon\) pour \(n \ge N\). Les autres cas (\(a\) ou \(\ell\) infinis) se traitent de la même façon.</p></div>
  </div>
  <p>Ce résultat sert surtout à montrer qu'une fonction <strong>n'a pas</strong> de limite : il suffit de trouver deux suites tendant vers \(a\) dont les images ont des limites différentes. La réciproque (si \(f(u_n) \to \ell\) pour <em>toute</em> suite \(u_n \to a\), alors \(f \to \ell\)) est vraie mais hors programme (fin de chapitre).</p>
  <div class="method-box">
    <strong>Exemple — \(\sin(1/x)\) n'a pas de limite en 0</strong>
    <ol>
      <li>Avec \(u_n = \dfrac{1}{\pi/2 + 2n\pi}\) : \(u_n \to 0\) et \(\sin(1/u_n) = \sin(\pi/2) = 1\) pour tout \(n\).</li>
      <li>Avec \(v_n = \dfrac{1}{n\pi}\) (\(n \ge 1\)) : \(v_n \to 0\) et \(\sin(1/v_n) = \sin(n\pi) = 0\).</li>
      <li>Si \(\sin(1/x)\) avait une limite \(\ell\) en 0, les deux suites d'images tendraient vers \(\ell\) : on aurait \(\ell = 1\) et \(\ell = 0\). Il n'y a donc pas de limite. De même, \(\cos x\) n'a pas de limite en \(+\infty\) (prendre \(x = 2n\pi\) et \(x = (2n + 1)\pi\)).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · OPÉRATIONS ET THÉORÈMES D'EXISTENCE</div>
  <h2>Calculer une limite sans revenir aux \(\varepsilon\)</h2>
  <div class="intro">Les règles d'opérations ramènent une limite compliquée à des limites connues ; les théorèmes d'encadrement et de la limite monotone donnent l'existence d'une limite quand le calcul direct échoue. Ce sont les mêmes énoncés que pour les suites.</div>

  <div class="prop-box">
    <strong>Opérations.</strong> Si \(f \to \ell\) et \(g \to \ell'\) en \(a\) (limites finies) : \(\lambda f + \mu g \to \lambda\ell + \mu\ell'\), \(fg \to \ell\ell'\), et \(f/g \to \ell/\ell'\) si \(\ell' \ne 0\). Les règles s'étendent aux limites infinies, sauf dans les <strong>formes indéterminées</strong> \(\infty - \infty\), \(0 \times \infty\), \(\dfrac00\), \(\dfrac\infty\infty\) (et \(1^\infty\), \(0^0\), \(\infty^0\), qui se ramènent aux précédentes par \(u^v = e^{v\ln u}\)).<br>
    <strong>Composition.</strong> Si \(f(x) \to b\) quand \(x \to a\), et si \(g(y) \to \ell\) quand \(y \to b\), alors \(g(f(x)) \to \ell\) quand \(x \to a\).
  </div>
  <div class="prop-box">
    <strong>Inégalités et existence.</strong>
    <ul>
      <li><strong>Passage à la limite d'une inégalité large</strong> : si \(f \le g\) au voisinage de \(a\) et si \(f \to \ell\), \(g \to \ell'\), alors \(\ell \le \ell'\).</li>
      <li><strong>Encadrement</strong> : si \(g \le f \le h\) au voisinage de \(a\) et si \(g\) et \(h\) tendent vers la même limite <strong>finie</strong> \(\ell\), alors \(f \to \ell\).</li>
      <li><strong>Minoration, majoration</strong> : si \(f \ge g\) et \(g \to +\infty\), alors \(f \to +\infty\) ; si \(f \le g\) et \(g \to -\infty\), alors \(f \to -\infty\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — deux encadrements</strong>
    <ol>
      <li>\(\lim_{x \to +\infty}\dfrac{x + 2\sin x}{x + 1}\). Comme \(-1 \le \sin x \le 1\), pour \(x \gt 0\) :
      <div class="formula">$$\frac{x - 2}{x + 1} \le \frac{x + 2\sin x}{x + 1} \le \frac{x + 2}{x + 1},$$</div>
      et les deux bornes tendent vers 1 : la limite vaut 1. Le terme \(\sin x\) n'a pas de limite, mais il est « écrasé » par \(x\).</li>
      <li>\(\lim_{x \to 0^+} x\left\lfloor \dfrac1x \right\rfloor\), où \(\lfloor\cdot\rfloor\) est la partie entière. Pour \(x \gt 0\), \(\dfrac1x - 1 \lt \left\lfloor\dfrac1x\right\rfloor \le \dfrac1x\) ; on multiplie par \(x \gt 0\) : \(1 - x \lt x\lfloor 1/x \rfloor \le 1\). Les deux bornes tendent vers 1 : la limite vaut 1. Contrôle : pour \(x = 0{,}3\), \(\lfloor 3{,}33\ldots \rfloor = 3\) et \(x\lfloor 1/x \rfloor = 0{,}9 \in\, ]0{,}7 ; 1]\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : les inégalités <strong>strictes</strong> ne passent pas à la limite (\(1/x \gt 0\) sur \(]0, +\infty[\), mais \(\lim_{x\to+\infty} 1/x = 0\)) ; et le passage à la limite suppose que les limites <strong>existent</strong> : \(f \le g\) avec \(g \to \ell\) ne dit pas que \(f\) a une limite. Pour obtenir l'existence, il faut l'encadrement complet.</div>

  <div class="prop-box">
    <strong>Théorème de la limite monotone</strong> (démonstration non exigible). Soit \(f\) croissante sur \(]a, b[\) (\(a \lt b\), bornes éventuellement infinies). Alors \(f\) a une limite en \(b\) : finie (égale à \(\sup f\)) si \(f\) est majorée, \(+\infty\) sinon. De même \(f\) a une limite en \(a\) : \(\inf f\) si \(f\) est minorée, \(-\infty\) sinon. Énoncé symétrique pour une fonction décroissante.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de la démonstration</span>
    <span class="prompt">La borne supérieure joue le rôle de la limite.</span>
    <div class="content"><p>Supposons \(f\) majorée et posons \(M = \sup_{]a,b[} f\). Pour \(\varepsilon \gt 0\), \(M - \varepsilon\) n'est pas un majorant : il existe \(x_0\) avec \(f(x_0) \gt M - \varepsilon\). Pour \(x_0 \le x \lt b\), la croissance donne \(M - \varepsilon \lt f(x_0) \le f(x) \le M\). C'est exactement la définition de \(f(x) \to M\) en \(b\). Même raisonnement que pour les suites croissantes (chapitre « Suites numériques »).</p></div>
  </div>
  <p>Ainsi une fonction monotone a toujours des limites à gauche et à droite en tout point intérieur, mais elles peuvent différer : la partie entière, croissante, vaut 0 à gauche de 1 et 1 à droite. Les formes indéterminées se lèvent avec les outils du second semestre : équivalents (chapitre « Analyse asymptotique ») et développements limités.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CONTINUITÉ EN UN POINT</div>
  <h2>Une fonction qui ne saute pas</h2>
  <div class="intro">Une fonction est continue en \(a\) si ses valeurs près de \(a\) sont proches de \(f(a)\) : son graphe se trace sans lever le crayon. La plupart des théorèmes d'existence du chapitre (valeurs intermédiaires, bornes atteintes, accroissements finis) reposent sur cette hypothèse.</div>
  <div class="def-box">
    Soit \(a \in I\). La fonction \(f\) est <strong>continue en \(a\)</strong> si \(f(x) \xrightarrow[x \to a]{} f(a)\) ; <strong>continue à droite</strong> (à gauche) en \(a\) si sa limite à droite (à gauche) en \(a\) vaut \(f(a)\). Elle est <strong>continue sur \(I\)</strong> si elle est continue en tout point de \(I\).<br>
    Si \(f\) est définie sur \(I\) sauf en un point \(a\) de \(I\) et a une limite <strong>finie</strong> \(\ell\) en \(a\), la fonction \(\tilde f\) égale à \(f\) hors de \(a\) et à \(\ell\) en \(a\) est continue en \(a\) : c'est le <strong>prolongement par continuité</strong> de \(f\) en \(a\).
  </div>
  <div class="prop-box">
    <strong>Opérations.</strong> Une combinaison linéaire, un produit, un quotient (dénominateur non nul en \(a\)) de fonctions continues en \(a\) sont continus en \(a\) ; si \(f\) est continue en \(a\) et \(g\) continue en \(f(a)\), alors \(g \circ f\) est continue en \(a\). Les fonctions usuelles (polynômes, \(\exp\), \(\ln\), puissances, \(\sin\), \(\cos\), \(\tan\), \(\arctan\), \(\operatorname{ch}\), \(\operatorname{sh}\)…) sont continues sur leur ensemble de définition. Pour \(a\) intérieur à \(I\), \(f\) est continue en \(a\) si et seulement si elle est continue à gauche et à droite en \(a\).
  </div>
  <div class="method-box">
    <strong>Exemple — trois prolongements et un saut</strong>
    <ol>
      <li>\(x \mapsto \dfrac{\sin x}{x}\) sur \(\mathbb R^*\) : \(\dfrac{\sin x - \sin 0}{x - 0}\) est le taux d'accroissement de \(\sin\) en 0, qui tend vers \(\sin'(0) = \cos 0 = 1\). On la prolonge par continuité en posant la valeur 1 en 0.</li>
      <li>\(x \mapsto x\ln x\) sur \(]0, +\infty[\) tend vers 0 en \(0^+\) (croissances comparées) : on la prolonge par 0 en 0, sur \([0, +\infty[\).</li>
      <li>\(h(x) = e^{-1/x}\) pour \(x \gt 0\) et \(h(x) = 0\) pour \(x \le 0\) : à droite, \(-1/x \to -\infty\) donc \(h(x) \to 0 = h(0)\) ; à gauche, \(h\) est nulle. Elle est continue en 0 (elle sera même de classe \(\mathcal C^1\) au §10).</li>
      <li>La partie entière est continue à droite en chaque entier \(n\), pas à gauche : \(\lim_{x \to n^-}\lfloor x \rfloor = n - 1 \ne n\). Le saut vaut 1.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : vouloir prolonger quand la limite est infinie ou n'existe pas. \(1/x\) et \(\sin(1/x)\) ne se prolongent pas par continuité en 0 ; \(x\sin(1/x)\), elle, se prolonge par 0, car \(|x\sin(1/x)| \le |x|\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LE THÉORÈME DES VALEURS INTERMÉDIAIRES</div>
  <h2>Une fonction continue ne saute aucune valeur</h2>
  <div class="intro">Si une fonction continue passe d'une valeur négative à une valeur positive, elle s'annule entre les deux. C'est le théorème d'existence le plus utilisé pour les équations que l'on ne sait pas résoudre : on prouve qu'une solution existe, puis on l'approche par dichotomie.</div>
  <div class="prop-box">
    <strong>Théorème des valeurs intermédiaires.</strong> Soit \(f\) continue sur un <strong>intervalle</strong> \(I\), et \(a, b \in I\). Pour tout réel \(\gamma\) compris entre \(f(a)\) et \(f(b)\), il existe \(c\) compris entre \(a\) et \(b\) tel que \(f(c) = \gamma\). En particulier, si \(f(a)\,f(b) \le 0\), \(f\) s'annule entre \(a\) et \(b\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le principe de dichotomie.</span>
    <div class="content"><p>Quitte à remplacer \(f\) par \(f - \gamma\) ou par \(\gamma - f\), on suppose \(a \lt b\), \(f(a) \le 0 \le f(b)\), et on cherche un zéro. On pose \(a_0 = a\), \(b_0 = b\) et, \(m_n\) étant le milieu de \([a_n, b_n]\) : si \(f(m_n) \le 0\), \(a_{n+1} = m_n\) et \(b_{n+1} = b_n\) ; sinon \(a_{n+1} = a_n\) et \(b_{n+1} = m_n\). Par récurrence, \(f(a_n) \le 0 \le f(b_n)\), \((a_n)\) croît, \((b_n)\) décroît et \(b_n - a_n = (b - a)/2^n \to 0\) : les suites sont <strong>adjacentes</strong> et ont une limite commune \(c \in [a, b]\). Par continuité de \(f\) en \(c\) et image d'une suite (§1), \(f(a_n) \to f(c)\) et \(f(b_n) \to f(c)\) ; le passage à la limite des inégalités donne \(f(c) \le 0 \le f(c)\), donc \(f(c) = 0\).</p></div>
  </div>

<figcaption>La fonction continue g(x) = x³ + x − 1 vaut −1 en 0 et 1 en 1 : par le théorème des valeurs intermédiaires, elle s'annule en un point α de ]0, 1[. La dichotomie coupe l'intervalle en deux et garde la moitié où g change de signe : [0 ; 1], [0,5 ; 1], [0,5 ; 0,75], [0,625 ; 0,75], [0,625 ; 0,6875]… Après n étapes la longueur vaut 2⁻ⁿ ; dix étapes donnent α ≈ 0,682 à 10⁻³ près.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — l'équation \(x^3 + x - 1 = 0\)</strong>
    <ol>
      <li><strong>Existence.</strong> \(g(x) = x^3 + x - 1\) est continue sur \([0, 1]\), avec \(g(0) = -1 \lt 0\) et \(g(1) = 1 \gt 0\) : par le TVI, \(g\) s'annule en un point \(\alpha \in\, ]0, 1[\).</li>
      <li><strong>Unicité.</strong> \(g'(x) = 3x^2 + 1 \gt 0\) : \(g\) est strictement croissante sur \(\mathbb R\), donc s'annule au plus une fois. L'équation a une seule solution réelle.</li>
      <li><strong>Dichotomie.</strong> \(g(0{,}5) = -0{,}375\), \(g(0{,}75) \approx 0{,}172\), \(g(0{,}625) \approx -0{,}131\), \(g(0{,}6875) \approx 0{,}012\) : \(\alpha \in [0{,}625 ; 0{,}6875]\) après quatre étapes. La longueur est divisée par 2 à chaque étape ; pour une précision \(10^{-3}\) sur un intervalle de longueur 1, il faut \(2^{-n} \le 10^{-3}\), soit \(n \ge 10\) (\(2^{10} = 1024\)). On trouve \(\alpha \approx 0{,}682\,3\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Image d'un intervalle.</strong> L'image d'un intervalle par une fonction continue est un intervalle. Si de plus \(f\) est continue et <strong>strictement monotone</strong> sur \(I\), elle réalise une bijection de \(I\) sur l'intervalle \(f(I)\), dont les bornes sont les limites de \(f\) aux bornes de \(I\).
  </div>
  <div class="method-box">
    <strong>Exemple — une bijection et un polynôme de degré impair</strong>
    <ol>
      <li>\(f(x) = x + e^x\) est continue et strictement croissante sur \(\mathbb R\) (\(f' = 1 + e^x \gt 0\)), de limites \(-\infty\) en \(-\infty\) et \(+\infty\) en \(+\infty\) : c'est une bijection de \(\mathbb R\) sur \(\mathbb R\). L'équation \(x + e^x = m\) a une unique solution pour chaque réel \(m\).</li>
      <li>Un polynôme réel de degré impair, comme \(P(x) = x^5 - 3x + 1\), tend vers \(-\infty\) en \(-\infty\) et vers \(+\infty\) en \(+\infty\) : il prend des valeurs des deux signes, donc il a au moins une racine réelle. Ici il en a trois, proches de \(-1{,}389\), \(0{,}335\) et \(1{,}215\) (\(P(0) = 1\), \(P(1) = -1\), \(P(2) = 27\), \(P(-2) = -25\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : appliquer le TVI hors d'un intervalle (\(1/x\) prend les valeurs \(-1\) et \(1\) sur \([-1, 1] \setminus \{0\}\) sans jamais s'annuler) ou à une fonction discontinue (la partie entière saute de 0 à 1 sans prendre la valeur 1/2) ; conclure à l'<strong>unicité</strong> de \(c\), que le TVI ne donne jamais : il faut une stricte monotonie.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BORNES ATTEINTES ET BIJECTIONS CONTINUES</div>
  <h2>Sur un segment, une fonction continue a un maximum</h2>
  <div class="intro">Sur un segment \([a, b]\) (intervalle fermé et borné), une fonction continue atteint un plus grand et un plus petit élément. C'est ce qui garantit l'existence d'un optimum dans un problème de physique ou d'ingénierie, et c'est l'argument clé du théorème de Rolle (§8).</div>
  <div class="prop-box">
    <strong>Théorème des bornes atteintes</strong> (démonstration hors programme). Toute fonction continue sur un segment \([a, b]\) est bornée et atteint ses bornes : il existe \(x_m, x_M \in [a, b]\) tels que \(f(x_m) \le f(x) \le f(x_M)\) pour tout \(x \in [a, b]\). L'image d'un segment par une fonction continue est donc un segment : \(f([a, b]) = [f(x_m), f(x_M)]\).
  </div>
  <div class="method-box">
    <strong>Exemple — maximum de \(x\,e^{-x}\) sur \([0, 3]\)</strong>
    <ol>
      <li>\(f(x) = x\,e^{-x}\) est continue sur le segment \([0, 3]\) : elle y a un minimum et un maximum.</li>
      <li>\(f'(x) = (1 - x)\,e^{-x}\) : \(f\) croît sur \([0, 1]\) et décroît sur \([1, 3]\). Le maximum vaut \(f(1) = 1/e \approx 0{,}368\) ; le minimum est atteint en une borne : \(f(0) = 0\) et \(f(3) = 3e^{-3} \approx 0{,}149\), donc il vaut 0.</li>
      <li>Conclusion : \(f([0, 3]) = [0, 1/e]\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Les trois hypothèses comptent.</strong> Sur \(]0, 1]\) (non fermé), \(1/x\) n'est pas bornée ; sur \([0, +\infty[\) (non borné), \(\arctan\) est bornée par \(\pi/2\) sans l'atteindre ; sur \([-1, 1]\), la fonction égale à \(x\) sur \(]-1, 1[\) et à 0 en \(\pm 1\), discontinue, n'a ni maximum ni minimum.</div>
  <div class="prop-box">
    <strong>Réciproque d'une fonction continue strictement monotone</strong> (démonstration non exigible). Si \(f\) est continue et strictement monotone sur l'intervalle \(I\), elle réalise une bijection de \(I\) sur l'intervalle \(J = f(I)\), et sa réciproque \(f^{-1} : J \to I\) est continue, strictement monotone, de même sens de variation que \(f\).
  </div>
  <p>C'est ainsi que l'on définit \(\ln\) (réciproque de \(\exp\)), \(x \mapsto \sqrt[n]{x}\), et les fonctions \(\arcsin\), \(\arccos\), \(\arctan\) (réciproques des restrictions de \(\sin\) à \([-\pi/2, \pi/2]\), de \(\cos\) à \([0, \pi]\), de \(\tan\) à \(]-\pi/2, \pi/2[\)) : voir le chapitre « Fonctions réelles — généralités ». Par exemple \(g(x) = x^3 + x\) est une bijection continue croissante de \(\mathbb R\) sur \(\mathbb R\) ; \(g(1) = 2\), donc \(g^{-1}(2) = 1\), et \(g^{-1}\) est continue bien qu'on n'en ait pas de formule simple.</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DÉRIVABILITÉ EN UN POINT</div>
  <h2>La pente de la tangente, limite des pentes des sécantes</h2>
  <div class="intro">Le nombre dérivé mesure la vitesse de variation de \(f\) au point \(a\) : c'est la pente de la tangente, ou la vitesse instantanée si \(f\) décrit un mouvement. On le définit comme la limite des pentes des cordes, et on le relie à la meilleure approximation affine de \(f\) près de \(a\).</div>
  <div class="def-box">
    Soit \(a \in I\). Le <strong>taux d'accroissement</strong> de \(f\) en \(a\) est \(\tau_a(x) = \dfrac{f(x) - f(a)}{x - a}\), pour \(x \in I\), \(x \ne a\). La fonction \(f\) est <strong>dérivable en \(a\)</strong> si \(\tau_a\) a une limite <strong>finie</strong> en \(a\) ; cette limite est le <strong>nombre dérivé</strong> \(f'(a)\), noté aussi \(\dfrac{\mathrm{d}f}{\mathrm{d}x}(a)\) :
    <div class="formula" data-nom="Nombre dérivé">$$f'(a) = \lim_{x \to a}\frac{f(x) - f(a)}{x - a} = \lim_{h \to 0}\frac{f(a + h) - f(a)}{h}.$$</div>
    La <strong>dérivée à droite</strong> \(f'_d(a)\) (à gauche \(f'_g(a)\)) est la limite à droite (à gauche) de \(\tau_a\). Pour \(a\) intérieur à \(I\), \(f\) est dérivable en \(a\) si et seulement si \(f'_g(a)\) et \(f'_d(a)\) existent et sont égales.
  </div>

  <div class="prop-box">
    <strong>Caractérisation par un développement limité à l'ordre 1.</strong> \(f\) est dérivable en \(a\) si et seulement s'il existe un réel \(\lambda\) et une fonction \(\varepsilon\) de limite nulle en 0 tels que, pour \(a + h \in I\) :
    <div class="formula" data-nom="Dérivabilité et développement à l'ordre 1">$$f(a + h) = f(a) + \lambda h + h\,\varepsilon(h), \qquad \varepsilon(h) \xrightarrow[h \to 0]{} 0 .$$</div>
    On a alors \(\lambda = f'(a)\). La droite d'équation \(y = f(a) + f'(a)(x - a)\) est la <strong>tangente</strong> au graphe en \(a\) ; si \(f(t)\) est la position d'un mobile à l'instant \(t\), \(f'(t)\) est sa <strong>vitesse instantanée</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Caractérisation, puis « dérivable entraîne continue ».</span>
    <div class="content"><p>Si \(f\) est dérivable en \(a\), on pose \(\varepsilon(h) = \tau_a(a + h) - f'(a)\) pour \(h \ne 0\) et \(\varepsilon(0) = 0\) : \(\varepsilon \to 0\) et l'égalité est vraie avec \(\lambda = f'(a)\). Réciproquement, l'égalité donne \(\tau_a(a + h) = \lambda + \varepsilon(h) \to \lambda\). Enfin \(f(a + h) - f(a) = h\,(\lambda + \varepsilon(h)) \to 0\) : une fonction dérivable en \(a\) est <strong>continue</strong> en \(a\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — un nombre dérivé, un point anguleux, une tangente verticale</strong>
    <ol>
      <li>\(f(x) = x^2\) en \(a = 1\) : \(\tau_1(1 + h) = \dfrac{(1 + h)^2 - 1}{h} = 2 + h \to 2\), donc \(f'(1) = 2\) et la tangente est \(y = 2x - 1\) (figure ci-dessus).</li>
      <li>\(g(x) = |x^2 - 1|\) en 1 : à droite, \(g(x) = x^2 - 1\) et le taux tend vers \(2\) ; à gauche (près de 1), \(g(x) = 1 - x^2\) et le taux tend vers \(-2\). Les dérivées à gauche et à droite diffèrent : \(g\) est continue mais <strong>non dérivable</strong> en 1, son graphe y a un <strong>point anguleux</strong>.</li>
      <li>\(\sqrt{\cdot}\) en 0 : \(\dfrac{\sqrt h - 0}{h} = \dfrac{1}{\sqrt h} \to +\infty\). Non dérivable en 0 ; le graphe a une <strong>tangente verticale</strong> en l'origine.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — l'approximation affine pas à pas (méthode d'Euler)</strong>
    <p>L'égalité \(f(a + h) \approx f(a) + h\,f'(a)\) pour \(h\) petit permet de <strong>discrétiser</strong> une équation différentielle. Pour \(y' = y\), \(y(0) = 1\), on avance par pas \(h = 1/n\) en posant \(y_{k+1} = y_k + h\,y_k = (1 + h)\,y_k\) : après \(n\) pas, \(y(1) \approx (1 + 1/n)^n\). On obtient 2,593 7 pour \(n = 10\), 2,704 8 pour \(n = 100\), 2,716 9 pour \(n = 1000\), à comparer à \(e \approx 2{,}718\,3\) : l'erreur est à peu près divisée par 10 quand le pas l'est.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que « continue » entraîne « dérivable ». \(|x|\) est continue en 0 sans y être dérivable (dérivées à gauche \(-1\) et à droite \(+1\)) ; et une fonction peut être continue sur \(\mathbb R\) sans être dérivable nulle part (exemple hors programme de Weierstrass).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · OPÉRATIONS SUR LES FONCTIONS DÉRIVABLES</div>
  <h2>Dériver une somme, un produit, une composée, une réciproque</h2>
  <div class="intro">Les formules de dérivation du chapitre « Fonctions réelles — généralités » se démontrent avec la caractérisation du §6. La plus importante est celle de la composée ; celle de la réciproque donne les dérivées de \(\ln\), \(\arcsin\), \(\arctan\) et la tangente au graphe de \(f^{-1}\).</div>
  <div class="prop-box">
    <strong>Opérations.</strong> Si \(u\) et \(v\) sont dérivables en \(a\) et \(\lambda, \mu\) réels :
    <div class="formula" data-nom="Dérivées d'un produit, d'un quotient">$$(\lambda u + \mu v)' = \lambda u' + \mu v', \qquad (uv)' = u'v + uv', \qquad \left(\frac uv\right)' = \frac{u'v - uv'}{v^2}\ \ (v(a) \ne 0).$$</div>
    <strong>Composée.</strong> Si \(u\) est dérivable en \(a\) et \(g\) dérivable en \(u(a)\), alors \(g \circ u\) est dérivable en \(a\) et
    <div class="formula" data-nom="Dérivée d'une composée">$$(g \circ u)'(a) = u'(a)\; g'\big(u(a)\big).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Produit et composée par la caractérisation à l'ordre 1.</span>
    <div class="content"><p><strong>Produit.</strong> \(u(a + h) = u(a) + h\,u'(a) + h\,\varepsilon_1(h)\) et \(v(a + h) = v(a) + h\,v'(a) + h\,\varepsilon_2(h)\). En développant,</p>
    <div class="formula">$$(uv)(a + h) = (uv)(a) + h\,\big(u'(a)v(a) + u(a)v'(a)\big) + h\,\varepsilon_3(h),$$</div>
    <p>où \(\varepsilon_3\) regroupe des termes qui tendent tous vers 0. <strong>Composée.</strong> Posons \(b = u(a)\) et \(k = u(a + h) - b = h\,(u'(a) + \varepsilon_1(h))\), qui tend vers 0. Alors \(g(b + k) = g(b) + k\,g'(b) + k\,\varepsilon_4(k)\), soit</p>
    <div class="formula">$$g(u(a + h)) = g(b) + h\,u'(a)\,g'(b) + h\,\varepsilon_5(h), \qquad \varepsilon_5(h) = \varepsilon_1(h)\,g'(b) + \big(u'(a) + \varepsilon_1(h)\big)\,\varepsilon_4(k) \xrightarrow[h \to 0]{} 0 .$$</div></div>
  </div>
  <div class="prop-box">
    <strong>Réciproque.</strong> Soit \(f\) continue et strictement monotone sur l'intervalle \(I\), dérivable en \(a \in I\), et \(b = f(a)\). Si \(f'(a) \ne 0\), alors \(f^{-1}\) est dérivable en \(b\) et
    <div class="formula" data-nom="Dérivée d'une réciproque">$$(f^{-1})'(b) = \frac{1}{f'(a)} = \frac{1}{f'\big(f^{-1}(b)\big)} .$$</div>
    Si \(f'(a) = 0\), \(f^{-1}\) n'est pas dérivable en \(b\) : son graphe a une tangente verticale en \((b, a)\).
  </div>
  <p>Géométriquement, le graphe de \(f^{-1}\) est le symétrique de celui de \(f\) par rapport à la droite \(y = x\). Cette symétrie échange les deux axes : une tangente de pente \(p\) en \((a, b)\) devient une tangente de pente \(1/p\) en \((b, a)\).</p>

<figcaption>La courbe de la réciproque ln se déduit de celle de exp par la symétrie d'axe y = x. La symétrie échange les axes : la tangente à exp au point (1, e), de pente e, devient la tangente à ln au point (e, 1), de pente 1/e. C'est la formule (f⁻¹)′(b) = 1/f′(a) avec b = f(a). Une tangente horizontale de f (f′(a) = 0) deviendrait verticale pour f⁻¹.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — dérivée de \(\arcsin\) et tangente à une réciproque</strong>
    <ol>
      <li>\(\sin\) est continue, strictement croissante sur \([-\pi/2, \pi/2]\), de dérivée \(\cos\), non nulle sur \(]-\pi/2, \pi/2[\). Pour \(y \in\, ]-1, 1[\), avec \(\theta = \arcsin y\) : \(\arcsin'(y) = \dfrac{1}{\cos\theta}\). Or \(\cos\theta \ge 0\) et \(\cos^2\theta = 1 - \sin^2\theta = 1 - y^2\) : \(\arcsin'(y) = \dfrac{1}{\sqrt{1 - y^2}}\).</li>
      <li>En \(y = \pm 1\), \(\cos(\pm\pi/2) = 0\) : \(\arcsin\) n'est pas dérivable en \(\pm 1\) ; son graphe y a des tangentes verticales.</li>
      <li>\(g(x) = x^3 + x\) (bijection du §5) : \(g(1) = 2\) et \(g'(1) = 4\), donc \((g^{-1})'(2) = 1/4\). La tangente au graphe de \(g^{-1}\) au point \((2, 1)\) a pour équation \(y = 1 + \dfrac{x - 2}{4}\) — sans formule pour \(g^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : oublier le facteur \(u'(a)\) dans la dérivée d'une composée (\((\sin 3x)' = 3\cos 3x\), pas \(\cos 3x\)) ; évaluer \(f'\) au mauvais point dans la formule de la réciproque : c'est \(f'(a)\) avec \(a = f^{-1}(b)\), pas \(f'(b)\). Ainsi \(\ln'(e) = 1/\exp(\ln e) = 1/e\), et non \(1/\exp(e)\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · EXTREMUM LOCAL, THÉORÈMES DE ROLLE ET DES ACCROISSEMENTS FINIS</div>
  <h2>Là où la tangente est horizontale, ou parallèle à une corde</h2>
  <div class="intro">En un maximum intérieur, la tangente est horizontale. Le théorème de Rolle en tire l'existence d'un zéro de la dérivée ; l'égalité des accroissements finis relie la variation globale \(f(b) - f(a)\) à une valeur de \(f'\). C'est la passerelle entre la dérivée (locale) et le sens de variation (global).</div>
  <div class="def-box">
    \(f\) a un <strong>maximum local</strong> (un minimum local) en \(a \in I\) si \(f(x) \le f(a)\) (\(f(x) \ge f(a)\)) pour tout \(x\) de \(I\) voisin de \(a\) ; un <strong>extremum local</strong> est un maximum ou un minimum local. Un <strong>point critique</strong> de \(f\) dérivable est un zéro de \(f'\).
  </div>
  <div class="prop-box">
    <strong>Condition nécessaire d'extremum local.</strong> Si \(f\) a un extremum local en un point \(a\) <strong>intérieur</strong> à \(I\) et si \(f\) est dérivable en \(a\), alors \(f'(a) = 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le taux d'accroissement change de signe.</span>
    <div class="content"><p>Pour un maximum local en \(a\) : pour \(x\) voisin de \(a\), \(f(x) - f(a) \le 0\). Donc \(\tau_a(x) \le 0\) pour \(x \gt a\) et \(\tau_a(x) \ge 0\) pour \(x \lt a\) ; à la limite, \(f'_d(a) \le 0\) et \(f'_g(a) \ge 0\). Comme ces deux nombres valent \(f'(a)\), on a \(f'(a) = 0\). On a besoin de points des deux côtés de \(a\) : d'où l'hypothèse « \(a\) intérieur ».</p></div>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : la réciproque est fausse (\(x^3\) a un point critique en 0 sans extremum) ; et en une borne de \(I\) la dérivée n'a pas à s'annuler : \(x \mapsto x\) a son maximum sur \([0, 1]\) en 1, où la dérivée vaut 1. Pour décider, on étudie le signe de \(f'\) ou, au second semestre, un développement à l'ordre 2.</div>
  <div class="prop-box">
    <strong>Théorème de Rolle.</strong> Si \(f\) est continue sur \([a, b]\), dérivable sur \(]a, b[\), et si \(f(a) = f(b)\), il existe \(c \in\, ]a, b[\) tel que \(f'(c) = 0\).<br>
    <strong>Égalité des accroissements finis.</strong> Si \(f\) est continue sur \([a, b]\) et dérivable sur \(]a, b[\), il existe \(c \in\, ]a, b[\) tel que
    <div class="formula" data-nom="Égalité des accroissements finis">$$f(b) - f(a) = f'(c)\,(b - a).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Bornes atteintes, puis Rolle appliqué à une fonction auxiliaire.</span>
    <div class="content"><p><strong>Rolle.</strong> \(f\) est continue sur le segment \([a, b]\) : elle y atteint un maximum et un minimum (§5). Si les deux sont atteints aux bornes, ils valent \(f(a) = f(b)\) et \(f\) est constante : tout \(c\) convient. Sinon, l'un d'eux est atteint en un point \(c\) intérieur, où \(f'(c) = 0\) par la condition nécessaire. <strong>Accroissements finis.</strong> On applique Rolle à \(\varphi(x) = f(x) - f(a) - p\,(x - a)\), avec \(p = \dfrac{f(b) - f(a)}{b - a}\) : \(\varphi(a) = \varphi(b) = 0\), donc \(\varphi'(c) = f'(c) - p = 0\) pour un \(c \in\, ]a, b[\).</p></div>
  </div>

<text x="52" y="210" class="lab-accent">corde [AB] : pente (f(b) − f(a))/(b − a)</text>
<text x="52" y="228" class="lab-green">tangentes parallèles en c₁ et c₂</text>
<text x="136" y="31.5" class="lab-it" text-anchor="middle">y = x³ − 3x</text>
</svg>
<figcaption>Pour f(x) = x³ − 3x sur [a, b] = [−1,6 ; 2], la corde [AB] a pour pente (f(b) − f(a))/(b − a) = 0,36. L'égalité des accroissements finis garantit au moins un point c de ]a, b[ où la tangente lui est parallèle (f′(c) = 0,36) ; ici il y en a deux, c = ±1,058. En cinématique : à un instant au moins, la vitesse instantanée égale la vitesse moyenne.</figcaption>
</figure>
  <p><strong>Interprétations.</strong> Géométrique : il existe un point où la tangente est parallèle à la corde joignant \((a, f(a))\) et \((b, f(b))\). Cinématique : si \(f(t)\) est la position d'un mobile, sa vitesse instantanée égale sa vitesse moyenne \(\dfrac{f(b) - f(a)}{b - a}\) à un instant au moins. Une voiture qui parcourt 120 km en 1 h 20 min roule en moyenne à 90 km/h ; à un instant, son compteur affiche exactement 90 km/h.</p>
  <div class="method-box">
    <strong>Exemple — racines d'un polynôme et de sa dérivée</strong>
    <ol>
      <li>\(P(x) = (x - 1)(x - 2)(x - 4) = x^3 - 7x^2 + 14x - 8\) s'annule en 1, 2 et 4. Rolle sur \([1, 2]\) et \([2, 4]\) donne une racine de \(P'\) dans \(]1, 2[\) et une dans \(]2, 4[\).</li>
      <li>Contrôle : \(P'(x) = 3x^2 - 14x + 14\) a pour racines \(\dfrac{7 \pm \sqrt7}{3}\), soit \(\approx 1{,}451\) et \(\approx 3{,}215\). Comme \(P'\) est de degré 2, ce sont ses seules racines.</li>
      <li>Plus généralement, un polynôme réel de degré \(n\) ayant \(n\) racines réelles distinctes a une dérivée dont les \(n - 1\) racines sont réelles et s'intercalent entre elles.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier une hypothèse. \(|x|\) prend la même valeur en \(-1\) et en 1, mais sa dérivée ne s'annule jamais : elle n'est pas dérivable en 0. Rolle et l'égalité des accroissements finis sont <strong>faux</strong> pour les fonctions à valeurs complexes (§12).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · INÉGALITÉ DES ACCROISSEMENTS FINIS ET MONOTONIE</div>
  <h2>De la dérivée au sens de variation, et aux majorations d'erreur</h2>
  <div class="intro">Le point \(c\) des accroissements finis est inconnu ; mais si l'on sait encadrer \(f'\) partout, on encadre \(f(b) - f(a)\). On en déduit les caractérisations des fonctions constantes et monotones, et des majorations d'erreur, en particulier pour les suites récurrentes.</div>
  <div class="prop-box">
    <strong>Inégalité des accroissements finis.</strong> Si \(f\) est dérivable sur l'intervalle \(I\) et si \(|f'| \le K\) sur \(I\), alors
    <div class="formula" data-nom="Inégalité des accroissements finis">$$\forall x, y \in I, \qquad |f(y) - f(x)| \le K\,|y - x| .$$</div>
    On dit que \(f\) est \(K\)-<strong>lipschitzienne</strong> sur \(I\). Plus précisément, si \(m \le f' \le M\) sur \(I\), alors \(m\,(y - x) \le f(y) - f(x) \le M\,(y - x)\) pour \(x \le y\) dans \(I\).
  </div>
  <div class="prop-box">
    <strong>Monotonie.</strong> Soit \(f\) dérivable sur un <strong>intervalle</strong> \(I\).
    <ul>
      <li>\(f\) est constante sur \(I\) si et seulement si \(f' = 0\) sur \(I\) ;</li>
      <li>\(f\) est croissante sur \(I\) si et seulement si \(f' \ge 0\) sur \(I\) (décroissante : \(f' \le 0\)) ;</li>
      <li>\(f\) est strictement croissante sur \(I\) si et seulement si \(f' \ge 0\) sur \(I\) et \(f'\) n'est identiquement nulle sur aucun intervalle \([\alpha, \beta]\) avec \(\alpha \lt \beta\) ; c'est le cas en particulier si \(f' \gt 0\) sauf en un nombre fini de points.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout découle de l'égalité \(f(y) - f(x) = f'(c)(y - x)\).</span>
    <div class="content"><p>Pour \(x \lt y\) dans \(I\), l'égalité des accroissements finis sur \([x, y]\) donne \(c\) avec \(f(y) - f(x) = f'(c)\,(y - x)\). Si \(|f'| \le K\), on obtient l'inégalité ; si \(f' \ge 0\), \(f(y) \ge f(x)\) ; si \(f' = 0\), \(f(y) = f(x)\). Réciproquement, si \(f\) croît, ses taux d'accroissement sont positifs et leur limite \(f'(x)\) aussi. Si \(f\) croît sans être strictement croissante, il existe \(\alpha \lt \beta\) avec \(f(\alpha) = f(\beta)\) : \(f\) est constante sur \([\alpha, \beta]\) et \(f'\) y est nulle.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — encadrer un logarithme</strong>
    <p>Sur \([x, y] \subset\, ]0, +\infty[\), la dérivée \(1/t\) de \(\ln\) vérifie \(\dfrac1y \le \dfrac1t \le \dfrac1x\). L'inégalité des accroissements finis donne</p>
    <div class="formula">$$\frac{y - x}{y} \le \ln y - \ln x \le \frac{y - x}{x}.$$</div>
    <p>Avec \(x = 100\) et \(y = 101\) : \(0{,}009\,901 \le \ln(1{,}01) \le 0{,}01\) (la valeur exacte est \(0{,}009\,950\)). Avec \(x = 1\), \(y = 1 + u\) (\(u \gt 0\)), on retrouve \(\dfrac{u}{1 + u} \le \ln(1 + u) \le u\).</p>
  </div>
  <h3>Application aux suites récurrentes</h3>
  <div class="prop-box">
    <strong>Suite \(u_{n+1} = f(u_n)\) contractante.</strong> Soit \(J\) un intervalle stable par \(f\) (\(f(J) \subset J\)), contenant \(u_0\) et un point fixe \(\ell\) (\(f(\ell) = \ell\)). Si \(|f'| \le k\) sur \(J\) avec \(k \lt 1\), alors pour tout \(n\) :
    <div class="formula" data-nom="Suite récurrente contractante">$$|u_{n+1} - \ell| = |f(u_n) - f(\ell)| \le k\,|u_n - \ell|, \qquad\text{donc}\qquad |u_n - \ell| \le k^n\,|u_0 - \ell| \xrightarrow[n \to \infty]{} 0 .$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — la suite \(u_{n+1} = \cos u_n\), \(u_0 = 1\)</strong>
    <ol>
      <li>\(J = [0, 1]\) est stable : \(\cos\) y décroît, donc \(\cos(J) = [\cos 1, 1] \approx [0{,}540 ; 1] \subset J\). Sur \(J\), \(\cos x - x\) passe de 1 à \(\cos 1 - 1 \lt 0\) : il y a un point fixe \(\ell \approx 0{,}739\,085\).</li>
      <li>Sur \(J\), \(|\cos'(x)| = \sin x \le \sin 1 = k \approx 0{,}841\,5 \lt 1\) : \(|u_n - \ell| \le k^n\), donc \(u_n \to \ell\).</li>
      <li>Précision : \(k^n \le 10^{-6}\) dès \(n \ge 81\). C'est une garantie, prudente : en pratique, 32 itérations suffisent, car près de \(\ell\) le coefficient vaut plutôt \(\sin\ell \approx 0{,}674\). Cette convergence, où l'erreur est multipliée à peu près par une constante à chaque pas, est dite géométrique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : appliquer la caractérisation hors d'un intervalle : \(x \mapsto 1/x\) a une dérivée négative sur \(\mathbb R^*\) sans être décroissante sur \(\mathbb R^*\) (\(-1 \lt 1\) et pourtant \(f(-1) = -1 \lt f(1) = 1\)) ; croire que « strictement croissante » exige \(f' \gt 0\) : \(x^3\) est strictement croissante avec \(f'(0) = 0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · THÉORÈME DE LA LIMITE DE LA DÉRIVÉE</div>
  <h2>Prouver la dérivabilité en un point délicat sans taux d'accroissement</h2>
  <div class="intro">Pour une fonction définie par morceaux ou prolongée par continuité, le taux d'accroissement au point de raccord est souvent pénible. Si la dérivée, calculée partout ailleurs, a une limite au point, c'est gagné : la fonction y est dérivable, et même de dérivée continue.</div>
  <div class="prop-box">
    <strong>Théorème de la limite de la dérivée.</strong> Soit \(f\) <strong>continue</strong> sur \(I\), dérivable sur \(I \setminus \{a\}\). Si \(f'(x) \to \ell \in \mathbb R\) quand \(x \to a\), \(x \ne a\), alors \(f\) est dérivable en \(a\) et \(f'(a) = \ell\) ; la fonction \(f'\) est alors continue en \(a\).<br>
    <strong>Extension.</strong> Si \(f'(x) \to +\infty\) (ou \(-\infty\)) quand \(x \to a\), \(x \ne a\), alors \(\tau_a(x)\) tend vers la même limite : \(f\) n'est pas dérivable en \(a\) et son graphe y a une tangente verticale.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Les accroissements finis entre \(a\) et \(x\).</span>
    <div class="content"><p>Pour \(x \ne a\) dans \(I\), \(f\) est continue sur le segment d'extrémités \(a\) et \(x\), dérivable à l'intérieur : il existe \(c_x\) strictement entre \(a\) et \(x\) tel que \(\tau_a(x) = \dfrac{f(x) - f(a)}{x - a} = f'(c_x)\). Quand \(x \to a\), \(c_x \to a\) (il est coincé entre \(a\) et \(x\)) avec \(c_x \ne a\), donc \(f'(c_x) \to \ell\) par composition des limites. Ainsi \(\tau_a(x) \to \ell\). Le même argument vaut pour \(\ell = \pm\infty\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — raccorder deux morceaux</strong>
    <ol>
      <li>\(f(x) = x^2 + 1\) pour \(x \le 1\) et \(f(x) = 2x\) pour \(x \gt 1\). Continuité en 1 : les deux expressions valent 2 en 1, et \(f(x) \to 2 = f(1)\) des deux côtés.</li>
      <li>Hors de 1, \(f'(x) = 2x\) à gauche et \(f'(x) = 2\) à droite : dans les deux cas \(f'(x) \to 2\) quand \(x \to 1\).</li>
      <li>Par le théorème, \(f\) est dérivable en 1 avec \(f'(1) = 2\), et \(f'\) est continue sur \(\mathbb R\) : \(f\) est de classe \(\mathcal C^1\) (§11). Elle n'est pas deux fois dérivable en 1 : \(f''\) vaut 2 à gauche et 0 à droite.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une fonction très plate en 0</strong>
    <p>\(h(x) = e^{-1/x}\) pour \(x \gt 0\), \(h(x) = 0\) pour \(x \le 0\) est continue (§3). Pour \(x \gt 0\), \(h'(x) = \dfrac{1}{x^2}\,e^{-1/x}\) ; avec \(u = 1/x \to +\infty\), \(h'(x) = u^2e^{-u} \to 0\) (croissances comparées). À gauche, \(h' = 0\). Donc \(h\) est dérivable en 0, \(h'(0) = 0\), et \(h\) est de classe \(\mathcal C^1\). En itérant, on montre qu'elle est \(\mathcal C^\infty\) avec toutes ses dérivées nulles en 0 (exercice « Concours PT »).</p>
  </div>
  <div class="method-box">
    <strong>Exemple — tangentes verticales de \(\arcsin\)</strong>
    <p>\(\arcsin\) est continue sur \([-1, 1]\) et \(\arcsin'(x) = \dfrac{1}{\sqrt{1 - x^2}} \to +\infty\) quand \(x \to 1^-\) : par l'extension, \(\arcsin\) n'est pas dérivable en 1 et son graphe y a une tangente verticale (de même en \(-1\)). On retrouve le résultat du §7.</p>
  </div>

<div class="course-section">
  <div class="sec-num">§11 · FONCTIONS DE CLASSE \(\mathcal C^k\), FORMULE DE LEIBNIZ</div>
  <h2>Dérivées successives et dérivée \(n\)-ième d'un produit</h2>
  <div class="intro">La régularité d'une fonction se mesure au nombre de dérivées continues qu'elle possède. Les développements limités (formule de Taylor-Young) et les équations différentielles demandent des fonctions de classe \(\mathcal C^k\) ; la formule de Leibniz donne la dérivée \(n\)-ième d'un produit comme le binôme de Newton donne \((a + b)^n\).</div>
  <div class="def-box">
    On définit par récurrence les dérivées successives : \(f^{(0)} = f\) et \(f^{(k+1)} = \big(f^{(k)}\big)'\) quand elle existe. Pour \(k \in \mathbb N\), \(f\) est <strong>de classe \(\mathcal C^k\)</strong> sur \(I\) si elle est \(k\) fois dérivable sur \(I\) et si \(f^{(k)}\) est continue sur \(I\) ; \(\mathcal C^0\) désigne les fonctions continues. Elle est <strong>de classe \(\mathcal C^\infty\)</strong> si elle est de classe \(\mathcal C^k\) pour tout \(k\). Chaque classe contient la suivante : \(\mathcal C^{k+1} \subset \mathcal C^k\), et \(\mathcal C^\infty\) est contenue dans toutes.
  </div>
  <div class="method-box">
    <strong>Exemple — l'échelle de régularité autour de 0</strong>
    <ol>
      <li>\(x \mapsto |x|\) est \(\mathcal C^0\), pas dérivable en 0.</li>
      <li>\(x^2\sin(1/x)\) prolongée par 0 est dérivable sur \(\mathbb R\), mais pas \(\mathcal C^1\) : \(f'\) n'a pas de limite en 0 (§10).</li>
      <li>\(x \mapsto x|x|\) est \(\mathcal C^1\) (\(f'(x) = 2|x|\), continue), mais pas deux fois dérivable en 0 (\(f'\) y a un point anguleux).</li>
      <li>Les polynômes, \(\exp\), \(\sin\), \(\cos\), \(\operatorname{ch}\), \(\operatorname{sh}\) sont \(\mathcal C^\infty\) sur \(\mathbb R\) ; \(\ln\) et \(x \mapsto x^\alpha\) le sont sur \(]0, +\infty[\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Opérations.</strong> Une combinaison linéaire, un produit, un quotient (dénominateur ne s'annulant pas), une composée de fonctions de classe \(\mathcal C^k\) est de classe \(\mathcal C^k\) ; la réciproque d'une bijection de classe \(\mathcal C^k\) (\(k \ge 1\)) dont la dérivée ne s'annule pas est de classe \(\mathcal C^k\) (démonstrations non exigibles pour la composée et la réciproque).<br>
    <strong>Formule de Leibniz.</strong> Si \(f\) et \(g\) sont \(n\) fois dérivables sur \(I\), alors \(fg\) l'est aussi et
    <div class="formula" data-nom="Formule de Leibniz">$$(fg)^{(n)} = \sum_{k=0}^{n}\binom nk f^{(k)}\,g^{(n-k)} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Récurrence sur \(n\), avec la formule de Pascal.</span>
    <div class="content"><p>Pour \(n = 0\), c'est \(fg = fg\). Si la formule est vraie au rang \(n\) et si \(f\), \(g\) sont \(n + 1\) fois dérivables, on dérive chaque terme comme un produit :</p>
    <div class="formula">$$(fg)^{(n+1)} = \sum_{k=0}^{n}\binom nk\left(f^{(k+1)}g^{(n-k)} + f^{(k)}g^{(n+1-k)}\right) = \sum_{k=0}^{n+1}\left[\binom n{k-1} + \binom nk\right] f^{(k)}g^{(n+1-k)},$$</div>
    <p>en décalant l'indice dans la première somme (avec la convention \(\binom n{-1} = \binom n{n+1} = 0\)). La formule de Pascal \(\binom n{k-1} + \binom nk = \binom{n+1}k\) donne le rang \(n + 1\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Dérivées \(n\)-ièmes usuelles.</strong> Pour \(\lambda \in \mathbb R\) et \(p \in \mathbb N\) :
    <div class="formula" data-nom="Dérivées n-ièmes usuelles">$$\big(e^{\lambda x}\big)^{(n)} = \lambda^n e^{\lambda x}, \quad \sin^{(n)}(x) = \sin\!\Big(x + \frac{n\pi}{2}\Big), \quad \cos^{(n)}(x) = \cos\!\Big(x + \frac{n\pi}{2}\Big), \quad \Big(\frac{1}{1 - x}\Big)^{(n)} = \frac{n!}{(1 - x)^{n+1}} .$$</div>
    Et \((x^p)^{(n)} = \dfrac{p!}{(p - n)!}\,x^{p-n}\) pour \(n \le p\), \((x^p)^{(n)} = 0\) pour \(n \gt p\) : dans la formule de Leibniz, un facteur polynomial arrête la somme.
  </div>
  <div class="method-box">
    <strong>Exemple — deux dérivées \(n\)-ièmes par Leibniz</strong>
    <ol>
      <li>\(f(x) = x^2e^x\). Avec \(u = x^2\) (\(u' = 2x\), \(u'' = 2\), \(u^{(k)} = 0\) pour \(k \ge 3\)) et \(v = e^x\), seuls trois termes restent :
      <div class="formula">$$f^{(n)}(x) = x^2e^x + n \cdot 2x\,e^x + \binom n2 \cdot 2\,e^x = e^x\big(x^2 + 2nx + n(n - 1)\big).$$</div>
      Contrôle : \(n = 1\) donne \(e^x(x^2 + 2x)\), la dérivée d'un produit.</li>
      <li>\(g(x) = x^3\sin x\), calcul de \(g^{(10)}(0)\). Les dérivées de \(x^3\) d'ordre 0, 1, 2 (\(x^3\), \(3x^2\), \(6x\)) sont nulles en 0, celles d'ordre \(\ge 4\) sont nulles partout : seul reste le terme \(k = 3\),
      <div class="formula">$$g^{(10)}(0) = \binom{10}{3} \cdot 6 \cdot \sin^{(7)}(0) = 120 \cdot 6 \cdot \sin\!\Big(\frac{7\pi}{2}\Big) = -720 .$$</div></li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \((fg)'' = f''g''\), ou oublier les coefficients binomiaux : \((fg)'' = f''g + 2f'g' + fg''\). Pour un polynôme, la formule de Taylor polynomiale \(P(a + h) = \sum_k \frac{P^{(k)}(a)}{k!}h^k\) (chapitres « Polynômes » et des développements limités) se déduit aussi de ces dérivées successives.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · FONCTIONS À VALEURS COMPLEXES</div>
  <h2>Tout passe par les parties réelle et imaginaire, sauf Rolle</h2>
  <div class="intro">En physique (régime sinusoïdal, notation complexe), on dérive des fonctions comme \(t \mapsto e^{i\omega t}\). On étend les définitions en travaillant sur la partie réelle et la partie imaginaire ; tout se passe comme pour les fonctions réelles, sauf les énoncés qui utilisent l'ordre de \(\mathbb R\).</div>
  <div class="def-box">
    Soit \(f = u + iv : I \to \mathbb C\), avec \(u = \operatorname{Re} f\) et \(v = \operatorname{Im} f\) réelles. \(f\) a pour limite \(\ell \in \mathbb C\) en \(a\) si \(|f(x) - \ell| \to 0\), ce qui équivaut à \(u \to \operatorname{Re}\ell\) et \(v \to \operatorname{Im}\ell\). \(f\) est continue, dérivable, de classe \(\mathcal C^k\) si \(u\) et \(v\) le sont, et alors
    <div class="formula" data-nom="Dérivée d'une fonction complexe">$$f' = u' + i\,v' .$$</div>
  </div>
  <div class="prop-box">
    <strong>Règles.</strong> Combinaisons linéaires (à coefficients complexes), produits, quotients, et la formule de Leibniz, s'étendent sans changement. Si \(\varphi : I \to \mathbb C\) est dérivable, alors
    <div class="formula" data-nom="Dérivée de exp(φ)">$$\big(e^{\varphi}\big)' = \varphi'\,e^{\varphi} ; \qquad\text{en particulier}\qquad \big(e^{\lambda t}\big)' = \lambda\,e^{\lambda t}\ \ (\lambda \in \mathbb C).$$</div>
    <strong>Inégalité des accroissements finis.</strong> Si \(f : [a, b] \to \mathbb C\) est de classe \(\mathcal C^1\) et \(|f'| \le M\), alors \(|f(b) - f(a)| \le M\,|b - a|\). Elle résulte de \(f(b) - f(a) = \int_a^b f'\) et de la majoration du module d'une intégrale (chapitre « Intégrales »).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La dérivée de \(e^{\varphi}\) avec \(\varphi = a + ib\).</span>
    <div class="content"><p>Avec \(a = \operatorname{Re}\varphi\) et \(b = \operatorname{Im}\varphi\) dérivables, \(e^{\varphi} = e^a\cos b + i\,e^a\sin b\). On dérive les deux parties : \((e^a\cos b)' = e^a(a'\cos b - b'\sin b)\) et \((e^a\sin b)' = e^a(a'\sin b + b'\cos b)\). La somme vaut \(e^a(a' + ib')(\cos b + i\sin b) = \varphi'\,e^{\varphi}\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — dériver par l'exponentielle complexe</strong>
    <ol>
      <li>\(f(t) = e^{(-1 + 2i)t} = e^{-t}(\cos 2t + i\sin 2t)\) : \(f'(t) = (-1 + 2i)\,e^{(-1 + 2i)t}\), et \(|f'(t)| = \sqrt5\,e^{-t}\).</li>
      <li>En prenant la partie réelle, sans dériver de produit :
      <div class="formula">$$\big(e^{-t}\cos 2t\big)' = \operatorname{Re}\big((-1 + 2i)(\cos 2t + i\sin 2t)\big)\,e^{-t} = -e^{-t}(\cos 2t + 2\sin 2t).$$</div></li>
      <li>\(g(\theta) = e^{i\theta}\) vérifie \(|g'| = 1\) : l'inégalité des accroissements finis donne \(|e^{i\theta} - 1| \le |\theta|\). Pour \(\theta = 1\), \(|e^i - 1| = 2\sin\frac12 \approx 0{,}959 \le 1\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Ce qui ne passe pas</strong> : le théorème de Rolle et l'égalité des accroissements finis. \(g(t) = e^{it}\) vérifie \(g(0) = g(2\pi) = 1\), mais \(g'(t) = i\,e^{it}\) ne s'annule jamais (\(|g'(t)| = 1\)). Il n'y a pas non plus de « fonction complexe croissante » : seules l'inégalité des accroissements finis et la caractérisation des fonctions constantes (\(f' = 0\) sur un intervalle) survivent.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Caractérisation séquentielle, continuité uniforme, convexité</h2>
  <div class="intro">Ces notions ne sont exigibles ni en PTSI ni en PT. Elles apparaissent parfois dans un énoncé, qui les définit alors.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Caractérisation séquentielle de la limite</span>
    <span class="prompt">La réciproque de « l'image d'une suite ».</span>
    <div class="content"><p>Si, pour <strong>toute</strong> suite \((u_n)\) d'éléments de \(I\) tendant vers \(a\), la suite \(f(u_n)\) tend vers \(\ell\), alors \(f(x) \to \ell\) quand \(x \to a\). Par contraposée : si \(f\) ne tend pas vers \(\ell\), il existe \(\varepsilon \gt 0\) et, pour chaque \(n\), un \(u_n\) à moins de \(1/n\) de \(a\) avec \(|f(u_n) - \ell| \gt \varepsilon\) ; cette suite tend vers \(a\) sans que \(f(u_n)\) tende vers \(\ell\). Seul le sens direct (§1) est au programme.</p></div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Continuité uniforme et théorème de Heine</span>
    <span class="prompt">Un même \(\eta\) pour tous les points.</span>
    <div class="content"><p>\(f\) est <strong>uniformément continue</strong> sur \(I\) si</p>
    <div class="formula">$$\forall \varepsilon \gt 0,\ \exists \eta \gt 0,\ \forall x, y \in I,\quad |x - y| \le \eta \implies |f(x) - f(y)| \le \varepsilon :$$</div>
    <p>le \(\eta\) ne dépend plus du point. Une fonction lipschitzienne (§9) l'est, avec \(\eta = \varepsilon/K\) ; \(x \mapsto x^2\) ne l'est pas sur \(\mathbb R\). Le <strong>théorème de Heine</strong> affirme que toute fonction continue sur un segment y est uniformément continue ; il sert à démontrer la convergence des sommes de Riemann pour une fonction seulement continue.</p></div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Fonctions convexes et inégalité de Jensen</span>
    <span class="prompt">La corde au-dessus de la courbe.</span>
    <div class="content"><p>\(f\) est <strong>convexe</strong> sur \(I\) si \(f(\lambda x + (1 - \lambda)y) \le \lambda f(x) + (1 - \lambda)f(y)\) pour \(x, y \in I\) et \(\lambda \in [0, 1]\) : chaque corde est au-dessus de la courbe. Pour \(f\) dérivable, cela équivaut à \(f'\) croissante (\(f'' \ge 0\) si \(f\) est deux fois dérivable), et le graphe est alors au-dessus de ses tangentes. L'<strong>inégalité de Jensen</strong> généralise la définition : \(f\big(\sum\lambda_i x_i\big) \le \sum\lambda_i f(x_i)\) pour des \(\lambda_i \ge 0\) de somme 1. Les inégalités du programme \(e^x \ge 1 + x\) et \(\ln(1 + x) \le x\) n'en ont pas besoin : elles se démontrent par une étude de fonction (§7 du chapitre « Fonctions réelles — généralités »), et la position d'une courbe par rapport à sa tangente se lit sur un développement limité.</p></div>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="cd-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CONTINUITÉ ET DÉRIVABILITÉ</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Démontrer une limite, prolonger une fonction, prouver qu'une équation a une solution et l'approcher, étudier la dérivabilité en un point délicat, encadrer par les accroissements finis, calculer une dérivée \(n\)-ième : chaque méthode donne l'ordre des questions à se poser et un exemple éclair vérifié. Les notations sont celles du cours (§1 à §12).</div>

  <div class="method-box">
    <strong>Méthode 1 — Démontrer une limite par la définition</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire l'écart \(|f(x) - \ell|\) et le <strong>factoriser</strong> par \(|x - a|\) (ou, en \(+\infty\), le majorer par une expression qui tend vers 0).</li>
      <li><span class="step">Étape 2.</span> Majorer le facteur restant par une constante \(C\) sur un voisinage fixé de \(a\) (par exemple \(|x - a| \le 1\)).</li>
      <li><span class="step">Étape 3.</span> Conclure : \(\eta = \min(1, \varepsilon/C)\) convient. Le réel \(\eta\) dépend de \(\varepsilon\), jamais de \(x\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\lim_{x \to 1} x^2 = 1\). Pour \(|x - 1| \le 1\), \(|x + 1| \le 3\), donc \(|x^2 - 1| = |x - 1|\,|x + 1| \le 3|x - 1|\) : \(\eta = \min(1, \varepsilon/3)\) convient. Pour \(\varepsilon = 0{,}01\), \(\eta \approx 0{,}003\,3\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Obtenir une limite par encadrement, ou prouver qu'il n'y en a pas</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Isoler le terme qui n'a pas de limite mais qui est <strong>borné</strong> (\(\sin\), \(\cos\), partie entière à 1 près : \(t - 1 \lt \lfloor t \rfloor \le t\)).</li>
      <li><span class="step">Étape 2.</span> Encadrer \(f\) entre deux fonctions de même limite finie (ou minorer par une fonction qui tend vers \(+\infty\)) ; conclure par le théorème d'encadrement.</li>
      <li><span class="step">Étape 3.</span> Pour montrer qu'il n'y a <strong>pas</strong> de limite : exhiber deux suites \(u_n \to a\), \(v_n \to a\) dont les images ont des limites différentes (image d'une suite, §1).</li>
    </ol>
    <p><em>Exemple éclair :</em> en \(+\infty\), \(\dfrac{x - 1}{x} \lt \dfrac{\lfloor x \rfloor}{x} \le 1\), donc \(\lfloor x \rfloor / x \to 1\). En revanche \(x - \lfloor x \rfloor\) n'a pas de limite en \(+\infty\) : elle vaut 0 en \(u_n = n\) et \(1/2\) en \(v_n = n + 1/2\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Étudier la continuité en un point, prolonger par continuité</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Hors du point délicat, invoquer les opérations sur les fonctions continues (fonctions usuelles).</li>
      <li><span class="step">Étape 2.</span> Au point \(a\) : calculer la limite (ou les limites à gauche et à droite pour une fonction définie par morceaux). Pensez au taux d'accroissement : \(\frac{g(x) - g(0)}{x} \to g'(0)\).</li>
      <li><span class="step">Étape 3.</span> Conclure : continue si les limites existent et valent \(f(a)\) ; prolongeable si \(f\) n'est pas définie en \(a\) et a une limite <strong>finie</strong>.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{e^{2x} - 1}{x}\) est le taux d'accroissement en 0 de \(x \mapsto e^{2x}\), de dérivée \(2e^{2x}\) : elle tend vers 2, et se prolonge par la valeur 2 en 0. Pour \(f(x) = ax + 1\) si \(x \le 1\) et \(f(x) = x^2 + 2\) si \(x \gt 1\), la continuité en 1 impose \(a + 1 = 3\), soit \(a = 2\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Résoudre \(f(x) = \gamma\) : existence, unicité, valeur approchée</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Se ramener à \(g(x) = 0\) avec \(g\) <strong>continue sur un intervalle</strong>.</li>
      <li><span class="step">Étape 2.</span> <strong>Existence</strong> : trouver \(a\), \(b\) avec \(g(a)\,g(b) \le 0\) (ou des limites de signes opposés aux bornes) ; TVI.</li>
      <li><span class="step">Étape 3.</span> <strong>Unicité</strong> : montrer que \(g\) est strictement monotone (signe de \(g'\)) ; sans cela, le TVI ne dit rien sur le nombre de solutions.</li>
      <li><span class="step">Étape 4.</span> <strong>Approximation</strong> : dichotomie ; après \(n\) étapes, l'erreur est au plus \((b - a)/2^n\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\ln x = 2 - x\). \(g(x) = \ln x + x - 2\) est continue et strictement croissante sur \(]0, +\infty[\), avec \(g(1) = -1\) et \(g(2) = \ln 2 \approx 0{,}693\) : une seule solution, dans \(]1, 2[\). Puis \(g(1{,}5) \approx -0{,}095\) et \(g(1{,}75) \approx 0{,}310\) : elle est dans \(]1{,}5 ; 1{,}75[\) (elle vaut \(1{,}557\) à \(10^{-3}\) près).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Étudier la dérivabilité en un point délicat</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Vérifier d'abord la <strong>continuité</strong> en \(a\) : sans elle, pas de dérivabilité.</li>
      <li><span class="step">Étape 2.</span> Si \(f'\) se calcule facilement hors de \(a\) et a une limite \(\ell\) en \(a\) : théorème de la limite de la dérivée, \(f'(a) = \ell\) et \(f'\) continue en \(a\) (§10). Si \(f'(x) \to \pm\infty\) : non dérivable, tangente verticale.</li>
      <li><span class="step">Étape 3.</span> Sinon, revenir au <strong>taux d'accroissement</strong>, à gauche et à droite s'il le faut : limites finies égales → dérivable ; finies différentes → point anguleux ; infinie → tangente verticale.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = x^2\ln x\) prolongée par \(f(0) = 0\) sur \([0, +\infty[\). Le taux en 0 vaut \(\frac{h^2\ln h}{h} = h\ln h \to 0\) : \(f\) est dérivable à droite en 0 et \(f'(0) = 0\). La limite de la dérivée le confirme : \(f'(x) = 2x\ln x + x \to 0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Dériver une composée, une réciproque, et tracer la tangente à \(f^{-1}\)</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Composée : identifier la fonction intérieure \(u\) et l'extérieure \(g\) ; écrire \((g \circ u)' = u' \times (g' \circ u)\).</li>
      <li><span class="step">Étape 2.</span> Réciproque : vérifier que \(f\) est continue, strictement monotone sur un intervalle, et repérer le point \(a\) tel que \(f(a) = b\) (souvent par une valeur évidente).</li>
      <li><span class="step">Étape 3.</span> Si \(f'(a) \ne 0\) : \((f^{-1})'(b) = 1/f'(a)\), et la tangente au graphe de \(f^{-1}\) en \((b, a)\) est \(y = a + \dfrac{x - b}{f'(a)}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\big(\arctan(e^x)\big)' = \dfrac{e^x}{1 + e^{2x}}\). Et \(f(x) = x + \ln x\), bijection croissante de \(]0, +\infty[\) sur \(\mathbb R\) : \(f(1) = 1\), \(f'(1) = 2\), donc \((f^{-1})'(1) = \frac12\) et la tangente à \(f^{-1}\) en \((1, 1)\) est \(y = \frac{x + 1}{2}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Compter des racines avec le théorème de Rolle</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Si \(f\) s'annule en \(p\) points distincts, Rolle entre deux zéros consécutifs donne au moins \(p - 1\) zéros de \(f'\), intercalés.</li>
      <li><span class="step">Étape 2.</span> Contraposée : si \(f'\) s'annule au plus \(q\) fois, \(f\) s'annule au plus \(q + 1\) fois.</li>
      <li><span class="step">Étape 3.</span> Compléter par le TVI pour l'existence, et localiser les zéros par les signes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = x^4 - 4x + 1\) : \(f'(x) = 4(x^3 - 1)\) ne s'annule qu'en 1, donc \(f\) a au plus deux racines. Comme \(f(0) = 1\), \(f(1) = -2\), \(f(2) = 9\), elle en a exactement deux, dans \(]0, 1[\) et \(]1, 2[\) (environ \(0{,}251\) et \(1{,}493\)).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Établir une inégalité : étude de fonction ou accroissements finis</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Pour une inégalité \(A(x) \le B(x)\) : étudier le signe de \(g = B - A\), souvent par \(g'\) et une valeur connue (\(g(0) = 0\)).</li>
      <li><span class="step">Étape 2.</span> Pour une inégalité entre \(f(y) - f(x)\) et \(y - x\) : encadrer \(f'\) sur \([x, y]\) et appliquer l'inégalité des accroissements finis.</li>
      <li><span class="step">Étape 3.</span> Contrôler sur une valeur numérique.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(x \ge 0\), \(x - \frac{x^2}{2} \le \ln(1 + x) \le x\). Avec \(g(x) = \ln(1 + x) - x + \frac{x^2}{2}\) : \(g'(x) = \dfrac{x^2}{1 + x} \ge 0\) et \(g(0) = 0\), d'où la minoration ; la majoration vient de même. Contrôle en \(x = 1\) : \(0{,}5 \le 0{,}693 \le 1\). Et \(|\arctan a - \arctan b| \le |a - b|\) car \(|\arctan'| = \frac{1}{1 + x^2} \le 1\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Étudier une suite \(u_{n+1} = f(u_n)\) par l'inégalité des accroissements finis</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Trouver un intervalle \(J\) <strong>stable</strong> (\(f(J) \subset J\)) contenant \(u_0\) : alors tous les \(u_n\) sont dans \(J\).</li>
      <li><span class="step">Étape 2.</span> Trouver le point fixe \(\ell\) dans \(J\) (TVI sur \(f(x) - x\)).</li>
      <li><span class="step">Étape 3.</span> Majorer \(|f'|\) par \(k \lt 1\) sur \(J\) : \(|u_{n+1} - \ell| \le k|u_n - \ell|\), puis \(|u_n - \ell| \le k^n|u_0 - \ell|\).</li>
      <li><span class="step">Étape 4.</span> Pour une précision \(\varepsilon\), résoudre \(k^n|u_0 - \ell| \le \varepsilon\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_{n+1} = \sqrt{2 + u_n}\), \(u_0 = 0\). \(J = [0, 2]\) est stable, \(\ell = 2\), \(f'(x) = \dfrac{1}{2\sqrt{2 + x}} \le \dfrac{1}{2\sqrt2} \approx 0{,}354\) : \(|u_n - 2| \le 2 \times 0{,}354^n\), inférieur à \(10^{-6}\) dès \(n = 14\) (11 itérations suffisent en pratique).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Calculer une dérivée \(n\)-ième</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Reconnaître une dérivée usuelle : \(e^{\lambda x}\), \(\sin\), \(\cos\), \(\frac{1}{1 - x}\), \(x^p\) (cours §11).</li>
      <li><span class="step">Étape 2.</span> Un produit dont un facteur est un polynôme de degré \(d\) : formule de Leibniz, qui ne garde que \(d + 1\) termes.</li>
      <li><span class="step">Étape 3.</span> Un produit \(e^{ax}\cos(bx)\) ou \(e^{ax}\sin(bx)\) : c'est la partie réelle ou imaginaire de \(e^{(a + ib)x}\), dont la dérivée \(n\)-ième est \((a + ib)^n e^{(a + ib)x}\) (§12).</li>
      <li><span class="step">Étape 4.</span> Vérifier la formule pour \(n = 0\) et \(n = 1\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(1 + i = \sqrt2\,e^{i\pi/4}\), donc</p>
    <div class="formula">$$\big(e^x\cos x\big)^{(n)} = \operatorname{Re}\big((1 + i)^n e^{(1 + i)x}\big) = 2^{n/2}e^x\cos\!\Big(x + \frac{n\pi}{4}\Big).$$</div>
    <p>Pour \(n = 2\) : \(2e^x\cos(x + \frac\pi2) = -2e^x\sin x\), ce que confirme le calcul direct.</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong>
    <ul>
      <li>Continue n'entraîne pas dérivable (\(|x|\), \(\sqrt x\) en 0) ; dérivable n'entraîne pas \(\mathcal C^1\) (\(x^2\sin(1/x)\)).</li>
      <li>Le TVI donne l'existence, jamais l'unicité ; il exige un intervalle et la continuité.</li>
      <li>Le point \(c\) des accroissements finis est inconnu : on encadre \(f'\) partout plutôt que de le chercher.</li>
      <li>Rolle et l'égalité des accroissements finis ne s'appliquent pas aux fonctions à valeurs complexes ; l'inégalité, si.</li>
      <li>La limite de la dérivée suppose \(f\) continue au point ; et si \(f'\) n'a pas de limite, on ne peut rien conclure : revenir au taux d'accroissement.</li>
      <li>Leibniz : ne pas oublier les coefficients binomiaux, \((fg)'' = f''g + 2f'g' + fg''\).</li>
    </ul>
  </div>
</div>
