<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Le programme de PTSI ne contient pas de chapitre « atome » à proprement parler : il fait du <strong>tableau périodique</strong> l'« outil essentiel du chimiste » et demande d'y lire, d'après la position d'un élément, ce qui gouverne sa chimie. Ce chapitre rassemble ces capacités, dispersées dans les parties 4.2.1 (structure des entités), 4.3 (métaux) et 4.4.2 (oxydoréduction), sur la base des acquis du lycée (noyau, isotopes, configuration électronique jusqu'à l'argon). Il prépare <a href="#molecules/cours">« Structure des molécules »</a> (schémas de Lewis, polarité), <a href="#cristallin/cours">« Solides cristallins »</a> (métaux, solides ioniques) et <a href="#oxred/cours">« Oxydoréduction »</a> (nombres d'oxydation).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Acquis du lycée réinvestis</strong> : constitution de l'atome, numéro atomique, nombre de masse, isotopes, masse molaire ; entités et espèces chimiques ; configuration électronique jusqu'à \(Z = 18\) (§1, §2, §3, §5).</li>
        <li><strong>Tableau périodique</strong> : son organisation en périodes, colonnes et blocs, outil pour prévoir les propriétés (§4).</li>
        <li><strong>Électrons de valence</strong> : déterminer, pour les éléments des blocs s et p, le nombre d'électrons de valence d'un atome à partir de la position de l'élément dans le tableau périodique (§5).</li>
        <li><strong>Règle de l'octet</strong> et ions monoatomiques usuels ; nombre de liaisons d'un atome, préalable au schéma de Lewis (§6, §7).</li>
        <li><strong>Ordres de grandeur</strong> : citer les longueurs et énergies des liaisons covalentes (§7).</li>
        <li><strong>Électronégativité</strong> : comparer les électronégativités de deux atomes à partir de données ou de leurs positions dans le tableau ; prévoir la polarisation d'une liaison (§8).</li>
        <li><strong>Métaux</strong> : positionner dans le tableau et reconnaître les métaux et les non-métaux (§9).</li>
        <li><strong>Oxydants et réducteurs</strong> : relier la position d'un élément au caractère oxydant ou réducteur du corps simple correspondant ; prévoir les nombres d'oxydation extrêmes d'un élément à partir de sa position (§9, §10).</li>
      </ul>
      <p>Hors programme en PTSI (et en PT) : l'introduction au monde quantique, les nombres quantiques, les règles de remplissage au-delà de l'argon (Pauli, Klechkowski, Hund) et leurs exceptions, l'énergie d'ionisation. Ces notions, utiles pour comprendre d'où vient la forme du tableau, sont regroupées en fin de chapitre. La géométrie des molécules est fournie par les énoncés (chapitre « Structure des molécules »).</p>

<div class="course-section">
  <div class="sec-num">§1 · L'ATOME : NOYAU ET ÉLECTRONS</div>
  <h2>Un noyau minuscule et massif, des électrons tout autour</h2>
  <div class="intro">Toute la chimie se joue entre les électrons des atomes ; le noyau, lui, fixe l'identité de l'élément et porte presque toute la masse. Cette section rappelle les acquis du lycée et fixe les ordres de grandeur qui reviendront dans tout le chapitre.</div>
  <div class="def-box">
    <strong>Constitution d'un atome.</strong> Un atome est formé d'un <strong>noyau</strong>, qui contient \(Z\) protons et \(N\) neutrons (les <strong>nucléons</strong>), et de \(Z\) <strong>électrons</strong>, ce qui le rend électriquement neutre. On note \(^A_Z\mathrm X\) le nucléide de symbole X, de <strong>numéro atomique</strong> \(Z\) et de <strong>nombre de masse</strong> \(A\) :
    <div class="formula" data-nom="Nombre de masse">$$A = Z + N$$</div>
  </div>
  <div><table>
    <tr><th>particule</th><th>masse</th><th>charge</th></tr>
    <tr><td>proton</td><td>\(1{,}673\times10^{-27}\ \text{kg}\)</td><td>\(+e\)</td></tr>
    <tr><td>neutron</td><td>\(1{,}675\times10^{-27}\ \text{kg}\)</td><td>0</td></tr>
    <tr><td>électron</td><td>\(9{,}109\times10^{-31}\ \text{kg}\)</td><td>\(-e\)</td></tr>
  </table></div>
  <p>La charge élémentaire vaut \(e = 1{,}602\times10^{-19}\ \text{C}\). Un proton pèse 1 836 fois plus qu'un électron : la masse d'un atome est concentrée dans son noyau. Le noyau a un rayon de quelques femtomètres (\(1\ \text{fm} = 10^{-15}\ \text{m}\)), l'atome de l'ordre de \(10^{-10}\ \text{m}\) (50 à 250 pm) : <strong>cent mille fois plus</strong>. Un atome est surtout du vide, occupé par le nuage électronique.</p>
  <div class="method-box"><strong>Exemple — l'atome de fer 56</strong>
    <ol>
      <li>\(^{56}_{26}\mathrm{Fe}\) : 26 protons, \(56 - 26 = 30\) neutrons, 26 électrons.</li>
      <li>Masse du noyau : \( 26\times1{,}673\times10^{-27} + 30\times1{,}675\times10^{-27} \) \( = 9{,}37\times10^{-26}\ \text{kg} \). Les électrons ne représentent que \( 26\times9{,}11\times10^{-31}/9{,}37\times10^{-26} \) \( = 0{,}025\ \% \) de la masse.</li>
      <li>Le rayon du noyau vaut environ \(1{,}2\ \text{fm}\times A^{1/3} = 4{,}6\ \text{fm}\), celui de l'atome 126 pm : rapport \(2{,}7\times10^4\). Masse volumique du noyau : \(m/(\tfrac43\pi r^3) \approx 2\times10^{17}\ \text{kg·m}^{-3}\), contre \(7{,}9\times10^3\ \text{kg·m}^{-3}\) pour le fer massif.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(A\) et la masse molaire. \(A\) est un entier (nombre de nucléons d'un nucléide) ; la masse molaire d'un élément, en g·mol⁻¹, est une moyenne sur ses isotopes et n'est pas entière (§2).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ÉLÉMENTS, ISOTOPES ET MASSE MOLAIRE</div>
  <h2>L'élément chimique est défini par Z</h2>
  <div class="intro">Le numéro atomique, et lui seul, définit l'élément : tous les atomes de chlore ont 17 protons, quel que soit leur nombre de neutrons. La masse molaire qui figure dans le tableau périodique est une moyenne pondérée sur les isotopes naturels.</div>
  <div class="def-box">
    <strong>Élément, isotopes.</strong> Un <strong>élément chimique</strong> est l'ensemble des atomes et des ions de même numéro atomique \(Z\). Deux nucléides de même \(Z\) et de nombres de neutrons différents sont des <strong>isotopes</strong> : ils ont les mêmes propriétés chimiques (même cortège électronique) mais des masses différentes. Un élément se conserve au cours d'une transformation chimique.
  </div>
  <div class="prop-box">
    <strong>Masse molaire atomique.</strong> Si les isotopes \(i\) d'un élément ont pour masses molaires \(M_i\) et pour abondances naturelles (fractions en nombre d'atomes) \(x_i\), avec \(\sum_i x_i = 1\),
    <div class="formula" data-nom="Masse molaire moyenne">$$M = \sum_i x_i\,M_i$$</div>
    Une mole contient \(N_A = 6{,}022\times10^{23}\) entités (constante d'Avogadro, exacte par définition).
  </div>
  <div class="method-box"><strong>Exemple — la masse molaire du chlore</strong>
    <ol>
      <li>Le chlore naturel contient 75,76 % de \(^{35}\mathrm{Cl}\) (\(M = 34{,}969\ \text{g·mol}^{-1}\)) et 24,24 % de \(^{37}\mathrm{Cl}\) (\(36{,}966\ \text{g·mol}^{-1}\)).</li>
      <li>\( M \) \( = 0{,}7576\times34{,}969 + 0{,}2424\times36{,}966 \) \( = 35{,}45\ \text{g·mol}^{-1} \) : la valeur du tableau, loin de tout entier.</li>
      <li>Inversement, connaissant \(M(\mathrm{Cu}) = 63{,}546\) et les isotopes 62,930 et 64,928 g·mol⁻¹, l'abondance \(x\) de \(^{63}\mathrm{Cu}\) vérifie \(62{,}930\,x + 64{,}928\,(1 - x) = 63{,}546\), d'où \(x = 0{,}692\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — combien d'atomes dans un gramme de carbone ?</strong>
    <p>\(n = 1{,}00/12{,}011 = 8{,}33\times10^{-2}\ \text{mol}\), soit \(N = n\,N_A = 5{,}01\times10^{22}\) atomes. Ce nombre gigantesque est la raison d'être de la mole.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ENTITÉS ET ESPÈCES CHIMIQUES</div>
  <h2>Atomes, ions, molécules</h2>
  <div class="intro">Le chimiste décrit la matière à deux échelles : l'entité microscopique (un atome, un ion, une molécule) et l'espèce macroscopique (un très grand nombre d'entités identiques). Savoir compter les protons et les électrons d'une entité est un préalable à tout schéma de Lewis.</div>
  <div class="def-box">
    <strong>Entités chimiques.</strong> Une <strong>molécule</strong> est un assemblage électriquement neutre d'atomes liés (H₂O, CO₂, O₂). Un <strong>ion</strong> porte une charge : <strong>cation</strong> (positif, électrons en défaut) ou <strong>anion</strong> (négatif, électrons en excès) ; il est <strong>monoatomique</strong> (Na⁺, Cl⁻, O²⁻) ou <strong>polyatomique</strong> (SO₄²⁻, NH₄⁺, HO⁻). Une <strong>espèce chimique</strong> est un ensemble d'entités identiques : « l'eau » désigne l'espèce, « une molécule d'eau » l'entité.
  </div>
  <p>Un <strong>corps simple</strong> ne contient qu'un élément (dioxygène O₂, ozone O₃, cuivre Cu, diamant et graphite) ; un <strong>corps composé</strong> en contient plusieurs (H₂O, NaCl). Un même élément peut former plusieurs corps simples : O₂ et O₃, diamant et graphite sont des <strong>variétés allotropiques</strong> (chapitre <a href="#cristallin/cours">« Solides cristallins »</a>).</p>
  <div class="method-box"><strong>Exemple — compter protons et électrons</strong>
    <ol>
      <li>Ion sulfate SO₄²⁻ : protons \(16 + 4\times8 = 48\) ; électrons \(48 + 2 = 50\) (deux électrons en excès pour la charge −2).</li>
      <li>Ion ammonium NH₄⁺ : protons \(7 + 4\times1 = 11\) ; électrons \(11 - 1 = 10\), autant que l'atome de néon.</li>
      <li>Ion aluminium Al³⁺ : 13 protons, 10 électrons, lui aussi avec le cortège du néon (§6).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : changer le nombre de protons pour former un ion. Une réaction chimique ne touche jamais au noyau : un ion se forme par perte ou gain d'électrons, et le nombre de protons reste celui de l'élément.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LE TABLEAU PÉRIODIQUE</div>
  <h2>118 éléments rangés pour que la chimie se lise</h2>
  <div class="intro">Mendeleïev a rangé les éléments connus en 1869 de façon que les propriétés chimiques se répètent périodiquement ; il a même laissé des cases vides pour des éléments à découvrir. Le tableau actuel range les éléments par numéro atomique croissant, en lignes et en colonnes : sa forme dit déjà l'essentiel de la chimie de chaque élément.</div>
  <div class="def-box">
    <strong>Organisation.</strong> Les éléments sont rangés par \(Z\) croissant en 7 lignes, les <strong>périodes</strong>, et 18 <strong>colonnes</strong> (ou groupes), numérotées de 1 à 18. Les éléments d'une même colonne forment une <strong>famille</strong> : ils ont des propriétés chimiques voisines. On distingue quatre <strong>blocs</strong> : s (colonnes 1 et 2, et l'hélium), p (colonnes 13 à 18), d (colonnes 3 à 12, métaux de transition) et f (lanthanides et actinides).
  </div>

<div class="course-section">
  <div class="sec-num">§5 · ÉLECTRONS DE VALENCE DES BLOCS s ET p</div>
  <h2>Les électrons qui font la chimie se lisent sur la colonne</h2>
  <div class="intro">Les électrons d'un atome ne jouent pas tous le même rôle : ceux de la couche externe, les électrons de valence, forment les liaisons et s'échangent dans les réactions ; ceux des couches internes ne participent pas. Le programme demande de déterminer leur nombre d'après la position dans le tableau.</div>
  <div class="def-box">
    <strong>Électrons de cœur et de valence.</strong> Les électrons d'un atome se répartissent en couches successives. Pour un élément des blocs s et p, les <strong>électrons de valence</strong> sont ceux de la couche la plus externe, dont le numéro est celui de la <strong>période</strong> ; les autres sont les <strong>électrons de cœur</strong>.
  </div>
  <div class="prop-box">
    <strong>Nombre d'électrons de valence \(v\) d'après la position.</strong>
    <ul>
      <li>bloc s (colonnes 1 et 2) : \(v\) = numéro de la colonne, soit 1 ou 2 ;</li>
      <li>bloc p (colonnes 13 à 18) : \(v\) = numéro de la colonne moins 10, soit 3 à 8 ;</li>
      <li>exception : l'hélium, en colonne 18, n'a que 2 électrons.</li>
    </ul>
    Les éléments d'une même colonne ont le même nombre d'électrons de valence : c'est pourquoi ils ont des propriétés chimiques voisines.
  </div>
  <p><strong>Rappel du lycée : configuration électronique jusqu'à \(Z = 18\).</strong> Les électrons occupent successivement les sous-couches 1s (2 électrons au plus), 2s (2), 2p (6), 3s (2), 3p (6). Le soufre (\(Z = 16\)) a pour configuration \(1s^2\,2s^2\,2p^6\,3s^2\,3p^4\) : sa couche externe est la couche 3 (période 3) et contient \(2 + 4 = 6\) électrons de valence, ce que donne aussi la colonne 16. Au-delà de l'argon, l'ordre de remplissage se complique (bloc d) : c'est hors programme, et la position dans le tableau suffit.</p>

<div class="course-section">
  <div class="sec-num">§6 · OCTET, DUET ET IONS MONOATOMIQUES</div>
  <h2>La stabilité des gaz nobles</h2>
  <div class="intro">Les gaz nobles ne réagissent presque jamais : leur couche externe est complète. Les autres atomes tendent à acquérir la même structure, en perdant, en gagnant ou en partageant des électrons. Cette règle simple prévoit les ions usuels et la formule des composés ioniques.</div>
  <div class="prop-box">
    <strong>Règles de l'octet et du duet.</strong> Dans les ions et les molécules usuels, les atomes des périodes 2 et 3 tendent à s'entourer de <strong>8 électrons de valence</strong> (octet), comme le néon ou l'argon ; l'hydrogène et le lithium, de <strong>2 électrons</strong> (duet), comme l'hélium. Un atome peut y parvenir en perdant ses électrons de valence (métaux), en gagnant des électrons (non-métaux) ou en partageant des électrons dans des liaisons covalentes (§7).
  </div>
  <div><table>
    <tr><th>colonne</th><th>1</th><th>2</th><th>13</th><th>15</th><th>16</th><th>17</th></tr>
    <tr><td>électrons de valence</td><td>1</td><td>2</td><td>3</td><td>5</td><td>6</td><td>7</td></tr>
    <tr><td>ion usuel</td><td>Li⁺, Na⁺, K⁺</td><td>Mg²⁺, Ca²⁺</td><td>Al³⁺</td><td>N³⁻</td><td>O²⁻, S²⁻</td><td>F⁻, Cl⁻, Br⁻, I⁻</td></tr>
  </table></div>
  <p>Les ions N³⁻, O²⁻, F⁻, Na⁺, Mg²⁺ et Al³⁺ ont tous 10 électrons, comme le néon : ils sont <strong>isoélectroniques</strong>. Un composé ionique est électriquement neutre : sa formule associe les ions dans les proportions qui annulent la charge totale.</p>
  <div class="method-box"><strong>Exemple — prévoir la formule de composés ioniques</strong>
    <ol>
      <li>Oxyde d'aluminium : Al³⁺ et O²⁻ ; il faut \(2\times(+3) + 3\times(-2) = 0\) : Al₂O₃ (l'alumine, ou corindon).</li>
      <li>Chlorure de magnésium : Mg²⁺ et Cl⁻ : MgCl₂. Fluorure de calcium : CaF₂ (la fluorine).</li>
      <li>Nitrure de magnésium : Mg²⁺ et N³⁻ ; \(3\times(+2) + 2\times(-3) = 0\) : Mg₃N₂.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : étendre la règle aux métaux de transition. Le fer donne Fe²⁺ et Fe³⁺, le cuivre Cu⁺ et Cu²⁺, sans configuration de gaz noble : pour le bloc d, les ions se lisent dans les données. La règle de l'octet souffre aussi d'exceptions en chimie moléculaire (bore, éléments de la période 3 et au-delà), étudiées dans « Structure des molécules ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · VALENCE ET LIAISON COVALENTE</div>
  <h2>Combien de liaisons un atome forme-t-il, et quelle est leur force ?</h2>
  <div class="intro">Entre deux non-métaux, aucun ne cède d'électron à l'autre : ils mettent en commun des paires d'électrons, les liaisons covalentes. Le nombre d'électrons qui manquent à un atome pour atteindre l'octet donne le nombre de liaisons qu'il forme, et donc la formule de ses composés les plus simples.</div>
  <div class="def-box">
    <strong>Liaison covalente, doublets.</strong> Une <strong>liaison covalente</strong> est la mise en commun d'une paire d'électrons (un <strong>doublet liant</strong>) entre deux atomes ; chacun en apporte en général un. Les électrons de valence non engagés dans des liaisons forment des <strong>doublets non liants</strong>.
  </div>
  <div class="prop-box">
    <strong>Nombre de liaisons d'un atome (valence).</strong> Un atome d'un non-métal du bloc p, qui a \(v \ge 4\) électrons de valence, forme en général \(8 - v\) liaisons covalentes (pour compléter son octet) et garde \(v - 4\) doublets non liants. L'hydrogène forme une liaison (duet). D'où C : 4 liaisons ; N : 3 liaisons et 1 doublet ; O : 2 liaisons et 2 doublets ; F, Cl : 1 liaison et 3 doublets.
  </div>
  <div class="method-box"><strong>Exemple — formules des composés hydrogénés</strong>
    <ol>
      <li>Période 2 : CH₄, NH₃, H₂O, HF ; période 3 : SiH₄, PH₃, H₂S, HCl. La formule ne dépend que de la colonne.</li>
      <li>Le sélénium (colonne 16) donne donc H₂Se, l'arsenic (colonne 15) AsH₃, le germanium (colonne 14) GeH₄.</li>
      <li>Avec le chlore à la place de l'hydrogène : CCl₄, NCl₃, OCl₂. La construction du schéma de Lewis complet et la géométrie sont l'objet de <a href="#molecules/cours">« Structure des molécules »</a>.</li>
    </ol>
  </div>
  <h3>Ordres de grandeur des liaisons covalentes</h3>
  <p>La <strong>longueur</strong> d'une liaison (distance entre les noyaux) va de 74 pm (H–H) à environ 270 pm (I–I) ; la plupart sont entre 100 et 200 pm. L'<strong>énergie de liaison</strong> est l'énergie à fournir, par mole, pour la rompre en phase gazeuse : de 150 à 950 kJ·mol⁻¹. Une liaison double est plus courte et plus forte qu'une simple, une triple encore plus.</p>

<div class="course-section">
  <div class="sec-num">§8 · ÉLECTRONÉGATIVITÉ ET POLARISATION DES LIAISONS</div>
  <h2>Qui attire le doublet ?</h2>
  <div class="intro">Dans une liaison entre deux atomes différents, le doublet n'est pas partagé équitablement : il est attiré vers l'atome le plus électronégatif. Cette dissymétrie crée des charges partielles, à l'origine de la polarité des molécules, des propriétés des solvants et du caractère ionique de certains composés.</div>
  <div class="def-box">
    <strong>Électronégativité.</strong> L'<strong>électronégativité</strong> \(\chi\) d'un élément traduit l'aptitude de ses atomes à attirer vers eux le doublet d'une liaison covalente. L'échelle la plus utilisée, celle de Pauling, est sans unité : elle va de 0,79 (césium) à 3,98 (fluor).
  </div>
  <div class="prop-box">
    <strong>Évolution dans le tableau.</strong> L'électronégativité <strong>augmente de gauche à droite</strong> le long d'une période et <strong>diminue de haut en bas</strong> dans une colonne (gaz nobles exclus). Le fluor est l'élément le plus électronégatif, suivi de l'oxygène (3,44), du chlore (3,16) et de l'azote (3,04). Les métaux alcalins sont les moins électronégatifs.
  </div>

<figcaption>Électronégativité de Pauling (sans unité) des éléments des colonnes 1, 2 et 13 à 17, périodes 2 (rouge) à 5 (ambre). Elle croît le long d'une période, de gauche à droite, et décroît en descendant une colonne : le fluor (3,98) est le plus électronégatif, les alcalins lourds les moins (césium : 0,79). Remarquer les irrégularités des colonnes 13 et 14 (Ga plus électronégatif que Al) : la règle de position compare sûrement deux éléments d'une même ligne ou d'une même colonne, pas deux éléments en diagonale.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Polarisation d'une liaison.</strong> Si \(\chi_{\mathrm B} \gt \chi_{\mathrm A}\), la liaison A–B est <strong>polarisée</strong> : B porte une charge partielle \(-\delta\) et A une charge \(+\delta\) (\(0 \lt \delta \lt e\)), notées \(\mathrm A^{\delta+}\)–\(\mathrm B^{\delta-}\). Plus l'écart \(\Delta\chi\) est grand, plus la liaison est polarisée ; pour un très grand écart (\(\Delta\chi\) de l'ordre de 2 ou plus), le doublet est pratiquement transféré : la liaison est <strong>ionique</strong> (NaCl : \(\Delta\chi = 2{,}23\)). Les seuils sont des repères, pas des frontières nettes.
  </div>
  <div class="method-box"><strong>Exemple — comparer et classer</strong>
    <ol>
      <li>Sans données : O ou N ? Même période, O est plus à droite : \(\chi_{\mathrm O} \gt \chi_{\mathrm N}\). Cl ou Br ? Même colonne, Cl est au-dessus : \(\chi_{\mathrm{Cl}} \gt \chi_{\mathrm{Br}}\). C ou S ? Ni même ligne ni même colonne : la position ne permet pas de conclure (2,55 et 2,58, pratiquement égales).</li>
      <li>Avec les données de Pauling, écarts : C–H 0,35 (peu polarisée), C–Cl 0,61, C–O 0,89, O–H 1,24, H–F 1,78, Na–Cl 2,23 (ionique).</li>
      <li>Polarités : \(\mathrm{C}^{\delta-}\)–\(\mathrm{H}^{\delta+}\) (faiblement), \(\mathrm{O}^{\delta-}\)–\(\mathrm{H}^{\delta+}\), \(\mathrm{H}^{\delta+}\)–\(\mathrm{F}^{\delta-}\). La polarité d'une molécule entière dépend en plus de sa géométrie (chapitre « Structure des molécules »).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la règle de position en diagonale. Comparer C et S, N et Cl, ou Al et Ga d'après leurs positions est impossible ou trompeur (\(\chi_{\mathrm{Ga}} = 1{,}81 \gt \chi_{\mathrm{Al}} = 1{,}61\), contrairement à la tendance de colonne) : il faut les valeurs.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · MÉTAUX, NON-MÉTAUX, OXYDANTS ET RÉDUCTEURS</div>
  <h2>Ce que la position dit des corps simples</h2>
  <div class="intro">Plus des trois quarts des éléments sont des métaux. Leur place dans le tableau, à gauche et peu électronégatifs, annonce leur chimie : ils cèdent facilement des électrons. Les non-métaux de droite, très électronégatifs, en captent. C'est la base de l'oxydoréduction.</div>
  <div class="prop-box">
    <strong>Métaux et non-métaux.</strong> Les <strong>métaux</strong> occupent la gauche et le centre du tableau (blocs s sauf H, d, f, et le bas du bloc p : Al, Ga, In, Sn, Pb…). Les <strong>non-métaux</strong> sont en haut à droite (H, C, N, O, F, P, S, Cl, Se, Br, I, et les gaz nobles). Une diagonale de <strong>semi-métaux</strong> (B, Si, Ge, As, Sb, Te) les sépare. Les métaux conduisent l'électricité, sont brillants et ductiles (chapitre <a href="#cristallin/cours">« Solides cristallins »</a>).
  </div>

</figure>
  <div class="prop-box">
    <strong>Caractère oxydant ou réducteur des corps simples.</strong> Un réducteur cède des électrons, un oxydant en capte (chapitre <a href="#oxred/cours">« Oxydoréduction »</a>).
    <ul>
      <li>Les <strong>métaux</strong>, peu électronégatifs, donnent des corps simples <strong>réducteurs</strong> : ils s'oxydent en cations. Les alcalins sont des réducteurs très puissants, qui réduisent l'eau à froid.</li>
      <li>Les <strong>non-métaux</strong> très électronégatifs de la droite du tableau donnent des corps simples <strong>oxydants</strong> : O₂ et les dihalogènes, réduits en anions O²⁻ (ou H₂O) et X⁻. Chez les halogènes, le pouvoir oxydant diminue en descendant la colonne : F₂ &gt; Cl₂ &gt; Br₂ &gt; I₂.</li>
      <li>Les gaz nobles ne sont ni oxydants ni réducteurs dans les conditions usuelles.</li>
    </ul>
  </div>
  <div class="method-box"><strong>Exemple — interpréter des expériences</strong>
    <ol>
      <li>Un petit morceau de sodium posé sur l'eau s'agite, s'enflamme et dégage du dihydrogène : 2 Na + 2 H₂O = 2 Na⁺ + 2 HO⁻ + H₂. Le sodium, alcalin, est réducteur.</li>
      <li>De l'eau de chlore ajoutée à une solution de bromure de potassium la colore en orange : Cl₂ + 2 Br⁻ = 2 Cl⁻ + Br₂. Le dichlore, plus haut dans la colonne, oxyde les ions bromure.</li>
      <li>Le diiode n'oxyde pas les ions chlorure : I₂ est un oxydant plus faible que Cl₂. On lit donc l'ordre des pouvoirs oxydants sur la colonne 17.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dire qu'un « élément » est oxydant. C'est le <strong>corps simple</strong> (Cl₂, Na) qui l'est : l'ion chlorure Cl⁻, du même élément, est au contraire un réducteur (très faible), et l'ion Na⁺ ne réduit rien.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · NOMBRES D'OXYDATION EXTRÊMES</div>
  <h2>Du plus réduit au plus oxydé</h2>
  <div class="intro">Le nombre d'oxydation (n.o.) compte les électrons qu'un atome a « perdus » ou « gagnés » dans une espèce, en attribuant chaque doublet de liaison à l'atome le plus électronégatif (définition et calcul : chapitre « Oxydoréduction »). Ses valeurs extrêmes se lisent sur la position de l'élément.</div>
  <div class="prop-box">
    <strong>Nombres d'oxydation extrêmes.</strong> Pour un élément des blocs s et p, de \(v\) électrons de valence :
    <ul>
      <li><strong>n.o. maximal</strong> : \(+v\), quand l'atome a perdu tous ses électrons de valence (sauf O et F, trop électronégatifs pour l'atteindre) ;</li>
      <li><strong>n.o. minimal</strong> : \(v - 8\) pour un non-métal, quand l'atome a complété son octet ; 0 pour un métal, qui ne forme pas d'anion.</li>
    </ul>
  </div>

</figure>
  <div class="method-box"><strong>Exemple — l'azote, le soufre et le chlore</strong>
    <ol>
      <li>Azote, colonne 15 (\(v = 5\)) : de −III (NH₃, NH₄⁺) à +V (NO₃⁻, HNO₃).</li>
      <li>Soufre, colonne 16 (\(v = 6\)) : de −II (H₂S) à +VI (SO₄²⁻) ; entre les deux, +IV dans SO₂ et, en moyenne, +II dans l'ion thiosulfate S₂O₃²⁻.</li>
      <li>Chlore, colonne 17 (\(v = 7\)) : de −I (Cl⁻) à +VII (ClO₄⁻) ; +I dans l'ion hypochlorite ClO⁻ de l'eau de Javel. Vérification dans ClO₄⁻ : \(x + 4\times(-2) = -1\) donne \(x = +7\).</li>
    </ol>
  </div>
  <p>Une espèce où l'élément est à son n.o. maximal ne peut qu'être réduite : elle ne peut être qu'oxydante (ClO₄⁻, NO₃⁻ en milieu acide, MnO₄⁻ où le manganèse, en colonne 7 du bloc d, atteint +VII). Une espèce au n.o. minimal ne peut être que réductrice (H₂S, I⁻). Une espèce intermédiaire peut être l'une ou l'autre : le peroxyde d'hydrogène H₂O₂, où l'oxygène est à −I entre −II et 0, est à la fois oxydant et réducteur.</p>
  <div class="notice"><strong>Erreur classique</strong> : attribuer +VI ou +II à l'oxygène. L'oxygène est à −II dans presque tous ses composés (−I dans les peroxydes, positif seulement face au fluor), et le fluor toujours à −I : leur n.o. maximal ne vaut pas \(+v\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · STRUCTURE ÉLECTRONIQUE DES ATOMES</div>
  <h2>Hors programme en PTSI : d'où vient la forme du tableau</h2>
  <div class="intro">Hors programme en PTSI (pour aller plus loin) : ni la description quantique de l'atome, ni les règles de remplissage au-delà de l'argon ne sont au programme de PTSI ou de PT. Elles expliquent pourtant la forme du tableau, la longueur des périodes et les irrégularités rencontrées plus haut.</div>
  <h3>États quantiques d'un électron</h3>
  <p>L'énergie d'un électron dans un atome est <strong>quantifiée</strong> : elle ne prend que certaines valeurs (pour l'hydrogène, \(E_n = -13{,}6\ \text{eV}/n^2\), d'où son spectre de raies). Chaque état d'un électron est décrit par quatre nombres quantiques : \(n \ge 1\) (couche), \(\ell\) de 0 à \(n - 1\) (sous-couche, notée s, p, d, f pour \(\ell = 0, 1, 2, 3\)), \(m_\ell\) de \(-\ell\) à \(\ell\) (orbitale, \(2\ell + 1\) valeurs) et \(m_s = \pm\tfrac12\) (spin). Une sous-couche contient au plus \(2(2\ell + 1)\) électrons : 2, 6, 10, 14 ; une couche, \(2n^2\).</p>
  <h3>Règles de remplissage</h3>
  <ul>
    <li><strong>Principe de Pauli</strong> : deux électrons d'un atome ne peuvent avoir leurs quatre nombres quantiques égaux ; une orbitale contient au plus deux électrons, de spins opposés.</li>
    <li><strong>Règle de Klechkowski</strong> : les sous-couches se remplissent par \(n + \ell\) croissant, et à \(n + \ell\) égal par \(n\) croissant : 1s, 2s, 2p, 3s, 3p, <strong>4s, 3d</strong>, 4p, 5s, 4d, 5p, 6s, 4f, 5d, 6p…</li>
    <li><strong>Règle de Hund</strong> : dans une sous-couche, les électrons occupent le plus d'orbitales possible, avec des spins parallèles, avant de s'apparier.</li>
  </ul>
  <p>Les blocs du tableau correspondent à la sous-couche en cours de remplissage (s, p, d, f) ; les longueurs des périodes 2, 8, 8, 18, 18, 32, 32 en découlent. Exemple : le fer (\(Z = 26\)) a pour configuration \([\mathrm{Ar}]\,3d^6\,4s^2\). Quelques éléments font exception, comme le chrome \([\mathrm{Ar}]\,3d^5\,4s^1\) et le cuivre \([\mathrm{Ar}]\,3d^{10}\,4s^1\) (sous-couche d à moitié remplie ou pleine).</p>
  <h3>Énergie d'ionisation et rayon atomique</h3>
  <p>L'<strong>énergie de première ionisation</strong> est l'énergie à fournir pour arracher un électron à l'atome isolé. Elle croît le long d'une période (les électrons de valence sont de plus en plus retenus par un noyau plus chargé) et chute à chaque début de période ; elle diminue en descendant une colonne. Le <strong>rayon atomique</strong> évolue en sens inverse : il diminue le long d'une période et augmente vers le bas. Ces deux tendances rejoignent celle de l'électronégativité.</p>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ARCHITECTURE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent ce que le programme de PTSI demande de lire dans le tableau périodique : composition des atomes et des ions, électrons de valence des blocs s et p, ions usuels, nombre de liaisons, électronégativité et polarité, caractère métallique, oxydant ou réducteur, nombres d'oxydation extrêmes, ordres de grandeur. Aucune ne demande de configuration électronique au-delà de l'argon.</div>

  <div class="method-box"><strong>Méthode 1 — Déterminer la composition d'un atome ou d'un ion</strong>
    <ol>
      <li><span class="step">Noyau.</span> Lire \(Z\) (protons) et \(A\) (nucléons) dans \(^A_Z\mathrm X\) ; \(N = A - Z\) neutrons. \(Z\) seul fixe l'élément.</li>
      <li><span class="step">Électrons.</span> Atome : \(Z\) électrons. Ion de charge \(q\) (en unités de \(e\)) : \(Z - q\) électrons (moins pour un cation, plus pour un anion).</li>
      <li><span class="step">Ion polyatomique.</span> Additionner les \(Z\) des atomes, puis retrancher la charge.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(^{32}_{16}\mathrm S^{2-}\) : 16 protons, 16 neutrons, 18 électrons. HO⁻ : \(8 + 1 = 9\) protons, 10 électrons.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Relier masse molaire et abondances isotopiques</strong>
    <ol>
      <li><span class="step">Moyenne pondérée.</span> \(M = \sum_i x_iM_i\), avec les abondances \(x_i\) en fractions (somme 1).</li>
      <li><span class="step">Problème inverse</span> (deux isotopes) : écrire \(M = xM_1 + (1 - x)M_2\) et résoudre en \(x\).</li>
      <li><span class="step">Contrôle.</span> \(M\) est comprise entre les masses des isotopes, plus proche de l'isotope le plus abondant.</li>
    </ol>
    <p><em>Exemple éclair :</em> bore, 19,9 % de \(^{10}\mathrm B\) (10,013 g·mol⁻¹) et 80,1 % de \(^{11}\mathrm B\) (11,009 g·mol⁻¹) : \(M = 0{,}199\times10{,}013 + 0{,}801\times11{,}009 = 10{,}81\ \text{g·mol}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Situer un élément dans le tableau</strong>
    <ol>
      <li><span class="step">Période.</span> Repérer les gaz nobles : \(Z\) = 2, 10, 18, 36, 54, 86. La période d'un élément est celle qui suit le dernier gaz noble de \(Z\) strictement inférieur (période 1 si \(Z \le 2\)).</li>
      <li><span class="step">Colonne.</span> Compter le rang \(r\) dans la période. Périodes 4 et 5 : colonne \(r\). Périodes 2 et 3 (pas de bloc d) : colonne \(r\) si \(r \le 2\), \(r + 10\) sinon.</li>
      <li><span class="step">Bloc et famille.</span> En déduire le bloc (s, p, d) et, le cas échéant, la famille.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(Z = 15\) : après le néon (10), période 3, rang 5, donc colonne 15 : le phosphore, sous l'azote. \(Z = 38\) : après le krypton (36), période 5, rang 2 : colonne 2, le strontium, un alcalino-terreux.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Déterminer le nombre d'électrons de valence (blocs s et p)</strong>
    <ol>
      <li><span class="step">Position.</span> Situer l'élément (méthode 3) et vérifier qu'il est dans le bloc s ou p.</li>
      <li><span class="step">Colonne.</span> Bloc s : \(v\) = numéro de colonne ; bloc p : \(v\) = numéro de colonne − 10 ; hélium : 2.</li>
      <li><span class="step">Contrôle</span> (si \(Z \le 18\)) par la configuration électronique du lycée : électrons de la couche dont le numéro est celui de la période.</li>
    </ol>
    <p><em>Exemple éclair :</em> l'arsenic (période 4, colonne 15) a \(v = 5\) électrons de valence, comme l'azote et le phosphore ; le calcium (colonne 2) en a 2.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer « colonne − 10 » au bloc d (fer, cuivre) : la méthode ne vaut que pour les blocs s et p.</div>

  <div class="method-box"><strong>Méthode 5 — Prévoir l'ion monoatomique stable et la formule d'un composé ionique</strong>
    <ol>
      <li><span class="step">Électrons de valence</span> \(v\) (méthode 4).</li>
      <li><span class="step">Ion.</span> Métal des colonnes 1, 2, 13 : il perd ses \(v\) électrons (cation de charge \(+v\)). Non-métal des colonnes 15 à 17 : il en gagne \(8 - v\) (anion de charge \(v - 8\)). Dans les deux cas, l'ion a la structure du gaz noble voisin.</li>
      <li><span class="step">Formule.</span> Associer cations et anions pour que la charge totale soit nulle (plus petits entiers).</li>
    </ol>
    <p><em>Exemple éclair :</em> potassium (colonne 1) et soufre (colonne 16) : K⁺ et S²⁻, d'où K₂S. Aluminium et fluor : Al³⁺ et F⁻, d'où AlF₃.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Prévoir le nombre de liaisons covalentes d'un atome</strong>
    <ol>
      <li><span class="step">Valence.</span> Pour un non-métal de \(v \ge 4\) électrons de valence : \(8 - v\) liaisons et \(v - 4\) doublets non liants ; hydrogène : 1 liaison.</li>
      <li><span class="step">Formule.</span> Écrire la formule la plus simple avec l'hydrogène ou le chlore : C → CH₄, N → NH₃, O → H₂O, halogène X → HX.</li>
      <li><span class="step">Schéma de Lewis.</span> Le construire avec la méthode du chapitre « Structure des molécules » (décompte total des électrons de valence, doublets, octets, écarts éventuels).</li>
    </ol>
    <p><em>Exemple éclair :</em> le silicium (colonne 14) forme 4 liaisons : SiCl₄ ; le phosphore (colonne 15), 3 liaisons et 1 doublet : PH₃.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Comparer deux électronégativités et prévoir la polarisation d'une liaison</strong>
    <ol>
      <li><span class="step">Sans données.</span> Même période : le plus à droite est le plus électronégatif. Même colonne : le plus haut. Ni l'un ni l'autre : on ne peut pas conclure sans valeurs.</li>
      <li><span class="step">Avec données.</span> Calculer \(\Delta\chi = |\chi_{\mathrm A} - \chi_{\mathrm B}|\).</li>
      <li><span class="step">Polarisation.</span> \(\delta-\) sur l'atome le plus électronégatif, \(\delta+\) sur l'autre ; liaison peu polarisée si \(\Delta\chi\) est petit (C–H : 0,35), à caractère ionique dominant si \(\Delta\chi\) dépasse 2 environ.</li>
    </ol>
    <p><em>Exemple éclair :</em> H–Cl : \(\Delta\chi = 3{,}16 - 2{,}20 = 0{,}96\), liaison polarisée \(\mathrm H^{\delta+}\)–\(\mathrm{Cl}^{\delta-}\) ; H–I : \(\Delta\chi = 0{,}46\), beaucoup moins polarisée.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Prévoir le caractère métallique, oxydant ou réducteur d'un corps simple</strong>
    <ol>
      <li><span class="step">Situer</span> l'élément : à gauche ou en bas de la diagonale B–Si–Ge–As–Sb–Te, c'est un métal ; en haut à droite, un non-métal ; colonne 18, un gaz noble.</li>
      <li><span class="step">Corps simple.</span> Métal : réducteur (il s'oxyde en cation), d'autant plus fort qu'il est à gauche (alcalins). Non-métal très électronégatif (O₂, dihalogènes) : oxydant, d'autant plus fort qu'il est haut dans sa colonne.</li>
      <li><span class="step">Écrire</span> la réaction attendue avec l'eau ou un ion d'un autre élément, et vérifier l'équilibrage des charges.</li>
    </ol>
    <p><em>Exemple éclair :</em> le dibrome oxyde les ions iodure (Br₂ + 2 I⁻ = 2 Br⁻ + I₂) mais pas les ions chlorure : le brome est entre le chlore et l'iode dans la colonne 17.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Prévoir les nombres d'oxydation extrêmes d'un élément</strong>
    <ol>
      <li><span class="step">Électrons de valence</span> \(v\) (méthode 4).</li>
      <li><span class="step">Extrêmes.</span> Maximum \(+v\) ; minimum \(v - 8\) pour un non-métal, 0 pour un métal. Exceptions : O (−II usuel, −I dans les peroxydes) et F (−I).</li>
      <li><span class="step">Exemples</span> : chercher une espèce à chaque extrême (hydrure ou anion pour le minimum, oxyde ou oxoanion pour le maximum) et vérifier par le calcul du n.o. (chapitre « Oxydoréduction »).</li>
    </ol>
    <p><em>Exemple éclair :</em> phosphore (\(v = 5\)) : de −III (PH₃) à +V (H₃PO₄, PO₄³⁻ : \(x + 4\times(-2) = -3\), \(x = +5\)).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un élément à son n.o. maximal ne peut qu'être réduit. Un ion comme ClO₄⁻ ou NO₃⁻ ne peut donc jouer que le rôle d'oxydant ; H₂S ou I⁻, que celui de réducteur.</div>

  <div class="method-box"><strong>Méthode 10 — Exploiter un ordre de grandeur à l'échelle atomique</strong>
    <ol>
      <li><span class="step">Par entité.</span> Diviser une énergie molaire par \(N_A\) ; convertir en électronvolts (\(1\ \text{eV} = 1{,}602\times10^{-19}\ \text{J}\)).</li>
      <li><span class="step">Comparer</span> à l'énergie d'agitation thermique \(RT\) (2,5 kJ·mol⁻¹ à 25 °C) ou à l'énergie d'un photon \(hc/\lambda\).</li>
      <li><span class="step">Tailles.</span> Atome et liaison : \(10^{-10}\ \text{m}\) ; noyau : \(10^{-15}\ \text{m}\) ; liaisons covalentes de 100 à 200 pm, de 150 à 950 kJ·mol⁻¹.</li>
    </ol>
    <p><em>Exemple éclair :</em> C–C (348 kJ·mol⁻¹) : \(5{,}78\times10^{-19}\ \text{J}\) par liaison, soit 3,6 eV ; un photon de 344 nm suffit à la rompre, 140 fois \(RT\) à 25 °C.</p>
  </div>
</div>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> C (\(v = 4\)) : −IV à +IV ; N (5) : −III à +V ; P (5) : −III à +V ; S (6) : −II à +VI ; Cl (7) : −I à +VII.</p>
    <p><strong>Q2.</strong> La somme des n.o. vaut la charge. CH₄ : −IV ; CO : +II ; CO₂ : +IV ; NH₃ : −III ; NO₂ : +IV ; HNO₃ : \(1 + x - 6 = 0\), +V ; H₃PO₄ : +V ; SO₂ : +IV ; H₂SO₄ : +VI ; S₂O₃²⁻ : \(2x - 6 = -2\), \(x = +2\) en moyenne ; HClO : +I ; ClO₃⁻ : +V ; ClO₄⁻ : +VII. Tous sont entre les extrêmes.</p>
    <p><strong>Q3.</strong> Au n.o. maximal, l'élément ne peut que gagner des électrons : CO₂, HNO₃, H₃PO₄, H₂SO₄, ClO₄⁻ ne peuvent être qu'oxydants (en pratique, CO₂ et H₃PO₄ le sont très peu). Au n.o. minimal : CH₄ et NH₃ ne peuvent être que réducteurs. Les autres (CO, NO₂, SO₂, S₂O₃²⁻, HClO, ClO₃⁻) peuvent être l'un ou l'autre selon le partenaire.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Ordres de grandeur : atome, noyau, liaisons et lumière</h3>
  <div class="statement">Données : rayon de l'atome d'hydrogène 52,9 pm ; rayon du proton 0,84 fm ; \(N_A = 6{,}022\times10^{23}\ \text{mol}^{-1}\) ; \(h = 6{,}63\times10^{-34}\ \text{J·s}\) ; \(c = 3{,}00\times10^8\ \text{m·s}^{-1}\) ; \( 1\ \text{eV} \) \( = 1{,}602\times10^{-19}\ \text{J} \) ; \( R \) \( = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1} \). Énergies de liaison (kJ·mol⁻¹) : Cl–Cl 243 ; C–H 413 ; H–I 298.</div>
  <div class="q"><strong>Q1.</strong> Si le noyau d'hydrogène avait le rayon d'une bille de 1 cm, quel serait le rayon de l'atome ?</div>
  <div class="q"><strong>Q2.</strong> Calculer l'énergie d'une liaison Cl–Cl, C–H et H–I (en J et en eV), puis la longueur d'onde du photon de même énergie. Dans quel domaine se trouve chacune ?</div>
  <div class="q"><strong>Q3.</strong> Pourquoi le dichlore réagit-il à la lumière du jour, alors que les molécules organiques résistent à la lumière visible mais sont abîmées par les ultraviolets ? Pourquoi conserve-t-on l'iodure d'hydrogène à l'abri de la lumière ?</div>
  <div class="q"><strong>Q4.</strong> Comparer l'énergie d'une liaison C–H à l'énergie d'agitation thermique \(RT\) à 25 °C.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rapport des rayons : \( 52{,}9\times10^{-12}/0{,}84\times10^{-15} \) \( = 6{,}3\times10^4 \). Une bille de 1 cm de rayon donnerait un atome de 630 m de rayon : un stade entier autour d'une bille.</p>
    <p><strong>Q2.</strong> \(E = E_{\text{mol}}/N_A\), puis \(\lambda = hc/E\). Cl–Cl : \(4{,}04\times10^{-19}\ \text{J}\), 2,52 eV, 492 nm (visible, bleu). C–H : \(6{,}86\times10^{-19}\ \text{J}\), 4,28 eV, 290 nm (ultraviolet). H–I : \(4{,}95\times10^{-19}\ \text{J}\), 3,09 eV, 401 nm (limite du violet).</p>
    <p><strong>Q3.</strong> Un photon ne peut rompre une liaison que s'il apporte au moins son énergie, donc si sa longueur d'onde est assez courte. La lumière visible (400 à 800 nm) suffit pour Cl–Cl (492 nm), pas pour C–H (290 nm), que seuls les ultraviolets rompent : d'où l'effet du soleil sur les plastiques et la peau. Pour H–I, la lumière violette et proche ultraviolette suffit : HI se décompose à la lumière.</p>
    <p><strong>Q4.</strong> \( RT = 8{,}314\times298 \) \( = 2{,}48\ \text{kJ·mol}^{-1} \) ; \(413/2{,}48 = 167\). L'agitation thermique est bien trop faible pour casser une liaison covalente à température ambiante : les molécules organiques sont stables tant qu'on ne les chauffe pas fortement.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Les halogènes, du fluor à l'iode</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>tableau périodique, isotopes, électrons de valence, électronégativité, oxydants et nombres d'oxydation</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">Les halogènes F (\(Z = 9\)), Cl (17), Br (35) et I (53) sont des éléments très réactifs, présents dans l'eau de mer sous forme d'ions halogénure. Données : isotopes du chlore \(^{35}\mathrm{Cl}\) (75,76 %, \(34{,}969\ \text{g·mol}^{-1}\)) et \(^{37}\mathrm{Cl}\) (24,24 %, \(36{,}966\ \text{g·mol}^{-1}\)) ; électronégativités de Pauling : H 2,20 ; F 3,98 ; Cl 3,16 ; Br 2,96 ; I 2,66 ; longueurs (pm) et énergies (kJ·mol⁻¹) des liaisons H–X : H–F 92 et 568 ; H–Cl 127 et 432 ; H–Br 141 et 366 ; H–I 161 et 298 ; \(N_A = 6{,}022\times10^{23}\ \text{mol}^{-1}\), \(h = 6{,}63\times10^{-34}\ \text{J·s}\), \(c = 3{,}00\times10^8\ \text{m·s}^{-1}\). À 25 °C, F₂ et Cl₂ sont gazeux, Br₂ liquide, I₂ solide.</div>
  <p class="exo-part">Partie A — Position et isotopes</p>
  <div class="q"><strong>A1.</strong> Situer les quatre halogènes dans le tableau (période, colonne) et donner leur nombre d'électrons de valence. Représenter l'atome de chlore selon Lewis.</div>
  <div class="q"><strong>A2.</strong> Calculer la masse molaire du chlore.</div>
  <div class="q"><strong>A3.</strong> Un spectromètre de masse sépare les molécules Cl₂ selon leur masse. Quelles masses (en unités de nombre de masse) observe-t-on, et dans quelles proportions ?</div>
  <p class="exo-part">Partie B — Les liaisons H–X</p>
  <div class="q"><strong>B1.</strong> Combien de liaisons et de doublets non liants l'atome d'halogène a-t-il dans H–X ? Classer les liaisons H–X par polarisation décroissante et indiquer les charges partielles.</div>
  <div class="q"><strong>B2.</strong> Interpréter l'évolution des longueurs et des énergies de liaison dans la série.</div>
  <div class="q"><strong>B3.</strong> Quelle est la plus grande longueur d'onde capable de rompre une liaison H–I ? Conclure sur la conservation de l'iodure d'hydrogène.</div>
  <p class="exo-part">Partie C — Pouvoir oxydant</p>
  <div class="q"><strong>C1.</strong> Les dihalogènes sont-ils des oxydants ou des réducteurs ? Comment leur pouvoir varie-t-il dans la colonne ? Écrire la réaction du dichlore sur les ions bromure.</div>
  <div class="q"><strong>C2.</strong> Les états physiques des dihalogènes à 25 °C changent dans la colonne. Pourquoi ? (On pourra s'appuyer sur le chapitre « Structure des molécules ».)</div>
  <p class="exo-part">Partie D — Nombres d'oxydation et eau de Javel</p>
  <div class="q"><strong>D1.</strong> Prévoir les nombres d'oxydation extrêmes du chlore et donner une espèce pour chacun. Pourquoi le fluor ne présente-t-il que les n.o. 0 et −I ?</div>
  <div class="q"><strong>D2.</strong> L'eau de Javel se prépare par action du dichlore sur la soude : Cl₂ + 2 HO⁻ = Cl⁻ + ClO⁻ + H₂O. Donner le n.o. du chlore dans chaque espèce et caractériser cette réaction.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Tous en colonne 17, avec 7 électrons de valence ; F en période 2, Cl en 3, Br en 4, I en 5. Lewis : le symbole Cl entouré de trois doublets (traits) et d'un électron célibataire (point).</p>
    <p><strong>A2.</strong> \( M \) \( = 0{,}7576\times34{,}969 + 0{,}2424\times36{,}966 \) \( = 35{,}45\ \text{g·mol}^{-1} \).</p>
    <p><strong>A3.</strong> Trois molécules : ³⁵Cl–³⁵Cl (70), ³⁵Cl–³⁷Cl (72), ³⁷Cl–³⁷Cl (74). Les deux atomes étant tirés indépendamment : \(p_{70} = 0{,}7576^2 = 0{,}574\), \( p_{72} \) \( = 2\times0{,}7576\times0{,}2424 \) \( = 0{,}367 \) (deux ordres possibles), \(p_{74} = 0{,}2424^2 = 0{,}059\). Rapports des pics : 9,8 : 6,2 : 1 environ.</p>
    <p><strong>B1.</strong> Une liaison et trois doublets non liants (\(8 - 7 = 1\)). \(\Delta\chi\) : H–F 1,78 ; H–Cl 0,96 ; H–Br 0,76 ; H–I 0,46 : polarisation décroissante de HF à HI, avec \(\mathrm H^{\delta+}\)–\(\mathrm X^{\delta-}\) dans tous les cas (X plus électronégatif que H).</p>
    <p><strong>B2.</strong> En descendant la colonne, l'atome d'halogène a une couche de plus : il est plus gros, la liaison est plus longue (92 à 161 pm) et plus faible (568 à 298 kJ·mol⁻¹), le doublet liant étant plus loin du noyau de X.</p>
    <p><strong>B3.</strong> \( E \) \( = 298\times10^3/6{,}022\times10^{23} \) \( = 4{,}95\times10^{-19}\ \text{J} \) ; \(\lambda_{\max} = hc/E = 401\ \text{nm}\). Toute lumière de longueur d'onde inférieure (violet, ultraviolet du soleil) peut couper H–I : on le conserve à l'abri de la lumière, dans un flacon brun.</p>
    <p><strong>C1.</strong> Éléments très électronégatifs, ils captent des électrons : les dihalogènes sont des oxydants (réduits en X⁻). Le pouvoir oxydant diminue en descendant la colonne : F₂ &gt; Cl₂ &gt; Br₂ &gt; I₂. Cl₂ + 2 Br⁻ = 2 Cl⁻ + Br₂.</p>
    <p><strong>C2.</strong> Les molécules X₂ sont apolaires ; elles ne sont liées entre elles que par des interactions de van der Waals (de London), d'autant plus fortes que la molécule est grosse et riche en électrons. Ces interactions croissent de F₂ à I₂ : les températures de changement d'état augmentent, d'où gaz, gaz, liquide, solide.</p>
    <p><strong>D1.</strong> \(v = 7\) : de −I (Cl⁻, HCl) à +VII (ClO₄⁻). Le fluor est l'élément le plus électronégatif : dans tous ses composés, il attire les doublets de liaison, et n'est jamais à un n.o. positif ; il est −I dans ses composés et 0 dans F₂.</p>
    <p><strong>D2.</strong> Cl₂ : 0 ; Cl⁻ : −I ; ClO⁻ : \(x - 2 = -1\), donc +I. Le chlore passe de 0 à la fois à −I et à +I : la même espèce est réduite et oxydée, c'est une <strong>dismutation</strong> (chapitre « Oxydoréduction »).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 13</span><span class="diff">★ ★ ★</span>
  <h3>Nombres quantiques et énergies d'ionisation successives (hors programme, pour aller plus loin)</h3>
  <div class="statement">On s'appuie sur la fin du cours (« Pour aller plus loin »). On étudie le remplissage des couches électroniques et ce qu'en révèlent les énergies d'ionisation successives.</div>
  <p class="exo-part">Partie A — Dénombrement des états</p>
  <div class="q"><strong>A1.</strong> Rappeler les domaines de variation des quatre nombres quantiques \((n, \ell, m_\ell, m_s)\). Montrer que le nombre d'orbitales d'une couche de nombre \(n\) vaut \(n^2\), et le nombre maximal d'électrons \(2n^2\).</div>
  <div class="q"><strong>A2.</strong> Détailler ce décompte pour la couche \(n = 4\).</div>
  <p class="exo-part">Partie B — Identifier un élément par ses énergies d'ionisation</p>
  <div class="q"><strong>B1.</strong> Pour un élément X de la 3ᵉ période, on mesure les énergies d'ionisation successives (en kJ·mol⁻¹) : \(E_{i1} = 738\), \(E_{i2} = 1\,451\), \(E_{i3} = 7\,733\), \(E_{i4} = 10\,540\). Interpréter le saut entre \(E_{i2}\) et \(E_{i3}\). En déduire le nombre d'électrons de valence, la colonne, puis identifier X.</div>
  <div class="q"><strong>B2.</strong> Justifier que \(E_{i3}\) soit environ cinq fois plus grande que \(E_{i2}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(n \in \mathbb{N}^*\) ; \(\ell \in \{0, 1, \dots, n-1\}\) ; \(m_\ell \in \{-\ell, \dots, +\ell\}\) (\(2\ell + 1\) valeurs) ; \(m_s = \pm\tfrac12\). Nombre d'orbitales pour \(n\) fixé : \(\sum_{\ell=0}^{n-1}(2\ell + 1) = n^2\) (somme des \(n\) premiers entiers impairs). Chaque orbitale accueille 2 électrons (Pauli) : au plus \(2n^2\) électrons.</p>
    <p><strong>A2.</strong> \(n = 4\) : sous-couches 4s, 4p, 4d, 4f, soit \(1 + 3 + 5 + 7 = 16 = 4^2\) orbitales et 32 électrons.</p>
    <p><strong>B1.</strong> \(E_{i1}\) et \(E_{i2}\) sont modérées, puis \(E_{i3}\) est cinq fois plus grande : le 3ᵉ électron vient d'une couche interne, bien plus liée. X a donc 2 électrons de valence : colonne 2. En 3ᵉ période, c'est le magnésium Mg (\(Z = 12\)), \([\mathrm{Ne}]\,3s^2\).</p>
    <p><strong>B2.</strong> Après le départ des deux électrons 3s, l'ion Mg²⁺ a la structure du néon : le 3ᵉ électron est arraché à la sous-couche 2p, bien plus proche du noyau et moins écrantée. Il faut beaucoup plus d'énergie : \(7\,733/1\,451 = 5{,}3\).</p>
  </div>
