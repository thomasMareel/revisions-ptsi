  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Déterminants \(2 \times 2\) et \(3 \times 3\)</h3>
  <div class="statement">Calculer les déterminants suivants.</div>
  <div class="q"><strong>Q1.</strong> \(\begin{vmatrix} 3 & -2 \\ 5 & 4 \end{vmatrix}\).</div>
  <div class="q"><strong>Q2.</strong> \(\begin{vmatrix} 1 & 2 & 3 \\ 0 & 4 & 5 \\ 0 & 0 & 6 \end{vmatrix}\).</div>
  <div class="q"><strong>Q3.</strong> \(\begin{vmatrix} 2 & 1 & 0 \\ 1 & 3 & 1 \\ 0 & 1 & 2 \end{vmatrix}\), par développement suivant la première ligne, puis par la règle de Sarrus.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(3 \times 4 - (-2) \times 5 = 12 + 10 = 22\).</p>
    <p><strong>Q2.</strong> La matrice est triangulaire supérieure : le déterminant est le produit des coefficients diagonaux, \(1 \times 4 \times 6 = 24\).</p>
    <p><strong>Q3.</strong> Suivant la première ligne (signes \(+, -, +\)) :</p>
    <div class="formula">$$2\begin{vmatrix} 3 & 1 \\ 1 & 2 \end{vmatrix} - 1\begin{vmatrix} 1 & 1 \\ 0 & 2 \end{vmatrix} + 0 = 2 \times 5 - 2 = 8.$$</div>
    <p>Par Sarrus : produits descendants \(12 + 0 + 0\), produits montants \(0 + 2 + 2\), d'où \(12 - 4 = 8\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Trois calculs par opérations sur les colonnes</h3>
  <div class="statement">Calculer par opérations élémentaires sur les colonnes (on cherche le moins de calculs possible).</div>
  <div class="q"><strong>Q1.</strong> \(D_1 = \begin{vmatrix} 1 & 2 & 3 \\ 2 & 3 & 4 \\ 3 & 4 & 6 \end{vmatrix}\).</div>
  <div class="q"><strong>Q2.</strong> \(D_2 = \begin{vmatrix} 12 & 3 & 5 \\ 8 & 2 & 1 \\ 4 & 1 & 0 \end{vmatrix}\).</div>
  <div class="q"><strong>Q3.</strong> \(D_3(a) = \begin{vmatrix} a + 1 & a & a \\ a & a + 1 & a \\ a & a & a + 1 \end{vmatrix}\), pour \(a \in \mathbb{R}\). Pour quelles valeurs de \(a\) la matrice est-elle inversible ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(C_2 \leftarrow C_2 - 2C_1\) et \(C_3 \leftarrow C_3 - 3C_1\) donnent les colonnes \((1, 2, 3)\), \((0, -1, -2)\), \((0, -2, -3)\) ; puis \(C_3 \leftarrow C_3 - 2C_2\) donne \((0, 0, 1)\). La matrice est triangulaire inférieure de diagonale \(1, -1, 1\) : \(D_1 = -1\).</p>
    <p><strong>Q2.</strong> Inutile de calculer : la première colonne \((12, 8, 4)\) vaut \(4\) fois la deuxième \((3, 2, 1)\). Les colonnes sont liées : \(D_2 = 0\).</p>
    <p><strong>Q3.</strong> Chaque ligne a pour somme \(3a + 1\). \(C_1 \leftarrow C_1 + C_2 + C_3\), puis on sort ce facteur de la première colonne, qui devient \((1, 1, 1)\). Ensuite \(C_2 \leftarrow C_2 - aC_1\) et \(C_3 \leftarrow C_3 - aC_1\) donnent les colonnes \((0, 1, 0)\) et \((0, 0, 1)\) : il reste une matrice triangulaire de diagonale \(1, 1, 1\). Donc \(D_3(a) = 3a + 1\), et la matrice est inversible si et seulement si \(a \neq -\frac{1}{3}\). Contrôle : pour \(a = 0\), c'est \(I_3\), de déterminant 1.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Pivot de Gauss sur un déterminant \(4 \times 4\)</h3>
  <div class="statement">Soit \(D = \begin{vmatrix} 1 & 2 & 0 & 1 \\ 2 & 5 & 1 & 3 \\ 0 & 1 & 3 & 2 \\ 1 & 3 & 2 & 4 \end{vmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Par des opérations sur les lignes, annuler la première colonne sous le pivot \(a_{11} = 1\).</div>
  <div class="q"><strong>Q2.</strong> Poursuivre jusqu'à une matrice triangulaire et calculer \(D\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les opérations sur les lignes ont les mêmes effets que sur les colonnes (transposée). \(L_2 \leftarrow L_2 - 2L_1\) et \(L_4 \leftarrow L_4 - L_1\) ne changent pas le déterminant :</p>
    <div class="formula">$$D = \begin{vmatrix} 1 & 2 & 0 & 1 \\ 0 & 1 & 1 & 1 \\ 0 & 1 & 3 & 2 \\ 0 & 1 & 2 & 3 \end{vmatrix}.$$</div>
    <p><strong>Q2.</strong> \(L_3 \leftarrow L_3 - L_2\) et \(L_4 \leftarrow L_4 - L_2\) donnent les lignes \((0, 0, 2, 1)\) et \((0, 0, 1, 2)\) ; puis \(L_4 \leftarrow L_4 - \frac{1}{2}L_3\) donne \((0, 0, 0, \frac{3}{2})\). La matrice est triangulaire supérieure :</p>
    <div class="formula">$$D = 1 \times 1 \times 2 \times \frac{3}{2} = 3.$$</div>
    <p>Variante sans fraction : après Q1, développer suivant la première colonne, puis calculer le \(3 \times 3\) restant.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Déterminant paramétrique, inversibilité, relation entre les lignes</h3>
  <div class="statement">Soit \(A = \begin{pmatrix} 1 & 1 & 1 \\ 1 & 2 & a \\ 1 & 4 & a^2 \end{pmatrix}\), où \(a \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\det A\) en fonction de \(a\).</div>
  <div class="q"><strong>Q2.</strong> Pour quelles valeurs de \(a\) la matrice est-elle inversible ?</div>
  <div class="q"><strong>Q3.</strong> Pour \(a = 2\), expliquer la non-inversibilité et donner une relation entre les lignes.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(L_2 \leftarrow L_2 - L_1\) et \(L_3 \leftarrow L_3 - L_1\), puis développement suivant la première colonne :</p>
    <div class="formula">$$\det A = \begin{vmatrix} 1 & 1 & 1 \\ 0 & 1 & a - 1 \\ 0 & 3 & a^2 - 1 \end{vmatrix} = (a^2 - 1) - 3(a - 1) = (a - 1)(a - 2).$$</div>
    <p><strong>Q2.</strong> \(A\) est inversible si et seulement si \(\det A \neq 0\), c'est-à-dire \(a \notin \{1, 2\}\).</p>
    <p><strong>Q3.</strong> Pour \(a = 2\), les colonnes 2 et 3 sont égales, d'où \(\det A = 0\). Les lignes sont \(L_1 = (1, 1, 1)\), \(L_2 = (1, 2, 2)\), \(L_3 = (1, 4, 4)\) ; on cherche \(L_3 = \alpha L_1 + \beta L_2\) : \(\alpha + \beta = 1\) et \(\alpha + 2\beta = 4\), d'où \(\beta = 3\), \(\alpha = -2\). Contrôle : \(3(1, 2, 2) - 2(1, 1, 1) = (1, 4, 4)\). Donc \(L_3 = 3L_2 - 2L_1\), et un système \(AX = B\) n'a jamais une solution unique : il en a une infinité ou aucune, selon \(B\). (Pour \(a = 1\), ce sont les colonnes 1 et 3 qui sont égales.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Développer suivant une ligne ou une colonne</h3>
  <div class="q"><strong>Q1.</strong> Calculer \(\begin{vmatrix} 2 & 0 & 0 & 1 \\ 3 & 1 & 4 & 0 \\ 0 & 0 & 2 & 0 \\ 1 & 0 & 5 & 3 \end{vmatrix}\) en développant deux fois.</div>
  <div class="q"><strong>Q2.</strong> Pour \(n \geq 1\), soit \(D_n\) le déterminant de taille \(n\) qui a des \(2\) sur la diagonale, des \(1\) juste au-dessus et juste au-dessous, et des \(0\) ailleurs. Calculer \(D_1\), \(D_2\), puis \(D_3\) et \(D_4\) en développant suivant la première ligne.</div>
  <div class="q"><strong>Q3.</strong> Conjecturer \(D_n\). Vérifier la conjecture pour \(n = 5\) par l'outil informatique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La colonne 2 n'a qu'un coefficient non nul, \(a_{22} = 1\), de signe \(+\). On supprime la ligne 2 et la colonne 2, puis on développe suivant la deuxième ligne \((0, 2, 0)\) du \(3 \times 3\) obtenu (coefficient central, signe \(+\)) :</p>
    <div class="formula">$$\begin{vmatrix} 2 & 0 & 1 \\ 0 & 2 & 0 \\ 1 & 5 & 3 \end{vmatrix} = 2\begin{vmatrix} 2 & 1 \\ 1 & 3 \end{vmatrix} = 2 \times 5 = 10.$$</div>
    <p>Le déterminant vaut \(10\).</p>
    <p><strong>Q2.</strong> \(D_1 = 2\) et \(D_2 = 4 - 1 = 3\). Pour \(D_3\), la première ligne est \((2, 1, 0)\) : le premier terme vaut \(2D_2\), le second \(-1 \times \begin{vmatrix} 1 & 1 \\ 0 & 2 \end{vmatrix} = -2\), donc \(D_3 = 6 - 2 = 4\). De même, en développant \(D_4\) suivant sa première ligne puis le second mineur suivant sa première colonne, on trouve \(D_4 = 2D_3 - D_2 = 8 - 3 = 5\).</p>
    <p><strong>Q3.</strong> Conjecture : \(D_n = n + 1\). Le calcul de la Q2 montre en général \(D_n = 2D_{n-1} - D_{n-2}\), relation que vérifie \(n + 1\) : \(2n - (n - 1) = n + 1\) ; une récurrence double conclut (ce type de calcul est approfondi en 2ᵉ année, chapitre Déterminants (approfondissements)). Avec SymPy, <code>Matrix(5, 5, lambda i, j: 2 if i == j else (1 if abs(i - j) == 1 else 0)).det()</code> renvoie 6.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Raisonner sans calculer</h3>
  <div class="q"><strong>Q1.</strong> Soit \(A \in \mathcal{M}_4(\mathbb{R})\) telle que \(\det A = -2\). Calculer \(\det(3A)\), \(\det(A^\top A^{-1})\), \(\det(-A^2)\) et \(\det(2A^{-1})\).</div>
  <div class="q"><strong>Q2.</strong> Soit \(A \in \mathcal{M}_n(\mathbb{K})\) telle que \(A^2 = A\). Montrer que \(\det A \in \{0, 1\}\), puis que si \(A\) est inversible, \(A = I_n\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(n\) impair et \(A \in \mathcal{M}_n(\mathbb{R})\) telle que \(A^3 = -A\). Montrer que \(A\) n'est pas inversible.</div>
  <div class="q"><strong>Q4.</strong> Les matrices \(\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}\) et \(\begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix}\) sont-elles semblables ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En taille 4 : \(\det(3A) = 3^4 \times (-2) = -162\) ; \(\det(A^\top A^{-1}) = \det A \times \frac{1}{\det A} = 1\) ; \(\det(-A^2) = (-1)^4 (\det A)^2 = 4\) ; \(\det(2A^{-1}) = 2^4 \times \frac{1}{-2} = -8\).</p>
    <p><strong>Q2.</strong> \(\det(A^2) = \det A\) s'écrit \((\det A)^2 = \det A\), donc \(\det A \in \{0, 1\}\). Si \(A\) est inversible, on multiplie \(A^2 = A\) à gauche par \(A^{-1}\) : \(A = I_n\). Un projecteur autre que l'identité a donc un déterminant nul.</p>
    <p><strong>Q3.</strong> Si \(A\) était inversible, \(A^3 = -A\) donnerait \(A^2 = -I_n\) (multiplier par \(A^{-1}\)), puis \((\det A)^2 = \det(-I_n) = (-1)^n = -1\) pour \(n\) impair : impossible pour un réel.</p>
    <p><strong>Q4.</strong> Non : deux matrices semblables ont le même déterminant, or \(1 \times 4 - 2 \times 3 = -2\) et \(1 \times 2 = 2\). (Attention, la réciproque est fausse : un même déterminant ne suffit pas.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Base ou pas base ?</h3>
  <div class="q"><strong>Q1.</strong> Pour quels réels \(m\) les vecteurs \(u_1 = (2, 1, 1)\), \(u_2 = (1, m, 1)\), \(u_3 = (1, 1, m)\) forment-ils une base de \(\mathbb{R}^3\) ? Pour les valeurs exceptionnelles, donner une relation de dépendance.</div>
  <div class="q"><strong>Q2.</strong> Dans \(\mathbb{R}_2[X]\), pour quels réels \(t\) la famille \(\big((X + 1)^2,\ (X - 1)^2,\ X^2 + t\big)\) est-elle une base ?</div>
  <div class="q"><strong>Q3.</strong> La base \((e_1 + e_2,\ e_2 + e_3,\ e_3 + e_1)\) de \(\mathbb{R}^3\) est-elle directe ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Dans la base canonique, en développant suivant la première ligne :</p>
    <div class="formula">$$\begin{vmatrix} 2 & 1 & 1 \\ 1 & m & 1 \\ 1 & 1 & m \end{vmatrix} = 2(m^2 - 1) - (m - 1) + (1 - m) = 2m^2 - 2m = 2m(m - 1).$$</div>
    <p>C'est une base si et seulement si \(m \notin \{0, 1\}\). Pour \(m = 1\), \(u_2 = u_3\) ; pour \(m = 0\), \(u_2 + u_3 = (1, 0, 1) + (1, 1, 0) = u_1\).</p>
    <p><strong>Q2.</strong> Dans la base \((1, X, X^2)\), les coordonnées sont \((1, 2, 1)\), \((1, -2, 1)\) et \((t, 0, 1)\). En développant suivant la deuxième ligne \((2, -2, 0)\) :</p>
    <div class="formula">$$\begin{vmatrix} 1 & 1 & t \\ 2 & -2 & 0 \\ 1 & 1 & 1 \end{vmatrix} = -2\begin{vmatrix} 1 & t \\ 1 & 1 \end{vmatrix} + (-2)\begin{vmatrix} 1 & t \\ 1 & 1 \end{vmatrix} = 4(t - 1).$$</div>
    <p>C'est une base si et seulement si \(t \neq 1\). Pour \(t = 1\) : \(X^2 + 1 = \frac{1}{2}\big((X + 1)^2 + (X - 1)^2\big)\).</p>
    <p><strong>Q3.</strong> Le déterminant dans la base canonique des colonnes \((1, 1, 0)\), \((0, 1, 1)\), \((1, 0, 1)\) vaut, par Sarrus, \(1 + 0 + 1 - 0 - 0 - 0 = 2 \gt 0\) : la base est directe.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Aire, volume, coplanarité</h3>
  <div class="statement">Le plan et l'espace sont rapportés à des repères orthonormés directs.</div>
  <div class="q"><strong>Q1.</strong> Calculer l'aire du triangle \(ABC\), avec \(A(1, 1)\), \(B(4, 2)\), \(C(2, 6)\). Est-il parcouru dans le sens direct ?</div>
  <div class="q"><strong>Q2.</strong> Dans l'espace, \(A(1, 0, 0)\), \(B(0, 1, 0)\), \(C(0, 0, 1)\) et \(D(m, m, m)\). Pour quelle valeur de \(m\) les quatre points sont-ils coplanaires ?</div>
  <div class="q"><strong>Q3.</strong> Pour \(m = 1\), calculer le volume du tétraèdre \(ABCD\).</div>
  <div class="q"><strong>Q4.</strong> Quelle est l'aire de l'image du triangle de Q1 par l'endomorphisme \(f(x, y) = (2x - y,\ x + 3y)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\overrightarrow{AB} = (3, 1)\), \(\overrightarrow{AC} = (1, 5)\), \(\det(\overrightarrow{AB}, \overrightarrow{AC}) = 15 - 1 = 14\). Aire : \(\frac{14}{2} = 7\). Le déterminant est positif : le triangle est parcouru dans le sens direct.</p>
    <p><strong>Q2.</strong> \(\overrightarrow{AB} = (-1, 1, 0)\), \(\overrightarrow{AC} = (-1, 0, 1)\), \(\overrightarrow{AD} = (m - 1, m, m)\). En développant suivant la première ligne :</p>
    <div class="formula">$$\begin{vmatrix} -1 & -1 & m - 1 \\ 1 & 0 & m \\ 0 & 1 & m \end{vmatrix} = -1 \cdot (0 - m) + 1 \cdot (m - 0) + (m - 1) \cdot (1 - 0) = 3m - 1.$$</div>
    <p>Les points sont coplanaires si et seulement si \(m = \frac{1}{3}\) : c'est le point \(\big(\frac{1}{3}, \frac{1}{3}, \frac{1}{3}\big)\) du plan \(x + y + z = 1\), qui contient \(A\), \(B\) et \(C\).</p>
    <p><strong>Q3.</strong> Pour \(m = 1\), le déterminant vaut 2, et le volume du tétraèdre \(\frac{|2|}{6} = \frac{1}{3}\).</p>
    <p><strong>Q4.</strong> \(\det f = \begin{vmatrix} 2 & -1 \\ 1 & 3 \end{vmatrix} = 7\) : \(f\) multiplie les aires par 7 (et conserve l'orientation). L'image du triangle a pour aire \(7 \times 7 = 49\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Déterminant de Vandermonde d'ordre 3 et interpolation</h3>
  <div class="statement">Pour \(a, b, c \in \mathbb{R}\), on pose \(V(a, b, c) = \begin{vmatrix} 1 & a & a^2 \\ 1 & b & b^2 \\ 1 & c & c^2 \end{vmatrix}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\begin{vmatrix} 1 & a \\ 1 & b \end{vmatrix}\), puis montrer que \(V(a, b, c) = (b - a)(c - a)(c - b)\).</div>
  <div class="q"><strong>Q2.</strong> Vérifier la formule pour \((a, b, c) = (0, 1, 2)\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(a, b, c\) deux à deux distincts et \(y_1, y_2, y_3\) réels. Montrer qu'il existe un unique polynôme \(P\) de degré au plus 2 tel que \(P(a) = y_1\), \(P(b) = y_2\), \(P(c) = y_3\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\begin{vmatrix} 1 & a \\ 1 & b \end{vmatrix} = b - a\). Pour \(V\), \(L_2 \leftarrow L_2 - L_1\) et \(L_3 \leftarrow L_3 - L_1\), puis on développe suivant la première colonne :</p>
    <div class="formula">$$V(a, b, c) = \begin{vmatrix} b - a & b^2 - a^2 \\ c - a & c^2 - a^2 \end{vmatrix} = (b - a)(c - a)\begin{vmatrix} 1 & b + a \\ 1 & c + a \end{vmatrix},$$</div>
    <p>en sortant le facteur \(b - a\) de la première ligne et \(c - a\) de la seconde. Le dernier déterminant vaut \(c - b\) : \(V(a, b, c) = (b - a)(c - a)(c - b)\).</p>
    <p><strong>Q2.</strong> Formule : \(1 \times 2 \times 1 = 2\). Calcul direct : \(\begin{vmatrix} 1 & 0 & 0 \\ 1 & 1 & 1 \\ 1 & 2 & 4 \end{vmatrix} = 1 \times (4 - 2) = 2\).</p>
    <p><strong>Q3.</strong> En écrivant \(P = \alpha_0 + \alpha_1 X + \alpha_2 X^2\), les trois conditions forment un système linéaire d'inconnues \(\alpha_0, \alpha_1, \alpha_2\) dont la matrice a pour déterminant \(V(a, b, c)\). Celui-ci est non nul puisque \(a, b, c\) sont deux à deux distincts : la matrice est inversible, et le système a une unique solution (système de Cramer). Le cas de \(n\) points est traité en 2ᵉ année (Vandermonde en taille \(n\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Déterminants d'endomorphismes</h3>
  <div class="q"><strong>Q1.</strong> Sur \(\mathbb{R}_2[X]\), soit \(g(P) = (X + 1)P' - 2P\). Montrer que \(g\) est un endomorphisme, écrire sa matrice dans la base \((1, X, X^2)\) et calculer \(\det g\). Déterminer \(\ker g\).</div>
  <div class="q"><strong>Q2.</strong> Sur \(\mathbb{R}_n[X]\), soit \(h(P) = P(2X)\). Calculer \(\det h\) ; \(h\) est-il un automorphisme ?</div>
  <div class="q"><strong>Q3.</strong> Sur \(\mathcal{M}_2(\mathbb{R})\), soit \(\varphi(M) = M + M^\top\). Calculer \(\det \varphi\) dans la base \((E_{11}, E_{12}, E_{21}, E_{22})\) et interpréter.</div>
  <div class="q"><strong>Q4.</strong> Soit \(s\) la symétrie de \(\mathbb{R}^2\) par rapport à \(D = \operatorname{Vect}\big((1, 1)\big)\) parallèlement à \(D' = \operatorname{Vect}\big((1, 0)\big)\). Calculer \(\det s\) de deux façons.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(g\) est linéaire, et si \(\deg P \leq 2\), \((X + 1)P'\) est de degré au plus 2 : c'est un endomorphisme de \(\mathbb{R}_2[X]\). \(g(1) = -2\), \(g(X) = (X + 1) - 2X = 1 - X\), \(g(X^2) = 2X(X + 1) - 2X^2 = 2X\). D'où</p>
    <div class="formula">$$\operatorname{Mat}(g) = \begin{pmatrix} -2 & 1 & 0 \\ 0 & -1 & 2 \\ 0 & 0 & 0 \end{pmatrix}, \qquad \det g = 0.$$</div>
    <p>\(g\) n'est pas un automorphisme. Pour \(P = a + bX + cX^2\), \(g(P) = 0\) donne \(-2a + b = 0\) et \(-b + 2c = 0\), donc \(b = 2c\), \(a = c\) : \(\ker g = \operatorname{Vect}\big((X + 1)^2\big)\). (On vérifie : \((X + 1) \cdot 2(X + 1) = 2(X + 1)^2\).)</p>
    <p><strong>Q2.</strong> \(h(X^k) = 2^k X^k\) : la matrice dans \((1, X, \ldots, X^n)\) est diagonale, de coefficients \(1, 2, \ldots, 2^n\), et</p>
    <div class="formula">$$\det h = 2^{0 + 1 + \cdots + n} = 2^{n(n+1)/2} \neq 0 :$$</div>
    <p>\(h\) est un automorphisme, de réciproque \(P \mapsto P(X/2)\), de déterminant \(2^{-n(n+1)/2}\).</p>
    <p><strong>Q3.</strong> \(\varphi(E_{11}) = 2E_{11}\), \(\varphi(E_{12}) = E_{12} + E_{21}\), \(\varphi(E_{21}) = E_{12} + E_{21}\), \(\varphi(E_{22}) = 2E_{22}\). Les colonnes 2 et 3 de la matrice sont égales : \(\det \varphi = 0\). En effet, \(\varphi\) annule les matrices antisymétriques : \(\ker \varphi = \operatorname{Vect}(E_{12} - E_{21})\), et \(\varphi\) n'est pas bijectif.</p>
    <p><strong>Q4.</strong> Dans la base adaptée \(\big((1, 1), (1, 0)\big)\), la matrice de \(s\) est \(\operatorname{diag}(1, -1)\) : \(\det s = -1\). Dans la base canonique : \(s(e_1) = -e_1\) et \(e_2 = (1, 1) - (1, 0)\) donne \(s(e_2) = (1, 1) + (1, 0) = (2, 1)\) ; la matrice \(\begin{pmatrix} -1 & 2 \\ 0 & 1 \end{pmatrix}\) a bien pour déterminant \(-1\). Une symétrie renverse l'orientation dès que \(\dim D'\) est impaire.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ☆ ☆</span>
  <h3>Comatrice et formules de Cramer (hors programme, pour aller plus loin)</h3>
  <div class="statement">Ces formules ne sont exigibles ni en PTSI ni en PT ; un énoncé qui les utilise les rappelle. Pour \(A \in \mathcal{M}_n(\mathbb{K})\), on note \(c_{ij} = (-1)^{i+j}\Delta_{ij}\) les cofacteurs, \(\operatorname{com}(A) = (c_{ij})\) la comatrice, et l'on admet que, si \(\det A \neq 0\), \(A^{-1} = \frac{1}{\det A}\operatorname{com}(A)^\top\).</div>
  <div class="q"><strong>Q1.</strong> Pour \(A = \begin{pmatrix} 2 & 1 & 0 \\ 1 & 3 & 1 \\ 0 & 1 & 2 \end{pmatrix}\) (EXO 01, \(\det A = 8\)), calculer les cofacteurs et en déduire \(A^{-1}\).</div>
  <div class="q"><strong>Q2.</strong> Formules de Cramer en taille 2 : pour le système \(ax + by = e\), \(cx + dy = f\) avec \(ad - bc \neq 0\), montrer que \(x = \frac{ed - bf}{ad - bc}\) et \(y = \frac{af - ce}{ad - bc}\). Résoudre \(x + 2y = 5\), \(3x - y = 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec le damier des signes : \(c_{11} = 5\), \(c_{12} = -2\), \(c_{13} = 1\), \(c_{21} = -2\), \(c_{22} = 4\), \(c_{23} = -2\), \(c_{31} = 1\), \(c_{32} = -2\), \(c_{33} = 5\) (par exemple \(c_{11} = 3 \times 2 - 1 \times 1\) et \(c_{12} = -(1 \times 2 - 1 \times 0)\)). La comatrice est symétrique, et</p>
    <div class="formula">$$A^{-1} = \frac{1}{8}\begin{pmatrix} 5 & -2 & 1 \\ -2 & 4 & -2 \\ 1 & -2 & 5 \end{pmatrix}.$$</div>
    <p>Contrôle : première ligne de \(A\) par première colonne de \(A^{-1}\), \(\frac{1}{8}(10 - 2 + 0) = 1\). La méthode du programme pour inverser reste le pivot de Gauss (chapitre Calcul matriciel).</p>
    <p><strong>Q2.</strong> \(d \times\) (première équation) \(- b \times\) (seconde) élimine \(y\) : \((ad - bc)x = ed - bf\). De même \(a \times\) (seconde) \(- c \times\) (première) donne \((ad - bc)y = af - ce\). Pour le système proposé, \(ad - bc = -1 - 6 = -7\), \(x = \frac{-5 - 2}{-7} = 1\) et \(y = \frac{1 - 15}{-7} = 2\). Contrôle : \(1 + 4 = 5\) et \(3 - 2 = 1\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Matrices circulantes d'ordre 3</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format de l'épreuve de Mathématiques PT (thème <em>déterminants : opérations élémentaires, produit, déterminant d'un endomorphisme</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Pour \((a, b, c) \in \mathbb{R}^3\), on pose
    <div class="formula">$$C(a, b, c) = \begin{pmatrix} a & b & c \\ c & a & b \\ b & c & a \end{pmatrix}, \qquad J = C(0, 1, 0) = \begin{pmatrix} 0 & 1 & 0 \\ 0 & 0 & 1 \\ 1 & 0 & 0 \end{pmatrix},$$</div>
    et l'on note \(\mathcal{C} = \{C(a, b, c),\ (a, b, c) \in \mathbb{R}^3\}\) l'ensemble des matrices circulantes.
  </div>

  <p class="exo-part">Partie A — Calcul du déterminant</p>
  <div class="q"><strong>A1.</strong> À l'aide de l'opération \(C_1 \leftarrow C_1 + C_2 + C_3\), montrer que</div>
  <div class="formula">$$\det C(a, b, c) = (a + b + c)\,(a^2 + b^2 + c^2 - ab - bc - ca).$$</div>
  <div class="q"><strong>A2.</strong> Vérifier que \(a^2 + b^2 + c^2 - ab - bc - ca = \frac{1}{2}\big((a - b)^2 + (b - c)^2 + (c - a)^2\big)\). En déduire que \(C(a, b, c)\) est inversible si et seulement si \(a + b + c \neq 0\) et \(a\), \(b\), \(c\) ne sont pas tous égaux.</div>
  <div class="q"><strong>A3.</strong> Calculer \(\det C(1, 2, 3)\) de deux façons, puis retrouver par la règle de Sarrus que \(\det C(a, b, c) = a^3 + b^3 + c^3 - 3abc\).</div>

  <p class="exo-part">Partie B — Une structure multiplicative</p>
  <div class="q"><strong>B1.</strong> Calculer \(J^2\) et \(J^3\), puis vérifier que \(C(a, b, c) = aI_3 + bJ + cJ^2\).</div>
  <div class="q"><strong>B2.</strong> En déduire que \(\mathcal{C}\) est un sous-espace de \(\mathcal{M}_3(\mathbb{R})\) de dimension 3, puis que le produit de deux matrices circulantes est circulant, et que deux matrices circulantes commutent.</div>
  <div class="q"><strong>B3.</strong> Montrer que le produit de deux réels de la forme \(a^3 + b^3 + c^3 - 3abc\) (avec \(a, b, c\) réels) est encore de cette forme.</div>

  <p class="exo-part">Partie C — Un endomorphisme de \(\mathcal{C}\)</p>
  <div class="q"><strong>C1.</strong> On fixe \(A = C(a, b, c)\) et l'on pose \(\varphi(M) = AM\) pour \(M \in \mathcal{C}\). Montrer que \(\varphi\) est un endomorphisme de \(\mathcal{C}\), écrire sa matrice dans la base \((I_3, J, J^2)\) et montrer que \(\det \varphi = \det A\).</div>
  <div class="q"><strong>C2.</strong> On suppose \(\det A \neq 0\). Montrer que \(A^{-1}\) est circulante. Calculer l'inverse de \(C(1, 1, 0)\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Chaque ligne a pour somme \(a + b + c\) : l'opération donne la première colonne \((a + b + c)(1, 1, 1)\), sans changer le déterminant, et l'on sort ce facteur. Puis \(C_2 \leftarrow C_2 - bC_1\) et \(C_3 \leftarrow C_3 - cC_1\) vident la première ligne :</p>
    <div class="formula">$$\det C(a, b, c) = (a + b + c)\begin{vmatrix} 1 & 0 & 0 \\ 1 & a - b & b - c \\ 1 & c - b & a - c \end{vmatrix}.$$</div>
    <p>En développant suivant la première ligne, le dernier déterminant vaut</p>
    <div class="formula">$$(a - b)(a - c) - (b - c)(c - b) = (a - b)(a - c) + (b - c)^2 = a^2 + b^2 + c^2 - ab - bc - ca.$$</div>
    <p><strong>A2.</strong> En développant :</p>
    <div class="formula">$$(a - b)^2 + (b - c)^2 + (c - a)^2 = 2(a^2 + b^2 + c^2) - 2(ab + bc + ca).$$</div>
    <p>Pour des réels, cette somme de carrés est nulle si et seulement si \(a = b = c\). Donc \(\det C(a, b, c) = 0\) si et seulement si \(a + b + c = 0\) ou \(a = b = c\), et l'on conclut par la caractérisation des matrices inversibles.</p>
    <p><strong>A3.</strong> Par A1 : \(6 \times (1 + 4 + 9 - 2 - 6 - 3) = 6 \times 3 = 18\). Par Sarrus sur \(C(1, 2, 3)\), de lignes \((1, 2, 3)\), \((3, 1, 2)\), \((2, 3, 1)\) : \((1 + 8 + 27) - (6 + 6 + 6) = 18\). En général, Sarrus donne les produits descendants \(a^3 + b^3 + c^3\) et trois produits montants égaux à \(abc\).</p>
    <p><strong>B1.</strong> \(J\) envoie \(e_1, e_2, e_3\) sur \(e_3, e_1, e_2\) (lire ses colonnes). On trouve \(J^2 = C(0, 0, 1)\) et \(J^3 = I_3\). Alors \(aI_3 + bJ + cJ^2\) a \(a\) sur la diagonale, \(b\) aux positions de \(J\) et \(c\) aux positions de \(J^2\) : c'est \(C(a, b, c)\).</p>
    <p><strong>B2.</strong> \(\mathcal{C} = \operatorname{Vect}(I_3, J, J^2)\) est un sous-espace ; la famille est libre (si \(aI_3 + bJ + cJ^2 = 0\), la première ligne \((a, b, c)\) est nulle), donc \(\dim \mathcal{C} = 3\). Avec \(J^3 = I_3\) et \(J^4 = J\) :</p>
    <div class="formula">$$(aI_3 + bJ + cJ^2)(a'I_3 + b'J + c'J^2) = (aa' + bc' + cb')I_3 + (ab' + ba' + cc')J + (ac' + bb' + ca')J^2,$$</div>
    <p>qui est circulant ; l'expression est symétrique en les deux facteurs, donc ils commutent.</p>
    <p><strong>B3.</strong> Si \(x = a^3 + b^3 + c^3 - 3abc = \det C(a, b, c)\) et \(x'\) de même avec \((a', b', c')\), alors, avec les coefficients \(a''\), \(b''\), \(c''\) de B2,</p>
    <div class="formula">$$xx' = \det\big(C(a, b, c)\,C(a', b', c')\big) = \det C(a'', b'', c''),$$</div>
    <p>c'est-à-dire \(a''^3 + b''^3 + c''^3 - 3a''b''c''\).</p>
    <p><strong>C1.</strong> Par B2, \(AM\) est circulant si \(M\) l'est, et \(M \mapsto AM\) est linéaire : \(\varphi\) est un endomorphisme de \(\mathcal{C}\). Avec \(J^3 = I_3\) : \(\varphi(I_3) = aI_3 + bJ + cJ^2\), \(\varphi(J) = cI_3 + aJ + bJ^2\), \(\varphi(J^2) = bI_3 + cJ + aJ^2\). La matrice de \(\varphi\) dans \((I_3, J, J^2)\) a pour colonnes \((a, b, c)\), \((c, a, b)\), \((b, c, a)\) : c'est \(A^\top\). Donc \(\det \varphi = \det A^\top = \det A\).</p>
    <p><strong>C2.</strong> Si \(\det A \neq 0\), \(\varphi\) est un automorphisme de \(\mathcal{C}\) : il existe \(M \in \mathcal{C}\) telle que \(AM = I_3\), et \(M = A^{-1}\) est circulante. Pour \(A = C(1, 1, 0) = I_3 + J\), de déterminant \(2 \times 1 = 2\), on cherche \(M = \alpha I_3 + \beta J + \gamma J^2\) :</p>
    <div class="formula">$$(I_3 + J)M = (\alpha + \gamma)I_3 + (\alpha + \beta)J + (\beta + \gamma)J^2 = I_3$$</div>
    <p>donne \(\alpha = \gamma = \frac{1}{2}\), \(\beta = -\frac{1}{2}\). Donc \(C(1, 1, 0)^{-1} = \frac{1}{2}C(1, -1, 1)\) ; contrôle : \((I_3 + J)(I_3 - J + J^2) = I_3 + J^3 = 2I_3\).</p>
  </div>
</div>
