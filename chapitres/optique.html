<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Projeter une image sur un écran</h3>
  <div class="statement">Sur un banc d'optique, un objet lumineux et un écran sont fixés à \(D = 1{,}50\ \text{m}\) l'un de l'autre. On dispose d'une lentille convergente de distance focale \(f' = 25\ \text{cm}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer qu'on peut former une image nette de l'objet sur l'écran.</div>
  <div class="q"><strong>Q2.</strong> Déterminer les deux positions possibles de la lentille et les grandissements correspondants. Vérifier que leur produit vaut 1.</div>
  <div class="q"><strong>Q3.</strong> Quelle est la plus grande distance focale utilisable sur ce montage ? Quelle image obtient-on alors ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Condition de formation d'une image réelle d'un objet réel : \(D \geq 4f'\). Ici \(4f' = 1{,}00\ \text{m} \lt 1{,}50\ \text{m}\) : c'est possible, avec deux positions de la lentille.</p>
    <p><strong>Q2.</strong> Avec \(p\) la distance objet-lentille : \(p^2 - Dp + Df' = 0\), soit \(p = \big(D \pm \sqrt{D^2 - 4Df'}\big)/2\) avec \(\sqrt{150^2 - 4\times150\times25} = 86{,}6\ \text{cm}\) : \(p_1 = 31{,}7\ \text{cm}\) et \(p_2 = 118{,}3\ \text{cm}\). Grandissements \(\gamma = -p'/p = -(D - p)/p\) : \(\gamma_1 = -118{,}3/31{,}7 = -3{,}73\) (image agrandie) et \(\gamma_2 = -0{,}268\) (image réduite). Leur produit vaut 1, puisque les deux positions s'échangent \(p\) et \(p'\).</p>
    <p><strong>Q3.</strong> Il faut \(f' \leq D/4 = 37{,}5\ \text{cm}\). Pour \(f' = 37{,}5\ \text{cm}\), une seule position, au milieu (\(p = p' = 75\ \text{cm}\)) : image renversée, de même taille (\(\gamma = -1\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Lentille convergente : de l'image réelle à la loupe</h3>
  <div class="statement">
    Une lentille mince convergente a une distance focale image \(f' = 5{,}0\ \text{cm}\). On note \(O\) son centre, \(F\) et \(F'\) ses foyers, et on utilise la relation de conjugaison de Descartes (origine en \(O\)) : \(\dfrac{1}{\overline{OA'}} - \dfrac{1}{\overline{OA}} = \dfrac{1}{f'}\).
  </div>
  <p class="exo-part">Partie A — Formation d'une image</p>
  <div class="q"><strong>A1.</strong> Un objet réel \(AB\) est placé à \(\overline{OA} = -15\ \text{cm}\). Déterminer la position \(\overline{OA'}\) de l'image.</div>
  <div class="q"><strong>A2.</strong> Calculer le grandissement transversal \(\gamma\). L'image est-elle réelle ou virtuelle, droite ou renversée, agrandie ou réduite ?</div>
  <p class="exo-part">Partie B — Utilisation en loupe</p>
  <div class="q"><strong>B1.</strong> On place maintenant l'objet entre \(F\) et \(O\). Quelle est la nature de l'image ? Justifier l'effet « loupe ».</div>
  <div class="q"><strong>B2.</strong> Calculer le grossissement commercial \(G = 0{,}25/f'\) (\(f'\) en mètres) de cette loupe.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong></p><div class="formula">$$\frac{1}{\overline{OA'}} = \frac{1}{f'} + \frac{1}{\overline{OA}} = \frac{1}{0{,}05} + \frac{1}{-0{,}15} = 20 - 6{,}67 = 13{,}3\ \text{m}^{-1}$$</div><p>Donc \(\overline{OA'} = +7{,}5\ \text{cm}\) (image réelle, au-delà de la lentille).</p>
    <p><strong>A2.</strong> \(\gamma = \dfrac{\overline{OA'}}{\overline{OA}} = \dfrac{7{,}5}{-15} = -0{,}50\). Image réelle, renversée (\(\gamma \lt 0\)), réduite de moitié (\(|\gamma| \lt 1\)).</p>
    <p><strong>B1.</strong> Objet entre \(F\) et \(O\) (\(|\overline{OA}| \lt f'\)) : \(\dfrac{1}{\overline{OA'}} = \dfrac{1}{f'} + \dfrac{1}{\overline{OA}} \lt 0\), donc \(\overline{OA'} \lt 0\) et \(\gamma > 1\) : image virtuelle, droite et agrandie, du même côté que l'objet. L'œil la voit sous un angle plus grand que l'objet à l'œil nu : c'est l'effet loupe.</p>
    <p><strong>B2.</strong> \(G = \dfrac{0{,}25}{f'} = \dfrac{0{,}25}{0{,}050} = 5{,}0\) : grossissement de 5× pour une observation à la distance conventionnelle de 25 cm.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Un téléobjectif à deux lentilles</h3>
  <div class="statement">Un objectif est formé d'une lentille convergente \(L_1\) (\(f'_1 = 12\ \text{cm}\)) suivie, à \(e = 8{,}0\ \text{cm}\), d'une lentille divergente \(L_2\) (\(f'_2 = -6{,}0\ \text{cm}\)). Il vise un objet très éloigné, vu sous le petit angle \(\alpha\).</div>
  <div class="q"><strong>Q1.</strong> Où \(L_1\) seule formerait-elle l'image ? Quelle est sa taille ? Pourquoi est-ce un objet virtuel pour \(L_2\) ?</div>
  <div class="q"><strong>Q2.</strong> Déterminer la position de l'image finale et le grandissement \(\gamma_2\) de \(L_2\).</div>
  <div class="q"><strong>Q3.</strong> Quelle est la taille de l'image finale ? Quelle distance focale devrait avoir une lentille unique pour donner la même image ? Quel est l'intérêt du montage ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Objet à l'infini : \(L_1\) en donne l'image \(A_1B_1\) dans son plan focal image, 12 cm après \(L_1\), de taille \(f'_1\alpha = 12\alpha\) (renversée). Ce point est 4,0 cm <em>après</em> \(L_2\) : les rayons rencontrent \(L_2\) avant d'y converger. Pour \(L_2\), \(\overline{O_2A_1} = +4{,}0\ \text{cm}\) : objet virtuel.</p>
    <p><strong>Q2.</strong> \(1/\overline{O_2A'} = 1/f'_2 + 1/\overline{O_2A_1}\), soit \(1/\overline{O_2A'} = -1/6 + 1/4 = 1/12\), donc \(\overline{O_2A'} = 12\ \text{cm}\) : image réelle, 12 cm après \(L_2\). \(\gamma_2 = 12/4 = 3{,}0\).</p>
    <p><strong>Q3.</strong> \(|A'B'| = 3{,}0\times12\alpha = 36\alpha\) (en cm). Une lentille unique donnerait cette image avec \(f' = 36\ \text{cm}\). Ici, l'image est à \(8{,}0 + 12 = 20\ \text{cm}\) de la première lentille : on obtient l'image d'un objectif de 36 cm de focale dans un tube de 20 cm. C'est le principe du téléobjectif.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Focométrie au banc d'optique</h3>
  <div class="statement">On veut mesurer la distance focale d'une lentille convergente \(L_1\), puis celle d'une lentille divergente \(L_2\).</div>
  <div class="q"><strong>Q1.</strong> Décrire la méthode d'autocollimation pour \(L_1\). À quoi reconnaît-on le bon réglage ?</div>
  <div class="q"><strong>Q2.</strong> Méthode de Bessel : objet et écran sont à \(D = 100{,}0\ \text{cm}\) ; les deux positions donnant une image nette sont séparées de \(d = 52{,}0\ \text{cm}\). Calculer \(f'_1\) et la vergence \(V_1\).</div>
  <div class="q"><strong>Q3.</strong> On accole \(L_2\) à \(L_1\). Le doublet obtenu a une distance focale mesurée de 45,0 cm. En déduire \(V_2\) et \(f'_2\).</div>
  <div class="q"><strong>Q4.</strong> Pourquoi ne peut-on pas mesurer \(f'_2\) par la méthode de Bessel avec \(L_2\) seule ? Pourquoi \(L_1\) doit-elle être plus puissante que \(L_2\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On place derrière \(L_1\) un miroir plan perpendiculaire à l'axe, et l'on déplace \(L_1\) par rapport à l'objet (une mire éclairée) jusqu'à obtenir, dans le plan même de l'objet, une image nette et renversée de même taille. L'objet est alors dans le plan focal objet : les rayons sortent parallèles de \(L_1\), le miroir les renvoie parallèles et \(L_1\) les fait reconverger dans son plan focal. La distance objet-lentille vaut \(f'_1\).</p>
    <p><strong>Q2.</strong> \(f'_1 = \dfrac{D^2 - d^2}{4D} = \dfrac{10\,000 - 2\,704}{400} = 18{,}2\ \text{cm}\), et \(V_1 = 1/0{,}182 = 5{,}48\ \delta\).</p>
    <p><strong>Q3.</strong> Lentilles accolées : \(V = V_1 + V_2\), avec \(V = 1/0{,}450 = 2{,}22\ \delta\). Donc \(V_2 = 2{,}22 - 5{,}48 = -3{,}26\ \delta\) et \(f'_2 = -30{,}7\ \text{cm}\).</p>
    <p><strong>Q4.</strong> Une lentille divergente ne donne jamais d'image réelle d'un objet réel : rien ne se forme sur l'écran. Accolée à une convergente plus puissante (\(V_1 > |V_2|\)), l'ensemble reste convergent (\(V > 0\)) et forme une image réelle mesurable.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>L'œil : accommodation, myopie, résolution</h3>
  <div class="statement">On modélise l'œil par une lentille mince de vergence variable placée à \(d = 16{,}7\ \text{mm}\) de la rétine.</div>
  <div class="q"><strong>Q1.</strong> Quelle est la vergence d'un œil normal au repos ? Et lorsqu'il regarde un objet à son punctum proximum, situé à 20 cm ? En déduire sa plage d'accommodation en dioptries.</div>
  <div class="q"><strong>Q2.</strong> Un œil myope a son punctum remotum à 25 cm et son punctum proximum à 10 cm. Quelle est sa vergence au repos ? Quelle lentille de contact (accolée à l'œil) le corrige pour la vision de loin ?</div>
  <div class="q"><strong>Q3.</strong> Avec cette lentille de contact, où est le nouveau punctum proximum ?</div>
  <div class="q"><strong>Q4.</strong> La limite de résolution angulaire de l'œil est d'environ \(3\times10^{-4}\ \text{rad}\). Jusqu'à quelle distance distingue-t-on deux traits séparés de 2 mm ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Au repos, l'image d'un objet à l'infini est sur la rétine, au foyer : \(V = 1/d = 1/0{,}0167 = 59{,}9\ \delta\). Pour un objet en \(\overline{OA} = -0{,}20\ \text{m}\) : \(V = 1/d - 1/\overline{OA} = 59{,}9 + 5{,}0 = 64{,}9\ \delta\). Plage d'accommodation : 5,0 δ.</p>
    <p><strong>Q2.</strong> Au repos, il voit net à 25 cm : \(V = 59{,}9 + 1/0{,}25 = 63{,}9\ \delta\), trop convergent de 4 δ. La lentille de contact doit donner d'un objet à l'infini une image au PR : foyer image au PR, \(f' = -0{,}25\ \text{m}\), soit \(V = -4{,}0\ \delta\) (lentille divergente).</p>
    <p><strong>Q3.</strong> L'œil voit net, en accommodant au maximum, les images situées à 10 cm. La lentille doit donc former en \(\overline{OA'} = -0{,}10\ \text{m}\) l'image de l'objet : \(1/\overline{OA} = 1/\overline{OA'} - V = -10 + 4 = -6\ \text{m}^{-1}\), soit \(\overline{OA} = -16{,}7\ \text{cm}\). Le nouveau PP est à 16,7 cm : la correction recule un peu le PP, sans gêne pour la lecture.</p>
    <p><strong>Q4.</strong> Les traits sont distingués tant que \(2\ \text{mm}/L > 3\times10^{-4}\ \text{rad}\), soit \(L \lt 6{,}7\ \text{m}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Loupe</h3>
  <div class="statement">Une loupe est constituée d'une lentille convergente de distance focale \(f' = 5\) cm. On observe un objet AB de 1 mm placé à 4 cm avant la lentille. L'œil est placé au foyer image \(F'\) de la loupe ; à l'œil nu, on observerait l'objet au plus près, à \(d_m = 25\ \text{cm}\).</div>
  <div class="q"><strong>Q1.</strong> Position et nature de l'image.</div>
  <div class="q"><strong>Q2.</strong> Grandissement et taille de l'image.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'angle \(\alpha'\) sous lequel l'œil voit l'image, l'angle \(\alpha\) sous lequel il verrait l'objet à l'œil nu à 25 cm, et le grossissement \(G = \alpha'/\alpha\). Comparer au grossissement commercial \(G_c = d_m/f'\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\overline{OA} = -4\) cm. \(1/\overline{OA'} = 1/5 - 1/4 = (4-5)/20 = -1/20\). Donc \(\overline{OA'} = -20\) cm : image du même côté que l'objet, donc <strong>virtuelle</strong>.</p>
    <p><strong>Q2.</strong> \(\gamma = -20/(-4) = +5\). Image droite, agrandie 5 fois. \(A'B' = 5\) mm.</p>
    <p><strong>Q3.</strong> L'œil, en \(F'\), est à \(20 + 5 = 25\ \text{cm}\) de l'image : \(\alpha' = 5\ \text{mm}/250\ \text{mm} = 0{,}020\ \text{rad}\). À l'œil nu à 25 cm : \(\alpha = 1/250 = 0{,}004\ \text{rad}\). D'où \(G = 5\), égal à \(G_c = 25/5 = 5\). Ce n'est pas une coïncidence : un rayon issu de \(B\) parallèle à l'axe ressort par \(F'\), donc l'œil placé en \(F'\) voit toujours l'image sous l'angle \(AB/f'\), quelle que soit la position de l'objet entre \(F\) et \(O\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Système afocal — Lunette astronomique</h3>
  <div class="statement">Une lunette astronomique simple comporte un objectif (\(f'_1 = 50\) cm) et un oculaire (\(f'_2 = 2{,}5\) cm). Elle est réglée en configuration afocale (image finale à l'infini, observée sans fatigue).</div>
  <div class="q"><strong>Q1.</strong> Quelle est la distance entre les deux lentilles ?</div>
  <div class="q"><strong>Q2.</strong> Un objet à l'infini sous-tend l'angle \(\alpha\) à l'œil nu. Quel est l'angle \(\alpha'\) sous lequel on voit l'image à travers la lunette ?</div>
  <div class="q"><strong>Q3.</strong> En déduire le grossissement \(G\). L'image est-elle droite ou renversée ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système afocal : \(F'_1\) coïncide avec \(F_2\). La distance entre lentilles vaut donc \(f'_1 + f'_2 = 52{,}5\) cm.</p>
    <p><strong>Q2.</strong> L'image intermédiaire \(A_1B_1\) se forme dans le plan focal image de l'objectif ; elle est renversée et de taille \(f'_1\tan\alpha \approx f'_1\alpha\) (petits angles). Elle est dans le plan focal objet de l'oculaire, qui en donne une image à l'infini vue sous l'angle \(|\alpha'| = A_1B_1/f'_2 = f'_1\alpha/f'_2\).</p>
    <p><strong>Q3.</strong> \(|G| = f'_1/f'_2 = 50/2{,}5 = 20\) : on voit l'objet sous un angle 20 fois plus grand qu'à l'œil nu. L'image est renversée (\(G = -20\) en valeur algébrique), ce qui ne gêne pas en astronomie.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Microscope : un instrument non afocal</h3>
  <div class="statement">Un microscope est formé d'un objectif \(L_1\) (\(f'_1 = 4{,}0\ \text{mm}\)) et d'un oculaire \(L_2\) (\(f'_2 = 25\ \text{mm}\)). L'intervalle optique, distance du foyer image \(F'_1\) de l'objectif au foyer objet \(F_2\) de l'oculaire, vaut \(\Delta = 160\ \text{mm}\). L'œil observe l'image finale à l'infini ; à l'œil nu, on observerait l'objet au plus près à \(d_m = 250\ \text{mm}\).</div>
  <div class="q"><strong>Q1.</strong> Où doit se former l'image intermédiaire \(A_1B_1\) ? En déduire, par la relation de Newton, la position de l'objet par rapport à \(F_1\), et le grandissement \(\gamma_1\) de l'objectif.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'angle \(\alpha'\) sous lequel on voit l'image finale d'un objet de 10 µm, puis le grossissement \(|G|\) du microscope.</div>
  <div class="q"><strong>Q3.</strong> Le microscope est-il un système afocal ? Comparer à la lunette.</div>
  <div class="q"><strong>Q4.</strong> Comment augmenter le grossissement sans changer d'oculaire ? Quelle limite rencontre-t-on ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour une image finale à l'infini, \(A_1B_1\) doit être dans le plan focal objet de l'oculaire : \(A_1 = F_2\), donc \(\overline{F'_1A_1} = \Delta = 160\ \text{mm}\). Newton : \(\overline{F_1A} = -{f'_1}^2/\overline{F'_1A_1}\), soit \(\overline{F_1A} = -16/160 = -0{,}10\ \text{mm}\) : l'objet est 0,1 mm <em>avant</em> \(F_1\) (soit à 4,1 mm de l'objectif). Grandissement : \(\gamma_1 = -\overline{F'_1A_1}/f'_1 = -160/4{,}0 = -40\) : image intermédiaire réelle, renversée, 40 fois plus grande.</p>
    <p><strong>Q2.</strong> \(A_1B_1 = 40\times10\ \mu\text{m} = 0{,}40\ \text{mm}\), vue à travers l'oculaire sous \(\alpha' = 0{,}40/25 = 0{,}016\ \text{rad}\). À l'œil nu, à 250 mm : \(\alpha = 0{,}010/250 = 4{,}0\times10^{-5}\ \text{rad}\). Grossissement : \(|G| = 0{,}016/4{,}0\times10^{-5} = 400\), soit \(|\gamma_1|\times d_m/f'_2 = 40\times10\).</p>
    <p><strong>Q3.</strong> Non : \(F'_1\) et \(F_2\) sont séparés de \(\Delta = 160\ \text{mm}\) ; un faisceau parallèle entrant ne ressort pas parallèle. Dans la lunette astronomique, au contraire, \(F'_1 = F_2\) (afocale) : elle reçoit des faisceaux parallèles et en rend. Dans les deux cas seule l'image finale est à l'infini.</p>
    <p><strong>Q4.</strong> \(|G| = (\Delta/f'_1)(d_m/f'_2)\) : on prend un objectif de plus courte focale (ou un tube plus long). La limite est la diffraction, qui empêche de séparer des détails plus petits que quelques dixièmes de micromètre en lumière visible : au-delà d'un grossissement d'environ 1 000, on agrandit du flou.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>L'appareil photographique d'un téléphone</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>optique géométrique : appareil photographique</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    On modélise la caméra principale d'un téléphone par une lentille mince convergente de distance focale \(f' = 4{,}25\ \text{mm}\), de nombre d'ouverture fixe \(N = f'/D = 1{,}8\) (\(D\) : diamètre du diaphragme), et un capteur plan de \(5{,}6\ \text{mm}\times4{,}2\ \text{mm}\) comptant \(4\,000\times3\,000\) pixels carrés. Un petit moteur déplace la lentille le long de l'axe pour la mise au point. On prend \(\lambda_0 = 550\ \text{nm}\).
  </div>

  <p class="exo-part">Partie A — Mise au point</p>
  <div class="q"><strong>A1.</strong> Où doit être le capteur pour photographier un paysage lointain ?</div>
  <div class="q"><strong>A2.</strong> Établir, à l'aide de la relation de Newton, le déplacement (tirage) de la lentille nécessaire pour photographier un document à \(x = 30\ \text{cm}\) de la lentille. Le calculer, ainsi que pour \(x = 10\ \text{cm}\).</div>
  <div class="q"><strong>A3.</strong> Le document fait 20 cm de large. Calculer le grandissement et la largeur de son image. Tient-elle sur le capteur ?</div>

  <p class="exo-part">Partie B — Champ et pixels</p>
  <div class="q"><strong>B1.</strong> Calculer le champ angulaire horizontal de la caméra. Quelle distance focale aurait un objectif donnant le même champ sur un capteur de 36 mm de large ?</div>
  <div class="q"><strong>B2.</strong> Calculer la taille d'un pixel et l'angle sous lequel un pixel « voit » la scène. Comparer à la limite de résolution angulaire de l'œil.</div>
  <div class="q"><strong>B3.</strong> Même parfaitement stigmatique, l'objectif donne d'un point une tache de diffraction de diamètre de l'ordre de \(2\lambda_0N\). La calculer et conclure.</div>

  <p class="exo-part">Partie C — Exposition</p>
  <div class="q"><strong>C1.</strong> Justifier que l'énergie reçue par unité de surface du capteur est proportionnelle à \(t/N^2\), où \(t\) est la durée d'exposition. Un appareil reflex réglé à \(N = 8\) photographie la même scène que le téléphone, qui pose 1/2 000 s. Quelle durée d'exposition faut-il au reflex ?</div>
  <div class="q"><strong>C2.</strong> À main levée, le téléphone tourne de 0,5° par seconde environ. Quelle durée d'exposition maximale évite que l'image ne se déplace de plus d'un pixel pendant la pose ?</div>

  <p class="exo-part">Partie D — Profondeur de champ</p>
  <div class="q"><strong>D1.</strong> Expliquer, à l'aide d'une construction, pourquoi un objet situé plus loin que le plan de mise au point donne sur le capteur une tache, et pourquoi cette tache rétrécit quand on ferme le diaphragme.</div>
  <div class="q"><strong>D2.</strong> On fait la mise au point sur un objet à la distance \(H\), et l'on tolère une tache de diamètre \(\varepsilon = 2\) pixels. Montrer que l'image d'un objet à l'infini est assez nette si \(\overline{F'A'_0} \leq \varepsilon N\), où \(A'_0\) est la position du capteur. En déduire la plus petite distance \(H\) (distance hyperfocale) assurant la netteté de l'infini, et la calculer.</div>
  <div class="q"><strong>D3.</strong> On admet que, mise au point faite sur \(H\), tout est net de \(H/2\) à l'infini. Comparer avec un reflex d'objectif \(f' = 50\ \text{mm}\) à \(N = 1{,}8\) pour lequel \(\varepsilon = 30\ \mu\text{m}\). Pourquoi les téléphones simulent-ils le flou d'arrière-plan par calcul ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> L'image d'un objet à l'infini est dans le plan focal image : capteur en \(F'\), à 4,25 mm de la lentille.</p>
    <p><strong>A2.</strong> Objet à la distance \(x\) : \(\overline{FA} = -(x - f')\). Newton : \(\overline{F'A'} = -f'^2/\overline{FA} = f'^2/(x - f')\). Le capteur étant fixe, la lentille doit s'en éloigner de ce tirage. Pour \(x = 300\ \text{mm}\) : \(4{,}25^2/295{,}75 = 0{,}061\ \text{mm} = 61\ \mu\text{m}\) ; pour \(x = 100\ \text{mm}\) : \(189\ \mu\text{m}\). Le moteur déplace la lentille de quelques dizaines de micromètres seulement.</p>
    <p><strong>A3.</strong> \(\gamma = f'/\overline{FA} = 4{,}25/(-295{,}75) = -0{,}0144\). Largeur de l'image : \(200\times0{,}0144 = 2{,}9\ \text{mm} \lt 5{,}6\ \text{mm}\) : elle tient sur le capteur (il reste de la marge).</p>
    <p><strong>B1.</strong> Le bord du champ est vu sous l'angle \(\theta\) tel que \(\tan\theta = (L/2)/f' = 2{,}8/4{,}25\) : champ \(2\theta = 66{,}8°\). Sur 36 mm, le même champ demande \(f' = 4{,}25\times36/5{,}6 = 27\ \text{mm}\) : un grand-angle modéré.</p>
    <p><strong>B2.</strong> Pixel : \(5{,}6\ \text{mm}/4\,000 = 1{,}4\ \mu\text{m}\). Angle correspondant : \(1{,}4\times10^{-3}/4{,}25 = 3{,}3\times10^{-4}\ \text{rad}\), du même ordre que la limite de résolution de l'œil (\(\approx 3\times10^{-4}\ \text{rad}\)) : une photo regardée en entier révèle à peu près les détails qu'aurait distingués l'œil.</p>
    <p><strong>B3.</strong> \(2\lambda_0N = 2\times0{,}55\times1{,}8 = 2{,}0\ \mu\text{m}\), soit environ 1,4 pixel : l'objectif est limité par la diffraction ; des pixels plus petits n'apporteraient aucun détail. Le stigmatisme exigé par un capteur aussi fin ne peut pas être meilleur que ce que permet la diffraction.</p>
    <p><strong>C1.</strong> La puissance qui entre est proportionnelle à l'aire du diaphragme \(\pi D^2/4\) ; pour un objet lointain, l'image d'une portion de scène a une aire proportionnelle à \(f'^2\) (dimensions \(\approx f'\alpha\)). L'éclairement du capteur est donc proportionnel à \((D/f')^2 = 1/N^2\), et l'énergie reçue par unité de surface à \(t/N^2\). À exposition égale : \(t_{\text{reflex}} = t\,(8/1{,}8)^2 = 19{,}8/2\,000 \approx 1/100\ \text{s}\).</p>
    <p><strong>C2.</strong> Une rotation \(\omega t\) déplace l'image de \(f'\omega t\). Il faut \(f'\omega t \leq 1{,}4\ \mu\text{m}\), avec \(\omega = 0{,}5° /\text{s} = 8{,}7\times10^{-3}\ \text{rad/s}\) :</p><div class="formula">$$t \leq \frac{1{,}4\times10^{-6}}{4{,}25\times10^{-3}\times8{,}7\times10^{-3}} = 0{,}038\ \text{s}$$</div><p>soit environ 1/25 s. Au-delà, il faut un stabilisateur.</p>
    <p><strong>D1.</strong> Le faisceau issu d'un point lointain, limité par le diaphragme, converge en son image \(A'\), située avant le capteur ; après \(A'\) il diverge et coupe le capteur selon une tache. Par triangles semblables (cône de base \(D\) et de hauteur \(\overline{OA'}\)), la tache a un diamètre \(D\,|\overline{A'A'_0}|/\overline{OA'}\), proportionnel à \(D\) : fermer le diaphragme la rétrécit (voir la construction du cours, §8).</p>
    <p><strong>D2.</strong> L'image d'un objet à l'infini est en \(F'\), le capteur en \(A'_0\), avec \(\overline{F'A'_0} > 0\) petit. La tache vaut \(D\,\overline{F'A'_0}/f' = \overline{F'A'_0}/N\) ; elle est acceptable si \(\overline{F'A'_0} \leq \varepsilon N\). Avec le tirage de A2 : \(f'^2/(H - f') \leq \varepsilon N\), soit \(H \geq f' + \dfrac{f'^2}{N\varepsilon}\). Ici \(\varepsilon = 2{,}8\ \mu\text{m}\) :</p><div class="formula">$$H = 4{,}25 + \frac{18{,}06}{1{,}8\times2{,}8\times10^{-3}} = 3{,}6\times10^{3}\ \text{mm} = 3{,}6\ \text{m}$$</div>
    <p><strong>D3.</strong> Le téléphone voit net de 1,8 m à l'infini. Pour le reflex :</p><div class="formula">$$H = 50 + \frac{2\,500}{1{,}8\times0{,}030} = 4{,}6\times10^{4}\ \text{mm} = 46\ \text{m}$$</div><p>Net seulement au-delà de 23 m. La très courte focale du téléphone lui donne une profondeur de champ énorme : un portrait y aurait un arrière-plan presque net, d'où le flou ajouté par calcul pour imiter l'esthétique des grands capteurs.</p>
  </div>
</div>
