  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre termine la partie 1.1 « Formation des images » du programme de PTSI : les lentilles minces dans l'approximation de Gauss, puis les modèles de l'œil et de l'appareil photographique. Il s'appuie sur « Optique géométrique — Les bases » (rayon lumineux, Snell-Descartes, stigmatisme, conditions de Gauss) et prépare les TP d'optique (formation d'images, mesure de distances focales). L'onglet « Simulateur » permet de déplacer un objet devant une lentille et de suivre la construction de son image.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Lentilles minces dans l'approximation de Gauss</strong> : définir les propriétés du centre optique (§1), des foyers principaux et secondaires, de la distance focale, de la vergence (§2).</li>
        <li><strong>Construire l'image</strong> d'un objet situé à distance finie ou infinie à l'aide de rayons lumineux, identifier sa nature réelle ou virtuelle (§3).</li>
        <li><strong>Exploiter les formules de conjugaison et de grandissement transversal</strong> de Descartes et de Newton (§4), y compris pour une association de lentilles (§6).</li>
        <li><strong>Établir et utiliser la condition de formation de l'image réelle d'un objet réel</strong> par une lentille convergente (§5).</li>
        <li><strong>L'œil</strong> : le modéliser comme l'association d'une lentille de vergence variable et d'un capteur plan fixe ; punctum proximum, punctum remotum ; citer les ordres de grandeur de la limite de résolution angulaire et de la plage d'accommodation (§7).</li>
        <li><strong>L'appareil photographique</strong> : le modéliser comme l'association d'une lentille et d'un capteur ; construire géométriquement la profondeur de champ pour un réglage donné ; étudier l'influence de la focale, de la durée d'exposition et du diaphragme sur la formation de l'image (§8).</li>
        <li><strong>Capacités expérimentales</strong> : former une image (éclairer l'objet, choisir les lentilles et leur focale, optimiser la qualité de l'image) ; estimer une distance focale ; régler et utiliser un collimateur et une lunette autocollimatrice ; mesurer une longueur par déplacement d'un viseur (§9).</li>
      </ul>
      <p>La loupe, la lunette astronomique et le microscope (§10) sont des <strong>exemples d'application laissés au choix de l'enseignant</strong> : aucune formule de grossissement n'est exigible ; il faut savoir les analyser avec les outils des §3 à §6. Hors programme (en fin de chapitre) : la formule des opticiens, les aberrations chromatiques et leur correction, les lentilles épaisses.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LES LENTILLES MINCES</div>
  <h2>Deux familles de lentilles et un point remarquable</h2>
  <div class="intro">Une lentille est le composant de base des lunettes, des objectifs, des projecteurs et de l'œil lui-même. On l'étudie dans un cadre simplifié, lentille mince utilisée dans les conditions de Gauss, où tout se ramène à trois points et à une distance.</div>
  <div class="def-box">
    <strong>Lentille, lentille mince.</strong> Une <strong>lentille sphérique</strong> est un bloc de matériau transparent limité par deux dioptres sphériques (ou un sphérique et un plan). La droite qui joint les centres des deux sphères est l'<strong>axe optique</strong>. La lentille est <strong>mince</strong> si son épaisseur est très petite devant les rayons de courbure de ses faces : ses deux sommets se confondent alors en un point, le <strong>centre optique</strong> \(O\).
  </div>
  <div class="prop-box">
    <strong>Convergente ou divergente.</strong> Une lentille en verre dans l'air est <strong>convergente</strong> si elle est plus mince au bord qu'au centre (biconvexe, plan-convexe, ménisque à bords minces) : elle fait converger un faisceau parallèle. Elle est <strong>divergente</strong> si elle est plus épaisse au bord (biconcave, plan-concave, ménisque à bords épais) : elle fait diverger un faisceau parallèle.
  </div>

  <div class="prop-box">
    <strong>Lentille mince dans les conditions de Gauss.</strong> Utilisée avec des rayons paraxiaux, une lentille mince est approximativement <strong>stigmatique</strong> et <strong>aplanétique</strong> : l'image d'un point est un point, l'image d'un objet plan perpendiculaire à l'axe est un plan perpendiculaire à l'axe. De plus, <strong>tout rayon qui passe par le centre optique \(O\) n'est pas dévié</strong> : au voisinage de \(O\), les deux faces sont presque parallèles, la lentille s'y comporte comme une lame mince à faces parallèles, dont le décalage latéral est négligeable.
  </div>
  <div class="method-box">
    <strong>Exemple — Une lentille est-elle mince ?</strong>
    <ol>
      <li>Une lentille biconvexe a des faces de rayon \(R = 10\ \text{cm}\) et un diamètre de 3,0 cm. Chaque face s'écarte du plan de son bord de \(R - \sqrt{R^2 - (1{,}5\ \text{cm})^2} = 1{,}1\ \text{mm}\) : la lentille fait environ 2,3 mm d'épaisseur au centre.</li>
      <li>2,3 mm est 40 fois plus petit que le rayon de courbure : le modèle de la lentille mince convient.</li>
      <li>Pour reconnaître une lentille sans mesure, on regarde un texte proche à travers elle : agrandi et droit, elle est convergente (effet loupe, §3) ; réduit et droit, elle est divergente.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer « bords minces, donc convergente » hors de l'air. La règle suppose une lentille plus réfringente que le milieu qui l'entoure : une bulle d'air biconvexe dans l'eau est divergente.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · FOYERS, DISTANCE FOCALE, VERGENCE</div>
  <h2>Ce que fait une lentille d'un faisceau parallèle</h2>
  <div class="intro">Une lentille mince est entièrement décrite par la position de ses foyers. On les définit à partir des faisceaux parallèles, qui modélisent la lumière venue d'un objet très éloigné (une étoile, un paysage).</div>
  <div class="def-box">
    <strong>Foyers principaux.</strong> Le <strong>foyer principal image</strong> \(F'\) est l'image d'un point objet situé à l'infini sur l'axe : un faisceau parallèle à l'axe converge en \(F'\) (ou semble en provenir). Le <strong>foyer principal objet</strong> \(F\) est le point de l'axe dont l'image est à l'infini : les rayons issus de \(F\) (ou dirigés vers lui) ressortent parallèles à l'axe. Pour une lentille mince dans l'air, \(F\) et \(F'\) sont symétriques par rapport à \(O\).
  </div>
  <div class="def-box">
    <strong>Distance focale, vergence.</strong> La <strong>distance focale image</strong> est la mesure algébrique \(f' = \overline{OF'}\) (l'axe étant orienté dans le sens de propagation de la lumière) ; la distance focale objet est \(f = \overline{OF} = -f'\). La <strong>vergence</strong> est
    <div class="formula" data-nom="Vergence d'une lentille mince">$$V = \frac{1}{f'}\qquad\text{en dioptries (1 δ = 1 m}^{-1})$$</div>
    Lentille convergente : \(f' > 0\), \(V > 0\), \(F'\) réel (après la lentille). Lentille divergente : \(f' \lt 0\), \(V \lt 0\), \(F'\) virtuel (avant la lentille).
  </div>
  <div class="def-box">
    <strong>Plans focaux, foyers secondaires.</strong> Les plans perpendiculaires à l'axe en \(F\) et \(F'\) sont les <strong>plans focaux</strong> objet et image. Un faisceau parallèle incliné sur l'axe converge (ou semble converger) en un point \(\varphi'\) du plan focal image, un <strong>foyer secondaire image</strong> : c'est le point où le plan focal image coupe le rayon du faisceau qui passe par \(O\) (non dévié). Symétriquement, les rayons issus d'un <strong>foyer secondaire objet</strong> \(\varphi\) du plan focal objet ressortent parallèles entre eux, parallèles à la droite \((\varphi O)\).
  </div>

  <div class="method-box">
    <strong>Exemple — L'image du Soleil</strong>
    <ol>
      <li>Des lunettes de vergence \(+2{,}5\ \delta\) ont une distance focale \(f' = 1/2{,}5 = 0{,}40\ \text{m}\).</li>
      <li>Une loupe de distance focale \(f' = 50\ \text{cm}\) est tournée vers le Soleil, vu sous un diamètre angulaire \(\alpha = 0{,}53° = 9{,}3\times10^{-3}\ \text{rad}\). Chaque point du Soleil envoie un faisceau parallèle, qui converge en un foyer secondaire du plan focal image : l'image du Soleil est un disque de diamètre \(f'\alpha = 0{,}50\times9{,}3\times10^{-3} = 4{,}6\ \text{mm}\), dans le plan focal image.</li>
      <li>Toute la puissance reçue par la lentille (diamètre 5 cm, par exemple) se concentre sur ce petit disque : l'éclairement y est multiplié par \((50/4{,}6)^2 \approx 120\). D'où l'interdiction absolue d'observer le Soleil à travers un instrument.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : placer \(F'\) systématiquement après la lentille. Pour une lentille divergente, \(F'\) est <em>avant</em> la lentille (côté de la lumière incidente) et \(F\) après : c'est le signe de \(f'\) qui le dit.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CONSTRUIRE L'IMAGE D'UN OBJET</div>
  <h2>Trois rayons suffisent</h2>
  <div class="intro">Grâce au stigmatisme approché, il suffit de deux rayons issus d'un point objet pour trouver son image : leur intersection après la lentille. Trois rayons ont un trajet connu d'avance ; un quatrième, quelconque, se construit avec les foyers secondaires.</div>
  <div class="prop-box">
    <strong>Les trois rayons particuliers.</strong> Pour un point objet \(B\) hors de l'axe :
    <ol>
      <li>le rayon issu de \(B\) <strong>parallèle à l'axe</strong> ressort en passant par \(F'\) (ou en semblant venir de \(F'\)) ;</li>
      <li>le rayon issu de \(B\) qui passe par <strong>\(O\)</strong> n'est pas dévié ;</li>
      <li>le rayon issu de \(B\) qui passe par <strong>\(F\)</strong> (ou qui est dirigé vers \(F\)) ressort parallèle à l'axe.</li>
    </ol>
    L'image \(B'\) est à l'intersection des rayons émergents ou de leurs prolongements. Par aplanétisme, l'image \(A'\) du pied \(A\) de l'objet, sur l'axe, est le pied de la perpendiculaire à l'axe issue de \(B'\).
  </div>

  <h3>Objet à l'infini, rayon quelconque</h3>
  <p>Un objet à l'infini (une étoile, un paysage lointain) envoie, depuis chacun de ses points, un faisceau parallèle : son image est dans le <strong>plan focal image</strong>. Un objet vu sous l'angle \(\alpha\) a une image de taille \(f'\tan\alpha \approx f'\alpha\), lue sur le rayon non dévié qui passe par \(O\).</p>
  <p>Pour un rayon incident <strong>quelconque</strong>, on trace la parallèle à ce rayon passant par \(O\) : elle coupe le plan focal image en un foyer secondaire \(\varphi'\), par lequel passe le rayon émergent.</p>

  <h3>Images virtuelles</h3>

      <li>La construction donne la nature de l'image et un ordre de grandeur ; les relations de conjugaison (§4) donnent les valeurs exactes et confirment \(\overline{OA'} = 7{,}5\) et \(\gamma = -1{,}5\).</li>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Récapitulatif</span>
    <span class="prompt">Lentille convergente : où placer l'objet pour obtenir quelle image ?</span>
    <div class="content">
      <ul>
        <li>Objet réel à l'infini : image réelle dans le plan focal image.</li>
        <li>Objet réel au-delà de \(2F\) (\(\overline{OA} \lt -2f'\)) : image réelle, renversée, réduite, entre \(F'\) et le point symétrique de \(2F\).</li>
        <li>Objet réel en \(\overline{OA} = -2f'\) : image réelle, renversée, de même taille, en \(\overline{OA'} = 2f'\).</li>
        <li>Objet réel entre \(2F\) et \(F\) : image réelle, renversée, agrandie, au-delà de \(2f'\).</li>
        <li>Objet réel en \(F\) : image à l'infini.</li>
        <li>Objet réel entre \(F\) et \(O\) : image virtuelle, droite, agrandie (loupe).</li>
        <li>Objet virtuel (après la lentille) : image réelle, droite, réduite, entre \(O\) et \(F'\).</li>
      </ul>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : tracer en trait plein des rayons qui n'existent pas. Seuls les rayons effectivement parcourus par la lumière sont en trait plein ; les prolongements qui définissent une image ou un objet virtuels sont en tirets. Et le rayon « par \(F\) » d'une lentille divergente est un rayon <em>dirigé vers</em> \(F\), situé après la lentille.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · RELATIONS DE CONJUGAISON ET GRANDISSEMENT</div>
  <h2>Les formules de Descartes et de Newton</h2>
  <div class="intro">La construction donne l'allure ; le calcul donne les valeurs. Deux écritures équivalentes relient la position de l'image à celle de l'objet : l'une repère les points depuis le centre \(O\), l'autre depuis les foyers.</div>
  <div class="prop-box">
    <strong>Relations de Descartes (origine au centre).</strong> L'axe étant orienté dans le sens de la lumière, l'objet \(A\) et son image \(A'\) vérifient
    <div class="formula" data-nom="Relation de conjugaison de Descartes">$$\frac{1}{\overline{OA'}} - \frac{1}{\overline{OA}} = \frac{1}{f'} = V$$</div>
    et le <strong>grandissement transversal</strong> vaut
    <div class="formula" data-nom="Grandissement (Descartes)">$$\gamma = \frac{\overline{A'B'}}{\overline{AB}} = \frac{\overline{OA'}}{\overline{OA}}$$</div>
  </div>
  <div class="prop-box">
    <strong>Relations de Newton (origines aux foyers).</strong>
    <div class="formula" data-nom="Relation de conjugaison de Newton">$$\overline{FA}\cdot\overline{F'A'} = f\,f' = -f'^2$$</div>
    <div class="formula" data-nom="Grandissement (Newton)">$$\gamma = -\frac{\overline{F'A'}}{f'} = \frac{f'}{\overline{FA}}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Trois paires de triangles semblables</span>
    <div class="content">
      <p>Soit un objet \(AB\) perpendiculaire à l'axe et son image \(A'B'\).</p>
      <ol>
        <li>Le rayon \(BO\) n'est pas dévié : les triangles \(OAB\) et \(OA'B'\) sont semblables, d'où \(\gamma = \overline{A'B'}/\overline{AB} = \overline{OA'}/\overline{OA}\).</li>
        <li>Le rayon issu de \(B\) parallèle à l'axe frappe la lentille en \(I\), avec \(\overline{OI} = \overline{AB}\), puis passe par \(F'\) et \(B'\) : les triangles \(F'OI\) et \(F'A'B'\) sont semblables, d'où \(\gamma = \overline{F'A'}/\overline{F'O} = -\overline{F'A'}/f'\).</li>
        <li>Le rayon issu de \(B\) passant par \(F\) frappe la lentille en \(J\), avec \(\overline{OJ} = \overline{A'B'}\) : les triangles \(FAB\) et \(FOJ\) donnent \(\gamma = \overline{FO}/\overline{FA} = f'/\overline{FA}\).</li>
        <li>En égalant les expressions 2 et 3 : \(\overline{FA}\cdot\overline{F'A'} = -f'^2\) (Newton). En égalant 1 et 2 avec \(\overline{F'A'} = \overline{OA'} - f'\) : \(\overline{OA'}/\overline{OA} = 1 - \overline{OA'}/f'\) ; en divisant par \(\overline{OA'}\), on obtient la relation de Descartes.</li>
      </ol>
    </div>
  </div>

  <p>Le signe de \(\overline{OA}\) dit si l'objet est réel (\(\overline{OA} \lt 0\) : avant la lentille) ou virtuel ; celui de \(\overline{OA'}\), si l'image est réelle (\(\overline{OA'} > 0\)) ou virtuelle. Le signe de \(\gamma\) dit si l'image est droite (\(\gamma > 0\)) ou renversée, et \(|\gamma|\) si elle est agrandie ou réduite.</p>
  <div class="method-box">
    <strong>Exemple — Trois situations calculées</strong>
    <ol>
      <li>Lentille convergente, \(f' = 20\ \text{cm}\), objet réel à 30 cm : \(\overline{OA} = -30\ \text{cm}\). Descartes : \(1/\overline{OA'} = 1/20 - 1/30 = 1/60\), donc \(\overline{OA'} = 60\ \text{cm}\) et \(\gamma = 60/(-30) = -2\) : image réelle, renversée, deux fois plus grande.</li>
      <li>Vérification par Newton : \(\overline{FA} = \overline{OA} + f' = -10\ \text{cm}\), d'où \(\overline{F'A'} = -f'^2/\overline{FA} = 40\ \text{cm}\) (soit \(\overline{OA'} = 60\ \text{cm}\)) et \(\gamma = f'/\overline{FA} = -2\).</li>
      <li>Lentille divergente, \(f' = -20\ \text{cm}\), même objet : \(1/\overline{OA'} = -1/20 - 1/30 = -1/12\), \(\overline{OA'} = -12\ \text{cm}\), \(\gamma = 0{,}4\) : image virtuelle, droite, réduite.</li>
      <li>Objet virtuel : un faisceau convergeant vers un point situé 10 cm après la lentille convergente (\(\overline{OA} = +10\ \text{cm}\)). \(1/\overline{OA'} = 1/20 + 1/10\), \(\overline{OA'} = 6{,}7\ \text{cm}\), \(\gamma = 0{,}67\) : image réelle, droite, réduite.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\overline{OA} = +30\ \text{cm}\) pour un objet réel placé 30 cm avant la lentille, ou oublier que \(f' \lt 0\) pour une lentille divergente. Contrôle utile : comparer le résultat à la construction (§3) ; et dans la relation de Newton, le grandissement est \(f'/\overline{FA}\), sans signe moins.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · IMAGE RÉELLE D'UN OBJET RÉEL</div>
  <h2>La condition D ≥ 4f′</h2>
  <div class="intro">Projeter une image sur un écran (projecteur, TP sur banc d'optique) demande une image réelle d'un objet réel. Ce n'est possible qu'avec une lentille convergente, et seulement si l'écran est assez loin de l'objet.</div>
  <p><strong>Établissons la condition.</strong> Notons \(p = -\overline{OA} > 0\) la distance objet-lentille et \(p' = \overline{OA'} > 0\) la distance lentille-image (objet et image réels). La relation de Descartes s'écrit \(\dfrac{1}{p'} + \dfrac{1}{p} = \dfrac{1}{f'}\) ; elle impose \(f' > 0\) (lentille convergente) et \(p > f'\) (objet au-delà de \(F\)). Avec \(D = p + p'\), distance objet-écran, on obtient \(p\,p' = f'D\), donc \(p\) et \(p'\) sont les racines du trinôme</p>
  <div class="formula">$$p^2 - D\,p + D\,f' = 0$$</div>
  <p>Des racines réelles existent si et seulement si le discriminant \(D^2 - 4Df'\) est positif ou nul.</p>
  <div class="prop-box">
    <strong>Condition de formation d'une image réelle.</strong> Une lentille convergente de distance focale \(f'\) forme sur un écran l'image réelle d'un objet réel si et seulement si la distance objet-écran vérifie
    <div class="formula" data-nom="Image réelle d'un objet réel">$$D \geq 4f'$$</div>
    Pour \(D > 4f'\), il existe <strong>deux positions</strong> de la lentille, symétriques par rapport au milieu de l'objet et de l'écran (on échange \(p\) et \(p'\)), séparées de \(d = \sqrt{D^2 - 4Df'}\). Pour \(D = 4f'\), une seule : \(p = p' = 2f'\) et \(\gamma = -1\).
  </div>

<figcaption>Distance objet-écran \(D = p + p'\) en fonction de la distance objet-lentille \(p\), pour une image réelle donnée par une lentille convergente (\(D/f' = x^2/(x-1)\) avec \(x = p/f'\)). \(D\) ne descend pas sous \(4f'\), atteint pour \(p = 2f'\). Pour un écran placé à \(D > 4f'\) (ici \(5f'\)), deux positions de la lentille, séparées de \(d\), donnent une image nette.</figcaption>
</figure>
  <p>On en tire une méthode de mesure de la distance focale (<strong>méthode de Bessel</strong>) : on mesure \(D\) et l'écart \(d\) entre les deux positions nettes, puis</p>
  <div class="formula" data-nom="Méthode de Bessel">$$f' = \frac{D^2 - d^2}{4D}$$</div>
  <div class="method-box">
    <strong>Exemple — Placer la lentille sur le banc</strong>
    <ol>
      <li>Objet et écran sont à \(D = 1{,}00\ \text{m}\) l'un de l'autre ; la lentille a \(f' = 20\ \text{cm}\). Comme \(D > 4f' = 80\ \text{cm}\), on peut former une image.</li>
      <li>\(d = \sqrt{100^2 - 4\times100\times20} = 44{,}7\ \text{cm}\) : la lentille doit être à \(p = (D - d)/2 = 27{,}6\ \text{cm}\) ou à \(p = (D + d)/2 = 72{,}4\ \text{cm}\) de l'objet.</li>
      <li>Grandissements \(\gamma = -p'/p\) : \(-72{,}4/27{,}6 = -2{,}62\) (image agrandie) ou \(-0{,}382\) (image réduite) ; leur produit vaut 1.</li>
      <li>Avec une lentille de \(f' = 30\ \text{cm}\), il faudrait \(D \geq 1{,}20\ \text{m}\) : sur un banc de 1 m, aucune image nette n'est possible.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : chercher désespérément une image nette sur l'écran avec une lentille trop longue focale, ou avec une lentille divergente. Le premier réflexe en TP : vérifier que \(D \geq 4f'\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · ASSOCIER DEUX LENTILLES</div>
  <h2>Image intermédiaire et lentilles accolées</h2>
  <div class="intro">Les instruments réels (objectifs, lunettes, microscopes) associent plusieurs lentilles. Pas de formule nouvelle : on enchaîne les relations du §4, l'image donnée par la première lentille servant d'objet à la seconde.</div>
  <div class="prop-box">
    <strong>Association de deux lentilles.</strong> Si \(L_1\) donne de \(A\) l'image \(A_1\), et \(L_2\) donne de \(A_1\) l'image \(A'\), on écrit
    <div class="formula">$$A \xrightarrow{\ L_1\ } A_1 \xrightarrow{\ L_2\ } A'\qquad\qquad \gamma = \gamma_1\,\gamma_2$$</div>
    Chaque relation de conjugaison s'écrit avec le centre et la focale de la lentille concernée. Si \(A_1\) est situé après \(L_2\), c'est pour \(L_2\) un <strong>objet virtuel</strong>.
  </div>
  <div class="prop-box">
    <strong>Lentilles minces accolées.</strong> Deux lentilles minces accolées (même centre \(O\)) équivalent à une lentille mince de vergence
    <div class="formula" data-nom="Lentilles accolées">$$V = V_1 + V_2$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Les vergences s'ajoutent</span>
    <div class="content"><p>Avec le même centre \(O\) : \(\dfrac{1}{\overline{OA_1}} - \dfrac{1}{\overline{OA}} = V_1\) et \(\dfrac{1}{\overline{OA'}} - \dfrac{1}{\overline{OA_1}} = V_2\). En ajoutant membre à membre, \(\dfrac{1}{\overline{OA'}} - \dfrac{1}{\overline{OA}} = V_1 + V_2\) : c'est la relation de conjugaison d'une lentille de vergence \(V_1 + V_2\).</p></div>
  </div>
  <div class="def-box">
    <strong>Système afocal.</strong> Une association de deux lentilles est <strong>afocale</strong> si le foyer image de la première coïncide avec le foyer objet de la seconde (\(F'_1 = F_2\)) : un faisceau parallèle en ressort parallèle. Un objet à l'infini a son image à l'infini ; le système n'a pas de foyer. La lunette astronomique réglée à l'infini en est l'exemple type (§10).
  </div>
  <div class="method-box">
    <strong>Exemple — Deux lentilles convergentes</strong>
    <ol>
      <li>\(L_1\) (\(f'_1 = 10\ \text{cm}\)) et \(L_2\) (\(f'_2 = 20\ \text{cm}\)) sont distantes de 40 cm ; un objet réel est à 15 cm avant \(L_1\).</li>
      <li>Par \(L_1\) : \(1/\overline{O_1A_1} = 1/10 - 1/15 = 1/30\), \(\overline{O_1A_1} = 30\ \text{cm}\), \(\gamma_1 = -2\). L'image intermédiaire est 10 cm avant \(L_2\) : \(\overline{O_2A_1} = -10\ \text{cm}\).</li>
      <li>Par \(L_2\) : \(1/\overline{O_2A'} = 1/20 - 1/10 = -1/20\), \(\overline{O_2A'} = -20\ \text{cm}\), \(\gamma_2 = 2\) : \(L_2\) joue le rôle d'une loupe.</li>
      <li>Image finale virtuelle, 20 cm avant \(L_2\), renversée et agrandie : \(\gamma = \gamma_1\gamma_2 = -4\).</li>
      <li>Lentilles accolées de \(+5\ \delta\) et \(-2\ \delta\) : \(V = +3\ \delta\), \(f' = 33\ \text{cm}\). C'est ainsi qu'on mesure la focale d'une lentille divergente : on l'accole à une convergente plus puissante, connue (§9).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la relation de conjugaison de \(L_2\) avec des distances mesurées depuis \(O_1\). Chaque relation utilise <em>son</em> centre : \(\overline{O_2A_1} = \overline{O_2O_1} + \overline{O_1A_1}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · L'ŒIL</div>
  <h2>Une lentille de vergence variable devant un capteur fixe</h2>
  <div class="intro">L'œil forme sur la rétine une image réelle et renversée de ce qu'il regarde ; le cerveau la redresse. Pour voir net à toutes les distances, il ne déplace pas son capteur, comme un appareil photo : il change la vergence de sa lentille.</div>
  <div class="def-box">
    <strong>Modèle de l'œil.</strong> L'œil est modélisé par une <strong>lentille mince convergente de vergence variable</strong> (cornée et cristallin) et un <strong>capteur plan fixe</strong> (la rétine), situé à une distance fixe \(d \approx 17\ \text{mm}\) de la lentille. L'<strong>accommodation</strong> est l'augmentation de la vergence, par contraction des muscles qui bombent le cristallin, qui ramène sur la rétine l'image d'un objet proche.
  </div>
  <div class="def-box">
    <strong>Punctum remotum, punctum proximum.</strong> Le <strong>punctum remotum</strong> (PR) est le point le plus éloigné vu net (œil au repos, sans accommoder) ; le <strong>punctum proximum</strong> (PP) est le point le plus proche vu net (accommodation maximale). Pour un œil normal (<strong>emmétrope</strong>), le PR est à l'infini ; le PP est à 25 cm environ (valeur conventionnelle, qui varie avec l'âge : une dizaine de centimètres chez l'enfant, plus d'un mètre après 60 ans).
  </div>
  <div class="prop-box">
    <strong>Ordres de grandeur à connaître.</strong>
    <ul>
      <li><strong>Plage d'accommodation</strong> : de l'infini à 25 cm environ pour un œil normal, soit une variation de vergence \(\Delta V = 1/d_{PP} - 1/d_{PR} \approx 4\ \delta\) (jusqu'à 10 δ chez l'enfant).</li>
      <li><strong>Limite de résolution angulaire</strong> : l'œil sépare deux points vus sous un angle supérieur à environ \(1' \approx 3\times10^{-4}\ \text{rad}\). Elle est fixée à la fois par l'écart entre les cellules de la rétine (5 µm environ, vus du centre optique sous \(5\ \mu\text{m}/17\ \text{mm} \approx 3\times10^{-4}\ \text{rad}\)) et par la diffraction par la pupille.</li>
    </ul>
  </div>

  <h3>Défauts de l'œil et corrections</h3>
  <ul>
    <li><strong>Myopie</strong> : œil trop convergent (ou trop long) ; au repos, l'image d'un objet à l'infini se forme avant la rétine. Le PR est à distance finie, le PP plus proche que la normale. Correction : une lentille <strong>divergente</strong> dont le foyer image est au PR.</li>
    <li><strong>Hypermétropie</strong> : œil pas assez convergent ; l'œil doit accommoder même pour l'infini, et le PP est éloigné. Correction : lentille <strong>convergente</strong>.</li>
    <li><strong>Presbytie</strong> : perte d'accommodation avec l'âge, le PP s'éloigne. Correction pour la vision de près : lentille <strong>convergente</strong> (verres de lecture, verres progressifs).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — Vergences de l'œil et corrections</strong>
    <ol>
      <li>Œil normal au repos : l'image d'un objet à l'infini est au foyer, donc \(V = 1/d = 1/0{,}017 = 59\ \delta\). Pour voir net au PP (25 cm), il faut \(V = 1/d - 1/\overline{OA} = 59 + 4{,}0 = 63\ \delta\) : la plage d'accommodation est de 4 δ.</li>
      <li>Un myope a son PR à 40 cm. Une lentille de contact (accolée à l'œil) doit donner d'un objet à l'infini une image au PR : son foyer image est au PR, \(f' = -0{,}40\ \text{m}\), \(V = -2{,}5\ \delta\).</li>
      <li>Un presbyte a son PP à 1,0 m et veut lire à 25 cm : la lentille doit donner du texte (\(\overline{OA} = -0{,}25\ \text{m}\)) une image virtuelle au PP (\(\overline{OA'} = -1{,}0\ \text{m}\)) : \(V = -1/1{,}0 + 1/0{,}25 = +3{,}0\ \delta\).</li>
      <li>Résolution : deux phares séparés de 1,5 m sont distingués tant qu'ils sont vus sous plus de \(3\times10^{-4}\ \text{rad}\), soit jusqu'à \(1{,}5/3\times10^{-4} = 5\ \text{km}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que le cristallin se déplace pour faire la mise au point, ou que la rétine recule. Dans le modèle (et dans la réalité), la distance lentille-rétine est fixe : seule la vergence varie. C'est l'inverse de l'appareil photographique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · L'APPAREIL PHOTOGRAPHIQUE</div>
  <h2>Mise au point, focale, diaphragme et temps de pose</h2>
  <div class="intro">Un appareil photographique, celui d'un téléphone compris, forme une image réelle sur un capteur. Quatre réglages décident de l'image : la mise au point, la distance focale, l'ouverture du diaphragme et la durée d'exposition.</div>
  <div class="def-box">
    <strong>Modèle de l'appareil photographique.</strong> L'objectif est modélisé par une <strong>lentille mince convergente</strong> de distance focale \(f'\), le capteur (matrice de pixels) par un <strong>écran plan</strong> perpendiculaire à l'axe, à une distance réglable de la lentille. Un <strong>diaphragme</strong> de diamètre \(D\) limite le faisceau ; un <strong>obturateur</strong> laisse entrer la lumière pendant la durée d'exposition \(t\).
  </div>
  <h3>Mise au point</h3>
  <p>Pour un objet à l'infini, le capteur est dans le plan focal image. Pour un objet à la distance \(x\) de la lentille, il faut l'éloigner de \(F'\) du <strong>tirage</strong> \(\overline{F'A'}\), donné par la relation de Newton avec \(\overline{FA} = -(x - f')\) :</p>
  <div class="formula" data-nom="Tirage d'un objectif">$$\overline{F'A'} = \frac{f'^2}{x - f'}$$</div>
  <p>Contrairement à l'œil, l'appareil photographique garde sa focale et déplace l'objectif par rapport au capteur.</p>
  <h3>Influence de la focale : grandissement et champ</h3>
  <p>Un objet lointain vu sous l'angle \(\alpha\) a une image de taille \(f'\alpha\) : l'image est proportionnelle à la focale. Le capteur ayant une taille fixe \(L\), le <strong>champ</strong> photographié (l'angle sous lequel on voit la scène qui tient sur le capteur) vaut \(2\arctan\big(L/(2f')\big)\) : plus la focale est courte, plus le champ est large. Pour un capteur de 36 mm de large : 74° à \(f' = 24\ \text{mm}\) (grand-angle), 40° à 50 mm, 10° à 200 mm (téléobjectif).</p>
  <h3>Diaphragme et durée d'exposition</h3>
  <p>On repère l'ouverture par le <strong>nombre d'ouverture</strong> \(N = f'/D\). La puissance lumineuse qui entre est proportionnelle à l'aire \(\pi D^2/4\) du diaphragme, et l'image a une aire proportionnelle à \(f'^2\) : l'éclairement du capteur varie comme \((D/f')^2 = 1/N^2\). L'énergie reçue par unité de surface du capteur, qui décide de l'exposition de la photo, est donc proportionnelle à</p>
  <div class="formula" data-nom="Exposition d'une photographie">$$\frac{t}{N^2}$$</div>
  <p>Les valeurs de \(N\) se suivent d'un facteur \(\sqrt2\) (1,4 ; 2 ; 2,8 ; 4 ; 5,6 ; 8 ; 11 ; 16) : fermer d'un cran divise la lumière par deux, ce que l'on compense en doublant \(t\). Une durée d'exposition longue rend flous les objets en mouvement (et les photos prises à main levée : flou de bougé) ; une durée courte les fige.</p>
  <h3>Profondeur de champ</h3>
  <p>Seuls les points situés à la distance de mise au point ont une image ponctuelle sur le capteur. Un point plus proche a son image derrière le capteur, un point plus lointain devant : le capteur coupe leur cône de lumière selon une tache. L'image paraît nette tant que cette tache ne dépasse pas une taille \(\varepsilon\) fixée par le détecteur (un pixel, ou 30 µm pour un tirage papier usuel d'un capteur de 24 × 36 mm). La <strong>profondeur de champ</strong> est la zone de l'espace objet vue nette.</p>

  <div class="prop-box">
    <strong>Construire la profondeur de champ.</strong> Mise au point faite sur \(A_0\) (image \(A'_0\) sur le capteur). Pour un point \(A\) de l'axe d'image \(A'\), on trace le cône de sommet \(A'\) qui s'appuie sur le bord du diaphragme ; par triangles semblables, il découpe sur le capteur une tache de diamètre
    <div class="formula" data-nom="Tache de défocalisation">$$\varepsilon_A = D\,\frac{|\overline{A'_0A'}|}{|\overline{OA'}|}$$</div>
    Les limites \(A_1\) (proche) et \(A_2\) (lointaine) de la profondeur de champ sont les points dont la tache vaut \(\varepsilon\). La profondeur de champ <strong>augmente</strong> quand on ferme le diaphragme (\(D\) diminue, \(N\) augmente), quand la focale diminue, et quand l'objet de la mise au point s'éloigne.
  </div>
  <div class="method-box">
    <strong>Exemple — Un portrait, puis un paysage</strong>
    <ol>
      <li>Objectif \(f' = 50\ \text{mm}\), objet à \(x = 2{,}0\ \text{m}\) : tirage \(f'^2/(x - f') = 2500/1950 = 1{,}28\ \text{mm}\). À 0,50 m, il faut 5,6 mm : la mise au point rapprochée demande un grand déplacement.</li>
      <li>Portrait à 3,0 m, \(\varepsilon = 30\ \mu\text{m}\). À \(N = 2{,}8\) (\(D = 18\ \text{mm}\)), le calcul de la tache donne une zone nette de 2,73 m à 3,33 m : 60 cm seulement, le fond est flou et le visage ressort.</li>
      <li>À \(N = 11\), la zone nette s'étend de 2,16 m à 4,91 m (2,75 m) ; il faut une durée d'exposition \((11/2{,}8)^2 \approx 15\) fois plus longue (par exemple 1/60 s au lieu de 1/1 000 s).</li>
      <li>Un téléphone (\(f' \approx 4\ \text{mm}\)) a, à cadrage égal, une profondeur de champ bien plus grande : presque tout est net, et le flou d'arrière-plan des portraits y est fabriqué par calcul.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que fermer le diaphragme est gratuit. Il faut allonger la durée d'exposition (risque de flou de bougé) ou augmenter la sensibilité (image bruitée) ; et aux très grands nombres d'ouverture, la diffraction par le petit diaphragme élargit la tache (diamètre de l'ordre de \(2\lambda_0 N\), soit 12 µm à \(N = 11\) et 24 µm à \(N = 22\)) : c'est une limite de l'optique géométrique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · EN TP : FORMER UNE IMAGE, MESURER UNE FOCALE</div>
  <h2>Sur le banc d'optique</h2>
  <div class="intro">Le programme demande de savoir former une image de bonne qualité, choisir ses lentilles, estimer et mesurer une distance focale, et régler collimateur et lunette autocollimatrice. Voici les gestes et les méthodes, que l'on combine avec le chapitre « Mesures et incertitudes ».</div>
  <h3>Former une bonne image</h3>
  <ul>
    <li><strong>Éclairer l'objet</strong> (une lettre ou une mire découpée dans un cache, sur un verre dépoli) avec une lampe et un <strong>condenseur</strong> (lentille convergente de courte focale) qui fait converger la lumière vers la lentille de projection : l'image est lumineuse et uniformément éclairée.</li>
    <li><strong>Choisir la lentille</strong> : pour une image réelle sur un écran à la distance \(D\) de l'objet, il faut une lentille convergente avec \(f' \leq D/4\) (§5) ; une petite focale donne une image plus grande à distance fixe.</li>
    <li><strong>Respecter les conditions de Gauss</strong> : aligner les centres des composants sur l'axe du banc, utiliser des objets petits, diaphragmer si les bords de l'image sont flous ou irisés.</li>
    <li><strong>Mettre au point</strong> : la netteté varie peu autour de la bonne position (latitude de mise au point) ; on repère les deux positions où l'image commence à devenir floue et on prend leur milieu.</li>
  </ul>
  <h3>Mesurer une distance focale (focométrie)</h3>
  <ul>
    <li><strong>Estimation rapide</strong> : former l'image d'un objet très éloigné (fenêtre, lampe du plafond) ; l'image est presque dans le plan focal image : \(f' \approx \overline{OA'}\). Pour un objet à 5 m et \(f' = 20\ \text{cm}\), l'erreur est de 0,8 cm (4 %).</li>
    <li><strong>Autocollimation</strong> : on place un miroir plan juste derrière la lentille, et l'on déplace la lentille jusqu'à ce qu'une image nette et renversée se forme dans le plan même de l'objet ; l'objet est alors dans le plan focal objet, et \(f'\) est la distance objet-lentille (figure). Le même principe sert à <strong>régler un collimateur</strong> (objet au foyer d'une lentille : il en sort un faisceau parallèle, objet « à l'infini ») et une <strong>lunette autocollimatrice</strong>, réglée pour voir net à l'infini.</li>
    <li><strong>Méthode de Bessel</strong> (§5) : \(f' = (D^2 - d^2)/(4D)\) ; <strong>méthode de Silbermann</strong> : on cherche la distance minimale \(D = 4f'\), pour laquelle \(\gamma = -1\).</li>
    <li><strong>Relation de conjugaison</strong> : on mesure plusieurs couples \((\overline{OA}, \overline{OA'})\) ; les points \((1/\overline{OA}, 1/\overline{OA'})\) s'alignent sur une droite de pente 1 et d'ordonnée à l'origine \(V\), obtenue par régression linéaire.</li>
    <li><strong>Lentille divergente</strong> : on l'accole à une lentille convergente plus puissante, de vergence connue \(V_1\) ; on mesure la vergence \(V\) de l'ensemble (convergent) et \(V_2 = V - V_1\) (§6).</li>
  </ul>

  <p>Pour <strong>mesurer une longueur</strong> (position d'une image, épaisseur), on utilise un <strong>viseur à frontale fixe</strong> : une petite lunette qui ne voit net qu'à une distance fixe devant elle. On la déplace sur le banc jusqu'à voir net le premier point, puis le second ; la longueur cherchée est le déplacement du viseur, lu sur la règle du banc.</p>
  <div class="method-box">
    <strong>Exemple — Méthode de Bessel</strong>
    <ol>
      <li>Objet et écran sont distants de \(D = 120{,}0\ \text{cm}\). Les deux positions nettes de la lentille sont séparées de \(d = 62{,}0\ \text{cm}\).</li>
      <li>\(f' = \dfrac{120{,}0^2 - 62{,}0^2}{4\times120{,}0} = \dfrac{14\,400 - 3\,844}{480} = 22{,}0\ \text{cm}\).</li>
      <li>Contrôle : \(D = 120\ \text{cm} > 4f' = 88\ \text{cm}\). La latitude de mise au point (quelques millimètres sur chaque position) domine l'incertitude ; son effet sur \(f'\) se chiffre par la méthode de Monte-Carlo du chapitre « Mesures et incertitudes ».</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre, en autocollimation, l'image nette renvoyée par le miroir avec les reflets parasites sur les faces de la lentille, qui existent même sans miroir. On vérifie en masquant le miroir : la bonne image disparaît.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · INSTRUMENTS : LOUPE, LUNETTE, MICROSCOPE</div>
  <h2>Des exemples à analyser, pas des formules à apprendre</h2>
  <div class="intro">Le programme cite la lunette, le microscope et l'optique d'un smartphone comme des applications laissées au choix de l'enseignant. Rien de ce paragraphe n'est à connaître par cœur : tout se retrouve avec les constructions (§3) et les relations de conjugaison (§4, §6). Ce sont des sujets d'exercice et de concours fréquents.</div>
  <div class="def-box">
    <strong>Grossissement.</strong> Un instrument d'observation à l'œil fait voir un objet sous un angle \(\alpha'\) plus grand que l'angle \(\alpha\) sous lequel l'œil le verrait sans instrument. Son <strong>grossissement</strong> est \(G = \alpha'/\alpha\). Pour que l'œil normal observe sans fatigue (sans accommoder), on règle l'instrument pour que l'image finale soit à l'infini.
  </div>
  <h3>La loupe</h3>
  <p>Une lentille convergente de courte focale ; l'objet est placé entre \(F\) et \(O\) (image virtuelle droite agrandie), ou en \(F\) pour une image à l'infini. Alors l'œil voit l'objet sous l'angle \(\alpha' = AB/f'\), au lieu de \(\alpha = AB/d_m\) à l'œil nu au plus près (\(d_m = 25\ \text{cm}\), PP conventionnel) : le <strong>grossissement commercial</strong> vaut \(G_c = d_m/f'\). Une loupe de \(f' = 2{,}5\ \text{cm}\) est marquée « ×10 ».</p>
  <h3>La lunette astronomique</h3>
  <p>Un objectif de grande focale \(f'_1\) forme dans son plan focal image l'image \(A_1B_1\) d'un astre ; un oculaire de courte focale \(f'_2\) l'observe comme une loupe. Réglée à l'infini, la lunette est <strong>afocale</strong> : \(F'_1 = F_2\). L'astre est vu à l'œil nu sous \(\alpha\) ; \(A_1B_1 = -f'_1\alpha\) (renversée), vue à travers l'oculaire sous \(\alpha' = \overline{A_1B_1}/f'_2\), d'où</p>
  <div class="formula">$$G = \frac{\alpha'}{\alpha} = -\frac{f'_1}{f'_2}$$</div>
  <p>Le signe moins traduit une image renversée (sans gêne pour l'astronome). Exemple : \(f'_1 = 900\ \text{mm}\), \(f'_2 = 10\ \text{mm}\), \(|G| = 90\) : la Lune (0,52°) est vue sous 47°.</p>

  <h3>Le microscope</h3>
  <p>Un objectif de très courte focale \(f'_1\) (quelques millimètres) donne d'un petit objet, placé un peu avant son foyer objet, une image intermédiaire réelle, renversée et très agrandie \(A_1B_1\) ; l'oculaire (focale \(f'_2\)) l'observe comme une loupe. Pour une image finale à l'infini, \(A_1B_1\) est dans le plan focal objet de l'oculaire. Le foyer image de l'objectif et le foyer objet de l'oculaire sont séparés par l'<strong>intervalle optique</strong> \(\Delta = \overline{F'_1F_2}\) (environ 16 cm) : le microscope <strong>n'est pas afocal</strong>, il a bien des foyers. La relation de Newton donne \(\gamma_1 = -\overline{F'_1A_1}/f'_1 = -\Delta/f'_1\), et l'oculaire apporte le grossissement commercial \(d_m/f'_2\) :</p>
  <div class="formula">$$|G| = \frac{\Delta}{f'_1}\cdot\frac{d_m}{f'_2}$$</div>

    <strong>Exemple — Un microscope d'enseignement</strong>
    <ol>
      <li>\(f'_1 = 4\ \text{mm}\), \(f'_2 = 25\ \text{mm}\), \(\Delta = 160\ \text{mm}\) : \(\gamma_1 = -160/4 = -40\) et \(G_{c2} = 250/25 = 10\), d'où \(|G| = 400\).</li>
      <li>Position de l'objet : Newton pour l'objectif, \(\overline{F_1A} = -{f'_1}^2/\overline{F'_1A_1}\), soit \(\overline{F_1A} = -16/160 = -0{,}1\ \text{mm}\) : l'objet est à un dixième de millimètre avant \(F_1\). La mise au point se fait au micromètre près : c'est pourquoi un microscope a une vis de réglage fin.</li>
      <li>La diffraction limite la plus petite distance séparable à quelques dixièmes de micromètre en lumière visible : grossir plus de 1 000 fois n'apporte rien.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dire que le microscope est, comme la lunette, un système afocal. La lunette observe des objets à l'infini et donne une image à l'infini (\(F'_1 = F_2\)) ; le microscope observe un objet proche, et son intervalle optique \(\Delta\) n'est pas nul. Seule l'image finale est à l'infini dans les deux cas.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>D'où vient la focale, et pourquoi les objectifs sont compliqués</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI.</div>
  <h3>Formule des opticiens</h3>
  <p>La vergence d'une lentille mince d'indice \(n\), dans l'air, se déduit des rayons de courbure algébriques \(R_1 = \overline{S_1C_1}\) et \(R_2 = \overline{S_2C_2}\) de ses faces (sommet vers centre, axe orienté dans le sens de la lumière) : \(V = (n - 1)\left(\dfrac{1}{R_1} - \dfrac{1}{R_2}\right)\). Une lentille biconvexe symétrique en verre (\(n = 1{,}5\), \(R_1 = +10\ \text{cm}\), \(R_2 = -10\ \text{cm}\)) a \(V = 0{,}5\times20 = 10\ \delta\), soit \(f' = 10\ \text{cm}\).</p>
  <h3>Aberrations chromatiques</h3>
  <p>L'indice du verre dépendant de la longueur d'onde, la formule précédente montre que la focale aussi : une lentille simple a son foyer bleu plus près d'elle que son foyer rouge. On corrige ce défaut en accolant une lentille convergente en verre peu dispersif (crown) et une lentille divergente en verre très dispersif (flint) : c'est le <strong>doublet achromatique</strong>, base de tous les objectifs de qualité, qui associent ensuite de nombreuses lentilles pour corriger aussi les aberrations géométriques.</p>
  <h3>Ce que la 2ᵉ année ajoute</h3>
  <p>En PT, la lentille est décrite en termes d'ondes : un faisceau parallèle est une onde plane, que la lentille transforme en onde sphérique convergeant au foyer ; et le chemin optique entre deux points conjugués ne dépend pas du rayon suivi. Les lentilles épaisses et les systèmes centrés quelconques se décrivent, eux, avec des foyers et des plans principaux.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · OPTIQUE — LENTILLES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent la fin de la partie 1.1 du programme : construire une image, utiliser les relations de Descartes et de Newton, choisir et placer une lentille pour projeter, enchaîner deux lentilles, modéliser l'œil et l'appareil photographique, mesurer une distance focale. La dernière, sur les instruments, sert aux exercices d'application (non exigible en tant que telle).</div>

  <div class="method-box"><strong>Méthode 1 — Construire l'image d'un objet par une lentille mince</strong>
    <ol>
      <li><span class="step">Placer</span> le centre \(O\), les foyers \(F\) et \(F'\) à l'échelle (attention : pour une lentille divergente, \(F'\) est avant la lentille), et l'objet \(AB\).</li>
      <li><span class="step">Tracer deux des trois rayons particuliers</span> issus de \(B\) : parallèle à l'axe → émerge par \(F'\) ; par \(O\) → non dévié ; par \(F\) (ou vers \(F\)) → émerge parallèle à l'axe.</li>
      <li><span class="step">Trouver \(B'\)</span> à l'intersection des émergents, ou de leurs prolongements en tirets si les émergents divergent (image virtuelle) ; \(A'\) est le pied de la perpendiculaire à l'axe issue de \(B'\).</li>
      <li><span class="step">Conclure</span> : réelle ou virtuelle, droite ou renversée, agrandie ou réduite ; vérifier avec le troisième rayon.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f' = 4\ \text{cm}\), objet de 1 cm à 6 cm avant la lentille : on lit une image réelle à 12 cm après la lentille, renversée, de 2 cm (\(\gamma = -2\)), ce que confirme Descartes.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Construire l'émergent d'un rayon quelconque</strong>
    <ol>
      <li><span class="step">Tracer le plan focal image</span> (perpendiculaire à l'axe en \(F'\)).</li>
      <li><span class="step">Tracer la parallèle au rayon incident passant par \(O\)</span> : non déviée, elle coupe le plan focal image au foyer secondaire \(\varphi'\).</li>
      <li><span class="step">Le rayon émergent</span> part du point d'incidence sur la lentille et passe par \(\varphi'\) (lentille divergente : son prolongement vers l'arrière passe par \(\varphi'\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> un faisceau parallèle incliné de 3° sur l'axe d'une lentille de \(f' = 10\ \text{cm}\) converge dans le plan focal image, à \(10\tan 3° = 0{,}52\ \text{cm}\) de \(F'\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Calculer une image avec les relations de Descartes</strong>
    <ol>
      <li><span class="step">Orienter l'axe</span> dans le sens de la lumière et écrire les mesures algébriques avec leur signe : objet réel \(\overline{OA} \lt 0\) ; \(f' > 0\) (convergente) ou \(f' \lt 0\) (divergente).</li>
      <li><span class="step">Appliquer</span> \(\dfrac{1}{\overline{OA'}} = \dfrac{1}{f'} + \dfrac{1}{\overline{OA}}\), puis \(\gamma = \overline{OA'}/\overline{OA}\) et \(\overline{A'B'} = \gamma\,\overline{AB}\).</li>
      <li><span class="step">Interpréter</span> : \(\overline{OA'} > 0\) image réelle ; \(\gamma > 0\) droite ; \(|\gamma| > 1\) agrandie. Comparer à une construction rapide.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f' = 15\ \text{cm}\), objet à 10 cm avant la lentille : \(1/\overline{OA'} = 1/15 - 1/10 = -1/30\), \(\overline{OA'} = -30\ \text{cm}\), \(\gamma = 3\) : image virtuelle, droite, trois fois plus grande (loupe).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : mélanger centimètres et mètres dans une même relation, ou calculer en vergences (en δ) avec des distances en centimètres. Choisir une unité et s'y tenir.</div>

  <div class="method-box"><strong>Méthode 4 — Utiliser les relations de Newton</strong>
    <ol>
      <li><span class="step">Repérer l'objet depuis \(F\) et l'image depuis \(F'\)</span> : \(\overline{FA} = \overline{OA} + f'\), \(\overline{F'A'} = \overline{OA'} - f'\).</li>
      <li><span class="step">Appliquer</span> \(\overline{FA}\cdot\overline{F'A'} = -f'^2\) et \(\gamma = f'/\overline{FA} = -\overline{F'A'}/f'\).</li>
      <li><span class="step">Préférer Newton</span> quand l'objet ou l'image est près d'un foyer (objet lointain, tirage d'un objectif, microscope) : le calcul est direct et précis.</li>
    </ol>
    <p><em>Exemple éclair :</em> objectif \(f' = 50\ \text{mm}\), objet à 5,0 m : \(\overline{FA} = -4\,950\ \text{mm}\), donc \(\overline{F'A'} = 2\,500/4\,950 = 0{,}51\ \text{mm}\) : le capteur doit reculer d'un demi-millimètre par rapport au réglage à l'infini ; \(\gamma = 50/(-4\,950) = -0{,}010\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Choisir et placer une lentille pour projeter une image</strong>
    <ol>
      <li><span class="step">Vérifier la condition</span> : lentille convergente et distance objet-écran \(D \geq 4f'\).</li>
      <li><span class="step">Imposer le grandissement</span> : objet et image réels, \(\gamma = -p'/p\) avec \(p + p' = D\).</li>
      <li><span class="step">En déduire</span> \(p\), \(p'\), puis \(f' = p\,p'/D\) (relation \(1/p + 1/p' = 1/f'\)). Sans grandissement imposé : \(p = \big(D \pm \sqrt{D^2 - 4Df'}\big)/2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> projeter une diapositive sur un écran à 2,0 m, 25 fois agrandie : \(p' = 25p\), \(26p = 2{,}0\ \text{m}\), \(p = 7{,}7\ \text{cm}\), \(p' = 1{,}92\ \text{m}\), d'où \(f' = 0{,}077\times1{,}92/2{,}0 = 7{,}4\ \text{cm}\) (et \(4f' = 30\ \text{cm} \lt D\) : c'est possible).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Étudier une association de deux lentilles</strong>
    <ol>
      <li><span class="step">Écrire la chaîne</span> \(A \xrightarrow{L_1} A_1 \xrightarrow{L_2} A'\).</li>
      <li><span class="step">Calculer \(A_1\)</span> avec \(L_1\) (centre \(O_1\)), puis le repérer depuis \(O_2\) : \(\overline{O_2A_1} = \overline{O_2O_1} + \overline{O_1A_1}\) ; s'il est après \(L_2\), c'est un objet virtuel (\(\overline{O_2A_1} > 0\)).</li>
      <li><span class="step">Calculer \(A'\)</span> avec \(L_2\) ; grandissement total \(\gamma = \gamma_1\gamma_2\). Lentilles accolées : \(V = V_1 + V_2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(L_1\) (\(f'_1 = 20\ \text{cm}\)) puis \(L_2\) (\(f'_2 = -10\ \text{cm}\)) 15 cm plus loin ; objet à l'infini. \(A_1 = F'_1\), à 5 cm après \(L_2\) : objet virtuel \(\overline{O_2A_1} = +5\ \text{cm}\). \(1/\overline{O_2A'} = -1/10 + 1/5\), \(\overline{O_2A'} = +10\ \text{cm}\) : image réelle 10 cm après \(L_2\), 25 cm après \(L_1\) (principe du téléobjectif).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Modéliser l'œil et calculer une correction</strong>
    <ol>
      <li><span class="step">Modèle</span> : lentille de vergence variable, rétine à \(d \approx 17\ \text{mm}\) ; vergence nécessaire pour voir net un objet en \(A\) : \(V = 1/d - 1/\overline{OA}\).</li>
      <li><span class="step">Plage d'accommodation</span> : \(\Delta V = V_{PP} - V_{PR} = 1/d_{PP} - 1/d_{PR}\) (distances positives ; \(1/d_{PR} = 0\) si le PR est à l'infini).</li>
      <li><span class="step">Correction</span> : la lentille doit donner de l'objet voulu une image (virtuelle) au PR ou au PP de l'œil ; pour un myope et un objet à l'infini, foyer image de la lentille au PR, en tenant compte de la distance verre-œil.</li>
    </ol>
    <p><em>Exemple éclair :</em> PP à 15 cm : \(V_{\max} = 59 + 6{,}7 = 65{,}5\ \delta\), plage de 6,7 δ. Myope de PR à 50 cm, verre à 1,5 cm de l'œil : \(f' = -(50 - 1{,}5) = -48{,}5\ \text{cm}\), \(V = -2{,}06\ \delta\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Régler un appareil photographique</strong>
    <ol>
      <li><span class="step">Mise au point</span> : tirage \(\overline{F'A'} = f'^2/(x - f')\) pour un objet à la distance \(x\).</li>
      <li><span class="step">Cadrage</span> : taille de l'image d'un objet lointain \(\approx f'\alpha\) ; champ \(2\arctan\big(L/(2f')\big)\) pour un capteur de largeur \(L\).</li>
      <li><span class="step">Exposition</span> : garder \(t/N^2\) constant (\(N = f'/D\)) ; un cran de \(N\) (facteur \(\sqrt2\)) double ou divise par deux \(t\).</li>
      <li><span class="step">Profondeur de champ</span> : tracer les cônes issus du diaphragme vers les images des points proche et lointain, comparer les taches à \(\varepsilon\) ; elle augmente avec \(N\), quand \(f'\) diminue et quand le sujet s'éloigne.</li>
    </ol>
    <p><em>Exemple éclair :</em> objectif de 35 mm, sujet à 1,0 m : tirage \(1\,225/965 = 1{,}27\ \text{mm}\). Bonne exposition à \(N = 4\), 1/250 s ; à \(N = 8\) (deux crans), il faut \(t = 4/250 \approx 1/60\ \text{s}\), avec une profondeur de champ environ doublée.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer à l'œil le raisonnement de l'appareil photographique (déplacer le capteur) ou l'inverse. L'œil change sa vergence, l'appareil photographique déplace son objectif.</div>

  <div class="method-box"><strong>Méthode 9 — Mesurer une distance focale</strong>
    <ol>
      <li><span class="step">Estimer d'abord</span> : image d'un objet lointain, \(f' \approx \overline{OA'}\) ; on sait ainsi quel \(D\) prévoir (\(D \geq 4f'\)).</li>
      <li><span class="step">Choisir la méthode</span> : autocollimation (miroir plan, image nette renversée dans le plan de l'objet : distance objet-lentille \(= f'\)) ; Bessel (\(f' = (D^2 - d^2)/(4D)\)) ; Silbermann (\(D_{\min} = 4f'\), \(\gamma = -1\)) ; régression sur \(1/\overline{OA'}\) en fonction de \(1/\overline{OA}\) (ordonnée à l'origine \(V\)).</li>
      <li><span class="step">Lentille divergente</span> : l'accoler à une convergente connue plus puissante, \(V_2 = V - V_1\).</li>
      <li><span class="step">Estimer l'incertitude</span> : la latitude de mise au point domine ; la propager (Monte-Carlo, chapitre « Mesures et incertitudes »).</li>
    </ol>
    <p><em>Exemple éclair :</em> en rapprochant l'écran, la plus petite distance objet-écran donnant une image nette vaut 62 cm (image de même taille, renversée) : méthode de Silbermann, \(f' = 62/4 = 15{,}5\ \text{cm}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Analyser un instrument d'optique (application, non exigible)</strong>
    <ol>
      <li><span class="step">Suivre l'image</span> de lentille en lentille (méthode 6) jusqu'à l'image finale, à l'infini pour une observation sans fatigue.</li>
      <li><span class="step">Calculer les angles</span> : \(\alpha\) sous lequel on voit l'objet sans instrument (à l'infini pour un astre, à \(d_m = 25\ \text{cm}\) pour un petit objet), \(\alpha'\) sous lequel on voit l'image finale ; \(G = \alpha'/\alpha\).</li>
      <li><span class="step">Reconnaître la configuration</span> : lunette astronomique afocale (\(F'_1 = F_2\), \(G = -f'_1/f'_2\)) ; microscope non afocal (intervalle optique \(\Delta\), \(|G| = (\Delta/f'_1)(d_m/f'_2)\)) ; loupe (\(G_c = d_m/f'\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> une loupe « ×10 » a \(f' = 2{,}5\ \text{cm}\) ; une lunette d'objectif 1 000 mm et d'oculaire 25 mm grossit 40 fois ; un microscope (\(\Delta = 160\ \text{mm}\), \(f'_1 = 10\ \text{mm}\), \(f'_2 = 20\ \text{mm}\)) grossit \(16\times12{,}5 = 200\) fois.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : traiter le microscope comme un système afocal, ou confondre grandissement \(\gamma\) (rapport de tailles, pour une image à distance finie) et grossissement \(G\) (rapport d'angles, pour une observation à l'œil).</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Formule de conjugaison</h3>
  <div class="statement">Une lentille convergente a une distance focale \(f' = 10\) cm. Un objet AB de 2 cm de haut est placé à 30 cm avant la lentille.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\overline{OA'}\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le grandissement \(\gamma\).</div>
  <div class="q"><strong>Q3.</strong> Donner la nature et la taille de l'image.</div>
  <div class="q"><strong>Q4.</strong> Retrouver ces résultats avec les relations de Newton.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Objet réel avant la lentille : \(\overline{OA} = -30\) cm. \(1/\overline{OA'} = 1/f' + 1/\overline{OA}\), soit \(1/\overline{OA'} = 1/10 - 1/30 = 2/30\). Donc \(\overline{OA'} = 15\) cm.</p>
    <p><strong>Q2.</strong> \(\gamma = \overline{OA'}/\overline{OA} = 15/(-30) = -0{,}5\).</p>
    <p><strong>Q3.</strong> \(\overline{OA'} > 0\) : image <strong>réelle</strong> (de l'autre côté de la lentille). \(\gamma \lt 0\) : image <strong>renversée</strong>. \(|\gamma| = 0{,}5 \lt 1\) : image <strong>réduite</strong> de moitié. \(\overline{A'B'} = \gamma\,\overline{AB} = -1\) cm (1 cm, renversée).</p>
    <p><strong>Q4.</strong> \(\overline{FA} = \overline{OA} - \overline{OF} = -30 + 10 = -20\ \text{cm}\), d'où \(\overline{F'A'} = -f'^2/\overline{FA} = -100/(-20) = 5\ \text{cm}\), soit \(\overline{OA'} = 10 + 5 = 15\ \text{cm}\). Et \(\gamma = f'/\overline{FA} = 10/(-20) = -0{,}5\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Vergence, foyers et image d'un objet lointain</h3>
  <div class="statement">On dispose de deux lentilles minces, de vergences \(V_1 = +5{,}0\ \delta\) et \(V_2 = -4{,}0\ \delta\).</div>
  <div class="q"><strong>Q1.</strong> Calculer leurs distances focales. Laquelle est convergente ? Où sont ses foyers \(F\) et \(F'\) ?</div>
  <div class="q"><strong>Q2.</strong> Avec la lentille convergente, on forme l'image de la Lune, vue sous un diamètre apparent de 0,52°. Où se forme-t-elle, et quel est son diamètre ?</div>
  <div class="q"><strong>Q3.</strong> Un faisceau parallèle incliné de 2,0° sur l'axe traverse la même lentille. Où converge-t-il ?</div>
  <div class="q"><strong>Q4.</strong> Même faisceau sur la lentille divergente : décrire le faisceau émergent.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f' = 1/V\) : \(f'_1 = 0{,}20\ \text{m}\) (convergente, \(f' > 0\)) et \(f'_2 = -0{,}25\ \text{m}\) (divergente). Pour la première, \(F'\) est 20 cm après la lentille et \(F\) 20 cm avant.</p>
    <p><strong>Q2.</strong> La Lune est à l'infini : chacun de ses points envoie un faisceau parallèle, qui converge dans le plan focal image. Son image est un disque dans ce plan, de diamètre \(f'\alpha = 0{,}20\times(0{,}52\times\pi/180) = 1{,}8\ \text{mm}\).</p>
    <p><strong>Q3.</strong> En un foyer secondaire image \(\varphi'\) : dans le plan focal image, sur le rayon non dévié passant par \(O\), à \(f'\tan 2{,}0° = 20\times0{,}0349 = 0{,}70\ \text{cm}\) de \(F'\).</p>
    <p><strong>Q4.</strong> Le faisceau ressort divergent : ses rayons semblent tous provenir d'un foyer secondaire image virtuel, situé dans le plan focal image (25 cm <em>avant</em> la lentille), à \(25\tan 2{,}0° = 0{,}87\ \text{cm}\) de l'axe, sur la droite non déviée passant par \(O\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Lentille divergente</h3>
  <div class="statement">Une lentille divergente a une distance focale \(f' = -8\) cm. Un objet réel de 3 cm est placé à 12 cm avant la lentille.</div>
  <div class="q"><strong>Q1.</strong> Position de l'image.</div>
  <div class="q"><strong>Q2.</strong> Nature et taille.</div>
  <div class="q"><strong>Q3.</strong> Tracé à l'échelle des trois rayons caractéristiques.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>

    <p><strong>Q2.</strong> Image virtuelle (\(\overline{OA'} \lt 0\), du côté de l'objet). \(\gamma = -4{,}8/(-12) = 0{,}4\). Image droite, réduite. \(A'B' = 1{,}2\) cm.</p>
    <p><strong>Q3.</strong> Pour une lentille divergente, \(F'\) est <em>avant</em> la lentille (côté objet) et \(F\) est <em>après</em>. Le rayon parallèle à l'axe ressort comme s'il venait de \(F'\) ; le rayon par \(O\) n'est pas dévié ; le rayon <em>dirigé vers</em> \(F\) ressort parallèle à l'axe. On prolonge en tirets les rayons émergents vers l'arrière : ils se coupent en \(B'\).</p>
