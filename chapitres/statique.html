  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la modélisation des actions mécaniques et leur détermination en statique, au semestre S2 du programme de sciences industrielles (compétences B2 « Modéliser » et C2 « Résoudre »). Il s'appuie sur <a href="#liaisons/cours">« Liaisons, graphe et schéma cinématique »</a> (torseurs transmissibles, mobilité, hyperstatisme, modèle plan), dont il reprend les notations, et prépare la dynamique et l'énergétique de 2ᵉ année. <strong>Tout y est exigible en 1ʳᵉ année</strong>, sauf la dernière section.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Déterminer les actions mécaniques en statique</strong> (C2, S2) : référentiel galiléen, principe fondamental de la statique, principe des actions réciproques (§7) ; solides soumis à deux ou trois glisseurs, résolution graphique (§9).</li>

<div class="course-section">
  <div class="sec-num">§1 · ACTIONS MÉCANIQUES : LE MODÈLE LOCAL</div>
  <h2>Décrire une action là où elle s'exerce</h2>
  <div class="intro">Une action mécanique n'est presque jamais « une force en un point » : le poids se répartit dans tout le volume d'une pièce, un fluide presse toute une paroi, deux pièces se touchent sur une surface. Le <strong>modèle local</strong> décrit cette répartition point par point. Il sert à vérifier qu'une surface supporte la pression qu'on lui impose (matage, usure, écrasement d'un sol), et c'est de lui qu'on déduit le modèle global utilisé en statique.</div>
  <div class="def-box">
    <strong>Action mécanique.</strong> Toute cause capable de maintenir un solide au repos, de modifier son mouvement ou de le déformer. On distingue :
    <ul style="margin-top:0.3rem">
      <li>les <strong>actions à distance</strong>, qui s'exercent sur chaque élément de volume : pesanteur, actions magnétiques ou électrostatiques ;</li>
      <li>les <strong>actions de contact</strong>, qui s'exercent sur la surface commune à deux solides (ou à un solide et un fluide).</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Densités d'effort.</strong> L'effort élémentaire exercé sur un petit élément du solide s'écrit, selon la nature de la répartition :
    <ul style="margin-top:0.3rem">
      <li>densité <strong>volumique</strong> \(\vec f_V\) (N/m³) : \(\mathrm d\vec F = \vec f_V\,\mathrm dV\) ; pour la pesanteur, \(\vec f_V = \rho\,\vec g\) ;</li>
      <li>densité <strong>surfacique</strong> \(\vec f_S\) (N/m², c'est-à-dire Pa) : \(\mathrm d\vec F = \vec f_S\,\mathrm dS\) ;</li>
      <li>densité <strong>linéique</strong> \(\vec f_\ell\) (N/m) : \(\mathrm d\vec F = \vec f_\ell\,\mathrm d\ell\), pour une charge répartie le long d'une poutre ou d'une ligne de contact.</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Pression de contact.</strong> Sur la surface de contact entre les solides 1 et 2, on note \(\vec n\) la normale unitaire orientée de 1 vers 2 (elle entre dans le solide qui subit l'action). La densité surfacique de l'action de 1 sur 2 se décompose en
    <div class="formula" data-nom="Effort élémentaire de contact">$$\mathrm d\vec F(1\to2) = \big(p\,\vec n + \vec\tau\big)\,\mathrm dS$$</div>
    où \(p \geq 0\) est la <strong>pression de contact</strong> (une surface ne peut que pousser) et \(\vec\tau\) la densité tangentielle, contenue dans le plan tangent : nulle pour un contact parfait, liée au frottement sinon (§10).
  </div>
  <h3>Ordres de grandeur</h3>
  <ul>
    <li>Pression atmosphérique : \(1\ \text{bar} = 10^5\ \text{Pa} = 0{,}1\ \text{MPa}\) ; pneu de voiture gonflé à 2 à 2,5 bar (pression relative), à peu près la pression moyenne dans l'aire de contact avec la route.</li>
    <li>Vérin pneumatique : environ 6 bar ; vérin hydraulique : 100 à 300 bar.</li>
    <li>Palier lisse en bronze : pression admissible de l'ordre de 10 MPa ; contact roue-rail (zone de quelques millimètres) : de l'ordre de 1 000 MPa.</li>
    <li>Pesanteur dans l'acier : \(\rho g = 7\,850\times9{,}81 \approx 7{,}7\cdot10^4\ \text{N/m}^3\) ; poids propre d'un profilé IPE 200 (22,4 kg/m) : \(f_\ell \approx 220\ \text{N/m}\).</li>
  </ul>
  <div class="method-box"><strong>Exemple — la pression sous les pieds d'une machine</strong>
    <ol>
      <li>Une machine de 1 200 kg repose sur quatre pieds à semelle carrée de 60 mm de côté, également chargés.</li>
      <li>Effort total \(m g = 1\,200\times9{,}81 = 11\,772\ \text{N}\), surface d'appui \(4\times0{,}06^2 = 0{,}014\,4\ \text{m}^2\).</li>
      <li>Pression moyenne : \(p = 11\,772/0{,}014\,4 \approx 0{,}82\ \text{MPa}\), soit huit fois la pression atmosphérique. Un béton courant résiste à plus de 20 MPa : la dalle tient ; un plancher en bois tendre (quelques MPa) commencerait à marquer.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la pression (en Pa, répartie sur une surface) et l'effort (en N). Une même force de 100 N donne 1 MPa sur 1 cm² et 1 kPa sur 1 dm² : c'est la pression qui décide du marquage d'une surface, pas l'effort.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LE MODÈLE GLOBAL : TORSEUR D'UNE ACTION MÉCANIQUE</div>
  <h2>Résumer une action par deux vecteurs</h2>
  <div class="intro">Pour écrire l'équilibre d'un solide, le détail de la répartition des efforts est inutile : seuls comptent leur somme et la somme de leurs moments. Ces deux vecteurs forment le <strong>torseur</strong> de l'action, son modèle global. C'est l'objet que manipulent la statique, la dynamique et les liaisons.</div>
  <div class="def-box">
    <strong>Torseur d'une action mécanique.</strong> L'action mécanique de l'ensemble 1 sur le solide 2 est modélisée, en un point \(P\), par
    <div class="formula" data-nom="Torseur d'une action mécanique">$$\{\mathcal T(1\to2)\} = \begin{Bmatrix} \vec R(1\to2) \\ \vec M(P, 1\to2) \end{Bmatrix}_P = \begin{Bmatrix} X & L \\ Y & M \\ Z & N \end{Bmatrix}_{P,\,(\vec x,\vec y,\vec z)}$$</div>
    La <strong>résultante</strong> \(\vec R(1\to2)\) (en N) est la somme des efforts élémentaires ; le <strong>moment</strong> en \(P\), \(\vec M(P, 1\to2)\) (en N·m, noté aussi \(\vec M_P\)), est la somme de leurs moments en \(P\). Ce sont les notations de « Liaisons », §6.
  </div>
  <div class="def-box">
    <strong>Moment d'une force.</strong> Le moment en \(A\) d'une force \(\vec F\) appliquée en \(B\) est
    <div class="formula" data-nom="Moment d'une force">$$\vec M(A, \vec F) = \overrightarrow{AB}\wedge\vec F$$</div>
    Sa norme vaut \(d\,\|\vec F\|\), où \(d\), le <strong>bras de levier</strong>, est la distance de \(A\) à la droite d'action de \(\vec F\) ; son sens suit la règle de la main droite.
  </div>
  <div class="prop-box">
    <strong>Transport du moment (relation de « BABAR »).</strong> La résultante ne dépend pas du point ; le moment, si :
    <div class="formula" data-nom="Transport du moment">$$\vec M(B) = \vec M(A) + \overrightarrow{BA}\wedge\vec R$$</div>
    C'est la même structure que le champ des vitesses d'un solide (« Cinématique », §3), à lire B – A – BA – R.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">La relation de transport pour un ensemble de forces</span><div class="content">
    <p>Pour des forces \(\vec F_i\) appliquées aux points \(M_i\), on décompose \(\overrightarrow{BM_i} = \overrightarrow{BA} + \overrightarrow{AM_i}\) :</p>
    <div class="formula">$$\vec M(B) = \sum_i \big(\overrightarrow{BA} + \overrightarrow{AM_i}\big)\wedge\vec F_i = \overrightarrow{BA}\wedge\sum_i\vec F_i + \sum_i\overrightarrow{AM_i}\wedge\vec F_i = \overrightarrow{BA}\wedge\vec R + \vec M(A)$$</div>
    <p>Pour une répartition continue, on remplace les sommes par des intégrales.</p>
  </div></div>
  <div class="prop-box">
    <strong>Moment par rapport à un axe.</strong> Le moment par rapport à l'axe \(\Delta = (A, \vec u)\), \(\vec u\) unitaire, est le scalaire \(M_\Delta = \vec M(A)\cdot\vec u\). Il ne dépend pas du point \(A\) choisi sur l'axe : si \(B\) est aussi sur \(\Delta\), \(\overrightarrow{BA}\) est colinéaire à \(\vec u\), et \((\overrightarrow{BA}\wedge\vec R)\cdot\vec u = 0\). C'est la grandeur qui fait tourner un solide autour d'un axe fixe.
  </div>
  <p>Le torseur de plusieurs actions est la somme de leurs torseurs, <strong>écrits au même point</strong>. On parle de torseur d'une <strong>action extérieure</strong> à un système isolé quand l'action provient de l'extérieur de la frontière d'isolement (§7).</p>
  <div class="method-box"><strong>Exemple — serrer un écrou avec une clé</strong>
    <ol>
      <li>Une clé plate de 0,25 m serre un écrou d'axe \((A, \vec z)\). La main appuie en \(B\), \(\overrightarrow{AB} = 0{,}25\,\vec x\ \text{m}\), avec \(\vec F = 75\,\vec x + 129{,}9\,\vec y\ \text{N}\) (150 N à 60° de la clé).</li>
      <li>\(\vec M(A) = 0{,}25\,\vec x\wedge(75\,\vec x + 129{,}9\,\vec y) = 32{,}5\,\vec z\ \text{N·m}\) : seule la composante perpendiculaire à la clé travaille ; le bras de levier vaut \(0{,}25\sin60° = 0{,}217\ \text{m}\).</li>
      <li>Si la main pousse aussi de 40 N selon \(\vec z\), le terme \(0{,}25\,\vec x\wedge40\,\vec z = -10\,\vec y\) s'ajoute : \(\vec M(A) = -10\,\vec y + 32{,}5\,\vec z\ \text{N·m}\). Le moment autour de l'axe de l'écrou reste \(M_\Delta = 32{,}5\ \text{N·m}\) ; la composante \(-10\,\vec y\) ne serre pas, elle fléchit la vis.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner des moments calculés en des points différents, ou oublier que le moment d'une force dépend du point où on le calcule. Toujours écrire tous les torseurs au même point avant de les sommer.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · GLISSEUR ET COUPLE</div>
  <h2>Les deux briques de toute action mécanique</h2>
  <div class="intro">Deux torseurs particuliers modélisent « une force » et « un couple ». Les reconnaître fait gagner beaucoup de temps : un solide soumis à deux glisseurs, une action dont on connaît la droite d'action, un couple moteur qui ne crée aucune résultante.</div>
  <div class="def-box">
    <strong>Glisseur.</strong> Torseur de résultante non nulle dont le moment est nul en au moins un point \(A\). Son moment est alors nul en tout point de la droite \((A, \vec R)\), appelée <strong>axe</strong> (ou droite d'action) du glisseur. C'est le modèle d'une force : poids (axe vertical passant par \(G\)), action d'une sphère-plan parfaite (axe : sa normale), action d'une sphérique (axe passant par son centre).
  </div>
  <div class="def-box">
    <strong>Couple.</strong> Torseur de résultante nulle : \(\{\mathcal T\} = \{\vec 0 \;;\; \vec C\}\). D'après la relation de transport, son moment \(\vec C\) est le même en tout point. Deux forces opposées \(\vec F\) et \(-\vec F\), portées par des droites parallèles distantes de \(d\), forment un couple de norme \(C = F\,d\). C'est le modèle d'un couple moteur transmis par un arbre.
  </div>

  <div class="prop-box">
    <strong>Reconnaître un glisseur.</strong> Le produit scalaire \(\vec R\cdot\vec M(P)\), appelé <strong>automoment</strong>, a la même valeur en tout point \(P\). Un torseur de résultante non nulle est un glisseur si et seulement si \(\vec R\cdot\vec M(P) = 0\). <strong>Décomposition</strong> : tout torseur est, en tout point \(P\), la somme d'un glisseur de résultante \(\vec R\) passant par \(P\) et d'un couple de moment \(\vec M(P)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Automoment invariant ; point où le moment s'annule</span><div class="content">
    <p>Invariance : \(\overrightarrow{QP}\wedge\vec R\) est orthogonal à \(\vec R\), donc</p>
    <div class="formula">$$\vec M(Q)\cdot\vec R = \big(\vec M(P) + \overrightarrow{QP}\wedge\vec R\big)\cdot\vec R = \vec M(P)\cdot\vec R$$</div>
    <p>Si \(\vec M(A) = \vec 0\) en un point, l'automoment est nul partout. Réciproquement, si \(\vec R\cdot\vec M(P) = 0\) avec \(\vec R \neq \vec 0\), on pose \(\overrightarrow{PQ} = \dfrac{\vec R\wedge\vec M(P)}{R^2}\). Par le double produit vectoriel :</p>
    <div class="formula">$$\overrightarrow{PQ}\wedge\vec R = \vec M(P) - \frac{\vec R\cdot\vec M(P)}{R^2}\,\vec R = \vec M(P) \qquad\text{donc}\qquad \vec M(Q) = \vec M(P) - \overrightarrow{PQ}\wedge\vec R = \vec 0$$</div>
  </div></div>
  <div class="notice"><strong>En problème plan</strong> (forces dans le plan \((\vec x, \vec y)\), moments selon \(\vec z\)), l'automoment est toujours nul : toute action de résultante non nulle est un glisseur. Son axe est la droite des points où le moment s'annule, à la distance \(|M_z(A)|/R\) de \(A\).</div>
  <div class="method-box"><strong>Exemple — trouver la droite d'action d'une action plane</strong>
    <ol>
      <li>Une action a pour éléments de réduction en \(O\) : \(\vec R = 300\,\vec x - 400\,\vec y\ \text{N}\) (\(R = 500\ \text{N}\)) et \(\vec M(O) = 150\,\vec z\ \text{N·m}\).</li>
      <li>En \(P(x, y)\) : \(\vec M(P) = \vec M(O) + \overrightarrow{PO}\wedge\vec R = (150 + 400\,x + 300\,y)\,\vec z\).</li>
      <li>Le moment s'annule sur la droite \(400\,x + 300\,y + 150 = 0\) (en m) : c'est l'axe du glisseur. Elle coupe \((O, \vec x)\) en \(x = -0{,}375\ \text{m}\) et passe à \(150/500 = 0{,}30\ \text{m}\) de \(O\).</li>
      <li>Volant de manœuvre tourné à deux mains, \(40\ \text{N}\) de part et d'autre, sur un diamètre de 0,36 m : couple pur \(C = 40\times0{,}36 = 14{,}4\ \text{N·m}\), résultante nulle, aucun effort sur les paliers du volant. Un tournevis qui pousse de 50 N et tourne de 2 N·m : \(\vec R\cdot\vec M = -100 \neq 0\), ni glisseur ni couple.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · DU MODÈLE LOCAL AU MODÈLE GLOBAL</div>
  <h2>Intégrer une répartition d'efforts</h2>
  <div class="intro">Passer du modèle local au torseur, c'est sommer les efforts élémentaires et leurs moments. Quelques cas reviennent sans cesse : le poids, les charges réparties sur une poutre, la pression uniforme ou hydrostatique. Retenir leurs résultats évite d'intégrer à chaque fois.</div>
  <div class="prop-box">
    <strong>Passage du local au global.</strong> Pour une répartition sur un domaine \(\mathcal D\) (volume, surface ou ligne) :
    <div class="formula" data-nom="Passage du local au global">$$\vec R = \int_{\mathcal D}\mathrm d\vec F \qquad\qquad \vec M(P) = \int_{\mathcal D}\overrightarrow{PM}\wedge\mathrm d\vec F$$</div>
    Si tous les efforts élémentaires sont parallèles et de même sens, le torseur est un glisseur : on cherche sa résultante et un point de son axe (le « centre » de la répartition).
  </div>
  <h3>Pesanteur : le poids et le centre de gravité</h3>
  <p>Avec \(\mathrm d\vec F = \vec g\,\mathrm dm\) et \(\vec g\) uniforme, \(\vec R = m\,\vec g\) et \(\vec M(G) = \vec 0\) au <strong>centre de gravité</strong> \(G\), défini par \(m\,\overrightarrow{OG} = \int\overrightarrow{OM}\,\mathrm dm\). Le poids est un glisseur d'axe vertical passant par \(G\). Pour une pièce faite de morceaux simples, \(G\) est le barycentre des centres de gravité des morceaux, pondérés par leurs masses (le calcul intégral de \(G\) n'est pas évalué : on utilise les symétries et les barycentres).</p>
  <div class="method-box"><strong>Exemple — moment du poids d'un bras en L</strong>
    <ol>
      <li>Un bras pivote autour de l'axe \((O, \vec z)\), \(\vec y\) vertical ascendant. Il comprend un tube de 2,0 kg, de centre \((0{,}30\ ;\ 0)\) m, et un embout de 1,0 kg, de centre \((0{,}60\ ;\ 0{,}15)\) m.</li>
      <li>\(x_G = (2\times0{,}30 + 1\times0{,}60)/3 = 0{,}40\ \text{m}\) et \(y_G = (1\times0{,}15)/3 = 0{,}05\ \text{m}\).</li>
      <li>Moment du poids autour de l'axe : \(M_z = -m g\,x_G = -3\times9{,}81\times0{,}40 \approx -11{,}8\ \text{N·m}\) (il fait tourner le bras dans le sens horaire). Seule l'abscisse de \(G\) compte : \(y_G\) est parallèle au poids.</li>
    </ol>
  </div>
  <div class="def-box">
    <strong>Stabilité d'un équilibre sous l'effet du poids.</strong> Un solide qui ne peut que tourner autour d'un axe horizontal est en équilibre quand \(G\) est à la verticale de l'axe (moment du poids nul). L'équilibre est <strong>stable</strong> si \(G\) est sous l'axe (un écart crée un moment qui ramène), <strong>instable</strong> si \(G\) est au-dessus, <strong>indifférent</strong> si \(G\) est sur l'axe (moment nul dans toute position, cas d'une roue équilibrée).
  </div>
  <h3>Charges réparties sur une poutre</h3>
  <p>Pour une densité linéique \(q(x)\) (en N/m) sur une longueur \(\ell\) : la résultante vaut \(\int_0^\ell q(x)\,\mathrm dx\), l'aire du diagramme de charge, et son axe passe par le centre de surface de ce diagramme.</p>

  <h3>Pression uniforme</h3>
  <div class="prop-box">
    <strong>Pression uniforme sur une surface plane.</strong> La résultante vaut \(R = p\,S\), normale à la surface, appliquée au centre de surface de \(S\). <strong>Sur une surface quelconque</strong>, la composante de la résultante selon une direction \(\vec u\) vaut \(p\) fois l'aire de la projection de la surface sur un plan perpendiculaire à \(\vec u\) ; pour un demi-cylindre de diamètre \(D\) et de longueur \(L\) :
    <div class="formula" data-nom="Pression uniforme sur un demi-cylindre">$$R = p\,D\,L$$</div>
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Résultante d'une pression uniforme sur un demi-cylindre</span><div class="content">
    <p>Repérons un point de la demi-surface par l'angle \(\theta \in [-\pi/2, \pi/2]\) mesuré depuis l'axe de symétrie. L'élément \(\mathrm dS = L\,\dfrac D2\,\mathrm d\theta\) reçoit l'effort \(p\,\mathrm dS\), radial. Les composantes perpendiculaires à l'axe de symétrie se compensent deux à deux (\(\theta\) et \(-\theta\)) ; les composantes selon l'axe s'ajoutent :</p>
    <div class="formula">$$R = \int_{-\pi/2}^{\pi/2} p\,L\,\frac D2\cos\theta\,\mathrm d\theta = p\,L\,\frac D2\,\big[\sin\theta\big]_{-\pi/2}^{\pi/2} = p\,D\,L$$</div>
    <p>Tous les efforts élémentaires passent par l'axe du cylindre : la résultante aussi.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — vérin et palier</strong>
    <ol>
      <li>Vérin pneumatique de piston \(D = 63\ \text{mm}\) sous 6 bar : \(F = p\,\pi D^2/4 = 6\cdot10^5\times\pi\times0{,}063^2/4 \approx 1\,870\ \text{N}\). Vérin hydraulique de 50 mm sous 150 bar : \(F \approx 29{,}5\ \text{kN}\), seize fois plus avec un piston plus petit.</li>
      <li>Palier lisse de diamètre 40 mm et de longueur 30 mm portant une charge radiale de 4 kN. En supposant la pression uniforme sur le demi-coussinet chargé, \(p = F/(D L) = 4\,000/(0{,}040\times0{,}030) \approx 3{,}3\ \text{MPa}\) : c'est la « pression diamétrale » utilisée pour choisir un coussinet, ici acceptable pour du bronze (de l'ordre de 10 MPa admissibles).</li>
    </ol>
  </div>
  <h3>Pression linéaire : pression hydrostatique</h3>
  <p>Dans un liquide au repos, la pression relative croît linéairement avec la profondeur, \(p = \rho g z\) (voir le cours de physique). Sur une paroi verticale rectangulaire de largeur \(b\) immergée sur la hauteur \(H\), le diagramme est un triangle :</p>
  <div class="formula" data-nom="Poussée sur une paroi verticale">$$R = \int_0^H \rho g z\,b\,\mathrm dz = \frac{\rho g\,b\,H^2}{2} \qquad \text{appliquée à la profondeur } \frac{2H}{3}$$</div>

<div class="course-section">
  <div class="sec-num">§5 · PRESSION DE CONTACT SOUS UN APPUI PLAN</div>
  <h2>Répartition linéaire et tiers central</h2>
  <div class="intro">Une liaison appui plan réelle transmet un effort normal et deux moments (« Liaisons », §6). Ces moments ne sont rien d'autre qu'une pression de contact non uniforme. Le modèle linéaire permet de vérifier deux choses : que la pression maximale reste admissible, et que l'appui ne décolle pas.</div>
  <div class="def-box">
    <strong>Modèle de pression linéaire.</strong> Une semelle rectangulaire (longueur \(a\) selon \(\vec x\), largeur \(b\)), de centre \(O\), transmet un effort normal \(N\) dont la droite d'action coupe le plan de contact à l'abscisse \(e\), l'<strong>excentricité</strong> (le moment en \(O\) vaut \(N e\)). Pour des pièces très rigides, on suppose la pression affine en \(x\) :
    <div class="formula" data-nom="Pression linéaire sous une semelle">$$p(x) = \frac{N}{a\,b}\left(1 + \frac{12\,e\,x}{a^2}\right) \qquad p_{\max,\,\min} = \frac{N}{a\,b}\left(1 \pm \frac{6\,e}{a}\right)$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Identifier la pression affine à partir de N et e</span><div class="content">
    <p>On pose \(p(x) = p_0 + k\,x\) pour \(x \in [-a/2, a/2]\). Résultante : \(\int p\,b\,\mathrm dx = p_0\,a\,b = N\). Moment en \(O\) : \(\int x\,p\,b\,\mathrm dx = k\,b\,a^3/12 = N\,e\). D'où \(p_0 = N/(ab)\) et \(k = 12\,N e/(b\,a^3)\), ce qui donne la formule ; les valeurs extrêmes sont atteintes en \(x = \pm a/2\).</p>
  </div></div>
  <div class="prop-box">
    <strong>Règle du tiers central.</strong> La pression reste positive sur tout l'appui si et seulement si \(|e| \leq a/6\) : la droite d'action de \(N\) passe dans le tiers central de la semelle. Au-delà, une partie de l'appui décolle ; la pression devient triangulaire sur la longueur comprimée \(c = 3\,(a/2 - |e|)\), avec
    <div class="formula" data-nom="Contact partiel">$$p_{\max} = \frac{2N}{b\,c}$$</div>
    Le solide bascule quand \(e\) atteint \(a/2\) : la résultante sort de l'appui.
  </div>

      <li>Pour \(H = 3{,}75\ \text{kN}\), \(e = 0{,}15\ \text{m} \gt 0{,}10\) : contact sur \(c = 3\times(0{,}30 - 0{,}15) = 0{,}45\ \text{m}\) seulement, et \(p_{\max} = 2\times12\,000/(0{,}40\times0{,}45) \approx 133\ \text{kPa}\). L'armoire basculerait pour \(e = 0{,}30\ \text{m}\), c'est-à-dire \(H = 7{,}5\ \text{kN}\).</li>

<div class="course-section">
  <div class="sec-num">§6 · ACTIONS TRANSMISSIBLES PAR LES LIAISONS</div>
  <h2>Les inconnues de liaison, en 3D et en plan</h2>
  <div class="intro">Dans un mécanisme, l'essentiel des actions inconnues passe par les liaisons. Le chapitre « Liaisons » établit, pour chacune des onze liaisons normalisées, la forme du torseur qu'elle peut transmettre. On en rappelle ici la règle et les cas les plus fréquents, puis on compte inconnues et équations avant de résoudre.</div>
  <div class="def-box">
    <strong>Torseur des actions transmissibles (liaison parfaite).</strong> Une liaison parfaite à \(n_c\) degrés de liberté transmet \(n_s = 6 - n_c\) composantes indépendantes : la force est nulle selon chaque translation permise, le moment est nul autour de chaque rotation permise (dualité, <a href="#liaisons/cours">« Liaisons »</a>, §6, avec le tableau des onze liaisons). La forme simple n'est valable qu'aux points indiqués : sur l'axe, au centre, sur la normale ; ailleurs, on transporte le moment.
  </div>
  <div class="formula">$$\begin{array}{|l|c|c|l|}
  \hline
  \textbf{Liaison (base locale)} & n_c & n_s & \textbf{Composantes transmises} \\
  \hline
  \text{Encastrement} & 0 & 6 & X, Y, Z, L, M, N \text{ (en tout point)} \\
  \text{Pivot d'axe } (A, \vec x) & 1 & 5 & X, Y, Z, M, N \text{ (sur l'axe)} \\
  \text{Glissière de direction } \vec x & 1 & 5 & Y, Z, L, M, N \text{ (en tout point)} \\
  \text{Pivot glissant d'axe } (A, \vec x) & 2 & 4 & Y, Z, M, N \text{ (sur l'axe)} \\
  \text{Sphérique de centre } A & 3 & 3 & X, Y, Z \text{ (en } A\text{)} \\
  \text{Appui plan de normale } \vec z & 3 & 3 & Z, L, M \text{ (en tout point)} \\
  \text{Sphère-cylindre, centre } A\text{, direction } \vec x & 4 & 2 & Y, Z \text{ (en } A\text{)} \\
  \text{Sphère-plan de normale } (A, \vec z) & 5 & 1 & Z \text{ (sur la normale)} \\
  \hline
  \end{array}$$</div>
  <p>Composantes : \(\vec R = X\vec x + Y\vec y + Z\vec z\) et \(\vec M = L\vec x + M\vec y + N\vec z\) ; les trois liaisons manquantes (hélicoïdale, sphérique à doigt, cylindre-plan) sont dans le tableau complet de « Liaisons ». Une sphérique transmet un glisseur passant par son centre ; une sphère-plan, un glisseur porté par sa normale ; une glissière peut transmettre un couple pur.</p>
  <div class="notice"><strong>Contact unilatéral</strong> : une sphère-plan ou un appui plan ne peut que pousser. Une fois l'équilibre résolu, vérifier le signe de l'effort normal (\(Z \geq 0\) dans le bon sens) et, pour un appui plan, que la résultante passe dans la zone de contact (§5). Avec frottement, des composantes s'ajoutent (§10 à §12) : la liaison n'est plus parfaite.</div>
  <h3>Compter avant de résoudre</h3>
  <div class="prop-box">
    <strong>Inconnues, équations, hyperstatisme.</strong> On isole successivement les \(n - 1\) solides mobiles (\(n\) classes, bâti compris) : le PFS (§7) fournit \(E_s = 6(n-1)\) équations pour \(I_s = \sum n_s\) inconnues de liaison. Avec \(m\) la mobilité (mouvements indépendants du mécanisme, obtenus en l'observant) :
    <div class="formula" data-nom="Degré d'hyperstatisme (statique)">$$h = m + I_s - 6\,(n-1) \qquad\qquad \text{en plan : } h = m + I_s - 3\,(n-1)$$</div>
    \(h = 0\) : modèle <strong>isostatique</strong>, toutes les inconnues se calculent ; \(h \gt 0\) : <strong>hyperstatique</strong>, \(h\) inconnues restent indéterminées par la statique seule. On a toujours \(h \geq 0\) : un calcul qui donne \(h \lt 0\) signale une mobilité oubliée. Approche cinématique, conditions géométriques et façon de rendre un modèle isostatique : <a href="#liaisons/cours">« Liaisons »</a>, §10 et §11.
  </div>
  <div class="method-box"><strong>Exemple — trois dénombrements</strong>
    <ol>
      <li><strong>Arbre sur deux roulements</strong>, modélisés par une sphérique en \(A\) et une sphère-cylindre en \(B\) d'axe \(\vec x\) : \(I_s = 3 + 2 = 5\), \(n = 2\), \(m = 1\) (rotation de l'arbre), \(h = 1 + 5 - 6 = 0\). Une des six équations, celle des moments autour de l'axe, ne contient aucune inconnue de liaison : c'est l'<strong>équation de mobilité</strong>, qui relie couple moteur et couple résistant (§7).</li>
      <li><strong>Poutre sur un pivot et un appui simple</strong> (en plan) : \(I_s = 2 + 1 = 3\), \(n = 2\), \(m = 0\), \(h = 0 + 3 - 3 = 0\).</li>
      <li><strong>Poutre encastrée et posée sur un appui en bout</strong> (en plan) : \(I_s = 3 + 1 = 4\), \(m = 0\), \(h = 1\) : l'effort sur l'appui dépend de la raideur de la poutre (résistance des matériaux, 2ᵉ année).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · PRINCIPE FONDAMENTAL DE LA STATIQUE</div>
  <h2>Isoler, faire le bilan, écrire six équations</h2>
  <div class="intro">Le principe fondamental de la statique (PFS) relie les actions extérieures à un système en équilibre. C'est lui qui donne les efforts dans les liaisons, le couple qu'un moteur doit fournir ou l'effort qu'un vérin doit développer. Son efficacité tient au choix du système isolé, du point et des projections.</div>
  <div class="def-box">
    <strong>Référentiel galiléen, équilibre.</strong> Un référentiel galiléen est un référentiel dans lequel le principe d'inertie est vérifié. Pour l'étude d'un mécanisme pendant quelques secondes ou minutes, un référentiel lié au sol (au bâti) est considéré comme galiléen. Un ensemble matériel \(E\) est <strong>en équilibre</strong> par rapport à un référentiel \(\mathcal R_g\) si chacun de ses points y est fixe au cours du temps.
  </div>
  <div class="prop-box">
    <strong>Principe fondamental de la statique.</strong> Si un ensemble matériel \(E\) est en équilibre par rapport à un référentiel galiléen, alors le torseur des actions mécaniques extérieures à \(E\) est nul :
    <div class="formula" data-nom="Principe fondamental de la statique">$$\{\mathcal T(\bar E\to E)\} = \{0\} \iff \begin{cases} \displaystyle\sum \vec R(\text{ext}\to E) = \vec 0 & \text{théorème de la résultante statique} \\ \displaystyle\sum \vec M(P, \text{ext}\to E) = \vec 0 & \text{théorème du moment statique, en un point } P \text{ quelconque} \end{cases}$$</div>
    Soit six équations scalaires dans l'espace, trois en problème plan (§8). Tous les moments s'écrivent au même point \(P\), choisi librement.
  </div>
  <div class="notice"><strong>La réciproque est fausse</strong> : un torseur extérieur nul ne garantit pas l'équilibre. Un arbre qui tourne à vitesse constante, son centre de gravité sur l'axe, a un torseur extérieur nul (couple moteur = couple résistant) et pourtant il tourne ; un mécanisme mobile (une pince, un compas) peut se déformer sous un torseur extérieur nul. Le PFS donne des <strong>conditions nécessaires</strong>, d'où l'intérêt d'isoler les solides un par un.</div>
  <div class="prop-box">
    <strong>Principe des actions réciproques.</strong> L'action de 2 sur 1 est l'opposée de l'action de 1 sur 2 : \(\{\mathcal T(2\to1)\} = -\{\mathcal T(1\to2)\}\), au même point. Les actions intérieures à un système isolé se compensent donc deux à deux et n'apparaissent pas dans son bilan.
  </div>
  <h3>Démarche</h3>
  <ul>
    <li><strong>Isoler</strong> : tracer la frontière du système \(E\) (un solide, ou un groupe de solides). Les actions extérieures sont celles qui traversent la frontière.</li>
    <li><strong>Faire le bilan des actions mécaniques extérieures</strong> (BAME) : actions à distance (poids en \(G\)), puis une action par liaison coupée par la frontière (son torseur transmissible), puis les actions données (effort d'un vérin, couple d'un moteur, charge).</li>
    <li><strong>Choisir le point</strong> où écrire les moments : celui par lequel passent le plus d'inconnues (centre d'une sphérique, point de l'axe d'une pivot, intersection de deux droites d'action).</li>
    <li><strong>Choisir les projections</strong> : une équation par inconnue cherchée si possible ; projeter perpendiculairement aux inconnues qu'on veut éliminer.</li>
    <li><strong>Résoudre et contrôler</strong> : signes (contact unilatéral), ordres de grandeur, unités.</li>
  </ul>
  <div class="method-box"><strong>Exemple — arbre de transmission avec poulie en porte-à-faux</strong>
    <ol>
      <li>Un arbre d'axe \((A, \vec x)\) tourne dans une sphérique de centre \(A\) et une sphère-cylindre de centre \(B\) (\(\overrightarrow{AB} = 0{,}30\,\vec x\ \text{m}\)), d'axe \(\vec x\) (§6 : \(h = 0\)). Un moteur l'entraîne par un accouplement (couple pur \(C_m\,\vec x\)). Une poulie, en \(x = 0{,}40\ \text{m}\), de rayon 0,10 m, reçoit du brin tendu d'une courroie verticale (brin mou de tension négligeable) l'effort \(-600\,\vec z\ \text{N}\) au point \(P\), \(\overrightarrow{AP} = 0{,}40\,\vec x + 0{,}10\,\vec y\ \text{m}\).</li>
      <li>BAME sur l'arbre : \(\{X_A\vec x + Y_A\vec y + Z_A\vec z \;;\; \vec 0\}_A\), \(\{Y_B\vec y + Z_B\vec z \;;\; \vec 0\}_B\), \(\{\vec 0 \;;\; C_m\vec x\}\), \(\{-600\,\vec z \;;\; \vec 0\}_P\) ; poids négligé.</li>
      <li>Moments en \(A\) : \(\overrightarrow{AB}\wedge(Y_B\vec y + Z_B\vec z) = -0{,}30\,Z_B\,\vec y + 0{,}30\,Y_B\,\vec z\) et \(\overrightarrow{AP}\wedge(-600\,\vec z) = -60\,\vec x + 240\,\vec y\). D'où, sur \(\vec x\) : \(C_m - 60 = 0\), \(C_m = 60\ \text{N·m}\) (équation de mobilité) ; sur \(\vec y\) : \(Z_B = 800\ \text{N}\) ; sur \(\vec z\) : \(Y_B = 0\).</li>
      <li>Résultante : \(X_A = 0\), \(Y_A = 0\), \(Z_A = 600 - 800 = -200\ \text{N}\). Le palier \(B\), voisin de la poulie, porte 800 N, plus que la courroie elle-même, et le palier \(A\) est tiré vers le bas : c'est l'effet du porte-à-faux.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : faire figurer dans le bilan une action intérieure au système isolé (l'action d'une pièce du système sur une autre), ou oublier une liaison coupée par la frontière. Dessiner la frontière, puis parcourir son contour liaison par liaison.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · PROBLÈME PLAN</div>
  <h2>Quand trois équations suffisent</h2>
  <div class="intro">Beaucoup de mécanismes possèdent un plan de symétrie : bras, potences, leviers, pinces. Les étudier dans ce plan divise par deux le nombre d'équations. Mais le modèle plan a des conditions d'emploi précises, et il ne voit pas tout.</div>
  <div class="def-box">
    <strong>Conditions de la modélisation plane</strong> (voir aussi <a href="#liaisons/cours">« Liaisons »</a>, §12). On peut écrire l'équilibre dans le plan \((O, \vec x, \vec y)\) si :
    <ul style="margin-top:0.3rem">
      <li>la <strong>géométrie</strong> s'y prête : mouvements dans des plans parallèles à \((\vec x, \vec y)\), axes de rotation selon \(\vec z\) ;</li>
      <li>les <strong>actions mécaniques</strong> sont contenues dans le plan, ou réparties symétriquement de part et d'autre (le mécanisme <strong>et</strong> son chargement admettent \((O, \vec x, \vec y)\) comme plan de symétrie).</li>
    </ul>
    Chaque torseur se réduit alors à \(\{X\vec x + Y\vec y \;;\; M_z\vec z\}\) (la composante \(N\) de « Liaisons », notée ici \(M_z\) pour ne pas la confondre avec l'effort normal \(N\) du frottement), et chaque isolement donne trois équations : deux de résultante, une de moment autour de \(\vec z\).
  </div>
  <div class="formula" data-nom="PFS en problème plan">$$\sum X = 0 \qquad \sum Y = 0 \qquad \sum M_z(A) = 0 \qquad\text{avec}\qquad M_z(A, \vec F) = x\,F_y - y\,F_x$$</div>
  <p>Dans la dernière formule, \((x, y)\) sont les coordonnées du point d'application de \(\vec F\) par rapport à \(A\) ; \(M_z\) est compté positivement dans le sens trigonométrique. Formes planes des liaisons : pivot d'axe \(\vec z\) : \(X, Y\) ; glissière de direction \(\vec x\) : \(Y, M_z\) ; contact ponctuel de normale \(\vec y\) : \(Y\) ; encastrement : \(X, Y, M_z\).</p>
  <div class="prop-box">
    <strong>Limites du modèle plan.</strong> Il ignore toutes les inconnues et toutes les conditions hors du plan : \(h_{\text{plan}} \leq h\), un mécanisme isostatique en plan est souvent hyperstatique dans l'espace. Deux liaisons symétriques par rapport au plan (deux roulements, deux charnières, deux joues d'une chape) y sont représentées par une seule : le calcul donne la <strong>somme</strong> de leurs efforts. Par symétrie, chacune en porte la moitié ; une dissymétrie (charge décentrée) demande l'étude dans l'espace.
  </div>

    <ol>

      <li>Le tirant, de masse négligée, n'est soumis qu'aux actions de ses deux articulations : son action sur le bras est portée par DC (§9), de vecteur unitaire \(\vec u = (-0{,}9\,\vec x + 0{,}6\,\vec y)/1{,}082\) ; on note \(T\) son intensité (traction).</li>

      <li>Résultante : \(X_A = T\times0{,}9/1{,}082 = 4\,000\ \text{N}\) et \(Y_A = 2\,000 - T\times0{,}6/1{,}082 \approx -667\ \text{N}\). Le bras est comprimé, l'articulation \(A\) le tire vers le bas ; chaque charnière en reprend la moitié.</li>
    </ol>

<div class="course-section">
  <div class="sec-num">§9 · SOLIDES SOUMIS À DEUX OU TROIS GLISSEURS</div>
  <h2>Statique graphique</h2>
  <div class="intro">Quand un solide n'est soumis qu'à deux ou trois forces, le PFS se lit directement sur la figure. Ces propriétés donnent la direction d'une réaction sans calcul, permettent une résolution graphique rapide et servent de contrôle à un calcul analytique.</div>
  <div class="prop-box">
    <strong>Solide soumis à deux glisseurs.</strong> S'il est en équilibre, les deux forces ont la même droite d'action (celle qui joint leurs points d'application), la même intensité et des sens opposés. C'est le cas d'une <strong>bielle</strong> ou d'un tirant : solide à deux articulations (pivots en plan, sphériques en 3D), de masse négligée, sans autre action ; il est tendu ou comprimé selon sa droite.
  </div>
  <div class="prop-box">
    <strong>Solide soumis à trois glisseurs coplanaires non parallèles.</strong> S'il est en équilibre, les trois droites d'action sont <strong>concourantes</strong> en un point \(I\), et les trois forces forment un triangle fermé (\(\vec F_1 + \vec F_2 + \vec F_3 = \vec 0\)). Si les trois forces sont parallèles, la résultante nulle et un moment nul donnent les intensités (loi du levier).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Pourquoi trois forces en équilibre sont concourantes</span><div class="content">
    <p>Deux glisseurs : moments en \(A\), point de la droite de \(\vec F_1\) : \(\vec M(A) = \overrightarrow{AB}\wedge\vec F_2 = \vec 0\), donc \(\vec F_2\) est colinéaire à \(\overrightarrow{AB}\) ; la résultante nulle donne \(\vec F_2 = -\vec F_1\).</p>
    <p>Trois glisseurs : les droites de \(\vec F_1\) et \(\vec F_2\), non parallèles, se coupent en \(I\). En \(I\), leurs moments sont nuls, donc celui de \(\vec F_3\) aussi : sa droite d'action passe par \(I\).</p>
  </div></div>
  <p>Le <strong>polygone des forces</strong> généralise le triangle : pour \(n\) forces en équilibre, les vecteurs tracés bout à bout reviennent au point de départ. Il donne les intensités quand les directions sont connues.</p>

    </ol>
  </div>

</div>

<div class="course-section">
  <div class="sec-num">§10 · FROTTEMENT SEC : LOIS DE COULOMB</div>
  <h2>Adhérence et glissement</h2>
  <div class="intro">Un contact réel transmet, en plus de l'effort normal, un effort tangentiel. Sans lui, impossible de marcher, de freiner, de serrer une vis ou de transmettre un couple par une courroie. Le modèle de Coulomb, simple et robuste, décrit ce frottement sec avec un seul coefficient.</div>
  <div class="def-box">
    <strong>Lois de Coulomb.</strong> Au point de contact \(I\) entre les solides 1 et 2, de normale \(\vec n\) orientée de 1 vers 2, l'action de 1 sur 2 a pour résultante \(\vec R(1\to2) = N\,\vec n + \vec T\), avec \(N \geq 0\) (effort normal) et \(\vec T\) dans le plan tangent (effort tangentiel). On note \(\vec V_g = \vec V(I, 2/1)\) la vitesse de glissement (« Liaisons », §5).
    <ul style="margin-top:0.3rem">
      <li><strong>Glissement</strong> (\(\vec V_g \neq \vec 0\)) : \(\vec T\) est colinéaire à \(\vec V_g\), de sens opposé, et \(\|\vec T\| = f\,N\).</li>
      <li><strong>Adhérence</strong> (\(\vec V_g = \vec 0\)) : \(\|\vec T\| \leq f_0\,N\) ; \(\vec T\) est alors une inconnue, déterminée par l'équilibre.</li>
    </ul>
    \(f\) est le coefficient de frottement, \(f_0\) le coefficient d'adhérence (noté aussi \(f_s\)), un peu plus grand (on prend souvent \(f_0 = f\)). En première approximation, ils ne dépendent ni de l'aire de contact ni de la vitesse, seulement du couple de matériaux et de l'état des surfaces.
  </div>
  <div class="prop-box">
    <strong>Cône de frottement.</strong> On pose \(\tan\varphi = f\). En adhérence, la réaction \(\vec R(1\to2)\) reste à l'intérieur du cône d'axe \(\vec n\) et de demi-angle \(\varphi\) ; au glissement, elle est sur la surface du cône, inclinée de \(\varphi\) sur la normale, du côté opposé à \(\vec V_g\). Si l'équilibre exigerait une réaction hors du cône, il est impossible : le solide glisse.
  </div>

<figcaption>Cône de frottement du support sur le solide 2 (ici f = 0,4, φ ≈ 21,8°) : en adhérence, la réaction \(\vec R = \vec N + \vec T\) reste dans le cône ; au glissement, elle est sur sa surface. Sur un plan incliné, la réaction équilibre le poids, elle est donc verticale : le bloc tient tant que α ≤ φ.</figcaption>
</figure>
  <div class="formula">$$\begin{array}{|l|c|}
  \hline
  \textbf{Couple de matériaux} & f \text{ (ordre de grandeur)} \\
  \hline
  \text{Acier sur acier, à sec} & 0{,}15 \text{ à } 0{,}2 \\
  \text{Acier sur acier ou bronze, lubrifié} & 0{,}05 \text{ à } 0{,}1 \\
  \text{Garniture de frein sur fonte} & 0{,}3 \text{ à } 0{,}4 \\
  \text{Pneu sur route sèche / mouillée} & 0{,}8 \text{ à } 1 \;/\; 0{,}4 \text{ à } 0{,}6 \\
  \text{PTFE sur acier} & 0{,}05 \text{ à } 0{,}1 \\
  \text{Bois sur bois} & 0{,}3 \text{ à } 0{,}5 \\
  \hline
  \end{array}$$</div>
  <h3>Démarche</h3>
  <p>On ne sait pas d'avance si le contact adhère ou glisse. On fait une <strong>hypothèse</strong>, puis on la vérifie :</p>
  <ul>
    <li>hypothèse d'adhérence : \(T\) est une inconnue de plus ; on résout l'équilibre, puis on vérifie \(|T| \leq f_0 N\) (et \(N \geq 0\)) ;</li>
    <li>hypothèse de glissement : on connaît le sens de \(\vec V_g\), donc celui de \(\vec T\), et \(|T| = f N\) ; on vérifie que le sens du glissement obtenu est cohérent ;</li>
    <li>étude du <strong>seuil</strong> (« à la limite du glissement ») : on pose \(|T| = f N\) avec le sens du glissement imminent, et l'on cherche l'effort ou la géométrie correspondants.</li>
  </ul>
  <div class="method-box"><strong>Exemple — un bloc sur un plan incliné</strong>
    <ol>
      <li>Bloc de 20 kg sur un plan incliné de \(\alpha = 12°\), \(f_0 = 0{,}3\). Hypothèse d'adhérence ; les deux seules actions sont le poids et la réaction du plan, qui sont donc opposées : la réaction est verticale.</li>
      <li>\(N = m g\cos\alpha \approx 191{,}9\ \text{N}\) et \(T = m g\sin\alpha \approx 40{,}8\ \text{N}\) ; or \(f_0 N \approx 57{,}6\ \text{N}\) : \(T \leq f_0 N\), le bloc tient.</li>
      <li>Condition générale : \(\tan\alpha \leq f_0\), soit \(\alpha \leq \varphi_0 = \arctan0{,}3 \approx 16{,}7°\). L'angle limite ne dépend pas de la masse : c'est une mesure simple du coefficient d'adhérence.</li>
    </ol>
  </div>
  <h3>Frottement réparti : couple d'un frein à disque</h3>
  <p>Sur une surface de contact, la loi de Coulomb s'applique localement : \(\|\mathrm d\vec T\| = f\,p\,\mathrm dS\), opposé au glissement local. Un frein à disque ou un embrayage en donne l'exemple type : une garniture annulaire (rayons \(r\) et \(R\)) est pressée par un effort axial \(F_a\), le disque tourne ; chaque élément de garniture, à la distance \(\rho\) de l'axe, crée un moment de frottement \(\rho\,f\,p\,\mathrm dS\). Avec une pression uniforme \(p = F_a/\big(\pi(R^2 - r^2)\big)\) (garniture neuve) :</p>
  <div class="formula" data-nom="Couple de frottement d'une garniture annulaire">$$C = \int_r^R \rho\,f\,p\,2\pi\rho\,\mathrm d\rho = f\,F_a\,\frac{2}{3}\,\frac{R^3 - r^3}{R^2 - r^2}$$</div>
  <div class="method-box"><strong>Exemple — un étrier de frein</strong>
    <ol>
      <li>Garniture de rayons \(r = 60\ \text{mm}\) et \(R = 100\ \text{mm}\), effort de serrage \(F_a = 3\,000\ \text{N}\), \(f = 0{,}35\).</li>
      <li>Rayon équivalent : \(\frac{2}{3}\,\frac{0{,}1^3 - 0{,}06^3}{0{,}1^2 - 0{,}06^2} \approx 0{,}081\,7\ \text{m}\), presque le rayon moyen (80 mm).</li>
      <li>Couple par face : \(C = 0{,}35\times3\,000\times0{,}081\,7 \approx 85{,}8\ \text{N·m}\) ; un étrier qui pince les deux faces du disque donne le double, 172 N·m.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : écrire \(T = f N\) alors que le contact adhère (en adhérence, \(T\) est inconnue, seulement bornée) ; orienter \(\vec T\) dans le sens du mouvement du solide au lieu de l'opposer à la vitesse de glissement <strong>relative</strong> ; compter un frottement de glissement pour une roue qui roule sans glisser (il permet l'adhérence et ne dissipe rien, §12).</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · ARC-BOUTEMENT</div>
  <h2>Quand le frottement bloque tout</h2>
  <div class="intro">Dans certaines géométries, le frottement interdit le mouvement quel que soit l'effort moteur : plus on pousse, plus les efforts normaux augmentent, et le frottement avec eux. Ce phénomène est recherché dans un serre-joint, un coin de calage ou une vis irréversible ; il est redouté dans un tiroir qui se coince ou un guidage mal dimensionné.</div>
  <div class="def-box">
    <strong>Arc-boutement.</strong> Un solide est <strong>arc-bouté</strong> quand son équilibre par adhérence est possible pour toute intensité de l'effort moteur : aucune force, aussi grande soit-elle, ne le met en mouvement (dans la direction considérée). La condition est géométrique : elle porte sur des longueurs ou des angles, et fait intervenir \(f\), jamais l'intensité des efforts.
  </div>
  <p><strong>Méthode</strong> : isoler le solide, écrire l'équilibre au seuil du glissement (\(|T| = f N\) en chaque contact, dans le sens qui s'oppose au mouvement voulu), puis chercher pour quelle géométrie l'effort moteur nécessaire devient infini ou négatif. Graphiquement : il y a arc-boutement si la droite d'action de l'effort moteur passe dans la zone où les cônes de frottement des contacts se recouvrent.</p>

</figure>
  <div class="method-box"><strong>Exemple — un coulisseau sur une colonne</strong>
    <ol>
      <li>Un coulisseau de longueur de guidage \(L\), de poids \(Q\) (supposé sur l'axe), est poussé vers le haut par une force \(F\) parallèle à la colonne, à la distance \(d\) de son axe. Le jeu le fait basculer : il touche la colonne en \(A\) (en haut) et en \(B\) (en bas), du côté opposé.</li>
      <li>Équilibre au seuil, frottements vers le bas : horizontalement, \(N_A = N_B = N\) ; moments au centre du coulisseau : \(N L = F d\) (les moments des frottements, égaux et de bras opposés, se compensent) ; verticalement, \(F = Q + 2 f N\).</li>
      <li>D'où \(F\left(1 - \dfrac{2 f d}{L}\right) = Q\) : le coulisseau monte si \(L \gt 2 f d\), avec \(F = \dfrac{Q\,L}{L - 2 f d}\). Si \(L \leq 2 f d\), aucune force \(F\) ne suffit : arc-boutement.</li>
      <li>Avec \(Q = 200\ \text{N}\), \(f = 0{,}15\), \(d = 0{,}20\ \text{m}\) : \(2 f d = 0{,}06\ \text{m}\). Pour \(L = 0{,}10\ \text{m}\), \(F = 200/(1 - 0{,}6) = 500\ \text{N}\), 2,5 fois le poids ; pour \(L = 0{,}06\ \text{m}\) ou moins, le coulisseau est bloqué.</li>
    </ol>
  </div>
  <div class="notice"><strong>Règle de conception</strong> : un guidage en translation doit être long devant le porte-à-faux de l'effort (viser \(L\) nettement supérieur à \(2 f d\), car l'effort nécessaire explose à l'approche du seuil) ; inversement, un serre-joint fonctionne parce que sa mâchoire mobile, courte, est arc-boutée sur la barre par l'effort de serrage excentré. Les guidages sont repris en 2ᵉ année dans « Conception des liaisons » ; l'irréversibilité d'une vis-écrou, autre forme d'auto-blocage, est traitée dans <a href="#transm/cours">« Transmission de puissance »</a>, §8.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · FROTTEMENT VISQUEUX, RÉSISTANCE AU ROULEMENT ET AU PIVOTEMENT</div>
  <h2>Les autres lois de contact</h2>
  <div class="intro">Le frottement de Coulomb ne décrit pas tout. Dans un contact lubrifié, l'effort dépend de la vitesse ; une roue qui roule sans glisser rencontre pourtant une petite résistance. Ces deux modèles complètent le programme, et servent dès qu'on estime des pertes ou un couple à vide.</div>
  <div class="def-box">
    <strong>Frottement visqueux.</strong> Quand les surfaces sont séparées par un film de fluide (palier lubrifié, amortisseur, joint de vérin), l'effort résistant est proportionnel à la vitesse relative :
    <div class="formula" data-nom="Frottement visqueux">$$\vec F = -c\,\vec V_g \qquad\qquad C = -f_v\,\omega$$</div>
    \(c\) en N·s/m pour une translation, \(f_v\) en N·m·s/rad pour une rotation à la vitesse relative \(\omega\) (notations reprises en 2ᵉ année dans « Énergétique »). Contrairement au frottement sec, il n'existe pas d'adhérence : l'effort s'annule avec la vitesse. On combine souvent les deux : couple résistant \(C_0 + f_v\,\omega\) d'un moteur à vide.
  </div>
  <div class="method-box"><strong>Exemple — amortisseur et palier</strong>
    <ol>
      <li>Amortisseur de porte de coefficient \(c = 1\,500\ \text{N·s/m}\), tige à 0,2 m/s : effort résistant \(1\,500\times0{,}2 = 300\ \text{N}\) ; à l'arrêt, plus aucun effort.</li>
      <li>Arbre tournant à 3 000 tr/min (\(\omega \approx 314\ \text{rad/s}\)) dans un palier hydrodynamique de \(f_v = 2\cdot10^{-3}\ \text{N·m·s/rad}\) : \(C = f_v\,\omega \approx 0{,}63\ \text{N·m}\), et une puissance perdue \(C\,\omega \approx 197\ \text{W}\), qui chauffe l'huile.</li>
    </ol>
  </div>
  <div class="def-box">
    <strong>Résistance au roulement.</strong> Une roue qui roule sans glisser déforme le sol et se déforme : la pression de contact est plus forte à l'avant, et l'action normale du sol passe à une distance \(\delta\) en avant du point de contact théorique \(I\). Écrit en \(I\), le torseur de l'action du sol comporte un moment qui s'oppose au roulement (rotation \(\vec\Omega_t\), « Liaisons », §5), de norme au plus \(\delta\,N\). Pour une roue de rayon \(R\) tirée par son axe, il faut un effort
    <div class="formula" data-nom="Résistance au roulement">$$F \approx \frac{\delta}{R}\,N$$</div>
    \(\delta\), le paramètre de résistance au roulement, est une longueur : de l'ordre de 0,01 mm pour une bille de roulement, 0,5 mm pour une roue de wagon sur rail, quelques millimètres pour un pneu sur route.
  </div>

<figcaption>Résistance au roulement d'une roue tirée (déformations exagérées) : la pression de contact est plus forte à l'avant, la réaction \(\vec R\) du sol s'applique en J, à la distance δ en avant de I. La roue étant soumise à trois forces (P, F, R), \(\vec R\) passe par C : \(F \approx \delta N/R\).</figcaption>
</figure>
  <div class="def-box">
    <strong>Résistance au pivotement.</strong> De même, le contact s'oppose à la rotation autour de la normale (pivotement \(\vec\Omega_n\)) par un moment de norme au plus \(\delta_p\,N\), où \(\delta_p\) est une autre longueur caractéristique. C'est elle qu'on sent en braquant une voiture à l'arrêt, et qui arrête une toupie.
  </div>
  <div class="method-box"><strong>Exemple — rouler à vélo</strong>
    <ol>
      <li>Cycliste et vélo : 85 kg, roues de rayon \(R = 0{,}34\ \text{m}\), pneus route avec \(\delta \approx 1{,}7\ \text{mm}\) (\(\delta/R = 0{,}005\)).</li>
      <li>Effort résistant total : \(F = (\delta/R)\,m g = 0{,}005\times85\times9{,}81 \approx 4{,}2\ \text{N}\), quelle que soit la répartition du poids entre les roues.</li>
      <li>À 25 km/h (6,94 m/s) : puissance \(F v \approx 29\ \text{W}\), à comparer à environ 80 W pour la résistance de l'air à cette vitesse. Faire glisser le même vélo sur ses pneus (\(f = 0{,}8\)) demanderait 670 N : c'est tout l'intérêt de la roue.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre l'adhérence (effort tangentiel au contact d'une roue motrice ou freinée, borné par \(f_0 N\), qui ne dissipe rien sans glissement) et la résistance au roulement (petit moment \(\delta N\), qui dissipe de l'énergie même sans glissement).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce qui dépasse le programme de PTSI</h2>
  <div class="intro">Rien de ce qui suit n'est exigible en 1ʳᵉ année ; le principe des travaux virtuels n'est au programme d'aucune des deux années.</div>
  <div class="notice"><strong>Hors programme (pour aller plus loin) : principe des travaux virtuels (PTV).</strong> Pour un système en équilibre, la somme des travaux de toutes les actions, dans tout déplacement virtuel compatible avec les liaisons, est nulle : \(\sum_i \vec F_i\cdot\delta\vec r_i = 0\). Les liaisons parfaites ne travaillent pas dans ces déplacements : elles disparaissent de l'équation, qui relie directement effort moteur et effort résistant pour un mécanisme de mobilité 1. Démarche : paramétrer le mécanisme par un seul paramètre \(\theta\), exprimer les positions des points d'application, poser \(\sum_i \vec F_i\cdot\frac{\mathrm d\vec r_i}{\mathrm d\theta} = 0\). Le même résultat s'obtient au programme par des isolements bien choisis (PFS) et, en 2ᵉ année, par l'énergétique (puissances, théorème de l'énergie cinétique) : voir l'exercice « bielle-manivelle ».</div>
  <ul>
    <li><strong>Graphe de structure et choix des isolements</strong> (2ᵉ année, S3) : choisir quel solide isoler et quelle équation écrire pour obtenir une action inconnue sans calculer les autres, dans « Chaînes de solides », §3.</li>
    <li><strong>Centre d'inertie et matrice d'inertie</strong> (2ᵉ année, S3) : en dynamique, la répartition des masses intervient aussi par les moments d'inertie (« Cinétique et dynamique du solide »).</li>
    <li><strong>Pressions de contact de Hertz</strong> (hors programme) : entre deux surfaces courbes (bille, galet, denture), la zone de contact est minuscule et la pression atteint le gigapascal ; son calcul fait appel à l'élasticité.</li>
    <li><strong>Inconnues hyperstatiques</strong> (hors programme des deux années) : les calculer demande un modèle déformable des pièces ; le programme se limite à les dénombrer et à interpréter les conditions géométriques.</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="stat-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · STATIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : modéliser les actions (§1 à §6), écrire et résoudre l'équilibre (§7 à §9), traiter les contacts réels (§10 à §12). Chacune se termine par un exemple court, chiffré et vérifié.</div>

  <div class="method-box">
    <strong>Méthode 1 — Isoler un système et dresser le bilan des actions extérieures</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Frontière.</span> Choisir le système isolé (un solide, ou un groupe de solides) et tracer sa frontière sur le schéma.</li>
      <li><span class="step">À distance.</span> Recenser les actions à distance : le poids de chaque solide isolé, en son centre de gravité (ou le négliger en le disant).</li>
      <li><span class="step">Liaisons.</span> Parcourir la frontière : chaque liaison coupée apporte son torseur transmissible (méthode 4), chaque contact son effort normal et, s'il y a frottement, tangentiel.</li>
      <li><span class="step">Actions données.</span> Ajouter les efforts connus ou cherchés : charge, effort d'un vérin, couple d'un moteur, ressort.</li>
      <li><span class="step">Contrôle.</span> Aucune action intérieure au système ; compter les inconnues et les équations (3 en plan, 6 dans l'espace) avant de calculer.</li>
    </ol>
    <p><em>Exemple éclair :</em> une brouette chargée (poids 800 N à 0,4 m en arrière de l'axe de la roue) est tenue horizontalement par les bras à 1,2 m de cet axe. On isole brouette et roue : poids, action du sol sous la roue (verticale si l'on néglige frottement et résistance au roulement), effort des mains (vertical). Moments au contact de la roue : \(F\times1{,}2 = 800\times0{,}4\), soit \(F \approx 267\ \text{N}\) ; la roue porte \(800 - 267 \approx 533\ \text{N}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Écrire et transporter un torseur, reconnaître un glisseur ou un couple</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Point et base.</span> Écrire le torseur au point où il est le plus simple (point d'application, centre, point de l'axe), dans une base où ses composantes sont lisibles.</li>
      <li><span class="step">Transport.</span> Pour un autre point : \(\vec M(B) = \vec M(A) + \overrightarrow{BA}\wedge\vec R\) (« BABAR ») ; la résultante ne change pas.</li>
      <li><span class="step">Nature.</span> \(\vec R = \vec 0\) : couple (même moment partout). \(\vec R \neq \vec 0\) et \(\vec R\cdot\vec M = 0\) : glisseur, dont l'axe est l'ensemble des points de moment nul. En plan, toute action de résultante non nulle est un glisseur.</li>
    </ol>
    <p><em>Exemple éclair :</em> action \(\{100\,\vec x \;;\; \vec 0\}_A\) (N), transportée en \(B\) avec \(\overrightarrow{AB} = 0{,}2\,\vec y\ \text{m}\) : \(\vec M(B) = (-0{,}2\,\vec y)\wedge100\,\vec x = 20\,\vec z\ \text{N·m}\). L'automoment \(\vec R\cdot\vec M(B)\) est nul : c'est bien un glisseur, d'axe \((A, \vec x)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Passer d'une répartition d'efforts au torseur global</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Modèle local.</span> Écrire l'effort élémentaire \(\mathrm d\vec F\) (densité × élément de longueur, de surface ou de volume) et repérer les symétries.</li>
      <li><span class="step">Résultante.</span> \(\vec R = \int\mathrm d\vec F\) ; pour des efforts parallèles, c'est l'aire (ou le volume) du diagramme de charge.</li>
      <li><span class="step">Point d'application.</span> Pour des efforts parallèles, la résultante passe par le centre du diagramme ; sinon calculer \(\vec M(P) = \int\overrightarrow{PM}\wedge\mathrm d\vec F\).</li>
      <li><span class="step">Résultats à connaître.</span> Charge uniforme \(q\ell\) au milieu ; triangulaire \(q_0\ell/2\) aux 2/3 depuis le zéro ; pression uniforme \(pS\) au centre de surface ; demi-cylindre \(pDL\) ; paroi verticale immergée \(\rho g b H^2/2\) aux 2/3 de la profondeur. Découper un diagramme compliqué en morceaux simples.</li>
    </ol>
    <p><em>Exemple éclair :</em> charge trapézoïdale de 1 kN/m à 3 kN/m sur une poutre de 3 m. Rectangle : 3 kN à 1,5 m ; triangle de 0 à 2 kN/m : 3 kN à 2 m. Résultante 6 kN, à \((3\times1{,}5 + 3\times2)/6 = 1{,}75\ \text{m}\) de l'extrémité la moins chargée.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Écrire les inconnues d'une liaison</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Base locale.</span> \(\vec x\) selon l'axe, la direction ou la ligne de contact, \(\vec z\) selon la normale ; nommer le point caractéristique.</li>
      <li><span class="step">Dualité.</span> Lister les mouvements permis ; annuler la force selon chaque translation permise et le moment autour de chaque rotation permise. Il reste \(n_s = 6 - n_c\) inconnues (tableau complet dans « Liaisons », §6).</li>
      <li><span class="step">Domaine.</span> Vérifier que le point d'écriture est dans le domaine de validité de la forme simple (axe, centre, normale) ; sinon, transporter.</li>
      <li><span class="step">Plan.</span> En problème plan justifié, garder \(X, Y, M_z\) utiles : pivot \(X, Y\) ; glissière \(Y, M_z\) ; contact ponctuel \(Y\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pivot glissant d'axe \((A, \vec x)\) : \(\{Y\vec y + Z\vec z \;;\; M\vec y + N\vec z\}_A\). Écrit en \(B\), \(\overrightarrow{AB} = 0{,}1\,\vec y\ \text{m}\), hors de l'axe : \(\vec M(B) = -0{,}1\,Z\,\vec x + M\vec y + N\vec z\). La composante selon \(\vec x\) n'est pas une inconnue de plus, c'est le transport.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Compter inconnues et équations, vérifier l'isostatisme</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Classes.</span> Compter les \(n\) classes d'équivalence, bâti compris, et les liaisons.</li>
      <li><span class="step">Inconnues.</span> \(I_s = \sum n_s\) (en plan, 2 pour un pivot, 2 pour une glissière, 1 pour un contact ponctuel).</li>
      <li><span class="step">Mobilité.</span> Obtenir \(m\) en observant le mécanisme : bloquer l'entrée et chercher ce qui bouge encore (mobilités internes comprises).</li>
      <li><span class="step">Conclure.</span> \(h = m + I_s - 6(n-1)\) (en plan : \(3(n-1)\)). Si \(h \gt 0\), il restera \(h\) inconnues indéterminées ; si \(h \lt 0\), une mobilité a été oubliée. Pour localiser l'hyperstatisme et rendre le modèle isostatique : « Liaisons », méthodes 9 et 10.</li>
    </ol>
    <p><em>Exemple éclair :</em> porte sur deux gonds modélisés par deux pivots coaxiales : \(n = 2\), \(I_s = 10\), \(m = 1\), \(h = 1 + 10 - 6 = 5\) ; les efforts dans chaque gond ne se calculent pas séparément. Avec une sphérique et une sphère-cylindre : \(I_s = 5\), \(h = 0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Appliquer le PFS : choisir le modèle, le point et les projections</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Modèle.</span> Justifier le problème plan (symétrie de la géométrie et du chargement) ou travailler dans l'espace.</li>
      <li><span class="step">Point.</span> Écrire les moments là où passent le plus d'inconnues (centre d'une sphérique, point de l'axe d'une pivot, intersection de deux droites d'action) : elles disparaissent de l'équation.</li>
      <li><span class="step">Mobilité.</span> Pour un solide qui peut tourner, l'équation des moments autour de son axe ne contient que les actions extérieures données : elle relie directement effort moteur et effort résistant.</li>
      <li><span class="step">Projections.</span> Projeter la résultante perpendiculairement aux inconnues qu'on veut éliminer ; viser une équation, une inconnue.</li>
      <li><span class="step">Contrôle.</span> Signe des efforts normaux, ordre de grandeur, et une équation non utilisée pour vérifier.</li>
    </ol>
    <p><em>Exemple éclair :</em> pédale de frein articulée en \(O\) ; le pied pousse de 300 N à 0,25 m de \(O\), la tige du maître-cylindre retient la pédale à 0,05 m de \(O\), les deux efforts étant perpendiculaires à la pédale. Moments en \(O\) : \(F_B = 300\times0{,}25/0{,}05 = 1\,500\ \text{N}\) ; résultante : le pivot reprend \(1\,500 - 300 = 1\,200\ \text{N}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Exploiter un solide soumis à deux ou trois glisseurs</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Bielles.</span> Repérer les solides à deux articulations, de masse négligée, sans autre action : leur action est portée par la droite qui joint les articulations.</li>
      <li><span class="step">Trois glisseurs.</span> Pour un solide soumis à trois forces non parallèles, prolonger les deux droites d'action connues jusqu'à leur intersection \(I\) : la troisième y passe.</li>
      <li><span class="step">Triangle.</span> Tracer à l'échelle le triangle fermé des forces, en partant de la force entièrement connue ; lire les intensités (ou les calculer par la loi des sinus).</li>
    </ol>
    <p><em>Exemple éclair :</em> échelle homogène contre un mur lisse, inclinée de 60° sur le sol. Le mur pousse horizontalement en \(B\) ; le poids est vertical en \(G\) ; la réaction du sol passe par leur intersection \(I\), à la verticale de \(G\) et à la hauteur de \(B\). Son inclinaison sur la verticale vérifie \(T/N = \dfrac{1}{2\tan60°} \approx 0{,}29\) : il faut \(f_0 \geq 0{,}29\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Traiter un contact avec frottement de Coulomb</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Modèle.</span> Au contact : \(N \geq 0\) selon la normale, \(T\) dans le plan tangent.</li>
      <li><span class="step">Hypothèse.</span> Adhérence : \(T\) inconnue ; résoudre, puis vérifier \(|T| \leq f_0 N\). Glissement : \(\vec T\) opposé à la vitesse de glissement relative, \(|T| = f N\).</li>
      <li><span class="step">Seuil.</span> Pour un effort limite ou une géométrie limite : poser \(|T| = f N\) dans le sens du glissement imminent.</li>
      <li><span class="step">Graphiquement.</span> La réaction reste dans le cône de demi-angle \(\varphi = \arctan f\) ; au seuil, elle est sur son bord.</li>
    </ol>
    <p><em>Exemple éclair :</em> caisse de 50 kg, \(f_0 = 0{,}4\). Poussée horizontale : elle part pour \(F = f_0 m g \approx 196\ \text{N}\) ; à 150 N, elle adhère avec \(T = 150\ \text{N}\). Poussée inclinée de 30° vers le bas : \(F\cos30° = f_0\,(m g + F\sin30°)\), soit \(F \approx 295\ \text{N}\) : pousser vers le bas augmente \(N\), donc le frottement.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Établir une condition d'arc-boutement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Contacts.</span> Identifier les contacts qui portent l'effort (souvent deux, aux extrémités d'un guidage basculé) et le sens du mouvement voulu.</li>
      <li><span class="step">Seuil.</span> Écrire l'équilibre avec \(|T| = f N\) en chaque contact, frottements opposés au mouvement voulu.</li>
      <li><span class="step">Condition.</span> Exprimer l'effort moteur nécessaire ; l'arc-boutement correspond à un dénominateur nul ou négatif. La condition porte sur la géométrie (longueurs, angles) et \(f\), jamais sur l'intensité des efforts.</li>
      <li><span class="step">Contrôle graphique.</span> L'effort moteur passe-t-il dans la zone commune aux cônes de frottement ? Si oui, arc-boutement.</li>
    </ol>
    <p><em>Exemple éclair :</em> mâchoire mobile d'un serre-joint, guidée sur une longueur \(L = 12\ \text{mm}\), effort de serrage à \(d = 80\ \text{mm}\) de la barre. Avec \(f = 0{,}1\), \(2 f d = 16\ \text{mm} \geq L\) : la mâchoire est arc-boutée, elle tient. Barre huilée (\(f = 0{,}07\)) : \(2 f d = 11{,}2\ \text{mm} \lt L\), elle glisse. D'où les barres crantées ou striées.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Prendre en compte frottement visqueux et résistance au roulement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Reconnaître le contact.</span> Film lubrifiant ou amortisseur : visqueux, effort \(c\,v\) ou couple \(f_v\,\omega\), nul à l'arrêt. Roue qui roule sans glisser : résistance au roulement, moment \(\delta N\), soit un effort \(\delta N/R\) au niveau de l'axe.</li>
      <li><span class="step">Régime permanent.</span> À vitesse constante et inerties négligées, écrire les mêmes équations qu'en statique, en ajoutant ces efforts résistants dans le sens opposé au mouvement relatif.</li>
      <li><span class="step">Bilan.</span> Additionner les efforts résistants ramenés au même point ; la puissance perdue vaut effort × vitesse (ou couple × vitesse angulaire).</li>
    </ol>
    <p><em>Exemple éclair :</em> transpalette chargé à 1,2 t sur galets de rayon 40 mm, \(\delta/R = 0{,}01\) : effort pour le rouler, \(0{,}01\times1\,200\times9{,}81 \approx 118\ \text{N}\). Porte coulissante amortie (\(c = 200\ \text{N·s/m}\)) fermée à 0,3 m/s : 60 N de freinage, qui s'annulent à l'arrêt.</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> :
    <ul style="margin-top:.3rem">
      <li>oublier une action extérieure (le poids, une liaison coupée par la frontière) ou en ajouter une intérieure ;</li>
      <li>sommer des moments écrits en des points différents ;</li>
      <li>écrire une forme simple de torseur hors de son domaine de validité (sphérique ailleurs qu'en son centre) ;</li>
      <li>prendre \(h_{\text{plan}} = 0\) pour un mécanisme isostatique dans l'espace, ou appliquer le modèle plan à un chargement dissymétrique ;</li>
      <li>écrire \(T = f N\) en adhérence, ou orienter \(\vec T\) dans le sens du mouvement au lieu de l'opposer au glissement relatif ;</li>
      <li>conclure sans vérifier \(N \geq 0\) (le contact peut décoller) et la position de la résultante dans un appui plan (§5) ;</li>
      <li>vouloir calculer les inconnues d'un modèle hyperstatique par la seule statique.</li>
    </ul>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Appliquer le PFS pour trouver les composantes \(X\), \(Y\) et \(M_O\) de l'action de l'encastrement.</div>
  <div class="q"><strong>Q3.</strong> Vérifier que le modèle est isostatique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Problème plan (poutre et charge dans le plan \((\vec x, \vec y)\)). Actions extérieures : l'encastrement, \(\{X\vec x + Y\vec y \;;\; M_O\vec z\}_O\), trois inconnues ; la charge \(\{-F\vec y \;;\; \vec 0\}_B\).</p>
    <p><strong>Q2.</strong> Résultante : \(X = 0\) et \(Y - F = 0\), d'où \(Y = 800\ \text{N}\). Moments en \(O\) (on élimine \(X\) et \(Y\)) : \(M_O + L\times(-F) = 0\), d'où \(M_O = F L = 800\times1{,}2 = 960\ \text{N·m}\). \(M_O \gt 0\) : le mur exerce un moment dans le sens trigonométrique, qui empêche la charge de faire tourner la poutre dans le sens horaire.</p>
    <p><strong>Q3.</strong> Une seule pièce mobile (\(n = 2\)), immobile (\(m = 0\)), \(I_s = 3\) : \(h = m + I_s - 3(n-1) = 0 + 3 - 3 = 0\). Le modèle est isostatique : les trois équations ont donné les trois inconnues.</p>
  </div>

  <div class="q"><strong>Q1.</strong> Situer le centre de gravité G, puis trouver \(F_B\) par l'équation des moments en O.</div>
  <div class="q"><strong>Q2.</strong> En déduire l'action \(R_O\) du pivot sur le levier.</div>
  <div class="q"><strong>Q3.</strong> Toujours avec \(F_A = 30\ \text{N}\) et un levier de 1 m, où placer O pour que l'équilibre soit obtenu sans \(F_B\) ?</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le levier est homogène : G est au milieu de AB, à \(0{,}5\ \text{m}\) de A, donc à \(x_G = 0{,}5 - 0{,}4 = 0{,}1\ \text{m}\) de O, du côté de B. Poids : \(P = m g = 19{,}62\ \text{N}\). Moments en O (sens trigonométrique positif, A à gauche de O) : \(F_A\,a - P\,x_G - F_B\,b = 0\), soit \(30\times0{,}4 - 19{,}62\times0{,}1 - 0{,}6\,F_B = 0\), d'où \(F_B = 10{,}04/0{,}6 \approx 16{,}7\ \text{N}\).</p>
    <p><strong>Q2.</strong> Toutes les forces sont verticales : l'action du pivot aussi. \(R_O - F_A - P - F_B = 0\), d'où \(R_O \approx 30 + 19{,}6 + 16{,}7 = 66{,}3\ \text{N}\), vers le haut.</p>
    <p><strong>Q3.</strong> Sans \(F_B\), les moments en O donnent \(F_A\,a = P\,x_G\), avec \(x_G = 0{,}5 - a\) (G reste au milieu du levier) : \(F_A\,a = m g\,(0{,}5 - a)\), d'où</p>
    <div class="formula">$$a = \frac{0{,}5\,m g}{F_A + m g} = \frac{0{,}5\times19{,}62}{30 + 19{,}62} \approx 0{,}198\ \text{m}$$</div>
    <p>O doit être à environ 0,20 m de A (et 0,80 m de B) : le poids du long bras équilibre alors seul la force en A. Contrôle : \(30\times0{,}198 = 5{,}93\ \text{N·m}\) et \(19{,}62\times0{,}302 = 5{,}93\ \text{N·m}\).</p>
  </div>
</div>

  <div class="q"><strong>Q3.</strong> Vérifier que l'échelle ne glisse pas.</div>
  <div class="q"><strong>Q4.</strong> Quel est l'angle minimal \(\alpha_{\min}\) en dessous duquel l'échelle glisse ? Dépend-il de la masse ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Poids \(P = 15\times9{,}81 \approx 147{,}2\ \text{N}\) en G. Sol en A : effort normal \(N_A\) (vertical, vers le haut) et effort tangentiel \(T_A\) (horizontal, inconnu en adhérence ; il retient le pied de l'échelle, donc vers le mur). Mur lisse en B : effort normal \(N_B\) seulement, horizontal, dirigé vers l'extérieur du mur. Trois inconnues, trois équations en plan.</p>
    <p><strong>Q2.</strong> Résultante horizontale : \(T_A - N_B = 0\) ; verticale : \(N_A - P = 0\), donc \(N_A \approx 147{,}2\ \text{N}\). Moments en A (on élimine \(N_A\) et \(T_A\)) : \(N_B\,L\sin\alpha - P\,\dfrac{L}{2}\cos\alpha = 0\), d'où</p>
    <div class="formula">$$N_B = \frac{P}{2\tan\alpha} = \frac{147{,}2}{2\tan65°} \approx 34{,}3\ \text{N} = T_A$$</div>
    <p><strong>Q3.</strong> \(f_0\,N_A = 0{,}4\times147{,}2 \approx 58{,}9\ \text{N}\) et \(|T_A| \approx 34{,}3\ \text{N} \lt 58{,}9\ \text{N}\) : l'hypothèse d'adhérence est vérifiée, l'échelle ne glisse pas.</p>
    <p><strong>Q4.</strong> Elle tient tant que \(\dfrac{P}{2\tan\alpha} \leq f_0\,P\), soit \(\tan\alpha \geq \dfrac{1}{2 f_0} = 1{,}25\), \(\alpha_{\min} \approx 51{,}3°\). La masse s'élimine : seule compte la géométrie (et \(f_0\)). En revanche, une personne qui monte décale le centre de gravité de l'ensemble vers le haut et augmente \(\alpha_{\min}\) (simulateur du chapitre).</p>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Isoler le nœud C (méthode des nœuds) et trouver les efforts dans les barres AC et BC.</div>
  <div class="q"><strong>Q3.</strong> Les barres AC et BC sont-elles tendues ou comprimées ? Et AB ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Résultante horizontale : \(R_{Ax} = 0\). Moments en A (C est à la verticale du milieu de AB) : \(R_{By}\,L - F\,\dfrac L2 = 0\), donc \(R_{By} = F/2 = 5\ \text{kN}\) ; résultante verticale : \(R_{Ay} = F - R_{By} = 5\ \text{kN}\), comme le laissait prévoir la symétrie.</p>
    <p><strong>Q2.</strong> Chaque barre, articulée à ses deux extrémités et non chargée entre elles, est soumise à deux glisseurs : son action sur un nœud est portée par la barre. Au nœud C, par symétrie, AC et BC exercent la même intensité \(F_b\), inclinée de 60° sur l'horizontale. Résultante verticale : \(2\,F_b\sin60° = F\), d'où \(F_b = \dfrac{10}{2\times0{,}866} \approx 5{,}77\ \text{kN}\).</p>
    <p><strong>Q3.</strong> Pour retenir F, dirigée vers le bas, les barres doivent pousser le nœud C vers le haut, de A vers C et de B vers C : elles sont <strong>comprimées</strong>. Au nœud A, la barre AC pousse A vers le bas et vers la gauche ; avec \(R_{Ax} = 0\), la barre AB doit tirer A vers B : elle est <strong>tendue</strong>, avec \(F_{AB} = F_b\cos60° \approx 2{,}89\ \text{kN}\).</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Exprimer l'abscisse \(x_B\) de B en fonction de \(\theta\).</div>
  <div class="q"><strong>Q2.</strong> Isoler la bielle : quelle est la direction de son action sur le coulisseau ?</div>
  <div class="q"><strong>Q3.</strong> Isoler le coulisseau : en déduire l'intensité \(S\) de l'effort dans la bielle et l'action de la glissière.</div>
  <div class="q"><strong>Q4.</strong> Isoler la manivelle : en déduire \(C_0\) en fonction de \(F\), \(L\) et \(\theta\), puis l'action du pivot en O.</div>
  <div class="q"><strong>Q5.</strong> Application numérique pour \(\theta = 50°\).</div>
  <div class="q"><strong>Q6.</strong> (Hors programme, pour aller plus loin.) Retrouver \(C_0\) par le principe des travaux virtuels.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> A est à la hauteur \(L\sin\theta\) ; B, sur la glissière, est à la hauteur de O : la bielle fait avec l'horizontale un angle \(\varphi\) tel que \(L\sin\varphi = L\sin\theta\), donc \(\varphi = \theta\) (B du côté \(x \gt 0\)), et \(x_B = L\cos\theta + L\cos\theta = 2L\cos\theta\).</p>
    <p><strong>Q2.</strong> La bielle, de masse négligée, n'est soumise qu'aux actions de ses deux articulations : deux glisseurs, donc portés par AB, opposés. Son action sur le coulisseau est \(S\,\vec u\), avec \(\vec u = (\overrightarrow{BA})/L = -\cos\theta\,\vec x + \sin\theta\,\vec y\) ; \(S \gt 0\) si la bielle est tendue.</p>
    <p><strong>Q3.</strong> Coulisseau : \(F\vec x + S\vec u + N_g\vec y = \vec 0\) (glissière parfaite : pas d'effort selon \(\vec x\)). Sur \(\vec x\) : \(F - S\cos\theta = 0\), \(S = F/\cos\theta\) : la bielle est tendue. Sur \(\vec y\) : \(N_g = -S\sin\theta = -F\tan\theta\) : la glissière retient le coulisseau vers le bas (elle doit donc le guider des deux côtés).</p>
    <p><strong>Q4.</strong> La bielle tire A vers B : action \(S\,(\cos\theta\,\vec x - \sin\theta\,\vec y)\). Moments en O sur la manivelle :</p>
    <div class="formula">$$C_0 + L\cos\theta\,(-S\sin\theta) - L\sin\theta\,(S\cos\theta) = 0 \qquad\Longrightarrow\qquad C_0 = 2\,S\,L\sin\theta\cos\theta = 2\,F L\sin\theta$$</div>
    <p>Résultante sur la manivelle : le pivot exerce \(X_O = -S\cos\theta = -F\) et \(Y_O = S\sin\theta = F\tan\theta\).</p>
    <p><strong>Q5.</strong> \(\theta = 50°\) : \(S = 200/\cos50° \approx 311\ \text{N}\) ; \(N_g \approx -238\ \text{N}\) ; \(C_0 = 2\times200\times0{,}5\times\sin50° \approx 153\ \text{N·m}\) ; action du pivot \((-200\ ;\ 238)\ \text{N}\). Le couple est maximal pour \(\theta = 90°\) (\(2FL = 200\ \text{N·m}\)) et tend vers 0 quand la bielle s'aligne sur la glissière, alors que \(S\) reste au moins égal à F.</p>
    <p><strong>Q6.</strong> (Hors programme.) Dans un déplacement virtuel \(\delta\theta\), seules travaillent \(C_0\) et \(F\) (liaisons parfaites) : \(C_0\,\delta\theta + F\,\delta x_B = 0\), avec \(\delta x_B = -2L\sin\theta\,\delta\theta\), d'où \(C_0 = 2FL\sin\theta\), sans calculer \(S\) ni les réactions. C'est le même résultat : les isolements du PFS, bien choisis, y conduisent aussi.</p>
  </div>
</div>

  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Poutre encastrée — charge et couple</h3>
  <div class="statement">Une poutre horizontale AB (\(L = 4\ \text{m}\)) est encastrée en A. Elle porte une charge verticale \(F = 500\ \text{N}\), vers le bas, en B, et reçoit en son milieu un couple \(M = 200\ \text{N·m}\) de sens trigonométrique (selon \(+\vec z\)). Problème plan : l'encastrement transmet \(R_{Ax}\), \(R_{Ay}\) et \(M_{Az}\) (six inconnues dans l'espace, trois en plan).</div>
  <div class="q"><strong>Q1.</strong> Écrire les équations d'équilibre (résultante et moment en A).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(R_{Ax}\), \(R_{Ay}\) et \(M_{Az}\).</div>
  <div class="q"><strong>Q3.</strong> (2ᵉ année : torseur de cohésion.) Tracer les diagrammes des efforts intérieurs (effort normal, effort tranchant, moment fléchissant) le long de AB.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Résultante : \(R_{Ax} = 0\) et \(R_{Ay} - F = 0\). Moments en A : \(M_{Az} - F\,L + M = 0\) (le couple compte de la même façon en tout point).</p>
    <p><strong>Q2.</strong> \(R_{Ax} = 0\), \(R_{Ay} = 500\ \text{N}\), \(M_{Az} = 500\times4 - 200 = 1\,800\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> On coupe la poutre à l'abscisse \(x\). Convention du chapitre « Résistance des matériaux » : le torseur de cohésion est l'action du tronçon aval \([x, L]\) sur le tronçon amont \([0, x]\), c'est-à-dire la somme des actions extérieures appliquées au tronçon aval. Pour \(x \in [0, 2[\) : \(N = 0\), \(T_y = -500\ \text{N}\), \(M_{fz} = 200 - 500\,(4 - x) = 500x - 1\,800\) (de −1 800 à −800 N·m). En \(x = 2\), saut de \(-200\ \text{N·m}\) (le couple quitte le tronçon aval). Pour \(x \in\ ]2, 4]\) : \(T_y = -500\ \text{N}\), \(M_{fz} = -500\,(4 - x)\) (de −1 000 à 0 N·m). En B, \(M_{fz} = 0\) : extrémité libre. Le moment fléchissant est maximal en valeur absolue à l'encastrement, 1 800 N·m.</p>
  </div>
</div>

    <p><strong>Q4.</strong> Charge triangulaire : résultante \(q_0 L/2 = 60\ \text{N}\), à \(2L/3 \approx 1{,}33\ \text{m}\) de A. Moments en A : \(R_B = 60\times1{,}333/2 = 40\ \text{N}\), puis \(R_A = 20\ \text{N}\). Avec le poids propre : \(R_A = 20 + 30 = 50\ \text{N}\) et \(R_B = 40 + 30 = 70\ \text{N}\).</p>
    <p><strong>Q5.</strong> Deux contacts ponctuels de normale verticale : \(I_s = 2\) ; la poutre peut glisser horizontalement, \(m = 1\) ; \(h = m + I_s - 3 = 0\). L'équilibre n'existe que parce que les charges sont verticales : la moindre charge horizontale ferait glisser la poutre. En remplaçant l'appui A par une articulation (pivot, 2 inconnues), \(I_s = 3\), \(m = 0\), \(h = 0\) : c'est le modèle usuel « articulation + appui à rouleau », qui laisse aussi la poutre se dilater librement.</p>
