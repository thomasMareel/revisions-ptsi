  <div class="q"><strong>Q2.</strong> Isoler l'ensemble {panneau, mât, massif}. Déterminer l'effort normal \(N\), l'effort tangentiel \(T\) exercés par le sol et l'excentricité \(e\) de la résultante normale par rapport au centre de la base.</div>
  <div class="q"><strong>Q3.</strong> Le contact est-il total ? Calculer la pression maximale sous le massif. Vérifier l'absence de glissement et de basculement.</div>
  <div class="q"><strong>Q4.</strong> Quelle longueur \(a\) (même largeur, même hauteur) faudrait-il pour que tout le massif reste comprimé sous ce vent ?</div>
  <div class="q"><strong>Q5.</strong> Avec \(a = 1{,}2\ \text{m}\), à partir de quelle pression de vent l'ensemble basculerait-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pression uniforme sur une surface plane : \(H = p_v\,S = 600\times2{,}0\times1{,}5 = 1\,800\ \text{N}\), horizontale, appliquée au centre du panneau, donc à 4,0 m au-dessus de la base du massif.</p>
    <p><strong>Q2.</strong> Poids du massif : \(2\,400\times9{,}81\times1{,}2\times1{,}0\times0{,}8 \approx 22\,600\ \text{N}\) ; avec le mât et le panneau, \(W \approx 23\,600\ \text{N}\), sur l'axe du massif. Actions extérieures : \(W\), \(H\), et l'action du sol (\(N\) vertical, \(T\) horizontal). Résultante : \(N = W \approx 23{,}6\ \text{kN}\) et \(T = H = 1{,}8\ \text{kN}\) (opposé au vent). Moments au centre O de la base : le vent crée \(H h = 7{,}2\ \text{kN·m}\), que doit équilibrer \(N\) décalée de \(e\) du côté sous le vent : \(N e = H h\), d'où \(e = 7\,200/23\,600 \approx 0{,}305\ \text{m}\).</p>
    <p><strong>Q3.</strong> \(a/6 = 0{,}20\ \text{m} \lt e\) : la résultante sort du tiers central, une partie de la base décolle (côté au vent). Longueur comprimée \(c = 3\,(a/2 - e)\), soit \(3\times(0{,}60 - 0{,}305) \approx 0{,}885\ \text{m}\), et \(p_{\max} = \dfrac{2N}{b\,c} \approx \dfrac{2\times23\,600}{1{,}0\times0{,}885} \approx 53\ \text{kPa}\), bien en dessous de 150 kPa. Glissement : \(T/N \approx 0{,}076 \lt f_0 = 0{,}5\), le massif adhère. Basculement : \(e = 0{,}305\ \text{m} \lt a/2 = 0{,}60\ \text{m}\), la résultante reste dans la base.</p>
    <p><strong>Q4.</strong> Il faut \(6\,e \leq a\), avec \(e = H h/W(a)\) et, en N, \(W(a) = 2\,400\times9{,}81\times0{,}8\,a + 1\,000\), soit \(W(a) = 18\,835\,a + 1\,000\). La condition \(a\,W(a) \geq 6 H h = 43\,200\) donne \(18\,835\,a^2 + 1\,000\,a - 43\,200 \geq 0\), soit \(a \geq 1{,}49\ \text{m}\). Un massif plus long est aussi plus lourd, ce qui aide.</p>
    <p><strong>Q5.</strong> Basculement quand \(e = a/2\) : \(H_{\max} = \dfrac{W a}{2h} = \dfrac{23\,600\times1{,}2}{2\times4{,}0} \approx 3\,540\ \text{N}\), soit une pression de vent \(3\,540/3 \approx 1{,}18\ \text{kPa}\), à peu près le double de la pression de calcul. Bien avant, le contact partiel concentre la pression : \(p_{\max}\) croît vite quand \(e\) approche \(a/2\).</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Écrire les torseurs transmissibles des deux liaisons et vérifier que le modèle est isostatique.</div>

  <div class="q"><strong>Q3.</strong> Déterminer les actions des deux paliers sur l'arbre.</div>
  <div class="q"><strong>Q4.</strong> Quel roulement est le plus chargé ? Comment réduire sa charge ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sphérique de centre A : \(\{X_A\vec x + Y_A\vec y + Z_A\vec z \;;\; \vec 0\}_A\) ; sphère-cylindre de centre B, direction \(\vec x\) : \(\{Y_B\vec y + Z_B\vec z \;;\; \vec 0\}_B\). \(I_s = 5\), \(n = 2\), \(m = 1\) (rotation de l'arbre) : \(h = 1 + 5 - 6 = 0\). Six équations pour cinq inconnues de liaison et l'inconnue \(F_t\).</p>
    <p><strong>Q2.</strong> Autour de \((A, \vec x)\), les actions des paliers n'ont pas de moment. Pignon : \(\big(0{,}04\,\vec z\wedge(-F_t\,\vec y)\big)\cdot\vec x = 0{,}04\,F_t\). Poulie : \(0{,}06\,\vec y\wedge(-900\,\vec z) = -54\,\vec x\) et \(-0{,}06\,\vec y\wedge(-300\,\vec z) = 18\,\vec x\), soit \(-0{,}06\,(T_1 - T_2) = -36\ \text{N·m}\). Donc \(0{,}04\,F_t - 36 = 0\) : \(F_t = 900\ \text{N}\) et \(F_r = 900\tan20° \approx 328\ \text{N}\). Le pignon apporte le couple que la courroie emporte : 36 N·m.</p>
    <p><strong>Q3.</strong> Moments en A des forces connues et de l'action du palier B :</p>
    <div class="formula">$$\begin{aligned} \overrightarrow{AE}\wedge(-900\,\vec y - 327{,}6\,\vec z) &= 36\,\vec x + 26{,}2\,\vec y - 72\,\vec z \quad\text{(pignon)} \\ (-54 + 18)\,\vec x + (270 + 90)\,\vec y &\quad\text{(brins de courroie)} \\ 0{,}20\,\vec x\wedge(Y_B\vec y + Z_B\vec z) &= -0{,}20\,Z_B\,\vec y + 0{,}20\,Y_B\,\vec z \quad\text{(palier B)} \end{aligned}$$</div>
    <ul>
      <li>sur \(\vec y\) : \(26{,}2 + 360 - 0{,}20\,Z_B = 0\), d'où \(Z_B \approx 1\,931\ \text{N}\) ;</li>
      <li>sur \(\vec z\) : \(-72 + 0{,}20\,Y_B = 0\), d'où \(Y_B = 360\ \text{N}\) ;</li>
      <li>résultante : \(X_A = 0\) ; \(Y_A = 900 - 360 = 540\ \text{N}\) ; \(Z_A = 327{,}6 + 1\,200 - 1\,931 \approx -403\ \text{N}\).</li>
    </ul>
    <p><strong>Q4.</strong> \(\|\vec R_A\| = \sqrt{540^2 + 403^2} \approx 674\ \text{N}\) et \(\|\vec R_B\| = \sqrt{360^2 + 1\,931^2} \approx 1\,964\ \text{N}\) : le roulement B, voisin de la poulie en porte-à-faux, est le plus chargé, bien plus que la courroie elle-même (1 200 N) : effet de levier, A étant même tiré vers le bas. Pour le soulager : rapprocher la poulie de B, ou la placer entre les deux roulements ; écarter les roulements.</p>
  </div>

  <div class="q"><strong>Q1.</strong> Quel serait l'effort du câble sans aucune perte ?</div>
  <div class="q"><strong>Q2.</strong> Calculer l'effort supplémentaire dû à la résistance au roulement.</div>
  <div class="q"><strong>Q3.</strong> Isoler une roue et montrer que le frottement visqueux de son palier équivaut à un effort \(f_v\,\omega/R\) au contact du rail. En déduire l'effort total du câble et la puissance du treuil.</div>
  <div class="q"><strong>Q4.</strong> Le câble casse ; un frein d'urgence bloque les quatre roues (\(f = 0{,}15\) acier sur acier). Le wagonnet s'arrête-t-il ? Quelle pente maximale ce frein permet-il de tenir ?</div>
  <div class="q"><strong>Q5.</strong> Sans frein, la seule résistance au roulement pourrait-elle retenir le wagonnet ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Isolons le wagonnet avec ses roues. Projection sur le rail : \(F = m g\sin\alpha\), soit \(800\times9{,}81\times\sin10° \approx 1\,363\ \text{N}\).</p>
    <p><strong>Q2.</strong> L'effort normal total du rail vaut \(N = m g\cos\alpha \approx 7\,729\ \text{N}\). La résistance au roulement équivaut à \(\delta N/R = 0{,}000\,5\times7\,729/0{,}15 \approx 25{,}8\ \text{N}\), soit 2 % de l'effort précédent.</p>
    <p><strong>Q3.</strong> Une roue tourne à \(\omega = v/R \approx 3{,}33\ \text{rad/s}\) par rapport à son essieu, qui lui oppose le couple \(C_v = f_v\,\omega \approx 2{,}67\ \text{N·m}\) (action intérieure au wagonnet, mais extérieure à la roue). Moments au centre de la roue : l'essieu y exerce une force passant par le centre, plus \(C_v\) ; le rail exerce \(N_i\) décalé de \(\delta\) (moment \(\delta N_i\)) et l'effort tangentiel \(T_i\) au rayon R. À vitesse constante, \(T_i R = C_v + \delta N_i\) : le rail retient la roue de \(T_i = C_v/R + \delta N_i/R\). Le palier équivaut donc à \(C_v/R \approx 17{,}8\ \text{N}\) par roue, 71,1 N pour les quatre. Effort du câble : \(F \approx 1\,363 + 25{,}8 + 71{,}1 \approx 1\,460\ \text{N}\) ; puissance \(F v \approx 730\ \text{W}\).</p>
    <p><strong>Q4.</strong> Roues bloquées : elles glissent sur le rail, effort de frottement \(f N = 0{,}15\times7\,729 \approx 1\,159\ \text{N}\), inférieur à \(m g\sin\alpha \approx 1\,363\ \text{N}\) : le wagonnet continue de descendre, en glissant. Ce frein ne tient que si \(\tan\alpha \leq f\), soit \(\alpha \leq 8{,}5°\) : il faut un frein sur le rail (pince) ou un parachute sur le câble.</p>
    <p><strong>Q5.</strong> Roues libres, la résistance au roulement retient au plus \(\delta N/R\) : il faudrait \(\tan\alpha \leq \delta/R = 0{,}003\,3\), une pente de 0,19°. Elle ne retient rien en pratique : c'est justement l'intérêt du roulement.</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Justifier les deux zones de contact et montrer que les efforts normaux en A et B ont la même intensité \(N\). Exprimer \(N\).</div>
  <div class="q"><strong>Q2.</strong> Montée à vitesse constante : exprimer et calculer l'effort \(F\) du câble.</div>
  <div class="q"><strong>Q3.</strong> Descente à vitesse constante : même question.</div>
  <div class="q"><strong>Q4.</strong> À quelle condition le bras reste-t-il bloqué sur la colonne quand on relâche le câble ? Est-ce le cas ici ?</div>
  <div class="q"><strong>Q5.</strong> La mâchoire mobile d'un serre-joint glisse sur sa barre avec une longueur de guidage de 12 mm, l'effort de serrage s'exerçant à 80 mm de la barre ; \(f\) est compris entre 0,10 et 0,15. Le serrage tient-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La charge, décalée de \(d\), crée un moment qui fait tourner le bras dans le sens horaire : le haut du bras part vers la charge, le bas vers l'opposé ; le jeu étant rattrapé, la paroi du bras touche la colonne en haut du côté opposé à la charge (A) et en bas du côté de la charge (B). Ce sont deux contacts avec frottement : \(N_A\) et \(N_B\) horizontaux, de sens opposés, et deux efforts tangentiels verticaux. Résultante horizontale : \(N_A = N_B = N\). Moments au centre du guidage : les deux normales forment un couple \(N L\) qui équilibre \(Q d\) ; les frottements, de même sens et à la même distance de l'axe de part et d'autre, ont des moments opposés. Donc \(N = Q d/L = 400\times0{,}35/0{,}20 = 700\ \text{N}\), plus que la charge.</p>
    <p><strong>Q2.</strong> En montée, les frottements s'opposent au glissement du bras vers le haut : ils sont dirigés vers le bas, d'intensité \(f N\) chacun. Résultante verticale :</p>
    <div class="formula">$$F = Q + 2 f N = Q\left(1 + \frac{2 f d}{L}\right) = 400\times(1 + 0{,}7) = 680\ \text{N}$$</div>
    <p><strong>Q3.</strong> En descente, les frottements sont vers le haut : \(F = Q\,(1 - 2 f d/L)\), soit \(400\times0{,}3 = 120\ \text{N}\) ; il faut encore retenir le bras, mais bien moins que son poids.</p>
    <p><strong>Q4.</strong> Câble relâché (\(F = 0\)), le bras reste bloqué si l'adhérence suffit : \(Q \leq 2 f_0 N = 2 f_0 Q d/L\), soit \(L \leq 2 f_0 d = 0{,}14\ \text{m}\). Ici \(L = 0{,}20\ \text{m}\) : le bras descend seul. Avec un guidage de 14 cm ou moins, il serait arc-bouté : il ne descendrait jamais seul, quelle que soit la charge (c'est le principe de certaines potences et des colonnes de perceuse à blocage par basculement).</p>
    <p><strong>Q5.</strong> Même condition, \(L \leq 2 f d\), à vérifier pour le cas le plus défavorable, \(f = 0{,}10\) : \(2 f d = 16\ \text{mm} \geq 12\ \text{mm}\). La mâchoire est arc-boutée : plus on serre, plus elle se bloque. Le coefficient de frottement mal connu impose cette marge.</p>
  </div>
</div>

  <p class="exo-part">Partie A — Modélisation</p>
  <div class="q"><strong>A1.</strong> Donner les classes d'équivalence et les liaisons. Justifier l'étude dans le plan \((C, \vec x, \vec y)\).</div>
  <div class="q"><strong>A2.</strong> Le contact sabot-tambour étant supposé sans frottement, calculer le degré d'hyperstatisme du modèle plan.</div>
  <p class="exo-part">Partie B — Équilibre du levier</p>
  <div class="q"><strong>B1.</strong> Le tambour tend à tourner dans le sens horaire (vu depuis \(+\vec z\)). Au seuil du glissement, quel est le signe de \(T\) ? Exprimer \(N\) en fonction de \(F\), \(a\), \(e\), \(\ell\) et \(f\).</div>
  <div class="q"><strong>B2.</strong> Même question si le tambour tend à tourner dans le sens trigonométrique.</div>
  <div class="q"><strong>B3.</strong> Dans quel cas le frottement aide-t-il à serrer (frein « auto-serrant ») ? À quelle condition géométrique le levier serait-il arc-bouté ? Pourquoi faut-il l'éviter sur un frein ?</div>
  <p class="exo-part">Partie C — Maintien de la charge</p>
  <div class="q"><strong>C1.</strong> Dans quel sens la charge suspendue tend-elle à faire tourner le tambour ? Quel cas de la partie B s'applique ?</div>
  <div class="q"><strong>C2.</strong> Isoler l'arbre 1 et en déduire l'effort normal minimal \(N\) qui retient la charge immobile.</div>
  <div class="q"><strong>C3.</strong> En déduire l'effort minimal \(F\) du ressort. Que deviendrait-il si le câble partait du côté \(x \lt 0\) ?</div>
  <div class="q"><strong>C4.</strong> Déterminer l'action du bâti sur le levier en O.</div>
  <p class="exo-part">Partie D — Modèle local de la garniture</p>
  <div class="q"><strong>D1.</strong> La garniture, de largeur \(b = 50\ \text{mm}\), couvre l'arc \(\theta \in [-\beta, \beta]\) du tambour (\(\theta\) mesuré depuis \(\overrightarrow{CI}\)), avec \(\beta = 30°\). On suppose la pression \(p\) uniforme. Montrer que la résultante des efforts normaux vaut \(2\,p\,b\,R\sin\beta\) et passe par C.</div>
  <div class="q"><strong>D2.</strong> Calculer \(p\) pour l'effort normal de la question C2 et le comparer à la pression admissible d'une garniture, de l'ordre de 1 MPa.</div>
  <div class="q"><strong>D3.</strong> Calculer le couple de freinage avec ce modèle réparti (au glissement). Le modèle ponctuel est-il prudent ?</div>
  <p class="exo-part">Partie E — Efforts sur l'arbre</p>
  <div class="q"><strong>E1.</strong> Déterminer l'action du bâti sur l'arbre en C lorsque le frein retient la charge (modèle ponctuel, partie C). Comparer au poids de la charge.</div>
  <div class="q"><strong>E2.</strong> Pourquoi les freins de treuil utilisent-ils souvent deux sabots diamétralement opposés, serrés par le même ressort ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Trois classes : bâti 0, arbre 1 (avec ses deux tambours), levier 2 (avec son sabot) ; le ressort est une action extérieure donnée. Liaisons : pivot 1/0 d'axe \((C, \vec z)\), pivot 2/0 d'axe \((O, \vec z)\), contact ponctuel 1/2 en I, de normale \(\vec y\). Les axes sont perpendiculaires au plan, les efforts (charge, ressort, contact) y sont contenus et le mécanisme admet ce plan comme plan de symétrie : étude plane justifiée.</p>
    <p><strong>A2.</strong> En plan : deux pivots (2 inconnues chacune) et un contact ponctuel (1) : \(I_s = 5\) ; \(n = 3\) ; sans frottement, l'arbre peut tourner (\(m = 1\)) : \(h = 1 + 5 - 3\times2 = 0\). Isostatique. Avec frottement, l'effort tangentiel est une inconnue de plus, mais il est relié à \(N\) au seuil par la loi de Coulomb.</p>
    <p><strong>B1.</strong> Au sommet, la surface du tambour se déplace vers \(+\vec x\) ; le tambour glisserait vers \(+\vec x\) par rapport au sabot. Le frottement du sabot sur le tambour s'y oppose (\(-\vec x\)) ; par réciprocité, le tambour entraîne le sabot vers \(+\vec x\) : \(T = +f N\). Moments en O sur le levier (\(\overrightarrow{OI} = a\,\vec x - e\,\vec y\), \(\overrightarrow{OE} = \ell\,\vec x\)) :</p>
    <div class="formula">$$a\,N + e\,T - \ell\,F = 0 \qquad\Longrightarrow\qquad N = \frac{\ell\,F}{a + f e} = \frac{1{,}20}{0{,}282}\,F \approx 4{,}26\,F$$</div>
    <p><strong>B2.</strong> Le sens s'inverse : \(T = -f N\), et \(N = \dfrac{\ell\,F}{a - f e} = \dfrac{1{,}20}{0{,}218}\,F \approx 5{,}50\,F\).</p>
    <p><strong>B3.</strong> Dans le cas B2, le moment du frottement en O s'ajoute à celui du ressort : le frein est auto-serrant (pour le même ressort, \(N\) est 29 % plus grand). Si \(a \leq f e\), soit \(e \geq a/f = 0{,}625\ \text{m}\), le dénominateur s'annule : l'équilibre au seuil exigerait un effort \(F\) nul ou négatif, le levier est arc-bouté et le frein se bloquerait dès le premier contact, sans que le ressort le commande. Un frein doit rester progressif (et se desserrer) : on garde \(a - f e\) nettement positif, avec ici \(e = 0{,}08\ \text{m}\).</p>
    <p><strong>C1.</strong> Le câble, du côté \(x \gt 0\), exerce \(-m g\,\vec y\) au point \((r_t, 0)\) : moment en C \(r_t\times(-m g) = -245\ \text{N·m}\), sens horaire. C'est le cas B1, non auto-serrant.</p>
    <p><strong>C2.</strong> Arbre 1 : actions du câble, du sabot (\(-T\,\vec x - N\,\vec y\) en I) et du bâti (en C). Moments en C : \(-m g\,r_t + f N R = 0\) au seuil, car \(\overrightarrow{CI}\wedge(-T\vec x) = R\,T\,\vec z\). Il faut</p>
    <div class="formula">$$N \geq \frac{m g\,r_t}{f R} = \frac{250\times9{,}81\times0{,}10}{0{,}4\times0{,}20} \approx 3\,066\ \text{N}$$</div>
    <p><strong>C3.</strong> \(F \geq N\,\dfrac{a + f e}{\ell} \approx 3\,066\times\dfrac{0{,}282}{1{,}20} \approx 720\ \text{N}\). Câble du côté \(x \lt 0\) : cas B2, \(F \geq 3\,066\times0{,}218/1{,}20 \approx 557\ \text{N}\), 23 % de moins grâce à l'auto-serrage ; on choisit en général ce montage pour le sens de rotation qui retient la charge.</p>
    <p><strong>C4.</strong> Levier : \(X_O + T = 0\) et \(Y_O + N - F = 0\), d'où \(X_O = -f N \approx -1\,226\ \text{N}\) et \(Y_O = F - N \approx 720 - 3\,066 \approx -2\,345\ \text{N}\) : l'articulation retient le levier, que le tambour repousse vers le haut.</p>
    <p><strong>D1.</strong> L'élément de garniture \(\mathrm dS = b\,R\,\mathrm d\theta\) reçoit un effort normal radial \(p\,\mathrm dS\). Les composantes selon \(\vec x\) se compensent (\(\theta\) et \(-\theta\)), celles selon \(\vec y\) s'ajoutent :</p>
    <div class="formula">$$N = \int_{-\beta}^{\beta} p\,b\,R\cos\theta\,\mathrm d\theta = 2\,p\,b\,R\sin\beta$$</div>
    <p>C'est \(p\) fois l'aire projetée de la garniture. Tous les efforts élémentaires sont radiaux, donc passent par C : leur résultante aussi (elle est portée par CI, comme dans le modèle ponctuel).</p>
    <p><strong>D2.</strong></p>
    <div class="formula">$$p = \frac{N}{2 b R\sin\beta} = \frac{3\,066}{2\times0{,}05\times0{,}20\times0{,}5} \approx 0{,}31\ \text{MPa}$$</div>
    <p>C'est environ trois fois moins que l'admissible : la garniture est bien dimensionnée.</p>
    <p><strong>D3.</strong> Chaque élément crée le moment de frottement \(R\,f\,p\,\mathrm dS\) autour de C :</p>
    <div class="formula">$$C_f = \int_{-\beta}^{\beta} f\,p\,b\,R^2\,\mathrm d\theta = 2\,f\,p\,b\,R^2\beta = f\,N\,R\,\frac{\beta}{\sin\beta}$$</div>
    <p>Avec \(\beta/\sin\beta = 1{,}047\), le couple est 4,7 % plus grand que \(f N R\) : à charge égale, il suffirait de \(N \approx 2\,927\ \text{N}\). Le modèle ponctuel sous-estime le couple de freinage : il est prudent.</p>
    <p><strong>E1.</strong> Arbre 1 : \(X_C - T = 0\) et \(Y_C - m g - N = 0\), d'où \(X_C = f N \approx 1\,226\ \text{N}\) et \(Y_C \approx 2\,453 + 3\,066 = 5\,519\ \text{N}\), soit \(\|\vec R_C\| \approx 5\,650\ \text{N}\) : plus du double du poids de la charge (2 453 N). Le frein charge fortement les paliers de l'arbre.</p>
    <p><strong>E2.</strong> Avec deux sabots opposés (en haut et en bas), serrés par le même ressort, les deux efforts normaux sont égaux et opposés, comme les deux efforts tangentiels, alors que leurs moments en C s'ajoutent : le couple de freinage est doublé (chaque sabot n'a besoin que de la moitié de \(N\)) et l'arbre ne porte plus que la charge, \(m g\). Les paliers sont soulagés et le frein est symétrique.</p>
