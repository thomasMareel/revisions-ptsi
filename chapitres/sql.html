  <h3>Débusquer les requêtes fausses, puis exprimer « toutes »</h3>
  <div class="statement">Base du cours (vélos en libre-service). Chacune des requêtes des questions Q1 à Q4 est censée répondre à la question posée, mais elle est fausse ou refusée. Expliquer le problème et corriger.</div>
  <div class="q"><strong>Q1.</strong> « Nombre de départs de chaque station, avec son nom » : <span class="code-inline">SELECT s.nom, COUNT(*) FROM Station AS s, Trajet AS t GROUP BY s.id_station, s.nom;</span></div>
  <div class="q"><strong>Q2.</strong> « Abonnés qui ont fait au moins deux trajets le même jour » : <span class="code-inline">SELECT abonne FROM Trajet GROUP BY abonne HAVING COUNT(*) &gt;= 2;</span></div>
  <div class="q"><strong>Q3.</strong> « Vélo le plus utilisé » : <span class="code-inline">SELECT velo, MAX(COUNT(*)) FROM Trajet GROUP BY velo;</span></div>
  <div class="q"><strong>Q4.</strong> « Nom des abonnés et durée de leurs trajets partis du Port » : <span class="code-inline">SELECT nom, duree FROM Trajet JOIN Abonne ON abonne = id_abonne JOIN Station ON depart = id_station WHERE nom = 'Port';</span></div>
  <div class="q"><strong>Q5.</strong> Écrire une requête donnant les abonnés qui sont arrivés au moins une fois à <em>chacune</em> de leurs stations favorites. Indication : former d'abord les couples (abonné, station favorite) jamais atteints.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>

    <p><strong>Q1.</strong> Aucune condition ne relie les deux tables : c'est le produit cartésien, et chaque station se voit attribuer les 16 trajets. Il faut la condition de jointure :</p>
<pre class="codeblock"><span class="kw">SELECT</span> s.nom, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> departs
<span class="kw">FROM</span> Station <span class="kw">AS</span> s <span class="kw">JOIN</span> Trajet <span class="kw">AS</span> t <span class="kw">ON</span> s.id_station = t.depart
<span class="kw">GROUP</span> <span class="kw">BY</span> s.id_station, s.nom;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>nom</th><th>departs</th></tr>
  <tr><td>Gare</td><td>5</td></tr>
  <tr><td>Mairie</td><td>2</td></tr>

  <tr><td>Piscine</td><td>1</td></tr>
  <tr><td>Marché</td><td>2</td></tr>
</table></div><figcaption>Résultat : 6 lignes.</figcaption></figure>

    <p><strong>Q2.</strong> Cette requête compte les trajets de chaque abonné sur toute la période : elle renvoie les six abonnés qui ont roulé. Pour compter par abonné <em>et par jour</em>, il faut regrouper par le couple (abonne, jour) ; <span class="code-inline">DISTINCT</span> évite de répéter un abonné qui remplirait la condition plusieurs jours.</p>
<pre class="codeblock"><span class="kw">SELECT</span> <span class="kw">DISTINCT</span> abonne
<span class="kw">FROM</span> Trajet
<span class="kw">GROUP</span> <span class="kw">BY</span> abonne, jour
<span class="kw">HAVING</span> <span class="kw">COUNT</span>(*) &gt;= 2;</pre>

<pre class="codeblock"><span class="kw">SELECT</span> velo, <span class="kw">MAX</span>(<span class="kw">COUNT</span>(*)) <span class="kw">FROM</span> Trajet <span class="kw">GROUP</span> <span class="kw">BY</span> velo;</pre>
    <p><strong>Q3.</strong> Un agrégat d'agrégat est refusé. On calcule les comptages dans une table dérivée, on en prend le maximum, et l'on garde les vélos qui l'atteignent (il pourrait y en avoir plusieurs) :</p>
<pre class="codeblock"><span class="kw">SELECT</span> velo, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb
<span class="kw">FROM</span> Trajet
<span class="kw">GROUP</span> <span class="kw">BY</span> velo
<span class="kw">HAVING</span> <span class="kw">COUNT</span>(*) = (<span class="kw">SELECT</span> <span class="kw">MAX</span>(n)
                   <span class="kw">FROM</span> (<span class="kw">SELECT</span> <span class="kw">COUNT</span>(*) <span class="kw">AS</span> n
                         <span class="kw">FROM</span> Trajet
                         <span class="kw">GROUP</span> <span class="kw">BY</span> velo) <span class="kw">AS</span> c);</pre>

    <p><strong>Q4.</strong> La colonne nom existe dans Abonne et dans Station : le logiciel refuse la requête (nom ambigu). Les deux « nom » n'ont d'ailleurs pas le même sens dans le <span class="code-inline">SELECT</span> (abonné) et dans le <span class="code-inline">WHERE</span> (station). Avec des alias :</p>
<pre class="codeblock"><span class="kw">SELECT</span> a.nom, t.duree
<span class="kw">FROM</span> Trajet <span class="kw">AS</span> t
<span class="kw">JOIN</span> Abonne <span class="kw">AS</span> a <span class="kw">ON</span> t.abonne = a.id_abonne
<span class="kw">JOIN</span> Station <span class="kw">AS</span> s <span class="kw">ON</span> t.depart = s.id_station
<span class="kw">WHERE</span> s.nom = <span class="str">'Port'</span>;</pre>

    <p><strong>Q5.</strong> Les couples (abonné, station favorite) jamais atteints s'obtiennent par une différence entre Favori et les couples (abonne, arrivee) de Trajet. Un abonné convient s'il a des favorites et si aucune ne figure parmi ces couples : seconde différence.</p>
<pre class="codeblock"><span class="kw">SELECT</span> id_abonne <span class="kw">FROM</span> Favori
<span class="kw">EXCEPT</span>
<span class="kw">SELECT</span> id_abonne
<span class="kw">FROM</span> (<span class="kw">SELECT</span> id_abonne, id_station <span class="kw">FROM</span> Favori
      <span class="kw">EXCEPT</span>
      <span class="kw">SELECT</span> abonne, arrivee <span class="kw">FROM</span> Trajet) <span class="kw">AS</span> manque;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>id_abonne</th></tr>
  <tr><td>1</td></tr>
  <tr><td>2</td></tr>
  <tr><td>4</td></tr>
  <tr><td>5</td></tr>
  <tr><td>6</td></tr>
</table></div><figcaption>Résultat : 5 lignes.</figcaption></figure>
    <p>Léa n'est jamais arrivée au Marché (station 6), Chloé n'a jamais roulé : elles sont écartées. On peut aussi compter, pour chaque abonné, ses favorites atteintes et les comparer au nombre de ses favorites :</p>
<pre class="codeblock"><span class="kw">SELECT</span> f.id_abonne
<span class="kw">FROM</span> Favori <span class="kw">AS</span> f
<span class="kw">JOIN</span> (<span class="kw">SELECT</span> <span class="kw">DISTINCT</span> abonne, arrivee <span class="kw">FROM</span> Trajet) <span class="kw">AS</span> d
  <span class="kw">ON</span> f.id_abonne = d.abonne <span class="kw">AND</span> f.id_station = d.arrivee
<span class="kw">JOIN</span> (<span class="kw">SELECT</span> id_abonne, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb_fav
      <span class="kw">FROM</span> Favori
      <span class="kw">GROUP</span> <span class="kw">BY</span> id_abonne) <span class="kw">AS</span> n <span class="kw">ON</span> f.id_abonne = n.id_abonne
<span class="kw">GROUP</span> <span class="kw">BY</span> f.id_abonne, n.nb_fav
<span class="kw">HAVING</span> <span class="kw">COUNT</span>(*) = n.nb_fav;</pre>
    <p>Le <span class="code-inline">DISTINCT</span> de la table dérivée d est indispensable : sans lui, Inès, arrivée deux fois à la Gare et deux fois à la Faculté, compterait quatre favorites atteintes pour deux favorites.</p>

  <div class="exo-part"><strong>Partie I — Modélisation</strong></div>

  <div class="exo-part"><strong>Partie II — Interrogations simples</strong></div>
  <div class="q"><strong>Q4.</strong> Écrire une requête donnant l'identifiant, le modèle et la puissance des éoliennes d'au moins 3 000 kW mises en service à partir de 2015, par puissance décroissante, puis par identifiant.</div>

  <div class="exo-part"><strong>Partie III — Jointures et agrégats</strong></div>
  <div class="q"><strong>Q7.</strong> Combien de lignes compte le produit cartésien de Eolienne et Production sur le jeu d'essai ? Et leur jointure selon la clé étrangère ? L'exploitant possède en réalité 200 éoliennes, suivies chaque jour depuis dix ans : reprendre ces deux décomptes.</div>
  <div class="q"><strong>Q8.</strong> Écrire une requête donnant, pour chaque parc (son nom), l'énergie totale produite sur la période, par énergie décroissante.</div>
  <div class="q"><strong>Q9.</strong> Le facteur de charge d'une éolienne est le rapport de l'énergie produite à l'énergie qu'elle aurait produite en fonctionnant en permanence à sa puissance nominale : \(\dfrac{E}{24 \, P \, n}\), avec \(E\) en kWh, \(P\) en kW et \(n\) le nombre de jours mesurés. Écrire une requête donnant le facteur de charge de chaque éolienne. Pourquoi faut-il mentionner la puissance dans le <span class="code-inline">GROUP BY</span> ?</div>
  <div class="q"><strong>Q10.</strong> Écrire une requête donnant les parcs (nom) où la vitesse moyenne du vent sur la période dépasse 9 m/s, avec cette vitesse.</div>
  <div class="q"><strong>Q11.</strong> Écrire une requête donnant, pour chaque intervention, son identifiant, l'éolienne, le jour et l'énergie produite par cette éolienne ce jour-là.</div>
  <div class="q"><strong>Q12.</strong> Écrire une requête donnant le nom des techniciens qui ont passé au moins 8 heures en intervention, avec leur total d'heures.</div>
  <div class="exo-part"><strong>Partie IV — Requêtes imbriquées</strong></div>
  <div class="q"><strong>Q13.</strong> Écrire une requête donnant l'éolienne, le jour et l'énergie de la ou des productions journalières record.</div>
  <div class="q"><strong>Q14.</strong> Écrire une requête donnant l'identifiant et le parc des éoliennes qui n'ont reçu aucune intervention.</div>
  <div class="q"><strong>Q15.</strong> Écrire une requête donnant les jours où la production totale du parc « Les Crêtes » a dépassé la moyenne des productions totales journalières de ce parc.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Une éolienne n'a qu'une production par jour : deux lignes distinctes de Production diffèrent par l'éolienne ou par le jour, donc le couple identifie chaque ligne. Le jour seul ne suffit pas : chaque jour, toutes les éoliennes produisent (le 2026-01-10 apparaît sur sept lignes). L'éolienne seule non plus : elle a une ligne par jour.</p>
    <p><strong>Q2.</strong> parc traduit l'association \(1 - \ast\) de Parc vers Eolienne (un parc contient plusieurs éoliennes, une éolienne est dans un seul parc) ; eolienne dans Production, l'association \(1 - \ast\) d'Eolienne vers Production ; eolienne et technicien dans Intervention, deux associations \(1 - \ast\), d'Eolienne et de Technicien vers Intervention. Ensemble, elles réalisent l'association \(\ast - \ast\) « est entretenue par » entre Eolienne et Technicien : un technicien intervient sur plusieurs éoliennes, une éolienne reçoit plusieurs techniciens. Le couple (eolienne, technicien) n'est pas une clé : un même technicien peut intervenir plusieurs fois sur la même éolienne (dans le jeu d'essai, le technicien 1 est intervenu sur l'éolienne 3 le 10 et le 13 janvier) ; d'où l'identifiant id_inter.</p>
    <p><strong>Q3.</strong> L'association est \(1 - 1\). On peut créer Contrat(<u>id_contrat</u> : entier, societe : chaîne, fin : chaîne, eolienne : entier), où eolienne référence Eolienne avec des valeurs deux à deux distinctes ; ou, plus simplement, ajouter à Eolienne trois attributs (numéro de contrat, société, date de fin).</p>

    <p><strong>Q7.</strong> Le produit compte \(7 \times 28 = 196\) lignes, la jointure 28 (une par ligne de Production, complétée par son éolienne). Avec 200 éoliennes suivies pendant dix ans, Production compte environ \(200 \times 3\,650 = 730\,000\) lignes, la jointure autant, et le produit cartésien \(200 \times 730\,000 \approx 1{,}5 \times 10^{8}\) lignes : on ne forme jamais un produit sans condition qui le restreigne.</p>

<span class="kw">JOIN</span> Parc <span class="kw">AS</span> c <span class="kw">ON</span> e.parc = c.id_parc
<span class="kw">WHERE</span> c.nom = <span class="str">'Les Crêtes'</span>
<span class="kw">GROUP</span> <span class="kw">BY</span> p.jour
<span class="kw">HAVING</span> <span class="kw">SUM</span>(p.energie) &gt; (<span class="kw">SELECT</span> <span class="kw">AVG</span>(tj)
                         <span class="kw">FROM</span> (<span class="kw">SELECT</span> <span class="kw">SUM</span>(p2.energie) <span class="kw">AS</span> tj
                               <span class="kw">FROM</span> Production <span class="kw">AS</span> p2
                               <span class="kw">JOIN</span> Eolienne <span class="kw">AS</span> e2 <span class="kw">ON</span> p2.eolienne = e2.id_eol
                               <span class="kw">JOIN</span> Parc <span class="kw">AS</span> c2 <span class="kw">ON</span> e2.parc = c2.id_parc
                               <span class="kw">WHERE</span> c2.nom = <span class="str">'Les Crêtes'</span>
                               <span class="kw">GROUP</span> <span class="kw">BY</span> p2.jour) <span class="kw">AS</span> q);</pre>
