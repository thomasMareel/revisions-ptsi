  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Les bases de données forment la partie 3.1 du programme d'informatique commune, étudiée au troisième semestre (début de la 2ᵉ année). Le programme s'en tient volontairement à un usage applicatif : interroger en SQL une base dont les données sont réparties dans plusieurs tables. Ce chapitre ne contient aucun programme Python : les requêtes s'écrivent et s'exécutent dans un logiciel d'interrogation de bases de données.</div>

<div class="course-section">
  <div class="sec-num">§1 · TABLES, ATTRIBUTS ET DOMAINES</div>
  <h2>Ranger des données dans des tables</h2>
  <div class="intro">Une base de données relationnelle range l'information dans des tableaux à deux dimensions, les tables. Tout le chapitre s'appuie sur une petite base inventée : celle d'un service de vélos en libre-service, avec ses stations, ses vélos, ses abonnés et leurs trajets.</div>

  <p>Pour facturer, entretenir ses vélos et dimensionner ses stations, l'opérateur d'un tel service doit répondre à des questions comme « quels abonnés roulent le plus ? » ou « de quelle station partent le plus de vélos ? ». Tout ranger dans un seul grand tableau serait maladroit : le nom de chaque station serait recopié à chaque trajet, et une faute de frappe suffirait à rendre les données incohérentes. On répartit donc l'information entre plusieurs tables reliées entre elles, et on l'interroge avec un langage de requêtes, <strong>SQL</strong> (<em>Structured Query Language</em>).</p>

  <div class="def-box">
    <ul>
      <li>Une <strong>table</strong>, ou <strong>relation</strong>, est un ensemble d'<strong>enregistrements</strong>, ou <strong>lignes</strong>, qui ont tous la même structure.</li>
      <li>Chaque colonne est un <strong>attribut</strong>, désigné par un nom ; ses valeurs sont prises dans un <strong>domaine</strong> fixé, le <strong>type</strong> de la donnée : entier, flottant ou chaîne de caractères.</li>
      <li>Le <strong>schéma</strong> d'une table est la donnée de son nom et de ses attributs avec leurs domaines. On l'écrit par exemple Station(id_station : entier, nom : chaîne, quartier : chaîne, capacite : entier). Le schéma de la base est l'ensemble des schémas de ses tables.</li>
    </ul>
  </div>

  <h3>La base du chapitre</h3>
  <p>La base comporte cinq tables, dont voici les schémas ; les attributs soulignés forment la clé primaire de chaque table (§2).</p>
  <ul>
    <li>Station(<u>id_station</u> : entier, nom : chaîne, quartier : chaîne, capacite : entier), où capacite est le nombre de points d'attache de la station.</li>
    <li>Abonne(<u>id_abonne</u> : entier, nom : chaîne, prenom : chaîne, formule : chaîne, annee : entier), où formule vaut 'annuel', 'mensuel' ou 'jeune' et annee est l'année d'inscription.</li>
    <li>Velo(<u>id_velo</u> : entier, type : chaîne, annee : entier), où type vaut 'VAE' (vélo à assistance électrique) ou 'classique' et annee est l'année de mise en service.</li>
    <li>Trajet(<u>id_trajet</u> : entier, abonne : entier, velo : entier, depart : entier, arrivee : entier, jour : chaîne, duree : entier, distance : flottant), où abonne et velo sont les numéros de l'abonné et du vélo, depart et arrivee les numéros des stations de départ et d'arrivée, duree est en minutes et distance en kilomètres.</li>
    <li>Favori(<u>id_abonne, id_station</u> : entiers) : les stations qu'un abonné a enregistrées comme favorites dans l'application.</li>
  </ul>

  <div class="method-box"><strong>Exemple — lire une ligne de la table Trajet</strong>
    <ol>
      <li>La ligne (9, 6, 15, 3, 3, '2026-03-04', 35, 6.5) se lit attribut par attribut : le trajet numéro 9 a été effectué par l'abonné 6 avec le vélo 15, le 4 mars 2026, de la station 3 à la station 3, en 35 minutes, sur 6,5 km.</li>
      <li>Pour savoir qui est l'abonné 6, on cherche dans Abonne la ligne dont id_abonne vaut 6 : Théo Roux. Le vélo 15 est un VAE (table Velo), la station 3 est le Port (table Station). Le trajet 9 est donc une balade de Théo en vélo électrique, partie du Port et revenue au Port.</li>
      <li>Chaque information n'est écrite qu'une fois : le nom « Port » ne figure que dans Station, les trajets n'en gardent que le numéro. Renommer la station ne demanderait de modifier qu'une case.</li>
    </ol>
  </div>

  <div class="notice"><strong>À retenir</strong> : une table est un <em>ensemble</em> de lignes. Leur ordre n'a aucune signification, et deux lignes ne sont jamais identiques (la clé primaire les distingue). Une case contient une seule valeur, jamais une liste. Les dates sont ici des chaînes 'AAAA-MM-JJ' : l'ordre alphabétique de ces chaînes coïncide avec l'ordre chronologique ('2026-03-04' &lt; '2026-03-05'), et c'est tout ce dont on a besoin. La valeur <span class="code-inline">NULL</span> (case vide) est hors programme : toutes les cases sont remplies.</div>

  <p>Dans la suite, chaque requête est suivie de son résultat, tel que l'affiche un logiciel d'interrogation (les flottants sont arrondis au centième). Ce résultat est lui-même un tableau de lignes, sans nom, dont les colonnes sont celles que demande la requête.</p>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CLÉ PRIMAIRE</div>
  <h2>Identifier chaque ligne sans ambiguïté</h2>
  <div class="intro">Pour relier les tables entre elles, il faut pouvoir désigner une ligne précise : « le trajet 9 », « l'abonné 6 ». C'est le rôle de la clé primaire.</div>

  <div class="def-box">
    Une <strong>clé primaire</strong> d'une table est un attribut, ou un ensemble d'attributs, dont les valeurs suffisent à identifier chaque ligne : deux lignes distinctes ne peuvent jamais avoir les mêmes valeurs pour ces attributs. Chaque table a une clé primaire, choisie en concevant le schéma, sans attribut superflu ; on la souligne dans le schéma.
  </div>

  <p>Les tables Station, Abonne, Velo et Trajet ont une clé primaire formée d'un seul attribut, un numéro attribué par l'opérateur : c'est le cas le plus fréquent. La clé primaire de Favori est formée de <strong>deux</strong> attributs : un abonné a plusieurs stations favorites, une station est favorite de plusieurs abonnés, mais le couple (id_abonne, id_station) n'apparaît qu'une fois.</p>

  <div class="prop-box"><strong>Une contrainte sur tous les contenus possibles.</strong> Être une clé est une propriété du schéma, imposée à tout contenu futur de la table, et non une constatation sur son contenu actuel. Le logiciel refuse d'ajouter une ligne qui reprendrait la valeur de clé d'une ligne existante.</div>

  <div class="method-box"><strong>Exemple — chercher ce qui peut servir de clé</strong>
    <ol>
      <li>nom pour Abonne ? Les sept noms actuels sont distincts, mais rien n'empêche deux homonymes de s'inscrire : nom n'est pas une clé. C'est pour cela qu'on numérote les abonnés.</li>
      <li>(abonne, jour) pour Trajet ? Non : Inès (abonnée 1) a fait deux trajets le 2026-03-02, les trajets 1 et 3, qui ont les mêmes valeurs pour ces deux attributs.</li>
      <li>(velo, jour) ? Non plus : le vélo 11 a servi aux trajets 1 et 3, le même jour. Comme la base ne garde pas l'heure, aucun groupe d'attributs naturel n'identifie un trajet : d'où le numéro id_trajet.</li>
      <li>(id_abonne, id_station) pour Favori : une station est favorite d'un abonné ou ne l'est pas, chaque couple n'a donc de sens qu'une fois. Aucun des deux attributs seul ne suffit : l'abonnée 1 a deux favorites, la station 6 est favorite de trois abonnés.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : confondre clé primaire et premier attribut. La clé peut être placée n'importe où dans le schéma et compter plusieurs attributs ; à l'inverse, on n'y met pas d'attribut inutile : id_trajet suffit pour Trajet, (id_trajet, jour) identifierait aussi les lignes mais serait une clé maladroite.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ENTITÉS, ASSOCIATIONS, CLÉS ÉTRANGÈRES</div>
  <h2>Relier les tables entre elles</h2>
  <div class="intro">Le modèle entité-association décrit les objets dont parle la base (les entités) et les liens entre ces objets (les associations). Les clés étrangères traduisent ces liens dans les tables.</div>

  <div class="def-box">
    <ul>
      <li>Une <strong>entité</strong> est un objet du monde réel décrit par la base : une station, un vélo, un abonné, un trajet. Une table décrit un type d'entités, à raison d'une ligne par entité.</li>
      <li>Une <strong>association</strong> relie des entités : « un trajet est effectué par un abonné ». Entre deux types d'entités A et B, sa <strong>cardinalité</strong> est notée \(1 - 1\), \(1 - \ast\) ou \(\ast - \ast\). Dans une association \(1 - \ast\) de A vers B, chaque entité de B est liée à une seule entité de A, et chaque entité de A à un nombre quelconque d'entités de B, éventuellement nul.</li>
      <li>Une <strong>clé étrangère</strong> est un attribut (ou un groupe d'attributs) d'une table dont chaque valeur est la valeur de la clé primaire d'une ligne d'une autre table, ou de la même table : elle <em>référence</em> cette ligne.</li>
    </ul>
  </div>

  <h3>Traduire les associations dans les tables</h3>
  <div class="prop-box"><strong>Association \(1 - \ast\).</strong> On place une clé étrangère du côté « \(\ast\) ». Chaque trajet est effectué par un seul abonné, donc Trajet contient l'attribut abonne, qui référence Abonne (ses valeurs sont des valeurs de id_abonne) ; un abonné peut figurer dans zéro, une ou plusieurs lignes de Trajet. Trajet porte ainsi quatre clés étrangères : abonne (vers Abonne), velo (vers Velo), depart et arrivee (toutes deux vers Station).</div>
  <div class="prop-box"><strong>Association \(1 - 1\).</strong> Chaque entité d'un côté correspond à exactement une entité de l'autre. On peut fusionner les deux tables, ou placer une clé étrangère d'un côté en imposant que ses valeurs soient deux à deux distinctes. Par exemple, si chaque station était équipée d'un unique terminal de paiement, une table Terminal(<u>id_terminal</u>, modele, id_station) contiendrait la clé étrangère id_station, avec des valeurs toutes différentes : deux terminaux ne peuvent pas désigner la même station.</div>
  <div class="prop-box"><strong>Association \(\ast - \ast\).</strong> « Un abonné a plusieurs stations favorites, une station est favorite de plusieurs abonnés. » Aucune clé étrangère placée dans Abonne ou dans Station ne convient : il faudrait une liste dans une case. On crée une <strong>table d'association</strong>, Favori, dont chaque ligne est un couple (abonné, station) ; sa clé primaire est ce couple, et chacun de ses deux attributs est une clé étrangère. L'association \(\ast - \ast\) est ainsi séparée en deux associations \(1 - \ast\) : de Abonne vers Favori et de Station vers Favori.</div>

  <div class="method-box"><strong>Exemple — l'association \(\ast - \ast\) cachée dans Trajet</strong>
    <ol>
      <li>Un abonné emprunte plusieurs vélos et un vélo est emprunté par plusieurs abonnés : entre Abonne et Velo, l'association « a emprunté » est \(\ast - \ast\).</li>
      <li>La table Trajet la sépare en deux associations \(1 - \ast\), car chaque trajet a un seul abonné et un seul vélo. Ainsi le vélo 14 a servi à Léa (trajets 5 et 12), à Ana (trajets 7 et 11) et à Moussa (trajet 14) ; Moussa, lui, a roulé sur les vélos 12 et 14.</li>
      <li>Contrairement à Favori, Trajet porte des informations propres à chaque emprunt (jour, durée, distance), et un même couple (abonné, vélo) peut revenir plusieurs fois : Inès a pris quatre fois le vélo 11. Le couple (abonne, velo) n'est donc pas une clé, et l'on a introduit id_trajet.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : placer la clé étrangère du mauvais côté. Un attribut id_trajet dans Abonne obligerait à écrire plusieurs trajets dans une même case. La clé étrangère est toujours du côté « \(\ast\) » et référence le côté « 1 ». Autre erreur : oublier que la valeur d'une clé étrangère doit exister dans la table référencée (un trajet de l'abonné 8 serait refusé, aucun abonné ne porte ce numéro).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SÉLECTION, PROJECTION, RENOMMAGE</div>
  <h2>Choisir des lignes et des colonnes</h2>
  <div class="intro">Une requête <span class="code-inline">SELECT</span> ne modifie jamais la base : elle construit un nouveau tableau à partir des tables existantes. Sa forme la plus simple choisit des lignes (sélection) et des colonnes (projection).</div>

  <div class="prop-box"><strong>Forme de base.</strong>
<pre class="codeblock"><span class="kw">SELECT</span> expression1 <span class="kw">AS</span> nom1, expression2, …
<span class="kw">FROM</span> T
<span class="kw">WHERE</span> condition;</pre>
    Le logiciel parcourt les lignes de la table T, garde celles qui vérifient la condition (<strong>sélection</strong>), puis calcule pour chacune les expressions demandées (<strong>projection</strong>). <span class="code-inline">SELECT *</span> garde toutes les colonnes ; sans <span class="code-inline">WHERE</span>, toutes les lignes sont gardées. <span class="code-inline">AS</span> donne un nom à une colonne du résultat (<strong>renommage</strong>).
  </div>

  <p>Les conditions et les expressions utilisent les opérateurs arithmétiques <span class="code-inline">+ - * /</span>, les comparaisons <span class="code-inline">=</span> (égal), <span class="code-inline">&lt;&gt;</span> (différent), <span class="code-inline">&lt; &lt;= &gt; &gt;=</span>, et les connecteurs logiques <span class="code-inline">AND</span>, <span class="code-inline">OR</span>, <span class="code-inline">NOT</span>. Les chaînes s'écrivent entre apostrophes droites ; les nombres se comparent dans l'ordre numérique, les chaînes dans l'ordre lexicographique usuel. Premier exemple, les stations d'au moins 20 places :</p>
<pre class="codeblock"><span class="kw">SELECT</span> nom, capacite
<span class="kw">FROM</span> Station
<span class="kw">WHERE</span> capacite &gt;= 20;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>nom</th><th>capacite</th></tr>
  <tr><td>Gare</td><td>30</td></tr>
  <tr><td>Mairie</td><td>20</td></tr>
  <tr><td>Faculté</td><td>24</td></tr>
</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>

  <p>Les trajets des 4 et 5 mars de plus de 10 minutes : la comparaison de chaînes 'AAAA-MM-JJ' suit le calendrier, et l'inégalité stricte exclut le trajet 8, qui dure exactement 10 minutes.</p>
<pre class="codeblock"><span class="kw">SELECT</span> id_trajet, jour, duree
<span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> jour &gt;= <span class="str">'2026-03-04'</span> <span class="kw">AND</span> jour &lt;= <span class="str">'2026-03-05'</span> <span class="kw">AND</span> duree &gt; 10;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>id_trajet</th><th>jour</th><th>duree</th></tr>
  <tr><td>7</td><td>2026-03-04</td><td>12</td></tr>
  <tr><td>9</td><td>2026-03-04</td><td>35</td></tr>
  <tr><td>10</td><td>2026-03-05</td><td>12</td></tr>
  <tr><td>11</td><td>2026-03-05</td><td>14</td></tr>
  <tr><td>13</td><td>2026-03-05</td><td>17</td></tr>
</table></div><figcaption>Résultat : 5 lignes.</figcaption></figure>

  <p>Une colonne du résultat peut être calculée. La vitesse moyenne d'un trajet, en km/h, vaut 60 fois la distance divisée par la durée en minutes ; <span class="code-inline">AS</span> nomme la colonne calculée :</p>
<pre class="codeblock"><span class="kw">SELECT</span> id_trajet, 60 * distance / duree <span class="kw">AS</span> vitesse
<span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> abonne = 1;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>id_trajet</th><th>vitesse</th></tr>
  <tr><td>1</td><td>16.62</td></tr>
  <tr><td>3</td><td>15.43</td></tr>
  <tr><td>10</td><td>18.0</td></tr>
  <tr><td>16</td><td>14.4</td></tr>
</table></div><figcaption>Résultat : 4 lignes.</figcaption></figure>

  <p>Enfin, <span class="code-inline">NOT</span> nie une condition. Les trajets en boucle, qui reviennent à leur station de départ, s'obtiennent par <span class="code-inline">WHERE depart = arrivee</span> (le seul est le trajet 9) ; les autres, par <span class="code-inline">WHERE NOT depart = arrivee</span> ou, plus simplement, <span class="code-inline">WHERE depart &lt;&gt; arrivee</span>.</p>



  <div class="method-box"><strong>Exemple — traduire une question en requête</strong>
    <p>Question : « quels trajets ont été faits avec le vélo 13 ou le vélo 14 et ont duré au moins 12 minutes ? Donner leur vitesse. »</p>
    <ol>
      <li>Table : toutes les informations sont dans Trajet.</li>
      <li>Condition : le vélo est 13 ou 14, <em>et</em> la durée est au moins 12. Le « ou » ne porte que sur le vélo : il faut des parenthèses.</li>
      <li>Colonnes : id_trajet, velo (utile pour contrôler) et la vitesse calculée, renommée.</li>
    </ol>
<pre class="codeblock"><span class="kw">SELECT</span> id_trajet, velo, 60 * distance / duree <span class="kw">AS</span> vitesse
<span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> (velo = 13 <span class="kw">OR</span> velo = 14) <span class="kw">AND</span> duree &gt;= 12;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>id_trajet</th><th>velo</th><th>vitesse</th></tr>
  <tr><td>5</td><td>14</td><td>12.92</td></tr>
  <tr><td>7</td><td>14</td><td>14.0</td></tr>
  <tr><td>11</td><td>14</td><td>12.0</td></tr>
  <tr><td>13</td><td>13</td><td>12.71</td></tr>
  <tr><td>14</td><td>14</td><td>12.5</td></tr>
  <tr><td>15</td><td>13</td><td>12.0</td></tr>
</table></div><figcaption>Résultat : 6 lignes.</figcaption></figure>
    <p>Contrôle : le vélo 13 a fait quatre trajets, dont deux d'au moins 12 minutes (13 et 15) ; le vélo 14 en a fait cinq, dont quatre d'au moins 12 minutes. On attend bien six lignes.</p>
  </div>


  <div class="notice"><strong>Erreur classique</strong> : oublier les parenthèses. <span class="code-inline">AND</span> est prioritaire sur <span class="code-inline">OR</span> (comme × sur +) : sans parenthèses, la condition précédente se lit <span class="code-inline">velo = 13 OR (velo = 14 AND duree &gt;= 12)</span> et garde aussi les trajets courts du vélo 13 (2 et 6) : huit lignes au lieu de six. Autres pièges : l'égalité s'écrit <span class="code-inline">=</span> (et non <span class="code-inline">==</span>), la différence <span class="code-inline">&lt;&gt;</span>. Enfin, selon le logiciel, le quotient de deux entiers peut être une division entière (7 / 2 donne 3 dans certains logiciels) : le programme passe outre cette subtilité ; ici distance est un flottant, et le calcul de vitesse se fait en flottants.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DOUBLONS, TRI, PAGINATION</div>
  <h2>Mettre en forme le résultat : DISTINCT, ORDER BY, LIMIT, OFFSET</h2>
  <div class="intro">Contrairement à une table, le résultat d'un <span class="code-inline">SELECT</span> peut contenir plusieurs fois la même ligne, et ses lignes arrivent dans un ordre que rien ne garantit. Quatre mots-clés règlent ces deux points.</div>

  <div class="def-box">
    <ul>
      <li><span class="code-inline">SELECT DISTINCT …</span> retire du résultat les lignes en double (deux lignes sont en double si elles coïncident sur <em>toutes</em> les colonnes du résultat).</li>
      <li><span class="code-inline">ORDER BY a, b DESC</span> trie le résultat selon a, puis départage les ex æquo selon b ; l'ordre est croissant par défaut (<span class="code-inline">ASC</span>), décroissant avec <span class="code-inline">DESC</span>.</li>
      <li><span class="code-inline">LIMIT n</span> ne garde que les n premières lignes ; <span class="code-inline">LIMIT n OFFSET k</span> saute les k premières, puis garde les n suivantes. Ces deux mots-clés se placent en fin de requête, après <span class="code-inline">ORDER BY</span>.</li>
    </ul>
  </div>

  <p>Les quartiers des stations : la projection seule répète Centre et Rives, <span class="code-inline">DISTINCT</span> donne chaque quartier une fois.</p>
<pre class="codeblock"><span class="kw">SELECT</span> quartier <span class="kw">FROM</span> Station;</pre>

  <div class="method-box"><strong>Exemple — afficher les trajets page par page</strong>
    <p>L'application montre l'historique des trajets quatre par quatre, du plus récent au plus ancien. Quelle requête donne la page 2 ?</p>
    <ol>
      <li>Trier du plus récent au plus ancien : <span class="code-inline">ORDER BY jour DESC</span>. Plusieurs trajets ont lieu le même jour : on départage par le numéro, décroissant lui aussi (les numéros suivent l'ordre des trajets), pour que l'ordre soit entièrement déterminé.</li>
      <li>La page \(p\) saute les \(4(p - 1)\) premières lignes et en garde 4 : pour \(p = 2\), <span class="code-inline">LIMIT 4 OFFSET 4</span>.</li>
    </ol>
<pre class="codeblock"><span class="kw">SELECT</span> id_trajet, jour
<span class="kw">FROM</span> Trajet
<span class="kw">ORDER</span> <span class="kw">BY</span> jour <span class="kw">DESC</span>, id_trajet <span class="kw">DESC</span>
<span class="kw">LIMIT</span> 4 <span class="kw">OFFSET</span> 4;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>id_trajet</th><th>jour</th></tr>
  <tr><td>12</td><td>2026-03-05</td></tr>
  <tr><td>11</td><td>2026-03-05</td></tr>
  <tr><td>10</td><td>2026-03-05</td></tr>
  <tr><td>9</td><td>2026-03-04</td></tr>
</table></div><figcaption>Résultat : 4 lignes.</figcaption></figure>
    <p>La page 1 contenait les trajets 16, 15, 14 et 13 ; la page 2 enchaîne logiquement.</p>
  </div>


  <div class="notice"><strong>Erreur classique</strong> : faire confiance à <span class="code-inline">LIMIT</span> en cas d'ex æquo. Les cinq trajets les plus longs durent 35, 22, 17, 15 et 14 minutes, mais deux trajets (3 et 11) durent 14 minutes : <span class="code-inline">ORDER BY duree DESC LIMIT 5</span> en garde un au hasard du logiciel. Ajouter un second critère de tri rend le résultat reproductible ; pour obtenir <em>tous</em> les ex æquo, on utilise une requête imbriquée (§10). De même, sans <span class="code-inline">ORDER BY</span>, l'ordre des lignes d'un résultat n'est jamais garanti.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · OPÉRATIONS ENSEMBLISTES ET PRODUIT CARTÉSIEN</div>
  <h2>Combiner des résultats</h2>
  <div class="intro">Le résultat d'une requête étant un ensemble de lignes, on peut réunir, intersecter ou soustraire deux résultats. Le produit cartésien, lui, combine les lignes de deux tables : c'est la première étape d'une jointure.</div>

  <div class="def-box">
    Si R1 et R2 sont deux requêtes dont les résultats ont le même nombre de colonnes, de mêmes domaines dans le même ordre :
    <ul>
      <li><span class="code-inline">R1 UNION R2</span> contient les lignes présentes dans R1 <em>ou</em> dans R2 ;</li>
      <li><span class="code-inline">R1 INTERSECT R2</span> contient les lignes présentes dans R1 <em>et</em> dans R2 ;</li>
      <li><span class="code-inline">R1 EXCEPT R2</span> contient les lignes de R1 qui ne sont pas dans R2.</li>
    </ul>
    Le résultat ne contient aucun doublon, et ses colonnes portent les noms de celles de R1.
  </div>

  <p>Les stations où Théo (abonné 6) a pris <em>ou</em> rendu un vélo : il faut réunir deux colonnes différentes de Trajet, ce qu'un simple <span class="code-inline">OR</span> ne sait pas faire. La station 3, présente dans les deux résultats, n'apparaît qu'une fois.</p>
<pre class="codeblock"><span class="kw">SELECT</span> depart <span class="kw">AS</span> station <span class="kw">FROM</span> Trajet <span class="kw">WHERE</span> abonne = 6
<span class="kw">UNION</span>
<span class="kw">SELECT</span> arrivee <span class="kw">FROM</span> Trajet <span class="kw">WHERE</span> abonne = 6;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>station</th></tr>
  <tr><td>1</td></tr>
  <tr><td>3</td></tr>
  <tr><td>5</td></tr>
</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>

  <p>Les abonnés qui ont roulé le 4 mars <em>et</em> le 6 mars :</p>
<pre class="codeblock"><span class="kw">SELECT</span> abonne <span class="kw">FROM</span> Trajet <span class="kw">WHERE</span> jour = <span class="str">'2026-03-04'</span>
<span class="kw">INTERSECT</span>
<span class="kw">SELECT</span> abonne <span class="kw">FROM</span> Trajet <span class="kw">WHERE</span> jour = <span class="str">'2026-03-06'</span>;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>abonne</th></tr>
  <tr><td>4</td></tr>
  <tr><td>6</td></tr>
</table></div><figcaption>Résultat : 2 lignes.</figcaption></figure>
<pre class="codeblock"><span class="kw">SELECT</span> abonne <span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> jour = <span class="str">'2026-03-04'</span> <span class="kw">AND</span> jour = <span class="str">'2026-03-06'</span>;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>abonne</th></tr>
</table></div><figcaption>Résultat : aucune ligne.</figcaption></figure>
  <p>La seconde requête ne répond pas à la question : elle cherche une <em>ligne</em> dont le jour vaudrait à la fois deux dates, ce qui est impossible. <span class="code-inline">AND</span> combine des conditions sur une même ligne, <span class="code-inline">INTERSECT</span> combine deux ensembles de lignes.</p>

  <p>Les abonnés qui n'ont fait aucun trajet : tous les abonnés, privés de ceux qui apparaissent dans Trajet.</p>
<pre class="codeblock"><span class="kw">SELECT</span> id_abonne <span class="kw">FROM</span> Abonne
<span class="kw">EXCEPT</span>
<span class="kw">SELECT</span> abonne <span class="kw">FROM</span> Trajet;</pre>

</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>

  <div class="method-box"><strong>Exemple — opérations sur des couples</strong>
    <p>Quels abonnés ont pris un vélo dans une station qui ne fait pas partie de leurs favorites ?</p>
    <ol>
      <li>Les couples (abonné, station de départ) se lisent dans Trajet ; les couples (abonné, station favorite) dans Favori. Les deux résultats ont deux colonnes entières : ils sont compatibles.</li>
      <li>On veut les couples du premier ensemble absents du second : c'est une différence.</li>
    </ol>
<pre class="codeblock"><span class="kw">SELECT</span> abonne, depart <span class="kw">FROM</span> Trajet
<span class="kw">EXCEPT</span>
<span class="kw">SELECT</span> id_abonne, id_station <span class="kw">FROM</span> Favori;</pre>

  <tr><th>abonne</th><th>depart</th></tr>
  <tr><td>5</td><td>1</td></tr>
  <tr><td>6</td><td>1</td></tr>
</table></div><figcaption>Résultat : 2 lignes.</figcaption></figure>
    <p>Ana (5) est partie de la Gare, qui n'est pas sa favorite, et Théo (6) aussi. Inès est partie deux fois de la Gare et deux fois de la Faculté, ses deux favorites : ces couples, présents dans Favori, disparaissent.</p>
  </div>

  <h3>Produit cartésien</h3>
  <div class="def-box">
    Le <strong>produit cartésien</strong> de deux tables, écrit <span class="code-inline">FROM T1, T2</span>, est formé de toutes les combinaisons d'une ligne de T1 et d'une ligne de T2, avec les colonnes de T1 suivies de celles de T2. Si T1 a \(n_1\) lignes et T2 en a \(n_2\), le produit en a \(n_1 \times n_2\). Une colonne présente dans les deux tables se désigne par <span class="code-inline">T.colonne</span>.
  </div>

  <p>Seul, le produit sert peu, mais il répond à certaines questions. Pour une grille de tarifs, l'opérateur veut toutes les combinaisons d'une formule et d'un type de vélo : 42 lignes dans le produit Abonne × Velo, 6 couples distincts.</p>
<pre class="codeblock"><span class="kw">SELECT</span> <span class="kw">DISTINCT</span> formule, type
<span class="kw">FROM</span> Abonne, Velo
<span class="kw">ORDER</span> <span class="kw">BY</span> formule;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>formule</th><th>type</th></tr>
  <tr><td>annuel</td><td>VAE</td></tr>
  <tr><td>annuel</td><td>classique</td></tr>
  <tr><td>jeune</td><td>VAE</td></tr>
  <tr><td>jeune</td><td>classique</td></tr>
  <tr><td>mensuel</td><td>VAE</td></tr>
  <tr><td>mensuel</td><td>classique</td></tr>
</table></div><figcaption>Résultat : 6 lignes.</figcaption></figure>

  <p>Son véritable intérêt vient de la sélection qui le suit. Le produit Trajet × Station a \(16 \times 6 = 96\) lignes, chacune associant un trajet à une station quelconque ; ne garder que les lignes où la station est celle du départ recolle à chaque trajet <em>sa</em> station :</p>
<pre class="codeblock"><span class="kw">SELECT</span> Trajet.id_trajet, Station.nom
<span class="kw">FROM</span> Trajet, Station
<span class="kw">WHERE</span> Trajet.depart = Station.id_station <span class="kw">AND</span> Trajet.abonne = 6;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>id_trajet</th><th>nom</th></tr>
  <tr><td>9</td><td>Port</td></tr>
  <tr><td>15</td><td>Gare</td></tr>
</table></div><figcaption>Résultat : 2 lignes.</figcaption></figure>
  <p>C'est exactement ce que fait une jointure, objet du paragraphe suivant.</p>

  <div class="notice"><strong>Erreur classique</strong> : réunir des résultats incompatibles (nombres de colonnes différents, ou une colonne de noms face à une colonne de numéros). Le logiciel refuse le premier cas ; le second donne un résultat dénué de sens. Et ne pas confondre <span class="code-inline">OR</span> avec <span class="code-inline">UNION</span> : <span class="code-inline">OR</span> combine deux conditions sur une même ligne d'une même table.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · JOINTURES</div>
  <h2>Recoller les informations en suivant les clés étrangères</h2>
  <div class="intro">Une question porte souvent sur plusieurs tables : « le <em>nom</em> de la station de départ de chaque trajet ». La jointure recolle les lignes qui se correspondent par une clé étrangère.</div>

  <div class="def-box">
    La <strong>jointure</strong> <span class="code-inline">T1 JOIN T2 ON condition</span> est formée des lignes du produit cartésien de T1 et T2 qui vérifient la condition. Le programme se limite aux <strong>équi-jointures</strong> : la condition est une égalité, ou une conjonction d'égalités (reliées par <span class="code-inline">AND</span>), entre des colonnes des deux tables. On enchaîne <span class="code-inline">T1 JOIN T2 ON … JOIN T3 ON …</span> pour joindre plus de deux tables.
  </div>

  <p>Lorsque la condition égale une clé étrangère de T1 à la clé primaire de T2, chaque ligne de T1 est complétée par l'unique ligne de T2 qu'elle référence : le résultat a autant de lignes que T1. On donne aux tables des noms courts, ou <strong>alias</strong> (<span class="code-inline">Trajet AS t</span>), et l'on préfixe les colonnes par l'alias (<span class="code-inline">t.duree</span>) ; c'est obligatoire quand deux tables ont une colonne de même nom.</p>

<span class="kw">FROM</span> Abonne <span class="kw">AS</span> a

  <p>Une même table peut intervenir deux fois sous deux alias. Pour afficher les deux stations d'un trajet, on joint Station une fois pour le départ et une fois pour l'arrivée :</p>
<pre class="codeblock"><span class="kw">SELECT</span> t.id_trajet, d.nom <span class="kw">AS</span> de, r.nom <span class="kw">AS</span> vers
<span class="kw">FROM</span> Trajet <span class="kw">AS</span> t
<span class="kw">JOIN</span> Station <span class="kw">AS</span> d <span class="kw">ON</span> t.depart = d.id_station
<span class="kw">JOIN</span> Station <span class="kw">AS</span> r <span class="kw">ON</span> t.arrivee = r.id_station
<span class="kw">WHERE</span> t.jour = <span class="str">'2026-03-05'</span>;</pre>

  <h3>Autojointure</h3>
  <div class="def-box">
    Une <strong>autojointure</strong> est la jointure d'une table avec elle-même, sous deux alias : elle permet de comparer deux lignes d'une même table.
  </div>
  <p>Les paires de stations d'un même quartier : la condition d'égalité porte sur le quartier, et la condition <span class="code-inline">s1.id_station &lt; s2.id_station</span>, qui n'est pas une égalité, va dans <span class="code-inline">WHERE</span>. Sans elle, on obtiendrait aussi chaque station appariée à elle-même et chaque paire dans les deux sens : 12 lignes au lieu de 3.</p>
<pre class="codeblock"><span class="kw">SELECT</span> s1.nom <span class="kw">AS</span> station1, s2.nom <span class="kw">AS</span> station2
<span class="kw">FROM</span> Station <span class="kw">AS</span> s1 <span class="kw">JOIN</span> Station <span class="kw">AS</span> s2 <span class="kw">ON</span> s1.quartier = s2.quartier
<span class="kw">WHERE</span> s1.id_station &lt; s2.id_station;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>station1</th><th>station2</th></tr>
  <tr><td>Gare</td><td>Mairie</td></tr>
  <tr><td>Port</td><td>Marché</td></tr>
  <tr><td>Faculté</td><td>Piscine</td></tr>
</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>


  <div class="method-box"><strong>Exemple — repérer les allers-retours dans la journée</strong>
    <p>Un aller-retour est un couple de trajets d'un même abonné, le même jour, où l'arrivée de l'un est le départ de l'autre et inversement.</p>
    <ol>
      <li>Deux lignes de Trajet à comparer : autojointure, alias <span class="code-inline">a</span> (aller) et <span class="code-inline">r</span> (retour).</li>
      <li>Les quatre conditions sont des égalités : elles forment la condition <span class="code-inline">ON</span>.</li>
      <li>L'aller précède le retour : <span class="code-inline">a.id_trajet &lt; r.id_trajet</span>, dans <span class="code-inline">WHERE</span>. Cette condition élimine aussi le trajet en boucle 9, qui vérifie les quatre égalités avec lui-même, et le couple (3, 1), qui n'est que le couple (1, 3) lu à l'envers.</li>
    </ol>
<pre class="codeblock"><span class="kw">SELECT</span> a.id_trajet <span class="kw">AS</span> aller, r.id_trajet <span class="kw">AS</span> retour, a.jour
<span class="kw">FROM</span> Trajet <span class="kw">AS</span> a <span class="kw">JOIN</span> Trajet <span class="kw">AS</span> r
  <span class="kw">ON</span> a.abonne = r.abonne <span class="kw">AND</span> a.jour = r.jour
     <span class="kw">AND</span> a.arrivee = r.depart <span class="kw">AND</span> a.depart = r.arrivee
<span class="kw">WHERE</span> a.id_trajet &lt; r.id_trajet;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>aller</th><th>retour</th><th>jour</th></tr>
  <tr><td>1</td><td>3</td><td>2026-03-02</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>
  </div>


  <div class="notice"><strong>Erreur classique</strong> : oublier une condition de jointure, ou se tromper de colonne. <span class="code-inline">FROM Trajet, Station</span> sans condition donne les 96 lignes du produit, et chaque trajet semble partir de toutes les stations. Pour vérifier une jointure qui suit une clé étrangère, compter : le résultat doit avoir autant de lignes que la table qui porte la clé (avant le <span class="code-inline">WHERE</span>). Et toujours préfixer une colonne ambiguë : <span class="code-inline">nom</span> existe dans Station et dans Abonne.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · AGRÉGATS ET GROUP BY</div>
  <h2>Résumer une colonne, puis résumer par groupe</h2>
  <div class="intro">Les fonctions d'agrégation résument toute une colonne en une seule valeur : un nombre de lignes, une somme, une moyenne, un extremum. Avec <span class="code-inline">GROUP BY</span>, elles résument séparément chaque paquet de lignes.</div>

  <div class="def-box">
    Les <strong>fonctions d'agrégation</strong> s'appliquent aux lignes retenues par la requête :
    <ul>
      <li><span class="code-inline">COUNT(*)</span> : le nombre de lignes ; <span class="code-inline">COUNT(DISTINCT a)</span> : le nombre de valeurs distinctes de l'attribut a ;</li>
      <li><span class="code-inline">SUM(e)</span>, <span class="code-inline">AVG(e)</span> : la somme et la moyenne d'une expression numérique ;</li>
      <li><span class="code-inline">MIN(e)</span>, <span class="code-inline">MAX(e)</span> : le minimum et le maximum (nombres ou chaînes).</li>
    </ul>
    Sans <span class="code-inline">GROUP BY</span>, une requête dont le <span class="code-inline">SELECT</span> ne contient que des agrégats renvoie une seule ligne.
  </div>
<pre class="codeblock"><span class="kw">SELECT</span> <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb, <span class="kw">SUM</span>(distance) <span class="kw">AS</span> km, <span class="kw">AVG</span>(duree) <span class="kw">AS</span> moyenne,
       <span class="kw">MAX</span>(duree) <span class="kw">AS</span> plus_long, <span class="kw">MIN</span>(jour) <span class="kw">AS</span> premier_jour
<span class="kw">FROM</span> Trajet;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>nb</th><th>km</th><th>moyenne</th><th>plus_long</th><th>premier_jour</th></tr>
  <tr><td>16</td><td>48.1</td><td>13.5</td><td>35</td><td>2026-03-02</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>
<pre class="codeblock"><span class="kw">SELECT</span> <span class="kw">COUNT</span>(<span class="kw">DISTINCT</span> velo) <span class="kw">AS</span> velos_utilises
<span class="kw">FROM</span> Trajet;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">

  <tr><td>5</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>
  <p>Les seize trajets ont parcouru 48,1 km en tout ; cinq vélos sur six ont servi (le vélo 16 jamais).</p>

  <h3>Regrouper avant d'agréger</h3>
  <div class="def-box">
    <span class="code-inline">GROUP BY a1, …, ak</span> partage les lignes en <strong>groupes</strong> : deux lignes sont dans le même groupe si elles ont les mêmes valeurs de a1, …, ak. Le résultat a <strong>une ligne par groupe</strong> ; son <span class="code-inline">SELECT</span> ne doit contenir que les attributs du regroupement et des agrégats, calculés sur les lignes du groupe.
  </div>

<span class="kw">GROUP</span> <span class="kw">BY</span> s.id_station, s.nom

<pre class="codeblock"><span class="kw">SELECT</span> v.type, <span class="kw">AVG</span>(60 * t.distance / t.duree) <span class="kw">AS</span> vitesse_moyenne
<span class="kw">FROM</span> Trajet <span class="kw">AS</span> t <span class="kw">JOIN</span> Velo <span class="kw">AS</span> v <span class="kw">ON</span> t.velo = v.id_velo

  <div class="method-box"><strong>Exemple — résumer les abonnés par formule</strong>
    <p>Pour chaque formule, combien d'abonnés, et quelle est l'année d'inscription la plus ancienne ?</p>
    <ol>
      <li>« Pour chaque formule » : un groupe par formule, <span class="code-inline">GROUP BY formule</span>.</li>
      <li>Ce que l'on calcule dans chaque groupe : le nombre de lignes et la plus petite année d'inscription.</li>
      <li>Contrôle : la somme des effectifs doit redonner les 7 abonnés.</li>
    </ol>
<pre class="codeblock"><span class="kw">SELECT</span> formule, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> effectif, <span class="kw">MIN</span>(annee) <span class="kw">AS</span> depuis
<span class="kw">FROM</span> Abonne
<span class="kw">GROUP</span> <span class="kw">BY</span> formule;</pre>

</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>
    <p>On trouve bien \(3 + 2 + 2 = 7\).</p>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : afficher, dans une requête groupée, une colonne qui n'est ni regroupée ni agrégée. Dans <span class="code-inline">SELECT abonne, jour, COUNT(*) FROM Trajet GROUP BY abonne</span>, un abonné a plusieurs jours : lequel afficher ? La plupart des logiciels refusent cette requête ; ceux qui l'acceptent renvoient un jour quelconque du groupe. Ne pas confondre non plus <span class="code-inline">COUNT(*)</span>, qui compte des lignes, et <span class="code-inline">COUNT(DISTINCT a)</span>, qui compte des valeurs : Inès a fait 4 trajets, sur 1 seul vélo.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · FILTRER LES GROUPES : HAVING</div>
  <h2>WHERE trie les lignes, HAVING trie les groupes</h2>
  <div class="intro"><span class="code-inline">WHERE</span> et <span class="code-inline">HAVING</span> expriment tous deux une condition, mais ne filtrent pas les mêmes objets : <span class="code-inline">WHERE</span> garde ou écarte des lignes <em>avant</em> la formation des groupes, <span class="code-inline">HAVING</span> garde ou écarte des groupes <em>après</em> leur formation.</div>

  <div class="def-box">
    La clause <span class="code-inline">HAVING condition</span> se place après <span class="code-inline">GROUP BY</span> ; elle ne garde que les groupes qui vérifient la condition. Celle-ci peut porter sur des agrégats (calculés pour chaque groupe) et sur les attributs du regroupement. Un agrégat ne peut pas figurer dans un <span class="code-inline">WHERE</span>, puisque les groupes n'existent pas encore quand <span class="code-inline">WHERE</span> est évalué.
  </div>

  <div class="prop-box"><strong>Ordre d'écriture.</strong>
<pre class="codeblock"><span class="kw">SELECT</span> … <span class="kw">FROM</span> … <span class="kw">JOIN</span> … <span class="kw">ON</span> … <span class="kw">WHERE</span> …

  </div>

  <div class="method-box"><strong>Exemple — trois questions voisines, trois requêtes différentes</strong>
    <p>Voici, pour chaque abonné, ses durées de trajet, celles qui dépassent 12 minutes et sa durée moyenne.</p>
    <div><table style="width:auto;margin-inline:auto">
      <tr><th>abonne</th><th>durées (min)</th><th>durées &gt; 12</th><th>moyenne</th></tr>
      <tr><td>1</td><td>13, 14, 12, 15</td><td>13, 14, 15</td><td>13.5</td></tr>
      <tr><td>2</td><td>6, 7, 17</td><td>17</td><td>10.0</td></tr>
      <tr><td>3</td><td>13, 5</td><td>13</td><td>9.0</td></tr>
      <tr><td>4</td><td>9, 10, 12</td><td>aucune</td><td>10.33</td></tr>
      <tr><td>5</td><td>12, 14</td><td>14</td><td>13.0</td></tr>
      <tr><td>6</td><td>35, 22</td><td>35, 22</td><td>28.5</td></tr>
    </table></div>
    <ol>
      <li>« Combien de trajets de plus de 12 minutes chaque abonné a-t-il faits ? » La condition porte sur chaque trajet : <span class="code-inline">WHERE</span>, puis on compte par groupe. Moussa (4), dont aucun trajet ne dépasse 12 minutes, n'a plus aucune ligne après le <span class="code-inline">WHERE</span> : il disparaît.
<pre class="codeblock"><span class="kw">SELECT</span> abonne, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb_longs
<span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> duree &gt; 12
<span class="kw">GROUP</span> <span class="kw">BY</span> abonne;</pre>

  <tr><th>abonne</th><th>nb_longs</th></tr>
  <tr><td>1</td><td>3</td></tr>
  <tr><td>2</td><td>1</td></tr>
  <tr><td>3</td><td>1</td></tr>
  <tr><td>5</td><td>1</td></tr>
  <tr><td>6</td><td>2</td></tr>
</table></div><figcaption>Résultat : 5 lignes.</figcaption></figure>
      </li>
      <li>« Quels abonnés ont une durée moyenne de plus de 12 minutes ? » La condition porte sur un agrégat de chaque groupe : <span class="code-inline">HAVING</span>.
<pre class="codeblock"><span class="kw">SELECT</span> abonne, <span class="kw">AVG</span>(duree) <span class="kw">AS</span> moyenne
<span class="kw">FROM</span> Trajet
<span class="kw">GROUP</span> <span class="kw">BY</span> abonne
<span class="kw">HAVING</span> <span class="kw">AVG</span>(duree) &gt; 12;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>abonne</th><th>moyenne</th></tr>
  <tr><td>1</td><td>13.5</td></tr>
  <tr><td>5</td><td>13.0</td></tr>
  <tr><td>6</td><td>28.5</td></tr>
</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>
      </li>
      <li>« Parmi les trajets de plus de 10 minutes, quels abonnés en ont fait au moins deux ? » Les deux filtres à la fois : <span class="code-inline">WHERE</span> sur les lignes, puis <span class="code-inline">HAVING</span> sur les groupes. Inès garde ses quatre trajets, Ana et Théo leurs deux ; les autres n'en gardent qu'un.
<pre class="codeblock"><span class="kw">SELECT</span> abonne, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb
<span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> duree &gt; 10
<span class="kw">GROUP</span> <span class="kw">BY</span> abonne
<span class="kw">HAVING</span> <span class="kw">COUNT</span>(*) &gt;= 2;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>abonne</th><th>nb</th></tr>
  <tr><td>1</td><td>4</td></tr>
  <tr><td>5</td><td>2</td></tr>
  <tr><td>6</td><td>2</td></tr>
</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>
      </li>
    </ol>
  </div>

<pre class="codeblock"><span class="kw">SELECT</span> abonne <span class="kw">FROM</span> Trajet <span class="kw">WHERE</span> <span class="kw">AVG</span>(duree) &gt; 12 <span class="kw">GROUP</span> <span class="kw">BY</span> abonne;</pre>


  <div class="notice"><strong>Erreur classique</strong> : écrire <span class="code-inline">WHERE AVG(duree) &gt; 12</span> : le logiciel refuse, un agrégat n'a pas de sens ligne par ligne. Inversement, une condition qui ne porte que sur les lignes se met dans <span class="code-inline">WHERE</span> : <span class="code-inline">HAVING abonne &lt;&gt; 6</span> donne le même résultat que <span class="code-inline">WHERE abonne &lt;&gt; 6</span>, mais forme et calcule d'abord des groupes inutiles, et se lit moins bien. Enfin, une condition de <span class="code-inline">WHERE</span> change les lignes sur lesquelles sont calculés les agrégats : « la moyenne des trajets de plus de 12 minutes » n'est pas « la moyenne, si elle dépasse 12 minutes ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · REQUÊTES IMBRIQUÉES</div>
  <h2>Une requête à l'intérieur d'une autre</h2>
  <div class="intro">Une requête peut en contenir une autre, écrite entre parenthèses. Le résultat de la requête intérieure sert alors de valeur, ou de table, à la requête extérieure. C'est le moyen naturel de comparer à un maximum, à une moyenne, ou d'agréger des agrégats.</div>

  <div class="prop-box"><strong>Trois emplacements usuels.</strong>
    <ul>
      <li>Dans une condition (<span class="code-inline">WHERE</span> ou <span class="code-inline">HAVING</span>), une requête qui renvoie <strong>une seule valeur</strong> (une ligne, une colonne) s'utilise comme un nombre : <span class="code-inline">duree = (SELECT MAX(duree) FROM Trajet)</span>.</li>
      <li>Dans <span class="code-inline">FROM</span>, une requête joue le rôle d'une table, à laquelle on donne un alias : <span class="code-inline">FROM (SELECT …) AS c</span>.</li>
      <li>Avec <span class="code-inline">IN</span> ou <span class="code-inline">NOT IN</span>, on teste si une valeur appartient à la colonne renvoyée par la requête intérieure. Ce mot-clé, très courant, n'est pas cité par le programme : un énoncé peut l'employer, et l'on peut toujours s'en passer (avec <span class="code-inline">EXCEPT</span>, <span class="code-inline">INTERSECT</span> ou une jointure).</li>
    </ul>
  </div>

  <p>Le ou les trajets les plus longs : la requête intérieure calcule le maximum (35), la requête extérieure garde les lignes qui l'atteignent. Contrairement à <span class="code-inline">ORDER BY duree DESC LIMIT 1</span>, tous les ex æquo seraient affichés.</p>
<pre class="codeblock"><span class="kw">SELECT</span> id_trajet, abonne, duree
<span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> duree = (<span class="kw">SELECT</span> <span class="kw">MAX</span>(duree) <span class="kw">FROM</span> Trajet);</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>id_trajet</th><th>abonne</th><th>duree</th></tr>
  <tr><td>9</td><td>6</td><td>35</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>

  <p>Les abonnés dont la durée moyenne dépasse la durée moyenne de l'ensemble des trajets (13,5 minutes) : seul Théo convient, Inès étant exactement dans la moyenne.</p>
<pre class="codeblock"><span class="kw">SELECT</span> abonne, <span class="kw">AVG</span>(duree) <span class="kw">AS</span> moyenne
<span class="kw">FROM</span> Trajet
<span class="kw">GROUP</span> <span class="kw">BY</span> abonne
<span class="kw">HAVING</span> <span class="kw">AVG</span>(duree) &gt; (<span class="kw">SELECT</span> <span class="kw">AVG</span>(duree) <span class="kw">FROM</span> Trajet);</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>abonne</th><th>moyenne</th></tr>
  <tr><td>6</td><td>28.5</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>

  <p>Le nombre moyen de trajets par abonné ayant roulé est une moyenne de comptages : un agrégat d'agrégats. <span class="code-inline">AVG(COUNT(*))</span> est interdit ; on calcule d'abord les comptages dans une table intermédiaire, puis leur moyenne :</p>
<pre class="codeblock"><span class="kw">SELECT</span> <span class="kw">AVG</span>(nb) <span class="kw">AS</span> moyenne_par_abonne
<span class="kw">FROM</span> (<span class="kw">SELECT</span> abonne, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb
      <span class="kw">FROM</span> Trajet
      <span class="kw">GROUP</span> <span class="kw">BY</span> abonne) <span class="kw">AS</span> c;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>moyenne_par_abonne</th></tr>
  <tr><td>2.67</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>
  <p>On retrouve \(16 / 6 \approx 2{,}67\). Les abonnés qui n'ont jamais roulé en VAE, avec <span class="code-inline">NOT IN</span> :</p>
<pre class="codeblock"><span class="kw">SELECT</span> prenom, nom
<span class="kw">FROM</span> Abonne
<span class="kw">WHERE</span> id_abonne <span class="kw">NOT</span> <span class="kw">IN</span> (<span class="kw">SELECT</span> t.abonne
                        <span class="kw">FROM</span> Trajet <span class="kw">AS</span> t <span class="kw">JOIN</span> Velo <span class="kw">AS</span> v <span class="kw">ON</span> t.velo = v.id_velo
                        <span class="kw">WHERE</span> v.type = <span class="str">'VAE'</span>);</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>prenom</th><th>nom</th></tr>
  <tr><td>Hugo</td><td>Ferrand</td></tr>
  <tr><td>Léa</td><td>Bastide</td></tr>
  <tr><td>Ana</td><td>Carvalho</td></tr>
  <tr><td>Chloé</td><td>Garnier</td></tr>
</table></div><figcaption>Résultat : 4 lignes.</figcaption></figure>


  <div class="method-box"><strong>Exemple — l'abonné qui a roulé le plus longtemps</strong>
    <p>Donner le nom du ou des abonnés dont la durée totale de trajet est la plus grande.</p>
    <ol>
      <li>Durée totale par abonné : <span class="code-inline">SELECT SUM(duree) AS total FROM Trajet GROUP BY abonne</span> (54, 30, 18, 31, 26 et 57 minutes).</li>
      <li>La plus grande de ces durées totales : on prend le maximum de cette table intermédiaire, <span class="code-inline">SELECT MAX(total) FROM (…) AS d</span>, soit 57.</li>
      <li>Les abonnés qui l'atteignent : on regroupe à nouveau par abonné, joint à Abonne pour avoir le nom, et l'on compare dans <span class="code-inline">HAVING</span>.</li>
    </ol>
<pre class="codeblock"><span class="kw">SELECT</span> a.prenom, a.nom, <span class="kw">SUM</span>(t.duree) <span class="kw">AS</span> total
<span class="kw">FROM</span> Abonne <span class="kw">AS</span> a <span class="kw">JOIN</span> Trajet <span class="kw">AS</span> t <span class="kw">ON</span> a.id_abonne = t.abonne
<span class="kw">GROUP</span> <span class="kw">BY</span> a.id_abonne, a.prenom, a.nom
<span class="kw">HAVING</span> <span class="kw">SUM</span>(t.duree) = (<span class="kw">SELECT</span> <span class="kw">MAX</span>(total)
                       <span class="kw">FROM</span> (<span class="kw">SELECT</span> <span class="kw">SUM</span>(duree) <span class="kw">AS</span> total
                             <span class="kw">FROM</span> Trajet
                             <span class="kw">GROUP</span> <span class="kw">BY</span> abonne) <span class="kw">AS</span> d);</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>prenom</th><th>nom</th><th>total</th></tr>
  <tr><td>Théo</td><td>Roux</td><td>57</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>
    <p>Théo devance Inès de trois minutes. La même construction, avec <span class="code-inline">MIN</span> et <span class="code-inline">COUNT(*)</span>, donne les abonnés qui ont fait le moins de trajets : Léa, Ana et Théo, à égalité avec deux trajets chacun, là où <span class="code-inline">ORDER BY … LIMIT 1</span> n'en aurait gardé qu'un.</p>

  </div>

  <div class="notice"><strong>Erreur classique</strong> : comparer avec <span class="code-inline">=</span> à une requête qui renvoie plusieurs valeurs (<span class="code-inline">duree = (SELECT duree FROM Trajet WHERE abonne = 1)</span> n'a pas de sens : Inès a quatre durées). Autre piège : tester l'égalité de deux flottants calculés (une somme de distances, par exemple), que les arrondis peuvent rendre fausse (chapitre sur la représentation des nombres) ; l'exemple ci-dessus compare des durées entières.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce que l'on rencontre au-delà du programme</h2>
  <div class="intro">Rien de ce qui suit n'est exigible ; ces notions aident à comprendre un logiciel de bases de données réel.</div>
  <ul>
    <li><strong>Créer et remplir une base.</strong> La base du chapitre a été créée par des instructions <span class="code-inline">CREATE TABLE</span>, qui déclarent les attributs, la clé primaire et les clés étrangères, puis remplie par des <span class="code-inline">INSERT INTO</span>. Ces instructions, comme <span class="code-inline">DROP TABLE</span>, <span class="code-inline">UPDATE</span> ou <span class="code-inline">DELETE</span>, et la gestion des transactions et des droits d'accès, sont hors programme.</li>
    <li><strong>La valeur NULL et les jointures externes.</strong> Une case peut être vide (<span class="code-inline">NULL</span>), avec une logique à trois valeurs déroutante. Une jointure externe (<span class="code-inline">LEFT JOIN</span>) garde les lignes sans correspondant en complétant par des <span class="code-inline">NULL</span> : elle ferait apparaître Chloé avec 0 trajet.</li>
    <li><strong>Index.</strong> Un index sur une colonne permet au logiciel de trouver vite les lignes ayant une valeur donnée, sans parcourir toute la table, un peu comme une recherche dichotomique dans un tableau trié.</li>
    <li><strong>SQL depuis Python.</strong> Le module <span class="code-inline">sqlite3</span> permet d'exécuter une requête depuis un programme et d'en récupérer les lignes sous forme de liste de tuples ; c'est ainsi qu'ont été vérifiés tous les résultats de ce chapitre. Le programme précise que ce n'est pas un objectif.</li>
  </ul>
</div>
</template>
<template class="pan-tpl" data-panneau="sql-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · BASES DE DONNÉES, SQL</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes transforment une question posée en français en une requête SQL juste, et donnent les moyens de la contrôler. Les exemples éclair utilisent la base du cours (vélos en libre-service) : Station(<u>id_station</u>, nom, quartier, capacite), Abonne(<u>id_abonne</u>, nom, prenom, formule, annee), Velo(<u>id_velo</u>, type, annee), Trajet(<u>id_trajet</u>, abonne, velo, depart, arrivee, jour, duree, distance), Favori(<u>id_abonne, id_station</u>).</div>

  <div class="method-box"><strong>Méthode 1 — Lire le schéma d'une base</strong>
    <ol style="margin-top:.4rem">
      <li>Pour chaque table, dire en une phrase ce que représente <em>une</em> ligne (« une ligne de Trajet = un emprunt de vélo ») et repérer sa clé primaire, soulignée.</li>
      <li>Repérer les clés étrangères et la table qu'elles référencent : leurs valeurs sont des valeurs de la clé primaire de cette table, même si leur nom diffère (depart référence id_station).</li>
      <li>Dessiner le diagramme : un trait par clé étrangère, « \(\ast\) » du côté de la table qui porte la clé, « 1 » du côté de la table référencée.</li>
      <li>Repérer les tables d'association, dont la clé primaire est formée de clés étrangères : chacune réalise une association \(\ast - \ast\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une ligne de Favori signifie « telle station est une favorite de tel abonné » ; ses deux attributs sont des clés étrangères (vers Abonne et Station) et forment ensemble sa clé primaire : Favori réalise l'association \(\ast - \ast\) « a pour favorite » entre Abonne et Station.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Traduire une association en tables</strong>
    <ol style="margin-top:.4rem">
      <li>Trouver la cardinalité par deux questions : « une entité A est liée à combien d'entités B ? » et « une entité B est liée à combien d'entités A ? ».</li>
      <li>\(1 - \ast\) : une clé étrangère dans la table du côté « \(\ast\) », qui référence la clé primaire de l'autre table.</li>
      <li>\(1 - 1\) : une clé étrangère d'un côté, à valeurs deux à deux distinctes, ou bien une seule table qui regroupe les deux.</li>
      <li>\(\ast - \ast\) : une table d'association avec les deux clés étrangères et les attributs propres au lien ; sa clé primaire est le couple des clés étrangères, ou un identifiant ajouté si un même couple peut revenir plusieurs fois (des emprunts datés, par exemple).</li>
    </ol>
    <p><em>Exemple éclair :</em> l'opérateur enregistre les réparations ; une réparation concerne un seul vélo, un vélo peut être réparé plusieurs fois. Association \(1 - \ast\) de Velo vers Reparation : Reparation(<u>id_reparation</u>, velo, jour, cout), où velo est une clé étrangère vers Velo.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : vouloir écrire une liste dans une case (« les réparations du vélo » dans Velo). Une case contient une seule valeur : une association multiple se traduit toujours par des lignes dans une autre table.</div>

  <div class="method-box"><strong>Méthode 3 — Écrire une requête de sélection à partir d'une question</strong>
    <ol style="margin-top:.4rem">
      <li><span class="code-inline">FROM</span> : la table qui contient les informations demandées.</li>
      <li><span class="code-inline">WHERE</span> : traduire chaque condition sur une ligne ; mettre des parenthèses autour de chaque « ou ».</li>
      <li><span class="code-inline">SELECT</span> : les colonnes et les calculs demandés, renommés par <span class="code-inline">AS</span> si besoin.</li>
      <li>Mise en forme : « sans répétition » → <span class="code-inline">DISTINCT</span> ; « trié » → <span class="code-inline">ORDER BY</span> ; « les k premiers » → <span class="code-inline">ORDER BY … LIMIT k</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> les noms des stations des quartiers Centre ou Campus de moins de 25 places, de la plus grande à la plus petite :</p>
<pre class="codeblock"><span class="kw">SELECT</span> nom, capacite
<span class="kw">FROM</span> Station
<span class="kw">WHERE</span> (quartier = <span class="str">'Centre'</span> <span class="kw">OR</span> quartier = <span class="str">'Campus'</span>) <span class="kw">AND</span> capacite &lt; 25
<span class="kw">ORDER</span> <span class="kw">BY</span> capacite <span class="kw">DESC</span>;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>nom</th><th>capacite</th></tr>
  <tr><td>Faculté</td><td>24</td></tr>
  <tr><td>Mairie</td><td>20</td></tr>
  <tr><td>Piscine</td><td>12</td></tr>
</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier les apostrophes d'une chaîne (<span class="code-inline">quartier = Centre</span> désignerait une colonne Centre, qui n'existe pas), ou les parenthèses autour du <span class="code-inline">OR</span> : sans elles, la condition se lit « Centre, ou bien Campus de moins de 25 places », et la Gare (Centre, 30 places) apparaîtrait.</div>


  <div class="method-box"><strong>Méthode 4 — Joindre plusieurs tables</strong>
    <ol style="margin-top:.4rem">
      <li>Repérer sur le diagramme le chemin de tables qui relie les informations demandées.</li>
      <li>Écrire <span class="code-inline">FROM T1 AS a JOIN T2 AS b ON … JOIN T3 AS c ON …</span>, avec une condition <span class="code-inline">ON</span> par trait parcouru : clé étrangère = clé primaire référencée.</li>
      <li>Préfixer chaque colonne par son alias ; donner deux alias à une table qui joue deux rôles (station de départ, station d'arrivée).</li>
      <li>Ajouter <span class="code-inline">DISTINCT</span> si une même entité peut être atteinte par plusieurs chemins (un abonné, par plusieurs trajets).</li>
    </ol>
    <p><em>Exemple éclair :</em> les prénoms des abonnés partis d'une station du Campus. Chemin : Abonne → Trajet → Station.</p>
<pre class="codeblock"><span class="kw">SELECT</span> <span class="kw">DISTINCT</span> a.prenom
<span class="kw">FROM</span> Abonne <span class="kw">AS</span> a
<span class="kw">JOIN</span> Trajet <span class="kw">AS</span> t <span class="kw">ON</span> a.id_abonne = t.abonne
<span class="kw">JOIN</span> Station <span class="kw">AS</span> s <span class="kw">ON</span> t.depart = s.id_station
<span class="kw">WHERE</span> s.quartier = <span class="str">'Campus'</span>;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>prenom</th></tr>
  <tr><td>Hugo</td></tr>
  <tr><td>Inès</td></tr>
</table></div><figcaption>Résultat : 2 lignes.</figcaption></figure>
    <p>Sans <span class="code-inline">DISTINCT</span>, Hugo apparaîtrait trois fois et Inès deux fois (cinq départs du Campus).</p>

  </div>
  <div class="notice"><strong>Piège</strong> : une condition de jointure oubliée ne provoque aucune erreur, elle produit un produit cartésien. Si le résultat est anormalement long, compter : une jointure qui suit une clé étrangère a autant de lignes que la table qui porte cette clé.</div>

  <div class="method-box"><strong>Méthode 5 — Calculer « pour chaque … »</strong>
    <ol style="margin-top:.4rem">
      <li>« Pour chaque X », « par X » : regrouper par X, c'est-à-dire par sa clé (plus les attributs de X que l'on veut afficher).</li>
      <li>Choisir l'agrégat : <span class="code-inline">COUNT(*)</span> pour un nombre de lignes, <span class="code-inline">COUNT(DISTINCT …)</span> pour un nombre de valeurs différentes, <span class="code-inline">SUM</span>, <span class="code-inline">AVG</span>, <span class="code-inline">MIN</span>, <span class="code-inline">MAX</span>.</li>
      <li>Dans le <span class="code-inline">SELECT</span>, ne mettre que les attributs du regroupement et des agrégats.</li>
      <li>Contrôler : une ligne par groupe ; la somme des comptages redonne le nombre total de lignes.</li>
    </ol>
    <p><em>Exemple éclair :</em> la distance parcourue par chaque vélo.</p>
<pre class="codeblock"><span class="kw">SELECT</span> velo, <span class="kw">SUM</span>(distance) <span class="kw">AS</span> km
<span class="kw">FROM</span> Trajet
<span class="kw">GROUP</span> <span class="kw">BY</span> velo;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>velo</th><th>km</th></tr>
  <tr><td>11</td><td>14.4</td></tr>
  <tr><td>12</td><td>5.0</td></tr>
  <tr><td>13</td><td>10.4</td></tr>
  <tr><td>14</td><td>11.8</td></tr>
  <tr><td>15</td><td>6.5</td></tr>
</table></div><figcaption>Résultat : 5 lignes.</figcaption></figure>
    <p>Contrôle : \(14{,}4 + 5 + 10{,}4 + 11{,}8 + 6{,}5 = 48{,}1\) km, la distance totale. Le vélo 16, qui n'a jamais roulé, n'a pas de ligne.</p>

  </div>

  <div class="method-box"><strong>Méthode 6 — Choisir entre WHERE et HAVING</strong>
    <ol style="margin-top:.4rem">
      <li>Pour chaque condition, se demander : « puis-je la vérifier en regardant <em>une seule</em> ligne ? »</li>
      <li>Oui : elle va dans <span class="code-inline">WHERE</span>, avant le regroupement, et elle change les lignes sur lesquelles seront calculés les agrégats.</li>
      <li>Non, elle porte sur un agrégat (un total, une moyenne, un comptage) : elle va dans <span class="code-inline">HAVING</span>, après <span class="code-inline">GROUP BY</span>, en récrivant l'agrégat.</li>
    </ol>
    <p><em>Exemple éclair :</em> les vélos qui ont parcouru plus de 10 km au total, en ne comptant que les trajets à partir du 3 mars. « À partir du 3 mars » se lit sur une ligne (<span class="code-inline">WHERE</span>) ; « plus de 10 km au total » porte sur une somme (<span class="code-inline">HAVING</span>).</p>
<pre class="codeblock"><span class="kw">SELECT</span> velo, <span class="kw">SUM</span>(distance) <span class="kw">AS</span> km
<span class="kw">FROM</span> Trajet
<span class="kw">WHERE</span> jour &gt;= <span class="str">'2026-03-03'</span>
<span class="kw">GROUP</span> <span class="kw">BY</span> velo
<span class="kw">HAVING</span> <span class="kw">SUM</span>(distance) &gt; 10;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>velo</th><th>km</th></tr>
  <tr><td>14</td><td>11.8</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>
  </div>
  <div class="notice"><strong>Piège</strong> : un agrégat dans <span class="code-inline">WHERE</span> est une erreur (le logiciel refuse la requête). Et l'ordre des clauses est imposé : <span class="code-inline">WHERE</span> avant <span class="code-inline">GROUP BY</span>, <span class="code-inline">HAVING</span> juste après.</div>

  <div class="method-box"><strong>Méthode 7 — Trouver un extremum et les lignes qui l'atteignent</strong>
    <ol style="margin-top:.4rem">
      <li>Calculer l'extremum dans une requête intérieure : <span class="code-inline">(SELECT MAX(…) FROM …)</span>. S'il porte sur un agrégat (le plus grand nombre de trajets), calculer d'abord les agrégats dans une table dérivée : <span class="code-inline">SELECT MAX(nb) FROM (SELECT COUNT(*) AS nb FROM … GROUP BY …) AS c</span>.</li>
      <li>Garder les lignes (<span class="code-inline">WHERE</span>) ou les groupes (<span class="code-inline">HAVING</span>) dont la valeur égale cet extremum.</li>
      <li>N'employer <span class="code-inline">ORDER BY … LIMIT 1</span> que si l'énoncé demande « un » élément ou garantit l'unicité : cette forme perd les ex æquo.</li>
    </ol>
    <p><em>Exemple éclair :</em> le ou les jours où il y a eu le plus de trajets.</p>
<pre class="codeblock"><span class="kw">SELECT</span> jour, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb
<span class="kw">FROM</span> Trajet
<span class="kw">GROUP</span> <span class="kw">BY</span> jour
<span class="kw">HAVING</span> <span class="kw">COUNT</span>(*) = (<span class="kw">SELECT</span> <span class="kw">MAX</span>(n)
                   <span class="kw">FROM</span> (<span class="kw">SELECT</span> <span class="kw">COUNT</span>(*) <span class="kw">AS</span> n <span class="kw">FROM</span> Trajet <span class="kw">GROUP</span> <span class="kw">BY</span> jour) <span class="kw">AS</span> c);</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>jour</th><th>nb</th></tr>
  <tr><td>2026-03-05</td><td>4</td></tr>
</table></div><figcaption>Résultat : 1 ligne.</figcaption></figure>
    <p>Les quatre autres jours comptent trois trajets chacun.</p>

  </div>
  <div class="notice"><strong>Piège</strong> : <span class="code-inline">MAX(COUNT(*))</span> n'existe pas (pas d'agrégat d'agrégat dans une même requête) ; il faut passer par une table dérivée, comme ci-dessus.</div>

  <div class="method-box"><strong>Méthode 8 — Exprimer « jamais », « à la fois », « tous »</strong>
    <ol style="margin-top:.4rem">
      <li>« Les X qui n'ont jamais … » : tous les X, privés (<span class="code-inline">EXCEPT</span>) de ceux qui ont … ; ou <span class="code-inline">NOT IN</span>. Exemple : <span class="code-inline">SELECT id_velo FROM Velo EXCEPT SELECT velo FROM Trajet</span> donne le vélo 16, jamais emprunté.</li>
      <li>« Les X qui ont … et … », les deux faits étant lus sur des lignes différentes : <span class="code-inline">INTERSECT</span>, et non <span class="code-inline">AND</span>.</li>
      <li>« Les X liés à tous les Y » : compter. Regrouper par X et comparer le nombre de Y distincts atteints au nombre total de Y : <span class="code-inline">HAVING COUNT(DISTINCT …) = (SELECT COUNT(…) FROM …)</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> les stations d'où sont partis des vélos des deux types (« de tous les types »).</p>
<pre class="codeblock"><span class="kw">SELECT</span> s.nom
<span class="kw">FROM</span> Station <span class="kw">AS</span> s
<span class="kw">JOIN</span> Trajet <span class="kw">AS</span> t <span class="kw">ON</span> s.id_station = t.depart
<span class="kw">JOIN</span> Velo <span class="kw">AS</span> v <span class="kw">ON</span> t.velo = v.id_velo
<span class="kw">GROUP</span> <span class="kw">BY</span> s.id_station, s.nom
<span class="kw">HAVING</span> <span class="kw">COUNT</span>(<span class="kw">DISTINCT</span> v.type) = (<span class="kw">SELECT</span> <span class="kw">COUNT</span>(<span class="kw">DISTINCT</span> type) <span class="kw">FROM</span> Velo);</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>nom</th></tr>
  <tr><td>Gare</td></tr>
  <tr><td>Mairie</td></tr>
  <tr><td>Faculté</td></tr>
</table></div><figcaption>Résultat : 3 lignes.</figcaption></figure>

  </div>

  <div class="notice"><strong>Piège</strong> : pour « les abonnés qui n'ont jamais pris de VAE », on est tenté d'écrire :
<pre class="codeblock"><span class="kw">SELECT</span> <span class="kw">DISTINCT</span> a.prenom
<span class="kw">FROM</span> Abonne <span class="kw">AS</span> a
<span class="kw">JOIN</span> Trajet <span class="kw">AS</span> t <span class="kw">ON</span> a.id_abonne = t.abonne
<span class="kw">JOIN</span> Velo <span class="kw">AS</span> v <span class="kw">ON</span> t.velo = v.id_velo
<span class="kw">WHERE</span> v.type &lt;&gt; <span class="str">'VAE'</span>;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">
  <tr><th>prenom</th></tr>
  <tr><td>Hugo</td></tr>
  <tr><td>Léa</td></tr>
  <tr><td>Ana</td></tr>
  <tr><td>Moussa</td></tr>
  <tr><td>Théo</td></tr>
</table></div><figcaption>Résultat : 5 lignes.</figcaption></figure>
    <p>Cette requête ne donne <em>pas</em> les abonnés qui n'ont jamais pris de VAE, mais ceux qui ont pris au moins une fois un vélo classique. Moussa et Théo, qui ont aussi roulé en VAE, y figurent, et Chloé, qui n'a jamais roulé, en est absente. « Jamais » se traduit par une différence (<span class="code-inline">EXCEPT</span>, <span class="code-inline">NOT IN</span>), pas par <span class="code-inline">&lt;&gt;</span>.</p></div>

  <div class="method-box"><strong>Méthode 9 — Vérifier une requête</strong>
    <ol style="margin-top:.4rem">
      <li>Prévoir la forme du résultat : une ligne par quoi (trajet, abonné, groupe) ? Combien de lignes environ ?</li>
      <li>Dérouler la requête à la main sur deux ou trois lignes, en suivant l'ordre d'évaluation : <span class="code-inline">FROM</span>, <span class="code-inline">WHERE</span>, <span class="code-inline">GROUP BY</span>, <span class="code-inline">HAVING</span>, <span class="code-inline">SELECT</span>, <span class="code-inline">ORDER BY</span>.</li>
      <li>Chercher les lignes en trop (doublons, produit cartésien) et les lignes perdues (entités sans correspondant, condition trop stricte, <span class="code-inline">&lt;</span> au lieu de <span class="code-inline">&lt;=</span>).</li>
      <li>Faire un contrôle de cohérence : total des comptages, somme des sommes partielles.</li>
    </ol>
    <p><em>Exemple éclair :</em> le nombre de trajets par formule d'abonnement.</p>
<pre class="codeblock"><span class="kw">SELECT</span> a.formule, <span class="kw">COUNT</span>(*) <span class="kw">AS</span> nb
<span class="kw">FROM</span> Abonne <span class="kw">AS</span> a <span class="kw">JOIN</span> Trajet <span class="kw">AS</span> t <span class="kw">ON</span> a.id_abonne = t.abonne
<span class="kw">GROUP</span> <span class="kw">BY</span> a.formule;</pre>
<figure><div><table style="width:auto;margin-inline:auto;white-space:nowrap">

  </div>

  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Modéliser les concerts d'un orchestre</h3>
  <div class="statement">Une association gère les concerts de son orchestre. Chaque musicien a un nom et joue d'un seul instrument (violon, alto, flûte…), chaque instrument étant joué par plusieurs musiciens. Un concert a lieu un jour donné dans une salle (nom, ville) ; une salle accueille plusieurs concerts. Un musicien participe à plusieurs concerts, un concert réunit plusieurs musiciens, et chaque participation donne lieu à un cachet. Enfin, chaque concert fait l'objet d'exactement un enregistrement (numéro, durée en minutes), qui ne concerne que ce concert.</div>
  <div class="q"><strong>Q1.</strong> Lister les entités et les associations, avec leur cardinalité.</div>
  <div class="q"><strong>Q2.</strong> Proposer un schéma de tables, en soulignant les clés primaires et en indiquant les clés étrangères. Où se trouve l'information « cachet » ?</div>
  <div class="q"><strong>Q3.</strong> Un camarade propose d'ajouter à Concert une colonne musiciens contenant la liste des participants. Pourquoi est-ce une mauvaise idée ?</div>
  <div class="q"><strong>Q4.</strong> Avec votre schéma, écrire une requête donnant, pour chaque concert, son numéro, son jour, le nom de sa salle et le total des cachets versés.</div>
  <div class="q"><strong>Q5.</strong> Écrire une requête donnant les noms des violonistes qui ont participé au concert du 2026-04-03.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Entités : musicien, instrument, salle, concert, enregistrement. Associations : « joue de », \(1 - \ast\) d'Instrument vers Musicien (un musicien, un seul instrument) ; « a lieu dans », \(1 - \ast\) de Salle vers Concert ; « participe à », \(\ast - \ast\) entre Musicien et Concert, avec l'attribut cachet ; « est enregistré par », \(1 - 1\) entre Concert et Enregistrement.</p>
    <p><strong>Q2.</strong> Une solution (les noms sont libres) :</p>
    <ul>
      <li>Instrument(<u>id_instrument</u>, nom) ;</li>
      <li>Musicien(<u>id_musicien</u>, nom, instrument), où instrument référence Instrument ;</li>
      <li>Salle(<u>id_salle</u>, nom, ville) ;</li>
      <li>Concert(<u>id_concert</u>, jour, salle), où salle référence Salle ;</li>
      <li>Participation(<u>musicien, concert</u>, cachet), table d'association : musicien référence Musicien, concert référence Concert ;</li>
      <li>Enregistrement(<u>id_enregistrement</u>, duree, concert), où concert référence Concert et prend des valeurs toutes distinctes (association \(1 - 1\)).</li>
    </ul>
    <p>Le cachet dépend à la fois du musicien et du concert : c'est un attribut de l'association, donc de Participation. L'association \(\ast - \ast\) est séparée en deux associations \(1 - \ast\) : de Musicien vers Participation, de Concert vers Participation. On pouvait aussi fusionner Enregistrement dans Concert (colonnes numéro et durée), puisque l'association est \(1 - 1\).</p>
    <p><strong>Q3.</strong> Une case ne contient qu'une valeur : une liste n'est pas une valeur d'un domaine (entier, flottant, chaîne). Même codée dans une chaîne, elle empêcherait toute jointure et tout comptage en SQL, et dupliquerait des informations (les noms) qui doivent n'être écrites qu'une fois. Une association \(\ast - \ast\) se traduit par une table d'association.</p>
    <p><strong>Q4.</strong> Trois tables sur le chemin Salle — Concert — Participation, un regroupement par concert (on ajoute au regroupement le jour et le nom de la salle pour pouvoir les afficher) :</p>
<pre class="codeblock"><span class="kw">SELECT</span> c.id_concert, c.jour, s.nom, <span class="kw">SUM</span>(p.cachet) <span class="kw">AS</span> total
<span class="kw">FROM</span> Concert <span class="kw">AS</span> c
<span class="kw">JOIN</span> Salle <span class="kw">AS</span> s <span class="kw">ON</span> c.salle = s.id_salle
<span class="kw">JOIN</span> Participation <span class="kw">AS</span> p <span class="kw">ON</span> p.concert = c.id_concert
<span class="kw">GROUP</span> <span class="kw">BY</span> c.id_concert, c.jour, s.nom;</pre>
    <p><strong>Q5.</strong> Chemin Instrument — Musicien — Participation — Concert :</p>
<pre class="codeblock"><span class="kw">SELECT</span> m.nom
<span class="kw">FROM</span> Musicien <span class="kw">AS</span> m
<span class="kw">JOIN</span> Instrument <span class="kw">AS</span> i <span class="kw">ON</span> m.instrument = i.id_instrument
<span class="kw">JOIN</span> Participation <span class="kw">AS</span> p <span class="kw">ON</span> p.musicien = m.id_musicien
<span class="kw">JOIN</span> Concert <span class="kw">AS</span> c <span class="kw">ON</span> p.concert = c.id_concert
<span class="kw">WHERE</span> i.nom = <span class="str">'violon'</span> <span class="kw">AND</span> c.jour = <span class="str">'2026-04-03'</span>;</pre>
    <p>Testées sur un petit jeu de données (cinq musiciens, trois concerts), ces requêtes donnent bien un total par concert et les deux violonistes du 3 avril.</p>
  </div>
</div>

  <h3>Requêtes imbriquées : moyennes, records, absences</h3>
  <div class="statement">Base du cours : Station(<u>id_station</u>, nom, quartier, capacite), Abonne(<u>id_abonne</u>, nom, prenom, formule, annee), Velo(<u>id_velo</u>, type, annee), Trajet(<u>id_trajet</u>, abonne, velo, depart, arrivee, jour, duree, distance).</div>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> La moyenne (13,5 minutes) est calculée par une requête intérieure qui renvoie une seule valeur.</p>

    <p><strong>Q3.</strong> Un maximum de comptages : table dérivée des comptages, puis comparaison dans <span class="code-inline">HAVING</span>.</p>

<pre class="codeblock"><span class="kw">SELECT</span> a.prenom

                         <span class="kw">FROM</span> Trajet
