<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties a) à d) de la section « Intégration sur un intervalle quelconque » du programme de PT : donner un sens à l'intégrale d'une fonction <strong>continue</strong> sur un intervalle qui n'est pas un segment, décider si elle converge, puis intégrer une série terme à terme. Il prolonge le chapitre Intégration sur un segment (dont toutes les propriétés passent à la limite) et prépare le chapitre Intégrales à paramètre (partie e) du programme). Le programme demande d'éviter l'excès de rigueur : dans les calculs, on n'impose pas de rappeler les hypothèses de régularité de l'intégration par parties ni du changement de variable.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Intégrale sur \([a, +\infty[\)</strong> : intégrale convergente ou divergente en \(+\infty\) ; cas d'une fonction positive (convergence si et seulement si \(x \mapsto \int_a^x f\) est majorée) ; comparaison \(0 \le f \le g\) (§1).</li>
        <li><strong>Intervalle quelconque</strong> (semi-ouvert ou ouvert) : convergence en \(a\), en \(b\) ; linéarité, positivité, croissance, relation de Chasles (§2).</li>
        <li><strong>Intégration par parties</strong> sur un intervalle quelconque (l'existence de limites finies de \(fg\) aux bornes assure que les deux intégrales sont de même nature) et <strong>changement de variable</strong> par une bijection \(\mathcal{C}^1\) strictement monotone ; démonstrations non exigibles (§3).</li>
        <li><strong>Absolue convergence, fonctions intégrables</strong> : la convergence absolue implique la convergence ; inégalité triangulaire ; espace \(L^1(I, \mathbb{K})\) ; fonction continue, positive, intégrable et d'intégrale nulle (§4).</li>
        <li><strong>Fonctions de référence</strong> : \(t \mapsto 1/t^\alpha\) en \(+\infty\) et en \(0^+\), \(t \mapsto \mathrm{e}^{-\alpha t}\) en \(+\infty\), \(\ln\) en \(0^+\), \(x \mapsto 1/|x - a|^\alpha\) en \(a\), passage d'une borne \(a\) à \(0^+\) par translation (§5).</li>
        <li><strong>Comparaison</strong> : \(|f| \le |g|\), \(f = O(g)\), \(f = o(g)\), \(f \sim g\), en \(+\infty\) et adaptation aux autres bornes (§6).</li>
        <li><strong>Intégration terme à terme</strong> d'une série de fonctions intégrables (démonstration hors programme) (§7).</li>
        <li>Exemples incontournables : <strong>intégrale de Gauss</strong> et <strong>fonction Γ</strong> (§8).</li>
      </ul>
      <p>Hors programme : l'étude des intégrales semi-convergentes, le théorème de convergence dominée, les intégrales de Bertrand (en fin de chapitre).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · CONVERGENCE SUR [a, +∞[</div>
  <h2>Donner un sens à une intégrale sur un intervalle non borné</h2>
  <div class="intro">Sur un segment, l'intégrale d'une fonction continue existe toujours. Sur \([a, +\infty[\), on intègre d'abord jusqu'à \(x\), puis on fait tendre \(x\) vers \(+\infty\) : l'intégrale existe si cette limite est finie. Toute la difficulté du chapitre est de décider de cette convergence, souvent sans calculer de primitive.</div>

  <div class="def-box">
    Soit \(f\) continue sur \([a, +\infty[\), à valeurs dans \(\mathbb{K} = \mathbb{R}\) ou \(\mathbb{C}\). L'intégrale \(\int_a^{+\infty} f(t)\,\mathrm{d}t\) est <strong>convergente</strong> si la fonction \(x \mapsto \int_a^x f(t)\,\mathrm{d}t\) a une <strong>limite finie</strong> quand \(x \to +\infty\) ; cette limite est alors la valeur de l'intégrale :
    <div class="formula" data-nom="Intégrale sur [a, +∞[">$$\int_a^{+\infty} f(t)\,\mathrm{d}t = \lim_{x \to +\infty} \int_a^x f(t)\,\mathrm{d}t.$$</div>
    Dans le cas contraire, l'intégrale est <strong>divergente</strong>. On dit aussi que l'intégrale converge (ou diverge) <strong>en \(+\infty\)</strong>.
  </div>
  <p>Deux remarques utiles. La nature de l'intégrale ne dépend pas de \(a\) : pour \(a' \gt a\), \(\int_a^x f = \int_a^{a'} f + \int_{a'}^x f\), et le premier terme est une intégrale ordinaire. Seul compte donc le comportement de \(f\) <strong>au voisinage de \(+\infty\)</strong>. Ensuite, si \(G\) est une primitive de \(f\), l'intégrale converge si et seulement si \(G\) a une limite finie en \(+\infty\), et alors \(\int_a^{+\infty} f = \lim_{+\infty} G - G(a)\), que l'on note \(\big[G\big]_a^{+\infty}\).</p>

  <div class="method-box">
    <strong>Exemple — quatre intégrales par le calcul</strong>
    <ol>
      <li>\(\int_0^x \mathrm{e}^{-2t}\,\mathrm{d}t = \dfrac{1 - \mathrm{e}^{-2x}}{2} \to \dfrac12\) : \(\int_0^{+\infty} \mathrm{e}^{-2t}\,\mathrm{d}t\) converge et vaut \(\dfrac12\).</li>
      <li>\(\int_0^x \dfrac{\mathrm{d}t}{1 + t^2} = \arctan x \to \dfrac{\pi}{2}\) : l'intégrale converge et vaut \(\dfrac{\pi}{2}\).</li>
      <li>\(\int_1^x \dfrac{\mathrm{d}t}{t} = \ln x \to +\infty\) : \(\int_1^{+\infty} \frac{\mathrm{d}t}{t}\) diverge, bien que \(1/t \to 0\).</li>
      <li>\(\int_0^x \cos t\,\mathrm{d}t = \sin x\) n'a pas de limite : \(\int_0^{+\infty} \cos t\,\mathrm{d}t\) diverge, bien que l'intégrale partielle reste bornée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que \(f(t) \to 0\) suffit (contre-exemple : \(1/t\)), ou qu'elle est nécessaire. Ce qui est vrai : si \(f(t) \to \ell \neq 0\), l'intégrale diverge : pour \(f\) réelle et \(\ell \gt 0\) par exemple, \(f \ge \ell/2\) sur un intervalle \([A, +\infty[\), donc \(\int_A^x f \ge \frac{\ell}{2}(x - A) \to +\infty\) (pour \(f\) complexe, raisonner sur la partie réelle ou imaginaire dont la limite n'est pas nulle). Mais une fonction continue peut avoir une intégrale convergente sans tendre vers 0 (des « pics » de plus en plus étroits), contrairement au terme général d'une série convergente.</div>

  <h3>Fonctions positives</h3>
  <div class="prop-box">
    <strong>Théorème (cas positif).</strong> Si \(f\) est continue et <strong>positive</strong> sur \([a, +\infty[\), l'intégrale \(\int_a^{+\infty} f\) converge si et seulement si \(F : x \mapsto \int_a^x f(t)\,\mathrm{d}t\) est <strong>majorée</strong> ; alors \(\int_a^{+\infty} f = \sup_{x \ge a} F(x)\).
  </div>
  <div class="prop-box">
    <strong>Comparaison.</strong> Soit \(f\), \(g\) continues sur \([a, +\infty[\) avec \(0 \le f \le g\). Si \(\int_a^{+\infty} g\) converge, alors \(\int_a^{+\infty} f\) converge et \(0 \le \int_a^{+\infty} f \le \int_a^{+\infty} g\). Par contraposée, si \(\int_a^{+\infty} f\) diverge, \(\int_a^{+\infty} g\) diverge.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une fonction croissante a une limite finie si et seulement si elle est majorée.</span>
    <div class="content"><p>Cas positif : \(F' = f \ge 0\), donc \(F\) est croissante. Par le théorème de la limite monotone, \(F\) a en \(+\infty\) une limite finie (égale à \(\sup F\)) si elle est majorée, et tend vers \(+\infty\) sinon.</p>
    <p>Comparaison : par croissance de l'intégrale sur \([a, x]\), \(\int_a^x f \le \int_a^x g\). La fonction \(x \mapsto \int_a^x g\) est croissante de limite \(\int_a^{+\infty} g\), donc majorée par ce nombre ; \(x \mapsto \int_a^x f\) est alors majorée, et le cas positif conclut. L'inégalité entre les intégrales s'obtient en passant à la limite.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — l'intégrale de \(\mathrm{e}^{-t^2}\) converge</strong>
    <p>On ne connaît pas de primitive explicite de \(t \mapsto \mathrm{e}^{-t^2}\) ; on compare.</p>
    <ol>
      <li>Pour \(t \ge 1\), \(t^2 \ge t\), donc \(0 \le \mathrm{e}^{-t^2} \le \mathrm{e}^{-t}\).</li>
      <li>\(\int_1^x \mathrm{e}^{-t}\,\mathrm{d}t = \mathrm{e}^{-1} - \mathrm{e}^{-x} \to \mathrm{e}^{-1}\) : \(\int_1^{+\infty} \mathrm{e}^{-t}\,\mathrm{d}t\) converge, donc \(\int_1^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t\) aussi, et elle est au plus \(\mathrm{e}^{-1} \approx 0{,}37\).</li>
      <li>\(\int_0^1 \mathrm{e}^{-t^2}\,\mathrm{d}t\) est une intégrale ordinaire : par Chasles, \(\int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t\) converge. Sa valeur, \(\frac{\sqrt\pi}{2}\), est donnée au §8 et démontrée dans le chapitre Intégrales à paramètre (§7).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · INTERVALLES QUELCONQUES</div>
  <h2>Une borne finie problématique, ou deux bornes</h2>
  <div class="intro">La même idée s'applique à une borne finie où la fonction n'est pas définie (\(\int_0^1 \ln t\,\mathrm{d}t\)) et aux intervalles ouverts aux deux bouts. Règle d'or : on traite <strong>chaque borne problématique séparément</strong>.</div>

  <div class="def-box">
    <ul>
      <li>Si \(f\) est continue sur \([a, b[\) (\(b\) réel ou \(+\infty\)), \(\int_a^b f\) <strong>converge en \(b\)</strong> si \(\int_a^x f\) a une limite finie quand \(x \to b^-\).</li>
      <li>Si \(f\) est continue sur \(]a, b]\) (\(a\) réel ou \(-\infty\)), \(\int_a^b f\) <strong>converge en \(a\)</strong> si \(\int_x^b f\) a une limite finie quand \(x \to a^+\).</li>
      <li>Si \(f\) est continue sur \(]a, b[\), \(\int_a^b f\) <strong>converge</strong> s'il existe \(c \in \,]a, b[\) tel que \(\int_a^c f\) et \(\int_c^b f\) convergent ; on pose alors \(\int_a^b f = \int_a^c f + \int_c^b f\), valeur indépendante de \(c\) (relation de Chasles).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Intégrale faussement généralisée.</strong> Si \(f\) est continue sur \([a, b[\), avec \(b\) <strong>réel</strong>, et a une limite finie en \(b\), alors \(\int_a^b f\) converge : c'est l'intégrale ordinaire du prolongement par continuité de \(f\) à \([a, b]\). Exemples : \(\int_0^1 \frac{\sin t}{t}\,\mathrm{d}t\), \(\int_0^1 \frac{\mathrm{e}^t - 1}{t}\,\mathrm{d}t\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">L'intégrale d'une fonction continue sur un segment est continue en sa borne.</span>
    <div class="content"><p>Soit \(\tilde f\) le prolongement continu de \(f\) à \([a, b]\). Pour \(x \lt b\), \(\int_a^x f = \int_a^x \tilde f\), et \(x \mapsto \int_a^x \tilde f\) est continue sur \([a, b]\) (c'est une primitive de \(\tilde f\)) : elle tend vers \(\int_a^b \tilde f\) quand \(x \to b^-\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Propriétés des intégrales convergentes</strong> (bornes \(a \lt b\)) :
    <ul>
      <li><strong>linéarité</strong> : si \(\int_a^b f\) et \(\int_a^b g\) convergent, \(\int_a^b (\lambda f + \mu g)\) converge et vaut \(\lambda\int_a^b f + \mu\int_a^b g\) ;</li>
      <li><strong>positivité</strong> : si \(f \ge 0\) et \(\int_a^b f\) converge, alors \(\int_a^b f \ge 0\) ;</li>
      <li><strong>croissance</strong> : si \(f \le g\) et les deux intégrales convergent, \(\int_a^b f \le \int_a^b g\) ;</li>
      <li><strong>relation de Chasles</strong> : pour \(c \in \,]a, b[\), \(\int_a^b f\) converge si et seulement si \(\int_a^c f\) et \(\int_c^b f\) convergent, et alors \(\int_a^b f = \int_a^c f + \int_c^b f\).</li>
    </ul>
    Toutes s'obtiennent en passant à la limite dans les propriétés sur un segment.
  </div>
  <div class="method-box">
    <strong>Exemple — trois calculs</strong>
    <ol>
      <li>\(\int_0^1 \ln t\,\mathrm{d}t\) : \(\ln\) est continue sur \(]0, 1]\), de primitive \(t\ln t - t\). Pour \(x \in \,]0, 1]\), \(\int_x^1 \ln t\,\mathrm{d}t = -1 - x\ln x + x \to -1\) quand \(x \to 0^+\) (car \(x\ln x \to 0\)). L'intégrale converge et vaut \(-1\).</li>
      <li>\(\int_0^1 \frac{\mathrm{d}t}{\sqrt{1 - t^2}}\) : la fonction est continue sur \([0, 1[\) et \(\int_0^x = \arcsin x \to \frac{\pi}{2}\) quand \(x \to 1^-\).</li>
      <li>\(\int_{-\infty}^{+\infty} \frac{\mathrm{d}t}{1+t^2}\) : on coupe en 0 ; chaque moitié vaut \(\frac{\pi}{2}\) (§1 et parité), donc l'intégrale converge et vaut \(\pi\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : faire tendre les deux bornes ensemble. \(\int_{-x}^{x} t\,\mathrm{d}t = 0\) pour tout \(x\), et pourtant \(\int_{-\infty}^{+\infty} t\,\mathrm{d}t\) <strong>diverge</strong>, car \(\int_0^{+\infty} t\,\mathrm{d}t\) diverge. Autre piège, la linéarité dans le mauvais sens : \(\int_1^{+\infty} \left(\frac1t - \frac{1}{t+1}\right)\mathrm{d}t = \Big[\ln\frac{t}{t+1}\Big]_1^{+\infty} = \ln 2\) converge, alors que ni \(\int_1^{+\infty} \frac{\mathrm{d}t}{t}\) ni \(\int_1^{+\infty} \frac{\mathrm{d}t}{t+1}\) ne convergent : on ne sépare une intégrale en deux qu'après avoir vérifié que chaque morceau converge.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · INTÉGRATION PAR PARTIES ET CHANGEMENT DE VARIABLE</div>
  <h2>Les techniques de calcul sur un intervalle quelconque</h2>
  <div class="intro">Les deux formules de calcul restent valables, à condition de contrôler les bornes : un crochet qui doit avoir des limites finies pour l'intégration par parties, une bijection pour le changement de variable. Bonus : elles transmettent la convergence d'une intégrale à l'autre.</div>

  <div class="prop-box">
    <strong>Intégration par parties.</strong> Soit \(f\), \(g\) de classe \(\mathcal{C}^1\) sur \(]a, b[\) (bornes finies ou non) telles que le produit \(fg\) ait des <strong>limites finies</strong> en \(a\) et en \(b\). Alors \(\int_a^b f g'\) et \(\int_a^b f' g\) sont de même nature et, en cas de convergence,
    <div class="formula" data-nom="Intégration par parties généralisée">$$\begin{aligned} \int_a^b f(t)\,g'(t)\,\mathrm{d}t &= \Big[f g\Big]_a^b \\ &\quad - \int_a^b f'(t)\,g(t)\,\mathrm{d}t, \end{aligned}$$</div>
    où le crochet désigne \(\lim_{b^-} fg - \lim_{a^+} fg\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Non exigible : une intégration par parties sur un segment, puis deux passages à la limite.</span>
    <div class="content"><p>Pour \(a \lt x \lt y \lt b\), l'intégration par parties sur le segment \([x, y]\) donne \(\int_x^y fg' = f(y)g(y) - f(x)g(x) - \int_x^y f'g\). Le terme entre crochets a une limite finie quand \(x \to a^+\) et \(y \to b^-\) ; donc \(\int_x^y fg'\) a une limite finie si et seulement si \(\int_x^y f'g\) en a une, et l'égalité passe à la limite.</p></div>
  </div>
  <div class="prop-box">
    <strong>Changement de variable.</strong> Soit \(f\) continue sur \(]a, b[\) et \(\varphi : \,]\alpha, \beta[\, \to \,]a, b[\) <strong>bijective, strictement croissante et de classe \(\mathcal{C}^1\)</strong>. Alors \(\int_a^b f(t)\,\mathrm{d}t\) et \(\int_\alpha^\beta f\big(\varphi(u)\big)\,\varphi'(u)\,\mathrm{d}u\) sont de même nature, et égales en cas de convergence :
    <div class="formula" data-nom="Changement de variable généralisé">$$\int_a^b f(t)\,\mathrm{d}t = \int_\alpha^\beta f\big(\varphi(u)\big)\,\varphi'(u)\,\mathrm{d}u.$$</div>
    Si \(\varphi\) est strictement <strong>décroissante</strong>, les bornes s'échangent : \(\int_a^b f(t)\,\mathrm{d}t = \int_\beta^\alpha f\big(\varphi(u)\big)\,\varphi'(u)\,\mathrm{d}u\). Pour les changements usuels (\(t = \lambda u + \mu\), \(t = u^2\), \(t = \mathrm{e}^u\), \(t = 1/u\)…), on applique le résultat sans vérifier les hypothèses.
  </div>

  <div class="method-box">
    <strong>Exemple — choisir la primitive qui fait converger le crochet</strong>
    <p>Calcul de \(\int_0^1 \frac{\ln t}{(1+t)^2}\,\mathrm{d}t\), généralisée en \(0\).</p>
    <ol>
      <li>On dérive \(\ln t\) et on primitive \(\frac{1}{(1+t)^2}\). La primitive « naturelle » \(-\frac{1}{1+t}\) donne le crochet \(-\frac{\ln t}{1+t}\), qui tend vers \(+\infty\) en \(0^+\) : inutilisable.</li>
      <li>On choisit la primitive qui s'annule en 0 : \(1 - \frac{1}{1+t} = \frac{t}{1+t}\). Le crochet \(\frac{t\ln t}{1+t}\) tend vers 0 en \(0^+\) et vaut 0 en 1.</li>
      <li>L'intégrale a donc la nature de \(\int_0^1 \frac{1}{t}\cdot\frac{t}{1+t}\,\mathrm{d}t = \int_0^1 \frac{\mathrm{d}t}{1+t} = \ln 2\), intégrale ordinaire : elle converge, et
      <div class="formula">$$\int_0^1 \frac{\ln t}{(1+t)^2}\,\mathrm{d}t = -\int_0^1 \frac{\mathrm{d}t}{1+t} = -\ln 2.$$</div></li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une intégration par parties, puis un changement de variable</strong>
    <p>Calcul de \(K = \int_0^{+\infty} \frac{\ln(1+t)}{t^{3/2}}\,\mathrm{d}t\), généralisée aux deux bornes.</p>
    <ol>
      <li>On dérive \(\ln(1+t)\) et on primitive \(t^{-3/2}\) en \(-2t^{-1/2}\). Le crochet \(-\frac{2\ln(1+t)}{\sqrt t}\) tend vers 0 en \(0^+\) (il est équivalent à \(-2\sqrt t\)) et en \(+\infty\) (croissances comparées). Donc \(K\) a la nature de \(2\int_0^{+\infty} \frac{\mathrm{d}t}{\sqrt t\,(1+t)}\), et lui est égale en cas de convergence.</li>
      <li>On pose \(t = u^2\), \(u \in \,]0, +\infty[\) (bijection \(\mathcal{C}^1\) croissante), \(\mathrm{d}t = 2u\,\mathrm{d}u\) :
      <div class="formula">$$\begin{aligned} \int_0^{+\infty} \frac{\mathrm{d}t}{\sqrt t\,(1+t)} &= \int_0^{+\infty} \frac{2u\,\mathrm{d}u}{u\,(1 + u^2)} \\ &= 2\int_0^{+\infty} \frac{\mathrm{d}u}{1+u^2} = \pi. \end{aligned}$$</div></li>
      <li>Conclusion : \(K\) converge et \(K = 2\pi \approx 6{,}283\) (valeur confirmée par un calcul numérique).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un changement de variable qui supprime deux singularités</strong>
    <p>\(\int_0^1 \frac{\mathrm{d}t}{\sqrt{t(1-t)}}\) est généralisée en 0 et en 1. On pose \(t = \sin^2\theta\), \(\theta \in \,]0, \pi/2[\) (bijection croissante de classe \(\mathcal{C}^1\) sur \(]0, 1[\)) : \(\mathrm{d}t = 2\sin\theta\cos\theta\,\mathrm{d}\theta\) et \(\sqrt{t(1-t)} = \sin\theta\cos\theta\). L'intégrale devient \(\int_0^{\pi/2} 2\,\mathrm{d}\theta\) : elle converge et vaut \(\pi\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\int fg' = [fg] - \int f'g\) quand le crochet est infini, ce qui produit une forme « \(\infty - \infty\) » vide de sens. Soit on choisit une autre primitive (premier exemple), soit on intègre par parties sur un segment \([x, y]\) et on ne passe à la limite qu'à la fin.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ABSOLUE CONVERGENCE, FONCTIONS INTÉGRABLES</div>
  <h2>Contrôler \(|f|\) pour contrôler \(f\)</h2>
  <div class="intro">Les critères de comparaison ne s'appliquent qu'aux fonctions positives. Pour une fonction de signe quelconque ou à valeurs complexes, on étudie \(|f|\), qui est positive : si son intégrale converge, celle de \(f\) aussi. C'est la notion centrale du programme.</div>

  <div class="def-box">
    Soit \(f\) continue sur un intervalle \(I\). L'intégrale \(\int_I f\) est <strong>absolument convergente</strong> si \(\int_I |f|\) converge. La fonction \(f\) est alors dite <strong>intégrable sur \(I\)</strong> ; les deux expressions sont synonymes. Si \(I = [a, b[\), on dit que \(f\) est <strong>intégrable en \(b\)</strong> (de même en \(a\) pour \(I = \,]a, b]\)). Notations : \(\int_I f\), \(\int_I f(t)\,\mathrm{d}t\).
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> Si \(f\) est intégrable sur \(I\), son intégrale converge, et l'<strong>inégalité triangulaire</strong> est vraie :
    <div class="formula" data-nom="Inégalité triangulaire généralisée">$$\left|\int_I f(t)\,\mathrm{d}t\right| \le \int_I |f(t)|\,\mathrm{d}t.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Écrire \(f\) comme différence de deux fonctions positives.</span>
    <div class="content"><p>Cas réel. Les fonctions \(f^+ = \frac{|f| + f}{2}\) et \(f^- = \frac{|f| - f}{2}\) sont continues et vérifient \(0 \le f^\pm \le |f|\). Par comparaison (§1, adapté à toute borne), \(\int_I f^+\) et \(\int_I f^-\) convergent, donc \(\int_I f = \int_I f^+ - \int_I f^-\) converge par linéarité. De \(-|f| \le f \le |f|\) et de la croissance, on tire \(\left|\int_I f\right| \le \int_I |f|\).</p>
    <p>Cas complexe. \(|\operatorname{Re} f| \le |f|\) et \(|\operatorname{Im} f| \le |f|\) : les parties réelle et imaginaire sont intégrables, donc \(\int_I f\) converge. L'inégalité triangulaire complexe est admise (démonstration non exigible).</p></div>
  </div>
  <div class="prop-box">
    <strong>L'espace \(L^1(I, \mathbb{K})\).</strong> L'ensemble \(L^1(I, \mathbb{K})\) des fonctions intégrables sur \(I\) à valeurs dans \(\mathbb{K}\) est un espace vectoriel (\(|\lambda f + \mu g| \le |\lambda||f| + |\mu||g|\)), et \(f \mapsto \int_I f\) est une forme linéaire sur cet espace. Si \(I\) est un segment, toute fonction continue sur \(I\) est intégrable.
  </div>
  <div class="prop-box">
    <strong>Fonction d'intégrale nulle.</strong> Si \(f\) est continue, positive et intégrable sur \(I\), et si \(\int_I f = 0\), alors \(f\) est identiquement nulle sur \(I\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Se ramener au cas du segment.</span>
    <div class="content"><p>Si \(f(c) \gt 0\) pour un \(c \in I\), la continuité fournit un segment \([\alpha, \beta] \subset I\) non réduit à un point sur lequel \(f \ge f(c)/2\). Par Chasles et positivité de \(f\) sur le reste de \(I\), \(\int_I f \ge \int_\alpha^\beta f \ge (\beta - \alpha)\frac{f(c)}{2} \gt 0\) : contradiction.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — une intégrale complexe qui en donne deux réelles</strong>
    <ol>
      <li>\(|\mathrm{e}^{(-1+i)t}| = \mathrm{e}^{-t}\), intégrable sur \([0, +\infty[\) : \(t \mapsto \mathrm{e}^{(-1+i)t}\) est intégrable.</li>
      <li>\(\displaystyle\int_0^x \mathrm{e}^{(-1+i)t}\,\mathrm{d}t = \frac{\mathrm{e}^{(-1+i)x} - 1}{-1+i}\), et \(|\mathrm{e}^{(-1+i)x}| = \mathrm{e}^{-x} \to 0\) : l'intégrale vaut \(\dfrac{1}{1 - i} = \dfrac{1+i}{2}\).</li>
      <li>On prend parties réelle et imaginaire (linéarité) :
      <div class="formula">$$\begin{aligned} \int_0^{+\infty} \mathrm{e}^{-t}\cos t\,\mathrm{d}t &= \frac12, \\ \int_0^{+\infty} \mathrm{e}^{-t}\sin t\,\mathrm{d}t &= \frac12. \end{aligned}$$</div>
      Plus généralement, \(\int_0^{+\infty} \mathrm{e}^{-zt}\,\mathrm{d}t = \frac{1}{z}\) pour tout complexe \(z\) de partie réelle strictement positive.</li>
    </ol>
  </div>
  <div class="notice"><strong>Convergence sans convergence absolue.</strong> La réciproque du théorème est fausse : \(\int_1^{+\infty} \frac{\sin t}{t}\,\mathrm{d}t\) converge, mais pas absolument. L'étude de ces intégrales <strong>semi-convergentes</strong> n'est pas un objectif du programme (voir la dernière section) : en pratique, on prouve la convergence d'une intégrale en prouvant qu'elle converge absolument.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FONCTIONS DE RÉFÉRENCE</div>
  <h2>Les intégrales auxquelles on compare tout</h2>
  <div class="intro">Les critères de comparaison du §6 ramènent l'étude d'une intégrale à celle d'une fonction de référence dont on connaît le comportement. Il faut connaître les résultats suivants sans hésiter, et savoir les redémontrer en une ligne.</div>

  <div class="prop-box">
    <strong>Intégrales de Riemann.</strong> Pour \(\alpha \in \mathbb{R}\) :
    <ul>
      <li>\(t \mapsto \dfrac{1}{t^\alpha}\) est intégrable en \(+\infty\) (sur \([1, +\infty[\)) si et seulement si \(\alpha \gt 1\) ;</li>
      <li>\(t \mapsto \dfrac{1}{t^\alpha}\) est intégrable en \(0^+\) (sur \(]0, 1]\)) si et seulement si \(\alpha \lt 1\).</li>
    </ul>
    <div class="formula" data-nom="Intégrales de Riemann">$$\begin{aligned} \int_1^{+\infty} \frac{\mathrm{d}t}{t^\alpha} &= \frac{1}{\alpha - 1} \quad (\alpha \gt 1), \\ \int_0^1 \frac{\mathrm{d}t}{t^\alpha} &= \frac{1}{1 - \alpha} \quad (\alpha \lt 1). \end{aligned}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une primitive explicite, et le signe de \(1 - \alpha\).</span>
    <div class="content"><p>Pour \(\alpha \neq 1\), une primitive de \(t^{-\alpha}\) est \(\frac{t^{1-\alpha}}{1-\alpha}\). En \(+\infty\) : \(\int_1^x t^{-\alpha}\,\mathrm{d}t = \frac{x^{1-\alpha} - 1}{1 - \alpha}\) a une limite finie si et seulement si \(1 - \alpha \lt 0\), et cette limite vaut \(\frac{1}{\alpha - 1}\). En \(0^+\) : \(\int_x^1 t^{-\alpha}\,\mathrm{d}t = \frac{1 - x^{1-\alpha}}{1 - \alpha}\) a une limite finie quand \(x \to 0^+\) si et seulement si \(1 - \alpha \gt 0\). Pour \(\alpha = 1\), \(\int_1^x \frac{\mathrm{d}t}{t} = \ln x\) et \(\int_x^1 \frac{\mathrm{d}t}{t} = -\ln x\) tendent vers \(+\infty\) : divergence des deux côtés.</p></div>
  </div>

  <div class="prop-box">
    <strong>Autres fonctions de référence.</strong>
    <ul>
      <li>\(t \mapsto \mathrm{e}^{-\alpha t}\) est intégrable en \(+\infty\) si et seulement si \(\alpha \gt 0\), et \(\int_0^{+\infty} \mathrm{e}^{-\alpha t}\,\mathrm{d}t = \frac{1}{\alpha}\).</li>
      <li>\(\ln\) est intégrable en \(0^+\) : \(\int_0^1 \ln t\,\mathrm{d}t = -1\) (§2).</li>
      <li>\(x \mapsto \dfrac{1}{|x - a|^\alpha}\) est intégrable en \(a\) (à droite comme à gauche) si et seulement si \(\alpha \lt 1\).</li>
      <li>Plus généralement, \(f\) est intégrable en \(a^+\) si et seulement si \(t \mapsto f(a + t)\) l'est en \(0^+\), et en \(b^-\) si et seulement si \(t \mapsto f(b - t)\) l'est en \(0^+\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Exponentielle et translation.</span>
    <div class="content"><p>Si \(\alpha \gt 0\), \(\int_0^x \mathrm{e}^{-\alpha t}\,\mathrm{d}t = \frac{1 - \mathrm{e}^{-\alpha x}}{\alpha} \to \frac{1}{\alpha}\). Si \(\alpha \le 0\), \(\mathrm{e}^{-\alpha t} \ge 1\) et \(\int_0^x \mathrm{e}^{-\alpha t}\,\mathrm{d}t \ge x \to +\infty\). La translation \(x = a + t\) est un changement de variable affine (§3) : \(\int_a^{a+\eta} |f(x)|\,\mathrm{d}x = \int_0^\eta |f(a+t)|\,\mathrm{d}t\), d'où l'équivalence, et le cas de \(\frac{1}{|x-a|^\alpha}\) se ramène à Riemann en \(0^+\).</p></div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : inverser les seuils. En \(+\infty\), il faut décroître <strong>assez vite</strong> (\(\alpha \gt 1\)) ; en \(0^+\), la singularité doit être <strong>assez douce</strong> (\(\alpha \lt 1\)). La fonction \(t \mapsto 1/t\) n'est intégrable ni en 0 ni en \(+\infty\), et \(\int_0^{+\infty} \frac{\mathrm{d}t}{t^\alpha}\) diverge pour <strong>tout</strong> \(\alpha\) : une des deux bornes pose toujours problème.</div>
  <div class="method-box">
    <strong>Exemple — lectures directes</strong>
    <ol>
      <li>\(\int_2^{+\infty} \frac{\mathrm{d}t}{t^3}\) converge (\(\alpha = 3 \gt 1\)) et vaut \(\Big[-\frac{1}{2t^2}\Big]_2^{+\infty} = \frac18\).</li>
      <li>\(\int_0^1 \frac{\mathrm{d}t}{t^2}\) diverge (\(\alpha = 2 \ge 1\) en \(0^+\)).</li>
      <li>\(\int_0^1 \frac{\mathrm{d}t}{\sqrt{1 - t}}\) : en \(1^-\), translation \(t = 1 - s\), on obtient \(\int_0^1 \frac{\mathrm{d}s}{\sqrt s}\), qui converge (\(\alpha = \frac12\)) et vaut 2.</li>
      <li>\(\int_{-1}^{1} \frac{\mathrm{d}t}{|t|^{1/3}}\) : la fonction est paire et intégrable en \(0\) de chaque côté (\(\alpha = \frac13 \lt 1\)) ; l'intégrale vaut \(2 \times \frac{1}{1 - 1/3} = 3\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · CRITÈRES DE COMPARAISON</div>
  <h2>Étudier une intégrale sans la calculer</h2>
  <div class="intro">La plupart des intégrales généralisées n'ont pas de primitive simple. On décide de leur nature en comparant l'intégrande, au voisinage de chaque borne problématique, à une fonction de référence. Les énoncés sont écrits en \(+\infty\) ; ils s'adaptent à toute borne.</div>

  <div class="prop-box">
    <strong>Théorème de comparaison.</strong> Soit \(f\) et \(g\) continues sur \([a, +\infty[\).
    <ul>
      <li>Si \(|f| \le |g|\) et si \(g\) est intégrable en \(+\infty\), alors \(f\) est intégrable en \(+\infty\).</li>
      <li>Si \(f(t) \underset{t\to+\infty}{=} O\big(g(t)\big)\) et si \(g\) est intégrable en \(+\infty\), alors \(f\) l'est. C'est en particulier le cas si \(f(t) \underset{t\to+\infty}{=} o\big(g(t)\big)\).</li>
      <li>Si \(f(t) \underset{t\to+\infty}{\sim} g(t)\), alors \(f\) est intégrable en \(+\infty\) si et seulement si \(g\) l'est.</li>
    </ul>
    Adaptation : sur \(]a, b]\), les mêmes énoncés valent avec des comparaisons au voisinage de \(a\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout se ramène au cas positif du §1.</span>
    <div class="content"><ul>
      <li>Domination : \(\int_a^x |f| \le \int_a^x |g| \le \int_a^{+\infty} |g|\) ; la fonction croissante \(x \mapsto \int_a^x |f|\) est majorée.</li>
      <li>\(O\) : il existe \(M\) et \(A \ge a\) tels que \(|f| \le M|g|\) sur \([A, +\infty[\) ; \(M|g|\) est intégrable, donc \(f\) l'est sur \([A, +\infty[\), et sur \([a, A]\) par continuité. Un \(o\) est un \(O\).</li>
      <li>\(\sim\) : \(f - g = o(g)\), donc il existe \(A\) tel que \(|f - g| \le \frac12|g|\) sur \([A, +\infty[\). Alors \(\frac12|g| \le |f| \le \frac32|g|\) : \(f = O(g)\) et \(g = O(f)\).</li>
    </ul></div>
  </div>
  <div class="prop-box">
    <strong>Règle pratique.</strong> Si \(t^\alpha f(t)\) est bornée (par exemple tend vers 0) au voisinage de \(+\infty\) avec \(\alpha \gt 1\), alors \(f = O(1/t^\alpha)\) est intégrable en \(+\infty\). De même en \(0^+\) avec \(\alpha \lt 1\). Typiquement, \(t^2 f(t) \to 0\) suffit en \(+\infty\) : c'est le cas de \(t^n\mathrm{e}^{-t}\), de \(\mathrm{e}^{-t^2}\), de \(\frac{\ln t}{t^{3/2}}\)…
  </div>
  <div class="method-box">
    <strong>Méthode — étudier la nature d'une intégrale</strong>
    <ol>
      <li>Déterminer l'intervalle où \(f\) est continue et lister les <strong>bornes problématiques</strong> : bornes infinies, bornes finies où \(f\) n'est pas définie (sauf prolongement par continuité, qui rend la borne inoffensive).</li>
      <li>S'il y en a deux, couper en un point intérieur (Chasles) et étudier chaque morceau séparément.</li>
      <li>En chaque borne, chercher un équivalent simple de \(f\) (ou une majoration de \(|f|\) si un facteur oscille), puis comparer à une fonction de référence.</li>
      <li>Conclure : intégrable implique convergente. Pour prouver une <strong>divergence</strong>, utiliser une fonction de signe constant au voisinage de la borne, équivalente ou supérieure à une fonction non intégrable.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — quatre natures</strong>
    <ol>
      <li>\(\int_0^{+\infty} \frac{\ln(1+t)}{t^{3/2}}\,\mathrm{d}t\) (calculée au §3). En \(0^+\), \(\frac{\ln(1+t)}{t^{3/2}} \sim \frac{t}{t^{3/2}} = \frac{1}{t^{1/2}}\), intégrable (\(\frac12 \lt 1\)). En \(+\infty\), \(t^{5/4}\cdot\frac{\ln(1+t)}{t^{3/2}} = \frac{\ln(1+t)}{t^{1/4}} \to 0\), donc l'intégrande est un \(o(1/t^{5/4})\), intégrable (\(\frac54 \gt 1\)). L'intégrale converge.</li>
      <li>\(\int_0^1 \frac{\mathrm{d}t}{\mathrm{e}^t - 1}\). En \(0^+\), \(\mathrm{e}^t - 1 \sim t\), donc l'intégrande, positif, est équivalent à \(\frac1t\), non intégrable en \(0\) : l'intégrale diverge.</li>
      <li>\(\int_1^{+\infty} \frac{\sin t}{t^2}\,\mathrm{d}t\). \(\left|\frac{\sin t}{t^2}\right| \le \frac{1}{t^2}\), intégrable : l'intégrale converge absolument, donc converge.</li>
      <li>\(\int_0^{+\infty} t^3\mathrm{e}^{-t}\,\mathrm{d}t\). Pas de problème en 0 ; en \(+\infty\), \(t^2 \cdot t^3\mathrm{e}^{-t} \to 0\) : intégrable. Elle vaut \(3! = 6\) (§8).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques.</strong> (1) Croire que \(f = o(1/t)\) suffit : \(\frac{1}{t\ln t} = o\left(\frac1t\right)\) en \(+\infty\), et pourtant \(\int_2^x \frac{\mathrm{d}t}{t\ln t} = \ln(\ln x) - \ln(\ln 2) \to +\infty\) ; il faut un \(O(1/t^\alpha)\) avec \(\alpha \gt 1\). (2) Utiliser un équivalent pour une fonction qui change de signe en espérant obtenir une convergence non absolue : les critères de comparaison portent sur l'<strong>intégrabilité</strong>. (3) Oublier une borne : \(\int_0^{+\infty} \frac{\mathrm{d}t}{\sqrt t\,(1+t^2)}\) demande une étude en 0 <strong>et</strong> en \(+\infty\) (ici les deux sont favorables).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · INTÉGRATION TERME À TERME</div>
  <h2>Intégrer une somme infinie</h2>
  <div class="intro">Quand l'intégrande s'écrit comme somme d'une série de fonctions simples (série géométrique, série entière), on aimerait intégrer chaque terme puis sommer. Ce n'est pas toujours permis ; le théorème suivant donne une condition suffisante facile à vérifier. Il généralise la primitivation terme à terme des séries entières (chapitre Séries entières).</div>

  <div class="prop-box">
    <strong>Théorème d'intégration terme à terme.</strong> Soit \(I\) un intervalle et \(S : I \to \mathbb{R}\) continue. On suppose qu'il existe des fonctions \(f_n : I \to \mathbb{R}\) <strong>intégrables</strong> telles que :
    <ul>
      <li>pour tout \(t \in I\), \(S(t) = \sum_{n=0}^{+\infty} f_n(t)\) (la série converge vers \(S\) en chaque point) ;</li>
      <li>la série numérique \(\sum_n \int_I |f_n(t)|\,\mathrm{d}t\) <strong>converge</strong>.</li>
    </ul>
    Alors \(S\) est intégrable sur \(I\) et
    <div class="formula" data-nom="Intégration terme à terme">$$\int_I \sum_{n=0}^{+\infty} f_n(t)\,\mathrm{d}t = \sum_{n=0}^{+\infty} \int_I f_n(t)\,\mathrm{d}t.$$</div>
    La démonstration est hors programme.
  </div>
  <div class="method-box">
    <strong>Méthode — intégrer terme à terme</strong>
    <ol>
      <li>Développer l'intégrande en série : le plus souvent \(\frac{1}{1-q} = \sum_n q^n\) avec \(|q| \lt 1\) (par exemple \(q = \mathrm{e}^{-t}\) ou \(q = t\)), ou un développement en série entière usuel.</li>
      <li>Vérifier que chaque \(f_n\) est intégrable sur \(I\) et calculer (ou majorer) \(\int_I |f_n|\).</li>
      <li>Vérifier la convergence de \(\sum \int_I |f_n|\) : c'est l'hypothèse décisive, et la seule qui demande vraiment un argument.</li>
      <li>Conclure, puis calculer \(\sum \int_I f_n\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — \(\int_0^{+\infty} \frac{t}{\mathrm{e}^t - 1}\,\mathrm{d}t = \frac{\pi^2}{6}\)</strong>
    <ol>
      <li>\(S(t) = \frac{t}{\mathrm{e}^t - 1}\) est continue sur \(I = \,]0, +\infty[\) (et se prolonge par 1 en 0).</li>
      <li>Pour \(t \gt 0\), \(0 \lt \mathrm{e}^{-t} \lt 1\), et la série géométrique donne
      <div class="formula">$$\frac{t}{\mathrm{e}^t - 1} = \frac{t\,\mathrm{e}^{-t}}{1 - \mathrm{e}^{-t}} = \sum_{n=1}^{+\infty} t\,\mathrm{e}^{-nt}.$$</div></li>
      <li>\(f_n(t) = t\,\mathrm{e}^{-nt}\) est positive, continue et intégrable sur \(I\) (\(t^2 f_n(t) \to 0\) en \(+\infty\)). Par intégration par parties :
      <div class="formula">$$\begin{aligned} \int_0^{+\infty} t\,\mathrm{e}^{-nt}\,\mathrm{d}t &= \Big[-\frac{t\,\mathrm{e}^{-nt}}{n}\Big]_0^{+\infty} \\ &\quad + \frac1n\int_0^{+\infty} \mathrm{e}^{-nt}\,\mathrm{d}t \\ &= 0 + \frac{1}{n^2}. \end{aligned}$$</div></li>
      <li>\(\sum \int_I |f_n| = \sum \frac{1}{n^2}\) converge (Riemann). Le théorème s'applique :
      <div class="formula">$$\begin{aligned} \int_0^{+\infty} \frac{t}{\mathrm{e}^t - 1}\,\mathrm{d}t &= \sum_{n=1}^{+\infty} \frac{1}{n^2} \\ &= \frac{\pi^2}{6} \approx 1{,}645, \end{aligned}$$</div>
      la valeur de la somme (due à Euler) étant admise.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — des termes de signe alterné</strong>
    <p>Calcul de \(\int_0^1 \frac{\ln(1+t)}{t}\,\mathrm{d}t\) (faussement généralisée en 0, l'intégrande tendant vers 1).</p>
    <ol>
      <li>Sur \(I = \,]0, 1[\), le développement en série entière de \(\ln(1+t)\) donne \(\frac{\ln(1+t)}{t} = \sum_{n=0}^{+\infty} \frac{(-1)^n t^n}{n+1}\).</li>
      <li>\(f_n(t) = \frac{(-1)^n t^n}{n+1}\) est intégrable sur \(]0, 1[\) et \(\int_0^1 |f_n| = \frac{1}{(n+1)^2}\) : la série \(\sum \frac{1}{(n+1)^2}\) converge.</li>
      <li>Donc
      <div class="formula">$$\begin{aligned} \int_0^1 \frac{\ln(1+t)}{t}\,\mathrm{d}t &= \sum_{n=0}^{+\infty} \frac{(-1)^n}{(n+1)^2} \\ &= 1 - \frac14 + \frac19 - \cdots \end{aligned}$$</div>
      En séparant les termes pairs et impairs de \(\sum \frac{1}{k^2} = \frac{\pi^2}{6}\), cette somme vaut \(\frac{\pi^2}{6} - 2\cdot\frac{1}{4}\cdot\frac{\pi^2}{6} = \frac{\pi^2}{12} \approx 0{,}822\).</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Contre-exemple</span>
    <span class="prompt">Sans l'hypothèse sur \(\sum \int |f_n|\), l'interversion peut être fausse.</span>
    <div class="content"><p>Sur \([0, +\infty[\), soit \(g_n(t) = n^2 t\,\mathrm{e}^{-nt}\) (donc \(g_0 = 0\)), d'intégrale \(\int_0^{+\infty} g_n = 1\) pour \(n \ge 1\), et \(f_n = g_{n+1} - g_n\). Les sommes partielles \(\sum_{n=0}^{N} f_n = g_{N+1}\) tendent vers 0 en tout point \(t\) (croissances comparées), donc \(S = 0\) et \(\int_0^{+\infty} S = 0\). Pourtant \(\int f_0 = 1\) et \(\int f_n = 0\) pour \(n \ge 1\), d'où \(\sum \int f_n = 1 \neq 0\). Le théorème garantit donc que \(\sum \int |f_n|\) <strong>diverge</strong> ici : les « bosses » \(g_n\), d'aire 1, de plus en plus hautes et étroites (maximum \(n/\mathrm{e}\) en \(t = 1/n\)), se concentrent contre l'axe vertical : à la limite, leur aire « disparaît ».</p></div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : vérifier la convergence de \(\sum \int_I f_n\) au lieu de \(\sum \int_I |f_n|\), ou oublier de vérifier l'hypothèse. Si \(\sum \int |f_n|\) diverge, le théorème ne dit rien : il faut alors majorer directement le reste \(\left|\int_I \sum_{n \gt N} f_n\right|\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DEUX INTÉGRALES CÉLÈBRES : GAUSS ET Γ</div>
  <h2>L'intégrale de Gauss et la fonction Gamma</h2>
  <div class="intro">Ces deux intégrales reviennent en probabilités, en physique statistique et dans les calculs d'intégrales. On établit ici leur convergence et leurs premières propriétés ; leur régularité et la valeur de l'intégrale de Gauss font l'objet du chapitre Intégrales à paramètre.</div>

  <h3>Intégrale de Gauss</h3>
  <div class="prop-box">
    <strong>Intégrale de Gauss.</strong> L'intégrale \(\int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t\) converge (§1) et
    <div class="formula" data-nom="Intégrale de Gauss">$$\begin{aligned} \int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t &= \frac{\sqrt{\pi}}{2}, \\ \int_{-\infty}^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t &= \sqrt{\pi}. \end{aligned}$$</div>
    La valeur est admise ici et démontrée dans le chapitre Intégrales à paramètre.
  </div>
  <div class="method-box">
    <strong>Exemple — trois conséquences</strong>
    <ol>
      <li>Pour \(a \gt 0\), le changement de variable \(t = u/\sqrt a\) donne \(\int_0^{+\infty} \mathrm{e}^{-a t^2}\,\mathrm{d}t = \frac12\sqrt{\frac{\pi}{a}}\).</li>
      <li>Avec \(a = \frac12\) et la parité : \(\int_{-\infty}^{+\infty} \mathrm{e}^{-t^2/2}\,\mathrm{d}t = \sqrt{2\pi}\), la constante qui normalise la courbe en cloche des statistiques.</li>
      <li>Intégration par parties (crochet \(-\frac{t}{2}\mathrm{e}^{-t^2}\) nul aux deux bornes) :
      <div class="formula">$$\begin{aligned} \int_0^{+\infty} t^2\,\mathrm{e}^{-t^2}\,\mathrm{d}t &= \Big[-\frac{t}{2}\,\mathrm{e}^{-t^2}\Big]_0^{+\infty} \\ &\quad + \frac12\int_0^{+\infty} \mathrm{e}^{-t^2}\,\mathrm{d}t \\ &= \frac{\sqrt\pi}{4}. \end{aligned}$$</div></li>
    </ol>
  </div>

  <h3>Fonction Γ</h3>
  <div class="def-box">
    La <strong>fonction Gamma</strong> est définie par \(\Gamma(x) = \displaystyle\int_0^{+\infty} t^{x-1}\,\mathrm{e}^{-t}\,\mathrm{d}t\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> L'intégrale converge si et seulement si \(x \gt 0\). Sur \(]0, +\infty[\) :
    <div class="formula" data-nom="Fonction Gamma">$$\begin{aligned} \Gamma(x+1) &= x\,\Gamma(x), \\ \Gamma(n+1) &= n! \quad (\text{donc } \Gamma(1) = 1), \\ \Gamma\!\left(\tfrac12\right) &= \sqrt{\pi}. \end{aligned}$$</div>
    Γ prolonge donc la factorielle aux réels strictement positifs.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux bornes à étudier, une intégration par parties, un changement de variable.</span>
    <div class="content">
    <ul>
      <li>Domaine. L'intégrande est continu et positif sur \(]0, +\infty[\). En \(+\infty\), \(t^2 \cdot t^{x-1}\mathrm{e}^{-t} \to 0\) : intégrable pour tout \(x\). En \(0^+\), \(t^{x-1}\mathrm{e}^{-t} \sim t^{x-1} = \frac{1}{t^{1-x}}\), intégrable si et seulement si \(1 - x \lt 1\), soit \(x \gt 0\) (fonctions positives équivalentes).</li>
      <li>Relation fonctionnelle. Pour \(x \gt 0\), on intègre par parties en dérivant \(t^x\) et en primitivant \(\mathrm{e}^{-t}\) : le crochet \(-t^x\mathrm{e}^{-t}\) tend vers 0 en \(0^+\) (car \(x \gt 0\)) et en \(+\infty\), donc
      <div class="formula">$$\begin{aligned} \Gamma(x+1) &= \int_0^{+\infty} x\,t^{x-1}\mathrm{e}^{-t}\,\mathrm{d}t \\ &= x\,\Gamma(x). \end{aligned}$$</div></li>
      <li>Factorielle. \(\Gamma(1) = \int_0^{+\infty} \mathrm{e}^{-t}\,\mathrm{d}t = 1\), puis \(\Gamma(n+1) = n\,\Gamma(n) = \cdots = n!\) par récurrence.</li>
      <li>Valeur en \(\frac12\). Avec \(t = u^2\), \(u \gt 0\), \(\mathrm{d}t = 2u\,\mathrm{d}u\) :
      <div class="formula">$$\begin{aligned} \Gamma\left(\tfrac12\right) &= \int_0^{+\infty} \frac{\mathrm{e}^{-u^2}}{u}\,2u\,\mathrm{d}u \\ &= 2\int_0^{+\infty} \mathrm{e}^{-u^2}\,\mathrm{d}u = \sqrt{\pi}. \end{aligned}$$</div></li>
    </ul></div>
  </div>

  <div class="method-box">
    <strong>Exemple — calculer avec Γ</strong>
    <ol>
      <li>\(\int_0^{+\infty} t^3\,\mathrm{e}^{-2t}\,\mathrm{d}t\) : avec \(u = 2t\), elle vaut \(\int_0^{+\infty} \frac{u^3}{8}\,\mathrm{e}^{-u}\,\frac{\mathrm{d}u}{2} = \frac{\Gamma(4)}{16} = \frac{6}{16} = \frac38\).</li>
      <li>\(\int_0^{+\infty} \sqrt t\,\mathrm{e}^{-t}\,\mathrm{d}t = \Gamma\left(\frac32\right)\), et la relation fonctionnelle donne \(\Gamma\left(\frac32\right) = \frac12\,\Gamma\left(\frac12\right) = \frac{\sqrt\pi}{2} \approx 0{,}886\).</li>
    </ol>
  </div>
  <p>La continuité de Γ, sa dérivabilité (et même sa classe \(\mathcal{C}^\infty\)), sa convexité et son équivalent en \(0^+\) sont établis dans le chapitre Intégrales à paramètre.</p>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Prolongements, à titre culturel</h2>
  <ul>
    <li><strong>Intégrales semi-convergentes.</strong> \(\int_1^{+\infty} \frac{\sin t}{t}\,\mathrm{d}t\) converge : une intégration par parties donne \(\cos 1 - \int_1^{+\infty} \frac{\cos t}{t^2}\,\mathrm{d}t\), et la dernière intégrale converge absolument. Mais elle ne converge pas absolument, car \(|\sin t| \ge \sin^2 t = \frac{1 - \cos 2t}{2}\) et \(\int_1^{+\infty} \frac{\mathrm{d}t}{2t}\) diverge. Sa valeur sur \(]0, +\infty[\) est \(\frac{\pi}{2}\) (intégrale de Dirichlet).</li>
    <li><strong>Théorème de convergence dominée.</strong> Si des fonctions \(f_n\) continues convergent en tout point vers une fonction continue \(f\) et si \(|f_n| \le \varphi\) avec \(\varphi\) intégrable indépendante de \(n\), alors \(\int_I f_n \to \int_I f\). C'est l'outil qui démontre les théorèmes sur les intégrales à paramètre.</li>
    <li><strong>Intégrales de Bertrand.</strong> \(\int_2^{+\infty} \frac{\mathrm{d}t}{t^\alpha(\ln t)^\beta}\) converge si et seulement si \(\alpha \gt 1\), ou \(\alpha = 1\) et \(\beta \gt 1\) : elles affinent l'échelle de Riemann à la frontière \(\alpha = 1\).</li>
    <li><strong>Intégrale de Lebesgue.</strong> La notation \(L^1\) vient de la théorie de Lebesgue, où l'on intègre des fonctions bien plus générales que les fonctions continues et où « intégrable » signifie toujours \(\int |f| \lt +\infty\).</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · INTÉGRALES GÉNÉRALISÉES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Décider si une intégrale généralisée converge, presque toujours sans la calculer, puis la calculer quand c'est possible : primitive, intégration par parties, changement de variable, intégration terme à terme, fonction Γ.</div>

  <div class="method-box"><strong>Méthode 1 — Calculer une intégrale généralisée avec une primitive</strong>
    <ol style="margin-top:.4rem">
      <li>Repérer la borne problématique et intégrer sur un segment : \([a, x]\) si le problème est en \(b\), \([x, b]\) s'il est en \(a\).</li>
      <li>Calculer \(\int_a^x f\) avec une primitive \(G\), puis la limite quand \(x \to b^-\) (ou \(x \to a^+\)).</li>
      <li>Limite finie : l'intégrale converge et vaut cette limite, notée \(\big[G\big]_a^{b}\). Sinon, elle diverge.</li>
      <li>Deux bornes problématiques : couper en un point \(c\) et faire les deux passages à la limite séparément.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\frac{1}{t(t+1)} = \frac1t - \frac{1}{t+1}\), et une primitive est \(\ln\frac{t}{t+1}\), de limite 0 en \(+\infty\) : \(\int_1^{+\infty} \frac{\mathrm{d}t}{t(t+1)} = 0 - \ln\frac12 = \ln 2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dans l'exemple, écrire \(\int_1^{+\infty} \frac{\mathrm{d}t}{t} - \int_1^{+\infty}\frac{\mathrm{d}t}{t+1}\) n'a pas de sens : les deux intégrales divergent. On garde la primitive groupée \(\ln\frac{t}{t+1}\) jusqu'au passage à la limite.</div>

  <div class="method-box"><strong>Méthode 2 — Étudier la nature d'une intégrale</strong>
    <ol style="margin-top:.4rem">
      <li>Déterminer l'intervalle où l'intégrande est continu ; lister les bornes problématiques (infinies, ou finies sans prolongement par continuité).</li>
      <li>Une borne finie où \(f\) a une limite finie est inoffensive (intégrale faussement généralisée).</li>
      <li>Deux bornes problématiques : couper en un point intérieur et étudier chaque morceau.</li>
      <li>En chaque borne, trouver un équivalent simple de \(|f|\), ou une majoration, et comparer à une fonction de référence (Riemann en \(+\infty\) : \(\alpha \gt 1\) ; en \(0^+\) : \(\alpha \lt 1\) ; \(\mathrm{e}^{-\alpha t}\), \(\ln\) en \(0^+\)).</li>
      <li>Conclure : intégrable en chaque borne, donc convergente.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\int_0^{+\infty} \frac{1 - \cos t}{t^{5/2}}\,\mathrm{d}t\). En \(0^+\), \(1 - \cos t \sim \frac{t^2}{2}\), donc l'intégrande (positif) est équivalent à \(\frac{1}{2\sqrt t}\), intégrable (\(\alpha = \frac12\)). En \(+\infty\), \(0 \le \frac{1 - \cos t}{t^{5/2}} \le \frac{2}{t^{5/2}}\), intégrable (\(\alpha = \frac52\)). L'intégrale converge (elle vaut environ 1,67).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : faire tendre les deux bornes ensemble. \(\int_{-x}^{x} \frac{t}{1+t^2}\,\mathrm{d}t = 0\) pour tout \(x\), mais \(\int_{-\infty}^{+\infty} \frac{t}{1+t^2}\,\mathrm{d}t\) diverge, car \(\int_0^{+\infty}\frac{t}{1+t^2}\,\mathrm{d}t\) diverge (intégrande équivalent à \(\frac1t\)).</div>

  <div class="method-box"><strong>Méthode 3 — Conclure par la règle « \(t^\alpha f(t)\) »</strong>
    <ol style="margin-top:.4rem">
      <li>Quand un logarithme ou une exponentielle empêche de trouver un équivalent simple, multiplier \(f\) par une puissance \(t^\alpha\) bien choisie.</li>
      <li>En \(+\infty\) : si \(t^\alpha f(t) \to 0\) (ou reste borné) avec \(\alpha \gt 1\), alors \(f = O(1/t^\alpha)\) est intégrable. Le choix \(\alpha = 2\) suffit dès qu'une exponentielle décroissante est présente.</li>
      <li>En \(0^+\) : si \(t^\alpha f(t)\) est bornée avec \(\alpha \lt 1\), \(f\) est intégrable (souvent \(\alpha = \frac12\) face à un logarithme).</li>
      <li>Justifier la limite par les croissances comparées.</li>
    </ol>
    <p><em>Exemple éclair :</em> en \(+\infty\), \(t^{3/2}\cdot\frac{(\ln t)^3}{t^2} = \frac{(\ln t)^3}{\sqrt t} \to 0\) : \(\int_1^{+\infty} \frac{(\ln t)^3}{t^2}\,\mathrm{d}t\) converge. Avec \(t = \mathrm{e}^u\), elle vaut \(\int_0^{+\infty} u^3\mathrm{e}^{-u}\,\mathrm{d}u = \Gamma(4) = 6\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(f = o(1/t)\) en \(+\infty\) ne suffit pas : \(\frac{1}{t\ln t} = o\big(\frac1t\big)\) n'est pas intégrable sur \([2, +\infty[\) (une primitive est \(\ln(\ln t)\)). Il faut un exposant \(\alpha\) strictement supérieur à 1.</div>

  <div class="method-box"><strong>Méthode 4 — Prouver qu'une intégrale diverge</strong>
    <ol style="margin-top:.4rem">
      <li>Se placer au voisinage de la borne où l'intégrande garde un <strong>signe constant</strong> (quitte à changer \(f\) en \(-f\)).</li>
      <li>Minorer \(f\) par une fonction positive non intégrable, ou trouver un équivalent positif non intégrable : par comparaison, l'intégrale diverge.</li>
      <li>En \(+\infty\), une limite \(\ell \neq 0\) de l'intégrande suffit à conclure à la divergence.</li>
      <li>Une seule borne divergente rend toute l'intégrale divergente.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(t \ge 2\), \(0 \lt \ln t \le t\), donc \(\frac{1}{\ln t} \ge \frac1t\) : \(\int_2^{+\infty} \frac{\mathrm{d}t}{\ln t}\) diverge. De même \(\int_0^{\pi/2} \frac{\mathrm{d}t}{\sin t}\) diverge, car \(\frac{1}{\sin t} \sim \frac1t\) en \(0^+\), avec un intégrande positif.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Traiter une fonction de signe variable ou complexe</strong>
    <ol style="margin-top:.4rem">
      <li>Étudier \(|f|\), positive : majorer les facteurs oscillants (\(|\cos|\), \(|\sin|\), \(|\mathrm{e}^{i\omega t}|\)) par 1.</li>
      <li>Montrer que le majorant est intégrable : \(f\) est intégrable, donc son intégrale converge, et \(\left|\int_I f\right| \le \int_I |f|\).</li>
      <li>Pour une fonction complexe, calculer \(\int_I f\), puis prendre parties réelle et imaginaire (linéarité).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(|\cos t\,\mathrm{e}^{-\sqrt t}| \le \mathrm{e}^{-\sqrt t}\) et \(t^2\mathrm{e}^{-\sqrt t} \to 0\) en \(+\infty\) : \(\int_0^{+\infty} \cos t\,\mathrm{e}^{-\sqrt t}\,\mathrm{d}t\) converge absolument, et sa valeur absolue est au plus \(\int_0^{+\infty}\mathrm{e}^{-\sqrt t}\,\mathrm{d}t = 2\) (méthode 7).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : les critères \(O\), \(o\), \(\sim\) portent sur l'intégrabilité. Pour une fonction qui change de signe sans cesse au voisinage de la borne (\(\frac{\sin t}{\sqrt t}\) en \(+\infty\)), aucun équivalent ne permet de conclure à une convergence non absolue : l'étude de ces intégrales semi-convergentes est hors programme.</div>

  <div class="method-box"><strong>Méthode 6 — Intégrer par parties sur un intervalle quelconque</strong>
    <ol style="margin-top:.4rem">
      <li>Choisir \(f\) (à dériver) et \(g'\) (à primitiver), en prenant la primitive \(g\) qui rend le crochet fini : souvent celle qui s'annule à la borne singulière.</li>
      <li>Vérifier que \(fg\) a une limite finie à chaque borne : les intégrales de \(fg'\) et \(f'g\) sont alors de même nature.</li>
      <li>Étudier la plus simple des deux, puis écrire \(\int_a^b fg' = \big[fg\big]_a^b - \int_a^b f'g\).</li>
      <li>En cas de doute, intégrer par parties sur un segment \([x, y]\) et ne passer à la limite qu'à la fin.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\int_0^1 t\ln t\,\mathrm{d}t\) : avec \(g(t) = \frac{t^2}{2}\), le crochet \(\frac{t^2}{2}\ln t\) tend vers 0 en \(0^+\) et vaut 0 en 1, donc l'intégrale vaut \(-\int_0^1 \frac t2\,\mathrm{d}t = -\frac14\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Changer de variable dans une intégrale généralisée</strong>
    <ol style="margin-top:.4rem">
      <li>Poser \(t = \varphi(u)\) avec \(\varphi\) bijective, de classe \(\mathcal{C}^1\) et strictement monotone entre les intervalles ouverts (\(t = \lambda u + \mu\), \(t = u^2\), \(t = \mathrm{e}^u\), \(t = 1/u\) : sans vérification).</li>
      <li>Remplacer \(\mathrm{d}t\) par \(\varphi'(u)\,\mathrm{d}u\) et les bornes par leurs antécédents ; si \(\varphi\) décroît, les bornes s'échangent.</li>
      <li>Les deux intégrales sont de même nature : on peut étudier la nouvelle, souvent plus simple (singularité supprimée, forme de Γ ou de Gauss).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(t = u^2\), \(u \in \,]0, +\infty[\), \(\mathrm{d}t = 2u\,\mathrm{d}u\) : \(\int_0^{+\infty} \mathrm{e}^{-\sqrt t}\,\mathrm{d}t = \int_0^{+\infty} 2u\,\mathrm{e}^{-u}\,\mathrm{d}u = 2\,\Gamma(2) = 2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Intégrer une série terme à terme</strong>
    <ol style="margin-top:.4rem">
      <li>Développer l'intégrande \(S(t)\) en série de fonctions \(\sum f_n(t)\), convergente en tout point de \(I\) : série géométrique (\(q = \mathrm{e}^{-t}\), \(q = t\), \(q = -t\)…) ou développement en série entière usuel.</li>
      <li>Vérifier que chaque \(f_n\) est intégrable sur \(I\) et calculer \(\int_I |f_n|\) (souvent par intégration par parties ou avec Γ).</li>
      <li>Vérifier la convergence de la série numérique \(\sum \int_I |f_n|\) : c'est l'hypothèse décisive.</li>
      <li>Conclure : \(S\) est intégrable et \(\int_I S = \sum_n \int_I f_n\) ; calculer la somme.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \(]0, 1[\), \(-\frac{\ln(1-t)}{t} = \sum_{n \ge 1} \frac{t^{n-1}}{n}\) ; les \(f_n\) sont positives et \(\int_0^1 f_n = \frac{1}{n^2}\), série convergente. Donc \(\int_0^1 -\frac{\ln(1-t)}{t}\,\mathrm{d}t = \sum_{n\ge1}\frac{1}{n^2} = \frac{\pi^2}{6}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : vérifier \(\sum \int_I f_n\) au lieu de \(\sum \int_I |f_n|\). Quand les \(f_n\) changent de signe (série alternée), c'est bien la série des intégrales des valeurs absolues qu'il faut faire converger.</div>

  <div class="method-box"><strong>Méthode 9 — Calculer avec la fonction Γ et l'intégrale de Gauss</strong>
    <ol style="margin-top:.4rem">
      <li>Ramener l'intégrale à la forme \(\int_0^{+\infty} u^{x-1}\mathrm{e}^{-u}\,\mathrm{d}u = \Gamma(x)\) par un changement de variable (\(u = ct\), \(u = t^2\)…).</li>
      <li>Utiliser \(\Gamma(x+1) = x\,\Gamma(x)\), \(\Gamma(n+1) = n!\) et \(\Gamma\big(\frac12\big) = \sqrt\pi\).</li>
      <li>Pour une gaussienne : \(\int_0^{+\infty} \mathrm{e}^{-at^2}\,\mathrm{d}t = \frac12\sqrt{\frac{\pi}{a}}\) (\(a \gt 0\)) ; parité pour les intégrales sur \(\mathbb{R}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(u = t^2\), \(t = \sqrt u\), \(\mathrm{d}t = \frac{\mathrm{d}u}{2\sqrt u}\) :</p>
    <div class="formula">$$\int_0^{+\infty} t^4\mathrm{e}^{-t^2}\,\mathrm{d}t = \frac12\int_0^{+\infty} u^{3/2}\mathrm{e}^{-u}\,\mathrm{d}u = \frac12\,\Gamma\Big(\frac52\Big) = \frac{3\sqrt\pi}{8} \approx 0{,}665.$$</div>
  </div>
</div>
</template>

  <h3>Nature par les intégrales de Riemann</h3>
  <div class="statement">Étudier la convergence de chaque intégrale et donner sa valeur quand elle converge.</div>

  <div class="solution"><h4>Correction</h4>

    <p><strong>Q2.</strong> \(\alpha = \frac12 \le 1\) en \(+\infty\) : diverge (\(\int_1^x \frac{\mathrm{d}t}{\sqrt t} = 2\sqrt x - 2 \to +\infty\)).</p>
    <p><strong>Q3.</strong> \(\alpha = \frac12 \lt 1\) en \(0^+\) : converge, et \(\int_x^1 \frac{\mathrm{d}t}{\sqrt t} = 2 - 2\sqrt x \to 2\).</p>
    <p><strong>Q4.</strong> Seule la borne 5 pose problème. La translation \(s = 5 - t\) ramène à \(\int_0^3 \frac{\mathrm{d}s}{s^{2/3}}\), intégrable en \(0^+\) (\(\alpha = \frac23 \lt 1\)) : l'intégrale converge et vaut \(\big[3s^{1/3}\big]_0^3 = 3^{4/3} \approx 4{,}33\).</p>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Équivalent, puis calcul exact</h3>
  <div class="statement">On considère \(\displaystyle I = \int_1^{+\infty} \frac{t+1}{t^3 + t}\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(I\) converge.</div>
  <div class="q"><strong>Q2.</strong> Décomposer \(\dfrac{t+1}{t(t^2+1)}\) en éléments simples et calculer \(I\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu et positif sur \([1, +\infty[\). En \(+\infty\), \(\frac{t+1}{t^3+t} \sim \frac{t}{t^3} = \frac{1}{t^2}\), intégrable (\(\alpha = 2 \gt 1\)) : \(I\) converge.</p>
    <p><strong>Q2.</strong> On cherche \(\frac{t+1}{t(t^2+1)} = \frac{a}{t} + \frac{bt + c}{t^2+1}\). En multipliant par \(t\) et en faisant \(t = 0\), \(a = 1\) ; puis \(t + 1 = (t^2 + 1) + (bt + c)t\) impose \(b = -1\), \(c = 1\). Une primitive est donc</p>
    <div class="formula">$$G(t) = \ln t - \frac12\ln(t^2 + 1) + \arctan t = \ln\frac{t}{\sqrt{t^2+1}} + \arctan t.$$</div>
    <p>En \(+\infty\), \(\frac{t}{\sqrt{t^2+1}} \to 1\), donc \(G(t) \to \frac{\pi}{2}\) ; et \(G(1) = -\frac{\ln 2}{2} + \frac{\pi}{4}\). Ainsi \(I = \frac{\pi}{4} + \frac{\ln 2}{2} \approx 1{,}132\). On a gardé les logarithmes groupés : séparément, \(\int_1^{+\infty} \frac{\mathrm{d}t}{t}\) et \(\int_1^{+\infty} \frac{t\,\mathrm{d}t}{t^2+1}\) divergent.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Intégrales de l'exponentielle</h3>
  <div class="statement">Soit \(\lambda\) un réel.</div>
  <div class="q"><strong>Q1.</strong> Pour \(\lambda \gt 0\), calculer \(\displaystyle\int_0^{+\infty} \mathrm{e}^{-\lambda t}\,\mathrm{d}t\). Que se passe-t-il si \(\lambda \le 0\) ?</div>
  <div class="q"><strong>Q2.</strong> Pour \(\lambda \gt 0\), calculer \(\displaystyle\int_0^{+\infty} t\,\mathrm{e}^{-\lambda t}\,\mathrm{d}t\) par une intégration par parties.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(\lambda \gt 0\) :</p>
    <div class="formula">$$\int_0^x \mathrm{e}^{-\lambda t}\,\mathrm{d}t = \frac{1 - \mathrm{e}^{-\lambda x}}{\lambda} \xrightarrow[x\to+\infty]{} \frac{1}{\lambda}.$$</div>
    <p>Si \(\lambda \le 0\), \(\mathrm{e}^{-\lambda t} \ge 1\) ne tend pas vers 0, et \(\int_0^x \mathrm{e}^{-\lambda t}\,\mathrm{d}t \ge x \to +\infty\) : divergence.</p>
    <p><strong>Q2.</strong> On dérive \(t\) et on primitive \(\mathrm{e}^{-\lambda t}\) en \(-\frac{1}{\lambda}\mathrm{e}^{-\lambda t}\). Le crochet \(-\frac{t}{\lambda}\mathrm{e}^{-\lambda t}\) est nul en 0 et tend vers 0 en \(+\infty\) (croissances comparées) : les deux intégrales sont de même nature et</p>
    <div class="formula">$$\int_0^{+\infty} t\,\mathrm{e}^{-\lambda t}\,\mathrm{d}t = 0 + \frac{1}{\lambda}\int_0^{+\infty} \mathrm{e}^{-\lambda t}\,\mathrm{d}t = \frac{1}{\lambda^2}.$$</div>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Quatre natures, deux bornes à surveiller</h3>
  <div class="statement">Déterminer la nature de chacune des intégrales suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\int_0^{+\infty} \frac{\mathrm{d}t}{\sqrt t + t^2}\).</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\int_0^1 \frac{\mathrm{d}t}{1 - \sqrt t}\).</div>
  <div class="q"><strong>Q3.</strong> \(\displaystyle\int_0^{+\infty} \frac{\sin t}{t^{3/2}}\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q4.</strong> \(\displaystyle\int_0^1 \frac{\ln t}{\sqrt{1 - t}}\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Intégrande continu et positif sur \(]0, +\infty[\), deux bornes à étudier. En \(0^+\), \(\sqrt t + t^2 \sim \sqrt t\), donc l'intégrande est équivalent à \(\frac{1}{t^{1/2}}\), intégrable. En \(+\infty\), il est équivalent à \(\frac{1}{t^2}\), intégrable. Converge (valeur numérique 2,42 environ).</p>
    <p><strong>Q2.</strong> Pas de problème en 0 (l'intégrande vaut 1). En \(1^-\), \(1 - \sqrt t = \frac{1 - t}{1 + \sqrt t} \sim \frac{1-t}{2}\), donc l'intégrande, positif, est équivalent à \(\frac{2}{1-t}\), non intégrable en 1 (\(\alpha = 1\), après la translation \(s = 1 - t\)). Diverge.</p>
    <p><strong>Q3.</strong> En \(0^+\), \(\frac{\sin t}{t^{3/2}} \sim \frac{t}{t^{3/2}} = \frac{1}{t^{1/2}}\) (positif près de 0), intégrable. En \(+\infty\), \(\left|\frac{\sin t}{t^{3/2}}\right| \le \frac{1}{t^{3/2}}\), intégrable (\(\alpha = \frac32\)). L'intégrale converge absolument, donc converge, alors que l'intégrande change de signe une infinité de fois.</p>
    <p><strong>Q4.</strong> En \(0^+\), \(\frac{\ln t}{\sqrt{1 - t}} \sim \ln t\), de signe constant et intégrable en \(0^+\). En \(1^-\), \(\ln t \sim t - 1\), donc l'intégrande est équivalent à \(-\frac{1-t}{\sqrt{1-t}} = -\sqrt{1-t} \to 0\) : il se prolonge par continuité en 1. Converge (elle vaut \(4\ln 2 - 4 \approx -1{,}23\)).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Intégration par parties et changements de variable</h3>
  <div class="statement">Justifier la convergence puis calculer les intégrales suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(A = \displaystyle\int_0^1 \frac{\ln t}{\sqrt t}\,\mathrm{d}t\) (intégration par parties).</div>
  <div class="q"><strong>Q2.</strong> \(B = \displaystyle\int_1^{+\infty} \frac{\mathrm{d}t}{t\sqrt{t-1}}\) (poser \(u = \sqrt{t - 1}\)).</div>
  <div class="q"><strong>Q3.</strong> \(C = \displaystyle\int_0^{+\infty} \frac{\mathrm{d}t}{\mathrm{e}^t + \mathrm{e}^{-t}}\) (poser \(u = \mathrm{e}^t\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On dérive \(\ln t\) et on primitive \(t^{-1/2}\) en \(2\sqrt t\) (primitive nulle en 0). Le crochet \(2\sqrt t\ln t\) tend vers 0 en \(0^+\) (croissances comparées) et vaut 0 en 1 : \(A\) a la nature de \(\int_0^1 \frac{2\sqrt t}{t}\,\mathrm{d}t = \int_0^1 \frac{2}{\sqrt t}\,\mathrm{d}t\), qui converge et vaut 4. Donc \(A = 0 - 4 = -4\).</p>
    <p><strong>Q2.</strong> Convergence : en \(1^+\), l'intégrande est équivalent à \(\frac{1}{\sqrt{t-1}}\), intégrable (translation, \(\alpha = \frac12\)) ; en \(+\infty\), à \(\frac{1}{t^{3/2}}\), intégrable. Avec \(t = 1 + u^2\), \(u \in \,]0, +\infty[\) (bijection croissante de classe \(\mathcal{C}^1\)), \(\mathrm{d}t = 2u\,\mathrm{d}u\) et \(\sqrt{t - 1} = u\) :</p>
    <div class="formula">$$B = \int_0^{+\infty} \frac{2u\,\mathrm{d}u}{(1 + u^2)\,u} = 2\int_0^{+\infty}\frac{\mathrm{d}u}{1+u^2} = \pi.$$</div>
    <p><strong>Q3.</strong> L'intégrande est positif et majoré par \(\mathrm{e}^{-t}\) : \(C\) converge. Avec \(u = \mathrm{e}^t\), \(t = \ln u\), \(\mathrm{d}t = \frac{\mathrm{d}u}{u}\), et \(u\) décrit \(]1, +\infty[\) :</p>
    <div class="formula">$$C = \int_1^{+\infty} \frac{1}{u + 1/u}\cdot\frac{\mathrm{d}u}{u} = \int_1^{+\infty}\frac{\mathrm{d}u}{u^2 + 1} = \frac{\pi}{2} - \frac{\pi}{4} = \frac{\pi}{4}.$$</div>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Calculer avec la fonction Γ</h3>
  <div class="statement">On rappelle que \(\Gamma(x) = \int_0^{+\infty} t^{x-1}\mathrm{e}^{-t}\,\mathrm{d}t\) pour \(x \gt 0\), que \(\Gamma(x+1) = x\,\Gamma(x)\) et que \(\Gamma\big(\frac12\big) = \sqrt\pi\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\displaystyle\int_0^{+\infty} t^5\,\mathrm{e}^{-t^2}\,\mathrm{d}t\) et \(\displaystyle\int_0^{+\infty} \sqrt t\,\mathrm{e}^{-3t}\,\mathrm{d}t\).</div>
  <div class="q"><strong>Q2.</strong> Montrer par récurrence que \(\Gamma\big(n + \frac12\big) = \dfrac{(2n)!}{4^n\,n!}\sqrt\pi\) pour tout \(n \in \mathbb{N}\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\displaystyle\int_{-\infty}^{+\infty} t^2\,\mathrm{e}^{-t^2/2}\,\mathrm{d}t = \sqrt{2\pi}\) (c'est la variance de la loi normale centrée réduite).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(u = t^2\), \(\mathrm{d}t = \frac{\mathrm{d}u}{2\sqrt u}\) :</p>
    <div class="formula">$$\int_0^{+\infty} t^5\mathrm{e}^{-t^2}\,\mathrm{d}t = \frac12\int_0^{+\infty} u^2\mathrm{e}^{-u}\,\mathrm{d}u = \frac12\,\Gamma(3) = 1.$$</div>
    <p>Avec \(u = 3t\) :</p>
    <div class="formula">$$\int_0^{+\infty} \sqrt t\,\mathrm{e}^{-3t}\,\mathrm{d}t = \frac{1}{3^{3/2}}\int_0^{+\infty} u^{1/2}\mathrm{e}^{-u}\,\mathrm{d}u = \frac{\Gamma(3/2)}{3\sqrt3} = \frac{\sqrt\pi}{6\sqrt3} \approx 0{,}171.$$</div>
    <p><strong>Q2.</strong> Pour \(n = 0\), la formule donne \(\sqrt\pi = \Gamma\big(\frac12\big)\). Si elle est vraie au rang \(n\), la relation fonctionnelle donne</p>
    <div class="formula">$$\begin{aligned} \Gamma\Big(n + \frac32\Big) &= \Big(n + \frac12\Big)\Gamma\Big(n + \frac12\Big) = \frac{2n+1}{2}\cdot\frac{(2n)!}{4^n\,n!}\sqrt\pi \\ &= \frac{(2n+2)(2n+1)(2n)!}{4 \times 4^n\,(n+1)\,n!}\sqrt\pi = \frac{(2n+2)!}{4^{n+1}(n+1)!}\sqrt\pi, \end{aligned}$$</div>
    <p>en multipliant numérateur et dénominateur par \(2(n+1)\). Exemple : \(\Gamma\big(\frac52\big) = \frac{24}{16 \times 2}\sqrt\pi = \frac34\sqrt\pi\).</p>
    <p><strong>Q3.</strong> L'intégrande est pair et intégrable (\(t^2 \cdot t^2\mathrm{e}^{-t^2/2} \to 0\)). Avec \(u = \frac{t^2}{2}\) sur \(]0, +\infty[\), \(t = \sqrt{2u}\), \(\mathrm{d}t = \frac{\mathrm{d}u}{\sqrt{2u}}\) :</p>
    <div class="formula">$$\int_{-\infty}^{+\infty} t^2\mathrm{e}^{-t^2/2}\,\mathrm{d}t = 2\int_0^{+\infty} 2u\,\mathrm{e}^{-u}\,\frac{\mathrm{d}u}{\sqrt{2u}} = 2\sqrt2\;\Gamma\Big(\frac32\Big) = \sqrt{2\pi}.$$</div>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Intégration terme à terme d'une série alternée</h3>
  <div class="statement">On considère \(\displaystyle I = \int_0^{+\infty} \frac{t}{\mathrm{e}^t + 1}\,\mathrm{d}t\). On admet que \(\sum_{n=1}^{+\infty} \frac{1}{n^2} = \frac{\pi^2}{6}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(I\) converge.</div>
  <div class="q"><strong>Q2.</strong> Montrer que, pour \(t \gt 0\), \(\dfrac{t}{\mathrm{e}^t + 1} = \displaystyle\sum_{n=1}^{+\infty} (-1)^{n+1}\,t\,\mathrm{e}^{-nt}\).</div>
  <div class="q"><strong>Q3.</strong> Justifier l'intégration terme à terme et en déduire \(I\) sous forme de série.</div>
  <div class="q"><strong>Q4.</strong> Calculer \(\sum_{n\ge1} \frac{(-1)^{n+1}}{n^2}\) et conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu et positif sur \([0, +\infty[\) (nul en 0) et \(t^2 \cdot \frac{t}{\mathrm{e}^t + 1} \le t^3\mathrm{e}^{-t} \to 0\) : il est intégrable en \(+\infty\).</p>
    <p><strong>Q2.</strong> Pour \(t \gt 0\), \(q = -\mathrm{e}^{-t}\) vérifie \(|q| \lt 1\), donc \(\frac{t}{\mathrm{e}^t + 1} = \frac{t\,\mathrm{e}^{-t}}{1 + \mathrm{e}^{-t}} = t\,\mathrm{e}^{-t}\sum_{k\ge0}(-1)^k\mathrm{e}^{-kt}\), soit la formule annoncée avec \(n = k + 1\).</p>
    <p><strong>Q3.</strong> Sur \(]0, +\infty[\), \(f_n(t) = (-1)^{n+1}t\,\mathrm{e}^{-nt}\) est continue et intégrable, et \(\int_0^{+\infty} |f_n| = \int_0^{+\infty} t\,\mathrm{e}^{-nt}\,\mathrm{d}t = \frac{1}{n^2}\) (EXO 03 avec \(\lambda = n\)). La série \(\sum \frac{1}{n^2}\) converge : le théorème d'intégration terme à terme s'applique, et</p>
    <div class="formula">$$I = \sum_{n=1}^{+\infty}\int_0^{+\infty} f_n = \sum_{n=1}^{+\infty}\frac{(-1)^{n+1}}{n^2}.$$</div>
    <p><strong>Q4.</strong> Les termes d'indice pair forment \(\sum_{p\ge1}\frac{1}{4p^2} = \frac14\cdot\frac{\pi^2}{6}\). La somme alternée vaut donc \(\frac{\pi^2}{6} - 2 \times \frac{\pi^2}{24} = \frac{\pi^2}{12}\), et \(I = \frac{\pi^2}{12} \approx 0{,}822\). Remarque : c'est la série des \(\int|f_n|\) qu'on fait converger, pas celle des \(\int f_n\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Une intégrale qui vaut \(-\pi^2/6\)</h3>
  <div class="statement">On considère \(\displaystyle K = \int_0^1 \frac{\ln t}{1 - t}\,\mathrm{d}t\), et on admet \(\sum_{n\ge1}\frac{1}{n^2} = \frac{\pi^2}{6}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(K\) converge.</div>
  <div class="q"><strong>Q2.</strong> Pour \(n \in \mathbb{N}\), montrer que \(\displaystyle\int_0^1 t^n\ln t\,\mathrm{d}t = -\frac{1}{(n+1)^2}\).</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(K = -\dfrac{\pi^2}{6}\).</div>
  <div class="q"><strong>Q4.</strong> Par la même méthode, calculer \(\displaystyle\int_0^1 \frac{\ln t}{1 + t}\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu et négatif sur \(]0, 1[\). En \(0^+\), il est équivalent à \(\ln t\), intégrable en \(0^+\). En \(1^-\), \(\ln t \sim t - 1\), donc \(\frac{\ln t}{1-t} \to -1\) : prolongement par continuité. \(K\) converge.</p>
    <p><strong>Q2.</strong> On dérive \(\ln t\) et on primitive \(t^n\) en \(\frac{t^{n+1}}{n+1}\). Le crochet \(\frac{t^{n+1}\ln t}{n+1}\) tend vers 0 en \(0^+\) et vaut 0 en 1, donc</p>
    <div class="formula">$$\int_0^1 t^n\ln t\,\mathrm{d}t = -\frac{1}{n+1}\int_0^1 t^n\,\mathrm{d}t = -\frac{1}{(n+1)^2}.$$</div>
    <p><strong>Q3.</strong> Pour \(t \in \,]0, 1[\), \(\frac{1}{1-t} = \sum_{n\ge0} t^n\), donc \(\frac{\ln t}{1-t} = \sum_{n\ge0} f_n(t)\) avec \(f_n(t) = t^n\ln t\). Chaque \(f_n\) est continue et intégrable sur \(]0, 1[\) (Q2), de signe constant, et \(\int_0^1 |f_n| = \frac{1}{(n+1)^2}\) : la série de ces intégrales converge. Par intégration terme à terme :</p>
    <div class="formula">$$K = \sum_{n=0}^{+\infty} -\frac{1}{(n+1)^2} = -\frac{\pi^2}{6}.$$</div>
    <p><strong>Q4.</strong> Cette fois \(\frac{\ln t}{1+t} = \sum_{n\ge0}(-1)^n t^n\ln t\) sur \(]0, 1[\), avec encore \(\int_0^1 |(-1)^n t^n\ln t| = \frac{1}{(n+1)^2}\). Donc \(\int_0^1 \frac{\ln t}{1+t}\,\mathrm{d}t = -\sum_{n\ge0}\frac{(-1)^n}{(n+1)^2} = -\frac{\pi^2}{12}\) (même calcul qu'à l'EXO 07).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Le changement de variable \(t = 1/u\)</h3>
  <div class="statement">Pour \(\alpha\) réel, on pose \(\displaystyle I(\alpha) = \int_0^{+\infty} \frac{\mathrm{d}t}{t^\alpha(1+t)}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(I(\alpha)\) converge si et seulement si \(0 \lt \alpha \lt 1\).</div>
  <div class="q"><strong>Q2.</strong> À l'aide du changement de variable \(t = 1/u\), montrer que \(I(\alpha) = I(1 - \alpha)\). Calculer \(I\big(\frac12\big)\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(J = \displaystyle\int_0^{+\infty}\frac{\ln t}{1 + t^2}\,\mathrm{d}t\) converge et vaut 0.</div>
  <div class="q"><strong>Q4.</strong> En déduire, pour \(a \gt 0\), la valeur de \(\displaystyle\int_0^{+\infty}\frac{\ln t}{a^2 + t^2}\,\mathrm{d}t\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> L'intégrande est continu et positif sur \(]0, +\infty[\). En \(0^+\), il est équivalent à \(\frac{1}{t^\alpha}\), intégrable si et seulement si \(\alpha \lt 1\). En \(+\infty\), il est équivalent à \(\frac{1}{t^{\alpha+1}}\), intégrable si et seulement si \(\alpha + 1 \gt 1\), soit \(\alpha \gt 0\). Les deux conditions sont nécessaires (fonctions positives) : convergence si et seulement si \(0 \lt \alpha \lt 1\).</p>
    <p><strong>Q2.</strong> \(u \mapsto 1/u\) est une bijection strictement décroissante de classe \(\mathcal{C}^1\) de \(]0, +\infty[\) sur lui-même ; \(\mathrm{d}t = -\frac{\mathrm{d}u}{u^2}\) et les bornes s'échangent :</p>
    <div class="formula">$$I(\alpha) = \int_{+\infty}^{0} \frac{u^\alpha}{1 + 1/u}\left(-\frac{\mathrm{d}u}{u^2}\right) = \int_0^{+\infty}\frac{u^{\alpha-1}}{u+1}\,\mathrm{d}u = I(1 - \alpha).$$</div>
    <p>Pour \(\alpha = \frac12\), on pose \(t = v^2\) : \(I\big(\frac12\big) = \int_0^{+\infty}\frac{2v\,\mathrm{d}v}{v(1+v^2)} = \pi\).</p>
    <p><strong>Q3.</strong> En \(0^+\), \(\left|\frac{\ln t}{1+t^2}\right| \le |\ln t|\), intégrable. En \(+\infty\), \(t^{3/2}\cdot\frac{\ln t}{1+t^2} \to 0\) : intégrable. Avec \(t = 1/u\), \(\ln t = -\ln u\) et \(\frac{\mathrm{d}t}{1 + t^2} = \frac{-\mathrm{d}u/u^2}{1 + 1/u^2} = -\frac{\mathrm{d}u}{1+u^2}\), puis les bornes s'échangent : \(J = \int_0^{+\infty}\frac{-\ln u}{1+u^2}\,\mathrm{d}u = -J\), donc \(J = 0\).</p>
    <p><strong>Q4.</strong> Avec \(t = a u\), \(\mathrm{d}t = a\,\mathrm{d}u\) :</p>
    <div class="formula">$$\begin{aligned} \int_0^{+\infty}\frac{\ln t}{a^2+t^2}\,\mathrm{d}t &= \int_0^{+\infty}\frac{\ln a + \ln u}{a^2(1+u^2)}\,a\,\mathrm{d}u \\ &= \frac1a\Big(\ln a\cdot\frac{\pi}{2} + J\Big) = \frac{\pi\ln a}{2a}. \end{aligned}$$</div>
    <p>On a pu séparer les deux termes car les deux intégrales convergent. Contrôle pour \(a = 3\) : \(\frac{\pi\ln 3}{6} \approx 0{,}575\).</p>
  </div>
