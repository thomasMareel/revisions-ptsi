<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le rayonnement du corps noir</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : intégrales généralisées, fonction Γ, intégration terme à terme ; application à la loi de Planck).</div>
  <div class="statement">En physique, l'énergie rayonnée par un corps noir à la température \(T\), dans la bande de fréquences \([\nu, \nu + \mathrm{d}\nu]\), est proportionnelle à \(\dfrac{\nu^3\,\mathrm{d}\nu}{\mathrm{e}^{h\nu/(k_B T)} - 1}\) (loi de Planck), où \(h\) et \(k_B\) sont des constantes. Pour \(s\) réel, on pose
  <div class="formula">$$I(s) = \int_0^{+\infty}\frac{t^{s-1}}{\mathrm{e}^t - 1}\,\mathrm{d}t \qquad\text{et, pour } s \gt 1,\qquad \zeta(s) = \sum_{n=1}^{+\infty}\frac{1}{n^s}.$$</div></div>
  <p class="exo-part">Partie A — Existence</p>
  <div class="q"><strong>A1.</strong> Montrer que \(I(s)\) converge si et seulement si \(s \gt 1\).</div>
  <div class="q"><strong>A2.</strong> Pour \(n \ge 1\) et \(s \gt 0\), montrer que \(\displaystyle\int_0^{+\infty} t^{s-1}\mathrm{e}^{-nt}\,\mathrm{d}t = \frac{\Gamma(s)}{n^s}\).</div>
  <p class="exo-part">Partie B — Intégration terme à terme</p>
  <div class="q"><strong>B1.</strong> Pour \(t \gt 0\), écrire \(\dfrac{1}{\mathrm{e}^t - 1}\) comme la somme d'une série d'exponentielles.</div>
  <div class="q"><strong>B2.</strong> En déduire que \(I(s) = \Gamma(s)\,\zeta(s)\) pour tout \(s \gt 1\), en justifiant soigneusement.</div>
  <div class="q"><strong>B3.</strong> On admet \(\zeta(2) = \frac{\pi^2}{6}\) et \(\zeta(4) = \frac{\pi^4}{90}\). Calculer \(I(2)\) et \(I(4) = \displaystyle\int_0^{+\infty}\frac{t^3}{\mathrm{e}^t - 1}\,\mathrm{d}t\).</div>
  <p class="exo-part">Partie C — Loi de Stefan</p>
  <div class="q"><strong>C1.</strong> Pour \(T \gt 0\), on pose \(E(T) = \displaystyle\int_0^{+\infty}\frac{\nu^3\,\mathrm{d}\nu}{\mathrm{e}^{h\nu/(k_B T)} - 1}\). Par un changement de variable, montrer que \(E(T) = \Big(\dfrac{k_B T}{h}\Big)^4 I(4)\).</div>
  <div class="q"><strong>C2.</strong> Par quel facteur l'énergie rayonnée est-elle multipliée quand la température passe de 300 K à 600 K ?</div>
  <p class="exo-part">Partie D — Loi de Wien</p>
  <div class="q"><strong>D1.</strong> Soit \(\varphi(x) = \dfrac{x^3}{\mathrm{e}^x - 1}\) sur \(]0, +\infty[\). Montrer que \(\varphi'(x)\) a le signe de \(\psi(x) = 3(1 - \mathrm{e}^{-x}) - x\).</div>
  <div class="q"><strong>D2.</strong> Étudier \(\psi\) et montrer que \(\varphi\) atteint son maximum en un unique point \(x_m \in \,]2, 3[\).</div>
  <div class="q"><strong>D3.</strong> Écrire une fonction Python qui calcule \(x_m\) à \(10^{-6}\) près par dichotomie. Interpréter \(x_m\) physiquement.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> L'intégrande est continu et positif sur \(]0, +\infty[\). En \(0^+\), \(\mathrm{e}^t - 1 \sim t\), donc il est équivalent à \(t^{s-2} = \frac{1}{t^{2-s}}\), intégrable si et seulement si \(2 - s \lt 1\), soit \(s \gt 1\). En \(+\infty\), \(\frac{t^{s-1}}{\mathrm{e}^t - 1} \sim t^{s-1}\mathrm{e}^{-t}\) et \(t^2 \cdot t^{s-1}\mathrm{e}^{-t} \to 0\) : intégrable pour tout \(s\). Donc \(I(s)\) converge si et seulement si \(s \gt 1\).</p>
    <p><strong>A2.</strong> Avec \(u = nt\) (changement de variable affine), \(t^{s-1} = \frac{u^{s-1}}{n^{s-1}}\) et \(\mathrm{d}t = \frac{\mathrm{d}u}{n}\) : l'intégrale vaut \(\frac{1}{n^s}\int_0^{+\infty}u^{s-1}\mathrm{e}^{-u}\,\mathrm{d}u = \frac{\Gamma(s)}{n^s}\), qui converge pour \(s \gt 0\).</p>
    <p><strong>B1.</strong> Pour \(t \gt 0\), \(0 \lt \mathrm{e}^{-t} \lt 1\) et \(\frac{1}{\mathrm{e}^t - 1} = \frac{\mathrm{e}^{-t}}{1 - \mathrm{e}^{-t}} = \sum_{n=1}^{+\infty}\mathrm{e}^{-nt}\).</p>
    <p><strong>B2.</strong> Soit \(s \gt 1\). Sur \(]0, +\infty[\), la fonction \(S(t) = \frac{t^{s-1}}{\mathrm{e}^t - 1}\) est continue et vaut \(\sum_{n\ge1} f_n(t)\) avec \(f_n(t) = t^{s-1}\mathrm{e}^{-nt}\). Chaque \(f_n\) est continue, positive et intégrable (A2), avec \(\int_0^{+\infty}|f_n| = \frac{\Gamma(s)}{n^s}\). La série \(\sum \frac{\Gamma(s)}{n^s}\) converge (Riemann, \(s \gt 1\)). Le théorème d'intégration terme à terme donne \(I(s) = \sum_{n\ge1}\frac{\Gamma(s)}{n^s} = \Gamma(s)\,\zeta(s)\).</p>
    <p><strong>B3.</strong> \(I(2) = \Gamma(2)\,\zeta(2) = \frac{\pi^2}{6}\) (le résultat du cours) et \(I(4) = \Gamma(4)\,\zeta(4) = 6 \times \frac{\pi^4}{90} = \frac{\pi^4}{15} \approx 6{,}494\).</p>
    <p><strong>C1.</strong> On pose \(t = \frac{h\nu}{k_B T}\), changement de variable linéaire : \(\nu = \frac{k_B T}{h}\,t\), \(\mathrm{d}\nu = \frac{k_B T}{h}\,\mathrm{d}t\), et les bornes 0 et \(+\infty\) sont conservées. Donc \(E(T) = \left(\frac{k_B T}{h}\right)^4\int_0^{+\infty}\frac{t^3\,\mathrm{d}t}{\mathrm{e}^t - 1}\), qui converge d'après A1. L'énergie totale est proportionnelle à \(T^4\) : c'est la loi de Stefan.</p>
    <p><strong>C2.</strong> \(E(600)/E(300) = 2^4 = 16\).</p>
    <p><strong>D1.</strong> En dérivant le quotient puis en factorisant \(x^2\mathrm{e}^x\) :</p>
    <div class="formula">$$\varphi'(x) = \frac{3x^2(\mathrm{e}^x - 1) - x^3\mathrm{e}^x}{(\mathrm{e}^x - 1)^2} = \frac{x^2\,\mathrm{e}^x}{(\mathrm{e}^x - 1)^2}\Big(3\big(1 - \mathrm{e}^{-x}\big) - x\Big),$$</div>
    <p>et le premier facteur est strictement positif sur \(]0, +\infty[\).</p>
    <p><strong>D2.</strong> \(\psi'(x) = 3\mathrm{e}^{-x} - 1\) est positive sur \(]0, \ln 3]\) et négative ensuite. Comme \(\psi(0) = 0\), \(\psi \gt 0\) sur \(]0, \ln 3]\). Sur \([\ln 3, +\infty[\), \(\psi\) est continue et strictement décroissante, avec \(\psi(2) = 1 - 3\mathrm{e}^{-2} \approx 0{,}59 \gt 0\) et \(\psi(3) = -3\mathrm{e}^{-3} \lt 0\) : elle s'annule en un unique \(x_m\), situé dans \(]2, 3[\) (\(\ln 3 \approx 1{,}10 \lt 2\)). Ainsi \(\varphi\) croît sur \(]0, x_m]\) et décroît sur \([x_m, +\infty[\) : son maximum est atteint en \(x_m\) seulement.</p>
    <p><strong>D3.</strong></p>
    <pre class="codeblock"><span class="kw">from</span> math <span class="kw">import</span> exp

<span class="kw">def</span> psi(x):
    <span class="kw">return</span> 3 * (1 - exp(-x)) - x

<span class="kw">def</span> dichotomie(a, b, eps):
    <span class="kw">while</span> b - a &gt; eps:
        c = (a + b) / 2
        <span class="kw">if</span> psi(c) &gt; 0:
            a = c
        <span class="kw">else</span>:
            b = c
    <span class="kw">return</span> (a + b) / 2

print(dichotomie(2, 3, 1e-6))   <span class="cmt"># 2.82144</span></pre>
    <p>On trouve \(x_m \approx 2{,}821\). La fréquence où l'émission est maximale vérifie donc \(h\nu_{\max} \approx 2{,}82\,k_B T\) : elle est proportionnelle à la température (loi de déplacement de Wien).</p>
  </div>
