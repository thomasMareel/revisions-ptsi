<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Une courbe tracée sur un cylindre hyperbolique</h3>
  <div class="statement">Soit \(\Gamma\) la courbe \(t\mapsto M(t)=\big(e^t,\ e^{-t},\ \sqrt2\,t\big)\), \(t\in\mathbb{R}\), et \(S\) la surface d'équation \(xy=1\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\Gamma\) est régulière.</div>
  <div class="q"><strong>Q2.</strong> Donner une représentation paramétrique, puis un système d'équations cartésiennes, de la tangente à \(\Gamma\) en \(A=M(0)\).</div>
  <div class="q"><strong>Q3.</strong> Vérifier que \(\Gamma\) est tracée sur \(S\), que tout point de \(S\) est régulier, et que la tangente trouvée est contenue dans le plan tangent à \(S\) en \(A\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer la projection orthogonale de \(\Gamma\) sur le plan \((xOy)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\overrightarrow{M'(t)}=\big(e^t,\ -e^{-t},\ \sqrt2\big)\) : sa première coordonnée est strictement positive, donc \(\overrightarrow{M'(t)}\neq\vec 0\) pour tout \(t\).</p>
    <p><strong>Q2.</strong> \(A=(1,1,0)\) et \(\overrightarrow{M'(0)}=(1,-1,\sqrt2)\). Tangente : \(x=1+\lambda\), \(y=1-\lambda\), \(z=\sqrt2\,\lambda\). En éliminant \(\lambda\) : \(x+y=2\) et \(z=\sqrt2\,(x-1)\).</p>
    <p><strong>Q3.</strong> \(e^t\,e^{-t}=1\) : \(\Gamma\subset S\). Avec \(F(x,y,z)=xy-1\), \(\nabla F=(y,x,0)\) ne s'annule que si \(x=y=0\), et alors \(F=-1\neq0\) : tout point de \(S\) est régulier. En \(A\), \(\nabla F(A)=(1,1,0)\), d'où le plan tangent \(x+y=2\) (vertical : \(S\) est un cylindre de direction \((Oz)\)). On a \(\nabla F(A)\cdot\overrightarrow{M'(0)}=1-1+0=0\), et la tangente vérifie bien \(x+y=2\).</p>
    <p><strong>Q4.</strong> La projection est \(t\mapsto(e^t,e^{-t},0)\). Comme \(t\mapsto e^t\) est une bijection de \(\mathbb{R}\) sur \(]0,+\infty[\), c'est toute la branche \(x>0\) de l'hyperbole \(xy=1\) du plan \(z=0\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Paramétrage polaire d'un paraboloïde</h3>
  <div class="statement">Soit \(\Sigma\) la nappe \(M(u,v)=\big(u\cos v,\ u\sin v,\ u^2\big)\), \((u,v)\in\mathbb{R}^2\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\Sigma\) est la surface \(P\) d'équation \(z=x^2+y^2\). Décrire les courbes coordonnées.</div>
  <div class="q"><strong>Q2.</strong> Déterminer les points réguliers de la nappe.</div>
  <div class="q"><strong>Q3.</strong> Donner une équation du plan tangent au point de paramètres \((2,\pi/3)\), puis la retrouver à partir de l'équation de \(P\).</div>
  <div class="q"><strong>Q4.</strong> Le point \(O\) est-il un point régulier de la surface \(P\) ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(x^2+y^2=u^2=z\), donc \(\Sigma\subset P\). Réciproquement, si \(z=x^2+y^2\), on écrit \((x,y)\) en coordonnées polaires \((u\cos v,u\sin v)\) avec \(u=\sqrt{x^2+y^2}\), et alors \(z=u^2\) : le point est atteint. Courbes \(v=v_0\) : paraboles du plan méridien d'angle \(v_0\) ; courbes \(u=u_0\) : cercles horizontaux de cote \(u_0^2\). \(P\) est un paraboloïde de révolution d'axe \((Oz)\).</p>
    <p><strong>Q2.</strong> \(\partial_u M=(\cos v,\sin v,2u)\), \(\partial_v M=(-u\sin v,u\cos v,0)\), et</p>
    <div class="formula">$$\partial_u M\wedge\partial_v M=\big(-2u^2\cos v,\ -2u^2\sin v,\ u\big)=u\,\big(-2u\cos v,\ -2u\sin v,\ 1\big).$$</div>
    <p>Il est nul si et seulement si \(u=0\) : tous les points sont réguliers sauf \(O\) (atteint pour \(u=0\) et tout \(v\)).</p>
    <p><strong>Q3.</strong> En \((2,\pi/3)\) : \(M_0=(1,\sqrt3,4)\) et \(\vec N=2\,(-2,-2\sqrt3,1)\). Plan tangent : \(-2(x-1)-2\sqrt3(y-\sqrt3)+(z-4)=0\), soit</p>
    <div class="formula">$$2x+2\sqrt3\,y-z-4=0.$$</div>
    <p>Avec \(F=x^2+y^2-z\) : \(\nabla F(M_0)=(2,2\sqrt3,-1)\), colinéaire à \(\vec N\) : même plan.</p>
    <p><strong>Q4.</strong> \(\nabla F(O)=(0,0,-1)\neq\vec 0\) : \(O\) est un point régulier de \(P\), de plan tangent \(z=0\). L'irrégularité en \(u=0\) vient du paramétrage polaire (tous les \(v\) donnent le même point), pas de la surface.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Points critiques et position par rapport au plan tangent</h3>
  <div class="statement">Soit \(\Sigma\) la surface d'équation \(z=g(x,y)=x^4+y^4-4xy\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer les points critiques de \(g\).</div>
  <div class="q"><strong>Q2.</strong> En chacun d'eux, donner le plan tangent à \(\Sigma\) et la position de \(\Sigma\) par rapport à ce plan.</div>
  <div class="q"><strong>Q3.</strong> Vérifier que \(g(x,y)+2=(x^2-y^2)^2+2(xy-1)^2\). Conclure sur le minimum global de \(g\).</div>
  <div class="q"><strong>Q4.</strong> Donner le plan tangent à \(\Sigma\) au point \(A(1,0,1)\). La surface est-elle localement d'un seul côté de ce plan ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(p=4x^3-4y\), \(q=4y^3-4x\). \(p=q=0\iff y=x^3\) et \(x=y^3=x^9\), soit \(x(x^8-1)=0\) : \(x\in\{-1,0,1\}\). Points critiques : \((0,0)\), \((1,1)\), \((-1,-1)\).</p>
    <p><strong>Q2.</strong> \(r=12x^2\), \(s=-4\), \(t=12y^2\).</p>
    <ul>
      <li>En \((0,0)\) : plan \(z=0\) ; \(rt-s^2=-16 \lt 0\) : point col, le plan traverse \(\Sigma\) (en effet \(g(x,x)=2x^4-4x^2 \lt 0\) et \(g(x,-x)=2x^4+4x^2>0\) près de 0).</li>
      <li>En \((1,1)\) : \(z_0=-2\), plan \(z=-2\) ; \(rt-s^2=144-16=128>0\) et \(r=12>0\) : \(\Sigma\) est au-dessus du plan, minimum local.</li>
      <li>En \((-1,-1)\) : \(g(-x,-y)=g(x,y)\), mêmes valeurs : plan \(z=-2\), minimum local.</li>
    </ul>
    <p><strong>Q3.</strong> En développant :</p>
    <div class="formula">$$(x^2-y^2)^2+2(xy-1)^2=x^4-2x^2y^2+y^4+2x^2y^2-4xy+2=g(x,y)+2.$$</div>
    <p>Donc \(g\geqslant-2\), avec égalité si et seulement si \(x^2=y^2\) et \(xy=1\), soit \((1,1)\) ou \((-1,-1)\) : le minimum global de \(g\) vaut \(-2\).</p>
    <p><strong>Q4.</strong> En \((1,0)\) : \(p=4\), \(q=-4\), d'où le plan \(z-1=4(x-1)-4y\), soit \(z=4x-4y-3\). L'écart vaut</p>
    <div class="formula">$$\delta(h,k)=g(1+h,k)-(1+4h-4k)=6h^2-4hk+4h^3+h^4+k^4.$$</div>
    <p>Sur \(h=0\) : \(\delta=k^4>0\) ; sur \(k=3h\) : \(\delta=-6h^2+o(h^2) \lt 0\). La surface traverse son plan tangent en \(A\) ; c'est cohérent avec \(rt-s^2=12\times0-16 \lt 0\) (point hyperbolique).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Plans tangents et génératrices d'un hyperboloïde</h3>
  <div class="statement">Soit \(S\) la surface d'équation \(x^2+2y^2-z^2=1\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que tout point de \(S\) est régulier. Écrire une équation du plan tangent en un point \(M_0(x_0,y_0,z_0)\) de \(S\) et la comparer à la règle du dédoublement.</div>
  <div class="q"><strong>Q2.</strong> Déterminer les plans tangents à \(S\) parallèles au plan \(x+y+z=0\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer l'ensemble des points de \(S\) où le plan tangent est parallèle à l'axe \((Oz)\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer les droites contenues dans \(S\) passant par \(A(1,0,0)\). Vérifier qu'elles sont dans le plan tangent en \(A\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(F=x^2+2y^2-z^2-1\), le gradient \(\nabla F=(2x,4y,-2z)\) ne s'annule qu'en \(O\), qui n'est pas sur \(S\) : tout point de \(S\) est régulier. Plan tangent en \(M_0\) :</p>
    <div class="formula">$$2x_0(x-x_0)+4y_0(y-y_0)-2z_0(z-z_0)=0,$$</div>
    <p>soit, puisque \(x_0^2+2y_0^2-z_0^2=1\) :</p>
    <div class="formula">$$x_0\,x+2y_0\,y-z_0\,z=1,$$</div>
    <p>ce que donne directement le dédoublement (\(x^2\to x_0x\), \(y^2\to y_0y\), \(z^2\to z_0z\)).</p>
    <p><strong>Q2.</strong> Il faut \(\nabla F(M_0)\) colinéaire à \((1,1,1)\) : \((x_0,2y_0,-z_0)=\mu(1,1,1)\), soit \(x_0=\mu\), \(y_0=\mu/2\), \(z_0=-\mu\). Dans l'équation de \(S\) : \(\mu^2+\tfrac{\mu^2}{2}-\mu^2=\tfrac{\mu^2}{2}=1\), donc \(\mu=\pm\sqrt2\). Points de contact \(\pm\big(\sqrt2,\tfrac{\sqrt2}{2},-\sqrt2\big)\) ; plans tangents \(\mu(x+y+z)=1\) :</p>
    <div class="formula">$$x+y+z=\frac{\sqrt2}{2}\qquad\text{et}\qquad x+y+z=-\frac{\sqrt2}{2}.$$</div>
    <p><strong>Q3.</strong> Le plan tangent contient \(\vec k\) si et seulement si \(\nabla F(M_0)\cdot\vec k=-2z_0=0\). Les points cherchés forment l'ellipse \(\{z=0,\ x^2+2y^2=1\}\) (ellipse de gorge) ; les plans tangents y sont verticaux, d'équation \(x_0x+2y_0y=1\).</p>
    <p><strong>Q4.</strong> \(A\in S\). Pour \(\vec w=(\alpha,\beta,\gamma)\) : \(F(A+\lambda\vec w)=2\alpha\lambda+(\alpha^2+2\beta^2-\gamma^2)\lambda^2\), nul pour tout \(\lambda\) si et seulement si \(\alpha=0\) et \(\gamma^2=2\beta^2\) (avec \(\beta\neq0\)). Deux droites :</p>
    <div class="formula">$$D_1 : \{x=1,\ z=\sqrt2\,y\},\qquad D_2 : \{x=1,\ z=-\sqrt2\,y\}.$$</div>
    <p>Le plan tangent en \(A\) est \(x=1\) : il contient \(D_1\) et \(D_2\). D'ailleurs \(S\cap\{x=1\}\) a pour équation \(2y^2-z^2=0\), c'est-à-dire \(D_1\cup D_2\) : la surface traverse son plan tangent le long de ces deux droites.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Cylindre et cône s'appuyant sur un cercle</h3>
  <div class="statement">Soit \(\mathcal C\) le cercle \(\{x^2+y^2=1,\ z=0\}\), \(\vec w=(1,0,2)\) et \(S_0=(0,0,2)\).</div>
  <div class="q"><strong>Q1.</strong> Paramétrer, puis donner une équation cartésienne du cylindre \(\Sigma_1\) réunion des droites de direction \(\vec w\) rencontrant \(\mathcal C\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que tout point de \(\Sigma_1\) est régulier et que le plan tangent contient toujours la direction \(\vec w\).</div>
  <div class="q"><strong>Q3.</strong> Nature des sections de \(\Sigma_1\) par les plans \(z=h\). \(\Sigma_1\) est-il un cylindre de révolution ?</div>
  <div class="q"><strong>Q4.</strong> Paramétrer et donner une équation du cône \(\Sigma_2\) de sommet \(S_0\) s'appuyant sur \(\mathcal C\). Le reconnaître et préciser ses points non réguliers (pour cette équation).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(A(t)=(\cos t,\sin t,0)\) : \(M(t,\lambda)=(\cos t+\lambda,\ \sin t,\ 2\lambda)\). Pour l'équation : \(M\in\Sigma_1\iff\exists\lambda,\ M-\lambda\vec w\in\mathcal C\). La troisième coordonnée de \(M-\lambda\vec w\) doit être nulle : \(\lambda=z/2\), d'où \(\big(x-\tfrac z2\big)^2+y^2=1\), soit</p>
    <div class="formula">$$\Sigma_1 : (2x-z)^2+4y^2=4.$$</div>
    <p><strong>Q2.</strong> Avec \(F=(2x-z)^2+4y^2-4\) :</p>
    <div class="formula">$$\nabla F=\big(4(2x-z),\ 8y,\ -2(2x-z)\big).$$</div>
    <p>Il est nul seulement si \(z=2x\) et \(y=0\), et alors \(F=-4\neq0\) : tout point est régulier. De plus \(\nabla F\cdot\vec w=0\) identiquement : le plan tangent contient \(\vec w\), donc la génératrice (on le voit aussi sur \(\partial_\lambda M=\vec w\)).</p>
    <p><strong>Q3.</strong> \(z=h\) : \(\big(x-\tfrac h2\big)^2+y^2=1\), cercle de rayon 1 centré en \(\big(\tfrac h2,0,h\big)\), translaté de \(\mathcal C\) par \(\tfrac h2\vec w\).</p>
    <p><strong>Ce n'est pas un cylindre de révolution.</strong> Les seules droites contenues dans un cylindre de révolution sont parallèles à son axe : l'axe devrait être dirigé par \(\vec w\). Or un cylindre de révolution coupé par un plan <em>ni orthogonal ni parallèle</em> à son axe donne une ellipse qui n'est pas un cercle ; ici, le plan \(z=0\) n'est pas orthogonal à \(\vec w\), et pourtant la section est le cercle \(\mathcal C\). Contrôle sur l'axe naturel \(O+\mathbb{R}\vec w\) : la distance \(d\) d'un point \(P=(\cos t,\sin t,0)\) de \(\mathcal C\) à cette droite vérifie</p>
    <div class="formula">$$d^2=OP^2-\frac{(\overrightarrow{OP}\cdot\vec w)^2}{\|\vec w\|^2}=1-\frac{\cos^2t}{5},$$</div>
    <p>qui n'est pas constante.</p>
    <p><strong>Q4.</strong> Avec \(P(t)=(\cos t,\sin t,0)\in\mathcal C\) :</p>
    <div class="formula">$$M=S_0+\lambda\big(P(t)-S_0\big)=(\lambda\cos t,\ \lambda\sin t,\ 2-2\lambda).$$</div>
    <p>De \(z=2-2\lambda\) : \(\lambda=\tfrac{2-z}{2}\), et \(x^2+y^2=\lambda^2\), d'où</p>
    <div class="formula">$$\Sigma_2 : 4(x^2+y^2)=(z-2)^2.$$</div>
    <p>Cône de révolution d'axe \((Oz)\), de sommet \(S_0\), de demi-angle \(\alpha\) avec \(\tan\alpha=\tfrac12\) (les deux nappes, car \(\lambda\in\mathbb{R}\)). Avec \(F_2=4(x^2+y^2)-(z-2)^2\), \(\nabla F_2=\big(8x,8y,-2(z-2)\big)\) ne s'annule qu'en \(S_0\), qui est sur \(\Sigma_2\) : seul le sommet n'est pas régulier.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Intersection de deux cylindres perpendiculaires</h3>
  <div class="statement">Soit \(\Gamma\) la courbe d'équations \(x^2+z^2=4\) et \(y^2+z^2=4\) (intersection de deux cylindres de rayon 2, d'axes \((Oy)\) et \((Ox)\)).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\Gamma\) est la réunion de deux courbes planes, contenues dans les plans \(x=y\) et \(x=-y\). Quelle est leur nature ?</div>
  <div class="q"><strong>Q2.</strong> Déterminer les projections orthogonales de \(\Gamma\) sur les plans \((xOy)\) et \((xOz)\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer la tangente à \(\Gamma\) en \(B(\sqrt2,\sqrt2,\sqrt2)\) par la méthode des gradients ; vérifier qu'elle est dans le plan \(x=y\).</div>
  <div class="q"><strong>Q4.</strong> Que se passe-t-il au point \(C(0,0,2)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Par différence : \(x^2-y^2=0\iff(x-y)(x+y)=0\). Donc \(\Gamma=\Gamma_1\cup\Gamma_2\) avec \(\Gamma_1=\{x=y,\ x^2+z^2=4\}\) et \(\Gamma_2=\{x=-y,\ x^2+z^2=4\}\). Chacune est la section du cylindre \(x^2+z^2=4\) par un plan oblique par rapport à son axe : une ellipse. Par exemple \(\Gamma_1 : t\mapsto(2\cos t,\ 2\cos t,\ 2\sin t)\) ; dans son plan, ses demi-axes valent \(2\sqrt2\) (selon \((1,1,0)\)) et \(2\) (selon \(\vec k\)).</p>
    <p><strong>Q2.</strong> Sur \((xOy)\) : \((x,y,0)\) est atteint si et seulement s'il existe \(z\) tel que \(z^2=4-x^2=4-y^2\), c'est-à-dire si et seulement si \(x^2=y^2\) et \(x^2\leqslant4\). Ce sont les deux <strong>segments</strong> des diagonales \(y=\pm x\) avec \(|x|\leqslant2\), pas les droites entières. Sur \((xOz)\) : \((x,0,z)\) est atteint \(\iff x^2+z^2=4\) et \(\exists y,\ y^2=4-z^2=x^2\) ; \(y=\pm x\) convient toujours : c'est le cercle entier \(x^2+z^2=4\).</p>
    <p><strong>Q3.</strong> \(F=x^2+z^2-4\), \(G=y^2+z^2-4\) : \(\nabla F(B)=2\sqrt2\,(1,0,1)\), \(\nabla G(B)=2\sqrt2\,(0,1,1)\), non colinéaires. \((1,0,1)\wedge(0,1,1)=(-1,-1,1)\). Tangente : \(B+\mathbb{R}(-1,-1,1)\) ; ce vecteur a deux premières coordonnées égales, il est dans le plan \(x=y\) qui contient \(\Gamma_1\ni B\). Contrôle par le paramétrage (\(t=\pi/4\)) : \(\overrightarrow{M'}=(-\sqrt2,-\sqrt2,\sqrt2)\).</p>
    <p><strong>Q4.</strong> \(\nabla F(C)=\nabla G(C)=(0,0,4)\) : les deux cylindres sont tangents en \(C\) (même plan tangent \(z=2\)), la méthode des gradients ne s'applique pas. En fait \(C\) appartient à \(\Gamma_1\) et à \(\Gamma_2\) (paramètre \(t=\pi/2\)) : c'est un <strong>point double</strong>, avec deux tangentes, dirigées par \((1,1,0)\) pour \(\Gamma_1\) et \((1,-1,0)\) pour \(\Gamma_2\). Même chose en \((0,0,-2)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ★</span>
  <h3>Un tore dont le trou se referme</h3>
  <div class="statement">Soit \(\mathcal C\) le cercle du plan \((xOz)\) de centre \(\Omega(1,0,0)\) et de rayon 1, et \(\Sigma\) la surface engendrée par la rotation de \(\mathcal C\) autour de l'axe \((Oz)\).</div>
  <div class="q"><strong>Q1.</strong> Paramétrer \(\mathcal C\), puis \(\Sigma\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\Sigma\) a pour équation \((x^2+y^2+z^2)^2=4(x^2+y^2)\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer les points non réguliers de \(\Sigma\) (pour cette équation).</div>
  <div class="q"><strong>Q4.</strong> Déterminer les points de \(\Sigma\) où le plan tangent est horizontal.</div>
  <div class="q"><strong>Q5.</strong> Décrire l'intersection de \(\Sigma\) avec le plan \(z=\tfrac12\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\mathcal C : t\mapsto(1+\cos t,\ 0,\ \sin t)\), \(t\in[0,2\pi[\). La distance à l'axe est \(\rho(t)=1+\cos t\geqslant0\), d'où</p>
    <div class="formula">$$M(t,\theta)=\big((1+\cos t)\cos\theta,\ (1+\cos t)\sin\theta,\ \sin t\big).$$</div>
    <p><strong>Q2.</strong> Notons \(\rho=\sqrt{x^2+y^2}\). \(M\in\Sigma\) si et seulement s'il existe \(t\) tel que \(z=\sin t\) et \(\rho-1=\cos t\), c'est-à-dire si et seulement si \((\rho-1)^2+z^2=1\) (réciproque : tout point du cercle unité s'écrit \((\cos t,\sin t)\)). Puis</p>
    <div class="formula">$$(\rho-1)^2+z^2=1\iff\rho^2+z^2=2\rho\iff(\rho^2+z^2)^2=4\rho^2,$$</div>
    <p>la dernière équivalence étant valable car \(\rho^2+z^2\geqslant0\) et \(2\rho\geqslant0\).</p>
    <p><strong>Q3.</strong> \(F=(x^2+y^2+z^2)^2-4(x^2+y^2)\). Avec \(R^2=x^2+y^2+z^2\) :</p>
    <div class="formula">$$\nabla F=\big(4x(R^2-2),\ 4y(R^2-2),\ 4zR^2\big).$$</div>
    <p>Si \(R^2=2\), alors \(z=0\), \(x^2+y^2=2\) et \(F=4-8\neq0\) : pas sur \(\Sigma\). Sinon \(x=y=0\), puis \(zR^2=z^3=0\) : c'est \(O\), qui est bien sur \(\Sigma\). <strong>Seul \(O\) n'est pas régulier</strong> : c'est le point où le cercle \(\mathcal C\) touche l'axe de rotation.</p>
    <p><strong>Q4.</strong> Il faut \(\nabla F\) colinéaire à \(\vec k\) et non nul : \(x(R^2-2)=y(R^2-2)=0\) et \(z\neq0\). Si \(R^2\neq2\), alors \(x=y=0\) et \(F=z^4=0\) : exclu. Donc \(R^2=2\) et, dans l'équation, \(4=4(x^2+y^2)\) : \(x^2+y^2=1\), \(z^2=1\). Ce sont les deux parallèles \(\{z=\pm1,\ x^2+y^2=1\}\), de plans tangents \(z=\pm1\) : les cercles « sommet » et « fond » du tore.</p>
    <p><strong>Q5.</strong> \((\rho-1)^2=\tfrac34\), donc \(\rho=1\pm\tfrac{\sqrt3}{2}\) (deux valeurs positives) : deux cercles concentriques d'axe \((Oz)\) dans le plan \(z=\tfrac12\), de rayons \(1-\tfrac{\sqrt3}{2}\) et \(1+\tfrac{\sqrt3}{2}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Une surface de révolution d'axe (Ox), ses normales et ses sections</h3>
  <div class="statement">Soit \(\Gamma\) la courbe du plan \((xOy)\) d'équation \(y=1+x^2\), et \(\Sigma\) la surface engendrée par la rotation de \(\Gamma\) autour de l'axe \((Ox)\).</div>
  <div class="q"><strong>Q1.</strong> Écrire la matrice \(R_\theta\) de la rotation d'axe \((Ox)\) (orienté par \(\vec\imath\)) et d'angle \(\theta\). En déduire un paramétrage de \(\Sigma\), puis une équation cartésienne.</div>
  <div class="q"><strong>Q2.</strong> Montrer que tout point de \(\Sigma\) est régulier. Donner le plan tangent en \(B(1,0,2)\), à partir de l'équation puis du paramétrage.</div>
  <div class="q"><strong>Q3.</strong> Montrer que la normale à \(\Sigma\) en tout point rencontre l'axe \((Ox)\).</div>
  <div class="q"><strong>Q4.</strong> Décrire les sections de \(\Sigma\) par les plans \(x=a\), puis par le plan \(z=0\).</div>
  <div class="q"><strong>Q5.</strong> Montrer que le plan \(y=1\) est tangent à \(\Sigma\) en \(A(0,1,0)\) et décrire la section de \(\Sigma\) par ce plan. Quelle est la position de \(\Sigma\) par rapport à ce plan au voisinage de \(A\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La rotation laisse \(x\) fixe et fait tourner \((y,z)\) d'un angle \(\theta\) :</p>
    <div class="formula">$$R_\theta=\begin{pmatrix}1&0&0\\ 0&\cos\theta&-\sin\theta\\ 0&\sin\theta&\cos\theta\end{pmatrix}.$$</div>
    <p>Le point \(P(x)=(x,\ 1+x^2,\ 0)\) de \(\Gamma\) a pour image \(M(x,\theta)=R_\theta\,P(x)\) :</p>
    <div class="formula">$$M(x,\theta)=\big(x,\ (1+x^2)\cos\theta,\ (1+x^2)\sin\theta\big),\qquad (x,\theta)\in\mathbb{R}^2.$$</div>
    <p>La rotation conserve \(x\) et \(y^2+z^2\), d'où l'équation</p>
    <div class="formula">$$\Sigma : y^2+z^2=(1+x^2)^2.$$</div>
    <p>Réciproquement, si \((x,y,z)\) vérifie cette équation, on écrit \((y,z)=(\rho\cos\theta,\rho\sin\theta)\) avec \(\rho=1+x^2\) : c'est le point \(M(x,\theta)\).</p>
    <p><strong>Q2.</strong> Avec \(F=y^2+z^2-(1+x^2)^2\), \(\nabla F=\big(-4x(1+x^2),\ 2y,\ 2z\big)\) ne s'annule qu'en \(O\), et \(F(O)=-1\neq0\) : tout point de \(\Sigma\) est régulier. En \(B\) (qui vérifie \(0+4=(1+1)^2\)), \(\nabla F(B)=(-8,0,4)\) : le plan tangent est \(-8(x-1)+4(z-2)=0\), soit \(z=2x\). Par le paramétrage, \(B=M(1,\frac\pi2)\) ; on a \(\partial_x M=(1,\ 2x\cos\theta,\ 2x\sin\theta)\) et \(\partial_\theta M=(1+x^2)(0,-\sin\theta,\cos\theta)\), soit en ce point \((1,0,2)\) et \((0,-2,0)\) ; leur produit vectoriel \((4,0,-2)\) est colinéaire à \(\nabla F(B)\) : même plan.</p>
    <p><strong>Q3.</strong> En \(M(x_0,\theta)\), avec \(\rho=1+x_0^2\), \(\nabla F=-2\rho\,(2x_0,\ -\cos\theta,\ -\sin\theta)\). La normale est la droite \(M+\mu\,(2x_0,-\cos\theta,-\sin\theta)\), \(\mu\in\mathbb{R}\) ; pour \(\mu=\rho\), on obtient le point \(\big(x_0(1+2\rho),\ 0,\ 0\big)\) de l'axe. C'est une propriété générale : la normale à une surface de révolution est dans le plan méridien du point, et rencontre l'axe (ou lui est parallèle).</p>
    <p><strong>Q4.</strong> Plan \(x=a\) : \(y^2+z^2=(1+a^2)^2\), cercle de centre \((a,0,0)\) et de rayon \(1+a^2\), d'axe \((Ox)\) : ce sont les parallèles. Plan \(z=0\) (plan méridien) : \(y=\pm(1+x^2)\), la parabole \(\Gamma\) et sa symétrique par rapport à l'axe : c'est une méridienne.</p>
    <p><strong>Q5.</strong> \(A\in\Sigma\) et \(\nabla F(A)=(0,2,0)\) : le plan tangent en \(A\) est \(y=1\). La section a pour équation \(z^2=(1+x^2)^2-1=x^2(x^2+2)\) dans ce plan : c'est la réunion des deux courbes \(z=x\sqrt{x^2+2}\) et \(z=-x\sqrt{x^2+2}\), qui se croisent en \(A\) avec les tangentes dirigées par \((1,0,\pm\sqrt2)\). Près de \(A\), \(\Sigma\) a des points des deux côtés du plan : sur la méridienne \(z=0\), \(y=1+x^2\geqslant1\) ; sur le parallèle \(x=0\), \(y=\sqrt{1-z^2}\leqslant1\). La surface traverse son plan tangent, comme en un col (point hyperbolique), et la section par ce plan dessine une croix (cours, §9).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Hyperboloïde engendré par la rotation d'une droite</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format de l'épreuve de Mathématiques PT (thème <em>courbes et surfaces</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Certaines tours métalliques sont faites de poutres <strong>rectilignes</strong> inclinées, et pourtant leur silhouette est courbe : c'est un hyperboloïde de révolution. On modélise ce phénomène.<br>
    Soit \(\Delta\) la droite passant par \(O\) dirigée par \(\vec u=(1,1,0)\), et \(D\) la droite passant par \(B(0,0,1)\) dirigée par \(\vec\imath=(1,0,0)\). On note \(\Sigma\) la surface engendrée par la rotation de \(D\) autour de \(\Delta\).
  </div>

  <p class="exo-part">Partie A — Équation de la surface</p>
  <div class="q"><strong>A1.</strong> Justifier que \(D\) et \(\Delta\) ne sont ni sécantes ni parallèles. Quelle nature de surface le cours laisse-t-il alors prévoir pour \(\Sigma\) ?</div>
  <div class="q"><strong>A2.</strong> Montrer que \(\Sigma\) a pour équation \(z^2-2xy=1\).</div>
  <div class="q"><strong>A3.</strong> On pose \(X=\dfrac{x+y}{\sqrt2}\) et \(Y=\dfrac{y-x}{\sqrt2}\) (coordonnées dans un repère orthonormé dont le premier axe est \(\Delta\)). Écrire l'équation de \(\Sigma\) en \((X,Y,z)\) ; reconnaître \(\Sigma\) et préciser son cercle de gorge.</div>

  <p class="exo-part">Partie B — Génératrices et plan tangent</p>
  <div class="q"><strong>B1.</strong> Montrer que la droite \(D'\) passant par \(B\) et dirigée par \(\vec\jmath\) est contenue dans \(\Sigma\).</div>
  <div class="q"><strong>B2.</strong> Déterminer toutes les droites contenues dans \(\Sigma\) passant par \(B\).</div>
  <div class="q"><strong>B3.</strong> Donner le plan tangent à \(\Sigma\) en \(B\). Que contient-il ? Préciser la position de \(\Sigma\) par rapport à ce plan au voisinage de \(B\).</div>
  <div class="q"><strong>B4.</strong> En déduire, sans calcul, que par tout point du cercle de gorge passent au moins deux droites contenues dans \(\Sigma\).</div>

  <p class="exo-part">Partie C — Une section plane</p>
  <div class="q"><strong>C1.</strong> Soit \(\Gamma=\Sigma\cap\mathcal P\) où \(\mathcal P : z=x+y\). Déterminer la projection de \(\Gamma\) sur \((xOy)\), puis un paramétrage de \(\Gamma\).</div>
  <div class="q"><strong>C2.</strong> Déterminer la tangente à \(\Gamma\) en \(E(1,0,1)\) de deux façons.</div>
  <div class="q"><strong>C3.</strong> Déterminer la projection de \(\Gamma\) sur \((xOz)\) et sa nature.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(D=\{(s,0,1)\}\) et \(\Delta=\{(\mu,\mu,0)\}\) : un point commun imposerait \(1=0\), donc pas d'intersection ; les directions \((1,0,0)\) et \((1,1,0)\) ne sont pas colinéaires, donc pas de parallélisme. \(D\) et \(\Delta\) ne sont donc pas coplanaires et, comme \((1,0,0)\cdot(1,1,0)=1\neq0\), \(D\) n'est pas orthogonale à \(\Delta\) : on attend un <strong>hyperboloïde de révolution à une nappe</strong> (confirmé en A3).</p>
    <p><strong>A2.</strong> \(O\in\Delta\). \(M\in\Sigma\) si et seulement s'il existe \(P\in D\) tel que \(\overrightarrow{OM}\cdot\vec u=\overrightarrow{OP}\cdot\vec u\) et \(OM^2=OP^2\). Avec \(P=(s,0,1)\) : \(\overrightarrow{OP}\cdot\vec u=s\), \(OP^2=s^2+1\). La première condition donne \(s=x+y\) (déterminé de façon unique), la seconde \(x^2+y^2+z^2=(x+y)^2+1\), soit</p>
    <div class="formula">$$\Sigma : z^2-2xy=1.$$</div>
    <p><strong>A3.</strong> \(x=\tfrac{X-Y}{\sqrt2}\), \(y=\tfrac{X+Y}{\sqrt2}\), donc \(2xy=X^2-Y^2\) et \(\Sigma : Y^2+z^2-X^2=1\). L'équation ne dépend que de \(X\) et de \(Y^2+z^2\) (carré de la distance à \(\Delta\)) : surface de révolution d'axe \(\Delta\) ; la méridienne du plan \(Y=0\) est l'hyperbole \(z^2-X^2=1\). C'est un <strong>hyperboloïde de révolution à une nappe</strong>. Cercle de gorge (\(X=0\)) : \(Y^2+z^2=1\), de rayon 1, égal à la distance entre \(D\) et \(\Delta\) (leur perpendiculaire commune est \((Oz)\)).</p>
    <p><strong>B1.</strong> Les points de \(D'\) sont \((0,s,1)\) : \(1-0=1\). Donc \(D'\subset\Sigma\).</p>
    <p><strong>B2.</strong> Pour \(\vec w=(\alpha,\beta,\gamma)\neq\vec 0\) :</p>
    <div class="formula">$$F(B+\lambda\vec w)=(1+\lambda\gamma)^2-2\lambda^2\alpha\beta-1=2\gamma\lambda+(\gamma^2-2\alpha\beta)\lambda^2.$$</div>
    <p>Identiquement nul \(\iff\gamma=0\) et \(\alpha\beta=0\) : \(\vec w\) colinéaire à \(\vec\imath\) ou à \(\vec\jmath\). Les droites cherchées sont exactement \(D\) et \(D'\).</p>
    <p><strong>B3.</strong> \(\nabla F=(-2y,-2x,2z)\), \(\nabla F(B)=(0,0,2)\) : plan tangent \(z=1\). Il contient \(D\) et \(D'\), et \(\Sigma\cap\{z=1\}\) a pour équation \(xy=0\) : c'est exactement \(D\cup D'\). Près de \(B\), \(z=\sqrt{1+2xy}\) est \(>1\) si \(xy>0\) et \(\lt 1\) si \(xy \lt 0\) : \(\Sigma\) traverse son plan tangent (point hyperbolique, comme en tout point de \(\Sigma\)).</p>
    <p><strong>B4.</strong> Les rotations d'axe \(\Delta\) laissent \(\Sigma\) invariante et transforment une droite en droite. \(B\) est sur le cercle de gorge (\(X=Y=0\), \(z=1\)), et tout point \(G\) de ce cercle est l'image de \(B\) par une rotation \(\mathcal R\) d'axe \(\Delta\). Alors \(\mathcal R(D)\) et \(\mathcal R(D')\) sont deux droites distinctes de \(\Sigma\) passant par \(G\). (On peut montrer que c'est vrai en tout point de \(\Sigma\) : surface doublement réglée.)</p>
    <p><strong>C1.</strong> En reportant \(z=x+y\) : \((x+y)^2-2xy=x^2+y^2=1\). Pour tout point du cercle unité, \(z=x+y\) existe : la projection est le cercle \(\{x^2+y^2=1,\ z=0\}\) entier. Paramétrage :</p>
    <div class="formula">$$\Gamma : t\mapsto(\cos t,\ \sin t,\ \cos t+\sin t),\qquad t\in[0,2\pi[.$$</div>
    <p>\(\Gamma\) est la section du cylindre \(x^2+y^2=1\) par le plan \(\mathcal P\) : une ellipse.</p>
    <p><strong>C2.</strong> \(E\) correspond à \(t=0\) ; \(\overrightarrow{M'(t)}=(-\sin t,\cos t,\cos t-\sin t)\), donc \(\overrightarrow{M'(0)}=(0,1,1)\) : tangente \(\{x=1,\ z=y+1\}\). Avec les gradients : \(\nabla F(E)=(0,-2,2)\), et pour \(G=x+y-z\), \(\nabla G=(1,1,-1)\) ; \((0,-2,2)\wedge(1,1,-1)=(0,2,2)\), colinéaire à \((0,1,1)\).</p>
    <p><strong>C3.</strong> On élimine \(y=z-x\) (toujours défini) : \(z^2-2x(z-x)=1\), soit</p>
    <div class="formula">$$2x^2-2xz+z^2=1.$$</div>
    <p>La matrice \(\begin{pmatrix}2&-1\\-1&1\end{pmatrix}\) a pour déterminant 1 et pour trace 3 : valeurs propres \(\lambda_{1,2}=\tfrac{3\mp\sqrt5}{2}\), toutes deux positives. C'est une ellipse entière centrée en \(O\) (voir le chapitre <em>Réduction des coniques</em>), de demi-axes \(1/\sqrt{\lambda_1}\approx1{,}618\) et \(1/\sqrt{\lambda_2}\approx0{,}618\) — le nombre d'or et son inverse !</p>
  </div>
