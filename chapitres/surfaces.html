  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite la partie « Surfaces » du programme de PT (section « Courbes et surfaces »), en application directe des fonctions de deux ou trois variables : gradient, plan tangent, règle de la chaîne. Les courbes paramétrées de l'espace prolongent le chapitre Courbes planes paramétrées ; les courbes du plan d'équation \(f(x,y)=0\) sont au chapitre Courbes du plan et coniques.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Courbe de l'espace</strong> définie par l'intersection de deux surfaces \(f=0\), \(g=0\) ; point régulier (gradients linéairement indépendants), tangente (§1, §5).</li>
        <li><strong>Surface paramétrée</strong> \((u,v)\mapsto M(u,v)\) de classe \(C^1\), point régulier, courbes coordonnées, plan tangent dirigé par les vecteurs tangents aux courbes coordonnées, vecteur normal, droite normale ; équation ou paramétrage du plan tangent (§2).</li>
        <li><strong>Surface d'équation</strong> \(f(x,y,z)=0\), surfaces de niveau, point régulier, le gradient est normal au plan tangent et orienté vers les valeurs croissantes de \(f\) ; équation du plan tangent (§3).</li>
        <li><strong>Surface</strong> \(z=f(x,y)\) : plan tangent, interprétation géométrique des points critiques (§3, §4).</li>
        <li><strong>Courbe tracée sur une surface</strong> : sa tangente en un point régulier est incluse dans le plan tangent (§5).</li>

      </ul>
      <p>Hors programme : la définition et la classification des quadriques, toute connaissance spécifique sur les surfaces réglées ou développables ; le passage général d'une équation cartésienne à un paramétrage. Les exemples (cônes, cylindres, hyperboloïdes, paraboloïdes, tore) sont là pour s'entraîner, pas pour être appris par cœur.</p>

<div class="course-section">
  <div class="sec-num">§1 · COURBES DE L'ESPACE</div>
  <h2>Courbes paramétrées et courbes définies par deux équations</h2>
  <div class="intro">Une courbe de l'espace se décrit de deux manières : comme la trajectoire d'un point mobile (un paramètre \(t\)), ou comme l'intersection de deux surfaces (deux équations). En PT, on passe constamment d'un point de vue à l'autre, en particulier pour obtenir une tangente ou une projection. L'espace est rapporté à un repère orthonormé direct \((O;\vec\imath,\vec\jmath,\vec k)\).</div>

  <h3>Courbe paramétrée (rappel)</h3>
  <div class="def-box">
    Soit \(I\) un intervalle et \(x, y, z : I\to\mathbb{R}\) de classe \(C^1\). La <strong>courbe paramétrée</strong> \(\Gamma\) est l'ensemble des points \(M(t)=\big(x(t),y(t),z(t)\big)\), \(t\in I\). Son <strong>vecteur dérivé</strong> (vecteur vitesse) est \(\overrightarrow{M'(t)}=\big(x'(t),y'(t),z'(t)\big)\).<br>
    Le point \(M(t_0)\) est <strong>régulier</strong> si \(\overrightarrow{M'(t_0)}\neq\vec 0\), <strong>stationnaire</strong> sinon. La courbe est régulière si tous ses points le sont.
  </div>
  <div class="prop-box">
    <strong>Tangente.</strong> En un point régulier, \(\Gamma\) admet une tangente : la droite passant par \(M(t_0)\) et dirigée par \(\overrightarrow{M'(t_0)}\). C'est la position limite de la sécante \(\big(M(t_0)M(t)\big)\) quand \(t\to t_0\). Représentation paramétrique :
    <div class="formula">$$\begin{cases} x = x(t_0)+\lambda\,x'(t_0)\\ y = y(t_0)+\lambda\,y'(t_0)\\ z = z(t_0)+\lambda\,z'(t_0)\end{cases}\qquad \lambda\in\mathbb{R}$$</div>
  </div>
  <div class="notice"><strong>Régularité ≠ géométrie.</strong> Être régulier est une propriété du <em>paramétrage</em> : \(t\mapsto(t^3,2t^3,-t^3)\) décrit une droite, mais \(\overrightarrow{M'(0)}=\vec 0\). En un point stationnaire, on cherche (comme en 1ʳᵉ année) la première dérivée \(\overrightarrow{M^{(p)}(t_0)}\) non nulle : quand elle existe, elle dirige la tangente.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Tangente à la courbe \(t\mapsto(t,\,t^2,\,t^3)\) au point de paramètre \(1\).</span>
    <div class="content">
      <p>\(\overrightarrow{M'(t)}=(1,\,2t,\,3t^2)\) a une première coordonnée égale à 1 : la courbe est régulière. En \(t=1\) : \(M(1)=(1,1,1)\) et \(\overrightarrow{M'(1)}=(1,2,3)\). Tangente : \(x=1+\lambda,\ y=1+2\lambda,\ z=1+3\lambda\), soit en éliminant \(\lambda\) : \(y=2x-1\) et \(z=3x-2\).</p>
    </div>
  </div>

  <h3>Courbe définie par deux équations</h3>
  <div class="def-box">
    Soit \(F\) et \(G\) de classe \(C^1\) sur un ouvert de \(\mathbb{R}^3\). L'ensemble \(\Gamma\) des points vérifiant \(F(x,y,z)=0\) <strong>et</strong> \(G(x,y,z)=0\) est l'intersection de deux surfaces ; c'est « en général » une courbe.
  </div>
  <div class="prop-box">
    <strong>Tangente à une intersection.</strong> Soit \(M_0\in\Gamma\). Si \(\nabla F(M_0)\) et \(\nabla G(M_0)\) ne sont <strong>pas colinéaires</strong>, alors (résultat admis) \(\Gamma\) est, au voisinage de \(M_0\), une courbe régulière, et sa tangente en \(M_0\) est dirigée par
    <div class="formula">$$\vec w=\nabla F(M_0)\wedge\nabla G(M_0).$$</div>
    C'est la droite d'intersection des plans tangents en \(M_0\) aux deux surfaces (voir §3).
  </div>
  <p><strong>Pourquoi ?</strong> Si \(t\mapsto M(t)\) paramètre \(\Gamma\) près de \(M_0=M(t_0)\), alors \(F\big(M(t)\big)=0\) pour tout \(t\). La règle de la chaîne (chapitre <em>Fonctions de plusieurs variables</em>) donne \(\nabla F\big(M(t)\big)\cdot\overrightarrow{M'(t)}=0\) ; de même pour \(G\). Le vecteur tangent est donc orthogonal aux deux gradients : il est colinéaire à leur produit vectoriel.</p>
  <div class="notice"><strong>Gradients colinéaires</strong> : les deux surfaces sont tangentes en \(M_0\) et la règle ne s'applique plus. L'intersection peut alors présenter un point double, se réduire à un point, etc. : on étudie directement.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Tangente en \(A(1,2,2)\) à l'intersection de la sphère \(x^2+y^2+z^2=9\) et du cylindre \(x^2+y^2=5\).</span>
    <div class="content">
      <p>\(A\) vérifie les deux équations. \(\nabla F(A)=(2,4,4)\), \(\nabla G(A)=(2,4,0)\), non colinéaires. \((2,4,4)\wedge(2,4,0)=(-16,\,8,\,0)\), colinéaire à \((-2,1,0)\).</p>
      <p>Contrôle : en soustrayant les équations, \(z^2=4\) ; \(\Gamma\) est formée des deux cercles horizontaux \(z=\pm2\), \(x^2+y^2=5\). La tangente en \(A\) au cercle de cote 2 est bien horizontale et orthogonale au rayon \((1,2,0)\).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · NAPPES PARAMÉTRÉES</div>
  <h2>Surfaces décrites par deux paramètres</h2>
  <div class="intro">Une surface se « tisse » avec deux paramètres, comme une carte géographique repère un point du globe par sa longitude et sa latitude. Les deux familles de courbes obtenues en gelant un paramètre forment un quadrillage de la surface, et leurs vecteurs tangents engendrent le plan tangent.</div>

  <div class="def-box">
    Soit \(U\) un ouvert de \(\mathbb{R}^2\) et \(f,g,h : U\to\mathbb{R}\) de classe \(C^1\). La <strong>nappe paramétrée</strong> \(\Sigma\) est l'ensemble des points \(M(u,v)=\big(f(u,v),g(u,v),h(u,v)\big)\), \((u,v)\in U\). On note
    <div class="formula">$$\partial_u M=\frac{\partial M}{\partial u}=\Big(\frac{\partial f}{\partial u},\frac{\partial g}{\partial u},\frac{\partial h}{\partial u}\Big),\qquad \partial_v M=\frac{\partial M}{\partial v}=\Big(\frac{\partial f}{\partial v},\frac{\partial g}{\partial v},\frac{\partial h}{\partial v}\Big).$$</div>
  </div>

  <h3>Courbes coordonnées</h3>
  <p>En gelant \(v=v_0\), on obtient la courbe \(u\mapsto M(u,v_0)\), tracée sur \(\Sigma\), de vecteur tangent \(\partial_u M(u,v_0)\) ; en gelant \(u=u_0\), la courbe \(v\mapsto M(u_0,v)\), de vecteur tangent \(\partial_v M(u_0,v)\). Ce sont les <strong>courbes coordonnées</strong> passant par \(M(u_0,v_0)\). Sur une sphère paramétrée par longitude et latitude, ce sont les méridiens et les parallèles.</p>

  <h3>Point régulier, plan tangent, normale</h3>
  <div class="def-box">
    Le point \(M_0=M(u_0,v_0)\) est <strong>régulier</strong> si la famille \(\big(\partial_u M(u_0,v_0),\ \partial_v M(u_0,v_0)\big)\) est <strong>libre</strong>, c'est-à-dire si \(\partial_u M\wedge\partial_v M\neq\vec 0\) en \((u_0,v_0)\).<br>
    En un point régulier, le <strong>plan tangent</strong> à \(\Sigma\) est le plan passant par \(M_0\) dirigé par \(\partial_u M(u_0,v_0)\) et \(\partial_v M(u_0,v_0)\). La <strong>normale</strong> est la droite passant par \(M_0\) dirigée par \(\vec N=\partial_u M\wedge\partial_v M\).
  </div>
  <div class="prop-box">
    <strong>Équation du plan tangent.</strong> \(M(x,y,z)\) appartient au plan tangent si et seulement si \(\overrightarrow{M_0M}\), \(\partial_u M\), \(\partial_v M\) sont coplanaires (dérivées prises en \((u_0,v_0)\)) :
    <div class="formula">$$\begin{vmatrix} x-x_0 & \partial_u f & \partial_v f\\ y-y_0 & \partial_u g & \partial_v g\\ z-z_0 & \partial_u h & \partial_v h\end{vmatrix}=0 \quad\Longleftrightarrow\quad \vec N\cdot\overrightarrow{M_0M}=0.$$</div>
    En pratique : on calcule \(\vec N=(a,b,c)\), et le plan tangent a pour équation \(a(x-x_0)+b(y-y_0)+c(z-z_0)=0\).
  </div>

  <h3>Cas d'un graphe \(z=g(x,y)\)</h3>
  <div class="prop-box">
    Si \(g\) est de classe \(C^1\), la surface \(z=g(x,y)\) est la nappe \((x,y)\mapsto\big(x,y,g(x,y)\big)\). Avec \(p=\dfrac{\partial g}{\partial x}(x_0,y_0)\) et \(q=\dfrac{\partial g}{\partial y}(x_0,y_0)\) : \(\partial_x M=(1,0,p)\), \(\partial_y M=(0,1,q)\) sont toujours libres, donc <strong>tout point est régulier</strong>, \(\vec N=(-p,-q,1)\) et
    <div class="formula">$$z-z_0=p\,(x-x_0)+q\,(y-y_0).$$</div>
    C'est le développement limité à l'ordre 1 de \(g\) en \((x_0,y_0)\).
  </div>
  <div class="notice"><strong>Un point irrégulier du paramétrage n'est pas forcément un défaut de la surface.</strong> Sur la sphère paramétrée par longitude et latitude, les pôles sont irréguliers (voir l'application), alors que la sphère y admet évidemment un plan tangent (\(z=\pm R\)) : c'est le paramétrage qui dégénère, pas la surface.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Sphère de rayon \(R\) paramétrée par la longitude \(\theta\) et la latitude \(\varphi\) : points réguliers et normale.</span>
    <div class="content">
      <div class="formula">$$M(\theta,\varphi)=\big(R\cos\varphi\cos\theta,\ R\cos\varphi\sin\theta,\ R\sin\varphi\big)$$</div>
      <div class="formula">$$\begin{aligned}\partial_\theta M&=(-R\cos\varphi\sin\theta,\ R\cos\varphi\cos\theta,\ 0)\\ \partial_\varphi M&=(-R\sin\varphi\cos\theta,\ -R\sin\varphi\sin\theta,\ R\cos\varphi)\end{aligned}$$</div>
      <p>Le calcul donne</p>
      <div class="formula">$$\partial_\theta M\wedge\partial_\varphi M=R\cos\varphi\,\overrightarrow{OM}.$$</div>
      <p>Les points réguliers sont ceux où \(\cos\varphi\neq0\) : tous sauf les pôles. La normale est dirigée par \(\overrightarrow{OM}\) : on retrouve que le plan tangent à une sphère est orthogonal au rayon.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SURFACES D'ÉQUATION CARTÉSIENNE</div>
  <h2>Surfaces \(F(x,y,z)=0\) et surfaces de niveau</h2>
  <div class="intro">Beaucoup de surfaces sont données par une équation plutôt que par un paramétrage : sphères, quadriques, surfaces équipotentielles en physique. Le gradient joue alors le rôle du vecteur normal.</div>

  <div class="def-box">
    Soit \(F\) de classe \(C^1\) sur un ouvert \(\Omega\) de \(\mathbb{R}^3\). La <strong>surface d'équation</strong> \(F(x,y,z)=0\) est \(S=\{M\in\Omega : F(M)=0\}\). Pour \(\lambda\in\mathbb{R}\), la <strong>surface de niveau</strong> \(\lambda\) de \(F\) est \(\{F=\lambda\}\), surface d'équation \(F-\lambda=0\).<br>
    Un point \(M_0\in S\) est <strong>régulier</strong> si \(\nabla F(M_0)\neq\vec 0\).
  </div>
  <div class="prop-box">
    <strong>Plan tangent.</strong> En un point régulier \(M_0=(x_0,y_0,z_0)\), le plan tangent à \(S\) est le plan passant par \(M_0\) et <strong>orthogonal à \(\nabla F(M_0)\)</strong> :
    <div class="formula">$$\frac{\partial F}{\partial x}(M_0)\,(x-x_0)+\frac{\partial F}{\partial y}(M_0)\,(y-y_0)+\frac{\partial F}{\partial z}(M_0)\,(z-z_0)=0.$$</div>
    La normale à \(S\) en \(M_0\) est dirigée par \(\nabla F(M_0)\).
  </div>
  <p><strong>Justification.</strong> Pour toute courbe \(C^1\) \(t\mapsto M(t)\) tracée sur \(S\) avec \(M(t_0)=M_0\), on a \(F\big(M(t)\big)=0\) pour tout \(t\), donc \(\nabla F(M_0)\cdot\overrightarrow{M'(t_0)}=0\) : tous les vecteurs tangents aux courbes de \(S\) passant par \(M_0\) sont orthogonaux au gradient. On admet qu'ils remplissent exactement le plan orthogonal à \(\nabla F(M_0)\).</p>
  <div class="prop-box">
    <strong>Gradient et surfaces de niveau.</strong> \(\nabla F(M_0)\) est normal à la surface de niveau de \(F\) passant par \(M_0\), et orienté vers les valeurs <strong>croissantes</strong> de \(F\).
    En physique : le champ \(\vec E=-\nabla V\) est orthogonal aux équipotentielles et dirigé vers les potentiels décroissants ; la densité de flux thermique \(\vec\jmath=-\lambda\nabla T\) (loi de Fourier) est orthogonale aux isothermes.
  </div>

  <h3>Retour au graphe \(z=g(x,y)\)</h3>
  <p>La surface \(z=g(x,y)\) a pour équation \(F(x,y,z)=g(x,y)-z=0\). Alors \(\nabla F=(p,q,-1)\) ne s'annule jamais : tout point est régulier, et l'on retrouve le plan tangent du §2.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Plan tangent à l'ellipsoïde \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}=1\) en un point \(M_0\).</span>
    <div class="content">
      <p>\(\nabla F(M_0)=2\Big(\dfrac{x_0}{a^2},\dfrac{y_0}{b^2},\dfrac{z_0}{c^2}\Big)\neq\vec 0\) car \(O\) n'est pas sur l'ellipsoïde : tout point est régulier. En développant et en utilisant \(F(M_0)=0\) :</p>
      <div class="formula">$$\frac{x\,x_0}{a^2}+\frac{y\,y_0}{b^2}+\frac{z\,z_0}{c^2}=1.$$</div>
      <p>C'est la <strong>règle du dédoublement</strong> : on remplace \(x^2\) par \(x\,x_0\), etc. Plus généralement, pour une quadrique sans termes croisés \(xy\), \(yz\), \(zx\) :</p>
      <div class="formula">$$Ax^2+By^2+Cz^2+2Dx+2Ey+2Gz+H=0,$$</div>
      <p>le plan tangent en un point régulier \(M_0\) est</p>
      <div class="formula">$$A\,x_0x+B\,y_0y+C\,z_0z+D(x+x_0)+E(y+y_0)+G(z+z_0)+H=0.$$</div>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · POSITION PAR RAPPORT AU PLAN TANGENT</div>
  <h2>Au-dessus, au-dessous, ou de part et d'autre ?</h2>
  <div class="intro">Pour la surface \(z=g(x,y)\), comparer \(g\) à son plan tangent près d'un point, c'est étudier le reste d'un développement limité. En un point critique, le plan tangent est horizontal : la question devient celle des extremums locaux (voir le chapitre <em>Fonctions de plusieurs variables</em>).</div>

  <div class="def-box">
    <strong>Notations de Monge.</strong> Pour \(g\) de classe \(C^2\), au point \((x_0,y_0)\) :
    <div class="formula">$$p=\frac{\partial g}{\partial x},\quad q=\frac{\partial g}{\partial y},\quad r=\frac{\partial^2 g}{\partial x^2},\quad s=\frac{\partial^2 g}{\partial x\,\partial y},\quad t=\frac{\partial^2 g}{\partial y^2}.$$</div>
    La matrice hessienne est \(H=\begin{pmatrix} r & s\\ s & t\end{pmatrix}\), symétrique d'après le théorème de Schwarz. (Ne pas confondre ce \(t\) avec un paramètre.)
  </div>
  <p>La formule de Taylor-Young à l'ordre 2 s'écrit :</p>
  <div class="formula">$$g(x_0+h,\,y_0+k)=g(x_0,y_0)+p\,h+q\,k+\tfrac12\big(r\,h^2+2s\,hk+t\,k^2\big)+o\big(h^2+k^2\big).$$</div>
  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(g\) de classe \(C^2\) sur un ouvert, \((x_0,y_0)\) un point <strong>critique</strong> (\(p=q=0\)), \(M_0=(x_0,y_0,z_0)\) le point correspondant de \(\Sigma : z=g(x,y)\) ; le plan tangent en \(M_0\) est le plan horizontal \(z=z_0\).
    <ul style="margin-top:.4rem">
      <li>Si \(rt-s^2>0\) : au voisinage de \(M_0\), \(\Sigma\) reste <strong>d'un même côté</strong> du plan tangent : au-dessus si \(r>0\) (<strong>minimum local</strong>), au-dessous si \(r \lt 0\) (<strong>maximum local</strong>).</li>
      <li>Si \(rt-s^2 \lt 0\) : le plan tangent <strong>traverse</strong> \(\Sigma\) ; \(M_0\) est un <strong>point col</strong> (selle), pas un extremum.</li>
      <li>Si \(rt-s^2=0\) : on ne peut pas conclure à l'ordre 2.</li>
    </ul>
  </div>
  <p><strong>Idée de preuve.</strong> Le signe de \(g-z_0\) près de \((x_0,y_0)\) est celui de la forme quadratique \(Q(h,k)=rh^2+2shk+tk^2\) lorsque \(Q\) est <em>définie</em> (positive ou négative), et \(g-z_0\) prend les deux signes lorsque \(Q\) les prend. Si \(r\neq0\), la mise sous forme canonique donne</p>
  <div class="formula">$$Q(h,k)=r\Big(h+\frac{s}{r}\,k\Big)^2+\frac{rt-s^2}{r}\,k^2,$$</div>
  <p>de signe constant (celui de \(r\)) si \(rt-s^2>0\), et prenant les deux signes si \(rt-s^2 \lt 0\). En termes de valeurs propres \(\lambda_1,\lambda_2\) de \(H\) : \(rt-s^2=\det H=\lambda_1\lambda_2\) et \(r+t=\lambda_1+\lambda_2\).</p>
  <div class="notice"><strong>Cas douteux \(rt-s^2=0\).</strong> En \(O\), les surfaces \(z=x^2+y^4\) et \(z=x^2-y^4\) ont les mêmes \(r=2\), \(s=t=0\) ; la première reste au-dessus du plan \(z=0\) (minimum), la seconde le traverse (le long de l'axe \((Oy)\), \(z=-y^4 \lt 0\)). Seule une étude directe du signe de \(g-z_0\) tranche.</div>
  <div class="notice"><strong>Pour aller plus loin.</strong> En un point non critique, le même raisonnement s'applique à l'écart \(g-(z_0+ph+qk)\) entre la surface et son plan tangent : si \(rt-s^2>0\), la surface est localement d'un seul côté (point <em>elliptique</em> : sphère, ellipsoïde, \(z=x^2+y^2\)) ; si \(rt-s^2 \lt 0\), le plan tangent la coupe (point <em>hyperbolique</em> : tout point de \(z=xy\), voir §6).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Position de \(z=x^2+xy+y^2-3x\) par rapport à son plan tangent en son point critique.</span>
    <div class="content">
      <p>\(p=2x+y-3\), \(q=x+2y\) : le seul point critique est \((2,-1)\), avec \(z_0=-3\). \(r=2\), \(s=1\), \(t=2\), donc \(rt-s^2=3>0\) et \(r>0\) : la surface est au-dessus du plan \(z=-3\) près de \((2,-1,-3)\) — minimum local.</p>
      <p>Ici, le calcul exact</p>
      <div class="formula">$$g(2+h,-1+k)+3=h^2+hk+k^2=\Big(h+\frac k2\Big)^2+\frac34k^2\geqslant0$$</div>
      <p>montre même que c'est un minimum global.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · COURBES TRACÉES SUR UNE SURFACE</div>
  <h2>Toute tangente est dans le plan tangent</h2>
  <div class="intro">Le plan tangent rassemble toutes les directions dans lesquelles on peut « partir » d'un point en restant sur la surface. C'est l'outil clé pour relier courbes et surfaces.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> On suppose la courbe \(\Gamma\) incluse dans la surface \(\Sigma\), et \(M_0\in\Gamma\) régulier aussi bien pour le paramétrage de \(\Gamma\) que pour \(\Sigma\). Alors la <strong>tangente en \(M_0\) à \(\Gamma\) est une droite du plan tangent en \(M_0\) à \(\Sigma\)</strong>.
  </div>
  <p><strong>Preuve.</strong> Si \(\Sigma\) est donnée par \(F=0\) : on dérive \(F\big(M(t)\big)=0\), d'où \(\nabla F(M_0)\cdot\overrightarrow{M'(t_0)}=0\). Si \(\Sigma\) est une nappe et \(\Gamma : t\mapsto M\big(u(t),v(t)\big)\) avec \(u,v\) de classe \(C^1\), la règle de la chaîne donne</p>
  <div class="formula">$$\frac{\mathrm{d}}{\mathrm{d}t}\,M\big(u(t),v(t)\big)=u'(t)\,\partial_u M+v'(t)\,\partial_v M,$$</div>
  <p>combinaison linéaire des deux vecteurs qui dirigent le plan tangent.</p>
  <div class="prop-box">
    <strong>Conséquences.</strong>
    <ul style="margin-top:.4rem">
      <li>Le plan tangent en \(M_0\) est la réunion des tangentes en \(M_0\) aux courbes régulières tracées sur \(\Sigma\) (les deux courbes coordonnées suffisent à l'engendrer).</li>
      <li>Si deux surfaces régulières en \(M_0\) ont des plans tangents distincts, la tangente à leur courbe d'intersection est l'intersection de ces deux plans : on retrouve la direction \(\nabla F\wedge\nabla G\) du §1.</li>
      <li>Deux surfaces sont <strong>tangentes</strong> en \(M_0\) si elles y ont le même plan tangent (gradients colinéaires).</li>
      <li>Une droite contenue dans \(\Sigma\) est sa propre tangente : elle est contenue dans le plan tangent en chacun de ses points réguliers (utile au §6).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Vérifier que \(\Gamma : t\mapsto(\cos t,\sin t,\sin 2t)\) est tracée sur \(z=2xy\), puis contrôler le théorème en \(t=\pi/4\).</span>
    <div class="content">
      <p>\(2\cos t\sin t=\sin 2t\) : \(\Gamma\) est sur la surface. En \(t=\pi/4\) : \(M_0=\big(\tfrac{\sqrt2}{2},\tfrac{\sqrt2}{2},1\big)\), \(\overrightarrow{M'}=(-\sin t,\cos t,2\cos 2t)\), soit \(\overrightarrow{M'}=\big(-\tfrac{\sqrt2}{2},\tfrac{\sqrt2}{2},0\big)\).</p>
      <p>Avec \(p=2y_0=\sqrt2\) et \(q=2x_0=\sqrt2\), le plan tangent est \(z=\sqrt2\,x+\sqrt2\,y-1\), de vecteur normal \((\sqrt2,\sqrt2,-1)\). Produit scalaire avec \(\overrightarrow{M'}\) : \(-1+1+0=0\). La tangente est bien dans le plan tangent.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SURFACES RÉGLÉES</div>
  <h2>Surfaces engendrées par une droite mobile</h2>
  <div class="intro">Une surface réglée se construit avec des droites : on peut la réaliser avec des barres ou des poutres rectilignes. C'est ce qui rend les hyperboloïdes et les paraboloïdes hyperboliques si présents en architecture (tours aéroréfrigérantes, toitures en « selle de cheval »).</div>

  <div class="def-box">
    Une surface \(\Sigma\) est <strong>réglée</strong> si elle est réunion d'une famille de droites \((D_t)_{t\in I}\), appelées <strong>génératrices</strong>. Si \(D_t\) passe par \(A(t)\) et est dirigée par \(\vec u(t)\neq\vec 0\) (fonctions \(C^1\)) :
    <div class="formula">$$M(t,\lambda)=A(t)+\lambda\,\vec u(t),\qquad (t,\lambda)\in I\times\mathbb{R}.$$</div>
    La courbe \(t\mapsto A(t)\), qui rencontre chaque génératrice, est une <strong>directrice</strong>.
  </div>
  <div class="prop-box">
    <strong>Plan tangent le long d'une génératrice.</strong> \(\partial_t M=A'(t)+\lambda\,\vec u\,'(t)\) et \(\partial_\lambda M=\vec u(t)\). En un point régulier, le plan tangent contient donc la direction \(\vec u(t)\) : <strong>il contient la génératrice passant par ce point</strong>. Normale : \(\vec N=\big(A'(t)+\lambda\,\vec u\,'(t)\big)\wedge\vec u(t)\).
  </div>
  <div class="notice"><strong>Pour aller plus loin.</strong> \(\vec N(\lambda)=A'\wedge\vec u+\lambda\,\vec u\,'\wedge\vec u\). Si \(A'(t)\), \(\vec u(t)\), \(\vec u\,'(t)\) sont coplanaires (cylindres, cônes), \(\vec N\) garde une direction fixe : le plan tangent est le même tout le long de la génératrice. Sinon (comme pour \(z=xy\)), il tourne autour de la génératrice quand \(\lambda\) varie.</div>

  <h3>Exemples à connaître</h3>
  <ul>
    <li><strong>Cylindre</strong> : génératrices toutes parallèles à un vecteur fixe \(\vec u\), \(M(t,\lambda)=A(t)+\lambda\vec u\). Une équation \(\Phi(x,y)=0\) où \(z\) n'apparaît pas définit un cylindre de direction \((Oz)\) (ex. \(x^2+y^2=R^2\), \(y=x^2\)).</li>
    <li><strong>Cône</strong> de sommet \(S\) : toutes les génératrices passent par \(S\), \(M(t,\lambda)=S+\lambda\vec u(t)\). Ex. \(x^2+y^2=z^2\) : cône de révolution d'axe \((Oz)\) et de sommet \(O\).</li>
    <li><strong>Paraboloïde hyperbolique</strong> \(z=xy\) : par \(M_0(a,b,ab)\) passent les deux droites \(\{x=a,\ z=ay\}\) et \(\{y=b,\ z=bx\}\). Surface <strong>doublement réglée</strong>.</li>
    <li><strong>Hyperboloïde à une nappe</strong> \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}-\dfrac{z^2}{c^2}=1\) : lui aussi doublement réglé (voir les exercices).</li>
  </ul>

  <h3>Droites contenues dans une surface</h3>
  <p>La droite passant par \(M_0\in S\) et dirigée par \(\vec w=(\alpha,\beta,\gamma)\neq\vec 0\) est contenue dans \(S : F=0\) si et seulement si \(F(M_0+\lambda\vec w)=0\) <strong>pour tout</strong> \(\lambda\in\mathbb{R}\). Lorsque \(F\) est polynomiale, c'est un polynôme en \(\lambda\) qui doit être identiquement nul : tous ses coefficients sont nuls. Le coefficient constant vaut \(F(M_0)=0\) ; celui de \(\lambda\) vaut \(\nabla F(M_0)\cdot\vec w\) : la droite est dans le plan tangent, comme annoncé au §5.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Droites contenues dans \(z=xy\) passant par \(M_0(a,b,ab)\).</span>
    <div class="content">
      <div class="formula">$$(a+\lambda\alpha)(b+\lambda\beta)-(ab+\lambda\gamma)=\lambda(\alpha b+\beta a-\gamma)+\lambda^2\alpha\beta.$$</div>
      <p>Ce polynôme en \(\lambda\) est identiquement nul si et seulement si \(\alpha\beta=0\) et \(\gamma=\alpha b+\beta a\). D'où \(\vec w=(1,0,b)\) ou \(\vec w=(0,1,a)\) : exactement deux droites, celles de la liste ci-dessus.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SURFACES DE RÉVOLUTION</div>
  <h2>Faire tourner une courbe autour d'un axe</h2>
  <div class="intro">Les pièces tournées (arbres, poulies, réservoirs, verres…) sont des surfaces de révolution. Elles se décrivent par leur profil : la méridienne.</div>

  <div class="def-box">
    Une surface \(\Sigma\) est <strong>de révolution d'axe \(\Delta\)</strong> si elle est invariante par toutes les rotations d'axe \(\Delta\). De façon équivalente, \(\Sigma\) est réunion de cercles « d'axe \(\Delta\) » — chacun a son centre sur \(\Delta\) et son plan perpendiculaire à \(\Delta\) — et, éventuellement, de points de \(\Delta\).
    <ul style="margin-top:.4rem">
      <li>Les cercles d'axe \(\Delta\) contenus dans \(\Sigma\) sont les <strong>parallèles</strong> (sections par les plans orthogonaux à \(\Delta\)).</li>
      <li>Un <strong>plan méridien</strong> est un plan contenant \(\Delta\) ; la section de \(\Sigma\) par un plan méridien est une <strong>méridienne</strong>, symétrique par rapport à \(\Delta\). Une demi-méridienne suffit à engendrer \(\Sigma\) par rotation.</li>
    </ul>
  </div>

  <figure class="schema" style="max-width:300px">
  <svg viewBox="0 0 300 230" role="img" aria-label="Surface de révolution d'axe delta vertical : deux méridiennes forment le profil, des ellipses représentent les parallèles, dont le cercle de gorge">
    <line x1="150" y1="222" x2="150" y2="8" class="sk-dash" marker-end="url(#sk-arrow-ink)"/>
    <text x="158" y="16" class="lab-it">Δ</text>
    <path d="M80,30 Q130,115 80,200" class="sk-ink"/>
    <path d="M220,30 Q170,115 220,200" class="sk-accent2"/>
    <ellipse cx="150" cy="30" rx="70" ry="12" class="sk-ink"/>
    <ellipse cx="150" cy="200" rx="70" ry="12" class="sk-ink"/>
    <ellipse cx="150" cy="115" rx="45" ry="8" class="sk-accent"/>
    <text x="232" y="190" class="lab-accent2">méridienne</text>
    <text x="40" y="112" class="lab-accent">parallèle</text>
  </svg>
  <figcaption>Surface de révolution : le profil (méridienne) tourne autour de l'axe Δ ; chaque point décrit un parallèle.</figcaption>
  </figure>

  <h3>Paramétrage (axe \((Oz)\))</h3>
  <div class="prop-box">
    Soit \(\Gamma : t\mapsto\big(x(t),y(t),z(t)\big)\). En tournant autour de \((Oz)\), le point \(M(t)\) décrit le cercle d'axe \((Oz)\), de cote \(z(t)\) et de rayon \(\rho(t)=\sqrt{x(t)^2+y(t)^2}\) (sa distance à l'axe). La surface engendrée admet le paramétrage
    <div class="formula">$$M(t,\theta)=\big(\rho(t)\cos\theta,\ \rho(t)\sin\theta,\ z(t)\big),\qquad (t,\theta)\in I\times\mathbb{R}.$$</div>
  <div class="notice">
    <strong>Avec une matrice de rotation.</strong> La même surface est décrite par \((t,\theta)\mapsto R_\theta\,M(t)\), où \(R_\theta\) est la matrice de la rotation d'axe \((Oz)\) et d'angle \(\theta\) (chapitre Isométries vectorielles) :
    <div class="formula">$$R_\theta=\begin{pmatrix}\cos\theta & -\sin\theta & 0\\ \sin\theta & \cos\theta & 0\\ 0 & 0 & 1\end{pmatrix},\qquad \begin{pmatrix}x\\ y\\ z\end{pmatrix}=R_\theta\begin{pmatrix}x(t)\\ y(t)\\ z(t)\end{pmatrix}.$$</div>
    Ce paramétrage coïncide avec le précédent quand \(\Gamma\) est tracée dans le demi-plan \(\{y=0,\ x\geqslant0\}\) ; sinon, il s'en déduit par un décalage de l'angle \(\theta\) (l'angle polaire du point \((x(t), y(t))\) du plan), et décrit la même surface. Pour un axe \((Ox)\), on utilise de même la matrice qui laisse \(x\) fixe et fait tourner \((y,z)\). Par exemple, la courbe \(y=g(x)\) du plan \((xOy)\), avec \(g\geqslant 0\), engendre en tournant autour de \((Ox)\) la surface \(M(x,\theta)=\big(x,\ g(x)\cos\theta,\ g(x)\sin\theta\big)\), d'équation \(y^2+z^2=g(x)^2\).
  </div>

    Si \(\Gamma\) est une demi-méridienne du plan \((xOz)\) donnée par \(x=\rho(t)\geqslant0\), \(z=z(t)\), c'est directement ce paramétrage.
  </div>

  <h3>Équation cartésienne</h3>
  <div class="prop-box">
    <strong>Axe \((Oz)\).</strong> Une rotation d'axe \((Oz)\) conserve \(z\) et \(x^2+y^2\). Une surface est de révolution d'axe \((Oz)\) si et seulement si elle admet une équation de la forme
    <div class="formula">$$\Phi\big(x^2+y^2,\ z\big)=0.$$</div>
    <strong>Élimination</strong> : on écrit
    <div class="formula">$$M(x,y,z)\in\Sigma\iff\exists t\in I,\quad z=z(t)\quad\text{et}\quad x^2+y^2=x(t)^2+y(t)^2,$$</div>
    puis on élimine \(t\).
  </div>
  <div class="prop-box">
    <strong>Axe quelconque \(\Delta\)</strong>, passant par \(A\) et dirigé par \(\vec u\). Le parallèle d'un point \(P\) est l'intersection du plan passant par \(P\) orthogonal à \(\Delta\) et de la sphère de centre \(A\) passant par \(P\). Donc :
    <div class="formula">$$M\in\Sigma\iff\exists P\in\Gamma,\quad \overrightarrow{AM}\cdot\vec u=\overrightarrow{AP}\cdot\vec u\quad\text{et}\quad AM^2=AP^2.$$</div>
  </div>

  <h3>Surfaces de révolution usuelles (axe \((Oz)\))</h3>
  <ul>
    <li>Cylindre : \(x^2+y^2=R^2\) ; cône de demi-angle \(\alpha\) : \(x^2+y^2=z^2\tan^2\alpha\) ; sphère : \(x^2+y^2+z^2=R^2\).</li>
    <li>Paraboloïde de révolution : \(z=x^2+y^2\) (rotation de la parabole \(z=x^2\) du plan \((xOz)\)).</li>
    <li>Hyperboloïde à une nappe : \(x^2+y^2-z^2=1\) ; à deux nappes : \(x^2+y^2-z^2=-1\) (rotation des hyperboles \(x^2-z^2=\pm1\)).</li>
    <li>Tore : \(\big(\sqrt{x^2+y^2}-a\big)^2+z^2=b^2\) avec \(0 \lt b \lt a\) (rotation d'un cercle de rayon \(b\) dont le centre est à la distance \(a\) de l'axe).</li>
  </ul>
  <div class="notice"><strong>Rotation d'une droite \(D\) autour de \(\Delta\).</strong> \(D\) parallèle à \(\Delta\) : cylindre. \(D\) sécante à \(\Delta\) : cône (ou plan entier si \(D\perp\Delta\)). \(D\) non coplanaire à \(\Delta\) : hyperboloïde de révolution à une nappe (ou plan privé d'un disque si \(D\) est orthogonale à \(\Delta\)).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Surface engendrée par la rotation de la droite \(D : \{y=0,\ z=2x\}\) autour de \((Oz)\).</span>
    <div class="content">
      <p>Un point de \(D\) s'écrit \(P=(s,0,2s)\). \(M\in\Sigma\iff\exists s,\ z=2s\ \text{et}\ x^2+y^2=s^2\). En éliminant \(s=z/2\) : \(x^2+y^2=\dfrac{z^2}{4}\).</p>
      <p>\(D\) coupe l'axe en \(O\) : on obtient un cône de révolution de sommet \(O\) et de demi-angle \(\alpha\) tel que \(\tan\alpha=\tfrac12\).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · PROJECTION D'UNE COURBE</div>
  <h2>Projeter une courbe sur un plan de coordonnées</h2>
  <div class="intro">Pour « voir » une courbe gauche, on la projette sur les plans de coordonnées : c'est le principe de la géométrie descriptive (vues de face, de dessus, de côté) utilisée en dessin industriel.</div>

  <div class="def-box">
    La projection orthogonale sur le plan \((xOy)\) est \(\pi : (x,y,z)\mapsto(x,y,0)\).
    <ul style="margin-top:.4rem">
      <li>Courbe paramétrée : \(\pi(\Gamma)\) est la courbe \(t\mapsto\big(x(t),y(t),0\big)\).</li>
      <li>Courbe \(\Gamma=\{F=0,\ G=0\}\) : un point \((x,y,0)\) est dans \(\pi(\Gamma)\) si et seulement s'il existe \(z\) tel que \((x,y,z)\in\Gamma\) :</li>
    </ul>
    <div class="formula">$$(x,y,0)\in\pi(\Gamma)\iff\exists z\in\mathbb{R},\quad F(x,y,z)=0\quad\text{et}\quad G(x,y,z)=0.$$</div>
  </div>
  <div class="prop-box">
    <strong>Élimination.</strong> En éliminant \(z\) entre les deux équations, on obtient une équation \(H(x,y)=0\). Le cylindre \(H(x,y)=0\), de direction \((Oz)\), contient \(\Gamma\) : c'est le <strong>cylindre projetant</strong>. On a \(\pi(\Gamma)\subset\{H(x,y)=0,\ z=0\}\), l'inclusion pouvant être <strong>stricte</strong>.
  </div>
  <div class="notice"><strong>Piège classique.</strong> L'élimination perd les conditions d'existence de la variable éliminée (un carré doit être positif, une racine définie…). Il faut toujours déterminer quels points de \(H=0\) sont effectivement atteints : on obtient parfois un segment au lieu d'une droite, un arc au lieu d'une conique.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Projections de \(\Gamma : \{z=x^2+y^2,\ z=2x+3\}\) sur les trois plans de coordonnées.</span>
    <div class="content">
      <p><strong>Sur \((xOy)\)</strong> : on élimine \(z\) : \(x^2+y^2=2x+3\), soit \((x-1)^2+y^2=4\). Pour tout point de ce cercle, \(z=2x+3\) existe : la projection est le cercle entier.</p>
      <p><strong>Sur \((xOz)\)</strong> : on élimine \(y\) : \(y^2=z-x^2\) impose \(z\geqslant x^2\), avec \(z=2x+3\). Donc \(x^2\leqslant2x+3\), soit \(-1\leqslant x\leqslant3\) : la projection est le <strong>segment</strong> de la droite \(z=2x+3\) d'extrémités \((-1,0,1)\) et \((3,0,9)\), pas la droite entière. (Le plan \(z=2x+3\) est orthogonal à \((xOz)\).)</p>
      <p><strong>Sur \((yOz)\)</strong> : \(x=\tfrac{z-3}{2}\) est toujours défini ; en reportant, \((z-5)^2+4y^2=16\) : une ellipse entière.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SECTIONS PLANES ET LIGNES DE NIVEAU</div>
  <h2>Couper une surface pour en deviner l'allure</h2>
  <div class="intro">Une carte topographique représente un relief par ses courbes de niveau : on coupe la montagne par des plans horizontaux et l'on projette les sections sur le plan de la carte. Le même procédé, appliqué dans les trois directions, donne rapidement l'allure d'une surface.</div>
  <div class="def-box">
    La <strong>section</strong> d'une surface \(\Sigma\) par un plan \(\Pi\) est la courbe \(\Sigma\cap\Pi\), définie par le système formé d'une équation de \(\Sigma\) et d'une équation de \(\Pi\). Pour la surface \(z=f(x,y)\), la section par le plan horizontal \(z=c\), projetée sur \((xOy)\), est la <strong>ligne de niveau</strong> \(c\) de \(f\) : la courbe du plan d'équation \(f(x,y)=c\).
  </div>
  <div class="prop-box">
    <strong>Lignes de niveau et gradient.</strong> En un point où \(\nabla f\neq\vec 0\), le gradient de \(f\) est orthogonal à la ligne de niveau qui y passe et pointe vers les niveaux croissants (chapitre Courbes du plan et coniques). Des lignes de niveau rapprochées signalent une pente forte ; un point où deux lignes d'un même niveau se croisent est un point critique (col, par exemple).
  </div>
  <figure class="schema">
<svg viewBox="0 0 380 350" role="img" aria-label="Lignes de niveau de f(x, y) = x² − y² : hyperboles de niveau positif d'axe (Ox), de niveau négatif d'axe (Oy), et les deux diagonales au niveau 0 ; un gradient orthogonal à la ligne de niveau">
<line x1="40" y1="174" x2="352" y2="174" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>
<line x1="190" y1="324" x2="190" y2="12" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>

<figcaption>Lignes de niveau de \(f(x,y)=x^2-y^2\) : hyperboles \(x^2-y^2=c\) d'axe \((Ox)\) pour \(c\gt 0\), d'axe \((Oy)\) pour \(c\lt 0\), diagonales pour \(c=0\). Le gradient (vert) est orthogonal à la ligne de niveau et pointe vers les niveaux croissants.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — allure de la surface \(z=x^2-y^2\)</strong>
    <ol>
      <li><strong>Plans horizontaux \(z=c\).</strong> Les sections sont les courbes \(x^2-y^2=c\) : des hyperboles d'axe focal \((Ox)\) si \(c\gt 0\), d'axe focal \((Oy)\) si \(c\lt 0\), et le couple de droites \(y=\pm x\) si \(c=0\) (figure).</li>
      <li><strong>Plans \(y=b\).</strong> La section est la parabole \(z=x^2-b^2\), tournée vers le haut, de sommet \((0,b,-b^2)\).</li>
      <li><strong>Plans \(x=a\).</strong> La section est la parabole \(z=a^2-y^2\), tournée vers le bas.</li>
      <li><strong>Conclusion.</strong> En \(O\), la surface monte dans la direction de \((Ox)\) et descend dans celle de \((Oy)\) : c'est une selle (paraboloïde hyperbolique), et \(O\) est un point col de \(f\), comme le confirme le §4 (\(r=2\), \(t=-2\), \(s=0\), \(rt-s^2=-4\lt 0\)). Le plan tangent \(z=0\) coupe la surface selon les deux droites \(y=\pm x\).</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Sections du cône \(x^2+y^2=z^2\) par des plans.</span>
    <div class="content">
      <p>Par le plan \(z=c\) avec \(c\neq 0\) : le cercle de centre \((0,0,c)\) et de rayon \(|c|\) (un parallèle). Par le plan \(z=0\) : le seul point \(O\).</p>
      <p>Par le plan \(y=b\) avec \(b\neq 0\) : \(z^2-x^2=b^2\), une hyperbole. Par le plan \(y=0\) : les deux génératrices \(z=\pm x\).</p>
      <p>Par le plan \(z=x+1\), parallèle à la génératrice \(z=x\) : en reportant, \(x^2+y^2=(x+1)^2\), soit \(x=\tfrac{y^2-1}{2}\) : la projection sur \((xOy)\) est une parabole. On retrouve que les sections planes d'un cône de révolution sont des coniques (remarque culturelle, aucune connaissance n'est exigée sur ce point).</p>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la section par le plan \(z=c\), courbe de l'espace située à la cote \(c\), avec sa projection sur \((xOy)\), courbe du plan. Elles ont la même équation en \((x,y)\), mais la première vérifie en plus \(z=c\).</div>
</div>

  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes traduisent en calculs les objets géométriques du chapitre : tangentes aux courbes de l'espace, plans tangents aux nappes et aux surfaces cartésiennes, position par rapport au plan tangent, surfaces réglées et de révolution, projections et sections planes.</div>

  <div class="method-box">
    <strong>Méthode 1 — Tangente à une courbe de l'espace</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Courbe paramétrée.</span> Calculer \(\overrightarrow{M'(t)}\), vérifier qu'il est non nul en \(t_0\), puis écrire \(M(t_0)+\lambda\overrightarrow{M'(t_0)}\).</li>
      <li><span class="step">Courbe \(\{F=0,\ G=0\}\).</span> Vérifier que \(M_0\) satisfait les deux équations, calculer \(\nabla F(M_0)\) et \(\nabla G(M_0)\), vérifier qu'ils ne sont pas colinéaires.</li>
      <li><span class="step">Direction.</span> \(\vec w=\nabla F(M_0)\wedge\nabla G(M_0)\) ; simplifier par un facteur commun.</li>
      <li><span class="step">Contrôle.</span> \(\vec w\) doit être orthogonal aux deux gradients ; si la courbe est plane, \(\vec w\) doit être dans son plan.</li>
    </ol>
    <p><em>Exemple éclair :</em> le cercle \(\{x^2+y^2+z^2=6,\ x+y+z=0\}\) passe par \(M_0(1,1,-2)\). \(\nabla F(M_0)=(2,2,-4)\), \(\nabla G=(1,1,1)\), et \((2,2,-4)\wedge(1,1,1)=(6,-6,0)\) : tangente dirigée par \((1,-1,0)\), qui est bien dans le plan \(x+y+z=0\) et orthogonale au rayon \(\overrightarrow{OM_0}\).</p>
    <p><em>Piège</em> : gradients colinéaires (surfaces tangentes) → la règle ne dit rien ; souvent un point double.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Plan tangent à une nappe paramétrée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Retrouver les paramètres.</span> Résoudre \(M(u,v)=M_0\) : il peut y avoir <strong>plusieurs</strong> couples \((u,v)\) (point multiple), donc plusieurs plans tangents.</li>
      <li><span class="step">Dériver.</span> Calculer \(\partial_u M\) et \(\partial_v M\) en \((u_0,v_0)\).</li>
      <li><span class="step">Régularité.</span> Calculer \(\vec N=\partial_u M\wedge\partial_v M\) et vérifier \(\vec N\neq\vec 0\).</li>
      <li><span class="step">Équation.</span> \(\vec N\cdot\overrightarrow{M_0M}=0\) (ou le déterminant \(3\times3\)) ; contrôler que \(M_0\) vérifie l'équation obtenue.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(u,v)=(u+v,\ u-v,\ uv)\) en \((u,v)=(1,2)\) : \(M_0=(3,-1,2)\), \(\partial_u M=(1,1,2)\), \(\partial_v M=(1,-1,1)\), \(\vec N=(3,1,-2)\). Plan tangent : \(3x+y-2z-4=0\), vérifié par \(M_0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Plan tangent à une surface \(F(x,y,z)=0\), plans tangents imposés</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Plan tangent en \(M_0\).</span> Vérifier \(F(M_0)=0\) et \(\nabla F(M_0)\neq\vec 0\), puis \(\nabla F(M_0)\cdot\overrightarrow{M_0M}=0\). Pour une quadrique : règle du dédoublement. Pour un graphe \(z=g(x,y)\) : \(z-z_0=p\,(x-x_0)+q\,(y-y_0)\).</li>
      <li><span class="step">Plan tangent de direction imposée.</span> Parallèle à un plan de normale \(\vec n\) (ou orthogonal à une droite dirigée par \(\vec n\)) : point de contact inconnu \(M_0=(a,b,c)\) ; écrire \(\nabla F(M_0)=\mu\,\vec n\) et \(F(M_0)=0\), puis résoudre en \(\mu\).</li>
      <li><span class="step">Plan tangent contenant une direction.</span> Pour une direction \(\vec d\) : \(\nabla F(M_0)\cdot\vec d=0\) et \(F(M_0)=0\) → en général une courbe de points de contact.</li>
      <li><span class="step">Plan tangent passant par un point.</span> Pour un point \(B\) : \(\nabla F(M_0)\cdot\overrightarrow{M_0B}=0\) et \(F(M_0)=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> sur la sphère \(x^2+y^2+z^2=9\), le dédoublement donne le plan tangent \(x+2y+2z=9\) en \((1,2,2)\). Les plans tangents parallèles à \(x+2y+2z=0\) ont pour points de contact les \(M_0=\mu(1,2,2)\) de la sphère, soit \(\mu=\pm1\) : ce sont \(x+2y+2z=\pm9\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Position d'une surface \(z=g(x,y)\) par rapport à son plan tangent</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Points critiques.</span> Résoudre \(p=q=0\) (attention à n'oublier aucune solution : factoriser) ; le plan tangent y est horizontal.</li>
      <li><span class="step">Dérivées secondes.</span> Calculer \(r,s,t\) en chaque point critique, puis \(rt-s^2=\det H\) et, si besoin, \(r+t=\operatorname{tr} H\).</li>
      <li><span class="step">Conclure.</span> \(rt-s^2>0\) : d'un seul côté, au-dessus si \(r>0\) (minimum local), au-dessous si \(r \lt 0\) (maximum local) ; \(rt-s^2 \lt 0\) : le plan traverse la surface (col).</li>
      <li><span class="step">Cas \(rt-s^2=0\).</span> Étudier directement le signe de \(g(x_0+h,y_0+k)-z_0\) le long de chemins simples (axes, droites \(k=mh\), paraboles) ou par une identité remarquable.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(z=xy-x^2-y^2+3x\), \(p=y-2x+3\) et \(q=x-2y\) s'annulent en \((2,1)\), où \(z_0=3\). Avec \(r=-2\), \(s=1\), \(t=-2\) : \(rt-s^2=3>0\) et \(r \lt 0\), la surface est sous le plan \(z=3\) au voisinage de \((2,1,3)\) (maximum local).</p>
    <p><em>Piège</em> : un minimum local n'est pas forcément global ; pour un extremum global, chercher une minoration explicite.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Paramétrer une surface réglée, puis en trouver une équation</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Génératrice.</span> Pour chaque \(t\), trouver un point \(A(t)\) et un vecteur directeur \(\vec u(t)\) de \(D_t\) : droites parallèles à \(\vec u\) s'appuyant sur une courbe (cylindre), droites issues d'un point \(S\) s'appuyant sur une courbe (cône), droites joignant deux points mobiles \(A(t)\) et \(B(t)\) (\(\vec u=\overrightarrow{A(t)B(t)}\))…</li>
      <li><span class="step">Paramétrage.</span> \(M(t,\lambda)=A(t)+\lambda\vec u(t)\).</li>
      <li><span class="step">Équation cartésienne.</span> Éliminer \(t\) et \(\lambda\) : souvent, une coordonnée donne \(\lambda\) directement (par exemple \(z=\lambda\)), puis une relation trigonométrique (\(\cos^2+\sin^2=1\)) élimine \(t\).</li>
      <li><span class="step">Réciproque.</span> Vérifier que tout point vérifiant l'équation est bien atteint (sinon l'équation définit une surface plus grande).</li>
    </ol>
    <p><em>Exemple éclair :</em> les droites joignant \(A(t)=(t,0,0)\) à \(B(t)=(0,t,1)\) donnent \(M(t,\lambda)=(t-\lambda t,\ \lambda t,\ \lambda)\). Pour \(z\neq0\), \(\lambda=z\) et \(t=y/z\), d'où l'équation \((x+y)\,z=y\) ; réciproquement, les points de cette surface avec \(z=0\) sont ceux de l'axe \((Ox)\), atteints pour \(\lambda=0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Trouver les droites contenues dans une surface</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Mise en équation.</span> Droite passant par \(M_0\in S\), de direction \(\vec w=(\alpha,\beta,\gamma)\neq\vec 0\) : développer \(F(M_0+\lambda\vec w)\) en puissances de \(\lambda\).</li>
      <li><span class="step">Identification.</span> Polynôme nul pour tout \(\lambda\) ⟺ tous ses coefficients nuls. Le coefficient de \(\lambda\) exprime que \(\vec w\) est dans le plan tangent.</li>
      <li><span class="step">Résolution.</span> Les directions sont définies à un facteur près : normaliser (par exemple \(\beta=1\)) après avoir traité séparément le cas \(\beta=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(z=x^2-y^2\) et \(M_0=O\) : \(F(\lambda\vec w)=\lambda^2(\alpha^2-\beta^2)-\lambda\gamma\), nul pour tout \(\lambda\) si et seulement si \(\gamma=0\) et \(\alpha=\pm\beta\). Deux droites, \(y=\pm x\) dans le plan \(z=0\), qui est le plan tangent en \(O\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Surface de révolution : paramétrage et équation cartésienne</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Reconnaître.</span> Une équation ne faisant intervenir que \(x^2+y^2\) et \(z\) est de révolution d'axe \((Oz)\) (idem en permutant les variables).</li>
      <li><span class="step">Axe \((Oz)\).</span> Point courant \(P(t)\) de \(\Gamma\) ; écrire \(z=z(t)\) et \(x^2+y^2=x(t)^2+y(t)^2\), éliminer \(t\). Paramétrage : \(\big(\rho(t)\cos\theta,\rho(t)\sin\theta,z(t)\big)\).</li>
      <li><span class="step">Matrices de rotation.</span> Pour un axe de coordonnées, la surface est l'ensemble des \(R_\theta\,P(t)\), où \(R_\theta\) est la matrice de la rotation d'angle \(\theta\) autour de cet axe : elle laisse fixe la coordonnée de l'axe et fait tourner les deux autres.</li>
      <li><span class="step">Axe quelconque \((A,\vec u)\).</span> \(M\in\Sigma\iff\exists P\in\Gamma\) : \(\overrightarrow{AM}\cdot\vec u=\overrightarrow{AP}\cdot\vec u\) et \(AM^2=AP^2\). Choisir \(A\) simple sur l'axe ; la première condition donne en général le paramètre de \(P\).</li>
      <li><span class="step">Contrôle.</span> Vérifier que \(\Gamma\) est contenue dans la surface obtenue, et interpréter (méridienne, cercle de gorge…).</li>
    </ol>
    <p><em>Exemple éclair :</em> la parabole \(\{y=0,\ z=x^2\}\) tourne autour de \((Ox)\) : avec la rotation qui fixe \(x\), \(R_\theta(x,0,x^2)=\big(x,\ -x^2\sin\theta,\ x^2\cos\theta\big)\), et la surface a pour équation \(y^2+z^2=x^4\).</p>
    <p><em>Piège</em> : l'élimination de \(t\) fait oublier son domaine. Si \(t\) ne décrit qu'un intervalle \(I\) (segment de droite, arc de courbe), seules les cotes \(z\in z(I)\) sont atteintes : on obtient une <strong>portion</strong> de la surface d'équation trouvée (par exemple un tronc de cône au lieu du cône entier).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Projection orthogonale d'une courbe sur un plan de coordonnées</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Choisir la variable à éliminer</span> : \(z\) pour le plan \((xOy)\), \(y\) pour \((xOz)\), \(x\) pour \((yOz)\).</li>
      <li><span class="step">Éliminer</span> entre \(F=0\) et \(G=0\) : on obtient l'équation du cylindre projetant.</li>
      <li><span class="step">Conditions d'existence.</span> Déterminer les points effectivement atteints (\(z^2=\cdots\geqslant0\), domaine…). Conclure par un ensemble précis : courbe entière, arc ou segment.</li>
      <li><span class="step">Si \(\Gamma\) est paramétrée</span> : supprimer simplement la coordonnée correspondante.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\Gamma=\{x^2+y^2=1,\ z=xy\}\), la projection sur \((xOy)\) est le cercle unité ; sur \((xOz)\), on élimine \(y^2=1-x^2\) : \(z^2=x^2(1-x^2)\). La condition d'existence de \(y\), \(|x|\leqslant1\), est automatiquement satisfaite par les points de cette courbe, et le signe de \(y\) se choisit pour avoir \(z=xy\) : la projection est la courbe entière.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Visualiser une surface par ses sections planes et ses lignes de niveau</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Plans horizontaux.</span> Pour \(z=f(x,y)\), couper par \(z=c\) : la projection de la section est la ligne de niveau \(f(x,y)=c\). Noter les valeurs de \(c\) pour lesquelles elle est vide, réduite à un point, ou change de nature.</li>
      <li><span class="step">Plans verticaux.</span> Couper par \(x=a\) et \(y=b\) : on obtient des courbes \(z=f(a,y)\), \(z=f(x,b)\) d'une variable, dont on lit la concavité.</li>
      <li><span class="step">Interpréter.</span> Lignes de niveau fermées autour d'un point : extremum ; deux lignes d'un même niveau qui se croisent : point critique, souvent un col ; lignes serrées : forte pente (le gradient, orthogonal aux lignes de niveau, est grand).</li>
      <li><span class="step">Section par le plan tangent.</span> En un col, la section par le plan tangent est formée de deux courbes qui se croisent au point de contact.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(z=x^2+4y^2\), les sections \(z=c\) sont vides si \(c \lt 0\), réduites à \(O\) si \(c=0\), des ellipses si \(c>0\) ; les sections \(x=a\) et \(y=b\) sont des paraboles tournées vers le haut. C'est une « cuvette » (paraboloïde elliptique), de minimum en \(O\).</p>
  </div>

  <div class="notice"><strong>Pièges fréquents.</strong> Confondre point irrégulier d'un paramétrage et point singulier de la surface (où \(\nabla F=\vec 0\)) ; oublier de vérifier que le point est bien sur la surface ; écrire une équation de plan tangent sans vérifier la régularité ; oublier les conditions d'existence lors d'une élimination ; affirmer qu'un point critique est un extremum sans étudier \(rt-s^2\) ; confondre la section par le plan \(z=c\), courbe de l'espace, avec sa projection sur \((xOy)\).</div>
</div>
</template>
