<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Des liaisons aux systèmes de références</h3>
  <div class="statement">Trois pièces et leur mise en position :
    <ul>
      <li>(a) une platine de moteur, posée sur le bâti par une large face plane (120 × 80 mm), positionnée par deux pions : l'un dans un trou cylindrique de la platine, l'autre dans une rainure oblongue orientée vers le premier ;</li>
      <li>(b) une poulie, montée sur un arbre par un alésage de Ø 25 sur 40 mm de long, en appui contre un épaulement étroit (couronne de Ø 25 à Ø 32), clavetée ;</li>
      <li>(c) un arbre, porté par deux roulements montés sur deux portées de Ø 20 et de 15 mm de long, distantes de 120 mm.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Pour (a) et (b), modéliser chaque contact par une liaison et désigner la surface prépondérante.</div>
  <div class="q"><strong>Q2.</strong> Proposer pour chaque pièce les références (lettres et ordre) qui serviront à spécifier ses surfaces fonctionnelles, et compter les degrés de liberté qu'elles fixent.</div>
  <div class="q"><strong>Q3.</strong> Proposer la spécification de la surface fonctionnelle de chaque pièce : l'alésage de centrage du moteur sur (a), la gorge de la poulie (b), la portée d'un engrenage sur l'arbre (c).</div>
  <div class="q"><strong>Q4.</strong> Pour (a), que changerait l'ordre B | A ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) Large face : appui plan (3 degrés de liberté supprimés), prépondérant ; pion dans le trou : contact court, sphère-cylindre (2) ; pion dans la rainure : il n'arrête que la rotation autour de la normale au plan, sphère-plan (1). Total 6 : mise en position complète et isostatique. (b) \(L/D = 40/25 = 1{,}6 \gt 1{,}5\) : centrage long, pivot glissant (4), prépondérant ; épaulement étroit : sphère-plan (1) ; clavette : arrêt en rotation (1).</p>
    <p><strong>Q2.</strong> (a) A = plan de la face (primaire, 3), B = axe du trou de pion, perpendiculaire à A (secondaire, 2), C = plan médian de la rainure, contenant l'axe B (tertiaire, 1) : 6. (b) A = axe de l'alésage (primaire, 4), B = plan de la face d'appui, perpendiculaire à A (secondaire, 1) ; pour une gorge de révolution, la rotation autour de l'axe est sans effet. (c) Les deux portées travaillent ensemble : référence commune A-B, l'axe commun des deux cylindres associés (4 degrés de liberté ; la position axiale et la rotation propre sont sans effet pour une portée de révolution).</p>
    <p><strong>Q3.</strong> (a) Localisation de l'axe de l'alésage de centrage du moteur, Ø \(t\), par rapport à A | B | C, avec des cotes encadrées depuis B et C (le moteur doit être bien placé, et perpendiculaire à la face). (b) Battement radial (et éventuellement axial) de la gorge par rapport à A : une gorge excentrée ferait varier la tension de la courroie à chaque tour. (c) Battement radial (ou coaxialité Ø \(t\)) de la portée de l'engrenage par rapport à A-B : l'engrenage doit tourner rond autour de l'axe réel de rotation.</p>
    <p><strong>Q4.</strong> L'axe du trou de pion deviendrait primaire : associé seul, sur un contact court, son orientation serait mal définie (le pion autorise un basculement de l'ordre de \(j/L\)), et c'est elle qui orienterait toutes les zones. Or c'est la face qui oriente la platine sur le bâti : l'ordre doit suivre la mise en position.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Spécifier un support de galet à partir de sa fonction</h3>
  <div class="statement">Un support de galet est vissé sur un bâti par deux vis M6 (diamètre au plus 6 mm) qui traversent deux trous lisses du support (diamètre au moins 6,6 mm) et se vissent dans des taraudages du bâti, localisés à Ø 0,2. Le support se pose sur le bâti par sa face inférieure A et bute contre un talon du bâti par sa face latérale B. Il porte un axe fixe de Ø 10, emmanché dans un alésage du support long de 12 mm ; le galet tourne sur cet axe. Exigences : (i) les vis passent toujours ; (ii) l'axe du galet est perpendiculaire à A à 1 mrad près ; (iii) l'axe du galet est à 25 mm de A et à 30 mm de B, à 0,1 mm près dans toutes les directions ; (iv) l'axe ne tourne pas dans le support, le galet tourne sur l'axe. Diamètres proposés : axe 10,023 à 10,032 ; alésage du support 10,000 à 10,015 ; alésage du galet 10,040 à 10,062.</div>
  <div class="q"><strong>Q1.</strong> Exigence (i) : quelle tolérance de localisation Ø \(T\) donner aux deux trous lisses ? Par rapport à quelles références ?</div>
  <div class="q"><strong>Q2.</strong> Exigence (ii) : écrire la spécification d'orientation de l'alésage du support.</div>
  <div class="q"><strong>Q3.</strong> Exigence (iii) : écrire la spécification de position de l'alésage. Est-elle compatible avec celle de Q2 ?</div>
  <div class="q"><strong>Q4.</strong> Exigence (iv) : vérifier la nature des deux ajustements. Où ajouter Ⓔ ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Une vis passe si l'axe du trou lisse est à moins de \((6{,}6 - 6)/2 = 0{,}3\) mm de l'axe du taraudage. L'axe du taraudage est à au plus 0,1 de sa position théorique (Ø 0,2), celui du trou à au plus \(T/2\) : il faut \(T/2 + 0{,}1 \leq 0{,}3\), soit \(T \leq 0{,}4\). Spécification : « 2 × Ø 6,6 … localisation Ø 0,4 | A | B », positions données par des cotes encadrées depuis A et B (les références qui mettent le support en position sur le bâti, comme les taraudages y sont placés).</p>
    <p><strong>Q2.</strong> Sur la longueur de 12 mm, un angle de 1 mrad donne un écart latéral de \(12\times10^{-3} = 0{,}012\) mm : « perpendicularité | Ø 0,012 | A », cadre attaché à la cote du diamètre de l'alésage (on limite son axe).</p>
    <p><strong>Q3.</strong> L'axe doit rester à moins de 0,1 de sa position théorique dans toutes les directions : zone cylindrique de Ø 0,2, « localisation | Ø 0,2 | A | B », avec les cotes encadrées 25 (depuis A) et 30 (depuis B). Compatible : la localisation limite aussi l'orientation, mais à 0,2/12 ≈ 17 mrad seulement ; la perpendicularité Ø 0,012 l'affine. La hiérarchie est respectée : 0,012 \(\lt\) 0,2.</p>
    <p><strong>Q4.</strong> Axe dans le support : \(J_{\max} = 10{,}015 - 10{,}023 = -0{,}008\), \(J_{\min} = 10{,}000 - 10{,}032 = -0{,}032\) : serré, l'axe ne tourne pas. Galet sur l'axe : \(J_{\max} = 10{,}062 - 10{,}023 = 0{,}039\), \(J_{\min} = 10{,}040 - 10{,}032 = 0{,}008\) : glissant, le galet tourne. Ⓔ sur l'alésage du galet et sur l'axe, pour garantir le jeu minimal de 8 µm sur toute la longueur ; utile aussi sur l'alésage du support, pour que le serrage soit réparti sans point dur.</p>
  </div>
</div>

<div class="exo">

    <p><strong>Q2.</strong> Les intervalles de tolérance s'ajoutent : \(IT(J) = 0{,}2 + 0{,}1 + 0{,}1 = 0{,}4\) mm. Maillon positif au maxi, maillons négatifs au mini : \(J_{\max} = 80{,}1 - 49{,}95 - 28{,}95 = 1{,}2\) mm. Et l'inverse : \(J_{\min} = 79{,}9 - 50{,}05 - 29{,}05 = 0{,}8\) mm. (Vérif : \(J_{\max}-J_{\min} = 0{,}4 = IT(J)\).)</p>

  </div>
  <p class="exo-part">Partie A — Ajustement du roulement</p>
  <div class="q"><strong>A1.</strong> Déterminer la nature de l'ajustement de la bague extérieure dans le logement Ø 47.</div>
  <div class="q"><strong>A2.</strong> Justifier ce choix par le mode de chargement de la bague.</div>
  <div class="q"><strong>A3.</strong> Quel est le rôle de Ⓔ sur le logement ? Que risquerait-on sans elle ?</div>
  <p class="exo-part">Partie B — Mise en position et références</p>
  <div class="q"><strong>B1.</strong> Modéliser les liaisons réalisées par la face et par l'épaulement. Laquelle est prépondérante ? Comparer les angles de basculement autorisés par chacune (la face, de Ø 140, est plane à 0,02 mm près).</div>
  <div class="q"><strong>B2.</strong> En déduire l'ordre des références A | B, et les degrés de liberté fixés par chacune. Pourquoi n'y a-t-il pas de référence tertiaire ?</div>
  <p class="exo-part">Partie C — Décoder la spécification du logement</p>
  <div class="q"><strong>C1.</strong> Remplir la fiche GPS de « localisation | Ø 0,03 | A | B » portée par le logement.</div>
  <div class="q"><strong>C2.</strong> Le logement est long de 14 mm. Quel angle cette spécification permet-elle entre l'axe du logement et la normale à A ? Est-ce suffisant pour le roulement ? Proposer un complément.</div>
  <p class="exo-part">Partie D — Spécifier les trous de fixation</p>
  <div class="q"><strong>D1.</strong> Déterminer la valeur maximale de \(T\) pour que les vis passent toujours.</div>
  <div class="q"><strong>D2.</strong> Justifier les références A | B de cette spécification.</div>
  <p class="exo-part">Partie E — Contrôle</p>
  <div class="q"><strong>E1.</strong> La machine à mesurer donne, pour les quatre trous, les écarts \((\Delta x ; \Delta y)\) à leur position théorique, en mm, après orientation au mieux autour de B : (0,12 ; −0,25), (−0,30 ; 0,18), (0,05 ; 0,38), (−0,26 ; −0,33). Avec la valeur de D1, conclure.</div>
  <div class="q"><strong>E2.</strong> Pour le logement, elle donne les centres de deux sections, à 2 mm et à 12 mm de la face A, par rapport à l'axe B : (0,008 ; −0,006) et (−0,004 ; 0,011). Conclure sur la localisation, puis sur le complément de C2.</div>
  <div class="q"><strong>E3.</strong> Quelle réserve faut-il faire sur ces conclusions ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Bague : 46,989 à 47,000 ; logement : 47,000 à 47,025. \(J_{\max} = 47{,}025 - 46{,}989 = 0{,}036\), \(J_{\min} = 47{,}000 - 47{,}000 = 0\) : \(J_{\min} \geq 0\), ajustement <strong>glissant</strong> (jeu de 0 à 36 µm).</p>
    <p><strong>A2.</strong> La bague extérieure est fixe, comme la direction de la charge : elle est toujours chargée sur la même zone et n'a pas tendance à cheminer dans son logement. Un montage glissant suffit et facilite le montage et la dilatation (roulement libre). La bague intérieure, qui tourne par rapport à la charge, est montée serrée sur l'arbre. Si la charge tournait avec l'arbre (un balourd), ce serait l'inverse.</p>
    <p><strong>A3.</strong> Avec Ⓔ, le logement contient un cylindre parfait de Ø 47,000, au moins égal au plus grand diamètre de la bague : celle-ci entre toujours, sans serrage, sur toute la longueur. Sans Ⓔ, un logement ovalisé ou conique pourrait respecter ses tailles locales et pincer la bague par endroits : roulement serré radialement, échauffement, durée de vie réduite.</p>
    <p><strong>B1.</strong> Épaulement : \(L/D = 6/80 = 0{,}075\), centrage très court, sphère-cylindre (linéaire annulaire), 2 degrés de liberté supprimés ; il laisse basculer le flasque d'environ \(0{,}05/6 \approx 8\cdot10^{-3}\) rad. Face : appui plan, 3 degrés de liberté ; plane à 0,02 sur 140 mm, elle fixe l'orientation à \(0{,}02/140 \approx 1{,}4\cdot10^{-4}\) rad près, environ soixante fois mieux. La face est prépondérante.</p>
    <p><strong>B2.</strong> A (plan, primaire) fixe la translation selon l'axe et les deux rotations perpendiculaires (3) ; B (axe du centrage, associé perpendiculairement à A, secondaire) fixe les deux translations radiales (2). Reste la rotation autour de l'axe : elle est sans effet sur le logement, de révolution autour de B ; pour les trous, c'est l'assemblage par les vis lui-même qui la règle, d'où la zone de localisation libre de tourner autour de B (pas de référence tertiaire).</p>
    <p><strong>C1.</strong> Type : position, localisation. Élément tolérancé : unique, dérivé : la ligne médiane du logement Ø 47 (cadre attaché à la cote du diamètre). Éléments de référence : la face d'appui et le cylindre de centrage. Références spécifiées : système A | B ; A, plan tangent à la face du côté extérieur à la matière ; B, axe du plus petit cylindre circonscrit à l'épaulement, contraint perpendiculaire à A. Zone : simple, un cylindre de Ø 0,03. Contraintes : axe de la zone perpendiculaire à A et confondu avec B (cote encadrée nulle, implicite). Conformité : l'axe réel du logement tout entier dans ce cylindre.</p>
    <p><strong>C2.</strong> Un axe droit qui traverse le cylindre de Ø 0,03 sur 14 mm peut s'incliner de \(0{,}03/14 \approx 2{,}1\cdot10^{-3}\) rad : plus que le 1 mrad admis par le roulement. On ajoute une orientation plus fine : « perpendicularité | Ø 0,012 | A » (au plus \(14\times10^{-3} = 0{,}014\) ; on prend 0,012), cohérente avec la hiérarchie (0,012 \(\lt\) 0,03).</p>
    <p><strong>D1.</strong> Une vis passe si l'axe du trou lisse est à moins de \((9 - 8)/2 = 0{,}5\) mm de l'axe du taraudage. Celui-ci est à au plus 0,1 de sa position théorique, l'axe du trou à au plus \(T/2\) : \(T/2 + 0{,}1 \leq 0{,}5\), d'où \(T \leq 0{,}8\) mm.</p>
    <p><strong>D2.</strong> Les taraudages du carter sont placés par rapport à ses surfaces d'appui et de centrage ; le flasque est placé sur le carter par A et B. Pour que les positions théoriques des trous et des taraudages coïncident à l'assemblage, les trous doivent être localisés par rapport aux surfaces qui réalisent cette mise en position : A puis B.</p>
    <p><strong>E1.</strong> Diamètres équivalents \(2\sqrt{\Delta x^2 + \Delta y^2}\) : 0,555 ; 0,700 ; 0,767 ; 0,840 mm. Les trois premiers sont conformes à Ø 0,8, le quatrième ne l'est pas : le flasque est <strong>refusé</strong> (une spécification « 4 × » porte sur les quatre trous).</p>
    <p><strong>E2.</strong> Distances des centres à B : \(\sqrt{0{,}008^2 + 0{,}006^2} = 0{,}010\) et \(\sqrt{0{,}004^2 + 0{,}011^2} \approx 0{,}0117\) mm, soit des diamètres équivalents de 0,020 et 0,023 \(\leq 0{,}03\) : localisation conforme. Mais les deux centres sont écartés latéralement de \(\sqrt{0{,}012^2 + 0{,}017^2} \approx 0{,}021\) mm : aucun cylindre de Ø 0,012 perpendiculaire à A ne peut les contenir tous deux. La perpendicularité de C2 n'est <strong>pas</strong> respectée (l'axe est incliné d'environ \(0{,}021/10 \approx 2{,}1\) mrad) : conforme à la spécification d'origine, la pièce ne l'est pas à l'exigence du roulement, ce qui justifie le complément.</p>
    <p><strong>E3.</strong> Ce sont des mesures sur des points extraits (quatre positions de trous à une profondeur donnée, deux sections du logement) : elles suffisent pour refuser une pièce, mais une conformité n'est établie que sur l'échantillon mesuré ; la définition porte sur toute la ligne médiane. L'incertitude de la machine doit en outre rester petite devant les tolérances (ici quelques micromètres devant 0,012 mm).</p>
