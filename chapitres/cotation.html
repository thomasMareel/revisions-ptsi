  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la spécification géométrique des produits (cotation GPS, pour <em>Geometrical Product Specification</em>), au semestre S2 du programme de sciences industrielles (compétence A5, « analyser un compromis produit-procédés-matériaux »). Il apprend à <strong>lire</strong> une spécification sur un dessin de définition, à dire <strong>pourquoi</strong> elle est là (la fonction qu'elle garantit) et à la relier aux <strong>liaisons</strong> du mécanisme. Il s'appuie sur <a href="#liaisons/cours">« Liaisons, graphe et schéma cinématique »</a> et sert en 2ᵉ année à <a href="#conception/cours">« Conception des liaisons »</a> (ajustements, montages de roulements) et à <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a> (contrôle des pièces).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Justifier le besoin fonctionnel d'une spécification</strong> (A5, S2) : rôle d'une spécification pour la fonction, la fabrication et le contrôle (§1) ; spécifier à partir de la fonction (§12).</li>
        <li><strong>Principes</strong> d'indépendance, de la pièce rigide, de l'élément, de dualité, d'invocation et de responsabilité (§2).</li>
        <li><strong>Modèles</strong> nominal, extrait et skin model ; <strong>opérations</strong> de partition, collection, filtrage, extraction, construction et association (§3).</li>
        <li><strong>Définition d'une spécification</strong> : condition unilimite sur une caractéristique dimensionnelle (§4).</li>
        <li><strong>Décoder les spécifications géométriques par taille</strong> (§5), avec la <strong>nature des ajustements</strong> : glissant, incertain, serré (§6) ; <strong>par gabarit</strong> : exigence de l'enveloppe, seul modificateur au programme (§7) ; <strong>par zone</strong> : cadre de tolérance, élément tolérancé, zone, références (§8), tolérances de forme et d'orientation (§9), de position et de battement (§10).</li>
        <li><strong>Analyser le lien entre la liaison mécanique et les systèmes de référence</strong> associés aux surfaces des composants (§11).</li>
        <li><strong>Fiche GPS</strong> : décoder une spécification rubrique par rubrique (§12).</li>
      </ul>
      <p>Non exigibles, regroupés en fin de chapitre : les ajustements normalisés (notation ISO du type H7/g6 : seule la nature de l'ajustement est au programme), les modificateurs autres que l'exigence de l'enveloppe (maximum de matière…), la chaîne de cotes. Relèvent de la 2ᵉ année (chapitre « Triptyque produit–procédé–matériau », S3) : les états de surface et le contrôle tridimensionnel (dispositifs de contrôle, nuages de points, méthodes d'association chiffrées).</p>

<div class="course-section">
  <div class="sec-num">§1 · SPÉCIFIER UNE PIÈCE</div>
  <h2>Pourquoi la géométrie d'une pièce doit être spécifiée</h2>
  <div class="intro">Aucun procédé ne fabrique une pièce exactement conforme à son modèle numérique : chaque surface réelle est un peu trop grande ou trop petite, ondulée, inclinée, décalée. Spécifier, c'est dire <strong>quels écarts sont acceptables</strong> pour que la pièce remplisse sa fonction, et seulement ceux-là, car chaque micromètre gagné se paie.</div>
  <h3>Trois destinataires pour un même dessin</h3>
  <p>Le <strong>dessin de définition</strong> d'une pièce (ou sa maquette numérique annotée) porte, en plus de la forme nominale, des <strong>spécifications</strong>. Il s'adresse à trois métiers, qui doivent tous le comprendre de la même façon :</p>
  <ul>
    <li><strong>la conception</strong>, qui y traduit les exigences fonctionnelles : un arbre doit tourner dans son palier avec un jeu compris entre deux bornes, une face d'appui doit être assez plane pour ne pas basculer, un trou doit être assez bien placé pour laisser passer une vis ;</li>
    <li><strong>la fabrication</strong>, qui choisit les procédés et les réglages capables de tenir ces exigences ;</li>
    <li><strong>le contrôle</strong>, qui décide si une pièce réelle est conforme ou non.</li>
  </ul>
  <p>Une spécification bien écrite est donc un <strong>contrat</strong> sans ambiguïté. C'est elle qui rend possible l'<strong>interchangeabilité</strong> : deux pièces fabriquées dans des ateliers différents, sans se connaître, s'assemblent et fonctionnent.</p>

  <div class="def-box">
    <strong>Les défauts d'une pièce réelle.</strong> On les range en familles : défaut de <strong>taille</strong> (une dimension entre deux points en vis-à-vis), de <strong>forme</strong> (écart d'une surface à la forme parfaite : plan, cylindre…), d'<strong>orientation</strong> (angle d'une surface par rapport à une autre), de <strong>position</strong> (emplacement d'une surface par rapport à une autre), et, à l'échelle microscopique, d'<strong>état de surface</strong> (rugosité, vue en 2ᵉ année).
  </div>
  <p><strong>Précision et coût.</strong> Chaque procédé a une précision naturelle : quelques dixièmes de millimètre pour une pièce moulée au sable, quelques centièmes en tournage ou en fraisage courant, quelques micromètres en rectification. Resserrer une tolérance peut imposer une opération de plus, un contrôle plus lent, un taux de rebut plus élevé. On ne spécifie serré <strong>que ce que la fonction exige</strong> ; le reste relève des tolérances générales, plus larges, indiquées dans le cartouche du dessin.</p>
  <div class="method-box">
    <strong>Exemple — ce que représente une tolérance de ± 0,01 mm</strong>
    <ol>
      <li>Une portée de 50 mm spécifiée à ± 0,01 mm autorise une plage de 0,02 mm = 20 µm, soit environ le quart de l'épaisseur d'un cheveu (≈ 70 µm).</li>
      <li>Une pièce en acier (\(\alpha \approx 12\cdot10^{-6}\ \text{K}^{-1}\)) de 50 mm s'allonge de \(12\cdot10^{-6}\times 50 = 0{,}6\ \text{µm}\) par kelvin ; une pièce en aluminium (\(23\cdot10^{-6}\ \text{K}^{-1}\)) mesurée 5 °C trop chaude paraît plus longue de \(23\cdot10^{-6}\times50\times5 \approx 5{,}8\ \text{µm}\), près d'un tiers de la tolérance. D'où la règle : les dimensions s'entendent à <strong>20 °C</strong>.</li>
      <li>Un pied à coulisse lit au mieux 0,02 mm : c'est toute la tolérance. Il faut un instrument environ dix fois plus fin que la tolérance (de l'ordre de 2 µm), un micromètre numérique par exemple.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une cote sans tolérance est « exacte ». Une dimension réelle n'est jamais exacte ; une cote sans tolérance renvoie simplement aux tolérances générales du cartouche, ou bien c'est une cote <em>encadrée</em>, théorique, qui ne sert qu'à placer une zone de tolérance (§4).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LES PRINCIPES DU LANGAGE GPS</div>
  <h2>Des règles de lecture communes</h2>
  <div class="intro">Le langage GPS (normes ISO) fixe une fois pour toutes comment lire un dessin. Six principes, cités par le programme, suffisent à lever la plupart des ambiguïtés. Ils évitent qu'un fabricant et un client donnent deux sens différents à la même cote.</div>
  <div class="prop-box">
    <strong>Les six principes au programme.</strong>
    <ul>
      <li><strong>Invocation</strong> : dès qu'un dessin emploie une partie du langage GPS (une seule spécification, ou la mention d'une norme ISO GPS), c'est <strong>tout</strong> le système GPS qui s'applique, avec ses règles par défaut.</li>
      <li><strong>Élément</strong> : une pièce se décompose en éléments (surfaces) limités par leurs arêtes naturelles. Par défaut, une spécification porte sur un élément <strong>entier</strong>, et sur un seul élément (ou une seule relation entre éléments) ; pour viser une partie d'une surface ou plusieurs surfaces à la fois, il faut une indication explicite.</li>
      <li><strong>Indépendance</strong> : chaque spécification doit être respectée <strong>pour elle-même</strong>, indépendamment des autres, sauf indication contraire (comme l'exigence de l'enveloppe, §7). En particulier, une tolérance de taille ne limite pas les défauts de forme.</li>
      <li><strong>Pièce rigide</strong> : la pièce est supposée infiniment rigide ; les spécifications s'appliquent à l'<strong>état libre</strong>, sans bridage ni effet de la pesanteur, sauf indication contraire (« à l'état bridé, selon… »).</li>
      <li><strong>Dualité</strong> : une spécification est définie indépendamment de tout moyen de mesure. La vérification, elle, met en œuvre une démarche qui doit s'en approcher le plus possible.</li>
      <li><strong>Responsabilité</strong> : le concepteur répond de la spécification (qu'elle traduise la fonction, sans ambiguïté) ; celui qui déclare une pièce conforme répond de sa mesure et de l'incertitude qui l'accompagne.</li>
    </ul>
  </div>
  <p>Deux autres règles servent tous les jours : les dimensions s'entendent à la <strong>température de référence de 20 °C</strong>, et une valeur écrite « 25 » vaut 25,000… exactement (principe décimal) : le nombre de décimales n'indique pas une précision.</p>

  <div class="method-box">
    <strong>Exemple — le principe d'indépendance sur un arbre cintré</strong>
    <ol>
      <li>Un arbre est spécifié Ø 20 ± 0,02 : toutes ses tailles locales, mesurées entre deux touches en vis-à-vis, doivent être comprises entre 19,98 et 20,02.</li>
      <li>On mesure 20,01 partout : la spécification de taille est respectée.</li>
      <li>L'axe est pourtant cintré, avec une flèche \(f = 0{,}03\) mm. Le plus petit cylindre qui contient l'arbre a pour diamètre \(20{,}01 + 0{,}03 = 20{,}04\) mm : l'arbre n'entre pas dans un alésage parfait de 20,02 mm.</li>
      <li>Conclusion : la taille ne dit rien de la forme. Si la fonction exige le montage dans un alésage, il faut ajouter une tolérance de forme (rectitude de l'axe) ou l'exigence de l'enveloppe Ⓔ (§7).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — responsabilité et incertitude de mesure</strong>
    <p>Une cote a un intervalle de tolérance de 20 µm. Le contrôleur mesure avec une incertitude \(U = 2\ \text{µm}\). Pour <em>prouver</em> la conformité, la valeur mesurée doit tomber à plus de \(U\) des deux limites : la zone de conformité prouvée ne mesure plus que \(20 - 2\times2 = 16\ \text{µm}\), soit 80 % de la tolérance. Avec \(U = 5\ \text{µm}\), il ne resterait que 10 µm : l'instrument « mange » la moitié de la tolérance, et l'on rebute des pièces bonnes.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : vérifier une pièce souple (bague mince, tôle) bridée sur son montage de contrôle et la déclarer conforme. Par le principe de la pièce rigide, la spécification vaut à l'état libre : si l'état bridé est voulu, le dessin doit le dire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MODÈLES ET OPÉRATIONS</div>
  <h2>De la surface réelle à un nombre</h2>
  <div class="intro">Une spécification limite une grandeur. Mais une surface réelle n'a ni « diamètre » ni « axe » : ce sont des notions de géométrie parfaite. Le langage GPS décrit donc précisément comment passer de la surface réelle à des éléments parfaits, puis à un nombre que l'on compare à une limite.</div>
  <div class="def-box">
    <strong>Trois modèles de la pièce.</strong>
    <ul>
      <li>Le <strong>modèle nominal</strong> : la pièce parfaite définie par le concepteur (formes idéales, dimensions nominales), celle du dessin et de la maquette numérique.</li>
      <li>Le <strong>skin model</strong> (modèle de peau) : un modèle de la <strong>surface réelle</strong> de la pièce, l'interface entre la matière et son environnement, avec tous ses défauts possibles ; il compte une infinité de points. C'est sur lui que le concepteur raisonne quand il imagine les variations de la pièce.</li>
      <li>Le <strong>modèle extrait</strong> : un nombre fini de points pris sur la surface (le nuage de points d'une machine à mesurer, ou les points d'un raisonnement).</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Éléments.</strong> Un élément <strong>intégral</strong> est une surface de la pièce (ou une ligne tracée sur elle). Un élément <strong>dérivé</strong> s'en déduit : centre d'une sphère, axe (ligne médiane) d'un cylindre, plan médian de deux faces parallèles. Un élément est <strong>idéal</strong> s'il a une forme parfaite (plan, droite, cylindre exacts) ; l'élément <strong>associé</strong> est l'élément idéal que l'on ajuste sur un élément réel ou extrait.
  </div>
  <h3>Les opérations</h3>
  <p>Toute spécification se lit comme une suite d'opérations sur ces modèles :</p>
  <ul>
    <li><strong>partition</strong> : isoler, dans la surface réelle, l'élément concerné (la face supérieure, l'alésage de gauche) ;</li>
    <li><strong>extraction</strong> : ne retenir qu'un nombre fini de points de cet élément ;</li>
    <li><strong>filtrage</strong> : séparer les échelles de défauts (garder la forme, éliminer la rugosité, par exemple par le rayon de la bille du palpeur) ;</li>
    <li><strong>association</strong> : ajuster un élément idéal sur l'élément réel selon un critère (au plus près, tangent du côté extérieur à la matière…), éventuellement sous contrainte (perpendiculaire à une référence, par exemple) ;</li>
    <li><strong>collection</strong> : réunir plusieurs éléments que l'on considère ensemble (les deux portées d'un arbre, un groupe de quatre trous) ;</li>
    <li><strong>construction</strong> : construire de nouveaux éléments idéaux à partir d'autres (intersection de deux plans, plan médian, droite perpendiculaire à un plan passant par un point).</li>
  </ul>
  <p>On <strong>évalue</strong> enfin la caractéristique (une distance, un diamètre, un angle) et on la compare à sa limite.</p>

  <div class="method-box">
    <strong>Exemple — rectitude d'une génératrice, opération par opération</strong>
    <ol>
      <li><span class="step">Partition et extraction.</span> Dans un plan de coupe, on isole une génératrice d'un arbre et l'on relève six points, tous les 20 mm (x en mm) ; écarts à une règle de référence, en µm : 0 ; 2 ; 12 ; 7 ; 4 ; 14.</li>
      <li><span class="step">Association minimax.</span> On cherche deux droites parallèles, aussi proches que possible, qui encadrent les six points. Les points d'abscisses 0 et 80 (écarts 0 et 4) imposent une droite basse de pente \(4/80 = 0{,}05\ \text{µm/mm}\) ; la parallèle passant par le point d'abscisse 40 (écart 12) est à \(12 - 0{,}05\times40 = 10\ \text{µm}\) au-dessus. Les trois autres points sont entre les deux : le défaut de rectitude vaut <strong>10 µm</strong>.</li>
      <li><span class="step">Autre critère.</span> La droite des moindres carrés (pente 0,101 µm/mm) laisse des écarts de −5,5 à +6,5 µm : une bande de 12,1 µm, plus large. Avec une tolérance de 0,011 mm, la pièce est conforme au sens de la définition (zone minimale), mais serait refusée à tort par le critère des moindres carrés.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier que l'extraction est un échantillon. Six points ne voient pas un creux situé entre deux d'entre eux ; le nombre et la répartition des points font partie de la démarche de vérification (et de son incertitude). La définition, elle, porte sur toute la surface.</div>

<div class="course-section">
  <div class="sec-num">§4 · CE QU'EST UNE SPÉCIFICATION</div>
  <h2>Une condition, une limite</h2>
  <div class="intro">Toutes les indications d'un dessin, aussi variées qu'elles paraissent, se ramènent à une même forme : une grandeur, calculée sur la pièce réelle par les opérations du §3, doit rester d'un côté d'une limite.</div>
  <div class="def-box">
    <strong>Spécification.</strong> Condition <strong>unilimite</strong> portant sur une <strong>caractéristique dimensionnelle</strong> (une longueur ou un angle) définie à partir d'éléments de la pièce : la caractéristique doit être inférieure ou égale à une limite supérieure, <strong>ou</strong> supérieure ou égale à une limite inférieure.
  </div>
  <div class="formula" data-nom="Spécification">$$C \leq C_{\max} \qquad \text{ou} \qquad C \geq C_{\min}$$</div>
  <p>Une cote tolérancée « ± » comporte donc <strong>deux</strong> spécifications (une limite supérieure, une limite inférieure) ; une tolérance géométrique n'en comporte qu'une (la largeur de la zone qui contient l'élément est au plus égale à \(t\)).</p>
  <h3>Trois manières de spécifier</h3>
  <div><table>
    <tr><th>Spécification</th><th>Ce qu'elle limite</th><th>Exemple d'écriture</th><th>Section</th></tr>
    <tr><td><strong>par taille</strong></td><td>les tailles locales d'un élément de taille (distance entre deux points en vis-à-vis)</td><td>Ø 20 ± 0,02</td><td>§5, §6</td></tr>
    <tr><td><strong>par zone</strong></td><td>l'élément tolérancé doit tenir dans une zone de forme et de largeur données, éventuellement placée par rapport à des références</td><td>cadre « planéité 0,05 », « localisation Ø 0,1 A B C »</td><td>§8 à §10</td></tr>
    <tr><td><strong>par gabarit</strong></td><td>la surface ne doit pas franchir une forme parfaite (une enveloppe)</td><td>Ø 20 ± 0,02 Ⓔ</td><td>§7</td></tr>
  </table></div>
  <div class="def-box">
    <strong>Cote encadrée.</strong> Dimension <strong>théoriquement exacte</strong>, écrite dans un rectangle, sans tolérance : elle ne se vérifie pas pour elle-même, elle sert à <strong>placer ou orienter</strong> une zone de tolérance par rapport aux références (distances, angles, entraxes).
  </div>
  <div class="method-box">
    <strong>Exemple — réécrire trois indications en conditions</strong>
    <ol>
      <li>« Ø 20 ± 0,02 » : pour chaque taille locale \(d_\ell\) du cylindre, \(d_\ell \leq 20{,}02\) <strong>et</strong> \(d_\ell \geq 19{,}98\) : deux conditions unilimites. Trois tailles mesurées 19,99 ; 20,01 ; 20,03 : la troisième viole la première condition.</li>
      <li>« planéité 0,05 » sur une face : la distance des deux plans parallèles les plus proches qui encadrent la face vaut au plus 0,05 mm : une condition.</li>
      <li>« Ø 20 ± 0,02 Ⓔ » : les deux conditions de taille, plus une condition de gabarit : le plus petit cylindre parfait qui contient l'arbre mesure au plus 20,02 (§7).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : vérifier une cote encadrée au pied à coulisse. Une cote encadrée n'a pas de tolérance propre : l'écart réel de position est jugé par la zone de tolérance qu'elle place (§10).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · SPÉCIFICATION DE TAILLE</div>
  <h2>Cotes tolérancées et tailles locales</h2>
  <div class="intro">La spécification la plus ancienne et la plus courante : un diamètre, une épaisseur, une largeur de rainure, avec deux limites. Le langage GPS précise sur quoi elle porte exactement : les tailles locales d'un élément de taille.</div>
  <div class="def-box">
    <strong>Élément de taille, taille locale.</strong> Un <strong>élément de taille</strong> est une surface (ou un couple de surfaces) dont la géométrie est définie par une dimension : cylindre (diamètre), sphère, deux plans parallèles en vis-à-vis (épaisseur, largeur de rainure). Par défaut, la tolérance porte sur ses <strong>tailles locales</strong> : distances entre deux points en vis-à-vis de l'élément réel, mesurées dans toutes les sections.
  </div>
  <div class="def-box">
    <strong>Cote tolérancée.</strong> Une <strong>cote nominale</strong> \(N\) et deux <strong>écarts</strong> algébriques, supérieur \(ES\) et inférieur \(EI\) ; on l'écrit par exemple \(50^{+0{,}05}_{-0{,}02}\), ou \(50 \pm 0{,}03\), ou par ses deux limites.
    <div class="formula" data-nom="Cote tolérancée">$$\text{cote maxi} = N + ES \qquad \text{cote mini} = N + EI \qquad IT = ES - EI$$</div>
    L'<strong>intervalle de tolérance</strong> \(IT\) est la largeur de la plage autorisée ; chaque taille locale doit rester entre la cote mini et la cote maxi.
  </div>
  <figure class="schema" style="max-width:400px">

</figure>
  <div class="def-box">
    <strong>Maximum et minimum de matière.</strong> La taille au <strong>maximum de matière</strong> est la limite pour laquelle la pièce contient le plus de matière : la cote <strong>maxi</strong> pour un arbre (élément extérieur), la cote <strong>mini</strong> pour un alésage (élément intérieur). La taille au minimum de matière est l'autre limite. C'est au maximum de matière que le montage est le plus difficile.
  </div>
  <div class="method-box">
    <strong>Exemple — juger des tailles locales</strong>
    <p>Un alésage est spécifié \(\varnothing 32^{+0{,}025}_{\ 0}\) : cote mini 32,000, cote maxi 32,025, \(IT = 0{,}025\) mm ; maximum de matière 32,000. On relève quatre tailles locales : 32,004 ; 32,018 ; 32,027 ; 32,010. La troisième dépasse la cote maxi : l'alésage n'est <strong>pas conforme</strong>, même si la moyenne des quatre (32,015) est dans la tolérance. Une taille est jugée en chacun de ses points, pas en moyenne.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : tolérancer par « ± » une distance qui n'est pas une taille. Entre deux faces qui ne sont pas en vis-à-vis (une marche), ou entre une face et l'axe d'un trou, il n'existe pas de « points en vis-à-vis » : la cote « 30 ± 0,1 » est ambiguë (mesurée d'où, dans quelle direction, sur quelle partie de la face ?). On la remplace par une cote encadrée et une spécification de localisation (§10).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · AJUSTEMENTS</div>
  <h2>Un arbre dans un alésage : jeu ou serrage</h2>
  <div class="intro">Dès que deux pièces s'emboîtent (un axe dans un palier, une bague dans un logement), leurs deux spécifications de taille décident ensemble du comportement de l'assemblage : les pièces glissent l'une dans l'autre, se montent à la presse, ou l'on ne sait pas d'avance. C'est la <strong>nature de l'ajustement</strong>, seule exigible au programme.</div>
  <div class="def-box">
    <strong>Ajustement.</strong> Assemblage d'un élément intérieur, l'<strong>alésage</strong> (diamètre \(D\), entre \(D_{\min}\) et \(D_{\max}\)), et d'un élément extérieur, l'<strong>arbre</strong> (diamètre \(d\), entre \(d_{\min}\) et \(d_{\max}\)), de même cote nominale. Le <strong>jeu</strong> \(J = D - d\) est positif si l'arbre est plus petit que l'alésage ; un jeu négatif est un <strong>serrage</strong>.
  </div>
  <div class="formula" data-nom="Jeux d'un ajustement">$$J_{\max} = D_{\max} - d_{\min} \qquad J_{\min} = D_{\min} - d_{\max}$$</div>
  <div class="prop-box">
    <strong>Nature de l'ajustement.</strong>
    <ul>
      <li><strong>glissant</strong> (avec jeu) si \(J_{\min} \geq 0\) : il y a toujours du jeu, quelles que soient les pièces tirées dans leurs tolérances ;</li>
      <li><strong>serré</strong> (avec serrage) si \(J_{\max} \leq 0\) : il y a toujours serrage ; le serrage maximal vaut \(d_{\max} - D_{\min} = -J_{\min}\) ;</li>
      <li><strong>incertain</strong> si \(J_{\min} \lt 0 \lt J_{\max}\) : selon les pièces appariées, on obtient un jeu ou un serrage.</li>
    </ul>
  </div>

  <h3>Choisir la nature selon la fonction</h3>
  <div><table>
    <tr><th>Fonction de l'assemblage</th><th>Nature</th><th>Exemples</th></tr>
    <tr><td>un mouvement relatif est voulu (rotation ou translation par glissement)</td><td>glissant</td><td>galet fou sur son axe, tige de vérin dans son guide, palier lisse</td></tr>
    <tr><td>centrer précisément une pièce que l'on démonte de temps en temps ; le couple passe par un obstacle (clavette)</td><td>incertain</td><td>pignon ou poulie claveté sur un arbre, monté au maillet</td></tr>
    <tr><td>immobiliser sans autre élément, transmettre un effort par adhérence</td><td>serré</td><td>douille emmanchée à la presse, bague de roulement qui tourne par rapport à la charge</td></tr>
  </table></div>
  <p>Dans un modèle de mécanisme, un ajustement glissant réalise une liaison qui laisse le mouvement (pivot glissant, sphère-cylindre si le contact est court) ; un ajustement serré réalise un encastrement. Le choix des ajustements d'un montage de roulements est détaillé en 2ᵉ année.</p>
  <div class="method-box">
    <strong>Exemple — trois arbres pour un même alésage</strong>
    <p>Alésage Ø 25, entre 25,000 et 25,021 mm.</p>
    <ol>
      <li>Arbre entre 24,980 et 24,993 : \(J_{\max} = 25{,}021 - 24{,}980 = 0{,}041\) ; \(J_{\min} = 25{,}000 - 24{,}993 = 0{,}007\ \text{mm} \geq 0\) : <strong>glissant</strong>, de 7 à 41 µm de jeu.</li>
      <li>Arbre entre 25,002 et 25,015 : \(J_{\max} = 0{,}019\), \(J_{\min} = -0{,}015\) : <strong>incertain</strong>, d'un jeu de 19 µm à un serrage de 15 µm.</li>
      <li>Arbre entre 25,022 et 25,035 : \(J_{\max} = -0{,}001 \leq 0\), \(J_{\min} = -0{,}035\) : <strong>serré</strong>, serrage de 1 à 35 µm.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croiser les limites. \(J_{\max}\) associe l'alésage <em>maxi</em> à l'arbre <em>mini</em>, \(J_{\min}\) l'alésage <em>mini</em> à l'arbre <em>maxi</em>. Vérification : \(J_{\max} - J_{\min} = IT_{\text{alésage}} + IT_{\text{arbre}}\) (ci-dessus : 0,021 + 0,013 = 0,034). Et un \(J_{\min}\) nul donne bien un ajustement glissant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · EXIGENCE DE L'ENVELOPPE</div>
  <h2>Spécifier par gabarit</h2>
  <div class="intro">Le calcul des jeux du §6 suppose des pièces de forme parfaite. Par le principe d'indépendance, la spécification de taille ne le garantit pas : un arbre cintré ou trilobé peut avoir toutes ses tailles locales conformes et ne pas entrer dans l'alésage. L'exigence de l'enveloppe, notée Ⓔ après la tolérance, comble ce manque. C'est le seul modificateur au programme.</div>
  <div class="def-box">
    <strong>Exigence de l'enveloppe Ⓔ.</strong> Écrite après une tolérance de taille d'un cylindre ou de deux plans parallèles, elle ajoute une condition de <strong>gabarit</strong> : la surface réelle ne doit pas franchir l'<strong>enveloppe de forme parfaite à la taille au maximum de matière</strong> ; les tailles locales, elles, doivent rester du bon côté de la taille au minimum de matière.
    <ul>
      <li>Arbre Ⓔ : il passe dans un cylindre parfait de diamètre \(d_{\max}\), et chaque taille locale est au moins égale à \(d_{\min}\).</li>
      <li>Alésage Ⓔ : il contient un cylindre parfait de diamètre \(D_{\min}\), et chaque taille locale est au plus égale à \(D_{\max}\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Conséquences.</strong> Au maximum de matière, la forme doit être parfaite ; plus la taille réelle s'en éloigne, plus le défaut de forme admis grandit (jusqu'à l'intervalle de tolérance au minimum de matière). Surtout, si l'arbre et l'alésage portent tous deux Ⓔ, l'arbre tient dans un cylindre de diamètre \(d_{\max}\) et l'alésage contient un cylindre de diamètre \(D_{\min} \geq d_{\max}\) : le montage et le jeu minimal \(J_{\min} = D_{\min} - d_{\max}\) sont <strong>garantis</strong>, sur toute la longueur de l'emboîtement.
  </div>

  <div class="method-box">
    <strong>Exemple — un arbre Ø 20 avec enveloppe</strong>
    <p>Arbre \(\varnothing 20^{-0{,}007}_{-0{,}020}\) Ⓔ : \(d_{\max} = 19{,}993\) (maximum de matière), \(d_{\min} = 19{,}980\).</p>
    <ol>
      <li>Un arbre de taille locale 19,985 partout, cintré : son enveloppe vaut \(19{,}985 + f\). Elle doit rester sous 19,993, donc \(f \leq 0{,}008\) mm.</li>
      <li>Un arbre trilobé (section ci-dessus) : le micromètre lit 19,990 dans toutes les directions, mais le cercle circonscrit mesure 19,996. Sans Ⓔ, il serait accepté ; avec Ⓔ, il est refusé (19,996 > 19,993). Son défaut de circularité vaut 0,006 mm (écart des rayons des deux cercles concentriques qui l'encadrent).</li>
      <li>Avec un alésage \(\varnothing 20^{+0{,}021}_{\ 0}\) Ⓔ, le jeu minimal garanti vaut \(20{,}000 - 19{,}993 = 0{,}007\) mm. Sans Ⓔ, un arbre de taille 19,990 cintré de 0,015 aurait une enveloppe de 20,005 : il pourrait ne pas entrer dans un alésage de 20,000.</li>
    </ol>
  </div>
  <p><strong>Vérifier une enveloppe.</strong> Par dualité, le moyen le plus fidèle reproduit la définition : une bague (ou un tampon) de forme complète, au diamètre du maximum de matière, doit passer sur toute la longueur ; une mesure entre deux touches (micromètre, ou calibre « n'entre pas ») contrôle les tailles locales au minimum de matière. Les calibres sont décrits en 2ᵉ année.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire que Ⓔ limite la forme dans tous les cas. Au minimum de matière, l'enveloppe laisse tout l'intervalle de tolérance au défaut de forme (13 µm dans l'exemple). Si la fonction exige une forme serrée quelle que soit la taille (un guidage précis), on ajoute une tolérance de forme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SPÉCIFICATION PAR ZONE : LE CADRE DE TOLÉRANCE</div>
  <h2>Lire un cadre de tolérance</h2>
  <div class="intro">Forme, orientation, position, battement : toutes ces spécifications s'écrivent dans un même <strong>cadre</strong> relié à la pièce, et se lisent toutes de la même façon : un élément tolérancé doit tenir dans une zone de tolérance, éventuellement placée par rapport à des références.</div>

  <div class="def-box">
    <strong>Vocabulaire.</strong>
    <ul>
      <li><strong>Élément tolérancé</strong> : l'élément de la pièce réelle désigné par la flèche du cadre (une surface, ou un élément dérivé : axe, plan médian).</li>
      <li><strong>Zone de tolérance</strong> : espace limité par des éléments idéaux, de largeur ou de diamètre \(t\) : deux plans parallèles distants de \(t\), deux droites parallèles, un cylindre de diamètre \(t\) (valeur précédée de Ø), deux cercles concentriques ou deux cylindres coaxiaux d'écart de rayon \(t\).</li>
      <li><strong>Référence</strong> : élément idéal (plan, droite, point) construit sur une surface réelle désignée par un triangle noirci et une lettre ; les lettres du cadre, dans l'ordre, forment le système de références (§11).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Condition de conformité.</strong> La pièce est conforme si l'élément tolérancé est <strong>tout entier</strong> dans la zone de tolérance. La zone est libre, ou contrainte en orientation et en position par les références et les cotes encadrées.
  </div>

    <strong>Intégral ou dérivé : la place de la flèche.</strong> Flèche posée sur le contour de la surface (ou sur une ligne d'attache), nettement à l'écart des lignes de cote : l'élément tolérancé est la <strong>surface</strong>. Flèche dans le prolongement de la ligne de cote d'un diamètre ou d'une largeur (ou cadre attaché à cette cote) : c'est l'élément <strong>dérivé</strong>, axe ou plan médian. La même règle vaut pour le triangle d'une référence.
  </div>
  <p>Pour un groupe d'éléments identiques (quatre trous), on écrit « 4 × » devant la cote : la spécification porte alors sur la collection des quatre éléments, avec des zones placées les unes par rapport aux autres par des cotes encadrées.</p>

    <strong>Exemple — lire « localisation | Ø 0,1 | A | B | C »</strong>
    <ol>
      <li>Caractéristique : localisation, une tolérance de position.</li>
      <li>Ø 0,1 : la zone est un cylindre de diamètre 0,1 mm ; l'élément tolérancé est donc une ligne, l'axe du trou (le cadre est attaché à la cote du diamètre).</li>
      <li>A, B, C : la zone est perpendiculaire au plan A (référence primaire), et son axe est placé par des cotes encadrées depuis B puis C.</li>
      <li>Conformité : la ligne médiane réelle du trou est tout entière dans ce cylindre (§10).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le Ø. « 0,1 » sans Ø pour un axe définirait une zone entre deux plans distants de 0,1 (une seule direction contrainte) ; « Ø 0,1 » contraint l'axe dans toutes les directions perpendiculaires. Ce ne sont pas les mêmes pièces acceptées.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · TOLÉRANCES DE FORME ET D'ORIENTATION</div>
  <h2>Limiter une forme, une inclinaison</h2>
  <div class="intro">Une face d'appui doit être assez plane pour ne pas basculer, une glissière assez rectiligne pour guider, un alésage assez perpendiculaire à sa face pour que l'arbre ne coince pas. Les tolérances de forme ne regardent que l'élément lui-même ; celles d'orientation le comparent à une référence.</div>
  <div class="def-box">
    <strong>Tolérances de forme</strong> (jamais de référence ; zone libre en position et en orientation, qui s'ajuste au plus près de l'élément) :
    <ul>
      <li><strong>rectitude</strong> : d'une ligne de la surface, entre deux droites parallèles distantes de \(t\) dans le plan de coupe ; d'un axe (Ø \(t\)), dans un cylindre de diamètre \(t\) ;</li>
      <li><strong>planéité</strong> : entre deux plans parallèles distants de \(t\) ;</li>
      <li><strong>circularité</strong> : dans chaque section droite, entre deux cercles concentriques dont les rayons diffèrent de \(t\) ;</li>
      <li><strong>cylindricité</strong> : entre deux cylindres coaxiaux dont les rayons diffèrent de \(t\).</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Tolérances d'orientation</strong> (référence obligatoire ; zone d'orientation imposée, libre en position) : <strong>parallélisme</strong>, <strong>perpendicularité</strong>, <strong>inclinaison</strong> (angle donné par une cote encadrée). Pour une surface plane, la zone est faite de deux plans parallèles distants de \(t\), parallèles, perpendiculaires ou inclinés par rapport à la référence ; pour un axe (Ø \(t\)), c'est un cylindre de diamètre \(t\) ainsi orienté.
  </div>

    <strong>Hiérarchie.</strong> Une zone d'orientation contient aussi le défaut de forme de l'élément : une face conforme à « parallélisme 0,03 » a forcément une planéité au plus égale à 0,03. Une tolérance de forme n'a donc de sens, sur le même élément, que si elle est <strong>plus petite</strong> que la tolérance d'orientation : \(t_{\text{forme}} \lt t_{\text{orientation}}\).
  </div>
  <div class="method-box">
    <strong>Exemple — contrôle d'un parallélisme sur marbre</strong>
    <ol>
      <li>Une pièce repose par sa face A (référence) sur un marbre ; le marbre réalise le plan tangent à A du côté extérieur à la matière, c'est-à-dire la référence spécifiée (§11).</li>
      <li>Un comparateur relève la hauteur de la face supérieure en six points : 25,012 ; 25,020 ; 25,031 ; 25,017 ; 25,025 ; 25,022 mm.</li>
      <li>La zone doit être parallèle à A : sa largeur minimale est l'écart entre la plus grande et la plus petite hauteur, \(25{,}031 - 25{,}012 = 0{,}019\) mm. Avec « parallélisme 0,02 A », la face est conforme (sur ces points).</li>
      <li>Sur la figure, le même profil donne 10 µm en forme et 14 µm en parallélisme : la zone de forme peut s'incliner pour suivre la face, la zone d'orientation non.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — de la tolérance à l'angle</strong>
    <p>Un alésage de longueur 25 mm porte « perpendicularité Ø 0,02 A ». Si son axe est droit et incliné d'un angle \(\alpha\) sur la normale à A, il s'écarte latéralement de \(25\,\alpha\) d'un bout à l'autre ; pour rester dans le cylindre de Ø 0,02 : \(\alpha \leq 0{,}02/25 = 8\cdot10^{-4}\ \text{rad}\), soit 0,046°.</p>
    <div class="formula" data-nom="Angle permis par une tolérance d'orientation">$$\alpha_{\max} \approx \frac{t}{L}$$</div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre planéité et parallélisme. Une face peut être parfaitement plane et pourtant inclinée de 0,1 mm sur sa longueur par rapport à la face opposée : planéité nulle, parallélisme 0,1.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · TOLÉRANCES DE POSITION ET DE BATTEMENT</div>
  <h2>Placer un élément, contrôler une rotation</h2>
  <div class="intro">Un trou doit être au bon endroit pour qu'une vis passe, une portée doit être bien centrée sur l'axe de rotation pour ne pas faire vibrer la machine. Les tolérances de position fixent la zone en orientation <strong>et</strong> en position ; le battement contrôle directement ce que voit un comparateur pendant un tour.</div>
  <div class="def-box">
    <strong>Tolérances de position</strong> (références nécessaires ; zone fixée en orientation et en position) :
    <ul>
      <li><strong>localisation</strong> : la zone (cylindre Ø \(t\) pour un axe, deux plans distants de \(t\) pour une face ou un plan médian) est centrée sur la <strong>position théorique exacte</strong> donnée par des cotes encadrées depuis les références ;</li>
      <li><strong>coaxialité</strong> : l'axe tolérancé doit tenir dans un cylindre de diamètre \(t\) coaxial à l'axe de référence ;</li>
      <li><strong>symétrie</strong> : le plan médian tolérancé (une rainure, un tenon) doit tenir entre deux plans distants de \(t\), symétriques par rapport au plan de référence.</li>
    </ul>
  </div>
  <div class="prop-box">

  <div class="method-box">
    <strong>Exemple — localisation d'un trou</strong>
    <ol>
      <li>Spécification : « localisation Ø 0,1 A B C », cotes encadrées 30 depuis B et 20 depuis C. La position théorique de l'axe est le point (30 ; 20) dans le repère construit sur les références.</li>
      <li>Mesure : l'axe est en (30,036 ; 19,973). Écart radial à la position théorique :
        <div class="formula" data-nom="Écart de localisation">$$r = \sqrt{\Delta x^2 + \Delta y^2} = \sqrt{0{,}036^2 + 0{,}027^2} = 0{,}045\ \text{mm}$$</div>
        Le point est dans le cylindre si \(2r \leq t\) : \(2\times 0{,}045 = 0{,}090 \leq 0{,}1\), conforme (sur cette section).</li>
      <li>Un axe en (30,045 ; 20,040) serait admis par une ancienne cotation « 30 ± 0,05 ; 20 ± 0,05 » (zone carrée), mais il est à \(\sqrt{0{,}045^2 + 0{,}040^2} \approx 0{,}060\) de la position théorique : refusé par la zone Ø 0,1.</li>
      <li>Pourquoi un cylindre ? La fonction (laisser passer une vis) dépend de la <strong>distance</strong> à la position théorique, quelle que soit la direction. Pour garantir 0,05 au plus avec une zone carrée, il faudrait ± 0,035 : un carré d'aire \(0{,}0707^2 = 0{,}005\ \text{mm}^2\), contre \(\pi\times0{,}05^2 \approx 0{,}0079\ \text{mm}^2\) pour le disque. La zone circulaire accepte 57 % de pièces bonnes en plus, pour la même fonction.</li>
    </ol>
  </div>
  <div class="def-box">
    <strong>Battement.</strong> La pièce tourne autour de l'<strong>axe de référence</strong> (souvent l'axe commun de ses deux portées, A-B) ; un comparateur fixe touche l'élément tolérancé. Le <strong>battement simple</strong> est la variation de la lecture pendant un tour, en une position du comparateur ; il est <strong>radial</strong> (comparateur perpendiculaire à l'axe, sur une portée) ou <strong>axial</strong> (parallèle à l'axe, sur une face). Le <strong>battement total</strong> limite la variation sur toute la surface, le comparateur se déplaçant pendant la rotation.
  </div>

    <strong>Battement et excentration.</strong> Une section parfaitement ronde dont le centre est à la distance \(e\) de l'axe de rotation donne une lecture qui varie de \(2e\) pendant un tour. Un battement radial \(t\) impose donc \(e \leq t/2\), défauts de forme compris : il limite à la fois la coaxialité et la circularité, et se vérifie directement, d'où son succès pour les pièces de révolution.

  <div class="method-box">
    <strong>Exemple — battement d'une portée</strong>
    <p>Une portée est excentrée de 12 µm et ovalisée (rayon variant de ± 4 µm, deux fois par tour). La lecture vaut, à une constante près, \(L(\varphi) = 12\cos\varphi + 4\cos 2\varphi\) (en µm). Maximum 16 µm pour \(\varphi = 0\) ; minimum là où \(\cos\varphi = -0{,}75\) : \(12\times(-0{,}75) + 4\times(2\times0{,}75^2 - 1) = -8{,}5\ \text{µm}\). Battement : 24,5 µm, conforme à « battement 0,03 A-B ». L'excentration seule aurait donné 24 µm : le battement mesure l'effet combiné, pas la somme des défauts.</p>
  </div>

</div>

<div class="course-section">
  <div class="sec-num">§11 · RÉFÉRENCES ET LIAISONS</div>
  <h2>Spécifier par rapport aux surfaces qui positionnent la pièce</h2>
  <div class="intro">Une pièce n'est jamais seule : elle est posée, centrée, arrêtée sur une autre par quelques surfaces de contact, ses liaisons. Ce sont ces surfaces qui fixent sa position dans le mécanisme ; c'est donc par rapport à elles que l'on spécifie les surfaces fonctionnelles. Le système de références d'un cadre reproduit cette mise en position.</div>
  <div class="def-box">
    <strong>Élément de référence, référence spécifiée.</strong> L'<strong>élément de référence</strong> est la surface réelle désignée par le triangle (la face d'appui, l'alésage de centrage). La <strong>référence spécifiée</strong> est l'élément idéal qui lui est <strong>associé</strong> : par défaut, l'élément tangent du côté extérieur à la matière qui rend l'écart maximal le plus petit possible. Pour une face plane : le plan tangent extérieur, que réalise en pratique un marbre ; pour un arbre : le plus petit cylindre circonscrit (une bague parfaite) ; pour un alésage : le plus grand cylindre inscrit (un mandrin expansible).
  </div>
  <div class="def-box">
    <strong>Trois sortes de références.</strong>
    <ul>
      <li><strong>simple</strong> : construite sur une seule surface (A) ;</li>
      <li><strong>commune</strong> (A-B, dans une seule case du cadre) : construite sur plusieurs surfaces prises ensemble (collection), par exemple l'axe commun des deux portées de roulement d'un arbre, qui est son véritable axe de rotation ;</li>
      <li><strong>système de références</strong> (A | B | C, dans des cases successives) : construit dans l'ordre. La <strong>primaire</strong> est associée seule ; la <strong>secondaire</strong> est associée sous contrainte d'orientation par rapport à la primaire (axe perpendiculaire au plan A, par exemple) ; la <strong>tertiaire</strong> sous les contraintes des deux premières.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Degrés de liberté fixés.</strong> Une référence fixe la zone de tolérance comme une liaison fixe une pièce. Un plan primaire supprime 3 degrés de liberté (une translation, deux rotations) ; une droite primaire, 4 (deux translations, deux rotations) ; ensuite, un axe secondaire perpendiculaire au plan primaire en supprime 2, un plan secondaire perpendiculaire à un axe primaire 1, et une référence tertiaire la rotation restante. Un système complet en supprime 6 : c'est une mise en position isostatique « 3-2-1 ».
  </div>

  <h3>De la liaison au système de références</h3>
  <div><table>
    <tr><th>Mise en position de la pièce dans le mécanisme</th><th>Modèle de liaison</th><th>Référence</th></tr>
    <tr><td>large face d'appui, prépondérante</td><td>appui plan (3)</td><td>primaire : plan A</td></tr>
    <tr><td>centrage court sur cette face (\(L/D \lt 0{,}8\))</td><td>sphère-cylindre (linéaire annulaire)</td><td>secondaire : axe B, perpendiculaire à A</td></tr>
    <tr><td>centrage long, prépondérant (\(L/D \gt 1{,}5\))</td><td>pivot glissant (4)</td><td>primaire : axe A</td></tr>
    <tr><td>épaulement étroit contre lequel bute la pièce</td><td>sphère-plan (ponctuelle)</td><td>secondaire : plan B, perpendiculaire à A</td></tr>
    <tr><td>pion ou clavette qui arrête la rotation</td><td>sphère-plan (ponctuelle)</td><td>tertiaire : C</td></tr>
  </table></div>
  <p>La <strong>primaire</strong> est la surface prépondérante, celle qui supprime le plus de degrés de liberté et impose l'orientation de la pièce. Le critère est celui des liaisons : un centrage court laisse basculer la pièce d'un angle de l'ordre de \(j/L\) (jeu diamétral sur longueur), il ne fixe pas son orientation (voir <a href="#liaisons/cours">« Liaisons »</a>, §11, pour les conditions géométriques d'un modèle hyperstatique).</p>
  <div class="method-box">
    <strong>Exemple — couvercle centré sur un carter</strong>
    <ol>
      <li>Un couvercle s'appuie sur le carter par une face annulaire de Ø 120 et se centre par un épaulement de Ø 40 sur 8 mm de long, avec un jeu diamétral de 0,03 mm.</li>
      <li>\(L/D = 8/40 = 0{,}2\) : centrage court. Il laisse basculer le couvercle d'environ \(0{,}03/8 \approx 3{,}8\cdot10^{-3}\ \text{rad}\), alors qu'une face plane à 0,02 près sur 120 mm fixe l'orientation à \(0{,}02/120 \approx 1{,}7\cdot10^{-4}\ \text{rad}\) près, vingt fois mieux.</li>
      <li>La face est prépondérante : référence primaire A (3 degrés de liberté), l'axe du centrage est la secondaire B, perpendiculaire à A (2 degrés de liberté). La rotation autour de l'axe reste libre : les vis l'arrêtent, ou un pion qui donnerait une référence tertiaire C.</li>
      <li>Le roulement que porte le couvercle sera spécifié par rapport à A | B, pas par rapport à une face commode pour l'usinage.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : intervertir les références d'un cadre. « A | B » et « B | A » ne définissent pas la même zone : si l'axe d'un centrage court est pris en primaire, son orientation, mal définie, commande toute la spécification. L'ordre des lettres est celui de la mise en position.</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · LIRE ET ÉCRIRE UNE SPÉCIFICATION</div>
  <h2>La fiche GPS, puis le chemin inverse</h2>
  <div class="intro">Décoder une spécification, c'est répondre à quelques questions toujours les mêmes ; on les range dans une <strong>fiche GPS</strong> (on dit aussi fiche d'analyse d'une spécification). Écrire une spécification, c'est faire le chemin inverse, en partant de la fonction.</div>
  <div class="def-box">
    <strong>Rubriques d'une fiche GPS.</strong>
    <div><table>
      <tr><th>Rubrique</th><th>Question</th></tr>
      <tr><td>Type</td><td>forme, orientation, position ou battement ? quelle caractéristique ?</td></tr>
      <tr><td>Élément tolérancé</td><td>unique ou groupe ; intégral (surface) ou dérivé (axe, plan médian) ; nature (plan, cylindre, ligne…)</td></tr>
      <tr><td>Élément(s) de référence</td><td>quelles surfaces réelles, désignées par quels triangles ?</td></tr>
      <tr><td>Référence(s) spécifiée(s)</td><td>simple, commune ou système ; nature de l'élément associé (plan, droite, point) ; ordre</td></tr>
      <tr><td>Zone de tolérance</td><td>forme et dimension (deux plans distants de \(t\), cylindre Ø \(t\)…) ; simple ou composée (plusieurs zones liées)</td></tr>
      <tr><td>Contraintes de la zone</td><td>orientation et position par rapport aux références (parallèle, perpendiculaire, cotes encadrées) ; ou zone libre</td></tr>
      <tr><td>Conformité</td><td>l'élément tolérancé est tout entier dans la zone</td></tr>
    </table></div>
  </div>

  <div class="method-box">
    <strong>Exemple — fiche GPS de la localisation de l'alésage</strong>
    <ol>
      <li><span class="step">Type.</span> Position : localisation, Ø 0,05.</li>
      <li><span class="step">Élément tolérancé.</span> Unique, dérivé : la ligne médiane (l'axe réel) de l'alésage Ø 20, puisque le cadre est attaché à la cote du diamètre.</li>
      <li><span class="step">Éléments de référence.</span> La face inférieure (A) et la face latérale (B).</li>
      <li><span class="step">Références spécifiées.</span> Système A | B : plan A tangent à la face inférieure du côté extérieur à la matière (primaire), puis plan B tangent à la face latérale et perpendiculaire à A (secondaire). Leur intersection donne une direction.</li>

      <li><span class="step">Contraintes.</span> Axe du cylindre parallèle à A et à B, à 30 de A et à 35 de B (cotes encadrées).</li>
      <li><span class="step">Conformité.</span> L'axe réel de l'alésage est tout entier dans ce cylindre. L'alésage porte aussi Ⓔ : son ajustement avec l'arbre est garanti (§7).</li>
    </ol>
  </div>
  <h3>Écrire une spécification à partir de la fonction</h3>
  <ol>
    <li>Identifier l'exigence fonctionnelle (un jeu, un passage de vis, un défaut d'alignement admissible) et les surfaces qui y participent.</li>
    <li>Choisir les références d'après la mise en position de la pièce dans son assemblage (§11), dans l'ordre de prépondérance.</li>
    <li>Choisir le type (forme, orientation, position, battement) qui traduit l'exigence, et l'élément tolérancé (surface ou axe).</li>
    <li>Calculer la valeur limite à partir de l'exigence, sur le cas le plus défavorable.</li>
    <li>Écrire le cadre, les cotes encadrées et, pour les emboîtements, la taille avec Ⓔ.</li>
  </ol>
  <div class="method-box">
    <strong>Exemple — passage de vis</strong>
    <p>Une plaque est fixée par des vis M8 (diamètre au plus \(F = 8\) mm) dans des trous lisses de diamètre au moins \(H = 9\) mm. Une vis traverse un trou si l'axe du trou est à moins de \((H - F)/2 = 0{,}5\) mm de l'axe de la vis.</p>
    <ol>
      <li>Vis vissées dans des taraudages de l'autre pièce : les deux pièces se partagent cet écart. Avec des zones de localisation Ø \(T\) sur les trous lisses et sur les taraudages, l'écart entre les deux axes vaut au pire \(T/2 + T/2 = T\) : il faut \(T \leq (H - F)/2 = 0{,}5\) mm, soit une localisation Ø 0,5 sur chaque pièce.</li>
      <li>Vis traversant les deux pièces avec écrou : la vis « flotte » dans deux trous lisses. Il suffit que les deux trous aient en commun un passage de diamètre \(F\) : écart entre leurs axes au plus \(H - F\), d'où \(T \leq H - F = 1\) mm sur chaque pièce.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : spécifier par rapport à une surface commode pour la fabrication (une face d'usinage) au lieu des surfaces qui positionnent la pièce dans le mécanisme. La pièce peut alors être conforme et le mécanisme mal assemblé, ou l'inverse.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ajustements normalisés, maximum de matière, chaîne de cotes</h2>
  <div class="intro">Compléments utiles pour lire des dessins réels ou un sujet qui les fournirait, mais non exigibles. Les états de surface et le contrôle tridimensionnel sont traités en 2ᵉ année.</div>
  <h3>Ajustements normalisés (ISO 286)</h3>
  <p>Les tolérances usuelles d'arbres et d'alésages sont normalisées et désignées par une lettre et un nombre. La <strong>lettre</strong> donne la position de l'intervalle de tolérance par rapport à la cote nominale (majuscule pour un alésage, minuscule pour un arbre ; H : écart inférieur nul) ; le <strong>nombre</strong> est la qualité, qui fixe la largeur \(IT\) (pour les diamètres de 18 à 30 mm : IT6 = 13 µm, IT7 = 21 µm, IT8 = 33 µm). Un ajustement s'écrit Ø 25 H7/g6. Dans le système de l'<strong>alésage normal</strong>, le plus courant, l'alésage est en H et l'on choisit l'arbre selon la nature voulue. Les trois ajustements du §6 sont, dans l'ordre, H7/g6 (arbre −0,007/−0,020), H7/k6 (+0,015/+0,002) et H7/p6 (+0,035/+0,022).</p>
  <h3>Exigence du maximum de matière Ⓜ</h3>
  <p>Écrite après la valeur d'une tolérance de position d'un axe, elle remplace la zone par un <strong>état virtuel</strong> : une forme parfaite, de diamètre (taille au maximum de matière − \(t\)) pour un trou, que la surface ne doit pas franchir. Pour un trou \(\varnothing 9^{+0{,}2}_{\ 0}\) localisé à Ø 0,4 Ⓜ, l'état virtuel vaut \(9 - 0{,}4 = 8{,}6\) mm : un trou réalisé à 9,2 peut être décalé jusqu'à Ø 0,6 sans gêner le passage d'une vis. Plus souple que la localisation simple, elle convient aux fonctions d'assemblage, et se contrôle par un calibre.</p>
  <h3>Chaîne de cotes</h3>
  <p>Ancienne méthode de cotation fonctionnelle en une dimension : une condition (un jeu \(J\)) s'écrit comme somme algébrique de cotes des pièces, comptées positivement dans le sens de \(J\), négativement sinon.</p>

  <div class="formula">$$J_{\max} = \sum (\text{cotes}^{+})_{\max} - \sum (\text{cotes}^{-})_{\min} \qquad IT(J) = \sum IT(\text{maillons})$$</div>
  <p>Les intervalles de tolérance s'ajoutent : plus la chaîne est longue, plus la condition est difficile à tenir. Exemple : \(a = 80 \pm 0{,}1\), \(b = 50 \pm 0{,}05\), \(c = 29 \pm 0{,}05\) donnent \(J = 1\) mm nominal, \(IT(J) = 0{,}4\) mm, \(J\) entre 0,8 et 1,2 mm.</p>
  <h3>États de surface (2ᵉ année)</h3>
  <p>La rugosité décrit les irrégularités fines de la surface, éliminées par le filtrage (§3). Le critère usuel est l'écart moyen arithmétique du profil à sa ligne moyenne, \(R_a = \frac{1}{L}\int_0^L |y(x)|\,\mathrm{d}x\) : de l'ordre de 12 à 25 µm brut de fonderie, 1 à 6 µm en usinage courant, moins de 1 µm en rectification.</p>

<template class="pan-tpl" data-panneau="cota-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · COTATION ET SPÉCIFICATION GPS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : exploiter une taille et un ajustement (§5 à §7), décoder une spécification par zone et ses références (§3, §8 à §11), puis remplir une fiche GPS et écrire une spécification (§12). Chacune se termine par un exemple court, chiffré et vérifié.</div>

  <div class="method-box">
    <strong>Méthode 1 — Exploiter une cote tolérancée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Limites.</span> Cote maxi \(= N + ES\), cote mini \(= N + EI\), en gardant le signe des écarts (souvent \(EI \lt 0\), et les deux écarts d'un arbre peuvent être négatifs).</li>
      <li><span class="step">Largeur.</span> \(IT = ES - EI = \text{maxi} - \text{mini}\), toujours positif.</li>
      <li><span class="step">Maximum de matière.</span> Cote maxi pour un arbre, cote mini pour un alésage : c'est la limite qui gêne le montage.</li>
      <li><span class="step">Conformité.</span> Chaque taille locale (entre deux points en vis-à-vis) doit être entre les limites, pas seulement leur moyenne.</li>
    </ol>
    <p><em>Exemple éclair :</em> arbre \(\varnothing 12^{-0{,}016}_{-0{,}034}\) : maxi 11,984 (maximum de matière), mini 11,966, \(IT = -0{,}016 - (-0{,}034) = 0{,}018\) mm ; une taille locale de 11,970 est conforme.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Déterminer la nature d'un ajustement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Limites.</span> Écrire \(D_{\min}\), \(D_{\max}\) (alésage) et \(d_{\min}\), \(d_{\max}\) (arbre).</li>
      <li><span class="step">Jeux extrêmes.</span> \(J_{\max} = D_{\max} - d_{\min}\) ; \(J_{\min} = D_{\min} - d_{\max}\).</li>
      <li><span class="step">Contrôle.</span> \(J_{\max} - J_{\min} = IT_{\text{alésage}} + IT_{\text{arbre}}\).</li>
      <li><span class="step">Conclure.</span> \(J_{\min} \geq 0\) : glissant ; \(J_{\max} \leq 0\) : serré ; sinon incertain. Donner les bornes : jeu de … à …, ou serrage de … à … (serrage maximal \(= -J_{\min}\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> alésage 16,000 à 16,018, arbre 16,012 à 16,023 : \(J_{\max} = 16{,}018 - 16{,}012 = 0{,}006\), \(J_{\min} = 16{,}000 - 16{,}023 = -0{,}023\) ; contrôle \(0{,}029 = 0{,}018 + 0{,}011\). Ajustement <strong>incertain</strong>, d'un jeu de 6 µm à un serrage de 23 µm.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Choisir la nature d'un ajustement d'après la fonction</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Mouvement relatif voulu ?</span> Oui (rotation ou translation par glissement) : glissant.</li>
      <li><span class="step">Sinon, comment passe l'effort ?</span> Par un obstacle (clavette, goupille) avec un centrage précis démontable : incertain ; par adhérence seule, ou bague de roulement qui tourne par rapport à la charge : serré.</li>
      <li><span class="step">Vérifier les bornes.</span> Si le cahier des charges fixe un jeu entre \(J_1\) et \(J_2\), il faut \(J_{\min} \geq J_1\) <strong>et</strong> \(J_{\max} \leq J_2\).</li>
      <li><span class="step">Garantir.</span> Ajouter Ⓔ sur les deux pièces pour que le jeu calculé soit réellement obtenu (méthode 4).</li>
    </ol>
    <p><em>Exemple éclair :</em> un galet fou doit tourner sur son axe avec un jeu de 0,010 à 0,050 mm. Alésage 12,000 à 12,018, axe 11,968 à 11,984 : \(J_{\min} = 0{,}016 \geq 0{,}010\) et \(J_{\max} = 0{,}050 \leq 0{,}050\) : le couple convient (glissant).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Interpréter l'exigence de l'enveloppe Ⓔ</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Gabarit.</span> Arbre : il passe dans un cylindre parfait de diamètre \(d_{\max}\). Alésage : il contient un cylindre parfait de diamètre \(D_{\min}\). Sur toute la longueur.</li>
      <li><span class="step">Tailles locales.</span> Arbre : chacune au moins \(d_{\min}\) ; alésage : chacune au plus \(D_{\max}\).</li>
      <li><span class="step">Forme admise.</span> Au maximum de matière, forme parfaite ; pour une taille locale \(x\) constante, défaut de rectitude de l'axe admis \(= |x - \text{taille au maximum de matière}|\).</li>
      <li><span class="step">Montage.</span> Ⓔ sur les deux pièces : \(J_{\min} = D_{\min} - d_{\max}\) est garanti.</li>
    </ol>
    <p><em>Exemple éclair :</em> alésage \(\varnothing 30^{+0{,}021}_{\ 0}\) Ⓔ réalisé à 30,012 partout : il doit contenir un cylindre parfait de 30,000, donc son axe peut être cintré de \(30{,}012 - 30{,}000 = 0{,}012\) mm au plus ; on le vérifie avec un tampon de forme complète de Ø 30,000.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : sans Ⓔ, le principe d'indépendance s'applique : des tailles locales toutes conformes ne garantissent ni la forme ni le montage.</div>

  <div class="method-box">
    <strong>Méthode 5 — Décrire une spécification par les modèles et les opérations</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Partition.</span> Nommer les surfaces réelles concernées : élément tolérancé et éléments de référence.</li>
      <li><span class="step">Extraction et filtrage.</span> Points pris sur ces surfaces ; échelle de défauts conservée (la forme, pas la rugosité).</li>
      <li><span class="step">Association.</span> Élément idéal ajusté sur chaque surface : plan, cylindre… et critère (tangent extérieur à la matière pour une référence, minimax pour une forme).</li>
      <li><span class="step">Collection et construction.</span> Surfaces prises ensemble (A-B), éléments construits (axe commun, plan médian, intersection).</li>
      <li><span class="step">Évaluation.</span> La caractéristique (distance, diamètre) et sa limite : condition unilimite.</li>
    </ol>
    <p><em>Exemple éclair :</em> « coaxialité Ø 0,02 A-B » sur une portée centrale. Partition : la portée et les deux portées de référence ; extraction de leurs points ; association d'un cylindre sur chaque portée de référence, prises en collection (deux cylindres coaxiaux associés ensemble) ; construction de leur axe commun A-B ; sur la portée tolérancée, construction de la ligne médiane (centres des cercles associés dans chaque section) ; évaluation : distance maximale de cette ligne à A-B, au plus 0,01 mm.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Lire un cadre de tolérance</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Symbole.</span> Famille : forme (pas de référence), orientation, position, battement.</li>
      <li><span class="step">Élément tolérancé.</span> Flèche sur le contour : la surface (intégral) ; flèche dans le prolongement d'une ligne de cote, ou cadre attaché à la cote : l'axe ou le plan médian (dérivé).</li>
      <li><span class="step">Zone.</span> Valeur précédée de Ø : cylindre de diamètre \(t\) ; sinon, deux plans (ou deux droites) distants de \(t\), perpendiculairement à la surface désignée.</li>
      <li><span class="step">Références.</span> Lettres dans l'ordre : primaire, secondaire, tertiaire ; « A-B » dans une seule case : référence commune.</li>
      <li><span class="step">Contraintes.</span> Forme : zone libre ; orientation : zone orientée, libre en position ; position : zone orientée et placée par les cotes encadrées.</li>
    </ol>
    <p><em>Exemple éclair :</em> « perpendicularité | 0,05 | A », flèche sur une face d'épaulement, A étant l'axe d'un alésage : la face doit tenir entre deux plans distants de 0,05 mm, perpendiculaires à l'axe A, placés librement le long de l'axe.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : lire « 0,05 » comme un écart de part et d'autre de la surface nominale. C'est la <strong>largeur totale</strong> de la zone (± 0,025 autour de la position théorique pour une localisation).</div>

  <div class="method-box">
    <strong>Méthode 7 — Établir une référence ou un système de références</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Mise en position.</span> Repérer comment la pièce est positionnée dans son assemblage : surface prépondérante (large appui plan, ou centrage long \(L/D \gt 1{,}5\)), contact secondaire, arrêt en rotation.</li>
      <li><span class="step">Ordre.</span> Primaire = surface prépondérante ; secondaire = second contact, associé sous contrainte d'orientation (perpendiculaire à la primaire) ; tertiaire = arrêt en rotation.</li>
      <li><span class="step">Association.</span> Plan tangent extérieur à la matière (un marbre), plus petit cylindre circonscrit à un arbre, plus grand cylindre inscrit dans un alésage ; deux surfaces qui travaillent ensemble : référence commune A-B.</li>
      <li><span class="step">Bilan.</span> Compter les degrés de liberté fixés : 3 + 2 + 1 (plan, axe, rotation) ou 4 + 1 + 1 (axe, plan, rotation).</li>
    </ol>
    <p><em>Exemple éclair :</em> pignon monté sur un arbre par un alésage de Ø 20 sur 32 mm (\(L/D = 1{,}6\)), en butée contre un épaulement étroit, claveté : primaire A = axe de l'alésage (4), secondaire B = face d'appui, perpendiculaire à A (1), tertiaire C = plan médian de la rainure de clavette (1).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Juger une localisation ou un battement à partir de mesures</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Position théorique.</span> Lire les cotes encadrées depuis les références : c'est le centre de la zone.</li>
      <li><span class="step">Localisation d'un axe.</span> Écarts mesurés \(\Delta x\), \(\Delta y\) dans chaque section ; \(r = \sqrt{\Delta x^2 + \Delta y^2}\) ; conforme si \(2r \leq t\) partout.</li>
      <li><span class="step">Battement.</span> La pièce tourne autour de sa référence (A-B) ; battement = lecture maxi − lecture mini sur un tour ; une excentration \(e\) en donne \(2e\).</li>
      <li><span class="step">Conclure.</span> Comparer à \(t\), en rappelant que quelques sections mesurées ne sont qu'un échantillon.</li>
    </ol>
    <p><em>Exemple éclair :</em> axe théorique en (40 ; 25), mesuré en (40,06 ; 24,93) : \(r = \sqrt{0{,}06^2 + 0{,}07^2} \approx 0{,}092\), \(2r \approx 0{,}184 \leq 0{,}2\) : conforme à « localisation Ø 0,2 ». Battement : lectures de −0,021 à +0,013 mm, soit 0,034 ≤ 0,04 : conforme ; un battement de 0,04 tolère au plus 0,02 d'excentration.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : comparer \(r\) (un rayon) directement à \(t\) (un diamètre de zone). Le point est dans le cylindre Ø \(t\) si \(r \leq t/2\).</div>

  <div class="method-box">
    <strong>Méthode 9 — Remplir une fiche GPS</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Type</span> : famille et caractéristique.</li>
      <li><span class="step">Élément tolérancé</span> : unique ou groupe ; intégral ou dérivé ; nature géométrique.</li>
      <li><span class="step">Éléments de référence et références spécifiées</span> : surfaces réelles ; simple, commune ou système ; nature de l'élément associé et critère.</li>
      <li><span class="step">Zone</span> : forme, dimension, simple ou composée.</li>
      <li><span class="step">Contraintes</span> : orientation et position de la zone par rapport aux références, cotes encadrées.</li>
      <li><span class="step">Conformité et schéma</span> : l'élément tolérancé tout entier dans la zone ; un croquis de la zone sur la pièce.</li>
    </ol>
    <p><em>Exemple éclair :</em> « symétrie | 0,04 | A » sur une rainure de clavette, A étant l'axe de l'alésage du moyeu. Position, symétrie ; élément tolérancé unique, dérivé : le plan médian de la rainure ; référence simple : l'axe du plus grand cylindre inscrit dans l'alésage ; zone simple : deux plans parallèles distants de 0,04 mm ; contrainte : symétriques par rapport à un plan qui contient l'axe A (libre de tourner autour de A, faute de référence secondaire).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Écrire une spécification à partir d'une exigence fonctionnelle</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Exigence.</span> L'écrire en grandeur physique : un jeu, un angle, un décalage, un passage de vis.</li>
      <li><span class="step">Surfaces et références.</span> Surfaces qui participent à la fonction ; références tirées de la mise en position (méthode 7).</li>
      <li><span class="step">Type et élément.</span> Orientation pour un angle, position pour un emplacement, battement pour une pièce tournante, taille avec Ⓔ pour un emboîtement.</li>
      <li><span class="step">Valeur.</span> Calculer \(t\) sur le cas le plus défavorable : \(t \approx L\,\alpha\) pour un angle \(\alpha\) sur une longueur \(L\) ; \(t = 2e\) pour une excentration \(e\) en battement ; partage de \((H - F)/2\) pour des vis vissées.</li>
      <li><span class="step">Écrire</span> le cadre, les cotes encadrées et les triangles de référence.</li>
    </ol>
    <p><em>Exemple éclair :</em> une colonne de guidage de 60 mm de haut doit être perpendiculaire à sa semelle A à 0,5 mrad près : \(t = 60\times0{,}5\cdot10^{-3} = 0{,}03\) mm, d'où « perpendicularité | Ø 0,03 | A », cadre attaché à la cote du diamètre de la colonne (on limite son axe).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : choisir les références d'après la commodité de l'usinage ou du contrôle. Une spécification fonctionnelle se rapporte aux surfaces qui positionnent la pièce dans le mécanisme.</div>
</div>

<template class="pan-tpl" data-panneau="cota-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Cote tolérancée</h3>
  <div class="statement">Une cote est notée \(50^{+0{,}05}_{-0{,}02}\) (en mm).</div>
  <div class="q"><strong>Q1.</strong> Donner la cote maxi et la cote mini.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'intervalle de tolérance \(IT\).</div>
  <div class="q"><strong>Q3.</strong> Une pièce mesurée à \(50{,}06\) mm est-elle conforme ?</div>
  <div class="q"><strong>Q4.</strong> Cette cote est le diamètre d'un arbre. Quelle est sa taille au maximum de matière ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Cote maxi \(= 50 + 0{,}05 = 50{,}05\) mm ; cote mini \(= 50 - 0{,}02 = 49{,}98\) mm.</p>
    <p><strong>Q2.</strong> \(IT = ES - EI = 0{,}05 - (-0{,}02) = 0{,}07\) mm (70 µm).</p>
    <p><strong>Q3.</strong> Non : \(50{,}06 > 50{,}05\) (cote maxi). La pièce est hors tolérance (trop grande) → rebut ou retouche.</p>
    <p><strong>Q4.</strong> Pour un arbre (élément extérieur), le maximum de matière est la cote maxi : 50,05 mm. C'est l'arbre le plus difficile à monter dans son alésage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Nature d'un ajustement</h3>
  <div class="statement">Alésage : \(\varnothing 30^{+0{,}021}_{0}\). Arbre : \(\varnothing 30^{-0{,}007}_{-0{,}020}\) (mm).</div>
  <div class="q"><strong>Q1.</strong> Donner alésage maxi/mini et arbre maxi/mini.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(J_{\max}\) et \(J_{\min}\).</div>
  <div class="q"><strong>Q3.</strong> Conclure sur la nature de l'ajustement.</div>
  <div class="q"><strong>Q4.</strong> Quelle indication faut-il ajouter aux deux cotes pour que le jeu minimal calculé soit réellement obtenu au montage ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Alésage : maxi \(30{,}021\), mini \(30{,}000\). Arbre : maxi \(29{,}993\), mini \(29{,}980\).</p>
    <p><strong>Q2.</strong> Alésage maxi moins arbre mini : \(J_{\max} = 30{,}021 - 29{,}980 = 0{,}041\) mm. Alésage mini moins arbre maxi : \(J_{\min} = 30{,}000 - 29{,}993 = 0{,}007\) mm.</p>
    <p><strong>Q3.</strong> \(J_{\min} = 0{,}007 > 0\) : il y a <strong>toujours du jeu</strong> → ajustement <strong>avec jeu</strong> (glissant).</p>
    <p><strong>Q4.</strong> L'exigence de l'enveloppe Ⓔ sur l'arbre et sur l'alésage. Sans elle, par le principe d'indépendance, seules les tailles locales sont limitées : un arbre cintré ou un alésage ovalisé peuvent respecter leurs cotes et ne pas s'assembler. Avec Ⓔ, l'arbre tient dans un cylindre parfait de 29,993 et l'alésage contient un cylindre parfait de 30,000 : le jeu de 0,007 au moins est garanti.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Trois portées, trois fonctions, et une bague de roulement</h3>
  <div class="statement">Trois arbres de diamètre nominal 20 mm se montent chacun dans un alésage réalisé entre 20,000 et 20,021 mm : arbre (a) entre 19,967 et 19,980 ; arbre (b) entre 20,002 et 20,015 ; arbre (c) entre 20,022 et 20,035. Par ailleurs, la bague intérieure d'un roulement, d'alésage \(\varnothing 25^{\ 0}_{-0{,}010}\) (pour les roulements, la tolérance d'alésage est placée sous la cote nominale), se monte sur une portée d'arbre \(\varnothing 25^{+0{,}015}_{+0{,}002}\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la nature des ajustements (a), (b) et (c), avec leurs jeux ou serrages extrêmes.</div>
  <div class="q"><strong>Q2.</strong> Attribuer chacun à l'une de ces fonctions, en justifiant : douille en bronze emmanchée à la presse dans un bras ; galet fou tournant sur son axe ; pignon claveté, centré avec précision et démonté à chaque révision.</div>
  <div class="q"><strong>Q3.</strong> Nature de l'ajustement de la bague de roulement sur sa portée ?</div>
  <div class="q"><strong>Q4.</strong> La bague intérieure tourne avec l'arbre, la charge garde une direction fixe. Pourquoi monte-t-on cette bague avec serrage ?</div>
  <div class="q"><strong>Q5.</strong> La portée a un intervalle de tolérance de 13 µm. Quel procédé de finition peut le tenir : brut de fonderie, tournage courant ou rectification ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) \(J_{\max} = 20{,}021 - 19{,}967 = 0{,}054\), \(J_{\min} = 20{,}000 - 19{,}980 = 0{,}020\) : glissant (jeu de 20 à 54 µm). (b) \(J_{\max} = 20{,}021 - 20{,}002 = 0{,}019\), \(J_{\min} = 20{,}000 - 20{,}015 = -0{,}015\) : incertain (d'un jeu de 19 µm à un serrage de 15 µm). (c) \(J_{\max} = 20{,}021 - 20{,}022 = -0{,}001\), \(J_{\min} = 20{,}000 - 20{,}035 = -0{,}035\) : serré (serrage de 1 à 35 µm).</p>
    <p><strong>Q2.</strong> Le galet fou doit tourner : il faut toujours du jeu, (a). Le pignon est centré avec précision et démonté : un ajustement incertain (b) donne un centrage sans jeu notable tout en restant démontable au maillet ; le couple passe par la clavette, pas par le serrage. La douille ne doit ni tourner ni glisser dans le bras, sans autre arrêt : serré (c).</p>
    <p><strong>Q3.</strong> Bague : maxi 25,000, mini 24,990 ; portée : maxi 25,015, mini 25,002. \(J_{\max} = 25{,}000 - 25{,}002 = -0{,}002\), \(J_{\min} = 24{,}990 - 25{,}015 = -0{,}025\) : \(J_{\max} \leq 0\), ajustement <strong>serré</strong> (serrage de 2 à 25 µm). La même portée dans un alésage ordinaire d'écart inférieur nul donnerait un ajustement incertain : c'est la position de la tolérance du roulement, sous la cote nominale, qui produit le serrage.</p>
    <p><strong>Q4.</strong> La bague intérieure tourne par rapport à la direction de la charge : chaque point de sa portée est chargé à son tour. Montée avec jeu, elle roulerait lentement sur l'arbre (cheminement), d'où usure, échauffement et corrosion de contact. Le serrage l'immobilise sur sa portée. La bague extérieure, fixe par rapport à la charge, peut être montée glissante.</p>
    <p><strong>Q5.</strong> 13 µm est très serré : le brut de fonderie (dixièmes de mm) et le tournage courant (quelques centièmes) ne suffisent pas ; il faut une <strong>rectification</strong>, qui tient quelques micromètres. D'où les portées « rectifiées » des arbres de roulement.</p>
  </div>
</div>

    <p><strong>Q3.</strong> La matière occupe une bande de largeur \(15{,}990 + 0{,}012 = 16{,}002\) mm : c'est le diamètre du plus petit cylindre qui contient l'axe. Il est supérieur à 16,000 : dans un alésage droit réalisé au mini, l'axe n'entre pas. Le jeu calculé en Q1 n'est pas garanti.</p>
    <p><strong>Q4.</strong> Avec Ⓔ, l'axe doit passer dans un cylindre parfait de 15,994 (maximum de matière) : \(16{,}002 > 15{,}994\), il est refusé. Pour une taille locale de 15,990, la flèche admise est \(15{,}994 - 15{,}990 = 0{,}004\) mm.</p>

    <p><strong>Q3.</strong> La face A est la référence de trois spécifications : la référence spécifiée est le plan tangent à A du côté extérieur à la matière (un marbre). Si A était très gauche, la semelle pourrait basculer sur le marbre ou sur le bâti, et les trois zones seraient mal définies ; la planéité rend la référence stable et la pose sur le bâti franche.</p>
    <p><strong>Q4.</strong> Non : la zone de parallélisme (2) contient aussi le défaut de forme. La face supérieure, conforme à (2), a une planéité d'au plus 0,04 mm. Une planéité n'y serait utile que plus petite que 0,04.</p>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Parallélisme et planéité au comparateur</h3>
  <div class="statement">Une plaque est spécifiée en épaisseur \(40 \pm 0{,}05\), et sa face supérieure porte « parallélisme 0,03 A », A étant la face inférieure. On la pose par A sur un marbre ; un comparateur, réglé à zéro sur une cale de 40,000 mm, relève la face supérieure en neuf points (grille 3 × 3, pas de 40 mm en x et de 30 mm en y). Écarts lus, en mm :
    <div><table>
      <tr><th></th><th>x = 0</th><th>x = 40</th><th>x = 80</th></tr>
      <tr><th>y = 60</th><td>+0,012</td><td>+0,020</td><td>+0,025</td></tr>
      <tr><th>y = 30</th><td>+0,008</td><td>+0,016</td><td>+0,022</td></tr>
      <tr><th>y = 0</th><td>+0,004</td><td>+0,011</td><td>+0,018</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>Q1.</strong> Pourquoi le marbre réalise-t-il la référence spécifiée A ?</div>
  <div class="q"><strong>Q2.</strong> Évaluer le défaut de parallélisme et conclure.</div>
  <div class="q"><strong>Q3.</strong> Un logiciel associe aux neuf points deux plans parallèles au plus près, sans contrainte d'orientation : il trouve 0,0015 mm. Quel défaut évalue-t-il ? Pourquoi est-il bien plus petit que le précédent ?</div>
  <div class="q"><strong>Q4.</strong> Peut-on conclure sur la spécification d'épaisseur ? À quelle condition les lectures donnent-elles les tailles locales ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La référence spécifiée est le plan associé à la face réelle A : tangent du côté extérieur à la matière, il minimise l'écart maximal. Posée sur un marbre (plan quasi parfait), la face repose sur ses points les plus saillants : le marbre matérialise ce plan tangent. Les lectures sont des hauteurs au-dessus de la référence.</p>
    <p><strong>Q2.</strong> La zone de parallélisme est faite de deux plans parallèles à A ; sa largeur minimale est l'écart entre la plus grande et la plus petite hauteur : \(0{,}025 - 0{,}004 = 0{,}021\) mm \(\leq 0{,}03\). La face est conforme (sur ces neuf points, qui ne sont qu'un échantillon).</p>
    <p><strong>Q3.</strong> Une zone libre en orientation est une zone de <strong>forme</strong> : c'est le défaut de planéité. Les lectures croissent presque régulièrement avec x et y : la face est quasi plane mais <strong>inclinée</strong> par rapport à A (environ 0,014 mm sur 80 mm en x et 0,008 mm sur 60 mm en y). La zone libre s'incline avec elle et n'a plus à absorber que de petits écarts ; la zone de parallélisme, horizontale, doit contenir toute l'inclinaison. Le parallélisme contient la planéité, jamais l'inverse.</p>
    <p><strong>Q4.</strong> Si la face A était parfaitement plane, chaque lecture serait une épaisseur locale : de 40,004 à 40,025, dans la tolérance de 39,95 à 40,05. Mais la taille locale se mesure entre deux points en vis-à-vis des deux faces ; si A a un défaut de forme, la hauteur au-dessus du marbre (qui touche les sommets de A) peut différer de l'épaisseur locale en un point. Par dualité, on vérifie la taille à deux touches (micromètre) ; ici, avec une planéité de A connue et faible, la conclusion « conforme » est très probable mais pas démontrée par ces seules lectures.</p>
  </div>
</div>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour chaque trou, un cylindre de diamètre 0,3 mm, perpendiculaire à A, dont l'axe est à la position théorique exacte : (20 ; 15) pour T1, (60 ; 15) pour T2, depuis B et C. « 2 × » indique que la cote et la spécification s'appliquent aux deux trous (collection) ; les deux zones sont placées l'une par rapport à l'autre par les cotes encadrées.</p>
    <p><strong>Q2.</strong> T1 : \(r = \sqrt{0{,}08^2 + 0{,}11^2} \approx 0{,}136\), \(2r \approx 0{,}272 \leq 0{,}3\) : conforme. T2 : \(r = \sqrt{0{,}13^2 + 0{,}10^2} \approx 0{,}164\), \(2r \approx 0{,}328 > 0{,}3\) : <strong>non conforme</strong>.</p>
    <p><strong>Q3.</strong> Chaque écart de coordonnée est inférieur à 0,15 : les deux trous auraient été acceptés. Or ce qui compte pour une vis, c'est la distance à la position théorique, quelle que soit la direction : la zone cylindrique traduit exactement cette fonction, la zone carrée accepte des coins à \(0{,}15\sqrt2 \approx 0{,}21\) qui la dépassent.</p>
    <p><strong>Q4.</strong> Une vis passe si l'axe du trou lisse est à moins de \((9 - 8)/2 = 0{,}5\) mm de l'axe de la vis, confondu avec celui du taraudage. Pièces conformes : l'axe d'un trou est à au plus 0,15 de sa position théorique, l'axe d'un taraudage à au plus 0,10 de la sienne ; les positions théoriques coïncident quand les références des deux pièces sont en contact. L'écart vaut au pire \(0{,}15 + 0{,}10 = 0{,}25 \leq 0{,}5\) : les vis passent toujours, avec de la marge (on pourrait élargir les tolérances, ou réduire les trous).</p>
  </div>
</div>
