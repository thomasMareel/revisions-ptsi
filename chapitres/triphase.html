  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Compétence C2 « Déterminer les signaux électriques dans les circuits » (S3) : régime sinusoïdal, puissances, triphasé, ondulation dans les convertisseurs et composants de filtrage ; compétences F2 « Choisir les composants de la chaîne de puissance » et F3 « Dimensionner un composant » (S4) pour le choix des convertisseurs et de leurs interrupteurs. La modélisation des convertisseurs statiques (interrupteurs parfaits, cellule de commutation, réversibilité, synthèse hacheur / onduleur / redresseur) est un rappel de S2, traité dans les chapitres « Convertisseurs statiques » et « Hacheurs » de 1ʳᵉ année. Les machines alimentées par ces convertisseurs sont étudiées dans « Machines synchrone et asynchrone ».</div>

<div class="course-section">
  <div class="sec-num">§1 · CONVERTISSEURS STATIQUES</div>
  <h2>Rôles, réversibilité et interrupteurs de puissance</h2>
  <div class="intro">Entre la source d'énergie électrique (réseau alternatif à 50 Hz, batterie, panneau photovoltaïque) et l'actionneur (machine à courant continu, machine synchrone ou asynchrone), la forme de l'énergie doit presque toujours être adaptée. C'est le travail du <strong>convertisseur statique</strong> : aucune pièce en mouvement, seulement des interrupteurs à semi-conducteurs et des éléments de stockage (inductances, condensateurs), avec un rendement typiquement supérieur à 95 %. Ce chapitre prolonge les chapitres « Convertisseurs statiques » et « Hacheurs » de 1ʳᵉ année.</div>

  <h3>Quatre familles de conversion</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;min-width:460px">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Entrée → sortie</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Convertisseur</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Exemples d'emploi</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">alternatif → continu</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>Redresseur</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">chargeur de batterie, étage d'entrée d'un variateur, alimentation d'un moteur à courant continu</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">continu → continu</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>Hacheur</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">variation de vitesse d'une MCC, alimentation à découpage, adaptation de tension d'une batterie</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">continu → alternatif</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>Onduleur</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">variateur de machine synchrone ou asynchrone, injection photovoltaïque, alimentation sans interruption</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">alternatif → alternatif</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>Gradateur</strong> (hors programme)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">variateur de lumière, démarreur progressif (même fréquence, valeur efficace réglable)</td></tr>
  </table></div>
  <p>Pour obtenir une tension alternative de <strong>fréquence variable</strong> à partir du réseau, on enchaîne un redresseur, un <strong>bus continu</strong> filtré et un onduleur : c'est la structure de la grande majorité des variateurs de vitesse industriels (§9).</p>

  <h3>Réversibilité et quadrants</h3>
  <div class="def-box">
    <strong>Définition.</strong> Un convertisseur est <strong>réversible en tension</strong> (resp. <strong>en courant</strong>) si la valeur moyenne de sa tension (resp. de son courant) de sortie peut changer de signe. Dans le plan \((\langle u\rangle, \langle i\rangle)\) côté charge, on repère quatre <strong>quadrants</strong> : Q1 (\(u>0\), \(i>0\)) et Q3 (\(u \lt 0\), \(i \lt 0\)) où la charge reçoit de l'énergie ; Q2 (\(u \lt 0\), \(i>0\)) et Q4 (\(u>0\), \(i \lt 0\)) où elle en renvoie vers la source (freinage récupératif d'un moteur, par exemple).
  </div>
  <div class="notice">La numérotation dépend du plan choisi. Les chapitres sur les machines (« Machine à courant continu », « Machines synchrone et asynchrone ») travaillent dans le plan \((C_{em}, \Omega)\), couple en abscisse : le freinage en marche avant (\(\Omega > 0\), \(C_{em} \lt 0\), donc \(\langle u\rangle > 0\) et \(\langle i\rangle \lt 0\) pour une MCC) y est le quadrant 2, alors qu'il est le quadrant 4 dans le plan \((\langle u\rangle, \langle i\rangle)\) ci-dessus. Toujours préciser le plan avant de nommer un quadrant.</div>

  <h3>Interrupteurs de l'électronique de puissance</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;min-width:480px">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Composant</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Mise en conduction / blocage</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Domaine typique</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>Diode</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">spontanées : conduit si \(i>0\), bloquée si \(v \lt 0\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">redresseurs, roue libre, diodes antiparallèles</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>Thyristor</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">amorçage commandé (gâchette, si \(v>0\)) ; blocage spontané quand le courant s'annule</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">redresseurs commandés de très forte puissance</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>Transistor MOS</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">fermeture et ouverture commandées par la tension de grille</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">tensions modestes (jusqu'à quelques centaines de volts), découpage rapide (jusqu'à des centaines de kHz)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)"><strong>IGBT</strong></td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">commandé en tension comme le MOS ; chute de tension faible même sous fort courant</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">600 V à plusieurs kV, découpage de quelques kHz à une vingtaine de kHz : variateurs, traction</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Cellule réversible en courant.</strong> Un transistor associé à une <strong>diode montée en antiparallèle</strong> forme un interrupteur à trois segments : tension positive bloquée, courant dans les deux sens. C'est la brique de base des ponts en H et des onduleurs : le courant passe par le transistor quand il est positif, par la diode quand il est négatif.
  </div>
  <div class="notice">
    <strong>Règles d'interconnexion des sources.</strong> On ne relie jamais directement deux sources de tension (court-circuit) : dans un bras, les deux interrupteurs ne sont <strong>jamais fermés simultanément</strong> (on ménage un temps mort à chaque commutation). On n'ouvre jamais une source de courant (inductance) : il faut toujours un chemin pour son courant (diode de roue libre ou diode antiparallèle).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RÉGIME SINUSOÏDAL MONOPHASÉ</div>
  <h2>Valeurs caractéristiques, notation complexe et Fresnel</h2>
  <div class="intro">Le régime sinusoïdal établi est le langage commun du réseau, des machines alternatives et des onduleurs (via leur fondamental). On note \(U\) la valeur efficace, \(\hat U = U\sqrt2\) l'amplitude, \(\omega = 2\pi f\) la pulsation.</div>

  <h3>Valeur moyenne et valeur efficace</h3>
  <div class="formula">$$\langle u\rangle = \frac{1}{T}\int_0^T u(t)\,\mathrm{d}t$$$$U = \sqrt{\frac{1}{T}\int_0^T u^2(t)\,\mathrm{d}t}$$</div>
  <div class="def-box">
    <strong>Sens physique.</strong> Appliquée à une résistance \(R\), une tension continue égale à \(U\) la chaufferait exactement autant, en moyenne, que \(u(t)\) : \(P = U^2/R\). Un multimètre « RMS vrai » en position AC+DC la mesure ; la position DC donne la valeur moyenne.
  </div>
  <div class="prop-box">
    <strong>Valeurs à connaître.</strong>
    <ul style="margin:.4rem 0">
      <li>Sinusoïde : \(\langle u\rangle = 0\) et \(U = \hat U/\sqrt2\). Réseau domestique : 230 V efficaces, soit \(\hat U \approx 325\ \text{V}\).</li>
      <li>Créneau symétrique \(\pm E\) : \(\langle u\rangle = 0\) et \(U = E\).</li>
      <li>Créneau \(0/E\) de rapport cyclique \(\alpha\) : \(\langle u\rangle = \alpha E\) et \(U = E\sqrt{\alpha}\).</li>
      <li>Signal quelconque décomposé en série de Fourier : \(U^2 = \langle u\rangle^2 + \sum_{n\geq1} U_n^2\) (somme des carrés des valeurs efficaces des harmoniques).</li>
    </ul>
  </div>

  <h3>Notation complexe et impédance</h3>
  <p>À \(u(t) = U\sqrt2\cos(\omega t + \varphi_u)\) on associe le complexe \(\underline{u} = U\,e^{j\varphi_u}\) (module = valeur efficace). Dériver revient à multiplier par \(j\omega\). En convention récepteur :</p>
  <div class="formula">$$\underline{Z} = \frac{\underline{u}}{\underline{i}} = R + jX$$$$|\underline{Z}| = \frac{U}{I}$$$$\varphi = \arg\underline{Z} = \varphi_u - \varphi_i$$</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center;min-width:400px">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Dipôle</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Impédance</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Déphasage \(\varphi\)</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Lecture</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">Résistance</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(R\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(0\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(u\) et \(i\) en phase</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">Inductance</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(jL\omega\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(+\pi/2\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(u\) en avance sur \(i\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">Condensateur</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(\dfrac{1}{jC\omega}\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(-\pi/2\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(u\) en retard sur \(i\)</td></tr>
  </table></div>
  <p>Les impédances s'ajoutent en série, les admittances \(\underline{Y} = 1/\underline{Z}\) s'ajoutent en parallèle. Une charge <strong>inductive</strong> (\(X>0\), \(\varphi>0\), courant en retard) est le cas de tous les moteurs ; une charge <strong>capacitive</strong> a \(\varphi \lt 0\).</p>

  <h3>Représentation de Fresnel</h3>
  <div class="def-box">
    <strong>Principe.</strong> Chaque grandeur sinusoïdale de pulsation \(\omega\) est représentée par un vecteur de longueur égale à sa valeur efficace, faisant avec l'axe de référence un angle égal à sa phase. Une somme de sinusoïdes devient une somme de vecteurs : la loi des mailles se résout graphiquement. On prend souvent le courant comme référence pour une association série, la tension pour une association parallèle.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Une résistance et une bobine idéale sont en série sous 230 V, 50 Hz. On mesure 6 A dans le circuit et 150 V aux bornes de la résistance. Que valent \(R\), la tension aux bornes de la bobine, \(L\) et le déphasage \(\varphi\) ?</span>
    <div class="content"><p>\(R = 150/6 = 25\ \Omega\). Fresnel, courant en référence : \(\vec U_R\) est porté par \(\vec I\), \(\vec U_L\) lui est perpendiculaire (en avance de 90°) et \(\vec U = \vec U_R + \vec U_L\). Le triangle est rectangle, donc \(U_L = \sqrt{230^2 - 150^2} \approx 174\ \text{V}\) (et non \(230 - 150\)). Ensuite \(L\omega = 174/6 \approx 29{,}1\ \Omega\), d'où \(L \approx 92\ \text{mH}\), et \(\cos\varphi = U_R/U \approx 0{,}65\) : \(\varphi \approx 49°\), courant en retard.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PUISSANCES EN MONOPHASÉ</div>
  <h2>Puissances active, réactive, apparente — théorème de Boucherot</h2>
  <div class="intro">Ce qui produit un travail utile ou de la chaleur, c'est la puissance moyenne. Mais le courant en ligne, donc le dimensionnement des câbles et des transformateurs, dépend aussi de l'énergie qui fait des allers-retours entre la source et les inductances ou condensateurs.</div>

  <h3>Puissance instantanée</h3>
  <p>Avec \(u = U\sqrt2\cos(\omega t+\varphi_u)\) et \(i = I\sqrt2\cos(\omega t+\varphi_i)\), on obtient :</p>
  <div class="formula">$$\begin{aligned} p(t) &= u(t)\,i(t) \\ &= UI\cos\varphi + UI\cos(2\omega t + \varphi_u + \varphi_i) \end{aligned}$$</div>
  <p>La puissance instantanée oscille à \(2\omega\) autour de sa moyenne : en monophasé, la puissance livrée est <strong>pulsante</strong> (elle devient même négative une partie du temps si \(\varphi \neq 0\)), d'où un couple pulsant pour un moteur monophasé.</p>

  <div class="def-box">
    <strong>Définitions</strong> (régime sinusoïdal) :
    <div class="formula">$$P = UI\cos\varphi\ \ (\text{W})$$$$Q = UI\sin\varphi\ \ (\text{var})$$$$S = UI\ \ (\text{VA})$$</div>
    <div class="formula">$$S^2 = P^2 + Q^2$$$$f_p = \frac{P}{S} = \cos\varphi$$$$\underline{S} = \underline{u}\,\underline{i}^{*} = P + jQ$$</div>
    Le facteur de puissance \(f_p = P/S\) garde son sens en régime non sinusoïdal, mais il n'est alors plus égal à \(\cos\varphi\).
  </div>
  <div class="prop-box">
    <strong>Puissance active en régime continu ou périodique.</strong> Dans tous les cas, la puissance active est la <strong>valeur moyenne</strong> de la puissance instantanée sur une période :
    <div class="formula" data-nom="Puissance active">$$P = \langle u\,i\rangle = \frac{1}{T}\int_0^T u(t)\,i(t)\,\mathrm{d}t$$</div>
    <ul style="margin:.3rem 0">
      <li>en <strong>continu</strong> : \(P = U\,I\) ;</li>
      <li>si l'une des deux grandeurs est <strong>constante</strong> (tension d'un bus continu \(E\), courant \(I\) d'une charge très inductive), elle sort de la moyenne : \(P = E\,\langle i\rangle\) ou \(P = \langle u\rangle\,I\) ;</li>
      <li>si la tension est <strong>sinusoïdale</strong> et le courant périodique quelconque, seul le fondamental du courant (valeur efficace \(I_1\), déphasage \(\varphi_1\)) porte de la puissance active : \(P = V I_1\cos\varphi_1\). Les harmoniques augmentent la valeur efficace du courant, donc \(S = VI\), sans rien apporter à \(P\) : c'est pourquoi \(f_p \lt 1\) pour un redresseur (§7).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Bilan par dipôle.</strong> Pour \(\underline{Z} = R + jX\) parcourue par \(I\) : \(P = RI^2\) et \(Q = XI^2\). Une inductance <strong>absorbe</strong> de la puissance réactive (\(Q = L\omega I^2 > 0\)), un condensateur en <strong>fournit</strong> (\(Q = -C\omega U^2 \lt 0\)), une résistance n'en échange pas.
  </div>

  <h3>Théorème de Boucherot</h3>
  <div class="prop-box">
    <strong>Théorème.</strong> Dans une installation où toutes les grandeurs sont sinusoïdales de même fréquence, la puissance active totale est la somme des puissances actives des récepteurs, et la puissance réactive totale est la <strong>somme algébrique</strong> de leurs puissances réactives :
    $$P = \sum_k P_k$$$$Q = \sum_k Q_k$$$$S = \sqrt{P^2+Q^2}\ \leq\ \sum_k S_k$$
    <em>Idée de preuve</em> : les lois de Kirchhoff conservent la puissance complexe \(\underline{S} = \sum_k \underline{u}_k\,\underline{i}_k^{*}\) ; on sépare parties réelle et imaginaire. Les puissances apparentes, elles, ne s'ajoutent pas.
  </div>

  <h3>Relèvement du facteur de puissance</h3>
  <p>À puissance utile \(P\) et tension \(U\) données, le courant en ligne vaut \(I = P/(U\cos\varphi)\) : un mauvais facteur de puissance augmente les pertes Joule en ligne (proportionnelles à \(1/\cos^2\varphi\)) et oblige à surdimensionner câbles et transformateurs, qui se dimensionnent en VA. Les distributeurs facturent l'énergie réactive des gros clients au-delà de \(\tan\varphi = 0{,}4\) environ (\(\cos\varphi \approx 0{,}93\)).</p>
  <div class="def-box">
    <strong>Compensation par condensateur en parallèle.</strong> Le condensateur fournit \(Q_C = C\omega U^2\) sans modifier \(P\). Pour passer de \(\varphi\) à \(\varphi'\) :
    <div class="formula">$$Q_C = P\,(\tan\varphi - \tan\varphi')$$$$\Longrightarrow\ C = \frac{P\,(\tan\varphi - \tan\varphi')}{U^2\,\omega}$$</div>
  </div>
  <div class="notice">
    La compensation ne change ni la puissance active ni la tension : seul le <strong>courant en ligne</strong> diminue. On vise \(\cos\varphi'\) entre 0,93 et 0,98 sans surcompenser (une installation capacitive est aussi pénalisante et peut faire monter la tension).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un moteur absorbe 3 kW sous 230 V, 50 Hz avec \(\cos\varphi = 0{,}8\). Quelle capacité pour obtenir \(\cos\varphi' = 1\) ? Quel gain sur le courant ?</span>
    <div class="content"><p>\(\tan\varphi = 0{,}75\), donc \(Q = 2{,}25\ \text{kvar}\). Pour \(\varphi' = 0\) : \(C = Q/(U^2\omega)\) \(= 2250/(230^2\times 314)\) \(\approx 135\ \mu\text{F}\). Courant avant : \(3000/(230\times0{,}8) \approx 16{,}3\ \text{A}\) ; après : \(3000/230 \approx 13{,}0\ \text{A}\), soit 20 % de moins (et 36 % de pertes en ligne en moins).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · TRIPHASÉ ÉQUILIBRÉ</div>
  <h2>Réseau triphasé : tensions simples et tensions composées</h2>
  <div class="intro">L'énergie électrique est produite, transportée et distribuée en triphasé : trois conducteurs de phase et, en basse tension, un neutre. Avantages décisifs : moins de cuivre pour une même puissance transportée, une puissance instantanée <strong>constante</strong> (§6) et la possibilité de créer un champ tournant dans les machines.</div>

  <div class="def-box">
    <strong>Système triphasé équilibré direct.</strong> Les trois <strong>tensions simples</strong> (entre chaque phase et le neutre) ont même valeur efficace \(V\), même fréquence, et sont décalées de \(2\pi/3\) :
    <div class="formula">$$v_1 = V\sqrt2\cos(\omega t)$$$$v_2 = V\sqrt2\cos\!\left(\omega t - \tfrac{2\pi}{3}\right)$$$$v_3 = V\sqrt2\cos\!\left(\omega t - \tfrac{4\pi}{3}\right)$$</div>
    Le système est <strong>direct</strong> si les maxima se succèdent dans l'ordre 1, 2, 3 ; <strong>inverse</strong> dans l'ordre 1, 3, 2. Permuter deux phases inverse l'ordre — et donc le sens de rotation d'un moteur triphasé.
  </div>
  <div class="prop-box">
    <strong>Somme nulle.</strong> À chaque instant \(v_1 + v_2 + v_3 = 0\) ; en complexes, avec \(a = e^{j2\pi/3}\) : \(1 + a + a^2 = 0\).
  </div>

  <h3>Tensions composées</h3>
  <p>Ce sont les tensions entre phases : \(u_{12} = v_1 - v_2\), \(u_{23} = v_2 - v_3\), \(u_{31} = v_3 - v_1\), de somme nulle elles aussi. En complexes :</p>
  <div class="formula">$$\underline{u}_{12} = \underline{v}_1\left(1 - e^{-j2\pi/3}\right) = \sqrt3\,e^{j\pi/6}\,\underline{v}_1$$$$\Longrightarrow\ U = V\sqrt3$$</div>
  <p>La tension composée \(u_{12}\) est en avance de \(\pi/6\) (30°) sur \(v_1\), et ainsi de suite par permutation circulaire.</p>

  <h3>Courants de ligne et neutre</h3>
  <p>Les courants \(i_1, i_2, i_3\) circulant dans les fils de phase sont les <strong>courants de ligne</strong>. Pour un récepteur équilibré, ils forment eux aussi un système triphasé équilibré, donc \(i_N = i_1 + i_2 + i_3 = 0\) : le neutre ne transporte aucun courant et n'est généralement pas raccordé aux moteurs. Sur un récepteur déséquilibré (éclairage, prises), le neutre est indispensable : sans lui, les tensions aux bornes des récepteurs se déséquilibrent.</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Écrire \(u_{12}(t)\) et \(u_{31}(t)\) pour le réseau 230/400 V en prenant \(v_1\) comme origine des phases.</span>
    <div class="content"><p>\(U\sqrt2 \approx 566\ \text{V}\). \(u_{12}(t) = 566\cos(\omega t + \pi/6)\) ; \(u_{31}\) se déduit par permutation (\(1\to2\to3\to1\) retarde de \(2\pi/3\) à chaque pas, donc \(u_{31}\) est en retard de \(4\pi/3\) sur \(u_{12}\)) : \(u_{31}(t) = 566\cos(\omega t + \pi/6 - 4\pi/3)\) \(= 566\cos(\omega t - 7\pi/6)\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · COUPLAGES ÉTOILE ET TRIANGLE</div>
  <h2>Brancher un récepteur triphasé</h2>
  <div class="intro">Un récepteur triphasé équilibré est formé de trois éléments identiques d'impédance \(\underline{Z}\) (résistances d'un four, enroulements d'un moteur). On peut les raccorder au réseau de deux façons, qui ne soumettent pas chaque élément à la même tension.</div>

  <div class="def-box">
    <strong>Couplage étoile (Y).</strong> Chaque élément est placé entre une phase et un point commun (relié ou non au neutre). Il supporte la tension simple \(V\) et il est traversé par le courant de ligne : \(J = I\).
  </div>
  <div class="def-box">
    <strong>Couplage triangle (Δ).</strong> Chaque élément est placé entre deux phases. Il supporte la tension composée \(U\) ; le courant \(J\) qui le traverse est le <strong>courant de phase</strong>, et la loi des nœuds donne \(i_1 = j_{12} - j_{31}\), d'où \(I = J\sqrt3\).
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;text-align:center;min-width:420px">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Couplage</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Tension par élément</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Courant par élément</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Courant de ligne</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">Étoile</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(V = U/\sqrt3\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(J = V/Z\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(I = J\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">Triangle</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(U\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(J = U/Z\)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(I = J\sqrt3\)</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Même récepteur, deux couplages.</strong> À \(\underline{Z}\) fixée, passer d'étoile en triangle multiplie par \(\sqrt3\) la tension et le courant de chaque élément, donc par <strong>3</strong> le courant de ligne et la puissance : \(P_\Delta = 3\,P_Y\). C'est le principe du <strong>démarrage étoile-triangle</strong> d'un moteur prévu pour fonctionner en triangle : démarrer en étoile divise par 3 le courant d'appel (et le couple de démarrage), puis on bascule en triangle.
  </div>

  <h3>Plaque signalétique et plaque à bornes</h3>
  <div class="def-box">
    <strong>Lecture de la plaque.</strong> Un moteur marqué « \(U_\Delta/U_Y\) » (par exemple 230/400 V ou 400/690 V) a des enroulements prévus pour la <strong>plus petite</strong> des deux tensions. On le couple en <strong>triangle</strong> sur un réseau dont la tension composée vaut \(U_\Delta\), en <strong>étoile</strong> sur un réseau dont la tension composée vaut \(U_Y\). Sur tout autre réseau, il n'est pas utilisable.
  </div>

<div class="course-section">
  <div class="sec-num">§6 · PUISSANCES EN TRIPHASÉ</div>
  <h2>Puissances d'un récepteur équilibré et leur mesure</h2>
  <div class="intro">On applique Boucherot aux trois éléments : la puissance totale vaut trois fois celle d'un élément, quel que soit le couplage, et s'exprime simplement avec les grandeurs de ligne \(U\) et \(I\), les seules accessibles sans ouvrir la plaque à bornes.</div>
  <div class="prop-box">
    <strong>Expressions.</strong> Avec \(\varphi = \arg\underline{Z}\), déphasage entre la tension aux bornes d'<em>un élément</em> et le courant qui le traverse :
    <div class="formula">$$P = 3\,V_{\text{él}}\,J\cos\varphi = \sqrt3\,U I\cos\varphi$$$$Q = \sqrt3\,U I\sin\varphi$$$$S = \sqrt3\,U I$$</div>
    En étoile, \(V_{\text{él}} = U/\sqrt3\) et \(J = I\) ; en triangle, \(V_{\text{él}} = U\) et \(J = I/\sqrt3\) : dans les deux cas \(3V_{\text{él}}J = \sqrt3\,UI\). Le facteur de puissance reste \(f_p = P/S = \cos\varphi\).
  </div>
  <div class="notice">
    \(\varphi\) n'est <strong>pas</strong> le déphasage entre la tension composée \(u_{12}\) et le courant de ligne \(i_1\) (il y a 30° d'écart supplémentaire) : c'est l'argument de l'impédance d'un élément.
  </div>
  <h3>Puissance instantanée constante</h3>
  <p>Pour chaque phase, avec \(v_k = V\sqrt2\cos(\omega t + \varphi_k)\) et un courant en retard de \(\varphi\) :</p>
  <div class="formula">$$\begin{aligned} v_k\,i_k &= VI\cos\varphi \\ &\quad + VI\cos(2\omega t + 2\varphi_k - \varphi) \end{aligned}$$</div>
  <p>Les \(\varphi_k\) étant décalées de \(2\pi/3\), les phases \(2\varphi_k\) le sont de \(4\pi/3\) : les trois termes oscillants forment encore un système triphasé équilibré, à la pulsation \(2\omega\), de somme nulle :</p>
  <div class="formula">$$\begin{aligned} p(t) &= v_1 i_1 + v_2 i_2 + v_3 i_3 \\ &= 3VI\cos\varphi = P \end{aligned}$$</div>
  <p>Un moteur triphasé alimenté par un système équilibré reçoit donc une puissance constante : couple sans pulsation, moins de vibrations qu'en monophasé.</p>

  <h3>Mesure de la puissance (principe)</h3>
  <ul>
    <li><strong>Neutre accessible, récepteur équilibré</strong> : un wattmètre (courant \(i_1\), tension \(v_1\)) mesure \(VI\cos\varphi\), et \(P = 3W\).</li>
    <li><strong>Ligne à trois fils, neutre inaccessible</strong> : on peut mesurer \(U\), \(I\) et le facteur de puissance avec un analyseur de réseau, ou utiliser deux wattmètres (ci-dessous, hors programme).</li>
  </ul>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour aller plus loin (hors programme)</span>
    <span class="prompt">La méthode des deux wattmètres.</span>
    <div class="content">
  <p>\(W_1\) mesure \(\langle u_{13}\,i_1\rangle\), \(W_2\) mesure \(\langle u_{23}\,i_2\rangle\). Comme \(i_3 = -(i_1+i_2)\), on a \(W_1 + W_2 = \langle v_1 i_1 + v_2 i_2 + v_3 i_3\rangle\).</p>
  <div class="formula">$$P = W_1 + W_2$$$$Q = \sqrt3\,(W_1 - W_2)\ \ \text{(régime équilibré)}$$</div>
  <p>En équilibré, \(W_1 = UI\cos(\varphi - \pi/6)\) et \(W_2 = UI\cos(\varphi + \pi/6)\) : \(W_2\) devient négatif dès que \(\varphi > 60°\) (moteur à vide), ce qui ne fausse pas la somme.</p>
    </div>
  </div>

  <h3>Compensation en triphasé</h3>
  <p>Même bilan qu'en monophasé : \(Q_C = P(\tan\varphi - \tan\varphi')\), fourni par une batterie de trois condensateurs identiques.</p>
  <div class="formula">$$\text{triangle : } C_\Delta = \frac{Q_C}{3U^2\omega}$$$$\text{étoile : } C_Y = \frac{Q_C}{3V^2\omega} = 3\,C_\Delta$$</div>
  <p>On préfère le <strong>triangle</strong> : capacités trois fois plus faibles (mais tenue en tension \(U\) au lieu de \(V\)).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un atelier triphasé 400 V absorbe 30 kW avec \(\cos\varphi = 0{,}78\). Courant de ligne ? Capacités en triangle pour atteindre \(\tan\varphi' = 0{,}4\) ?</span>
    <div class="content"><p>\(I = 30\,000/(\sqrt3\times400\times0{,}78)\) \(\approx 55{,}5\ \text{A}\). \(\tan\varphi \approx 0{,}802\), donc \(Q_C = 30\,000\times(0{,}802-0{,}4)\) \(\approx 12{,}1\ \text{kvar}\) et \(C_\Delta = 12\,060/(3\times400^2\times314)\) \(\approx 80\ \mu\text{F}\) par condensateur. Courant après compensation : \(\cos\varphi' = 1/\sqrt{1{,}16} \approx 0{,}928\), \(I' \approx 46{,}6\ \text{A}\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · REDRESSEMENT À DIODES</div>
  <h2>Ponts de diodes monophasé (PD2) et triphasé (PD3)</h2>
  <div class="intro">Hypothèses de travail : diodes parfaites, source alternative parfaite, et charge assimilée à une <strong>source de courant</strong> \(I\) constante (inductance de lissage suffisante, ou moteur à courant continu très inductif). On cherche la forme de la tension de sortie \(u_s\), sa valeur moyenne, son ondulation, et les contraintes sur les diodes.</div>

  <h3>Règle de conduction des diodes</h3>
  <div class="prop-box">
    <strong>Groupes commutateurs.</strong> Parmi des diodes à <strong>cathodes communes</strong>, seule conduit celle dont l'anode est au potentiel <strong>le plus élevé</strong> ; parmi des diodes à <strong>anodes communes</strong>, seule conduit celle dont la cathode est au potentiel <strong>le plus bas</strong>. La sortie d'un pont vaut donc à chaque instant : (plus haut potentiel d'entrée) − (plus bas potentiel d'entrée).
  </div>

  <h3>Pont monophasé PD2 (pont de Graetz)</h3>
  <p>Quatre diodes : \(D_1, D_2\) à cathodes communes (borne + de la sortie), \(D_1', D_2'\) à anodes communes (borne −). Pour \(v = V\sqrt2\sin\theta\) avec \(\theta = \omega t\) : sur \(]0,\pi[\), \(D_1\) et \(D_2'\) conduisent et \(u_s = v\) ; sur \(]\pi, 2\pi[\), \(D_2\) et \(D_1'\) conduisent et \(u_s = -v\). Ainsi \(u_s = |v|\), de période \(T/2\).</p>
  <div class="formula">$$\begin{aligned} \langle u_s\rangle &= \frac{1}{\pi}\int_0^{\pi} V\sqrt2\sin\theta\,\mathrm{d}\theta \\ &= \frac{2V\sqrt2}{\pi} \approx 0{,}90\,V \end{aligned}$$</div>
  <ul>
    <li>Ondulation à \(2f\) (100 Hz), entre 0 et \(V\sqrt2\) : taux \(\Delta u_s/\langle u_s\rangle = \pi/2\).</li>
    <li>Courant absorbé : créneau \(\pm I\), de valeur efficace \(I\) ; facteur de puissance \(f_p = \dfrac{\langle u_s\rangle I}{VI} = \dfrac{2\sqrt2}{\pi} \approx 0{,}90\).</li>
    <li>Chaque diode conduit une demi-période : \(\langle i_D\rangle = I/2\), \(I_D = I/\sqrt2\), tension inverse maximale \(V\sqrt2\).</li>
  </ul>

  <h3>Pont triphasé PD3</h3>
  <p>Six diodes : \(D_1, D_2, D_3\) à cathodes communes, reliées aux phases 1, 2, 3 ; \(D_1', D_2', D_3'\) à anodes communes. Chaque diode conduit pendant \(2\pi/3\), une commutation a lieu tous les \(\pi/3\), et la sortie suit l'<strong>enveloppe des tensions composées</strong> : \(u_s = \max(v_k) - \min(v_k)\). On compte six arches par période (indice de pulsation 6).</p>

<figcaption>Sortie d'un PD3 : chaque arche est une portion de tension composée (\(u_{12}\), puis \(-u_{31}\), \(u_{23}\)…) autour de son maximum. Ondulation faible, à 300 Hz pour un réseau à 50 Hz.</figcaption>
</figure>
  <p>Sur une arche centrée sur le maximum d'une tension composée (durée \(\pi/3\)) :</p>
  <div class="formula">$$\begin{aligned} \langle u_s\rangle &= \frac{3}{\pi}\int_{-\pi/6}^{\pi/6} U\sqrt2\cos\theta\,\mathrm{d}\theta \\ &= \frac{3U\sqrt2}{\pi} = \frac{3\sqrt6\,V}{\pi} \approx 1{,}35\,U \end{aligned}$$</div>
  <div class="prop-box">
    <strong>À retenir sur le PD3.</strong>
    <ul style="margin:.4rem 0">
      <li>\(u_s\) varie entre \(U\sqrt2\cos(\pi/6) = U\sqrt6/2\) et \(U\sqrt2\) ; taux d'ondulation \(\dfrac{\Delta u_s}{\langle u_s\rangle} = \dfrac{\pi}{3}\left(1 - \dfrac{\sqrt3}{2}\right) \approx 14\ \%\), à la fréquence \(6f\).</li>
      <li>Sur le réseau 400 V : \(\langle u_s\rangle \approx 540\ \text{V}\), l'ordre de grandeur de la tension de bus continu des variateurs alimentés en 400 V (un peu plus, jusqu'à la crête \(U\sqrt2 \approx 566\ \text{V}\), avec un filtrage par condensateur seul et à faible charge).</li>
      <li>Courant de ligne : créneaux \(+I\) (durée \(2\pi/3\)), 0 (\(\pi/3\)), \(-I\) (\(2\pi/3\)), 0 (\(\pi/3\)), de valeur efficace \(I\sqrt{2/3}\). Son fondamental est en phase avec la tension simple, mais il contient des harmoniques de rangs \(6k\pm1\) (5, 7, 11, 13…) : \(f_p = 3/\pi \approx 0{,}955\).</li>
      <li>Diodes : \(\langle i_D\rangle = I/3\), \(I_D = I/\sqrt3\), tension inverse maximale \(U\sqrt2\).</li>
    </ul>
  </div>
  <p>Remplacer les diodes par des <strong>thyristors</strong> amorcés avec un retard angulaire \(\psi\) donne un pont commandé : \(\langle u_s\rangle\) est multipliée par \(\cos\psi\), et devient négative pour \(\psi > \pi/2\) (le pont renvoie alors l'énergie d'une charge active vers le réseau). Ces montages sont hors programme (culture).</p>

  <h3>Filtrage de la tension redressée</h3>
  <div class="prop-box">
    <strong>Rôle des éléments.</strong> Une inductance en série lisse le <strong>courant</strong> (la charge vue par le pont devient une source de courant) ; un condensateur en parallèle lisse la <strong>tension</strong> (il forme une source de tension pour l'étage suivant). Le filtre \(LC\) est un passe-bas du deuxième ordre : il conserve la valeur moyenne et atténue les harmoniques de tension d'environ 40 dB par décade au-delà de \(f_0\).
    <div class="formula">$$f_0 = \frac{1}{2\pi\sqrt{LC}}\ \ll\ f_{\text{ond}}$$$$\frac{U_{n,\text{sortie}}}{U_{n,\text{entrée}}} \approx \frac{1}{LC\,\omega_n^2 - 1}$$</div>
    avec \(f_{\text{ond}} = 2f\) pour un PD2 et \(6f\) pour un PD3. Avec un condensateur seul débitant un courant \(I\), on majore l'ondulation crête à crête par \(\Delta u \approx I/(C f_{\text{ond}})\) (décharge à courant constant entre deux recharges).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ONDULEUR MONOPHASÉ</div>
  <h2>Du pont en H à l'onduleur : pleine onde, commande décalée, MLI</h2>
  <div class="intro">L'onduleur monophasé en pont a exactement la structure du hacheur quatre quadrants (pont en H) : deux bras, quatre interrupteurs réversibles en courant (transistor + diode antiparallèle), alimentés par une source de tension continue \(E\). Seule change la loi de commande : on veut une tension de sortie alternative, de valeur moyenne nulle.</div>

  <h3>Rappels sur le hachage (chapitre « Hacheurs »)</h3>
  <div class="prop-box">
    <ul style="margin:.2rem 0">
      <li>Hacheur série : \(\langle u\rangle = \alpha E\) ; ondulation du courant dans une charge d'inductance \(L\), pour une fréquence de découpage \(f_{\text{déc}}\) : \(\Delta i = \dfrac{\alpha(1-\alpha)E}{L f_{\text{déc}}}\), maximale pour \(\alpha = 1/2\) : \(\dfrac{E}{4L f_{\text{déc}}}\).</li>
      <li>Pont en H en commande bipolaire (diagonales commutées alternativement) : \(\langle u\rangle = (2\alpha - 1)E\), \(\Delta i = \dfrac{2\alpha(1-\alpha)E}{L f_{\text{déc}}}\), au plus \(\dfrac{E}{2L f_{\text{déc}}}\). Réversible en tension et en courant : quatre quadrants.</li>
    </ul>
    Le quadrant de fonctionnement se lit sur les <strong>valeurs moyennes</strong> de \(u\) et \(i\). Si l'on fait varier \(\alpha\) lentement et sinusoïdalement autour de 1/2, la valeur moyenne de \(u\) devient sinusoïdale : c'est l'idée de la MLI.
  </div>

  <h3>Ondulation de tension en sortie d'un hacheur filtré</h3>
  <p>Une charge sensible (électronique, batterie, éclairage) demande une tension presque constante : on place en sortie du hacheur un <strong>condensateur</strong>, souvent précédé de l'inductance de lissage (filtre <strong>LC</strong>). On cherche l'ondulation crête à crête \(\Delta v_s\) de la tension de sortie en régime permanent, en conduction continue.</p>
  <div class="prop-box">
    <strong>Filtre LC (hacheur série).</strong> Le courant \(i_L\) de l'inductance est triangulaire, d'ondulation \(\Delta i\) autour de sa moyenne \(I_s\) ; la tension de sortie étant presque constante, la charge absorbe \(I_s\) et le condensateur reçoit la composante alternative \(i_L - I_s\). La charge qu'il accumule pendant la demi-période où \(i_L \gt I_s\) donne
    <div class="formula" data-nom="Ondulation de tension d'un hacheur série filtré">$$\Delta v_s = \frac{\Delta i}{8\,C f_{\text{déc}}} = \frac{\alpha(1-\alpha)\,E}{8\,L C\,f_{\text{déc}}^2}$$</div>
    Elle décroît comme \(1/f_{\text{déc}}^2\) : c'est l'effet du passe-bas du 2ᵉ ordre de fréquence propre \(f_0 = 1/(2\pi\sqrt{LC})\), à choisir très inférieure à \(f_{\text{déc}}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">D'où vient le facteur 8 ?</span>
    <div class="content">
      <p>Le courant \(i_C = i_L - I_s\) est un triangle d'amplitude crête à crête \(\Delta i\), de valeur moyenne nulle. Il est positif pendant une demi-période \(T/2\), et l'aire correspondante est celle d'un triangle de base \(T/2\) et de hauteur \(\Delta i/2\) : \(\Delta Q = \frac12\cdot\frac{T}{2}\cdot\frac{\Delta i}{2} = \frac{T\,\Delta i}{8}\). La tension du condensateur monte de \(\Delta v_s = \Delta Q/C\) pendant ce temps, puis redescend d'autant : \(\Delta v_s = \Delta i/(8Cf_{\text{déc}})\). On remplace enfin \(\Delta i\) par \(\alpha(1-\alpha)E/(Lf_{\text{déc}})\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Condensateur seul.</strong> Quand le condensateur doit fournir seul le courant de charge \(I_s\) pendant une durée \(t_d\) de chaque période, il se décharge de \(\Delta v_s \approx I_s\,t_d/C\). C'est le cas du hacheur parallèle (élévateur), dont la diode est bloquée pendant \(\alpha T\) : \(\Delta v_s \approx \dfrac{\alpha\,I_s}{C f_{\text{déc}}}\). La même estimation sert pour un redresseur filtré par condensateur (§7).
  </div>
  <div class="method-box">
    <strong>Exemple — alimentation 24 V d'un vélo à assistance électrique</strong>
    <p>Un hacheur série abaisse la tension d'une batterie de 48 V à 24 V pour l'électronique et l'éclairage : \(\alpha = 0{,}5\), \(f_{\text{déc}} = 20\ \text{kHz}\), \(L = 1\ \text{mH}\), \(C = 100\ \mu\text{F}\), courant de sortie 5 A.</p>
    <ol>
      <li>Ondulation de courant : \(\Delta i = \dfrac{0{,}5\times0{,}5\times48}{10^{-3}\times2\cdot10^4} = 0{,}6\ \text{A}\), soit 12 % du courant moyen.</li>
      <li>Ondulation de tension : \(\Delta v_s = \dfrac{0{,}6}{8\times10^{-4}\times2\cdot10^4}\), soit 37,5 mV ou 0,16 % de 24 V. Une simulation du montage donne la même valeur.</li>
      <li>Vérification : \(f_0 = 1/(2\pi\sqrt{LC}) \approx 503\ \text{Hz}\), quarante fois sous \(f_{\text{déc}}\) : le filtre est bien dimensionné.</li>
      <li>Sans inductance de filtrage, avec un hacheur élévateur 24 V → 48 V (\(\alpha = 0{,}5\)) débitant 2 A sur le même condensateur : \(\Delta v_s \approx \dfrac{0{,}5\times2}{10^{-4}\times2\cdot10^4}\), soit 0,5 V ou 1 % : le condensateur seul filtre beaucoup moins bien.</li>
    </ol>
  </div>

  <h3>Structure et notations</h3>
  <p>Bras 1 : \(K_1\) (haut) et \(K_1'\) (bas), point milieu A ; bras 2 : \(K_2\) et \(K_2'\), point milieu B. La charge est entre A et B : \(u = v_A - v_B\). Dans chaque bras, les commandes sont <strong>complémentaires</strong> (temps mort mis à part), si bien que \(v_A\) et \(v_B\) valent \(0\) ou \(E\) (potentiels repérés par rapport à la borne − de la source).</p>

  <h3>Commande pleine onde</h3>
  <p>\(K_1\) et \(K_2'\) sont commandés sur la première demi-période (\(u = +E\)), \(K_1'\) et \(K_2\) sur la seconde (\(u = -E\)). La tension est un créneau \(\pm E\) : \(U = E\), et sa série de Fourier ne contient que des harmoniques impairs.</p>
  <div class="formula">$$u(t) = \frac{4E}{\pi}\sum_{k\geq0}\frac{\sin\big((2k+1)\,\omega t\big)}{2k+1}$$$$U_1 = \frac{2\sqrt2}{\pi}E \approx 0{,}90\,E$$$$U_n = \frac{U_1}{n}\ \ (n\ \text{impair})$$</div>
  <p>La fréquence se règle par la commande, mais l'amplitude du fondamental est figée par \(E\), et l'harmonique 3 vaut un tiers du fondamental.</p>

  <h3>Commande décalée</h3>
  <p>Chaque bras reste en pleine onde, mais le bras 2 est commandé avec un retard angulaire \(\delta\) par rapport à l'opposition du bras 1. La tension prend trois niveaux \(+E\), \(0\), \(-E\) : créneaux de largeur \(\pi - \delta\) séparés de paliers nuls, pendant lesquels deux interrupteurs du même côté (\(K_1\) et \(K_2\), ou \(K_1'\) et \(K_2'\)) court-circuitent la charge : phase de <strong>roue libre</strong>.</p>
  <div class="formula">$$U = E\sqrt{1 - \frac{\delta}{\pi}}$$$$U_n = \frac{2\sqrt2\,E}{n\pi}\left|\cos\frac{n\delta}{2}\right|\ \ (n\ \text{impair})$$</div>
  <div class="prop-box">
    <strong>Intérêts.</strong> L'angle \(\delta\) règle le fondamental à \(E\) fixé. Le choix \(\delta = \pi/3\) (créneaux de 120°) annule l'harmonique 3 et ses multiples : \(\cos(3\pi/6) = 0\).
  </div>

  <h3>Commande MLI sinus-triangle</h3>
  <p>On compare une <strong>modulante</strong> sinusoïdale \(v_m\) (amplitude \(V_m\), fréquence \(f\) souhaitée en sortie) à une <strong>porteuse</strong> triangulaire \(v_p\) (amplitude \(V_p\), fréquence \(f_{\text{déc}} \gg f\), qui est la fréquence de découpage). En MLI bipolaire : si \(v_m > v_p\), \(K_1\) et \(K_2'\) sont fermés et \(u = +E\) ; sinon \(u = -E\).</p>
  <p>Sur une période de porteuse, le rapport cyclique vaut \(\alpha = \frac12\left(1 + \frac{v_m}{V_p}\right)\), donc la valeur moyenne glissante de \(u\) est :</p>
  <div class="formula">$$\langle u\rangle_{T_p} = (2\alpha - 1)\,E = \frac{E}{V_p}\,v_m(t)$$$$m = \frac{V_m}{V_p} \leq 1$$$$U_1 = \frac{m\,E}{\sqrt2}$$</div>
  <div class="prop-box">
    <strong>Bilan de la MLI.</strong> Amplitude (par \(m\)) et fréquence (par \(f\)) se règlent indépendamment ; les harmoniques sont rejetés autour de \(f_{\text{déc}}\), \(2f_{\text{déc}}\)… donc très faciles à filtrer par l'inductance de la charge. Contrepartie : beaucoup de commutations, donc des pertes par commutation proportionnelles à \(f_{\text{déc}}\) (quelques kHz à une vingtaine de kHz avec des IGBT). La MLI unipolaire (trois niveaux) double la fréquence apparente de l'ondulation.
  </div>

  <h3>Rôle de la charge inductive</h3>
  <div class="prop-box">
    <strong>Filtrage par la charge.</strong> On calcule le courant harmonique par harmonique : \(I_n = U_n/|\underline{Z}(n\omega)|\). Pour une charge \(R\)–\(L\), \(|\underline{Z}(n\omega)| \approx nL\omega\) aux rangs élevés, donc en pleine onde \(I_n\) décroît comme \(1/n^2\) : le courant est bien plus proche d'une sinusoïde que la tension.
  </div>
  <div class="notice">
    Le courant étant en retard sur la tension, il existe après chaque commutation un intervalle où \(u\) et \(i\) sont de signes opposés : ce sont les <strong>diodes</strong> qui conduisent et l'énergie stockée dans l'inductance <strong>revient vers la source</strong> (courant d'entrée négatif). Sans diodes antiparallèles, on ouvrirait une source de courant ; et la source continue doit accepter un courant inversé (condensateur de bus).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ONDULEUR TRIPHASÉ ET CHOIX DES COMPOSANTS</div>
  <h2>Onduleur à trois bras, variation de vitesse, dimensionnement</h2>
  <div class="intro">Pour alimenter une machine synchrone ou asynchrone à vitesse variable, il faut un système triphasé de tensions dont on règle la fréquence et l'amplitude. Un troisième bras suffit : l'onduleur triphasé compte six interrupteurs réversibles en courant.</div>

  <h3>Structure et commande pleine onde</h3>
  <p>Trois bras \((K_1, K_1')\), \((K_2, K_2')\), \((K_3, K_3')\), de points milieux A, B, C reliés aux trois phases de la charge. En commande pleine onde (« 180° »), chaque bras est commandé en créneaux, les bras étant décalés de \(T/3\). Les potentiels \(v_A, v_B, v_C\) valent \(0\) ou \(E\).</p>
  <div class="prop-box">
    <ul style="margin:.2rem 0">
      <li>Tensions composées : \(u_{AB} = v_A - v_B\) est un créneau \(\pm E\) de largeur \(2\pi/3\) — pas d'harmonique de rang multiple de 3 — de fondamental \(U_1 = \dfrac{\sqrt6}{\pi}E \approx 0{,}78\,E\).</li>
      <li>Tensions simples d'une charge équilibrée en étoile : comme \(v_1 + v_2 + v_3 = 0\), le potentiel du point neutre vaut \(\frac13(v_A+v_B+v_C)\) et</li>
    </ul>
    <div class="formula">$$\begin{aligned} v_1 &= \frac{2v_A - v_B - v_C}{3} \\ &\in \left\{\pm\frac{E}{3},\ \pm\frac{2E}{3}\right\} \end{aligned}$$$$V_1 = \frac{\sqrt2}{\pi}E \approx 0{,}45\,E$$</div>
    Onde « en marches d'escalier » à six paliers par période, dont il reste les harmoniques de rangs \(6k\pm1\) (5, 7, 11…).
  </div>
  <p>En <strong>MLI triphasée</strong>, on compare trois modulantes décalées de \(2\pi/3\) à une même porteuse. Le fondamental des tensions composées vaut \(U_1 = \frac{\sqrt3}{2\sqrt2}\,mE \approx 0{,}61\,mE\) pour \(m \leq 1\) ; l'ajout d'un harmonique 3 commun aux trois modulantes (ou la modulation vectorielle) permet de monter jusqu'à \(E/\sqrt2\) sans déformer les tensions composées (ces deux techniques sont hors programme).</p>

  <h3>Intérêt : alimenter une machine à fréquence variable</h3>
  <div class="def-box">
    <strong>Variateur de vitesse.</strong> La vitesse de synchronisme d'une machine à \(p\) paires de pôles vaut \(n_s = 60f/p\) (tr/min) : régler la fréquence règle la vitesse. Pour garder le flux (donc le couple disponible) constant, on maintient le rapport \(U/f\) à peu près constant (loi \(U/f\), détaillée dans le chapitre « Machines synchrone et asynchrone »). Le sens de rotation s'inverse en permutant la séquence de commande de deux bras, sans contacteur.
  </div>

  <div class="prop-box">
    <strong>Réversibilité.</strong> L'onduleur est réversible en courant : au freinage, la machine fonctionne en génératrice et le courant moyen du bus s'inverse. Le PD3, lui, n'est pas réversible : l'énergie s'accumule dans le condensateur et la tension du bus monte. Solutions : un <strong>hacheur de freinage</strong> qui dissipe l'énergie dans une résistance, un <strong>redresseur MLI réversible</strong> (un onduleur triphasé côté réseau) qui la renvoie au réseau avec un courant quasi sinusoïdal, ou un bus continu partagé entre plusieurs variateurs.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Le condensateur de bus d'un variateur (540 V, 1 mF) stocke-t-il de l'énergie ? Que se passe-t-il si un freinage y renvoie 2 kW pendant 50 ms ?</span>
    <div class="content"><p>Énergie stockée : \(\frac12 CU^2 = \frac12\times10^{-3}\times540^2 \approx 146\ \text{J}\), de quoi alimenter un moteur de 10 kW pendant environ 15 ms seulement : le condensateur de bus filtre la tension, il ne sert pas de réserve d'énergie. Un freinage qui renvoie \(2\ \text{kW}\times50\ \text{ms} = 100\ \text{J}\) porte l'énergie à 246 J, donc la tension à \(\sqrt{2\times246/10^{-3}} \approx 700\ \text{V}\) : c'est pour éviter cette surtension que l'on ajoute un hacheur de freinage ou un redresseur réversible.</p></div>
  </div>

  <h3>Choix des composants</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0;min-width:480px">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Poste</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Tension bloquée maximale</th><th style="padding:.35rem .5rem;border:1px solid var(--grid)">Courants à vérifier</th></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">Diode de PD3</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(U\sqrt2\) (≈ 566 V sur 400 V) → calibre 1 200 V à 1 600 V</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(\langle i_D\rangle = I/3\), \(I_D = I/\sqrt3\)</td></tr>
    <tr><td style="padding:.35rem .5rem;border:1px solid var(--grid)">Interrupteur d'un bras d'onduleur</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">\(E\) + surtensions de commutation → calibre ≈ \(2E\) (IGBT 1 200 V pour un bus de 540 V)</td><td style="padding:.35rem .5rem;border:1px solid var(--grid)">crête \(I\sqrt2\) + ondulation MLI ; moyen et efficace pour l'échauffement</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Technologie selon le cahier des charges.</strong>
    <ul style="margin-top:.4rem">
      <li><strong>MOS</strong> : basses tensions (batteries 12 à 48 V, alimentations), fréquences de découpage élevées, pertes de conduction en \(R_{DS(on)}\,I^2\).</li>
      <li><strong>IGBT</strong> : variateurs industriels et traction (600 V à 6,5 kV), découpage de quelques kHz à 20 kHz, chute de tension de l'ordre de 1,5 à 2 V en conduction.</li>
      <li><strong>Diodes</strong> : redresseurs non commandés, roue libre, diodes antiparallèles (souvent intégrées au module IGBT).</li>
      <li><strong>Thyristors</strong> : très fortes puissances côté réseau (redresseurs commandés, hors programme).</li>
    </ul>
    Les pertes totales sont la somme des pertes par conduction (liées aux courants moyen et efficace) et des pertes par commutation (proportionnelles à la fréquence de découpage) : elles fixent le dissipateur.
  </div>
  <div class="notice">
    Démarche : (1) tension maximale bloquée → calibre avec un coefficient de sécurité de 1,5 à 2 ; (2) courant crête (commutation) et courant efficace (échauffement) → calibre en courant ; (3) fréquence de découpage → technologie ; (4) quadrants exigés → cellules réversibles (voir « Convertisseurs statiques » et « Hacheurs »).
  </div>
</div>

<template class="pan-tpl" data-panneau="tph-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · RÉGIMES ALTERNATIFS ET CONVERTISSEURS</div>
  <h2>Savoir-faire pour les épreuves</h2>
  <div class="intro">Dans l'ordre du cours : régime sinusoïdal et puissances (§2, §3), triphasé (§4 à §6), redresseurs (§7), ondulation et filtrage (§7, §8), onduleurs (§8, §9) et choix des composants (§9). Le gradateur, les redresseurs commandés, la méthode des deux wattmètres et la modulation vectorielle sont de la culture : un sujet qui s'en sert les présente.</div>

  <div class="method-box">
    <strong>Méthode 1 — Calculer courant, tension et déphasage en sinusoïdal</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Modèle.</span> Remplacer chaque dipôle par son impédance complexe (\(R\), \(jL\omega\), \(1/(jC\omega)\)), en convention récepteur.</li>
      <li><span class="step">Réduction.</span> Associer en série (impédances) ou en parallèle (admittances) jusqu'à une impédance équivalente \(\underline{Z} = R + jX\).</li>
      <li><span class="step">Module et argument.</span> \(I = U/|\underline{Z}|\) et \(\varphi = \arctan(X/R)\) si \(R>0\) ; le signe de \(X\) dit si la charge est inductive ou capacitive.</li>
      <li><span class="step">Contrôle graphique.</span> Tracer le diagramme de Fresnel (courant en référence pour un circuit série) : les tensions doivent « fermer » le triangle de la loi des mailles.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Bilan de puissances et relèvement du facteur de puissance</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Tableau.</span> Pour chaque récepteur, une ligne \(P_k\), \(Q_k = P_k\tan\varphi_k\) (signe de \(\varphi_k\) !). Attention : une puissance <em>utile</em> de moteur se divise d'abord par le rendement.</li>
      <li><span class="step">Boucherot.</span> Sommer les \(P_k\) et les \(Q_k\) ; en déduire \(S = \sqrt{P^2+Q^2}\), puis \(I = S/U\) (monophasé) ou \(I = S/(\sqrt3\,U)\) (triphasé), et \(\cos\varphi = P/S\).</li>
      <li><span class="step">Compensation.</span> \(Q_C = P(\tan\varphi - \tan\varphi')\), puis \(C = Q_C/(U^2\omega)\) en monophasé, \(C_\Delta = Q_C/(3U^2\omega)\) en triangle.</li>
      <li><span class="step">Conclusion.</span> Recalculer le courant de ligne : il baisse, \(P\) ne change pas. Ne jamais additionner des puissances apparentes.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Choisir le couplage et calculer les courants d'un récepteur triphasé</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Tension d'un élément.</span> Lire sur la plaque la tension nominale d'un enroulement (la plus petite des deux valeurs) ou la tension nominale d'une résistance.</li>
      <li><span class="step">Comparaison au réseau.</span> Si elle égale \(V\) → étoile ; si elle égale \(U\) → triangle.</li>
      <li><span class="step">Courants.</span> \(J = V_{\text{él}}/Z\) dans un élément ; \(I = J\) en étoile, \(I = J\sqrt3\) en triangle. Ou directement \(I = P/(\sqrt3\,U\cos\varphi)\).</li>
      <li><span class="step">Vérification.</span> Même récepteur passé d'étoile en triangle : courant de ligne et puissance multipliés par 3.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Étudier un redresseur à diodes</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Hypothèses.</span> Diodes parfaites, charge source de courant \(I\) (ou préciser la charge réelle).</li>
      <li><span class="step">Diodes passantes.</span> Dans chaque groupe à cathodes communes, l'anode la plus haute conduit ; dans chaque groupe à anodes communes, la cathode la plus basse conduit. Découper la période en intervalles.</li>
      <li><span class="step">Schéma équivalent.</span> Sur chaque intervalle, remplacer les diodes passantes par des fils et supprimer les autres : on lit \(u_s\), le courant de chaque ligne et la tension aux bornes de chaque diode bloquée.</li>
      <li><span class="step">Grandeurs.</span> Intégrer sur une arche pour \(\langle u_s\rangle\) ; relever \(u_{s,\max}\) et \(u_{s,\min}\) pour l'ondulation ; contraintes diodes : tension inverse maximale, \(\langle i_D\rangle\), \(I_D\) efficace.</li>
      <li><span class="step">Côté réseau.</span> Puissance \(P = \langle u_s\rangle I\), courant de ligne efficace, puis \(f_p = P/S\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Valeurs moyenne, efficace et harmoniques d'une tension découpée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Valeur moyenne.</span> Somme des aires algébriques des créneaux divisée par la période.</li>
      <li><span class="step">Valeur efficace.</span> Pour des paliers \(\pm E\) ou \(0\) : \(U = E\sqrt{\text{(fraction du temps où } u \neq 0)}\). Pas besoin d'intégrer.</li>
      <li><span class="step">Symétries.</span> Signal impair et à symétrie de demi-onde : seuls des sinus de rangs impairs, \(b_n = \frac{4}{\pi}\int_0^{\pi/2} u(\theta)\sin(n\theta)\,\mathrm{d}\theta\).</li>
      <li><span class="step">Harmonique à éliminer.</span> Pour des créneaux de largeur \(\pi - \delta\), \(b_n \propto \cos(n\delta/2)\) : annuler l'harmonique \(n\) revient à poser \(n\delta/2 = \pi/2\).</li>
      <li><span class="step">Taux de distorsion.</span> \(\text{THD} = \sqrt{U^2 - U_1^2}/U_1\) (valeurs efficaces), sans sommer la série.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Analyser un onduleur sur charge inductive</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Commande.</span> Écrire, intervalle par intervalle, les interrupteurs <em>commandés</em> et la tension \(u\) imposée (elle ne dépend que de la commande si les interrupteurs sont réversibles en courant).</li>
      <li><span class="step">Courant.</span> Résoudre \(L\,\mathrm{d}i/\mathrm{d}t + Ri = u\) sur chaque intervalle, puis imposer la périodicité (en pleine onde : \(i(T/2) = -i(0)\)) ; ou, plus vite, raisonner harmonique par harmonique : \(I_n = U_n/|R + jnL\omega|\).</li>
      <li><span class="step">Composants passants.</span> Pour un interrupteur commandé : transistor si le courant le traverse dans le sens direct, diode antiparallèle sinon. Les intervalles où \(u\,i \lt 0\) sont ceux de conduction des diodes (retour d'énergie vers la source).</li>
      <li><span class="step">Puissance.</span> \(P = R\,I^2\) avec \(I\) efficace total, ou \(P \approx U_1 I_1\cos\varphi_1\) si le courant est quasi sinusoïdal.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Choisir les composants d'un convertisseur</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Tension.</span> Identifier la tension maximale aux bornes de chaque interrupteur bloqué (\(E\) dans un bras alimenté par \(E\) ; \(U\sqrt2\) pour une diode de PD3) ; prendre un calibre 1,5 à 2 fois plus grand.</li>
      <li><span class="step">Courant.</span> Courant crête (charge + ondulation) pour la commutation ; courants moyen et efficace pour les pertes et l'échauffement.</li>
      <li><span class="step">Technologie.</span> MOS pour basse tension et haute fréquence, IGBT pour les fortes tensions et puissances, diodes pour les commutations spontanées.</li>
      <li><span class="step">Réversibilité.</span> Lister les quadrants nécessaires ; vérifier que les cellules (transistor + diode antiparallèle) et la source amont acceptent l'inversion du courant ou de la tension.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Calculer une ondulation et dimensionner un filtre</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Ondulation de courant.</span> Dans l'inductance d'un hacheur série en conduction continue : \(\Delta i = \dfrac{\alpha(1-\alpha)E}{L f_{\text{déc}}}\), au plus \(E/(4Lf_{\text{déc}})\) pour \(\alpha = 1/2\) ; on choisit \(L\) pour que \(\Delta i\) reste une fraction (10 à 30 %) du courant moyen.</li>
      <li><span class="step">Ondulation de tension, filtre LC.</span> Le condensateur reçoit la partie alternative, triangulaire, du courant de l'inductance : \(\Delta v_s = \dfrac{\Delta i}{8\,C f_{\text{déc}}}\) ; on en tire \(C\).</li>
      <li><span class="step">Condensateur seul.</span> Il fournit seul le courant de charge pendant une durée \(t_d\) de chaque période : \(\Delta v_s \approx I_s t_d/C\) (hacheur parallèle : \(t_d = \alpha T\) ; redresseur : \(\Delta u \approx I/(C f_{\text{ond}})\), avec \(f_{\text{ond}} = 2f\) pour un PD2, \(6f\) pour un PD3).</li>
      <li><span class="step">Contrôle.</span> Fréquence propre \(f_0 = 1/(2\pi\sqrt{LC})\) très inférieure à la fréquence d'ondulation (au moins une décade) ; conduction continue tant que le courant moyen dépasse \(\Delta i/2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> hacheur série 24 V → 12 V (\(\alpha = 0{,}5\)), \(f_{\text{déc}} = 20\ \text{kHz}\), \(L = 300\ \mu\text{H}\), \(C = 47\ \mu\text{F}\) : \(\Delta i = 6/(300\times10^{-6}\times2\times10^4) = 1{,}0\ \text{A}\), \(\Delta v_s = 1{,}0/(8\times47\times10^{-6}\times2\times10^4) \approx 0{,}13\ \text{V}\) ; \(f_0 \approx 1{,}3\ \text{kHz} \ll 20\ \text{kHz}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'ondulation de tension d'un filtre LC décroît comme \(1/f_{\text{déc}}^2\), celle d'un condensateur seul comme \(1/f_{\text{déc}}\) : doubler la fréquence de découpage ne divise pas les deux par le même facteur.</div>

  <div class="method-box">
    <strong>Méthode 9 — Calculer une puissance active hors du régime sinusoïdal</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Définition.</span> Toujours \(P = \langle u\,i\rangle\), valeur moyenne de la puissance instantanée sur une période.</li>
      <li><span class="step">Une grandeur constante.</span> Si la tension est constante (bus continu \(E\)), \(P = E\,\langle i\rangle\) ; si le courant est constant (charge très inductive \(I\)), \(P = \langle u\rangle\,I\). Jamais le produit des valeurs efficaces.</li>
      <li><span class="step">Tension sinusoïdale, courant déformé.</span> Seul le fondamental du courant porte de la puissance active : \(P = V I_1\cos\varphi_1\). Les harmoniques augmentent \(S = VI\) : \(f_p = P/S \lt \cos\varphi_1\).</li>
      <li><span class="step">Énergie d'un condensateur de bus.</span> \(\tfrac12 C E^2\) ; une énergie \(W\) renvoyée au bus porte la tension à \(\sqrt{E^2 + 2W/C}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un onduleur prélève sur un bus de 540 V un courant découpé de valeur moyenne 18 A et de valeur efficace 25 A : \(P = 540\times18 \approx 9{,}7\ \text{kW}\) (et non \(540\times25 = 13{,}5\ \text{kW}\)).</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Confondre amplitude et valeur efficace : « 230 V » est une valeur efficace (amplitude ≈ 325 V).</li>
      <li>Prendre pour \(\varphi\) le déphasage entre \(u_{12}\) et \(i_1\) : en triphasé, \(\varphi\) est l'argument de l'impédance d'un élément.</li>
      <li>Utiliser \(P = \sqrt3\,UI\cos\varphi\) avec \(U\) tension simple, ou \(I\) courant dans un élément du triangle.</li>
      <li>Additionner des puissances apparentes, ou oublier le signe des puissances réactives des condensateurs.</li>
      <li>Écrire \(f_p = \cos\varphi\) pour un redresseur : le courant n'est pas sinusoïdal, il faut \(f_p = P/S\).</li>
      <li>Fermer simultanément les deux interrupteurs d'un même bras : court-circuit de la source de tension.</li>
      <li>Nommer un quadrant sans préciser le plan : le freinage en marche avant est le quadrant 4 dans le plan \((\langle u\rangle, \langle i\rangle)\) du convertisseur, le quadrant 2 dans le plan \((C_{em}, \Omega)\) des machines.</li>
    </ul>
  </div>
</div>
</template>
