<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Récepteur inductif : impédance, Fresnel et puissances</h3>
  <div class="statement">À son point de fonctionnement, le moteur monophasé d'une pompe d'arrosage est modélisé par une résistance \(R = 12\ \Omega\) en série avec une inductance \(L = 51\ \text{mH}\). Il est alimenté sous \(U = 230\ \text{V}\), 50 Hz.</div>
  <div class="q"><strong>Q1.</strong> Calculer la réactance \(L\omega\), le module de l'impédance, le courant \(I\) et le déphasage \(\varphi\) de la tension sur le courant.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(U_R\) et \(U_L\). Construire le diagramme de Fresnel (courant en référence) et vérifier la loi des mailles.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(P\), \(Q\), \(S\) et le facteur de puissance, de deux façons différentes.</div>
  <div class="q"><strong>Q4.</strong> Quelle capacité placer en parallèle pour obtenir un facteur de puissance unitaire ? Que devient le courant en ligne ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega = 2\pi\times50 \approx 314\ \text{rad/s}\), \(L\omega = 0{,}051\times314 \approx 16{,}0\ \Omega\). \(Z = \sqrt{12^2+16^2} = 20\ \Omega\), donc \(I = 230/20 = 11{,}5\ \text{A}\). \(\cos\varphi = R/Z = 0{,}6\), \(\varphi \approx 53{,}1°\) : courant en retard, charge inductive.</p>
    <p><strong>Q2.</strong> \(U_R = RI = 138\ \text{V}\) (vecteur porté par \(\vec I\)), \(U_L = L\omega I = 184\ \text{V}\) (vecteur en avance de 90°). Le triangle rectangle se ferme : \(\sqrt{138^2 + 184^2} = \sqrt{52\,900} = 230\ \text{V}\). On remarque que \(U_R + U_L = 322\ \text{V} > U\) : les valeurs efficaces ne s'ajoutent pas.</p>
    <p><strong>Q3.</strong> Par le dipôle : \(P = RI^2 = 12\times11{,}5^2 \approx 1\,587\ \text{W}\), \(Q = L\omega I^2 \approx 2\,116\ \text{var}\). Par les grandeurs globales : \(S = UI = 2\,645\ \text{VA}\), \(P = S\cos\varphi = 1\,587\ \text{W}\), \(Q = S\sin\varphi = 2\,116\ \text{var}\). Facteur de puissance : \(0{,}6\), médiocre.</p>
    <p><strong>Q4.</strong> Le condensateur doit fournir \(Q_C = 2\,116\ \text{var}\) : \(C = Q_C/(U^2\omega)\) \(= 2116/(230^2\times314)\) \(\approx 127\ \mu\text{F}\). Le courant en ligne devient \(I' = P/U = 1587/230 \approx 6{,}9\ \text{A}\) au lieu de 11,5 A ; le courant dans le moteur, lui, est inchangé.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Bilan d'un atelier par le théorème de Boucherot</h3>
  <div class="statement">Un petit atelier est alimenté en monophasé 230 V, 50 Hz. Il comporte des radiateurs (2 kW, \(\cos\varphi = 1\)), un compresseur dont le moteur absorbe 4 kW avec \(\cos\varphi = 0{,}70\), et des outils électroportatifs (0,5 kW au total, \(\cos\varphi = 0{,}90\), inductifs).</div>
  <div class="q"><strong>Q1.</strong> Dresser le tableau des puissances active et réactive de chaque récepteur.</div>
  <div class="q"><strong>Q2.</strong> En déduire la puissance apparente totale, le courant appelé et le facteur de puissance de l'installation.</div>
  <div class="q"><strong>Q3.</strong> Calculer la somme des puissances apparentes des récepteurs et la comparer au résultat de Q2. Commenter.</div>
  <div class="q"><strong>Q4.</strong> Déterminer la capacité du condensateur qui porte le facteur de puissance à 0,95.</div>
  <div class="q"><strong>Q5.</strong> Calculer le nouveau courant et la réduction relative des pertes Joule dans la ligne d'alimentation.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(Q_k = P_k\tan\varphi_k\). Radiateurs : \(P = 2\,000\ \text{W}\), \(Q = 0\). Compresseur : \(\tan\varphi = \sqrt{1-0{,}49}/0{,}70 \approx 1{,}020\), donc \(Q \approx 4\,081\ \text{var}\). Outils : \(\tan\varphi \approx 0{,}484\), \(Q \approx 242\ \text{var}\).</p>
    <p><strong>Q2.</strong> Boucherot : \(P = 6\,500\ \text{W}\), \(Q \approx 4\,323\ \text{var}\). \(S = \sqrt{P^2+Q^2} \approx 7\,806\ \text{VA}\), \(I = S/U \approx 33{,}9\ \text{A}\), \(\cos\varphi = P/S \approx 0{,}833\) (\(\tan\varphi \approx 0{,}665\)).</p>
    <p><strong>Q3.</strong> \(\sum S_k = 2\,000 + 4\,000/0{,}70 + 500/0{,}90\) \(\approx 2\,000 + 5\,714 + 556\) \(= 8\,270\ \text{VA}\) \(> 7\,806\ \text{VA}\). Les puissances apparentes ne s'additionnent pas : ce sont les normes de vecteurs \((P_k, Q_k)\) non colinéaires.</p>
    <p><strong>Q4.</strong> \(\tan\varphi' = \tan(\arccos0{,}95) \approx 0{,}329\). \(Q_C = 6\,500\times(0{,}665 - 0{,}329)\) \(\approx 2\,187\ \text{var}\), d'où \(C = Q_C/(U^2\omega)\) \(= 2187/(230^2\times314)\) \(\approx 132\ \mu\text{F}\).</p>
    <p><strong>Q5.</strong> \(I' = P/(U\cos\varphi')\) \(= 6500/(230\times0{,}95)\) \(\approx 29{,}7\ \text{A}\). Les pertes en ligne, en \(R_\ell I^2\), sont multipliées par \((29{,}7/33{,}9)^2 \approx 0{,}77\) : environ 23 % de pertes en moins, pour une puissance utile inchangée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Four triphasé à deux allures de chauffe</h3>
  <div class="statement">Un four de traitement thermique comporte trois résistances identiques \(R = 46\ \Omega\). Il est alimenté par le réseau 230/400 V, 50 Hz. Un commutateur permet de coupler les résistances en étoile (petite allure) ou en triangle (grande allure).</div>
  <div class="q"><strong>Q1.</strong> Couplage étoile : calculer le courant dans une résistance, le courant de ligne et la puissance du four.</div>
  <div class="q"><strong>Q2.</strong> Couplage triangle : mêmes questions. Comparer les deux puissances.</div>
  <div class="q"><strong>Q3.</strong> En étoile, une résistance est coupée. Calculer la puissance du four et le courant dans le neutre lorsque le point commun est relié au neutre, puis la puissance lorsqu'il ne l'est pas.</div>
  <div class="q"><strong>Q4.</strong> En triangle, une résistance est coupée. Calculer la puissance du four et les trois courants de ligne.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque résistance est sous \(V = 400/\sqrt3 \approx 231\ \text{V}\) : \(J = I = V/R \approx 5{,}02\ \text{A}\). \(P_Y = 3VI = U^2/R\) \(= 160\,000/46 \approx 3{,}48\ \text{kW}\) (charge résistive, \(\cos\varphi = 1\)).</p>
    <p><strong>Q2.</strong> Chaque résistance est sous \(U = 400\ \text{V}\) : \(J = 400/46 \approx 8{,}70\ \text{A}\), courant de ligne \(I = J\sqrt3 \approx 15{,}1\ \text{A}\). \(P_\Delta = 3U^2/R \approx 10{,}4\ \text{kW} = 3\,P_Y\).</p>
    <p><strong>Q3.</strong> <em>Neutre relié</em> : les deux résistances restantes restent sous 231 V, donc \(P = \frac23 P_Y \approx 2{,}32\ \text{kW}\). Les courants restants \(\underline{i}_2\) et \(\underline{i}_3\) ont même module et sont déphasés de \(2\pi/3\) : leur somme \(\underline{i}_N = \underline{i}_2 + \underline{i}_3\) est l'opposé du courant qu'aurait la résistance coupée, de module \(5{,}02\ \text{A}\). <em>Neutre non relié</em> : les deux résistances restantes sont en série sous la tension composée, \(I = 400/92 \approx 4{,}35\ \text{A}\) et \(P = U^2/(2R) \approx 1{,}74\ \text{kW} = P_Y/2\).</p>
    <p><strong>Q4.</strong> Les deux autres résistances restent sous 400 V : \(P = \frac23 P_\Delta \approx 6{,}96\ \text{kW}\). Si la résistance coupée est entre les phases 1 et 2 : \(i_1 = -j_{31}\) et \(i_2 = j_{23}\) valent 8,70 A, tandis que \(i_3 = j_{31} - j_{23}\) garde la valeur \(\sqrt3\times8{,}70 \approx 15{,}1\ \text{A}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Moteur asynchrone : plaque, wattmètres et compensation</h3>
  <div class="statement">La plaque d'un moteur asynchrone de broyeur à végétaux indique : 400/690 V ; 15 kW ; 50 Hz ; \(\cos\varphi = 0{,}84\) ; rendement 0,91. Il est raccordé au réseau 230/400 V.</div>
  <div class="q"><strong>Q1.</strong> Quel couplage adopter ? Un démarrage étoile-triangle est-il possible ? Quel est son intérêt ?</div>
  <div class="q"><strong>Q2.</strong> À puissance nominale, calculer la puissance absorbée, le courant de ligne et le courant dans un enroulement.</div>
  <div class="q"><strong>Q3.</strong> Calculer les puissances réactive et apparente absorbées.</div>
  <div class="q"><strong>Q4.</strong> <em>(Hors programme, pour aller plus loin : méthode des deux wattmètres, cours §6.)</em> Un essai par la méthode des deux wattmètres donne \(W_1 = 11{,}3\ \text{kW}\) et \(W_2 = 5{,}17\ \text{kW}\). En déduire \(P\), \(Q\) et \(\cos\varphi\), et comparer aux valeurs nominales.</div>
  <div class="q"><strong>Q5.</strong> On veut \(\tan\varphi' = 0{,}4\). Calculer la capacité de chacun des trois condensateurs s'ils sont couplés en triangle, puis en étoile. Quel est le nouveau courant de ligne ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les enroulements sont prévus pour 400 V, la tension composée du réseau : couplage <strong>triangle</strong>. Le moteur fonctionnant en triangle, on peut le démarrer en étoile (enroulements sous 231 V) : courant d'appel et couple de démarrage sont divisés par 3, ce qui soulage le réseau ; à réserver aux démarrages à faible couple résistant.</p>
    <p><strong>Q2.</strong> \(P_a = 15\,000/0{,}91 \approx 16{,}5\ \text{kW}\). \(I = P_a/(\sqrt3\,U\cos\varphi)\) \(= 16\,484/(\sqrt3\times400\times0{,}84)\) \(\approx 28{,}3\ \text{A}\). Dans un enroulement (triangle) : \(J = I/\sqrt3 \approx 16{,}4\ \text{A}\).</p>
    <p><strong>Q3.</strong> \(\tan\varphi \approx 0{,}646\), donc \(Q = P_a\tan\varphi \approx 10{,}6\ \text{kvar}\) et \(S = \sqrt3\,UI \approx 19{,}6\ \text{kVA}\).</p>
    <p><strong>Q4.</strong> (Relations fournies par le cours, non exigibles.) \(P = W_1 + W_2 = 16{,}47\ \text{kW}\) et \(Q = \sqrt3\,(W_1 - W_2)\) \(= \sqrt3\times6{,}13\) \(\approx 10{,}6\ \text{kvar}\). \(\tan\varphi = Q/P \approx 0{,}645\), \(\cos\varphi \approx 0{,}84\) : l'essai confirme le point nominal.</p>
    <p><strong>Q5.</strong> \(Q_C = P_a(\tan\varphi - 0{,}4)\) \(\approx 16\,484\times0{,}246\) \(\approx 4{,}05\ \text{kvar}\). Triangle : \(C_\Delta = Q_C/(3U^2\omega)\) \(= 4054/(3\times400^2\times314)\) \(\approx 26{,}9\ \mu\text{F}\). Étoile : \(C_Y = 3C_\Delta \approx 80{,}6\ \mu\text{F}\). Avec \(\cos\varphi' = 1/\sqrt{1+0{,}4^2} \approx 0{,}928\) : \(I' = 16\,484/(\sqrt3\times400\times0{,}928)\) \(\approx 25{,}6\ \text{A}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Pont PD3 et filtrage d'un bus continu</h3>
  <div class="statement">Un pont PD3 à diodes est alimenté par le réseau 230/400 V, 50 Hz. On note \(v_1 = V\sqrt2\cos\theta\), \(v_2\) et \(v_3\) en retard de \(2\pi/3\) et \(4\pi/3\), avec \(\theta = \omega t\). Les diodes \(D_1, D_2, D_3\) (cathodes communes) et \(D_1', D_2', D_3'\) (anodes communes) sont reliées respectivement aux phases 1, 2, 3. La charge est d'abord une source de courant \(I = 20\ \text{A}\).</div>
  <div class="q"><strong>Q1.</strong> Sur l'intervalle \(0 \lt \theta \lt \pi/3\), quelles diodes conduisent ? Exprimer \(u_s\) et la tension aux bornes de \(D_2\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\langle u_s\rangle\), les valeurs extrêmes de \(u_s\), son ondulation crête à crête et sa fréquence.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les contraintes subies par une diode et proposer des calibres.</div>
  <div class="q"><strong>Q4.</strong> Calculer la puissance transmise, le courant de ligne efficace, la puissance apparente et le facteur de puissance vus du réseau.</div>
  <div class="q"><strong>Q5.</strong> On intercale un filtre \(LC\) (\(L = 5\ \text{mH}\)) entre le pont et l'utilisation. On admet que l'ondulation de \(u_s\) est dominée par sa composante à 300 Hz, d'amplitude \(2\langle u_s\rangle/35\). Choisir \(C\) pour que l'ondulation crête à crête de la tension filtrée reste inférieure à 1 % de sa valeur moyenne.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sur \(]0, \pi/3[\), \(v_1\) est la plus grande tension simple et \(v_3\) la plus petite : \(D_1\) et \(D_3'\) conduisent, et \(u_s = v_1 - v_3 = -u_{31}\). La cathode de \(D_2\) est au potentiel \(v_1\) : \(v_{D_2} = v_2 - v_1 = -u_{12} \lt 0\), elle est bien bloquée.</p>
    <p><strong>Q2.</strong> \(\langle u_s\rangle\) \(= 3U\sqrt2/\pi\) \(= 3\times400\times\sqrt2/\pi\) \(\approx 540\ \text{V}\). \(u_{s,\max} = U\sqrt2 \approx 566\ \text{V}\), \(u_{s,\min} = U\sqrt2\cos(\pi/6) \approx 490\ \text{V}\), soit \(\Delta u_s \approx 76\ \text{V}\) (14 % de la moyenne), à \(6f = 300\ \text{Hz}\).</p>
    <p><strong>Q3.</strong> Chaque diode conduit \(2\pi/3\) par période : \(\langle i_D\rangle = I/3 \approx 6{,}7\ \text{A}\), \(I_D = I/\sqrt3 \approx 11{,}5\ \text{A}\). Tension inverse maximale : la plus grande tension composée, \(U\sqrt2 \approx 566\ \text{V}\). Avec une marge pour les surtensions du réseau, on choisit des diodes de 1 200 V. En courant, un coefficient de 1,5 à 2 sur \(\langle i_D\rangle\) conduit à un calibre d'environ 10 à 15 A moyens, l'échauffement étant vérifié avec le courant efficace de 11,5 A.</p>
    <p><strong>Q4.</strong> \(P = \langle u_s\rangle I \approx 10{,}8\ \text{kW}\) (le courant étant constant, seule la valeur moyenne de \(u_s\) intervient). Le courant de ligne vaut \(\pm I\) pendant deux tiers du temps : \(I_\ell = I\sqrt{2/3} \approx 16{,}3\ \text{A}\). \(S = \sqrt3\,U I_\ell \approx 11{,}3\ \text{kVA}\) et \(f_p = P/S = 3/\pi \approx 0{,}955\). Le fondamental du courant est en phase avec la tension simple : la différence avec 1 vient des harmoniques (rangs 5, 7, 11, 13…).</p>
    <p><strong>Q5.</strong> Amplitude de l'harmonique 300 Hz : \(2\times540/35 \approx 30{,}9\ \text{V}\). Il faut en sortie une amplitude d'au plus \(0{,}5\times5{,}4 = 2{,}7\ \text{V}\), donc une atténuation \(LC\omega_6^2 - 1 \geq 30{,}9/2{,}7 \approx 11{,}4\) avec \(\omega_6 = 2\pi\times300 \approx 1\,885\ \text{rad/s}\) : \(LC \geq 12{,}4/1885^2 \approx 3{,}5\times10^{-6}\ \text{s}^2\), soit \(C \geq 700\ \mu\text{F}\). On retient 1 mF : \(f_0 = 1/(2\pi\sqrt{LC})\) \(\approx 71\ \text{Hz}\) \(\ll 300\ \text{Hz}\), et l'ondulation résiduelle vaut environ \(3{,}7\ \text{V}\) crête à crête.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Onduleur monophasé sur charge R–L : pleine onde puis commande décalée</h3>
  <div class="statement">Un onduleur monophasé en pont (interrupteurs \(K_1, K_1', K_2, K_2'\) formés chacun d'un IGBT et d'une diode antiparallèle) est alimenté par un bus continu \(E = 300\ \text{V}\). Il débite à \(f = 50\ \text{Hz}\) dans une charge \(R = 8\ \Omega\) en série avec \(L = 40\ \text{mH}\).</div>
  <p class="exo-part">Partie A — Commande pleine onde</p>
  <div class="q"><strong>A1.</strong> Tracer \(u(t)\). Donner sa valeur efficace et les valeurs efficaces de ses harmoniques de rangs 1, 3 et 5.</div>
  <div class="q"><strong>A2.</strong> Calculer les courants harmoniques correspondants. Le courant est-il proche d'une sinusoïde ? Estimer la puissance active.</div>
  <div class="q"><strong>A3.</strong> Établir \(i(t)\) sur \([0, T/2]\) en régime permanent (on posera \(\tau = L/R\) et on utilisera \(i(T/2) = -i(0)\)). En déduire le courant maximal et la durée de conduction des diodes après chaque commutation. Que se passe-t-il, énergétiquement, pendant cette durée ?</div>
  <p class="exo-part">Partie B — Commande décalée</p>
  <div class="q"><strong>B1.</strong> Quel décalage \(\delta\) annule l'harmonique 3 ? Calculer alors \(U\), \(U_1\) et \(U_5\).</div>
  <div class="q"><strong>B2.</strong> Quel décalage donne \(U_1 = 200\ \text{V}\) ? Quel indice de modulation faudrait-il en MLI bipolaire ? Pourquoi une MLI à \(f_{\text{déc}} = 10\ \text{kHz}\) donne-t-elle un courant bien plus sinusoïdal ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(u = +E\) sur la première demi-période (\(K_1\), \(K_2'\) commandés), \(-E\) sur la seconde : \(U = E = 300\ \text{V}\). \(U_1 = 2\sqrt2E/\pi \approx 270\ \text{V}\), \(U_3 = U_1/3 \approx 90\ \text{V}\), \(U_5 = U_1/5 \approx 54\ \text{V}\).</p>
    <p><strong>A2.</strong> \(L\omega \approx 12{,}6\ \Omega\). \(|\underline{Z}_1| = \sqrt{8^2+12{,}6^2} \approx 14{,}9\ \Omega\), \(|\underline{Z}_3| \approx 38{,}5\ \Omega\), \(|\underline{Z}_5| \approx 63{,}3\ \Omega\). D'où \(I_1 \approx 18{,}1\ \text{A}\), \(I_3 \approx 2{,}34\ \text{A}\), \(I_5 \approx 0{,}85\ \text{A}\) : l'harmonique 3 ne pèse que 13 % du fondamental en courant (contre 33 % en tension), le courant est assez proche d'une sinusoïde. \(P = R\sum I_n^2\) \(\approx 8\times(18{,}1^2+2{,}34^2+0{,}85^2)\) \(\approx 2{,}68\ \text{kW}\).</p>
    <p><strong>A3.</strong> Sur \([0, T/2]\) : \(L\,\mathrm{d}i/\mathrm{d}t + Ri = E\), donc \(i(t) = \frac{E}{R} + \left(i(0) - \frac{E}{R}\right)e^{-t/\tau}\) avec \(\tau = 5\ \text{ms}\). La condition \(i(T/2) = -i(0)\) donne</p>
    <div class="formula">$$\begin{aligned} i(0) &= -\frac{E}{R}\,\frac{1 - e^{-T/2\tau}}{1 + e^{-T/2\tau}} \\ &= -\frac{E}{R}\tanh\frac{T}{4\tau} \\ &= -37{,}5\tanh(1) \approx -28{,}6\ \text{A} \end{aligned}$$</div>
    <p>Le courant maximal vaut donc \(I_M \approx 28{,}6\ \text{A}\) (atteint à chaque commutation). Il s'annule à \(t_0 = \tau\ln\left(1 - i(0)R/E\right)\) \(= 5\ln(1{,}76)\) \(\approx 2{,}8\ \text{ms}\). Pendant \([0, t_0]\), \(u = +E\) mais \(i \lt 0\) : ce sont les diodes associées à \(K_1\) et \(K_2'\) qui conduisent, \(u\,i \lt 0\) et l'énergie magnétique de la bobine est renvoyée vers la source (courant d'entrée négatif). Ensuite les IGBT \(K_1\) et \(K_2'\) prennent le relais.</p>
    <p><strong>B1.</strong> \(U_3 \propto |\cos(3\delta/2)|\) est nul pour \(\delta = \pi/3\) (créneaux de 120°). Alors \(U = E\sqrt{1 - 1/3} \approx 245\ \text{V}\), \(U_1 = 270\cos(\pi/6) \approx 234\ \text{V}\), \(U_5 = 54\,|\cos(5\pi/6)| \approx 46{,}8\ \text{V}\).</p>
    <p><strong>B2.</strong> \(\cos(\delta/2) = 200/270 \approx 0{,}741\), soit \(\delta \approx 84{,}5°\). En MLI bipolaire, \(U_1 = mE/\sqrt2\) donne \(m = 200\sqrt2/300 \approx 0{,}94\). Les harmoniques de la MLI sont regroupés autour de 10 kHz, où l'impédance de la charge vaut environ \(2\pi\times10^4\times0{,}04 \approx 2{,}5\ \text{k}\Omega\) : les courants harmoniques correspondants sont négligeables, alors qu'en commande décalée les harmoniques 5 et 7, à basse fréquence, sont peu atténués.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Alimentation 12 V d'un robot mobile : hacheur série filtré</h3>
  <div class="statement">Un robot mobile embarque une batterie de tension \(E = 36\ \text{V}\), supposée constante. Un hacheur série (interrupteur commandé et diode de roue libre parfaits), de fréquence de découpage \(f_{\text{déc}} = 50\ \text{kHz}\), alimente sous \(U_s = 12\ \text{V}\) l'électronique de commande, qui absorbe un courant \(I_s = 3\ \text{A}\) supposé constant, à travers un filtre \(LC\) (inductance \(L\) en série, condensateur \(C\) en parallèle sur la charge). On se place en régime permanent et en conduction continue.</div>
  <div class="q"><strong>Q1.</strong> Quel rapport cyclique \(\alpha\) faut-il ?</div>
  <div class="q"><strong>Q2.</strong> Choisir \(L\) pour que l'ondulation crête à crête du courant dans l'inductance ne dépasse pas 20 % de \(I_s\). On retient ensuite la valeur normalisée \(L = 330\ \mu\text{H}\) : calculer \(\Delta i\).</div>
  <div class="q"><strong>Q3.</strong> Choisir \(C\) pour que l'ondulation crête à crête de la tension de sortie reste inférieure à 50 mV. On retient \(C = 47\ \mu\text{F}\) : calculer \(\Delta v_s\).</div>
  <div class="q"><strong>Q4.</strong> Calculer la fréquence propre du filtre et justifier le dimensionnement.</div>
  <div class="q"><strong>Q5.</strong> Calculer la puissance reçue par la charge et le courant moyen fourni par la batterie. Le courant de batterie a une valeur efficace d'environ 1,73 A : pourquoi ne faut-il pas écrire \(P = E\times1{,}73\ \text{A}\) ?</div>
  <div class="q"><strong>Q6.</strong> En dessous de quel courant de charge la conduction devient-elle discontinue ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La tension moyenne aux bornes de la diode vaut \(\alpha E\), et l'inductance n'a pas de tension moyenne en régime permanent : \(U_s = \alpha E\), soit \(\alpha = 12/36 = 1/3\).</p>
    <p><strong>Q2.</strong> \(\Delta i = \dfrac{\alpha(1-\alpha)E}{L f_{\text{déc}}} \leq 0{,}2\times3 = 0{,}6\ \text{A}\) impose</p>
    <div class="formula">$$L \geq \frac{\frac13\times\frac23\times36}{0{,}6\times5\times10^4} \approx 267\ \mu\text{H}$$</div>
    <p>Avec \(L = 330\ \mu\text{H}\) : \(\Delta i = 8/(330\times10^{-6}\times5\times10^4) \approx 0{,}48\ \text{A}\), soit 16 % de \(I_s\).</p>
    <p><strong>Q3.</strong> Le condensateur reçoit la partie alternative triangulaire du courant d'inductance : \(\Delta v_s = \dfrac{\Delta i}{8\,C f_{\text{déc}}} \leq 50\ \text{mV}\), d'où \(C \geq 0{,}485/(8\times5\times10^4\times0{,}05) \approx 24\ \mu\text{F}\). Avec \(C = 47\ \mu\text{F}\) :</p>
    <div class="formula">$$\Delta v_s = \frac{0{,}485}{8\times47\times10^{-6}\times5\times10^4} \approx 26\ \text{mV}$$</div>
    <p>soit 0,2 % de 12 V. Une simulation du montage (charge résistive de 4 Ω) donne la même valeur.</p>
    <p><strong>Q4.</strong></p>
    <div class="formula">$$f_0 = \frac{1}{2\pi\sqrt{LC}} = \frac{1}{2\pi\sqrt{330\times10^{-6}\times47\times10^{-6}}} \approx 1{,}28\ \text{kHz}$$</div>
    <p>C'est environ 40 fois sous \(f_{\text{déc}}\) : le passe-bas du deuxième ordre atténue fortement les composantes à 50 kHz et au-delà, tout en transmettant la valeur moyenne.</p>
    <p><strong>Q5.</strong> \(P = U_s I_s = 36\ \text{W}\). La tension de batterie étant constante, \(P = E\,\langle i_e\rangle\) (convertisseur parfait), d'où \(\langle i_e\rangle = 36/36 = 1\ \text{A} = \alpha I_s\). Le produit \(E\times I_{e,\text{eff}} \approx 62\ \text{W}\) n'est pas une puissance active : la puissance active est la moyenne de \(u\,i\), et quand l'une des grandeurs est constante, c'est la valeur moyenne de l'autre qui intervient. La valeur efficace sert à dimensionner les composants (échauffement, condensateur d'entrée).</p>
    <p><strong>Q6.</strong> Le courant d'inductance varie entre \(I_s - \Delta i/2\) et \(I_s + \Delta i/2\), avec \(\Delta i\) indépendant de la charge. Il s'annule en fin de roue libre si \(I_s \lt \Delta i/2 \approx 0{,}24\ \text{A}\) : en dessous, la conduction est discontinue et la relation \(U_s = \alpha E\) ne tient plus (la tension de sortie monte si l'on garde le même \(\alpha\)).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Variateur de vitesse d'un ventilateur de désenfumage</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>régimes alternatifs et convertisseurs statiques</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un tunnel routier est équipé de ventilateurs de désenfumage réversibles. Chacun est entraîné par un moteur asynchrone triphasé alimenté par un variateur : pont PD3 à diodes, bus continu filtré (inductance de lissage puis condensateur \(C\)), onduleur triphasé MLI à IGBT. Réseau 230/400 V, 50 Hz.<br>
    Plaque du moteur : 400/690 V ; 45 kW ; 1 480 tr/min ; \(\cos\varphi = 0{,}86\) ; rendement 0,94. Moment d'inertie ramené à l'arbre (rotor et hélice) : \(J = 12\ \text{kg·m}^2\). Le couple de l'hélice est proportionnel au carré de la vitesse. Rendement de l'onduleur : 0,97. Le courant redressé est supposé parfaitement lissé.
  </div>

  <p class="exo-part">Partie A — Moteur et réseau</p>
  <div class="q"><strong>A1.</strong> Déterminer le nombre de pôles du moteur et son glissement nominal.</div>
  <div class="q"><strong>A2.</strong> Le variateur délivre au plus 400 V entre phases. Quel couplage du moteur ?</div>
  <div class="q"><strong>A3.</strong> Calculer, au point nominal, la puissance absorbée par le moteur, son courant de ligne et sa puissance réactive.</div>
  <div class="q"><strong>A4.</strong> Calculer le courant de ligne appelé au réseau par le variateur au point nominal, et le facteur de puissance vu du réseau. Comparer à une alimentation directe du moteur et expliquer la différence.</div>

  <p class="exo-part">Partie B — Redresseur et bus continu</p>
  <div class="q"><strong>B1.</strong> Calculer la tension moyenne du bus continu \(E\) et le courant moyen \(I_c\) qu'il débite au point nominal.</div>
  <div class="q"><strong>B2.</strong> Donner les contraintes en tension et en courant d'une diode du pont.</div>
  <div class="q"><strong>B3.</strong> Le variateur doit franchir une coupure du réseau de 20 ms lorsque le ventilateur fonctionne en régime réduit (10 kW prélevés sur le bus), sans que la tension du bus descende sous 430 V. Dimensionner \(C\).</div>

  <p class="exo-part">Partie C — Onduleur et loi de commande</p>
  <div class="q"><strong>C1.</strong> En commande pleine onde, calculer la valeur efficace du fondamental des tensions composées et celles des harmoniques 5 et 7. Pourquoi n'y a-t-il pas d'harmonique 3 ? Pourquoi cette commande ne convient-elle pas à la variation de vitesse ?</div>
  <div class="q"><strong>C2.</strong> En MLI sinus-triangle, le fondamental des tensions composées vaut \(0{,}61\,mE\) avec \(m \leq 1\). Le moteur peut-il recevoir sa tension nominale ? Proposer une solution.</div>
  <div class="q"><strong>C3.</strong> En exploitation normale, le ventilateur tourne à 60 % de sa vitesse nominale. En négligeant le glissement, donner la fréquence, la tension (loi \(U/f\) constant), l'indice de modulation et la puissance mécanique demandée. Conclure sur l'intérêt du variateur.</div>
  <div class="q"><strong>C4.</strong> Proposer des calibres en tension et en courant pour les IGBT (on prendra 10 % d'ondulation de courant due à la MLI).</div>

  <p class="exo-part">Partie D — Inversion du sens de soufflage et freinage</p>
  <div class="q"><strong>D1.</strong> Comment le variateur inverse-t-il le sens de rotation ?</div>
  <div class="q"><strong>D2.</strong> Avant d'inverser, il faut arrêter l'hélice. Calculer l'énergie cinétique à la vitesse nominale. On néglige le couple de l'hélice (cas le plus défavorable). Le condensateur (\(C = 3{,}9\ \text{mF}\)) peut-il absorber cette énergie si la tension du bus ne doit pas dépasser 800 V ?</div>
  <div class="q"><strong>D3.</strong> On équipe le bus d'un hacheur de freinage qui connecte une résistance \(R_f\) dès que la tension atteint 750 V. Le ralentissement se fait à couple constant en 20 s. Calculer la puissance maximale à dissiper et la valeur maximale de \(R_f\). Citer une alternative et justifier le choix retenu.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> La vitesse nominale est juste sous \(n_s = 60f/p\) : \(n_s = 1\,500\ \text{tr/min}\), donc \(p = 2\) paires de pôles (4 pôles). Glissement \(g = (1500 - 1480)/1500 \approx 1{,}3\ \%\).</p>
    <p><strong>A2.</strong> Les enroulements supportent 400 V (petite valeur de la plaque), égale à la tension composée délivrée : couplage <strong>triangle</strong>.</p>
    <p><strong>A3.</strong> \(P_a = 45/0{,}94 \approx 47{,}9\ \text{kW}\) ; \(I = P_a/(\sqrt3\,U\cos\varphi) \approx 80{,}3\ \text{A}\) ; \(\tan\varphi \approx 0{,}593\), donc \(Q \approx 28{,}4\ \text{kvar}\).</p>
    <p><strong>A4.</strong> Puissance prélevée sur le bus : \(47{,}9/0{,}97 \approx 49{,}4\ \text{kW}\) (pertes du pont négligées). Le PD3 délivre \(E \approx 540\ \text{V}\) (voir B1), donc un courant redressé \(I_c = 49\,350/540 \approx 91{,}4\ \text{A}\), et absorbe au réseau des créneaux de valeur efficace \(I_\ell = I_c\sqrt{2/3} \approx 74{,}6\ \text{A}\), et \(f_p = 3/\pi \approx 0{,}955\). En alimentation directe, le réseau fournirait 80,3 A avec \(f_p = 0{,}86\). Avec le variateur, la puissance réactive magnétisante du moteur est fournie par l'onduleur lui-même : en triphasé équilibré, la puissance instantanée \(v_1i_1 + v_2i_2 + v_3i_3\) est constante (§6), si bien que le réactif circule d'une phase à l'autre au gré des commutations et que la puissance prélevée sur le bus reste égale à \(P\) (le condensateur n'absorbe que l'ondulation due au découpage). Le réseau ne fournit donc quasiment que de l'actif (fondamental en phase), le facteur de puissance n'étant dégradé que par les harmoniques.</p>
    <p><strong>B1.</strong> \(E = 3U\sqrt2/\pi \approx 540\ \text{V}\) et \(I_c = 49\,350/540 \approx 91{,}4\ \text{A}\).</p>
    <p><strong>B2.</strong> Tension inverse maximale \(U\sqrt2 \approx 566\ \text{V}\) → calibre 1 200 à 1 600 V. Courants : \(\langle i_D\rangle = I_c/3 \approx 30{,}5\ \text{A}\), \(I_D = I_c/\sqrt3 \approx 52{,}8\ \text{A}\) efficaces.</p>
    <p><strong>B3.</strong> L'énergie fournie par le condensateur couvre la consommation pendant la coupure :</p>
    <div class="formula">$$\tfrac12 C\left(E^2 - u_{\min}^2\right) = P\,\Delta t$$$$\Longrightarrow\ C = \frac{2\times10^4\times0{,}02}{540^2 - 430^2} \approx 3{,}7\ \text{mF}$$</div>
    <p>On retient la valeur normalisée immédiatement supérieure, 3,9 mF.</p>
    <p><strong>C1.</strong> \(U_1 = \sqrt6\,E/\pi \approx 421\ \text{V}\), \(U_5 = U_1/5 \approx 84\ \text{V}\), \(U_7 = U_1/7 \approx 60\ \text{V}\). Chaque tension composée est un créneau de largeur \(2\pi/3\) : le facteur \(\cos(n\pi/6)\) annule les rangs multiples de 3. L'amplitude du fondamental est figée par \(E\) : impossible de respecter \(U/f\) constant quand on baisse la fréquence (le moteur saturerait).</p>
    <p><strong>C2.</strong> \(0{,}61\times540 \approx 331\ \text{V} \lt 400\ \text{V}\) : en MLI linéaire, le moteur serait sous-alimenté à 50 Hz (flux réduit, couple disponible plus faible). Solutions (techniques hors programme, citées pour la culture) : injection d'un harmonique 3 commun aux trois modulantes (ou modulation vectorielle), qui porte le maximum à \(E/\sqrt2 \approx 382\ \text{V}\), complétée par une légère surmodulation près de la vitesse nominale.</p>
    <p><strong>C3.</strong> \(f \approx 0{,}6\times50 = 30\ \text{Hz}\), \(U_1 = 400\times30/50 = 240\ \text{V}\), \(m = 240/331 \approx 0{,}73\). Le couple variant comme \(n^2\), la puissance varie comme \(n^3\) : \(P \approx 0{,}6^3\times45 \approx 9{,}7\ \text{kW}\), soit près de cinq fois moins qu'à pleine vitesse pour 60 % du débit d'air. Régler le débit par la vitesse plutôt que par un volet (qui dissipe l'énergie en pertes de charge) est très avantageux.</p>
    <p><strong>C4.</strong> Un IGBT bloqué supporte \(E \approx 540\ \text{V}\), plus les surtensions de commutation : calibre <strong>1 200 V</strong>. Courant crête : \(80{,}3\sqrt2\times1{,}1 \approx 125\ \text{A}\) → modules de 150 A à 200 A selon le refroidissement (les diodes antiparallèles ont le même calibre).</p>
    <p><strong>D1.</strong> En inversant l'ordre de succession des phases produites : on permute les commandes de deux bras (séquence 1-3-2 au lieu de 1-2-3). Aucun contacteur n'est nécessaire.</p>
    <p><strong>D2.</strong> \(\Omega_N = 1480\times2\pi/60 \approx 155\ \text{rad/s}\), \(E_c = \frac12 J\Omega_N^2 \approx 144\ \text{kJ}\). Le condensateur ne peut stocker que \(\frac12 C(800^2 - 540^2) \approx 680\ \text{J}\) : deux cents fois trop peu. Le PD3 n'étant pas réversible, il faut dissiper ou renvoyer cette énergie autrement.</p>
    <p><strong>D3.</strong> À couple de freinage constant, \(\Omega\) décroît linéairement et la puissance renvoyée \(C_f\Omega\) est maximale au début : \(P_{\max} = J\Omega_N^2/t_f\) \(= 2E_c/t_f \approx 14{,}4\ \text{kW}\). Il faut \(R_f \leq 750^2/14\,400 \approx 39\ \Omega\). Alternative : un redresseur MLI réversible (onduleur triphasé côté réseau) qui renverrait l'énergie au réseau avec un courant quasi sinusoïdal. Pour des freinages rares et une énergie modeste, le hacheur et sa résistance sont nettement moins chers et plus simples : c'est la solution retenue. En pratique, le couple aérodynamique de l'hélice aide aussi au ralentissement.</p>
