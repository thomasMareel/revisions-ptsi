</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Résistance par la loi d'Ohm : bilan et choix du montage</h3>
  <div class="statement">Pour mesurer une résistance marquée « 470 Ω, 5 % », on mesure la tension à ses bornes et l'intensité qui la traverse. Voltmètre : \(U=6{,}215\ \text{V}\) (dernier chiffre : 1 mV), précision \(\pm(0{,}5\ \%+2\) digits), résistance d'entrée \(10\ \text{M}\Omega\). Ampèremètre : \(I=13{,}22\ \text{mA}\) (dernier chiffre : 0,01 mA), précision \(\pm(1{,}2\ \%+3\) digits), résistance interne de l'ordre de 10 Ω sur ce calibre.</div>
  <div class="q"><strong>Q1.</strong> Évaluer \(u(U)\) et \(u(I)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(R\) et \(u(R)\). Quelle contribution domine ?</div>
  <div class="q"><strong>Q3.</strong> Un ohmmètre affiche \(468{,}2\ \Omega\) (dernier chiffre : 0,1 Ω, précision \(\pm(0{,}8\ \%+2\) digits)). Les deux mesures sont-elles compatibles ? Sont-elles compatibles avec l'indication du fabricant ?</div>
  <div class="q"><strong>Q4.</strong> Le voltmètre peut être branché directement aux bornes de \(R\) (l'ampèremètre mesure alors aussi le courant qui traverse le voltmètre), ou aux bornes de l'ensemble formé par \(R\) et l'ampèremètre. Estimer l'erreur systématique de chaque montage et dire lequel choisir.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(a_U=0{,}005\times6{,}215+0{,}002=0{,}0331\ \text{V}\), \(u(U)=0{,}019\ \text{V}\) (0,31 %). \(a_I=0{,}012\times13{,}22+0{,}03=0{,}189\ \text{mA}\), \(u(I)=0{,}109\ \text{mA}\) (0,82 %).</p>
    <p><strong>Q2.</strong> \(R=U/I=470{,}1\ \Omega\). Quotient : \(u(R)/R=\sqrt{0{,}31^2+0{,}82^2}\ \%=0{,}88\ \%\), \(u(R)=4{,}1\ \Omega\). L'ampèremètre domine nettement ; changer de voltmètre ne servirait à rien.</p>
    <p><strong>Q3.</strong> Ohmmètre : \(a=0{,}008\times468{,}2+0{,}2=3{,}95\ \Omega\), \(u=2{,}3\ \Omega\). Puis</p><div class="formula">$$E_N=\frac{|470{,}1-468{,}2|}{\sqrt{4{,}1^2+2{,}3^2}}=\frac{1{,}9}{4{,}7}=0{,}4\ :$$</div><p>les deux mesures sont compatibles. Fabricant : la tolérance de 5 % donne \(u=0{,}05\times470/\sqrt3=13{,}6\ \Omega\) ; l'écart à 470 Ω est minuscule devant elle (\(E_N\approx0{,}01\)). Les mesures sont bien plus précises que l'indication du fabricant.</p>
    <p><strong>Q4.</strong> Voltmètre aux bornes de \(R\) : il dérive \(U/R_V=6{,}2\ \text{V}/10\ \text{M}\Omega=0{,}62\ \mu\text{A}\), soit \(5\times10^{-5}\) du courant mesuré : erreur systématique négligeable. Voltmètre aux bornes de \(R\) et de l'ampèremètre : il mesure en plus \(R_AI\approx10\times0{,}0132=0{,}13\ \text{V}\), et l'on trouve \(R+R_A\) au lieu de \(R\), une erreur de 2,1 %, plus de deux fois \(u(R)\) : le montage fausserait le résultat. Pour une résistance de quelques centaines d'ohms, on branche le voltmètre directement aux bornes de \(R\). C'est un exemple d'incertitude liée à la méthode.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Titrage acido-basique : bilan d'incertitude</h3>
  <div class="statement">On titre \(V_A=20{,}00\ \text{mL}\) d'une solution d'acide chlorhydrique (pipette jaugée de classe A, \(\pm0{,}03\ \text{mL}\)) par une solution de soude de concentration \(C_B=0{,}1000\ \text{mol·L}^{-1}\), d'incertitude-type \(u(C_B)=0{,}0005\ \text{mol·L}^{-1}\) (indiquée par le préparateur). La burette de 25 mL, de classe A (\(\pm0{,}03\ \text{mL}\)), est graduée tous les 0,05 mL ; un indicateur coloré vire après \(V_E=12{,}35\ \text{mL}\), et l'équivalence est repérée à une goutte près (une goutte : 0,05 mL). À l'équivalence, \(C_AV_A=C_BV_E\).</div>
  <div class="q"><strong>Q1.</strong> Le volume \(V_E\) résulte de deux lectures (zéro et volume final). Évaluer les trois contributions à \(u(V_E)\) (lectures, tolérance, goutte) et \(u(V_E)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(C_A\) et \(u(C_A)\). Présenter le bilan d'incertitude et dire quelle grandeur il faudrait connaître mieux.</div>
  <div class="q"><strong>Q3.</strong> Le préparateur annonce \(C_A=0{,}0620\ \text{mol·L}^{-1}\) avec une incertitude-type de \(0{,}0003\ \text{mol·L}^{-1}\). Conclure.</div>
  <div class="q"><strong>Q4.</strong> Deux autres titrages donnent 12,30 et 12,40 mL. Évaluer l'incertitude-type de type A sur la moyenne des trois volumes, la comparer à l'évaluation de type B de Q1 et expliquer pourquoi la tolérance de la burette doit encore être ajoutée.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque lecture au trait le plus proche : demi-largeur 0,025 mL, \(u=0{,}025/\sqrt3=0{,}0144\ \text{mL}\), deux fois. Tolérance : \(0{,}03/\sqrt3=0{,}0173\ \text{mL}\). Goutte : l'équivalence est entre deux volumes distants d'une goutte, demi-largeur 0,025 mL, \(u=0{,}0144\ \text{mL}\). Total :</p><div class="formula">$$u(V_E)=\sqrt{2\times0{,}0144^2+0{,}0173^2+0{,}0144^2}=0{,}030\ \text{mL},$$</div><p>soit 0,25 %.</p>
    <p><strong>Q2.</strong> La concentration vaut</p><div class="formula">$$C_A=\frac{C_BV_E}{V_A}=\frac{0{,}1000\times12{,}35}{20{,}00}=0{,}06175\ \text{mol·L}^{-1}.$$</div><p>Produit et quotient : contributions relatives \(C_B\) : 0,50 % ; \(V_E\) : 0,25 % ; \(V_A\) : \(0{,}0173/20{,}00=0{,}09\ \%\). Total \(\sqrt{0{,}50^2+0{,}25^2+0{,}09^2}\ \%=0{,}56\ \%\), \(u(C_A)=0{,}00035\ \text{mol·L}^{-1}\). Résultat : \(C_A=0{,}06175\ \text{mol·L}^{-1}\), \(u(C_A)=0{,}00035\ \text{mol·L}^{-1}\). La concentration de la soude domine : il faudrait l'étalonner (par exemple par un titrage d'une masse pesée d'un acide solide) ; sans elle, l'incertitude tomberait à 0,26 %.</p>
    <p><strong>Q3.</strong></p><div class="formula">$$E_N=\frac{|0{,}06175-0{,}0620|}{\sqrt{0{,}00035^2+0{,}0003^2}}=\frac{0{,}00025}{0{,}00046}=0{,}5\ :$$</div><p>les deux valeurs sont compatibles.</p>
    <p><strong>Q4.</strong> Moyenne 12,35 mL, \(s=0{,}05\ \text{mL}\), \(u_A=0{,}05/\sqrt3=0{,}029\ \text{mL}\) : du même ordre que les lectures et la goutte réunies (0,025 mL), ce qui confirme l'évaluation de type B de ces sources variables. Mais la tolérance de la burette est une erreur systématique : la même burette, avec le même défaut de graduation, sert aux trois titrages, et la moyenne ne la réduit pas. On l'ajoute donc :</p><div class="formula">$$u(\overline{V_E})=\sqrt{0{,}029^2+0{,}0173^2}=0{,}034\ \text{mL}.$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Célérité des ultrasons : la bonne référence</h3>
  <div class="statement">Un émetteur d'ultrasons est alimenté à \(f=40{,}00\ \text{kHz}\) (incertitude négligeable). On déplace un récepteur sur une règle graduée et l'on repère, à l'oscilloscope, deux positions où les signaux émis et reçus sont en phase, séparées de dix longueurs d'onde : \(x_1=102{,}0\ \text{mm}\) et \(x_2=188{,}4\ \text{mm}\), chacune repérée à \(\pm0{,}5\ \text{mm}\) près. La salle est à \(\theta=22\ \text{°C}\), lue à 1 °C près (incertitude-type 1 °C). Dans l'air, avec \(\theta\) en °C :<div class="formula">$$c(\theta)=331{,}3\sqrt{1+\frac{\theta}{273{,}15}}\ \text{m·s}^{-1}.$$</div></div>
  <div class="q"><strong>Q1.</strong> Calculer \(\lambda\) et \(u(\lambda)\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(c\) et \(u(c)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(c(22\ \text{°C})\) et l'incertitude-type que lui transmet celle de \(\theta\). Les deux valeurs sont-elles compatibles ?</div>
  <div class="q"><strong>Q4.</strong> Un élève compare sa valeur à « 340 m/s ». Que trouve-t-il, et quelle est son erreur ?</div>
  <div class="q"><strong>Q5.</strong> Comment diviser \(u(c)\) par deux sans changer de matériel ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u(x)=0{,}5/\sqrt3=0{,}29\ \text{mm}\) pour chaque position. \(d=x_2-x_1=86{,}4\ \text{mm}\), \(u(d)=\sqrt2\times0{,}29=0{,}41\ \text{mm}\). \(\lambda=d/10=8{,}64\ \text{mm}\) et \(u(\lambda)=0{,}041\ \text{mm}\) (0,47 %) : le facteur 10 est exact, il divise valeur et incertitude.</p>
    <p><strong>Q2.</strong> \(c=\lambda f\), soit</p><div class="formula">$$c=8{,}64\times10^{-3}\times40{,}00\times10^{3}=345{,}6\ \text{m·s}^{-1},$$</div><p>et \(u(c)/c=u(\lambda)/\lambda\), d'où \(u(c)=1{,}6\ \text{m·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(c(22\ \text{°C})=344{,}4\ \text{m·s}^{-1}\). Une variation de 1 °C change \(c\) de</p><div class="formula">$$\frac{\mathrm dc}{\mathrm d\theta}=\frac{331{,}3}{2\times273{,}15\sqrt{1+\theta/273{,}15}}=0{,}58\ \text{m·s}^{-1}\ \text{par degré},$$</div><p>d'où \(u(c_{\text{ref}})=0{,}58\ \text{m·s}^{-1}\). Puis</p><div class="formula">$$E_N=\frac{|345{,}6-344{,}4|}{\sqrt{1{,}6^2+0{,}58^2}}=\frac{1{,}2}{1{,}7}=0{,}7\leqslant2\ :$$</div><p>les deux valeurs sont compatibles.</p>
    <p><strong>Q4.</strong> \(E_N=|345{,}6-340|/1{,}6=3{,}4\) : il conclut à tort à une incompatibilité. 340 m/s est la célérité vers 15 °C ; la référence doit correspondre aux conditions de l'expérience (« référence inadaptée »).</p>
    <p><strong>Q5.</strong> Repérer deux positions séparées de vingt longueurs d'onde (172,8 mm) : l'incertitude sur la distance ne change pas, et \(u(\lambda)=0{,}41/20=0{,}020\ \text{mm}\), d'où \(u(c)=0{,}8\ \text{m·s}^{-1}\). Il faut alors connaître la température à mieux qu'un degré pour que la comparaison reste utile.</p>

</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Méthode de Bessel et simulation de Monte-Carlo</h3>
  <div class="statement">Un objet et un écran sont fixés sur un banc d'optique en \(x_A=0{,}0\ \text{cm}\) et \(x_E=100{,}0\ \text{cm}\), chacun à \(\pm1\ \text{mm}\) près. Entre les deux, deux positions de la lentille donnent une image nette : \(x_{O1}=27{,}6\ \text{cm}\) et \(x_{O2}=72{,}4\ \text{cm}\), chacune à \(\pm0{,}8\ \text{cm}\) près (latitude de mise au point). Avec \(D=x_E-x_A\) et \(d=x_{O2}-x_{O1}\), la distance focale vaut \(f'=\dfrac{D^2-d^2}{4D}\) (méthode de Bessel).
    <br>On dispose de <code>np.random.uniform(a, b, N)</code>, qui renvoie un tableau de \(N\) tirages uniformes sur \([a\,;b]\), de <code>np.mean(x)</code> et de <code>np.std(x, ddof=1)</code> ; les opérations sur des tableaux numpy se font case par case.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(f'\).</div>
  <div class="q"><strong>Q2.</strong> Pourquoi les règles du produit et du quotient ne s'appliquent-elles pas directement à cette formule ?</div>
  <div class="q"><strong>Q3.</strong> Écrire un programme qui simule \(10^5\) mesures et affiche la moyenne et l'écart-type des valeurs de \(f'\). On obtient \(u(f')\approx0{,}15\ \text{cm}\) : écrire le résultat.</div>
  <div class="q"><strong>Q4.</strong> En relançant le programme avec \(x_A\) et \(x_E\) exacts, on obtient 0,146 cm ; avec \(x_{O1}\) et \(x_{O2}\) exacts, 0,025 cm. Conclure.</div>
  <div class="q"><strong>Q5.</strong> La même lentille, étudiée par la relation de conjugaison, a donné \(f'=20{,}00\ \text{cm}\), \(u=0{,}10\ \text{cm}\). Les résultats sont-ils compatibles ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(D=100{,}0\ \text{cm}\), \(d=44{,}8\ \text{cm}\), \(f'=(10\,000-2\,007{,}0)/400=19{,}98\ \text{cm}\).</p>
    <p><strong>Q2.</strong> \(D\) apparaît au numérateur et au dénominateur, et le numérateur est une différence de carrés : \(f'\) n'est ni un produit ni un quotient de grandeurs indépendantes. On pourrait dériver (hors programme) ; la simulation est plus simple et plus sûre.</p>
    <p><strong>Q3.</strong> Chaque position est tirée selon une loi uniforme de demi-largeur donnée, une seule fois par jeu :</p>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

N = 100000
<span class="cmt"># positions sur le banc (cm), uniformes sur [x - a, x + a]</span>
xA = np.random.uniform(0.0 - 0.1, 0.0 + 0.1, N)       <span class="cmt"># objet</span>
xE = np.random.uniform(100.0 - 0.1, 100.0 + 0.1, N)   <span class="cmt"># écran</span>
<span class="cmt"># les deux positions de la lentille donnant une image nette</span>
xO1 = np.random.uniform(27.6 - 0.8, 27.6 + 0.8, N)
xO2 = np.random.uniform(72.4 - 0.8, 72.4 + 0.8, N)

D = xE - xA
d = xO2 - xO1
f = (D**2 - d**2) / (4 * D)      <span class="cmt"># formule de Bessel</span>

print(np.mean(f), np.std(f, ddof=1))   <span class="cmt"># environ 19.98  0.15</span></pre>
    <p>Résultat : \(f'=19{,}98\ \text{cm}\), \(u(f')=0{,}15\ \text{cm}\) (0,7 %).</p>
    <p><strong>Q4.</strong> L'incertitude vient presque entièrement des positions de la lentille (0,146 cm contre 0,025 cm ; \(\sqrt{0{,}146^2+0{,}025^2}=0{,}148\)). Mesurer plus soigneusement \(D\) ne sert à rien ; il faut réduire la latitude de mise au point (objet plus lumineux et bien contrasté, écran dépoli, faire la mise au point plusieurs fois en venant des deux côtés et moyenner).</p>
    <p><strong>Q5.</strong> L'écart normalisé vaut \(0{,}02/\sqrt{0{,}15^2+0{,}10^2}=0{,}1\) : très compatibles.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Une valeur de g trop faible : chercher la cause</h3>
  <div class="statement">Un groupe mesure \(g\) avec un pendule simple : longueur \(L=0{,}5000\ \text{m}\) (\(u(L)=0{,}0010\ \text{m}\)), mesurée du point d'attache au centre de la boule de rayon \(r=1{,}5\ \text{cm}\) ; période mesurée à la fourche optique sur vingt oscillations, \(T=1{,}4246\ \text{s}\) (\(u(T)=0{,}0015\ \text{s}\)). Le pendule a été lâché avec une amplitude de 15°. On utilise \(T=2\pi\sqrt{L/g}\) et la valeur locale \(g_{\text{ref}}=9{,}81\ \text{m·s}^{-2}\), d'incertitude négligeable.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(g\) et \(u(g)\) (l'incertitude relative de \(T^2\) est le double de celle de \(T\)).</div>
  <div class="q"><strong>Q2.</strong> Comparer à \(g_{\text{ref}}\).</div>
  <div class="q"><strong>Q3.</strong> Trois causes sont proposées. Estimer l'effet de chacune sur \(g\) et dire si elle peut expliquer l'écart : (a) la longueur aurait été mesurée jusqu'au haut de la boule ; (b) la boule n'est pas ponctuelle : pour un pendule pesant, \(T=2\pi\sqrt{\dfrac{L^2+\frac25r^2}{gL}}\) ; (c) l'amplitude n'est pas petite : pour une amplitude \(\theta_0\) (en radians), \(T\approx T_0\left(1+\theta_0^2/16\right)\) (formule de Borda, admise), où \(T_0\) est la période des petites oscillations.</div>
  <div class="q"><strong>Q4.</strong> Corriger le résultat et conclure. Quel conseil donner pour la suite ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong></p><div class="formula">$$g=\frac{4\pi^2L}{T^2}=\frac{4\pi^2\times0{,}5000}{1{,}4246^2}=9{,}726\ \text{m·s}^{-2}.$$</div><p>Contributions : \(u(L)/L=0{,}20\ \%\), \(2u(T)/T=0{,}21\ \%\) ; \(u(g)/g=0{,}29\ \%\), \(u(g)=0{,}028\ \text{m·s}^{-2}\).</p>
    <p><strong>Q2.</strong> \(E_N=|9{,}726-9{,}81|/0{,}028=3{,}0\gt2\) : incompatible. Une cause est à chercher.</p>
    <p><strong>Q3.</strong> (a) Si \(L\) était mesurée jusqu'au haut de la boule, la vraie longueur serait \(0{,}515\ \text{m}\) et \(g\) serait sous-estimé de 3 % : on trouverait \(9{,}81\times0{,}500/0{,}515=9{,}52\ \text{m·s}^{-2}\), pas 9,73. Ce n'est pas la cause (et l'énoncé dit que \(L\) va au centre). (b) Le terme \(\frac25r^2\) allonge la période d'un facteur \(1+\frac15(r/L)^2\), et change \(g\) d'environ \(\frac25(r/L)^2=0{,}04\ \%\) : bon sens, mais plus de vingt fois trop faible pour expliquer 0,86 %. (c) \(\theta_0=15°=0{,}262\ \text{rad}\), \(\theta_0^2/16=0{,}43\ \%\) : la période mesurée est 0,43 % plus longue que \(T_0\), donc \(g\) calculé avec la formule des petites oscillations est trop faible de \((1{,}0043)^2-1=0{,}86\ \%\). C'est exactement l'écart observé (\(9{,}81/9{,}726=1{,}0086\)).</p>
    <p><strong>Q4.</strong> \(g_{\text{corr}}=9{,}726\times1{,}0086=9{,}810\ \text{m·s}^{-2}\), \(E_N\approx0\) : compatible. L'incompatibilité venait du modèle (oscillations supposées de faible amplitude), pas de la mesure, qui était soignée. Conseil : lâcher le pendule à moins de 5° (l'effet tombe à 0,1 %, en dessous de l'incertitude) ou corriger systématiquement ; et vérifier l'effet de l'amplitude en mesurant \(T\) pour deux amplitudes.</p>
  </div>
</div>

  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Choisir son protocole</h3>
  <div class="statement">On veut l'épaisseur \(e\) d'une feuille de papier, puis la période d'un pendule.</div>
  <div class="q"><strong>Q1.</strong> Avec un palmer au centième de millimètre, cinq mesures en divers points d'une feuille donnent 0,10 ; 0,11 ; 0,10 ; 0,09 ; 0,11 mm. Écrire le résultat.</div>
  <div class="q"><strong>Q2.</strong> Une rame de 500 feuilles mesure 51,0 mm à la règle graduée au millimètre (deux lectures) ; selon qu'on la serre plus ou moins, son épaisseur varie de \(\pm1\ \text{mm}\). En déduire \(e\) et \(u(e)\). Quel protocole est le meilleur, et pourquoi ?</div>
  <div class="q"><strong>Q3.</strong> Un pendule a une période voisine de 1,6 s ; un chronométrage à la main a une incertitude-type de 0,1 s. Comparer, pour le même nombre de déclenchements, deux stratégies : chronométrer vingt fois une période, ou une fois vingt périodes.</div>
  <div class="q"><strong>Q4.</strong> Combien de périodes faudrait-il chronométrer d'un coup pour connaître \(T\) à 0,05 % près ? Quel instrument choisir plutôt ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Moyenne 0,102 mm, \(s=0{,}0084\ \text{mm}\), \(u=s/\sqrt5=0{,}0037\ \text{mm}\) : \(e=0{,}102\ \text{mm}\), \(u(e)=0{,}004\ \text{mm}\) (3,7 %). La dispersion (épaisseur variable, écrasement par le palmer) est bien plus grande que la résolution de l'instrument.</p>
    <p><strong>Q2.</strong> Lectures : \(\sqrt2\times0{,}5/\sqrt3=0{,}41\ \text{mm}\) ; serrage : \(1/\sqrt3=0{,}58\ \text{mm}\) ; total \(\sqrt{0{,}41^2+0{,}58^2}=0{,}71\ \text{mm}\) sur l'épaisseur de la rame. \(e=51{,}0/500=0{,}1020\ \text{mm}\), \(u(e)=0{,}71/500=0{,}0014\ \text{mm}\) (1,4 %). La règle est cent fois moins fine que le palmer, mais l'incertitude est divisée par 500 : le protocole de la rame est presque trois fois meilleur. Il donne l'épaisseur moyenne, ce qui est d'ailleurs le mesurande pertinent.</p>
    <p><strong>Q3.</strong> Vingt fois une période : \(u(T)=0{,}1/\sqrt{20}=0{,}022\ \text{s}\) (1,4 %). Une fois vingt périodes : \(u(T)=0{,}1/20=0{,}005\ \text{s}\) (0,3 %). La seconde est 4,5 fois meilleure (\(\sqrt{20}\)) : l'incertitude de déclenchement ne dépend pas de la durée, autant la partager entre le plus de périodes possible.</p>
    <p><strong>Q4.</strong> Il faut \(0{,}1/n\leqslant0{,}0005\times1{,}6\), soit \(n\geqslant125\) périodes, plus de trois minutes : l'amplitude diminue beaucoup, et le risque de mal compter les périodes devient la vraie source d'erreur. Mieux vaut une fourche optique reliée à un chronomètre électronique ou à une carte d'acquisition, qui donne la période à la milliseconde près sur une seule oscillation.</p>

  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Caractéristique d'une pile : régression et Monte-Carlo</h3>
  <div class="statement">On relève la tension \(U\) aux bornes d'une pile en fonction de l'intensité \(I\) qu'elle débite dans une résistance variable. Ampèremètre : précision \(\pm(1\ \%+3\) digits), dernier chiffre 1 mA. Voltmètre : précision \(\pm(0{,}3\ \%+2\) digits), dernier chiffre 1 mV. On modélise la pile par un générateur de tension \(E\) en série avec une résistance \(r\).
    <div style="overflow-x:auto"><table style="border-collapse:collapse;margin:.5rem 0">
      <tr><th>\(I\) (mA)</th><td>51</td><td>102</td><td>151</td><td>196</td><td>253</td><td>302</td><td>348</td><td>402</td></tr>
      <tr><th>\(U\) (V)</th><td>4,433</td><td>4,343</td><td>4,250</td><td>4,165</td><td>4,064</td><td>3,979</td><td>3,886</td><td>3,805</td></tr>
    </table></div>
    Programme utilisé (<code>np.random.normal(m, s)</code> renvoie, pour des tableaux <code>m</code> et <code>s</code>, un tableau de tirages normaux de moyennes <code>m</code> et d'écarts-types <code>s</code>) :
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

I = np.array([51, 102, 151, 196,
              253, 302, 348, 402]) * 1e-3          <span class="cmt"># A</span>
U = np.array([4.433, 4.343, 4.250, 4.165,
              4.064, 3.979, 3.886, 3.805])         <span class="cmt"># V</span>
<span class="cmt"># notices : ±(1 % + 3 digits) et ±(0,3 % + 2 digits)</span>
uI = (0.01 * I + 0.003) / np.sqrt(3)
uU = (0.003 * U + 0.002) / np.sqrt(3)

pente, ordo = np.polyfit(I, U, 1)   <span class="cmt"># U = pente I + ordo</span>
E, r = ordo, -pente
uz = np.sqrt(uU**2 + (pente * uI)**2)
z = (U - (pente * I + ordo)) / uz
print(E, r, np.round(z, 2))

Nsim = 10000
Es, rs = np.zeros(Nsim), np.zeros(Nsim)
<span class="kw">for</span> k <span class="kw">in</span> range(Nsim):
    Isim = np.random.normal(I, uI)
    Usim = np.random.normal(U, uU)
    p, o = np.polyfit(Isim, Usim, 1)
    Es[k], rs[k] = o, -p
<span class="cmt"># incertitudes-types u(E) et u(r)</span>
print(np.std(Es, ddof=1), np.std(rs, ddof=1))</pre>
    Il affiche \(E=4{,}5238\), \(r=1{,}8091\), les écarts normalisés 0,15 ; 0,39 ; −0,06 ; −0,43 ; −0,21 ; 0,15 ; −0,79 ; 0,79, puis 0,0077 et 0,031.</div>
  <div class="q"><strong>Q1.</strong> Justifier le choix de porter \(U\) en fonction de \(I\) et l'expression de <code>uz</code>.</div>
  <div class="q"><strong>Q2.</strong> Calculer à la main \(u(I)\) et \(u(U)\) pour le premier point.</div>
  <div class="q"><strong>Q3.</strong> Le modèle est-il validé ? Écrire les résultats pour \(E\) et \(r\).</div>
  <div class="q"><strong>Q4.</strong> En ne faisant varier que \(U\), la simulation donne \(u(r)=0{,}026\ \Omega\) ; en ne faisant varier que \(I\), \(u(r)=0{,}018\ \Omega\). Commenter.</div>
  <div class="q"><strong>Q5.</strong> Avant les mesures, le voltmètre branché seul aux bornes de la pile affichait \(U_0=4{,}526\ \text{V}\). Comparer à \(E\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le modèle \(U=E-rI\) est affine en \(I\) : la pente vaut \(-r\) et l'ordonnée à l'origine \(E\). Les deux grandeurs sont incertaines ; une erreur \(u(I)\) sur l'abscisse déplace le point, vu de la droite, de \(|{\text{pente}}|\,u(I)\) verticalement, d'où \(u_z=\sqrt{u(U)^2+r^2u(I)^2}\) au dénominateur de l'écart normalisé.</p>
    <p><strong>Q2.</strong> \(u(I)=(0{,}01\times51+3)/\sqrt3=2{,}0\ \text{mA}\) ; \(u(U)=0{,}0154/\sqrt3=0{,}0088\ \text{V}\). La contribution de \(I\) vue sur \(U\) vaut \(r\,u(I)=1{,}81\times0{,}0020=0{,}0037\ \text{V}\), près de la moitié de \(u(U)\) : on ne peut pas la négliger.</p>
    <p><strong>Q3.</strong> Tous les écarts normalisés sont inférieurs à 1 en valeur absolue, de signes alternés : le modèle est validé. \(E=4{,}524\ \text{V}\), \(u(E)=0{,}008\ \text{V}\) ; \(r=1{,}81\ \Omega\), \(u(r)=0{,}03\ \Omega\).</p>
    <p><strong>Q4.</strong> Les deux sources contribuent : \(\sqrt{0{,}026^2+0{,}018^2}=0{,}032\ \Omega\), conforme à la simulation complète. Ne faire varier que \(U\) (ce que le programme autorise au minimum) sous-estimerait \(u(r)\) d'environ 15 % : ici, simuler les deux grandeurs est justifié.</p>
    <p><strong>Q5.</strong> \(u(U_0)=0{,}0156/\sqrt3=0{,}009\ \text{V}\), puis \(E_N=0{,}002/\sqrt{0{,}009^2+0{,}008^2}=0{,}2\) : compatibles. La tension à vide est bien la force électromotrice, puisque le voltmètre (10 MΩ) ne débite presque aucun courant.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Étalonner une sonde de platine</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>mesures et incertitudes : type A, erreur systématique, régression linéaire, résidus, Monte-Carlo, écart normalisé</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une sonde « Pt100 » est un fil de platine dont la résistance vaut environ 100 Ω à 0 °C et croît avec la température. On l'étalonne dans un bain thermostaté dont la température \(\theta\) est lue sur un thermomètre de référence (incertitude négligeable). On modélise d'abord la sonde par \(R=R_0(1+\alpha\theta)\), soit \(R=a\theta+b\) avec \(b=R_0\) et \(a=R_0\alpha\).
    <div style="overflow-x:auto"><table style="border-collapse:collapse;margin:.5rem 0">
      <tr><th>\(\theta\) (°C)</th><td>0</td><td>10</td><td>20</td><td>30</td><td>40</td><td>50</td></tr>
      <tr><th>\(R\) (Ω)</th><td>100,007</td><td>103,919</td><td>107,800</td><td>111,647</td><td>115,559</td><td>119,406</td></tr>
      <tr><th>\(\theta\) (°C)</th><td>60</td><td>70</td><td>80</td><td>90</td><td>100</td><td></td></tr>
      <tr><th>\(R\) (Ω)</th><td>123,231</td><td>127,087</td><td>130,904</td><td>134,713</td><td>138,506</td><td></td></tr>
    </table></div>
  </div>

  <p class="exo-part">Partie A — Mesurer une résistance</p>
  <div class="q"><strong>A1.</strong> Chaque valeur de \(R\) est la moyenne de dix lectures indépendantes, dont l'écart-type expérimental vaut 0,063 Ω. Justifier \(u(R)=0{,}020\ \Omega\).</div>
  <div class="q"><strong>A2.</strong> La sensibilité de la sonde vaut environ \(0{,}39\ \Omega\cdot\text{°C}^{-1}\). À quelle incertitude sur la température correspond \(u(R)\) ?</div>
  <div class="q"><strong>A3.</strong> Les deux fils qui relient la sonde à l'ohmmètre ont une résistance totale d'environ 0,2 Ω. Quelle erreur commettrait-on en mesurant la résistance « à deux fils » ? De quel type d'erreur s'agit-il ? Expliquer pourquoi un montage « à quatre fils » (deux fils amènent le courant, deux autres, qui ne sont parcourus par aucun courant, mesurent la tension aux bornes de la sonde) la supprime.</div>

  <p class="exo-part">Partie B — Le modèle affine de 0 à 100 °C</p>
  <div class="q"><strong>B1.</strong> L'ajustement sur les onze points donne \(a=0{,}38503\ \Omega\cdot\text{°C}^{-1}\), \(b=100{,}092\ \Omega\) et \(R^2=0{,}99998\). Les résidus \(R_i-(a\theta_i+b)\) valent, en mΩ : −85 ; −23 ; 7 ; 4 ; 66 ; 62 ; 37 ; 43 ; 9 ; −32 ; −89. Calculer les écarts normalisés et conclure.</div>
  <div class="q"><strong>B2.</strong> Avec un ohmmètre ordinaire, on aurait \(u(R)=0{,}15\ \Omega\), et des résidus du même ordre. Quelle aurait été la conclusion ? Que faut-il en retenir ?</div>
  <div class="q"><strong>B3.</strong> On sait que \(R=R_0(1+A\theta+B\theta^2)\), avec \(|B|\ll A\). Quel est le signe de \(B\) ?</div>

  <p class="exo-part">Partie C — Étalonnage entre 0 et 50 °C</p>
  <div class="q"><strong>C1.</strong> Sur les six points de 0 à 50 °C, l'ajustement donne \(a=0{,}387891\ \Omega\cdot\text{°C}^{-1}\) et \(b=100{,}0257\ \Omega\), et les écarts normalisés −0,94 ; 0,72 ; 0,82 ; −0,77 ; 0,88 ; −0,71. Conclure.</div>
  <div class="q"><strong>C2.</strong> On exécute le programme suivant. Expliquer le rôle de chaque bloc.</div>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

theta = np.array([0, 10, 20, 30, 40, 50])        <span class="cmt"># °C</span>
R = np.array([100.007, 103.919, 107.800,
              111.647, 115.559, 119.406])        <span class="cmt"># Ω</span>
uR = 0.020                                       <span class="cmt"># Ω</span>

Nsim = 10000
a, b = np.zeros(Nsim), np.zeros(Nsim)
<span class="kw">for</span> k <span class="kw">in</span> range(Nsim):
    Rsim = np.random.normal(R, uR)
    a[k], b[k] = np.polyfit(theta, Rsim, 1)

alpha = a / b             <span class="cmt"># R0 = b et R0 * alpha = a</span>
print(np.mean(alpha), np.std(alpha, ddof=1))

<span class="cmt"># sonde plongée dans le bain inconnu</span>
Rx = np.random.normal(114.382, uR, Nsim)
thx = (Rx - b) / a        <span class="cmt"># un couple (a, b) par tirage</span>
print(np.mean(thx), np.std(thx, ddof=1))</pre>
  <div class="q"><strong>C3.</strong> La première ligne affichée est \(3{,}8779\times10^{-3}\) et \(5{,}3\times10^{-6}\) (en \(\text{°C}^{-1}\)). Écrire le résultat pour \(\alpha\). Le fabricant annonce \(\alpha=3{,}851\times10^{-3}\ \text{°C}^{-1}\), défini par
    <div class="formula">$$\alpha=\frac{R(100\ \text{°C})-R(0\ \text{°C})}{100\,R(0\ \text{°C})}.$$</div>
    Calculer l'écart normalisé et expliquer l'écart sans mettre en cause les mesures.</div>

  <p class="exo-part">Partie D — Mesurer une température</p>
  <div class="q"><strong>D1.</strong> Plongée dans un bain inconnu, la sonde indique \(R=114{,}382\ \Omega\) (\(u(R)=0{,}020\ \Omega\)). La seconde ligne affichée par le programme est 37,011 et 0,058. Écrire le résultat. Comparer \(u(\theta)\) à l'incertitude qui viendrait de la seule mesure de \(R\), et commenter.</div>
  <div class="q"><strong>D2.</strong> Un thermomètre médical électronique placé dans le bain indique 37,1 °C, avec une incertitude-type de 0,1 °C. Conclure.</div>
  <div class="q"><strong>D3.</strong> Quelle température aurait-on trouvée avec l'ajustement de 0 à 100 °C (partie B) ? Commenter.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Évaluation de type A sur dix mesures indépendantes : \(u=s/\sqrt{10}=0{,}063/3{,}16=0{,}020\ \Omega\).</p>
    <p><strong>A2.</strong> \(u(\theta)=u(R)\big/\dfrac{\mathrm dR}{\mathrm d\theta}=\dfrac{0{,}020}{0{,}39}=0{,}05\ \text{°C}\).</p>
    <p><strong>A3.</strong> À deux fils, l'ohmmètre mesure la sonde et ses fils : \(R\) est surestimée de 0,2 Ω, ce qui fait lire une température trop haute de \(0{,}2/0{,}39\approx0{,}5\ \text{°C}\), dix fois \(u(\theta)\). C'est une erreur systématique (même décalage à chaque mesure, invisible sur une série) liée à la méthode. À quatre fils, la tension est prise directement aux bornes de la sonde par des fils qui ne transportent pas de courant : la chute de tension dans les fils d'amenée n'est pas mesurée.</p>
    <p><strong>B1.</strong> On divise par 20 mΩ : −4,2 ; −1,2 ; 0,4 ; 0,2 ; 3,3 ; 3,1 ; 1,9 ; 2,1 ; 0,5 ; −1,6 ; −4,5. Cinq écarts sur onze dépassent 2 en valeur absolue, et ils dessinent une arche (négatifs aux extrémités, positifs au milieu) : à cette précision, le modèle affine est rejeté sur 0-100 °C, malgré un \(R^2\) de 0,99998.</p>

    <p><strong>B2.</strong> Divisés par 150 mΩ, les mêmes résidus restent entre −0,6 et 0,4 : rien ne permettrait de rejeter le modèle affine. Un modèle n'est pas « vrai » ou « faux » dans l'absolu : il est validé ou rejeté <em>à une précision donnée</em>. Plus la mesure est précise, plus elle révèle les défauts des modèles.</p>
    <p><strong>B3.</strong> La courbe réelle passe au-dessus de la droite au milieu et en dessous aux extrémités : elle est concave, \(\mathrm d^2R/\mathrm d\theta^2=2R_0B\lt0\), donc \(B\lt0\).</p>
    <p><strong>C1.</strong> Écarts normalisés tous inférieurs à 1 en valeur absolue, de signes alternés : sur 0-50 °C, le modèle affine est validé à la précision de 0,020 Ω.</p>
    <p><strong>C2.</strong> Les trois premières lignes entrent les mesures et leur incertitude-type. La boucle fabrique 10 000 jeux de résistances plausibles (chaque point tiré selon une loi normale centrée sur la mesure, d'écart-type 0,020 Ω) et ajuste une droite sur chacun : on obtient 10 000 couples \((a,b)\). <code>alpha = a / b</code> calcule \(\alpha=a/R_0\) pour chaque couple ; sa moyenne et son écart-type sont le résultat et l'incertitude-type. Enfin, on tire 10 000 valeurs plausibles de la résistance mesurée dans le bain inconnu et l'on calcule, avec chaque couple \((a,b)\), la température correspondante : l'incertitude sur \(\theta\) inclut ainsi celle de l'étalonnage, en tenant compte du lien entre \(a\) et \(b\).</p>
    <p><strong>C3.</strong> \(\alpha=3{,}8779\times10^{-3}\ \text{°C}^{-1}\), \(u(\alpha)=0{,}0053\times10^{-3}\ \text{°C}^{-1}\). \(E_N=(3{,}8779-3{,}851)/0{,}0053=5\) : incompatibles. Mais les deux nombres ne mesurent pas la même chose : le fabricant définit \(\alpha\) par la pente moyenne entre 0 et 100 °C, tandis que l'étalonnage donne la pente moyenne entre 0 et 50 °C. La courbe étant concave (B3), sa pente diminue quand \(\theta\) augmente : la pente sur 0-50 °C est plus grande que la pente sur 0-100 °C. L'incompatibilité vient de la définition du mesurande, pas d'une erreur de mesure.</p>
    <p><strong>D1.</strong></p><div class="formula">$$\theta=\frac{114{,}382-100{,}0257}{0{,}387891}=37{,}01\ \text{°C},\qquad u(\theta)=0{,}06\ \text{°C}.$$</div><p> La seule mesure de \(R\) donnerait \(0{,}020/0{,}3879=0{,}052\ \text{°C}\) : l'étalonnage n'ajoute presque rien (\(\sqrt{0{,}058^2-0{,}052^2}\approx0{,}03\ \text{°C}\)), parce qu'on mesure dans le domaine étalonné, près de son centre.</p>
    <p><strong>D2.</strong> \(E_N=0{,}09/\sqrt{0{,}058^2+0{,}1^2}=0{,}8\) : compatibles. Le thermomètre médical, moins précis, est confirmé.</p>
    <p><strong>D3.</strong> On trouverait \(\theta=37{,}11\ \text{°C}\) (calcul avec \(a=0{,}38503\) et \(b=100{,}092\)) : 0,10 °C de plus, soit près de deux fois \(u(\theta)\). Utiliser un modèle rejeté (partie B) introduit une erreur systématique du même ordre que l'incertitude, que rien dans le calcul ne signale : c'est pourquoi on valide toujours un modèle par les résidus avant de s'en servir.</p>
