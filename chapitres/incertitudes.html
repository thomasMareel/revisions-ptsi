  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie « Mesures et incertitudes » de la formation expérimentale du programme de PTSI. Elle ne relève d'aucun thème : elle sert dans chaque séance de travaux pratiques, dans les questions d'exploitation de mesures des épreuves écrites et, plus encore, à l'oral de TP, où l'on vous demandera toujours « avec quelle incertitude ? » et « est-ce compatible ? ». Le programme de PT reprend mot pour mot la même liste : ses notions couvrent les deux années, et leur pleine maîtrise est un objectif de fin de 2ᵉ année. Le chapitre « Variables aléatoires » (mathématiques) fournit l'outil probabiliste, le chapitre « Méthodes numériques » (informatique) les bases de Python.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Variabilité de la mesure d'une grandeur physique, incertitude, incertitude-type</strong> : identifier les incertitudes liées à l'opérateur, à l'environnement, aux instruments ou à la méthode de mesure (§1).</li>
        <li><strong>Évaluation de type A</strong> : procéder à l'évaluation d'une incertitude-type par une approche statistique (§2).</li>
        <li><strong>Évaluation de type B</strong> : procéder à l'évaluation d'une incertitude-type par une autre approche que statistique (§3).</li>
        <li><strong>Loi normale</strong> : associer un intervalle de confiance à l'écart-type dans l'hypothèse d'une distribution suivant la loi normale (§4).</li>
        <li><strong>Incertitudes-types composées</strong> : évaluer l'incertitude-type d'une grandeur qui s'exprime à l'aide d'une somme, d'une différence, d'un produit ou d'un quotient d'autres grandeurs dont les incertitudes-types sont connues ; comparer entre elles les différentes contributions (§5).</li>
        <li><strong>Capacité numérique</strong> : simuler, à l'aide d'un langage de programmation, un processus aléatoire qui caractérise la variabilité de la valeur d'une grandeur composée (§6).</li>
        <li><strong>Écriture du résultat d'une mesure</strong> avec un nombre adapté de chiffres significatifs (§7).</li>
        <li><strong>Écart normalisé</strong> : comparer deux valeurs dont les incertitudes-types sont connues ; analyser les causes d'une éventuelle incompatibilité entre le résultat d'une mesure et le résultat attendu par une modélisation (§8).</li>
        <li><strong>Régression linéaire</strong> : obtenir les paramètres d'un modèle avec un logiciel ; valider le modèle par une analyse graphique avec barres d'incertitude ou par l'analyse des écarts normalisés, sans s'en remettre au seul coefficient R² (§9).</li>
        <li><strong>Capacité numérique</strong> : simuler, par la méthode de Monte-Carlo, la variation des valeurs expérimentales de l'une des grandeurs pour évaluer l'incertitude sur les paramètres du modèle (§10).</li>
        <li><strong>Outils numériques</strong> (annexe du programme) : tirages avec les fonctions de numpy (<code>random.normal</code>, <code>random.uniform</code>), histogramme avec <code>hist</code> de matplotlib, moyenne et écart-type d'un ensemble de tirages, régression avec <code>polyfit</code> (§2, §6, §9, §10). Les spécifications de ces fonctions sont fournies par les énoncés.</li>
        <li><strong>Pratique expérimentale</strong> : ordres de grandeur des incertitudes des instruments usuels, et les gestes qui les réduisent (§11).</li>
      </ul>

<div class="course-section">
  <div class="sec-num">§1 · VARIABILITÉ DE LA MESURE</div>
  <h2>Mesurer, c'est estimer une valeur</h2>
  <div class="intro">Recommencez une mesure, même soigneusement, et vous obtiendrez presque toujours une valeur un peu différente. Ce n'est pas un échec : c'est la nature de toute mesure. Le chapitre donne le vocabulaire et les outils pour décrire cette variabilité par un nombre, l'incertitude-type, puis pour s'en servir : composer, écrire, comparer, valider un modèle.</div>
  <div class="def-box">
    <strong>Mesurande, valeur mesurée.</strong> Le <em>mesurande</em> est la grandeur particulière que l'on veut mesurer, définie assez précisément pour que la question ait un sens : « la période des oscillations de faible amplitude de ce pendule, à la température de la salle » et non « la période ». La <em>valeur mesurée</em> \(x\) est le nombre (avec son unité) que fournit le mesurage. La valeur exacte du mesurande, parfois appelée valeur vraie, n'est jamais connue.
  </div>
  <h3>D'où vient la variabilité ?</h3>
  <p>Le programme demande d'identifier quatre familles de sources, qu'il faut savoir citer avec un exemple précis pour chaque protocole :</p>
  <ul>
    <li><strong>L'opérateur</strong> : temps de réaction au déclenchement d'un chronomètre (de l'ordre de 0,1 s), appréciation de la netteté d'une image sur un écran, lecture d'un ménisque ou d'une aiguille avec un défaut de parallaxe, repérage d'un virage de couleur.</li>
    <li><strong>L'environnement</strong> : température de la salle (la célérité du son, une résistance, un volume de verrerie en dépendent), courants d'air sur une balance, vibrations, lumière parasite sur un capteur, parasites du secteur à 50 Hz.</li>
    <li><strong>Les instruments</strong> : graduation d'une règle, résolution d'un affichage numérique, tolérance donnée par le constructeur (multimètre, verrerie jaugée), étalonnage, dérive.</li>
    <li><strong>La méthode</strong> : modèle simplifié (pendule simple pour un pendule réel, amplitude non infiniment petite), perturbation apportée par l'appareil (résistance d'entrée d'un voltmètre, résistance d'un ampèremètre), choix de la grandeur effectivement lue (période sur une oscillation ou sur vingt).</li>
  </ul>

  <div class="def-box">
    <strong>Erreur de mesure.</strong> C'est la différence \(x-x_{\text{vrai}}\) entre la valeur mesurée et la valeur du mesurande. Elle est inconnue, puisque \(x_{\text{vrai}}\) l'est. On y distingue deux composantes : une composante <em>aléatoire</em>, qui change d'une mesure à l'autre (elle crée la dispersion et se réduit en moyennant), et une composante <em>systématique</em>, identique pour toutes les mesures faites de la même façon (zéro d'une balance mal réglé, étalonnage faux, résistance de l'appareil) : elle ne se voit pas sur une série et ne diminue pas en répétant ; on la corrige quand on la connaît, sinon on la révèle en changeant de méthode ou en mesurant un étalon.
  </div>
  <div class="def-box">
    <strong>Incertitude-type.</strong> L'incertitude-type \(u(x)\) est un nombre positif, de même unité que \(x\), qui caractérise la dispersion des valeurs que l'on peut raisonnablement attribuer au mesurande compte tenu de la mesure : c'est un <em>écart-type</em>. L'incertitude-type relative est \(u(x)/|x|\), sans dimension, souvent en pourcentage. Le résultat complet d'une mesure comporte trois éléments : une valeur, une incertitude-type et une unité.
  </div>
  <div class="method-box">
    <strong>Exemple — chronométrer une chute à la main</strong>
    <p>On lâche une bille d'une hauteur \(h=1{,}000\ \text{m}\) (règle graduée au millimètre) et on chronomètre sa chute à la main pour en déduire \(g=2h/t^2\).</p>
    <ol>
      <li>Ordre de grandeur de la durée : \(t=\sqrt{2h/g}=\sqrt{2\times1{,}000/9{,}81}\approx0{,}45\ \text{s}\).</li>
      <li>Source « opérateur » : on déclenche et on arrête le chronomètre à la main. D'un essai à l'autre, la durée affichée varie d'environ 0,05 à 0,1 s, soit 10 à 20 % de \(t\), donc 20 à 40 % sur \(g\), qui contient \(t^2\).</li>
      <li>Source « instrument » : la règle donne \(h\) à environ 1 mm près, soit 0,1 %. La résolution du chronomètre (0,01 s) est sans importance devant le temps de réaction.</li>
      <li>Conclusion : la variabilité vient presque entièrement de l'opérateur. Répéter les mesures aiderait un peu, changer de méthode beaucoup plus : avec une fourche optique, une carte d'acquisition ou une vidéo, \(t\) est connu à la milliseconde près, soit 0,2 %.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre erreur et incertitude. Une incertitude n'est pas une faute que l'on aurait commise : c'est une estimation, toujours positive, de la dispersion attendue. Une erreur, elle, a un signe et reste inconnue. Autre confusion : croire qu'en répétant cent fois la même mesure on fera disparaître une erreur systématique. Cent mesures faites avec un ohmmètre mal étalonné donnent cent valeurs fausses de la même façon.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ÉVALUATION DE TYPE A</div>
  <h2>Une série de mesures : moyenne et écart-type</h2>
  <div class="intro">Quand on peut répéter la mesure dans les mêmes conditions et que les valeurs se dispersent, la statistique fournit directement l'incertitude-type : c'est l'évaluation de type A. Elle suppose des mesures indépendantes, c'est-à-dire refaites en entier à chaque fois.</div>
  <div class="def-box">
    <strong>Moyenne et écart-type expérimental.</strong> Pour \(N\) mesures indépendantes \(x_1,\dots,x_N\) d'une même grandeur :
    <div class="formula" data-nom="Moyenne d'une série">$$\bar x=\frac{1}{N}\sum_{i=1}^{N}x_i$$</div>
    <div class="formula" data-nom="Écart-type d'une série">$$s_x=\sqrt{\frac{1}{N-1}\sum_{i=1}^{N}\left(x_i-\bar x\right)^2}$$</div>
    L'écart-type expérimental \(s_x\) mesure la dispersion d'une mesure isolée : c'est l'incertitude-type d'<em>une</em> mesure faite avec ce protocole, \(u(x_i)=s_x\).
  </div>
  <div class="prop-box">
    <strong>Incertitude-type de la moyenne.</strong> Le résultat retenu est la moyenne \(\bar x\), moins dispersée qu'une mesure isolée. Son incertitude-type (évaluation de type A) est
    <div class="formula" data-nom="Type A : u de la moyenne">$$u(\bar x)=\frac{s_x}{\sqrt N}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour comprendre</span>
    <span class="prompt">D'où viennent le \(\sqrt N\) et le \(N-1\) ?</span>
    <div class="content">
      <p>Modélisons chaque mesure par une variable aléatoire \(X_i\) de variance \(\sigma^2\), les \(X_i\) étant indépendantes. La variance d'une somme de variables indépendantes est la somme des variances (chapitre « Variables aléatoires ») et \(V(\lambda X)=\lambda^2V(X)\), donc</p>
      <div class="formula">$$V\!\left(\bar X\right)=V\!\left(\frac{1}{N}\sum_{i=1}^{N}X_i\right)=\frac{1}{N^2}\times N\sigma^2=\frac{\sigma^2}{N},$$</div>
      <p>d'où un écart-type \(\sigma/\sqrt N\) pour la moyenne : c'est le \(\sqrt N\). On ne connaît pas \(\sigma\) ; on l'estime par \(s_x\). Le diviseur \(N-1\) plutôt que \(N\) vient de ce que les écarts sont pris à \(\bar x\), calculée sur les mêmes données : ils sont en moyenne un peu plus petits que les écarts à la vraie moyenne, et diviser par \(N-1\) compense exactement ce biais sur \(s_x^2\). La différence est minime dès quelques dizaines de mesures.</p>
    </div>
  </div>

<figcaption>Quarante chronométrages de dix périodes d'un même pendule (données simulées, classes de 0,05 s). Moyenne 15,535 s, écart-type expérimental s = 0,107 s : la bande teintée (moyenne ± s) contient 27 mesures sur 40, environ les deux tiers. La courbe est la loi normale de même moyenne et de même écart-type. Une mesure isolée a pour incertitude-type s ; la moyenne des 40, s/√40 = 0,017 s.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — période d'un pendule au chronomètre</strong>
    <p>Pour mesurer la période \(T\) d'un pendule, on chronomètre dix oscillations, huit fois de suite, en relâchant le pendule à chaque essai. Durées \(10T\) obtenues (en s) : 15,62 ; 15,41 ; 15,55 ; 15,48 ; 15,70 ; 15,52 ; 15,39 ; 15,61.</p>
    <ol>
      <li>Moyenne : la somme vaut 124,28 s, donc \(\overline{10T}=124{,}28/8=15{,}535\ \text{s}\).</li>
      <li>Écart-type expérimental : la somme des carrés des écarts à la moyenne vaut \(0{,}0802\ \text{s}^2\), d'où \(s=\sqrt{0{,}0802/7}=0{,}107\ \text{s}\). C'est la dispersion d'un chronométrage isolé, due surtout au temps de réaction.</li>
      <li>Incertitude-type de la moyenne : \(u=0{,}107/\sqrt8=0{,}038\ \text{s}\) sur \(10T\).</li>
      <li>Période : on divise par 10 (nombre exact), valeur et incertitude : \(T=1{,}5535\ \text{s}\) et \(u(T)=0{,}0038\ \text{s}\), soit 0,24 %.</li>
    </ol>
    <p>Le même calcul avec numpy (la fonction <code>np.std</code> divise par \(N\) par défaut : l'option <code>ddof=1</code> la fait diviser par \(N-1\)) :</p>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="cmt"># huit chronométrages de dix périodes, en secondes</span>
dixT = np.array([15.62, 15.41, 15.55, 15.48,
                 15.70, 15.52, 15.39, 15.61])
N = len(dixT)

moyenne = np.mean(dixT)
<span class="cmt"># écart-type expérimental (diviseur N - 1)</span>
s = np.std(dixT, ddof=1)
<span class="cmt"># incertitude-type de la moyenne</span>
u_moy = s / np.sqrt(N)

print(N, moyenne, s, u_moy)   <span class="cmt"># 8  15.535  0.107  0.0378</span>
T, uT = moyenne / 10, u_moy / 10
print(T, uT)                  <span class="cmt"># 1.5535  0.00378</span></pre>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) prendre \(s_x\) au lieu de \(s_x/\sqrt N\) comme incertitude de la moyenne, ou l'inverse pour une mesure isolée ; (2) oublier <code>ddof=1</code> ; (3) appeler « série de mesures » dix lectures du même affichage sans rien refaire : elles ne sont pas indépendantes et leur dispersion nulle ne dit rien. Retenez aussi que \(s_x\) ne diminue pas quand \(N\) augmente (c'est une propriété du protocole) ; seule \(u(\bar x)\) diminue, et lentement : pour la diviser par 10, il faut 100 fois plus de mesures.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ÉVALUATION DE TYPE B</div>
  <h2>Une seule mesure : utiliser ce que l'on sait de l'instrument</h2>
  <div class="intro">Souvent, on ne fait qu'une mesure, ou toutes les lectures répétées donnent le même affichage. L'incertitude-type s'évalue alors autrement, à partir de la graduation, de la résolution, de la notice du constructeur ou d'une estimation raisonnée de l'opérateur : c'est l'évaluation de type B.</div>
  <div class="prop-box">
    <strong>Valeur comprise dans un intervalle.</strong> Si l'on sait seulement que la valeur est comprise entre \(x-a\) et \(x+a\), sans position privilégiée à l'intérieur, on la modélise par une loi uniforme sur cet intervalle de demi-largeur \(a\). L'incertitude-type est l'écart-type de cette loi :
    <div class="formula" data-nom="Type B : loi uniforme">$$u(x)=\frac{a}{\sqrt3}\approx0{,}58\,a$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">L'écart-type d'une loi uniforme de demi-largeur \(a\) vaut \(a/\sqrt3\)</span>
    <div class="content">
      <p>Centrons la loi en 0 : sa densité vaut \(1/(2a)\) sur \([-a\,;a]\) et sa moyenne est nulle. Sa variance est donc</p>
      <div class="formula">$$\sigma^2=\int_{-a}^{a}t^2\,\frac{\mathrm{d}t}{2a}=\frac{1}{2a}\times\frac{2a^3}{3}=\frac{a^2}{3},$$</div>
      <p>et \(\sigma=a/\sqrt3\). Pour un intervalle de largeur totale \(\Delta=2a\), cela donne \(\Delta/\sqrt{12}\).</p>
    </div>
  </div>

  <h3>Les cas usuels</h3>
  <ul>
    <li><strong>Lecture sur une graduation de pas \(\Delta\)</strong> (règle, burette, thermomètre à liquide) : on lit le trait le plus proche, donc \(a=\Delta/2\) et \(u=\Delta/(2\sqrt3)\approx0{,}29\,\Delta\). Une longueur obtenue par deux lectures (début et fin) combine deux incertitudes de ce type (§5).</li>
    <li><strong>Affichage numérique sans notice</strong> : si le dernier chiffre affiché vaut \(q\) (résolution), la valeur est connue à \(q/2\) près, \(u=q/(2\sqrt3)\). C'est un minimum, presque toujours dépassé par la tolérance du constructeur.</li>
    <li><strong>Notice du constructeur</strong> : une précision annoncée « \(\pm(p\ \%\) de la lecture \(+\,n\) digits) » donne la demi-largeur \(a=p\ \%\times|x|+n\,q\), puis \(u=a/\sqrt3\). Un digit vaut une unité du dernier chiffre affiché sur le calibre utilisé.</li>
    <li><strong>Verrerie jaugée</strong> : une pipette de 20 mL de classe A est garantie à \(\pm0{,}03\ \text{mL}\), d'où \(u=0{,}03/\sqrt3=0{,}017\ \text{mL}\).</li>
    <li><strong>Estimation de l'opérateur</strong> : l'image d'un objet par une lentille paraît nette quand l'écran est placé n'importe où entre \(x_{\min}\) et \(x_{\max}\) ; on prend le milieu, \(a=(x_{\max}-x_{\min})/2\) et \(u=a/\sqrt3\). Même démarche pour la plage où un signal semble en phase, où une couleur semble virer.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — un voltmètre et une image</strong>
    <ol>
      <li>Un voltmètre affiche \(U=4{,}872\ \text{V}\) sur le calibre 20 V (dernier chiffre : 1 mV). Sa notice annonce \(\pm(0{,}5\ \%\) de la lecture \(+\,2\) digits). Demi-largeur : \(a=0{,}005\times4{,}872+2\times0{,}001=0{,}0264\ \text{V}\) ; incertitude-type \(u(U)=0{,}0264/\sqrt3=0{,}015\ \text{V}\), soit 0,31 %.</li>
      <li>Comparaison : la résolution seule donnerait \(0{,}001/(2\sqrt3)=0{,}0003\ \text{V}\), cinquante fois moins. Ne retenir que le dernier chiffre affiché sous-estime gravement l'incertitude.</li>
      <li>Sur un banc d'optique gradué au millimètre, l'image d'une lentille paraît nette de 88,6 cm à 91,4 cm. On note \(x_{A'}=90{,}0\ \text{cm}\), \(a=1{,}4\ \text{cm}\), \(u(x_{A'})=1{,}4/\sqrt3=0{,}81\ \text{cm}\). La graduation du banc (\(u=0{,}03\ \text{cm}\)) est ici sans importance : c'est la latitude de mise au point, une source « opérateur », qui domine.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre la demi-largeur \(a\) (« à 1,4 cm près », « ± 0,03 mL ») pour l'incertitude-type. Ce que l'on lit sur une notice ou ce que l'on estime est une borne ; l'incertitude-type est un écart-type, \(a/\sqrt3\). Inversement, quand une série de mesures se disperse plus que ce que prévoit l'évaluation de type B, c'est l'évaluation de type A qu'il faut retenir : la dispersion observée prime sur la notice.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LOI NORMALE ET INTERVALLE DE CONFIANCE</div>
  <h2>Que signifie « à une incertitude-type près » ?</h2>
  <div class="intro">Une incertitude-type est un écart-type. Pour la traduire en « chances » de contenir la valeur du mesurande, il faut une loi de probabilité ; le programme demande de le faire dans le cas de la loi normale, qui décrit bien la plupart des résultats de mesure.</div>
  <p>Pourquoi la loi normale ? Quand une valeur mesurée résulte de nombreuses petites causes de variation indépendantes (tremblement de la main, fluctuations de température, lecture…), leur somme suit approximativement une loi normale, quelle que soit la loi de chacune : c'est le théorème central limite, admis ici. C'est aussi le cas de la moyenne d'un grand nombre de mesures, et de la plupart des grandeurs composées de plusieurs contributions comparables.</p>
  <div class="prop-box">
    <strong>Intervalles de confiance d'une loi normale.</strong> Si la distribution des valeurs attribuables au mesurande est normale, de moyenne \(x\) et d'écart-type \(u(x)\) :
    <ul>
      <li>l'intervalle \([x-u\,;\,x+u]\) contient la valeur du mesurande avec une probabilité d'environ 68 % ;</li>
      <li>l'intervalle \([x-2u\,;\,x+2u]\), avec une probabilité d'environ 95 % ;</li>
      <li>l'intervalle \([x-3u\,;\,x+3u]\), avec une probabilité de 99,7 %.</li>
    </ul>
    Le produit \(k\,u(x)\) est appelé <em>incertitude élargie</em>, de facteur d'élargissement \(k\) ; avec \(k=2\), le niveau de confiance vaut environ 95 %.
  </div>

  <div class="method-box">
    <strong>Exemple — intervalles pour la période du pendule</strong>
    <ol>
      <li>Au §2, \(T=1{,}5535\ \text{s}\) et \(u(T)=0{,}0038\ \text{s}\). La moyenne de huit mesures de même loi est presque normale.</li>
      <li>Intervalle à 68 % : \([1{,}5497\,;\,1{,}5573]\ \text{s}\) ; à 95 % : \(T\pm2u=[1{,}5459\,;\,1{,}5611]\ \text{s}\).</li>
      <li>Lecture : si l'on refaisait toute l'expérience un grand nombre de fois, environ 95 % des intervalles \([\,T-2u\,;\,T+2u\,]\) ainsi construits contiendraient la période du pendule.</li>
      <li>Pour une loi <em>uniforme</em> au contraire, l'intervalle \(\pm u\) ne contient que \(1/\sqrt3\approx58\ \%\) des valeurs, et l'intervalle \(\pm2u=\pm1{,}15\,a\) les contient toutes. Les pourcentages 68 % et 95 % ne valent que pour la loi normale.</li>
    </ol>

  <div class="notice"><strong>Remarque</strong> : avec très peu de mesures (moins d'une dizaine), \(s_x\) est lui-même mal connu et l'intervalle \(\bar x\pm2u\) contient un peu moins de 95 % des cas ; on le corrige par le facteur de Student, hors programme (fin de chapitre).</div>

<div class="course-section">
  <div class="sec-num">§5 · INCERTITUDES-TYPES COMPOSÉES</div>
  <h2>Combiner les incertitudes des grandeurs mesurées</h2>
  <div class="intro">On mesure rarement directement la grandeur qui intéresse : une résistance se déduit d'une tension et d'une intensité, une distance focale de trois positions, \(g\) d'une longueur et d'une période. Si les grandeurs mesurées sont indépendantes, leurs incertitudes-types se combinent selon deux règles simples, qui couvrent la somme, la différence, le produit et le quotient.</div>
  <div class="prop-box">
    <strong>Somme et différence : les incertitudes absolues s'ajoutent en quadrature.</strong> Si \(y=x_1+x_2\) ou \(y=x_1-x_2\), avec \(x_1\) et \(x_2\) indépendantes,
    <div class="formula" data-nom="Somme ou différence">$$u(y)=\sqrt{u(x_1)^2+u(x_2)^2}$$</div>
    Plus généralement, pour \(y=\lambda_1x_1+\lambda_2x_2\) (coefficients exacts), \(u(y)=\sqrt{\lambda_1^2u(x_1)^2+\lambda_2^2u(x_2)^2}\) ; en particulier \(u(\lambda x)=|\lambda|\,u(x)\).
  </div>
  <div class="prop-box">
    <strong>Produit et quotient : les incertitudes relatives s'ajoutent en quadrature.</strong> Si \(y=x_1x_2\) ou \(y=x_1/x_2\) (éventuellement multiplié par une constante exacte), avec \(x_1\) et \(x_2\) indépendantes,
    <div class="formula" data-nom="Produit ou quotient">$$\frac{u(y)}{|y|}=\sqrt{\left(\frac{u(x_1)}{x_1}\right)^2+\left(\frac{u(x_2)}{x_2}\right)^2}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour comprendre</span>
    <span class="prompt">Pourquoi une somme quadratique, et pourquoi des incertitudes relatives pour un produit ?</span>
    <div class="content">
      <p><strong>Somme.</strong> Les incertitudes-types sont des écarts-types, et ce sont les <em>variances</em> de variables indépendantes qui s'ajoutent : \(V(X_1\pm X_2)=V(X_1)+V(X_2)\). D'où la racine de la somme des carrés. Intuitivement, deux écarts indépendants ont peu de chances d'être tous deux maximaux et de même sens : ils se compensent en partie, et la somme quadratique est plus petite que la somme simple.</p>
      <p><strong>Produit.</strong> Écrivons \(x_1=\bar x_1(1+\varepsilon_1)\) et \(x_2=\bar x_2(1+\varepsilon_2)\) avec de petits écarts relatifs. Au premier ordre, \(x_1x_2=\bar x_1\bar x_2(1+\varepsilon_1+\varepsilon_2)\) et \(x_1/x_2=(\bar x_1/\bar x_2)(1+\varepsilon_1-\varepsilon_2)\) : l'écart relatif du résultat est la somme ou la différence des écarts relatifs, d'où la règle précédente appliquée aux incertitudes relatives.</p>
    </div>
  </div>
  <h3>Comparer les contributions</h3>
  <p>Chaque terme sous la racine est la <em>contribution</em> d'une source. Comme on ajoute des carrés, la plus grande domine vite : une contribution trois fois plus petite que la principale ne change le total que d'environ 5 % (\(\sqrt{1+1/9}\approx1{,}05\)). On présente souvent ces contributions dans un tableau, le <em>bilan d'incertitude</em> : il dit quelle mesure améliorer, et lesquelles ne valent pas l'effort.</p>
  <div class="method-box">
    <strong>Exemple — résistance par la loi d'Ohm</strong>
    <p>Un voltmètre donne \(U=4{,}872\ \text{V}\) avec \(u(U)=0{,}015\ \text{V}\) (§3). Un ampèremètre affiche \(I=10{,}35\ \text{mA}\) sur un calibre où le dernier chiffre vaut 0,01 mA, de précision \(\pm(1\ \%+3\) digits).</p>
    <ol>
      <li>Type B pour \(I\) : \(a=0{,}01\times10{,}35+3\times0{,}01=0{,}1335\ \text{mA}\), \(u(I)=0{,}1335/\sqrt3=0{,}077\ \text{mA}\).</li>
      <li>Incertitudes relatives : \(u(U)/U=0{,}31\ \%\) et \(u(I)/I=0{,}74\ \%\).</li>
      <li>Quotient \(R=U/I=470{,}7\ \Omega\) : \(u(R)/R=\sqrt{0{,}31^2+0{,}74^2}\ \%=0{,}81\ \%\), d'où \(u(R)=3{,}8\ \Omega\).</li>
      <li>Bilan : la contribution de l'ampèremètre domine ; avec un voltmètre parfait, on aurait encore 0,74 %. C'est l'ampèremètre qu'il faut changer (ou mesurer \(I\) par la tension aux bornes d'une résistance étalon).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une distance par différence de deux positions</strong>
    <p>Sur le banc d'optique du §3, la lentille est repérée en \(x_O=30{,}0\ \text{cm}\) à 2 mm près (\(u(x_O)=0{,}2/\sqrt3=0{,}12\ \text{cm}\)) et l'image en \(x_{A'}=90{,}0\ \text{cm}\) avec \(u(x_{A'})=0{,}81\ \text{cm}\).</p>
    <ol>
      <li>Distance lentille-image : \(\overline{OA'}=x_{A'}-x_O=60{,}0\ \text{cm}\).</li>
      <li>Différence : \(u(\overline{OA'})=\sqrt{0{,}12^2+0{,}81^2}=0{,}82\ \text{cm}\).</li>
      <li>La position de la lentille ne change presque rien (0,81 devient 0,82) : seule la latitude de mise au point compte.</li>
    </ol>
  </div>
  <h3>Et pour une puissance ?</h3>
  <p>Le programme se limite à la somme, à la différence, au produit et au quotient. Une puissance apparaît pourtant souvent (\(T^2\), \(d^2\), \(r^3\)) ; l'énoncé fournit alors la règle, ou l'on simule (§6). Elle se déduit du même raisonnement au premier ordre : \((1+\varepsilon)^n\approx1+n\varepsilon\), donc</p>
  <div class="formula" data-nom="Puissance">$$y=x^n\quad\Longrightarrow\quad\frac{u(y)}{|y|}=|n|\,\frac{u(x)}{|x|}$$</div>
  <p>et, pour \(y=K\,x_1^{\alpha}x_2^{\beta}\) avec des grandeurs indépendantes (\(K\) exacte),</p>
  <div class="formula">$$\frac{u(y)}{|y|}=\sqrt{\alpha^2\left(\frac{u(x_1)}{x_1}\right)^2+\beta^2\left(\frac{u(x_2)}{x_2}\right)^2}$$</div>
  <div class="method-box">
    <strong>Exemple — \(g\) avec un pendule simple</strong>
    <p>Avec \(L=0{,}600\ \text{m}\), \(u(L)=0{,}002\ \text{m}\) (centre de la masse repéré à 3,5 mm près) et la période du §2 (\(T=1{,}5535\ \text{s}\), \(u(T)=0{,}0038\ \text{s}\)), la loi \(T=2\pi\sqrt{L/g}\) donne \(g=4\pi^2L/T^2\).</p>
    <ol>
      <li>Valeur : \(g=4\pi^2\times0{,}600/1{,}5535^2=9{,}815\ \text{m·s}^{-2}\).</li>
      <li>Contributions relatives : \(u(L)/L=0{,}33\ \%\) ; \(2\,u(T)/T=0{,}49\ \%\) (le carré double l'incertitude relative de \(T\)).</li>
      <li>Total : \(u(g)/g=\sqrt{0{,}33^2+0{,}49^2}\ \%=0{,}59\ \%\), \(u(g)=0{,}058\ \text{m·s}^{-2}\).</li>
      <li>Les deux contributions sont comparables : améliorer une seule des deux mesures ne suffira pas.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) ajouter les incertitudes au lieu de leurs carrés (on surestime le résultat) ; (2) combiner des incertitudes absolues pour un produit, ce qui n'a même pas de sens quand les unités diffèrent ; (3) traiter \(T^2\) comme le produit de deux grandeurs indépendantes \(T\times T\), ce qui donne \(\sqrt2\,u(T)/T\) au lieu de \(2\,u(T)/T\) : les deux facteurs varient ensemble ; (4) appliquer ces règles à des grandeurs qui ne sont pas indépendantes, par exemple deux distances mesurées à partir de la même position de lentille (§6 traite ce cas).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SIMULATION DE MONTE-CARLO</div>
  <h2>Simuler la variabilité d'une grandeur composée</h2>
  <div class="intro">Quand la formule est compliquée, quand une même mesure intervient à plusieurs endroits, ou simplement pour vérifier un calcul, on simule l'expérience : on tire au hasard un très grand nombre de jeux de valeurs plausibles des grandeurs mesurées, on calcule la grandeur composée pour chacun, et l'on regarde comment ses valeurs se dispersent. C'est la méthode de Monte-Carlo, capacité numérique du programme.</div>
  <div class="method-box">
    <strong>Méthode — simulation de Monte-Carlo d'une grandeur composée</strong>
    <ol>
      <li>Pour chaque grandeur mesurée \(x_j\), choisir une loi qui décrit sa variabilité : loi normale de moyenne \(x_j\) et d'écart-type \(u(x_j)\) (type A, ou type B donné comme incertitude-type) ; loi uniforme sur \([x_j-a_j\,;\,x_j+a_j]\) (type B donné par une demi-largeur).</li>
      <li>Tirer \(N\) valeurs de chaque grandeur (\(N\) de l'ordre de \(10^4\) à \(10^5\)), indépendamment les unes des autres.</li>
      <li>Calculer la grandeur composée \(y\) pour chacun des \(N\) jeux de valeurs (avec numpy, en une seule ligne sur des tableaux).</li>
      <li>Prendre la moyenne des \(N\) valeurs de \(y\) comme résultat et leur écart-type comme incertitude-type \(u(y)\) ; tracer l'histogramme pour voir la forme de la distribution.</li>
    </ol>
  </div>
  <div class="def-box">
    <strong>Les fonctions utiles</strong> (leurs spécifications sont rappelées par les énoncés ; <code>import numpy as np</code> et <code>import matplotlib.pyplot as plt</code>) :
    <ul>
      <li><code>np.random.normal(m, s, N)</code> : tableau de \(N\) tirages d'une loi normale de moyenne <code>m</code> et d'écart-type <code>s</code> ; <code>m</code> et <code>s</code> peuvent être des tableaux (un tirage par case) si l'on omet <code>N</code>.</li>
      <li><code>np.random.uniform(a, b, N)</code> : \(N\) tirages d'une loi uniforme sur \([a\,;b]\).</li>
      <li><code>np.mean(x)</code> et <code>np.std(x, ddof=1)</code> : moyenne et écart-type expérimental d'un tableau.</li>
      <li><code>plt.hist(x, bins=60)</code> : histogramme des valeurs de <code>x</code> en 60 classes.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — distance focale d'une lentille par la relation de conjugaison</strong>
    <p>Sur le banc d'optique, l'objet est en \(x_A=0{,}0\ \text{cm}\) (à 1 mm près), la lentille en \(x_O=30{,}0\ \text{cm}\) (à 2 mm près) et l'image nette entre 88,6 et 91,4 cm. Avec \(\overline{OA}=x_A-x_O\) et \(\overline{OA'}=x_{A'}-x_O\), la relation de Descartes \(\dfrac{1}{\overline{OA'}}-\dfrac{1}{\overline{OA}}=\dfrac{1}{f'}\) donne \(f'=\dfrac{\overline{OA}\cdot\overline{OA'}}{\overline{OA}-\overline{OA'}}\).</p>
    <ol>
      <li>Valeurs centrales : \(\overline{OA}=-30{,}0\ \text{cm}\), \(\overline{OA'}=60{,}0\ \text{cm}\), \(f'=\dfrac{(-30{,}0)\times60{,}0}{-90{,}0}=20{,}0\ \text{cm}\).</li>
      <li>La position \(x_O\) intervient à la fois dans \(\overline{OA}\) et dans \(\overline{OA'}\) : ces deux distances ne sont pas indépendantes, et les règles du §5 ne s'appliquent pas directement. La simulation tire \(x_O\) une seule fois par jeu, et la corrélation est prise en compte sans y penser.</li>
      <li>Programme :</li>
    </ol>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt

N = 100000                <span class="cmt"># nombre de tirages simulés</span>

<span class="cmt"># positions sur le banc (cm), uniformes sur [x - a, x + a]</span>
xA = np.random.uniform(0.0 - 0.1, 0.0 + 0.1, N)     <span class="cmt"># objet</span>
xO = np.random.uniform(30.0 - 0.2, 30.0 + 0.2, N)   <span class="cmt"># lentille</span>
<span class="cmt"># image nette de 88,6 cm à 91,4 cm</span>
xAp = np.random.uniform(90.0 - 1.4, 90.0 + 1.4, N)

OA, OAp = xA - xO, xAp - xO
<span class="cmt"># conjugaison de Descartes : 1/OA' - 1/OA = 1/f'</span>
f = OA * OAp / (OA - OAp)

print(np.mean(f), np.std(f, ddof=1))   <span class="cmt"># environ 20.00  0.10</span>

plt.hist(f, bins=60)
plt.xlabel(<span class="str">"f' (cm)"</span>)
plt.ylabel(<span class="str">"nombre de tirages"</span>)
plt.show()</pre>
    <ol start="4">
      <li>Résultat : \(f'=20{,}00\ \text{cm}\) et \(u(f')=0{,}10\ \text{cm}\), soit 0,5 % (d'une exécution à l'autre, le troisième chiffre de l'écart-type bouge à peine : \(10^5\) tirages suffisent largement).</li>
      <li>Contributions : en relançant le programme avec une seule source d'incertitude à la fois (les deux autres demi-largeurs mises à 0), on trouve 0,090 cm pour l'image, 0,038 cm pour la lentille et 0,026 cm pour l'objet. L'image domine, mais beaucoup moins que ne le suggérait son incertitude de 0,81 cm : dans cette configuration, \(f'\) dépend peu de \(x_{A'}\) (une variation de 1 cm de \(\overline{OA'}\) ne change \(f'\) que de 1/9 cm).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · ÉCRIRE LE RÉSULTAT D'UNE MESURE</div>
  <h2>Valeur, incertitude-type, unité : le bon nombre de chiffres</h2>
  <div class="intro">Un résultat écrit avec dix chiffres laisse croire à une précision qu'il n'a pas ; arrondi trop tôt, il perd de l'information. Les chiffres significatifs d'un résultat sont dictés par son incertitude-type.</div>
  <div class="prop-box">
    <strong>Règles d'écriture.</strong>
    <ol>
      <li>Garder tous les chiffres pendant les calculs ; n'arrondir qu'à la fin.</li>
      <li>Arrondir l'incertitude-type à un ou deux chiffres significatifs (deux sont préférables quand le premier est 1 ou 2 : arrondir 0,14 à 0,1 la change de près de 30 %).</li>
      <li>Arrondir la valeur à la même position décimale que le dernier chiffre conservé de l'incertitude-type.</li>
      <li>Écrire l'unité, utiliser une puissance de dix commune si besoin, et préciser la nature de l'incertitude : « \(g=9{,}81\ \text{m·s}^{-2}\) ; \(u(g)=0{,}06\ \text{m·s}^{-2}\) », ou « \(g=(9{,}81\pm0{,}06)\ \text{m·s}^{-2}\), incertitude-type ». L'incertitude relative (0,6 %) se donne souvent en plus.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — mettre en forme des résultats bruts</strong>
    <ol>
      <li>\(g=9{,}8150\ \text{m·s}^{-2}\) et \(u(g)=0{,}0579\ \text{m·s}^{-2}\) → \(u(g)=0{,}06\ \text{m·s}^{-2}\) et \(g=9{,}81\ \text{m·s}^{-2}\) ; ou, avec deux chiffres, \(g=9{,}815\ \text{m·s}^{-2}\), \(u(g)=0{,}058\ \text{m·s}^{-2}\).</li>
      <li>\(R=470{,}72\ \Omega\), \(u(R)=3{,}80\ \Omega\) → \(R=470{,}7\ \Omega\), \(u(R)=3{,}8\ \Omega\).</li>
      <li>\(c=0{,}0123456\ \text{mol·L}^{-1}\), \(u(c)=0{,}000278\ \text{mol·L}^{-1}\) → \(c=(1{,}235\pm0{,}028)\times10^{-2}\ \text{mol·L}^{-1}\) (incertitude-type), soit 2,3 %.</li>
      <li>\(f=1\,523{,}7\ \text{Hz}\), \(u(f)=12{,}3\ \text{Hz}\) → \(f=1\,524\ \text{Hz}\), \(u(f)=12\ \text{Hz}\) ; écrire « 1 520 Hz » serait ambigu (le zéro est-il significatif ?), \(f=1{,}524\times10^{3}\ \text{Hz}\) ne l'est pas.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : (1) « \(\lambda=632{,}8\pm0{,}03\ \text{nm}\) » : la valeur et l'incertitude ne s'arrêtent pas à la même décimale ; (2) une incertitude à quatre chiffres significatifs (« \(u=0{,}05793\) ») : l'incertitude-type est elle-même connue à 10 ou 20 % près, ses derniers chiffres n'ont aucun sens ; (3) « \(u=0\) » parce que l'affichage ne varie pas : une incertitude n'est jamais nulle (§3) ; (4) arrondir \(T\) à 1,55 s avant de calculer \(T^2\), ce qui décale \(g\) de 0,5 %, autant que son incertitude.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · COMPARER DEUX VALEURS : L'ÉCART NORMALISÉ</div>
  <h2>Un critère quantitatif de compatibilité</h2>
  <div class="intro">« Ma valeur est proche de la valeur attendue » ne veut rien dire tant qu'on ne compare pas l'écart aux incertitudes. L'écart normalisé fait cette comparaison en un nombre ; c'est l'outil du programme pour juger un résultat avec esprit critique.</div>
  <div class="def-box">
    <strong>Écart normalisé.</strong> Pour deux valeurs \(x_1\) et \(x_2\) d'une même grandeur, d'incertitudes-types \(u(x_1)\) et \(u(x_2)\), obtenues indépendamment :
    <div class="formula" data-nom="Écart normalisé">$$E_N=\frac{|x_1-x_2|}{\sqrt{u(x_1)^2+u(x_2)^2}}$$</div>
    Pour une valeur de référence dont l'incertitude est négligeable, \(E_N=|x-x_{\text{ref}}|/u(x)\). On rencontre aussi le nom anglais « z-score ».
  </div>
  <div class="prop-box">
    <strong>Critère usuel.</strong> Si les deux valeurs portent sur la même grandeur et si les incertitudes sont bien évaluées, la différence \(x_1-x_2\) a pour incertitude-type \(\sqrt{u(x_1)^2+u(x_2)^2}\) (somme, §5) : un écart supérieur à deux fois cette quantité n'arrive que dans environ 5 % des cas. On convient donc que les deux valeurs sont <strong>compatibles si \(E_N\leqslant2\)</strong>, et qu'un écart \(E_N>2\) signale une incompatibilité dont il faut chercher la cause. Le seuil 2 est une convention ; certains énoncés en fixent un autre.
  </div>

  <div class="method-box">
    <strong>Exemple — célérité du son</strong>
    <p>Un binôme mesure \(c=345{,}0\ \text{m·s}^{-1}\) avec \(u(c)=1{,}5\ \text{m·s}^{-1}\), dans une salle à 25 °C. La célérité du son dans l'air sec vaut \(c(\theta)=331{,}3\sqrt{1+\theta/273{,}15}\ \text{m·s}^{-1}\) (\(\theta\) en °C), soit 346,1 m/s à 25 °C.</p>
    <ol>
      <li>Incertitude de la référence négligeable : \(E_N=|345{,}0-346{,}1|/1{,}5=0{,}7\leqslant2\) : compatible.</li>
      <li>Un autre binôme trouve \(352{,}5\pm2{,}0\ \text{m·s}^{-1}\) (incertitude-type) : \(E_N=6{,}4/2{,}0=3{,}2\gt2\) : incompatible ; une cause est à chercher (erreur sur la distance, sur le nombre de longueurs d'onde comptées, sur la fréquence).</li>
      <li>Si le premier binôme avait comparé sa valeur à « 340 m/s », la valeur à 15 °C, il aurait trouvé \(E_N=3{,}3\) et conclu à tort à une incompatibilité : la référence doit correspondre aux conditions de l'expérience.</li>
    </ol>
  </div>
  <h3>Analyser une incompatibilité</h3>
  <p>Un écart normalisé supérieur à 2 n'est pas une note : c'est une information. Le programme demande d'en analyser les causes, à passer en revue dans cet ordre, en estimant chaque fois l'ordre de grandeur de l'effet :</p>
  <ol>
    <li><strong>Une faute</strong> : calcul, unité, conversion, nombre de périodes ou de franges mal compté.</li>
    <li><strong>Une incertitude sous-évaluée</strong> : source oubliée dans le bilan (seulement le type A du chronométrage, et pas la longueur ; seulement la résolution, et pas la notice).</li>
    <li><strong>Une erreur systématique</strong> : zéro ou étalonnage d'un appareil, résistance d'entrée d'un voltmètre, d'un ampèremètre, temps de réaction toujours dans le même sens.</li>
    <li><strong>Un modèle inadapté</strong> : le modèle qui relie la mesure à la grandeur cherchée néglige un effet qui n'est pas négligeable à la précision atteinte (amplitude d'un pendule, frottements, résistance des fils, non-linéarité d'un capteur).</li>
    <li><strong>Une référence inadaptée</strong> : valeur tabulée pour d'autres conditions (température, pression, concentration, longueur d'onde).</li>
  </ol>
  <p>Inversement, des écarts normalisés tous très inférieurs à 1 sur de nombreuses mesures indiquent des incertitudes surestimées.</p>
  <div class="notice"><strong>Erreur classique</strong> : conclure « la mesure est juste » parce que l'écart relatif est petit (« seulement 1 % d'écart »). Un écart de 1 % est énorme si l'incertitude est de 0,1 %, et insignifiant si elle est de 5 %. Autre erreur : élargir après coup les incertitudes pour « rendre » la mesure compatible.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · RÉGRESSION LINÉAIRE</div>
  <h2>Ajuster un modèle affine et le valider</h2>
  <div class="intro">Pour tester une loi physique et mesurer ses paramètres, on fait varier une grandeur \(x\), on mesure \(y\), et l'on cherche si les points \((x_i,y_i)\) s'alignent sur une droite \(y=ax+b\). Le logiciel donne toujours une droite ; la vraie question est de savoir si le modèle est compatible avec les mesures et leurs incertitudes.</div>
  <h3>Se ramener à une droite</h3>
  <p>Beaucoup de lois deviennent affines après un changement de variables bien choisi : \(T^2=\dfrac{4\pi^2}{g}\,L\) pour le pendule simple (on porte \(T^2\) en fonction de \(L\)) ; \(\dfrac{1}{\overline{OA'}}=\dfrac{1}{\overline{OA}}+\dfrac{1}{f'}\) en focométrie ; \(A=k\,c\) (loi de Beer-Lambert) ; \(U=E-rI\) pour un générateur ; \(\ln\left(c/c_0\right)=-kt\) pour une cinétique d'ordre 1. Les paramètres physiques se lisent alors sur la pente \(a\) et l'ordonnée à l'origine \(b\).</p>
  <h3>Obtenir les paramètres</h3>
  <p>La régression linéaire (méthode des moindres carrés) choisit \(a\) et \(b\) qui rendent minimale la somme des carrés des écarts verticaux \(\sum_i\left(y_i-ax_i-b\right)^2\). En Python, <code>a, b = np.polyfit(x, y, 1)</code> renvoie la pente et l'ordonnée à l'origine (le 1 est le degré du polynôme ajusté).</p>
  <h3>Valider le modèle</h3>
  <div class="def-box">
    <strong>Résidus et écarts normalisés.</strong> Le résidu du point \(i\) est \(r_i=y_i-(ax_i+b)\). Son écart normalisé est
    <div class="formula" data-nom="Écart d'un point à la droite">$$z_i=\frac{y_i-(ax_i+b)}{u(y_i)}$$</div>
    Si \(x_i\) a aussi une incertitude, on remplace \(u(y_i)\) par \(\sqrt{u(y_i)^2+a^2u(x_i)^2}\) : une erreur \(u(x_i)\) sur l'abscisse déplace le point, vu de la droite, de \(a\,u(x_i)\) verticalement.
  </div>
  <div class="prop-box">
    <strong>Procédure de validation.</strong> Le modèle affine est compatible avec les mesures si :
    <ul>
      <li>graphiquement, la droite passe par la quasi-totalité des barres d'incertitude \(\pm2u(y_i)\) (environ 95 %) — tracer les résidus avec leurs barres, autour de zéro, rend ce test bien plus lisible que le graphe lui-même ;</li>
      <li>ou, de façon équivalente, presque tous les écarts normalisés vérifient \(|z_i|\leqslant2\) ;</li>
      <li>et les résidus se répartissent au hasard de part et d'autre de zéro, sans structure (pas d'arche, pas de tendance) : une structure trahit un modèle inadapté, même si les écarts restent petits.</li>
    </ul>
    Le coefficient de détermination \(R^2\) n'est <strong>pas</strong> un critère de validation : il peut valoir 0,99 pour un modèle faux.
  </div>
  <div class="method-box">
    <strong>Exemple — mesurer \(g\) avec un pendule de longueur variable</strong>
    <p>Pour huit longueurs \(L\) de 0,30 à 1,00 m, on chronomètre vingt périodes, avec \(u(20T)=0{,}10\ \text{s}\), donc \(u(T)=0{,}005\ \text{s}\). Mesures de \(20T\) (en s) : 21,90 ; 25,24 ; 28,34 ; 31,12 ; 33,68 ; 35,90 ; 38,00 ; 40,04.</p>
    <ol>
      <li>Modèle : \(T^2=aL+b\) avec \(a=4\pi^2/g\) et \(b=0\) attendu. Incertitude sur l'ordonnée (puissance, §5) : \(u(T^2)=2T\,u(T)\), de 0,011 à 0,020 s².</li>
      <li>Régression : \(a=4{,}025\ \text{s}^2\cdot\text{m}^{-1}\), \(b=-0{,}004\ \text{s}^2\).</li>
      <li>Validation : les écarts normalisés valent −0,40 ; −1,05 ; −0,03 ; 0,66 ; 1,34 ; 0,35 ; −0,43 ; −0,63 : tous dans \([-2\,;2]\), de signes mêlés. Le modèle est validé.</li>
      <li>Paramètre physique : \(g=4\pi^2/a=9{,}81\ \text{m·s}^{-2}\). Son incertitude se déduit de celle de \(a\), obtenue au §10.</li>
    </ol>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt

L = np.array([0.30, 0.40, 0.50, 0.60,
              0.70, 0.80, 0.90, 1.00])          <span class="cmt"># m</span>
vingtT = np.array([21.90, 25.24, 28.34, 31.12,
                   33.68, 35.90, 38.00, 40.04])  <span class="cmt"># s</span>
T = vingtT / 20
uT = 0.10 / 20          <span class="cmt"># u(20T) = 0,10 s</span>

y = T**2                <span class="cmt"># grandeur portée en ordonnée</span>
uy = 2 * T * uT         <span class="cmt"># u(T²) = 2T u(T)</span>
a, b = np.polyfit(L, y, 1)          <span class="cmt"># y = a L + b</span>
print(a, b)                         <span class="cmt"># 4.025  -0.004</span>

<span class="cmt"># écarts normalisés des points à la droite</span>
z = (y - (a * L + b)) / uy
print(np.round(z, 2))   <span class="cmt"># tous entre -2 et 2, signes mêlés</span>

<span class="cmt"># points, barres d'incertitude (± 2u) et droite</span>
plt.errorbar(L, y, yerr=2 * uy, fmt=<span class="str">'o'</span>)
plt.plot(L, a * L + b)
plt.xlabel(<span class="str">"L (m)"</span>)
plt.ylabel(<span class="str">"T² (s²)"</span>)
plt.show()</pre>
  </div>

  <div class="notice"><strong>Le piège du R²</strong> : traçons les mêmes mesures en portant \(T\) (et non \(T^2\)) en fonction de \(L\), et ajustons une droite. On obtient \(R^2=0{,}991\), un nombre qui semble excellent. Pourtant les écarts normalisés vont de −8,8 à +6,3 et dessinent une arche : la relation entre \(T\) et \(L\) n'est pas affine (\(T\) varie comme \(\sqrt L\)). Un \(R^2\) proche de 1 dit seulement que \(y\) croît avec \(x\) de façon régulière ; il ne tient aucun compte des incertitudes. Seuls les résidus confrontés aux incertitudes valident ou rejettent un modèle.</div>
  <div class="notice"><strong>Erreur classique</strong> : retirer un point « qui ne va pas » pour améliorer l'ajustement. Un point aberrant se refait, ou se garde en le signalant ; on ne l'écarte que si l'on a identifié une cause (faute de lecture, montage modifié). Restreindre le domaine d'étude, en revanche, est légitime quand le modèle n'est valable que sur une partie (saturation d'un capteur, grande amplitude) : il faut alors le dire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · INCERTITUDE SUR LES PARAMÈTRES PAR MONTE-CARLO</div>
  <h2>Faire varier les mesures pour faire varier la droite</h2>
  <div class="intro">La régression donne \(a\) et \(b\), mais pas leurs incertitudes-types. Le programme demande de les obtenir par simulation : on fabrique un grand nombre de jeux de mesures plausibles, on ajuste une droite sur chacun, et la dispersion des pentes et des ordonnées à l'origine obtenues donne \(u(a)\) et \(u(b)\).</div>
  <div class="method-box">
    <strong>Méthode — incertitude sur les paramètres d'une régression par Monte-Carlo</strong>
    <ol>
      <li>Repérer la grandeur dont la variabilité domine (souvent celle portée en ordonnée) et l'incertitude-type de chaque point.</li>
      <li>Répéter \(N_{\text{sim}}\) fois (quelques milliers suffisent) : tirer un nouveau jeu de valeurs, chaque point selon une loi normale centrée sur la valeur mesurée et d'écart-type son incertitude-type ; ajuster une droite avec <code>polyfit</code> ; ranger la pente et l'ordonnée à l'origine.</li>
      <li>L'écart-type des pentes est \(u(a)\), celui des ordonnées à l'origine \(u(b)\). Un paramètre physique calculé à partir de \(a\) ou \(b\) se calcule pour chaque tirage : son écart-type est son incertitude-type.</li>
    </ol>
  </div>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

L = np.array([0.30, 0.40, 0.50, 0.60,
              0.70, 0.80, 0.90, 1.00])
T = np.array([21.90, 25.24, 28.34, 31.12,
              33.68, 35.90, 38.00, 40.04]) / 20
uT = 0.005

Nsim = 10000
pentes = np.zeros(Nsim)
ordos = np.zeros(Nsim)
<span class="kw">for</span> k <span class="kw">in</span> range(Nsim):
    <span class="cmt"># un nouveau jeu de périodes plausibles</span>
    Tsim = np.random.normal(T, uT)
    pentes[k], ordos[k] = np.polyfit(L, Tsim**2, 1)

a, ua = np.mean(pentes), np.std(pentes, ddof=1)
b, ub = np.mean(ordos), np.std(ordos, ddof=1)
print(a, ua, b, ub)   <span class="cmt"># environ 4.025  0.025  -0.004  0.015</span>

g = 4 * np.pi**2 / pentes      <span class="cmt"># une valeur de g par tirage</span>
print(np.mean(g), np.std(g, ddof=1))   <span class="cmt"># environ 9.81  0.06</span></pre>
  <div class="method-box">
    <strong>Exemple — fin de l'étude du pendule</strong>
    <ol>
      <li>Le programme ci-dessus donne \(a=4{,}025\ \text{s}^2\cdot\text{m}^{-1}\) et \(u(a)=0{,}025\ \text{s}^2\cdot\text{m}^{-1}\) (0,6 %), \(b=-0{,}004\ \text{s}^2\) et \(u(b)=0{,}015\ \text{s}^2\).</li>
      <li>Ordonnée à l'origine : \(|b|/u(b)=0{,}3\leqslant2\) : \(b\) est compatible avec 0, comme le prévoit le modèle du pendule simple.</li>
      <li>Accélération de la pesanteur : la simulation calcule \(g=4\pi^2/a\) pour chaque tirage et donne \(g=9{,}81\ \text{m·s}^{-2}\) avec \(u(g)=0{,}06\ \text{m·s}^{-2}\) (0,6 %, comme \(a\) : quotient d'une constante par \(a\)).</li>
      <li>Comparaison à la valeur locale \(g_{\text{ref}}=9{,}81\ \text{m·s}^{-2}\) : \(E_N\approx0\). Faire varier aussi les longueurs (\(u(L)=1\ \text{mm}\)) ne change \(u(g)\) que de 0,061 à 0,062 m·s⁻² : la variabilité des périodes domine, et le programme permet de ne simuler qu'elle.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§11 · ORDRES DE GRANDEUR ET BONNES PRATIQUES</div>
  <h2>Au laboratoire : ce qui limite vraiment la précision</h2>
  <div class="intro">Connaître les incertitudes typiques des instruments permet de concevoir un protocole, de repérer d'avance la contribution dominante, et de juger un résultat à l'oral sans calculatrice.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin:.6rem 0">
    <tr><th style="text-align:left">Instrument ou situation</th><th style="text-align:left">Ordre de grandeur de l'incertitude-type</th></tr>
    <tr><td>Règle graduée au mm, une lecture</td><td>0,3 mm (\(1/\sqrt{12}\) mm) ; pour une longueur, deux lectures : 0,4 mm</td></tr>
    <tr><td>Pied à coulisse au 1/50 mm ; palmer au 1/100 mm</td><td>0,006 mm ; 0,003 mm (hors écrasement de l'objet)</td></tr>
    <tr><td>Banc d'optique : latitude de mise au point</td><td>quelques mm à 1 cm : domine presque toujours la graduation</td></tr>
    <tr><td>Chronomètre à la main</td><td>0,1 s par chronométrage (temps de réaction), quelle que soit la durée</td></tr>
    <tr><td>Fourche optique, carte d'acquisition, oscilloscope</td><td>de la microseconde à la milliseconde ; base de temps à 0,01 % près</td></tr>
    <tr><td>Multimètre de TP</td><td>0,1 % à 1 % en continu (selon la notice), davantage en alternatif</td></tr>
    <tr><td>Oscilloscope, mesure d'une tension</td><td>2 à 3 % de la pleine échelle</td></tr>
    <tr><td>Pipette jaugée 20 mL classe A ; burette 25 mL classe A</td><td>0,017 mL ; 0,017 mL de tolérance, plus la lecture et la goutte à l'équivalence</td></tr>
    <tr><td>Balance de laboratoire</td><td>0,01 g ou 0,001 g selon le modèle</td></tr>
    <tr><td>Thermomètre électronique de TP</td><td>0,1 à 0,5 °C</td></tr>
  </table></div>
  <h3>Bonnes pratiques</h3>
  <ul>
    <li><strong>Mesurer une grande grandeur plutôt qu'une petite</strong> : chronométrer 20 périodes plutôt qu'une, compter 10 longueurs d'onde plutôt qu'une, mesurer l'épaisseur de 100 feuilles. L'incertitude de lecture reste la même, et elle est divisée par le nombre d'objets.</li>
    <li><strong>Faire le bilan d'incertitude avant de répéter</strong> : améliorer une contribution qui n'est pas la principale ne sert à rien (§5).</li>
    <li><strong>Refaire vraiment les mesures</strong> pour une évaluation de type A : relâcher le pendule, refaire la mise au point, reprendre la lecture depuis le début.</li>
    <li><strong>Noter les valeurs brutes</strong> avec leur unité, leurs conditions (calibre, température) et ce qui limite la lecture ; tracer les points au fur et à mesure pour repérer tout de suite une valeur aberrante.</li>
    <li><strong>Penser à la méthode</strong> : appareil qui perturbe le montage, effet négligé par le modèle, référence prise dans d'autres conditions (§8).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — combien de périodes chronométrer ?</strong>
    <p>On veut la période d'un pendule (\(T\approx2\ \text{s}\)) à 0,1 % près avec un chronomètre manuel (0,1 s par chronométrage).</p>
    <ol>
      <li>En chronométrant \(n\) périodes une fois : \(u(T)=0{,}1/n\ \text{s}\). Il faut \(0{,}1/n\leqslant0{,}001\times2\), soit \(n\geqslant50\) périodes, à condition que l'amortissement le permette.</li>
      <li>En chronométrant une seule période 50 fois : \(u(T)=0{,}1/\sqrt{50}=0{,}014\ \text{s}\), soit 0,7 % : sept fois moins bien (\(\sqrt{50}\approx7\)) pour le même nombre de déclenchements.</li>
      <li>Conclusion : allonger la durée mesurée est bien plus efficace que répéter une mesure courte, parce que l'incertitude de déclenchement ne dépend pas de la durée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que l'appareil le plus précis donne le meilleur résultat. Mesurer au palmer l'épaisseur d'une seule feuille de papier (0,10 mm à 0,003 mm près) semble précis, mais l'écrasement de la feuille et sa variabilité d'un point à l'autre dominent ; mesurer à la règle une rame de 500 feuilles donne souvent mieux. Le bon protocole est celui qui réduit la contribution dominante.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Propagation générale, Student, moindres carrés</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI ni en PT. Ils expliquent d'où viennent les règles du chapitre et ce que calculent les logiciels.</div>
  <h3>Formule générale de propagation</h3>
  <p>Si \(y=f(x_1,\dots,x_n)\) avec des grandeurs indépendantes et des incertitudes petites, un développement au premier ordre donne</p>
  <div class="formula">$$u(y)^2=\sum_{j=1}^{n}\left(\frac{\partial f}{\partial x_j}\right)^2u(x_j)^2$$</div>
  <p>Les règles de la somme, du produit et de la puissance en sont des cas particuliers. Pour la focométrie du §6, avec \(f'\) écrit en fonction de \(x_A\), \(x_O\) et \(x_{A'}\), les dérivées valent \(-4/9\), \(1/3\) et \(1/9\) ; multipliées par les incertitudes-types (0,058 ; 0,115 ; 0,81 cm), elles redonnent 0,026, 0,038 et 0,090 cm, et \(u(f')=0{,}10\ \text{cm}\), comme la simulation. Si les grandeurs sont corrélées, des termes de covariance s'ajoutent ; la simulation de Monte-Carlo les inclut d'elle-même, d'où son intérêt.</p>
  <h3>Petit nombre de mesures : le facteur de Student</h3>
  <p>Avec \(N\) mesures, l'intervalle à 95 % autour d'une moyenne est \(\bar x\pm t\,s_x/\sqrt N\), où le coefficient \(t\) de Student dépend de \(N\) : environ 2,4 pour \(N=8\), 2,1 pour \(N=20\), 2,0 pour \(N\) grand. Avec les huit mesures du §2, l'intervalle à 95 % est donc \(\pm2{,}4\,u\) plutôt que \(\pm2u\).</p>
  <h3>Formules des moindres carrés</h3>
  <p>La droite des moindres carrés a pour pente et ordonnée à l'origine</p>
  <div class="formula">$$a=\frac{\sum_i\left(x_i-\bar x\right)\left(y_i-\bar y\right)}{\sum_i\left(x_i-\bar x\right)^2},\qquad b=\bar y-a\,\bar x$$</div>
  <p>Quand les points n'ont pas tous la même incertitude, une régression <em>pondérée</em> (poids \(1/u(y_i)^2\)) est plus juste, et la somme \(\chi^2=\sum_iz_i^2\), comparée au nombre de points, résume la qualité de l'ajustement. Pour le pendule du §9, \(\chi^2\approx4{,}2\) pour huit points et deux paramètres : un très bon accord.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · MESURES ET INCERTITUDES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les capacités exigibles de la partie « Mesures et incertitudes » du programme : repérer les sources d'incertitude d'un protocole, évaluer une incertitude-type de type A ou B, lui associer un intervalle de confiance, composer des incertitudes et repérer la contribution dominante, simuler une grandeur composée, écrire un résultat, comparer deux valeurs par l'écart normalisé, valider une régression linéaire et estimer l'incertitude sur ses paramètres. Elles servent à chaque compte rendu de TP et à l'oral.</div>

  <div class="method-box"><strong>Méthode 1 — Identifier les sources d'incertitude d'un protocole</strong>
    <ol>
      <li><span class="step">Définir le mesurande.</span> Écrire précisément la grandeur cherchée et les conditions (amplitude, température, calibre).</li>
      <li><span class="step">Passer en revue les quatre familles.</span> Opérateur (réaction, netteté, parallaxe, repérage), environnement (température, vibrations, lumière), instruments (graduation, notice, résolution), méthode (modèle simplifié, perturbation par l'appareil).</li>
      <li><span class="step">Chiffrer chaque source.</span> Une incertitude-type par source, même grossière (§2, §3 du cours).</li>
      <li><span class="step">Repérer la contribution dominante.</span> C'est elle qui fixe l'incertitude finale et qu'il faut réduire en premier ; une source trois fois plus faible que la principale est négligeable.</li>
    </ol>
    <p><em>Exemple éclair :</em> position d'une image sur un banc d'optique. Latitude de netteté \(\pm3\ \text{mm}\) (opérateur) : \(u=1{,}7\ \text{mm}\) ; centre de la lentille dans sa monture à \(\pm2\ \text{mm}\) (méthode) : \(u=1{,}2\ \text{mm}\) ; graduation au millimètre (instrument) : \(u=0{,}3\ \text{mm}\). Total \(\sqrt{1{,}7^2+1{,}2^2+0{,}3^2}=2{,}1\ \text{mm}\) : la graduation ne compte pas, la netteté domine.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : citer « l'erreur humaine » sans plus de précision. À l'oral, on attend une source précise (temps de réaction au déclenchement, appréciation de la netteté) et son ordre de grandeur.</div>

  <div class="method-box"><strong>Méthode 2 — Évaluer une incertitude-type de type A</strong>
    <ol>
      <li><span class="step">Vérifier l'indépendance.</span> Chaque mesure doit être refaite en entier (relâcher, remettre au point, redéclencher).</li>
      <li><span class="step">Calculer la moyenne.</span> \(\bar x=\frac1N\sum x_i\).</li>
      <li><span class="step">Calculer l'écart-type expérimental.</span> \(s_x=\sqrt{\frac{1}{N-1}\sum(x_i-\bar x)^2}\) ; avec numpy, <code>np.std(x, ddof=1)</code>.</li>
      <li><span class="step">Choisir la bonne incertitude.</span> Pour le résultat \(\bar x\) : \(u(\bar x)=s_x/\sqrt N\). Pour une mesure isolée faite avec le même protocole : \(u=s_x\).</li>
    </ol>
    <p><em>Exemple éclair :</em> cinq durées de chute mesurées à la fourche optique : 451,2 ; 452,0 ; 450,7 ; 451,6 ; 451,9 ms. Moyenne 451,48 ms, \(s=0{,}54\ \text{ms}\), \(u(\bar t)=0{,}54/\sqrt5=0{,}24\ \text{ms}\) : \(\bar t=451{,}48\ \text{ms}\), \(u=0{,}24\ \text{ms}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Évaluer une incertitude-type de type B</strong>
    <ol>
      <li><span class="step">Trouver la demi-largeur \(a\).</span> Graduation de pas \(\Delta\) lue au trait le plus proche : \(a=\Delta/2\) ; notice « \(\pm(p\ \%+n\) digits) » : \(a=p\ \%\times|x|+n\times\)(valeur d'un digit) ; tolérance de verrerie « \(\pm t\) » : \(a=t\) ; plage de netteté ou de réglage \([x_{\min}\,;x_{\max}]\) : \(a=(x_{\max}-x_{\min})/2\).</li>
      <li><span class="step">Diviser par \(\sqrt3\).</span> \(u=a/\sqrt3\) (loi uniforme sur l'intervalle).</li>
      <li><span class="step">Additionner les causes indépendantes.</span> Deux lectures, une tolérance et une goutte se combinent en quadrature (méthode 5).</li>
    </ol>
    <p><em>Exemple éclair :</em> un thermomètre gradué tous les 0,5 °C donne \(u=0{,}25/\sqrt3=0{,}14\ \text{°C}\). Un ohmmètre affiche 1,002 kΩ (dernier chiffre : 1 Ω), précision \(\pm(0{,}8\ \%+3\) digits) : \(a=0{,}008\times1\,002+3=11\ \Omega\), \(u=6{,}4\ \Omega\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier la division par \(\sqrt3\), ou se contenter de la résolution de l'affichage alors que la notice donne une tolérance bien plus large.</div>

  <div class="method-box"><strong>Méthode 4 — Associer un intervalle de confiance à une incertitude-type</strong>
    <ol>
      <li><span class="step">Justifier la loi normale.</span> Moyenne de plusieurs mesures, ou grandeur composée de plusieurs contributions comparables.</li>
      <li><span class="step">Choisir le niveau.</span> \([x-u\,;x+u]\) : environ 68 % ; \([x-2u\,;x+2u]\) : environ 95 % ; \([x-3u\,;x+3u]\) : 99,7 %.</li>
      <li><span class="step">Rédiger.</span> « La valeur du mesurande est dans [… ; …] avec un niveau de confiance d'environ 95 % », en précisant qu'on a pris \(k=2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(m=2{,}357\ \text{g}\), \(u(m)=0{,}004\ \text{g}\) : intervalle à 95 % \([2{,}349\,;2{,}365]\ \text{g}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Composer des incertitudes et comparer les contributions</strong>
    <ol>
      <li><span class="step">Écrire la grandeur cherchée.</span> En fonction des grandeurs mesurées, vérifier qu'elles sont indépendantes.</li>
      <li><span class="step">Somme ou différence.</span> \(u(y)=\sqrt{u(x_1)^2+u(x_2)^2}\) (incertitudes absolues).</li>
      <li><span class="step">Produit ou quotient.</span> \(u(y)/|y|=\sqrt{(u(x_1)/x_1)^2+(u(x_2)/x_2)^2}\) (incertitudes relatives) ; pour une puissance \(x^n\) donnée par l'énoncé, \(|n|\,u(x)/|x|\).</li>
      <li><span class="step">Bilan.</span> Écrire chaque contribution, repérer la plus grande, et dire laquelle améliorer.</li>
    </ol>
    <p><em>Exemple éclair :</em> masse volumique d'un cylindre métallique, \(\rho=m/V\). Balance : \(m=25{,}34\ \text{g}\), \(u(m)=0{,}006\ \text{g}\) (0,02 %). Éprouvette graduée tous les 0,1 mL, volume par différence de deux lectures : \(V=9{,}40\ \text{mL}\), \(u(V)=\sqrt2\times0{,}05/\sqrt3=0{,}041\ \text{mL}\) (0,43 %). \(\rho=2{,}696\ \text{g·mL}^{-1}\), \(u(\rho)/\rho=0{,}43\ \%\), \(u(\rho)=0{,}012\ \text{g·mL}^{-1}\) : le volume fait tout, une meilleure balance ne servirait à rien.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer la règle du produit à \(x\times x\) (on trouve \(\sqrt2\) au lieu de 2), ou à deux grandeurs qui partagent une même mesure : simuler plutôt (méthode 6).</div>

  <div class="method-box"><strong>Méthode 6 — Simuler une grandeur composée par la méthode de Monte-Carlo</strong>
    <ol>
      <li><span class="step">Une loi par grandeur mesurée.</span> <code>np.random.normal(x, u, N)</code> pour une incertitude-type, <code>np.random.uniform(x - a, x + a, N)</code> pour une demi-largeur.</li>
      <li><span class="step">Calculer \(y\) sur les tableaux.</span> Une seule ligne de numpy ; chaque grandeur n'est tirée qu'une fois, même si elle intervient plusieurs fois dans la formule.</li>
      <li><span class="step">Résultat.</span> <code>np.mean(y)</code> et <code>np.std(y, ddof=1)</code> ; <code>plt.hist(y, bins=60)</code> pour voir la distribution.</li>
      <li><span class="step">Contributions.</span> Relancer avec une seule source à la fois pour faire le bilan.</li>
    </ol>
    <p><em>Exemple éclair :</em> indice d'un verre par la loi de Descartes, \(n=\sin i/\sin r\), avec \(i=40{,}0°\) et \(r=25{,}0°\) lus chacun à \(\pm0{,}5°\) près. Valeur \(n=1{,}521\) ; la simulation (tirages uniformes, angles convertis en radians avec <code>np.radians</code>) donne \(u(n)=0{,}019\), soit 1,2 %.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Écrire le résultat d'une mesure</strong>
    <ol>
      <li><span class="step">Calculer sans arrondir.</span> Garder tous les chiffres jusqu'au bout.</li>
      <li><span class="step">Arrondir l'incertitude-type.</span> À un ou deux chiffres significatifs (deux si elle commence par 1 ou 2).</li>
      <li><span class="step">Arrondir la valeur au même rang.</span> Puis écrire l'unité et la nature de l'incertitude.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(P=1{,}23456\ \text{W}\) et \(u(P)=0{,}0368\ \text{W}\) → \(P=1{,}235\ \text{W}\), \(u(P)=0{,}037\ \text{W}\) (ou \(1{,}23\) et \(0{,}04\ \text{W}\)) ; incertitude relative 3 %.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Comparer deux valeurs et analyser une incompatibilité</strong>
    <ol>
      <li><span class="step">Calculer l'écart normalisé.</span> \(E_N=|x_1-x_2|/\sqrt{u(x_1)^2+u(x_2)^2}\) (si la référence est tabulée sans incertitude : \(|x-x_{\text{ref}}|/u(x)\)).</li>
      <li><span class="step">Conclure.</span> \(E_N\leqslant2\) : compatibles ; \(E_N\gt2\) : incompatibles.</li>
      <li><span class="step">En cas d'incompatibilité, chercher la cause.</span> Dans l'ordre : faute de calcul ou d'unité ; source d'incertitude oubliée ; erreur systématique (étalonnage, appareil qui perturbe) ; modèle inadapté ; référence prise dans d'autres conditions. Estimer chaque fois l'ordre de grandeur de l'effet et vérifier qu'il explique l'écart.</li>
    </ol>
    <p><em>Exemple éclair :</em> une capacité mesurée par la constante de temps d'un circuit RC alimenté par un générateur, avec \(R=1{,}20\ \text{k}\Omega\), donne \(C=\tau/R=102{,}0\ \text{nF}\) (\(u=1{,}3\ \text{nF}\)) ; par la fréquence de résonance d'un circuit RLC, \(98{,}2\ \text{nF}\) (\(u=1{,}1\ \text{nF}\)). \(E_N=3{,}8/1{,}7=2{,}2\gt2\) : incompatibles. Piste : la résistance de sortie du générateur, 50 Ω, s'ajoute à \(R\) dans la constante de temps, \(\tau=(R+50\ \Omega)\,C\) ; l'oublier surestime \(C\) de \(50/1\,200=4{,}2\ \%\), ce qui explique l'écart de 3,9 %. Corrigée, la première valeur devient 97,9 nF, et \(E_N=0{,}2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : comparer l'écart relatif (« 4 % d'écart, c'est peu ») au lieu de le comparer aux incertitudes.</div>

  <div class="method-box"><strong>Méthode 9 — Valider une régression linéaire</strong>
    <ol>
      <li><span class="step">Linéariser.</span> Choisir \(x\) et \(y\) pour que le modèle s'écrive \(y=ax+b\) ; calculer \(u(y_i)\) (et \(u(x_i)\)).</li>
      <li><span class="step">Ajuster.</span> <code>a, b = np.polyfit(x, y, 1)</code>.</li>
      <li><span class="step">Tracer.</span> Points avec barres \(\pm2u(y_i)\) et droite, ou mieux les résidus \(y_i-(ax_i+b)\) avec leurs barres, autour de zéro.</li>
      <li><span class="step">Calculer les écarts normalisés.</span> \(z_i=\dfrac{y_i-(ax_i+b)}{u(y_i)}\), ou \(\dfrac{y_i-(ax_i+b)}{\sqrt{u(y_i)^2+a^2u(x_i)^2}}\) si \(x_i\) est incertain.</li>
      <li><span class="step">Conclure.</span> Modèle validé si presque tous les \(|z_i|\leqslant2\) et si leurs signes alternent sans structure ; sinon, rejeté (ou valable sur un domaine restreint). Ne jamais conclure sur \(R^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> allongement \(\Delta\ell\) d'un ressort en fonction de la force \(F=mg\), six masses de 50 à 300 g, \(u(\Delta\ell)=0{,}6\ \text{mm}\). Écarts normalisés : 0,07 ; 0,48 ; 0,05 ; −1,55 ; 0,69 ; 0,26. Tous inférieurs à 2 en valeur absolue, sans motif : la loi de Hooke est validée.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : des écarts normalisés tous petits mais qui dessinent une arche (négatifs aux bords, positifs au milieu) révèlent tout de même un modèle inadapté ; et un \(R^2=0{,}999\) ne prouve rien.</div>

  <div class="method-box"><strong>Méthode 10 — Évaluer l'incertitude sur les paramètres d'une régression par Monte-Carlo</strong>
    <ol>
      <li><span class="step">Préparer.</span> Tableaux <code>x</code>, <code>y</code> et incertitudes <code>uy</code> (et <code>ux</code> si besoin).</li>
      <li><span class="step">Boucler.</span> Pour <code>k</code> de 0 à <code>Nsim</code> − 1 : <code>ysim = np.random.normal(y, uy)</code>, puis <code>a[k], b[k] = np.polyfit(x, ysim, 1)</code>.</li>
      <li><span class="step">Conclure.</span> \(u(a)\) et \(u(b)\) sont les écarts-types des tableaux <code>a</code> et <code>b</code> ; une grandeur physique \(G=f(a,b)\) se calcule pour chaque tirage, son écart-type est \(u(G)\).</li>
      <li><span class="step">Exploiter.</span> Comparer \(b\) à la valeur attendue (souvent 0) et \(G\) à une référence par l'écart normalisé.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour le ressort de la méthode 9 (\(\Delta\ell=aF+b\), raideur \(k=1/a\)), 10 000 tirages donnent \(k=24{,}83\ \text{N·m}^{-1}\) avec \(u(k)=0{,}18\ \text{N·m}^{-1}\), et \(b=0{,}2\ \text{mm}\) avec \(u(b)=0{,}56\ \text{mm}\) : \(b\) est compatible avec 0, comme le prévoit la loi de Hooke.</p>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Période d'un oscillateur au chronomètre</h3>
  <div class="statement">Une masse \(m=250{,}0\ \text{g}\), pesée sur une balance garantie à \(\pm0{,}5\ \text{g}\), est suspendue à un ressort. On chronomètre dix périodes d'oscillation, six fois de suite en relançant l'oscillateur à chaque essai : \(10T\) = 8,46 ; 8,52 ; 8,38 ; 8,60 ; 8,49 ; 8,43 s. On rappelle la période d'un oscillateur masse-ressort, \(T=2\pi\sqrt{m/k}\), et l'on admet que l'incertitude relative de \(T^2\) vaut le double de celle de \(T\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la moyenne, l'écart-type expérimental et l'incertitude-type de la moyenne des six durées. En déduire \(T\) et \(u(T)\).</div>
  <div class="q"><strong>Q2.</strong> Un camarade n'a fait qu'un seul chronométrage, 8,46 s, avec le même protocole. Quelle incertitude-type sur \(T\) doit-il annoncer ?</div>
  <div class="q"><strong>Q3.</strong> Donner un intervalle contenant la période avec un niveau de confiance d'environ 95 %. Quelle hypothèse fait-on ?</div>
  <div class="q"><strong>Q4.</strong> Calculer la raideur \(k\) et son incertitude-type. Quelle mesure limite la précision ?</div>
  <div class="q"><strong>Q5.</strong> Combien de chronométrages de dix périodes faudrait-il pour diviser \(u(T)\) par 2 ? Pour atteindre une incertitude relative de 0,1 % sur \(T\), vaut-il mieux multiplier les chronométrages ou allonger chacun d'eux ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Somme : 50,88 s, moyenne \(\overline{10T}=8{,}480\ \text{s}\). Écarts à la moyenne : −0,02 ; 0,04 ; −0,10 ; 0,12 ; 0,01 ; −0,05 s, de carrés de somme \(0{,}0290\ \text{s}^2\), d'où \(s=\sqrt{0{,}0290/5}=0{,}076\ \text{s}\) et \(u=s/\sqrt6=0{,}031\ \text{s}\). On divise par 10 (nombre exact) : \(T=0{,}8480\ \text{s}\) et \(u(T)=0{,}0031\ \text{s}\), soit 0,37 %.</p>
    <p><strong>Q2.</strong> Pour une mesure isolée faite avec ce protocole, l'incertitude-type est l'écart-type expérimental de la série, \(s=0{,}076\ \text{s}\) sur \(10T\) : \(T=0{,}846\ \text{s}\), \(u(T)=0{,}0076\ \text{s}\) (0,9 %). Une seule mesure ne permet pas d'évaluer la dispersion : il utilise celle établie par la série.</p>
    <p><strong>Q3.</strong> En supposant la distribution de la moyenne normale (raisonnable : la dispersion vient de nombreuses petites causes, temps de réaction surtout), \(T\pm2u(T)=[0{,}8418\,;0{,}8542]\ \text{s}\) à environ 95 %.</p>
    <p><strong>Q4.</strong> La raideur vaut</p><div class="formula">$$k=\frac{4\pi^2m}{T^2}=\frac{4\pi^2\times0{,}2500}{0{,}8480^2}=13{,}72\ \text{N·m}^{-1}.$$</div><p>Contributions relatives : la masse, \(u(m)=0{,}5/\sqrt3=0{,}29\ \text{g}\), soit 0,12 % ; la période, \(2\times0{,}37\ \%=0{,}73\ \%\). Total : \(u(k)/k=\sqrt{0{,}12^2+0{,}73^2}\ \%=0{,}74\ \%\), \(u(k)=0{,}10\ \text{N·m}^{-1}\). Le chronométrage domine : la masse pourrait être connue dix fois moins bien sans changer le résultat.</p>
    <p><strong>Q5.</strong> \(u\) varie comme \(1/\sqrt N\) : il faut quatre fois plus de chronométrages, 24. Pour 0,1 % (\(u(T)=0{,}00085\ \text{s}\), donc \(0{,}0085\ \text{s}\) sur \(10T\)), il en faudrait \((0{,}076/0{,}0085)^2\approx81\). En revanche, la dispersion d'un chronométrage (le temps de réaction) ne dépend pas de la durée mesurée : en chronométrant \(n\) périodes, \(u(T)=s/(n\sqrt N)\). Avec six essais, il suffit de \(n=0{,}076/(0{,}00085\times\sqrt6)\approx37\) périodes, soit quarante en pratique. Allonger la durée est beaucoup plus efficace que répéter.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Incertitudes de type B en salle de TP</h3>
  <div class="statement">Évaluer l'incertitude-type de chacune des mesures suivantes, faites une seule fois, et son incertitude relative quand elle a un sens.</div>
  <div class="q"><strong>Q1.</strong> La longueur d'une tige, mesurée avec une règle graduée au millimètre : début de la tige sur le trait 0, fin lue sur le trait 152 mm.</div>
  <div class="q"><strong>Q2.</strong> Le volume délivré par une pipette jaugée de 20 mL de classe A, de tolérance \(\pm0{,}03\ \text{mL}\) ; la température lue sur un thermomètre électronique qui affiche 23,4 °C et dont la notice annonce \(\pm0{,}3\ \text{°C}\).</div>
  <div class="q"><strong>Q3.</strong> Une tension de 12,48 V lue sur le calibre 20 V d'un voltmètre (dernier chiffre : 0,01 V) de précision \(\pm(0{,}8\ \%\) de la lecture \(+\,3\) digits).</div>
  <div class="q"><strong>Q4.</strong> La position de l'écran sur un banc d'optique : l'image paraît nette de 41,2 cm à 43,0 cm.</div>
  <div class="q"><strong>Q5.</strong> Un élève chronomètre une chute de 0,45 s avec un chronomètre au centième et annonce \(u(t)=0{,}01/\sqrt{12}=0{,}003\ \text{s}\). Qu'en penser ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque lecture se fait au trait le plus proche : demi-largeur 0,5 mm, \(u=0{,}5/\sqrt3=0{,}29\ \text{mm}\). La longueur est la différence de deux lectures indépendantes : \(u(L)=\sqrt2\times0{,}29=0{,}41\ \text{mm}\), soit 0,27 % de 152 mm. (Si l'on aligne soigneusement le début sur le trait 0, on peut juger cette première lecture meilleure ; garder les deux est prudent.)</p>
    <p><strong>Q2.</strong> Pipette : \(u(V)=0{,}03/\sqrt3=0{,}017\ \text{mL}\), soit 0,09 %. Thermomètre : \(u(\theta)=0{,}3/\sqrt3=0{,}17\ \text{°C}\) ; une incertitude relative sur une température en degrés Celsius n'a pas de sens (le zéro de l'échelle est arbitraire), on ne la calcule pas.</p>
    <p><strong>Q3.</strong> \(a=0{,}008\times12{,}48+3\times0{,}01=0{,}130\ \text{V}\), \(u(U)=0{,}130/\sqrt3=0{,}075\ \text{V}\), soit 0,60 %.</p>
    <p><strong>Q4.</strong> Milieu : \(x=42{,}1\ \text{cm}\) ; demi-largeur \(a=0{,}9\ \text{cm}\) ; \(u(x)=0{,}9/\sqrt3=0{,}52\ \text{cm}\). Une position n'a pas d'incertitude relative (son origine est arbitraire) : on raisonnera sur les distances qui en découlent.</p>
    <p><strong>Q5.</strong> Ce calcul ne tient compte que de la résolution de l'affichage. La vraie limite est le temps de réaction au départ et à l'arrivée, de l'ordre de 0,1 s, qui varie d'un essai à l'autre de quelques centièmes à un dixième de seconde : l'incertitude est de l'ordre de 0,05 à 0,1 s, vingt fois plus. Elle s'évalue par une série de mesures (type A), pas par la résolution.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Écrire correctement un résultat</h3>
  <div class="statement">Les incertitudes citées sont des incertitudes-types.</div>
  <div class="q"><strong>Q1.</strong> Écrire correctement les résultats bruts suivants : \(\lambda=532{,}147\ \text{nm}\) avec \(u=2{,}64\ \text{nm}\) ; \(v=0{,}0034582\ \text{m·s}^{-1}\) avec \(u=0{,}000127\ \text{m·s}^{-1}\) ; \(E=1\,234\,567\ \text{J}\) avec \(u=4\,321\ \text{J}\) ; \(T=2{,}0049\ \text{s}\) avec \(u=0{,}0213\ \text{s}\).</div>
  <div class="q"><strong>Q2.</strong> Repérer ce qui ne va pas dans chacune de ces écritures, et proposer une correction : (a) « \(m=12{,}3456\pm0{,}1\ \text{g}\) » ; (b) « \(c=3\times10^{8}\pm4\times10^{6}\ \text{m·s}^{-1}\) » ; (c) « \(R=47\ \Omega\), incertitude-type 5 % » pour une résistance marquée 47 Ω à 5 % près.</div>
  <div class="q"><strong>Q3.</strong> Pourquoi ne faut-il pas arrondir une grandeur intermédiaire, par exemple une période avant de l'élever au carré ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On arrondit l'incertitude à deux chiffres significatifs (elle commence par 1, 2 ou 4 ici ; un seul chiffre serait aussi acceptable pour 4,3), puis la valeur au même rang :</p>
    <ul>
      <li>\(\lambda=532{,}1\ \text{nm}\), \(u(\lambda)=2{,}6\ \text{nm}\) (0,5 %) ;</li>
      <li>\(v=(3{,}46\pm0{,}13)\times10^{-3}\ \text{m·s}^{-1}\), incertitude-type (3,7 %) ;</li>
      <li>\(E=(1{,}2346\pm0{,}0043)\times10^{6}\ \text{J}\), incertitude-type (0,35 %) ;</li>
      <li>\(T=2{,}005\ \text{s}\), \(u(T)=0{,}021\ \text{s}\) (1,1 %).</li>
    </ul>
    <p><strong>Q2.</strong> (a) La valeur a trois décimales de trop : avec \(u=0{,}1\ \text{g}\), on écrit \(m=12{,}3\ \text{g}\), \(u(m)=0{,}1\ \text{g}\). (b) La valeur n'a pas assez de chiffres : une incertitude de \(0{,}04\times10^{8}\) impose deux décimales, \(c=(3{,}00\pm0{,}04)\times10^{8}\ \text{m·s}^{-1}\) si la mesure a bien donné 3,00. (c) « 5 % près » est la tolérance du fabricant, une demi-largeur et non une incertitude-type : \(u(R)=0{,}05\times47/\sqrt3=1{,}4\ \Omega\) (2,9 %), d'où \(R=47{,}0\ \Omega\), \(u(R)=1{,}4\ \Omega\).</p>
    <p><strong>Q3.</strong> Chaque arrondi ajoute une erreur, et une fonction non linéaire peut l'amplifier. Arrondir \(T=1{,}5535\ \text{s}\) à 1,55 s change \(T^2\) de 0,45 %, presque autant que l'incertitude-type relative visée sur \(g\) (0,6 %) : on dégrade le résultat pour rien. On garde tous les chiffres jusqu'au résultat final.</p>
