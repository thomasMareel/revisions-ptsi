<div class="course-section">
  <div class="sec-num">§1 · MATRICES SYMÉTRIQUES RÉELLES</div>
  <h2>L'espace \(\mathcal{S}_n(\mathbb{R})\)</h2>
  <div class="intro">Une matrice symétrique est « son propre reflet » par rapport à sa diagonale. Ce type de matrice apparaît dès qu'une grandeur dépend de façon quadratique de plusieurs variables : partie du second degré de l'équation d'une conique, matrice d'inertie d'un solide en SI, tenseur des contraintes en RDM, dérivées secondes d'une fonction de deux variables… Leur propriété phare, la diagonalisation dans une base orthonormale, est l'outil qui permet de « redresser » une conique.</div>
  <div class="def-box">
    <strong>Définition.</strong> Une matrice \(A=(a_{ij}) \in \mathcal{M}_n(\mathbb{R})\) est <strong>symétrique</strong> si \(A^{\mathsf T} = A\), c'est-à-dire \(a_{ji} = a_{ij}\) pour tous \(i, j\). Elle est <strong>antisymétrique</strong> si \(A^{\mathsf T} = -A\) (sa diagonale est alors nulle). On note \(\mathcal{S}_n(\mathbb{R})\) et \(\mathcal{A}_n(\mathbb{R})\) ces deux ensembles.<br>
    <em>Notation</em> : dans ce chapitre, la transposée est notée \(A^{\mathsf T}\) (on rencontre aussi \({}^{t}\!A\)).
  </div>
  <div class="prop-box">
    <strong>Proposition.</strong> \(\mathcal{S}_n(\mathbb{R})\) et \(\mathcal{A}_n(\mathbb{R})\) sont deux sous-espaces vectoriels supplémentaires de \(\mathcal{M}_n(\mathbb{R})\), de dimensions respectives \(\frac{n(n+1)}{2}\) et \(\frac{n(n-1)}{2}\). Toute matrice \(M\) se décompose de façon unique :
    $$M = \underbrace{\frac{M + M^{\mathsf T}}{2}}_{\in\,\mathcal{S}_n(\mathbb{R})} + \underbrace{\frac{M - M^{\mathsf T}}{2}}_{\in\,\mathcal{A}_n(\mathbb{R})}.$$
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pourquoi n(n+1)/2 ?</span>
    <span class="prompt">Compter les coefficients « libres » d'une matrice symétrique.</span>
    <div class="content"><p>Une matrice symétrique est entièrement déterminée par ses coefficients situés <strong>sur et au-dessus</strong> de la diagonale, soit \(n + (n-1) + \dots + 1 = \frac{n(n+1)}{2}\) coefficients. Une base est formée des \(E_{ii}\) (\(1 \le i \le n\)) et des \(E_{ij} + E_{ji}\) (\(i \lt j\)). Ainsi \(\dim \mathcal{S}_2(\mathbb{R}) = 3\) et \(\dim \mathcal{S}_3(\mathbb{R}) = 6\).</p></div>
  </div>

  <h3>Lien avec le produit scalaire canonique</h3>
  <p>On identifie \(\mathbb{R}^n\) et \(\mathcal{M}_{n,1}(\mathbb{R})\), muni du produit scalaire canonique \(\langle X, Y\rangle = X^{\mathsf T}Y = \sum_k x_k y_k\).</p>
  <div class="prop-box">
    <strong>Caractérisation.</strong> \(A\) est symétrique si et seulement si, pour tous vecteurs colonnes \(X\) et \(Y\) :
    $$\langle AX, Y\rangle = \langle X, AY\rangle .$$
    En effet \(\langle AX, Y\rangle = X^{\mathsf T}A^{\mathsf T}Y\) ; en prenant pour \(X\) et \(Y\) des vecteurs de la base canonique, on obtient \(a_{ji} = a_{ij}\).
  </div>
  <div class="notice"><strong>Attention</strong> : cette caractérisation repose sur le produit scalaire canonique, pour lequel la base canonique est orthonormale. Pour un endomorphisme \(u\) d'un espace euclidien, la relation \(\langle u(x), y\rangle = \langle x, u(y)\rangle\) équivaut à la symétrie de sa matrice dans une base <strong>orthonormale</strong> ; dans une base qui ne l'est pas, cette matrice peut très bien ne pas être symétrique.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Décomposer \(M = \begin{pmatrix} 1 & 4\\ -2 & 3\end{pmatrix}\) en partie symétrique et partie antisymétrique.</span>
    <div class="content"><p>On calcule les deux moitiés :
    $$S = \frac{M + M^{\mathsf T}}{2} = \begin{pmatrix} 1 & 1\\ 1 & 3\end{pmatrix},$$
    $$T = \frac{M - M^{\mathsf T}}{2} = \begin{pmatrix} 0 & 3\\ -3 & 0\end{pmatrix},$$
    et l'on vérifie que \(S + T = M\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ÉLÉMENTS PROPRES D'UNE MATRICE SYMÉTRIQUE</div>
  <h2>Valeurs propres réelles, sous-espaces propres orthogonaux</h2>
  <div class="intro">Deux propriétés distinguent les matrices symétriques réelles de toutes les autres : leur spectre est entièrement réel, et leurs directions propres sont perpendiculaires entre elles.</div>
  <div class="prop-box">
    <strong>Théorème 1 (spectre réel).</strong> Si \(A \in \mathcal{S}_n(\mathbb{R})\), son polynôme caractéristique \(\chi_A\) est scindé sur \(\mathbb{R}\) : toutes les valeurs propres de \(A\) sont réelles.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de preuve</span>
    <span class="prompt">Pourquoi une valeur propre complexe de \(A\) est-elle forcément réelle ?</span>
    <div class="content"><p>Soit \(\lambda \in \mathbb{C}\) et \(Z \in \mathcal{M}_{n,1}(\mathbb{C})\) non nul tels que \(AZ = \lambda Z\). Le nombre \(s = \overline{Z}^{\mathsf T}AZ\) vaut \(\lambda \sum_k |z_k|^2\). Comme \(A\) est réelle, \(\overline{s} = Z^{\mathsf T}A\overline{Z}\) ; ce nombre est égal à son transposé, donc \(\overline{s} = \overline{Z}^{\mathsf T}A^{\mathsf T}Z = s\). Ainsi \(s\) est réel, et \(\lambda = s / \sum_k |z_k|^2\) aussi.</p></div>
  </div>
  <div class="prop-box">
    <strong>Théorème 2 (orthogonalité).</strong> Les sous-espaces propres d'une matrice symétrique réelle sont deux à deux orthogonaux : si \(AX = \lambda X\) et \(AY = \mu Y\) avec \(\lambda \ne \mu\), alors \(X^{\mathsf T}Y = 0\). En effet :
    $$\lambda\, X^{\mathsf T}Y = (AX)^{\mathsf T}Y = X^{\mathsf T}(AY) = \mu\, X^{\mathsf T}Y ,$$
    d'où \((\lambda - \mu)\,X^{\mathsf T}Y = 0\), puis \(X^{\mathsf T}Y = 0\).
  </div>
  <div class="notice"><strong>Attention</strong> : deux vecteurs propres associés à la <strong>même</strong> valeur propre ne sont pas orthogonaux en général. Dans un sous-espace propre de dimension \(\ge 2\), c'est à nous de construire une base orthonormale.</div>
  <div class="notice"><strong>Le mot « réelle » est indispensable.</strong> La matrice complexe \(B = \begin{pmatrix} 1 & i\\ i & -1\end{pmatrix}\) est symétrique, non nulle, et vérifie \(B^2 = 0\) : sa seule valeur propre est \(0\), elle n'est donc pas diagonalisable.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Vérifier directement le théorème 1 pour \(A = \begin{pmatrix} a & b\\ b & c\end{pmatrix}\).</span>
    <div class="content"><p>\(\chi_A(X) = X^2 - (a+c)X + (ac - b^2)\) a pour discriminant
    $$(a+c)^2 - 4(ac - b^2) = (a-c)^2 + 4b^2 \ge 0 .$$
    Les deux racines sont réelles, et confondues seulement si \(b = 0\) et \(a = c\), c'est-à-dire si \(A = aI_2\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · THÉORÈME SPECTRAL</div>
  <h2>Diagonaliser dans une base orthonormale</h2>
  <div class="intro">Les deux théorèmes précédents s'assemblent en un résultat central : une matrice symétrique réelle est toujours diagonalisable, et même avec une matrice de passage orthogonale, dont l'inverse s'obtient gratuitement par transposition.</div>
  <div class="prop-box">
    <strong>Théorème spectral.</strong> Pour toute \(A \in \mathcal{S}_n(\mathbb{R})\), il existe une matrice orthogonale \(P \in O(n)\) et une matrice diagonale réelle \(D\) telles que
    $$P^{\mathsf T}AP = D, \quad\text{soit}\quad A = PDP^{\mathsf T},$$
    avec \(P^{\mathsf T}P = I_n\).
    Les colonnes de \(P\) forment une <strong>base orthonormale de vecteurs propres</strong> de \(A\) ; la diagonale de \(D\) contient les valeurs propres associées, <strong>dans le même ordre</strong>. De façon équivalente, \(\mathbb{R}^n\) est la somme directe orthogonale des sous-espaces propres de \(A\).
  </div>
  <div class="prop-box">
    <strong>Conséquences.</strong>
    <ul style="margin-top:.3rem">
      <li>\(A\) est diagonalisable et, pour chaque valeur propre \(\lambda\), \(\dim E_\lambda(A)\) est égale à la multiplicité de \(\lambda\).</li>
      <li>\(P^{-1} = P^{\mathsf T}\) : aucune inversion à calculer.</li>
      <li><strong>Réciproque</strong> : si \(A = PDP^{\mathsf T}\) avec \(P\) orthogonale et \(D\) diagonale, alors \(A^{\mathsf T} = PD^{\mathsf T}P^{\mathsf T} = A\). Les matrices réelles diagonalisables en base orthonormale sont <strong>exactement</strong> les matrices symétriques.</li>
      <li>Quitte à changer une colonne en son opposée, on peut choisir \(P \in SO(n)\), c'est-à-dire \(\det P = 1\).</li>
    </ul>
  </div>
  <div class="notice"><strong>Piège</strong> : des vecteurs propres juxtaposés « bruts » donnent une matrice de passage, mais rarement une matrice orthogonale. Pour \(A = \begin{pmatrix} 0 & 1\\ 1 & 0\end{pmatrix}\), \(Q = \begin{pmatrix} 1 & 1\\ 1 & -1\end{pmatrix}\) vérifie \(Q^{-1}AQ = \operatorname{diag}(1,-1)\), mais \(Q^{\mathsf T}Q = 2I_2\), donc \(Q^{-1} \ne Q^{\mathsf T}\) : il faut <strong>normer</strong> les colonnes (diviser par \(\sqrt2\)).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de preuve</span>
    <span class="prompt">Une récurrence sur la dimension.</span>
    <div class="content"><p>Par le théorème 1, \(A\) possède une valeur propre réelle \(\lambda\) et un vecteur propre unitaire \(X_1\). L'hyperplan \(H = X_1^{\perp}\) est stable par \(A\) : si \(X^{\mathsf T}X_1 = 0\), alors \((AX)^{\mathsf T}X_1 = X^{\mathsf T}AX_1 = \lambda X^{\mathsf T}X_1 = 0\). Dans une base orthonormale de \(H\), la restriction de \(A\) a encore une matrice symétrique, de taille \(n-1\) : on lui applique l'hypothèse de récurrence, puis on complète par \(X_1\).</p></div>
  </div>

  <h3>Forme quadratique associée</h3>
  <div class="def-box">
    À \(A \in \mathcal{S}_n(\mathbb{R})\), on associe \(q(X) = X^{\mathsf T}AX = \sum_{i,j} a_{ij}x_ix_j\). Pour \(n = 2\) et \(A = \begin{pmatrix} a & b\\ b & c\end{pmatrix}\) :
    $$q(x,y) = ax^2 + 2bxy + cy^2 .$$
  </div>
  <div class="prop-box">
    <strong>Réduction de la forme quadratique.</strong> Si \(P^{\mathsf T}AP = D = \operatorname{diag}(\lambda_1,\dots,\lambda_n)\) et \(Y = P^{\mathsf T}X\) (coordonnées de \(X\) dans la base propre orthonormale), alors
    $$q(X) = Y^{\mathsf T}DY = \lambda_1 y_1^2 + \lambda_2 y_2^2 + \dots + \lambda_n y_n^2 :$$
    les termes rectangles ont disparu. Ainsi \(q(X) \gt 0\) pour tout \(X \ne 0\) si et seulement si toutes les valeurs propres de \(A\) sont strictement positives (et \(q \ge 0\) si et seulement si elles sont toutes positives).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">La forme \(q(x,y) = x^2 + 4xy + y^2\) prend-elle des valeurs négatives ?</span>
    <div class="content"><p>\(A = \begin{pmatrix} 1 & 2\\ 2 & 1\end{pmatrix}\) a pour trace \(2\) et pour déterminant \(-3\) : ses valeurs propres sont \(3\) et \(-1\), de signes contraires. Donc oui : le long du vecteur propre \((1,-1)\) associé à \(-1\), on trouve \(q(1,-1) = 1 - 4 + 1 = -2 \lt 0\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · RAPPELS SUR LES CONIQUES</div>
  <h2>Ce qu'il faut savoir lire sur une équation réduite</h2>
  <div class="intro">La définition par foyer, directrice et excentricité et les tangentes sont développées dans le chapitre <strong>Courbes du plan et coniques</strong> (l'équation polaire n'y figure qu'en complément hors programme). On rassemble ici les données utiles pour exploiter une équation réduite, dans un repère orthonormé \((O;\vec{\imath},\vec{\jmath})\).</div>
  <div class="def-box">
    Soit \(F\) un point, \(\mathcal{D}\) une droite ne passant pas par \(F\) et \(e \gt 0\). La <strong>conique</strong> de foyer \(F\), de directrice \(\mathcal{D}\) et d'excentricité \(e\) est l'ensemble des points \(M\) tels que \(MF = e\,d(M,\mathcal{D})\). C'est une <strong>ellipse</strong> si \(e \lt 1\), une <strong>parabole</strong> si \(e = 1\), une <strong>hyperbole</strong> si \(e \gt 1\). Dans tous les cas, la courbe est symétrique par rapport à son <strong>axe focal</strong>, la droite issue de \(F\) qui coupe \(\mathcal{D}\) à angle droit.
  </div>
  <div style="overflow-x:auto;margin:.6rem 0">
  <table style="width:100%;border-collapse:collapse;font-size:.82rem;text-align:center">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--muted)"></th><th style="padding:.35rem;border:1px solid var(--muted)">Ellipse \((0 \lt b \lt a)\)</th><th style="padding:.35rem;border:1px solid var(--muted)">Hyperbole \((a, b \gt 0)\)</th><th style="padding:.35rem;border:1px solid var(--muted)">Parabole \((p \gt 0)\)</th></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Équation</th><td style="padding:.35rem;border:1px solid var(--muted)">\(\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(y^2 = 2px\)</td></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Constante \(c\)</th><td style="padding:.35rem;border:1px solid var(--muted)">\(c^2 = a^2 - b^2\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(c^2 = a^2 + b^2\)</td><td style="padding:.35rem;border:1px solid var(--muted)">—</td></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Excentricité</th><td style="padding:.35rem;border:1px solid var(--muted)">\(e = c/a \lt 1\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(e = c/a \gt 1\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(e = 1\)</td></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Sommets</th><td style="padding:.35rem;border:1px solid var(--muted)">\((\pm a, 0)\), \((0, \pm b)\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\((\pm a, 0)\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(O\)</td></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Foyers</th><td style="padding:.35rem;border:1px solid var(--muted)">\((\pm c, 0)\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\((\pm c, 0)\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\((p/2,\ 0)\)</td></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Directrices</th><td style="padding:.35rem;border:1px solid var(--muted)">\(x = \pm a^2/c\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(x = \pm a^2/c\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\(x = -p/2\)</td></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Paramétrage</th><td style="padding:.35rem;border:1px solid var(--muted)">\((a\cos t,\ b\sin t)\)</td><td style="padding:.35rem;border:1px solid var(--muted)">\((a\operatorname{ch} t,\ b\operatorname{sh} t)\)<br>(branche \(x \gt 0\))</td><td style="padding:.35rem;border:1px solid var(--muted)">\(\left(\dfrac{t^2}{2p},\ t\right)\)</td></tr>
    <tr><th style="padding:.35rem;border:1px solid var(--muted)">Asymptotes</th><td style="padding:.35rem;border:1px solid var(--muted)">—</td><td style="padding:.35rem;border:1px solid var(--muted)">\(y = \pm \dfrac{b}{a}\,x\)</td><td style="padding:.35rem;border:1px solid var(--muted)">—</td></tr>
  </table>
  </div>
  <div class="prop-box">
    <strong>Propriétés bifocales</strong> (à titre culturel : aucune connaissance n'est exigée sur ces définitions). Ellipse : \(MF + MF' = 2a\). Hyperbole : \(|MF - MF'| = 2a\). Le <strong>cercle</strong> \(x^2 + y^2 = R^2\) est le cas limite \(a = b = R\), \(c = 0\), \(e = 0\).
  </div>
  <h3>L'hyperbole équilatère \(xy = k\)</h3>
  <div class="prop-box">
    Pour \(k \ne 0\), la courbe \(xy = k\) (graphe de \(x \mapsto k/x\)) s'approche de \((Ox)\) et de \((Oy)\) sans les toucher : c'est une hyperbole d'<strong>asymptotes perpendiculaires</strong>, dite <strong>équilatère</strong> (\(a = b\), \(e = \sqrt2\)). La rotation d'angle \(\pi/4\) la ramène à une équation réduite :
    $$x = \frac{X - Y}{\sqrt2},\qquad y = \frac{X + Y}{\sqrt2} ,$$
    donne \(xy = \frac{X^2 - Y^2}{2}\), d'où \(X^2 - Y^2 = 2k\). Pour \(k \gt 0\) : \(a = b = \sqrt{2k}\), sommets \(\pm(\sqrt k, \sqrt k)\) et foyers \(\pm(\sqrt{2k}, \sqrt{2k})\) dans le repère initial.
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · ÉQUATION GÉNÉRALE DU SECOND DEGRÉ</div>
  <h2>Écriture matricielle d'une conique</h2>
  <div class="intro">Dans un repère orthonormé quelconque, une conique n'a aucune raison d'avoir une équation réduite : elle est inclinée (terme en \(xy\)) et décentrée (termes en \(x\) et en \(y\)). L'écriture matricielle sépare ces deux défauts.</div>
  <div class="def-box">
    Une <strong>conique</strong> (au sens large) est l'ensemble \(\mathcal{C}\) des points \(M(x,y)\) vérifiant une équation
    $$ax^2 + 2bxy + cy^2 + dx + ey + f = 0,$$
    où \((a,b,c) \ne (0,0,0)\).
    En posant
    $$X = \begin{pmatrix} x\\ y\end{pmatrix},\qquad A = \begin{pmatrix} a & b\\ b & c\end{pmatrix},\qquad L = \begin{pmatrix} d & e\end{pmatrix},$$
    avec \(A \in \mathcal{S}_2(\mathbb{R})\), l'équation s'écrit
    $$X^{\mathsf T}AX + LX + f = 0 .$$
    \(X^{\mathsf T}AX = ax^2 + 2bxy + cy^2\) est la <strong>partie quadratique</strong>, \(LX = dx + ey\) la partie linéaire.
  </div>
  <div class="notice"><strong>Piège du facteur 2</strong> : les coefficients hors diagonale de \(A\) valent la <strong>moitié</strong> du coefficient de \(xy\). Pour \(3x^2 - 8xy + y^2\), on prend \(A = \begin{pmatrix} 3 & -4\\ -4 & 1\end{pmatrix}\), et non \(-8\).</div>
  <div class="prop-box">
    <strong>Ce que peut être \(\mathcal{C}\).</strong> Une ellipse (éventuellement un cercle), une hyperbole, une parabole, ou une conique <strong>dégénérée</strong> :
    <ul style="margin-top:.3rem">
      <li>l'ensemble vide : \(x^2 + y^2 + 1 = 0\) ;</li>
      <li>un point : \(x^2 + 3y^2 = 0\) (le point \(O\)) ;</li>
      <li>une droite (dite double) : \((x - y)^2 = 0\) ;</li>
      <li>deux droites parallèles : \(y^2 = 4\), soit \(y = \pm 2\) ;</li>
      <li>deux droites sécantes : \(x^2 - 4y^2 = 0\), soit \(y = \pm x/2\).</li>
    </ul>
  </div>

  <h3>Changement de repère orthonormé</h3>
  <p>Soit \((\vec u, \vec v)\) une base orthonormée directe, \(P \in SO(2)\) sa matrice dans \((\vec{\imath},\vec{\jmath})\) (colonnes = coordonnées de \(\vec u\) et de \(\vec v\)), et \(\Omega(x_0, y_0)\). Les coordonnées \(X\) d'un point \(M\) dans \((O;\vec{\imath},\vec{\jmath})\) et ses coordonnées \(X' = \begin{pmatrix} x'\\ y'\end{pmatrix}\) dans \((\Omega;\vec u,\vec v)\) sont liées par</p>
  <div class="formula">$$X = X_\Omega + PX' ,$$</div>
  <p>ou encore \(X' = P^{\mathsf T}(X - X_\Omega)\), puisque \(P^{-1} = P^{\mathsf T}\).</p>
  <div class="prop-box">
    <strong>Effet d'une rotation du repère</strong> (\(\Omega = O\), \(X = PX'\)) : l'équation \(X^{\mathsf T}AX + LX + f = 0\) devient
    $$X'^{\mathsf T}\big(P^{\mathsf T}AP\big)X' + (LP)\,X' + f = 0 .$$
    La partie quadratique est donc représentée par \(P^{\mathsf T}AP\), semblable à \(A\) : la <strong>trace</strong> \(a + c\) et le <strong>déterminant</strong> \(ac - b^2\) sont des invariants.
  </div>
  <div class="prop-box">
    <strong>Angle de la rotation.</strong> Toute \(P \in SO(2)\) est une matrice de rotation
    $$R_\theta = \begin{pmatrix} \cos\theta & -\sin\theta\\ \sin\theta & \cos\theta\end{pmatrix}.$$
    Le terme en \(x'y'\) disparaît exactement quand
    $$\tan 2\theta = \frac{2b}{a - c} \qquad\big(\theta = \tfrac{\pi}{4} \text{ si } a = c\big).$$
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Vérification</span>
    <span class="prompt">D'où vient la formule donnant \(\tan 2\theta\) ?</span>
    <div class="content"><p>En reportant \(x = x'\cos\theta - y'\sin\theta\) et \(y = x'\sin\theta + y'\cos\theta\) dans \(ax^2 + 2bxy + cy^2\), le coefficient de \(x'y'\) vaut
    $$2b\cos 2\theta + (c - a)\sin 2\theta ,$$
    qui s'annule si et seulement si \(\tan 2\theta = \frac{2b}{a-c}\) (ou \(\cos 2\theta = 0\) quand \(a = c\)). Les directions obtenues sont celles des vecteurs propres de \(A\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉDUCTION : ROTATION PUIS TRANSLATION</div>
  <h2>Obtenir l'équation réduite</h2>
  <div class="intro">Deux mouvements suffisent : une <strong>rotation</strong> du repère, dirigée par les vecteurs propres de \(A\), supprime le terme en \(xy\) ; une <strong>translation</strong>, obtenue en complétant les carrés, supprime ce qui peut l'être des termes du premier degré.</div>
  <figure class="schema">
  <svg viewBox="0 0 360 220" role="img" aria-label="Ellipse inclinée : repère initial (O ; i, j) et repère réduit (Ω ; u, v), déduit par une rotation d'angle θ puis une translation">

  </figure>

  <h3>Étape 1 — Rotation</h3>
  <p>On choisit \(P \in SO(2)\) telle que \(P^{\mathsf T}AP = \operatorname{diag}(\lambda_1, \lambda_2)\) ; ses colonnes donnent \(\vec u\) et \(\vec v\). Dans le repère \((O;\vec u,\vec v)\), l'équation devient</p>
  <div class="formula">$$\lambda_1 x'^2 + \lambda_2 y'^2 + d'x' + e'y' + f = 0,$$</div>
  <p>où la ligne \(\begin{pmatrix} d' & e'\end{pmatrix} = LP\) donne les nouveaux coefficients du premier degré.</p>
  <h3>Étape 2 — Translation (forme canonique)</h3>
  <p>Pour chaque valeur propre non nulle, on complète le carré :</p>
  <div class="formula">$$\lambda_1 x'^2 + d'x' = \lambda_1\Big(x' + \frac{d'}{2\lambda_1}\Big)^2 - \frac{d'^2}{4\lambda_1} .$$</div>
  <div class="prop-box">
    <strong>Deux situations.</strong>
    <ul style="margin-top:.3rem">
      <li><strong>\(\lambda_1\lambda_2 \ne 0\)</strong> (soit \(\det A \ne 0\)) : on aboutit à \(\lambda_1X^2 + \lambda_2Y^2 = h\) dans un repère \((\Omega;\vec u,\vec v)\). Le point \(\Omega\) est l'unique <strong>centre de symétrie</strong> : c'est une conique à centre.</li>
      <li><strong>\(\lambda_1 = 0 \ne \lambda_2\)</strong> (soit \(\det A = 0\)) : il reste \(\lambda_2Y^2 + d'x' = h'\). Si \(d' \ne 0\), une translation sur \(x'\) donne une équation du type \(Y^2 = 2pX\) (au signe près) : c'est une <strong>parabole</strong>. Si \(d' = 0\), on obtient \(\lambda_2Y^2 = h'\) : deux droites parallèles, une droite ou le vide.</li>
    </ul>
  </div>
  <h3>Raccourci pour une conique à centre</h3>
  <div class="prop-box">
    Notons \(F(x,y)\) le premier membre de l'équation. Si \(\det A \ne 0\), le centre \(\Omega(x_0,y_0)\) est l'unique solution du système
    $$\frac{\partial F}{\partial x}(x_0,y_0) = 0, \qquad \frac{\partial F}{\partial y}(x_0,y_0) = 0,$$
    c'est-à-dire \(2AX_\Omega + L^{\mathsf T} = 0\). Dans \((\Omega;\vec{\imath},\vec{\jmath})\), les termes du premier degré disparaissent et l'équation devient \(H^{\mathsf T}AH + F(x_0,y_0) = 0\), où \(H = X - X_\Omega\), de coordonnées \(x - x_0\) et \(y - y_0\), est la colonne des coordonnées de \(M\) dans ce repère, et
    $$F(x_0,y_0) = f + \frac{d\,x_0 + e\,y_0}{2} .$$
    Il ne reste qu'à diagonaliser \(A\) : \(\lambda_1X^2 + \lambda_2Y^2 = -F(x_0,y_0)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Développer \(F(X_\Omega + H)\).</span>
    <div class="content"><p>Avec \(F(X) = X^{\mathsf T}AX + LX + f\) et \(A\) symétrique :
    $$\begin{aligned}F(X_\Omega + H) &= F(X_\Omega) + (2X_\Omega^{\mathsf T}A + L)H\\ &\quad + H^{\mathsf T}AH .\end{aligned}$$
    Le terme du milieu est nul lorsque \(2AX_\Omega + L^{\mathsf T} = 0\). Cette relation donne aussi \(X_\Omega^{\mathsf T}AX_\Omega = -\frac12 LX_\Omega\), d'où \(F(X_\Omega) = f + \frac12 LX_\Omega\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · CLASSIFICATION</div>
  <h2>Le signe de \(\det A\) donne le genre</h2>
  <div class="intro">Comme \(\det A = ac - b^2 = \lambda_1\lambda_2\) ne change ni par rotation ni par translation, son signe se lit directement sur l'équation de départ, sans calculer les éléments propres.</div>
  <div style="overflow-x:auto;margin:.6rem 0">
  <table style="width:100%;border-collapse:collapse;font-size:.82rem;text-align:center">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--muted)">\(\det A = ac - b^2\)</th><th style="padding:.35rem;border:1px solid var(--muted)">Genre</th><th style="padding:.35rem;border:1px solid var(--muted)">Natures possibles</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--muted)">\(\gt 0\)<br>(\(\lambda_1, \lambda_2\) de même signe)</td><td style="padding:.35rem;border:1px solid var(--muted)">ellipse</td><td style="padding:.35rem;border:1px solid var(--muted)">ellipse (cercle si \(A = \lambda I_2\)), un point, vide</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--muted)">\(\lt 0\)<br>(signes contraires)</td><td style="padding:.35rem;border:1px solid var(--muted)">hyperbole</td><td style="padding:.35rem;border:1px solid var(--muted)">hyperbole, deux droites sécantes</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--muted)">\(= 0\)<br>(une valeur propre nulle)</td><td style="padding:.35rem;border:1px solid var(--muted)">parabole</td><td style="padding:.35rem;border:1px solid var(--muted)">parabole, deux droites parallèles, une droite, vide</td></tr>
  </table>
  </div>
  <div class="prop-box">
    <strong>Lire la nature d'une conique à centre</strong> \(\lambda_1X^2 + \lambda_2Y^2 = h\) (quitte à tout multiplier par \(-1\), on suppose \(\lambda_1 \gt 0\)) :
    <ul style="margin-top:.3rem">
      <li>si \(\lambda_2 \gt 0\) : ellipse de demi-axes \(\sqrt{h/\lambda_1}\) et \(\sqrt{h/\lambda_2}\) quand \(h \gt 0\) ; le point \(\Omega\) quand \(h = 0\) ; le vide quand \(h \lt 0\) ;</li>
      <li>si \(\lambda_2 \lt 0\) : hyperbole quand \(h \ne 0\), d'axe focal dirigé par \(\vec u\) si \(h \gt 0\) et par \(\vec v\) si \(h \lt 0\) ; deux droites sécantes \(Y = \pm\sqrt{-\lambda_1/\lambda_2}\,X\) quand \(h = 0\).</li>
    </ul>
  </div>
  <div class="notice"><strong>Genre n'est pas nature</strong> : \(x^2 + 2y^2 + 3 = 0\) est du genre ellipse, mais c'est l'ensemble vide. On ne conclut qu'après avoir obtenu le second membre \(h\) (ou le coefficient \(d'\) dans le cas parabolique). Multiplier l'équation par une constante \(k\) non nulle ne change ni \(\mathcal{C}\) ni le signe de \(\det A\), car \(\det(kA) = k^2\det A\).</div>
  <div class="prop-box">
    <strong>Deux critères rapides.</strong> \(\mathcal{C}\) est un <strong>cercle</strong> (ou un point, ou le vide) si et seulement si \(b = 0\) et \(a = c\). Une hyperbole est <strong>équilatère</strong> (asymptotes perpendiculaires) si et seulement si \(\lambda_2 = -\lambda_1\), c'est-à-dire \(\operatorname{tr} A = a + c = 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Nature de la conique \(2x^2 + 6xy + 2y^2 = 5\) ?</span>
    <div class="content"><p>\(A = \begin{pmatrix} 2 & 3\\ 3 & 2\end{pmatrix}\) et \(\det A = -5 \lt 0\) : genre hyperbole. Pas de terme du premier degré : le centre est \(O\). Les valeurs propres (trace \(4\), produit \(-5\)) sont \(5\) et \(-1\), de vecteurs propres unitaires \(\frac{1}{\sqrt2}(1,1)\) et \(\frac{1}{\sqrt2}(-1,1)\). Équation réduite :
    $$5X^2 - Y^2 = 5 \iff X^2 - \frac{Y^2}{5} = 1 :$$
    hyperbole d'axe focal la droite \(y = x\), avec \(a = 1\), \(b = \sqrt5\), \(c = \sqrt6\) et \(e = \sqrt6\).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · RETOUR AU REPÈRE INITIAL</div>
  <h2>Centre, axes, sommets, foyers, asymptotes</h2>
  <div class="intro">L'équation réduite donne tous les éléments géométriques dans le repère adapté \((\Omega;\vec u,\vec v)\). On les transporte ensuite dans le repère de départ, puis on trace.</div>
  <div class="formula">$$\overrightarrow{OM} = \overrightarrow{O\Omega} + X\,\vec u + Y\,\vec v ,$$
  $$\begin{pmatrix} x\\ y\end{pmatrix} = \begin{pmatrix} x_0\\ y_0\end{pmatrix} + P\begin{pmatrix} X\\ Y\end{pmatrix}.$$</div>
  <div class="prop-box">
    <strong>Éléments à transporter</strong> (ellipse ou hyperbole d'axe focal \((\Omega,\vec u)\)) :
    <ul style="margin-top:.3rem">
      <li><strong>centre</strong> \(\Omega\) ; <strong>axes</strong> : les droites passant par \(\Omega\) dirigées par \(\vec u\) et par \(\vec v\) ;</li>
      <li><strong>sommets</strong> \(\Omega \pm a\,\vec u\) (et \(\Omega \pm b\,\vec v\) pour l'ellipse) ; <strong>foyers</strong> \(\Omega \pm c\,\vec u\) ;</li>
      <li><strong>directrices</strong> : les droites orthogonales à \(\vec u\) d'équations \(X = \pm a^2/c\), soit \(\vec u\cdot\overrightarrow{\Omega M} = \pm a^2/c\) ;</li>
      <li><strong>asymptotes</strong> d'une hyperbole : les droites passant par \(\Omega\), dirigées par \(a\,\vec u \pm b\,\vec v\) ;</li>
      <li><strong>excentricité</strong> : inchangée par un déplacement, elle se calcule dans le repère réduit.</li>
    </ul>
    Pour une parabole \(Y^2 = 2pX\) de sommet \(S\) : axe \((S,\vec u)\), foyer \(S + \frac p2\vec u\), directrice \(X = -\frac p2\).
  </div>
  <div class="prop-box">
    <strong>Grand axe d'une ellipse.</strong> Pour \(\lambda_1X^2 + \lambda_2Y^2 = h\) avec \(\lambda_1, \lambda_2, h \gt 0\), le demi-axe porté par \(\vec u\) vaut \(\sqrt{h/\lambda_1}\) : le <strong>grand axe</strong> est dirigé par le vecteur propre de la <strong>plus petite</strong> valeur propre.
  </div>
  <div class="prop-box">
    <strong>Asymptotes sans diagonaliser.</strong> Les directions asymptotiques sont celles qui annulent la partie quadratique : les droites \(y = tx\) avec \(a + 2bt + ct^2 = 0\) (plus la direction \(x = 0\) si \(c = 0\)). Il en existe exactement quand \(\det A \le 0\) : deux si \(\det A \lt 0\), une seule (celle de l'axe) pour le genre parabole, qui n'a pas d'asymptote. Pour une <strong>hyperbole</strong>, les asymptotes sont les deux droites de ces directions passant par le centre \(\Omega\).
  </div>
  <div class="notice"><strong>Tracé</strong> : placer \(\Omega\), tracer les axes \((\Omega,\vec u)\) et \((\Omega,\vec v)\) ; pour une hyperbole, le rectangle de sommets \(\Omega \pm a\vec u \pm b\vec v\) et ses diagonales (les asymptotes) ; puis les sommets. Contrôler avec un point simple de l'équation initiale (intersection avec un axe de coordonnées). Un paramétrage se transporte aussi : \(M(t) = \Omega + a\cos t\,\vec u + b\sin t\,\vec v\) pour une ellipse.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Asymptotes de l'hyperbole \(2x^2 + 6xy + 2y^2 = 5\) (voir §7).</span>
    <div class="content"><p>On résout \(2 + 6t + 2t^2 = 0\), soit \(t = \frac{-3 \pm \sqrt5}{2}\). Les asymptotes, qui passent par le centre \(O\), sont
    $$y = \frac{-3+\sqrt5}{2}\,x \qquad\text{et}\qquad y = \frac{-3-\sqrt5}{2}\,x .$$
    On retrouve les directions \(\vec u \pm \sqrt5\,\vec v\) données par l'équation réduite \(X^2 - Y^2/5 = 1\).</p></div>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="crd-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · MATRICES SYMÉTRIQUES ET CONIQUES</div>
  <h2>Stratégies pour les exercices</h2>
  <div class="method-box">
    <strong>Méthode 1 — Exploiter la symétrie avant de calculer</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Repérer.</span> Si \(A^{\mathsf T} = A\) et \(A\) est réelle, on peut affirmer sans calcul : valeurs propres réelles, \(A\) diagonalisable, et même en base orthonormale.</li>
      <li><span class="step">Compter.</span> Le rang donne les dimensions : \(\dim E_\lambda = n - \operatorname{rg}(A - \lambda I_n)\), égale à la multiplicité de \(\lambda\). Une matrice \(A - \lambda I_n\) de rang 1 révèle une valeur propre de multiplicité \(n - 1\).</li>
      <li><span class="step">Compléter.</span> La trace est la somme des valeurs propres comptées avec multiplicité : la dernière s'en déduit souvent.</li>
      <li><span class="step">Orthogonaliser.</span> Le dernier sous-espace propre est l'orthogonal de la somme des autres : inutile de résoudre un système de plus.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 2 — Diagonaliser \(A \in \mathcal{S}_n(\mathbb{R})\) dans \(O(n)\)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Étape 1.</span> Valeurs propres (racines de \(\chi_A\)) ; contrôler que leur somme vaut \(\operatorname{tr} A\).</li>
      <li><span class="step">Étape 2.</span> Une base de chaque \(E_\lambda = \operatorname{Ker}(A - \lambda I_n)\).</li>
      <li><span class="step">Étape 3.</span> Une base <strong>orthonormale</strong> de chaque \(E_\lambda\) : normer si \(\dim E_\lambda = 1\) ; sinon, procédé de Gram-Schmidt :
      $$\varepsilon_1 = \frac{e_1}{\|e_1\|},\qquad \varepsilon_2 = \frac{e_2 - \langle e_2,\varepsilon_1\rangle\,\varepsilon_1}{\|e_2 - \langle e_2,\varepsilon_1\rangle\,\varepsilon_1\|}.$$</li>
      <li><span class="step">Étape 4.</span> Juxtaposer les bases obtenues : \(P = (X_1 | \cdots | X_n) \in O(n)\) et \(D = \operatorname{diag}(\lambda_1,\dots,\lambda_n)\), <strong>dans le même ordre</strong>.</li>
      <li><span class="step">Contrôle.</span> Vérifier \(AX_j = \lambda_jX_j\), \(\|X_j\| = 1\) et, pour deux colonnes associées à la même valeur propre, \(X_i^{\mathsf T}X_j = 0\) (deux colonnes de valeurs propres différentes sont automatiquement orthogonales), plutôt que de calculer \(P^{\mathsf T}AP\).</li>
    </ol>
    <p>Inutile d'orthogonaliser entre eux des vecteurs de sous-espaces propres <strong>différents</strong> : ils le sont déjà.</p>
  </div>
  <div class="method-box">
    <strong>Méthode 3 — Obtenir directement une base orthonormée directe (\(P \in SO(2)\) ou \(SO(3)\))</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Dimension 2.</span> Choisir un vecteur propre unitaire \(\vec u = (\alpha, \beta)\), puis \(\vec v = (-\beta, \alpha)\) : \(P = \begin{pmatrix} \alpha & -\beta\\ \beta & \alpha\end{pmatrix}\) est la rotation d'angle \(\theta\) tel que \(\cos\theta = \alpha\), \(\sin\theta = \beta\).</li>
      <li><span class="step">Dimension 3, valeur propre double.</span> Si \(\lambda\) est simple, de vecteur propre \(\vec w\), le sous-espace propre de l'autre valeur propre est le plan \(\vec w^{\perp}\) : son équation se lit sur les coordonnées de \(\vec w\).</li>
      <li><span class="step">Produit vectoriel.</span> Prendre \(X_1\) unitaire dans \(E_\lambda\), \(X_2\) unitaire dans le plan (coordonnées simples, l'une nulle), puis \(X_3 = X_1 \wedge X_2\) : il est unitaire, dans le plan, et \((X_1, X_2, X_3)\) est directe.</li>
      <li><span class="step">Corriger l'orientation.</span> Si \(\det P = -1\), remplacer une colonne par son opposée (\(D\) inchangée) ou échanger deux colonnes (et les deux valeurs propres correspondantes de \(D\)).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 4 — Réduire une conique (méthode générale)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Écrire</span> \(A\) (moitié du coefficient de \(xy\) hors diagonale), \(L = (d\ \ e)\) et \(f\).</li>
      <li><span class="step">Genre</span> : signe de \(\det A = ac - b^2\).</li>
      <li><span class="step">Diagonaliser</span> \(A\) avec \(P \in SO(2)\) : \(P^{\mathsf T}AP = \operatorname{diag}(\lambda_1, \lambda_2)\).</li>
      <li><span class="step">Rotation</span> : écrire \(\lambda_1x'^2 + \lambda_2y'^2 + d'x' + e'y' + f = 0\) avec \((d'\ \ e') = LP\).</li>
      <li><span class="step">Translation</span> : compléter les carrés, poser \(X = x' + \alpha\), \(Y = y' + \beta\).</li>
      <li><span class="step">Conclure</span> : équation réduite, nature, \(a\), \(b\), \(c\), \(e\) ; puis revenir au repère initial (méthode 6).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 5 — Conique à centre : commencer par le centre</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Vérifier</span> que \(\det A \ne 0\).</li>
      <li><span class="step">Centre</span> : résoudre \(\partial F/\partial x = 0\) et \(\partial F/\partial y = 0\) (système linéaire \(2\times2\)).</li>
      <li><span class="step">Constante</span> : \(h = -F(x_0,y_0) = -f - \frac{d\,x_0 + e\,y_0}{2}\).</li>
      <li><span class="step">Diagonaliser</span> \(A\) : l'équation réduite est directement \(\lambda_1X^2 + \lambda_2Y^2 = h\).</li>
    </ol>
    <p>Avantage : ni produit \(LP\), ni complétion de carrés avec des racines carrées. Beaucoup moins d'erreurs de calcul.</p>
  </div>
  <div class="method-box">
    <strong>Méthode 6 — Revenir au repère initial et tracer</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Passage</span> : \(M = \Omega + X\vec u + Y\vec v\), soit \(X_M = X_\Omega + P\begin{pmatrix} X\\ Y\end{pmatrix}\).</li>
      <li><span class="step">Éléments</span> : sommets, foyers \(\Omega \pm c\,\vec u\), directrices \(\vec u\cdot\overrightarrow{\Omega M} = \pm a^2/c\), asymptotes passant par \(\Omega\) et dirigées par \(a\vec u \pm b\vec v\).</li>
      <li><span class="step">Raccourci asymptotes</span> : factoriser la partie quadratique \(ax^2 + 2bxy + cy^2\) en produit de deux facteurs du premier degré ; les asymptotes leur sont parallèles et passent par \(\Omega\).</li>
      <li><span class="step">Tracé et contrôle</span> : centre, axes, rectangle et asymptotes, sommets ; vérifier un point de l'équation initiale (par exemple sur la droite \(x = 0\)).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 7 — Étudier une famille de coniques \(\mathcal{C}_m\)</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Genre</span> : calculer \(\det A(m)\) et dresser son tableau de signes.</li>
      <li><span class="step">Nature</span> : quand \(\det A(m) \ne 0\), calculer le centre et \(h(m)\) ; pour les valeurs qui annulent \(\det A(m)\), traiter l'équation à part (une identité remarquable apparaît souvent).</li>
      <li><span class="step">Points communs</span> : écrire \(F_m = F_0 + mF_1\) ; les points communs à toutes les \(\mathcal{C}_m\) vérifient \(F_0 = F_1 = 0\).</li>
      <li><span class="step">Synthèse</span> : un tableau « valeurs de \(m\) / genre / nature », sans oublier les cas limites (\(h(m) = 0\) : conique dégénérée).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Pièges</strong>
    <ul style="margin-top:.4rem">
      <li>Recopier tel quel le coefficient de \(xy\) hors de la diagonale : si l'équation contient \(2b\,xy\), la matrice contient \(b\).</li>
      <li>Laisser des vecteurs propres non unitaires dans \(P\) : on n'a plus \(P^{-1} = P^{\mathsf T}\), et la « rotation » déforme les longueurs.</li>
      <li>Ranger les valeurs propres de \(D\) dans un ordre différent de celui des colonnes de \(P\).</li>
      <li>Calculer \(LP\) dans le mauvais sens : \(L\) est une <strong>ligne</strong>, on effectue \(L \times P\).</li>
      <li>Confondre genre et nature : une conique du genre ellipse peut être un point ou le vide.</li>
      <li>Ellipse : \(c^2 = a^2 - b^2\) ; hyperbole : \(c^2 = a^2 + b^2\).</li>
      <li>Donner les foyers dans le repère réduit en oubliant de revenir au repère initial.</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Structure de \(\mathcal{S}_n(\mathbb{R})\)</h3>
  <div class="statement">On travaille d'abord dans \(\mathcal{M}_3(\mathbb{R})\), puis dans \(\mathcal{M}_n(\mathbb{R})\).</div>
  <div class="q"><strong>Q1.</strong> Donner une base et la dimension de \(\mathcal{S}_3(\mathbb{R})\).</div>
  <div class="q"><strong>Q2.</strong> Écrire \(M = \begin{pmatrix} 1 & 4 & 0\\ 0 & 2 & -2\\ 6 & 2 & 3\end{pmatrix}\) comme somme d'une matrice symétrique et d'une matrice antisymétrique.</div>
  <div class="q"><strong>Q3.</strong> Soit \(A \in \mathcal{S}_n(\mathbb{R})\) n'ayant qu'une seule valeur propre \(\lambda\). Montrer que \(A = \lambda I_n\).</div>
  <div class="q"><strong>Q4.</strong> Le résultat de Q3 subsiste-t-il pour une matrice non symétrique ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Une matrice symétrique d'ordre 3 s'écrit \(\begin{pmatrix} a & d & e\\ d & b & f\\ e & f & c\end{pmatrix}\) : six paramètres libres. Une base est formée des six matrices \(E_{11}\), \(E_{22}\), \(E_{33}\), \(E_{12}+E_{21}\), \(E_{13}+E_{31}\), \(E_{23}+E_{32}\), donc \(\dim \mathcal{S}_3(\mathbb{R}) = 6 = \frac{3\times 4}{2}\).</p>
    <p><strong>Q2.</strong> \(M^{\mathsf T} = \begin{pmatrix} 1 & 0 & 6\\ 4 & 2 & 2\\ 0 & -2 & 3\end{pmatrix}\), d'où
    $$S = \frac{M + M^{\mathsf T}}{2} = \begin{pmatrix} 1 & 2 & 3\\ 2 & 2 & 0\\ 3 & 0 & 3\end{pmatrix},$$
    $$T = \frac{M - M^{\mathsf T}}{2} = \begin{pmatrix} 0 & 2 & -3\\ -2 & 0 & -2\\ 3 & 2 & 0\end{pmatrix}.$$
    On vérifie \(S^{\mathsf T} = S\), \(T^{\mathsf T} = -T\) et \(S + T = M\). La décomposition est unique car \(\mathcal{S}_3(\mathbb{R}) \cap \mathcal{A}_3(\mathbb{R}) = \{0\}\).</p>
    <p><strong>Q3.</strong> Par le théorème spectral, \(A = PDP^{\mathsf T}\) avec \(P\) orthogonale et \(D\) diagonale portant les valeurs propres de \(A\) : ici \(D = \lambda I_n\). Donc \(A = P(\lambda I_n)P^{\mathsf T} = \lambda PP^{\mathsf T} = \lambda I_n\).</p>
    <p><strong>Q4.</strong> Non : \(N = \begin{pmatrix} 1 & 1\\ 0 & 1\end{pmatrix}\) a pour seule valeur propre \(1\), mais \(N \ne I_2\) (elle n'est pas diagonalisable). La symétrie est essentielle.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Diagonalisation dans \(SO(2)\) et somme de carrés</h3>
  <div class="statement">Soit \(A = \begin{pmatrix} 2 & 3\\ 3 & 10\end{pmatrix}\) et \(q(x,y) = 2x^2 + 6xy + 10y^2\).</div>
  <div class="q"><strong>Q1.</strong> Justifier sans calcul que \(A\) est diagonalisable dans une base orthonormale.</div>
  <div class="q"><strong>Q2.</strong> Déterminer les valeurs propres et les sous-espaces propres de \(A\).</div>
  <div class="q"><strong>Q3.</strong> Trouver \(P \in SO(2)\) et \(D\) diagonale telles que \(P^{\mathsf T}AP = D\). Quel est l'angle de la rotation \(P\) ?</div>
  <div class="q"><strong>Q4.</strong> En déduire que \(q(x,y) \gt 0\) pour \((x,y) \ne (0,0)\), et écrire \(q\) comme combinaison de deux carrés.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(A\) est réelle et symétrique : le théorème spectral s'applique.</p>
    <p><strong>Q2.</strong> \(\chi_A(X) = X^2 - 12X + 11\) \(= (X - 1)(X - 11)\). Pour \(11\) : \((A - 11I_2)X = 0\) \(\iff -9x + 3y = 0\) \(\iff y = 3x\), donc \(E_{11} = \operatorname{Vect}\big((1,3)\big)\). Pour \(1\) : \(x + 3y = 0\), donc \(E_1 = \operatorname{Vect}\big((-3,1)\big)\). On vérifie l'orthogonalité : \(1\times(-3) + 3\times 1 = 0\).</p>
    <p><strong>Q3.</strong> On prend \(\vec u = \frac{1}{\sqrt{10}}(1,3)\) puis \(\vec v = \frac{1}{\sqrt{10}}(-3,1)\) (image de \(\vec u\) par le quart de tour direct) :
    $$P = \frac{1}{\sqrt{10}}\begin{pmatrix} 1 & -3\\ 3 & 1\end{pmatrix} \in SO(2),$$
    et \(D = \operatorname{diag}(11, 1)\).
    \(P\) est la rotation d'angle \(\theta\) tel que \(\cos\theta = \frac{1}{\sqrt{10}}\), \(\sin\theta = \frac{3}{\sqrt{10}}\), soit \(\theta = \arctan 3 \approx 71{,}6^\circ\). Contrôle : \(\tan 2\theta = \frac{6}{1-9} = -\frac34 = \frac{2b}{a-c}\).</p>
    <p><strong>Q4.</strong> Avec \(\begin{pmatrix} x'\\ y'\end{pmatrix} = P^{\mathsf T}\begin{pmatrix} x\\ y\end{pmatrix}\), soit \(x' = \frac{x + 3y}{\sqrt{10}}\) et \(y' = \frac{-3x + y}{\sqrt{10}}\), on a \(q = 11x'^2 + y'^2\), strictement positif sauf si \(x' = y' = 0\), c'est-à-dire \((x,y) = (0,0)\) (\(P^{\mathsf T}\) est inversible). Explicitement :
    $$q(x,y) = \frac{11}{10}(x + 3y)^2 + \frac{1}{10}(3x - y)^2 ,$$
    ce que l'on vérifie en développant : \(\frac{(11+9)x^2 + (66-6)xy + (99+1)y^2}{10}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Matrice symétrique d'ordre 3 : diagonalisation dans \(SO(3)\)</h3>
  <div class="statement">On considère
  $$A = \begin{pmatrix} 5 & 2 & -4\\ 2 & 2 & -2\\ -4 & -2 & 5\end{pmatrix}.$$</div>
  <div class="q"><strong>Q1.</strong> Calculer le rang de \(A - I_3\). Qu'en déduit-on ?</div>
  <div class="q"><strong>Q2.</strong> À l'aide de la trace, trouver la dernière valeur propre ; préciser les sous-espaces propres.</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(P \in SO(3)\) et \(D\) diagonale telles que \(P^{\mathsf T}AP = D\).</div>
  <div class="q"><strong>Q4.</strong> Montrer qu'il existe \(B \in \mathcal{S}_3(\mathbb{R})\), à valeurs propres positives, telle que \(B^2 = A\). L'exprimer à l'aide de \(W = (2, 1, -2)^{\mathsf T}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(A - I_3 = \begin{pmatrix} 4 & 2 & -4\\ 2 & 1 & -2\\ -4 & -2 & 4\end{pmatrix}\) : toutes les lignes sont proportionnelles à \((2, 1, -2)\), donc \(\operatorname{rg}(A - I_3) = 1\). Ainsi \(1\) est valeur propre et \(\dim E_1 = 3 - 1 = 2\) ; \(A\) étant symétrique donc diagonalisable, \(1\) est de multiplicité exactement \(2\).</p>
    <p><strong>Q2.</strong> \(\operatorname{tr} A = 12 = 1 + 1 + \lambda\), donc \(\lambda = 10\). \(E_1\) est le plan d'équation \(2x + y - 2z = 0\) ; par orthogonalité, \(E_{10} = E_1^{\perp} = \operatorname{Vect}(W)\). Contrôle : \(AW = (20, 10, -20)^{\mathsf T} = 10\,W\).</p>
    <p><strong>Q3.</strong> On pose \(X_1 = \frac13(2, 1, -2)^{\mathsf T}\) (unitaire dans \(E_{10}\)). Dans le plan \(E_1\), on cherche un vecteur à coordonnées entières de norme entière : \(X_2 = \frac13(1, 2, 2)^{\mathsf T}\) convient (unitaire, et \(2 + 2 - 4 = 0\)). Puis
    $$X_3 = X_1 \wedge X_2 = \frac19\begin{pmatrix} 6\\ -6\\ 3\end{pmatrix} = \frac13\begin{pmatrix} 2\\ -2\\ 1\end{pmatrix},$$
    qui est unitaire et orthogonal à \(X_1\), donc dans \(E_1\). La base \((X_1, X_2, X_3)\) est orthonormée directe :
    $$P = \frac13\begin{pmatrix} 2 & 1 & 2\\ 1 & 2 & -2\\ -2 & 2 & 1\end{pmatrix} \in SO(3),$$
    et \(D = \operatorname{diag}(10, 1, 1)\). Ce choix de \(X_2\) donne une matrice \(P\) sans radicaux, plus agréable pour les calculs ; tout autre vecteur unitaire de \(E_1\) convenait.</p>
    <p><strong>Q4.</strong> Posons \(B = P\,\operatorname{diag}(\sqrt{10}, 1, 1)\,P^{\mathsf T}\). Elle est symétrique, de valeurs propres \(\sqrt{10}, 1, 1\), et \(B^2 = P\,\operatorname{diag}(10, 1, 1)\,P^{\mathsf T} = A\). Pour l'expliciter, on remarque que, pour toute \(\Delta = \operatorname{diag}(\delta_1, \delta_2, \delta_3)\), \(P\Delta P^{\mathsf T} = \sum_j \delta_j X_jX_j^{\mathsf T}\), et que \(\sum_j X_jX_j^{\mathsf T} = PP^{\mathsf T} = I_3\), d'où
    \(A = I_3 + WW^{\mathsf T}\) (puisque \(WW^{\mathsf T} = 9X_1X_1^{\mathsf T}\)) et
    $$B = I_3 + (\sqrt{10} - 1)X_1X_1^{\mathsf T},$$
    soit \(B = I_3 + \frac{\sqrt{10} - 1}{9}\,WW^{\mathsf T}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Réduire et tracer une ellipse inclinée</h3>
  <div class="statement">Dans un repère orthonormé direct \((O;\vec{\imath},\vec{\jmath})\), on considère la conique
  $$\mathcal{C} :\ 6x^2 - 4xy + 9y^2 - 8x - 14y + 1 = 0 .$$</div>
  <div class="q"><strong>Q1.</strong> Écrire \(A\), \(L\) et déterminer le genre de \(\mathcal{C}\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer une base orthonormée directe \((\vec u, \vec v)\) de vecteurs propres de \(A\) et l'angle \(\theta = (\vec{\imath}, \vec u)\).</div>
  <div class="q"><strong>Q3.</strong> Écrire l'équation de \(\mathcal{C}\) dans \((O;\vec u,\vec v)\), puis l'équation réduite. Nature ?</div>
  <div class="q"><strong>Q4.</strong> Coordonnées du centre \(\Omega\) dans \((O;\vec{\imath},\vec{\jmath})\) ; les retrouver par les dérivées partielles.</div>
  <div class="q"><strong>Q5.</strong> Sommets, foyers, excentricité et directrices dans le repère initial. Tracer \(\mathcal{C}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(A = \begin{pmatrix} 6 & -2\\ -2 & 9\end{pmatrix}\), \(L = (-8\ \ -14)\), \(f = 1\). \(\det A = 54 - 4 = 50 \gt 0\) : genre ellipse.</p>
    <p><strong>Q2.</strong> \(\chi_A(X) = X^2 - 15X + 50\) \(= (X - 5)(X - 10)\). Pour \(5\) : \(x - 2y = 0\), d'où \(\vec u = \frac{1}{\sqrt5}(2,1)\). Pour \(10\) : \(2x + y = 0\), d'où \(\vec v = \frac{1}{\sqrt5}(-1,2)\). Ainsi
    $$P = \frac{1}{\sqrt5}\begin{pmatrix} 2 & -1\\ 1 & 2\end{pmatrix} \in SO(2),$$
    \(P^{\mathsf T}AP = \operatorname{diag}(5, 10)\), et \(\tan\theta = \frac12\), soit \(\theta \approx 26{,}6^\circ\) (contrôle : \(\tan 2\theta = \frac43 = \frac{2b}{a-c}\)).</p>
    <p><strong>Q3.</strong> On calcule la nouvelle ligne :
    $$LP = \frac{1}{\sqrt5}\begin{pmatrix} -30 & -20\end{pmatrix} = \begin{pmatrix} -6\sqrt5 & -4\sqrt5\end{pmatrix}.$$
    Dans \((O;\vec u,\vec v)\) :
    $$5x'^2 + 10y'^2 - 6\sqrt5\,x' - 4\sqrt5\,y' + 1 = 0 .$$
    On complète les carrés :
    $$5x'^2 - 6\sqrt5\,x' = 5\Big(x' - \frac{3}{\sqrt5}\Big)^2 - 9,$$
    $$10y'^2 - 4\sqrt5\,y' = 10\Big(y' - \frac{1}{\sqrt5}\Big)^2 - 2.$$
    Avec \(X = x' - \frac{3}{\sqrt5}\), \(Y = y' - \frac{1}{\sqrt5}\) :
    $$5X^2 + 10Y^2 = 10 \iff \frac{X^2}{2} + Y^2 = 1 .$$
    C'est une ellipse de demi-axes \(a = \sqrt2\) (selon \(\vec u\)) et \(b = 1\) (selon \(\vec v\)).</p>
    <p><strong>Q4.</strong> \(\Omega\) a pour coordonnées \(\big(\frac{3}{\sqrt5}, \frac{1}{\sqrt5}\big)\) dans \((O;\vec u,\vec v)\), donc
    $$X_\Omega = P\begin{pmatrix} 3/\sqrt5\\ 1/\sqrt5\end{pmatrix} = \frac15\begin{pmatrix} 6 - 1\\ 3 + 2\end{pmatrix} = \begin{pmatrix} 1\\ 1\end{pmatrix}.$$
    Par les dérivées partielles : \(12x - 4y - 8 = 0\) et \(-4x + 18y - 14 = 0\), de solution \((1, 1)\). De plus \(F(1,1) = 1 + \frac{-8 - 14}{2} = -10\), ce qui redonne \(5X^2 + 10Y^2 = 10\).</p>
    <p><strong>Q5.</strong> \(c = \sqrt{a^2 - b^2} = 1\) et \(e = \frac{c}{a} = \frac{\sqrt2}{2} \approx 0{,}71\). Le grand axe est dirigé par \(\vec u\) (plus petite valeur propre \(5\)).</p>
    <ul>
      <li>Sommets du grand axe : \(\Omega \pm \sqrt2\,\vec u\) \(= \big(1 \pm \frac{2\sqrt{10}}{5},\ 1 \pm \frac{\sqrt{10}}{5}\big)\), soit environ \((2{,}26 ; 1{,}63)\) et \((-0{,}26 ; 0{,}37)\).</li>
      <li>Sommets du petit axe : \(\Omega \pm \vec v\) \(= \big(1 \mp \frac{1}{\sqrt5},\ 1 \pm \frac{2}{\sqrt5}\big)\), soit environ \((0{,}55 ; 1{,}89)\) et \((1{,}45 ; 0{,}11)\).</li>
      <li>Foyers : \(\Omega \pm \vec u\) \(= \big(1 \pm \frac{2}{\sqrt5},\ 1 \pm \frac{1}{\sqrt5}\big)\), soit environ \((1{,}89 ; 1{,}45)\) et \((0{,}11 ; 0{,}55)\).</li>
      <li>Directrices \(X = \pm\frac{a^2}{c} = \pm 2\) : \(\frac{2(x-1) + (y-1)}{\sqrt5} = \pm 2\), soit \(2x + y - 3 = \pm 2\sqrt5\).</li>
    </ul>
    <p>Contrôle du tracé : sur l'axe \(x = 0\), \(9y^2 - 14y + 1 = 0\) donne \(y = \frac{7 \pm 2\sqrt{10}}{9}\), soit environ \(1{,}48\) et \(0{,}08\) : l'ellipse coupe bien l'axe des ordonnées, conformément à la position du sommet \((-0{,}26 ; 0{,}37)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une parabole cachée</h3>
  <div class="statement">Dans un repère orthonormé direct, on considère
  $$\mathcal{P} :\ 9x^2 - 24xy + 16y^2 - 34x - 38y + 71 = 0 .$$</div>
  <div class="q"><strong>Q1.</strong> Montrer que la partie quadratique est un carré parfait. Quel est le genre de \(\mathcal{P}\) ?</div>
  <div class="q"><strong>Q2.</strong> Diagonaliser \(A\) dans \(SO(2)\).</div>
  <div class="q"><strong>Q3.</strong> Écrire l'équation dans \((O;\vec u,\vec v)\), puis l'équation réduite. Nature et paramètre \(p\) ?</div>
  <div class="q"><strong>Q4.</strong> Déterminer le sommet \(S\), l'axe, le foyer et la directrice dans le repère initial.</div>
  <div class="q"><strong>Q5.</strong> Vérifier que l'équation s'écrit \((3x - 4y + 1)^2\) \(= 10(4x + 3y - 7)\) et interpréter les droites \(3x - 4y + 1 = 0\) et \(4x + 3y - 7 = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(9x^2 - 24xy + 16y^2 = (3x - 4y)^2\). \(A = \begin{pmatrix} 9 & -12\\ -12 & 16\end{pmatrix}\) et \(\det A = 144 - 144 = 0\) : genre parabole.</p>
    <p><strong>Q2.</strong> Valeurs propres : \(0\) et \(\operatorname{tr} A = 25\). \(E_0\) : \(3x - 4y = 0\), d'où \(\vec u = \frac15(4,3)\) ; \(E_{25} = E_0^{\perp}\), d'où \(\vec v = \frac15(-3,4)\).
    $$P = \frac15\begin{pmatrix} 4 & -3\\ 3 & 4\end{pmatrix} \in SO(2),$$
    et \(P^{\mathsf T}AP = \operatorname{diag}(0, 25)\).</p>
    <p><strong>Q3.</strong> On calcule
    $$LP = \frac15\begin{pmatrix} -250 & -50\end{pmatrix} = \begin{pmatrix} -50 & -10\end{pmatrix},$$
    donc
    $$25y'^2 - 50x' - 10y' + 71 = 0 .$$
    Or \(25y'^2 - 10y' = 25\big(y' - \frac15\big)^2 - 1\), d'où \(25\big(y' - \frac15\big)^2 = 50\big(x' - \frac75\big)\). Avec \(X = x' - \frac75\) et \(Y = y' - \frac15\) : \(Y^2 = 2X\). C'est une parabole de paramètre \(p = 1\).</p>
    <p><strong>Q4.</strong> Le sommet a pour coordonnées \(\big(\frac75, \frac15\big)\) dans \((O;\vec u,\vec v)\), donc
    $$X_S = P\begin{pmatrix} 7/5\\ 1/5\end{pmatrix} = \frac{1}{25}\begin{pmatrix} 28 - 3\\ 21 + 4\end{pmatrix} = \begin{pmatrix} 1\\ 1\end{pmatrix},$$
    c'est-à-dire \(S(1,1)\).</p>
    <ul>
      <li>Axe : la droite \((S, \vec u)\), d'équation \(3(x - 1) - 4(y - 1) = 0\), soit \(3x - 4y + 1 = 0\).</li>
      <li>Foyer : \(S + \frac{p}{2}\vec u = \big(1 + \frac25,\ 1 + \frac{3}{10}\big)\), soit \(\big(\frac75, \frac{13}{10}\big)\).</li>
      <li>Directrice \(X = -\frac12\) : \(\frac{4(x-1) + 3(y-1)}{5} = -\frac12\), soit \(8x + 6y - 9 = 0\). Contrôle : la distance du foyer à cette droite vaut \(\frac{|56/5 + 39/5 - 9|}{10} = 1 = p\).</li>
    </ul>
    <p><strong>Q5.</strong> On développe :
    $$\begin{aligned}(3x - 4y + 1)^2 &= 9x^2 - 24xy + 16y^2\\ &\quad + 6x - 8y + 1 ;\end{aligned}$$
    en retranchant \(10(4x + 3y - 7)\) \(= 40x + 30y - 70\), on retrouve exactement le premier membre de l'équation de \(\mathcal{P}\). Interprétation : \(Y = \vec v\cdot\overrightarrow{SM} = \frac{-3x + 4y - 1}{5}\) et \(X = \vec u\cdot\overrightarrow{SM} = \frac{4x + 3y - 7}{5}\), donc l'égalité s'écrit \(25Y^2 = 50X\). La droite \(3x - 4y + 1 = 0\) (\(Y = 0\)) est l'<strong>axe</strong> de la parabole, et \(4x + 3y - 7 = 0\) (\(X = 0\)) sa <strong>tangente au sommet</strong>.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Une famille de coniques passant par deux points fixes</h3>
  <div class="statement">Pour \(m \in \mathbb{R}\), on note \(\mathcal{C}_m\) la courbe d'équation
  $$F_m(x,y) = x^2 + 4xy + m\,y^2 - 4x = 0 .$$</div>
  <div class="q"><strong>Q1.</strong> Montrer que toutes les \(\mathcal{C}_m\) passent par \(O\) et par \(B(4,0)\), et que deux courbes distinctes de la famille n'ont pas d'autre point commun.</div>
  <div class="q"><strong>Q2.</strong> Déterminer le genre de \(\mathcal{C}_m\) selon \(m\).</div>
  <div class="q"><strong>Q3.</strong> On suppose \(m \ne 4\). Déterminer le centre \(\Omega_m\), puis une équation réduite de la forme \(\lambda_1X^2 + \lambda_2Y^2 = h(m)\) sans calculer \(\lambda_1\) et \(\lambda_2\). En déduire la nature de \(\mathcal{C}_m\).</div>
  <div class="q"><strong>Q4.</strong> Nature de \(\mathcal{C}_4\) et de \(\mathcal{C}_0\) ?</div>
  <div class="q"><strong>Q5.</strong> Étudier complètement \(\mathcal{C}_1\) : équation réduite, sommets, foyers, excentricité et asymptotes dans le repère initial.</div>
  <div class="q"><strong>Q6.</strong> Montrer que toutes les \(\mathcal{C}_m\) ont la même tangente en \(O\). Pour quelle valeur de \(m\) la courbe \(\mathcal{C}_m\) est-elle une hyperbole équilatère ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(y = 0\), l'équation devient \(x^2 - 4x = 0\), soit \(x \in \{0, 4\}\) : \(O\) et \(B\) appartiennent à toutes les \(\mathcal{C}_m\). Si \(M \in \mathcal{C}_m \cap \mathcal{C}_{m'}\) avec \(m \ne m'\), la différence des équations donne \((m - m')y^2 = 0\), donc \(y = 0\), et l'on retrouve \(O\) ou \(B\).</p>
    <p><strong>Q2.</strong> \(A(m) = \begin{pmatrix} 1 & 2\\ 2 & m\end{pmatrix}\), \(\det A(m) = m - 4\). Genre ellipse si \(m \gt 4\), hyperbole si \(m \lt 4\), parabole si \(m = 4\).</p>
    <p><strong>Q3.</strong> Le système \(\frac{\partial F_m}{\partial x} = 2x + 4y - 4 = 0\), \(\frac{\partial F_m}{\partial y} = 4x + 2my = 0\) donne \(x = -\frac{my}{2}\), puis \((4 - m)\,y = 4\) :
    $$\Omega_m = \Big(\frac{-2m}{4 - m},\ \frac{4}{4 - m}\Big).$$
    Ensuite \(F_m(\Omega_m) = 0 + \frac{-4 \times \frac{-2m}{4-m}}{2} = \frac{4m}{4 - m}\). Dans le repère \((\Omega_m;\vec u,\vec v)\) des vecteurs propres :
    $$\lambda_1X^2 + \lambda_2Y^2 = h(m) = \frac{4m}{m - 4},$$
    avec \(\lambda_1\lambda_2 = \det A(m) = m - 4\) et \(\lambda_1 + \lambda_2 = \operatorname{tr} A(m) = 1 + m\).</p>
    <ul>
      <li>\(m \gt 4\) : \(\lambda_1\lambda_2 \gt 0\) et \(\lambda_1 + \lambda_2 \gt 0\), donc \(\lambda_1, \lambda_2 \gt 0\) ; de plus \(h(m) \gt 0\) : <strong>ellipse</strong> (jamais un cercle, puisque le terme en \(xy\) ne s'annule pas).</li>
      <li>\(m \lt 4\) et \(m \ne 0\) : \(\lambda_1\lambda_2 \lt 0\) et \(h(m) \ne 0\) : <strong>hyperbole</strong>.</li>
      <li>\(m = 0\) : \(h(0) = 0\), conique dégénérée (voir Q4).</li>
    </ul>
    <p><strong>Q4.</strong> Pour \(m = 4\) : \(x^2 + 4xy + 4y^2 - 4x = 0\) \(\iff (x + 2y)^2 = 4x\). Ici \(E_0 = \operatorname{Vect}\big((2,-1)\big)\) et le coefficient \(d'\) vaut \(L\cdot\frac{1}{\sqrt5}(2,-1) = -\frac{8}{\sqrt5} \ne 0\) : c'est une <strong>parabole</strong>. Pour \(m = 0\) : \(x^2 + 4xy - 4x = x\,(x + 4y - 4) = 0\) : réunion des <strong>deux droites sécantes</strong> \(x = 0\) et \(x + 4y - 4 = 0\), qui se coupent en \(\Omega_0(0, 1)\).</p>
    <p><strong>Q5.</strong> Pour \(m = 1\) : \(A(1) = \begin{pmatrix} 1 & 2\\ 2 & 1\end{pmatrix}\) (trace \(2\), déterminant \(-3\)) a pour valeurs propres \(3\) et \(-1\), de vecteurs propres unitaires \(\vec u = \frac{1}{\sqrt2}(1,1)\) et \(\vec v = \frac{1}{\sqrt2}(-1,1)\) : \(P\) est la rotation d'angle \(\frac{\pi}{4}\) (normal, puisque \(a = c\)). D'après Q3, \(\Omega_1 = \big(-\frac23, \frac43\big)\) et \(h(1) = -\frac43\) :
    $$3X^2 - Y^2 = -\frac43 \iff \frac{Y^2}{4/3} - \frac{X^2}{4/9} = 1 .$$
    Hyperbole d'axe focal \((\Omega_1, \vec v)\), avec \(a = \frac{2}{\sqrt3}\), \(b = \frac23\), \(c = \sqrt{\frac43 + \frac49} = \frac43\) et \(e = \frac ca = \frac{2}{\sqrt3} \approx 1{,}15\).</p>
    <ul>
      <li>Sommets \(\Omega_1 \pm a\,\vec v\) : \(\Big(\frac{-2 \mp \sqrt6}{3},\ \frac{4 \pm \sqrt6}{3}\Big)\).</li>
      <li>Foyers \(\Omega_1 \pm c\,\vec v\) : \(\Big(\frac{-2 \mp 2\sqrt2}{3},\ \frac{4 \pm 2\sqrt2}{3}\Big)\).</li>
      <li>Directrices \(Y = \pm\frac{a^2}{c} = \pm 1\), avec \(Y = \vec v\cdot\overrightarrow{\Omega_1M} = \frac{-x + y - 2}{\sqrt2}\) : \(y - x - 2 = \pm\sqrt2\).</li>
      <li>Asymptotes : \(1 + 4t + t^2 = 0\) donne \(t = -2 \pm \sqrt3\) ; ce sont les droites \(y - \frac43 = (-2 \pm \sqrt3)\big(x + \frac23\big)\). On retrouve les droites \(Y = \pm\sqrt3\,X\) du repère réduit.</li>
    </ul>
    <p><strong>Q6.</strong> \(\nabla F_m(x,y) = (2x + 4y - 4,\ 4x + 2my)\), donc \(\nabla F_m(0,0) = (-4, 0) \ne \vec 0\) : la tangente en \(O\) est orthogonale à \(\vec{\imath}\), c'est l'axe \(x = 0\), pour tout \(m\). Une hyperbole est équilatère si et seulement si \(\operatorname{tr} A = 0\), soit \(1 + m = 0\) : pour \(m = -1\) (qui vérifie bien \(m \lt 4\) et \(m \ne 0\)), \(\mathcal{C}_{-1}\) est une hyperbole équilatère. Contrôle : les pentes des asymptotes sont racines de \(-t^2 + 4t + 1 = 0\), de produit \(-1\) : elles sont perpendiculaires.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Une hyperbole inclinée et la famille de ses conjuguées</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format concours (thème <em>réduction des coniques</em>).</div>
  <div class="statement">Le plan est rapporté à un repère orthonormé direct \((O;\vec{\imath},\vec{\jmath})\). On note \(\mathcal{H}\) la courbe d'équation
  $$4x^2 + 24xy + 11y^2 + 16x - 2y - 29 = 0 .$$</div>
  <p class="exo-part">Partie A — Partie quadratique</p>
  <div class="q"><strong>A1.</strong> Écrire la matrice symétrique \(A\) associée et déterminer le genre de \(\mathcal{H}\).</div>
  <div class="q"><strong>A2.</strong> Déterminer une base orthonormée directe \((\vec u,\vec v)\) de vecteurs propres de \(A\), \(\vec u\) étant associé à la plus grande valeur propre. Préciser l'angle \(\theta = (\vec{\imath},\vec u)\).</div>
  <p class="exo-part">Partie B — Équation réduite et éléments géométriques</p>
  <div class="q"><strong>B1.</strong> Déterminer le centre \(\Omega\) de \(\mathcal{H}\).</div>
  <div class="q"><strong>B2.</strong> Écrire l'équation de \(\mathcal{H}\) dans le repère \((\Omega;\vec u,\vec v)\) ; en déduire sa nature, \(a\), \(b\), \(c\) et l'excentricité.</div>
  <div class="q"><strong>B3.</strong> Donner, dans le repère initial, les sommets, les foyers et les directrices.</div>
  <div class="q"><strong>B4.</strong> Déterminer les asymptotes. Vérifier que \(\mathcal{H}\) a pour équation \((2x + y - 1)(2x + 11y + 9) = 20\).</div>
  <p class="exo-part">Partie C — Paramétrage</p>
  <div class="q"><strong>C1.</strong> Paramétrer, à l'aide de \(\operatorname{ch}\) et \(\operatorname{sh}\), la branche de \(\mathcal{H}\) qui contient le sommet de plus grande abscisse.</div>
  <div class="q"><strong>C2.</strong> Montrer que les points de \(\mathcal{H}\) les plus proches de \(\Omega\) sont les sommets.</div>
  <p class="exo-part">Partie D — Une famille de coniques</p>
  <div class="q"><strong>D1.</strong> Pour \(k \in \mathbb{R}\), on note \(\mathcal{H}_k\) la courbe d'équation \((2x + y - 1)(2x + 11y + 9) = k\). Montrer que \(\mathcal{H}_k\) a le même centre que \(\mathcal{H}\) et donner son équation dans \((\Omega;\vec u,\vec v)\).</div>
  <div class="q"><strong>D2.</strong> Discuter la nature de \(\mathcal{H}_k\) selon \(k\) ; préciser l'axe focal et l'excentricité.</div>
  <div class="q"><strong>D3.</strong> Quelle courbe de la famille passe par \(O\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(A = \begin{pmatrix} 4 & 12\\ 12 & 11\end{pmatrix}\), \(L = (16\ \ -2)\), \(f = -29\). \(\det A = 44 - 144 = -100 \lt 0\) : genre hyperbole.</p>
    <p><strong>A2.</strong> \(\chi_A(X) = X^2 - 15X - 100\) \(= (X - 20)(X + 5)\). Pour \(20\) : \(-16x + 12y = 0\), soit \(4x = 3y\), d'où \(\vec u = \frac15(3, 4)\). Pour \(-5\) : \(E_{-5} = E_{20}^{\perp}\), d'où \(\vec v = \frac15(-4, 3)\).
    $$P = \frac15\begin{pmatrix} 3 & -4\\ 4 & 3\end{pmatrix} \in SO(2),$$
    et \(P^{\mathsf T}AP = \operatorname{diag}(20, -5)\).
    \(\cos\theta = \frac35\), \(\sin\theta = \frac45\), donc \(\theta = \arctan\frac43 \approx 53{,}1^\circ\) (contrôle : \(\tan 2\theta = -\frac{24}{7} = \frac{2b}{a-c}\)).</p>
    <p><strong>B1.</strong> \(\frac{\partial F}{\partial x} = 8x + 24y + 16 = 0\) et \(\frac{\partial F}{\partial y} = 24x + 22y - 2 = 0\), soit \(x + 3y = -2\) et \(12x + 11y = 1\). En reportant \(x = -3y - 2\) : \(-25y - 25 = 0\), donc \(y = -1\), \(x = 1\) : \(\Omega(1, -1)\).</p>
    <p><strong>B2.</strong> Par la formule du centre :
    $$F(\Omega) = -29 + \frac{16 + 2}{2} = -20 .$$
    Dans \((\Omega;\vec u,\vec v)\) :
    $$20X^2 - 5Y^2 = 20 \iff X^2 - \frac{Y^2}{4} = 1 .$$
    Hyperbole d'axe focal \((\Omega, \vec u)\), avec \(a = 1\), \(b = 2\), \(c = \sqrt{a^2 + b^2} = \sqrt5\) et \(e = \sqrt5\).</p>
    <p><strong>B3.</strong></p>
    <ul>
      <li>Sommets \(\Omega \pm \vec u\) : \(\big(\frac85, -\frac15\big)\) et \(\big(\frac25, -\frac95\big)\).</li>
      <li>Foyers \(\Omega \pm \sqrt5\,\vec u\) : \(\big(1 \pm \frac{3}{\sqrt5},\ -1 \pm \frac{4}{\sqrt5}\big)\).</li>
      <li>Directrices \(X = \pm\frac{a^2}{c} = \pm\frac{1}{\sqrt5}\) : \(\frac{3(x - 1) + 4(y + 1)}{5} = \pm\frac{1}{\sqrt5}\), soit \(3x + 4y + 1 = \pm\sqrt5\).</li>
    </ul>
    <p><strong>B4.</strong> Dans le repère réduit, les asymptotes sont \(Y = \pm 2X\) : elles passent par \(\Omega\) et sont dirigées par \(\vec u + 2\vec v = (-1, 2)\) et \(\vec u - 2\vec v = \frac15(11, -2)\). Leurs équations sont
    $$2x + y - 1 = 0 \qquad\text{et}\qquad 2x + 11y + 9 = 0 .$$
    En développant :
    $$\begin{aligned}&(2x + y - 1)(2x + 11y + 9)\\ &\quad = 4x^2 + 24xy + 11y^2 + 16x - 2y - 9,\end{aligned}$$
    donc l'équation de \(\mathcal{H}\) équivaut bien à \((2x + y - 1)(2x + 11y + 9) = 20\). On pouvait aussi factoriser directement la partie quadratique : \(4x^2 + 24xy + 11y^2\) \(= (2x + y)(2x + 11y)\).</p>
    <p><strong>C1.</strong> Le sommet de plus grande abscisse est \(\big(\frac85, -\frac15\big)\), obtenu pour \(X = 1\) : il s'agit de la branche \(X \gt 0\), paramétrée par \(X = \operatorname{ch} t\), \(Y = 2\operatorname{sh} t\). Avec \(M(t) = \Omega + \operatorname{ch} t\,\vec u + 2\operatorname{sh} t\,\vec v\) :
    $$x(t) = 1 + \frac{3\operatorname{ch} t - 8\operatorname{sh} t}{5},$$
    $$y(t) = -1 + \frac{4\operatorname{ch} t + 6\operatorname{sh} t}{5}, \qquad t \in \mathbb{R}.$$</p>
    <p><strong>C2.</strong> Pour \(M \in \mathcal{H}\), \(X^2 = 1 + \frac{Y^2}{4}\), donc \(\Omega M^2 = X^2 + Y^2\) \(= 1 + \frac54 Y^2 \ge 1\), avec égalité si et seulement si \(Y = 0\), c'est-à-dire aux deux sommets. La distance minimale vaut \(a = 1\).</p>
    <p><strong>D1.</strong> D'après B4, \(\mathcal{H}_k\) a pour équation
    $$4x^2 + 24xy + 11y^2 + 16x - 2y - 9 - k = 0 :$$
    mêmes \(A\) et \(L\) que \(\mathcal{H}\), donc même système pour le centre, qui reste \(\Omega\). Puis \(F_k(\Omega) = (-9 - k) + 9 = -k\), d'où l'équation \(20X^2 - 5Y^2 = k\).</p>
    <p><strong>D2.</strong></p>
    <ul>
      <li>\(k = 0\) : \(Y = \pm 2X\), la réunion des deux asymptotes (conique dégénérée).</li>
      <li>\(k \gt 0\) : \(\frac{X^2}{k/20} - \frac{Y^2}{k/5} = 1\), hyperbole d'axe focal \((\Omega, \vec u)\), avec \(\frac ba = 2\) et \(e = \sqrt{1 + 4} = \sqrt5\).</li>
      <li>\(k \lt 0\) : \(\frac{Y^2}{-k/5} - \frac{X^2}{-k/20} = 1\), hyperbole d'axe focal \((\Omega, \vec v)\), avec \(e^2 = 1 + \frac{-k/20}{-k/5} = \frac54\), soit \(e = \frac{\sqrt5}{2}\).</li>
    </ul>
    <p>Toutes ces hyperboles ont les mêmes asymptotes ; \(\mathcal{H}_k\) et \(\mathcal{H}_{-k}\) sont dites conjuguées.</p>
    <p><strong>D3.</strong> \(O \in \mathcal{H}_k\) \(\iff (-1)\times 9 = k\) \(\iff k = -9\) : c'est une hyperbole d'axe focal \((\Omega, \vec v)\), d'excentricité \(\frac{\sqrt5}{2}\), avec \(a' = \frac{3}{\sqrt5}\) et \(b' = \frac{3}{2\sqrt5}\).</p>
  </div>
