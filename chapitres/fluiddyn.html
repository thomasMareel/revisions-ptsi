<div class="hors-prog">
  <span class="hp-tag">Hors programme PTSI</span>
  <strong>La mécanique des fluides</strong> n'est <strong>pas au programme de PTSI</strong> : ni la dynamique, ni la statique (voir « Statique des fluides (aperçu) »). Débit, nombre de Reynolds, relation de Bernoulli, viscosité et pertes de charge (§1 à §3) relèvent de la <strong>2ᵉ année</strong> : cours complets dans <a href="#ecoulement/cours">« Description d'un fluide en écoulement »</a> et <a href="#ecoulreel/cours">« Écoulements visqueux et bilans en conduite »</a>. La tension superficielle (§4) n'est au programme d'aucune des deux années. Fiche conservée comme complément.
</div>
<div class="course-section">
  <div class="sec-num">§1 · DESCRIPTION D'UN ÉCOULEMENT</div>
  <h2>Lignes de courant — débit — régimes d'écoulement</h2>
  <div class="intro">La dynamique des fluides étudie les fluides en mouvement. L'équation de Bernoulli, analogue mécanique de la conservation de l'énergie, est l'outil de base pour les écoulements permanents non visqueux.</div>
  <h3>Lignes de courant et streamlines</h3>
  <div class="def-box">
    Une <strong>ligne de courant</strong> est tangente en chaque point au vecteur vitesse du fluide. En régime <strong>permanent</strong> (stationnaire), les lignes de courant coïncident avec les trajectoires des particules fluides.
  </div>
  <h3>Débit volumique et massique</h3>
  <div class="def-box">
    Pour un écoulement dans une canalisation de section \(S\) avec vitesse moyenne \(v\) :
    $$Q_v = S\cdot v \quad [\text{m}^3/\text{s}], \qquad Q_m = \rho Q_v \quad [\text{kg/s}]$$
    <strong>Conservation du débit</strong> (fluide incompressible) : \(Q_v = S_1 v_1 = S_2 v_2\) (équation de continuité).
  </div>
  <h3>Nombre de Reynolds</h3>
  <div class="def-box">
    $$Re = \frac{\rho v L}{\eta}$$
    \(\rho\) = masse volumique, \(v\) = vitesse, \(L\) = longueur caractéristique, \(\eta\) = viscosité dynamique. \(Re \ll 1\) : écoulement laminaire (couches parallèles). \(Re \gg 10^3\) : régime turbulent. Transition vers \(Re \approx 2000\) pour un tube.
  </div>
</div>
<div class="course-section">
  <div class="sec-num">§2 · THÉORÈME DE BERNOULLI</div>
  <h2>Conservation de l'énergie dans un fluide parfait</h2>
  <div class="intro">Le théorème de Bernoulli est la clé de la dynamique des fluides. Il relie pression, vitesse et altitude le long d'une ligne de courant pour un fluide parfait (sans viscosité) en écoulement permanent.</div>
  <h3>Équation de Bernoulli</h3>
  <div class="prop-box">
    Pour un fluide parfait, incompressible, en écoulement permanent, le long d'une ligne de courant :
    $$P + \frac{1}{2}\rho v^2 + \rho g z = \text{cste}$$
    \(P\) = pression statique, \(\frac{1}{2}\rho v^2\) = pression dynamique, \(\rho gz\) = pression hydrostatique. Toutes en Pa.
  </div>
  <h3>Applications classiques</h3>
  <div class="prop-box">
    <ul style="margin:.4rem 0">
      <li><strong>Vidange d'un réservoir (Torricelli) :</strong> \(v = \sqrt{2gh}\) où \(h\) est la hauteur de liquide au-dessus de l'orifice.</li>
      <li><strong>Effet Venturi :</strong> rétrécissement → augmentation de \(v\) → diminution de \(P\). Mesure de débit.</li>
      <li><strong>Portance aérodynamique :</strong> \(v_{dessus} > v_{dessous}\) → \(P_{dessus} < P_{dessous}\) → force vers le haut.</li>
      <li><strong>Pitot :</strong> tube face au vent → mesure de \(v = \sqrt{2\Delta P/\rho}\).</li>
    </ul>
  </div>
</div>
<div class="course-section">
  <div class="sec-num">§3 · VISCOSITÉ ET ÉCOULEMENT LAMINAIRE</div>
  <h2>Loi de Poiseuille — frottement visqueux</h2>
  <div class="intro">La viscosité est la résistance interne d'un fluide à l'écoulement. Elle dissipe de l'énergie et crée des pertes de charge dans les conduites.</div>
  <h3>Loi de Newton pour la viscosité</h3>
  <div class="def-box">
    Contrainte tangentielle entre couches fluides : \(\tau = \eta\frac{\mathrm{d}v}{\mathrm{d}y}\). \(\eta\) est la viscosité dynamique (Pa·s). Eau à 20°C : \(\eta \approx 10^{-3}\ \text{Pa·s}\). Air : \(\eta \approx 2\times10^{-5}\ \text{Pa·s}\). Miel : \(\eta \sim 10^{1}\ \text{Pa·s}\).
  </div>
  <h3>Loi de Poiseuille (écoulement laminaire en tube)</h3>
  <div class="prop-box">
    Débit volumique dans un tube de rayon \(R\) et longueur \(L\) avec gradient de pression \(\Delta P\) :
    $$Q_v = \frac{\pi R^4 \Delta P}{8\eta L}$$
    Profil de vitesse parabolique : \(v(r) = \frac{\Delta P}{4\eta L}(R^2-r^2)\). Vitesse maximale au centre, nulle à la paroi.
  </div>
  <h3>Pertes de charge</h3>
  <p>En régime turbulent, les pertes de charge sont plus importantes et proportionnelles à \(v^2\). En pratique, on utilise des abaques (Moody) pour estimer les pertes dans les canalisations industrielles.</p>
</div>
<div class="course-section">
  <div class="sec-num">§4 · TENSION SUPERFICIELLE</div>
  <h2>Interface liquide-gaz — capillarité</h2>
  <div class="def-box">
    La <strong>tension superficielle</strong> \(\gamma\) (N/m) est l'énergie par unité de surface d'une interface. Eau/air : \(\gamma \approx 72\ \text{mN/m}\). Surpression à l'intérieur d'une bulle de savon (deux interfaces) : \(\Delta P = 4\gamma/R\). Dans une bulle de liquide (une interface) : \(\Delta P = 2\gamma/R\) (loi de Laplace).
  </div>
</div>

<template class="pan-tpl" data-panneau="fd-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · DYNAMIQUE DES FLUIDES</div>
  <div class="method-box">
    <strong>Méthode 1 — Appliquer Bernoulli</strong>
    <ol style="margin-top:.4rem">
      <li>Identifier deux points A et B sur la même ligne de courant.</li>
      <li>Écrire \(P_A + \frac{1}{2}\rho v_A^2 + \rho gz_A = P_B + \frac{1}{2}\rho v_B^2 + \rho gz_B\).</li>
      <li>Utiliser la continuité \(S_Av_A = S_Bv_B\) pour relier les vitesses.</li>
      <li>Identifier les inconnues et résoudre.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 2 — Vidange par Torricelli</strong>
    <ol style="margin-top:.4rem">
      <li>Point 1 : surface libre (grande, \(v_1 \approx 0\), \(P_1 = P_{atm}\)).</li>
      <li>Point 2 : orifice (\(P_2 = P_{atm}\), altitude \(h\) plus basse).</li>
      <li>Bernoulli : \(\rho gz_1 = \frac{1}{2}\rho v_2^2 + \rho gz_2\) → \(v_2 = \sqrt{2g(z_1-z_2)} = \sqrt{2gh}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Méthode 3 — Calculer un débit (Venturi)</strong>
    <ol style="margin-top:.4rem">
      <li>Continuité : \(S_1v_1 = S_2v_2\).</li>
      <li>Bernoulli (même hauteur) : \(P_1 + \frac{1}{2}\rho v_1^2 = P_2 + \frac{1}{2}\rho v_2^2\).</li>
      <li>Exprimer \(v_1\) en fonction de \(\Delta P = P_1 - P_2\) et du rapport de sections.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Bernoulli ne s'applique que le long d'une ligne de courant (pas entre deux lignes différentes).</li>
      <li>Bernoulli suppose un fluide parfait (sans viscosité) et un écoulement permanent.</li>
      <li>Ne pas oublier le terme hydrostatique \(\rho gz\) quand les niveaux sont différents.</li>
      <li>La loi de Poiseuille ne s'applique qu'en régime laminaire (\(Re \ll 2000\)).</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Équation de continuité</h3>
  <div class="statement">L'eau circule dans une canalisation qui passe d'un diamètre \(d_1=8\ \text{cm}\) à \(d_2=4\ \text{cm}\). La vitesse dans la grande section est \(v_1=1\ \text{m/s}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les sections \(S_1\) et \(S_2\).</div>
  <div class="q"><strong>Q2.</strong> Calculer la vitesse \(v_2\) dans la petite section.</div>
  <div class="q"><strong>Q3.</strong> Calculer le débit volumique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S_1 = \pi(0{,}04)^2 = 5{,}03\times10^{-3}\ \text{m}^2\). \(S_2 = \pi(0{,}02)^2 = 1{,}26\times10^{-3}\ \text{m}^2\).</p>
    <p><strong>Q2.</strong> Continuité : \(v_2 = S_1v_1/S_2 = (d_1/d_2)^2\times v_1 = 4\times1 = 4\ \text{m/s}\). (Le rapport des sections = rapport des carrés des diamètres = 4.)</p>
    <p><strong>Q3.</strong> \(Q_v = S_1v_1 = 5{,}03\times10^{-3}\ \text{m}^3/\text{s} \approx 5\ \text{L/s}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Bernoulli — vidange par Torricelli</h3>
  <div class="statement">Un réservoir cylindrique (\(S = 0{,}1\ \text{m}^2\)) se vide par un orifice circulaire (\(s = 10\ \text{cm}^2 = 10^{-3}\ \text{m}^2\)) à sa base. Niveau initial \(h_0 = 1\ \text{m}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse de sortie initiale par Torricelli.</div>
  <div class="q"><strong>Q2.</strong> La surface est grande devant l'orifice. Écrire l'équation différentielle \(\mathrm{d}h/\mathrm{d}t = f(h)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le temps de vidange complet.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(v_{sortie} = \sqrt{2gh_0} = \sqrt{2\times9{,}81\times1} = 4{,}43\ \text{m/s}\).</p>
    <p><strong>Q2.</strong> Conservation du débit : \(S\frac{\mathrm{d}h}{\mathrm{d}t} = -s\sqrt{2gh}\) (le niveau baisse). \(\frac{\mathrm{d}h}{\mathrm{d}t} = -\frac{s}{S}\sqrt{2g}\sqrt{h} = -k\sqrt{h}\) avec \(k = (s/S)\sqrt{2g} = 0{,}01\times4{,}43 = 0{,}0443\ \text{s}^{-1}\sqrt{\text{m}}\).</p>
    <p><strong>Q3.</strong> Séparation : \(\mathrm{d}h/\sqrt{h} = -k\,\mathrm{d}t\) → \(2\sqrt{h} = 2\sqrt{h_0} - kt\). Vidange (\(h=0\)) : \(t_{vid} = 2\sqrt{h_0}/k = 2\times1/0{,}0443 \approx 45{,}1\ \text{s}\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Effet Venturi — mesure de débit</h3>
  <div class="statement">Un tube Venturi a \(D_1=10\ \text{cm}\) et \(D_2=5\ \text{cm}\). Le manomètre différentiel mesure \(\Delta P = P_1-P_2 = 2000\ \text{Pa}\). \(\rho_{eau}=1000\ \text{kg/m}^3\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(v_1\) en fonction de \(\Delta P\) et du rapport de sections.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(v_1\), \(v_2\) et le débit.</div>
  <div class="q"><strong>Q3.</strong> Calculer la pression dynamique à la section 2. Comparer à la pression atmosphérique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Continuité : \(v_2 = (S_1/S_2)v_1 = (D_1/D_2)^2 v_1 = 4v_1\). Bernoulli (même hauteur) : \(\Delta P = \frac{1}{2}\rho(v_2^2-v_1^2) = \frac{1}{2}\rho(16-1)v_1^2 = \frac{15\rho}{2}v_1^2\). \(v_1 = \sqrt{2\Delta P/(15\rho)}\).</p>
    <p><strong>Q2.</strong> \(v_1 = \sqrt{2\times2000/(15\times1000)} = \sqrt{0{,}267} = 0{,}516\ \text{m/s}\). \(v_2 = 4\times0{,}516 = 2{,}07\ \text{m/s}\). \(S_1 = \pi(0{,}05)^2 = 7{,}85\times10^{-3}\ \text{m}^2\). \(Q_v = 0{,}516\times7{,}85\times10^{-3} = 4{,}05\times10^{-3}\ \text{m}^3/\text{s} \approx 4\ \text{L/s}\).</p>
    <p><strong>Q3.</strong> \(P_{dyn,2} = \frac{1}{2}\rho v_2^2 = \frac{1}{2}\times1000\times(2{,}07)^2 = 2142\ \text{Pa}\). Comparé à \(P_{atm} = 10^5\ \text{Pa}\) : négligeable (2%). Les effets dynamiques sont souvent faibles par rapport à la pression statique dans les conduites basse vitesse.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Loi de Poiseuille — résistance hydraulique</h3>
  <div class="statement">Du sang (\(\eta=3\times10^{-3}\ \text{Pa·s}\)) coule dans une artériole de rayon \(R=50\ \mu\text{m}\) et longueur \(L=1\ \text{mm}\) sous une différence de pression \(\Delta P=100\ \text{Pa}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le débit par Poiseuille.</div>
  <div class="q"><strong>Q2.</strong> Calculer la résistance hydraulique \(\mathcal{R}_h = \Delta P/Q_v\) (analogue à la résistance électrique).</div>
  <div class="q"><strong>Q3.</strong> Calculer le nombre de Reynolds et vérifier que l'écoulement est laminaire.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(Q_v = \pi R^4\Delta P/(8\eta L) = \pi\times(50\times10^{-6})^4\times100/(8\times3\times10^{-3}\times10^{-3})\). \(R^4 = (5\times10^{-5})^4 = 6{,}25\times10^{-18}\ \text{m}^4\). \(Q_v = \pi\times6{,}25\times10^{-18}\times100/(24\times10^{-6}) = \pi\times6{,}25\times10^{-16}/24\times10^{-6} \approx 8{,}18\times10^{-11}\ \text{m}^3/\text{s} \approx 82\ \text{nL/s}\).</p>
    <p><strong>Q2.</strong> \(\mathcal{R}_h = 8\eta L/(\pi R^4) = \Delta P/Q_v = 100/(8{,}18\times10^{-11}) \approx 1{,}22\times10^{12}\ \text{Pa·s/m}^3\). Très élevée — les petits vaisseaux dominent la résistance vasculaire totale.</p>
    <p><strong>Q3.</strong> \(v_{moy} = Q_v/(\pi R^2) = 8{,}18\times10^{-11}/(\pi\times2{,}5\times10^{-9}) \approx 10{,}4\times10^{-3}\ \text{m/s}\). \(Re = \rho v (2R)/\eta = 1060\times10{,}4\times10^{-3}\times10^{-4}/3\times10^{-3} \approx 0{,}37 \ll 1\). Très laminaire ✓ (Stokes).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Portance — profil d'aile</h3>
  <div class="statement">Au-dessus d'une aile d'avion, la vitesse de l'air est \(v_{dessus}=80\ \text{m/s}\) ; en-dessous, \(v_{dessous}=60\ \text{m/s}\). \(\rho_{air}=1{,}2\ \text{kg/m}^3\). Surface de l'aile : \(S=50\ \text{m}^2\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la différence de pression entre dessous et dessus.</div>
  <div class="q"><strong>Q2.</strong> Calculer la force de portance.</div>
  <div class="q"><strong>Q3.</strong> Quelle masse maximale peut soulever cet avion ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Bernoulli (même altitude) : \(P_{dessous} + \frac{1}{2}\rho v_{dessous}^2 = P_{dessus} + \frac{1}{2}\rho v_{dessus}^2\). \(\Delta P = P_{dessous} - P_{dessus} = \frac{1}{2}\rho(v_{dessus}^2-v_{dessous}^2) = \frac{1}{2}\times1{,}2\times(6400-3600) = 1680\ \text{Pa}\).</p>
    <p><strong>Q2.</strong> \(F_{portance} = \Delta P\times S = 1680\times50 = 84\,000\ \text{N} = 84\ \text{kN}\).</p>
    <p><strong>Q3.</strong> \(m = F/g = 84000/9{,}81 \approx 8{,}6\ \text{t}\). (Modèle simplifié — en réalité l'angle d'attaque et les effets 3D sont importants.)</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Bernoulli avec prise en compte de la viscosité — pertes de charge</h3>
  <div class="statement">De l'eau (\(\rho=1000\ \text{kg/m}^3\)) coule dans un tuyau horizontal de diamètre \(d=2\ \text{cm}\), longueur \(L=10\ \text{m}\), avec un débit \(Q_v=0{,}5\ \text{L/s}\). \(\eta=10^{-3}\ \text{Pa·s}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la vitesse moyenne et le nombre de Reynolds.</div>
  <div class="q"><strong>Q2.</strong> L'écoulement est laminaire. Calculer la perte de charge \(\Delta P\) par Poiseuille.</div>
  <div class="q"><strong>Q3.</strong> Bernoulli avec pertes : \(P_1 = P_2 + \Delta P_{pertes}\). Calculer la puissance nécessaire pour maintenir le débit.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S = \pi(0{,}01)^2 = 3{,}14\times10^{-4}\ \text{m}^2\). \(v = Q_v/S = 5\times10^{-4}/(3{,}14\times10^{-4}) = 1{,}59\ \text{m/s}\). \(Re = \rho v d/\eta = 1000\times1{,}59\times0{,}02/10^{-3} = 31800\). Attention : \(Re \gg 2000\) → régime turbulent ! Poiseuille ne s'applique pas strictement, mais calculons pour l'exercice.</p>
    <p><strong>Q2.</strong> (En supposant laminaire pour l'exercice) : \(\Delta P = 8\eta L Q_v/(\pi R^4) = 8\times10^{-3}\times10\times5\times10^{-4}/(\pi\times10^{-8}) = 4\times10^{-5}/(\pi\times10^{-8}) \approx 1273\ \text{Pa}\). En pratique, en régime turbulent les pertes sont bien plus élevées (facteur ~10).</p>
    <p><strong>Q3.</strong> Puissance mécanique : \(\mathcal{P} = \Delta P\times Q_v = 1273\times5\times10^{-4} \approx 0{,}64\ \text{W}\). La pompe doit fournir cette puissance pour maintenir le débit contre les pertes visqueuses. Interprétation : l'énergie est dissipée en chaleur par viscosité.</p>
  </div>
</div>

  <p class="exo-part">Partie A — Vitesse et débit</p>
  <div class="q"><strong>A1.</strong> En appliquant le théorème de Bernoulli entre la surface libre et l'orifice, établir la vitesse d'éjection \(v = \sqrt{2gh}\) (Torricelli) et la calculer.</div>
  <div class="q"><strong>A2.</strong> En déduire le débit volumique \(Q\) à l'orifice.</div>
  <div class="q"><strong>A3.</strong> Justifier que la vitesse d'abaissement de la surface libre est négligeable devant \(v\).</div>

  <p class="exo-part">Partie B — Portée du jet</p>
  <div class="q"><strong>B1.</strong> Le jet sort horizontalement. À quelle distance du pied du réservoir touche-t-il le sol ? <em>(On réutilise la chute libre — chapitre cinématique.)</em></div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Bernoulli entre la surface (1) et l'orifice (2), tous deux à la pression atmosphérique, avec \(v_1\approx0\) : \(p_{atm} + \rho g h = p_{atm} + \tfrac12\rho v^2\), d'où \(v = \sqrt{2gh} = \sqrt{2\times9{,}8\times2{,}0} \approx 6{,}3\ \text{m/s}\).</p>
    <p><strong>A2.</strong> \(Q = s\,v = 1{,}0\times10^{-4}\times6{,}3 \approx 6{,}3\times10^{-4}\ \text{m}^3/\text{s} \approx 0{,}63\ \text{L/s}\).</p>
    <p><strong>A3.</strong> Conservation du débit : \(S\,v_{surf} = s\,v\), donc \(v_{surf} = (s/S)\,v \ll v\) car \(S \gg s\). C'est ce qui justifie \(v_1\approx0\) dans Bernoulli.</p>
    <p><strong>B1.</strong> Chute libre depuis la hauteur \(H\) : \(t = \sqrt{2H/g} = \sqrt{2\times1{,}0/9{,}8} \approx 0{,}45\ \text{s}\). Portée horizontale : \(d = v\,t = 6{,}3\times0{,}45 \approx 2{,}8\ \text{m}\).</p>
  </div>
