  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite la partie a) « Fonctions vectorielles à valeurs dans \(\mathbb{R}^n\) (\(n = 2\) ou 3) » de la section « Fonctions vectorielles d'une variable réelle et courbes paramétrées » du programme de PT. Il formalise des notions rencontrées en mécanique (position, vitesse, accélération) et fournit les outils de l'étude des courbes paramétrées, traitée dans le chapitre « Courbes planes paramétrées » (tangente, étude locale, branches infinies) et dans « Propriétés métriques des courbes planes » (longueur, courbure). Presque tout se ramène aux fonctions coordonnées, donc à l'analyse réelle de première année ; les règles de dérivation des produits sont le point vraiment nouveau.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>

      <ul>
        <li><strong>Fonctions à valeurs dans \(\mathbb{R}^2\) ou \(\mathbb{R}^3\)</strong>, fonctions coordonnées (§1).</li>
        <li><strong>Limite en un point, continuité en un point, continuité globale</strong> ; caractérisation par les fonctions coordonnées (§2).</li>
        <li><strong>Vecteur dérivé en un point</strong>, caractérisation par les fonctions coordonnées, <strong>interprétation cinématique</strong> ; fonction dérivée (§3).</li>
        <li><strong>Dérivée d'une combinaison linéaire, d'une composée, d'un produit</strong> : produit d'une fonction numérique par une fonction vectorielle, produit scalaire de deux fonctions vectorielles, produit vectoriel de deux fonctions à valeurs dans \(\mathbb{R}^3\) (§4).</li>
        <li><strong>Fonctions de classe \(C^k\)</strong> ; dérivées successives d'une combinaison linéaire ; <strong>formule de Leibniz</strong> pour le produit d'une fonction numérique par une fonction vectorielle (§5).</li>
        <li><strong>Formule de Taylor-Young</strong> (démonstration hors programme) ; <strong>développement limité</strong> d'une fonction de classe \(C^k\) au voisinage d'un point, calculé à l'aide des fonctions coordonnées (§6).</li>

<div class="course-section">
  <div class="sec-num">§1 · FONCTIONS À VALEURS DANS ℝ² OU ℝ³</div>
  <h2>Un vecteur qui dépend d'un paramètre</h2>
  <div class="intro">La position d'un mobile, le vecteur vitesse d'un fluide en un point fixe, un champ électrique tournant : autant de vecteurs qui dépendent d'une variable réelle, le plus souvent le temps. On les étudie à travers leurs coordonnées, ce qui ramène presque tout à l'analyse des fonctions réelles.</div>
  <div class="def-box">
    Soit \(I\) un intervalle de \(\mathbb{R}\) et \(n \in \{2, 3\}\). Une <strong>fonction vectorielle</strong> est une application \(f : I \to \mathbb{R}^n\). Ses <strong>fonctions coordonnées</strong> \(f_1, \ldots, f_n : I \to \mathbb{R}\) sont définies par
    <div class="formula" data-nom="Fonctions coordonnées">$$f(t) = \big(f_1(t), \ldots, f_n(t)\big) = \sum_{i=1}^n f_i(t)\,e_i,$$</div>
    où \((e_1, \ldots, e_n)\) est la base canonique. \(\mathbb{R}^n\) est muni de sa structure euclidienne canonique : produit scalaire \(\langle u, v\rangle = \sum u_i v_i\), norme \(\|u\| = \sqrt{\langle u, u\rangle}\), et, dans \(\mathbb{R}^3\), produit vectoriel \(u \wedge v\).
  </div>
  <p>En cinématique, \(f(t)\) représente le vecteur \(\overrightarrow{OM}(t)\) : l'ensemble des points \(M(t)\) est la <strong>trajectoire</strong>, ou <strong>support</strong> de la courbe paramétrée. En dimension 2, on identifie souvent \(\mathbb{R}^2\) à \(\mathbb{C}\) : \(f(t) = x(t) + i\,y(t)\), et les résultats de première année sur les fonctions à valeurs complexes s'appliquent, par exemple \(\frac{\mathrm{d}}{\mathrm{d}t}\,\mathrm{e}^{i\omega t} = i\omega\,\mathrm{e}^{i\omega t}\).</p>
  <div class="method-box">
    <strong>Exemple — reconnaître quelques trajectoires</strong>
    <ol>
      <li>\(f(t) = (2\cos t, \sin t)\) : les coordonnées vérifient \(\frac{x^2}{4} + y^2 = 1\). Le point parcourt l'ellipse de demi-axes 2 et 1 dans le sens trigonométrique, en un tour par période \(2\pi\).</li>
      <li>\(g(t) = R\,\mathrm{e}^{i\omega t}\) (\(R, \omega \gt 0\)), soit \((R\cos\omega t, R\sin\omega t)\) : mouvement circulaire uniforme de rayon \(R\), de période \(2\pi/\omega\).</li>
      <li>\(h(t) = (R\cos t, R\sin t, h_0 t)\) : la projection sur le plan \(xOy\) parcourt le cercle de rayon \(R\) pendant que la cote augmente régulièrement : c'est une <strong>hélice circulaire</strong> de pas \(2\pi h_0\), tracée sur le cylindre \(x^2 + y^2 = R^2\) (§7).</li>
      <li>\(c(t) = \big(R(t - \sin t), R(1 - \cos t)\big)\) : trajectoire d'un point d'une roue de rayon \(R\) qui roule sans glisser sur l'axe des abscisses, la <strong>cycloïde</strong> (§3).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LIMITE ET CONTINUITÉ</div>
  <h2>Tout se lit sur les coordonnées</h2>
  <div class="intro">La distance entre deux vecteurs se mesure avec la norme : \(f(t)\) tend vers \(\ell\) lorsque \(\|f(t) - \ell\|\) tend vers 0. Grâce à un encadrement élémentaire de la norme, cela revient à la convergence de chaque coordonnée.</div>
  <div class="def-box">
    Soit \(f : I \to \mathbb{R}^n\), \(t_0\) un point de \(I\) ou une extrémité de \(I\), et \(\ell \in \mathbb{R}^n\). On dit que \(f\) <strong>tend vers \(\ell\)</strong> en \(t_0\) si \(\|f(t) - \ell\| \to 0\) quand \(t \to t_0\). Si \(t_0 \in I\), \(f\) est <strong>continue en \(t_0\)</strong> lorsque \(f(t) \to f(t_0)\) ; elle est <strong>continue sur \(I\)</strong> si elle l'est en tout point de \(I\).
  </div>
  <div class="prop-box">
    <strong>Caractérisation par les coordonnées.</strong> \(f\) tend vers \(\ell = (\ell_1, \ldots, \ell_n)\) en \(t_0\) si et seulement si, pour tout \(i\), \(f_i(t) \to \ell_i\). En particulier, \(f\) est continue si et seulement si toutes ses fonctions coordonnées le sont.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Un encadrement de la norme par les coordonnées.</span>
    <div class="content">
      <p>Pour tout vecteur \(u\) de \(\mathbb{R}^n\) et tout \(i\), on a \(|u_i| \leq \|u\| \leq |u_1| + \cdots + |u_n|\) (la seconde inégalité s'obtient en élevant au carré). Avec \(u = f(t) - \ell\) :</p>
      <div class="formula">$$|f_i(t) - \ell_i| \leq \|f(t) - \ell\| \leq \sum_{j=1}^n |f_j(t) - \ell_j|.$$</div>
      <p>Si \(\|f(t) - \ell\| \to 0\), chaque \(|f_i(t) - \ell_i|\) tend vers 0 par l'inégalité de gauche ; réciproquement, si toutes les coordonnées convergent, la somme de droite tend vers 0.</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Opérations.</strong> Si \(f, g : I \to \mathbb{R}^n\) et \(\lambda : I \to \mathbb{R}\) sont continues, alors \(f + g\), \(\lambda f\), \(\langle f, g\rangle\), \(\|f\|\) et (si \(n = 3\)) \(f \wedge g\) sont continues : leurs coordonnées sont des sommes de produits de fonctions continues, et \(\big|\,\|u\| - \|v\|\,\big| \leq \|u - v\|\).
  </div>
  <div class="method-box">
    <strong>Exemple — prolonger par continuité</strong>
    <p>Soit \(f(t) = \Big(\dfrac{\sin t}{t},\ \dfrac{1 - \cos t}{t},\ t\ln t\Big)\) pour \(t \gt 0\).</p>
    <ol>
      <li>Coordonnée par coordonnée, quand \(t \to 0^+\) : \(\frac{\sin t}{t} \to 1\) (taux d'accroissement de \(\sin\) en 0), \(\frac{1 - \cos t}{t} \sim \frac{t}{2} \to 0\), et \(t\ln t \to 0\) (croissances comparées).</li>
      <li>Donc \(f(t) \to (1, 0, 0)\), et \(f\) se prolonge en une fonction continue sur \([0, +\infty[\) en posant \(f(0) = (1, 0, 0)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : déduire la convergence de \(f(t)\) de celle de \(\|f(t)\|\). Pour \(f(t) = (\cos t, \sin t)\), la norme vaut constamment 1, mais \(f(t)\) n'a pas de limite quand \(t \to +\infty\) : le point tourne indéfiniment sur le cercle. De même, si une seule coordonnée tend vers l'infini, \(f\) n'a pas de limite (branche infinie, étudiée dans le chapitre « Courbes planes paramétrées »).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · VECTEUR DÉRIVÉ ET INTERPRÉTATION CINÉMATIQUE</div>
  <h2>La vitesse, limite d'une vitesse moyenne</h2>
  <div class="intro">Entre les instants \(t_0\) et \(t_0 + h\), le mobile se déplace du vecteur \(f(t_0 + h) - f(t_0)\) ; divisé par \(h\), c'est sa vitesse moyenne. Le vecteur dérivé en est la limite : c'est la vitesse instantanée, et sa direction est celle de la tangente à la trajectoire.</div>
  <div class="def-box">
    \(f : I \to \mathbb{R}^n\) est <strong>dérivable en \(t_0 \in I\)</strong> si le taux d'accroissement admet une limite quand \(h \to 0\) :
    <div class="formula" data-nom="Vecteur dérivé">$$f'(t_0) = \lim_{h \to 0} \frac{f(t_0 + h) - f(t_0)}{h}.$$</div>
    Ce vecteur est le <strong>vecteur dérivé</strong> de \(f\) en \(t_0\). Si \(f\) est dérivable en tout point de \(I\), la <strong>fonction dérivée</strong> est \(f' : t \mapsto f'(t)\). On définit de même les dérivées à gauche et à droite.
  </div>
  <div class="prop-box">
    <strong>Caractérisation par les coordonnées.</strong> \(f\) est dérivable en \(t_0\) si et seulement si toutes ses fonctions coordonnées le sont, et alors
    <div class="formula" data-nom="Dérivée coordonnée par coordonnée">$$f'(t_0) = \big(f_1'(t_0), \ldots, f_n'(t_0)\big).$$</div>
    Une fonction dérivable est continue. De façon équivalente, \(f\) est dérivable en \(t_0\) si et seulement si elle admet un développement limité à l'ordre 1 : \(f(t_0 + h) = f(t_0) + h\,f'(t_0) + o(h)\).
  </div>
  <p>La caractérisation résulte de la proposition du §2, appliquée au taux d'accroissement, dont les coordonnées sont les taux d'accroissement des \(f_i\).</p>
  <div class="def-box">
    <strong>Interprétation cinématique.</strong> Si \(f(t) = \overrightarrow{OM}(t)\) est la position d'un point à l'instant \(t\) :
    <ul>
      <li>\(\vec v(t) = f'(t)\) est le <strong>vecteur vitesse</strong>, et \(\|f'(t)\|\) la vitesse scalaire (en m·s⁻¹) ;</li>
      <li>\(\vec a(t) = f''(t)\) est le <strong>vecteur accélération</strong> (en m·s⁻²).</li>
    </ul>
    <strong>Interprétation géométrique.</strong> Pour \(t \neq t_0\), le vecteur \(\frac{f(t) - f(t_0)}{t - t_0}\) dirige la corde \([M(t_0)M(t)]\). Si \(f'(t_0) \neq 0\), il tend vers \(f'(t_0)\) : le vecteur vitesse dirige la <strong>tangente</strong> à la trajectoire en \(M(t_0)\) (chapitre « Courbes planes paramétrées »).
  </div>
  <div class="method-box">
    <strong>Exemple — la cycloïde</strong>
    <p>Une roue de rayon \(R\) roule sans glisser sur l'axe des abscisses ; un point de la jante décrit \(M(t) = \big(R(t - \sin t),\ R(1 - \cos t)\big)\), et le centre de la roue est \(C(t) = (Rt, R)\).</p>
    <ol>
      <li>Vitesse : \(\vec v(t) = R\,(1 - \cos t,\ \sin t)\), de norme \(R\sqrt{2 - 2\cos t} = 2R\,\big|\sin\tfrac{t}{2}\big|\).</li>
      <li>La vitesse s'annule pour \(t = 2k\pi\) : quand il touche le sol, le point de la roue est instantanément immobile. Ce sont des <strong>points stationnaires</strong> de la trajectoire.</li>
      <li>Accélération : \(\vec a(t) = R\,(\sin t,\ \cos t)\), de norme constante \(R\). Comme \(C(t) - M(t) = R\,(\sin t, \cos t)\), on a \(\vec a(t) = \overrightarrow{MC}\) : l'accélération pointe toujours vers le centre de la roue.</li>
    </ol>
  </div>

    <strong>Exemple — une vitesse scalaire polynomiale</strong>
    <p>\(f(t) = \big(t,\ t^2,\ \tfrac23 t^3\big)\). Alors \(f'(t) = (1, 2t, 2t^2)\) et \(\|f'(t)\|^2 = 1 + 4t^2 + 4t^4 = (1 + 2t^2)^2\), donc \(\|f'(t)\| = 1 + 2t^2\). La distance parcourue sur la trajectoire entre \(t = 0\) et \(t = 1\) vaut \(\int_0^1 (1 + 2t^2)\,\mathrm{d}t = \frac53\) (longueur d'un arc : chapitre « Propriétés métriques des courbes planes »).</p>
  </div>

<div class="course-section">
  <div class="sec-num">§4 · RÈGLES DE CALCUL</div>
  <h2>Combinaisons, composées, produits</h2>
  <div class="intro">On dérive les fonctions vectorielles avec les mêmes réflexes que les fonctions réelles, à condition de respecter la nature des produits : produit d'un scalaire par un vecteur, produit scalaire, produit vectoriel. Ce dernier n'est pas commutatif : l'ordre des facteurs doit être conservé.</div>
  <div class="prop-box">
    <strong>Combinaison linéaire et composée.</strong> Soit \(f, g : I \to \mathbb{R}^n\) dérivables et \(\alpha, \beta\) des réels.
    <ul>
      <li>\((\alpha f + \beta g)' = \alpha f' + \beta g'\).</li>
      <li>Si \(\varphi : J \to I\) est une fonction réelle dérivable, alors \(f \circ \varphi\) est dérivable sur \(J\) et
        <div class="formula" data-nom="Dérivée d'une composée (fonction vectorielle)">$$(f \circ \varphi)'(s) = \varphi'(s)\,f'\big(\varphi(s)\big).$$</div></li>
    </ul>
    La seconde formule décrit un <strong>changement de paramétrage</strong> : parcourir la même trajectoire deux fois plus vite, avec \(\varphi(s) = 2s\), double le vecteur vitesse.
  </div>
  <div class="prop-box">
    <strong>Dérivées des produits.</strong> Soit \(\lambda : I \to \mathbb{R}\) et \(f, g : I \to \mathbb{R}^n\) dérivables. Alors \(\lambda f\), \(\langle f, g\rangle\) et (si \(n = 3\)) \(f \wedge g\) sont dérivables, et
    <div class="formula" data-nom="Dérivée d'un produit (fonctions vectorielles)">$$\begin{aligned} (\lambda f)' &= \lambda'\,f + \lambda\,f', \\ \langle f, g\rangle' &= \langle f', g\rangle + \langle f, g'\rangle, \\ (f \wedge g)' &= f' \wedge g + f \wedge g'. \end{aligned}$$</div>
    De même, en dimension 2, \(\det(f, g)' = \det(f', g) + \det(f, g')\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une seule preuve pour tous les produits « bilinéaires ».</span>
    <div class="content">
      <p>Chacun de ces produits est une application \(B(u, v)\) <strong>bilinéaire</strong> (linéaire par rapport à chaque facteur) dont les coordonnées sont des sommes de produits de coordonnées ; en particulier \(B\) est continue. Pour \(h \neq 0\) :</p>
      <div class="formula">$$\begin{aligned} &\frac{B\big(f(t+h), g(t+h)\big) - B\big(f(t), g(t)\big)}{h} \\ &\quad = B\Big(\frac{f(t+h) - f(t)}{h},\ g(t+h)\Big) \\ &\qquad + B\Big(f(t),\ \frac{g(t+h) - g(t)}{h}\Big). \end{aligned}$$</div>
      <p>Quand \(h \to 0\), \(g(t + h) \to g(t)\) (une fonction dérivable est continue) et les taux d'accroissement tendent vers \(f'(t)\) et \(g'(t)\) ; par continuité de \(B\), la limite vaut \(B(f'(t), g(t)) + B(f(t), g'(t))\). On peut aussi vérifier chaque formule sur les coordonnées : par exemple \(\langle f, g\rangle = \sum f_i g_i\) se dérive en \(\sum (f_i' g_i + f_i g_i')\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Conséquence : dérivée de la norme.</strong> \(\big(\|f\|^2\big)' = \langle f, f\rangle' = 2\,\langle f, f'\rangle\). Là où \(f\) ne s'annule pas, \(\|f\| = \sqrt{\|f\|^2}\) est dérivable et
    <div class="formula" data-nom="Dérivée de la norme">$$\|f\|' = \frac{\langle f, f'\rangle}{\|f\|}.$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — conservation de l'énergie d'un oscillateur dans l'espace</strong>
    <p>Un point de masse 1 est rappelé vers \(O\) par une force proportionnelle à la distance : \(f'' = -\omega^2 f\). On pose \(E(t) = \|f'(t)\|^2 + \omega^2\,\|f(t)\|^2\) (le double de l'énergie mécanique).</p>
    <ol>
      <li>Par la règle du produit scalaire et l'équation \(f'' = -\omega^2 f\) :
        <div class="formula">$$\begin{aligned} E' &= 2\,\langle f', f''\rangle + 2\omega^2\,\langle f, f'\rangle \\ &= 2\,\langle f', -\omega^2 f\rangle + 2\omega^2\,\langle f, f'\rangle = 0. \end{aligned}$$</div></li>
      <li>\(E\) est donc constante : énergie cinétique et énergie potentielle s'échangent sans perte.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — moment cinétique et force centrale</strong>
    <p>Pour \(f : I \to \mathbb{R}^3\) deux fois dérivable, posons \(\vec L = f \wedge f'\).</p>
    <ol>
      <li>\(\vec L\,' = f' \wedge f' + f \wedge f'' = f \wedge f''\), car \(u \wedge u = \vec 0\).</li>
      <li>Si l'accélération est <strong>centrale</strong> (\(f''(t)\) colinéaire à \(f(t)\) pour tout \(t\)), alors \(\vec L\,' = \vec 0\) : \(\vec L\) est constant. Le mouvement est alors plan et suit la loi des aires (exercice « Accélération centrale » de l'onglet Exercices).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : intervertir les facteurs du produit vectoriel en dérivant. \((f \wedge g)' = f' \wedge g + f \wedge g'\) ; écrire \(g' \wedge f\) au lieu de \(f \wedge g'\) change le signe du terme. Autre piège : \(\langle f, g\rangle' \neq \langle f', g'\rangle\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FONCTIONS DE CLASSE Cᵏ, FORMULE DE LEIBNIZ</div>
  <h2>Dériver plusieurs fois</h2>
  <div class="intro">L'accélération est la dérivée de la vitesse ; l'étude locale d'une courbe demande parfois des dérivées d'ordre 3 ou 4. On définit les dérivées successives et les classes \(C^k\) comme pour les fonctions réelles ; la formule de Leibniz donne les dérivées successives d'un produit.</div>
  <div class="def-box">
    On définit par récurrence les <strong>dérivées successives</strong> \(f^{(0)} = f\), \(f^{(k+1)} = \big(f^{(k)}\big)'\) lorsqu'elles existent. \(f\) est <strong>de classe \(C^k\)</strong> sur \(I\) si elle est \(k\) fois dérivable sur \(I\) et si \(f^{(k)}\) est continue ; elle est de classe \(C^\infty\) si elle est de classe \(C^k\) pour tout \(k\). C'est le cas si et seulement si toutes ses fonctions coordonnées sont de classe \(C^k\), et alors \(f^{(k)} = \big(f_1^{(k)}, \ldots, f_n^{(k)}\big)\).
  </div>
  <div class="prop-box">
    <strong>Combinaisons linéaires.</strong> L'ensemble \(C^k(I, \mathbb{R}^n)\) est un espace vectoriel, et \((\alpha f + \beta g)^{(k)} = \alpha f^{(k)} + \beta g^{(k)}\).
  </div>
  <div class="prop-box">
    <strong>Formule de Leibniz.</strong> Si \(\lambda : I \to \mathbb{R}\) et \(f : I \to \mathbb{R}^n\) sont \(m\) fois dérivables, alors \(\lambda f\) l'est aussi et
    <div class="formula" data-nom="Formule de Leibniz (fonction vectorielle)">$$(\lambda f)^{(m)} = \sum_{k=0}^{m} \binom{m}{k}\,\lambda^{(k)}\,f^{(m-k)}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Récurrence sur m, avec la formule de Pascal.</span>
    <div class="content">
      <p>Pour \(m = 0\), c'est évident ; pour \(m = 1\), c'est la règle \((\lambda f)' = \lambda' f + \lambda f'\). Supposons la formule vraie au rang \(m\), avec \(\lambda\), \(f\) dérivables \(m + 1\) fois. On dérive chaque terme de la somme avec la règle du produit :</p>
      <div class="formula">$$\begin{aligned} (\lambda f)^{(m+1)} &= \sum_{k=0}^{m} \binom{m}{k}\,\lambda^{(k+1)} f^{(m-k)} \\ &\quad + \sum_{k=0}^{m} \binom{m}{k}\,\lambda^{(k)} f^{(m+1-k)}. \end{aligned}$$</div>
      <p>En regroupant les termes en \(\lambda^{(k)} f^{(m+1-k)}\) (décalage d'indice dans la première somme), le coefficient obtenu est \(\binom{m}{k-1} + \binom{m}{k} = \binom{m+1}{k}\) (formule de Pascal) : c'est la formule au rang \(m + 1\). La même preuve donne des formules analogues pour \(\langle f, g\rangle\) et \(f \wedge g\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — dériver m fois \(t \mapsto t^2\,(\cos t, \sin t)\)</strong>
    <ol>
      <li>Avec \(u(t) = (\cos t, \sin t)\) : \(u'(t) = (-\sin t, \cos t)\), qui s'écrit aussi \(\big(\cos(t + \frac{\pi}{2}), \sin(t + \frac{\pi}{2})\big)\), donc \(u^{(k)}(t) = \big(\cos(t + k\frac{\pi}{2}), \sin(t + k\frac{\pi}{2})\big)\) : chaque dérivation fait tourner le vecteur d'un quart de tour.</li>
      <li>Avec \(\lambda(t) = t^2\) : \(\lambda' = 2t\), \(\lambda'' = 2\) et \(\lambda^{(k)} = 0\) pour \(k \geq 3\). Pour \(m \geq 2\), la formule de Leibniz ne garde que trois termes :
        <div class="formula">$$\begin{aligned} \big(t^2 u\big)^{(m)} = t^2\,u^{(m)} &+ 2m\,t\,u^{(m-1)} \\ &+ m(m-1)\,u^{(m-2)}. \end{aligned}$$</div></li>
      <li>En identifiant \(\mathbb{R}^2\) à \(\mathbb{C}\), la fonction est \(t^2\,\mathrm{e}^{it}\), et \(u^{(k)}\) correspond à \(i^k\,\mathrm{e}^{it}\) : on retrouve le même résultat.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · FORMULE DE TAYLOR-YOUNG ET DÉVELOPPEMENTS LIMITÉS</div>
  <h2>Approcher une courbe par des polynômes vectoriels</h2>
  <div class="intro">Au voisinage d'un instant \(t_0\), une fonction vectorielle régulière s'approche par un polynôme à coefficients vectoriels. C'est l'outil de l'étude locale des courbes paramétrées : le premier coefficient non nul donne la direction de la tangente, le suivant la position de la courbe par rapport à elle.</div>
  <div class="def-box">
    \(f\) admet un <strong>développement limité à l'ordre \(p\)</strong> en \(t_0\) s'il existe des vecteurs \(a_0, \ldots, a_p\) de \(\mathbb{R}^n\) tels que
    <div class="formula">$$f(t_0 + h) = a_0 + a_1 h + \cdots + a_p h^p + o(h^p),$$</div>
    où \(o(h^p)\) désigne un vecteur de la forme \(h^p\,\varepsilon(h)\) avec \(\varepsilon(h) \to 0\). Par le §2, cela équivaut à l'existence d'un développement limité à l'ordre \(p\) de chaque coordonnée ; les coefficients sont alors uniques.
  </div>
  <div class="prop-box">
    <strong>Formule de Taylor-Young.</strong> Si \(f\) est de classe \(C^p\) sur \(I\) et \(t_0 \in I\), alors (démonstration hors programme)
    <div class="formula" data-nom="Taylor-Young (fonction vectorielle)">$$f(t_0 + h) = \sum_{k=0}^{p} \frac{h^k}{k!}\,f^{(k)}(t_0) + o(h^p).$$</div>
    Coordonnée par coordonnée, c'est la formule de Taylor-Young de première année.
  </div>
  <div class="method-box">
    <strong>Méthode — calculer un développement limité vectoriel</strong>
    <ol>
      <li>Écrire le développement limité de chaque coordonnée <strong>au même ordre</strong>, avec les développements usuels.</li>
      <li>Regrouper les termes selon les puissances de \(h\) : le coefficient de \(h^k\) est un vecteur.</li>
      <li>Si besoin, lire les dérivées successives : \(f^{(k)}(t_0) = k!\,a_k\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — ordre 3 en 0</strong>
    <p>\(f(t) = \big(\cos t,\ \sin t,\ \ln(1 + t)\big)\).</p>
    <ol>
      <li>\(\cos t = 1 - \frac{t^2}{2} + o(t^3)\), \(\sin t = t - \frac{t^3}{6} + o(t^3)\), \(\ln(1 + t) = t - \frac{t^2}{2} + \frac{t^3}{3} + o(t^3)\).</li>
      <li>En regroupant :
        <div class="formula">$$\begin{aligned} f(t) = (1, 0, 0) &+ t\,(0, 1, 1) \\ &+ t^2\Big(-\frac12, 0, -\frac12\Big) \\ &+ t^3\Big(0, -\frac16, \frac13\Big) + o(t^3). \end{aligned}$$</div></li>
      <li>On en déduit \(f'(0) = (0, 1, 1)\), \(f''(0) = (-1, 0, -1)\) et \(f'''(0) = 6\,(0, -\frac16, \frac13) = (0, -1, 2)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la cycloïde en un point stationnaire</strong>
    <p>Pour \(R = 1\), \(M(t) = (t - \sin t,\ 1 - \cos t)\), en \(t = 0\).</p>
    <ol>
      <li>\(t - \sin t = \frac{t^3}{6} + o(t^3)\) et \(1 - \cos t = \frac{t^2}{2} + o(t^3)\), d'où
        <div class="formula">$$M(t) = t^2\Big(0, \frac12\Big) + t^3\Big(\frac16, 0\Big) + o(t^3).$$</div></li>
      <li>Le premier coefficient non nul, \((0, \frac12)\), dirige la tangente : elle est <strong>verticale</strong>, bien que la vitesse soit nulle.</li>
      <li>L'ordonnée \(\frac{t^2}{2}\) garde le même signe des deux côtés de \(t = 0\), tandis que l'abscisse \(\frac{t^3}{6}\) en change : les deux demi-arcs partent vers le haut, du même côté de la normale, mais de part et d'autre de la tangente. C'est un <strong>point de rebroussement</strong> de 1ʳᵉ espèce, visible sur la figure du §3 (classification des points dans le chapitre « Courbes planes paramétrées »).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : transposer aux fonctions vectorielles le théorème de Rolle ou l'égalité des accroissements finis. Pour \(f(t) = (\cos t, \sin t)\) sur \([0, 2\pi]\), on a \(f(2\pi) = f(0)\), mais \(f'(t) = (-\sin t, \cos t)\) n'est jamais nul. Les deux coordonnées ont chacune leur point de Rolle, mais pas au même instant. Seule une <strong>inégalité</strong> des accroissements finis subsiste (section finale).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · NORME CONSTANTE, MOUVEMENT CIRCULAIRE, HÉLICE</div>
  <h2>Trois applications classiques</h2>
  <div class="intro">La dérivée d'un produit scalaire suffit à traduire une propriété géométrique (rester sur une sphère, avancer à vitesse constante) en une relation d'orthogonalité. On en déduit les formules du mouvement circulaire et l'étude de l'hélice, très utilisées en mécanique.</div>
  <div class="prop-box">
    <strong>Norme constante.</strong> Soit \(f : I \to \mathbb{R}^n\) dérivable sur l'intervalle \(I\). Alors
    <div class="formula" data-nom="Norme constante et orthogonalité">$$\begin{aligned} &\|f\| \text{ est constante sur } I \\ \iff\ &\forall t \in I,\ \langle f(t), f'(t)\rangle = 0. \end{aligned}$$</div>
    Un point qui reste sur une sphère de centre \(O\) a une vitesse orthogonale au rayon. Appliqué à \(f'\) : la vitesse scalaire est constante (mouvement <strong>uniforme</strong>) si et seulement si l'accélération est orthogonale à la vitesse.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dériver le carré de la norme.</span>
    <div class="content"><p>\(\big(\|f\|^2\big)' = 2\,\langle f, f'\rangle\). Si \(\|f\|\) est constante, \(\|f\|^2\) aussi, et sa dérivée est nulle. Réciproquement, si \(\langle f, f'\rangle = 0\) sur \(I\), la fonction réelle \(\|f\|^2\) a une dérivée nulle sur un <strong>intervalle</strong> : elle est constante, donc \(\|f\| = \sqrt{\|f\|^2}\) aussi.</p></div>
  </div>
  <h3>Mouvement circulaire</h3>
  <p>On repère un point du cercle de centre \(O\) et de rayon \(R\) par l'angle \(\theta(t)\), fonction deux fois dérivable du temps, et l'on introduit la <strong>base polaire</strong> \(\vec u_r(\theta) = (\cos\theta, \sin\theta)\), \(\vec u_\theta(\theta) = (-\sin\theta, \cos\theta)\). On a \(\dfrac{\mathrm{d}\vec u_r}{\mathrm{d}\theta} = \vec u_\theta\) et \(\dfrac{\mathrm{d}\vec u_\theta}{\mathrm{d}\theta} = -\vec u_r\) ; par la règle de dérivation d'une composée (§4) :</p>
  <div class="formula" data-nom="Dérivées de la base polaire">$$\frac{\mathrm{d}}{\mathrm{d}t}\,\vec u_r\big(\theta(t)\big) = \theta'\,\vec u_\theta,\qquad \frac{\mathrm{d}}{\mathrm{d}t}\,\vec u_\theta\big(\theta(t)\big) = -\theta'\,\vec u_r.$$</div>
  <div class="prop-box">
    <strong>Vitesse et accélération sur un cercle.</strong> Pour \(\overrightarrow{OM}(t) = R\,\vec u_r(\theta(t))\) :
    <div class="formula" data-nom="Mouvement circulaire">$$\vec v = R\,\theta'\,\vec u_\theta,\qquad \vec a = -R\,\theta'^2\,\vec u_r + R\,\theta''\,\vec u_\theta.$$</div>
    Si le mouvement est uniforme (\(\theta' = \omega\) constante), \(\vec a = -R\omega^2\,\vec u_r = -\omega^2\,\overrightarrow{OM}\) : l'accélération est <strong>centripète</strong>, de norme \(R\omega^2 = \frac{v^2}{R}\).
  </div>
  <div class="method-box">
    <strong>Exemple — un mouvement circulaire accéléré</strong>
    <p>\(\theta(t) = t^2\) pour \(t \geq 0\).</p>
    <ol>
      <li>\(\theta' = 2t\) et \(\theta'' = 2\), donc \(\vec v = 2Rt\,\vec u_\theta\) : la vitesse scalaire \(2Rt\) croît linéairement.</li>
      <li>\(\vec a = -4Rt^2\,\vec u_r + 2R\,\vec u_\theta\) : la composante centripète \(4Rt^2\) traduit le changement de direction de la vitesse, la composante tangentielle \(2R\) l'augmentation de sa norme.</li>
      <li>Contrôle : la vitesse scalaire n'est pas constante, et en effet \(\langle \vec a, \vec v\rangle = 4R^2 t \neq 0\) pour \(t \gt 0\).</li>
    </ol>
  </div>
  <h3>Hélice circulaire</h3>
  <div class="method-box">
    <strong>Exemple — vitesse et accélération sur une hélice</strong>
    <p>\(f(t) = (R\cos t,\ R\sin t,\ h_0 t)\), avec \(R \gt 0\) et \(h_0 \gt 0\).</p>
    <ol>
      <li>\(f'(t) = (-R\sin t,\ R\cos t,\ h_0)\), de norme constante \(\sqrt{R^2 + h_0^2}\) : le mouvement est uniforme.</li>
      <li>L'angle \(\alpha\) entre la vitesse et l'axe \((Oz)\) vérifie \(\cos\alpha = \dfrac{h_0}{\sqrt{R^2 + h_0^2}}\), constant : l'hélice coupe les génératrices du cylindre sous un angle constant.</li>
      <li>\(f''(t) = (-R\cos t,\ -R\sin t,\ 0)\) : l'accélération est horizontale, dirigée vers l'axe, de norme \(R\). Elle est orthogonale à la vitesse, comme il se doit pour un mouvement uniforme.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Intégrale vectorielle, accroissements finis, repère de Frenet</h2>
  <div class="intro">Ces compléments ne sont pas exigibles ; ils prolongent naturellement le chapitre et éclairent la mécanique.</div>
  <h3>Intégrale et inégalité des accroissements finis</h3>
  <p>On intègre une fonction vectorielle continue coordonnée par coordonnée : \(\int_a^b f = \big(\int_a^b f_1, \ldots, \int_a^b f_n\big)\). Le théorème fondamental reste vrai : \(f(b) - f(a) = \int_a^b f'(t)\,\mathrm{d}t\) pour \(f\) de classe \(C^1\) (c'est ainsi que l'on obtient la position à partir de la vitesse), et l'on montre que \(\big\|\int_a^b f\big\| \leq \int_a^b \|f\|\). On en déduit l'<strong>inégalité des accroissements finis</strong> : si \(\|f'(t)\| \leq M\) sur \([a, b]\), alors \(\|f(b) - f(a)\| \leq M\,(b - a)\). Un mobile dont la vitesse scalaire ne dépasse jamais \(M\) ne peut pas s'éloigner de plus de \(M\,(b - a)\) de son point de départ. Seule cette inégalité survit, pas l'égalité (§6).</p>
  <h3>Repère de Frenet dans l'espace</h3>
  <p>Dans le plan, le repère de Frenet \((\vec T, \vec N)\) et la courbure sont étudiés dans le chapitre « Propriétés métriques des courbes planes ». Dans l'espace, on complète \(\vec T\) et \(\vec N\) par la binormale \(\vec B = \vec T \wedge \vec N\), et l'on définit une courbure et une torsion. Pour l'hélice, courbure et torsion sont constantes : \(\frac{R}{R^2 + h_0^2}\) et \(\frac{h_0}{R^2 + h_0^2}\).</p>
</div>

<template class="pan-tpl" data-panneau="fv-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · FONCTIONS VECTORIELLES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes ramènent l'étude d'une fonction vectorielle à ses coordonnées, puis donnent les réflexes de calcul propres aux vecteurs : dérivées de produits, norme constante, dérivées successives, développements limités et cinématique du mouvement circulaire.</div>

  <div class="method-box"><strong>Méthode 1 — Étudier une limite, une continuité, un prolongement</strong>
    <ol>
      <li>Écrire les fonctions coordonnées \(f_1, \ldots, f_n\).</li>
      <li>Étudier chacune avec les outils de l'analyse réelle : développements limités, équivalents, croissances comparées, encadrements.</li>
      <li>Conclure : \(f\) tend vers \(\ell\) si et seulement si chaque \(f_i\) tend vers \(\ell_i\) ; \(f\) est continue si et seulement si toutes ses coordonnées le sont. Pour prolonger par continuité en \(t_0\), poser \(f(t_0) = \ell\).</li>
      <li>Pour montrer qu'il n'y a pas de limite, une seule coordonnée sans limite suffit.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(f(t) = \Big(\dfrac{\mathrm{e}^t - 1}{t},\ t\sin\dfrac1t\Big)\), quand \(t \to 0\), la première coordonnée tend vers 1 (taux d'accroissement de l'exponentielle en 0) et la seconde vers 0 (elle est majorée par \(|t|\) en valeur absolue) : \(f(t) \to (1, 0)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la convergence de \(\|f(t)\|\) ne prouve pas celle de \(f(t)\). Pour \((\cos t, \sin t)\), la norme vaut toujours 1, mais le point tourne sans fin quand \(t \to +\infty\).</div>

  <div class="method-box"><strong>Méthode 2 — Calculer vitesse, accélération et vitesse scalaire</strong>
    <ol>
      <li>Dériver coordonnée par coordonnée : \(\vec v(t) = f'(t)\) et \(\vec a(t) = f''(t)\).</li>
      <li>Vitesse scalaire \(\|f'(t)\|\) : simplifier ce qu'il y a sous la racine (carré parfait, \(\cos^2 + \sin^2 = 1\), formules de trigonométrie).</li>
      <li>Points stationnaires : les instants où \(f'(t) = 0\), c'est-à-dire où toutes les coordonnées de la vitesse s'annulent en même temps.</li>
      <li>Interpréter : là où elle n'est pas nulle, la vitesse dirige la tangente à la trajectoire.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(f(t) = (t^2, t^3)\), \(\vec v(t) = (2t, 3t^2)\), de norme \(|t|\sqrt{4 + 9t^2}\), et \(\vec a(t) = (2, 6t)\). Le seul point stationnaire est obtenu pour \(t = 0\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Dériver un produit</strong>
    <ol>
      <li>Identifier la nature du produit : réel × vecteur, produit scalaire, produit vectoriel (dans \(\mathbb{R}^3\)), déterminant (dans \(\mathbb{R}^2\)).</li>
      <li>Appliquer la règle correspondante, en <strong>conservant l'ordre</strong> des facteurs :
      <div class="formula">$$\begin{aligned} (\lambda f)' &= \lambda'f + \lambda f', \\ \langle f, g\rangle' &= \langle f', g\rangle + \langle f, g'\rangle, \\ (f \wedge g)' &= f' \wedge g + f \wedge g', \\ \det(f, g)' &= \det(f', g) + \det(f, g'). \end{aligned}$$</div></li>
      <li>Simplifier avec \(u \wedge u = \vec 0\), \(\langle u, u\rangle = \|u\|^2\), \(\det(u, u) = 0\), et l'équation du mouvement si elle est connue.</li>
    </ol>
    <p><em>Exemple éclair :</em> si \(f\) est deux fois dérivable, \(\langle f, f'\rangle' = \|f'\|^2 + \langle f, f''\rangle\) et \((f \wedge f')' = f' \wedge f' + f \wedge f'' = f \wedge f''\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\langle f, g\rangle' \neq \langle f', g'\rangle\) ; et dans \((f \wedge g)'\), écrire \(g' \wedge f\) au lieu de \(f \wedge g'\) change le signe du terme.</div>

  <div class="method-box"><strong>Méthode 4 — Dériver une composée, changer de paramétrage</strong>
    <ol>
      <li>Si \(\varphi\) est une fonction réelle dérivable, \((f \circ \varphi)'(s) = \varphi'(s)\,f'\big(\varphi(s)\big)\) : la vitesse est multipliée par le réel \(\varphi'(s)\), sa direction est conservée (son sens est inversé si \(\varphi'(s) \lt 0\)).</li>
      <li>S'en servir pour dériver un vecteur qui dépend d'un angle lui-même fonction du temps, comme \(\vec u_r\big(\theta(t)\big)\) (méthode 9).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(f(t) = (\cos t, \sin t)\) et \(g(s) = f(s^2)\), \(g'(s) = 2s\,(-\sin s^2, \cos s^2)\), de norme \(2|s|\) : même cercle, parcouru à la vitesse \(2|s|\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Exploiter une norme constante, dériver une norme</strong>
    <ol>
      <li>Sur un intervalle, \(\|f\|\) est constante si et seulement si \(\langle f, f'\rangle = 0\) : on dérive \(\|f\|^2 = \langle f, f\rangle\).</li>
      <li>Appliqué à \(f'\) : le mouvement est uniforme (\(\|f'\|\) constante) si et seulement si \(\langle f', f''\rangle = 0\), c'est-à-dire si l'accélération est orthogonale à la vitesse.</li>
      <li>Là où \(f\) ne s'annule pas, \(\|f\|' = \dfrac{\langle f, f'\rangle}{\|f\|}\). Pour étudier une distance, étudier plutôt son carré \(\|f\|^2\), sans racine.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(f(t) = \big(t, \frac1t\big)\), \(t \gt 0\), \(\big(\|f\|^2\big)' = 2\langle f, f'\rangle = 2\big(t - \frac{1}{t^3}\big)\), négatif puis positif, nul pour \(t = 1\) : le point de cette branche d'hyperbole le plus proche de \(O\) est \((1, 1)\), à la distance \(\sqrt2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer des dérivées successives (formule de Leibniz)</strong>
    <ol>
      <li>Justifier la classe \(\mathcal{C}^m\) par les coordonnées.</li>
      <li>Pour un produit \(\lambda f\) d'une fonction réelle par une fonction vectorielle, appliquer \((\lambda f)^{(m)} = \sum_{k=0}^m\binom{m}{k}\lambda^{(k)}f^{(m-k)}\) ; si \(\lambda\) est un polynôme de degré \(d\), seuls \(d + 1\) termes restent.</li>
      <li>Dans \(\mathbb{R}^2\) identifié à \(\mathbb{C}\), une fonction \(t \mapsto \mathrm{e}^{i\omega t}\) a pour dérivée \(k\)-ième \((i\omega)^k\mathrm{e}^{i\omega t}\) : chaque dérivation fait tourner le vecteur d'un quart de tour et multiplie sa norme par \(\omega\).</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(u(t) = (\cos 2t, \sin 2t)\), \(u^{(k)}(t) = 2^k\big(\cos(2t + k\frac\pi2), \sin(2t + k\frac\pi2)\big)\), et pour \(m \geq 1\), seuls deux termes restent : \((t\,u)^{(m)} = t\,u^{(m)} + m\,u^{(m-1)}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Écrire un développement limité vectoriel</strong>
    <ol>
      <li>Développer chaque coordonnée <strong>au même ordre</strong>, avec les développements usuels (ou Taylor-Young).</li>
      <li>Regrouper selon les puissances de \(h\) : le coefficient de \(h^k\) est un vecteur \(a_k\).</li>
      <li>Si \(f\) est de classe \(\mathcal{C}^p\), lire les dérivées : \(f^{(k)}(t_0) = k!\,a_k\).</li>
    </ol>
    <p><em>Exemple éclair :</em> en 0, \(\mathrm{e}^t = 1 + t + \frac{t^2}{2} + o(t^2)\) et \(\sqrt{1 + 2t} = 1 + t - \frac{t^2}{2} + o(t^2)\), donc</p>
    <div class="formula">$$\big(\mathrm{e}^t, \sqrt{1 + 2t}\big) = (1, 1) + t\,(1, 1) + t^2\Big(\frac12, -\frac12\Big) + o(t^2),$$</div>
    <p>d'où \(f'(0) = (1, 1)\) et \(f''(0) = (1, -1)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Étudier une courbe près d'un point stationnaire</strong>
    <ol>
      <li>Développer \(f(t_0 + h) - f(t_0)\) jusqu'à obtenir deux coefficients non colinéaires : \(p\) est le premier indice tel que \(a_p \neq 0\), \(q\) le premier indice \(\gt p\) tel que \(a_q\) ne soit pas colinéaire à \(a_p\).</li>
      <li>Le vecteur \(a_p\) dirige la tangente, même si la vitesse est nulle.</li>
      <li>Les parités de \(p\) et \(q\) donnent l'allure (chapitre « Courbes planes paramétrées ») : \(p\) impair et \(q\) pair, point ordinaire ; \(p\) et \(q\) impairs, inflexion ; \(p\) pair et \(q\) impair, rebroussement de 1ʳᵉ espèce ; \(p\) et \(q\) pairs, rebroussement de 2ᵉ espèce.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(f(t) = (t^2, t^3)\) en 0, \(a_2 = (1, 0)\) et \(a_3 = (0, 1)\) : \(p = 2\), \(q = 3\), tangente horizontale et rebroussement de 1ʳᵉ espèce.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Traiter un mouvement circulaire avec la base polaire</strong>
    <ol>
      <li>Écrire \(\overrightarrow{OM}(t) = R\,\vec u_r\big(\theta(t)\big)\), avec \(\vec u_r = (\cos\theta, \sin\theta)\) et \(\vec u_\theta = (-\sin\theta, \cos\theta)\).</li>
      <li>Dériver par la règle de la composée : \(\frac{\mathrm{d}}{\mathrm{d}t}\vec u_r = \theta'\,\vec u_\theta\) et \(\frac{\mathrm{d}}{\mathrm{d}t}\vec u_\theta = -\theta'\,\vec u_r\).</li>
      <li>En déduire \(\vec v = R\theta'\,\vec u_\theta\) et \(\vec a = -R\theta'^2\,\vec u_r + R\theta''\,\vec u_\theta\) : composante centripète et composante tangentielle.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur un cercle de rayon 2 parcouru avec \(\theta(t) = 3t\), \(\vec v = 6\,\vec u_\theta\) et \(\vec a = -18\,\vec u_r\) : accélération centripète de norme \(18 = \frac{6^2}{2} = \frac{v^2}{R}\).</p>
  </div>
  <div class="notice"><strong>Pièges</strong> : \(\|f\|' \neq \|f'\|\) en général (mouvement circulaire uniforme : \(\|f\|' = 0\), \(\|f'\| = R\omega\)) ; le théorème de Rolle et l'égalité des accroissements finis ne s'étendent pas aux fonctions vectorielles ; une vitesse scalaire constante n'entraîne pas une accélération nulle.</div>
</div>

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Vitesse et accélération sur une hélice</h3>
  <div class="statement">Soit \(f(t) = (\cos t,\ \sin t,\ t)\) pour \(t \in \mathbb{R}\) (hélice circulaire).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(f'(t)\) et \(f''(t)\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\|f'(t)\|\) est constante.</div>
  <div class="q"><strong>Q3.</strong> Vérifier que l'accélération est orthogonale à la vitesse, et expliquer pourquoi c'était prévisible.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On dérive coordonnée par coordonnée : \(f'(t) = (-\sin t,\ \cos t,\ 1)\) et \(f''(t) = (-\cos t,\ -\sin t,\ 0)\).</p>
    <p><strong>Q2.</strong> \(\|f'(t)\| = \sqrt{\sin^2 t + \cos^2 t + 1} = \sqrt2\) : le mouvement le long de l'hélice est uniforme.</p>
    <p><strong>Q3.</strong> \(\langle f'(t), f''(t)\rangle = \sin t\cos t - \cos t\sin t\), qui est nul. C'était prévisible : \(\|f'\|^2\) est constante, donc sa dérivée \(2\langle f', f''\rangle\) est nulle. L'accélération est horizontale et dirigée vers l'axe \((Oz)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Mouvement sur une sphère</h3>
  <div class="statement">Soit \(f : I \to \mathbb{R}^3\) dérivable sur un intervalle \(I\), représentant la position d'un point.</div>
  <div class="q"><strong>Q1.</strong> On suppose que le point reste sur la sphère de centre \(O\) et de rayon \(R\) : \(\|f(t)\| = R\) pour tout \(t\). Montrer que la vitesse est orthogonale au vecteur position.</div>
  <div class="q"><strong>Q2.</strong> Réciproquement, on suppose \(\langle f(t), f'(t)\rangle = 0\) pour tout \(t \in I\). Montrer que le point reste sur une sphère de centre \(O\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\|f\|^2 = \langle f, f\rangle = R^2\) est constante. En dérivant (règle du produit scalaire) : \(2\langle f, f'\rangle = 0\), donc \(\langle f(t), f'(t)\rangle = 0\) : \(f'(t) \perp f(t)\).</p>
    <p><strong>Q2.</strong> La fonction réelle \(\|f\|^2\) a pour dérivée \(2\langle f, f'\rangle = 0\) sur l'<strong>intervalle</strong> \(I\) : elle est constante, égale à \(\|f(t_0)\|^2\) pour un \(t_0 \in I\) fixé. Le point reste sur la sphère de centre \(O\) et de rayon \(\|f(t_0)\|\). Sans l'hypothèse d'intervalle, la conclusion tombe : la constante peut changer d'un morceau à l'autre.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Dérivée d'un produit scalaire</h3>
  <div class="statement">Soient \(f, g : \mathbb{R} \to \mathbb{R}^3\) dérivables.</div>
  <div class="q"><strong>Q1.</strong> Exprimer la dérivée de \(t \mapsto \langle f(t), g(t)\rangle\).</div>
  <div class="q"><strong>Q2.</strong> Si \(\langle f, g\rangle\) est constante, que peut-on en déduire ? Que devient cette relation si \(g\) est un vecteur constant \(c\) ?</div>
  <div class="q"><strong>Q3.</strong> Application : \(f(t) = (\cos t,\ \sin t,\ 1 - \cos t - \sin t)\) et \(c = (1, 1, 1)\). Calculer \(\langle f(t), c\rangle\), en déduire une propriété de \(f'(t)\), la vérifier, et décrire la trajectoire.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\langle f, g\rangle' = \langle f', g\rangle + \langle f, g'\rangle\).</p>
    <p><strong>Q2.</strong> La dérivée est nulle : \(\langle f', g\rangle + \langle f, g'\rangle = 0\) pour tout \(t\). Si \(g = c\) est constant, \(g' = 0\) et il reste \(\langle f'(t), c\rangle = 0\) : la vitesse est orthogonale à \(c\).</p>
    <p><strong>Q3.</strong> \(\langle f(t), c\rangle = \cos t + \sin t + (1 - \cos t - \sin t)\) vaut constamment 1. Donc \(\langle f'(t), c\rangle = 0\) ; en effet \(f'(t) = (-\sin t,\ \cos t,\ \sin t - \cos t)\), dont la somme des coordonnées est nulle. La trajectoire est contenue dans le plan d'équation \(x + y + z = 1\), orthogonal à \(c\) ; sa projection sur le plan \(xOy\) est le cercle unité, donc c'est une ellipse de ce plan.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ☆ ☆</span>
  <h3>Dériver des produits de deux façons</h3>
  <div class="statement">Soient \(f(t) = (t,\ t^2,\ t^3)\) et \(g(t) = (1,\ -t,\ t^2)\) pour \(t \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\langle f, g\rangle\) et sa dérivée, directement puis par la règle du produit scalaire.</div>
  <div class="q"><strong>Q2.</strong> Même question pour \(f \wedge g\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\langle f, g\rangle = t - t^3 + t^5\), de dérivée \(1 - 3t^2 + 5t^4\). Avec \(f' = (1, 2t, 3t^2)\) et \(g' = (0, -1, 2t)\) : \(\langle f', g\rangle = 1 - 2t^2 + 3t^4\) et \(\langle f, g'\rangle = -t^2 + 2t^4\), dont la somme redonne \(1 - 3t^2 + 5t^4\).</p>
    <p><strong>Q2.</strong> Directement,</p>
    <div class="formula">$$f \wedge g = \big(t^2 \cdot t^2 - t^3 \cdot (-t),\ t^3 \cdot 1 - t \cdot t^2,\ t \cdot (-t) - t^2 \cdot 1\big) = (2t^4,\ 0,\ -2t^2),$$</div>
    <p>de dérivée \((8t^3, 0, -4t)\). Par la règle du produit vectoriel, en respectant l'ordre des facteurs :</p>
    <div class="formula">$$\begin{aligned} f' \wedge g &= (5t^3,\ 2t^2,\ -3t), \\ f \wedge g' &= (3t^3,\ -2t^2,\ -t), \end{aligned}$$</div>
    <p>dont la somme est bien \((8t^3, 0, -4t)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Prolonger, puis dériver grâce à un développement limité</h3>
  <div class="statement">Pour \(t \neq 0\), on pose
  <div class="formula">$$f(t) = \Big(\frac{1 - \cos t}{t^2},\ \frac{\sin t}{t},\ \frac{\mathrm{e}^t - 1}{t}\Big).$$</div></div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f\) se prolonge par continuité en 0.</div>
  <div class="q"><strong>Q2.</strong> Montrer que le prolongement est dérivable en 0 et calculer \(f'(0)\).</div>
  <div class="q"><strong>Q3.</strong> Donner une représentation paramétrique de la tangente à la trajectoire au point \(f(0)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Coordonnée par coordonnée, avec les développements usuels en 0 :</p>
    <div class="formula">$$\begin{aligned} \frac{1 - \cos t}{t^2} &= \frac12 - \frac{t^2}{24} + o(t^2), \\ \frac{\sin t}{t} &= 1 - \frac{t^2}{6} + o(t^2), \\ \frac{\mathrm{e}^t - 1}{t} &= 1 + \frac t2 + \frac{t^2}{6} + o(t^2). \end{aligned}$$</div>
    <p>Donc \(f(t) \to \big(\frac12, 1, 1\big)\) : on prolonge \(f\) par continuité en posant \(f(0) = \big(\frac12, 1, 1\big)\).</p>
    <p><strong>Q2.</strong> Les mêmes développements donnent, à l'ordre 1, \(f(t) = \big(\frac12, 1, 1\big) + t\,\big(0, 0, \frac12\big) + o(t)\). Une fonction vectorielle qui admet un développement limité à l'ordre 1 en 0 y est dérivable, et le coefficient de \(t\) est le vecteur dérivé : \(f'(0) = \big(0, 0, \frac12\big)\).</p>
    <p><strong>Q3.</strong> Comme \(f'(0) \neq 0\), la tangente en \(f(0)\) est la droite passant par \(\big(\frac12, 1, 1\big)\) dirigée par \((0, 0, 1)\) : \(\lambda \mapsto \big(\frac12, 1, 1 + \lambda\big)\), \(\lambda \in \mathbb{R}\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Dérivées successives d'une spirale</h3>
  <div class="statement">Soit \(f(t) = \mathrm{e}^t(\cos t,\ \sin t)\) pour \(t \in \mathbb{R}\) (spirale logarithmique).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f'(t) = \sqrt2\,\mathrm{e}^t\big(\cos(t + \frac\pi4),\ \sin(t + \frac\pi4)\big)\), puis donner \(f^{(n)}(t)\) pour tout \(n \in \mathbb{N}\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que l'angle entre le vecteur position \(f(t)\) et la vitesse \(f'(t)\) ne dépend pas de \(t\).</div>
  <div class="q"><strong>Q3.</strong> Calculer aussi \(f^{(n)}\) par la formule de Leibniz, et en déduire la valeur de \(\sum_{k=0}^n\binom nk\cos\big(k\frac\pi2\big)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f'(t) = \mathrm{e}^t(\cos t - \sin t,\ \sin t + \cos t)\), et \(\cos t - \sin t = \sqrt2\cos(t + \frac\pi4)\), \(\sin t + \cos t = \sqrt2\sin(t + \frac\pi4)\). Plus généralement, le même calcul montre que \(t \mapsto \mathrm{e}^t\big(\cos(t + c), \sin(t + c)\big)\) a pour dérivée \(\sqrt2\,\mathrm{e}^t\big(\cos(t + c + \frac\pi4), \sin(t + c + \frac\pi4)\big)\). Par récurrence :</p>
    <div class="formula">$$f^{(n)}(t) = 2^{n/2}\,\mathrm{e}^t\Big(\cos\big(t + n\tfrac\pi4\big),\ \sin\big(t + n\tfrac\pi4\big)\Big).$$</div>
    <p>En identifiant \(\mathbb{R}^2\) à \(\mathbb{C}\), \(f(t) = \mathrm{e}^{(1 + i)t}\) et \(f^{(n)}(t) = (1 + i)^n\mathrm{e}^{(1 + i)t}\), avec \(1 + i = \sqrt2\,\mathrm{e}^{i\pi/4}\) : même résultat.</p>
    <p><strong>Q2.</strong> \(\|f(t)\| = \mathrm{e}^t\), \(\|f'(t)\| = \sqrt2\,\mathrm{e}^t\) et</p>
    <div class="formula">$$\langle f(t), f'(t)\rangle = \mathrm{e}^{2t}\big(\cos t(\cos t - \sin t) + \sin t(\sin t + \cos t)\big) = \mathrm{e}^{2t} .$$</div>
    <p>Le cosinus de l'angle vaut donc \(\frac{\mathrm{e}^{2t}}{\sqrt2\,\mathrm{e}^{2t}} = \frac{1}{\sqrt2}\) : l'angle vaut constamment \(\frac\pi4\). La spirale coupe toutes les demi-droites issues de \(O\) sous le même angle.</p>
    <p><strong>Q3.</strong> Avec \(\lambda(t) = \mathrm{e}^t\) et \(u(t) = (\cos t, \sin t)\), dont les dérivées sont \(\lambda^{(k)} = \mathrm{e}^t\) et \(u^{(k)}(t) = \big(\cos(t + k\frac\pi2), \sin(t + k\frac\pi2)\big)\), la formule de Leibniz donne</p>
    <div class="formula">$$f^{(n)}(t) = \mathrm{e}^t\sum_{k=0}^n\binom nk\Big(\cos\big(t + k\tfrac\pi2\big),\ \sin\big(t + k\tfrac\pi2\big)\Big).$$</div>
    <p>En comparant les premières coordonnées en \(t = 0\) avec Q1 : \(\sum_{k=0}^n\binom nk\cos\big(k\frac\pi2\big) = 2^{n/2}\cos\big(n\frac\pi4\big)\). Contrôle pour \(n = 4\) : \(1 - 6 + 1 = -4 = 4\cos\pi\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Développement limité en un point stationnaire</h3>
  <div class="statement">Soit \(f(t) = \big(\ln(1 + t^2),\ t - \arctan t\big)\) pour \(t \in \mathbb{R}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(f'(t)\) et montrer que \(t = 0\) donne le seul point stationnaire.</div>
  <div class="q"><strong>Q2.</strong> Écrire le développement limité de \(f\) à l'ordre 3 en 0, et en déduire \(f''(0)\) et \(f'''(0)\).</div>
  <div class="q"><strong>Q3.</strong> En déduire la tangente à la trajectoire en \(O = f(0)\) et l'allure de la courbe au voisinage de \(O\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On dérive chaque coordonnée :</p>
    <div class="formula">$$f'(t) = \Big(\frac{2t}{1 + t^2},\ 1 - \frac{1}{1 + t^2}\Big) = \Big(\frac{2t}{1 + t^2},\ \frac{t^2}{1 + t^2}\Big).$$</div>
    <p>La première coordonnée ne s'annule qu'en \(t = 0\), où la seconde est nulle aussi : seul \(t = 0\) donne un point stationnaire.</p>
    <p><strong>Q2.</strong> \(\ln(1 + t^2) = t^2 + o(t^3)\) (le terme suivant est en \(t^4\)) et \(\arctan t = t - \frac{t^3}{3} + o(t^3)\), donc</p>
    <div class="formula">$$f(t) = t^2\,(1, 0) + t^3\Big(0, \frac13\Big) + o(t^3).$$</div>
    <p>La fonction est de classe \(\mathcal{C}^\infty\), donc par Taylor-Young \(f^{(k)}(0) = k!\,a_k\) : \(f''(0) = (2, 0)\) et \(f'''(0) = (0, 2)\).</p>
    <p><strong>Q3.</strong> Le premier coefficient non nul, \(a_2 = (1, 0)\), dirige la tangente : c'est l'axe \((Ox)\), bien que la vitesse soit nulle. Le suivant, \(a_3 = \big(0, \frac13\big)\), n'est pas colinéaire à \(a_2\) : \(p = 2\), \(q = 3\). L'abscisse \(\ln(1 + t^2)\) est positive des deux côtés de 0, l'ordonnée change de signe : les deux demi-arcs partent vers la droite, l'un au-dessus, l'autre au-dessous de la tangente. C'est un rebroussement de 1ʳᵉ espèce (chapitre « Courbes planes paramétrées »).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Quand la vitesse reste colinéaire à la position</h3>
  <div class="statement">Soit \(f : I \to \mathbb{R}^3\) de classe \(\mathcal{C}^1\) sur un intervalle \(I\), telle que \(f(t) \neq 0\) et \(f(t) \wedge f'(t) = 0\) pour tout \(t \in I\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(f'(t) = \mu(t)\,f(t)\), avec \(\mu(t) = \dfrac{\langle f(t), f'(t)\rangle}{\|f(t)\|^2}\).</div>
  <div class="q"><strong>Q2.</strong> On pose \(u = \dfrac{f}{\|f\|}\). Montrer que \(u\) est constante, et en déduire que la trajectoire est contenue dans une demi-droite issue de \(O\).</div>
  <div class="q"><strong>Q3.</strong> Montrer que l'hypothèse \(f(t) \neq 0\) ne peut pas être supprimée, à l'aide de la fonction \(g\) définie sur \(\mathbb{R}\) par \(g(t) = (t^3, 0, 0)\) si \(t \leq 0\) et \(g(t) = (0, t^3, 0)\) si \(t \gt 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f(t) \wedge f'(t) = 0\) signifie que la famille \((f(t), f'(t))\) est liée ; comme \(f(t) \neq 0\), il existe un réel \(\mu(t)\) tel que \(f'(t) = \mu(t)f(t)\). En faisant le produit scalaire avec \(f(t)\) : \(\langle f(t), f'(t)\rangle = \mu(t)\|f(t)\|^2\), d'où l'expression de \(\mu(t)\).</p>
    <p><strong>Q2.</strong> Comme \(f\) ne s'annule pas, \(\|f\|\) est dérivable, avec \(\|f\|' = \frac{\langle f, f'\rangle}{\|f\|} = \mu\|f\|\). Par la règle du produit (réel × vecteur) :</p>
    <div class="formula">$$u' = -\frac{\|f\|'}{\|f\|^2}\,f + \frac{1}{\|f\|}\,f' = -\frac{\mu}{\|f\|}\,f + \frac{\mu}{\|f\|}\,f = 0 .$$</div>
    <p>Sur l'intervalle \(I\), \(u\) est donc constante, égale à un vecteur unitaire \(u_0\). Alors \(f(t) = \|f(t)\|\,u_0\) : le point reste sur la demi-droite issue de \(O\) dirigée par \(u_0\) (mouvement rectiligne, dans une direction fixe passant par \(O\)).</p>
    <p><strong>Q3.</strong> Pour \(t \lt 0\), \(g'(t) = (3t^2, 0, 0)\) ; pour \(t \gt 0\), \(g'(t) = (0, 3t^2, 0)\) ; en 0, \(\frac{g(h) - g(0)}{h}\) vaut \((h^2, 0, 0)\) ou \((0, h^2, 0)\), qui tend vers 0 : \(g'(0) = 0\). La dérivée est continue (elle tend vers 0 en 0), donc \(g\) est de classe \(\mathcal{C}^1\). De chaque côté de 0, \(g\) et \(g'\) sont colinéaires, et en 0 les deux sont nuls : \(g \wedge g' = 0\) partout. Pourtant la trajectoire, réunion de la demi-droite \(\mathbb{R}_-e_1\) et de la demi-droite \(\mathbb{R}_+e_2\), n'est contenue dans aucune droite. Le raisonnement de Q2 échoue parce que \(g(0) = 0\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Un mouvement circulaire à accélération inclinée</h3>
  <div class="statement">Un point se déplace sur le cercle de centre \(O\) et de rayon \(R\) : \(\overrightarrow{OM}(t) = R\,\vec u_r\big(\theta(t)\big)\), où \(\theta\) est de classe \(\mathcal{C}^2\) sur un intervalle contenant 0, avec \(\theta(0) = 0\), \(\theta'(0) = 1\) et \(\theta' \gt 0\). On veut que l'accélération fasse constamment un angle de \(\frac\pi4\) avec la vitesse.</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\vec v\) et \(\vec a\) dans la base polaire, puis le cosinus de l'angle \(\alpha\) entre \(\vec v\) et \(\vec a\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que la condition équivaut à \(\theta'' = \theta'^2\).</div>
  <div class="q"><strong>Q3.</strong> En étudiant la dérivée de \(1/\theta'\), déterminer \(\theta\). Que se passe-t-il quand \(t\) se rapproche de 1 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Par dérivation de la composée (§7 du cours), \(\vec v = R\theta'\,\vec u_\theta\) et \(\vec a = -R\theta'^2\,\vec u_r + R\theta''\,\vec u_\theta\). La base polaire étant orthonormée, \(\langle \vec a, \vec v\rangle = R^2\theta'\theta''\), \(\|\vec v\| = R\theta'\) et \(\|\vec a\| = R\sqrt{\theta'^4 + \theta''^2}\), donc</p>
    <div class="formula">$$\cos\alpha = \frac{\langle \vec a, \vec v\rangle}{\|\vec a\|\,\|\vec v\|} = \frac{\theta''}{\sqrt{\theta'^4 + \theta''^2}} .$$</div>
    <p><strong>Q2.</strong> L'angle vaut \(\frac\pi4\) si et seulement si ce cosinus vaut \(\frac{1}{\sqrt2}\), c'est-à-dire \(\theta'' \gt 0\) et \(2\theta''^2 = \theta'^4 + \theta''^2\), soit \(\theta''^2 = \theta'^4\) avec \(\theta'' \gt 0\) : \(\theta'' = \theta'^2\). Les composantes centripète et tangentielle de l'accélération ont alors la même norme.</p>
    <p><strong>Q3.</strong> Posons \(\omega = \theta' \gt 0\). Alors \(\big(\frac1\omega\big)' = -\frac{\omega'}{\omega^2} = -1\), donc \(\frac{1}{\omega(t)} = 1 - t\) (car \(\omega(0) = 1\)), ce qui impose \(t \lt 1\). Ainsi \(\theta'(t) = \frac{1}{1 - t}\) et, avec \(\theta(0) = 0\), \(\theta(t) = -\ln(1 - t)\) pour \(t \lt 1\). Réciproquement, cette fonction vérifie \(\theta'' = \frac{1}{(1 - t)^2} = \theta'^2\). Quand \(t \to 1^-\), \(\theta(t) \to +\infty\) : le point fait une infinité de tours avant l'instant 1, avec une vitesse \(\frac{R}{1 - t}\) qui tend vers l'infini. Un tel mouvement ne peut pas se prolonger au-delà de \(t = 1\).</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Accélération centrale — mouvement plan et loi des aires</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : dérivation des fonctions vectorielles, produit vectoriel, lien avec la mécanique du point).</div>
  <div class="statement">Soit \(f : \mathbb{R} \to \mathbb{R}^3\) deux fois dérivable, qui modélise la position \(\overrightarrow{OM}(t)\) d'un point. On pose \(\vec C(t) = f(t) \wedge f'(t)\).</div>
  <p class="exo-part">Partie A — Le théorème</p>
  <div class="q"><strong>A1.</strong> Rappeler la formule de dérivation de \(t \mapsto u(t) \wedge v(t)\), puis montrer que \(\vec C\,'(t) = f(t) \wedge f''(t)\).</div>
  <div class="q"><strong>A2.</strong> On suppose l'accélération <strong>centrale</strong> : \(f''(t) = \lambda(t)\,f(t)\) pour une fonction réelle \(\lambda\). Montrer que \(\vec C\) est un vecteur constant.</div>
  <div class="q"><strong>A3.</strong> On suppose de plus \(\vec C \neq \vec 0\). En déduire que le mouvement est plan (préciser le plan), et que la vitesse aréolaire \(\frac12\|f \wedge f'\|\) est constante (loi des aires).</div>
  <p class="exo-part">Partie B — Vérification sur un mouvement elliptique</p>
  <div class="q"><strong>B1.</strong> Soit \(f(t) = (a\cos\omega t,\ b\sin\omega t,\ 0)\) avec \(a, b, \omega \gt 0\). Vérifier que l'accélération est centrale, puis calculer \(\vec C\) et la vitesse aréolaire.</div>
  <div class="q"><strong>B2.</strong> En déduire l'aire balayée par \(\overrightarrow{OM}\) pendant une période \(T = 2\pi/\omega\), et retrouver l'aire de l'ellipse.</div>
  <p class="exo-part">Partie C — Une réciproque</p>
  <div class="q"><strong>C1.</strong> On suppose \(\vec C\) constant et non nul. Montrer que \(f(t) \neq 0\) pour tout \(t\), puis que l'accélération est centrale.</div>
  <div class="q"><strong>C2.</strong> Calculer \(\vec C\) pour le mouvement rectiligne uniforme \(f(t) = (t, 1, 0)\). Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \((u \wedge v)' = u' \wedge v + u \wedge v'\). Donc \(\vec C\,' = f' \wedge f' + f \wedge f'' = f \wedge f''\), car \(u \wedge u = \vec 0\) pour tout vecteur \(u\).</p>
    <p><strong>A2.</strong> Avec \(f'' = \lambda f\) : \(\vec C\,' = f \wedge (\lambda f) = \lambda\,(f \wedge f) = \vec 0\) sur l'intervalle \(\mathbb{R}\), donc \(\vec C\) est constant.</p>
    <p><strong>A3.</strong> Le produit vectoriel est orthogonal à ses deux facteurs : \(\langle f(t), \vec C\rangle = 0\) pour tout \(t\). Le vecteur \(\vec C\) étant fixe et non nul, \(M(t)\) reste dans le plan passant par \(O\) et orthogonal à \(\vec C\) : le mouvement est plan. Entre \(t\) et \(t + \mathrm{d}t\), le rayon \(OM\) balaie un triangle d'aire \(\mathrm{d}A = \frac12\|f \wedge f'\|\,\mathrm{d}t\) (demi-aire du parallélogramme construit sur \(f\) et \(f'\,\mathrm{d}t\)). Donc \(\frac{\mathrm{d}A}{\mathrm{d}t} = \frac12\|\vec C\|\) est constante : c'est la loi des aires (deuxième loi de Kepler pour les planètes).</p>
    <p><strong>B1.</strong> On calcule</p>
    <div class="formula">$$\begin{aligned} f' &= (-a\omega\sin\omega t,\ b\omega\cos\omega t,\ 0), \\ f'' &= (-a\omega^2\cos\omega t,\ -b\omega^2\sin\omega t,\ 0) = -\omega^2 f : \end{aligned}$$</div>
    <p>l'accélération est centrale, avec \(\lambda = -\omega^2\). Comme \(f\) et \(f'\) ont une troisième coordonnée nulle, seule la troisième coordonnée de \(f \wedge f'\) peut être non nulle ; elle vaut</p>
    <div class="formula">$$a\cos\omega t \cdot b\omega\cos\omega t - b\sin\omega t \cdot (-a\omega\sin\omega t) = ab\omega .$$</div>
    <p>Donc \(\vec C = ab\omega\,\vec e_z\), constant comme prévu, et la vitesse aréolaire vaut \(\frac12ab\omega\).</p>
    <p><strong>B2.</strong> Pendant une période, \(A = \frac12ab\omega \times \frac{2\pi}{\omega} = \pi ab\) : c'est exactement l'aire de l'ellipse de demi-axes \(a\) et \(b\), que le rayon \(OM\) balaie une fois.</p>
    <p><strong>C1.</strong> Si \(f(t_0) = 0\), alors \(\vec C(t_0) = 0 \wedge f'(t_0) = \vec 0\), ce qui est exclu. Comme \(\vec C\) est constant, \(\vec C\,' = f \wedge f'' = \vec 0\) : la famille \((f(t), f''(t))\) est liée, et \(f(t) \neq 0\), donc \(f''(t) = \lambda(t)f(t)\) avec \(\lambda(t) = \frac{\langle f''(t), f(t)\rangle}{\|f(t)\|^2}\). L'accélération est centrale.</p>
    <p><strong>C2.</strong> \(f'(t) = (1, 0, 0)\), et le produit vectoriel \((t, 1, 0) \wedge (1, 0, 0)\) vaut \((0, 0, -1)\) : \(\vec C\) est constant, et l'accélération, nulle, est bien centrale (\(\lambda = 0\)). Un point libre, sans aucune force, obéit lui aussi à la loi des aires, par rapport à n'importe quel point : pendant \(\mathrm{d}t\), le rayon balaie un triangle de base \(\mathrm{d}t\) et de hauteur 1, d'aire \(\frac12\,\mathrm{d}t\).</p>
