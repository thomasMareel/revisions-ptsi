      <div class="sec-num">§1 · EXPRESSIONS IMAGÉES</div>
      <h2>Idiomes courants</h2>
      <div class="intro">Les idiomes ne se traduisent <strong>pas mot à mot</strong>. Bien placés (avec parcimonie), ils rendent l'expression naturelle et impressionnent à l'oral.</div>
      <div class="prop-box"><strong>Quantité / fréquence</strong> : once in a blue moon (très rarement) · to cost an arm and a leg (coûter cher) · a piece of cake (facile).</div>
      <div class="prop-box"><strong>Communication</strong> : to break the ice · to beat around the bush (tourner autour du pot) · to hit the nail on the head (taper juste).</div>
      <div class="prop-box"><strong>Action / décision</strong> : to bite the bullet (prendre son courage) · the ball is in your court · to call it a day (s'arrêter là).</div>
      <div class="notice">Règle d'or : un idiome bien compris vaut mieux que trois mal employés. Vérifie toujours le registre (familier ou non).</div>
    </div>
