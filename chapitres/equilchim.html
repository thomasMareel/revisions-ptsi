<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Dissociation de N₂O₄ sous pression fixée</h3>
  <div class="statement">À 298 K, la réaction N₂O₄(g) = 2 NO₂(g) a pour constante \(K^\circ = 0{,}15\). On maintient 1,0 mol de N₂O₄ (initialement seul) sous une pression totale \(P\) constante. On note \(\alpha\) le taux de dissociation.</div>
  <div class="q"><strong>Q1.</strong> Exprimer les fractions molaires et les pressions partielles en fonction de \(\alpha\) et \(P\). En déduire \(K^\circ\) en fonction de \(\alpha\) et \(P/P^\circ\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\alpha\) et la fraction molaire de NO₂ pour \(P = 1{,}0\ \text{bar}\).</div>
  <div class="q"><strong>Q3.</strong> Même question pour \(P = 2{,}0\ \text{bar}\) puis \(P = 0{,}10\ \text{bar}\). Comment la pression totale agit-elle sur l'état final ? Expliquer à partir de l'expression de \(Q_r\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> N₂O₄ \(1 - \alpha\), NO₂ \(2\alpha\), total \(1 + \alpha\) (en mol). \(x(\mathrm{N_2O_4}) = \dfrac{1 - \alpha}{1 + \alpha}\), \(x(\mathrm{NO_2}) = \dfrac{2\alpha}{1 + \alpha}\), \(P_i = x_iP\). \( K^\circ \) \( = \dfrac{x_{\mathrm{NO_2}}^2}{x_{\mathrm{N_2O_4}}}\dfrac{P}{P^\circ} \) \( = \dfrac{4\alpha^2}{1 - \alpha^2}\,\dfrac{P}{P^\circ} \).</p>
    <p><strong>Q2.</strong> \(4\alpha^2 = 0{,}15(1 - \alpha^2)\), donc \(\alpha^2 = 0{,}15/4{,}15\) et \(\alpha = 0{,}190\) ; \(x(\mathrm{NO_2}) = 0{,}380/1{,}190 = 0{,}32\).</p>
    <p><strong>Q3.</strong> De façon générale, \(\alpha = \sqrt{\dfrac{K^\circ}{K^\circ + 4P/P^\circ}}\). Sous 2,0 bar : \(\alpha = 0{,}136\), \(x(\mathrm{NO_2}) = 0{,}24\). Sous 0,10 bar : \(\alpha = 0{,}522\), \(x(\mathrm{NO_2}) = 0{,}69\). Une pression plus élevée diminue la dissociation. Explication : à composition fixée, \( Q_r \) \( = \dfrac{x_{\mathrm{NO_2}}^2}{x_{\mathrm{N_2O_4}}}\dfrac{P}{P^\circ} \) est proportionnel à \(P\) (la réaction augmente le nombre de molécules de gaz). Si l'on comprime un mélange à l'équilibre, \(Q_r\) devient supérieur à \(K^\circ\) et le système évolue dans le sens indirect.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Zinc dans une solution de sulfate de cuivre : quasi totale ou rupture ?</h3>
  <div class="statement">La réaction Zn(s) + Cu²⁺(aq) = Zn²⁺(aq) + Cu(s) a pour constante \(K^\circ = 10^{37}\) à 25 °C. On dispose de 100,0 mL de solution de sulfate de cuivre(II) à 0,100 mol·L⁻¹. Masses molaires (g·mol⁻¹) : Zn 65,38 ; Cu 63,55 ; \(N_A = 6{,}02\times10^{23}\ \text{mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> On y ajoute 1,00 g de poudre de zinc. Déterminer l'état final : quantités des solides, concentrations des ions. Commenter la concentration de Cu²⁺ trouvée.</div>
  <div class="q"><strong>Q2.</strong> On recommence avec 0,330 g de zinc seulement. Déterminer l'état final. Calculer \(Q_{r,f}\) : le système est-il à l'équilibre ?</div>
  <div class="q"><strong>Q3.</strong> Que se passe-t-il si, dans le cas de Q2, on ajoute ensuite un morceau de zinc ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(n(\mathrm{Zn})_0 = 1{,}00/65{,}38 = 15{,}3\ \text{mmol}\) et \(n(\mathrm{Cu^{2+}})_0 = 10{,}0\ \text{mmol}\) : Cu²⁺ est limitant. Avec \(K^\circ = 10^{37}\), on suppose la réaction quasi totale : \(\xi_f = 10{,}0\ \text{mmol}\). Il reste 5,3 mmol de zinc (0,346 g), il s'est déposé 10,0 mmol de cuivre (0,636 g), et \([\mathrm{Zn^{2+}}] = 0{,}100\ \text{mol·L}^{-1}\). Le zinc et le cuivre étant présents, l'équilibre est atteint : \( [\mathrm{Cu^{2+}}] \) \( = [\mathrm{Zn^{2+}}]/K^\circ \) \( = 10^{-38}\ \text{mol·L}^{-1} \). Cela représente \(10^{-38}\times0{,}100\times6{,}02\times10^{23} \approx 6\times10^{-16}\) ion : en pratique, il ne reste aucun ion Cu²⁺, la transformation est totale (la solution bleue se décolore).</p>
    <p><strong>Q2.</strong> \( n(\mathrm{Zn})_0 \) \( = 5{,}05\ \text{mmol} \lt 10{,}0\ \text{mmol} \) : le zinc est limitant. Supposer l'équilibre donnerait encore \([\mathrm{Cu^{2+}}] \approx 10^{-38}\ \text{mol·L}^{-1}\), donc la consommation de 10,0 mmol de zinc : impossible. Tout le zinc disparaît, \(\xi_f = 5{,}05\ \text{mmol}\) : \([\mathrm{Cu^{2+}}] = 0{,}0495\ \text{mol·L}^{-1}\), \([\mathrm{Zn^{2+}}] = 0{,}0505\ \text{mol·L}^{-1}\), cuivre déposé 5,05 mmol. \(Q_{r,f} = 0{,}0505/0{,}0495 = 1{,}02\), très inférieur à \(K^\circ\) : ce n'est pas un état d'équilibre, mais une transformation totale par disparition d'un réactif (rupture d'équilibre).</p>
    <p><strong>Q3.</strong> \(Q_r \lt K^\circ\) et le réactif manquant est de nouveau présent : la réaction reprend dans le sens direct, jusqu'à disparition des ions Cu²⁺ (si le zinc ajouté suffit) ou du zinc.</p>
  </div>
</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(Q_r = P_{\mathrm{CO_2}}/P^\circ\) (deux solides d'activité 1). À l'équilibre, \(P_{\mathrm{CO_2}} = K^\circ P^\circ = 1{,}0\ \text{bar}\), soit \( n = P^\circ V/(RT) \) \( = 10^5\times5{,}00\times10^{-3}/(8{,}314\times1\,173) \) \( = 51{,}3\ \text{mmol} \). Il faut au moins cette quantité de carbonate : \(m_{\min} = 5{,}13\ \text{g}\).</p>

  <div class="q"><strong>Q3.</strong> Reprendre pour \(c = 1{,}0\times10^{-3}\ \text{mol·L}^{-1}\). Que conclure ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Capacité numérique : synthèse de l'ammoniac et pression</h3>
  <div class="statement">À 723 K, la réaction N₂(g) + 3 H₂(g) = 2 NH₃(g) a pour constante \(K^\circ = 4{,}6\times10^{-5}\). On part de 1 mol de N₂ et 3 mol de H₂, maintenues sous une pression totale \(P\) constante. Les gaz sont parfaits.</div>
  <div class="q"><strong>Q1.</strong> Exprimer les quantités, puis les activités, en fonction de l'avancement \(\xi\) et de \(P\). Sur quel intervalle cherche-t-on \(\xi\) ?</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction Python <code>taux(P)</code> qui renvoie le taux d'avancement final par dichotomie (on pourra reprendre <code>zero_dicho</code>).</div>
  <div class="q"><strong>Q3.</strong> Donner le taux d'avancement et la fraction molaire d'ammoniac pour \(P\) = 1, 10, 100, 200 et 300 bar. Commenter le choix industriel de pressions de 150 à 300 bar.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> N₂ \(1 - \xi\), H₂ \(3 - 3\xi\), NH₃ \(2\xi\), total gazeux \(4 - 2\xi\). Activités : \(a_i = \dfrac{n_i}{4 - 2\xi}\dfrac{P}{P^\circ}\). On cherche \(\xi\) dans \(]0 ; 1[\) (N₂ et H₂ s'épuisent ensemble pour \(\xi = 1\), proportions stœchiométriques).</p>
    <p><strong>Q2.</strong> On résout \(\ln Q_r(\xi) - \ln K^\circ = 0\), fonction croissante qui tend vers \(-\infty\) en 0 et \(+\infty\) en 1 :</p>
    <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> zero_dicho(f, a, b, eps):
    fa = f(a)
    <span class="kw">assert</span> a &lt; b <span class="kw">and</span> fa * f(b) &lt;= 0 <span class="kw">and</span> eps &gt; 0
    <span class="kw">while</span> b - a &gt; eps:
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2

K = 4.6e-5             <span class="cmt"># N2 + 3 H2 = 2 NH3 à 723 K</span>

<span class="kw">def</span> taux(P):
<span class="str">    """Taux d'avancement final sous P (bar), 1 mol N2 + 3 mol H2."""</span>
    <span class="kw">def</span> f(xi):         <span class="cmt"># ln Qr - ln K°, croissante sur ]0, 1[</span>
        nN2, nH2, nNH3 = 1 - xi, 3 - 3 * xi, 2 * xi
        ng = nN2 + nH2 + nNH3
        a = [nN2 / ng * P, nH2 / ng * P, nNH3 / ng * P]
        lnQ = 2 * math.log(a[2]) - math.log(a[0]) - 3 * math.log(a[1])
        <span class="kw">return</span> lnQ - math.log(K)
    <span class="kw">return</span> zero_dicho(f, 1e-12, 1 - 1e-12, 1e-10)

<span class="kw">for</span> P <span class="kw">in</span> (1, 10, 100, 200, 300):
    t = taux(P)
    print(P, round(t, 3), round(2 * t / (4 - 2 * t), 3))
<span class="cmt"># 1 0.004 0.002 / 10 0.041 0.021 / 100 0.271 0.157</span>
<span class="cmt"># 200 0.398 0.249 / 300 0.476 0.312</span></pre>
    <p><strong>Q3.</strong> Taux d'avancement : 0,4 % sous 1 bar, 4,1 % sous 10 bar, 27 % sous 100 bar, 40 % sous 200 bar, 48 % sous 300 bar ; fraction molaire d'ammoniac : 0,2 %, 2,1 %, 16 %, 25 %, 31 %. Sous la pression atmosphérique, presque rien ne se forme. À composition fixée, \(Q_r\) est proportionnel à \((P^\circ/P)^2\) (la réaction diminue de 2 le nombre de molécules de gaz) : augmenter la pression abaisse \(Q_r\) sous \(K^\circ\) et fait avancer la réaction. D'où les hautes pressions, limitées par le coût des installations ; le gaz non converti est recyclé.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Produire du dihydrogène : la conversion du monoxyde de carbone</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>description d'un système, quotient de réaction, état final d'équilibre, combinaison de constantes, rupture d'équilibre, capacité numérique</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">Le dihydrogène industriel est surtout produit à partir de méthane. Le gaz qui sort du premier réacteur contient encore du monoxyde de carbone, que l'on convertit par la réaction du « gaz à l'eau » : CO(g) + H₂O(g) = CO₂(g) + H₂(g) (R₁). On étudie l'entrée d'un réacteur de conversion qui reçoit, pour 6,00 mol de gaz : 1,00 mol de CO, 2,00 mol de H₂O, 0,50 mol de CO₂ et 2,50 mol de H₂, sous une pression totale de 30 bar. Les gaz sont parfaits. Données : \(K^\circ_1 = 9{,}0\) à 700 K et 1,4 à 1 000 K ; pour CaCO₃(s) = CaO(s) + CO₂(g) (R₂), \(K^\circ_2 = 1{,}0\times10^{-5}\) à 700 K.</div>
  <p class="exo-part">Partie A — Description du système</p>
  <div class="q"><strong>A1.</strong> Calculer les fractions molaires et les pressions partielles à l'entrée du réacteur.</div>
  <div class="q"><strong>A2.</strong> Montrer que le quotient de réaction de (R₁) ne dépend ni de la pression totale ni du nombre total de moles. Le calculer à l'entrée.</div>
  <p class="exo-part">Partie B — Sens d'évolution et état final</p>
  <div class="q"><strong>B1.</strong> Prévoir le sens d'évolution à 700 K.</div>
  <div class="q"><strong>B2.</strong> Déterminer l'avancement à l'équilibre à 700 K, puis la quantité et la fraction molaire de CO restant à la sortie.</div>
  <div class="q"><strong>B3.</strong> Même calcul à 1 000 K. Le réacteur de conversion fonctionne vers 700 K avec un catalyseur : pourquoi pas à plus haute température, où la réaction serait plus rapide ?</div>
  <p class="exo-part">Partie C — Capter le CO₂ avec de la chaux</p>
  <div class="q"><strong>C1.</strong> On ajoute au réacteur de l'oxyde de calcium solide. Écrire la réaction globale (R₃) CO(g) + H₂O(g) + CaO(s) = H₂(g) + CaCO₃(s) comme combinaison de (R₁) et (R₂) et calculer sa constante à 700 K.</div>
  <div class="q"><strong>C2.</strong> Tant que CaO et CaCO₃ sont tous deux présents, que vaut la pression partielle de CO₂ ? En déduire, sous 30 bar et en admettant que presque tout le CO est converti, la pression partielle et la fraction molaire du CO restant.</div>
  <div class="q"><strong>C3.</strong> Quelle quantité minimale de CaO faut-il prévoir pour que ce résultat soit valable ? Que se passe-t-il si l'on en met moins ?</div>
  <p class="exo-part">Partie D — Programme</p>
  <div class="q"><strong>D1.</strong> Écrire un programme qui détermine par dichotomie l'avancement d'équilibre de (R₁) pour le mélange d'entrée, à 700 K puis à 1 000 K, et vérifier les résultats de la partie B.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(x_i = n_i/6{,}00\) et \(P_i = 30\,x_i\) : CO 0,167 (5,0 bar) ; H₂O 0,333 (10,0 bar) ; CO₂ 0,083 (2,5 bar) ; H₂ 0,417 (12,5 bar).</p>
    <p><strong>A2.</strong> \( Q_r \) \( = \dfrac{(x_{\mathrm{CO_2}}P/P^\circ)(x_{\mathrm{H_2}}P/P^\circ)}{(x_{\mathrm{CO}}P/P^\circ)(x_{\mathrm{H_2O}}P/P^\circ)} \) : le facteur \(P/P^\circ\) et le total \(n_{\text{tot}}\) apparaissent deux fois en haut et deux fois en bas, d'où \( Q_r \) \( = \dfrac{n_{\mathrm{CO_2}}\,n_{\mathrm{H_2}}}{n_{\mathrm{CO}}\,n_{\mathrm{H_2O}}} \). À l'entrée, \( Q_{r,i} \) \( = \dfrac{0{,}50\times2{,}50}{1{,}00\times2{,}00} \) \( = 0{,}625 \).</p>
    <p><strong>B1.</strong> \(Q_{r,i} = 0{,}625 \lt K^\circ_1 = 9{,}0\) : sens direct, le CO est converti.</p>
    <p><strong>B2.</strong> Tableau : CO \(1{,}00 - \xi\), H₂O \(2{,}00 - \xi\), CO₂ \(0{,}50 + \xi\), H₂ \(2{,}50 + \xi\), avec \(-0{,}50 \lt \xi \lt 1{,}00\). Condition : \( (0{,}50 + \xi)(2{,}50 + \xi) \) \( = 9{,}0\,(1{,}00 - \xi)(2{,}00 - \xi) \), soit \(8{,}0\,\xi^2 - 30\,\xi + 16{,}75 = 0\). Racines : 0,683 et 3,07 ; seule la première est dans l'intervalle. Il reste 0,317 mol de CO sur 6,00 mol de gaz (le total ne change pas) : \(x(\mathrm{CO}) = 5{,}3\ \%\).</p>
    <p><strong>B3.</strong> À 1 000 K : \(0{,}4\,\xi^2 - 7{,}2\,\xi + 1{,}55 = 0\), d'où \(\xi = 0{,}218\) ; il reste 0,782 mol de CO, \(x(\mathrm{CO}) = 13\ \%\). La constante diminue quand la température augmente (la réaction est exothermique, notion de 2ᵉ année) : à haute température, la réaction serait plus rapide mais l'état final serait moins favorable. On travaille donc à température modérée, et le catalyseur compense la lenteur.</p>
    <p><strong>C1.</strong> (R₃) = (R₁) − (R₂) : en ajoutant (R₁) et l'inverse de (R₂), CO₂ se simplifie. \( K^\circ_3 = K^\circ_1/K^\circ_2 \) \( = 9{,}0/1{,}0\times10^{-5} \) \( = 9{,}0\times10^5 \).</p>
    <p><strong>C2.</strong> Pour (R₂), \(Q_r = P_{\mathrm{CO_2}}/P^\circ\) ; si les deux solides sont présents, l'équilibre (R₂) impose \( P_{\mathrm{CO_2}} \) \( = K^\circ_2P^\circ \) \( = 1{,}0\times10^{-5}\ \text{bar} \). Si presque tout le CO est converti et le CO₂ capté, il reste environ 1,00 mol de H₂O et 3,50 mol de H₂ sur 4,50 mol de gaz : \(P_{\mathrm{H_2O}} = 6{,}7\ \text{bar}\), \(P_{\mathrm{H_2}} = 23{,}3\ \text{bar}\). L'équilibre (R₁) donne alors \( P_{\mathrm{CO}} \) \( = \dfrac{P_{\mathrm{CO_2}}\,P_{\mathrm{H_2}}}{K^\circ_1\,P_{\mathrm{H_2O}}} \) \( = \dfrac{1{,}0\times10^{-5}\times23{,}3}{9{,}0\times6{,}7} \) \( = 3{,}9\times10^{-6}\ \text{bar} \), soit \(x(\mathrm{CO}) = 1{,}3\times10^{-7}\) : la conversion est quasi totale, et l'hypothèse est vérifiée.</p>
    <p><strong>C3.</strong> La chaux doit capter le CO₂ initial (0,50 mol) et celui formé (≈ 1,00 mol) : il faut au moins 1,50 mol de CaO. Avec moins, tout le CaO est transformé en CaCO₃ avant la fin : rupture de l'équilibre (R₂), la pression de CO₂ n'est plus bloquée à \(10^{-5}\ \text{bar}\) et le système retrouve un équilibre (R₁) seul, moins favorable.</p>
    <p><strong>D1.</strong> Le quotient ne dépend que des quantités (A2) ; on cherche le zéro de \(\ln Q_r - \ln K^\circ\) sur \(]-0{,}50 ; 1{,}00[\) :</p>
    <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> zero_dicho(f, a, b, eps):
    fa = f(a)
    <span class="kw">assert</span> a &lt; b <span class="kw">and</span> fa * f(b) &lt;= 0 <span class="kw">and</span> eps &gt; 0
    <span class="kw">while</span> b - a &gt; eps:
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2

<span class="kw">def</span> xi_final(K):       <span class="cmt"># CO + H2O = CO2 + H2, mélange de la partie A</span>
    <span class="kw">def</span> f(xi):
        nCO, nH2O, nCO2, nH2 = 1 - xi, 2 - xi, 0.5 + xi, 2.5 + xi
        <span class="kw">return</span> math.log(nCO2 * nH2 / (nCO * nH2O)) - math.log(K)
    <span class="kw">return</span> zero_dicho(f, -0.5 + 1e-12, 1 - 1e-12, 1e-10)

<span class="kw">for</span> K <span class="kw">in</span> (9.0, 1.4):
    print(K, round(xi_final(K), 4))   <span class="cmt"># 9.0 0.6826 ; 1.4 0.2179</span></pre>
    <p>On retrouve \(\xi = 0{,}683\ \text{mol}\) à 700 K et \(0{,}218\ \text{mol}\) à 1 000 K.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 12</span><span class="diff">★ ★ ☆</span>
  <h3>Synthèse de l'ammoniac : température et pression (hors programme en PTSI, vu en 2ᵉ année)</h3>
  <div class="statement">Synthèse de l'ammoniac : N₂(g) + 3 H₂(g) = 2 NH₃(g), d'enthalpie standard de réaction \(\Delta_r H^\circ = -92\ \text{kJ·mol}^{-1}\) (réaction exothermique). L'influence de la température sur \(K^\circ\) relève de la 2ᵉ année (chapitre « Thermodynamique de la transformation chimique »).</div>
  <div class="q"><strong>Q1.</strong> À partir de l'expression de \(Q_r\) en fonction des fractions molaires et de \(P\), prévoir l'effet d'une augmentation de pression (à température fixée) sur un mélange à l'équilibre.</div>
  <div class="q"><strong>Q2.</strong> Quel est l'effet d'une augmentation de température sur \(K^\circ\), puis sur l'équilibre ?</div>
  <div class="q"><strong>Q3.</strong> Pourquoi le procédé Haber-Bosch fonctionne-t-il vers 400 à 500 °C et 150 à 300 bar ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( Q_r \) \( = \dfrac{x_{\mathrm{NH_3}}^2}{x_{\mathrm{N_2}}\,x_{\mathrm{H_2}}^3}\left(\dfrac{P^\circ}{P}\right)^2 \). Si l'on comprime un mélange à l'équilibre (composition fixée), \(Q_r\) devient inférieur à \(K^\circ\) : évolution dans le sens direct, il se forme de l'ammoniac. C'est le calcul de l'EXO 11.</p>
    <p><strong>Q2.</strong> Relation de Van 't Hoff : \( \dfrac{\mathrm{d}\ln K^\circ}{\mathrm{d}T} \) \( = \dfrac{\Delta_rH^\circ}{RT^2} \lt 0 \) : \(K^\circ\) diminue quand \(T\) augmente. Un mélange à l'équilibre que l'on chauffe a donc \(Q_r \gt K^\circ\) : il évolue dans le sens indirect, l'ammoniac se décompose.</p>
    <p><strong>Q3.</strong> Compromis entre thermodynamique et cinétique. À basse température, \(K^\circ\) est grande mais la réaction est beaucoup trop lente, même avec le catalyseur au fer. Vers 450 °C, la vitesse est acceptable ; la haute pression compense alors en partie la faible constante. Le taux de conversion par passage reste modéré (de l'ordre de 15 à 25 %) : le mélange non converti est recyclé après extraction de l'ammoniac.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 13</span><span class="diff">★ ★ ☆</span>
  <h3>Relation de Van 't Hoff : constante à deux températures (hors programme en PTSI, vu en 2ᵉ année)</h3>
  <div class="statement">Une réaction a pour constante \(K^\circ(298\ \text{K}) = 1{,}0\times10^{-4}\) et pour enthalpie standard de réaction \(\Delta_r H^\circ = 80\ \text{kJ·mol}^{-1}\), supposée indépendante de la température. \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(K^\circ(500\ \text{K})\) par la relation de Van 't Hoff intégrée.</div>
  <div class="q"><strong>Q2.</strong> À 500 K, un mélange où toutes les activités valent 1 évolue-t-il dans le sens direct ?</div>
  <div class="q"><strong>Q3.</strong> À quelle température \(K^\circ = 1\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( \ln\dfrac{K^\circ_2}{K^\circ_1} \) \( = -\dfrac{\Delta_rH^\circ}{R}\left(\dfrac{1}{T_2} - \dfrac{1}{T_1}\right) \) \( = -\dfrac{80\,000}{8{,}314}\left(\dfrac{1}{500} - \dfrac{1}{298}\right) \) \( = 13{,}05 \). \( K^\circ_2 \) \( = 1{,}0\times10^{-4}\times e^{13{,}05} \) \( = 1{,}0\times10^{-4}\times4{,}6\times10^5 \) \( = 46 \).</p>
    <p><strong>Q2.</strong> \(Q_r = 1 \lt K^\circ = 46\) : oui, sens direct.</p>
    <p><strong>Q3.</strong> \( \ln(1/10^{-4}) = 9{,}21 \) \( = -\dfrac{80\,000}{8{,}314}\left(\dfrac1T - \dfrac1{298}\right) \), d'où \( \dfrac1T \) \( = \dfrac1{298} - \dfrac{9{,}21\times8{,}314}{80\,000} \) \( = 2{,}40\times10^{-3}\ \text{K}^{-1} \) et \(T = 417\ \text{K}\) (144 °C).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 14</span><span class="diff">★ ★ ★</span>
  <h3>Dissoudre le chlorure d'argent dans l'ammoniac (complexation : hors programme en PTSI, pour aller plus loin)</h3>
  <div class="statement">AgCl(s) = Ag⁺(aq) + Cl⁻(aq) : \(K_s = 1{,}8\times10^{-10}\). En présence d'ammoniac, les ions argent forment un ion complexe : Ag⁺(aq) + 2 NH₃(aq) = [Ag(NH₃)₂]⁺(aq), \(\beta = 1{,}7\times10^7\). On place un excès de AgCl(s) dans une solution d'ammoniac à 1,00 mol·L⁻¹ (concentration apportée).</div>
  <div class="q"><strong>Q1.</strong> Écrire la réaction de dissolution de AgCl dans l'ammoniac et calculer sa constante.</div>
  <div class="q"><strong>Q2.</strong> Calculer la solubilité \(s\) de AgCl dans cette solution, d'abord en négligeant la consommation d'ammoniac, puis exactement.</div>
  <div class="q"><strong>Q3.</strong> Comparer à la solubilité dans l'eau pure et interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> AgCl(s) + 2 NH₃(aq) = [Ag(NH₃)₂]⁺(aq) + Cl⁻(aq), somme des deux équations : \( K^\circ = K_s\,\beta \) \( = 1{,}8\times10^{-10}\times1{,}7\times10^7 \) \( = 3{,}1\times10^{-3} \).</p>
    <p><strong>Q2.</strong> Tableau (solide en excès) : \([\mathrm{Ag(NH_3)_2^+}] = [\mathrm{Cl^-}] = s\), \([\mathrm{NH_3}] = 1{,}00 - 2s\) (en mol·L⁻¹). \(K^\circ = \dfrac{s^2}{(1{,}00 - 2s)^2}\). Si l'on néglige \(2s\) : \(s \approx \sqrt{K^\circ} = 0{,}055\ \text{mol·L}^{-1}\) ; mais alors \(2s = 0{,}11\), soit 11 % de l'ammoniac : l'approximation est médiocre. Exactement : \(\dfrac{s}{1{,}00 - 2s} = \sqrt{K^\circ} = 0{,}0553\), d'où \( s \) \( = \dfrac{0{,}0553}{1 + 2\times0{,}0553} \) \( = 0{,}050\ \text{mol·L}^{-1} \).</p>
    <p><strong>Q3.</strong> Dans l'eau pure, \( s_0 = c^\circ\sqrt{K_s} \) \( = 1{,}3\times10^{-5}\ \text{mol·L}^{-1} \) : l'ammoniac multiplie la solubilité par environ 3 700. En consommant les ions Ag⁺, la complexation abaisse le quotient de la réaction de dissolution, qui reprend. C'est le principe du fixage en photographie argentique, avec le thiosulfate.</p>
  </div>
</div>
