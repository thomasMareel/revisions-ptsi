<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 4.1.1 du programme de PTSI, « Description d'un système et de son évolution vers un état final ». C'est la porte d'entrée de toute la chimie des deux années : avancement, activité, quotient de réaction et constante d'équilibre servent ensuite dans <a href="#acidobase/cours">« Réactions acido-basiques »</a>, <a href="#precipitation/cours">« Réactions de dissolution et de précipitation »</a> et <a href="#oxred/cours">« Oxydoréduction »</a>, puis en 2ᵉ année dans <a href="#thermochimie/cours">« Thermodynamique de la transformation chimique »</a>, qui démontre le critère d'évolution admis ici. La vitesse à laquelle l'état final est atteint relève de <a href="#cinetique/cours">« Cinétique chimique »</a> (partie 4.1.2).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Système physico-chimique</strong> : recenser les espèces physico-chimiques présentes ; décrire la composition à l'aide des grandeurs pertinentes (quantité de matière, concentration, fraction molaire, pression partielle) (§1).</li>
        <li><strong>Variables intensives et extensives</strong> : identifier le caractère d'une variable (§2).</li>
        <li><strong>Transformation chimique</strong> : écrire l'équation de la réaction (ou des réactions) qui modélise une transformation donnée (§3).</li>
        <li><strong>Avancement</strong> : décrire qualitativement et quantitativement un système dans l'état initial ou dans un état d'avancement quelconque (§4).</li>
        <li><strong>Activité</strong> : l'exprimer pour une espèce pure ou dans un mélange, dans le cas des solutions aqueuses très diluées et des mélanges de gaz parfaits, avec référence à l'état standard (§5).</li>
        <li><strong>Quotient réactionnel et constante d'équilibre</strong> : exprimer le quotient réactionnel ; déterminer une constante d'équilibre ; identifier un état d'équilibre chimique (§6).</li>
        <li><strong>Critère d'évolution</strong> : prévoir le sens de l'évolution spontanée d'un système (§7).</li>
        <li><strong>État final</strong> : déterminer la composition du système dans l'état final, en distinguant équilibre chimique et transformation totale, pour une transformation modélisée par une réaction unique (§8, §9, §10).</li>
        <li><strong>Capacité numérique</strong> : déterminer, à l'aide d'un langage de programmation, l'état final d'un système, siège d'une transformation modélisée par une réaction, à partir des conditions initiales et de la valeur de la constante d'équilibre (§11).</li>
      </ul>
      <p>Hors programme en PTSI (vu en 2ᵉ année) : l'influence de la température sur \(K^\circ\) (relation de Van 't Hoff), l'enthalpie libre de réaction et la relation \(\Delta_r G^\circ = -RT\ln K^\circ\), l'optimisation d'un procédé. Hors de tout programme : le « principe de Le Chatelier » et les constantes dimensionnées \(K_c\), \(K_p\). Tout cela est regroupé en fin de chapitre.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · DÉCRIRE UN SYSTÈME PHYSICO-CHIMIQUE</div>
  <h2>Recenser les espèces et dire en quelles quantités elles sont présentes</h2>
  <div class="intro">Avant toute prévision, il faut savoir de quoi l'on parle : quelles espèces, dans quel état physique, réparties en combien de phases, et en quelles quantités. Cette description, apparemment banale, conditionne tout le reste : une espèce oubliée, ou un état physique mal attribué, fausse le quotient de réaction.</div>
  <div class="def-box">
    <strong>Système, espèce, phase.</strong> Le <strong>système</strong> est la partie de l'univers que l'on étudie (le contenu d'un bécher, d'un réacteur, d'une bouteille). Une <strong>espèce physico-chimique</strong> est une espèce chimique dans un état physique donné : H₂O(ℓ), H₂O(g) et H₂O(s) sont trois espèces physico-chimiques distinctes ; on précise (g) pour un gaz, (ℓ) pour un liquide, (s) pour un solide et (aq) pour un soluté dans l'eau. Une <strong>phase</strong> est une région du système où les grandeurs intensives (§2) varient continûment ; un système d'une seule phase est <strong>homogène</strong>, sinon <strong>hétérogène</strong>.
  </div>
  <p>Un <strong>corps pur</strong> ne contient qu'une espèce chimique (eau distillée, diazote, cuivre) ; un <strong>mélange</strong> en contient plusieurs. Des gaz se mélangent toujours en une seule phase ; deux solides distincts forment deux phases ; deux liquides peuvent former une ou deux phases selon leur miscibilité (eau et éthanol : une ; eau et huile : deux).</p>
  <div class="prop-box">
    <strong>Grandeurs de composition.</strong> Pour une espèce \(i\) de quantité de matière \(n_i\) (en mol) :
    <ul>
      <li><strong>concentration en quantité de matière</strong> d'un soluté dans une solution de volume \(V\) : \(c_i = [\mathrm{X}_i] = n_i/V\), en mol·L⁻¹ ;</li>
      <li><strong>fraction molaire</strong> dans une phase qui contient \(n_{\text{tot}}\) moles : \(x_i = n_i/n_{\text{tot}}\), sans dimension, avec \(\sum_i x_i = 1\) ;</li>
      <li><strong>pression partielle</strong> d'un gaz dans un mélange idéal de gaz parfaits sous la pression totale \(P\) : \(P_i = x_i P\). C'est la pression qu'aurait le gaz \(i\) s'il occupait seul le volume \(V\) à la même température : \(P_i V = n_i RT\).</li>
    </ul>
    <div class="formula" data-nom="Pression partielle">$$P_i = x_i\,P = \frac{n_i RT}{V} \qquad\text{et}\qquad \sum_i P_i = P$$</div>
  </div>
  <div class="method-box"><strong>Exemple — l'air d'une salle de classe</strong>
    <p>L'air sec contient, en fractions molaires, 78,1 % de N₂, 20,9 % de O₂, 0,93 % d'argon et 0,042 % de CO₂. Une salle est à 20 °C sous \(P = 1{,}013\ \text{bar}\).</p>
    <ol>
      <li>Espèces physico-chimiques : N₂(g), O₂(g), Ar(g), CO₂(g) (et H₂O(g) si l'air est humide) ; une seule phase gazeuse.</li>
      <li>Pressions partielles : \(P_{\mathrm{O_2}} = 0{,}209\times1{,}013 = 0{,}212\ \text{bar}\) ; \(P_{\mathrm{CO_2}} = 4{,}2\times10^{-4}\times1{,}013 = 4{,}3\times10^{-4}\ \text{bar}\).</li>
      <li>Quantité totale dans 1,00 m³ : \(n = PV/(RT) = 1{,}013\times10^5\times1{,}00/(8{,}314\times293{,}15) = 41{,}6\ \text{mol}\), dont \(n_{\mathrm{O_2}} = 0{,}209\times41{,}6 = 8{,}7\ \text{mol}\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — une solution de sel</strong>
    <p>On dissout 5,85 g de chlorure de sodium (\(M = 58{,}44\ \text{g·mol}^{-1}\)) dans de l'eau pour obtenir 250,0 mL de solution.</p>
    <ol>
      <li>Espèces présentes : H₂O(ℓ), Na⁺(aq), Cl⁻(aq), et des traces de H₃O⁺(aq) et HO⁻(aq) (autoprotolyse de l'eau). Le solide NaCl(s) a disparu : il n'est pas une espèce du système final.</li>
      <li>\(n = 5{,}85/58{,}44 = 0{,}100\ \text{mol}\), donc \([\mathrm{Na^+}] = [\mathrm{Cl^-}] = 0{,}100/0{,}2500 = 0{,}400\ \text{mol·L}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire « la concentration de NaCl » dans la solution. NaCl(s) n'existe plus : ce sont les ions Na⁺(aq) et Cl⁻(aq) qu'il faut recenser, chacun avec sa propre concentration. De même, la fraction molaire d'un gaz se calcule sur la seule phase gazeuse : un solide ou un liquide présent dans le récipient n'entre pas dans \(n_{\text{tot}}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · VARIABLES INTENSIVES ET EXTENSIVES</div>
  <h2>Ce qui s'additionne et ce qui ne s'additionne pas</h2>
  <div class="intro">Réunir deux systèmes double certaines grandeurs et en laisse d'autres inchangées. Savoir dans quelle catégorie tombe une grandeur évite des erreurs grossières, comme additionner des concentrations ou des températures lors d'un mélange.</div>
  <div class="def-box">
    <strong>Extensive, intensive.</strong> Une grandeur est <strong>extensive</strong> si elle est proportionnelle à la taille du système : la valeur pour la réunion de deux systèmes disjoints est la somme des valeurs (quantité de matière \(n\), masse \(m\), volume \(V\), énergie interne \(U\)). Elle est <strong>intensive</strong> si elle est définie en chaque point et ne change pas quand on double le système, toutes choses égales par ailleurs (température \(T\), pression \(P\), concentration \(c\), fraction molaire \(x_i\), masse volumique \(\rho\)).
  </div>
  <p>Le quotient de deux grandeurs extensives est intensif : \(c = n/V\), \(\rho = m/V\), le volume molaire \(V_m = V/n\), la masse molaire \(M = m/n\). Les grandeurs intensives sont celles qui décrivent l'<strong>état d'une phase</strong> et qui figurent dans les activités (§5) : c'est pourquoi le quotient de réaction et la constante d'équilibre sont, eux aussi, indépendants de la taille du système.</p>
  <div class="method-box"><strong>Exemple — mélanger deux solutions</strong>
    <p>On mélange 100 mL de solution de NaCl à 0,40 mol·L⁻¹ et 300 mL à 0,20 mol·L⁻¹ (volumes supposés additifs).</p>
    <ol>
      <li>On additionne les grandeurs extensives : \(V = 400\ \text{mL}\) et \(n(\mathrm{Na^+}) = 0{,}040 + 0{,}060 = 0{,}100\ \text{mol}\).</li>
      <li>On en déduit la grandeur intensive : \([\mathrm{Na^+}] = 0{,}100/0{,}400 = 0{,}25\ \text{mol·L}^{-1}\).</li>
      <li>Contrôle : la concentration finale est comprise entre 0,20 et 0,40, plus proche de 0,20 car cette solution est en plus grand volume. Ni la somme (0,60) ni la moyenne simple (0,30) ne conviennent.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner des grandeurs intensives. Deux litres d'eau à 20 °C ne sont pas « à 40 °C », et deux solutions à 0,1 mol·L⁻¹ mélangées restent à 0,1 mol·L⁻¹ (si elles ne réagissent pas). Seules les grandeurs extensives s'additionnent ; une grandeur intensive se recalcule ensuite.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TRANSFORMATION ET ÉQUATION DE RÉACTION</div>
  <h2>Modéliser une transformation par une équation</h2>
  <div class="intro">Une transformation chimique est ce que l'on observe : des espèces disparaissent, d'autres apparaissent. L'équation de réaction en est le modèle : elle dit dans quelles proportions les espèces sont consommées et produites. Une même transformation peut demander une ou plusieurs équations.</div>
  <div class="def-box">
    <strong>Transformation et réaction.</strong> Une <strong>transformation chimique</strong> change la nature des espèces présentes (les éléments, eux, sont conservés : ce n'est ni un changement d'état ni une transformation nucléaire). On la <strong>modélise</strong> par une ou plusieurs <strong>réactions chimiques</strong>, chacune symbolisée par une <strong>équation de réaction</strong> qui conserve les éléments et la charge électrique :
    <div class="formula" data-nom="Équation de réaction">$$a\,\mathrm{A} + b\,\mathrm{B} = c\,\mathrm{C} + d\,\mathrm{D} \qquad\Longleftrightarrow\qquad 0 = \sum_i \nu_i\,\mathrm{A}_i$$</div>
    Les nombres \(a\), \(b\), \(c\), \(d\) sont les <strong>coefficients stœchiométriques</strong>. Dans l'écriture compacte de droite, le <strong>coefficient stœchiométrique algébrique</strong> \(\nu_i\) est positif pour un produit, négatif pour un réactif : \(\nu_{\mathrm A} = -a\), \(\nu_{\mathrm C} = +c\).
  </div>
  <p>Le signe « = » est celui de l'équation de réaction : il ne préjuge pas du sens de l'évolution, que l'on prévoit au §7. On rencontre aussi « → », qui souligne qu'une réaction est totale, et « ⇄ », qui souligne un équilibre. La notation \(0 = \sum_i \nu_i \mathrm{A}_i\) sera celle de 2ᵉ année ; elle permet d'écrire avec une seule formule ce qui concerne réactifs et produits (§4, §6).</p>
  <div class="method-box"><strong>Exemple — ajuster une équation</strong>
    <ol>
      <li>Combustion complète du propane : C₃H₈(g) + O₂(g) → CO₂(g) + H₂O(g). Carbone : 3 CO₂ ; hydrogène : 4 H₂O ; oxygène : 3×2 + 4 = 10 atomes, soit 5 O₂. D'où C₃H₈ + 5 O₂ = 3 CO₂ + 4 H₂O ; \(\nu = (-1, -5, +3, +4)\).</li>
      <li>Dépôt de cuivre sur de l'aluminium : Al(s) + Cu²⁺(aq) → Al³⁺(aq) + Cu(s). Les éléments sont équilibrés, mais pas la charge (2 à gauche, 3 à droite) : 2 Al + 3 Cu²⁺ = 2 Al³⁺ + 3 Cu (charge 6 des deux côtés).</li>
    </ol>
  </div>
  <p><strong>Une ou plusieurs réactions.</strong> Si le dioxygène manque, la combustion du propane produit aussi du monoxyde de carbone : la transformation se modélise alors par deux réactions, C₃H₈ + 5 O₂ = 3 CO₂ + 4 H₂O et C₃H₈ + 7/2 O₂ = 3 CO + 4 H₂O, chacune avec son propre avancement. Le programme de PTSI se limite au calcul de l'état final pour une <strong>réaction unique</strong> ; reconnaître qu'il en faut plusieurs fait partie de la modélisation.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une équation est unique. 2 H₂ + O₂ = 2 H₂O et H₂ + ½ O₂ = H₂O décrivent la même transformation, mais l'avancement de la première est la moitié de celui de la seconde, et sa constante d'équilibre en est le carré (§6). Toute grandeur de réaction se rapporte à <strong>une équation écrite</strong>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · AVANCEMENT ET TABLEAU D'AVANCEMENT</div>
  <h2>Une seule variable pour suivre toute la réaction</h2>
  <div class="intro">Les quantités de toutes les espèces varient en même temps, dans les proportions de l'équation. Une seule variable, l'avancement, suffit donc à décrire un état quelconque du système : c'est elle que l'on cherchera dans l'état final.</div>
  <div class="def-box">
    <strong>Avancement.</strong> Pour une transformation modélisée par une réaction unique \(0 = \sum_i \nu_i \mathrm A_i\), l'<strong>avancement</strong> \(\xi\) (en mol) est défini par
    <div class="formula" data-nom="Avancement">$$n_i = n_{i,0} + \nu_i\,\xi \qquad\text{pour toute espèce } i$$</div>
    Il est nul dans l'état initial, positif si la réaction a progressé dans le sens direct, négatif si elle a progressé dans le sens indirect. En solution, à volume \(V\) constant, on utilise aussi l'<strong>avancement volumique</strong> \(x = \xi/V\) (en mol·L⁻¹) : \(c_i = c_{i,0} + \nu_i\,x\).
  </div>
  <div class="prop-box">
    <strong>Bornes de l'avancement et réactif limitant.</strong> Aucune quantité ne pouvant être négative, \(\xi\) reste entre \(\xi_{\min}\) (épuisement d'un produit, si la réaction recule) et \(\xi_{\max}\) (épuisement d'un réactif). Le <strong>réactif limitant</strong> est celui qui s'épuise le premier, pour \(\xi_{\max} = \min_{\nu_i \lt 0}\big(n_{i,0}/|\nu_i|\big)\). Le <strong>taux d'avancement</strong> final est \(\tau = \xi_f/\xi_{\max}\), compris entre 0 et 1 ; \(\tau = 1\) pour une transformation totale. Les réactifs sont en <strong>proportions stœchiométriques</strong> quand ils s'épuisent tous ensemble.
  </div>
  <div class="method-box"><strong>Exemple — le tableau d'avancement d'une combustion</strong>
    <p>On fait brûler 1,0 mol de propane avec 4,0 mol de dioxygène.</p>
    <div><table>
      <tr><th>équation</th><th>C₃H₈</th><th>+ 5 O₂</th><th>= 3 CO₂</th><th>+ 4 H₂O</th></tr>
      <tr><td>état initial</td><td>1,0</td><td>4,0</td><td>0</td><td>0</td></tr>
      <tr><td>état \(\xi\)</td><td>\(1{,}0 - \xi\)</td><td>\(4{,}0 - 5\xi\)</td><td>\(3\xi\)</td><td>\(4\xi\)</td></tr>
      <tr><td>état final</td><td>0,20</td><td>0</td><td>2,4</td><td>3,2</td></tr>
    </table></div>
    <ol>
      <li>\(\xi \le 1{,}0\) (propane) et \(\xi \le 4{,}0/5 = 0{,}80\) (dioxygène) : \(\xi_{\max} = 0{,}80\ \text{mol}\), le dioxygène est limitant.</li>
      <li>La combustion est totale : \(\xi_f = 0{,}80\ \text{mol}\), d'où la dernière ligne ; il se forme \(3{,}2\times18{,}0 = 58\ \text{g}\) d'eau.</li>
    </ol>
  </div>

    <p>On plonge 0,27 g d'aluminium (\(M = 26{,}98\ \text{g·mol}^{-1}\)) dans 100,0 mL de solution de Cu²⁺ à 0,100 mol·L⁻¹ ; la réaction 2 Al + 3 Cu²⁺ = 2 Al³⁺ + 3 Cu est totale.</p>
    <ol>
      <li>\(n(\mathrm{Al})_0 = 1{,}00\times10^{-2}\ \text{mol}\) et \(n(\mathrm{Cu^{2+}})_0 = 1{,}00\times10^{-2}\ \text{mol}\). Bornes : \(\xi \le 1{,}00\times10^{-2}/2\) et \(\xi \le 1{,}00\times10^{-2}/3\), donc \(\xi_{\max} = 3{,}33\times10^{-3}\ \text{mol}\) : Cu²⁺ est limitant, bien qu'il soit introduit en même quantité que l'aluminium.</li>
      <li>État final : \(n(\mathrm{Al}) = 1{,}00\times10^{-2} - 2\times3{,}33\times10^{-3} = 3{,}3\times10^{-3}\ \text{mol}\) (0,090 g d'aluminium restant) ; \(n(\mathrm{Cu}) = 1{,}00\times10^{-2}\ \text{mol}\) (0,64 g) ; \([\mathrm{Al^{3+}}] = 6{,}67\times10^{-3}/0{,}100 = 6{,}7\times10^{-2}\ \text{mol·L}^{-1}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : désigner comme limitant le réactif introduit en plus petite quantité. Il faut comparer les rapports \(n_{i,0}/|\nu_i|\), pas les quantités \(n_{i,0}\) : dans l'exemple ci-dessus, Cu²⁺ est limitant à quantité égale, parce qu'il en faut 3 pour 2 Al.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · ACTIVITÉ D'UNE ESPÈCE</div>
  <h2>Un nombre sans dimension pour peser chaque espèce</h2>
  <div class="intro">Pour écrire une loi d'équilibre valable pour des gaz, des solutés, des solides et le solvant, il faut une même grandeur pour toutes les espèces : l'activité. Elle compare l'espèce à un état de référence, l'état standard, et vaut 1 dans cet état.</div>
  <div class="def-box">
    <strong>Activité (cas idéaux du programme).</strong> L'activité \(a_i\) d'une espèce est un nombre sans dimension :
    <div><table>
      <tr><th>espèce</th><th>activité</th><th>état standard de référence</th></tr>
      <tr><td>gaz parfait, seul ou en mélange</td><td>\(a_i = \dfrac{P_i}{P^\circ}\)</td><td>gaz parfait pur sous \(P^\circ = 1\ \text{bar}\)</td></tr>
      <tr><td>soluté d'une solution aqueuse très diluée</td><td>\(a_i = \dfrac{c_i}{c^\circ}\)</td><td>soluté à \(c^\circ = 1\ \text{mol·L}^{-1}\), au comportement de solution infiniment diluée</td></tr>
      <tr><td>solvant (l'eau)</td><td>\(a = 1\)</td><td>solvant pur</td></tr>
      <tr><td>solide pur, liquide pur seul dans sa phase</td><td>\(a = 1\)</td><td>corps pur sous \(P^\circ\)</td></tr>
    </table></div>
  </div>
  <p>La <strong>pression standard</strong> vaut exactement \(P^\circ = 1\ \text{bar} = 10^5\ \text{Pa}\), et la <strong>concentration standard</strong> \(c^\circ = 1\ \text{mol·L}^{-1}\). Diviser par ces grandeurs rend les activités sans dimension, et leur valeur numérique est celle de \(P_i\) en bar ou de \(c_i\) en mol·L⁻¹. Ces expressions supposent un comportement idéal : gaz parfaits, solutés dilués (en pratique, quelques \(10^{-2}\ \text{mol·L}^{-1}\) au plus pour des ions). Au-delà, on introduit des coefficients d'activité, hors programme.</p>
  <div class="method-box"><strong>Exemple — une bouteille d'eau gazeuse</strong>
    <p>Dans une bouteille fermée à 20 °C, le gaz au-dessus du liquide est du CO₂ sous 2,5 bar ; le liquide contient 0,098 mol·L⁻¹ de CO₂ dissous et 2,0×10⁻³ mol·L⁻¹ d'ions Ca²⁺.</p>
    <ol>
      <li>\(a(\mathrm{CO_2(g)}) = 2{,}5/1 = 2{,}5\) : une activité peut dépasser 1.</li>
      <li>\(a(\mathrm{CO_2(aq)}) = 0{,}098\) et \(a(\mathrm{Ca^{2+}}) = 2{,}0\times10^{-3}\) ; \(a(\mathrm{H_2O(\ell)}) = 1\).</li>
      <li>Au fond d'un four à chaux, sous \(P(\mathrm{CO_2}) = 0{,}20\ \text{bar}\) : \(a(\mathrm{CaCO_3(s)}) = a(\mathrm{CaO(s)}) = 1\), quelle que soit la quantité de chaque solide, et \(a(\mathrm{CO_2}) = 0{,}20\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : faire dépendre l'activité d'un solide de sa quantité. Un gramme ou un kilogramme de calcaire ont la même activité, 1 : un solide pur est dans son état standard, quelle que soit sa masse. Autre piège : écrire pour l'eau \(a = [\mathrm{H_2O}]/c^\circ = 55{,}5\). Le solvant a une activité égale à 1.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · QUOTIENT DE RÉACTION ET CONSTANTE D'ÉQUILIBRE</div>
  <h2>La loi d'action des masses</h2>
  <div class="intro">Le quotient de réaction combine les activités en une seule grandeur qui situe le système par rapport à l'équilibre. À l'équilibre, il prend une valeur qui ne dépend que de la température : la constante d'équilibre. C'est l'outil central du chapitre.</div>
  <div class="def-box">
    <strong>Quotient de réaction.</strong> Pour la réaction \(a\mathrm A + b\mathrm B = c\mathrm C + d\mathrm D\), dans un état quelconque du système,
    <div class="formula" data-nom="Quotient de réaction">$$Q_r = \prod_i a_i^{\,\nu_i} = \frac{a_{\mathrm C}^{\,c}\;a_{\mathrm D}^{\,d}}{a_{\mathrm A}^{\,a}\;a_{\mathrm B}^{\,b}}$$</div>
    Produits au numérateur, réactifs au dénominateur, chacun élevé à la puissance de son coefficient. \(Q_r\) est sans dimension ; il change au cours de la transformation.
  </div>
  <div class="prop-box">
    <strong>Loi d'action des masses (Guldberg et Waage, 1864).</strong> À chaque équation de réaction est associée une <strong>constante thermodynamique d'équilibre</strong> \(K^\circ(T)\), sans dimension, qui ne dépend que de la température. Lorsque le système est à l'équilibre chimique,
    <div class="formula" data-nom="Loi d'action des masses">$$Q_{r,\text{éq}} = K^\circ(T)$$</div>
    \(K^\circ\) ne dépend ni de la pression, ni des quantités initiales, ni de la présence d'un catalyseur ; elle dépend de l'équation écrite.
  </div>
  <div class="def-box">
    <strong>État d'équilibre chimique.</strong> Un système est à l'<strong>équilibre chimique</strong> lorsque sa composition n'évolue plus, que <strong>toutes</strong> les espèces de l'équation sont présentes et que \(Q_r = K^\circ\). À l'échelle microscopique, l'équilibre est dynamique : la réaction se poursuit dans les deux sens à la même vitesse (chapitre <a href="#cinetique/cours">« Cinétique chimique »</a>).
  </div>
  <div class="method-box"><strong>Exemple — écrire des quotients de réaction</strong>
    <ol>
      <li>N₂(g) + 3 H₂(g) = 2 NH₃(g) :
      <div class="formula">$$Q_r = \frac{(P_{\mathrm{NH_3}}/P^\circ)^2}{(P_{\mathrm{N_2}}/P^\circ)(P_{\mathrm{H_2}}/P^\circ)^3} = \frac{P_{\mathrm{NH_3}}^2\,P^{\circ 2}}{P_{\mathrm{N_2}}\,P_{\mathrm{H_2}}^3}$$</div></li>
      <li>CaCO₃(s) = CaO(s) + CO₂(g) : \(Q_r = P_{\mathrm{CO_2}}/P^\circ\) (les deux solides ont une activité 1).</li>
      <li>AgCl(s) = Ag⁺(aq) + Cl⁻(aq) : \(Q_r = [\mathrm{Ag^+}][\mathrm{Cl^-}]/c^{\circ 2}\) ; sa constante est le produit de solubilité \(K_s\) (chapitre <a href="#precipitation/cours">« Dissolution et précipitation »</a>).</li>
      <li>CH₃COOH(aq) + H₂O(ℓ) = CH₃COO⁻(aq) + H₃O⁺(aq) : \(Q_r = \dfrac{[\mathrm{CH_3COO^-}][\mathrm{H_3O^+}]}{[\mathrm{CH_3COOH}]\,c^\circ}\), l'eau solvant n'y figure pas ; sa constante est la constante d'acidité \(K_a\).</li>
    </ol>
  </div>
  <h3>Déterminer une constante d'équilibre</h3>
  <p>On détermine \(K^\circ\) en <strong>mesurant la composition d'un état d'équilibre</strong> (par une pression, une absorbance, un pH, une conductivité…), puis en calculant \(Q_{r,\text{éq}}\). On peut aussi la déduire d'autres constantes connues, en combinant les équations (propriété ci-dessous), ou, en 2ᵉ année, de données thermodynamiques.</p>
  <div class="method-box"><strong>Exemple — la constante de dissociation de N₂O₄ par une mesure de pression</strong>
    <p>Dans un flacon rigide de 1,00 L, vide, on introduit 0,0300 mol de N₂O₄ à 298 K. La réaction N₂O₄(g) = 2 NO₂(g) se produit ; à l'équilibre, la pression totale mesurée vaut 0,893 bar.</p>
    <ol>
      <li>Sans réaction, la pression serait \(P_0 = n_0RT/V = 0{,}0300\times8{,}314\times298/(1{,}00\times10^{-3}) = 0{,}744\ \text{bar}\).</li>
      <li>À l'équilibre, \(n_{\text{tot}} = (n_0 - \xi) + 2\xi = n_0 + \xi\) ; à \(T\) et \(V\) fixés, la pression est proportionnelle à \(n_{\text{tot}}\), donc \(\xi = n_0\,(P/P_0 - 1) = 0{,}0300\times(0{,}893/0{,}744 - 1) = 6{,}0\times10^{-3}\ \text{mol}\).</li>
      <li>Pressions partielles : \(P_{\mathrm{N_2O_4}} = (n_0 - \xi)RT/V = 0{,}594\ \text{bar}\) et \(P_{\mathrm{NO_2}} = 2\xi RT/V = 0{,}299\ \text{bar}\) (leur somme redonne 0,893 bar).</li>
      <li>\(K^\circ = \dfrac{(P_{\mathrm{NO_2}}/P^\circ)^2}{P_{\mathrm{N_2O_4}}/P^\circ} = \dfrac{0{,}299^2}{0{,}594} = 0{,}150\) à 298 K. Le taux de dissociation vaut \(\xi/n_0 = 0{,}20\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Combinaison d'équations.</strong> Si l'équation (R) est la combinaison linéaire \(\sum_k \lambda_k (\mathrm R_k)\) d'équations de constantes \(K^\circ_k\), alors
    <div class="formula" data-nom="Combinaison de constantes">$$K^\circ = \prod_k \left(K^\circ_k\right)^{\lambda_k} \qquad\text{soit}\qquad \log K^\circ = \sum_k \lambda_k \log K^\circ_k$$</div>
    En particulier : inverser une équation inverse sa constante ; multiplier ses coefficients par \(\lambda\) élève sa constante à la puissance \(\lambda\) ; additionner deux équations multiplie leurs constantes.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Pourquoi les constantes se multiplient</span><div class="content"><p>Le quotient de réaction est un produit d'activités élevées aux coefficients algébriques : \(\ln Q_r = \sum_i \nu_i \ln a_i\), qui est <strong>linéaire</strong> en les coefficients \(\nu_i\). Si les coefficients de (R) sont \(\nu_i = \sum_k \lambda_k \nu_{i,k}\), alors, dans tout état du système, \(\ln Q_r = \sum_k \lambda_k \ln Q_{r,k}\). Dans un état où toutes ces réactions sont à l'équilibre, chaque \(Q_{r,k}\) vaut \(K^\circ_k\), d'où \(\ln K^\circ = \sum_k \lambda_k \ln K^\circ_k\).</p></div></div>
  <div class="method-box"><strong>Exemple — la constante dépend de l'équation écrite</strong>
    <ol>
      <li>2 NO₂(g) = N₂O₄(g), équation inversée : \(K^\circ = 1/0{,}150 = 6{,}7\).</li>
      <li>½ N₂O₄(g) = NO₂(g), coefficients divisés par 2 : \(K^\circ = 0{,}150^{1/2} = 0{,}387\).</li>
      <li>Les trois écritures décrivent le même équilibre et prévoient la même composition ; seule la valeur numérique de la constante change.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : donner une constante d'équilibre sans son équation, ou mélanger les unités (pressions en pascals avec \(P^\circ\) en bar). Les activités utilisent \(P^\circ = 1\ \text{bar}\) : écrire les pressions en bar, les concentrations en mol·L⁻¹, et vérifier que \(K^\circ\) est sans unité.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · PRÉVOIR LE SENS D'ÉVOLUTION</div>
  <h2>Comparer \(Q_r\) à \(K^\circ\)</h2>
  <div class="intro">Hors d'équilibre, un système évolue spontanément. Dans quel sens ? La réponse tient en une comparaison : celle du quotient de réaction de l'état initial à la constante d'équilibre. Ce critère est admis en PTSI ; il sera démontré en 2ᵉ année à partir du deuxième principe.</div>
  <div class="prop-box">
    <strong>Critère d'évolution spontanée.</strong> Soit \(Q_{r,i}\) le quotient de réaction de l'état initial :
    <ul>
      <li>si \(Q_{r,i} \lt K^\circ\), le système évolue dans le <strong>sens direct</strong> (\(\xi\) augmente) ;</li>
      <li>si \(Q_{r,i} \gt K^\circ\), il évolue dans le <strong>sens indirect</strong> (\(\xi\) diminue) ;</li>
      <li>si \(Q_{r,i} = K^\circ\), il est déjà à l'équilibre et n'évolue pas.</li>
    </ul>
    Dans tous les cas, l'évolution rapproche \(Q_r\) de \(K^\circ\).
  </div>
  <p><strong>Pourquoi un seul état final ?</strong> Quand \(\xi\) augmente, les activités des produits augmentent et celles des réactifs diminuent : \(Q_r(\xi)\) est une fonction <strong>strictement croissante</strong> de l'avancement. Pour une réaction où réactifs et produits sont des gaz ou des solutés, elle part de 0 quand un produit s'épuise et tend vers \(+\infty\) quand un réactif s'épuise : elle prend une et une seule fois la valeur \(K^\circ\). Le système va vers cette valeur, sans jamais la dépasser.</p>

  <div class="method-box"><strong>Exemple — trois mélanges pour le gaz à l'eau</strong>
    <p>La réaction CO(g) + H₂O(g) = CO₂(g) + H₂(g) a pour constante \(K^\circ = 1{,}4\) à 1 000 K. Il y a autant de molécules de gaz de chaque côté : les facteurs \(P/(n_{\text{tot}}P^\circ)\) se simplifient et \(Q_r = \dfrac{n_{\mathrm{CO_2}}\,n_{\mathrm{H_2}}}{n_{\mathrm{CO}}\,n_{\mathrm{H_2O}}}\).</p>
    <ol>
      <li>(a) 1 mol de CO et 1 mol de H₂O : \(Q_{r,i} = 0 \lt K^\circ\), évolution dans le sens direct (il n'y a encore aucun produit).</li>
      <li>(b) 1 mol de CO et de H₂O, 0,20 mol de CO₂ et de H₂ : \(Q_{r,i} = 0{,}04 \lt 1{,}4\), sens direct.</li>
      <li>(c) 1 mol de CO et de H₂O, 2 mol de CO₂ et de H₂ : \(Q_{r,i} = 4 \gt 1{,}4\), sens indirect : du monoxyde de carbone se forme.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — va-t-il se former un précipité ?</strong>
    <p>On mélange des solutions de nitrate d'argent et de chlorure de sodium ; juste après le mélange, \([\mathrm{Ag^+}] = [\mathrm{Cl^-}] = 1{,}0\times10^{-3}\ \text{mol·L}^{-1}\). Pour AgCl(s) = Ag⁺(aq) + Cl⁻(aq), \(K_s = 1{,}8\times10^{-10}\) à 25 °C.</p>
    <ol>
      <li>\(Q_{r,i} = (1{,}0\times10^{-3})^2 = 1{,}0\times10^{-6} \gt K_s\) : évolution dans le sens indirect, c'est-à-dire formation de AgCl(s). Un précipité blanc apparaît.</li>
      <li>Avec \(1{,}0\times10^{-6}\ \text{mol·L}^{-1}\) de chaque ion, \(Q_{r,i} = 1{,}0\times10^{-12} \lt K_s\) : le sens direct serait la dissolution du solide, mais il n'y a pas de solide. Rien ne se passe : la solution reste limpide.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure de \(Q_{r,i} \lt K^\circ\) que la réaction « est totale », ou qu'elle « se produit forcément ». Le critère donne seulement le <strong>sens</strong> : la réaction s'arrête dès que \(Q_r = K^\circ\) (§8), ou plus tôt si une espèce indispensable disparaît (§10), et ne peut pas démarrer si un réactif est absent (cas du précipité ci-dessus). Il ne dit rien non plus de la <strong>vitesse</strong> : un mélange de dihydrogène et de dioxygène, pour lequel \(Q_{r,i} \ll K^\circ\), peut rester des années sans réagir.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ÉTAT FINAL : L'ÉQUILIBRE CHIMIQUE</div>
  <h2>Résoudre \(Q_r(\xi) = K^\circ\)</h2>
  <div class="intro">Si toutes les espèces restent présentes, l'évolution s'arrête quand le quotient de réaction atteint la constante d'équilibre. L'état final s'obtient alors en résolvant une équation dont la seule inconnue est l'avancement.</div>
  <div class="method-box"><strong>Méthode — déterminer un état final d'équilibre</strong>
    <ol>
      <li>Écrire l'équation et prévoir le sens d'évolution (§7).</li>
      <li>Dresser le tableau d'avancement ; en déduire l'intervalle \(]\xi_{\min}, \xi_{\max}[\) des valeurs possibles.</li>
      <li>Exprimer chaque activité en fonction de \(\xi\) (concentrations, ou pressions partielles \(P_i = (n_i/n_{\text{gaz}})P\) à pression totale fixée, \(P_i = n_iRT/V\) à volume fixé).</li>
      <li>Écrire \(Q_r(\xi_{\text{éq}}) = K^\circ\) et résoudre ; garder la seule racine de l'intervalle.</li>
      <li>Calculer la composition et contrôler : quantités positives, \(Q_r = K^\circ\), sens d'évolution cohérent.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — gaz à l'eau, mélange équimolaire</strong>
    <p>1,0 mol de CO et 1,0 mol de H₂O à 1 000 K (\(K^\circ = 1{,}4\)).</p>
    <ol>
      <li>Tableau : CO et H₂O \(1{,}0 - \xi\), CO₂ et H₂ \(\xi\), avec \(0 \lt \xi \lt 1{,}0\).</li>
      <li>\(\dfrac{\xi^2}{(1{,}0 - \xi)^2} = 1{,}4\), donc \(\dfrac{\xi}{1{,}0 - \xi} = \sqrt{1{,}4} = 1{,}183\) (racine positive, car les deux quantités sont positives) et \(\xi = \dfrac{1{,}183}{2{,}183} = 0{,}54\ \text{mol}\).</li>
      <li>État final : 0,46 mol de CO et de H₂O, 0,54 mol de CO₂ et de H₂ ; \(\tau = 54\ \%\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — le même, avec un excès de vapeur d'eau</strong>
    <p>1,0 mol de CO et 3,0 mol de H₂O, même température.</p>
    <ol>
      <li>\(\dfrac{\xi^2}{(1{,}0 - \xi)(3{,}0 - \xi)} = 1{,}4\), soit \(0{,}4\,\xi^2 - 5{,}6\,\xi + 4{,}2 = 0\).</li>
      <li>Racines : \(\xi = \dfrac{5{,}6 \pm \sqrt{5{,}6^2 - 4\times0{,}4\times4{,}2}}{0{,}8}\), soit 0,795 ou 13,2. Seule la première est dans \(]0 ; 1{,}0[\).</li>
      <li>\(\tau = 80\ \%\) : en mettant de la vapeur d'eau en excès, on convertit une plus grande part du monoxyde de carbone. C'est ce que fait l'industrie pour produire du dihydrogène.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — dissociation sous pression totale fixée</strong>
    <p>1,0 mol de N₂O₄ maintenue sous \(P = 1{,}0\ \text{bar}\) à 298 K (\(K^\circ = 0{,}150\)). Soit \(\alpha = \xi/n_0\) le taux de dissociation.</p>
    <ol>
      <li>Quantités : \(n_{\mathrm{N_2O_4}} = n_0(1 - \alpha)\), \(n_{\mathrm{NO_2}} = 2n_0\alpha\), \(n_{\text{gaz}} = n_0(1 + \alpha)\).</li>
      <li>Pressions partielles : \(P_{\mathrm{N_2O_4}} = \dfrac{1 - \alpha}{1 + \alpha}P\) et \(P_{\mathrm{NO_2}} = \dfrac{2\alpha}{1 + \alpha}P\).</li>
      <li>\(K^\circ = \dfrac{4\alpha^2}{1 - \alpha^2}\,\dfrac{P}{P^\circ}\), d'où \(\alpha = \sqrt{\dfrac{K^\circ}{K^\circ + 4P/P^\circ}} = \sqrt{\dfrac{0{,}150}{4{,}150}} = 0{,}190\).</li>
      <li>Fraction molaire de NO₂ : \(2\alpha/(1 + \alpha) = 0{,}32\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : garder la mauvaise racine d'une équation du second degré, ou oublier que \(n_{\text{gaz}}\) dépend de \(\xi\) quand le nombre de molécules de gaz change. Une racine qui rend une quantité négative est à rejeter ; et à pression totale fixée, une pression partielle n'est pas proportionnelle à \(n_i\) seul, mais à \(n_i/n_{\text{gaz}}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · RÉACTIONS TOTALES, QUASI TOTALES OU PEU AVANCÉES</div>
  <h2>Quand l'ordre de grandeur de \(K^\circ\) simplifie le calcul</h2>
  <div class="intro">Les constantes d'équilibre s'étalent sur des dizaines d'ordres de grandeur. Quand \(K^\circ\) est très grande ou très petite, on évite la résolution exacte par une hypothèse que l'on vérifie ensuite. C'est la démarche systématique des chapitres de chimie des solutions.</div>
  <div class="prop-box">
    <strong>Deux cas limites.</strong>
    <ul>
      <li>\(K^\circ\) <strong>très grande</strong> : on suppose la réaction <strong>quasi totale</strong> (\(\xi_f \approx \xi_{\max}\)) ; on calcule la composition finale, puis la quantité restante du réactif limitant grâce à \(K^\circ\) ; on vérifie qu'elle est négligeable.</li>
      <li>\(K^\circ\) <strong>très petite</strong> : on suppose la réaction <strong>très peu avancée</strong> (\(\xi_f\) négligeable devant les quantités initiales de réactifs) ; on simplifie \(Q_r\), on résout, puis on vérifie l'hypothèse.</li>
    </ul>
    Règle d'usage : une réaction est souvent quasi totale pour \(K^\circ \ge 10^3\) à \(10^4\) ; pour A + B = C + D en quantités égales, \(K^\circ = 10^3\) donne \(\tau = 97\ \%\) et \(K^\circ = 10^4\), 99 %. Mais ce seuil dépend des concentrations dès que le nombre d'espèces dissoutes change : il faut toujours vérifier.
  </div>

  <div class="method-box"><strong>Exemple — réaction quasi totale : zinc et ions cuivre(II)</strong>
    <p>On ajoute de la poudre de zinc en excès à 100 mL de solution de Cu²⁺ à 0,10 mol·L⁻¹. Pour Zn(s) + Cu²⁺(aq) = Zn²⁺(aq) + Cu(s), \(K^\circ = 10^{37}\) à 25 °C (calculée au chapitre <a href="#oxred/cours">« Oxydoréduction »</a>).</p>
    <ol>
      <li>Hypothèse : réaction quasi totale, Cu²⁺ limitant. \([\mathrm{Zn^{2+}}]_f \approx 0{,}10\ \text{mol·L}^{-1}\).</li>
      <li>Le zinc restant et le cuivre formé sont des solides (activité 1) : \(Q_r = [\mathrm{Zn^{2+}}]/[\mathrm{Cu^{2+}}] = K^\circ\), d'où \([\mathrm{Cu^{2+}}]_f = 0{,}10/10^{37} = 10^{-38}\ \text{mol·L}^{-1}\).</li>
      <li>Vérification : c'est \(6\times10^{-16}\) ion dans les 100 mL. Il ne reste en réalité aucun ion Cu²⁺ : la transformation est totale.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — réaction très peu avancée : le monoxyde d'azote dans une flamme</strong>
    <p>Pour N₂(g) + O₂(g) = 2 NO(g), \(K^\circ = 4{,}0\times10^{-4}\) à 2 000 K (et \(4{,}5\times10^{-31}\) à 298 K). On chauffe de l'air (pour 1 mol : 0,78 mol de N₂ et 0,21 mol de O₂) jusqu'à l'équilibre à 2 000 K.</p>
    <ol>
      <li>Autant de molécules de gaz de chaque côté : \(Q_r = \dfrac{(2\xi)^2}{(0{,}78 - \xi)(0{,}21 - \xi)}\).</li>
      <li>Hypothèse \(\xi \ll 0{,}21\) : \(4\xi^2 \approx K^\circ\times0{,}78\times0{,}21\), d'où \(\xi \approx 4{,}0\times10^{-3}\ \text{mol}\).</li>
      <li>Vérification : \(\xi/0{,}21 = 2\ \%\), l'hypothèse est justifiée (la résolution exacte donne \(4{,}0\times10^{-3}\ \text{mol}\) elle aussi). L'air contient alors 0,8 % de NO, ce qui explique les oxydes d'azote émis par les moteurs ; à 298 K, la fraction d'équilibre ne serait que de \(3\times10^{-16}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : s'arrêter à l'hypothèse. « \(K^\circ\) est grande, donc la réaction est totale » n'est qu'une conjecture : la figure montre qu'avec \(K^\circ = 10^4\), A + B = C n'avance qu'à 38 % pour \(c_0 = 10^{-4}\ \text{mol·L}^{-1}\). Une hypothèse non vérifiée ne vaut rien.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · TRANSFORMATION TOTALE ET RUPTURE D'ÉQUILIBRE</div>
  <h2>Quand une espèce disparaît avant l'équilibre</h2>
  <div class="intro">Avec un solide pur, le quotient de réaction ne dépend pas de la quantité de solide. Si ce solide est entièrement consommé avant que \(Q_r\) atteigne \(K^\circ\), la transformation s'arrête faute de réactif : l'état final n'est pas un équilibre. C'est la rupture d'équilibre, fréquente pour les systèmes hétérogènes.</div>
  <div class="prop-box">
    <strong>Équilibre ou transformation totale.</strong> Un état d'équilibre exige la présence de <strong>toutes</strong> les espèces de l'équation. Si une espèce de la réaction disparaît (en général un solide) alors que \(Q_r \ne K^\circ\), l'évolution s'arrête : la transformation est <strong>totale</strong> et l'état final vérifie \(Q_{r,f} \ne K^\circ\). On parle de <strong>rupture d'équilibre</strong>.
  </div>
  <div class="method-box"><strong>Méthode — trancher entre équilibre et transformation totale</strong>
    <ol>
      <li>Supposer l'équilibre atteint et calculer \(\xi_{\text{éq}}\) par \(Q_r = K^\circ\), sans tenir compte de la quantité de solide.</li>
      <li>Comparer à l'avancement maximal \(\xi_{\max}\) permis par le solide.</li>
      <li>Si \(\xi_{\text{éq}} \lt \xi_{\max}\) : il reste du solide, l'équilibre est atteint. Sinon : tout le solide est consommé, \(\xi_f = \xi_{\max}\), et l'on vérifie que \(Q_{r,f}\) reste du bon côté de \(K^\circ\).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — calcaire chauffé dans un récipient fermé</strong>
    <p>Pour CaCO₃(s) = CaO(s) + CO₂(g), \(K^\circ = 0{,}20\) à 1 073 K. On chauffe à cette température un récipient rigide de 10,0 L, initialement vide, contenant \(n_0\) de carbonate de calcium (\(M = 100{,}1\ \text{g·mol}^{-1}\)).</p>
    <ol>
      <li>À l'équilibre, \(Q_r = P_{\mathrm{CO_2}}/P^\circ = K^\circ\) : \(P_{\mathrm{CO_2}} = 0{,}20\ \text{bar}\), soit \(n_{\text{éq}}(\mathrm{CO_2}) = K^\circ P^\circ V/(RT)\), c'est-à-dire \(0{,}20\times10^5\times1{,}00\times10^{-2}/(8{,}314\times1\,073)\) \(= 22{,}4\ \text{mmol}\).</li>
      <li>\(n_0 = 50{,}0\ \text{mmol}\) (5,0 g) : \(\xi_{\text{éq}} = 22{,}4\ \text{mmol} \lt \xi_{\max} = 50{,}0\ \text{mmol}\). Équilibre ; il reste 27,6 mmol (2,76 g) de CaCO₃.</li>
      <li>\(n_0 = 10{,}0\ \text{mmol}\) (1,0 g) : il faudrait 22,4 mmol de CO₂. Tout le carbonate se décompose : \(\xi_f = 10{,}0\ \text{mmol}\), \(P_{\mathrm{CO_2}} = 0{,}0892\ \text{bar}\), et \(Q_{r,f} = 0{,}089 \lt K^\circ\) : l'état final n'est pas un équilibre.</li>
    </ol>
  </div>

  <div class="method-box"><strong>Exemple — un peu de chlorure d'argent dans un litre d'eau</strong>
    <p>On introduit 1,0 mg de AgCl(s) (\(M = 143{,}3\ \text{g·mol}^{-1}\)) dans 1,0 L d'eau pure ; \(K_s = 1{,}8\times10^{-10}\).</p>
    <ol>
      <li>Si le solide restait présent, \([\mathrm{Ag^+}] = [\mathrm{Cl^-}] = c^\circ\sqrt{K_s} = 1{,}34\times10^{-5}\ \text{mol·L}^{-1}\), soit \(1{,}34\times10^{-5}\ \text{mol}\) dissous dans 1,0 L.</li>
      <li>Or on n'a introduit que \(1{,}0\times10^{-3}/143{,}3 = 7{,}0\times10^{-6}\ \text{mol}\) : tout se dissout, \(Q_{r,f} = (7{,}0\times10^{-6})^2 = 4{,}9\times10^{-11} \lt K_s\). La solution n'est pas saturée.</li>
      <li>Ce raisonnement est celui du domaine d'existence d'un précipité (chapitre <a href="#precipitation/cours">« Dissolution et précipitation »</a>).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(Q_r = K^\circ\) dans l'état final sans vérifier que le solide est encore là. Dans l'exemple du calcaire, cette égalité donnerait \(P_{\mathrm{CO_2}} = 0{,}20\ \text{bar}\) même avec 1 g de carbonate, soit une quantité de CO₂ supérieure à celle que contenait le solide. Un four à chaux ouvert sur l'air, où \(P_{\mathrm{CO_2}} \approx 4\times10^{-4}\ \text{bar} \lt K^\circ\), décompose ainsi tout le calcaire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · CAPACITÉ NUMÉRIQUE : L'ÉTAT FINAL EN PYTHON</div>
  <h2>Chercher l'avancement final par dichotomie</h2>
  <div class="intro">Dès que l'équation \(Q_r(\xi) = K^\circ\) n'est plus du second degré, ou que l'on veut l'état final pour de nombreuses conditions initiales, on la résout numériquement. Le programme demande de savoir le faire « à l'aide d'un langage de programmation ». Les propriétés du §7 garantissent que la dichotomie du chapitre <a href="#pynum/cours">« Méthodes numériques »</a> (§2) s'applique.</div>
  <div class="prop-box">
    <strong>Principe.</strong> Sur l'intervalle \(]\xi_{\min}, \xi_{\max}[\), la fonction \(f(\xi) = \ln Q_r(\xi) - \ln K^\circ\) est continue et strictement croissante. Si elle change de signe, son unique zéro est l'avancement à l'équilibre, que la dichotomie encadre en divisant l'intervalle par deux à chaque étape. Si elle reste négative jusqu'à l'épuisement du réactif limitant, la transformation est totale (§10).
  </div>
  <p>Premier programme, pour une réaction donnée : on écrit la condition d'équilibre sans quotient (en chassant les dénominateurs), ce qui évite toute division par zéro aux bornes de l'intervalle.</p>
  <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> zero_dicho(f, a, b, eps):
<span class="str">    """Dichotomie du chapitre « Méthodes numériques » (§2).</span>
<span class="str">    Précondition : a &lt; b, f continue, f(a) * f(b) &lt;= 0."""</span>
    fa = f(a)
    <span class="kw">assert</span> a &lt; b <span class="kw">and</span> fa * f(b) &lt;= 0 <span class="kw">and</span> eps &gt; 0
    <span class="kw">while</span> b - a &gt; eps:
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2

<span class="cmt"># N2O4(g) = 2 NO2(g) à 298 K (K° = 0,15) sous P = 1 bar</span>
K, P, n0 = 0.15, 1.0, 1.0     <span class="cmt"># P en bar, donc P/P° = P</span>

<span class="kw">def</span> f(xi):                    <span class="cmt"># Qr = K° écrit sans quotient</span>
    n_N2O4, n_NO2, n_gaz = n0 - xi, 2 * xi, n0 + xi
    <span class="kw">return</span> n_NO2**2 * P - K * n_N2O4 * n_gaz

xi = zero_dicho(f, 0, n0, 1e-9)
print(round(xi, 4))           <span class="cmt"># 0.1901 : 19 % de N2O4 dissocié</span></pre>
  <p>Second programme, général : une fonction <code>etat_final</code> reçoit les quantités initiales, les coefficients algébriques, une fonction qui calcule les activités et la constante. Elle détecte d'elle-même la rupture d'équilibre.</p>
  <pre class="codeblock"><span class="kw">import</span> math

<span class="kw">def</span> zero_dicho(f, a, b, eps):
    fa = f(a)
    <span class="kw">assert</span> a &lt; b <span class="kw">and</span> fa * f(b) &lt;= 0 <span class="kw">and</span> eps &gt; 0
    <span class="kw">while</span> b - a &gt; eps:
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2

<span class="kw">def</span> etat_final(n0, nu, activites, K):
<span class="str">    """n0 : quantités initiales (mol) ;</span>
<span class="str">    nu : coefficients algébriques (&gt; 0 pour un produit) ;</span>
<span class="str">    activites(n) : liste des activités (1 pour un solide) ;</span>
<span class="str">    K : constante d'équilibre.</span>
<span class="str">    Renvoie (xi final, nature de l'état final)."""</span>
    <span class="cmt"># bornes : épuisement d'un produit / d'un réactif</span>
    xmin = max((-a / v <span class="kw">for</span> a, v <span class="kw">in</span> zip(n0, nu) <span class="kw">if</span> v &gt; 0),
               default=-math.inf)
    xmax = min((-a / v <span class="kw">for</span> a, v <span class="kw">in</span> zip(n0, nu) <span class="kw">if</span> v &lt; 0),
               default=math.inf)
    eps = 1e-12 * max(abs(xmin), abs(xmax))
    a, b = xmin + eps, xmax - eps    <span class="cmt"># évite ln(0)</span>

    <span class="kw">def</span> f(x):                        <span class="cmt"># ln Qr - ln K°, croissante</span>
        n = [c + v * x <span class="kw">for</span> c, v <span class="kw">in</span> zip(n0, nu)]
        act = activites(n)
        lnQ = sum(v * math.log(ai) <span class="kw">for</span> v, ai <span class="kw">in</span> zip(nu, act))
        <span class="kw">return</span> lnQ - math.log(K)

    <span class="kw">if</span> f(b) &lt;= 0:          <span class="cmt"># Qr reste sous K° : le réactif limitant</span>
        <span class="kw">return</span> xmax, <span class="str">'totale'</span>          <span class="cmt"># disparaît (rupture)</span>
    <span class="kw">if</span> f(a) &gt;= 0:
        <span class="kw">return</span> xmin, <span class="str">'totale, sens indirect'</span>
    <span class="kw">return</span> zero_dicho(f, a, b, eps), <span class="str">'équilibre'</span>

<span class="cmt"># CaCO3(s) = CaO(s) + CO2(g), 10,0 L vides, 1 073 K, K° = 0,20</span>
R, T, V, P0 = 8.314, 1073, 10.0e-3, 1e5
<span class="kw">def</span> act(n):                <span class="cmt"># solides : 1 ; gaz : P(CO2) / P°</span>
    <span class="kw">return</span> [1, 1, n[2] * R * T / (V * P0)]

<span class="kw">for</span> n_caco3 <span class="kw">in</span> (0.0100, 0.0500):
    print(etat_final([n_caco3, 0, 0], [-1, 1, 1], act, 0.20))
<span class="cmt"># (0.01, 'totale')          tout se décompose</span>
<span class="cmt"># (0.02241..., 'équilibre') il reste 27,6 mmol de CaCO3</span>

<span class="cmt"># N2O4(g) = 2 NO2(g), 298 K, K° = 0,15 : rôle de la pression</span>
<span class="kw">for</span> P <span class="kw">in</span> (0.1, 1.0, 10.0):
    <span class="kw">def</span> act_gaz(n):        <span class="cmt"># a_i = (n_i / n_gaz) * P / P°</span>
        ng = n[0] + n[1]
        <span class="kw">return</span> [n[0] / ng * P, n[1] / ng * P]
    xi, nature = etat_final([1.0, 0], [-1, 2], act_gaz, 0.15)
    print(P, round(xi, 3), nature)   <span class="cmt"># 0.522 ; 0.19 ; 0.061</span></pre>
  <div class="method-box"><strong>Exemple — interpréter les sorties</strong>
    <ol>
      <li>Premier programme : \(\xi = 0{,}190\ \text{mol}\), le résultat du calcul à la main du §8 (\(\alpha = 0{,}190\)).</li>
      <li>Calcaire : avec 10,0 mmol, la fonction répond « totale » (rupture d'équilibre) ; avec 50,0 mmol, « équilibre » pour \(\xi = 22{,}4\ \text{mmol}\), comme au §10.</li>
      <li>N₂O₄ : le taux de dissociation vaut 0,522 sous 0,1 bar, 0,190 sous 1 bar et 0,061 sous 10 bar. La constante est la même ; c'est la pression qui change l'état final (figure).</li>
    </ol>
  </div>

  <div class="notice"><strong>Pièges numériques</strong> : (1) borner l'intervalle par l'épuisement des espèces, sinon le logarithme reçoit une quantité négative ; (2) ne pas mettre un solide ni le solvant dans \(Q_r\) (leur activité vaut 1) ; (3) préférer \(\ln Q_r - \ln K^\circ\) à \(Q_r - K^\circ\), dont les valeurs s'étalent sur des dizaines d'ordres de grandeur ; (4) vérifier le résultat en recalculant \(Q_r\) à la main.</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · TEMPÉRATURE, PRESSION ET ANCIENNES NOTATIONS</div>
  <h2>Hors programme en PTSI : ce que la 2ᵉ année ajoutera</h2>
  <div class="intro">Hors programme en PTSI (vu en 2ᵉ année) : la constante d'équilibre se calcule à partir de données thermodynamiques et l'on étudie comment l'améliorer. Ces notions sont traitées dans <a href="#thermochimie/cours">« Thermodynamique de la transformation chimique »</a> ; on en donne ici l'essentiel pour lire d'anciens ouvrages.</div>
  <h3>Influence de la température : relation de Van 't Hoff</h3>
  <p>L'enthalpie libre standard de réaction \(\Delta_r G^\circ\) est reliée à la constante par \(\Delta_r G^\circ = -RT\ln K^\circ\), et \(K^\circ\) varie avec la température selon la relation de Van 't Hoff, où \(\Delta_r H^\circ\) est l'enthalpie standard de réaction :</p>
  <div class="formula">$$\frac{\mathrm{d}\ln K^\circ}{\mathrm{d}T} = \frac{\Delta_r H^\circ}{RT^2} \qquad\Longrightarrow\qquad \ln\frac{K^\circ(T_2)}{K^\circ(T_1)} = -\frac{\Delta_r H^\circ}{R}\left(\frac{1}{T_2}-\frac{1}{T_1}\right)$$</div>
  <p>La seconde forme suppose \(\Delta_r H^\circ\) indépendante de \(T\). Une réaction endothermique (\(\Delta_r H^\circ \gt 0\)) voit sa constante augmenter avec la température ; une réaction exothermique, diminuer. Exemple : pour \(K^\circ(298\ \text{K}) = 1{,}0\times10^{-4}\) et \(\Delta_r H^\circ = 80\ \text{kJ·mol}^{-1}\), on trouve \(K^\circ(500\ \text{K}) = 46\), et \(K^\circ = 1\) vers 417 K.</p>
  <h3>Influence de la pression et « principe de Le Chatelier »</h3>
  <p>Le « principe de modération » de Le Chatelier (« un système à l'équilibre réagit à une perturbation en s'y opposant ») n'est au programme d'aucune des deux années, et pour cause : il n'est pas toujours vrai. La démarche sûre est celle de ce chapitre : après une perturbation, calculer le nouveau \(Q_r\) et le comparer à \(K^\circ\). Exemple : pour N₂ + 3 H₂ = 2 NH₃ à l'équilibre sous pression totale fixée, \(Q_r = \dfrac{n_{\mathrm{NH_3}}^2\,n_{\text{gaz}}^2}{n_{\mathrm{N_2}}\,n_{\mathrm{H_2}}^3}\left(\dfrac{P^\circ}{P}\right)^2\). Ajouter un peu de N₂ fait varier \(\ln Q_r\) de \(\mathrm{d}n\,(2/n_{\text{gaz}} - 1/n_{\mathrm{N_2}})\) : si la fraction molaire de N₂ dépasse 1/2, cette variation est positive, \(Q_r\) dépasse \(K^\circ\) et l'ajout de réactif provoque… la décomposition d'ammoniac. Le « principe » prévoyait le contraire.</p>
  <h3>Constantes \(K_c\) et \(K_p\)</h3>
  <p>D'anciens ouvrages écrivent des constantes avec les concentrations ou les pressions elles-mêmes, sans \(c^\circ\) ni \(P^\circ\) : \(K_c\) et \(K_p\) ont alors une dimension. Pour une réaction en phase gazeuse dont le nombre de molécules de gaz varie de \(\Delta\nu_g\), \(K_p = K^\circ\,(P^\circ)^{\Delta\nu_g}\) et, pour des gaz parfaits (\(P_i = c_iRT\)), \(K_p = K_c\,(RT)^{\Delta\nu_g}\). Le programme n'emploie que \(K^\circ\), sans dimension.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="eq-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉQUILIBRES CHIMIQUES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur la description d'un système et son évolution vers un état final : décrire la composition, écrire l'équation, suivre l'avancement, exprimer activités et quotient de réaction, déterminer une constante, prévoir le sens d'évolution, calculer l'état final (équilibre ou transformation totale), y compris par un programme. Elles servent telles quelles dans tous les chapitres de chimie des solutions.</div>

  <div class="method-box"><strong>Méthode 1 — Décrire la composition d'un système</strong>
    <ol>
      <li><span class="step">Recenser.</span> Lister chaque espèce avec son état physique (g, ℓ, s, aq) ; repérer les phases. Un sel dissous se recense sous forme d'ions.</li>
      <li><span class="step">Choisir la grandeur.</span> Quantité de matière \(n_i\) pour tout le système ; concentration \(c_i = n_i/V\) pour un soluté ; fraction molaire \(x_i = n_i/n_{\text{tot}}\) dans une phase ; pression partielle \(P_i = x_iP\) pour un gaz.</li>
      <li><span class="step">Contrôler.</span> \(\sum x_i = 1\) et \(\sum P_i = P\) dans la phase gazeuse ; un solide ou un liquide n'entre pas dans \(n_{\text{tot}}\) des gaz.</li>
    </ol>
    <p><em>Exemple éclair :</em> 2,0 mol de N₂ et 0,50 mol de H₂ sous 5,0 bar : \(x_{\mathrm{H_2}} = 0{,}50/2{,}5 = 0{,}20\), \(P_{\mathrm{H_2}} = 1{,}0\ \text{bar}\) et \(P_{\mathrm{N_2}} = 4{,}0\ \text{bar}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Écrire et ajuster une équation de réaction</strong>
    <ol>
      <li><span class="step">Espèces.</span> Placer à gauche les espèces consommées, à droite les espèces formées, d'après l'énoncé ou les observations (dégagement gazeux, dépôt, précipité, décoloration).</li>
      <li><span class="step">Éléments.</span> Équilibrer d'abord les éléments présents dans une seule espèce de chaque côté, puis O et H en dernier.</li>
      <li><span class="step">Charge.</span> Vérifier la conservation de la charge électrique ; en solution acide, compléter avec H⁺ et H₂O.</li>
      <li><span class="step">Coefficients algébriques.</span> Noter \(\nu_i \lt 0\) pour les réactifs, \(\nu_i \gt 0\) pour les produits.</li>
    </ol>
    <p><em>Exemple éclair :</em> MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ = Mn²⁺ + 5 Fe³⁺ + 4 H₂O. Charge à gauche : \(-1 + 10 + 8 = 17\) ; à droite : \(2 + 15 = 17\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Dresser un tableau d'avancement et trouver le réactif limitant</strong>
    <ol>
      <li><span class="step">Ligne initiale.</span> Les quantités \(n_{i,0}\) en mol (convertir masses, volumes et concentrations).</li>
      <li><span class="step">Ligne courante.</span> \(n_i = n_{i,0} + \nu_i\,\xi\) pour chaque espèce.</li>
      <li><span class="step">Bornes.</span> \(\xi_{\max} = \min\big(n_{i,0}/|\nu_i|\big)\) sur les réactifs ; s'il y a des produits au départ, \(\xi_{\min} = -\min\big(n_{i,0}/\nu_i\big)\) sur les produits.</li>
      <li><span class="step">Bilan.</span> Pour une transformation totale, \(\xi_f = \xi_{\max}\) ; sinon, \(\xi_f\) se calcule par la méthode 7.</li>
    </ol>
    <p><em>Exemple éclair :</em> N₂ + 3 H₂ = 2 NH₃ avec 2,0 mol de N₂ et 3,0 mol de H₂ : \(2{,}0/1 = 2{,}0\) et \(3{,}0/3 = 1{,}0\), donc H₂ est limitant et \(\xi_{\max} = 1{,}0\ \text{mol}\) ; si la réaction était totale, il resterait 1,0 mol de N₂ et l'on aurait 2,0 mol de NH₃.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : comparer les \(n_{i,0}\) au lieu des rapports \(n_{i,0}/|\nu_i|\). Ici H₂ est limitant alors qu'il est introduit en plus grande quantité que N₂.</div>

  <div class="method-box"><strong>Méthode 4 — Exprimer les activités et le quotient de réaction</strong>
    <ol>
      <li><span class="step">Activités.</span> Gaz : \(P_i/P^\circ\) ; soluté : \(c_i/c^\circ\) ; solvant, solide pur, liquide pur : 1.</li>
      <li><span class="step">Quotient.</span> \(Q_r = \prod_i a_i^{\,\nu_i}\) : produits au numérateur, réactifs au dénominateur, exposants égaux aux coefficients.</li>
      <li><span class="step">Simplifier.</span> Les espèces d'activité 1 disparaissent ; si le nombre de molécules de gaz est le même des deux côtés, \(P^\circ\) et \(n_{\text{gaz}}\) se simplifient.</li>
    </ol>
    <p><em>Exemple éclair :</em> Fe₂O₃(s) + 3 CO(g) = 2 Fe(s) + 3 CO₂(g) : \(Q_r = \dfrac{(P_{\mathrm{CO_2}}/P^\circ)^3}{(P_{\mathrm{CO}}/P^\circ)^3} = \left(\dfrac{P_{\mathrm{CO_2}}}{P_{\mathrm{CO}}}\right)^3\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Déterminer une constante d'équilibre</strong>
    <ol>
      <li><span class="step">Par une mesure.</span> Mesurer une grandeur dans un état d'équilibre (pression, pH, absorbance, concentration) ; en déduire l'avancement à l'équilibre par le tableau ; calculer \(Q_{r,\text{éq}} = K^\circ\).</li>
      <li><span class="step">Par combinaison.</span> Écrire l'équation cherchée comme combinaison \(\sum_k \lambda_k (\mathrm R_k)\) d'équations de constantes connues : \(K^\circ = \prod_k (K^\circ_k)^{\lambda_k}\).</li>
      <li><span class="step">Contrôler.</span> \(K^\circ\) est sans unité, et se rapporte à une équation et une température précisées.</li>
    </ol>
    <p><em>Exemple éclair :</em> au-dessus d'une eau gazeuse, \(P_{\mathrm{CO_2}} = 2{,}5\ \text{bar}\) pour \([\mathrm{CO_2(aq)}] = 0{,}098\ \text{mol·L}^{-1}\) à l'équilibre : pour CO₂(g) = CO₂(aq), \(K^\circ = 0{,}098/2{,}5 = 0{,}039\) à 20 °C. Et si H₂(g) + I₂(g) = 2 HI(g) a pour constante 50, alors HI(g) = ½ H₂(g) + ½ I₂(g) a pour constante \(50^{-1/2} = 0{,}14\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Prévoir le sens d'évolution spontanée</strong>
    <ol>
      <li><span class="step">État initial.</span> Calculer \(Q_{r,i}\) avec les activités initiales (attention : \(Q_{r,i} = 0\) si un produit manque, \(+\infty\) si un réactif manque).</li>
      <li><span class="step">Comparer.</span> \(Q_{r,i} \lt K^\circ\) : sens direct ; \(Q_{r,i} \gt K^\circ\) : sens indirect ; égalité : équilibre.</li>
      <li><span class="step">Possible ?</span> Vérifier que le sens prévu peut démarrer : il faut que ses réactifs soient présents (un solide absent ne peut pas se dissoudre).</li>
    </ol>
    <p><em>Exemple éclair :</em> N₂O₄(g) = 2 NO₂(g), \(K^\circ = 0{,}15\) à 298 K, avec \(P_{\mathrm{N_2O_4}} = 0{,}50\ \text{bar}\) et \(P_{\mathrm{NO_2}} = 0{,}20\ \text{bar}\) : \(Q_{r,i} = 0{,}20^2/0{,}50 = 0{,}080 \lt 0{,}15\), il se forme du NO₂.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le critère donne le sens, pas l'ampleur ni la vitesse. \(Q_{r,i} \lt K^\circ\) ne signifie pas « réaction totale », et un système peut rester bloqué longtemps hors d'équilibre si la réaction est lente.</div>

  <div class="method-box"><strong>Méthode 7 — Calculer un état final d'équilibre</strong>
    <ol>
      <li><span class="step">Tableau.</span> Quantités en fonction de \(\xi\), intervalle \(]\xi_{\min}, \xi_{\max}[\).</li>
      <li><span class="step">Activités.</span> En solution, \(c_i/c^\circ\) ; pour des gaz sous pression totale \(P\) fixée, \(\dfrac{n_i}{n_{\text{gaz}}}\dfrac{P}{P^\circ}\), avec \(n_{\text{gaz}}\) fonction de \(\xi\) ; à volume fixé, \(\dfrac{n_iRT}{VP^\circ}\).</li>
      <li><span class="step">Résoudre</span> \(Q_r(\xi) = K^\circ\) : prendre la racine carrée quand les deux membres sont des carrés, sinon résoudre l'équation du second degré, ou programmer (méthode 10). Garder la seule solution de l'intervalle.</li>
      <li><span class="step">Vérifier</span> en recalculant \(Q_r\) avec la composition trouvée.</li>
    </ol>
    <p><em>Exemple éclair :</em> H₂(g) + I₂(g) = 2 HI(g), \(K^\circ = 50\), 1,0 mol de H₂ et de I₂ : \(\dfrac{(2\xi)^2}{(1{,}0 - \xi)^2} = 50\), donc \(\dfrac{2\xi}{1{,}0 - \xi} = 7{,}07\) et \(\xi = 0{,}78\ \text{mol}\) (\(\tau = 78\ \%\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Traiter une réaction quasi totale ou très peu avancée</strong>
    <ol>
      <li><span class="step">Ordre de grandeur.</span> Comparer \(K^\circ\) à 1, en tenant compte des quantités en jeu (figure du §9 du cours).</li>
      <li><span class="step">Hypothèse.</span> \(K^\circ\) très grande : \(\xi_f \approx \xi_{\max}\), puis calculer la trace du réactif limitant par \(Q_r = K^\circ\). \(K^\circ\) très petite : \(\xi_f\) négligeable devant les quantités des réactifs, puis résoudre l'équation simplifiée.</li>
      <li><span class="step">Vérifier</span> l'hypothèse (trace négligeable, ou \(\xi_f\) inférieur à quelques % des quantités) ; sinon, résoudre exactement.</li>
    </ol>
    <p><em>Exemple éclair :</em> on mélange 10 mL de Ag⁺ à 0,10 mol·L⁻¹ et 10 mL de Cl⁻ à 0,20 mol·L⁻¹ ; Ag⁺ + Cl⁻ = AgCl(s) a pour constante \(1/K_s = 5{,}6\times10^9\). Quasi totale : \([\mathrm{Cl^-}]_f = 0{,}050\ \text{mol·L}^{-1}\), puis \([\mathrm{Ag^+}]_f = K_s c^{\circ 2}/[\mathrm{Cl^-}]_f = 3{,}6\times10^{-9}\ \text{mol·L}^{-1}\), bien négligeable devant 0,050.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Trancher entre équilibre et rupture d'équilibre</strong>
    <ol>
      <li><span class="step">Supposer l'équilibre</span> et calculer \(\xi_{\text{éq}}\) par \(Q_r = K^\circ\), le solide n'apparaissant pas dans \(Q_r\).</li>
      <li><span class="step">Comparer</span> à \(\xi_{\max}\) fixé par la quantité de solide.</li>
      <li><span class="step">Conclure.</span> \(\xi_{\text{éq}} \lt \xi_{\max}\) : équilibre, il reste du solide. Sinon : transformation totale, \(\xi_f = \xi_{\max}\), et \(Q_{r,f} \ne K^\circ\).</li>
    </ol>
    <p><em>Exemple éclair :</em> I₂(s) = I₂(g), \(K^\circ = 4{,}1\times10^{-4}\) à 298 K, dans un flacon fermé de 10,0 L : il faudrait \(n = K^\circ P^\circ V/(RT) = 1{,}65\times10^{-4}\ \text{mol}\) (42 mg) de vapeur. Avec 100 mg de diiode, il en reste 58 mg solides : équilibre. Avec 20 mg, tout se sublime : \(P_{\mathrm{I_2}} = 2{,}0\times10^{-4}\ \text{bar} \lt K^\circ P^\circ\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(Q_r = K^\circ\) dans un état final où un solide de la réaction a disparu. Toujours vérifier que l'avancement trouvé ne consomme pas plus de solide qu'il n'y en avait.</div>

  <div class="method-box"><strong>Méthode 10 — Programmer la recherche de l'état final</strong>
    <ol>
      <li><span class="step">Bornes.</span> Calculer \(\xi_{\min}\) et \(\xi_{\max}\) à partir des quantités initiales et des coefficients algébriques.</li>
      <li><span class="step">Fonction.</span> Écrire \(f(\xi) = \ln Q_r(\xi) - \ln K^\circ\) (croissante), ou la condition d'équilibre sans quotient ; vérifier le changement de signe sur l'intervalle (resserré pour éviter \(\ln 0\)).</li>
      <li><span class="step">Résoudre.</span> Appliquer la dichotomie (<code>zero_dicho</code> du chapitre « Méthodes numériques », ou <code>scipy.optimize.bisect</code>) ; si \(f\) reste négative jusqu'à la borne fixée par un solide, conclure à une transformation totale.</li>
      <li><span class="step">Valider</span> sur un cas calculable à la main, puis exploiter (boucle sur les conditions initiales, tracé).</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \([0 ; 1]\) avec une précision de \(10^{-9}\ \text{mol}\), la dichotomie fait \(\lceil\log_2 10^9\rceil = 30\) itérations ; le programme du §11 retrouve \(\xi = 0{,}190\ \text{mol}\) pour N₂O₄ sous 1 bar, la valeur calculée à la main.</p>
  </div>
  <div class="notice"><strong>Pièges</strong> : (1) unités : pressions en bar avec \(P^\circ = 1\ \text{bar}\), concentrations en mol·L⁻¹ ; (2) ne jamais mettre un solide ni le solvant dans \(Q_r\) ; (3) une constante n'a de sens qu'avec son équation et sa température ; (4) la constante ne dépend pas des quantités initiales : si deux expériences à la même température donnent deux « constantes » différentes, l'une des compositions n'était pas à l'équilibre.</div>

  <div class="method-box"><strong>Méthode 11 — Calculer une constante à une autre température (hors programme en PTSI, vu en 2ᵉ année)</strong>
    <ol>
      <li><span class="step">Données.</span> \(K^\circ(T_1)\) et l'enthalpie standard de réaction \(\Delta_r H^\circ\), supposée indépendante de \(T\) ; températures en kelvins.</li>
      <li><span class="step">Relation de Van 't Hoff intégrée.</span> \(\ln K^\circ(T_2) = \ln K^\circ(T_1) - \dfrac{\Delta_r H^\circ}{R}\left(\dfrac{1}{T_2} - \dfrac{1}{T_1}\right)\).</li>
      <li><span class="step">Contrôle.</span> Réaction endothermique : \(K^\circ\) augmente avec \(T\) ; exothermique : elle diminue. Le sens d'évolution se prévoit ensuite, comme en PTSI, en comparant \(Q_r\) à la nouvelle constante (le « principe de Le Chatelier » n'est au programme d'aucune des deux années).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K^\circ(298\ \text{K}) = 1{,}0\times10^{-4}\), \(\Delta_r H^\circ = 80\ \text{kJ·mol}^{-1}\) : \(K^\circ(500\ \text{K}) = 46\) (EXO 13 et chapitre « Thermodynamique de la transformation chimique »).</p>
  </div>
</div>
</template>

  <h3>Décrire un système : un ballon d'air humide</h3>
  <div class="statement">Un ballon rigide de 2,00 L contient à 25 °C 0,0500 mol de diazote, 0,0200 mol de dioxygène et 1,0 mL d'eau liquide, en équilibre avec sa vapeur. À 25 °C, la pression de vapeur saturante de l'eau vaut 3,17 kPa. Les gaz sont parfaits ; on néglige le volume du liquide devant celui du ballon. \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Recenser les espèces physico-chimiques et les phases du système.</div>
  <div class="q"><strong>Q2.</strong> Calculer les pressions partielles des trois gaz, la pression totale et la quantité d'eau à l'état de vapeur.</div>
  <div class="q"><strong>Q3.</strong> En déduire les fractions molaires dans la phase gazeuse.</div>
  <div class="q"><strong>Q4.</strong> Parmi les grandeurs suivantes, lesquelles sont intensives ? \(P\), \(n(\mathrm{O_2})\), \(x(\mathrm{O_2})\), \(P(\mathrm{O_2})\), \(V\), \(T\), la masse d'eau liquide.</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> N₂(g), O₂(g), H₂O(g) dans une phase gazeuse ; H₂O(ℓ) dans une phase liquide (l'eau liquide contient aussi un peu de gaz dissous, en quantité négligeable). Deux phases : le système est hétérogène.</p>
    <p><strong>Q2.</strong> Chaque gaz occupe tout le volume : \(P_i = n_iRT/V\). \( P(\mathrm{N_2}) \) \( = 0{,}0500\times8{,}314\times298{,}15/(2{,}00\times10^{-3}) \) \( = 6{,}20\times10^4\ \text{Pa} \) \( = 0{,}620\ \text{bar} \) ; \(P(\mathrm{O_2}) = 0{,}248\ \text{bar}\) ; \(P(\mathrm{H_2O}) = 0{,}0317\ \text{bar}\) (vapeur saturante, puisque le liquide est présent). Pression totale : \(P = 0{,}620 + 0{,}248 + 0{,}032 = 0{,}899\ \text{bar}\). Quantité de vapeur : \( n = P(\mathrm{H_2O})V/(RT) \) \( = 2{,}56\times10^{-3}\ \text{mol} \), soit 46 mg, très peu devant le gramme d'eau liquide.</p>
    <p><strong>Q3.</strong> \(x_i = P_i/P\) : \(x(\mathrm{N_2}) = 0{,}689\), \(x(\mathrm{O_2}) = 0{,}276\), \(x(\mathrm{H_2O}) = 0{,}035\) (somme 1,000). L'eau liquide n'entre pas dans le calcul : la fraction molaire se rapporte à une phase.</p>
    <p><strong>Q4.</strong> Intensives : \(P\), \(x(\mathrm{O_2})\), \(P(\mathrm{O_2})\), \(T\). Extensives : \(n(\mathrm{O_2})\), \(V\), la masse d'eau liquide. Doubler le système (deux ballons identiques réunis) double les secondes et laisse les premières inchangées.</p>

  <h3>Équations et tableau d'avancement : la réaction aluminothermique</h3>
  <div class="statement">La soudure des rails par aluminothermie utilise la réaction totale de l'aluminium sur l'oxyde de fer(III) : Al(s) + Fe₂O₃(s) → Al₂O₃(s) + Fe(ℓ). On mélange 5,40 g d'aluminium et 8,00 g d'oxyde de fer(III). Masses molaires (g·mol⁻¹) : Al 26,98 ; Fe 55,85 ; O 16,00.</div>
  <div class="q"><strong>Q1.</strong> Ajuster l'équation et donner les coefficients stœchiométriques algébriques.</div>
  <div class="q"><strong>Q2.</strong> Dresser le tableau d'avancement, identifier le réactif limitant et donner la composition finale (en mol et en g). Vérifier la conservation de la masse.</div>
  <div class="q"><strong>Q3.</strong> Ajuster l'équation de la combustion complète de l'éthanol C₂H₆O(ℓ) dans le dioxygène. Pourquoi faut-il une seconde équation pour décrire la combustion dans une flamme pauvre en dioxygène ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Fer : 2 Fe ; aluminium : 2 Al ; oxygène : 3 de chaque côté. 2 Al + Fe₂O₃ = Al₂O₃ + 2 Fe, avec \(\nu = (-2, -1, +1, +2)\).</p>
    <p><strong>Q2.</strong> \(n(\mathrm{Al})_0 = 5{,}40/26{,}98 = 0{,}200\ \text{mol}\) ; \(M(\mathrm{Fe_2O_3}) = 159{,}7\ \text{g·mol}^{-1}\), \(n(\mathrm{Fe_2O_3})_0 = 0{,}0501\ \text{mol}\). Tableau : Al \(0{,}200 - 2\xi\), Fe₂O₃ \(0{,}0501 - \xi\), Al₂O₃ \(\xi\), Fe \(2\xi\). Bornes : \(0{,}200/2 = 0{,}100\) et \(0{,}0501/1 = 0{,}0501\) : Fe₂O₃ est limitant, \(\xi_{\max} = 0{,}0501\ \text{mol}\). État final : Al 0,0999 mol (2,70 g), Al₂O₃ 0,0501 mol (5,11 g), Fe 0,100 mol (5,60 g). Masse : \(2{,}70 + 5{,}11 + 5{,}60 = 13{,}41\ \text{g}\), égale aux 13,40 g introduits aux arrondis près.</p>
    <p><strong>Q3.</strong> C₂H₆O + 3 O₂ = 2 CO₂ + 3 H₂O (carbone : 2 ; hydrogène : 6, donc 3 H₂O ; oxygène : 1 + 6 = 4 + 3). Si le dioxygène manque, il se forme aussi du monoxyde de carbone : C₂H₆O + 2 O₂ = 2 CO + 3 H₂O. Les proportions de CO₂ et de CO dépendent des conditions : la transformation se modélise par deux réactions, chacune avec son avancement.</p>

</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Activités et quotients de réaction</h3>
  <div class="statement">On considère les réactions suivantes : (a) 2 SO₂(g) + O₂(g) = 2 SO₃(g) ; (b) C(s) + H₂O(g) = CO(g) + H₂(g) ; (c) Cu(s) + 2 Ag⁺(aq) = Cu²⁺(aq) + 2 Ag(s) ; (d) NH₃(aq) + H₂O(ℓ) = NH₄⁺(aq) + HO⁻(aq) ; (e) PbI₂(s) = Pb²⁺(aq) + 2 I⁻(aq).</div>
  <div class="q"><strong>Q1.</strong> Écrire le quotient de réaction de chacune avec les pressions partielles ou les concentrations.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(Q_r\) pour (c) lorsque \([\mathrm{Ag^+}] = 0{,}010\ \text{mol·L}^{-1}\) et \([\mathrm{Cu^{2+}}] = 0{,}10\ \text{mol·L}^{-1}\), et pour (b) lorsque \(P(\mathrm{H_2O}) = 0{,}50\ \text{bar}\) et \(P(\mathrm{CO}) = P(\mathrm{H_2}) = 0{,}20\ \text{bar}\).</div>
  <div class="q"><strong>Q3.</strong> Le quotient de (b) dépend-il de la masse de carbone présente ? Celui de (e) de la masse de PbI₂ ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) \( Q_r \) \( = \dfrac{P_{\mathrm{SO_3}}^2\,P^\circ}{P_{\mathrm{SO_2}}^2\,P_{\mathrm{O_2}}} \) ; (b) \( Q_r \) \( = \dfrac{P_{\mathrm{CO}}\,P_{\mathrm{H_2}}}{P_{\mathrm{H_2O}}\,P^\circ} \) (le carbone solide a une activité 1) ; (c) \( Q_r \) \( = \dfrac{[\mathrm{Cu^{2+}}]\,c^\circ}{[\mathrm{Ag^+}]^2} \) (les deux métaux sont des solides) ; (d) \( Q_r \) \( = \dfrac{[\mathrm{NH_4^+}][\mathrm{HO^-}]}{[\mathrm{NH_3}]\,c^\circ} \) (l'eau est le solvant) ; (e) \( Q_r \) \( = \dfrac{[\mathrm{Pb^{2+}}][\mathrm{I^-}]^2}{c^{\circ 3}} \).</p>
    <p><strong>Q2.</strong> (c) \(Q_r = 0{,}10/0{,}010^2 = 1{,}0\times10^3\). (b) \(Q_r = 0{,}20\times0{,}20/0{,}50 = 0{,}080\). Les deux sont sans unité.</p>
    <p><strong>Q3.</strong> Non dans les deux cas : un solide pur a une activité égale à 1 quelle que soit sa quantité, pourvu qu'il soit présent. Sa quantité n'intervient que pour savoir s'il en reste à la fin (rupture d'équilibre, §10 du cours).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Synthèse de l'iodure d'hydrogène : état final d'équilibre</h3>
  <div class="statement">À 450 °C, la réaction H₂(g) + I₂(g) = 2 HI(g) a pour constante \(K^\circ = 50\). On introduit dans un récipient fermé de volume constant du dihydrogène et du diiode gazeux, chacun à la concentration \(0{,}100\ \text{mol·L}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(Q_r = \dfrac{[\mathrm{HI}]^2}{[\mathrm{H_2}][\mathrm{I_2}]}\). Dresser le tableau d'avancement en concentrations (avancement volumique \(x\)).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(x\) et les concentrations à l'équilibre.</div>
  <div class="q"><strong>Q3.</strong> Calculer le taux d'avancement final.</div>
  <div class="q"><strong>Q4.</strong> On part cette fois de HI seul, à \(0{,}200\ \text{mol·L}^{-1}\). Dans quel sens le système évolue-t-il ? Prévoir sans calcul l'état final.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour un gaz parfait, \(P_i = c_iRT\) et \(a_i = c_iRT/P^\circ\). Il y a deux molécules de gaz de chaque côté : le facteur \((RT/P^\circ)^2\) se simplifie et il reste le quotient annoncé. Tableau : \([\mathrm{H_2}] = [\mathrm{I_2}] = 0{,}100 - x\), \([\mathrm{HI}] = 2x\), avec \(0 \le x \lt 0{,}100\).</p>
    <p><strong>Q2.</strong> \(\dfrac{(2x)^2}{(0{,}100 - x)^2} = 50\). Les deux membres sont positifs : \(\dfrac{2x}{0{,}100 - x} = \sqrt{50} = 7{,}07\), d'où \(x = \dfrac{0{,}707}{9{,}07} = 0{,}0780\ \text{mol·L}^{-1}\). \( [\mathrm{H_2}] = [\mathrm{I_2}] \) \( = 0{,}0220\ \text{mol·L}^{-1} \), \([\mathrm{HI}] = 0{,}156\ \text{mol·L}^{-1}\). Contrôle : \(0{,}156^2/0{,}0220^2 = 50\).</p>
    <p><strong>Q3.</strong> \(\tau = x/x_{\max} = 0{,}0780/0{,}100 = 78\ \%\).</p>
    <p><strong>Q4.</strong> Sans H₂ ni I₂, \(Q_{r,i} = +\infty \gt K^\circ\) : évolution dans le sens indirect, HI se décompose. Les quantités d'éléments (H et I) sont les mêmes qu'à la question 1 : par le tableau, les deux systèmes sont deux états d'une même réaction, et l'équation \(Q_r = K^\circ\) n'a qu'une solution. L'état final est donc le même : \([\mathrm{HI}] = 0{,}156\ \text{mol·L}^{-1}\), \( [\mathrm{H_2}] = [\mathrm{I_2}] \) \( = 0{,}0220\ \text{mol·L}^{-1} \).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Déterminer une constante par une mesure de pression</h3>
  <div class="statement">Dans un récipient rigide de 1,00 L, vide, on introduit 0,0100 mol de pentachlorure de phosphore, puis on le porte à 250 °C. La réaction PCl₅(g) = PCl₃(g) + Cl₂(g) se produit ; à l'équilibre, la pression totale vaut 0,797 bar. \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Quelle serait la pression \(P_0\) sans réaction ? Exprimer la pression d'équilibre en fonction de \(P_0\) et du taux de dissociation \(\alpha = \xi/n_0\).</div>
  <div class="q"><strong>Q2.</strong> En déduire \(\alpha\), les pressions partielles et la constante \(K^\circ\) à 250 °C.</div>
  <div class="q"><strong>Q3.</strong> On recommence avec 0,0500 mol de PCl₅. Calculer le nouveau taux de dissociation et la pression d'équilibre. Qu'est-ce qui a changé, et qu'est-ce qui n'a pas changé ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( P_0 = n_0RT/V \) \( = 0{,}0100\times8{,}314\times523{,}15/(1{,}00\times10^{-3}) \) \( = 4{,}35\times10^4\ \text{Pa} \) \( = 0{,}435\ \text{bar} \). À l'équilibre : PCl₅ \(n_0(1 - \alpha)\), PCl₃ et Cl₂ \(n_0\alpha\) chacun, soit \(n_{\text{tot}} = n_0(1 + \alpha)\). À \(T\) et \(V\) fixés, \(P = P_0(1 + \alpha)\).</p>
    <p><strong>Q2.</strong> \(\alpha = 0{,}797/0{,}435 - 1 = 0{,}832\). Pressions partielles : \(P(\mathrm{PCl_5}) = P_0(1 - \alpha) = 0{,}0730\ \text{bar}\), \( P(\mathrm{PCl_3}) \) \( = P(\mathrm{Cl_2}) = P_0\alpha \) \( = 0{,}362\ \text{bar} \). \( K^\circ \) \( = \dfrac{(P_{\mathrm{PCl_3}}/P^\circ)(P_{\mathrm{Cl_2}}/P^\circ)}{P_{\mathrm{PCl_5}}/P^\circ} \) \( = \dfrac{\alpha^2P_0}{(1 - \alpha)P^\circ} \) \( = 1{,}80 \).</p>
    <p><strong>Q3.</strong> \(P_0 = 2{,}17\ \text{bar}\) ; \(\dfrac{\alpha^2\times2{,}17}{1 - \alpha} = 1{,}80\), soit \(2{,}17\,\alpha^2 + 1{,}80\,\alpha - 1{,}80 = 0\), dont la racine positive est \(\alpha = 0{,}586\). \(P = 2{,}17\times1{,}586 = 3{,}45\ \text{bar}\). Le taux de dissociation et la composition ont changé ; la constante, qui ne dépend que de la température, est la même.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Prévoir le sens d'évolution</h3>
  <div class="statement">Données : N₂O₄(g) = 2 NO₂(g), \(K^\circ_1 = 0{,}15\) à 298 K ; N₂(g) + 3 H₂(g) = 2 NH₃(g), \(K^\circ_2 = 4{,}6\times10^{-5}\) à 723 K ; 2 H₂(g) + O₂(g) = 2 H₂O(g), \(K^\circ_3 \approx 10^{80}\) à 298 K.</div>

  <div class="q"><strong>Q2.</strong> Dans un réacteur à 723 K, on a (a) \(P(\mathrm{N_2}) = 50\), \(P(\mathrm{H_2}) = 150\), \(P(\mathrm{NH_3}) = 20\) bar ; (b) \(P(\mathrm{N_2}) = 10\), \(P(\mathrm{H_2}) = 30\), \(P(\mathrm{NH_3}) = 20\) bar. Prévoir le sens d'évolution dans chaque cas.</div>
  <div class="q"><strong>Q3.</strong> Un ballon de dihydrogène et de dioxygène reste des années sans réagir à 25 °C. Est-ce en contradiction avec la valeur de \(K^\circ_3\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \( Q_r \) \( = \dfrac{(P_{\mathrm{NO_2}}/P^\circ)^2}{P_{\mathrm{N_2O_4}}/P^\circ} \) \( = \dfrac{0{,}20^2}{0{,}50} \) \( = 0{,}080 \lt K^\circ_1 \) : évolution dans le sens direct, il se forme du NO₂ (le mélange brunit) jusqu'à \(Q_r = 0{,}15\).</p>
    <p><strong>Q2.</strong> \( Q_r \) \( = \dfrac{P_{\mathrm{NH_3}}^2\,P^{\circ 2}}{P_{\mathrm{N_2}}\,P_{\mathrm{H_2}}^3} \), pressions en bar. (a) \( Q_r = \dfrac{400}{50\times150^3} \) \( = 2{,}4\times10^{-6} \lt K^\circ_2 \) : sens direct, de l'ammoniac se forme. (b) \( Q_r = \dfrac{400}{10\times30^3} \) \( = 1{,}5\times10^{-3} \gt K^\circ_2 \) : sens indirect, l'ammoniac se décompose. Avec la même pression d'ammoniac, c'est la baisse des pressions des réactifs (au cube pour H₂) qui fait basculer le sens.</p>
