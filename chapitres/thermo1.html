  <div class="intro">Ce chapitre couvre la partie 3.1 « Descriptions microscopique et macroscopique d'un système à l'équilibre » du programme de PTSI, sauf le corps pur diphasé, traité dans <a href="#changement/cours">« Corps pur diphasé et changements d'état »</a>. Il prépare <a href="#thermo2/cours">« 1er principe »</a> et <a href="#thermo3/cours">« 2e principe »</a>.</div>

<div class="course-section">
  <div class="sec-num">§1 · DESCRIPTION D'UN SYSTÈME THERMODYNAMIQUE</div>
  <h2>De quoi parle la thermodynamique ?</h2>
  <div class="intro">La thermodynamique étudie les systèmes constitués d'un très grand nombre de particules — typiquement de l'ordre du nombre d'Avogadro \(N_A \approx 6{,}02 \times 10^{23}\). Suivre individuellement chaque particule serait impossible et inutile. On va donc décrire ces systèmes par des grandeurs <em>moyennes</em> à notre échelle, comme la pression ou la température.</div>

  <h3>Système thermodynamique</h3>
  <div class="def-box">
    Un <strong>système thermodynamique</strong> est un ensemble constitué d'un grand nombre de particules contenues à l'intérieur d'une surface fermée. Tout ce qui ne fait pas partie du système est appelé <strong>milieu extérieur</strong>.
  </div>
  
  <p>Le choix du système est <em>arbitraire</em> : c'est toi qui décides ce qui fait partie du système (gaz dans un cylindre, eau dans un récipient, atmosphère terrestre…). Ce choix conditionne ensuite tous les bilans qu'on fera dessus.</p>

  <h3>Trois échelles d'étude</h3>
  <p>En thermodynamique, on jongle entre trois niveaux d'observation :</p>
  
  <ul>
    <li><strong>Échelle macroscopique</strong> : la nôtre, celle de l'expérience. Pression, volume, température sont mesurables directement. Ordre de grandeur : 1 m.</li>
    <li><strong>Échelle microscopique</strong> : celle des molécules et atomes. Ordre de grandeur : 0,1 à 1 nm.</li>
    <li><strong>Échelle mésoscopique</strong> : intermédiaire. Un volume assez petit pour être « ponctuel » à l'échelle macroscopique, mais assez grand pour contenir un très grand nombre de molécules. C'est l'échelle où les fluctuations statistiques deviennent négligeables. Ordre de grandeur : 1 μm ; un volume de 1 μm³ contient encore ≈ 2 × 10⁷ molécules d'un gaz dans les conditions usuelles, et ≈ 3 × 10¹⁰ dans l'eau liquide.</li>
  </ul>
  
  <p>L'échelle mésoscopique est essentielle : c'est elle qui justifie que la pression, la température, etc. soient bien définies « en tout point » du système.</p>

  <h3>Trois types de systèmes</h3>
  <div class="def-box">
    <strong>Système isolé</strong> : n'échange ni matière ni énergie avec le milieu extérieur.<br>
    <strong>Système fermé</strong> : pas d'échange de matière, mais échange d'énergie possible.<br>
    <strong>Système ouvert</strong> : échange matière et énergie avec l'extérieur.
  </div>
  
  <p>Exemple concret : une bouteille thermos parfaite (système isolé). Une casserole couverte sur le feu (système fermé, échange de chaleur). Une casserole ouverte qui bout (système ouvert, l'eau s'évapore).</p>

  <h3>Nature des parois</h3>
  <p>La nature des parois entre système et extérieur conditionne le type d'échange possible :</p>
  
  <ul>
    <li><strong>Paroi calorifugée</strong> (adiabatique) : <em>empêche</em> les échanges d'énergie thermique. Exemple : double paroi sous vide d'une thermos.</li>
    <li><strong>Paroi diathermane</strong> : <em>permet</em> les échanges d'énergie thermique. Exemple : une simple plaque de métal entre deux compartiments.</li>
    <li><strong>Paroi indéformable</strong> : maintient le volume du système constant.</li>
    <li><strong>Paroi mobile</strong> (un piston par exemple) : permet la variation du volume, donc des échanges d'énergie sous forme de travail mécanique.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§2 · VARIABLES D'ÉTAT ET ÉQUILIBRE</div>
  <h2>Comment décrit-on l'état d'un système ?</h2>
  <div class="intro">Pour décrire un système thermodynamique, on utilise des <em>grandeurs macroscopiques</em> mesurables : la pression, le volume, la température, la quantité de matière… Ces grandeurs sont appelées <strong>paramètres d'état</strong> ou <strong>variables d'état</strong>.</div>

  <h3>Grandeurs intensives vs extensives</h3>
  <div class="def-box">
    <strong>Variable extensive</strong> : dépend de la <em>taille</em> du système. Si on coupe le système en deux, la grandeur est divisée par deux. Exemples : V (volume), n (quantité de matière), m (masse), U (énergie interne).<br><br>
    <strong>Variable intensive</strong> : ne dépend <em>pas</em> de la taille du système. Si on coupe en deux, la grandeur garde la même valeur. Exemples : P (pression), T (température), ρ (masse volumique).
  </div>
  
  <p>Test rapide : T est-elle extensive ou intensive ? Si tu prends la moitié du gaz dans la pièce, la température reste 20 °C. Donc T est intensive. À l'inverse, le volume occupé par cette moitié est… la moitié. Donc V est extensive.</p>
  
  <p><em>Astuce :</em> le rapport de deux grandeurs extensives donne une grandeur intensive. Exemple : la concentration c = n/V (mol/m³), la masse volumique ρ = m/V (kg/m³).</p>

  <h3>Équilibre thermodynamique</h3>
  <div class="def-box">
    Un système est en <strong>équilibre thermodynamique</strong> macroscopique quand ses paramètres macroscopiques (P, V, T…) sont <em>constants</em> dans le temps ET qu'il n'y a aucun <em>transfert</em> d'énergie ou de matière avec l'extérieur.
  </div>
  
  <p>L'équilibre est en réalité un état où plusieurs équilibres coexistent :</p>
  <ul>
    <li><strong>Équilibre mécanique</strong> : pas de mouvement macroscopique, pression uniforme dans tout le système (ou équilibrée par d'autres forces).</li>
    <li><strong>Équilibre thermique</strong> : température uniforme dans le système et égale à celle de l'extérieur (si paroi diathermane).</li>
    <li><strong>Équilibre chimique</strong> : pas de réaction chimique en cours, ou réactions à l'équilibre.</li>
  </ul>

  <h3>Équation d'état</h3>
  <p>Pour un système donné, les variables d'état ne sont pas indépendantes. Il existe une relation entre elles, appelée <strong>équation d'état</strong>.</p>
  
  <div class="def-box">
    Une <strong>équation d'état</strong> est une relation mathématique entre les variables d'état d'un système à l'équilibre. Elle réduit le nombre de variables indépendantes nécessaires pour décrire l'état du système.
  </div>
  
  <p>L'exemple le plus important, qu'il faut connaître parfaitement, est celui du <strong>gaz parfait</strong> :</p>
  <div class="formula">$$\boxed{P \cdot V = n \cdot R \cdot T}$$</div>
  
  <p>avec :</p>
  <ul>
    <li>P en Pascal (Pa) — \(1\) bar = \(10^5\) Pa</li>
    <li>V en mètres cubes (m³) — \(1\) L = \(10^{-3}\) m³</li>
    <li>n en moles (mol)</li>
    <li>T en Kelvin (K) — \(T(\mathrm{K}) = T(°C) + 273{,}15\)</li>
    <li>R = 8,314 J·K⁻¹·mol⁻¹ (constante des gaz parfaits)</li>
  </ul>

  <div class="notice">
    <strong>Attention aux unités !</strong> Le piège le plus classique en thermo : utiliser T en degrés Celsius, ou V en litres, ou P en bar. L'équation d'état n'est valable qu'en unités SI. Toujours convertir <em>avant</em> de calculer.
  </div>

  <h3>Libre parcours moyen</h3>
  <p>Une grandeur microscopique utile pour qualifier un gaz : la <strong>distance moyenne parcourue par une molécule entre deux chocs</strong>, notée \(\ell\).</p>
  <ul>
    <li>Pour un <strong>liquide</strong> : \(\ell\) de l'ordre de la taille d'une molécule, quelques \(10^{-10}\) m. Les molécules sont quasiment en contact permanent.</li>
    <li>Pour un <strong>gaz</strong> (conditions usuelles) : \(\ell\) de l'ordre de \(10^{-7}\) m. Bien plus grand que la taille d'une molécule, ce qui justifie le modèle du gaz parfait.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LE GAZ PARFAIT MONOATOMIQUE</div>
  <h2>Un modèle microscopique simple</h2>
  <div class="intro">Le gaz parfait est un modèle idéalisé qui rend possible une description microscopique exacte tout en fournissant des résultats macroscopiques utilisables. La plupart des gaz réels à pression modérée se comportent comme un gaz parfait avec une bonne approximation.</div>

  <h3>Définition et hypothèses</h3>
  <div class="def-box">
    Un <strong>gaz parfait monoatomique</strong> (GPM) est un gaz constitué :
    <ul style="margin-top:0.3rem">
      <li>d'atomes <em>identiques</em>,</li>
      <li>assimilables à des particules <em>ponctuelles</em> (volume propre négligeable),</li>
      <li>sans interaction à distance entre elles.</li>
    </ul>
  </div>
  
  <p>Sur ces bases, on pose plusieurs <strong>hypothèses</strong> :</p>
  <ul>
    <li>Les interactions n'ont lieu <em>que</em> pendant les chocs (particule/particule ou particule/paroi).</li>
    <li>Les chocs sont <strong>supposés élastiques</strong> : pas de perte d'énergie cinétique.</li>
    <li>On néglige les forces de pesanteur. Donc <em>aucune force ne s'exerce sur la particule entre les chocs</em> → mouvement <strong>rectiligne uniforme</strong> entre les chocs.</li>
    <li>La répartition des atomes est supposée <strong>uniforme</strong> dans le récipient.</li>
  </ul>
  
  <p>On définit alors la <strong>densité particulaire</strong> :</p>
  <div class="formula">$$n^* = \frac{N}{V} = \text{cste}$$</div>
  <p>où N est le nombre total de particules et V le volume de l'enceinte. Cette densité est uniforme partout grâce à l'hypothèse d'uniformité.</p>
  
  <div class="notice">
    Attention : ne pas confondre <strong>n*</strong> (densité particulaire en particules/m³) avec <strong>n</strong> (quantité de matière en mol). On a la relation \(n^* = n \cdot N_A / V\).<br>
    L'hypothèse du gaz parfait est valide quand le gaz est à <em>faible pression</em> (le libre parcours moyen est grand devant la taille des molécules).
  </div>

  <h3>Distribution des vitesses</h3>
  <p>Toutes les particules du gaz n'ont pas la même vitesse. On fait deux hypothèses supplémentaires sur cette distribution :</p>
  
  <ul>
    <li>La distribution des vitesses est <strong>isotrope</strong> : tous les sens sont équiprobables, aucune direction privilégiée. Conséquence : la vitesse moyenne vectorielle est nulle.
    <div class="formula">$$\langle \vec{v} \rangle = \vec{0}$$</div>
    </li>
    <li>La <em>norme</em> des vitesses obéit à une loi statistique appelée <strong>loi de Maxwell-Boltzmann</strong>. Le profil de cette loi dépend de la température : à plus haute température, la distribution est plus large et son maximum se déplace vers les vitesses plus élevées.</li>
  </ul>

  <h3>Vitesse quadratique moyenne</h3>
  <p>Puisque \(\langle \vec{v} \rangle = \vec{0}\), cette « vitesse moyenne » ne renseigne pas sur l'agitation thermique. On caractérise l'agitation par la <strong>vitesse quadratique moyenne</strong>, notée \(u\) :</p>
  
  <div class="def-box">
    $$\boxed{u = \sqrt{\langle v^2 \rangle} = \sqrt{\frac{\sum_{i=1}^{N} v_i^2}{N}}}$$
    C'est la racine carrée de la moyenne des carrés des vitesses. Elle est toujours positive et caractérise l'amplitude de l'agitation thermique.
  </div>
  
  <p>Pourquoi pas la moyenne des normes \(\langle |\vec{v}| \rangle\) ? La vitesse quadratique présente un avantage : elle apparaît directement dans le calcul de l'énergie cinétique moyenne \(\langle E_c \rangle = \frac{1}{2} m \langle v^2 \rangle\).</p>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PRESSION ET TEMPÉRATURE CINÉTIQUES</div>
  <h2>Pression et température : interprétation microscopique</h2>
  <div class="intro">L'intérêt du modèle du gaz parfait est qu'il permet d'expliquer les grandeurs macroscopiques (pression, température) à partir du mouvement des particules. C'est le pont entre les deux échelles.</div>

  <h3>Pression cinétique</h3>
  <p>Imagine une enceinte de volume V remplie de gaz. Les particules cognent sans cesse contre les parois. À chaque choc, une particule transfère une petite quantité de mouvement à la paroi. La moyenne de tous ces chocs (énormément de chocs par seconde) se manifeste à notre échelle comme une <strong>force exercée par le gaz sur la paroi</strong>, perpendiculaire à celle-ci.</p>
  
  <div class="def-box">
    Sur un élément de surface \(\mathrm{d}S\) de normale sortante \(\vec{n}\), le gaz exerce une force :
    $$\mathrm{d}\vec{F} = P \cdot \mathrm{d}\vec{S} = P \cdot \mathrm{d}S \cdot \vec{n}$$
    où la <strong>pression cinétique</strong> P dépend de l'agitation des particules. Elle est une grandeur <em>intensive</em>.
  </div>
  
  <p>Plus les particules sont nombreuses (densité élevée) ou plus elles vont vite (température élevée), plus la pression est forte. C'est l'origine microscopique de la pression.</p>

  <h3>Température cinétique</h3>
  <div class="def-box">
    La <strong>température cinétique</strong> T est la grandeur macroscopique qui caractérise l'énergie cinétique moyenne d'agitation des particules. Pour un gaz parfait monoatomique, l'énergie cinétique moyenne d'un atome s'écrit :
    $$\boxed{\langle E_c \rangle = \frac{3}{2} k_B T}$$
    avec \(k_B = 1{,}38 \times 10^{-23}\) J·K⁻¹ : la <strong>constante de Boltzmann</strong>.
  </div>
  
  <p>Cette relation est <em>fondamentale</em> : elle dit explicitement que <strong>la température mesure l'agitation</strong>. À T = 0 K, l'agitation s'annule (en physique classique).</p>

  <h3>Lien entre vitesse quadratique et température</h3>
  <p>En combinant la définition de la vitesse quadratique avec l'expression de l'énergie cinétique moyenne :</p>
  <div class="formula">$$\langle E_c \rangle = \left\langle \frac{1}{2} m v_i^2 \right\rangle = \frac{1}{2} m \langle v_i^2 \rangle = \frac{1}{2} m u^2$$</div>
  
  <p>En égalant avec \(\frac{3}{2} k_B T\) :</p>
  <div class="formula">$$\frac{1}{2} m u^2 = \frac{3}{2} k_B T \quad\Longrightarrow\quad \boxed{u = \sqrt{\frac{3 k_B T}{m}} = \sqrt{\frac{3 R T}{M}}}$$</div>
  
  <p>où m est la masse d'un atome et M la masse molaire du gaz (en kg/mol).</p>
  
  <p><em>Ordre de grandeur :</em> pour de l'air (M ≈ 29 g/mol) à T = 300 K, on trouve u ≈ 500 m/s. Comparable à la vitesse du son, ce qui n'est pas un hasard.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pourquoi R = N_A · k_B ?</span>
    <span class="prompt">D'où vient cette relation ?</span>
    <div class="content">
      <p>Si on considère N atomes (N = n·N_A avec n en moles), l'énergie cinétique totale est :</p>
      <p>\(E_c^{\text{tot}} = N \cdot \frac{3}{2} k_B T = n \cdot N_A \cdot \frac{3}{2} k_B T\)</p>
      <p>Or le modèle microscopique du gaz parfait (calcul de la pression cinétique, admis) donne \(PV = \frac{2}{3}E_c^{\text{tot}} = N k_B T\), tandis que l'expérience donne, pour un gaz dilué, \(PV = nRT\). En égalant, \(N k_B = n R\), soit \(n N_A k_B = nR\) : \(\boxed{R = N_A \cdot k_B}\). C'est juste un changement de point de vue : k_B compte « par particule », R compte « par mole ».</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PROPRIÉTÉS MACROSCOPIQUES D'UN GAZ PARFAIT</div>
  <h2>Volume molaire, volume massique, énergie interne</h2>
  <div class="intro">Maintenant qu'on a relié pression, température et agitation microscopique, on peut récolter quelques résultats macroscopiques essentiels sur les gaz parfaits.</div>

  <h3>Équation d'état (rappel)</h3>
  <div class="formula">$$P \cdot V = n \cdot R \cdot T$$</div>
  <p>avec R = 8,31 J·K⁻¹·mol⁻¹. On peut aussi l'écrire : \(P \cdot V = N \cdot k_B \cdot T\) (avec N le nombre de particules).</p>
  
  <div class="notice">
    <strong>En pratique :</strong> les interactions entre atomes ne sont pas totalement négligeables, et les atomes ont un volume propre. Le §8 compare les gaz réels au modèle du gaz parfait sur des isothermes mesurées ; une équation d'état corrigée (Van der Waals) est hors programme en PTSI (« Pour aller plus loin », en fin de chapitre).
  </div>

  <h3>Volume molaire</h3>
  <p>Le <strong>volume molaire</strong> est le volume occupé par une mole de gaz à des conditions données :</p>
  <div class="formula">$$V_m = \frac{V}{n} = \frac{RT}{P}$$</div>
  
  <p>Conséquence remarquable : <em>le volume molaire d'un gaz parfait ne dépend pas de la nature du gaz</em>. Tous les gaz parfaits ont le même volume molaire dans les mêmes conditions (P, T).</p>
  
  <p><strong>Ordre de grandeur à connaître :</strong> dans les conditions normales (T = 273 K, P = 1 bar = 10⁵ Pa) :</p>
  <div class="formula">$$V_m = 22{,}7 \text{ L/mol}$$</div>
  <p>La valeur 22,4 L/mol souvent citée correspond à 273 K sous 1 atm = 1,013 bar. À 25 °C et 1 bar, \(V_m \approx 24{,}8\) L/mol.</p>

  <h3>Volume massique</h3>
  <p>Le <strong>volume massique</strong> est le volume par unité de masse :</p>
  <div class="formula">$$v = \frac{V}{m} = \frac{nRT}{mP} = \frac{RT}{PM}$$</div>
  <p>où M est la masse molaire (en kg/mol). À l'inverse, la masse volumique vaut \(\rho = 1/v = PM/(RT)\).</p>
  
  <p><em>Ordre de grandeur :</em> pour l'air (M ≈ 29 g/mol) à 273 K et 1 bar, \(v \approx 0{,}78\) m³/kg, soit \(\rho \approx 1{,}3\) kg/m³.</p>

  <h3>Énergie interne</h3>
  <div class="def-box">
    L'<strong>énergie interne</strong> U d'un système est la somme des énergies cinétiques et potentielles de toutes ses particules :
    $$U = E_c^{\text{interne}} + E_p^{\text{interne}}$$
    L'énergie cinétique macroscopique (du système dans son ensemble) et l'énergie potentielle macroscopique (pesanteur sur le système entier) <em>n'en font pas partie</em>.
  </div>
  
  <p>Pour un gaz parfait, les particules n'interagissent pas à distance (par hypothèse). Donc \(E_p^{\text{interne}} = 0\) et U se réduit à l'énergie cinétique microscopique :</p>
  
  <div class="formula">$$U = \sum_{i=1}^N \frac{1}{2} m v_i^2 = N \cdot \langle E_c \rangle$$</div>
  
  <p>Pour un gaz parfait monoatomique : \(\langle E_c \rangle = \frac{3}{2} k_B T\), donc :</p>
  
  <div class="formula">$$\boxed{U_{\text{GPM}} = \frac{3}{2} n R T}$$</div>
  
  <p>Pour un gaz parfait diatomique (GPD : O₂, N₂, H₂…), les molécules ont en plus des degrés de liberté de rotation. Aux températures usuelles, ces 2 degrés de rotation supplémentaires ajoutent \(\frac{1}{2} k_B T\) chacun, soit \(k_B T\) total par molécule :</p>
  
  <div class="formula">$$\boxed{U_{\text{GPD}} = \frac{5}{2} n R T}$$</div>
  
  <p>Aux hautes températures (progressivement au-delà de 1 000 K environ pour N₂ et O₂), les modes de vibration s'activent en plus, jusqu'à ajouter 2 degrés de liberté supplémentaires : \(U = \frac{7}{2} n R T\). Hors programme en PTSI mais bon à savoir ; en exercice, l'expression de \(U\) d'un gaz diatomique est en général fournie.</p>

  <h3>Première loi de Joule</h3>
  <div class="prop-box">
    Pour un gaz parfait (monoatomique ou diatomique), l'énergie interne U ne dépend <em>que de la température T</em> :
    $$U = U(T)$$
    C'est la <strong>première loi de Joule</strong>.
  </div>
  
  <p>Conséquence pratique : si tu connais T, tu connais U, indépendamment de P ou de V. C'est pour ça que dans les compressions/détentes isothermes d'un gaz parfait, ΔU = 0.</p>

  <h3>Capacité thermique à volume constant</h3>
  <div class="def-box">
    La <strong>capacité thermique à volume constant</strong> \(C_V\) est l'énergie qu'il faut fournir au système pour augmenter sa température d'un degré, à volume constant :
    $$C_V = \frac{\mathrm{d}U}{\mathrm{d}T} \quad (\text{pour un gaz parfait, car } U = U(T))$$
    Dans le cas général où U dépend de T et V : \(C_V = \left(\dfrac{\partial U}{\partial T}\right)_V\). Unité : J·K⁻¹.
  </div>
  
  <p>On définit aussi des grandeurs dérivées :</p>
  <ul>
    <li><strong>Capacité thermique molaire</strong> : \(C_{V,m} = C_V/n\). Unité : J·K⁻¹·mol⁻¹.</li>
    <li><strong>Capacité thermique massique</strong> (capacité calorifique) : \(c = C_V/m\). Unité : J·K⁻¹·kg⁻¹.</li>
  </ul>

  <h3>Tableau récapitulatif (gaz parfaits)</h3>
  <div class="formula">$$\begin{array}{|c|c|c|}\hline
   & \textbf{GPM} & \textbf{GPD} \\ \hline
  U & \frac{3}{2} n R T & \frac{5}{2} n R T \\ \hline
  C_V & \frac{3}{2} n R & \frac{5}{2} n R \\ \hline
  C_{V,m} & \frac{3}{2} R & \frac{5}{2} R \\ \hline
  c & \frac{3 R}{2 M} & \frac{5 R}{2 M} \\ \hline
  \end{array}$$</div>
  
  <p>Conséquence du tableau : à n fixé, il faut plus d'énergie pour chauffer un GPD d'un degré qu'un GPM. Logique : il y a plus de « manières » de stocker l'énergie (translation + rotation au lieu de translation seule).</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · PHASES CONDENSÉES</div>
  <h2>Liquides et solides : le modèle simplifié</h2>
  <div class="intro">Les solides et liquides constituent les « phases condensées » : les particules y sont très proches, voire en contact. Leur description rigoureuse est complexe, mais en PTSI on utilise un modèle simplifié extrêmement efficace pour les exercices.</div>

  <h3>Modèle des phases condensées idéales</h3>
  <div class="prop-box">
    On considère qu'une phase condensée est :
    <ul style="margin-top:0.3rem">
      <li><strong>Indilatable</strong> : son volume ne dépend pas de la température. \(V = V(P)\) au plus, mais en pratique \(V = \text{cste}\).</li>
      <li><strong>Incompressible</strong> : son volume ne dépend pas de la pression. Donc, finalement, \(V = \text{cste}\) (au moins pour les variations modérées de T et P).</li>
    </ul>
  </div>
  
  <p>Cette double propriété est ce qui distingue radicalement les phases condensées des gaz : on n'a quasiment plus besoin de penser au volume, qui reste fixe.</p>

  <h3>Isotherme dans le diagramme de Clapeyron</h3>
  <p>Si on trace la pression P en fonction du volume V, à T fixée (sous la température critique), pour un corps qui peut être gazeux ou liquide :</p>
  <ul>
    <li>À <em>basse pression</em> (grand volume) : phase gazeuse, P ∝ 1/V (loi des gaz parfaits) : branche hyperbolique.</li>
    <li>À <em>haute pression</em> : phase liquide, V ≈ cste, quasi indépendant de P : branche <strong>presque verticale</strong>.</li>
    <li>Entre les deux : un <em>palier horizontal</em>, à pression constante, pendant le changement d'état liquide-gaz.</li>
  </ul>
  <p>La différence de compressibilité entre liquide et gaz est chiffrée au §9 ; le palier est étudié dans <a href="#changement/cours">« Corps pur diphasé et changements d'état »</a>.</p>

  <h3>Énergie interne d'une phase condensée</h3>
  <p>L'énergie interne U d'une phase condensée dépend en principe de T et V. Mais comme V est essentiellement constant pour une phase condensée idéale :</p>
  
  <div class="prop-box">
    Pour une phase condensée idéale, U ne dépend que de T (comme pour un gaz parfait !). On peut donc définir :
    $$C_V = \frac{\mathrm{d}U}{\mathrm{d}T}$$
  </div>
  
  <p>Cette propriété est analogue à la première loi de Joule pour les gaz parfaits, mais ici elle découle directement de l'incompressibilité et de l'indilatabilité, pas d'une loi expérimentale séparée.</p>
  
  <p><em>Ordre de grandeur :</em> pour l'eau liquide, c ≈ 4180 J·K⁻¹·kg⁻¹ (la fameuse « calorie » historique). Pour la plupart des métaux, c est de l'ordre de quelques centaines de J·K⁻¹·kg⁻¹.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉTAT MICROSCOPIQUE, ÉTAT MACROSCOPIQUE, ÉQUILIBRE</div>
  <h2>Décrire un état et le déterminer par les conditions d'équilibre</h2>
  <div class="intro">Décrire un gaz molécule par molécule demanderait des milliards de milliards de nombres ; à l'équilibre, trois ou quatre suffisent. Cette section précise ce passage, puis montre comment les conditions d'équilibre mécanique et thermique imposées par l'extérieur fixent la pression et la température d'un système.</div>
  <div class="def-box">
    <strong>État microscopique, état macroscopique.</strong> L'<strong>état microscopique</strong> d'un système de \(N\) particules est donné, à un instant, par la position et la vitesse de chacune : \(6N\) nombres pour un gaz monoatomique (3 coordonnées et 3 composantes de vitesse par atome). L'<strong>état macroscopique</strong> d'équilibre est décrit par quelques <strong>variables d'état</strong> mesurables : pour un fluide homogène, la quantité de matière \(n\) et deux variables parmi \(P\), \(V\), \(T\), la troisième étant donnée par l'équation d'état. Un même état macroscopique correspond à un nombre immense d'états microscopiques, qui changent sans cesse au gré des chocs.
  </div>
  <div class="method-box">
    <strong>Exemple — un litre d'argon</strong>
    <p>1,0 L d'argon sous 1,0 bar à 20 °C.</p>
    <ol>
      <li>Nombre d'atomes : \(N = \dfrac{PV}{k_B T} = \dfrac{10^5\times10^{-3}}{1{,}38\times10^{-23}\times293} \approx 2{,}5\times10^{22}\).</li>
      <li>État microscopique : \(6N \approx 1{,}5\times10^{23}\) nombres, qu'il faudrait renouveler à chaque choc (une molécule en subit des milliards par seconde).</li>
      <li>État macroscopique : \(n \approx 4{,}1\times10^{-2}\ \text{mol}\), \(V = 1{,}0\ \text{L}\), \(T = 293\ \text{K}\) ; la pression s'en déduit.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Conditions d'équilibre.</strong>
    <ul>
      <li><strong>Équilibre mécanique</strong> : chaque paroi mobile (piston, membrane) est immobile, donc la somme des forces qu'elle subit est nulle. Cela fixe la pression du gaz : par exemple \(P = P_{\text{ext}} + mg/S\) sous un piston horizontal de masse \(m\) et de section \(S\) ; \(P_1 = P_2\) de part et d'autre d'un piston sans masse.</li>
      <li><strong>Équilibre thermique</strong> : deux systèmes séparés par une paroi diathermane ont, à l'équilibre, la même température ; un système en contact avec un thermostat prend sa température.</li>
    </ul>
    Ces conditions, jointes aux équations d'état, déterminent l'état final.
  </div>
  <div class="method-box">
    <strong>Exemple — deux compartiments séparés par un piston</strong>
    <p>Un cylindre rigide de 2,0 L, plongé dans un thermostat à 300 K, est séparé en deux compartiments par un piston mobile, sans frottement et diathermane. Le compartiment A contient 0,020 mol de gaz parfait, le compartiment B 0,010 mol.</p>
    <ol>
      <li>Équilibre thermique : \(T_A = T_B = 300\ \text{K}\) (thermostat et paroi diathermane).</li>
      <li>Équilibre mécanique du piston : \(P_A = P_B = P\).</li>
      <li>Gaz parfaits : \(\dfrac{V_A}{V_B} = \dfrac{n_A}{n_B} = 2\), donc \(V_A \approx 1{,}33\ \text{L}\) et \(V_B \approx 0{,}67\ \text{L}\) ; \(P = \dfrac{(n_A + n_B)\,RT}{V} = \dfrac{0{,}030\times8{,}314\times300}{2{,}0\times10^{-3}} \approx 0{,}37\ \text{bar}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — déduire une température : le thermomètre à gaz</strong>
    <p>Un thermomètre à gaz à volume constant contient un gaz dilué. En équilibre thermique avec de l'eau au point triple (273,16 K), sa pression vaut 1,000 bar ; plongé dans de l'eau bouillante, elle vaut 1,366 bar.</p>
    <ol>
      <li>À volume constant, le gaz parfait vérifie \(P/T = \text{cste}\).</li>
      <li>À l'équilibre thermique, le gaz a la température de l'eau : \(T = 273{,}16\times\dfrac{1{,}366}{1{,}000} \approx 373{,}1\ \text{K}\), soit 100 °C environ.</li>
      <li>C'est ainsi qu'est définie, en pratique, l'échelle de température absolue : par la limite des gaz très dilués, qui se comportent tous en gaz parfaits (§8).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · DU GAZ RÉEL AU GAZ PARFAIT</div>
  <h2>Isothermes de Clapeyron et d'Amagat</h2>
  <div class="intro">Le gaz parfait est un modèle : les molécules réelles s'attirent et occupent un volume propre. Les isothermes mesurées montrent quand le modèle est excellent (gaz dilué, loin de la liquéfaction) et quand il faut s'en méfier (forte pression, vapeur proche de la saturation). Le programme demande de savoir comparer un gaz réel au gaz parfait sur ces réseaux d'isothermes.</div>
  <h3>Coordonnées de Clapeyron</h3>
  <p>Dans le diagramme de Clapeyron, on trace la pression en fonction du volume (ou du volume massique \(v\)) à température fixée. Pour un gaz parfait, \(Pv = rT\) avec \(r = R/M\) : les isothermes sont des hyperboles. Pour un gaz réel, l'écart se voit surtout près de la liquéfaction.</p>

<figcaption>Isothermes du diazote en coordonnées d'Amagat, calculées : produit \( PV_m \) en fonction de \( P \), à 200 K, 300 K et 500 K. Pour un gaz parfait, \( PV_m = RT \) : droites horizontales (tirets). Toutes les isothermes réelles partent de \( RT \) quand \( P \to 0 \) : à basse pression, tout gaz se comporte en gaz parfait. À 200 K, \( PV_m \) baisse d'abord (les attractions entre molécules dominent), passe par un minimum puis remonte (le volume propre des molécules l'emporte) ; à 300 K, l'écart reste inférieur à 1 % jusqu'à 100 bar.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Ce que montrent les isothermes d'Amagat.</strong>
    <ul>
      <li>Quand \(P \to 0\), toutes les isothermes réelles tendent vers \(RT\) : <strong>à basse pression, tout gaz se comporte en gaz parfait</strong>. En extrapolant \(PV_m\) à pression nulle, on mesure \(R\) (exercice 7).</li>
      <li>\(PV_m \lt RT\) : les <strong>attractions</strong> entre molécules dominent ; elles retiennent les molécules qui vont frapper la paroi et diminuent la pression.</li>
      <li>\(PV_m \gt RT\) : le <strong>volume propre</strong> des molécules (répulsions à courte distance) domine ; le volume réellement disponible est plus petit que \(V\), la pression plus grande.</li>
      <li>À basse température, \(PV_m\) diminue d'abord puis remonte ; à haute température, il croît dès les basses pressions.</li>
    </ul>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Écart \(PV_m/(RT) - 1\) à 300 K</th><th style="text-align:left">1 bar</th><th style="text-align:left">10 bar</th><th style="text-align:left">50 bar</th><th style="text-align:left">100 bar</th><th style="text-align:left">200 bar</th></tr>
    <tr><td>Air</td><td>−0,03 %</td><td>−0,3 %</td><td>−0,9 %</td><td>−0,7 %</td><td>+3,2 %</td></tr>
    <tr><td>Diazote</td><td>−0,02 %</td><td>−0,2 %</td><td>−0,3 %</td><td>+0,5 %</td><td>+5,7 %</td></tr>
    <tr><td>Dioxyde de carbone</td><td>−0,5 %</td><td>−5 %</td><td>−31 %</td><td colspan="2">liquide (au-delà de 67 bar)</td></tr>
  </table></div>
  <p style="font-size:.9em">Valeurs calculées avec les équations d'état de référence (CoolProp).</p>
  <div class="method-box">
    <strong>Exemple — le gaz parfait est-il un bon modèle ?</strong>
    <ol>
      <li>Air d'un pneu (2,5 bar, 20 °C) : écart de 0,1 % ; le modèle est excellent.</li>
      <li>Air d'une bouteille de plongée (200 bar) : écart de 3 % ; acceptable pour un ordre de grandeur, pas pour un calcul précis (exercice 8).</li>
      <li>CO₂ à 50 °C sous 80 bar (au-dessus de \(T_c = 31\ °\text{C}\)) : le gaz parfait prévoit \(v = rT/P = \dfrac{188{,}9\times323}{8\times10^6} \approx 7{,}6\ \text{L·kg}^{-1}\), la mesure donne \(4{,}6\ \text{L·kg}^{-1}\) : 67 % d'erreur, le modèle est inutilisable.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Ordres de grandeur.</strong> À température ambiante, l'air et les gaz « permanents » (N₂, O₂, H₂, He) suivent le modèle du gaz parfait à mieux que 1 % jusqu'à une centaine de bars. Un gaz proche de sa liquéfaction (CO₂, butane, propane, vapeur d'eau près de la saturation) s'en écarte nettement dès quelques bars.
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(PV = nRT\) à une vapeur au voisinage de sa liquéfaction, ou à un liquide. Le volume molaire de 24 L·mol⁻¹ (20 °C, 1 bar) est celui d'un gaz ; celui de l'eau liquide est de 18 mL·mol⁻¹.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · LIQUIDE ET GAZ : COMPRESSIBILITÉ, VOLUMES USUELS</div>
  <h2>Pourquoi une phase condensée est dite incompressible</h2>
  <div class="intro">Le modèle de la phase condensée incompressible et indilatable (§6) repose sur une différence de comportement énorme entre liquide et gaz, que l'on lit sur les isothermes. Cette section la chiffre et donne les volumes molaires et massiques usuels à connaître.</div>

  <div class="prop-box">
    <strong>Lecture graphique.</strong> Dans le diagramme de Clapeyron \((P, v)\), l'isotherme d'un gaz est une courbe qui s'aplatit (hyperbole) : une hausse de pression réduit beaucoup le volume. Celle d'un liquide est presque <strong>verticale</strong> : une forte hausse de pression change à peine le volume. Plus l'isotherme est raide, moins la phase est compressible. Pour un même corps, les deux branches se voient sur une même isotherme, de part et d'autre du palier de liquéfaction.
  </div>
  <div class="method-box">
    <strong>Exemple — comprimer un litre d'eau et un litre d'air</strong>
    <p>On porte de 1 bar à 101 bar, à 20 °C, 1,0 L d'eau liquide puis 1,0 L d'air.</p>
    <ol>
      <li>Air (gaz parfait, \(PV = \text{cste}\)) : \(V = 1{,}0\times\dfrac{1}{101} \approx 10\ \text{mL}\).</li>
      <li>Eau : les tables donnent une diminution de 0,45 %, soit \(V \approx 995{,}5\ \text{mL}\) : 4,5 mL de moins seulement.</li>
      <li>De même, chauffer l'eau de 20 à 30 °C sous 1 bar l'augmente de 0,26 % en volume, contre 3,4 % pour l'air : l'eau est aussi presque indilatable.</li>
    </ol>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Corps (20 °C, 1 bar)</th><th style="text-align:left">Volume massique</th><th style="text-align:left">Volume molaire</th></tr>
    <tr><td>Eau liquide</td><td>1,00 L·kg⁻¹</td><td>18 mL·mol⁻¹</td></tr>
    <tr><td>Glace (0 °C)</td><td>1,09 L·kg⁻¹</td><td>19,6 mL·mol⁻¹</td></tr>
    <tr><td>Fer</td><td>0,127 L·kg⁻¹</td><td>7,1 mL·mol⁻¹</td></tr>
    <tr><td>Mercure</td><td>0,074 L·kg⁻¹</td><td>14,8 mL·mol⁻¹</td></tr>
    <tr><td>Air</td><td>0,84 m³·kg⁻¹</td><td>24,4 L·mol⁻¹</td></tr>
    <tr><td>Vapeur d'eau (100 °C, 1 bar)</td><td>1,70 m³·kg⁻¹</td><td>30,6 L·mol⁻¹</td></tr>
  </table></div>
  <p>Un gaz dans les conditions usuelles occupe environ <strong>mille fois</strong> plus de volume qu'une phase condensée de même quantité de matière : les molécules y sont distantes d'une dizaine de diamètres, contre un seul dans un liquide ou un solide.</p>
  <div class="notice"><strong>Pour aller plus loin (hors programme en PTSI)</strong> : on mesure la compressibilité par le coefficient \(\chi_T = -\dfrac{1}{V}\left(\dfrac{\partial V}{\partial P}\right)_T\). Pour un gaz parfait, \(\chi_T = 1/P = 10^{-5}\ \text{Pa}^{-1}\) sous 1 bar ; pour l'eau liquide, \(\chi_T \approx 4{,}6\times10^{-10}\ \text{Pa}^{-1}\), vingt mille fois moins.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · LE MODÈLE DE VAN DER WAALS</div>
  <h2>Une équation d'état de gaz réel</h2>
  <div class="intro">Hors programme en PTSI : aucune équation d'état de gaz réel n'est exigible, les isothermes expérimentales suffisent. Le modèle de Van der Waals reste la façon la plus simple de comprendre les écarts au gaz parfait.</div>
  <div class="formula" data-nom="Équation de Van der Waals">$$\left(P + \frac{a}{V_m^2}\right)(V_m - b) = RT$$</div>
  <ul>
    <li>\(b\) (le <strong>covolume</strong>) est le volume propre des molécules d'une mole : le volume disponible est \(V_m - b\).</li>
    <li>\(a/V_m^2\) traduit les <strong>attractions</strong> : la pression mesurée est plus faible que celle d'un gaz sans attractions.</li>
    <li>Quand \(V_m \gg b\) et \(a/V_m^2 \ll P\) (gaz dilué), on retrouve \(PV_m = RT\).</li>
    <li>Sous \(T_c\), les isothermes de Van der Waals présentent une boucle, qu'on remplace par le palier de liquéfaction. Le point critique donne \(a = \dfrac{27R^2T_c^2}{64P_c}\) et \(b = \dfrac{RT_c}{8P_c}\) : pour CO₂ (304 K, 73,8 bar), \(a \approx 3{,}66\ \text{L}^2\text{·bar·mol}^{-2}\) et \(b \approx 42{,}8\ \text{mL·mol}^{-1}\).</li>
  </ul>
  <p>Exemple : CO₂ à 300 K, \(V_m = 0{,}50\ \text{L·mol}^{-1}\). Gaz parfait : 49,9 bar ; Van der Waals : 39,9 bar ; mesure : 38,7 bar. Le modèle capte l'essentiel de l'écart.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · INTRO THERMODYNAMIQUE</div>
  <h2>Stratégies pour les exercices d'introduction à la thermo</h2>
  <div class="intro">Voici les démarches à connaître pour les exercices types : conversions d'unités, applications de l'équation d'état, calculs d'énergie interne ou de vitesse quadratique.</div>

  <div class="method-box">
    <strong>Méthode 1 — Avant tout calcul, vérifier les unités SI</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">T :</span> en Kelvin. Si l'énoncé donne T en °C, ajouter 273,15.</li>
      <li><span class="step">P :</span> en Pascal. Convertir si bar (×10⁵) ou atm (×1,013·10⁵).</li>
      <li><span class="step">V :</span> en m³. Convertir si litres (÷1000).</li>
      <li><span class="step">M :</span> en kg/mol pour les formules de vitesse quadratique. Convertir si g/mol (÷1000).</li>
      <li><span class="step">R :</span> = 8,314 J·K⁻¹·mol⁻¹.</li>
    </ol>
    <p>Cette étape évite la majorité des erreurs en thermo.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Appliquer l'équation d'état des gaz parfaits</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Identifier les 4 grandeurs P, V, n, T. On en connaît 3, on cherche la quatrième.</li>
      <li><span class="step">Étape 2.</span> Convertir en unités SI (méthode 1).</li>
      <li><span class="step">Étape 3.</span> Appliquer \(PV = nRT\), isoler la grandeur cherchée.</li>
      <li><span class="step">Étape 4.</span> Vérifier l'ordre de grandeur du résultat (V_m ≈ 22 L/mol dans les CNTP, P_atm ≈ 10⁵ Pa, etc.).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Calculer une vitesse quadratique moyenne</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Vérifier que le gaz est traité comme parfait monoatomique (ou que la formule s'applique au cas considéré).</li>
      <li><span class="step">Étape 2.</span> Utiliser \(u = \sqrt{3RT/M}\) (avec M en kg/mol et R = 8,314).</li>
      <li><span class="step">Étape 3.</span> Vérifier : pour un gaz courant à 300 K, on attend u entre 300 et 1900 m/s selon M (H₂ très rapide, gaz lourds plus lents).</li>
    </ol>
    <p><em>Variante :</em> on peut aussi écrire \(u = \sqrt{3 k_B T / m}\) où m est la masse d'<em>un atome</em> (et non d'une mole).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Calculer une pression à partir d'un équilibre mécanique</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Identifier les forces qui s'exercent sur la paroi mobile (souvent : pression intérieure, pression extérieure, poids, force du ressort éventuel).</li>
      <li><span class="step">Étape 2.</span> Écrire l'équilibre des forces sur la paroi : \(\sum \vec{F} = \vec{0}\).</li>
      <li><span class="step">Étape 3.</span> Projeter sur l'axe pertinent et résoudre pour la pression cherchée.</li>
    </ol>
    <p><em>Exemple classique :</em> piston vertical de masse m soumis à la pesanteur, sur un gaz. Équilibre : \(P_{\text{int}} \cdot S = P_{\text{ext}} \cdot S + m g\) ⟹ \(P_{\text{int}} = P_{\text{ext}} + mg/S\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Déduire une température d'un équilibre thermique</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> À l'équilibre thermique entre deux corps, on a T₁ = T₂ = T_f (température finale commune).</li>
      <li><span class="step">Étape 2.</span> Écrire le bilan d'énergie : si le système total est isolé, ΔU_total = 0, donc \(C_{V,1}(T_f - T_{i,1}) + C_{V,2}(T_f - T_{i,2}) = 0\).</li>
      <li><span class="step">Étape 3.</span> Résoudre pour T_f : \(T_f = (C_{V,1} T_{i,1} + C_{V,2} T_{i,2})/(C_{V,1} + C_{V,2})\). C'est une moyenne pondérée des températures initiales.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Calculer une variation d'énergie interne</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Identifier la nature du système : gaz parfait monoatomique (\(U = \frac{3}{2}nRT\)), diatomique (\(\frac{5}{2}nRT\)) ou phase condensée.</li>
      <li><span class="step">Étape 2.</span> Pour une transformation entre deux états : \(\Delta U = C_V \cdot \Delta T\).</li>
      <li><span class="step">Étape 3.</span> Pour un gaz parfait, ΔU ne dépend QUE de ΔT, peu importe le chemin suivi (1ère loi de Joule).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Comparer un gaz réel au modèle du gaz parfait</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> En coordonnées d'Amagat : calculer \(PV_m\) (ou \(PV\) à quantité de matière fixée) pour chaque mesure à température fixée. Pour un gaz parfait, \(PV_m = RT\) : les points sont alignés sur une horizontale.</li>
      <li><span class="step">Étape 2.</span> Évaluer l'écart relatif \(\dfrac{PV_m}{RT} - 1\) : en dessous de 1 % environ, le modèle du gaz parfait est acceptable. Un écart négatif traduit les attractions entre molécules, un écart positif leur volume propre.</li>
      <li><span class="step">Étape 3.</span> En coordonnées de Clapeyron : comparer la pression mesurée à \(nRT/V\) ; se méfier près d'un palier de liquéfaction (température inférieure à \(T_c\), forte pression).</li>
      <li><span class="step">Étape 4.</span> Pour mesurer \(R\) (ou une température), extrapoler \(PV_m\) à pression nulle : tous les gaz y deviennent parfaits.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour le diazote à 300 K sous 100 bar, on mesure \(V_m = 0{,}2507\ \text{L·mol}^{-1}\) : \(PV_m = 10^7\times2{,}507\times10^{-4} \approx 2\,507\ \text{J·mol}^{-1}\), contre \(RT \approx 2\,494\ \text{J·mol}^{-1}\) : écart de +0,5 %, le gaz parfait reste un bon modèle.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Choisir le modèle d'une phase et évaluer sa compressibilité</strong>
    <ol style="margin-top:0.4rem">
      <li><span class="step">Étape 1.</span> Identifier la phase (liquide, solide, gaz) : température comparée aux températures de changement d'état sous la pression considérée.</li>
      <li><span class="step">Étape 2.</span> Gaz : équation d'état \(PV = nRT\), volume molaire de l'ordre de 24 L·mol⁻¹ dans les conditions usuelles (vérifier la validité par la méthode 7).</li>
      <li><span class="step">Étape 3.</span> Phase condensée : volume constant (\(V = m/\rho\), volume massique de l'ordre de 1 L·kg⁻¹ pour l'eau), énergie interne fonction de \(T\) seule.</li>
      <li><span class="step">Étape 4.</span> Pour comparer les compressibilités, lire la raideur des isothermes du diagramme de Clapeyron, ou calculer la variation relative de volume pour une même variation de pression.</li>
    </ol>
    <p><em>Exemple éclair :</em> une seringue bouchée contient 10 mL d'air, une autre 10 mL d'eau ; on porte la pression de 1 à 2 bar à température constante. L'air passe à 5 mL (\(PV = \text{cste}\)) ; l'eau perd 0,005 % de son volume, moins de 0,001 mL.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer \(PV = nRT\) à un liquide, ou à une vapeur proche de sa liquéfaction (CO₂ sous quelques dizaines de bars, vapeur d'eau près de la saturation) : l'erreur peut dépasser 30 %.</div>

  <div class="method-box">
    <strong>Pièges classiques en thermo intro</strong>
    <ul style="margin-top:0.4rem">
      <li>Oublier de convertir T en Kelvin (°C dans PV = nRT donne des aberrations).</li>
      <li>Confondre M en g/mol et en kg/mol dans la formule de la vitesse quadratique.</li>
      <li>Confondre n (mol) et n* (densité particulaire en /m³).</li>
      <li>Confondre k_B (par particule) et R (par mole). Lien : R = N_A · k_B.</li>
      <li>Croire qu'un GPD a U = (3/2)nRT — non, c'est (5/2)nRT.</li>

    <h4>Correction</h4>

    <p>\(P = P_0 + mg/S\), avec \(\dfrac{mg}{S} = \dfrac{2 \times 9{,}81}{50 \times 10^{-4}}\), soit \(P = 10^5 + 3924 \approx \mathbf{1{,}04 \times 10^5}\) <strong>Pa</strong>.</p>

    <p>Hauteur : \(h = \dfrac{V}{S} = \dfrac{2{,}4 \times 10^{-4}}{50 \times 10^{-4}} = \mathbf{0{,}048}\) <strong>m</strong> ≈ 5 cm.</p>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Modèle du gaz de Van der Waals (hors programme, pour aller plus loin)</h3>
  <div class="statement">L'équation de Van der Waals corrige l'équation des GP : \(\left(P + \dfrac{a}{V_m^2}\right)(V_m - b) = RT\), où \(a\) et \(b\) sont des constantes. Pour \(\text{CO}_2\) : \(a = 3{,}658\ \text{L}^2\text{·bar·mol}^{-2}\), \(b = 42{,}9\times10^{-3}\ \text{L·mol}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Identifier le rôle physique de chaque correction (\(a/V_m^2\) et \(b\)).</div>
  <div class="q"><strong>Q2.</strong> Pour \(\text{CO}_2\) à \(T = 300\ \text{K}\), \(V_m = 2\ \text{L/mol}\) : calculer la pression réelle et la pression d'un GP de même \(T\) et \(V_m\).</div>
  <div class="q"><strong>Q3.</strong> À quelle condition (\(V_m\) grand devant ?) le modèle de Van der Waals se réduit-il à l'équation des GP ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le terme \(a/V_m^2\) corrige les attractions intermoléculaires (qui réduisent la pression effective : les molécules s'attirent mutuellement et frappent moins fort les parois). Le terme \(b\) corrige le volume propre des molécules (volume exclu : le volume disponible est \(V_m - b\) et non \(V_m\)).</p>
    <p><strong>Q2.</strong> GP : \(P_{GP} = RT/V_m\), soit \(P_{GP} = 0{,}083\,14\times300/2 = 12{,}47\ \text{bar}\). Van der Waals : \(P_{VdW} = RT/(V_m-b) - a/V_m^2\), soit \(P_{VdW} = 24{,}94/1{,}957 - 3{,}658/4\), puis \(P_{VdW} \approx 12{,}74 - 0{,}91 = 11{,}83\ \text{bar}\). La pression est inférieure de 5 % à celle du gaz parfait, à cause des attractions ; la valeur mesurée (11,7 bar) confirme cet écart.</p>
    <p><strong>Q3.</strong> Quand \(V_m \gg b\) (volume propre négligeable) : \(V_m - b \approx V_m\). Quand \(a/V_m^2 \ll P\) (attractions négligeables) : \(P + a/V_m^2 \approx P\). Ces conditions sont réunies aux hautes températures et basses pressions (gaz dilué). \((P + a/V_m^2)(V_m - b) \approx P\,V_m = RT\).</p>
  </div>
</div>

  </div>
  <div class="statement">
    On considère \(n = 1{,}0\ \text{mol}\) de gaz parfait. Données : \(R = 8{,}314\ \text{J·K}^{-1}\text{mol}^{-1}\), masse molaire de l'air \(M = 29\ \text{g/mol}\).
  </div>

  <p class="exo-part">Partie A — Équation d'état</p>
  <div class="q"><strong>A1.</strong> Rappeler l'équation d'état du gaz parfait. Calculer la pression pour \(V = 24\ \text{L}\) et \(T = 300\ \text{K}\).</div>
  <div class="q"><strong>A2.</strong> Quel volume occuperait ce gaz à \(T = 300\ \text{K}\) sous \(P = 1{,}0\ \text{bar}\) ?</div>

  <p class="exo-part">Partie B — Point de vue cinétique</p>
  <div class="q"><strong>B1.</strong> Donner la vitesse quadratique moyenne \(u = \sqrt{3RT/M}\) des molécules d'air à 300 K.</div>
  <div class="q"><strong>B2.</strong> Pour un gaz parfait monoatomique, exprimer l'énergie interne \(U\) et la calculer à 300 K.</div>

  <p class="exo-part">Partie C — Écart au gaz parfait</p>
  <div class="q"><strong>C1.</strong> Une mole d'air est comprimée à 300 K sous 200 bar ; on mesure \(V_m = 0{,}1287\ \text{L·mol}^{-1}\). Calculer le volume prévu par le modèle du gaz parfait et l'écart relatif.</div>
  <div class="q"><strong>C2.</strong> Interpréter le signe de l'écart. Le modèle du gaz parfait est-il justifié pour la question A1 ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(PV = nRT\) → \(P = \dfrac{nRT}{V} = \dfrac{1{,}0\times8{,}314\times300}{24\times10^{-3}}\), soit \(P \approx 1{,}04\times10^{5}\ \text{Pa}\) (≈ 1 bar).</p>
    <p><strong>A2.</strong> \(V = \dfrac{nRT}{P} = \dfrac{1{,}0\times8{,}314\times300}{1{,}0\times10^{5}}\), soit \(V \approx 2{,}5\times10^{-2}\ \text{m}^3 = 25\ \text{L}\).</p>
    <p><strong>B1.</strong> \(u = \sqrt{\dfrac{3RT}{M}} = \sqrt{\dfrac{3\times8{,}314\times300}{29\times10^{-3}}}\), soit \(u \approx 5{,}1\times10^{2}\ \text{m/s}\).</p>
    <p><strong>B2.</strong> Gaz monoatomique : \(U = \tfrac32 nRT = \tfrac32\times1{,}0\times8{,}314\times300\), soit \(U \approx 3{,}7\times10^{3}\ \text{J}\).</p>
    <p><strong>C1.</strong> Gaz parfait : \(V_m = \dfrac{RT}{P} = \dfrac{8{,}314\times300}{2{,}00\times10^7}\), environ \(0{,}1247\ \text{L·mol}^{-1}\). Le volume mesuré est plus grand de \(\dfrac{0{,}1287}{0{,}1247} - 1 \approx 3{,}2\ \%\).</p>
    <p><strong>C2.</strong> \(PV_m \gt RT\) : sous 200 bar, les molécules sont assez serrées pour que leur volume propre ne soit plus négligeable (les répulsions à courte distance l'emportent sur les attractions). Sous 1 bar (question A1), l'écart n'est que de 0,03 % : le modèle du gaz parfait est excellent.</p>
  </div>
</div>
