<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Échelle de mots</h3>
  <div class="statement">On veut transformer un mot en un autre en changeant une seule lettre à la fois, chaque étape devant être un mot d'une liste donnée. Liste : <span class="code-inline">["CAPE", "CAVE", "RAVE", "RIVE", "RIRE", "LIRE", "LIME", "CIME", "CAME", "LAME", "RAME", "RIME"]</span>. On numérote les mots par leur position dans la liste.</div>
  <div class="q"><strong>Q1.</strong> Modéliser le problème par un graphe. Écrire <span class="code-inline">voisins_mots(m1, m2)</span> et <span class="code-inline">graphe_mots(mots)</span>.</div>
  <div class="q"><strong>Q2.</strong> Quelle est la complexité de <span class="code-inline">graphe_mots</span> pour \(n\) mots de \(L\) lettres ?</div>
  <div class="q"><strong>Q3.</strong> Comment trouver une échelle la plus courte de CAPE à LIRE ? La donner.</div>
  <div class="q"><strong>Q4.</strong> Avec un dictionnaire de 50 000 mots de cinq lettres, la construction du graphe est-elle raisonnable ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sommets : les mots ; arête entre deux mots qui diffèrent d'exactement une lettre (relation symétrique : graphe non orienté).</p>
    <pre class="codeblock"><span class="kw">def</span> voisins_mots(m1: str, m2: str) -&gt; bool:
    <span class="str">"""m1, m2 de même longueur diffèrent d'une seule lettre."""</span>
    diff = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(len(m1)):
        <span class="kw">if</span> m1[k] != m2[k]:
            diff = diff + 1
    <span class="kw">return</span> diff == 1

<span class="kw">def</span> graphe_mots(mots: list) -&gt; list:
    n = len(mots)
    G = [[] <span class="kw">for</span> i <span class="kw">in</span> range(n)]
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):
            <span class="kw">if</span> voisins_mots(mots[i], mots[j]):
                G[i].append(j)
                G[j].append(i)
    <span class="kw">return</span> G</pre>
    <p>Ce graphe a 20 arêtes.</p>
    <p><strong>Q2.</strong> \(\dfrac{n(n-1)}{2}\) paires, chacune comparée en \(O(L)\) : \(O(n^2 L)\).</p>
    <p><strong>Q3.</strong> Une échelle la plus courte est un plus court chemin en nombre d'arêtes : parcours en largeur depuis CAPE avec mémorisation des parents (fonctions <span class="code-inline">largeur</span> et <span class="code-inline">chemin</span> du cours), puis remontée depuis LIRE : CAPE → CAME → CIME → LIME → LIRE, en 4 changements. Le parcours en largeur garantit qu'aucune échelle plus courte n'existe dans cette liste : CAPE et LIRE diffèrent par trois lettres, il faudrait donc au moins trois changements, mais aucune suite de trois changements ne passe par des mots de la liste.</p>
    <p><strong>Q4.</strong> \(\dfrac{n(n-1)}{2} \approx 1{,}25\times10^{9}\) comparaisons de mots, soit plusieurs minutes en Python à \(10^7\) opérations par seconde (et davantage, chaque comparaison examinant jusqu'à cinq lettres) : c'est long. On fait mieux en regroupant les mots par « motif » (le mot avec une lettre remplacée par un joker) dans un dictionnaire : deux mots sont voisins s'ils partagent un motif, et la construction devient à peu près linéaire en \(n\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Itinéraires dans un réseau de vélos en libre-service</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique des concours (thème : graphes pondérés, parcours en largeur, algorithmes de Dijkstra et A*).</div>
  <div class="statement">Une ville compte \(n\) stations de vélos, numérotées de 0 à \(n - 1\) ; la station \(v\) est au point <span class="code-inline">coord[v] = (x, y)</span> (en km). Une piste cyclable relie directement certaines paires de stations, dans les deux sens ; la liste <span class="code-inline">troncons</span> contient des triplets <span class="code-inline">(i, j, t)</span>, où <span class="code-inline">t</span> est la durée du trajet de <span class="code-inline">i</span> à <span class="code-inline">j</span> en minutes. Exemple à \(n = 10\) stations et 14 tronçons, où l'on veut aller de la gare (station 0) à l'université (station 6) :
    <div><table>
<tr><th>station</th><th>position (km)</th><th>voisines (durée)</th></tr>
<tr><td>0</td><td>(0, 0)</td><td>1 (8 min), 2 (11 min), 7 (6 min), 8 (7 min)</td></tr>
<tr><td>1</td><td>(2, 1)</td><td>0 (8 min), 2 (7 min), 3 (9 min)</td></tr>
<tr><td>2</td><td>(1, 3)</td><td>0 (11 min), 1 (7 min), 4 (8 min), 9 (13 min)</td></tr>
<tr><td>3</td><td>(4, 2)</td><td>1 (9 min), 4 (7 min), 5 (8 min)</td></tr>
<tr><td>4</td><td>(3, 4)</td><td>2 (8 min), 3 (7 min), 6 (9 min)</td></tr>
<tr><td>5</td><td>(6, 3)</td><td>3 (8 min), 6 (7 min)</td></tr>
<tr><td>6</td><td>(5, 5)</td><td>4 (9 min), 5 (7 min)</td></tr>
<tr><td>7</td><td>(-2, 0)</td><td>0 (6 min), 8 (7 min), 9 (7 min)</td></tr>
<tr><td>8</td><td>(-1, -2)</td><td>0 (7 min), 7 (7 min)</td></tr>
<tr><td>9</td><td>(-3, 2)</td><td>2 (13 min), 7 (7 min)</td></tr>
</table></div>
    On rappelle : <span class="code-inline">from collections import deque</span> donne les files <span class="code-inline">deque</span> (<span class="code-inline">append</span>, <span class="code-inline">popleft</span>, <span class="code-inline">len</span>, en temps constant) ; <span class="code-inline">float('inf')</span> représente \(+\infty\) ; <span class="code-inline">from math import sqrt</span> donne la racine carrée.</div>
  <p class="exo-part">Partie A — Représentation</p>
  <div class="q"><strong>A1.</strong> Écrire <span class="code-inline">construire(n, troncons)</span>, qui renvoie les listes d'adjacence pondérées : <span class="code-inline">G[i]</span> contient un couple <span class="code-inline">(j, t)</span> par tronçon de durée <span class="code-inline">t</span> entre <span class="code-inline">i</span> et <span class="code-inline">j</span>.</div>
  <div class="q"><strong>A2.</strong> Combien de couples contiennent en tout les listes de l'exemple ? Quelle est la complexité de <span class="code-inline">construire</span> ?</div>
  <p class="exo-part">Partie B — Nombre minimal de tronçons</p>
  <div class="q"><strong>B1.</strong> Écrire <span class="code-inline">nb_troncons(G, s)</span>, qui renvoie la liste des nombres minimaux de tronçons de <span class="code-inline">s</span> à chaque station (\(-1\) si une station est inaccessible).</div>
  <div class="q"><strong>B2.</strong> Donner le résultat sur l'exemple depuis la station 0, et la complexité.</div>
  <p class="exo-part">Partie C — Durée minimale</p>
  <div class="q"><strong>C1.</strong> Écrire <span class="code-inline">dijkstra(G, s)</span>, qui renvoie la liste <span class="code-inline">d</span> des durées minimales depuis <span class="code-inline">s</span> et la liste <span class="code-inline">pred</span> des prédécesseurs, avec une recherche naïve du minimum.</div>
  <div class="q"><strong>C2.</strong> Donner <span class="code-inline">d</span> sur l'exemple depuis 0, et l'itinéraire le plus rapide de la gare à l'université.</div>
  <div class="q"><strong>C3.</strong> Quelle est la complexité de <span class="code-inline">dijkstra</span> ? Estimer la durée du calcul pour une métropole de \(10^4\) stations, à \(10^7\) opérations par seconde.</div>
  <p class="exo-part">Partie D — Recherche guidée (A*)</p>
  <div class="q"><strong>D1.</strong> On admet qu'à vélo on ne dépasse pas 20 km/h et qu'une piste n'est jamais plus courte que la ligne droite. Montrer que \(h(v) = 3\,\text{dist}(v, c)\), où \(\text{dist}\) est la distance à vol d'oiseau en km, ne surestime jamais la durée minimale (en minutes) de \(v\) à la cible \(c\). Écrire <span class="code-inline">heuristique(coord, c)</span>.</div>
  <div class="q"><strong>D2.</strong> Écrire <span class="code-inline">a_etoile_compte(G, s, c, h)</span>, variante de l'algorithme de Dijkstra qui fixe le sommet minimisant <span class="code-inline">d[v] + h[v]</span>, s'arrête dès que \(c\) est fixé et renvoie la durée trouvée et le nombre de sommets fixés avant \(c\).</div>
  <div class="q"><strong>D3.</strong> Sur l'exemple (de 0 à 6), comparer le nombre de stations fixées avant l'université par A* et par l'algorithme de Dijkstra arrêté à la cible (\(h = 0\)). Expliquer la différence.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1, B1.</strong></p>
    <pre class="codeblock"><span class="kw">from</span> collections <span class="kw">import</span> deque

inf = float(<span class="str">'inf'</span>)

<span class="kw">def</span> construire(n: int, troncons: list) -&gt; list:
    <span class="str">"""troncons : liste de triplets (i, j, duree) ;</span>
<span class="str">    graphe non orienté."""</span>
    G = [[] <span class="kw">for</span> k <span class="kw">in</span> range(n)]
    <span class="kw">for</span> i, j, t <span class="kw">in</span> troncons:
        G[i].append((j, t))
        G[j].append((i, t))
    <span class="kw">return</span> G

<span class="kw">def</span> nb_troncons(G: list, s: int) -&gt; list:
    <span class="str">"""Nombre minimal de tronçons de s à chaque station</span>
<span class="str">    (-1 si la station est inaccessible)."""</span>
    n = len(G)
    d = [-1] * n
    d[s] = 0
    f = deque([s])
    <span class="kw">while</span> len(f) &gt; 0:
        u = f.popleft()
        <span class="kw">for</span> v, t <span class="kw">in</span> G[u]:          <span class="cmt"># la durée t ne sert pas ici</span>
            <span class="kw">if</span> d[v] == -1:
                d[v] = d[u] + 1
                f.append(v)
    <span class="kw">return</span> d</pre>
    <p><strong>A2.</strong> Chaque tronçon donne deux couples : 28 couples. Complexité de <span class="code-inline">construire</span> : \(O(n)\) pour créer les listes, \(O(1)\) par tronçon, donc \(O(n + m)\).</p>
    <p><strong>B2.</strong> <span class="code-inline">nb_troncons(G, 0)</span> = <span class="code-inline">[0, 1, 1, 2, 2, 3, 3, 1, 1, 2]</span> : l'université est à 3 tronçons de la gare. Complexité \(O(n + m)\) (parcours en largeur).</p>
    <p><strong>C1.</strong> C'est la fonction du cours (§9) ; ici les durées sont positives, l'algorithme s'applique.</p>
    <pre class="codeblock"><span class="kw">def</span> dijkstra(G: list, s: int) -&gt; tuple:
    <span class="str">"""G : listes d'adjacence pondérées, poids positifs ou nuls.</span>
<span class="str">    Renvoie (d, pred) : d[v] = distance de s à v (inf si v est</span>
<span class="str">    inaccessible), pred[v] = prédécesseur de v sur un plus</span>
<span class="str">    court chemin."""</span>
    n = len(G)
    d = [inf] * n
    pred = [<span class="kw">None</span>] * n
    fixe = [<span class="kw">False</span>] * n       <span class="cmt"># fixe[v] : d[v] est définitive</span>
    d[s] = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        <span class="cmt"># extraction naïve : sommet non fixé de d minimale</span>
        u = -1
        <span class="kw">for</span> v <span class="kw">in</span> range(n):
            <span class="kw">if</span> <span class="kw">not</span> fixe[v] <span class="kw">and</span> (u == -1 <span class="kw">or</span> d[v] &lt; d[u]):
                u = v
        <span class="kw">if</span> d[u] == inf:      <span class="cmt"># les autres sont inaccessibles</span>
            <span class="kw">return</span> d, pred
        fixe[u] = <span class="kw">True</span>
        <span class="kw">for</span> v, p <span class="kw">in</span> G[u]:    <span class="cmt"># mise à jour par les voisins de u</span>
            <span class="kw">if</span> <span class="kw">not</span> fixe[v] <span class="kw">and</span> d[u] + p &lt; d[v]:
                d[v] = d[u] + p
                pred[v] = u
    <span class="kw">return</span> d, pred</pre>
    <p><strong>C2.</strong> <span class="code-inline">d</span> = <span class="code-inline">[0, 8, 11, 17, 19, 25, 28, 6, 7, 13]</span>. Itinéraire, en remontant <span class="code-inline">pred</span> depuis 6 : 0 → 2 → 4 → 6, en 28 minutes (\(11 + 8 + 9\)). L'itinéraire \(0 \to 1 \to 3 \to 5 \to 6\) en compte 32.</p>
    <p><strong>C3.</strong> \(n\) étapes de recherche du minimum en \(O(n)\) : \(O(n^2 + m) = O(n^2)\). Pour \(n = 10^4\) : environ \(10^8\) opérations, de l'ordre de 10 s : trop lent pour une application interactive.</p>
    <p><strong>D1.</strong> Une piste de \(i\) à \(j\) mesure au moins \(\text{dist}(i, j)\) km ; à 20 km/h au plus, soit 3 min/km au moins, sa durée vaut au moins \(3\,\text{dist}(i, j)\). Pour un itinéraire \(v = s_0, s_1, \dots, s_k = c\), la durée vaut au moins \(3\sum \text{dist}(s_i, s_{i+1}) \ge 3\,\text{dist}(v, c)\) (inégalité triangulaire). Donc \(h(v)\) ne dépasse jamais la durée minimale : \(h\) est admissible (et, par le même argument appliqué à un tronçon, \(h(i) \le t + h(j)\) pour chaque tronçon).</p>
    <pre class="codeblock"><span class="kw">from</span> math <span class="kw">import</span> sqrt        <span class="cmt"># sqrt(x) : racine carrée de x</span>

<span class="kw">def</span> heuristique(coord: list, c: int) -&gt; list:
    <span class="str">"""h[v] = 3 × (distance à vol d'oiseau de v à c, en km) :</span>
<span class="str">    durée minimale, en minutes, à 20 km/h en ligne droite."""</span>
    xc, yc = coord[c]
    <span class="kw">return</span> [3 * sqrt((x - xc) ** 2 + (y - yc) ** 2)
            <span class="kw">for</span> x, y <span class="kw">in</span> coord]</pre>
    <p>Sur l'exemple, avec \(c = 6\) : \(h\) vaut (arrondi au dixième) 21,2, 15,0, 13,4, 9,5, 6,7, 6,7, 0,0, 25,8, 27,7, 25,6.</p>
    <p><strong>D2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> a_etoile_compte(G: list, s: int, c: int, h: list) -&gt; tuple:
    <span class="str">"""A* : renvoie (durée minimale de s à c,</span>
<span class="str">    nombre de sommets fixés avant c)."""</span>
    n = len(G)
    d = [inf] * n
    fixe = [<span class="kw">False</span>] * n
    d[s] = 0
    nb = 0
    <span class="kw">while</span> <span class="kw">True</span>:
        u = -1
        <span class="kw">for</span> v <span class="kw">in</span> range(n):
            <span class="kw">if</span> <span class="kw">not</span> fixe[v] <span class="kw">and</span> d[v] &lt; inf:
                <span class="kw">if</span> u == -1 <span class="kw">or</span> d[v] + h[v] &lt; d[u] + h[u]:
                    u = v
        <span class="kw">if</span> u == -1:
            <span class="kw">return</span> inf, nb
        <span class="kw">if</span> u == c:
            <span class="kw">return</span> d[c], nb
        fixe[u] = <span class="kw">True</span>
        nb = nb + 1
        <span class="kw">for</span> v, t <span class="kw">in</span> G[u]:
            <span class="kw">if</span> <span class="kw">not</span> fixe[v] <span class="kw">and</span> d[u] + t &lt; d[v]:
                d[v] = d[u] + t</pre>
    <p><strong>D3.</strong> A* fixe 5 stations avant l'université (dans l'ordre 0, 1, 2, 4, 3), l'algorithme de Dijkstra 9 (dans l'ordre 0, 7, 8, 1, 2, 9, 3, 4, 5), et les deux trouvent 28 minutes. Les stations 7, 8 et 9 sont à l'opposé de l'université : proches de la gare, l'algorithme de Dijkstra les examine en premier, alors que pour A* leur estimation <span class="code-inline">d[v] + h[v]</span> (au moins 31 minutes) dépasse la durée du meilleur trajet. Sur un vrai réseau, le gain est bien plus important.</p>
