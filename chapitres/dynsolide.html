  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">La dynamique relie le <strong>mouvement</strong> d'un solide aux <strong>actions mécaniques</strong> qui le provoquent. Elle répond aux deux questions de tout dimensionnement : quel couple ou quel effort faut-il pour obtenir un mouvement donné (choix d'un moteur, d'un vérin, des paliers) ; quel mouvement résulte d'efforts connus (démarrage, freinage, oscillation). Le programme de sciences industrielles la place au semestre <strong>S3</strong>, au début de la 2ᵉ année. Ce chapitre en donne une <strong>introduction</strong> limitée aux mouvements plans (translation, rotation autour d'un axe fixe, mouvement plan d'un solide) ; il prolonge <a href="#statique/cours">« Statique »</a>, dont il reprend les notations, et prépare <a href="#dyn2a/cours">« Cinétique et dynamique du solide (3D) »</a>, qui reprend tout dans l'espace. Le volet énergétique (énergie cinétique d'un ensemble, puissances, théorème de l'énergie cinétique, inertie équivalente, rendement) est traité dans <a href="#energsi/cours">« Énergétique des systèmes »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités du programme, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Déterminer les caractéristiques d'un solide ou d'un ensemble de solides indéformables</strong> (B2, S3) : solide indéformable, repère lié, volume et masse, centre d'inertie (§1) ; moment d'inertie par rapport à un axe, théorème de Huygens, solides composés (§2, §3) ; matrice d'inertie, en aperçu (§4).</li>
        <li><strong>Torseurs cinétique et dynamique</strong> d'un solide par rapport à un référentiel galiléen (C2, S3) : cas de la translation, de la rotation autour d'un axe fixe et du mouvement plan (§5, §6).</li>
        <li><strong>Principe fondamental de la dynamique</strong> en référentiel galiléen, principe des actions réciproques (C2, S3) (§7).</li>
        <li><strong>Déterminer les actions mécaniques en dynamique quand le mouvement est imposé</strong> (C2, S3) : actions dans un pivot (§8), couple moteur pour une loi de mouvement en trapèze (§9), action de contact d'une roue (§10).</li>
        <li><strong>Déterminer la loi de mouvement quand les efforts sont connus</strong> (C2, S3) : équation différentielle du mouvement et sa résolution (§8, §10).</li>

      </ul>
      <p>Non évalué : les calculs intégraux des éléments d'inertie (centre d'inertie, matrice d'inertie). Les intégrales du chapitre expliquent d'où viennent les résultats ; aux concours, les valeurs sont données par l'énoncé ou lues dans le modeleur 3D. Vus en 2ᵉ année seulement : les torseurs cinétique et dynamique d'un solide quelconque en 3D, le théorème de Huygens généralisé, l'équilibrage des rotors (fin de chapitre).</p>

  <div class="prop-box"><strong>Notations du chapitre</strong>, communes à « Cinématique », « Statique » et à la 2ᵉ année : \(\vec V(A, S/\mathcal R)\) vitesse du point \(A\) du solide \(S\) (notée aussi \(\vec v(A\in S/\mathcal R)\)), \(\vec\Gamma(A, S/\mathcal R)\) son accélération (notée \(\vec a\) en cinématique), \(\vec\Omega(S/\mathcal R)\) vecteur rotation, \(\{\mathcal V(S/\mathcal R)\}\) torseur cinématique ; \(\{\mathcal T(1\to2)\}\) torseur d'une action mécanique, de résultante \(\vec R(1\to2)\) et de moment \(\vec M(A, 1\to2)\) ; \(J_\Delta\) moment d'inertie par rapport à l'axe \(\Delta\) (noté aussi \(I_\Delta\) en 2ᵉ année). Pour une rotation d'angle \(\theta\) autour d'un axe fixe, \(\omega = \dot\theta\) et \(\dot\omega = \ddot\theta\).</div>

<div class="course-section">
  <div class="sec-num">§1 · MASSE ET CENTRE D'INERTIE</div>
  <h2>Où se trouve la matière ?</h2>
  <div class="intro">Pour mettre une pièce en mouvement, il ne suffit pas de connaître sa géométrie : il faut savoir combien de matière elle contient et où cette matière se trouve. Le premier niveau de description est la <strong>masse</strong> et le point qui « porte » la translation, le <strong>centre d'inertie</strong>. Ce sont aussi les données qu'un modeleur 3D affiche dans les propriétés de masse d'une pièce.</div>
  <div class="def-box"><strong>Solide indéformable et repère lié.</strong> Un solide indéformable est un ensemble de points dont les distances mutuelles restent constantes. On peut lui attacher un repère dans lequel tous ses points sont immobiles : décrire le mouvement du solide revient à décrire celui de ce repère (équivalence solide/repère). C'est dans ce repère lié que la répartition de la matière se décrit par des grandeurs constantes : masse, position du centre d'inertie, moments d'inertie.</div>
  <div class="def-box"><strong>Masse.</strong> Pour un ensemble de pièces de masses \(m_i\), \(m = \sum_i m_i\). Pour un solide continu, on associe à chaque point \(M\) un élément de masse \(\mathrm dm\) : volumique \(\rho\,\mathrm dV\) (pièce massive), surfacique \(\sigma\,\mathrm dS\) (tôle, plaque mince) ou linéique \(\lambda\,\mathrm d\ell\) (tige, câble).
    <div class="formula" data-nom="Masse d'un solide">$$m = \int_S \mathrm dm = \iiint_V \rho(M)\,\mathrm dV \qquad \text{(solide homogène : } m = \rho\,V\text{)}$$</div>
    La masse d'un solide (système fermé) est constante au cours du mouvement.</div>
  <div class="def-box"><strong>Centre d'inertie.</strong> Le centre d'inertie \(G\) d'un solide \(S\) est le point tel que \(\int_S \overrightarrow{GM}\,\mathrm dm = \vec 0\). Pour tout point \(O\) :
    <div class="formula" data-nom="Centre d'inertie">$$\overrightarrow{OG} = \frac1m\int_S \overrightarrow{OM}\,\mathrm dm \qquad\text{et, pour un ensemble de pièces : }\ \overrightarrow{OG} = \frac1m\sum_i m_i\,\overrightarrow{OG_i}$$</div>
    Dans un champ de pesanteur uniforme, \(G\) est aussi le centre de gravité : le point d'application du poids.</div>
  <div class="prop-box"><strong>Propriétés utiles.</strong>
    <ul>
      <li><strong>Symétrie</strong> : si le solide possède un plan, un axe ou un centre de symétrie <em>matérielle</em> (géométrie et répartition des masses), \(G\) lui appartient.</li>
      <li><strong>Associativité</strong> : le centre d'inertie d'un ensemble est le barycentre des centres d'inertie \(G_i\) de ses pièces, affectés de leurs masses \(m_i\).</li>
      <li><strong>Évidement</strong> : un trou se compte comme une masse négative. Pour un solide plein \((m_p, G_p)\) dont on retire la matière \((m_t, G_t)\) :
      <div class="formula">$$\overrightarrow{OG} = \frac{m_p\,\overrightarrow{OG_p} - m_t\,\overrightarrow{OG_t}}{m_p - m_t}$$</div></li>
    </ul></div>

  <div class="method-box"><strong>Exemple — le centre d'inertie d'un bras de robot</strong>
    <ol>
      <li>Le bras de la figure est horizontal. L'axe \(\vec x\) part de l'axe d'articulation \(O\). Tube : \(m_1 = 4\ \text{kg}\), \(x_{G_1} = 0{,}35\ \text{m}\) ; moteur du coude : \(m_2 = 2{,}5\ \text{kg}\), \(x_{G_2} = 0{,}70\ \text{m}\) ; pince : \(m_3 = 1{,}5\ \text{kg}\), \(x_{G_3} = 0{,}85\ \text{m}\). Les trois centres sont sur l'axe du tube.</li>
      <li>Masse totale : \(m = 4 + 2{,}5 + 1{,}5 = 8\ \text{kg}\).</li>
      <li>Barycentre : \(x_G = \dfrac{4\times0{,}35 + 2{,}5\times0{,}70 + 1{,}5\times0{,}85}{8} = \dfrac{4{,}425}{8} \approx 0{,}553\ \text{m}\).</li>
      <li>\(G\) est bien plus loin que le milieu du tube : le moteur du coude et la pince, lourds et éloignés, l'attirent. C'est pour cela qu'on place les moteurs le plus près possible de l'épaule (ou qu'on les déporte par des courroies) : le moteur de l'épaule doit retenir le poids \(mg\) appliqué en \(G\).</li>
    </ol></div>
  <div class="method-box"><strong>Exemple — un volant percé n'est plus centré</strong>
    <ol>
      <li>Un volant plein (disque d'acier de rayon \(0{,}15\ \text{m}\), masse \(m_p = 6\ \text{kg}\)) est percé d'un trou de rayon \(2\ \text{cm}\) dont le centre est à \(d = 0{,}10\ \text{m}\) de l'axe.</li>
      <li>Masse enlevée, proportionnelle à l'aire : \(m_t = 6\times(0{,}02/0{,}15)^2 \approx 0{,}107\ \text{kg}\).</li>
      <li>Excentration de \(G\), du côté opposé au trou : \(e = \dfrac{m_t\,d}{m_p - m_t} = \dfrac{0{,}107\times0{,}10}{5{,}89} \approx 1{,}8\ \text{mm}\).</li>
      <li>Moins de deux millimètres : cela paraît négligeable, mais en rotation rapide ce décalage crée un effort tournant dans les paliers (§8 et fin de chapitre). On équilibre les rotors pour ramener \(G\) sur l'axe.</li>
    </ol></div>
  <p><strong>Ordres de grandeur des masses volumiques</strong> : acier \(7{,}85\cdot10^3\ \text{kg/m}^3\), fonte \(7{,}2\cdot10^3\), laiton \(8{,}5\cdot10^3\), alliage d'aluminium \(2{,}7\cdot10^3\), polymères techniques \(1{,}0\) à \(1{,}4\cdot10^3\ \text{kg/m}^3\).</p>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la symétrie géométrique à une pièce qui n'est pas homogène (insert en laiton dans une pièce plastique, moteur fixé d'un seul côté). Seule compte la symétrie de la répartition des masses.</div>

<div class="course-section">
  <div class="sec-num">§2 · MOMENT D'INERTIE PAR RAPPORT À UN AXE</div>
  <h2>La « masse » de la rotation</h2>
  <div class="intro">Un même couple ne fait pas tourner de la même façon deux pièces de même masse : celle dont la matière est loin de l'axe accélère moins. Le <strong>moment d'inertie</strong> mesure cette résistance à la mise en rotation ; il joue pour la rotation le rôle de la masse pour la translation.</div>
  <div class="def-box"><strong>Moment d'inertie.</strong> Le moment d'inertie du solide \(S\) par rapport à l'axe \(\Delta\) est
    <div class="formula" data-nom="Moment d'inertie">$$J_\Delta = \int_S d(M,\Delta)^2\,\mathrm dm$$</div>
    où \(d(M,\Delta)\) est la distance du point \(M\) à l'axe. Il s'exprime en \(\text{kg·m}^2\), il est toujours positif et il dépend de l'axe choisi. Le <strong>rayon de giration</strong> \(k\), défini par \(J_\Delta = m\,k^2\), est la distance à laquelle il faudrait concentrer toute la masse pour obtenir la même inertie.</div>
  <p>Chaque élément de matière compte avec le <strong>carré</strong> de sa distance à l'axe : un gramme à 10 cm de l'axe pèse autant dans \(J_\Delta\) que 100 g à 1 cm. D'où les jantes, les volants à couronne épaisse et, à l'inverse, les rotors longs et minces des servomoteurs rapides.</p>
  <table>
    <tr><th>Solide homogène de masse \(m\)</th><th>Axe passant par \(G\)</th><th>\(J_G\)</th></tr>
    <tr><td>point matériel à la distance \(r\)</td><td>quelconque</td><td>\(m r^2\)</td></tr>
    <tr><td>anneau, tube mince de rayon \(R\)</td><td>son axe</td><td>\(m R^2\)</td></tr>
    <tr><td>disque, cylindre plein de rayon \(R\)</td><td>son axe</td><td>\(\tfrac12 m R^2\)</td></tr>
    <tr><td>cylindre creux de rayons \(R\) et \(r\)</td><td>son axe</td><td>\(\tfrac12 m (R^2 + r^2)\)</td></tr>
    <tr><td>sphère pleine de rayon \(R\)</td><td>un diamètre</td><td>\(\tfrac25 m R^2\)</td></tr>
    <tr><td>sphère creuse mince de rayon \(R\)</td><td>un diamètre</td><td>\(\tfrac23 m R^2\)</td></tr>
    <tr><td>tige mince de longueur \(L\)</td><td>perpendiculaire, au milieu</td><td>\(\tfrac1{12} m L^2\)</td></tr>
    <tr><td>pavé \(a\times b\times c\)</td><td>parallèle à l'arête \(c\)</td><td>\(\tfrac1{12} m (a^2 + b^2)\)</td></tr>
  </table>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le disque plein : pourquoi \(\tfrac12 mR^2\) ?</span>
    <div class="content"><p>On découpe le disque (masse \(m\), rayon \(R\), masse surfacique \(\sigma = m/(\pi R^2)\)) en anneaux de rayon \(r\) et d'épaisseur \(\mathrm dr\) : chacun a la masse \(\mathrm dm = \sigma\,2\pi r\,\mathrm dr = \dfrac{2m\,r}{R^2}\,\mathrm dr\) et tous ses points sont à la distance \(r\) de l'axe. Donc</p>
    <div class="formula">$$J_G = \int_0^R r^2\,\frac{2m\,r}{R^2}\,\mathrm dr = \frac{2m}{R^2}\cdot\frac{R^4}{4} = \frac12\,m R^2$$</div>
    <p>La moitié de l'inertie d'un anneau de même masse : la matière proche de l'axe ne compte presque pas. Ce calcul intégral n'est pas exigible ; il faut retenir le résultat et son sens physique.</p></div>
  </div>

<figcaption>Même masse, même rayon, inerties différentes. Le rayon de giration \(k\), défini par \(J_\Delta = m k^2\), est la distance à laquelle il faudrait concentrer toute la masse pour avoir la même inertie : \(R/\sqrt2\) pour le disque plein, presque \(R\) pour une jante dont la matière est en périphérie.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — disque plein ou jante ?</strong>
    <ol>
      <li>Deux volants ont la même masse \(m = 20\ \text{kg}\) et le même rayon \(R = 0{,}25\ \text{m}\) : un disque plein, et une jante dont presque toute la matière est en périphérie (assimilée à un anneau).</li>
      <li>Disque : \(J = \tfrac12\times20\times0{,}25^2 = 0{,}625\ \text{kg·m}^2\) ; jante : \(J \approx 20\times0{,}25^2 = 1{,}25\ \text{kg·m}^2\).</li>
      <li>Sous un couple de \(10\ \text{N·m}\) (loi \(J\dot\omega = C\), §8), le disque accélère à \(16\ \text{rad/s}^2\), la jante à \(8\ \text{rad/s}^2\) seulement. Pour un volant de régulation, qui doit résister aux variations de vitesse, la jante est deux fois plus efficace à masse égale.</li>
    </ol></div>
  <div class="method-box"><strong>Exemple — ordre de grandeur d'un rotor de moteur</strong>
    <ol>
      <li>Rotor assimilé à un cylindre plein d'acier de diamètre 60 mm et de longueur 100 mm.</li>
      <li>Masse : \(m = \rho\,\pi R^2 L = 7\,850\times\pi\times0{,}03^2\times0{,}1 \approx 2{,}22\ \text{kg}\).</li>
      <li>Inertie : \(J = \tfrac12 m R^2 = 0{,}5\times2{,}22\times0{,}03^2 \approx 1{,}0\cdot10^{-3}\ \text{kg·m}^2\).</li>
      <li>Repères : rotor de servomoteur de quelques centaines de watts, \(10^{-5}\) à \(10^{-3}\ \text{kg·m}^2\) ; roue de voiture, environ \(1\ \text{kg·m}^2\) ; volant moteur de voiture, \(0{,}1\) à \(0{,}2\ \text{kg·m}^2\).</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : prendre le diamètre pour le rayon (inertie multipliée par 4), ou un tableau d'inertie « en \(G\) » pour un axe qui ne passe pas par \(G\) : il faut alors le théorème de Huygens (§3).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · THÉORÈME DE HUYGENS ET SOLIDES COMPOSÉS</div>
  <h2>Changer d'axe, assembler des pièces</h2>
  <div class="intro">Les tables donnent les inerties autour d'axes passant par le centre d'inertie. Une pièce réelle tourne souvent autour d'un autre axe (un bras autour de son épaule) et se compose de plusieurs formes simples. Deux outils suffisent : le théorème de Huygens et l'additivité.</div>
  <div class="prop-box"><strong>Théorème de Huygens.</strong> Soit \(\Delta_G\) un axe passant par \(G\) et \(\Delta\) un axe <strong>parallèle</strong> à \(\Delta_G\), à la distance \(d\). Alors
    <div class="formula" data-nom="Théorème de Huygens">$$J_\Delta = J_{G} + m\,d^2$$</div>
    où \(J_G\) est le moment d'inertie par rapport à \(\Delta_G\). Pour une direction donnée, l'inertie est donc minimale autour de l'axe qui passe par \(G\).</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi n'y a-t-il pas de terme croisé ?</span>
    <div class="content"><p>On prend les deux axes parallèles à \(\vec z\) et on projette dans le plan \((\vec x, \vec y)\) : la distance d'un point \(M\) à \(\Delta\) est la norme de \(\vec\rho = \vec d + \vec\rho_G\), où \(\vec d\) va de \(\Delta\) à \(\Delta_G\) et \(\vec\rho_G\) de \(\Delta_G\) à \(M\) (vecteurs du plan). Donc</p>
    <div class="formula">$$J_\Delta = \int_S \left(d^2 + 2\,\vec d\cdot\vec\rho_G + \rho_G^2\right)\mathrm dm = m\,d^2 + 2\,\vec d\cdot\int_S \vec\rho_G\,\mathrm dm + J_G$$</div>
    <p>L'intégrale du milieu est la projection dans le plan de \(\int_S \overrightarrow{GM}\,\mathrm dm\), nulle par définition de \(G\).</p></div>
  </div>
  <div class="prop-box"><strong>Additivité.</strong> Le moment d'inertie d'un ensemble par rapport à un axe est la somme des moments d'inertie de ses pièces <strong>par rapport à ce même axe</strong> : on transporte chaque inertie sur l'axe commun par Huygens, puis on additionne. Un évidement se retranche.</div>
  <div class="method-box"><strong>Exemple — l'inertie du bras de robot autour de son épaule</strong>
    <ol>
      <li>Données du §1, axe \(\Delta = (O,\vec z)\). Le tube (\(m_1 = 4\ \text{kg}\), longueur \(L = 0{,}80\ \text{m}\)) est une tige mince : \(J_{G_1} = m_1 L^2/12 \approx 0{,}213\ \text{kg·m}^2\) ; Huygens avec \(d_1 = 0{,}35\ \text{m}\) : \(J_1 = 0{,}213 + 4\times0{,}35^2 \approx 0{,}703\ \text{kg·m}^2\).</li>
      <li>Le moteur du coude, cylindre de rayon 5 cm d'axe parallèle à \(\Delta\) : \(J_{G_2} = \tfrac12\times2{,}5\times0{,}05^2 \approx 0{,}003\), et \(J_2 = 0{,}003 + 2{,}5\times0{,}70^2 \approx 1{,}228\ \text{kg·m}^2\).</li>
      <li>La pince, assimilée à un point : \(J_3 = 1{,}5\times0{,}85^2 \approx 1{,}084\ \text{kg·m}^2\).</li>
      <li>Total : \(J_O \approx 0{,}703 + 1{,}228 + 1{,}084 \approx 3{,}02\ \text{kg·m}^2\). Le tube, qui porte la moitié de la masse, ne fait que 23 % de l'inertie ; le moteur et la pince, éloignés, font le reste. L'inertie propre du moteur (\(0{,}003\)) est négligeable devant le terme de Huygens.</li>
    </ol></div>
  <div class="method-box"><strong>Exemple — une poulie allégée</strong>
    <ol>
      <li>Poulie en alliage d'aluminium (\(\rho = 2\,700\ \text{kg/m}^3\)) : disque de rayon \(0{,}20\ \text{m}\), d'épaisseur \(20\ \text{mm}\), percé de quatre trous de rayon \(4\ \text{cm}\) centrés à \(0{,}12\ \text{m}\) de l'axe.</li>
      <li>Disque plein : \(m_p = 2\,700\times\pi\times0{,}2^2\times0{,}02 \approx 6{,}79\ \text{kg}\), \(J_p = \tfrac12 m_p\times0{,}2^2 \approx 0{,}136\ \text{kg·m}^2\).</li>
      <li>Un trou : \(m_t \approx 0{,}271\ \text{kg}\) et, par Huygens, \(J_t = \tfrac12 m_t\times0{,}04^2 + m_t\times0{,}12^2 \approx 4{,}1\cdot10^{-3}\ \text{kg·m}^2\).</li>
      <li>Poulie percée : \(J = 0{,}136 - 4\times0{,}0041 \approx 0{,}119\ \text{kg·m}^2\). On a retiré 16 % de la masse mais seulement 12 % de l'inertie : la matière enlevée était plutôt près de l'axe. Pour réduire l'inertie, il faut alléger la périphérie.</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer Huygens entre deux axes qui ne passent ni l'un ni l'autre par \(G\). Le théorème relie toujours un axe quelconque à l'axe parallèle passant par \(G\) : pour aller de \(\Delta_1\) à \(\Delta_2\), on revient d'abord en \(G\) (retrancher \(m d_1^2\)), puis on ajoute \(m d_2^2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · OPÉRATEUR ET MATRICE D'INERTIE : APERÇU</div>
  <h2>Toute l'inertie autour d'un point</h2>
  <div class="intro">Un seul moment d'inertie suffit tant que le solide tourne autour d'un axe fixe. Dans l'espace, l'axe de rotation peut changer de direction : il faut connaître l'inertie autour de <strong>toutes</strong> les directions passant par un point. Elle tient dans une matrice symétrique \(3\times3\), que la 2ᵉ année exploite pleinement. On en donne ici le sens et les règles de lecture.</div>
  <div class="def-box"><strong>Opérateur et matrice d'inertie.</strong> L'opérateur d'inertie du solide \(S\) au point \(O\) est l'application linéaire
    <div class="formula" data-nom="Opérateur d'inertie">$$\overline{\overline{I}}(O,S) : \vec u \longmapsto \int_S \overrightarrow{OM}\wedge\left(\vec u\wedge\overrightarrow{OM}\right)\mathrm dm$$</div> Dans une base \((\vec x,\vec y,\vec z)\), avec \(\overrightarrow{OM} = x\,\vec x + y\,\vec y + z\,\vec z\), il est représenté par la matrice symétrique
    <div class="formula" data-nom="Matrice d'inertie">$$[I(O,S)] = \begin{bmatrix} A & -F & -E \\ -F & B & -D \\ -E & -D & C \end{bmatrix}_{(\vec x,\vec y,\vec z)}$$</div>
    <div class="formula">$$A = \int_S (y^2+z^2)\,\mathrm dm,\quad B = \int_S (z^2+x^2)\,\mathrm dm,\quad C = \int_S (x^2+y^2)\,\mathrm dm$$</div>
    <div class="formula">$$D = \int_S y\,z\,\mathrm dm,\qquad E = \int_S z\,x\,\mathrm dm,\qquad F = \int_S x\,y\,\mathrm dm$$</div>
    \(A\), \(B\), \(C\) sont les moments d'inertie par rapport aux axes \((O,\vec x)\), \((O,\vec y)\), \((O,\vec z)\) ; \(D\), \(E\), \(F\) sont les <strong>produits d'inertie</strong>, de signe quelconque.</div>
  <div class="prop-box"><strong>Moment d'inertie autour d'un axe quelconque.</strong> Pour l'axe \(\Delta = (O,\vec u)\), \(\vec u\) unitaire de composantes \(\{u\}\) :
    <div class="formula" data-nom="Moment d'inertie et matrice">$$J_\Delta = \vec u\cdot\overline{\overline{I}}(O,S)\,\vec u = \{u\}^{T}\,[I(O,S)]\,\{u\}$$</div></div>
  <div class="prop-box"><strong>Lire la matrice sur les symétries.</strong>
    <ul>
      <li>Un <strong>plan de symétrie</strong> matérielle passant par \(O\) annule les deux produits d'inertie qui contiennent la coordonnée normale à ce plan (plan \((O,\vec x,\vec y)\) : \(D = E = 0\)) ; l'axe normal au plan est alors <strong>axe principal</strong>.</li>
      <li>Deux plans de symétrie orthogonaux : les trois produits sont nuls, la matrice est diagonale.</li>
      <li>Axe de révolution \((O,\vec z)\) : matrice diagonale et \(A = B\).</li>
      <li>Plaque mince dans le plan \((O,\vec x,\vec y)\) : \(z = 0\), donc \(D = E = 0\) et \(C = A + B\).</li>
    </ul></div>
  <div class="method-box"><strong>Exemple — un panneau qui tourne autour de sa diagonale</strong>
    <ol>
      <li>Plaque mince rectangulaire \(a\times b = 0{,}6\times0{,}4\ \text{m}\), \(m = 3\ \text{kg}\), axes \(\vec x\), \(\vec y\) parallèles aux côtés en \(G\). Deux plans de symétrie : matrice diagonale, avec \(A = m b^2/12 = 0{,}04\), \(B = m a^2/12 = 0{,}09\) et \(C = A + B = 0{,}13\ \text{kg·m}^2\).</li>
      <li>La diagonale a pour direction \(\vec u = (a\,\vec x + b\,\vec y)/\sqrt{a^2+b^2}\).</li>
      <li>Produit matriciel : 
      <div class="formula">$$J_\Delta = \{u\}^{T}[I]\{u\} = \frac{A\,a^2 + B\,b^2}{a^2 + b^2} = \frac{0{,}04\times0{,}36 + 0{,}09\times0{,}16}{0{,}52} \approx 0{,}055\ \text{kg·m}^2$$</div></li>
      <li>Contrôle : la valeur est comprise entre \(A\) et \(B\), les inerties extrêmes dans le plan de la plaque.</li>
    </ol></div>
  <p><strong>Ce qui sert en 1ʳᵉ année.</strong> Dans tous les problèmes plans de ce chapitre, le solide tourne autour d'un axe \(\vec z\) normal à un plan de symétrie (ou se comporte comme tel) : seul le terme \(C = J_\Delta\) intervient. Les produits d'inertie \(D\) et \(E\) d'une pièce mal symétrique produisent des moments transversaux, donc des efforts tournants dans les paliers : c'est l'objet de l'équilibrage, en 2ᵉ année.</p>
  <div class="notice"><strong>Erreur classique</strong> : oublier que la matrice dépend du <strong>point</strong> et de la <strong>base</strong>. Une matrice donnée en \(G\) ne s'utilise pas telle quelle en \(O\) ; la transporter demande le théorème de Huygens généralisé (2ᵉ année).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · TORSEUR CINÉTIQUE</div>
  <h2>Quantité de mouvement et moment cinétique</h2>
  <div class="intro">Le torseur cinétique rassemble la quantité de mouvement du solide (sa résultante) et son moment cinétique (son moment). Il combine la cinématique (le torseur \(\{\mathcal V\}\)) et la répartition des masses (\(m\), \(G\), inerties). Dans les cas plans, il se réduit à deux formules simples.</div>
  <div class="def-box"><strong>Torseur cinétique.</strong> Pour un solide \(S\) en mouvement par rapport au référentiel \(\mathcal R\), en un point \(A\) :
    <div class="formula" data-nom="Torseur cinétique">$$\{\mathcal C(S/\mathcal R)\} = \begin{Bmatrix} \vec p(S/\mathcal R) = \displaystyle\int_S \vec V(M/\mathcal R)\,\mathrm dm \\ \vec\sigma(A, S/\mathcal R) = \displaystyle\int_S \overrightarrow{AM}\wedge\vec V(M/\mathcal R)\,\mathrm dm \end{Bmatrix}_A$$</div>
    La résultante \(\vec p\) est la quantité de mouvement (\(\text{kg·m/s}\)), le moment \(\vec\sigma(A)\) le moment cinétique en \(A\) (\(\text{kg·m}^2\text{/s}\)). Comme tout torseur : \(\vec\sigma(B) = \vec\sigma(A) + \overrightarrow{BA}\wedge\vec p\).</div>
  <div class="prop-box"><strong>Résultante cinétique.</strong> En dérivant \(\int_S \overrightarrow{OM}\,\mathrm dm = m\,\overrightarrow{OG}\) (masse constante) :
    <div class="formula" data-nom="Quantité de mouvement">$$\vec p(S/\mathcal R) = m\,\vec V(G, S/\mathcal R)$$</div>
    Tout se passe, pour la résultante, comme si la masse était concentrée en \(G\).</div>
  <div class="prop-box"><strong>Moment cinétique dans les cas plans.</strong> Le solide a un plan de symétrie perpendiculaire à \(\vec z\), et \(\vec\Omega(S/\mathcal R) = \omega\,\vec z\).
    <ul>
      <li><strong>Translation</strong> (\(\omega = 0\)) : \(\vec\sigma(G) = \vec 0\), donc \(\vec\sigma(A) = \overrightarrow{AG}\wedge m\,\vec V(G)\).</li>
      <li><strong>Rotation autour de l'axe fixe</strong> \(\Delta = (O,\vec z)\) : \(\vec\sigma(O, S/\mathcal R) = J_\Delta\,\omega\,\vec z\).</li>
      <li><strong>Mouvement plan</strong> quelconque : \(\vec\sigma(G, S/\mathcal R) = J_G\,\omega\,\vec z\), puis \(\vec\sigma(A) = J_G\,\omega\,\vec z + \overrightarrow{AG}\wedge m\,\vec V(G)\).</li>
    </ul>
    Sans plan de symétrie, ces formules restent vraies <strong>en projection</strong> sur \(\vec z\) : \(\vec\sigma(O)\cdot\vec z = J_\Delta\,\omega\) ; les composantes transversales, dues aux produits d'inertie, sont étudiées en 2ᵉ année.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Rotation autour d'un axe fixe : \(\vec\sigma(O)\cdot\vec z = J_\Delta\,\omega\)</span>
    <div class="content"><p>Un point \(M\) du solide, à la distance \(r\) de l'axe, décrit un cercle à la vitesse \(r\omega\), perpendiculaire au rayon. Le moment de sa quantité de mouvement \(\mathrm dm\,\vec V(M)\) par rapport à l'axe vaut \(r\times r\omega\,\mathrm dm\) (bras de levier \(r\)). En sommant : \(\vec\sigma(O)\cdot\vec z = \omega\int_S r^2\,\mathrm dm = J_\Delta\,\omega\).</p></div>
  </div>
  <div class="method-box"><strong>Exemple — une roue de vélo qui roule</strong>
    <ol>
      <li>Roue : \(m = 1{,}2\ \text{kg}\), rayon \(R = 0{,}34\ \text{m}\), \(J_G = 0{,}10\ \text{kg·m}^2\) (la jante porte l'essentiel de la masse : \(k = \sqrt{J_G/m} \approx 0{,}85\,R\)). Elle roule sans glisser à \(v = 5\ \text{m/s}\) vers \(+\vec x\), donc tourne à \(\omega = -v/R \approx -14{,}7\ \text{rad/s}\) autour de \(\vec z\) (sens horaire, \(\vec z\) vers le lecteur).</li>
      <li>Quantité de mouvement : \(\vec p = m v\,\vec x = 6{,}0\,\vec x\ \text{kg·m/s}\).</li>
      <li>Moment cinétique en \(G\) : \(\vec\sigma(G) = J_G\,\omega\,\vec z \approx -1{,}47\,\vec z\ \text{kg·m}^2\text{/s}\).</li>
      <li>Au point de contact \(I\), avec \(\overrightarrow{IG} = R\,\vec y\) :
      <div class="formula">$$\vec\sigma(I) = \vec\sigma(G) + \overrightarrow{IG}\wedge\vec p = -1{,}47\,\vec z - m v R\,\vec z \approx -3{,}51\,\vec z$$</div> C'est \((J_G + mR^2)\,\omega\,\vec z\) : le moment cinétique dépend du point, et l'on retrouve Huygens.</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\vec\sigma(A) = J_A\,\vec\Omega\) en un point \(A\) quelconque. La formule « inertie × rotation » ne vaut qu'en \(G\) ou en un point du solide <strong>fixe</strong> dans \(\mathcal R\) ; ailleurs, on calcule en \(G\) et on transporte.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TORSEUR DYNAMIQUE</div>
  <h2>Quantité d'accélération et moment dynamique</h2>
  <div class="intro">Le torseur dynamique est celui qui apparaît dans le principe fondamental : il mesure ce qu'il faut d'actions extérieures pour produire le mouvement. On ne le calcule presque jamais par sa définition, mais en dérivant le torseur cinétique.</div>
  <div class="def-box"><strong>Torseur dynamique.</strong> En un point \(A\) :
    <div class="formula" data-nom="Torseur dynamique">$$\{\mathcal D(S/\mathcal R)\} = \begin{Bmatrix} m\,\vec\Gamma(G, S/\mathcal R) \\ \vec\delta(A, S/\mathcal R) = \displaystyle\int_S \overrightarrow{AM}\wedge\vec\Gamma(M/\mathcal R)\,\mathrm dm \end{Bmatrix}_A$$</div>
    La résultante dynamique vaut \(m\,\vec\Gamma(G)\) (en N) ; le moment dynamique \(\vec\delta(A)\) s'exprime en N·m et se transporte comme un moment : \(\vec\delta(B) = \vec\delta(A) + \overrightarrow{BA}\wedge m\,\vec\Gamma(G)\).</div>
  <div class="prop-box"><strong>Moment dynamique et moment cinétique.</strong> Si \(A = G\) ou si \(A\) est <strong>fixe</strong> dans \(\mathcal R\) :
    <div class="formula" data-nom="Moment dynamique">$$\vec\delta(A, S/\mathcal R) = \left.\frac{\mathrm d\vec\sigma(A, S/\mathcal R)}{\mathrm dt}\right|_{\mathcal R}$$</div>
    En rotation autour de l'axe fixe \((O,\vec z)\) : \(\vec\delta(O)\cdot\vec z = J_\Delta\,\dot\omega\). En mouvement plan : \(\vec\delta(G)\cdot\vec z = J_G\,\dot\omega\). En translation : \(\vec\delta(G) = \vec 0\).</div>
  <div class="prop-box"><strong>Accélération du centre d'inertie en rotation.</strong> Pour un solide 1 en rotation d'angle \(\theta = (\vec x_0, \vec x_1)\) autour de l'axe fixe \((O, \vec z_0)\), avec \(\overrightarrow{OG} = a\,\vec x_1\) : \(\vec V(G, 1/0) = a\omega\,\vec y_1\), et comme \(\dfrac{\mathrm d\vec y_1}{\mathrm dt}\Big|_0 = -\omega\,\vec x_1\),
    <div class="formula" data-nom="Accélération en rotation">$$\vec\Gamma(G, 1/0) = a\,\dot\omega\,\vec y_1 - a\,\omega^2\,\vec x_1$$</div>
    une composante tangentielle (nulle à vitesse constante) et une composante normale, dirigée vers l'axe (présente dès que le solide tourne).</div>

<div class="course-section">
  <div class="sec-num">§7 · PRINCIPE FONDAMENTAL DE LA DYNAMIQUE</div>
  <h2>Des actions au mouvement</h2>
  <div class="intro">Le principe fondamental de la dynamique (PFD) généralise celui de la statique : au lieu d'un torseur des actions extérieures nul, il l'égale au torseur dynamique. La démarche d'isolement est la même ; il faut seulement ajouter les termes « d'inertie ».</div>
  <div class="def-box"><strong>Référentiel galiléen.</strong> Le principe fondamental s'applique dans des référentiels dits galiléens ; tout référentiel en translation rectiligne uniforme par rapport à l'un d'eux l'est aussi. En sciences industrielles, le bâti (lié à la Terre) est considéré comme galiléen : la rotation de la Terre (\(7{,}3\cdot10^{-5}\ \text{rad/s}\)) produit des effets négligeables devant les accélérations des mécanismes.</div>
  <div class="prop-box"><strong>Principe fondamental de la dynamique.</strong> Pour tout ensemble matériel \(E\), dans un référentiel galiléen \(\mathcal R_g\), les deux torseurs étant écrits au même point :
    <div class="formula" data-nom="Principe fondamental de la dynamique">$$\{\mathcal D(E/\mathcal R_g)\} = \{\mathcal T(\bar E\to E)\}$$</div>
    <div class="formula" data-nom="Théorèmes de la résultante et du moment dynamiques">$$m\,\vec\Gamma(G, E/\mathcal R_g) = \vec R(\bar E\to E) \qquad \vec\delta(A, E/\mathcal R_g) = \vec M(A, \bar E\to E)\ \ \text{pour tout point } A$$</div>
    C'est 6 équations scalaires dans l'espace, 3 pour un problème plan. La statique en est le cas particulier \(\{\mathcal D\} = \{0\}\).</div>
  <div class="prop-box"><strong>Actions réciproques.</strong> Le PFD appliqué à \(E_1\), à \(E_2\) et à \(E_1\cup E_2\) donne \(\{\mathcal T(E_1\to E_2)\} = -\{\mathcal T(E_2\to E_1)\}\) : les actions intérieures à l'ensemble isolé disparaissent de son bilan, exactement comme en statique.</div>
  <h3>Démarche</h3>
  <ol>
    <li><strong>Graphe et paramètres</strong> : liaisons, paramètres du mouvement (angles, positions), référentiel galiléen.</li>
    <li><strong>Isolement et bilan</strong> des actions extérieures (poids, liaisons, moteurs, frottements), comme en statique.</li>
    <li><strong>Torseur dynamique</strong> de l'ensemble isolé, écrit au point choisi (somme sur ses solides).</li>
    <li><strong>Équations utiles</strong> : on choisit le point (où passent beaucoup d'inconnues, ou \(G\), ou un point fixe) et la direction de projection (celle de la mobilité, pour éliminer les inconnues de liaison).</li>
  </ol>
  <p>Deux familles de problèmes : le <strong>mouvement est imposé</strong> (cahier des charges : on connaît \(\theta(t)\) ou \(x(t)\)) et l'on cherche les efforts, couple moteur ou actions dans les liaisons ; les <strong>efforts sont connus</strong> et l'on cherche la loi de mouvement, solution d'une équation différentielle.</p>
  <div class="method-box"><strong>Exemple — le report de charge d'un chariot qui accélère</strong>
    <ol>
      <li>Un chariot de \(m = 150\ \text{kg}\) roule sur deux galets \(A\) (arrière) et \(B\) (avant), d'empattement \(L = 1{,}0\ \text{m}\), \(G\) au milieu et à la hauteur \(h = 0{,}60\ \text{m}\) du rail. Un vérin le pousse vers l'avant (\(\vec x\)) par une force horizontale \(F\) appliquée à \(h_F = 0{,}20\ \text{m}\) du rail. Galets sans frottement ni résistance au roulement : actions verticales \(N_A\), \(N_B\). Accélération voulue : \(2\ \text{m/s}^2\).</li>
      <li>On isole le chariot, en translation : \(m\,\vec\Gamma(G) = m\ddot x\,\vec x\) et \(\vec\delta(G) = \vec 0\).</li>
      <li>Résultante selon \(\vec x\) : \(F = m\ddot x = 300\ \text{N}\) ; selon \(\vec y\) : \(N_A + N_B = mg \approx 1\,472\ \text{N}\).</li>
      <li>Moment en \(G\) selon \(\vec z\) (nul en translation) : \((N_B - N_A)\dfrac L2 + F\,(h - h_F) = 0\), d'où \(N_A - N_B = \dfrac{2F(h-h_F)}{L} = 240\ \text{N}\).</li>
      <li>\(N_A \approx 856\ \text{N}\) et \(N_B \approx 616\ \text{N}\), contre 736 N chacun à l'arrêt : l'accélération charge l'arrière. C'est l'effet qu'on ressent dans une voiture qui démarre (et l'inverse au freinage).</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : écrire « somme des moments = 0 » en un point autre que \(G\) pour un solide en translation accélérée. En un point \(A\), \(\vec\delta(A) = \overrightarrow{AG}\wedge m\,\vec\Gamma(G)\) n'est pas nul ; en \(G\), il l'est. Le plus sûr : écrire les moments en \(G\), ou transporter correctement \(\vec\delta\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ROTATION AUTOUR D'UN AXE FIXE</div>
  <h2>Loi de mouvement et actions dans le pivot</h2>
  <div class="intro">Rotors, broches, tambours, bras, portes : la rotation autour d'un axe fixe est le cas le plus fréquent. Le PFD s'y découpe en deux : une équation sur l'axe, qui donne la loi de mouvement (ou le couple moteur), et des équations transversales, qui donnent les efforts dans les paliers.</div>
  <div class="prop-box"><strong>Équation du mouvement.</strong> Solide 1 en liaison pivot d'axe \(\Delta = (O,\vec z_0)\) avec le bâti 0 galiléen. Le moment sur l'axe d'un pivot <strong>parfait</strong> est nul ; le TMD en \(O\), projeté sur \(\vec z_0\), donne
    <div class="formula" data-nom="Rotation autour d'un axe fixe">$$J_\Delta\,\dot\omega = J_\Delta\,\ddot\theta = M_\Delta(\bar 1\to1)$$</div>
    où \(M_\Delta = \vec M(O, \bar 1\to1)\cdot\vec z_0\) est la somme des moments par rapport à l'axe des actions extérieures autres que le pivot (couple moteur, couple résistant, moment du poids…). En physique, ce moment se note \(\mathcal M_\Delta\) : c'est le théorème scalaire du moment cinétique.</div>
  <div class="prop-box"><strong>Actions dans le pivot.</strong> Le théorème de la résultante dynamique, avec l'accélération du §6, donne la résultante de l'action du pivot :
    <div class="formula">$$\vec R(0\to1) = m\left(a\,\dot\omega\,\vec y_1 - a\,\omega^2\,\vec x_1\right) - \vec R(\text{autres actions}\to1)$$</div>
    Si \(G\) est sur l'axe (\(a = 0\), rotor <strong>équilibré</strong>), le pivot ne porte que les efforts statiques ; sinon, il fournit en plus un effort \(m a\omega^2\) qui tourne avec le solide : vibrations, bruit, usure des roulements.</div>
  <div class="method-box"><strong>Exemple — bras de robot à axe vertical : couple et efforts</strong>
    <ol>
      <li>Le bras des §1 et §3 tourne cette fois autour d'un axe <strong>vertical</strong> (robot de type SCARA) : le poids, parallèle à l'axe, n'a pas de moment sur lui. Données : \(J_O \approx 3{,}02\ \text{kg·m}^2\), \(m = 8\ \text{kg}\), \(a \approx 0{,}553\ \text{m}\). On néglige les frottements.</li>
      <li>Couple moteur pour accélérer à \(\dot\omega = 6\ \text{rad/s}^2\) : \(C = J_O\,\dot\omega \approx 18{,}1\ \text{N·m}\).</li>
      <li>En rotation à \(3\ \text{rad/s}\) constants : couple nul (pas de frottement), mais le pivot exerce sur le bras un effort horizontal \(m a\omega^2 \approx 39{,}8\ \text{N}\), dirigé de \(G\) vers l'axe, en plus de l'effort vertical \(mg \approx 78{,}5\ \text{N}\) qui porte le bras.</li>
    </ol></div>
  <div class="method-box"><strong>Exemple — loi de mouvement : un tambour qui s'arrête</strong>
    <ol>
      <li>Le tambour d'une machine à laver (\(J = 0{,}60\ \text{kg·m}^2\)) tourne à 1 200 tr/min, soit \(\omega_0 \approx 125{,}7\ \text{rad/s}\), quand on coupe le moteur. Il subit un couple de frottement sec \(C_f = 0{,}80\ \text{N·m}\) (joints, roulements) et un frottement visqueux \(f_v\,\omega\), \(f_v = 0{,}010\ \text{N·m·s/rad}\).</li>
      <li>Équation : \(J\dot\omega = -C_f - f_v\,\omega\), soit \(\tau\,\dot\omega + \omega = -C_f/f_v\) avec \(\tau = J/f_v = 60\ \text{s}\) et \(C_f/f_v = 80\ \text{rad/s}\).</li>
      <li>Solution : \(\omega(t) = (\omega_0 + 80)\,e^{-t/\tau} - 80\), tant que \(\omega \gt 0\). Arrêt pour \(e^{-t/\tau} = 80/205{,}7\), soit \(t_a = 60\ln(2{,}571) \approx 57\ \text{s}\), après environ 480 tours.</li>
      <li>Avec le seul frottement sec, l'arrêt prendrait \(J\omega_0/C_f \approx 94\ \text{s}\) ; avec le seul visqueux, la vitesse ne ferait que décroître exponentiellement, sans arrêt en un temps fini. Le modèle de frottement change la loi de mouvement : on le choisit d'après les essais.</li>
    </ol></div>
  <p>Le cas où le poids a un moment sur l'axe (axe horizontal, \(G\) hors de l'axe) est le <strong>pendule pesant</strong> : \(J_\Delta\,\ddot\theta = -m g a\sin\theta\), traité en physique (<a href="#mvtsolide/cours">« Mouvement d'un solide »</a>, §6 et §7) et animé dans l'onglet Simulateur de ce chapitre.</p>
  <div class="notice"><strong>Erreur classique</strong> : compter le moment de l'action du pivot dans l'équation sur l'axe. Pour un pivot parfait, il est nul par définition ; un pivot réel se modélise par un couple de frottement, à écrire explicitement.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · MOUVEMENT IMPOSÉ : LOI EN TRAPÈZE ET COUPLE MOTEUR</div>
  <h2>Dimensionner l'actionneur d'un axe</h2>
  <div class="intro">Un axe de machine (table tournante, bras, chariot) doit faire un déplacement donné en un temps donné. Le cahier des charges impose la <strong>loi de mouvement</strong> ; le PFD donne le couple que le moteur doit fournir à chaque instant. La loi la plus courante est le trapèze de vitesse.</div>
  <div class="def-box"><strong>Loi en trapèze de vitesse.</strong> Accélération constante \(\dot\omega_a\) pendant \(t_a\), palier à \(\omega_{max}\), décélération constante pendant \(t_d\). Pour un profil symétrique (\(t_d = t_a\)) de durée totale \(T\) et d'amplitude \(\theta_t\) :
    <div class="formula" data-nom="Loi en trapèze">$$\omega_{max} = \frac{\theta_t}{T - t_a}\qquad \dot\omega_a = \frac{\omega_{max}}{t_a}$$</div>
    (l'aire sous le trapèze vaut l'angle parcouru). Sans palier, \(t_a = T/2\) : c'est la loi en triangle.</div>
  <div class="prop-box"><strong>Couple moteur.</strong> Pour un solide en rotation autour d'un axe fixe, entraîné directement par le moteur et freiné par un couple résistant \(C_r\) :
    <div class="formula" data-nom="Couple moteur sur un cycle">$$C_m(t) = J_\Delta\,\dot\omega(t) + C_r$$</div>
    Il est constant par morceaux : grand pendant l'accélération, égal à \(C_r\) en palier, négatif (freinage) pendant la décélération si \(J_\Delta\dot\omega_a \gt C_r\).</div>

</figure>
  <div class="method-box"><strong>Exemple — table d'indexage</strong>
    <ol>
      <li>Une table tournante (\(J = 1{,}8\ \text{kg·m}^2\) avec ses pièces), entraînée directement par un moteur couple, doit tourner d'un quart de tour (\(\theta_t = \pi/2\)) en \(T = 0{,}5\ \text{s}\), avec \(t_a = t_d = 0{,}125\ \text{s}\). Frottements des guidages : \(C_r = 2\ \text{N·m}\).</li>
      <li>Vitesse de palier : \(\omega_{max} = \dfrac{\pi/2}{0{,}5 - 0{,}125} \approx 4{,}19\ \text{rad/s}\) (40 tr/min) ; accélération : \(\dot\omega_a = 4{,}19/0{,}125 \approx 33{,}5\ \text{rad/s}^2\).</li>
      <li>Couples : accélération \(1{,}8\times33{,}5 + 2 \approx 62{,}3\ \text{N·m}\) ; palier \(2\ \text{N·m}\) ; décélération \(-60{,}3 + 2 \approx -58{,}3\ \text{N·m}\). Le moteur doit savoir freiner.</li>
      <li>Puissance crête, en fin d'accélération : \(62{,}3\times4{,}19 \approx 261\ \text{W}\). Avec une loi en triangle (\(t_a = 0{,}25\ \text{s}\)), le couple tombe à \(47{,}2\ \text{N·m}\) mais la vitesse monte à \(6{,}28\ \text{rad/s}\) et la puissance crête à 297 W.</li>
    </ol></div>
  <p><strong>Choisir \(t_a\).</strong> À durée \(T\) fixée, raccourcir l'accélération augmente le couple ; l'allonger augmente la vitesse maximale. Pour une charge purement inertielle, la puissance crête vaut \(J\,\dot\omega_a\,\omega_{max} = J\theta_t^2/\big[t_a\,(T - t_a)^2\big]\) : elle est minimale pour \(t_a = t_d = T/3\) (profil « en trois tiers »). Le choix du moteur à partir de ce cycle (couple crête, échauffement, rapport de réduction) est traité dans <a href="#energsi/cours">« Énergétique des systèmes »</a>, §9.</p>
  <div class="notice"><strong>Erreur classique</strong> : dimensionner le moteur sur le couple de palier, ou sur la seule puissance moyenne. Sur un axe rapide, c'est l'accélération des inerties qui fixe le couple crête : trente fois le couple résistant dans l'exemple de la table.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · MOUVEMENT PLAN : ROULER OU GLISSER</div>
  <h2>Un solide qui tourne et se déplace</h2>
  <div class="intro">Roue, galet, cylindre, yo-yo : le solide se translate et tourne à la fois. Le PFD donne trois équations (deux de résultante, une de moment en \(G\)) ; le contact avec le sol ajoute deux inconnues et une condition, rouler sans glisser ou glisser.</div>
  <div class="prop-box"><strong>Équations d'un solide en mouvement plan.</strong> Avec \(\vec\Omega = \omega\,\vec z\) et \(\vec z\) normal à un plan de symétrie :
    <div class="formula" data-nom="Mouvement plan">$$m\,\vec\Gamma(G) = \vec R(\bar S\to S) \qquad J_G\,\dot\omega = \vec M(G, \bar S\to S)\cdot\vec z$$</div></div>
  <div class="prop-box"><strong>Contact ponctuel en \(I\) avec un sol fixe.</strong> Deux inconnues : \(N\) (normale, \(N \geq 0\)) et \(T\) (tangentielle). Deux situations (lois de Coulomb, « Statique », §10) :
    <ul>
      <li><strong>roulement sans glissement</strong> : \(\vec V(I, S/\text{sol}) = \vec 0\), relation cinématique entre \(v_G\) et \(\omega\) (\(|v_G| = R\,|\omega|\) pour une roue de rayon \(R\)), à condition que \(|T| \leq f\,N\) ;</li>
      <li><strong>glissement</strong> : \(|T| = f\,N\), \(\vec T\) opposée à la vitesse de glissement ; \(v_G\) et \(\omega\) sont indépendants.</li>
    </ul>
    Méthode : on suppose le roulement sans glissement, on calcule \(T\) et \(N\), puis on vérifie \(|T| \leq fN\) ; si c'est faux, on reprend avec le glissement.</div>

<figcaption>Cylindre de centre \(G\) sur un plan incliné d'un angle \(\alpha\). Le plan agit au point de contact \(I\) par une composante normale \(\vec N\) et une composante tangentielle \(\vec T\) (adhérence), dirigée vers le haut de la pente : c'est elle qui fait tourner le cylindre. Sans \(\vec T\), il glisserait sans tourner.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — un cylindre plein sur un plan incliné</strong>
    <ol>
      <li>Cylindre plein (\(J_G = \tfrac12 m R^2\)) lâché sur un plan incliné de \(\alpha = 30°\), coefficient de frottement \(f = 0{,}2\). Axe \(\vec x\) descendant le long de la pente, \(\omega\) compté dans le sens où le cylindre tourne en descendant.</li>
      <li>Hypothèse de roulement sans glissement : \(\ddot x = R\,\dot\omega\).</li>
      <li>Résultante selon \(\vec x\) : \(m\ddot x = mg\sin\alpha - T\) ; selon la normale : \(N = mg\cos\alpha\). Moment en \(G\) : \(J_G\,\dot\omega = T R\) (seule \(\vec T\) a un moment en \(G\)).</li>
      <li>D'où \(T = \dfrac{J_G}{R^2}\ddot x = \tfrac12 m\ddot x\), puis \(\ddot x = \tfrac23 g\sin\alpha \approx 3{,}27\ \text{m/s}^2\) et \(T = \tfrac13 mg\sin\alpha\).</li>
      <li>Vérification : \(T/N = \tfrac13\tan\alpha \approx 0{,}19 \leq f = 0{,}2\) : le cylindre roule bien. Il roule tant que \(\tan\alpha \leq 3f\), soit \(\alpha \leq 31°\). À \(35°\), il glisse : \(T = f\,mg\cos\alpha\) et \(\ddot x = g(\sin\alpha - f\cos\alpha) \approx 4{,}02\ \text{m/s}^2\), tandis que \(R\dot\omega = 2fg\cos\alpha \approx 3{,}21\ \text{m/s}^2\) ne suit plus.</li>
    </ol></div>
  <p>Le théorème de l'énergie cinétique donne l'accélération du cas roulant plus vite (« Énergétique des systèmes », §10), car l'action de contact ne travaille pas ; mais seul le PFD donne \(T\), donc la condition de non-glissement.</p>
  <div class="method-box"><strong>Exemple — l'adhérence limite l'accélération d'un robot</strong>
    <ol>
      <li>Robot mobile de 20 kg posé sur deux roues motrices (rayon \(0{,}05\ \text{m}\), \(J = 2\cdot10^{-4}\ \text{kg·m}^2\) chacune), qui portent tout son poids ; \(f = 0{,}6\).</li>
      <li>L'effort qui propulse le robot est la somme des actions tangentielles du sol : \(m\ddot x = 2T \leq f\,mg\), d'où \(\ddot x_{max} = f g \approx 5{,}9\ \text{m/s}^2\), quel que soit le moteur.</li>
      <li>Pour \(\ddot x = 3\ \text{m/s}^2\) : \(T = 30\ \text{N}\) par roue (\(T/N \approx 0{,}31\)) et, par le moment en \(G\) de chaque roue, \(C = T R + J\,\ddot x/R \approx 1{,}50 + 0{,}012 \approx 1{,}51\ \text{N·m}\) par moteur.</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(T = f N\) sans savoir si le solide glisse. Tant qu'il roule sans glisser, \(T\) est une inconnue, donnée par le PFD, et \(fN\) n'est que sa limite.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · STRATÉGIE : QUEL ISOLEMENT, QUELLE ÉQUATION ?</div>
  <h2>Résoudre un mécanisme à plusieurs solides</h2>
  <div class="intro">Dès que le mécanisme compte deux solides, la question n'est plus « comment écrire le PFD » mais « sur quoi l'écrire ». Un bon isolement fait apparaître l'inconnue cherchée et le moins possible d'autres.</div>
  <table>
    <tr><th>Je cherche…</th><th>J'isole…</th><th>J'écris…</th></tr>
    <tr><td>le couple moteur d'une liaison pivot, ou la loi de mouvement de son angle</td><td>tout ce qui est en aval de cette pivot</td><td>le moment dynamique sur l'axe de la pivot</td></tr>
    <tr><td>l'effort d'un vérin le long d'une glissière</td><td>tout ce qui est en aval de la glissière</td><td>la résultante dynamique selon la direction de la glissière</td></tr>
    <tr><td>une action intérieure (tension d'un câble, effort dans une liaison)</td><td>un sous-ensemble dont elle devient une action extérieure</td><td>l'équation qui la contient avec le moins d'autres inconnues</td></tr>
    <tr><td>la loi de mouvement d'un mécanisme à un paramètre, sans les efforts de liaison</td><td>tout le mécanisme mobile</td><td>le théorème de l'énergie cinétique (« Énergétique des systèmes »)</td></tr>
  </table>

<figcaption>Le tambour 1 (rayon \(R\), moment d'inertie \(J_t\)), entraîné par le couple moteur \(C\), enroule le câble qui tire le chariot 2. La tension \(\vec T\) est une action intérieure au système {tambour, câble, chariot} : pour la calculer, il faut isoler le chariot seul.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — un chariot tiré par un treuil</strong>
    <ol>
      <li>Un tambour 1 (rayon \(R = 0{,}08\ \text{m}\), \(J_t = 0{,}05\ \text{kg·m}^2\), pivot parfait), entraîné par un couple \(C\), enroule un câble inextensible qui tire un chariot 2 de \(120\ \text{kg}\) sur un rail horizontal. Résistance au roulement du chariot : \(F_r = 40\ \text{N}\). On veut une accélération \(\ddot x = 0{,}5\ \text{m/s}^2\) et on cherche \(C\) et la tension \(T\).</li>
      <li>Isolement du chariot (translation) : \(m\ddot x = T - F_r\), d'où \(T = 40 + 60 = 100\ \text{N}\).</li>
      <li>Isolement du tambour, moment sur son axe : \(J_t\,\dot\omega = C - T R\) avec \(\dot\omega = \ddot x/R = 6{,}25\ \text{rad/s}^2\), d'où \(C = 0{,}05\times6{,}25 + 100\times0{,}08 \approx 8{,}31\ \text{N·m}\).</li>
      <li>En palier (vitesse constante), \(C = F_r R = 3{,}2\ \text{N·m}\) : l'accélération multiplie le couple par 2,6.</li>
      <li>Si seul \(C\) est demandé, le théorème de l'énergie cinétique appliqué à l'ensemble donne directement \((J_t + mR^2)\,\dot\omega = C - F_r R\), soit la même valeur, sans la tension (« Énergétique des systèmes », §6).</li>
    </ol></div>
  <div class="notice"><strong>Erreur classique</strong> : isoler tout le mécanisme pour calculer la tension du câble. Elle est intérieure à l'ensemble et n'apparaît dans aucune de ses équations ; il faut couper le câble, c'est-à-dire isoler le chariot (ou le tambour) seul.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · 2ᵉ ANNÉE</div>
  <h2>Ce que la 2ᵉ année ajoute</h2>
  <div class="intro">Le chapitre <a href="#dyn2a/cours">« Cinétique et dynamique du solide (3D) »</a> reprend tout ce qui précède pour un solide quelconque dans l'espace. Quelques résultats, pour situer ce qui vient.</div>
  <ul>
    <li><strong>Moment cinétique en 3D</strong> : \(\vec\sigma(G) = \overline{\overline{I}}(G,S)\,\vec\Omega\), qui n'est colinéaire à \(\vec\Omega\) que si \(\vec\Omega\) est porté par un axe principal d'inertie. Sinon, le moment dynamique a des composantes transversales que les paliers doivent fournir.</li>
    <li><strong>Équilibrage</strong> : un rotor est parfaitement équilibré si son axe de rotation est axe principal central d'inertie (\(G\) sur l'axe et produits d'inertie nuls). Un balourd \(m e\) crée un effort tournant \(m e\,\omega^2\) : pour le volant percé du §1 (\(m e \approx 1{,}07\cdot10^{-2}\ \text{kg·m}\)), à 1 500 tr/min, \(F \approx 263\ \text{N}\), quatre fois et demie son poids.</li>
    <li><strong>Théorème de Huygens généralisé</strong> (transport de toute la matrice) et dérivation des vecteurs dans une base mobile.</li>
    <li><strong>Linéarisation</strong> autour d'une position d'équilibre ou d'un point de fonctionnement, qui fait le lien avec les systèmes asservis (fonction de transfert d'un axe).</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · DYNAMIQUE DU SOLIDE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : décrire la répartition des masses (§1 à §4), écrire les torseurs cinétique et dynamique (§5, §6), appliquer le principe fondamental quand le mouvement est imposé ou quand les efforts sont connus (§7 à §11). Chacune se termine par un exemple court, chiffré et vérifié. L'approche par les énergies (théorème de l'énergie cinétique, inertie équivalente) a ses propres méthodes dans « Énergétique des systèmes ».</div>

  <div class="method-box">
    <strong>Méthode 1 — Déterminer le centre d'inertie d'un solide composé</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Découper.</span> Décomposer la pièce en formes simples dont on connaît la masse et le centre d'inertie ; un trou compte comme une masse négative.</li>
      <li><span class="step">Symétries.</span> Repérer les plans ou axes de symétrie matérielle : \(G\) leur appartient, ce qui économise des coordonnées.</li>
      <li><span class="step">Barycentre.</span> Coordonnée par coordonnée : \(x_G = \sum_i m_i\,x_{G_i} / \sum_i m_i\) (pour une pièce homogène d'épaisseur constante, les masses sont proportionnelles aux aires).</li>
      <li><span class="step">Contrôle.</span> \(G\) est attiré vers les parties lourdes ; il peut se trouver hors de la matière.</li>
    </ol>
    <p><em>Exemple éclair :</em> équerre en tôle formée d'une aile de \(200\times40\ \text{mm}\) (\(0 \le x \le 200\), \(0 \le y \le 40\)) et d'une aile de \(40\times160\ \text{mm}\) (\(0 \le x \le 40\), \(40 \le y \le 200\)). Aires 8 000 et 6 400 mm² : \(x_G = (8\,000\times100 + 6\,400\times20)/14\,400 \approx 64{,}4\ \text{mm}\) et, par symétrie par rapport à la bissectrice, \(y_G = x_G\). Le point \((64{,}4\ ;\ 64{,}4)\) est dans le creux de l'équerre, hors de la matière.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Calculer un moment d'inertie avec le théorème de Huygens</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Axe commun.</span> Fixer l'axe \(\Delta\) autour duquel on veut l'inertie (l'axe de rotation réel).</li>
      <li><span class="step">Inerties propres.</span> Pour chaque pièce, lire \(J_{G_i}\) dans le tableau, autour de l'axe parallèle à \(\Delta\) passant par \(G_i\).</li>
      <li><span class="step">Transport.</span> \(J_{\Delta,i} = J_{G_i} + m_i\,d_i^2\), \(d_i\) distance de \(G_i\) à \(\Delta\).</li>
      <li><span class="step">Somme.</span> Additionner (retrancher les évidements). Contrôle : chaque terme de Huygens est positif, et l'inertie propre d'une petite pièce éloignée est souvent négligeable devant \(m_i\,d_i^2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> balancier formé d'une tige de 0,5 kg et de 1 m, articulée à une extrémité, et d'un disque de 1 kg et de rayon 0,1 m dont le centre est à l'autre extrémité (axe du disque parallèle à l'axe de rotation). tige \(\tfrac13\times0{,}5\times1^2 \approx 0{,}167\), disque \(\tfrac12\times1\times0{,}1^2 + 1\times1^2 = 1{,}005\), d'où \(J_O \approx 1{,}17\ \text{kg·m}^2\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Lire une matrice d'inertie et en tirer l'inertie autour d'un axe</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Point et base.</span> Vérifier en quel point et dans quelle base la matrice est donnée.</li>
      <li><span class="step">Symétries.</span> Un plan de symétrie annule les deux produits d'inertie contenant la coordonnée normale au plan ; un axe de révolution donne une matrice diagonale avec deux moments égaux.</li>
      <li><span class="step">Axe.</span> Écrire le vecteur unitaire \(\vec u\) de l'axe dans la base de la matrice, puis \(J_\Delta = \{u\}^{T}[I]\{u\}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> cylindre plein (\(m = 4\ \text{kg}\), \(R = 0{,}05\ \text{m}\), \(L = 0{,}3\ \text{m}\)), axe de révolution \(\vec z\) : en \(G\), \(A = B = mR^2/4 + mL^2/12 = 0{,}0325\) et \(C = mR^2/2 = 0{,}005\ \text{kg·m}^2\). Autour d'un axe passant par \(G\), incliné de 30° sur \(\vec z\) dans le plan \((\vec x, \vec z)\) : \(J = A\sin^2 30° + C\cos^2 30° \approx 0{,}0119\ \text{kg·m}^2\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Écrire les torseurs cinétique et dynamique dans un cas plan</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Nature du mouvement.</span> Translation, rotation autour d'un axe fixe, ou mouvement plan quelconque.</li>
      <li><span class="step">Bon point.</span> Écrire les moments en \(G\), ou en un point du solide fixe dans le référentiel : \(\vec\sigma = J\,\omega\,\vec z\) et \(\vec\delta = J\,\dot\omega\,\vec z\) (projection sur \(\vec z\) en l'absence de symétrie).</li>
      <li><span class="step">Résultantes.</span> \(\vec p = m\vec V(G)\) et \(m\vec\Gamma(G)\) ; en rotation, \(\vec\Gamma(G) = a\dot\omega\,\vec y_1 - a\omega^2\,\vec x_1\).</li>
      <li><span class="step">Transport.</span> Ailleurs : \(\vec\delta(B) = \vec\delta(G) + \overrightarrow{BG}\wedge m\vec\Gamma(G)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> disque (\(m = 2\ \text{kg}\), \(R = 0{,}1\ \text{m}\), \(J_G = 0{,}01\ \text{kg·m}^2\)) qui roule sans glisser en accélérant à \(1\ \text{m/s}^2\) : \(m\Gamma(G) = 2\ \text{N}\), \(|\vec\delta(G)| = J_G\,|\dot\omega| = 0{,}01\times10 = 0{,}1\ \text{N·m}\), et au point de contact \(|\vec\delta(I)| = (J_G + mR^2)\,|\dot\omega| = 0{,}3\ \text{N·m}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Appliquer le principe fondamental de la dynamique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Modèle.</span> Graphe des liaisons, paramètres du mouvement, référentiel galiléen (le bâti).</li>
      <li><span class="step">Isolement.</span> Choisir l'ensemble isolé ; dresser le bilan des actions extérieures (poids, liaisons, moteurs, frottements) comme en statique.</li>
      <li><span class="step">Bilan.</span> Compter les inconnues et les équations utiles (3 en plan, 6 dans l'espace).</li>
      <li><span class="step">Équations.</span> \(m\vec\Gamma(G) = \vec R_{ext}\) et \(\vec\delta(A) = \vec M(A)_{ext}\) au même point ; projeter selon les mobilités pour éliminer les inconnues des liaisons parfaites.</li>
      <li><span class="step">Contrôle.</span> Retrouver la statique quand les accélérations sont nulles ; vérifier les unités et les signes.</li>
    </ol>
    <p><em>Exemple éclair :</em> un vérin vertical soulève un chariot de 50 kg guidé sans frottement, avec une accélération de \(2\ \text{m/s}^2\) vers le haut. Résultante selon la verticale : \(F - mg = m\ddot z\), d'où \(F = 50\times(9{,}81 + 2) \approx 591\ \text{N}\), 20 % de plus qu'à l'équilibre.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Calculer le couple moteur pour un mouvement imposé</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Inertie.</span> Calculer \(J_\Delta\) de tout ce qui tourne avec l'axe (méthode 2).</li>
      <li><span class="step">Loi de mouvement.</span> Découper le cycle en phases et calculer \(\dot\omega\) dans chacune (trapèze : \(\omega_{max} = \theta_t/(T - t_a)\), \(\dot\omega = \omega_{max}/t_a\)).</li>
      <li><span class="step">Équation sur l'axe.</span> \(C_m = J_\Delta\,\dot\omega + C_r - M_{\Delta,\text{autres}}\) (couple résistant, moment du poids…), phase par phase.</li>
      <li><span class="step">Bilan.</span> Couple crête (le plus grand \(|C_m|\)), vitesse maximale, puissance crête \(C_m\,\omega\) en fin d'accélération ; repérer les phases de freinage (\(C_m \lt 0\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> broche de machine-outil (\(J = 0{,}02\ \text{kg·m}^2\), couple résistant \(0{,}5\ \text{N·m}\)) lancée de 0 à 6 000 tr/min (\(628\ \text{rad/s}\)) en 2 s : \(\dot\omega \approx 314\ \text{rad/s}^2\), \(C_m = 0{,}02\times314 + 0{,}5 \approx 6{,}8\ \text{N·m}\), puissance crête \(\approx 4{,}3\ \text{kW}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Déterminer les actions dans un pivot en dynamique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Isoler</span> le solide en rotation (et ce qu'il porte) ; inconnues : composantes de la résultante du pivot (et ses moments transversaux en 3D).</li>
      <li><span class="step">Accélération de \(G\).</span> \(\vec\Gamma(G) = a\dot\omega\,\vec y_1 - a\omega^2\,\vec x_1\) dans la base liée au solide.</li>
      <li><span class="step">Résultante.</span> \(\vec R(0\to1) = m\vec\Gamma(G) - \) résultante des autres actions (poids, efforts de travail).</li>
      <li><span class="step">Interpréter.</span> Les termes en \(\omega^2\) tournent avec le solide : effort périodique, vibrations ; ils disparaissent si \(G\) est sur l'axe.</li>
    </ol>
    <p><em>Exemple éclair :</em> rotor de 12 kg dont le centre d'inertie est à \(e = 0{,}5\ \text{mm}\) de l'axe, à 3 000 tr/min (\(314\ \text{rad/s}\)) : effort tournant \(m e\,\omega^2 = 12\times5\cdot10^{-4}\times314^2 \approx 592\ \text{N}\), cinq fois le poids du rotor.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Établir et résoudre la loi de mouvement quand les efforts sont connus</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Équation.</span> Projeter le principe fondamental sur la mobilité : \(J_\Delta\,\dot\omega = \sum M_\Delta\) ou \(m\ddot x = \sum F_x\).</li>
      <li><span class="step">Reconnaître la forme.</span> Couple constant : \(\dot\omega\) constante, \(\omega\) affine, \(\theta\) parabolique. Frottement visqueux : premier ordre \(\tau\,\dot\omega + \omega = \omega_\infty\), avec \(\tau = J/f_v\). Rappel élastique ou pesant : oscillateur.</li>
      <li><span class="step">Conditions initiales</span> et résolution ; vérifier la cohérence (signe de la vitesse, arrêt éventuel avec un frottement sec).</li>
      <li><span class="step">Contrôle.</span> Valeur finale (\(\dot\omega = 0\) : équilibre des couples) et ordre de grandeur de la durée.</li>
    </ol>
    <p><em>Exemple éclair :</em> ventilateur (\(J = 0{,}05\ \text{kg·m}^2\)) lancé par un couple constant de \(0{,}6\ \text{N·m}\) contre un frottement visqueux \(f_v = 2\cdot10^{-3}\ \text{N·m·s/rad}\) : \(\omega_\infty = 0{,}6/0{,}002 = 300\ \text{rad/s}\), \(\tau = J/f_v = 25\ \text{s}\) ; 95 % de la vitesse finale au bout de \(3\tau = 75\ \text{s}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Traiter un contact roulant : rouler sans glisser ou glisser</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Hypothèse.</span> Supposer le roulement sans glissement : relation \(\vec V(I, S/\text{sol}) = \vec 0\) entre \(v_G\) et \(\omega\) ; inconnues de contact \(N\) et \(T\).</li>
      <li><span class="step">Équations.</span> Résultante (deux composantes) et moment en \(G\) : trois équations pour \(\ddot x\), \(N\), \(T\).</li>
      <li><span class="step">Vérification.</span> \(N \geq 0\) et \(|T| \leq f\,N\).</li>
      <li><span class="step">Sinon.</span> Glissement : \(|T| = fN\), opposée à la vitesse de glissement ; \(\ddot x\) et \(\dot\omega\) deviennent indépendants ; refaire le calcul.</li>
    </ol>
    <p><em>Exemple éclair :</em> anneau (\(J_G = mR^2\)) sur une pente de 25°, \(f = 0{,}25\). Roulement : \(\ddot x = \tfrac12 g\sin\alpha \approx 2{,}07\ \text{m/s}^2\) et \(T = m\ddot x\), d'où \(T/N = \tfrac12\tan\alpha \approx 0{,}23 \leq 0{,}25\) : l'anneau roule, de justesse.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Choisir ses isolements dans un mécanisme à plusieurs solides</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cible.</span> Écrire ce que l'on cherche : couple moteur, effort d'un vérin, tension, action d'une liaison, loi de mouvement.</li>
      <li><span class="step">Isolement.</span> Choisir un ensemble dont l'inconnue est une action <strong>extérieure</strong>, et qui en contient le moins d'autres : en aval d'une pivot pour son couple, d'une glissière pour son effort ; couper le câble pour sa tension.</li>
      <li><span class="step">Équation.</span> Celle qui contient l'inconnue sans les inconnues de liaison (projection sur la mobilité).</li>
      <li><span class="step">Raccourci.</span> Si seule la loi de mouvement (ou le couple moteur) est demandée et que les liaisons sont parfaites : théorème de l'énergie cinétique sur tout le mécanisme.</li>
    </ol>
    <p><em>Exemple éclair :</em> monte-charge de chantier : cabine de 400 kg suspendue à un câble enroulé sur un tambour (\(R = 0{,}2\ \text{m}\), \(J = 3\ \text{kg·m}^2\)) ; montée avec \(a = 0{,}5\ \text{m/s}^2\). Cabine seule : \(T = m(g + a) \approx 4\,124\ \text{N}\). Tambour seul, moment sur l'axe : \(C = J\,a/R + T R \approx 7{,}5 + 825 \approx 832\ \text{N·m}\).</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong>
    <ul>
      <li>Écrire \(\vec\sigma(A) = J_A\,\vec\Omega\) ou \(\vec\delta(A) = J_A\,\dot\omega\,\vec z\) en un point \(A\) qui n'est ni \(G\) ni un point fixe du solide.</li>
      <li>Écrire « somme des moments nulle » en un point quelconque pour un solide en translation accélérée : c'est vrai en \(G\) seulement.</li>
      <li>Oublier l'accélération normale \(a\omega^2\) à vitesse de rotation constante : le pivot la fournit dès que \(G\) n'est pas sur l'axe.</li>
      <li>Appliquer Huygens entre deux axes qui ne passent pas par \(G\), ou entre deux axes non parallèles.</li>
      <li>Écrire \(T = fN\) pour une roue qui roule sans glisser : \(T\) est alors une inconnue, et \(fN\) seulement sa borne.</li>
      <li>Chercher une action intérieure (tension d'un câble, effort entre deux pièces) en isolant l'ensemble qui la contient.</li>
      <li>Laisser des tr/min dans \(J\dot\omega\) ou \(C\omega\) : \(\omega = \pi N/30\) en rad/s.</li>
    </ul>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Moments d'inertie d'un disque — théorème de Huygens</h3>
  <div class="statement">On considère un disque plein homogène de masse \(m = 2\ \text{kg}\) et de rayon \(R = 0{,}1\ \text{m}\), d'épaisseur négligeable.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(J_G\), moment d'inertie par rapport à l'axe central (passant par \(G\), perpendiculaire au disque).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(J_O\) par rapport à un axe parallèle au précédent et tangent au bord du disque.</div>
  <div class="q"><strong>Q3.</strong> Quel couple constant faut-il pour lancer le disque de 0 à \(10\ \text{rad/s}\) en 2 s, autour de son axe central, puis autour de l'axe tangent (frottements négligés) ?</div>
  <div class="q"><strong>Q4.</strong> Donner la forme de la matrice d'inertie du disque en \(G\), dans une base dont \(\vec z\) est l'axe central, et en déduire le moment d'inertie par rapport à un diamètre (pour un disque mince, \(C = A + B\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tableau du cours : \(J_G = \tfrac12 mR^2 = \tfrac12\times2\times0{,}1^2 = 0{,}01\ \text{kg·m}^2\).</p>
    <p><strong>Q2.</strong> L'axe tangent est parallèle à l'axe central, à la distance \(d = R\). Huygens : \(J_O = J_G + mR^2\), soit \(0{,}01 + 0{,}02 = 0{,}03\ \text{kg·m}^2\), trois fois plus.</p>
    <p><strong>Q3.</strong> Accélération angulaire constante \(\dot\omega = 10/2 = 5\ \text{rad/s}^2\). Rotation autour d'un axe fixe : \(C = J\dot\omega\), soit \(0{,}05\ \text{N·m}\) autour de l'axe central et \(0{,}15\ \text{N·m}\) autour de l'axe tangent. Le même disque est trois fois plus « lourd » à faire tourner autour d'un axe excentré.</p>
    <p><strong>Q4.</strong> L'axe \(\vec z\) est axe de révolution matérielle : la matrice est diagonale, avec \(A = B\). Disque mince : \(C = A + B = 2A\), d'où \(A = B = C/2 = \tfrac14 mR^2 = 0{,}005\ \text{kg·m}^2\) : c'est le moment d'inertie autour de n'importe quel diamètre.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Pendule pesant — barre uniforme</h3>
  <div class="statement">Une barre homogène de masse \(m = 0{,}5\ \text{kg}\) et de longueur \(L = 1\ \text{m}\) est articulée à une extrémité \(O\) sur un pivot parfait d'axe horizontal. Elle est lâchée sans vitesse initiale à \(\theta_0 = 5°\) de la verticale descendante ; \(\theta\) est l'angle de la barre avec cette verticale. On prend \(g = 9{,}81\ \text{m/s}^2\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(J_O\) et la pulsation des petites oscillations \(\omega_0\).</div>
  <div class="q"><strong>Q2.</strong> Écrire l'équation du mouvement (moment dynamique en \(O\) sur l'axe) et sa solution pour les petites oscillations.</div>
  <div class="q"><strong>Q3.</strong> En multipliant l'équation du mouvement par \(\dot\theta\), obtenir une intégrale première et en déduire la vitesse angulaire au passage par la verticale.</div>
  <div class="q"><strong>Q4.</strong> Quelle est alors l'action du pivot sur la barre ? Comparer au poids.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Barre articulée à une extrémité : \(J_O = mL^2/3 = 1/6 \approx 0{,}167\ \text{kg·m}^2\) ; \(G\) est au milieu, \(a = OG = 0{,}5\ \text{m}\). Le moment du poids sur l'axe vaut \(-mga\sin\theta\), d'où \(\omega_0 = \sqrt{mga/J_O} = \sqrt{3g/(2L)} \approx 3{,}84\ \text{rad/s}\) et \(T_0 = 2\pi/\omega_0 \approx 1{,}64\ \text{s}\).</p>
    <p><strong>Q2.</strong> \(O\) est fixe et le pivot parfait n'a pas de moment sur son axe : \(J_O\,\ddot\theta = -mga\sin\theta\). Pour \(|\theta| \ll 1\), \(\ddot\theta + \omega_0^2\theta = 0\), et avec les conditions initiales \(\theta(0) = \theta_0\), \(\dot\theta(0) = 0\) : \(\theta(t) = \theta_0\cos(\omega_0 t)\).</p>
    <p><strong>Q3.</strong> \(J_O\,\dot\theta\,\ddot\theta = -mga\,\dot\theta\sin\theta\) s'écrit \(\dfrac{\mathrm d}{\mathrm dt}\left(\tfrac12 J_O\dot\theta^2 - mga\cos\theta\right) = 0\) : c'est la conservation de l'énergie mécanique (« Énergétique des systèmes »). Entre \(\theta_0\) et la verticale : \(\tfrac12 J_O\,\omega^2 = mga\,(1 - \cos\theta_0)\), avec \(1 - \cos5° \approx 3{,}81\cdot10^{-3}\) : \(\omega \approx 0{,}335\ \text{rad/s}\). Contrôle par la solution harmonique : \(\theta_0\,\omega_0 = 0{,}0873\times3{,}84 \approx 0{,}335\ \text{rad/s}\).</p>
    <p><strong>Q4.</strong> À la verticale, \(\ddot\theta = 0\) (le moment du poids est nul) : l'accélération de \(G\) est purement normale, \(a\omega^2\), dirigée vers \(O\) (vers le haut). Résultante dynamique verticale : \(R - mg = m a\omega^2\), d'où \(R = mg + m a\omega^2\), soit \(4{,}905 + 0{,}028 \approx 4{,}93\ \text{N}\). Pour d'aussi petites oscillations, l'effet dynamique est infime (0,6 % du poids) ; il deviendrait important pour une barre lâchée de l'horizontale.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Disque roulant sans glisser sur un plan incliné</h3>
  <div class="statement">Un disque plein de masse \(m = 2\ \text{kg}\) et de rayon \(R\) roule sans glisser sur un plan incliné d'un angle \(\alpha = 30°\). Il part du repos. Axe \(\vec x\) descendant le long de la pente ; \(\omega\) est compté positivement dans le sens où le disque tourne en descendant. \(g = 9{,}81\ \text{m/s}^2\).</div>
  <div class="q"><strong>Q1.</strong> Écrire la relation cinématique du roulement sans glissement et faire le bilan des actions extérieures.</div>
  <div class="q"><strong>Q2.</strong> Appliquer le principe fondamental (résultante et moment en \(G\)) ; en déduire l'accélération \(\ddot x\) et les composantes \(T\) et \(N\) de l'action du plan.</div>
  <div class="q"><strong>Q3.</strong> Quelle est la vitesse de \(G\) après une descente de \(h = 0{,}5\ \text{m}\) de dénivelé ?</div>
  <div class="q"><strong>Q4.</strong> Quel coefficient de frottement minimal faut-il pour que le disque roule sans glisser ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le point de contact \(I\) a une vitesse nulle par rapport au plan : \(\dot x = R\omega\), donc \(\ddot x = R\dot\omega\). Actions : le poids en \(G\) ; l'action du plan en \(I\), de composante normale \(N\) et tangentielle \(T\) (dirigée vers le haut de la pente si \(T \gt 0\)).</p>
    <p><strong>Q2.</strong> Résultante selon \(\vec x\) : \(m\ddot x = mg\sin\alpha - T\) ; selon la normale : \(N = mg\cos\alpha\). Moment en \(G\) : \(J_G\,\dot\omega = T R\) avec \(J_G = \tfrac12 mR^2\), d'où \(T = \tfrac12 m\ddot x\). En reportant : \(\tfrac32 m\ddot x = mg\sin\alpha\), soit \(\ddot x = \tfrac23 g\sin\alpha \approx 3{,}27\ \text{m/s}^2\). Puis \(T = \tfrac13 mg\sin\alpha \approx 3{,}27\ \text{N}\) et \(N \approx 17{,}0\ \text{N}\).</p>
    <p><strong>Q3.</strong> Distance parcourue le long de la pente : \(\ell = h/\sin\alpha = 1\ \text{m}\). Mouvement uniformément accéléré depuis le repos : \(v^2 = 2\ddot x\,\ell\), d'où \(v = \sqrt{2\times3{,}27\times1} \approx 2{,}56\ \text{m/s}\), atteinte au bout de \(\sqrt{2\ell/\ddot x} \approx 0{,}78\ \text{s}\). (On retrouve \(v = \sqrt{4gh/3}\) par le théorème de l'énergie cinétique.)</p>
    <p><strong>Q4.</strong> Il faut \(T \leq fN\), soit \(f \geq \tfrac13\tan\alpha \approx 0{,}19\). Avec un coefficient plus faible, le disque glisse (exercice 6).</p>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Écrire le principe fondamental : résultante verticale et moment en \(G\).</div>
  <div class="q"><strong>Q3.</strong> En déduire l'accélération \(a_G\) et la tension \(T\) du fil. Application : \(m = 0{,}2\ \text{kg}\).</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le fil ne glisse pas sur l'axe et son brin vertical est immobile : le point de l'axe où le fil le quitte a une vitesse nulle, comme le point de contact d'une roue. Donc \(v_G = r\omega = (R/2)\,\omega\) (\(\omega\) compté dans le sens où le yo-yo tourne en descendant).</p>

  <div class="q"><strong>Q3.</strong> Comment évolue la vitesse de glissement ? Comparer \(\ddot x\) aux accélérations d'un disque qui glisserait sans frottement et d'un disque qui roulerait sans glisser.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Exercice 3 : en roulement, \(T = \tfrac13 mg\sin\alpha\) et \(N = mg\cos\alpha\). La condition \(T \leq fN\) s'écrit \(\tan\alpha \leq 3f = 0{,}45\), soit \(\alpha \leq 24{,}2°\).</p>
    <p><strong>Q2.</strong> \(\tan40° \approx 0{,}84 \gt 0{,}45\) : le disque glisse. Le point de contact glisse vers le bas de la pente, l'action tangentielle est dirigée vers le haut et vaut \(T = fN = f mg\cos\alpha\). Résultante : \(\ddot x = g(\sin\alpha - f\cos\alpha)\), soit \(9{,}81\times(0{,}643 - 0{,}115) \approx 5{,}18\ \text{m/s}^2\). Moment en \(G\) : \(\tfrac12 mR^2\,\dot\omega = fmg\cos\alpha\,R\), d'où \(\dot\omega = \dfrac{2fg\cos\alpha}{R} \approx 22{,}5\ \text{rad/s}^2\) : \(\ddot x\) et \(\dot\omega\) ne sont plus liés.</p>
    <p><strong>Q3.</strong> Vitesse de glissement \(V_g = \dot x - R\omega\), de dérivée \(5{,}18 - 0{,}1\times22{,}5 \approx 2{,}92\ \text{m/s}^2 \gt 0\) : elle croît, le glissement s'accentue, l'hypothèse est cohérente. L'accélération (5,18 m/s²) est comprise entre celle d'un disque qui roulerait sans glisser (\(\tfrac23 g\sin\alpha \approx 4{,}20\ \text{m/s}^2\)) et celle d'un glissement sans frottement (\(g\sin\alpha \approx 6{,}31\ \text{m/s}^2\)).</p>
