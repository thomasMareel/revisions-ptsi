  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rotor complet : \(G\) sur l'axe. Retirer un tube revient à ajouter une masse négative de \(20\ \text{g}\) à \(8\ \text{cm}\) : \(G\) se décale à l'opposé du tube manquant, de \(e = \dfrac{0{,}02\times0{,}08}{1{,}5 - 0{,}02} \approx 1{,}08\ \text{mm}\).</p>
    <p><strong>Q2.</strong> \(\omega = 6\,000\times2\pi/60 \approx 628\ \text{rad/s}\). À vitesse constante, la résultante dynamique est \(m e\,\omega^2\), avec \(m e = 1{,}6\cdot10^{-3}\ \text{kg·m}\) (masse manquante × rayon) : \(F \approx 1{,}6\cdot10^{-3}\times628^2 \approx 632\ \text{N}\), dirigée de \(G\) vers l'axe et tournant avec le rotor. Le poids du rotor vaut \(14{,}5\ \text{N}\) : l'effort tournant est 43 fois plus grand.</p>
    <p><strong>Q3.</strong> L'effort varie comme \(\omega^2\) : à 3 000 tr/min, il est divisé par 4, soit \(158\ \text{N}\). Deux tubes diamétralement opposés et de même masse gardent \(G\) sur l'axe : le rotor reste équilibré, le palier ne subit plus d'effort tournant (vibrations, usure, et risque de rupture à grande vitesse).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Chariot hissé sur une rampe par un treuil</h3>
  <div class="statement">Un treuil hisse un chariot de \(m = 300\ \text{kg}\) sur une rampe inclinée de \(\alpha = 10°\) ; le câble, inextensible et parallèle à la rampe, s'enroule sur un tambour de rayon \(R = 0{,}1\ \text{m}\) et de moment d'inertie \(J_t = 0{,}2\ \text{kg·m}^2\), entraîné par un couple \(C\) ; pivot du tambour parfait. La résistance au roulement du chariot équivaut à un effort \(F_r = 90\ \text{N}\) opposé au mouvement. \(g = 9{,}81\ \text{m/s}^2\).</div>
  <div class="q"><strong>Q1.</strong> Isoler le chariot et calculer la tension \(T\) du câble pour une accélération \(a = 0{,}4\ \text{m/s}^2\) vers le haut de la rampe.</div>
  <div class="q"><strong>Q2.</strong> Isoler le tambour et calculer le couple \(C\). Que vaut-il à vitesse constante ?</div>
  <div class="q"><strong>Q3.</strong> Retrouver \(C\) en une seule équation, sans calculer \(T\). Quel outil est-ce ?</div>
  <div class="q"><strong>Q4.</strong> Le câble supporte au plus \(1\,000\ \text{N}\). Quelle accélération maximale peut-on demander ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chariot en translation, résultante selon la rampe : \(m a = T - mg\sin\alpha - F_r\), avec \(mg\sin\alpha \approx 511\ \text{N}\). D'où \(T = 511 + 90 + 120 \approx 721\ \text{N}\).</p>
    <p><strong>Q2.</strong> Tambour, moment sur son axe fixe : \(J_t\,\dot\omega = C - T R\) avec \(\dot\omega = a/R = 4\ \text{rad/s}^2\). \(C = 0{,}2\times4 + 721\times0{,}1\), soit \(0{,}8 + 72{,}1 \approx 72{,}9\ \text{N·m}\). À vitesse constante : \(C = (mg\sin\alpha + F_r)\,R \approx 60{,}1\ \text{N·m}\).</p>
    <p><strong>Q3.</strong> En isolant {tambour, câble, chariot}, la tension devient intérieure ; le principe fondamental appliqué au tambour et au chariot, combiné pour l'éliminer, donne \((J_t + mR^2)\,\dot\omega = C - (mg\sin\alpha + F_r)\,R\), soit \(3{,}2\times4 + 60{,}1 \approx 72{,}9\ \text{N·m}\). C'est le théorème de l'énergie cinétique appliqué à l'ensemble, avec l'inertie équivalente \(J_t + mR^2\) ramenée sur l'axe du tambour (« Énergétique des systèmes », §5 et §6).</p>
    <p><strong>Q4.</strong> \(T \leq 1\,000\ \text{N}\) donne \(a \leq (1\,000 - 511 - 90)/300 \approx 1{,}33\ \text{m/s}^2\). La tension dépend de l'accélération : un démarrage brutal peut rompre un câble qui tient largement la charge à l'arrêt.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Barrière levante de péage</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de sciences industrielles PT (thème : inertie d'un solide composé, mouvement imposé, couple moteur, actions dans un pivot, freinage). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">
    <p>Une barrière de péage est formée d'une lisse (tube d'aluminium de longueur \(L = 4{,}0\ \text{m}\) et de masse \(m_l = 5{,}0\ \text{kg}\), assimilé à une tige mince, articulé à une extrémité) et d'un contrepoids (pavé d'acier de \(m_c = 12\ \text{kg}\), de dimensions \(0{,}20\times0{,}12\ \text{m}\) dans le plan de la figure, de centre situé à \(0{,}35\ \text{m}\) de l'axe, de l'autre côté de la lisse). L'ensemble forme le solide 1, articulé sur le fût 0 par une liaison pivot parfaite d'axe \((O,\vec z_0)\) horizontal. Le centre d'inertie de la lisse et celui du contrepoids sont sur l'axe \((O,\vec x_1)\) de la lisse.</p>
    <p>\(\theta = (\vec x_0,\vec x_1)\), \(\vec y_0\) vertical ascendant : \(\theta = 0\) barrière fermée, \(\theta = 90°\) ouverte. Le motoréducteur du fût exerce sur 1 un couple \(C\,\vec z_0\). \(g = 9{,}81\ \text{m/s}^2\).</p>

  </div>
  <p class="exo-part">Partie A — Caractéristiques d'inertie</p>
  <div class="q"><strong>A1.</strong> Calculer la masse \(m\) du solide 1 et la position \(x_G\) de son centre d'inertie sur \((O,\vec x_1)\).</div>
  <div class="q"><strong>A2.</strong> Calculer son moment d'inertie \(J_O\) par rapport à l'axe du pivot. L'inertie propre du contrepoids est-elle utile ?</div>
  <p class="exo-part">Partie B — Rôle du contrepoids</p>
  <div class="q"><strong>B1.</strong> Exprimer le moment du poids de 1 par rapport à l'axe en fonction de \(\theta\). Quel couple faut-il pour maintenir la barrière immobile à l'angle \(\theta\) ? Comparer avec et sans contrepoids.</div>
  <p class="exo-part">Partie C — Mouvement imposé : ouverture en 1,5 s</p>
  <div class="q"><strong>C1.</strong> L'ouverture de 0 à 90° suit un trapèze de vitesse symétrique de durée totale \(1{,}5\ \text{s}\), avec des phases d'accélération et de décélération de \(0{,}5\ \text{s}\). Calculer \(\omega_{max}\), \(\dot\omega_a\) et l'angle atteint en fin d'accélération.</div>
  <div class="q"><strong>C2.</strong> Écrire l'équation qui donne \(C(t)\) et calculer le couple au début et à la fin de chaque phase. Quel couple crête le motoréducteur doit-il fournir ? Que serait-il sans contrepoids ?</div>
  <p class="exo-part">Partie D — Actions dans le pivot</p>
  <div class="q"><strong>D1.</strong> Calculer l'action du pivot sur 1 au démarrage (\(\theta = 0\), \(\omega = 0\)).</div>
  <div class="q"><strong>D2.</strong> Calculer cette action pendant le palier, quand \(\theta = 45°\). Exprimer ses composantes dans la base \((\vec x_0,\vec y_0)\).</div>
  <p class="exo-part">Partie E — Arrêt d'urgence</p>
  <div class="q"><strong>E1.</strong> Pendant le palier, à \(\theta = 45°\), une coupure de courant déclenche un frein de sécurité qui doit arrêter la barrière en \(0{,}2\ \text{s}\), à décélération constante. En prenant le moment du poids constant pendant ce court arrêt (égal à sa valeur à 45°), calculer le couple de freinage nécessaire. De quel angle la barrière tourne-t-elle encore ?</div>
  <div class="q"><strong>E2.</strong> Le frein doit ensuite maintenir la barrière dans n'importe quelle position. Quel couple de maintien minimal faut-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(m = 17\ \text{kg}\). Lisse : centre à \(L/2 = 2{,}0\ \text{m}\) ; contrepoids à \(-0{,}35\ \text{m}\). \(x_G = (5\times2{,}0 - 12\times0{,}35)/17\), soit \(5{,}8/17 \approx 0{,}341\ \text{m}\).</p>
    <p><strong>A2.</strong> Lisse autour d'une extrémité : \(m_lL^2/3 = 5\times16/3 \approx 26{,}67\ \text{kg·m}^2\). Contrepoids, par Huygens (pavé autour d'un axe parallèle à sa troisième arête) : inertie propre \(\tfrac1{12}m_c(0{,}20^2 + 0{,}12^2) \approx 0{,}054\), plus \(m_c\times0{,}35^2 = 1{,}470\), soit \(1{,}52\ \text{kg·m}^2\). \(J_O \approx 28{,}2\ \text{kg·m}^2\). L'inertie propre du contrepoids (0,054) compte pour 0,2 % : on pouvait l'assimiler à un point. Le contrepoids, proche de l'axe, ajoute très peu d'inertie : c'est la lisse, longue, qui domine.</p>
    <p><strong>B1.</strong> Altitude de \(G\) : \(x_G\sin\theta\) ; moment du poids sur l'axe : \(-mg\,x_G\cos\theta = -K\cos\theta\), avec \(K = mg\,x_G \approx 56{,}9\ \text{N·m}\). À l'équilibre, \(C = K\cos\theta\), au plus \(56{,}9\ \text{N·m}\) (barrière fermée). Sans contrepoids, \(K\) vaudrait \(m_l g L/2 \approx 98{,}1\ \text{N·m}\) : le contrepoids réduit de 42 % le couple statique.</p>
    <p><strong>C1.</strong> \(\omega_{max} = \dfrac{\pi/2}{1{,}5 - 0{,}5} \approx 1{,}571\ \text{rad/s}\) ; \(\dot\omega_a = 1{,}571/0{,}5 \approx 3{,}14\ \text{rad/s}^2\) ; angle en fin d'accélération : \(\tfrac12\dot\omega_a t_a^2 = \pi/8\), soit 22,5°.</p>
    <p><strong>C2.</strong> Moment dynamique sur l'axe fixe : \(J_O\,\dot\omega = C - K\cos\theta\), d'où \(C = J_O\,\dot\omega + K\cos\theta\), avec \(J_O\dot\omega_a \approx 88{,}6\ \text{N·m}\).</p>
    <ul>
      <li>Accélération : de \(88{,}6 + 56{,}9 \approx 145{,}5\ \text{N·m}\) (à \(\theta = 0\)) à \(88{,}6 + 56{,}9\cos22{,}5° \approx 141{,}1\ \text{N·m}\).</li>
      <li>Palier : \(C = K\cos\theta\), de 52,6 à 21,8 N·m (de 22,5° à 67,5°).</li>
      <li>Décélération : de \(-88{,}6 + 21{,}8 \approx -66{,}8\ \text{N·m}\) à \(-88{,}6\ \text{N·m}\) (à 90°) : le moteur freine.</li>
    </ul>
    <p>Couple crête : environ \(146\ \text{N·m}\) au démarrage. Sans contrepoids : \(J_O = 26{,}7\ \text{kg·m}^2\) et \(K = 98{,}1\ \text{N·m}\), d'où \(26{,}67\times3{,}14 + 98{,}1 \approx 182\ \text{N·m}\), 25 % de plus.</p>
    <p><strong>D1.</strong> Au démarrage, \(\omega = 0\) : l'accélération de \(G\) est tangentielle, \(x_G\,\dot\omega_a\) selon \(\vec y_1 = \vec y_0\). Le couple moteur n'a pas de résultante. Résultante dynamique : \(\vec R(0\to1) - mg\,\vec y_0 = m\,x_G\,\dot\omega_a\,\vec y_0\), d'où \(\vec R(0\to1) = (166{,}8 + 18{,}2)\,\vec y_0 \approx 185\,\vec y_0\ \text{N}\) : 11 % de plus que le poids.</p>
    <p><strong>D2.</strong> En palier, \(\dot\omega = 0\) : accélération normale \(-x_G\,\omega_{max}^2\,\vec x_1\), d'où \(m\vec\Gamma(G) = -m x_G\,\omega_{max}^2\,\vec x_1 \approx -14{,}3\,\vec x_1\ \text{N}\). \(\vec R(0\to1) = m\vec\Gamma(G) + mg\,\vec y_0\), avec \(\vec x_1 = (\vec x_0 + \vec y_0)/\sqrt2\) : \(\vec R(0\to1) \approx -10{,}1\,\vec x_0 + 156{,}7\,\vec y_0\ \text{N}\), de norme \(\approx 157\ \text{N}\).</p>
    <p><strong>E1.</strong> Décélération \(\dot\omega = -1{,}571/0{,}2 \approx -7{,}85\ \text{rad/s}^2\). Le frein exerce un couple \(-C_f\) : \(J_O\dot\omega = -C_f - K\cos45°\), d'où \(C_f = 28{,}2\times7{,}85 - 56{,}9\times0{,}707\), soit \(221{,}4 - 40{,}2 \approx 181\ \text{N·m}\). Le poids aide à freiner une barrière qui monte. Angle parcouru : \(\omega_{max}\times0{,}2/2 \approx 0{,}157\ \text{rad}\), soit 9° (le moment du poids varie peu sur cet angle : l'hypothèse est raisonnable).</p>
    <p><strong>E2.</strong> À l'arrêt, le frein doit équilibrer \(K\cos\theta\), au plus \(K \approx 57\ \text{N·m}\) (barrière fermée). Le couple d'arrêt d'urgence (181 N·m) est plus contraignant : c'est lui qui dimensionne le frein.</p>
  </div>
