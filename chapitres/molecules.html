<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie 4.2 du programme de PTSI, « Relations entre la structure des entités chimiques et les propriétés physiques macroscopiques ». Il part des acquis de <a href="#atome/cours">« Architecture de la matière »</a> (électrons de valence lus sur le tableau périodique, règle de l'octet, nombre de liaisons, électronégativité, ordres de grandeur des liaisons) pour construire les schémas de Lewis, puis relie la structure des molécules à des propriétés mesurables : températures de changement d'état, miscibilité, solubilité. Les cristaux formés de molécules (glace, diiode) sont étudiés dans <a href="#cristallin/cours">« Solides cristallins »</a> (§9).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Liaison covalente localisée</strong> : citer les ordres de grandeur de longueurs et d'énergies de liaisons covalentes (§1, et « Architecture de la matière », §7).</li>
        <li><strong>Électrons de valence</strong> : les déterminer, pour les éléments des blocs s et p, d'après la position dans le tableau périodique (§2, et « Architecture de la matière », §5).</li>
        <li><strong>Schéma de Lewis</strong> d'une molécule, d'un ion monoatomique ou polyatomique : en établir un schéma pertinent (§2, §3).</li>
        <li><strong>Règle de l'octet</strong> : identifier les écarts (§4).</li>
        <li><strong>Géométrie</strong> : associer qualitativement la géométrie d'une entité à une minimisation de son énergie (§5) ; la géométrie est fournie par l'énoncé.</li>
        <li><strong>Électronégativité et polarité</strong> : comparer deux électronégativités ; prévoir la polarisation d'une liaison ; relier l'existence d'un moment dipolaire permanent à la géométrie donnée d'une molécule ; déterminer direction et sens du vecteur moment dipolaire d'une liaison ou d'une molécule (§6, §7).</li>
        <li><strong>Interactions entre entités</strong> : interactions de van der Waals et liaison hydrogène, ordres de grandeur énergétiques ; interpréter l'évolution des températures de changement d'état de corps purs moléculaires (§8, §9).</li>
        <li><strong>Solvants moléculaires</strong> : moment dipolaire, permittivité relative, caractère protogène ; associer une propriété d'un solvant à une ou des grandeurs caractéristiques (§10).</li>
        <li><strong>Mise en solution</strong> : interpréter la miscibilité ou la non-miscibilité de deux solvants, la solubilité d'une espèce moléculaire ou ionique (§10, §11).</li>
      </ul>
      <p>Hors programme en PTSI (et en PT) : la méthode VSEPR de prévision des géométries (notation AXₙEₘ), la mésomérie et la délocalisation électronique, les orbitales moléculaires. Ces notions sont regroupées en fin de chapitre ; aux concours, la géométrie d'une molécule est toujours donnée.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LA LIAISON COVALENTE</div>
  <h2>Des doublets partagés, simples ou multiples</h2>
  <div class="intro">Les molécules tiennent par des liaisons covalentes : deux atomes mettent en commun des électrons de leur couche externe. Ce paragraphe rappelle les acquis de <a href="#atome/cours">« Architecture de la matière »</a> (§5 à §7) et fixe le vocabulaire et les ordres de grandeur utilisés dans tout le chapitre.</div>
  <div class="def-box">
    <strong>Liaison covalente, doublets.</strong> Une liaison covalente simple est la mise en commun d'un <strong>doublet liant</strong> (deux électrons) entre deux atomes ; deux atomes peuvent partager deux ou trois doublets : liaison double, liaison triple. Les électrons de valence qui ne participent à aucune liaison forment des <strong>doublets non liants</strong>, localisés sur un atome. On parle de liaison <strong>localisée</strong> quand le doublet est partagé entre deux atomes seulement.
  </div>
  <p>Rappels utiles. Pour un élément des blocs s et p, le nombre d'électrons de valence \(v\) se lit sur la colonne (\(v\) = numéro de colonne pour le bloc s, numéro − 10 pour le bloc p). Dans les molécules usuelles, les atomes de la deuxième période (C, N, O, F) s'entourent de 8 électrons (<strong>règle de l'octet</strong>), l'hydrogène de 2 (<strong>règle du duet</strong>). D'où, en général : H et les halogènes, 1 liaison ; O et S, 2 liaisons et 2 doublets non liants ; N et P, 3 liaisons et 1 doublet ; C et Si, 4 liaisons.</p>
  <div class="prop-box">
    <strong>Ordres de grandeur.</strong> Une liaison covalente mesure de 100 à 200 pm (de 74 pm pour H–H à 270 pm pour I–I) et son énergie, à fournir pour la rompre en phase gazeuse, va de 150 à 950 kJ·mol⁻¹ (tableau complet : <a href="#atome/cours">« Architecture de la matière »</a>, §7). Plus la liaison est multiple, plus elle est courte et forte.
  </div>
  <table>
    <tr><th>liaison</th><th>C–C</th><th>C=C</th><th>C≡C</th><th>C–O</th><th>C=O</th><th>N≡N</th></tr>
    <tr><th>longueur (pm)</th><td>154</td><td>134</td><td>120</td><td>143</td><td>122</td><td>110</td></tr>
    <tr><th>énergie (kJ·mol⁻¹)</th><td>348</td><td>614</td><td>839</td><td>358</td><td>745</td><td>945</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — reconnaître une liaison double à sa longueur</strong>
    <ol>
      <li>Dans le dioxyde de carbone, la distance carbone-oxygène mesurée vaut 116 pm, bien plus proche de C=O (122 pm) que de C–O (143 pm) : les deux liaisons sont doubles, O=C=O, ce que confirme le schéma de Lewis (§2).</li>
      <li>Une liaison double n'est pas deux fois plus forte qu'une simple : \(614/348 = 1{,}76\) pour C=C. La seconde liaison, moins solide, est la plus réactive : c'est elle qui s'ouvre dans les réactions d'addition.</li>
      <li>La triple liaison N≡N (945 kJ·mol⁻¹) est l'une des plus fortes : c'est pourquoi le diazote de l'air est si peu réactif, et pourquoi la synthèse de l'ammoniac demande catalyseur, haute température et haute pression.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre l'énergie d'une liaison covalente (des centaines de kJ·mol⁻¹, à l'intérieur d'une molécule) avec celle des interactions entre molécules (quelques kJ·mol⁻¹, §8 et §9). Faire bouillir de l'eau ne rompt aucune liaison O–H.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ÉTABLIR UN SCHÉMA DE LEWIS</div>
  <h2>Répartir les électrons de valence en doublets</h2>
  <div class="intro">Le schéma de Lewis indique comment les électrons de valence se répartissent dans une entité : qui est lié à qui, par combien de doublets, et où sont les doublets non liants. C'est le point de départ de tout le chapitre : la polarité, les interactions entre molécules et la réactivité s'y lisent.</div>
  <div class="method-box"><strong>Méthode — construire un schéma de Lewis</strong>
    <ol>
      <li><span class="step">Compter les électrons de valence</span> de tous les atomes (lus sur le tableau périodique), en <strong>ajoutant</strong> un électron par charge négative et en en <strong>retranchant</strong> un par charge positive. Le nombre de doublets est la moitié de ce total.</li>
      <li><span class="step">Placer le squelette</span> : relier les atomes par des liaisons simples. L'atome central est en général le moins électronégatif (jamais H ni F, qui ne forment qu'une liaison) ; l'énoncé donne souvent l'enchaînement.</li>
      <li><span class="step">Compléter les octets</span> des atomes périphériques avec des doublets non liants, puis placer les doublets restants sur l'atome central.</li>
      <li><span class="step">Former des liaisons multiples</span> si l'atome central n'a pas son octet : transformer un doublet non liant d'un voisin en doublet liant.</li>
      <li><span class="step">Vérifier</span> : nombre total de doublets, octets (duet pour H), puis charges formelles (§3).</li>
    </ol>
  </div>

  <div class="method-box"><strong>Exemple — le méthanal CH₂O</strong>
    <ol>
      <li>Électrons de valence : C 4, H 2 × 1, O 6 ; total 12, soit 6 doublets.</li>
      <li>Squelette : C au centre (moins électronégatif que O), lié à O et aux deux H : 3 liaisons simples, 3 doublets.</li>
      <li>Restent 3 doublets : on les place sur O, qui a alors son octet. Mais C n'a que 6 électrons.</li>
      <li>On transforme un doublet non liant de O en doublet liant : C=O. Bilan : C a 4 liaisons (octet), O une liaison double et 2 doublets non liants (octet), chaque H un duet.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — le cyanure d'hydrogène HCN</strong>
    <ol>
      <li>\(1 + 4 + 5 = 10\) électrons, 5 doublets. Squelette H–C–N : 2 doublets.</li>
      <li>Les 3 doublets restants sur N : N a son octet, C n'a que 4 électrons.</li>
      <li>Deux doublets non liants de N deviennent liants : H–C≡N, avec un doublet non liant sur N. Les deux octets sont satisfaits.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier que la règle de l'octet est un objectif, pas un compte de départ. On compte d'abord le nombre <strong>total</strong> d'électrons de valence ; c'est le manque d'électrons autour d'un atome qui oblige à former des liaisons multiples. Un schéma où un atome de la deuxième période porte plus de 8 électrons est faux.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · CHARGES FORMELLES ET SCHÉMA PERTINENT</div>
  <h2>Placer les charges d'un ion, choisir entre plusieurs schémas</h2>
  <div class="intro">Dans un ion, il faut dire quel atome porte la charge ; et pour certaines molécules, plusieurs schémas respectent les règles du §2. Les charges formelles répondent aux deux questions : elles comparent, atome par atome, les électrons « attribués » dans le schéma à ceux de l'atome isolé. Le programme demande un schéma « pertinent » : c'est elles qui permettent de le choisir.</div>
  <div class="def-box">
    <strong>Charge formelle.</strong> Dans un schéma de Lewis, on attribue à chaque atome ses électrons non liants et la moitié de ses électrons liants. Sa charge formelle est l'écart à son nombre d'électrons de valence \(N_v\) :
    <div class="formula" data-nom="Charge formelle">$$C_F = N_v - N_{nl} - \frac{N_l}{2}$$</div>
    où \(N_{nl}\) est le nombre d'électrons non liants et \(N_l\) le nombre d'électrons liants de l'atome dans le schéma. Une charge formelle non nulle s'écrit entourée près de l'atome (⊕, ⊖). <strong>La somme des charges formelles est égale à la charge de l'entité.</strong>
  </div>

<figcaption>Schémas de Lewis avec leurs charges formelles (entourées). La somme des charges formelles est égale à la charge de l'entité : +1 pour NH₄⁺ et H₃O⁺, −1 pour HO⁻ et CN⁻, −2 pour CO₃²⁻, 0 pour CO et HNO₃, où des charges opposées apparaissent sur des atomes voisins. Dans CO₃²⁻, les trois oxygènes sont en réalité équivalents (hors programme : mésomérie, fin du chapitre).</figcaption>

  <div class="prop-box">
    <strong>Schéma pertinent.</strong> Entre plusieurs schémas qui respectent l'octet des éléments de la deuxième période, on retient en priorité :
    <ul>
      <li>celui qui porte le <strong>moins de charges formelles</strong> (et des charges de faible valeur, ±1) ;</li>
      <li>celui où une charge formelle négative est portée par l'atome le <strong>plus électronégatif</strong> (et une charge positive par le moins électronégatif) ;</li>
      <li>jamais deux charges de même signe sur deux atomes voisins.</li>
    </ul>
  </div>
  <div class="method-box"><strong>Exemple — l'ion ammonium et l'ion hydroxyde</strong>
    <ol>
      <li>NH₄⁺ : \(5 + 4 - 1 = 8\) électrons, 4 doublets, tous liants. Azote : \(C_F = 5 - 0 - 8/2 = +1\) ; chaque H : \(1 - 0 - 1 = 0\). La charge de l'ion est portée par l'azote.</li>
      <li>HO⁻ : \(6 + 1 + 1 = 8\) électrons ; O a 1 liaison et 3 doublets non liants : \(C_F = 6 - 6 - 1 = -1\).</li>
      <li>Contrôle : la somme des charges formelles vaut +1 et −1, les charges des ions.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — choisir un schéma pour le protoxyde d'azote N₂O</strong>
    <p>Enchaînement N–N–O, 16 électrons (8 doublets). Trois schémas respectent l'octet :</p>
    <ol>
      <li>N=N=O : charges formelles −1, +1, 0.</li>
      <li>N≡N–O : charges formelles 0, +1, −1.</li>
      <li>N–N≡O : charges formelles −2, +1, +1.</li>
      <li>Le troisième porte une charge −2 et une charge positive sur l'oxygène : rejeté. Les deux premiers ont autant de charges ; le second place la charge négative sur l'oxygène, plus électronégatif que l'azote : c'est le plus pertinent. (La molécule réelle est intermédiaire entre les deux : c'est la mésomérie, hors programme, fin du chapitre.)</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre une charge formelle pour une charge réelle. Dans le monoxyde de carbone, le schéma pertinent ⊖C≡O⊕ (seul à donner l'octet aux deux atomes) place une charge formelle positive sur l'oxygène, pourtant plus électronégatif ; la molécule est en fait presque apolaire. Les charges formelles sont une comptabilité des électrons, à ne confondre ni avec les charges partielles (§6), ni avec les nombres d'oxydation (<a href="#oxred/cours">« Oxydoréduction »</a>).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉCARTS À LA RÈGLE DE L'OCTET</div>
  <h2>Lacunes, radicaux et hypervalence</h2>
  <div class="intro">La règle de l'octet n'est pas une loi : de nombreuses entités stables ou importantes s'en écartent. Le programme demande de savoir les identifier ; leur repérage explique souvent une réactivité particulière.</div>
  <div class="prop-box">
    <strong>Trois écarts à connaître.</strong>
    <ul>
      <li><strong>Lacune électronique</strong> (hypovalence) : un atome a moins de 8 électrons. C'est le cas du bore et de l'aluminium (colonne 13, 3 électrons de valence) dans BF₃, BH₃, AlCl₃ : 6 électrons seulement. On note la lacune par un petit rectangle vide. Une telle entité accepte volontiers un doublet : c'est un acide de Lewis.</li>
      <li><strong>Nombre impair d'électrons</strong> : un électron reste célibataire (noté par un point) ; l'entité est un <strong>radical</strong>, en général très réactif. Exemples : NO (11 électrons), NO₂ (17), ClO₂ (19).</li>
      <li><strong>Hypervalence</strong> : un atome de la troisième période ou au-delà (P, S, Cl, Xe…) s'entoure de plus de 8 électrons, comme P dans PCl₅ (10) ou S dans SF₆ (12). Les éléments de la deuxième période (C, N, O, F) ne sont <strong>jamais</strong> hypervalents.</li>
    </ul>
  </div>

<figcaption>Écarts à la règle de l'octet. En haut : le bore de BF₃ n'a que 6 électrons (lacune, rectangle) ; NO et NO₂ ont un nombre impair d'électrons : un électron reste célibataire (point), ce sont des radicaux. En bas : le phosphore de PCl₅ et le soufre de SF₆, éléments de la troisième période, sont entourés de 10 et de 12 électrons (hypervalence) ; le doublet non liant de NH₃ comble la lacune de BF₃ en formant une liaison.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — une lacune comblée : l'adduit ammoniac-trifluorure de bore</strong>
    <ol>
      <li>BF₃ : \(3 + 3\times7 = 24\) électrons ; chaque F a son octet (1 liaison, 3 doublets), le bore n'a que 6 électrons : lacune.</li>
      <li>NH₃ porte un doublet non liant. Mis en présence, les deux gaz donnent un solide blanc, H₃N–BF₃ : le doublet de l'azote devient une liaison N–B, et le bore atteint l'octet.</li>
      <li>Charges formelles dans l'adduit : N \(5 - 0 - 8/2 = +1\), B \(3 - 0 - 8/2 = -1\) ; somme nulle pour une molécule neutre.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — un radical qui se dimérise : le dioxyde d'azote</strong>
    <ol>
      <li>NO₂ : \(5 + 2\times6 = 17\) électrons, nombre impair : aucun schéma ne peut apparier tous les électrons ; l'électron célibataire est placé sur l'azote.</li>
      <li>Deux radicaux s'associent en mettant en commun leurs électrons célibataires : 2 NO₂ = N₂O₄, liaison N–N. C'est l'équilibre étudié dans <a href="#equilchim/cours">« Équilibres chimiques »</a> : le gaz brun NO₂ et le gaz incolore N₂O₄ coexistent.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — l'ion sulfate, deux écritures</strong>
    <ol>
      <li>SO₄²⁻ : \(6 + 4\times6 + 2 = 32\) électrons, 16 doublets.</li>
      <li>Avec quatre liaisons simples S–O, chaque atome a son octet ; charges formelles : S \(+2\), chaque O \(-1\) (somme −2).</li>
      <li>Avec deux liaisons doubles S=O et deux simples, S est hypervalent (12 électrons) ; charges formelles : S 0, deux O à 0, deux O à −1.</li>
      <li>Les deux écritures se rencontrent ; la seconde, qui porte moins de charges, est souvent préférée pour le soufre, élément de la troisième période. L'énoncé précise en général celle qu'il attend.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire un azote ou un oxygène hypervalent, par exemple N avec cinq liaisons dans l'acide nitrique. Pour HNO₃, l'octet de l'azote impose des charges formelles : N⊕ lié à un O⊖ (figure du §3).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · GÉOMÉTRIE ET MINIMISATION DE L'ÉNERGIE</div>
  <h2>Des doublets qui s'écartent les uns des autres</h2>
  <div class="intro">Un schéma de Lewis est un graphe : il dit qui est lié à qui, pas comment les atomes sont disposés dans l'espace. Or la géométrie décide de la polarité (§7), donc des propriétés physiques. Le programme demande de relier qualitativement la géométrie, qui est donnée, à une minimisation de l'énergie.</div>
  <div class="prop-box">
    <strong>Géométrie et énergie.</strong> Les doublets d'électrons qui entourent un atome central, liants ou non liants, se repoussent (ils portent des charges de même signe). La molécule adopte la géométrie qui les <strong>éloigne le plus possible</strong> les uns des autres, c'est-à-dire qui <strong>minimise son énergie</strong>. Une liaison multiple compte pour une seule direction. Deux directions se placent à 180° (molécule linéaire), trois à 120° dans un plan (triangle), quatre aux sommets d'un tétraèdre (109,5°). Les doublets non liants, plus proches de l'atome qui les porte, repoussent davantage et referment les angles entre les liaisons.
  </div>

<figcaption>Géométries usuelles des molécules (fournies par les énoncés en PTSI). Représentation de Cram : trait plein dans le plan de la figure, triangle plein vers l'avant, triangle hachuré vers l'arrière. Les doublets autour de l'atome central, liants ou non, se répartissent pour s'éloigner le plus possible les uns des autres, ce qui minimise l'énergie : deux directions donnent une molécule linéaire, trois un triangle plan, quatre un tétraèdre. Dans NH₃ et H₂O, une ou deux des quatre directions sont occupées par des doublets non liants (lobes), plus encombrants : les angles se ferment (107°, 104,5°, contre 109,5°).</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — BF₃ est plan, NH₃ ne l'est pas</strong>
    <ol>
      <li>BF₃ : autour du bore, trois doublets liants et aucun doublet non liant (lacune). Trois directions : triangle plan, angles F–B–F de 120°.</li>
      <li>NH₃ : autour de l'azote, trois doublets liants <strong>et</strong> un doublet non liant. Quatre directions : elles pointent vers les sommets d'un tétraèdre ; trois sont occupées par les H, la quatrième par le doublet. La molécule est une pyramide à base triangulaire, d'angle H–N–H 107°, un peu moins que 109,5°.</li>
      <li>Même formule de type « atome central + 3 », deux géométries différentes : c'est le doublet non liant qui fait la différence, et il rendra NH₃ polaire et BF₃ apolaire (§7).</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — l'angle de l'eau</strong>
    <p>Autour de l'oxygène de H₂O : deux doublets liants et deux non liants, soit quatre directions. Les deux doublets non liants, plus encombrants, écartent les liaisons O–H l'une vers l'autre : l'angle H–O–H vaut 104,5°, contre 109,5° pour le tétraèdre régulier (CH₄) et 107° pour NH₃ (un seul doublet non liant). La molécule d'eau est <strong>coudée</strong>, pas linéaire.</p>
  </div>
  <div class="notice"><strong>Au programme ou non ?</strong> La méthode qui systématise ce raisonnement, la VSEPR (notation AXₙEₘ), est hors programme en PTSI : elle est rappelée en fin de chapitre, pour aller plus loin. Aux écrits comme aux oraux, la géométrie d'une entité est fournie ; on attend seulement qu'on la justifie qualitativement par la répulsion des doublets, et qu'on en tire les conséquences.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LIAISON POLARISÉE ET MOMENT DIPOLAIRE</div>
  <h2>Un doublet partagé inégalement</h2>
  <div class="intro">Entre deux atomes différents, le doublet de liaison est attiré par l'atome le plus électronégatif (<a href="#atome/cours">« Architecture de la matière »</a>, §8). La liaison porte alors deux charges partielles opposées : c'est un petit dipôle électrique, caractérisé par un vecteur, le moment dipolaire.</div>
  <div class="def-box">
    <strong>Liaison polarisée, moment dipolaire.</strong> Si \(\chi_{\mathrm B} \gt \chi_{\mathrm A}\), la liaison A–B est polarisée : B porte une charge partielle \(-\delta\), A une charge \(+\delta\) (\(0 \lt \delta \lt e\)), notées \(\mathrm A^{\delta+}\)–\(\mathrm B^{\delta-}\). Son moment dipolaire est le vecteur
    <div class="formula" data-nom="Moment dipolaire">$$\vec\mu = \delta\,\overrightarrow{\mathrm{BA}} \qquad \mu = \delta\,d$$</div>
    dirigé de la charge négative vers la charge positive (de B vers A), où \(d\) est la longueur de la liaison. Il s'exprime en C·m, ou en <strong>debye</strong> : \(1\ \text{D} = 3{,}336\times10^{-30}\ \text{C·m}\). C'est le moment noté \(\vec p = q\,\overrightarrow{NP}\) en électrostatique (2ᵉ année, <a href="#estat2a/cours">« Électrostatique »</a>).
  </div>
  <p>Le rapport \(\delta/e = \mu/(e\,d)\) est le <strong>pourcentage d'ionicité</strong> (ou caractère ionique partiel) de la liaison : 0 pour une liaison entre deux atomes identiques, 1 pour une liaison purement ionique, où un électron serait entièrement transféré. Il croît avec l'écart d'électronégativité \(\Delta\chi\).</p>

      <div class="formula">$$\frac{\delta}{e} = \frac{\mu}{e\,d} = \frac{1{,}11\times3{,}336\times10^{-30}}{1{,}602\times10^{-19}\times127\times10^{-12}} = 0{,}18$$</div>
      Les charges partielles valent ±18 % de la charge élémentaire.</li>
      <li>Le moment est dirigé du chlore (δ−) vers l'hydrogène (δ+) ; sa norme décroît de HF à HI, comme l'écart d'électronégativité, bien que la liaison s'allonge.</li>

</div>

<div class="course-section">
  <div class="sec-num">§7 · POLARITÉ DES MOLÉCULES</div>
  <h2>La géométrie décide</h2>
  <div class="intro">Une molécule qui contient des liaisons polarisées n'est pas forcément polaire : les moments de liaison sont des vecteurs, et ils peuvent se compenser. C'est la géométrie, donnée par l'énoncé, qui tranche. La polarité gouverne ensuite les interactions entre molécules (§8) et le comportement des solvants (§10).</div>
  <div class="prop-box">
    <strong>Moment dipolaire d'une molécule.</strong> Le moment dipolaire permanent d'une molécule est, en première approximation, la <strong>somme vectorielle</strong> des moments de ses liaisons. La molécule est <strong>polaire</strong> si cette somme est non nulle, <strong>apolaire</strong> sinon. Une molécule assez symétrique est apolaire même si ses liaisons sont polarisées : molécule linéaire symétrique (CO₂), triangle plan à trois substituants identiques (BF₃), tétraèdre régulier à quatre substituants identiques (CH₄, CCl₄).
  </div>
  <div class="method-box"><strong>Exemple — le moment dipolaire de l'eau</strong>
    <p>La molécule d'eau est coudée, d'angle \(\theta = 104{,}5°\), et son moment dipolaire vaut \(\mu = 1{,}85\ \text{D}\).</p>
    <ol>
      <li>Les deux moments de liaison O–H ont même norme \(\mu_{\mathrm{OH}}\), dirigés de O (δ−) vers chaque H (δ+). Leurs composantes perpendiculaires à la bissectrice s'annulent ; les composantes le long de la bissectrice s'ajoutent.</li>
      <li>\(\mu = 2\,\mu_{\mathrm{OH}}\cos(\theta/2)\), donc \(\mu_{\mathrm{OH}} = 1{,}85/(2\cos 52{,}25°) = 1{,}51\ \text{D}\).</li>
      <li>Le moment de la molécule est porté par la bissectrice de l'angle HOH, dirigé de l'oxygène vers le milieu des deux hydrogènes (figure du §6).</li>
      <li>Avec \(d = 96\ \text{pm}\) : \( \delta/e = \mu_{\mathrm{OH}}/(e\,d) \) \( = 1{,}51\times3{,}336\times10^{-30}/(1{,}602\times10^{-19}\times96\times10^{-12}) \) \( = 0{,}33 \). Si l'eau était linéaire, elle serait apolaire, et ne serait ni le solvant ni le liquide que l'on connaît.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — symétrie et polarité</strong>
    <table>
      <tr><th>molécule</th><th>CO₂</th><th>SO₂</th><th>BF₃</th><th>NH₃</th><th>CCl₄</th><th>CHCl₃</th></tr>
      <tr><th>géométrie</th><td>linéaire</td><td>coudée (119°)</td><td>plane</td><td>pyramidale</td><td>tétraèdre</td><td>tétraèdre déformé</td></tr>
      <tr><th>\(\mu\) (D)</th><td>0</td><td>1,63</td><td>0</td><td>1,47</td><td>0</td><td>1,04</td></tr>
    </table>
    <ol>
      <li>CO₂ et SO₂ ont des liaisons polarisées comparables ; seule SO₂, coudée, est polaire.</li>
      <li>Dans CCl₄, les quatre moments C–Cl se compensent ; remplacer un Cl par H (CHCl₃) rompt la symétrie : le moment est porté par l'axe C–H, dirigé du côté des trois chlores (δ−) vers l'hydrogène.</li>
      <li>Le (Z)-1,2-dichloroéthène, où les deux Cl sont du même côté de la double liaison, a un moment de 1,90 D ; son isomère (E), où ils sont opposés, est apolaire.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : conclure à la polarité d'une molécule d'après ses seules liaisons, ou d'après une géométrie dessinée à plat sur un schéma de Lewis. Il faut la géométrie réelle (donnée), puis la somme vectorielle. Inversement, une molécule apolaire peut avoir des liaisons très polarisées (CO₂, CF₄).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · INTERACTIONS DE VAN DER WAALS</div>
  <h2>Les forces faibles qui tiennent les molécules ensemble</h2>
  <div class="intro">Si les molécules ne s'attiraient pas, toutes les substances moléculaires seraient des gaz. Leur passage à l'état liquide ou solide, à une température qui dépend de la molécule, révèle des interactions attractives entre molécules, bien plus faibles que les liaisons covalentes. Toutes ont une origine électrostatique.</div>
  <div class="def-box">
    <strong>Interactions de van der Waals.</strong> Interactions attractives entre dipôles électriques, à très courte portée (elles décroissent très vite avec la distance) et peu directionnelles :
    <ul>
      <li><strong>Keesom</strong> : entre deux dipôles permanents (molécules polaires) ;</li>
      <li><strong>Debye</strong> : entre un dipôle permanent et le dipôle qu'il induit dans une molécule voisine ;</li>
      <li><strong>London</strong> : entre dipôles instantanés, dus aux fluctuations du nuage électronique, et les dipôles qu'ils induisent. Elles existent entre <strong>toutes</strong> les molécules, polaires ou non, et croissent avec la <strong>polarisabilité</strong>, c'est-à-dire avec la taille du nuage électronique (le nombre d'électrons).</li>
    </ul>
    Ordre de grandeur : de l'ordre de 1 à 10 kJ·mol⁻¹, comparable à l'énergie d'agitation thermique \(RT = 2{,}5\ \text{kJ·mol}^{-1}\) à 25 °C, et cent fois moins qu'une liaison covalente. Pour la plupart des molécules, la contribution de London est la plus grande.
  </div>
  <p>Fondre ou vaporiser un corps pur moléculaire, c'est séparer les molécules les unes des autres, donc vaincre ces interactions. <strong>Plus les interactions entre molécules sont fortes, plus les températures de fusion et d'ébullition sont élevées.</strong></p>
  <div class="method-box"><strong>Exemple — taille et forme : les dihalogènes et les pentanes</strong>
    <ol>
      <li>Températures d'ébullition : F₂ −188 °C, Cl₂ −34 °C, Br₂ 59 °C, I₂ 184 °C. Molécules apolaires, seules les interactions de London jouent ; elles croissent avec le nombre d'électrons : à 25 °C, le difluor et le dichlore sont gazeux, le dibrome liquide, le diiode solide.</li>
      <li>Même formule C₅H₁₂, même nombre d'électrons : le pentane linéaire bout à 36 °C, le 2-méthylbutane à 28 °C, le 2,2-diméthylpropane, presque sphérique, à 9,5 °C. Une molécule compacte offre moins de surface de contact à ses voisines : interactions plus faibles.</li>
      <li>Les alcanes linéaires : méthane −162 °C, éthane −89 °C, propane −42 °C, butane −0,5 °C : la température d'ébullition croît régulièrement avec la longueur de la chaîne.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — à taille égale, la polarité compte</strong>
    <p>Le propane CH₃CH₂CH₃ (\(M = 44\ \text{g·mol}^{-1}\), \(\mu \approx 0{,}1\ \text{D}\)) bout à −42 °C ; l'éthanal CH₃CHO (\(M = 44\ \text{g·mol}^{-1}\), \(\mu = 2{,}7\ \text{D}\)) bout à 20 °C. À nombre d'électrons voisin, les interactions de Keesom et de Debye de la molécule polaire s'ajoutent à celles de London : 62 °C d'écart.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : attribuer les températures d'ébullition à la seule polarité. Le diiode, apolaire, bout bien plus haut que le chlorure d'hydrogène, polaire (−85 °C) : avec 106 électrons contre 18, ses interactions de London l'emportent largement. Comparer d'abord la taille, puis la polarité, puis la possibilité de liaisons hydrogène (§9).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · LIAISON HYDROGÈNE ET TEMPÉRATURES DE CHANGEMENT D'ÉTAT</div>
  <h2>Une interaction plus forte et dirigée</h2>
  <div class="intro">L'eau devrait bouillir vers −90 °C si l'on prolongeait la tendance de ses voisines du tableau périodique ; elle bout à 100 °C. Cette anomalie, partagée par l'ammoniac et le fluorure d'hydrogène, révèle une interaction plus forte que celles de van der Waals : la liaison hydrogène, qui façonne aussi la glace, l'ADN et les protéines.</div>
  <div class="def-box">
    <strong>Liaison hydrogène.</strong> Interaction entre un atome d'hydrogène lié à un atome très électronégatif, X = F, O ou N (le <strong>donneur</strong> X–H, où H porte une charge partielle positive marquée), et un doublet non liant d'un atome électronégatif Y = F, O ou N d'une autre molécule ou d'une autre partie de la molécule (l'<strong>accepteur</strong>). On la note X–H⋯Y. Elle est :
    <ul>
      <li>plus forte que les interactions de van der Waals : de l'ordre de 10 à 40 kJ·mol⁻¹ (environ 20 kJ·mol⁻¹ dans l'eau) ;</li>
      <li><strong>directionnelle</strong> : les atomes X, H et Y sont presque alignés ;</li>
      <li>intermoléculaire (entre deux molécules) ou intramoléculaire (entre deux groupes d'une même molécule).</li>
    </ul>
  </div>

  <div class="method-box"><strong>Exemple — deux isomères C₂H₆O</strong>
    <ol>
      <li>L'éthanol CH₃CH₂OH et le méthoxyméthane CH₃OCH₃ ont la même formule brute, la même masse molaire (46 g·mol⁻¹), le même nombre d'électrons.</li>
      <li>L'éthanol possède un groupe O–H : ses molécules sont à la fois donneuses et accepteuses de liaisons hydrogène. Le méthoxyméthane n'a aucun H lié à O : ses molécules peuvent être accepteuses, mais pas donneuses ; entre elles, pas de liaison hydrogène.</li>
      <li>Conséquence : l'éthanol bout à 78 °C, le méthoxyméthane à −24 °C. Le premier est liquide à température ambiante, le second gazeux.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — l'énergie à fournir pour vaporiser</strong>
    <p>Enthalpie de vaporisation, à la température d'ébullition sous 1 bar : méthane 8,2 kJ·mol⁻¹ (seules les interactions de London), eau 40,7 kJ·mol⁻¹. Dans l'eau liquide, chaque molécule est engagée dans environ trois à quatre liaisons hydrogène (deux comme donneuse par ses H, deux comme accepteuse par ses doublets) ; les rompre coûte cinq fois plus que de séparer des molécules de méthane.</p>
    <p>Le fluorure d'hydrogène forme des liaisons hydrogène plus fortes que celles de l'eau, mais chaque molécule HF n'a qu'un H donneur : en moyenne deux liaisons par molécule. HF bout à 20 °C, plus bas que l'eau.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : voir une liaison hydrogène dans toute molécule qui contient des H. Les H liés à un carbone (CH₄, CH₃OCH₃) ne sont pas assez positifs : il faut un H lié à F, O ou N, face à un doublet de F, O ou N. Autre erreur : appeler « liaison » au sens covalent une interaction cent fois plus faible.</div>
  <p><strong>Liaison hydrogène intramoléculaire.</strong> Quand le donneur et l'accepteur appartiennent à la même molécule et sont proches, la liaison hydrogène se forme à l'intérieur de la molécule et ne lie plus les molécules entre elles. Ainsi le 2-nitrophénol, où le groupe OH et le groupe NO₂ sont voisins, fond à 45 °C et bout à 216 °C, tandis que le 4-nitrophénol, où ils sont opposés et ne peuvent former que des liaisons entre molécules, fond à 114 °C et bout vers 280 °C.</p>
</div>

<div class="course-section">
  <div class="sec-num">§10 · SOLVANTS MOLÉCULAIRES</div>
  <h2>Moment dipolaire, permittivité, caractère protogène</h2>
  <div class="intro">Un solvant ne se choisit pas au hasard : pour dissoudre un sel, extraire un colorant ou mener une synthèse, il faut un solvant qui interagisse convenablement avec les espèces dissoutes. Le programme retient trois grandeurs pour caractériser un solvant moléculaire, et demande d'associer chacune à une propriété.</div>
  <div class="prop-box">
    <strong>Grandeurs caractéristiques d'un solvant.</strong>
    <ul>
      <li><strong>Moment dipolaire \(\mu\)</strong> : un solvant <strong>polaire</strong> (\(\mu\) de l'ordre du debye ou plus) solvate les ions et les molécules polaires par des interactions entre dipôles ; ses molécules peuvent polariser une liaison au point de la rompre en ions (pouvoir <strong>ionisant</strong>). Un solvant <strong>apolaire</strong> (\(\mu \approx 0\)) n'interagit que par des forces de London.</li>
      <li><strong>Permittivité relative \(\varepsilon_r\)</strong> : dans le solvant, la force électrostatique entre deux ions est divisée par \(\varepsilon_r\). Un solvant de grande permittivité (\(\varepsilon_r\) de plusieurs dizaines, comme l'eau) sépare les paires d'ions : il est <strong>dissociant</strong>.</li>
      <li><strong>Caractère protogène</strong> (solvant <strong>protique</strong>) : le solvant possède des H liés à O ou N, capables de liaisons hydrogène comme donneurs (et de céder un H⁺) : eau, alcools, acide éthanoïque. Il solvate particulièrement bien les anions et les espèces accepteuses de liaisons hydrogène. Sinon, le solvant est <strong>aprotique</strong>.</li>
    </ul>
  </div>

    <tr><th>solvant</th><th>\(\mu\) (D)</th><th>\(\varepsilon_r\)</th><th>protique ?</th><th>classe</th></tr>
    <tr><td>eau</td><td>1,85</td><td>78</td><td>oui</td><td>polaire protique</td></tr>
    <tr><td>méthanol</td><td>1,70</td><td>33</td><td>oui</td><td>polaire protique</td></tr>
    <tr><td>éthanol</td><td>1,69</td><td>25</td><td>oui</td><td>polaire protique</td></tr>
    <tr><td>acide éthanoïque</td><td>1,74</td><td>6,2</td><td>oui</td><td>protique, peu dissociant</td></tr>
    <tr><td>diméthylsulfoxyde (DMSO)</td><td>3,96</td><td>47</td><td>non</td><td>polaire aprotique</td></tr>
    <tr><td>propanone (acétone)</td><td>2,88</td><td>21</td><td>non</td><td>polaire aprotique</td></tr>

  </table>
  <div class="method-box"><strong>Exemple — pourquoi l'eau dissocie les ions</strong>
    <p>Énergie d'attraction d'une paire Na⁺Cl⁻ au contact (distance 0,28 nm), par mole de paires : \(E = \dfrac{N_A\,e^2}{4\pi\varepsilon_0\varepsilon_r\,r}\).</p>
    <ol>
      <li>Dans le vide (\(\varepsilon_r = 1\)) :
      <div class="formula">$$E = \frac{6{,}02\times10^{23}\times(1{,}60\times10^{-19})^2}{4\pi\times8{,}85\times10^{-12}\times0{,}28\times10^{-9}} = 496\ \text{kJ·mol}^{-1}$$</div>
      soit deux cents fois \(RT\).</li>
      <li>Dans l'eau (\(\varepsilon_r = 78\)) : \(496/78 = 6{,}4\ \text{kJ·mol}^{-1}\), à peine 2,6 fois \(RT = 2{,}5\ \text{kJ·mol}^{-1}\) : l'agitation thermique sépare les deux ions, qui se dispersent.</li>
      <li>Dans le cyclohexane (\(\varepsilon_r = 2{,}0\)) : 250 kJ·mol⁻¹, cent fois \(RT\) : les ions restent appariés, le sel ne se dissout pas.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — associer une propriété à une grandeur</strong>
    <ol>
      <li>Le chlorure d'hydrogène gazeux, dissous dans l'eau, donne H₃O⁺ et Cl⁻ séparés : l'eau est <em>ionisante</em> (moment dipolaire élevé, liaisons hydrogène avec Cl), <em>dissociante</em> (\(\varepsilon_r = 78\)) et <em>protique</em> (elle solvate l'anion Cl⁻ par des liaisons hydrogène).</li>
      <li>Dans l'acide éthanoïque, solvant protique mais peu dissociant (\(\varepsilon_r = 6{,}2\)), les ions formés restent en grande partie appariés.</li>
      <li>Le DMSO, polaire et dissociant mais aprotique, solvate bien les cations par ses atomes d'oxygène, mal les anions : ceux-ci y sont peu entourés, donc très réactifs, ce que les chimistes organiciens mettent à profit.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre polaire et protique. La propanone et le DMSO sont très polaires (\(\mu\) plus grand que celui de l'eau) mais aprotiques : leurs H sont liés à des carbones. Le moment dipolaire et la permittivité ne varient pas non plus toujours ensemble : l'acide éthanoïque, aussi polaire que l'éthanol, est quatre fois moins dissociant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · MISCIBILITÉ ET SOLUBILITÉ</div>
  <h2>Qui se ressemble s'assemble</h2>
  <div class="intro">Deux liquides se mélangent-ils ? Un solide se dissout-il ? La réponse dépend des interactions qu'il faut rompre (entre molécules du solvant, entre entités du soluté) et de celles qui se forment (entre solvant et soluté). Un mélange se fait d'autant mieux que les interactions nouvelles ressemblent à celles qu'on a rompues.</div>
  <div class="prop-box">
    <strong>Miscibilité de deux liquides.</strong> Deux liquides sont <strong>miscibles</strong> (ils forment une seule phase en toutes proportions) quand leurs molécules établissent entre elles des interactions comparables à celles qu'elles établissent avec leurs semblables : deux liquides capables de liaisons hydrogène (eau et éthanol), ou deux liquides apolaires (cyclohexane et heptane). Un liquide dont les molécules sont fortement liées entre elles (l'eau et son réseau de liaisons hydrogène) ne se mélange pas à un liquide qui ne peut pas les remplacer (le cyclohexane) : deux phases se forment. Entre les deux, la miscibilité peut être <strong>partielle</strong>.
  </div>
  <div class="method-box"><strong>Exemple — l'eau et quelques solvants</strong>
    <ol>
      <li>Éthanol, propanone : miscibles à l'eau en toutes proportions. L'éthanol est donneur et accepteur de liaisons hydrogène ; la propanone est seulement accepteuse (doublets de son O), ce qui suffit.</li>
      <li>Butan-1-ol, éthoxyéthane : partiellement miscibles (environ 70 g·L⁻¹ dans l'eau à 20 °C). Leur groupe OH ou leur O s'associe à l'eau, mais leur longue partie carbonée, apolaire, la repousse.</li>
      <li>Cyclohexane, heptane, dichlorométhane : non miscibles à l'eau ; les deux phases se superposent selon leur densité (cyclohexane 0,78 au-dessus de l'eau, dichlorométhane 1,33 au-dessous).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Solubilité d'une espèce.</strong> La solubilité est la quantité maximale d'une espèce que l'on peut dissoudre dans un volume donné de solvant (en g·L⁻¹ ou mol·L⁻¹).
    <ul>
      <li>Une espèce <strong>moléculaire</strong> se dissout bien dans un solvant qui lui ressemble : une espèce polaire ou capable de liaisons hydrogène (saccharose, éthanol) dans l'eau ; une espèce apolaire (diiode, graisses, cires) dans un solvant apolaire.</li>
      <li>Une espèce <strong>ionique</strong> se dissout en trois temps : <em>ionisation</em> (formation des ions, si l'espèce n'était pas déjà ionique, comme HCl), <em>dissociation</em> (séparation des ions, favorisée par une grande \(\varepsilon_r\)), <em>solvatation</em> (chaque ion s'entoure de molécules de solvant orientées, favorisée par un solvant polaire et protique). Les solides ioniques sont solubles dans l'eau, très peu dans les solvants peu dissociants.</li>
    </ul>
  </div>

<figcaption>Ions hydratés (schéma plan ; les molécules forment en réalité une couche en trois dimensions). Autour du cation Na⁺, les molécules d'eau tournent leur oxygène, porteur de la charge partielle négative ; autour de l'anion Cl⁻, elles tournent un hydrogène, porteur de la charge partielle positive, comme dans une liaison hydrogène. Ces interactions ion-dipôle stabilisent les ions en solution et compensent l'énergie dépensée pour disperser le cristal.</figcaption>
</figure>
  <div class="method-box"><strong>Exemple — extraire le diiode d'une solution aqueuse</strong>
    <ol>
      <li>Le diiode, apolaire, est peu soluble dans l'eau (environ 0,3 g·L⁻¹ à 25 °C) et bien plus dans le cyclohexane (de l'ordre de 20 g·L⁻¹) : soixante fois plus.</li>
      <li>On agite la solution aqueuse avec du cyclohexane, non miscible à l'eau, dans une ampoule à décanter : le diiode passe en grande partie dans la phase organique, supérieure (densité 0,78), qui se colore en violet.</li>
      <li>L'éthanol, qui dissout aussi très bien le diiode, ne conviendrait pas : miscible à l'eau, il ne formerait pas de seconde phase.</li>
    </ol>
  </div>
  <div class="method-box"><strong>Exemple — le sel dans l'eau et dans l'éthanol</strong>
    <p>Le chlorure de sodium se dissout à raison d'environ 360 g par litre d'eau à 25 °C, mais à moins de 1 g par litre d'éthanol et pas du tout dans le cyclohexane. Avec \(\varepsilon_r = 25\), l'éthanol divise l'attraction entre ions trois fois moins que l'eau ; l'énergie de la paire au contact y vaut 20 kJ·mol⁻¹, huit fois \(RT\) : les ions restent associés dans le cristal.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer « qui se ressemble s'assemble » à l'aveugle. Il faut identifier les interactions en jeu : un sel n'est soluble que dans un solvant à la fois polaire et dissociant, et l'éthanol, polaire mais moins dissociant, en dissout peu. Pour une extraction, deux conditions : solvant non miscible à l'eau, et espèce plus soluble dans ce solvant que dans l'eau.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · VSEPR ET MÉSOMÉRIE</div>
  <h2>Hors programme en PTSI : prévoir une géométrie, décrire des électrons délocalisés</h2>
  <div class="notice"><strong>Hors programme en PTSI (pour aller plus loin)</strong> : ni la méthode VSEPR ni la mésomérie ne figurent aux programmes de PTSI et de PT. Elles prolongent les §3 et §5 et se rencontrent dans les ouvrages et en école d'ingénieurs.</div>
  <h3>La méthode VSEPR</h3>
  <p>La méthode VSEPR (<em>Valence Shell Electron Pair Repulsion</em>) systématise le raisonnement du §5. Autour d'un atome central A, on compte \(n\) atomes liés X (une liaison multiple compte pour un) et \(m\) doublets non liants E : la molécule est de type AXₙEₘ. Le nombre \(n + m\) fixe la figure de répulsion (\(n + m = 2\) : droite ; 3 : triangle ; 4 : tétraèdre ; 5 : bipyramide à base triangulaire ; 6 : octaèdre), les doublets non liants occupent certains sommets et la géométrie se lit sur les atomes seuls.</p>
  <table>
    <tr><th>type</th><th>AX₂</th><th>AX₃</th><th>AX₂E</th><th>AX₄</th><th>AX₃E</th><th>AX₂E₂</th><th>AX₅</th><th>AX₆</th></tr>
    <tr><th>géométrie</th><td>linéaire</td><td>triangle plan</td><td>coudée</td><td>tétraèdre</td><td>pyramide</td><td>coudée</td><td>bipyramide</td><td>octaèdre</td></tr>
    <tr><th>exemple</th><td>CO₂</td><td>BF₃</td><td>SO₂</td><td>CH₄</td><td>NH₃</td><td>H₂O</td><td>PCl₅</td><td>SF₆</td></tr>
  </table>
  <h3>La mésomérie</h3>
  <p>Pour certaines entités, plusieurs schémas de Lewis équivalents existent et aucun ne décrit seul la réalité. Dans l'ozone O₃, le schéma O=O⁺–O⁻ distingue une liaison double et une simple ; or les deux liaisons mesurent 128 pm, entre la simple O–O (148 pm) et la double O=O (121 pm). On écrit les deux formes, dites <strong>mésomères</strong>, reliées par une flèche ↔ : l'entité réelle est un hybride des deux, et les électrons concernés sont <strong>délocalisés</strong> sur les trois atomes. De même, les trois liaisons C–O de l'ion carbonate CO₃²⁻ mesurent toutes 129 pm (trois formes mésomères, figure du §3), et les six liaisons carbone-carbone du benzène 140 pm.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · MOLÉCULES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI sur la structure des entités et ses conséquences physiques : compter les électrons de valence, établir un schéma de Lewis pertinent (molécule ou ion), repérer un écart à l'octet, justifier une géométrie donnée, orienter un moment dipolaire et décider de la polarité, comparer des températures de changement d'état, choisir un solvant. La dernière méthode, la VSEPR, est hors programme.</div>

  <div class="method-box"><strong>Méthode 1 — Compter les électrons de valence d'une entité</strong>
    <ol>
      <li><span class="step">Lire la colonne</span> de chaque élément : \(v\) = numéro de colonne (bloc s), numéro − 10 (bloc p) ; H : 1.</li>
      <li><span class="step">Sommer</span> sur tous les atomes, puis <strong>ajouter</strong> un électron par charge négative, <strong>retrancher</strong> un électron par charge positive.</li>
      <li><span class="step">Diviser par 2</span> : nombre de doublets (liants et non liants) à placer ; un total impair annonce un radical.</li>
    </ol>
    <p><em>Exemple éclair :</em> ion chlorate ClO₃⁻ : \(7 + 3\times6 + 1 = 26\) électrons, 13 doublets ; ion phosphate PO₄³⁻ : \(5 + 4\times6 + 3 = 32\) électrons, 16 doublets.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Établir le schéma de Lewis d'une molécule</strong>
    <ol>
      <li><span class="step">Squelette.</span> Atome central le moins électronégatif (jamais H ni F) ; relier par des liaisons simples.</li>
      <li><span class="step">Octets.</span> Compléter les atomes périphériques par des doublets non liants, puis placer le reste sur l'atome central.</li>
      <li><span class="step">Liaisons multiples.</span> Si l'atome central n'a pas son octet, transformer en doublets liants des doublets non liants de ses voisins.</li>
      <li><span class="step">Contrôler</span> le nombre de doublets, les octets (duet pour H), aucun atome de la deuxième période au-delà de 8 électrons.</li>
    </ol>
    <p><em>Exemple éclair :</em> éthène C₂H₄, \(2\times4 + 4 = 12\) électrons : squelette à 5 liaisons simples (10 électrons) ; restent 2 électrons, et chaque C n'en a que 6 ou 8 : on forme C=C. Schéma H₂C=CH₂, sans doublet non liant.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Placer les charges formelles (ion ou molécule)</strong>
    <ol>
      <li><span class="step">Pour chaque atome</span>, compter ses électrons non liants \(N_{nl}\) et ses électrons liants \(N_l\) dans le schéma.</li>
      <li><span class="step">Calculer</span> \(C_F = N_v - N_{nl} - N_l/2\) ; noter les charges non nulles entourées.</li>
      <li><span class="step">Vérifier</span> que la somme des charges formelles est égale à la charge de l'entité.</li>
    </ol>
    <p><em>Exemple éclair :</em> CN⁻ (10 électrons), ⊖C≡N : C a 6 électrons liants et 2 non liants, \(C_F = 4 - 2 - 3 = -1\) ; N : \(5 - 2 - 3 = 0\). Somme −1 : la charge est portée par le carbone.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Choisir le schéma de Lewis le plus pertinent</strong>
    <ol>
      <li><span class="step">Écrire</span> les schémas qui respectent l'octet de C, N, O, F (déplacer les liaisons multiples).</li>
      <li><span class="step">Calculer</span> les charges formelles de chacun (méthode 3).</li>
      <li><span class="step">Retenir</span> celui qui porte le moins de charges, des charges de valeur ±1, les charges négatives sur les atomes les plus électronégatifs, et jamais deux charges de même signe voisines.</li>
    </ol>
    <p><em>Exemple éclair :</em> CO₂ : O=C=O (aucune charge) est préféré à ⊖O–C≡O⊕ (deux charges, dont une positive sur un oxygène).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Identifier un écart à la règle de l'octet</strong>
    <ol>
      <li><span class="step">Nombre total d'électrons impair :</span> radical (un électron célibataire).</li>
      <li><span class="step">Atome de la colonne 13</span> (B, Al) lié par trois liaisons simples : lacune électronique, 6 électrons.</li>
      <li><span class="step">Atome de la troisième période ou au-delà</span> entouré de plus de quatre doublets (5 ou 6 liaisons) : hypervalence. Jamais pour C, N, O, F.</li>
    </ol>
    <p><em>Exemple éclair :</em> ClO₂ (\(7 + 12 = 19\) électrons) est un radical ; AlCl₃ présente une lacune (il se dimérise en Al₂Cl₆) ; dans PF₅, le phosphore est entouré de 10 électrons.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Justifier qualitativement une géométrie donnée</strong>
    <ol>
      <li><span class="step">Compter les directions</span> autour de l'atome central : atomes liés (une liaison multiple compte pour un) et doublets non liants.</li>
      <li><span class="step">Écarter au maximum</span> ces directions, ce qui minimise l'énergie de répulsion : 2 → droite, 3 → triangle plan, 4 → tétraèdre.</li>
      <li><span class="step">Conclure</span> sur la position des seuls atomes, en notant que les doublets non liants referment les angles.</li>
    </ol>
    <p><em>Exemple éclair :</em> SO₂ (angle donné : 119°) : autour de S, deux atomes d'oxygène et un doublet non liant, trois directions en triangle : la molécule est coudée. CO₂ (180°) : deux directions, aucun doublet sur C : linéaire.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Prévoir la polarisation d'une liaison et orienter son moment</strong>
    <ol>
      <li><span class="step">Comparer les électronégativités</span> : par les données, ou par la position (augmente vers la droite d'une période, vers le haut d'une colonne).</li>
      <li><span class="step">Placer les charges partielles</span> : \(\delta-\) sur le plus électronégatif, \(\delta+\) sur l'autre.</li>
      <li><span class="step">Orienter le vecteur</span> \(\vec\mu\) de \(\delta-\) vers \(\delta+\) ; norme \(\mu = \delta\,d\), en debye (\(1\ \text{D} = 3{,}336\times10^{-30}\ \text{C·m}\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> C–Cl : \(\chi_{\mathrm{Cl}} = 3{,}16 \gt \chi_{\mathrm C} = 2{,}55\), donc \(\mathrm C^{\delta+}\)–\(\mathrm{Cl}^{\delta-}\), moment dirigé du chlore vers le carbone.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Décider de la polarité d'une molécule de géométrie donnée</strong>
    <ol>
      <li><span class="step">Dessiner la géométrie réelle</span> (donnée) et un vecteur moment par liaison polarisée.</li>
      <li><span class="step">Utiliser la symétrie</span> : linéaire symétrique, triangle plan ou tétraèdre régulier à substituants identiques → somme nulle, molécule apolaire.</li>
      <li><span class="step">Sinon, sommer</span> les vecteurs : pour deux moments égaux faisant l'angle \(\theta\), \(\mu = 2\mu_1\cos(\theta/2)\), porté par la bissectrice.</li>
    </ol>
    <p><em>Exemple éclair :</em> SO₂, angle 119,5°, moments S=O de 1,62 D : \(\mu = 2\times1{,}62\times\cos 59{,}75° = 1{,}63\ \text{D}\), porté par la bissectrice et dirigé du milieu des deux oxygènes (δ−) vers le soufre (δ+), comme chaque moment de liaison.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Comparer des températures de changement d'état</strong>
    <ol>
      <li><span class="step">Liaisons hydrogène ?</span> Un H lié à F, O ou N dans la molécule : elles dominent, la température est nettement plus élevée.</li>
      <li><span class="step">Taille</span> (nombre d'électrons) : à type d'interactions égal, plus de London, température plus élevée ; à taille égale, une molécule compacte bout plus bas.</li>
      <li><span class="step">Polarité</span> : à taille voisine, une molécule polaire (Keesom, Debye) bout plus haut qu'une apolaire.</li>
    </ol>
    <p><em>Exemple éclair :</em> par température d'ébullition croissante : CH₄ (−162 °C) &lt; SiH₄ (−112 °C) &lt; NH₃ (−33 °C) &lt; H₂O (100 °C) ; les deux derniers sont liés par liaisons hydrogène, et l'eau en forme davantage par molécule.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Choisir un solvant, prévoir une miscibilité ou une solubilité</strong>
    <ol>
      <li><span class="step">Caractériser le solvant</span> : polaire ou apolaire (\(\mu\)), dissociant ou non (\(\varepsilon_r\)), protique ou aprotique (H lié à O ou N).</li>
      <li><span class="step">Caractériser le soluté</span> : ionique, moléculaire polaire, capable de liaisons hydrogène, apolaire.</li>
      <li><span class="step">Appliquer « qui se ressemble s'assemble »</span> : un sel dans un solvant polaire, dissociant et protique ; une espèce apolaire dans un solvant apolaire. Deux liquides sont miscibles s'ils établissent des interactions comparables.</li>
      <li><span class="step">Pour une extraction</span>, exiger en plus que le solvant soit non miscible à la phase de départ.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour extraire le diiode d'une eau iodée, le cyclohexane (apolaire, non miscible à l'eau) convient, pas l'éthanol (miscible à l'eau).</p>
  </div>

  <div class="method-box"><strong>Méthode 11 — Prévoir une géométrie par la méthode VSEPR (hors programme, pour aller plus loin)</strong>
    <ol>
      <li><span class="step">Schéma de Lewis</span> ; compter autour de l'atome central A les \(n\) atomes liés X et les \(m\) doublets non liants E : type AXₙEₘ.</li>
      <li><span class="step">Figure de répulsion</span> selon \(n + m\) : 2 droite, 3 triangle, 4 tétraèdre, 5 bipyramide, 6 octaèdre.</li>
      <li><span class="step">Géométrie</span> : position des seuls atomes ; angles un peu refermés par les doublets non liants.</li>
    </ol>
    <p><em>Exemple éclair :</em> NH₄⁺ : AX₄, tétraèdre régulier (109,5°) ; SO₂ : AX₂E, coudée.</p>
  </div>

  <div class="notice"><strong>Piège</strong> : oublier la charge d'un ion dans le décompte des électrons, ou la compter à l'envers (une charge négative <strong>ajoute</strong> des électrons).</div>
  <div class="notice"><strong>Piège</strong> : écrire un atome de C, N, O ou F entouré de plus de 8 électrons ; seuls les éléments de la troisième période et au-delà peuvent être hypervalents.</div>
  <div class="notice"><strong>Piège</strong> : conclure à la polarité d'une molécule d'après un schéma de Lewis dessiné à plat ; seule la géométrie réelle (donnée) permet la somme vectorielle.</div>
  <div class="notice"><strong>Piège</strong> : orienter le moment dipolaire vers l'atome le plus électronégatif. Convention du programme : de la charge négative vers la charge positive.</div>
  <div class="notice"><strong>Piège</strong> : voir des liaisons hydrogène entre molécules dont les H sont liés à des carbones, ou confondre polaire et protique (la propanone est polaire mais aprotique).</div>
</div>

<div class="exo">

  <div class="q"><strong>Q2.</strong> Montrer que, dans ce modèle, le moment de chaque molécule est proportionnel à \(\big\|\sum_{\mathrm{Cl}}\vec u_j\big\|\), la somme portant sur les seuls atomes de chlore, avec un même coefficient \(M\) pour les quatre molécules. Pourquoi CCl₄ est-il apolaire ?</div>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> C–Cl : \(\mathrm C^{\delta+}\)–\(\mathrm{Cl}^{\delta-}\), moment dirigé du chlore vers le carbone, \(-\mu_{\mathrm{Cl}}\vec u_j\). C–H : \(\chi_{\mathrm C} \gt \chi_{\mathrm H}\), \(\mathrm C^{\delta-}\)–\(\mathrm H^{\delta+}\), moment dirigé du carbone vers l'hydrogène, \(+\mu_{\mathrm H}\vec u_i\).</p>
    <p><strong>Q2.</strong> \(\vec\mu = \mu_{\mathrm H}\sum_{\mathrm H}\vec u_i - \mu_{\mathrm{Cl}}\sum_{\mathrm{Cl}}\vec u_j\). Comme \(\sum_{\mathrm H}\vec u_i = -\sum_{\mathrm{Cl}}\vec u_j\) : \(\vec\mu = -(\mu_{\mathrm H} + \mu_{\mathrm{Cl}})\sum_{\mathrm{Cl}}\vec u_j\), de norme \(M\big\|\sum_{\mathrm{Cl}}\vec u_j\big\|\) avec \(M = \mu_{\mathrm H} + \mu_{\mathrm{Cl}}\). Pour CCl₄, la somme porte sur les quatre vecteurs : elle est nulle, la molécule est apolaire bien que ses liaisons soient polarisées.</p>
    <p><strong>Q3.</strong> CH₃Cl : \(\|\vec u\| = 1\), donc \(M = 1{,}87\ \text{D}\). CH₂Cl₂ : deux vecteurs faisant 109,5°, \(\|\vec u_1 + \vec u_2\| = 2\cos 54{,}75° = 1{,}155\), d'où 2,16 D. CHCl₃ : la somme des trois vecteurs vaut \(-\vec u_{\mathrm H}\), de norme 1 : 1,87 D. Les mesures (1,60 et 1,04 D) sont plus faibles : le modèle donne les symétries et l'ordre de grandeur, mais les moments de liaison ne sont pas fixes ; chaque atome de chlore modifie la répartition des électrons autour du carbone, et donc la polarisation des autres liaisons.</p>
    <p><strong>Q4.</strong> Dans l'isomère (E), les deux liaisons C–Cl (et les deux C–H) sont symétriques par rapport au milieu de la double liaison : moments opposés deux à deux, somme nulle. Dans l'isomère (Z), les deux moments C–Cl, inclinés de 60° sur l'axe C=C, ont des composantes perpendiculaires à cet axe de même sens qui s'ajoutent (\(2\mu\sin 60° = 1{,}73\mu\)) ; les moments C–H, situés de l'autre côté et dirigés vers les H, s'ajoutent dans le même sens : la molécule est polaire.</p>
  </div>
</div>

  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>L'eau, une molécule singulière</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>schémas de Lewis, charges formelles, géométrie, moment dipolaire, liaison hydrogène, solvants</em>). Pour t'entraîner sur les sujets réellement tombés :

  </div>
  <div class="statement">L'eau est le liquide le plus abondant à la surface de la Terre, et l'un des plus singuliers : liquide à température ambiante alors que des molécules de taille comparable sont gazeuses, excellent solvant des sels. Données : H (\(Z = 1\)), O (\(Z = 8\)), S (\(Z = 16\)) ; électronégativités H 2,20, O 3,44 ; molécule d'eau coudée, angle H–O–H 104,5°, \(d(\mathrm{O{-}H}) = 96\ \text{pm}\), \(\mu = 1{,}85\ \text{D}\) ; \(1\ \text{D} = 3{,}336\times10^{-30}\ \text{C·m}\) ; \(e = 1{,}602\times10^{-19}\ \text{C}\) ; \(\varepsilon_0 = 8{,}854\times10^{-12}\ \text{F·m}^{-1}\) ; \(N_A = 6{,}022\times10^{23}\ \text{mol}^{-1}\) ; \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).</div>
  <p class="exo-part">Partie A — Structure</p>
  <div class="q"><strong>A1.</strong> Établir les schémas de Lewis de H₂O, de l'ion oxonium H₃O⁺ et de l'ion hydroxyde HO⁻, avec les charges formelles.</div>
  <div class="q"><strong>A2.</strong> Justifier qualitativement la géométrie coudée de l'eau et la valeur de l'angle, inférieure à 109,5°.</div>
  <p class="exo-part">Partie B — Polarité</p>
  <div class="q"><strong>B1.</strong> Représenter les moments de liaison et le moment dipolaire de la molécule (direction, sens).</div>
  <div class="q"><strong>B2.</strong> Calculer le moment d'une liaison O–H, puis les charges partielles portées par les atomes, en fraction de \(e\).</div>
  <p class="exo-part">Partie C — Liaison hydrogène et ébullition</p>
  <div class="q"><strong>C1.</strong> Les températures d'ébullition de H₂S, H₂Se et H₂Te (périodes 3, 4, 5) valent −60,3 °C, −41,3 °C et −2,2 °C. Par une régression linéaire en fonction du numéro de période, estimer la température d'ébullition « attendue » pour H₂O. Comparer à 100 °C et interpréter.</div>
  <div class="q"><strong>C2.</strong> L'enthalpie de vaporisation de l'eau vaut 40,7 kJ·mol⁻¹. Dans le liquide, chaque molécule participe à environ quatre liaisons hydrogène, chacune partagée entre deux molécules. En négligeant les autres interactions, estimer l'énergie d'une liaison hydrogène. Commenter.</div>
  <p class="exo-part">Partie D — L'eau solvant</p>
  <div class="q"><strong>D1.</strong> L'eau a une permittivité relative \(\varepsilon_r = 78\). Calculer l'énergie d'attraction, par mole, d'une paire Na⁺Cl⁻ au contact (distance 0,28 nm) dans le vide puis dans l'eau, et la comparer à \(RT\) à 25 °C.</div>
  <div class="q"><strong>D2.</strong> Décrire les étapes de la dissolution du chlorure de sodium dans l'eau, et l'orientation des molécules d'eau autour de chaque ion.</div>
  <div class="q"><strong>D3.</strong> L'eau est miscible à l'éthanol mais pas au cyclohexane. Interpréter. En déduire comment extraire le diiode d'une eau iodée.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> H₂O : 8 électrons ; O lié aux deux H, deux doublets non liants ; charges formelles nulles. H₃O⁺ : \(6 + 3 - 1 = 8\) électrons ; O lié à trois H, un doublet non liant ; \(C_F(\mathrm O) = 6 - 2 - 3 = +1\). HO⁻ : 8 électrons ; O lié à H, trois doublets non liants ; \(C_F(\mathrm O) = 6 - 6 - 1 = -1\).</p>
    <p><strong>A2.</strong> Quatre doublets autour de l'oxygène (deux liants, deux non liants) se repoussent ; ils pointent vers les sommets d'un tétraèdre, ce qui minimise l'énergie. Les deux H n'occupent que deux sommets : la molécule est coudée. Les doublets non liants, plus encombrants, resserrent l'angle H–O–H à 104,5°.</p>
    <p><strong>B1.</strong> \(\chi_{\mathrm O} \gt \chi_{\mathrm H}\) : chaque liaison est \(\mathrm O^{\delta-}\)–\(\mathrm H^{\delta+}\), de moment dirigé de O vers H. Le moment de la molécule, somme des deux, est porté par la bissectrice de l'angle, dirigé de l'oxygène vers le milieu des hydrogènes.</p>
    <p><strong>B2.</strong> \(\mu_{\mathrm{OH}} = \mu/(2\cos 52{,}25°) = 1{,}51\ \text{D}\). Charge partielle de chaque H : \( \delta = \mu_{\mathrm{OH}}/d \) \( = 1{,}51\times3{,}336\times10^{-30}/96\times10^{-12} \) \( = 5{,}2\times10^{-20}\ \text{C} \), soit \(0{,}33\,e\) ; l'oxygène porte \(-0{,}66\,e\).</p>
    <p><strong>C1.</strong> La droite des moindres carrés passant par (3 ; −60,3), (4 ; −41,3), (5 ; −2,2) a pour pente 29,1 °C par période et donne, pour la période 2, environ −93 °C. L'eau bout à 100 °C, soit près de 190 °C de plus : ses molécules sont liées par des liaisons hydrogène, absentes dans H₂S, H₂Se et H₂Te (S, Se, Te sont trop peu électronégatifs). Sans elles, l'eau serait un gaz à température ambiante.</p>
    <p><strong>C2.</strong> Quatre liaisons par molécule, chacune comptée deux fois : deux liaisons hydrogène par molécule en moyenne. Énergie par liaison : \(40{,}7/2 \approx 20\ \text{kJ·mol}^{-1}\). C'est dans la fourchette attendue (10 à 40 kJ·mol⁻¹), plus de vingt fois moins qu'une liaison covalente O–H (463 kJ·mol⁻¹), huit fois \(RT\). (L'estimation est un ordre de grandeur : dans le liquide, une partie des liaisons est déjà rompue, et les interactions de van der Waals contribuent aussi.)</p>
    <p><strong>D1.</strong> Dans le vide :</p>
    <div class="formula">$$E = \frac{N_A e^2}{4\pi\varepsilon_0 r} = \frac{6{,}022\times10^{23}\times(1{,}602\times10^{-19})^2}{4\pi\times8{,}854\times10^{-12}\times0{,}28\times10^{-9}} = 496\ \text{kJ·mol}^{-1}$$</div>
    <p>soit deux cents fois \(RT = 2{,}48\ \text{kJ·mol}^{-1}\). Dans l'eau : \(496/78 = 6{,}4\ \text{kJ·mol}^{-1}\), environ 2,6 \(RT\) : l'agitation thermique suffit à séparer les ions.</p>
    <p><strong>D2.</strong> Le cristal est déjà ionique (pas d'étape d'ionisation) : les ions se séparent (dissociation, facilitée par la grande permittivité) et s'entourent de molécules d'eau (solvatation) : autour de Na⁺, les oxygènes (δ−) sont tournés vers l'ion ; autour de Cl⁻, un hydrogène (δ+) de chaque molécule pointe vers l'ion, comme dans une liaison hydrogène. Ces interactions ion-dipôle compensent l'énergie nécessaire pour disperser le cristal.</p>
    <p><strong>D3.</strong> L'éthanol, comme l'eau, forme des liaisons hydrogène : en se mélangeant, chaque liquide remplace des liaisons rompues par des liaisons équivalentes. Le cyclohexane, apolaire, ne peut pas remplacer les liaisons hydrogène de l'eau qu'il faudrait rompre pour l'y disperser : deux phases se forment. Pour extraire le diiode (apolaire, bien plus soluble dans le cyclohexane que dans l'eau), on agite l'eau iodée avec du cyclohexane dans une ampoule à décanter ; la phase organique, moins dense, se colore en violet au-dessus.</p>
  </div>
</div>

    <p><strong>B1.</strong> Ce schéma distingue un oxygène des deux autres, alors que l'expérience montre trois liaisons identiques. On écrit trois formes mésomères, la double liaison sur chacun des O à tour de rôle, reliées par des flèches ↔ ; l'ion réel est un hybride des trois : une partie des électrons est délocalisée sur les trois liaisons.</p>
    <p><strong>B2.</strong> Autour de N : trois atomes liés, aucun doublet non liant, type AX₃ : ion plan triangulaire, angles de 120°. Ordre de liaison moyen : \((2 + 1 + 1)/3 = 4/3 \approx 1{,}33\). Les trois liaisons, équivalentes, ont une longueur intermédiaire entre celle d'une liaison simple et celle d'une liaison double N–O.</p>
