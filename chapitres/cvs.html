  <h3>Redresseur monoalternance</h3>
  <div class="statement">Un redresseur monoalternance (une diode idéale) est alimenté par \(v(t) = V_m\sin(\omega t)\), avec \(V_m = 20\ \text{V}\), et débite dans une résistance \(R = 50\ \Omega\).</div>
  <div class="q"><strong>Q1.</strong> Tracer l'allure de \(v_R(t)\). Quand la diode conduit-elle ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la valeur moyenne \(\langle v_R \rangle\) et la valeur efficace \(V_{R,\text{eff}}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance reçue par \(R\) et celle fournie par la source. Que vaut le produit des valeurs efficaces \(V_{\text{eff}}\,I_{\text{eff}}\) ? Est-ce une puissance ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La diode conduit quand \(v > 0\), soit pour \(\omega t \in [0, \pi]\) sur chaque période ; \(v_R = v\) pendant ces alternances, 0 sinon (la diode bloque alors \(v \lt 0\)) : une suite de demi-sinusoïdes positives.</p>
    <p><strong>Q2.</strong></p>
    <div class="formula">$$\langle v_R\rangle = \frac{1}{T}\int_0^{T/2}V_m\sin(\omega t)\,\mathrm{d}t = \frac{V_m}{\pi} \approx 6{,}37\ \text{V}$$</div>
    <div class="formula">$$V_{R,\text{eff}}^2 = \frac{1}{T}\int_0^{T/2}V_m^2\sin^2(\omega t)\,\mathrm{d}t = \frac{V_m^2}{4}$$</div>
    <p>d'où \(V_{R,\text{eff}} = V_m/2 = 10\ \text{V}\).</p>
    <p><strong>Q3.</strong> \(P_R = V_{R,\text{eff}}^2/R = 100/50 = 2\ \text{W}\). La diode idéale ne dissipe rien (\(v_D = 0\) quand elle conduit, \(i = 0\) quand elle bloque) : la source fournit exactement \(P = \langle v\,i\rangle = 2\ \text{W}\). Le produit des valeurs efficaces vaut \(V_{\text{eff}} I_{\text{eff}} = (20/\sqrt2) \times 0{,}2 \approx 2{,}83\ \text{VA}\) : ce n'est pas une puissance moyenne, c'est la puissance apparente (2ᵉ année). Leur rapport, \(2/2{,}83 \approx 0{,}71\), est le facteur de puissance : le courant non sinusoïdal charge la ligne sans transporter plus d'énergie.</p>
  </div>
</div>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> La tension redressée vaut \(|v|\) : \(\langle v_R\rangle = 2V\sqrt2/\pi = 2 \times 230\sqrt2/\pi \approx 207\ \text{V}\). Comme \(v_R^2 = v^2\), \(V_{R,\text{eff}} = 230\ \text{V}\), la valeur efficace du réseau.</p>

  <div class="statement">Un onduleur monophasé en pont (interrupteurs \(K_1, K_1'\) du bras A, \(K_2, K_2'\) du bras B, chacun formé d'un transistor et d'une diode antiparallèle) est alimenté par \(E = 100\ \text{V}\) et débite dans une charge \(R = 10\ \Omega\) en série avec \(L = 31{,}8\ \text{mH}\). Commande pleine onde à \(f = 50\ \text{Hz}\) : \(K_1, K_2'\) fermés sur \(]0, T/2[\), \(K_1', K_2\) sur \(]T/2, T[\).</div>
  <div class="q"><strong>Q1.</strong> Tracer \(u = v_A - v_B\). Donner sa valeur moyenne et sa valeur efficace.</div>
  <div class="q"><strong>Q2.</strong> Écrire l'équation du courant sur \(]0, T/2[\). En régime permanent, \(i(0) = -I_0\) et \(i(T/2) = +I_0\) : calculer \(\tau\) et \(I_0\).</div>
  <div class="q"><strong>Q3.</strong> À quel instant \(t_D\) le courant s'annule-t-il ? Quels composants conduisent avant et après \(t_D\) ?</div>
  <div class="q"><strong>Q4.</strong> Calculer l'énergie renvoyée à la source à chaque demi-période. Sachant que la source fournit 5,01 J pendant le reste de la demi-période, en déduire la puissance moyenne reçue par la charge.</div>
  <div class="q"><strong>Q5.</strong> Que se passerait-il sans les diodes antiparallèles ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u = +100\ \text{V}\) sur la première demi-période, \(-100\ \text{V}\) sur la seconde : créneau symétrique, \(\langle u\rangle = 0\) et \(U = E = 100\ \text{V}\) (car \(u^2 = E^2\) en permanence).</p>
    <p><strong>Q2.</strong> \(L\,\mathrm{d}i/\mathrm{d}t + Ri = E\), de solution \(i(t) = \dfrac{E}{R} - \left(\dfrac{E}{R} + I_0\right)e^{-t/\tau}\) avec \(\tau = L/R \approx 3{,}18\ \text{ms}\). La condition \(i(T/2) = I_0\) donne \(I_0 = \dfrac{E}{R}\tanh\dfrac{T}{4\tau}\). Ici \(T/4\tau = R/(4Lf) \approx 1{,}57\) (la charge a été choisie avec \(L\omega = R\)), d'où \(I_0 = 10\tanh(1{,}57) \approx 9{,}17\ \text{A}\).</p>
    <p><strong>Q3.</strong> \(i(t_D) = 0\) donne \(e^{-t_D/\tau} = E/(E + RI_0)\), soit \(t_D = \tau\ln(1 + RI_0/E)\), ou \(3{,}18\ln(1{,}917) \approx 2{,}07\ \text{ms}\). Avant \(t_D\), \(u = +E\) mais \(i \lt 0\) : le courant traverse \(K_1\) et \(K_2'\) à l'envers, ce sont les diodes \(D_1\) et \(D_2'\) qui conduisent. Après \(t_D\), \(i > 0\) : les transistors \(T_1\) et \(T_2'\) prennent le relais jusqu'à \(T/2\). Même scénario ensuite avec \(D_1', D_2\) puis \(T_1', T_2\).</p>
    <p><strong>Q4.</strong> Pendant la conduction des diodes, \(i_e = i \lt 0\). L'énergie renvoyée vaut \(W = -E\int_0^{t_D} i\,\mathrm{d}t\) ; avec la solution de Q2, \(\int_0^{t_D} i\,\mathrm{d}t = \dfrac{E}{R}t_D - \tau I_0\), d'où \(W = E\left(\tau I_0 - \dfrac{E}{R}t_D\right)\).</p>
    <div class="formula">$$W = 100 \times \left(3{,}18\cdot10^{-3} \times 9{,}17 - 10 \times 2{,}07\cdot10^{-3}\right) \approx 0{,}85\ \text{J}$$</div>
    <p>Bilan sur une demi-période : \(5{,}01 - 0{,}85 = 4{,}16\ \text{J}\) en 10 ms, soit \(P \approx 416\ \text{W}\). Contrôle : la valeur efficace du courant, calculée numériquement, vaut 6,45 A, et \(RI^2 \approx 416\ \text{W}\).</p>
    <p><strong>Q5.</strong> Au basculement, le courant inductif garde son signe : sans diode, aucun interrupteur ne pourrait le conduire, on ouvrirait une source de courant et la surtension détruirait les transistors. Les diodes donnent un chemin au courant et rendent à la source l'énergie stockée dans l'inductance.</p>
  </div>
</div>

<div class="exo">

  <div class="q"><strong>Q2.</strong> Calculer la puissance reçue par la résistance. Pourquoi n'est-elle pas égale à \(\langle u_R\rangle^2/R\) ?</div>
  <div class="q"><strong>Q3.</strong> Estimer les pertes par conduction du transistor et, avec le modèle du cours (majorant ici), ses pertes par commutation. En déduire le rendement.</div>
  <div class="q"><strong>Q4.</strong> On veut la même puissance de chauffe avec une résistance de réglage \(R_s\) en série, sans découpage. Calculer \(R_s\) et le rendement. Conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Conduction : \(I_{\text{on}} = E/(R + R_{DS(\text{on})}) = 48/10{,}1 \approx 4{,}75\ \text{A}\). Tension moyenne : \(\langle u_R\rangle = \alpha R I_{\text{on}} \approx 28{,}5\ \text{V}\) (28,8 V en négligeant \(R_{DS(\text{on})}\)) ; courant moyen \(\alpha I_{\text{on}} \approx 2{,}85\ \text{A}\).</p>
    <p><strong>Q2.</strong> La résistance ne reçoit de la puissance que pendant \(\alpha T\) : \(P_R = \alpha R I_{\text{on}}^2 = 0{,}6 \times 10 \times 4{,}75^2 \approx 135{,}5\ \text{W}\). Or \(\langle u_R\rangle^2/R \approx 81\ \text{W}\) : pour une charge résistive découpée, la puissance dépend de la valeur efficace (\(U_R = RI_{\text{on}}\sqrt\alpha\)), pas de la moyenne.</p>
    <p><strong>Q3.</strong> Conduction : \(\alpha R_{DS(\text{on})} I_{\text{on}}^2 = 0{,}6 \times 0{,}1 \times 22{,}6 \approx 1{,}36\ \text{W}\). Commutation : \(\tfrac12 \times 48 \times 4{,}75 \times 2\cdot10^{-7} \times 10^4 \approx 0{,}23\ \text{W}\) (sur charge résistive, tension et courant varient ensemble et les pertes réelles sont plus faibles). Rendement : \(135{,}5/(135{,}5 + 1{,}36 + 0{,}23) \approx 98{,}8\ \%\).</p>
    <p><strong>Q4.</strong> Même puissance : il faut \(I = \sqrt{P_R/R} \approx 3{,}68\ \text{A}\) en continu, donc \(R + R_s = 48/3{,}68 \approx 13{,}0\ \Omega\) et \(R_s \approx 3{,}04\ \Omega\). Elle dissipe \(R_s I^2 \approx 41\ \text{W}\) : rendement \(R/(R + R_s) \approx 77\ \%\). Le découpage perd 1,6 W là où la résistance de réglage en perd 41 : c'est pourquoi les alimentations et variateurs à découpage ont remplacé les montages dissipatifs.</p>

</div>

  <h3>Redresseur commandé à thyristor (hors programme, pour aller plus loin)</h3>
  <div class="statement">Un thyristor conduit un courant positif et bloque des tensions des deux signes ; il se ferme sur commande (impulsion de gâchette sous tension positive) et s'ouvre spontanément quand son courant s'annule. Un redresseur monoalternance à thyristor, amorcé avec un retard angulaire \(\psi\), est alimenté par \(v(t) = V_m\sin(\omega t)\) et débite dans une résistance \(R\).</div>
  <div class="q"><strong>Q1.</strong> Le thyristor conduit pour \(\omega t \in [\psi, \pi]\). Exprimer la valeur moyenne de \(v_R\) en fonction de \(\psi\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\langle v_R\rangle\) pour \(\psi = \pi/3\) et \(V_m = 100\ \text{V}\).</div>
  <div class="q"><strong>Q3.</strong> Quel est l'intérêt du thyristor par rapport à une diode ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong></p>
    <div class="formula">$$\langle v_R\rangle = \frac{1}{2\pi}\int_{\psi}^{\pi}V_m\sin\theta\,\mathrm{d}\theta = \frac{V_m}{2\pi}\,(1 + \cos\psi)$$</div>
    <p>(formule valable sur charge résistive : le courant s'annule avec la tension en \(\theta = \pi\)).</p>
    <p><strong>Q2.</strong> \(\langle v_R\rangle = \dfrac{100}{2\pi}(1 + 0{,}5) \approx 23{,}9\ \text{V}\), contre \(V_m/\pi \approx 31{,}8\ \text{V}\) pour \(\psi = 0\) (une diode) : 25 % de moins.</p>
    <p><strong>Q3.</strong> Le retard \(\psi \in [0, \pi]\) règle la tension moyenne de \(V_m/\pi\) à 0, sans résistance de réglage. Les ponts de thyristors alimentaient ainsi les moteurs à courant continu de forte puissance ; ils sont aujourd'hui remplacés par des redresseurs à diodes suivis de hacheurs, ou par des redresseurs à transistors commandés en MLI.</p>
  </div>
</div>

  <h3>Navette autonome d'entrepôt : du choix du convertisseur au rendement</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de sciences industrielles PT (thème <em>convertisseurs statiques</em>). Pour t'entraîner sur les sujets réellement tombés :

  <div class="statement">
    Une navette autonome transporte des palettes dans un entrepôt. Chaque roue motrice est entraînée par un moteur à courant continu à aimants (\(k = 0{,}25\ \text{V·s/rad}\), \(R = 0{,}15\ \Omega\), \(L = 0{,}4\ \text{mH}\)) à travers un réducteur parfait de rapport 1/10 (la roue tourne dix fois moins vite que le moteur) ; rayon de roue \(r = 0{,}1\ \text{m}\). L'énergie vient d'une batterie \(E = 48\ \text{V}\), et le convertisseur est un pont en H découpant à \(f_{\text{déc}} = 20\ \text{kHz}\). La navette roule en marche avant et en marche arrière, et freine en récupérant l'énergie.

  <p class="exo-part">Partie A — Chaîne de puissance et sources</p>
  <div class="q"><strong>A1.</strong> Associer chaque constituant à une fonction de la chaîne de puissance.</div>
  <div class="q"><strong>A2.</strong> Préciser la nature de la batterie et de l'induit vus du convertisseur ; justifier par un calcul pour l'induit.</div>
  <div class="q"><strong>A3.</strong> Quels quadrants du plan \((u, i)\) de la machine la navette utilise-t-elle ? Quelle réversibilité impose-t-elle au convertisseur ?</div>

  <p class="exo-part">Partie B — Synthèse du convertisseur</p>
  <div class="q"><strong>B1.</strong> Justifier le choix d'une structure à deux cellules.</div>
  <div class="q"><strong>B2.</strong> Relever les segments de \(K_1\) et en déduire sa réalisation. Pourquoi les quatre interrupteurs sont-ils identiques ?</div>
  <div class="q"><strong>B3.</strong> Pourquoi les commandes de \(K_1\) et \(K_1'\) doivent-elles être complémentaires, avec un temps mort ?</div>

  <p class="exo-part">Partie C — Commande et valeurs moyennes</p>
  <div class="q"><strong>C1.</strong> On ferme \(K_1\) et \(K_2'\) pendant \(\alpha T\), puis \(K_1'\) et \(K_2\) pendant \((1-\alpha)T\) (commande dite bipolaire). Montrer que \(\langle u\rangle = (2\alpha - 1)E\), le courant étant supposé constant.</div>
  <div class="q"><strong>C2.</strong> Traction en marche avant à \(v = 1{,}5\ \text{m/s}\), avec un effort de 400 N à la roue. Calculer \(\Omega\), \(E_m\), le couple moteur, \(i\), \(\langle u\rangle\), \(\alpha\) et la puissance fournie par la batterie. Comparer à la puissance mécanique.</div>
  <div class="q"><strong>C3.</strong> Freinage récupératif à la même vitesse, effort de −300 N à la roue. Mêmes questions. Quels composants conduisent pendant \(\alpha T\), puis pendant \((1-\alpha)T\) ?</div>

  <p class="exo-part">Partie D — Pertes et fréquence de découpage</p>
  <div class="q"><strong>D1.</strong> En traction (C2), les transistors sont des MOS (\(R_{DS(\text{on})} = 5\ \text{m}\Omega\), \(t_f + t_o = 150\ \text{ns}\)) et les diodes ont une chute \(V_F = 0{,}9\ \text{V}\). Évaluer les pertes par conduction et par commutation, puis le rendement du convertisseur.</div>
  <div class="q"><strong>D2.</strong> Un fournisseur propose de découper à 200 kHz « pour lisser le courant ». Qu'en penser ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Alimenter : batterie ; moduler : pont en H ; convertir : moteur à courant continu ; transmettre : réducteur ; agir : roue (contact avec le sol).</p>
    <p><strong>A2.</strong> La batterie impose sa tension : source de tension, réversible en courant (elle accepte la recharge au freinage). L'induit : \(\tau = L/R \approx 2{,}7\ \text{ms}\) contre \(T = 50\ \mu\text{s}\), soit plus de 50 fois moins : son courant varie peu sur une période, c'est une source de courant.</p>
    <p><strong>A3.</strong> \(u \approx k\Omega\) a le signe de la vitesse, \(i\) celui du couple. Traction avant : Q1 ; freinage avant : Q4 ; traction arrière : Q3 ; freinage arrière : Q2. Les quatre quadrants : le convertisseur doit être réversible en tension et en courant.</p>
    <p><strong>B1.</strong> Une cellule ne donne que \(u \in \{0, E\}\) ; pour inverser la tension de la machine (marche arrière), il faut \(u = \pm E\), donc deux cellules en pont : \(u = v_A - v_B\).</p>
    <p><strong>B2.</strong> \(K_1\) (orienté de + vers A) conduit \(i\), positif ou négatif, et bloque \(+E\) : trois segments. Passage \(i > 0 \leftrightarrow v_K = +E\) : produit positif, commandé, transistor ; passage \(i \lt 0 \leftrightarrow +E\) : produit négatif, spontané, diode. \(K_1\) est un transistor avec une diode antiparallèle. Le courant de la machine prend les deux signes et chaque interrupteur bloque \(+E\) : les quatre sont identiques.</p>
    <p><strong>B3.</strong> \(K_1\) et \(K_1'\) fermés ensemble court-circuiteraient la batterie ; ouverts ensemble, ils ouvriraient l'induit si aucune diode ne conduisait. Les transistors ne commutent pas instantanément : on laisse un temps mort où les deux sont commandés ouverts, et le courant passe alors par une diode antiparallèle.</p>
    <p><strong>C1.</strong> Pendant \(\alpha T\), A est relié au + et B au − : \(u = +E\). Pendant \((1-\alpha)T\) : \(u = -E\). Donc \(\langle u\rangle = \alpha E - (1-\alpha)E = (2\alpha - 1)E\), qui varie de \(-E\) à \(+E\).</p>
    <p><strong>C2.</strong> Vitesse de roue \(v/r = 15\ \text{rad/s}\), donc \(\Omega = 150\ \text{rad/s}\) et \(E_m = k\Omega = 37{,}5\ \text{V}\). Couple à la roue \(400 \times 0{,}1 = 40\ \text{N·m}\), couple moteur \(4\ \text{N·m}\), \(i = 4/0{,}25 = 16\ \text{A}\). Moyenne de \(u_L\) nulle : \(\langle u\rangle = E_m + Ri = 37{,}5 + 2{,}4 = 39{,}9\ \text{V}\), d'où \(\alpha = \tfrac12(1 + 39{,}9/48) \approx 0{,}916\). Batterie : \(\langle u\rangle i \approx 638\ \text{W}\) (avec \(\langle i_e\rangle = (2\alpha - 1)i \approx 13{,}3\ \text{A}\)) ; puissance mécanique \(400 \times 1{,}5 = 600\ \text{W}\) ; la différence, 38,4 W, est l'effet Joule \(Ri^2\) dans l'induit.</p>
    <p><strong>C3.</strong> Couple moteur \(-3\ \text{N·m}\), \(i = -12\ \text{A}\), \(\langle u\rangle = 37{,}5 - 1{,}8 = 35{,}7\ \text{V}\), \(\alpha = \tfrac12(1 + 35{,}7/48) \approx 0{,}872\). Batterie : \(35{,}7 \times (-12) \approx -428\ \text{W}\) : elle reçoit 428 W (450 W mécaniques moins 21,6 W de pertes Joule). Pendant \(\alpha T\) (\(K_1, K_2'\) commandés), le courant négatif traverse ces interrupteurs à l'envers : les diodes \(D_1\) et \(D_2'\) conduisent, \(u = +E\) et l'énergie va à la batterie. Pendant \((1-\alpha)T\), \(K_1'\) et \(K_2\) commandés : \(i \lt 0\) va dans le sens passant de \(T_1'\) et \(T_2\), qui conduisent, \(u = -E\).</p>
    <p><strong>D1.</strong> Pendant \(\alpha T\), \(T_1\) et \(T_2'\) conduisent : \(2R_{DS(\text{on})}i^2\alpha\), soit \(2 \times 0{,}005 \times 256 \times 0{,}916 \approx 2{,}34\ \text{W}\). Pendant \((1-\alpha)T\), le courant positif traverse \(K_1'\) et \(K_2\) à l'envers, donc leurs diodes : \(2V_F\,i\,(1-\alpha) \approx 2{,}43\ \text{W}\). Commutation : \(T_1\) et \(T_2'\) s'ouvrent et se ferment une fois par période :</p>
    <div class="formula">$$P_{\text{com}} = 2 \times \tfrac12 \times 48 \times 16 \times 1{,}5\cdot10^{-7} \times 2\cdot10^4 \approx 2{,}30\ \text{W}$$</div>
    <p>Total ≈ 7,1 W pour 638 W transmis : \(\eta \approx 98{,}9\ \%\).</p>
    <p><strong>D2.</strong> Les pertes par commutation sont proportionnelles à \(f_{\text{déc}}\) : elles passeraient à 23 W et le rendement tomberait vers 95,8 %, avec un dissipateur plus gros. Le gain est inutile : à 20 kHz, la période est déjà plus de 50 fois plus courte que \(\tau\), et le courant est bien lissé. Le choix de la fréquence est un compromis entre ondulation et pertes.</p>
  </div>
