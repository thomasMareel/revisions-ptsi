<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Entre la source d'énergie électrique et l'actionneur, le convertisseur statique assure la fonction <strong>moduler</strong> de la chaîne de puissance. Ce chapitre couvre la compétence B2 « Modéliser les convertisseurs statiques d'énergie » (semestre S2) : avec des <strong>sources parfaites</strong> et des <strong>interrupteurs parfaits</strong>, on sait dire quels montages sont permis, quels interrupteurs choisir et quelles tensions on obtient, ce qui suffit pour faire la synthèse d'un hacheur, d'un onduleur ou d'un redresseur. Le chapitre <a href="#hacheurs/cours">« Les hacheurs »</a> applique ces outils au continu-continu ; <a href="#triphase/cours">« Régimes alternatifs, redresseurs et onduleurs »</a> (2ᵉ année) les prolonge.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Identifier et décrire les chaînes fonctionnelles</strong> : fonctions alimenter, moduler, convertir, transmettre et agir (A3, S1) ; place et rôle du convertisseur statique (§1). La chaîne de puissance complète est dans <a href="#ingsys/cours">« Ingénierie système »</a>.</li>
        <li><strong>Caractéristiques des convertisseurs</strong> : nature des grandeurs d'entrée et de sortie, sources de tension et de courant (§1, §2) ; réversibilité des sources et des convertisseurs, quadrants (§3).</li>
        <li><strong>Modèles des interrupteurs parfaits</strong> : étude fonctionnelle des interrupteurs à deux ou trois segments, caractéristique statique (§4), commutations spontanée et commandée (§5).</li>
        <li><strong>Association des interrupteurs</strong> : règles d'association des sources parfaites, cellule élémentaire de commutation (§6).</li>
        <li><strong>Synthèse des convertisseurs</strong> (modulateurs d'énergie) à partir de la nature des sources, de leur réversibilité et de la bidirectionnalité des interrupteurs (§7), limitée au hacheur (§8), à l'onduleur (§9) et au redresseur (§10) ; étude structurelle des convertisseurs à deux ou trois cellules de commutation (§9, §10).</li>
        <li><strong>Pertes et rendement</strong> en ordres de grandeur, qui justifient le fonctionnement en commutation (§1, §11).</li>
      </ul>
      <p>Relèvent de la 2ᵉ année (S3, S4) : l'ondulation des grandeurs en régime permanent et les composants de filtrage, les puissances active, réactive et apparente et le facteur de puissance, le triphasé, le choix et le dimensionnement des composants (<a href="#triphase/cours">« Régimes alternatifs, redresseurs et onduleurs »</a>, <a href="#chfonc/cours">« Chaînes fonctionnelles »</a>). La physique des semi-conducteurs n'est pas au programme : seuls comptent les modèles d'interrupteurs. Hors programme, regroupés en fin de chapitre : le gradateur, le thyristor et les redresseurs commandés, les interrupteurs à quatre segments, les convertisseurs indirects.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · LE CONVERTISSEUR DANS LA CHAÎNE DE PUISSANCE</div>
  <h2>Moduler l'énergie électrique</h2>
  <div class="intro">Une batterie fournit une tension continue fixe, le réseau une tension alternative à 50 Hz ; un moteur, lui, réclame une tension réglable, continue ou alternative, et parfois de fréquence variable. Il faut donc adapter la forme de l'énergie et en doser le débit : c'est le travail du convertisseur statique, « statique » parce qu'il n'a aucune pièce en mouvement.</div>

  <h3>La fonction moduler</h3>
  <p>La chaîne de puissance d'un système enchaîne cinq fonctions : <strong>alimenter</strong> (batterie, réseau), <strong>moduler</strong> (convertisseur statique), <strong>convertir</strong> (moteur), <strong>transmettre</strong> (réducteur, poulies, vis) et <strong>agir</strong> (effecteur). Le modulateur est le seul maillon qui reçoit à la fois l'énergie et les <strong>ordres</strong> de la chaîne d'information : il laisse passer, à chaque instant, la quantité d'énergie demandée.</p>

  <div class="def-box">
    <p><strong>Convertisseur statique</strong> (ou modulateur d'énergie, préactionneur) : montage d'interrupteurs électroniques (diodes, transistors) qui, commandés convenablement, règlent le transfert d'énergie électrique entre une <strong>source d'entrée</strong> et une <strong>source de sortie</strong>, en modifiant la nature (continue ou alternative), la valeur ou la fréquence des grandeurs électriques.</p>
  </div>

  <h3>Quatre familles de conversion</h3>
  <table>
    <tr><th>Entrée → sortie</th><th>Convertisseur</th><th>Exemples d'emploi</th></tr>
    <tr><td>continu → continu</td><td>hacheur</td><td>vitesse variable d'un moteur à courant continu, chargeur de batterie, alimentation à découpage</td></tr>
    <tr><td>continu → alternatif</td><td>onduleur</td><td>variateur d'un moteur synchrone ou asynchrone, panneaux photovoltaïques raccordés au réseau, alimentation sans interruption</td></tr>
    <tr><td>alternatif → continu</td><td>redresseur</td><td>chargeur, alimentation d'un appareil sur secteur, étage d'entrée d'un variateur</td></tr>
    <tr><td>alternatif → alternatif</td><td>gradateur (hors programme)</td><td>variateur de lumière, démarreur progressif : même fréquence, valeur efficace réglable</td></tr>
  </table>
  <p>Sur un schéma fonctionnel, un convertisseur se représente par un carré barré d'une diagonale, avec la nature de l'entrée (=, ~) dans un coin et celle de la sortie dans l'autre. Les convertisseurs s'enchaînent : un variateur de vitesse industriel est un redresseur, suivi d'un bus continu filtré par un condensateur, suivi d'un onduleur (2ᵉ année).</p>

  <h3>Pourquoi des interrupteurs ?</h3>
  <p>Un interrupteur parfait n'a que deux états : fermé, la tension à ses bornes est nulle ; ouvert, le courant qui le traverse est nul. Dans les deux cas, la puissance qu'il reçoit \( p = v\,i \) est nulle : il ne dissipe rien. Un convertisseur fait d'interrupteurs <strong>découpe</strong> les grandeurs électriques sans perte, et l'on règle les valeurs <strong>moyennes</strong> par la durée relative des états. C'est ce qui le distingue d'une résistance de réglage (rhéostat), qui obtient la même tension en dissipant la différence.</p>
  <div class="method-box"><strong>Exemple — Rhéostat ou découpage ?</strong>
    <p>Un moteur absorbe 10 A sous 24 V ; on l'alimente par une batterie de 48 V.</p>
    <ol>
      <li><strong>Rhéostat en série</strong> : il doit prendre 24 V sous 10 A, soit \( R_s = 2{,}4\ \Omega \), et dissiper \( 24 \times 10 = 240\ \text{W} \). Rendement : \( 240/480 = 50\ \% \), et une résistance à refroidir comme un radiateur.</li>
      <li><strong>Découpage</strong> : le moteur est relié à la batterie la moitié du temps (§6, rapport cyclique 0,5) ; sa tension moyenne vaut 24 V. Les pertes des interrupteurs réels sont de quelques watts (§11) : avec 5 W, le rendement est \( 240/245 \approx 98\ \% \).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'un convertisseur « fabrique » de la puissance. Il ne fait que la transmettre, au mieux sans perte : \( P_{\text{sortie}} \leq P_{\text{entrée}} \). Un abaisseur de tension délivre donc un courant moyen <em>plus grand</em> que celui qu'il prélève (§6).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SOURCES DE TENSION ET SOURCES DE COURANT</div>
  <h2>La nature des sources commande tout</h2>
  <div class="intro">Un convertisseur relie deux « sources » au sens large : celle qui alimente et celle qui est alimentée. Ce qui compte n'est pas de savoir laquelle fournit l'énergie, mais ce qu'elle <strong>impose</strong> : une tension ou un courant. C'est cette nature qui fixe les connexions permises (§6).</div>
  <div class="def-box">
    <p><strong>Source de tension parfaite</strong> : dipôle qui impose la tension à ses bornes, quel que soit le courant qu'il débite ou reçoit. Exemples : batterie, réseau, condensateur de forte capacité.</p>
    <p><strong>Source de courant parfaite</strong> : dipôle qui impose le courant qui le traverse, quelle que soit la tension à ses bornes. Exemples : branche contenant une forte inductance, induit d'un moteur à courant continu.</p>
  </div>
  <p>Le mot « source » ne veut pas dire « générateur » : un moteur qui consomme de l'énergie est, pour le convertisseur qui l'alimente, une source de courant. On parle de source pour dire que le dipôle fixe l'une des deux grandeurs.</p>

  <h3>Inductance et condensateur : des sources « dynamiques »</h3>
  <p>Les relations des dipôles de stockage, en convention récepteur, montrent pourquoi :</p>
  <div class="formula" data-nom="Inductance et condensateur">$$u_L = L\,\frac{\mathrm{d}i}{\mathrm{d}t} \qquad i_C = C\,\frac{\mathrm{d}u_C}{\mathrm{d}t}$$</div>
  <div class="prop-box">
    <p><strong>Continuité.</strong> Le courant dans une inductance et la tension aux bornes d'un condensateur sont des fonctions continues du temps : un saut de courant dans \( L \) demanderait une tension infinie, un saut de tension aux bornes de \( C \) un courant infini (et une variation instantanée de l'énergie \( \tfrac12 L i^2 \) ou \( \tfrac12 C u_C^2 \)).</p>
    <p>Une branche qui contient une inductance se comporte donc, pendant une commutation, comme une <strong>source de courant</strong> ; un condensateur placé en parallèle fait d'une branche une <strong>source de tension</strong>.</p>
  </div>
  <p>Le modèle est d'autant meilleur que la période de découpage \( T \) est courte devant la constante de temps du circuit (\( \tau = L/R \) pour une branche inductive) : pendant \( T \), le courant n'a pas le temps de varier beaucoup. En ordre de grandeur, on vise \( T \lt \tau/10 \), soit \( f_{\text{déc}} > 10/\tau \). Avec des constantes de temps de quelques millisecondes et des fréquences de découpage de 10 à 20 kHz, c'est largement le cas.</p>
  <div class="prop-box">
    <p><strong>Régime périodique établi.</strong> Sur une période, la valeur moyenne de la tension aux bornes d'une inductance et celle du courant dans un condensateur sont nulles :</p>
    <div class="formula" data-nom="Moyennes en régime périodique">$$\langle u_L\rangle = 0 \qquad \langle i_C\rangle = 0$$</div>
    <p>C'est l'outil de base des calculs de valeurs moyennes dans les convertisseurs (§8).</p>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Pourquoi la tension moyenne aux bornes d'une inductance est nulle</span><div class="content">
    <p>En régime périodique de période \( T \), \( i(t+T) = i(t) \). On intègre \( u_L = L\,\mathrm{d}i/\mathrm{d}t \) sur une période : \( \int_0^T u_L\,\mathrm{d}t = L\,\big(i(T) - i(0)\big) = 0 \), donc \( \langle u_L\rangle = 0 \). Même raisonnement pour \( i_C = C\,\mathrm{d}u_C/\mathrm{d}t \) avec \( u_C(T) = u_C(0) \). Conséquence : une inductance laisse passer la valeur moyenne de la tension sans la modifier, et ne « voit » que les variations.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — L'induit d'un moteur est-il une source de courant ?</strong>
    <p>Induit : \( R = 0{,}4\ \Omega \), \( L = 2\ \text{mH} \) ; découpage à \( f_{\text{déc}} = 16\ \text{kHz} \), courant moyen 10 A.</p>
    <ol>
      <li>\( \tau = L/R = 5\ \text{ms} \) et \( T = 1/f_{\text{déc}} = 62{,}5\ \mu\text{s} \) : la période est 80 fois plus courte que \( \tau \).</li>
      <li>Si l'inductance reçoit \( u_L \approx 24\ \text{V} \) pendant une demi-période, le courant varie de \( \Delta i \approx u_L\,\Delta t/L \), soit \( 24 \times 31{,}25\ \mu\text{s}/2\ \text{mH} \approx 0{,}38\ \text{A} \) : moins de 4 % de 10 A.</li>
      <li>Conclusion : vu du convertisseur, l'induit est une source de courant (quasi) parfaite. De même, un condensateur de 1 mF qui débite 20 A pendant 50 µs ne perd que \( \Delta u = I\,\Delta t/C = 1\ \text{V} \) : c'est une source de tension.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : « une inductance, c'est un fil ». C'est vrai pour la valeur moyenne en régime périodique et en continu établi ; à l'échelle d'une commutation, c'est tout le contraire : elle s'oppose à toute variation brutale du courant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · RÉVERSIBILITÉ ET QUADRANTS</div>
  <h2>Dans quel sens circule l'énergie ?</h2>
  <div class="intro">Un véhicule qui freine, une charge qui descend, une batterie qu'on recharge : l'énergie doit pouvoir revenir vers la source. Le convertisseur doit le permettre, et la façon dont il le permet dépend du signe des grandeurs qui changent.</div>
  <div class="def-box">
    <p>Une source est <strong>réversible en tension</strong> si sa tension peut changer de signe, <strong>réversible en courant</strong> si son courant peut changer de signe. Elle peut fournir puis recevoir de l'énergie dès qu'elle est réversible en tension <em>ou</em> en courant. Un <strong>convertisseur réversible</strong> permet le transfert d'énergie dans les deux sens.</p>
  </div>
  <ul>
    <li><strong>Batterie</strong> : tension de signe fixe, courant des deux signes (décharge, recharge) : réversible en courant.</li>
    <li><strong>Réseau alternatif</strong> : tension et courant changent de signe à chaque demi-période.</li>
    <li><strong>Résistance</strong> : \( p = Ri^2 \geq 0 \), non réversible.</li>
    <li><strong>Machine à courant continu</strong> : \( u \approx E_m = k\Omega \) a le signe de la vitesse, \( i = C_{em}/k \) celui du couple (notations du chapitre <a href="#mcc/cours">« Machine à courant continu »</a>, où la f.é.m. est notée \( E \) ; ici \( E \) désigne la source continue).</li>
  </ul>

  <div class="prop-box">
    <p><strong>Lecture des quadrants</strong> (plan \( (u, i) \) de la charge, convention récepteur, \( p = u\,i \)). Dans Q1 et Q3, la charge reçoit de l'énergie ; dans Q2 et Q4, elle en renvoie. Le convertisseur doit couvrir tous les quadrants du cahier des charges :</p>

      <li>Q1 seul : hacheur série (§8) ;</li>
      <li>Q1 et Q4 (\( u > 0 \), \( i \) des deux signes) : convertisseur <strong>réversible en courant</strong> ;</li>
      <li>Q1 et Q2 (\( i > 0 \), \( u \) des deux signes) : convertisseur <strong>réversible en tension</strong> ;</li>
      <li>les quatre quadrants : réversible en tension et en courant (pont en H, onduleur).</li>
    </ul>
  </div>
  <div class="method-box"><strong>Exemple — Le monte-charge</strong>
    <p>Un moteur à courant continu (\( k = 1{,}2\ \text{V·s/rad} \), \( R = 0{,}8\ \Omega \)) entraîne un monte-charge. Ramené à l'arbre moteur, le poids de la charge exige un couple de 18 N·m, toujours dans le même sens. Vitesses : \( \Omega = \pm 20\ \text{rad/s} \).</p>
    <ol>
      <li>Le couple du moteur retient toujours la charge : \( i = C_{em}/k = 18/1{,}2 = 15\ \text{A} > 0 \), à la montée comme à la descente.</li>
      <li>Montée : \( u = k\Omega + Ri = 24 + 12 = 36\ \text{V} \), \( p = 540\ \text{W} \) : quadrant Q1.</li>
      <li>Descente : \( u = -24 + 12 = -12\ \text{V} \), \( p = -180\ \text{W} \) : quadrant Q2. La charge fournit \( 18 \times 20 = 360\ \text{W} \) ; 180 W sont perdus par effet Joule dans l'induit et 180 W reviennent vers la source.</li>
      <li>Conclusion : il faut un convertisseur <strong>réversible en tension</strong>, pas en courant. Sa synthèse est faite au §7.</li>
    </ol>
  </div>
  <div class="notice"><strong>Attention au plan.</strong> La numérotation des quadrants dépend du plan choisi. Les chapitres sur les machines travaillent dans le plan \( (C_{em}, \Omega) \) : le freinage en marche avant y est le quadrant 2, alors qu'il est le quadrant 4 dans le plan \( (u, i) \) de la figure. Toujours préciser le plan avant de nommer un quadrant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · INTERRUPTEURS PARFAITS ET CARACTÉRISTIQUES STATIQUES</div>
  <h2>Deux états, des segments</h2>
  <div class="intro">Pour concevoir un convertisseur, on n'a pas besoin de la physique des semi-conducteurs : il suffit de savoir quels couples (tension, courant) un interrupteur accepte, et comment il passe d'un état à l'autre (§5).</div>
  <div class="def-box">
    <p><strong>Interrupteur parfait</strong> : dipôle à deux états, orienté en convention récepteur (tension \( v_K \), courant \( i_K \)).</p>
    <ul>
      <li><strong>Fermé</strong> (passant) : \( v_K = 0 \), le courant \( i_K \) est imposé par le reste du circuit ;</li>
      <li><strong>ouvert</strong> (bloqué) : \( i_K = 0 \), la tension \( v_K \) est imposée par le reste du circuit.</li>
    </ul>
    <p>Sa <strong>caractéristique statique</strong> est l'ensemble des points \( (v_K, i_K) \) qu'il peut occuper : des demi-axes, appelés <strong>segments</strong>. Un interrupteur est unidirectionnel ou bidirectionnel en courant (un ou deux segments sur l'axe des courants), unidirectionnel ou bidirectionnel en tension (un ou deux segments sur l'axe des tensions).</p>
  </div>

  <h3>Les composants</h3>
  <table>
    <tr><th>Interrupteur</th><th>Segments</th><th>Commande</th></tr>
    <tr><td>Diode</td><td>2 : conduit \( i_K > 0 \), bloque \( v_K \lt 0 \)</td><td>aucune : elle se ferme et s'ouvre selon le circuit</td></tr>
    <tr><td>Transistor (MOS, IGBT)</td><td>2 : conduit \( i_K > 0 \), bloque \( v_K > 0 \)</td><td>fermé ou ouvert par la tension de grille (≈ 15 V pour fermer, 0 ou négative pour ouvrir)</td></tr>
    <tr><td>Transistor + diode antiparallèle</td><td>3 : bidirectionnel en courant, bloque \( v_K > 0 \)</td><td>le transistor conduit \( i_K > 0 \), la diode \( i_K \lt 0 \)</td></tr>
    <tr><td>Transistor + diode en série</td><td>3 : conduit \( i_K > 0 \), bidirectionnel en tension</td><td>la diode tient la tension négative que le transistor ne supporte pas</td></tr>
  </table>
  <p>Les transistors de puissance sont de deux familles : le <strong>MOS</strong> (grille, drain, source), pour les tensions modestes (jusqu'à quelques centaines de volts) et les découpages rapides (jusqu'à quelques centaines de kHz), et l'<strong>IGBT</strong> (grille, collecteur, émetteur), pour les fortes tensions (600 V à quelques kV) et les fortes puissances, avec un découpage de quelques kHz à une vingtaine de kHz. L'association transistor + diode antiparallèle est de loin la plus répandue : c'est l'interrupteur des ponts, donc des hacheurs réversibles et des onduleurs ; les modules du commerce l'intègrent dans un même boîtier.</p>
  <div class="method-box"><strong>Exemple — Quel interrupteur pour ces points de fonctionnement ?</strong>
    <p>Dans un montage, un interrupteur doit conduire tantôt +15 A, tantôt −15 A, et bloquer une tension de +300 V.</p>
    <ol>
      <li>Segments à l'état fermé : \( i_K > 0 \) et \( i_K \lt 0 \) : bidirectionnel en courant.</li>
      <li>Segment à l'état ouvert : \( v_K > 0 \) seulement : unidirectionnel en tension.</li>
      <li>Trois segments : un transistor (qui conduit +15 A et bloque +300 V) avec une diode en antiparallèle (qui conduit −15 A). Le composant réel est choisi avec une marge en tension (2ᵉ année).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dire que la diode antiparallèle conduit « quand la tension devient négative ». Fermé, l'interrupteur impose \( v_K = 0 \) : c'est le <strong>signe du courant</strong> imposé par le circuit qui décide si le transistor (\( i_K > 0 \)) ou la diode (\( i_K \lt 0 \)) conduit. La tension aux bornes ne devient jamais négative : la diode l'en empêche.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · COMMUTATIONS SPONTANÉES ET COMMANDÉES</div>
  <h2>Qui décide du changement d'état ?</h2>
  <div class="intro">La caractéristique statique dit où l'interrupteur peut se trouver ; reste à savoir comment il passe d'un segment à l'autre. Soit le circuit l'y oblige de lui-même, soit il faut un ordre : c'est ce qui sépare la diode du transistor.</div>
  <div class="def-box">
    <p><strong>Commutation spontanée</strong> : changement d'état provoqué par le circuit extérieur. Le point de fonctionnement passe par l'origine : <em>amorçage</em> quand la tension \( v_K \) s'annule en croissant, <em>blocage</em> quand le courant \( i_K \) s'annule.</p>
    <p><strong>Commutation commandée</strong> : changement d'état provoqué par un ordre (tension de grille). Le point de fonctionnement traverse un quadrant où \( v_K\,i_K > 0 \) : l'interrupteur y reçoit de l'énergie, et rien dans le circuit ne l'y pousse.</p>
  </div>

  <div class="prop-box">
    <p><strong>Règle des signes.</strong> Pour un interrupteur qui passe de l'état fermé (courant \( i_{\text{on}} \neq 0 \)) à l'état ouvert (tension \( v_{\text{off}} \neq 0 \)) ou l'inverse, les deux grandeurs étant orientées en convention récepteur :</p>
    <ul>
      <li>si \( v_{\text{off}}\,i_{\text{on}} > 0 \), la commutation est <strong>commandée</strong> (transistor) ;</li>
      <li>si \( v_{\text{off}}\,i_{\text{on}} \lt 0 \), la commutation est <strong>spontanée</strong> (diode).</li>
    </ul>
    <p>Le résultat ne dépend pas de l'orientation choisie : la changer change les deux signes.</p>
  </div>
  <p>Une diode conduit avec \( i_K > 0 \) et bloque \( v_K \lt 0 \) : produit négatif, ses commutations sont toujours spontanées. Un transistor conduit avec \( i_K > 0 \) et bloque \( v_K > 0 \) : produit positif, il faut le commander à la fermeture comme à l'ouverture. Pour un interrupteur à trois segments, la nature de la commutation dépend du segment utilisé : avec la diode antiparallèle, le passage \( i_K > 0 \to v_K > 0 \) est commandé (le transistor s'ouvre), le passage \( i_K \lt 0 \to v_K > 0 \) est spontané (la diode se bloque).</p>
  <div class="method-box"><strong>Exemple — Les deux interrupteurs du hacheur série</strong>
    <p>Une source de tension \( E > 0 \) alimente une source de courant \( I > 0 \) à travers deux interrupteurs \( K \) (en haut) et \( K' \) (en bas), comme dans la figure du §6. On oriente \( K \) de la borne + vers le point milieu, \( K' \) de la borne − vers le point milieu.</p>
    <ol>
      <li>\( K \) fermé : il conduit \( i_K = I > 0 \). \( K \) ouvert (\( K' \) fermé) : il supporte \( v_K = E > 0 \). Produit \( EI > 0 \) : commutations commandées, c'est un <strong>transistor</strong>.</li>
      <li>\( K' \) fermé : il conduit \( i_{K'} = I > 0 \) (le courant de la charge revient par lui). \( K' \) ouvert : il supporte \( v_{K'} = -E \). Produit \( -EI \lt 0 \) : commutations spontanées, c'est une <strong>diode</strong>, anode côté −.</li>
      <li>Le transistor impose le rythme ; la diode suit : elle se bloque quand le transistor prend le courant, et se ferme quand il le lâche.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une diode et un transistor sont interchangeables parce que tous deux ne conduisent que dans un sens. Ils ne bloquent pas la même tension (\( v_K \lt 0 \) contre \( v_K > 0 \)) et ne commutent pas de la même façon. Une diode à la place du transistor ne conduirait jamais.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LA CELLULE DE COMMUTATION</div>
  <h2>La brique de base de tous les convertisseurs</h2>
  <div class="intro">Deux règles sur les sources, deux interrupteurs complémentaires : on obtient la cellule de commutation, dont tous les convertisseurs du programme sont faits.</div>

  <h3>Règles d'interconnexion des sources</h3>
  <div class="prop-box">
    <p><strong>Règles d'association des sources parfaites.</strong></p>
    <ol>
      <li>Une source de tension ne doit <strong>jamais être court-circuitée</strong> (courant infini) ; elle peut être laissée ouverte.</li>
      <li>Une source de courant ne doit <strong>jamais être ouverte</strong> (tension infinie : \( L\,\mathrm{d}i/\mathrm{d}t \)) ; elle peut être court-circuitée.</li>
      <li>On ne relie directement que des sources de <strong>natures différentes</strong> : jamais deux sources de tension en parallèle, jamais deux sources de courant en série.</li>
    </ol>
  </div>
  <p>Conséquence : un convertisseur à liaison directe relie une source de tension à une source de courant. Si les deux sources sont de même nature (deux batteries, par exemple), on en change une en intercalant une inductance en série ou un condensateur en parallèle. Un interrupteur qui s'ouvre sur une charge inductive sans autre chemin pour le courant crée une surtension destructrice : c'est le rôle de la <strong>diode de roue libre</strong>.</p>

  <h3>La cellule</h3>
  <div class="def-box">
    <p><strong>Cellule élémentaire de commutation</strong> : deux interrupteurs \( K \) et \( K' \) en série aux bornes d'une source de tension \( E \) ; une source de courant \( I \) est branchée entre leur point commun \( M \) et une borne de \( E \). Les deux interrupteurs sont <strong>complémentaires</strong> : à chaque instant, un et un seul est fermé.</p>
  </div>

</figure>
  <p>La complémentarité découle directement des règles : \( K \) et \( K' \) fermés ensemble court-circuiteraient \( E \) ; ouverts ensemble, ils ouvriraient \( I \). En pratique, on ménage un <strong>temps mort</strong> (de quelques centaines de nanosecondes à quelques microsecondes) entre l'ouverture d'un transistor et la fermeture de l'autre, pour ne jamais risquer le court-circuit. Pendant ce temps mort, le courant \( I \) doit pouvoir passer par une diode : c'est une raison de plus pour les diodes antiparallèles des ponts.</p>
  <p>Si \( K \) est fermé pendant \( \alpha T \) sur chaque période \( T \) (\( \alpha \) : <strong>rapport cyclique</strong>, \( 0 \leq \alpha \leq 1 \)), la tension \( u \) appliquée à la source de courant est un créneau entre \( E \) et 0, et le courant \( i_e \) prélevé à la source de tension un créneau entre \( I \) et 0 :</p>
  <div class="formula" data-nom="Cellule : valeurs moyennes">$$\langle u\rangle = \alpha E \qquad \langle i_e\rangle = \alpha I \qquad E\,\langle i_e\rangle = \langle u\rangle\, I$$</div>
  <p>La dernière égalité traduit la conservation de la puissance : une cellule parfaite transmet sans perte, en abaissant la tension et en augmentant le courant dans le même rapport \( \alpha \). La valeur efficace du créneau vaut \( U = E\sqrt{\alpha} \), car \( u^2 \) vaut \( E^2 \) pendant \( \alpha T \) et 0 ensuite.</p>
  <div class="method-box"><strong>Exemple — Une cellule chiffrée</strong>
    <p>\( E = 48\ \text{V} \), \( I = 10\ \text{A} \), \( \alpha = 0{,}25 \).</p>
    <ol>
      <li>\( \langle u\rangle = 0{,}25 \times 48 = 12\ \text{V} \) et \( U = 48\sqrt{0{,}25} = 24\ \text{V} \) : un voltmètre en position DC lit 12 V, un voltmètre RMS vrai en position AC+DC lit 24 V.</li>
      <li>\( \langle i_e\rangle = 0{,}25 \times 10 = 2{,}5\ \text{A} \).</li>
      <li>Puissance : \( E\langle i_e\rangle = 48 \times 2{,}5 = 120\ \text{W} = \langle u\rangle I = 12 \times 10 \). La source fournit 2,5 A en moyenne, la charge reçoit 10 A.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : calculer une puissance par \( \langle u\rangle\langle i\rangle \) sans justification. La puissance moyenne est \( P = \langle u\,i\rangle \) ; elle vaut \( \langle u\rangle I \) ici parce que le courant \( i = I \) est constant. Pour une charge résistive découpée, \( P = \langle u^2\rangle/R = U^2/R \neq \langle u\rangle^2/R \).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SYNTHÈSE D'UN CONVERTISSEUR</div>
  <h2>Des sources aux interrupteurs</h2>
  <div class="intro">Faire la synthèse d'un convertisseur, c'est trouver sa structure et ses interrupteurs à partir du seul cahier des charges : la nature des sources, le signe des grandeurs et les réversibilités exigées. Les trois sections suivantes appliquent cette démarche au hacheur, à l'onduleur et au redresseur.</div>
  <div class="method-box"><strong>Méthode — Démarche de synthèse</strong>
    <ol>
      <li><strong>Nature des sources</strong> : tension ou courant ? Si les deux sont de même nature, ajouter une inductance en série ou un condensateur en parallèle (§2).</li>
      <li><strong>Réversibilités</strong> : signes possibles de la tension de la source de tension et du courant de la source de courant ; quadrants à couvrir (§3).</li>
      <li><strong>Structure</strong> : si la tension appliquée à la source de courant peut rester positive (\( u \in \{0, E\} \)), une cellule suffit ; s'il faut \( u = \pm E \), deux cellules en pont ; trois cellules pour le triphasé.</li>
      <li><strong>Segments</strong> : pour chaque interrupteur, relever le courant qu'il conduit fermé et la tension qu'il supporte ouvert, dans tous les cas de fonctionnement (§4).</li>
      <li><strong>Commutations</strong> : la règle des signes (§5) dit, segment par segment, s'il faut un transistor ou une diode.</li>
      <li><strong>Vérifications</strong> : complémentarité dans chaque cellule, temps morts, sens du transfert d'énergie dans chaque phase.</li>
    </ol>
  </div>
  <table>
    <tr><th>Cahier des charges</th><th>Structure</th><th>Interrupteurs</th></tr>
    <tr><td>\( E > 0 \), \( I > 0 \), \( u \in \{0, E\} \)</td><td>1 cellule : hacheur série</td><td>1 transistor, 1 diode</td></tr>
    <tr><td>\( E > 0 \), \( I \) des deux signes, \( u \geq 0 \)</td><td>1 cellule : hacheur réversible en courant</td><td>2 × (transistor + diode antiparallèle)</td></tr>
    <tr><td>\( E > 0 \), \( I > 0 \), \( u = \pm E \)</td><td>2 cellules : pont asymétrique</td><td>2 transistors, 2 diodes</td></tr>
    <tr><td>\( E > 0 \), \( I \) des deux signes, \( u = \pm E \)</td><td>2 cellules : pont en H, onduleur</td><td>4 × (transistor + diode antiparallèle)</td></tr>
    <tr><td>\( v \) alternative, \( I > 0 \)</td><td>2 cellules : pont de diodes (3 en triphasé)</td><td>4 diodes (6 en triphasé)</td></tr>
  </table>
  <div class="method-box"><strong>Exemple — Synthèse du convertisseur du monte-charge (§3)</strong>
    <p>Batterie \( E = 48\ \text{V} \) ; moteur : \( i > 0 \) toujours, \( u = 36\ \text{V} \) à la montée et \( u = -12\ \text{V} \) à la descente.</p>
    <ol>
      <li>Sources : batterie = source de tension, réversible en courant (elle accepte la recharge) ; induit (avec son inductance) = source de courant \( i > 0 \), réversible en tension.</li>
      <li>Structure : \( u \) doit changer de signe, donc deux cellules en pont : bras 1 (\( K_1 \) en haut, \( K_1' \) en bas, point milieu A), bras 2 (\( K_2 \), \( K_2' \), point milieu B), \( u = v_A - v_B \).</li>
      <li>Segments, en orientant les interrupteurs du bas vers le haut : \( K_1 \) conduit \( +i \) quand A est relié au + et bloque \( +E \) sinon : produit positif, <strong>transistor</strong> \( T_1 \). \( K_1' \) conduit \( +i \) quand A est relié au − et bloque \( -E \) sinon : <strong>diode</strong> \( D_1' \). Par symétrie, \( K_2 \) est une diode \( D_2 \) et \( K_2' \) un transistor \( T_2' \).</li>
      <li>Fonctionnement : \( T_1 \) et \( T_2' \) fermés, \( u = +E \) ; tous deux ouverts, le courant passe par \( D_1' \) et \( D_2 \) et \( u = -E \) (l'énergie remonte vers la batterie) ; un seul fermé, \( u = 0 \) (roue libre).</li>
      <li>Réglage : en alternant \( u = +E \) pendant \( \alpha T \) et \( u = -E \) pendant \( (1-\alpha)T \), \( \langle u\rangle = (2\alpha - 1)E \). Montée : \( \alpha = (1 + 36/48)/2 = 0{,}875 \) ; descente : \( \alpha = (1 - 12/48)/2 = 0{,}375 \).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§8 · HACHEURS : LE CONTINU-CONTINU</div>
  <h2>Une ou deux cellules entre deux sources continues</h2>
  <div class="intro">Le chapitre <a href="#hacheurs/cours">« Les hacheurs »</a> détaille leur fonctionnement, leur commande et leur emploi avec un moteur à courant continu. On résume ici ce que la synthèse donne, pour situer le hacheur parmi les autres convertisseurs.</div>
  <p>Le <strong>hacheur série</strong> (abaisseur) est la cellule de l'exemple du §5 : un transistor commandé avec un rapport cyclique \( \alpha \), une diode de roue libre. Pendant \( \alpha T \), le transistor conduit et \( u = E \) ; pendant \( (1-\alpha)T \), la diode conduit et \( u = 0 \). Avec l'inductance de la charge, le courant ondule autour de sa valeur moyenne.</p>

<figcaption>Hacheur série (\(E = 48\ \text{V}\), \(\alpha = 0{,}6\), \(f_{\text{déc}} = 10\ \text{kHz}\), \(R = 0{,}5\ \Omega\), \(L = 0{,}5\ \text{mH}\), \(E_m = 26\ \text{V}\)). Régime périodique calculé : \(i\) oscille entre 4,44 et 6,75 A autour de \(\langle i\rangle = 5{,}6\ \text{A}\). Le transistor conduit pendant \(\alpha T\), la diode pendant \((1-\alpha)T\).</figcaption>
</figure>
  <div class="formula" data-nom="Hacheur série">$$\langle u\rangle = \alpha E$$</div>
  <p>Avec un moteur (\( u = E_m + Ri + L\,\mathrm{d}i/\mathrm{d}t \)), la moyenne sur une période donne, puisque \( \langle u_L\rangle = 0 \) (§2) : \( \alpha E = E_m + R\langle i\rangle \). Le rapport cyclique règle la tension moyenne, donc la vitesse ; la fréquence de découpage ne joue que sur l'ondulation du courant.</p>
  <div class="method-box"><strong>Exemple — Hacheur série et moteur</strong>
    <p>\( E = 48\ \text{V} \), \( \alpha = 0{,}6 \), \( f_{\text{déc}} = 10\ \text{kHz} \) ; induit : \( R = 0{,}5\ \Omega \), \( L = 0{,}5\ \text{mH} \), \( E_m = 26\ \text{V} \) à la vitesse considérée.</p>
    <ol>
      <li>\( \langle u\rangle = 0{,}6 \times 48 = 28{,}8\ \text{V} \), d'où \( \langle i\rangle = (28{,}8 - 26)/0{,}5 = 5{,}6\ \text{A} \).</li>
      <li>Courant moyen fourni par la batterie : \( \langle i_e\rangle \approx \alpha\langle i\rangle = 3{,}36\ \text{A} \) ; puissance : \( 48 \times 3{,}36 \approx 161\ \text{W} = 28{,}8 \times 5{,}6 \).</li>
      <li>Ondulation (formule établie dans « Les hacheurs », \( R \) négligée) :
      <div class="formula">$$\Delta i \approx \frac{\alpha(1-\alpha)E}{L f_{\text{déc}}} = \frac{0{,}24 \times 48}{0{,}5\cdot10^{-3} \times 10^4} \approx 2{,}3\ \text{A}$$</div>
      Le calcul exact du régime périodique (figure) donne la même valeur.</li>
    </ol>
  </div>
  <p>Les autres hacheurs du programme sortent de la même synthèse (tableau du §7). Le hacheur <strong>réversible en courant</strong> remplace chaque interrupteur par un transistor avec sa diode antiparallèle : en moteur (\( i > 0 \)), le transistor du haut et la diode du bas travaillent ; en freinage récupératif (\( i \lt 0 \)), le transistor du bas et la diode du haut, et l'énergie remonte vers la batterie. Le <strong>pont en H</strong> (deux cellules, quatre transistors avec diodes) couvre les quatre quadrants ; en commande dite bipolaire (diagonales fermées alternativement), \( \langle u\rangle = (2\alpha - 1)E \).</p>
  <div class="notice"><strong>Notations.</strong> Le chapitre « Les hacheurs » note aussi \( E \) la tension de la source (et \( E_m \) la f.é.m. du moteur), mais \( T_1 \) à \( T_4 \) les transistors du pont ; la 2ᵉ année reprend les notations de ce chapitre-ci (\( E \), bras \( K_1, K_1' \) et \( K_2, K_2' \)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ONDULEUR MONOPHASÉ EN PONT</div>
  <h2>Du continu à l'alternatif</h2>
  <div class="intro">Alimenter un moteur alternatif depuis une batterie, injecter dans le réseau l'énergie de panneaux solaires, secourir un ordinateur pendant une coupure : il faut fabriquer une tension alternative à partir d'une source continue.</div>

  <h3>Synthèse</h3>
  <p>La source d'entrée est une source de tension \( E \) (batterie, ou bus continu tenu par un condensateur). La charge alternative est inductive (moteur, filtre) : c'est une source de courant dont le courant \( i \) change de signe. Il faut lui appliquer \( u = \pm E \) : deux cellules en pont. Chaque interrupteur conduit un courant des deux signes et bloque \( +E \) : trois segments, <strong>transistor + diode antiparallèle</strong>. C'est exactement la structure du hacheur en pont en H ; seule la loi de commande change.</p>

  <h3>Commande pleine onde</h3>
  <p>On ferme \( K_1 \) et \( K_2' \) pendant la première demi-période, \( K_1' \) et \( K_2 \) pendant la seconde ; dans chaque bras, les commandes restent complémentaires. La tension de la charge est un créneau symétrique, dont la fréquence \( f = 1/T \) est fixée par la commande :</p>
  <div class="formula" data-nom="Onduleur pleine onde">$$u = \begin{cases} +E & \text{sur } ]0, T/2[ \\ -E & \text{sur } ]T/2, T[ \end{cases} \qquad \langle u\rangle = 0 \qquad U = E$$</div>
  <p>La valeur efficace vaut \( E \) puisque \( u^2 = E^2 \) en permanence. L'amplitude de la tension est donc figée par \( E \), et le créneau est loin d'une sinusoïde (sa décomposition en harmoniques est étudiée en 2ᵉ année).</p>

  <h3>Courant dans une charge R, L et rôle des diodes</h3>
  <p>Sur chaque demi-période, \( L\,\mathrm{d}i/\mathrm{d}t + Ri = \pm E \) : le courant est fait d'arcs d'exponentielles de constante de temps \( \tau = L/R \). En régime permanent, il est alternatif et symétrique : \( i(0) = -I_0 \), \( i(T/2) = +I_0 \), avec</p>
  <div class="formula" data-nom="Onduleur sur charge R, L">$$I_0 = \frac{E}{R}\,\tanh\frac{T}{4\tau}$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Valeur du courant au basculement</span><div class="content">
    <p>Sur \( ]0, T/2[ \), \( u = +E \) et \( i(0) = -I_0 \) : \( i(t) = \dfrac{E}{R} - \left(\dfrac{E}{R} + I_0\right) e^{-t/\tau} \). La symétrie du régime permanent impose \( i(T/2) = +I_0 \), d'où \( I_0\left(1 + e^{-T/2\tau}\right) = \dfrac{E}{R}\left(1 - e^{-T/2\tau}\right) \), soit \( I_0 = \dfrac{E}{R}\,\dfrac{1 - e^{-T/2\tau}}{1 + e^{-T/2\tau}} = \dfrac{E}{R}\tanh\dfrac{T}{4\tau} \).</p>
  </div></div>
  <p>Juste après chaque basculement, la tension a changé de signe mais le courant, continu dans l'inductance, garde le sien. Il traverse alors les interrupteurs commandés <em>en sens inverse</em> : ce sont les <strong>diodes</strong> \( D_1 \) et \( D_2' \) (puis \( D_1' \) et \( D_2 \)) qui conduisent, et le courant \( i_e \) fourni par la source est négatif : l'énergie stockée dans l'inductance revient vers la source. Quand \( i \) s'annule, à l'instant \( t_D = \tau\ln(1 + RI_0/E) \), les transistors prennent le relais.</p>

  <div class="method-box"><strong>Exemple — Onduleur sur charge inductive</strong>
    <p>\( E = 48\ \text{V} \), \( R = 4\ \Omega \), \( L = 20\ \text{mH} \), \( f = 50\ \text{Hz} \).</p>
    <ol>
      <li>\( \tau = 5\ \text{ms} \), \( T = 20\ \text{ms} \), \( T/4\tau = 1 \) : \( I_0 = 12\tanh 1 \approx 9{,}14\ \text{A} \).</li>
      <li>Conduction des diodes : \( t_D = 5\ln(1 + 4 \times 9{,}14/48) \approx 2{,}83\ \text{ms} \) au début de chaque demi-période de 10 ms.</li>
      <li>Tension : \( U = 48\ \text{V} \). Un calcul numérique de la valeur efficace du courant donne \( I \approx 5{,}86\ \text{A} \), d'où la puissance reçue par la résistance \( P = RI^2 \approx 137\ \text{W} \).</li>
    </ol>
  </div>

  <h3>Idée de la MLI</h3>
  <p>Pour obtenir une tension dont l'amplitude se règle et dont la valeur moyenne suit une sinusoïde, on découpe à une fréquence \( f_{\text{déc}} \) très supérieure à \( f \) (modulation de largeur d'impulsion, MLI) : sur chaque période de découpage, les diagonales sont fermées alternativement, \( K_1, K_2' \) pendant \( \alpha T_{\text{déc}} \) et \( K_1', K_2 \) le reste du temps, d'où</p>
  <div class="formula" data-nom="Moyenne glissante en MLI">$$\langle u\rangle_{T_{\text{déc}}} = (2\alpha - 1)\,E$$</div>
  <p>On fait varier le rapport cyclique au rythme de la sinusoïde voulue, \( \alpha(t) = \tfrac12\big(1 + m\sin\omega t\big) \) avec \( 0 \leq m \leq 1 \) : la moyenne glissante vaut \( mE\sin\omega t \). En pratique, \( \alpha \) s'obtient en comparant une modulante sinusoïdale à une porteuse triangulaire. L'inductance de la charge filtre le découpage : le courant est presque sinusoïdal, et l'on règle indépendamment l'amplitude (par \( m \)) et la fréquence (par \( f \)).</p>

  <div class="method-box"><strong>Exemple — Quel rapport cyclique ?</strong>
    <p>Avec \( E = 48\ \text{V} \), on veut une moyenne glissante d'amplitude 38,4 V.</p>
    <ol>
      <li>\( m = 38{,}4/48 = 0{,}8 \).</li>
      <li>Au sommet de la sinusoïde, \( \alpha = \tfrac12(1 + 0{,}8) = 0{,}9 \) et \( (2 \times 0{,}9 - 1) \times 48 = 38{,}4\ \text{V} \) ; au passage par zéro, \( \alpha = 0{,}5 \) ; au creux, \( \alpha = 0{,}1 \).</li>
      <li>La valeur efficace de cette sinusoïde vaut \( 38{,}4/\sqrt2 \approx 27\ \text{V} \) (le calcul des harmoniques de la MLI est en 2ᵉ année).</li>
    </ol>
  </div>

  <h3>Trois cellules : l'onduleur triphasé</h3>
  <p>Pour un moteur triphasé, on ajoute un troisième bras identique : trois cellules, six transistors avec leurs diodes, les points milieux reliés aux trois phases. La structure découle de la même synthèse ; les formes d'onde, la commande et l'association à une machine sont étudiées en 2ᵉ année (<a href="#triphase/cours">« Régimes alternatifs, redresseurs et onduleurs »</a>, <a href="#machalt/cours">« Machines synchrone et asynchrone »</a>).</p>
  <div class="notice"><strong>Erreur classique</strong> : supprimer les diodes antiparallèles d'un onduleur « puisque les transistors suffisent à créer \( \pm E \) ». Après chaque basculement, le courant inductif garde son signe pendant \( t_D \) : sans diode, il n'aurait aucun chemin, et l'on ouvrirait une source de courant (surtension destructrice).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · REDRESSEUR À DIODES</div>
  <h2>De l'alternatif au continu</h2>
  <div class="intro">Tout appareil branché sur le secteur commence par redresser. Le redresseur à diodes est le plus simple des convertisseurs : aucune commande, les diodes commutent seules au rythme du réseau.</div>

  <h3>Synthèse</h3>
  <p>La source d'entrée est le réseau, source de tension alternative \( v = V\sqrt2\sin\theta \) avec \( \theta = \omega t \) (\( V \) : valeur efficace). La charge est une source de courant \( I > 0 \) (induit de moteur, ou charge précédée d'une inductance de lissage) à laquelle on veut appliquer une tension de signe constant, \( u_s = |v| \). Il faut deux cellules, car \( v \) change de signe. Chaque interrupteur conduit \( +I \) et bloque une tension négative : produit négatif, commutations spontanées, ce sont des <strong>diodes</strong>. Elles commutent aux passages par zéro de \( v \), sans aucune commande ; en contrepartie, \( \langle u_s\rangle \) n'est pas réglable.</p>
  <div class="prop-box">
    <p><strong>Règle de conduction.</strong> Parmi des diodes à cathodes communes, seule conduit celle dont l'anode est au potentiel le plus élevé ; parmi des diodes à anodes communes, seule conduit celle dont la cathode est au potentiel le plus bas. La tension de sortie d'un pont vaut donc, à chaque instant, le plus haut potentiel d'entrée moins le plus bas.</p>
  </div>

<figcaption>Pont de diodes (PD2) débitant dans une source de courant \(I\) (charge très inductive) : \(D_1, D_2'\) conduisent quand \(v > 0\), \(D_2, D_1'\) quand \(v \lt 0\). La sortie \(u_s = |v|\) a pour valeur moyenne \(2V\sqrt2/\pi \approx 0{,}90\,V\) (tracé pour \(V = 230\ \text{V}\) : 207 V) ; le réseau fournit un courant en créneaux \(\pm I\).</figcaption>
</figure>

  <h3>Valeurs caractéristiques du pont monophasé (PD2)</h3>
  <p>\( D_1 \) et \( D_2 \) ont leurs cathodes communes (borne + de la sortie), \( D_1' \) et \( D_2' \) leurs anodes communes (borne −). Pour \( v > 0 \), A est le point le plus haut et B le plus bas : \( D_1 \) et \( D_2' \) conduisent, \( u_s = v \). Pour \( v \lt 0 \), c'est l'inverse : \( D_2 \) et \( D_1' \) conduisent, \( u_s = -v \).</p>
  <div class="formula" data-nom="Pont de diodes monophasé">$$\langle u_s\rangle = \frac{2V\sqrt2}{\pi} \approx 0{,}90\,V$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Valeur moyenne d'une tension redressée double alternance</span><div class="content">
    <p>\( u_s = |v| \) a pour période \( T/2 \), soit \( \pi \) en \( \theta \) :</p>
    <div class="formula">$$\langle u_s\rangle = \frac1\pi\int_0^\pi V\sqrt2\sin\theta\,\mathrm{d}\theta = \frac{V\sqrt2}{\pi}\big[-\cos\theta\big]_0^\pi = \frac{2V\sqrt2}{\pi}$$</div>
  </div></div>
  <ul>
    <li>Sur une charge résistive, la tension est la même, et sa valeur efficace vaut \( V \) (puisque \( u_s^2 = v^2 \)) ;</li>
    <li>chaque diode conduit une demi-période : \( \langle i_D\rangle = I/2 \) ; bloquée, elle supporte au plus \( V\sqrt2 \) ;</li>
    <li>le courant prélevé au réseau est un créneau \( \pm I \), de même fréquence que \( v \) mais non sinusoïdal (ses harmoniques et le facteur de puissance sont étudiés en 2ᵉ année).</li>
  </ul>
  <div class="method-box"><strong>Exemple — Moteur alimenté par le secteur</strong>
    <p>Réseau 230 V, 50 Hz ; moteur à courant continu absorbant \( I = 5\ \text{A} \) bien lissé.</p>
    <ol>
      <li>\( \langle u_s\rangle = 2 \times 230\sqrt2/\pi \approx 207\ \text{V} \) ; puissance reçue par le moteur : \( P = \langle u_s\rangle I \approx 1\,035\ \text{W} \) (le courant étant constant, §6).</li>
      <li>Diodes : \( \langle i_D\rangle = 2{,}5\ \text{A} \), tension inverse maximale \( 230\sqrt2 \approx 325\ \text{V} \) : on choisit un calibre d'au moins 600 V pour encaisser les surtensions du réseau.</li>
      <li>Sur une résistance de 100 Ω à la place du moteur : \( \langle i\rangle = 2{,}07\ \text{A} \), mais \( P = V^2/R = 529\ \text{W} \), et non \( \langle u_s\rangle^2/R \approx 429\ \text{W} \).</li>
    </ol>
  </div>
  <h3>Une diode, trois cellules</h3>
  <p>Avec une seule diode (redressement monoalternance), on ne garde que les alternances positives : \( \langle u\rangle = V\sqrt2/\pi \approx 0{,}45\,V \) ; le montage ne sert qu'aux faibles puissances. En triphasé, le pont PD3 compte trois cellules et six diodes ; il donne \( \langle u_s\rangle \approx 1{,}35\,U \), environ 540 V sur le réseau 400 V : c'est l'étage d'entrée des variateurs industriels (2ᵉ année).</p>
  <div class="notice"><strong>Erreur classique</strong> : confondre la valeur moyenne \( 0{,}90\,V \) (207 V sur le secteur) et la valeur crête \( V\sqrt2 \) (325 V). Un condensateur de filtrage en sortie rapproche la tension de la crête, mais c'est un autre montage, étudié avec l'ondulation en 2ᵉ année.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · PERTES ET RENDEMENT</div>
  <h2>Pourquoi 95 à 99 %, et pas 100 %</h2>
  <div class="intro">Les interrupteurs réels ne sont pas parfaits : un peu de tension subsiste quand ils conduisent, et les commutations ne sont pas instantanées. Ces deux défauts font les pertes d'un convertisseur ; les ordres de grandeur suffisent pour juger un choix.</div>

  <h3>Pertes par conduction</h3>
  <ul>
    <li><strong>Diode</strong> : chute de tension \( V_F \approx 0{,}7 \) à 1 V (0,3 à 0,5 V pour une diode Schottky) ; pertes \( \approx V_F\,\langle i_D\rangle \).</li>
    <li><strong>MOS</strong> : se comporte comme une résistance \( R_{DS(\text{on})} \) (quelques milliohms à quelques centaines de milliohms) ; pertes \( R_{DS(\text{on})}\,I_{\text{eff}}^2 \).</li>
    <li><strong>IGBT</strong> : chute de tension de 1,5 à 2 V presque indépendante du courant ; pertes \( \approx V_{CE}\,\langle i\rangle \).</li>
  </ul>

  <h3>Pertes par commutation</h3>
  <p>Sur une charge inductive, le courant qui arrive dans le transistor n'a nulle part où aller avant qu'il soit complètement établi : à la fermeture, le courant monte sous toute la tension \( E \), puis la tension tombe ; à l'ouverture, c'est l'inverse. Pendant chaque commutation, la puissance instantanée atteint \( EI \).</p>

<figcaption>Modèle simple d'une commutation sur charge inductive : à la fermeture, le courant monte sous la tension \(E\), puis la tension tombe ; à l'ouverture, l'inverse. Chaque commutation de durée \(t_f\) ou \(t_o\) dissipe \(\tfrac12 E I t\) : à chaque période, \(W = \tfrac12 E I\,(t_f + t_o)\).</figcaption>
</figure>
  <div class="formula" data-nom="Pertes par commutation">$$P_{\text{com}} = \tfrac12\,E\,I\,(t_f + t_o)\,f_{\text{déc}}$$</div>
  <p>Elles sont proportionnelles à la fréquence de découpage : monter \( f_{\text{déc}} \) réduit l'ondulation du courant (§8), mais augmente les pertes. C'est le compromis central du choix d'un convertisseur. Durées typiques \( t_f + t_o \) : quelques dizaines de nanosecondes pour un MOS, quelques centaines pour un IGBT.</p>
  <div class="prop-box">
    <p><strong>Rendement</strong> : \( \eta = \dfrac{P_s}{P_e} = \dfrac{P_s}{P_s + P_{\text{pertes}}} \). Ordres de grandeur : 95 à 99 % pour un convertisseur statique, 70 à 95 % pour un moteur électrique ; le rendement d'une chaîne est le produit des rendements de ses maillons. Les pertes se retrouvent en chaleur dans les composants, qu'il faut refroidir (dissipateur, ventilation).</p>
  </div>
  <div class="method-box"><strong>Exemple — Bilan d'un hacheur 48 V</strong>
    <p>Hacheur série : \( E = 48\ \text{V} \), \( I = 25\ \text{A} \) constant, \( \alpha = 0{,}5 \), \( f_{\text{déc}} = 20\ \text{kHz} \) ; MOS : \( R_{DS(\text{on})} = 8\ \text{m}\Omega \), \( t_f + t_o = 100\ \text{ns} \) ; diode : \( V_F = 0{,}8\ \text{V} \).</p>
    <ol>
      <li>Conduction du MOS (pendant \( \alpha T \)) : \( \alpha R_{DS(\text{on})} I^2 = 0{,}5 \times 0{,}008 \times 625 = 2{,}5\ \text{W} \).</li>
      <li>Commutation : \( \tfrac12 \times 48 \times 25 \times 10^{-7} \times 2\cdot10^4 = 1{,}2\ \text{W} \).</li>
      <li>Diode (pendant \( (1-\alpha)T \)) : \( 0{,}5 \times 0{,}8 \times 25 = 10\ \text{W} \) : c'est elle qui coûte le plus.</li>
      <li>Puissance utile \( \langle u\rangle I = 24 \times 25 = 600\ \text{W} \), pertes 13,7 W : \( \eta = 600/613{,}7 \approx 97{,}8\ \% \). En remplaçant la diode par un second MOS commandé en complément (redressement synchrone), ses pertes tombent à 2,5 W et \( \eta \approx 99\ \% \). Un rhéostat aurait donné 50 %.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'augmenter la fréquence de découpage est gratuit. Passer de 20 à 200 kHz multiplie les pertes par commutation par dix ; c'est pourquoi les IGBT, plus lents, découpent à quelques kHz et les MOS rapides à des centaines de kHz.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce que le programme laisse de côté</h2>
  <ul>
    <li><strong>Gradateur</strong> (alternatif → alternatif) : deux thyristors tête-bêche (ou un triac) retardent la mise en conduction à chaque demi-période ; la valeur efficace de la tension se règle, pas sa fréquence. Variateurs de lumière, démarreurs progressifs.</li>
    <li><strong>Thyristor et redresseur commandé</strong> : le thyristor conduit \( i > 0 \) et bloque des tensions des deux signes (trois segments) ; sa fermeture est commandée (impulsion de gâchette sous tension positive), son ouverture spontanée (annulation du courant). Un pont de thyristors amorcés avec un retard angulaire \( \psi \) donne, sur une source de courant, \( \langle u_s\rangle = \dfrac{2V\sqrt2}{\pi}\cos\psi \), qui devient négative pour \( \psi > \pi/2 \) : le pont renvoie alors de l'énergie au réseau.</li>
    <li><strong>Interrupteurs à quatre segments</strong> (bidirectionnels en tension et en courant) : deux transistors et deux diodes ; ils servent aux convertisseurs matriciels, qui passent directement d'un réseau alternatif à un autre.</li>
    <li><strong>Convertisseurs indirects</strong> : quand les deux sources sont de même nature, un élément de stockage intermédiaire transfère l'énergie (hacheur à stockage inductif, alimentation à découpage avec transformateur, qui assure aussi l'isolement galvanique).</li>
    <li><strong>Nouveaux semi-conducteurs</strong> : les transistors en carbure de silicium (SiC) et en nitrure de gallium (GaN) commutent plus vite et sous de plus fortes tensions que le silicium ; ils équipent les onduleurs de traction des véhicules électriques récents et les chargeurs compacts.</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="cvs-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CONVERTISSEURS STATIQUES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix savoir-faire pour lire, concevoir et chiffrer un convertisseur statique : reconnaître les sources, respecter les règles d'interconnexion, choisir les interrupteurs, tracer les chronogrammes et faire le bilan de puissance. Les notations sont celles du cours (\( E \) source de tension, \( I \) source de courant, \( v_K \), \( i_K \) en convention récepteur).</div>

  <div class="method-box"><strong>Méthode 1 — Identifier la nature et la réversibilité d'une source</strong>
    <ol>
      <li>Demander ce que le dipôle <strong>impose</strong> : une tension (batterie, réseau, condensateur en parallèle) ou un courant (branche contenant une inductance en série) ; « source » ne veut pas dire « générateur ».</li>
      <li>Pour une inductance, comparer la période de découpage \( T \) à \( \tau = L/R \) : si \( T \lt \tau/10 \), le courant varie peu sur une période, c'est une source de courant.</li>
      <li>Relever les signes possibles de la tension et du courant dans tous les modes de fonctionnement : réversible en tension, en courant, ou non réversible.</li>
    </ol>
    <p><em>Exemple éclair :</em> induit \( R = 1\ \Omega \), \( L = 4\ \text{mH} \) alimenté par découpage à 20 kHz : \( \tau = 4\ \text{ms} \), \( T = 50\ \mu\text{s} = \tau/80 \) : source de courant. La batterie de 24 V qui l'alimente, rechargée au freinage, est une source de tension réversible en courant.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Vérifier les règles d'interconnexion des sources</strong>
    <ol>
      <li>Repérer chaque source et sa nature (méthode 1).</li>
      <li>Dessiner le circuit dans chaque configuration des interrupteurs (y compris pendant les temps morts).</li>
      <li>Vérifier qu'aucune source de tension n'est court-circuitée, qu'aucune source de courant n'est ouverte, et qu'aucune maille ne relie directement deux sources de tension (ou deux sources de courant en série).</li>
      <li>Si une source de courant peut se retrouver ouverte, prévoir un chemin : diode de roue libre ou diode antiparallèle.</li>
    </ol>
    <p><em>Exemple éclair :</em> fermer un interrupteur entre une batterie de 48 V et un condensateur déchargé de 1 000 µF relie deux sources de tension : le courant d'appel n'est limité que par les résistances parasites ; avec 50 mΩ, il atteint \( 48/0{,}05 \approx 960\ \text{A} \). Il faut une inductance (ou une résistance de précharge) en série.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Déterminer l'état d'une diode</strong>
    <ol>
      <li>Supposer un état (passante ou bloquée).</li>
      <li>Calculer le circuit dans cet état : passante, \( v_D = 0 \) et on calcule \( i_D \) ; bloquée, \( i_D = 0 \) et on calcule \( v_D \).</li>
      <li>Vérifier la cohérence : passante exige \( i_D > 0 \), bloquée exige \( v_D \leq 0 \).</li>
      <li>En cas de contradiction, changer d'hypothèse ; une seule des deux est cohérente.</li>
    </ol>
    <p><em>Exemple éclair :</em> une source de 12 V, une diode et une résistance de 100 Ω débitent dans une batterie de 15 V qui s'oppose. Passante : \( i_D = (12 - 15)/100 = -30\ \text{mA} \lt 0 \), impossible. Bloquée : \( v_D = 12 - 15 = -3\ \text{V} \leq 0 \), cohérent.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Tracer la caractéristique statique d'un interrupteur</strong>
    <ol>
      <li>Orienter l'interrupteur en convention récepteur (\( i_K \) et \( v_K \) en sens opposés).</li>
      <li>Relever, dans tous les cas de fonctionnement, le courant \( i_K \) qu'il conduit fermé et la tension \( v_K \) qu'il supporte ouvert.</li>
      <li>Chaque signe rencontré donne un segment : demi-axe des courants (fermé) ou des tensions (ouvert).</li>
      <li>Deux segments : diode ou transistor ; trois : transistor + diode antiparallèle (réversible en courant) ou en série (réversible en tension).</li>
    </ol>
    <p><em>Exemple éclair :</em> un interrupteur d'onduleur conduit +8 A et −8 A et bloque +400 V : segments \( i_K > 0 \), \( i_K \lt 0 \), \( v_K > 0 \) : trois segments, transistor avec diode antiparallèle.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Reconnaître une commutation spontanée ou commandée</strong>
    <ol>
      <li>Pour chaque passage fermé ↔ ouvert, relever le courant à l'état fermé \( i_{\text{on}} \) et la tension à l'état ouvert \( v_{\text{off}} \), en convention récepteur.</li>
      <li>Si \( v_{\text{off}}\,i_{\text{on}} \lt 0 \) : commutation spontanée, une diode suffit.</li>
      <li>Si \( v_{\text{off}}\,i_{\text{on}} > 0 \) : commutation commandée, il faut un transistor.</li>
      <li>Contrôle : dans une cellule où \( E \) et \( I \) gardent leur signe, un interrupteur est commandé et l'autre spontané.</li>
    </ol>
    <p><em>Exemple éclair :</em> \( i_{\text{on}} = +10\ \text{A} \), \( v_{\text{off}} = -300\ \text{V} \) : produit négatif, diode (anode du côté d'où vient le courant). \( i_{\text{on}} = -10\ \text{A} \), \( v_{\text{off}} = +300\ \text{V} \) : produit négatif aussi, c'est encore une diode, montée dans l'autre sens.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer la règle des signes avec des orientations différentes pour la tension et le courant. Les deux grandeurs doivent être en convention récepteur pour le même interrupteur ; changer l'orientation des deux à la fois ne change pas le résultat.</div>

  <div class="method-box"><strong>Méthode 6 — Faire la synthèse d'un convertisseur</strong>
    <ol>
      <li>Nature des deux sources ; si elles sont de même nature, ajouter une inductance en série ou un condensateur en parallèle.</li>
      <li>Réversibilités exigées : signes de \( E \), de \( I \), de \( u \) ; quadrants à couvrir.</li>
      <li>Structure : une cellule si \( u \in \{0, E\} \) suffit, deux cellules en pont s'il faut \( u = \pm E \), trois en triphasé.</li>
      <li>Segments de chaque interrupteur (méthode 4), puis nature de chaque commutation (méthode 5) : diode, transistor ou association.</li>
      <li>Vérifier les règles d'interconnexion dans chaque configuration (méthode 2) et la complémentarité dans chaque cellule.</li>
    </ol>
    <p><em>Exemple éclair :</em> recharger une batterie de 24 V depuis un bus continu de 48 V : deux sources de tension, donc une inductance en série avec la batterie, qui devient source de courant \( I > 0 \) ; \( u \in \{0, 48\ \text{V}\} \) suffit : une cellule, transistor côté +, diode côté − (hacheur série), \( \alpha \approx 24/48 = 0{,}5 \).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Tracer les chronogrammes d'une cellule ou d'un pont</strong>
    <ol>
      <li>Découper la période en intervalles selon les ordres de commande ; dans chaque cellule, un et un seul interrupteur est fermé.</li>
      <li>En déduire la tension de sortie (\( u = E \) ou 0 pour une cellule, \( u = v_A - v_B \) pour un pont).</li>
      <li>Calculer le courant de la charge (droites ou exponentielles selon la charge), en partant du régime permanent.</li>
      <li>Dans chaque interrupteur fermé, le signe du courant désigne le composant qui conduit : le transistor si le courant va dans son sens passant, sa diode antiparallèle sinon.</li>
      <li>Tracer enfin le courant \( i_e \) de la source : il vaut \( \pm i \) ou 0 selon les interrupteurs fermés.</li>
    </ol>
    <p><em>Exemple éclair :</em> onduleur pleine onde sur charge inductive, juste après le passage à \( u = +E \) : le courant vaut encore \( -I_0 \lt 0 \) ; \( K_1 \) et \( K_2' \) sont commandés, mais ce sont leurs diodes \( D_1 \) et \( D_2' \) qui conduisent, et \( i_e = -I_0 \) : la source reçoit de l'énergie.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Calculer les valeurs moyenne et efficace d'une tension</strong>
    <ol>
      <li>Écrire la tension sur une période (morceaux constants, sinusoïdes).</li>
      <li>Moyenne : \( \langle u\rangle = \frac1T\int_0^T u\,\mathrm{d}t \) (aire algébrique divisée par la période) ; efficace : \( U^2 = \langle u^2\rangle \).</li>
      <li>Résultats à connaître : créneau 0 / \( E \) : \( \langle u\rangle = \alpha E \), \( U = E\sqrt\alpha \) ; créneau \( \pm E \) de rapport \( \alpha \) : \( \langle u\rangle = (2\alpha - 1)E \), \( U = E \) ; redressé double alternance : \( \langle u_s\rangle = 2V\sqrt2/\pi \), \( U_s = V \) ; simple alternance : \( \langle u\rangle = V\sqrt2/\pi \), \( U = V/\sqrt2 \).</li>
      <li>Un voltmètre en position DC lit la moyenne, un RMS vrai en AC+DC la valeur efficace.</li>
    </ol>
    <p><em>Exemple éclair :</em> créneau 0 / 100 V de rapport cyclique 0,36 : \( \langle u\rangle = 36\ \text{V} \), \( U = 100\sqrt{0{,}36} = 60\ \text{V} \).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Faire le bilan de puissance et estimer les pertes</strong>
    <ol>
      <li>Convertisseur parfait : la puissance se conserve ; si \( E \) et \( I \) sont constants, \( E\,\langle i_e\rangle = \langle u\rangle\,I \).</li>
      <li>Sinon, revenir à \( P = \langle u\,i\rangle \) : pour une résistance, \( P = U^2/R \) avec la valeur efficace.</li>
      <li>Pertes par conduction : \( V_F\langle i\rangle \) (diode, IGBT), \( R_{DS(\text{on})}I_{\text{eff}}^2 \) (MOS), en tenant compte de la fraction de période où le composant conduit.</li>
      <li>Pertes par commutation : \( \tfrac12 E I (t_f + t_o) f_{\text{déc}} \) par transistor commandé ; puis \( \eta = P_s/(P_s + P_{\text{pertes}}) \).</li>
    </ol>
    <p><em>Exemple éclair :</em> bras d'IGBT sous 540 V, 20 A, \( \alpha = 0{,}5 \), \( V_{CE} = 1{,}8\ \text{V} \), \( t_f + t_o = 0{,}6\ \mu\text{s} \), 10 kHz : conduction \( 0{,}5 \times 1{,}8 \times 20 = 18\ \text{W} \), commutation \( \tfrac12 \times 540 \times 20 \times 0{,}6\cdot10^{-6} \times 10^4 = 32{,}4\ \text{W} \) ; pour 5,4 kW transmis, \( \eta \approx 99{,}1\ \% \).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \( P = \langle u\rangle\langle i\rangle \) dans tous les cas. Ce n'est juste que si l'une des deux grandeurs est constante ; sur une résistance alimentée par découpage, il faut la valeur efficace.</div>

  <div class="method-box"><strong>Méthode 10 — Choisir le convertisseur et ses interrupteurs</strong>
    <ol>
      <li>Nature de l'entrée et de la sortie : continu → continu (hacheur), continu → alternatif (onduleur), alternatif → continu (redresseur) ; alternatif → alternatif de fréquence variable : redresseur + onduleur.</li>
      <li>Quadrants exigés par la charge (en précisant le plan) : un seul, réversible en courant, en tension, ou les quatre.</li>
      <li>Technologie selon la tension et la fréquence de découpage : MOS pour les basses tensions et les découpages rapides, IGBT pour les fortes tensions et puissances, diodes là où la commutation est spontanée.</li>
      <li>Vérifier les ordres de grandeur : rendement de 95 à 99 %, pertes à évacuer par un dissipateur.</li>
    </ol>
    <p><em>Exemple éclair :</em> trottinette (batterie 36 V, moteur synchrone, freinage récupératif) : onduleur à six MOS avec diodes antiparallèles. Rame de métro alimentée en 1 500 V continu, moteurs asynchrones : onduleur à IGBT.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : nommer un quadrant sans préciser le plan. Le freinage en marche avant est le quadrant 4 dans le plan \( (u, i) \) du convertisseur, le quadrant 2 dans le plan \( (C_{em}, \Omega) \) de la machine.</div>
</div>
</template>

<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Caractéristiques d'une diode</h3>
  <div class="statement">Une diode idéale est en série avec une résistance \(R = 100\ \Omega\) et une source \(E = 12\ \text{V}\) ; la diode est orientée pour laisser passer le courant que débite la source.</div>
  <div class="q"><strong>Q1.</strong> Montrer que la diode est passante. Calculer le courant et la tension aux bornes de \(R\).</div>
  <div class="q"><strong>Q2.</strong> La source vaut maintenant \(E = -5\ \text{V}\). Dans quel état est la diode ? Que valent le courant et la tension à ses bornes ? Quelle donnée du composant réel faut-il vérifier ?</div>
  <div class="q"><strong>Q3.</strong> Une diode réelle présente une tension de seuil \(V_D = 0{,}7\ \text{V}\). Reprendre la Q1 et calculer la puissance dissipée dans la diode.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Méthode de l'hypothèse : supposons la diode passante, \(v_D = 0\). Alors \(I = E/R = 12/100 = 120\ \text{mA} > 0\) : l'hypothèse est cohérente. Toute la tension est aux bornes de la résistance : \(U_R = 12\ \text{V}\).</p>
    <p><strong>Q2.</strong> Passante, elle conduirait \(I = -5/100 = -50\ \text{mA} \lt 0\) : impossible. Elle est donc bloquée : \(I = 0\), \(U_R = 0\) et \(v_D = -5\ \text{V} \leq 0\), cohérent. La diode réelle doit supporter cette tension inverse : on vérifie que sa tension inverse maximale répétitive \(V_{RRM}\) dépasse 5 V avec une marge (les diodes courantes tiennent au moins 50 V).</p>
    <p><strong>Q3.</strong> \(I = (E - V_D)/R\), soit \((12 - 0{,}7)/100 = 113\ \text{mA}\) : le seuil retire 6 % du courant. Puissance dissipée dans la diode : \(V_D I = 0{,}7 \times 0{,}113 \approx 79\ \text{mW}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Associations de sources : permis ou interdit ?</h3>
  <div class="statement">On considère les associations suivantes de sources idéales. Pour chacune, dire si elle est autorisée et pourquoi.</div>
  <div class="q"><strong>Q1.</strong> Deux sources de tension de 12 V et 15 V en parallèle.</div>
  <div class="q"><strong>Q2.</strong> Deux sources de courant de 2 A et 3 A en série.</div>
  <div class="q"><strong>Q3.</strong> Une source de tension de 12 V, une source de courant de 1 A (qui injecte son courant dans le nœud du haut) et une résistance de 6 Ω, toutes trois en parallèle. Que fournit chaque source ?</div>
  <div class="q"><strong>Q4.</strong> Une bobine de 10 mH parcourue par 2 A (source de courant) est en série avec un interrupteur qui s'ouvre en 1 µs, sans autre chemin pour le courant. Estimer la surtension.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Interdit : deux sources de tension différentes en parallèle imposeraient deux tensions différentes entre les mêmes nœuds. Le courant n'est limité que par les résistances parasites : en pratique, la source la plus forte envoie un courant destructeur dans l'autre.</p>
    <p><strong>Q2.</strong> Interdit : dans une branche série, le courant est unique ; deux sources de courant différentes ne peuvent pas l'imposer toutes les deux (les tensions à leurs bornes deviendraient infinies).</p>
    <p><strong>Q3.</strong> Autorisé : une source de tension et une source de courant sont de natures différentes. La source de tension impose 12 V aux trois branches ; la résistance absorbe \(12/6 = 2\ \text{A}\). La source de courant en fournit 1 A, la source de tension fournit donc le complément, 1 A. Bilan : chaque source fournit \(12 \times 1 = 12\ \text{W}\), et la résistance reçoit \(12 \times 2 = 24\ \text{W}\).</p>
    <p><strong>Q4.</strong> Interdit : on ouvre une source de courant. La tension aux bornes de la bobine vaut \(L\,\mathrm{d}i/\mathrm{d}t \approx 10^{-2} \times 2/10^{-6} = 20\ \text{kV}\) : un arc éclate et le transistor est détruit. Une diode de roue libre en parallèle sur la bobine offre un chemin au courant et supprime la surtension.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Nature et réversibilité des sources</h3>
  <div class="statement">On considère : (a) la batterie Li-ion de 48 V d'un vélo, rechargée au freinage ; (b) l'induit d'un moteur à courant continu (\(R = 0{,}5\ \Omega\), \(L = 3\ \text{mH}\)) qui entraîne un tapis roulant toujours dans le même sens, freiné avec récupération d'énergie, et alimenté par découpage à 20 kHz ; (c) un condensateur de 2 200 µF ; (d) le réseau 230 V, 50 Hz ; (e) une résistance de chauffage de 10 Ω.</div>
  <div class="q"><strong>Q1.</strong> Pour chaque élément, dire s'il se comporte comme une source de tension, une source de courant, ou ni l'un ni l'autre.</div>
  <div class="q"><strong>Q2.</strong> Justifier le cas (b) par un calcul.</div>
  <div class="q"><strong>Q3.</strong> Préciser la réversibilité de chacun (en tension, en courant).</div>
  <div class="q"><strong>Q4.</strong> Quel convertisseur relie (a) à (b) ? Peut-on relier directement (d) à (c) par un pont de diodes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a), (c) et (d) imposent leur tension : sources de tension. (b) impose son courant grâce à son inductance : source de courant. (e) n'impose rien : elle ne stocke pas d'énergie, sa tension et son courant peuvent sauter ensemble.</p>
    <p><strong>Q2.</strong> \(\tau = L/R = 6\ \text{ms}\) et \(T = 1/f_{\text{déc}} = 50\ \mu\text{s}\) : la période de découpage est 120 fois plus courte que la constante de temps, le courant n'a pas le temps de varier notablement entre deux commutations.</p>
    <p><strong>Q3.</strong> (a) tension positive, courant des deux signes (décharge, recharge) : réversible en courant. (b) le tapis tourne dans un seul sens, donc \(u \approx k\Omega > 0\) ; le couple, donc \(i\), s'inverse au freinage : réversible en courant. (c) tension positive, courant de charge et de décharge : réversible en courant. (d) tension et courant alternatifs : réversible en tension et en courant. (e) \(p = Ri^2 \geq 0\) : non réversible.</p>
    <p><strong>Q4.</strong> (a) → (b) : source de tension vers source de courant, \(u \geq 0\), courant des deux signes : une cellule dont chaque interrupteur est un transistor avec une diode antiparallèle (hacheur réversible en courant, quadrants Q1 et Q4 du plan \((u, i)\)). (d) → (c) : deux sources de tension, ce que la règle 3 interdit ; à chaque crête, le pont relie le réseau au condensateur et le courant n'est limité que par l'impédance de la ligne (pointes de courant). On intercale une inductance de lissage, qui fait de la sortie du pont une source de courant ; l'étude de ces montages filtrés est en 2ᵉ année.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Caractéristiques statiques et choix des interrupteurs</h3>
  <div class="statement">Pour quatre interrupteurs, orientés en convention récepteur, on a relevé au cours d'un fonctionnement les valeurs suivantes. \(K_a\) : fermé, \(i_K = +12\ \text{A}\) ; ouvert, \(v_K = +60\ \text{V}\). \(K_b\) : fermé, \(+12\ \text{A}\) ; ouvert, \(-60\ \text{V}\). \(K_c\) : fermé, \(+12\ \text{A}\) ou \(-12\ \text{A}\) ; ouvert, \(+60\ \text{V}\). \(K_d\) : fermé, \(+12\ \text{A}\) ; ouvert, \(+60\ \text{V}\) ou \(-60\ \text{V}\).</div>
  <div class="q"><strong>Q1.</strong> Tracer l'allure de la caractéristique statique de chaque interrupteur et compter ses segments.</div>
  <div class="q"><strong>Q2.</strong> Pour chaque passage d'un état à l'autre, dire si la commutation est spontanée ou commandée.</div>
  <div class="q"><strong>Q3.</strong> En déduire la réalisation de chaque interrupteur.</div>
  <div class="q"><strong>Q4.</strong> Lesquels trouve-t-on dans un hacheur série ? dans un onduleur en pont ?</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque signe rencontré donne un demi-axe. \(K_a\) : \(i_K > 0\) et \(v_K > 0\), 2 segments. \(K_b\) : \(i_K > 0\) et \(v_K \lt 0\), 2 segments. \(K_c\) : axe des courants entier et \(v_K > 0\), 3 segments (bidirectionnel en courant). \(K_d\) : \(i_K > 0\) et axe des tensions entier, 3 segments (bidirectionnel en tension).</p>
    <p><strong>Q2.</strong> Règle des signes sur le produit \(v_{\text{off}}\,i_{\text{on}}\). \(K_a\) : \(60 \times 12 > 0\), commandée. \(K_b\) : \(-60 \times 12 \lt 0\), spontanée. \(K_c\) : passage \(+12\ \text{A} \leftrightarrow +60\ \text{V}\) commandé, passage \(-12\ \text{A} \leftrightarrow +60\ \text{V}\) spontané. \(K_d\) : passage \(+12\ \text{A} \leftrightarrow +60\ \text{V}\) commandé, passage \(+12\ \text{A} \leftrightarrow -60\ \text{V}\) spontané.</p>
    <p><strong>Q3.</strong> \(K_a\) : transistor. \(K_b\) : diode. \(K_c\) : transistor avec une diode antiparallèle (le transistor conduit +12 A, la diode −12 A). \(K_d\) : transistor avec une diode en série (la diode tient −60 V, que le transistor ne supporte pas) ; un thyristor aurait les mêmes segments (hors programme).</p>

  <div class="q"><strong>Q1.</strong> Énoncer les deux règles fondamentales concernant une source de tension et une source de courant. Pourquoi les commandes de \(K\) et \(K'\) doivent-elles être complémentaires ?</div>
  <div class="q"><strong>Q2.</strong> Tracer sur deux périodes la tension \(u\) aux bornes de la source de courant et le courant \(i_e\) fourni par la source de tension (préciser les durées).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\langle u\rangle\), la valeur efficace \(U\) et \(\langle i_e\rangle\). Vérifier la conservation de la puissance.</div>
  <div class="q"><strong>Q4.</strong> Choisir la réalisation de \(K\) et de \(K'\).</div>
  <div class="q"><strong>Q5.</strong> Pour réduire les pertes, on remplace la diode par un second transistor, commandé en complément du premier. Pourquoi faut-il alors un temps mort ? Par où passe le courant \(I\) pendant ce temps mort ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On ne court-circuite jamais une source de tension ; on n'ouvre jamais une source de courant. \(K\) et \(K'\) fermés ensemble court-circuiteraient \(E\) ; ouverts ensemble, ils ouvriraient \(I\). D'où la complémentarité : à chaque instant, un et un seul est fermé, et \(I\) a toujours un chemin.</p>
    <p><strong>Q2.</strong> \(T = 40\ \mu\text{s}\) et \(\alpha T = 28\ \mu\text{s}\). Pendant \(\alpha T\), \(K\) fermé : \(u = 24\ \text{V}\) et \(i_e = I = 6\ \text{A}\) ; pendant les 12 µs suivantes, \(K'\) fermé : \(u = 0\) et \(i_e = 0\). Deux créneaux de même forme, l'un en tension, l'autre en courant.</p>
    <p><strong>Q3.</strong> \(\langle u\rangle = \alpha E = 16{,}8\ \text{V}\), \(U = E\sqrt\alpha = 24\sqrt{0{,}7} \approx 20{,}1\ \text{V}\), \(\langle i_e\rangle = \alpha I = 4{,}2\ \text{A}\). Puissance : \(E\langle i_e\rangle = 24 \times 4{,}2 = 100{,}8\ \text{W}\) et \(\langle u\rangle I = 16{,}8 \times 6 = 100{,}8\ \text{W}\) : une cellule parfaite ne perd rien.</p>
    <p><strong>Q4.</strong> En orientant \(K\) de la borne + vers le point milieu : fermé \(i_K = +6\ \text{A}\), ouvert \(v_K = +24\ \text{V}\), produit positif : transistor. \(K'\), orienté de la borne − vers le point milieu : fermé \(+6\ \text{A}\), ouvert \(-24\ \text{V}\), produit négatif : diode, anode du côté −.</p>
    <p><strong>Q5.</strong> Les transistors ne s'ouvrent ni ne se ferment instantanément : si l'on fermait l'un au moment exact où l'on ouvre l'autre, ils seraient un court instant fermés ensemble, ce qui court-circuite \(E\). On laisse donc un temps mort (quelques centaines de ns) où les deux sont commandés ouverts. Le courant \(I\), qui ne peut pas s'interrompre, passe alors par la diode antiparallèle du transistor du bas (la diode interne d'un MOS suffit) : c'est la règle « jamais de source de courant ouverte » qui est respectée grâce à elle.</p>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Combien de cellules faut-il ? Relever les segments des deux interrupteurs et en déduire leur réalisation.</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Batterie : source de tension, réversible en courant (elle accepte la recharge). Induit : source de courant. La vitesse garde son signe, donc \(u \approx k\Omega > 0\) ; le couple, donc \(i\), change de signe : quadrants Q1 (traction) et Q4 (freinage).</p>
    <p><strong>Q2.</strong> \(u\) reste positive : \(u \in \{0, E\}\) suffit, une seule cellule. \(K\) (haut, orienté de + vers le point milieu) conduit \(i\), positif ou négatif, et bloque \(+E\) : trois segments. \(K'\) (bas, orienté de − vers le point milieu) conduit \(i\) des deux signes et bloque \(-E\) : trois segments. Avec la règle des signes, les passages avec produit positif sont commandés (transistor), ceux avec produit négatif spontanés (diode) : chaque interrupteur est un <strong>transistor avec une diode antiparallèle</strong>.</p>
    <p><strong>Q3.</strong> \(E_m = k\Omega = 40\ \text{V}\). Traction : \(u = E_m + Ri = 40 + 4 = 44\ \text{V}\), \(\alpha = 44/48 \approx 0{,}917\), \(\langle i_e\rangle = \alpha i \approx 18{,}3\ \text{A}\) ; la batterie fournit \(48 \times 18{,}3 = 880\ \text{W}\) (800 W mécaniques, \(C_{em} = ki = 10\ \text{N·m}\), et 80 W de pertes Joule). Freinage : \(u = 40 - 4 = 36\ \text{V}\), \(\alpha = 0{,}75\), \(\langle i_e\rangle = 0{,}75 \times (-20) = -15\ \text{A}\) : la batterie <strong>reçoit</strong> \(48 \times 15 = 720\ \text{W}\) (les 800 W mécaniques moins 80 W de pertes Joule).</p>
    <p><strong>Q4.</strong> Traction (\(i > 0\)) : pendant \(\alpha T\), le transistor du haut conduit (\(u = E\)) ; pendant \((1-\alpha)T\), la diode du bas (roue libre, \(u = 0\)) : c'est le hacheur série. Freinage (\(i \lt 0\)) : pendant que \(K'\) est commandé, le transistor du bas conduit et le courant de la machine croît en valeur absolue (\(u = 0\)) ; quand il s'ouvre, le courant passe par la diode du haut vers la batterie (\(u = E\)) : c'est un hacheur élévateur, qui fait passer l'énergie de 36 V moyens vers 48 V.</p>

<div class="exo">
