      <h2>Institutions américaines</h2>
      <div class="intro">Le système fédéral américain repose sur la séparation des pouvoirs : indispensable pour suivre la politique des États-Unis.</div>
      <div class="prop-box"><strong>Régime</strong> : république fédérale présidentielle. Le Président est chef de l'État ET du gouvernement (mandat de 4 ans, renouvelable une fois ; White House).</div>
      <div class="prop-box"><strong>Congrès</strong> (Capitol Hill) : House of Representatives + Senate (100 sénateurs, 2 par État).</div>
      <div class="prop-box"><strong>Justice &amp; partis</strong> : Supreme Court (9 juges à vie) ; Democrats vs Republicans (GOP).</div>
      <div class="notice"><em>Checks and balances</em> : exécutif, législatif et judiciaire se contrôlent mutuellement. Le Président est élu au suffrage indirect (Electoral College).</div>
