<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Symétries, courants enlacés et carte de champ de deux fils</h3>
  <div class="statement">Deux fils rectilignes infinis, parallèles à \(Oz\), passent par \((x=a,\,y=0)\) et \((x=-a,\,y=0)\) ; ils sont parcourus par la même intensité \(I\), dans le sens de \(\vec e_z\). Données : \(I=10\ \text{A}\), \(a=5{,}0\ \text{cm}\), \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> On considère un point \(M(0,\,y,\,z)\) du plan \(x=0\). Identifier les plans de symétrie et d'antisymétrie des courants passant par \(M\) et les invariances de la distribution. En déduire la direction de \(\vec B(M)\) et les variables dont il dépend.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\vec B(M)\) par superposition et vérifier la conclusion de Q1. Application numérique pour \(y=a\). Que vaut le champ en \(O\) ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la circulation de \(\vec B\) sur le cercle \(\mathcal C\) de centre \(O\), de rayon \(1\ \text{m}\), situé dans le plan \(z=0\) et orienté par \(\vec e_z\) (main droite). Même question si le second fil est parcouru en sens inverse. Pourquoi le théorème d'Ampère appliqué à \(\mathcal C\) ne permet-il pas de calculer \(B\) ?</div>
  <div class="q"><strong>Q4.</strong> Un élève dessine la carte de champ dans le plan \(z=0\) : près de chaque fil, des cercles qui l'entourent ; loin des fils, des courbes fermées qui entourent les deux fils ; entre les deux familles, une ligne en forme de « 8 » qui se recoupe en \(O\). Cette carte est-elle compatible avec les symétries et avec le résultat de Q2 ? Dans quel sens les lignes sont-elles parcourues ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le plan \(x=0\) échange les deux fils en conservant les courants (parallèles au plan) : c'est un plan de <strong>symétrie</strong> des courants, donc \(\vec B(M)\) lui est orthogonal, porté par \(\vec e_x\). Le plan \(z=z_M\), perpendiculaire aux fils, est un plan d'<strong>antisymétrie</strong> (le symétrique d'un courant selon \(\vec e_z\) est selon \(-\vec e_z\)) : \(\vec B(M)\) y est contenu, ce qui est cohérent. Invariance par translation selon \(Oz\) : pas de dépendance en \(z\). Conclusion : \(\vec B(M)=B_x(y)\,\vec e_x\) dans le plan \(x=0\).</p>
    <p><strong>Q2.</strong> Chaque fil, à la distance \(d=\sqrt{a^2+y^2}\), crée un champ de norme \(\dfrac{\mu_0I}{2\pi d}\), orthoradial autour de ce fil. Par symétrie, les composantes selon \(\vec e_y\) se compensent et celles selon \(\vec e_x\) s'ajoutent ; chacune vaut la norme multipliée par \(y/d\), avec le signe donné par la main droite :</p>
    <div class="formula">$$\vec B(M)=-\frac{\mu_0I\,y}{\pi(a^2+y^2)}\,\vec e_x$$</div>
    <p>Pour \(y=a\) : \(B=\dfrac{\mu_0I}{2\pi a}=\dfrac{2\times10^{-7}\times10}{0{,}050}=40\ \mu\text{T}\), du même ordre que le champ terrestre. En \(O\) (\(y=0\)), le champ est nul : les deux fils y créent des champs opposés.</p>
    <p><strong>Q3.</strong> La normale de la surface plane du cercle est \(\vec e_z\) ; les deux fils la traversent dans le sens de \(\vec e_z\) : la circulation vaut \(\mu_0(I+I)=2\mu_0I\approx2{,}5\times10^{-5}\ \text{T·m}\). Avec des courants opposés : \(\mu_0(I-I)=0\), alors que \(\vec B\) n'est pas nul sur \(\mathcal C\) (seule sa circulation l'est). Le théorème est vrai, mais il ne donne pas \(B\) : la norme de \(\vec B\) n'est pas constante sur un cercle de centre \(O\) (pas d'invariance par rotation), on ne peut pas la sortir de l'intégrale. D'où la superposition de Q2, chaque fil étant traité, lui, par Ampère.</p>
    <p><strong>Q4.</strong> Oui. Le plan \(x=0\) est de symétrie : les lignes le traversent à angle droit (Q2 : \(\vec B\) selon \(\vec e_x\)) ; il en est de même pour le plan \(y=0\), qui contient les deux fils. \(O\) est un point de champ nul : c'est là que la ligne en « 8 » (séparatrice) se recoupe. Loin des fils, la distribution ressemble à un fil unique de courant \(2I\) : lignes presque circulaires autour de l'ensemble. Sens : main droite, courants sortant du plan \(z=0\) vers les \(z\) positifs ; vues depuis les \(z\) positifs, toutes les lignes tournent dans le sens trigonométrique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Densité de courant non uniforme</h3>
  <div class="statement">Un fil cylindrique de rayon \(a\) est parcouru par un courant de densité \(\vec j = j_0\,\dfrac{r}{a}\,\vec e_z\) (effet de peau débutant : le courant se concentre vers la surface).</div>
  <div class="q"><strong>Q1.</strong> Exprimer l'intensité \(I\) qui traverse le fil en fonction de \(j_0\) et \(a\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer le champ magnétique en tout point, puis vérifier sa continuité en \(r = a\).</div>
  <div class="q"><strong>Q3.</strong> Où le champ est-il maximal ? Comparer à un fil de même intensité parcouru uniformément.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Couronnes d'aire \(2\pi r\,\mathrm{d}r\) : \(I=\displaystyle\int_0^a j_0\frac{r}{a}\,2\pi r\,\mathrm{d}r=\frac{2\pi j_0a^2}{3}\).</p>
    <p><strong>Q2.</strong> Symétries : \(\vec B = B_\theta(r)\,\vec e_\theta\). Cercle d'Ampère de rayon \(r\). Pour \(r\le a\) : \(I_{\text{enlacé}}=\dfrac{2\pi j_0r^3}{3a}\), d'où \(B_\theta=\dfrac{\mu_0 j_0 r^2}{3a}\). Pour \(r\ge a\) : \(B_\theta=\dfrac{\mu_0 I}{2\pi r}=\dfrac{\mu_0 j_0a^2}{3r}\). En \(r = a\), les deux expressions valent \(\mu_0 j_0 a/3\) : continuité (pas de courant surfacique).</p>
    <p><strong>Q3.</strong> \(B_\theta\) croît dans le fil (en \(r^2\)) puis décroît en \(1/r\) : maximum en \(r = a\), où il vaut \(\mu_0 I/(2\pi a)\), comme pour le fil uniforme (seul compte le courant total enlacé). À l'intérieur, le champ est plus faible que pour le fil uniforme (\(r^2/a^2 \lt r/a\)), car le courant enlacé est moindre.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Bobine torique à section rectangulaire</h3>
  <div class="statement">Un tore d'axe \(Oz\), de section rectangulaire (rayons \(R_1 \lt R_2\), hauteur \(h\)), porte \(N\) spires jointives parcourues par \(I\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\vec B\) est orthoradial et déterminer son expression dans le tore et hors du tore.</div>
  <div class="q"><strong>Q2.</strong> Calculer le flux de \(\vec B\) à travers une section du tore, puis le flux total à travers les \(N\) spires. En déduire l'inductance propre \(L\) de la bobine.</div>
  <div class="q"><strong>Q3.</strong> A.N. : \(N = 500\), \(R_1 = 4\ \text{cm}\), \(R_2 = 6\ \text{cm}\), \(h = 2\ \text{cm}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tout plan contenant l'axe est plan de symétrie des courants : \(\vec B\) lui est orthogonal, donc orthoradial. Invariance par rotation : \(\vec B = B_\theta(r, z)\,\vec e_\theta\). Un cercle d'axe \(Oz\), de rayon \(r\), à la cote \(z\), enlace \(NI\) s'il est dans le tore et \(0\) sinon : \(B_\theta = \dfrac{\mu_0NI}{2\pi r}\) dans le tore, \(\vec B = \vec 0\) à l'extérieur.</p>
    <p><strong>Q2.</strong> Flux à travers une section : \(\phi=\displaystyle\int_{R_1}^{R_2}\frac{\mu_0NI}{2\pi r}\,h\,\mathrm{d}r=\frac{\mu_0NIh}{2\pi}\ln\frac{R_2}{R_1}\). Flux propre \(\Phi = N\phi = LI\), d'où \(L=\dfrac{\mu_0N^2h}{2\pi}\ln\dfrac{R_2}{R_1}\).</p>
    <p><strong>Q3.</strong> Avec \(N^2 = 2{,}5\times10^{5}\) et \(\ln(R_2/R_1) = \ln1{,}5\approx0{,}41\) :</p>
    <div class="formula">$$L = 2\times10^{-7}\times2{,}5\times10^{5}\times0{,}02\times\ln1{,}5\approx 0{,}41\ \text{mH}$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Câble coaxial en courant continu : champ dans les quatre zones</h3>
  <div class="statement">Un câble coaxial rectiligne, supposé infini, d'axe \(Oz\), comporte une âme cylindrique de rayon \(a\), parcourue par l'intensité \(I\) dans le sens de \(\vec e_z\), et une gaine cylindrique de rayons \(b\lt c\), parcourue par le courant de retour \(-I\). Dans chaque conducteur, le courant est uniformément réparti. Données : \(a=0{,}50\ \text{mm}\), \(b=2{,}0\ \text{mm}\), \(c=2{,}4\ \text{mm}\), \(I=2{,}0\ \text{A}\), \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer les vecteurs densité de courant \(\vec j\) dans l'âme et dans la gaine. Vérifier qu'ils correspondent bien aux intensités \(I\) et \(-I\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\vec B=B_\theta(r)\,\vec e_\theta\) et préciser le contour d'Ampère et son orientation.</div>
  <div class="q"><strong>Q3.</strong> Établir \(B_\theta(r)\) dans les quatre zones \(r\le a\), \(a\le r\le b\), \(b\le r\le c\), \(r\ge c\). Vérifier la continuité aux interfaces et tracer l'allure de \(B_\theta(r)\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(B(a)\) et \(B(b)\). Où le champ est-il maximal ? Comparer au champ qu'un fil unique parcouru par \(2{,}0\ \text{A}\) créerait à \(10\ \text{cm}\).</div>
  <div class="q"><strong>Q5.</strong> Calculer le flux de \(\vec B\) à travers un rectangle d'un demi-plan méridien, de longueur \(\ell=1\ \text{m}\) le long de l'axe et compris entre \(r=a\) et \(r=b\). En déduire la contribution de l'isolant à l'inductance du câble par unité de longueur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Âme : \(\vec j=\dfrac{I}{\pi a^2}\,\vec e_z\) ; gaine : \(\vec j=-\dfrac{I}{\pi(c^2-b^2)}\,\vec e_z\). Le flux à travers une section orientée par \(\vec e_z\) vaut bien \(\dfrac{I}{\pi a^2}\times\pi a^2=I\) pour l'âme et \(-I\) pour la gaine.</p>
    <p><strong>Q2.</strong> Tout plan contenant l'axe et \(M\) est plan de symétrie des courants : \(\vec B(M)\) lui est orthogonal, donc orthoradial. Invariances par translation selon \(Oz\) et par rotation autour de \(Oz\) : \(\vec B=B_\theta(r)\,\vec e_\theta\). Contour : cercle d'axe \(Oz\), de rayon \(r\), parcouru dans le sens de \(\vec e_\theta\) ; la normale du disque qu'il borde est \(\vec e_z\) (main droite). Circulation : \(2\pi r\,B_\theta(r)\).</p>
    <p><strong>Q3.</strong> Courant enlacé et champ, zone par zone :</p>
    <ul>
      <li>\(r\le a\) : \(I_{\text{enlacé}}=I\,r^2/a^2\), donc \(B_\theta=\dfrac{\mu_0Ir}{2\pi a^2}\) ;</li>
      <li>\(a\le r\le b\) : \(I_{\text{enlacé}}=I\), donc \(B_\theta=\dfrac{\mu_0I}{2\pi r}\) ;</li>
      <li>\(b\le r\le c\) : \(I_{\text{enlacé}}=I\,\dfrac{c^2-r^2}{c^2-b^2}\), donc \(B_\theta=\dfrac{\mu_0I}{2\pi r}\,\dfrac{c^2-r^2}{c^2-b^2}\) ;</li>
      <li>\(r\ge c\) : \(I_{\text{enlacé}}=I-I=0\), donc \(\vec B=\vec 0\).</li>
    </ul>
    <p>Les expressions se raccordent en \(r=a\) (\(\mu_0I/(2\pi a)\)), en \(r=b\) (\(\mu_0I/(2\pi b)\)) et en \(r=c\) (0) : continuité, car il n'y a pas de courant surfacique. Allure : droite croissante dans l'âme, hyperbole décroissante dans l'isolant, puis chute jusqu'à zéro dans la gaine, champ nul au-delà.</p>
    <p><strong>Q4.</strong> \(B(a)=\dfrac{2\times10^{-7}\times2{,}0}{5{,}0\times10^{-4}}=0{,}80\ \text{mT}\) : c'est le maximum (le champ croît dans l'âme puis décroît). \(B(b)=0{,}20\ \text{mT}\). Un fil unique de \(2{,}0\ \text{A}\) créerait \(4{,}0\ \mu\text{T}\) à \(10\ \text{cm}\), environ le dixième du champ terrestre ; le câble coaxial, lui, ne crée aucun champ à l'extérieur : il ne perturbe pas son environnement et, réciproquement, il est peu sensible aux champs extérieurs.</p>
    <p><strong>Q5.</strong> La normale du rectangle est \(\vec e_\theta\), parallèle au champ :</p>
    <div class="formula">$$\Phi=\int_a^b\frac{\mu_0I}{2\pi r}\,\ell\,\mathrm{d}r=\frac{\mu_0I\ell}{2\pi}\ln\frac ba\approx5{,}5\times10^{-7}\ \text{Wb}$$</div>
    <p>Le flux propre est proportionnel à \(I\) : par unité de longueur, \(\Phi/(I\ell)=\dfrac{\mu_0}{2\pi}\ln\dfrac ba\approx0{,}28\ \mu\text{H·m}^{-1}\), l'ordre de grandeur des inductances linéiques des câbles coaxiaux usuels (le champ intérieur aux conducteurs ajoute une petite contribution).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Plaque épaisse parcourue par un courant : l'analogue du plan chargé</h3>
  <div class="statement">Une plaque conductrice occupe la région \(-e/2\le x\le e/2\) ; elle est supposée infinie selon \(y\) et \(z\) et parcourue par un courant de densité uniforme \(\vec j=j\,\vec e_z\) (\(j\gt0\)). C'est le modèle d'une barre de distribution d'énergie (barre « omnibus ») très large devant son épaisseur. Données : \(e=1{,}0\ \text{cm}\), largeur réelle de la barre \(w=20\ \text{cm}\), intensité \(I=2{,}0\ \text{kA}\), \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\vec B=B_y(x)\,\vec e_y\) et que \(B_y\) est une fonction impaire de \(x\).</div>
  <div class="q"><strong>Q2.</strong> En appliquant le théorème d'Ampère à un rectangle bien choisi, que l'on orientera, établir \(B_y(x)\) dans la plaque et hors de la plaque. Tracer l'allure de \(B_y(x)\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(j\) et la valeur du champ près de la barre. Dans quelles conditions le modèle de la plaque infinie est-il valable ?</div>
  <div class="q"><strong>Q4.</strong> On place, parallèlement à la première, une seconde plaque identique parcourue par la densité \(-\vec j\) (courant de retour), à une distance \(D\) de la première (entre leurs faces en regard). Déterminer le champ entre les plaques et à l'extérieur.</div>
  <div class="q"><strong>Q5.</strong> Comparer ces résultats à ceux de l'électrostatique pour une couche plane chargée et pour le condensateur plan.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le plan \(y=y_M\) passant par \(M\), parallèle à \(\vec e_x\) et \(\vec e_z\), laisse la plaque et les courants (parallèles à lui) invariants : c'est un plan de symétrie des courants, donc \(\vec B(M)\) lui est orthogonal, porté par \(\vec e_y\). Le plan \(z=z_M\) est d'antisymétrie (les courants le traversent) : \(\vec B(M)\) y est contenu, cohérent. Invariances par translation selon \(y\) et \(z\) : \(\vec B=B_y(x)\,\vec e_y\). Enfin, le plan \(x=0\) est plan de symétrie des courants : en \(x=0\), \(\vec B\) devrait lui être orthogonal, donc selon \(\vec e_x\) ; comme il est selon \(\vec e_y\), \(B_y(0)=0\). Plus généralement, \(\vec B(-x)\) est l'opposé du symétrique de \(\vec B(x)\) ; la composante \(B_y\), parallèle au plan, change de signe : \(B_y(-x)=-B_y(x)\).</p>
    <p><strong>Q2.</strong> Rectangle situé dans un plan \(z=\text{cste}\), de côtés parallèles à \(\vec e_y\) (longueur \(L\)) placés en \(x\) et en \(-x\), et de côtés parallèles à \(\vec e_x\). On le parcourt dans le sens \(+\vec e_y\) sur le côté en \(x\gt0\) et \(-\vec e_y\) sur le côté en \(-x\) : la main droite donne la normale \(+\vec e_z\). Sur les côtés parallèles à \(\vec e_x\), \(\vec B\perp\mathrm{d}\vec\ell\) : circulation nulle. Circulation totale : \(B_y(x)L-B_y(-x)L=2LB_y(x)\).</p>
    <ul>
      <li>pour \(0\le x\le e/2\) : \(I_{\text{enlacé}}=j\times2xL\), d'où \(B_y(x)=\mu_0jx\) ;</li>
      <li>pour \(x\ge e/2\) : \(I_{\text{enlacé}}=j\,eL\), d'où \(B_y=\dfrac{\mu_0je}{2}\), <strong>uniforme</strong> ; et \(B_y=-\dfrac{\mu_0je}{2}\) pour \(x\le-e/2\).</li>
    </ul>
    <p>Allure : droite de pente \(\mu_0j\) dans la plaque, raccordée continûment (pas de courant surfacique) à deux paliers \(\pm\mu_0je/2\).</p>
    <p><strong>Q3.</strong> \(j=\dfrac{I}{ew}=\dfrac{2{,}0\times10^{3}}{0{,}010\times0{,}20}=1{,}0\times10^{6}\ \text{A·m}^{-2}\) (\(1\ \text{A·mm}^{-2}\)). Près de la barre : \(B=\dfrac{\mu_0je}{2}=\dfrac{\mu_0I}{2w}\approx6{,}3\ \text{mT}\), plus de cent fois le champ terrestre. Le modèle infini vaut à une distance de la barre petite devant sa largeur \(w\) et loin de ses bords ; loin de la barre (\(r\gg w\)), on retrouve au contraire le champ d'un fil, \(\mu_0I/(2\pi r)\).</p>
    <p><strong>Q4.</strong> Superposition : la seconde plaque (densité \(-\vec j\)) crée \(-\mu_0je/2\,\vec e_y\) du côté \(x\) croissant et \(+\mu_0je/2\,\vec e_y\) de l'autre. Si elle est placée du côté des \(x\) positifs : entre les plaques, les deux champs valent \(+\mu_0je/2\) et s'ajoutent, \(B_y=\mu_0je\) (uniforme) ; à l'extérieur, ils sont opposés et se compensent, \(\vec B=\vec 0\). Le champ est confiné entre les conducteurs aller et retour, comme dans un câble coaxial.</p>
    <p><strong>Q5.</strong> La plaque est l'analogue de la couche plane chargée (champ linéaire dans la couche, uniforme et de signes opposés de part et d'autre, \(\pm\rho e/(2\varepsilon_0)\)), avec \(\varepsilon_0^{-1}\leftrightarrow\mu_0\) et \(\rho\leftrightarrow j\). Les deux plaques parcourues en sens inverses sont l'analogue du condensateur plan : champ uniforme entre elles, nul au-dehors. Différence essentielle : \(\vec E\) est normal à la couche chargée, alors que \(\vec B\) est parallèle à la plaque et orthogonal au courant.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Concevoir un solénoïde : nombre de couches, densité de courant, validité du modèle</h3>
  <div class="statement">On veut produire un champ de \(B_0=10\ \text{mT}\) au centre d'une bobine de longueur \(L=30\ \text{cm}\) et de rayon \(R=2{,}0\ \text{cm}\), réalisée en fil de cuivre de diamètre \(\delta=0{,}80\ \text{mm}\), à spires jointives (on néglige l'épaisseur de l'émail isolant). Pour un fonctionnement continu sans refroidissement, la densité de courant dans le cuivre ne doit pas dépasser \(j_{\max}\approx4\ \text{A·mm}^{-2}\). On donne, pour une bobine de longueur \(L\) et de rayon \(R\), le champ au centre (loi de Biot et Savart, hors programme) : \(B_c=\mu_0nI\,\dfrac{L}{\sqrt{L^2+4R^2}}\).</div>
  <div class="q"><strong>Q1.</strong> Rappeler le champ d'un solénoïde infini de \(n\) spires par mètre. Combien vaut \(n\) pour une couche de spires jointives ?</div>
  <div class="q"><strong>Q2.</strong> Quelle intensité faudrait-il avec une seule couche ? Calculer la densité de courant correspondante et conclure.</div>
  <div class="q"><strong>Q3.</strong> On superpose \(k\) couches identiques, toutes parcourues dans le même sens. Justifier que le champ au centre est multiplié par \(k\) à intensité donnée. Combien de couches faut-il au minimum ? Quelle intensité ?</div>
  <div class="q"><strong>Q4.</strong> Le modèle du solénoïde infini est-il justifié au centre ? Que vaut le champ sur l'axe à une extrémité de la bobine ?</div>
  <div class="q"><strong>Q5.</strong> Vu depuis une extrémité, le courant circule dans le sens trigonométrique. Le champ intérieur se dirige-t-il vers l'observateur ou s'en éloigne-t-il ? Quelle précaution prendre si l'on veut mesurer précisément \(B_0\) avec une sonde ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec B=\mu_0nI\,\vec e_z\) à l'intérieur, nul à l'extérieur. Spires jointives de diamètre \(\delta\) : \(n=1/\delta=1\,250\ \text{m}^{-1}\) par couche.</p>
    <p><strong>Q2.</strong> \(I_1=\dfrac{B_0}{\mu_0n}=\dfrac{1{,}0\times10^{-2}}{4\pi\times10^{-7}\times1\,250}\approx6{,}4\ \text{A}\). Section du cuivre : \(s=\pi(0{,}40\ \text{mm})^2\approx0{,}50\ \text{mm}^2\), d'où \(j=I_1/s\approx13\ \text{A·mm}^{-2}\) : trois fois trop, le fil chaufferait exagérément (effet Joule).</p>
    <p><strong>Q3.</strong> Dans le modèle infini, chaque couche crée \(\mu_0nI\) à l'intérieur et rien à l'extérieur : au centre, intérieur à toutes les couches, les champs s'ajoutent (superposition), soit \(\mu_0knI\). Il faut \(j=\dfrac{B_0}{\mu_0kns}\le j_{\max}\), donc \(k\ge\dfrac{13}{4}\approx3{,}2\) : <strong>4 couches</strong>, parcourues par \(I=I_1/4\approx1{,}6\ \text{A}\) (\(j\approx3{,}2\ \text{A·mm}^{-2}\)). La bobine compte alors \(4\times375=1\,500\) spires, soit environ \(190\ \text{m}\) de fil (l'épaisseur des couches, 3 mm, reste petite devant \(R\)).</p>
    <p><strong>Q4.</strong> \(\dfrac{L}{\sqrt{L^2+4R^2}}=\dfrac{0{,}30}{\sqrt{0{,}090+0{,}0016}}\approx0{,}991\) : le champ au centre ne diffère de \(\mu_0nI\) que de 0,9 %, le modèle infini est justifié (\(L/R=15\)). À une extrémité, sur l'axe, le champ ne vaut qu'environ la moitié, \(\approx5\ \text{mT}\) (cours, §7 : chaque demi-solénoïde apporte la moitié du champ axial).</p>
    <p><strong>Q5.</strong> Main droite : les doigts suivent le courant (sens trigonométrique vu par l'observateur), le pouce pointe vers l'observateur : le champ intérieur se dirige vers lui ; cette extrémité est la face « nord » de la bobine. Le champ terrestre (\(\approx50\ \mu\text{T}\), soit 0,5 % de \(B_0\)) se superpose au champ de la bobine : pour une mesure précise, on fait la mesure avec les deux sens du courant et l'on prend la demi-différence, ou l'on oriente l'axe perpendiculairement au champ terrestre.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Cavité dans un conducteur : un champ uniforme</h3>
  <div class="statement">Un conducteur cylindrique infini d'axe \(Oz\) passant par \(O\), de rayon \(R\), est parcouru par une densité de courant uniforme \(\vec j = j\,\vec e_z\). On y creuse une cavité cylindrique d'axe parallèle passant par \(O'\), de rayon \(r_0\), avec \(OO' = d\) et \(d + r_0 \lt R\).</div>
  <div class="q"><strong>Q1.</strong> Montrer qu'à l'intérieur d'un cylindre plein parcouru par \(\vec j\) uniforme, \(\vec B = \dfrac{\mu_0}{2}\,\vec j\wedge\overrightarrow{HM}\), où \(H\) est le projeté de \(M\) sur l'axe.</div>
  <div class="q"><strong>Q2.</strong> En déduire le champ dans la cavité par superposition. Commenter.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'intensité totale qui parcourt le conducteur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Théorème d'Ampère sur un cercle de rayon \(r\) : \(2\pi r B_\theta = \mu_0 j\pi r^2\), soit \(B_\theta = \mu_0 jr/2\). Or \(\vec j\wedge\overrightarrow{HM} = jr\,\vec e_z\wedge\vec e_r = jr\,\vec e_\theta\) : d'où \(\vec B = \dfrac{\mu_0}{2}\vec j\wedge\overrightarrow{HM}\).</p>
    <p><strong>Q2.</strong> Conducteur à cavité = cylindre plein (\(\vec j\), axe \(O\)) + cylindre de la cavité (\(-\vec j\), axe \(O'\)). En \(M\) dans la cavité :</p>
    <div class="formula">$$\vec B = \frac{\mu_0}{2}\vec j\wedge\big(\overrightarrow{HM} - \overrightarrow{H'M}\big) = \frac{\mu_0}{2}\vec j\wedge\overrightarrow{OO'}$$</div>
    <p>Le champ est uniforme, de norme \(\mu_0jd/2\), orthogonal au plan contenant les deux axes. Il est nul si la cavité est centrée (\(d = 0\)).</p>
    <p><strong>Q3.</strong> \(I = j\,\pi(R^2 - r_0^2)\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Deux solénoïdes coaxiaux en sens contraires : flux de retour et blindage actif</h3>
  <div class="statement">Deux solénoïdes infinis coaxiaux, de rayons \(R_1 \lt R_2\), comportent \(n_1\) et \(n_2\) spires par mètre. Ils sont parcourus par la même intensité \(I\), mais en sens contraires.</div>
  <div class="q"><strong>Q1.</strong> Déterminer le champ dans les trois régions \(r \lt R_1\), \(R_1 \lt r \lt R_2\), \(r \gt R_2\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le flux \(\Phi_1\) de \(\vec B\) à travers la section droite \(r \lt R_1\), orientée par \(\vec e_z\), puis le flux \(\Phi_2\) à travers la couronne \(R_1 \lt r \lt R_2\). À quelle condition sur \(n_1\), \(n_2\), \(R_1\), \(R_2\) le flux total à travers une section du dispositif est-il nul ?</div>
  <div class="q"><strong>Q3.</strong> On prend \(n_1 = 2n_2\) et \(R_2 = \sqrt2\,R_1\). Vérifier la condition de Q2 et représenter quelques lignes de champ dans un plan contenant l'axe. Pour des bobines réelles, de longueur finie, quel est l'intérêt de cette disposition ? (C'est le principe du « blindage actif » des aimants d'IRM.)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Superposition des champs \(\mu_0n_1I\,\vec e_z\) (pour \(r \lt R_1\)) et \(-\mu_0n_2I\,\vec e_z\) (pour \(r \lt R_2\)), chacun nul à l'extérieur de son solénoïde : \(\vec B = \mu_0(n_1 - n_2)I\,\vec e_z\) pour \(r \lt R_1\) ; \(\vec B = -\mu_0n_2I\,\vec e_z\) entre les deux ; \(\vec B = \vec 0\) au-delà de \(R_2\).</p>
    <p><strong>Q2.</strong> Les champs étant uniformes dans chaque région : \(\Phi_1 = \mu_0(n_1 - n_2)I\,\pi R_1^2\) et \(\Phi_2 = -\mu_0n_2I\,\pi(R_2^2 - R_1^2)\). Le flux total à travers le disque \(r \lt R_2\) vaut \(\Phi_1 + \Phi_2 = \mu_0I\pi\big(n_1R_1^2 - n_2R_2^2\big)\) : il est nul si \(n_1R_1^2 = n_2R_2^2\). (Cas particulier \(n_1 = n_2\) : champ nul au centre et \(-\mu_0nI\) dans la couronne seulement.)</p>
    <p><strong>Q3.</strong> \(n_1R_1^2 = 2n_2R_1^2 = n_2R_2^2\) : la condition est vérifiée. Champ \(+\mu_0n_2I\) au centre et \(-\mu_0n_2I\) dans la couronne : lignes parallèles à l'axe, de sens opposés dans les deux régions, de même densité (même norme du champ) ; la couronne ayant la même aire que le disque central, elle transporte exactement le flux de retour. Pour des bobines réelles, les lignes qui sortent de la région centrale par une extrémité reviennent par la couronne au lieu de se refermer largement à l'extérieur : le champ de fuite autour de l'appareil est fortement réduit. C'est ainsi qu'on limite le champ autour d'une IRM sans l'entourer de tonnes de fer.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Ligne bifilaire à courant continu : champ sous la ligne</h3>
  <div class="statement">Une ligne de transport en courant continu est modélisée par deux conducteurs cylindriques parallèles de rayon \(a = 2\ \text{cm}\), d'axes distants de \(D = 1\ \text{m}\), parcourus par \(I = 2\ \text{kA}\) en sens opposés, le courant étant uniforme dans chaque section.</div>
  <div class="q"><strong>Q1.</strong> Donner le champ créé par un seul conducteur à l'intérieur et à l'extérieur. Calculer sa valeur maximale.</div>
  <div class="q"><strong>Q2.</strong> Par superposition, exprimer le champ au milieu des deux conducteurs, puis en un point \(M\) situé dans le plan des axes, à la distance \(x \gg D\) du milieu. Comment décroît-il ?</div>
  <div class="q"><strong>Q3.</strong> Une personne se tient à 20 m sous la ligne (dans le plan médiateur des deux conducteurs, supposés dans un même plan horizontal). Estimer le champ et le comparer au champ terrestre.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(B_\theta = \dfrac{\mu_0Ir}{2\pi a^2}\) pour \(r \le a\) et \(\dfrac{\mu_0I}{2\pi r}\) pour \(r \ge a\) ; maximum en \(r = a\) : \(B = 2\times10^{-7}\times2\times10^{3}/0{,}02 = 20\ \text{mT}\).</p>
    <p><strong>Q2.</strong> Au milieu, les deux champs, chacun de norme \(\dfrac{\mu_0I}{2\pi(D/2)}\), sont de même sens (courants opposés, points situés de part et d'autre) : \(B = \dfrac{2\mu_0I}{\pi D} = 1{,}6\ \text{mT}\). Dans le plan des axes, à \(x\) du milieu :</p>
    <div class="formula">$$B = \frac{\mu_0I}{2\pi}\Big(\frac{1}{x - D/2} - \frac{1}{x + D/2}\Big) = \frac{\mu_0ID}{2\pi(x^2 - D^2/4)} \approx \frac{\mu_0ID}{2\pi x^2}$$</div>
    <p>C'est une décroissance en \(1/x^2\), les contributions en \(1/x\) se compensent.</p>
    <p><strong>Q3.</strong> Sur la médiatrice, à la distance \(y\) du plan des fils, chaque fil est à \(d = \sqrt{y^2 + D^2/4}\) ; les composantes verticales se compensent et les horizontales s'ajoutent :</p>
    <div class="formula">$$B = 2\,\frac{\mu_0I}{2\pi d}\,\frac{D/2}{d} = \frac{\mu_0ID}{2\pi d^2} \approx \frac{2\times10^{-7}\times2\times10^{3}\times1}{400} = 1\ \text{µT}$$</div>
    <p>C'est cinquante fois moins que le champ terrestre.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Faisceau de protons : champs propres, répulsion électrique et pincement magnétique</h3>
  <div class="statement">Un faisceau de protons (charge \(e\), masse \(m_p\)) est modélisé par un cylindre infini d'axe \(Oz\) et de rayon \(a\), dans lequel les protons, de densité particulaire \(n\) uniforme, ont tous la vitesse \(\vec v=v\,\vec e_z\) ; il n'y a pas de charge en dehors du faisceau. Données : intensité \(I=1{,}0\ \text{mA}\), \(a=1{,}0\ \text{mm}\), énergie cinétique des protons \(1{,}0\ \text{MeV}\), \(e=1{,}6\times10^{-19}\ \text{C}\), \(m_p=1{,}67\times10^{-27}\ \text{kg}\), \(\varepsilon_0=8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\), \(c=1/\sqrt{\varepsilon_0\mu_0}=3{,}0\times10^{8}\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer la densité volumique de charge \(\rho\), le vecteur densité de courant \(\vec j\) et l'intensité \(I\) du faisceau en fonction de \(n\), \(e\), \(v\) et \(a\).</div>
  <div class="q"><strong>Q2.</strong> Par le théorème de Gauss, établir le champ électrique \(\vec E\) à l'intérieur du faisceau (\(r\le a\)).</div>
  <div class="q"><strong>Q3.</strong> Par le théorème d'Ampère, établir le champ magnétique \(\vec B\) à l'intérieur du faisceau. Justifier soigneusement la direction de chacun des deux champs.</div>
  <div class="q"><strong>Q4.</strong> Exprimer la force de Lorentz subie par un proton du faisceau situé à la distance \(r\) de l'axe. Montrer que le rapport de la force magnétique à la force électrique vaut \(v^2/c^2\). Interpréter les signes.</div>
  <div class="q"><strong>Q5.</strong> Application numérique : calculer \(v\), \(n\), \(E(a)\), \(B(a)\) et le rapport des forces. Le faisceau reste-t-il parallèle ? Que se passerait-il pour des particules presque aussi rapides que la lumière ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\rho=ne\) ; \(\vec j=ne\,\vec v=\rho v\,\vec e_z\) ; l'intensité est le flux de \(\vec j\) à travers une section : \(I=nev\,\pi a^2\).</p>
    <p><strong>Q2.</strong> Distribution de charge à symétrie cylindrique : \(\vec E=E_r(r)\,\vec e_r\) (les plans contenant l'axe et \(M\), et le plan perpendiculaire à l'axe passant par \(M\), sont de symétrie). Cylindre de Gauss coaxial de rayon \(r\le a\), de hauteur \(h\) : \(2\pi rh\,E_r=\dfrac{\rho\pi r^2h}{\varepsilon_0}\), d'où \(\vec E=\dfrac{\rho\,r}{2\varepsilon_0}\,\vec e_r\) : champ radial, dirigé vers l'extérieur.</p>
    <p><strong>Q3.</strong> Pour les courants, le plan contenant l'axe et \(M\) est de symétrie : \(\vec B\) lui est orthogonal, donc orthoradial (règle inverse de celle de \(\vec E\)). Cercle d'axe \(Oz\) de rayon \(r\le a\), orienté selon \(\vec e_\theta\) (normale \(\vec e_z\)) : \(2\pi r\,B_\theta=\mu_0j\pi r^2\), d'où \(\vec B=\dfrac{\mu_0j\,r}{2}\,\vec e_\theta\).</p>
    <p><strong>Q4.</strong> Avec \(\vec e_z\wedge\vec e_\theta=-\vec e_r\) :</p>
    <div class="formula">$$\vec F=e\big(\vec E+v\,\vec e_z\wedge\vec B\big)=\frac{e\,r}{2}\Big(\frac{\rho}{\varepsilon_0}-\mu_0\rho v^2\Big)\vec e_r=\frac{e\rho\,r}{2\varepsilon_0}\Big(1-\frac{v^2}{c^2}\Big)\vec e_r$$</div>
    <p>La force électrique est répulsive (vers l'extérieur) : les protons, de même signe, se repoussent. La force magnétique est attractive (vers l'axe) : deux courants parallèles de même sens s'attirent, c'est l'effet de « pincement ». Leur rapport vaut \(\dfrac{\mu_0\rho v^2}{\rho/\varepsilon_0}=\varepsilon_0\mu_0v^2=\dfrac{v^2}{c^2}\).</p>
    <p><strong>Q5.</strong> Avec \(E_c=1{,}0\ \text{MeV}=1{,}6\times10^{-13}\ \text{J}\) : \(v=\sqrt{2E_c/m_p}\approx1{,}4\times10^{7}\ \text{m·s}^{-1}\) (\(v/c\approx0{,}046\)). \(n=\dfrac{I}{ev\pi a^2}\approx1{,}4\times10^{14}\ \text{m}^{-3}\), soit \(\rho\approx2{,}3\times10^{-5}\ \text{C·m}^{-3}\). Au bord du faisceau : \(E(a)=\dfrac{\rho a}{2\varepsilon_0}\approx1{,}3\times10^{3}\ \text{V·m}^{-1}\) et \(B(a)=\dfrac{\mu_0I}{2\pi a}=0{,}20\ \mu\text{T}\), d'où \(vB(a)\approx2{,}8\ \text{V·m}^{-1}\) : la force magnétique ne compense que \(v^2/c^2\approx2\times10^{-3}\) de la force électrique. Le faisceau diverge sous l'effet de sa propre charge (« charge d'espace ») : il faut le refocaliser par des lentilles électrostatiques ou magnétiques. Pour \(v\to c\), la force totale, proportionnelle à \(1-v^2/c^2\), tend vers zéro : les faisceaux ultrarelativistes des grands accélérateurs sont presque insensibles à leurs propres champs.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Les champs magnétiques d'un tokamak</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>magnétostatique : bobine torique, fil épais, superposition, lignes de champ, ordres de grandeur</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Dans un tokamak, un plasma de deutérium et de tritium, à plus de cent millions de kelvins, est confiné par des champs magnétiques dans une enceinte en forme de tore d'axe vertical \(Oz\). On adopte les coordonnées cylindriques \((r,\theta,z)\) d'axe \(Oz\). Le plasma occupe un tore de grand rayon \(R_0\) et de section circulaire de rayon \(a\) ; on note \(s\) la distance d'un point à l'axe circulaire du plasma (le cercle \(r=R_0\), \(z=0\)).
    <br>Données (ordres de grandeur du projet ITER) : \(R_0=6{,}2\ \text{m}\) ; \(a=2{,}0\ \text{m}\) ; 18 bobines toriques de 134 spires chacune, parcourues par \(I_b=68\ \text{kA}\) ; courant circulant dans le plasma \(I_p=15\ \text{MA}\) ; \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\) ; \(e=1{,}6\times10^{-19}\ \text{C}\).
  </div>

  <p class="exo-part">Partie A — Le champ toroïdal</p>
  <div class="q"><strong>A1.</strong> On modélise les 18 bobines par une bobine torique de \(N\) spires régulièrement réparties autour de l'axe \(Oz\). Calculer \(N\). Montrer que le champ créé est de la forme \(\vec B_T=B_T(r,z)\,\vec e_\theta\).</div>
  <div class="q"><strong>A2.</strong> Par le théorème d'Ampère, établir \(B_T\) à l'intérieur et à l'extérieur du tore des bobines. Préciser l'orientation choisie.</div>
  <div class="q"><strong>A3.</strong> Calculer \(B_T\) sur l'axe du plasma (\(r=R_0\)), puis aux bords intérieur (\(r=R_0-a\)) et extérieur (\(r=R_0+a\)) du plasma. Le champ est-il uniforme ? Que vaut-il au niveau des conducteurs intérieurs des bobines, vers \(r=3\ \text{m}\) ?</div>

  <p class="exo-part">Partie B — Le champ poloïdal créé par le courant du plasma</p>
  <div class="q"><strong>B1.</strong> Le courant \(I_p\) circule dans le plasma le long du tore, selon \(\vec e_\theta\). Pour l'étudier localement, on assimile le plasma à un cylindre rectiligne infini de rayon \(a\), parcouru par \(I_p\) uniformément réparti. Justifier qualitativement cette approximation et ses limites.</div>
  <div class="q"><strong>B2.</strong> Établir dans ce modèle le champ \(B_P(s)\) créé par le plasma, à l'intérieur et à l'extérieur. Calculer \(B_P(a)\) et le comparer à \(B_T(R_0)\).</div>
  <div class="q"><strong>B3.</strong> Calculer la densité de courant dans le plasma. La densité électronique y vaut \(n_e\approx1\times10^{20}\ \text{m}^{-3}\) : estimer la vitesse moyenne d'ensemble des électrons qui porte ce courant. Comparer à un fil de cuivre domestique.</div>

  <p class="exo-part">Partie C — Lignes de champ hélicoïdales</p>
  <div class="q"><strong>C1.</strong> Le champ total est \(\vec B=\vec B_T+\vec B_P\). Montrer qu'une ligne de champ issue d'un point situé à la distance \(s\) de l'axe du plasma reste sur le tore de rayon \(s\) (surface « magnétique »), et décrire sa forme.</div>
  <div class="q"><strong>C2.</strong> Dans l'approximation \(s\ll R_0\), montrer que le nombre de tours qu'une ligne effectue le long du grand tour du tore pendant qu'elle fait un tour autour de l'axe du plasma vaut \(q(s)=\dfrac{s\,B_T}{R_0\,B_P(s)}\). Calculer \(q\) dans le plasma ; pourquoi ne dépend-il pas de \(s\) dans ce modèle ?</div>
  <div class="q"><strong>C3.</strong> La stabilité du plasma exige \(q\gt1\). Quel courant plasma maximal ce modèle autorise-t-il ? Commenter.</div>

  <p class="exo-part">Partie D — Ordres de grandeur</p>
  <div class="q"><strong>D1.</strong> On admet que l'énergie magnétique est répartie avec la densité volumique \(w_m=\dfrac{B^2}{2\mu_0}\). Estimer l'énergie du champ toroïdal contenue dans le volume du plasma, en prenant \(B\approx B_T(R_0)\). La comparer à l'énergie libérée par une tonne de TNT (\(4{,}2\times10^{9}\ \text{J}\)).</div>
  <div class="q"><strong>D2.</strong> Situer \(B_T(R_0)\) par rapport au champ terrestre, à une IRM médicale et aux aimants du LHC.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(N=18\times134=2\,412\) spires. Chaque spire est contenue dans un demi-plan méridien (contenant \(Oz\)) ; avec un enroulement régulier, tout plan contenant l'axe \(Oz\) est plan de symétrie des courants : \(\vec B\) lui est orthogonal, donc selon \(\vec e_\theta\). L'invariance par rotation autour de \(Oz\) supprime la variable \(\theta\) : \(\vec B_T=B_T(r,z)\,\vec e_\theta\).</p>
    <p><strong>A2.</strong> Cercle d'axe \(Oz\), de rayon \(r\), à la cote \(z\), parcouru dans le sens de \(\vec e_\theta\) (normale \(\vec e_z\)) : circulation \(2\pi r\,B_T\). À l'intérieur du tore des bobines, le disque qu'il borde est traversé \(N\) fois par le courant \(I_b\) (brins intérieurs des spires) ; à l'extérieur, il n'est traversé par aucun courant, ou bien deux fois en sens opposés (\(NI_b-NI_b=0\)). D'où</p>
    <div class="formula">$$B_T=\frac{\mu_0NI_b}{2\pi r}\ \ \text{dans le tore des bobines}\qquad\vec B_T=\vec 0\ \ \text{à l'extérieur}$$</div>
    <p>(avec le sens de courant qui rend \(B_T\) positif).</p>
    <p><strong>A3.</strong> \(NI_b=2\,412\times68\times10^{3}\approx1{,}64\times10^{8}\ \text{A}\), donc \(\mu_0NI_b/(2\pi)\approx32{,}8\ \text{T·m}\) : \(B_T(R_0)\approx5{,}3\ \text{T}\), \(B_T(R_0-a)\approx7{,}8\ \text{T}\), \(B_T(R_0+a)\approx4{,}0\ \text{T}\). Le champ décroît en \(1/r\) : il varie presque du simple au double à travers le plasma, qui n'est pas plongé dans un champ uniforme. Vers \(r=3\ \text{m}\) : \(B_T\approx11\ \text{T}\), d'où l'emploi de bobines supraconductrices qui supportent ces champs.</p>
    <p><strong>B1.</strong> À une distance \(s\) de l'axe du plasma petite devant \(R_0\), la courbure du tore est peu visible : la portion de plasma proche ressemble à un cylindre rectiligne, et les parties éloignées du tore contribuent peu. L'approximation est grossière ici (\(a/R_0\approx0{,}3\)) ; elle néglige aussi la forme réelle, allongée, de la section du plasma et la non-uniformité du courant.</p>
    <p><strong>B2.</strong> Fil épais (cours, §5) : cercle de rayon \(s\) centré sur l'axe du plasma, dans un plan perpendiculaire à cet axe ; courant enlacé \(I_p\,s^2/a^2\) dedans, \(I_p\) dehors :</p>
    <div class="formula">$$B_P(s\le a)=\frac{\mu_0I_p\,s}{2\pi a^2}\qquad B_P(s\ge a)=\frac{\mu_0I_p}{2\pi s}$$</div>
    <p>\(B_P(a)=\dfrac{2\times10^{-7}\times1{,}5\times10^{7}}{2{,}0}=1{,}5\ \text{T}\), soit 0,28 fois \(B_T(R_0)\) : le champ toroïdal domine.</p>
    <p><strong>B3.</strong> \(j=\dfrac{I_p}{\pi a^2}=\dfrac{1{,}5\times10^{7}}{\pi\times4{,}0}\approx1{,}2\times10^{6}\ \text{A·m}^{-2}\), un peu plus de \(1\ \text{A·mm}^{-2}\) : c'est dix fois moins que dans un fil domestique (\(\approx10\ \text{A·mm}^{-2}\)) ; l'intensité énorme vient de la section énorme. Vitesse d'ensemble : \(v=\dfrac{j}{n_ee}\approx7\times10^{4}\ \text{m·s}^{-1}\), cent millions de fois plus que dans le cuivre (\(\approx0{,}8\ \text{mm·s}^{-1}\)), parce que les porteurs sont environ un milliard de fois moins nombreux par unité de volume.</p>
    <p><strong>C1.</strong> \(\vec B_T\) est dirigé le long du tore (selon \(\vec e_\theta\)) et \(\vec B_P\) tourne autour de l'axe du plasma : tous deux sont tangents à chaque tore \(s=\text{cste}\). Une ligne de champ, tangente en chaque point à \(\vec B\), ne quitte donc jamais le tore sur lequel elle a commencé. Elle s'enroule en hélice : elle avance le long du tore tout en tournant autour de l'axe du plasma.</p>
    <p><strong>C2.</strong> Le long d'une ligne de champ, le déplacement élémentaire est colinéaire à \(\vec B\) : les déplacements le long du grand tour (\(R_0\,\mathrm{d}\theta\)) et autour de l'axe du plasma (\(s\,\mathrm{d}\chi\), \(\chi\) angle autour de cet axe) sont dans le rapport \(\dfrac{R_0\,\mathrm{d}\theta}{s\,\mathrm{d}\chi}=\dfrac{B_T}{B_P}\). Pour un tour autour de l'axe du plasma (\(\Delta\chi=2\pi\)), \(\Delta\theta=\dfrac{2\pi\,sB_T}{R_0B_P}\), soit \(q=\dfrac{\Delta\theta}{2\pi}=\dfrac{sB_T}{R_0B_P(s)}\). Dans le plasma, \(B_P\propto s\) : le rapport \(s/B_P(s)\) est constant et</p>
    <div class="formula">$$q=\frac{2\pi a^2B_T}{\mu_0I_pR_0}=\frac{2\pi\times4{,}0\times5{,}3}{4\pi\times10^{-7}\times1{,}5\times10^{7}\times6{,}2}\approx1{,}1$$</div>
    <p>Il ne dépend pas de \(s\) parce que, pour un courant uniforme, \(B_P\) est proportionnel à \(s\).</p>
    <p><strong>C3.</strong> \(q\gt1\) impose \(I_p\lt\dfrac{2\pi a^2B_T}{\mu_0R_0}\approx17\ \text{MA}\) : le modèle place le fonctionnement nominal (15 MA) à la limite de stabilité. Dans la réalité, la section allongée du plasma et le profil de courant, concentré au centre, donnent \(q\approx3\) au bord : le modèle du cylindre uniforme est trop grossier pour dimensionner la machine, mais il donne le bon ordre de grandeur de la contrainte (plus le champ toroïdal est intense, plus le courant plasma peut être grand).</p>
    <p><strong>D1.</strong> \(w_m=\dfrac{(5{,}3)^2}{2\times4\pi\times10^{-7}}\approx1{,}1\times10^{7}\ \text{J·m}^{-3}\). Volume du plasma : \(2\pi R_0\times\pi a^2\approx4{,}9\times10^{2}\ \text{m}^3\). Énergie : \(W\approx5\times10^{9}\ \text{J}\), plus d'une tonne de TNT ; l'énergie totale des bobines, dont le volume intérieur est plus grand que celui du plasma, est encore bien supérieure. Une coupure brutale de la supraconductivité doit donc être maîtrisée (décharge de l'énergie dans des résistances extérieures).</p>
    <p><strong>D2.</strong> \(5{,}3\ \text{T}\) : cent mille fois le champ terrestre (\(\approx50\ \mu\text{T}\)), deux à trois fois celui d'une IRM médicale (1,5 à 3 T), un peu moins que les aimants du LHC (8,3 T), mais dans un volume de plusieurs centaines de mètres cubes.</p>
