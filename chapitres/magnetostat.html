  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">En PTSI, le champ magnétique a été abordé qualitativement (sources, lignes de champ, moment magnétique, forces de Laplace). La PT ajoute les propriétés <strong>intégrales</strong> du champ : conservation du flux et théorème d'Ampère, qui donnent le champ des distributions très symétriques. La loi de Biot et Savart n'est pas au programme.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles (partie 4.2 « Magnétostatique »)</span>
    <div class="content">
      <ul>
        <li><strong>Courants</strong> : vecteur densité de courant volumique ; relier l'intensité au flux de \(\vec j\) ; distributions volumique et linéique (§1).</li>
        <li><strong>Symétries et invariances</strong> des distributions de courant et conséquences sur le champ (§2).</li>
        <li><strong>Flux et circulation</strong> : propriétés de flux, théorème d'Ampère ; choisir et orienter contour et surface ; reconnaître les situations où le théorème donne le champ (§3, §4).</li>
        <li><strong>Modèles à établir</strong> : fil rectiligne infini de section non nulle (courant uniforme en volume), solénoïde infini (champ extérieur nul admis) (§5, §6).</li>
        <li><strong>Superposition</strong> et <strong>ordres de grandeur</strong> de champs magnétostatiques (§7, §8).</li>
        <li><strong>Lignes et tubes de champ</strong> : orienter, relier leur resserrement à l'intensité, vérifier la compatibilité d'une carte avec les symétries (§3).</li>
      </ul>
      <p>Les formes locales \(\operatorname{div}\vec B = 0\) et \(\overrightarrow{\operatorname{rot}}\,\vec B = \mu_0\vec j\) sont établies dans le chapitre « Équations de Maxwell ». Les courants surfaciques n'apparaissent qu'avec la réflexion des ondes sur un métal.</p>

<div class="course-section">
  <div class="sec-num">§1 · DISTRIBUTIONS DE COURANT</div>
  <h2>Décrire un courant en chaque point</h2>
  <div class="intro">Les sources du champ magnétostatique sont des courants permanents. Comme les charges en électrostatique, on les décrit à l'échelle mésoscopique par une densité, ici vectorielle : elle indique en chaque point la direction et l'intensité de l'écoulement des charges.</div>
  <div class="def-box">
    <strong>Vecteur densité de courant volumique.</strong> Pour des porteurs de charge \(q\), de densité volumique \(n\), animés de la vitesse moyenne \(\vec v\) :
    <div class="formula" data-nom="Densité de courant volumique">$$\vec j = n\,q\,\vec v = \rho_m\,\vec v\qquad(\text{A·m}^{-2})$$</div>
    où \(\rho_m = nq\) est la densité volumique de charges <strong>mobiles</strong>. S'il y a plusieurs types de porteurs, leurs contributions s'ajoutent.
  </div>
  <div class="prop-box">
    <strong>Intensité et flux de \(\vec j\).</strong> L'intensité qui traverse une surface \(S\) orientée par sa normale \(\vec n\) est le flux de \(\vec j\) :
    <div class="formula" data-nom="Intensité, flux de la densité de courant">$$I=\iint_S\vec j\cdot\vec n\,\mathrm{d}S$$</div>
    En effet, pendant \(\mathrm{d}t\), les porteurs qui traversent \(\mathrm{d}S\) occupent un cylindre de volume \(\vec v\,\mathrm{d}t\cdot\vec n\,\mathrm{d}S\) et transportent la charge \(nq\,\vec v\cdot\vec n\,\mathrm{d}S\,\mathrm{d}t\). En régime permanent, le flux de \(\vec j\) à travers toute surface fermée est nul : l'intensité est la même à travers toute section d'un fil (loi des nœuds).
  </div>
  <p><strong>Distribution linéique.</strong> Quand la section d'un conducteur est négligeable devant les autres longueurs (distance au point d'observation), on le modélise par une courbe parcourue par l'intensité \(I\) : c'est le <strong>fil</strong> de l'électrocinétique. Le modèle volumique reste nécessaire pour décrire le champ à l'intérieur du conducteur (§5).</p>
  <div class="method-box">
    <strong>Exemple — densité de courant et vitesse des électrons dans un fil de cuivre</strong>
    <p>Un fil domestique de section \(S = 1{,}5\ \text{mm}^2\) transporte \(I = 16\ \text{A}\). Le cuivre compte \(n \approx 8{,}5\times10^{28}\) électrons de conduction par m³.</p>
    <ol>
      <li>Courant uniforme dans la section : \(j = I/S \approx 1{,}1\times10^{7}\ \text{A·m}^{-2}\), soit environ \(11\ \text{A·mm}^{-2}\).</li>
      <li>Vitesse moyenne des électrons :
        <div class="formula">$$v = \frac{j}{ne} \approx \frac{1{,}1\times10^{7}}{8{,}5\times10^{28}\times1{,}6\times10^{-19}} \approx 0{,}8\ \text{mm·s}^{-1}$$</div></li>
      <li>Les électrons dérivent lentement ; c'est le champ électrique qui s'établit presque instantanément dans tout le circuit. Les \(\vec j\) et \(\vec v\) des électrons sont de sens opposés (\(q = -e\)).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SYMÉTRIES ET INVARIANCES</div>
  <h2>Un pseudo-vecteur : les règles s'inversent</h2>
  <div class="intro">Comme en électrostatique, on prévoit la direction du champ et ses variables avant tout calcul. Mais le champ magnétique ne se transforme pas comme un vecteur ordinaire dans une symétrie plane : les règles sont inversées par rapport à celles du champ électrique.</div>
  <div class="def-box">
    Soit \(P'\) le symétrique de \(P\) par rapport à un plan \(\Pi\), et \(\mathcal S(\vec j)\) le symétrique d'un vecteur.
    <ul>
      <li>\(\Pi\) est un <strong>plan de symétrie</strong> de la distribution si \(\vec j(P') = \mathcal S\big(\vec j(P)\big)\) pour tout \(P\) ;</li>
      <li>\(\Pi^*\) est un <strong>plan d'antisymétrie</strong> si \(\vec j(P') = -\mathcal S\big(\vec j(P)\big)\) pour tout \(P\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Conséquences pour le champ magnétostatique</strong> (pseudo-vecteur) :
    <ul>
      <li>en un point \(M\) d'un <strong>plan de symétrie</strong> des courants, \(\vec B(M)\) est <strong>orthogonal</strong> à ce plan ;</li>
      <li>en un point \(M\) d'un <strong>plan d'antisymétrie</strong> des courants, \(\vec B(M)\) est <strong>contenu</strong> dans ce plan ;</li>
      <li>les invariances (translation, rotation) se traduisent comme pour \(\vec E\) : les composantes de \(\vec B\) ne dépendent pas de la coordonnée correspondante.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pourquoi l'inversion ?</span>
    <span class="prompt">Le champ magnétique est lié à un produit vectoriel.</span>
    <div class="content"><p>La force de Lorentz \(q\vec v\wedge\vec B\) est un vrai vecteur, comme \(\vec v\). Dans une symétrie plane, un produit vectoriel ne se transforme pas comme ses facteurs : pour que la force reste le symétrique de la force, \(\vec B\) doit se transformer en l'<strong>opposé</strong> du symétrique. En un point du plan de symétrie, \(\vec B\) est donc égal à l'opposé de son symétrique : sa composante parallèle au plan est nulle, il est orthogonal au plan. Retenir l'image du fil rectiligne : le plan qui contient le fil est plan de symétrie, et le champ tourne autour du fil, perpendiculairement à ce plan.</p></div>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">En un point M du plan…</th><th style="text-align:left">champ électrique \(\vec E\)</th><th style="text-align:left">champ magnétique \(\vec B\)</th></tr>
    <tr><td>de symétrie des sources</td><td>contenu dans le plan</td><td>orthogonal au plan</td></tr>
    <tr><td>d'antisymétrie des sources</td><td>orthogonal au plan</td><td>contenu dans le plan</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — fil rectiligne infini parcouru par I</strong>
    <ol>
      <li>Le plan contenant le fil et \(M\) est plan de symétrie des courants : \(\vec B(M)\) lui est orthogonal, donc porté par \(\vec e_\theta\) (coordonnées cylindriques d'axe le fil).</li>
      <li>Le plan perpendiculaire au fil passant par \(M\) est plan d'antisymétrie : \(\vec B(M)\) y est contenu, ce qui est cohérent.</li>
      <li>Invariances par translation selon l'axe et par rotation autour de l'axe : \(\vec B = B_\theta(r)\,\vec e_\theta\). Le champ est <strong>orthoradial</strong> : ses lignes sont des cercles centrés sur le fil.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — solénoïde (ou spire) d'axe Oz</strong>
    <ol>
      <li>Le plan perpendiculaire à l'axe passant par \(M\) est plan de symétrie des courants (pour un solénoïde infini à spires jointives) : \(\vec B(M)\) lui est orthogonal, donc <strong>axial</strong>.</li>
      <li>Tout plan contenant l'axe est plan d'antisymétrie (les courants le traversent) : \(\vec B\) y est contenu, cohérent.</li>
      <li>Invariances par rotation autour de \(Oz\) et par translation selon \(Oz\) (solénoïde infini) : \(\vec B = B_z(r)\,\vec e_z\).</li>
    </ol>
    <p>Pour une spire seule, il n'y a plus d'invariance par translation : \(\vec B = B_r(r,z)\,\vec e_r + B_z(r,z)\,\vec e_z\) (pas de composante orthoradiale, car tout plan contenant l'axe est d'antisymétrie). Le champ n'est forcément axial qu'en deux familles de points : sur l'axe (intersection de tous les plans contenant l'axe) et dans le plan de la spire, qui est plan de symétrie des courants.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FLUX CONSERVATIF ET LIGNES DE CHAMP</div>
  <h2>Des lignes de champ toujours fermées</h2>
  <div class="intro">Le champ magnétique n'a pas de « charge magnétique » pour source : son flux à travers toute surface fermée est nul. Cette propriété façonne toutes les cartes de champ magnétique.</div>
  <div class="prop-box">
    <strong>Conservation du flux magnétique.</strong> Pour toute surface fermée \(\Sigma\) :
    <div class="formula" data-nom="Flux magnétique conservatif">$$\oint_\Sigma\vec B\cdot\vec n\,\mathrm{d}S=0$$</div>
    Le flux de \(\vec B\) est le même à travers toutes les sections d'un tube de champ, et à travers toutes les surfaces qui s'appuient sur un même contour. Forme locale (chapitre « Maxwell ») : \(\operatorname{div}\vec B=0\).
  </div>

<figcaption>Lignes de champ calculées dans un plan contenant l'axe (tirets), à la même échelle sur les deux axes. Le courant sort de la figure en haut (●) et y entre en bas (×) : d'après la règle de la main droite, le champ est dirigé vers la droite sur l'axe. Les lignes sont fermées et tournent autour des conducteurs. Dans le solénoïde, elles deviennent presque parallèles à l'axe et équidistantes : le champ y est quasi uniforme ; à l'extérieur, elles s'écartent : le champ y est faible.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Propriétés des cartes de champ magnétique.</strong>
    <ul>
      <li>Les lignes de champ <strong>ne commencent ni ne finissent</strong> : elles se referment (ou partent à l'infini) ; elles <strong>tournent autour des courants</strong>.</li>
      <li>Le sens de rotation se lit avec la <strong>règle de la main droite</strong> : le pouce dans le sens du courant, les doigts s'enroulent dans le sens de \(\vec B\).</li>
      <li>Là où les lignes se <strong>resserrent</strong>, le champ est plus intense (conservation du flux dans un tube) ; là où elles sont parallèles et équidistantes, il est uniforme.</li>
      <li>Les lignes sont orthogonales aux plans de symétrie des courants et contenues dans les plans d'antisymétrie.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — vérifier et exploiter la carte du solénoïde</strong>
    <ol>
      <li><strong>Symétries</strong> : le plan médian du solénoïde (perpendiculaire à l'axe, au milieu) est plan de symétrie des courants : les lignes doivent le traverser à angle droit, ce que montre la figure (flèches horizontales sur la verticale du milieu). Le plan de la figure, qui contient l'axe, est plan d'antisymétrie : les lignes y restent contenues, c'est ce qui permet de les dessiner en deux dimensions.</li>
      <li><strong>Sens</strong> : courant sortant en haut et entrant en bas ; la main droite (doigts selon le courant des spires) met le pouce vers la droite : \(\vec B\) est dirigé vers la droite dans le solénoïde, et revient vers la gauche à l'extérieur, comme l'indiquent les flèches.</li>
      <li><strong>Intensité</strong> : un tube de champ de section \(1\ \text{cm}^2\) au cœur d'un solénoïde où \(B = 2{,}5\ \text{mT}\) transporte le flux \(\Phi = BS = 2{,}5\times10^{-7}\ \text{Wb}\). Si le même tube s'est évasé jusqu'à \(20\ \text{cm}^2\) à l'extérieur, le champ moyen y vaut \(\Phi/S = 1{,}25\times10^{-4}\ \text{T}\), soit \(125\ \text{µT}\) : vingt fois moins qu'au cœur, encore deux à trois fois le champ terrestre.</li>
    </ol>
  </div>
  <div class="notice"><strong>Comparer avec l'électrostatique</strong> : les lignes de \(\vec E\) partent des charges positives et ne sont jamais fermées ; celles de \(\vec B\) n'ont ni début ni fin. Une carte où une ligne magnétique « sort » d'un point est fausse ; une carte électrostatique avec une ligne fermée l'est aussi.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · THÉORÈME D'AMPÈRE</div>
  <h2>La circulation du champ compte les courants enlacés</h2>
  <div class="intro">Le théorème d'Ampère joue pour \(\vec B\) le rôle du théorème de Gauss pour \(\vec E\) : il relie une intégrale du champ sur un contour fermé aux courants qui traversent ce contour.</div>
  <div class="prop-box">
    <strong>Théorème d'Ampère.</strong> Pour tout contour fermé orienté \(\mathcal C\) :
    <div class="formula" data-nom="Théorème d'Ampère">$$\oint_{\mathcal C}\vec B\cdot\mathrm{d}\vec\ell=\mu_0\,I_{\text{enlacé}}$$</div>
    où \(I_{\text{enlacé}}=\iint_S\vec j\cdot\vec n\,\mathrm{d}S\) est l'intensité algébrique qui traverse une surface \(S\) quelconque s'appuyant sur \(\mathcal C\), la normale \(\vec n\) étant orientée par la <strong>règle de la main droite</strong> à partir du sens de parcours de \(\mathcal C\). Perméabilité du vide : \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\).
  </div>
  <p>Le résultat ne dépend pas de la surface choisie, parce que le flux de \(\vec j\) à travers une surface fermée est nul en régime permanent. Un courant compte <strong>positivement</strong> s'il traverse \(S\) dans le sens de \(\vec n\), négativement sinon ; un fil qui traverse \(N\) fois la surface (bobine) compte \(N\) fois.</p>
  <div class="method-box">
    <strong>Méthode — utiliser le théorème d'Ampère</strong>
    <ol>
      <li><strong>Symétries et invariances</strong> (§2) : direction de \(\vec B\) et variable dont dépend sa composante.</li>
      <li><strong>Contour d'Ampère</strong> passant par \(M\), formé de morceaux où \(\vec B\) est soit tangent et de norme constante, soit orthogonal au contour (circulation nulle), soit nul : cercle d'axe le fil, rectangle pour un solénoïde.</li>
      <li><strong>Orienter</strong> le contour, en déduire la normale (main droite), puis calculer la circulation en fonction de la composante inconnue.</li>
      <li><strong>Courant enlacé</strong> : somme algébrique des courants qui traversent la surface ; intégrer \(\vec j\) si \(M\) est dans le conducteur.</li>
      <li><strong>Égaler et contrôler</strong> : continuité du champ à la surface d'un conducteur volumique, limite à grande distance, sens donné par la main droite.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — compter les courants enlacés</strong>
    <p>Un contour \(\mathcal C\) est orienté ; la main droite en déduit la normale \(\vec n\) d'une surface \(S\) qui s'appuie sur lui. La traversent : un fil portant \(I_1 = 3\ \text{A}\) dans le sens de \(\vec n\), un fil portant \(I_2 = 5\ \text{A}\) en sens inverse, et une bobine de \(N = 20\) spires parcourues par \(i = 0{,}20\ \text{A}\), dont chaque spire traverse \(S\) dans le sens de \(\vec n\). Un quatrième fil, de \(10\ \text{A}\), passe à côté sans traverser \(S\).</p>
    <ol>
      <li>Courant enlacé : \(I_{\text{enlacé}} = I_1 - I_2 + N i = 3 - 5 + 20\times0{,}20 = 2\ \text{A}\).</li>
      <li>Circulation de \(\vec B\) sur \(\mathcal C\) : \(\mu_0 I_{\text{enlacé}} \approx 2{,}5\times10^{-6}\ \text{T·m}\).</li>
      <li>Le quatrième fil crée bien un champ en chaque point de \(\mathcal C\), mais sa circulation totale sur \(\mathcal C\) est nulle ; inverser le sens de parcours change le signe des deux membres, pas le résultat physique.</li>
    </ol>
  </div>
  <div class="notice"><strong>Quand le théorème donne-t-il le champ ?</strong> Toujours vrai, il n'est utile que si les symétries permettent de sortir \(B\) de la circulation : fils et cylindres infinis, solénoïdes infinis, bobines toriques. Pour une spire, une bobine courte ou un segment de fil, il ne suffit pas (il faudrait la loi de Biot et Savart, hors programme). <strong>Erreur classique</strong> : oublier d'orienter, ou compter le courant total au lieu du courant <strong>enlacé</strong>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · FIL RECTILIGNE INFINI DE SECTION NON NULLE</div>
  <h2>Champ à l'intérieur et à l'extérieur d'un conducteur cylindrique</h2>
  <div class="intro">Le programme demande d'établir le champ d'un fil cylindrique de rayon \(a\), parcouru par un courant \(I\) uniformément réparti dans sa section : c'est l'analogue magnétique du cylindre chargé en volume.</div>
  <div class="method-box">
    <strong>Établir le champ du fil épais</strong>
    <ol>
      <li><strong>Symétries</strong> (§2) : \(\vec B = B_\theta(r)\,\vec e_\theta\), avec \(\vec j = \dfrac{I}{\pi a^2}\,\vec e_z\) uniforme pour \(r \le a\).</li>
      <li><strong>Contour</strong> : cercle d'axe \(Oz\) et de rayon \(r\), parcouru dans le sens de \(\vec e_\theta\) ; normale \(\vec e_z\) (main droite). Circulation : \(2\pi r\,B_\theta(r)\).</li>
      <li><strong>Courant enlacé</strong> : \(I\,\dfrac{\pi r^2}{\pi a^2} = I\,\dfrac{r^2}{a^2}\) si \(r \le a\) ; \(I\) si \(r \ge a\).</li>
      <li><strong>Résultat</strong> :
        <div class="formula" data-nom="Champ d'un fil rectiligne épais">$$B_\theta(r\le a)=\frac{\mu_0 I\,r}{2\pi a^2}\qquad B_\theta(r\ge a)=\frac{\mu_0 I}{2\pi r}$$</div></li>
      <li><strong>Contrôles</strong> : continuité en \(r = a\) ; champ nul sur l'axe (imposé par la symétrie) ; à l'extérieur, champ du fil infini « filiforme ».</li>
    </ol>
  </div>

  <div class="prop-box"><strong>Fil filiforme.</strong> À l'extérieur d'un conducteur rectiligne, quelle que soit la répartition radiale du courant, \(\vec B = \dfrac{\mu_0 I}{2\pi r}\,\vec e_\theta\). Ordre de grandeur : à 1 cm d'un fil parcouru par 1 A, \(B = 20\ \text{µT}\), comparable au champ terrestre — c'est l'expérience d'Œrsted.</div>
  <div class="method-box">
    <strong>Exemple — câble coaxial</strong>
    <p>Un conducteur central de rayon \(a\) porte \(I\) ; une gaine cylindrique de rayons \(b \lt c\), coaxiale, porte le courant de retour \(-I\), uniformément réparti.</p>
    <ol>
      <li>Mêmes symétries : \(\vec B = B_\theta(r)\,\vec e_\theta\), cercle d'Ampère de rayon \(r\), orienté selon \(\vec e_\theta\) : circulation \(2\pi r\,B_\theta(r)\).</li>
      <li>Dans le conducteur central (\(r \le a\)) : comme pour le fil épais, \(B_\theta = \dfrac{\mu_0 I\,r}{2\pi a^2}\).</li>
      <li>Entre les conducteurs (\(a \le r \le b\)), seul le conducteur central est enlacé : \(B_\theta = \dfrac{\mu_0 I}{2\pi r}\).</li>
      <li>Dans la gaine (\(b \le r \le c\)), le cercle enlace aussi une partie du courant de retour : \(I_{\text{enlacé}} = I\Big(1 - \dfrac{r^2 - b^2}{c^2 - b^2}\Big) = I\,\dfrac{c^2 - r^2}{c^2 - b^2}\), d'où \(B_\theta = \dfrac{\mu_0 I}{2\pi r}\,\dfrac{c^2 - r^2}{c^2 - b^2}\), qui s'annule en \(r = c\).</li>
      <li>À l'extérieur (\(r \ge c\)), le courant enlacé total est nul : \(\vec B = \vec 0\). Le câble coaxial ne crée aucun champ magnétique à l'extérieur, d'où son intérêt pour transporter des signaux sans perturber l'environnement (ni être perturbé par lui).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SOLÉNOÏDE INFINI ET BOBINE TORIQUE</div>
  <h2>Produire un champ uniforme</h2>
  <div class="intro">Un solénoïde est un enroulement de spires jointives sur un cylindre. Très long devant son rayon, il produit à l'intérieur un champ uniforme, proportionnel au nombre de spires par unité de longueur : c'est l'outil standard pour créer un champ magnétique contrôlé.</div>

</figure>
  <div class="method-box">
    <strong>Établir le champ du solénoïde infini</strong> (\(n\) spires par unité de longueur, intensité \(I\))
    <ol>
      <li><strong>Symétries</strong> (§2) : \(\vec B = B_z(r)\,\vec e_z\) en tout point.</li>
      <li><strong>Champ intérieur uniforme</strong> : un rectangle dont les deux côtés parallèles à l'axe sont à l'intérieur, aux distances \(r_1\) et \(r_2\), n'enlace aucun courant ; sa circulation \(\big(B_z(r_1) - B_z(r_2)\big)\ell\) est nulle. Même raisonnement à l'extérieur : le champ y est uniforme, et on <strong>admet</strong> qu'il est nul (il doit s'annuler loin du solénoïde).</li>
      <li><strong>Contour ABCD</strong> de la figure : AB (longueur \(\ell\)) à l'intérieur, CD à l'extérieur. Circulation : \(B_z\,\ell\) sur AB, zéro sur CD (champ nul) et sur BC et DA (\(\vec B\) orthogonal ou nul). Courant enlacé : \(n\ell I\).</li>
      <li><strong>Résultat</strong> :
        <div class="formula" data-nom="Champ d'un solénoïde infini">$$\vec B=\mu_0\,n\,I\,\vec e_z\ \ \text{à l'intérieur}\qquad\vec B=\vec 0\ \ \text{à l'extérieur}$$</div>
        le sens de \(\vec e_z\) étant donné par la main droite (doigts dans le sens du courant des spires, pouce selon \(\vec B\)).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — ordres de grandeur d'un solénoïde de laboratoire</strong>
    <p>Bobine de longueur \(L = 40\ \text{cm}\), \(N = 400\) spires, \(I = 2\ \text{A}\) : \(n = N/L = 1\,000\ \text{m}^{-1}\) et \(B = \mu_0 nI = 4\pi\times10^{-7}\times10^3\times2 \approx 2{,}5\ \text{mT}\), cinquante fois le champ terrestre. Pour atteindre 1 T avec \(n = 10^4\ \text{m}^{-1}\) (plusieurs couches de fil), il faudrait 80 A : les électroaimants intenses utilisent un noyau de fer ou des bobinages supraconducteurs.</p>
  </div>
  <div class="notice"><strong>Validité du modèle infini</strong> : pour un solénoïde réel de longueur \(L\) et de rayon \(R\), le calcul complet (loi de Biot et Savart, hors programme ; résultat fourni par les énoncés) donne au centre \(B = \mu_0 nI\,\dfrac{L}{\sqrt{L^2+4R^2}}\) : pour \(L = 10\,R\), l'écart à \(\mu_0 nI\) n'est que de 2 %. Le modèle infini vaut donc loin des extrémités d'une bobine longue ; près des extrémités, le champ tombe à environ la moitié (§7) et les lignes s'évasent (§3).</div>
  <h3>Bobine torique</h3>
  <p>\(N\) spires enroulées régulièrement sur un tore d'axe \(Oz\). Tout plan contenant l'axe est plan de symétrie des courants : \(\vec B\) est orthoradial, \(\vec B = B_\theta(r, z)\,\vec e_\theta\). Un cercle d'axe \(Oz\) de rayon \(r\), à l'intérieur du tore, enlace \(N\) fois le courant \(I\) ; à l'extérieur, il n'enlace rien (ou \(N I - N I\)) :</p>
  <div class="formula" data-nom="Champ d'une bobine torique">$$B_\theta=\frac{\mu_0 N I}{2\pi r}\ \ \text{dans le tore}\qquad\vec B=\vec 0\ \ \text{hors du tore}$$</div>
  <p>Le champ est entièrement confiné dans le tore, sans hypothèse admise : c'est la géométrie des transformateurs toriques et des tokamaks.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SUPERPOSITION</div>
  <h2>Additionner des distributions simples</h2>
  <div class="intro">Le champ magnétique dépend linéairement des courants. Une distribution sans symétrie suffisante pour le théorème d'Ampère peut souvent se décomposer en distributions qui en ont : on additionne alors les champs.</div>
  <div class="method-box">
    <strong>Exemple — fil épais percé d'une cavité cylindrique décentrée</strong>
    <p>Un cylindre d'axe \(O\) porte la densité de courant uniforme \(\vec j = j\,\vec e_z\), sauf dans une cavité cylindrique d'axe \(O'\) parallèle, où il n'y a pas de courant. On cherche \(\vec B\) dans la cavité.</p>
    <ol>
      <li><strong>Décomposition</strong> : cylindre plein de densité \(\vec j\) + cylindre de la cavité de densité \(-\vec j\) (la somme donne bien zéro dans la cavité).</li>
      <li>Champ d'un cylindre plein en un point intérieur (§5) : \(B_\theta = \dfrac{\mu_0 j r}{2}\), soit vectoriellement \(\vec B = \dfrac{\mu_0}{2}\,\vec j\wedge\overrightarrow{OM}\) (le vecteur \(\overrightarrow{OM}\) étant pris perpendiculaire à l'axe).</li>
      <li>Somme en un point \(M\) de la cavité :
        <div class="formula">$$\vec B = \frac{\mu_0}{2}\,\vec j\wedge\overrightarrow{OM} - \frac{\mu_0}{2}\,\vec j\wedge\overrightarrow{O'M} = \frac{\mu_0}{2}\,\vec j\wedge\overrightarrow{OO'}$$</div></li>
      <li>Le champ est <strong>uniforme</strong> dans la cavité, perpendiculaire au plan des deux axes : une façon élégante de produire un champ uniforme sans solénoïde.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — champ à l'extrémité d'un long solénoïde</strong>
    <p>On cherche le champ sur la face de sortie \(z = 0\) d'un solénoïde semi-infini (\(z \lt 0\)), sans la loi de Biot et Savart.</p>
    <ol>
      <li><strong>Superposition</strong> : accolé à son image (le solénoïde semi-infini \(z \gt 0\)), il reconstitue le solénoïde infini, dont le champ vaut \(\mu_0 nI\,\vec e_z\) dans la section (\(r \lt R\)) et \(\vec 0\) au-dehors.</li>
      <li><strong>Symétrie</strong> : le plan \(z = 0\) échange les deux moitiés et conserve les courants orthoradiaux. En un point \(M\) de ce plan, le champ de la moitié droite est donc l'opposé du symétrique de celui de la moitié gauche : même composante axiale \(B_z\), composantes parallèles au plan opposées.</li>
      <li><strong>Conclusion</strong> : chaque moitié apporte la moitié du champ axial. Sur toute la face de sortie, \(B_z = \mu_0 nI/2\) : pour le solénoïde de TP ci-dessus, \(1{,}25\ \text{mT}\) au lieu de \(2{,}5\ \text{mT}\) au centre.</li>
      <li><strong>Lien avec le flux (§3)</strong> : à travers la face de sortie passe la moitié du flux qui traverse une section au cœur de la bobine ; l'autre moitié des lignes de champ a déjà quitté la bobine par sa paroi latérale, près de l'extrémité.</li>
    </ol>
  </div>
  <p>De même, deux fils parallèles parcourus par des courants opposés créent un champ qui décroît en \(1/r^2\) à grande distance (les contributions en \(1/r\) se compensent) : c'est pourquoi on torsade les paires de fils d'un câble.</p>
</div>

  <div class="sec-num">§8 · ORDRES DE GRANDEUR ET LOIS LOCALES</div>
  <h2>Situer les champs magnétiques, relier aux équations de Maxwell</h2>

  <div class="prop-box">
    <strong>Équations locales de la magnétostatique</strong> (cas statique des équations de Maxwell) :
    <div class="formula" data-nom="Lois locales de la magnétostatique">$$\operatorname{div}\vec B=0\qquad\overrightarrow{\operatorname{rot}}\,\vec B=\mu_0\,\vec j$$</div>
    La première traduit la conservation du flux (§3), la seconde est la forme locale du théorème d'Ampère grâce au théorème de Stokes, valable pour toute surface \(S\) s'appuyant sur le contour \(\mathcal C\) :
    <div class="formula">$$\oint_{\mathcal C}\vec B\cdot\mathrm{d}\vec\ell = \iint_S\overrightarrow{\operatorname{rot}}\,\vec B\cdot\vec n\,\mathrm{d}S$$</div>
    Elles sont reprises dans le chapitre « Équations de Maxwell ».
  </div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Spire, loi de Biot et Savart, dipôle magnétique</h2>
  <p>Le champ d'une distribution quelconque s'obtient par la loi de Biot et Savart, \(\mathrm{d}\vec B = \dfrac{\mu_0}{4\pi}\,\dfrac{I\,\mathrm{d}\vec\ell\wedge\overrightarrow{PM}}{PM^3}\), hors programme en PT : les énoncés fournissent alors le résultat. Sur l'axe d'une spire de rayon \(a\), on trouve \(B_z = \dfrac{\mu_0 I a^2}{2(a^2+z^2)^{3/2}}\), soit \(\dfrac{\mu_0 I}{2a}\) au centre. Loin de la spire, son champ est celui d'un <strong>dipôle magnétique</strong> de moment \(\vec{\mathcal M} = I S\,\vec n\), déjà rencontré en PTSI (aiguille aimantée, couple \(\vec\Gamma = \vec{\mathcal M}\wedge\vec B\)) : ses lignes de champ ont la même forme que celles d'un dipôle électrostatique, loin des sources.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="mgs-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · MAGNÉTOSTATIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles : relier intensité et densité de courant, prévoir la forme de \(\vec B\) par les symétries (règles inverses de celles de \(\vec E\)), reconnaître les cas où le théorème d'Ampère donne le champ, choisir et orienter le contour, établir les champs du fil épais et du solénoïde, superposer, exploiter la conservation du flux, lire une carte et situer un ordre de grandeur.</div>

  <div class="method-box"><strong>Méthode 1 — Calculer une intensité à partir de la densité de courant</strong>
    <ol>
      <li><span class="step">Surface.</span> Choisir la section traversée et l'orienter par une normale \(\vec n\) : le courant compté positivement est celui qui la traverse dans le sens de \(\vec n\).</li>
      <li><span class="step">Flux de \(\vec j\).</span> \(I=\displaystyle\iint_S\vec j\cdot\vec n\,\mathrm{d}S\) ; pour une densité qui ne dépend que de la distance \(r\) à l'axe d'un fil, découper en couronnes d'aire \(2\pi r\,\mathrm{d}r\) : \(I=\displaystyle\int_0^a j(r)\,2\pi r\,\mathrm{d}r\).</li>
      <li><span class="step">Porteurs.</span> \(\vec j=nq\vec v\) donne la vitesse moyenne des porteurs (de l'ordre du \(\text{mm·s}^{-1}\) dans un métal) ; pour des électrons, \(\vec j\) et \(\vec v\) sont opposés.</li>
    </ol>
    <p><em>Exemple éclair :</em> fil de rayon \(a=1{,}0\ \text{mm}\) où \(j(r)=j_0\,(1-r^2/a^2)\), avec \(j_0=6{,}0\ \text{A·mm}^{-2}\) : \(I=\displaystyle\int_0^a j_0\Big(1-\frac{r^2}{a^2}\Big)2\pi r\,\mathrm{d}r=\frac{\pi j_0a^2}{2}\approx9{,}4\ \text{A}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(I=j\times\text{aire}\) pour une densité non uniforme ; oublier que l'intensité est algébrique (elle change de signe avec l'orientation de la surface).</div>

  <div class="method-box"><strong>Méthode 2 — Prévoir la direction de \(\vec B\) et ses variables</strong>
    <ol>
      <li><span class="step">Point courant.</span> Choisir un point \(M\) quelconque, repéré dans les coordonnées adaptées (cylindriques pour un fil, un solénoïde ou un tore).</li>
      <li><span class="step">Plans par \(M\).</span> Chercher les plans de symétrie et d'antisymétrie <em>des courants</em> passant par \(M\) : \(\vec B(M)\) est <strong>orthogonal</strong> à un plan de symétrie et <strong>contenu</strong> dans un plan d'antisymétrie (règles inverses de celles de \(\vec E\)).</li>
      <li><span class="step">Invariances.</span> Translation ou rotation qui laisse la distribution inchangée : la coordonnée correspondante disparaît.</li>
      <li><span class="step">Conclusion écrite.</span> Par exemple \(\vec B=B_\theta(r)\,\vec e_\theta\) (fil), \(\vec B=B_z(r)\,\vec e_z\) (solénoïde infini), \(\vec B=B_\theta(r,z)\,\vec e_\theta\) (tore).</li>
    </ol>
    <p><em>Exemple éclair :</em> spire circulaire d'axe \(Oz\). En un point de son plan, ce plan est de symétrie : \(\vec B\) est axial ; en un point quelconque, le plan méridien est d'antisymétrie : \(\vec B=B_r(r,z)\,\vec e_r+B_z(r,z)\,\vec e_z\), sans composante orthoradiale.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer les règles du champ électrique. Moyen mnémotechnique : le plan qui contient un fil rectiligne est plan de symétrie, et le champ tourne autour du fil, donc traverse ce plan à angle droit.</div>

  <div class="method-box"><strong>Méthode 3 — Reconnaître les situations où le théorème d'Ampère donne le champ</strong>
    <ol>
      <li><span class="step">Symétrie forte.</span> Il faut un contour sur lequel \(B\) est constant (et tangent) ou nul : fil ou cylindre infini, tube, câble coaxial (cercle d'axe le fil) ; solénoïde infini (rectangle) ; bobine torique (cercle d'axe le tore) ; plaque infinie parcourue par un courant volumique (rectangle).</li>
      <li><span class="step">Sinon, décomposer.</span> Si la distribution est une somme de distributions de ce type (deux fils, cylindre creusé d'une cavité, deux solénoïdes coaxiaux), appliquer Ampère à chacune, puis superposer (méthode 7).</li>
      <li><span class="step">Sinon, résultat fourni.</span> Spire, bobine courte, segment : le théorème reste vrai mais ne donne pas le champ ; la loi de Biot et Savart est hors programme et l'énoncé fournit le résultat.</li>
    </ol>
    <p><em>Exemple éclair :</em> tube conducteur de rayons \(4\ \text{mm}\) et \(5\ \text{mm}\) parcouru par \(10\ \text{A}\) : un cercle intérieur n'enlace rien, donc \(\vec B=\vec 0\) dans le tube creux ; à \(1\ \text{cm}\) de l'axe, \(B=\mu_0I/(2\pi r)=2{,}0\times10^{2}\ \mu\text{T}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Choisir et orienter le contour, compter le courant enlacé</strong>
    <ol>
      <li><span class="step">Contour.</span> Fermé, passant par \(M\), fait de morceaux où \(\vec B\) est tangent et de norme constante, orthogonal au contour ou nul.</li>
      <li><span class="step">Orientation.</span> Choisir un sens de parcours ; la normale \(\vec n\) de toute surface qui s'appuie sur le contour s'en déduit par la main droite (doigts selon le parcours, pouce selon \(\vec n\)).</li>
      <li><span class="step">Courant enlacé.</span> Somme algébrique des courants qui traversent la surface : \(+I\) dans le sens de \(\vec n\), \(-I\) sinon ; une bobine dont \(N\) spires traversent la surface compte \(N\) fois ; un conducteur volumique ne compte que pour la partie enlacée.</li>
      <li><span class="step">Signe final.</span> Une composante \(B_\theta\) ou \(B_z\) négative indique un champ de sens opposé à l'orientation choisie : on ne se trompe pas en orientant arbitrairement.</li>
    </ol>
    <p><em>Exemple éclair :</em> une bobine de 50 spires parcourues par \(0{,}10\ \text{A}\) traverse la surface dans le sens de \(\vec n\), un fil de \(2{,}0\ \text{A}\) en sens inverse : \(I_{\text{enlacé}}=50\times0{,}10-2{,}0=3{,}0\ \text{A}\) et la circulation de \(\vec B\) vaut \(\mu_0I_{\text{enlacé}}\approx3{,}8\times10^{-6}\ \text{T·m}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : compter le courant total au lieu du courant enlacé ; oublier d'orienter ; conclure d'une circulation nulle que \(\vec B\) est nul sur le contour (seule sa circulation l'est).</div>

  <div class="method-box"><strong>Méthode 5 — Établir le champ d'un fil épais ou d'un câble</strong>
    <ol>
      <li><span class="step">Symétries.</span> \(\vec B=B_\theta(r)\,\vec e_\theta\) (plan contenant l'axe et \(M\) : symétrie ; invariances par translation et rotation).</li>
      <li><span class="step">Contour.</span> Cercle d'axe le fil, de rayon \(r\), parcouru selon \(\vec e_\theta\) : circulation \(2\pi r\,B_\theta(r)\), normale \(\vec e_z\).</li>
      <li><span class="step">Courant enlacé par zones.</span> Intérieur du fil (\(I\,r^2/a^2\) si le courant est uniforme), extérieur (\(I\)), et pour un câble coaxial, courant de retour partiellement puis totalement enlacé.</li>
      <li><span class="step">Contrôles.</span> Champ nul sur l'axe, continuité aux surfaces des conducteurs (pas de courant surfacique), \(\mu_0I/(2\pi r)\) à l'extérieur d'un fil, champ nul hors d'un câble coaxial.</li>
    </ol>
    <p><em>Exemple éclair :</em> fil de rayon \(a=1{,}0\ \text{mm}\) parcouru par \(10\ \text{A}\) uniformément : \(B(a)=\mu_0I/(2\pi a)=2{,}0\ \text{mT}\), maximum ; \(B(a/2)=B(2a)=1{,}0\ \text{mT}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Établir le champ d'un solénoïde ou d'une bobine torique</strong>
    <ol>
      <li><span class="step">Solénoïde infini.</span> Symétries : \(\vec B=B_z(r)\,\vec e_z\). Un rectangle dont deux côtés sont parallèles à l'axe et du même côté des spires n'enlace rien : \(B_z\) est uniforme à l'intérieur, uniforme à l'extérieur, où l'on <strong>admet</strong> qu'il est nul.</li>
      <li><span class="step">Rectangle à cheval.</span> Un côté \(\ell\) dedans, un dehors : circulation \(B_z\ell\), courant enlacé \(n\ell I\), donc \(B=\mu_0nI\) ; sens par la main droite (doigts selon le courant des spires, pouce selon \(\vec B\)).</li>
      <li><span class="step">Bobine torique.</span> Symétries : \(\vec B=B_\theta(r,z)\,\vec e_\theta\) ; cercle d'axe \(Oz\) de rayon \(r\) : \(B_\theta=\dfrac{\mu_0NI}{2\pi r}\) dans le tore, \(\vec 0\) au-dehors (sans hypothèse admise).</li>
    </ol>
    <p><em>Exemple éclair :</em> solénoïde de 2 000 spires par mètre parcouru par \(0{,}50\ \text{A}\) : \(B=\mu_0nI\approx1{,}3\ \text{mT}\). Tore de 1 000 spires parcourues par \(1{,}0\ \text{A}\), à \(r=10\ \text{cm}\) de l'axe : \(B=2{,}0\ \text{mT}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer \(\mu_0nI\) près des extrémités d'une bobine (le champ y tombe à environ la moitié) ou à une bobine courte ; confondre \(n\) (spires par mètre) et \(N\) (nombre total de spires).</div>

  <div class="method-box"><strong>Méthode 7 — Superposer des distributions simples</strong>
    <ol>
      <li><span class="step">Décomposer.</span> Écrire la distribution comme somme de distributions dont on connaît le champ (cylindres pleins, fils, solénoïdes) ; pour « creuser » une cavité, ajouter une distribution de densité opposée.</li>
      <li><span class="step">Écrire vectoriellement.</span> Cylindre plein parcouru par \(\vec j\) uniforme : \(\vec B=\dfrac{\mu_0}{2}\,\vec j\wedge\overrightarrow{HM}\) à l'intérieur (\(H\) projeté de \(M\) sur l'axe) ; fil : \(\vec B=\dfrac{\mu_0I}{2\pi r}\,\vec e_\theta\).</li>
      <li><span class="step">Sommer les vecteurs</span>, et non les normes, puis interpréter : uniformité (cavité), compensation à grande distance (courants opposés), symétries du résultat.</li>
    </ol>
    <p><em>Exemple éclair :</em> deux fils parallèles distants de \(D=10\ \text{cm}\), parcourus par \(\pm5{,}0\ \text{A}\) : au milieu, les deux champs ont même sens et s'ajoutent, \(B=2\times\dfrac{\mu_0I}{2\pi(D/2)}=\dfrac{2\mu_0I}{\pi D}=40\ \mu\text{T}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Exploiter la conservation du flux magnétique</strong>
    <ol>
      <li><span class="step">Surface fermée.</span> \(\oint\vec B\cdot\vec n\,\mathrm{d}S=0\) : le flux entrant égale le flux sortant, quelle que soit la forme de la surface.</li>
      <li><span class="step">Tube de champ.</span> Le flux est le même à travers toutes les sections d'un tube : \(B_1S_1=B_2S_2\) pour des sections où le champ est à peu près uniforme et normal.</li>
      <li><span class="step">Surfaces sur un même contour.</span> Le flux à travers une surface ouverte ne dépend que de son contour : choisir la surface la plus commode (plane, là où \(\vec B\) est connu).</li>
    </ol>
    <p><em>Exemple éclair :</em> à la sortie d'une bobine, un tube de champ de section \(10\ \text{cm}^2\) où \(B=5{,}0\ \text{mT}\) s'évase jusqu'à \(50\ \text{cm}^2\) : le champ moyen y vaut \(5{,}0\times10/50=1{,}0\ \text{mT}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Lire et vérifier une carte de champ magnétique</strong>
    <ol>
      <li><span class="step">Topologie.</span> Les lignes sont fermées et entourent les courants ; une ligne qui commence ou finit en un point est une erreur.</li>
      <li><span class="step">Sens.</span> Main droite : pouce selon le courant, doigts selon \(\vec B\). Pour une spire ou une bobine, le champ sort par la face « nord ».</li>
      <li><span class="step">Intensité.</span> Lignes serrées : champ intense ; lignes parallèles et équidistantes : champ uniforme (intérieur d'un solénoïde) ; point où des lignes semblent se croiser : champ nul.</li>
      <li><span class="step">Symétries.</span> Lignes orthogonales aux plans de symétrie des courants, contenues dans les plans d'antisymétrie.</li>
    </ol>
    <p><em>Exemple éclair :</em> autour d'un fil rectiligne, des lignes tracées à flux constant (par unité de longueur) vérifient \(B\,\Delta r=\text{cste}\) avec \(B\propto1/r\) : leur écartement croît comme \(r\). Des cercles espacés de \(1\ \text{mm}\) à \(1\ \text{cm}\) du fil le sont de \(4\ \text{mm}\) à \(4\ \text{cm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : sur une carte tracée dans un plan méridien (spire, solénoïde), la section d'un tube dépend aussi de la distance à l'axe ; la densité de lignes n'y donne qu'un classement qualitatif des intensités.</div>

  <div class="method-box"><strong>Méthode 10 — Situer un champ magnétique par un ordre de grandeur</strong>
    <ol>
      <li><span class="step">Repères.</span> Champ terrestre \(\approx50\ \mu\text{T}\) (composante horizontale \(\approx20\ \mu\text{T}\)) ; fil de \(1\ \text{A}\) à \(1\ \text{cm}\) : \(20\ \mu\text{T}\) ; bobine de TP : quelques mT ; aimant au contact : \(0{,}1\) à \(1\ \text{T}\) ; IRM : \(1{,}5\) à \(3\ \text{T}\).</li>
      <li><span class="step">Formules d'estimation.</span> \(\mu_0I/(2\pi r)\) près d'un fil, \(\mu_0nI\) dans une bobine longue, avec \(\mu_0/(2\pi)=2\times10^{-7}\ \text{SI}\) et \(\mu_0\approx1{,}26\times10^{-6}\ \text{SI}\).</li>
      <li><span class="step">Comparer.</span> Situer le résultat par rapport au champ terrestre (perturbation d'une boussole) et contrôler sa vraisemblance.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour qu'une boussole placée à \(5\ \text{cm}\) d'un fil vertical tourne de 45° (champ du fil égal à la composante horizontale terrestre, \(20\ \mu\text{T}\)), il faut \(I=2\pi rB/\mu_0=5\ \text{A}\) : l'expérience d'Œrsted demande des courants de quelques ampères.</p>
  </div>
</div>
</template>
