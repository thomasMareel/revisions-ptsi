  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit les parties A « Espaces vectoriels » et B « Espaces de dimension finie » de la section « Espaces vectoriels et applications linéaires » du programme de PTSI (second semestre). Il installe le langage de toute l'algèbre linéaire : sous-espaces, familles libres et génératrices, bases, dimension, sommes directes. Il s'appuie sur le calcul matriciel et la résolution des systèmes par le pivot de Gauss (chapitre Calcul matriciel, premier semestre). Le chapitre Applications linéaires le suit immédiatement et s'en sert à chaque page ; le chapitre Déterminants fournit un test rapide pour reconnaître une base. En 2ᵉ année, Espaces vectoriels (approfondissements) passe aux sommes de plusieurs sous-espaces et aux hyperplans.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Sous-espace vectoriel</strong> : définition, caractérisation ; sous-espace nul, droites vectorielles, plans vectoriels de \(\mathbb{R}^3\), \(\mathbb{K}_n[X]\) ; intersection d'une famille de sous-espaces (§2).</li>

<div class="course-section">
  <div class="sec-num">§1 · ESPACES VECTORIELS</div>
  <h2>Une même structure pour des objets très différents</h2>
  <div class="intro">Vecteurs du plan, \(n\)-uplets, polynômes, matrices, fonctions, suites : on sait les additionner et les multiplier par un nombre, avec les mêmes règles de calcul. Un espace vectoriel est un ensemble muni de ces deux opérations. Tout ce qui sera démontré dans ce cadre vaudra d'un coup pour tous ces objets : c'est l'économie de l'algèbre linéaire. Dans tout le chapitre, \(\mathbb{K}\) désigne \(\mathbb{R}\) ou \(\mathbb{C}\) ; ses éléments sont appelés <strong>scalaires</strong>.</div>

  <div class="def-box">
    Un <strong>\(\mathbb{K}\)-espace vectoriel</strong> est un ensemble \(E\) muni d'une addition \((x, y) \mapsto x + y\) de \(E \times E\) dans \(E\) et d'une multiplication par un scalaire \((\lambda, x) \mapsto \lambda x\) de \(\mathbb{K} \times E\) dans \(E\) telles que, pour tous \(x, y, z \in E\) et tous \(\lambda, \mu \in \mathbb{K}\) :
    <ul>
      <li>\((x + y) + z = x + (y + z)\) et \(x + y = y + x\) ;</li>
      <li>il existe un élément \(0_E\), le <strong>vecteur nul</strong>, tel que \(x + 0_E = x\) pour tout \(x\), et tout \(x\) a un <strong>opposé</strong> \(-x\) : \(x + (-x) = 0_E\) ;</li>
      <li>\(1 \cdot x = x\) et \(\lambda(\mu x) = (\lambda\mu)x\) ;</li>
      <li>\(\lambda(x + y) = \lambda x + \lambda y\) et \((\lambda + \mu)x = \lambda x + \mu x\).</li>
    </ul>
    Les éléments de \(E\) sont appelés <strong>vecteurs</strong>, quelle que soit leur nature (fonctions, polynômes…).
  </div>

  <div class="prop-box">
    <strong>Règles de calcul.</strong> Pour tous \(x \in E\) et \(\lambda \in \mathbb{K}\) : \(0 \cdot x = 0_E\), \(\lambda \cdot 0_E = 0_E\), \((-1)x = -x\), et
    <div class="formula" data-nom="Produit nul">$$\lambda x = 0_E \iff \lambda = 0 \ \text{ ou } \ x = 0_E.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout découle des axiomes de distributivité.</span>
    <div class="content"><p>\(0 \cdot x = (0 + 0)x = 0 \cdot x + 0 \cdot x\) ; en ajoutant l'opposé de \(0 \cdot x\) aux deux membres, \(0 \cdot x = 0_E\). De même \(\lambda 0_E = \lambda(0_E + 0_E) = \lambda 0_E + \lambda 0_E\) donne \(\lambda 0_E = 0_E\). Puis \(x + (-1)x = (1 - 1)x = 0 \cdot x = 0_E\), donc \((-1)x\) est l'opposé de \(x\).</p>
    <p>Enfin, si \(\lambda x = 0_E\) et \(\lambda \neq 0\), alors</p>
    <div class="formula">$$x = 1 \cdot x = (\lambda^{-1}\lambda)\,x = \lambda^{-1}(\lambda x) = \lambda^{-1} 0_E = 0_E.$$</div>
    <p>On a divisé par \(\lambda\) : c'est possible parce que \(\mathbb{K}\) est un corps.</p></div>
  </div>

  <h3>Les espaces de référence</h3>
  <ul>
    <li>\(\mathbb{K}^n\), ensemble des \(n\)-uplets \((x_1, \ldots, x_n)\), avec les opérations coordonnée par coordonnée ; le vecteur nul est \((0, \ldots, 0)\).</li>
    <li>\(\mathbb{K}[X]\), ensemble des polynômes à coefficients dans \(\mathbb{K}\) (chapitre Polynômes).</li>
    <li>\(\mathcal{M}_{n,p}(\mathbb{K})\), ensemble des matrices à \(n\) lignes et \(p\) colonnes, avec les opérations coefficient par coefficient (chapitre Calcul matriciel).</li>
    <li>\(\mathbb{K}^\Omega\), ensemble des fonctions d'un ensemble \(\Omega\) quelconque dans \(\mathbb{K}\), avec \((f + g)(t) = f(t) + g(t)\) et \((\lambda f)(t) = \lambda f(t)\) ; le vecteur nul est la fonction nulle. Cas particuliers : \(\mathbb{R}^I\), fonctions réelles sur un intervalle \(I\) ; \(\mathbb{K}^{\mathbb{N}}\), suites \((u_n)\), avec \((u_n) + (v_n) = (u_n + v_n)\).</li>
    <li>Plus généralement, les fonctions d'un ensemble \(\Omega\) dans un espace vectoriel \(F\), avec les mêmes opérations point par point : par exemple les fonctions de \(\mathbb{R}\) dans \(\mathbb{R}^2\), qui décrivent les courbes paramétrées.</li>
    <li>\(\mathbb{C}\) est à la fois un \(\mathbb{C}\)-espace vectoriel et un \(\mathbb{R}\)-espace vectoriel : le corps des scalaires fait partie de la donnée (§7).</li>
  </ul>

  <div class="def-box">
    Une <strong>combinaison linéaire</strong> d'une famille finie \((x_1, \ldots, x_p)\) de vecteurs de \(E\) est un vecteur de la forme
    <div class="formula" data-nom="Combinaison linéaire">$$\lambda_1 x_1 + \lambda_2 x_2 + \cdots + \lambda_p x_p = \sum_{i=1}^{p} \lambda_i x_i, \qquad (\lambda_1, \ldots, \lambda_p) \in \mathbb{K}^p.$$</div>
    Les scalaires \(\lambda_i\) sont les <strong>coefficients</strong> de la combinaison.
  </div>

  <div class="method-box">
    <strong>Exemple — reconnaître une combinaison linéaire</strong>
    <p>Dans \(\mathbb{R}^3\), soit \(a = (1, 2, 1)\) et \(b = (-1, 1, 1)\).</p>
    <ol>
      <li>Le vecteur \(w = (1, 8, 5)\) est-il combinaison linéaire de \(a\) et \(b\) ? On cherche \(\alpha, \beta\) tels que \(\alpha a + \beta b = w\), soit \(\alpha - \beta = 1\), \(2\alpha + \beta = 8\), \(\alpha + \beta = 5\). La première et la troisième équation donnent \(\alpha = 3\), \(\beta = 2\), et la deuxième est vérifiée : \(w = 3a + 2b\).</li>
      <li>Pour \(w' = (1, 7, 5)\), les mêmes équations imposent encore \(\alpha = 3\), \(\beta = 2\), mais alors \(2\alpha + \beta = 8 \neq 7\) : \(w'\) n'est pas combinaison linéaire de \(a\) et \(b\).</li>
      <li>Dans \(\mathbb{R}^{\mathbb{R}}\), la fonction \(t \mapsto \cos^2 t\) est combinaison linéaire de la fonction constante \(1\) et de \(t \mapsto \cos(2t)\) : \(\cos^2 t = \frac{1}{2} + \frac{1}{2}\cos(2t)\).</li>
      <li>Dans \(\mathbb{R}^{\mathbb{N}}\), la suite \(u_n = 2^{n+1} - 3n\) est la combinaison \(2\,(2^n) - 3\,(n)\) des deux suites \((2^n)\) et \((n)\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : confondre le scalaire \(0\) et le vecteur nul \(0_E\). Dans \(\mathbb{R}^{\mathbb{R}}\), le vecteur nul est la fonction nulle, pas le nombre \(0\) ; dans \(\mathcal{M}_2(\mathbb{R})\), c'est la matrice nulle. Écrire \(0_E\) quand il y a une ambiguïté évite bien des confusions.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SOUS-ESPACES VECTORIELS</div>
  <h2>Des espaces dans les espaces</h2>
  <div class="intro">Presque tous les espaces vectoriels rencontrés sont des parties d'un espace de référence, définies par une condition linéaire : une équation, une condition de dérivée, de symétrie. Plutôt que de vérifier tous les axiomes, il suffit alors de vérifier deux stabilités. C'est ainsi qu'on montre que les solutions d'une équation différentielle linéaire homogène, ou d'un système linéaire homogène, forment un espace vectoriel.</div>

  <div class="def-box">
    Une partie \(F\) de \(E\) est un <strong>sous-espace vectoriel</strong> de \(E\) si \(0_E \in F\), si \(F\) est stable par addition (\(x, y \in F \Rightarrow x + y \in F\)) et stable par multiplication par un scalaire (\(\lambda \in \mathbb{K},\ x \in F \Rightarrow \lambda x \in F\)). Muni des opérations de \(E\), \(F\) est alors lui-même un \(\mathbb{K}\)-espace vectoriel.
  </div>

  <div class="prop-box">
    <strong>Caractérisation.</strong> Une partie \(F\) de \(E\) est un sous-espace vectoriel de \(E\) si et seulement si \(0_E \in F\) et
    <div class="formula" data-nom="Caractérisation d'un sous-espace">$$\forall x, y \in F,\ \forall \lambda, \mu \in \mathbb{K}, \quad \lambda x + \mu y \in F.$$</div>
    Un sous-espace contient alors toutes les combinaisons linéaires de ses éléments (récurrence sur le nombre de termes).
  </div>

  <h3>Les exemples à connaître</h3>
  <ul>
    <li>\(\{0_E\}\), le <strong>sous-espace nul</strong>, et \(E\) lui-même.</li>
    <li>La <strong>droite vectorielle</strong> engendrée par un vecteur \(a \neq 0_E\) : \(\mathbb{K}a = \{\lambda a,\ \lambda \in \mathbb{K}\}\).</li>
    <li>Un <strong>plan vectoriel de \(\mathbb{R}^3\)</strong> : \(\{(x, y, z),\ \alpha x + \beta y + \gamma z = 0\}\) avec \((\alpha, \beta, \gamma) \neq (0, 0, 0)\), ou l'ensemble des \(\lambda a + \mu b\) pour deux vecteurs \(a, b\) non colinéaires.</li>
    <li>\(\mathbb{K}_n[X]\), ensemble des polynômes de degré au plus \(n\) (le polynôme nul, de degré \(-\infty\), y est), sous-espace de \(\mathbb{K}[X]\).</li>
    <li>L'ensemble des solutions d'un système linéaire <strong>homogène</strong> à \(p\) inconnues, sous-espace de \(\mathbb{K}^p\).</li>
    <li>Dans \(\mathbb{R}^I\) : les fonctions continues \(\mathcal{C}^0(I, \mathbb{R})\), de classe \(\mathcal{C}^1\), les solutions de \(y'' + \omega^2 y = 0\). Dans \(\mathbb{R}^{\mathbb{N}}\) : les suites bornées, les suites convergentes. Dans \(\mathcal{M}_n(\mathbb{K})\) : les matrices diagonales, triangulaires supérieures, symétriques \(\mathcal{S}_n(\mathbb{K})\), antisymétriques \(\mathcal{A}_n(\mathbb{K})\).</li>
  </ul>

  <div class="prop-box">
    <strong>Intersection.</strong> L'intersection d'une famille quelconque de sous-espaces vectoriels de \(E\) est un sous-espace vectoriel de \(E\). En revanche, la réunion \(F \cup G\) de deux sous-espaces n'en est un que si l'un est contenu dans l'autre.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Intersection : vérifier la caractérisation ; réunion : un contre-exemple universel.</span>
    <div class="content"><p><strong>Intersection.</strong> \(0_E\) appartient à chacun des sous-espaces, donc à leur intersection. Si \(x\) et \(y\) sont dans chacun d'eux, \(\lambda x + \mu y\) aussi, par stabilité de chacun.</p>
    <p><strong>Réunion.</strong> Supposons que ni \(F \subset G\) ni \(G \subset F\) : il existe \(x \in F\) hors de \(G\) et \(y \in G\) hors de \(F\). Si \(x + y\) était dans \(F\), alors \(y = (x + y) - x\) serait dans \(F\) ; s'il était dans \(G\), \(x = (x + y) - y\) serait dans \(G\). Donc \(x + y \notin F \cup G\), qui n'est pas stable par addition. Le bon objet pour « réunir » deux sous-espaces est leur somme (§9).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — quatre parties, deux sous-espaces</strong>
    <ol>
      <li>\(F_1 = \{(x, y, z) \in \mathbb{R}^3,\ x + y = 2z\}\) contient \((0, 0, 0)\). Si \((x, y, z)\) et \((x', y', z')\) sont dans \(F_1\), alors
      <div class="formula">$$(\lambda x + \mu x') + (\lambda y + \mu y') = \lambda(x + y) + \mu(x' + y') = 2(\lambda z + \mu z') :$$</div>
      \(F_1\) est un sous-espace (un plan vectoriel).</li>
      <li>\(F_2 = \{P \in \mathbb{R}_3[X],\ P(2) = 1\}\) ne contient pas le polynôme nul, qui vaut \(0\) en \(2\) : ce n'est pas un sous-espace.</li>
      <li>\(F_3 = \{(x, y) \in \mathbb{R}^2,\ x^2 = y^2\}\) contient \(0\) et est stable par multiplication par un scalaire, mais pas par addition : \((1, 1)\) et \((1, -1)\) sont dans \(F_3\), pas leur somme \((2, 0)\) (figure ci-dessus).</li>
      <li>\(F_4 = \{f \in \mathcal{C}^1(\mathbb{R}, \mathbb{R}),\ f' = 3f\}\) contient la fonction nulle, et \((\lambda f + \mu g)' = \lambda f' + \mu g' = 3(\lambda f + \mu g)\) : c'est un sous-espace de \(\mathcal{C}^1(\mathbb{R}, \mathbb{R})\). Le chapitre Équations différentielles montre que c'est la droite engendrée par \(t \mapsto e^{3t}\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : ne vérifier que la stabilité par addition. Le quart de plan \(\{(x, y),\ x \geq 0,\ y \geq 0\}\) contient \(0\) et est stable par addition, mais pas par multiplication par \(-1\) : ce n'est pas un sous-espace. Autre réflexe : une condition « affine » (second membre non nul, comme \(P(2) = 1\)) exclut le vecteur nul, et le test \(0_E \in F\) suffit à conclure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SOUS-ESPACE ENGENDRÉ, PARAMÉTRAGE ET ÉQUATIONS</div>
  <h2>Deux façons de décrire un sous-espace</h2>
  <div class="intro">Un sous-espace se décrit de deux manières : par des générateurs, c'est-à-dire comme l'ensemble des combinaisons linéaires de quelques vecteurs (un <em>paramétrage</em>), ou par les équations linéaires que vérifient ses éléments. La première description fabrique des vecteurs du sous-espace, la seconde permet de tester si un vecteur donné y est. Savoir passer de l'une à l'autre est un savoir-faire central du programme.</div>

  <div class="def-box">
    Le <strong>sous-espace engendré</strong> par une famille finie \((x_1, \ldots, x_p)\) de vecteurs de \(E\) est l'ensemble de ses combinaisons linéaires :
    <div class="formula" data-nom="Sous-espace engendré">$$\operatorname{Vect}(x_1, \ldots, x_p) = \Big\{ \sum_{i=1}^{p} \lambda_i x_i,\ (\lambda_1, \ldots, \lambda_p) \in \mathbb{K}^p \Big\}.$$</div>
    Par convention, la famille vide engendre \(\{0_E\}\). La droite \(\mathbb{K}a\) du §2 est \(\operatorname{Vect}(a)\).
  </div>

  <div class="prop-box">
    <strong>Théorème.</strong> \(\operatorname{Vect}(x_1, \ldots, x_p)\) est un sous-espace vectoriel de \(E\) qui contient les \(x_i\), et tout sous-espace vectoriel contenant \(x_1, \ldots, x_p\) contient \(\operatorname{Vect}(x_1, \ldots, x_p)\) : c'est le <strong>plus petit</strong> sous-espace qui contient les \(x_i\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une combinaison de combinaisons est une combinaison.</span>
    <div class="content"><p>\(0_E = \sum 0 \cdot x_i\) est dans \(\operatorname{Vect}(x_1, \ldots, x_p)\), et</p>
    <div class="formula">$$\lambda \sum_{i=1}^{p} \alpha_i x_i + \mu \sum_{i=1}^{p} \beta_i x_i = \sum_{i=1}^{p} (\lambda\alpha_i + \mu\beta_i)\, x_i$$</div>
    <p>aussi : c'est un sous-espace, qui contient chaque \(x_k\) (prendre \(\lambda_k = 1\), les autres coefficients nuls). Un sous-espace qui contient les \(x_i\) contient toutes leurs combinaisons linéaires, d'après la caractérisation du §2.</p></div>
  </div>

  <div class="prop-box">
    <strong>Opérations qui ne changent pas le sous-espace engendré.</strong> \(\operatorname{Vect}(x_1, \ldots, x_p)\) ne change pas si l'on :
    <ul>
      <li>permute les vecteurs ;</li>
      <li>multiplie l'un d'eux par un scalaire <strong>non nul</strong> ;</li>
      <li>ajoute à l'un d'eux une combinaison linéaire des <strong>autres</strong> ;</li>
      <li>retire un vecteur qui est combinaison linéaire des autres (en particulier le vecteur nul).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une double inclusion, grâce au théorème précédent.</span>
    <div class="content"><p>Pour la troisième opération, avec \(x'_1 = x_1 + \lambda x_2\) par exemple : \(x'_1\) est dans \(\operatorname{Vect}(x_1, \ldots, x_p)\), donc \(\operatorname{Vect}(x'_1, x_2, \ldots, x_p) \subset \operatorname{Vect}(x_1, \ldots, x_p)\) ; et \(x_1 = x'_1 - \lambda x_2\) donne l'inclusion inverse. Les autres opérations se traitent de même : chaque nouveau vecteur est combinaison des anciens, et réciproquement. Ces quatre opérations sont exactement celles du pivot de Gauss : on s'en servira pour calculer des rangs (§8).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — des équations à un paramétrage</strong>
    <p>Soit \(F = \{(x, y, z, t) \in \mathbb{R}^4,\ x + y - z = 0 \text{ et } y + 2t = 0\}\), ensemble des solutions d'un système homogène : un sous-espace de \(\mathbb{R}^4\).</p>
    <ol>
      <li>On résout : \(x\) et \(t\) sont libres, \(y = -2t\), puis \(z = x + y = x - 2t\).</li>
      <li>Un vecteur de \(F\) s'écrit donc \((x, -2t, x - 2t, t) = x\,(1, 0, 1, 0) + t\,(0, -2, -2, 1)\).</li>
      <li>Conclusion : \(F = \operatorname{Vect}\big((1, 0, 1, 0),\ (0, -2, -2, 1)\big)\). Contrôle : chacun de ces deux vecteurs vérifie les deux équations.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — d'un paramétrage à une équation</strong>
    <p>Soit \(G = \operatorname{Vect}(a, b)\) dans \(\mathbb{R}^3\), avec \(a = (1, 2, -1)\) et \(b = (2, 1, 1)\).</p>
    <ol>
      <li>\((x, y, z) \in G\) si et seulement si le système \(\alpha + 2\beta = x\), \(2\alpha + \beta = y\), \(-\alpha + \beta = z\), d'inconnues \(\alpha\) et \(\beta\), a une solution.</li>
      <li>La première et la troisième équation donnent \(\beta = \frac{x + z}{3}\) et \(\alpha = \frac{x - 2z}{3}\).</li>
      <li>La deuxième devient une condition de compatibilité : \(2\alpha + \beta = x - z\) doit valoir \(y\). Donc \(G\) est le plan d'équation \(x - y - z = 0\).</li>
      <li>Contrôle : \(1 - 2 + 1 = 0\) pour \(a\), \(2 - 1 - 1 = 0\) pour \(b\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : oublier de contrôler le résultat. Les générateurs trouvés doivent vérifier les équations, et les équations trouvées doivent être vérifiées par les générateurs : deux lignes de calcul qui évitent beaucoup d'erreurs. Autre piège : l'ensemble des solutions d'un système <strong>non homogène</strong> n'est pas un sous-espace (il ne contient pas \(0\)) ; c'est un sous-espace « translaté », étudié au chapitre Applications linéaires (§7).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · FAMILLES LIBRES, FAMILLES GÉNÉRATRICES</div>
  <h2>Assez de vecteurs, et aucun de trop</h2>
  <div class="intro">Une famille génératrice contient assez de vecteurs pour obtenir tous les autres par combinaison linéaire ; une famille libre n'en contient aucun de superflu, c'est-à-dire aucun qui soit combinaison des autres. Une base sera à la fois les deux.</div>

  <div class="def-box">
    Soit \((x_1, \ldots, x_p)\) une famille finie de vecteurs de \(E\).
    <ul>
      <li>Elle est <strong>génératrice</strong> de \(E\) si \(\operatorname{Vect}(x_1, \ldots, x_p) = E\) : tout vecteur de \(E\) est combinaison linéaire des \(x_i\).</li>
      <li>Elle est <strong>libre</strong> (ses vecteurs sont <strong>linéairement indépendants</strong>) si la seule combinaison linéaire nulle est celle dont tous les coefficients sont nuls :</li>
    </ul>
    <div class="formula" data-nom="Famille libre">$$\lambda_1 x_1 + \cdots + \lambda_p x_p = 0_E \implies \lambda_1 = \cdots = \lambda_p = 0.$$</div>
    Sinon, elle est <strong>liée</strong> : il existe des coefficients non tous nuls tels que \(\sum \lambda_i x_i = 0_E\), ce qu'on appelle une <strong>relation de dépendance linéaire</strong>.
  </div>

  <div class="prop-box">
    <strong>Propriétés.</strong>
    <ul>
      <li>Une famille est liée si et seulement si l'un de ses vecteurs est combinaison linéaire des autres.</li>
      <li>Une famille qui contient \(0_E\), ou deux fois le même vecteur, est liée. La famille \((x)\) est libre si et seulement si \(x \neq 0_E\) ; la famille \((x, y)\) est libre si et seulement si \(x\) et \(y\) ne sont pas colinéaires.</li>
      <li>Une sous-famille d'une famille libre est libre ; une famille qui contient une famille génératrice est génératrice.</li>
      <li><strong>Ajout d'un vecteur.</strong> Si \((x_1, \ldots, x_p)\) est libre et si \(y \notin \operatorname{Vect}(x_1, \ldots, x_p)\), alors \((x_1, \ldots, x_p, y)\) est libre.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Isoler le vecteur dont le coefficient n'est pas nul.</span>
    <div class="content"><p><strong>Premier point.</strong> Si \(\sum \lambda_i x_i = 0_E\) avec \(\lambda_k \neq 0\), on divise par \(\lambda_k\) : \(x_k = -\sum_{i \neq k} \frac{\lambda_i}{\lambda_k} x_i\). Réciproquement, \(x_k = \sum_{i \neq k} \mu_i x_i\) fournit la relation \(\sum_{i \neq k} \mu_i x_i - x_k = 0_E\), dont un coefficient vaut \(-1\).</p>
    <p><strong>Ajout d'un vecteur.</strong> Soit \(\lambda_1 x_1 + \cdots + \lambda_p x_p + \mu y = 0_E\). Si \(\mu \neq 0\), alors \(y = -\sum \frac{\lambda_i}{\mu} x_i\) serait dans \(\operatorname{Vect}(x_1, \ldots, x_p)\) : exclu. Donc \(\mu = 0\), puis \(\sum \lambda_i x_i = 0_E\) et tous les \(\lambda_i\) sont nuls, la famille de départ étant libre.</p></div>
  </div>

  <div class="prop-box">
    <strong>Polynômes à degrés distincts.</strong> Une famille finie de polynômes non nuls dont les degrés sont deux à deux distincts est libre.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Regarder le terme de plus haut degré.</span>
    <div class="content"><p>Rangeons les polynômes par degrés strictement croissants : \(\deg P_1 \lt \deg P_2 \lt \cdots \lt \deg P_p\). Supposons \(\sum \lambda_i P_i = 0\) avec des coefficients non tous nuls, et soit \(k\) le plus grand indice tel que \(\lambda_k \neq 0\). Dans \(\sum_{i \leq k} \lambda_i P_i\), le coefficient du terme de degré \(\deg P_k\) vient du seul \(\lambda_k P_k\) : il vaut \(\lambda_k\) fois le coefficient dominant de \(P_k\), qui n'est pas nul. Ce polynôme n'est donc pas nul : contradiction.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — trois familles, trois techniques</strong>
    <ol>
      <li><strong>Dans \(\mathbb{R}^3\).</strong> \(x_1 = (1, 1, 0)\), \(x_2 = (0, 1, 1)\), \(x_3 = (1, 2, 1)\) : on repère \(x_3 = x_1 + x_2\), la famille est liée. La sous-famille \((x_1, x_2)\) est libre, ses deux vecteurs n'étant pas colinéaires.</li>
      <li><strong>Dans \(\mathbb{R}^{\mathbb{R}}\), par passage à la limite.</strong> Montrons que \((1,\ t \mapsto t,\ t \mapsto e^t)\) est libre. Si \(a + bt + c\,e^t = 0\) pour tout réel \(t\), on divise par \(e^t\) : \((a + bt)e^{-t} + c = 0\), et \(t \to +\infty\) donne \(c = 0\). Il reste \(a + bt = 0\) pour tout \(t\) : \(t = 0\) donne \(a = 0\), puis \(t = 1\) donne \(b = 0\).</li>
      <li><strong>Dans \(\mathbb{R}^{\mathbb{R}}\), une relation cachée.</strong> \((\sin,\ \cos,\ t \mapsto \sin(t + \frac{\pi}{3}))\) est liée, puisque \(\sin(t + \frac{\pi}{3}) = \frac{1}{2}\sin t + \frac{\sqrt{3}}{2}\cos t\) pour tout \(t\).</li>
      <li><strong>Dans \(\mathbb{R}_3[X]\), par les degrés.</strong> \(P_0 = 2\), \(P_1 = X - 1\), \(P_2 = X^2 + X\), \(P_3 = X^3 - X\) sont de degrés \(0, 1, 2, 3\), deux à deux distincts : la famille est libre, sans aucun calcul.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : croire que des vecteurs deux à deux non colinéaires forment une famille libre. \((1, 0)\), \((0, 1)\) et \((1, 1)\) sont deux à deux non colinéaires, mais \((1, 1) = (1, 0) + (0, 1)\). La liberté est une propriété de toute la famille. Autre piège de rédaction : pour prouver la liberté, on part de \(\sum \lambda_i x_i = 0_E\) et l'on <strong>démontre</strong> que les \(\lambda_i\) sont nuls ; l'implication inverse est toujours vraie et ne prouve rien.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BASES ET COORDONNÉES</div>
  <h2>Repérer chaque vecteur par des nombres</h2>
  <div class="intro">Une base est une famille à la fois libre et génératrice. Chaque vecteur s'y écrit alors d'une seule façon, et ses coefficients, ses coordonnées, le représentent sans ambiguïté : calculer sur des vecteurs abstraits (polynômes, matrices, fonctions) revient à calculer sur des \(n\)-uplets. C'est le point de départ du calcul matriciel.</div>

  <div class="def-box">
    Une <strong>base</strong> de \(E\) est une famille \(\mathcal{B} = (e_1, \ldots, e_n)\) de vecteurs de \(E\) libre et génératrice de \(E\).
  </div>

  <div class="prop-box">
    <strong>Théorème.</strong> \((e_1, \ldots, e_n)\) est une base de \(E\) si et seulement si tout vecteur \(x\) de \(E\) s'écrit de façon <strong>unique</strong>
    <div class="formula" data-nom="Coordonnées dans une base">$$x = x_1 e_1 + x_2 e_2 + \cdots + x_n e_n, \qquad (x_1, \ldots, x_n) \in \mathbb{K}^n.$$</div>
    Les scalaires \(x_1, \ldots, x_n\) sont les <strong>coordonnées</strong> de \(x\) dans \(\mathcal{B}\). Les coordonnées de \(\lambda x + \mu y\) sont \(\lambda x_i + \mu y_i\) : on calcule sur les coordonnées comme dans \(\mathbb{K}^n\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Existence ⟺ génératrice, unicité ⟺ libre.</span>
    <div class="content"><p>L'existence de l'écriture pour tout \(x\) est exactement le caractère générateur. Si \(x = \sum x_i e_i = \sum x'_i e_i\), alors \(\sum (x_i - x'_i) e_i = 0_E\) : si la famille est libre, \(x_i = x'_i\) pour tout \(i\). Réciproquement, si l'écriture est unique, celle du vecteur nul l'est : \(\sum \lambda_i e_i = 0_E = \sum 0 \cdot e_i\) impose \(\lambda_i = 0\), la famille est libre.</p></div>
  </div>

  <h3>Les bases canoniques</h3>
  <ul>
    <li>Dans \(\mathbb{K}^n\) : \(e_i = (0, \ldots, 0, 1, 0, \ldots, 0)\), le \(1\) étant en position \(i\). Les coordonnées de \((x_1, \ldots, x_n)\) sont ses composantes.</li>
    <li>Dans \(\mathcal{M}_{n,p}(\mathbb{K})\) : les \(np\) matrices élémentaires \(E_{ij}\) (un seul coefficient non nul, égal à \(1\), en ligne \(i\) et colonne \(j\)) ; \(A = \sum_{i,j} a_{ij} E_{ij}\).</li>
    <li>Dans \(\mathbb{K}_n[X]\) : \((1, X, X^2, \ldots, X^n)\) ; les coordonnées d'un polynôme sont ses coefficients.</li>
  </ul>

  <div class="prop-box">
    <strong>Bases de polynômes à degrés échelonnés.</strong> Si \(P_0, P_1, \ldots, P_n\) sont des polynômes tels que \(\deg P_k = k\) pour tout \(k\), alors \((P_0, \ldots, P_n)\) est une base de \(\mathbb{K}_n[X]\). Par exemple, pour tout \(a \in \mathbb{K}\), \(\big(1, X - a, (X - a)^2, \ldots, (X - a)^n\big)\) en est une ; la formule de Taylor donne les coordonnées de \(P\) : \(\frac{P^{(k)}(a)}{k!}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Libre par les degrés, génératrice par récurrence.</span>
    <div class="content"><p>La famille est libre (§4). Montrons par récurrence sur \(k\) que \(X^k \in \operatorname{Vect}(P_0, \ldots, P_k)\). \(P_0\) est une constante non nulle \(c_0\), donc \(1 = P_0 / c_0\). Si \(1, \ldots, X^{k-1}\) sont dans \(\operatorname{Vect}(P_0, \ldots, P_{k-1})\), écrivons \(P_k = c_k X^k + R\) avec \(c_k \neq 0\) et \(\deg R \lt k\) : \(X^k = \frac{1}{c_k}(P_k - R)\), et \(R\) est combinaison de \(1, \ldots, X^{k-1}\), donc de \(P_0, \ldots, P_{k-1}\). Ainsi \(\operatorname{Vect}(P_0, \ldots, P_n)\) contient la base canonique, donc tout \(\mathbb{K}_n[X]\). (Le §7 donnera une preuve plus rapide : \(n + 1\) vecteurs libres dans un espace de dimension \(n + 1\).)</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — coordonnées dans une autre base</strong>
    <ol>
      <li>Dans \(\mathbb{R}_2[X]\), \(\mathcal{B} = \big(1, X - 1, (X - 1)^2\big)\) est une base (degrés \(0, 1, 2\)). Pour \(P = X^2 + 3X - 1\), on écrit \(X = (X - 1) + 1\) et l'on développe : \(P = (X - 1)^2 + 5(X - 1) + 3\). Les coordonnées de \(P\) dans \(\mathcal{B}\) sont \((3, 5, 1)\), et non ses coefficients \((-1, 3, 1)\).</li>
      <li>Contrôle par Taylor en \(1\) : \(P(1) = 3\), \(P'(1) = 2 + 3 = 5\), \(\frac{P''(1)}{2} = 1\).</li>
      <li>Dans \(\mathbb{R}^2\), \(\mathcal{B}' = \big((2, 1), (1, 3)\big)\) est une base (vecteurs non colinéaires, et l'on verra au §7 que deux vecteurs libres de \(\mathbb{R}^2\) en forment une base). Pour \(x = (5, 5)\), on résout \(2\alpha + \beta = 5\), \(\alpha + 3\beta = 5\) : \(\alpha = 2\), \(\beta = 1\). Les coordonnées de \(x\) sont \((2, 1)\) dans \(\mathcal{B}'\) et \((5, 5)\) dans la base canonique. Le passage d'une base à l'autre par une matrice est l'objet du chapitre Calcul matriciel (§9).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : oublier qu'une base est une famille <strong>ordonnée</strong>. \((e_2, e_1)\) est une autre base que \((e_1, e_2)\), et les coordonnées y sont permutées ; c'est pourquoi on écrit une base entre parenthèses, pas entre accolades. Les coordonnées dépendent toujours de la base choisie.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · DIMENSION FINIE : EXISTENCE DE BASES</div>
  <h2>Extraire, compléter</h2>
  <div class="intro">Un espace a-t-il toujours une base ? Pour les espaces de dimension finie, oui, et mieux : on peut extraire une base de toute famille génératrice, et compléter toute famille libre en une base. Ces deux gestes sont les outils de toutes les démonstrations sur la dimension.</div>

  <div class="def-box">
    Un espace vectoriel \(E\) est <strong>de dimension finie</strong> s'il possède une famille génératrice finie.
  </div>
  <p>\(\mathbb{K}^n\), \(\mathbb{K}_n[X]\) et \(\mathcal{M}_{n,p}(\mathbb{K})\) sont de dimension finie (bases canoniques). En revanche, \(\mathbb{K}[X]\) ne l'est pas : une famille finie de polynômes a un degré maximal \(d\), et \(X^{d+1}\) n'est pas combinaison linéaire de ses éléments. Les espaces de fonctions \(\mathbb{R}^I\), \(\mathcal{C}^0(I, \mathbb{R})\) et l'espace des suites \(\mathbb{K}^{\mathbb{N}}\) ne le sont pas non plus. Le programme exclut toute théorie en dimension infinie : on y raisonne seulement sur des familles finies.</p>

  <div class="prop-box">
    <strong>Théorème (existence de bases).</strong> Soit \((x_1, \ldots, x_n)\) une famille génératrice de \(E\) et \(I\) une partie de \(\{1, \ldots, n\}\) telle que \((x_i)_{i \in I}\) soit libre. Il existe une partie \(J\) de \(\{1, \ldots, n\}\) contenant \(I\) telle que \((x_j)_{j \in J}\) soit une base de \(E\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Prendre une famille libre la plus grande possible.</span>
    <div class="content"><p>Parmi les parties \(J\) de \(\{1, \ldots, n\}\) qui contiennent \(I\) et pour lesquelles \((x_j)_{j \in J}\) est libre (il y en a : \(I\) elle-même, et elles sont en nombre fini), choisissons-en une de cardinal maximal. Pour \(k \notin J\), la famille \((x_j)_{j \in J}\) complétée par \(x_k\) n'est plus libre (maximalité) ; d'après l'ajout d'un vecteur (§4), cela impose \(x_k \in \operatorname{Vect}(x_j,\ j \in J)\). Ainsi \(\operatorname{Vect}(x_j,\ j \in J)\) contient tous les \(x_k\), donc \(\operatorname{Vect}(x_1, \ldots, x_n) = E\) : la famille \((x_j)_{j \in J}\) est génératrice, et c'est une base. (Si \(E = \{0_E\}\), la famille vide est une base, par convention.)</p></div>
  </div>

  <div class="prop-box">
    <strong>Conséquences.</strong> Soit \(E \neq \{0_E\}\) de dimension finie.
    <ul>
      <li><strong>Existence</strong> : \(E\) possède une base.</li>
      <li><strong>Théorème de la base extraite</strong> : de toute famille génératrice finie de \(E\), on peut extraire une base (cas \(I = \varnothing\)).</li>
      <li><strong>Théorème de la base incomplète</strong> : toute famille libre \((y_1, \ldots, y_p)\) de \(E\) peut être complétée en une base de \(E\), avec des vecteurs pris dans n'importe quelle famille génératrice \((x_1, \ldots, x_n)\) donnée (appliquer le théorème à \((y_1, \ldots, y_p, x_1, \ldots, x_n)\), avec pour \(I\) les \(p\) premiers indices).</li>
    </ul>
  </div>

  <div class="method-box">
    <strong>Méthode — extraire ou compléter, vecteur par vecteur</strong>
    <ol>
      <li>Pour extraire une base d'une famille génératrice : parcourir la famille dans l'ordre, garder un vecteur s'il n'est pas dans le sous-espace engendré par ceux déjà gardés, le rejeter sinon.</li>
      <li>Pour compléter une famille libre : partir de cette famille et examiner de la même façon les vecteurs d'une famille génératrice connue (souvent la base canonique).</li>
      <li>Chaque vecteur gardé préserve la liberté (ajout d'un vecteur, §4) ; à la fin, les vecteurs rejetés sont tous combinaisons des vecteurs gardés, qui engendrent donc l'espace.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — une base extraite, une base complétée</strong>
    <ol>
      <li><strong>Extraction.</strong> Dans \(\mathbb{R}^3\), soit \(x_1 = (1, 0, 1)\), \(x_2 = (2, 0, 2)\), \(x_3 = (0, 1, 1)\), \(x_4 = (1, 1, 2)\), \(x_5 = (0, 0, 1)\). Cette famille engendre \(\mathbb{R}^3\), car \(e_3 = x_5\), \(e_1 = x_1 - x_5\) et \(e_2 = x_3 - x_5\).</li>
      <li>On garde \(x_1\) ; on rejette \(x_2 = 2x_1\) ; on garde \(x_3\), non colinéaire à \(x_1\) ; on rejette \(x_4 = x_1 + x_3\).</li>
      <li>Pour \(x_5\) : \(\alpha x_1 + \beta x_3 = (\alpha, \beta, \alpha + \beta)\) vaut \((0, 0, 1)\) seulement si \(\alpha = \beta = 0\) et \(0 = 1\), impossible. On garde \(x_5\) : \((x_1, x_3, x_5)\) est une base extraite de \(\mathbb{R}^3\).</li>
      <li><strong>Complétion.</strong> Dans \(\mathbb{R}^4\), \(y_1 = (1, 2, 0, 1)\) et \(y_2 = (0, 1, 1, 1)\) forment une famille libre. On a \(\alpha y_1 + \beta y_2 = (\alpha, 2\alpha + \beta, \beta, \alpha + \beta)\) : égaler à \(e_1 = (1, 0, 0, 0)\) impose \(\beta = 0\) puis \(\alpha = 0\), alors que \(\alpha = 1\). Donc \(e_1 \notin \operatorname{Vect}(y_1, y_2)\), et l'on garde \(e_1\).</li>
      <li>De même, \(\alpha y_1 + \beta y_2 + \gamma e_1 = e_2\) impose \(\beta = 0\), \(\alpha = 0\), puis \(2\alpha + \beta = 1\) : impossible, on garde \(e_2\). Enfin \(e_4 = y_1 - e_1 - 2e_2\) et \(e_3 = y_2 - e_2 - e_4\) sont rejetés : \((y_1, y_2, e_1, e_2)\) est une base de \(\mathbb{R}^4\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : croire que la base extraite, ou la base complétée, est unique. Elle dépend de l'ordre dans lequel on examine les vecteurs ; en partant de \(x_5\) dans l'exemple, on aurait obtenu une autre base. Ce qui ne dépend de rien, c'est le <strong>nombre</strong> de vecteurs obtenus : c'est l'objet du paragraphe suivant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DIMENSION</div>
  <h2>Le nombre de degrés de liberté</h2>
  <div class="intro">Toutes les bases d'un espace de dimension finie ont le même nombre de vecteurs : la dimension, qui compte les paramètres indépendants nécessaires pour décrire un vecteur. Une fois la dimension connue, il suffit souvent de <em>compter</em> : \(n\) vecteurs libres d'un espace de dimension \(n\) forment une base, sans vérifier qu'ils l'engendrent.</div>

  <div class="prop-box">
    <strong>Lemme fondamental.</strong> Dans un espace engendré par \(n\) vecteurs, toute famille de \(n + 1\) vecteurs est liée. Par conséquent, toute famille de plus de \(n\) vecteurs y est liée.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Récurrence sur \(n\), en éliminant le dernier générateur comme dans le pivot de Gauss.</span>
    <div class="content"><p>Pour \(n = 1\) : si \(y_1 = a x_1\) et \(y_2 = b x_1\), soit \(a = 0\) et \(y_1 = 0_E\), soit \(y_2 - \frac{b}{a}y_1 = 0_E\) ; dans les deux cas \((y_1, y_2)\) est liée.</p>
    <p>Supposons le résultat vrai pour tout espace engendré par \(n - 1\) vecteurs, et soit \(y_1, \ldots, y_{n+1}\) dans \(\operatorname{Vect}(x_1, \ldots, x_n)\) : \(y_j = \sum_{i=1}^{n} a_{ij} x_i\). Si tous les coefficients \(a_{nj}\) sont nuls, les \(y_j\) sont dans \(\operatorname{Vect}(x_1, \ldots, x_{n-1})\), et déjà \(y_1, \ldots, y_n\) sont liés par hypothèse de récurrence. Sinon, quitte à renuméroter, \(a_{n,n+1} \neq 0\) ; les \(n\) vecteurs \(z_j = y_j - \frac{a_{nj}}{a_{n,n+1}} y_{n+1}\) (\(1 \leq j \leq n\)) n'ont plus de composante sur \(x_n\) : ils sont dans \(\operatorname{Vect}(x_1, \ldots, x_{n-1})\), donc liés. Une relation \(\sum_{j \leq n} \lambda_j z_j = 0_E\) à coefficients non tous nuls est une relation entre \(y_1, \ldots, y_{n+1}\) dont les coefficients de \(y_1, \ldots, y_n\) sont les \(\lambda_j\), non tous nuls : la famille est liée.</p></div>
  </div>

  <div class="prop-box">
    <strong>Théorème et définition.</strong> Si \(E \neq \{0_E\}\) est de dimension finie, toutes ses bases ont le même nombre de vecteurs, appelé <strong>dimension</strong> de \(E\) et noté \(\dim E\). Par convention, \(\dim \{0_E\} = 0\). Un espace de dimension 1 est une <strong>droite</strong>, de dimension 2 un <strong>plan</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux bases se contrôlent l'une l'autre.</span>
    <div class="content"><p>Soit \(\mathcal{B}\) une base à \(n\) vecteurs et \(\mathcal{B}'\) une base à \(m\) vecteurs. \(\mathcal{B}'\) est une famille libre d'un espace engendré par les \(n\) vecteurs de \(\mathcal{B}\) : le lemme impose \(m \leq n\). En échangeant les rôles, \(n \leq m\).</p></div>
  </div>

  <div class="formula" data-nom="Dimensions usuelles">$$\dim \mathbb{K}^n = n, \qquad \dim \mathbb{K}_n[X] = n + 1, \qquad \dim \mathcal{M}_{n,p}(\mathbb{K}) = np.$$</div>
  <p>Le corps compte : \(\mathbb{C}\) est une droite vectorielle complexe (base \((1)\)), mais un plan vectoriel réel (base \((1, i)\), coordonnées \((\operatorname{Re} z, \operatorname{Im} z)\)).</p>

  <h3>Les espaces de solutions</h3>
  <div class="prop-box">
    <strong>Dimensions à connaître.</strong>
    <ul>
      <li>Sur un intervalle \(I\), les solutions de \(y' + a(t)\,y = 0\) (\(a\) continue) forment une <strong>droite</strong> vectorielle, de base \(t \mapsto e^{-A(t)}\), où \(A\) est une primitive de \(a\).</li>
      <li>Les solutions de \(y'' + a y' + b y = 0\) (\(a\), \(b\) constants) forment un <strong>plan</strong> vectoriel ; une base est donnée par l'équation caractéristique \(r^2 + ar + b = 0\) (par exemple \((e^{r_1 t}, e^{r_2 t})\) pour deux racines distinctes \(r_1\), \(r_2\)).</li>
      <li>Les suites vérifiant \(u_{n+2} = a u_{n+1} + b u_n\) (\(a\), \(b\) constants) forment un <strong>plan</strong> vectoriel de \(\mathbb{K}^{\mathbb{N}}\) ; si \(b \neq 0\), une base est \(\big((r_1^n), (r_2^n)\big)\) quand \(r^2 = ar + b\) a deux racines distinctes, \(\big((r^n), (n r^n)\big)\) quand elle a une racine double \(r\).</li>
    </ul>
  </div>
  <p>Justification : les théorèmes de résolution (chapitres Équations différentielles et Suites numériques) disent que toute solution est combinaison linéaire des solutions indiquées, qui ne sont pas proportionnelles ; elles forment donc une famille génératrice et libre. Le chapitre Applications linéaires (§7) en donne une preuve plus structurelle : les conditions initiales définissent un isomorphisme sur \(\mathbb{K}\) ou \(\mathbb{K}^2\).</p>

  <div class="method-box">
    <strong>Exemple — une base de l'espace des solutions</strong>
    <p>On considère les suites réelles telles que \(u_{n+2} = 4u_{n+1} - 4u_n\).</p>
    <ol>
      <li>L'équation \(r^2 = 4r - 4\), soit \((r - 2)^2 = 0\), a la racine double \(2\) : les suites \((2^n)\) et \((n\,2^n)\) sont solutions et ne sont pas proportionnelles.</li>
      <li>L'espace des solutions étant de dimension 2, elles en forment une base : toute solution s'écrit \(u_n = (\alpha + \beta n)\,2^n\).</li>
      <li>Avec \(u_0 = 1\) et \(u_1 = 4\) : \(\alpha = 1\) et \(2(\alpha + \beta) = 4\), d'où \(\beta = 1\) et \(u_n = (n + 1)\,2^n\). Contrôle : la relation donne \(u_2 = 16 - 4 = 12\), et la formule \(3 \times 4 = 12\).</li>
    </ol>
  </div>

  <div class="prop-box">
    <strong>Caractérisation des bases.</strong> Soit \(E\) de dimension \(n \geq 1\).
    <ul>
      <li>Toute famille libre de \(E\) a au plus \(n\) vecteurs ; toute famille génératrice de \(E\) en a au moins \(n\).</li>
      <li>Pour une famille d'<strong>exactement \(n\) vecteurs</strong> : base \(\iff\) libre \(\iff\) génératrice.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Lemme fondamental, base incomplète, base extraite.</span>
    <div class="content"><p>Le premier point sur les familles libres est le lemme. Une famille génératrice de \(m\) vecteurs contient une base extraite, de \(n\) vecteurs : \(m \geq n\).</p>
    <p>Une famille libre de \(n\) vecteurs se complète en une base (base incomplète), qui a \(n\) vecteurs : on n'a rien ajouté, c'était déjà une base. Une famille génératrice de \(n\) vecteurs contient une base extraite de \(n\) vecteurs : on n'a rien retiré.</p></div>
  </div>

  <h3>Sous-espaces et dimension</h3>
  <div class="prop-box">
    <strong>Théorème.</strong> Si \(E\) est de dimension finie, tout sous-espace \(F\) de \(E\) est de dimension finie, et
    <div class="formula" data-nom="Dimension d'un sous-espace">$$\dim F \leq \dim E, \qquad \text{avec égalité si et seulement si } F = E.$$</div>
    Ainsi, les sous-espaces de \(\mathbb{R}^3\) sont \(\{0\}\), les droites vectorielles, les plans vectoriels et \(\mathbb{R}^3\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une famille libre de \(F\) est une famille libre de \(E\).</span>
    <div class="content"><p>Soit \(n = \dim E\). Les familles libres de \(F\) sont libres dans \(E\), donc ont au plus \(n\) vecteurs. Prenons-en une, \((f_1, \ldots, f_p)\), de longueur maximale. Si elle n'engendrait pas \(F\), un vecteur de \(F\) hors de \(\operatorname{Vect}(f_1, \ldots, f_p)\) la prolongerait en une famille libre plus longue (§4) : c'est donc une base de \(F\), et \(\dim F = p \leq n\). Si \(p = n\), c'est une famille libre de \(n\) vecteurs de \(E\), donc une base de \(E\) : \(F = \operatorname{Vect}(f_1, \ldots, f_n) = E\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — conclure en comptant</strong>
    <ol>
      <li>Dans \(\mathbb{R}_3[X]\), de dimension 4, la famille \((1,\ 1 + X,\ 1 + X + X^2,\ 1 + X + X^2 + X^3)\) est libre (degrés distincts) et compte 4 vecteurs : c'est une base. Les coordonnées de \(X^3\) y sont \((0, 0, -1, 1)\), puisque \(X^3\) est la différence des deux derniers vecteurs.</li>
      <li>Soit \(F = \operatorname{Vect}\big((1, 1, 0), (0, 1, 1)\big)\) et \(G\) le plan \(x - y + z = 0\) de \(\mathbb{R}^3\). Les deux générateurs de \(F\) vérifient l'équation : \(F \subset G\). Ils ne sont pas colinéaires, donc \(\dim F = 2\).</li>
      <li>\(G \neq \mathbb{R}^3\) (il ne contient pas \((1, 0, 0)\)), donc \(\dim G \leq 2\) ; comme \(G\) contient \(F\), \(\dim G = 2\). Inclusion et égalité des dimensions : \(F = G\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : conclure \(F = G\) de la seule égalité \(\dim F = \dim G\). Deux droites distinctes du plan ont la même dimension ; il faut une inclusion <strong>et</strong> l'égalité des dimensions. Autre confusion : la dimension compte les vecteurs d'une base, pas les coordonnées des vecteurs. Le plan \(x - y + z = 0\) est de dimension 2, bien que ses vecteurs aient trois coordonnées.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · RANG D'UNE FAMILLE DE VECTEURS</div>
  <h2>Compter les vecteurs vraiment utiles</h2>
  <div class="intro">Une famille peut compter beaucoup de vecteurs et n'engendrer qu'un petit sous-espace. Son rang mesure ce qu'elle engendre vraiment : c'est le nombre maximal de vecteurs indépendants qu'on peut y choisir. Il se calcule par le pivot de Gauss, exactement comme on résout un système.</div>

  <div class="def-box">
    Le <strong>rang</strong> d'une famille finie \((x_1, \ldots, x_p)\) de vecteurs de \(E\) est la dimension du sous-espace qu'elle engendre :
    <div class="formula" data-nom="Rang d'une famille">$$\operatorname{rg}(x_1, \ldots, x_p) = \dim \operatorname{Vect}(x_1, \ldots, x_p).$$</div>
  </div>

  <div class="prop-box">
    <strong>Propriétés.</strong>
    <ul>
      <li>\(\operatorname{rg}(x_1, \ldots, x_p) \leq p\), avec égalité si et seulement si la famille est libre.</li>
      <li>Si \(\dim E = n\) : \(\operatorname{rg}(x_1, \ldots, x_p) \leq n\), avec égalité si et seulement si la famille engendre \(E\).</li>
      <li>Le rang est le nombre de vecteurs de toute base extraite de la famille.</li>
      <li>Les opérations du §3 (permuter, multiplier un vecteur par un scalaire non nul, ajouter à un vecteur une combinaison des autres, retirer un vecteur combinaison des autres) ne changent pas le rang, puisqu'elles ne changent pas le sous-espace engendré.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout se lit sur une base extraite.</span>
    <div class="content"><p>La famille engendre \(\operatorname{Vect}(x_1, \ldots, x_p)\) ; on peut en extraire une base de cet espace (§6), dont le nombre de vecteurs est la dimension, c'est-à-dire le rang : il vaut au plus \(p\), et exactement \(p\) si et seulement si on n'a rien retiré, c'est-à-dire si la famille est libre. Enfin \(\operatorname{Vect}(x_1, \ldots, x_p)\) est un sous-espace de \(E\) : sa dimension vaut au plus \(n\), avec égalité si et seulement si c'est \(E\) (§7).</p></div>
  </div>

  <div class="method-box">
    <strong>Méthode — calculer le rang d'une famille de \(\mathbb{K}^n\)</strong>
    <ol>
      <li>Écrire les vecteurs en lignes, les uns sous les autres.</li>
      <li>Par les opérations du §3, qui portent sur ces lignes, obtenir une forme <strong>échelonnée</strong> : chaque ligne non nulle commence par plus de zéros que la précédente.</li>
      <li>Le rang est le nombre de lignes non nulles : elles sont libres (regarder le premier coefficient non nul de chacune), et elles engendrent le même sous-espace que la famille de départ. C'est aussi le rang de la matrice des coordonnées (chapitre Calcul matriciel, §8).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — un rang qui dépend d'un paramètre</strong>
    <p>Dans \(\mathbb{R}^4\), soit \(x_1 = (1, 2, -1, 3)\), \(x_2 = (2, 3, 0, 4)\), \(x_3 = (1, 1, 1, a)\), \(x_4 = (0, 1, -2, 2)\), avec \(a \in \mathbb{R}\).</p>
    <ol>
      <li>\(x_2 \leftarrow x_2 - 2x_1\) et \(x_3 \leftarrow x_3 - x_1\) donnent \((0, -1, 2, -2)\) et \((0, -1, 2, a - 3)\).</li>
      <li>Avec le nouveau \(x_2\) : \(x_3 \leftarrow x_3 - x_2\) donne \((0, 0, 0, a - 1)\), et \(x_4 \leftarrow x_4 + x_2\) donne le vecteur nul.</li>
      <li>Forme échelonnée : \((1, 2, -1, 3)\), \((0, -1, 2, -2)\), \((0, 0, 0, a - 1)\). Le rang vaut \(3\) si \(a \neq 1\), et \(2\) si \(a = 1\).</li>
      <li>Pour \(a = 1\), on retrouve les relations : \(x_3 = x_2 - x_1\) et \(x_4 = 2x_1 - x_2\). Les quatre vecteurs n'engendrent qu'un plan.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : effectuer « en même temps » deux opérations qui s'utilisent l'une l'autre. Partant de \((1, 0)\) et \((0, 1)\), de rang 2, les remplacements simultanés \(x_1 \leftarrow x_1 - x_2\) et \(x_2 \leftarrow x_2 - x_1\) donnent \((1, -1)\) et \((-1, 1)\), de rang 1. Chaque opération doit utiliser les vecteurs <strong>déjà modifiés</strong>, et ajouter à un vecteur une combinaison des <strong>autres</strong>. Le rang d'une application linéaire, défini au chapitre suivant, est le rang de la famille des images d'une base.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SOMME DE DEUX SOUS-ESPACES, SOMME DIRECTE</div>
  <h2>Décomposer un vecteur en deux morceaux</h2>
  <div class="intro">La réunion de deux sous-espaces n'en est pas un (§2) ; la bonne notion est leur somme. Quand chaque vecteur de la somme s'y décompose d'une seule façon, la somme est directe ; quand de plus elle remplit tout l'espace, les deux sous-espaces sont supplémentaires. Une telle décomposition sert partout : mouvement découpé en composantes, fonction coupée en partie paire et partie impaire, et, au chapitre suivant, projecteurs et symétries.</div>

  <div class="def-box">
    La <strong>somme</strong> de deux sous-espaces \(F\) et \(G\) de \(E\) est
    <div class="formula" data-nom="Somme de deux sous-espaces">$$F + G = \{y + z,\ y \in F,\ z \in G\}.$$</div>
  </div>

  <div class="prop-box">
    <strong>Propriétés.</strong> \(F + G\) est un sous-espace de \(E\) ; c'est le plus petit sous-espace qui contient \(F \cup G\). Si \(F = \operatorname{Vect}(f_1, \ldots, f_p)\) et \(G = \operatorname{Vect}(g_1, \ldots, g_q)\), alors \(F + G = \operatorname{Vect}(f_1, \ldots, f_p, g_1, \ldots, g_q)\) : on met les générateurs bout à bout.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Additionner terme à terme.</span>
    <div class="content"><p>\(0_E = 0_E + 0_E\), et</p>
    <div class="formula">$$\lambda(y + z) + \mu(y' + z') = (\lambda y + \mu y') + (\lambda z + \mu z'),$$</div>
    <p>avec la première parenthèse dans \(F\), la seconde dans \(G\). \(F + G\) contient \(F\) (prendre \(z = 0_E\)) et \(G\) ; et un sous-espace qui contient \(F\) et \(G\) contient toutes les sommes \(y + z\). Enfin, une combinaison des \(f_i\) et des \(g_j\) est la somme d'un vecteur de \(F\) et d'un vecteur de \(G\), et réciproquement.</p></div>
  </div>

  <div class="def-box">
    La somme \(F + G\) est <strong>directe</strong> si tout vecteur de \(F + G\) s'écrit de façon <strong>unique</strong> \(y + z\) avec \(y \in F\) et \(z \in G\) ; on la note alors \(F \oplus G\). Les sous-espaces \(F\) et \(G\) sont <strong>supplémentaires</strong> dans \(E\) si \(E = F \oplus G\) : tout vecteur \(x\) de \(E\) s'écrit de façon unique \(x = x_F + x_G\), avec \(x_F \in F\) et \(x_G \in G\).
  </div>

  <div class="prop-box">
    <strong>Caractérisation par l'intersection.</strong> La somme \(F + G\) est directe si et seulement si \(F \cap G = \{0_E\}\). Par conséquent :
    <div class="formula" data-nom="Sous-espaces supplémentaires">$$E = F \oplus G \iff F + G = E \ \text{ et } \ F \cap G = \{0_E\}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux décompositions d'un même vecteur diffèrent d'un vecteur de \(F \cap G\).</span>
    <div class="content"><p>Si la somme est directe et \(x \in F \cap G\), alors \(0_E = 0_E + 0_E = x + (-x)\) sont deux décompositions du vecteur nul (\(x \in F\), \(-x \in G\)) : l'unicité impose \(x = 0_E\). Réciproquement, si \(F \cap G = \{0_E\}\) et \(y + z = y' + z'\), alors \(y - y' = z' - z\) est à la fois dans \(F\) et dans \(G\) : il est nul, donc \(y = y'\) et \(z = z'\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — deux supplémentaires d'une même droite</strong>
    <ol>
      <li>Dans \(\mathbb{R}^2\), \(F = \operatorname{Vect}\big((1, 2)\big)\) et \(G = \operatorname{Vect}\big((1, -1)\big)\). Si \(\alpha(1, 2) = \beta(1, -1)\), alors \(\alpha = \beta\) et \(2\alpha = -\beta\), d'où \(\alpha = \beta = 0\) : \(F \cap G = \{0\}\).</li>

      <li>Pour \(x = (5, 4)\) : \(\alpha = 3\), \(\beta = 2\), et \(x = (3, 6) + (2, -2)\).</li>
      <li>L'axe des abscisses \(G' = \operatorname{Vect}\big((1, 0)\big)\) est un autre supplémentaire de \(F\), et dans \(F \oplus G'\), \(x = (2, 4) + (3, 0)\) : la composante de \(x\) sur \(F\) dépend du supplémentaire choisi (figure ci-dessus).</li>
    </ol>
  </div>

<figcaption>Dans \(\mathbb{R}^3\), le plan \(F\) d'équation \(z = 0\) et la droite \(G = \operatorname{Vect}\big((1, 1, 2)\big)\), qui n'est pas contenue dans \(F\), sont supplémentaires. Pour \(x = (3, 1, 2)\), la parallèle à \(G\) passant par \(x\) perce \(F\) en \(x_F = (2, 0, 0)\) : \(x = x_F + x_G\) avec \(x_F \in F\) et \(x_G = (1, 1, 2) \in G\). La partie de \(G\) cachée sous le plan est en pointillés.</figcaption>
</figure>

  <div class="method-box">
    <strong>Exemple — un plan et une droite de l'espace</strong>
    <ol>
      <li>Dans \(\mathbb{R}^3\), soit \(F\) le plan d'équation \(z = 0\) et \(G = \operatorname{Vect}\big((1, 1, 2)\big)\). Un vecteur \(\lambda(1, 1, 2)\) de \(G\) est dans \(F\) seulement si \(2\lambda = 0\) : \(F \cap G = \{0\}\).</li>
      <li>Pour tout \((x, y, z)\), on retire à \(x\) le multiple de \((1, 1, 2)\) qui annule la troisième coordonnée :</li>
    </ol>
    <div class="formula">$$(x, y, z) = \Big(x - \frac{z}{2},\ y - \frac{z}{2},\ 0\Big) + \frac{z}{2}\,(1, 1, 2).$$</div>
    <p>Donc \(\mathbb{R}^3 = F \oplus G\). Pour \(x = (3, 1, 2)\), on trouve \(x_F = (2, 0, 0)\) et \(x_G = (1, 1, 2)\), comme sur la figure.</p>
  </div>

  <div class="method-box">
    <strong>Exemple — en dimension infinie : la valeur moyenne</strong>
    <p>Dans \(E = \mathcal{C}^0([0, 1], \mathbb{R})\), soit \(C\) le sous-espace des fonctions constantes et \(H = \{f \in E,\ \int_0^1 f(t)\,\mathrm{d}t = 0\}\) (un sous-espace, par linéarité de l'intégrale).</p>
    <ol>
      <li>Une constante \(c\) d'intégrale nulle sur \([0, 1]\) vérifie \(c = 0\) : \(C \cap H = \{0\}\).</li>
      <li>Pour \(f \in E\), soit \(m = \int_0^1 f\) sa valeur moyenne : \(f = m + (f - m)\), et \(f - m\) est d'intégrale nulle. Donc \(E = C \oplus H\).</li>
      <li>Pour \(f(t) = t^2\) : \(m = \frac{1}{3}\), et \(t^2 = \frac{1}{3} + \big(t^2 - \frac{1}{3}\big)\).</li>
    </ol>
    <p>Deux autres décompositions classiques, \(\mathbb{R}^{\mathbb{R}}\) = fonctions paires \(\oplus\) fonctions impaires et \(\mathcal{M}_n(\mathbb{K}) = \mathcal{S}_n(\mathbb{K}) \oplus \mathcal{A}_n(\mathbb{K})\), sont établies au chapitre Applications linéaires (§9). Ce chapitre associe aussi à toute décomposition \(E = F \oplus G\) la projection \(x \mapsto x_F\) et la symétrie \(x \mapsto x_F - x_G\) (§8, §9).</p>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : confondre « supplémentaire » et « complémentaire ». Le complémentaire \(E \setminus F\) ne contient pas \(0_E\) : ce n'est jamais un sous-espace. Un supplémentaire de \(F\) est un sous-espace, et il n'est pas unique (figure). Autre piège : \(F \cap G = \{0_E\}\) ne suffit pas pour que \(F\) et \(G\) soient supplémentaires ; deux droites distinctes de \(\mathbb{R}^3\) sont en somme directe, mais leur somme n'est qu'un plan.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · GRASSMANN, SUPPLÉMENTAIRES, BASES ADAPTÉES</div>
  <h2>Additionner des dimensions</h2>
  <div class="intro">En dimension finie, les dimensions s'additionnent pour une somme directe ; sinon, il faut retrancher la dimension de l'intersection : c'est la formule de Grassmann. On en tire un test très économique : deux sous-espaces sont supplémentaires dès que leur intersection est nulle et que leurs dimensions ont pour somme celle de l'espace.</div>

  <div class="def-box">
    Soit \(E\) de dimension \(n\) et \(F\) un sous-espace de dimension \(r\). Une base \((e_1, \ldots, e_n)\) de \(E\) est <strong>adaptée à \(F\)</strong> si \((e_1, \ldots, e_r)\) est une base de \(F\) ; il en existe toujours (compléter une base de \(F\), §6). Si \(E = F \oplus G\), une base de \(E\) obtenue en mettant bout à bout une base de \(F\) et une base de \(G\) est dite <strong>adaptée à la décomposition</strong> \(E = F \oplus G\).
  </div>

  <div class="prop-box">
    <strong>Somme directe et bases.</strong> Si \(F \cap G = \{0_E\}\), une base de \(F\) suivie d'une base de \(G\) est une base de \(F \oplus G\). En particulier :
    <div class="formula" data-nom="Dimension d'une somme directe">$$\dim(F \oplus G) = \dim F + \dim G.$$</div>
    Si \(E = F \oplus G\), la famille obtenue est une base de \(E\) (adaptée à la décomposition), et \(\dim F + \dim G = \dim E\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Génératrice par le §9, libre grâce à l'intersection nulle.</span>
    <div class="content"><p>Soit \((f_1, \ldots, f_p)\) une base de \(F\) et \((g_1, \ldots, g_q)\) une base de \(G\). La famille mise bout à bout engendre \(F + G\) (§9). Si \(\sum a_i f_i + \sum b_j g_j = 0_E\), le vecteur \(y = \sum a_i f_i\) de \(F\) est égal à \(-\sum b_j g_j\), qui est dans \(G\) : il est dans \(F \cap G\), donc nul. Les deux familles étant libres, les \(a_i\) puis les \(b_j\) sont nuls.</p></div>
  </div>

  <div class="prop-box">
    <strong>Existence d'un supplémentaire.</strong> En dimension finie, tout sous-espace \(F\) de \(E\) possède au moins un supplémentaire (en général, une infinité).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Compléter une base de \(F\).</span>
    <div class="content"><p>On complète une base \((f_1, \ldots, f_r)\) de \(F\) en une base \((f_1, \ldots, f_r, g_1, \ldots, g_{n-r})\) de \(E\) (base incomplète) et l'on pose \(G = \operatorname{Vect}(g_1, \ldots, g_{n-r})\). La famille entière engendre \(E\), donc \(F + G = E\). Si \(x \in F \cap G\), \(x = \sum a_i f_i = \sum b_j g_j\) fournit une combinaison nulle de la base entière : tous les coefficients sont nuls, et \(x = 0_E\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Formule de Grassmann.</strong> Si \(F\) et \(G\) sont deux sous-espaces d'un espace de dimension finie :
    <div class="formula" data-nom="Formule de Grassmann">$$\dim(F + G) = \dim F + \dim G - \dim(F \cap G).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Ne garder de \(G\) que ce qui manque à \(F\).</span>
    <div class="content"><p>\(F \cap G\) est un sous-espace de \(G\) : il y admet un supplémentaire \(H\), et \(\dim H = \dim G - \dim(F \cap G)\). Montrons que \(F + G = F \oplus H\).</p>
    <p><strong>Même somme.</strong> \(F + H \subset F + G\) puisque \(H \subset G\). Réciproquement, \(z \in G\) s'écrit \(z = w + h\) avec \(w \in F \cap G\) et \(h \in H\), donc \(y + z = (y + w) + h \in F + H\).</p>
    <p><strong>Somme directe.</strong> \(F \cap H\) est contenu dans \(F \cap G\) (car \(H \subset G\)) et dans \(H\) ; or \((F \cap G) \cap H = \{0_E\}\). Ainsi \(\dim(F + G) = \dim F + \dim H\), c'est la formule.</p></div>
  </div>

  <div class="prop-box">
    <strong>Caractérisation des supplémentaires par la dimension.</strong> Si \(\dim E = n\), les trois propriétés suivantes sont équivalentes :
    <ul>
      <li>\(E = F \oplus G\) ;</li>
      <li>\(F \cap G = \{0_E\}\) et \(\dim F + \dim G = n\) ;</li>
      <li>\(F + G = E\) et \(\dim F + \dim G = n\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Grassmann et le cas d'égalité des dimensions.</span>
    <div class="content"><p>Si \(F \cap G = \{0_E\}\) et \(\dim F + \dim G = n\), Grassmann donne \(\dim(F + G) = n\), donc \(F + G = E\) (§7). Si \(F + G = E\) et \(\dim F + \dim G = n\), Grassmann donne \(\dim(F \cap G) = 0\), donc \(F \cap G = \{0_E\}\). Dans les deux cas, on a \(E = F \oplus G\) (§9) ; la réciproque vient de la dimension d'une somme directe.</p></div>
  </div>

  <figure class="schema" style="max-width:320px">
