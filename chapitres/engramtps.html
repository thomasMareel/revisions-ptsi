      <div class="sec-num">§1 · PRÉSENT &amp; PASSÉ</div>
      <h2>Temps &amp; aspects</h2>
      <div class="intro">L'anglais distingue le <strong>moment</strong> (présent/passé/futur) et l'<strong>aspect</strong> (simple, continu, accompli). Maîtriser ces oppositions évite la majorité des fautes.</div>
      <div class="prop-box"><strong>Présent</strong> : <em>simple</em> = habitude / vérité générale (I work) ; <em>continu</em> = action en cours / temporaire (I am working).</div>
      <div class="prop-box"><strong>Passé</strong> : <em>prétérit</em> = fait passé daté et révolu (I did it yesterday) ; <em>present perfect</em> = bilan / lien avec le présent (I have done it).</div>
      <div class="prop-box"><strong>Durée</strong> : <em>for</em> + durée (for 3 years) · <em>since</em> + point de départ (since 2020) → present perfect si la période dure encore (<em>I have lived here for 3 years</em>) ; <em>for</em> + prétérit pour une période close (<em>I lived there for 3 years</em>).</div>
      <div class="prop-box"><strong>Futur</strong> : will (prédiction/décision) · be going to (intention) · present continuous (arrangement prévu).</div>
      <div class="notice">Verbes d'état (know, want, like) : pas de forme en -ing en principe (I <em>know</em>, pas « I am knowing »).</div>
    </div>
