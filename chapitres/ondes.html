    <line x1="20" y1="134" x2="340" y2="134" class="sk-ink"/>
    <path d="M24,134 l9,9 M48,134 l9,9 M72,134 l9,9 M96,134 l9,9 M120,134 l9,9 M144,134 l9,9 M168,134 l9,9 M192,134 l9,9 M216,134 l9,9 M240,134 l9,9 M264,134 l9,9 M288,134 l9,9 M312,134 l9,9" class="sk-ink" style="opacity:.45"/>
    <text x="338" y="129" class="lab-muted" text-anchor="end">fond</text>
    <line x1="68" y1="44" x2="68" y2="130" class="sk-accent" marker-end="url(#sk-arrow-accent)"/>
    <text x="60" y="92" class="lab-accent" text-anchor="end">émission</text>
    <line x1="86" y1="130" x2="86" y2="44" class="sk-accent2" marker-end="url(#sk-arrow-accent2)"/>
    <text x="94" y="92" class="lab-accent2">écho</text>
    <line x1="216" y1="44" x2="216" y2="130" class="sk-ink" marker-start="url(#sk-arrow-ink)" marker-end="url(#sk-arrow-ink)"/>

    <text x="244" y="90" class="lab-muted">c = 1500 m/s</text>
  </svg>
  <figcaption>Écho-sondage : l'impulsion émise vers le fond revient après Δt. La profondeur vaut h = c·Δt/2.</figcaption>
  </figure>

  <p class="exo-part">Partie A — Propagation et écho</p>
  <div class="q"><strong>A1.</strong> Calculer la longueur d'onde \(\lambda\) des ultrasons dans l'eau.</div>
  <div class="q"><strong>A2.</strong> L'impulsion émise vers le fond revient au sonar après une durée \(\Delta t = 0{,}20\ \text{s}\). En déduire la profondeur \(h\) sous le navire.</div>
  <div class="q"><strong>A3.</strong> Deux hydrophones alignés verticalement sont séparés de \(d = 1{,}5\ \text{cm}\). Calculer le déphasage \(\Delta\varphi\) entre les signaux qu'ils reçoivent. Sont-ils en phase, en opposition de phase ?</div>

  <p class="exo-part">Partie B — Deux transducteurs : orienter le faisceau</p>
  <p>Pour explorer les fonds à côté du navire, on utilise deux transducteurs identiques \(S_1\) et \(S_2\), fixés sous la coque à la même profondeur et distants de \(a=4{,}5\ \text{cm}\), alimentés par le même générateur à \(f_0\). On repère une direction d'émission par son angle \(\theta\) avec la verticale descendante, compté positivement du côté de \(S_1\). On admet qu'en un point \(M\) très éloigné dans la direction \(\theta\), la différence de marche vaut \(\delta=S_2M-S_1M\approx a\sin\theta\) (les deux trajets sont presque parallèles).</p>
  <div class="q"><strong>B1.</strong> Les deux transducteurs émettent en phase. Déterminer les directions \(\theta\) dans lesquelles les ondes interfèrent de façon constructive, puis celles où elles interfèrent de façon destructive.</div>
  <div class="q"><strong>B2.</strong> On veut que le maximum d'émission se trouve dans la direction \(\theta_0=10^\circ\). Quel déphasage faut-il imposer entre les signaux électriques des deux transducteurs ? Lequel doit émettre en retard, et de combien de temps ? Interpréter.</div>

  <p class="exo-part">Partie C — Atténuation du signal (hors programme, pour aller plus loin)</p>
  <div class="q"><strong>C1.</strong> On admet que l'intensité acoustique décroît comme \(1/r^2\) avec la distance \(r\) parcourue. Exprimer puis calculer l'atténuation géométrique \(\Delta L_{\text{géo}}\) (en dB) subie par l'écho entre une distance de référence \(r_0 = 1\ \text{m}\) et le retour au sonar, sachant que l'écho parcourt l'aller-retour \(2h\).</div>
  <div class="q"><strong>C2.</strong> L'eau de mer absorbe en outre le signal avec un coefficient \(\alpha = 0{,}04\ \text{dB/m}\). Calculer l'atténuation totale sur l'aller-retour, puis commenter ce qui limite la portée du sonar.</div>

  <p class="exo-part">Partie D — Détection d'une cible mobile (effet Doppler ; hors programme, pour aller plus loin)</p>
  <div class="q"><strong>D1.</strong> Un sous-marin se rapproche verticalement du sonar à la vitesse \(v = 10\ \text{m/s}\). Quelle fréquence \(f_1\) reçoit-il ? (Le sous-marin est ici un observateur mobile, le sonar une source fixe : \(f_1=f_0\,(c+v)/c\).)</div>
  <div class="q"><strong>D2.</strong> Le sous-marin renvoie l'onde : il se comporte alors comme une source mobile se rapprochant du sonar (récepteur fixe). Quelle fréquence \(f_2\) le sonar reçoit-il en retour ? Exprimer \(f_2\) en fonction de \(f_0\), \(c\) et \(v\).</div>
  <div class="q"><strong>D3.</strong> Calculer le décalage Doppler \(\Delta f = f_2 - f_0\). Montrer que pour \(v \ll c\), \(\Delta f \approx 2 f_0\,v/c\), et expliquer comment le sonar en déduit la vitesse de la cible.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(\lambda = c/f_0 = 1500/(50\times10^3)\), soit \(\lambda=3{,}0\ \text{cm}\).</p>
    <p><strong>A2.</strong> L'impulsion effectue un aller-retour, soit une distance \(2h\) parcourue en \(\Delta t\) : \(2h = c\,\Delta t\), d'où \(h = \dfrac{c\,\Delta t}{2} = \dfrac{1500\times0{,}20}{2} = 150\ \text{m}\).</p>
    <p><strong>A3.</strong> \(\Delta\varphi = k\,d = \dfrac{2\pi}{\lambda}\,d = \dfrac{2\pi}{0{,}03}\times0{,}015 = \pi\ \text{rad}\). Les deux capteurs, distants d'une demi-longueur d'onde, reçoivent des signaux <strong>en opposition de phase</strong>.</p>
    <p><strong>B1.</strong> Sources en phase : \(\Delta\varphi=2\pi\delta/\lambda=2\pi a\sin\theta/\lambda\), avec \(a/\lambda=1{,}5\). Constructif si \(a\sin\theta=p\lambda\), soit \(\sin\theta=p/1{,}5\) : \(p=0\) (\(\theta=0\), à la verticale) et \(p=\pm1\) (\(\sin\theta=\pm0{,}667\), \(\theta=\pm41{,}8^\circ\)) ; \(|p|\ge2\) est impossible car \(|\sin\theta|\le1\). Destructif si \(\sin\theta=\left(p+\tfrac12\right)/1{,}5\) : \(\sin\theta=\pm1/3\) (\(\theta=\pm19{,}5^\circ\)) et \(\sin\theta=\pm1\) (\(\theta=\pm90^\circ\), à l'horizontale).</p>
    <p><strong>B2.</strong> En notant \(\varphi_{S_1}\) et \(\varphi_{S_2}\) les retards de phase des transducteurs, le déphasage dans la direction \(\theta\) vaut :</p><div class="formula">$$\Delta\varphi(\theta)=\frac{2\pi a\sin\theta}{\lambda}+\left(\varphi_{S_2}-\varphi_{S_1}\right)$$</div><p>Pour un maximum en \(\theta_0\) (ordre 0), il faut \(\Delta\varphi(\theta_0)=0\) :</p><div class="formula">$$\varphi_{S_1}-\varphi_{S_2}=\frac{2\pi a\sin\theta_0}{\lambda}=2\pi\times1{,}5\times\sin10^\circ=1{,}64\ \text{rad}$$</div><p> C'est \(S_1\), situé du côté de la direction visée, qui doit émettre en retard, de \(\tau=\dfrac{a\sin\theta_0}{c}=\dfrac{0{,}045\times0{,}174}{1\,500}=5{,}2\ \mu\text{s}\) : ce retard compense exactement le trajet plus court de son onde vers les points de la direction \(\theta_0\), si bien que les deux ondes y arrivent en phase. En faisant varier ce retard électroniquement, on balaie le fond sans tourner l'émetteur : c'est le principe des sonars et des radars à commande de phase.</p>
    <p><strong>C1.</strong> Pour une décroissance en \(1/r^2\) :</p><div class=\"formula\">$$L(r) - L(r_0) = 10\log\frac{I(r)}{I(r_0)} = 10\log\frac{r_0^{\,2}}{r^2} = 20\log\frac{r_0}{r}$$</div><p> Avec \(r_0 = 1\ \text{m}\) et \(r = 2h = 300\ \text{m}\) : \(\Delta L_{\text{géo}} = -20\log 300\), soit \(\Delta L_{\text{géo}}\approx -49{,}5\ \text{dB}\) (perte d'environ 49,5 dB).</p>
    <p><strong>C2.</strong> Absorption : \(\alpha\times 2h = 0{,}04\times300 = 12\ \text{dB}\). Atténuation totale \(\approx 49{,}5 + 12 \approx 61{,}5\ \text{dB}\). L'écho est très affaibli : c'est la combinaison de l'étalement géométrique et de l'absorption qui fixe la portée — au-delà d'une certaine profondeur, l'écho passe sous le seuil de détection de l'électronique.</p>
    <p><strong>D1.</strong> Observateur mobile se rapprochant d'une source fixe : \(f_1 = f_0\dfrac{c+v}{c}\), soit \(f_1=50\,000\times\dfrac{1510}{1500} \approx 50\,333\ \text{Hz}\).</p>
    <p><strong>D2.</strong> Le sous-marin réémet \(f_1\) comme une source mobile s'approchant du sonar fixe : \(f_2 = f_1\dfrac{c}{c-v} = f_0\dfrac{c+v}{c-v}\). A.N. : \(f_2 = 50\,000\times\dfrac{1510}{1490} \approx 50\,671\ \text{Hz}\).</p>
    <p><strong>D3.</strong> \(\Delta f = f_0\!\left(\dfrac{c+v}{c-v} - 1\right) = f_0\dfrac{2v}{c-v} \approx 671\ \text{Hz}\). Pour \(v\ll c\), \(c-v\approx c\), d'où \(\Delta f \approx \dfrac{2 f_0\,v}{c} = \dfrac{2\times50\,000\times10}{1500} \approx 667\ \text{Hz}\). En mesurant \(\Delta f\), le sonar remonte à la vitesse radiale de la cible : \(v \approx \dfrac{c\,\Delta f}{2 f_0}\). C'est le principe du <strong>sonar Doppler</strong> (transposé aux ondes électromagnétiques, c'est celui du radar Doppler).</p>
