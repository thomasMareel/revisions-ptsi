  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 1.6 « Propagation d'un signal » du programme de PTSI (premier semestre). On y décrit un signal qui se propage <strong>sans écrire d'équation d'onde</strong>, comme le demande le programme, puis on étudie la somme de deux signaux sinusoïdaux de même fréquence et les interférences qui en résultent. Les interférences lumineuses (trous d'Young) font l'objet du chapitre « Optique ondulatoire », qui s'appuie sur celui-ci ; l'équation de d'Alembert et les ondes stationnaires sont étudiées en 2ᵉ année, sur les ondes électromagnétiques.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Exemples de signaux</strong> : identifier les grandeurs physiques correspondant à des signaux acoustiques, électriques, électromagnétiques ; citer des ordres de grandeur de fréquences dans les domaines acoustique, mécanique et électromagnétique (§1).</li>
        <li><strong>Onde progressive à une dimension, milieu non dispersif</strong> : écrire les signaux sous la forme \(f(x-ct)\) ou \(g(x+ct)\), \(f(t-x/c)\) ou \(g(t+x/c)\) ; célérité, retard ; prévoir l'évolution temporelle à position fixée et le profil spatial à différents instants (§2).</li>
        <li><strong>Onde progressive sinusoïdale</strong> : vitesse de phase, double périodicité spatiale et temporelle ; établir la relation entre fréquence, longueur d'onde et vitesse de phase (§3).</li>
        <li><strong>Déphasage dû à la propagation</strong> : relier le déphasage entre les signaux perçus en deux points au retard ; mesurer une vitesse de phase, une longueur d'onde et un déphasage (§4).</li>
        <li><strong>Milieux dispersifs ou non dispersifs</strong> : définir un milieu dispersif ; citer des exemples de propagation dispersive et non dispersive (§5).</li>

<div class="course-section">
  <div class="sec-num">§1 · SIGNAUX ET ONDES</div>
  <h2>Un signal qui voyage</h2>
  <div class="intro">Un haut-parleur fait vibrer l'air, un caillou ride la surface d'un lac, une antenne émet un champ électrique : chaque fois, une grandeur physique varie en un point, et la même variation se retrouve plus loin, un peu plus tard. Ce chapitre décrit ce « voyage » d'un signal, puis ce qui se passe quand deux signaux se rencontrent.</div>
  <div class="def-box">
    <strong>Onde.</strong> Une onde est la propagation, de proche en proche, d'une perturbation d'une grandeur physique (le <strong>signal</strong>), sans transport global de matière : chaque élément du milieu oscille autour de sa position d'équilibre, seules l'information et l'énergie avancent. La vitesse de propagation du signal est la <strong>célérité</strong> \(c\).
  </div>
  <h3>Quelle grandeur se propage ?</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Onde</th><th style="text-align:left">Signal (grandeur qui varie)</th><th style="text-align:left">Célérité typique</th></tr>
    <tr><td>son dans l'air</td><td>surpression \(p\) (Pa), ou vitesse des particules d'air</td><td>\(343\ \text{m·s}^{-1}\) à 20 °C (on retient \(340\))</td></tr>
    <tr><td>son dans l'eau, dans l'acier</td><td>surpression, déplacement</td><td>\(1\,500\ \text{m·s}^{-1}\) ; environ \(5\,000\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>onde sur une corde tendue</td><td>déplacement transversal \(y\) (m)</td><td>de 10 à quelques centaines de \(\text{m·s}^{-1}\)</td></tr>
    <tr><td>houle, vagues</td><td>élévation de la surface (m)</td><td>de 1 à \(20\ \text{m·s}^{-1}\), selon la longueur d'onde (§5)</td></tr>
    <tr><td>ondes sismiques</td><td>déplacement du sol</td><td>de 3 à \(8\ \text{km·s}^{-1}\)</td></tr>
    <tr><td>signal électrique dans un câble coaxial</td><td>tension \(u\) (V), intensité \(i\) (A)</td><td>environ \(2\times10^{8}\ \text{m·s}^{-1}\)</td></tr>
    <tr><td>onde électromagnétique (radio, lumière)</td><td>champ électrique \(E\) (\(\text{V·m}^{-1}\))</td><td>\(c=3{,}00\times10^{8}\ \text{m·s}^{-1}\) dans le vide</td></tr>
  </table></div>
  <p>Dans une onde <strong>transversale</strong>, la grandeur qui vibre est perpendiculaire à la direction de propagation (corde, champ électrique de la lumière, ondes sismiques S) ; dans une onde <strong>longitudinale</strong>, elle lui est parallèle (le son dans un fluide : les tranches d'air se compriment et se détendent dans la direction de propagation ; ondes sismiques P).</p>
  <h3>Ordres de grandeur des fréquences</h3>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Domaine</th><th style="text-align:left">Repères</th></tr>
    <tr><td>acoustique</td><td>infrasons en dessous de 20 Hz ; audible de 20 Hz à 20 kHz (voix : 100 Hz à 3 kHz ; la du diapason : 440 Hz) ; ultrasons au-delà de 20 kHz (télémètre : 40 kHz ; sonar : 10 à 100 kHz ; échographie : 1 à 20 MHz)</td></tr>
    <tr><td>mécanique</td><td>houle : 0,05 à 0,2 Hz ; séismes : 0,1 à 10 Hz ; corde de guitare : 80 Hz à 1 kHz</td></tr>
    <tr><td>électromagnétique</td><td>réseau électrique : 50 Hz ; radio FM : 100 MHz ; téléphone, Wi-Fi, four à micro-ondes : 1 à 5 GHz ; visible : \(4\times10^{14}\) à \(7{,}5\times10^{14}\ \text{Hz}\) ; rayons X : \(10^{17}\) à \(10^{19}\ \text{Hz}\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — à quelle distance est l'orage ?</strong>
    <p>On compte \(\Delta t=6{,}0\ \text{s}\) entre l'éclair et le tonnerre.</p>
    <ol>
      <li>La lumière parcourt quelques kilomètres en quelques microsecondes : son trajet est instantané à l'échelle de la seconde.</li>
      <li>Le son met donc \(\Delta t\) à parcourir la distance \(d\) : \(d=c\,\Delta t=343\times6{,}0\approx2{,}1\ \text{km}\).</li>
      <li>Vérification : la lumière met \(d/c_{\text{lumière}}=2\,058/(3{,}00\times10^{8})\approx7\ \mu\text{s}\), négligeable devant 6 s. D'où la règle pratique : trois secondes par kilomètre.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que la matière avance avec l'onde. Un bouchon posé sur l'eau monte et descend au passage de la houle, il n'est pas emporté ; un tympan vibre sans que l'air de la salle se déplace vers lui. Ce qui se propage, c'est la perturbation (et l'énergie qu'elle transporte).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ONDE PROGRESSIVE À UNE DIMENSION</div>
  <h2>Le même signal, plus loin et plus tard</h2>
  <div class="intro">Dans un milieu illimité (pas de réflexion), transparent (pas d'absorption) et non dispersif (§5), un signal se propage sans se déformer : ce qu'enregistre un capteur placé en \(x\) est exactement ce qu'enregistrait un capteur placé à l'origine, avec un retard \(x/c\). Toute la description tient dans cette phrase.</div>
  <div class="def-box">
    <strong>Onde progressive.</strong> Un signal \(s(x,t)\) se propageant à la célérité \(c\) dans le sens des \(x\) croissants s'écrit
    <div class="formula" data-nom="Onde progressive">$$s(x,t)=f\!\left(t-\frac{x}{c}\right)$$</div>
    où \(f(t)=s(0,t)\) est le signal à l'origine : le point d'abscisse \(x\) reproduit ce signal avec le <strong>retard</strong> \(\tau=x/c\). Dans le sens des \(x\) décroissants, \(s(x,t)=g(t+x/c)\).
  </div>
  <div class="prop-box">
    <strong>Deux écritures équivalentes.</strong> En posant \(F(u)=f(-u/c)\), on a \(f(t-x/c)=F(x-ct)\) : une onde progressive vers les \(x\) croissants s'écrit aussi \(F(x-ct)\), et une onde vers les \(x\) décroissants \(G(x+ct)\).
    <ul>
      <li><strong>À position fixée</strong>, \(t\mapsto s(x_1,t)\) est le signal \(f\) décalé du retard \(x_1/c\).</li>
      <li><strong>À instant fixé</strong>, \(x\mapsto s(x,t_1)=F(x-ct_1)\) est le profil à \(t=0\) translaté de \(ct_1\) vers les \(x\) croissants : la forme se conserve, elle glisse à la vitesse \(c\).</li>
    </ul>
  </div>

  <h3>Du signal temporel au profil spatial</h3>
  <p>Le profil spatial n'est pas une copie du signal temporel : il en est l'image <strong>retournée</strong>. La partie du signal émise en premier est partie la première, elle est donc en tête, du côté des \(x\) les plus grands. Sur la figure, la montée rapide (émise d'abord) forme le front raide de l'impulsion, et la descente lente traîne derrière. Pour passer de l'un à l'autre, on suit les instants remarquables : le point du signal émis à l'instant \(u\) se trouve, à l'instant \(t\), en \(x=c\,(t-u)\).</p>
  <div class="method-box">
    <strong>Exemple — une impulsion sur une corde</strong>
    <p>On agite l'extrémité \(x=0\) d'une longue corde (\(c=10\ \text{m·s}^{-1}\)) : son déplacement monte de 0 à 2 cm entre \(t=0\) et \(t=0{,}10\ \text{s}\), puis redescend linéairement jusqu'à 0 à \(t=0{,}40\ \text{s}\).</p>
    <ol>
      <li><em>Point \(x_1=3{,}0\ \text{m}\).</em> Retard \(\tau=x_1/c=0{,}30\ \text{s}\) : il se met en mouvement à 0,30 s, atteint 2 cm à 0,40 s et s'immobilise à 0,70 s.</li>
      <li><em>Profil à \(t=0{,}60\ \text{s}\).</em> Le début du signal (\(u=0\)) est en \(x=c\,t=6{,}0\ \text{m}\) : c'est le front. Le maximum (\(u=0{,}10\ \text{s}\)) est en \(c\,(0{,}60-0{,}10)=5{,}0\ \text{m}\), la fin (\(u=0{,}40\ \text{s}\)) en \(2{,}0\ \text{m}\). Le profil monte lentement de 2 à 5 m puis chute de 5 à 6 m.</li>
      <li><em>Longueur de la perturbation</em> : \(c\times0{,}40\ \text{s}=4{,}0\ \text{m}\), à tout instant (aucune déformation).</li>
    </ol>
  </div>
  <p>Deux ondes progressives de sens opposés qui se rencontrent se traversent sans se modifier : en chaque point, les signaux s'ajoutent (principe de superposition, §6), puis chacun poursuit sa route.</p>
  <div class="notice"><strong>Erreur classique</strong> : se tromper de sens. Dans \(f(t-x/c)\), le signe « moins » traduit une propagation vers les \(x\) croissants : pour retrouver la même valeur du signal plus tard (\(t\) augmente), il faut aller plus loin (\(x\) augmente). Autre piège : recopier le graphe \(s(0,t)\) pour dessiner le profil \(s(x,t_1)\) sans le retourner.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · ONDE PROGRESSIVE SINUSOÏDALE</div>
  <h2>Double périodicité : période et longueur d'onde</h2>
  <div class="intro">Une source qui oscille sinusoïdalement crée une onde progressive sinusoïdale. C'est le modèle de base : un signal périodique quelconque est une somme de sinusoïdes (chapitre « Signaux périodiques et spectres »), et dans un milieu non dispersif chacune se propage sans se déformer.</div>
  <div class="def-box">
    <strong>Onde progressive sinusoïdale.</strong> Si la source impose \(s(0,t)=A\cos(\omega t+\varphi_0)\), l'onde vers les \(x\) croissants s'écrit
    <div class="formula" data-nom="Onde progressive sinusoïdale">$$s(x,t)=A\cos\!\left(\omega\left(t-\frac{x}{c}\right)+\varphi_0\right)=A\cos(\omega t-kx+\varphi_0)$$</div>
    avec \(k=\omega/c\). \(A\gt0\) est l'amplitude, \(\omega\) la pulsation (\(\text{rad·s}^{-1}\)), \(\varphi_0\) la phase à l'origine et \(k\) (\(\text{rad·m}^{-1}\)) la norme du vecteur d'onde, souvent appelée nombre d'onde. Vers les \(x\) décroissants : \(A\cos(\omega t+kx+\varphi_0)\).
  </div>
  <div class="prop-box">
    <strong>Double périodicité.</strong> En un point fixé, le signal est périodique en temps, de période \(T=2\pi/\omega=1/f\). À un instant fixé, le profil est périodique en espace, de période la <strong>longueur d'onde</strong> \(\lambda=2\pi/k\). Les deux sont liées par la vitesse de phase \(v_\varphi=\omega/k\), égale à \(c\) dans un milieu non dispersif :
    <div class="formula" data-nom="Longueur d'onde">$$\lambda=v_\varphi\,T=\frac{v_\varphi}{f},\qquad k=\frac{2\pi}{\lambda}=\frac{\omega}{v_\varphi}$$</div>
    Pendant une période, l'onde avance d'une longueur d'onde.
  </div>

<figcaption>Onde progressive sinusoïdale s = A cos(ωt − kx). À gauche, le profil à un instant (trait plein) et un quart de période plus tard (tirets) : il a avancé de λ/4. À droite, le signal en un point fixe. Les deux périodes sont liées par λ = cT.</figcaption>
</figure>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi \(\lambda=2\pi/k\) et pourquoi les crêtes avancent à \(\omega/k\)</span>
    <div class="content">
      <p><em>Période spatiale.</em> \(s(x+\lambda,t)=s(x,t)\) pour tout \(x\) impose \(k\lambda=2\pi\) (la plus petite période d'un cosinus est \(2\pi\)) : \(\lambda=2\pi/k\). De même \(\omega T=2\pi\).</p>
      <p><em>Vitesse de phase.</em> Suivons une crête, c'est-à-dire un point où la phase \(\omega t-kx+\varphi_0\) garde une valeur fixée : entre \(t\) et \(t+\mathrm{d}t\), il faut \(\omega\,\mathrm{d}t-k\,\mathrm{d}x=0\), donc la crête avance à la vitesse \(\mathrm{d}x/\mathrm{d}t=\omega/k\). En remplaçant \(\omega=2\pi/T\) et \(k=2\pi/\lambda\), \(\omega/k=\lambda/T=\lambda f\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — lire une onde sinusoïdale</strong>
    <p>Le long d'une corde, \(s(x,t)=2{,}0\ \text{mm}\times\cos\!\left(6{,}0\times10^{2}\,t-1{,}8\,x\right)\), en unités SI.</p>
    <ol>
      <li>Coefficient de \(t\) : \(\omega=600\ \text{rad·s}^{-1}\), donc \(f=\omega/2\pi=95{,}5\ \text{Hz}\) et \(T=10{,}5\ \text{ms}\).</li>
      <li>Coefficient de \(x\) : \(k=1{,}8\ \text{rad·m}^{-1}\), donc \(\lambda=2\pi/k=3{,}49\ \text{m}\).</li>
      <li>Vitesse de phase : \(v_\varphi=\omega/k=333\ \text{m·s}^{-1}\) ; contrôle : \(\lambda f=3{,}49\times95{,}5=333\ \text{m·s}^{-1}\). Signes opposés devant \(t\) et \(x\) : propagation vers les \(x\) croissants.</li>
      <li>Vitesse d'un point de la corde : \(\partial s/\partial t\), d'amplitude \(A\omega=2{,}0\times10^{-3}\times600=1{,}2\ \text{m·s}^{-1}\), sans rapport avec \(v_\varphi\).</li>
    </ol>
  </div>
  <p>Quelques longueurs d'onde : le la à 440 Hz mesure \(\lambda=343/440=0{,}78\ \text{m}\) dans l'air et \(3{,}4\ \text{m}\) dans l'eau ; une onde radio FM de 100 MHz, \(3{,}0\ \text{m}\) ; une onde d'échographie de 5 MHz dans les tissus (\(1\,540\ \text{m·s}^{-1}\)), \(0{,}31\ \text{mm}\) : c'est l'ordre de grandeur des détails qu'elle peut distinguer. La fréquence est fixée par la source ; la longueur d'onde dépend en plus du milieu. L'onglet « Simulateur » anime une onde progressive sinusoïdale : faire varier \(c\) et \(\lambda\) et vérifier \(f=c/\lambda\).</p>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\cos(ft-x/\lambda)\), qui oublie le facteur \(2\pi\) : la phase est \(2\pi\left(t/T-x/\lambda\right)=\omega t-kx\). Autre confusion : la vitesse de phase (vitesse des crêtes, 333 m/s ci-dessus) n'est pas la vitesse des éléments du milieu (1,2 m/s au plus).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · DÉPHASAGE DÛ À LA PROPAGATION</div>
  <h2>Retard, déphasage et mesures</h2>
  <div class="intro">Deux capteurs placés sur le trajet d'une onde sinusoïdale enregistrent la même sinusoïde, le second avec un retard. En régime sinusoïdal, ce retard se lit comme un déphasage : c'est ce qu'on mesure à l'oscilloscope pour remonter à la longueur d'onde et à la célérité.</div>
  <div class="prop-box">
    <strong>Déphasage dû à la propagation.</strong> Aux abscisses \(x_1\) et \(x_2\gt x_1\), \(s(x_1,t)=A\cos(\omega t-kx_1+\varphi_0)\) et \(s(x_2,t)=A\cos(\omega t-kx_2+\varphi_0)\). Le signal en \(x_2\) est celui de \(x_1\) retardé de \(\tau\), avec un <strong>retard de phase</strong> \(\Delta\varphi\) :
    <div class="formula" data-nom="Déphasage dû à la propagation">$$\tau=\frac{x_2-x_1}{c},\qquad \Delta\varphi=\omega\tau=k\,(x_2-x_1)=\frac{2\pi\,(x_2-x_1)}{\lambda}$$</div>
    <ul>
      <li><strong>en phase</strong> si \(x_2-x_1=p\lambda\), \(p\) entier (\(\Delta\varphi\) multiple de \(2\pi\)) ;</li>
      <li><strong>en opposition de phase</strong> si \(x_2-x_1=\left(p+\tfrac12\right)\lambda\) (\(\Delta\varphi=\pi\) modulo \(2\pi\)) ;</li>
      <li><strong>en quadrature</strong> si \(x_2-x_1=\left(p\pm\tfrac14\right)\lambda\).</li>
    </ul>
  </div>

  <h3>Mesurer une longueur d'onde et une célérité</h3>
  <p>On utilise un émetteur d'ultrasons (40 kHz) et deux récepteurs reliés aux deux voies d'un oscilloscope. Le récepteur 1 reste fixe ; on éloigne lentement le récepteur 2 le long de la direction de propagation. Chaque fois que les deux signaux redeviennent en phase (maxima simultanés, ou segment montant en mode XY, plus facile à repérer précisément), le récepteur 2 a avancé d'une longueur d'onde. On mesure la distance parcourue pour un grand nombre \(N\) de coïncidences successives, puis \(\lambda\) et \(c=\lambda f\), la fréquence étant lue sur le générateur ou l'oscilloscope.</p>
  <div class="method-box">
    <strong>Exemple — célérité des ultrasons</strong>
    <p>À \(f=40{,}0\ \text{kHz}\), on compte 10 retours en phase pendant que le récepteur avance de 85,8 mm.</p>
    <ol>
      <li>\(\lambda=85{,}8/10=8{,}58\ \text{mm}\) : mesurer 10 longueurs d'onde divise par 10 l'incertitude de lecture de la règle.</li>
      <li>\(c=\lambda f=8{,}58\times10^{-3}\times40{,}0\times10^{3}=343\ \text{m·s}^{-1}\) : la célérité du son dans l'air à 20 °C.</li>
      <li>Deux récepteurs distants de \(20{,}0\ \text{mm}\) : \(\tau=0{,}020/343=58\ \mu\text{s}\) et \(\Delta\varphi=2\pi\times20{,}0/8{,}58=14{,}6\ \text{rad}\). L'oscilloscope n'en montre que le reste modulo \(2\pi\), \(2{,}08\ \text{rad}\) soit 119° : il ne voit pas les deux longueurs d'onde entières.</li>
    </ol>
  </div>
  <p>Sur l'écran, le déphasage se lit par \(\Delta\varphi=2\pi\,\Delta t/T\), où \(\Delta t\) est l'écart entre deux maxima voisins des deux voies. On parle de retard de la voie 2 si son maximum suit celui de la voie 1 de moins d'une demi-période, d'avance sinon.</p>
  <div class="notice"><strong>Erreur classique</strong> : un déphasage mesuré n'est connu qu'à \(2\pi\) près. « En phase » ne signifie pas « au même endroit » : deux points distants d'un nombre entier de longueurs d'onde le sont aussi. Pour obtenir \(c\) par une mesure de déphasage, il faut savoir combien de longueurs d'onde entières séparent les capteurs, d'où la méthode du déplacement continu.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MILIEUX DISPERSIFS</div>
  <h2>Quand la vitesse dépend de la fréquence</h2>
  <div class="intro">Jusqu'ici, toutes les sinusoïdes avancent à la même vitesse \(c\). Dans beaucoup de milieux, la vitesse de phase dépend de la fréquence : on dit que le milieu est dispersif. Les conséquences sont visibles tous les jours, de l'arc-en-ciel à la houle qui arrive sur une plage.</div>
  <div class="def-box">
    <strong>Milieu dispersif.</strong> Un milieu est dispersif si la vitesse de phase \(v_\varphi=\omega/k\) d'une onde progressive sinusoïdale y dépend de la fréquence. Dans un milieu <strong>non dispersif</strong>, \(v_\varphi=c\) pour toutes les fréquences.
  </div>
  <div class="prop-box">
    <strong>Conséquence : les signaux se déforment.</strong> Une composante sinusoïdale reste, seule, une onde progressive sinusoïdale de longueur d'onde \(\lambda=v_\varphi(f)/f\). Mais un signal non sinusoïdal (impulsion, son musical, message) est une somme de composantes de fréquences différentes : en milieu dispersif, elles prennent des retards différents, si bien que la forme \(f(t-x/c)\) ne vaut plus et que le signal s'étale en se propageant.
  </div>

</svg>
<figcaption>Une impulsion (ici une sinusoïde à enveloppe en cloche) est une somme de composantes de fréquences voisines. En milieu non dispersif, toutes avancent à la même vitesse : la forme est conservée. En milieu dispersif, elles prennent des retards différents : l'impulsion s'étale et se déforme (calcul par superposition de 900 composantes).</figcaption>
</figure>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Propagation non dispersive (en bonne approximation)</th><th style="text-align:left">Propagation dispersive</th></tr>
    <tr><td>son dans l'air (domaine audible) : un orchestre entendu de loin garde son timbre, graves et aigus arrivent ensemble</td><td>lumière dans le verre ou l'eau : l'indice dépend de la longueur d'onde (prisme, arc-en-ciel)</td></tr>
    <tr><td>lumière dans le vide (et presque dans l'air)</td><td>houle en eau profonde : \(v_\varphi=\sqrt{g\lambda/2\pi}\), les grandes longueurs d'onde vont plus vite</td></tr>
    <tr><td>onde sur une corde souple et tendue</td><td>ondes de flexion d'une poutre ou d'une plaque (le son d'une tôle frappée)</td></tr>
    <tr><td>signal dans un câble coaxial de bonne qualité, sur une longueur modérée</td><td>ondes radio dans l'ionosphère (plasma), lumière dans une fibre optique (dispersion chromatique)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — la houle trie les vagues</strong>
    <p>En eau profonde, la vitesse de phase de la houle vaut \(v_\varphi=\sqrt{g\lambda/(2\pi)}\) (formule fournie), avec \(g=9{,}81\ \text{m·s}^{-2}\).</p>
    <ol>
      <li>\(\lambda=50\ \text{m}\) : \(v_\varphi=\sqrt{9{,}81\times50/(2\pi)}=8{,}8\ \text{m·s}^{-1}\), période \(T=\lambda/v_\varphi=5{,}7\ \text{s}\).</li>
      <li>\(\lambda=200\ \text{m}\) : \(v_\varphi=17{,}7\ \text{m·s}^{-1}\), \(T=11{,}3\ \text{s}\). La vitesse dépend de \(\lambda\), donc de la fréquence : le milieu est dispersif.</li>
      <li>Une tempête lointaine engendre des vagues de toutes les longueurs d'onde : les plus longues, plus rapides, atteignent la côte les premières, d'où la houle longue et régulière qui précède le mauvais temps. (Le temps d'arrivée de l'énergie fait intervenir la vitesse de groupe, égale ici à la moitié de la vitesse de phase : voir « Pour aller plus loin ».)</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — la lumière dans le verre</strong>
    <p>Pour un verre courant, \(n=1{,}514\) dans le rouge (656 nm) et \(n=1{,}522\) dans le bleu (486 nm). Les vitesses de phase \(c/n\) valent \(1{,}981\times10^{8}\) et \(1{,}971\times10^{8}\ \text{m·s}^{-1}\) : un écart de 0,5 % seulement, qui suffit pour qu'un prisme sépare les couleurs. Le verre est un milieu dispersif pour la lumière.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la dispersion (la vitesse dépend de la fréquence) avec l'<strong>atténuation</strong> (l'amplitude diminue au fil de la propagation, par absorption ou par étalement de l'énergie), et avec la dispersion intermodale d'une fibre à saut d'indice (chapitre d'optique géométrique), qui vient des différences de longueur des trajets et existe même dans un verre non dispersif.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SOMME DE DEUX SIGNAUX SINUSOÏDAUX</div>
  <h2>Additionner deux sinusoïdes de même fréquence</h2>
  <div class="intro">Quand deux ondes atteignent le même point, leurs signaux s'ajoutent. Pour deux sinusoïdes de même fréquence, la somme est encore une sinusoïde de cette fréquence, mais son amplitude dépend de leur déphasage : c'est toute la clé des interférences.</div>
  <div class="prop-box">
    <strong>Principe de superposition.</strong> Pour des perturbations de faible amplitude (milieu linéaire), le signal créé en un point par deux sources est la somme des signaux que chacune y créerait seule : \(s=s_1+s_2\).
  </div>
  <div class="prop-box">
    <strong>Somme de deux signaux de même pulsation.</strong> Pour \(s_1=A_1\cos(\omega t-\varphi_1)\) et \(s_2=A_2\cos(\omega t-\varphi_2)\), de déphasage \(\Delta\varphi=\varphi_2-\varphi_1\), la somme s'écrit \(s=A\cos(\omega t-\varphi)\) avec
    <div class="formula" data-nom="Amplitude de la somme de deux sinusoïdes">$$A^2=A_1^2+A_2^2+2A_1A_2\cos\Delta\varphi$$</div>
    <ul>
      <li>\(A\) est <strong>maximale</strong>, \(A=A_1+A_2\), si \(\Delta\varphi=2p\pi\) (signaux en phase) ;</li>
      <li>\(A\) est <strong>minimale</strong>, \(A=|A_1-A_2|\), si \(\Delta\varphi=(2p+1)\pi\) (opposition de phase) ; elle est nulle si \(A_1=A_2\).</li>
    </ul>
    Pour deux amplitudes égales \(A_0\) : \(A=2A_0\left|\cos\dfrac{\Delta\varphi}{2}\right|\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Par les complexes (ou la construction de Fresnel)</span>
    <div class="content">
      <p>On associe à \(s_j=A_j\cos(\omega t-\varphi_j)\) le complexe \(\underline{s}_j=\underline{A}_j\,e^{i\omega t}\) avec \(\underline{A}_j=A_j\,e^{-i\varphi_j}\), de sorte que \(s_j=\operatorname{Re}(\underline{s}_j)\). La somme a pour amplitude complexe \(\underline{A}=\underline{A}_1+\underline{A}_2\), et son amplitude réelle est \(A=|\underline{A}|\) :</p>
      <div class="formula">$$A^2=\underline{A}\,\underline{A}^{*}=A_1^2+A_2^2+A_1A_2\left(e^{i(\varphi_2-\varphi_1)}+e^{-i(\varphi_2-\varphi_1)}\right)=A_1^2+A_2^2+2A_1A_2\cos\Delta\varphi$$</div>
      <p>La phase vérifie</p>
      <div class="formula">$$\tan\varphi=\frac{A_1\sin\varphi_1+A_2\sin\varphi_2}{A_1\cos\varphi_1+A_2\cos\varphi_2}$$</div>
      <p>(le signe du dénominateur, qui est \(A\cos\varphi\), lève l'ambiguïté de \(\pi\)). Géométriquement, \(\underline{A}\) est la somme de deux vecteurs de longueurs \(A_1\) et \(A_2\) faisant l'angle \(\Delta\varphi\) : la formule est celle d'Al-Kashi. Pour \(A_1=A_2=A_0\), la formule de trigonométrie \(\cos p+\cos q=2\cos\frac{p+q}{2}\cos\frac{p-q}{2}\) donne directement \(s=2A_0\cos\frac{\Delta\varphi}{2}\cos\!\left(\omega t-\frac{\varphi_1+\varphi_2}{2}\right)\).</p>
    </div>
  </div>

    <strong>Exemple — deux signaux de 3,0 mV et 2,0 mV</strong>
    <ol>
      <li>En phase : \(A=3{,}0+2{,}0=5{,}0\ \text{mV}\).</li>
      <li>En quadrature (\(\Delta\varphi=\pi/2\)) : \(A=\sqrt{9{,}0+4{,}0}=3{,}6\ \text{mV}\), et non 5,0.</li>
      <li>\(\Delta\varphi=2\pi/3\) : \(A^2=9{,}0+4{,}0+2\times3{,}0\times2{,}0\times(-0{,}5)=7{,}0\ \text{mV}^2\), \(A=2{,}6\ \text{mV}\).</li>
      <li>En opposition : \(A=3{,}0-2{,}0=1{,}0\ \text{mV}\). Avec deux signaux de 2,5 mV en opposition, on obtiendrait zéro.</li>
    </ol>
  </div>
  <h3>Et l'énergie ?</h3>
  <p>La puissance transportée par une onde sinusoïdale est proportionnelle à la moyenne de \(s^2\) sur une période, soit \(A^2/2\) : elle varie comme le carré de l'amplitude. Pour la somme, \(A^2\) contient, en plus de \(A_1^2+A_2^2\), le terme croisé \(2A_1A_2\cos\Delta\varphi\) : l'intensité de la somme n'est pas la somme des intensités. Deux signaux égaux en phase donnent une amplitude double et une intensité quadruple ; en opposition, une intensité nulle. Sur l'ensemble des points où \(\Delta\varphi\) prend toutes les valeurs, le terme croisé est nul en moyenne : l'énergie n'est ni créée ni détruite, elle est <strong>redistribuée</strong>.</p>
  <div class="notice"><strong>Erreur classique</strong> : additionner les amplitudes (\(A=A_1+A_2\)) quel que soit le déphasage. Et la formule ne vaut que pour deux signaux de <strong>même fréquence</strong> : si les fréquences diffèrent, la somme n'est plus sinusoïdale et son « amplitude » varie dans le temps (battements, hors programme).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · INTERFÉRENCES DE DEUX ONDES</div>
  <h2>Déphasage, différence de marche et conditions d'interférences</h2>
  <div class="intro">Deux sources de même fréquence émettent chacune une onde. En un point \(M\), les deux ondes arrivent après des trajets de longueurs différentes, donc avec un déphasage qui dépend de \(M\) : certains points vibrent fortement, d'autres presque pas. C'est le phénomène d'interférences.</div>
  <div class="def-box">
    <strong>Phase de chaque onde en \(M\).</strong> Deux sources ponctuelles \(S_1\) et \(S_2\) émettent à la même pulsation \(\omega\), dans un milieu non dispersif où la longueur d'onde est \(\lambda\). L'onde issue de \(S_j\) arrive en \(M\), à la distance \(r_j=S_jM\), avec un retard de phase supplémentaire \(kr_j\) :
    <div class="formula">$$s_j(M,t)=A_j\cos\big(\omega t-\varphi_j(M)\big),\qquad \varphi_j(M)=\varphi_{S_j}+\frac{2\pi\,r_j}{\lambda}$$</div>
    où \(\varphi_{S_j}\) est le retard de phase propre de la source \(S_j\). On appelle <strong>différence de marche</strong> en \(M\) la grandeur \(\delta(M)=S_2M-S_1M\).
  </div>
  <div class="prop-box">
    <strong>Déphasage en \(M\).</strong>
    <div class="formula" data-nom="Déphasage de deux ondes en un point">$$\Delta\varphi(M)=\varphi_2(M)-\varphi_1(M)=\frac{2\pi\,\delta(M)}{\lambda}+\left(\varphi_{S_2}-\varphi_{S_1}\right)$$</div>
    <strong>Conditions d'interférences</strong> (sources en phase, \(\varphi_{S_1}=\varphi_{S_2}\)) :
    <ul>
      <li><strong>constructives</strong> (amplitude maximale \(A_1+A_2\)) si \(\delta(M)=p\lambda\), \(p\in\mathbb{Z}\) ;</li>
      <li><strong>destructives</strong> (amplitude minimale \(|A_1-A_2|\)) si \(\delta(M)=\left(p+\tfrac12\right)\lambda\).</li>
    </ul>
    Pour des sources en opposition de phase, les deux conditions s'échangent. En tout point, l'amplitude résultante est donnée par la formule du §6 ; si les deux amplitudes sont égales à \(A_0\) et les sources en phase, \(A(M)=2A_0\left|\cos\dfrac{\pi\,\delta(M)}{\lambda}\right|\).
  </div>
  <h3>Conditions pour observer des interférences stables</h3>
  <ul>
    <li><strong>Même fréquence</strong> : sinon le déphasage dérive dans le temps et la figure défile (deux générateurs réglés « à la même fréquence » diffèrent toujours un peu).</li>
    <li><strong>Déphasage des sources constant</strong> : on alimente les deux haut-parleurs par le <strong>même</strong> générateur, ou l'on fait naître les deux ondes d'une même source (deux pointes fixées au même vibreur dans une cuve à ondes). On dit que les sources sont cohérentes.</li>
    <li><strong>Amplitudes voisines</strong> en \(M\), pour que les minima soient vraiment faibles (sinon \(|A_1-A_2|\) reste grand).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — deux haut-parleurs en phase</strong>
    <p>Deux haut-parleurs \(S_1\) et \(S_2\), distants de \(a=1{,}20\ \text{m}\), sont alimentés en phase par le même générateur à \(f=850\ \text{Hz}\) (\(c=340\ \text{m·s}^{-1}\)). Un auditeur \(M\) se tient à 3,00 m devant \(S_1\), sur la perpendiculaire à \(S_1S_2\) passant par \(S_1\).</p>
    <ol>
      <li>\(\lambda=c/f=0{,}400\ \text{m}\) ; \(S_1M=3{,}00\ \text{m}\), \(S_2M=\sqrt{3{,}00^2+1{,}20^2}=3{,}231\ \text{m}\).</li>
      <li>\(\delta=0{,}231\ \text{m}\), soit \(\delta/\lambda=0{,}578\) : très proche de \(\tfrac12\), les interférences sont presque destructives.</li>
      <li>Si les amplitudes en \(M\) sont voisines, \(A=2A_0\,|\cos(\pi\times0{,}578)|=0{,}48\,A_0\) : l'auditeur entend moins bien qu'avec un seul haut-parleur.</li>
      <li>En inversant les fils d'un haut-parleur (sources en opposition), le même point devient presque constructif : \(A=2A_0\,|\sin(\pi\times0{,}578)|=1{,}94\,A_0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le déphasage propre des sources (haut-parleurs branchés en opposition, réflexion…), ou confondre \(\delta\) (une longueur, en mètres) et \(\Delta\varphi\) (un angle, en radians). Les conditions « \(\delta=p\lambda\) constructif » ne valent que pour des sources en phase.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · FIGURES D'INTERFÉRENCES ET APPLICATIONS</div>
  <h2>Où sont les maxima ? Cuve à ondes, haut-parleurs, antibruit</h2>
  <div class="intro">Les points de même différence de marche dessinent des lignes fixes dans l'espace : on les voit directement à la surface d'une cuve à ondes, on les entend en se déplaçant devant deux haut-parleurs. Les applications vont du réglage d'une sonorisation au casque antibruit.</div>
  <div class="prop-box">
    <strong>Lignes d'interférences dans un plan.</strong> Les points tels que \(S_2M-S_1M=\delta\) fixé forment une branche d'<strong>hyperbole</strong> de foyers \(S_1\) et \(S_2\) (une droite, la médiatrice, pour \(\delta=0\)). Pour des sources en phase distantes de \(a\) :
    <ul>
      <li>lignes d'amplitude maximale : \(\delta=p\lambda\), avec \(|p|\lt a/\lambda\) (car \(|S_2M-S_1M|\le a\)) ; la médiatrice (\(p=0\)) en fait partie ;</li>
      <li>lignes d'amplitude nulle : \(\delta=\left(p+\tfrac12\right)\lambda\).</li>
    </ul>
    Le nombre de lignes croît avec \(a/\lambda\) : des sources distantes de moins d'une demi-longueur d'onde ne donnent aucune ligne d'amplitude nulle.
  </div>

<figcaption>Deux sources en phase, distantes de a = 3,4 λ (cuve à ondes vue de dessus). Arcs fins : crêtes de chaque onde, espacées de λ. Traits pleins : lignes S₂M − S₁M = pλ, où les crêtes coïncident (interférences constructives, amplitude maximale). Tirets : lignes S₂M − S₁M = (p + ½)λ, où une crête tombe sur un creux (amplitude nulle). Ce sont des hyperboles de foyers S₁ et S₂.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — compter les lignes de silence</strong>
    <p>Reprenons \(a=1{,}20\ \text{m}\) et \(\lambda=0{,}400\ \text{m}\) (§7). Sur le segment \(S_1S_2\), au point d'abscisse \(x\) comptée depuis le milieu, \(\delta=2x\).</p>
    <ol>
      <li>Amplitude nulle si \(2x=\left(p+\tfrac12\right)\lambda\), soit \(x=\left(p+\tfrac12\right)\times0{,}200\ \text{m}\) avec \(|x|\lt0{,}60\ \text{m}\) : \(x=\pm0{,}10\), \(\pm0{,}30\), \(\pm0{,}50\ \text{m}\).</li>
      <li>Il y a donc 6 lignes d'amplitude nulle, qui partent de ces points ; entre elles, 5 lignes de maximum (\(p=-2\) à \(2\)).</li>
      <li>Deux minima voisins sont distants de \(\lambda/2=0{,}20\ \text{m}\) sur le segment : en marchant de \(S_1\) vers \(S_2\), on entend le son passer par un minimum tous les 20 cm.</li>
    </ol>
  </div>
  <h3>Loin des sources : des maxima régulièrement espacés</h3>
  <p>Sur une droite parallèle à \(S_1S_2\), à la distance \(D\) très grande devant \(a\) et devant l'abscisse \(x\) du point (comptée depuis l'axe), la différence de marche vaut \(\delta\approx a\,x/D\) (calcul détaillé dans le chapitre « Optique ondulatoire », pour les trous d'Young). Les maxima d'amplitude sont alors équidistants, séparés de \(i=\lambda D/a\).</p>
  <div class="method-box">
    <strong>Exemple — deux haut-parleurs vus de loin</strong>
    <p>\(a=0{,}50\ \text{m}\), \(f=3{,}4\ \text{kHz}\) (\(\lambda=0{,}10\ \text{m}\)), droite d'écoute à \(D=4{,}0\ \text{m}\).</p>
    <ol>
      <li>\(i=\lambda D/a=0{,}10\times4{,}0/0{,}50=0{,}80\ \text{m}\) : un maximum sur l'axe, puis tous les 80 cm environ.</li>
      <li>Le calcul exact (résolution numérique de \(S_2M-S_1M=p\lambda\)) place le premier maximum latéral à 0,82 m (2 % d'écart) mais le troisième à 3,0 m au lieu de 2,4 m : l'approximation n'est bonne que pour \(|x|\ll D\).</li>
    </ol>
  </div>
  <h3>Applications</h3>
  <ul>
    <li><strong>Casque antibruit</strong> (contrôle actif du bruit) : un microphone capte le bruit près de l'oreille, un haut-parleur émet le même signal en opposition de phase. Les interférences destructives n'ont lieu qu'au voisinage de l'oreille, à condition que l'erreur de trajet reste petite devant \(\lambda\) : le procédé marche bien aux basses fréquences (ronflement d'un moteur, d'un avion), mal dans les aigus.</li>
    <li><strong>Sonorisation</strong> : deux enceintes qui diffusent le même son créent des zones de creux ; un haut-parleur branché à l'envers supprime les graves sur l'axe.</li>
    <li><strong>Réseaux d'émetteurs</strong> (antennes, sonars) : en réglant le déphasage entre les sources, on choisit la direction des interférences constructives et l'on oriente le faisceau sans bouger l'émetteur.</li>
    <li><strong>Travaux pratiques</strong> : cuve à ondes (vibreur à deux pointes), deux émetteurs d'ultrasons de 40 kHz alimentés par le même générateur et un récepteur que l'on déplace.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — pourquoi l'antibruit marche dans les graves</strong>
    <p>Supposons que l'onde « anti-bruit » arrive à l'oreille avec un trajet trop long de 1,0 cm : au lieu d'une opposition exacte, il reste un déphasage d'erreur \(\varepsilon=2\pi\times0{,}010/\lambda\), et l'amplitude résiduelle de deux signaux égaux vaut \(2A_0\sin(\varepsilon/2)\approx A_0\,\varepsilon\).</p>
    <ol>
      <li>À 150 Hz, \(\lambda=2{,}29\ \text{m}\), \(\varepsilon=0{,}027\ \text{rad}\) : amplitude résiduelle \(0{,}027\,A_0\), intensité divisée par environ 1 300.</li>
      <li>À 3 kHz, \(\lambda=0{,}114\ \text{m}\), \(\varepsilon=0{,}55\ \text{rad}\) : amplitude résiduelle \(0{,}54\,A_0\), intensité divisée par 3 seulement.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que les interférences destructives « détruisent » l'énergie. Le son manquant dans une zone de silence se retrouve dans les zones de maximum (§6). Et une ligne de silence n'existe que si les sources sont cohérentes : deux chanteurs ne produisent pas de figure d'interférences stable.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · ÉQUATION D'ONDE ET ONDES STATIONNAIRES</div>
  <h2>Ce que l'on verra en 2ᵉ année</h2>
  <div class="notice"><strong>Hors programme en PTSI (vu en 2ᵉ année)</strong> : le programme de 1ʳᵉ année décrit la propagation sans aucune équation d'onde. L'équation de d'Alembert et les ondes stationnaires sont étudiées en PT sur les ondes électromagnétiques (chapitres « Ondes électromagnétiques dans le vide » et « Ondes électromagnétiques et conducteurs ») ; les modes propres d'une corde ou d'un tuyau ne figurent dans aucun des deux programmes.</div>
  <h3>Équation de d'Alembert</h3>
  <p>Pour certains milieux (corde souple et tendue, son dans un fluide, onde électromagnétique dans le vide), la modélisation conduit, à une dimension, sans dissipation et pour de faibles amplitudes, à</p>
  <div class="formula">$$\frac{\partial^2 s}{\partial t^2}=c^2\,\frac{\partial^2 s}{\partial x^2}$$</div>
  <p>dont la solution générale est \(f(x-ct)+g(x+ct)\) : une onde progressive et une onde régressive, toutes deux non déformées. Toute onde ne vérifie pas cette équation : une onde dans un milieu dispersif (houle, lumière dans le verre) ou absorbant obéit à d'autres équations. Pour une corde de tension \(T\) et de masse linéique \(\mu\), \(c=\sqrt{T/\mu}\).</p>
  <h3>Ondes stationnaires</h3>
  <p>La superposition de deux ondes sinusoïdales de même amplitude et de même fréquence se propageant en sens opposés, par exemple une onde et sa réflexion, donne</p>
  <div class="formula">$$A\cos(\omega t-kx)+A\cos(\omega t+kx)=2A\cos(kx)\cos(\omega t)$$</div>
  <p>Ce signal ne se propage plus : chaque point oscille sur place avec l'amplitude \(2A|\cos kx|\). Les <strong>nœuds</strong> (amplitude nulle) et les <strong>ventres</strong> (amplitude \(2A\)) sont fixes, deux nœuds voisins étant distants de \(\lambda/2\).</p>

  <p><strong>Modes propres d'une corde fixée à ses deux extrémités</strong> (corde de Melde, instruments à cordes) : les extrémités sont des nœuds, la longueur \(L\) contient un nombre entier de demi-longueurs d'onde, \(L=n\lambda/2\). Les fréquences possibles sont \(f_n=n\,c/(2L)\), multiples de la fréquence fondamentale. Exemple : \(L=0{,}80\ \text{m}\), \(T=20\ \text{N}\), \(\mu=2{,}0\ \text{g·m}^{-1}\) donnent \(c=100\ \text{m·s}^{-1}\) et \(f_1=62{,}5\ \text{Hz}\). Un tuyau fermé à un bout et ouvert à l'autre n'a que les harmoniques impaires, \(f_n=(2n-1)\,c/(4L)\).</p>
  <h3>Vitesse de groupe</h3>
  <p>Dans un milieu dispersif, l'enveloppe d'une impulsion (et l'énergie qu'elle transporte) avance à la vitesse de groupe \(v_g=\mathrm{d}\omega/\mathrm{d}k\), qui diffère de la vitesse de phase. Pour la houle en eau profonde, \(v_g=v_\varphi/2\).</p>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · DÉCIBELS ET EFFET DOPPLER</div>
  <h2>Niveau sonore, sources en mouvement</h2>
  <div class="notice"><strong>Hors programme</strong> (pour aller plus loin) : ni le niveau sonore en décibels, ni l'effet Doppler, ni le cône de Mach ne figurent au programme de PTSI ou de PT.</div>
  <h3>Intensité acoustique et décibels</h3>
  <p>L'intensité acoustique \(I\) (\(\text{W·m}^{-2}\)) est la puissance transportée par unité de surface. L'oreille perçoit des intensités de \(10^{-12}\) à \(1\ \text{W·m}^{-2}\) ; on utilise le niveau sonore \(L=10\log(I/I_0)\) en décibels, avec \(I_0=10^{-12}\ \text{W·m}^{-2}\) (conversation : 60 dB ; seuil de douleur : 120 dB). Une source isotrope de puissance \(P\) donne \(I=P/(4\pi r^2)\) : doubler la distance retranche 6 dB. Deux sources <strong>incohérentes</strong> de même intensité ajoutent leurs intensités, soit 3 dB de plus ; deux sources <strong>cohérentes</strong> qui arrivent en phase quadruplent l'intensité (+6 dB), et l'on retombe sur les interférences du §7 : selon le point, de \(-\infty\) à \(+6\ \text{dB}\).</p>
  <h3>Effet Doppler</h3>
  <p>Une source de fréquence \(f_s\) qui se rapproche à la vitesse \(v_S\) d'un observateur immobile est perçue à la fréquence \(f=f_s\,c/(c-v_S)\) ; un observateur qui se rapproche à la vitesse \(v_O\) d'une source immobile perçoit \(f=f_s\,(c+v_O)/c\) (signes opposés pour un éloignement). Une sirène à 440 Hz roulant à \(30\ \text{m·s}^{-1}\) est entendue à 482 Hz à l'approche, 405 Hz en s'éloignant. Le procédé sert aux radars routiers, à l'échographie Doppler (vitesse du sang) et en astronomie. Si la source va plus vite que le son (\(v_S\gt c\)), les fronts d'onde s'accumulent sur un cône, le <strong>cône de Mach</strong>, de demi-angle \(\alpha\) tel que \(\sin\alpha=c/v_S\) : c'est le « bang » d'un avion supersonique.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ONDES ET INTERFÉRENCES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire de la partie 1.6 du programme : reconnaître une onde progressive et son sens, passer du signal en un point au profil à un instant, exploiter une onde sinusoïdale, calculer un retard et un déphasage, mesurer une longueur d'onde, reconnaître un milieu dispersif, additionner deux sinusoïdes de même fréquence, puis prévoir et localiser des interférences. La dernière méthode, hors programme, sert aux exercices « pour aller plus loin ».</div>

  <div class="method-box"><strong>Méthode 1 — Reconnaître une onde progressive, son sens et sa célérité</strong>
    <ol>
      <li><span class="step">Chercher la combinaison.</span> Le signal dépend-il de \(x\) et \(t\) uniquement à travers \(t-x/c\) (ou \(x-ct\)) ? Alors c'est une onde progressive vers les \(x\) croissants. À travers \(t+x/c\) (ou \(x+ct\)) : vers les \(x\) décroissants.</li>
      <li><span class="step">Lire la célérité.</span> Mettre l'argument sous la forme \(x\pm ct\) (coefficient 1 devant \(x\)) : \(c\) est le coefficient de \(t\), en valeur absolue.</li>
      <li><span class="step">Contrôler.</span> Le signal en \(x\) doit être celui de l'origine, retardé (ou avancé) de \(|x|/c\) ; vérifier les unités de \(c\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(s(x,t)=s_0\,e^{-(x+3t)^2/b^2}\), \(x\) en mètres et \(t\) en secondes : la variable est \(x+3t=x+ct\) avec \(c=3\ \text{m·s}^{-1}\), donc une bosse qui se propage vers les \(x\) décroissants. En revanche, \(e^{-x^2}\cos(\omega t)\) n'est pas une onde progressive : la bosse oscille sur place.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(f(2t-x)\) est bien progressive, mais sa célérité vaut \(2\ \text{m·s}^{-1}\) (\(2t-x=-(x-2t)\)) et non \(1/2\) : toujours ramener à \(x-ct\) ou à \(t-x/c\) avant de lire \(c\).</div>

  <div class="method-box"><strong>Méthode 2 — Passer du signal en un point au profil à un instant</strong>
    <ol>
      <li><span class="step">Repérer les instants remarquables</span> du signal \(f(u)=s(0,u)\) : début, maximum, fin, changements de pente.</li>
      <li><span class="step">Les placer à l'instant \(t_1\).</span> Ce que la source a émis à l'instant \(u\) se trouve en \(x=c\,(t_1-u)\) ; seuls comptent les \(u\) compris entre 0 et \(t_1\) (le reste n'est pas encore émis, ou est déjà sorti du domaine étudié).</li>
      <li><span class="step">Dessiner en retournant.</span> Le début du signal (\(u\) petit) est en tête, à l'abscisse la plus grande ; la longueur de la perturbation est \(c\) fois sa durée.</li>
      <li><span class="step">En sens inverse</span> (profil connu, signal cherché en \(x_1\)) : le point \(x\) du profil passera en \(x_1\) au bout de \((x_1-x)/c\) ; le front arrive en premier.</li>
    </ol>
    <p><em>Exemple éclair :</em> la source d'une cuve impose une bosse rectangulaire de 1 cm entre \(u=0\) et \(u=0{,}50\ \text{s}\), et \(c=4{,}0\ \text{m·s}^{-1}\). À \(t_1=2{,}0\ \text{s}\), la perturbation occupe \(c\,(2{,}0-0{,}50)=6{,}0\ \text{m}\le x\le c\times2{,}0=8{,}0\ \text{m}\) : une bosse de 2,0 m de long, front en \(x=8{,}0\ \text{m}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : recopier le graphe temporel en remplaçant \(t\) par \(x\). Un signal dissymétrique (montée raide, descente lente) donne un profil où la pente raide est à l'avant, donc à droite pour une onde vers les \(x\) croissants.</div>

  <div class="method-box"><strong>Méthode 3 — Exploiter une onde progressive sinusoïdale</strong>
    <ol>
      <li><span class="step">Identifier.</span> Mettre le signal sous la forme \(A\cos(\omega t-kx+\varphi_0)\) : \(\omega\) est le coefficient de \(t\), \(k\) celui de \(x\) ; le sens de propagation se lit sur les signes (opposés : vers les \(x\) croissants).</li>
      <li><span class="step">Calculer.</span> \(f=\omega/2\pi\), \(T=1/f\), \(\lambda=2\pi/k\), \(v_\varphi=\omega/k\).</li>
      <li><span class="step">Contrôler.</span> \(\lambda f=v_\varphi\), et la valeur de \(v_\varphi\) doit être plausible pour le milieu (340 m/s pour le son dans l'air, 1 500 m/s dans l'eau…).</li>
    </ol>
    <p><em>Exemple éclair :</em> surpression \(p(x,t)=p_m\cos(2\pi\times1\,000\,t-18{,}3\,x)\) en unités SI. \(f=1{,}00\ \text{kHz}\), \(\lambda=2\pi/18{,}3=0{,}343\ \text{m}\), \(v_\varphi=2\pi\times1\,000/18{,}3=343\ \text{m·s}^{-1}\) : du son dans l'air à 20 °C, vers les \(x\) croissants.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Calculer un retard et un déphasage dû à la propagation</strong>
    <ol>
      <li><span class="step">Retard.</span> \(\tau=d/c\), où \(d\) est la distance entre les deux points comptée le long de la propagation. Il ne dépend pas de la fréquence (milieu non dispersif).</li>
      <li><span class="step">Déphasage.</span> \(\Delta\varphi=\omega\tau=2\pi\,d/\lambda=2\pi f\tau\) : il dépend de la fréquence. Le point le plus éloigné de la source est en retard.</li>
      <li><span class="step">Conclure.</span> Diviser \(d\) par \(\lambda\) : partie fractionnaire nulle, en phase ; égale à \(\tfrac12\), en opposition ; \(\tfrac14\) ou \(\tfrac34\), en quadrature.</li>
    </ol>
    <p><em>Exemple éclair :</em> deux sismomètres alignés avec l'épicentre, distants de 12 km, ondes P à \(6{,}0\ \text{km·s}^{-1}\) : \(\tau=2{,}0\ \text{s}\). Pour la composante à 0,50 Hz, \(\Delta\varphi=2\pi\times0{,}50\times2{,}0=2\pi\) : en phase ; pour celle à 0,25 Hz, \(\Delta\varphi=\pi\) : en opposition.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre retard \(\tau\) (en secondes) et déphasage \(\Delta\varphi\) (en radians, défini à \(2\pi\) près), ou écrire \(\Delta\varphi=k\,d\) avec \(k\) en \(\text{m}^{-1}\) au lieu de \(\text{rad·m}^{-1}\), ce qui fait perdre un facteur \(2\pi\) quand on prend \(k=1/\lambda\).</div>

  <div class="method-box"><strong>Méthode 5 — Mesurer une longueur d'onde et une célérité à l'oscilloscope</strong>
    <ol>
      <li><span class="step">Montage.</span> Un émetteur alimenté par un générateur ; deux récepteurs sur l'axe de propagation, reliés aux voies 1 et 2 ; récepteur 1 fixe.</li>
      <li><span class="step">Repérer les coïncidences.</span> Déplacer le récepteur 2 et noter les positions où les signaux sont en phase : en mode XY, la figure devient un segment montant, ce qui se repère plus précisément qu'un alignement de maxima.</li>
      <li><span class="step">Mesurer sur \(N\) longueurs d'onde.</span> Mesurer la distance \(L\) parcourue pour \(N\) coïncidences successives (\(N\) grand) : \(\lambda=L/N\), d'incertitude-type \(u(L)/N\).</li>
      <li><span class="step">Calculer \(c=\lambda f\)</span> avec la fréquence lue sur l'oscilloscope ; comparer à la valeur attendue (343 m/s à 20 °C).</li>
    </ol>
    <p><em>Exemple éclair :</em> à 40,0 kHz, 12 coïncidences sur \(L=103\ \text{mm}\), lue à \(\pm1\ \text{mm}\) près : \(\lambda=8{,}58\ \text{mm}\) à \(\pm0{,}08\ \text{mm}\), \(c=343\pm3\ \text{m·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Reconnaître un milieu dispersif</strong>
    <ol>
      <li><span class="step">Si la relation entre \(\omega\) et \(k\) est donnée</span>, calculer \(v_\varphi=\omega/k\) : dispersif si le résultat dépend de \(\omega\) (ou de \(k\), ou de \(\lambda\)).</li>
      <li><span class="step">Si une formule de vitesse est donnée</span>, regarder si elle contient \(\lambda\) ou \(f\).</li>
      <li><span class="step">Indices expérimentaux</span> : une impulsion qui s'étale ou change de forme, des couleurs séparées (prisme), des composantes d'un signal qui arrivent à des instants différents.</li>
    </ol>
    <p><em>Exemple éclair :</em> en eau peu profonde (longueur d'onde grande devant la profondeur \(h\)), les vagues avancent à \(\sqrt{gh}\), indépendamment de \(\lambda\) : propagation non dispersive. Un tsunami, par 4 000 m de fond, file à \(\sqrt{9{,}81\times4\,000}=198\ \text{m·s}^{-1}\), environ 710 km/h, sans se déformer. En eau profonde, \(v_\varphi=\sqrt{g\lambda/2\pi}\) dépend de \(\lambda\) : dispersif.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : dire qu'un milieu est dispersif parce que l'onde y est atténuée. L'amortissement est un autre phénomène ; un milieu peut être absorbant sans être dispersif, et inversement.</div>

  <div class="method-box"><strong>Méthode 7 — Additionner deux signaux sinusoïdaux de même fréquence</strong>
    <ol>
      <li><span class="step">Écrire les deux signaux</span> sous la même forme \(A_j\cos(\omega t-\varphi_j)\), amplitudes positives (un signe moins devient un déphasage de \(\pi\)), et calculer \(\Delta\varphi=\varphi_2-\varphi_1\).</li>
      <li><span class="step">Amplitude.</span> \(A^2=A_1^2+A_2^2+2A_1A_2\cos\Delta\varphi\) ; pour \(A_1=A_2=A_0\), \(A=2A_0|\cos(\Delta\varphi/2)|\).</li>
      <li><span class="step">Phase, si elle est demandée.</span> Par les complexes : \(A\,e^{-i\varphi}=A_1e^{-i\varphi_1}+A_2e^{-i\varphi_2}\), ou par la construction de Fresnel (somme de deux vecteurs).</li>
      <li><span class="step">Vérifier les bornes</span> : \(|A_1-A_2|\le A\le A_1+A_2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_1=4{,}0\cos(\omega t)\) et \(u_2=3{,}0\cos(\omega t-\pi/2)\) (en volts) : \(A=\sqrt{16+9}=5{,}0\ \text{V}\) (quadrature), et \(\tan\varphi=3{,}0/4{,}0\), soit \(\varphi=0{,}64\ \text{rad}\) (37°) : \(u=5{,}0\cos(\omega t-0{,}64)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(-A\cos(\omega t)\) n'a pas une amplitude négative : c'est \(A\cos(\omega t-\pi)\). Laisser un signe moins devant l'amplitude fausse le déphasage de \(\pi\), et transforme un maximum en minimum.</div>

  <div class="method-box"><strong>Méthode 8 — Prévoir la nature des interférences en un point</strong>
    <ol>
      <li><span class="step">Longueur d'onde.</span> \(\lambda=c/f\) dans le milieu.</li>
      <li><span class="step">Différence de marche.</span> Calculer \(r_1=S_1M\), \(r_2=S_2M\) (Pythagore), puis \(\delta=r_2-r_1\) ; garder assez de chiffres, car \(\delta\) est une petite différence de grandes distances.</li>
      <li><span class="step">Déphasage.</span> \(\Delta\varphi=2\pi\delta/\lambda+(\varphi_{S_2}-\varphi_{S_1})\) : ne pas oublier le déphasage propre des sources (opposition = \(\pi\)).</li>
      <li><span class="step">Conclure</span> : multiple de \(2\pi\), constructif ; multiple impair de \(\pi\), destructif ; sinon, amplitude par la formule de la méthode 7.</li>
    </ol>
    <p><em>Exemple éclair :</em> deux émetteurs d'ultrasons en phase (\(\lambda=8{,}58\ \text{mm}\)) ; en \(M\), \(r_1=500{,}0\ \text{mm}\) et \(r_2=513{,}0\ \text{mm}\). \(\delta/\lambda=13{,}0/8{,}58=1{,}52\approx1+\tfrac12\) : interférences destructives, le récepteur capte un signal presque nul.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Localiser et compter les maxima et les minima</strong>
    <ol>
      <li><span class="step">Sur le segment \(S_1S_2\)</span> (abscisse \(x\) depuis le milieu) : \(\delta=2x\) ; minima et maxima alternent tous les \(\lambda/4\), deux minima voisins sont distants de \(\lambda/2\).</li>
      <li><span class="step">Dans le plan</span> : lignes \(\delta=\) cte, hyperboles de foyers \(S_1\), \(S_2\). Comme \(|\delta|\le a\), les lignes de maximum ont \(|p|\lt a/\lambda\) (sources en phase), celles de minimum \(\left|p+\tfrac12\right|\lt a/\lambda\).</li>
      <li><span class="step">Loin des sources</span>, sur une droite parallèle à \(S_1S_2\) à la distance \(D\) (\(D\gg a\), \(|x|\ll D\)) : \(\delta\approx a\,x/D\), maxima équidistants de \(i=\lambda D/a\).</li>
    </ol>
    <p><em>Exemple éclair :</em> cuve à ondes, \(\lambda=1{,}2\ \text{cm}\), pointes distantes de \(a=5{,}0\ \text{cm}\), \(a/\lambda=4{,}2\). Lignes de minimum : \(p+\tfrac12=\pm0{,}5\), \(\pm1{,}5\), \(\pm2{,}5\), \(\pm3{,}5\), soit 8 ; lignes de maximum : \(p=-4\) à \(4\), soit 9.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer \(i=\lambda D/a\) près des sources ou loin de l'axe, là où \(\delta\approx a\,x/D\) ne vaut plus ; et oublier que pour des sources en opposition de phase, la médiatrice devient une ligne de minimum.</div>

  <div class="method-box"><strong>Méthode 10 — Trouver les modes propres d'une corde ou d'un tuyau (hors programme, pour aller plus loin)</strong>
    <ol>
      <li><span class="step">Conditions aux limites.</span> Extrémité fixée de corde, ou extrémité fermée de tuyau : nœud de déplacement ; extrémité libre ou ouverte : ventre de déplacement.</li>
      <li><span class="step">Deux nœuds</span> (corde fixe-fixe) ou deux ventres (tuyau ouvert-ouvert) : \(L=n\lambda/2\), \(f_n=n\,c/(2L)\).</li>
      <li><span class="step">Un nœud et un ventre</span> (tuyau fermé-ouvert) : \(L=(2n-1)\lambda/4\), \(f_n=(2n-1)\,c/(4L)\), harmoniques impaires seulement.</li>
      <li><span class="step">Célérité</span> sur une corde : \(c=\sqrt{T/\mu}\) (formule fournie dans les énoncés).</li>
    </ol>
    <p><em>Exemple éclair :</em> corde de guitare de 65 cm, tension 50 N, masse linéique 1,2 g/m : \(c=\sqrt{50/1{,}2\times10^{-3}}=204\ \text{m·s}^{-1}\) et \(f_1=157\ \text{Hz}\). Tuyau fermé-ouvert de 25 cm : \(f_1=340/(4\times0{,}25)=340\ \text{Hz}\).</p>
  </div>
  <div class="notice"><strong>Piège (hors programme)</strong> : les niveaux sonores ne s'additionnent pas. Deux sources incohérentes de 60 dB chacune donnent 63 dB (intensités ajoutées), pas 120 dB ; deux sources cohérentes en phase au point d'écoute donneraient 66 dB, et 0 intensité en opposition.</div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Onde progressive — paramètres</h3>
  <div class="statement">\(s(x,t) = 0{,}02\cos(200\pi t - \pi x/2)\ \text{m}\), \(x\) en mètres et \(t\) en secondes.</div>
  <div class="q"><strong>Q1.</strong> Identifier \(\omega\), \(k\), \(f\), \(\lambda\), \(c\).</div>
  <div class="q"><strong>Q2.</strong> Dans quel sens se propage l'onde ?</div>
  <div class="q"><strong>Q3.</strong> Calculer le déphasage entre \(x=0\) et \(x=4\ \text{m}\). Ces points sont-ils en phase ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On compare à \(A\cos(\omega t-kx)\) : \(\omega = 200\pi\ \text{rad/s}\), \(k = \pi/2\ \text{rad/m}\). \(f = \omega/(2\pi) = 100\ \text{Hz}\). \(\lambda = 2\pi/k = 4\ \text{m}\). \(c = \omega/k = 400\ \text{m/s}\) ; contrôle : \(\lambda f=400\ \text{m/s}\).</p>
    <p><strong>Q2.</strong> Les termes en \(t\) et en \(x\) sont de signes opposés (\(\omega t - kx\)) : propagation dans le sens des \(x\) croissants.</p>
    <p><strong>Q3.</strong> \(\Delta\varphi = k\Delta x = (\pi/2)\times4 = 2\pi\). Un déphasage de \(2\pi\) équivaut à un déphasage nul : les points sont en phase (ils sont distants d'exactement une longueur d'onde). Le point \(x=4\ \text{m}\) reproduit le mouvement de l'origine avec un retard d'une période, 10 ms.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Impulsion sur une corde : du signal au profil</h3>
  <div class="statement">Une longue corde horizontale est tendue ; les ondes transversales s'y propagent sans déformation à \(c=5{,}0\ \text{m·s}^{-1}\). À partir de \(t=0\), on impose à son extrémité \(O\) (\(x=0\)) un déplacement vertical \(s(0,t)\) en forme de trapèze : il croît linéairement de 0 à 3,0 cm entre \(t=0\) et \(t=0{,}20\ \text{s}\), reste égal à 3,0 cm jusqu'à \(t=0{,}30\ \text{s}\), puis revient linéairement à 0 à \(t=0{,}60\ \text{s}\). La corde est assez longue pour qu'aucune réflexion ne revienne pendant l'étude.</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(s(x,t)\) à l'aide de la fonction \(t\mapsto s(0,t)\). Quel est le retard du point \(P\) d'abscisse \(x_P=2{,}0\ \text{m}\) ?</div>
  <div class="q"><strong>Q2.</strong> Décrire le mouvement de \(P\) : instants de mise en mouvement, d'arrivée au plateau, de fin du plateau, de retour au repos.</div>
  <div class="q"><strong>Q3.</strong> Décrire l'aspect de la corde à l'instant \(t_1=1{,}0\ \text{s}\) : abscisses du front, du plateau et de la queue de la perturbation. Quelle est sa longueur ? Où est la pente raide ?</div>
  <div class="q"><strong>Q4.</strong> À l'instant \(t_1\), quels points de la corde montent, lesquels descendent, lesquels sont immobiles ? Avec quelles vitesses verticales ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Milieu non dispersif, propagation vers les \(x\) croissants : le point d'abscisse \(x\) reproduit le mouvement de \(O\) avec le retard \(x/c\), soit \(s(x,t)=s\!\left(0,\,t-\dfrac{x}{c}\right)\). Pour \(P\) : \(\tau=x_P/c=2{,}0/5{,}0=0{,}40\ \text{s}\).</p>
    <p><strong>Q2.</strong> On ajoute 0,40 s à chaque instant remarquable du signal : \(P\) se met en mouvement à 0,40 s, atteint 3,0 cm à 0,60 s, y reste jusqu'à 0,70 s et revient au repos à 1,00 s. Son mouvement a la même forme que celui de \(O\).</p>
    <p><strong>Q3.</strong> Ce que \(O\) a émis à l'instant \(u\) se trouve, à \(t_1\), en \(x=c\,(t_1-u)\). Début (\(u=0\)) : \(x=5{,}0\ \text{m}\), c'est le front ; fin de la montée (\(u=0{,}20\ \text{s}\)) : \(4{,}0\ \text{m}\) ; fin du plateau (\(u=0{,}30\ \text{s}\)) : \(3{,}5\ \text{m}\) ; fin (\(u=0{,}60\ \text{s}\)) : \(2{,}0\ \text{m}\), c'est la queue. En suivant la corde dans le sens des \(x\) croissants : elle s'élève de 0 à 3,0 cm entre 2,0 et 3,5 m (1,5 m), forme un plateau de 3,5 à 4,0 m, puis redescend à 0 entre 4,0 et 5,0 m. Longueur : \(c\times0{,}60\ \text{s}=3{,}0\ \text{m}\). La pente raide (montée rapide du signal, émise en premier) est à l'avant : le profil est le signal temporel retourné.</p>
    <p><strong>Q4.</strong> Un point de la corde refait à l'instant \(t_1\) le mouvement que \(O\) avait à l'instant \(u=t_1-x/c\). Il monte si \(u\in\,]0\,;0{,}20[\ \text{s}\), soit \(4{,}0\ \text{m}\lt x\lt5{,}0\ \text{m}\), à la vitesse \(3{,}0\ \text{cm}/0{,}20\ \text{s}=0{,}15\ \text{m·s}^{-1}\) ; il est immobile (sur le plateau) pour \(3{,}5\lt x\lt4{,}0\ \text{m}\), et au repos en dehors de la perturbation (\(x\lt2{,}0\) ou \(x\gt5{,}0\ \text{m}\)) ; il descend pour \(2{,}0\lt x\lt3{,}5\ \text{m}\), à \(0{,}10\ \text{m·s}^{-1}\). Ces vitesses verticales sont sans rapport avec la célérité \(c\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Mesurer la célérité du son avec deux microphones</h3>
  <div class="statement">Un haut-parleur alimenté par un générateur à \(f=2{,}00\ \text{kHz}\) émet un son. Deux microphones, reliés aux voies 1 et 2 d'un oscilloscope, sont placés sur l'axe du haut-parleur. Au départ, ils sont côte à côte et leurs signaux sont en phase. On éloigne lentement le microphone 2 du haut-parleur, le microphone 1 restant fixe.</div>
  <div class="q"><strong>Q1.</strong> Les signaux redeviennent en phase pour la première fois quand le microphone 2 a reculé de 17,2 cm. En déduire \(\lambda\) et une première valeur de \(c\).</div>
  <div class="q"><strong>Q2.</strong> On continue : la 5ᵉ coïncidence est obtenue après un déplacement de \(85{,}6\ \text{cm}\), lu à \(\pm0{,}5\ \text{cm}\). Donner \(\lambda\), \(c\) et l'incertitude sur \(c\). Pourquoi cette méthode est-elle meilleure ?</div>
  <div class="q"><strong>Q3.</strong> Le microphone 2 est placé 4,3 cm derrière le microphone 1. Calculer le déphasage entre les deux signaux. Lequel est en retard ? Quelle figure observe-t-on en mode XY ?</div>
  <div class="q"><strong>Q4.</strong> On admet que la célérité du son dans l'air varie avec la température absolue \(T\) selon \(c=c_0\sqrt{T/T_0}\), avec \(c_0=331{,}3\ \text{m·s}^{-1}\) à \(T_0=273{,}15\ \text{K}\). Quelle température de la salle la mesure indique-t-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Deux points en phase successifs sont distants d'une longueur d'onde : \(\lambda=17{,}2\ \text{cm}\), d'où \(c=\lambda f=0{,}172\times2{,}00\times10^{3}=344\ \text{m·s}^{-1}\).</p>
    <p><strong>Q2.</strong> \(\lambda=85{,}6/5=17{,}12\ \text{cm}\) et \(c=0{,}1712\times2\,000=342{,}4\ \text{m·s}^{-1}\). L'incertitude de lecture \(\pm0{,}5\ \text{cm}\) est divisée par 5 : \(\pm0{,}1\ \text{cm}\) sur \(\lambda\), soit \(\pm2\ \text{m·s}^{-1}\) sur \(c\) : \(c=342\pm2\ \text{m·s}^{-1}\). Mesurer plusieurs longueurs d'onde à la suite réduit l'incertitude relative, l'erreur de repérage d'une coïncidence n'intervenant que deux fois (au début et à la fin).</p>
    <p><strong>Q3.</strong> \(\Delta\varphi=2\pi\,d/\lambda\), soit \(\Delta\varphi=2\pi\times4{,}3/17{,}12=1{,}58\ \text{rad}\), à peu près \(\pi/2\) : les signaux sont en quadrature, celui du microphone 2, plus loin de la source, étant en retard d'un quart de période (125 µs). En mode XY, on voit une ellipse d'axes parallèles aux axes de l'écran (un cercle si les deux voies ont la même amplitude à l'écran).</p>
    <p><strong>Q4.</strong> \(T=T_0\,(c/c_0)^2\), soit \(T=273{,}15\times(342{,}4/331{,}3)^2=292\ \text{K}\), soit environ \(19\ ^\circ\text{C}\). L'incertitude de \(\pm2\ \text{m·s}^{-1}\) sur \(c\) donne environ \(\pm3\ \text{K}\) sur \(T\) (\(\Delta T/T=2\,\Delta c/c\)) : la mesure est cohérente avec une salle à 20 °C.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Houle et tsunami : milieu dispersif ou non ?</h3>
  <div class="statement">On admet les deux résultats suivants pour les vagues (\(g=9{,}81\ \text{m·s}^{-2}\)). En eau profonde (profondeur grande devant \(\lambda\)), la vitesse de phase vaut \(v_\varphi=\sqrt{g\lambda/(2\pi)}\). En eau peu profonde (profondeur \(h\) petite devant \(\lambda\)), elle vaut \(v_\varphi=\sqrt{gh}\).</div>
  <div class="q"><strong>Q1.</strong> L'eau profonde est-elle un milieu dispersif pour la houle ? Et l'eau peu profonde ? Justifier.</div>
  <div class="q"><strong>Q2.</strong> Une houle de période \(T=10\ \text{s}\) se propage au large. Montrer que \(\lambda=gT^2/(2\pi)\) et calculer \(\lambda\) et \(v_\varphi\). Même question pour \(T=14\ \text{s}\).</div>
  <div class="q"><strong>Q3.</strong> Une tempête lointaine crée des houles de périodes 8 s à 14 s. Lesquelles annoncent la tempête sur la côte ? Pourquoi les surfeurs guettent-ils les « houles longues » ?</div>
  <div class="q"><strong>Q4.</strong> Un tsunami (période \(15\ \text{min}\)) traverse un océan de profondeur \(h=4\,000\ \text{m}\). Vérifier que l'eau est « peu profonde » pour cette onde, calculer sa vitesse et la durée d'un trajet de 3 000 km.</div>
  <div class="q"><strong>Q5.</strong> Près de la côte, \(h=10\ \text{m}\). Que deviennent la vitesse, la période et la longueur d'onde du tsunami ? Commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En eau profonde, \(v_\varphi\) dépend de \(\lambda\), donc de la fréquence : le milieu est dispersif. En eau peu profonde, \(v_\varphi=\sqrt{gh}\) ne dépend que de la profondeur, pas de la fréquence : la propagation est non dispersive (dans ce domaine de validité).</p>
    <p><strong>Q2.</strong> On a à la fois \(v_\varphi=\lambda/T\) et \(v_\varphi=\sqrt{g\lambda/(2\pi)}\). En égalant les carrés, \(\lambda^2/T^2=g\lambda/(2\pi)\), d'où \(\lambda=gT^2/(2\pi)\). Pour \(T=10\ \text{s}\) : \(\lambda=156\ \text{m}\) et \(v_\varphi=\lambda/T=15{,}6\ \text{m·s}^{-1}\). Pour \(T=14\ \text{s}\) : \(\lambda=306\ \text{m}\), \(v_\varphi=21{,}9\ \text{m·s}^{-1}\). (Pour \(T=8\ \text{s}\) : \(100\ \text{m}\) et \(12{,}5\ \text{m·s}^{-1}\).)</p>
    <p><strong>Q3.</strong> Les houles de grande période (grande longueur d'onde) vont plus vite : elles arrivent les premières et annoncent la tempête. Le milieu dispersif trie les vagues par période : loin de la tempête, la houle arrive bien régulière, d'abord longue, ce que recherchent les surfeurs. (Le temps d'arrivée exact fait intervenir la vitesse de groupe, hors programme, qui suit le même ordre.)</p>
    <p><strong>Q4.</strong> \(v_\varphi=\sqrt{9{,}81\times4\,000}=198\ \text{m·s}^{-1}\) (environ 710 km/h) et \(\lambda=v_\varphi T=198\times900=178\ \text{km}\), bien plus grand que \(h=4\ \text{km}\) : l'eau est bien « peu profonde » pour le tsunami. Durée : \(3{,}0\times10^{6}/198=1{,}5\times10^{4}\ \text{s}\), soit 4,2 h. La propagation étant non dispersive, l'onde ne s'étale pas : elle garde sa forme sur des milliers de kilomètres.</p>
    <p><strong>Q5.</strong> La période est imposée par la source : elle reste 15 min. La vitesse tombe à \(\sqrt{9{,}81\times10}=9{,}9\ \text{m·s}^{-1}\) et la longueur d'onde à \(9{,}9\times900=8{,}9\ \text{km}\). L'onde se « comprime » : sa longueur est divisée par 20, et l'énergie, qui ne disparaît pas, se concentre sur une longueur plus courte et une hauteur d'eau plus faible : l'amplitude augmente fortement, d'où la vague destructrice à l'arrivée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Somme de deux ondes de même fréquence ; deux haut-parleurs</h3>
  <div class="statement">Deux ondes de même amplitude se propagent dans le même sens le long d'une corde : \(s_1 = A\cos(\omega t - kx)\) et \(s_2 = A\cos(\omega t - kx + \varphi)\), où \(\varphi\) est une constante.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(s = s_1+s_2\) à l'aide de la formule \(\cos p+\cos q=2\cos\frac{p+q}{2}\cos\frac{p-q}{2}\). Exprimer l'amplitude résultante en fonction de \(\varphi\).</div>
  <div class="q"><strong>Q2.</strong> Pour quelles valeurs de \(\varphi\) l'interférence est-elle constructive (amplitude maximale) ? Destructive (amplitude nulle) ?</div>
  <div class="q"><strong>Q3.</strong> Deux haut-parleurs émettent le même son en phase ; ils sont placés en \((0,0)\) et \((2\ \text{m},0)\). Un auditeur est en \(P(4\ \text{m}, 1\ \text{m})\). Calculer le déphasage en \(P\) et la nature de l'interférence pour \(f=170\ \text{Hz}\), \(c=340\ \text{m/s}\), en supposant les deux amplitudes égales en \(P\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(p=\omega t-kx\) et \(q=\omega t-kx+\varphi\) : \(s = 2A\cos(\varphi/2)\cos(\omega t - kx + \varphi/2)\). C'est encore une onde progressive sinusoïdale, de même fréquence et de même sens, d'amplitude \(|2A\cos(\varphi/2)|\) (cas \(A_1=A_2\) de la formule \(A^2=A_1^2+A_2^2+2A_1A_2\cos\varphi\)).</p>
    <p><strong>Q2.</strong> Constructive (\(|\cos(\varphi/2)|=1\), amplitude \(2A\)) : \(\varphi = 2n\pi\), \(n\in\mathbb{Z}\). Destructive (\(\cos(\varphi/2)=0\)) : \(\varphi = (2n+1)\pi\) ; les deux ondes s'annulent alors en tout point de la corde.</p>
    <p><strong>Q3.</strong> \(r_1 = \sqrt{4^2+1^2} = \sqrt{17}=4{,}123\ \text{m}\) (haut-parleur en \((0,0)\)) et \(r_2 = \sqrt{2^2+1^2}=\sqrt{5}=2{,}236\ \text{m}\). \(\lambda = c/f = 2{,}00\ \text{m}\). Différence de marche \(\Delta r = r_1-r_2 = 1{,}887\ \text{m}\), soit \(\Delta r/\lambda = 0{,}944\), et \(\Delta\varphi = 2\pi\Delta r/\lambda = 5{,}93\ \text{rad} \approx 1{,}89\pi\) : proche de \(2\pi\) sans l'atteindre. \(\cos(\Delta\varphi/2) = \cos(0{,}944\pi)\approx-0{,}984\) : amplitude \(\approx 1{,}97A\), interférence presque constructive (intensité \(\approx 3{,}88A^2\) au lieu de \(4A^2\)). En réalité, le haut-parleur le plus proche donne en \(P\) une amplitude plus grande (onde sphérique), ce qui ne change pas la conclusion.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Zones de silence devant deux haut-parleurs</h3>
  <div class="statement">Deux haut-parleurs \(S_1\) et \(S_2\), distants de \(a=2{,}0\ \text{m}\), sont alimentés en phase par le même générateur à \(f=680\ \text{Hz}\) (\(c=340\ \text{m·s}^{-1}\)). On note \(O\) le milieu de \(S_1S_2\), \(S_1\) en \(x=+a/2\) et \(S_2\) en \(x=-a/2\). Un auditeur marche le long d'une droite parallèle à \(S_1S_2\), à la distance \(D=6{,}0\ \text{m}\) ; on repère sa position \(M\) par son abscisse \(x\) (\(x=0\) sur l'axe). On note \(\delta(x)=S_2M-S_1M\) et l'on suppose que les deux sons ont la même amplitude en \(M\).</div>
  <div class="q"><strong>Q1.</strong> Que perçoit l'auditeur en \(x=0\) ? Pourquoi ?</div>
  <div class="q"><strong>Q2.</strong> On admet que \(\delta(x)\approx a\,x/D\) pour \(|x|\ll D\). En déduire les positions approchées des deux premiers minima de part et d'autre de l'axe et l'écart entre deux maxima voisins.</div>
  <div class="q"><strong>Q3.</strong> La résolution numérique exacte de \(\delta(x)=\lambda/2\) donne \(x=0{,}766\ \text{m}\), et celle de \(\delta(x)=3\lambda/2\) donne \(x=2{,}46\ \text{m}\). Commenter.</div>
  <div class="q"><strong>Q4.</strong> Combien de lignes de silence (dans tout le plan) les deux haut-parleurs créent-ils ?</div>
  <div class="q"><strong>Q5.</strong> On inverse les fils de \(S_2\). Qu'entend-on maintenant en \(x=0\) ? Où sont les maxima ?</div>
  <div class="q"><strong>Q6.</strong> On revient au branchement initial et l'on règle \(f=340\ \text{Hz}\). Position approchée du premier minimum, nombre de lignes de silence ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En \(x=0\), \(M\) est sur la médiatrice : \(S_1M=S_2M\), \(\delta=0\). Les sources étant en phase, les deux sons arrivent en phase : interférences constructives, amplitude double de celle d'un seul haut-parleur.</p>
    <p><strong>Q2.</strong> \(\lambda=c/f=0{,}50\ \text{m}\). Minimum si \(\delta=\left(p+\tfrac12\right)\lambda\) : premiers minima pour \(\delta=\pm\lambda/2\), soit \(x=\pm\dfrac{\lambda D}{2a}=\pm\dfrac{0{,}50\times6{,}0}{2\times2{,}0}=\pm0{,}75\ \text{m}\). Les maxima (\(\delta=p\lambda\)) sont séparés de \(i=\lambda D/a=1{,}5\ \text{m}\).</p>
    <p><strong>Q3.</strong> Pour le premier minimum, l'approximation donne 0,75 m au lieu de 0,766 m (2 % d'écart) : \(x/D=0{,}13\) est assez petit. Pour \(\delta=3\lambda/2\), elle donne \(2{,}25\ \text{m}\) au lieu de \(2{,}46\ \text{m}\) (9 %) : \(x/D=0{,}4\) n'est plus petit devant 1, la formule \(\delta\approx ax/D\) cesse d'être valable et les minima s'écartent davantage que prévu.</p>
    <p><strong>Q4.</strong> Comme \(|\delta|\le a=4\lambda\) pour tout point, les lignes de silence sont celles pour lesquelles \(\left|p+\tfrac12\right|\lt4\) : \(p+\tfrac12=\pm0{,}5\), \(\pm1{,}5\), \(\pm2{,}5\), \(\pm3{,}5\), soit 8 hyperboles.</p>
    <p><strong>Q5.</strong> Inverser les fils déphase \(S_2\) de \(\pi\) : \(\Delta\varphi=2\pi\delta/\lambda+\pi\). En \(x=0\), \(\Delta\varphi=\pi\) : silence (en pratique un minimum marqué, l'égalité des amplitudes n'étant jamais parfaite). Les maxima sont maintenant là où étaient les minima : \(x\approx\pm0{,}75\ \text{m}\) (exactement \(\pm0{,}766\ \text{m}\)), etc.</p>
    <p><strong>Q6.</strong> \(\lambda=1{,}0\ \text{m}\) : premier minimum vers \(x\approx\lambda D/(2a)=1{,}5\ \text{m}\) (le calcul exact donne 1,57 m). \(a/\lambda=2\) : seules \(p+\tfrac12=\pm0{,}5\) et \(\pm1{,}5\) conviennent, soit 4 lignes de silence. Plus la fréquence est basse, moins il y a de lignes, plus elles sont espacées.</p>
  </div>
</div>

    <p><strong>Q3.</strong> \(\Delta L = 10\log(20/10) = 10\log 2 \approx 3\ \text{dB}\). Doubler la puissance ↔ augmenter de 3 dB.</p>

  <h3>Effet Doppler — sirène d'ambulance (hors programme, pour aller plus loin)</h3>
  <div class="statement">Une ambulance émet à \(f_s=440\ \text{Hz}\). Elle se déplace à \(v_S=30\ \text{m/s}\). Célérité du son : \(c=340\ \text{m/s}\). On admet que, pour un observateur immobile, une source qui s'approche est perçue à la fréquence \(f_s\,c/(c-v_S)\) et une source qui s'éloigne à \(f_s\,c/(c+v_S)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la fréquence entendue par un observateur fixe quand l'ambulance s'approche.</div>
  <div class="q"><strong>Q2.</strong> Même question quand l'ambulance s'éloigne.</div>
  <div class="q"><strong>Q3.</strong> Calculer la variation de fréquence perçue lors du passage (en Hz et en %). Un musicien peut-il entendre la différence ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Source qui s'approche : \(f_+ = f_s\dfrac{c}{c-v_S} = 440\times\dfrac{340}{310} \approx 482{,}6\ \text{Hz}\).</p>
    <p><strong>Q2.</strong> Source qui s'éloigne : \(f_- = f_s\dfrac{c}{c+v_S} = 440\times\dfrac{340}{370} \approx 404{,}3\ \text{Hz}\).</p>
    <p><strong>Q3.</strong> \(\Delta f = 482{,}6 - 404{,}3 = 78{,}3\ \text{Hz}\), soit \(78{,}3/440\approx17{,}8\ \%\) de la fréquence émise. C'est très perceptible : une oreille exercée distingue des écarts de hauteur de l'ordre de 0,3 %. Le son passe d'environ un demi-ton et demi au-dessus de la note émise à un demi-ton et demi au-dessous : l'écart total, \(12\log_2(482{,}6/404{,}3)\approx3\) demi-tons, est une tierce mineure.</p>

</div>

  <div class="q"><strong>Q2.</strong> Trouver les fréquences propres.</div>
  <div class="q"><strong>Q3.</strong> Comparer avec un tuyau ouvert-ouvert de même longueur (fréquence fondamentale et harmoniques présentes).</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Corde de Melde — résonances successives, tension et battements (hors programme, pour aller plus loin)</h3>
  <div class="statement">Une corde fixée à ses deux extrémités, de masse linéique \(\mu = 5{,}0\ \text{g·m}^{-1}\) et tendue par \(T = 80\ \text{N}\), présente deux résonances <strong>consécutives</strong> aux fréquences \(f_n = 315\ \text{Hz}\) et \(f_{n+1} = 420\ \text{Hz}\). On admet \(c=\sqrt{T/\mu}\) et \(f_p=p\,c/(2L)\).</div>
  <div class="q"><strong>Q1.</strong> En déduire la fréquence fondamentale \(f_1\) et le rang \(n\) du premier mode observé.</div>
  <div class="q"><strong>Q2.</strong> Calculer la célérité \(c\) des ondes sur la corde, puis la longueur \(L\).</div>
  <div class="q"><strong>Q3.</strong> Quelle tension \(T'\) faut-il pour porter le fondamental à \(110\ \text{Hz}\) ?</div>
  <div class="q"><strong>Q4.</strong> On excite la corde sur son fondamental initial et on approche un diapason de \(100\ \text{Hz}\). Décrire le phénomène entendu et donner sa fréquence.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Modes propres \(f_p = p\,f_1\). Deux résonances consécutives diffèrent de \(f_1\) : \(f_1 = f_{n+1}-f_n = 420-315 = 105\ \text{Hz}\). Alors \(n = f_n/f_1 = 315/105 = 3\) (et \(n+1=4\)).</p>
    <p><strong>Q2.</strong> \(c = \sqrt{T/\mu} = \sqrt{80/(5{,}0\times10^{-3})}\), soit \(c=\sqrt{1{,}6\times10^4} = 126\ \text{m·s}^{-1}\). Or \(f_1 = c/(2L)\) → \(L = c/(2f_1) = 126/210 = 0{,}60\ \text{m}\).</p>
    <p><strong>Q3.</strong> \(f_1 = \dfrac{1}{2L}\sqrt{T/\mu} \propto \sqrt{T}\) (à \(L,\mu\) fixés). Donc \(\dfrac{T'}{T} = \left(\dfrac{f_1'}{f_1}\right)^2 = \left(\dfrac{110}{105}\right)^2\), soit \(T' = 80\times(1{,}0476)^2 \approx 87{,}8\ \text{N}\).</p>
    <p><strong>Q4.</strong> Superposition de deux sons de fréquences voisines (105 et 100 Hz) → <strong>battements</strong> : l'amplitude est modulée à la fréquence \(f_{\text{batt}} = |105-100| = 5\ \text{Hz}\) (on entend 5 renforcements par seconde). C'est la méthode d'accord à l'oreille : on annule les battements quand les fréquences coïncident. Ce n'est pas un phénomène d'interférences stables : les fréquences diffèrent, le déphasage dérive dans le temps.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Écho-sondage acoustique de l'océan (sonar)</h3>
  <div class="exo-source">
    Exercice <strong>original</strong>, calibré sur le format et le niveau des épreuves PT (thème <em>acoustique &amp; ondes</em>, récurrent à l'épreuve de Physique A). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un navire explore les fonds marins à l'aide d'un <strong>sonar</strong> placé en surface, qui émet de brèves impulsions ultrasonores de fréquence \(f_0 = 50\ \text{kHz}\). La célérité du son dans l'eau de mer est \(c = 1500\ \text{m/s}\), supposée uniforme et indépendante de la fréquence. On modélise une impulsion par une onde plane progressive harmonique \(p(x,t) = p_m\cos(\omega t - kx)\) se propageant verticalement vers le fond.
  </div>

  <figure class="schema" style="max-width:330px">
  <svg viewBox="0 0 360 162" role="img" aria-label="Principe du sonar : une source en surface émet une impulsion vers le fond marin ; l'écho revient après une durée delta t, la profondeur vaut c delta t sur deux">

    <rect x="58" y="28" width="30" height="13" class="fl-accent2-soft sk-accent2"/>
