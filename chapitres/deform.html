  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">La mise en forme par <strong>déformation plastique</strong> donne sa forme à une pièce métallique en la faisant couler à l'état <strong>solide</strong>, sans la fondre (moulage) ni enlever de copeaux (usinage) : forgeage, estampage, laminage, filage, tréfilage, découpage, pliage, emboutissage. Le programme de sciences industrielles la place dans la compétence G2 « Industrialiser un produit », au semestre <strong>S3</strong> (début de 2ᵉ année) : « évaluer la capacité d'un procédé à réaliser une pièce métallique » (mise en forme des bruts par déformation plastique, moulage et <strong>découpage</strong> ; domaines d'application ; <strong>règles de conception</strong>). Le site range ce chapitre avec les autres procédés de 1ʳᵉ année, à côté de <a href="#moulage/cours">« Moulage : fonderie, injection plastique et composites »</a>, <a href="#usinage/cours">« Usinage »</a> et <a href="#assemblage/cours">« Assemblages : soudage, rivetage, collage, vissage »</a> ; le chapitre de 2ᵉ année <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a> (§7) s'en sert pour choisir et argumenter un procédé.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités du programme, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Phénomènes physiques</strong> associés aux procédés : déformation plastique, écrouissage, conservation du volume, rôle de la température, fibrage (G2, S3 ; essai de traction : A5, S3) (§1, §2, §4).</li>
        <li><strong>Évaluer la capacité d'un procédé à réaliser une pièce métallique</strong> par déformation plastique : pièces massives forgées et estampées (§3), produits longs et plats laminés, filés, tréfilés (§6), pièces de tôlerie pliées (§8) et embouties (§9) ; par <strong>découpage</strong> (§7) ; <strong>domaines d'application</strong> de chaque procédé (G2, S3).</li>
        <li><strong>Influence du procédé sur la géométrie</strong> de la pièce et <strong>règles de conception</strong> : pièces forgées et estampées (§5), pièces en tôle découpées, pliées et embouties (§10) (G2, S3).</li>
        <li><strong>Critères de choix des procédés</strong> : forme du produit, matériau, coûts, taille de la série, impact environnemental (G2, S3) (§11).</li>
      </ul>
      <p>Le programme limite l'analyse des procédés à une <strong>approche qualitative</strong>, appuyée sur les phénomènes physiques, les contraintes technologiques et économiques et l'influence du procédé sur la géométrie. Les calculs du chapitre (efforts de forgeage, de découpage, de pliage et d'emboutissage, rapport d'emboutissage, longueur développée, retour élastique) donnent des <strong>ordres de grandeur</strong> qui justifient les règles et le choix d'une machine : ils ne sont pas exigibles, et un sujet fournirait les relations. Hors programme, en fin de chapitre : déformations vraies, limite théorique du tréfilage, modèle du retour élastique, procédés particuliers (hydroformage, repoussage, formage incrémental).</p>
    </div>

<div class="course-section">
  <div class="sec-num">§1 · CE QUI SE PASSE DANS LE MÉTAL</div>
  <h2>Déformation plastique, écrouissage, conservation du volume</h2>
  <div class="intro">Tous les procédés de ce chapitre exploitent la même propriété des métaux : au-delà d'un certain seuil de contrainte, ils se déforment de façon <strong>permanente</strong> sans se rompre. L'essai de traction résume ce comportement ; il explique à la fois pourquoi on peut mettre en forme un métal solide, pourquoi la pièce « revient » un peu quand on la relâche, et pourquoi elle durcit en se déformant.</div>

  <h3>L'essai de traction</h3>
  <p>Une éprouvette de longueur initiale \(L_0\) et de section \(S_0\) est étirée par un effort \(F\) croissant. On trace la contrainte nominale \(\sigma = F/S_0\) en fonction de l'allongement relatif \(\varepsilon = \Delta L/L_0\).</p>

  <div class="def-box">
    <ul style="margin:0.3rem 0">
      <li><strong>Domaine élastique</strong> : \(\sigma = E\,\varepsilon\) (\(E\) : module d'Young, 210 GPa pour l'acier, 70 GPa pour l'aluminium). La déformation disparaît quand on décharge.</li>
      <li><strong>Limite d'élasticité</strong> \(R_e\) : contrainte à partir de laquelle une déformation <strong>permanente</strong> (plastique) apparaît.</li>
      <li><strong>Écrouissage</strong> : au-delà de \(R_e\), il faut augmenter la contrainte pour continuer à déformer ; le métal durcit et perd de sa ductilité.</li>
      <li><strong>Résistance à la traction</strong> \(R_m\) : contrainte nominale maximale ; au-delà, la déformation se localise (<strong>striction</strong>) et l'éprouvette rompt.</li>
      <li><strong>Allongement à la rupture</strong> \(A\) : mesure de la <strong>ductilité</strong>, c'est-à-dire de l'aptitude à la mise en forme (30 à 45 % pour un acier doux de tôlerie, 5 à 25 % pour les alliages d'aluminium selon leur état).</li>
    </ul>
  </div>
  <div class="prop-box"><strong>Trois conséquences pour la mise en forme.</strong>
    <ul style="margin:0.3rem 0">
      <li>Pour mettre en forme, il faut dépasser \(R_e\) partout dans la zone à déformer, sans atteindre la rupture : la plage utile va de \(R_e\) à \(R_m\), et la ductilité \(A\) borne la déformation possible.</li>
      <li>Quand on relâche l'outil, la part élastique \(\sigma/E\) se récupère : c'est le <strong>retour élastique</strong>, qui ouvre un pli et déforme une pièce emboutie.</li>
      <li>Le métal s'<strong>écrouit</strong> : une pièce mise en forme à froid est plus résistante que le métal de départ, mais moins ductile ; une seconde opération demande plus d'effort, ou un recuit intermédiaire (chapitre <a href="#trtherm/cours">« Traitements thermiques »</a>).</li>
    </ul>
  </div>

  <h3>La déformation plastique conserve le volume</h3>
  <p>La déformation plastique fait glisser les plans d'atomes les uns sur les autres ; elle ne change pratiquement pas le volume du métal (la variation de volume élastique est négligeable devant les déformations de mise en forme). Ce que la pièce gagne dans une direction, elle le perd dans les autres. C'est l'outil de calcul de tout le chapitre : longueur d'un lopin, allongement d'une tôle laminée, diamètre d'un flan.</p>
  <div class="formula" data-nom="Conservation du volume">$$V = S_0\,L_0 = S\,L \quad\text{(déformation plastique)}$$</div>

  <div class="method-box"><strong>Exemple — étirer une barre d'acier doux</strong>
    <p>Une barre d'acier doux (courbe ci-dessus) de diamètre 10 mm et de longueur 100 mm est étirée jusqu'à 5 % d'allongement, où la contrainte vaut environ 340 MPa.</p>
    <ol>
      <li>Retour élastique au relâchement : \(\sigma/E = 340/210\,000 \approx 0{,}16\,\%\), soit 1,6 mm sur une barre d'un mètre ; la barre garde environ 4,84 % d'allongement permanent.</li>
      <li>Le même niveau de contrainte dans un alliage d'aluminium (\(E = 70\) GPa) donnerait un retour trois fois plus grand : 0,49 %. Le retour élastique est un souci majeur de la tôlerie d'aluminium (§8).</li>
      <li>Si l'on étire la barre (plastiquement) jusqu'à 115 mm, le volume se conserve : \(d^2 L = d_0^2 L_0\), donc \(d = 10\sqrt{100/115} \approx 9{,}33\) mm.</li>
      <li>Rechargée, la barre ne se déforme plus plastiquement avant 340 MPa : sa limite d'élasticité est passée de 240 à 340 MPa par écrouissage.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(R_e\) et \(R_m\). On met en forme <strong>au-dessus</strong> de \(R_e\) (sinon rien ne reste) ; on dimensionne une pièce en service <strong>au-dessous</strong> de \(R_e\) (sinon elle se déforme). Et la conservation du volume ne vaut que pour la déformation plastique : elle ne permet pas de calculer une déformation élastique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · À FROID OU À CHAUD</div>
  <h2>Le rôle de la température</h2>
  <div class="intro">La température change tout dans la déformation d'un métal : l'effort nécessaire, la déformation possible, l'écrouissage, la précision et l'état de surface. Le choix « à froid » ou « à chaud » est la première décision d'une gamme de mise en forme.</div>
  <div class="def-box"><strong>Température de recristallisation</strong> \(T_r\) : au-dessus d'elle, les grains déformés se reforment au fur et à mesure (recristallisation) et le métal ne s'écrouit plus. Ordre de grandeur : \(T_r \approx 0{,}4\) à \(0{,}5\,T_f\), en kelvins (\(T_f\) : température de fusion). On travaille <strong>à chaud</strong> au-dessus de \(T_r\), en pratique vers \(0{,}6\) à \(0{,}8\,T_f\), et <strong>à froid</strong> au-dessous, le plus souvent à la température ambiante.</div>
  <table>
    <tr><th>Métal</th><th>\(T_f\)</th><th>\(T_r\) estimée (0,4 à 0,5 \(T_f\))</th><th>Mise en forme à chaud</th></tr>
    <tr><td>acier</td><td>≈ 1 500 °C</td><td>≈ 440 à 610 °C</td><td>forgeage vers 1 100 à 1 250 °C</td></tr>
    <tr><td>alliages d'aluminium</td><td>≈ 660 °C</td><td>≈ 100 à 190 °C (davantage pour les alliages)</td><td>filage et forgeage vers 400 à 500 °C</td></tr>
    <tr><td>cuivre</td><td>≈ 1 085 °C</td><td>≈ 270 à 410 °C</td><td>vers 700 à 900 °C</td></tr>
    <tr><td>plomb</td><td>≈ 327 °C</td><td>≈ −30 à 30 °C</td><td>il recristallise à l'ambiante : il ne s'écrouit pas</td></tr>
  </table>
  <table>
    <tr><th></th><th>À froid</th><th>À chaud</th></tr>
    <tr><td>effort, énergie</td><td>élevés (le métal s'écrouit)</td><td>faibles : la contrainte d'écoulement est 5 à 10 fois plus basse</td></tr>
    <tr><td>déformation possible</td><td>limitée par la ductilité ; recuits intermédiaires</td><td>très grande en une opération</td></tr>
    <tr><td>précision, état de surface</td><td>bons (tolérances de quelques centièmes à quelques dixièmes, surface lisse)</td><td>moyens : dilatation, retrait, <strong>calamine</strong> (couche d'oxyde)</td></tr>
    <tr><td>propriétés obtenues</td><td>métal écroui, plus résistant, moins ductile</td><td>métal non écroui, grains affinés, fibrage</td></tr>
    <tr><td>exemples</td><td>tôles fines, emboutissage, pliage, tréfilage, frappe à froid des têtes de vis</td><td>laminage des brames, forgeage, estampage, filage de l'aluminium</td></tr>
  </table>
  <p>Entre les deux, le travail <strong>à mi-chaud</strong> (vers 600 à 900 °C pour un acier) combine des efforts modérés et une meilleure précision qu'à chaud.</p>
  <div class="method-box"><strong>Exemple — refouler un lopin à froid ou à chaud</strong>
    <p>On écrase (on <strong>refoule</strong>) entre deux outils plans un lopin d'acier de diamètre 30 mm et de hauteur 60 mm, jusqu'à 20 mm de hauteur. Contrainte d'écoulement \(\sigma_{\text{éc}}\) (contrainte nécessaire pour continuer à déformer) : environ 700 MPa à froid après une telle déformation, environ 100 MPa vers 1 150 °C.</p>
    <ol>
      <li>Volume conservé : \(V = \frac{\pi}{4}\,30^2 \times 60 \approx 42\,400\ \text{mm}^3\). En fin de course, la section vaut \(S = V/h = 42\,400/20 \approx 2\,120\ \text{mm}^2\), soit un diamètre d'environ 52 mm.</li>
      <li>Effort, sans frottement : \(F \approx \sigma_{\text{éc}}\,S\). À froid : \(700 \times 2\,120 \approx 1{,}5\ \text{MN}\) (150 tonnes) ; à chaud : \(100 \times 2\,120 \approx 0{,}21\ \text{MN}\) (21 tonnes).</li>
      <li>Le frottement sur les outils freine l'étalement et augmente l'effort, d'autant plus que la pièce est plate : d'environ 17 % ici (coefficient de frottement 0,2), beaucoup plus pour une galette mince.</li>
    </ol>
    <p>Conclusion : la même opération demande une presse sept fois plus puissante à froid. On forge à chaud les grosses déformations, et on réserve le froid aux petites pièces (têtes de vis, rivets) ou aux finitions précises.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que « à chaud » veut dire « près de la fusion ». Le métal reste solide, bien en dessous de \(T_f\) ; trop chaud, il brûle (oxydation aux joints de grains) et devient inutilisable. Autre confusion : « à froid » ne signifie pas « sans échauffement » ; une déformation rapide échauffe le métal, sans dépasser \(T_r\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PIÈCES MASSIVES : FORGEAGE, ESTAMPAGE, MATRIÇAGE</div>
  <h2>Écraser un lopin chaud pour lui donner sa forme</h2>
  <div class="intro">Pour une pièce massive et très sollicitée (bielle, vilebrequin, levier, crochet, clé, moyeu), on part d'un morceau de barre chauffé, le <strong>lopin</strong>, et on le déforme à coups de marteau ou sous presse. Selon que les outils sont plats ou gravés à la forme de la pièce, on parle de forgeage libre ou d'estampage.</div>

  <h3>Forgeage libre</h3>
  <p>Le lopin est déformé entre des <strong>outils plats ou simples</strong> (marteau-pilon, presse), par une suite d'opérations : <strong>étirage</strong> (allonger en réduisant la section), <strong>refoulement</strong> (raccourcir en élargissant), <strong>poinçonnage</strong> (percer), cintrage. Le forgeron (ou le programme de la presse) guide la forme ; aucun outillage propre à la pièce. Domaine : pièces <strong>unitaires ou petites séries</strong>, souvent très grandes (arbres de turbines, couronnes, viroles de plusieurs tonnes), formes simples, fortes surépaisseurs d'usinage.</p>

  <h3>Estampage et matriçage</h3>
  <p>Le lopin chaud est écrasé entre deux <strong>matrices</strong> gravées en creux de la forme de la pièce. Le lopin est volontairement plus volumineux que l'empreinte : l'excès s'échappe au plan de joint et forme une <strong>bavure</strong>, découpée ensuite (ébavurage). Le terme <strong>estampage</strong> s'emploie pour les aciers, <strong>matriçage</strong> pour les alliages non ferreux (aluminium, cuivre, titane) : c'est le même procédé.</p>

  <p>Le <strong>cordon de bavure</strong>, mince, joue un rôle essentiel : en s'y écoulant, le métal se refroidit et frotte, si bien que la pression monte dans l'empreinte et force le métal à en remplir tous les reliefs avant de s'échapper. La bavure représente souvent 10 à 30 % de la masse de la pièce. Une pièce complexe passe par plusieurs empreintes successives (ébauche, finition) sur la même presse.</p>
  <div class="prop-box"><strong>Domaine de l'estampage.</strong> Pièces massives de quelques dizaines de grammes à quelques centaines de kilogrammes, en <strong>grande série</strong> (les matrices, en acier à outils traité, coûtent cher et s'usent), formes déjà proches de la pièce finie, <strong>fibrage</strong> favorable (§4) : bielles, vilebrequins, fusées et triangles de suspension, leviers, clés, outils à main, brides. Précision usuelle IT 12 à 15, \(R_a\) de 6,3 à 25 µm : les surfaces fonctionnelles sont reprises en usinage.</div>
  <div class="method-box"><strong>Exemple — préparer le lopin d'une bielle et choisir la presse</strong>
    <p>Une bielle estampée en acier pèse 1,20 kg. On prévoit 18 % de bavure et 2 % de perte au feu (calamine). Le lopin est débité dans un rond de 40 mm.</p>
    <ol>
      <li>Masse du lopin : \(1{,}20 \times (1 + 0{,}18 + 0{,}02) = 1{,}44\) kg ; volume \(1{,}44/7\,850 \approx 1{,}83\cdot10^{-4}\ \text{m}^3 = 183\ \text{cm}^3\).</li>
      <li>Longueur à débiter : \(183/(\pi \times 2{,}0^2) \approx 14{,}6\) cm.</li>
      <li>Effort de fin de course (ordre de grandeur) : \(F \approx K_p\,\sigma_{\text{éc}}\,S_p\), où \(S_p\) est la surface projetée de la pièce et de sa bavure sur le plan de joint (ici 80 cm²), \(\sigma_{\text{éc}} \approx 100\) MPa à chaud et \(K_p\) un coefficient de 5 à 8 pour une pièce simple avec bavure, qui traduit l'effet du frottement et de la bavure mince. On trouve 4,0 à 6,4 MN, soit 400 à 650 tonnes : on choisit une presse d'environ 800 tonnes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : vouloir un lopin exactement du volume de la pièce. L'empreinte ne se remplirait pas dans ses coins (manque de matière) : c'est l'excès, chassé en bavure, qui garantit le remplissage. Inversement, trop de bavure gaspille du métal et surcharge la presse.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LE FIBRAGE</div>
  <h2>Un atout propre aux pièces déformées</h2>
  <div class="intro">Un métal laminé ou forgé n'est pas homogène à l'échelle du millimètre : ses inclusions et ses grains se sont allongés dans le sens où le métal a coulé. Cette orientation, le fibrage, se voit après attaque chimique d'une coupe ; elle donne à la pièce des propriétés meilleures dans le sens des fibres que dans le sens travers.</div>
  <div class="def-box"><strong>Fibrage</strong> : orientation des grains, des inclusions et des ségrégations du métal selon les lignes d'écoulement de la mise en forme. Les propriétés mécaniques, surtout la ductilité, la résilience et la tenue en <strong>fatigue</strong>, sont meilleures dans le sens des fibres ; une fissure s'amorce plus facilement là où les fibres <strong>débouchent</strong> sur la surface.</div>

<figcaption>Fibrage d'une tige à collerette (coupes longitudinales). (a) Usinée dans une barre de Ø 62 mm, la pièce garde les fibres rectilignes de la barre laminée : elles <strong>débouchent</strong> sur la face d'appui de la collerette et dans le congé, là où la contrainte est la plus forte. (b) Refoulée dans une barre de Ø 25 mm, la matière s'est écoulée en éventail : les fibres <strong>suivent le congé</strong> et ne débouchent qu'en bout de pièce.</figcaption>
</figure>
  <ul>
    <li>Une pièce <strong>usinée dans la masse</strong> garde le fibrage rectiligne de la barre : l'usinage coupe les fibres, qui débouchent sur les surfaces et dans les congés.</li>
    <li>Une pièce <strong>forgée ou estampée</strong> a des fibres qui suivent son contour : elles longent les congés et les surfaces les plus sollicitées. C'est pourquoi les bielles, les vilebrequins, les crochets de levage et les têtes de vis des assemblages critiques sont forgés.</li>
    <li>Une pièce <strong>moulée</strong> n'a pas de fibrage : ses propriétés sont isotropes, mais elle peut contenir des porosités.</li>
    <li>Une <strong>tôle laminée</strong> est fibrée dans le sens de laminage : on la plie de préférence avec la ligne de pli <strong>perpendiculaire</strong> au sens de laminage (§10).</li>
  </ul>
  <div class="method-box"><strong>Exemple — tige à collerette : usiner dans la masse ou refouler ?</strong>
    <p>La tige à collerette de la figure (collerette Ø 60 × 15 mm, tige Ø 25 × 60 mm) a un volume de \(\frac{\pi}{4}(60^2 \times 15 + 25^2 \times 60) \approx 71{,}9\ \text{cm}^3\).</p>
    <ol>
      <li>Usinée dans un rond de Ø 62 mm et de 77 mm de long (surépaisseurs de 1 mm), elle consomme \(\frac{\pi}{4}\,62^2 \times 77 \approx 232\ \text{cm}^3\) : 69 % du métal part en copeaux, et les fibres sont coupées sous la collerette.</li>
      <li>Refoulée à partir d'un rond de Ø 25 mm (la tige garde son diamètre, la collerette brute fait Ø 62 × 17 mm), le brut ne fait que \(\frac{\pi}{4}(62^2 \times 17 + 25^2 \times 60) \approx 80{,}8\ \text{cm}^3\) : 11 % de copeaux, une longueur de lopin de \(80\,800/(\frac{\pi}{4}\,25^2) \approx 165\) mm, et des fibres continues dans le congé.</li>
    </ol>
    <p>Le refoulement économise donc deux tiers de la matière et améliore la tenue en fatigue ; il demande un outillage, que seule une série amortit (§11).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que la forme seule fait la résistance. Deux pièces géométriquement identiques, l'une estampée, l'autre usinée dans la masse, n'ont pas la même durée de vie en fatigue : le fibrage compte, et il se dessine dès le choix du brut.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CONCEVOIR UNE PIÈCE FORGÉE OU ESTAMPÉE</div>
  <h2>Les règles de tracé</h2>
  <div class="intro">Le métal chaud doit pouvoir remplir l'empreinte, puis la pièce doit pouvoir sortir des matrices ; les matrices doivent durer. Ces trois exigences se traduisent par des règles de tracé, voisines de celles du moulage mais avec leurs propres ordres de grandeur.</div>
  <ul>
    <li><strong>Plan de joint</strong> : dans le plan de la plus grande section, plan si possible ; éviter un plan de joint brisé (efforts latéraux sur les matrices) ; placer de part et d'autre des volumes comparables.</li>
    <li><strong>Dépouilles</strong> sur les faces parallèles au sens de démoulage : environ 3 à 7° pour les faces extérieures, 5 à 10° pour les faces intérieures, sur lesquelles la pièce se rétracte en refroidissant ; moins en matriçage des alliages légers et sur presse avec éjecteurs.</li>
    <li><strong>Congés et arrondis généreux</strong> (quelques millimètres au minimum) : ils facilitent l'écoulement, évitent les <strong>replis</strong> (le métal se replie sur lui-même dans un angle vif et laisse une fissure), réduisent l'usure des matrices et les concentrations de contraintes.</li>
    <li><strong>Sections progressives</strong>, sans variation brutale ; pas de nervure haute et mince, pas de voile mince (il refroidit vite au contact des matrices et demande un effort énorme).</li>
    <li><strong>Pas de contre-dépouille</strong> ni de cavité fermée ; les trous traversants sont seulement ébauchés (un voile mince est laissé au fond, puis découpé avec la bavure).</li>
    <li><strong>Surépaisseurs d'usinage</strong> (1,5 à 3 mm environ selon la taille) sur les surfaces fonctionnelles ; précision IT 12 à 15 du brut.</li>
    <li>Une forme <strong>symétrique</strong> et des volumes répartis limitent le nombre d'empreintes d'ébauche.</li>
  </ul>
  <div class="method-box"><strong>Exemple — ce que coûte une dépouille</strong>
    <ol>
      <li>Une face extérieure de 40 mm de haut, dépouillée de 7°, s'écarte de la verticale de \(40\tan 7° \approx 4{,}9\) mm d'un bout à l'autre ; à 3°, de 2,1 mm.</li>
      <li>Si cette face doit être cylindrique (portée de roulement), il faut usiner cette surépaisseur conique en plus de la surépaisseur normale : la dépouille se paie en matière et en temps d'usinage.</li>
      <li>On peut la réduire en plaçant le plan de joint à mi-hauteur de la face (deux demi-faces de 20 mm : 2,5 mm à 7°) ou en estampant sur presse à éjecteurs (dépouille de 3°).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dessiner une pièce estampée comme une pièce usinée (angles vifs, faces sans dépouille, épaisseurs très variables). Le dessin du <strong>brut</strong> est un document à part, avec dépouilles, congés et surépaisseurs ; le dessin de la pièce finie indique seulement les surfaces usinées.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · PRODUITS LONGS ET PLATS : LAMINAGE, FILAGE, TRÉFILAGE</div>
  <h2>Fabriquer tôles, barres, profilés et fils</h2>
  <div class="intro">Avant d'être une pièce, presque tout le métal passe par un procédé de déformation continu qui le transforme en <strong>demi-produit</strong> : tôle, barre, tube, profilé, fil. Le concepteur choisit ces demi-produits sur catalogue ; il doit savoir ce qu'ils permettent et ce qu'ils imposent.</div>

  <h3>Laminage</h3>
  <p>Le métal passe entre deux <strong>cylindres</strong> tournant en sens inverse, qui réduisent son épaisseur. À chaud, les brames de 200 à 250 mm d'épaisseur deviennent des tôles fortes et des bobines de quelques millimètres ; à froid, on descend jusqu'au dixième de millimètre avec une épaisseur précise et une surface lisse (tôles d'emboutissage, emballages). Avec des cylindres <strong>cannelés</strong>, on obtient des barres, des rails, des poutrelles (IPE, HEA), des cornières.</p>

<figcaption>Laminage dessiné à l'échelle : cylindres de rayon \(R = 150\) mm, réduction \(\Delta e = e_1 - e_2 = f^2 R \approx 13{,}5\) mm, la plus forte que le frottement permette d'engager avec un coefficient de frottement \(f = 0{,}3\) (laminage à chaud). L'angle de contact vaut alors \(\alpha \approx 17{,}3°\), et \(\tan\alpha \approx 0{,}31 \approx f\). Le débit de matière se conserve : la bande sort plus vite qu'elle n'entre.</figcaption>
</figure>
  <p>Les cylindres n'entraînent la tôle que par <strong>frottement</strong> : la tôle ne « mord » que si l'angle de contact \(\alpha\) reste inférieur à l'angle de frottement, \(\tan\alpha \le f\). Pour des cylindres de rayon \(R\), cela limite la réduction d'épaisseur par passe :</p>
  <div class="formula" data-nom="Réduction maximale au laminage">$$\Delta e_{\max} \approx f^2\,R$$</div>
  <p>Le débit de métal se conserve (volume constant, largeur à peu près constante) : \(e_1\,v_1 = e_2\,v_2\). La tôle sort plus vite qu'elle n'entre, et dans un train de laminoirs en ligne, chaque cage tourne plus vite que la précédente.</p>
  <div class="method-box"><strong>Exemple — combien de passes ?</strong>
    <ol>
      <li>Cylindres de rayon 250 mm. À chaud, la calamine fait frotter (\(f \approx 0{,}3\)) : \(\Delta e_{\max} \approx 0{,}3^2 \times 250 = 22{,}5\) mm par passe. À froid, lubrifié (\(f \approx 0{,}08\)) : 1,6 mm seulement.</li>
      <li>Une tôle laminée à froid de 6 à 4 mm, entrant à 1 m/s, sort à \(1 \times 6/4 = 1{,}5\) m/s ; à largeur constante, sa longueur est multipliée par 1,5.</li>
      <li>D'où l'organisation de la sidérurgie : les grosses réductions à chaud, les finitions précises à froid, avec des cylindres de petit rayon soutenus par des cylindres d'appui.</li>
    </ol>
  </div>

  <h3>Filage (extrusion)</h3>
  <p>Une <strong>billette</strong> chaude, placée dans un conteneur, est poussée par un piston à travers une <strong>filière</strong> qui a la forme de la section voulue. On obtient en une passe des <strong>profilés de section quelconque mais constante</strong>, même creux (filière à pont), de grande longueur : c'est le procédé roi des alliages d'aluminium (menuiseries, radiateurs, rails de glissière, structures) ; il sert aussi pour le cuivre, le laiton, et l'acier (tubes). Le <strong>rapport de filage</strong> \(S_0/S\) (section de la billette sur section du profilé) vaut couramment 10 à 100.</p>
  <div class="method-box"><strong>Exemple — longueur d'un profilé</strong>
    <p>Une billette d'aluminium de Ø 180 mm et 600 mm de long est filée en un profilé de 600 mm² de section. Rapport de filage : \(\frac{\pi}{4}\,180^2/600 \approx 42\). Le volume se conserve : le profilé mesure \(600 \times 42 \approx 25\) m (moins le culot qui reste dans le conteneur), découpé ensuite en barres.</p>
  </div>

  <h3>Tréfilage et étirage</h3>
  <p>À froid, on <strong>tire</strong> un fil (tréfilage) ou une barre (étirage) à travers une filière qui réduit sa section : fils électriques, ressorts, câbles, rayons de roue, barres calibrées pour le décolletage. Comme on tire sur le produit déjà réduit, sa section doit supporter l'effort : la réduction par passe est limitée à 20 à 40 % de la section environ, et un fil fin passe par une série de filières, avec des recuits quand l'écrouissage devient excessif.</p>
  <div class="method-box"><strong>Exemple — tréfiler un fil de 5 mm à 2 mm</strong>
    <ol>
      <li>Rapport des sections : \((5/2)^2 = 6{,}25\).</li>
      <li>Avec au plus 30 % de réduction de section par passe, chaque passe multiplie la section par au moins 0,7 : il faut \(n\) passes avec \(0{,}7^n \le 1/6{,}25\), soit \(n \ge \ln 6{,}25/\ln(1/0{,}7) \approx 5{,}1\) : six passes (26 % de réduction chacune).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre filage et tréfilage. Au filage, on <strong>pousse</strong> (à chaud, grande réduction en une fois, profilé) ; au tréfilage, on <strong>tire</strong> (à froid, petite réduction par passe, fil). Autre piège : oublier qu'un demi-produit laminé ou étiré est déjà <strong>fibré</strong> et, à froid, <strong>écroui</strong>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DÉCOUPAGE ET POINÇONNAGE</div>
  <h2>Séparer une tôle par cisaillement</h2>
  <div class="intro">Presque toute pièce de tôle commence par un contour découpé : un <strong>flan</strong> à plier ou à emboutir, des trous, des encoches. Le découpage mécanique sépare la tôle par cisaillement entre un poinçon et une matrice : c'est le procédé de très grande série de la tôlerie (rondelles, tôles de moteurs électriques, pièces de serrurerie).</div>
  <p>On parle de <strong>découpage</strong> quand on garde la partie qui sort sous le poinçon (le flan, la rondelle) et de <strong>poinçonnage</strong> quand on garde la tôle percée (la partie chassée, la débouchure, est un déchet).</p>

</figure>
  <ul>
    <li>Le poinçon déforme d'abord la tôle (<strong>bombé</strong>), puis la cisaille sur une partie de l'épaisseur (zone <strong>cisaillée</strong>, lisse), enfin deux fissures partent des arêtes du poinçon et de la matrice et se rejoignent (zone <strong>arrachée</strong>).</li>
    <li>Le <strong>jeu</strong> entre poinçon et matrice, de l'ordre de 5 à 10 % de l'épaisseur par côté pour un acier doux, est choisi pour que les deux fissures se rencontrent : trop faible, il use l'outil et double la zone cisaillée ; trop fort, il donne une grosse bavure et un bord déchiré.</li>
    <li>Le bord découpé n'est ni lisse ni perpendiculaire sur toute l'épaisseur : pour une surface fonctionnelle, on reprend en usinage ou on utilise le <strong>découpage fin</strong> (bord entièrement cisaillé, procédé spécial).</li>
  </ul>
  <p>L'effort de découpage s'estime à partir du périmètre découpé \(p\), de l'épaisseur \(e\) et de la résistance au cisaillement \(R_g\) du métal (\(R_g \approx 0{,}6\) à \(0{,}8\,R_m\) pour les aciers usuels) :</p>
  <div class="formula" data-nom="Effort de découpage">$$F \approx p\,e\,R_g$$</div>
  <div class="method-box"><strong>Exemple — découper une rondelle</strong>
    <p>Rondelle Ø 40 / Ø 20 mm dans une tôle d'acier de 2 mm (\(R_m = 400\) MPa, \(R_g \approx 0{,}8\,R_m = 320\) MPa), contour extérieur et trou découpés d'un seul coup.</p>
    <ol>
      <li>Périmètre découpé : \(p = \pi\,(40 + 20) \approx 188{,}5\) mm.</li>
      <li>Effort : \(F \approx 188{,}5 \times 2 \times 320 \approx 121\ \text{kN}\), soit environ 12 tonnes ; une presse de 20 tonnes convient, avec de la marge.</li>
      <li>Jeu par côté : 5 à 10 % de 2 mm, soit 0,1 à 0,2 mm.</li>
      <li>Pour réduire l'effort, on découpe le trou et le contour à deux postes successifs d'un outil à suivre (80 kN pour le contour seul), ou on affûte le poinçon en biais.</li>
    </ol>
  </div>
  <h3>Imbrication des flans</h3>
  <p>Le prix de la matière pèse lourd en tôlerie de série : on dispose les flans sur la bande pour en perdre le moins possible, en laissant entre eux et au bord un <strong>pont</strong> au moins égal à l'épaisseur. Des disques de Ø 40 mm avec des ponts de 2 mm occupent 71 % de la bande s'ils sont alignés en carré (pas de 42 mm), 82 % s'ils sont disposés en quinconce. Le reste est un déchet (recyclable) : l'imbrication est une règle de conception autant que de fabrication.</p>
  <p>Les <strong>découpes thermiques</strong> (laser, plasma, oxycoupage) et le <strong>jet d'eau</strong>, sans outillage dédié, conviennent aux petites séries et aux tôles épaisses : voir le chapitre <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>, §7.</p>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(R_m\) au lieu de \(R_g\) (ou l'inverse) et la surface de la pièce au lieu de la surface <strong>cisaillée</strong> \(p\,e\). L'effort ne dépend pas de l'aire du flan, mais du contour découpé : une grande rondelle fine se découpe plus facilement qu'un petit trou dans une tôle épaisse.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · LE PLIAGE</div>
  <h2>Plier une tôle le long d'une ligne</h2>
  <div class="intro">Le pliage transforme une tôle découpée en cornière, en U, en boîtier ou en support. C'est le procédé de mise en forme le plus répandu en tôlerie de petite et moyenne série : une presse plieuse et des outils standard suffisent, aucun outillage propre à la pièce.</div>

  <h3>Ce que subit la tôle</h3>
  <p>Dans le pli, les fibres extérieures s'allongent, les fibres intérieures se raccourcissent ; entre les deux, la <strong>fibre neutre</strong> garde sa longueur. Pour un pli de rayon intérieur \(R_i\) dans une tôle d'épaisseur \(e\), la fibre extérieure s'allonge d'environ :</p>
  <div class="formula" data-nom="Allongement de la fibre extérieure d'un pli">$$\varepsilon_{\text{ext}} \approx \frac{e}{2R_i + e}$$</div>
  <p>Plus le pli est serré, plus la fibre extérieure s'allonge : au-delà de la ductilité du métal, elle se fissure. D'où un <strong>rayon intérieur minimal</strong>. En écrivant \(\varepsilon_{\text{ext}} \le A\), on obtient l'estimation prudente \(R_i/e \ge (1/A - 1)/2\) ; en pratique, la fibre extérieure d'un pli supporte un peu plus que l'allongement de l'essai de traction, et l'on retient \(R_i \ge e\) environ pour l'acier doux, 2 à 6 \(e\) pour les alliages d'aluminium durs.</p>
  <h3>Longueur développée</h3>
  <p>Le flan découpé à plat doit avoir la longueur de la fibre neutre : les parties droites, plus l'arc de fibre neutre. Pour un pli de 90°, la fibre neutre est à \(R_i + k\,e\) du centre, avec \(k \approx 0{,}3\) à \(0{,}5\) (plus petit pour un pli serré) :</p>
  <div class="formula" data-nom="Longueur développée d'un pli à 90°">$$L_d = a + b + \frac{\pi}{2}\,(R_i + k\,e)$$</div>
  <div class="method-box"><strong>Exemple — flan d'une cornière pliée</strong>
    <p>Cornière de cotes extérieures 50 × 30 mm, tôle de 2 mm, rayon intérieur 2 mm, \(k = 0{,}4\).</p>
    <ol>
      <li>Parties droites (hors arrondi) : \(a = 50 - (R_i + e) = 46\) mm et \(b = 30 - 4 = 26\) mm.</li>
      <li>Arc de fibre neutre : \(\frac{\pi}{2}\,(2 + 0{,}4 \times 2) \approx 4{,}40\) mm.</li>
      <li>\(L_d \approx 46 + 26 + 4{,}40 = 76{,}4\) mm. La somme des cotes extérieures (80 mm) serait fausse de 3,6 mm ; celle des cotes intérieures (76 mm) de 0,4 mm.</li>
      <li>Fibre extérieure : \(\varepsilon_{\text{ext}} \approx 2/(4 + 2) \approx 33\,\%\) : le pli est serré ; il convient à un acier doux très ductile, pas à un alliage d'aluminium dur.</li>
    </ol>
  </div>
  <h3>Retour élastique</h3>
  <p>Quand le poinçon remonte, la part élastique de la déformation se libère et le pli <strong>s'ouvre</strong> : l'angle augmente et le rayon grandit. Le retour est d'autant plus fort que la limite d'élasticité est haute devant le module (\(R_e/E\) grand) et que le pli est large (\(R_i/e\) grand). On le compense en <strong>surpliant</strong> (la commande numérique de la plieuse corrige la descente du poinçon), ou en <strong>frappant</strong> le pli au fond du vé.</p>

<figcaption>Facteur de retour élastique \(K_s = \theta_f/\theta_i\) (angle de pli après relâchement / angle sous charge), calculé par le modèle du dernier paragraphe (hors programme). Le retour croît avec \(R_i/e\) et avec \(R_e/E\) : faible pour l'acier doux, trois à quatre fois plus fort pour l'aluminium (module trois fois plus petit). Un pli d'aluminium à \(R_i = 10\,e\), fait à 90° sous charge, s'ouvre à environ 82,6°.</figcaption>
</figure>
  <h3>Effort de pliage</h3>
  <p>En pliage en l'air dans un vé d'ouverture \(V\) (en général \(V \approx 8\,e\)), sur une longueur de pli \(L\), on estime l'effort par la formule d'atelier :</p>
  <div class="formula" data-nom="Effort de pliage en V">$$F \approx 1{,}33\,\frac{R_m\,L\,e^2}{V}$$</div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">D'où vient cette formule ?</span><span class="prompt">Une flexion trois points poussée jusqu'à la plastification complète</span><div class="content">
    <p>La tôle repose sur les deux épaules du vé, distantes de \(V\), et le poinçon appuie au milieu : c'est une flexion trois points, dont le moment maximal, au droit du poinçon, vaut \(F\,V/4\). Pour que la section se plie plastiquement sur toute l'épaisseur, il faut que ce moment atteigne le moment de plastification complète d'une section rectangulaire \(L \times e\), \(M_p = \sigma\,L\,e^2/4\) (une moitié de la section en traction à la contrainte \(\sigma\), l'autre en compression, bras de levier \(e/2\)). D'où \(F = \sigma\,L\,e^2/V\). Le coefficient 1,33 (avec \(\sigma = R_m\)) est empirique : il tient compte de l'écrouissage, du frottement sur les épaules et du rayon du poinçon.</p>
  </div></div>
  <div class="method-box"><strong>Exemple — choisir une presse plieuse</strong>
    <ol>
      <li>Pli de 2 m dans une tôle d'acier de 3 mm (\(R_m = 400\) MPa), vé de \(V = 8 \times 3 = 24\) mm : \(F \approx 1{,}33 \times 400 \times 2\,000 \times 9/24 \approx 400\ \text{kN}\), soit environ 41 tonnes.</li>
      <li>À épaisseur doublée (6 mm, vé de 48 mm), \(e^2/V\) double : 800 kN. L'effort croît vite avec l'épaisseur.</li>
      <li>Le même pli à 90° dans un alliage d'aluminium (\(R_i = 10\,e\)) revient à environ 82,6° : il faut le plier à environ 98° sous charge (figure ci-dessus).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : calculer le flan avec les cotes extérieures, ou oublier le retour élastique. Les deux erreurs ont le même effet : une pièce hors tolérance. On mesure \(k\) et le retour sur une pièce d'essai, et la plieuse les corrige ensuite.</div>
</div>

  <h2>Transformer une tôle plane en pièce creuse</h2>
  <div class="intro">Une canette, un évier, une aile de voiture, un carter de compresseur, une casserole : une pièce creuse sans soudure, mince et légère, obtenue en quelques secondes à partir d'un flan plat. L'emboutissage est le procédé de la très grande série en tôle mince.</div>

  <h3>L'outillage et le déroulement</h3>
  <ul>
    <li>Le <strong>poinçon</strong> enfonce la tôle et donne la forme intérieure ; la <strong>matrice</strong> donne la forme extérieure, avec un rayon d'entrée \(r_m\) (quelques épaisseurs) sur lequel la tôle glisse.</li>
    <li>Le <strong>serre-flan</strong> presse la partie encore plane du flan (la couronne) contre la matrice. En s'avalant vers l'axe, la couronne voit son périmètre diminuer : elle est comprimée tangentiellement et tend à onduler. Le serre-flan empêche ces plis, sans bloquer la tôle.</li>
    <li>La paroi transmet l'effort du poinçon à la couronne ; elle est tendue et s'amincit, surtout près du rayon du fond.</li>
  </ul>
  <div class="prop-box"><strong>Deux défauts antagonistes.</strong> Serre-flan trop peu serré, ou flan trop grand pour un serre-flan donné : la couronne <strong>plisse</strong>. Serre-flan trop serré, ou déformation trop forte : l'effort transmis par la paroi dépasse ce qu'elle supporte et le fond se <strong>déchire</strong> (rupture près du rayon du poinçon). Le réglage du serre-flan, la lubrification et la forme du flan arbitrent entre les deux.</div>
  <h3>Diamètre du flan et rapport d'emboutissage</h3>
  <p>L'épaisseur variant peu (amincissement de la paroi d'un côté, épaississement du haut de la couronne de l'autre), on dimensionne le flan par <strong>conservation de la surface</strong>. Pour un godet cylindrique à fond plat, de diamètre \(d\) et de hauteur \(h\) (rayons négligés) :</p>
  <div class="formula" data-nom="Flan d'un godet cylindrique">$$\frac{\pi D_0^2}{4} = \frac{\pi d^2}{4} + \pi\,d\,h \quad\Longrightarrow\quad D_0 = \sqrt{d^2 + 4\,d\,h}$$</div>
  <p>La difficulté se mesure au <strong>rapport d'emboutissage</strong> \(\beta = D_0/d\). Plus il est grand, plus la couronne à avaler est large et plus l'effort qu'elle oppose est grand ; or cet effort passe par la paroi, de section \(\pi\,d\,e\), qui ne peut transmettre plus de \(\pi\,d\,e\,R_m\) environ. En première passe, \(\beta\) est donc limité à environ 1,8 à 2,2 pour un acier doux d'emboutissage, moins pour l'aluminium ; aux passes suivantes (ré-emboutissage d'un godet), à 1,2 ou 1,3.</p>
  <div class="formula" data-nom="Rapport d'emboutissage">$$\beta = \frac{D_0}{d} \le \beta_{\lim} \approx 2 \quad\text{(1ʳᵉ passe)}$$</div>

  <div class="method-box"><strong>Exemple — une ou plusieurs passes ?</strong>
    <ol>
      <li>Godet Ø 50 × 30 mm : \(D_0 = \sqrt{50^2 + 4 \times 50 \times 30} = \sqrt{8\,500} \approx 92{,}2\) mm, \(\beta \approx 1{,}84\) : une passe suffit.</li>
      <li>Godet Ø 40 × 80 mm : \(D_0 = \sqrt{1\,600 + 12\,800} = 120\) mm, \(\beta = 3\) : impossible en une passe. Première passe à \(\beta_1 = 1{,}9\) : \(d_1 = 120/1{,}9 \approx 63\) mm ; puis \(\beta = 1{,}25\) : \(d_2 \approx 50\) mm, \(d_3 \approx 40\) mm. Trois passes, aux hauteurs \(h = (D_0^2 - d^2)/(4d)\) : 41, 60 et 80 mm.</li>
      <li>Effort maximal du godet Ø 50 en tôle de 1 mm (\(R_m = 350\) MPa) : au plus \(\pi \times 50 \times 1 \times 350 \approx 55\ \text{kN}\). Serre-flan : pression de l'ordre de 2,5 MPa sur la couronne initiale (de Ø 92 à Ø 64 environ, soit 3 460 mm²) : environ 9 kN.</li>
    </ol>
  </div>
  <p>Après emboutissage, le bord est irrégulier (les <strong>cornes d'emboutissage</strong> trahissent l'anisotropie de la tôle laminée) : on le <strong>détoure</strong> par découpage. Les pièces de carrosserie, non axisymétriques, sont embouties dans des outils de grandes dimensions sur des lignes de presses, avec des joncs de retenue qui règlent localement l'avalement.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'on peut emboutir n'importe quelle profondeur en une fois en serrant plus fort. Serrer plus fort supprime les plis mais augmente l'effort dans la paroi : on déchire le fond. Un godet profond se fait en plusieurs passes, avec parfois un recuit intermédiaire (écrouissage).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · CONCEVOIR UNE PIÈCE EN TÔLE</div>
  <h2>Les règles de tracé de la tôlerie</h2>
  <div class="intro">Une pièce en tôle se conçoit en pensant à son flan, à ses plis et à son outillage. Les règles ci-dessous découlent directement des phénomènes des §7 à §9 ; leurs valeurs sont des ordres de grandeur, à confirmer avec le fabricant.</div>
  <h3>Découpage</h3>
  <ul>
    <li>Diamètre de trou au moins égal à l'épaisseur (environ 1 à 1,5 \(e\) pour un acier) : un poinçon plus fin que la tôle flambe ou casse.</li>
    <li>Distance d'un trou au bord, et entre deux trous, d'au moins 1 à 2 \(e\) : sinon le pont se déforme ou se déchire.</li>
    <li>Angles du contour arrondis (rayon d'au moins \(e/2\)) ; pas de languette étroite et longue.</li>
    <li>Contour qui s'imbrique bien sur la bande (§7).</li>
  </ul>
  <h3>Pliage</h3>
  <ul>
    <li>Rayon intérieur au moins égal à l'épaisseur (davantage pour les alliages durs), <strong>le même pour tous les plis</strong> de la pièce (un seul outil).</li>
    <li>Ligne de pli perpendiculaire (ou oblique) au sens de laminage : le pli parallèle aux fibres se fissure plus facilement.</li>
    <li>Trou éloigné du pli d'au moins \(R_i + 2\,e\) environ : plus près, il s'ovalise.</li>
    <li>Bord plié assez long pour porter sur les deux épaules du vé : au moins 4 à 6 \(e\) environ.</li>
    <li><strong>Dégagements</strong> (petites entailles de décharge) là où un pli s'arrête contre un bord ou rencontre un autre pli, pour que la tôle ne se déchire pas.</li>
    <li>Ordre des plis réalisable : chaque pli doit laisser passer le poinçon pour les suivants.</li>
  </ul>
  <h3>Emboutissage</h3>
  <ul>
    <li>Formes de révolution ou très arrondies, profondeur modérée (\(\beta\) admissible, sinon plusieurs passes et un outillage plus cher).</li>
    <li>Rayons de matrice et de poinçon de plusieurs épaisseurs (environ 4 à 10 \(e\) pour la matrice) ; coins de boîtes rectangulaires à grand rayon.</li>
    <li>Pas de paroi parfaitement verticale si la pièce doit sortir facilement ; épaisseur non constante à prévoir (amincissement de 10 à 20 % aux rayons).</li>
    <li>Bord libre irrégulier : prévoir un détourage, donc une surlongueur.</li>
  </ul>
  <h3>Rigidifier par la forme</h3>
  <p>Une tôle plane est très souple en flexion. Plutôt que d'augmenter l'épaisseur, on lui donne de la <strong>forme</strong> : bords tombés, nervures embouties, galbe. La rigidité en flexion d'une section est proportionnelle à son moment quadratique, qui croît comme le carré de la distance de la matière au plan moyen.</p>
  <div class="method-box"><strong>Exemple — tomber deux bords</strong>
    <p>Une bande de tôle de 1 mm d'épaisseur et de 100 mm de large a un moment quadratique de \(100 \times 1^3/12 \approx 8{,}3\ \text{mm}^4\) (flexion autour de son plan moyen).</p>
    <ol>
      <li>En pliant deux bords de 10 mm (section en U de 100 mm hors tout), le moment quadratique passe à environ 511 mm⁴ : la bande est 61 fois plus rigide, pour 18 % de matière en plus.</li>
      <li>Pour obtenir la même rigidité avec une tôle plane, il faudrait une épaisseur de \(\sqrt[3]{12 \times 511/100} \approx 3{,}9\) mm : presque quatre fois la masse.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : dessiner une pièce de tôlerie comme une pièce usinée, avec des angles vifs, des épaisseurs variables, des trous au ras des plis. Une pièce en tôle a une <strong>épaisseur constante</strong> (celle de la tôle, sauf emboutissage) et des plis arrondis ; son modèle se conçoit avec un module de tôlerie du modeleur 3D, qui calcule le développé.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · CHOISIR UN PROCÉDÉ DE DÉFORMATION</div>
  <h2>Critères de choix, coût et environnement</h2>
  <div class="intro">Pour une pièce métallique donnée, plusieurs voies sont souvent possibles : usiner dans la masse, mouler, forger, assembler des tôles. Le programme demande de les départager par la forme du produit, le matériau, les coûts, la taille de série et l'impact environnemental.</div>
  <table>
    <tr><th>Procédé</th><th>Pièces typiques</th><th>Série</th><th>Précision du brut</th><th>Atouts · limites</th></tr>
    <tr><td>forgeage libre</td><td>grandes pièces massives, arbres, anneaux</td><td>unitaire, petite</td><td>faible (forte surépaisseur)</td><td>sans outillage, fibrage · beaucoup d'usinage</td></tr>
    <tr><td>estampage, matriçage</td><td>bielles, leviers, moyeux, clés</td><td>grande</td><td>IT 12 à 15</td><td>fibrage, peu de matière perdue · matrices coûteuses</td></tr>
    <tr><td>laminage, filage, tréfilage</td><td>demi-produits : tôles, barres, profilés, fils</td><td>continue</td><td>bonne à froid</td><td>achetés sur catalogue · section constante</td></tr>
    <tr><td>découpage-poinçonnage</td><td>flans, rondelles, tôles percées</td><td>moyenne à très grande</td><td>quelques dixièmes</td><td>très rapide · outil dédié, bord à reprendre si fonctionnel</td></tr>
    <tr><td>pliage</td><td>cornières, supports, boîtiers</td><td>unitaire à moyenne</td><td>quelques dixièmes par pli</td><td>outils standard · formes développables seulement</td></tr>
    <tr><td>emboutissage</td><td>pièces creuses minces : carrosserie, carters, ustensiles</td><td>grande à très grande</td><td>bonne</td><td>formes gauches, légèreté · outillage très coûteux</td></tr>
  </table>
  <h3>Le coût et la taille de série</h3>
  <p>Comme pour tous les procédés, on sépare un coût fixe \(C_o\) (outillage, programmation, réglage), réparti sur les \(N\) pièces, et un coût variable \(C_v\) par pièce (matière, temps machine, énergie) :</p>
  <div class="formula" data-nom="Coût unitaire">$$C_u(N) = C_v + \frac{C_o}{N} \qquad N^* = \frac{C_{o2} - C_{o1}}{C_{v1} - C_{v2}}$$</div>
  <p>Au-delà du seuil \(N^*\), le procédé le plus outillé (2) devient le moins cher. Mêmes notations que dans <a href="#moulage/cours">« Moulage »</a> et <a href="#ppm/cours">« Triptyque produit–procédé–matériau »</a>.</p>
  <div class="method-box"><strong>Exemple — un support en tôle : découpe laser et pliage, ou outil à suivre ?</strong>
    <p>Découpe laser puis pliage sur plieuse à commande numérique : \(C_o = 300\) € (programmation), \(C_v = 6{,}50\) €. Outil à suivre sur presse (découpe, poinçonnage et pliage en une frappe par pièce) : \(C_o = 45\,000\) €, \(C_v = 0{,}40\) €.</p>
    <ol>
      <li>Seuil : \(N^* = (45\,000 - 300)/(6{,}50 - 0{,}40) \approx 7\,300\) pièces.</li>
      <li>2 000 pièces : 6,65 € (laser et pliage) contre 22,90 € (outil à suivre) ; 20 000 pièces : 6,51 € contre 2,65 €.</li>
      <li>Même logique pour une bielle : usinée dans la masse à 38 € pièce, ou estampée (matrices 40 000 €, 3 € la pièce) : l'estampage l'emporte au-delà de \(40\,000/35 \approx 1\,140\) bielles, et il donne de surcroît un meilleur fibrage.</li>
    </ol>
  </div>
  <h3>Environnement</h3>
  <ul>
    <li><strong>Matière</strong> : les procédés de déformation sont proches de la forme finale (« near net shape ») ; ils perdent peu de métal (bavure, chutes de découpe, recyclables) face à l'usinage dans la masse (§4 : 11 % contre 69 % de copeaux). Économiser de la matière, c'est économiser son énergie grise.</li>
    <li><strong>Énergie du procédé</strong> : le chauffage des lopins (forgeage) et des billettes (filage) est le principal poste ; le travail à froid évite ce chauffage mais demande des efforts plus grands et parfois des recuits.</li>
    <li><strong>Allègement</strong> : une pièce en tôle rigidifiée par sa forme (§10) ou une pièce forgée bien fibrée est plus légère à performance égale ; sur un véhicule, l'allègement réduit surtout la consommation en usage.</li>
    <li><strong>Fin de vie</strong> : les métaux mis en forme par déformation (aciers, alliages d'aluminium et de cuivre) se recyclent très bien s'ils ne sont pas associés à d'autres matériaux.</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : comparer des procédés sur le seul coût variable. Un outil à suivre ou une matrice d'estampage n'est rentable qu'au-delà de quelques milliers de pièces ; en dessous, la découpe laser, le pliage, le forgeage libre ou l'usinage gagnent. Inversement, usiner 100 000 bielles dans la masse serait un non-sens économique et environnemental.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Quelques modèles et procédés de plus</h2>
  <div class="intro">Pour la culture et les travaux pratiques ; aucune de ces relations n'est exigible.</div>
  <h3>Déformations vraies</h3>
  <p>Pour les grandes déformations, on additionne des allongements relatifs infinitésimaux : la <strong>déformation vraie</strong> vaut \(\varepsilon_v = \ln(L/L_0)\). Elle est additive d'une passe à l'autre, et la conservation du volume s'écrit simplement \(\varepsilon_1 + \varepsilon_2 + \varepsilon_3 = 0\) dans trois directions orthogonales. Par exemple, une tôle laminée de 6 à 4 mm à largeur constante a \(\varepsilon_3 = \ln(4/6) \approx -0{,}405\) dans l'épaisseur et \(\varepsilon_1 \approx +0{,}405\) en longueur.</p>
  <h3>Limite théorique du tréfilage</h3>
  <p>Sans frottement ni écrouissage, la contrainte de tirage vaut \(\sigma_{\text{éc}}\,\ln(S_0/S)\) ; elle doit rester inférieure à \(\sigma_{\text{éc}}\), que supporte le fil sorti : \(\ln(S_0/S) \lt 1\), soit une réduction de section inférieure à \(1 - 1/\mathrm{e} \approx 63\,\%\). Le frottement dans la filière ramène cette limite vers 30 à 40 %.</p>
  <h3>Modèle du retour élastique</h3>
  <p>Pour un métal élastique parfaitement plastique (limite \(R_e\), module \(E\)) plié en flexion pure, le rayon intérieur \(R_f\) après relâchement est donné par \(R_i/R_f = 4x^3 - 3x + 1\), avec \(x = R_i R_e/(E\,e)\) ; l'angle se déduit de la conservation de la longueur de la fibre moyenne : \(\theta_f/\theta_i = (R_i + e/2)/(R_f + e/2)\). C'est la relation qui a servi à tracer la figure du §8.</p>
  <h3>Autres procédés</h3>
  <ul>
    <li><strong>Hydroformage</strong> : un tube ou une tôle est plaqué contre une matrice par un liquide sous très haute pression (berceaux et longerons automobiles, raccords).</li>
    <li><strong>Repoussage</strong> et fluotournage : une tôle en rotation est rabattue sur un mandrin par une molette (ustensiles, réflecteurs, ogives).</li>
    <li><strong>Formage incrémental</strong> : un poinçon piloté par une commande numérique déforme la tôle point par point, sans matrice (prototypes, petites séries).</li>
    <li><strong>Formage superplastique</strong> : certains alliages de titane et d'aluminium, à grain très fin et à chaud, s'allongent de plusieurs centaines de pour cent sous faible effort (pièces aéronautiques).</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="def-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · DÉFORMATION</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à reconnaître et à justifier un procédé de déformation, à exploiter la conservation du volume et l'essai de traction, et à chiffrer les ordres de grandeur (efforts, flans, passes, coûts) qui fondent les règles de conception. Tout le chapitre est au programme de 2ᵉ année (S3), vu ici en avance ; les relations d'effort ne sont pas exigibles et seraient fournies par un sujet.</div>

  <div class="method-box"><strong>Méthode 1 — Identifier la famille de procédé</strong>
    <ol>
      <li>Regarder la <strong>forme</strong> : pièce massive et pleine (forgeage, estampage), produit de section constante (laminage, filage, tréfilage : demi-produit acheté), pièce d'épaisseur constante (tôlerie : découpage, pliage, emboutissage).</li>
      <li>Pour une pièce en tôle, distinguer une forme <strong>développable</strong> (plis rectilignes : pliage) d'une forme <strong>creuse ou gauche</strong> (emboutissage).</li>
      <li>Situer la <strong>série</strong> : unitaire ou petite (forgeage libre, découpe laser et pliage), grande (estampage, outil à suivre, emboutissage).</li>
      <li>Vérifier les <strong>indices</strong> sur la pièce : bavure découpée et dépouilles (estampage), épaisseur constante et plis arrondis (tôlerie), stries longitudinales (filage), bord cisaillé à zones lisse et arrachée (découpage).</li>
    </ol>
    <p><em>Exemple éclair :</em> une clé plate en acier, 50 000 par an : estampage ; un support de capteur en tôle de 2 mm, 200 pièces : découpe laser puis pliage ; le cadre d'une baie vitrée en aluminium : profilés filés ; un arbre de turbine de 3 tonnes : forgeage libre.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Choisir entre travail à froid et à chaud</strong>
    <ol>
      <li>Estimer la température de recristallisation \(T_r \approx 0{,}4\) à \(0{,}5\,T_f\), en kelvins.</li>
      <li>Grande déformation, pièce volumineuse, effort à limiter : <strong>à chaud</strong> (au-dessus de \(T_r\), vers 0,6 à 0,8 \(T_f\)).</li>
      <li>Précision, bel état de surface, petite pièce, métal à durcir par écrouissage : <strong>à froid</strong>.</li>
      <li>Se souvenir des contreparties : calamine et retrait à chaud ; écrouissage, efforts élevés, recuits intermédiaires à froid.</li>
    </ol>
    <p><em>Exemple éclair :</em> le cuivre fond à 1 085 °C (1 358 K) : \(T_r \approx 270\) à 410 °C. Un fil de cuivre tréfilé à l'ambiante s'écrouit et durcit ; on le recuit pour retrouver un fil souple. Un rivet d'aluminium est refoulé à froid ; une couronne d'acier de 2 m est forgée à chaud.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Exploiter la conservation du volume</strong>
    <ol>
      <li>Écrire le volume de la pièce (ou du brut, avec ses surépaisseurs), en ajoutant ce qui part en <strong>bavure</strong>, en chutes ou en calamine.</li>
      <li>Égaler ce volume à celui du lopin ou du demi-produit de départ : \(S_0 L_0 = S\,L\).</li>
      <li>En déduire la dimension inconnue (longueur de lopin, allongement d'une tôle, longueur d'un profilé).</li>
      <li>Ne l'appliquer qu'à la déformation <strong>plastique</strong> (pas au retour élastique) et vérifier l'ordre de grandeur.</li>
    </ol>
    <p><em>Exemple éclair :</em> une pièce matricée en alliage d'aluminium de 0,85 kg, avec 20 % de bavure, demande \(0{,}85 \times 1{,}2/2\,700 \approx 378\ \text{cm}^3\) de métal, soit 19,2 cm d'un rond de Ø 50 mm. Une tôle laminée de 3 à 0,8 mm, à largeur constante, s'allonge d'un facteur 3,75.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Lire une courbe de traction pour la mise en forme</strong>
    <ol>
      <li>Repérer \(R_e\) (début de la déformation permanente), \(R_m\) (maximum) et \(A\) (allongement à rupture, ductilité).</li>
      <li>Aptitude à la mise en forme : grande plage entre \(R_e\) et \(R_m\) et grand \(A\) (tôles d'emboutissage) ; un métal peu ductile se plie à grand rayon et s'emboutit mal.</li>
      <li>Retour élastique : la déformation récupérée vaut \(\sigma/E\) ; il est d'autant plus fort que \(R_e/E\) est grand.</li>
      <li>Écrouissage : après une déformation plastique jusqu'à \(\sigma\), la nouvelle limite d'élasticité vaut \(\sigma\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une tôle d'aluminium déformée sous 200 MPa récupère \(200/70\,000 \approx 0{,}29\,\%\) au relâchement, une tôle d'acier sous la même contrainte \(0{,}095\,\%\) : trois fois moins, d'où des pièces d'aluminium plus difficiles à tenir en cote.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Dessiner le brut d'une pièce estampée</strong>
    <ol>
      <li>Placer le <strong>plan de joint</strong> dans la plus grande section, plan si possible, avec des volumes comparables de part et d'autre.</li>
      <li>Ajouter les <strong>surépaisseurs d'usinage</strong> (1,5 à 3 mm) sur les surfaces fonctionnelles.</li>
      <li>Donner des <strong>dépouilles</strong> (3 à 7° à l'extérieur, 5 à 10° à l'intérieur) et des <strong>congés</strong> partout ; supprimer contre-dépouilles et cavités fermées.</li>
      <li>Remplacer les voiles et nervures trop minces, adoucir les variations de section.</li>
      <li>Prévoir la bavure (10 à 30 % de la masse) dans le volume du lopin.</li>
    </ol>
    <p><em>Exemple éclair :</em> un moyeu dont une face extérieure de 30 mm de haut reçoit une dépouille de 5° : écart de \(30\tan 5° \approx 2{,}6\) mm d'un bout à l'autre, à ajouter à la surépaisseur si cette face doit être usinée cylindrique.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier que le brut et la pièce finie sont deux dessins différents. Une cote de la pièce finie se prend sur une surface usinée ; une surface brute (dépouillée, calaminée) ne sert pas de référence précise.</div>

  <div class="method-box"><strong>Méthode 6 — Estimer un effort de découpage et vérifier les règles de découpe</strong>
    <ol>
      <li>Calculer le <strong>périmètre</strong> découpé \(p\) d'un coup de presse (contour et trous frappés ensemble).</li>
      <li>Prendre \(R_g \approx 0{,}6\) à \(0{,}8\,R_m\) et calculer \(F \approx p\,e\,R_g\) ; choisir une presse avec de la marge.</li>
      <li>Jeu poinçon–matrice : environ 5 à 10 % de l'épaisseur par côté.</li>
      <li>Vérifier : trous de diamètre au moins égal à \(e\), distances au bord et entre trous d'au moins 1 à 2 \(e\), angles arrondis.</li>
    </ol>
    <p><em>Exemple éclair :</em> un trou Ø 10 mm dans une tôle d'inox de 3 mm (\(R_m = 600\) MPa, \(R_g \approx 480\) MPa) : \(F \approx \pi \times 10 \times 3 \times 480 \approx 45\ \text{kN}\) ; jeu de 0,15 à 0,3 mm par côté ; le diamètre (10 mm) dépasse bien l'épaisseur.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Calculer le flan d'une pièce pliée</strong>
    <ol>
      <li>Décomposer la pièce en parties droites et en plis ; mesurer les parties droites <strong>hors arrondis</strong> (cote extérieure moins \(R_i + e\) à chaque pli).</li>
      <li>Pour chaque pli de 90°, ajouter l'arc de fibre neutre \(\frac{\pi}{2}(R_i + k\,e)\), avec \(k \approx 0{,}3\) à 0,5 (donné ou mesuré).</li>
      <li>Additionner : c'est la longueur du flan à découper.</li>
      <li>Vérifier le rayon : \(R_i\) au moins égal à \(e\) pour un acier doux, davantage pour un alliage dur ; même rayon pour tous les plis.</li>
    </ol>
    <p><em>Exemple éclair :</em> un U de cotes extérieures 40 × 60 × 40 mm en tôle de 1,5 mm, \(R_i = 1{,}5\) mm, \(k = 0{,}4\) : parties droites 37, 54 et 37 mm, deux arcs de \(\frac{\pi}{2}(1{,}5 + 0{,}6) \approx 3{,}30\) mm, flan de 134,6 mm.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Préparer un pliage : effort et retour élastique</strong>
    <ol>
      <li>Choisir l'ouverture du vé, en général \(V \approx 8\,e\).</li>
      <li>Estimer l'effort \(F \approx 1{,}33\,R_m L e^2/V\) et le comparer à la capacité de la plieuse.</li>
      <li>Évaluer le retour élastique (abaque ou essai) : il croît avec \(R_e/E\) et avec \(R_i/e\).</li>
      <li>Compenser en surpliant de l'angle de retour, ou en frappant le pli.</li>
    </ol>
    <p><em>Exemple éclair :</em> pli de 1,2 m dans un inox de 2 mm (\(R_m = 600\) MPa, \(V = 16\) mm) : \(F \approx 1{,}33 \times 600 \times 1\,200 \times 4/16 \approx 240\ \text{kN}\) (24 tonnes). Un pli d'aluminium à \(R_i = 5\,e\), voulu à 90°, se plie à environ 93,7° (facteur de retour 0,96).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Dimensionner le flan et les passes d'un emboutissage</strong>
    <ol>
      <li>Écrire la conservation de la surface (épaisseur supposée constante) ; pour un godet cylindrique à fond plat, \(D_0 = \sqrt{d^2 + 4\,d\,h}\).</li>
      <li>Calculer \(\beta = D_0/d\) et le comparer au rapport limite : environ 2 en première passe, 1,2 à 1,3 aux passes suivantes.</li>
      <li>Si \(\beta\) dépasse la limite, choisir les diamètres intermédiaires \(d_1 = D_0/\beta_1\), \(d_2 = d_1/\beta_2\)… jusqu'à \(d\) ; les hauteurs suivent de \(h = (D_0^2 - d^2)/(4d)\).</li>
      <li>Estimer l'effort (au plus \(\pi\,d\,e\,R_m\)) et prévoir un détourage du bord.</li>
    </ol>
    <p><em>Exemple éclair :</em> godet Ø 60 × 45 mm : \(D_0 = \sqrt{3\,600 + 10\,800} = 120\) mm, \(\beta = 2\), à la limite : deux passes sont plus sûres, \(d_1 = 120/1{,}8 \approx 66{,}7\) mm (hauteur 37,3 mm), puis \(\beta_2 = 66{,}7/60 \approx 1{,}11\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer la conservation du <strong>volume</strong> à une tôle emboutie en oubliant que c'est la <strong>surface</strong> qu'on égale (à épaisseur constante). Les deux reviennent au même, mais seulement si l'on garde la même épaisseur ; comparer une aire à un volume est une erreur d'homogénéité.</div>

  <div class="method-box"><strong>Méthode 10 — Comparer deux procédés par le coût</strong>
    <ol>
      <li>Pour chaque procédé, séparer le coût fixe \(C_o\) (outillage, programmation) du coût variable \(C_v\) par pièce.</li>
      <li>Calculer le seuil \(N^* = (C_{o2} - C_{o1})/(C_{v1} - C_{v2})\) et le comparer à la série prévue.</li>
      <li>Compléter par les critères non économiques : fibrage, précision, délai (un outillage se fabrique en plusieurs semaines), matière perdue et énergie.</li>
    </ol>
    <p><em>Exemple éclair :</em> des rondelles découpées au laser (\(C_v = 0{,}90\) €, sans outillage) ou sur un outil de découpage (\(C_o = 6\,000\) €, \(C_v = 0{,}03\) €) : \(N^* = 6\,000/0{,}87 \approx 6\,900\) rondelles. Pour 500 rondelles de prototype, le laser ; pour 100 000 par an, l'outil.</p>
  </div>
</div>

  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>À froid ou à chaud ?</h3>
  <div class="statement">On compare la mise en forme d'un métal à froid et à chaud.</div>
  <div class="q"><strong>Q1.</strong> Citer un avantage et un inconvénient du travail à froid.</div>
  <div class="q"><strong>Q2.</strong> Pourquoi forge-t-on l'acier à chaud pour de grandes déformations ?</div>
  <div class="q"><strong>Q3.</strong> Le plomb fond à 327 °C. Un tuyau de plomb martelé à 20 °C durcit-il ? Justifier avec l'ordre de grandeur de la température de recristallisation.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avantage : bon état de surface et précision ; inconvénient : écrouissage et efforts élevés (ductilité limitée, recuits intermédiaires).</p>
    <p><strong>Q2.</strong> Au-dessus de la température de recristallisation, la contrainte d'écoulement est 5 à 10 fois plus faible et le métal ne s'écrouit pas : il supporte de grandes déformations sans se fissurer, avec des presses beaucoup moins puissantes.</p>
    <p><strong>Q3.</strong> \(T_f = 327\) °C, soit 600 K ; \(T_r \approx 0{,}4\) à \(0{,}5\,T_f\), soit 240 à 300 K, c'est-à-dire −33 à 27 °C. À 20 °C, le plomb est au niveau de sa température de recristallisation : ses grains se reforment à mesure qu'on le déforme, il ne s'écrouit pas et reste malléable. Pour lui, l'ambiante est déjà « à chaud ».</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Choisir le procédé</h3>
  <div class="statement">Proposer un procédé de mise en forme par déformation adapté, en justifiant.</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(N^* = (30\,000 - 500)/(24 - 4{,}50) \approx 1\,510\) bielles.</p>
    <p><strong>Q2.</strong> Série totale : 4 000 bielles, au-delà du seuil. Usinage : \(24 + 500/4\,000 \approx 24{,}13\) € ; estampage : \(4{,}50 + 30\,000/4\,000 = 12{,}00\) €. L'estampage coûte deux fois moins.</p>
    <p><strong>Q3.</strong> Usinage : \(1 - 0{,}9/3{,}1 \approx 71\,\%\) de la matière en copeaux ; estampage : \(1 - 0{,}9/1{,}1 \approx 18\,\%\) (bavure et usinage). Autre argument : le fibrage de la bielle estampée suit son contour, ce qui améliore sa tenue en fatigue, essentielle pour une pièce chargée à chaque tour.</p>
    <p><strong>Q4.</strong> 20 bielles sont loin du seuil : coût de l'estampage \(4{,}50 + 30\,000/20 = 1\,504{,}50\) € la pièce, contre 49 € en usinage. On usine les prototypes dans la masse (en contrôlant leur tenue en fatigue), et l'on estampe la série.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Corps de filtre à huile : un bol embouti et sa patte pliée</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème : industrialisation de pièces de tôlerie). Pour t'entraîner sur les sujets réels :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un équipementier produit 400 000 filtres à huile par an. Le <strong>corps</strong> du filtre est un bol cylindrique à fond plat de diamètre \(d = 76\) mm et de hauteur \(h = 90\) mm (rayons négligés), embouti dans une tôle d'acier d'emboutissage de 0,6 mm (\(R_m = 300\) MPa, \(A = 40\,\%\)). Une <strong>patte de fixation</strong> en L, soudée ensuite sur le bol, est pliée dans une tôle d'acier de 2 mm (\(R_m = 400\) MPa, \(A = 30\,\%\)) : ailes de cotes extérieures 40 mm et 25 mm, largeur 30 mm, rayon intérieur 2 mm, \(k = 0{,}4\), un trou de Ø 8 mm dans l'aile de 25 mm.
    <br>Données : rapports d'emboutissage limites 1,9 (1ʳᵉ passe) et 1,3 (passes suivantes) ; pression de serre-flan 2,5 MPa ; rayon d'entrée de la matrice \(6\,e\) ; effort de pliage en V \(F \approx 1{,}33\,R_m L e^2/V\) avec \(V = 8\,e\) ; effort de découpage \(F \approx p\,e\,R_g\) avec \(R_g = 0{,}8\,R_m\).
  </div>

  <p class="exo-part">Partie A — Emboutissage du bol</p>
  <div class="q"><strong>A1.</strong> Calculer le diamètre du flan et le rapport d'emboutissage. Combien de passes faut-il ? Proposer le diamètre \(d_1\) de la première passe (arrondi au millimètre) et calculer la hauteur du godet intermédiaire.</div>
  <div class="q"><strong>A2.</strong> Majorer l'effort d'emboutissage de la première passe et estimer l'effort de serre-flan sur la couronne initiale. En déduire un ordre de grandeur de la capacité de la presse.</div>
  <div class="q"><strong>A3.</strong> Pourquoi la paroi du bol est-elle plus mince près du fond qu'en haut ? Quelle opération termine le bol ?</div>

  <p class="exo-part">Partie B — Patte de fixation</p>
  <div class="q"><strong>B1.</strong> Calculer la longueur du flan de la patte et vérifier que le pli est réalisable dans cet acier.</div>
  <div class="q"><strong>B2.</strong> Le bord du trou est à 6 mm de la face intérieure de l'aile de 40 mm. Est-ce acceptable ? Comment orienter la patte dans la bande par rapport au sens de laminage ?</div>
  <div class="q"><strong>B3.</strong> Estimer l'effort de pliage.</div>

  <p class="exo-part">Partie C — Industrialisation de la patte</p>
  <div class="q"><strong>C1.</strong> Calculer l'effort de découpage du flan de la patte (contour et trou d'un seul coup).</div>
  <div class="q"><strong>C2.</strong> Découpe laser puis pliage : \(C_o = 200\) €, \(C_v = 1{,}10\) € ; outil à suivre (découpe, poinçonnage et pliage) : \(C_o = 28\,000\) €, \(C_v = 0{,}06\) €. Calculer le seuil de rentabilité et le coût unitaire de chaque solution la première année. Conclure.</div>
  <div class="q"><strong>C3.</strong> Les flans de la patte sont découpés côte à côte dans une bande, avec des ponts de 2 mm (pas de 32 mm, largeur de bande égale à la longueur du flan plus 4 mm). Calculer le taux d'utilisation de la tôle. Citer un autre levier pour réduire l'impact environnemental du filtre.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(D_0 = \sqrt{76^2 + 4 \times 76 \times 90} = \sqrt{33\,136} \approx 182\) mm ; \(\beta = 182/76 \approx 2{,}40 \gt 1{,}9\) : une passe ne suffit pas. Première passe : \(d_1 \ge 182/1{,}9 \approx 95{,}8\) mm, soit \(d_1 = 96\) mm ; la seconde passe a alors \(\beta_2 = 96/76 \approx 1{,}26 \le 1{,}3\) : <strong>deux passes</strong>. Hauteur intermédiaire : \(h_1 = (182^2 - 96^2)/(4 \times 96) \approx 62\) mm.</p>
    <p><strong>A2.</strong> Effort maximal de la première passe : \(\pi \times 96 \times 0{,}6 \times 300 \approx 54\ \text{kN}\). Couronne initiale sous le serre-flan, du flan (Ø 182) au rayon de matrice (Ø \(96 + 2 \times 0{,}6 + 2 \times 3{,}6 \approx 104\)) : \(\frac{\pi}{4}(182^2 - 104{,}4^2) \approx 17\,500\ \text{mm}^2\), d'où un effort de serre-flan d'environ \(2{,}5 \times 17\,500 \approx 44\) kN. Total voisin de 100 kN : une presse double effet d'une vingtaine de tonnes, avec de la marge pour les incertitudes.</p>
    <p><strong>A3.</strong> La paroi transmet l'effort du poinçon à la couronne : elle est tendue, surtout près du rayon du fond, où elle s'amincit (c'est là qu'elle se déchire si l'on force). En haut, la tôle vient de la périphérie de la couronne, comprimée tangentiellement : elle s'épaissit. Le bol est terminé par un <strong>détourage</strong> du bord (cornes d'emboutissage), puis par les opérations de reprise (sertissage du couvercle).</p>
    <p><strong>B1.</strong> Parties droites : \(40 - 4 = 36\) mm et \(25 - 4 = 21\) mm ; arc : \(\frac{\pi}{2}(2 + 0{,}8) \approx 4{,}40\) mm ; flan \(L_d \approx 61{,}4\) mm. Fibre extérieure : \(2/(4 + 2) \approx 33\,\%\), voisin de \(A = 30\,\%\) : pli serré mais réalisable dans un acier doux (\(R_i = e\)) ; on ne descendrait pas plus bas.</p>
    <p><strong>B2.</strong> Règle : au moins \(R_i + 2e = 6\) mm entre le trou et le pli : c'est juste respecté. Plus près, le trou s'ovaliserait au pliage. La ligne de pli doit être perpendiculaire au sens de laminage : la longueur du flan (61,4 mm) est disposée dans le sens de laminage.</p>
    <p><strong>B3.</strong> \(V = 16\) mm, \(L = 30\) mm : \(F \approx 1{,}33 \times 400 \times 30 \times 4/16 \approx 4\ \text{kN}\) : un effort faible.</p>
    <p><strong>C1.</strong> Périmètre : \(2(61{,}4 + 30) + \pi \times 8 \approx 207{,}9\) mm ; \(R_g = 320\) MPa ; \(F \approx 207{,}9 \times 2 \times 320 \approx 133\ \text{kN}\) (environ 14 tonnes).</p>
    <p><strong>C2.</strong> \(N^* = (28\,000 - 200)/(1{,}10 - 0{,}06) \approx 26\,700\) pattes, très en dessous de 400 000 par an. Première année : laser et pliage \(1{,}10 + 200/400\,000 \approx 1{,}10\) € ; outil à suivre \(0{,}06 + 28\,000/400\,000 = 0{,}13\) €. L'outil à suivre fait gagner environ \((1{,}10 - 0{,}13) \times 400\,000 \approx 390\,000\) € par an : on le retient, et l'on garde le laser pour les prototypes et les pièces de rechange.</p>
    <p><strong>C3.</strong> Aire utile d'un flan : \(61{,}4 \times 30 - \pi \times 4^2 \approx 1\,792\ \text{mm}^2\) ; aire de bande consommée par pièce : \(32 \times 65{,}4 \approx 2\,093\ \text{mm}^2\) ; taux d'utilisation \(\approx 86\,\%\). Autres leviers : réduire l'épaisseur du bol en le rigidifiant par sa forme (nervures, bord tombé), utiliser un acier recyclé, rendre le filtre démontable pour séparer la cartouche (papier et huile) du corps métallique en fin de vie.</p>
  </div>
</div>
