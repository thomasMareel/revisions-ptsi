<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre termine la partie 1.6 « Propagation d'un signal » du programme de PTSI : les <strong>interférences entre deux ondes lumineuses de même fréquence</strong>, sur l'exemple des <strong>trous d'Young</strong>. Il prolonge directement le chapitre « Propagation d'un signal et interférences » (onde sinusoïdale, déphasage dû à la propagation, amplitude de la somme de deux sinusoïdes, interférences acoustiques) et s'appuie sur « Optique géométrique — Les bases » (source monochromatique, longueur d'onde, indice). L'optique ondulatoire est approfondie en 2ᵉ année : chapitres « Ondes lumineuses et interférences » et « Dispositifs interférentiels : Young et Michelson ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Signal lumineux</strong> : grandeur physique associée (champ électrique), fréquence, longueur d'onde dans le vide et couleur, indice ; ce que mesure un détecteur (§1).</li>
        <li><strong>Différence de chemin optique</strong> : relier le déphasage entre les deux ondes à la différence de chemin optique (§2).</li>
        <li><strong>Interférences entre deux ondes lumineuses de même fréquence</strong> : conditions d'interférences constructives ou destructives ; exploiter la <strong>formule de Fresnel fournie</strong> pour décrire la répartition d'intensité lumineuse (§3).</li>
        <li><strong>Trous d'Young éclairés par une source monochromatique</strong> : dispositif (§4) ; <strong>établir l'expression littérale de la différence de chemin optique</strong> entre les deux ondes (§5) ; franges, interfrange (§6).</li>
        <li><strong>Exploiter la différence de chemin optique</strong> : lame sur l'un des trajets, changement de milieu (§7).</li>
        <li><strong>Mettre en œuvre un dispositif expérimental</strong> pour visualiser et caractériser le phénomène d'interférences de deux ondes : ordres de grandeur, mesures, lumière blanche (§8).</li>
      </ul>
      <p>Hors programme en PTSI (regroupé en fin de chapitre) : démonstration de la formule de Fresnel, cohérence temporelle et spatiale, contraste, réseau et interféromètre de Michelson (vus en 2ᵉ année) ; diffraction par une fente, critère de Rayleigh, lames minces et anneaux de Newton (hors des deux programmes).</p>

<div class="course-section">
  <div class="sec-num">§1 · LA LUMIÈRE, UNE ONDE</div>
  <h2>Fréquence, longueur d'onde, indice et intensité</h2>
  <div class="intro">L'optique géométrique ignore la nature ondulatoire de la lumière ; les interférences la révèlent de façon spectaculaire : en superposant deux faisceaux de lumière, on peut obtenir l'obscurité. Pour les décrire, on reprend les outils du chapitre « Propagation d'un signal et interférences », appliqués à un signal lumineux.</div>
  <div class="def-box">
    <strong>Signal lumineux.</strong> La lumière est une onde électromagnétique ; pour étudier les interférences, on la décrit par une grandeur scalaire \(s(M,t)\), la <strong>vibration lumineuse</strong>, image d'une composante du champ électrique. Une source <strong>monochromatique</strong> émet une vibration sinusoïdale de fréquence \(\nu\), de longueur d'onde dans le vide \(\lambda_0=c/\nu\), avec \(c=3{,}00\times10^{8}\ \text{m·s}^{-1}\) :
    <div class="formula" data-nom="Vibration lumineuse">$$s(M,t)=a(M)\cos\big(\omega t-\varphi(M)\big),\qquad \omega=2\pi\nu,\quad \lambda_0=\frac{c}{\nu}$$</div>
    \(\varphi(M)\) est le retard de phase de l'onde en \(M\) (il augmente le long de la propagation).
  </div>
  <div class="prop-box">
    <strong>Fréquence, couleur, indice.</strong> Le visible s'étend de \(\lambda_0\approx400\ \text{nm}\) (violet) à \(750\ \text{nm}\) (rouge), soit \(\nu\) de \(7{,}5\times10^{14}\) à \(4\times10^{14}\ \text{Hz}\). Dans un milieu transparent d'indice \(n\), la lumière se propage à la vitesse \(c/n\) ; la fréquence, fixée par la source, ne change pas (ni la couleur, qui en dépend), et la longueur d'onde devient \(\lambda=\lambda_0/n\). Par convention, la « longueur d'onde » d'une radiation désigne toujours \(\lambda_0\), mesurée dans le vide (l'air, \(n\approx1{,}0003\), est assimilé au vide).
  </div>
  <h3>Ce que mesure un détecteur</h3>
  <p>La période d'une onde visible vaut \(T=\lambda_0/c\approx2\ \text{fs}\) : aucun détecteur ne suit ces oscillations. L'œil moyenne la lumière sur environ 50 ms, une photodiode sur une nanoseconde au mieux, un capteur d'appareil photo sur son temps de pose. Tous mesurent une moyenne, proportionnelle au carré de l'amplitude : on l'appelle <strong>intensité lumineuse</strong> (ou éclairement), notée \(\mathcal{E}\), avec \(\mathcal{E}\propto\langle s^2\rangle=a^2/2\). C'est l'intensité qui varie d'une frange à l'autre sur un écran.</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Source</th><th style="text-align:left">Longueur d'onde dans le vide</th></tr>
    <tr><td>laser hélium-néon (TP)</td><td>632,8 nm (rouge)</td></tr>
    <tr><td>diodes laser (pointeurs)</td><td>650 nm (rouge), 532 nm (vert), 405 nm (violet)</td></tr>
    <tr><td>lampe à vapeur de sodium</td><td>589,0 et 589,6 nm (doublet jaune)</td></tr>
    <tr><td>lampe à vapeur de mercure</td><td>raies à 436 nm (bleu), 546 nm (vert), 577 et 579 nm (jaune)</td></tr>
    <tr><td>lumière blanche (Soleil, lampe à incandescence)</td><td>spectre continu, de 400 à 750 nm environ</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — le laser hélium-néon</strong>
    <ol>
      <li>\(\lambda_0=632{,}8\ \text{nm}\) : \(\nu=c/\lambda_0=4{,}74\times10^{14}\ \text{Hz}\) et \(T=1/\nu=2{,}11\ \text{fs}\).</li>
      <li>Pendant les 50 ms de persistance rétinienne, l'onde accomplit \(0{,}050/2{,}11\times10^{-15}\approx2\times10^{13}\) périodes : l'œil n'en perçoit que la moyenne.</li>
      <li>Dans l'eau (\(n=1{,}33\)), \(\lambda=632{,}8/1{,}33=476\ \text{nm}\), mais le faisceau reste rouge : la couleur est liée à la fréquence, inchangée.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire qu'une lumière rouge devient bleue dans l'eau parce que sa longueur d'onde y vaut 476 nm. La couleur est fixée par la fréquence ; c'est pour éviter cette confusion qu'on repère une radiation par \(\lambda_0\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · CHEMIN OPTIQUE ET DÉPHASAGE</div>
  <h2>Le chemin optique compte les longueurs d'onde</h2>
  <div class="intro">En acoustique, le retard de phase accumulé sur une distance \(r\) vaut \(2\pi r/\lambda\). La lumière traverse souvent des milieux d'indices différents (air, verre, eau), où sa longueur d'onde change : la bonne grandeur est alors le chemin optique.</div>
  <div class="def-box">
    <strong>Chemin optique.</strong> Le long d'un rayon allant de \(A\) à \(B\) dans un milieu homogène d'indice \(n\), le chemin optique vaut \((AB)=n\,AB\) ; à travers des milieux homogènes successifs d'indices \(n_i\), traversés sur les longueurs \(\ell_i\) :
    <div class="formula" data-nom="Chemin optique">$$(AB)=\sum_i n_i\,\ell_i=c\,t_{AB}$$</div>
    C'est la distance que la lumière parcourrait dans le vide pendant la durée réelle \(t_{AB}\) du trajet.
  </div>
  <div class="prop-box">
    <strong>Déphasage et différence de marche.</strong> Le retard de phase accumulé de \(A\) à \(B\) vaut \(\omega\,t_{AB}=2\pi\,(AB)/\lambda_0\). Si deux ondes issues d'une même source \(S\) atteignent \(M\) par deux trajets (1) et (2), on définit la <strong>différence de marche</strong> (ou différence de chemin optique) \(\delta(M)\), et leur déphasage vaut :
    <div class="formula" data-nom="Déphasage et différence de marche">$$\Delta\varphi(M)=\varphi_2(M)-\varphi_1(M)=\frac{2\pi}{\lambda_0}\,\delta(M),\qquad \delta(M)=(SM)_2-(SM)_1$$</div>
    On appelle <strong>ordre d'interférence</strong> le nombre \(p(M)=\delta(M)/\lambda_0=\Delta\varphi/2\pi\) : il compte de combien de longueurs d'onde une voie est en retard sur l'autre.
  </div>
  <div class="method-box">
    <strong>Exemple — une lame mince sur l'une des voies</strong>
    <p>Une lame de verre d'indice \(n=1{,}50\) et d'épaisseur \(e=3{,}0\ \mu\text{m}\) est traversée en incidence normale par la voie (2), \(\lambda_0=600\ \text{nm}\) ; sans lame, les deux voies seraient identiques.</p>
    <ol>
      <li>La lame remplace une épaisseur \(e\) d'air (\(n\approx1\)) par du verre : \((SM)_2\) augmente de \(n\,e-e=(n-1)\,e=1{,}5\ \mu\text{m}\).</li>
      <li>\(p=\delta/\lambda_0=1{,}5/0{,}600=2{,}5\), \(\Delta\varphi=5\pi\) : les ondes arrivent en opposition de phase.</li>
      <li>Avec une lame trois fois plus fine (\(e=1{,}0\ \mu\text{m}\)), \(p=0{,}83\) : on serait presque sur une frange brillante. Quelques micromètres de verre suffisent à faire passer d'une frange brillante à une frange sombre : les interférences sont une règle graduée en longueurs d'onde.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : compter deux fois l'indice. On écrit soit \(\dfrac{2\pi}{\lambda_0}\times n\ell\) (chemin optique et longueur d'onde dans le vide), soit \(\dfrac{2\pi}{\lambda}\times\ell\) (longueur géométrique et longueur d'onde dans le milieu), jamais \(\dfrac{2\pi}{\lambda}\times n\ell\). Autre oubli : la réflexion sur un milieu plus réfringent ajoute un déphasage de \(\pi\) (voir « Pour aller plus loin »), sans objet pour les trous d'Young.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SUPERPOSITION DE DEUX ONDES LUMINEUSES</div>
  <h2>Formule de Fresnel et conditions d'interférences</h2>
  <div class="intro">Comme pour le son, les vibrations de deux ondes qui se superposent s'ajoutent. Mais un détecteur mesure une intensité, proportionnelle au carré de l'amplitude : l'intensité de la somme n'est pas la somme des intensités dès que les deux ondes ont un déphasage stable.</div>
  <div class="prop-box">
    <strong>Formule de Fresnel</strong> (fournie en PTSI, établie en 2ᵉ année). Deux ondes lumineuses de même fréquence et de déphasage constant dans le temps (ondes cohérentes), d'intensités \(\mathcal{E}_1\) et \(\mathcal{E}_2\) en \(M\) (chacune mesurée en masquant l'autre), donnent en \(M\) l'intensité :
    <div class="formula" data-nom="Formule de Fresnel">$$\mathcal{E}(M)=\mathcal{E}_1+\mathcal{E}_2+2\sqrt{\mathcal{E}_1\mathcal{E}_2}\,\cos\Delta\varphi(M),\qquad \Delta\varphi(M)=\frac{2\pi\,\delta(M)}{\lambda_0}$$</div>
    <ul>
      <li><strong>interférences constructives</strong> (frange brillante) si \(\delta=p\lambda_0\), \(p\) entier : \(\mathcal{E}_{\max}=\left(\sqrt{\mathcal{E}_1}+\sqrt{\mathcal{E}_2}\right)^2\) ;</li>
      <li><strong>interférences destructives</strong> (frange sombre) si \(\delta=\left(p+\tfrac12\right)\lambda_0\) : \(\mathcal{E}_{\min}=\left(\sqrt{\mathcal{E}_1}-\sqrt{\mathcal{E}_2}\right)^2\).</li>
    </ul>
    Pour deux ondes de même intensité \(\mathcal{E}_0\) : \(\mathcal{E}=2\mathcal{E}_0\,(1+\cos\Delta\varphi)\), qui varie de 0 à \(4\mathcal{E}_0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">D'où vient la formule ?</span>
    <span class="prompt">Lien avec l'amplitude de la somme de deux sinusoïdes</span>
    <div class="content">
      <p>Les deux vibrations en \(M\) ont la même pulsation : \(s_j=a_j\cos(\omega t-\varphi_j)\). Leur somme est une sinusoïde d'amplitude \(a\) telle que \(a^2=a_1^2+a_2^2+2a_1a_2\cos(\varphi_2-\varphi_1)\) (chapitre « Propagation d'un signal et interférences », §6). L'intensité étant proportionnelle au carré de l'amplitude, \(\mathcal{E}=K a^2\), \(\mathcal{E}_1=K a_1^2\) et \(\mathcal{E}_2=K a_2^2\) ; en multipliant par \(K\), on retrouve la formule de Fresnel. La démonstration complète, par la moyenne temporelle de \(s^2\), et l'étude de ce qui se passe quand le déphasage n'est pas stable sont faites en 2ᵉ année.</p>
    </div>
  </div>

  <h3>Conditions d'obtention des interférences</h3>
  <p>Il faut deux ondes de <strong>même fréquence</strong> dont le <strong>déphasage reste constant</strong> pendant la durée de la mesure. Une source réelle n'émet pas une sinusoïde parfaite : sa phase change au hasard au bout d'un temps très court (de la picoseconde à la nanoseconde pour une lampe spectrale, quelques femtosecondes pour une lampe blanche ; c'est l'image des « trains d'onde », étudiée en 2ᵉ année). Deux sources distinctes, même deux lasers de même couleur, ont donc un déphasage qui fluctue des milliards de fois par seconde : le terme en \(\cos\Delta\varphi\) se moyenne à zéro, les intensités s'ajoutent simplement (\(\mathcal{E}=\mathcal{E}_1+\mathcal{E}_2\)) et l'on ne voit aucune frange. Pour obtenir des interférences lumineuses, on <strong>divise l'onde issue d'une source unique</strong> en deux ondes que l'on fait se superposer : c'est le rôle des trous d'Young (§4).</p>
  <div class="method-box">
    <strong>Exemple — deux faisceaux d'intensités inégales</strong>
    <p>Deux ondes cohérentes ont en \(M\) les intensités \(\mathcal{E}_1=4\mathcal{E}_2\).</p>
    <ol>
      <li>\(\mathcal{E}_{\max}=\left(2\sqrt{\mathcal{E}_2}+\sqrt{\mathcal{E}_2}\right)^2=9\mathcal{E}_2\) et \(\mathcal{E}_{\min}=\mathcal{E}_2\) : les franges sombres ne sont pas noires, mais restent neuf fois moins lumineuses que les brillantes.</li>
      <li>Là où \(\Delta\varphi=\pi/2\), \(\mathcal{E}=5\mathcal{E}_2=\mathcal{E}_1+\mathcal{E}_2\) : c'est aussi la moyenne sur une frange. Les interférences ne créent ni ne détruisent de lumière, elles la redistribuent.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — même point, deux couleurs</strong>
    <p>En un point \(M\), \(\delta=1{,}5\ \mu\text{m}\). Pour \(\lambda_0=600\ \text{nm}\), \(p=2{,}5\) : frange sombre. Pour \(\lambda_0=500\ \text{nm}\), \(p=3\) : frange brillante. Le même point est sombre en lumière orangée et brillant en lumière verte : c'est l'origine des irisations en lumière blanche (§8).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner les intensités de deux ondes cohérentes (on oublie le terme d'interférence), ou au contraire appliquer la formule de Fresnel à deux sources indépendantes, dont les intensités s'ajoutent. Et une frange sombre n'est noire que si \(\mathcal{E}_1=\mathcal{E}_2\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LE DISPOSITIF DES TROUS D'YOUNG</div>
  <h2>Diviser le front d'onde d'une source unique</h2>
  <div class="intro">En 1801, Thomas Young éclaire deux petits trous percés dans un écran opaque avec la lumière d'une seule source : sur un écran placé derrière, il observe des franges alternativement brillantes et sombres, preuve que la lumière est une onde. Les deux trous prélèvent deux morceaux de la même onde : ce sont deux sources secondaires cohérentes.</div>
  <div class="def-box">
    <strong>Dispositif.</strong> Une source ponctuelle monochromatique \(S\) (ou un laser) éclaire un écran opaque percé de deux trous très petits \(S_1\) et \(S_2\), distants de \(a\). On observe sur un écran parallèle, situé à la distance \(D\) très grande devant \(a\). Repère : \(O\) milieu de \(S_1S_2\), axe \(Oz\) perpendiculaire aux écrans, \(S_1\) en \(x=+a/2\), \(S_2\) en \(x=-a/2\) ; le point \(M\) de l'écran a pour coordonnées \((x,y)\).
  </div>

  <div class="prop-box">
    <strong>Deux sources secondaires en phase.</strong> Si \(S\) est sur la médiatrice de \(S_1S_2\) (\(SS_1=SS_2\)), les deux trous reçoivent l'onde avec le même retard : ils vibrent en phase. La différence de marche en \(M\) ne dépend alors que de la partie du trajet située après les trous :
    <div class="formula">$$\delta(M)=(SM)_2-(SM)_1=(S_2M)-(S_1M)$$</div>
  </div>
  <h3>Pourquoi des trous si petits ?</h3>
  <p>Un trou de diamètre \(b\) ne laisse pas passer un mince pinceau de lumière : il <strong>diffracte</strong> la lumière dans un cône dont le demi-angle est de l'ordre de \(\lambda/b\). C'est une limite du modèle de l'optique géométrique, sensible dès que l'ouverture ne mesure que quelques dizaines ou centaines de longueurs d'onde. Ici, la diffraction est indispensable : sans elle, les deux faisceaux issus des trous ne se croiseraient pas. Les franges n'existent que dans la zone où les deux cônes se recouvrent.</p>
  <div class="method-box">
    <strong>Exemple — taille de la zone d'interférences</strong>
    <p>Laser \(\lambda_0=633\ \text{nm}\), trous de diamètre \(b=0{,}10\ \text{mm}\) distants de \(a=0{,}50\ \text{mm}\), écran à \(D=2{,}0\ \text{m}\).</p>
    <ol>
      <li>Demi-angle de diffraction : \(\lambda_0/b\approx6\times10^{-3}\ \text{rad}\) ; sur l'écran, chaque tache a une largeur de l'ordre de \(2D\lambda_0/b\approx2{,}5\ \text{cm}\). Les deux taches, centrées à 0,5 mm l'une de l'autre, se recouvrent presque entièrement.</li>
      <li>L'interfrange (§6) vaut \(\lambda_0D/a=2{,}5\ \text{mm}\) : on voit de l'ordre de \(2a/b=10\) franges dans la zone éclairée. Pour en voir davantage, il faut des trous plus petits devant leur écartement (au prix de la luminosité).</li>
    </ol>
  </div>
  <p>En TP, on remplace souvent les trous par deux <strong>fentes</strong> fines et parallèles (bifente), éclairées par un laser ou par une fente source parallèle : la figure est la même (franges parallèles aux fentes), mais beaucoup plus lumineuse.</p>
  <div class="notice"><strong>Erreur classique</strong> : croire que les deux trous sont deux sources indépendantes. Ils ne font que transmettre deux portions de la même onde : c'est ce qui les rend cohérents. Éclairer chacun par une lampe différente ne donnerait aucune frange.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DIFFÉRENCE DE CHEMIN OPTIQUE</div>
  <h2>Établir δ ≈ n a x / D</h2>
  <div class="intro">C'est le calcul central du chapitre, à savoir refaire : il transforme la position \(x\) d'un point de l'écran en différence de marche, donc en déphasage. On suppose le dispositif plongé dans un milieu homogène d'indice \(n\) (l'air : \(n=1\)).</div>
  <div class="prop-box">
    <strong>Différence de chemin optique des trous d'Young.</strong> Pour \(D\gg a\), \(D\gg|x|\) et \(D\gg|y|\) :
    <div class="formula" data-nom="Différence de marche des trous d'Young">$$\delta(M)=(S_2M)-(S_1M)\approx\frac{n\,a\,x}{D}$$</div>
    Elle ne dépend que de \(x\) : les points de même différence de marche forment, sur l'écran, des droites \(x=\) cte, perpendiculaires à \(S_1S_2\).
  </div>
  <div class="method-box">
    <strong>Démonstration — en trois étapes</strong>
    <ol>
      <li><em>Distances.</em> Avec \(S_1(a/2,0,0)\), \(S_2(-a/2,0,0)\) et \(M(x,y,D)\) : \(S_1M^2=\left(x-\tfrac a2\right)^2+y^2+D^2\) et \(S_2M^2=\left(x+\tfrac a2\right)^2+y^2+D^2\).</li>
      <li><em>Différence des carrés.</em> \(S_2M^2-S_1M^2=\left(x+\tfrac a2\right)^2-\left(x-\tfrac a2\right)^2=2ax\), exactement. Comme \(S_2M^2-S_1M^2=(S_2M-S_1M)(S_2M+S_1M)\) :
        <div class="formula">$$S_2M-S_1M=\frac{2ax}{S_1M+S_2M}$$</div></li>
      <li><em>Approximation.</em> Si \(D\) est très grand devant \(a\), \(|x|\) et \(|y|\), chaque distance vaut \(D\) au premier ordre : \(S_1M+S_2M\approx2D\), donc \(S_2M-S_1M\approx ax/D\), et \(\delta=n\,(S_2M-S_1M)\approx n\,a\,x/D\).</li>
    </ol>
  </div>
  <p>Lecture géométrique (figure du §4) : vus de \(M\), très loin, les deux rayons sont presque parallèles, inclinés de \(\theta\) sur l'axe ; la différence de longueur est la projection \(S_2H\) de \(S_1S_2\) sur leur direction, \(a\sin\theta\), et \(\sin\theta\approx\tan\theta=x/D\) pour \(\theta\) petit. Le même raisonnement donne \(\delta\approx a\,x/D\) pour deux haut-parleurs (chapitre « Propagation d'un signal et interférences », §8).</p>
  <div class="method-box">
    <strong>Exemple — l'approximation est-elle bonne ?</strong>
    <p>\(a=0{,}50\ \text{mm}\), \(D=2{,}00\ \text{m}\), point \(M\) en \(x=3{,}00\ \text{mm}\), \(y=0\), dans l'air, \(\lambda_0=600\ \text{nm}\).</p>
    <ol>
      <li>Formule approchée : \(\delta=a\,x/D=0{,}50\times10^{-3}\times3{,}00\times10^{-3}/2{,}00=0{,}750\ \mu\text{m}\), soit \(p=1{,}25\) : \(M\) est à mi-chemin entre la frange brillante d'ordre 1 et la frange sombre suivante.</li>
      <li>Calcul exact (avec les racines carrées) : \(\delta=0{,}749\,999\ \mu\text{m}\). L'écart relatif, de l'ordre de \(x^2/(2D^2)\approx1\times10^{-6}\), est négligeable : il représente un millionième de frange.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour \(D\) la distance entre la source et les trous (elle n'intervient pas quand \(S\) est sur l'axe), ou se tromper de signe. Avec la convention \(\delta=(S_2M)-(S_1M)\) et \(S_1\) du côté des \(x\) positifs, \(\delta\gt0\) pour \(x\gt0\) : le point \(M\) est plus près de \(S_1\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · FRANGES D'INTERFÉRENCES ET INTERFRANGE</div>
  <h2>Exploiter la formule de Fresnel sur l'écran</h2>
  <div class="intro">En reportant la différence de marche dans la formule de Fresnel, on obtient la répartition de l'intensité sur l'écran : c'est ce que l'on observe, mesure et photographie.</div>
  <div class="prop-box">
    <strong>Intensité sur l'écran.</strong> Les deux trous étant identiques, les deux ondes ont la même intensité \(\mathcal{E}_0\) en \(M\) :
    <div class="formula" data-nom="Intensité des trous d'Young">$$\mathcal{E}(x)=2\mathcal{E}_0\left[1+\cos\left(\frac{2\pi\,n\,a\,x}{\lambda_0\,D}\right)\right]$$</div>
    <ul>
      <li>les <strong>franges</strong> (lieux de \(\delta\) constant) sont des droites parallèles, perpendiculaires à \(S_1S_2\) (parallèles aux fentes d'une bifente), équidistantes ;</li>
      <li>franges <strong>brillantes</strong> pour \(\delta=p\lambda_0\), soit \(x_p=p\,\dfrac{\lambda_0D}{na}\) ; franges <strong>sombres</strong> (noires) à mi-chemin ;</li>
      <li>la frange centrale (\(x=0\), ordre \(p=0\)) est brillante ;</li>
      <li>l'<strong>interfrange</strong>, distance entre deux franges brillantes (ou sombres) consécutives, vaut :</li>
    </ul>
    <div class="formula" data-nom="Interfrange des trous d'Young">$$i=\frac{\lambda_0\,D}{n\,a}=\frac{\lambda\,D}{a}$$</div>
  </div>

<figcaption>En haut, l'écran vu de face : franges rectilignes, parallèles entre elles et perpendiculaires à la droite S₁S₂, alternativement brillantes et sombres. En bas, l'intensité ℰ(x) = 2ℰ₀[1 + cos(2πax/(λ₀D))] : la frange centrale (ordre 0) est brillante et deux franges brillantes consécutives sont séparées de l'interfrange i.</figcaption>
</figure>
  <p>L'interfrange croît avec \(\lambda_0\) et avec \(D\), décroît quand on écarte les trous ou qu'on plonge le dispositif dans un milieu d'indice \(n\gt1\). L'onglet « Simulateur » permet de le vérifier en faisant varier \(a\), \(\lambda\) et \(D\). Pour qu'elle soit visible à l'œil (au moins un demi-millimètre), il faut des trous distants de moins d'un millimètre et un écran éloigné d'au moins un mètre.</p>
  <div class="method-box">
    <strong>Exemple — combien de franges sur l'écran ?</strong>
    <p>Bifente \(a=0{,}20\ \text{mm}\), écran à \(D=1{,}50\ \text{m}\), laser \(\lambda_0=633\ \text{nm}\), dans l'air.</p>
    <ol>
      <li>\(i=\lambda_0D/a=633\times10^{-9}\times1{,}50/0{,}20\times10^{-3}=4{,}75\ \text{mm}\).</li>
      <li>Au bord d'une zone éclairée de 5 cm de large (\(x=25\ \text{mm}\)), \(p=x/i=5{,}3\) : on compte les franges brillantes d'ordres \(-5\) à \(5\), soit 11.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — mesurer une longueur d'onde</strong>
    <p>Bifente \(a=0{,}300\ \text{mm}\), écran à \(D=1{,}20\ \text{m}\). On mesure 11,9 mm entre les centres de deux franges sombres séparées par cinq interfranges.</p>
    <ol>
      <li>\(i=11{,}9/5=2{,}38\ \text{mm}\) : mesurer plusieurs interfranges divise l'incertitude de lecture par leur nombre.</li>
      <li>\(\lambda_0=a\,i/D=0{,}300\times10^{-3}\times2{,}38\times10^{-3}/1{,}20=595\ \text{nm}\) : lumière jaune-orangé, proche du doublet du sodium (589 nm). Une erreur de 0,2 mm sur la lecture fait moins de 2 % d'erreur sur \(\lambda_0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre l'interfrange avec la largeur d'une frange brillante (environ \(i/2\)), ou ne mesurer qu'une seule interfrange. Autre piège : la formule \(i=\lambda_0D/(na)\) suppose \(|x|\ll D\) ; loin de l'axe, les franges ne sont plus exactement équidistantes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · MODIFIER LA DIFFÉRENCE DE MARCHE</div>
  <h2>Lame sur un trajet, changement de milieu</h2>
  <div class="intro">Toute modification du chemin optique de l'une des deux voies déplace la figure d'interférences : c'est le principe des mesures interférométriques d'indice ou d'épaisseur, d'une précision de l'ordre d'une fraction de longueur d'onde.</div>
  <div class="prop-box">
    <strong>Lame devant un trou.</strong> On place devant \(S_1\) une lame d'indice \(n_\ell\) et d'épaisseur \(e\), traversée en incidence quasi normale (dispositif dans l'air). Le chemin optique \((S_1M)\) augmente de \((n_\ell-1)\,e\), donc
    <div class="formula" data-nom="Trous d'Young avec une lame">$$\delta'(x)=\frac{a\,x}{D}-(n_\ell-1)\,e$$</div>
    La figure est <strong>translatée sans changer d'interfrange</strong>, du côté de la lame : la frange d'ordre 0 (\(\delta'=0\)) passe en \(x_0=(n_\ell-1)\,e\,D/a\), soit un décalage de \(N=(n_\ell-1)\,e/\lambda_0\) interfranges.
  </div>

<figcaption>Tirets : intensité sans lame. Trait plein : avec une lame qui allonge le chemin optique du trajet passant par S₁ de (n − 1)e. La figure est translatée, sans changer d'interfrange, du côté de la lame, de x₀ = (n − 1)eD/a, soit (n − 1)e/λ₀ interfranges (ici 1,36).</figcaption>
</figure>
  <p>Interprétation : pour retrouver \(\delta'=0\), il faut un point plus proche de \(S_1\) que de \(S_2\), afin que le trajet géométrique plus court par \(S_1\) compense le retard pris dans la lame.</p>
  <div class="method-box">
    <strong>Exemple — un film plastique devant une fente</strong>
    <p>Film d'indice \(n_\ell=1{,}58\) et d'épaisseur \(e=4{,}0\ \mu\text{m}\) devant \(S_1\) ; \(a=0{,}40\ \text{mm}\), \(D=1{,}00\ \text{m}\), \(\lambda_0=532\ \text{nm}\).</p>
    <ol>
      <li>Supplément de chemin optique : \((n_\ell-1)\,e=0{,}58\times4{,}0=2{,}32\ \mu\text{m}\), soit \(N=2{,}32/0{,}532=4{,}36\) interfranges.</li>
      <li>\(i=\lambda_0D/a=1{,}33\ \text{mm}\) et \(x_0=(n_\ell-1)\,e\,D/a=5{,}8\ \text{mm}\), du côté de \(S_1\).</li>
      <li>En lumière monochromatique, toutes les franges brillantes se ressemblent : en comparant les photos avant et après, on ne voit qu'un décalage de 0,36 interfrange. Pour connaître la partie entière, on suit le défilement des franges pendant l'introduction de la lame, ou l'on repère la frange centrale en lumière blanche (§8).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — dispositif plongé dans l'eau</strong>
    <p>Si tout le dispositif précédent (sans le film) est immergé dans l'eau (\(n=1{,}33\)), la longueur d'onde dans le milieu devient \(\lambda_0/n\) et \(i=\lambda_0D/(na)=1{,}33/1{,}33=1{,}00\ \text{mm}\) : les franges se resserrent dans le rapport \(n\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire le supplément \(n_\ell\,e\) au lieu de \((n_\ell-1)\,e\) (la lame remplace de l'air, elle ne s'ajoute pas au trajet), ou déplacer la figure du mauvais côté. La frange centrale va toujours du côté de la voie dont le chemin optique a été allongé.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · LES INTERFÉRENCES EN PRATIQUE</div>
  <h2>Observer, mesurer, et la lumière blanche</h2>
  <div class="intro">Le programme demande de savoir mettre en œuvre un dispositif d'interférences et de le caractériser. Voici les ordres de grandeur, les gestes de mesure et ce que l'on voit en lumière blanche.</div>
  <h3>Montage et mesures</h3>
  <ul>
    <li><strong>Source</strong> : un laser éclaire directement la bifente (lumière intense, quasi monochromatique, issue d'une seule source) ; avec une lampe spectrale, on éclaire d'abord une fente source fine, parallèle aux fentes et placée sur leur médiatrice.</li>
    <li><strong>Ordres de grandeur</strong> : \(a\) de 0,1 à 1 mm, \(D\) de 1 à 3 m, \(i\) de 0,5 à 10 mm ; un écran blanc et une règle, ou mieux un capteur d'images (webcam sans objectif, appareil photo) et un logiciel de profil d'intensité.</li>
    <li><strong>Mesure de \(i\)</strong> : mesurer la distance entre deux franges sombres éloignées et diviser par le nombre d'interfranges ; mesurer \(D\) au mètre ruban et lire \(a\) sur la bifente (ou le déterminer avec un laser de longueur d'onde connue).</li>
    <li><strong>Vérifications</strong> : \(i\) proportionnel à \(D\) (on recule l'écran), inversement proportionnel à \(a\) (bifentes de différents écartements) ; tracer \(i\) en fonction de \(D\) et exploiter la pente \(\lambda_0/a\).</li>
  </ul>
  <h3>En lumière blanche</h3>
  <p>Chaque longueur d'onde donne son propre système de franges, d'interfrange \(\lambda_0D/a\) : les figures des différentes couleurs, incohérentes entre elles, se superposent en ajoutant leurs intensités. En \(x=0\), \(\delta=0\) pour toutes les couleurs : la <strong>frange centrale est blanche</strong>, encadrée de deux franges sombres. Dès la première frange latérale, les maxima du bleu (plus serrés) et du rouge se séparent : les franges sont <strong>irisées</strong>, bleutées à l'intérieur, rougeâtres à l'extérieur. Au-delà de quelques franges, toutes les couleurs se mélangent : l'écran paraît uniformément éclairé, d'un blanc pâle (« blanc d'ordre supérieur »). L'étude quantitative de ce brouillage est faite en 2ᵉ année.</p>

<figcaption>Intensités de trois radiations (450, 550 et 650 nm) pour a = 0,50 mm et D = 1,0 m. Toutes sont maximales en x = 0 : la frange centrale est blanche. Chaque couleur a son interfrange (0,90 ; 1,10 ; 1,30 mm) : dès la première frange, les maxima se séparent (franges irisées) : en x = 1,3 mm, le rouge est brillant là où le bleu est presque éteint. Plus loin, les couleurs se mélangent et l'écran paraît uniformément blanchâtre.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — combien de franges colorées ?</strong>
    <p>\(a=0{,}50\ \text{mm}\), \(D=1{,}0\ \text{m}\) ; on compare le bleu (450 nm) et le rouge (650 nm).</p>
    <ol>
      <li>Premières franges brillantes latérales : \(x=\lambda_0D/a\), soit \(0{,}90\ \text{mm}\) pour le bleu et \(1{,}30\ \text{mm}\) pour le rouge. En \(x=1{,}30\ \text{mm}\), l'ordre du bleu vaut \(p=ax/(\lambda_0D)=1{,}44\), presque demi-entier : le bleu y est éteint, la frange paraît rouge.</li>
      <li>Les deux systèmes sont décalés d'une demi-frange quand \(\dfrac{ax}{D}\left(\dfrac{1}{\lambda_{\text{bleu}}}-\dfrac{1}{\lambda_{\text{rouge}}}\right)=\dfrac12\), soit \(x\approx1{,}5\ \text{mm}\) : à peine plus d'une interfrange. On ne distingue donc que deux ou trois franges colorées de chaque côté.</li>
    </ol>
  </div>
  <p>La lumière blanche sert ainsi à repérer la frange d'ordre 0, la seule qui soit blanche : c'est elle qu'on suit quand on introduit une lame (§7). Enfin, la même expérience se fait avec des ultrasons : deux émetteurs à 40 kHz alimentés par le même générateur (\(\lambda\approx8{,}6\ \text{mm}\)) et un récepteur que l'on déplace parallèlement à la ligne des émetteurs donnent des maxima espacés de \(\lambda D/a\), comme les franges d'Young.</p>
  <div class="notice"><strong>Erreur classique</strong> : penser qu'un laser est indispensable. Il est commode, mais toute source fine et assez monochromatique convient, pourvu que les deux trous reçoivent la lumière d'un même point source. Inversement, avec un laser, on n'obtient rien si l'on éclaire chaque trou par un faisceau différent issu de deux lasers.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · CE QUE L'ON VERRA EN 2ᵉ ANNÉE</div>
  <h2>Cohérence, contraste, réseau, Michelson</h2>
  <div class="notice"><strong>Hors programme en PTSI (vu en 2ᵉ année)</strong> : chapitres « Ondes lumineuses et interférences » et « Dispositifs interférentiels : Young et Michelson ».</div>
  <ul>
    <li><strong>Démonstration de la formule de Fresnel</strong> par la moyenne temporelle de \((s_1+s_2)^2\) : le terme croisé n'est non nul que pour deux ondes de même fréquence et de déphasage stable.</li>
    <li><strong>Cohérence temporelle</strong> : une source de largeur spectrale \(\Delta\lambda_0\) émet des trains d'onde de longueur \(L_c\approx\lambda_0^2/\Delta\lambda_0\) ; les franges disparaissent quand \(|\delta|\) dépasse \(L_c\). Lumière blanche : \(L_c\approx1\ \mu\text{m}\), quelques franges ; laser hélium-néon de TP : une vingtaine de centimètres.</li>
    <li><strong>Contraste</strong> \(\Gamma=\dfrac{\mathcal{E}_{\max}-\mathcal{E}_{\min}}{\mathcal{E}_{\max}+\mathcal{E}_{\min}}\), qui vaut \(\dfrac{2\sqrt{\mathcal{E}_1\mathcal{E}_2}}{\mathcal{E}_1+\mathcal{E}_2}\) pour deux ondes cohérentes : 1 pour deux intensités égales.</li>
    <li><strong>Cohérence spatiale</strong> : une source décalée de l'axe translate la figure en sens inverse ; une source trop large superpose des figures décalées et brouille les franges.</li>
    <li><strong>Réseau</strong> (\(N\) fentes de pas \(a\)) : maxima très fins dans les directions \(a\,(\sin\theta-\sin\theta_i)=p\lambda_0\), qui dépendent de \(\lambda_0\) (spectroscopie).</li>
    <li><strong>Interféromètre de Michelson</strong> : division d'amplitude par une lame séparatrice ; anneaux d'égale inclinaison, mesures de très petites épaisseurs et de longueurs de cohérence.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · DIFFRACTION ET LAMES MINCES</div>
  <h2>Hors des deux programmes</h2>
  <div class="notice"><strong>Hors programme</strong> (pour aller plus loin) : ces résultats ne sont exigibles ni en PTSI, ni en PT ; ils éclairent des phénomènes courants (taille des taches lumineuses, couleurs des bulles de savon).</div>
  <h3>Diffraction par une fente</h3>
  <p>Une fente de largeur \(b\) éclairée par une onde plane donne, à grande distance \(D\), une tache centrale entourée de taches plus faibles ; les minima sont dans les directions \(\sin\theta=m\lambda/b\) (\(m\) entier non nul). La tache centrale a pour largeur angulaire \(2\lambda/b\), soit \(2\lambda D/b\) sur l'écran. Avec une bifente réelle, les franges d'Young sont modulées par cette enveloppe : environ \(2a/b\) franges dans la tache centrale.</p>

  <h3>Pouvoir de résolution</h3>
  <p>À cause de la diffraction par sa pupille de diamètre \(D_p\), un instrument donne d'un point une tache, et deux points ne sont séparés que si leur écart angulaire dépasse environ \(1{,}22\,\lambda/D_p\) (critère de Rayleigh). Pour l'œil (pupille de 3 mm, 550 nm), cela fait \(2\times10^{-4}\ \text{rad}\), moins d'une minute d'arc.</p>
  <h3>Lames minces et anneaux de Newton</h3>
  <p>Une lame transparente mince d'épaisseur \(e\) et d'indice \(n\), éclairée sous incidence quasi normale, renvoie deux ondes : l'une réfléchie sur la face avant, l'autre sur la face arrière. En réflexion, leur différence de marche vaut \(\delta=2ne+\lambda_0/2\), le terme \(\lambda_0/2\) traduisant le déphasage de \(\pi\) de la réflexion sur le milieu le plus réfringent (« réflexion vitreuse »). Chaque épaisseur renforce certaines couleurs : irisations des bulles de savon et des taches d'huile, couches antireflet des lunettes. Entre une lentille de rayon de courbure \(R\) posée sur un plan, l'épaisseur d'air vaut \(e\approx r^2/(2R)\) à la distance \(r\) du contact : on observe des anneaux (de Newton), sombres en réflexion pour \(r_k=\sqrt{k\lambda_0R}\), avec un centre sombre.</p>

  <div class="sec-num">MÉTHODES · OPTIQUE ONDULATOIRE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire de la fin de la partie 1.6 du programme : calculer un chemin optique et un déphasage, conclure sur la nature des interférences, exploiter la formule de Fresnel, établir la différence de marche des trous d'Young, en déduire les franges et une longueur d'onde, prévoir l'effet d'une lame ou d'un changement de milieu, vérifier qu'il peut y avoir interférences et décrire la figure en lumière blanche. Les deux dernières, hors programme, servent aux exercices « pour aller plus loin ».</div>

  <div class="method-box"><strong>Méthode 1 — Calculer un chemin optique et un déphasage</strong>
    <ol>
      <li><span class="step">Découper le trajet</span> en morceaux homogènes : \((AB)=\sum_i n_i\ell_i\) (air : \(n=1\)).</li>
      <li><span class="step">Comparer les deux voies</span> : \(\delta=(SM)_2-(SM)_1\). Les morceaux communs aux deux voies s'éliminent ; une lame d'indice \(n\) et d'épaisseur \(e\) qui remplace de l'air apporte \((n-1)\,e\).</li>
      <li><span class="step">Convertir</span> : \(\Delta\varphi=2\pi\delta/\lambda_0\) et \(p=\delta/\lambda_0\), toujours avec la longueur d'onde dans le vide.</li>
    </ol>
    <p><em>Exemple éclair :</em> une lamelle de microscope (\(n=1{,}52\), \(e=0{,}15\ \text{mm}\)) sur l'une des voies, raie verte du mercure \(\lambda_0=546{,}1\ \text{nm}\) : \(\delta=0{,}52\times0{,}15\ \text{mm}=78\ \mu\text{m}\), soit \(p=142{,}8\) : un retard de près de 143 longueurs d'onde.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : multiplier le chemin optique par \(2\pi/\lambda\) (longueur d'onde dans le milieu), ce qui compte l'indice deux fois ; ou écrire \(n\,e\) au lieu de \((n-1)\,e\) pour une lame qui prend la place de l'air.</div>

  <div class="method-box"><strong>Méthode 2 — Conclure sur la nature des interférences en un point</strong>
    <ol>
      <li><span class="step">Calculer l'ordre</span> \(p=\delta/\lambda_0\) (déphasages supplémentaires éventuels inclus).</li>
      <li><span class="step">Lire sa partie fractionnaire</span> : nulle, frange brillante (interférences constructives) ; égale à \(\tfrac12\), frange sombre (destructives) ; sinon, intensité intermédiaire, à calculer par la formule de Fresnel (méthode 3).</li>
      <li><span class="step">Changer de couleur change la conclusion</span> : \(p\) est inversement proportionnel à \(\lambda_0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\delta=2{,}73\ \mu\text{m}\). Pour \(\lambda_0=546\ \text{nm}\), \(p=5{,}00\) : frange brillante. Pour \(\lambda_0=632{,}8\ \text{nm}\), \(p=4{,}31\) : intensité intermédiaire.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Exploiter la formule de Fresnel</strong>
    <ol>
      <li><span class="step">Vérifier les hypothèses</span> : deux ondes de même fréquence, cohérentes (issues de la même source par division de son onde).</li>
      <li><span class="step">Identifier \(\mathcal{E}_1\) et \(\mathcal{E}_2\)</span> (intensité de chaque onde seule en \(M\)) et \(\Delta\varphi=2\pi\delta/\lambda_0\).</li>
      <li><span class="step">Appliquer</span> la formule de Fresnel :<div class="formula">$$\mathcal{E}=\mathcal{E}_1+\mathcal{E}_2+2\sqrt{\mathcal{E}_1\mathcal{E}_2}\cos\Delta\varphi$$</div>extrêmes \(\left(\sqrt{\mathcal{E}_1}\pm\sqrt{\mathcal{E}_2}\right)^2\) ; pour \(\mathcal{E}_1=\mathcal{E}_2=\mathcal{E}_0\), \(\mathcal{E}=2\mathcal{E}_0(1+\cos\Delta\varphi)\).</li>
      <li><span class="step">Contrôler</span> : \(0\le\mathcal{E}\le4\mathcal{E}_0\) pour deux intensités égales, et la moyenne sur une frange vaut \(\mathcal{E}_1+\mathcal{E}_2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> deux ondes de même intensité \(\mathcal{E}_0\), déphasées de \(2\pi/3\) (\(p=1/3\)) : \(\mathcal{E}=2\mathcal{E}_0\,(1-0{,}5)=\mathcal{E}_0\), le quart de l'intensité d'une frange brillante.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : additionner les amplitudes ou les intensités sans le terme croisé ; ou appliquer la formule à deux sources indépendantes (deux lampes, deux lasers), dont les intensités s'ajoutent simplement : \(\mathcal{E}=\mathcal{E}_1+\mathcal{E}_2\), sans franges.</div>

  <div class="method-box"><strong>Méthode 4 — Établir la différence de marche des trous d'Young</strong>
    <ol>
      <li><span class="step">Repère et convention.</span> \(O\) milieu des trous, \(S_1(a/2,0,0)\), \(S_2(-a/2,0,0)\), \(M(x,y,D)\) ; source sur l'axe, donc trous en phase et \(\delta=n\,(S_2M-S_1M)\).</li>
      <li><span class="step">Différence des carrés</span> : \(S_2M^2-S_1M^2=2ax\) (calcul exact).</li>
      <li><span class="step">Factoriser</span> : \(S_2M-S_1M=2ax/(S_1M+S_2M)\).</li>
      <li><span class="step">Approcher</span> : pour \(D\gg a,|x|,|y|\), \(S_1M+S_2M\approx2D\), d'où \(\delta\approx n\,a\,x/D\). Préciser les hypothèses sur la copie.</li>
    </ol>
    <p><em>Exemple éclair :</em> en observant à l'infini dans une direction \(\theta\) (plan focal d'une lentille), les rayons sont parallèles et \(\delta=n\,a\sin\theta\), projection de \(S_1S_2\) sur leur direction ; pour \(\theta\) petit, on retrouve \(\delta\approx n\,a\,\theta\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : développer chaque racine carrée séparément et s'arrêter trop tôt (on trouve \(\delta=0\)) ; la factorisation de la différence des carrés évite tout développement. Autre piège : le signe, qui dépend de la convention \(\delta=(S_2M)-(S_1M)\) et de la position de \(S_1\).</div>

  <div class="method-box"><strong>Méthode 5 — Décrire les franges et mesurer une longueur d'onde</strong>
    <ol>
      <li><span class="step">Intensité</span> : \(\mathcal{E}(x)=2\mathcal{E}_0\left[1+\cos(2\pi x/i)\right]\), avec \(i=\lambda_0D/(na)\).</li>
      <li><span class="step">Franges</span> : rectilignes, perpendiculaires à \(S_1S_2\) ; brillantes en \(x_p=p\,i\), sombres en \(\left(p+\tfrac12\right)i\) ; frange centrale brillante.</li>
      <li><span class="step">Mesure</span> : mesurer \(L\) sur \(N\) interfranges (\(N\) grand), \(i=L/N\), puis \(\lambda_0=n\,a\,i/D\) ; l'incertitude relative sur \(\lambda_0\) combine celles de \(a\), \(i\) et \(D\).</li>
    </ol>
    <p><em>Exemple éclair :</em> bifente \(a=0{,}25\ \text{mm}\), écran à \(D=2{,}00\ \text{m}\), 10 interfranges sur 46,2 mm : \(i=4{,}62\ \text{mm}\) et \(\lambda_0=a\,i/D=578\ \text{nm}\), le doublet jaune du mercure (577-579 nm).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Prévoir l'effet d'une lame ou d'un changement de milieu</strong>
    <ol>
      <li><span class="step">Nouveau chemin optique</span> de la voie concernée : \(+(n_\ell-1)\,e\).</li>
      <li><span class="step">Nouvelle différence de marche</span> : \(\delta'(x)=a\,x/D\pm(n_\ell-1)\,e\), avec le signe moins si la lame est devant \(S_1\) (puisque \(\delta=(S_2M)-(S_1M)\)), plus si elle est devant \(S_2\).</li>
      <li><span class="step">Frange centrale</span> : résoudre \(\delta'(x_0)=0\). Elle part vers la voie allongée ; la figure est translatée de \(N=(n_\ell-1)\,e/\lambda_0\) interfranges, sans changer d'interfrange.</li>
      <li><span class="step">Milieu d'indice \(n\)</span> partout : \(i\) est divisé par \(n\) (franges resserrées), la frange centrale ne bouge pas.</li>
    </ol>
    <p><em>Exemple éclair :</em> lame \(n_\ell=1{,}50\), \(e=12\ \mu\text{m}\), devant \(S_2\), \(\lambda_0=600\ \text{nm}\), \(a=0{,}50\ \text{mm}\), \(D=1{,}00\ \text{m}\) : \(N=0{,}50\times12/0{,}600=10\) interfranges, \(x_0=-(n_\ell-1)\,e\,D/a=-12\ \text{mm}\), du côté de \(S_2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : déplacer la figure du côté opposé à la lame. Pour annuler la différence de marche, il faut se rapprocher de la voie retardée, afin que son trajet géométrique raccourcisse.</div>

  <div class="method-box"><strong>Méthode 7 — Vérifier que deux ondes lumineuses peuvent interférer</strong>
    <ol>
      <li><span class="step">Même source ?</span> Les deux ondes doivent provenir de la division de l'onde issue d'un même point source (trous, fentes, lame séparatrice). Deux sources distinctes sont incohérentes : leurs intensités s'ajoutent.</li>
      <li><span class="step">Même fréquence ?</span> Sinon le déphasage varie dans le temps et le terme d'interférence se moyenne à zéro.</li>
      <li><span class="step">Recouvrement</span> : les deux faisceaux doivent se superposer (rôle de la diffraction par les trous) ; intensités voisines pour des franges bien contrastées.</li>
    </ol>
    <p><em>Exemple éclair :</em> un laser éclairant une bifente donne des franges ; deux lasers identiques éclairant chacun une fente n'en donnent pas ; une lampe blanche placée directement devant la bifente, sans fente source, donne une figure brouillée (chaque point de la lampe crée sa figure, décalée des autres : étude en 2ᵉ année).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Décrire la figure en lumière blanche</strong>
    <ol>
      <li><span class="step">Centre</span> : \(\delta=0\) pour toutes les couleurs, frange centrale blanche.</li>
      <li><span class="step">En un point de différence de marche \(\delta\)</span> : les radiations éteintes vérifient \(\lambda_0=\delta/(k+\tfrac12)\), les radiations renforcées \(\lambda_0=\delta/p\) ; ne garder que celles du visible (400 à 750 nm).</li>
      <li><span class="step">Conclure sur la teinte</span> : près du centre, une ou deux couleurs manquent, la frange est colorée ; loin du centre, de nombreuses radiations sont éteintes ou renforcées en alternance, le mélange paraît blanc.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\delta=1{,}2\ \mu\text{m}\) : éteinte \(\lambda_0=1{,}2/2{,}5=480\ \text{nm}\) (bleu), renforcées \(600\ \text{nm}\) et, au bord du visible, \(400\ \text{nm}\) : le point paraît orangé.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Diffraction par une fente et réseau (hors programme ; réseau vu en 2ᵉ année)</strong>
    <ol>
      <li><span class="step">Fente de largeur \(b\)</span> : minima dans les directions \(\sin\theta=m\lambda/b\) (\(m\neq0\)) ; sur un écran à la distance \(L\), tache centrale de largeur \(2L\lambda/b\). Plus la fente est étroite, plus la tache est large.</li>
      <li><span class="step">Réseau de pas \(d\)</span> en incidence normale : maxima pour \(d\sin\theta=p\lambda\) ; ordres possibles \(|p|\le d/\lambda\) ; en lumière blanche, chaque ordre \(p\neq0\) est un spectre.</li>
    </ol>
    <p><em>Exemple éclair :</em> réseau de 600 traits/mm (\(d=1{,}67\ \mu\text{m}\)), lumière du sodium à 589 nm : \(\sin\theta_1=0{,}353\), \(\theta_1=20{,}7^\circ\) ; \(d/\lambda=2{,}8\), donc deux ordres de chaque côté.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Lames minces : tenir compte du déphasage à la réflexion (hors programme, pour aller plus loin)</strong>
    <ol>
      <li><span class="step">Différence de marche géométrique</span> : \(2ne\) pour une lame d'épaisseur \(e\) et d'indice \(n\) en incidence quasi normale.</li>
      <li><span class="step">Ajouter \(\lambda_0/2\)</span> si <em>une seule</em> des deux ondes subit une réflexion sur un milieu plus réfringent (déphasage de \(\pi\)) ; si les deux en subissent une, les termes se compensent.</li>
      <li><span class="step">Conclure</span> : brillant si \(\delta=p\lambda_0\), sombre si \(\delta=\left(p+\tfrac12\right)\lambda_0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> film de savon (\(n=1{,}33\), \(e=300\ \text{nm}\)) vu en réflexion : \(\delta=2ne+\lambda_0/2\) ; renforcement pour \(2ne=\left(p-\tfrac12\right)\lambda_0\), soit \(\lambda_0=798\ \text{nm}/(p-\tfrac12)\) : seule \(\lambda_0=532\ \text{nm}\) (\(p=2\)) est visible, le film paraît vert.</p>
  </div>
  <div class="notice"><strong>Pièges classiques</strong> : ne pas confondre \(a\) (écart des trous) et \(D\) (distance de l'écran), ni l'écart \(a\) des fentes avec leur largeur \(b\) ; l'interfrange \(i=\lambda_0D/(na)\) ne dépend pas de l'ordre (franges équidistantes près de l'axe) ; diffraction et interférences se combinent : les franges d'Young se forment à l'intérieur de la tache de diffraction de chaque fente.</div>
</div>
</template>

    <p><strong>Q3.</strong> Non : une erreur de \(1\ \mu\text{m}\) sur \(e\) change \(\delta\) de \(0{,}5\ \mu\text{m}\), soit \(p\) de 0,8, presque une frange entière. \(p\) varie d'une unité quand \((n-1)\,\Delta e=\lambda_0\), soit \(\Delta e=\lambda_0/(n-1)=1{,}27\ \mu\text{m}\). C'est ce qui rend les interférences si précieuses pour mesurer de petites variations d'épaisseur ou d'indice.</p>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Formule de Fresnel : deux faisceaux inégaux</h3>
  <div class="statement">Deux ondes lumineuses cohérentes, de même fréquence, se superposent sur un écran. Mesurées séparément (en masquant l'autre), leurs intensités valent \(\mathcal{E}_1=9{,}0\ \text{W·m}^{-2}\) et \(\mathcal{E}_2=1{,}0\ \text{W·m}^{-2}\), uniformes sur la zone observée. La formule de Fresnel est fournie :<div class="formula">$$\mathcal{E}=\mathcal{E}_1+\mathcal{E}_2+2\sqrt{\mathcal{E}_1\mathcal{E}_2}\cos\Delta\varphi$$</div></div>
  <div class="q"><strong>Q1.</strong> Calculer les intensités des franges brillantes et des franges sombres.</div>
  <div class="q"><strong>Q2.</strong> Calculer l'intensité aux points où \(\Delta\varphi=\pi/3\), puis \(\pi/2\).</div>
  <div class="q"><strong>Q3.</strong> On remplace la seconde onde par celle d'une autre source, de même intensité et de même couleur. Qu'observe-t-on ? Comparer à la moyenne de \(\mathcal{E}\) sur une frange dans la situation initiale.</div>
  <div class="q"><strong>Q4.</strong> On veut des franges sombres parfaitement noires. Par quel facteur faut-il atténuer la première onde (avec un filtre gris) ? Que deviennent alors les franges brillantes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Franges brillantes (\(\cos\Delta\varphi=1\)) : \(\mathcal{E}_{\max}=\left(\sqrt{9{,}0}+\sqrt{1{,}0}\right)^2=16\ \text{W·m}^{-2}\). Franges sombres (\(\cos\Delta\varphi=-1\)) : \(\mathcal{E}_{\min}=(3{,}0-1{,}0)^2=4{,}0\ \text{W·m}^{-2}\). Les franges sombres ne sont pas noires, mais quatre fois moins lumineuses que les brillantes : la figure reste visible.</p>
    <p><strong>Q2.</strong> \(\Delta\varphi=\pi/3\) : \(\mathcal{E}=10+2\times3{,}0\times0{,}5=13\ \text{W·m}^{-2}\). \(\Delta\varphi=\pi/2\) : \(\mathcal{E}=10\ \text{W·m}^{-2}\) (terme d'interférence nul).</p>
    <p><strong>Q3.</strong> Deux sources différentes sont incohérentes : leur déphasage varie au hasard très vite, le terme d'interférence se moyenne à zéro et les intensités s'ajoutent : écran uniformément éclairé à \(10\ \text{W·m}^{-2}\), sans franges. C'est exactement la moyenne de \(\mathcal{E}\) sur une frange dans la situation cohérente : les interférences ne changent pas l'énergie reçue, elles la répartissent entre franges brillantes et sombres.</p>
    <p><strong>Q4.</strong> \(\mathcal{E}_{\min}=\left(\sqrt{\mathcal{E}_1}-\sqrt{\mathcal{E}_2}\right)^2\) est nul si \(\mathcal{E}_1=\mathcal{E}_2\) : il faut diviser \(\mathcal{E}_1\) par 9. Alors \(\mathcal{E}_{\max}=4\times1{,}0=4{,}0\ \text{W·m}^{-2}\) : les franges sont moins lumineuses, mais parfaitement contrastées.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Différence de marche : calcul exact et approximation</h3>
  <div class="statement">Trous d'Young distants de \(a=1{,}00\ \text{mm}\), dans l'air, éclairés en \(\lambda_0=550\ \text{nm}\) par une source placée sur leur médiatrice ; écran à \(D=1{,}50\ \text{m}\). Repère : \(O\) milieu des trous, \(S_1(a/2,0,0)\), \(S_2(-a/2,0,0)\) ; on étudie les points \(M(x,0,D)\) de l'écran et \(\delta=S_2M-S_1M\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\delta=\dfrac{2ax}{S_1M+S_2M}\) exactement.</div>
  <div class="q"><strong>Q2.</strong> En déduire l'expression approchée de \(\delta\) et préciser les hypothèses. Calculer \(\delta\) et l'ordre \(p\) en \(x=5{,}00\ \text{mm}\).</div>
  <div class="q"><strong>Q3.</strong> Le calcul exact donne \(\delta=3{,}333\,315\ \mu\text{m}\) en \(x=5{,}00\ \text{mm}\), et \(\delta=66{,}519\ \mu\text{m}\) en \(x=10{,}0\ \text{cm}\). Comparer à l'approximation, en exprimant l'écart en fraction de \(\lambda_0\). Conclure.</div>
  <div class="q"><strong>Q4.</strong> Calculer l'interfrange et le nombre de franges brillantes sur un écran de 2,0 cm de large centré sur l'axe.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S_1M^2=(x-a/2)^2+D^2\) et \(S_2M^2=(x+a/2)^2+D^2\), d'où</p><div class="formula">$$S_2M^2-S_1M^2=(x+a/2)^2-(x-a/2)^2=2ax$$</div><p> En factorisant le membre de gauche, \((S_2M-S_1M)(S_2M+S_1M)=2ax\), ce qui donne le résultat, sans aucune approximation.</p>
    <p><strong>Q2.</strong> Si \(D\gg a\) et \(D\gg|x|\), chaque distance vaut \(D\) au premier ordre, \(S_1M+S_2M\approx2D\), et \(\delta\approx ax/D\). En \(x=5{,}00\ \text{mm}\) : \(\delta=\dfrac{1{,}00\times10^{-3}\times5{,}00\times10^{-3}}{1{,}50}\), soit \(\delta=3{,}333\ \mu\text{m}\) et \(p=\delta/\lambda_0=6{,}06\) : on est tout près de la frange brillante d'ordre 6.</p>
    <p><strong>Q3.</strong> En \(x=5{,}00\ \text{mm}\), l'écart vaut \(0{,}02\ \text{nm}\), soit \(3\times10^{-5}\,\lambda_0\) : l'approximation est parfaite. En \(x=10{,}0\ \text{cm}\), l'approximation donne \(66{,}667\ \mu\text{m}\) : l'écart, \(0{,}15\ \mu\text{m}\), ne représente que 0,2 % de \(\delta\), mais \(0{,}27\,\lambda_0\), plus d'un quart de frange : la position des franges serait fausse. Ce qui compte n'est pas l'erreur relative sur \(\delta\), mais l'erreur comparée à \(\lambda_0\). Il faut \(|x|\ll D\) (ici, quelques centimètres au plus).</p>
    <p><strong>Q4.</strong> \(i=\lambda_0D/a\), soit \(i=550\times10^{-9}\times1{,}50/1{,}00\times10^{-3}\) \(=0{,}825\ \text{mm}\). Les franges brillantes sont en \(x_p=p\,i\) avec \(|x_p|\le10\ \text{mm}\), soit \(|p|\le12{,}1\) : ordres \(-12\) à \(12\), 25 franges brillantes.</p>
  </div>
</div>

<div class="exo">

  <h3>Réseau de diffraction — spectromètre (hors programme en PTSI, vu en 2ᵉ année)</h3>
  <div class="statement">Un réseau de diffraction a 500 traits/mm (\(d = 2\ \mu\text{m}\)). Il est éclairé en incidence normale. On admet la relation des réseaux \(d\sin\theta = m\lambda\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'angle de diffraction à l'ordre 1 pour \(\lambda = 550\ \text{nm}\).</div>
  <div class="q"><strong>Q2.</strong> Quel est l'ordre maximal observable ?</div>
  <div class="q"><strong>Q3.</strong> Deux raies de longueurs d'onde \(\lambda_1=589{,}0\ \text{nm}\) et \(\lambda_2=589{,}6\ \text{nm}\) (doublet du sodium) sont-elles séparées à l'ordre 1 ? (Différence angulaire \(\Delta\theta = m\Delta\lambda/(d\cos\theta)\).)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(d\sin\theta = m\lambda\). \(\sin\theta_1 = \lambda/d = 550\ \text{nm}/2\ \mu\text{m} = 0{,}275\). \(\theta_1 \approx 16°\).</p>
    <p><strong>Q2.</strong> \(|\sin\theta|\leq1\) → \(m\leq d/\lambda = 2\times10^{-6}/550\times10^{-9} = 3{,}6\) → \(m_{max} = 3\).</p>
    <p><strong>Q3.</strong> \(\Delta\lambda = 0{,}6\ \text{nm}\). \(\cos\theta_1 = \sqrt{1-0{,}275^2} \approx 0{,}962\). \(\Delta\theta = \dfrac{1\times0{,}6\times10^{-9}}{2\times10^{-6}\times0{,}962}\), soit \(\Delta\theta\approx 3{,}1\times10^{-4}\ \text{rad} \approx 1'\). Ce petit écart n'est visible que si les pics sont assez fins, donc si le réseau est éclairé sur assez de traits : le pouvoir de résolution vaut \(mN\) (\(N\) traits éclairés) et il faut \(mN\ge\lambda/\Delta\lambda\approx980\), soit au moins 2 mm de réseau éclairé à l'ordre 1.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Anneaux de Newton — mesure de rayon de courbure (hors programme, pour aller plus loin)</h3>
  <div class="statement">On observe en réflexion des anneaux de Newton entre une lentille plan-convexe et un plan de verre, en lumière monochromatique (\(\lambda=589\ \text{nm}\)). Le rayon du 10ᵉ anneau sombre est \(r_{10}=3\ \text{mm}\). On admet que le \(k\)-ième anneau sombre a pour rayon \(r_k=\sqrt{k\lambda R/n}\) quand l'espace entre la lentille et le plan est rempli d'un milieu d'indice \(n\) (air : \(n=1\)).</div>
  <div class="q"><strong>Q1.</strong> Le centre est-il brillant ou sombre ? Pourquoi ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le rayon de courbure \(R\) de la lentille.</div>
  <div class="q"><strong>Q3.</strong> Si on remplace l'air par de l'eau (\(n=1{,}33\)), comment varient les anneaux ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sombre. Au centre, l'épaisseur d'air est nulle (\(e=0\)) mais la réflexion sur le plan de verre (milieu plus réfringent que l'air) introduit un déphasage de \(\pi\), que ne subit pas l'onde réfléchie sur la face courbe (passage verre → air) : interférence destructive, tache sombre.</p>
    <p><strong>Q2.</strong> Anneau sombre \(k\) : \(r_k = \sqrt{k\lambda R}\). \(R = r_{10}^2/(10\lambda)\), soit</p><div class="formula">$$R=\frac{(3\times10^{-3})^2}{10\times589\times10^{-9}} = \frac{9\times10^{-6}}{5{,}89\times10^{-6}} \approx 1{,}53\ \text{m}$$</div><p>.</p>
    <p><strong>Q3.</strong> La différence de marche devient \(2ne\) : les anneaux se resserrent, leur rayon est divisé par \(\sqrt n\). Nouveau rayon du 10ᵉ : \(r'_{10} = 3/\sqrt{1{,}33} \approx 2{,}60\ \text{mm}\). Le centre reste sombre (eau entre deux verres d'indice 1,5 : une seule réflexion sur un milieu plus réfringent). Avec un liquide de même indice que le verre, les réflexions disparaîtraient et les anneaux aussi.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Limite de résolution d'un télescope (hors programme, pour aller plus loin)</h3>
  <div class="statement">Un télescope amateur a un diamètre d'objectif \(D=200\ \text{mm}\). On observe à \(\lambda=550\ \text{nm}\). On admet le critère de Rayleigh : deux points sont séparés si leur écart angulaire dépasse \(1{,}22\lambda/D\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la limite de résolution angulaire.</div>
  <div class="q"><strong>Q2.</strong> Deux étoiles séparées de \(\theta = 0{,}5''\) (seconde d'arc) sont-elles résolues ?</div>
  <div class="q"><strong>Q3.</strong> Sur la Lune (distance \(d=3{,}84\times10^5\ \text{km}\)), quelle est la plus petite structure résolvable ? Pourquoi ne peut-on pas voir depuis la Terre les modules lunaires des missions Apollo ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\theta_{min} = 1{,}22\lambda/D = 1{,}22\times550\times10^{-9}/0{,}2\), soit \(\theta_{min}=3{,}35\times10^{-6}\ \text{rad} \approx 0{,}69''\).</p>
    <p><strong>Q2.</strong> \(0{,}5'' \lt 0{,}69''\) → les deux étoiles ne sont pas résolues. Il faudrait un télescope de diamètre \(D \geq 1{,}22\lambda/\theta\), avec \(\theta=0{,}5''=2{,}42\times10^{-6}\ \text{rad}\), soit \(D\ge277\ \text{mm}\).</p>
    <p><strong>Q3.</strong> Taille minimale : \(s = d\cdot\theta_{min} = 3{,}84\times10^8\times3{,}35\times10^{-6}\), soit \(s\approx 1{,}3\ \text{km}\). Un module lunaire (environ 4 m) exigerait un télescope de plus de 60 m de diamètre (sans compter la turbulence de l'atmosphère). La sonde LRO, en orbite à une cinquantaine de kilomètres de la surface, les a photographiés avec une résolution d'environ 0,5 m : c'est sa proximité, bien plus que son optique, qui le permet.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Fentes de Young : mesure de l'indice de l'air et diffraction</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>optique ondulatoire</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Deux fentes fines parallèles \(S_1\) et \(S_2\), distantes de \(a = 0{,}50\ \text{mm}\), sont éclairées par une source monochromatique de longueur d'onde \(\lambda_0 = 600\ \text{nm}\) placée sur leur médiatrice. On observe les interférences sur un écran placé à \(D = 2{,}0\ \text{m}\) (\(D \gg a\)). Un point \(M\) de l'écran est repéré par son abscisse \(x\), comptée positivement du côté de \(S_1\) ; on note \(\delta=(S_2M)-(S_1M)\).
  </div>

  <p class="exo-part">Partie A — Interférences</p>
  <div class="q"><strong>A1.</strong> Établir l'expression de la différence de marche \(\delta\) en un point d'abscisse \(x\) de l'écran (approximation des petits angles), le dispositif étant dans le vide.</div>
  <div class="q"><strong>A2.</strong> En déduire l'interfrange \(i\) et le calculer. Donner la position des franges brillantes.</div>

  <p class="exo-part">Partie B — Mesure de l'indice de l'air</p>
  <p>On place devant chaque fente un tube de longueur intérieure \(L=5{,}00\ \text{cm}\), fermé par deux fenêtres de verre minces ; les deux tubes sont identiques et l'on y a fait le vide. On laisse ensuite l'air entrer lentement dans le tube placé devant \(S_1\), jusqu'à la pression atmosphérique ; l'autre tube reste vide. On note \(n\) l'indice de l'air.</p>
  <div class="q"><strong>B1.</strong> Pourquoi utiliser deux tubes identiques plutôt qu'un seul ?</div>
  <div class="q"><strong>B2.</strong> Exprimer la nouvelle différence de marche \(\delta'(x)\). Dans quel sens la figure se déplace-t-elle pendant l'entrée de l'air ?</div>
  <div class="q"><strong>B3.</strong> Un observateur voit défiler \(N=23{,}0\) franges en un point fixe de l'écran. En déduire \(n-1\).</div>
  <div class="q"><strong>B4.</strong> Le comptage est sûr à 0,1 frange près. Quelle est l'incertitude sur \(n-1\) ? Pourquoi ne peut-on pas simplement mesurer le déplacement de la frange centrale ?</div>

  <p class="exo-part">Partie C — Diffraction par les fentes (hors programme, pour aller plus loin)</p>
  <div class="q"><strong>C1.</strong> Chaque fente a une largeur \(b = 0{,}10\ \text{mm}\). On admet que la tache centrale de diffraction d'une fente s'étend sur l'écran entre \(x=\pm\lambda_0D/b\). Calculer sa largeur.</div>
  <div class="q"><strong>C2.</strong> Combien de franges brillantes d'interférence sont visibles dans la tache centrale de diffraction ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Avec \(S_1(a/2,0,0)\), \(S_2(-a/2,0,0)\) et \(M(x,y,D)\) : \(S_2M^2-S_1M^2=2ax\), donc \(S_2M-S_1M=2ax/(S_1M+S_2M)\). Pour \(D\gg a,|x|,|y|\), \(S_1M+S_2M\approx2D\) et, dans le vide, \(\delta = \dfrac{a\,x}{D}\).</p>
    <p><strong>A2.</strong> Franges brillantes : \(\delta = p\lambda_0\) (\(p\in\mathbb Z\)), soit \(x_p = p\dfrac{\lambda_0 D}{a}\). Interfrange : \(i = \dfrac{\lambda_0 D}{a} = \dfrac{600\times10^{-9}\times2{,}0}{0{,}50\times10^{-3}} = 2{,}4\ \text{mm}\).</p>
    <p><strong>B1.</strong> Les fenêtres de verre ajoutent un chemin optique ; avec un tube identique sur chaque voie, ces suppléments sont les mêmes et se compensent. Tubes vides, la figure est celle de la partie A (frange centrale en \(x=0\)) : seul l'air introduit ensuite crée une différence.</p>
    <p><strong>B2.</strong> Sur la voie 1, \(L\) de vide est remplacé par \(L\) d'air : \((S_1M)\) augmente de \((n-1)L\), donc \(\delta'(x)=\dfrac{ax}{D}-(n-1)L\). La frange d'ordre 0 passe en \(x_0=(n-1)LD/a\gt0\) : la figure se déplace progressivement vers le côté de \(S_1\), sans changer d'interfrange.</p>
    <p><strong>B3.</strong> En un point fixe, l'ordre varie de \((n-1)L/\lambda_0\) : c'est le nombre de franges qui défilent. \(n-1=N\lambda_0/L\), soit</p><div class="formula">$$n-1=\frac{23{,}0\times600\times10^{-9}}{5{,}00\times10^{-2}}=2{,}76\times10^{-4}$$</div><p>, soit \(n=1{,}000\,276\).</p>
    <p><strong>B4.</strong> \(\Delta(n-1)=\Delta N\,\lambda_0/L\), soit \(\Delta(n-1)=1{,}2\times10^{-6}\), moins de 0,5 % de \(n-1\) : la méthode est très sensible. La frange centrale se déplace de \(x_0=N\,i=23\times2{,}4=55\ \text{mm}\) : elle sort de la zone d'interférences (quelques centimètres, partie C) et, en lumière monochromatique, rien ne la distingue des autres franges. On compte donc les franges qui défilent pendant le remplissage.</p>
    <p><strong>C1.</strong> \(\lambda_0D/b=600\times10^{-9}\times2{,}0/10^{-4}=12\ \text{mm}\) : la tache centrale s'étend de \(-12\) à \(+12\ \text{mm}\), soit 24 mm de large.</p>
    <p><strong>C2.</strong> Les franges brillantes sont en \(x_p=p\times2{,}4\ \text{mm}\) ; elles sont dans la tache centrale si \(|x_p|\lt12\ \text{mm}\), soit \(|p|\lt5\) : ordres \(-4\) à \(4\), 9 franges brillantes. Les ordres \(\pm5\) tombent exactement sur les zéros de diffraction et sont éteints. On retrouve l'ordre de grandeur \(2a/b=10\) interfranges dans la tache. L'enveloppe de diffraction module l'intensité des franges d'interférence.</p>
  </div>
</div>
