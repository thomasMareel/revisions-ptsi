  <div class="sec-num">§1 · CONSTANTES FONDAMENTALES</div>
  <h2>Les valeurs numériques à connaître</h2>
  <div class="intro">Cette fiche regroupe les constantes et grandeurs usuelles indispensables aux applications numériques en physique et en chimie. Révise-les en mode actif via les flashcards de ce chapitre, ou dans le quiz avec le filtre <strong>« Grandeurs usuelles »</strong>.</div>
  <div class="prop-box">
    <ul style="margin-top:0.3rem">
      <li>Vitesse de la lumière dans le vide : \(c \approx 3{,}00\times10^{8}\ \mathrm{m\cdot s^{-1}}\)</li>
      <li>Constante de Planck : \(h \approx 6{,}63\times10^{-34}\ \mathrm{J\cdot s}\)</li>
      <li>Charge élémentaire : \(e \approx 1{,}60\times10^{-19}\ \mathrm{C}\)</li>
      <li>Constante d'Avogadro : \(N_A \approx 6{,}02\times10^{23}\ \mathrm{mol^{-1}}\)</li>
      <li>Constante des gaz parfaits : \(R \approx 8{,}314\ \mathrm{J\cdot K^{-1}\cdot mol^{-1}}\)</li>
      <li>Constante de Boltzmann : \(k_B \approx 1{,}38\times10^{-23}\ \mathrm{J\cdot K^{-1}}\) \((k_B = R/N_A)\)</li>
      <li>Permittivité du vide : \(\varepsilon_0 \approx 8{,}85\times10^{-12}\ \mathrm{F\cdot m^{-1}}\)</li>
      <li>Perméabilité du vide : \(\mu_0 = 4\pi\times10^{-7} \approx 1{,}26\times10^{-6}\ \mathrm{H\cdot m^{-1}}\)</li>
      <li>Gravitation universelle : \(G \approx 6{,}67\times10^{-11}\ \mathrm{N\cdot m^2\cdot kg^{-2}}\)</li>
      <li>Masse de l'électron : \(m_e \approx 9{,}11\times10^{-31}\ \mathrm{kg}\) ; du proton : \(m_p \approx 1{,}67\times10^{-27}\ \mathrm{kg}\)</li>
      <li>Constante de Faraday : \(F = N_A\,e \approx 9{,}65\times10^{4}\ \mathrm{C\cdot mol^{-1}}\)</li>
    </ul>
  </div>
  <div class="notice">Relations utiles : \(c = 1/\sqrt{\varepsilon_0\mu_0}\) et \(R = N_A\,k_B\).</div>
</div>
<div class="course-section">
  <div class="sec-num">§2 · GRANDEURS USUELLES</div>
  <h2>Valeurs courantes de référence</h2>
  <div class="prop-box">
    <ul style="margin-top:0.3rem">
      <li>Pesanteur terrestre : \(g \approx 9{,}81\ \mathrm{m\cdot s^{-2}}\)</li>
      <li>Pression atmosphérique normale : \(P_0 = 1{,}013\times10^{5}\ \mathrm{Pa} \approx 1\ \mathrm{bar}\) (1 bar \(=10^5\) Pa)</li>
      <li>Zéro Celsius : \(0\ ^\circ\mathrm{C} = 273{,}15\ \mathrm{K}\)</li>
      <li>Volume molaire d'un gaz parfait (0 °C, 1 bar) : \(V_m \approx 22{,}7\ \mathrm{L\cdot mol^{-1}}\) (22,4 sous 1 atm ; ≈ 24,8 à 25 °C et 1 bar)</li>
      <li>Masse volumique de l'eau : \(\rho \approx 1{,}00\times10^{3}\ \mathrm{kg\cdot m^{-3}}\)</li>
      <li>Capacité thermique massique de l'eau : \(c \approx 4{,}18\times10^{3}\ \mathrm{J\cdot kg^{-1}\cdot K^{-1}}\)</li>
      <li>Célérité du son dans l'air (20 °C) : \(\approx 340\ \mathrm{m\cdot s^{-1}}\)</li>
      <li>Électron-volt : \(1\ \mathrm{eV} = 1{,}60\times10^{-19}\ \mathrm{J}\)</li>
      <li>Indices de réfraction : \(n_{\text{air}} \approx 1{,}00\) ; \(n_{\text{eau}} \approx 1{,}33\)</li>
    </ul>
  </div>
