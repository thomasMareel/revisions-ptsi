  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(m\dot v=mg-\beta v^2\) (\(v\geq0\)). À la vitesse limite, \(\dot v=0\) : \(\beta=mg/v_{\text{lim}}^2\approx0{,}25\ \text{kg·m}^{-1}\).</p>
    <p><strong>Q2.</strong> \(\dot v=(v_{\text{lim}}/\tau)\,\mathrm{d}u/\mathrm{d}s\) et \(g-\beta v^2/m=g(1-u^2)\). Il faut \(v_{\text{lim}}/\tau=g\), soit \(\tau=v_{\text{lim}}/g\approx5{,}5\ \text{s}\). L'échelle de longueur est \(v_{\text{lim}}\tau\approx297\ \text{m}\).</p>
    <p><strong>Q3.</strong> À \(\tau=5{,}5\ \text{s}\) : \(v\approx0{,}762\times54\approx41\ \text{m·s}^{-1}\), après \(0{,}434\times297\approx129\ \text{m}\). À \(2\tau=11\ \text{s}\) : \(52\ \text{m·s}^{-1}\), 394 m. À \(3\tau=16{,}5\ \text{s}\) : \(53{,}7\ \text{m·s}^{-1}\), 686 m. 95 % sont atteints entre \(s=1{,}5\) et \(s=2\), vers \(s\approx1{,}8\), soit environ 10 s. En chute libre, la vitesse serait de \(54\ \text{m·s}^{-1}\) dès \(t=\tau\), et la chute en \(3\tau\) atteindrait \(\tfrac12g(3\tau)^2\approx1\,340\ \text{m}\) : le frottement divise la distance par deux.</p>
    <p><strong>Q4.</strong></p>
    <pre class="codeblock">g, m, beta = 9.81, 75.0, 0.25

<span class="kw">def</span> F(t, v):
    <span class="kw">return</span> g - beta / m * v * abs(v)   <span class="cmt"># axe vertical descendant</span>

ts, vs = euler(F, 0, 0.0, 0.05, 600)   <span class="cmt"># 30 s de chute</span></pre>
    <p>À la main avec \(h=2\ \text{s}\) : \(v_1=0+2\times9{,}81=19{,}6\ \text{m·s}^{-1}\) ; \(v_2=v_1+h\left(g-\tfrac{\beta}{m}v_1^2\right)\approx36{,}6\ \text{m·s}^{-1}\) (avec \(\beta/m\approx0{,}00336\ \text{m}^{-1}\)), contre 18,8 et 33,5 \(\text{m·s}^{-1}\) pour la solution exacte : 10 % d'écart. Le pas de 2 s n'est pas assez petit devant \(\tau=5{,}5\ \text{s}\) ; avec \(h=0{,}05\ \text{s}\) (soit \(\tau/110\)), l'écart tombe sous 0,3 %.</p>
    <p><strong>Q5.</strong> Juste après l'ouverture, \(m\dot v=mg-\beta v^2\) avec \(\beta=30\) : \(\dot v=9{,}81-30\times54^2/75\approx-1\,160\ \text{m·s}^{-2}\), soit une décélération d'environ \(120\,g\), mortelle. Nouvelle vitesse limite : \(\sqrt{mg/\beta}\approx5{,}0\ \text{m·s}^{-1}\). En réalité, la voile se déploie progressivement en 2 à 3 s, ce qui limite la décélération à quelques \(g\) : c'est l'une des fonctions de la conception d'un parachute.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Pendule simple : principe fondamental puis énergie</h3>
  <div class="statement">Un point \(M\) de masse \(m\) est suspendu à un fil inextensible, de masse négligeable et de longueur \(\ell\), attaché en un point fixe \(O\). Il oscille dans un plan vertical, sans frottement ; \(\theta\) est l'angle entre le fil et la verticale descendante.</div>
  <div class="q"><strong>Q1.</strong> Par le principe fondamental, établir l'équation différentielle vérifiée par \(\theta(t)\) et l'expression de la tension. Quelle est l'équation des petites oscillations ?</div>
  <div class="q"><strong>Q2.</strong> Retrouver l'équation du mouvement par conservation de l'énergie mécanique (chapitre « Énergie mécanique »).</div>
  <div class="q"><strong>Q3.</strong> Exprimer la vitesse de \(M\) au point le plus bas en fonction de l'angle maximal \(\theta_{\max}\), puis la tension en ce point. Application : \(\ell=1{,}0\ \text{m}\), \(\theta_{\max}=20^\circ\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Coordonnées polaires centrées en \(O\), \(r=\ell\) constant : \(\vec a=-\ell\dot\theta^2\,\vec e_r+\ell\ddot\theta\,\vec e_\theta\). Forces : \(\vec P=mg(\cos\theta\,\vec e_r-\sin\theta\,\vec e_\theta)\), \(\vec T=-T\,\vec e_r\). Sur \(\vec e_\theta\) : \(m\ell\ddot\theta=-mg\sin\theta\), soit \(\ddot\theta+\dfrac g\ell\sin\theta=0\). Sur \(\vec e_r\) : \(-m\ell\dot\theta^2=mg\cos\theta-T\), soit \(T=mg\cos\theta+m\ell\dot\theta^2\). Aux petits angles : \(\ddot\theta+\omega_0^2\theta=0\), \(\omega_0=\sqrt{g/\ell}\).</p>
    <p><strong>Q2.</strong> \(E_c=\tfrac12m\ell^2\dot\theta^2\) ; \(E_p=mg\ell(1-\cos\theta)\) (origine au point bas). La tension, perpendiculaire à la vitesse, ne travaille pas : \(E_m\) est constante. En dérivant :</p>
    <div class="formula">$$\frac{\mathrm{d}E_m}{\mathrm{d}t}=m\ell^2\dot\theta\ddot\theta+mg\ell\sin\theta\,\dot\theta=0$$</div>
    <p>et, en simplifiant par \(\dot\theta\) (non identiquement nul), \(\ell\ddot\theta+g\sin\theta=0\).</p>
    <p><strong>Q3.</strong> Conservation de \(E_m\) entre la position extrême (\(\dot\theta=0\)) et le point bas : \(\tfrac12mv^2=mg\ell(1-\cos\theta_{\max})\), d'où \(v=\sqrt{2g\ell(1-\cos\theta_{\max})}\). Tension au point bas : \(T=mg+mv^2/\ell=mg(3-2\cos\theta_{\max})\). Application : \(v\approx1{,}09\ \text{m·s}^{-1}\) et \(T\approx1{,}12\,mg\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Bille sur une demi-sphère : où décolle-t-elle ?</h3>
  <div class="statement">Une bille de masse \(m\) part, avec une vitesse négligeable, du sommet \(A\) d'une demi-sphère fixe de centre \(O\) et de rayon \(R\), posée sur sa base. Elle glisse sans frottement sur la surface extérieure. Sa position \(M\) est repérée par l'angle \(\theta\) entre \(\overrightarrow{OA}\) (vertical ascendant) et \(\overrightarrow{OM}\).</div>
  <div class="q"><strong>Q1.</strong> Établir \(v^2(\theta)\) par le théorème de l'énergie cinétique (chapitre « Énergie mécanique »).</div>
  <div class="q"><strong>Q2.</strong> Projeter le principe fondamental sur \(\vec e_r\) (radial, vers l'extérieur) et en déduire la réaction \(N(\theta)\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer l'angle \(\theta^\star\) auquel la bille quitte la sphère, et sa vitesse à cet instant pour \(R=1{,}0\ \text{m}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La réaction, normale à la surface, est perpendiculaire à la vitesse : elle ne travaille pas. Le poids travaille de \(mgR(1-\cos\theta)\) entre \(A\) (altitude \(R\)) et \(M\) (altitude \(R\cos\theta\)). D'où \(\tfrac12mv^2=mgR(1-\cos\theta)\), soit \(v^2=2gR(1-\cos\theta)\).</p>
    <p><strong>Q2.</strong> Polaires de centre \(O\), \(r=R\) : \(\vec a=-R\dot\theta^2\,\vec e_r+R\ddot\theta\,\vec e_\theta\). Sur \(\vec e_r\), dirigé vers l'extérieur : le poids \(-mg\,\vec e_z\) donne \(-mg\cos\theta\) (puisque \(\vec e_r\cdot\vec e_z=\cos\theta\)) ; la réaction, qui repousse la bille vers l'extérieur, donne \(+N\). D'où \(-mR\dot\theta^2=N-mg\cos\theta\), avec \(R\dot\theta^2=v^2/R\) :</p>
    <div class="formula">$$N=mg\cos\theta-\frac{mv^2}{R}=mg\cos\theta-2mg(1-\cos\theta)=mg(3\cos\theta-2)$$</div>
    <p><strong>Q3.</strong> Le contact cesse quand \(N\) s'annule : \(\cos\theta^\star=2/3\), soit \(\theta^\star\approx48{,}2^\circ\), indépendant de \(m\), de \(R\) et de \(g\). À cet instant \(v^2=2gR/3\), soit \(v\approx2{,}56\ \text{m·s}^{-1}\) pour \(R=1{,}0\ \text{m}\). La bille quitte alors la sphère et poursuit en chute libre parabolique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Looping : vitesse minimale et point de décollement</h3>
  <div class="statement">Un point matériel de masse \(m\) glisse sans frottement sur la face intérieure d'un rail circulaire vertical de rayon \(R\). Il est lancé du point le plus bas avec une vitesse \(v_0\). Sa position est repérée par l'angle \(\theta\) mesuré depuis le <strong>sommet</strong> du cercle (\(\theta=0\) au sommet, \(\theta=\pi\) au point bas).</div>
  <p class="exo-part">Partie A — Vitesse, réaction et condition de looping</p>
  <div class="q"><strong>A1.</strong> Montrer par conservation de l'énergie que \(v^2(\theta)=v_0^2-2gR(1+\cos\theta)\).</div>
  <div class="q"><strong>A2.</strong> Par le principe fondamental projeté sur la direction radiale, établir que \(N(\theta)=\dfrac{mv^2}{R}-mg\cos\theta=\dfrac{mv_0^2}{R}-mg(2+3\cos\theta)\).</div>
  <div class="q"><strong>A3.</strong> Le contact impose \(N\geq0\). Montrer que la position critique est le sommet et en déduire la vitesse minimale \(v_0^{\min}\) pour boucler le looping. Application : \(R=0{,}50\ \text{m}\).</div>
  <p class="exo-part">Partie B — Lancers insuffisants</p>
  <div class="q"><strong>B1.</strong> Pour \(2gR\lt v_0^2\lt5gR\), montrer que le point quitte le rail avant le sommet, et déterminer l'angle \(\theta^\star\) où \(N=0\). Application : \(v_0^2=3gR\).</div>
  <div class="q"><strong>B2.</strong> Pour \(v_0^2\lt2gR\), montrer que le point ne décolle jamais et oscille comme un pendule.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> L'altitude au-dessus du point bas vaut \(R(1+\cos\theta)\) (nulle en bas, \(2R\) au sommet). La réaction, normale à la vitesse, ne travaille pas : \(\tfrac12mv^2+mgR(1+\cos\theta)=\tfrac12mv_0^2\), d'où le résultat.</p>
    <p><strong>A2.</strong> Polaires de centre le centre du cercle : l'accélération radiale, dirigée vers le centre, vaut \(v^2/R\). La réaction du rail intérieur est dirigée vers le centre ; la composante du poids vers le centre vaut \(mg\cos\theta\) (au sommet, le poids pointe vers le centre). Donc \(mv^2/R=N+mg\cos\theta\), et en reportant A1 :</p>
    <div class="formula">$$N=\frac{mv_0^2}{R}-2mg(1+\cos\theta)-mg\cos\theta=\frac{mv_0^2}{R}-mg(2+3\cos\theta)$$</div>
    <p><strong>A3.</strong> \(N(\theta)\) est minimale où \(\cos\theta\) est maximal, au sommet : \(N_{\text{sommet}}=mv_0^2/R-5mg\). \(N\geq0\) impose \(v_0\geq\sqrt{5gR}\) ; pour \(R=0{,}50\ \text{m}\), \(v_0^{\min}\approx4{,}95\ \text{m·s}^{-1}\). Au sommet, la vitesse vaut alors \(\sqrt{gR}\) : le poids fournit exactement l'accélération centripète.</p>
    <p><strong>B1.</strong> \(N=0\) donne \(\cos\theta^\star=\tfrac13\left(\dfrac{v_0^2}{gR}-2\right)\), compris entre 0 et 1 pour \(2gR\lt v_0^2\lt5gR\) : \(\theta^\star\) est dans la moitié haute. La vitesse, elle, ne s'annulerait qu'en \(\cos\theta=v_0^2/(2gR)-1\), plus loin : le point décolle avec une vitesse non nulle et devient un projectile. Pour \(v_0^2=3gR\) : \(\cos\theta^\star=1/3\), \(\theta^\star\approx70{,}5^\circ\) depuis le sommet.</p>
    <p><strong>B2.</strong> Si \(v_0^2\lt2gR\), la vitesse s'annule pour \(\cos\theta=v_0^2/(2gR)-1\lt0\), donc dans la moitié basse (\(\theta\gt90^\circ\)). Sur cette moitié, \(\cos\theta\lt0\) et \(N=mv^2/R-mg\cos\theta\gt0\) : le contact est maintenu. Le point remonte, s'arrête, redescend : il oscille autour du point bas comme un pendule.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Un wagon qui se remplit de sable : choisir un système fermé</h3>
  <div class="statement">Un wagon de masse \(m_0=2{,}0\ \text{t}\) roule sur des rails horizontaux. À partir de \(t=0\), il passe sous une trémie qui déverse du sable verticalement, avec un débit massique \(D_m=400\ \text{kg·s}^{-1}\) ; le sable n'a pas de vitesse horizontale quand il atteint le wagon. On néglige les frottements. On note \(m(t)=m_0+D_mt\) la masse du wagon et du sable qu'il contient.</div>
  <div class="q"><strong>Q1.</strong> Pourquoi ne peut-on pas écrire \(m(t)\,\mathrm{d}v/\mathrm{d}t=\sum F_x\) pour le système {wagon + sable contenu} ? Définir un système fermé entre \(t\) et \(t+\mathrm{d}t\) et exprimer sa quantité de mouvement horizontale à ces deux instants.</div>
  <div class="q"><strong>Q2.</strong> Le wagon est libre (aucune force horizontale). Montrer que \(m(t)\,v(t)\) se conserve. Partant de \(v_0=1{,}5\ \text{m·s}^{-1}\), quelle est sa vitesse au bout de 10 s ?</div>
  <div class="q"><strong>Q3.</strong> Une locomotive tire le wagon à vitesse constante \(v=1{,}5\ \text{m·s}^{-1}\). Quelle force horizontale doit-elle exercer ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Ce système n'est pas fermé : il gagne du sable. Les lois de Newton portent sur une matière donnée. Système fermé \(\Sigma\) : le wagon, le sable qu'il contient à \(t\), et la masse \(D_m\,\mathrm{d}t\) de sable qui va y tomber entre \(t\) et \(t+\mathrm{d}t\). Quantité de mouvement horizontale : à \(t\), \(p_x(t)=m(t)\,v(t)+D_m\mathrm{d}t\times0\) ; à \(t+\mathrm{d}t\), tout le sable est dans le wagon : \(p_x(t+\mathrm{d}t)=(m+D_m\mathrm{d}t)\,v(t+\mathrm{d}t)\). Le principe fondamental appliqué à \(\Sigma\) donne \(\mathrm{d}p_x/\mathrm{d}t=\sum F_{x,\text{ext}}\), avec \(\mathrm{d}p_x/\mathrm{d}t=\dfrac{\mathrm{d}(mv)}{\mathrm{d}t}\).</p>
    <p><strong>Q2.</strong> Sans force horizontale, \(\mathrm{d}(mv)/\mathrm{d}t=0\) : \(m(t)\,v(t)=m_0v_0\), d'où \(v(t)=\dfrac{m_0v_0}{m_0+D_mt}\). À \(t=10\ \text{s}\), \(m=6{,}0\ \text{t}\) et \(v=2{,}0\times1{,}5/6{,}0=0{,}50\ \text{m·s}^{-1}\). Le wagon ralentit sans qu'aucune force ne le freine de l'extérieur : il doit mettre en mouvement le sable qui arrive.</p>
    <p><strong>Q3.</strong> \(v\) constante : \(F=\mathrm{d}(mv)/\mathrm{d}t=v\,\mathrm{d}m/\mathrm{d}t\), soit \(F=D_mv=600\ \text{N}\). Écrire \(m\,\mathrm{d}v/\mathrm{d}t=F\) aurait donné \(F=0\) : c'est l'erreur qu'évite le choix d'un système fermé.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le volant de badminton</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>principe fondamental, frottement quadratique, vitesse limite, équation adimensionnée, méthode d'Euler</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un volant de badminton (\(m=5{,}0\ \text{g}\), jupe de diamètre \(D=6{,}5\ \text{cm}\)) part très vite et retombe presque à la verticale : sa trajectoire ne ressemble pas du tout à une parabole. On l'étudie dans le référentiel terrestre, galiléen, assimilé à un point. Air : \(\rho=1{,}2\ \text{kg·m}^{-3}\), \(\eta=1{,}8\times10^{-5}\ \text{Pa·s}\) ; \(g=9{,}81\ \text{m·s}^{-2}\). Lâché d'une hauteur suffisante, le volant atteint une vitesse limite mesurée de \(v_{\text{lim}}=6{,}8\ \text{m·s}^{-1}\). Un joueur frappe un « dégagement » : le volant part à \(h_0=2{,}5\ \text{m}\) du sol, à \(v_0=30\ \text{m·s}^{-1}\), sous \(\alpha=45^\circ\). Le terrain mesure 13,4 m de long.
  </div>
  <p class="exo-part">Partie A — Un modèle sans frottement ?</p>
  <div class="q"><strong>A1.</strong> Sans frottement, calculer la portée (point d'impact au sol) et la hauteur maximale. Conclure.</div>
  <div class="q"><strong>A2.</strong> En admettant un frottement quadratique, calculer le rapport entre la traînée et le poids au départ.</div>
  <p class="exo-part">Partie B — Modèle quadratique</p>
  <div class="q"><strong>B1.</strong> Exprimer \(\beta\) à l'aide de \(v_{\text{lim}}\) et le calculer. En déduire le coefficient \(C_x\), avec \(\beta=\tfrac12\rho C_xS\) et \(S\) la section de la jupe.</div>
  <div class="q"><strong>B2.</strong> Calculer le nombre de Reynolds au départ et à la vitesse limite. Le modèle est-il justifié ?</div>
  <div class="q"><strong>B3.</strong> Écrire l'équation vectorielle du mouvement. En posant \(\vec u=\vec v/v_{\text{lim}}\), \(s=t/\tau\) avec \(\tau=v_{\text{lim}}/g\), et en mesurant les longueurs en unités de \(L=v_{\text{lim}}\tau\), montrer qu'elle devient \(\dfrac{\mathrm{d}\vec u}{\mathrm{d}s}=-\vec e_z-\|\vec u\|\,\vec u\) (axe \(Oz\) ascendant). Calculer \(\tau\) et \(L\). Quels paramètres sans dimension restent dans le problème ?</div>
  <p class="exo-part">Partie C — Le début du vol : un « mur » aérodynamique</p>
  <div class="q"><strong>C1.</strong> Au début du vol, on néglige le poids. Montrer que le mouvement est rectiligne et que \(\dfrac{1}{v}-\dfrac{1}{v_0}=\dfrac{t}{L}\) (séparer les variables). En déduire \(v(t)\), puis la distance parcourue \(x(t)=L\ln(1+v_0t/L)\).</div>
  <div class="q"><strong>C2.</strong> Calculer la durée et la distance nécessaires, dans ce modèle, pour que la vitesse tombe à \(v_{\text{lim}}\). Pourquoi cette estimation n'est-elle qu'un ordre de grandeur ?</div>
  <p class="exo-part">Partie D — Simulation par la méthode d'Euler</p>
  <div class="q"><strong>D1.</strong> Écrire la fonction <span class="code-inline">F(t, Y)</span> du vecteur d'état \(Y=(x,z,v_x,v_z)\), puis l'appel à la fonction <span class="code-inline">euler</span> du cours et la recherche de l'instant où le volant touche le sol.</div>
  <div class="q"><strong>D2.</strong> Avec \(h=1\ \text{ms}\), le programme donne : portée 9,31 m, durée de vol 2,22 s, hauteur maximale 6,76 m atteinte à 5,9 m du joueur, vitesse à l'arrivée \(6{,}6\ \text{m·s}^{-1}\) inclinée de 83° sur l'horizontale. Avec \(h=10\ \text{ms}\) : 9,23 m ; avec \(h=0{,}1\ \text{ms}\) : 9,32 m. Commenter ces résultats (comparaison avec la partie A, choix du pas, forme de la fin de trajectoire).</div>
  <div class="q"><strong>D3.</strong> Une série de simulations montre que la portée est maximale (10,5 m) pour un angle de départ d'environ 24°. Pourquoi cet angle est-il bien inférieur à 45° ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(v_0\cos\alpha=v_0\sin\alpha\approx21{,}2\ \text{m·s}^{-1}\). Arrivée au sol : \(4{,}905\,t^2-21{,}2\,t-2{,}5=0\), \(t\approx4{,}44\ \text{s}\), portée \(\approx94\ \text{m}\) ; hauteur maximale \(2{,}5+21{,}2^2/(2g)\approx25\ \text{m}\). Sept fois la longueur du terrain : le modèle sans frottement est absurde pour un volant.</p>
    <p><strong>A2.</strong> À la vitesse limite, traînée et poids sont égaux : \(\beta v_{\text{lim}}^2=mg\). Donc \(\beta v_0^2/(mg)=(v_0/v_{\text{lim}})^2=(30/6{,}8)^2\approx19\) : au départ, la traînée vaut vingt fois le poids.</p>
    <p><strong>B1.</strong> \(\beta=mg/v_{\text{lim}}^2\approx1{,}06\times10^{-3}\ \text{kg·m}^{-1}\). \(S=\pi D^2/4\approx3{,}3\times10^{-3}\ \text{m}^2\), d'où \(C_x=2\beta/(\rho S)\approx0{,}53\), valeur typique d'un objet non profilé.</p>
    <p><strong>B2.</strong> \(\mathrm{Re}=\rho vD/\eta\) : \(1{,}3\times10^{5}\) au départ, \(3\times10^{4}\) à \(v_{\text{lim}}\). Toujours \(\gg10^{3}\) : le modèle quadratique est justifié pendant tout le vol.</p>
    <p><strong>B3.</strong> \(m\,\dfrac{\mathrm{d}\vec v}{\mathrm{d}t}=m\vec g-\beta\|\vec v\|\,\vec v\). Avec \(\vec v=v_{\text{lim}}\vec u\), \(t=\tau s\) et \(\beta/m=g/v_{\text{lim}}^2\) :</p>
    <div class="formula">$$\frac{v_{\text{lim}}}{\tau}\,\frac{\mathrm{d}\vec u}{\mathrm{d}s}=-g\,\vec e_z-g\,\|\vec u\|\,\vec u$$</div>
    <p>et \(v_{\text{lim}}/\tau=g\) donne l'équation annoncée. \(\tau=6{,}8/9{,}81\approx0{,}69\ \text{s}\), \(L=v_{\text{lim}}^2/g\approx4{,}7\ \text{m}\). Restent les conditions initiales sans dimension : \(u_0=v_0/v_{\text{lim}}\approx4{,}4\), l'angle \(\alpha\) et la hauteur \(h_0/L\approx0{,}53\). Deux volants lancés avec les mêmes \(u_0\), \(\alpha\) et \(h_0/L\) ont des trajectoires semblables.</p>
    <p><strong>C1.</strong> Sans le poids, la seule force est opposée à la vitesse : la direction de \(\vec v\) ne change pas, le mouvement est rectiligne. Le long de cette droite, \(m\,\mathrm{d}v/\mathrm{d}t=-\beta v^2\), soit \(\mathrm{d}v/v^2=-(\beta/m)\,\mathrm{d}t\), avec \(m/\beta=L\). En intégrant : \(1/v-1/v_0=t/L\), donc \(v=\dfrac{v_0}{1+v_0t/L}\), puis \(x=\displaystyle\int_0^tv\,\mathrm{d}t'=L\ln(1+v_0t/L)\).</p>
    <p><strong>C2.</strong> \(v=v_{\text{lim}}\) pour \(t_1=\dfrac{L}{v_0}\left(\dfrac{v_0}{v_{\text{lim}}}-1\right)\approx0{,}54\ \text{s}\), après \(x_1=L\ln(v_0/v_{\text{lim}})\approx7{,}0\ \text{m}\). Le volant perd les trois quarts de sa vitesse en quelques mètres, en ligne droite : c'est le « mur ». L'estimation suppose le poids négligeable, ce qui n'est vrai que tant que \(v\gg v_{\text{lim}}\) ; vers la fin, le poids compte autant que la traînée (la simulation donne \(v=v_{\text{lim}}\) dès 0,44 s, à 4,5 m du joueur, car le poids freine aussi la montée).</p>
    <p><strong>D1.</strong></p>
    <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

g, m, vlim = 9.81, 5.0e-3, 6.8
k = g / vlim**2                                <span class="cmt"># beta / m</span>

<span class="kw">def</span> F(t, Y):
    x, z, vx, vz = Y
    v = np.sqrt(vx**2 + vz**2)
    <span class="kw">return</span> np.array([vx, vz, -k * v * vx, -g - k * v * vz])

Y0 = np.array([0.0, 2.5, 30 * np.cos(np.pi / 4), 30 * np.sin(np.pi / 4)])
ts, Ys = euler(F, 0, Y0, 0.001, 5000)          <span class="cmt"># 5 s au plus</span>
i = next(j <span class="kw">for</span> j, Y <span class="kw">in</span> enumerate(Ys) <span class="kw">if</span> Y[1] &lt; 0)
print(Ys[i][0], ts[i])                         <span class="cmt"># portée, durée du vol</span></pre>
    <p><strong>D2.</strong> La portée réelle (9,3 m) est dix fois plus faible que sans frottement : le dégagement retombe dans le terrain. La hauteur maximale est atteinte au-delà du milieu (à 5,9 m sur 9,3 m), et la trajectoire est très dissymétrique : montée tendue, puis chute presque verticale à une vitesse voisine de \(v_{\text{lim}}\) (le volant a « oublié » sa vitesse horizontale). Le pas : l'échelle de temps la plus courte est celle du début, \(L/v_0\approx0{,}16\ \text{s}\) ; \(h=1\ \text{ms}\) est 160 fois plus petit, et passer à \(0{,}1\ \text{ms}\) ne change la portée que d'un centimètre, tandis que \(h=10\ \text{ms}\) l'altère de 8 cm. (La fonction <span class="code-inline">odeint</span> donne aussi 9,32 m.)</p>
    <p><strong>D3.</strong> La portée se joue presque entièrement pendant la phase tendue du début, où le volant file en ligne droite sur quelques \(L\) avant de retomber : un départ plus horizontal envoie cette distance vers l'avant au lieu de la gaspiller à monter. Le résultat sans frottement (45°) ne vaut plus quand la traînée domine le poids.</p>
  </div>
</div>
