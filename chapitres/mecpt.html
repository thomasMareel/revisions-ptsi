  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie 2.2 du programme de PTSI, « Lois de Newton » (premier semestre). Il s'appuie sur la cinématique (chapitre « Cinématique du point ») et prépare les chapitres « Énergie mécanique », « Oscillateurs harmoniques », « Moment cinétique » et « Mouvement dans un champ central ». La force de Lorentz est étudiée dans « Particules chargées », la force de Laplace dans « Champ magnétique et actions de Laplace » ; le frottement solide est traité en sciences industrielles (« Statique »).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Masse d'un système</strong> : exploiter la conservation de la masse pour un système fermé (§1).</li>
        <li><strong>Quantité de mouvement</strong> d'un point et d'un système de points ; lien avec la vitesse du centre de masse : établir \(\vec p=m\,\vec v(G)\) pour un système de deux points (§1).</li>
        <li><strong>Première loi de Newton, référentiels galiléens</strong> : décrire le mouvement relatif de deux référentiels galiléens (§2).</li>
        <li><strong>Notion de force, troisième loi de Newton</strong> : établir un bilan des forces sur un système, ou sur plusieurs systèmes en interaction, et en rendre compte sur un schéma (§3, §4, §6).</li>
        <li><strong>Deuxième loi de Newton</strong> : déterminer les équations du mouvement d'un point matériel ou du centre de masse d'un système fermé dans un référentiel galiléen (§4).</li>
        <li><strong>Force de gravitation, champ de pesanteur uniforme</strong> : étudier le mouvement d'un point dans un champ de pesanteur uniforme, en l'absence de frottement (§5, §7).</li>
        <li><strong>Frottement fluide</strong> : modèles linéaire et quadratique, influence de la résistance de l'air sur une chute ; exploiter une équation différentielle sans la résoudre analytiquement (ordres de grandeur, vitesse limite, résultats d'une simulation numérique) ; écrire une équation adimensionnée ; mesurer un frottement fluide (§8, §9, §10).</li>
        <li><strong>Méthode d'Euler</strong> (capacité numérique) : résoudre une équation différentielle d'ordre 1, et d'ordre 2 en la transformant en système d'ordre 1 (§10).</li>
        <li><strong>Tension d'un fil, pendule simple</strong> : établir l'équation du mouvement ; justifier l'analogie avec l'oscillateur harmonique dans l'approximation linéaire (§6, §11).</li>
      </ul>
      <p>Hors programme de physique-chimie (regroupé en fin de chapitre) : les lois de Coulomb du frottement solide (au programme de sciences industrielles), les systèmes ouverts (fusée) et les référentiels non galiléens.</p>

<div class="course-section">
  <div class="sec-num">§1 · SYSTÈME, MASSE ET QUANTITÉ DE MOUVEMENT</div>
  <h2>Ce que l'on étudie : un système fermé</h2>
  <div class="intro">Les lois de Newton portent sur un système bien défini. Avant d'écrire une seule force, il faut dire ce que l'on étudie, vérifier que sa masse ne change pas, et savoir ce que devient sa quantité de mouvement quand il comporte plusieurs parties.</div>
  <div class="def-box">
    <strong>Système, masse.</strong> Un système est un ensemble de matière délimité par une frontière choisie. Il est <strong>fermé</strong> s'il n'échange pas de matière avec l'extérieur. La masse est additive, et la masse d'un système fermé est <strong>constante</strong> (conservation de la masse). Un <strong>point matériel</strong> est un système dont on ne retient que la masse \(m\) et la position d'un point : modèle valable si ses dimensions sont petites devant les distances parcourues et si sa rotation propre n'intervient pas.
  </div>
  <div class="def-box">
    <strong>Centre de masse, quantité de mouvement.</strong> Pour un système de points \(M_i\) de masses \(m_i\) et de masse totale \(m=\sum m_i\), le centre de masse \(G\) est défini par \(m\,\overrightarrow{OG}=\sum m_i\,\overrightarrow{OM_i}\). La quantité de mouvement d'un point est \(\vec p=m\,\vec v\) (en \(\text{kg·m·s}^{-1}\)) ; celle d'un système est la somme \(\vec p=\sum m_i\,\vec v_i\).
  </div>
  <div class="prop-box">
    <strong>Quantité de mouvement d'un système fermé.</strong> Elle est celle d'un point unique, de masse \(m\), placé en \(G\) :
    <div class="formula" data-nom="Quantité de mouvement d'un système fermé">$$\vec p=m\,\vec v(G)$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Système de deux points</span><div class="content">
    <p>Pour deux points de masses \(m_1\) et \(m_2\) :</p>
    <div class="formula">$$(m_1+m_2)\,\overrightarrow{OG}=m_1\,\overrightarrow{OM_1}+m_2\,\overrightarrow{OM_2}$$</div>
    <p>Le système est fermé : \(m_1\) et \(m_2\) sont constantes. En dérivant par rapport au temps dans le référentiel d'étude :</p>
    <div class="formula">$$(m_1+m_2)\,\vec v(G)=m_1\,\vec v_1+m_2\,\vec v_2=\vec p$$</div>
    <p>La démonstration utilise la constance des masses : elle tombe en défaut pour un système qui perd ou gagne de la matière.</p>
  </div></div>
  <div class="method-box">
    <strong>Exemple — deux wagons et le système Terre-Lune</strong>
    <ol>
      <li>Un wagon de 20 t roule à \(1{,}5\ \text{m·s}^{-1}\) vers un wagon de 30 t qui avance dans le même sens à \(0{,}50\ \text{m·s}^{-1}\). Quantité de mouvement : \(\vec p=(20\times1{,}5+30\times0{,}50)\times10^{3}=4{,}5\times10^{4}\ \text{kg·m·s}^{-1}\) dans le sens du mouvement ; centre de masse à \(v(G)=4{,}5\times10^{4}/5{,}0\times10^{4}=0{,}90\ \text{m·s}^{-1}\).</li>
      <li>Terre (\(5{,}97\times10^{24}\ \text{kg}\)) et Lune (\(7{,}35\times10^{22}\ \text{kg}\)) distantes de \(3{,}84\times10^{8}\ \text{m}\) : le centre de masse est sur la droite Terre-Lune, à \(d\,m_L/(m_T+m_L)\approx4\,670\ \text{km}\) du centre de la Terre, donc à l'intérieur de celle-ci (\(R_T=6\,371\ \text{km}\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les lois de Newton à un système dont la masse change (un camion qui perd sa cargaison, une fusée qui éjecte ses gaz) en écrivant \(m\,\vec a=\sum\vec F\) avec \(m(t)\). Ces lois valent pour un <strong>système fermé</strong> : on choisit la frontière de façon à suivre toujours la même matière (par exemple le camion et toute sa cargaison, y compris celle déjà tombée).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RÉFÉRENTIELS GALILÉENS ET PRINCIPE D'INERTIE</div>
  <h2>Le cadre dans lequel les lois de Newton s'appliquent</h2>
  <div class="intro">Les lois de Newton ne valent pas dans n'importe quel référentiel : dans un bus qui freine, une bouteille posée sur le sol se met à rouler sans qu'aucune force horizontale ne la pousse. La première loi définit les référentiels où les choses se passent simplement.</div>
  <div class="prop-box">
    <strong>Première loi de Newton (principe d'inertie).</strong> Il existe des référentiels, dits <strong>galiléens</strong>, dans lesquels tout point matériel isolé (soumis à aucune force) ou pseudo-isolé (soumis à des forces de somme nulle) est au repos ou en mouvement rectiligne uniforme.
  </div>
  <div class="prop-box">
    <strong>Mouvement relatif de deux référentiels galiléens.</strong> Si \(\mathcal R\) est galiléen, un référentiel \(\mathcal R'\) est galiléen si et seulement s'il est en <strong>translation rectiligne uniforme</strong> par rapport à \(\mathcal R\). Les vitesses d'un même point dans les deux référentiels diffèrent alors d'un vecteur constant \(\vec V\) : \(\vec v_{\mathcal R}=\vec v_{\mathcal R'}+\vec V\). Les accélérations sont donc égales, et les lois de Newton s'écrivent de la même façon dans les deux.
  </div>
  <div class="method-box">
    <strong>Exemple — le train qui roule, puis qui freine</strong>
    <ol>
      <li>Un TGV roule en ligne droite à 300 km/h constants. Une bille lâchée tombe à la verticale du point de lâcher, comme sur le quai : le référentiel du train est galiléen (autant que le référentiel terrestre), et les deux observateurs écrivent la même équation \(m\vec a=m\vec g\).</li>
      <li>Le train freine à \(1{,}0\ \text{m·s}^{-2}\). Une bouteille posée sur le plancher lisse accélère vers l'avant à \(1{,}0\ \text{m·s}^{-2}\) par rapport au wagon, alors que la somme des forces horizontales qu'elle subit est nulle : le référentiel du train n'est plus galiléen. Dans le référentiel terrestre, tout est simple : la bouteille continue à 300 km/h, c'est le wagon qui ralentit.</li>
    </ol>
  </div>
  <h3>Référentiels usuels</h3>
  <ul>
    <li><strong>Référentiel de Copernic</strong> : origine au centre de masse du système solaire, axes dirigés vers trois étoiles lointaines. Galiléen avec une excellente précision ; le référentiel <strong>héliocentrique</strong> (origine au centre du Soleil, mêmes axes) l'est presque autant.</li>
    <li><strong>Référentiel géocentrique</strong> : origine au centre de la Terre, axes parallèles à ceux de Copernic. Il est en translation, mais pas rectiligne uniforme : son origine décrit l'orbite terrestre en un an. Il est galiléen pour des phénomènes de durée petite devant <strong>1 an</strong>, comme le mouvement d'un satellite artificiel.</li>
    <li><strong>Référentiel terrestre</strong> : lié au sol. Il tourne en 23 h 56 min par rapport au référentiel géocentrique. Il est galiléen pour des phénomènes de durée petite devant <strong>1 jour</strong> et d'extension faible devant le rayon terrestre : c'est le cas de presque toutes les expériences de laboratoire.</li>
  </ul>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Défaut du référentiel</th><th style="text-align:left">Accélération en cause</th><th style="text-align:left">Comparée à \(g\)</th></tr>
    <tr><td>géocentrique (orbite autour du Soleil)</td><td>\(5{,}9\times10^{-3}\ \text{m·s}^{-2}\)</td><td>\(6\times10^{-4}\)</td></tr>
    <tr><td>terrestre (rotation propre, à l'équateur)</td><td>\(3{,}4\times10^{-2}\ \text{m·s}^{-2}\)</td><td>\(3{,}5\times10^{-3}\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — le pendule de Foucault</strong>
    <p>En 1851, Foucault suspend un pendule de 67 m sous la coupole du Panthéon. Le plan d'oscillation tourne lentement par rapport au sol, de \(15^\circ/\text{h}\times\sin\lambda\) à la latitude \(\lambda\) : à Paris (\(\lambda=48{,}85^\circ\)), \(11{,}3^\circ\) par heure, soit un tour en 32 h.</p>
    <ol>
      <li>Sur une oscillation (16 s), la rotation du plan vaut \(0{,}05^\circ\) : invisible. Le référentiel terrestre est galiléen pour cette durée.</li>
      <li>Sur plusieurs heures, la rotation est évidente : le référentiel terrestre n'est pas galiléen à l'échelle du jour. C'est une preuve, sans regarder le ciel, de la rotation de la Terre.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire que le référentiel géocentrique est galiléen « pour des durées petites devant un jour ». Le référentiel géocentrique ne tourne pas avec la Terre : sa seule limite est le mouvement orbital, de période <strong>un an</strong>. C'est le référentiel <strong>terrestre</strong>, entraîné par la rotation propre de la Terre, qui est limité aux durées petites devant un jour. Autre piège : un référentiel en rotation uniforme n'est pas galiléen, même si sa vitesse angulaire est constante.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FORCES ET TROISIÈME LOI DE NEWTON</div>
  <h2>Modéliser les actions : le bilan des forces</h2>
  <div class="intro">Une force modélise l'action d'un objet sur un autre. Toute la difficulté d'un problème de dynamique est souvent là : n'oublier aucune force, n'en inventer aucune, et ne pas confondre les forces qui s'exercent sur des systèmes différents.</div>
  <div class="def-box">
    <strong>Force.</strong> Une force est représentée par un vecteur (direction, sens, norme en newtons, N) et un point d'application. On distingue les <strong>actions à distance</strong> (gravitation, forces électrique et magnétique) et les <strong>actions de contact</strong> (réaction d'un support, tension d'un fil, force d'un ressort, frottements), qui n'existent que là où le système touche autre chose. Pour un système, une force est <strong>intérieure</strong> si elle est exercée par une partie du système sur une autre, <strong>extérieure</strong> sinon.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Force</th><th style="text-align:left">Expression</th><th style="text-align:left">Où</th></tr>
    <tr><td>gravitation, poids</td><td>\(G\,m_1m_2/r^2\) ; \(\vec P=m\vec g\)</td><td>§5</td></tr>
    <tr><td>réaction d'un support</td><td>\(\vec N\) (normale), inconnue</td><td>§6</td></tr>
    <tr><td>tension d'un fil</td><td>\(\vec T\) le long du fil, inconnue</td><td>§6, §11</td></tr>
    <tr><td>rappel élastique</td><td>\(-k(\ell-\ell_0)\,\vec u\)</td><td>§6</td></tr>
    <tr><td>frottement fluide</td><td>\(-\alpha\vec v\) ou \(-\beta\|\vec v\|\vec v\)</td><td>§8</td></tr>
    <tr><td>force de Lorentz</td><td>\(q(\vec E+\vec v\wedge\vec B)\)</td><td>chapitre « Particules chargées »</td></tr>
  </table></div>
  <div class="prop-box">
    <strong>Troisième loi de Newton (actions réciproques).</strong> Si un corps A exerce sur un corps B la force \(\vec F_{A\to B}\), alors B exerce sur A la force
    <div class="formula" data-nom="Troisième loi de Newton">$$\vec F_{B\to A}=-\vec F_{A\to B}$$</div>
    de même droite d'action. Cette loi décrit une interaction : elle vaut quel que soit le référentiel. Les deux forces s'exercent sur des corps <strong>différents</strong> ; elles ne se compensent jamais dans le bilan d'un même système. Dans un système, les forces intérieures vont par paires opposées et leur somme est nulle.
  </div>
  <p>Faire un bilan des forces, c'est : délimiter le système ; lister les actions à distance (le poids, au voisinage de la Terre), puis une action de contact pour chaque contact ; les dessiner sur un schéma, chacune à son point d'application ; écrire ce que l'on sait de chacune (expression connue, ou direction seule si la norme est inconnue). Quand plusieurs systèmes interagissent, on les isole un par un et l'on relie leurs forces mutuelles par la troisième loi.</p>

<div class="course-section">
  <div class="sec-num">§4 · LE PRINCIPE FONDAMENTAL DE LA DYNAMIQUE</div>
  <h2>Deuxième loi de Newton : les forces fixent l'accélération</h2>
  <div class="intro">La deuxième loi relie ce que l'on sait des forces à l'accélération, donc au mouvement. Projetée sur une base, elle donne les équations différentielles du mouvement : c'est l'outil central de la mécanique.</div>
  <div class="prop-box">
    <strong>Deuxième loi de Newton (principe fondamental de la dynamique).</strong> Dans un référentiel galiléen, un point matériel de masse \(m\) vérifie
    <div class="formula" data-nom="Principe fondamental de la dynamique">$$m\,\vec a=\sum\vec F\qquad\text{soit}\qquad\frac{\mathrm{d}\vec p}{\mathrm{d}t}=\sum\vec F$$</div>
    Pour un système fermé de masse \(m\), le centre de masse se comporte comme un point de masse \(m\) soumis aux seules forces <strong>extérieures</strong> : \(m\,\vec a(G)=\sum\vec F_{\text{ext}}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Les forces intérieures disparaissent</span><div class="content">
    <p>Deux points : \(m_1\vec a_1=\vec F_{\text{ext},1}+\vec F_{2\to1}\) et \(m_2\vec a_2=\vec F_{\text{ext},2}+\vec F_{1\to2}\). En sommant, les forces intérieures s'annulent (troisième loi) : \(m_1\vec a_1+m_2\vec a_2=\vec F_{\text{ext},1}+\vec F_{\text{ext},2}\). Le membre de gauche est la dérivée de \(\vec p=(m_1+m_2)\,\vec v(G)\) (§1) : \((m_1+m_2)\,\vec a(G)=\sum\vec F_{\text{ext}}\).</p>
  </div></div>
  <p>Conséquences : un point au repos dans un référentiel galiléen vérifie \(\sum\vec F=\vec 0\) (condition d'équilibre) ; la quantité de mouvement d'un système fermé pseudo-isolé se conserve.</p>
  <div class="method-box">
    <strong>Méthode — mettre un problème en équations</strong>
    <ol>
      <li>Définir le <strong>système</strong> (fermé) et le <strong>référentiel</strong>, supposé galiléen.</li>
      <li>Faire le <strong>bilan des forces</strong> et le schéma (§3).</li>
      <li>Choisir une <strong>base</strong> adaptée aux degrés de liberté (cartésienne, polaire, Frenet) et y écrire l'accélération.</li>
      <li>Écrire \(m\vec a=\sum\vec F\) et le <strong>projeter</strong> : une équation par axe. Les équations sans inconnue de mouvement donnent les forces inconnues (réaction, tension).</li>
      <li><strong>Résoudre</strong> avec les conditions initiales, ou exploiter l'équation sans la résoudre ; <strong>vérifier</strong> l'homogénéité, les signes et les cas limites.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — deux blocs poussés (figure du §3)</strong>
    <p>On pousse horizontalement, avec \(F=12\ \text{N}\), un bloc de 2,0 kg qui pousse lui-même un bloc de 1,0 kg ; la table est lisse.</p>
    <ol>
      <li>Système {1 + 2} : les forces verticales (poids, réactions) se compensent, la seule force horizontale extérieure est \(\vec F\) : \((m_1+m_2)\,a=F\), d'où \(a=4{,}0\ \text{m·s}^{-2}\).</li>
      <li>Système {2} seul : la seule force horizontale est \(\vec F_{1\to2}\), donc \(F_{1\to2}=m_2a=4{,}0\ \text{N}\).</li>
      <li>Contrôle sur {1} : \(F-F_{2\to1}=12-4{,}0=8{,}0\ \text{N}=m_1a\). La troisième loi relie les deux bilans.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — l'ascenseur et la balance</strong>
    <ol>
      <li>Une cabine de 1 100 kg (passagers compris) démarre vers le haut avec \(a=1{,}2\ \text{m·s}^{-2}\). Axe vertical ascendant : \(T-mg=ma\), donc le câble tire avec \(T=m(g+a)\approx1{,}21\times10^{4}\ \text{N}\).</li>
      <li>Un passager de 70 kg est debout sur une balance. Sur le passager : \(N-mg=ma\), soit \(N=m(g+a)\approx771\ \text{N}\) ; la balance, graduée pour \(g\), affiche \(771/9{,}81\approx79\ \text{kg}\).</li>
      <li>À l'arrivée, la cabine ralentit à \(1{,}2\ \text{m·s}^{-2}\) (\(a=-1{,}2\)) : la balance affiche 61 kg. Elle mesure la réaction \(N\), pas le poids.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — deux patineurs qui se repoussent</strong>
    <p>Deux patineurs de 60 kg et 80 kg, immobiles sur une glace lisse, se repoussent. Le premier part à \(2{,}0\ \text{m·s}^{-1}\).</p>
    <ol>
      <li>Système fermé {deux patineurs} : poids et réactions de la glace se compensent ; les poussées sont intérieures. Il est pseudo-isolé : \(\vec p\) se conserve et reste nul.</li>
      <li>\(60\times2{,}0+80\,v_2=0\), donc \(v_2=-1{,}5\ \text{m·s}^{-1}\) : le second part en sens opposé, plus lentement. Le centre de masse reste immobile.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : inscrire « \(m\vec a\) » dans le bilan comme si c'était une force, ou une « force du mouvement » dans le sens de la vitesse. Les forces viennent d'interactions identifiables ; \(m\vec a\) est leur conséquence. Autre piège : \(\sum\vec F=\vec 0\) n'entraîne pas l'immobilité, mais seulement un mouvement rectiligne uniforme.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · GRAVITATION ET POIDS</div>
  <h2>La force de gravitation et le champ de pesanteur uniforme</h2>
  <div class="intro">Le poids est la manifestation, à la surface de la Terre, de l'attraction universelle entre les masses. Comprendre son origine permet de savoir quand le modèle « champ de pesanteur uniforme » est valable.</div>
  <div class="prop-box">
    <strong>Loi de la gravitation.</strong> Deux points de masses \(m_1\) et \(m_2\), distants de \(r\), s'attirent avec des forces opposées, dirigées selon la droite qui les joint, de norme
    <div class="formula" data-nom="Force de gravitation">$$F=\frac{G\,m_1m_2}{r^2}\qquad G=6{,}674\times10^{-11}\ \text{N·m}^2\text{·kg}^{-2}$$</div>
    Un corps à symétrie sphérique (une planète) attire un point extérieur comme si toute sa masse était concentrée en son centre (résultat admis).
  </div>
  <p>À la surface de la Terre, l'attraction vaut \(mg_0\) avec</p>
  <div class="formula">$$g_0=\frac{GM_T}{R_T^2}=\frac{6{,}674\times10^{-11}\times5{,}972\times10^{24}}{(6{,}371\times10^{6})^2}\approx9{,}82\ \text{m·s}^{-2}$$</div>
  <p>Le <strong>poids</strong> \(\vec P=m\vec g\), mesuré dans le référentiel terrestre, en diffère de quelques millièmes au plus, à cause de la rotation de la Terre ; on note \(\vec g\) le champ de pesanteur, vertical descendant, de norme \(g\approx9{,}81\ \text{m·s}^{-2}\) en France.</p>
  <div class="prop-box"><strong>Champ de pesanteur uniforme.</strong> À l'altitude \(h\), la gravitation varie comme \(g_0R_T^2/(R_T+h)^2\approx g_0(1-2h/R_T)\) : sa variation relative est de 1 % à 32 km d'altitude. Pour des mouvements dont l'extension est petite devant \(R_T\) (quelques kilomètres au plus), on considère \(\vec g\) <strong>uniforme</strong> : même direction et même norme partout.</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Lieu</th><th style="text-align:left">Champ de gravitation</th></tr>
    <tr><td>sol terrestre</td><td>9,82 \(\text{m·s}^{-2}\)</td></tr>
    <tr><td>avion de ligne, 10 km d'altitude</td><td>9,79 \(\text{m·s}^{-2}\) (−0,3 %)</td></tr>
    <tr><td>station spatiale, 400 km</td><td>8,7 \(\text{m·s}^{-2}\)</td></tr>
    <tr><td>surface de la Lune</td><td>1,62 \(\text{m·s}^{-2}\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — pourquoi la gravitation ne se sent qu'avec une planète</strong>
    <ol>
      <li>Deux masses de 1 kg distantes de 1 m s'attirent avec \(6{,}7\times10^{-11}\ \text{N}\), cent milliards de fois moins que leur poids (9,8 N).</li>
      <li>Les astronautes de la station spatiale, à 400 km, subissent encore 89 % de leur poids au sol : s'ils flottent, c'est qu'ils tombent en même temps que la station (ils sont en chute libre autour de la Terre), pas que la pesanteur a disparu.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la masse \(m\) (en kg, propriété de l'objet) et le poids \(mg\) (en N, force qui dépend du lieu) : un astronaute de 80 kg a une masse de 80 kg sur la Lune, mais un poids de 130 N au lieu de 785 N.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · FORCES DE CONTACT : RÉACTION, TENSION, RAPPEL ÉLASTIQUE</div>
  <h2>Supports, fils et ressorts</h2>
  <div class="intro">Les forces de contact ont souvent une norme inconnue au départ : c'est le principe fondamental qui la donne. On en connaît en revanche la direction, et des conditions de signe qui disent quand le modèle cesse d'être valable (décollement, fil qui se détend).</div>
  <h3>Réaction d'un support</h3>
  <div class="def-box">
    <strong>Réaction d'un support.</strong> Un support exerce sur le système une force \(\vec R=\vec N+\vec T\) : la composante <strong>normale</strong> \(\vec N\), perpendiculaire au support et dirigée vers le système, empêche la pénétration ; la composante <strong>tangentielle</strong> \(\vec T\) est le frottement solide. Le contact est unilatéral : \(N\geq0\). Si le calcul donne \(N=0\), le système quitte le support (décollement). Sans frottement, \(\vec T=\vec 0\) et la réaction est normale.
  </div>
  <p>Les lois du frottement solide (lois de Coulomb) sont au programme de sciences industrielles (chapitre « Statique », §10) et rappelées en fin de chapitre ; en physique, les supports sont supposés sans frottement, sauf indication de l'énoncé.</p>
  <figure class="schema">

  <div class="method-box">
    <strong>Exemple — bloc sur un plan incliné sans frottement</strong>
    <p>Un bloc de 5,0 kg glisse sur un plan incliné de \(\alpha=20^\circ\). Axe \(Ox\) le long de la pente vers le bas, axe \(Oy\) perpendiculaire au plan, vers le haut.</p>
    <ol>
      <li>Bilan : \(\vec P\), de composantes \((mg\sin\alpha,-mg\cos\alpha)\), et \(\vec N=N\,\vec e_y\).</li>
      <li>Projection sur \(Oy\) : le bloc reste sur le plan (\(\ddot y=0\)), donc \(N=mg\cos\alpha\approx46\ \text{N}\), moins que le poids (49 N).</li>
      <li>Projection sur \(Ox\) : \(m\ddot x=mg\sin\alpha\), soit \(\ddot x=g\sin\alpha\approx3{,}4\ \text{m·s}^{-2}\), indépendant de la masse.</li>
    </ol>
  </div>
  <h3>Tension d'un fil</h3>
  <div class="def-box">
    <strong>Tension d'un fil idéal.</strong> Un fil inextensible et de masse négligeable exerce sur le point auquel il est attaché une force \(\vec T\) dirigée le long du fil, vers le fil : un fil tire, il ne pousse jamais. La norme \(T\geq0\) est inconnue a priori ; si le calcul donne \(T\lt0\), le fil s'est détendu. Le long d'un fil idéal passant sur une poulie idéale (sans masse, sans frottement), la tension a la même norme aux deux extrémités.
  </div>
  <div class="method-box">
    <strong>Exemple — la machine d'Atwood</strong>
    <p>Deux masses \(m_1=1{,}2\ \text{kg}\) et \(m_2=1{,}0\ \text{kg}\) pendent de part et d'autre d'une poulie idéale, reliées par un fil idéal. Le fil étant inextensible, quand \(m_1\) descend de \(a\), \(m_2\) monte de \(a\).</p>
    <ol>
      <li>Masse 1, axe vertical descendant : \(m_1a=m_1g-T\). Masse 2, axe vertical ascendant : \(m_2a=T-m_2g\).</li>
      <li>En sommant : \(a=\dfrac{m_1-m_2}{m_1+m_2}\,g\approx0{,}89\ \text{m·s}^{-2}\) ; puis \(T=m_1(g-a)\approx10{,}7\ \text{N}\).</li>
      <li>Contrôle : \(T\) est comprise entre les deux poids (9,8 N et 11,8 N) ; si \(m_1=m_2\), \(a=0\) et \(T=mg\). En réduisant \(g\) d'un facteur 11, la machine permettait à Atwood d'étudier une chute « au ralenti ».</li>
    </ol>
  </div>
  <h3>Rappel élastique d'un ressort</h3>
  <div class="def-box">
    <strong>Ressort idéal.</strong> Un ressort de raideur \(k\) (en \(\text{N·m}^{-1}\)) et de longueur à vide \(\ell_0\), de longueur \(\ell\), exerce sur l'objet attaché à son extrémité la force
    <div class="formula" data-nom="Force de rappel élastique">$$\vec F=-k\,(\ell-\ell_0)\,\vec u$$</div>
    où \(\vec u\) est le vecteur unitaire dirigé de l'extrémité fixe vers l'objet. Allongé (\(\ell\gt\ell_0\)), le ressort tire l'objet vers son point d'attache ; comprimé, il le repousse.
  </div>
  <p>Ordres de grandeur : quelques dizaines de \(\text{N·m}^{-1}\) pour un ressort de travaux pratiques, de l'ordre de \(10^{2}\ \text{N·m}^{-1}\) pour un ressort de stylo, quelques \(10^{4}\ \text{N·m}^{-1}\) pour une suspension automobile. Les oscillations d'une masse au bout d'un ressort sont étudiées au chapitre « Oscillateurs harmoniques ».</p>
  <div class="method-box">
    <strong>Exemple — allongement à l'équilibre</strong>
    <p>Une masse de 200 g est suspendue à un ressort vertical de raideur \(k=25\ \text{N·m}^{-1}\). À l'équilibre, \(k(\ell-\ell_0)=mg\) : l'allongement vaut \(mg/k=0{,}200\times9{,}81/25\approx7{,}8\ \text{cm}\). Mesurer cet allongement pour plusieurs masses est la façon la plus simple de vérifier la loi de force et de mesurer \(k\) (dynamomètre).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(N=mg\) par réflexe. C'est faux sur un plan incliné, dans un ascenseur qui accélère, dans un virage relevé ou un looping : \(N\) est une inconnue, que donne la projection du principe fondamental. De même, la tension d'un fil ne vaut \(mg\) qu'à l'équilibre.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · MOUVEMENT DANS LE CHAMP DE PESANTEUR UNIFORME</div>
  <h2>Sans frottement, la masse disparaît</h2>
  <div class="intro">Lorsque le poids est la seule force, le principe fondamental donne l'accélération sans calcul : le mouvement est celui, déjà étudié, à vecteur accélération constant.</div>
  <div class="prop-box"><strong>Chute libre.</strong> Pour un point soumis à son seul poids, dans le référentiel terrestre supposé galiléen : \(m\vec a=m\vec g\), donc \(\vec a=\vec g\), <strong>indépendamment de la masse</strong>. Vitesse et position sont celles du mouvement à vecteur accélération constant (chapitre « Cinématique du point », §6) : \(\vec v=\vec g\,t+\vec v_0\), trajectoire rectiligne ou parabolique.</div>
  <p>Galilée l'avait affirmé ; l'astronaute David Scott l'a montré en 1971 sur la Lune, sans air, en lâchant ensemble un marteau et une plume, qui ont touché le sol au même instant. Sur Terre, c'est la résistance de l'air qui fait tomber la plume moins vite.</p>
  <div class="method-box">
    <strong>Exemple — un plongeon de 10 m</strong>
    <ol>
      <li>Axe vertical descendant, départ sans vitesse : \(z=\tfrac12gt^2\). L'entrée dans l'eau a lieu à \(t=\sqrt{2h/g}\approx1{,}43\ \text{s}\), à la vitesse \(\sqrt{2gh}\approx14\ \text{m·s}^{-1}\) (50 km/h).</li>
      <li>Le frottement de l'air est-il négligeable ? Pour un plongeur entrant les pieds en avant, la vitesse limite (§9) est de l'ordre de \(100\ \text{m·s}^{-1}\), et le rapport frottement/poids vaut \((v/v_{\text{lim}})^2\approx(14/98)^2\approx2\ \%\) à l'arrivée : le modèle de la chute libre est justifié.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : « un objet lourd tombe plus vite ». Dans le vide, tous les objets tombent avec la même accélération. Dans l'air, l'objet le plus lourd tombe en effet plus vite à forme égale, parce que le frottement, qui ne dépend pas de la masse, pèse moins face à un poids plus grand.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · FROTTEMENT FLUIDE : DEUX MODÈLES</div>
  <h2>Linéaire ou quadratique : le nombre de Reynolds tranche</h2>
  <div class="intro">Un objet qui se déplace dans un fluide (air, eau, huile) subit une force de traînée opposée à sa vitesse. Deux modèles simples la décrivent, chacun dans son domaine de validité ; savoir lequel choisir fait partie de la modélisation.</div>
  <div class="def-box">
    <strong>Modèles de frottement fluide.</strong> Pour un objet de vitesse \(\vec v\) par rapport au fluide :
    <div class="formula" data-nom="Frottement fluide linéaire et quadratique">$$\vec f=-\alpha\,\vec v\quad(\text{linéaire})\qquad\vec f=-\beta\,\|\vec v\|\,\vec v\quad(\text{quadratique})$$</div>
    avec \(\alpha\gt0\) (en \(\text{kg·s}^{-1}\)) et \(\beta\gt0\) (en \(\text{kg·m}^{-1}\)). Dans le modèle quadratique, \(\beta=\tfrac12\rho\,C_xS\), où \(\rho\) est la masse volumique du fluide, \(S\) la surface de l'objet vue de face et \(C_x\) le coefficient de traînée (environ 0,5 pour une sphère, de l'ordre de 1 pour un corps humain). Dans les deux cas, la force est opposée à la vitesse.
  </div>
  <p>Le choix du modèle dépend du <strong>nombre de Reynolds</strong> \(\mathrm{Re}=\rho vD/\eta\), sans dimension, où \(D\) est la taille de l'objet et \(\eta\) la viscosité du fluide (en Pa·s). Il compare les effets d'inertie du fluide à ceux de sa viscosité :</p>
  <ul>
    <li>\(\mathrm{Re}\lesssim1\) (petits objets, lents, fluides visqueux) : <strong>modèle linéaire</strong>. Pour une sphère de rayon \(R\), la formule de Stokes, fournie par les énoncés, donne \(\alpha=6\pi\eta R\).</li>
    <li>\(10^{3}\lesssim\mathrm{Re}\lesssim10^{5}\) (objets de taille courante dans l'air ou l'eau, à vitesse courante) : <strong>modèle quadratique</strong>, avec \(C_x\) à peu près constant.</li>
  </ul>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Fluide (20 °C)</th><th style="text-align:left">Masse volumique</th><th style="text-align:left">Viscosité</th></tr>
    <tr><td>air</td><td>\(1{,}2\ \text{kg·m}^{-3}\)</td><td>\(1{,}8\times10^{-5}\ \text{Pa·s}\)</td></tr>
    <tr><td>eau</td><td>\(1{,}0\times10^{3}\ \text{kg·m}^{-3}\)</td><td>\(1{,}0\times10^{-3}\ \text{Pa·s}\)</td></tr>
    <tr><td>glycérine</td><td>\(1{,}26\times10^{3}\ \text{kg·m}^{-3}\)</td><td>\(1{,}4\ \text{Pa·s}\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — une gouttelette de brouillard et une balle de tennis</strong>
    <ol>
      <li>Gouttelette d'eau de rayon \(10\ \mu\text{m}\) (\(m\approx4{,}2\times10^{-12}\ \text{kg}\)) dans l'air : Stokes donne \(\alpha=6\pi\eta R\approx3{,}4\times10^{-9}\ \text{kg·s}^{-1}\) et une vitesse de chute \(mg/\alpha\approx1{,}2\ \text{cm·s}^{-1}\) (§9). Alors \(\mathrm{Re}=1{,}2\times0{,}012\times2\times10^{-5}/1{,}8\times10^{-5}\approx0{,}02\) : le modèle linéaire est cohérent. Le brouillard « flotte ».</li>
      <li>Balle de tennis (diamètre 6,7 cm, 58 g, \(C_x\approx0{,}55\)) à \(20\ \text{m·s}^{-1}\) : \(\mathrm{Re}\approx9\times10^{4}\), modèle quadratique, avec \(S=\pi\times0{,}0335^2\approx3{,}5\times10^{-3}\ \text{m}^2\) et \(\beta=\tfrac12\rho C_xS\approx1{,}2\times10^{-3}\ \text{kg·m}^{-1}\).</li>
      <li>Traînée : \(\beta v^2\approx0{,}47\ \text{N}\), contre un poids de 0,57 N. À cette vitesse, la résistance de l'air atteint 80 % du poids : impossible de la négliger.</li>
    </ol>
  </div>
  <p>Mesurer un frottement fluide : on peut filmer la chute d'une bille dans un liquide visqueux (sa vitesse limite donne \(\alpha\), donc \(\eta\) par la formule de Stokes), ou mesurer la traînée d'un objet placé dans un écoulement avec un capteur de force relié à un microcontrôleur.</p>
  <div class="notice"><strong>Erreur classique</strong> : écrire le frottement quadratique \(-\beta v^2\,\vec e_z\) sur un axe fixe, quel que soit le sens du mouvement. Pour un objet lancé vers le haut, la traînée est dirigée vers le bas : l'écriture \(-\beta\|\vec v\|\vec v\) (ou \(-\beta\,v|v|\) sur un axe) garantit qu'elle s'oppose toujours à la vitesse.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · CHUTE AVEC FROTTEMENT : VITESSE LIMITE</div>
  <h2>Exploiter l'équation sans la résoudre</h2>
  <div class="intro">Avec un frottement, l'équation du mouvement n'a pas toujours de solution simple. Le programme demande d'en tirer l'essentiel sans la résoudre : la vitesse limite, le temps pour l'atteindre, une forme adimensionnée valable pour tous les objets.</div>
  <p>Chute verticale depuis le repos, axe \(Oz\) vertical <strong>descendant</strong>, \(v=\dot z\geq0\). Le principe fondamental donne, selon le modèle :</p>
  <div class="formula">$$m\frac{\mathrm{d}v}{\mathrm{d}t}=mg-\alpha v\qquad\text{ou}\qquad m\frac{\mathrm{d}v}{\mathrm{d}t}=mg-\beta v^2$$</div>
  <div class="prop-box">
    <strong>Vitesse limite.</strong> Au début, \(v=0\) : le frottement est nul et l'objet tombe comme en chute libre. Puis le frottement grandit jusqu'à compenser le poids : l'accélération s'annule et la vitesse tend vers
    <div class="formula" data-nom="Vitesse limite de chute">$$v_{\text{lim}}=\frac{mg}{\alpha}\quad(\text{linéaire})\qquad v_{\text{lim}}=\sqrt{\frac{mg}{\beta}}\quad(\text{quadratique})$$</div>
    Le temps caractéristique est \(\tau=v_{\text{lim}}/g\), durée qu'il faudrait en chute libre pour atteindre \(v_{\text{lim}}\) (en linéaire, \(\tau=m/\alpha\)).
  </div>
  <h3>Équation adimensionnée</h3>
  <p>On mesure la vitesse en unités de \(v_{\text{lim}}\) et le temps en unités de \(\tau\) : \(u=v/v_{\text{lim}}\) et \(s=t/\tau\). Comme \(\mathrm{d}v/\mathrm{d}t=(v_{\text{lim}}/\tau)\,\mathrm{d}u/\mathrm{d}s=g\,\mathrm{d}u/\mathrm{d}s\), en divisant l'équation par \(mg\) :</p>
  <div class="formula" data-nom="Chute avec frottement : équation sans dimension">$$\frac{\mathrm{d}u}{\mathrm{d}s}=1-u\quad(\text{linéaire})\qquad\frac{\mathrm{d}u}{\mathrm{d}s}=1-u^2\quad(\text{quadratique})$$</div>
  <p>Ces équations ne contiennent plus aucun paramètre : une seule courbe décrit la chute de toutes les gouttes, de tous les parachutistes, de toutes les billes. Il suffit de la connaître une fois (par la résolution analytique dans le cas linéaire, par la simulation numérique du §10 dans le cas quadratique), puis de remettre les échelles \(v_{\text{lim}}\) et \(\tau\).</p>

  <div class="method-box">
    <strong>Exemple — un saut en parachute</strong>
    <p>Un parachutiste de 80 kg (équipement compris) tombe bras écartés ; \(\beta\approx0{,}25\ \text{kg·m}^{-1}\) (soit \(C_xS\approx0{,}42\ \text{m}^2\)).</p>
    <ol>
      <li>Vitesse limite : \(v_{\text{lim}}=\sqrt{80\times9{,}81/0{,}25}\approx56\ \text{m·s}^{-1}\), environ 200 km/h. Temps caractéristique : \(\tau=56/9{,}81\approx5{,}7\ \text{s}\).</li>
      <li>La simulation de l'équation adimensionnée (§10) montre que \(u\) atteint 0,95 pour \(s\approx1{,}8\) : le parachutiste est à 95 % de sa vitesse limite au bout de \(1{,}8\,\tau\approx10\ \text{s}\), après environ 370 m de chute.</li>
      <li>Voile ouverte, la vitesse limite tombe à 5 \(\text{m·s}^{-1}\) : il faut \(\beta=mg/v_{\text{lim}}^2\approx31\ \text{kg·m}^{-1}\), environ 125 fois plus, soit \(C_xS\approx52\ \text{m}^2\) : une voile de plusieurs dizaines de mètres carrés.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que la vitesse limite est atteinte au bout de \(\tau\). À \(t=\tau\), la vitesse n'en vaut que 63 % (linéaire) ou 76 % (quadratique) : il faut quelques \(\tau\). Autre piège : la vitesse limite est proportionnelle à la masse en linéaire, mais seulement à sa racine carrée en quadratique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · SIMULATION NUMÉRIQUE : MÉTHODE D'EULER</div>
  <h2>Résoudre l'équation pas à pas</h2>
  <div class="intro">Quand on ne sait pas résoudre l'équation du mouvement, on la résout numériquement. La méthode d'Euler, étudiée dans le chapitre d'informatique « Méthodes numériques » (§6 pour l'ordre 1, §7 pour l'ordre 2) et déjà utilisée pour les circuits (chapitre « Circuit linéaire du premier ordre », §9), s'applique telle quelle : on reprend la même fonction <span class="code-inline">euler</span>.</div>
  <div class="prop-box">
    <strong>Schéma d'Euler pour une chute avec frottement quadratique.</strong> L'équation s'écrit \(\dfrac{\mathrm{d}v}{\mathrm{d}t}=F(t,v)=g-\dfrac{\beta}{m}\,v|v|\). Avec le pas \(h\), \(t_k=kh\) et \(v_k\approx v(t_k)\) :
    <div class="formula" data-nom="Méthode d'Euler (chute avec frottement)">$$v_{k+1}=v_k+h\left(g-\frac{\beta}{m}\,v_k|v_k|\right)$$</div>
    L'écriture \(v|v|\) garde un frottement opposé à la vitesse si celle-ci change de signe.
  </div>
  <pre class="codeblock"><span class="kw">def</span> euler(F, t0, y0, h, n):
    <span class="str">"""Méthode d'Euler pour y' = F(t, y), y(t0) = y0 : renvoie les listes</span>
<span class="str">    des instants t_k = t0 + k*h et des approximations y_k de y(t_k), k = 0, …, n."""</span>
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)      <span class="cmt"># pente au point (t_k, y_k)</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys

g, m, beta = 9.81, 80.0, 0.25          <span class="cmt"># SI : parachutiste bras écartés</span>

<span class="kw">def</span> F(t, v):
    <span class="kw">return</span> g - beta / m * v * abs(v)   <span class="cmt"># axe vertical descendant : m dv/dt = mg - beta v|v|</span>

ts, vs = euler(F, 0, 0.0, 0.05, 400)   <span class="cmt"># 400 pas de 0,05 s : 20 s de chute</span></pre>
  <div class="method-box">
    <strong>Exemple — résultats et validation</strong>
    <ol>
      <li>Le programme donne \(v=9{,}7\), \(18{,}9\), \(39{,}5\), \(52{,}8\) et \(55{,}9\ \text{m·s}^{-1}\) à \(t=1\), 2, 5, 10 et 20 s : au début \(v\approx gt\), puis la vitesse plafonne à \(v_{\text{lim}}=56\ \text{m·s}^{-1}\) ; 95 % sont atteints à \(t\approx10{,}5\ \text{s}\).</li>
      <li>Validation sur un cas connu : avec le modèle linéaire de même vitesse limite (\(\tau=5{,}71\ \text{s}\)), dont la solution exacte vaut \(v_{\text{lim}}(1-e^{-1})\approx35{,}4\ \text{m·s}^{-1}\) à \(t=\tau\), la méthode donne 36,5 avec \(h=\tau/10\) (3 % d'écart) et 35,5 avec \(h=\tau/100\) (0,3 %) : l'erreur est proportionnelle au pas.</li>
      <li>Pas trop grand : avec \(h=6\ \text{s}\) (plus que \(\tau\)), la suite oscille autour de 56 en s'en écartant peu à peu (58,9 ; 52,8 ; 59,4 ; 52,1…) ; avec \(h=12\ \text{s}\), elle diverge (\(118\), \(-284\), \(2\,863\)…). On prend \(h\) petit devant \(\tau\).</li>
      <li>Distance parcourue : la fonction <span class="code-inline">euler_ordre2</span> du chapitre « Méthodes numériques » (§7), appliquée à \(\ddot z=g-(\beta/m)\,\dot z|\dot z|\), donne 899 m en 20 s, contre 1 962 m en chute libre.</li>
    </ol>
  </div>
  <h3>Mouvement plan : un vecteur d'état</h3>
  <p>Pour une trajectoire dans un plan vertical, l'état du système est \((x,z,v_x,v_z)\). Le principe fondamental, projeté, donne \(\dot v_x=-k\,v\,v_x\) et \(\dot v_z=-g-k\,v\,v_z\) avec \(k=\beta/m\) et \(v=\sqrt{v_x^2+v_z^2}\) (axe \(Oz\) ascendant). On range l'état dans un tableau numpy, et la même fonction <span class="code-inline">euler</span> fait avancer les quatre composantes à la fois :</p>
  <pre class="codeblock"><span class="kw">import</span> numpy <span class="kw">as</span> np

k = 0.0202                              <span class="cmt"># beta/m pour une balle de tennis (m^-1)</span>

<span class="kw">def</span> F2(t, Y):
    x, z, vx, vz = Y                    <span class="cmt"># vecteur d'état</span>
    v = np.sqrt(vx**2 + vz**2)
    <span class="kw">return</span> np.array([vx, vz, -k * v * vx, -g - k * v * vz])

a0 = np.radians(15)
Y0 = np.array([0.0, 1.0, 30 * np.cos(a0), 30 * np.sin(a0)])   <span class="cmt"># lancée à 1,0 m du sol</span>
ts, Ys = euler(F2, 0, Y0, 0.001, 3000)                          <span class="cmt"># Ys : liste de tableaux</span>
i = next(j <span class="kw">for</span> j, Y <span class="kw">in</span> enumerate(Ys) <span class="kw">if</span> Y[1] &lt; 0)               <span class="cmt"># première position sous le sol</span>
print(Ys[i][0], ts[i])                                         <span class="cmt"># portée et durée du vol</span></pre>

  <h2>Établir l'équation du mouvement</h2>
  <div class="intro">Le pendule simple, une petite masse suspendue à un fil, illustre la démarche complète : coordonnées adaptées, bilan avec une force inconnue (la tension), projection qui sépare l'équation du mouvement et le calcul de la force inconnue, puis approximation linéaire.</div>

<figcaption>Pendule simple : la masse \(M\) est repérée par l'angle \(\theta\) entre le fil et la verticale descendante. Base polaire de centre \(O\) : \(\vec e_r\) selon \(\overrightarrow{OM}\), \(\vec e_\theta\) vers les \(\theta\) croissants. La tension \(\vec T\) est portée par le fil, vers \(O\) ; le poids a une composante \(mg\cos\theta\) selon \(\vec e_r\) et une composante \(-mg\sin\theta\) selon \(\vec e_\theta\), qui ramène la masse vers la verticale.</figcaption>
</figure>
  <p>Système : la masse \(m\), assimilée à un point \(M\) ; référentiel terrestre, galiléen. Le fil, idéal et tendu, impose \(OM=\ell\) : coordonnées polaires de centre \(O\), avec \(r=\ell\) constant et un seul degré de liberté, l'angle \(\theta\) (mouvement dans un plan vertical).</p>
  <ol>
    <li><strong>Bilan</strong> : poids \(\vec P=mg\left(\cos\theta\,\vec e_r-\sin\theta\,\vec e_\theta\right)\) ; tension \(\vec T=-T\,\vec e_r\) (le fil tire vers \(O\)) ; frottements négligés.</li>
    <li><strong>Accélération</strong> (mouvement circulaire) : \(\vec a=-\ell\dot\theta^2\,\vec e_r+\ell\ddot\theta\,\vec e_\theta\).</li>
    <li><strong>Projection sur \(\vec e_\theta\)</strong> : \(m\ell\ddot\theta=-mg\sin\theta\). La tension n'y figure pas.</li>
    <li><strong>Projection sur \(\vec e_r\)</strong> : \(-m\ell\dot\theta^2=mg\cos\theta-T\), qui donne la tension une fois le mouvement connu.</li>
  </ol>
  <div class="prop-box">
    <strong>Équation du pendule simple.</strong>
    <div class="formula" data-nom="Équation du pendule simple">$$\ddot\theta+\frac{g}{\ell}\sin\theta=0\qquad T=mg\cos\theta+m\ell\dot\theta^2$$</div>
    L'équation est non linéaire (\(\sin\theta\)) et ne dépend pas de la masse.
  </div>
  <div class="prop-box">
    <strong>Approximation linéaire.</strong> Pour de petits angles, \(\sin\theta\approx\theta\) (à 1 % près tant que \(|\theta|\lt14^\circ\)), et l'équation devient celle d'un <strong>oscillateur harmonique</strong>, la même que pour une masse au bout d'un ressort :
    <div class="formula" data-nom="Pendule simple : petites oscillations">$$\ddot\theta+\omega_0^2\,\theta=0\qquad\omega_0=\sqrt{\frac{g}{\ell}}\qquad T_0=2\pi\sqrt{\frac{\ell}{g}}$$</div>
    Lâché sans vitesse de \(\theta_0\), le pendule oscille selon \(\theta=\theta_0\cos(\omega_0t)\) ; la période ne dépend ni de la masse ni de l'amplitude (isochronisme des petites oscillations). L'étude complète des oscillations est menée dans le chapitre « Oscillateurs harmoniques ».
  </div>
  <p>Multiplier l'équation par \(\dot\theta\) et intégrer donne une <strong>intégrale première</strong> : \(\tfrac12\dot\theta^2-(g/\ell)\cos\theta\) est constant. Pour un lâcher sans vitesse depuis \(\theta_0\) : \(\dot\theta^2=(2g/\ell)(\cos\theta-\cos\theta_0)\). C'est la conservation de l'énergie mécanique (chapitre « Énergie mécanique ») écrite pour le pendule.</p>
  <div class="method-box">
    <strong>Exemple — un pendule de 80 cm lâché à 30°</strong>
    <p>\(\ell=0{,}80\ \text{m}\), \(m=100\ \text{g}\), lâché sans vitesse depuis \(\theta_0=30^\circ\).</p>
    <ol>
      <li>Période des petites oscillations : \(T_0=2\pi\sqrt{0{,}80/9{,}81}\approx1{,}79\ \text{s}\). À 30°, l'approximation linéaire n'est plus parfaite : la résolution numérique (chapitre « Méthodes numériques », §7) donne 1,83 s, soit 1,7 % de plus.</li>
      <li>Au point bas, l'intégrale première donne \(\ell\dot\theta^2=2g(1-\cos\theta_0)\), d'où une vitesse \(\sqrt{2g\ell(1-\cos\theta_0)}\approx1{,}45\ \text{m·s}^{-1}\).</li>
      <li>Tension au point bas : \(T=mg+m\ell\dot\theta^2=mg(3-2\cos\theta_0)\approx1{,}24\ \text{N}\), plus que le poids (0,98 N) ; aux positions extrêmes, \(\dot\theta=0\) et \(T=mg\cos\theta_0\approx0{,}85\ \text{N}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(T=mg\). La tension varie au cours du mouvement et dépasse le poids au point bas, où il faut aussi fournir l'accélération centripète. Autre piège : le signe de la composante orthoradiale du poids, \(-mg\sin\theta\), qui doit ramener le pendule vers la verticale (un signe plus ferait diverger \(\theta\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Frottement solide, systèmes ouverts, référentiels non galiléens</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en physique-chimie en PTSI. Le premier est au programme de sciences industrielles.</div>
  <h3>Lois de Coulomb du frottement solide (vues en sciences industrielles)</h3>
  <p>La composante tangentielle \(\vec T\) de la réaction d'un support obéit, dans le modèle de Coulomb, à deux régimes, avec le coefficient de frottement \(f\) (de l'ordre de 0,3 à 0,8 entre matériaux usuels) : tant que le système ne glisse pas, \(\|\vec T\|\leq f\,\|\vec N\|\) ; quand il glisse, \(\|\vec T\|=f\,\|\vec N\|\) et \(\vec T\) est opposée à la vitesse de glissement. On distingue parfois un coefficient d'adhérence, un peu plus grand que le coefficient de glissement. Un bloc reste ainsi immobile sur un plan incliné tant que \(\tan\alpha\leq f\). Le chapitre de SI « Statique » (§10, §11 : arc-boutement) développe ces lois.</p>
  <h3>Systèmes ouverts</h3>
  <p>Une fusée éjecte ses gaz : la matière contenue dans la fusée change. La relation \(\mathrm{d}\vec p/\mathrm{d}t=\sum\vec F\) ne s'applique pas à ce système ouvert ; on l'applique au système fermé formé de la fusée et des gaz qu'elle éjecte pendant un court instant, ce qui fait apparaître une force de poussée liée au débit des gaz et à leur vitesse d'éjection.</p>
  <h3>Référentiels non galiléens</h3>
  <p>Dans un référentiel qui accélère (l'ascenseur du §4, le train qui freine du §2), on peut garder la forme \(m\vec a=\sum\vec F\) à condition d'ajouter des forces d'inertie, comme \(-m\,\vec a_e\) pour un référentiel en translation d'accélération \(\vec a_e\) : elles expliquent le « poids apparent » du passager. Ces forces ne viennent d'aucune interaction et n'ont pas de réciproque.</p>
</div>

<template class="pan-tpl" data-panneau="mp-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · PRINCIPES DE LA DYNAMIQUE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 2.2 du programme : faire un bilan des forces sur un ou plusieurs systèmes, justifier le choix d'un référentiel galiléen, appliquer et projeter le principe fondamental, utiliser la quantité de mouvement d'un système, traiter les forces de contact inconnues et les ressorts, choisir un modèle de frottement, adimensionner une équation, la simuler par la méthode d'Euler, et mettre en équation le pendule simple. Pour les approches énergétiques (théorème de l'énergie cinétique, énergie mécanique), voir le chapitre « Énergie mécanique ».</div>

  <div class="method-box"><strong>Méthode 1 — Faire un bilan des forces et le schéma</strong>
    <ol>
      <li><span class="step">Système.</span> Le délimiter (fermé), le nommer, et préciser s'il est modélisé par un point.</li>
      <li><span class="step">Actions à distance.</span> D'abord le poids \(m\vec g\) (et, s'il y a lieu, une force électrique ou magnétique).</li>
      <li><span class="step">Actions de contact.</span> Faire le tour de la frontière du système : une force par contact (support, fil, ressort, fluide). Aucune force sans objet qui l'exerce.</li>
      <li><span class="step">Schéma.</span> Chaque force à son point d'application, avec sa direction ; écrire à côté ce que l'on sait (expression connue, ou norme inconnue \(N\), \(T\)).</li>
      <li><span class="step">Plusieurs systèmes.</span> Les isoler un par un ; les forces qu'ils exercent l'un sur l'autre sont opposées (troisième loi) et deviennent intérieures si l'on étudie leur réunion.</li>
    </ol>
    <p><em>Exemple éclair :</em> un enfant tire une luge de 8,0 kg sur la neige (frottement négligé) avec une corde inclinée de 30° sur l'horizontale, tendue à 20 N. Bilan : poids (78,5 N), réaction normale \(\vec N\), tension \(\vec T\). Projections : \(ma=T\cos30^\circ\), donc \(a\approx2{,}2\ \text{m·s}^{-2}\) ; \(N=mg-T\sin30^\circ\approx68{,}5\ \text{N}\), moins que le poids.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : ajouter une « force motrice », une « force centrifuge » ou « \(m\vec a\) » au bilan. Chaque force correspond à une interaction avec un objet identifiable ; si l'on ne sait pas dire quel objet l'exerce, elle n'existe pas.</div>

  <div class="method-box"><strong>Méthode 2 — Choisir et justifier un référentiel galiléen</strong>
    <ol>
      <li><span class="step">Durée.</span> Comparer la durée du phénomène à 1 jour (référentiel terrestre) et à 1 an (référentiel géocentrique).</li>
      <li><span class="step">Extension.</span> Le référentiel terrestre suppose un mouvement local, d'extension petite devant le rayon terrestre.</li>
      <li><span class="step">Précision.</span> Les accélérations négligées valent au plus \(3{,}4\times10^{-2}\ \text{m·s}^{-2}\) (rotation de la Terre) et \(5{,}9\times10^{-3}\ \text{m·s}^{-2}\) (orbite) : les comparer aux accélérations du problème.</li>
      <li><span class="step">Autre référentiel.</span> Un référentiel en translation rectiligne uniforme par rapport à un référentiel galiléen l'est aussi (train à vitesse constante) ; s'il accélère ou tourne, il ne l'est pas.</li>
    </ol>
    <p><em>Exemple éclair :</em> lancer de javelot (vol de 3 s) : référentiel terrestre. Satellite en orbite basse (période 92 min, mais trajectoire de l'ordre du rayon terrestre) : référentiel géocentrique. Sonde vers Mars (voyage de 7 mois) : référentiel héliocentrique.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Appliquer le principe fondamental et le projeter</strong>
    <ol>
      <li><span class="step">Base.</span> La choisir d'après les degrés de liberté et la trajectoire : cartésienne (rectiligne, chute), polaire (cercle, pendule), Frenet (trajectoire imposée et vitesse connue).</li>
      <li><span class="step">Accélération.</span> L'écrire dans cette base (chapitre « Cinématique du point ») avant de projeter les forces.</li>
      <li><span class="step">Projection.</span> Une équation par axe. Les axes où le mouvement est imposé (\(\ddot y=0\) sur un support, \(r=\ell\) pour un fil) donnent les forces inconnues ; les autres donnent l'équation du mouvement.</li>
      <li><span class="step">Vérification.</span> Homogénéité, signes, cas limites (angle nul, masse nulle, frottement nul).</li>
    </ol>
    <p><em>Exemple éclair :</em> virage relevé d'un angle \(\alpha\), sans frottement, parcouru à \(v=72\ \text{km/h}\) sur un cercle horizontal de rayon \(R=100\ \text{m}\). Verticale : \(N\cos\alpha=mg\) ; horizontale, vers le centre : \(N\sin\alpha=mv^2/R\). D'où \(\tan\alpha=v^2/(gR)\approx0{,}41\) : \(\alpha\approx22^\circ\) permet de tourner sans aucune adhérence.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : projeter une force sur un axe en oubliant son signe, ou en confondant sinus et cosinus. Contrôle rapide : pour \(\alpha\to0\), la composante qui doit tendre vers la norme entière prend le cosinus.</div>

  <div class="method-box"><strong>Méthode 4 — Utiliser la quantité de mouvement d'un système</strong>
    <ol>
      <li><span class="step">Système fermé.</span> Choisir un système qui contient toutes les parties en interaction (les deux patineurs, le canon et le boulet) : leurs forces mutuelles sont intérieures.</li>
      <li><span class="step">Forces extérieures.</span> Faire leur bilan. Si elles se compensent (pseudo-isolé), ou si leur somme est nulle selon un axe, \(\vec p\) (ou sa composante sur cet axe) se conserve.</li>
      <li><span class="step">Écrire \(\vec p=\sum m_i\vec v_i=m\,\vec v(G)\)</span> avant et après, et égaler.</li>
    </ol>
    <p><em>Exemple éclair :</em> un astronaute de 100 kg, immobile dans l'espace, lance un outil de 2,0 kg à \(5{,}0\ \text{m·s}^{-1}\). Système {astronaute + outil} isolé : \(0=2{,}0\times5{,}0+100\,v\), d'où un recul \(v=-0{,}10\ \text{m·s}^{-1}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Traiter une force de contact inconnue</strong>
    <ol>
      <li><span class="step">Inconnue.</span> Introduire la norme (\(N\) pour une réaction normale, \(T\) pour une tension) comme inconnue, avec sa direction connue.</li>
      <li><span class="step">La calculer.</span> La tirer de la projection du principe fondamental sur l'axe où le mouvement est imposé.</li>
      <li><span class="step">Condition de validité.</span> Le contact existe tant que \(N\geq0\) ; le fil reste tendu tant que \(T\geq0\). L'instant où \(N\) ou \(T\) s'annule marque le décollement ou le fil qui se détend : la suite du mouvement relève d'un autre modèle (souvent une chute libre).</li>
    </ol>
    <p><em>Exemple éclair :</em> une voiture franchit le sommet d'une bosse de rayon de courbure \(R=20\ \text{m}\). Au sommet, selon la verticale descendante : \(mg-N=mv^2/R\). \(N\geq0\) impose \(v\leq\sqrt{gR}\approx14\ \text{m·s}^{-1}\) (50 km/h) : au-delà, la voiture décolle.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Écrire la force d'un ressort sans erreur de signe</strong>
    <ol>
      <li><span class="step">Vecteur \(\vec u\).</span> Unitaire, dirigé de l'extrémité fixe du ressort vers l'objet.</li>
      <li><span class="step">Longueur.</span> Exprimer \(\ell\) avec les coordonnées choisies (par exemple \(\ell=x\) si l'extrémité fixe est à l'origine).</li>
      <li><span class="step">Force.</span> \(\vec F=-k(\ell-\ell_0)\,\vec u\).</li>
      <li><span class="step">Contrôle.</span> Ressort étiré : la force ramène l'objet vers l'attache ; comprimé : elle l'en éloigne.</li>
    </ol>
    <p><em>Exemple éclair :</em> ressort horizontal fixé en \(O\), \(k=40\ \text{N·m}^{-1}\), \(\ell_0=0{,}20\ \text{m}\), objet en \(x=0{,}15\ \text{m}\) : \(\vec u=\vec e_x\) et \(\vec F=-40\times(0{,}15-0{,}20)\,\vec e_x=+2{,}0\,\vec e_x\ \text{N}\) : le ressort comprimé repousse l'objet.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Choisir un modèle de frottement fluide et trouver la vitesse limite</strong>
    <ol>
      <li><span class="step">Reynolds.</span> Estimer \(\mathrm{Re}=\rho vD/\eta\) avec une vitesse plausible : \(\mathrm{Re}\lesssim1\), modèle linéaire (Stokes : \(\alpha=6\pi\eta R\)) ; \(\mathrm{Re}\gtrsim10^{3}\), modèle quadratique (\(\beta=\tfrac12\rho C_xS\)).</li>
      <li><span class="step">Vitesse limite.</span> Écrire que la somme des forces s'annule : \(v_{\text{lim}}=mg/\alpha\) ou \(\sqrt{mg/\beta}\). Dans un liquide, ajouter la poussée d'Archimède (vue en 2ᵉ année), qui remplace la masse de l'objet par sa masse diminuée de celle du liquide déplacé.</li>
      <li><span class="step">Cohérence.</span> Recalculer \(\mathrm{Re}\) avec la vitesse limite trouvée : s'il sort du domaine du modèle, changer de modèle.</li>
    </ol>
    <p><em>Exemple éclair :</em> bille d'acier (\(7\,800\ \text{kg·m}^{-3}\)) de rayon 1,0 mm dans la glycérine (\(1\,260\ \text{kg·m}^{-3}\), \(\eta=1{,}4\ \text{Pa·s}\)). Stokes et Archimède : \(v_{\text{lim}}=\dfrac{2(\rho_b-\rho_\ell)gR^2}{9\eta}\approx1{,}0\ \text{cm·s}^{-1}\), puis \(\mathrm{Re}\approx0{,}02\) : le modèle linéaire est cohérent.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer \(v_{\text{lim}}=mg/\alpha\) sans vérifier le domaine du modèle. Une goutte de pluie de 2 mm calculée avec Stokes tomberait à plus de 100 \(\text{m·s}^{-1}\), avec un nombre de Reynolds énorme : le modèle linéaire est hors de son domaine, le modèle quadratique donne 7 \(\text{m·s}^{-1}\).</div>

  <div class="method-box"><strong>Méthode 8 — Adimensionner une équation différentielle</strong>
    <ol>
      <li><span class="step">Échelles.</span> Repérer une vitesse caractéristique (\(v_{\text{lim}}\)) et un temps caractéristique (\(\tau=v_{\text{lim}}/g\)) construits avec les paramètres.</li>
      <li><span class="step">Changement de variables.</span> Poser \(u=v/v_{\text{lim}}\), \(s=t/\tau\) ; alors \(\mathrm{d}v/\mathrm{d}t=(v_{\text{lim}}/\tau)\,\mathrm{d}u/\mathrm{d}s\).</li>
      <li><span class="step">Simplifier.</span> Diviser par le facteur commun : il ne doit rester aucun paramètre (\(\mathrm{d}u/\mathrm{d}s=1-u^2\)), ou un petit nombre de paramètres sans dimension.</li>
      <li><span class="step">Exploiter.</span> Lire sur la solution adimensionnée (connue ou simulée une fois pour toutes) les durées et distances caractéristiques, puis revenir aux unités.</li>
    </ol>
    <p><em>Exemple éclair :</em> goutte de pluie de 2 mm, \(v_{\text{lim}}\approx6{,}8\ \text{m·s}^{-1}\) et \(\tau\approx0{,}69\ \text{s}\). Au bout de 2,0 s, \(s\approx2{,}9\) : la courbe adimensionnée donne \(u\gt0{,}99\). Une goutte tombée d'un nuage arrive donc au sol à sa vitesse limite.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Simuler une chute par la méthode d'Euler</strong>
    <ol>
      <li><span class="step">Ordre 1.</span> Mettre l'équation sous la forme \(\mathrm{d}v/\mathrm{d}t=F(t,v)\) ; pour la position, utiliser le couple \((z,v)\) (fonction <span class="code-inline">euler_ordre2</span>) ou un vecteur d'état numpy.</li>
      <li><span class="step">Programme.</span> Écrire <span class="code-inline">F</span>, puis appeler <span class="code-inline">euler(F, t0, v0, h, n)</span> : durée simulée \(nh\).</li>
      <li><span class="step">Pas.</span> Le choisir petit devant le temps caractéristique \(\tau\) (par exemple \(\tau/100\)) ; vérifier qu'en le divisant par 10 le résultat ne change plus à la précision voulue.</li>
      <li><span class="step">Validation.</span> Retrouver un cas connu : chute libre au début, vitesse limite à la fin, solution exacte du modèle linéaire.</li>
    </ol>
    <p><em>Exemple éclair :</em> parachutiste (\(g=9{,}81\), \(\beta/m=0{,}25/80\)), pas \(h=1\ \text{s}\), départ du repos. \(v_1=0+1\times9{,}81=9{,}81\ \text{m·s}^{-1}\) ; \(v_2=9{,}81+1\times(9{,}81-0{,}003125\times9{,}81^2)\approx19{,}3\ \text{m·s}^{-1}\). Le pas reste ici petit devant \(\tau=5{,}7\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Mettre en équation le pendule simple et le linéariser</strong>
    <ol>
      <li><span class="step">Coordonnées.</span> Polaires de centre le point d'attache, \(r=\ell\), angle \(\theta\) depuis la verticale descendante.</li>
      <li><span class="step">Projection sur \(\vec e_\theta\).</span> \(m\ell\ddot\theta=-mg\sin\theta\) : l'équation du mouvement, où la tension n'apparaît pas.</li>
      <li><span class="step">Projection sur \(\vec e_r\).</span> \(T=mg\cos\theta+m\ell\dot\theta^2\), avec \(\dot\theta^2\) donné par l'intégrale première \(\dot\theta^2=(2g/\ell)(\cos\theta-\cos\theta_0)\).</li>
      <li><span class="step">Linéariser.</span> Pour \(|\theta|\) petit (moins de 14° pour 1 % d'erreur sur \(\sin\theta\)) : \(\ddot\theta+\omega_0^2\theta=0\), \(\omega_0=\sqrt{g/\ell}\), oscillateur harmonique de période \(2\pi\sqrt{\ell/g}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un pendule de 2,0 m a une période de \(2\pi\sqrt{2{,}0/9{,}81}\approx2{,}84\ \text{s}\) ; pour une période de 2 s (pendule « qui bat la seconde »), il faut \(\ell=g/\pi^2\approx0{,}99\ \text{m}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : linéariser avant de projeter, ou linéariser aussi la tension. On établit l'équation exacte \(\ddot\theta+(g/\ell)\sin\theta=0\), puis on discute l'approximation \(\sin\theta\approx\theta\) et son domaine de validité.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="mp-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Marcher dans une barque</h3>
  <div class="statement">Une barque de masse \(M=140\ \text{kg}\) et de longueur 3,0 m flotte, immobile, sur un lac calme. Un passager de masse \(m=70\ \text{kg}\), à l'arrière, marche jusqu'à l'avant. On néglige le frottement de l'eau sur la barque. Référentiel terrestre, galiléen.</div>
  <div class="q"><strong>Q1.</strong> Quel système fermé choisir ? Faire le bilan des forces extérieures et montrer que la composante horizontale de sa quantité de mouvement se conserve.</div>
  <div class="q"><strong>Q2.</strong> Pendant la marche, le passager avance à \(0{,}60\ \text{m·s}^{-1}\) par rapport au sol. Quelle est alors la vitesse de la barque ?</div>
  <div class="q"><strong>Q3.</strong> De combien la barque s'est-elle déplacée quand le passager arrive à l'avant ? Et le passager, par rapport au sol ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système {barque + passager}, fermé. Forces extérieures : les poids et la poussée de l'eau, toutes verticales (frottement négligé). Les forces entre les pieds du passager et le plancher sont intérieures. La somme des forces extérieures n'a pas de composante horizontale : \(p_x=m\,v_x(G)\) est constant, et nul puisque tout est immobile au départ. Le centre de masse ne bouge pas horizontalement.</p>
    <p><strong>Q2.</strong> \(m\,v_p+M\,v_b=0\), donc \(v_b=-70\times0{,}60/140=-0{,}30\ \text{m·s}^{-1}\) : la barque recule.</p>
    <p><strong>Q3.</strong> Soit \(d\) le recul de la barque ; le passager se déplace de \(3{,}0\ \text{m}\) par rapport à la barque, donc de \(3{,}0-d\) par rapport au sol. \(G\) fixe : \(m(3{,}0-d)-Md=0\), d'où \(d=\dfrac{m\times3{,}0}{m+M}=1{,}0\ \text{m}\). Le passager n'avance que de 2,0 m par rapport au sol : c'est pourquoi on peut tomber à l'eau en sautant d'une barque légère vers le quai.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Un train et ses attelages</h3>
  <div class="statement">Une locomotive de 80 t tire trois wagons identiques de 20 t chacun sur une voie horizontale. Le convoi démarre avec une accélération \(a=0{,}30\ \text{m·s}^{-2}\). Les attelages sont assimilés à des fils idéaux horizontaux ; la seule force motrice est la force horizontale \(\vec F\) exercée par les rails sur les roues motrices de la locomotive.</div>
  <div class="q"><strong>Q1.</strong> Sans frottement, calculer \(F\), puis la tension de chaque attelage. Faire un schéma des forces horizontales sur chaque wagon.</div>
  <div class="q"><strong>Q2.</strong> On tient compte d'une résistance à l'avancement égale à 1 % du poids de chaque véhicule. Reprendre les calculs.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système {convoi entier} (140 t) : les tensions des attelages sont intérieures, \(F=m_{\text{tot}}a=140\times10^{3}\times0{,}30=42\ \text{kN}\). Pour la tension de l'attelage locomotive-wagon 1, on isole les trois wagons : la seule force horizontale extérieure est cette tension, \(T_1=60\times10^{3}\times0{,}30=18\ \text{kN}\). De même, en isolant les wagons 2 et 3 : \(T_2=12\ \text{kN}\) ; le wagon 3 seul : \(T_3=6{,}0\ \text{kN}\). Sur le wagon 1, l'attelage avant tire vers l'avant avec \(T_1\), l'attelage arrière tire vers l'arrière avec \(T_2\) (troisième loi) : \(T_1-T_2=m_wa\) ✓. L'attelage le plus sollicité est le premier.</p>
    <p><strong>Q2.</strong> Chaque véhicule subit en plus \(0{,}01\,m_ig\) vers l'arrière : tout se passe comme si l'accélération était remplacée par \(a+0{,}01g\approx0{,}398\ \text{m·s}^{-2}\). D'où \(F\approx55{,}7\ \text{kN}\), \(T_1\approx23{,}9\ \text{kN}\), \(T_2\approx15{,}9\ \text{kN}\), \(T_3\approx8{,}0\ \text{kN}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Chute verticale avec frottement linéaire</h3>
  <div class="statement">Un point matériel de masse \(m\) est lâché sans vitesse initiale dans un fluide ; il est soumis à son poids et à un frottement \(\vec f=-\alpha\vec v\) (on néglige la poussée du fluide).</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle vérifiée par la vitesse \(v(t)\) (axe vertical descendant).</div>
  <div class="q"><strong>Q2.</strong> Résoudre cette équation pour \(v(0)=0\). En déduire la vitesse limite \(v_{\text{lim}}\).</div>
  <div class="q"><strong>Q3.</strong> Tracer l'allure de \(v(t)\). Au bout de combien de temps atteint-on 99 % de \(v_{\text{lim}}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Axe \(Oz\) vertical descendant : \(\vec g=g\,\vec e_z\). Bilan : poids \(mg\,\vec e_z\), frottement \(-\alpha v\,\vec e_z\). Principe fondamental : \(m\dot v=mg-\alpha v\), soit \(\dot v+\dfrac{\alpha}{m}\,v=g\), équation différentielle linéaire du premier ordre.</p>
    <p><strong>Q2.</strong> Solution particulière constante : \(mg/\alpha\). Solution de l'équation homogène : \(Ae^{-t/\tau}\) avec \(\tau=m/\alpha\). Avec \(v(0)=0\) :</p>
    <div class="formula">$$v(t)=\frac{mg}{\alpha}\left(1-e^{-t/\tau}\right)\qquad v_{\text{lim}}=\frac{mg}{\alpha}=g\tau$$</div>
    <p><strong>Q3.</strong> Croissance exponentielle vers \(v_{\text{lim}}\), tangente à l'origine de pente \(g\) (chute libre au début), qui coupe l'asymptote en \(t=\tau\). \(v/v_{\text{lim}}=0{,}99\) donne \(e^{-t/\tau}=0{,}01\), soit \(t=\tau\ln100\approx4{,}6\,\tau\).</p>
  </div>
</div>

  <div class="statement">Les lois de Coulomb du frottement solide sont au programme de sciences industrielles (chapitre « Statique ») ; on les admet ici : sans glissement, \(\|\vec T\|\leq f\,\|\vec N\|\) ; en glissement, \(\|\vec T\|=f\,\|\vec N\|\), \(\vec T\) opposée à la vitesse. Un bloc de masse \(m=2{,}0\ \text{kg}\) est posé sur un plan incliné d'angle \(\alpha=30^\circ\) ; le coefficient de frottement vaut \(f=0{,}20\) (adhérence et glissement confondus) ; \(g=9{,}8\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Faire le bilan des forces et le schéma. Calculer \(N\).</div>
  <div class="q"><strong>Q2.</strong> Établir la condition d'équilibre en fonction de \(\alpha\) et \(f\). Le bloc reste-t-il immobile ? Quel coefficient faudrait-il pour qu'il le reste ?</div>

  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Trois forces : poids (vertical), réaction normale \(\vec N\) (perpendiculaire au plan), frottement \(\vec T\) (le long du plan, vers le haut de la pente si le bloc tend à descendre). Perpendiculairement au plan, pas de mouvement : \(N=mg\cos\alpha\approx17\ \text{N}\).</p>
    <p><strong>Q2.</strong> À l'équilibre, le long de la pente : \(T=mg\sin\alpha\). La condition \(T\leq fN\) donne \(\tan\alpha\leq f\). Ici \(\tan30^\circ\approx0{,}58\gt0{,}20\) : le bloc glisse. Il faudrait \(f\geq0{,}58\).</p>
    <p><strong>Q3.</strong> Le long de la pente, vers le bas : \(ma=mg\sin\alpha-fmg\cos\alpha\), d'où \(a=g(\sin\alpha-f\cos\alpha)\approx3{,}2\ \text{m·s}^{-2}\), indépendante de la masse.</p>
    <p><strong>Q4.</strong> Mouvement rectiligne uniformément accéléré depuis le repos : \(v=\sqrt{2ad}=\sqrt{2\times3{,}2\times3{,}0}\approx4{,}4\ \text{m·s}^{-1}\) (contre 5,4 \(\text{m·s}^{-1}\) sans frottement).</p>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Mesurer la viscosité de la glycérine</h3>
  <div class="statement">On lâche des billes d'acier (\(\rho_b=7\,800\ \text{kg·m}^{-3}\)) dans une grande éprouvette de glycérine (\(\rho_\ell=1\,260\ \text{kg·m}^{-3}\)), et l'on chronomètre leur passage entre deux repères distants de \(d=20{,}0\ \text{cm}\), placés assez bas pour que la vitesse limite soit atteinte. Une bille de rayon \(R\) et de volume \(V=\tfrac43\pi R^3\) subit, outre son poids, la poussée d'Archimède, verticale vers le haut, de norme \(\rho_\ell Vg\) (vue en 2ᵉ année), et la force de Stokes \(\vec f=-6\pi\eta R\,\vec v\). Mesures : \(R=1{,}0\ \text{mm}\) : 19,5 s ; \(R=1{,}5\ \text{mm}\) : 8,8 s ; \(R=2{,}0\ \text{mm}\) : 5,0 s. \(g=9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Établir l'expression de la vitesse limite et montrer que \(\eta=\dfrac{2(\rho_b-\rho_\ell)gR^2}{9v_{\text{lim}}}\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\eta\) pour chaque bille. Quelle représentation graphique permettrait de valider le modèle sur l'ensemble des mesures ?</div>
  <div class="q"><strong>Q3.</strong> Vérifier a posteriori que le modèle linéaire est justifié (nombre de Reynolds), et que la vitesse limite est atteinte très vite (temps caractéristique).</div>
  <div class="q"><strong>Q4.</strong> Quelle erreur commettrait-on en oubliant la poussée d'Archimède ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Axe vertical descendant. À la vitesse limite, la somme des forces est nulle : \(\rho_bVg-\rho_\ell Vg-6\pi\eta Rv_{\text{lim}}=0\), d'où \(v_{\text{lim}}=\dfrac{(\rho_b-\rho_\ell)Vg}{6\pi\eta R}=\dfrac{2(\rho_b-\rho_\ell)gR^2}{9\eta}\), et l'expression demandée de \(\eta\).</p>
    <p><strong>Q2.</strong> Vitesses : 1,03 ; 2,27 ; 4,00 \(\text{cm·s}^{-1}\). Viscosités : 1,39 ; 1,41 ; 1,43 Pa·s, soit \(\eta\approx1{,}4\ \text{Pa·s}\). Le modèle prévoit \(v_{\text{lim}}\) proportionnelle à \(R^2\) : on trace \(v_{\text{lim}}\) en fonction de \(R^2\) ; les points doivent être alignés sur une droite passant par l'origine, de pente \(2(\rho_b-\rho_\ell)g/(9\eta)\). La régression donne \(\eta\approx1{,}44\ \text{Pa·s}\). La légère croissance de \(\eta\) avec \(R\) peut venir de l'effet des parois, qui freine davantage les grosses billes.</p>
    <p><strong>Q3.</strong> \(\mathrm{Re}=\rho_\ell v_{\text{lim}}\,2R/\eta\) vaut 0,02, 0,06 et 0,14 : petit devant 1, le modèle linéaire est justifié. Temps caractéristique \(\tau=m/(6\pi\eta R)=2\rho_bR^2/(9\eta)\) : de 1 à 5 ms, durée pendant laquelle la bille parcourt au plus quelques dixièmes de millimètre. La vitesse limite est atteinte presque aussitôt.</p>
    <p><strong>Q4.</strong> Sans Archimède, on remplacerait \(\rho_b-\rho_\ell\) par \(\rho_b\) : \(\eta\) serait surestimée d'un facteur \(7\,800/6\,540\approx1{,}19\) (1,66 Pa·s au lieu de 1,39 pour la première bille). Dans un liquide, la poussée n'est pas négligeable.</p>
  </div>
</div>

<div class="exo">

  <h3>Chute d'un parachutiste : équation adimensionnée et simulation</h3>

    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
      <tr><th style="text-align:left">\(s\)</th><td>0,5</td><td>1,0</td><td>1,5</td><td>2,0</td><td>3,0</td></tr>
      <tr><th style="text-align:left">\(u\)</th><td>0,462</td><td>0,762</td><td>0,905</td><td>0,964</td><td>0,995</td></tr>
      <tr><th style="text-align:left">\(X\)</th><td>0,120</td><td>0,434</td><td>0,855</td><td>1,325</td><td>2,309</td></tr>
    </table></div>

  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle de la vitesse (axe vertical descendant) et en déduire \(\beta\).</div>
  <div class="q"><strong>Q2.</strong> On pose \(u=v/v_{\text{lim}}\) et \(s=t/\tau\). Quel \(\tau\) faut-il choisir pour obtenir \(\mathrm{d}u/\mathrm{d}s=1-u^2\) ? Le calculer.</div>
  <div class="q"><strong>Q3.</strong> À l'aide du tableau, donner la vitesse et la hauteur de chute à \(t=\tau\), \(2\tau\) et \(3\tau\), et estimer la durée pour atteindre 95 % de la vitesse limite. Comparer à la chute libre.</div>
  <div class="q"><strong>Q4.</strong> Écrire la fonction <span class="code-inline">F(t, v)</span> qui, passée à la fonction <span class="code-inline">euler(F, t0, y0, h, n)</span> du cours, simule la chute en unités SI. Calculer à la main les deux premiers pas pour \(h=2\ \text{s}\) et commenter ce choix de pas.</div>
