  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite, du côté mécanique, la partie 1.4 du programme de PTSI, « Oscillateurs libres et forcés », que le programme veut voir présentée en parallèle avec le circuit RLC (chapitre « Circuit RLC série ») pour souligner les analogies. Il reprend aussi l'analogie du pendule simple avec l'oscillateur harmonique (partie 2.2) et les petits mouvements au voisinage d'un équilibre stable (partie 2.3, chapitre « Énergie mécanique », §8). C'est l'exposé de référence du site sur l'oscillateur amorti : facteur de qualité \(Q\), pulsation propre \(\omega_0\), constante de temps \(\tau=2Q/\omega_0\).</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Oscillateur harmonique</strong> (oscillateur mécanique, circuit LC) : établir et reconnaître l'équation différentielle qui le caractérise ; la résoudre compte tenu des conditions initiales (§1, §2).</li>
        <li><strong>Caractériser l'évolution</strong> en utilisant les notions d'amplitude, de phase, de période, de fréquence, de pulsation (§2).</li>
        <li><strong>Pendule simple</strong> : justifier l'analogie avec l'oscillateur harmonique dans le cadre de l'approximation linéaire (§3, §11).</li>
        <li><strong>Stockage et dissipation d'énergie</strong> : réaliser un bilan énergétique (§4, §5).</li>
        <li><strong>Oscillateur amorti par frottement visqueux</strong> : écrire l'équation sous forme canonique pour identifier la pulsation propre et le facteur de qualité ; prévoir l'évolution à partir de considérations énergétiques (§5).</li>
        <li>Décrire la nature de la réponse en fonction de la valeur du facteur de qualité ; déterminer la <strong>réponse détaillée</strong> en régime libre ou pour un échelon, en recherchant les racines du polynôme caractéristique (§6, §7).</li>
        <li>Déterminer un <strong>ordre de grandeur de la durée du régime transitoire</strong> selon la valeur du facteur de qualité (§7).</li>
        <li>Analyser, sur des relevés expérimentaux, l'évolution de la forme des régimes transitoires en fonction des paramètres caractéristiques (§6, §7).</li>
        <li>Mettre en évidence la <strong>similitude des comportements</strong> des oscillateurs mécanique et électronique (§8).</li>
        <li><strong>Régime forcé</strong> : utiliser la représentation complexe (§9) ; relier l'acuité d'une résonance au facteur de qualité ; déterminer la pulsation propre et le facteur de qualité à partir de graphes expérimentaux d'amplitude et de phase (§10).</li>
      </ul>
      <p>Les impédances complexes et la résonance du circuit RLC sont traitées dans « Circuit RLC série ». Hors programme (regroupé en fin de chapitre) : la valeur exacte de la période du pendule aux grandes amplitudes, l'amortissement par frottement solide, les oscillateurs couplés. Le calcul de la pulsation de résonance en élongation est fait à titre d'illustration, il n'est pas exigible.</p>

  </div>

<div class="course-section">
  <div class="sec-num">§1 · L'OSCILLATEUR HARMONIQUE : MODÈLE ET ÉQUATION</div>
  <h2>Une force de rappel proportionnelle à l'écart</h2>
  <div class="intro">Une masse au bout d'un ressort, un pendule, un circuit LC, les atomes d'une molécule, un immeuble qui oscille après une rafale : tous, légèrement écartés de leur équilibre stable, obéissent à la même équation. On l'établit sur le système le plus simple, la masse liée à un ressort horizontal.</div>

<figcaption>Masse \(m\) glissant sans frottement, reliée à un ressort de raideur \(k\) et de longueur à vide \(\ell_0\). L'origine \(O\) est la position d'équilibre (ressort à vide) : \(x\) est à la fois l'écart à l'équilibre et l'allongement du ressort. Écartée vers \(x\gt0\), la masse est rappelée par la force \(-kx\,\vec e_x\).</figcaption>
</figure>
  <p>Système : la masse \(m\), assimilée à un point ; référentiel terrestre, galiléen. Forces : le poids et la réaction du support, verticales et qui se compensent ; la force du ressort, \(-k(\ell-\ell_0)\,\vec e_x\). En prenant l'origine à la position d'équilibre (ressort à vide), l'allongement \(\ell-\ell_0\) est l'abscisse \(x\) elle-même, et le principe fondamental projeté sur \(\vec e_x\) donne \(m\ddot x=-kx\).</p>
  <div class="def-box">
    <strong>Oscillateur harmonique.</strong> Un système dont l'écart \(X\) à une position d'équilibre vérifie
    <div class="formula" data-nom="Oscillateur harmonique">$$\ddot X+\omega_0^2\,X=0\qquad\omega_0=\sqrt{\frac km}\ \text{(masse-ressort)}$$</div>
    est un oscillateur harmonique de <strong>pulsation propre</strong> \(\omega_0\) (en \(\text{rad·s}^{-1}\)). Pour un circuit LC, la charge vérifie \(\ddot q+q/(LC)=0\) : \(\omega_0=1/\sqrt{LC}\) (chapitre « Circuit RLC série »).
  </div>
  <p><strong>Reconnaître l'équation.</strong> Toute équation de la forme \(\ddot x+a\,x=b\), avec \(a\) et \(b\) constants et \(a\gt0\), décrit un oscillateur harmonique autour de \(x_e=b/a\) (poser \(X=x-x_e\)), de pulsation \(\omega_0=\sqrt a\). Si \(a\lt0\), la solution diverge exponentiellement : l'équilibre est instable (chapitre « Énergie mécanique », §7). Plus généralement, tout système écarté un peu d'un équilibre stable est un oscillateur harmonique de pulsation \(\omega_0^2=E_p''(x_e)/m\) (« Énergie mécanique », §8).</p>
  <div class="method-box">
    <strong>Exemple — identifier une pulsation propre</strong>
    <ol>
      <li>Masse de 250 g, ressort de raideur \(40\ \text{N·m}^{-1}\) : \(\omega_0=\sqrt{40/0{,}250}\approx12{,}6\ \text{rad·s}^{-1}\), fréquence \(f_0=\omega_0/(2\pi)\approx2{,}0\ \text{Hz}\), période \(T_0\approx0{,}50\ \text{s}\).</li>
      <li>L'équation \(2\ddot x+18x=6\) (unités SI) s'écrit \(\ddot x+9x=3\) : oscillations harmoniques autour de \(x_e=1/3\ \text{m}\), à la pulsation \(\omega_0=3\ \text{rad·s}^{-1}\).</li>
      <li>L'équation \(\ddot x-4x=0\) n'est pas celle d'un oscillateur : ses solutions contiennent \(e^{2t}\) et s'éloignent de 0.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier le signe moins de la force de rappel, ce qui donne \(\ddot x-\omega_0^2x=0\) et des solutions qui divergent. Une force de rappel est toujours opposée à l'écart.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SOLUTION ET GRANDEURS CARACTÉRISTIQUES</div>
  <h2>Amplitude, phase, période, fréquence, pulsation</h2>
  <div class="intro">L'équation de l'oscillateur harmonique est linéaire, à coefficients constants, d'ordre 2 : sa solution générale contient deux constantes, fixées par la position et la vitesse initiales. Elle s'écrit comme une sinusoïde, que l'on décrit par quelques grandeurs à connaître parfaitement.</div>
  <div class="prop-box">
    <strong>Solution générale.</strong>
    <div class="formula" data-nom="Solution de l'oscillateur harmonique">$$x(t)=A\cos(\omega_0t)+B\sin(\omega_0t)=X_m\cos(\omega_0t+\varphi)$$</div>
    \(X_m\gt0\) est l'<strong>amplitude</strong>, \(\omega_0t+\varphi\) la <strong>phase</strong> (en radians), \(\varphi\) la phase à l'origine des temps. La <strong>période</strong> \(T_0=2\pi/\omega_0\) et la <strong>fréquence</strong> \(f_0=1/T_0=\omega_0/(2\pi)\) (en hertz) ne dépendent que de \(m\) et \(k\), pas de l'amplitude : c'est l'<strong>isochronisme</strong> des oscillations.
  </div>
  <p><strong>Conditions initiales.</strong> Avec \(x(0)=x_0\) et \(\dot x(0)=v_0\) : \(A=x_0\), \(B=v_0/\omega_0\). En forme amplitude-phase :</p>
  <div class="formula" data-nom="Amplitude et phase à l'origine">$$X_m=\sqrt{x_0^2+\left(\frac{v_0}{\omega_0}\right)^2}\qquad\cos\varphi=\frac{x_0}{X_m},\quad\sin\varphi=-\frac{v_0}{\omega_0X_m}$$</div>
  <p>La vitesse \(\dot x=-\omega_0X_m\sin(\omega_0t+\varphi)\) est en quadrature avance sur la position (déphasage de \(+\pi/2\)), et l'accélération \(\ddot x=-\omega_0^2x\) en opposition de phase. Leurs maximums valent \(v_{\max}=\omega_0X_m\) (au passage par l'équilibre) et \(a_{\max}=\omega_0^2X_m\) (aux élongations extrêmes).</p>

    <strong>Exemple — masse lancée depuis une position écartée</strong>
    <p>Masse de 250 g, ressort de \(40\ \text{N·m}^{-1}\) (\(\omega_0=12{,}65\ \text{rad·s}^{-1}\)), écartée de \(x_0=2{,}0\ \text{cm}\) et lancée à \(v_0=+0{,}30\ \text{m·s}^{-1}\) (en s'éloignant de l'équilibre).</p>

<div class="course-section">
  <div class="sec-num">§3 · RESSORT VERTICAL ET PENDULE SIMPLE</div>
  <h2>Le poids déplace l'équilibre ou fournit le rappel</h2>
  <div class="intro">Deux variantes du modèle reviennent sans cesse. Pour le ressort vertical, le poids, constant, ne fait que déplacer la position d'équilibre. Pour le pendule, c'est au contraire le poids qui crée le rappel, et l'équation n'est harmonique qu'aux petits angles.</div>

  <h3>Le ressort vertical</h3>
  <p>Axe \(Oz\) vertical descendant, origine au point d'attache. Forces : le poids \(mg\,\vec e_z\) et la force du ressort \(-k(z-\ell_0)\,\vec e_z\). À l'équilibre, \(k(z_e-\ell_0)=mg\) : le ressort est allongé de \(\Delta\ell=mg/k\). En posant \(X=z-z_e\), le principe fondamental \(m\ddot z=mg-k(z-\ell_0)\) devient \(m\ddot X=-kX\) : même pulsation \(\omega_0=\sqrt{k/m}\), autour de la nouvelle position d'équilibre. Comme \(k/m=g/\Delta\ell\) :</p>
  <div class="formula" data-nom="Ressort vertical">$$\omega_0=\sqrt{\frac km}=\sqrt{\frac g{\Delta\ell}}\qquad\Delta\ell=\frac{mg}k$$</div>
  <h3>Le pendule simple</h3>
  <p>Une masse \(m\) au bout d'un fil de longueur \(\ell\), repérée par l'angle \(\theta\) avec la verticale, vérifie \(\ddot\theta+\dfrac g\ell\sin\theta=0\) (équation établie dans « Principes de la dynamique », §11). Pour \(|\theta|\) petit, \(\sin\theta\approx\theta\) et l'on retrouve un oscillateur harmonique :</p>
  <div class="formula" data-nom="Pendule simple : pulsation propre">$$\ddot\theta+\omega_0^2\,\theta=0\qquad\omega_0=\sqrt{\frac g\ell}\qquad T_0=2\pi\sqrt{\frac\ell g}$$</div>
  <p>La période des petites oscillations ne dépend ni de la masse ni de l'amplitude. Dans tous les cas, \(\omega_0^2\) est le rapport d'un terme de rappel à un terme d'inertie : \(k/m\), \(g/\ell\), \(1/(LC)\). Le pendule pesant (un solide qui tourne autour d'un axe) suit la même démarche avec son moment d'inertie (chapitre « Mouvement d'un solide »). Aux grandes amplitudes, le pendule n'est plus harmonique (§11).</p>
  <div class="method-box">
    <strong>Exemple — suspension d'une voiture et pendule de Foucault</strong>
    <ol>
      <li>Quand on charge une voiture, la caisse s'enfonce. Si une charge donnée la fait descendre de \(\Delta\ell=12\ \text{cm}\) au repos, la caisse ainsi chargée oscille à \(f_0=\dfrac1{2\pi}\sqrt{g/\Delta\ell}\approx1{,}4\ \text{Hz}\), sans connaître ni sa masse ni la raideur des ressorts. Les constructeurs visent 1 à 1,5 Hz, fréquence jugée confortable.</li>
      <li>Le pendule de Foucault du Panthéon, long de 67 m, a une période \(T_0=2\pi\sqrt{67/9{,}81}\approx16{,}4\ \text{s}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : croire que la pesanteur modifie la période du ressort vertical : elle ne change que la position d'équilibre. Réciproquement, ne pas oublier que l'isochronisme du pendule n'est vrai qu'aux petits angles.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ÉNERGIE ET PORTRAIT DE PHASE</div>
  <h2>Un échange permanent entre deux réservoirs</h2>
  <div class="intro">Sans frottement, l'énergie mécanique de l'oscillateur se conserve ; mais elle change sans cesse de forme, cinétique au passage par l'équilibre, potentielle aux élongations extrêmes. Ce bilan donne aussi l'équation du mouvement, et une image géométrique du mouvement dans le plan de phase.</div>
  <div class="prop-box">
    <strong>Énergie de l'oscillateur harmonique.</strong> Pour \(x=X_m\cos(\omega_0t+\varphi)\) :
    <div class="formula" data-nom="Énergie de l'oscillateur harmonique">$$E_c=\tfrac12m\dot x^2=E_m\sin^2(\omega_0t+\varphi)\qquad E_p=\tfrac12kx^2=E_m\cos^2(\omega_0t+\varphi)\qquad E_m=\tfrac12kX_m^2=\tfrac12mv_{\max}^2$$</div>
    \(E_c\) et \(E_p\) oscillent à la pulsation \(2\omega_0\), en opposition, autour de leur valeur moyenne commune \(E_m/2\).
  </div>
  <p><strong>Équation par l'énergie.</strong> \(\dfrac{\mathrm{d}E_m}{\mathrm{d}t}=m\dot x\ddot x+kx\dot x=\dot x\,(m\ddot x+kx)=0\), d'où \(m\ddot x+kx=0\) dès que \(\dot x\neq0\). Cette méthode est commode quand le principe fondamental ferait intervenir des forces inconnues. Pour le ressort vertical, l'énergie potentielle totale (pesanteur et élastique) vaut \(\tfrac12kX^2\) plus une constante : la même que pour le ressort horizontal, en fonction de l'écart \(X\) à l'équilibre.</p>
  <p><strong>Portrait de phase.</strong> Dans le plan \((x,\dot x)\), la conservation de \(\tfrac12m\dot x^2+\tfrac12kx^2\) donne des ellipses, qui deviennent des cercles en coordonnées réduites \((x/X_m,\ \dot x/v_{\max})\), parcourus dans le sens des aiguilles d'une montre (chapitre « Énergie mécanique », §9). Pour le circuit LC, \(\tfrac12Li^2\) et \(\tfrac12q^2/C\) jouent les rôles de \(E_c\) et \(E_p\).</p>

<figcaption>À gauche : lâchée depuis l'élongation maximale, la masse échange en permanence son énergie entre \(E_p=E_m\cos^2(\omega_0t)\) et \(E_c=E_m\sin^2(\omega_0t)\), qui oscillent à la pulsation \(2\omega_0\) (période \(T_0/2\)) autour de \(E_m/2\) ; leur somme reste constante. À droite : en coordonnées réduites \((x/X_m,\ v/v_{\max})\), avec \(v_{\max}=\omega_0X_m\), chaque mouvement décrit un cercle, dans le sens des aiguilles d'une montre ; plus l'énergie est grande, plus le cercle est grand.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — bilan d'énergie</strong>
    <p>La masse de 250 g du §2 (\(k=40\ \text{N·m}^{-1}\), \(X_m=3{,}1\ \text{cm}\)) :</p>
    <ol>
      <li>\(E_m=\tfrac12kX_m^2=\tfrac12\times40\times0{,}031^2\approx19\ \text{mJ}\) ; contrôle : \(\tfrac12mv_{\max}^2=\tfrac12\times0{,}250\times0{,}39^2\approx19\ \text{mJ}\).</li>
      <li>À mi-amplitude (\(x=X_m/2\)), \(E_p=E_m/4\) et \(E_c=3E_m/4\) : la vitesse vaut \(\sqrt{3}/2\approx87\ \%\) de \(v_{\max}\). La masse passe la majeure partie du temps loin de l'équilibre, où elle est lente.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire, pour le ressort vertical, l'énergie élastique \(\tfrac12kX^2\) en oubliant que le ressort est déjà allongé à l'équilibre. L'énergie élastique est \(\tfrac12k(\Delta\ell+X)^2\) ; c'est la somme des énergies élastique et de pesanteur qui vaut \(\tfrac12kX^2+\text{cste}\).</div>

<div class="course-section">
  <div class="sec-num">§5 · OSCILLATEUR AMORTI : FORME CANONIQUE ET FACTEUR DE QUALITÉ</div>
  <h2>Deux nombres pour décrire tout oscillateur amorti</h2>
  <div class="intro">Un oscillateur réel perd de l'énergie : ses oscillations s'éteignent. Avec un frottement fluide proportionnel à la vitesse, l'équation reste linéaire, et deux paramètres suffisent à la décrire : la pulsation propre, qui fixe l'échelle de temps, et le facteur de qualité, qui mesure l'amortissement.</div>
  <p>On ajoute à la masse-ressort une force de frottement fluide \(\vec f=-\alpha\vec v\) (\(\alpha\gt0\), en \(\text{kg·s}^{-1}\)), par exemple en la plongeant dans un liquide. Le principe fondamental donne \(m\ddot x=-kx-\alpha\dot x\).</p>
  <div class="def-box">
    <strong>Forme canonique.</strong> L'équation d'un oscillateur amorti s'écrit
    <div class="formula" data-nom="Oscillateur amorti : forme canonique">$$\ddot x+\frac{\omega_0}{Q}\,\dot x+\omega_0^2\,x=0\qquad\omega_0=\sqrt{\frac km}\qquad Q=\frac{m\omega_0}{\alpha}=\frac{\sqrt{km}}{\alpha}$$</div>
    \(\omega_0\) est la <strong>pulsation propre</strong> et \(Q\), sans dimension, le <strong>facteur de qualité</strong> : plus \(Q\) est grand, plus l'amortissement est faible. On introduit aussi la constante de temps \(\tau=2Q/\omega_0=2m/\alpha\) (§6).
  </div>
  <p><strong>Identifier \(\omega_0\) et \(Q\).</strong> On divise par le coefficient de \(\ddot x\), on lit \(\omega_0^2\) devant \(x\), puis \(\omega_0/Q\) devant \(\dot x\). Pour le circuit RLC série, \(\omega_0=1/\sqrt{LC}\) et \(Q=\dfrac1R\sqrt{\dfrac LC}\) (chapitre « Circuit RLC série », §2). En sciences industrielles, le même amortissement est décrit par le coefficient d'amortissement \(\xi=1/(2Q)\) (chapitre « Systèmes du 2ᵉ ordre ») ; en physique, on n'emploie que \(Q\) et \(\tau\).</p>
  <div class="prop-box">
    <strong>Prévoir par l'énergie.</strong> \(\dfrac{\mathrm{d}E_m}{\mathrm{d}t}=\mathcal P(\vec f)=-\alpha\dot x^2\leq0\) : l'énergie mécanique décroît tant que la masse bouge, et le mouvement s'achève à la position d'équilibre (minimum de \(E_p\)). Pour \(Q\gg1\), l'énergie perdue en une période est une petite fraction de l'énergie stockée :
    <div class="formula" data-nom="Facteur de qualité et énergie">$$Q\approx2\pi\,\frac{E_m}{|\Delta E_m|_{\text{une période}}}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Interprétation énergétique de Q (Q ≫ 1)</span><div class="content">
    <p>Pour \(Q\gg1\), l'amplitude décroît lentement, en \(e^{-t/\tau}\) (§6), donc l'énergie, proportionnelle au carré de l'amplitude, en \(e^{-2t/\tau}\). Sur une période \(T_0\), elle perd la fraction \(1-e^{-2T_0/\tau}\approx2T_0/\tau=\dfrac{2\times2\pi/\omega_0}{2Q/\omega_0}=\dfrac{2\pi}Q\).</p>
  </div></div>
  <div class="method-box">
    <strong>Exemple — trois facteurs de qualité</strong>
    <ol>
      <li>Masse de 250 g, ressort de \(40\ \text{N·m}^{-1}\), \(\alpha=0{,}50\ \text{kg·s}^{-1}\) : \(Q=\sqrt{40\times0{,}250}/0{,}50\approx6{,}3\), \(\tau=2m/\alpha=1{,}0\ \text{s}\). À chaque pseudo-période (0,50 s), l'amplitude est divisée par \(e^{0{,}50}\approx1{,}6\) et l'énergie perd 63 % de sa valeur : pour un \(Q\) aussi modeste, l'approximation \(2\pi/Q\) ne vaut plus, elle suppose \(Q\gg1\). Les réglages par défaut de l'onglet Simulateur (\(m=1\ \text{kg}\), \(k=40\ \text{N·m}^{-1}\), \(\alpha=1\ \text{N·s·m}^{-1}\)) donnent le même \(Q\approx6{,}3\), avec \(\omega_0\approx6{,}3\ \text{rad·s}^{-1}\).</li>
      <li>Suspension de voiture : 300 kg par roue, ressort de \(3{,}0\times10^4\ \text{N·m}^{-1}\), donc \(\omega_0=10\ \text{rad·s}^{-1}\). Pour un amortissement critique (\(Q=1/2\), §6), l'amortisseur doit avoir \(\alpha=\sqrt{km}/Q=6\,000\ \text{kg·s}^{-1}\).</li>
      <li>Ordres de grandeur de \(Q\) : suspension de voiture, 0,3 à 0,5 ; balançoire, une dizaine ; diapason, de l'ordre de \(10^3\) ; quartz de montre, \(10^4\) à \(10^5\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(Q=\alpha/(m\omega_0)\) (à l'envers). Contrôle : un frottement plus fort doit donner un \(Q\) plus <strong>petit</strong>. Et \(Q\) est sans dimension : \(\alpha\) en \(\text{kg·s}^{-1}\), \(m\omega_0\) aussi.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉGIME LIBRE : TROIS RÉGIMES SELON Q</div>
  <h2>Pseudo-périodique, critique, apériodique</h2>
  <div class="intro">L'équation canonique est linéaire, homogène, à coefficients constants : on cherche ses solutions en \(e^{rt}\). Selon le signe du discriminant du polynôme caractéristique, c'est-à-dire selon que \(Q\) est plus grand ou plus petit que \(1/2\), l'oscillateur revient à l'équilibre en oscillant ou sans osciller.</div>
  <div class="prop-box">
    <strong>Polynôme caractéristique.</strong> \(r^2+\dfrac{\omega_0}Q\,r+\omega_0^2=0\), de discriminant \(\Delta=\omega_0^2\left(\dfrac1{Q^2}-4\right)\).
    <ul>
      <li>\(Q\gt\tfrac12\) : <strong>régime pseudo-périodique</strong>. Racines \(r=-\dfrac1\tau\pm j\omega_p\), avec \(\tau=\dfrac{2Q}{\omega_0}\) et la <strong>pseudo-pulsation</strong> \(\omega_p=\omega_0\sqrt{1-\dfrac1{4Q^2}}\) :
        <div class="formula" data-nom="Régime pseudo-périodique">$$x(t)=e^{-t/\tau}\left(A\cos\omega_pt+B\sin\omega_pt\right)$$</div>
        Oscillations de <strong>pseudo-période</strong> \(T_p=2\pi/\omega_p\), un peu plus longue que \(T_0\), dans une enveloppe en \(e^{-t/\tau}\).</li>
      <li>\(Q=\tfrac12\) : <strong>régime critique</strong>. Racine double \(-\omega_0\) : \(x(t)=(A+Bt)\,e^{-\omega_0t}\).</li>
      <li>\(Q\lt\tfrac12\) : <strong>régime apériodique</strong>. Deux racines réelles négatives \(r_{1,2}=-\dfrac{\omega_0}{2Q}\left(1\mp\sqrt{1-4Q^2}\right)\) : \(x(t)=Ae^{r_1t}+Be^{r_2t}\).</li>
    </ul>
    Dans les trois cas, \(A\) et \(B\) se déterminent par \(x(0)\) et \(\dot x(0)\).
  </div>
  <p>Comme dans le chapitre « Circuit RLC série », on note la pseudo-pulsation \(\omega_p\), pour la distinguer de la pulsation \(\omega\) d'une excitation (§9).</p>

<figcaption>Oscillateur lâché sans vitesse depuis \(x_0\), en fonction du temps réduit \(\omega_0t\). Pour \(Q=5\), oscillations amorties dans l'enveloppe \(\pm x_0e^{-t/\tau}\) (tirets), avec \(\tau=2Q/\omega_0\) ; on en compte environ \(Q\) avant qu'elles ne deviennent imperceptibles. Pour \(Q=1/2\), retour sans oscillation le plus rapide. Pour \(Q=0{,}2\), retour sans oscillation mais lent : la masse « s'enlise », comme dans un liquide très visqueux.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — réponse détaillée pour un lâcher sans vitesse</strong>
    <p>Conditions initiales \(x(0)=x_0\), \(\dot x(0)=0\).</p>
    <ol>
      <li>Pseudo-périodique : \(A=x_0\) et \(-A/\tau+B\omega_p=0\), donc \(x(t)=x_0\,e^{-t/\tau}\left(\cos\omega_pt+\dfrac{\sin\omega_pt}{\omega_p\tau}\right)\).</li>
      <li>Critique : \(x(t)=x_0\,(1+\omega_0t)\,e^{-\omega_0t}\).</li>
      <li>Apériodique : \(A+B=x_0\) et \(r_1A+r_2B=0\), donc \(x(t)=x_0\,\dfrac{r_2e^{r_1t}-r_1e^{r_2t}}{r_2-r_1}\).</li>
      <li>Pour la masse du §5 (\(Q=6{,}3\), \(\omega_0=12{,}65\ \text{rad·s}^{-1}\)) : \(\omega_p\approx12{,}61\ \text{rad·s}^{-1}\), à 0,3 % de \(\omega_0\) ; \(T_p\approx0{,}50\ \text{s}\) ; l'amplitude est divisée par \(e\) en \(\tau=1{,}0\ \text{s}\), soit deux pseudo-périodes.</li>
    </ol>
  </div>
  <h3>Exploiter un relevé expérimental</h3>
  <p>Sur un enregistrement en régime pseudo-périodique, deux maximums successifs sont séparés de \(T_p\), et leur rapport vaut \(e^{T_p/\tau}\). Le <strong>décrément logarithmique</strong> en découle :</p>
  <div class="formula" data-nom="Décrément logarithmique">$$\delta=\ln\frac{x(t)}{x(t+T_p)}=\frac{T_p}\tau=\frac{2\pi}{\sqrt{4Q^2-1}}\approx\frac\pi Q\ \ (Q\gg1)$$</div>
  <div class="method-box">
    <strong>Exemple — mesurer Q sur un enregistrement</strong>
    <p>Un capteur de position enregistre deux maximums successifs de 4,0 cm et 2,6 cm, séparés de 0,52 s.</p>
    <ol>
      <li>\(\delta=\ln(4{,}0/2{,}6)\approx0{,}43\), donc \(Q=\tfrac12\sqrt{1+(2\pi/\delta)^2}\approx7{,}3\) (l'approximation \(\pi/\delta\) donne la même valeur).</li>
      <li>\(\omega_p=2\pi/0{,}52\approx12{,}1\ \text{rad·s}^{-1}\) et \(\omega_0=\omega_p/\sqrt{1-1/(4Q^2)}\approx12{,}1\ \text{rad·s}^{-1}\) : pour \(Q\) de cet ordre, confondre \(\omega_p\) et \(\omega_0\) est sans conséquence.</li>
      <li>On compte environ \(Q\approx7\) oscillations visibles : en \(Q\) pseudo-périodes, l'amplitude est divisée par \(e^{\pi}\approx23\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre une enveloppe en \(e^{-t/(2\tau)}\), ou \(\tau=m/\alpha\) : avec la convention du site, \(\tau=2Q/\omega_0=2m/\alpha\) est la constante de temps de l'<strong>amplitude</strong>, et l'énergie décroît en \(e^{-2t/\tau}\). Autre erreur : dire qu'en régime apériodique le retour est monotone. Lancée vers l'équilibre avec une vitesse suffisante, la masse le dépasse une fois avant de revenir, mais sans jamais osciller.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · DURÉE DU RÉGIME TRANSITOIRE, RÉPONSE À UN ÉCHELON</div>
  <h2>Combien de temps avant l'équilibre ?</h2>
  <div class="intro">En pratique, on veut savoir combien de temps dure le transitoire : une balance doit se stabiliser vite, un amortisseur ne doit pas laisser rebondir la caisse. La réponse dépend de \(Q\), et elle est la plus courte au voisinage du régime critique.</div>
  <div class="prop-box">
    <strong>Ordre de grandeur de la durée du transitoire.</strong>
    <ul>
      <li>\(Q\gg1\) : quelques \(\tau=2Q/\omega_0\) ; l'écart passe sous 5 % de sa valeur initiale au bout de \(\tau\ln20\approx3\tau\), soit environ \(Q\) pseudo-périodes.</li>
      <li>\(Q\ll1\) : la racine \(r_1\approx-Q\omega_0\), petite, impose une constante de temps \(1/(Q\omega_0)\), longue ; durée \(\approx3/(Q\omega_0)\).</li>
      <li>Au voisinage de \(Q=1/2\) : quelques \(1/\omega_0\) seulement (\(4{,}7/\omega_0\) au régime critique), la durée la plus courte. Le régime critique est le retour le plus rapide <strong>sans dépassement</strong> ; en tolérant un dépassement de 5 %, on fait un peu mieux vers \(Q\approx0{,}7\) (\(2{,}9/\omega_0\)).</li>
    </ul>
  </div>

<figcaption>Temps au bout duquel l'écart à l'équilibre reste inférieur à 5 % de l'écart initial (oscillateur lâché sans vitesse, ou réponse à un échelon), en unités de \(1/\omega_0\), calculé numériquement ; échelles logarithmiques. Pour \(Q\gg1\), il vaut \(\tau\ln20\approx3\tau=6Q/\omega_0\), soit environ \(Q\) pseudo-périodes ; pour \(Q\ll1\), il vaut \(\ln 20/(Q\omega_0)\approx3/(Q\omega_0)\). Il est le plus court, quelques \(1/\omega_0\), entre \(Q=1/2\) (\(4{,}7/\omega_0\)) et \(Q\approx0{,}7\) (\(2{,}9/\omega_0\)) ; les sauts correspondent aux valeurs de \(Q\) où un dépassement cesse de franchir les 5 %.</figcaption>
</figure>
  <h3>Réponse à un échelon</h3>
  <p>Si une force constante \(F_0\) s'applique à partir de \(t=0\) (masse qu'on accroche, support qu'on déplace brusquement), l'équation devient \(\ddot x+\dfrac{\omega_0}Q\dot x+\omega_0^2x=\dfrac{F_0}m\). Sa solution est la somme d'une solution particulière constante, \(x_\infty=F_0/k\) (la nouvelle position d'équilibre), et de la solution générale de l'équation homogène (§6). Les constantes se déterminent par la <strong>continuité de la position et de la vitesse</strong> en \(t=0\) : une force finie ne peut pas changer brutalement la vitesse d'une masse. La démarche est exactement celle du circuit RLC soumis à un échelon de tension (« Circuit RLC série », §4).</p>
  <div class="method-box">
    <strong>Exemple — accrocher une masse à un ressort vertical</strong>
    <p>On accroche la masse de 250 g au ressort vertical de \(40\ \text{N·m}^{-1}\) à vide, et on la lâche sans vitesse ; un frottement fluide donne \(Q=6{,}3\).</p>
    <ol>
      <li>Nouvel équilibre : allongement \(\Delta\ell=mg/k\approx6{,}1\ \text{cm}\). Écart initial à cet équilibre : \(-6{,}1\ \text{cm}\), vitesse nulle.</li>
      <li>Sans frottement, la masse oscillerait entre 0 et \(2\Delta\ell=12{,}3\ \text{cm}\) : un échelon fait monter un oscillateur peu amorti jusqu'à presque le double de sa valeur finale.</li>
      <li>Avec \(Q=6{,}3\), le premier maximum, atteint au bout d'une demi-pseudo-période, vaut \(\Delta\ell\left(1+e^{-\pi/\sqrt{4Q^2-1}}\right)\approx10{,}9\ \text{cm}\) ; l'allongement se stabilise à 5 % près en \(3\tau\approx3\ \text{s}\), environ six pseudo-périodes.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les conditions initiales à la seule solution homogène, sans y ajouter la solution particulière ; ou supposer \(\dot x(0^+)\neq\dot x(0^-)\) : en mécanique, c'est la vitesse qui est continue (comme \(u_C\) et \(i_L\) en électricité).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · ANALOGIE ÉLECTROMÉCANIQUE</div>
  <h2>Un seul oscillateur, deux habillages</h2>
  <div class="intro">La masse-ressort amortie et le circuit RLC série obéissent à des équations identiques, terme à terme. Tout résultat établi pour l'un se transpose à l'autre par un simple dictionnaire : c'est la raison pour laquelle le programme les présente ensemble.</div>
  <div class="formula" data-nom="Analogie électromécanique">$$m\ddot x+\alpha\dot x+kx=F(t)\qquad\longleftrightarrow\qquad L\ddot q+R\dot q+\frac qC=e(t)$$</div>
  <div><table>
    <tr><th>Mécanique</th><th>Électricité</th><th>Rôle</th></tr>
    <tr><td>position \(x\)</td><td>charge \(q\) (ou \(u_C=q/C\))</td><td>grandeur qui oscille</td></tr>
    <tr><td>vitesse \(\dot x\)</td><td>intensité \(i=\dot q\)</td><td>sa dérivée</td></tr>
    <tr><td>masse \(m\)</td><td>inductance \(L\)</td><td>inertie</td></tr>
    <tr><td>coefficient de frottement \(\alpha\)</td><td>résistance \(R\)</td><td>dissipation</td></tr>
    <tr><td>raideur \(k\)</td><td>\(1/C\)</td><td>rappel</td></tr>
    <tr><td>force \(F(t)\)</td><td>tension \(e(t)\)</td><td>excitation</td></tr>
    <tr><td>\(E_c=\tfrac12mv^2\), \(E_p=\tfrac12kx^2\)</td><td>\(\tfrac12Li^2\), \(\tfrac12q^2/C\)</td><td>énergies stockées</td></tr>
    <tr><td>\(\mathcal P=-\alpha v^2\)</td><td>\(\mathcal P_J=Ri^2\) (reçue par \(R\))</td><td>puissance dissipée</td></tr>
    <tr><td>\(\omega_0=\sqrt{k/m}\), \(Q=\sqrt{km}/\alpha\), \(\tau=2m/\alpha\)</td><td>\(\omega_0=1/\sqrt{LC}\), \(Q=\tfrac1R\sqrt{L/C}\), \(\tau=2L/R\)</td><td>paramètres</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — le circuit électrique jumeau</strong>
    <p>La masse-ressort du §5 (\(m=250\ \text{g}\), \(k=40\ \text{N·m}^{-1}\), \(\alpha=0{,}50\ \text{kg·s}^{-1}\)) a \(\omega_0=12{,}6\ \text{rad·s}^{-1}\) et \(Q=6{,}3\). Un circuit RLC aux mêmes \(\omega_0\) et \(Q\), avec \(L=1{,}0\ \text{H}\) : \(C=1/(L\omega_0^2)=6{,}25\ \text{mF}\) et \(R=L\omega_0/Q=2{,}0\ \text{Ω}\). Ses régimes libres ont exactement la même forme (même figure du §6), à l'échelle près. C'est ainsi qu'on simulait autrefois des systèmes mécaniques avec des circuits électriques.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : associer la raideur \(k\) à la capacité \(C\). Un ressort raide (grand \(k\)) correspond à une petite capacité : l'analogue de \(k\) est \(1/C\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · RÉGIME SINUSOÏDAL FORCÉ</div>
  <h2>L'oscillateur suit l'excitation</h2>
  <div class="intro">Une machine à laver dont le tambour est mal équilibré, un pont parcouru par des passants, une voiture sur une route ondulée : un oscillateur est souvent soumis à une excitation périodique. Après le transitoire, il oscille à la pulsation imposée, avec une amplitude et un déphasage qui dépendent de cette pulsation.</div>
  <p>On applique à la masse une force \(F(t)=F_m\cos(\omega t)\) :</p>
  <div class="formula">$$\ddot x+\frac{\omega_0}Q\,\dot x+\omega_0^2\,x=\frac{F_m}m\cos(\omega t)$$</div>
  <p>La solution est la somme de la solution libre, qui s'éteint en une durée de l'ordre de celles du §7, et d'une solution particulière sinusoïdale de pulsation \(\omega\) : c'est le <strong>régime sinusoïdal forcé</strong>, seul observé ensuite.</p>
  <div class="prop-box">
    <strong>Amplitude complexe de l'élongation.</strong> On associe à \(x=X_m\cos(\omega t+\varphi)\) le complexe \(\underline x=\underline X_m\,e^{j\omega t}\), avec \(\underline X_m=X_me^{j\varphi}\) ; dériver revient à multiplier par \(j\omega\). Avec la pulsation réduite \(u=\omega/\omega_0\) :
    <div class="formula" data-nom="Régime forcé : amplitude complexe de l'élongation">$$\underline X_m=\frac{F_m/m}{\omega_0^2-\omega^2+j\,\omega\omega_0/Q}=\frac{F_m/k}{1-u^2+j\,u/Q}$$</div>
    \(X_m=|\underline X_m|\) et \(\varphi=\arg\underline X_m\), compris entre \(-\pi\) et 0 : l'élongation est en retard sur la force.
  </div>
  <ul>
    <li>\(\omega\ll\omega_0\) : \(\underline X_m\approx F_m/k\). Régime quasi statique : le ressort suit la force, en phase.</li>
    <li>\(\omega=\omega_0\) : \(\underline X_m=-jQ\,F_m/k\). Amplitude \(QF_m/k\), retard de \(\pi/2\), quel que soit \(Q\).</li>
    <li>\(\omega\gg\omega_0\) : \(\underline X_m\approx-F_m/(m\omega^2)\). L'inertie domine : faible amplitude, en opposition de phase.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — trois pulsations d'excitation</strong>
    <p>Masse du §5 (\(Q=6{,}3\), \(\omega_0=12{,}65\ \text{rad·s}^{-1}\)), force d'amplitude \(F_m=0{,}20\ \text{N}\) : élongation statique \(F_m/k=5{,}0\ \text{mm}\).</p>
    <ol>
      <li>\(u=0{,}5\) : \(X_m=\dfrac{5{,}0}{\sqrt{0{,}75^2+0{,}5^2/Q^2}}\approx6{,}6\ \text{mm}\), \(\varphi\approx-6^\circ\).</li>
      <li>\(u=1\) : \(X_m=QF_m/k\approx32\ \text{mm}\), \(\varphi=-90^\circ\).</li>
      <li>\(u=2\) : \(X_m\approx1{,}7\ \text{mm}\), \(\varphi\approx-174^\circ\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre la pulsation propre \(\omega_0\) (propriété de l'oscillateur) et la pulsation \(\omega\) de l'excitation (imposée de l'extérieur) ; en régime forcé, l'oscillateur vibre à \(\omega\), jamais à \(\omega_0\) ni à \(\omega_p\). Autre erreur : oublier que ce régime n'est atteint qu'après le transitoire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · RÉSONANCES EN VITESSE ET EN ÉLONGATION</div>
  <h2>Quand l'oscillateur répond le plus</h2>
  <div class="intro">Il y a résonance quand l'amplitude de la réponse passe par un maximum en fonction de la pulsation d'excitation. Pour la vitesse, la résonance a toujours lieu à \(\omega_0\) ; pour l'élongation, seulement si l'amortissement est assez faible. Dans les deux cas, \(Q\) fixe l'acuité de la résonance.</div>
  <div class="prop-box">
    <strong>Résonance en vitesse.</strong> \(\underline V_m=j\omega\,\underline X_m\) s'écrit
    <div class="formula" data-nom="Résonance en vitesse">$$\underline V_m=\frac{F_m/\alpha}{1+jQ\left(u-\dfrac1u\right)}\qquad V_{\max}=\frac{F_m}\alpha\ \text{en}\ \omega=\omega_0\qquad\Delta\omega=\frac{\omega_0}Q$$</div>
    L'amplitude de la vitesse est maximale pour \(\omega=\omega_0\), quel que soit \(Q\) ; la vitesse est alors en phase avec la force, qui fournit le plus de puissance. La <strong>bande passante</strong>, intervalle où \(V_m\geq V_{\max}/\sqrt2\), a pour largeur exacte \(\Delta\omega=\omega_0/Q\) : plus \(Q\) est grand, plus la résonance est <strong>aiguë</strong>.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Largeur de la bande passante</span><div class="content">
    <p>\(V_m=V_{\max}/\sqrt2\) quand \(Q\left|u-1/u\right|=1\), soit \(u^2\mp u/Q-1=0\). Les racines positives sont \(u_{1,2}=\sqrt{1+\dfrac1{4Q^2}}\mp\dfrac1{2Q}\), et leur différence vaut \(u_2-u_1=1/Q\), d'où \(\Delta\omega=\omega_0/Q\), sans approximation. On remarque aussi \(u_1u_2=1\) : les pulsations de coupure encadrent \(\omega_0\) de façon géométrique.</p>
  </div></div>

<figcaption>Amplitude de la vitesse rapportée à son maximum \(V_{\max}=F_m/\alpha\). La résonance en vitesse a toujours lieu en \(\omega=\omega_0\). La bande passante est l'intervalle où \(V_m\geq V_{\max}/\sqrt2\) (points) : sa largeur vaut exactement \(\Delta\omega=\omega_0/Q\), donc \(0{,}5\,\omega_0\) pour \(Q=2\) et \(0{,}2\,\omega_0\) pour \(Q=5\) : plus \(Q\) est grand, plus la résonance est aiguë.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Résonance en élongation.</strong> \(X_m(\omega)\) passe par un maximum si et seulement si \(Q\gt1/\sqrt2\), à une pulsation \(\omega_r\) un peu inférieure à \(\omega_0\). Pour \(Q\gg1\), \(\omega_r\approx\omega_0\) et le maximum vaut environ \(Q\,F_m/k\) : la résonance amplifie d'un facteur \(Q\) l'élongation statique. Pour \(Q\leq1/\sqrt2\), l'amplitude décroît de façon monotone.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Calcul</span><span class="prompt">Pulsation de résonance en élongation (non exigible)</span><div class="content">
    <p>\(X_m\) est maximal quand \(D(u)=(1-u^2)^2+u^2/Q^2\) est minimal. \(D'(u)=2u\left[2u^2-2+1/Q^2\right]\) s'annule pour \(u^2=1-\dfrac1{2Q^2}\), possible seulement si \(Q\gt1/\sqrt2\) : \(\omega_r=\omega_0\sqrt{1-\dfrac1{2Q^2}}\). Pour la masse du §5 (\(Q=6{,}3\)), \(\omega_r\) est à 0,6 % sous \(\omega_0\) et le maximum ne dépasse \(QF_m/k\) que de 0,3 %.</p>
  </div></div>

<figcaption>En haut : amplitude de l'élongation rapportée à l'élongation statique \(F_m/k\), en fonction de \(u=\omega/\omega_0\). Pour \(Q\gt1/\sqrt2\), elle passe par un maximum (résonance), d'autant plus haut et étroit que \(Q\) est grand, un peu avant \(u=1\) ; pour \(Q\leq1/\sqrt2\), elle décroît sans maximum. En bas : la phase \(\varphi\) de \(x\) par rapport à la force passe de 0 (basses fréquences) à \(-\pi\) (hautes fréquences), et vaut \(-\pi/2\) en \(u=1\) quel que soit \(Q\) ; la transition est d'autant plus brutale que \(Q\) est grand.</figcaption>
</figure>
  <h3>Déterminer ω₀ et Q sur des graphes expérimentaux</h3>
  <ul>
    <li><strong>Phase</strong> : \(\omega_0\) est la pulsation où l'élongation est en quadrature retard (\(\varphi=-\pi/2\)) sur la force, quel que soit \(Q\) ; c'est la mesure la plus fiable de \(\omega_0\).</li>
    <li><strong>Vitesse</strong> : le maximum de \(V_m\) donne \(\omega_0\), et la largeur de la bande passante donne \(Q=\omega_0/\Delta\omega\).</li>
    <li><strong>Élongation</strong>, pour \(Q\gg1\) : \(Q\approx X_m(\omega_0)/X_m(0)\), rapport de l'amplitude à la résonance à l'amplitude à très basse fréquence.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — exploiter une courbe de résonance</strong>
    <p>Sur un pot vibrant, l'amplitude de la vitesse d'une masse suspendue est maximale à 2,00 Hz et vaut \(V_{\max}/\sqrt2\) à 1,85 Hz et 2,17 Hz.</p>
    <ol>
      <li>\(f_0=2{,}00\ \text{Hz}\), \(\Delta f=0{,}32\ \text{Hz}\), donc \(Q=f_0/\Delta f\approx6{,}3\).</li>
      <li>Contrôle : à 2,00 Hz, la phase de l'élongation par rapport à l'excitation doit être \(-90^\circ\) ; avec \(Q=6{,}3\), elle passe de \(-45^\circ\) à \(-135^\circ\) entre 1,85 Hz et 2,17 Hz (aux bornes de la bande passante, \(\varphi=-\pi/2\pm\pi/4\)).</li>
    </ol>
  </div>
  <p><strong>Résonances utiles et dangereuses.</strong> On exploite la résonance pour sélectionner une fréquence (quartz des montres, \(Q\sim10^4\) à \(10^5\)), pour amplifier (caisse d'un instrument), pour mesurer (balance à quartz). On la redoute dans les structures : un bâtiment dont la fréquence propre est proche de celle d'un séisme, une machine à laver qui traverse sa résonance pendant l'essorage (d'où les amortisseurs), des soldats qui marchent au pas sur un pont. L'effondrement du pont de Tacoma (1940), souvent cité, n'est pas une résonance forcée : le vent, régulier, y a entretenu des oscillations de torsion par une instabilité aéroélastique.</p>
  <div class="notice"><strong>Erreur classique</strong> : affirmer que la résonance en élongation a toujours lieu à \(\omega_0\) ; c'est vrai pour la vitesse, approximativement vrai pour l'élongation si \(Q\gg1\), et faux si \(Q\leq1/\sqrt2\), où il n'y a pas de résonance en élongation du tout.</div>
</div>

  <div class="sec-num">§11 · LIMITES DU MODÈLE LINÉAIRE : LES GRANDES AMPLITUDES</div>
  <h2>Le pendule n'est harmonique qu'aux petits angles</h2>
  <div class="intro">Le modèle de l'oscillateur harmonique repose sur une force de rappel proportionnelle à l'écart. Pour un pendule lâché de haut, ou un ressort très étiré, ce n'est plus vrai : la période dépend de l'amplitude, et le mouvement n'est plus sinusoïdal. On le constate par la résolution numérique de l'équation exacte (chapitre « Énergie mécanique », §10).</div>

<figcaption>Période du pendule simple (tige rigide) lâché sans vitesse depuis \(\theta_0\), rapportée à \(T_0=2\pi\sqrt{\ell/g}\). Points : résolution numérique avec <span class="code-inline">odeint</span> ; trait plein : valeur exacte (intégrale elliptique, hors programme) ; tirets : formule approchée de Borda \(T\approx T_0\left(1+\theta_0^2/16\right)\), bonne jusqu'à 60° environ. La période augmente avec l'amplitude : +2 % à 30°, +18 % à 90°, et elle diverge quand \(\theta_0\) approche 180°.</figcaption>
</figure>
  <ul>
    <li><strong>Non-isochronisme.</strong> Pour le pendule, le rappel \(-\omega_0^2\sin\theta\) est plus faible que \(-\omega_0^2\theta\) : la période augmente avec l'amplitude, de 0,2 % à 10°, 2 % à 30°, 18 % à 90°, 76 % à 150°, et tend vers l'infini près de 180°. Un ressort qui durcit (rappel plus fort que \(-kx\)) a au contraire une période qui diminue.</li>
    <li><strong>Forme non sinusoïdale.</strong> Lâché à 120°, le pendule s'attarde aux élongations extrêmes ; son mouvement contient, en plus de la fréquence fondamentale, un harmonique de rang 3 (3 % du fondamental) : un système non linéaire crée des fréquences nouvelles, ce qui permet de détecter la non-linéarité sur un spectre.</li>
    <li><strong>Validité.</strong> L'approximation linéaire donne la période à mieux de 1 % jusqu'à une amplitude de 23° environ.</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — une horloge qui retarde</strong>
    <p>Une horloge à balancier est réglée pour des oscillations de 4° d'amplitude. Si l'amplitude passe à 6° (balancier mal entretenu), la période augmente de \(\dfrac{\theta_0^2}{16}\) en valeur relative (approximation des amplitudes modérées, voir « Pour aller plus loin »), soit de \(\dfrac{(0{,}105)^2-(0{,}070)^2}{16}\approx3{,}8\times10^{-4}\) : l'horloge retarde d'environ 33 s par jour. Les horlogers recherchent une amplitude constante, et le pendule cycloïdal de Huygens a été inventé pour échapper à ce défaut.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(T_0=2\pi\sqrt{\ell/g}\) à un pendule lâché à 60° ou 90° : l'erreur est de 7 % ou 18 %. L'isochronisme est une propriété du modèle linéaire, pas du pendule.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Période exacte, frottement solide, oscillateurs couplés</h2>
  <div class="intro">Trois prolongements, utiles pour comprendre et parfois rencontrés en problème, mais non exigibles en PTSI.</div>
  <p><strong>Période du pendule aux grandes amplitudes.</strong> La conservation de l'énergie donne une période exacte sous forme d'intégrale (une intégrale elliptique) ; pour des amplitudes modérées, la <strong>formule de Borda</strong> \(T\approx T_0\left(1+\dfrac{\theta_0^2}{16}\right)\) (\(\theta_0\) en radians) suffit : elle est juste à 0,5 % près jusqu'à 60°.</p>
  <p><strong>Frottement solide.</strong> Si l'amortissement vient d'un frottement solide de norme constante \(F_f\) (masse qui glisse sur une table), l'amplitude ne décroît pas exponentiellement mais <strong>linéairement</strong>, de \(4F_f/k\) par période, et le mouvement s'arrête au bout d'un nombre fini d'oscillations, pas forcément à la position d'équilibre du ressort.</p>
  <p><strong>Oscillateurs couplés.</strong> Deux pendules reliés par un ressort faible échangent périodiquement leur énergie : lancé seul, le premier transmet peu à peu son mouvement au second, puis le récupère (battements). Le mouvement est la superposition de deux modes propres, en phase et en opposition de phase.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · OSCILLATEURS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles de la partie 1.4 du programme, côté mécanique : reconnaître et résoudre l'équation d'un oscillateur harmonique, l'établir par l'énergie, identifier \(\omega_0\) et \(Q\), déterminer la réponse libre ou à un échelon, exploiter un relevé, transposer au circuit RLC, traiter le régime forcé et lire une courbe de résonance. Notations : \(\omega_0\), \(Q\), \(\tau=2Q/\omega_0\), pseudo-pulsation \(\omega_p\).</div>

  <div class="method-box"><strong>Méthode 1 — Reconnaître un oscillateur harmonique et identifier sa pulsation propre</strong>
    <ol>
      <li><span class="step">Variable.</span> Choisir une coordonnée qui repère l'écart (allongement, angle) et un axe orienté.</li>
      <li><span class="step">Équation.</span> Principe fondamental projeté sur l'axe du mouvement (ou méthode 3).</li>
      <li><span class="step">Forme.</span> Diviser par le coefficient de \(\ddot x\) : \(\ddot x+a\,x=b\). Si \(a\gt0\), oscillateur harmonique de pulsation \(\omega_0=\sqrt a\) autour de \(x_e=b/a\) ; si \(a\lt0\), équilibre instable.</li>
      <li><span class="step">Contrôle.</span> Dimension de \(\omega_0\) (\(\text{s}^{-1}\)) et ordre de grandeur de \(T_0=2\pi/\omega_0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une masse de 0,40 kg entre deux ressorts de raideurs 30 et \(50\ \text{N·m}^{-1}\), accrochés à deux murs opposés. Un écart \(x\) allonge l'un et raccourcit l'autre de \(x\) : \(m\ddot x=-(k_1+k_2)x\), \(\omega_0=\sqrt{80/0{,}40}\approx14{,}1\ \text{rad·s}^{-1}\), \(T_0\approx0{,}44\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Déterminer x(t) à partir des conditions initiales</strong>
    <ol>
      <li><span class="step">Forme générale.</span> \(x=A\cos\omega_0t+B\sin\omega_0t\) (plus solution particulière s'il y a un second membre).</li>
      <li><span class="step">Constantes.</span> \(x(0)=x_0\) donne \(A\) ; \(\dot x(0)=v_0\) donne \(B=v_0/\omega_0\).</li>
      <li><span class="step">Amplitude et phase</span> si demandées : \(X_m=\sqrt{A^2+B^2}\), \(\cos\varphi=A/X_m\), \(\sin\varphi=-B/X_m\) ; conclure avec les deux signes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\omega_0=10\ \text{rad·s}^{-1}\), masse lancée depuis l'équilibre à \(v_0=-0{,}50\ \text{m·s}^{-1}\) : \(A=0\), \(B=-5{,}0\ \text{cm}\), \(x=-5{,}0\sin(10t)\) (cm), soit \(X_m=5{,}0\ \text{cm}\) et \(\varphi=+\pi/2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\varphi=\arctan(-v_0/(\omega_0x_0))\) se trompe de \(\pi\) dès que \(x_0\lt0\), et n'est pas défini pour \(x_0=0\). Utiliser les signes de \(\cos\varphi\) et \(\sin\varphi\).</div>

  <div class="method-box"><strong>Méthode 3 — Établir l'équation du mouvement par l'énergie</strong>
    <ol>
      <li><span class="step">Conditions.</span> Un seul degré de liberté, pas de frottement (sinon méthode 4 avec \(\mathrm{d}E_m/\mathrm{d}t=-\alpha\dot x^2\)).</li>
      <li><span class="step">Énergies.</span> Écrire \(E_c\) et \(E_p\) en fonction de la coordonnée et de sa dérivée.</li>
      <li><span class="step">Dériver.</span> \(\mathrm{d}E_m/\mathrm{d}t=0\), factoriser par \(\dot x\) (non nul en général) : c'est l'équation du mouvement.</li>
      <li><span class="step">Linéariser</span> si besoin autour de l'équilibre stable (chapitre « Énergie mécanique », §8).</li>
    </ol>
    <p><em>Exemple éclair :</em> un liquide oscille dans un tube en U de section constante ; la colonne a une longueur totale \(L=0{,}50\ \text{m}\). Si le niveau monte de \(x\) d'un côté, il descend de \(x\) de l'autre : \(E_c=\tfrac12\rho SL\dot x^2\), \(E_p=\rho Sg\,x^2\) (une tranche de hauteur \(x\) montée de \(x\)). En dérivant : \(\ddot x+\dfrac{2g}Lx=0\), \(\omega_0=\sqrt{2g/L}\approx6{,}3\ \text{rad·s}^{-1}\), \(T_0\approx1{,}0\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Mettre sous forme canonique et identifier ω₀, Q et τ</strong>
    <ol>
      <li><span class="step">Équation.</span> \(m\ddot x+\alpha\dot x+kx=F(t)\), puis diviser par \(m\).</li>
      <li><span class="step">Identifier.</span> \(\omega_0^2\) = coefficient de \(x\) ; \(\omega_0/Q\) = coefficient de \(\dot x\) ; d'où \(Q\), puis \(\tau=2Q/\omega_0\).</li>
      <li><span class="step">Contrôles.</span> \(Q\) sans dimension ; \(Q\) diminue quand \(\alpha\) augmente ; \(\tau=2m/\alpha\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(0{,}50\,\ddot x+2{,}0\,\dot x+200\,x=0\) devient \(\ddot x+4{,}0\,\dot x+400\,x=0\) : \(\omega_0=20\ \text{rad·s}^{-1}\), \(Q=20/4{,}0=5{,}0\), \(\tau=0{,}50\ \text{s}\) (\(=2m/\alpha\)).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Déterminer le régime et la réponse détaillée en régime libre</strong>
    <ol>
      <li><span class="step">Polynôme caractéristique</span> \(r^2+\dfrac{\omega_0}Qr+\omega_0^2=0\) : comparer \(Q\) à \(1/2\).</li>
      <li><span class="step">Forme de la solution.</span> \(Q\gt\tfrac12\) : \(e^{-t/\tau}(A\cos\omega_pt+B\sin\omega_pt)\) ; \(Q=\tfrac12\) : \((A+Bt)e^{-\omega_0t}\) ; \(Q\lt\tfrac12\) : \(Ae^{r_1t}+Be^{r_2t}\).</li>
      <li><span class="step">Constantes</span> par \(x(0)\) et \(\dot x(0)\) (attention à la dérivée du facteur \(e^{-t/\tau}\)).</li>
      <li><span class="step">Contrôles.</span> \(x(0)\), \(\dot x(0)\), limite nulle.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\ddot x+5\dot x+4x=0\) : \(\omega_0=2\ \text{rad·s}^{-1}\), \(Q=0{,}4\lt\tfrac12\), racines \(-1\) et \(-4\). Lâché sans vitesse depuis \(x_0\) : \(x=\dfrac{x_0}3\left(4e^{-t}-e^{-4t}\right)\) ; la racine lente (\(-1\)) fixe la durée du retour.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Réponse à un échelon de force</strong>
    <ol>
      <li><span class="step">Solution particulière.</span> Constante : la nouvelle position d'équilibre \(x_\infty=F_0/k\).</li>
      <li><span class="step">Solution générale.</span> \(x=x_\infty+\) solution homogène (méthode 5).</li>
      <li><span class="step">Conditions initiales</span> appliquées à la solution <strong>complète</strong> : position et vitesse continues en \(t=0\).</li>
      <li><span class="step">Dépassement</span> (pseudo-périodique) : premier maximum \(x_\infty\left(1+e^{-\pi/\sqrt{4Q^2-1}}\right)\) pour un départ au repos en 0.</li>
    </ol>
    <p><em>Exemple éclair :</em> une force de 2,0 N est appliquée brusquement à une masse au repos, ressort de \(400\ \text{N·m}^{-1}\), \(Q=5\) : \(x_\infty=5{,}0\ \text{mm}\), premier maximum \(5{,}0\times1{,}73\approx8{,}6\ \text{mm}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Exploiter un relevé expérimental en régime libre</strong>
    <ol>
      <li><span class="step">Régime.</span> Oscillations : pseudo-périodique ; sinon apériodique ou critique.</li>
      <li><span class="step">Pseudo-période.</span> Mesurer \(n\) pseudo-périodes d'un coup : \(T_p\), puis \(\omega_p=2\pi/T_p\approx\omega_0\) si \(Q\gtrsim3\).</li>
      <li><span class="step">Décrément.</span> \(\delta=\dfrac1n\ln\dfrac{x(t)}{x(t+nT_p)}\), puis \(Q\approx\pi/\delta\) (ou la formule exacte), \(\tau=T_p/\delta\).</li>
      <li><span class="step">Vérifier</span> en comptant les oscillations visibles (environ \(Q\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> 10 pseudo-périodes en 6,0 s, l'amplitude passe de 30 mm à 12 mm : \(T_p=0{,}60\ \text{s}\), \(\delta=\ln(30/12)/10\approx0{,}092\), \(Q\approx34\), \(\tau\approx6{,}5\ \text{s}\), \(\omega_0\approx10{,}5\ \text{rad·s}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : mesurer le décrément sur deux maximums consécutifs quand l'amortissement est faible : l'écart, petit, est noyé dans l'incertitude de lecture. On mesure sur plusieurs pseudo-périodes et l'on divise par leur nombre.</div>

  <div class="method-box"><strong>Méthode 8 — Utiliser l'analogie électromécanique</strong>
    <ol>
      <li><span class="step">Écrire les deux équations</span> \(m\ddot x+\alpha\dot x+kx=F\) et \(L\ddot q+R\dot q+q/C=e\).</li>
      <li><span class="step">Dictionnaire.</span> \(x\leftrightarrow q\), \(\dot x\leftrightarrow i\), \(m\leftrightarrow L\), \(\alpha\leftrightarrow R\), \(k\leftrightarrow1/C\), \(F\leftrightarrow e\).</li>
      <li><span class="step">Transposer</span> le résultat connu (\(\omega_0\), \(Q\), régimes, résonances, énergies), sans refaire le calcul.</li>
    </ol>
    <p><em>Exemple éclair :</em> le circuit \(R=100\ \text{Ω}\), \(L=0{,}10\ \text{H}\), \(C=10\ \text{µF}\) (\(\omega_0=1\,000\ \text{rad·s}^{-1}\), \(Q=1\)) a pour jumeau mécanique \(m=0{,}10\ \text{kg}\), \(k=1{,}0\times10^5\ \text{N·m}^{-1}\), \(\alpha=100\ \text{kg·s}^{-1}\) : mêmes \(\omega_0\) et \(Q\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Étudier le régime sinusoïdal forcé en complexes</strong>
    <ol>
      <li><span class="step">Associer</span> \(\underline x=\underline X_me^{j\omega t}\) ; dériver = multiplier par \(j\omega\).</li>
      <li><span class="step">Amplitude complexe.</span> \(\underline X_m=\dfrac{F_m/k}{1-u^2+ju/Q}\) avec \(u=\omega/\omega_0\) ; pour la vitesse, \(\underline V_m=j\omega\underline X_m\).</li>
      <li><span class="step">Module et argument.</span> \(X_m=|\underline X_m|\), \(\varphi=\arg\underline X_m\in[-\pi,0]\) (attention au quadrant quand \(u\gt1\)).</li>
      <li><span class="step">Limites.</span> Vérifier \(u\to0\) (\(F_m/k\), en phase) et \(u\to\infty\) (\(F_m/(m\omega^2)\), opposition).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(m=0{,}20\ \text{kg}\), \(k=80\ \text{N·m}^{-1}\), \(\alpha=0{,}80\ \text{kg·s}^{-1}\) (\(\omega_0=20\ \text{rad·s}^{-1}\), \(Q=5\)), \(F_m=0{,}40\ \text{N}\) à \(\omega=16\ \text{rad·s}^{-1}\) : \(u=0{,}8\), \(\underline X_m=\dfrac{5{,}0\ \text{mm}}{0{,}36+0{,}16j}\), \(X_m\approx12{,}7\ \text{mm}\), \(\varphi\approx-24^\circ\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Déterminer ω₀ et Q sur une courbe de résonance</strong>
    <ol>
      <li><span class="step">\(\omega_0\) par la phase</span> : pulsation où l'élongation est en retard de \(\pi/2\) sur l'excitation (vrai pour tout \(Q\)).</li>
      <li><span class="step">\(\omega_0\) et \(Q\) par la vitesse</span> : maximum en \(\omega_0\) ; pulsations où \(V_m=V_{\max}/\sqrt2\) : \(Q=\omega_0/\Delta\omega\).</li>
      <li><span class="step">Par l'élongation</span> (\(Q\gg1\)) : \(Q\approx X_m(\omega_0)/X_m(0)\) ; maximum un peu avant \(\omega_0\), et seulement si \(Q\gt1/\sqrt2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> phase de l'élongation \(-90^\circ\) à 50 Hz, amplitude de la vitesse réduite d'un facteur \(\sqrt2\) à 48 Hz et 52 Hz : \(f_0=50\ \text{Hz}\), \(Q=50/4=12{,}5\) ; on doit aussi trouver \(X_m(f_0)\approx12{,}5\,X_m(0)\).</p>
  </div>
  <div class="notice"><strong>Pièges classiques du chapitre</strong> : écrire \(Q=\alpha/(m\omega_0)\) à l'envers ; prendre une enveloppe en \(e^{-t/(2\tau)}\) ou \(\tau=m/\alpha\) (ici \(\tau=2Q/\omega_0=2m/\alpha\)) ; confondre \(\omega_0\), \(\omega_p\) (régime libre) et \(\omega\) (excitation) ; affirmer que la résonance en élongation a lieu à \(\omega_0\) pour tout \(Q\) ; oublier la solution particulière avant d'appliquer les conditions initiales ; appliquer \(T_0=2\pi\sqrt{\ell/g}\) aux grandes amplitudes.</div>
</div>
</template>

  <h3>Masse-ressort horizontal</h3>

  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle du mouvement.</div>
  <div class="q"><strong>Q2.</strong> Calculer la pulsation propre \(\omega_0\), la fréquence \(f_0\) et la période \(T_0\).</div>
  <div class="q"><strong>Q3.</strong> Donner \(x(t)\).</div>
  <div class="q"><strong>Q4.</strong> Calculer la vitesse maximale et l'accélération maximale. Où sont-elles atteintes ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Poids et réaction se compensent ; projection du principe fondamental sur l'axe : \(m\ddot x=-kx\), soit \(\ddot x+\dfrac km\,x=0\).</p>
    <p><strong>Q2.</strong> \(\omega_0=\sqrt{k/m}=\sqrt{250}\approx15{,}8\ \text{rad·s}^{-1}\), \(f_0=\omega_0/(2\pi)\approx2{,}5\ \text{Hz}\), \(T_0\approx0{,}40\ \text{s}\).</p>
    <p><strong>Q3.</strong> \(x(0)=x_0\) et \(\dot x(0)=0\) : \(x(t)=x_0\cos(\omega_0t)=0{,}050\cos(15{,}8\,t)\) (m).</p>
    <p><strong>Q4.</strong> \(v_{\max}=\omega_0x_0\approx0{,}79\ \text{m·s}^{-1}\), au passage par l'équilibre ; \(a_{\max}=\omega_0^2x_0=12{,}5\ \text{m·s}^{-2}\), aux élongations extrêmes, où la force de rappel est maximale.</p>
