</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Ressort vertical</h3>
  <div class="statement">On suspend une masse \(m=300\ \text{g}\) à un ressort vertical de raideur \(k=30\ \text{N·m}^{-1}\) et de longueur à vide \(\ell_0=20\ \text{cm}\) ; \(g=9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'allongement à l'équilibre.</div>
  <div class="q"><strong>Q2.</strong> Établir l'équation du mouvement autour de cette position. Quelle est la période des petites oscillations ?</div>
  <div class="q"><strong>Q3.</strong> Comparer avec la période qu'aurait le même système à l'horizontale. Retrouver la période à partir du seul allongement statique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À l'équilibre, \(k\Delta\ell=mg\), donc \(\Delta\ell=mg/k\approx9{,}8\ \text{cm}\) ; longueur à l'équilibre : \(29{,}8\ \text{cm}\).</p>
    <p><strong>Q2.</strong> Axe vertical descendant, \(X\) écart à l'équilibre : \(m\ddot X=mg-k(\Delta\ell+X)=-kX\). \(\omega_0=\sqrt{k/m}=10\ \text{rad·s}^{-1}\), \(T_0=2\pi/\omega_0\approx0{,}63\ \text{s}\).</p>
    <p><strong>Q3.</strong> Même période : la pesanteur ne change que la position d'équilibre. Comme \(k/m=g/\Delta\ell\), \(T_0=2\pi\sqrt{\Delta\ell/g}\), soit \(2\pi\sqrt{0{,}0981/9{,}81}\approx0{,}63\ \text{s}\) : une seule mesure de longueur donne la période.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Pendule simple</h3>
  <div class="statement">Un pendule simple est constitué d'une masse ponctuelle au bout d'un fil inextensible de longueur \(\ell=80\ \text{cm}\) ; \(g=9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle en \(\theta(t)\) (on pourra utiliser la conservation de l'énergie).</div>
  <div class="q"><strong>Q2.</strong> Dans l'approximation des petits angles, donner la pulsation et la période.</div>
  <div class="q"><strong>Q3.</strong> On lâche le pendule de \(\theta_0=10^\circ\) sans vitesse. Donner \(\theta(t)\) et la vitesse angulaire maximale.</div>
  <div class="q"><strong>Q4.</strong> La période réelle à 10° vaut \(1{,}002\,T_0\). L'approximation est-elle justifiée ? Que devient-elle à 90° (\(T\approx1{,}18\,T_0\)) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La tension, perpendiculaire à la vitesse, ne travaille pas : \(E_m=\tfrac12m\ell^2\dot\theta^2+mg\ell(1-\cos\theta)\) est constante. En dérivant : \(m\ell^2\dot\theta\ddot\theta+mg\ell\sin\theta\,\dot\theta=0\), d'où \(\ddot\theta+\dfrac g\ell\sin\theta=0\) (même résultat qu'en projetant le principe fondamental sur \(\vec e_\theta\), chapitre « Principes de la dynamique », §11).</p>
    <p><strong>Q2.</strong> \(\sin\theta\approx\theta\) : \(\ddot\theta+\omega_0^2\theta=0\), \(\omega_0=\sqrt{g/\ell}\approx3{,}50\ \text{rad·s}^{-1}\), \(T_0\approx1{,}79\ \text{s}\).</p>
    <p><strong>Q3.</strong> \(\theta_0=10^\circ\approx0{,}175\ \text{rad}\) : \(\theta(t)=0{,}175\cos(3{,}50\,t)\) (rad) ; \(\dot\theta_{\max}=\theta_0\omega_0\approx0{,}61\ \text{rad·s}^{-1}\).</p>
    <p><strong>Q4.</strong> À 10°, l'écart de période est de 0,2 % : l'approximation est excellente. À 90°, elle sous-estime la période de 18 % : le pendule n'est plus un oscillateur harmonique (non-isochronisme, cours §11).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Approche énergétique</h3>
  <div class="statement">Système masse-ressort horizontal sans frottement : \(m=500\ \text{g}\), \(k=80\ \text{N·m}^{-1}\), amplitude \(X_m=4{,}0\ \text{cm}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'énergie mécanique du système.</div>
  <div class="q"><strong>Q2.</strong> En déduire la vitesse maximale, et la vérifier avec \(\omega_0\).</div>
  <div class="q"><strong>Q3.</strong> Quelle est la vitesse lorsque \(x=X_m/2\) ?</div>
  <div class="q"><strong>Q4.</strong> Quelle fraction du temps la masse passe-t-elle à plus de \(X_m/2\) de l'équilibre ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> À l'élongation maximale, la vitesse est nulle : \(E_m=\tfrac12kX_m^2=\tfrac12\times80\times0{,}040^2=64\ \text{mJ}\).</p>
    <p><strong>Q2.</strong> Au passage en \(x=0\) : \(\tfrac12mv_{\max}^2=E_m\), \(v_{\max}=\sqrt{2E_m/m}\approx0{,}51\ \text{m·s}^{-1}\). Contrôle : \(\omega_0=\sqrt{160}\approx12{,}6\ \text{rad·s}^{-1}\) et \(\omega_0X_m\approx0{,}51\ \text{m·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(\tfrac12mv^2=E_m-\tfrac12k(X_m/2)^2=\tfrac34E_m\), donc \(v=\tfrac{\sqrt3}2v_{\max}\approx0{,}44\ \text{m·s}^{-1}\).</p>
    <p><strong>Q4.</strong> \(|x|\gt X_m/2\) quand \(|\cos(\omega_0t)|\gt\tfrac12\), soit sur les intervalles où la phase est à moins de \(\pi/3\) de \(0\) ou de \(\pi\) : \(2\times2\pi/3\) sur \(2\pi\), donc deux tiers du temps. La masse s'attarde loin de l'équilibre, où elle est lente.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Oscillateur amorti — analogie RLC</h3>
  <div class="statement">Une masse \(m=200\ \text{g}\) est attachée à un ressort de raideur \(k=50\ \text{N·m}^{-1}\) et baigne dans un liquide visqueux qui exerce la force \(\vec f=-\alpha\vec v\). À \(t=0\), \(x=5{,}0\ \text{cm}\) et \(\dot x=0\).</div>
  <div class="q"><strong>Q1.</strong> Écrire l'équation du mouvement sous forme canonique. Exprimer \(\omega_0\) et \(Q\) en fonction de \(m\), \(k\), \(\alpha\).</div>
  <div class="q"><strong>Q2.</strong> Pour \(\alpha=0{,}50\ \text{kg·s}^{-1}\), calculer \(\omega_0\), \(Q\) et \(\tau\). Quel régime ?</div>
  <div class="q"><strong>Q3.</strong> Quelle valeur de \(\alpha\) faudrait-il pour atteindre le régime critique ?</div>
  <div class="q"><strong>Q4.</strong> Établir la correspondance avec un circuit RLC série.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(m\ddot x+\alpha\dot x+kx=0\), soit \(\ddot x+\dfrac\alpha m\dot x+\dfrac kmx=0\). Par identification avec \(\ddot x+\dfrac{\omega_0}Q\dot x+\omega_0^2x=0\) : \(\omega_0=\sqrt{k/m}\) et \(\omega_0/Q=\alpha/m\), donc \(Q=\dfrac{m\omega_0}\alpha=\dfrac{\sqrt{km}}\alpha\).</p>
    <p><strong>Q2.</strong> \(\omega_0\approx15{,}8\ \text{rad·s}^{-1}\), \(Q=\sqrt{10}/0{,}50\approx6{,}3\gt1/2\) : régime pseudo-périodique ; \(\tau=2m/\alpha=0{,}80\ \text{s}\), environ deux pseudo-périodes (\(T_p\approx0{,}40\ \text{s}\)).</p>
    <p><strong>Q3.</strong> \(Q=1/2\) pour \(\alpha_c=2\sqrt{km}=2\sqrt{10}\approx6{,}3\ \text{kg·s}^{-1}\), douze fois plus.</p>
    <p><strong>Q4.</strong> \(x\leftrightarrow q\) (ou \(u_C\)), \(\dot x\leftrightarrow i\), \(m\leftrightarrow L\), \(k\leftrightarrow1/C\), \(\alpha\leftrightarrow R\). On vérifie \(\omega_0=\sqrt{k/m}\leftrightarrow1/\sqrt{LC}\) et \(Q=\sqrt{km}/\alpha\leftrightarrow\dfrac1R\sqrt{L/C}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Oscillateur amorti — décroissance de l'énergie</h3>
  <div class="statement">Un point matériel de masse \(m\) est attaché à un ressort de raideur \(k\) et subit un frottement fluide \(\vec f=-\alpha\vec v\). À \(t=0\), il est lancé depuis sa position d'équilibre avec la vitesse \(v_0\). On note \(\omega_0=\sqrt{k/m}\), \(Q=m\omega_0/\alpha\gt1/2\), \(\tau=2Q/\omega_0\) et \(\omega_p=\omega_0\sqrt{1-1/(4Q^2)}\).</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation vérifiée par \(x(t)\) et donner sa solution générale.</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(x(t)\) avec les conditions initiales.</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance de la force de frottement et vérifier le théorème de la puissance mécanique en dérivant \(E_m\).</div>
  <div class="q"><strong>Q4.</strong> Pour \(Q\gg1\), montrer que l'énergie perdue en une pseudo-période vaut environ \(2\pi E_m/Q\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Principe fondamental : \(m\ddot x=-kx-\alpha\dot x\), soit \(\ddot x+\dfrac{\omega_0}Q\dot x+\omega_0^2x=0\). Régime pseudo-périodique : \(x(t)=e^{-t/\tau}\left(A\cos\omega_pt+B\sin\omega_pt\right)\).</p>
    <p><strong>Q2.</strong> \(x(0)=0\) donne \(A=0\) ; alors \(\dot x(0)=B\omega_p=v_0\). D'où \(x(t)=\dfrac{v_0}{\omega_p}\,e^{-t/\tau}\sin(\omega_pt)\).</p>
    <p><strong>Q3.</strong> \(\mathcal P(\vec f)=\vec f\cdot\vec v=-\alpha\dot x^2\leq0\). Par ailleurs \(E_m=\tfrac12m\dot x^2+\tfrac12kx^2\), donc \(\dfrac{\mathrm{d}E_m}{\mathrm{d}t}=\dot x\,(m\ddot x+kx)=\dot x\,(-\alpha\dot x)=-\alpha\dot x^2\) : c'est bien \(\mathrm{d}E_m/\mathrm{d}t=\mathcal P(\vec f)\).</p>
    <p><strong>Q4.</strong> Pour \(Q\gg1\), \(\omega_p\approx\omega_0\) et, sur une période, l'amplitude varie peu : on peut écrire \(\dot x\approx v_m\cos(\omega_0t)\) avec \(E_m=\tfrac12mv_m^2\). Énergie dissipée en une période, puisque \(\alpha/(m\omega_0)=1/Q\) :</p>
    <div class="formula">$$\alpha\int_0^{T_0}\dot x^2\,\mathrm{d}t\approx\alpha\,\frac{v_m^2}2\,T_0=\frac{\alpha E_m}m\,\frac{2\pi}{\omega_0}=\frac{2\pi E_m}Q$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Oscillateur masse-ressort : libre puis amorti</h3>
  <div class="statement">Une masse \(m=0{,}20\ \text{kg}\) est accrochée à un ressort horizontal de raideur \(k=20\ \text{N·m}^{-1}\), sur un support sans frottement. À \(t=0\), on l'écarte de \(X_0=5{,}0\ \text{cm}\) de sa position d'équilibre et on la lâche sans vitesse.</div>
  <p class="exo-part">Partie A — Régime libre non amorti</p>
  <div class="q"><strong>A1.</strong> Établir l'équation différentielle du mouvement, puis donner \(\omega_0\) et \(T_0\).</div>
  <div class="q"><strong>A2.</strong> Donner \(x(t)\). Calculer l'énergie mécanique et montrer qu'elle se conserve.</div>
  <p class="exo-part">Partie B — Amortissement fluide</p>
  <div class="q"><strong>B1.</strong> On ajoute une force de frottement fluide \(-\alpha\vec v\). Écrire la nouvelle équation et définir le facteur de qualité \(Q\). Quels régimes selon \(Q\) ?</div>
  <div class="q"><strong>B2.</strong> Pour \(\alpha=0{,}40\ \text{kg·s}^{-1}\), calculer \(Q\) et identifier le régime. De combien l'amplitude a-t-elle diminué au bout d'une pseudo-période ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(m\ddot x=-kx\), soit \(\ddot x+\omega_0^2x=0\) avec \(\omega_0=\sqrt{k/m}=10\ \text{rad·s}^{-1}\) ; \(T_0=2\pi/\omega_0\approx0{,}63\ \text{s}\).</p>
    <p><strong>A2.</strong> \(x(t)=X_0\cos(\omega_0t)\). \(E_m=\tfrac12kx^2+\tfrac12m\dot x^2=\tfrac12kX_0^2\) (car \(m\omega_0^2=k\) et \(\cos^2+\sin^2=1\)), soit \(25\ \text{mJ}\), constante : échange permanent entre \(E_c\) et \(E_p\).</p>
    <p><strong>B1.</strong> \(m\ddot x+\alpha\dot x+kx=0\), soit \(\ddot x+\dfrac{\omega_0}Q\dot x+\omega_0^2x=0\) avec \(Q=\dfrac{m\omega_0}\alpha\). \(Q\gt\tfrac12\) : pseudo-périodique ; \(Q=\tfrac12\) : critique ; \(Q\lt\tfrac12\) : apériodique.</p>
    <p><strong>B2.</strong> \(Q=\dfrac{0{,}20\times10}{0{,}40}=5{,}0\) : pseudo-périodique, avec \(\tau=2Q/\omega_0=1{,}0\ \text{s}\) et \(T_p=2\pi/\omega_p\approx0{,}63\ \text{s}\). En une pseudo-période, l'amplitude est multipliée par \(e^{-T_p/\tau}\approx0{,}53\) : elle diminue de près de moitié.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Exploiter un enregistrement du régime libre</h3>
  <div class="statement">Une masse \(m=0{,}50\ \text{kg}\) suspendue à un ressort et freinée par une palette plongée dans l'eau est écartée de son équilibre puis lâchée. Un capteur enregistre des oscillations amorties ; deux maximums successifs valent 24 mm et 15 mm et sont séparés de 0,40 s.</div>
  <div class="q"><strong>Q1.</strong> Quel est le régime ? Calculer le décrément logarithmique \(\delta\), puis le facteur de qualité \(Q\) (formule exacte, puis approchée).</div>
  <div class="q"><strong>Q2.</strong> En déduire la pulsation propre, la raideur du ressort et le coefficient de frottement \(\alpha\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\tau\) de deux façons. Au bout de combien de pseudo-périodes l'amplitude passe-t-elle sous 1 mm ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Des oscillations : régime pseudo-périodique, \(T_p=0{,}40\ \text{s}\). \(\delta=\ln(24/15)\approx0{,}47\). Formule exacte : \(\delta=2\pi/\sqrt{4Q^2-1}\), d'où \(Q=\tfrac12\sqrt{1+(2\pi/\delta)^2}\approx6{,}7\) ; approchée : \(\pi/\delta\approx6{,}7\).</p>
    <p><strong>Q2.</strong> \(\omega_p=2\pi/T_p\approx15{,}7\ \text{rad·s}^{-1}\) et \(\omega_0=\omega_p/\sqrt{1-1/(4Q^2)}\approx15{,}8\ \text{rad·s}^{-1}\). \(k=m\omega_0^2\approx124\ \text{N·m}^{-1}\) ; \(\alpha=m\omega_0/Q\approx1{,}2\ \text{kg·s}^{-1}\).</p>
    <p><strong>Q3.</strong> \(\tau=2Q/\omega_0\approx0{,}85\ \text{s}\), ou directement \(\tau=T_p/\delta=0{,}40/0{,}47\approx0{,}85\ \text{s}\). L'amplitude est multipliée par \(e^{-\delta}\) à chaque pseudo-période : sous 1 mm quand \(24\,e^{-n\delta}\lt1\), \(n\gt\ln24/\delta\approx6{,}8\) : à partir de la 7ᵉ pseudo-période, en accord avec la règle « environ \(Q\) oscillations visibles ».</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Régler l'amortissement d'une balance</h3>
  <div class="statement">Le plateau d'une balance de cuisine repose sur un ressort de raideur \(k=6\,000\ \text{N·m}^{-1}\) ; avec l'objet à peser, la masse mobile vaut \(m=1{,}5\ \text{kg}\). Un amortisseur exerce \(-\alpha\vec v\). On pose l'objet (0,50 kg) sans vitesse : tout se passe comme si l'on appliquait un échelon de force \(F_0=m_{\text{obj}}\,g\) à partir de l'ancienne position d'équilibre, au repos. On prend \(g=9{,}81\ \text{m·s}^{-2}\) et l'on suppose \(m=1{,}5\ \text{kg}\) dès \(t=0\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\omega_0\), l'enfoncement final \(x_\infty\) du plateau, et la valeur \(\alpha_c\) qui donne le régime critique.</div>
  <div class="q"><strong>Q2.</strong> Pour \(\alpha=\alpha_c\), établir \(x(t)\) (axe vers le bas, origine à l'ancien équilibre).</div>
  <div class="q"><strong>Q3.</strong> Le temps au bout duquel l'écart à \(x_\infty\) reste sous 5 % vaut \(4{,}74/\omega_0\) au régime critique, \(14{,}6/\omega_0\) pour \(Q=0{,}2\), \(29{,}0/\omega_0\) pour \(Q=5\) et \(2{,}96/\omega_0\) pour \(Q=0{,}7\). Convertir en millisecondes et conclure sur le réglage.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega_0=\sqrt{k/m}\approx63\ \text{rad·s}^{-1}\) ; \(x_\infty=F_0/k=0{,}50\times9{,}81/6\,000\approx0{,}82\ \text{mm}\) ; \(Q=\sqrt{km}/\alpha=1/2\) pour \(\alpha_c=2\sqrt{km}\approx190\ \text{kg·s}^{-1}\).</p>
    <p><strong>Q2.</strong> \(\ddot x+2\omega_0\dot x+\omega_0^2x=\omega_0^2x_\infty\) ; solution particulière \(x_\infty\), solution homogène \((A+Bt)e^{-\omega_0t}\). Avec \(x(0)=0\) et \(\dot x(0)=0\) : \(A=-x_\infty\), \(B-\omega_0A=0\), donc \(x(t)=x_\infty\left[1-(1+\omega_0t)\,e^{-\omega_0t}\right]\), qui monte sans dépassement.</p>
    <p><strong>Q3.</strong> Critique : 75 ms ; \(Q=0{,}2\) : 230 ms (le plateau s'enfonce lentement) ; \(Q=5\) : 460 ms (il oscille autour de la valeur finale, l'affichage hésite) ; \(Q=0{,}7\) : 47 ms, avec un léger dépassement (4 %, encore sous les 5 %). On règle donc l'amortissement près du régime critique, un peu en dessous (\(Q\) entre 0,5 et 0,7), comme pour les aiguilles des appareils de mesure.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Lire une courbe de résonance mesurée</h3>
  <div class="statement">Une masse suspendue à un ressort est excitée par un pot vibrant qui lui applique une force sinusoïdale d'amplitude constante. On mesure, en régime permanent, l'amplitude \(X_m\) de son élongation, son déphasage \(\varphi\) par rapport à la force et l'amplitude \(V_m\) de sa vitesse.<br>
  \(f\) (Hz) : 0,5 · 2,0 · 2,8 · 2,9 · 3,0 · 3,1 · 3,2 · 4,0<br>
  \(X_m\) (mm) : 2,06 · 3,56 · 11,5 · 14,6 · 16,0 · 13,7 · 10,4 · 2,51<br>
  \(\varphi\) (°) : −1 · −9 · −42 · −62 · −90 · −118 · −136 · −168<br>
  \(V_m\) (mm/s) : 6,5 · 45 · 202 · 265 · 302 · 267 · 210 · 63</div>
  <div class="q"><strong>Q1.</strong> Déterminer la fréquence propre \(f_0\). Justifier le choix de la grandeur utilisée.</div>
  <div class="q"><strong>Q2.</strong> Estimer \(Q\) à partir de l'élongation.</div>
  <div class="q"><strong>Q3.</strong> Estimer \(Q\) à partir de la bande passante en vitesse (interpoler linéairement). Les deux méthodes concordent-elles ?</div>
  <div class="q"><strong>Q4.</strong> Pourquoi le maximum de \(X_m\) semble-t-il à \(f_0\), alors que la résonance en élongation a lieu avant ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La phase vaut \(-90^\circ\) à 3,0 Hz : \(f_0=3{,}0\ \text{Hz}\). C'est la mesure la plus sûre, car elle ne dépend pas de \(Q\) ; le maximum de la vitesse, également à 3,0 Hz, le confirme.</p>
    <p><strong>Q2.</strong> À basse fréquence, \(X_m\to F_m/k\approx2{,}0\ \text{mm}\) (valeur à 0,5 Hz). Pour \(Q\gg1\), \(X_m(f_0)\approx QF_m/k\) : \(Q\approx16{,}0/2{,}0=8{,}0\).</p>
    <p><strong>Q3.</strong> \(V_{\max}/\sqrt2\approx213\ \text{mm/s}\). Interpolation entre 2,8 et 2,9 Hz : \(2{,}8+0{,}1\times\dfrac{213-202}{265-202}\approx2{,}82\ \text{Hz}\) ; entre 3,1 et 3,2 Hz : \(3{,}1+0{,}1\times\dfrac{267-213}{267-210}\approx3{,}19\ \text{Hz}\). \(\Delta f\approx0{,}37\ \text{Hz}\), \(Q=f_0/\Delta f\approx8{,}1\) : accord à quelques pour cent près. On contrôle aussi que la phase vaut environ \(-45^\circ\) et \(-135^\circ\) aux bornes de la bande passante.</p>
    <p><strong>Q4.</strong> Pour \(Q=8\), \(\omega_r=\omega_0\sqrt{1-1/(2Q^2)}\approx0{,}996\,\omega_0\), soit 2,99 Hz : le décalage (0,4 %) est bien plus petit que le pas des mesures.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Deux oscillateurs couplés : battements (hors programme, pour aller plus loin)</h3>
  <div class="statement">Deux oscillateurs identiques (masse \(m=1{,}0\ \text{kg}\), pulsation propre \(\omega_0=100\ \text{rad·s}^{-1}\) chacun) sont reliés par un ressort de couplage de raideur \(k_c=5{,}0\ \text{N·m}^{-1}\) ; \(x_1\) et \(x_2\) sont leurs écarts à l'équilibre. Frottements négligés.</div>
  <div class="q"><strong>Q1.</strong> Écrire les équations du mouvement.</div>
  <div class="q"><strong>Q2.</strong> Chercher des solutions avec \(x_1=x_2\) (mode symétrique) et \(x_1=-x_2\) (mode antisymétrique). Calculer leurs pulsations \(\omega_+\) et \(\omega_-\).</div>
  <div class="q"><strong>Q3.</strong> À \(t=0\), \(x_1=A\), \(x_2=0\), vitesses nulles. Montrer que l'énergie passe périodiquement d'un oscillateur à l'autre. Au bout de combien de temps le premier est-il immobile pour la première fois ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(m\ddot x_1=-m\omega_0^2x_1-k_c(x_1-x_2)\) et \(m\ddot x_2=-m\omega_0^2x_2-k_c(x_2-x_1)\).</p>
    <p><strong>Q2.</strong> Si \(x_1=x_2\), le ressort de couplage n'est jamais déformé : \(\omega_+=\omega_0=100\ \text{rad·s}^{-1}\). Si \(x_1=-x_2\), il s'allonge de \(2x_1\) : \(m\ddot x_1=-(m\omega_0^2+2k_c)x_1\), \(\omega_-=\sqrt{\omega_0^2+2k_c/m}\approx100{,}05\ \text{rad·s}^{-1}\).</p>
    <p><strong>Q3.</strong> Par superposition des deux modes :</p>
    <div class="formula">$$x_1=\tfrac A2\left[\cos\omega_+t+\cos\omega_-t\right]=A\cos\left(\frac{\Delta\omega}2t\right)\cos\left(\frac{\omega_++\omega_-}2t\right)\qquad x_2=A\sin\left(\frac{\Delta\omega}2t\right)\sin\left(\frac{\omega_++\omega_-}2t\right)$$</div>
    <p>avec \(\Delta\omega=\omega_--\omega_+\approx0{,}050\ \text{rad·s}^{-1}\). Les amplitudes lentement variables \(A|\cos(\Delta\omega t/2)|\) et \(A|\sin(\Delta\omega t/2)|\) s'échangent : le premier oscillateur est immobile pour la première fois quand \(\Delta\omega t/2=\pi/2\), soit \(t=\pi/\Delta\omega\approx63\ \text{s}\) ; toute l'énergie est alors dans le second. Il la récupère entièrement à \(t=2\pi/\Delta\omega\approx126\ \text{s}\) : ce sont des battements mécaniques.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>La suspension d'une machine à laver</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>oscillateur amorti, facteur de qualité, relevé expérimental, régime sinusoïdal forcé, résonance, bilan de puissance</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Dans un lave-linge, l'ensemble cuve et tambour (masse \(M=40\ \text{kg}\)) est suspendu au bâti par des ressorts et freiné par des amortisseurs. On n'étudie que son mouvement vertical, repéré par l'écart \(x\) à sa position d'équilibre (axe vers le haut). Les ressorts équivalent à un ressort unique de raideur \(k=2{,}5\times10^4\ \text{N·m}^{-1}\) et les amortisseurs à une force \(-\alpha\dot x\,\vec e_x\). Le bâti est fixe dans le référentiel terrestre, galiléen ; \(g=9{,}81\ \text{m·s}^{-2}\).
  </div>
  <p class="exo-part">Partie A — Oscillations libres</p>
  <div class="q"><strong>A1.</strong> De combien les ressorts sont-ils comprimés à l'équilibre ? Établir l'équation du mouvement en \(x\) et la mettre sous forme canonique.</div>
  <div class="q"><strong>A2.</strong> Calculer \(\omega_0\), la fréquence propre, et la vitesse de rotation du tambour (en tours par minute) qui lui correspond.</div>
  <p class="exo-part">Partie B — Mesure de l'amortissement</p>
  <div class="q"><strong>B1.</strong> Machine arrêtée, on enfonce la cuve puis on la lâche. Deux maximums successifs de \(x\) valent 10 mm et 2,8 mm. En déduire \(Q\), puis \(\alpha\).</div>
  <div class="q"><strong>B2.</strong> On prend désormais \(Q=2{,}5\). Combien d'oscillations observe-t-on ? Ce réglage vous paraît-il raisonnable ?</div>
  <p class="exo-part">Partie C — Le balourd en régime forcé</p>
  <div class="q"><strong>C1.</strong> Pendant l'essorage, le linge mal réparti (balourd de masse \(m_b=0{,}50\ \text{kg}\) à \(e=0{,}25\ \text{m}\) de l'axe) tourne avec le tambour à la vitesse angulaire \(\omega\). On admet qu'il exerce sur la cuve une force verticale \(F(t)=m_be\,\omega^2\cos(\omega t)\) (\(m_b\ll M\)). Établir l'amplitude complexe du régime forcé et montrer que \(X_m=\dfrac{m_be}M\,\dfrac{u^2}{\sqrt{(1-u^2)^2+u^2/Q^2}}\), avec \(u=\omega/\omega_0\).</div>
  <div class="q"><strong>C2.</strong> Calculer \(X_m\) à 240 tr/min et à 1 200 tr/min, ainsi que sa limite aux grandes vitesses. Pourquoi cette résonance n'a-t-elle pas tout à fait la forme de celle du cours ?</div>
  <div class="q"><strong>C3.</strong> La force transmise au sol par la suspension vaut \(F_T=kx+\alpha\dot x\). Calculer son amplitude à 240 tr/min et à 1 200 tr/min et la comparer à celle de la force du balourd. Conclure sur le rôle de la suspension.</div>
  <p class="exo-part">Partie D — Bilan de puissance</p>
  <div class="q"><strong>D1.</strong> Exprimer la puissance moyenne dissipée par les amortisseurs en régime forcé et la calculer à 1 200 tr/min. D'où vient cette énergie ?</div>
  <div class="q"><strong>D2.</strong> Au démarrage de l'essorage, le tambour accélère de 0 à 1 200 tr/min. Pourquoi les constructeurs cherchent-ils à traverser rapidement la zone des 240 tr/min ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> À l'équilibre, la force des ressorts compense le poids : compression \(\Delta\ell=Mg/k\approx1{,}6\ \text{cm}\). Autour de l'équilibre, le poids et la force de compression statique se compensent : \(M\ddot x=-kx-\alpha\dot x\), soit \(\ddot x+\dfrac{\omega_0}Q\dot x+\omega_0^2x=0\) avec \(\omega_0=\sqrt{k/M}\) et \(Q=\dfrac{M\omega_0}\alpha\).</p>
    <p><strong>A2.</strong> \(\omega_0=\sqrt{2{,}5\times10^4/40}=25\ \text{rad·s}^{-1}\), \(f_0\approx4{,}0\ \text{Hz}\), soit \(60f_0\approx240\) tours par minute.</p>
    <p><strong>B1.</strong> \(\delta=\ln(10/2{,}8)\approx1{,}27\) ; formule exacte : \(Q=\tfrac12\sqrt{1+(2\pi/\delta)^2}\approx2{,}5\) (l'approximation \(\pi/\delta\approx2{,}5\) est encore acceptable). \(\alpha=M\omega_0/Q\approx400\ \text{kg·s}^{-1}\).</p>
    <p><strong>B2.</strong> Deux ou trois oscillations visibles (environ \(Q\)) : l'amplitude est divisée par 3,6 à chaque pseudo-période (\(T_p\approx0{,}26\ \text{s}\)). La cuve se stabilise en \(3\tau=6Q/\omega_0\approx0{,}6\ \text{s}\) : un amortissement assez fort pour limiter la résonance, mais pas critique, pour ne pas trop transmettre les vibrations (partie C).</p>
    <p><strong>C1.</strong> En complexes : \(\left(-M\omega^2+j\alpha\omega+k\right)\underline X_m=m_be\,\omega^2\). En divisant par \(k\) et en utilisant \(k=M\omega_0^2\), \(\alpha/k=1/(Q\omega_0)\) : \(\underline X_m=\dfrac{m_be}M\,\dfrac{u^2}{1-u^2+ju/Q}\), dont le module est l'expression demandée.</p>
    <p><strong>C2.</strong> \(m_be/M\approx3{,}1\ \text{mm}\). À 240 tr/min (\(u\approx1{,}0\)) : \(X_m\approx Q\,m_be/M\approx7{,}9\ \text{mm}\). À 1 200 tr/min (\(u\approx5{,}0\)) : \(X_m\approx3{,}2\ \text{mm}\). Aux grandes vitesses, \(X_m\to m_be/M=3{,}1\ \text{mm}\) : le centre de masse de l'ensemble cuve et balourd reste presque immobile, la cuve oscille en opposition avec le linge. La force excitatrice croît comme \(\omega^2\) : l'amplitude ne tend plus vers 0 à haute fréquence, et son maximum (8,0 mm) est un peu <strong>au-dessus</strong> de \(\omega_0\) (\(u\approx1{,}04\)).</p>
    <p><strong>C3.</strong> \(\underline F_T=(k+j\alpha\omega)\,\underline X_m\). À 240 tr/min : \(|k+j\alpha\omega|\approx2{,}7\times10^4\ \text{N·m}^{-1}\), \(F_T\approx210\ \text{N}\), contre \(m_be\omega^2\approx79\ \text{N}\) : la suspension <strong>amplifie</strong> la force (facteur 2,7). À 1 200 tr/min : \(F_T\approx180\ \text{N}\), contre \(m_be\omega^2\approx1\,970\ \text{N}\) : elle transmet moins de 10 % de la force. Une suspension souple filtre les vibrations dont la fréquence est bien supérieure à \(f_0\) : c'est pourquoi on choisit \(f_0\) très inférieure à la fréquence d'essorage.</p>
    <p><strong>D1.</strong> La puissance reçue par les amortisseurs vaut \(\alpha\dot x^2\), de moyenne \(\langle\mathcal P\rangle=\tfrac12\alpha\,\omega^2X_m^2\). À 1 200 tr/min, avec \(\omega\approx125{,}7\ \text{rad·s}^{-1}\) et \(X_m\approx3{,}24\ \text{mm}\) : \(\langle\mathcal P\rangle\approx33\ \text{W}\). Cette énergie, dissipée en chaleur dans les amortisseurs, est fournie par le moteur du tambour, par l'intermédiaire de la force du balourd (en régime permanent, \(E_m\) de la cuve est en moyenne constante).</p>
    <p><strong>D2.</strong> Au voisinage de 240 tr/min, l'amplitude et surtout la force transmise au bâti sont amplifiées (C2, C3) : la machine « marche » et vibre. En traversant vite cette zone, on ne laisse pas au régime forcé le temps de s'établir (il faut quelques \(\tau\), soit quelques dixièmes de seconde) ; beaucoup de machines tentent aussi de répartir le linge à basse vitesse avant d'accélérer.</p>
  </div>
</div>
